<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Outside</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .scene {
            width: 100vw;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

          /* Sunny sky fading into grass. The glow fades to its own hue
           (alpha only) so it never mixes into a muddy color against the
           gradient underneath it. */
          .scene {
            background:
                radial-gradient(circle at 100% 0%,
                    #fff6b0 0%,
                    #ffe066 8%,
                    rgba(255, 224, 102, 0.35) 20%,
                    rgba(255, 224, 102, 0) 42%),
                linear-gradient(to bottom,
                    #2e86de 0%,
                    #57a6e8 32%,
                    #8ed1f5 52%,
                    #cdeab0 68%,
                    #7cc247 80%,
                    #4c9a2a 100%);
        }

        .card {
            width: min(92vw, 1000px);
            min-height: clamp(200px, 30vw, 380px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(18px) saturate(120%);
            -webkit-backdrop-filter: blur(18px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 60px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        /* Bohemian Script Text */
        .boho-text {
            font-family: "Brush Script MT", "Segoe Script", "Apple Chancery", cursive;
            font-size: clamp(3.5rem, 11vw, 9.5rem);
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(20, 60, 15, 0.3);
            letter-spacing: 2px;
            line-height: 1.1;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .card {
                padding: 24px 36px;
                border-radius: 40px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 18px 28px;
                border-radius: 30px;
            }

            .boho-text {
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="card">
            <h1 class="boho-text">go outside</h1>
        </div>
    </div>

</body>
</html>
