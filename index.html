<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Outside</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Day: sunny sky fading into grass. A glow fades to its own hue
           (alpha only) so it never mixes into a muddy color against the
           gradient underneath it. */
        body[data-theme="day"] .scene {
            background:
                radial-gradient(circle at 100% 0%,
                    #fff6b0 0%,
                    #ffe066 8%,
                    rgba(255, 224, 102, 0.35) 20%,
                    rgba(255, 224, 102, 0) 42%),
                linear-gradient(to bottom,
                    #2e86de 0%,
                    #57a6e8 32%,
                    #8ed1f5 52%,
                    #cdeab0 68%,
                    #7cc247 80%,
                    #4c9a2a 100%);
        }

        /* Dawn: cool night sky at top warming into a sunrise horizon.
           Stop positions (32/52/68/80) match every other theme so the
           horizon lands at the same height regardless of time of day. */
        body[data-theme="dawn"] .scene {
            background:
                radial-gradient(circle at 50% 74%,
                    #fff2c4 0%,
                    #ffcf94 10%,
                    rgba(255, 207, 148, 0.4) 24%,
                    rgba(255, 207, 148, 0) 46%),
                linear-gradient(to bottom,
                    #2b2f6b 0%,
                    #6a5a9c 32%,
                    #d98fa3 52%,
                    #f7c894 68%,
                    #8fae5c 80%,
                    #4c7a2a 100%);
        }

        /* Dusk: warm sunset low on the horizon fading up into deep purple. */
        body[data-theme="dusk"] .scene {
            background:
                radial-gradient(circle at 50% 74%,
                    #ffdca0 0%,
                    #ff9a5a 10%,
                    rgba(255, 138, 74, 0.45) 26%,
                    rgba(255, 138, 74, 0) 48%),
                linear-gradient(to bottom,
                    #1b1035 0%,
                    #4a2f6b 32%,
                    #a24f7a 52%,
                    #e8795a 68%,
                    #5c7a3d 80%,
                    #33461f 100%);
        }

        /* Night: dark sky with stars and a moon. */
        body[data-theme="night"] .scene {
            background: linear-gradient(to bottom,
                #050814 0%,
                #0a1128 32%,
                #131c3a 52%,
                #1b2740 68%,
                #142615 80%,
                #0a1509 100%);
        }

        .stars {
            position: absolute;
            inset: 0;
            display: none;
        }

        body[data-theme="night"] .stars {
            display: block;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: twinkle ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .moon {
            position: absolute;
            top: 10%;
            right: 14%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: none;
            background:
                radial-gradient(circle at 65% 35%, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 30%),
                radial-gradient(circle at 30% 65%, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 25%),
                radial-gradient(circle at 35% 35%, #ffffff 0%, #f0f0f0 45%, #d6d6d6 75%, #b8b8b8 100%);
            box-shadow: 0 0 60px 20px rgba(255, 255, 255, 0.3), 0 0 130px 40px rgba(200, 220, 255, 0.12);
        }

        body[data-theme="night"] .moon {
            display: block;
        }

        /* Glass Container Card. Sized purely from viewport (never from the
           text inside it) so the box is identical across themes whether it
           holds "go outside" or the longer "don't worry, be happy". */
        .card {
            position: relative;
            z-index: 10;
            width: min(92vw, 1000px);
            min-height: clamp(200px, 30vw, 380px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(18px) saturate(120%);
            -webkit-backdrop-filter: blur(18px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 60px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        /* Bohemian Script Text */
        .boho-text {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(3.5rem, 11vw, 9.5rem);
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(20, 60, 15, 0.3);
            letter-spacing: 2px;
            line-height: 1.1;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .card {
                padding: 24px 36px;
                border-radius: 40px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 18px 28px;
                border-radius: 30px;
            }

            .boho-text {
                letter-spacing: 1px;
            }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="stars" id="stars"></div>
        <div class="moon"></div>
        <div class="card">
            <h1 class="boho-text" id="themeText">go outside</h1>
        </div>
    </div>

    <script>
        (function () {
            function themeForHour(hour) {
                if (hour >= 5 && hour < 7) return 'dawn';
                if (hour >= 7 && hour < 18) return 'day';
                if (hour >= 18 && hour < 20) return 'dusk';
                return 'night';
            }

            function textForTheme(theme) {
                return theme === 'day' ? 'go outside' : "don't worry, be happy";
            }

            var themeText = document.getElementById('themeText');

            function applyTheme() {
                var theme = themeForHour(new Date().getHours());
                if (document.body.getAttribute('data-theme') !== theme) {
                    document.body.setAttribute('data-theme', theme);
                    themeText.textContent = textForTheme(theme);
                }
            }

            var starsContainer = document.getElementById('stars');
            var starCount = 90;
            for (var i = 0; i < starCount; i++) {
                var star = document.createElement('div');
                star.className = 'star';
                star.style.top = (Math.random() * 65) + '%';
                star.style.left = (Math.random() * 100) + '%';
                var size = (Math.random() * 2 + 1).toFixed(1);
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
                star.style.animationDuration = (2 + Math.random() * 3).toFixed(2) + 's';
                starsContainer.appendChild(star);
            }

            applyTheme();
            setInterval(applyTheme, 60000);
        })();
    </script>

</body>
</html>
