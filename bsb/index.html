<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berean Standard Bible (BSB)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Berean Standard Bible</h1>
        </header>

        <nav class="controls">
            <div class="select-group">
                <label for="book-select">Book:</label>
                <select id="book-select">
                    <option value="">Loading books...</option>
                </select>
            </div>

            <div class="select-group">
                <label for="chapter-select">Chapter:</label>
                <select id="chapter-select" disabled>
                    <option value="">Select Chapter</option>
                </select>
            </div>
        </nav>

        <main id="bible-text">
            <p class="placeholder">Select a book and chapter to begin reading.</p>
        </main>

        <footer class="navigation-buttons">
            <button id="prev-btn" disabled>&laquo; Previous</button>
            <button id="next-btn" disabled>Next &raquo;</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
