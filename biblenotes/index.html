<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Study Notes</title>
  <style>
    :root {
      /* Parchment Palette */
      --bg-primary: #f4ecd8;
      --bg-sidebar: #eadeca;
      --bg-editor: #fbf7ee;
      --border-color: #c8b99d;
      --text-main: #1c1917;
      --text-muted: #655b50;
      --accent-color: #4a3b32;
      --accent-hover: #2d231d;
      --status-saved: #2e5a27;
      --status-saving: #a35200;
      --status-error: #9b1c1c;

      /* Typewriter Font Stack */
      --font-typewriter: "Courier New", Courier, "Lucida Console", "American Typewriter", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-typewriter);
      color: var(--text-main);
      background-color: var(--bg-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    #sidebar {
      width: 280px;
      background-color: var(--bg-sidebar);
      border-right: 2px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: inset -3px 0 8px rgba(0, 0, 0, 0.03);
    }

    .sidebar-header {
      padding: 1rem;
      border-bottom: 2px solid var(--border-color);
    }

    .sidebar-header h1 {
      font-size: 1.2rem;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    #book-search {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      font-family: var(--font-typewriter);
      font-size: 0.85rem;
      background-color: var(--bg-editor);
      color: var(--text-main);
    }

    #book-search:focus {
      outline: 1px solid var(--accent-color);
    }

    .book-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }

    .testament-label {
      padding: 0.6rem 1rem 0.3rem 1rem;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      border-bottom: 1px dashed var(--border-color);
      margin-bottom: 0.25rem;
    }

    .book-item {
      padding: 0.4rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.15s ease;
    }

    .book-item:hover { background-color: rgba(0, 0, 0, 0.05); }

    .book-item.active {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-weight: bold;
      border-left: 4px solid var(--accent-color);
    }

    .empty-search {
      padding: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      font-style: italic;
    }

    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-primary);
    }

    header {
      padding: 1rem 1.5rem;
      background-color: var(--bg-sidebar);
      border-bottom: 2px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title-group {
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    .header-title-group h2 { 
      font-size: 1.4rem; 
      letter-spacing: -0.02em;
    }

    #save-status {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-saved { color: var(--status-saved); }
    .status-saving { color: var(--status-saving); }
    .status-error { color: var(--status-error); }

    .action-buttons {
      display: flex;
      gap: 0.5rem;
    }

    button {
      background-color: var(--bg-editor);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.75rem;
      border-radius: 2px;
      cursor: pointer;
      font-family: var(--font-typewriter);
      font-size: 0.8rem;
      box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.08);
      transition: all 0.15s ease;
    }

    button:hover { 
      background-color: var(--bg-primary);
      border-color: var(--accent-color);
    }

    #editor-container {
      flex: 1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    #note-editor {
      width: 100%;
      flex: 1;
      border: 1px solid var(--border-color);
      border-radius: 2px;
      padding: 1.25rem;
      font-size: 1.05rem;
      line-height: 1.7;
      font-family: var(--font-typewriter);
      color: var(--text-main);
      background-color: var(--bg-editor);
      resize: none;
      outline: none;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.02);
    }

    #note-editor:focus { 
      border-color: var(--accent-color); 
    }

    #file-input { display: none; }
  </style>
</head>
<body>

  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>Bible Notes</h1>
      <input type="text" id="book-search" placeholder="Search book..." oninput="filterBooks()">
    </div>
    <div class="book-list" id="book-list-container"></div>
  </aside>

  <main id="main-content">
    <header>
      <div class="header-title-group">
        <h2 id="current-book-title">Genesis</h2>
        <span id="save-status" class="status-saved">Saved</span>
      </div>
      <div class="action-buttons">
        <button onclick="exportSingleBook()">Export Book (.md)</button>
        <button onclick="exportAllData()">Export All (JSON)</button>
        <button onclick="triggerImport()">Import (JSON)</button>
        <input type="file" id="file-input" accept=".json" onchange="importAllData(event)">
      </div>
    </header>

    <div id="editor-container">
      <textarea 
        id="note-editor" 
        placeholder="Type your notes here..." 
        oninput="handleEditorInput()"
        onkeydown="handleKeyDown(event)"
      ></textarea>
    </div>
  </main>

  <script>
    const BIBLE_BOOKS = {
      "Old Testament": [
        "Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy", "Joshua", "Judges", "Ruth",
        "1 Samuel", "2 Samuel", "1 Kings", "2 Kings", "1 Chronicles", "2 Chronicles", "Ezra",
        "Nehemiah", "Esther", "Job", "Psalms", "Proverbs", "Ecclesiastes", "Song of Solomon",
        "Isaiah", "Jeremiah", "Lamentations", "Ezekiel", "Daniel", "Hosea", "Joel", "Amos",
        "Obadiah", "Jonah", "Micah", "Nahum", "Habakkuk", "Zephaniah", "Haggai", "Zechariah", "Malachi"
      ],
      "New Testament": [
        "Matthew", "Mark", "Luke", "John", "Acts", "Romans", "1 Corinthians", "2 Corinthians",
        "Galatians", "Ephesians", "Philippians", "Colossians", "1 Thessalonians", "2 Thessalonians",
        "1 Timothy", "2 Timothy", "Titus", "Philemon", "Hebrews", "James", "1 Peter", "2 Peter",
        "1 John", "2 John", "3 John", "Jude", "Revelation"
      ]
    };

    const STORAGE_KEY = "bible_study_notes_data";
    const LAST_BOOK_KEY = "bible_study_last_book";

    let notesData = {};
    let activeBook = "Genesis";
    let saveTimeout = null;

    window.addEventListener("DOMContentLoaded", () => {
      loadNotesFromStorage();
      
      const savedLastBook = localStorage.getItem(LAST_BOOK_KEY);
      const targetBook = (savedLastBook && getAllBookNames().includes(savedLastBook)) ? savedLastBook : "Genesis";
      
      selectBook(targetBook, false);
      renderBookList();
    });

    function getAllBookNames() {
      return [...BIBLE_BOOKS["Old Testament"], ...BIBLE_BOOKS["New Testament"]];
    }

    function loadNotesFromStorage() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          notesData = JSON.parse(raw);
        } catch (e) {
          console.error("Failed to parse notes data from storage", e);
          notesData = {};
        }
      }
    }

    function renderBookList(filterText = "") {
      const container = document.getElementById("book-list-container");
      container.innerHTML = "";

      const cleanFilter = filterText.toLowerCase().trim();
      let matchCount = 0;

      for (const [testament, books] of Object.entries(BIBLE_BOOKS)) {
        const filteredBooks = books.filter(b => b.toLowerCase().includes(cleanFilter));

        if (filteredBooks.length > 0) {
          matchCount += filteredBooks.length;
          const label = document.createElement("div");
          label.className = "testament-label";
          label.textContent = testament;
          container.appendChild(label);

          filteredBooks.forEach(book => {
            const item = document.createElement("div");
            item.className = `book-item ${book === activeBook ? "active" : ""}`;
            item.textContent = book;
            item.onclick = () => selectBook(book);
            container.appendChild(item);
          });
        }
      }

      if (matchCount === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-search";
        empty.textContent = "No matching books found";
        container.appendChild(empty);
      }
    }

    function filterBooks() {
      renderBookList(document.getElementById("book-search").value);
    }

    function selectBook(bookName, savePrevious = true) {
      if (savePrevious && saveTimeout) {
        clearTimeout(saveTimeout);
        saveCurrentNote();
      }

      activeBook = bookName;
      localStorage.setItem(LAST_BOOK_KEY, bookName);

      document.getElementById("current-book-title").textContent = bookName;
      const editor = document.getElementById("note-editor");
      
      editor.value = (notesData[bookName] && typeof notesData[bookName].content === "string") 
        ? notesData[bookName].content 
        : "";
      
      updateStatus("Saved", "status-saved");
      renderBookList(document.getElementById("book-search").value);
    }

    function handleEditorInput() {
      updateStatus("Unsaved changes...", "status-saving");
      
      if (saveTimeout) clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => { saveCurrentNote(); }, 500);
    }

    function handleKeyDown(e) {
      if (e.key === "Tab") {
        e.preventDefault();
        const editor = e.target;
        const start = editor.selectionStart;
        const end = editor.selectionEnd;

        editor.value = editor.value.substring(0, start) + "  " + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 2;
        handleEditorInput();
      }
    }

    function saveCurrentNote() {
      saveTimeout = null;
      const content = document.getElementById("note-editor").value;
      
      notesData[activeBook] = {
        content: content,
        updatedAt: new Date().toISOString()
      };

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notesData));
        updateStatus("Saved", "status-saved");
      } catch (e) {
        console.error("Storage save failed", e);
        updateStatus("Storage Full! Export JSON to save backup", "status-error");
      }
    }

    function updateStatus(text, className) {
      const statusEl = document.getElementById("save-status");
      statusEl.textContent = text;
      statusEl.className = className;
    }

    function exportSingleBook() {
      const content = document.getElementById("note-editor").value;
      if (!content.trim()) {
        alert(`No notes recorded for ${activeBook} to export.`);
        return;
      }

      const markdownContent = `# ${activeBook} - Study Notes\n\n${content}`;
      downloadFile(`${activeBook}_Notes.md`, "text/markdown", markdownContent);
    }

    function exportAllData() {
      if (saveTimeout) saveCurrentNote();

      const exportObject = {
        app: "BibleStudyNotes",
        version: "1.0",
        exportedAt: new Date().toISOString(),
        notes: notesData
      };

      const jsonStr = JSON.stringify(exportObject, null, 2);
      const dateStr = new Date().toISOString().slice(0,10);
      downloadFile(`Bible_Study_Notes_Backup_${dateStr}.json`, "application/json", jsonStr);
    }

    function triggerImport() {
      document.getElementById("file-input").click();
    }

    function importAllData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedJSON = JSON.parse(e.target.result);
          const incomingNotes = importedJSON.notes || (typeof importedJSON === "object" ? importedJSON : null);

          if (!incomingNotes) {
            alert("Invalid file format. Could not locate notes payload.");
            return;
          }

          if (confirm("Importing notes will merge with your existing notes. Continue?")) {
            for (const [book, data] of Object.entries(incomingNotes)) {
              if (data && typeof data === "object") {
                notesData[book] = {
                  content: typeof data.content === "string" ? data.content : "",
                  updatedAt: data.updatedAt || new Date().toISOString()
                };
              }
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(notesData));
            selectBook(activeBook, false);
            alert("Import successful!");
          }
        } catch (err) {
          alert("Failed to parse JSON file. Ensure the file is uncorrupted.");
        }
      };

      reader.readAsText(file);
      event.target.value = "";
    }

    function downloadFile(filename, mimeType, textContent) {
      const blob = new Blob([textContent], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    window.addEventListener("beforeunload", () => {
      if (saveTimeout) saveCurrentNote();
    });
  </script>
</body>
</html>
