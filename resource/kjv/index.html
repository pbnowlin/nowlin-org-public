<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="King James Version Bible - Read and study the Holy Scriptures">
  <title>Holy Bible (KJV)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <h1 class="site-title">Holy Bible</h1>
      <p class="site-subtitle">King James Version</p>
    </div>
    <div class="header-controls">
      <div class="controls">
        <label for="book-select" class="visually-hidden">Book</label>
        <select id="book-select" aria-label="Select book"></select>
        <label for="chapter-select" class="visually-hidden">Chapter</label>
        <select id="chapter-select" aria-label="Select chapter"></select>
      </div>
      <div class="reading-controls" aria-label="Reading display controls">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
          <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>
          <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button id="scripture-size-decrease" class="text-size-control" type="button" aria-label="Decrease scripture text size" title="Decrease scripture text size">A−</button>
        <button id="scripture-size-increase" class="text-size-control" type="button" aria-label="Increase scripture text size" title="Increase scripture text size">A+</button>
      </div>
    </div>
    
    <div class="search-container" role="search">
      <label for="search-input" class="visually-hidden">Search the Bible</label>
      <div class="search-wrapper">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="search-input" class="search-input" placeholder="Search for a word or phrase…" aria-label="Search the Bible" autocomplete="off" spellcheck="false">
        <button id="search-clear" class="search-clear" aria-label="Clear search" type="button" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="search-suggestions" class="search-suggestions" role="listbox" hidden></div>
    </div>
  </header>

  <main class="main-content">
    <nav class="chapter-nav nav-top" aria-label="Chapter navigation">
      <button id="prev-btn-top" class="nav-btn nav-btn-prev" aria-label="Previous chapter" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Previous</span>
      </button>
      <button id="next-btn-top" class="nav-btn nav-btn-next" aria-label="Next chapter" type="button">
        <span>Next</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><polyline points="9 18 15 12 9 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>

    <article id="verse-container" class="chapter-card" aria-live="polite">
      <div class="loading-state">Loading Bible...</div>
    </article>

    <section id="search-results" class="search-results" aria-live="polite" hidden>
      <div class="search-results-header">
        <h2 class="search-results-title">Search Results</h2>
        <button id="search-close" class="search-close" aria-label="Close search results" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p id="search-results-count" class="search-results-count"></p>
      <div id="search-results-list" class="search-results-list" role="list"></div>
      <button id="search-results-more" class="search-results-more" type="button" hidden></button>
    </section>

    <nav class="chapter-nav nav-bottom" aria-label="Chapter navigation">
      <button id="prev-btn-bottom" class="nav-btn nav-btn-prev" aria-label="Previous chapter" type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Previous</span>
      </button>
      <button id="next-btn-bottom" class="nav-btn nav-btn-next" aria-label="Next chapter" type="button">
        <span>Next</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><polyline points="9 18 15 12 9 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </main>

  <footer class="site-footer">
    <a href="KJB-PCE-MINION.pdf" download="KJB-PCE-MINION.pdf" class="download-link">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span>Download the full Bible (PDF)</span>
    </a>
    <p class="copyright">King James Version · Public Domain</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
