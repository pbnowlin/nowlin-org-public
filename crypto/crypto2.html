<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0b3d91" />
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Local Crypto Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --nasa-blue-900: #0b3d91;
      --nasa-blue-700: #105bd8;
      --nasa-blue-100: #e8f1ff;
      --nasa-red-600:  #fc3d21;
      --nasa-red-50:   #fff0ee;
      --nasa-green-700: #1b7a3e;
      --nasa-green-50:  #eaf8ef;
      --nasa-space-bg:  #080a0f;
      --nasa-panel-bg:  #111622;
      --nasa-gray-700:  #8c92a4;
      --nasa-gray-200:  #232b3e;
      --nasa-white:     #ffffff;
      
      --md-sys-font-sans: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      --md-sys-font-mono: 'Roboto Mono', monospace;
      --md-sys-radius-card: 12px;
      --md-sys-radius-input: 8px;
      --md-sys-radius-pill: 100px;
      --md-sys-elevation-1: 0 4px 20px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--nasa-space-bg);
      color: var(--nasa-white);
      font-family: var(--md-sys-font-sans);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--nasa-white);
      letter-spacing: 2px;
      line-height: 1;
    }

    .chip-offline {
      background-color: rgba(16, 91, 216, 0.2);
      border: 1px solid var(--nasa-blue-700);
      color: var(--nasa-blue-100);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--md-sys-radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .chip-offline::before {
      content: "";
      width: 8px;
      height: 8px;
      background-color: var(--nasa-red-600);
      border-radius: 50%;
    }

    .m3-card {
      background-color: var(--nasa-panel-bg);
      border-radius: var(--md-sys-radius-card);
      padding: 32px;
      box-shadow: var(--md-sys-elevation-1);
      border: 1px solid var(--nasa-gray-200);
    }

    .m3-segmented-control {
      display: flex;
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: var(--md-sys-radius-pill);
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--nasa-gray-200);
    }

    .m3-segmented-control button {
      flex: 1;
      background: none;
      border: none;
      padding: 10px 16px;
      font-family: var(--md-sys-font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--nasa-gray-700);
      border-radius: var(--md-sys-radius-pill);
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .m3-segmented-control button[aria-pressed="true"] {
      background-color: var(--nasa-blue-900);
      color: var(--nasa-white);
      box-shadow: 0 0 10px rgba(16, 91, 216, 0.5);
      font-weight: 700;
    }

    .m3-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .m3-field label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--nasa-gray-700);
      margin-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-toggle-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-toggle-wrap input {
      width: 100%;
      padding-right: 76px;
    }

    .btn-toggle-pw {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--nasa-blue-700);
      font-family: var(--md-sys-font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: var(--md-sys-radius-pill);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-toggle-pw:hover {
      background-color: rgba(16, 91, 216, 0.15);
    }

    textarea, input[type="password"], input[type="text"].pw-input {
      background-color: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--nasa-gray-200);
      border-radius: var(--md-sys-radius-input);
      color: var(--nasa-white);
      padding: 16px;
      font-family: var(--md-sys-font-mono);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    textarea:focus, input:focus {
      border-color: var(--nasa-blue-700);
      background-color: rgba(0, 0, 0, 0.8);
      box-shadow: 0 0 8px rgba(16, 91, 216, 0.3);
    }

    .m3-actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .m3-btn {
      font-family: var(--md-sys-font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: var(--md-sys-radius-pill);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .m3-btn-primary {
      background-color: var(--nasa-blue-900);
      color: var(--nasa-white);
      border: 1px solid var(--nasa-blue-700);
      flex: 2;
      box-shadow: var(--md-sys-elevation-1);
    }

    .m3-btn-primary:hover {
      background-color: var(--nasa-blue-700);
      box-shadow: 0 0 12px rgba(16, 91, 216, 0.6);
    }

    .m3-btn-tonal {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--nasa-gray-200);
      color: var(--nasa-gray-700);
      flex: 1;
    }

    .m3-btn-tonal:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--nasa-white);
    }

    .m3-status {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: var(--md-sys-radius-input);
      font-size: 0.875rem;
      display: none;
      font-weight: 500;
    }

    .m3-status.show { display: block; }
    .m3-status.error { background-color: var(--nasa-red-50); color: var(--nasa-red-600); border: 1px solid var(--nasa-red-600); }
    .m3-status.success { background-color: var(--nasa-green-50); color: var(--nasa-green-700); border: 1px solid var(--nasa-green-700); }

    .m3-output-card {
      display: none;
    }

    .m3-output-card.show {
      display: block;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .output-header h2 {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--nasa-white);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-footer {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--nasa-gray-700);
      font-family: var(--md-sys-font-mono);
    }
  </style>
</head>
<body>

  <main class="app-container">
    <header class="brand-header">
      <h1 class="brand-title">🇺🇸🤖</h1>
      <span class="chip-offline">Client-Side Engine</span>
    </header>

    <section class="m3-card">
      <div class="m3-segmented-control" role="group">
        <button type="button" id="tab-encrypt" aria-pressed="true">Encrypt</button>
        <button type="button" id="tab-decrypt" aria-pressed="false">Decrypt</button>
      </div>

      <div class="m3-field">
        <label for="input-data" id="input-label">Plaintext Message</label>
        <textarea id="input-data" spellcheck="false" placeholder="Enter text to encrypt..."></textarea>
      </div>

      <div class="m3-field">
        <label for="passphrase">Passphrase</label>
        <div class="input-toggle-wrap">
          <input type="password" id="passphrase" class="pw-input" autocomplete="new-password" placeholder="Minimum 12 characters" />
          <button type="button" class="btn-toggle-pw" id="toggle-passphrase" aria-label="Show passphrase">Show</button>
        </div>
      </div>

      <div class="m3-field" id="confirm-wrap">
        <label for="passphrase-confirm">Confirm Passphrase</label>
        <div class="input-toggle-wrap">
          <input type="password" id="passphrase-confirm" class="pw-input" autocomplete="new-password" placeholder="Re-enter passphrase" />
          <button type="button" class="btn-toggle-pw" id="toggle-confirm" aria-label="Show passphrase confirmation">Show</button>
        </div>
      </div>

      <div class="m3-actions">
        <button type="button" class="m3-btn m3-btn-primary" id="btn-run">Encrypt</button>
        <button type="button" class="m3-btn m3-btn-tonal" id="btn-clear">Reset</button>
      </div>

      <div class="m3-status" id="status-box"></div>
    </section>

    <section class="m3-card m3-output-card" id="output-card">
      <div class="output-header">
        <h2>Result Block</h2>
        <button type="button" class="m3-btn m3-btn-tonal" id="btn-copy">Copy Payload</button>
      </div>
      <textarea id="output-data" readonly spellcheck="false" style="width: 100%;"></textarea>
      <div class="meta-footer" id="meta-text"></div>
    </section>
  </main>

  <script id="worker-code" type="text/plain">
    self.onmessage = async function(e) {
      const { mode, passphraseBytes, text } = e.data;
      const pwArray = new Uint8Array(passphraseBytes);

      const MAGIC = new Uint8Array([0x4E, 0x57, 0x4C, 0x4E]);
      const FORMAT_VERSION = 1;
      const KDF_ITERATIONS = 600000;
      const SALT_BYTES = 16;
      const IV_BYTES = 12;
      const HEADER_BYTES = 39;
      const BEGIN_LINE = '-----BEGIN NOWLIN ENCRYPTED MESSAGE-----';
      const END_LINE = '-----END NOWLIN ENCRYPTED MESSAGE-----';

      function zeroize(buffer) {
        if (buffer && buffer.fill) buffer.fill(0);
      }

      function bytesToBase64(bytes) {
        let bin = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(bin);
      }

      function base64ToBytes(b64) {
        const bin = atob(b64.replace(/\s+/g, ''));
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      async function deriveKey(pwBytes, salt, iterations) {
        const baseKey = await self.crypto.subtle.importKey('raw', pwBytes, 'PBKDF2', false, ['deriveKey']);
        return self.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      }

      try {
        if (mode === 'encrypt') {
          const encoder = new TextEncoder();
          const ptBytes = encoder.encode(text);

          const salt = self.crypto.getRandomValues(new Uint8Array(SALT_BYTES));
          const iv = self.crypto.getRandomValues(new Uint8Array(IV_BYTES));

          const header = new Uint8Array(HEADER_BYTES);
          header.set(MAGIC, 0);
          header[4] = FORMAT_VERSION;
          header[5] = 1;
          new DataView(header.buffer).setUint32(6, KDF_ITERATIONS, false);
          header[10] = 1;
          header.set(salt, 11);
          header.set(iv, 27);

          const key = await deriveKey(pwArray, salt, KDF_ITERATIONS);
          const ctBuffer = await self.crypto.subtle.encrypt(
            { name: 'AES-GCM', iv, additionalData: header, tagLength: 128 },
            key,
            ptBytes
          );

          const ctBytes = new Uint8Array(ctBuffer);
          const finalBuffer = new Uint8Array(header.length + ctBytes.length);
          finalBuffer.set(header, 0);
          finalBuffer.set(ctBytes, header.length);

          const b64 = bytesToBase64(finalBuffer);
          const armored = `${BEGIN_LINE}\n${b64.match(/.{1,64}/g).join('\n')}\n${END_LINE}`;

          zeroize(pwArray);
          zeroize(ptBytes);

          self.postMessage({ success: true, payload: armored, meta: `AES-256-GCM · PBKDF2 (${KDF_ITERATIONS.toLocaleString()} iterations)` });
        } else {
          const cleanB64 = text.replace(BEGIN_LINE, '').replace(END_LINE, '').replace(/\s+/g, '');
          const bytes = base64ToBytes(cleanB64);
          
          if (bytes.length < HEADER_BYTES) throw new Error('Invalid payload header.');

          const header = bytes.subarray(0, HEADER_BYTES);
          const iterations = new DataView(header.buffer, header.byteOffset + 6, 4).getUint32(0, false);
          const salt = bytes.subarray(11, 27);
          const iv = bytes.subarray(27, 39);
          const ciphertext = bytes.subarray(HEADER_BYTES);

          const key = await deriveKey(pwArray, salt, iterations);
          const ptBuffer = await self.crypto.subtle.decrypt(
            { name: 'AES-GCM', iv, additionalData: header, tagLength: 128 },
            key,
            ciphertext
          );

          const decodedText = new TextDecoder('utf-8', { fatal: true }).decode(ptBuffer);

          zeroize(pwArray);

          self.postMessage({ success: true, payload: decodedText, meta: `Decrypted & Tag Verified · ${iterations.toLocaleString()} PBKDF2 iterations` });
        }
      } catch (err) {
        zeroize(pwArray);
        self.postMessage({ success: false, error: 'Execution failed. Check passphrase and payload integrity.' });
      }
    };
  </script>

  <script>
    (function() {
      'use strict';

      const $ = id => document.getElementById(id);
      let mode = 'encrypt';

      function setMode(newMode) {
        mode = newMode;
        $('tab-encrypt').setAttribute('aria-pressed', mode === 'encrypt');
        $('tab-decrypt').setAttribute('aria-pressed', mode === 'decrypt');
        $('input-label').textContent = mode === 'encrypt' ? 'Plaintext Message' : 'Encrypted Block';
        $('input-data').placeholder = mode === 'encrypt' ? 'Enter text to encrypt...' : 'Paste ASCII message block...';
        $('btn-run').textContent = mode === 'encrypt' ? 'Encrypt' : 'Decrypt';
        $('confirm-wrap').style.display = mode === 'encrypt' ? 'flex' : 'none';
        clearAll();
      }

      function clearAll() {
        $('input-data').value = '';
        $('passphrase').value = '';
        $('passphrase-confirm').value = '';
        
        resetToggle('passphrase', 'toggle-passphrase');
        resetToggle('passphrase-confirm', 'toggle-confirm');

        $('output-card').classList.remove('show');
        $('status-box').className = 'm3-status';
      }

      function resetToggle(inputId, toggleBtnId) {
        const input = $(inputId);
        const btn = $(toggleBtnId);
        input.type = 'password';
        btn.textContent = 'Show';
      }

      function setupPasswordToggle(inputId, toggleBtnId) {
        const input = $(inputId);
        const btn = $(toggleBtnId);
        btn.onclick = () => {
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          btn.textContent = isPassword ? 'Hide' : 'Show';
        };
      }

      function showStatus(text, type) {
        const box = $('status-box');
        box.textContent = text;
        box.className = `m3-status show ${type}`;
      }

      function runEngine() {
        const input = $('input-data').value;
        const pass = $('passphrase').value;
        const confirm = $('passphrase-confirm').value;

        if (!input.trim()) return showStatus('Input text is required.', 'error');
        if (pass.length < 12) return showStatus('Passphrase must be at least 12 characters.', 'error');
        if (mode === 'encrypt' && pass !== confirm) return showStatus('Passphrases do not match.', 'error');

        showStatus('Deriving encryption keys on background worker thread...', 'success');

        const pwBytes = new TextEncoder().encode(pass.normalize('NFC'));
        const blob = new Blob([$('worker-code').textContent], { type: 'text/javascript' });
        const workerUrl = URL.createObjectURL(blob);
        const worker = new Worker(workerUrl);

        URL.revokeObjectURL(workerUrl);

        worker.onmessage = function(e) {
          worker.terminate();

          if (e.data.success) {
            $('output-data').value = e.data.payload;
            $('meta-text').textContent = e.data.meta;
            $('output-card').classList.add('show');
            showStatus('Execution complete.', 'success');
          } else {
            showStatus(e.data.error, 'error');
          }
        };

        worker.postMessage({
          mode,
          passphraseBytes: pwBytes.buffer,
          text: input
        }, [pwBytes.buffer]);
      }

      $('tab-encrypt').onclick = () => setMode('encrypt');
      $('tab-decrypt').onclick = () => setMode('decrypt');
      $('btn-run').onclick = runEngine;
      $('btn-clear').onclick = clearAll;
      $('btn-copy').onclick = () => {
        navigator.clipboard.writeText($('output-data').value);
        $('btn-copy').textContent = 'Copied!';
        setTimeout(() => $('btn-copy').textContent = 'Copy Payload', 1500);
      };

      setupPasswordToggle('passphrase', 'toggle-passphrase');
      setupPasswordToggle('passphrase-confirm', 'toggle-confirm');

      window.onpagehide = clearAll;
    })();
  </script>
</body>
</html>
