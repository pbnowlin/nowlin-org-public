<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0b3d91" />
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Local Encrypted Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --nasa-blue-900: #0b3d91;
      --nasa-blue-700: #105bd8;
      --nasa-blue-100: #e8f1ff;
      --nasa-red-600:  #fc3d21;
      --nasa-red-50:   #fff0ee;
      --nasa-green-700: #1b7a3e;
      --nasa-green-50:  #eaf8ef;
      --nasa-space-bg:  #080a0f;
      --nasa-panel-bg:  #111622;
      --nasa-gray-700:  #8c92a4;
      --nasa-gray-200:  #232b3e;
      --nasa-white:     #ffffff;
      
      --md-sys-font-sans: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      --md-sys-font-mono: 'Roboto Mono', monospace;
      --md-sys-radius-card: 12px;
      --md-sys-radius-input: 8px;
      --md-sys-radius-pill: 100px;
      --md-sys-elevation-1: 0 4px 20px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--nasa-space-bg);
      color: var(--nasa-white);
      font-family: var(--md-sys-font-sans);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--nasa-white);
      letter-spacing: 2px;
      line-height: 1;
    }

    .chip-offline {
      background-color: rgba(16, 91, 216, 0.2);
      border: 1px solid var(--nasa-blue-700);
      color: var(--nasa-blue-100);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--md-sys-radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .chip-offline::before {
      content: "";
      width: 8px;
      height: 8px;
      background-color: var(--nasa-red-600);
      border-radius: 50%;
    }

    .m3-card {
      background-color: var(--nasa-panel-bg);
      border-radius: var(--md-sys-radius-card);
      padding: 32px;
      box-shadow: var(--md-sys-elevation-1);
      border: 1px solid var(--nasa-gray-200);
    }

    .m3-segmented-control {
      display: flex;
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: var(--md-sys-radius-pill);
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--nasa-gray-200);
    }

    .m3-segmented-control button {
      flex: 1;
      background: none;
      border: none;
      padding: 10px 16px;
      font-family: var(--md-sys-font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--nasa-gray-700);
      border-radius: var(--md-sys-radius-pill);
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .m3-segmented-control button[aria-pressed="true"] {
      background-color: var(--nasa-blue-900);
      color: var(--nasa-white);
      box-shadow: 0 0 10px rgba(16, 91, 216, 0.5);
      font-weight: 700;
    }

    .m3-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .m3-field label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--nasa-gray-700);
      margin-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-toggle-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-toggle-wrap input {
      width: 100%;
      padding-right: 76px;
    }

    .btn-toggle-pw {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--nasa-blue-700);
      font-family: var(--md-sys-font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: var(--md-sys-radius-pill);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-toggle-pw:hover {
      background-color: rgba(16, 91, 216, 0.15);
    }

    textarea, input[type="password"], input[type="text"].pw-input, input[type="file"] {
      background-color: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--nasa-gray-200);
      border-radius: var(--md-sys-radius-input);
      color: var(--nasa-white);
      padding: 16px;
      font-family: var(--md-sys-font-mono);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input[type="file"] {
      padding: 12px;
      cursor: pointer;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    textarea:focus, input:focus {
      border-color: var(--nasa-blue-700);
      background-color: rgba(0, 0, 0, 0.8);
      box-shadow: 0 0 8px rgba(16, 91, 216, 0.3);
    }

    .m3-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .m3-btn {
      font-family: var(--md-sys-font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 12px 20px;
      border-radius: var(--md-sys-radius-pill);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .m3-btn-primary {
      background-color: var(--nasa-blue-900);
      color: var(--nasa-white);
      border: 1px solid var(--nasa-blue-700);
      flex: 2;
      min-width: 180px;
      box-shadow: var(--md-sys-elevation-1);
    }

    .m3-btn-primary:hover {
      background-color: var(--nasa-blue-700);
      box-shadow: 0 0 12px rgba(16, 91, 216, 0.6);
    }

    .m3-btn-tonal {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--nasa-gray-200);
      color: var(--nasa-gray-700);
      flex: 1;
      min-width: 120px;
    }

    .m3-btn-tonal:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--nasa-white);
    }

    .m3-status {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: var(--md-sys-radius-input);
      font-size: 0.875rem;
      display: none;
      font-weight: 500;
    }

    .m3-status.show { display: block; }
    .m3-status.error { background-color: var(--nasa-red-50); color: var(--nasa-red-600); border: 1px solid var(--nasa-red-600); }
    .m3-status.success { background-color: var(--nasa-green-50); color: var(--nasa-green-700); border: 1px solid var(--nasa-green-700); }

    .journal-section {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .journal-section.active {
      display: flex;
    }

    .entry-history {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .entry-card {
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--nasa-gray-200);
      border-radius: var(--md-sys-radius-input);
      padding: 16px;
    }

    .entry-timestamp {
      font-family: var(--md-sys-font-mono);
      font-size: 0.75rem;
      color: var(--nasa-blue-700);
      margin-bottom: 8px;
    }

    .entry-body {
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <main class="app-container">
    <header class="brand-header">
      <h1 class="brand-title">🇺🇸🤖</h1>
      <span class="chip-offline">Encrypted Journal</span>
    </header>

    <section class="m3-card" id="auth-panel">
      <div class="m3-segmented-control" role="group">
        <button type="button" id="tab-open" aria-pressed="true">Open Existing</button>
        <button type="button" id="tab-create" aria-pressed="false">Create New</button>
      </div>

      <div class="m3-field" id="file-wrap">
        <label for="journal-file">Encrypted Journal File (.json)</label>
        <input type="file" id="journal-file" accept=".json" />
      </div>

      <div class="m3-field">
        <label for="passphrase">Master Passphrase</label>
        <div class="input-toggle-wrap">
          <input type="password" id="passphrase" class="pw-input" autocomplete="new-password" placeholder="Minimum 12 characters" />
          <button type="button" class="btn-toggle-pw" id="toggle-passphrase">Show</button>
        </div>
      </div>

      <div class="m3-field" id="confirm-wrap" style="display: none;">
        <label for="passphrase-confirm">Confirm Passphrase</label>
        <div class="input-toggle-wrap">
          <input type="password" id="passphrase-confirm" class="pw-input" autocomplete="new-password" placeholder="Re-enter passphrase" />
          <button type="button" class="btn-toggle-pw" id="toggle-confirm">Show</button>
        </div>
      </div>

      <div class="m3-actions">
        <button type="button" class="m3-btn m3-btn-primary" id="btn-auth">Open Journal</button>
        <button type="button" class="m3-btn m3-btn-tonal" id="btn-clear-auth">Reset</button>
      </div>

      <div class="m3-status" id="auth-status"></div>
    </section>

    <section class="m3-card journal-section" id="journal-panel">
      <div class="m3-field">
        <label for="new-entry">New Log Entry</label>
        <textarea id="new-entry" placeholder="Write your log entry..."></textarea>
      </div>

      <div class="m3-actions">
        <button type="button" class="m3-btn m3-btn-primary" id="btn-save-entry">Encrypt & Export File</button>
        <button type="button" class="m3-btn m3-btn-tonal" id="btn-export-txt">Export TXT</button>
        <button type="button" class="m3-btn m3-btn-tonal" id="btn-lock">Lock Session</button>
      </div>

      <div class="m3-status" id="journal-status"></div>

      <div class="m3-field" style="margin-top: 16px;">
        <label>Previous Logs</label>
        <div class="entry-history" id="history-list"></div>
      </div>
    </section>
  </main>

  <script id="worker-code" type="text/plain">
    self.onmessage = async function(e) {
      const { mode, passphraseBytes, text } = e.data;
      const pwArray = new Uint8Array(passphraseBytes);

      const MAGIC = new Uint8Array([0x4E, 0x57, 0x4C, 0x4E]);
      const FORMAT_VERSION = 1;
      const KDF_ITERATIONS = 600000;
      const SALT_BYTES = 16;
      const IV_BYTES = 12;
      const HEADER_BYTES = 39;

      function zeroize(buffer) {
        if (buffer && buffer.fill) buffer.fill(0);
      }

      function bytesToBase64(bytes) {
        let bin = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(bin);
      }

      function base64ToBytes(b64) {
        const bin = atob(b64.replace(/\s+/g, ''));
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      async function deriveKey(pwBytes, salt, iterations) {
        const baseKey = await self.crypto.subtle.importKey('raw', pwBytes, 'PBKDF2', false, ['deriveKey']);
        return self.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
      }

      try {
        if (mode === 'encrypt') {
          const encoder = new TextEncoder();
          const ptBytes = encoder.encode(text);

          const salt = self.crypto.getRandomValues(new Uint8Array(SALT_BYTES));
          const iv = self.crypto.getRandomValues(new Uint8Array(IV_BYTES));

          const header = new Uint8Array(HEADER_BYTES);
          header.set(MAGIC, 0);
          header[4] = FORMAT_VERSION;
          header[5] = 1;
          new DataView(header.buffer).setUint32(6, KDF_ITERATIONS, false);
          header[10] = 1;
          header.set(salt, 11);
          header.set(iv, 27);

          const key = await deriveKey(pwArray, salt, KDF_ITERATIONS);
          const ctBuffer = await self.crypto.subtle.encrypt(
            { name: 'AES-GCM', iv, additionalData: header, tagLength: 128 },
            key,
            ptBytes
          );

          const ctBytes = new Uint8Array(ctBuffer);
          const finalBuffer = new Uint8Array(header.length + ctBytes.length);
          finalBuffer.set(header, 0);
          finalBuffer.set(ctBytes, header.length);

          const payload = {
            version: FORMAT_VERSION,
            data: bytesToBase64(finalBuffer)
          };

          zeroize(pwArray);
          zeroize(ptBytes);

          self.postMessage({ success: true, payload: JSON.stringify(payload, null, 2) });
        } else {
          const parsed = JSON.parse(text);
          const bytes = base64ToBytes(parsed.data);

          if (bytes.length < HEADER_BYTES) throw new Error('Invalid header format.');

          const header = bytes.subarray(0, HEADER_BYTES);
          const iterations = new DataView(header.buffer, header.byteOffset + 6, 4).getUint32(0, false);
          const salt = bytes.subarray(11, 27);
          const iv = bytes.subarray(27, 39);
          const ciphertext = bytes.subarray(HEADER_BYTES);

          const key = await deriveKey(pwArray, salt, iterations);
          const ptBuffer = await self.crypto.subtle.decrypt(
            { name: 'AES-GCM', iv, additionalData: header, tagLength: 128 },
            key,
            ciphertext
          );

          const decodedText = new TextDecoder('utf-8', { fatal: true }).decode(ptBuffer);
          zeroize(pwArray);

          self.postMessage({ success: true, payload: decodedText });
        }
      } catch (err) {
        zeroize(pwArray);
        self.postMessage({ success: false, error: 'Decryption failed. Check passphrase or file.' });
      }
    };
  </script>

  <script>
    (function() {
      'use strict';

      const $ = id => document.getElementById(id);
      let mode = 'open';
      let activeEntries = [];
      let activePassphrase = '';

      function setMode(newMode) {
        mode = newMode;
        $('tab-open').setAttribute('aria-pressed', mode === 'open');
        $('tab-create').setAttribute('aria-pressed', mode === 'create');
        $('file-wrap').style.display = mode === 'open' ? 'flex' : 'none';
        $('confirm-wrap').style.display = mode === 'create' ? 'flex' : 'none';
        $('btn-auth').textContent = mode === 'open' ? 'Open Journal' : 'Create Journal';
        clearAuth();
      }

      function clearAuth() {
        $('journal-file').value = '';
        $('passphrase').value = '';
        $('passphrase-confirm').value = '';
        $('auth-status').className = 'm3-status';
      }

      function showStatus(elemId, text, type) {
        const box = $(elemId);
        box.textContent = text;
        box.className = `m3-status show ${type}`;
      }

      function setupPasswordToggle(inputId, toggleBtnId) {
        const input = $(inputId);
        const btn = $(toggleBtnId);
        btn.onclick = () => {
          const isPw = input.type === 'password';
          input.type = isPw ? 'text' : 'password';
          btn.textContent = isPw ? 'Hide' : 'Show';
        };
      }

      function runWorker(action, passphraseStr, textPayload) {
        return new Promise((resolve, reject) => {
          const pwBytes = new TextEncoder().encode(passphraseStr.normalize('NFC'));
          const blob = new Blob([$('worker-code').textContent], { type: 'text/javascript' });
          const workerUrl = URL.createObjectURL(blob);
          const worker = new Worker(workerUrl);

          URL.revokeObjectURL(workerUrl);

          worker.onmessage = function(e) {
            worker.terminate();
            if (e.data.success) {
              resolve(e.data.payload);
            } else {
              reject(new Error(e.data.error));
            }
          };

          worker.postMessage({
            mode: action,
            passphraseBytes: pwBytes.buffer,
            text: textPayload
          }, [pwBytes.buffer]);
        });
      }

      function renderHistory() {
        const container = $('history-list');
        container.innerHTML = '';
        
        if (activeEntries.length === 0) {
          container.innerHTML = '<div class="entry-card" style="color: var(--nasa-gray-700);">No entries in this journal yet.</div>';
          return;
        }

        activeEntries.forEach(entry => {
          const card = document.createElement('div');
          card.className = 'entry-card';

          const time = document.createElement('div');
          time.className = 'entry-timestamp';
          time.textContent = entry.timestamp;

          const body = document.createElement('div');
          body.className = 'entry-body';
          body.textContent = entry.text;

          card.appendChild(time);
          card.appendChild(body);
          container.appendChild(card);
        });
      }

      async function handleAuth() {
        const pass = $('passphrase').value;
        const confirm = $('passphrase-confirm').value;

        if (pass.length < 12) return showStatus('auth-status', 'Passphrase must be at least 12 characters.', 'error');

        if (mode === 'create') {
          if (pass !== confirm) return showStatus('auth-status', 'Passphrases do not match.', 'error');
          activePassphrase = pass;
          activeEntries = [];
          openJournalSession();
        } else {
          const fileInput = $('journal-file');
          if (!fileInput.files.length) return showStatus('auth-status', 'Please select a journal file to open.', 'error');

          showStatus('auth-status', 'Decrypting journal payload...', 'success');
          
          const file = fileInput.files[0];
          const rawText = await file.text();

          try {
            const decryptedString = await runWorker('decrypt', pass, rawText);
            activeEntries = JSON.parse(decryptedString);
            activePassphrase = pass;
            openJournalSession();
          } catch (err) {
            showStatus('auth-status', err.message, 'error');
          }
        }
      }

      function openJournalSession() {
        $('auth-panel').style.display = 'none';
        $('journal-panel').classList.add('active');
        showStatus('journal-status', 'Journal unlocked.', 'success');
        renderHistory();
      }

      async function handleSaveEntry() {
        const text = $('new-entry').value.trim();
        if (!text) return showStatus('journal-status', 'Cannot save an empty entry.', 'error');

        showStatus('journal-status', 'Encrypting update and building JSON file...', 'success');

        const newRecord = {
          timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC',
          text: text
        };

        // Prepend new entry to top of memory array
        activeEntries.unshift(newRecord);

        try {
          const jsonPayload = JSON.stringify(activeEntries);
          const encryptedPayload = await runWorker('encrypt', activePassphrase, jsonPayload);

          const blob = new Blob([encryptedPayload], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const dateStr = new Date().toISOString().slice(0, 10);
          a.href = url;
          a.download = `journal-${dateStr}.json`;
          a.click();
          URL.revokeObjectURL(url);

          $('new-entry').value = '';
          renderHistory();
          showStatus('journal-status', 'Entry added and encrypted file downloaded.', 'success');
        } catch (err) {
          showStatus('journal-status', 'Failed to encrypt entry.', 'error');
        }
      }

      function exportUnencryptedTxt() {
        if (activeEntries.length === 0) {
          return showStatus('journal-status', 'No log entries available to export.', 'error');
        }

        const formattedText = activeEntries.map(entry => {
          return `=== [ ${entry.timestamp} ] ===\n\n${entry.text}\n\n`;
        }).join('----------------------------------------\n\n');

        const blob = new Blob([formattedText], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        
        a.href = url;
        a.download = `journal-export-${dateStr}.txt`;
        a.click();
        
        URL.revokeObjectURL(url);
        showStatus('journal-status', 'Unencrypted TXT journal exported successfully.', 'success');
      }

      function lockSession() {
        activeEntries = [];
        activePassphrase = '';
        $('new-entry').value = '';
        $('journal-panel').classList.remove('active');
        $('auth-panel').style.display = 'block';
        clearAuth();
      }

      $('tab-open').onclick = () => setMode('open');
      $('tab-create').onclick = () => setMode('create');
      $('btn-auth').onclick = handleAuth;
      $('btn-clear-auth').onclick = clearAuth;
      $('btn-save-entry').onclick = handleSaveEntry;
      $('btn-export-txt').onclick = exportUnencryptedTxt;
      $('btn-lock').onclick = lockSession;

      setupPasswordToggle('passphrase', 'toggle-passphrase');
      setupPasswordToggle('passphrase-confirm', 'toggle-confirm');

      window.onpagehide = lockSession;
    })();
  </script>
</body>
</html>
