<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0b3d91" />
  <meta http-equiv="Content-Security-Policy" 
        content="default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>Local Encrypted Journal</title>
  <style>
    :root {
      --nasa-blue-900: #0b3d91;
      --nasa-blue-700: #105bd8;
      --nasa-blue-100: #e8f1ff;
      --nasa-red-600:  #fc3d21;
      --nasa-red-50:   #fff0ee;
      --nasa-green-700: #1b7a3e;
      --nasa-green-50:  #eaf8ef;
      --nasa-space-bg:  #080a0f;
      --nasa-panel-bg:  #111622;
      --nasa-gray-700:  #8c92a4;
      --nasa-gray-200:  #232b3e;
      --nasa-white:     #ffffff;
      
      --md-sys-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --md-sys-font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --md-sys-radius-card: 12px;
      --md-sys-radius-input: 8px;
      --md-sys-radius-pill: 100px;
      --md-sys-elevation-1: 0 4px 20px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--nasa-space-bg);
      color: var(--nasa-white);
      font-family: var(--md-sys-font-sans);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--nasa-white);
      letter-spacing: 2px;
      line-height: 1;
    }

    .chip-offline {
      background-color: rgba(16, 91, 216, 0.2);
      border: 1px solid var(--nasa-blue-700);
      color: var(--nasa-blue-100);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: var(--md-sys-radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .chip-offline::before {
      content: "";
      width: 8px;
      height: 8px;
      background-color: var(--nasa-red-600);
      border-radius: 50%;
    }

    .m3-card {
      background-color: var(--nasa-panel-bg);
      border-radius: var(--md-sys-radius-card);
      padding: 32px;
      box-shadow: var(--md-sys-elevation-1);
      border: 1px solid var(--nasa-gray-200);
    }

    .m3-segmented-control {
      display: flex;
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: var(--md-sys-radius-pill);
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--nasa-gray-200);
    }

    .m3-segmented-control button {
      flex: 1;
      background: none;
      border: none;
      padding: 10px 16px;
      font-family: var(--md-sys-font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--nasa-gray-700);
      border-radius: var(--md-sys-radius-pill);
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .m3-segmented-control button[aria-pressed="true"] {
      background-color: var(--nasa-blue-900);
      color: var(--nasa-white);
      box-shadow: 0 0 10px rgba(16, 91, 216, 0.5);
      font-weight: 700;
    }

    .m3-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .m3-field label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--nasa-gray-700);
      margin-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-toggle-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-toggle-wrap input {
      width: 100%;
      padding-right: 76px;
    }

    .btn-toggle-pw {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--nasa-blue-700);
      font-family: var(--md-sys-font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: var(--md-sys-radius-pill);
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-toggle-pw:hover {
      background-color: rgba(16, 91, 216, 0.15);
    }

    textarea, input[type="password"], input[type="text"].pw-input, input[type="file"] {
      background-color: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--nasa-gray-200);
      border-radius: var(--md-sys-radius-input);
      color: var(--nasa-white);
      padding: 16px;
      font-family: var(--md-sys-font-mono);
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input[type="file"] {
      padding: 12px;
      cursor: pointer;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    textarea:focus, input:focus {
      border-color: var(--nasa-blue-700);
      background-color: rgba(0, 0, 0, 0.8);
      box-shadow: 0 0 8px rgba(16, 91, 216, 0.3);
    }

    .m3-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .m3-btn {
      font-family: var(--md-sys-font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      padding: 12px 20px;
      border-radius: var(--md-sys-radius-pill);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .m3-btn-primary {
      background-color: var(--nasa-blue-900);
      color: var(--nasa-white);
      border: 1px solid var(--nasa-blue-700);
      flex: 2;
      min-width: 180px;
      box-shadow: var(--md-sys-elevation-1);
    }

    .m3-btn-primary:hover {
      background-color: var(--nasa-blue-700);
      box-shadow: 0 0 12px rgba(16, 91, 216, 0.6);
    }

    .m3-btn-tonal {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--nasa-gray-200);
      color: var(--nasa-gray-700);
      flex: 1;
      min-width: 120px;
    }

    .m3-btn-tonal:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--nasa-white);
    }

    .m3-status {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: var(--md-sys-radius-input);
      font-size: 0.875rem;
      display: none;
      font-weight: 500;
    }

    .m3-status.show { display: block; }
    .m3-status.error { background-color: var(--nasa-red-50); color: var(--nasa-red-600); border: 1px solid var(--nasa-red-600); }
    .m3-status.success { background-color: var(--nasa-green-50); color: var(--nasa-green-700); border: 1px solid var(--nasa-green-700); }

    .m3-status.warning { background-color: #fff8e1; color: #8a6100; border: 1px solid #d99a00; }

    .pw-strength {
      margin-top: 6px;
      font-size: 0.75rem;
      font-family: var(--md-sys-font-mono);
    }
    .pw-strength.weak { color: var(--nasa-red-600); }
    .pw-strength.ok { color: #d99a00; }
    .pw-strength.strong { color: var(--nasa-green-700); }

    .journal-section {
      display: none;
      flex-direction: column;
      gap: 20px;
    }

    .journal-section.active {
      display: flex;
    }

    .entry-history {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .entry-card {
      background-color: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--nasa-gray-200);
      border-radius: var(--md-sys-radius-input);
      padding: 16px;
    }

    .entry-timestamp {
      font-family: var(--md-sys-font-mono);
      font-size: 0.75rem;
      color: var(--nasa-blue-700);
      margin-bottom: 8px;
    }

    .entry-body {
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <main class="app-container">
    <header class="brand-header">
      <h1 class="brand-title">🇺🇸🤖</h1>
      <span class="chip-offline">Encrypted Journal</span>
    </header>

    <section class="m3-card" id="auth-panel">
      <div class="m3-segmented-control" role="group">
        <button type="button" id="tab-open" aria-pressed="true">Open Existing</button>
        <button type="button" id="tab-create" aria-pressed="false">Create New</button>
      </div>

      <div class="m3-field" id="file-wrap">
        <label for="journal-file">Encrypted Journal File (.json)</label>
        <input type="file" id="journal-file" accept=".json" />
      </div>

      <div class="m3-field">
        <label for="passphrase">Master Passphrase</label>
        <div class="input-toggle-wrap">
          <input type="password" id="passphrase" class="pw-input" autocomplete="new-password" placeholder="Minimum 12 characters" />
          <button type="button" class="btn-toggle-pw" id="toggle-passphrase">Show</button>
        </div>
        <div class="pw-strength" id="pw-strength-hint"></div>
      </div>

      <div class="m3-field" id="confirm-wrap" style="display: none;">
        <label for="passphrase-confirm">Confirm Passphrase</label>
        <div class="input-toggle-wrap">
          <input type="password" id="passphrase-confirm" class="pw-input" autocomplete="new-password" placeholder="Re-enter passphrase" />
          <button type="button" class="btn-toggle-pw" id="toggle-confirm">Show</button>
        </div>
      </div>

      <div class="m3-actions">
        <button type="button" class="m3-btn m3-btn-primary" id="btn-auth">Open Journal</button>
        <button type="button" class="m3-btn m3-btn-tonal" id="btn-clear-auth">Reset</button>
      </div>

      <div class="m3-status" id="auth-status"></div>
    </section>

    <section class="m3-card journal-section" id="journal-panel">
      <div class="m3-field">
        <label for="new-entry">New Log Entry</label>
        <textarea id="new-entry" placeholder="Write your log entry..."></textarea>
      </div>

      <div class="m3-actions">
        <button type="button" class="m3-btn m3-btn-primary" id="btn-save-entry">Encrypt & Export File</button>
        <button type="button" class="m3-btn m3-btn-tonal" id="btn-export-txt">Export TXT</button>
        <button type="button" class="m3-btn m3-btn-tonal" id="btn-lock">Lock Session</button>
      </div>

      <div class="m3-status" id="journal-status"></div>

      <div class="m3-field" style="margin-top: 16px;">
        <label>Previous Logs</label>
        <div class="entry-history" id="history-list"></div>
      </div>
    </section>
  </main>

  <script id="worker-code" type="text/plain">
    self.onmessage = async function(e) {
      const { mode, passphraseBytes, key, salt: saltIn, iterations: iterationsIn, text } = e.data;

      const MAGIC = new Uint8Array([0x4E, 0x57, 0x4C, 0x4E]);
      const FORMAT_VERSION = 1;
      const KDF_ID_PBKDF2_SHA256 = 1;
      const CIPHER_ID_AES256_GCM = 1;
      const KDF_ITERATIONS = 600000; // canonical value this app writes and requires on read
      const SALT_BYTES = 16;
      const IV_BYTES = 12;
      const HEADER_BYTES = 39;
      const GCM_TAG_BYTES = 16;

      function zeroize(buffer) {
        if (buffer && buffer.fill) buffer.fill(0);
      }

      function bytesToBase64(bytes) {
        let bin = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(bin);
      }

      function base64ToBytes(b64) {
        const bin = atob(b64.replace(/\s+/g, ''));
        const out = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      function buildHeader(salt, iv, iterations) {
        const header = new Uint8Array(HEADER_BYTES);
        header.set(MAGIC, 0);
        header[4] = FORMAT_VERSION;
        header[5] = KDF_ID_PBKDF2_SHA256;
        new DataView(header.buffer).setUint32(6, iterations, false);
        header[10] = CIPHER_ID_AES256_GCM;
        header.set(salt, 11);
        header.set(iv, 27);
        return header;
      }

      // Validates every attacker-controlled header field BEFORE any expensive
      // crypto (PBKDF2) is attempted, and rejects anything non-canonical
      // rather than silently coercing it.
      function parseAndValidateHeader(bytes) {
        if (bytes.length < HEADER_BYTES + GCM_TAG_BYTES) {
          throw new Error('Invalid journal file: too short to be valid.');
        }
        const header = bytes.subarray(0, HEADER_BYTES);

        const magicOk = header[0] === MAGIC[0] && header[1] === MAGIC[1] && header[2] === MAGIC[2] && header[3] === MAGIC[3];
        if (!magicOk) throw new Error('Not a recognized journal file (bad magic bytes).');

        if (header[4] !== FORMAT_VERSION) throw new Error('Unsupported journal format version.');
        if (header[5] !== KDF_ID_PBKDF2_SHA256) throw new Error('Unsupported key-derivation function.');
        if (header[10] !== CIPHER_ID_AES256_GCM) throw new Error('Unsupported cipher.');

        const iterations = new DataView(header.buffer, header.byteOffset + 6, 4).getUint32(0, false);
        if (iterations !== KDF_ITERATIONS) {
          throw new Error('Unsupported KDF parameters (unexpected iteration count).');
        }

        const salt = bytes.slice(11, 27);
        const iv = bytes.slice(27, 39);
        const ciphertext = bytes.slice(HEADER_BYTES);
        return { header, salt, iv, ciphertext, iterations };
      }

      async function deriveKeyFromPassphrase(pwBytes, salt, iterations) {
        const baseKey = await self.crypto.subtle.importKey('raw', pwBytes, 'PBKDF2', false, ['deriveKey']);
        return self.crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
          baseKey,
          { name: 'AES-GCM', length: 256 },
          false, // non-extractable: the raw key bytes can never be read back out
          ['encrypt', 'decrypt']
        );
      }

      try {
        if (mode === 'derive') {
          // Used for "Create New": derive a fresh non-extractable session key
          // from the passphrase. The passphrase bytes never leave this block.
          const pwArray = new Uint8Array(passphraseBytes);
          const salt = self.crypto.getRandomValues(new Uint8Array(SALT_BYTES));
          const derivedKey = await deriveKeyFromPassphrase(pwArray, salt, KDF_ITERATIONS);
          zeroize(pwArray);
          self.postMessage({ success: true, key: derivedKey, salt: salt.buffer, iterations: KDF_ITERATIONS }, [salt.buffer]);

        } else if (mode === 'decrypt') {
          // Used for "Open Existing": validate the file, derive a session key
          // from its (validated) salt/iterations, decrypt, and hand the
          // non-extractable key back so subsequent saves don't need the
          // passphrase again.
          const pwArray = new Uint8Array(passphraseBytes);
          let parsed;
          try {
            parsed = JSON.parse(text);
          } catch {
            throw new Error('Invalid journal file: not valid JSON.');
          }
          if (!parsed || parsed.version !== FORMAT_VERSION || typeof parsed.data !== 'string') {
            throw new Error('Invalid journal file: unrecognized structure.');
          }

          const bytes = base64ToBytes(parsed.data);
          const { header, salt, iv, ciphertext, iterations } = parseAndValidateHeader(bytes);

          const derivedKey = await deriveKeyFromPassphrase(pwArray, salt, iterations);
          zeroize(pwArray);

          const ptBuffer = await self.crypto.subtle.decrypt(
            { name: 'AES-GCM', iv, additionalData: header, tagLength: 128 },
            derivedKey,
            ciphertext
          );
          const decodedText = new TextDecoder('utf-8', { fatal: true }).decode(ptBuffer);

          self.postMessage(
            { success: true, payload: decodedText, key: derivedKey, salt: salt.buffer, iterations },
            [salt.buffer]
          );

        } else if (mode === 'encrypt') {
          // Used for every save. No passphrase involved at all — reuses the
          // non-extractable CryptoKey cached from derive/decrypt, so a fresh
          // PBKDF2 run isn't needed on every entry. Only the IV is fresh
          // per call, which is the property AES-GCM actually requires.
          const encoder = new TextEncoder();
          const ptBytes = encoder.encode(text);
          const salt = new Uint8Array(saltIn);
          const iv = self.crypto.getRandomValues(new Uint8Array(IV_BYTES));
          const header = buildHeader(salt, iv, iterationsIn);

          const ctBuffer = await self.crypto.subtle.encrypt(
            { name: 'AES-GCM', iv, additionalData: header, tagLength: 128 },
            key,
            ptBytes
          );

          const ctBytes = new Uint8Array(ctBuffer);
          const finalBuffer = new Uint8Array(header.length + ctBytes.length);
          finalBuffer.set(header, 0);
          finalBuffer.set(ctBytes, header.length);

          zeroize(ptBytes);

          const payload = { version: FORMAT_VERSION, data: bytesToBase64(finalBuffer) };
          self.postMessage({ success: true, payload: JSON.stringify(payload, null, 2) });

        } else {
          throw new Error('Unknown worker operation.');
        }
      } catch (err) {
        if (passphraseBytes) zeroize(new Uint8Array(passphraseBytes));
        self.postMessage({ success: false, error: err && err.message ? err.message : 'Operation failed. Check passphrase or file.' });
      }
    };
  </script>

  <script>
    (function() {
      'use strict';

      const $ = id => document.getElementById(id);
      let mode = 'open';
      let activeEntries = [];

      // We no longer retain the passphrase itself for the session. Instead we
      // keep a non-extractable CryptoKey (its raw bytes can never be read back
      // out via the Web Crypto API) plus the non-secret salt/iterations used
      // to derive it, so future saves can encrypt without touching the
      // passphrase again.
      let activeKey = null;
      let activeSalt = null;
      let activeIterations = null;

      // ---- Passphrase strength checking ----
      // Small blocklist of extremely common passwords/patterns. Not exhaustive —
      // this is a basic guardrail, not a replacement for a full dictionary check.
      const COMMON_PASSWORDS = [
        'password', 'passw0rd', 'letmein', 'qwerty', 'iloveyou',
        '123456789012', 'abcdefghijkl', 'admin1234567', 'welcome1234',
        'trustno1trustno1', 'changeme1234'
      ];

      function isSequentialOrRepeated(pw) {
        // Flags strings that are a single repeated character, or a simple
        // ascending/descending run (e.g. "abcdefghijkl", "123456789012").
        if (/^(.)\1+$/.test(pw)) return true;

        const lower = pw.toLowerCase();
        let ascending = true;
        let descending = true;
        for (let i = 1; i < lower.length; i++) {
          const diff = lower.charCodeAt(i) - lower.charCodeAt(i - 1);
          if (diff !== 1) ascending = false;
          if (diff !== -1) descending = false;
        }
        return ascending || descending;
      }

      function estimatePassphraseStrength(pw) {
        // Returns { level: 'weak'|'ok'|'strong', message: string }
        if (pw.length < 12) {
          return { level: 'weak', message: 'Too short — minimum 12 characters.' };
        }

        const lower = pw.toLowerCase();
        if (COMMON_PASSWORDS.some(bad => lower.includes(bad))) {
          return { level: 'weak', message: 'Contains a very common password pattern — choose something less guessable.' };
        }

        if (isSequentialOrRepeated(pw)) {
          return { level: 'weak', message: 'Repeated or sequential characters are easy to guess.' };
        }

        // Rough character-class variety check as a proxy for entropy.
        let classes = 0;
        if (/[a-z]/.test(pw)) classes++;
        if (/[A-Z]/.test(pw)) classes++;
        if (/[0-9]/.test(pw)) classes++;
        if (/[^a-zA-Z0-9]/.test(pw)) classes++;

        const uniqueChars = new Set(pw).size;

        if (pw.length >= 20 && uniqueChars >= 8) {
          return { level: 'strong', message: 'Strong passphrase.' };
        }
        if (classes >= 3 && uniqueChars >= 8) {
          return { level: 'strong', message: 'Strong passphrase.' };
        }
        if (pw.length >= 16 || (classes >= 2 && uniqueChars >= 6)) {
          return { level: 'ok', message: 'Acceptable, but a longer passphrase or passphrase of random words would be stronger.' };
        }

        return { level: 'weak', message: 'Weak — mix more character types, use more unique characters, or make it longer.' };
      }

      function updateStrengthHint() {
        const pw = $('passphrase').value;
        const hint = $('pw-strength-hint');
        if (!pw) {
          hint.textContent = '';
          hint.className = 'pw-strength';
          return;
        }
        const result = estimatePassphraseStrength(pw);
        hint.textContent = result.message;
        hint.className = `pw-strength ${result.level}`;
      }

      function setMode(newMode) {
        mode = newMode;
        $('tab-open').setAttribute('aria-pressed', mode === 'open');
        $('tab-create').setAttribute('aria-pressed', mode === 'create');
        $('file-wrap').style.display = mode === 'open' ? 'flex' : 'none';
        $('confirm-wrap').style.display = mode === 'create' ? 'flex' : 'none';
        $('btn-auth').textContent = mode === 'open' ? 'Open Journal' : 'Create Journal';
        clearAuth();
      }

      function clearAuth() {
        $('journal-file').value = '';
        $('passphrase').value = '';
        $('passphrase-confirm').value = '';
        $('auth-status').className = 'm3-status';
        updateStrengthHint();
      }

      function showStatus(elemId, text, type) {
        const box = $(elemId);
        box.textContent = text;
        box.className = `m3-status show ${type}`;
      }

      function setupPasswordToggle(inputId, toggleBtnId) {
        const input = $(inputId);
        const btn = $(toggleBtnId);
        btn.onclick = () => {
          const isPw = input.type === 'password';
          input.type = isPw ? 'text' : 'password';
          btn.textContent = isPw ? 'Hide' : 'Show';
        };
      }

      // Low-level: spins up a worker, posts one message, resolves with the
      // full response object (not just `.payload`) so callers can also get
      // back a derived key/salt/iterations when relevant.
      function postToWorker(message, transfer) {
        return new Promise((resolve, reject) => {
          const blob = new Blob([$('worker-code').textContent], { type: 'text/javascript' });
          const workerUrl = URL.createObjectURL(blob);
          const worker = new Worker(workerUrl);
          URL.revokeObjectURL(workerUrl);

          worker.onmessage = function(e) {
            worker.terminate();
            if (e.data.success) {
              resolve(e.data);
            } else {
              reject(new Error(e.data.error));
            }
          };
          worker.onerror = function(err) {
            worker.terminate();
            reject(new Error('Worker error: ' + (err && err.message ? err.message : 'unknown')));
          };

          worker.postMessage(message, transfer || []);
        });
      }

      // Derives a brand-new session key from a passphrase (used for "Create New").
      async function workerDeriveKey(passphraseStr) {
        const pwBytes = new TextEncoder().encode(passphraseStr.normalize('NFC'));
        const result = await postToWorker({ mode: 'derive', passphraseBytes: pwBytes.buffer }, [pwBytes.buffer]);
        return { key: result.key, salt: result.salt, iterations: result.iterations };
      }

      // Validates + decrypts a journal file and returns both the plaintext
      // and the derived key/salt/iterations for reuse on subsequent saves.
      async function workerDecryptFile(passphraseStr, fileText) {
        const pwBytes = new TextEncoder().encode(passphraseStr.normalize('NFC'));
        const result = await postToWorker({ mode: 'decrypt', passphraseBytes: pwBytes.buffer, text: fileText }, [pwBytes.buffer]);
        return { payload: result.payload, key: result.key, salt: result.salt, iterations: result.iterations };
      }

      // Encrypts using an already-derived key. No passphrase involved.
      async function workerEncrypt(key, salt, iterations, textPayload) {
        const result = await postToWorker({ mode: 'encrypt', key, salt, iterations, text: textPayload });
        return result.payload;
      }

      function renderHistory() {
        const container = $('history-list');
        container.innerHTML = '';
        
        if (activeEntries.length === 0) {
          container.innerHTML = '<div class="entry-card" style="color: var(--nasa-gray-700);">No entries in this journal yet.</div>';
          return;
        }

        activeEntries.forEach(entry => {
          const card = document.createElement('div');
          card.className = 'entry-card';

          const time = document.createElement('div');
          time.className = 'entry-timestamp';
          time.textContent = entry.timestamp;

          const body = document.createElement('div');
          body.className = 'entry-body';
          body.textContent = entry.text;

          card.appendChild(time);
          card.appendChild(body);
          container.appendChild(card);
        });
      }

      // Wipes the passphrase input fields' DOM values. This doesn't erase the
      // JS string that already existed in memory (strings are immutable in
      // JS and there's no way to guarantee that), but it does stop the DOM
      // itself from holding a live, readable copy once we no longer need it.
      function clearPassphraseFields() {
        $('passphrase').value = '';
        $('passphrase-confirm').value = '';
      }

      async function handleAuth() {
        const pass = $('passphrase').value;
        const confirm = $('passphrase-confirm').value;

        if (pass.length < 12) return showStatus('auth-status', 'Passphrase must be at least 12 characters.', 'error');

        if (mode === 'create') {
          const strength = estimatePassphraseStrength(pass);
          if (strength.level === 'weak') {
            return showStatus('auth-status', `Passphrase too weak: ${strength.message}`, 'error');
          }
          if (pass !== confirm) return showStatus('auth-status', 'Passphrases do not match.', 'error');

          showStatus('auth-status', 'Deriving encryption key...', 'success');
          try {
            const { key, salt, iterations } = await workerDeriveKey(pass);
            activeKey = key;
            activeSalt = salt;
            activeIterations = iterations;
            activeEntries = [];
            clearPassphraseFields();
            openJournalSession();
          } catch (err) {
            showStatus('auth-status', err.message, 'error');
          }
        } else {
          const fileInput = $('journal-file');
          if (!fileInput.files.length) return showStatus('auth-status', 'Please select a journal file to open.', 'error');

          showStatus('auth-status', 'Decrypting journal payload...', 'success');

          const file = fileInput.files[0];
          const rawText = await file.text();

          try {
            const { payload, key, salt, iterations } = await workerDecryptFile(pass, rawText);
            activeEntries = JSON.parse(payload);
            activeKey = key;
            activeSalt = salt;
            activeIterations = iterations;
            clearPassphraseFields();
            openJournalSession();
          } catch (err) {
            showStatus('auth-status', err.message, 'error');
          }
        }
      }

      function openJournalSession() {
        $('auth-panel').style.display = 'none';
        $('journal-panel').classList.add('active');
        showStatus('journal-status', 'Journal unlocked.', 'success');
        renderHistory();
      }

      async function handleSaveEntry() {
        const text = $('new-entry').value.trim();
        if (!text) return showStatus('journal-status', 'Cannot save an empty entry.', 'error');

        showStatus('journal-status', 'Encrypting update and building JSON file...', 'success');

        const newRecord = {
          timestamp: new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC',
          text: text
        };

        // Prepend new entry to top of memory array
        activeEntries.unshift(newRecord);

        try {
          const jsonPayload = JSON.stringify(activeEntries);
          const encryptedPayload = await workerEncrypt(activeKey, activeSalt, activeIterations, jsonPayload);

          const blob = new Blob([encryptedPayload], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const dateStr = new Date().toISOString().slice(0, 10);
          a.href = url;
          a.download = `journal-${dateStr}.json`;
          a.click();
          URL.revokeObjectURL(url);

          $('new-entry').value = '';
          renderHistory();
          showStatus('journal-status', 'Entry added and encrypted file downloaded.', 'success');
        } catch (err) {
          showStatus('journal-status', 'Failed to encrypt entry.', 'error');
        }
      }

      function exportUnencryptedTxt() {
        if (activeEntries.length === 0) {
          return showStatus('journal-status', 'No log entries available to export.', 'error');
        }

        const confirmed = window.confirm(
          'This will save your journal entries as PLAIN, UNENCRYPTED text on disk. ' +
          'Anyone with access to this file will be able to read it. Continue?'
        );
        if (!confirmed) {
          showStatus('journal-status', 'Unencrypted export cancelled.', 'warning');
          return;
        }

        const formattedText = activeEntries.map(entry => {
          return `=== [ ${entry.timestamp} ] ===\n\n${entry.text}\n\n`;
        }).join('----------------------------------------\n\n');

        const blob = new Blob([formattedText], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        
        a.href = url;
        a.download = `journal-export-${dateStr}.txt`;
        a.click();
        
        URL.revokeObjectURL(url);
        showStatus('journal-status', 'Unencrypted TXT journal exported. Store or delete it carefully.', 'warning');
      }

      function lockSession() {
        activeEntries = [];
        activeKey = null;
        activeSalt = null;
        activeIterations = null;
        $('new-entry').value = '';
        $('journal-panel').classList.remove('active');
        $('auth-panel').style.display = 'block';
        clearAuth();
      }

      $('tab-open').onclick = () => setMode('open');
      $('tab-create').onclick = () => setMode('create');
      $('btn-auth').onclick = handleAuth;
      $('btn-clear-auth').onclick = clearAuth;
      $('btn-save-entry').onclick = handleSaveEntry;
      $('btn-export-txt').onclick = exportUnencryptedTxt;
      $('btn-lock').onclick = lockSession;

      setupPasswordToggle('passphrase', 'toggle-passphrase');
      setupPasswordToggle('passphrase-confirm', 'toggle-confirm');

      $('passphrase').addEventListener('input', updateStrengthHint);

      window.onpagehide = lockSession;
    })();
  </script>
</body>
</html>
