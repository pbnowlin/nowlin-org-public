<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holy Bible</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Holy Bible</h1>
        </header>

        <nav class="controls">
            <div class="select-group">
                <label for="book-select">Book:</label>
                <select id="book-select">
                    <option value="">Loading books...</option>
                </select>
            </div>

            <div class="select-group">
                <label for="chapter-select">Chapter:</label>
                <select id="chapter-select" disabled>
                    <option value="">Select Chapter</option>
                </select>
            </div>
        </nav>

        <!-- Top Navigation Buttons -->
        <div class="navigation-buttons top-nav">
            <button class="prev-btn" disabled>&laquo; Previous</button>
            <button class="next-btn" disabled>Next &raquo;</button>
        </div>

        <main id="bible-text">
            <p class="placeholder">Select a book and chapter to begin reading.</p>
        </main>

        <!-- Bottom Navigation & Download Links -->
        <footer class="navigation-buttons bottom-nav">
            <div class="button-group">
                <button class="prev-btn" disabled>&laquo; Previous</button>
                <button class="next-btn" disabled>Next &raquo;</button>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="BSB.pdf" download="BSB.pdf">Download full Bible PDF</a>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
