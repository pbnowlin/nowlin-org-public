<TR><TD ALIGN="CENTER" BGCOLOR="#0069B3"><FONT COLOR="#FFFFFF">
<B>Exegesis</B>
</FONT></TD></TR><TR><TD ALIGN="LEFT" BGCOLOR="#FFFFFF">
<BLOCKQUOTE><p>The interpretation of text considering literary, historical, and text-relevant information. Exegesis is the art of discovering the meaning of a text as the author intended it (that is free from presumption).</p></BLOCKQUOTE>
