<TR><TD ALIGN="CENTER" BGCOLOR="#0069B3"><FONT COLOR="#FFFFFF">
<B>Secular</B>
</FONT></TD></TR><TR><TD ALIGN="LEFT" BGCOLOR="#FFFFFF">
<BLOCKQUOTE><p>Anything not of a specifically religious nature (<I>e.g.</I>, math, photography, politics, jazz, telephones, baseball, <I>&c.</I>). <I>Secular</I> should not be equated with <I>unholy</I> or <I>unrighteous</I>.</p></BLOCKQUOTE>
