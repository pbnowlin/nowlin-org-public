<B>Flood Geology</B>
</FONT></TD></TR><TR><TD ALIGN="LEFT" BGCOLOR="#FFFFFF">
<BLOCKQUOTE><p>A specific theory of geological concern stating generally that the various strata in the earth's crust are due to the intense global pressure occuring during Noah's flood (rather than by millions of years of weathering and tectonic changes).</p></BLOCKQUOTE>
