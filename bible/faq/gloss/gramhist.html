<TR><TD ALIGN="CENTER" BGCOLOR="#0069B3"><FONT COLOR="#FFFFFF">
<B>Grammatical-Historical Hermeneutic</B>
</FONT></TD></TR><TR><TD ALIGN="LEFT" BGCOLOR="#FFFFFF">
<blockquote><p>A hermeneutic by which an interpreter pays special attention to grammar, literary genre, historical circumstance, and geographical situation of a text to come to the closest understanding of the author's intent.</p></BLOCKQUOTE>
</TD></TR></TABLE></BODY></HTML>
