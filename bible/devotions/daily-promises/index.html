<script>
Dates = new Array();
Dates[1] = 31;
Dates[2] = 29;
Dates[3] = 31;
Dates[4] = 30;
Dates[5] = 31;
Dates[6] = 30;
Dates[7] = 31;
Dates[8] = 31;
Dates[9] = 30;
Dates[10] = 31;
Dates[11] = 30;
Dates[12] = 31;

function pad(padWhat,howMuch) {
  padWhat = padWhat.toString();
  padLength = padWhat.length;
  for(i=padLength;i<howMuch;i++) {
    padWhat = "0"+padWhat;
  }
  return padWhat;
}

function goToday() {
  var today = new Date();
  Month=today.getMonth()+1;
  Day=today.getDate();
  Month=pad(Month,2);
  Day=pad(Day,2);
  window.location.href=basePath+'/devotions/daily-promises/'+Month+"/"+Month+Day+".html";
	return false;
}

function goNow() {
  var When = new String(document.OC_When.date.value);
  if (When.length < 1) {
    alert("Please provide a specific date.");
	return false;
  }
  else {
		Month = parseInt(When.split("/")[0], 10);
		Day = parseInt(When.split("/")[1], 10);
		if (!Month || !Day || Month=="" || Day=="") {
		  alert("This is not a valid date");
		  return false;
		}
		else if(1 > Month || Month > 12 || 1 > Day || Day > Dates[Month]) {
		  alert("This is not a valid date");
		  return false;
		}
		else {
		  Month=pad(Month,2);
		  Day=pad(Day,2);
  		window.location.href=basePath+'/devotions/daily-promises/'+Month+"/"+Month+Day+".html";
		  return false;
		}
  }
  return false;
}
</script>
