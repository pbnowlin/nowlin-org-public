isbe = [];

isbe[4801]='Jahaziah`ja-ha-zi\'-a: the King James Version for <a href="study/isbe/search.html?string=JAHZEIAH">JAHZEIAH</A> (which see).``1';
isbe[4802]='Jahaziel`ja-ha\'-zi-el (yachazi\'el, "God sees"):<P>(1) In <a onClick="return mV(\'1Ch\',12,4);">1Ch 12:4 (Hebrew 5)</a>, one of David\'s recruits at Ziklag, a Benjamite or maybe a Judean.<P>(2) In <a onClick="return mV(\'1Ch\',16,6);">1Ch 16:6</a>, one of two priests appointed by David to sound trumpets before the ark on its journey to Jerusalem. The Septuagint\'s Codex Vaticanus and Codex Alexandrinus, read "Uzziel."<P>(3) In <a onClick="return mV(\'1Ch\',23,19);">1Ch 23:19</a>; <a onClick="return mV(\'1Ch\',24,23);">24:23</a>, a Levite, "son" of Hebron, a Kohathite. Kittel, following the Septuagint, reads "Uzziel."<P>(4) In <a onClick="return mV(\'2Ch\',20,14);">2Ch 20:14</a>, an Asaphite, son of Zechariah. He encouraged King Jehoshaphat of Judah and his subjects to fight against the Moabite and Ammonite invaders.<P>(5) In <a onClick="return mV(\'Ezr\',8,5);">Ezr 8:5</a>, an ancestor of one of the families of the Restoration. Read probably "of the sons of Zattu, Sheconiah the son of Jahaziel," following 1Esdras 8:32 (= Jezelus).``149';
isbe[4803]='Jahdai`ja\'-da-i, ja\'-di (yahday, "Yah leads" (?); Baer reads yehday): In <a onClick="return mV(\'1Ch\',2,47);">1Ch 2:47</a>, where six sons of Jahdai are mentioned. "The name has been taken as that of another wife or concubine of Caleb; more probably Jahdai is a descendant of Caleb, whose name, in the original connection, has fallen from the text" (Curtis, Chronicles, 96).``1';
isbe[4804]='Jahdiel`ja\'-di-el (yachdi\'el, "God gives joy"): In <a onClick="return mV(\'1Ch\',5,24);">1Ch 5:24</a>, head of a Manassite family.``1';
isbe[4805]='Jahdo`ja\'-do (yachdo, meaning uncertain; Kittel suggests yachday = Jahdai): In <a onClick="return mV(\'1Ch\',5,14);">1Ch 5:14</a>, a Gileadite.``1';
isbe[4806]='Jahleel`ja\'-le-el (yachle\'el, "wait for God!"): In <a onClick="return mV(\'Gen\',46,14);">Ge 46:14</a>; <a onClick="return mV(\'Num\',26,26);">Nu 26:26</a>, a "son" (i.e. clan) of Zebulun.``1';
isbe[4807]='Jahleelites, the`ja\'-le-el-its (hayachle\'eli, coll. with article): In <a onClick="return mV(\'Num\',26,26);">Nu 26:26</a>, the descendants of the clan of Jahleel.``1';
isbe[4808]='Jahmai`ja\'-ma-i, ja\'-mi (yachmay, perhaps = yachmeyah, "may Yahweh protect!"): In <a onClick="return mV(\'1Ch\',7,2);">1Ch 7:2</a>, head of a clan of Issachar.``1';
isbe[4809]='Jahweh`ya\'-we.`<a href="./study/isbe/search.html?string=GOD+NAMES+OF">GOD, NAMES OF</a>`1';
isbe[4810]='Jahzah`ja\'-za.`<a href="./study/isbe/search.html?string=JAHAZ">JAHAZ</a>`1';
isbe[4811]='Jahzeel And Jahziel`ja\'-ze-el (yachtse\'el, "God divides," "apportions"): In <a onClick="return mV(\'Gen\',46,24);">Ge 46:24</a>; <a onClick="return mV(\'Num\',26,48);">Nu 26:48</a>; and 23 manuscripts in <a onClick="return mV(\'1Ch\',7,13);">1Ch 7:13</a>; (yachatsi\'el, same meaning as above): <a onClick="return mV(\'1Ch\',7,13);">1Ch 7:13</a>, a "son" (clan) of Naphtali.``1';
isbe[4812]='Jahzeelites, the`ja\'-ze-el-its (hayachtse\'eli, coll. with article): In <a onClick="return mV(\'Num\',26,48);">Nu 26:48</a>, descendants of the clan of Jahzeel.``1';
isbe[4813]='Jahzeiah`ja-ze\'-ya, ja\'-ze-ya (yachzeyah, "Yah sees"): In <a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>, son of Tikvah, and a contemporary of Ezra. It is disputed whether he and Jonathan opposed or supported Ezra in the matter of prosecuting those who had married foreign wives = Ezekias, 1Esdras 9:14, or Ezias.<P>Two translations of the Hebrew phrase (\'amadh \'al-zo\'th) are given:<P>(1) "stood over this matter," i.e. supported Ezra; so the King James Version ("were employed in this matter"), and so Septuagint, 1Esdras 9:14, the Revised Version margin. This is supported by 9:4, "Let now our princes be appointed for all the assembly," where the same phrase is found.<P>(2) the Revised Version (British and American) "stood up against this matter," so BDB, Gesenius, Bertheau, Stade.<P>Both translations can be supported by parallels in Hebrew. The context is better suited by the former rendering.`<a href="./study/isbe/search.html?string=JONATHAN">JONATHAN</a>`149';
isbe[4814]='Jahzerah`ja\'-ze-ra, ja-ze\'-ra (yachzerah, meaning unknown): In <a onClick="return mV(\'1Ch\',9,12);">1Ch 9:12</a>, an ancestor of Maasai and apparently = "Ahzai" of <a onClick="return mV(\'Neh\',11,13);">Ne 11:13</a>.``1';
isbe[4815]='Jahziel`ja\'-zi-el.`<a href="./study/isbe/search.html?string=JAHZEEL+AND+JAHZIEL">JAHZEEL AND JAHZIEL</a>`1';
isbe[4816]='Jailor`jal\'-er.`<a href="./study/isbe/search.html?string=PRISON;+PRISONER">PRISON</a>`1';
isbe[4817]='Jair`ja\'-er:<P>(1) Jair (ya\'ir, "he enlightens" or "one giving light"):<P class="in15">(a) Son, i.e. descendant of Manasseh (<a onClick="return mV(\'Num\',32,41);">Nu 32:41</a>; <a onClick="return mV(\'Deu\',3,14);">De 3:14</a>; <a onClick="return mV(\'Jos\',13,30);">Jos 13:30</a>; <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>; <a onClick="return mV(\'1Ch\',2,22);">1Ch 2:22</a>f). According to <a onClick="return mV(\'1Ch\',2,21);">1Ch 2:21</a>f he was the son of ScRub, son of Hezron, a descendant of Judah, who married the daughter of Machir, son of Manasseh. He was thus descended both from Judah and Manasseh. At the time of the conquest he distinguished himself by taking the tent-villages <a href="study/isbe/search.html?string=HAVVOTH-JAIR">HAVVOTH-JAIR</A> (which see). The accounts of his exploit are difficult to harmonize (see ICC on above passages). Some would identify him with the Jair of <a onClick="return mV(\'Jdg\',10,3);">Jud 10:3</a>, holding that Manasseh\'s settlement in Northern Gilead and Bashan took place, not before Israel\'s passage of the Jordan, but after the settlement of the tribe on the west. For a criticism of this view see HGHL, 577, note<P class="in15">(b) One of the judges. He is said to have had 30 sons, who rode on 30 ass colts, and who had as many cities, known as Havvoth-jair (<a onClick="return mV(\'Jdg\',10,3,4);">Jud 10:3-4</a>). One tradition identifies (a) and (b). Others reconcile the two narratives by interpreting the word "son" in a non-literal sense.<P class="in15">(c) The father of Mordecai (<a onClick="return mV(\'Est\',2,5);">Es 2:5</a>). In the Apocrypha (<span class="noTag">Additions to Esther 11:2</span>) his name is given as "Jairus" (Iaeiros).<P>(2) Jair (Qere: ya\'ir, "he arouses"; Kethibh: ya\'ur; a different name from (1) above): The father of Elhanan, the giant-slayer (<a onClick="return mV(\'1Ch\',20,5);">1Ch 20:5</a>). In the parallel passage (<a onClick="return mV(\'2Sa\',21,19);">2Sa 21:19</a>) his name is given as "Jaare-oregim," but the text should be corrected to Jair, "oregim" (\'oreghim) having crept in from the line below through a copyist\'s error.``32';
isbe[4818]='Jairite`ja\'-er-it (ya\'iri, "of Jair"): In <a onClick="return mV(\'2Sa\',20,26);">2Sa 20:26</a>, Ira the Jairite is "chief minister unto David." He was a descendant of Jair who was a Manassite (<a onClick="return mV(\'Num\',32,41);">Nu 32:41</a>, etc.) and whose territory was in Gilead. Septuagint, Lucian, and Syriac suggest yattiri, "Jattirite," i.e. a native of Jattir mentioned in <a onClick="return mV(\'1Sa\',30,27);">1Sa 30:27</a> as one of the towns friendly to David when he was in Ziklag. It is not improbable that a native of Jattir would be given such a post by David.`<a href="./study/isbe/search.html?string=IRA">IRA</a>`1';
isbe[4819]='Jairus (1)`ja\'-i-rus, ja-i\'-rus (Iaeiros; 1Esdras 5:31; <span class="noTag">Additions to Esther 11:2</span>).`<a href="./study/isbe/search.html?string=AIRUS">AIRUS</a>; <a href="./study/isbe/search.html?">JAIR</a>`1';
isbe[4820]='Jairus (2)`ja\'-i-rus, ja-i\'-rus (Iaeiros): A ruler in a synagogue near Capernaum whose only daughter, aged about 12 years, was raised from the dead by Jesus (<a onClick="return mV(\'Mat\',9,\'18-26\');">Mt 9:18-26</a>; <a onClick="return mV(\'Mar\',5,\'22-43\');">Mr 5:22-43</a>; <a onClick="return mV(\'Luk\',8,\'41-56\');">Lu 8:41-56</a>). The accounts of the miracle are substantially the same, but vary in detail. According to Mark and Luke the arrival of Jairus in Capernaum fell immediately after the return of Jesus from Gadara, but according to Matthew the sequence of events was that Jesus had returned to Capernaum, had called Matthew, had joined the feast of the publicans, and had just finished His discourse on fasting when Jairus came to Him. Matthew and Mark both testify to the great faith of Jairus, who besought of Jesus that He should but lay His hand upon the maid and she should live. According to Matthew she was already dead when Jairus came to Capernaum; according to the others she was on the point of death; but all agree as to her death before the arrival of Jesus and His followers at her abode. Matthew implies that Jesus alone was present at the actual raising; Mark and Luke state that Peter, James, John and the parents were also there. The healing of the woman with the issue of blood by Jesus on the way is given by all.``88';
isbe[4821]='Jakan`ja\'-kan (ya\'aqan).`<a href="./study/isbe/search.html?string=JAAKAN">JAAKAN</a>`1';
isbe[4822]='Jakeh`ja\'-ke (yaqeh, perhaps from Arabic root meaning "carefully religious"; yaqe\', as if from qi\'): The father of Agur, the author of the sayings recorded in <a onClick="return mV(\'Pro\',30,1);">Pr 30:1</a>. Nothing is known of either Jakeh or Agur. The immediate connection in the Hebrew text of ha-massa\', "the prophecy" or "burden" (the King James Version "even the prophecy," the Revised Version (British and American) "the oracle") with ne\'um, "oracle" (the King James Version "spake," the Revised Version (British and American) "saith") is quite exceptional, while the verse is unintelligible and the text, as the Septuagint shows, is evidently corrupt. The best emendation is that which changes ha-massa\', "the prophecy," into ha-massa\'i, "the Massaite," or into mimmassa\', "of Massa" (Revised Version margin), Massa being the name of the country of an Ishmaelite tribe (compare <a onClick="return mV(\'Gen\',25,14);">Ge 25:14</a>; <a onClick="return mV(\'1Ch\',1,30);">1Ch 1:30</a>; <a onClick="return mV(\'Pro\',31,1);">Pr 31:1</a> the Revised Version margin).`<a href="./study/isbe/search.html?string=AGUR">AGUR</a>`32';
isbe[4823]='Jakim`ja\'-kim (yaqim, "he (God) lifteth Up"; compare <a href="study/isbe/search.html?string=ELIAKIM">ELIAKIM</a>):<P>(1) A Benjamite, a son of Shimei (<a onClick="return mV(\'1Ch\',8,19);">1Ch 8:19</a>).<P>(2) A priest, the head of the 12th of the 24 courses into which the priests were divided (<a onClick="return mV(\'1Ch\',24,12);">1Ch 24:12</a>).``1';
isbe[4824]='Jalam`ja\'-lam (ya\'lam, according to BDB following Septuagint Ieglom, in Genesis, from \'alam, meaning "to conceal"; according to Gunkel, Gen3, 390, from ya\'el, "mountain-goat"; see HPN, 90, note 5; King James Version Jaalam): In <a onClick="return mV(\'Gen\',36,5,14,18);">Ge 36:5, 14, 18</a>; <a onClick="return mV(\'1Ch\',1,35);">1Ch 1:35</a>, a son of Esau, mentioned as the 2nd son by Oholibamah; probably an Edomite clan.``1';
isbe[4825]='Jalon`ja\'-lon (yalon, meaning unknown): In <a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>, a son of Ezrah, a Judahite.``1';
isbe[4826]='Jambres`jam\'-brez.`<a href="./study/isbe/search.html?string=JANNES+AND+JAMBRES">JANNES AND JAMBRES</a>`1';
isbe[4827]='Jambri`jam\'-bri (hoi huioi Iambrein; 1Macc 9:36-41): The sons of Jambri are said to have come out of Medeba (originally Med\'ba), a city of the Moabites, and subsequently a possession of the Amorites, and to have carried off John, the brother of Jonathan, who succeeded Judas Maccabeus as leader of the Jews. The Israelites got possession of the place and assigned it to the tribe of Reuben. No mention is made elsewhere of the Jambri. In Josephus (Ant., XIII, i, 2) they are called "sons of Amaraeus."``1';
isbe[4828]='James`jamz (Iacobos): English form of Jacob, and the name of 3 New Testament men of note:<P>(1) The Son of Zebedee, one of the Twelve Apostles (ho tou Zebedaiou):<P>A) The Son of Zebedee:<P>I. In the New Testament.<P>1. Family Relations, etc.:<P>To the Synoptists alone are we indebted for any account of this James. He was the son of Zebedee and the brother of John (<a onClick="return mV(\'Mat\',4,21);">Mt 4:21</a>; <a onClick="return mV(\'Mar\',1,19);">Mr 1:19</a>; <a onClick="return mV(\'Luk\',5,10);">Lu 5:10</a>). As the Synoptists generally place the name of James before that of John, and allude to the latter as "the brother of James," it is inferred that James was the elder of the two brothers. His mother\'s name was probably Salome, the sister of the mother of Jesus (compare <a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>; <a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>; <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a>), but this is disputed by some (compare <a href="study/isbe/search.html?string=BRETHREN+OF+THE+LORD">BRETHREN OF THE LORD</a>). James was a fisherman by trade, and worked along with his father and brother (<a onClick="return mV(\'Mat\',4,21);">Mt 4:21</a>). According to Luke, these were partners with Simon (<a onClick="return mV(\'Luk\',5,10);">5:10</a>), and this is also implied in Mark (<a onClick="return mV(\'Mark\',1,19);">1:19</A>). As they owned several boats and employed hired servants (<a onClick="return mV(\'Luk\',5,11);">Lu 5:11</a>; <a onClick="return mV(\'Mar\',1,20);">Mr 1:20</a>), the establishment they possessed must have been considerable.<P>2. First Call:<P>The call to James to follow Christ (<a onClick="return mV(\'Mat\',4,\'18-22\');">Mt 4:18-22</a>; <a onClick="return mV(\'Mar\',1,\'16-20\');">Mr 1:16-20</a>; <a onClick="return mV(\'Luk\',5,\'1-11\');">Lu 5:1-11</a>) was given by Jesus as He was walking by the sea of Galilee (<a onClick="return mV(\'Mat\',4,18);">Mt 4:18</a>). There He saw "James the son of Zebedee, and John his brother, in the boat with Zebedee their father, mending their nets; and he called them. And they straightway left the boat and their father, and followed him" (<a onClick="return mV(\'Mat\',4,21,22);">Mt 4:21-22</a>). The account of Luke varies in part from those of Matthew and Mark, and contains the additional detail of the miraculous draught of fishes, at which James and John also were amazed. This version of Luke is regarded by some as an amalgamation of the earlier accounts with <a onClick="return mV(\'Jhn\',21,\'1-8\');">Joh 21:1-8</a>.<P>3. Probation and Ordination:<P>As the above incident took place after the imprisonment of John the Baptist, when Jesus had departed into Galilee (<a onClick="return mV(\'Mat\',4,12);">Mt 4:12</a>; <a onClick="return mV(\'Mar\',1,14);">Mr 1:14</a>), and as there is no mention of James among those who received the preliminary call recorded by John (compare <a onClick="return mV(\'Jhn\',1,\'35-51\');">Joh 1:35-51</a>; <a onClick="return mV(\'Jhn\',3,24);">3:24</a>, and compare <a href="study/isbe/search.html?string=ANDREW">ANDREW</a>), it is probable that while Peter and Andrew made the pilgrimage to Bethany, James and the other partners remained in Galilee to carry on the business of their trade. Yet, on the return of Peter and Andrew, the inquiries of James must have been eager concerning what they had seen and heard. His mind and imagination became filled with their glowing accounts of the newly found "Lamb of God" (<a onClick="return mV(\'Jhn\',1,36);">Joh 1:36</a>) and of the preaching of John the Baptist, until he inwardly dedicated his life to Jesus and only awaited an opportunity to declare his allegiance openly. By this is the apparently abrupt nature of the call, as recorded by the Synoptists, to be explained. After a period of companionship and probationership with his Master, when he is mentioned as being present at the healing of Simon\'s wife\'s mother at Capernaum (<a onClick="return mV(\'Mar\',1,\'29-31\');">Mr 1:29-31</a>), he was ordained one of the Twelve Apostles (<a onClick="return mV(\'Mat\',10,2);">Mt 10:2</a>; <a onClick="return mV(\'Mar\',3,17);">Mr 3:17</a>; <a onClick="return mV(\'Luk\',6,14);">Lu 6:14</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>).<P>4. Apostleship:<P>From this time onward he occupied a prominent place among the apostles, and, along with Peter and John, became the special confidant of Jesus. These three alone of the apostles were present at the raising of Jairus\' daughter (<a onClick="return mV(\'Mar\',5,37);">Mr 5:37</a>; <a onClick="return mV(\'Luk\',8,51);">Lu 8:51</a>), at the Transfiguration (<a onClick="return mV(\'Mat\',17,\'1-8\');">Mt 17:1-8</a>; <a onClick="return mV(\'Mar\',9,\'2-8\');">Mr 9:2-8</a>; <a onClick="return mV(\'Luk\',9,\'28-36\');">Lu 9:28-36</a>), and at the Agony in the Garden of Gethsemane (<a onClick="return mV(\'Mat\',26,\'36-46\');">Mt 26:36-46</a>; <a onClick="return mV(\'Mar\',14,\'32-42\');">Mr 14:32-42</a>). Shortly after the Transfiguration, when Jesus, having "stedfastly set his face to go to Jerusalem" (<a onClick="return mV(\'Luk\',9,51);">Lu 9:51</a>), was passing through Samaria, the ire of James and John was kindled by the ill reception accorded to Him by the populace (<a onClick="return mV(\'Luk\',9,53);">Lu 9:53</a>). They therefore asked of Jesus, "Lord, wilt thou that we bid fire to come down from heaven, and consume them?" (<a onClick="return mV(\'Luk\',9,54);">Lu 9:54</a>). "But he turned, and rebuked them" (<a onClick="return mV(\'Luk\',9,55);">Lu 9:55</a>). It was probably this hotheaded impetuosity and fanaticism that won for them the surname "Boanerges, which is, Sons of thunder," bestowed on them when they were ordained to the Twelve (<a onClick="return mV(\'Mar\',3,17);">Mr 3:17</a>). Yet upon this last occasion, there was some excuse for their action. The impression left by the Transfiguration was still deep upon them, and they felt strongly that their Lord, whom they had lately beheld "in his glory" with "countenance altered" and "glistering raiment," should be subjected to such indignities by the Samaritans. Upon the occasion of Jesus\' last journey to Jerusalem (<a onClick="return mV(\'Mar\',10,32);">Mr 10:32</a>), the two brothers gave expression to this presumptuous impetuosity in a more selfish manner (<a onClick="return mV(\'Mar\',10,\'35-45\');">Mr 10:35-45</a>). Presuming on their intimacy with Jesus, they made the request of him, "Grant unto us that we may sit, one on thy right hand, and one on thy left hand, in thy glory" (<a onClick="return mV(\'Mar\',10,37);">Mr 10:37</a>). In the account of Matthew (<a onClick="return mV(\'Mar\',20,\'20-28\');">20:20-28</a>), the words are put in the mouth of their mother. The request drew forth the rebuke of Jesus (<a onClick="return mV(\'Mar\',10,38);">Mr 10:38</a>), and moved the ten with indignation (<a onClick="return mV(\'Mar\',10,40);">Mr 10:40</a>); but by the words of their Lord peace was again restored (<a onClick="return mV(\'Mar\',10,\'42-45\');">Mr 10:42-45</a>). After the arrival of Jesus in Jerusalem, when He "sat on the mount of Olives over against the temple," James was one of the four who put the question to Him concerning the last things (<a onClick="return mV(\'Mar\',13,3,4);">Mr 13:3-4</a>). He was also present when the risen Jesus appeared for the 3rd time to the disciples and the miraculous draught of fishes was made at the sea of Tiberias (<a onClick="return mV(\'Jhn\',21,\'1-14\');">Joh 21:1-14</a>).<P>5. Death:<P>James was the first martyr among the apostles, being slain by King Herod Agrippa I about 44 AD, shortly before Herod\'s own death. The vehemence and fanaticism which were characteristic of James had made him to be feared and hated among the Jewish enemies of the Christians, and therefore when "Herod the king put forth his hands to afflict certain of the church...he killed James the brother of John with the sword" (<a onClick="return mV(\'Act\',12,1,2);">Ac 12:1-2</a>). Thus did James fulfill the prophecy of our Lord that he too should drink of the cup of his Master (<a onClick="return mV(\'Mar\',10,39);">Mr 10:39</a>).<P>II. In Apocryphal Literature.<P>According to the "Genealogies of the Twelve Apostles" (compare Budge, Contendings of the Apostles, II, 49), "Zebedee was of the house of Levi, and his wife of the house of Judah. Now, because the father of James loved him greatly he counted him among the family of his father Levi, and similarly because the mother of John loved him greatly, she counted him among the family of her father Judah. And they were surnamed \'Children of Thunder,\' for they were of both the priestly house and of the royal house." The Acts of John, a heretical work of the 2nd century, referred to by Clement of Alexandria in his Hypotyposis and also by Eusebius (Historia Ecclesiastica, III, 25), gives an account of the call of James and his presence at the Transfiguration, similar in part to that of the Gospels, but giving fantastic details concerning the supernatural nature of Christ\'s body, and how its appearances brought confusion to James and other disciples (compare Itennecke, Handbuch zu den neutestamentlichen Apokryphen, 423-59). The Acts of James in India (compare Budge, II, 295-303) tells of the missionary journey of James and Peter to India, of the appearance of Christ to them in the form of a beautiful young man, of their healing a blind man, and of their imprisonment, miraculous release, and their conversion of the people. According to the Martyrdom of James (Budge, II, 304-8), James preached to the 12 tribes scattered abroad, and persuaded them to give their first-fruits to the church instead of to Herod. The accounts of his trial and death are similar to that in <a onClick="return mV(\'Act\',12,\'1-2\');">Ac 12:1-2</a>.<P>(1) James is the patron saint of Spain. The legend of his preaching there, of his death in Judea, of the transportation of his body under the guidance of angels to Iria and of the part that his miraculous appearances played in the history of Spain, is given in Mrs. Jameson\'s Sacred and Legendary Art, I, 230-41.<P>(2) James the son of Alpheus (ho tou Alphaiou; for etymology, etc., of James, see above): One of the Twelve Apostles (<a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>; <a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>). By Matthew and Mark he is coupled with Thaddaeus, and by Luke and Acts with Simon Zelotes. As Matthew or Levi is also called the son of Alpheus (compare <a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>; <a onClick="return mV(\'Mar\',2,14);">Mr 2:14</a>), it is possible that he and James were brothers. According to the Genealogies of the Apostles (compare Budge, Contendings of the Apostles, II, 50), James was of the house of Gad. The Martyrdom of James, the son of Alpheus (compare Budge, ib, 264-66) records that James was stoned by the Jews for preaching Christ, and was "buried by the Sanctuary In Jerusalem."<P>This James is generally identified with James the Little or the Less, the brother of Joses and son of Mary (<a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>; <a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>). In <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a> this Mary is called the wife of Cleophas (the King James Version) or Clopas (Revised Version), who is thus in turn identified with Alpheus. There is evidence in apocryphal literature of a Simon, a son of Clopas, who was also one of the disciples (compare <a href="study/isbe/search.html?string=NATHANAEL+(2)">NATHANAEL</a>). If this be the same as Simon Zelotes, it would explain why he and James (i.e. as being brothers) were coupled together in the apostolic lists of Luke and Acts. Some have applied the phrase "his mother\'s sister" in <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a> to Mary the wife of Clopas, instead of to a separate person, and have thus attempted to identify James the son of Alpheus with James the brother of our Lord. For a further discussion of the problem, see <a href="study/isbe/search.html?string=BRETHREN+OF+THE+LORD">BRETHREN OF THE LORD</a>.<P>(3) James, "the Lord\'s brother" (ho adelphos tou Kuriou):he Less, the brother of Joses and son of Mary (<a onClick="return mV(\'Mat\',27,56);">Mt 27:56</a>; <a onClick="return mV(\'Mar\',15,40);">Mr 15:40</a>). In <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a> this Mary is called the wife of Cleophas (the King James Version) or Clopas (Revised Version), who is thus in turn identified with Alpheus. There is evidence in apocryphal literature of a Simon, a son of Clopas, who was also one of the disciples (compare <a href="study/isbe/search.html?string=NATHANAEL+(2)">NATHANAEL</a>). If this be the same as Simon Zelotes, it would explain why he and James (i.e. as being brothers) were coupled together in the apostolic lists of Luke and Acts. Some have applied the phrase "his mother\'s sister" in <a onClick="return mV(\'Jhn\',19,25);">Joh 19:25</a> to Mary the wife of Clopas, instead of to a separate person, and have thus attempted to identify James the son of Alpheus with James the brother of our Lord. For a further discussion of the problem, see <a href="study/isbe/search.html?string=BRETHREN+OF+THE+LORD">BRETHREN OF THE LORD</a>.<P>B) James, "The Lord\'s Brother":<P>I. New Testament References.<P>1. In the Gospels:<P>This James is mentioned by name only twice in the Gospels, i.e. when, on the visit of Jesus to Nazareth, the countrymen of our Lord referred in contemptuous terms to His earthly kindred, in order to disparage His preaching (<a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>; <a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>). As James was one of "his brethren," he was probably among the group of Christ\'s relatives who sought to interview Him during His tour through Galilee with the Twelve (<a onClick="return mV(\'Mat\',12,46);">Mt 12:46</a>). By the same reasoning, he accompanied Jesus on His journey to Capernaum (<a onClick="return mV(\'Jhn\',2,12);">Joh 2:12</a>), and joined in attempting to persuade Him to depart from Galilee for Judea on the eve of the Feast of Tabernacles (<a onClick="return mV(\'Jhn\',7,3);">Joh 7:3</a>). At this feast James was present (<a onClick="return mV(\'Jhn\',7,10);">Joh 7:10</a>), but was at this time a non-believer in Jesus (compare <a onClick="return mV(\'Jhn\',7,5);">Joh 7:5</a>, "Even his brethren did not believe on him").<P>2. In the Epistles:<P>Yet the seeds of conversion were being sown within him, for, after the crucifixion, he remained in Jerusalem with his mother and brethren, and formed one of that earliest band of believers who "with one accord continued stedfastly in prayer" (<a onClick="return mV(\'Act\',1,14);">Ac 1:14</a>). While there, he probably took part in the election of Matthias to the vacant apostleship (<a onClick="return mV(\'Act\',1,\'15-25\');">Ac 1:15-25</a>). James was one of the earliest witnesses to the resurrection, for, after the risen Lord had manifested Himself to the five hundred, "he was seen of James" (<a onClick="return mV(\'1Cr\',15,7);">1Co 15:7</a> the King James Version). By this his growing belief and prayerful expectancy received confirmation. About 37 or 38 AD, James, "the Lord\'s brother" (<a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>), was still in Jerusalem, and had an interview there for the first time with Paul, when the latter returned from his 3 years\' sojourn in Damascus to visit Cephas, or Peter (<a onClick="return mV(\'Gal\',1,18,19);">Ga 1:18-19</a>; compare <a onClick="return mV(\'Act\',9,26);">Ac 9:26</a>). In several other passages the name of James is coupled with that of Peter. Thus, when Peter escaped from prison (about 44 AD), he gave instructions to those in the house of John Mark that they should immediately inform "James and the brethren" of the manner of his escape (<a onClick="return mV(\'Act\',12,17);">Ac 12:17</a>). By the time of the Jerusalem convention, i.e. about 51 AD (compare <a onClick="return mV(\'Gal\',2,1);">Ga 2:1</a>), James had reached the position of first overseer in the church (compare <a onClick="return mV(\'Act\',15,13,19);">Ac 15:13, 19</a>). Previous to this date, during Paul\'s ministry at Antioch, he had dispatched certain men thither to further the mission, and the teaching of these had caused dissension among the newly converted Christians and their leaders (<a onClick="return mV(\'Act\',15,1,2);">Ac 15:1-2</a>; <a onClick="return mV(\'Gal\',2,12);">Ga 2:12</a>). The conduct of Peter, over whom James seems to have had considerable influence, was the principal matter of contention (compare <a onClick="return mV(\'Gal\',2,11);">Ga 2:11</a> if). However, at the Jerusalem convention the dispute was amicably settled, and the pillars of the church, James, John and Cephas, gave to Paul and Barnabas the right hand of fellowship (<a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>). The speech of James on this occasion (<a onClick="return mV(\'Act\',15,\'13-29\');">Ac 15:13-29</a>), his sympathy with the religious needs of the Gentile world (<a onClick="return mV(\'Act\',15,17);">Ac 15:17</a>), his desire that formalism should raise no barrier to their moral and spiritual advancement (<a onClick="return mV(\'Act\',15,19,20,28,29);">Ac 15:19-20, 28-29</a>), and his large-hearted tributes to the "beloved Barnabas and Paul" (<a onClick="return mV(\'Act\',15,25,26);">Ac 15:25-26</a>), indicate that James was a leader in whom the church was blessed, a leader who loved peace more than faction, the spirit more than the law, and who perceived that religious communities with different forms of observance might still live and work together in common allegiance to Christ. Once more (58 AD), James was head of the council at Jerusalem when Paul made report of his labors, this time of his 3rd missionary Journey (<a onClick="return mV(\'Act\',21,17);">Ac 21:17</a>). At this meeting Paul was admonished for exceeding the orders he had received at the first council, in that he had endeavored to persuade the converted Jews also to neglect circumcision (<a onClick="return mV(\'Act\',21,21);">Ac 21:21</a>), and was commanded to join in the vow of purification (<a onClick="return mV(\'Act\',21,\'23-26\');">Ac 21:23-26</a>). There is no Scriptural account of the death of James From <a onClick="return mV(\'1Cr\',9,5);">1Co 9:5</a> it has been inferred that he was married. This is, however, only a conjecture, as the passage refers to those who "lead about a sister, a wife" (the King James Version), while, so far as we know, James remained throughout his life in Jerusalem.<P>This James has been regarded as the author of the Epistle of James, "a servant of God and of the Lord Jesus Christ"; compare <a href="study/isbe/search.html?string=JAMES,+EPISTLE+OF">JAMES, EPISTLE OF</A>. Also, for details concerning his relationship to Christ, compare <a href="study/isbe/search.html?string=BRETHREN+OF+THE+LORD">BRETHREN OF THE LORD</a>.<P>II. References in Apocryphal Literature.<P>James figures in one of the miraculous events recorded in the Gnostic "Gospel of the Infancy, by Thomas the Israelite philosopher," being cured of a snake-bite by the infant Jesus (compare Hennecke, Handbuch zu den neutestamentlichen Apokryphen, 73). According to the Gospel of the Hebrews (compare ib, 11-21), James had also partaken of the cup of the Lord, and refused to eat till he had seen the risen Lord. Christ acknowledged this tribute by appearing to James first. In the Acts of Peter (compare Budge, Contendings of the Apostles, II, 475), it is stated that "three days after the ascension of our Lord into heaven, James, whom our Lord called his \'brother in the flesh,\' consecrated the Offering and we all drew nigh to partake thereof: and when ten days had passed after the ascension of our Lord, we all assembled in the holy fortress of Zion, and we stood up to say the prayer of sanctification, and we made supplication unto God and besought Him with humility, and James also entreated Him concerning the descent of the Holy Ghost upon the Offering." The Preaching of James the Just (compare Budge, II, 78-81) tells of the appointment of James to the bishopric of Jerusalem, of his preaching, healing of the sick and casting out of devils there. This is confirmed by the evidence of Clement of Alexandria (Euseb., HE, II, 1). In the Martyrdom of James the Just (compare Budge, II, 82-89), it is stated that J., "the youngest of the sons of Joseph," alienated, by his preaching, Piobsata from her husband Ananus, the governor of Jerusalem. Ananus therefore inflamed the Jews against James, and they hurled him down from off the pinnacle of the temple. Hegesippus, quoted by Eusebius (Historia Ecclesiastica, II, 23), and Josephus (Ant., XX, ix, 1), testify to the general truth of this. It is thus probable that James was martyred about 62 or 63 AD.<P>Besides the epistle which bears his name, James was also the reputed author of the Protevangelium Jacobi, a work which originated in the 2nd century and received later additions (compare Henn, NA, 47-63; also <a href="study/isbe/search.html?string=JOSEPH,+HUSBAND+OF+MARY">JOSEPH, HUSBAND OF MARY</A>).``88';
isbe[4829]='James, Epistle of` <b> I. CHARACTERISTICS OF THE EPISTLE</b><P class="in15">1. Jewish<P class="in15">2. Authoritative<P class="in15">3. Practical<P><b>II. AUTHOR OF THE EPISTLE</b><P><b>III. STYLE OF THE EPISTLE</b><P class="in15">1. Plainness<P class="in15">2. Good Greek<P class="in15">3. Vividness<P class="in15">4. Duadiplosis<P class="in15">5. Figures of Speech<P class="in15">6. Unlikeness to Paul<P class="in15">7. Likeness to Jesus<P><b>IV. DATE OF THE EPISTLE</b><P><b>V. HISTORY OF THE EPISTLE</b><P><b>VI. MESSAGE OF THE EPISTLE TO OUR TIMES</B><P class="in15">1. To the Pietist<P class="in15">2. To the Sociologist<P class="in15">3. To the Student of the Life and Character of Jesus<P><b>LITERATURE</b><hr /><P>I. Characteristics of the Epistle.<P>1. Jewish:<P>The Epistle of James is the most Jewish writing in the New Testament. The Gospel according to Matthew was written for the Jews. The Epistle to the Hebrews is addressed explicitly to them. The Apocalypse is full of the spirit of the Old Testament. The Epistle of Jude is Jewish too. Yet all of these books have more of the distinctively Christian element in them than we can find in the Epistle of James. If we eliminate two or three passages containing references to Christ, the whole epistle might find its place iust as properly in the Canon of the Old Testament as in that of the New Testament, as far as its substance of doctrine and contents is concerned. That could not be said Of any other book in the New Testament. There is no mention of the incarnation or of the resurrection., the two fundamental facts of the Christian faith. The word "gospel" does not occur in the epistle There is no suggestion that the Messiah has appeared and no presentation of the possibility of redemption through Him. The teaching throughout is that of a lofty morality which aims at the fulfillment of the requirements of the Mosaic law. It is not strange therefore that Spitta and others have thought that we have in the Epistle of James a treatise written by an unconverted Jew which has been adapted to Christian use by the interpolation of the two phrases containing the name of Christ in <a onClick="return mV(\'Jam\',1,1);">1:1</a> and <a onClick="return mV(\'Jam\',2,1);">2:1</A>. Spitta thinks that this can be the only explanation of the fact that we have here an epistle practically ignoring the life and work of Jesus and every distinctively Christian doctrine, and without a trace of any of the great controversies in the early Christian church or any of the specific features of its propaganda. This judgment is a superficial one, and rests upon superficial indications rather than any appreciation of the underlying spirit and principles of the book. The spirit of Christ is here, and there is no need to label it. The principles of this epistle are the principles of the Sermon on the Mount. There are more parallels to that Sermon in this epistle than can be found anywhere else in the New Testament in the same space. The epistle represents the idealization of Jewish legalism under the transforming influence of the Christian motive and life. It is not a theological discussion. It is an ethical appeal. It has to do with the outward life for the most part, and the life it pictures is that of a Jew informed with the spirit of Christ. The spirit is invisible in the epistle as in the individual man. It is the body which appears and the outward life with which that body has to do. The body of the epistle is Jewish, and the outward life to which it exhorts is that of a profoundly pious Jew. The Jews familiar with the Old Testament would read this epistle and find its language and tone that to which they were accustomed in their sacred books. James is evidently written by a Jew for Jews. It is Jewish in character throughout. This is apparent in the following particulars:<P>(1) The epistle is addressed to the 12 tribes which are of the Dispersion (<a onClick="return mV(\'Jam\',1,1);">1:1</A>). The Jews were scattered abroad through the ancient world. From Babylon to Rome, wherever any community of them might be gathered for commercial or social purposes, these exhortations could be carried and read. Probably the epistle was circulated most widely in Syria and Asia Minor, but it may have gone out to the ends of the earth. Here and there in the ghettos of the Roman Empire, groups of the Jewish exiles would gather and listen while one of their number read this letter from home. All of its terms and its allusions would recall familiar home scenes.<P>(2) Their meeting-place is called "your synagogue" (<a onClick="return mV(\'Jam\',2,2);">2:2</a>).<P>(3) Abraham is mentioned as "our father" (<a onClick="return mV(\'Jam\',2,21);">2:21</A>).<P>(4) God is given the Old Testament name, "the Lord of Sabaoth" (<a onClick="return mV(\'Jam\',5,4);">5:4</A>).<P>(5) The law is not to be spoken against nor judged, but reverently and loyally obeyed. It is a royal law to which every loyal Jew will be subject. It is a law of liberty, to be freely obeyed (<a onClick="return mV(\'Jam\',2,\8-12\');">2:8-12</a>; <a onClick="return mV(\'Jam\',4,11);">4:11</A>).<P>(6) The sins of the flesh are not inveighed against in the epistle, but those sins to which the Jews were more conspicuously liable, such as the love of money and the distinction which money may bring (<a onClick="return mV(\'Jam\',2,2,3,4);">2:2-4</A>), worldliness and pride (<a onClick="return mV(\'Jam\',4,\'4-6\');">4:4-6</a>), impatience and murmuring (<a onClick="return mV(\'Jam\',5,\'7-11\');">5:7-11</a>), and other sins of the temper and tongue (<a onClick="return mV(\'Jam\',3,\'1-12\');">3:1-12</a>; <a onClick="return mV(\'Jam\',4,11,12);">4:11,12</A>).<P>(7) The illustrations of faithfulness and patience and prayer are found in Old Testament characters, in Abraham (<a onClick="return mV(\'Jam\',2,21);">2:21</a>), Rahab (<a onClick="return mV(\'Jam\',2,25);">2:25</a>), Job (<a onClick="return mV(\'Jam\',5,11);">Jas 5:11</a>), and Elijah (<a onClick="return mV(\'Jam\',5,17,18);">Jas 5:17-18</a>). The whole atmosphere of the epistle is Jewish.<P>2. Authoritative:<P>The writer of this epistle speaks as one having authority. He is not on his defense, as Paul so often is. There is no trace of apology in his presentation of the truth. His official position must have been recognized and unquestioned. He is as sure of his standing with his readers as he is of the absoluteness of his message.<P>No Old Testament lawgiver or prophet was more certain that he spoke the word of the Lord. He has the vehemence of Elijah and the assured meekness of Moses. He has been called "the Amos of the New Testament," and there are paragraphs which recall the very expressions used by Amos and which are full of the same fiery eloquence and prophetic fervor. Both fill their writings with metaphors drawn from the sky and the sea, from natural objects and domestic experiences. Both seem to be countrybred and to be in sympathy with simplicity and poverty. Both inveigh against the luxury and the cruelty of the idle rich, and both abhor the ceremonial and the ritual which are substituted for individual righteousness. Malachi was not the last of the prophets. John the Baptist was not the last prophet of the Old Dispensation. The writer of this epistle stands at the end of that prophetic line, and he is greater than John the Baptist or any who have preceded him because he stands within the borders of the kingdom of Christ. He speaks with authority, as a messenger of God. He belongs to the goodly fellowship of the prophets and of the apostles. He has the authority of both. There are 54 imperatives in the 108 verses of this epistle.<P>3. Practical:<P>The epistle is interested in conduct more than in creed. It has very little formulated theology, less than any other epistle in the New Testament; but it insists upon practical morality throughout. It begins and it closes with an exhortation to patience and prayer. It preaches a gospel of good works, based upon love to God and love to man. It demands liberty, equality, fraternity for all. It enjoins humility and justice and peace. It prescribes singleness of purpose and stedfastness of soul. It requires obedience to the law, control of the passions, and control of the tongue. Its ideal is to be found in a good life, characterized by the meekness of wisdom. The writer of the epistle has caught the spirit of the ancient prophets, but the lessons that he teaches are taken, for the most part, from the Wisdom literature of the Old Testament and the Apocrypha. His direct quotations are from the Pentateuch and the Book of Proverbs; but it has been estimated that there are 10 allusions to the Book of Proverbs, 6 to the Book of Job, 5 to the Book of Wisdom, and 15 to the Book of Ecclesiasticus. This Wisdom literature furnishes the staple of his meditation and the substance of his teaching. He has little or nothing to say about the great doctrines of the Christian church.<P>He has much to say about the wisdom that cometh down from above and is pure, peaceable, gentle, easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy (<a onClick="return mV(\'Jam\',3,\'15-17\');">Jas 3:15-17</a>). The whole epistle shows that the author had stored his mind with the rich treasure of the ancient wisdom, and his material, while offered as his own, is both old and new. The form is largely that of the Wisdom literature of the Jews. It has more parallels with Jesus the son of Sirach than with any writer of the sacred books.<P>The substance of its exhortation, however, is to be found in the Synoptics and more particularly in the Sermon on the Mount. Its wisdom is the wisdom of Jesus the son of Joseph, who is the Christ.<P>These are the three outstanding characteristics of this epistle. In form and on the surface it is the most Jewish and least Christian of the writings in the New Testament. Its Christianity is latent and not apparent. Yet it is the most authoritative in its tone of any of the epistles in the New Testament, unless it be those of the apostle John. John must have occupied a position of undisputed primacy in the Christian church after the death of all the other apostles, when he wrote his epistles. It is noteworthy that the writer of this epistle assumes a tone of like authority with that of John. John was the apostle of love, Paul of faith, and Peter of hope. This writer is the apostle of good works, the apostle of the wisdom which manifests itself in peace and purity, mercy and morality, and in obedience to the royal law, the law of liberty. In its union of Jewish form, authoritative tone, and insistence upon practical morality, the epistle is unique among the New Testament books.<P>II. Author of the Epistle.<P>The address of the epistle states that the writer is "James, a servant of God and of the Lord Jesus Christ" (<a onClick="return mV(\'Jam\',1,1);">Jas 1:1</a>). The tradition of the church has identified this James with the brother of our Lord. Clement of Alexandria says that Peter and James and John, who were the three apostles most honored of the Lord, chose James, the Lord\'s brother, to be the bishop of Jerusalem after the Lord\'s ascension (Euscb., HE, II, 1). This tradition agrees well with all the notices of James in the New Testament books. After the death of James the brother of John, Peter was thrown into prison, and having been miraculously released, he asked that the news be sent to James and to the brethren (<a onClick="return mV(\'Act\',12,17);">Ac 12:17</a>). This James is evidently in authority in the church at this time. In the apostolical conference held at Jerusalem, after Peter and Paul and Barnabas had spoken, this same James sums up the whole discussion, and his decision is adopted by the assembly and formulated in a letter which has some very striking parallels in its phraseology to this epistle (<a onClick="return mV(\'Act\',15,\'6-29\');">Ac 15:6-29</a>). When Paul came to Jerusalem for the last time he reported his work to James and all the elders present with him (<a onClick="return mV(\'Act\',21,18);">Ac 21:18</a>). In the Epistle to the Galatians Paul says that at the time of one of his visits to Jerusalem he saw none of the apostles save Peter and James the Lord\'s brother (<a onClick="return mV(\'Gal\',1,18,19);">Ga 1:18-19</a>). At another visit he received the right hand of fellowship from James and Cephas and John (<a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>). At a later time certain who came from James to Antioch led Peter into backsliding from his former position of tolerance of the Gentiles as equals in the Christian church (<a onClick="return mV(\'Gal\',2,12);">Ga 2:12</a>).<P>All of these references would lead us to suppose that James stood in a position of supreme authority in the mother-church at Jerusalem, the oldest church of Christendom. He presides in the assemblies of the church. He speaks the final and authoritative word. Peter and Paul defer to him. Paul mentions his name before that of Peter and John. When he was exalted to this leadership we do not know, but all indications seem to point to the fact that at a very early period James was the recognized executive authority in the church at Jerusalem, which was the church of Pentecost and the church of the apostles. All Jews looked to Jerusalem as the chief seat of their worship and the central authority of their religion. All Christian Jews would look to Jerusalem as the primitive source of their organization and faith, and the head of the church at Jerusalem would be recognized by them as their chief authority. The authoritative tone of this epistle comports well with this position of primacy ascribed to James.<P>All tradition agrees in describing James as a Hebrew of the Hebrews, a man of the most rigid and ascetic morality, faithful in his observance of all the ritual regulations of the Jewish faith. Hegesippus tells us that he was holy from his mother\'s womb. He drank no wine nor strong drink. He ate no flesh. He alone was permitted to enter with the priests into the holy place, and he was found there frequently upon his knees begging forgiveness for the people, and his knees became hard like those of a camel in consequence of his constantly bending them in his worship of God and asking forgiveness for the people (Euseb., HE, II, 23). He was called James the Just. All had confidence in his sincerity and integrity, and many were persuaded by him to believe on the Christ. This Jew, faithful in the observance of all that the Jews held sacred, and more devoted to the temple-worship than the most pious among them, was a good choice for the head of the Christian church. The blood of David flowed in his veins. He had all the Jew\'s pride in the special privileges of the chosen race. The Jews respected him and the Christians revered him. No man among them commanded the esteem of the entire population as much as he.<P>Josephus (Ant., XX, ix) tells us that Ananus the high priest had James stoned to death, and that the most equitable of the citizens immediately rose in revolt against such a lawless procedure, and Ananus was deposed after only three months\' rule. This testimony of Josephus simply substantiates all that we know from other sources concerning the high standing of James in the whole community. Hegesippus says that James was first thrown from a pinnacle of the temple, and then they stoned him because he was not killed by the fall, and he was finally beaten over the head with a fuller\'s club; and then he adds significantly, "Immediately Vespasian besieged them" (Euscb., HE, II, 23). There would seem to have been quite a widespread conviction among both the Christians and the Jews that the afflictions which fell upon the holy city and the chosen people in the following years were in part a visitation because of the great crime of the murder of this just man. We can understand how a man with this reputation and character would write an epistle so Jewish in form and substance and so insistent in its demands for a practical morality as is the Epistle of James. All the characteristics of the epistle seem explicable on the supposition of authorship by James the brother of the Lord. We accept the church tradition without hesitation.<P>III. The Style of the Epistle.<P>1. Plainness:<P>The sentence construction is simple and straightforward. It reminds us of the English of Bunyan and DeFoe. There is usually no good reason for misunderstanding anything James says. He puts his truth plainly, and the words he uses have no hidden or mystical meanings. His thought is transparent as his life.<P>2. Good Greek:<P>It is somewhat surprising to find that the Greek of the Epistle of James is better than that of the other New Testament writers, with the single exception of the author of the Epistle to the Hebrews. Of course this may be due to the fact that James had the services of an amanuensis who was a Greek scholar, or that his own manuscript was revised by such a man; but, although unexpected, it is not impossible that James himself may have been capable of writing such Greek as this.<P>It is not the good Greek of the classics, and it is not the poor and provincial Greek of Paul. There is more care for literary form than in the uncouth periods of the Gentile apostle, and the vocabulary would seem to indicate an acquaintance with the literary as well as the commercial and the conversational Greek "Galilee was studded with Greek towns, and it was certainly in the power of any Galilean to gain a knowledge of Greek...We may reasonably suppose that our author would not have scrupled to avail himself of the opportunities within his reach, so as to master the Greek language, and learn something of Greek philosophy. This would be natural, even if we think of James as impelled only by a desire to gain wisdom and knowledge for himself; but if we think of him also as the principal teacher of the Jewish believers, many of whom were Hellenists, instructed in the wisdom of Alexandria, then the natural bent would take the shape of duty: he would be a student of Greek in order that he might be a more effective instructor to his own people" (Mayor, The Epistle of James, ccxxxvi). The Greek of the epistle is the studied Greek of one who was not a native to it, but who had familiarized himself with its literature. James could have done so and the epistle may be proof that he did.<P>3. Vividness:<P>James is never content to talk in abstractions. He always sets a picture before his own eyes and those of his readers. He has the dramatic instinct. He has the secret of sustained interest. He is not discussing things in general but things in particular. He is an artist and believes in concrete realities. At the same time he has a touch of poetry in him, and a fine sense of the analogies running through all Nature and all life. The doubting man is like the sea spume (<a onClick="return mV(\'Jam\',1,6);">1:6</a>). The rich man fades away in his goings, even as the beauty of the flower falls and perishes (<a onClick="return mV(\'Jam\',1,11);">1:11</A>). The synagogue scene with its distinction between the rich and the poor is set before us with the clear-cut impressiveness of a cameo (<a onClick="return mV(\'Jam\',2,\'1-4\');">2:1-4</A>). The Pecksniffian philanthropist, who seems to think that men can be fed not by bread alone but by the words that proceed magnificently from his mouth, is pilloried here for all time (<a onClick="return mV(\'Jam\',2,15,16);">2:15,16</A>). The untamable tongue that is set on fire of hell is put in the full blaze of its world of iniquity, and the damage it does is shown to be like that of a forest fire (<a onClick="return mV(\'Jam\',3,\'1-12\');">3:1-12</a>). The picture of the wisdom that comes from above with its sevenfold excellences of purity, peaceableness, gentleness, mercy, fruitfulness, impartiality, sincerity, is worthy to hang in the gallery of the world\'s masterpieces (<a onClick="return mV(\'Jam\',3,17);">3:17</A>). The vaunting tradesmen, whose lives are like vanishing vapor, stand there before the eyes of all in Jerusalem (<a onClick="return mV(\'Jam\',4,\'13-16\');">4:13-16</A>). The rich, whose luxuries he describes even while he denounces their cruelties and prophesies their coming day of slaughter, are the rich who walk the streets of his own city (<a onClick="return mV(\'Jam\',5,\'1-6\');">5:1-6</a>). His short sentences go like shots straight to the mark. We feel the impact and the impress of them. There is an energy behind them and a reality in them that makes them live in our thought. His abrupt questions are like the quick interrogations of a cross-examining lawyer (<a onClick="return mV(\'Jam\',2,\'4-7\',14,16);">2:4-7,14,16</A>; <a onClick="return mV(\'Jam\',3,11,12);">3:11,12</A>; <a onClick="return mV(\'Jam\',4,1,4,5,12,14);">4:1,4,5,12,14</A>). His proverbs have the intensity of the accumulated and compressed wisdom of the ages. They are irreducible minimums. They are memorable sayings, treasured in the speech of the world ever since his day.<P>4. Duadiplosis:<P>Sometimes James adds sentence to sentence with the repetition of some leading word or phrase (<a onClick="return mV(\'Jam\',1,\'1-6\',\'19-24\');">1:1-6,19-24</a>; <a onClick="return mV(\'Jam\',3,\'2-8\');">3:2-8</A>). It is the painful style of one who is not altogether at home with the language which he has chosen as the vehicle of his thought. It is the method by which a discussion could be continued indefinitely. Nothing but the vividness of the imagery and the intensity of the thought saves James from fatal monotony in the use of this device.<P>5. Figures of Speech:<P>James has a keen eye for illustrations. He is not blind to the beauties and wonders of Nature. He sees what is happening on every hand, and he is quick to catch any homiletical suggestion it may hold. Does he stand by the seashore? The surge that is driven by the wind and tossed reminds him of the man who is unstable in all his ways, because he has no anchorage of faith, and his convictions are like driftwood on a sea of doubt (<a onClick="return mV(\'Jam\',1,6);">1:6</A>). Then he notices that the great ships are turned about by a small rudder, and he thinks how the tongue is a small member, but it accomplishes great things (<a onClick="return mV(\'Jam\',3,4,5);">3:4,5</A>). Does he walk under the sunlight and rejoice in it as the source of so many good and perfect gifts? He sees in it an image of the goodness of God that is never eclipsed and never exhausted, unvarying for evermore (<a onClick="return mV(\'Jam\',1,17);">1:17</A>). He uses the natural phenomena of the land in which he lives to make his meaning plain at every turn: the flower of the field that passes away (<a onClick="return mV(\'Jam\',1,10,11);">1:10,11</a>), the forest fire that sweeps the mountain side and like a living torch lights up the whole land (<a onClick="return mV(\'Jam\',3,5);">3:5</a>), the sweet and salt springs (<a onClick="return mV(\'Jam\',3,11);">3:11</A>), the fig trees and the olive trees and the vines (<a onClick="return mV(\'Jam\',3,12);">3:12</a>), the seed-sowing and the fruit-bearing (<a onClick="return mV(\'Jam\',3,18);">3:18</a>), the morning mist immediately lost to view (<a onClick="return mV(\'Jam\',4,14);">4:14</a>), the early and the latter rain for which the husbandman waiteth patiently (<a onClick="return mV(\'Jam\',5,7);">5:7</a>).<P>There is more of the appreciation of Nature in this one short Epistle of James than in all the epistles of Paul put together. Human life was more interesting to Paul than natural scenery. However, James is interested in human life just as profoundly as Paul. He is constantly endowing inanimate things with living qualities. He represents sin as a harlot, conceiving and bringing forth death (<a onClick="return mV(\'Jam\',1,15);">1:15</a>). The word of truth has a like power and conceives and brings forth those who live to God\'s praise (<a onClick="return mV(\'Jam\',1,18);">1:18</a>). Pleasures are like joyful hosts of enemies in a tournament, who deck themselves bravely and ride forth with singing and laughter, but whose mission is to wage war and to kill (<a onClick="return mV(\'Jam\',4,1,2);">4:1,2</a>). The laborers may be dumb in the presence of the rich because of their dependence and their fear, but their wages, fraudulently withheld, have a tongue, and cry out to high heaven for vengeance (<a onClick="return mV(\'Jam\',5,4);">5:4</a>). What is friendship with the world? It is adultery, James says (<a onClick="return mV(\'Jam\',4,4);">4:4</a>). The rust of unjust riches testifies against those who have accumulated them, and then turns upon them and eats their flesh like fire (<a onClick="return mV(\'Jam\',5,3);">5:3</a>). James observed the man who glanced at himself in the mirror in the morning, and saw that his face was not clean, and who went away and thought no more about it for that whole day, and he found in him an illustration of the one who heard the word and did not do it (<a onClick="return mV(\'Jam\',1,23,24);">1:23,24</a>). The epistle is full of these rhetorical figures, and they prove that James was something of a poet at heart, even as Jesus was. He writes in prose, but there is a marked rhythm in all of his speech. He has an ear for harmony as he has an eye for beauty everywhere.<P>6. Unlikeness to Paul:<P>The Pauline epistles begin with salutations and close with benedictions. They are filled with autobiographical touches and personal messages. None of these things appear here. The epistle begins and ends with all abruptness. It has an address, but no thanksgiving. There are no personal messages and no indications of any intimate personal relationship between the author and his readers. They are his "beloved brethren." He knows their needs and their sins, but he may never have seen their faces or visited their homes. The epistle is more like a prophet\'s appeal to a nation than a personal letter.<P>7. Likeness to Jesus:<P>Both the substance of the teaching and the method of its presentation remind us of the discourses of Jesus. James says less about the Master than any other writer in the New Testament, but his speech is more like that of the Master than the speech of any one of them. There are at least ten parallels to the Sermon on the Mount in this short epistle, and for almost everything that James has to say we can recall some statement of Jesus which might have suggested it. When the parallels fail at any point, we are inclined to suspect that James may be repeating some unrecorded utterance of our Lord. He seems absolutely faithful to his memory of his brother\'s teaching. He is the servant of Jesus in all his exhortation and persuasion.<P>Did the Master shock His disciples\' faith by the loftiness of the Christian ideal He set before them in His great sermon, "Ye therefore shall be perfect, as your heavenly Father is perfect" (<a onClick="return mV(\'Mat\',5,48);">Mt 5:48</a>)? James sets the same high standard in the very forefront of his ep.: "Let patience have its perfect work, that ye may be perfect and entire, lacking in nothing" (<a onClick="return mV(\'Jam\',1,4);">1:4</a>). Did the Master say, "Ask, and it shall be given you" (<a onClick="return mV(\'Mat\',7,7);">Mt 7:7</a>)? James says, "If any of you lacketh wisdom, let him ask of God ....; and it shall be given him" (<a onClick="return mV(\'Jam\',1,5);">1:5</a>). Did the Master add a condition to His sweeping promise to prayer and say, "Whosoever...shall not doubt in his heart, but shall believe that what he saith cometh to pass; he shall have it" (<a onClick="return mV(\'Mar\',11,23);">Mr 11:23</a>)? James hastens to add the same condition, "Let him ask in faith, nothing doubting: for he that doubteth is like the surge of the sea driven by the wind and tossed" (<a onClick="return mV(\'Jam\',1,6);">1:6</a>). Did the Master close the great sermon with His parable of the Wise Man and the Foolish Man, saying, "Every one that heareth these words of mine, and doeth them, shall be likened unto a wise man. And every one that heareth these words of mine, and doeth them not, shall be likened unto a foolish man" (<a onClick="return mV(\'Mat\',7,24,26);">Mt 7:24, 26</a>)? James is much concerned about wisdom, and therefore he exhorts his readers, "Be ye doers of the word, and not hearers only, deluding your own selves" (<a onClick="return mV(\'Jam\',1,22);">1:22</a>). Had the Master declared, "If ye know these things, blessed are ye if ye do them" (<a onClick="return mV(\'Jhn\',13,17);">Joh 13:17</a>)? James echoes the thought when he says, "A doer that worketh, this man shall be blessed in his doing" (<a onClick="return mV(\'Jam\',1,25);">1:25</a>). Did the Master say to the disciples, "Blessed are ye poor: for yours is the kingdom of God" (<a onClick="return mV(\'Luk\',6,20);">Lu 6:20</a>)? James has the same sympathy with the poor, and he says, "Hearken, my beloved brethren; did not God choose them that are poor as to the world to be rich in faith, and heirs of the kingdom which he promised to them that love him?" (<a onClick="return mV(\'Jam\',2,5);">2:5</a>). Did the Master inveigh against the rich, and say, "Woe unto you that are rich! for ye have received your consolation. Woe unto you, ye that are full now! for ye shall hunger. Woe unto you, ye that laugh now! for ye shall mourn and weep" (<a onClick="return mV(\'Luk\',6,24,25);">Lu 6:24-25</a>)? James bursts forth into the same invective and prophesies the same sad reversal of fortune, "Come now, ye rich, weep and howl for your miseries that are coming upon you" (<a onClick="return mV(\'Jam\',5,1);">5:1</A>). "Cleanse your hands, ye sinners; and purify your hearts, ye doubleminded. Be afflicted, and mourn, and weep: let your laughter be turned to mourning, and your joy to heaviness" (<a onClick="return mV(\'Jam\',4,8,9);">4:8,9</A>). Had Jesus said, "Judge not, that ye be not judged" (<a onClick="return mV(\'Mat\',7,1);">Mt 7:1</a>)? James repeats the exhortation, "Speak not one against another, brethren. He that...judgeth his brother...judgeth the law:...but who art thou that judgest thy neighbor?" (<a onClick="return mV(\'Jam\',4,11,12);">4:11,12</A>). Had Jesus said, "Whosoever shall humble himself shall be exalted" (<a onClick="return mV(\'Mat\',23,12);">Mt 23:12</a>)? We find the very words in James, "Humble yourselves in the sight of the Lord, and he shall exalt you" (<a onClick="return mV(\'Jam\',4,10);">4:10</A>). Had Jesus said, "I say unto you, Swear not at all; neither by the heaven, for it is the throne of God; nor by the earth, for it is the footstool of his feet....But let your speech be, Yea, yea; Nay, nay: and whatsoever is more than these is of the evil one" (<a onClick="return mV(\'Mat\',5,\'34-37\');">Mt 5:34-37</a>)? Here in James we come upon the exact parallel: "But above all things, my brethren, swear not, neither by the heaven, nor by the earth, nor by any other oath; but let your yea be yea, and your nay, nay; that ye fall not under judgment" (<a onClick="return mV(\'Jam\',15,12);">5:12</A>). We remember how the Master began the Sermon on the Mount with the declaration that even those who mourned and were persecuted and reviled and reproached were blessed, in spite of all their suffering and trial. Then we notice that James begins his epistle with the same paradoxical putting of the Christian faith, "Count it all joy, my brethren, when ye fall into manifold trials" (<a onClick="return mV(\'Jam\',1,12);">1:12</A>, the American Revised Version margin). We remember how Jesus proceeded in His sermon to set forth the spiritual significance and the assured permanence of the law; and we notice that James treats the law with the same respect and puts upon it the same high value. He calls it "the perfect law" (<a onClick="return mV(\'Jam\',1,25);">1:25</A>), "the royal law" (<a onClick="return mV(\'Jam\',2,8);">2:8</A>), the "law of liberty" (<a onClick="return mV(\'Jam\',2,12);">2:12</a>). We remember what Jesus said about forgiving others in order that we ourselves may be forgiven; and we know where James got his authority for saying, "Judgment is without mercy to him that hath showed no mercy" (<a onClick="return mV(\'Jam\',2,13);">2:13</a>). We remember all that the Master said about good trees and corrupt trees being known by their fruits, "Do men gather grapes of thorns, or figs of thistles?" (<a onClick="return mV(\'Mat\',7,\'16-20\');">Mt 7:16-20</a>). Then in the Epistle of James we find a like question, "Can a fig tree, my brethren, yield olives, or a vine figs?" (<a onClick="return mV(\'Jam\',3,12);">3:12</A>). We remember that the Master said, "Know ye that he is nigh, even at the doors" (<a onClick="return mV(\'Mat\',24,33);">Mt 24:33</a>). We are not surprised to find the statement here in James, "Behold, the judge standeth before the doors" (<a onClick="return mV(\'Jam\',5,9);">5:9</A>). These reminiscences of the sayings of the Master meet us on every page. It may be that there are many more of them than we are able to identify. Their number is sufficiently large, however, to show us that James is steeped in the truths taught by Jesus, and not only their substance but their phraseology constantly reminds us of Him.<P>IV. Date of the Epistle.<P>There are those who think that the Epistle of James is the oldest epistle in the New Testament. Among those who favor an early date are Mayor, Plumptre, Alford, Stanley, Renan, Weiss, Zahn, Beyschlag, Neander, Schneckenburger, Thiersch, and Dods.<P>The reasons assigned for this conclusion are:<p class="in15">(1) the general Judaic tone of the ep., which seems to antedate admission of the Gentiles in any alarming numbers into the church; but since the epistle is addressed only to Jews, why should the Gentiles be mentioned in it, whatever its date? and<p class="in15">(2) the fact that Paul and Peter are supposed to have quoted from James in their writing; but this matter of quotation is always an uncertain one, and it has been ably argued that the quotation has been the other way about.<P>Others think that the epistle was written toward the close of James\'s life. Among these are Kern, Wiesinger, Schmidt, Bruckner, Wordsworth, and Farrar.<P>These argue<P>(1) that the epistle gives evidence of a considerable lapse of time in the history of the church, sufficient to allow of a declension from the spiritual fervor of Pentecost and the establishment of distinctions among the brethren; but any of the sins mentioned in the epistle in all probability could have been found in the church in any decade of its history.<P>(2) James has a position of established authority, and those to whom he writes are not recent converts but members in long standing; but the position of James may have been established from a very early date, and in an encyclical of this sort we could not expect any indication of shorter or longer membership in the church. Doubtless some of those addressed were recent converts, while others may have been members for many years.<P>(3) There are references to persecutions and trials which fit the later rather than the earlier date; but all that is said on this subject might be suitable in any period of the presidency of James at Jerusalem.<P>(4) There are indications of a long and disappointing delay in the Second Coming of the Lord in the repeated exhortation to patience in waiting for it; but on the other hand James says, "The coming of the Lord is at hand," and "The judge standeth before the doors" (<a onClick="return mV(\'Jam\',5,\'7-9\');">5:7-9</a>). The same passage is cited in proof of a belief that the immediate appearance of the Lord was expected, as in the earliest period of the church, and in proof that there had been a disappointment of this earlier belief and that it had been succeeded by a feeling that there was need of patience in waiting for the coming so long delayed.<P>It seems clear to us that there are no decisive proofs in favor of any definite date for the epistle. It must have been written before the martyrdom of James in the year 63 AD, and at some time during his presidency over the church at Jerusalem; but there is nothing to warrant us in coming to any more definite conclusion than that Davidson, Hilgenfeld, Baur, Zeller, Hausrath, von Soden, Julicher, Harnack, Bacon and others date the epistle variously in the post-Pauline period, 69-70 to 140-50 AD. The arguments for any of these dates fall far short of proof, rest largely if not wholly upon conjectures and presuppositions, and of course are inconsistent with any belief in the authorship by James.<P>V. History of the Epistle.<P>Eusebius classed James among those whose authenticity was disputed by some. "James is said to be the author of the first of the so-called Catholic Epistles. But it is to be observed that it is disputed; at least, not many of the ancients have mentioned it, as is the case likewise with the epistle that bears the name of Jude, which is also one of the seven so-called Catholic Epistles. Nevertheless, we know that these also, with the rest, have been read publicly in most churches" (Historia Ecclesiastica, II, 23). Eusebius himself, however, quotes <a onClick="return mV(\'Jam\',4,11);">Jas 4:11</a> as Scripture and <a onClick="return mV(\'Jam\',5,13);">Jas 5:13</a> as spoken by the holy apostle. Personally he does not seem disposed to question the genuineness of the epistle. There are parallels in phraseology which make it possible that the epistle is quoted in Clement of Rome in the 1st century, and in Ignatius, Polycarp, Justin Martyr, the Epistle to Diognetus, Irenaeus, and Hermas in the 2nd century. It is omitted in the canonical list of the Muratorian Fragment and was not included in the Old Latin version. Origen seems to be the first writer to quote the epistle explicitly as Scripture and to assert that it was written by James the brother of the Lord. It appears in the Peshitta version and seems to have been generally recognized in the East. Cyril of Jerusalem, Gregory of Nazianzus, Ephraem of Edessa, Didymus of Alexandria, received it as canonical. The 3rd Council of Carthage in 397 AD finally settled its status for the Western church, and from that date in both the East and the West its canonicity was unquestioned until the time of the Reformation.<P>Erasmus and Cajetan revived the old doubts concerning it. Luther thought it contradicted Paul and therefore banished it to the appendix of his Bible. "James," he says, "has aimed to refute those who relied on faith without works, and is too weak for his task in mind, understanding, and words, mutilates the Scriptures, and thus directly contradicts Paul and all Scriptures, seeking to accomplish by enforcing the law what the apostles successfully effect by love. Therefore, I will not place his Epistle in my Bible among the proper leading books" (Werke, XIV, 148). He declared that it was a downright strawy epistle, as compared with such as those to the Romans and to the Galatians, and it had no real evangelical character. This judgment of Luther is a very hasty and regrettable one. The modern church has refused to accept it, and it is generally conceded now that Paul and James are in perfect agreement with each other, though their presentation of the same truth from opposite points of view brings them into apparent contradiction. Paul says, "By grace have ye been saved through faith...not of works, that no man should glory" (<a onClick="return mV(\'Eph\',2,8,9);">Eph 2:8-9</a>). "We reckon therefore that a man is justified by faith apart from the works of the law" (<a onClick="return mV(\'Rom\',3,28);">Ro 3:28</a>). James says, "Faith, if it have not works, is dead in itself" (<a onClick="return mV(\'Jam\',2,17);">2:17</A>). "Ye see that by works a man is justified, and not only by faith (<a onClick="return mV(\'Jam\',2,24);">2:24</A>). With these passages before him Luther said, "Many have toiled to reconcile Paul with James...but to no purpose, for they are contrary, \'Faith justifies\';\' Faith does not justify\'; I will pledge my life that no one can reconcile those propositions; and if he succeeds he may call me a fool" (Colloquia, II, 202).<P>It would be difficult to prove Luther a fool if Paul and James were using these words, faith, works, and justification, in the same sense, or even if each were writing with full consciousness of what the other had written. They both use Abraham for an example, James of justification by works, and Paul of justification by faith. How can that be possible? The faith meant by James is the faith of a dead orthodoxy, an intellectual assent to the dogmas of the church which does not result in any practical righteousness in life, such a faith as the demons have when they believe in the being of God and simply tremble before Him. The faith meant by Paul is intellectual and moral and spiritual, affects the whole man, and leads him into conscious and vital union and communion with God. It is not the faith of demons; it is the faith that redeems. Again, the works meant by Paul are the works of a dead legalism, the works done under a sense of compulsion or from a feeling of duty, the works done in obedience to a law which is a taskmaster, the works of a slave and not of a son. These dead works, he declares, can never give life. The works meant by James are the works of a believer, the fruit of the faith and love born in every believer\'s heart and manifest in every believer\'s life. The possession of faith will insure this evidence in his daily conduct and conversation; and without this evidence the mere profession of faith will not save him. The justification meant by Paul is the initial justification of the Christian life. No doing of meritorious deeds will make a man worthy of salvation. He comes into the kingdom, not on the basis of merit but on the basis of grace. The sinner is converted not by doing anything, but by believing on the Lord Jesus Christ. He approaches the threshold of the kingdom and he finds that he has no coin that is current there. He cannot buy his way in by good works; he must accept salvation by faith, as the gift of God\'s free grace. The justification meant by James is the justification of any after-moment in the Christian life, and the final justification before the judgment throne. Good works are inevitable in the Christian life. There can be no assurance of salvation without them.<P>Paul is looking at the root; James is looking at the fruit. Paul is talking about the beginning of the Christian life; James is talking about its continuance and consummation. With Paul, the works he renounces precede faith and are dead works. With James, the faith he denounces is apart from works and is a dead faith.<P>Paul believes in the works of godliness just as much as James. He prays that God may establish the Thessalonians in every good work (<a onClick="return mV(\'2Th\',2,17);">2Th 2:17</a>). He writes to the Corinthians that "God is able to make all grace abound unto" them; that they, "having always all sufficiency in everything, may abound unto every good work" (<a onClick="return mV(\'2Cr\',9,8);">2Co 9:8</a>). He declares to the Ephesians that "we are his workmanship, created in Christ Jesus for good works, which God afore prepared that we should walk in them" (<a onClick="return mV(\'Eph\',2,10);">Eph 2:10</a>). He makes a formal statement of his faith in Romans: God "will render to every man according to his works: to them that by patience in well-doing seek for glory and honor and incorruption, eternal life: but unto them that are factious, and obey not the truth, but obey unrighteousness, shall be wrath and indignation, tribulation and anguish, upon every soul of man that worketh evil, of the Jew first, and also of the Greek; but glory and honor and peace to every man that worketh good, to the Jew first, and also to the Greek" (<a onClick="return mV(\'Rom\',2,\'6-10\');">Ro 2:6-10</a>). This is the final justification discussed by James, and it is just as clearly a judgment by works with Paul as with him.<P>On the other hand James believes in saving faith as well as Paul. He begins with the statement that the proving of our faith works patience and brings perfection (<a onClick="return mV(\'Jam\',1,3,4);">1:3,4</a>). He declares that the prayer of faith will bring the coveted wisdom (<a onClick="return mV(\'Jam\',1,6);">1:6</a>). He describes the Christian profession as a holding "the faith of our Lord Jesus Christ, the Lord of glory" (<a onClick="return mV(\'Jam\',2,1);">2:1</A>). He says that the poor as to the world are rich in faith, and therefore heirs to the kingdom (<a onClick="return mV(\'Jam\',2,5);">2:5</A>). He quotes the passage from Genesis, "Abraham believed God, and it was reckoned unto him for righteousness" (<a onClick="return mV(\'Jam\',2,23);">2:23</a>), and he explicitly asserts that Abraham\'s "faith wrought with his works, and by works was faith made perfect" (<a onClick="return mV(\'Jam\',2,22);">2:22</a>). The faith mentioned in all these passages is the faith of the professing Christian; it is not the faith which the sinner exercises in accepting salvation. James and Paul are at one in declaring that faith and works must go hand in hand in the Christian life, and that in the Christian\'s experience both faith without works is dead and works without faith are dead works. They both believe in faith working through love as that which alone will avail in Christ Jesus (<a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>). Fundamentally they agree. Superficially they seem to contradict each other. That is because they are talking about different things and using the same terms with different meanings for those terms in mind.<P>VI. Message of the Epistle to Our Times.<P>1. To the Pietist:<
