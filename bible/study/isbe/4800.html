P>There are those who talk holiness and are hypocrites; those who make profession of perfect love and yet cannot live peaceably with their brethren; those who are full of pious phraseology but fail in practical philanthropy. This epistle was written for them. It may not give them much comfort, but it ought to give them much profit. The mysticism that contents itself with pious frames and phrases and comes short in actual sacrifice and devoted service will find its antidote here. The antinomianism that professes great confidence in free grace, but does not recognize the necessity for corresponding purity of life, needs to ponder the practical wisdom of this epistle. The quietists who are satisfied to sit and sing themselves away to everlasting bliss ought to read this epistle until they catch its bugle note of inspiration to present activity and continuous good deeds. All who are long on theory and short on practice ought to steep themselves in the spirit of James; and since there are such people in every community and in every age, the message of the epistle will never grow old.<P>2. To the Sociologist:<P>The sociological problems are to the front today. The old prophets were social reformers, and James is most like them in the New Testament. Much that he says is applicable to present-day conditions. He lays down the right principles for practical philanthropy, and the proper relationships between master and man, and between man and man. If the teachings of this epistle were put into practice throughout the church it would mean the revitalization of Christianity. It would prove that the Christian religion was practical and workable, and it would go far to establish the final brotherhood of man in the service of God.<P>3. To the Student of the Life and Character of Jesus:<P>The life of our Lord is the most important life in the history of the race. It will always be a subject of the deepest interest and study. Modern research has penetrated every contributory realm for any added light upon the heredity and the environment of Jesus. The people and the land, archaeology and contemporary history, have been cultivated intensively and extensively for any modicum of knowledge they might add to our store of information concerning the Christ. We suggest that there is a field here to which sufficient attention has not yet been given. James was the brother of the Lord. His epistle tells us much about himself. On the supposition that he did not exhort others to be what he would not furnish them an example in being, we read in this epistle his own character writ large. He was like his brother in so many things. As we study the life and character of James we come to know more about the life and character of Jesus.<P>Jesus and James had the same mother. From her they had a common inheritance. As far as they reproduced their mother\'s characteristics they were alike. They had the same home training. As far as the father in that home could succeed in putting the impress of his own personality upon the boys, they would be alike. It is noticeable in this connection that Joseph is said in the Gospel to have been "a just man" (<a onClick="return mV(\'Mat\',1,19);">Mt 1:19</a> the King James Version), and that James came to be known through all the early church as James the Just, and that in his epistle he gives this title to his brother, Jesus, when he says of the unrighteous rich of Jerusalem, "Ye have condemned and killed the just" man (<a onClick="return mV(\'Jam\',5,6);">5:6</A> the King James Version). Joseph was just, and James was just, and Jesus was just. The brothers were alike, and they were like the father in this respect. The two brothers seem to think alike and talk alike to a most remarkable degree. They represent the same home surroundings and human environment, the same religious training and inherited characteristics. Surely, then, all that we learn concerning James will help us the better to understand Jesus.<P>They are alike in their poetical insight and their practical wisdom. They are both fond of figurative speech, and it seems always natural and unforced. The discourses of Jesus are filled with birds and flowers and winds and clouds and all the sights and sounds of rural life in Palestine. The writings of James abound in reference to the field flowers and the meadow grass and the salt fountains and the burning wind and the early and the latter rain. They are alike in mental attitude and in spiritual alertness. They have much in common in the material equipment of their thought. James was well versed in the apocryphal literature. May we not reasonably conclude that Jesus was just as familiar with these books as he? James seems to have acquired a comparative mastery of the Greek language and to have had some acquaintance with the Greek philosophy. Would not Jesus have been as well furnished in these lines as he?<P>What was the character of James? All tradition testifies to his personal purity and persistent devotion, commanding the reverence and the respect of all who knew him. As we trace the various elements of his character manifesting themselves in his anxieties and exhortations in this epistle, we find rising before us the image of Jesus as well as the portrait of James. He is a single-minded man, steadfast in faith and patient in trials. He is slow to wrath, but very quick to detect any sins of speech and hypocrisy of life. He is full of humility, but ready to champion the cause of the oppressed and the poor. He hates all insincerity and he loves wisdom, and he believes in prayer and practices it in reference to both temporal and spiritual good. He believes in absolute equality in the house of God. He is opposed to anything that will establish any distinctions between brethren in their place of worship. He believes in practical philanthropy. He believes that the right sort of religion will lead a man to visit the fatherless and widows in their affliction, and to keep himself unspotted from the world. A pure religion in his estimation will mean a pure man. He believes that we ought to practice all that we preach.<P>As we study these characteristics and opinions of the younger brother, does not the image of his and our Elder Brother grow ever clearer before our eyes?<P>LITERATURE.<P>Works on Introduction: by Zahn, Weiss, Julicher, Salmon, Dods, Bacon, Bennett and Adeney; MacClymont, The New Testament and Its Writers; Farrar, The Messages of the Books, and Early Days of Christianity; Fraser, Lectures on the Bible; Godet, Biblical Studies. Works on the Apostolic Age: McGiffert, Schaff, Hausrath, Weizsacker. Commentaries: Mayor, Hort, Beyschlag, Dale, Huther, Plummer, Plumptre, Stier.``73';

isbe[4831]='Jamin`ja\'-min (yamin, "right hand"):<P>(1) In <a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>; <a onClick="return mV(\'Num\',26,12);">Nu 26:12</a>; <a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a>, a "son" (clan) of Simeon.<P>(2) In <a onClick="return mV(\'1Ch\',2,27);">1Ch 2:27</a>, a Judahite, "son" of Ram and grandson of Jerahmeel.<P>(3) In <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>, a Levite (?), one of those who "caused the people to understand" the Torah when Ezra enforced it = "Iadinus" in 1Esdras 9:48.``1';
isbe[4832]='Jaminites`ja\'-min-its (ha-yamini, coll. with article): In <a onClick="return mV(\'Num\',26,12);">Nu 26:12</a>, descendants of Jamin (1) above).``1';
isbe[4833]='Jamlech`jam\'-lek (yamlekh, "may he (God) cause to reign"): A "prince" or chief of the tribe of Simeon (<a onClick="return mV(\'1Ch\',4,34);">1Ch 4:34</a>). If <a onClick="return mV(\'1Ch\',4,41);">4:41</a> refers to the preceding list, he lived in the time of Hezekiah.``1';
isbe[4834]='Jamnia`jam\'-ni-a.`<a href="./study/isbe/search.html?string=JABNEEL">JABNEEL</a>`1';
isbe[4835]='Jamnites`jam\'-nits (Iamnitai): The inhabitants (2Macc 12:9) of Jamnia, the ancient Jabneel, a town on the northern border of Judah near the sea. Its port and navy were burned by Judas Maccabeus (loc. cit.).``1';
isbe[4836]='Janai`ja\'-na-i, ja\'-ni (ya\'nay, "he answers"; as to whether final "y" is the third radical (letter), or may be taken as equivalent to the Divine name Yah, see HPN, 149-51): A chief of a family descended from Gad (<a onClick="return mV(\'1Ch\',5,12);">1Ch 5:12</a>, the King James Version "Jaanai").``1';
isbe[4837]='Jangling`jan\'-gling (mataiologia, "vain discourse" "babbling"): This word is not found in the American Standard Revised Version; once only in the King James Version (<a onClick="return mV(\'1Ti\',1,6);">1Ti 1:6</a>). The American Standard Revised Version has "vain talking," instead of "vain jangling," and evidently means proud, self-conceited talking against what God has revealed and against God Himself.``1';
isbe[4838]='Janim`ja\'-nim (yanim; the King James Version Janum): A place in the Hebron uplands named with Eshan and Beth-tappuah (<a onClick="return mV(\'Jos\',15,53);">Jos 15:53</a>); unidentified.``1';
isbe[4839]='Jannai`jan\'-a-i (Iannai, Tischendorf, Tregelles, Westcott and Hort, The New Testament in Greek; Ianna, Textus Receptus of the New Testament; the King James Version Janna); An ancestor of Jesus in Luke\'s genealogy, the 5th before Joseph, the husband of Mary (<a onClick="return mV(\'Luk\',3,24);">Lu 3:24</a>).``1';
isbe[4840]='Jannes And Jambres`jan\'-ez, jam\'-brez (Iannes kai Iambres, <a onClick="return mV(\'2Ti\',3,8);">2Ti 3:8</a>):<P>1. Egyptian Magicians:<P>These are the names of two magicians in ancient Egypt, who withstood Moses before Pharaoh. This is the only place where the names occur in the New Testament, and they are not mentioned in the Old Testament at all. In <a onClick="return mV(\'Exd\',7,11,22);">Ex 7:11, 22</a> Egyptian magicians are spoken of, who were called upon by Pharaoh to oppose Moses and Aaron: "Then Pharaoh also called for the wise men and the sorcerers: and they also, the magicians of Egypt, did in like manner with their enchantments." Jannes and Jambres were evidently two of the persons referred to in this passage. It should be observed that the word translated here "magicians" occurs also in <a onClick="return mV(\'Gen\',41,8);">Ge 41:8</a> in connection with Pharaoh\'s dreams: Pharaoh "sent and called for all the magicians of Egypt, and all the wise men thereof." the Revised Version margin reads for "magicians" "or sacred scribes." The Hebrew word is chartummim, and means sacred scribes who were skilled in the sacred writing, that is in the hieroglyphics; they were a variety of Egyptian priests. Jannes and Jambres were doubtless members of one or other of the various classes spoken of in the passages in Exodus and Genesis, the wise men, the sorcerers, and the magicians or sacred scribes.<P>2. Mentioned by Pliny and Others:<P>Jannes and Jambres, one or both, are also mentioned by Pliny (23-79 AD), by Apuleius (circa 130 AD), both of whom speak of Moses and Jannes as famous magicians of antiquity. The Pythagorean philosopher Numenius (2nd century AD) speaks of Jannes and Jambres as Egyptian hierogrammateis, or sacred scribes.<P>3. Traditions:<P>There are many curious Jewish traditions regarding Jannes and Jambres. These traditions, which are found in the Targum and elsewhere, are full of contradictions and impossibilities and anachronisms. They are to the effect that Jannes and Jambres were sons of Balaam, the soothsayer of Pethor. Notwithstanding this impossibility in the matter of date, they were said to have withstood Moses 40 years previously at the court of Pharaoh, to whom it was also said, they so interpreted a dream of that king, as to foretell the birth of Moses and cause the oppression of the Israelites. They are also said to have become proselytes, and it is added that they left Egypt at the Exodus, among the mixed multitude. They are reported to have instigated Aaron to make the golden calf. The traditions of their death are also given in a varying fashion. They were said to have been drowned in the Red Sea, or to have been put to death after the making of the golden calf, or during the slaughter connected with the name of Phinehas.<P>4. Origen\'s Statement:<P>According to Origen (Comm. on <a onClick="return mV(\'Mat\',27,8);">Mt 27:8</a>) there was an apocryphal book—not yet rediscovered—called "The Book of Jannes and Jambres." Origen\'s statement is that in <a onClick="return mV(\'2Ti\',3,8);">2Ti 3:8</a> Paul is quoting from that book.<P>5. Derivation:<P>In the Targumic literature "Mambres" occurs as a variant reading instead of "Jambres." It is thought that Jambres is derived from an Aramaic root, meaning "to oppose," the participle of which would be Mambres. The meaning of either form is "he who opposes." Jannes is perhaps a corruption of Ioannes or Iohannes (John).``155';
isbe[4841]='Jannes And Jambres, Book of`An apocryphal work condemned by Pope Gelasius.`<a href="./study/isbe/search.html?string=JANNES+AND+JAMBRES">JANNES AND JAMBRES</a>`1';
isbe[4842]='Janoah`ja-no\'-a (yanoach, "resting-place"):<P>(1) A place named on the eastern boundary of Ephraim (<a onClick="return mV(\'Jos\',16,6);">Jos 16:6</a>f; the King James Version "Janohah"). Eusebius, Onomasticon (s.v. "Jano") places it in Akrabattine, 12 Roman miles east of Neapolis (Nablus). This points definitely to Khirbet Yanun. On a hill near by, the Moslems show the Maqam of Neby Nun, the father of Joshua.<P>(2) A town in the uplands of Naphtali, mentioned as having been captured and depopulated by Tiglathpileser. It is named with Abel-beth-maacah and Kedesh (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). It may be identical with Yanuch, a village about 6 miles east of Tyre.``54';
isbe[4843]='Janum`ja\'-num (Qere, yanum, Kethibh yanim).`<a href="./study/isbe/search.html?string=JANIM">JANIM</a>`1';
isbe[4844]='Japheth (1)`ja\'-feth (yepheth; yapheth; Iapheth):<P>1. Etymologies of Japheth:<P>This name, in <a onClick="return mV(\'Gen\',9,27);">Ge 9:27</a>, seems to be explained by the phrase "may God make wide (yapht, the American Standard Revised Version "enlarge") for Japheth," where yapht and Japheth are represented by the same consonants, but with different vowel-points. The root of yapht is pathach, "to make wide." This etymology, however, is not universally accepted, as the word-play is so obvious, and the association of Japheth with Shem ("dark") and Ham ("black") suggests a name on similar lines—either gentilic, or descriptive of race. Japheth has therefore been explained as meaning "fair," from yaphah, the non-Sem and non-Hamitic races known to the Jews being all more or less whiteskinned. The Targum of Onkelos agrees with the English Versions of the Bible, but that of Jonathan has "God shall beautify Japheth," as though from yaphah.<P>2. His Descendants:<P>The immediate descendants of Japheth were seven in number, and are represented by the nations designated Gomer, Magog, Madai, Javan, Tubal, Mesech, and Tiras; or, roughly, the Armenians, Lydians, Medes, Greeks, Tibarenians, and Moschians, the last, Tiras, remaining still obscure. The sons of Gomer (Ashkenaz, Riphath and Togarmah) were all settled in the West Asian tract; while the sons of Javan (Elisah, Tarshish, Kittim and Dodanim or Rodanim) occupied the Mediterranean coast and the adjacent islands.<P>3. His Place among the Sons of Noah:<P>In <a onClick="return mV(\'Gen\',9,27);">Ge 9:27</a>, as in other passages, Japheth occupies the 3rd place in the enumeration of the sons of Noah, but he is really regarded as the 2nd son, Ham being the youngest. In the genealogical table, however (<a onClick="return mV(\'Gen\',10,1);">Ge 10:1</a>), the descendants of Japheth are given first, and those of Shem last, in order to set forth Semitic affinities at greater length. Though this would seem to indicate that the fair races were the least known to the Jews, it implies that the latter were well disposed toward them, for Japheth was (ultimately) to dwell in the tents of Shem, and therefore to take part in Shem\'s spiritual privileges.<P>4. Japheth and Iapetos:<P>It seems unlikely that the Greek giant-hero, Iapetos, father of Prometheus, who was regarded by the Greeks as the father of the human race, has any connection with the Hebrew Japheth. The original of the Hebrew record probably belongs to a date too early to admit borrowing from the Greek, and if the name had been borrowed by the Greeks from the Hebrews, a nearer form might be expected.`<a href="./study/isbe/search.html?string=SHEM">SHEM</a>; <a href="./study/isbe/search.html?string=HAM">HAM</a>; <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>`136';
isbe[4845]='Japheth (2)`ja\'-feth (Iapheth): A region mentioned only in Judith 2:25, where no particulars are given which may lead to its identification. Holofernes "came unto the borders of Japheth, which were toward the south, over against Arabia."``1';
isbe[4846]='Japhia (1)`ja-fi\'-a, jaf\'-i-a (yaphia\', perhaps "tall"; compare Arabic; Iephtha):<P>(1) King of Lachish, one of the 5 "kings of the Amorites" who allied themselves together in an expedition against Gibeon on account of its treaty with the Israelites (<a onClick="return mV(\'Jos\',10,\'3-5\');">Jos 10:3-5</a>). After their discomfiture by Joshua in the battle of Beth-horon (<a onClick="return mV(\'Jos\',10,10);">10:10</A>), "one of the most important in the history of the world" (Stanley), they fled and hid themselves in the cave at Makkedah (<a onClick="return mV(\'Jos\',10,16);">10:16</A>). As Joshua passed, he was informed of this, but, unwilling to delay his pursuit of the fugitives, he ordered great stones to be rolled unto the mouth of the cave, leaving a guard in charge (<a onClick="return mV(\'Jos\',10,17);">10:17</A>f). On the completion of his victory, Joshua returned to Makkedah and commanded the Israelites to bring forth the imprisoned kings, and summoned the chiefs of his army to plant their feet upon their necks. Then he put them to death; and after he had hung their bodies on 5 trees, he ordered the Israelites in the evening to take them down and cast them into the cave (<a onClick="return mV(\'Jos\',10,\'22-27\');">10:22-27</A>).<P>(2) (Septuagint Iephies, Iaphie): One of the sons of David who were born to him at Jerusalem (<a onClick="return mV(\'2Sa\',5,15);">2Sa 5:15</a>; <a onClick="return mV(\'1Ch\',3,7);">1Ch 3:7</a>; <a onClick="return mV(\'1Ch\',14,6);">14:6</a>).``32';
isbe[4847]='Japhia (2)`ja-fi\'-a, jaf\'-i-a (yaphia\'): A town on the southern boundary of Zebulun named with Chisloth-tabor and Daberath (<a onClick="return mV(\'Jos\',19,12);">Jos 19:12</a>). It is represented by the modern Yafa, about 1 1/2 miles southwest of Nazareth, near the foot of the hills. It was one of the places fortified by Josephus (Vita, 45; BJ, II, xx, 6).``1';
isbe[4848]='Japhlet`jaf\'-let (yaphlet, "he escapes"(?)): In <a onClick="return mV(\'1Ch\',7,32,33);">1Ch 7:32-33</a>, a "son" of Heber, an Asherite.``1';
isbe[4849]='Japhleti`jaf\'-le-ti, jaf-le\'-ti: the King James Version in <a onClick="return mV(\'Jos\',16,3);">Jos 16:3</a>, where Hebrew is ha-yaphleti, "the Japhletites," the Revised Version (British and American), a clan said to border on the territory of Joseph, but not mentioned elsewhere.``1';
isbe[4850]='Japho`ja\'-fo: the King James Version and the American Revised Version margin in <a onClick="return mV(\'Jos\',19,46);">Jos 19:46</a> for <a href="study/isbe/search.html?string=JOPPA">JOPPA</a> (which see).``1';
isbe[4851]='Jar`jar.`<a href="./study/isbe/search.html?string=BARREL">BARREL</a>`1';
isbe[4852]='Jarah`ja\'-ra (ya\'rah, "honey-comb" (?)): A descendant of King Saul (<a onClick="return mV(\'1Ch\',9,42);">1Ch 9:42</a>); but the Septuagint\'s Codices Vaticanus and Alexandrinus, have Iada = ya\'dah, a name found in Septuagint of <a onClick="return mV(\'1Ch\',8,36);">1Ch 8:36</a>, where Massoretic Text has yeho\'addah, Jehoaddah. Some Hebrew manuscripts have ya\'dah in <a onClick="return mV(\'1Ch\',9,42);">9:42</a>, and it should probably be accepted as the correct reading there, for ya\'dah = Jehoaddah yeho\'addah, linguistically; compare Jonathan and Jehonathan, etc.``1';
isbe[4853]='Jareb`ja\'-reb, jar\'-eb (yarebh, "let him contend"; Septuagint Iareim):<P>1. Obscurity of the Name:<P>Is mentioned twice in Ho (<a onClick="return mV(\'Hsa\',5,13);">5:13</a>; <a onClick="return mV(\'Hsa\',10,6);">10:6</a>) as an Assyrian king who received tribute from Israel. We do not, however, know of an Assyrian king of that name, or of such a place as is indicated by "the king of Jareb" (<a onClick="return mV(\'Hsa\',5,13);">5:13</a> King James Version, margin). Sayce (HCM, 417) thinks Jareb may possibly be the earlier name of Sargon who took Samaria in 722 BC, as the passages in which it appears seem to relate to the last struggles of the Northern Kingdom. This conjecture he bases on the probability that the successor of Shalmaneser IV, following the example of other usurpers of the Assyrian throne before him, assumed the name of Sargon. Those who hold that Hosea\'s prophecies are probably not later than 734 BC reject this view.<P>2. Meaning of the Word:<P>If we take the Hebrew text in <a onClick="return mV(\'Hsa\',5,13);">Ho 5:13</a> as it stands (melekh yarebh), Jareb cannot be regarded as the name of a person, owing to the absence of the article before melekh, "king," which is always inserted in such a case. It is probably an epithet or nickname applied to the Assyrian king, as is suggested by the Revised Version margin ("a king that should contend") and the King James Version margin ("the king that should plead"), being derived from the ribh, "to strive." The rendering would then be "King Combat," "King Contentious," indicating Assyria\'s general hostility to Israel and the futility of applying for help to that quarter against the will of Yahweh. Some suggest that for melekh yarebh we should read malki rabh (i being the old nominative termination), or melekh rabh, "Great King," a title frequently applied to Assyrian monarchs. Others, following the Septuagint, would read melekh ram, "High King."<P>3. Historical Reference:<P>The historical reference, if it be to any recorded incident, may be to the attempt of Menahem, king of Israel in 738 BC, to gain over the Assyrians by a large subsidy to Pul, who assumed the name of Tiglath-pileser (<a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>). In this case, as both Epraim and Judah are mentioned in the protasis, we should have to suppose that Ephraim made application on behalf of both kingdoms. If "Judah" be inserted before "sent" to complete the parallel, then the clause would be interpreted of Ahaz, king of Judah, who offered a heavy bribe to Tiglath-pileser to help him to withstand the combined attack of Rezin of Syria and Pekah of Israel (<a onClick="return mV(\'2Ki\',16,7);">2Ki 16:7</a>f). But perhaps there may be no particular allusions in the two clauses of the apodosis, but only a reference to a general tendency on the part of both kingdoms to seek Assyrian aid.<P>4. Other Views:<P>Cheyne would make a violent change in the verse. He would substitute "Israel" for "Judah" as warranted by <a onClick="return mV(\'Hsa\',12,2);">Ho 12:2</a>, insert "Israel" before "sent," change \'Ashshur,"assyria," into mitstsur, the North Arabian land of Mucri, "references to which underlie many passages in the Old Testament," and for melekh yarebh, he would read melekh \'arabhi, "king of Arabia." For other views see ICC.``32';
isbe[4854]='Jared`ja\'-red (yeredh, "descent"; pausal form, yaredh, in <a onClick="return mV(\'Gen\',5,15);">Ge 5:15</a>; <a onClick="return mV(\'1Ch\',1,2);">1Ch 1:2</a>, hence, English Versions of the Bible "Jared" for "Jered"; Iared): In <a onClick="return mV(\'Gen\',5,\'15-20\');">Ge 5:15-20</a>; <a onClick="return mV(\'1Ch\',1,2);">1Ch 1:2</a>; <a onClick="return mV(\'Luk\',3,37);">Lu 3:37</a>, son of Mahalaleel and father of Enoch. The King James Version has "Jered" in <a onClick="return mV(\'1Ch\',1,2);">1Ch 1:2</a>.<P>The name is supposed by Budde to denote a degeneration of the human race, the first five generations being righteous, their successors not, except Enoch and Noah. The name has been identified with that of Irad (iradh), <a onClick="return mV(\'Gen\',4,18);">Ge 4:18</a>. See Skinner, Gen, 117, 129, 131.``1';
isbe[4855]='Jaresiah`jar-e-si\'-a: the King James Version for <a href="study/isbe/search.html?string=JAARESHIAH">JAARESHIAH</a> (which see).``1';
isbe[4856]='Jarha`jar\'-ha (yarcha\', meaning unknown): An Egyptian slave of Shesham, about Eli\'s time (compare HPN, 235), who married his master\'s daughter, and became the founder of a house of the Jerahmeelites (<a onClick="return mV(\'1Ch\',2,34);">1Ch 2:34</a>).``1';
isbe[4857]='Jarib`ja\'-rib, jar\'-ib (yaribh, "he contends," or "takes (our) part," or "conducts (our) case"):<P>(1) In <a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a>, a "son" (clan) of Simeon = "Jachin" of <a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>; <a onClick="return mV(\'Num\',26,12);">Nu 26:12</a>.<P>(2) In <a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>, one of the "chief men" for whom Ezra sent, and dispatched by him to Casiphia to fetch ministers for God\'s house = "Joribus" (1Esdras 8:44).<P>(3) In <a onClick="return mV(\'Ezr\',10,18);">Ezr 10:18</a>, a priest who had married a foreign wife = "Joribus" (1Esdras 9:19).``1';
isbe[4858]='Jarimoth`jar\'-i-moth (Iarimoth): 1Esdras 9:28; called "Jeremoth" in <a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>.``1';
isbe[4859]='Jarmuth`jar\'-muth (yarmuth:<P>(1) A city of the Canaanites in the Shephelah (<a onClick="return mV(\'Jos\',15,35);">Jos 15:35</a>) of Judah whose "king," Piram, joined the league of the "five kings" against Joshua (<a onClick="return mV(\'Jos\',10,\'3-5\');">Jos 10:3-5</a>), was defeated at Gibeon and slain at Makkedah (<a onClick="return mV(\'Jos\',10,23);">10:23</a>). One of the 31 "kings" defeated in Joshua\' s campaign (<a onClick="return mV(\'Jos\',12,11);">Jos 12:11</a>). In <a onClick="return mV(\'Jos\',15,35);">Jos 15:35</a> it is mentioned in conjunction with Adullam, Socoh and Azekah, and in <a onClick="return mV(\'Neh\',11,29);">Ne 11:29</a> with Zorah, Zanoah and Adullam. Cheyne (Encyclopedia Biblica) suggests that the "Maroth" of <a onClick="return mV(\'Mic\',1,12);">Mic 1:12</a> may be a copyist\'s error for Jarmuth. In Eusebius, Onomasticon (OS2 132 31; 266 38) mention is made of a Iermochos, or Jermucha, 10 Roman miles northeast of Eleutheropolis (Beit Jibrin), The site of this once important place is Khirbet el Yarmuk, a ruin, with many old walls and cisterns, on the top of a hill 1,465 ft. above sea level. It is nearly 2 miles northwest of Belt Nattif, from which it is visible, and 8 1/2 miles, as measured on map, N.N.E. of Belt Jibrin. Compare PEF, III, 128, Sh XVIII.<P>(2) A city of Issachar belonging to the "children of Gershon, of the families of the Levites" (<a onClick="return mV(\'Jos\',21,29);">Jos 21:29</a>); in the duplicate list in <a onClick="return mV(\'1Ch\',6,73);">1Ch 6:73</a> we have Ramoth, while in the Septuagint version of <a onClick="return mV(\'Jos\',21,29);">Jos 21:29</a> we have, in different VSS, Rhemmath or Iermoth. In <a onClick="return mV(\'Jos\',19,21);">Jos 19:21</a> "Remeth" occurs (in Hebrew) in the lists of cities of Issachar; in the Septuagint Rhemmas or Rhamath. The name was probably "Remeth" or "Ramoth," but the place has never been identified with any certainty.`<a href="./study/isbe/search.html?string=RAMOTH+(1)">RAMOTH</a>`117';
isbe[4860]='Jaroah`ja-ro\'-a (yaroach, meaning unknown): A Gadite chief (<a onClick="return mV(\'1Ch\',5,14);">1Ch 5:14</a>). But the text is doubtful; see Curtis, Chronicles, 124.``1';
isbe[4861]='Jasaelus; Jasael`jas-a-e\'-lus, ja\'-sa-el (Iasaelos; Codex Vaticanus, Asaelos; the King James Version (1Esdras 9:30)): Called "Sheal" in <a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>.``1';
isbe[4862]='Jashar, Book of`ja\'-shar, jash\'-ar (cepher ha-yashar; the King James Version Book of Jasher, margin "the book of the upright"): The title of an ancient Hebrew national song-book (literally, "book of the righteous one") from which two quotations are made in the Old Testament:<P>(1) <a onClick="return mV(\'Jos\',10,\'12-14\');">Jos 10:12-14</a>, the command of Joshua to the sun and moon, "Sun, stand thou still upon Gibeon....Is not this written in the book of Jashar?" (see <a href="study/isbe/search.html?string=BETH-HORON">BETH-HORON</a>; Septuagint in this place omits the reference to Jashar); and<P>(2) <a onClick="return mV(\'2Sa\',1,8);">2Sa 1:8</a>ff, "the song of the bow," or lament of David over Saul and Jonathan.<P>(3) Some conjecture a third extract in <a onClick="return mV(\'1Ki\',8,12);">1Ki 8:12</a>, "Then spake Solomon, Yahweh hath said that he would dwell in the thick darkness." The words of Yahweh are quoted by Septuagint in 8:53 as "written in the book of the song" (en biblio tes odes), and it is pointed out that the words "the song" (in Hebrew ha-shir) might easily be a corruption of ha-yashar. A similar confusion ("song" for "righteous") may explain the fact that the Peshitta Syriac of Joshua has for a title "the book of praises or hymns." The book evidently was a well-known one, and may have been a gradual collection of religious and national songs. It is conjectured that it may have included the Song of Deborah (<a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>), and older pieces now found in the Pentateuch (e.g. <a onClick="return mV(\'Gen\',4,23,24);">Ge 4:23-24</a>; <a onClick="return mV(\'Gen\',9,\'25-27\');">9:25-27</a>; <a onClick="return mV(\'Gen\',27,\'27-29\');">27:27-29</a>); this, however, is uncertain. On the curious theories and speculations of the rabbis and others about the book (that it was the Book of the Law, of Genesis, etc.), with the fantastic reconstructive theory of Dr. Donaldson in his Jasbar, see the full article in HDB.``132';
isbe[4863]='Jashen`ja\'-shen, jash\'-en (yashen, "asleep"(?)): Seemingly the father of some of David s thirty valiant men (<a onClick="return mV(\'2Sa\',23,32);">2Sa 23:32</a>f). The Massoretic Text reads "Eliahba the Shaalbonite, the sons of Jashen, Jonathan, Shammah the Hararite, ...." <a onClick="return mV(\'1Ch\',11,33);">1Ch 11:33</a>f has Eliahba the Shaalbonite, the sons of Hashem the Gizonite, Jonathan the son of Shagee the Hararite ...." It is clear that "sons of" are a dittography of the last three consonants of the previous word. Septuagint, Lucian in 2 Samuel and 1 Chronicles has ho Gouni, "the Gunite," for "the Gizonite," perhaps correctly (compare <a onClick="return mV(\'Gen\',46,24);">Ge 46:24</a>; <a onClick="return mV(\'Num\',26,48);">Nu 26:48</a> for "Guni," "Gunite"). So <a onClick="return mV(\'2Sa\',23,32);">2Sa 23:32</a> may be corrected thus: "Eliahba the Shaalbonite, Jashen the Gunite, Jonathan the son of Shammah the Hararite." Jashen then becomes one of the thirty = "Hashem" of <a onClick="return mV(\'1Ch\',11,34);">1Ch 11:34</a>.``149';
isbe[4864]='Jasher, Book of`ja\'-sher, jash\'-er: the King James Version for <a href="./study/isbe/search.html?string=JASHAR,+BOOK+OF">Jashar</A> <!--(which see)-->`<a href="./study/isbe/search.html?string=BETH+HORON+THE+BATTLE+OF">BETH-HORON, THE BATTLE OF</a>`1';
isbe[4865]='Jashobeam`ja-sho\'-be-am (yashobh\'am, probably "people will return"; see discussion of names compounded with \'am, in HPN, 41-59): Jashobeam is mentioned in three passages (<a onClick="return mV(\'1Ch\',11,11);">1Ch 11:11</a>; <a onClick="return mV(\'1Ch\',12,6);">12:6 (Hebrew 7)</a>; <a onClick="return mV(\'1Ch\',27,2);">27:2</A>f), but opinions vary as to the number of persons erred to. In <a onClick="return mV(\'1Ch\',11,11);">1Ch 11:11</a> he is called "the son of a Hachmonite" (reference unknown) and "the chief of the three" ("three," the best reading; the Revised Version (British and American) "thirty"; the King James Version, the Revised Version margin "captains"), mighty men of David. He is said to have slain 300 (800 in <a onClick="return mV(\'2Sa\',23,8);">2Sa 23:8</a>) at one time, i.e. one after another.<P>The gibborim, or heroes, numbered 600 and were divided into bands of 200 each and subdivided into smaller bands of 20 each, with a captain for each company large and small. Jashobeam had command of the first of the three bands of 200 (see Ewald, HI, III, 140f; Stanley, HJC, II, 78). From the indefiniteness of the description, "three of the thirty chief," he can hardly be regarded as one of the three mighty men who broke through the ranks of the Philistines, and brought water from the well of Bethlehem to David on the hill-fortress of Adullam (<a onClick="return mV(\'1Ch\',11,\'15-17\');">1Ch 11:15-17</a>), and the fact that "the thirty" have not yet been mentioned would seem to indicate that this story is not in its proper place. But "Jashobe am" here (<a onClick="return mV(\'1Ch\',11,11);">1Ch 11:11</a>) is probably an error for "Ishbaal," the reading of many of the manuscripts of the Septuagint (HPN, 46, note).<P>In the parallel passage (<a onClick="return mV(\'2Sa\',23,8);">2Sa 23:8</a>) he is called "Joshebbasshebeth, a Tahchemonite." This verse, however, is probably corrupt (Revised Version margin), and the text should be corrected in accordance with Chronicles to "Ishbaal, the Hachmonite." In <a onClick="return mV(\'1Ch\',27,2);">1Ch 27:2</a>f Jashobeam is said to have been "the son of Zabdiel," of the family of Perez, and the commander-in-chief of the division of David\'s army which did duty the first month. The army consisted of 12 divisions of 24,000 each, each division serving a month in turn. In <a onClick="return mV(\'1Ch\',12,6);">1Ch 12:6 (Hebrew 7)</a> Jashobeam is mentioned among those who joined David at Ziklag in the time of Saul, and is described as a Korahite, probably one belonging to a family of Judah (compare <a onClick="return mV(\'1Ch\',2,43);">2:43</a>).``32';
isbe[4866]='Jashub`ja\'-shub, jash\'-ub (yashubh; yashibh, in Chronicles, but Qere, yashubh, "he returns"):<P>(1) In <a onClick="return mV(\'Num\',26,24);">Nu 26:24</a>; <a onClick="return mV(\'1Ch\',7,1);">1Ch 7:1</a>, a "son" (clan) of Issachar. <a onClick="return mV(\'Gen\',46,13);">Ge 46:13</a> has incorrectly Iob, but Septuagint Jashub.<P>(2) In <a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>, one of those who had married foreign wives = "Jasubus" in 1Esdras 9:30.<P>(3) In <a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>, part of the name <a href="study/isbe/search.html?string=SHEAR-JASHUB">SHEAR-JASHUB</a> (which see).``1';
isbe[4867]='Jashubi-Lehem`ja-shoo-bi-le\'-hem (yashubhi-lechem): A name in <a onClick="return mV(\'1Ch\',4,22);">1Ch 4:22</a> where commentators insert beth, between the two words and translate "(and) returned to Bethlehem."``1';
isbe[4868]='Jashubites, the`ja\'-shub-its, jash\'-ub-its (ha-yashubhi, coll. with article): In <a onClick="return mV(\'Num\',16,24);">Nu 16:24</a>, descendants of <a href="study/isbe/search.html?string=JASHUB">JASHUB</a> (q.v. (1)).``1';
isbe[4869]='Jasiel`ja\'-si-el, jas\'-i-el (ya\'asi\'el, "God is maker," <a onClick="return mV(\'1Ch\',11,47);">1Ch 11:47</a> the King James Version).`<a href="./study/isbe/search.html?string=JAASIEL">JAASIEL</a>`1';
isbe[4870]='Jason (1)`ja\'-sun (Iason): A common name among the Hellenizing Jews who used it for Jesus or Joshua, probably connecting it with the Greek verb iashthai ("to heal").<P>(1) Son of Eleazar, sent (161 BC) by Judas Maccabeus with other deputies to Rome "to make a league of amity and confederacy" (1Macc 8:17; Josephus, Ant, XII, x, 6), and perhaps to be identified with (2).<P>(2) The father of Antipater who went as ambassador of Jonathan to Rome in 144 BC (1Macc 12:16; 14:22; Ant, XIII, v, 8).<P>(3) Jason of Cyrene, a Jewish historian, who is known only from what is told of him in 2Macc 2:19-23. 2Macc is in fact simply an abridgment in one book of the 5 books written by Jason on the Jewish wars of liberation. He must have written after 162 BC, as his books include the wars under Antiochus Eupator.<P>(4) Jason the high priest, second son of Simon II and brother of Onias III. The change of name from Jesus (Josephus, Ant, XII, v) was part of the Hellenizing policy favored by Antiochus Epiphanes from whom he purchased the high-priesthood by a large bribe, thus excluding his elder brother from the office (2Macc 4:7-26). He did everything in his power to introduce Greek customs and Greek life among the Jews. He established a gymnasium in Jerusalem, so that even the priests neglected the altars and the sacrifices, and hastened to be partakers of the "unlawful allowance" in the palaestra. The writer of 2Macc calls him "that ungodly wretch" and "vile" Jason. He even sent deputies from Jerusalem to Tyre to take part in the worship of Hercules; but what he sent for sacrifices, the deputies expended on the "equipment of galleys." After 3 years of this Hellenizing work he was supplanted in 172 BC in the favor of Antiochus by Menelaus who gave a large bribe for the high priest\'s office. Jason took refuge with the Ammonites; on hearing that Antiochus was dead he tried with some success to drive out Menelaus, but ultimately failed (2Macc 5:5ff). He took refuge with the Ammonites again, and then with Aretas, the Arabian, and finally with the Lacedaemonians, where he hoped for protection "as being connected by race," and there "perished-miserably in a strange land."<P>(5) A name mentioned in <a onClick="return mV(\'Act\',17,\'5-9\');">Ac 17:5-9</a> and in <a onClick="return mV(\'Rom\',16,21);">Ro 16:21</a>.`<a href="./study/isbe/search.html?string=JASON+2">JASON 2</a>`79';
isbe[4871]='Jason (2)`ja\'-sun (Iason): A Greek name assumed by Jews who bore the Hebrew name Joshua. This name is mentioned twice in the New Testament. (See also preceding article <a href="./study/isbe/search.html?string=JASON+(1)">Jason (1)</a>.)<P>(1) Jason was the host of Paul during his stay in Thessalonica, and, during the uproar organized by the Jews, who were moved to jealousy by the success of Paul and Silas, he and several other "brethren" were severely handled by the mob. When the mob failed to find Paul and Silas, they dragged Jason and "certain brethren" before the politarchs, accusing Jason of treason in receiving into his house those who said "There is another king, one Jesus." The magistrates, being troubled, took security from them, and let them go.<P>There are various explanations of the purpose of this security. "By this expression it is most probably meant that a sum of money was deposited with the magistrates, and that the Christian community of the place made themselves responsible that no attempt should be made against the supremacy of Rome, and that peace should be maintained in Thessalonica itself" (Conybeare and Howson, Paul). Ramsay (St. Paul the Traveler) thinks that the security was given to prevent Paul from returning to Thessalonica and that Paul refers to this in <a onClick="return mV(\'1Th\',2,18);">1Th 2:18</a>.<P>The immediate departure of Paul and Silas seems to show the security was given that the strangers would leave the city and remain absent (<a onClick="return mV(\'Act\',17,\'5-9\');">Ac 17:5-9</a>).<P>(2) Jason is one of the companions of Paul who unite with him in sending greetings to the Roman Christians (<a onClick="return mV(\'Rom\',16,21);">Ro 16:21</a>). He is probably the same person as (1). Paul calls him a kinsman, which means a Jew (compare <a onClick="return mV(\'Rom\',9,3);">Ro 9:3</a>; <a onClick="return mV(\'Rom\',16,11,21);">16:11, 21</a>).``78';
isbe[4872]='Jasper; Jaspis`jas\'-per, jas\'-pis.`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[4873]='Jasubus`ja-su\'-bus (Iasoubos): An Israelite who in the time of Ezra had to put away his foreign wife (1Esdras 9:30); called "Jashub" in <a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>.``1';
isbe[4874]='Jatal`ja\'-tal (1Esdras 5:28).`<a href="./study/isbe/search.html?string=ATAR">ATAR</a>`1';
isbe[4875]='Jathan`ja\'-than (Iathan; Nathan): For "Jonathas" in the King James Version, which is the Latin form for the Hebrew "Jonathan." Jonathan was brother of Ananias and "son of that great Sammaias" (Tobit 5:13).``1';
isbe[4876]='Jathbath`jath\'-bath.`<a href="./study/isbe/search.html?string=JOTBATHAH">JOTBATHAH</a>`1';
isbe[4877]='Jathniel`jath\'-ni-el (yathni\'el, "God lives"): Fourth "son" of Meshelemiah, a Korahite (<a onClick="return mV(\'1Ch\',26,2);">1Ch 26:2</a>).``1';
isbe[4878]='Jattir`jat\'-er (yattir, and yattir): A town in the hill country of Judah, mentioned in conjunction with Shamir and Socoh (<a onClick="return mV(\'Jos\',15,48);">Jos 15:48</a>); one of the cities given to the "children of Aaron the priest" (<a onClick="return mV(\'Jos\',21,14);">Jos 21:14</a>; <a onClick="return mV(\'1Ch\',6,57);">1Ch 6:57</a>). David after his victory over the Amalekites sent a present of the spoil from Ziklag "to them that were in Jattir" (<a onClick="return mV(\'1Sa\',30,27);">1Sa 30:27</a>).<P>It is now Khirbet \'Attir, an important ruin, in the extreme south of the hill country, 5 miles southeast of edh Dhariyeh and 20 miles southeast of Belt Jibrin. This must Correspond to the "very large village Jethira" which is mentioned in Eusebius, Onomasticon (119 27; 133 3; 134 24, etc.) as 20 miles southeast of Eleutheropolis (i.e. Beit Jibrin). The site is full of caves. See PEF, III,408,Sh XXV.``117';
isbe[4879]='Javan`ja\'-van (yawan, meaning unknown):<P>(1) In <a onClick="return mV(\'Gen\',10,2,4);">Ge 10:2, 4</a> = <a onClick="return mV(\'1Ch\',1,5,7);">1Ch 1:5, 7</a> Septuagint Iouan); <a onClick="return mV(\'Isa\',66,19);">Isa 66:19</a>; <a onClick="return mV(\'Eze\',27,13);">Eze 27:13</a> Septuagint Hellas, Greece); <a onClick="return mV(\'Dan\',8,21);">Da 8:21</a> m; 10:20; 11:2; <a onClick="return mV(\'Zec\',9,13);">Zec 9:13</a>; <a onClick="return mV(\'Joe\',3,6);">Joe 3:6 (Hebrew 4:6</a>) Septuagint hoi Hellenes, i.e. "Greeks"), "son" of Japheth, and "father" of Elisha, Tars, Kittim, and Rodarim, i.e. Rhodes (incorrectly "Dodanim" in <a onClick="return mV(\'Gen\',10,4);">Ge 10:4</a>). Javan is the Greek Iaon or Ia(v)on, and in Genesis and 1 Chronicles = the Ionian Greeks of Asia Minor, probably here = Cyprus. The reference in <a onClick="return mV(\'Eze\',27,13);">Eze 27:13</a> (from which that in <a onClick="return mV(\'Isa\',66,19);">Isa 66:19</a> is copied) is the country personified. In Joel the plural yewanim, is found. In Daniel the name is extended to the Greeks generally. Corroboration of the name is found in Assyrian (Schrader, editor, Keilinschriftliche Bibliothek, II, 43). "The Persian Yauna occurs in the same double reference from the time of Darius; compare Aesch. Persian., 176, 562" (Skinner, Genesis, 198). In Egyptian the word is said to be yevan-(n)a; in the Tell el-Amarna Letters Yivana is mentioned as being in the land of Tyre. See HDB, II, 552b.<P>(2) Place (<a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a>); the name is missing in Septuagint.``149';
isbe[4880]='Javelin`jav\'-lin, jav\'-e-lin.`<a href="./study/isbe/search.html?string=ARMOR;+ARMS">ARMOR; ARMS</a>`1';
isbe[4881]='Jaw; Jawbone; Jaw Teeth`jo, jo\'-bon (lechi, "cheek (bone)," "jaw (bone)"): In <a onClick="return mV(\'Job\',41,2);">Job 41:2</a>, the Revised Version (British and American) gives "pierce his jaw through with a hook" for the King James Version "bore his jaw through with a thorn" (see <a href="study/isbe/search.html?string=HOOK">HOOK</a>; <a href="study/isbe/search.html?string=LEVIATHAN">LEVIATHAN</a>). <a onClick="return mV(\'Psa\',22,15);">Ps 22:15</a>, "My tongue cleaveth to my jaws (malqoach)," is descriptive of the effect of a fever or physical torture, a dryness and a horrible clamminess. Malqochayim is an ancient dual form meaning the two jaws, and, metaphorically, malqoach indicates that which is caught between the jaws, booty, prey, including captives (<a onClick="return mV(\'Num\',31,11,26,32);">Nu 31:11, 26, 32</a>; <a onClick="return mV(\'Isa\',49,24);">Isa 49:24</a>f).<P>Figurative:<P>(1) Of the power of the wicked, with a reference to Divine restraint and discipline: "I brake the jaws (Hebrew "great teeth") of the unrighteous" (<a onClick="return mV(\'Job\',29,17);">Job 29:17</a>; <a onClick="return mV(\'Pro\',30,14);">Pr 30:14</a>); compare <a onClick="return mV(\'Psa\',58,6);">Ps 58:6</a>, "Break out the great teeth (malta\'oth, "jaw teeth") of the young lions, O Yahweh." Let the wicked be deprived of their ability for evil; let them at least be disabled from mischief. Septuagint reads "God shall break," etc. (Compare Edmund Prys\'s Metrical Paraphrase of the Psalms, in the place cited.) "A bridle...in the jaws of the peoples" (<a onClick="return mV(\'Isa\',30,28);">Isa 30:28</a>; compare <a onClick="return mV(\'2Ki\',19,28);">2Ki 19:28</a>) is descriptive of the ultimate check of the Assyrian power at Jerusalem, "as when a bridle or lasso is thrown upon the jaws of a wild animal when you wish to catch and tame him" (G.A. Smith Isaiah, I, 235). Compare <a onClick="return mV(\'Eze\',29,4);">Eze 29:4</a> (concerning Pharaoh); <a onClick="return mV(\'Eze\',38,4);">38:4</A> (concerning Gog), "I will put hooks in (into) thy jaws."<P>(2) Of human labor and trials, with a reference to the Divine gentleness: "I was to them as they that lift up the yoke on their jaws" (<a onClick="return mV(\'Hsa\',11,4);">Ho 11:4</a>), or \'take the yoke off their jaws,\' as the humane driver eased the yoke with his hands or \'lifted it forward from neck to the jaws\'; or it may perhaps refer to the removal of the yoke in the evening, when work is over.<P>Jawbone (<a onClick="return mV(\'Jdg\',15,15);">Jud 15:15</a>).`<a href="./study/isbe/search.html?string=RAMATH+LEHI">RAMATH-LEHI</a>`91';
isbe[4882]='Jazer`ja\'-zer (ya\'zer or ya\'zeyr; Septuagint Iazen in Codex Alexandrinus; Iazer): In some cases, e.g. <a onClick="return mV(\'Num\',21,32);">Nu 21:32</a>, the King James Version reads "Jaazer." This was a city of the Amorites east of the Jordan taken, along with its towns, by Moses, and occupied by the tribe of Gad (<a onClick="return mV(\'Num\',21,32);">Nu 21:32</a>; <a onClick="return mV(\'Num\',32,35);">32:35</a>). The country was very fertile, and its spacious pasture-lands attracted the flock-masters of Gad (<a onClick="return mV(\'Num\',32,1);">Nu 32:1</a>), the southern border of whose territory it marked (<a onClick="return mV(\'Jos\',13,25);">Jos 13:25</a>). It was assigned to the Merarite Levites (<a onClick="return mV(\'Jos\',21,39);">Jos 21:39</a>; <a onClick="return mV(\'1Ch\',6,81);">1Ch 6:81</a>). The place was reached by Joab when taking the census (<a onClick="return mV(\'2Sa\',24,5);">2Sa 24:5</a>). In the 40th year of King David mighty men of valor were found here to whom he entrusted the oversight in Reuben and Gad "for every matter pertaining to God, and run the affairs of the king" (<a onClick="return mV(\'1Ch\',26,32);">1Ch 26:32</a>f). The fruitfulness of the country is alluded to in <a onClick="return mV(\'Isa\',16,8);">Isa 16:8</a>f; <a onClick="return mV(\'Jer\',48,32);">Jer 48:32</a>. (Note: "Sea of" Jazer in this verse has arisen through accidental repetition of yam, "sea," from the preceding clause.) The city was taken from the Ammonites by Judas Maccabeus, and burned (1Macc 5:7,8; Ant, XII, viii, 1).<P>Onomasticon places Jazer 10 Roman miles west of Philadelphia (\'Amman), and about 15 miles from Heshbon, where a great stream rises, which flows into the Jordan. Many would identify it with Khirbet Car, on the south of Wady Cir, about 5 miles west of \'Amman. The perennial stream from Wady Cir reaches the Jordan by Wady el-Kefrein. Cheyne (EB, under the word) suggests Yajuz on Wady Zorby, tributary of the Jabbok, with extensive Roman remains. It lies a little way to the east of el Jubeihat ("Jogbehah," <a onClick="return mV(\'Num\',32,35);">Nu 32:35</a>). It is situated, however, to the north and not to the west of \'Amman, where Eusebius, Onomasticon, places it. Neither identification is certain.``54';
isbe[4883]='Jaziz`ja\'-ziz (yaziz, meaning uncertain): The Hagrite who was over David\'s flocks (<a onClick="return mV(\'1Ch\',27,30);">1Ch 27:30 (Hebrew 31)</a>).``1';
isbe[4884]='Jealousy`jel\'-us-i (qin\'ah; zelos): Doubtless, the root idea of both the Greek and the Hob translated "jealousy" is "warmth," "heat." Both are used in a good and a bad sense—to represent right and wrong passion.<P>When jealousy is attributed to God, the word is used in a good sense. The language is, of course, anthropomorphic; and it is based upon the feeling in a husband of exclusive right in his wife. God is conceived as having wedded Israel to Himself, and as claiming, therefore, exclusive devotion. Disloyalty on the part of Israel is represented as adultery, and as provoking God to jealousy. See, e.g., <a onClick="return mV(\'Deu\',32,16,21);">De 32:16, 21</a>; <a onClick="return mV(\'1Ki\',14,22);">1Ki 14:22</a>; <a onClick="return mV(\'Psa\',78,58);">Ps 78:58</a>; <a onClick="return mV(\'Eze\',8,3);">Eze 8:3</a>; <a onClick="return mV(\'Eze\',16,38,42);">16:38, 42</a>; <a onClick="return mV(\'Eze\',23,25);">23:25</a>; <a onClick="return mV(\'Eze\',36,5);">36:5</a>; <a onClick="return mV(\'Eze\',38,19);">38:19</a>.<P>When jealousy is attributed to men, the sense is sometimes good, and sometimes bad. In the good sense, it refers to an ardent concern for God\'s honor. See, e.g., <a onClick="return mV(\'Num\',25,11);">Nu 25:11</a> (compare <a onClick="return mV(\'1Ki\',19,10);">1Ki 19:10</a>; <a onClick="return mV(\'2Ki\',10,16);">2Ki 10:16</a>); <a onClick="return mV(\'2Cr\',11,2);">2Co 11:2</a> (compare <a onClick="return mV(\'Rom\',10,2);">Ro 10:2</a>). In the bad sense it is found in <a onClick="return mV(\'Act\',7,9);">Ac 7:9</a>; <a onClick="return mV(\'Rom\',13,13);">Ro 13:13</a>; <a onClick="return mV(\'1Cr\',3,3);">1Co 3:3</a>; <a onClick="return mV(\'2Cr\',12,20);">2Co 12:20</a>; <a onClick="return mV(\'Jam\',3,14,16);">Jas 3:14, 16</a>.<P>The "law of jealousy" is given in <a onClick="return mV(\'Num\',5,\'11-31\');">Nu 5:11-31</a>. It provided that, when a man suspected his wife of conjugal infidelity, an offering should be brought to the priest, and the question of her guilt or innocence should be subjected to a test there carefully prescribed. The test was intended to be an appeal to God to decide the question at issue.`<a href="./study/isbe/search.html?string=ADULTERY">ADULTERY</a>; <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`61';

isbe[4886]='Jealousy, Water of``<a href="./study/isbe/search.html?string=ADULTERY">ADULTERY</a>`1';
isbe[4887]='Jearim, Mount`je\'-a-rim, je-a\'-rim (har-ye\'arim): A mountain by the side of which passed the border of Judah (<a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a>). It is mentioned here only, and is identical with <a href="study/isbe/search.html?string=CHESALON">CHESALON</A> (which see).``1';
isbe[4888]='Jeatherai; Jeaterai`je-ath\'-e-ri, jeat\'-e-ri (Revised Version (British and American)), (the King James Version) (ye\'atheray, meaning unknown): A descendant of Gershom, "son" of Levi (<a onClick="return mV(\'1Ch\',6,21);">1Ch 6:21 (Hebrew 6)</a>), and probably an ancestor of Asaph (so commentators); in <a onClick="return mV(\'1Ch\',6,\'39-43\');">6:39-43</A> the corresponding name is "Ei." The difference in the Hebrew words is not great.``1';
isbe[4889]='Jeberechiah`je-ber-e-ki\'-a (yebherekhyahu, "Yah blesses"): The father of the Zechariah whom Isaiah (<a onClick="return mV(\'Isa\',8,2);">8:2</A>) took as a witness of his prophecy against Syria and Ephraim (circa 734 BC).``1';
isbe[4890]='Jebus`je\'-bus (yebhuc; Iebous): In <a onClick="return mV(\'Jdg\',19,10,11);">Jud 19:10-11</a>, "Jebus (the same is Jerusalem)"; <a onClick="return mV(\'1Ch\',11,4,5);">1Ch 11:4-5</a>, "Jerusalem (the same is Jebus)." It was once thought that this was the first name of Jerusalem, as indeed might be suggested by the Biblical references, but it is now known from the Tell el-Amarna Letters that Urusa-lem was a name used centuries before the time of David (see <a href="study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM, I</a>). It would appear probable that the name "Jebus" was evolved by the Hebrews as an alternate name, and possibly they may have imagined an earlier name, for Jerusalem from <a href="study/isbe/search.html?string=JEBUSITE">JEBUSITE</a> (which see), the name of the local tribe who owned the district in the first centuries of Israel\'s occupation of Canaan.``117';
isbe[4891]='Jebus; Jebusi; Jebusite`je\'-bus, jeb\'-u-si, jeb\'-u-zit (yebhuc, ha-yebhuci): "Jebus" is an old name for Jerusalem (<a onClick="return mV(\'Jdg\',19,10,11);">Jud 19:10-11</a>; <a onClick="return mV(\'1Ch\',4,5);">1Ch 4:5</a> parallel <a onClick="return mV(\'2Sa\',5,\'6-9\');">2Sa 5:6-9</a>, "the same is Jerus"; see preceding article [<a href="./study/isbe/search.html?string=JEBUS">Jebus</a>]). "Jebusi" (literally, "Jebusite") is also used as a name for the city in the King James Version (<a onClick="return mV(\'Jos\',18,16,28);">Jos 18:16, 28</a>; compare <a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>); the Revised Version (British and American) correctly renders "Jebusite" (see <a href="study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>). "Jebusites," for the people (in the King James Version <a onClick="return mV(\'Gen\',15,21);">Ge 15:21</a>; <a onClick="return mV(\'Exd\',3,8,17);">Ex 3:8, 17</a>, etc.), does not occur in Hebrew in the plural; hence, in the Revised Version (British and American) is always rendered in the singular, "Jebusite." The "Jebusite" is said in <a onClick="return mV(\'Gen\',10,16);">Ge 10:16</a>; <a onClick="return mV(\'1Ch\',1,14);">1Ch 1:14</a> to be the 3rd son of Canaan, i.e. of the country of Canaan. Elsewhere he represents a tribe separate from the Canaanites. He stands between Heth and the Amorite (compare <a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>; <a onClick="return mV(\'Jos\',11,3);">Jos 11:3</a>; <a onClick="return mV(\'Eze\',16,3,15);">Eze 16:3, 15</a>). In the lists of the peoples inhabiting Palestine the "Jebusite" is always placed last, a fact indicative, probably, of their smaller number.<P>To what race the Jebusites belonged is doubtful. Their name does not seem Semitic, and they do not make their appearance till after the patriarchal period.<P>The original name of Jerusalem was Babylonian, Uru-Salim, "the city of Salim," shortened into Salem in <a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a> and in the inscriptions of the Egyptian kings Ramses II and Ramses III. In the Tell el-Amarna Letters (1400 BC) Jerusalem is still known as Uru-Salim, and its king bears a Hittite name, implying that it was at the time in the possession of the Hittites. His enemies, however, were closing around him, and one of the tablets shows that the city was eventually captured and its king slain. These enemies would seem to have been the Jebusites, since it is after this period that the name "Jebus" makes its appearance for the first time in the Old Testament (<a onClick="return mV(\'Jdg\',19,10,11);">Jud 19:10-11</a>).<P>The Jebusite king at the time of the conquest was Adoni-zedek, who met his death at Beth-boron (<a onClick="return mV(\'Jos\',10,1);">Jos 10:1</a>; in <a onClick="return mV(\'Jos\',10,5);">Jos 10:5</a> the word "Amorite" is used in its Babylonian sense to denote the inhabitants of Canaan generally). The Jebusites were a mountain tribe (<a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>; <a onClick="return mV(\'Jos\',11,3);">Jos 11:3</a>). Their capital "Jebus" was taken by the men of Judah and burned with fire (<a onClick="return mV(\'Jdg\',18,\'1-\');">Jud 18</a>), but they regained possession of, and held, the fortress till the time of David (<a onClick="return mV(\'2Sa\',5,6);">2Sa 5:6</a>).<P>When Jerusalem was taken by David, the lives and property of its Jebusite inhabitants were spared, and they continued to inhabit the temple-hill, David and his followers settling in the new City of David on Mt. Zion (<a onClick="return mV(\'Jos\',15,8,63);">Jos 15:8, 63</a>; <a onClick="return mV(\'Jdg\',1,21);">Jud 1:21</a>; <a onClick="return mV(\'Jdg\',19,11);">19:11</a>). And as Araunah is called "king" (<a onClick="return mV(\'2Sa\',24,23);">2Sa 24:23</a>), we may conclude that their last ruler also had been lowed to live. His name is non-Sem, and the various spellings of it (compare <a onClick="return mV(\'1Ch\',21,15);">1Ch 21:15</a>, "Ornan") indicate that the Hebrew writers had some difficulty in pronouncing it. The Jebusites seem ultimately to have blended with the Israelite population.``132';
isbe[4892]='Jecamiah`jek-a-mi\'-a: the King James Version for <a href="study/isbe/search.html?string=JEKAMIAH">JEKAMIAH</a> (which see).``1';
isbe[4893]='Jechiliah`jek-i-li\'-a (yekhilyah). See <a href="study/isbe/search.html?string=JECHOLIAH">JECHOLIAH</A>; Kethibh and <a onClick="return mV(\'2Ch\',26,3);">2Ch 26:3</a> the Revised Version (British and American), where Qere is yekholyah = "Jecoliah" (the King James Version).``1';
isbe[4894]='Jecholiah`jek-o-li\'-a (yekholyahu; <a onClick="return mV(\'2Ki\',15,2);">2Ki 15:2</a> the King James Version = yekholyah, Qere in <a onClick="return mV(\'2Ch\',26,3);">2Ch 26:3</a>, "Yah is able" or "Yah has been able"): The mother of King Uzziah (Azariah) of Judah. The Revised Version (British and American) has "Jecoliah" in 2 Kings and so the King James Version in 2 Chronicles.``1';
isbe[4895]='Jechonias`jek-o-ni\'-as (Iechonias, the King James Version; Greek form of "Jechoniah," the Revised Version (British and American)):<P>(1) The altered form of Jehoiachin (Additions to Esther 11:4; Baruch 1:3,9; <a onClick="return mV(\'Mat\',1,11,12);">Mt 1:11-12</a>). The last but one of the kings of Judah.<P>(2) The son of Zeelus (1Esdras 8:92), called "Shecaniah" in <a onClick="return mV(\'Ezr\',10,2);">Ezr 10:2</a>.``1';
isbe[4896]='Jecoliah`jek-o-li\'-a: <a onClick="return mV(\'2Ki\',15,2);">2Ki 15:2</a>; <a onClick="return mV(\'2Ch\',26,3);">2Ch 26:3</a> the King James Version;`<a href="./study/isbe/search.html?string=JECHILIAH">JECHILIAH</a>; <a href="./study/isbe/search.html?string=JECHOLIAH">JECHOLIAH</a>`1';
isbe[4897]='Jeconiah`jek-o-ni\'-a.`<a href="./study/isbe/search.html?string=JEHOIACHIN">JEHOIACHIN</a>`1';
isbe[4898]='Jeconias`jek-o-ni-as (Iechonias):<P>(1) One of the chiliarchs who made great gifts of sheep and calves at the Passover of Josiah (1Esdras 1:9); called "Conaniah" in <a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>.<P>(2) One reading makes Jeconias (not Joachaz) son of Josiah in 1Esdras 1:34 margin.``1';
isbe[4899]='Jedaiah`je-da\'-ya, je-di\'-a:<P>(1) (yedha\'yah, "Yah knows"):<P class="in15">(a) A priest in Jerusalem (<a onClick="return mV(\'1Ch\',9,10);">1Ch 9:10</a>; <a onClick="return mV(\'1Ch\',24,7);">24:7</a>).<P class="in15">(b) <a onClick="return mV(\'Ezr\',2,36);">Ezr 2:36</a> = <a onClick="return mV(\'Neh\',7,39);">Ne 7:39</a>, where "children of Jedaiah" are mentioned = "Jeddu" in 1Esdras 5:24.<P class="in15">(c) Jedaiah is among "the priests and the Levites" that returned with Zerubbabel (<a onClick="return mV(\'Neh\',11,10);">Ne 11:10</a>; <a onClick="return mV(\'Neh\',12,6,19);">12:6, 19</a>).<P class="in15">(d) Another priest of the same name (<a onClick="return mV(\'Neh\',12,7,21);">Ne 12:7, 21</a>).<P class="in15">(e) One of the exiles whom Zechariah was commanded to send with silver and gold to Jerusalem. Septuagint does not take the word as a proper name (<a onClick="return mV(\'Zec\',6,10,14);">Zec 6:10, 14</a>)<P>(2) (yedhayah, "Yah throws" (?)):<P class="in15">(a) Father of a Simeonite prince (<a onClick="return mV(\'1Ch\',4,37);">1Ch 4:37</a>).<P class="in15">(b) One of the repairers of the wall of Jerusalem (<a onClick="return mV(\'Neh\',3,10);">Ne 3:10</a>).``149';
isbe[4900]='Jeddu`jed\'-oo (Ieddou): Called <a href="study/isbe/search.html?string=JEDAIAH">JEDAIAH</a> (which see 1, (b)) in canonical books (1Esdras 5:24).``1';
