sfully to the relief of the beleaguered province, but weakly yielded. During the time between the writing of the tablets and the days of Merenptah and the building of Pithom no great strong government from either Egypt or Babylonia or the north was established in Palestine. At the time of the conquest there is constant reference made to "the Hittites and the Amorites and the Perizzites," etc. Why are they so constantly mentioned as a group, unless they were in some sense "confederates"? It is not impossible, indeed it is probable, that these Hittites and Amorites and Perizzites, etc., Palestinian tribes having some kind of loose confederacy in the days of the conquest, represent the last state of the confederates," the conspirators, who began operations in the Amorite war against the imperial Egyptian government recorded in the Tell el-Amarna Letters, and, in the correspondence from the south, were called in those days Habiri, i.e. "strangers" or "immigrants." For the final decision on the problem of the Habiri and the full elucidation of many things in the Tell el-Amarna Letters we must await further study of the tablets by expert cuneiform scholars, and especially further discovery in contemporary history.<P>The Jerusalem letters of the southern correspondence present something of much importance which does not bear at all upon the problem of the Habiri. The frequently recurring title of the king of Jerusalem, "It was not my father, it was not my mother, who established me in this position" (Budge, History of Egypt, IV, 231-35), seems to throw light upon the strange description given of <a href="./study/isbe/search.html?string=MELCHIZEDEK">MELCHIZEDEK</a> (which see), the king of Jerusalem in the days of Abraham. The meaning here clearly is that the crown was not hereditary, but went by appointment, the Pharaoh of Egypt having the appointing power. Thus the king as such had no ancestor and no descendant, thus furnishing the peculiar characteristics made use of to describe the character of the Messiah\'s priesthood in the Epistle to the Hebrews (<a onClick="return mV(\'Hbr\',7,3);">7:3</a>).<P>LITERATURE.<P>Conder, The Tell Amarna Tablets; Knudtzon, Die El-Amarna-Tafeln, in Heinrich\'s Vorderasiatische Bibliothek, II; Petrie, Tell el Amarna Tablets; idem, Syria and Egypt from the Tell el Amarna Letters; idem, Hist of Egypt; Jeremias, The Old Testament in the Light of the Ancient East.``93';
isbe[8660]='Tema`te\'-ma (tema\', "south country"; Thaiman): The name of a son of Ishmael (<a onClick="return mV(\'Gen\',25,15);">Ge 25:15</a>; <a onClick="return mV(\'1Ch\',1,30);">1Ch 1:30</a>), of the tribe descended from him (<a onClick="return mV(\'Jer\',25,23);">Jer 25:23</a>), and of the place where they dwelt (<a onClick="return mV(\'Job\',6,19);">Job 6:19</a>; <a onClick="return mV(\'Isa\',21,14);">Isa 21:14</a>). This last was a locality in Arabia which probably corresponds to the modern Teima\' (or Tayma\' (see Doughty, Arabia Deserta, I, 285)), an oasis which lies about 200 miles north of el-Medina, and some 40 miles south of Dumat el-Jandal (Dumah), now known as el-Jauf. It is on the ancient caravan road connecting the Persian Gulf with the Gulf of Aqaba; and doubtless the people took a share in the carrying trade (<a onClick="return mV(\'Job\',6,19);">Job 6:19</a>). The wells of the oasis still attract the wanderers from the parched wastes (<a onClick="return mV(\'Isa\',21,14);">Isa 21:14</a>). Doughty (loc. cit.) describes the ruins of the old city wall, some 3 miles in circuit. An Aramaic stele recently discovered, belonging to the 6th century BC, shows the influence of Assyrian art. The place is mentioned in the cuneiform inscriptions (Schrader, KAT2, 149).``54';
isbe[8661]='Temah`te\'-ma (temach, Codex Alexandrinus and Codex Vaticanus Thema; Lucian, Themaa; <a onClick="return mV(\'Neh\',7,55);">Ne 7:55</a>; Codex Vaticanus Hemath; Codex Alexandrinus Thema; Lucian, Themaa; the King James Version, Thamah): The family name of a company of Nethinim (<a onClick="return mV(\'Ezr\',2,53);">Ezr 2:53</a>).``1';
isbe[8662]='Teman`te\'-man (teman, "on the right," i.e. "south"; Thaiman): The name of a district and town in the land of Edom, named after Teman the grandson of Esau, the son of his firstborn, Eliphaz (<a onClick="return mV(\'Gen\',36,11);">Ge 36:11</a>; <a onClick="return mV(\'1Ch\',1,36);">1Ch 1:36</a>). A duke Teman is named among the chiefs or clans of Edom (<a onClick="return mV(\'Gen\',36,42);">Ge 36:42</a>; <a onClick="return mV(\'1Ch\',1,53);">1Ch 1:53</a>). He does not however appear first, in the place of the firstborn. Husham of the land of the Temanites was one of the ancient kings of Edom (<a onClick="return mV(\'Gen\',36,34);">Ge 36:34</a>; <a onClick="return mV(\'1Ch\',1,45);">1Ch 1:45</a>). From <a onClick="return mV(\'Oba\',1,9);">Obad 1:9</a> we gather that Teman was in the land of Esau (Edom). In <a onClick="return mV(\'Amo\',1,12);">Am 1:12</a> it is named along with Bozrah, the capital of Edom. In <a onClick="return mV(\'Eze\',25,13);">Eze 25:13</a> desolation is denounced upon Edom: "From Teman even unto Dedan shall they fall by the sword." Dedan being in the south, Teman must be sought in the north. Eusebius, Onomasticon knows a district in the Gebalene region called Theman, and also a town with the same name, occupied by a Roman garrison, 15 miles from Petra. Unfortunately no indication of direction is given. No trace of the name has yet been found. It may have been on the road from Elath to Bozrah.<P>The inhabitants of Teman seem to have been famous for their wisdom (<a onClick="return mV(\'Jer\',49,7);">Jer 49:7</a>; <a onClick="return mV(\'Oba\',1,8);">Obad 1:8</a>f). Eliphaz the Temanite was chief of the comforters of Job (<a onClick="return mV(\'Job\',2,11);">2:11</a>, etc.). The manner in which the city is mentioned by the prophets, now by itself, and again as standing for Edom, shows how important it must have been in their time.``54';
isbe[8663]='Temeni`tem\'-e-ni, te\'-me-ni (temeni, Baer, timeni; Codex Vaticanus and Codex Alexandrinus Thaiman; Lucian, Thaimanei): The word temeni means a southerner, i.e. of Southern Judah; compare <a href="./study/isbe/search.html?string=TEMAN">TEMAN</A> (patronymic temani), the name of Edom (<a onClick="return mV(\'Gen\',36,11);">Ge 36:11</a>, etc.), the "son" of Ashhur (<a onClick="return mV(\'1Ch\',4,6);">1Ch 4:6</a>).``1';
isbe[8664]='Temper`tem\'-per: The word is used in the King James Version to render different Hebrew words. In <a onClick="return mV(\'Eze\',46,14);">Eze 46:14</a> for "temper" (racac) the Revised Version (British and American) substitutes "moisten." In So (<a onClick="return mV(\'Sgs\',5,2);">5:2</a>) a noun from the same stem means "dew-drops." In <a onClick="return mV(\'Exd\',29,2);">Ex 29:2</a> the King James Version we read "cakes unleavened, tempered (balal, literally, "mixed") with oil," the Revised Version (British and American) "mingled." The word denotes "rough-and-ready mixing." In the recipe for the making of incense given in Exodus (<a onClick="return mV(\'Exd\',30,35);">30:35</A>) occur the words "tempered together," malach (literally, "salted"; hence, the Revised Version (British and American) "seasoned with salt"). The word occurs in two interesting connections in <span class="noTag">The Wisdom of Solomon 15:7</a> (the Revised Version (British and American) "knead") and 16:21. In <a onClick="return mV(\'1Cr\',12,24);">1Co 12:24</a> it occurs in English Versions of the Bible as a rendering of the Greek word sugqerannumi, which meant to "mix together." Paul is arguing in favor of the unity of the church and of cooperation on the part of individual members, and uses as an illustration the human body which consists of various organs with various functions. It is God, argues the apostle, who has "tempered," "compounded" or "blended," the body. Each member has its place and function and must contribute to the welfare of the whole frame. The same Greek word occurs in <a onClick="return mV(\'Hbr\',4,2);">Heb 4:2</a>. The author urges the necessity of faith in regard to the gospel. The unbelieving Israelites had derived no benefit from their hearing of the gospel because their hearing of it was not "mixed" with faith.``103';
isbe[8665]='Temperance; Temperate`tem\'-per-ans; tem\'-per-at (egkrateia), (egkrates, nephalios, sophron): the American Standard Revised Version departs from the King James Version and the English Revised Version by translating egkrateia "self-control" (<a onClick="return mV(\'Act\',24,25);">Ac 24:25</a>; <a onClick="return mV(\'Gal\',5,23);">Ga 5:23</a>; <a onClick="return mV(\'2Pe\',1,6);">2Pe 1:6</a>; <a onClick="return mV(\'1Cr\',9,25);">1Co 9:25</a>), following the English Revised Version margin in several of these passages. This meaning is in accordance with classical usage, Plato applying it to "mastery" not only of self, but of any object denoted by a genitive following. Septuagint applies it to the possession "of strongholds" (2Macc 8:30; 10:15), "of a position" (2Macc 10:17), "of the city" (2Macc 13:13), "of wisdom" (Sirach 6:27). The reflexive meaning of "self-mastery," "self-restraint," is equally well established in the classics and Septuagint. Thus, in the verbal form, it is found in <a onClick="return mV(\'Gen\',43,31);">Ge 43:31</a>, for the self-restraint exercised by Joseph in the presence of his brethren, when they appeared before him as suppliants, and in <a onClick="return mV(\'1Sa\',13,12);">1Sa 13:12</a>, where Saul professes that he "forced" himself to do what was contrary to his desire. For patristic use of the term, see illustrations in Suicer\'s Thesaurus Ecclesiasticus, I, 1000ff. Clement of Alexandria: "Not abstaining from all things, but using continently such things as one has judged should be used"; "such things as do not seem beyond right reason." Basil: "To avoid excess on both sides, so as neither by luxury to be confused, nor, by becoming sickly, to be disabled from doing what has been commanded." Chrysostom (on <a onClick="return mV(\'1Ti\',1,8);">1Ti 1:8</a>) applies it to "one mastering passion of tongue, hand and unbridled eyes." Ellicott and Eadie (on <a onClick="return mV(\'Gal\',5,23);">Ga 5:23</a>) quote Diogenes Laertius to the effect that the word refers to "control over the stronger passions." In <a onClick="return mV(\'1Cr\',9,25);">1Co 9:25</a>, Paul illustrates it by the training of an athlete, whose regimen is not only described in the Ars Poetica of Horace (412ff), and in Epictetus (quoted in Alford on this passage), but can be learned of the many devotees and admirers of similar pursuits today.<P>The principle involved is that of the concentration of all man\'s powers and capabilities upon the one end of doing God\'s will, in and through whatever calling God appoints, and the renunciation of everything either wholly or to whatever degree necessary, however innocent or useful it may be in its proper place, that interferes with one\'s highest efficiency in this calling (<a onClick="return mV(\'1Cr\',10,31);">1Co 10:31</a>). Not limited to abstinence, it is rather the power and decision to abstain with reference to some fixed end, and the use of the impulses of physical, as servants for the moral, life. It does not refer to any one class of objects that meets us, but to all; to what concerns speech and judgment, as well as to what appeals to sense. It is properly an inner spiritual virtue, working into the outward life, incapable of being counterfeited or replaced by any abstinence limited to that which is external (Augsburg Confession, Articles XXVI, XXVII). When its absence, however, is referred to as sin, the negative is generally more prominent than the positive side of temperance. The reference in <a onClick="return mV(\'Act\',24,25);">Ac 24:25</a> is to chastity, and in <a onClick="return mV(\'1Cr\',7,9);">1Co 7:9</a>, as the context shows, to the inner side of chastity. In <a onClick="return mV(\'1Ti\',3,2,11);">1Ti 3:2,11</a>; <a onClick="return mV(\'Tts\',2,2);">Tit 2:2</a>, the word nephalios has its original meaning as the opposite to "drunken" (see <a href="./study/isbe/search.html?string=SOBRIETY">SOBRIETY</A>; <a href="./study/isbe/search.html?string=DRINK">DRINK</a>, <a href="./study/isbe/search.html?string=STRONG">STRONG</A>). See also the treatises on ethics by Luthardt (both the Compendium and the History), Martensen, Koestlin and Haring on temperance, asceticism, continence.``84';
isbe[8666]='Tempest`tem\'-pest (ce\'-arah, or se\'-arah, "a whirlwind," zerem, "overflowing rain"; cheimon, thuella): Heavy storms of wind and rain are common in Palestine and the Mediterranean. The storms particularly mentioned in the Bible are:<P>(1) the 40 days\' rain of the great flood of Noah (<a onClick="return mV(\'Gen\',7,4);">Ge 7:4</a>);<P>(2) hail and rain as a plague in Egypt (<a onClick="return mV(\'Exd\',9,18);">Ex 9:18</a>);<P>(3) the great rain after the drought and the contest of Elijah on Carmel (<a onClick="return mV(\'1Ki\',18,45);">1Ki 18:45</a>);<P>(4) the tempest on the sea in the story of Jonah (<a onClick="return mV(\'Jon\',1,4);">1:4</a>);<P>(5) the storm on the Lake of Galilee when Jesus was awakened to calm the waves (<a onClick="return mV(\'Mat\',8,24);">Mt 8:24</a>; <a onClick="return mV(\'Mar\',4,37);">Mr 4:37</a>; <a onClick="return mV(\'Luk\',8,23);">Lu 8:23</a>);<P>(6) the storm causing the shipwreck of Paul at Melita (<a onClick="return mV(\'Act\',27,18);">Ac 27:18</a>).<P>Frequent references are found to God\'s power over storm and use of the tempest in His anger: "He maketh the storm a calm" (<a onClick="return mV(\'Psa\',107,29);">Ps 107:29</a>); He sends the "tempest of hail, a destroying storm" (<a onClick="return mV(\'Isa\',28,2);">Isa 28:2</a>). See also <a onClick="return mV(\'Job\',9,17);">Job 9:17</a>; <a onClick="return mV(\'Job\',21,18);">21:18</a>; <a onClick="return mV(\'Isa\',30,30);">Isa 30:30</a>. Yahweh overwhelms His enemies as with a storm: "She shall be visited of Yahweh of hosts with thunder, and with earthquake, and great noise, with whirlwind and tempest" (<a onClick="return mV(\'Isa\',29,6);">Isa 29:6</a>). Yahweh is a "refuge from the storm" (<a onClick="return mV(\'Isa\',25,4);">Isa 25:4</a>; <a onClick="return mV(\'Isa\',4,6);">4:6</a>).``85';
isbe[8667]='Temple Keepers (Servants)`After the conquest of Midian, "Moses took one drawn out of every fifty, both of man and of beast, and gave them unto the Levites, that kept the charge of the tabernacle of Yahweh" (<a onClick="return mV(\'Num\',31,47);">Nu 31:47</a>; compare <a onClick="return mV(\'Num\',31,30);">31:30</A>). Similarly, after the deception of Joshua by the Gibeonites, "Joshua made them that day hewers of wood and drawers of water for the congregation, and for the altar of Yahweh, unto this day" (<a onClick="return mV(\'Jos\',9,27);">Jos 9:27</a>). The object of these notices, evidently, is to explain how a non-Israelitish class of sanctuary servants had taken their origin. Their existence at the time of Ezekiel, however, is the object of one of the latter\'s severest denunciations: "Ye have brought in foreigners, uncircumcised in heart and uncircumcised in flesh, to be in my sanctuary, to profane it....And ye have not kept the charge of my holy things; but ye have set keepers of my charge in my sanctuary for yourselves" (<a onClick="return mV(\'Eze\',44,7);">Eze 44:7</a>f). In place of these servants or "keepers" Ezekiel directs that such Levites are to be employed as have been degraded from priestly privileges for participating in idolatrous worship. On them shall devolve all the various duties of the temple except the actual offering of sacrifices, which is reserved for "the priests the Levites, the sons of Zadok" (<a onClick="return mV(\'Eze\',44,\'10-15\');">44:10-15</a>). For the use of this deposed class, "the priests, the keepers of the charge of the house," is reserved a special room in the inner court of the temple (<a onClick="return mV(\'Eze\',40,44);">40:44</a>f).`<a href="./study/isbe/search.html?string=NETHINIM">NETHINIM</a>`48';
isbe[8668]='Temple, A1`tem\'-p\'l (hekhal, "palace"; sometimes, as in <a onClick="return mV(\'1Ki\',6,3,5);">1Ki 6:3,5</a>, etc.; <a onClick="return mV(\'Eze\',41,1,15);">Eze 41:1,15</a>ff, used for "the holy place" only; bayith, "house," thus always in the Revised Version (British and American); hieron, naos):<P><b>A. STRUCTURE AND HISTORY</b><P class="in15"><b>I. SOLOMON\'S TEMPLE</b><P class="in30"><b>I. INTRODUCTORY</b><P class="in45">1. David\'s Project<P class="in45">2. Plans and Preparations<P class="in45">3. Character of the Building<P class="in45">4. Site of the Temple<P class="in45">5. Phoenician Assistance<P class="in30"><b>II. THE TEMPLE BUILDING</b><P class="in45">1. In General<P class="in45">2. Dimensions, Divisions and Adornments<P class="in45">3. The Side-Chambers<P class="in45">4. The Porch and Pillars<P class="in30"><b>III. COURTS, GATES ANY ROYAL BUILDINGS</b><P class="in45">1. The Inner Court<P class="in60">(1) Walls<P class="in60">(2) Gates<P class="in45">2. The Great Court<P class="in45">3. The Royal Buildings<P class="in30"><b>IV. FURNITURE OF THE TEMPLE</b><P class="in45">1. The Sanctuary<P class="in60">(1) The "Debhir"<P class="in60">(2) The "Hekhal"<P class="in45">2. The Court (Inner)<P class="in60">(1) The Altar<P class="in60">(2) The Molten (Bronze) Sea<P class="in60">(3) The Layers and Their Bases<P class="in30"><b>V. HISTORY OF THE TEMPLE</b><P class="in45">1. Building and Dedication<P class="in45">2. Repeated Plunderings, etc.<P class="in45">3. Attempts at Reform<P class="in45">4. Final Overthrow<P><b>II. EZEKIEL\'S PROPHETIC SKETCH</b><P class="in15"><b>I. INTRODUCTORY</b><P class="in45">1. Relation to History of Temple<P class="in45">2. The Conception Unique and Ideal<P class="in45">3. Its Symmetrical Measurements<P class="in15"><b>II. PLAN OF THE TEMPLE</b><P class="in45">1. The Outer Court<P class="in45">2. The Inner Court<P class="in45">3. The Temple Building and Adjuncts<P><b>III. THE TEMPLE OF ZERUBBABEL</b><P class="in15"><b>I. INTRODUCTORY</b><P class="in45">1. The Decree of Cyrus<P class="in45">2. Founding of the Temple<P class="in45">3. Opposition and Completion of the Work<P class="in15"><b>II. THE TEMPLE STRUCTURE</b><P class="in45">1. The House<P class="in45">2. Its Divisions and Furniture<P class="in45">3. Its Courts, Altar, etc.<P class="in45">4. Later Fortunes<P><b>IV. THE TEMPLE OF HEROD</b><P class="in15"><b>I. INTRODUCTORY</b><P class="in45">1. Initiation of the Work<P class="in45">2. Its Grandeur<P class="in45">3. Authorities<P class="in45">4. Measurements<P class="in15"><b>II. THE TEMPLE AND ITS COURTS</b><P class="in45">1. Temple Area—Court of Gentiles<P class="in45">2. Inner Sanctuary Inclosure<P class="in60">(1) Wall, "Chel," "Coregh," Gates<P class="in60">(2) Court of the Women<P class="in60">(3) Inner Courts: Court of Israel; Court of the Priests<P class="in60">(4) The Altar, etc.<P class="in45">3. The Temple Building<P class="in60">(1) House and Porch<P class="in60">(2) "Hekhal" and "Debhir"<P class="in60">(3) The Side-Chambers<P class="in15"><b>III. NEW TESTAMENT ASSOCIATIONS OF HEROD\'S TEMPLE</b><P class="in45">1. Earlier Incidents<P class="in45">2. Jesus in the Temple<P class="in45">3. The Passion-Week<P class="in45">4. Apostolic Church<P class="in45">5. The Temple in Christian Thought<P><b>LITERATURE</b><hr /><P>A. STRUCTURE AND HISTORY<P>I. SOLOMON\'S TEMPLE<P>I. Introductory.<P>1. David\'s Project:<P>The tabernacle having lasted from the exodus till the commencement of the monarchy, it appeared to David to be no longer fitting that the ark of God should dwell within curtains (it was then in a tent David had made for it on Zion: <a onClick="return mV(\'2Sa\',6,17);">2Sa 6:17</a>), while he himself dwelt in a cedar-lined house. The unsettled and unorganized state of the nation, which had hitherto necessitated a portable structure, had now given place to an established kingdom. The dwelling of Yahweh should therefore be henceforth a permanent building, situated at the center of the nation\'s life, and "exceeding magnificent" (<a onClick="return mV(\'1Ch\',22,5);">1Ch 22:5</a>), as befitted the glory of Yahweh, and the prospects of the state.<P>2. Plans and Preparations:<P>David, however, while honored for his purpose, was not permitted, because he had been a man of war (<a onClick="return mV(\'2Sa\',7,\'1-\');">2Sa 7</a>; <a onClick="return mV(\'1Ch\',22,8);">1Ch 22:8</a>; compare <a onClick="return mV(\'1Ki\',5,3);">1Ki 5:3</a>), to execute the work, and the building of the house was reserved for his son, Solomon. According to the Chronicler, David busied himself in making extensive and costly preparations of wood, stone, gold, silver, etc., for the future sanctuary and its vessels, even leaving behind him full and minute plans of the whole scheme of the building and its contents, divinely communicated (<a onClick="return mV(\'1Ch\',22,2);">1Ch 22:2</a>ff; <a onClick="return mV(\'1Ch\',28,11);">28:11</a>ff; <a onClick="return mV(\'1Ch\',29,\'1-\');">29)</a>. The general fact of lengthened preparation, and even of designs, for a structure which so deeply occupied his thoughts, is extremely probable (compare <a onClick="return mV(\'1Ki\',7,51);">1Ki 7:51</a>).<P>3. Character of the Building:<P>The general outline of the structure was based on that of the tabernacle (on the modern critical reversal of this relation, see under B, below). The dimensions are in the main twice those of the tabernacle, though it will be seen below that there are important exceptions to this rule, on which the critics found so much. The old question (see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>) as to the shape of the building—flat or gable-roofed—here again arises. Not a few modern writers (Fergusson, Schick, Caldecott, etc.), with some older, favor the tentlike shape, with sloping roof. It does not follow, however, even if this form is, with these writers, admitted for the tabernacle—a "tent"—that it is applicable, or likely, for a stone "house," and the measurements of the Temple, and mention of a "ceiling" (<a onClick="return mV(\'1Ki\',6,15);">1Ki 6:15</a>), point in the opposite direction. It must still be granted that, with the scanty data at command, all reconstructions of the Solomonte Temple leave much to be filled in from conjecture. Joseph Hammond has justly said: "It is certain that, were a true restoration of the Temple ever to be placed in our hands, we should find that it differed widely from all attempted \'restorations\' of the edifice, based on the scanty and imperfect notices of our historian and Ezekiel" (Commentary on <span class="notag">1Ki 6</span>, "Pulpit Commentary").<P>4. Site of the Temple:<P>The site of the Temple was on the eastern of the two hills on which Jerusalem was built—that known in Scripture as Mt. Moriah (<a onClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a>) or Mt. Zion (the traditional view which locates Zion on the western hill, on the other side of the Tyropoeon, though defended by some, seems untenable; see "Zion," in HDB; "Jerusalem," in DB, etc.). The place is more precisely defined as that where Araunah (Ornan) had his threshing-floor, and David built his altar after the plague (<a onClick="return mV(\'1Ch\',21,22);">1Ch 21:22</a>; <a onClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a>). This spot, in turn, is now all but universally held to be marked by the sacred rock, es-Sakhra (within what is called the Haram area on the eastern summit; see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>), above which the "Dome of the Rock," or so-called "Mosque of Omar," now stands. Here, according to traditional belief, was reared the altar of burnt offering, and to the west of it was built the Temple. This location is indeed challenged by Fergusson, W. R. Smith, and others, who transfer the Temple-site to the southwestern angle of the Haram area, but the great majority of scholars take the above view. To prepare a suitable surface for the Temple and connected buildings (the area may have been some 600 ft. east to west, and 300 to 400 ft. north to south), the summit of the hill had to be leveled, and its lower parts heightened by immense substructures (Josephus, Ant, VIII iii, 9; XV, xi, 3; BJ, V, v, 1), the remains of which modern excavations have brought to light (compare Warren\'s Underground Jerusalem; G. A. Smith\'s Jerusalem, etc.).<P>5. Phoenician Assistance:<P>For aid in his undertaking, Solomon invited the cooperation of Hiram, king of Tyre, who willingly lent his assistance, as he had before helped David, granting Solomon permission to send his servants to cut down timber in Lebanon, aiding in transport, and in the quarrying and hewing of stones, and sending a skillful Tyrian artist, another Hiram, to superintend the designing and graving of objects made of the precious metals, etc. For this assistance Solomon made a suitable recompense (<a onClick="return mV(\'1Ki\',5,\'1-\');">1Ki 5</a>; <a onClick="return mV(\'2Ch\',2,\'1-\');">2Ch 2</a>). Excavations seem to show that a large part of the limestone of which the temple was built came from quarries in the immediate neighborhood of Jerusalem (Warren, Underground Jerusalem, 60). The stones were cut, hewn and polished at the places whence they were taken, so that "there was neither hammer nor axe nor any tool of iron heard in the house, while it was in building" (<a onClick="return mV(\'1Ki\',5,17,18);">1Ki 5:17,18</a>; <a onClick="return mV(\'1Ki\',6,7);">6:7</a>). Opinions differ as to the style of architecture of the building. It was probably unique, but Phoenician art also must have left its impress upon it.<P>See <a href="./study/isbe/search.html?string=ARCHITECTURE">ARCHITECTURE</A>.<P>II. The Temple Building.<P>1. In General:<P>In contrast with the tabernacle, which was a portable "tent," consisting of a framework of acacia wood, with rich coverings hung over it, and standing in a "court" enclosed by curtains (see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>), the Temple was a substantial "house" built of stone (probably the hard white limestone of the district), with chambers in three stories, half the height of the building (<a onClick="return mV(\'1Ki\',6,5,6);">1Ki 6:5,6</a>), round the sides and back, and, in front, a stately porch (<a onClick="return mV(\'1Ki\',6,3);">1Ki 6:3</a>), before which stood two lofty bronze pillars—Jachin and Boaz (<a onClick="return mV(\'1Ki\',7,21);">1Ki 7:21</a>; <a onClick="return mV(\'2Ch\',3,4,15,16,17);">2Ch 3:4,15-17</a>). Within, the house was lined with cedar, overlaid with gold, graven with figures of cherubim, palms, and open flowers (<a onClick="return mV(\'1Ki\',6,15,18,21,22,29);">1Ki 6:15,18,21,22,29</a>), and a partition of cedar or stone divided the interior into two apartments—one the holy place (the hekhal), the other the most holy place, or "oracle" (debhir) (<a onClick="return mV(\'1Ki\',6,\'16-18\');">1Ki 6:16-18</a>). The floor was of stone, covered with fir (or cypress), likewise overlaid with gold (<a onClick="return mV(\'1Ki\',6,15,30);">1Ki 6:15,30</a>). The platform on which the whole building stood was probably raised above the level of the court in front, and the building may have been approached by steps. Details are not given. The more particular description follows.<P>2. Dimensions, Divisions and Adornments:<P>The Temple, like the tabernacle, stood facing east, environed by "courts" ("inner" and "greater"), which are dealt with below, Internally, the dimensions of the structure were, in length and width, double those of the tabernacle, namely, length 60 cubits, width 20 cubits. The height, however, was 30 cubits, thrice that of the tabernacle (<a onClick="return mV(\'1Ki\',6,2);">1Ki 6:2</a>; compare <a onClick="return mV(\'1Ki\',6,18,20);">6:18,20</a>). The precise length of the cubit is uncertain (see <a href="./study/isbe/search.html?string=CUBIT">CUBIT</A>); here, as in the article <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>, it is taken as approximately 18 inches. In internal measurement, therefore, the Temple was approximately 90 ft. long, 30 ft. broad, and 45 ft. high. This allows nothing for the thickness of the partition between the two chambers. For the external measurement, the thickness of the walls and the width of the surrounding chambers and their walls require to be added. It cannot positively be affirmed that the dimensions of the Temple, including the porch, coincided precisely with those of Ezekiel\'s temple (compare Keil on <a onClick="return mV(\'1Ki\',6,9,10);">1Ki 6:9,10</a>); still, the proportions must have closely approximated, and may have been in agreement.<P>The walls of the building, as stated, were lined within with cedar; the holy place was ceiled with fir or cypress (<a onClick="return mV(\'2Ch\',3,5);">2Ch 3:5</a>; the "oracle" perhaps with cedar); the flooring likewise was of fir (<a onClick="return mV(\'1Ki\',6,15);">1Ki 6:15</a>). All was overlaid with gold, and walls and doors (see below) were adorned with gravings of cherubim, palm trees, and open flowers (<a onClick="return mV(\'1Ki\',6,\'19-35\');">1Ki 6:19-35</a>; <a onClick="return mV(\'2Ch\',3,6);">2Ch 3:6</a> adds "precious stones"). Of the two chambers into which the house was divided, the outermost (or hekhal) was 40 cubits (60 ft.) long, and 20 cubits (30 ft.) wide (<a onClick="return mV(\'1Ki\',6,17);">1Ki 6:17</a>); the innermost (or debhir) was 20 cubits in length, breadth and height—a cube (<a onClick="return mV(\'1Ki\',6,20);">1Ki 6:20</a>). As the height of the Temple internally was 30 cubits, it is obvious that above the most holy place there was a vacant space 20 cubits long and 10 high. This apparently was utilized as a chamber or chambers for storage or other purposes. It has been held by some (Kurtz, Fergusson, etc.) that the ceiling along the entire Temple was at the height of 20 cubits, with chambers above (compare the allusion to "upper chambers" in <a onClick="return mV(\'1Ch\',28,11);">1Ch 28:11</a>; <a onClick="return mV(\'2Ch\',3,9);">2Ch 3:9</a>); this, however, seems unwarranted (compare Bahr on <a onClick="return mV(\'1Ki\',6,\'14-19\');">1Ki 6:14-19</a>; the upper chambers" were "overlaid with gold," <a onClick="return mV(\'2Ch\',3,9);">2Ch 3:9</a>, which points to something nobler in character). The inner chamber was a place of "thick darkness" (<a onClick="return mV(\'1Ki\',8,12);">1Ki 8:12</a>).<P>3. The Side-Chambers:<P>The thickness of the Temple walls is not given, but the analogy of Ezekiel\'s temple (<a onClick="return mV(\'Eze\',41,\'1-\');">Eze 41</a>) and what is told of the side-chambers render it probable that the thickness was not less than 6 cubits (9 ft.). Around the Temple, on its two sides and at the back, were built chambers (tsela\'oth, literally, "ribs"), the construction of which is summarily described. They were built in three stories, each story 5 cubits in height (allowance must also be made for flooring and roofing), the lowest being 5 cubits in breadth, the next 6 cubits, and the highest 7 cubits. This is explained by the fact that the chambers were not to be built into the wall of the Temple, but were to rest on ledges or rebatements in the wall, each rebate a cubit in breadth, so that the wall became thinner, and the chambers broader, by a cubit, each stage in the ascent. (<a onClick="return mV(\'1Ki\',6,\'5-10\');">1Ki 6:5-10</a>). The door admitting into these chambers was apparently in the middle of the right side of the house, and winding stairs led up to the second and third stories (<a onClick="return mV(\'1Ki\',6,8);">1Ki 6:8</a>). It is not stated how many chambers there were; Josephus (Ant., VIII, iii, 2) gives the number as 30, which is the number in Ezekiel\'s temple (<a onClick="return mV(\'Eze\',41,6);">Eze 41:6</a>). The outer wall of the chambers, which in Ezekiel <span class="noTag">is</span> 5 cubits thick (<a onClick="return mV(\'Eze\',41,9);">41:9</A>), may have been the same here, though some make it less. It is a question whether the rebatements were in the Temple wall only, or were divided between it and the outer wall; the former seems the more probable opinion, as nothing is said of rebatements in the outer wall. Above the chambers on either side were "windows of fixed lattice-work" (<a onClick="return mV(\'Eze\',41,4);">41:4</A>), i.e. openings which could not be closed ("windows broad within and narrow without"). The purposes for which the chambers were constructed are not mentioned. They may have been used partly for storage, partly for the accommodation of those engaged in the service of the Temple (compare <a onClick="return mV(\'1Ch\',9,27);">1Ch 9:27</a>).<P>4. The Porch and Pillars:<P>A conspicuous feature of the Temple was the porch in front of the building, with its twin pillars, Jachin and Boaz. Of the porch itself a very brief description is given. It is stated to have been 20 cubits broad—the width of the house—and 10 cubits deep (<a onClick="return mV(\'1Ki\',6,3);">1Ki 6:3</a>). Its height is not given in 1 Kings, but it is said in <a onClick="return mV(\'2Ch\',3,4);">2Ch 3:4</a> to have been 120 cubits, or approximately 180 ft. Some accept this enormous height (Ewald, Stanley, etc.), but the majority more reasonably infer that there has been a corruption of the number. It may have been the same height as the Temple—30 cubits. It was apparently open in front, and, from what is said of its being "overlaid within with pure gold" (<a onClick="return mV(\'2Ch\',3,4);">2Ch 3:4</a>), it may be concluded that it shared in the splendor of the main building, and had architectural features of its own which are not recorded. Some find here, in the wings, treasury chambers, and above, "upper chambers," but such restorations are wholly conjectural. It is otherwise with the monumental brass (bronze) pillars—Jachin and Boaz—of which a tolerably full description is preserved (<a onClick="return mV(\'1Ki\',7,\'15-22\');">1Ki 7:15-22</a>; <a onClick="return mV(\'2Ch\',3,\'15-17\');">2Ch 3:15-17</a>; <a onClick="return mV(\'2Ch\',4,\'11-13\');">4:11-13</a>; compare <a onClick="return mV(\'Jer\',52,\'20-23\');">Jer 52:20-23</a>), still, however, leaving many points doubtful. The pillars which stood in front of the porch, detached from it, were hollow bronze castings, each 18 cubits (27 ft.) in height (35 cubits in <a onClick="return mV(\'2Ch\',3,15);">2Ch 3:15</a> is an error), and 12 cubits (18 ft.) in circumference, and were surmounted by capitals 5 cubits (7 1/2 ft.) high, richly ornamented on their lower, bowl-shaped (<a onClick="return mV(\'1Ki\',7,20,41,42);">1Ki 7:20,41,42</a>) parts, with two rows of pomegranates, enclosing festoons of chain-work, and, in their upper parts, rising to the height of 4 cubits (6 ft.) in graceful lily-work.<P>See <a href="./study/isbe/search.html?string=JACHIN+AND+BOAZ">JACHIN AND BOAZ</a>.<P>It was seen that the holy place (hekhal) was divided from the most holy (debhir) by a partition, probably of cedar wood, though some think of a stone wall, one or even two cubits thick. In this partition were folding doors, made of olive wood, with their lintels 4 cubits wide (<a onClick="return mV(\'1Ki\',6,31);">1Ki 6:31</a>; some interpret differently, and understand the upper part of the doorway to be a pentagon). The doors, like the walls, had carvings of cherubim, palm trees, and flowers, and the whole was gold-plated (<a onClick="return mV(\'1Ki\',6,32);">1Ki 6:32</a>). Behind the partition hung the sanctuary veil (<a onClick="return mV(\'2Ch\',3,14);">2Ch 3:14</a>). At the entrance of the Temple, similarly, were folding doors, with their lintels 5 cubits in width, only this time the posts only were of olive, while the doors, divided into two leaves, were of fir (or cypress) wood (<a onClick="return mV(\'1Ki\',6,\'33-35\');">1Ki 6:33-35</a>). The carving and gold-plating were as on the inner doors, and all the doors had hinges of gold (<a onClick="return mV(\'1Ki\',7,50);">1Ki 7:50</a>).<P>III. Courts, Gates and Royal Buildings.<P>The Temple was enclosed in "courts"—an "inner" (<a onClick="return mV(\'1Ki\',6,36);">1Ki 6:36</a>; <a onClick="return mV(\'1Ki\',7,12);">7:12</a>; <a onClick="return mV(\'2Ch\',4,9);">2Ch 4:9</a>, "court of the priests"; <a onClick="return mV(\'Jer\',36,10);">Jer 36:10</a>, "the upper court"; <a onClick="return mV(\'Eze\',8,3,16);">Eze 8:3,16</a>; <a onClick="return mV(\'Eze\',10,3);">10:3</a>), and an outer or "greater court" (<a onClick="return mV(\'1Ki\',7,9,12);">1Ki 7:9,12</a>; <a onClick="return mV(\'2Ch\',4,9);">2Ch 4:9</a>)—regarding the situation, dimensions and relations of which, alike to one another and to the royal buildings described in <a onClick="return mV(\'1Ki\',7,\'1-\');">1Ki 7</a> the scanty notices in the history leave room for great diversity of opinion.<P>See <a href="./study/isbe/search.html?string=COURT+OF+THE+SANCTUARY">COURT OF THE SANCTUARY</A>.<P>1. The Inner Court:<P>The "inner court" (chatser ha-penimith) is repeatedly referred to (see above). Its dimensions are not given, but they may be presumed to be twice those of the tabernacle court, namely, 200 cubits (300 ft.) in length and 100 cubits (150 ft.) in breadth. The name in <a onClick="return mV(\'Jer\',36,10);">Jer 36:10</a>, "the upper court," indicates that it was on a higher level than the "great court," and as the Temple was probably on a platform higher still, the whole would present a striking terraced aspect.<P>(1) Walls:<P>The walls of the court were built of three rows of hewn stone, with a coping of cedar beams (<a onClick="return mV(\'1Ki\',6,36);">1Ki 6:36</a>). Their height is not stated; it is doubtful if it would admit of the colonnades which some have supposed; but "chambers" are mentioned (<a onClick="return mV(\'Jer\',35,4);">Jer 35:4</a>; <a onClick="return mV(\'Jer\',36,10);">36:10</a>—if, indeed, all belong to the "inner" court), which imply a substantial structure. It was distinctively "the priests\' court" (<a onClick="return mV(\'2Ch\',4,9);">2Ch 4:9</a>); probably, in part, was reserved for them; to a certain degree, however, the laity had evidently free access into it (<a onClick="return mV(\'Jer\',36,10);">Jer 36:10</a>; <a onClick="return mV(\'Jer\',38,14);">38:14</a>; <a onClick="return mV(\'Eze\',8,16);">Eze 8:16</a>, etc.). The mention of "the new court" (<a onClick="return mV(\'2Ch\',20,5);">2Ch 20:5</a>, time of Jehoshaphat), and of "the two courts of the house of Yahweh" (<a onClick="return mV(\'2Ki\',21,5);">2Ki 21:5</a>; <a onClick="return mV(\'2Ch\',33,5);">2Ch 33:5</a>, time of Manasseh), suggests subsequent enlargement and division.<P>(2) Gates:<P>Though gates are not mentioned in the narratives of the construction, later allusions show that there were several, though not all were of the time of Solomon. The principal entrance would, of course, be that toward the east (see <a href="./study/isbe/search.html?string=EAST+GATE">EAST GATE</a>). In <a onClick="return mV(\'Jer\',26,10);">Jer 26:10</a> there is allusion to "the entry of the new gate of Yahweh\'s house." This doubtless was "the upper gate" built by Jotham (<a onClick="return mV(\'2Ki\',15,35);">2Ki 15:35</a>) and may reasonably be identified with the "gate that looketh toward the north" and the "gate of the altar" (i.e. through which the sacrifices were brought) in <a onClick="return mV(\'Eze\',8,3,5);">Eze 8:3,5</a>, and with "the upper gate of Benjamin" in <a onClick="return mV(\'Jer\',20,3);">Jer 20:3</a>. Mention is also made of a "gate of the guard" which descended to the king\'s house (<a onClick="return mV(\'2Ki\',11,19);">2Ki 11:19</a>; see below). Jeremiah speaks of a "third entry that is in the house of Yahweh" (<a onClick="return mV(\'Jer\',38,14);">38:14</A>), and of "three keepers of the threshold" (<a onClick="return mV(\'Jer\',52,24);">52:24</A>), but it is not clear which court is intended. <P>2. The Great Court:<P>The outer or "great court" of the Temple (chatser ha-gedholah) opens up more difficult problems. Some regard this court as extending to the east in front of the "inner court"; others, as Keil, think of it as a great enclosure surrounding the "inner court" and stretching perhaps 150 cubits east of the latter (compare his Biblical Archaeology, I, 170-71). These writers remove the court from all connection with the royal buildings of <a onClick="return mV(\'1Ki\',7,\'1-\');">1Ki 7</a>, and distinguish it from "the great court of <a onClick="return mV(\'1Ki\',7,9,12);">7:9,12</A>." A quite different construction is that advocated by Stade and Benzinger, and adopted by most recent authorities (compare articles on "Temple" in HDB, IV, in EB, IV, in one-vol HDB, in DB (Dalman); G. A. Smith, Jerusalem, II, 59ff, etc.). The great court, on this view, not only surrounds the Temple, with its (inner) court, but, extending to the south, encloses the whole complex of the royal buildings of <a onClick="return mV(\'1Ki\',7,\'1-\');">1Ki 7</a>. This has the advantage of bringing together the references to the "great court" in <a onClick="return mV(\'1Ki\',7,9,12);">1Ki 7:9,12</a> and the other references to the outer court. The court, thus conceived, must have been very large. The extensive part occupied by the royal buildings being on a lower level than the "inner court," entrance to it is thought to have been by "the gate of the guard unto the king\'s house" mentioned in <a onClick="return mV(\'2Ki\',11,19);">2Ki 11:19</a>. Its wall, like that of the inner court, was built in three courses of hewn stone, and one course of cedar (<a onClick="return mV(\'1Ki\',7,12);">1Ki 7:12</a>). Its gates overlaid with brass (<a onClick="return mV(\'2Ch\',4,9);">2Ch 4:9</a>, i.e., "bronze") show that the masonry must have been both high and substantial. On the "other court" of <a onClick="return mV(\'1Ki\',7,8);">1Ki 7:8</a>, see next paragraph.<P>3. The Royal Buildings:<P>The group of buildings which, on theory now stated, were enclosed by the southern part of the great court, are those described in <a onClick="return mV(\'1Ki\',7,\'1-12\');">1Ki 7:1-12</a>. They were of hewn stone and cedar wood (<a onClick="return mV(\'1Ki\',7,\'9-11\');">1Ki 7:9-11</a>), and embraced:<P>(1) The king\'s house, or royal palace (<a onClick="return mV(\'1Ki\',7,8);">1Ki 7:8</a>), in close contiguity with the Temple-court (<a onClick="return mV(\'2Ki\',11,19);">2Ki 11:19</a>).<P>(2) Behind this to the west, the house of Pharaoh\'s daughter (<a onClick="return mV(\'2Ki\',11,9);">2Ki 11:9</a>)—the apartments of the women. Both of these were enclosed in a "court" of their own, styled in <a onClick="return mV(\'2Ki\',11,8);">2Ki 11:8</a> "the other court," and in <a onClick="return mV(\'2Ki\',20,4);">2Ki 20:4</a> margin "the middle court."<P>(3) South of this stood the throne-room, and porch or hall of judgment, paneled in cedar" from floor to floor," i.e. from floor to ceiling (<a onClick="return mV(\'2Ki\',11,7);">2Ki 11:7</a>). The throne, we read later (<a onClick="return mV(\'1Ki\',10,\'18-20\');">1Ki 10:18-20</a>), was of ivory, overlaid with gold, and on either side of the throne, as well as of the six steps that led up to it, were lions. The hall served as an audience chamber, and for the administration of justice.<P>(4) Yet farther south stood the porch or hall of pillars, 50 cubits (75 ft.) long and 30 cubits (45 ft.) broad, with a sub-porch of its own (<a onClick="return mV(\'1Ki\',10,6);">1Ki 10:6</a>). It is best regarded as a place of promenade and vestibule to the hall of judgment.<P>(5) Lastly, there was the imposing and elaborate building known as "the house of the forest of Lebanon" (<a onClick="return mV(\'1Ki\',10,\'2-5\');">1Ki 10:2-5</a>), which appears to have received this name from its multitude of cedar pillars.<P>The scanty hints as to its internal arrangements have baffled the ingenuity of the commentators. The house was 100 cubits (150 ft.) in length, 50 cubits (75 ft.) in breadth, and 30 cubits (45 ft.) in height. Going round the sides and back there were apparently four rows of pillars. The Septuagint has three rows), on which, supported by cedar beams, rested three tiers or stories of side-chambers (literally, "ribs," as in <a onClick="return mV(\'1Ki\',6,5);">1Ki 6:5</a>; compare the Revised Version margin). In <a onClick="return mV(\'1Ki\',6,3);">1Ki 6:3</a> it is disputed whether the number "forty and five; fifteen in a row" (as the Hebrew may be read) refers to the pillars or to the chambers; if to the former, the Septuagint reading of "three rows" is preferable. The windows of the tiers faced each other on the opposite sides (<a onClick="return mV(\'1Ki\',6,4,5);">1Ki 6:4,5</a>). But the whole construction is obscure and doubtful. The spacious house was used partly as an armory; here Solomon put his 300 shields of beaten gold (<a onClick="return mV(\'1Ki\',10,17);">1Ki 10:17</a>).<P>IV. Furniture of the Temple.<P>1. The Sanctuary:<P>We treat here, first, of the sanctuary in its two divisions, then of the (inner) court.<P>(1) The "Debhir".<P>In the most holy place, or debhir, of the sanctuary stood, as before, the old Mosaic ark of the covenant, with its two golden cherubim above the mercy-seat (see <a href="./study/isbe/search.html?string=ARK+OF+THE+COVENANT">ARK OF THE COVENANT</a>; <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>). Now, however, the symbolic element was increased by the ark being placed between two other figures of cherubim, made of olive wood, overlaid with gold, 10 cubits (15 ft.) high, their wings, each 5 cubits (7 1/2 ft.) long, outstretched so that they reached from wall to wall of the oracle (20 cubits), the inner wings meeting in the center (<a onClick="return mV(\'1Ki\',6,\'23-28\');">1Ki 6:23-28</a>; <a onClick="return mV(\'2Ch\',3,\'10-13\');">2Ch 3:10-13</a>).<P>See <a href="./study/isbe/search.html?string=CHERUBIM">CHERUBIM</a>.<P>(2) The "Hekhal".<P>In the holy place, or hekhal, the changes were greater. (a) Before the oracle, mentioned as belonging to it (<a onClick="return mV(\'1Ki\',6,22);">1Ki 6:22</a>), stood the altar of incense, covered with cedar, and overlaid with gold (<a onClick="return mV(\'1Ki\',6,\'20-22\');">1Ki 6:20-22</a>; <a onClick="return mV(\'1Ki\',7,48);">7:48</a>; <a onClick="return mV(\'2Ch\',4,19);">2Ch 4:19</a>; see <a href="./study/isbe/search.html?string=ALTAR+OF+INCENSE">ALTAR OF INCENSE</a>). It is an arbitrary procedure of criticism to attempt to identify this altar with the table of shewbread. (b) Instead of one golden candlestick, as in the tabernacle, there were now 10, 5 placed on one side and 5 on the other, in front of the oracle. All, with their utensils, were of pure gold (<a onClick="return mV(\'1Ki\',7,49);">1Ki 7:49</a>; <a onClick="return mV(\'2Ch\',4,7);">2Ch 4:7</a>). (c) Likewise, for one table of shewbread, there were now 10, 5 on one side, 5 on the other, also with their utensils made of gold (<a onClick="return mV(\'1Ki\',7,48);">1Ki 7:48</a>, where, however, only one table is mentioned; <a onClick="return mV(\'2Ch\',4,8);">2Ch 4:8</a>, "100 basins of gold"). As these objects, only enlarged in number and dimensions, are fashioned after the model of those of the tabernacle, further particulars regarding them are not given here.<P>2. The Court (Inner):<P>(1) The Altar.<P>The most prominent object in the Temple-court was the altar of burnt offering, or brazen altar (see <a href="./study/isbe/search.html?string=BRAZEN+ALTAR">BRAZEN ALTAR</a>). The site of the altar, as already seen, was the rock es Sakhra], where Araunah had his threshing-floor. The notion of some moderns that the rock itself was the altar, and that the brazen (bronze) altar was introduced later, is devoid of plausibility. An altar is always something reared or built (compare <a onClick="return mV(\'2Sa\',24,18,25);">2Sa 24:18,25</a>). The dimensions of the altar, which are not mentioned in 1 Kings, are given in <a onClick="return mV(\'2Ch\',4,1);">2Ch 4:1</a> as 20 cubits (30 ft.) long, 20 cubits (30 ft.) broad, and 10 cubits (15 ft.) high. As utensils connected with it—an incidental confirmation of its historicity—are pots, shovels, basins and fleshhooks (<a onClick="return mV(\'1Ki\',7,40,45);">1Ki 7:40,45</a>; <a onClick="return mV(\'2Ch\',4,11,16);">2Ch 4:11,16</a>). It will be observed that the assumed halving proportions of the tabernacle are here quite departed from (compare <a onClick="return mV(\'Exd\',27,1);">Ex 27:1</a>).<P>(2) The Molten (Bronze) Sea.<P>A new feature in the sanctuary court—taking the place of the "laver" in the tabernacle—was the "molten sea," the name being given to it for its great size. It was an immense basin of bronze, 5 cubits (7 1/2 ft.) high, 10 cubits (15 ft.) in diameter at the brim, and 30 cubits (45 ft.) in circumference, resting on 12 bronze oxen, and placed between the altar and the Temple-porch, toward the south (<a onClick="return mV(\'1Ki\',7,\'23-26\',39);">1Ki 7:23-26,39</a>; <a onClick="return mV(\'2Ch\',4,\'2-5\',10);">2Ch 4:2-5,10</a>). The bronze was a handbreadth in thickness. The brim was shaped like the flower of a lily, and encompassing the basin were ornamental knops. Its capacity is given as 2,000 baths (<a onClick="return mV(\'1Ki\',7,26);">1Ki 7:26</a>; by error in <a onClick="return mV(\'2Ch\',4,5);">2Ch 4:5</a>, <span class="noTag">3,000 baths</span>). The oxen on which it rested faced the four cardinal points—three looking each way. The "sea," like the laver, doubtless supplied the water for the washing of the priests\' hands and feet (compare <a onClick="return mV(\'Exd\',30,18);">Ex 30:18</a>; <a onClick="return mV(\'Exd\',38,8);">38:8</a>). The view of certain scholars (Kosters, Gunkel, etc.) that the "sea" is connected with Babylonian mythical ideas of the great deep is quite fanciful; no hint appears of such significance in any part of the narrative. The same applies to the lavers in the next paragraph.<P>(3) The Lavers and Their Bases.<P>The tabernacle laver had its place taken by the "sea" just described, but the Temple was also provided with 10 lavers or basins, set on "bases" of elaborate design and moving upon wheels—the whole made of bronze (<a onClick="return mV(\'1Ki\',7,\'27-37\');">1Ki 7:27-37</a>). Their use seems to have been for the washing of sacrifices (<a onClick="return mV(\'2Ch\',4,6);">2Ch 4:6</a>), for which purpose they were placed, 5 on the north side, and 5 on the south side, of the Temple-court. The bases were 4 cubits (6 ft.) long, 4 cubits broad, and 3 cubits (4 1/2 ft.) high. These bases were of the nature of square paneled boxes, their sides being ornamented with figures of lions, oxen and cherubim, with wreathed work beneath. They had four feet, to which wheels were attached. The basin rested on a rounded pedestal, a cubit high, with an opening 1 1/2 cubits in diameter to receive the laver (<a onClick="return mV(\'1Ki\',7,31);">1Ki 7:31</a>). Mythological ideas, as just said, are here out of place.<P>V. History of the Temple.<P>1. Building and Dedication:<P>The Temple was founded in the 4th year of Solomon\'s reign (<a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>), and occupied 7 1/2 years in building (<a onClick="return mV(\'1Ki\',6,38);">1Ki 6:38</a>); the royal buildings occupied 13 years (<a onClick="return mV(\'1Ki\',7,1);">1Ki 7:1</a>)—20 years in all (the two periods, however, may in part synchronize). On the completion of the Temple, the ark was brought up, in the presence of a vast assemblage, from Zion, and, with innumerable sacrifices and thanksgiving, was solemnly deposited in the Holy of Holies (<a onClick="return mV(\'1Ki\',8,\'1-21\');">1Ki 8:1-21</a>; <a onClick="return mV(\'2Ch\',5,\'1-\');">2Ch 5</a>; <a onClick="return mV(\'2Ch\',6,\'1-11\');">6:1-11</a>). The Temple itself was then dedicated by Solomon in the noble prayer recorded in <a onClick="return mV(\'1Ki\',8,\'22-61\');">1Ki 8:22-61</a>; <a onClick="return mV(\'2Ch\',6,\'12-42\');">2Ch 6:12-42</a>, followed by lavish sacrifices, and a 14 days\' feast. At its inauguration the house was filled with the "glory" of Yahweh (<a onClick="return mV(\'1Ki\',8,10,11);">1Ki 8:10,11</a>; <a onClick="return mV(\'2Ch\',5,13,14);">2Ch 5:13,14</a>).<P>2. Repeated Plunderings, etc.:<P>The religious declension of the later days of Solomon (<a onClick="return mV(\'1Ki\',11,\'1-8\');">1Ki 11:1-8</a>) brought in its train disasters for the nation and the Temple. On Solomon\'s death the kingdom was disrupted, and the Temple ceased to be the one national sanctuary. It had its rivals in the calf-shrines set up by Jeroboam at Beth-el and Dan (<a onClick="return mV(\'1Ki\',12,\'25-33\');">1Ki 12:25-33</a>). In the 5th year of Rehoboam an expedition was made against Judah by Shishak, king of Egypt, who, coming to Jerusalem, carried away the treasures of the Temple, together with those of the king\'s house, including the 300 shields of gold which Solomon had made (<a onClick="return mV(\'1Ki\',14,\'25-28\');">1Ki 14:25-28</a>; <a onClick="return mV(\'2Ch\',12,\'2-9\');">2Ch 12:2-9</a>). Rehoboam\'s wife, Maacah, was an idolatress, and during the reign of Abijam, her son, introduced many abominations into the worship of the Temple (<a onClick="return mV(\'1Ki\',15,2,12,13);">1Ki 15:2,12,13</a>). Asa cleared these away, but himself further depleted the Temple and royal treasuries by sending all that was left of their silver and gold to Ben-hadad, king of Syria, to buy his help against Baasha, king of Israel (<a onClick="return mV(\'1Ki\',15,18,19);">1Ki 15:18,19</a>). Again the Temple was foully desecrated by Athaliah (<a onClick="return mV(\'2Ch\',24,7);">2Ch 24:7</a>), necessitating the repairs of Jehoash (<a onClick="return mV(\'2Ki\',12,4);">2Ki 12:4</a>; <a onClick="return mV(\'1Ch\',24,4);">1Ch 24:4</a>); and a new plundering took place in the reign of Ahaziah, when Jehoash of Israel carried off all the gold and silver in the Temple and palace (<a onClick="return mV(\'2Ki\',14,14);">2Ki 14:14</a>). Uzziah was smitten with leprosy for presuming to enter the holy place to offer incense (<a onClick="return mV(\'2Ch\',26,\'16-20\');">2Ch 26:16-20</a>). Jehoshaphat, earlier, is thought to have enlarged the court (<a onClick="return mV(\'2Ch\',20,5);">2Ch 20:5</a>), and Jotham built a new gate (<a onClick="return mV(\'2Ki\',15,35);">2Ki 15:35</a>; <a onClick="return mV(\'2Ch\',27,3);">2Ch 27:3</a>). The ungodly Ahaz went farther than any of his predecessors in sacrilege, for, besides robbing the Temple and palace of their treasures to secure the aid of the king of Assyria (<a onClick="return mV(\'2Ki\',16,8);">2Ki 16:8</a>), he removed the brazen altar from its time-honored site, and set up a heathen altar in its place, removing likewise the bases and ornaments of the lavers, and the oxen from under the brazen (bronze) sea (<a onClick="return mV(\'2Ki\',16,\'10-17\');">2Ki 16:10-17</a>).<P>3. Attempts at Reform:<P>An earnest attempt at reform of religion was made by Hezekiah (<a onClick="return mV(\'2Ki\',18,\'1-6\');">2Ki 18:1-6</a>; <a onClick="return mV(\'2Ch\',29,31);">2Ch 29:31</a>), but even he was driven to take all the gold and silver in the Temple and king\'s house to meet the tribute imposed on him by Sennacherib, stripping from the doors and pillars the gold with which he himself had overlaid them (<a onClick="return mV(\'2Ki\',18,\'14-16\');">2Ki 18:14-16</a>; <a onClick="return mV(\'2Ch\',32,31);">2Ch 32:31</a>). Things became worse than ever under Manasseh, who reared idolatrous altars in the Temple-courts, made an Asherah, introduced the worship of the host of heaven, had horses dedicated to the sun in the Temple-court, and connived at the worst pollutions of heathenism in the sanctuary (<a onClick="return mV(\'2Ki\',21,\'3-7\');">2Ki 21:3-7</a>; <a onClick="return mV(\'2Ki\',23,7,11);">23:7,11</a>). Then came the more energetic reforms of the reign of Josiah, when, during the repairs of the Temple, the discovery was made of the Book of the Law, which led to a new covenant with Yahweh, a suppression of the high places, and the thorough cleansing-out of abuses from the Temple (<a onClick="return mV(\'2Ki\',22,\'1-\');">2Ki 22</a>; <a onClick="return mV(\'2Ki\',23,\'1-25\');">23:1-25</a>; <a onClick="return mV(\'2Ch\',34,\'1-\');">2Ch 34</a>; <a onClick="return mV(\'2Ch\',35,\'1-\');">35</a>). Still, the heart of the people was not changed, and, as seen in the history, and in the pages of the Prophets, after Josiah\'s death, the old evils were soon back in full force (compare e.g. <a onClick="return mV(\'Eze\',8,\'7-18\');">Eze 8:7-18</a>).<P>4. Final Overthrow:<P>The end, however, was now at hand. Nebuchadnezzar made Jehoiakim his tributary; then, on his rebelling, came, in the reign of Jehoiachin, took Jerusalem, carried off the treasures of the Temple and palace, with the gold of the Temple vessels (part had already been taken on his first approach, <a onClick="return mV(\'2Ch\',36,7);">2Ch 36:7</a>), and led into captivity the king, his household and the chief part of the population (<a onClick="return mV(\'2Ki\',24,\'1-17\');">2Ki 24:1-17</a>). Eleven years later (586 BC), after a siege of 18 months, consequent on Zedekiah\'s rebellion (<a onClick="return mV(\'2Ki\',25,1);">2Ki 25:1</a>), the Babylonian army completed the destruction of Jerusalem and the Temple. Only a few lesser utensils of value, and the brazen (bronze) pillars, bases and sea remained; these were now taken away, the larger objects being broken up (<a onClick="return mV(\'2Ki\',25,\'13-16\');">2Ki 25:13-16</a>). The Temple itself, with its connected buildings, and the houses in Jerusalem generally, were set on fire (<a onClick="return mV(\'2Ki\',25,9);">2Ki 25:9</a>). The ark doubtless perished in the conflagration, and is no more heard of. The residue of the population—all but the poorest—were carried away captive (<a onClick="return mV(\'2Ki\',25,11,12);">2Ki 25:11,12</a>; see <a href="./study/isbe/search.html?string=CAPTIVITY">CAPTIVITY</A>). Thus ended the first Temple, after about 400 years of chequered existence.``1';
isbe[8669]='Temple, A2`II. EZEKIEL\'S PROPHETIC SKETCH<P>I. Introductory.<P>1. Relation to History of Temple:<P>Wellhausen has said that <a onClick="return mV(\'Eze\',40,1);">Ezekiel 40-48</a> "are the most important in his book, and have been, not incorrectly, called the key to the Old Testament" (Prolegomena, English translation, 167). He means that Ezekiel\'s legislation represents the first draft, or sketch, of a priestly code, and that subsequently, on its basis, men of the priestly school formulated the Priestly Code as we have it. Without accepting this view, dealt with elsewhere, it is to be admitted that Ezekiel\'s sketch of a restored temple in chapters <a onClick="return mV(\'Eze\',40,\'1-\');">40-43</A> has important bearings on the history of the Temple, alike in the fact that it presupposes and sheds back light upon the structure and arrangements of the first Temple (Solomon\'s), and that in important respects it forecasts the plans of the second (Zerubbabel\'s) and of Herod\'s temples.<P>2. The Conception Unique and Ideal:<P>While, however, there is this historical relation, it is to be observed that Ezekiel\'s temple-sketch is unique, presenting features not found in any of the actually built temples. The temple is, in truth, an ideal construction never intended to be literally realized by returned exiles, or any other body of people. Visionary in origin, the ideas embodied, and not the actual construction, are the main things to the prophet\'s mind. It gives Ezekiel\'s conception of what a perfectly restored temple and the service of Yahweh would be under conditions which could scarcely be thought of as ever likely literally to arise. A literal construction, one may say, was impossible. The site of the temple is not the old Zion, but "a very high mountain" (<a onClick="return mV(\'Eze\',40,2);">Eze 40:2</a>), occupying indeed the place of Zion, but entirely altered in elevation, configuration and general character. The temple is part of a scheme of transformed land, partitioned in parallel tracts among the restored 12 tribes (<a onClick="return mV(\'Eze\',47,\'13-\');">Eze 47:13</A>-<a onClick="return mV(\'Eze\',48,7,\'23-29\');">48:7,23-29</a>), with a large area in the center, likewise stretching across the whole country, hallowed to Yahweh and His service (<a onClick="return mV(\'Eze\',48,\'8-22\');">Eze 48:8-22</a>). Supernatural features, as that of the flowing stream from the temple in <a onClick="return mV(\'Eze\',47,\'1-\');">Ezekiel 47</a>, abound. It is unreasonable to suppose that the prophet looked for such changes—some of them quite obviously symbolical—as actually impending.<P>3. Its Symmetrical Measurements:<P>The visionary character of the temple has the effect of securing that its measurements are perfectly symmetrical. The cubit used is defined as "a cubit and a handbreadth" (<a onClick="return mV(\'Eze\',40,5);">Eze 40:5</a>), the contrast being with one or more smaller cubits (see <a href="./study/isbe/search.html?string=CUBIT">CUBIT</a>). In the diversity of opinion as to the precise length of the cubit, it may be assumed here that it was the same sacred cubit employed in the tabernacle and first Temple, and may be treated, as before, as approximately equivalent to 18 inches.<P>II. Plan of the Temple.<P>Despite obscurities and corruption in the text of Ezekiel, the main outlines of the ideal temple can be made out without much difficulty (for details the commentaries must be consulted; A. B. Davidson\'s "Ezekiel" in the Cambridge Bible series may be recommended; compare also Keil; a very lucid description is given in Skinner\'s "Book of Ezekiel," in the Expositor\'s Bible, 406-13; for a different view, see Caldecott, The Second Temple in Jerusalem).<P>1. The Outer Court:<P>The temple was enclosed in two courts—an outer and an inner—quite different, however, in character and arrangement from those of the first Temple. The outer court, as shown by the separate measurements (compare Keil on <a onClick="return mV(\'Eze\',40,27);">Eze 40:27</a>), was a large square of 500 cubits (750 ft.), bounded by a wall 6 cubits (9 ft.) thick and 6 cubits high (<a onClick="return mV(\'Eze\',40,5);">Eze 40:5</a>). The wall was pierced in the middle of its north, east and south sides by massive gateways, extending into the court to a distance of 50 cubits (75 ft.), with a width of 25 cubits (37 1/2 ft.). On either side of the passage in these gateways were three guardrooms, each 6 cubits square (<a onClick="return mV(\'Eze\',40,7);">Eze 40:7</a> margin), and each gateway terminated in "porch," 8 cubits (12 ft.) long (<a onClick="return mV(\'Eze\',40,9);">Eze 40:9</a>), and apparently (thus, the Septuagint, <a onClick="return mV(\'Eze\',40,14);">Eze 40:14</a>; the Hebrew text seems corrupt), 20 cubits across. The ascent to the gateways was by seven steps (<a onClick="return mV(\'Eze\',40,6);">Eze 40:6</a>; compare <a onClick="return mV(\'Eze\',40,22,26);">40:22,26</a>), showing that the level of the court was to this extent higher than the ground outside. Round the court, on the three sides named—its edge in line with the ends of the gateways—was a "pavement," on which were built, against the wall, chambers, 30 in number (<a onClick="return mV(\'Eze\',40,17,18);">Eze 40:17,18</a>). At the four corners were enclosures (40 cubits by 30) where the sacrifices were cooked (compare <a onClick="return mV(\'Eze\',46,\'21-24\');">Eze 46:21-24</a>)—a fact which suggests that the cells were mainly for purposes of feasting. (The "arches" (\'elammim) of <a onClick="return mV(\'Eze\',40,16,21);">Eze 40:16,21</a>, etc. (the Revised Version margin "colonnade"), if distinguished from the "porch" (\'ulam)—A. B. Davidson and others identify them—are still parts of the gateway—<a onClick="return mV(\'Eze\',40,21);">Eze 40:21</a>, etc.).<P>2. The Inner Court:<P>The inner court was a square of 100 cubits (150 ft.), situated exactly in the center of the larger court (<a onClick="return mV(\'Eze\',40,47);">Eze 40:47</a>). It, too, was surrounded by a wall, and had gateways, with guardrooms, etc., similar to those of the outer court, saving that the gateways projected outward (50 cubits), not inward. The gates of outer and inner courts were opposite to each other on the north, east, and south, a hundred cubits apart (<a onClick="return mV(\'Eze\',40,1923,27);">Eze 40:19,23,27</a>; the whole space, therefore, from wall to wall was 50 and 100 and 50 = 200 cubits). The ascent to the gates in this case was by eight steps (<a onClick="return mV(\'Eze\',40,37);">Eze 40:37</a>), indicating another rise in level for the inner court. There were two chambers at the sides of the north and south gates respectively, one for Levites, the other for priests (<a onClick="return mV(\'Eze\',40,\'44-46\');">Eze 40:44-46</a>; compare the margin); at the gates also (perhaps only at the north gate) were stone tables for slaughtering (<a onClick="return mV(\'Eze\',40,\'39-43\');">Eze 40:39-43</a>). In the center of this inner court was the great altar of burnt offering (<a onClick="return mV(\'Eze\',43,\'14-17\');">Eze 43:14-17</a>)—a structure 18 cubits (27 ft.) square at the base, and rising in four stages (1, 2, 4, and 4 cubits high respectively, <a onClick="return mV(\'Eze\',43,14,15);">Eze 43:14,15</a>), till it formed a square of 12 cubits (18 ft.) at the top or hearth, with four horns at the corners (<a onClick="return mV(\'Eze\',43,15,16);">Eze 43:15,16</a>). Steps led up to it on the east (<a onClick="return mV(\'Eze\',43,17);">Eze 43:17</a>).<P>See <a href="./study/isbe/search.html?string=ALTAR+OF+BURNT+OFFERING">ALTAR OF BURNT OFFERING</A>.<P>3. The Temple Building and Adjuncts:<P>The inner court was extended westward by a second square of 100 cubits, within which, on a platform elevated another 6 cubits (9 ft.), stood the temple proper and its connected buildings (<a onClick="return mV(\'Eze\',41,8);">Eze 41:8</a>). This platform or basement is shown by the measurements to be 60 cubits broad (north and and south) and 105 cubits long (east and west)—5 cubits projecting into the eastern square. The ascent to the temple-porch was by 10 steps (<a onClick="return mV(\'Eze\',40,49);">Eze 40:49</a>; Septuagint, the Revised Version margin). The temple itself was a building consisting, like Solomon\'s, of three parts—a porch at the entrance, 20 cubits (30 ft.) broad by 12 cubits (18 ft.) deep (so most, following the Septuagint, as required by the other measurements); the holy place or hekhal, 40 cubits (60 ft.) long by 20 cubits (30 ft.) broad; and the most holy place, 20 cubits by 20 (<a onClick="return mV(\'Eze\',40,48,49);">Eze 40:48,49</a>; <a onClick="return mV(\'Eze\',41,\'1-4\');">41:1-4</a>); the measurements are internal. At the sides of the porch stood two pillars (<a onClick="return mV(\'Eze\',40,49);">Eze 40:49</a>), corresponding to the Jachin and Boaz of the older Temple. The holy and the most holy places were separated by a partition 2 cubits in thickness (<a onClick="return mV(\'Eze\',41,3);">Eze 41:3</a>; so most interpret). The most holy place was empty; of the furniture of the holy place mention is made only of an altar of wood (<a onClick="return mV(\'Eze\',41,22);">Eze 41:22</a>; see <a href="./study/isbe/search.html?string=ALTAR">ALTAR</A>, sec. A, III, 7; B, III, 3). Walls and doors were ornamented with cherubim and palm trees (<a onClick="return mV(\'Eze\',41,18,25);">Eze 41:18,25</a>). The wall of the temple building was 6 cubits (9 ft.) in thickness (<a onClick="return mV(\'Eze\',41,5);">Eze 41:5</a>), and on the north, south, and west sides, as in Solomon\'s Temple, there were side-chambers in three stories, 30 in number (<a onClick="return mV(\'Eze\',41,6);">Eze 41:6</a>; in each story?), with an outer wall 5 cubits (7 1/2 ft.) in thickness (<a onClick="return mV(\'Eze\',41,9);">Eze 41:9</a>). These chambers were, on the basement, 4 cubits broad; in the 2nd and 3rd stories, owing, as in the older Temple, to rebatements in the wall, perhaps 5 and 6 cubits broad respectively (<a onClick="return mV(\'Eze\',41,6,7);">Eze 41:6,7</a>; in Solomon\'s Temple the side-chambers were 5,6,and 7 cubits, <a onClick="return mV(\'1Ki\',6,6);">1Ki 6:6</a>). These dimensions give a total external breadth to the house of 50 cubits (with a length of 100 cubits), leaving 5 cubits on either side and in the front as a passage round the edge of the platform on which the building stood (described as "that which was left") (<a onClick="return mV(\'Eze\',41,9,11);">Eze 41:9,11</a>). The western end, as far as the outer wall, was occupied, the whole breadth of the inner court, by a large building (<a onClick="return mV(\'Eze\',41,12);">Eze 41:12</a>); all but a passage of 20 cubits (30 ft.) between it and the temple, belonging to what is termed "the separate place" (gizrah, <a onClick="return mV(\'Eze\',41,12,13);">Eze 41:12,13</a>, etc.). The temple-platform being only 60 cubits broad, there remained a space of 20 cubits (30 ft.) on the north and south sides, running the entire length of the platform; this, continued round the back, formed the gizrah, or "separate place" just named. Beyond the gizrah for 50 cubits (75 ft.) were other chambers, apparently in two rows, the inner 100 cubits, the outer 50 cubits, long, with a walk of 10 cubits between (<a onClick="return mV(\'Eze\',42,\'1-14\');">Eze 42:1-14</a>; the passage, however, is obscure; some, as Keil, place the "walk" outside the chambers). These chambers were assigned to the priests for the eating of "the most holy things" (<a onClick="return mV(\'Eze\',42,13);">Eze 42:13</a>).<P>See <a href="./study/isbe/search.html?string=GALLERY">GALLERY</a>.<P>Such, in general, was the sanctuary of the prophet\'s vision, the outer and inner courts of which, and, crowning all, the temple itself, rising in successive terraces, presented to his inner eye an imposing spectacle which, in labored description, he seeks to enable his readers likewise to visualize.<P>III. THE TEMPLE OF ZERUBBABEL<P>I. Introductory.<P>1. The Decree of Cyrus:<P>Forty-eight years after Nebuchadnezzar\'s destruction of the first Temple, the Babylonian empire came to an end (538 BC), and Persia became dominant under Cyrus. In the year following, Cyrus made a decree sanctioning the return of the Jews, and ordering the rebuilding of the Temple at Jerusalem (<a onClick="return mV(\'2Ch\',36,23);">2Ch 36:23</a>; <a onClick="return mV(\'Ezr\',1,\'1-4\');">Ezr 1:1-4</a>). He not only caused the sacred vessels of the old Temple to be restored, but levied a tax upon his western provinces to provide materials for the building, besides what was offered willingly (<a onClick="return mV(\'Ezr\',1,\'6-11\');">Ezr 1:6-11</a>; <a onClick="return mV(\'Ezr\',6,3);">6:3</a>). The relatively small number of exiles who chose to return for this work (40,000) were led by Sheshbazzar, "the prince of Judah" (<a onClick="return mV(\'Ezr\',1,11);">Ezr 1:11</a>), whom some identify with Zerubbabel, likewise named "governor of Judah" (<a onClick="return mV(\'Hag\',1,1);">Hag 1:1</a>). With these, if they were distinct was associated Joshua the high priest (in Ezra and Nehemiah called "Jeshua").<P>2. Founding of the Temple:<P>The first work of Joshua and Zerubbabel was the building of the altar on its old site in the 7th month of the return (<a onClick="return mV(\'Ezr\',3,3);">Ezr 3:3</a>). Masons and carpenters were engaged for the building of the house, and the Phoenicians were requisitioned for cedar wood from Lebanon (<a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>). In the 2nd year the foundations of the temple were laid with dignified ceremonial, amid rejoicing, and the weeping of the older men, who remembered the former house (<a onClick="return mV(\'Ezr\',3,\'8-13\');">Ezr 3:8-13</a>).<P>3. Opposition and Completion of the Work:<P>The work soon met with opposition from the mixed population of Samaria, whose offer to join it had been refused; hostile representations, which proved successful, were made to the Persian king; from which causes the building was suspended about 15 years, till the 2nd year of Darius Hystaspis (520 BC; <a onClick="return mV(\'Ezr\',4,\'1-\');">Ezr 4</a>). On the other hand, the prophets Haggai and Zechariah stimulated the flagging zeal of the builders, and, new permission being obtained, the work was resumed, and proceeded so rapidly that in 516 BC the temple was completed, and was dedicated with joy (<a onClick="return mV(\'Ezr\',5,\'1-\');">Ezr 5</a>; <a onClick="return mV(\'Ezr\',6,\'1-\');">6</a>).<P>II. The Temple Structure.<P>1. The House:<P>Few details are available regarding this temple of Zerubbabel. It stood on the ancient site, and may have been influenced in parts of its plan by the descriptions of the temple in Ezekiel. The inferiority to the first Temple, alluded to in <a onClick="return mV(\'Ezr\',3,12);">Ezr 3:12</a> and <a onClick="return mV(\'Hag\',2,3);">Hag 2:3</a>, plainly cannot refer to its size, for its dimensions as specified in the decree of Cyrus, namely, 60 cubits in height, and 60 cubits in breadth (<a onClick="return mV(\'Ezr\',6,3);">Ezr 6:3</a>); there is no warrant for confining the 60 cubits of height to the porch only; compare Josephus, Ant, XI, i), exceed considerably those of the Temple of Solomon (side-chambers are no doubt included in the breadth). The greater glory of the former Temple can only refer to adornment, and to the presence in it of objects wanting in the second. The Mishna declares that the second temple lacked five things present in the first—the ark, the sacred fire, the shekhinah, the Holy Spirit, and the Urim and Thummim (Yoma\', xxi.2).<P>2. Its Divisions and Furniture:<P>The temple was divided, like its predecessor, into a holy and a most holy place, doubtless in similar proportions. In 1Macc 1:22 mention is made of the "veil" between the two places. The most holy place, as just said, was empty, save for a stone on which the high priest, on the great Day of Atonement, placed his censer (Yoma\' v.2). The holy place had its old furniture, but on the simpler scale of the tabernacle—a golden altar of incense, a single table of shewbread, one 7-branched candlestick. These were taken away by Antiochus Epiphanes (1Macc 1:21,22). At the cleansing of the sanctuary after its profanation by this prince, they were renewed by Judas Maccabeus (1Macc 4:41ff). Judas pulled down also the old desecrated altar, and built a new one (1Macc 4:44ff).<P>3. Its Courts, Altar, etc.:<P>The second temple had two courts—an outer and an inner (1Macc 4:38,48; 9:54; Josephus, Ant, XIV, xvi, 2)—planned apparently on the model of those in Ezekiel. A.R.S. Kennedy infers from the measurements in the Haram that "the area of the great court of the second temple, before it was enlarged by Herod on the south and east, followed that of Ezekiel\'s outer court—that is, it measured 500 cubits each way with the sacred rock precisely in the center" (Expository Times, XX, 182). The altar on this old Sakhra site—the first thing of all to be "set on its base" (<a onClick="return mV(\'Ezr\',3,3);">Ezr 3:3</a>)—is shown by 1Macc 4:47 and a passage quoted by Josephus from Hecataeus (Apion, I, xxii) to have been built of unhewn stones. Hecataeus gives its dimensions as a square of 20 cubits and 10 cubits in height. There seems to have been free access to this inner court till the time of Alexander Janneus (104-78 BC), who, pelted by the crowd as he sacrificed, fenced off the part of the court in front of the altar, so that no layman could come farther (Josephus, Ant, XIII, xiii, 5). The courts were colonnaded (Ant., XI, iv, 7; XIV, xvi, 2), and, with the house, had numerous chambers (compare <a onClick="return mV(\'Neh\',12,44);">Ne 12:44</a>; <a onClick="return mV(\'Neh\',13,4);">13:4</a>ff, etc.).<P>A brief contemporary description of this Temple and its worship is given in Aristeas, 83-104. This writer\'s interest, however, was absorbed chiefly by the devices for carrying away the sacrificial blood and by the technique of the officiating priests.<P>4. Later Fortunes:<P>The vicissitudes of this temple in its later history are vividly recorded in 1Maccabees and in Josephus. In Ecclesiasticus 50 is given a glimpse of a certain Simon, son of Onias, who repaired the temple, and a striking picture is furnished of the magnificence of the worship in his time. The desecration and pillaging of the sanctuary by Antiochus, and its cleansing and restoration under Judas are alluded to above (see <a href="./study/isbe/search.html?string=HASMONEANS">HASMONEANS</A>; <a href="./study/isbe/search.html?string=MACCABAEUS">MACCABAEUS</A>). At length Judea became an integral part of the Roman empire. In 66 BC Pompey, having taken the temple-hill, entered the most holy place, but kept his hands off the temple-treasures (Ant., XIV, iv, 4). Some years later Crassus carried away everything of value he could find (Ant., XIV, vii, 1). The people revolted, but Rome remained victorious. This brings us to the time of Herod, who was nominated king of Judea by Rome in 39 BC, but did not attain actual power until two years later.<P>IV. THE TEMPLE OF HEROD<P>I. Introductory.<P>1. Initiation of the Work:<P>Herod became king de facto by the capture of Jerusalem in 37 BC. Some years later he built the fortress Antonia to the north of the temple (before 31 BC). Midway in his reign, assigning a religious motive for his purpose, he formed the project of rebuilding the temple itself on a grander scale (Josephus gives conflicting dates; in Ant, XV, xi,1,he says "in his 18th year"; in BJ, I, xxi,1,he names his 15th year; the latter date, as Schurer suggests (GJV4, I 369), may refer to the extensive preparations). To allay the distrust of his subjects, he undertook that the materials for the new building should be collected before the old was taken down; he likewise trained 1,000 priests to be masons and carpenters for work upon the sanctuary; 10,000 skilled w
