isbe[8622]='Targum`tar\'-gum (targum):<P>1. Meaning and Etymology of the Term<P>2. Origin of the Targums<P>3. Language of the Targums<P>4. Mode in Which the Targums Were Given<P>5. Date of the Targums<P>6. Characteristics of the Different Targums<P class="in15">(1) Onqelos—the Man Characteristics of His Targum<P class="in15">(2) The Targum of Jonathan ben Uzziel on the Prophets<P class="in30">Characteristics of His Targum—Earlier Prophets; Later Prophets<P class="in15">(3) Hagiographa: Psalms, Job and Proverbs<P class="in30">(a) The Meghilloth<P class="in30">(b) Chronicles<P class="in15">(4) The Non-official Targums—Jonathan ben Uzziel and the Pentateuch<P>7. Use of the Targums<P>LITERATURE<hr /><P>The Targums were explanations of the Hebrew Scriptures in Chaldaic (Western Aramaic) for the benefit of those Jews who had partially or completely ceased to understand the sacred tongue.<P>1. Meaning and Etymology of the Term:<P>By Gesenius the word methurgam, which occurs in <a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a>, is interpreted as derived from ragham, "to pile up stones," "to throw," hence, "to stone," and then "to translate," though no example is given. Jastrow derives it from the Assyrian r-g-m, "to speak aloud," an etymology which suits the origin of the Targums. It is unfortunate that he gives no reference to any Assyrian document.<P>The word turgamanu is found, e.g., in the Tell el-Amarna Letters (Berlin edition,21,1. 25, Knudtzon, 154), with the meaning "interpreter." It may, none the less, be of Aramaic origin. See Muss-Arnolt, Concise Dictionary of the Assyrian Language, 1191f; and the references there given.<P>The word is used as the Aramaic interpretation of shiggayon (<a onClick="return mV(\'Psa\',7,1);">Ps 7:1</a>), a term the precise force of which is yet unfixed. From this ragham comes meturgheman, "an interpreter," and our modern "dragoman." Whatever the original meaning of the root, the word came to mean "to translate," "to explain."<P>2. Origin of the Targums:<P>At the time when Nebuchadnezzar carried the inhabitants of Jerusalem and Judah captive to the banks of the Tigris and the Euphrates, the language of everyday life in Assyria and Babylonia had ceased to be that which has come down to us in the cuneiform inscriptions, and had become Aramaic, the lingua franca of southwestern Asia. It was the language of diplomacy, of business and of social intercourse, and had long been so. Dwelling in the midst of those who used Aramaic alone, the Jews soon adopted it for every occasion save worship. In the family they might retain their mother tongue for a time, but this would yield at length to continuous pressure from without. In Palestine a similar process had been going on in the absence of the captives. Intruders from various neighboring peoples had pressed in to occupy the blanks left by the removal of the Jewish captives to Babylon. Although it is not recorded, it is not impossible that following the example of the Assyrians, Nebuchadnezzar may have sent into Judea compulsory colonists from other parts of his empire. The language common to all these, in addition to their native dialect, was Aramaic. The Jewish inhabitants that had been left in the land would, like their relatives in Babylonia, have become accustomed to the use of Aramaic, to the exclusion, more or less complete, of Hebrew. Another process had begun among the captives. Away from the site of their destroyed temple, the exiles did not, like those in Upper Egypt, erect another temple in which to offer sacrifices. Their worship began to consist in the study of the Law in common, in chanting of the Psalms and united prayers. This study of the Law implied that it should be understood. Though some form of synagogue worship was known in the times preceding the captivity under the direction probably of the prophets (<a onClick="return mV(\'2Ki\',4,23);">2Ki 4:23</a>), it must have become weak and ineffective. With the arrival of Ezra there was a revival of the study of the Law, and with that the necessity for the interpretation of it in language which the people could understand.<P>3. Language of the Targums:<P>From the facts above narrated, this language was of necessity Aramaic. There were, however, forces at work to modify the language. A translation is liable to be assimilated so far, to the language from which it is made. Thus there is a difference, subtle but observable, between the English of our the King James Version of the Bible and that of Shakespeare, Bacon, or even Hooker. Or, to take an example more cognate, if less accessible to the general reader, the difference may be seen if one compares the Syriac of the New Testament Peshitta with that of the Peshitta of the Old Testament. The Aramaic of the Targums is Western Aramaic, but it is Western Aramaic tinctured with Hebrew. The fact that the returned captives originally had spoken Hebrew would doubtless have its effect on their Aramaic. German in Jewish lips becomes Yiddish. One very marked feature is the presence of yath, the sign of the accusative translating the Hebrew \'eth, whereas in ordinary Aramaic, Eastern and Western, this is unused, except as supporting the oblique case of pronouns. Further, the intensive construction of infinitive with finite sense, so frequent in Hebrew, though little used in ordinary Aramaic, appears in the Targums wherever it occurs in the Hebrew text. As a negative characteristic there is to be noted the comparative rarity with which the emphatic repetition of the personal pronoun, so frequent in ordinary Aramaic, occurs in the Targumic.<P>4. Mode in Which the Targums Were Given:<P>The account given in Nehemiah (<a onClick="return mV(\'Neh\',8,8);">8:8</a>) of the reading of the Law to the people not only mentions that Ezra\'s helpers read "distinctly" (mephorash), but "gave the sense" (som sekhel) "and caused them to understand the reading," the King James Version (wayyabhinu ba-miqra\'). This threefold process implies more than merely distinct enunciation. If this passage is compared with <a onClick="return mV(\'Ezr\',4,18);">Ezr 4:18</a> it would seem that mephorash ought to mean "interpreted." The most natural explanation is that alongside of the readers of the Law there were interpreters, meturghemanim, who repeated in Aramaic what had been read in Hebrew. What interval separated this public reading of the Law from the reading of the Law as a portion of synagogue worship we have no means of knowing. The probability is that in no long time the practice of reading the Law with an Aramaic interpretation was common in all Jewish synagogues. Elaborate rules are laid down in the Talmud for this interpretation; how far these were those actually used we cannot be absolutely certain. They at least represent the ideal to which after-generations imagined the originators of the practice aspired. The Law was read by the reader verse by verse, and each verse was followed by a recitation by the meturgheman of the Aramaic version. Three verses of the prophetic books were read before the Aramaic was recited. The Talmudists were particular that the reader should keep his eye on the roll from which he read, and that the meturgheman should always recite his version without looking at any writing, so that a distinction should be kept between the sacred word and the version. At first the Targum was not committed to writing, but was handed down by tradition from meturgheman to meturgheman. That of the Law became, however, as stereotyped as if it had been written. So to some extent was it with the Prophets and also the Psalms. The Targums of the rest of the Kethubhim seem to have been written from the beginning and read in private.<P>5. Date of the Targums:<P>We have assumed that the action of Ezra narrated in <a onClick="return mV(\'Neh\',8,8);">Ne 8:8</a> implied not only the reading of the Law, but also the interpretation of its language—its translation in fact from Hebrew to Aramaic, and that, further, this practice was ere long followed in all the synagogues in Judea. This view is maintained by Friedmann (Onkelos u. Akylas, 1896) and was that assumed to be correct by the Talmud. Dr. Dalman assures his readers that this is a mistake, but without assigning any reasons for his assertion. Dr. Dalman is a very great authority, but authority is not science, so we venture to maintain the older opinion. The fact is undeniable that, during the Persian domination all over southwestern Asia, Aramaic was the lingua franca, so much so that we see by the Assouan and Elephantine papyri the Jewish garrison at Assouan in Egypt wrote to their co- religionists in Judea, and to the Persian governors, in Aramaic. Moreover, there is no trace that they used any other tongue for marriage contracts or deeds of sale.<P>We may assume that in Judea the language commonly used in the 5th century BC was Aramaic. We may neglect then the position of Mr. Stenning (Enc Brit (11th edition), XXVI, 418b) that "probably as early as the 2nd century BC the people had adopted Aramaic." By that time Aramaic was giving place to Greek. His reason for rejecting the position above maintained is that the dates assigned by criticism to certain prophetic writings conflict with it—a mode of reasoning that seems to derive facts from theories, not theories from facts.<P>The fact that the necessity for translation into Aramaic existed in the Persian period implies the existence of the meturgheman and the targum. It is more difficult to know when these Targums were committed to writing. It is probable that the same movement, which led Jehudah ha-Nasi\' to commit to writing the decisions of the rabbis which form the Mishna, would lead to writing down the Targums—that is to say late in the 2nd century of our era. Aramaic was disappearing in Palestine and the traditional renderings would be liable to be forgotten. Talmudic stories as to dates at which the various Targums were written down are absolutely valueless.<P>6. Characteristics of the Different Targums:<P>The Targums that require most to be considered are the official Targums, those that are given in the rabbinic Bibles in columns parallel with the columns of Hebrew. In addition, there is for the Law the Targum Yerushalmi, another recension of which is called Targum Yonathan ben Uzziel. The Book of Esther has two Targums. Besides these, Targums of doubtful value have been written by private individuals. Certain books have no official Targums: Daniel, Ezra, Nehemiah and Chronicles. The reason for this is supposed to be that in both Daniel and Ezra there are portions written in Aramaic. Nehemiah and Chronicles were regarded as forming one book with Ezra. A late Targum on Chronicles has been found and published separately. Some of the apocryphal additions to Esther appear in a late Targum to that book. The official Targums of the Law and the Prophets approach more nearly the character of translations, though even in them verses are at times explained rather than translated. The others are paraphrastic to a greater or less degree.<P>(1) Onqelos—the Man.<P>This is the name given to the official Targum of the Pentatuech. The legend is that it was written by one Onqelos, a proselyte son of Kalonymus or Kalonikus, sister\'s son of Titus. He was associated with the second Gamaliel and is represented as being even more minutely punctilious in his piety than his friend. The legend goes on to say that, when he became a proselyte, his uncle sent company after company of soldiers to arrest him, but he converted them, one after another. It is at the same time extremely doubtful whether there ever was such a person, a view that is confirmed by the fact that legends almost identical are related of Aquila, the translator of the Hebrew Scriptures into Greek. The names are similar, and it may be are identical. While there may have been a person so named, the admission of this does not imply that he had any connection with the Targum of the Pentateuch named after him. Another explanation is that as the Greek version of Aquila was much praised by the Jews for its fastidious accuracy, and this Targum of the Law was credited with equally careful accuracy, so all that is meant is that it was regarded as a version which as accurately represented in Aramaic the Hebrew of the Law as did Aquila\'s Greek. The probability is that whoever it was who committed the Targum to writing did little or no actual translating. It might not be the work of one unassisted author; the reference to the guidance Onqelos is alleged to have received from the rabbis Eliezer and Joshua suggests this. Owing to the fact that the Law was read through in the course of a year in Babylonian (once in three years in Pal) and every portion interpreted verse by verse in Aramaic, as it was read, the very words of the traditional rendering would be remembered. This gives the language of the Targum an antique flavor which may be seen when it is compared with that of the Palestinian lectionary discovered by Mrs. Gibson and Mrs. Lewis. Especially is this observed when the renderings of the same passage are put in comparison. Both in vocabulary and grammar there is a difference; thus mar occurs for shalleT, and yath as the sign of the accusative has disappeared in the lectionary. An analogy may be seen in the antique flavor of the language of our English Bible, even in the Revised Version (British and American). If any credence were to be given to the traditional account of the alleged authors, the date of this Targum would be the end of the 1st century AD. But we have seen that it has been named Aquila and that the title means "as accurate as Aquila." He, however, lived in the beginning of the 2nd century. His Greek version must have already gained a reputation before the Aramaic Targum appeared. We cannot therefore date the actual committing of this Targum to writing earlier than late in the 2nd century, not improbably, as suggested above, contemporary with the writing down of the Mishna by Jehadah ha-Nasi\'.<P>Characteristics of His Targum:<P>The characteristics of this Targum are in general close adherence to the original, sometimes even to the extent of doing violence to the genius of the language into which it has been translated. One prominent example of this is the presence of yath as the sign of the accusative; and there is also the intensive construction of infinitive with finite tense. There is a tendency to insert something between God and His worshipper, as "mimera\' Yahweh" instead of simply "Yahweh." Where anthropomorphisms occur, an exact translation is not attempted, but the sense is represented in an abstract way, as in <a onClick="return mV(\'Gen\',11,5);">Ge 11:5</a>, where instead of "The Lord (YHWH) came down" there is "The Lord (yiya\') was revealed." At the same time there is not a total avoidance of paraphrase. In <a onClick="return mV(\'Gen\',4,7);">Ge 4:7</a> the Targum renders, "If thou doest thy work well, is it not remitted unto thee? if thou doest not thy work well, thy sin is reserved unto the day of judgment when it will be required of thee if thou do not repent, but if thou repent it shall be remitted to thee." It will be observed that the last clause of the Hebrew is omitted. So in <a onClick="return mV(\'Gen\',3,22);">Ge 3:22</a>, instead of "Man has become as one of us," Onqelos writes "Man has become alone in the world by himself to know good and evil.\' A more singular instance occurs in <a onClick="return mV(\'Gen\',27,13);">Ge 27:13</a>, where Rebekah answers Jacob, "Upon me be thy curse, my son"; in the Targum it is, "Unto me it hath been said in prophecy, there shall be no curse upon thee my son." Sometimes there is a mere explanatory expansion, as in <a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a>, where instead of "the mount of God," Onqelos has "the mountain on which the glory of the Lord was revealed." In the mysterious passage, <a onClick="return mV(\'Exd\',4,\'24-26\');">Ex 4:24-26</a>, later Jewish usage is brought in to make an easy sense: "And it was on the way in the inn (house of rest) that the angel of the Lord met him and sought to slay him. And Zipporah took a flint knife and cut off the foreskin of her son and came near before him and said \'In the blood of this circumcision is the bridegroom given back to us,\' and when therefore he had desisted she said, \'Had it not been for the blood of this circumcision the bridegroom would have been condemned to die.\'" Here chathan ("bridegroom") is used according to later custom of the child to be circumcised. Sometimes reasons of propriety come in, as when the sin of Onan is described "corrupting his way on the earth. It is, however, in the poetical passages that the writer gives loose rein to paraphrase. As an example the blessing of Judah in Jacob\'s blessing of his sons may be given: "Judah, thou art praise and not shame; thee thy brethren shall praise. Thy hands shall be strong upon thine enemies, those that hate thee shall be scattered; they shall be turned back before thee; the sons of thy father shall come before thee with salutations. (Thy) rule shall be in the beginning, and in the end the kingdom shall be increased from the house of Judah, because from the judgment of death, my son, thy soul hast thou removed. He shall rest, he shall abide in strength, as a lion and as a lioness there is nothing may trouble him. The ruler shall not depart from the house of Judah nor the scribe from his son\'s sons for ever till the Messiah come whose is the kingdom and whom the heathen shall obey. Israel shall trade in his cities, the people shall build his temple, the saints shall be going about to him and shall be doers of the Law through his instruction. His raiment shall be goodly crimson; his clothing covering him, of wool dyed bright with colors. His mountains shall be red with his vineyards, his hills shall flow down with wine, and his valleys shall be white with corn and with flocks of sheep."<P>Committed to writing in Palestine, the Targum of Onqelos was sent to Babylon to get the imprimatur of the famous rabbis residing there. There are said to be traces in the language of a revision by the Babylonian teachers, but as this lies in the prevalence of certain words that are regarded as more naturally belonging to Eastern than Western Aramaic, it is too restrictedly technical to be discussed here. The result of the Babylonian sanction was the reception of this Targum as the official interpretation of the books of the Law. It seems probable that the mistake which led to its being attributed to Onqelos was made in Babylon where Aquila\'s Greek version was not known save by vague reputation.<P>(2) The Targum of Jonathan ben Uzziel on the Prophets.<P>This Jonathan, to whom the Targum on the Prophets is attributed, is declared to be one of the most distinguished pupils of Hillel. The prophetic section of the Bible according to the Jews contains, besides what we ordinarily reckon prophetic books, also all the earlier historical books except Ruth, which is placed among the Hagiographa. During the persecution of the Jews by Epiphanes, when the Law was forbidden to be read in the synagogue, portions of the Prophets were read instead. There was no attempt to read the whole of the Prophets thus, but very considerable portions were used in worship. This necessitated the presence of the meturgheman. If one might believe the Talmudic traditions, Jonathan\'s Targum was committed to writing before that of Onqelos. Jonathan is regarded as the contemporary of the first Gamaliel, whereas Onqelos is the friend of Aqiba, the contemporary of Hadrian. The tradition is that when he published his Targum of the Prophets, all Palestine was shaken, and a voice from heaven was heard demanding, "Who is this who revealeth my secrets to the sons of men?" As an example of the vagueness of Talmudic chronology, it may be mentioned that Jonathan was said to have made his Targum under the guidance of Haggai, Zechariah and Malachi. He is said to have desired to write a Targum of the Kethubhim, but was forbidden by a voice from heaven. The Targum of Job was skid to have been already written, but was buried by Gamaliel. It is said to have been exhumed and that the present Targum on that book is from Jonathan\'s hand. The tomb of Jonathan ben Uzziel is shown on the face of a hill to the north of Safed, Palestine.<P>Characteristics of His Targum—Earlier Prophets; Later Prophets<P>In the former Prophets—the historical books—the style does not differ much from that of Onqelos. Occasionally there are readings followed which are not in the Massoretic Text, as <a onClick="return mV(\'Jos\',8,12);">Jos 8:12</a>, where the Targum has "the west side of Ai" instead of as in the Massoretic Text, "the west side of the city." Sometimes two readings are combined, as in <a onClick="return mV(\'Jos\',8,16);">8:16</a>, where the Massoretic Text has "all the people which were in the city," the Targum adds "in Ai." Again, the Targum translates proper names, as, in <a onClick="return mV(\'Jos\',7,5);">Jos 7:5</a>, "Shebarim" (shebharim) is rendered "till they were scattered." Such are the variations to be seen in the narrative portion of the Targum of the earlier Prophets. When, however, a poetical piece occurs, the writer at times gives rein to his imagination. Sometimes one verse is exceedingly paraphrastic and the next an accurate rendering without any addition. In the song of Deborah (<a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>) the 1st verse has only a little of paraphrase: "Then sang praises Deborah and Barak the son of Abinoam on account of the lifting up and deliverance which had been wrought in that day, saying ...." The verse which follows is very paraphrastic; instead of the 7 words of the verse in the Massoretic Text the Targum has 55. it is too long to quote in full, but it begins, "Because the house of Israel rebelled against His Law, the Gentiles came up upon them and disturbed their assemblies, and because they refused to obey the Law, their enemies prevailed against them and drove them from the borders of the land of Israel," and so on, Sisera and all his host being introduced. <a onClick="return mV(\'Jdg\',5,3);">Jud 5:3</a> reads thus, "Hear O kings who are with him, with Sisera for war, who obey the officers of Jabin the king of Canaan; with your might and your valor ye shall not prevail nor go up against Israel, said I Deborah in prophecy before the Lord. I will sing praise and bless before Yahweh the God of Israel."<P>The later prophets are more paraphrastic as a whole than the earlier, as having more passages with poetic metaphors in them—a fact that is made plain to anyone by the greater space occupied in the rabbinic Bibles by the Targums of the Prophets. A marked example of this tendency to amplify is to be found in <a onClick="return mV(\'Jer\',10,11);">Jer 10:11</a>: "Thus shall ye say unto them, The gods that have not made the heavens and the earth, these shall perish from the earth, and from under the heavens." As this verse is in Aramaic it might have been thought that it would have been transferred to the Targum unchanged, but the Targumist has made of the 10 words of the original text 57. Sometimes these expansions may be much shorter than the above example, but are illuminative, showing the views held by the Jewish teachers. In <a onClick="return mV(\'Isa\',29,1);">Isa 29:1</a>, "Ho Ariel, Ariel, the city where David encamped!" the Targum has "Woe to the altar, the altar which David built in the city in which he dwelt." In this rendering we see the Jewish opinion that "Ariel," which means "lion of God," in this connection stood for the "altar" which David erected in Jerusalem. It seems unlikely that this whole Targum was the work of one writer, but the style gives little indication of difference. The paraphrase of the synagogal haphtaroth being traditional, the style of the person who committed it to writing had little scope. The language represents naturally an older stage of development than we find in the contemporary Christian lectionaries. As only portions of the Prophets were used in synagogue worship, only those portions would have a traditional rendering; but these fixed the style. In the Revised Version (British and American) of the Apocrypha the 70 verses which had been missing from 2Esdras 7 are translated in the style adopted by the translators under King James. It is impossible to fix the date at which the Targum of any of the prophetic books was written down. It is probable that it was little if at all after that of Onqelos. The completion of the paraphrases of the prophetic writings, of which only portions were used in the synagogue, seems to imply that there were readers of the Aramaic for whose benefit those Targums were made.<P>(3) Hagiographa: Psalms, Job and Proverbs<P>(a) The Meghilloth<P>The Targums of the third division of the Hebrew sacred writings, the Kethubhim (the Hagiographa), are ascribed to Joseph Caecus, but this is merely a name. There is no official Targum of any of the Hagiographa, and several of them, Daniel, Nehemiah and Ezra, as above noted, have no Targum at all. Those of the longer books of this class, Psalms, Proverbs and Job, are very much closer to the text than are the Targums of the Meghilloth. In the Psalms, the paraphrase is explanatory rather than simply expansive. Thus in <a onClick="return mV(\'Psa\',29,1);">Ps 29:1</a>, "ye sons of the mighty" is rendered "ye companies of angels, ye sons of the mighty." <a onClick="return mV(\'Psa\',23,\'1-\');">Ps 23</a> is further from the text, but it also is exegetic; instead of "Yahweh is my shepherd, I shall not want," the Targum reads, "The Lord nourished His people in the wilderness so that they lacked nothing." So the last clause of the last verse of this psalm is, "\'I shall indeed dwell in the house of the holiness of the Lord for the length of days." Another example of exegesis is <a onClick="return mV(\'Psa\',46,4);">Ps 46:4</a>, in which the "river whose streams make glad the city of our God" is explained as "the nations as rivers making glad the city of Yahweh." Much the same may be said of Job, so examples need not be given.<P>The Targum of Proverbs has been very much influenced by the Peshitta; it may be regarded as a Jewish recension of it. Those of the five Meghilloth, as they are called, So of Songs, Ruth, Lamentation, Ecclesiates, and Esther, are excessively paraphrastic. If one compare the space occupied by the text of Canticles and Proverbs, it will be found that the former occupies about one-sixth of the latter; if the Targums of the two books are compared in Lagarde\'s text, the Canticles are two-thirds of Proverbs. So Lamentations occupies in the Massoretic Text less than a quarter the space which Proverbs occupies; but the Targum of Lain is two-fifths the size of the Targum of Proverbs. Ruth has not suffered such a dilatation; in the text it is a fifth, in the Targum a fourth, the size of Proverbs. The expansion mainly occurs in the first verse in which ten different famines are described. Ecclesiates in the Massoretic Text uses about three-eighths of the space occupied by Proverbs. This is increased to five-sixths in the Targum. There are two Targums of Esther, the first about five-sixths the size of Proverbs, the second, nearly double. The text is under one-half. We subjoin the Targum of La 11 from Mr. Greenup\'s translation: Jeremiah the prophet and high priest said: "How is it decreed against Jerusalem and against her people that they should be condemned to exile and that lamentation should be made for them? How? Just as Adam and Eve were condemned who were ejected from the garden of Eden and over whom the Lord of the universe lamented. How? God the judge answers and speaks thus: \'Because of the multitude of the sins which were in the midst of her, therefore she will dwell alone as the man in whose flesh is the plague of leprosy dwells alone! And the city that was full of crowds and many people hath been deserted by them and become like a widow. And she that was exalted among the peoples and powerful among the provinces, to whom they paid tribute, hath been scattered abroad so as to be oppressed and to give tribute to them after this." This gives a sufficient example of the extent to which expansion can go. Verse 1 of Esther in the first Targum informs us that the cessation of the work of building the Temple was due to the advice of Vashti, and that she was the daughter of Evil-merodach, the son of Nebuchadnezzar, and a number of equally accurate pieces of information. Yet more extravagant is the 2nd Targum; it begins by asserting that there are ten great monarchs of whom Achhashverosh was the 6th, the Greek and Roman were the 7th and the 8th, Messiah the king the 9th, and the Almighty Himself the 10th. It evidently has no connection with the first Targum.<P>(b) Chronicles<P>The Targum of Chronicles, although late, is modeled on the Targums of Jonathan ben Uzziel. In cases where the narrative of Chronicles runs parallel with that of Samuel the resemblance is very great, even to verbal identity at times. The differences sometimes are worthy of note, as where in <a onClick="return mV(\'1Ch\',21,2);">1Ch 21:2</a>, instead of "Dan" the Targum has "Pameas" (Paneas), which affords an evidence of the lateness of this Targum. In the rabbinic Bible, Chronicles appear, as do Ezra, Nehemiah and Daniel, without a parallel Targum.<P>(4) The Non-official Targums—Jonathan ben Uzziel and the Pentateuch<P>There is a Targum on the Pentateuch attributed to Jonathan ben Uzziel which is very paraphrastic. Fragments of another closely related Targum have been preserved, known as the Jerusalem Targum. In face the two may really be regarded as different recensions of the same Targum. It is supposed that some manuscript was denominated simply "the targum of J," which, really being the initial representing, "Jerusalem," was taken as representing Jonathan. At the end of each of the books of the Pentateuch is is stated that this Targum is the "targum Yerushalmi" Of the two the Yerushalmi is the longer. Both assert that five signs accompanied Jacob in his stay in Haran: the time was shortcried; the distance was shortened; the four stones for his pillow became one; his strength was increased so that with his own arm he moved the stone covering the well which it took all the shepherds to move; the water gushed from the well all the days he dwelt in Haran. But the narrative of ben Uzziel is expanded to nearly twice the length in the Yerushalmi. This Targum may be regarded as to some extent semi-official.<P>7. Use of the Targums:<P>As the Targums appear to have been committed to writing after the Massoretic Text was fixed, textual differences are few and unimportant. Kohn mentions that in a few cases Onqelos agrees with the Samaritan against the Massoretic Text; they are, however, few, and possibly may be explained by differences of idiom, though from the slavish way in which Onqelos follows the Hebrew text this is improbable. The Palestine Targum agrees with the Samaritan and the versions in adding "Let us go into the field" in <a onClick="return mV(\'Gen\',4,8);">Ge 4:8</a>. The main benefit received from the Targums is the knowledge of the views of the Jewish rabbis as to the meaning of certain passages Thus in <a onClick="return mV(\'Gen\',49,10);">Ge 49:10</a> there is no doubt in the mind of the Targumist that "Shiloh" refers to the Messiah. Some other cases have been noted above. The frequency with which the word of the Lord (mimera\' yeya\') is used in Onqelos as equivalent to YHWH, as <a onClick="return mV(\'Gen\',3,8);">Ge 3:8</a>, "They heard the voice of the word of the Lord God," mimera\' dheyeya\' \'Elohim, requires to be noted from its bearing on Christian theology. There is a peculiar usage in <a onClick="return mV(\'Gen\',15,1);">Ge 15:1</a>: YHWH says to Abraham, "Fear not, Abram, my word (mimera\') shall help thee." Pharaoh is represented as using this periphrasis: "The word of the Lord (mimera\' yeya\') be for your help when I send away you and your little ones" (<a onClick="return mV(\'Exd\',10,10);">Ex 10:10</a>). A striking use of this phrase is to be found in <a onClick="return mV(\'Deu\',33,27);">De 33:27</a>, where instead of "Underneath are the everlasting arms," we have "By His word the world was made." This is at once seen to resemble the usage of Philo and the apostle John. As the Targums had not been committed to writing during the lifetime of either of these writers, it might be maintained that the Targumists had been influenced by Philo. This, however, does not follow necessarily, as both apostle and philosopher would have heard the Targum of the Law recited Sabbath after Sabbath from their boyhood, and the phrase mimera\' yeya\' would remain in their memory. The Targums of the pseudo-Jonathan and that of Jerusalem have a yet more frequent use of the term. Edersheim has counted 176 occurrences of the phrase in Onqelos and 321 in that of the pseudo-Jonathan and in the fragments of the Yerushalmi 99. This is made the more striking by the fact that it rarely occurs in the rest of Scripture. In <a onClick="return mV(\'Amo\',1,2);">Am 1:2</a>, instead of "Yahweh...will utter his voice from Jerusalem," we have "From Jerusalem will He lift up His word" (memerih). The usual equivalent for the prophet\'s formula "the word of the Lord" is pithgam YHWH. An example of the usage before us may be found in <a onClick="return mV(\'Psa\',56,4,10);">Ps 56:4,10</a>: "In the righteousness of the judgment of God will I praise his word" (memerih). There was thus a preparation for the Christian doctrine of the Trinity imbedded in the most venerated Targum, that of the Law.<P>LITERATURE.<P>The text of the official Targums is to be found in every rabbinic Bible. Berliner has published a careful, vocalized edition of Onqelos. The Prophets and the Hagiographa have been edited by Lagarde, but unvocalized. For the language Peterrnann\'s grammar in the Porta Linguarum Orientalium is useful. Levy\'s Chaldaisches Woterbuch is very good. Jastrow\'s Diet. of the Targumim is invaluable. Brextorf\'s Lexicon Talmudicum supplies information not easily available elsewhere. The Targums on the Pentateuch have been translated by Etheridge. There is an extensive literature on this subject in German. In English the different Bible Dictionaries. may be consulted, especially McClintock, DB, HDB, EB, etc. The article in Encyclopedia Brit is worthy of study, as also naturally that in the Jewish Encyclopedia.``173';
isbe[8623]='Tarpelites`tar\'-pel-its (Tarpelaye\' (<a onClick="return mV(\'Ezr\',4,9);">Ezr 4:9</a>)): Various theories have been advanced as to the identity of the Tarpelites. Rawlinson suggested the Tuplai, which name appears in the inscriptions as equivalent to the Greek Tibarenoi, a tribe on the coast of Pontus. Hitzig located them in Tripolis in Northern Phoenicia. The latest theory emends the text to Tiphceraya\', "tablet-writers" (from the Assyrian dup sarru); compare Schrader, Schrader, The Cuneiform Inscriptions and the Old Testament, on <a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a>.``1';
isbe[8624]='Tarshish`tar\'-shish (tarshish):<P>(1) Eponym of a Benjamite family (<a onClick="return mV(\'1Ch\',7,10);">1Ch 7:10</a>); Rhamessai, A and Lucian, Tharseis<P>(2) One of the "seven princes" at the court of Ahasuerus (<a onClick="return mV(\'Est\',1,14);">Es 1:14</a> Massoretic Text).<P>(3) The Hebrew name of a precious stone (<a onClick="return mV(\'Eze\',10,9);">Eze 10:9</a> margin, English Versions of the Bible "beryl"; <a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>; <a onClick="return mV(\'Exd\',39,13);">39:13</a>; <a onClick="return mV(\'Eze\',1,16);">Eze 1:16</a>; <a onClick="return mV(\'Eze\',28,13);">28:13</a>; <a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>; <a onClick="return mV(\'Dan\',10,6);">Da 10:6</a>).`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';

isbe[8626]='Tarsus`tar\'-sus (Tarsos, ethnic Tarseus): <P>1. Situation<P>2. Foundation Legends<P>3. Tarsus under Oriental Power<P>4. Tarsus under Greek Sway<P>5. Tarsus in the Roman Empire<P>6. The University<P>7. The Tarsian Constitution 8. Paul of Tarsus<P>9. Later History<P>LITERATURE<hr /><P>1. Situation:<P>The chief city of Cilicia, the southeastern portion of Asia Minor. It lay on both banks of the river Cydnus, in the midst of a fertile alluvial plain, some 10 miles from the seacoast. About 6 miles below the city the river broadened out into a considerable lake called Rhegma (Strabo xiv.672), which afforded a safe anchorage and was in great part fringed with quays and dockyards. The river itself, which flowed southward from the Taurus Mountains with a clear and swift stream, was navigable to light craft, and Cleopatra, when she visited Antony at Tarsus in 38 BC, was able to sail in her richly decorated barge into the very heart of the city (Plut. Ant. 26). The silting-up of the river\'s mouth seems to have resulted in frequent floods, against which the emperor Justinian (527-65 AD) attempted to provide by cutting a new channel, starting a short distance north of the city, to divert the surplus water into a watercourse which lay to the east of Tarsus. Gradually, however, the original bed was allowed to become choked, and now the Cydnus flows wholly through Justinian\'s channel and passes to the east of the modern town. Two miles north of Tarsus the plain gives way to low, undulating hills, which extend to the foothills of Taurus, the great mountain chain lying some 30 miles north of the city, which divides Cilicia from Lycaonia and Cappadocia. The actual frontier-line seems to have varied at different periods, but the natural boundary lies at the Cilician Gates, a narrow gorge which Tarsian enterprise and engineering skill had widened so as to make it a wagon road, the chief highway of communication and trade between Cilicia and the interior of Asia Minor and one of the most decisive factors in Anatolian history. Eastward from Tarsus ran an important road crossing the Sarus at Adana and the Pyramus at Mopsuestia; there it divided, one branch running southeastward by way of Issus to Antioch on the Orontes, while another turned slightly northward to Castabala, and thence ran due east to the passage of the Euphrates at Zeugma. Thus the fertility of its soil, the safety and convenience of its harbor and the command of the main line of communication between Anatolia and Syria or Mesopotamia combined to promote the greatness of Tarsus, though its position was neither a healthful or a strong one and the town had no acropolis.<P>2. Foundation Legends:<P>Of the foundation of the city various traditions were current in antiquity, and it is impossible to arrive any certain conclusion, for such foundation legends often reflected the sympathies and wishes of a city\'s later population rather than the historic facts of its origin. At Anchiale, about 12 miles southeast of Tarsus, was a monument commonly known as the tomb of Sardanapalus, king of Assyria, bearing an inscription "in Assyrian letters" stating that that monarch "built Anchiale and Tarsus in a single day" (Strabo xiv. 672; Arrian Anab. ii.5). The statement of Alexander Polyhistor, preserved by Eusebius (Chron. i, p. 27, ed Schoene), that Sennacherib, king of Nineveh (705-681 BC), rounded the city, also ascribes to it an Assyrian origin.<P>On the other hand, the Greeks had their own traditions, claiming Tarsus as a Greek or semi-Gr foundation. Strabo says that it owed its rise to the Argives who with Triptolemus wandered in search of Io (xiv.673), while others spoke of Heracles or Perseus as the founder. It must be admitted that these tales, taken by themselves, give us little aid.<P>3. Tarsus under Oriental Power:<P>Ramsay believes that Tarsus existed from time immemorial as a native Cilician settlement, to which was added, at some early date unknown to us, a body of Ionians, which migrated from the western coast of Asia Minor under the auspices and direction of the oracle of Clarian Apollo near Colophon. The earliest historical record of the town is found on the Black Obelisk of Shalmaneser, about 850 BC, where it figures among the places captured by that king. It is thus proved that Tarsus already existed at that remote date. For many centuries it remained an oriental rather than a Hellenic city, and its history is almost a blank. After the fall of the Assyrian empire, Cilicia may have regained its independence, at least partially, but it subsequently became a province of the Persian empire, paying to the Great King an annual tribute of 260 white horses and 500 talents of silver (Herodotus iii.90) and contributing considerable fleets, when required, to the Persian navy. From time to time we hear of rulers named Syennesis, who appear to have been vassal princes in a greater or less degree of dependence upon the oriental empires. Two clear glimpses of the city are afforded us, thanks to the passage through it of Hellenic troops engaged upon eastern expeditions. Xenophon (Anab. i.2, 21ff) tells how, in 40l BC, Cyrus the Younger entered Cilicia on his famous march against his brother Artaxerxes, and how some of his Greek mercenaries plundered Tarsus, which is described as a great and prosperous city, in which was the palace of King Syennesis. The king made an agreement with Cyrus, who, after a delay of 20 days, caused by the refusal of his troops to march farther, set out from Tarsus for the Euphrates. Again, in 333 BC, Alexander the Great passed through the Cilician Gates on his way to Issus, where he met and routed the Persian army under Darius III. Arsames, the satrap of Cilicia, failed to post a sufficient force at the pass, the garrison fled without resistance and Alexander thus entered the province without striking a blow. The Persians thereupon set fire to Tarsus, but the timely arrival of the Macedonian advance guard under Parmenio saved the city from destruction. A bath in the cold waters of the Cydnus which Alexander took while heated with his rapid advance brought on a fever which all but cost him his life (Arrian Anab. ii.4; Q. Curtius Hist. Alex. iii.4f) For two centuries Tarsus had been the capital of a Persian satrapy, subject to oriental rather than to Hellenic influence, though there was probably a Hellenic element in its population, and its trade brought it into touch with the Greeks. The Cilician coins struck at Tarsus confirm this view. Down to Alexander\'s conquest, they ordinarily bear Aramaic legends, and many of them show the effigy of Baal Tarz, the Lord of Tarsus; yet, these coins are clearly influenced by Greek types and workmanship.<P>4. Tarsus under Greek Sway:<P>Alexander\'s overthrow of the Persian power brought about a strong Hellenic reaction in southeastern Asia Minor and must have strengthened the Greek element in Tarsus, but more than a century and a half were to elapse before the city attained that civic autonomy which was the ideal and the boast of the Greek polis. After Alexander\'s death in 323 BC his vast empire was soon dismembered by the rivalries and wars of his powerful generals. Cilicia ultimately fell under the rule of the Seleucid kings of Syria, whose capital was Antioch on the Orontes. Though Greeks, they inherited certain features of the old Persian policy and methods of rule; Cilicia was probably governed by a satrap, and there was no development within it of free city life. Early in the 2nd century, however, came a change. Antiochus III, defeated by the Romans in the battle of Magnesia (190 BC), was forced to evacuate most of his possessions in Asia Minor. Cilicia thus became a frontier province and gained greatly in importance. The outcome was the reorganization of Tarsus as an autonomous city with a coinage of its own, which took place under Antiochus IV Epiphanes (175-164), probably in 171 BC. It is at this time that Tarsus is first mentioned in the Bible, unless we are to accept the disputed identification with <a href="./study/isbe/search.html?string=TARSHISH">TARSHISH</a> (which see). In 2Macc 4:30f we read that, about 171 "it came to pass that they of Tarsus and Mallus made insurrection, because they were to be given as a present to Antiochis, the king\'s concubine. The king therefore came to Cilicia in all haste to settle matters." That this settlement took the form of a compromise and the grant to Tarsus of at least a municipal independence we may infer from the fact that Tarsus struck its own coins from this reign onward. At first they bear the name of Antioch on the Cydnus, but from the death of Antiochus this new appellation falls into disuse and the old name reasserts itself. But it is almost certain that, in accordance with Seleucid policy, this reorganization was accompanied by the enlargement of the citizen body, the new citizens in this case consisting probably of Jews and Argive Greeks. From this time Tarsus is a city of Hellenic constitution, and its coins no longer bear Aramaic but Greek legends. Yet it must be remembered that there was still a large, perhaps a preponderating, native and oriental element in the population, while the coin types in many cases point to the continued popularity of non-Hellenic cults.<P>5. Tarsus in the Roman Empire:<P>About 104 BC part of Cilicia became a Hem province, and after the Mithridatic Wars, during which Tarsus fell temporarily into the hands of Tigranes of Armenia, Pompey the Great reorganized the eastern portion of the Hem Empire (64-63 BC), and Tarsus became the capital of a new and enlarged province, administered by Hem governors who usually held office for a single year. Thus we find Cicero in command of Cilicia from the summer of 51 BC to the summer of the following year, and though he expressly mentions Tarsus only rarely in his extant letters of this period (e.g. Ad Art. v.20,3; Ad Faro. ii.17,1), yet there is reason to believe that he resided there during part of his year of office. Julius Caesar passed through the city in 47 BC on his march from Egypt to Pontus, and was enthusiastically received. In his honor the name Tarsus was changed to Juliopolis, but this proved no more lasting than Antioch on the Cydnus had been. Cassius temporarily overawed it and imposed on it a crushing fine, but, after the overthrow of the republican cause at Philippi and the assignment of the east to Antony\'s administration, Tarsus received the position of an independent and duty-free state (civitas libera et immunis) and became for some time Antony\'s place of residence. This privileged status was confirmed by Augustus after the victory of Actium had made him sole master of the Roman Empire (31 BC). It did not by itself bestow Roman citizenship on the Tarsinas, but doubtless there were many natives of the city to whom Pompey, Caesar, Antony and Augustus granted that honor for themselves and, as a consequence, for their descendants.<P>6. The University:<P>It is under the rule of Augustus that our knowledge of Tarsus first becomes fairly full and precise, Strabo, writing about 19 AD, tells us (xiv.673ff) of the enthusiasm of its inhabitants for learning, and especially for philosophy. In this respect, he says, Tarsus surpasses Athens and Alexandria and every other university town. It was characterized by the fact that the student body was composed almost entirely of natives, who, after finishing their course, usually went abroad to complete their education and in most cases did not return home, whereas in most universities the students were to a large extent foreigners, and the natives showed no great love of learning. Alexandria, however, formed an exception, attracting a large number of foreign students and also sending out many of its younger citizens to other centers. In fact, adds Strabo, Rome is full of Tarsians and Alexandrians. Among the famous men who learned or taught at Tarsus, we hear of the Stoics Antipater, Archedemus, Nestor, Athenodorus surnamed Cordylion, the friend and companion of the younger Marcus Cato, and his more famous namesake (called Canaanites after the village of his birth), who was the tutor and confidant of Augustus, and who subsequently reformed the Tarsian constitution. Other philosophers of Tarsus were Nestor, a representative of the Academy, and tutor of Marcellus, Augustus\' nephew and destined successor, and of Tiberius, Plutiades and Diogenes; the latter was also famous as an improvisatore, and indeed the Tarsians in general were famed for their ease and fluency in impromptu speaking. Artemidorus and Diodorus the grammarians and Dionysides the tragic poet, a member of the group of seven writers known as "the Pleiad," complete Strabo\'s list of eminent Tarsians. A less attractive view of the life in Tarsus is given by Philostratus in his biography of Apollonius of Tyana, who went there to study in the early part of Tiberius\' reign (14-37 AD). So disgusted was he by the insolence of the citizens, their love of pleasure and their extravagance in dress, that he shook the dust of Tarsus off his feet and went to Aegae to pursue his studies in a more congenial atmosphere (Vit. Apollon. i.7). But Strabo\'s testimony is that of a contemporary and an accurate historian and must outweigh that of Philostratus, whose work is largely tinged with romance and belongs to the early years of the 3rd century AD.<P>7. The Tarsian Constitution:<P>Strabo also tells us something of an important constitutional reform carried out in Tarsus under the Emperor Augustus, probably about 15-10 BC. Athenodorus Canaanites, the Stoic, returned to his city as an old man, after some 30 years spent at Rome, armed with authority from the emperor to reform abuses in its civic life. He found the constitution a democracy, swayed and preyed upon by a corrupt clique headed by a certain Boethus, "bad poet and bad citizen," who owed his position partly to his ready and persuasive tongue, partly to the favor of Antony, whom he had pleased by a poem composed to celebrate the victory of Philippi. Athenodorus sought at first to mend matters by argument and persuasion, but, finding Boethus and his party obdurate, he at length exercised his extraordinary powers, banished the offenders and remodeled the constitution, probably in a timocratic mold, restricting the full citizenship to those possessed of a considerable property qualification. On his death, his place as head of the state was taken for a while by the academic philosopher Nestor (Strabo xiv.674f). Next to Strabo\'s account our most valuable source of information regarding Tarsus is to be found in the two orations of Dio Chrysostom addressed to the Tarsians about 110 AD (Orat. xxxiii, xxxiv; see Jour. Hell. Studies, XXIV, 58ff). Though admitting that the city was an Argive colony, he emphasized its non-Hellenic character, and, while criticizing much in its institutions and manners, found but a single feature to commend, the strictness with which the Tarsian women were veiled whenever they appeared in public.<P>8. Paul of Tarsus:<P>Such was Tarsus, in which Paul was born (<a onClick="return mV(\'Act\',22,3);">Ac 22:3</a>) and of which he was a citizen (<a onClick="return mV(\'Act\',9,11);">Ac 9:11</a>; <a onClick="return mV(\'Act\',21,39);">21:39</a>). Its ancient traditions and its present greatness explain and justify the pride with which he claimed to be "a citizen of no mean city" (<a onClick="return mV(\'Act\',21,39);">Ac 21:39</a>). It is probable that his forefathers had been among the Jews settled at Tarsus by Antiochus Epiphanes, who, without sacrificing nationality or religion, became citizens of a community organized after the Greek model. On what occasion and for what service Roman civitas had been conferred on one of Paul\'s ancestors we cannot say; this only we know, that before his birth his father had possessed the coveted privilege (<a onClick="return mV(\'Act\',22,28);">Ac 22:28</a>). It is a fascinating, but an elusive, quest to trace in Paul\'s life and writings the influence of his Tarsian ancestry, birth and early life. Jerome, it is true, claims that many Pauline words and phrases were characteristic of Cilicia, and some modern scholars profess to find traces, in the apostle\'s rhetoric and in his attitude toward pagan religion and secular learning, of Tarsian influence. But such speculations are likely to be misleading, and it is perhaps best to admit that, save in the trade learned by Paul, which was characteristic of his birthplace, we cannot with any precision gauge the effects of his early surroundings. At the same time it is certain that the character of his native city, its strong oriental element, its Greek constitution and speech, its position in the Roman Empire, its devotion to learning, must have made an impression upon one who, uniting Jewish nationality with membership of a Greek state and Roman citizenship, was to be the great interpreter to the Greco-Roman world of a religion which sprang from the soil of Judaism. How long Paul remained at Tarsus before beginning his studies in Jerusalem we cannot say. His own declaration that he was "born in Tarsus of Cilicia, but brought up in this city" (<a onClick="return mV(\'Act\',22,3);">Ac 22:3</a>) seems to show that his training at Jerusalem began at an early age, and is inconsistent with the supposition that he was one of those Tarsian students who, after studying at their native university, completed their education abroad. During his first visit to Jerusalem after his conversion, plots were formed against his life, and he was induced to return to Tarsus (<a onClick="return mV(\'Act\',9,30);">Ac 9:30</a>), where, according to Ramsay\'s chronology, he remained for some 8 years. Thither Barnabas went to seek him when he felt the need of a helper in dealing with the new problems involved in the growth of the Antiochene church and the admission into it of Gentiles in considerable numbers (<a onClick="return mV(\'Act\',11,25);">Ac 11:25</a>). Tarsus is not again mentioned in the New Testament, but Paul doubtless revisited it on his second missionary journey, when he "went through Syria and Cilicia" (<a onClick="return mV(\'Act\',15,41);">Ac 15:41</a>), and traveled thence by way of the Cilician Gates into Lycaonia, and again at the beginning of his third journey when, after some time spent at Antioch, "he departed, and went through the region of Galatia, and Phrygia, in order" (<a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>).<P>9. Later History:<P>This is not the place to discuss in detail the later history of Tarsus, many passages of which are obscure and difficult. It remained a focus of imperial loyalty, as is indicated by the names Hadriane, Commodiane, Severiane and others, which appear, isolated or conjoined, upon its coins, together with the title of metropolis and such epithets as "first," "greatest," "fairest." Indeed it was chiefly in the matter of such distinctions that it carried on a keen, and sometimes bitter, rivalry, first with Mallus and Adana, its neighbors in the western plain, and later with Anazarbus, the chief town of Eastern Cilicia. But Tarsus remained the capital of the district, which during the 1st century of the empire was united with Syria in a single imperial province, and when Cilicia was made a separate province Tarsus, as a matter of course, became its metropolis and the center of the provincial Caesar-worship, and, at a later date, the capital of "the three Eparchiae,"cilicia, Isauria and Lycaonia. Toward the close of the 4th century Cilicia was divided into two, and Tarsus became the capital of Cilicia Prima only. Soon after the middle of the 7th century it was captured by the Arabs, and for the next three centuries was occupied by them as their northwestern capital and base of operations against the Anatolian plateau and the Byzantine empire. In 965 it was recaptured, together with the rest of Cilicia, by the emperor Nicephorus Phocas, but toward the close of the following century it fell into the hands of the Turks and afterward of the Crusaders. It was subsequently ruled by Armenian princes as part of the kingdom of Lesser Armenia, and then by the Memluk sultans of Egypt, from whom it was finally wrested by the Ottoman Turks early in the 16th century. The modern town, which still bears the ancient name in the slightly modified form Tersous, has a very mixed population, numbering about 25,000, and considerable trade, but suffers from its unhealthful situation and the proximity of large marshy tracts. Few traces of its ancient greatness survive, the most considerable of them being the vast substructure of a Greco-Roman temple, known locally as the tomb of Sardanapalus (R. Koldewey in C. Robert, Aus der Anomia, 178ff).<P>LITERATURE.<P>The best account of Tarsus will be found in W. M. Ramsay, The Cities of Paul (London, 1907), 85-244; the same writer\'s articles on "Cilicia, Tarsus and the Great Taurus Pass" in the Geographical Journal,1903,357ff, and on "Tarsus" in HDB should also be consulted, as well as H. Bohlig, Die Geisteskultur yon Tarsos im augusteischen Zeitalter (Gottingen, 1913). For inscriptions see LeBas-Waddington, Voyage archeologique, III, numbers 1476ff; Inscr. Graec. ad res Roman. pertinetes, III, 876ff. For coins, B. V. Head, Historia Numorum2, 729ff; G. F. Hill, British Museum Catalogue of Coins: Lycaonia, Isauria and Cilicia, lxxviff, 162ff.``176';
isbe[8627]='Tartak`tar\'-tak (tartaq): In <a onClick="return mV(\'2Ki\',17,31);">2Ki 17:31</a> mentioned as the name of an idol of the Avvites, one of the peoples sent by Shalmaneser to the cities of Samaria. It is otherwise unknown.``1';
isbe[8628]='Tartan`tar\'-tan (tartan): For a long time the word was interpreted as a proper name, but the Assyrian inscriptions have shown it to be the title of a high official. From the eponym lists it would seem that it was the title of the highest official next to the king, which in a military empire like Assyria would be the "commander-in-chief." The Assyrian form of the name is tartanu or turtanu. In both Old Testament passages the reference is to a military officer. In <a onClick="return mV(\'Isa\',20,1);">Isa 20:1</a> it is used of the officer sent by Sargon, king of Assyria, against Ashdod; according to <a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a>, Sennacherib sent Tartan and <a href="./study/isbe/search.html?string=RAB-SARIS">RAB-SARIS</A> (which see) and <a href="./study/isbe/search.html?string=RABSHAKEH">RABSHAKEH</A>(which see) with a great host against Jerusalem. The names of the-two officials are not known.``50';
isbe[8629]='Taskmaster`task\'-mas-ter: (sar mac, "chief of the burden" or "levy" (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>); noghes, "distress," "driver," "oppressor," "raiser of taxes," "taskmaster" (<a onClick="return mV(\'Exd\',3,7);">Ex 3:7</a>; <a onClick="return mV(\'Exd\',5,6,10,13,14);">5:6,10,13,14</a>)): Officials of this class seem to have been officially appointed by Pharaoh for the purpose of oppressing the Israelites and subduing their spirits, lest they seek complete independence or organize a rebellion against the government (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>). The condition of the Israelites at this time became one of complete vassalage or slavery, probably owing to the fact that the Hyksos were driven out and a new dynasty was established, which knew nothing of Joseph and his people.``77';
isbe[8630]='Tassel`tas\'-\'l (tsitsith): This word occurs only in <a onClick="return mV(\'Num\',15,38);">Nu 15:38</a> (Revised Version margin), which reads "tassels in the corners" for "fringes in the borders of their garments" (the King James Version).<P>It is probable that the dress of the Palestinian peasant has undergone little change in the centuries since the occupation of the land by the Hebrews. His outer garment, worn for protection against cold and rain, is the simlah of <a onClick="return mV(\'Exd\',22,26);">Ex 22:26</a>, now known as \'abayah by the Arabs. It is a square cloak, with unsewn spaces for armholes, and is composed of either three or four widths of woven stuff. The outer strips of the stuff, folded back and sewn at the upper edges, form shoulder-straps. It was to such a garment as this that the injunctions of <a onClick="return mV(\'Num\',15,\'37-41\');">Nu 15:37-41</a> and of <a onClick="return mV(\'Deu\',22,12);">De 22:12</a> applied.`<a href="./study/isbe/search.html?string=FRINGES">FRINGES</a>`17';
isbe[8631]='Taste`tast (Hebrew Ta\'am, "the sense of taste," "perception," from Ta\'am, "to taste," "to perceive"; Aramaic Te\'em, "flavor," "taste" (of a thing); Hebrew chekh, "palate," "roof of the mouth" = "taste"; geuomai; noun geusis; in 2Macc 7:1 the verb is ephaptomai):<P>(1) Literal:<P>(a) Gustation, to try by the tongue: "The taste (ta\'am) of it manna was like wafers made with honey" (<a onClick="return mV(\'Exd\',16,31);">Ex 16:31</a>); "Doth not the ear try words, even as the palate (chekh) tasteth (Ta\'am) its food?" (<a onClick="return mV(\'Job\',12,11);">Job 12:11</a>); "Belshazzar, while he tasted (literally, "at the taste of," Te\'em) the wine, commanded to bring the golden and silver vessels which Nebuchadnezzar his father had taken out of the temple which was in Jerusalem; that the king and his lords, his wives and his concubines, might drink therefrom" (<a onClick="return mV(\'Dan\',5,2);">Da 5:2</a>).<P>(b) "To sample," "to eat but a small morsel": "I did certainly taste (Ta\'am) a little honey with the end of the rod that was in my hand; and, lo, I must die" (<a onClick="return mV(\'1Sa\',14,43);">1Sa 14:43</a>).<P>(2) Figurative:<P>"To experience," "to perceive": "Oh taste and see that Yahweh is good" (<a onClick="return mV(\'Psa\',34,8);">Ps 34:8</a>; compare <a onClick="return mV(\'1Pe\',2,3);">1Pe 2:3</a>); "How sweet are thy words unto my taste!" (margin "palate," chekh) (<a onClick="return mV(\'Psa\',119,103);">Ps 119:103</a>); "That by the grace of God he should taste of death for every man" (<a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>); "For as touching those who were once enlightened and tasted of the heavenly gift, and were made partakers of the Holy Spirit, and tasted the good word of God, and the powers of the age to come..."(<a onClick="return mV(\'Hbr\',6,4,5);">Heb 6:4,5</a>).``106';
isbe[8632]='Tattenai`tat\'-e-ni (tattenay, various forms in the Septuagint; the King James Version Tatnai, tat\'ni, tat\'na-i\'): A Persian governor, who was the successor of Rehum in Samaria and some other provinces belonging to Judah, bordering on Samaria. He governed the provinces during the reign of Darius Hystaspis and Zerubbabel (<a onClick="return mV(\'Ezr\',5,3,6);">Ezr 5:3,6</a>; <a onClick="return mV(\'Ezr\',6,6,13);">6:6,13</a>). He was friendly to the Jews, and when he heard adverse reports from Jerusalem he suspended judgment till he had investigated the matter on the ground, and then reported to the Persian government in a very moderate manner. In 1Esdras 6:3,7,27; 7:1 he is called "Sisinnes."``178';
isbe[8633]='Tattler`tat\'-ler: Only in <a onClick="return mV(\'1Ti\',5,13);">1Ti 5:13</a> for phluaros. A "silly talker," rather than a "revealer of secrets," is meant.``1';
isbe[8634]='Tav`tav.`<a href="./study/isbe/search.html?string=TAW">TAW</a>`1';
isbe[8635]='Taverns, Three`tav\'-ernz: Three Taverns (Latin Tres Tabernae, Greek transliterates treis tabernai; Cicero Ad Att. i.13; ii.12, 13) was a station on the Appian Road at the 33rd milestone (301/3 English miles from Rome), according to the Itineraries of the Roman Empire (Itin. Ant. vii; Tab. Peut.; Geogr. Rav. iv.34), a converging point of traffic at the crossing of a road from Antium to Norba. Tripontium, 6 miles down the Appian Road in the direction of Appii Forum, was reckoned as the point where the highway entered the region of the Pontiac marshes, the most notable natural feature of this part of Italy.<P>Parties of the Christian brethren in Rome went out to greet the apostle Paul when news was brought that he had arrived at Puteoli, one group proceeding as far as Appii Forum, while another awaited his coming at Three Taverns (<a onClick="return mV(\'Act\',28,15);">Ac 28:15</a>).``3';
isbe[8636]='Taw`tau ("t", "th"): The 22nd letter of the Hebrew alphabet; transliterated in this Encyclopedia with the daghesh as "t", and as "th" without. It came also to be used for the number 400. For name, etc., see <a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</A>.`<a href="./study/isbe/search.html?string=FOREHEAD">FOREHEAD</a>; <a href="./study/isbe/search.html?string=MARK">MARK</a>`1';
isbe[8637]='Tax; Taxing`taks, taks\'-ing:<P><b>I. INTRODUCTION</b><P class="in15">1. General Considerations<P class="in15">2. Limits of the Discussion<P><b>II. TAXES IN ISRAEL UNDER SELF-GOVERNMENT</b><P class="in15">1. In the Earliest Period<P class="in15">2. Under the Theocracy; in the Period of the Judges<P class="in15">3. Under the Kings<P><b>III. TAXES IN ISRAEL UNDER CONQUERORS</b><P class="in15">1. Under the Assyrians and Babylonians<P class="in15">2. Under the Persians<P class="in15">3. Under the Ptolemies and Seleucid Kings<P class="in15">4. Under the Romans<hr /><P>I. Introduction.<P>1. General Considerations:<P>Taxation, in the sense of regular, graduated imposts levied by authority upon wealth, whether in the form of flocks and herds, tilled lands or accumulated treasure, is a comparatively late product of social evolution. The beginnings of this trouble-breeding institution are, of course, very ancient. If in the beginning all wealth was common wealth, all property vested in the family or tribe, making any kind of levies unnecessary, with the rise of individualism, the prorata setting aside, for common uses, of certain possessions held as private property by individuals, which is the essence of taxation, is inevitable. With the advent of more advanced civilization, by which is meant fixed residence, systematic use and cultivation of defined and limited territory, established political organization centering in rulers of one kind or another, regular taxation must necessarily have begun. Throughout history the burden of taxation has kept pace with the elaboration of the machinery of government; kings, courts, ceremonials, legislative and judicial administration, wars, diplomacy—all these institutions spell expense and, consequently, taxation. In a very real sense, the history of taxation is the history of civilization.<P>2. Limits of the Discussion:<P>In following the history of taxation in the Bible, two lines of development are to be noted: Israel\'s internal history when left to herself, and her experiences as tributary to successive conquerors. These two lines of experience form the main divisions of this article. We shall confine ourselves so far as possible to the civil aspects of the subject, leaving for others those interesting problems of taxation connected with the origin and development of the priestly legislation.<P>See <a href="./study/isbe/search.html?string=TITHE">TITHE</A> etc.<P>II. Taxes in Israel under Self-Government.<P>In the first glimpses of the ancestors of the Hebrew people given us in the Bible, no such institution as taxation appears.<P>1. In the Earliest Period:<P>Like all primitive communities, the nomadic Hebrews had no regular system of taxation nor use for any. Voluntary presents were given by the less to the more powerful in return for protection or other advantages. These are really ominous words, for even as late as the United Kingdom, when, of a certainty, the voluntary element had long since gone out the royal income was spoken of, with perhaps unconscious irony as "presents" (<a onClick="return mV(\'1Sa\',10,27);">1Sa 10:27</a>; <a onClick="return mV(\'1Ki\',4,21);">1Ki 4:21</a>; <a onClick="return mV(\'1Ki\',10,25);">10:25</a>). One great tap-root of the whole after-development of systematic taxation is to be found in this primitive custom of giving presents (<a onClick="return mV(\'Gen\',32,\'13-21\');">Ge 32:13-21</a>; <a onClick="return mV(\'Gen\',33,10);">33:10</a>; <a onClick="return mV(\'Gen\',43,11);">43:11</a>). The transition is so fatally easy from presents voluntarily given to those which are expected and finally to those which are demanded (<a onClick="return mV(\'2Ki\',16,8);">2Ki 16:8</a>; compare <a onClick="return mV(\'2Ki\',7,14);">17:4</a>, where the King James Version has "presents").<P>The first evidence of what corresponds to compulsory taxation discoverable in the Bible is in connection with the conquered Canaanites who were compelled to serve under tribute, that is, to render forced labor (<a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>; <a onClick="return mV(\'Jos\',17,13);">17:13</a>; <a onClick="return mV(\'Jdg\',1,\'28-35\');">Jud 1:28-35</a>). In the early custom of making presents to the powerful and in the exactions laid upon conquered peoples, with the necessary public expense of community life as the natural basis, we have the main sources of what grew to be institutional taxation.<P>2. Under the Theocracy; in the Period of the Judges:<P>The only fixed impost under theocracy which has a semi-civil character was the so-called "atonement money" (<a onClick="return mV(\'Exd\',30,\'11-16\');">Ex 30:11-16</a>), really a poll-tax amounting to a half-shekel for each enrolled male member of the community above 20 years of age. The proceeds of this tax were to be used for the service of the Tent of Meeting (see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</A>). It seems to have been levied by the authorities and accepted by the people whenever faithfulness to the ordinances of Yahweh was the order of the day (<a onClick="return mV(\'2Ch\',24,\'4-14\');">2Ch 24:4-14</a>; <a onClick="return mV(\'Neh\',10,32);">Ne 10:32</a>; note here the emphasis laid upon the offering as voluntary, and the variation in amount from one-half to one-third shekel). In later times this tax was devoted to the service of the temple, and was paid by Jews at a distance during the Dispersion. Josephus speaks of the large amounts accruing to the temple-treasury from this source (Ant., XIV, vii, 2). It was still collected as the distinctive temple-tax levied upon the citizen as such (<a onClick="return mV(\'Mat\',17,24);">Mt 17:24</a>). It is interesting to note that Jesus paid it under protest and with one of the most distinctive of His miracles, on the ground of His being the founder and head of a new temple, and hence, not subject to the impost which was the badge of citizenship in the old order.<P>The period of the Judges was too disorganized and chaotic to exhibit many of the characteristics of a settled mode of procedure. As far as we know the only source of public moneys was the giving of presents. If the action of Gideon (<a onClick="return mV(\'Jdg\',8,24);">Jud 8:24</a>) is to be taken as indicating the ordinary policy of the period, the judges received nothing. more than a share of the spoil taken in battle. The account emphasizes, evidently with purpose, the fact that Gideon proffers a request (<a onClick="return mV(\'Jdg\',8,24);">Jud 8:24</a>), and that the people respond freely and gladly.<P>3. Under the Kings:<P>As was to be expected, taxation assumes far greater prominence the moment we cross the threshold of the kingdom. <a onClick="return mV(\'1Sa\',8,\'10-18\');">1Sa 8:10-18</a> is equally significant for our purpose whether it was, as appears on the face of the narrative, the actual words of warning uttered by Samuel in view of the well-known attitude of kings in general, or a later recension from the viewpoint of experience. In either case, the passage gives us a fairly exhaustive list of royal prerogatives. Aside from various forms of public and private service, the king would take (note the word) the best of the vineyards, etc., together with a tenth of the seed and of the flocks. The underlying principle, suggested by Samuel\'s summary and fully exemplified in the actions of Israel\'s kings, is that the king would take what he needed for his public and private needs from the strength and substance of his people. Constitutional laws regulating the expenditure of public funds and the amount of exactions from the people in taxation seem never to have been contemplated in these early monarchies. The king took what he could get; the, people gave what they could not hold back. The long battle for constitutional rights has centered from the beginning about the matter of taxation.<P>In <a onClick="return mV(\'1Sa\',10,27);">1Sa 10:27</a> (compare <a onClick="return mV(\'2Ch\',17,5);">2Ch 17:5</a>) the case cited of worthless fellows who brought Saul no present clearly shows that fealty to the new king was expressed in the giving of presents. The refusal to make these so-called presents was an act of constructive treason, so interpreted by the writer, who mentions Saul\'s silence in the premises as something notable. It is evident that the word "present" has become euphemistic. In <a onClick="return mV(\'1Sa\',17,25);">1Sa 17:25</a> exemption from taxation is specifically mentioned, together with wealth and marriage into the royal family, as one element in the reward to be obtained for ridding Israel of the menace of Goliath.<P>In David\'s time an unbroken series of victories in war so enriched the public treasury (see <a onClick="return mV(\'2Sa\',8,2,7,8);">2Sa 8:2,7,8</a>) that we hear little of complaints of excessive taxation. If David\'s census was for fiscal purposes (<a onClick="return mV(\'2Sa\',24,2);">2Sa 24:2</a>), we can understand why he was so severely dealt with for it, but the matter is still obscure. David\'s habit of dedicating spoil to Yahweh (<a onClick="return mV(\'2Sa\',8,\'10-12\');">2Sa 8:10-12</a>) kept the sacred treasury well supplied. Solomon undoubtedly inherited David\'s scale of public expense (<a onClick="return mV(\'1Ch\',27,\'25-31\');">1Ch 27:25-31</a>) and added to it through his well-developed love of luxury and power. At the same time the cessation of war made the development of internal resources for carrying on his ambitious schemes imperative. The boundaries of his kingdom are specified (<a onClick="return mV(\'1Ki\',4,21);">1Ki 4:21 (Hebrew 5:1)</a>) together with the amount of his income (<a onClick="return mV(\'1Ki\',10,14,28);">1Ki 10:14,28</a>; compare <a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>). It is also stated that other kingdoms paid tribute to him. His system of fiscal administration was very thoroughly organized. He put the whole country under twelve officers (to specify one feature) whose business was to provide, by months, provisions for the court (<a onClick="return mV(\'1Ki\',4,\'7-19\');">1Ki 4:7-19</a>). Under Solomon also, for the first time, so far as we know, Israelites were compelled to render forced labor (<a onClick="return mV(\'1Ki\',5,\'13-17\');">1Ki 5:13-17</a>). By the end of his reign the burden of taxation had become so severe that in the public address made to Rehoboam the people demanded a lightening of the "grievous service" of Solomon as the condition of their fealty to his successor. Rehoboam\'s foolish answer of defiance precipitated the separation of the tribes which proved in the end so disastrous. During the period of prophetic activity which follows, one recurring specification in the denunciations uttered by the prophets against the kings was the excessive burden of taxation imposed upon the people. Amos speaks of "exactions of wheat taken from the poor" (<a onClick="return mV(\'Amo\',5,11);">5:11</a>; compare <a onClick="return mV(\'Amo\',2,6,7,8);">2:6-8</a>). In <a onClick="return mV(\'Amo\',7,1);">7:1</A> he incidentally refers to a custom which has grown up of rendering to the king the first mowings of grass. Isaiah speaks of eating up the vineyards and taking the spoil of the poor (<a onClick="return mV(\'Amo\',3,14);">3:14</A>). Micah, with even greater severity, denounces rulers "who eat the flesh of my people" (<a onClick="return mV(\'Mic\',3,\'1-4\');">3:1-4</a>). These citations are sufficient to show that all through the later monarchy the Israelites suffered more or less from official rapacity and injustice.<P>III. Taxes in Israel under Conquerors.<P>1. Under the Assyrians and Babylonians: During the reign of Menahem, who-succeeded Jeroboam II as king of Israel, the Assyrian invasion under Tiglath-pileser III (Biblical "Pul," <a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>) began. The one act of Menahem (aside from his general sinfulness) which is specified in <a onClick="return mV(\'2Ki\',15,\'17-22\');">2Ki 15:17-22</a>, the remainder of his unedifying career being left to the Chronicles of the Kings of Israel, is that he bought off the Assyrian conqueror by a tribute of a thousand talents which he obtained by mulcting men of wealth in his kingdom to the extent of fifty talents each. A little later, Ahaz of Judah sent a present to the same ruler. He took the novel method of robbing the temple-treasury and adding the sum thus gained to the accumulations at hand in the royal treasury. Both these kings were somewhat original in their methods. Hoshea of Israel, a contemporary of Ahaz, was reduced to tribute; later, upon his neglect to pay, he was put in prison (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>). A little later still, Jehoahaz, the son of Josiah, was deposed by Pharaoh-necoh, who placed a tribute upon the land of a hundred talents of silver and one of gold (<a onClick="return mV(\'2Ki\',23,\'31-33\');">2Ki 23:31-33</a>). Jehoiakim, the puppet king, raised this tribute by a special tax upon the people (<a onClick="return mV(\'2Ki\',23,34,35);">2Ki 23:34,35</a>). This latter passage is especially interesting because it seems to indicate (<a onClick="return mV(\'2Ki\',23,35);">2Ki 23:35</a>f) a graduated system of taxation supposedly honored more often in the breach than in the observance. This same unfortunate Jehoiakim came under the heavy hand of Nebuchadnezzar (<a onClick="return mV(\'2Ki\',24,\'1-7\');">2Ki 24:1-7</a>). This latter ruler seems not to have levied a special tribute, at least it is not mentioned; but reimbursed himself for the expenses of conquest by carrying away to Babylon the vessels of the temple (<a onClick="return mV(\'2Ch\',36,7);">2Ch 36:7</a>).<P>2. Under the Persians:<P>In <a onClick="return mV(\'Ezr\',4,13);">Ezr 4:13</a>, a part of a letter addressed to Artaxerxes by officials "west of the river" (see whole passage <a onClick="return mV(\'Ezr\',4,\'7-24\');">Ezr 4:7-24</a>) who were hostile to the Jew
