s, it is charged that in the event of rebuilding the city the inhabitants would not pay "tribute, custom, or toll." These three words, which are evidently combined in a formula and indicate three distinct classes of taxes, are interesting as being characteristic of the Persian period. <P>The three words are:<P>(1) middah = "tribute" (<a onClick="return mV(\'Ezr\',4,13);">Ezr 4:13,20</a>; compare <a onClick="return mV(\'Neh\',5,4);">Ne 5:4</a>, where the expression is "king\'s tribute");<P>(2) belo = according to Gesenius under the word: "tax on articles consumed" or "excise". (HDB "impost") (<a onClick="return mV(\'Ezr\',4,13,20);">Ezr 4:13,20</a>; <a onClick="return mV(\'Ezr\',7,24);">7:24</a>);<P>(3) halakh = "road-toll" or "custom tax" (<a onClick="return mV(\'Ezr\',4,20);">Ezr 4:13,20</a>; <a onClick="return mV(\'Ezr\',7,24);">7:24</a>).<P>These Assyrian words are to be contrasted with the words used elsewhere:<P>(1) mac = "forced labor" (<a onClick="return mV(\'1Ki\',5,13);">1Ki 5:13 (Hebrew 5:27)</a>; compare ut sup. <a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>; <a onClick="return mV(\'Jos\',17,13);">17:13</a>; <a onClick="return mV(\'Jdg\',1,28,30,33,35);">Jud 1:28,30,33,35</a>; <a onClick="return mV(\'Deu\',20,11);">De 20:11</a>; <a onClick="return mV(\'Est\',10,1);">Es 10:1</a>);<P>(2) massa\' = "burden" (<a onClick="return mV(\'2Ch\',17,11);">2Ch 17:11</a>);<P>(3) mekhec = "measure," used of tribute exacted for Yahweh, taken from people, cattle, and spoil, etc. (<a onClick="return mV(\'Num\',31,\'25-31\');">Nu 31:25-31</a>).<P>From this enumeration and comparison it will be seen that the Hebrew had no general word corresponding to the English word "tax."<P>To return to the situation in the Persian period, it is evident that the Persian rulers exacted practically the same classified tributes, direct and indirect, that are found elsewhere. It is recorded that Artaxerxes, in response to the letter of his officers in Palestine (<a onClick="return mV(\'Ezr\',4,21);">Ezr 4:21</a>), stopped the work of the rebuilding of Jerusalem in anticipation of the refusal of the Jewish leaders to pay taxes. The work was resumed in the 2nd year of Darius under the protection of a royal decree which gave to the Jewish authorities a sufficient amount from the "tribute beyond the river" to finish without delay.<P>Artaxerxes, in addition to his generous gifts, exempted the priests and temple-servants from all taxation (<a onClick="return mV(\'Ezr\',7,24);">Ezr 7:24</a>). In the days of Nehemiah a serious condition arose. The king\'s tribute was so heavy that the Jewish common people were compelled to borrow money upon mortgages, and in so doing fell into the hands of usurers of their own people, by whom they were so impoverished as to be compelled to sell their sons and daughters into slavery (<a onClick="return mV(\'Neh\',5,\'1-13\');">Ne 5:1-13</a>). In addition to the royal tribute, they were forced to support the governors who were entitled to bread, wine and forty shekels of silver annually (<a onClick="return mV(\'Neh\',5,14,15);">Ne 5:14,15</a>). In the prayer offered on the fast day (<a onClick="return mV(\'Neh\',9,\'1-\');">Ne 9</a>) it was asserted that their burdens of taxation were so heavy that they were servants in their own land (<a onClick="return mV(\'Neh\',9,36,37);">Ne 9:36,37</a>).<P>3. Under the Ptolemies and Seleucid Kings:<P>The Ptolemies, who practically controlled Palestine from 301 to 218 BC, do not appear to have been excessive in their demands for tribute (twenty talents for Jews (Ant., XII, iv, 1) seems no great amount), but the custom which they introduced, or at least established, of farming the taxes to the highest bidder, introduced a principle which prevailed through all the subsequent history and was the cause of much popular suffering and discontent. The story of Joseph, the Jewis tax-collector (Ant., XII, iv, 1-5), who was for 23 years farmer-general of taxes for Palestine under Ptolemy Euergetes, and the cause of "a long train of disasters" is peculiarly significant for the student of the New Testament.<P>The conquest of Palestine by Antiochus the Great (202 BC) brought a certain amount of relief to the "storm-tossed" (Josephus) Jews of Palestine, as of old the buffer state between contending powers. According to Josephus (Ant., XII, iii, 3), Antiochus gave the Jews generous gifts in money, remitted their taxes for three years, and permanently reduced them one-third (see Kent\'s discussion of the credibility of these statements, Historical Series for Bible Students, Babylonian, Persian, Greek Periods, 296).<P>That the Selucid kings were particularly severe in their exactions is clearly shown in the letter of Demetrius to the Jews, whose favor he was seeking in rivalry with Alexander Balas of Smyrna, the pretender to the Selucid throne (see 1Macc 10:26-30; 11:34,35; 13:39; compare <span class="noTag">11:28</span>).<P>In this quoted letter Demetrius promises the following exemptions:<P>from (1) "tributes" (phori = "polltaxes");<P>(2) tax on salt;<P>(3) crown taxes (stephanoi = "crowns of gold" or their equivalents);<P>(4) the tribute of one-third of the seed;<P>(5) another of one-half of the fruit of the trees (1Macc 10:29,30).<P>This seems almost incredibly severe, but evidence is not lacking of its probability (Lange\'s Commentary Apocrypha, edition 1901, 525). With Selcucus IV (187-176 BC) the Jews felt for the first time, indirectly but powerfully, the pressure of Rome. This disreputable ruler had to pay tribute to Rome as well as to find means whereby to gratify his own passion for luxury, and was correspondingly rapacious in the treatment of his subjects (2Macc 3).<P>4. Under the Romans:<P>During the early part of the Heroadian epoch, taxes were paid to the king and collected by officers appointed by him. This method which worked fairly well, at least under Herod the Great, had passed away before any books of the New Testament were written. After the deposition of Archelaus (6 AD), at the request of the Jews themselves, Judea was incorporated into the Roman empire and put under procurators who were in charge of all financial administration, although the tetrarchs still collected the internal taxes. This fact conditions all that is to be said about "tribute" and "publicans" in connection with the New Testament. It is to be noted first of all (a fact that is often overlooked by the student) that in the imperial era the direct taxes were not farmed out, but collected by regular imperial officers in the regular routine of official duty. The customs or tolls levied upon exports and imposts, and upon goods in the hands of merchants passing through the country, were sold to the highest bidders, who were called publicans.<P>With this distinction clearly in mind we may dismiss the subject of general taxation with the following remarks: First that the taxes in Judea went to the imperial treasury (<a onClick="return mV(\'Mat\',22,17);">Mt 22:17</a>; <a onClick="return mV(\'Mar\',12,14);">Mr 12:14</a>; <a onClick="return mV(\'Luk\',20,22);">Lu 20:22</a>); second that these taxes were very heavy. These two facts explain why the question of paying tribute to Caesar, which our Lord was obliged to meet, was so burning an issue. It touched at once religious and financial interest—a powerful combination. In 7 AD, immediately after the appointment of Coponius as procurator, Quirinius (see Quirinius, New Testament Chronology, etc.) was sent to Judea to take a census (apographe) for the purpose of poll-tax (kensos, phoros, or epikephalaion (<a onClick="return mV(\'Mat\',22,17);">Mt 22:17</a>; <a onClick="return mV(\'Mar\',12,13,14);">Mr 12:13,14</a>; <a onClick="return mV(\'Luk\',20,20);">Lu 20:20</a>)). This census was the occasion for the bloody uprising of Judas of Gamala (or Galilee) (<a onClick="return mV(\'Act\',5,37);">Ac 5:37</a>; compare Ant, XVIII, i 1, 6). As a matter of historical fact this same census was the occasion of the final destruction of the Jewish commonwealth, for the fierce antagonism to Rome which was aroused at that time never died out until it was extingushed in blood, 70 AD.<P>We are now free to discuss those matters which center in a general way about the term "publican." According to Stapfer (PTC, 215) this term (telones) is commonly used to cover several grades of minor officials engaged in the customs service. The word was extended in meaning from the publicanus, properly so called, the farmer-general of a province, to his subordinate local officials. The publicans of the New Testament "examined the goods and collected tolls on roads and bridges" (Stapfer, op. cit., 216; compare <a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>). These tolls (Latin, portoria; Greek tele) were collected in Palestine at Caesarea, Capernaum and Jericho (Josephus, BJ, II, xiv, 4). Those collected at Capernaum went into the treasury of Herod Antipas. At Jericho there was a chief publican (architelones), but most of the publicans mentioned in the New Testament were probably subordinate to men higher in authority.<P>Sufficient cause for the unpopularity of publicans in New Testament times is not far seek. Hatred of paying duties seems to be ingrained in human nature. Customs officials are always unpopular. The method is necessarily inquisitorial. The man who opens one\'s boxes and bundles to appraise the value of what one has, is at best a tolerated evil. In Judea, under the Roman system, all circumstances combined to make the publican the object of bitter hatred. He represented and exercised in immediate contact, at a sore spot with individuals, the hatred power of Rome. The tax itself was looked upon as an inherent religious wrong, as well as civil imposition, and by many the payment of it was considered a sinful act of disloyalty to God. The tax-gatherer, if a Jew, was a renegade in the eyes of his patriotic fellows. He paid a fixed sum for the taxes, and received for himself what he could over and above that amount. The ancient and widespread curse of arbitrariness was in the system. The tariff rates were vague and indefinite (see Schurer, HJP, I, ii, 67f). The collector was thus always under the suspicion of being an extortioner and probably was in most instances. The name was apt to realize itself. The unusual combination in a publican of petty tyrant, renegade and extortioner, made by circumstances almost inevitable, was not conductive to popularity. In the score of instances in the New Testament where publicans are mentioned, their common status, their place in the thought and action of Jesus, their new hope in the gospel are clearly set forth. The instances in which our Lord speaks of them are especially illuminating:<P>(1) He uses them on the basis of the popular estimate which the disciples undoubtedly shared, to point in genial irony a reproach addressed to His hearers for their low standard of love and forgiveness (<a onClick="return mV(\'Mat\',5,46,47);">Mt 5:46,47</a>).<P>(2) He uses the term in the current combination in giving directions about excommunicating a persistently unrepentant member of the church (<a onClick="return mV(\'Mat\',18,17);">Mt 18:17</a>).<P>(3) He uses the term in the popular sense in describing the current condemnation of His attitude of social fellowship with them, and constructively accepts the title of "friend of publicans and sinners" (<a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>; <a onClick="return mV(\'Luk\',7,34);">Lu 7:34</a>).<P>(4) Most significant of all, Jesus uses the publican, as He did the Samaritan, in a parable in which the despised outcast shows to advantage in an attitude acceptable to God (<a onClick="return mV(\'Luk\',18,9);">Lu 18:9</a>).<P>This parable is reinforced by the statement, made more than once by our Lord, that the readiness to repent shown by the publicans and other outcasts usually found with them was more promising of salvation than the spiritual pride shown by some who were satisfied with themselves (<a onClick="return mV(\'Luk\',3,12);">Lu 3:12</a>; compare <a onClick="return mV(\'Luk\',7,29);">7:29</a>; <a onClick="return mV(\'Mat\',21,31,32);">Mt 21:31,32</a>; <a onClick="return mV(\'Luk\',15,1);">Lu 15:1</a>). The choice of Levi as a disciple (<a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>, etc.) and the conversion of Zaccheus (<a onClick="return mV(\'Luk\',19,8);">Lu 19:8</a>f), of whom Jesus speaks so beautifully as a son of Abraham (<a onClick="return mV(\'Luk\',19,9);">Lu 19:9</a>), justified the characteristic attitude which our Lord adopted toward the despised class, about equally guilty and unfortunate. He did not condone their faults or crimes; neither did He accept the popular verdict that pronounced them unfit for companionship with the good and without hope in the world. According to the teaching and accordant action of jesus, no man or woman is without hope until the messenger of hope has been definitely rejected.<P>It is fitting, if somewhat dramatic, that a study of taxation—that historic root of bitterness periodically springing up through the ages—should end in comtemplation of Him who spoke to an outcast and guilty tax-collector (<a onClick="return mV(\'Luk\',19,10);">Lu 19:10</a>) the wonderful words: "The Son of man came to seek and to save that which was lost."``169';
isbe[8638]='Teach; Teacher; Teaching`tech, tech\'-er, tech\'-ing:<P><b>I. OLD TESTAMENT TERMS</b><P class="in15">1. Discipline<P class="in15">2. Law<P class="in15">3. Discernment<P class="in15">4. Wisdom<P class="in15">5. Knowledge<P class="in15">6. Illumination<P class="in15">7. Vision<P class="in15">8. Inspiration<P class="in15">9. Nourishment<P><b>II. NEW TESTAMENT TERMS</b><P class="in15">1. Instruction<P class="in15">2. Acquisition<P class="in15">3. Presentation<P class="in15">4. Elucidation<P class="in15">5. Exposition<P class="in15">6. Authority<P class="in15">7. Care<P class="in15">8. Supervision<P>III. OLD TESTAMENT HISTORY<P class="in15">1. In the Home<P class="in15">2. In Public<P><b>IV. EXTRA-BIBLICAL TEACHING</b><P><b>V. NEW TESTAMENT HISTORY</b><P class="in15">1. Christ\'s Life<P class="in15">2. Apostolic Labors<P class="in15">3. General Considerations<hr /><P>A rich variety of words is employed in the Bible to describe the teaching process. The terms do not so much indicate an office and an official as a function and a service, although both ideas are often expressed or implied.<P>I. Old Testament Terms.<P>1. Discipline:<P>lamadh, "to beat": A very common word for "to teach"; it may have meant "to beat with a rod," "to chastise," and may have originally referred to the striking and goading of beasts by which they were curbed and trained. By a noble evolution the term came to describe the process of disciplining and training men in war, religion and life (<a onClick="return mV(\'Isa\',2,3);">Isa 2:3</a>; <a onClick="return mV(\'Hsa\',10,11);">Ho 10:11</a>; <a onClick="return mV(\'Mic\',4,2);">Mic 4:2</a>). As teaching is both a condition and an accompaniment of disciplining, the word often means simply "to teach," "to inform" (<a onClick="return mV(\'2Ch\',17,7);">2Ch 17:7</a>; <a onClick="return mV(\'Psa\',71,17);">Ps 71:17</a>; <a onClick="return mV(\'Pro\',5,13);">Pr 5:13</a>). The glory of teaching was its harmony with the will of God, its source in God\'s authority, and its purpose to secure spiritual obedience (<a onClick="return mV(\'Deu\',4,5,14);">De 4:5,14</a>; <a onClick="return mV(\'Deu\',31,12,13);">31:12,13</a>).<P>2. Law:<P>yarah, "to cast": The teaching idea from which the law was derived is expressed by a verb which means "to throw," "to cast as an arrow or lot." It is also used of thrusting the hand forth to point out or show clearly (<a onClick="return mV(\'Gen\',46,28);">Ge 46:28</a>; <a onClick="return mV(\'Exd\',15,25);">Ex 15:25</a>). The original idea is easily changed into an educational conception, since the teacher puts forth new ideas and facts as a sower casts seed into the ground. But the process of teaching was not considered external and mechanical but internal and vital (<a onClick="return mV(\'Exd\',35,34,35);">Ex 35:34,35</a>; <a onClick="return mV(\'2Ch\',6,27);">2Ch 6:27</a>). The nominal form is the usual word for law, human and divine, general and specific (<a onClick="return mV(\'Deu\',4,8);">De 4:8</a>; <a onClick="return mV(\'Psa\',19,8);">Ps 19:8</a>; <a onClick="return mV(\'Pro\',1,8);">Pr 1:8</a>). The following are suggestive phrases: "the book of the law" (<a onClick="return mV(\'Deu\',28,61);">De 28:61</a>; <a onClick="return mV(\'2Ki\',22,8);">2Ki 22:8</a>); "the book of the law of Moses" (<a onClick="return mV(\'Jos\',8,31);">Jos 8:31</a>; <a onClick="return mV(\'2Ki\',14,6);">2Ki 14:6</a>); "the book of the law of God" (<a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>); "the book of the law of Yahweh" (<a onClick="return mV(\'2Ch\',17,9);">2Ch 17:9</a>). Thus even in the days of Joshua there was in the possession of the religious teachers a book of the Law of the Lord as given by Moses. This recorded revelation and legislation continued to be the divine norm and ultimate authority for priest, king and people (<a onClick="return mV(\'2Ch\',23,11);">2Ch 23:11</a>; <a onClick="return mV(\'Neh\',8,\'1-3\');">Ne 8:1-3</a>).<P>3. Discernment:<P>bin, "to separate": The word meaning "to separate," "to distinguish," is often used in a causative sense to signify "to teach." The idea of teaching was not an aggregation of facts bodily transferred like merchandise. Real learning followed genuine teaching. This word suggests a sound psychological basis for a good pedagogy. The function of teaching might be exercised with reference to the solution of difficult problems, the interpretation of God\'s will, or the manner of a godly life (<a onClick="return mV(\'Dan\',8,16,26);">Da 8:16,26</a>; <a onClick="return mV(\'Neh\',8,\'7-9\');">Ne 8:7-9</a>; <a onClick="return mV(\'Psa\',119,34);">Ps 119:34</a>).<P>4. Wisdom:<P>sakhal, "to be wise": The verb from which the various nominal forms for "wisdom" are derived means "to look at," "to behold," "to view," and in the causative stem describes the process by which one is enabled to see for himself what had never before entered his physical or intellectual field of consciousness. The noun indicates a wise person or sage whose mission is to instruct others in the ways of the Lord (<a onClick="return mV(\'Pro\',16,23);">Pr 16:23</a>; <a onClick="return mV(\'Pro\',21,11);">21:11</a>; and often in the Wisdom literature). In <a onClick="return mV(\'Dan\',12,3);">Da 12:3</a> we read: "They that are wise (margin, "the teachers") shall shine as the brightness of the firmament."<P>5. Knowledge:<P>yadha\', "to see" (compare oida): This verb literally means "to see" and consequently "to perceive," "to know," "to come to know," and "cause to know or teach." It describes the act of knowing as both progressive and completed. The causative conception signifies achievement in the sphere of instruction. It is used of the interpretation and application by Moses of the principles of the law of God (<a onClick="return mV(\'Exd\',18,16,20);">Ex 18:16,20</a>), of the elucidation of life\'s problems by the sages (<a onClick="return mV(\'Pro\',9,9);">Pr 9:9</a>; <a onClick="return mV(\'Pro\',22,19);">22:19</a>), and of constant Providential guidance in the way of life (<a onClick="return mV(\'Psa\',16,11);">Ps 16:11</a>).<P>6. Illumination:<P>zahar, "to shine": This verbal root signifies "to shine," and when applied to the intellectual sphere indicates the function of teaching to be one of illumination. Ignorance is darkness, knowledge is light. Moses was to teach the people statutes and laws, or to enlighten them on the principles and precepts of God\'s revelation (<a onClick="return mV(\'Exd\',18,20);">Ex 18:20</a>). The service rendered by the teachers—priests, Levites and fathers—sent forth by Jehoshaphat, was one of illumination in the twofold sense of instruction and admonition (<a onClick="return mV(\'2Ch\',19,\'8-10\');">2Ch 19:8-10</a>).<P>7. Vision:<P>ra\'-ah, "to see": The literal meaning of this verb is "to see," and the nominal form is the ancient name for prophet or authoritative teacher who was expected to have a clear vision of spiritual realities, the will of God, the need of man and the way of life (<a onClick="return mV(\'1Sa\',9,9);">1Sa 9:9</a>; <a onClick="return mV(\'1Ch\',9,22);">1Ch 9:22</a>; <a onClick="return mV(\'2Ch\',16,7);">2Ch 16:7</a>f; <a onClick="return mV(\'Isa\',30,10);">Isa 30:10</a>).<P>8. Inspiration;<P>nabha\', "to boil up": The most significant word for "prophet" is derived from the verb which means "to boil up or forth like a fountain," and consequently to pour forth words under the impelling power of the Spirit of God. The Hebrews used the passive forms of the verb because they considered the thoughts and words of the prophets due not to personal ability but to divine influence. The utterances of the prophets were characterized by instruction, admonition, persuasion and prediction (<a onClick="return mV(\'Deu\',18,\'15-22\');">De 18:15-22</a>; <a onClick="return mV(\'Eze\',33,\'1-20\');">Eze 33:1-20</a>).<P>9. Nourishment:<P>ra\'ah, "to feed a flock": The name "shepherd," so precious in both the Old Testament and the New Testament, comes from a verb meaning "to feed," hence, to protect and care for out of a sense of devotion, ownership and responsibility. It is employed with reference to civil rulers in their positions of trust (<a onClick="return mV(\'2Sa\',5,2);">2Sa 5:2</a>; <a onClick="return mV(\'Jer\',23,2);">Jer 23:2</a>); with reference to teachers of virtue and wisdom (<a onClick="return mV(\'Pro\',10,21);">Pr 10:21</a>; <a onClick="return mV(\'Ecc\',12,11);">Ec 12:11</a>); and preeminently with reference to God as the great Shepherd of His chosen people (<a onClick="return mV(\'Psa\',23,1);">Ps 23:1</a>; <a onClick="return mV(\'Hsa\',4,16);">Ho 4:16</a>). <a onClick="return mV(\'Eze\',34,\'1-\');">Eze 34</a> presents an arraignment of the unfaithful shepherds or civil rulers; <a onClick="return mV(\'Psa\',23,\'1-\');">Ps 23</a> reveals Yahweh as the Shepherd of true believers, and <a onClick="return mV(\'Jhn\',10,\'1-\');">Joh 10</a> shows how religious teachers are shepherds under Jesus the Good Shepherd.<P>II. New Testament Terms.<P>Further light is thrown upon religious teaching in Bible times by a brief view of the leading educational terms found in the New Testament.<P>1. Instruction:<P>didasko, "to teach": The usual word for "teach" in the New Testament signifies either to hold a discourse with others in order to instruct them, or to deliver a didactic discourse where there may not be direct personal and verbal participation. In the former sense it describes the interlocutory method, the interplay of the ideas and words between pupils and teachers, and in the latter use it refers to the more formal monologues designed especially to give information (<a onClick="return mV(\'Mat\',4,23);">Mt 4:23</a>; <a onClick="return mV(\'Mat\',5,\'1-\');">Mt 5-7</a>; <a onClick="return mV(\'Mat\',13,36);">13:36</a>f; <a onClick="return mV(\'Jhn\',6,59);">Joh 6:59</a>; <a onClick="return mV(\'1Cr\',4,17);">1Co 4:17</a>; <a onClick="return mV(\'1Ti\',2,12);">1Ti 2:12</a>). A teacher is one who performs the function or fills the office of instruction. Ability and fitness for the work are required (<a onClick="return mV(\'Rom\',2,20);">Ro 2:20</a>; <a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>). The title refers to Jewish teachers (<a onClick="return mV(\'Jhn\',1,38);">Joh 1:38</a>), to John the Baptist (<a onClick="return mV(\'Luk\',3,12);">Lu 3:12</a>), to Jesus (<a onClick="return mV(\'Jhn\',3,2);">Joh 3:2</a>; <a onClick="return mV(\'Jhn\',8,4);">8:4</a>, and often), to Paul (<a onClick="return mV(\'1Ti\',2,7);">1Ti 2:7</a>; <a onClick="return mV(\'2Ti\',1,11);">2Ti 1:11</a>), and to instructors in the early church (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>; <a onClick="return mV(\'Rom\',12,7);">Ro 12:7</a>; <a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>). Teaching, like preaching, was an integral part of the work of an apostle (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>; <a onClick="return mV(\'Mar\',16,15);">Mr 16:15</a>; <a onClick="return mV(\'Eph\',4,1);">Eph 4:1</a>).<P>2. Acquisition:<P>manthano, "to learn": The central thought of teaching is causing one to learn. Teaching and learning are not scholastic but dynamic, and imply personal relationship and activity in the acquisition of knowledge (<a onClick="return mV(\'Mat\',11,29);">Mt 11:29</a>; <a onClick="return mV(\'Mat\',28,19);">28:19</a>; <a onClick="return mV(\'Act\',14,21);">Ac 14:21</a>). There were three concentric circles of disciples in the time of our Lord: learners, pupils, superficial followers, the multitude (<a onClick="return mV(\'Jhn\',6,66);">Joh 6:66</a>); the body of believers who accepted Jesus as their Master (<a onClick="return mV(\'Mat\',10,42);">Mt 10:42</a>); and the Twelve Disciples whom Jesus also called apostles (<a onClick="return mV(\'Mat\',10,2);">Mt 10:2</a>).<P>3. Presentation:<P>paratithemi, "to place beside": The presentative idea involved in the teaching process is intimately associated with the principle of adaptation. When it is stated that Christ put forth parables unto the people, the sacred writer employs the figure of placing alongside of, or near one, hence, before him in an accessible position. The food or teaching should be sound, or hygienic, and adapted to the capacity and development of the recipient (<a onClick="return mV(\'Mat\',13,24);">Mt 13:24</a>; <a onClick="return mV(\'Mar\',8,6);">Mr 8:6</a>; <a onClick="return mV(\'Act\',16,34);">Ac 16:34</a>; <a onClick="return mV(\'1Cr\',10,27);">1Co 10:27</a>; <a onClick="return mV(\'2Ti\',4,3);">2Ti 4:3</a>; <a onClick="return mV(\'Hbr\',5,\'12-14\');">Heb 5:12-14</a>).<P>4. Elucidation:<P>diermeneuo, "to interpret": In the walk to Emmaus, Christ explained to the perplexed disciples the Old Testament Scriptures in reference to Himself. The work of interpreter is to make truth clear and to effect the edification of the hearer (<a onClick="return mV(\'Luk\',24,27);">Lu 24:27</a>; <a onClick="return mV(\'1Cr\',12,30);">1Co 12:30</a>; <a onClick="return mV(\'1Cr\',14,5,13,17);">14:5,13,17</a>).<P>5. Exposition:<P>ektithemi, "to place out": The verb literally means "to set or place out," and signifies to bring out the latent and secret ideas of a literary passage or a system of thought and life. Thus Peter interpreted his vision, Aquila and Priscilla unfolded truth to Apollos, and Paul expounded the gospel in Rome (<a onClick="return mV(\'Act\',11,4);">Ac 11:4</a>; <a onClick="return mV(\'Act\',18,26);">18:26</a>; <a onClick="return mV(\'Act\',28,23);">28:23</a>). True teaching is an educational exposition.<P>6. Authority:<P>prophetes, "one who speaks for": A prophet was a man who spoke forth a message from God to the people. He might deal with past failures and achievements, present privileges and responsibilities, or future doom and glory. He received his message and authority from God (<a onClick="return mV(\'Deu\',18,\'15-22\');">De 18:15-22</a>; <a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>). The word refers to Old Testament teachers (<a onClick="return mV(\'Mat\',5,12);">Mt 5:12</a>), to John the Baptist (<a onClick="return mV(\'Mat\',21,26);">Mt 21:26</a>), to Jesus the Messiah (<a onClick="return mV(\'Act\',3,25);">Ac 3:25</a>), and to special speakers in the Apostolic age (<a onClick="return mV(\'Mat\',10,41);">Mt 10:41</a>; <a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>; <a onClick="return mV(\'1Cr\',14,29,37);">1Co 14:29,37</a>).<P>7. Care:<P>poimen, "a shepherd": The word for shepherd signifies one who tends a flock, and by analogy a person who gives mental and spiritual nourishment, and guards and supports those under his care (<a onClick="return mV(\'Mat\',9,36);">Mt 9:36</a>; <a onClick="return mV(\'Jhn\',10,2,16);">Joh 10:2,16</a>; <a onClick="return mV(\'1Pe\',2,25);">1Pe 2:25</a>; <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>). Love is a fundamental prerequisite to the exercise of the shepherding function (<a onClick="return mV(\'Jhn\',21,\'15-18\');">Joh 21:15-18</a>). The duties are to be discharged with great diligence and in humble recognition of the gifts and appointment of the Holy Spirit (<a onClick="return mV(\'Act\',20,28);">Ac 20:28</a>).<P>8. Supervision:<P>episkopos, "an overseer": The bishop or overseer was to feed and protect the blood-bought church of God (<a onClick="return mV(\'Act\',20,28);">Ac 20:28</a>). Among the various qualifications of the religious overseers was an aptitude for teaching (<a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>; <a onClick="return mV(\'Tts\',1,9);">Tit 1:9</a>). The Lord is pre-eminently shepherd and bishop (<a onClick="return mV(\'1Pe\',2,25);">1Pe 2:25</a>).<P>III. Old Testament History.<P>1. In the Home:<P>In the Jewish home the teaching of the law of the Lord was primarily incumbent upon the parents. The teaching was to be diligent, the conversation religious, and the atmosphere wholesome (<a onClick="return mV(\'Deu\',6,\'7-9\');">De 6:7-9</a>).<P>2. In Public:<P>Provision was also made for public instruction the law of God (<a onClick="return mV(\'Deu\',31,12,13);">De 31:12,13</a>). This is a compact summary of early Hebrew teaching in regard to the extent of patronage, the substance of instruction, and the purpose of the process. Samuel the judge and prophet recognized that his duty was fundamentally to pray, to God for his people and to teach the nation "the good and the right way" (<a onClick="return mV(\'1Sa\',12,23);">1Sa 12:23</a>). The glory and prosperity of Judah under Jehoshaphat were due in large measure to the emphasis he laid upon religious instruction as the basis of national character and stability. His peripatetic Bible school faculty consisted of five princes, nine Levites and two priests who effected a moral and religious transformation, for "they taught in Judah, having the book of the law of Yahweh with them" (<a onClick="return mV(\'2Ch\',17,\'7-9\');">2Ch 17:7-9</a>). The most striking illustration we have of public religious instruction in the Old Testament is found in <a onClick="return mV(\'Neh\',8,\'1-\');">Ne 8</a>. Ezra the priest and scribe was superintendent, and had an ample corps of teachers to instruct the multitude of men, women and children eager to hear. Prayer created a devotional atmosphere. The reading was distinct, the interpretation correct and intelligible. There was real teaching because the people were made to understand and obey the law. In <a onClick="return mV(\'Neh\',9,\'1-\');">Ne 9</a> and <a onClick="return mV(\'Neh\',10,\'1-\');">10</A> we have recorded the spiritual, ceremonial, social and civic effects of ancient religious instruction.<P>IV. Extra-Biblical Teaching.<P>The captivity gave mighty impulse to teaching. In far-away Babylon the Jews, deprived of the privilege and inspiration of the temple, established the synagogue as an institutional center of worship and instruction. During the latter part of the inter-Biblical period, religious teaching was carried on in the synagogue and attendance was compulsory, education in the Law being considered the fundmental element of national security (Deutsch, Literary Remains, 23; Edersheim, Life and Times of Jesus the Messiah, I, 230). The Bible text alone was taught those from 5 to 10 years of age, the first lessons being taken from Leviticus (Taylor, Sayings of the Jewish Fathers, 111). From 10 to 15 years of age the pupil was taught the substance of the Mishna or unwritten tradition, and accorded the privilege of entering into the discussions of the Mishna which constitute the Gemara (Edersheim, op. cit., I, 232). Selections of Scriptures like the shema (<a onClick="return mV(\'Deu\',6,\'4-9\');">De 6:4-9</a>) were made for study, and lesson helps were adapted to the capacity of the pupils (Ginsburg, article "Education" in Cyclopedia of Biblical Literature). The significance of the teaching idea among the Jews is indicated by numerous expressions for school (article "Education," Cyclopedia of Biblical Literature) and the prevalence of the synagogues, there being perhaps 480 in Jerusalem in the time of Christ (Hor. Heb. I, 78). The pupil was not expected to be a passive hearer but an active participant (Ab., vi.6; Taylor, Sayings of the Jewish Fathers, 115f). Great emphasis was laid upon audible repetition and exact memory, yet the teacher was culpable if the pupil failed to understand the prescribed lesson (Hamburger, RE, II, 672, 674). The pupil was regarded as the child of his teacher (Sanhedhrin 19), which is a familiar idea in the New Testament. The faithful teacher was considered destined to occupy a high seat among the ancients (<a onClick="return mV(\'Dan\',12,3);">Da 12:3</a>). The scribes were secretaries or copyists of the sacred Law, and would thus acquire at least an accurate verbal knowledge of its contents. Quite naturally they would become religious teachers (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>). Hence, also their prominence in the New Testament.<P>LITERATURE.<P>Article "Torah," Jewish Encyclopedia (compare the articles "Talmud”and "Education"); Trumbull, Yale Lectures on the Sunday-School, 3-40; Hamburger. See Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche.<P>V. New Testament History.<P>1. Christ\'s Life:<P>In the New Testament we find that Jesus is pre-eminently the teacher, though He was also preacher and healer (<a onClick="return mV(\'Mat\',4,23);">Mt 4:23</a>). His Sermon on the Mount was matchless teaching. He opened His mouth and "taught" (<a onClick="return mV(\'Mat\',5,2);">Mt 5:2</a>). The titles "teacher," "master," "rabbi" all indicate the most prominent function of His active ministry. Even at the age of 12 years He revealed His wisdom and affinity in the midst of the rabbis or Jewish teachers of the Law in the temple (<a onClick="return mV(\'Luk\',2,41);">Lu 2:41</a>f). In the power of the Spirit He taught so that all recognized His authority (<a onClick="return mV(\'Luk\',4,14,15);">Lu 4:14,15</a>; <a onClick="return mV(\'Mat\',7,29);">Mt 7:29</a>). He explained to the disciples in private what He taught the people in public (<a onClick="return mV(\'Mat\',13,36);">Mt 13:36</a>). His principles and methods of teaching constitute the standard by which all true pedagogy is measured, and the ideal toward which all subsequent teachers have toiled with only partial success (<a onClick="return mV(\'Mat\',7,28,29);">Mt 7:28,29</a>; <a onClick="return mV(\'Jhn\',1,49);">Joh 1:49</a>; <a onClick="return mV(\'Jhn\',3,2);">3:2</a>; <a onClick="return mV(\'Jhn\',6,46);">6:46</a>). In the Commission as recorded in <a onClick="return mV(\'Mat\',28,18,19,20);">Mt 28:18,19,20</a> we have the work of Christianity presented in educational terms. We find the supreme authority (<a onClick="return mV(\'Mat\',28,18);">28:18</a>), the comprehensive content—the evangelistic, the ceremonial, the educational, the practical (28:19 and 20a), and the inspiring promise (<a onClick="return mV(\'Mat\',28,20);">28:20b</A>).<P>2. Apostolic Labors:<P>The emphasis laid upon teaching in the Apostolic age is a natural consequence of the need of the people and the commands of Jesus. The practice of the apostles is quite uniform. They preached or proclaimed, but they also expounded. In Jerusalem the converts continued in the apostles\' teaching (<a onClick="return mV(\'Act\',2,42);">Ac 2:42</a>); and daily in the temple and in the homes of the people the teaching was correlated with preaching (<a onClick="return mV(\'Act\',5,42);">Ac 5:42</a>). In Antioch, the center of foreign missionary operations, Paul, Silas, Barnabas and many others taught the word of the Lord (<a onClick="return mV(\'Act\',15,35);">Ac 15:35</a>). In Thessalonica, Paul and Silas for three weeks reasoned with the people out of the Scriptures, opening up the sacred secrets and proving to all candid minds that Jesus was the Messiah (<a onClick="return mV(\'Act\',17,\'1-3\');">Ac 17:1-3</a>). In Berea, instruction in the synagogue was followed by private study, and as a result many believed in the Lord (<a onClick="return mV(\'Act\',17,\'10-15\');">Ac 17:10-15</a>). In Athens, Paul discussed and explained the things of the kingdom of God, both in the synagogue 3 times a week and in the market daily (<a onClick="return mV(\'Act\',17,16);">Ac 17:16</a>f). In Corinth, Paul having been denied the use of the synagogue taught the word of the Lord for a year and a half in the house of Justus, and thus laid the foundation for a great church (<a onClick="return mV(\'Act\',18,\'1-11\');">Ac 18:1-11</a>). In Ephesus, Paul taught for 2 years in the school of Tyrannus, disputing and persuading the people concerning the kingdom of God (<a onClick="return mV(\'Act\',19,\'8-10\');">Ac 19:8-10</a>). In Rome, Paul expounded the word, testified to its truth, and persuaded men to accept the gospel (<a onClick="return mV(\'Act\',28,23);">Ac 28:23</a>). His method of work in Rome under trying limitations is described as cordially receiving the people and preaching the kingdom of God, and "teaching the things concerning the Lord Jesus Christ" (<a onClick="return mV(\'Act\',28,30,31);">Ac 28:30,31</a>).<P>3. General Considerations:<P>The office of teacher is fundamentally related to the creation of a missionary atmosphere (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>). Religious teaching is necessary to the development of Christian character and the highest efficiency in service (<a onClick="return mV(\'1Cr\',12,\'4-11\',28,29);">1Co 12:4-11,28,29</a>; <a onClick="return mV(\'Eph\',4,11,12);">Eph 4:11,12</a>). The qualification of the pastor is vitally connected with the teaching function of the church. He is to hold the truth, or to be orthodox (<a onClick="return mV(\'Tts\',1,9);">Tit 1:9</a>), to apply the truth, or to be practical (<a onClick="return mV(\'Tts\',1,9);">Tit 1:9</a>), to study the truth, or to be informed (<a onClick="return mV(\'1Ti\',4,13,15);">1Ti 4:13,15</a>), to teach the truth, or to be equipped or able and tactful (<a onClick="return mV(\'2Ti\',2,2);">2Ti 2:2</a>; <a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>), to live the truth, or to be faithful in all things (<a onClick="return mV(\'2Ti\',2,2);">2Ti 2:2</a>; <a onClick="return mV(\'1Ti\',4,16);">1Ti 4:16</a>). The teaching function of Christianity in the 2nd century became strictly official, thereby losing much of its elasticity. A popular manual for the guidance of religious teachers was styled the "Teaching of the Twelve" \'(see <a href="./study/isbe/search.html?string=DIDACHE">DIDACHE</A>). The writings of the Apostolic Fathers give valuable information in regard to the exercise of the gifts of teaching in the early centuries (Didache xiii.2; xv. 1, 2; Barnabas 18; Ignatius to the Ephesians 31).`<a href="./study/isbe/search.html?string=CATECHIST">CATECHIST</a>; <a href="./study/isbe/search.html?string=EDUCATION">EDUCATION</a>; <a href="./study/isbe/search.html?string=SPIRITUAL+GIFTS">SPIRITUAL GIFTS</a>`38';
isbe[8639]='Tear Bottle``<a href="./study/isbe/search.html?string=TEARS">TEARS</a>`1';
isbe[8640]='Tears`terz (dim\'ah; dakrua): In the instances recorded in Scripture weeping is more frequently associated with mental distress than with physical pain. Eastern peoples show none of the restraint of emotion in lamentation which is characteristic of modern Occidentals, and there are many records of this manifestation of woe, even among men accustomed to hardships and warfare, such as David and his soldiers. The flow of tears is the evidence of sorrow in prospect of approaching death in <a onClick="return mV(\'Psa\',39,12);">Ps 39:12</a>; <a onClick="return mV(\'2Ki\',20,5);">2Ki 20:5</a>; <a onClick="return mV(\'Isa\',38,5);">Isa 38:5</a>, and of the suffering consequent on oppression (<a onClick="return mV(\'Ecc\',4,1);">Ec 4:1</a>), or defeat in battle (<a onClick="return mV(\'Isa\',16,9);">Isa 16:9</a>), or hopeless remorse, as with Esau (<a onClick="return mV(\'Hbr\',12,17);">Heb 12:17</a>, probably referring to <a onClick="return mV(\'Gen\',27,34);">Ge 27:34</a>). The Psalmist describes his condition of distress metaphorically as feeding on the bread of tears and having tears to drink (<a onClick="return mV(\'Psa\',80,5);">Ps 80:5</a>; <a onClick="return mV(\'Psa\',42,3);">42:3</a>). Tears in the figurative sense of anxiety for the future are referred to in <a onClick="return mV(\'Psa\',126,5);">Ps 126:5</a>; <a onClick="return mV(\'Mar\',9,24);">Mr 9:24</a> the King James Version, and the tears accompanying penitence in <a onClick="return mV(\'Luk\',7,38);">Lu 7:38 (44 the Revised Version margin)</a>. Jeremiah is sometimes called the "weeping prophet" on account of his expressive hyperbole in <a onClick="return mV(\'Jer\',9,1,18);">Jer 9:1,18</a> (see also <a onClick="return mV(\'Jer\',14,7);">14:7</A>; <a onClick="return mV(\'Jer\',31,16);">31:16</A>; <a onClick="return mV(\'Lam\',1,2);">La 1:2</a>; <a onClick="return mV(\'Lam\',2,11,18);">2:11,18</a> and ten other passages). Conversely the deliverance from grief or anxiety is described as the wiping away of tears (<a onClick="return mV(\'Psa\',116,8);">Ps 116:8</a>; <a onClick="return mV(\'Isa\',25,8);">Isa 25:8</a>; <a onClick="return mV(\'Rev\',7,17);">Re 7:17</a>; <a onClick="return mV(\'Rev\',21,4);">21:4</a>).<P>The expression in <a onClick="return mV(\'Psa\',56,8);">Ps 56:8</a> in which the Psalmist desires that God should remember his wanderings and his tears has given rise to a curious mistake. There is a paronomasia in the passage as he pleads that God should record his wanderings (Hebrew, nodh) and that his tears should be put into God\'s no\'-dh (receptacle or bottle). No\'dh literally means a leathern or skin bottle, as is evident from <a onClick="return mV(\'Psa\',119,83);">Ps 119:83</a> and <a onClick="return mV(\'Jos\',9,\'4-13\');">Jos 9:4-13</a>. The request is obviously figurative, as there is no evidence that there was even a symbolical collection of tears into a bottle in any Semitic funeral ritual, and there is no foundation whatever for the modern identification of the long, narrow perfume jars so frequently found in late Jewish and Greek-Jewish graves, as "lachrymatories" or tear bottles.`<a href="./study/isbe/search.html?string=BOTTLE">BOTTLE</a>`107';
isbe[8641]='Teat`tet (shadh (<a onClick="return mV(\'Isa\',32,12);">Isa 32:12</a>), dadh (<a onClick="return mV(\'Eze\',23,3,11);">Eze 23:3,11</a>)): In all these passages the Revised Version (British and American) has replaced the word by "breast" or "bosom," both of which occasionally stand in poetical parallelism. The above passages in Ezekiel are to be understood figuratively of the inclination of Israel to connive at, and take part in, the idolatry of their neighbors. To "smite upon the breasts" (<a onClick="return mV(\'Isa\',32,12);">Isa 32:12</a>, where the King James Version translates wrongly "lament for the teats") means "to mourn and grieve in the ostentatious way of oriental women."`<a href="./study/isbe/search.html?string=PAP">PAP</a>`1';
isbe[8642]='Tebah`te\'-ba (tebhach): A son of Nahor, the brother of Abraham (<a onClick="return mV(\'Gen\',22,24);">Ge 22:24</a>).``1';
isbe[8643]='Tebaliah`teb-a-li\'-a, te-bal\'-ya (Tebhalyahu, "Yahweh hath dipped," i.e. "purified"; Codex Vaticanus Tablai; Codex Alexandrinus Tabelias; Lucian, Tabeel): A Merarite gatekeeper. (<a onClick="return mV(\'1Ch\',26,11);">1Ch 26:11</a>). The name should perhaps read Tobhiyahu, "Yahweh is good" (possibly from t-w-b-y-h-w misread Tebhalyahu).`<a href="./study/isbe/search.html?string=TOBIJAH">TOBIJAH</a>`1';
isbe[8644]='Tebeth`te-beth\', te\'-beth (tebheth): The tenth month of the Jewish year, corresponding to January (<a onClick="return mV(\'Est\',2,16);">Es 2:16</a>).`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>`1';
isbe[8645]='Tehaphnehes`te-haf\'-ne-hez`<a href="./study/isbe/search.html?string=TAHPANHES">TAHPANHES</a>`1';
isbe[8646]='Tehinnah`te-hin\'-a (techinnah, "supplication"; Codex Vaticanus Thaiman; Codex Alexandrinus Thana; Lucian, Theenna): "The father of the city Nahash" (<a onClick="return mV(\'1Ch\',4,12);">1Ch 4:12</a>). The verse seems to refer to some post-exilic Jewish settlement, but is utterly obscure.``1';

isbe[8648]='Tekel`te\'-kel (teqel).`<a href="./study/isbe/search.html?string=MENE,+MENE,+TEKEL,+UPHARSIN">MENE, MENE, TEKEL, UPHARSIN</a>`1';
isbe[8649]='Tekoa`te-ko\'-a (teqoa\', or teqo\'ah; Thekoe; the King James Version Tekoah; one of David\'s mighty men, "Ira the son of Ikkesh," is called a Tekoite, te-ko\'-it (teqo\'i; <a onClick="return mV(\'2Sa\',23,26);">2Sa 23:26</a>; <a onClick="return mV(\'1Ch\',11,28);">1Ch 11:28</a>; <a onClick="return mV(\'1Ch\',27,9);">27:9</a>; the "woman of Tekoa" [<a onClick="return mV(\'2Sa\',14,2);">2Sa 14:2</a>] is in Hebrew teqo\'ith; in <a onClick="return mV(\'Neh\',3,5);">Ne 3:5</a> mention is made of certain Tekoites, te-ko\'its teqo\'im, who repaired part of the walls of Jerusalem):<P>1. Scripture References:<P>From here came the "wise woman" brought by Joab to try and make a reconciliation between David and Absalom (<a onClick="return mV(\'2Sa\',14,2);">2Sa 14:2</a>f); it was one of the cities fortified by Rehoboam (<a onClick="return mV(\'2Ch\',11,6);">2Ch 11:6</a>; Josephus, Ant, VIII, ix, 1). The wilderness of Tekoa is mentioned (<a onClick="return mV(\'2Ch\',20,20);">2Ch 20:20</a>) as the extreme edge of the inhabited area; here Jehoshaphat took counsel before advancing into the wilderness of Judea to confront the Ammonites and Moabites. In <a onClick="return mV(\'Jer\',6,1);">Jer 6:1</a>, we read, "Blow the trumpet in Tekoa and raise a signal in Beth-haccherim"—because of the enemy advancing from the north. <a onClick="return mV(\'Amo\',1,1);">Amos 1:1</a>, one of the "herdsmen of Tekoa," was born here.<P>In <a onClick="return mV(\'Jos\',15,59);">Jos 15:59</a> (addition to verse in Septuagint only) Tekoa occurs at the beginning of the list of 11 additional cities of Judah—a list which includes Bethlehem, Ain Kairem and Bettir—which are omitted in the Hebrew. A Tekoa is mentioned as a son of Ashhur (<a onClick="return mV(\'1Ch\',2,24);">1Ch 2:24</a>; <a onClick="return mV(\'1Ch\',4,5);">4:5</a>).<P>Jonathan Maccabeus and his brother Simon fled from the vengeance of Bacchides "into the wilderness of Thecoe (the Revised Version (British and American) "Tekoah") and pitched their tents (the Revised Version (British and American) "encamped") by the water of the pool Asphar" (1Macc 9:33).<P>2. Later History:<P>Josephus calls Tekoa a village in his day (Vita, 75), as does Jerome who describes it as 12 miles from Jerusalem and visible from Bethlehem; he says the tomb of the prophet Amos was there (Commentary on Jeremiah, VI, 1). "There was," he says, "no village beyond Tekoa in the direction of the wilderness." The good quality of its oil and honey is praised by other writers. In the 6th century a monastery, Laura Nova, was founded there by Saba. In the crusading times Tekoa was visited by pious pilgrims wishing to see the tomb of Amos, and some of the Christian inhabitants assisted the Crusaders in the first siege of Jerusalem. In 1138 the place was pillaged by a party of Turks from the east of the Jordan, and since that time the site appears to have lain desolate and ruined, although even in the 14th century the tomb of Amos was still shown.<P>3. The Site of Tequ\'a:<P>The site is without doubt the Khirbet Tequ\'a, a very extensive ruin, covering 4 or 5 acres, about 6 miles south of Bethlehem and 10 miles from Jerusalem, near the Frank Mountain and on the road to \'Ain Jidy. The remains on the surface are chiefly of large cut stone and are all, apparently, medieval. Fragments of pillars and bases of good hard limestone occur on the top of the hill, and there is an octagonal font of rose-red limestone; it is clear that the church once stood there. There are many tombs and cisterns in the neighborhood of a much earlier period. A spring is said to exist somewhere on the site, but if so it is buried out of sight. There is a reference in the "Life of Saladin" (Bahaoddenus), to the "river of Tekoa," from which Richard Coeur de Lion and his army drank, 3 miles from Jerusalem: this may refer to the Arab extension of the "low-level aqueduct" which passes through a long tunnel under the Sahl Tequ\'a and may have been thought by some to rise there.<P>The open fields around Teqa\'a are attractive and well suited for olive trees (which have now disappeared), and there are extensive grazing-lands. The neighborhood, even the "wilderness" to the east, is full of the flocks of wandering Bedouin. From the site, Bethlehem, the Mount of Olives and Nebi Samuel (Mizpah) are all visible; to the northeast is a peep of the Jordan valley near Jericho and of the mountains of Gilead, but most of the eastern outlook is cut off by rising ground (PEF, III,314,368, Sh XXI).``117';
isbe[8650]='Tel-Abib`tel-a\'-bib (tel \'abhibh; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) ad acervum novarum frugum):<P>1. The Name and Its Meaining:<P>As written in Hebrew, Tel-abib means "hill of barley-ears" and is mentioned in <a onClick="return mV(\'Eze\',3,15);">Eze 3:15</a> as the place to which the prophet went, and where he found Jewish captives "that dwelt by the river Chebar." That Tel-abib is written, as Fried. Delitzsch suggests, for Til Ababi, "Mound of the Flood" (which may have been a not uncommon village-name in Babylonia) is uncertain. Moreover, if the captives themselves were the authors of the name, it is more likely to have been in the Hebrew language. Septuagint, which has meteoros, "passing on high," referring to the manner in which the prophet reached Tel-abib, must have had a different Hebrew reading.<P>2. The Position of the Settlement:<P>If the Chebar be the nar Kabari, as suggested by Hilprecht, Tel-abib must have been situated somewhere in the neighborhood of Niffer, the city identified with the Calneh of <a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>. The tablet mentioning the river Kabaru refers to grain (barley?) seemingly sent by boat from Niffer in Nisan of the 21st year of Artaxerxes I. Being a navigable waterway, this was probably a good trading-center.<P>LITERATURE.<P>See Hilprecht and Clay, Business Documents of Murasha Sons ("Pennsylvania Exp.," Vol IX, 28); Clay, Light on the Old Testament from Babel, 405.``136';
isbe[8651]='Tel-Harsha`tel-har\'-sha (tel-charsha\'): In <a onClick="return mV(\'Ezr\',2,59);">Ezr 2:59</a>; <a onClick="return mV(\'Neh\',7,61);">Ne 7:61</a> (the King James Version in latter, "\'Telharesha," tel-ha-re\'sha, -har\'e-sha), a Babylonian town or village from which Jews who could not show their lineage returned with Zerubbabel. The site is unknown. In 1Esdras 5:36 it is called "Thelersas."``1';
isbe[8652]='Tel-Melah`tel-me\'-la (tel-melah, "hill of salt"): A Babylonian town mentioned in <a onClick="return mV(\'Ezr\',2,59);">Ezr 2:59</a>; <a onClick="return mV(\'Neh\',7,61);">Ne 7:61</a> with Tel-harsha and Cherub (see <a href="./study/isbe/search.html?string=TEL-HARSHA">TEL-HARSHA</a>). It possibly lay on the low salt tract near the Persian Gulf. In 1Esdras 5:36 it is called "Thermeleth."``1';
isbe[8653]='Telah`te\'-la (telah; Codex Vaticanus Thalees, Codex Alexandrinus Thale; Lucian, Thala): An Ephraimite (<a onClick="return mV(\'1Ch\',7,25);">1Ch 7:25</a>).``1';
isbe[8654]='Telaim`te-la\'-im (ha-tela\'-im "the young lambs"; en Galgalois): The place where Saul "summoned the people, and numbered them" (<a onClick="return mV(\'1Sa\',15,4);">1Sa 15:4</a>) before his attack on Agag, king of the Amalekites. Some authorities read "Telam" for "Havilah" in verse 7 and also find this name in <a onClick="return mV(\'1Sa\',27,8);">1Sa 27:8</a> instead of me\'olam. In Septuagint and Josephus (Ant., VI, vii, 2) Gilgal occurs instead of Telaim, on what ground is not known. Probably Telaim is identical with <a href="./study/isbe/search.html?string=TELEM">TELEM</A> (which see), though the former may have been the name of a Bedouin tribe inhabiting the latter district. Compare Dhallam Arabs now found south of Tell el-Milch.``117';
isbe[8655]='Telassar`te-las\'-ar (tela\'-ssar (<a onClick="return mV(\'2Ki\',19,12);">2Ki 19:12</a>), telassar (<a onClick="return mV(\'Isa\',37,12);">Isa 37:12</a>); Codex Alexandrinus Thalassar; Codex Vaticanus Thaesthen; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Thelassar, Thalassar):<P>1. The Name and Its Meaning:<P>This city, which is referred to by Sennacherib\'s messengers to Hezekiah, is stated by them to have been inhabited by the "children of Eden." It had been captured by the Assyrian king\'s forefathers, from whose hands its gods had been unable to save it. Notwithstanding the vocalization, the name is generally rendered "Hill of Asshur," the chief god of the Assyrians, but "Hill of Assar," or Asari (a name of the Babylonian Merodach), would probably be better.<P>2. Suggestions as to the Geographical Position:<P>As Telassar was inhabited by the "children of Eden," and is mentioned with Gozan, Haran, and Rezeph, in Western Mesopotamia, it has been suggested that it lay in Bit Adini, "the House of Adinu," or Betheden, in the same direction, between the Euphrates and the Belikh. A place named Til-Assuri, however, is twice mentioned by Tiglath-pileser IV (Ann., 176; Slab-Inscr., II, 23), and from these passages it would seem to have lain near enough to the Assyrian border to be annexed. The king states that he made there holy sacrifices to Merodach, whose seat it was. It was inhabited by Babylonians (whose home was the Edinu or "plain"; see <a href="./study/isbe/search.html?string=EDEN">EDEN</a>). Esarhaddon, Sennacherib\'s son, who likewise conquered the place, writes the name Til-Asurri, and states that the people of Mihranu called it Pitanu. Its inhabitants, he says, were people of Barnaku. If this be Bit Burnaki in Elam, extending from the boundary of Rasu (see <a href="./study/isbe/search.html?string=ROSH">ROSH</A>), which was ravaged by Sennacherib (Babylonians Chronicles, III, 10ff), Til-Assuri probably lay near the western border of Elam. Should this identification be the true one, the Hebrew form telassar would seem to be more correct than the Assyrian Til-Assuri (-Asurri), which latter may have been due to the popular idea that the second element was the name of the national god Assur. See French Delitzsch, Wo lag das Paradies? 264.``136';
isbe[8656]='Telem (1)`te\'-lem (Telem; Telem): A city in the Negeb "toward the border of Edom," belonging to Judah (<a onClick="return mV(\'Jos\',15,24);">Jos 15:24</a>). In Septuagint of <a onClick="return mV(\'2Sa\',3,12);">2Sa 3:12</a> Abner is said to send messengers to David at Thelam (Thailam); this would seem to be the same place and also to be identical with the Telaim and Telam of Saul (see <a href="./study/isbe/search.html?string=TELAIM">TELAIM</A>). It is probably the same as the Talmia of the Talmud (Neubauer, Geog. du Talmud, 121). The site has not been recovered.``1';
isbe[8657]='Telem (2)`(Telem; Septuagint Codex Vaticanus Telem; Codex Alexandrinus Tellem): One of three "porters" who had married foreign wives (<a onClick="return mV(\'Ezr\',10,24);">Ezr 10:24</a>), his name appearing as "Tolbanes" in 1Esdras 9:25; perhaps the same as <a href="./study/isbe/search.html?string=TALMON">TALMON</a> (which see).``1';

isbe[8659]='Tell El-Amarna; Tablets`tel-el-a-mar\'-na,<P><b>I. INTRODUCTION</b><P class="in15">1. Name<P class="in15">2. Discovery<P class="in15">3. Physical Character<P><b>II. EPIGRAPHICAL VALUE</b><P class="in15">1. Peculiar Cuneiform Script<P class="in15">2. Method of Writing Proper Names<P><b>III. PHILOLOGICAL VALUE</b><P class="in15">1. Knowledge of Amorite, Hittite and Mitannian Tongues<P class="in15">2. Persistence of Canaanite Names to the Present Time<P class="in15">3. Verification of Biblical Statements concerning "the Language of Canaan"<P><b>IV. GEOGRAPHICAL VALUE</b><P class="in15">1. Political and Ethnological Lines and Locations<P class="in15">2. Verification of Biblical and Egyptian Geographical Notices<P class="in15">3. Confirmation of General Evidential Value of Ancient Geographical Notes of Bible Lands<P><b>V. HISTORICAL VALUE</b><P class="in15">1. Revolutionary Change of Opinion concerning Canaanite Civilization in Patriarchal Times<P class="in15">2. Anomalous Historical Situation Revealed by Use of Cuneiform Script<P class="in15">3. Extensive Diplomatic Correspondence of the Age<P class="in15">4. Unsolved Problem of the Habiri<P><b>LITERATURE</b><hr /><P>A collection of about 350 inscribed clay tablets from Egypt, but written in the cuneiform writing, being part of the royal archives of Amenophis III and Amenophis IV; kings of the XVIIIth Egyptian Dynasty about 1480 to 1460 BC. Some of the tablets are broken and there is a little uncertainty concerning the exact number of separate letters. 81 are in the British Museum = BM; 160 in the New Babylonian and Assyrian Museum, Berlin= B; 60 in the Cairo Museum = C; 20 at Oxford = O; the remainder, 20 or more, are in other museums or in private collections.<P>I. Introduction.<P>1. Name:<P>The name, Tell el-Armarna, "the hill Amarna," is the modern name of ancient ruins about midway between Memphis and Luxor in Egypt. The ruins mark the site of the ancient city Khut Aten, which Amenophis IV built in order to escape the predominant influence of the old religion of Egypt represented by the priesthood at Thebes, and to establish a new cult, the worship of Aten, the sun\'s disk.<P>2. Discovery:<P>In 1887 a peasant woman, digging in the ruins of Tell el-Amarna for the dust of ancient buildings with which to fertilize her garden, found tablets, a portion of the royal archives. She filled her basket with tablets and went home. How many she had already pulverized and grown into leeks and cucumbers and melons will never be known. This time someone\'s curiosity was aroused, and a native dealer secured the tablets. Knowledge of the "find" reached Chauncey Murch, D.D., an American missionary stationed at Luxor, who, suspecting the importance of the tablets, called the attention of cuneiform scholars to them. Then began a short but intense and bitter contest between representatives of various museums on the one hand, eager for scientific material, and native dealers, on the other hand, rapacious at the prospect of the fabulous price the curious tablets might bring. The contest resulted in the destruction of some of the tablets by ignorant natives and the final distribution of the remainder and of the broken fragments, as noted at the beginning of this article. (see also Budge, History of Egypt, IV, 186). After the discovery of the tablets the site of the ancient city was excavated by Professor Petrie in 1891-92 (Tell el-Amarna; compare also Baedeker, Egypt).<P>3. Physical Character:<P>The physical character of the tablets is worthy of some notice. They are clay tablets. Nearly all are brick tablets, i.e. rectangular, flat tablets varying in size from 2 X 2 1/2 in. to 3 1//2 X 9 inches, inscribed on both sides and sometimes upon the edges. One tablet is of a convex form (B 1601). The clay used in the tablets also varies much. The tablets of the royal correspondence from Babylonia and one tablet from Mitanni (B 153) are of fine Babylonian clay. The Syrian and Palestinian correspondence is in one or two instances of clay which was probably imported from Babylonia for correspondence, but for the most part these tablets are upon the clay of the country and they show decided differences among themselves in color and texture: in some instances the clay is sandy and decidedly inferior. A number of tablets have red points, a kind of punctuation for marking the separation into words, probably inserted by the Egyptian translator of the letters at the court of the Pharaoh. These points were for the purpose of assisting in the reading. They do now assist the reading very much. Some tablets also show the hieroglyphic marks which the Egyptian scribe put on them when filing them among the archives. The writing also is varied. Some of the tablets from Palestine (B 328, 330, 331) are crudely written. Others of the letters, as in the royal correspondence from Babylonia, are beautifully written. These latter (B 149-52) seem to have been written in a totally different way from the others; those from Western Asia appear to have been written with the stylus held as we commonly hold a pen, but the royal letters from Babylonia were written by turning the point of the stylus to the left and the other end to the right over the second joint of the first finger.<P>The results of the discovery of the Tell el-Amarna Letters have been far-reaching, and there are indications of still other benefits which may yet accrue from them. The discovery of them shares with the discovery of the Code of Hammurabi the distinction of the first place among Biblical discoveries of the past half-century.<P>II. Epigraphical Value<P>1.Peculiar Cuneiform Script:<P>The peculiar use of the cuneiform method of writing in these tablets in order to adapt it to the requirements of a strange land having a native tongue, and the demands made upon it for the representation of proper names of a foreign tongue, have already furnished the basis for the opinion that the same cuneiform method of writing was employed originally in other documents, especially some portions of the Bible and much material for Egyptian governmental reports. It is not improbable that by means of such data furnished by the tablets definite clues may be obtained to the method of writing, and by that also approximately the time of the composition, of the literary sources that were drawn upon in the composition of the Pentateuch, and even of the Pentateuch itself (compare especially Naville, Archaeology of the Bible).<P>2. Method of Writing Proper Names:<P>Most of the letters were probably written by Egyptian officers or, more frequently, by scribes in the employ of native appointees of the Egyptian government. The writing of so many proper names by these scribes in the cuneiform script has thrown a flood of light upon the spelling of Canaanite names by Egyptian scribes in the hieroglyphic inscriptions of Egypt. It is evident now that certainly some, perhaps most, of these scribes worked from cuneiform lists (Muller, Egyptological Researches, 1906, 40). As the system of representation of Palestinian names by Egyptian scribes becomes thus better understood, the identification of more and more of the places in Palestine named in the Egyptian inscriptions becomes possible. Every such identification makes more nearly perfect the identification of Biblical places, the first and most important item in historical evidence.<P>III. Philologlcal Value.<P>1. Knowledge of Amorite, Hittite and Mitannian Tongues:<P>No other literary discovery, indeed, not all the others together, have afforded so much light upon philological problems in patriarchal Palestine as the Tell el-Amarna Letters. Something is now really definitely known of "the language of Canaan," the speech of the people of patriarchal days in Palestine. The remarkable persistence of old Canaanite words and names and forms of speech of these tablets down to the present time makes it plain that the peasant speech of today is the lineal descendant of that of Abraham\'s day. The letters are in the Babylonian tongue modified by contact with the speech of the country, a kind of early Aramaic (Conder, The Tell Amarna Tablets, X; Dhorme, "La langue de Canaan," Revue Biblique, Juillet, 1913, 369). There are also frequent Canaanite words inserted as glosses to explain the Babylonian words (Dhorme, op. cit.).<P>2. Persistence of Canaanite Names to the Present Time: The facts evinced by the persistence of the early Canaanite speech (compare 1, above) down through all the centuries to the peasant speech of Palestine of today furnishes a verification of the Biblical reference to the "language of Canaan" (<a onClick="return mV(\'Isa\',19,18);">lsa 19:18</A>). That peasant speech is, as it manifestly has always been since patriarchal times, a Semitic tongue. Now, even so adventurous a work as a grammar of the ancient Canaanite language has been attempted, based almost entirely upon the material furnished by the Tell el-Amarna Letters (Dhorme, op. cit.), in which the speech of Palestine in patriarchal days is described as "ancient Canaanite or Hebrew."<P>3. Verification of Biblical Statements concerning "the Language of Canaan":<P>Some more specific knowledge is also supplied by the Tell el-Amarna Letters concerning the Amorite language through the many Amorite names and the occasional explanations given in Amorite words (compare especially the 50 letters of Ribadda), and some knowledge of Hittite (Letter of Tarkhundara; Conder, The Tell Amarna Tablets, 225f), concerning the Mitannian tongue (B 153, 190, 191, 233). One other tablet (B 342) is in an unknown tongue.<P>IV. Geographical Value.<P>1. Political and Ethnological Lines and Locations<P>There was a very wide international horizon in the days of the correspondence contained in the Tell el-Amarna Letters, a horizon that enclosed Egypt, Babylonia, Canaan, Mitanni and the land of the Hittites; but the more definite geographical information supplied by the tablets is limited almost entirely to the great Syrian and Canaanite coast land. There is difference of opinion concerning the identification of a few of the places mentioned, but about 90 have been identified with reasonable certainty.<P>2. Verification of Biblical and Egyptian Geographical Notices<P>It is possible now to trace the course of the military operations mentioned in the Tell el-Amarna Letters with almost as much satisfaction as the course of a modern military campaign, and there is much verification also of Biblical and Egyptian geographical notices.<P>3. Confirmation of General Evidential Value of Ancient Geographical Notes of Bible Lands<P>The identification of such a large number of places and the ability thus given to trace the course of historical movements in that remote age are a remarkable testimony to the historical value of ancient records of that part of the world, for accuracy concerning place is of first importance in historical records.<P>V. Historical Value.<P>The Tell el-Amarna Letters furnish an amount of historical material about equal in bulk to one-half of the Pentateuch. While much of this bears more particularly upon general history of the ancient Orient, there is scarcely any part of it which does not directly or indirectly supply information which parallels some phase of Biblical history. It is not certain that any individual mentioned in the Bible is mentioned in these tablets, yet it is possible, many think it well established, that many of the persons and events of the conquest period are mentioned (compare 4 (1), below). There is also much that reflects the civilization of times still imperfectly understood, reveals historical events hitherto unknown, or but little known, and gives many sidelights upon the movements of nations and peoples of whom there is something said in the Bible.<P>1. Revolutionary Change of Opinion concerning Canaanite Civilization in Patriarchal Times<P>A revolutionary change of opinion concerning the civilization of patriarchal Palestine has taken place. It was formerly the view of all classes of scholars, from the most conservative, on the one hand, to the most radical, on the other, that there was a very crude state of civilization in Palestine in the patriarchal age, and this entirely independent of, and indeed prior to, any demand made by the evolutionary theory of Israel\'s history. Abraham was pictured as a pioneer from a land of culture to a distant dark place in the world, and his descendants down to the descent into Egypt were thought to have battled with semi-barbarous conditions, and to have returned to conquer such a land and bring civilization into it. All this opinion is now changed, primarily by the information contained in the Tell el-Amarna Letters and secondarily by incidental hints from Egyptian and Babylonian inscriptions now seen to support the high stage of civilization revealed in the Tell el-Amarna Letters (see <a href="./study/isbe/search.html?string=ARCHAEOLOGY+AND+CRITICISM">ARCHAEOLOGY AND CRITICISM</A>). The tablets make mention of "\' capital cities,\' \'provincial cities,\' \'fortresses,\' \'towns,\' and \'villages\' with \'camps\' and Hazors (or enclosures); while irrigation of gardens is also noticed, and the papyrus grown at Gebal, as well as copper, tin, gold, silver, agate, money (not, of course, coins) and precious objects of many kinds, mulberries, olives, corn, ships and chariots" (Conder, op. cit., 4).<P>The account of a bride\'s marriage portion from Mitanni reveals conditions farther north: "Two horses, and a chariot plated with gold and silver, and adorned with precious stones. The harness of the horses was adorned in like manner. Two camel litters appear to be next noticed, and apparently variegated garments worked with gold, and embroidered zones and shawls. These are followed by lists of precious stones, and a horse\'s saddle adorned with gold eagles. A necklace of solid gold and gems, a bracelet of iron gilt, an anklet of solid gold, and other gold objects follow; and apparently cloths, and silver objects, and vases of copper or bronze. An object of jade or jasper and leaves of gold....Five gems of \'stone of the great light\' (probably diamonds) follow, with ornaments for the head and feet, and a number of bronze objects and harness for chariots" (ibid., 188-89). The record of Thothmes III concerning booty brought from Palestine fully confirms this representation of the tablets (Birch, Records of the Past, 1st ser., II, 35-52; compare Sayce, Archaeology of the Cuneiform Inscriptions, 156-57).<P>The Babylonian inscriptions show that Abraham was a part of an emigration movement from the homeland to a frontier province, having the same laws and much of the same culture (Lyon, American Oriental Society Journal, XXV, 254; Barton, American Philosophical Proceedings, LII, number 209, April,1913,197; Kyle, Deciding Voice of the Monuments in Biblical Criticism, chapter xv). The Egyptian sculptured pictures make clear that the civilization of Palestine in patriarchal times was fully equal to that of Egypt (compare Petrie, Deshasheh, plural IV).<P>That these things of elegance and skill are not merely the trappings of "barbaric splendor" is manifest from the revelation which the Tell el-Amarna Letters make of ethnic movements and of influences at work from the great nations on either side of Canaan, making it impossible that the land could have been, at that period, other than a place of advanced civilization. Nearly all the tablets furnish most unequivocal evidence that Egypt had imperial rule over the land through a provincial government which was at the time falling into decay, while the cuneiform method of writing used in the tablets by such a variety of persons, in such high and low estate, implying thus long-established literary culture and a general diffusion of the knowledge of a most difficult system of writing, makes it clear that the civilization of Babylonia had been well established before the political power of Egypt came to displace that of Babylonia.<P>2. Anomalous Historical Situation Revealed by Use of Cuneiform Script<P>The displacement of Babylonian political power in Palestine just mentioned (1, above) points at once to a most remarkable historical situation revealed by the Tell el-Amarna Letters, i.e. official Egyptian correspondence between the out-lying province of Canaan and the imperial government at home, carried on, not in the language and script of Egypt, but in the script of Babylonia and in a language that is a modified Babylonian. This marks one step in the great, age-long conflict between the East and the West, between Babylonia and Egypt, with Canaan as the football of empires. It reveals—what the Babylonian inscriptions confirm—the long-preceding occupation of Canaan by Babylonia, continuing down to the beginning of patriarchal times, which had so given Canaan a Babylonian stamp that the subsequent political occupation of the land by Egypt under Thothmes III had not yet been able to efface the old stamp or give a new impression.<P>3. Extensive Diplomatic Correspondence of the Age<P>The extensive diplomatic correspondence between nations so widely separated as Egypt on the west, and Babylonia on the east, Mitanni on the north, and the Hittite country on the northwest, is also shown by the Tell el-Amarna Letters. In addition to the large number of letters between Canaan and Egypt, there are quite a number of these royal tablets: letters from Kadashman Bell, or Kallima-Sin (BM 29784), and Burna-burias of Babylonia (B 149-52), Assur-uballidh of Assyria and Dusratta of Mitanni (B 150, 191-92, 233), etc. There seems at first sight a little pettiness about this international correspondence that is almost childish, since so much of it is occupied with the marriage of princesses and the payment of dowers, and the exchange of international gifts and privileges (Budge, History of Egypt, IV, 189-90). But one might be surprised at the amount of such things in the private correspondence of kings of the present day, if access to it could be gained. The grasping selfishness also revealed in these tablets by the constant cry for gold is, after all, but a less diplomatic and more frank expression of the commercial haggling between nations of today for advantages and concessions.<P>4. Unsolved Problem of the Habiri<P>The subject of greatest historical interest in Biblical matters presented by the Tell el-Amarna Letters is the great, unsolved problem of the Habiri. Unsolved it is, for while every writer on the subject has a very decided opinion of his own, all must admit that a problem is not solved upon which there is such wide and radical difference of opinion among capable scholars, and that not running along easy lines of cleavage, but dividing indiscriminately all classes of scholars.<P>(1) One view very early advanced and still strongly held by some (Conder, op. cit., 138-44) is that Habiri is to be read \'Abiri, and means the Hebrews. It is pointed out that the letters referring to these people are from central and Southern Palestine, that the Habiri had some relation with Mt. Seir, that they are represented as contemporaneous with Japhia king of Gezer, Jabin king of Hazor, and probably Adonizedek king of Jerusalem, contemporaries of Joshua, and that certain incidental movements of Israel and of the people of Palestine mentioned in the Bible are also mentioned or assumed in the tablets (Conder, op. cit., 139-51). In reply to these arguments for the identification of the Habiri with the Hebrews under Joshua, it may be noted that, although the letters which speak of the Habiri are all from Central or Southern Palestine, they belong to very nearly the same time as the very numerous letters concerning the extensive wars in the north. The distinct separation of the one set of letters from the other is rather arbitrary and so creates an appearance which has little or no existence in fact. Probably these southern letters refer to the same disturbances spreading from the north toward the south, which is fatal to theory that the Habiri are the Hebrews under Joshua, for these latter came in from the southeast. The reference to Seir is obscure and seems rather to locate that place in the direction of Carmel (Conder, op. cit., 145). The mention of Japhia king of Gezer, and Jabin king of Hazor, does not signify much, for these names may be titles, or there may have been many kings, in sequence, of the same name. Concerning Adonizedek, it is diffcult to believe that this reading of the name of the king of Jerusalem would ever have been thought of, except for the desire to identify the Habiri with the Hebrews under Joshua. This name Adonizedek is only made out, with much uncertainty, by the unusual method of translating the king\'s name instead of transliterating it. If the name was Adonizedek, why did not the scribe write it so, instead of translating it for the Pharaoh into an entirely different name because of its meaning? The seeming correspondences between the letters and the account of the conquest in the Bible lose much of their significance when the greater probabilities raised in the names and the course of the wars are taken away.<P>(2) Against the view that the Habiri were the Hebrews of the Bible may be cited not only these discrepancies in the evidence presented for that view (compare (1), above), but also the very strong evidence from Egypt that the Exodus took place in the Ramesside dynasties, thus not earlier than the XIXth Dynasty and probably under Merenptah, the successor of Rameses II. The name Rameses for one of the store cities could hardly have occurred before the Ramesside kings. The positive declaration of Rameses II: "I built Pithom," against which there is no evidence whatever, and the coincidence between the Israel tablet of Merenptah (Petrie, Six Temples at Thebes,28,pls. XIII-XIV) and the Biblical record of the Exodus, which makes the 5th year under Merenptah to be the 5th year of Moses\' leadership (see <a href="./study/isbe/search.html?string=MOSES">MOSES</a>), make it very difficult, indeed seemingly impossible, to accept the Habiri as the Hebrews of the conquest.<P>(3) Another view concerning the Habiri, strongly urged by some (Sayce, The Higher Criticism and the Verdict of the Monuments, 175ff), is that they are Habiri, not \'Abiri, and that the name means "confederates," and was not a personal or tribal name at all. The certainty that there was, just a little before this time, an alliance in conspiracy among the Amorites and others, as revealed in the tablets for the region farther north, gives much color to this view. This opinion also relieves the chronological difficulties which beset the view that the Habiri were the Biblical Hebrews (compare (2), above), but it is contended that this reading does violence to the text.<P>(4) Another most ingenious view is advanced by Jeremias (The Old Testament in the Light of the Ancient East, 341), that the name is Habiri, that "the name answers to the sounds of \'Hebrews,\' and that the names are identical," but that this name in the Tell el-Amarna Letters is not a proper name at all, but a descriptive word, as when we read of "Abraham the Hebrew," i.e. the "stranger" or "immigrant." Thus Habiri would be "Hebrews," i.e. "strangers" or "immigrants" (see <a href="./study/isbe/search.html?string=HEBERITES">HEBERITES</A>; <a href="./study/isbe/search.html?string=HEBREW">HEBREW</A>), but the later question of the identification of these with the Hebrews of the Bible is still an open question.<P>(5) It may be that the final solution of the problem presented by the Habiri will be found in the direction indicated by combining the view that sees in them only "strangers" with the view that sees them to be "confederates." There were undoubtedly "confederates" in conspiracy against Egypt in the time of the Tell el-Amarna Letters. The government of Egypt did not come succes
