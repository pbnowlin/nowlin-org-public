isbe[8677]='Ten Commandments, the`<b>I. THE TEN COMMANDMENTS, AN ISRAELITISH CODE</b><P><b>II. THE PROMULGATON OF THE DECALOGUE</b><P><b>III. ANALYSIS OF THE DECALOGUE WITH BRIEF EXEGETICAL NOTES</b><P class="in15">1. How Numbered<P class="in15">2. How Grouped<P class="in15">3. Original Form<P class="in15">4. Brief Exegetical Notes<P><b>IV. JESUS AND THE TEN COMMANDMENTS</b><P><b>LITERATURE</b><hr /><P>In the Old Testament the Decalogue is uniformly referred to as "the ten words" (<a onClick="return mV(\'Exd\',34,28);">Ex 34:28</a> margin; <a onClick="return mV(\'Deu\',4,13);">De 4:13</a> margin; <a onClick="return mV(\'Deu\',10,4);">10:4</A> margin), or simply as "the words" spoken by Yahweh (<a onClick="return mV(\'Exd\',20,1);">Ex 20:1</a>; <a onClick="return mV(\'Exd\',34,27);">34:27</a>; <a onClick="return mV(\'Deu\',5,22);">De 5:22</a>; <a onClick="return mV(\'Deu\',10,2);">10:2</a>), or as "the words of the covenant" (<a onClick="return mV(\'Exd\',34,28);">Ex 34:28</a>). In the New Testament they are called "commandments" (<a onClick="return mV(\'Mat\',19,17);">Mt 19:17</a>; <a onClick="return mV(\'Eph\',6,2);">Eph 6:2</a>), as with us in most Christian lands.<P>I. The Ten Commandments an Israelite Code.<P>The "ten words" were spoken by Yahweh to the people whom He had but recently delivered from Egyptian bondage, and then led out into the wilderness, that He might teach them His laws. It was to Israel that the Decalogue was primarily addressed, and not to all mankind. Thus, the reason assigned for keeping the 5th commandment applies to the people who were on their way to the land which had been given to Abraham and his descendants (<a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>); and the 4th commandment is enforced by reference to the servitude in Egypt (<a onClick="return mV(\'Deu\',5,15);">De 5:15</a>). It is possible, then, that even in the Ten Commandments there are elements peculiar to the Mosaic system and which our Lord and His apostles may not make a part of faith and duty for Christians.<P>See <a href="./study/isbe/search.html?string=SABBATH">SABBATH</A>.<P>Of the "ten words," seven were perhaps binding on the consciences of enlightened men prior to the days of Moses: murder, adultery, theft and false witness were already treated as crimes among the Babylonians and the Egyptians; and intelligent men knew that it was wrong to dishonor God by improper use of His name, or to show lack of respect to parents, or to covet the property of another. No doubt the sharp, ringing words in which these evils are forbidden in the Ten Commandments gave to Israel a clearer apprehension of the sins referred to than they had ever had before; and the manner in which they were grouped by the divine speaker brought into bold relief the chief elements of the moral law. But the first two prohibitions were novelties in the religious life of the world; for men worshipped many gods, and bowed down to images of every conceivable kind. The 2nd commandment was too high even for Israel to grasp at that early day; a few weeks later the people were dancing about the golden calf at the foot of Sinai. The observance of the Sabbath was probably unknown to other nations, though it may have been already known in the family of Abraham.<P>II. The Promulgation of the Decalogue.<P>The "ten words" were spoken by Yahweh Himself from the top of the mount under circumstances the most awe-inspiring. In the early morning there were thunders and lightnings and a thick cloud upon the mount, and the voice of a trumpet exceeding loud. It is no wonder that the people trembled as they faced the smoking and quaking mount, and listened to the high demands of a holy God. Their request that all future revelations should be made through Moses as the prophet mediator was quite natural. The promulgation of the Ten Commandments stands out as the most notable event in all the wilderness sojourn of Israel. There was no greater day in history before the coming of the Son of God into the world.<P>After a sojourn of 40 days in the mount, Moses came down with "the two tables of the testimony, tables of stone, written with the finger of God." At the foot of the mount, when Moses saw the golden calf and the dancing throng about it, he cast the tables out of his hands and broke them in pieces (<a onClick="return mV(\'Exd\',31,18);">Ex 31:18</a>; <a onClick="return mV(\'Exd\',39,\'15-20\');">39:15-20</a>). Through the intercession of Moses, the wrath of Yahweh was averted from Israel; and Yahweh invited Moses to ascend the mount with two new tablets, on which He would write the words that were on the first tables, which were broken. Moses was commanded to write the special precepts given by God during this interview; but the. Ten Commandments were written on the stone tablets by Yahweh Himself (<a onClick="return mV(\'Exd\',34,\'1-4\');">Ex 34:1-4</a>,<a onClick="return mV(\'Exd\',34,\'27-29\');">27-29</a>; <a onClick="return mV(\'Deu\',10,\'1-5\');">De 10:1-5</a>). These precious tablets were later deposited in the ark of the covenant (<a onClick="return mV(\'Exd\',40,20);">Ex 40:20</a>). Thus in every way possible the Ten Commandments are exalted as the most precious and directly divine of all the precepts of the Mosaic revelation.<P>III. Analysis of the Decalogue with Brief Exegetical Notes.<P>That there were "ten words" is expressly stated (<a onClick="return mV(\'Exd\',34,28);">Ex 34:28</a>; <a onClick="return mV(\'Deu\',4,13);">De 4:13</a>; <a onClick="return mV(\'Deu\',10,4);">10:4</a>); but just how to delimit them one from another is a task which has not been found easy. For a full discussion of the various theories, see Dillmann, Exodus, 201-5, to whom we are indebted for much that is here set forth.<P>1. How Numbered:<P>(1) Josephus is the first witness for the division now common among Protestants (except Lutherans), namely,<P>(a) foreign gods,<P>(b) images,<P>(c) name of God,<P>(d) Sabbath,<P>(e) parents,<P>(f) murder,<P>(g) adultery,<P>(h) theft,<P>(i) false witness,<P>(j) coveting.<P>Before him, Philo made the same arrangement, except that he followed the Septuagint in putting adultery before murder. This mode of counting was current with many of the church Fathers, and is now in use in the Greek Catholic church and with most Protestants.<P>(2) Augustine combined foreign gods and images (<a onClick="return mV(\'Exd\',20,\'2-6\');">Ex 20:2-6</a>) into one commandment and following the order of <a onClick="return mV(\'Deu\',5,21);">De 5:21 (Hebrew 18)</a> made the 9th commandment a prohibition of the coveting of a neighbor\'s wife, while the 10th prohibits the coveting of his house and other property. Roman Catholics and Lutherans accept Augustine\'s mode of reckoning, except that they follow the order in <a onClick="return mV(\'Exd\',20,17);">Ex 20:17</a>, so that the 9th commandment forbids the coveting of a neighbor\'s house, while the 10th includes his wife and all other property.<P>(3) A third mode of counting is that adopted by the Jews in the early Christian centuries, which became universal among them in the Middle Ages and so down to the present time. According to this scheme, the opening statement in <a onClick="return mV(\'Exd\',20,2);">Ex 20:2</a> is the "first word," <a onClick="return mV(\'Exd\',20,\'3-6\');">Ex 20:3-6</a> the second (combining foreign gods with images), while the following eight commandments are as in the common Protestant arrangement.<P>The division of the prohibition of coveting into two commandments is fatal to the Augustinian scheme; and the reckoning of the initial statement in <a onClick="return mV(\'Exd\',20,2);">Ex 20:2</a> as one of the "ten words" seems equally fatal to the modern Jewish method of counting. The prohibition of images, which is introduced by the solemn formula, "Thou shalt not," is surely a different "word" from the command to worship no god other than Yahweh. Moreover, if nine of the "ten words" are commandments, it would seem reasonable to make the remaining "word" a commandment, if this can be done without violence to the subjectmatter. See Eerdmaus, The Expositor, July,1909,21ff.<P>2. How Grouped:<P>(1) The Jews, from Philo to the present, divide the "ten words" into two groups of five each. As there were two tables, it would be natural to suppose that five commandments were recorded on each tablet, though the fact that the tablets had writing on both their sides (<a onClick="return mV(\'Exd\',32,15);">Ex 32:15</a>) would seem to weaken the force of the argument for an equal division. Moreover, the first pentad, in the present text of Exodus and Deuteronomy, is more than four times as long as the second.<P>(2) Augustine supposed that there were three commandments on the first table and seven on the second. According to his method of numbering the commandments, this would put the command to honor parents at the head of the second table, as in the third method of grouping the ten words.<P>(3) Calvin and many moderns assign four commandments to the first table and six to the second. This has the advantage of assigning all duties to God to the first table and all duties to men to the second. It also accords with our Lord\'s reduction of the commandments to two (<a onClick="return mV(\'Mat\',22,\'34-40\');">Mt 22:34-40</a>).<P>3. Original Form:<P>A comparison of the text of the Decalogue in <a onClick="return mV(\'Deu\',5,\'1-\');">De 5</a> with that in <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a> reveals a goodly number of differences, especially in the reasons assigned for the observance of the 4th and 5th commandments, and in the text of the 10th commandment. A natural explanation of these differences is the fact that Deuteronomy employs the free-and-easy style of public discourse. The Ten Commandments are substantially the same in the two passages.<P>From the days of Ewald to the present, some of the leading Old Testament scholars have held that originally all the commandments were brief and without the addition of any special reasons for their observance. According to this hypothesis, the 2nd, 3rd, 4th, 5th, and the 10th commandments were probably as follows: "Thou shalt not make unto thee any graven image"; "Thou shalt not take the name of Yahweh thy God in vain"; "Remember the Sabbath day to keep it holy"; "Honor thy father and thy mother"; "Thou shalt not covet thy neighbor\'s house." This early critical theory would account for the differences in the two recensions by supposing that the motives for keeping the 2nd, 3rd, 4th, and 5th commandments, as well as the expansion of the 10th, were additions made through the influence of the prophetic teaching. If accompanied by a full recognition of the divine origin of the ten words in the Mosaic era, this hypothesis might be acceptable to a thorough believer in revelation. Before acquiescing in the more radical theories of some recent scholars, such a believer will demand more cogent arguments than the critics have been able to bring forward. Thus when we are told that the Decalogue contains prohibitions that could not have been incorporated into a code before the days of Manasseh, we demand better proofs than the failure of Israel to live up to the high demands of the 2nd and the 10th commandments, or a certain theory of the evolution of the history that may commend itself to the mind of naturalistic critics. Yahweh was at work in the early history of Israel; and the great prophets of the 8th century, far from creating ethical monotheism, were reformers sent to demand that Israel should embody in daily life the teachings of the Torah.<P>Goethe advanced the view that <a onClick="return mV(\'Exd\',34,\'10-28\');">Ex 34:10-28</a> originally contained a second decalogue.<P>Wellhausen (Code of Hammurabi, 331f) reconstructs this so-called decalogue as follows:<P>(1) Thou shalt worship no other god (<a onClick="return mV(\'Exd\',34,14);">Ex 34:14</a>).<P>(2) Thou shalt make thee no molten gods (<a onClick="return mV(\'Exd\',34,17);">Ex 34:17</a>).<P>(3) The feast of unleavened bread shalt thou keep (<a onClick="return mV(\'Exd\',34,18);">Ex 34:18</a> a).<P>(4) Every firstling is mine (<a onClick="return mV(\'Exd\',34,19);">Ex 34:19</a> a).<P>(5) Thou shalt observe the feast of weeks (<a onClick="return mV(\'Exd\',34,22);">Ex 34:22</a> a).<P>(6) And the feast of ingathering at the year\'s end (<a onClick="return mV(\'Exd\',34,2);">Ex 34:2</a>2c).<P>(7) Thou shalt not offer the blood of my sacrifice with leavened bread (<a onClick="return mV(\'Exd\',34,25);">Ex 34:25</a> a).<P>(8) The fat of my feast shall not remain all night until the morning (<a onClick="return mV(\'Exd\',23,18);">23:18b</a>; compare <a onClick="return mV(\'Exd\',34,25);">34:25b</a>).<P>(9) The best of the first-fruits of thy ground shalt thou bring to the house of Yahweh thy God (<a onClick="return mV(\'Exd\',34,26);">Ex 34:26</a> a).<P>(10) Thou shalt not seethe a kid in its mother\'s milk (<a onClick="return mV(\'Exd\',34,26);">Ex 34:26</a>).<P>Addis agrees with Wellhausen that even this simpler decalogue must be put long after the time of Moses (EB, 1051).<P>Now, it is evident that the narrative in <a onClick="return mV(\'Exd\',34,27);">Ex 34:27</a>f; in its present form, means to affirm that Moses was commanded to write the precepts contained in the section immediately preceding. The Ten Commandments, as the foundation of the covenant, were written by Yahweh Himself on the two tablets of stone (<a onClick="return mV(\'Exd\',31,18);">Ex 31:18</a>; <a onClick="return mV(\'Exd\',32,15);">32:15</a>f; <a onClick="return mV(\'Exd\',34,28);">34:28</a>). It is only by free critical handling of the narrative that it can be made to appear that Moses wrote on the two tables the supposed decalogue of <a onClick="return mV(\'Exd\',34,\'14-26\');">Ex 34:14-26</a>. Moreover, the law of the Sabbath (<a onClick="return mV(\'Exd\',34,21);">34:21</a>), which is certainly appropriate amid the ritual ordinances of <a onClick="return mV(\'Exd\',34,\'1-\');">Ex 34</a>, must be omitted altogether, in order to reduce the precepts to ten; also the command in <a onClick="return mV(\'Exd\',34,23);">34:23</a> has to be deleted. It is interesting to observe that the prohibition of molten gods (<a onClick="return mV(\'Exd\',34,17);">34:17</a>), even according to radical critics, is found in the earliest body of Israelite laws. There is no sufficient reason for denying that the 2nd commandment was promulgated in the days of Moses. Yahweh\'s requirements have always been in advance of the practice of His people.<P>4. Brief Exegetical Notes:<P>(1) The 1st commandment prohibits the worship of any god other than Yahweh. If it be said that this precept inculcates monolatry and not monotheism, the reply is ready to hand that a consistent worship of only one God is, for a people surrounded by idolaters, the best possible approach to the conclusion that there is only one true God. The organs of revelation, whatever may have been the notions and practices of the mass of the Israelite people, always speak in words that harmonize with a strict monotheism.<P>(2) The 2nd commandment forbids the use of images in worship; even an image of Yahweh is not to be tolerated (compare <a onClick="return mV(\'Exd\',32,5);">Ex 32:5</a>). Yahweh\'s mercy is greater than His wrath; while the iniquity of the fathers descends to the third and the fourth generation for those who hate Yahweh, His mercy overflows to thousands who love Him. It is doubtful whether the rendering \'showing mercy to the thousandth generation\' (<a onClick="return mV(\'Exd\',20,6);">Ex 20:6</a>) can be successfully defended.<P>(3) Yahweh\'s name is sacred, as standing for His person; therefore it must be employed in no vain or false way. The commandment, no doubt, includes more than false swearing. Cursing, blasphemy and every profane use of Yahweh\'s name are forbidden.<P>(4) As the 1st commandment inculcates the unity of God and the 2nd His spirituality, so also the 3rd commandment guards His name against irreverent use and the 4th sets apart the seventh day as peculiarly His day, reserved for a Sabbath. <a onClick="return mV(\'Exd\',20,11);">Ex 20:11</a> emphasizes the religious aspect of the Sabbath, while <a onClick="return mV(\'Deu\',5,14);">De 5:14</a> lays stress on its humane aspect, and <a onClick="return mV(\'Deu\',5,15);">De 5:15</a> links it with the deliverance from bondage in Egypt.<P>(5) The transition from duties to God to duties to men is made naturally in the 5th commandment, which inculcates reverence for parents, to whom their children should look up with gratitude, as all men should toward the Divine Father.<P>(6) Human life is so precious and sacred that no man should dare to take it away by violence.<P>(7) The family life is safeguarded by the 7th commandment.<P>(8) The 8th commandment forbids theft in all its forms. It recognizes the right of personal ownership of property.<P>(9) The 9th commandment safeguards honor and good name among men. Slander, defamation, false testimony in court and kindred sins are included.<P>(10) The 10th commandment is the most searching of them all, for it forbids the inward longing, the covetous desire for what belongs to another. The presence of such a deeply spiritual command among the "ten words" shows that we have before us no mere code of laws defining crimes, but a body of ethical and spiritual precepts for the moral education of the people of Yahweh.<P>IV. Jesus and the Ten Commandments.<P>Our Lord, in the interview with the rich young ruler, gave a recapitulation of the commandments treating of duties to men (<a onClick="return mV(\'Mar\',10,19);">Mr 10:19</a>; <a onClick="return mV(\'Mat\',19,18);">Mt 19:18</a>f; <a onClick="return mV(\'Luk\',18,20);">Lu 18:20</a>). He quotes the 5th, 6th, 7th, 8th and 9th commandments. The minor variations in the reports in the three Synoptic Gospels remind the student of the similar variations in <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a> and <a onClick="return mV(\'Deu\',5,\'1-\');">De 5</a>. Already in the Sermon on the Mount Jesus had quoted the 6th and 7th commandments, and then had gone on to show that anger is incipient murder, and that lust is adultery in the heart (<a onClick="return mV(\'Mat\',5,\'27-32\');">Mt 5:27-32</a>). He takes the words of the Decalogue and extends them into the realm of thought and feeling. He may have had in mind the 3rd commandment in His sharp prohibition of the Jewish habit of swearing by various things (<a onClick="return mV(\'Mat\',5,\'33-37\');">Mt 5:33-37</a>). As to the Sabbath, His teaching and example tended to lighten the onerous restrictions of the rabbis (<a onClick="return mV(\'Mar\',2,\'23-28\');">Mr 2:23-28</a>). Duty to parents He elevated above all supposed claims of vows and offerings (<a onClick="return mV(\'Mat\',15,\'4-6\');">Mt 15:4-6</a>). In further extension of the 8th commandment, Jesus said, "Do not defraud" (<a onClick="return mV(\'Mar\',10,19);">Mr 10:19</a>); and in treating of the ethics of speech, Jesus not only condemns false witness, but also includes railing, blasphemy, and even an idle word (<a onClick="return mV(\'Mat\',15,19);">Mt 15:19</a>; <a onClick="return mV(\'Mat\',12,31,36);">12:31,36</a>f). In His affirmation that God is spirit (<a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>), Jesus made the manufacture of images nothing but folly. All his ethical teaching might be said to be founded on the 10th commandment, which tracks sin to its lair in the mind and soul of man.<P>Our Lord embraced the whole range of human obligation in two, or at most three, commands: (1) "Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind"; (2) "Thou shalt love thy neighbor as thyself" (<a onClick="return mV(\'Mat\',22,\'37-40\');">Mt 22:37-40</a>; compare <a onClick="return mV(\'Deu\',6,5);">De 6:5</a>; <a onClick="return mV(\'Lev\',19,18);">Le 19:18</a>). With love such as is here described in the heart, man cannot trespass against God or his fellow-men. At the close of His ministry, on the night of the betrayal, Jesus gave to His followers a third commandment, not different from the two on which the whole Law hangs, but an extension of the second great commandment upward into a higher realm of self-sacrifice (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>f; <a onClick="return mV(\'Jhn\',15,12);">15:12f</a>; <a onClick="return mV(\'Jhn\',17,\'1-\');">17</a>; compare <a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>; <a onClick="return mV(\'Gal\',6,10);">Ga 6:10</a>; <a onClick="return mV(\'1Jo\',3,\'14-18\');">1Joh 3:14-18</a>). "Thou shalt love" is the first word and the last in the teaching of our Lord. His teaching is positive rather than negative, and so simple that a child can understand it. For the Christian, the Decalogue is no longer the highest summary of human duty. He must ever read it with sincere respect as one of the great monuments of the love of God in the moral and religious education of mankind; but it has given place to the higher teaching of the Son of God, all that was permanently valuable in the Ten Commandments having been taken up into the teaching of our Lord and His apostles.<P>LITERATURE.<P>Oehler, Old Testament Theology, I, 267ff; Dillmann, Exodus-Leviticus, 200-219; Kuenen, Origin and Composition of the Hexateuch, 244; Wellhausen, Code of Hammurabi, 331f; Rothstein, Das Bundesbuch; Baenstch, Das Bundesbuch; Meissaner, Der Dekalog; Driver, "Deuteronomy," ICC; Addis, Documents of the Hexateuch, I, 136ff; R. W. Dale, The Ten Commandments; G. D. Boardman, University Lectures on the Ten Commandments (Philadelphia, 1889).``156';
isbe[8678]='Ten Strings`(\'asor).`<a href="./study/isbe/search.html?string=MUSIC">MUSIC, I, 1, (2), (c)</a>`1';
isbe[8679]='Tender`ten\'-der: The usua1 (11 out of 16 times) translation of rakh, "soft," "delicate," with the noun rokh, in <a onClick="return mV(\'Deu\',28,56);">De 28:56</a> and the verb rakhakh, in <a onClick="return mV(\'2Ki\',22,19);">2Ki 22:19</a> parallel <a onClick="return mV(\'2Ch\',34,27);">2Ch 34:27</a>. Attention need be called only to the following cases: In <a onClick="return mV(\'Gen\',29,17);">Ge 29:17</a>, "Leah\'s eyes were tender," a physical defect is described ("weak-eyed"; see <a href="./study/isbe/search.html?string=BLINDNESS">BLINDNESS</a>). "Tender-hearted" in <a onClick="return mV(\'2Ch\',13,7);">2Ch 13:7</a> means "faint-hearted," while in <a onClick="return mV(\'2Ki\',22,19);">2Ki 22:19</a> parallel <a onClick="return mV(\'2Ch\',34,27);">2Ch 34:27</a> ("because thy heart was tender"), it means "penitent." Contrast the modern use in <a onClick="return mV(\'Eph\',4,32);">Eph 4:32</a>.<P>Throughout Psalms (10 times) and Proverbs (<a onClick="return mV(\'Pro\',12,10);">12:10</a>), but not elsewhere (the King James Version has "tender love" in <a onClick="return mV(\'Dan\',1,9);">Da 1:9</a>, the Revised Version (British and American) "compassion"), English Versions of the Bible translate rachamim, "bowels," by "tender mercies," and this translation has been carried into the New Testament as "tender mercy" (the Revised Version margin "heart of mercy") for the corresponding Greek phrase splagchna eleous ("bowels of mercy") in <a onClick="return mV(\'Luk\',1,78);">Lu 1:78</a>; compare "tenderhearted" for eusplagchnos ("right boweled") in <a onClick="return mV(\'Eph\',4,32);">Eph 4:32</a>, based upon the idea of psychology widely spread among Semitic people, which considers the "bowels" (qerebh) as the seat of all tender emotions of kindness and mercy: See <a href="./study/isbe/search.html?string=BOWELS">BOWELS</A>. the King James Version also has "of tender mercy" in <a onClick="return mV(\'Jam\',5,11);">Jas 5:11</a> without justification in the Greek (oiktirmon, the Revised Version (British and American) "merciful").<P>Other special phrases: "tender grape" in the King James Version, <a onClick="return mV(\'Sgs\',2,13,15);">So 2:13,15</a>; <a onClick="return mV(\'Sgs\',7,12);">7:12</a>, for cemadhar. The meaning of the word is not quite certain, but Revised Margin\'s "blossom" (except <a onClick="return mV(\'Sgs\',7,12);">7:12</A> margin) is probably right. "Tender grass" in <a onClick="return mV(\'2Sa\',23,4);">2Sa 23:4</a>; <a onClick="return mV(\'Pro\',27,25);">Pr 27:25</a>; the Revised Version (British and American) <a onClick="return mV(\'Deu\',32,2);">De 32:2</a> (the King James Version "tender herb"); <a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a>; <a onClick="return mV(\'Isa\',66,14);">66:14</a> for deshe\' "grass" (Aramaic dethe\',<a onClick="return mV(\'Dan\',4,15,23);">Da 4:15,23</a>). The context in these passages and the meaning of the cognates of deshe\' in other Semitic languages make this translation probable, but Revised Version\'s usage is not consistent (compare <a onClick="return mV(\'Gen\',1,11,12);">Ge 1:11,12</a>; <a onClick="return mV(\'Job\',6,5);">Job 6:5</a>; <a onClick="return mV(\'Psa\',23,2);">Ps 23:2</a>, etc.). <a onClick="return mV(\'Isa\',53,2);">Isa 53:2</a> has "tender plant" for yoneq, "a sapling," while <a onClick="return mV(\'Job\',14,7);">Job 14:7</a> has "tender branch" for the allied word yoneqeth, usually rendered "shoot" (<a onClick="return mV(\'Job\',8,16);">Job 8:16</a>, etc.). Finally, "tender" in <a onClick="return mV(\'Mar\',13,28);">Mr 13:28</a> parallel <a onClick="return mV(\'Mat\',24,32);">Mt 24:32</a> is for hapalos, "soft." The running sap of springtime softens the branches that were stiff during the winter.<P>The verb "tender" occurs in 2Macc 4:2, the King James Version "(he had) tendered his own nation," in the modern sense of "tend." The translation is a paraphrase of the noun kedemon, "a protector," the Revised Version (British and American) "the guardian of his fellow-countrymen."``48';
isbe[8680]='Tenon`ten\'-un (yadh): This word, occurring in <a onClick="return mV(\'Exd\',26,\'1-\');">Ex 26</a> and <a onClick="return mV(\'Exd\',36,\'1-\');">36</A>, is used in the account of the tabernacle to describe the "hand" or yadh by which its 48 boards were kept in place. Each board had two tenons which were mortised into it (<a onClick="return mV(\'Exd\',36,22);">Ex 36:22</a> margin). These tenons would be made of harder wood than the acacia, so as better to stand the strain of wind and weather. When in use the tenons were sunk into the "<a href="./study/isbe/search.html?string=SOCKET">sockets</a>" (which see), and allowed of a speedy reerection of the tabernacle at its every remove.<P>Sockets are also mentioned as in use for the standards of the tabernacle court (<a onClick="return mV(\'Exd\',27,10);">Ex 27:10</a>), but there is no mention of tenons. It may be that the base of each standard was let into its socket, without the use of any tenon. This would give it sufficient stability, as the height of each standard was but 5 cubits (7 1/2 ft.) (<a onClick="return mV(\'Exd\',27,18);">Ex 27:18</a>).<P>For Professor A. R. S. Kennedy\'s different theory of "tenons," see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</A>, and his own article on the "Tabernacle" in HDB, IV.``17';
isbe[8681]='Tent`tent (\'ohel; skene; \'ohel is a derivative of \'ahal, "to be clear," "to shine"; hence, \'ohel, "to be conspicuous from a distance"): In the great stretches of uncultivated lands in the interior of Syria or Arabia, which probably have much the same aspect today as in Abraham\'s time, it is an easy matter to espy an encampment of roving Bedouin, "a nation...that dwelleth without care...that have neither gates nor bars" (<a onClick="return mV(\'Jer\',49,31);">Jer 49:31</a>). The peaks of their black (compare <a onClick="return mV(\'Sgs\',1,5);">So 1:5</a>) goats\' hair tents stand out in contrast against the lighter colors of the soil.<P>There seems to be little doubt about the antiquity of the Arab tent, and one can rightly believe that-the dwelling-places of Abraham, Sarah, Jacob, and their descendants were made on the same pattern and of the same materials (<a onClick="return mV(\'Gen\',4,20);">Ge 4:20</a>; <a onClick="return mV(\'Gen\',9,27);">9:27</a>; <a onClick="return mV(\'Gen\',12,8);">12:8</a>; <a onClick="return mV(\'Gen\',13,3);">13:3</a>; <a onClick="return mV(\'Gen\',18,6);">18:6</a>; <a onClick="return mV(\'Gen\',31,25,30);">31:25,30</a>; <a onClick="return mV(\'Psa\',78,55);">Ps 78:55</a>; <a onClick="return mV(\'Hbr\',11,9);">Heb 11:9</a>, etc.). Long after the children of Israel had given up their tents for houses they continued to worship in tents (<a onClick="return mV(\'2Sa\',7,\'1-6\');">2Sa 7:1-6</a>; <a onClick="return mV(\'2Ch\',1,3);">2Ch 1:3,4</a>) (for the use of tents in connection with religious observances see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>).<P>The Arab tents (called bait sha\'r, "house of hair") are made of strips of black goats\' hair cloth, sewed together into one large piece (see <a href="./study/isbe/search.html?string=GOATS\'+HAIR">GOATS\' HAIR</A>; <a href="./study/isbe/search.html?string=WEAVING">WEAVING</A>). Poles are placed under this covering at intervals to hold it from the ground, and it is stretched over these poles by ropes of goats hair or hemp (compare <a onClick="return mV(\'Job\',4,21);">Job 4:21</a>; <a onClick="return mV(\'Isa\',54,2);">Isa 54:2</a>; <a onClick="return mV(\'Jer\',10,20);">Jer 10:20</a>) "fastened to hard-wood pins driven into the ground (<a onClick="return mV(\'Isa\',54,2);">Isa 54:2</a>; <a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>; <a onClick="return mV(\'Jdg\',5,26);">5:26</a>). A large wooden mallet for driving the pegs is part of the regular camp equipment (<a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>; <a onClick="return mV(\'Jdg\',5,26);">5:26</a>). The sides (curtains) of the tent (<a onClick="return mV(\'Isa\',54,2);">Isa 54:2</a>) are made of strips of goats hair cloth or from mats woven from split cane or rushes (see Illustration, p. 2948). Where more than one family occupies the same tent or the animals are provided with shelter under the same roof (compare <a onClick="return mV(\'2Ch\',14,15);">2Ch 14:15</a>), curtains of the same materials mentioned above form the dividing walls. A corner of the matting where two ends meet is turned back to form the door of the tent (<a onClick="return mV(\'Gen\',18,1);">Ge 18:1</a>). In the summer time the walls are mostly removed. New tents are not water-proof, and the condition of the interior after a heavy rain is not far from squalid. The tent material becomes matted by use, especially if wool has been woven into the fabric, and is then a better protection against the rain. It is the women\'s duty to pitch the tents.<P>The poorer Arabs have no mats to cover the ground under their tents. Straw mats, goats\' hair or woolen rugs (compare <a onClick="return mV(\'Jdg\',4,18);">Jud 4:18</a>), more or less elaborate as the taste and means of the family allow, are the usual coverings for the tent floor. The food supplies are usually kept in goats\' hair bags, the liquids, as oil or milk products, in skins. One or two tinned copper cooking-vessels, a shallow tray of the same material, a coffee set consisting of roasting pan, mortar and pestle, boiling-pot and cups, make up the usual camp furniture. The more thrifty include bedding in their equipment, but this increases the difficulties of moving, since it might require more than the one animal, sometimes only a donkey, which carries all the earthly belongings of the family. A sheikh or chief has several tents, one for himself and guests, separate ones for his wives and female servants, and still others for his animals (compare <a onClick="return mV(\'Gen\',31,33);">Ge 31:33</a>).<P>Other Hebrew words translated "tent" are forms of chanah (<a onClick="return mV(\'Num\',13,19);">Nu 13:19</a>; <a onClick="return mV(\'1Sa\',17,53);">1Sa 17:53</a>; <a onClick="return mV(\'2Ki\',7,16);">2Ki 7:16</a>; <a onClick="return mV(\'2Ch\',31,2);">2Ch 31:2</a>; <a onClick="return mV(\'Zec\',14,15);">Zec 14:15</a>); cukkah (<a onClick="return mV(\'2Sa\',11,11);">2Sa 11:11</a>; <a onClick="return mV(\'2Sa\',22,12);">22:12</a>); mishkenoth (<a onClick="return mV(\'Sgs\',1,8);">So 1:8</a>).<P>Figurative: "Neither shall the Arabian pitch tent there" typified utter desolation (<a onClick="return mV(\'Isa\',13,20);">Isa 13:20</a>). "Enlarge the place of thy tent...stretch forth the curtains...lengthen thy cords...strengthen thy stakes" prophesied an increase in numbers and prosperity of God\'s people (<a onClick="return mV(\'Isa\',54,2);">Isa 54:2</a>; compare <a onClick="return mV(\'Isa\',33,20);">33:20</A>; <a onClick="return mV(\'Luk\',16,9);">Lu 16:9</a>; <a onClick="return mV(\'2Cr\',5,4);">2Co 5:4</a>). Tent cords plucked up denoted death. (<a onClick="return mV(\'Job\',4,21);">Job 4:21</a>). <a onClick="return mV(\'Jer\',10,20);">Jer 10:20</a> is a picture of a destroyed household as applied to Judah. Hezekiah in his sickness bewails that his dwelling (life) had been carried away as easily as a shepherd\'s tent is plucked up (<a onClick="return mV(\'Isa\',38,12);">Isa 38:12</a>). Isaiah compared the heavens to a tent spread out (<a onClick="return mV(\'Isa\',40,22);">Isa 40:22</a>). "They shall pitch their tents against her" i.e. they shall make war (<a onClick="return mV(\'Jer\',6,3);">Jer 6:3</a>).``133';
isbe[8682]='Tent-Maker`tent\'-mak-er (skenopoios): Mentioned only once (<a onClick="return mV(\'Act\',18,3);">Ac 18:3</a>). Paul\'s native province of Cilicia was noted for its goats\' hair cloth which was exported under the name of cilicium and was used largely for tentmaking. We are told in the passage mentioned that Paul dwelt with Aquila and Priscilla, and worked with them at tent-making (compare <a onClick="return mV(\'Act\',20,34);">Ac 20:34</a>).`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`1';
isbe[8683]='Tenth``<a href="./study/isbe/search.html?string=TITHE">TITHE</a>`1';
isbe[8684]='Tenth Deal`del (\'issaron): The tenth part of an ephah, and so rendered in the Revised Version (British and American) (<a onClick="return mV(\'Num\',28,\'1-\');">Nu 28</a>; <a onClick="return mV(\'Num\',29,\'1-\');">29</a>). It was used in connection with the sacrifices for measuring flour.``1';
isbe[8685]='Tephon`te\'-fon (he Tepho): In 1Macc 9:50, a city of Judea fortified by Bacchides, probably the "Beth-tappuah" of <a onClick="return mV(\'Jos\',15,53);">Jos 15:53</a>, near Hebron. Josephus (Ant., XII, i, 3) calls it "Tochoa."``1';
isbe[8686]='Terah (1)`te\'-ra (terach; Septuagint Tharra, or (with New Testament) Thara; on the name see especially HDB, under the word): The son of Nahor and father of Abraham, Nahor and Haran (<a onClick="return mV(\'Gen\',11,24);">Ge 11:24</a>f). At Abraham\'s birth Terah was 70 years old (<a onClick="return mV(\'Gen\',11,26);">Ge 11:26</a>), and after Abraham\'s marriage, Terah, Abraham, Sarah and Lot emigrated from Ur of the Chaldees on the road into the land of Canaan, but stopped in Haran (<a onClick="return mV(\'Gen\',11,31);">Ge 11:31</a>). When Abraham was 75 years old he and his nephew resumed their journey, leaving Terah in Haran, where 60 years later he died (<a onClick="return mV(\'Gen\',11,32);">Ge 11:32</a>). Stephen, however, states (<a onClick="return mV(\'Act\',7,4);">Ac 7:4</a>) that Terah was dead when Abraham left Haran, an impression that is easily gained from <a onClick="return mV(\'Gen\',11,\'1-\');">Ge 11</A>-<a onClick="return mV(\'Gen\',12,\'1-\');">12</a> if the dates are not computed. As there is no reason to suppose that Stephen was granted inspiration that would preserve him from such a purely formal error, the contradiction is of no significance and attempts at "reconciliation" are needless. In particular, the attempt of Blass (Stud. u. Krit.,1896,460ff) to alter the text of Acts is quite without foundation. For further discussion see especially Knowling, The Expositor\'s Greek Testament, at the place. It is worth noting that Philo makes the same error (Migr. Abr. 177 (section 32)), perhaps indicating some special Jewish tradition of New Testament times. In <a onClick="return mV(\'Jos\',24,2);">Jos 24:2</a> Terah is said to have been an idolater. In Jubilees 12 this is softened into explaining that through fear of his life Terah was forced to yield outward conformity to the idolatrous worship of his neighbors. On the other hand certain Jewish legends (e.g. Ber. Rab. 17) represent Terah as actually a maker of idols. Otherwise in the Bible Terah is mentioned only by name in <a onClick="return mV(\'1Ch\',1,26);">1Ch 1:26</a>; <a onClick="return mV(\'Luk\',3,34);">Lu 3:34</a>.``48';
isbe[8687]='Terah (2)`(Codex Vaticanus Tarath; Codex Alexandrinus Tharath): A wilderness camp of the Israelites between Tahath and Mithkah (<a onClick="return mV(\'Num\',33,27,28);">Nu 33:27,28</a>).`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[8688]='Teraphim`ter\'-a-fim.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>; <a href="./study/isbe/search.html?string=IMAGES">IMAGES</a>`1';
isbe[8689]='Terebinth`ter\'-e-binth:<P>(1) \'elah (<a onClick="return mV(\'Isa\',6,13);">Isa 6:13</a>, the King James Version "teil tree"; <a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>, the King James Version "elms"); in <a onClick="return mV(\'Gen\',35,4);">Ge 35:4</a> (the King James Version "oak"); <a onClick="return mV(\'Jdg\',6,11,19);">Jud 6:11,19</a>; <a onClick="return mV(\'Jdg\',9,6);">9:6</a> (the King James Version "plain"); <a onClick="return mV(\'2Sa\',18,9,10,14);">2Sa 18:9,10,14</a>; <a onClick="return mV(\'1Ki\',13,14);">1Ki 13:14</a>; <a onClick="return mV(\'1Ch\',10,12);">1Ch 10:12</a>; <a onClick="return mV(\'Isa\',1,30);">Isa 1:30</a>; <a onClick="return mV(\'Eze\',6,13);">Eze 6:13</a>, translated "oak," and in margin "terebinth"; "vale of Elah," margin "the terebinth" in <a onClick="return mV(\'1Sa\',17,2,19);">1Sa 17:2,19</a>; <a onClick="return mV(\'1Sa\',21,9);">21:9</a>.<P>(2) \'elim (<a onClick="return mV(\'Isa\',1,29);">Isa 1:29</a>, "oaks," margin "terebinths").<P>(3) \'allah (<a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>, English Versions of the Bible have "oak," but the Septuagint terebinthos).<P>(4) \'elon, "oak (margin, "terebinth") of Zaanannim" (<a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>; <a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>); "oak (the Revised Version margin "terebinth," the King James Version "plain") of Tabor" (<a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a>); also <a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; <a onClick="return mV(\'Gen\',13,18);">13:18</a>; <a onClick="return mV(\'Gen\',14,13);">14:13</a>; <a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a>; <a onClick="return mV(\'Deu\',11,30);">De 11:30</a>; <a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a> all translated "oak" or "oaks," with margin "terebinth" or "terebinths."<P>(5) In <a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a> Septuagint has terebinthos, as the translation of the el of El-paran.<P>(6) In Ecclesiasticus 24:16 terem (b)inthos, the King James Version turpentine tree," the Revised Version (British and American) "terebinth."<P>It is clear that the translators are uncertain which translation is correct, and it would seem not improbable that then there was no clear distinction between oak and terebinth in the minds of the Old Testament. writers; yet the two are very different trees to any but the most superficial observation.<P>The terebinth—Pistacia terebinthus (Natural Order, Anacardiaceae), Arabic Butm]—is a tree allied to the P. vera, which produces the pistachio nut, and to the familiar "pepper tree" (Schinus molle) so extensively cultivated in modern Palestine. Like the latter the terebinth has red berries, like small immature grapes. The leaves are pinnate, four to six pairs, and they change color and fall in autumn, leaving the trunk bare (compare <a onClick="return mV(\'Isa\',1,30);">Isa 1:30</a>). The terebinth is liable to be infected by many showy galls, some varieties looking like pieces of red coral. In Palestine, this tree assumes noble proportions, especially in situations when, from its association with some sacred tomb, it is allowed to flourish undisturbed. It is in such situations not infrequently as much as 40 ft. high and spreads its branches, with their thick, dark-green foliage, over a wide area (compare <a onClick="return mV(\'2Sa\',18,9,14);">2Sa 18:9f;14</a>; Ecclesiasticus 24:16). Dwarfed trees occur among the brushwood all over the land.<P>From this tree a kind of turpentine is obtained, hence, the alternative name "turpentine tree" (Ecclesiasticus 24:16 the King James Version, the Revised Version (British and American) "terebinth").``117';
isbe[8690]='Teresh`te\'-resh (teresh (<a onClick="return mV(\'Est\',2,21);">Es 2:21</a>; <a onClick="return mV(\'Est\',6,2);">6:2</a>); Codex Vaticanus, Codex Alexandrinus, and Codex Sinaiticus omit it; but Codex Sinaiticus\' margin has Tharas and Tharras): A chamberlain of King Ahasuerus. Oppert compares the name with Tiri-dates, the name of the governor of Persepolis in the time of Alexander. Another explanation identifies it with the Persian word turs "firm"; Scheft links it with the Persian tarsha, "desire."``1';
isbe[8691]='Terrace`ter\'-as (mecillah): Solomon is said, in <a onClick="return mV(\'2Ch\',9,11);">2Ch 9:11</a>, to have made of the algum trees brought him from Ophir "terraces," or raised walks, for the house of Yahweh. In the parallel <a onClick="return mV(\'1Ki\',10,12);">1Ki 10:12</a>, the word used is rendered "pillars," margin "\'a railing\'; Hebrew \'a prop.\'"``1';
isbe[8692]='Terrible, Terror`ter\'-i-b\'l, ter\'-er (yare\', "to be feared," "reverenced," arits, "powerful," "tyrannical," \'ayom, "aweinspiring," chittith "terror," ballahah, "a worn-out or wasted thing," \'emah, "fright"; phoberos, "dreadful," phobos, "fear"): The above terms, and many others which employed, denote whatever, by horrible aspect, or by greatness, power, or cruelty, affrights men (<a onClick="return mV(\'Deu\',1,19);">De 1:19</a>; <a onClick="return mV(\'Deu\',26,8);">26:8</a>; <a onClick="return mV(\'Dan\',2,31);">Da 2:31</a>). God is terrible by reason of His awful greatness, His infinite power, His inscrutable dealings, His perfect holiness, His covenant faithfulness, His strict justice and fearful judgments (<a onClick="return mV(\'Exd\',34,10);">Ex 34:10</a>; <a onClick="return mV(\'Deu\',7,21);">De 7:21</a>; <a onClick="return mV(\'Neh\',9,32);">Ne 9:32</a>; <a onClick="return mV(\'Job\',6,4);">Job 6:4</a>; <a onClick="return mV(\'Job\',37,22);">37:22</a>; <a onClick="return mV(\'Psa\',65,5);">Ps 65:5</a>; <a onClick="return mV(\'Psa\',88,15);">88:15</a>f; <a onClick="return mV(\'Joe\',2,11);">Joe 2:11</a>; <a onClick="return mV(\'Zep\',2,11);">Ze 2:11</a>; <a onClick="return mV(\'Hbr\',12,21);">Heb 12:21</a>). The term is also applied to the enemies of God and of His people (<a onClick="return mV(\'Isa\',13,11);">Isa 13:11</a>; <a onClick="return mV(\'Isa\',25,3);">25:3</a>ff; <a onClick="return mV(\'Isa\',49,25);">49:25</a>; <a onClick="return mV(\'Dan\',7,7);">Da 7:7</a>; <a onClick="return mV(\'1Pe\',3,14);">1Pe 3:14</a>). "The terror (the Revised Version (British and American) "fear") of the Lord" (<a onClick="return mV(\'2Cr\',5,11);">2Co 5:11</a>) denotes the reverence or fear inspired by the thought that Christ is judge (<a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>).``91';
isbe[8693]='Tertius`tur\'-shi-us (Tertios): The amanuensis of Paul who wrote at his dictation the Epistle to the Romans. In the midst of Paul\'s greetings to the Christians in Rome he interpolated his own, "I Tertius, who write the epistle, salute you in the Lord" (<a onClick="return mV(\'Rom\',16,22);">Ro 16:22</a>). "It is as a Christian, not in virtue of any other relation he has to the Romans, that Tertius salutes them" (Denney). Some identify him with Silas, owing to the fact that shalish is the Hebrew for "third (officer)," as tertius is the Latin Others think he was a Roman Christian residing in Corinth. This is, however, merely conjecture. Paul seems to have dictated his letters to an amanuensis, adding by his own hand merely the concluding sentences as "the token in every epistle" (<a onClick="return mV(\'2Th\',3,17);">2Th 3:17</a>; <a onClick="return mV(\'Col\',4,18);">Col 4:18</a>; <a onClick="return mV(\'1Cr\',16,21);">1Co 16:21</a>). How far this may have influenced the style of his letters is discussed in Sanday-Headlam, Romans, Introduction, LX.``78';
isbe[8694]='Tertullus`ter-tul\'-us, ter- (Tertullos, diminutive of Latin tertius, "third"):, An orator who descended with Ananias the high priest and elders from Jerusalem to Caesarea to accuse Paul before Felix the Roman governor (<a onClick="return mV(\'Act\',24,1);">Ac 24:1</a>). Tertullus was a hired pleader whose services were necessary that the case for the Jews might be stated in proper form. Although he bore a Roman name, he was not necessarily a Roman; Roman names were common both among Greeks and Jews, and most orators were at this time of eastern extraction. Nor is it definitely to be concluded from the manner of his speech (<a onClick="return mV(\'Act\',24,\'2-8\');">Ac 24:2-8</a>) that he was a Jew; it has always been customary for lawyers to identify themselves in their pleading with their clients. His speech before Felix is marked by considerable ingenuity. It begins with an adulation of the governorship of Felix that was little in accord with history (see <a href="./study/isbe/search.html?string=FELIX">FELIX</A>); and the subsequent argument is an example of how a strong case may apparently be made out by the skillful manipulation of half-truths. Thus the riot at Jerusalem was ascribed to the sedition-mongering of Paul, who thereby proved himself an enemy of Roman rule and Jewish religion, both of which Felix was pledged to uphold. Again, the arrest of Paul was not an act of mob violence, but was legally carried out by the high priests and elders in the interests of peace; and but for the unwarranted interference of Lysias (see <a href="./study/isbe/search.html?string=LYSIAS">LYSIAS</A>), they would have dealt with the prisoner in their own courts and thus have avoided trespassing on the time of Felix. They were, however, perfectly willing to submit the whole case to his jurisdiction. It is interesting to compare this speech of Tertullus with the true account, as given in <a onClick="return mV(\'Act\',21,\'27-35\');">Ac 21:27-35</a>, and also with the letter of Lysias (<a onClick="return mV(\'Act\',23,\'26-30\');">Ac 23:26-30</a>).``88';
isbe[8695]='Testament`tes\'-ta-ment: The word diatheke, almost invariably rendered "covenant," was rendered in the King James Version "testament" in <a onClick="return mV(\'Hbr\',9,16,17);">Heb 9:16,17</a>, in the sense of a will to dispose of property after the maker\'s death. It is not easy to find justification for the retention of this translation in the Revised Version (British and American), "especially in a book which is so impregnated with the language of the Septuagint as the Epistle to the Hebrews" (Hatch).`<a href="./study/isbe/search.html?string=COVENANT,+IN+THE+NEW+TESTAMENT">COVENANT, IN THE NEW TESTAMENT</a>`1';
