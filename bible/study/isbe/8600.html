isbe[8601]='Talmud`tal\'-mud (talmudh):<P><b>I. PRELIMINARY REMARKS AND VERBAL EXPLANATIONS</b><P><b>II. IMPORTANCE OF THE TALMUD</b><P><b>III. THE TRADITIONAL LAW UNTIL THE COMPOSITION OF THE MISHNA</b><P><b>IV. DIVISION AND CONTENTS OF THE MISHNA (AND THE TALMUD)</b><P class="in15">1. Zera\'im, "Seeds"<P class="in15">2. Mo\'edh, "Feasts"<P class="in15">3. Nashim, "Women"<P class="in15">4. Neziqin, "Damages"<P class="in15">5. Kodhashim, "Sacred Things"<P class="in15">6. Teharoth, "Clean Things"<P class="in15"><b>V. THE PALESTINIAN TALMUD</b><P><b>VI. THE BABYLONIAN TALMUD</b><P><b>VII. THE NON-CANONICAL LITTLE TREATISES AND THE TOSEPHTA\'</b><P class="in15">1. Treatises after the 4th Cedher<P class="in15">2. Seven Little Treatises<P><b>LITERATURE</b><hr /><P>The present writer is, for brevity\'s sake, under necessity to refer to his Einleitung in den Talmud, 4th edition, Leipzig, 1908. It is quoted here as Introduction.<P>There are very few books which are mentioned so often and yet are so little known as the Talmud. It is perhaps true that nobody can now be found, who, as did the Capuchin monk Henricus Seynensis, thinks that "Talmud" is the name of a rabbi. Yet a great deal of ignorance on this subject still prevails in many circles. Many are afraid to inform themselves, as this may be too difficult or too tedious; others (the anti-Semites) do not want correct information to be spread on this subject, because this would interfere seriously with their use of the Talmud as a means for their agitation against the Jews.<P>I. Preliminary Remarks and Verbal Explanations.<P>(1) Mishnah, "the oral doctrine and the study of it" (from shanah, "to repeat," "to learn," "to teach"), especially<P>(a) the whole of the oral law which had come into existence up to the end of the 2nd century AD;<P>(b) the whole of the teaching of one of the rabbis living during the first two centuries AD (tanna\', plural tanna\'im);<P>(c) a single tenet;<P>(d) a collection of such tenets;<P>(e) above all, the collection made by Rabbi Jehudah (or Judah) ha-Nasi\'.<P>(2) Gemara\', "the matter that is leaned" (from gemar, "to accomplish," "to learn"), denotes since the 9th century the collection of the discussions of the Amoraim, i.e. of the rabbis teaching from about 200 to 500 AD.<P>(3) Talmudh, "the studying" or "the teaching," was in older times used for the discussions of the Amoraim; now it means the Mishna with the discussions thereupon.<P>(4) Halakhah (from halakh, "to go"): (a) the life as far as it is ruled by the Law; (b) a statutory precept.<P>(5) Haggadhah (from higgidh, "to tell"), the non-halakhic exegesis.<P>II. Importance of the Talmud.<P>Commonly the Talmud is declared to be the Jewish code of Law. But this is not the case, even for the traditional or "orthodox" Jews. Really the Talmud is the source whence the Jewish Law is to be derived. Whosoever wants to show what the Jewish Law says about a certain case (point, question) has to compare at first the Shulchan \'arukh with its commentary, then the other codices (Maimonides, Alphasi, etc.) and the Responsa, and finally the Talmudic discussions; but he is not allowed to give a decisive sentence on the authority of the Talmud alone (see Intro,116,117; David Hoffmann, Der Schulchan-Aruch, 2nd edition, Berlin,1894,38, 39). On the other hand, no decision is valid if it is against the yield of the Talmudic discussion. The liberal (Reformed) Jews say that the Talmud, though it is interesting and, as a Jewish work of antiquity, ever venerable, has in itself no authority for faith and life.<P>For both Christians and Jews the Talmud is of value for the following reasons:<P>(1) on account of the language, Hebrew being used in many parts of the Talmud (especially in Haggadic pieces), Palestinian Aramaic in the Palestinian Talmud, Eastern Aramaic in the Babylonian Talmud (compare "Literature," (7), below). The Talmud also contains words of Babylonian and Persian origin;<P>(2) for folklore, history, geography, natural and medical science, jurisprudence, archaeology and the understanding of the Old Testament (see "Literature," (6), below, and Introduction, 159-75). For Christians especially the Talmud contains very much which may help the understanding of the New Testament (see "Literature," (12), below).<P>III. The Traditional Law until the Composition of the Mishna.<P>The Law found in the Torah of Moses was the only written law which the Jews possessed after their return from the Babylonian exile. This law was neither complete nor sufficient for all times. On account of the ever-changing conditions of life new ordinances became necessary. Who made these we do not know. An authority to do this must have existed; but the claim made by many that after the days of Ezra there existed a college of 120 men called the "Great Synagogue" cannot be proved. Entirely untenable also is the claim of the traditionally orthodox Jews, that ever since the days of Moses there had been in existence, side by side with the written Law, also an oral Law, with all necessary explanations and supplements to the written Law.<P>What was added to the Pentateuchal Torah was for a long time handed down orally, as can be plainly seen from Josephus and Philo. The increase of such material made it necessary to arrange it. An arrangement according to subject-matter can be traced back to the 1st century AD; very old, perhaps even older, is also the formal adjustment of this material to the Pentateuchal Law, the form of Exegesis (Midrash). Compare Introduction, 19-21.<P>A comprehensive collection of traditional laws was made by Rabbi Aqiba circa 110-35 AD, if not by an earlier scholar. His work formed the basis of that of Rabbi Me\'ir, and this again was the basis of the edition of the Mishna by Rabbi Jehudah ha-Nasi\'. In this Mishna, the Mishna par excellence, the anonymous portions generally, although not always, reproduce the views of Rabbi Me\'ir.<P>See <a href="./study/isbe/search.html?string=TIBERIAS">TIBERIAS</A>.<P>The predecessors Rabbi (as R. Jehudah ha-Nasi\', the "prince" or the "saint," is usually called), as far as we know, did not put into written form their collections; indeed it has been denied by many, especially by German and French rabbis of the Middle Ages, that Rabbi put into written form the Mishna which he edited. Probably the fact of the matter is that the traditional Law was not allowed to be used in written form for the purposes of instruction and in decisions on matters of the Law, but that written collections of a private character, collections of notes, to use a modern term, existed already at an early period (see Intro, 10ff).<P>IV. Division and Contents of the Mishna (and the Talmud).<P>The Mishna (as also the Talmud) is divided into six "orders" (cedharim) or chief parts, the names of which indicate their chief contents, namely, Zera\'im, Agriculture; Moe\'dh, Feasts; Nashim, Women; Neziqin, Civil and Criminal Law; Qodhashim, Sacrifices; Teharoth, Unclean Things and Their Purification.<P>The "orders" are divided into tracts (maccekheth, plural maccikhtoth), now 63, and these again into chapters (pereq, plural peraqim), and these again into paragraphs (mishnayoth). It is Customary to cite the Mishna according to tract chapter and paragraph, e.g. Sanh. (Sanhedhrin) x.1. The Babylonian Talmud is cited according to tract and page, e.g. (Babylonian Talmud) Shabbath 30b; in citing the Palestinian Talmud the number of the chapter is also usually given, e.g. (Palestinian Talmud) Shabbath vi.8d (in most of the editions of the Palestinian Talmud each page has two columns, the sheet accordingly has four).<P>1. Zera\'im, "Seeds":<P>(1) Berakhoth, "Benedictions": "Hear, O Israel" (<a onClick="return mV(\'Deu\',6,4);">De 6:4</a>, shema\'); the 18 benedictions, grace at meals, and other prayers.<P>(2) Pe\'ah, "Corner" of the field (<a onClick="return mV(\'Lev\',19,9);">Le 19:9</a>f; <a onClick="return mV(\'Deu\',24,19);">De 24:19</a>).<P>(3) Dema\'i, "Doubtful" fruits (grain, etc.) of which it is uncertain whether the duty for the priests and, in the fixed years, the 2nd tithe have been paid.<P>(4) Kil\'ayim, "Heterogeneous," two kinds, forbidden mixtures (<a onClick="return mV(\'Lev\',19,19);">Le 19:19</a>; <a onClick="return mV(\'Deu\',22,9);">De 22:9</a>).<P>(5) Shebhi\'ith, "Seventh Year," Sabbatical year (<a onClick="return mV(\'Exd\',23,11);">Ex 23:11</a>; <a onClick="return mV(\'Lev\',25,1);">Le 25:1</a>); Shemiqqah (<a onClick="return mV(\'Deu\',15,1);">De 15:1</a>).<P>(6) Terumoth, "Heave Offerings" for the priests (<a onClick="return mV(\'Num\',18,8);">Nu 18:8</a>ff; <a onClick="return mV(\'Deu\',18,4);">De 18:4</a>).<P>(7) Ma\'aseroth or Ma\'aser ri\'shon, "First Tithe" (<a onClick="return mV(\'Num\',18,21);">Nu 18:21</a>).<P>(8) Ma\'aser sheni, "Second Tithe" (<a onClick="return mV(\'Deu\',14,22);">De 14:22</a>).<P>(9) Challah, (offering of a part of the) "Dough" (<a onClick="return mV(\'Num\',15,18);">Nu 15:18</a>).<P>(10) \'Orlah, "Foreskin" of fruit trees during the first three years (<a onClick="return mV(\'Lev\',19,23);">Le 19:23</a>).<P>(11) Bikkurim, "First-Fruits" (<a onClick="return mV(\'Deu\',26,1);">De 26:1</a>ff; <a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>).<P>2. Mo\'edh, "Feasts":<P>(1) Shabbath (<a onClick="return mV(\'Exd\',20,10);">Ex 20:10</a>; <a onClick="return mV(\'Exd\',23,12);">23:12</a>; <a onClick="return mV(\'Deu\',5,14);">De 5:14</a>).<P>(2) \'Erubhin, "Mixtures," i.e. ideal combination of localities with the purpose of facilitating the observance of the Sabbatical laws.<P>(3) Pesachim, "Passover" (<a onClick="return mV(\'Exd\',12,\'1-\');">Ex 12</a>; <a onClick="return mV(\'Lev\',23,5);">Le 23:5</a>ff; <a onClick="return mV(\'Num\',28,16);">Nu 28:16</a>ff; <a onClick="return mV(\'Deu\',16,1);">De 16:1</a>); <a onClick="return mV(\'Num\',9,\'1-\');">Numbers 9</a>, the Second Passover (<a onClick="return mV(\'Num\',9,10);">Nu 9:10</a>). (4) Sheqalim, "Shekels" for the Temple (compare <a onClick="return mV(\'Neh\',10,33);">Ne 10:33</a>; <a onClick="return mV(\'Exd\',30,12);">Ex 30:12</a>ff).<P>(5) Yoma\', "The Day" of Atonement (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>).<P>(6) Cukkah, "Booth," Feast of Tabernacles (<a onClick="return mV(\'Lev\',23,34);">Le 23:34</a>ff; <a onClick="return mV(\'Num\',29,12);">Nu 29:12</a>ff; <a onClick="return mV(\'Deu\',16,13);">De 16:13</a>).<P>(7) Betsah, "Egg" (first word of the treatise) or Yom Tobh, "Feast," on the difference between the Sabbath and festivals (compare <a onClick="return mV(\'Exd\',12,10);">Ex 12:10</a>).<P>(8) Ro\'sh ha-shanah, "New Year," first day of the month Tishri (<a onClick="return mV(\'Lev\',23,24);">Le 23:24</a>f; <a onClick="return mV(\'Num\',29,1);">Nu 29:1</a>).<P>(9) Ta\'anith, "Fasting."<P>(10) Meghillah, "The Roll" of Esther, Purim (<a onClick="return mV(\'Est\',9,28);">Es 9:28</a>).<P>(11) Mo\'edh qatan, "Minor Feast," or Mashqin, "They irrigate" (first word of the treatise), the days between the first day and the last day of the feast of Passover, and likewise of Tabernacles.<P>(12) Chaghighah, "Feast Offering," statutes relating to the three feasts of pilgrimage (Passover, Weeks, Tabernacles); compare <a onClick="return mV(\'Deu\',16,16);">De 16:16</a> f.<P>3. Nashim, "Women":<P>(1) Yebhamoth, "Sisters-in-Law" (perhaps better, Yebhamuth, Levirate marriage; <a onClick="return mV(\'Deu\',25,5);">De 25:5</a>ff; compare <a onClick="return mV(\'Rth\',4,5);">Ru 4:5</a>; <a onClick="return mV(\'Mat\',22,24);">Mt 22:24</a>).<P>(2) Kethubhoth, "Marriage Deeds."<P>(3) Nedharim, "Vows," and their annulment (<a onClick="return mV(\'Num\',30,\'1-\');">Nu 30</a>).<P>(4) Nazir, "Nazirite" (<a onClick="return mV(\'Num\',6,\'1-\');">Nu 6</a>).<P>(5) Gittin, "Letters of Divorce" (<a onClick="return mV(\'Deu\',24,1);">De 24:1</a>; compare <a onClick="return mV(\'Mat\',5,31);">Mt 5:31</a>).<P>(6) Cotah, "The Suspected Woman" (<a onClick="return mV(\'Num\',5,11);">Nu 5:11</a>).<P>(7) Qiddushin, "Betrothals."<P>4. Nezikin, "Damages":<P>(1) (2) and (3) Babha\' qamma\', Babha\' metsi\'a\', Babha\' bathra\', "The First Gate," "The Second Gate," "The Last Gate," were in ancient times only one treatise called Neziqin: (a) Damages and injuries and the responsibility; (b) and (c) right of possession.<P>(4) and (5) Sanhedhrin, "Court of Justice," and Makkoth "Stripes" (<a onClick="return mV(\'Deu\',25,1);">De 25:1</a>ff; compare <a onClick="return mV(\'1Cr\',11,24);">1Co 11:24</a>). In ancient times only one treatise; criminal law and criminal proceedings.<P>(6) Shebhu\'oth, "Oaths" (<a onClick="return mV(\'Lev\',5,1);">Le 5:1</a>ff).<P>(7) \'Edhuyoth, "Attestations" of later teachers as to the opinions of former authorities.<P>(8) \'Abhodhah zarah, "Idolatry," commerce and intercourse with idolaters.<P>(9) \'Abhoth, (sayings of the) "Fathers"; sayings of the Tanna\'im.<P>(10) Horayoth, (erroneous) "Decisions," and the sin offering to be brought in such a case (<a onClick="return mV(\'Lev\',4,13);">Le 4:13</a>ff).<P>5. Qodhashim, "Sacred Things":<P>(1) Zebhahim, "Sacrifices" (<a onClick="return mV(\'Lev\',1,\'1-\');">Le 1</a>ff).<P>(2) Menachoth, "Meal Offerings" (<a onClick="return mV(\'Lev\',2,5,11);">Le 2:5,11</a>; <a onClick="return mV(\'Lev\',6,7);">6:7</a>; <a onClick="return mV(\'Num\',5,15);">Nu 5:15</a>, etc.).<P>(3) Chullin, "Common Things," things non-sacred; slaughtering of animals and birds for ordinary use.<P>(4) Bekhoroth, "The Firstborn" (<a onClick="return mV(\'Exd\',13,2,12);">Ex 13:2,12</a>; <a onClick="return mV(\'Lev\',27,26,32);">Le 27:26,32</a>; <a onClick="return mV(\'Num\',8,6);">Nu 8:6</a>, etc.).<P>(5) \'Arakhin, "Estimates," "Valuations" of persons and things dedicated to God (<a onClick="return mV(\'Lev\',27,2);">Le 27:2</a>).<P>(6) Temurah, "Substitution" of a common (non-sacred) thing for a sacred one (compare <a onClick="return mV(\'Lev\',27,10,33);">Le 27:10,33</a>).<P>(7) Kerithoth, "Excisions," the punishment of being cut off from Israel (<a onClick="return mV(\'Gen\',17,14);">Ge 17:14</a>; <a onClick="return mV(\'Exd\',12,15);">Ex 12:15</a>, etc.).<P>(8) Me\'ilah, "Unfaithfulness," as to sacred things, embezzlement (<a onClick="return mV(\'Num\',5,6);">Nu 5:6</a>; <a onClick="return mV(\'Lev\',5,15);">Le 5:15</a>).<P>(9) Tamidh, "The Daily Morning and Evening Sacrifice" (<a onClick="return mV(\'Exd\',29,38);">Ex 29:38</a>; <a onClick="return mV(\'Num\',28,3);">Nu 28:3</A>).<P>(10) Middoth, "Measurements" of the Temple.<P>(11) Qinnim, "Nests," the offering of two turtle-doves or two young pigeons (<a onClick="return mV(\'Lev\',1,14);">Le 1:14</a>ff; <a onClick="return mV(\'Lev\',5,1);">5:1</a>ff; <a onClick="return mV(\'Lev\',12,8);">12:8</a>).<P>6. Teharoth, "Clean Things":<P>This title is used euphemistically for "unclean things":<P>(1) Kelim, "Vessels" (<a onClick="return mV(\'Lev\',6,20);">Le 6:20</a>f; <a onClick="return mV(\'Lev\',11,32);">11:32</a>ff; <a onClick="return mV(\'Num\',19,14);">Nu 19:14</a>ff; <a onClick="return mV(\'Num\',31,20);">31:20</a>).<P>(2) \'Oholoth, "Tents," the impurity originating with a corpse or a part of it (compare <a onClick="return mV(\'Num\',19,14);">Nu 19:14</a>).<P>(3) Negha\'im, "Leprosy" (<a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a>; <a onClick="return mV(\'Lev\',14,\'1-\');">14</a>).<P>(4) Parah, "Red Heifer"; its ashes used for the purpose of purification (<a onClick="return mV(\'Num\',19,2);">Nu 19:2</a>).<P>See <a href="./study/isbe/search.html?string=HEIFER,+RED">HEIFER, RED</A>.<P>(5) Teharoth, "Clean Things," euphemistically for defilements.<P>(6) Mikwa\'oth, "Diving-Baths" (<a onClick="return mV(\'Lev\',15,12);">Le 15:12</a>; <a onClick="return mV(\'Num\',31,33);">Nu 31:33</a>; <a onClick="return mV(\'Lev\',14,8);">Le 14:8</a>; <a onClick="return mV(\'Lev\',15,5);">15:5</a>ff; compare <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>).<P>(7) Niddah, "The Menstruous" (<a onClick="return mV(\'Lev\',15,19);">Le 15:19</a>ff; <a onClick="return mV(\'Lev\',12,\'1-\');">12</a>).<P>(8) Makhshirin, "Preparers," or Mashqin, "Fluids" (first word of the treatise). Seven liquids (wine, honey, oil, milk, dew, blood, water) which tend to cause grain, etc., to become defiled (compare <a onClick="return mV(\'Lev\',11,34,37);">Le 11:34,37</a>f) .<P>(9) Zabhim, "Persons Having an Issue," flux (<a onClick="return mV(\'Lev\',15,\'1-\');">Le 15</a>).<P>(10) Tebhul yom, "A Person Who Has Taken the Ritual Bath during the Day," and is unclean until sunset (<a onClick="return mV(\'Lev\',15,5);">Le 15:5</a>; <a onClick="return mV(\'Lev\',22,6);">22:6</a>f).<P>(11) Yadhayim, "Hands," the ritual impurity of hands and their purification (compare <a onClick="return mV(\'Mat\',15,2,20);">Mt 15:2,20</a>; <a onClick="return mV(\'Mar\',7,22);">Mr 7:22</a>ff).<P>(12) \'Uqtsin, "Stalks," the conveyance of ritual impurity by means of the stalks and hulls of plants.<P>V. The Palestinian Talmud.<P>Another name, Talmudh Yerushalmi ("Jerusalem Talmud"), is also old, but not accurate. The Palestinian Talmud gives the discussions of the Palestinian Amoraim, teaching from the 3rd century AD until the beginning of the 5th, especially in the schools or academies of Tiberias, Caesarea and Sepphoris. The editions and the Leyden manuscript (in the other manuscripts there are but few treatises) contain only the four cedharim i-iv and a part of Niddah. We do not know whether the other treatises had at any time a Palestinian Gemara. "The Mishna on which the Palestinian Talmud rests" is said to be found in the manuscript Add. 470,1 of the University Library, Cambridge, England (ed W.H. Lowe, 1883). The treatises \'Edhuyoth and \'Abhoth have no Gemara in the Palestinian Talmud or in the Babylonian.<P>Some of the most famous Palestinian Amoraim may be mentioned here (compare Introduction, 99ff): 1st generation: Chanina bar Chama, Jannai, Jonathan, Osha\'ya, the Haggadist Joshua ben Levi; 2nd generation: Jochnnan bar Nappacha, Simeon ben Lackish; 3rd generation: Samuel bar Nachman, Levi, Eliezer ben Pedath, Abbahu, Ze\'ira (i); 4th generation: Jeremiah, Acha\', Abin (i), Judah, Huna; 5th generation: Jonah, Phinehas, Berechiah, Jose bar Abin, Mani (ii), Tanhuma\'.<P>VI. The Babylonian Talmud.<P>The Babylonian Talmud is later and more voluminous than the Palestinian Talmud, and is a higher authority for the Jews. In the first cedher only Berakhoth has a Gemara; Sheqalim in the 2nd cedher has in the manuscripts and in the editions the Palestinian Gemara; Middoth and Qinnim in the 5th cedher have no Babylonian Gemara. The greatest Jewish academies in Babylonia were in Nehardea, Cura, Pumbeditha and Mahuza.<P>Among the greatest Babylonian Amoraim are the following (compare Introduction, 99ff): 1st generation: Abba Arikha or, shortly, Rab in Cura (died 247 AD). Mar Samuel in Nehardea (died 254 AD). 2nd generation: Rab Huna, Rab Judah (bar Ezekiel). 3rd generation: Rab Chisda, Rab Shesheth, Rab Nachman (bar Jacob), Rabbah bar Chana, the story-teller, Rabbah bar Nahmai, Rab Joseph (died 323 AD). 4th generation: Abaye, Raba\' (bar Joseph). 5th generation: Rab Papa. 6th generation: Amemar, Rab Ashi.<P>VII. The Non-canonical Little Treatises and the Tocephta\'.<P>In the editions of the Babylonian Talmud after the 4th cedher we find some treatises which, as they are not without some interest, we shall not pass over in silence, though they do not belong to the Talmud itself (compare Introduction, 69ff).<P>1. Treatises after the 4th Cedher:<P>(1) \'Abhoth deRabbi Nathan, an expansion of the treatise \'Abhoth, edition. S. Schechter, Vienna, 1887.<P>(2) Copherim, edition Joe Muller, Leipzig, 1878.<P>(3) \'Ebhel Rabbathi, "Mourning," or, euphemistically, Semachoth, "Joys."<P>(4) Kallah, "Bride."<P>(5) Derekh \'erets, "Way of the World," i.e. Deportment; Rabba\' and Zuta\', "Large" and "Small."<P>2. Seven Little Treatises:<P>Septem Libri Talmudici parvi Hierolymitani, edition. R. Kirchheim, Frankfurt a. Main, 1851: Cepher Torah, Mezuzah, Tephillin, Tsitsith, \'Abhadhim, Kuthim (Samaritans), Gerim (Proselytes).<P>The Tocephta\', a work parallel to Rabbi\'s Mishna, is said to represent the views of R. Nehemiah, disciple of R. Aqiba, edition. M. S. Zuckermandel, Posewalk, 1880. Zuckermandel tries to show that the Tocephta\' contains the remains of the old Palestinian Mishna, and that the work commonly called Mishna is the product of a new revision in Babylonia (compare his Tosephta, Mischna und Boraitha in ihrem Verhaltnis zu einander, 2 volumes, Frankfurt a. Main, 1908, 1909).<P>LITERATURE.<P>(1) Introductions:<P>Hermann L. Strack, Einleitung in d. Talmud, 4th edition, Leipzig,1908,in which other books on this subject are mentioned, pp. 139-44.<P>(2) Manuscripts (Introduction, 72-76):<P>There are manuscripts of the whole Mishna in Parma, in Budapest, and in Cambridge, England (the latter is published by W.H. Lowe, 1883). The only codex of the Palestinian Talmud is in Leyden; Louis Ginsberg, Yerushalmi Fragments from the Genizah, volume I, text with various readings from the editio princeps, New York, 1909 (372 pp., 4to). The only codex of the Babylonian Talmud was published whole in 1912 by the present writer: Talmud Babylonian codicis Hebrew Monacensis 95 phototypice depictum, Leyden (1140 plates, royal folio). On the manuscripts in the Vatican see S. Ochser, ZDMG,1909,365-93,126, 822 f.<P>(3) Editions (Introduction, 76-81):<P>(a) Mishna, editio princeps, Naples,1492,folio, with the commentary of Moses Maimonides; Riva di Trento,1559,folio, contains also the commentary of Obadiah di Bertinoro. The new edition printed in Wilna contains a great number of commentaries<P>(b) Palestinian Talmud, editio princeps, Venice, 1523f; folio; Cracow,1609,folio. Of a new edition begun by Asia Minor Luncz, Jerusalem, 1908ff, two books, Berakhoth and Pe\'ah, are already published. Another new critical edition, with German translation and notes, was begun in 1912 by G. Beer and O. Holtzman (Die Mischna, Giessen). Compare also B. Ratner, Ahabath Tsijjon Wirushalayim, Varianten und Erganzungen des Jerusalem Talmuds, Wilna, 1901ff.<P>(c) Babylonian Talmud, editio princeps, Venice, 1520-23. The edition, Bale, 1578-81, is badly disfigured by the censorship of Marcus Marinus, Amsterdam, 1644-48, Berlin 1862-66. Compare R. Rabbinowicz, Variae Lectiones in Mishna et in Talmud Babylonicum, Munich, 1868-86, Przemysl, 1897 (the cedharim 3, 6 and 5 in part are missing).<P>(4) Translations:<P>E. Bischoff, Krit. Geschichte d. Tal-mudubersetzungen, Frankfurt a. Main, 1899.<P>(a) Mishna, Latin: Gull. Surenhusius, Amsterdam, 1698-1703 (contains also a translation of Maimonides and Obadiah di Bertinoro); German.: J.J. Rabe, Onolzbach, 1760ff; A. Saminter, D. Hoffmann and others, Berlin, 1887ff (not yet complete); English: De Sola and Raphall, 18 Treatises from the Mishna, London, 1843; Josephus Barclay, The Talmud, a Translation of 18 Treatises, London, 1878 (but 7 treatises also in De Sola and Raphall; Fiebig, Ausgewahlte Mischnatractate, Tubingen, 1905ff (annotated German translation).<P>(b) Palestinian Talmud, Latin: 20 treatises in B. Ugolini, Thesaurus antiquitatum sacrarum, volumes XVII-XXX, Venice, 1755ff. French: M. Schwab, Paris, 1878-89 (in 1890 appeared a 2nd edition of volume I).<P>(c) Babylonian Talmud, German.: L. Goldschmidt, Berlin (Leipzig), 1897ff; gives also the text of the 1st Venetian edition and some variant readings (cedharim 1,2,and 4 are complete); A. Wunsche, Der Babylonian Talmud in seinen haggadischen Bestandteilen ubersetzt, Leipzig, 1886-89. English: M.L. Rodkinson, New Edition of the Babylonian Talmud...Translated into English, New York, 1896ff (is rather an abridgment (unreliable)).<P>(5) Commentaries (Introduction, 146-51):<P>(a) Mishna:<P>Moses Maimonides (1135-1204), Obadiah di Bertinoro (died 1510), Yom-Tobh Lipmann Heller (1579-1654), Israel Lipschutz.<P>(b) Babylonian Talmud:<P>Rashi or Solomon Yitschaqi (died 1105); The Tosaphoth (see L. Zunz, Zur Geschichte und Literatur, Berlin, 1845, 29-60); Menahem ben Solomon or Me\'-iri (1249-1306); Solomon Luria (died 1573), commonly called Maharshal; Bezaleel Ashkenazi (16th century), author of the Shittah Mequbbetseth; Samuel Edels (1559-1631) or Maharsha\'; Meir Lublin (died 1616); Elijah Wilna (died 1797); Aqiba Eger (died 1837).<P>(6) Single Treatises (Compare Introduction, 151-55):<P>(a) Mishna:<P>The present writer is publishing: Ausgewahlte Misnatraktate, nach Handschriften und alten Drucken (Text vokalisiert, Vokabular), ubersetzt und mit Berucksichtigung des Neuen Testaments erlautert, Leipzig (J. C. Hinrichs); Yoma\', 3rd edition,1912,\'Abhodhah Zarah, 2nd edition,1909,Pirqe \'Abhoth, 4th edition,1914,Shabbath, 2nd edition,1914,Sanhedhrin, Makkoth,1910,Pecachim 1911, Berakhoth, 1914. This series is to be continued (H. Laible, e.g., is writing Nedharim); Ch. Taylor, Sayings of the Jewish Fathers, in Hebrew and English, 2nd edition, Cambridge, 1897; W. A. L. Elmslie, The Mishna on Idolatry, with Translation, Cambridge, 1911.<P>(b) Gemara, Berakhoth, German:<P>E. M. Pinner, Berlin,1842,fol; Pe\'ah (Palestintan Talmud), German.: J. J. Rabe, Ansbach, 1781; Cukkah, Latin: F. B. Dachs, Utrecht,1726,4to; Ro\'sh ha-shanah, German: M. Rawicz, Frankfurt a. Main, 1886; Ta\'anith German.: Straschun Halle, 1883; Chaghighah, English: A. W. Streane Cambridge, 1891; Kethubhoth, German: M. Rawicz, 1891; Cotah, Latin: J. Chr. Wagenseil, Altdorf, 1674-78; Babha\' Metsi\'a\', German: A. Sammter, Berlin, 1876, fol; Sanhedhrin, Latin: Ugolini, Thesaurus, volume XXV, German.: M. Rawicz, 1892; \'Abhodhah Zarah, German: F. Chr. Ewald, Nurnberg, 1856; Zebhachin and Menachoth, Latin: Ugolini, Thesaurus, volume XIX; Hullin, German: M. Rawicz, Offenburg, 1908; Tamidh, Latin: Ugolini, Thesaurus, Vol XIX.<P>(7) Helps for the Grammatical Understanding (Introduction, 155-58):<P>(a) Mishna:<P>M. H. Segal, "Misnaic Hebrew," JQR,1908,647-737; K. Albrecht, Grammatik des Neuhebraischen (Sprache der Mishna), Munich, 1913;<P>(b) Talmud:<P>J. Levy, Neuhebr. und chald. Worterbuch, Leipzig, 1876-89; M. Jastrow, Dictionary of the...Talmud Babylonian and Yerushalmi, New York, 1886-1903; W. Bacher, Die Terminologie der jud. Traditionsliteratur, Leipzig, 1905; G. Dalman, Grammatik des judischpalastin. Aramaisch, 2nd edition, Leipzig, 1905; C. Levias, Grammar of the Aramaic Idiom Contained in the Babylonian Talmud, Cincinnati, 1900; Max L. Margolis, Grammar of the Aramaic Language of the Babylonian Talmud with a Chrestomathy, Munich, 1909.<P>(8) The Haggadah (Introduction, 159-62):<P>The Haggadic elements of the Palestinian Talmud are collected by Samuel Jaffe in Yepheh Mar\'eh, Constantinople,1587,etc., those of the Babylonian by Jacob ibn Chabib in \'En Ya\'aqobh, Saloniki, about 1516, etc.; W. Bacher, Die Agada der Tannaiten, 2 volumes, Strassburg,1884,1890 (1st volume, 2nd edition, 1903); Die A. der babylon. Amoraer, 1878; Die A. der palastinensischen Amoraer, 1892-99, 3 volumes; P. T. Hershon, A Talmudic Miscellany or 1001 Extracts, London, 1880; Treasures of the Talmud, London, 1882.<P>(9) Theology (Introduction, 162-65):<P>F. Weber, Judische Theologie, 2nd edition, Leipzig, 1897; J. Klausner, Die messianischen Vorstellungen des jud. Volkes im Zeitalter der Tannaiten, Berlin, 1904; R.T. Herford, Christianity in Talmud and Midrash, London, 1903; H.L. Strack, Jesus, die Haretiker und die Christen nach den altesten jud. Angaben (texts, translation, commentary), Leipzig, 1910; L. Blau, Das altjudische Zauberwesen, Budapest, 1898; M. Lazarus, Die Ethik des Judentums, 2 volumes, Frankfurt a. Main,1898,1911.<P>(10) The Talmud and the Old Testament (Introduction, 167f):<P>G. Aicher, Das Altes Testament in der Mischna, Freiburg i. Baden, 1906; V. Aptowitzer, Das Schriftwort in der rabbin. Literatur, 4 parts, Wien, 1906-11 (to be continued; various readings in the quotations); P.T. Hershon, Genesis, with a Talmudical Commentary, London, 1883.<P>(11) The Talmud and the New Testament (Introduction, 165-67):<P>Joh. Lightfoot, Horae hebraicae et talmudicae, edition Leusden, 2 volumes, fol T, Franeker, 1699; Chr. Schottgen, Horae hebraicae et talmudicae in universum Novum Test., 2 volumes, 4to, Dresden, 1733; Franz Delitzsch, "Horae hebraicae et talmudicae," in Zeitschrift fur die gesammte luther. Theologie u. Kirche, 1876-78; Aug. Wunsche, Neue Beitrage zur Erlauterung der Evangelien aus Talmud und Midrash, Goettingen, 1878; Th. Robinson, The Evangelists and the Mishna, London, 1859; W.H. Bennett, The Mishna as Illustrating the Gospels, Cambridge, 1884; Erich Bischoff, Jesus und die Rabbinen, Jesu Bergpredigt und "Himmelreich" in ihrer Unabhangigkeit vom Rabbinismus, Leipzig, 1905.<P>(12) Jurisprudence (Introduction, 169-71):<P>J. L. Saalschtitz, Das Mosaische Recht, 2nd edition, Berlin, 1853; Josephus Kohler, "Darstellung des talludischen Rechts," in Zeitschrift fur vergleichende Rechtswissenschaft,1908,161-264; Z. Frankel, Der gerichtliche Beweis nach mosaisch-talmud. Rechte, Berlin, 1846; P.B. Benny, The Criminal Code of the Jews, London, 1880; S. Mendelsohn, The Criminal Jurisprudence of the Ancient Hebrews, Baltimore, 1891; H.B. Fassel, Das mosaisch-rabbinische Civilrecht, Gross-Kanischa, 2 volumes, 1852-54; Das mos.-rabb. Gerichtsverfahren in civilrechtl. Sachen, 1859; M. Mielziner, The Jewish Law of Marriage and Divorce, Cincinnati, 1884; D.W. Amram, The Jewish Law of Divorce, Philadelphia, 1896; M. Rapaport, Der Talmud und sein Recht, Berlin, 1912.<P>(13) History (Introduction, 171f):<P>J. Derenbourg, Histoire de la Palestine depuis Cyrus jusqu\'a Adrien, Paris, 1867; L. Herzfeld, Handelsgeschichte der Juden des Altertums, 2nd edition, Braunschweig, 1894; A. Buchler, The Political and the Social Leaders of the Jewish Community of Sepphoris, London, 1909; S. Funk, Die Juden in Babylonien 200-500, 2 volumes, Berlin,1902,1908.<P>(14) Medical Science (Intro, 173):<P>Jul. Preuss, Biblisch-talmudische Medizin, Berlin, 1911 (735 pp.); L. Kotelmann, Die Ophthalmologie bei den alten Hebraern, Hamburg, 1910 (436 pp.).<P>(15) Archaeology:<P>Sam. Krauss, Talmudische Archaologic, 3 volumes, Leipzig, 1910-1912.``166';
isbe[8602]='Talsas`tal\'-sas (Codex Alexandrinus Saloas, Codex Vaticanus Zalthas; the Revised Version (British and American) "Saloas"): In 1Esdras 9:22 the King James Version = "Elasha" of <a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>.``1';
isbe[8603]='Tamah`ta\'-ma.`<a href="./study/isbe/search.html?string=TEMAH">TEMAH</a>`1';
isbe[8604]='Tamar (1)`ta\'-mar (tamar, "palm"; Codex Vaticanus Themar; Codex Alexandrinus Thamar (so Codex Vaticanus in Genesis)):<P>(1) The wife of Er, the oldest son of Judah (<a onClick="return mV(\'Gen\',38,6);">Ge 38:6</a>). Upon her husband\'s death under the displeasure of Yahweh, his brother Onan ought to have performed the husband\'s part, but he evaded his duty in this respect, and likewise perished. Shelah, the next brother, was promised to her, but not given. This led Tamar to the extraordinary course narrated in <a onClick="return mV(\'Gen\',38,13);">Ge 38:13</a>ff, on which see <a href="./study/isbe/search.html?string=JUDAH">JUDAH</a>. By her father-in-law she became the mother of Perez and Zerah (the King James Version "Pharez and Zarah"). Judah, who at first condemned her to be burned (<a onClick="return mV(\'Gen\',38,24);">Ge 38:24</a>), was compelled to vindicate her (<a onClick="return mV(\'Gen\',38,25,26);">Ge 38:25,26</a>). Through Perez she became an ancestress of Jesus (Thamar, <a onClick="return mV(\'Mat\',1,3);">Mt 1:3</a>).<P>(2) A daughter of David and sister of Absalom (<a onClick="return mV(\'2Sa\',13,1);">2Sa 13:1</a>). Her beauty inflamed her half-brother Amnon with passion, and by stratagem he forcibly violated her. This brought upon Amnon the terrible revenge of Absalom.<P>(3) A daughter of Absalom (<a onClick="return mV(\'2Sa\',14,27);">2Sa 14:27</a>).`<a href="./study/isbe/search.html?string=ABSALOM">ABSALOM</a>; <a href="./study/isbe/search.html?string=AMNON">AMNON</a>; <a href="./study/isbe/search.html?string=MAACAH">MAACAH</a>`132';
isbe[8605]='Tamar (2)`(tamar, "palm tree"; Thaiman):<P>(1) This name occurs in Ezekiel\'s ideal delimitation of the territory to be occupied by Israel (<a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>; <a onClick="return mV(\'Eze\',48,28);">48:28</a>). The Dead Sea is the eastern border; and the southern boundary runs from Tamar as far as the waters of Meriboth-kadesh to the Brook of Egypt and the Great Sea. The place therefore lay somewhere to the southwest of the Dead Sea. "Hazazon-tamar (the same is En-gedi)" (<a onClick="return mV(\'2Ch\',20,2);">2Ch 20:2</a>) is of course out of the question, being much too far to the north. Eusebius (in Onomasticon) mentions Asasonthamar, with which Thamara was identified. This place was a village with fortress and Roman garrison, a day\'s journey from Mampsis on the way from Hebron to Elath. It is the Thamaro mentioned by Ptolemy (v.16, 8), as a military station on the road from Hebron to Petra. It is named also in the Peutinger Tables. Neither Mampsis nor Thamaro has been identified.<P>(2) Among the towns "built" or fortified by Solomon, named in <a onClick="return mV(\'1Ki\',9,18);">1Ki 9:18</a>, is Tamar (the Revised Version (British and American) following Kethibh), or Tadmor (the King James Version following Qere; compare <a onClick="return mV(\'2Ch\',8,4);">2Ch 8:4</a>). Gezer, Beth-horon and Baalath, named along with it, are all in Southern Palestine, while Tamar is described as in the wilderness in the land, pointing to the Negeb or to the Wilderness of Judah. It was probably intended to protect the road for trade from Ezion-geber to Jerusalem. We may with some confidence identify it with (1) above. It is interesting to note that the Chronicler (<a onClick="return mV(\'2Ch\',8,4);">2Ch 8:4</a>) takes it out of connection with the other cities (<a onClick="return mV(\'2Ch\',8,5);">2Ch 8:5</a>), and brings its building into relation with Solomon\'s conquest of Hamath-zobah. Clearly in his mind it denoted the great and beautiful city of Palmyra, which has so long been known as "Tadmor in the Wilderness."``54';
isbe[8606]='Tamarisk`tam\'-a-risk:<P>(1) \'eshel (<a onClick="return mV(\'Gen\',21,33);">Ge 21:33</a>, the King James Version "grove," margin "tree"; <a onClick="return mV(\'1Sa\',22,6);">1Sa 22:6</a>, the King James Version "tree," margin "grove"; <a onClick="return mV(\'1Sa\',31,13);">1Sa 31:13</a>, the King James Version "tree"). The Revised Version (British and American) translation is due to the similarity of \'eshel to the Arabic \'athl, "the tamarisk."<P>(2) ar\'ar (<a onClick="return mV(\'Jer\',17,6);">Jer 17:6</a> margin (compare <a onClick="return mV(\'Jer\',48,6);">Jer 48:6</a>), English Versions of the Bible "<a href="./study/isbe/search.html?string=HEATH">heath</a>" (which see)).<P>The tamarisk (Tamarix, with various species in Palestine, chiefly T. Syriaca) is a very characteristic tree of Palestine, especially in the Maritime Plain, near the sea itself, and in the Jordan Valley. Eight species are described. They are characterized by their brittle, feathery branches and by their tiny scale-like leaves. Some varieties flourish not infrequently in salty soil unsuited to any ordinary vegetation.``117';
isbe[8607]='Tammuz`tam\'-uz, tam\'-mooz (tammuz; Thammouz):<P>(1) The name of a Phoenician deity, the Adonis of the Greeks. He was originally a Sumerian or Babylonian sun-god, called Dumuzu, the husband of Ishtar, who corresponds to Aphrodite of the Greeks. The worship of these deities was introduced into Syria in very early times under the designation of Tammuz and Astarte, and appears among the Greeks in the myth of Adonis and Aphrodite, who are identified with Osiris and Isis of the Egyptian pantheon, showing how widespread the cult became. The Babylonian myth represents Dumuzu, or Tammuz, as a beautiful shepherd slain by a wild boar, the symbol of winter. Ishtar long mourned for him and descended into the underworld to deliver him from the embrace of death (Frazer, Adonis, Attis and Osiris). This mourning for Tammuz was celebrated in Babylonia by women on the 2nd day of the 4th month, which thus acquired the name of Tammuz (see <a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</A>). This custom of weeping for Tammuz is referred to in the Bible in the only passage where the name occurs (<a onClick="return mV(\'Eze\',8,14);">Eze 8:14</a>). The chief seat of the cult in Syria was Gebal (modern Gebail, Greek Bublos) in Phoenicia, to the south of which the river Adonis (Nahr Ibrahim) has its mouth, and its source is the magnificent fountain of Apheca (modern \'Afqa), where was the celebrated temple of Venus or Aphrodite, the ruins of which still exist. The women of Gebal used to repair to this temple in midsummer to celebrate the death of Adonis or Tammuz, and there arose in connection with this celebration those licentious rites which rendered the cult so infamous that it was suppressed by Constantine the Great.<P>The name Adonis, by which this deity was known to the Greeks, is none other than the Phoenician \'Adhon, which is the same in Hebrew. His death is supposed to typify the long, dry summer of Syria and Palestine, when vegetation perishes, and his return to life the rainy season when the parched earth is revivified and is covered with luxuriant vegetation, or his death symbolizes the cold, rough winter, the boar of the myth, and his return the verdant spring.<P>Considering the disgraceful and licentious rites with which the cult was celebrated, it is no wonder that Ezekiel should have taken the vision of the women weeping for Tammuz in the temple as one of the greatest abominations that could defile the Holy House.<P>See <a href="./study/isbe/search.html?string=ADONIS">ADONIS</a>.<P>(2) The fourth month of the Jewish year, corresponding to July. The name is derived from that of a Syrian god, identified with Adonis (<a onClick="return mV(\'Eze\',8,14);">Eze 8:14</a>).<P>See above, and <a href="./study/isbe/search.html?string=UPPERCASE">CALENDAR.``138';
isbe[8608]='Tanach`ta\'-nak (ta\'nakh, ta\'andkh).`<a href="./study/isbe/search.html?string=TAANACH">TAANACH</a>`1';
isbe[8609]='Tanhumeth`tan-hu\'-meth (tanchumeth): One of those who were left in Judah by Nebuchadnezzar under the governorship of Gedallah (<a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a>; <a onClick="return mV(\'Jer\',40,8);">Jer 40:8</a>).``1';
isbe[8610]='Tanis`ta\'-nis (Tanis (Judith 1:10)).`<a href="./study/isbe/search.html?string=ZOAN">ZOAN</a>`1';
isbe[8611]='Tanner`tan\'-er (burseus, from bursa "a hide"): The only references to a tanner are in <a onClick="return mV(\'Act\',9,43);">Ac 9:43</a>; <a onClick="return mV(\'Act\',10,6,32);">10:6,32</a>. The Jews looked upon tanning as an undesirable occupation and well they might, for at best it was accompanied with unpleasant odors and unattractive sights, if not even ceremonially unclean. We can imagine that Simon the tanner found among the disciples of Jesus a fellowship which had been denied him before. Peter made the way still easier for Simon by choosing his house as his abode while staying in Joppa. Simon\'s house was by the seashore, as is true of the tanneries along the Syrian coast today, so that the foul-smelling liquors from the vats can be drawn off with the least nuisance, and so that the salt water may be easily accessible for washing the skins during the tanning process. These tanneries are very unpretentious affairs, usually consisting of one or two small rooms and a courtyard. Within are the vats made either of stone masonry, plastered within and without, or cut out of the solid rock. The sheep or goat skins are smeared on the flesh side with a paste of slaked lime and then folded up and allowed to stand until the hair loosens. The hair and fleshy matter are removed, the skins are plumped in lime, bated in a concoction first of dog dung and afterward in one of fermenting bran, in much the same way as in a modern tannery. The bated skins are tanned in sumach (Arabic summak), which is the common tanning material in Syria and Palestine. After drying, the leather is blackened on one side by rubbing on a solution made by boiling vinegar with old nails or pieces of copper, and the skin is finally given a dressing of olive oil. In the more modern tanneries degras is being imported for the currying processes. For dyeing the rams\' skins red (<a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>) they rub on a solution of qermes (similar to cochineal; see <a href="./study/isbe/search.html?string=DYEING">DYEING</a>), dry, oil, and polish with a smooth stone.<P>Pine bark is sometimes used for tanning in Lebanon. According to Wilkinson (Ancient Egypt, II, 186), the Arabs use the juice of a desert plant for dehairing and tanning skins. The skins for pouches are either tawed, i.e. tanned with a mineral salt like alum, or treated like parchment (see <a href="./study/isbe/search.html?string=PARCHMENT">PARCHMENT</A>). About Hebron oak branches, chopped into small chips, are used for tanning the leather bottles or water skins. In this case the hair is not removed. The tanning is accomplished, after removing the fleshy matter, by filling the skin with oak chips and water, tying up all openings in the skins, and allowing them to lie in the open on their "backs," with "legs" upright, for weeks. The field near Hebron where they arrange the bulging skins in orderly rows during the tanning process presents a weird sight. These are the bottles referred to in the King James Version (the Revised Version (British and American) "skins") (<a onClick="return mV(\'Jos\',9,4,13);">Jos 9:4,13</a>; <a onClick="return mV(\'Hsa\',7,5);">Ho 7:5</a>; <a onClick="return mV(\'Mat\',9,17);">Mt 9:17</a>; <a onClick="return mV(\'Mar\',2,22);">Mr 2:22</a>; <a onClick="return mV(\'Luk\',5,37);">Lu 5:37</a>).<P>Leather was probably used more extensively than any records show. We know that the Egyptians used leather for ornamental work. They understood the art of making stamped leather. The sculptures give us an idea of the methods used for making the leather into sandals, trimmings for chariots, coverings of chairs, decorations for harps, sarcophagi, etc. There are two Biblical references to leather, where leather girdles are mentioned (<a onClick="return mV(\'2Ki\',1,8);">2Ki 1:8</a>; <a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>).`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`133';
isbe[8612]='Tapestry`tap\'-es-tri (marebhaddim, from rabhadh, "to spread"): "Carpets of tapestry" are mentioned in <a onClick="return mV(\'Pro\',7,16);">Pr 7:16</a>; <a onClick="return mV(\'Pro\',31,22);">31:22</a>. We have no means of knowing just what form of weaving is here referred to.`<a href="./study/isbe/search.html?string=WEAVING">WEAVING</a>`1';
isbe[8613]='Taphath`ta\'-fath (taphath): Daughter of Solomon and wife of Ben-abinadab (<a onClick="return mV(\'1Ki\',4,11);">1Ki 4:11</a>).``1';
isbe[8614]='Taphon`ta\'-fon`<a href="./study/isbe/search.html?string=TEPHON">TEPHON</a>`1';
isbe[8615]='Tappuah (1)`tap\'-u-a, ta-pu\'-a (tappuach, "apple"):<P>(1) A royal city of the Canaanites, the king of which was slain by Joshua (<a onClick="return mV(\'Jos\',12,17);">12:17</a>). It is named between Beth-el and Hepher, and may possibly be identical with the city named in <a onClick="return mV(\'Jos\',16,8);">Jos 16:8</a>; see (3) below. There is nothing to guide us to a decision.<P>(2) (Omitted by Septuagint.) A city in the Shephelah of Judah (<a onClick="return mV(\'Jos\',15,34);">Jos 15:34</a>). It is named between Engannim and Enam in a group of cities that lay in the northwest of the territory of Judah. Tristram suggested identification with \'Artuf, about 1 1/2 miles southeast of Zorah. G.A. Smith places it in Wady el \'Afranj, possibly identifying it with Tuffuch, fully 4 miles west of Hebron. This position, however, is not in the Shephelah. The place probably represents "Beth-tappuah" of <a onClick="return mV(\'Jos\',15,53);">Jos 15:53</a>. No quite satisfactory identification has yet been suggested.<P>(3) A place on the border between Ephraim and Manasseh (<a onClick="return mV(\'Jos\',16,8);">Jos 16:8</a>). "The land of Tappuah," i.e. the land adjoining the town, belonged to Manasseh, but the town itself belonged to Ephraim (<a onClick="return mV(\'Jos\',17,8);">Jos 17:8</a>). En-tappuah was probably a neighboring spring. Tappuah was to the south of Michmethath, and the border ran from here westward to the brook Kanah. Some would place it at Khirbet \'Atuf, about 11 miles northeast of Nablus. More probably it should be sought to the southwest of the plain of Makhneh (Michmethath). It may be identical with Tephon, which, along with Timnath, Pharathon, and other cities, Bacchides fortified "with high walls and gates and bars" (1Macc 9:50). No identification is possible.``54';
isbe[8616]='Tappuah (2)`(Tappuach; Codex Vaticanus Thapous; Codex Alexandrinus Thaphphou; Lucian, Phethrouth): A "son" of Hebron (<a onClick="return mV(\'1Ch\',2,43);">1Ch 2:43</a>).``1';
isbe[8617]='Tarah`ta\'-ra, tar\'-a (<a onClick="return mV(\'Num\',33,27);">Nu 33:27</a>f the King James Version).`<a href="./study/isbe/search.html?string=TERAH">TERAH</a>`1';
isbe[8618]='Taralah`tar\'-a-la (tar\'alah; Codex Vaticanus Thareela; Codex Alexandrinus Tharala): A town in the territory of Benjamin named between Irpeel and Zelah (<a onClick="return mV(\'Jos\',18,27);">Jos 18:27</a>). Eusebius, Onomasticon (s.v. "Therama") simply says it was in the tribe of Benjamin. In the times of Eusebius and Jerome, therefore, the site was already lost, and has not since been covered.``1';
isbe[8619]='Tarea`ta\'-re-a, ta-re\'-a (ta\'area\', a copyist\'s mistake (<a onClick="return mV(\'1Ch\',8,35);">1Ch 8:35</a>) for tacharea, "the shrewd one," in <a onClick="return mV(\'1Ch\',9,41);">1Ch 9:41</a>; Codex Vaticanus Theree; Codex Alexandrinus Tharee; Lucian, Tharaa; in <a onClick="return mV(\'1Ch\',9,41);">1Ch 9:41</a>, Codex Vaticanus Tharach; Codex Alexandrinus Thara; Lucian, Tharaa; see <a href="./study/isbe/search.html?string=TAHREA">TAHREA</A>): A descendant of Saul mentioned in a genealogy of Benjamin (<a onClick="return mV(\'1Ch\',9,41);">1Ch 9:41</a>).``1';
isbe[8620]='Tares`tarz (zizania (<a onClick="return mV(\'Mat\',13,25);">Mt 13:25</a>), margin "darnel"): Zizania is equivalent to Arabic zuwan, the name given to several varieties of darnel of which Lolium temulentum, the "bearded darnel," is the one most resembling wheat, and has been supposed to be degenerated wheat. On the near approach of harvest it is carefully weeded out from among the wheat by the women and children. Zuwan is commonly used as chickens\' food; it is not poisonous to human beings unless infected with the mold ergot.``1';
