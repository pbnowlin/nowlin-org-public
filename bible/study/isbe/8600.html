orkmen altogether were employed upon the task. The building was commenced in 20-19 BC. The naos, or temple proper, was finished in a year and a half, but it took 8 years to complete the courts and cloisters. The total erection occupied a much longer time (compare <a onClick="return mV(\'Jhn\',2,20);">Joh 2:20</a>, "Forty and six years," etc.); indeed the work was not entirely completed till 64 AD-6 years before its destruction by the Romans.<P>2. Its Grandeur:<P>Built of white marble, covered with heavy plates of gold in front and rising high above its marble-cloistered courts—themselves a succession of terraces—the temple, compared by Josephus to a snow-covered mountain (BJ, V, v, 6), was a conspicuous and dazzling object from every side. The general structure is succinctly described by G. A. Smith: "Herod\'s temple consisted of a house divided like its predecessor into the Holy of Holies, and the Holy Place; a porch; an immediate fore-court with an altar of burnt offering; a Court of Israel; in front of this a Court of Women; and round the whole of the preceding, a Court of the Gentiles" (Jerusalem, II, 502). On the "four courts," compare Josephus, Apion, II, viii.<P>3. Authorities:<P>The original authorities on Herod\'s temple are chiefly the descriptions in Josephus (Ant., XV, xi,3,5; BJ, V, v, etc.), and the tractate Middoth in the Mishna. The data in these authorities, however, do not always agree. The most helpful modern descriptions, with plans, will be found, with differences in details, in Keil, Biblical Archaeology, I, 187ff; in Fergusson, Temples of the Jews; in the articles "Temple" in HDB (T. Witton Davies) and Encyclopedia Biblica (G. H. Box); in the important series of papers by A. R. S. Kennedy in The Expository Times (vol XX), "Some Problems of Herod\'s Temple" (compare his article "Temple" in one-vol DB); in Sanday\'s Sacred Sites of the Gospels (Waterhouse); latterly in G. A. Smith, Jerusalem, II, 499ff.<P>4. Measurements:<P>Differences of opinion continue as to the sacred cubit. A. R. S. Kennedy thinks the cubit can be definitely fixed at 17,6 inches. (Expostory Times, XX, 24ff); G. A. Smith reckons it at 20,67 inches. (Jerusalem, II, 504); T. Witton Davies estimates it at about 18 in. (HDB, IV, 713), etc. W. S. Caldecott takes the cubit of Josephus and the Middoth to be 1 1/5 ft. It will suffice in this sketch to treat the cubit, as before, as approximately equivalent to 18 inches.<P>II. The Temple and Its Courts.<P>1. Temple Area—Court of Gentiles:<P>Josephus states that the area of Herod\'s temple was double that of its predecessor (BJ, I, xxi, 1). The Mishna (Mid., ii.2) gives the area as 500 cubits (roughly 750 ft.); Josephus (Ant., XV, xi, 3) gives it as a stadium (about 600 Greek ft.); but neither measure is quite exact. It is generally agreed that on its east, west and south sides Herod\'s area corresponded pretty nearly with the limits of the present Haram area (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</A>), but that it did not extend as far north as the latter (Kennedy states the difference at about 26 as compared with 35 acres, and makes the whole perimeter to be about 1,420 yards, ut supra, 66). The shape was an irregular oblong, broader at the north than at the south. The whole was surrounded by a strong wall, with several gates, the number and position of some of which are still matters of dispute. Josephus mentions four gates on the west (Ant., XV, xi, 5), the principal of which, named in Mid., i.3, "the gate of Kiponos," was connected by a bridge across the Tyropoeon with the city (where now is Wilson\'s Arch). The same authority speaks of two gates on the south. These are identified with the "Huldah" (mole) gates of the Mishna—the present Double and Triple Gates—which, opening low down in the wall, slope up in tunnel fashion into the interior of the court. The Mishna puts a gate also on the north and one on the east side. The latter may be represented by the modern Golden Gate—a Byzantine structure, now built up. This great court—known later as the "Court of the Gentiles," because open to everyone—was adorned with splendid porticos or cloisters. The colonnade on the south side—known as the Royal Porch—was specially magnificent. It consisted of four rows of monolithic marble columns—162 in all—with Corinthian capitals, forming three aisles, of which the middle was broader and double the height of the other two. The roofing was of carved cedar. The north, west, and east sides had only double colonnades. That on the east side was the "Solomon\'s Porch" of the New Testament (<a onClick="return mV(\'Jhn\',10,23);">Joh 10:23</a>; <a onClick="return mV(\'Act\',3,11);">Ac 3:11</a>; <a onClick="return mV(\'Act\',5,19);">5:19</a>). There were also chambers for officials, and perhaps a place of meeting for the Sanhedrin (beth din) (Josephus places this elsewhere). In the wide spaces of this court took place the buying and selling described in the Gospels (<a onClick="return mV(\'Mat\',21,12);">Mt 21:12</a> and parallel\'s; <a onClick="return mV(\'Jhn\',2,13);">Joh 2:13</a>ff).<P>2. Inner Sanctuary Inclosure:<P>(1) Wall, "Chel," "Coregh," Gates.<P>In the upper or northerly part of this large area, on a much higher level, bounded likewise by a wall, was a second or inner enclosure—the "sanctuary" in the stricter sense (Josephus, BJ, V, v, 2)—comprising the court of the women, the court of Israeland the priests\' court, with the temple itself (Josephus, Ant, XV, xi, 5). The surrounding wall, according to Josephus (BJ, V, v, 2), was 40 cubits high on the outside, and 25 on the inside—a difference of 15 cubits; its thickness was 5 cubits. Since, however, the inner courts were considerably higher than the court of the women, the difference in height may have been some cubits less in the latter than in the former (compare the different measurements in Kennedy, ut supra, 182), a fact which may explain the difficulty felt as to the number of the steps in the ascent (see below). Round the wall without, at least on three sides (some except the west), at a height of 12 (Mid.) or 14 (Jos) steps, was an embankment or terrace, known as the chel (fortification), 10 cubits broad (Mid. says 6 cubits high), and enclosing the whole was a low balustrade or stone parapet (Josephus says 3 cubits high) called the coregh, to which were attached at intervals tablets with notices in Greek and Latin, prohibiting entry to foreigners on pain of death (see <a href="./study/isbe/search.html?string=PARTITION,+THE+MIDDLE+WALL+OF">PARTITION, THE MIDDLE WALL OF</A>). From within the coregh ascent was made to the level of the chel by the steps aforesaid, and five steps more led up to the gates (the reckoning is probably to the lower level of the women\'s court). Nine gates, with two-storied gatehouses "like towers" (Josephus, BJ, V, v, 3), are mentioned, four on the north, four on the south, and one on the east—the last probably to be identified, though this is still disputed (Waterhouse, etc.), with the "Gate of Nicanor" (Mid.), or "Corinthian Gate" (Jos), which is undoubtedly "the Beautiful Gate" of <a onClick="return mV(\'Act\',3,2,10);">Ac 3:2,10</a> (see for identification, Kennedy, ut supra, 270). This principal gate received its names from being the gift of a wealthy Alexandrian Jew, Nicanor, and from its being made of Corinthian brass. It was of great size—50 cubits high and 40 cubits wide—and was richly adorned, its brass glittering like gold (Mid., ii.3). See <a href="./study/isbe/search.html?string=BEAUTIFUL+GATE">BEAUTIFUL GATE</A>. The other gates were covered with gold and silver (Josephus, BJ, V, v, 3).<P>(2) Court of the Women.<P>The eastern gate, approached from the outside by 12 steps (Mid., ii.3; Maimonides), admitted into the court of the women, so called because it was accessible to women as well as to men. Above its single colonnades were galleries reserved for the use of women. Its dimensions are given in the Mishna as 135 cubits square (Mid., ii.5), but this need not be precise. At its four corners were large roofless rooms for storage and other purposes. Near the pillars of the colonnades were 13 trumpet-shaped boxes for receiving the money-offerings of the people (compare the incident of the widow\'s mite, <a onClick="return mV(\'Mar\',12,41);">Mr 12:41</a>ff; <a onClick="return mV(\'Luk\',21,1);">Lu 21:1</a>ff); for which reason, and because this court seems to have been the place of deposit of the temple-treasures generally, it bore the name "treasury" (gazophulakion, <a onClick="return mV(\'Jhn\',8,20);">Joh 8:20</a>).<P>See <a href="./study/isbe/search.html?string=TREASURY">TREASURY</A>.<P>(3) Inner Courts: Court of Israel; Court of the Priests:<P>From the women\'s court, the ascent was made by 15 semicircular steps (Mid., ii.5; on these steps the Levites chanted, and beneath them their instruments were kept) to the inner court, comprising, at different levels, the court of Israel and the court of the priests. Here, again, at the entrance, was a lofty, richly ornamented gate, which some, as said, prefer to regard as the Gate of Nicanor or Beautiful Gate. Probably, however, the view above taken, which places this gate at the outer entrance, is correct. The Mishna gives the total dimensions of the inner court as 187 cubits long (east to west) and 135 cubits wide (Mid., ii.6; v.1). Originally the court was one, but disturbances in the time of Alexander Janneus (104-78 BC) led, as formerly told, to the greater part being railed off for the exclusive use of the priests (Josephus, Ant, XIII, xiii, 5). In the Mishna the name "court of the priests" is used in a restricted sense to denote the space—11 cubits—between the altar and "the court of Israel" (see the detailed measurements in Mid., v.1). The latter—"the court of Israel"—2 1/2 cubits lower than "the court of the priests," and separated from it by a pointed fence, was likewise a narrow strip of only 11 cubits (Mid., ii.6; v.1). Josephus, with more probability, carries the 11 cubits of the "court of Israel" round the whole of the temple-court (BJ, V, vi). Waterhouse (Sacred Sites, 112) thinks 11 cubits too small for a court of male Israelites, and supposes a much larger enclosure, but without warrant in the authorities (compare Kennedy, ut supra, 183; G. A. Smith, Jerusalem, II, 508ff).<P>(4) The Altar, etc.<P>In the priests\' court the principal object was the great altar of burnt offering, situated on the old site—the Sakhra—immediately in front of the porch of the temple (at 22 cubits distance—the space "between the temple and the altar" of <a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>). The altar, according to the Mishna (Mid., iii.1), was 32 cubits square, and, like Ezekiel\'s, rose in stages, each diminishing by a cubit: one of 1 cubit in height, three of 5 cubits, which, with deduction of another cubit for the priests to walk on, left a square of 24 cubits at the top. It had four horns. Josephus, on the other hand, gives 50 cubits for the length and breadth, and 15 cubits for the height of the altar (BJ, V, v, 6)—his reckoning perhaps including a platform (a cubit high?) from which the height is taken (see <a href="./study/isbe/search.html?string=ALTAR">ALTAR</A>). The altar was built of unhewn stones, and had on the south a sloping ascent of like material, 32 cubits in length and 16 in width. Between temple and altar, toward the south, stood the "laver" for the priests. In the court, on the north side, were rings, hooks, and tables, for the slaughtering, flaying and suspending of the sacrificial victims.<P>3. The Temple Building:<P>(1) House and Porch.<P>Yet another flight of 12 steps, occupying most of the space between the temple-porch and the altar, led up to the platform (6 cubits high) on which stood the temple itself. This magnificent structure, built, as said before, of blocks of white marble, richly ornamented with gold on front and sides, exceeded in dimensions and splendor all previous temples. The numbers in the Mishna and in Josephus are in parts discrepant, but the general proportions can readily be made out. The building with its platform rose to the height of 100 cubits (150 ft.; the 120 cubits in Josephus, Ant, XV, xi,3,is a mistake), and was 60 cubits (90 ft.) wide. It was fronted by a porch of like height, but with wings extending 20 cubits (30 ft.) on each side of the temple, making the total breadth of the vestibule 100 cubits (150 ft.) also. The depth of the porch was 10 or 11 cubits; probably at the wings 20 cubits (Jos). The entrance, without doors, was 70 cubits high and 25 cubits wide (Mid. makes 40 cubits high and 20 wide). Above it Herod placed a golden eagle, which the Jews afterward pulled down (Ant., XVII, vi, 3). The porch was adorned with gold.<P>(2) "Hekhal" and "Debhir".<P>Internally, the temple was divided, as before, into a holy place (hekhal) and a most holy (debhir)—the former measuring, as in Solomon\'s Temple, 40 cubits (60 ft.) in length, and 20 cubits (30 ft.) in breadth; the height, however, was double that of the older Temple—60 cubits (90 ft.; thus Keil, etc., following Josephus, BJ, V, v, 5). Mid., iv.6, makes the height only 40 cubits; A. R. S. Kennedy and G. A. Smith make the debhir a cube—20 cubits in height only. In the space that remained above the holy places, upper rooms (40 cubits) were erected. The holy place was separated from the holiest by a partition one cubit in thickness, before which hung an embroidered curtain or "veil"—that which was rent at the death of Jesus (<a onClick="return mV(\'Mat\',27,51);">Mt 27:51</a> and parallel\'s; Mid., iv.7, makes two veils, with a space of a cubit between them). The Holy of Holies was empty; only a stone stood, as in the temple of Zerubbabel, on which the high priest placed his censer on the Day of Atonement (Mishna, Yoma\', v.2). In the holy place were the altar of incense, the table of shewbread (North), and the seven-branched golden candlestick (south). Representations of the two latter are seen in the carvings on the Arch of Titus (see <a href="./study/isbe/search.html?string=SHEWBREAD,+TABLE+OF">SHEWBREAD, TABLE OF</A>; <a href="./study/isbe/search.html?string=CANDLESTICK,+THE+GOLDEN">CANDLESTICK, THE GOLDEN</a>). The spacious entrance to the holy place had folding doors, before which hung a richly variegated Babylonian curtain. Above the entrance was a golden vine with clusters as large as a man (Josephus, Ant, XV, xi, 3; BJ, V, v, 4).<P>(3) The Side-Chambers.<P>The walls of the temple appear to have been 5 cubits thick, and against these, on the north, west, and south, were built, as in Solomon\'s Temple, side-chambers in three stories, 60 cubits in height, and 10 cubits in width (the figures, however, are uncertain), which, with the outer walls, made the entire breadth of the house 60 or 70 cubits. Mid., iv.3, gives the number of the chambers as 38 in all. The roof, which Keil speaks of as "sloping" (Bib. Archaeology, I, 199), had gilded spikes to keep off the birds. A balustrade surrounded it 3 cubits high. Windows are not mentioned, but there would doubtless be openings for light into the holy place from above the sidechambers.<P>III. New Testament Associations of Herod\'s Temple.<P>1. Earlier Incidents:<P>Herod\'s temple figures so prominently in New Testament history that it is not necessary to do more than refer to some of the events of which it was the scene. It was here, before the incense altar, that the aged Zacharias had the vision which assured him that he should not die childless (<a onClick="return mV(\'Luk\',1,11);">Lu 1:11</a>). Here, in the women\'s court, or treasury, on the presentation by Mary, the infant Jesus was greeted by Simeon and Anna (<a onClick="return mV(\'Luk\',2,27);">Lu 2:27</a>ff). In His 12th year the boy Jesus amazed the temple rabbis by His understanding and answers (<a onClick="return mV(\'Luk\',2,46);">Lu 2:46</a>).<P>2. Jesus in the Temple: The chronological sequence of the Fourth Gospel depends very much upon the visits of Jesus to the temple at the great festivals (see <a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>). At the first of these occurred the cleansing of the temple-court—the court of the Gentiles—from the dealers that profaned it (<a onClick="return mV(\'Jhn\',2,13);">Joh 2:13</a>), an incident repeated at the close of the ministry (<a onClick="return mV(\'Mat\',21,12);">Mt 21:12</a>ff and parallel\'s). When the Jews, on the first occasion, demanded a sign, Jesus spoke of the temple of His body as being destroyed and raised up in three days (<a onClick="return mV(\'Jhn\',2,19);">Joh 2:19</a>), eliciting their retort, "Forty and six years was this temple in building," etc. (<a onClick="return mV(\'Jhn\',2,20);">Joh 2:20</a>). This may date the occurrence about 27 AD. At the second cleansing He not only drove out the buyers and sellers, but would not allow anyone to carry anything through this part of the temple (<a onClick="return mV(\'Mar\',11,\'15-17\');">Mr 11:15-17</a>). In John His zeal flamed out because it was His Father\'s house; in Mark, because it was a house of prayer for all nations (compare <a onClick="return mV(\'Isa\',56,7);">Isa 56:7</a>). With this non-exclusiveness agrees the word of Jesus to the woman of Samaria: "The hour cometh, when neither in this mountain (in Samaria), nor in Jerusalem, shall ye worship the Father" (<a onClick="return mV(\'Jhn\',4,21);">Joh 4:21</a>). During the two years following His first visit, Jesus repeatedly, at festival times, walked in the temple-courts, and taught and disputed with the Jews. We find Him in <a onClick="return mV(\'Jhn\',5,\'1-\');">Joh 5</a> at "a feast" (Passover or Purim?); in <a onClick="return mV(\'Jhn\',7,\'1-\');">John 7</a>; <a onClick="return mV(\'Jhn\',8,\'1-\');">8</a>, at "the feast of tabernacles," where the temple-police were sent to apprehend Him (<a onClick="return mV(\'Jhn\',7,32,45);">7:32,45</a>ff), and where He taught "in the treasury" (<a onClick="return mV(\'Jhn\',8,20);">8:20</A>); in <a onClick="return mV(\'Jhn\',10,22);">Joh 10:22</a>ff, at "the feast of the dedication" in winter, walking in "Solomon\'s Porch." His teaching on these occasions often started from some familiar temple scene—the libations of water carried by the priests to be poured upon the altar (<a onClick="return mV(\'Jhn\',7,37);">Joh 7:37</a>), the proselytes (Greeks even) in the great portico (<a onClick="return mV(\'Jhn\',12,20);">Joh 12:20</a>), etc. Of course Jesus, not being of the priestly order, never entered the sanctuary; His teaching took place in the several courts open to laymen, generally in the "treasury" (see <a onClick="return mV(\'Jhn\',8,20);">Joh 8:20</a>).<P>3. The Passion-Week:<P>The first days of the closing week of the life of Jesus—the week commencing with the Triumphal Entry—were spent largely in the temple. Here He spoke many parables (<a onClick="return mV(\'Mat\',21,\'1-\');">Mt 21</a>; <a onClick="return mV(\'Mat\',22,\'1-\');">22</a> and parallel\'s); here He delivered His tremendous arraignment of the Pharisees (<a onClick="return mV(\'Mat\',23,\'1-\');">Mt 23</a> and parallel\'s); here, as He "sat down over against the treasury," He beheld the people casting in their gifts, and praised the poor widow who cast in her two mites above all who cast in of their abundance (<a onClick="return mV(\'Mar\',12,41);">Mr 12:41</a>ff and parallel\'s). It was on the evening of His last day in the temple that His disciples drew His attention to "the goodly stones and offerings" (gifts for adornment) of the building (<a onClick="return mV(\'Luk\',21,5);">Lu 21:5</a> and parallel\'s) and heard from His lips the astonishing announcement that the days were coming—even in that generation—in which there should not be left one stone upon another (<a onClick="return mV(\'Luk\',21,6);">Lu 21:6</a> and parallel\'s). The prediction was fulfilled to the letter in the destruction of the temple by the Romans in 70 AD.<P>4. Apostolic Church:<P>Seven weeks after the crucifixion the Pentecost of <a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a> was observed. The only place that fulfils the topographical conditions of the great gatherings is Solomon\'s Porch. The healing of the lame man (<a onClick="return mV(\'Act\',3,1);">Ac 3:1</a>) took place at the "door...called Beautiful" of the temple, and the multitude after the healing ran together into "Solomon\'s Porch" or portico (<a onClick="return mV(\'Act\',3,11);">Ac 3:11</a>). Where also were the words of <a onClick="return mV(\'Luk\',24,53);">Lu 24:53</a>, they "were continually in the temple, blessing God," and after Pentecost (<a onClick="return mV(\'Act\',2,46);">Ac 2:46</a>), "day by day, continuing stedfastly...in the temple," etc., so likely to be fulfilled? For long the apostles continued the methods of their Master in daily teaching in the temple (<a onClick="return mV(\'Act\',4,1);">Ac 4:1</a>). Many years later, when Paul visited Jerusalem for the last time, he was put in danger of his life from the myriads of Jewish converts "all zealous for the law" (<a onClick="return mV(\'Act\',21,20);">Ac 21:20</a>), who accused him of profaning the temple by bringing Greeks into its precincts, i.e. within the coregh (<a onClick="return mV(\'Act\',21,\'28-30\');">Ac 21:28-30</a>). But Christianity had now begun to look farther afield than the temple. Stephen, and after him Saul, who became Paul, preached that "the Most High dwelleth not in houses made with hands" (<a onClick="return mV(\'Act\',7,48);">Ac 7:48</a>; <a onClick="return mV(\'Act\',17,24);">17:24</a>), though Paul himself attended the temple for ceremonial and other purposes (<a onClick="return mV(\'Act\',21,26);">Ac 21:26</a>).<P>5. The Temple in Christian Thought:<P>From the time that the temple ceased to exist, the Talmud took its place in Jewish estimation; but it is in Christianity rather than in Judaism that the temple has a perpetual existence. The New Testament writers make no distinction between one temple and another. It is the idea rather than the building which is perpetuated in Christian teaching. The interweaving of temple associations with Christian thought and life runs through the whole New Testament. Jesus Himself supplied the germ for this development in the word He spoke concerning the temple of His body (<a onClick="return mV(\'Jhn\',2,19,21);">Joh 2:19,21</a>). Paul, notwithstanding all he had suffered from Jews and Jewish Christians, remained saturated with Jewish ideas and modes of thought. In one of his earliest Epistles he recognizes the "Jerus that is above" as "the mother of us all" (<a onClick="return mV(\'Gal\',4,26);">Ga 4:26</a> the King James Version). In another, the "man of sin" is sitting "in the temple of God" (<a onClick="return mV(\'2Th\',2,4);">2Th 2:4</a>). The collective church (<a onClick="return mV(\'1Cr\',3,16,17);">1Co 3:16,17</a>), but also the individual believer (<a onClick="return mV(\'1Cr\',6,19);">1Co 6:19</a>), is a temple. One notable passage shows how deep was the impression made upon Paul\'s mind by the incident connected with Trophimus the Ephesian (<a onClick="return mV(\'Act\',21,29);">Ac 21:29</a>). That "middle wall of partition" which so nearly proved fatal to him then was no longer to be looked for in the Christian church (<a onClick="return mV(\'Eph\',2,14);">Eph 2:14</a>), which was "a holy temple" in the Lord (<a onClick="return mV(\'Eph\',2,21);">Eph 2:21</a>). It is naturally in the Epistle to the Hebrews that we have the fullest exposition of ideas connected with the temple, although here the form of allusion is to the tabernacle rather than the temple (see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; compare Westcott on Hebrews, 233ff). The sanctuary and all it included were but representations of heavenly things. Finally, in Revelation, the vision is that of the heavenly temple itself (<a onClick="return mV(\'Rev\',11,19);">11:19</A>). But the church—professing Christendom?—is a temple measured by God\'s command (<a onClick="return mV(\'Rev\',11,1,2);">11:1,2</A>ff). The climax is reached in <a onClick="return mV(\'Rev\',21,22,23);">21:22-23</A>: "I saw no temple therein (i.e. in the holy city): for the Lord God the Almighty, and the Lamb, are the temple thereof...and the lamp thereof is the Lamb." Special ordinances are altogether superseded.<P>LITERATURE.<P>In general on the temples see Keil, Biblical Archaeology, I, in which the older literature is mentioned; Fergusson, Temples of the Jews; Comms. on K, Chronicles, Ezra, Nehemiah, and Ezk; articles in the dicts. and encs (DB, HDB, EB); G. A. Smith, Jerusalem and similar works. On Solomon\'s Temple, compare Benzinger, Heb. Archaologie. On Ezekiel\'s temple, see Skinner\'s "Book of Ezekiel" in Expositor\'s Bible. On Zerubbabel\'s temple, compare W. Shaw Caldecott, The Second Temple in Jerusalem. The original authorities on Herod\'s temple are chiefly Josephus, Ant, XV, xi, and BJ, V, v; and the Mishna, Middoth, ii (this section of the Middoth, from Barclay\'s Talmud, may be seen in App. I of Fergusson\'s work above named). The German literature is very fully given in Schurer, HJP, I,1,438ff (GJV4, I, 392f). See also the articles of A. R. S. Kennedy in Expository Times, XX, referred to above, and P. Waterhouse, in Sanday, Sacred Sites of the Gospels, 106ff. On symbolism, compare Westcott, Hebrews, 233ff. See also articles in this Encyclopedia on parts, furniture, and utensils of the temple, under their several headings.``19';
isbe[8670]='Temple, B`<b>B. IN CRITICISM</b><P><b>I. ALLEGED LACK OF HARMONY BETWEEN EARLIER (KINGS) AND LATER (CODE OF HAMMURABI) VERSIONS OF TEMPLE BUILDING</b><P class="in15">1. Second Version Not a Facsimile of First<P class="in15">2. The Two Versions Differ as to the Builder<P class="in15">3. The Earlier Version Silent about Things Recorded in Later Version<P><b>II. DETAILED OBJECTIONS AGAINST CHRONICLER\'S ACCOUNT</b><P class="in15">1. Reason for Interdicting David\'s Purpose to Build a Temple<P class="in15">2. Impossibility of David in His Old Age Collecting Materials Enumerated by the Chronicler<P class="in15">3. Supernaturally Received Pattern of the Temple Said to Have Been Given by David to Solomon<P class="in15">4. Alleged Organization of the Temple-Service by David<P class="in15">5. Assertion by Solomon That the Temple Would Be Used as a Central Sanctuary<P><b>LITERATURE</b><hr /><P>B. IN CRITICISM<P>Modern criticism does not challenge the existence of a Solomonic Temple on Mt. Moriah, as it does that of a Mosaic tabernacle in the wilderness. Only it maintains that historic value belongs exclusively to the narrative in Kings, while the statements in Chronicles are pure ornamentation or ecclesiastical trimming dating from post-exilic times. All that is true about the Temple, says criticism, is<P>(1) that David originally, i.e. on coming to the throne of all Israel, contemplated erecting such a structure upon Araunah\'s threshing-floor, but was prohibited from doing so by Nathan, who at first approved of his design but was afterward directed by Yahweh to stay the king\'s hand, and to inform the king that the work of building a house for Yahweh to dwell in was not to be his (the king\'s) task and privilege but his son\'s, and that as a solatium for his disappointment Yahweh would build him a house, by establishing the throne of his kingdom forever (<a onClick="return mV(\'2Sa\',7,\'4-17\');">2Sa 7:4-17</a>);<P>(2) that after David\'s death Solomon called to mind the pious purpose of his father of which he had been informed and the express promise of Yahweh that David\'s successor on the throne should execute that purpose, and accordingly resolved to "build a house for the name of Yahweh his God" (<a onClick="return mV(\'1Ki\',5,\'3-5\');">1Ki 5:3-5</a>); and<P>(3) that 7 1/2 years were employed in the work of construction, after which the finished Temple was dedicated in the presence of the congregation of Israel, with their princes, priests and Levites, in a speech which rehearsed the fact that David had intended to build the house but was prevented, and with a prayer which once more connected the Temple with the pious intention of David (<a onClick="return mV(\'1Ki\',8,\'18-20\');">1Ki 8:18-20</a>).<P>All the rest is simply embellishment (Wellhausen, GI, 181-92; article "Temple" in EB):<P>(1) that David\'s purpose to build the Temple was interdicted because he had been a man of war and had shed blood (<a onClick="return mV(\'1Ch\',28,3);">1Ch 28:3</a>), which in Wellhausen\'s judgment should rather have been a qualification for the business;<P>(2) that David in his old and feeble age made elaborate preparations for the construction of the house he was not to see—which, again writes Wellhausen, was like "making the bread so far ready that his son only required to shove it into the oven";<P>(3) that David gave to his son Solomon the pattern of the house in all its details as the Lord had caused him to understand in writing ("black upon white," as Wellhansen expresses it) by His (the Lord\'s) hand upon him—which was different from the way in which Moses received instruction about the tabernacle, namely, by a pattern shown to him in the Mount, and carried in his recollection;<P>(4) that David before his death arranged all the musical service for the Temple, invented musical instruments, appointed all the officers to be associated with the Temple priests, Levites, porters and singers, distributing them in classes and assigning them their duties by lot (<a onClick="return mV(\'1Ch\',23,\'2-26\');">1Ch 23:2-26</a>; <a onClick="return mV(\'2Ch\',8,\'12-16\');">2Ch 8:12-16</a>)—exactly as these things were afterward arranged in the second or post-exilic temple and were now carried back to David as the legislation of the Priestly Code was assigned to Moses; and<P>(5) that David\'s son Solomon assures Hiram (the Revised Version (British and American) "Huram") that the Temple will be used as a central sanctuary "to burn before him (Yahweh) incense of sweet spices, and for the continual showbread, and for the burnt-offerings morning and evening, on the sabbaths, and on the new moons, and on the set feasts of Yahweh our God" (<a onClick="return mV(\'2Ch\',2,3);">2Ch 2:3</a>), i.e. for divine service, which, according to criticism, was of post-exilic origin.<P>The questions that now fall to be considered are: (1) whether the statements of the Chronicler are inconsistent with those in the Books of Samuel and Kings; and (2) if not, whether they are in themselves such as to be incredible.<P>I. Alleged Want of Harmony between Earlier (K) and Later (Ch) Versions of Temple Building.<P>1. Second Version Not a Facsimile of First<P>It does not seem reasonable to hold that this has been established. The circumstance that the second account is not a facsimile of the first does not warrant the conclusion that the first alone is fact and the second fiction. It is quite conceivable that both might be true. David might have had it in his mind, as the first account states and the second acknowledges, to build a house for Yahweh, and yet not have been able to carry his purpose into effect, and have been obliged to hand over its execution to his son. David, moreover, might have been hindered by Yahweh (through His prophet Nathan) from building the Temple for more reasons than one—because the proposal was premature, God having it in His mind to build a house for David, i.e. to establish his dynasty, before requiring a permanent habitation for Himself; and also because the time was unpropitious, David having still much to do in the subjugation of his country\'s enemies; and because it was more fitting that a temple for the God of Peace should not be erected by one who had been a man of war from his youth. The first of these reasons is stated in Samuel, the second and third are recorded in Chronicles.<P>2. The Two Versions Differ as to the Builder<P>The earlier version does not say that David built the house; but that his son was to do it, and this the later version does not contradict; the later version does not claim that the idea originated with Solomon, but ascribes it to David, precisely as the earlier version does. In this there is no disharmony, but rather underlying harmony. Both versions assert that David purposed and that Solomon performed, in which surely there is perfect agreement.<P>3. The Earlier Version Silent about Things Recorded in Later Version<P>The silence of the earlier version about the things recorded in the later version, such as the preparation of material and the organization of the Temple-service, does not prove that these things were not known to the author of the earlier version, or had not taken place when he wrote. No writer is obliged to cram into his pages all he knows, but only to insert as much of his information as will subserve his aim in writing. Nor does his omission to set down in his narrative this or that particular fact or incident amount to a demonstration that the unrecorded fact or incident had not then occurred or was not within his cognizance. Least of all is it expected that a writer of civil history shall fill his pages with details that are purely or chiefly ecclesiastical. In short, if the omission from Kings of David\'s preparations and arrangement for the Temple testifies that no such preparations or arrangements were made, the omission from Chronicles of David\'s sin with Bath-sheba and of Nathan\'s parable of the Ewe Lamb should certify that either these things never happened or they were not known after the exile. It is usual to say they were purposely left out because it was the Chronicler\'s intention to encircle David with a nimbus of glory (Wellhausen), but this is simply critical hypothesis, the truth of which is disputed. On critical principles either these incidents in David\'s life were not true or the Chronicler was not aware of them. But the Chronicler had as one main source for his composition "the earlier historical books from Genesis to Kings" (Driver), and "the tradition of the older source only has historical value" (Wellhausen).<P>II. Detailed Objections against Chronicler\'s Account.<P>1. Reason for Interdicting David\'s Purpose to Build a Temple<P>Examining now in detail the abovestated objections, we readily see that they are by no means so formidable as at first sight they look, and certainly do not prove the Chronicler\'s account to be incredible. That David\'s purpose to build a temple should have been interdicted because he had been a man of war and had shed blood appears to Wellhausen to be a watermark of non-historicity. Benzinger in Encyclopedia Biblica (art. "Temple") goes beyond this and says "There is no historical probablity David had thoughts of building a temple." But if David never thought of building a temple, then not only was the Chronicler mistaken in making Solomon say (<a onClick="return mV(\'2Ch\',6,7);">2Ch 6:7</a>) that it was in the heart of his father so to do, but he was chargeable with something worse in making the Lord say to David, "Whereas it was in thy heart to build a house for my name, thou didst well in that it was in thy heart" (<a onClick="return mV(\'2Ch\',6,8);">2Ch 6:8</a>), unless he was absolutely certain that the statement was true—which it was not if Benzinger may be relied on.<P>Nor is it merely the Chronicler whose character for intelligence and piety suffers, if David never thought of building a temple; the reputation of the author or authors of Samuel and Kings must also go, since they both declare that David did entertain the purpose which Benzinger denies (<a onClick="return mV(\'2Sa\',7,2);">2Sa 7:2</a>; <a onClick="return mV(\'1Ki\',5,3);">1Ki 5:3</a>); and an impartial reasoner will hesitate before he sacrifices the good name even of two unknown ancient writers at the ipse dixit of any modern scholar.<P>We may therefore limit our remarks to Wellhausen\'s objection and reply that the reason assigned by Chronicles for prohibiting David from carrying out his purpose, namely, that he had been a man of war, might have been an argument for permitting him to do so, or at least for his seeking to do so, had his object been to erect a monument to his own glory or a thank offering to God for the victories he had won; but not if the Temple was designed to be a habitation wherein God might dwell among His people to receive their worship and bless them with His grace. Strange as it may seem (Winer) that David should have been debarred from carrying out his purpose for the reason assigned, yet there was reason in the interdict, for not only was it fitting that peaceful works should be carried out by peaceful hands (Merz in PRE2), but David\'s vocation was not temple-building but empire-building (to use a modern phrase); and many campaigns lay before him ere the leisure could be found or the land could be ready for the execution of his sacred design.<P>2. Impossibility of David in His Old Age Collecting Materials Enumerated by the Chronicler<P>That David in his old and feeble age could not possibly have collected all the materials enumerated by <a onClick="return mV(\'1Ch\',29,\'1-\');">1Ch 29</a> might possibly have been true, had David been an impecunious chieftain and had he only in the last years of his life commenced to amass treasure. But David was a powerful and wealthy eastern potentate and a valiant warrior besides, who had conquered numerous tribes, Philistines, Moabites, Syrians, Edomites and Ammonites, and had acquired from his victories large spoil, which from an early stage in his career he had been accustomed to dedicate to the Lord (<a onClick="return mV(\'2Sa\',8,11);">2Sa 8:11</a>). Hence, it is little better than trifling to put forward as an inherent mark of incredibility the statement that David in his old age could not have made extensive and costly preparations for the building of the Temple—all the more that according to the narrative he was assisted by "the princes of the fathers\' houses, and the princes of the tribes of Israel, and the captains of thousands and of hundreds, with the rulers over the king\'s work," and "the people" generally, who all "offered willingly for the service of the house of God."<P>No doubt the value in sterling money of these preparations is enormous—the gold and silver alone being variously reckoned at 8 (Keil), 16 (Bertheau), 81 (Michaelis), 450 (Kautzsch), 1,400 (Rawlinson) millions of pounds—and might reasonably suggest either that the text has become corrupt, or the numbers were originally used loosely to express the idea of an extraordinary amount, or were of set purpose exaggerated. The first of these explanations is adopted by Rawlinson; the second by Berthcan; the third by Wellhausen, who sees in the whole section (<a onClick="return mV(\'1Ch\',22,\'1-\');">1Ch 22-29</a>) "\'a frightful example of the statistical fantasy of the Jews, which delights itself in immense sums of gold upon paper." But even conceding that in each of these explanations a measure of truth may lie, it does not seem justifiable to wipe out as unhistorical and imaginary the main statement of the Chronicler, that David\'s preparations were both extensive and costly, all the less that <a onClick="return mV(\'1Ki\',10,14,15);">1Ki 10:14,15</a> bears witness to the extraordinary wealth of Solomon. whose income is stated to have been 666 talents of gold, or about 3 millions sterling, a year, besides that he had of the merchantmen, and of the traffic of the spice merchants, and of all the kings of Arabia and of the governors of the country. If David\'s annual income was anything like this, and if he had command of all the treasures accumulated in previous years, it does not look so impossible as criticism would make out that David could have prepared for the future Temple as the Chronicler reports.<P>3. Supernaturally Received Pattern of the Temple Said to Have Been Given by David to Solomon<P>That David gave to Solomon the pattern of the Temple in a writing which had been prepared by him under direct supernatural guidance can be objected to only by those who deny the possibility of such divine communications being made by God to man. If criticism admits, as it sometimes does, the possibility of both revelation and inspiration, the objection under consideration must fall to the ground. That the method of making David acquainted with the pattern of the Temple was not in all respects the same as that adopted for showing Moses the model of the tabernacle, only proves that the resources of infinite wisdom are not usually exhausted by one effort, and that God is not necessarily tied down to one particular way of uttering His thoughts.<P>But criticism mostly rejects the idea of the supernatural and accordingly dismisses this statement about the God-given pattern as altogether fanciful—pointing (1) to the fact that similar temples already existed among the Canaanites, as e.g. at Shechem (<a onClick="return mV(\'Jdg\',9,46);">Jud 9:46</a>) and at Gaza (<a onClick="return mV(\'Jdg\',16,29);">Jud 16:29</a>), which showed there was no special need for a divinely-prepared plan; and (2) to the circumstance that Solomon fetched Hiram, a Tyrian worker in brass, to assist in the erection of the Temple, which again, it is urged, renders probable the conclusion that at least Phoenician ideas entered into its structure (Duncker, Benzinger). Suppose, however, it were true that the Temple was fashioned on a Phoenician, Canaanite or Egyptian model, that would not disprove the statement that David was guided by divine inspiration in drawing up the outline of the building.<P>4. Alleged Organization of the Temple-Service by David<P>That David\'s organization of the Temple-service, both as to officers and instruments as to ritual and music, corresponded exactly (or nearly so) with what afterward existed in the second temple can hardly be adduced as a proof of non-historicity, except on the supposition that Chronicles deliberately "transformed the old history into church history" by ascribing to David the holy music and the arrangement of the Temple personals" which belonged to the post-exilic age, precisely as the author or authors of the Priestly Code, which dated from the same age (according to criticism), attributed this to Moses (Wellhausen, GI, 187)—in other words, by stating what was not true in either case, by representing that as having happened which had not happened. Whether this was originally intended to deceive and was a willful fraud, as some hold, and whether it was legitimate then "to do evil that good might come," to persuade men that David organized the musical service which was performed in the second temple in order to secure for it popular acceptance, it may be left to each reader to determine; it must always be wrong to ascribe doubtful practices to good men like the authors of the Priestly Code (P) and of Chronicles unless one is absolutely sure that they were guilty of such practices. Undoubtedly the fair and reasonable thing is to hold that the Chronicler wrote the truth until it is proved that he did not; and for his statement it may be claimed that at least it has this in its favor, that in the earlier sources David is distinctly stated to have been a musician (<a onClick="return mV(\'1Sa\',16,23);">1Sa 16:23</a>), to have composed a song, <a onClick="return mV(\'Psa\',18,\'1-\');">Ps 18</a> (<a onClick="return mV(\'2Sa\',22,1);">2Sa 22:1</a>), and to have been designated "the sweet psalmist of Israel." No doubt on the critical hypothesis this might explain why the thought occurred to the Chronicler to credit David with the organization of the Temple-service; but without the critical hypothesis it equally accounts for the interest David took in preparing "the music and the personals" for the Temple which his son was to, build. "The tradition that David intended to build a temple and that he reorganized public worship, not forgetting the musical side thereof (compare <a onClick="return mV(\'2Sa\',6,5);">2Sa 6:5</a> with <a onClick="return mV(\'Amo\',6,5);">Am 6:5</a>)," says Kittel (The Scientific Study of the Old Testament,136,English translation), "is not altogether without foundation."<P>5. Assertion by Solomon That the Temple Would Be Used as a Central Sanctuary<P>That the Temple-service was carried out in accordance with the regulations of the Priestly Code does not prove that the Chronicles account is unreliable, unless it is certain that the postexilic Priestly Code was an entirely new ritual which had never existed before, which some modern critics do not admit. But, if it was merely, as some maintain, a codification of a cult that existed before, then no sufficient reason exists for holding that Solomon\'s Temple was designed to be a private chapel for the king (Benzinger), erected partly out of piety but partly also out of love of splendor and statecraft (Reuss), rather than a central sanctuary for the people. A study of Solomon\'s letter to Hiram (<a onClick="return mV(\'2Ch\',2,4);">2Ch 2:4</a>) shows that the Temple was intended for the concentration of the nation\'s sacrificial worship which had up till then been frequently offered at local shrines, though originally meant for celebration at the Mosaic tabernacle—for the burning of sweet incense (<a onClick="return mV(\'Exd\',30,1);">Ex 30:1</a>), the offering day by day continually of the burnt offering (<a onClick="return mV(\'Exd\',29,39);">Ex 29:39</a>). And though, it is admitted, the letter to Hiram as reported in 1 Kings makes no mention of this intention, yet it is clear from <a onClick="return mV(\'1Ki\',8,\'62-65\');">1Ki 8:62-65</a>, that Solomon, after dedicating the Temple by prayer, used it for this purpose. Wherefore, if Chronicles simply transferred to the consecration of the Temple a ritual that had no existence until after the exile, the author of Kings did the same, which again would destroy Wellhausen\'s admission that historical validity attaches to the earlier source. A much more likely supposition is that the ritual reported by both historians was not that of a Priestly Code manufactured for the second temple, but that which had been published by Moses for the tabernacle, in place of which it had come. That local shrines for many years existed alongside of the Temple only proves that Solomon\'s original idea was not perfectly carried out either by himself or his people.<P>LITERATURE.<P>The Commentaries of Bertheau and Keil on Chronicles; Reuss. Geschichte der heiligen Schriften des Alten Testaments; articles on "Temple" in Sch-Herz; Riehm. Handworterbuch; HDB; EB; Wellhausen. Prolegomena schichte Israels.``192';

isbe[8672]='Temples`tem\'-p\'lz (raqqah, "thinness," "upper cheeks"): The original signifies the thinnest part of the skull (<a onClick="return mV(\'Jdg\',4,21,22);">Jud 4:21,22</a>; <a onClick="return mV(\'Jdg\',5,26);">5:26</a>). In <a onClick="return mV(\'Sgs\',4,3);">So 4:3</a>; <a onClick="return mV(\'Sgs\',6,7);">6:7</a>, the bride\'s cheeks are likened to pomegranates because of the rich coloring of a slice of this fruit.``1';
isbe[8673]='Temples, Robbers of`(hierosuloi; the King James Version "robbers of churches," <a onClick="return mV(\'Act\',19,37);">Ac 19:37</a>): To explain this as "sacrilegious persons" is irreconcilable with the contrast in <a onClick="return mV(\'Rom\',2,22);">Ro 2:22</a>. In <a onClick="return mV(\'Deu\',7,25);">De 7:25</a>, the Jews were commanded entirely to destroy the gold and silver idols, ornaments of the heathen temples. The sin reproved is that of making that a matter of gain which, without regard to its value, they should have destroyed. "Dost thou, who regardest the mere touch of an idol as a horrible defilement, presume to rob their temples?" There is abundant evidence to show that this crime was not unusual. When the town-clerk of Ephesus declares the companions of Paul innocent of such charge, his words imply that the fact that they were Jews rendered them liable to such suspicion. So Josephus goes out of his way (Ant., IV, viii, 10) to deny that Jews ever committed the crime.``84';
isbe[8674]='Tempt; Temptation`temt, tem-ta\'-shun (nacah, "to prove" "try," "tempt" maccah, "a trial," "temptation"; peirazo, "to try" "prove" peirasmos "a trial," "proof"): The words have a sinister connotation in present-day usage which has not always attached to them. Originally the words were of neutral content, with the sense of "putting to the proof," the testing of character or quality. Thus, God is "tempted" by Israel\'s distrust of Him, as if the people were actually challenging Him to show His perfections (<a onClick="return mV(\'Exd\',17,2);">Ex 17:2</a>; <a onClick="return mV(\'Psa\',78,18);">Ps 78:18</a>; <a onClick="return mV(\'Act\',15,10);">Ac 15:10</a>; <a onClick="return mV(\'Hbr\',3,9);">Heb 3:9</a>, and often); Abraham is "tempted," being called upon to offer up Isaac (<a onClick="return mV(\'Gen\',22,1);">Ge 22:1</a>); and Jesus is "tempted" to a spectacular Messiahship (<a onClick="return mV(\'Mat\',4,\'1-\');">Mt 4</a> and parallel passages (see <a href="./study/isbe/search.html?string=TEMPTATION+OF+CHRIST">TEMPTATION OF CHRIST</a>)). No evil is implied in the subject of these temptations. Temptation therefore in the Scripture sense has possibilities of holiness as well as of sin. For as all experience witnesses, it is one thing to be tempted, another thing to fall. To be tempted—one may rejoice in that (<a onClick="return mV(\'Jam\',1,2);">Jas 1:2</a>), since in temptation, by conquering it, one may achieve a higher and nobler manhood.<P>"Why comes temptation but for man to meet<P>And master and make crouch beneath his foot,<P>And so be pedestaled in triumph?"<P>Holiness in its best estate is possible only under conditions which make it necessary to meet, resist and triumph over temptation. Thus, Jesus Himself became our Great High Priest in that, being tempted in all points like as we are, He never once yielded, but fought and triumphed (<a onClick="return mV(\'Hbr\',4,15);">Heb 4:15</a>).<P>One must not deceive one\'s self, however, in thinking that, because by the grace of God one may have profit of virtue through temptation as an instrument, all temptation is equally innocent and virtuous. It is noticeable in the case of Jesus that His temptation was under the direction of the Spirit (<a onClick="return mV(\'Mar\',1,12);">Mr 1:12</a>); He Himself did not seek it, nor did He fear it. Temptations encountered in this way, the way of duty, the way of the Spirit, alone constitute the true challenge of saintship (<a onClick="return mV(\'Jam\',1,12);">Jas 1:12</a>); but it is the mark of an ignoble nature to be perpetually the center of vicious fancies and tempers which are not of God but of the devil (<a onClick="return mV(\'Jam\',1,\'13-15\');">Jas 1:13-15</a>). One may not escape entirely such buffetings of faith, but by any sound nature they are easily disposed of. Not so easily disposed of are the trials (temptations) to faith through adversity, affliction, trouble (<a onClick="return mV(\'Luk\',22,28);">Lu 22:28</a>; <a onClick="return mV(\'Act\',20,19);">Ac 20:19</a>; <a onClick="return mV(\'Jam\',1,2);">Jas 1:2</a>; <a onClick="return mV(\'1Pe\',1,6);">1Pe 1:6</a>); and yet there is no lack of evidence to the consoling fact that God does not suffer His own to be tempted above what they are able to bear (<a onClick="return mV(\'1Cr\',10,13);">1Co 10:13</a>) and that for every crisis His grace will be sufficient (<a onClick="return mV(\'2Cr\',12,8,9);">2Co 12:8,9</a>).``168';
isbe[8675]='Temptation of Christ`1. The Sources:<P>The sources for this event are <a onClick="return mV(\'Mar\',1,12,13);">Mr 1:12,13</a>; <a onClick="return mV(\'Mat\',4,\'1-11\');">Mt 4:1-11</a>; <a onClick="return mV(\'Luk\',4,\'1-13\');">Lu 4:1-13</a>; compare <a onClick="return mV(\'Hbr\',2,18);">Heb 2:18</a>; <a onClick="return mV(\'Hbr\',4,15,16);">4:15,16</a>, and see <a href="./study/isbe/search.html?string=GETHSEMANE">GETHSEMANE</A>. Mark is probably a condensation; Matthew and Luke have the same source, probably the discourses of Jesus. Matthew is usually regarded as nearest the original, and its order is here followed.<P>2. Time and Place:<P>The Temptation is put immediately after the Baptism by all the synoptists, and this is psychologically necessary, as, we shall see. The place was the wilderness; it was "up" from the Jordan valley (Matthew), and was on the way back to Galilee (Luke). The traditional site, Mt. Quarantana, is probably a good guess.<P>3. Significance:<P>At His baptism, Jesus received from heaven the final confirmation of His thought that He was the Messiah. It was the greatest conception which ever entered a human mind and left it sane. Under the irresistible influence of the Spirit, He turned aside to seek out in silence and alone the principles which should govern Him in His Messianic work. This was absolutely necessary to any wise prosecution of it. Without the slightest precedent Jesus must determine what a Messiah would do, how He would act. Radical critics agree that, if such a period of meditation and conflict were not recorded, it would have to be assumed. By this conflict, Jesus came to that clearness and decision which characterized His ministry throughout. It is easy to see how this determination of guiding principles involved the severest temptation, and it is noteworthy that all the temptation is represented as coming from without, and none from within. Here too He must take His stand with reference to all the current ideas about the Messiah and His work.<P>4. The Reporter:<P>Jesus alone can be the original reporter. To this Holtzmann and J. Weiss agree. The report was given for the sake of the disciples, for the principles wrought out in this conflict are the guiding principles in the whole work of the kingdom of God on earth.<P>5. Exposition:<P>(1) Fasting.<P>Jesus was so intensely absorbed that He forgot to eat. There was nothing ascetic or ritualistic about it, and so this is no example for ascetic fasting for us. It is doubtful whether the text demands absolute abstinence from food; rather, long periods of fasting, and insufficient food when He had it. At the end of the forty days, He woke to the realization that He was a starving man.<P>(2) The First Temptation.<P>The first temptation is not a temptation to doubt His Messiahship, nor is the second either. "If thou art the Son of God," i.e. "the Messiah," means, simply, "since thou art the Son of God" (see Burton, Moods and Tenses, sections 244, 245; Robertson, Short Grammar, 161). There was not the slightest doubt on this point in Jesus\' mind after the baptism, and Satan knew it. There is no temptation to prove Himself the Messiah, nor any hint of such a thing in Jesus\' replies. The very point of it all is, How are you going to act, since you are Messiah? (<a onClick="return mV(\'Mat\',4,3);">Mt 4:3</a> parallel <a onClick="return mV(\'Luk\',4,3);">Lu 4:3</a>).<P>The temptation has these elements:<P>(a) The perfectly innocent craving for food is imperious in the starving man.<P>(b) Why should He not satisfy His hunger, since He is the Son of God and has the power?<P>Jesus replies from <a onClick="return mV(\'Deu\',8,3);">De 8:3</a>, that God can and will provide Him bread in His own way and in His own time. He is not referring to spiritual food, which is not in question either here or in Deuteronomy (see Broadus\' just and severe remark here). He does not understand how God will provide, but He will wait and trust. Divinely-assured of Messiahship, He knows that God will not let Him perish. Here emerges the principle of His ministry; He will never use His supernatural power to help Himself. Objections based on <a onClick="return mV(\'Luk\',4,30);">Lu 4:30</a> and <a onClick="return mV(\'Jhn\',10,39);">Joh 10:39</a> are worthless, as nothing miraculous is there implied. The walking on the water was to help the apostles\' faith. But why would it have been wrong to have used His supernatural power for Himself? Because by so doing He would have refused to share the human lot, and virtually have denied His incarnation. If He is to save others, Himself He cannot save (<a onClick="return mV(\'Mat\',27,42);">Mt 27:42</a>). In passing, it is well to notice that "the temptations all turn on the conflict which arises, when one, who is conscious of supernatural power, feels that there are occasions, when it would not be right to exercise it." So the miraculous is here most deeply imbedded in the first principles of Messianic action.<P>(3) The Second Temptation.<P>The pinnacle of the temple was probably the southeast corner of the roof of the Royal Cloister, 326 ft. above the bottom of the Kidron valley. The proposition was not to leap from this height into the crowd below in the temple courts, as is usually said, for<P>(a) there is no hint of the people in the narrative;<P>(b) Jesus reply does not fit such an idea; it meets another temptation entirely;<P>(c) this explanation confuses the narrative, making the second temptation a short road to glory like the third;<P>(d) it seems a fantastic temptation, when it is seriously visualized.<P>Rather Satan bids Jesus leap into the abyss outside the temple. Why then the temple at all, and not some mountain precipice? asks Meyer. Because it was the sheerest depth well known to the Jews, who had all shuddered as they had looked down into it (<a onClick="return mV(\'Mat\',4,\'5-7\');">Mt 4:5-7</a> parallel <a onClick="return mV(\'Luk\',4,\'5-8\');">Lu 4:5-8</a>).<P>The first temptation proved Jesus a man of faith, and the second is addressed to Him as such, asking Him to prove His faith by putting God\'s promise to the test. It is the temptation to fanaticism, which has been the destruction of many a useful servant of God Jesus refuses to yield, for yielding would have been sin. It would have been<P>(a) wicked presumption, as though God must yield to every unreasonable whim of the man, of faith, and so would have been a real "tempting" of God;<P>(b) it would have denied His incarnation in principle, like the first temptation;<P>(c) such fanaticism. would have destroyed His ministry.<P>So the principle was evolved: Jesus will not, of self-will, run into dangers, but will avoid them except in the clear path of duty. He will be no fanatic, running before the Spirit, but will be led by Him in paths of holy sanity and heavenly wisdom. Jesus waited on God.<P>(4) The Third Temptation.<P>The former tests have proved Jesus a man of faith and of common sense. Surely such a man will take the short and easy road to that universal dominion which right-fully belongs to the Messiah. Satan offers it, as the prince of this world. The lure here is the desire for power, in itself a right instinct, and the natural and proper wish to avoid difficulty and pain. That the final object is to set up a universal kingdom of God in righteousness adds to the subtlety of the temptation. But as a condition Satan demands that Jesus shall worship him. This must be symbolically interpreted. Such worship as is offered God cannot be meant, for every pious soul would shrink from that in horror, and for Jesus it could constitute no temptation at all. Rather a compromise with Satan must be meant—such a compromise as would essentially be a submission to him. Recalling the views of the times and the course of Jesus ministry, we can think this compromise nothing else than the adoption by Jesus of the program of political Messiahship, with its worldly means of war, intrigue, etc. Jesus repudiates the offer. He sees in it only evil, for<P>(a) war, especially aggressive war, is to His mind a vast crime against love,<P>(b) it changes the basis of His kingdom from the spiritual to the external,<P>(c) the means would defeat the end, and involve Him in disaster.<P>He will serve God only, and God is served in righteousness. Only means which God approves can be used (<a onClick="return mV(\'Mat\',4,\'8-11\');">Mt 4:8-11</a> parallel <a onClick="return mV(\'Luk\',4,\'9-13\');">Lu 4:9-13</a>). Here then is the third great principle of the kingdom: Only moral and spiritual means to moral and spiritual ends. He turns away from worldly methods to the slow and difficult way of truth-preaching, which can end only with the cross. Jesus must have come from His temptation with the conviction that His ministry meant a life-and-death struggle with all the forces of darkness.<P>6. The Character of the Narrative:<P>As we should expect of Jesus, He throws the story of the inner conflict of His soul into story form. So only could it be understood by all classes of men in all ages. It was a real struggle, but pictorially, symbolically described. This seems to be proved by various elements in the story, namely, the devil can hardly be conceived as literally taking Jesus from place to place. There is no mountain from which all the kingdoms of the world can be seen. This view of the matter relieves all the difficulties.<P>7. How Could a Sinless Christ be Tempted?:<P>The difficulty is that there can be no drawing toward an object unless the object seems desirable. But the very fact that a sinful object seems desirable is itself sin. How then can a sinless person really be tempted at all? Possibly an analysis of each temptation will furnish the answer. In each ease the appeal was a real appeal to a perfectly innocent natural instinct or appetite. In the first temptation, it was to hunger; in the second, to faith; in the third, to power as a means of establishing righteousness. In each ease, Jesus felt the tug and pull of the natural instinct; how insistent is the demand of hunger, for instance! Yet, when He perceived that the satisfaction of these desires was sinful under the conditions, He immediately refused their clamorous appeal. It was a glorious moral victory. It was not that He was metaphysically not able to sin, but that He was so pure that He was able not to sin. He did not prove in the wilderness that He could not be tempted, but that He could overcome the tempter. If it is then said that Jesus, never having sinned, can have no real sympathy with sinners, the answer is twofold: (1) Not he who falls at the first assault feels the full force of temptation, but he who, like Jesus, resists it through long years to the end. (2) Only the victor can help the vanquished; only he, who has felt the most dreadful assaults and yet has stood firm, can give the help needed by the fallen.<P>LITERATURE.<P>Broadus on Matthew in the place cited.; Rhees, Life of Jesus of Nazareth, secs. 91-96; Sanday, Outlines of the Life of Christ, section 13; Holtzmann, Hand-Commentar, I, 67f; J. Weiss, Die Schriften des New Testament, I, 227f; Weiss, Life of Christ, I, 337-54; Dods, article "Temptation," in DCG; Carvie, Expository Times, X (1898-99).``4';
