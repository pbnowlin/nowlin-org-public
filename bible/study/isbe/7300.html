isbe[7318]='Red Sea`(yam-cuph (<a onClick="return mV(\'Exd\',10,19);">Ex 10:19</a> and often), but in many passages it is simply hayam, "the sea"\' Septuagint with 2 or 3 exceptions renders it by he eruthra thalassa, "the Red Sea"; Latin geographers Mare Rubrum):<P>1. Name<P>2. Peculiarities<P>3. Old Testament References<P>4. Passage through the Red Sea by the Israelites<P class="in15">Objections<P class="in15">(1) Steep Banks of the Channel<P class="in15">(2) Walls Formed by the Water<P class="in15">(3) The East Winds<P class="in15">(4) The Miraculous Set Aside<P>LITERATURE<hr /><P>1. Name:<P>The Hebrew name yam-cuph has given rise to much controversy. Yam is the general word for sea, and when standing alone may refer to the Mediterranean, the Dead Sea, the Red Sea, or the Sea of Galilee. In several places it designates the river Nile or Euphrates. Cuph means a rush or seaweed such as abounds in the lower portions of the Nile and the upper portions of the Red Sea. It was in the cuph on the brink of the river that the ark of Moses was hidden (<a onClick="return mV(\'Exd\',2,3,5);">Ex 2:3,5</a>). But as this word does not in itself mean red, and as that is not the color of the bulrush, authorities are much divided as to the reason for this designation. Some have supposed that it was called red from the appearance of the mountains on the western coast, others from the red color given to the water by the presence of zoophytes, or red coral, or some species of seaweed. Others still, with considerable probability, suppose that the name originated in the red or copper color of the inhabitants of the bordering Arabian peninsula. But the name yam-cuph, though applied to the whole sea, was especially used with reference to the northern part, which is alone mentioned in the Bible, and to the two gulfs (Suez and Aqabah) which border the Sinaitic Peninsula, especially the Gulf of Suez.<P>2. Pecularities:<P>The Red Sea has a length of 1,350 miles and an extreme breadth of 205 miles. It is remarkable that while it has no rivers flowing into it and the evaporation from its surface is enormous, it is not much salter than the ocean, from which it is inferred that there must be a constant influx of water from the Indian Ocean through the Straits of Bab-el-Mandeb, together with an outflow of the more saline water beneath the surface. The deepest portion measures 1,200 fathoms. Owing to the lower land levels which prevailed in recent geological times, the Gulf of Suez formerly extended across the lowland which separates it from the Bitter Lakes, a distance of 15 or 20 miles now traversed by the Suez Canal, which encountered no elevation more than 30 ft. above tide. In early historic times the Gulf ended at Ismailia at the head of Lake Timsah. north of this the land rises to a height of more than 50 ft. and for a long time furnished a road leading from Africa into Asia. At a somewhat earlier geological (middle and late Tertiary) period the depression of the land was such that this bridge was also submerged, so that the Red Sea and the Mediterranean were connected by a broad expanse of water which overflowed the whole surface of Lower Egypt.<P>The evidence of the more recent depression of the land surface in all Lower Egypt is unmistakable. Raised beaches containing shells and corals still living in the Red Sea are found at various levels up to more than 200 ft. above tide. One of the most interesting of these is to be seen near the summit of the "Crow\'s Nest," a half-mile south of the great pyramids, where, near the summit of the eminence, and approximately 200 ft. above tide, on a level with the base of the pyramids, there is a clearly defined recent sea beach composed of water-worn pebbles from 1 inches to 1 or 2 ft. in diameter, the interstices of which are filled with small shells loosely cemented together. These are identified as belonging to a variable form, Alectryonia cucullata Born, which lives at the present time in the Red Sea. On the opposite side of the river, on the Mokattam Hills south of Cairo, at an elevation of 220 ft. above tide, similar deposits are found containing numerous shells of recent date, while the rock face is penetrated by numerous borings of lithodomus mollusks (Pholades rugosa Broc.). Other evidences of the recent general depression of the land in this region come from various places on the eastern shores of the Mediterranean. According to Lartet at Ramleh, near Jaffa, a recent beach occurs more than 200 ft. above sea-level containing many shells of Pectunculus violascens Lamk, which is at the present time the most abundant mollusk on the shore of the adjoining Mediterranean. A similar beach has been described by Dr. Post at Lattakia, about 30 miles north of Beirut; while others, according to Hull, occur upon the island of Cyprus. Further evidence of this depression is also seen in the fact that the isthmus between Suez and the Bitter Lakes is covered with recent deposits of Nile mud, holding modern Red Sea shells, showing that, at no very distant date, there was an overflow of the Nile through an eastern branch into this slightly depressed level. The line of this branch of the Nile overflow was in early times used for a canal, which has recently been opened to furnish fresh water to Suez, and the depression is followed by the railroad. According to Dawson, large surfaces of the desert north of Suez, which are now above sea-level, contain buried in the sand "recent marine shells in such a state of preservation that not many centuries may have elapsed since they were in the bottom of the sea" (Egypt and Syria, 67).<P>3. Old Testament References:<P>The Red Sea is connected with the children of Israel chiefly through the crossing of it recorded in Exodus (see 4, below); but there are a few references to it in later times. Solomon is said (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>) to have built a navy at "Ezion-geber, which is beside Eloth, on the shore of the Red Sea, in the land of Edom." This is at the head of the Gulf of Aqabah, the eastern branch of the Red Sea. Here his ships were manned by Hiram king of Tyre with "shipmen that had knowledge of the sea" (<a onClick="return mV(\'1Ki\',9,27);">1Ki 9:27</a>). And (<a onClick="return mV(\'1Ki\',9,28);">1Ki 9:28</a>) "they came to Ophir, and fetched from thence gold." But Eloth was evidently lost to Israel when Edom successfully revolted in the time of Joram (<a onClick="return mV(\'2Ki\',8,20);">2Ki 8:20</a>). For a short time, however, it was restored to Judah by Amaziah (<a onClick="return mV(\'2Ki\',14,22);">2Ki 14:22</a>); but finally, during the reign of Ahaz, the Syrians, or more probably, according to another reading, the Edomites, recovered the place and permanently drove the Jews away. But in <a onClick="return mV(\'1Ki\',22,48);">1Ki 22:48</a> Jehoshaphat is said to have "made ships of Tarshish to go to Ophir for gold: but they went not; for the ships were broken at Ezion-geber"; while in <a onClick="return mV(\'2Ch\',20,36);">2Ch 20:36</a> Jehoshaphat is said to have joined with Ahaziah "to make ships to go to Tarshish; and they made the ships in Ezion-geber."<P>Unless there is some textual confusion here, "ships of Tarshish:" is simply the name of the style of the ship, like "East Indiaman," and Tarshish in Chronicles may refer to some place in the East Indies. This is the more likely, since Solomon\'s "navy" that went to Tarshish once every 3 years came "bringing gold, and silver, ivory, and apes, and peacocks," which could hardly have come from any other place than India.<P>See <a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS, II,1,(2)</a>.<P>4. Passage through the Red Sea by the Israelites:<P>Until in recent times it was discovered that the Gulf of Suez formerly extended 30 miles northward to the site of the present Ismailia and the ancient Pithom, the scene of the Biblical miracle was placed at Suez, the present head of the Gulf. But there is at Suez no extent of shoal water sufficient for the east wind mentioned in Scripture (<a onClick="return mV(\'Exd\',14,21);">Ex 14:21</a>) to have opened a passage-way sufficiently wide to have permitted the host to have crossed over in a single night. The bar leading from Suez across, which is now sometimes forded, is too insignificant to have furnished a passage-way as Robinson supposed (BR(3), I, 56-59). Besides, if the children of Israel were south of the Bitter Lakes when there was no extension of the Gulf north of its present limits, there would have been no need of a miracle to open the water, since there was abundant room for both them and Pharaoh\'s army to have gone around the northern end of the Gulf to reach the eastern shore, while south of Suez the water is too deep for the wind anywhere to have opened a passage-way. But with an extension of the waters of the Gulf to the Bitter Lakes and Lake Timsah, rendered probable by the facts cited in the previous paragraph, the narrative at once so perfectly accords with the physical conditions involved as to become not only easily credible, but self-evidencing.<P>The children of Israel were at Rameses (<a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a>) in the land of Goshen, a place which has not been certainly identified, but could not have been far from the modern Zagazig at the head of the Fresh Water Canal leading from the Nile to the Bitter Lakes. One day\'s journey eastward along Wady Tumilat, watered by this canal brought them to Succoth, a station probably identical with Thuket, close upon the border line separating Egypt from Asia. Through the discoveries of Naville in 1883 this has been identified as Pithom, one of the store-cities built by Pharaoh during the period of Hebrew oppression (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>). Here Naville uncovered vast store pits for holding grain built during the reign of Rameses II and constructed according to the description given in <a onClick="return mV(\'Exd\',1,\'1-\');">Ex 1</a>: the lower portions of brick made with straw, the middle with stubble, and the top of simple clay without even stubble to hold the brick together (see Naville, "The Store-City Pithom and the Route of the Exodus," Egyptian Exploration Fund, 1885; M. G. Kyle, "A Re-examination of Naville\'s Works," Records of the Past, VIII,1901,304-7). The next day\'s journey brought them to Etham on the "edge of the wilderness" (<a onClick="return mV(\'Exd\',13,20);">Ex 13:20</a>; <a onClick="return mV(\'Num\',33,6);">Nu 33:6</a>), probably in the vicinity of the modern Ismailia at the head of Lake Timsah. From this point the natural road to Palestine would have been along the caravan route on the neck of land referred to above as now about 50 ft. above sea-level. Etham was about 30 miles southeast of Zoan or Tanis, the headquarters at that time of Pharaoh, from which he was watching the movements of the host. If they should go on the direct road to Palestine, his army could easily execute a flank movement and intercept them in the desert of Etham. But by divine command (<a onClick="return mV(\'Exd\',14,2);">Ex 14:2</a>) Moses turned southward on the west side of the extension of the Red Sea and camped "before Pihahiroth, between Migdol and the sea, before Baal-zephon" (<a onClick="return mV(\'Exd\',14,22);">Ex 14:22</a> <a onClick="return mV(\'Num\',33,\'5-7\');">Nu 33:5-7</a>). At this change of course Pharaoh was delighted, seeing that the children of Israel were "entangled in the land" and "the wilderness" had "shut them in." Instead of issuing a flank movement upon them, Pharaoh\'s army now followed them in the rear and "overtook them encamping by the sea, beside Pi-hahiroth," the location of which is essential to a proper understanding of the narrative which follows.<P>In <a onClick="return mV(\'Exd\',14,2);">Ex 14:2</a>, Pi-hahiroth is said to be "between Migdol and the sea, before Baal-zephon." Now though Migdol originally meant "watch-tower," it is hardly supposable that this can be its meaning here, otherwise the children of Israel would have been moving directly toward a fortified place. Most probably, therefore, Migdol was the tower-like mountain peak marking the northeast corner of Jebel Geneffeh, which runs parallel with the Bitter Lakes, only a short distance from their western border. Baal-zephon may equally well be some of the mountain peaks on the border of the Wilderness of Paran opposite Cheloof, midway between the Bitter Lakes and Suez. In the clear atmosphere of the region this line of mountains is distinctly visible throughout the whole distance from Ismailia to Suez. There would seem to be no objection to this supposition, since all authorities are in disagreement concerning its location. From the significance of the name it would seem to be the seat of some form of Baal worship, naturally a mountain. Brugsch would identify it with Mr. Cassius on the northern shore of Egypt. Naville (see Murray\'s Illustrated Bible Dictionary, "Red Sea, Passage of") would connect it with the hill called Tussum east of Lake Timsah, where there is a shrine at the present day visited every year about July 14 by thousands of pilgrims to celebrate a religious festival; but, as this is a Mohammedan festival, there seems no reason to connect it with any sanctuary of the Canaanites. Dawson favors the general location which we have assigned to Pi-hahiroth, but would place it beside the narrow southern portion of the Bitter Lakes.<P>Somewhere in this vicinity would be a most natural place for the children of Israel to halt, and there is no difficulty, such as Naville supposes, to their passing between Jebel Geneffeh and the Bitter Lakes; for the mountain does not come abruptly to the lake, but leaves ample space for the passage of a caravan, while the mountain on one side and the lake on the other would protect them from a flank movement by Pharaoh and limit his army to harassing the rear of the Israelite host. Protected thus, the Israelites found a wide plain over which they could spread their camp, and if we suppose them to be as far south as Cheloof, every condition would be found to suit the narrative which follows. Moses was told by the Lord that if he would order the children of Israel to go forward, the sea would be divided and the children of Israel could cross over on dry ground. And when, in compliance with the divine command, Moses stretched out his hand over the sea, "Yahweh caused the sea to go back by a strong east wind all the night, and made the sea dry land, and the waters were divided. And the children of Israel went into the midst of the sea upon the dry ground: and the waters were a wall unto them on their right hand, and on their left. And the Egyptians pursued, and went in after them into the midst of the sea, all Pharaoh\'s horses, his chariots, and his horsemen" (<a onClick="return mV(\'Exd\',14,\'21-30\');">Ex 14:21-30</a>). But when the children of Israel were safely on the other side the waters returned and overwhelmed the entire host of Pharaoh. In the So of Moses which follows, describing the event, it is said that the waters were piled up by the "blast of thy (God\'s) nostrils" (<a onClick="return mV(\'Exd\',15,8);">Ex 15:8</a>), and again, verse 10, "Thou didst blow with thy wind, the sea covered them." Thus 3 times the wind is mentioned as the means employed by God in opening the water. The competency of the wind temporarily to remove the water from the passage connecting the Gulf of Suez with the Bitter Lakes, provided it was only a few feet deep, is amply proved by facts of recent observation. Major General Tullock of the British army (Proc. Victoria Inst., XXVIII, 267-80) reports having witnessed the driving off of the water from Lake Menzaleh by the wind to such an extent as to lower the level 6 ft., thus leaving small vessels over the shallow water stranded for a while in the muddy bottom. According to the report of the Suez Canal Company, the difference between the highest and the lowest water at Suez <span class="noTag">is</span> 10 ft. 7 inches, all of which must be due to the effect of the wind, since the tides do not affect the Red Sea. The power of the wind to affect water levels is strikingly witnessed upon Lake Erie in the United States, where according to the report of the Deep Waterways Commission for 1896 (165, 168) it appears that strong wind from the southwest sometimes lowers the water at Toledo, Ohio, on the western end of the lake to the extent of more than 7 ft., at the same time causing it to rise at Buffalo at the eastern end a similar amount; while a change in the wind during the passage of a single storm reverses the effect, thus sometimes producing a change of level at either end of the lake of 14 ft. in the course of a single day. It would require far less than a tornado to lower the water at Cheloof sufficiently to lay bare the shallow channel which we have supposed at that time to separate Egypt from the Sinaitic Peninsula.<P>See <a href="./study/isbe/search.html?string=EXODUS,+THE">EXODUS, THE</a>.<P>Objections:<P>Several objections to this theory, however, have been urged which should not pass without notice.<P>(1) Steep Banks of the Channel:<P>Some have said that the children of Israel would have found an insuperable obstacle to their advance in the steep banks on either side of the supposed channel. But there were no steep banks to be encountered. A gentle sag leads down on one side to the center of the depression and a correspondingly gentle rise leads up on the other.<P>(2) Walls Formed by the Water:<P>Much has also been made of the statement (<a onClick="return mV(\'Exd\',14,22);">Ex 14:22</a>) that "the waters were a wall unto them on their right hand, and on their left"; but when we consider the rhetorical use of this word "wall" it presents no difficulty. In <a onClick="return mV(\'Pro\',18,11);">Pr 18:11</a> we are told that "The rich man\'s wealth is his strong city, And as a high wall in his own imagination." In <a onClick="return mV(\'Isa\',26,1);">Isa 26:1</a> we are told that God will appoint salvation "for walls and bulwarks." Again Nahum (<a onClick="return mV(\'Nah\',3,8);">3:8</a>) says of Egypt that her "rampart was the sea (margin "the Nile"), and her wall was of the sea." The water upon either side of the opening served the purpose of a wall for protection. There was no chance for Pharaoh to intercept them by a flank movement. Nor is there need of paying further attention to the poetical expressions in the So of Moses, where among other things it is said "that the deeps were congealed in the heart of the sea," and that the "earth (instead of the water) swallowed them."<P>(3) The East Winds:<P>Again it is objected that an east wind does not come from the right direction to produce the desired result. On the other hand it is an east wind only which could have freed the channel from water. A north wind would have blown the water from the Bitter Lakes southward, and owing to the quantity of water impounded would have increased the depth of the water in the narrow passage from the southern end of Suez. An east wind, however, would have pressed the water out from the channel both ways, and from the contour of the shore lines would be the only wind that could have done so.<P>(4) The Miraculous Set Aside:<P>Again, it is objected that this explanation destroys the miraculous character of the event. But it should be noted that little is said in the narrative about the miraculous. On the other hand, it is a straightforward statement of events, leaving their miraculous character to be inferred from their nature. On the explanation we have given the transaction it is what Robinson felicitously calls a mediate miracle, that is, a miracle in which the hand of God is seen in the use of natural forces which it would be impossible for man to command. If anyone should say that this was a mere coincidence, that the east wind blew at the precise time that Moses reached the place of crossing, the answer is that such a coincidence could have been brought about only by supernatural agency. There was at that time no weather bureau to foretell the approach of a storm. There are no tides on the Red Sea with regular ebb and flow. It was by a miracle of prophecy that Moses was emboldened to get his host into position to avail themselves of the temporary opportunity at exactly the right time. As to the relation of the divine agency to the event, speculation is useless. The opening of the sea may have been a foreordained event in the course of Nature which God only foreknew, in which case the direct divine agency was limited to those influences upon the human actors that led them to place themselves where they could take advantage of the natural opportunity. Or, there is no a priori difficulty in supposing that the east wind was directly aroused for this occasion; for man himself produces disturbances among the forces of Nature that are as far-reaching in their extent as would be a storm produced by direct divine agency. But in this case the disturbance is at once seen to be beyond the powers of human agency to produce.<P>It remains to add an important word concerning the evidential value of this perfect adjustment of the narrative to the physical conditions involved. So perfect is this conformity of the narrative to the obscure physical conditions involved, which only recent investigations have made clear, that the account becomes self-evidencing. It is not within the power of man to invent a story so perfectly in accordance with the vast and complicated conditions involved. The argument is as strong as that for human design when a key is found to fit a Yale lock. This is not a general account which would fit into a variety of circumstances. There is only one place in all the world, and one set of conditions in all history, which would meet the requirements; and here they are all met. This is scientific demonstration. No higher proof can be found in the inductive sciences. The story is true. It has not been remodeled by the imagination, either of the original writers or of the transcribers. It is not the product of mythological fancy or of legendary accretion.<P>LITERATURE.<P>Dawson, Egypt and Syria; Hull, Mt. Seir, Sinai and Western Palestine; Naville, "The Store-City Pithom and the Route of the Exodus," Egyptian Exploration Fund, 1885; Kyle, "Bricks without Straw at Pithom: A Re-examination of Naville\'s Works," Records of the Past, VIII, 1901, 304-7; Wright, Scientific Confirmations of Old Testament History, 83-117.``198';
isbe[7319]='Redeemer; Redemption`re-dem\'-er, re-demp\'-shun (paraq, "to tear loose," "to rescue," padhah, ga\'al; agorazo, referring to purchase, lutroumai, from lutron, "a ransom"):<P>1. Gradual Moralizing of Idea of Redemption<P>2. Redemption as Life in Individual<P>3. Redemption as Social<P>4. Redemption as Process<P>5. Moral Implications in Scriptural Idea of Redeemer<P>6. Uniqueness of Son of God as Redeemer<P>LITERATURE<hr /><P>The idea of redemption in the Old Testament takes its start from the thought of property (<a onClick="return mV(\'Lev\',25,26);">Le 25:26</a>; <a onClick="return mV(\'Rth\',4,4);">Ru 4:4</a>). Money is paid according to law to buy back something which must be delivered or rescued (<a onClick="return mV(\'Num\',3,51);">Nu 3:51</a>; <a onClick="return mV(\'Neh\',5,8);">Ne 5:8</a>). From this start the word "redemption" throughout the Old Testament is used in the general sense of deliverance. God is the Redeemer of Israel in the sense that He is the Deliverer of Israel (<a onClick="return mV(\'Deu\',9,26);">De 9:26</a>; <a onClick="return mV(\'2Sa\',7,23);">2Sa 7:23</a>; <a onClick="return mV(\'1Ch\',17,21);">1Ch 17:21</a>; <a onClick="return mV(\'Isa\',52,3);">Isa 52:3</a>). The idea of deliverance includes deliverance from all forms of evil lot, from national misfortune (<a onClick="return mV(\'Isa\',52,9);">Isa 52:9</a>; <a onClick="return mV(\'Isa\',63,9);">63:9</a>; compare <a onClick="return mV(\'Luk\',2,38);">Lu 2:38</a>), or from plague (<a onClick="return mV(\'Psa\',78,35,52);">Ps 78:35,52</a>), or from calamity of any sort (<a onClick="return mV(\'Gen\',48,16);">Ge 48:16</a>; <a onClick="return mV(\'Num\',25,4,9);">Nu 25:4,9</a>). Of course, the general thought of the relation of Israel to God was that God had both a claim upon Israel (<a onClick="return mV(\'Deu\',15,15);">De 15:15</a>) and an obligation toward Israel (<a onClick="return mV(\'1Ch\',17,21);">1Ch 17:21</a>; <a onClick="return mV(\'Psa\',25,22);">Ps 25:22</a>). Israel belonged to Him, and it was by His own right that He could move into the life of Israel so as to redeem Israel. On the other hand, obligation was upon Him to redeem Israel.<P>In the New Testament the idea of redemption has more a suggestion of ransom. Men are held under the curse of the law (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>), or of sin itself (<a onClick="return mV(\'Rom\',7,23);">Ro 7:23</a>f). The Redeemer purchases their deliverance by offering Himself as payment for their redemption (<a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>; <a onClick="return mV(\'1Pe\',1,18);">1Pe 1:18</a>).<P>1. Gradual Moralizing of Idea of Redemption:<P>Throughout both the Old Testament and the New Testament there is to be observed a gradual moralizing of the meaning of redemption. The same process of moralizing has continued throughout all the Christian ages. Starting with the idea of redemption price, conceived almost in material terms, religious thought has advanced to conceptions entirely moral and spiritual. Through the Scriptures, too, the idea of redemption becomes more specffic with the progress of Christian revelation. In the beginning God is the Redeemer from distresses of all kinds. He redeems from calamity and from sorrows. This general idea, of course, persists throughout the revelation and enters largely into our thinking of today, but the growing moral discernment of the Biblical writers comes to attach more and more importance to sin as the chief disturber of man\'s welfare. We would not minimize the force of the Scriptural idea that God is the Deliverer from all misfortune to which man falls heir, but the Scriptural emphasis moves more and more to deliverance from sin. Paul states this deliverance as a deliverance from the law which brings sin out into expression, but we must not conceive his idea in any artificial fashion. He would have men delivered not only from the law, but also from the consequences of evil doing and from the spirit of evil itself (<a onClick="return mV(\'Rom\',8,2);">Ro 8:2</a>).<P>2. Redemption as Life in the Individual:<P>In trying to discern the meaning of redemption from sin, toward which the entire progress of Biblical and Christian thought points, we may well keep in mind the Master\'s words that He came that men might have life and might have it more abundantly (<a onClick="return mV(\'Jhn\',10,10);">Joh 10:10</a>). The word "life" seems to be the final New Testament word as a statement of the purpose of Christ. God sent His Son to bring men to life. The word "life,"\' however, is indefinite. Life means more at one period of the world\'s history than at another. It has the advantage, nevertheless, of always being entirely intelligible in its essential significance. Our aim must be to keep this essential significance in mind and at the same time to provide for an increasing fullness and enlargement of human capacity and endeavor. The aim of redemption can only be to bring men to the fullest use and enjoyment of their powers. This is really the conception implicit even in the earliest statements of redemption. The man redeemed by money payment comes out of the prison to the light of day, or he comes out of slavery into freedom, or he is restored to his home and friends. The man under the law is redeemed from the burden and curse of the law. Paul speaks of his experience under the law as the experience of one chained to a dead body (<a onClick="return mV(\'Rom\',7,24);">Ro 7:24</a>). Of course, relief from such bondage would mean life. In the more spiritual passages of the New Testament, the evil in men\'s hearts is like a blight which paralyzes their higher activities (<a onClick="return mV(\'Jhn\',8,\'33-51\');">Joh 8:33-51</a>). In all redemption, as conceived of in Christian terms, there is a double element. There is first the deliverance as from a curse. Something binds a man or weights him down: redemption relieves him from this load. On the other hand, there is the positive movement of the soul thus relieved toward larger and fuller life. We have said that the Biblical emphasis is always upon deliverance from sin as the essential in redemption, but this deliverance is so essential that the life cannot progress in any of its normal activities until it is redeemed from evil. Accordingly in the Scriptural thought all manner of blessings follow deliverance. The man who seeks first the Kingdom of God and His righteousness finds all other things added unto him (<a onClick="return mV(\'Mat\',6,33);">Mt 6:33</a>). Material, intellectual and social blessings follow as matters of course from the redemption of the inner spirit from evil. The aim of redemption, to beget in men\'s hearts the will to do right, once fulfilled, leads men to seek successfully along all possible avenues for life. This, of course, does not mean that the redeemed life gives itself up to the cultivation of itself toward higher excellencies. It means that the redeemed life is delivered from every form of selfishness. In the unselfish seeking of life for others the redeemed life finds its own greatest achievement and happiness (<a onClick="return mV(\'Mat\',16,25);">Mt 16:25</a>).<P>3. Redemption as Social:<P>Just as the idea of redemption concerned itself chiefly with the inner spirit; so also it concerns itself with the individual as the object of redemption. But as the redemption of the inner spirit leads to freedom in all realms of life, so also the redemption of the individual leads to large social transformations. It is impossible to strike out of the Scriptures the idea of a redeemed humanity. But humanity is not conceived of in general or class terms. The object of redemption is not humanity, or mankind, or the masses. The object of redemption is rather men set in relation to each other as members of a family. But it would do violence to the Scriptural conception to conceive of the individual\'s relations in any narrow or restricted fashion (<a onClick="return mV(\'1Cr\',12,\'12-27\');">1Co 12:12-27</a>).<P>An important enlargement of the idea of redemption in our own time has come as men have conceived of the redemption of individuals in their social relationships. Very often men have thought of redemption as a snatching of individuals from the perils of a world in itself absolutely wicked. Even the material environment of men has at times been regarded as containing something inherently evil. The thought of redemption which seems most in line with Scriptural interpretation would seem to be that which brings the material and social forces within reach of individual wills. Paul speaks of the whole creation groaning and travailing in pain waiting for the revelation of the sons of God (<a onClick="return mV(\'Rom\',8,22);">Ro 8:22</a>). This graphic figure sets before us the essentially Christian conception of the redemption of the forces in the midst of which men are placed. Those redeemed for the largest life, by the very force of their life, will seize all powers of this world to make them the servants of divine purposes. The seer saw a great multitude which no man could number, of every kindred and nation and tongue, shouting the joys of salvation (<a onClick="return mV(\'Rev\',7,9);">Re 7:9</a>), yet the implication nowhere appears that these were redeemed in any other fashion than by surrendering themselves to the forces of righteousness.<P>4. Redemption as Process:<P>We have said that the aim of redemption is to bring men to the largest and fullest life. We have also said that "life" is a general term. To keep close to the Scriptural conceptions we would best say that the aim of redemption is to make men like Christ (<a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>). Otherwise, it might be possible to use the word "life" so as to imply that the riotous exercise of the faculties is what we mean by redemption. The idea of redemption, as a matter of fact, has been thus interpreted in various times in the history of Christian thinking. Life has been looked upon as sheer quantitative exuberance—the lower pleasures of sense being reckoned as about on the same plane with the higher. We can see the moral and spiritual anarchy which would thus be brought about. In Christ\'s words to His disciples He once used the expression, "Ye are clean because of the word which I have spoken unto you" (<a onClick="return mV(\'Jhn\',15,3);">Joh 15:3</a>). In this particular context the idea does not seem to be that of an external washing. Christ seems rather to mean that His disciples are cleansed as a vineyard is cleansed by pruning away some of the branches that others may bear fruit. In other words, the redemption of life is to be interpreted so that stress is laid upon the qualitative rather than the quantitative. Christ indeed found place in His instructions and in His own life for the normal and healthy activities of human existence. He was not an ascetic; He went to feasts and to weddings, but His emphasis was always upon life conceived of in the highest terms. We can say then that the aim of redemption is to beget in men life like that in Christ.<P>5. Moral Implications in the Scriptural Idea of Redeemer:<P>Moreover, redemption must not be conceived of in such fashion as to do away with the need of response upon the part of the individual will. The literal suggestion of ransom has to do with paying a price for a man\'s deliverance, whether the man is willing to be delivered or not. Of course, the assumption in the mind of the Biblical writers was that any man in prison or in slavery or in sickness would be overjoyed at being redeemed; but in dealing with men whose lives are set toward sin we cannot always make this assumption. The dreadfulness of sin is largely in the love of sinning which sinning begets. Some thinkers have interpreted redemption to mean almost a seizing of men without regard to their own will. It is very easy to see how this conception arises. A man who himself hates sin may not stop to realize that some other men love sin. Redemption, to mean anything, must touch this inner attitude of will. We cannot then hold to any idea of redemption which brings men under a cleansing process without the assent of their own wills. If we keep ourselves alive to the growing moral discernment which moves through the Scriptures, we must lay stress always upon redemption as a moral process. Not only must we say that the aim of redemption is to make men like Christ, but we must say also that the method of redemption must be the method of Christ, the method of appealing to the moral will. There is no Scriptural warrant for the idea that men are redeemed by fiat. The most we can get from the words of Christ is a statement of the persistence of God in His search for the lost: \'(He goeth) after that which is lost, until he finds it\' (<a onClick="return mV(\'Luk\',15,4);">Lu 15:4</a>). Some would interpret these words to mean that the process of redemption continues until every man is brought into the kingdom. We cannot, in the light of the New Testament, limit the redeeming love of God; but we cannot, on the other hand, take passages from figurative expressions in such sense as to limit the freedom of men. The redemption must be conceived of as respecting the moral choices of men. In our thought of the divine search for the control of inner human motive we must not stop short of the idea of men redeemed to the love of righteousness on its own account. This would do away with the plan of redeeming men by merely relieving them of the consequences of their sins. Out of a changed life, of course, there must come changed consequences. But the Scriptural teaching is that the emphasis in redemption is always moral, the turning to life because of what life is.<P>Having thus attempted to determine, at least in outline, the content of the Christian idea of redemption, it remains for us to point out some implications as to the work of the Redeemer. Throughout the entire teaching on redemption in the Scriptures, redemption is set before us primarily as God\'s own affair (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>). God redeems His people; He redeems them out of love for them. But the love of God is not to be conceived of as mere indulgence, partiality, or good-humored affection. The love of God rests down upon moral foundations. Throughout the Scriptures, therefore, we find implied often, if not always clearly stated, the idea that God is under obligations to redeem His people. The progress of later thinking has expanded this implication with sureness of moral discernment. We have come to see the obligations of power. The more powerful the man the heavier his obligations in the discharge of this power. This is a genuinely Christian conception, and this Christian conception we apply to the character of God, feeling confident that we are in line with Scriptural teaching. Hence, we may put the obligations of God somewhat as follows: God is the most obligated being in the universe. If a man is under heavy obligations to use aright the power of controlling the forces already at work in the world, how much heavier must be the obligations on the Creator who started these forces! The obligation becomes appalling to our human thought when we think that creation includes the calling of human beings into existence and endowing them with the unsolicited boon of freedom. Men are not in the world of their own choice. Vast masses of them seem to be here as the outworking of impulses almost blind. The surroundings of men make it very easy for them to sin. The tendencies which at least seem to be innate are too often tragically inclined toward evil. Men seem, of themselves, utterly inadequate for their own redemption. If there is to be redemption it must come from God, and the Christian thought of a moral God would seem to include the obligation on the part of God to redeem those whom He has sent into the world. Christ has made clear forever the absolutely binding nature of moral considerations. If the obligation to redeem men meant everything to Christ, it must also mean everything to the God of Christ. So we feel in line with true Christian thinking in the doctrine that redemption comes first as a discharge of the obligations on the part of God Himself.<P>If we look for the common thought in all the Christian statements of God\'s part in redemption we find it in this: that in all these statements God is conceived of as doing all that He can do for the redemption of man. If in earlier times men conceived of the human race as under the dominion of Satan, and of Satan as robbed of his due by the deliverance of man and therefore entitled to some compensation, they also conceived of God Himself as paying the ransom to Satan. If they thought of God as a feudal lord whose dignity had been offended by sin, they thought of God as Himself paying the cost due to offended dignity. If their idea was that a substitute for sinners must be furnished, the idea included the thought of God as Himself providing a substitute. If they conceived of the universe as a vast system of moral laws—broken by sin—whose dignity must be upheld, they thought of God Himself as providing the means for maintaining the dignity of the laws. If they conceived of men as saved by a vast moral influence set at work, they thought of this influence as proceeding, not from man, but from God. The common thought in theories of redemption then, so far as concerns God\'s part, is that God Himself takes the initiative and does all He can in the discharge of the obligation upon Himself. Each phrasing of the doctrine of redemption is the attempt of an age of Christian thinking to say in its own way that God has done all that He can do for men.<P>6. Uniqueness of the Son of God as Redeemer:<P>It is from this standpoint that we must approach the part played by Christ in redemption. This is not the place for an attempt at formal statement, but some elements of Christian teaching are, at least in outline, at once clear. The question is, first, to provide some relation between God and Christ which will make the redemptive work of Christ really effective. Some have thought to find such a statement in the conception that Christ is a prophet. They would empty the expression, "Son of God," of any unique meaning; they would make Christ the Son of God in the same sense that any great prophet could be conceived of as a son of God. Of course, we would not minimize the teaching of the Scripture as to the full humanity of Christ, and yet we may be permitted to voice our belief that the representation of Christ as the Redeemer merely in the same sense in which a prophet is a redeemer does not do justice to the Scripture teaching; and we feel, too, that such a solution of the problem of Christ would be inadequate for the practical task of redemption. If Christ is just a prophet giving us His teaching we rejoice in the teaching, but we are confronted with the problem as to how to make the teaching effective. If it be urged that Christ is a prophet who in Himself realized the moral ideal, we feel constrained to reply that this really puts Christ at a vast distance from us. Such a doctrine of Christ\'s person would make Him the supreme religious genius, but the human genius stands apart from the ordinary mass of men. He may gather up into Himself and realize the ideals of men; He may voice the aspirations of men and realize those aspirations; but He may not be able to make men like unto Himself. Shakespeare is a consummate literary genius. He has said once and for all many things which the common man thinks or half thinks. When the common man comes upon a phrase of Shakespeare he feels that Shakespeare has said for all time the things which he would himself have said if he had been able. But the appreciation of Shakespeare does not make the ordinary man like Shakespeare; the appreciation of Christ has not proved successful in itself in making men like unto Christ.<P>If, on the contrary, without attempting formal theological construction, we put some real meaning into the idea of Christ as the Son of God and hold fast to a unique relationship between Christ and God which makes Christ the greatest gift that God can give us, we find indeed that Christ is lifted up to essentially divine existence; but we find also that this divinity does not estrange Him from us. Redemption becomes feasible, not merely when we have a revelation of how far up man can go, but when we have also a revelation of how far down God can come. If we can think of God as having in some real way come into the world through His Son Jesus Christ, that revelation makes Christ the Lord who can lead us to redemption.<P>Such a conception furnishes the dynamic which we must have in any real process of redemption. We need not only the ideal, but we need power by which to reach the ideal. If we can feel that the universe is under the sway of a moral God, a God who is under obligations to bear the burdens of men, and who willingly assumes these obligations, we really feel that moral life at its fullest and best is the greatest fact in the universe. Moreover, we must be true to the Scriptures and lift the entire conception of redemption beyond the realm of conscience to the realm of the heart. What the conscience of God calls for, the love of God willingly discharges. The Cross of Christ becomes at once the revelation of the righteousness of God and the love of God. Power is thus put back of human conscience and human love to move forward toward redemption (<a onClick="return mV(\'Rom\',8,\'35-39\');">Ro 8:35-39</a>).<P>The aim of the redemption in Christ then is to lift men out of death toward life. The mind is to be quickened by the revelation of the true ideals of human life. The conscience is to be reenforced by the revelation of the moral God who carries on all things in the interests of righteousness. The heart is to be stirred and won by the revelation of the love which sends an only begotten Son to the cross for our redemption. And we must take the work of Christ, not as a solitary incident or a mere historic event, but as a manifestation of the spirit which has been at work from the beginning and works forever. The Lamb was slain from the foundation of the world (<a onClick="return mV(\'Rev\',13,8);">Re 13:8</a>); the spirit of God revealed in the cross of Christ is the same yesterday, today and forever. We have in the cross a revelation of holy love which, in a sense, overpowers and at the same time encourages. The cross is the revelation of the length to which God is willing to go in redemption rather than set aside one jot or tittle of His moral law. He will not redeem men except on terms which leave them men. He will not overwhelm them in any such manner as to do away with their power of free choice. He will show men His own feeling of holiness and love. In the name of a holy love which they can forever aspire after, but which they can never fully reach, men call to Him for forgiveness and that forgiveness men find forever available.<P>It remains to add one further item of Scriptural teaching, namely that redemption is a continuous process. If we may again use the word "life," which has been the key to this discussion, we may say that the aim of redemption is to make men progressively alive. There are not limits to the development of human powers touched by the redemptive processes of God. The cross is a revelation of divine willingness to bear with men who are forever being redeemed. Of course, we speak of the redeemed man as redeemed once and for all. By this we mean that he is redeemed once and for all in being faced about and started in a right direction, but the progress toward full life may be faster or slower according to the man and the circumstances in the midst of which he is placed. Still the chief fact is the direction in which the man is moving. The revelation of God who aids in redemption is of the God who takes the direction as the chief fact rather than the length of the stride or the rate of the movement. Every man is expected to do his best. If he stumbles he is supposed to find his way to his feet; if he is moving slowly, he must attempt to move faster; if he is moving at a slower rate than he can attain, he must strive after the higher rate, but always the dynamic force is the revelation of the holy love of God.<P>The Scriptures honor the prophets in whatever land or time they appear. The Scriptures welcome goodness under any and all circumstances. They have a place for a "light that lighteneth every man that cometh into the world," but they still make it clear that the chief force in the redemption of men is the revelation of holy love in Jesus Christ. The redemption, we repeat, is never conceived of in artificial or mechanical terms. If any man hath not the spirit of Christ he does not belong to Christ (<a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>). The aim of redemption is to beget this spirit, and this spirit is life.<P>LITERATURE.<P>H. C. Sheldon, Systematic Theology; Clarke, Outline of Christian Theology; Brown, Christian Theology in Outline; Mackintosh, Doctrine of Person of Christ; Bowne, Studies in Christianity; Tymms, The Christian Atonement.``112';
