isbe[7342]='Rehabiah`re-ha-bi\'-a (rechabhyah, rechabhyahu, "Yah is wide"): Son of Eliezer, and grandson of Moses. Eponym of a Levitical family (<a onClick="return mV(\'1Ch\',23,17);">1Ch 23:17</a>; <a onClick="return mV(\'1Ch\',24,21);">24:21</a>; <a onClick="return mV(\'1Ch\',26,25);">26:25</a>).``1';
isbe[7343]='Rehearse`re-hurs\' (sum, dabhar, naghadh, tanah; anaggello): Usually means simply "to relate," "to tell," "to declare" (<a onClick="return mV(\'Exd\',17,14);">Ex 17:14</a>; <a onClick="return mV(\'Jdg\',5,11);">Jud 5:11</a>; <a onClick="return mV(\'1Sa\',8,21);">1Sa 8:21</a>; <a onClick="return mV(\'1Sa\',17,31);">17:31</a>; <a onClick="return mV(\'Act\',14,27);">Ac 14:27</a>); with "rehearse from the beginning" in <a onClick="return mV(\'Act\',11,4);">Ac 11:4</a> for archomai, "begin" (so the Revised Version (British and American)). the Revised Version (British and American) has preserved uniformity by translating anaggello by "rehearse" also in <a onClick="return mV(\'Act\',15,4);">Ac 15:4</a>, and has introduced "rehearse" as the translation of exegeomai, throughout (<a onClick="return mV(\'Luk\',24,35);">Lu 24:35</a>; <a onClick="return mV(\'Act\',10,8);">Ac 10:8</a>; <a onClick="return mV(\'Act\',15,12,14);">15:12,14</a>; <a onClick="return mV(\'Act\',21,19);">21:19</a>), except in <a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a> ("declare"). Sirach 19:7, the King James Version has "rehearse" for deuteroo, "repeat" (so the Revised Version (British and American)).``1';
isbe[7344]='Rehob`re\'-hob (rechobh; Rhoob, Rhaab):<P>(1) Etymologically the word means "broad" and might be applied either to a road or a plain. Rehob is given (<a onClick="return mV(\'Num\',13,21);">Nu 13:21</a>) as the northern limit of Israel as reached by the spies. This agrees with the position assigned to Beth-rehob in the narrative of the settlement of the Danites (<a onClick="return mV(\'Jdg\',18,28);">Jud 18:28</a>). It is mentioned again along with the kingdom of Zobah in connection with the wars of Saul (<a onClick="return mV(\'1Sa\',14,47);">1Sa 14:47</a> Septuagint Lag.), and as having been associated with, Zobah and Maacah against David in the Ammonite war and as having been defeated by him (<a onClick="return mV(\'2Sa\',10,6);">2Sa 10:6</a>). Robinson sought to identify it with Hunin, but it hardly suits the references. Buhl (GAP, 240) following Thomson (LB, II, 547) seeks it at Paneas (modern Banias). This would suit all the requirements of the capital, Beth-rehob, which might then be the second Rehob, assigned as part of the territory of Sidon to the tribe Asher (<a onClick="return mV(\'Jos\',19,28,30);">Jos 19:28,30</a>; <a onClick="return mV(\'Jdg\',18,28);">Jud 18:28</a>). We must, however, assign to the kingdom of Rehob a territory extending from the settlements of the Danites to the "entering in of Hamath" or to Libo (modern Leboue), i.e. the Great Plain of Coele-Syria bounded by Lebanon and Anti-Lebanon and within the limits indicated.<P>(2) Two separate towns belonging to Asher (<a onClick="return mV(\'Jos\',19,28);">Jos 19:28</a>; <a onClick="return mV(\'Jos\',19,30);">19:30</a>). One of them was given to the Gershonite Levites (<a onClick="return mV(\'Jos\',21,31);">Jos 21:31</a>), and one is mentioned as remaining in the hands of the Canaanites (<a onClick="return mV(\'Jdg\',1,31);">Jud 1:31</a>).<P>(3) Father of Hadadezer, king of Aram Zobah, who was overwhelmed by David at the Euphrates (<a onClick="return mV(\'2Sa\',8,3,12);">2Sa 8:3,12</a>).<P>(4) One of the Levites who sealed Nehemiah\'s covenant on the 24th Tishri, 444 BC (<a onClick="return mV(\'Neh\',10,11);">Ne 10:11</a>).``23';
isbe[7345]='Rehoboam`re-ho-bo\'-am (rechabh\'am, "the people is enlarged," or perhaps "Am is wide" Rhoboam; "Roboam," <a onClick="return mV(\'Mat\',1,7);">Mt 1:7</a> the King James Version):<P>1. The Disruption of the Kingdom<P>2. Underlying Causes of Disruption<P>3. Shemaiah Forbids Civil War<P>4. Rehoboam\'s Prosperity<P>5. Shishak\'s Invasion<P>6. His Death<hr /><P>The son and successor of Solomon, the last king to claim the throne of old Israel and the first king of Judah after the division of the kingdom. He was born circa 978 BC. His mother was Naamah, an Ammonitess. The account of his reign is contained in <a onClick="return mV(\'1Ki\',14,\'21-31\');">1Ki 14:21-31</a>; <a onClick="return mV(\'2Ch\',10,\'1-\');">2Ch 10-12</a>. The incidents leading to the disruption of the kingdom are told in <a onClick="return mV(\'1Ki\',11,\'43-\');">1Ki 11:43</a>-<a onClick="return mV(\'1Ki\',12,\'1-24\');">12:24</a>; <a onClick="return mV(\'2Ch\',9,\'31-\');">2Ch 9:31-11:4</a>.<P>1. The Disruption of the Kingdom:<P>Rehoboam was 41 years old (<a onClick="return mV(\'2Ch\',12,13);">2Ch 12:13</a>) when he began to reign Septuagint <a onClick="return mV(\'1Ki\',12,24);">1Ki 12:24a</a> says 16 years). He ascended the throne at Jerusalem immediately upon his father\'s death with apparently no opposition. Northern Israel, however, was dissatisfied, and the people demanded that the king meet them in popular assembly at Shechem, the leading city of Northern Israel. True, Israel was no longer, if ever, an elective monarchy. Nevertheless, the people claimed a constitutional privilege, based perhaps on the transaction of Samuel in the election of Saul (<a onClick="return mV(\'1Sa\',10,25);">1Sa 10:25</a>), to be a party to the conditions under which they would serve a new king and he become their ruler: David, in making Solomon his successor, had ignored this wise provision, and the people, having lost such a privilege by default, naturally deemed their negligence the cause of Solomon\'s burdensome taxes and forced labor. Consequently, they would be more jealous of their rights for the future, and Rehoboam accordingly would have to accede to their demand. Having come together at Shechem, the people agreed to accept Rehoboam as their king on condition that he would lighten the grievous service and burdensome taxes of his father. Rehoboam asked for three days\' time in which to consider the request. Against the advice of men of riper judgment, who assured him that he might win the people by becoming their servant, he chose the counsel of the younger men, who were of his own age, to rule by sternness rather than by kindness, and returned the people a rough answer, saying: "My father made your yoke heavy, but I will add to your yoke: my father chastised you with whips, but I will chastise you with scorpions" (<a onClick="return mV(\'1Ki\',12,14);">1Ki 12:14</a>). Rehoboam, however, misjudged the temper of the people, as well as his own ability. The people, led by Jeroboam, a leader more able than himself, were ready for rebellion, and so force lost the day where kindness might have won. The threat of the king was met by the Marseillaise of the people: "What portion have we in David? neither have we inheritance in the son of Jesse: to your tents, O Israel: now see to thine own house, David" (<a onClick="return mV(\'1Ki\',12,16);">1Ki 12:16</a>). Thus the ten tribes dethroned Rehoboam, and elected Jeroboam, their champion and spokesman, their king (see <a href="./study/isbe/search.html?string=JEROBOAM">JEROBOAM</A>). Rehoboam, believing in his ability to carry out his threat (<a onClick="return mV(\'1Ki\',12,14);">1Ki 12:14</a>), sent Adoram, his taskmaster, who no doubt had quelled other disturbances, to subdue the populace, which, insulted by indignities and enraged by Rehoboam\'s renewed insolence, stoned his messenger to death. Realizing, for the first time, the seriousness of the revolt, Rehoboam fled ignominiously back to Jerusalem, king only of Judah and of the adjacent territory of the tribe of Benjamin. The mistake of Rehoboam, was the common mistake of despots. He presumed too much on privilege not earned by service, and on power for which he was not willing to render adequate compensation.<P>2. Underlying Causes of Disruption:<P>It is a mistake, however, to see in the disruption the shattering of a kingdom that had long been a harmonious whole. From the earliest times the confederation of tribes was imperfectly cemented. They seldom united against their common foe. No mention is made of Judah in the list of tribes who fought with Deborah against Sisera. A chain of cities held by the Canaanites, stretching across the country from east to west, kept the north and the south apart. Different physical characteristics produced different types of life in the two sections. Old jealousies repeatedly fanned into new flame intensified the divisions due to natural and artificial causes. David labored hard to break down the old antagonisms, but even in his reign Israel rebelled twice. Northern Israel had produced many of the strongest leaders of the nation, and it was not easy for them to submit to a ruler from the Judean dynasty. Solomon, following David\'s policy of unification, drew the tribes closely together through the centralization of worship at Jerusalem and through the general splendor of his reign, but he, more than any other, finally widened the gulf between the north and the south, through his unjust discriminations, his heavy taxes, his forced labor and the general extravagances of his reign. The religion of Yahweh was the only bond capable of holding the nation together. The apostasy of Solomon severed this bond. The prophets, with their profound knowledge of religious and political values, saw less danger to the true worship of Yahweh in a divided kingdom than in a united nation ruled over by Rehoboam, who had neither political sagacity nor an adequate conception of the greatness of the religion of Yahweh. Accordingly, Ahijah openly encouraged the revolution, while Shemaiah gave it passive support.<P>3. Shemaiah Forbids Civil War:<P>Immediately upon his return to Jerusalem, Rehoboam collected a large army of 180,000 men (reduced to 120,000 in the Septuagint\'s Codex Vaticanus), for the purpose of making war against Israel. The expedition, however, was forbidden by Shemaiah the prophet on the ground that they should not fight against their brethren, and that the division of the kingdom was from God. Notwithstanding the prohibition, we are informed that "there was war between Rehoboam and Jeroboam continually" (<a onClick="return mV(\'1Ki\',14,30);">1Ki 14:30</a>; <a onClick="return mV(\'2Ch\',12,15);">2Ch 12:15</a>).<P>4. Rehoboam\'s Prosperity:<P>Rehoboam next occupied himself in strengthening the territory which still remained to him by fortifying a number of cities (<a onClick="return mV(\'2Ch\',11,\'5-12\');">2Ch 11:5-12</a>). These cities were on the roads to Egypt, or on the western hills of the Judean Shephelah, and were doubtless fortifled as a protection against Egypt. According to <a onClick="return mV(\'2Ch\',11,\'13-17\');">2Ch 11:13-17</a>, Rehoboam\'s prosperity was augmented by an immigration of priests and Levites from Israel, who came to Jerusalem because of their opposition to the idolatrous worship instituted by Jeroboam. All who were loyal to Yahweh in the Northern Kingdom are represented as following the example of the priests and Levites in going to Jerusalem, not simply to sacrifice, but to reside there permanently, thus strengthening Rehoboam\'s kingdom. In view of the fact that Rehoboam added to the innovations of his father, erected pillars of Baal in Jerusalem long before they were common in Northern Israel, and that he permitted other heathen abominations and immoralities, it seems that the true worship of Yahweh received little encouragement from the king himself. As a further evidence of his prosperity, Chronicles gives an account of Rehoboam\'s family. Evidently he was of luxurious habit and followed his father in the possession of a considerable harem (<a onClick="return mV(\'2Ch\',11,\'18-23\');">2Ch 11:18-23</a>). He is said to have had 18 wives and 60 concubines, (<a onClick="return mV(\'2Ch\',11,21);">2Ch 11:21</a>; the Septuagint\'s Codex Vaticanus and Josephus, Ant, VIII, x, 1 give "30 concubines").<P>5. Shishak\'s Invasion:<P>One of the direct results of the disruption of the kingdom was the invasion of Palestine by Shishak, king of Egypt, in the 5th year of Rehoboam. Shishak is Sheshonk. I, the first king of the XXIId or Bubastite Dynasty. He is the same ruler who granted hospitality to Jeroboam when he was obliged to flee from Solomon (<a onClick="return mV(\'1Ki\',11,40);">1Ki 11:40</a>). The Septuagint (<a onClick="return mV(\'1Ki\',12,24);">1Ki 12:24</a> e) informs us that Jeroboam married Ano, the sister of Shishak\'s wife, thus becoming brother-in-law to the king of Egypt. It is therefore easy to suppose that Jeroboam, finding himself in straits in holding his own against his rival, Rehoboam, called in the aid of his former protector. The results of this invasion, however, are inscribed on the temple at Karnak in Upper Egypt, where a list of some 180 (Curtis, "Chronicles," ICC) towns captured by Shishak is given. These belong to Northern Israel as well as Judah, showing that Shishak exacted tribute there as well as in Judah, which seems scarcely reconcilable with the view that he invaded Palestine as Jeroboam\'s ally. However, the king of Israel, imploring the aid of Shishak against his rival, thereby made himself vassal to Egypt. This would suffice to make his towns figure at Karnak among the cities subjected in the course of the campaign. The Chronicler saw in Shishak an instrument in the hand of God for the punishment of R. and the people for the national apostasy. According to <a onClick="return mV(\'2Ch\',12,3);">2Ch 12:3</a>, Shishak had a force of 1,200 chariots and 60,000 horsemen to which Josephus adds 400,000 foot-soldiers, composed of Lubim, Sukkum and Ethiopians. No resistance appears to have been offered to the advance of the invading army. Not even Jerusalem seems to have stood a siege. The palace and the temple were robbed of all their treasures, including the shields of gold which Solomon had made. For these Rehoboam later substituted shields of brass (<a onClick="return mV(\'2Ch\',12,9,10);">2Ch 12:9,10</a>).<P>6. His Death:<P>Rehoboam died at the age of fifty-eight, after having reigned in Jerusalem for 17 years. His son Abijah became his successor. He was buried in Jerusalem. Josephus says that in disposition he was a proud and foolish man, and that he "despised the worship of God, till the people themselves imitated his wicked actions" (Ant., VIII, x, 2).``125';
isbe[7346]='Rehoboth`re-ho\'-both, re-ho\'-both (rehobhoth, "broad places"; Euruchoria): One of the wells dug by Isaac (<a onClick="return mV(\'Gen\',26,22);">Ge 26:22</a>). It is probably the Rubuta of the Tell el-Amarna Letters (Petrie, numbers 256, 260; see also The Expository Times, XI, 239 (Konig), 377 (Sayce)), and it is almost certainly identical with the ruin Ruchaibeh, 8 hours southwest of Beersheba. Robinson (BR, I, 196-97) describes the ruins of the ancient city as thickly covering a "level tract of 10 to 12 acres in extent"; "many of the dwellings had each its cistern, cut in the solid rock"; "once this must have been a city of not less than 12,000 or 15,000 inhabitants. Now it is a perfect field of ruins, a scene of unutterable desolation, across which the passing stranger can with difficulty find his way." Huntington (Palestine and Its Transformation, 124) describes considerable remains of a suburban population extending both to the north and to the south of this once important place.``117';
isbe[7347]='Rehoboth By the River`(rehobhoth ha-nahar; Codex Vaticanus Rhooboth (Rhoboth in Chronicles) he para potamon; Codex Alexandrinus Rhoboth): This city is mentioned only as the residence of Shaul, one of the rulers of Edom (<a onClick="return mV(\'Gen\',36,37);">Ge 36:37</a>; <a onClick="return mV(\'1Ch\',1,48);">1Ch 1:48</a>). There is nothing to guide us with certainty as to the situation of the city. Eusebius (Onomasticon) places it in Idumaea (Gebalene), but no trace of a name resembling this has been found in the district. "The river" usually means the Euphrates. If the city could have been so far from Edom, it might be identified with Rahaba on the west of the river, 8 miles south of its confluence with the Khabur. Winckler thinks it might possibly be on the boundary between Palestine and Egypt, "the river" being Wady el-\'Arish, "the brook of Egypt" (<a onClick="return mV(\'Num\',5,\'1-\');">Nu 5</a>; <a onClick="return mV(\'Jos\',15,4);">Jos 15:4</a>, etc.).``54';
isbe[7348]='Rehoboth-Ir`r.-ur, r.-ir (rehobhoth \'ir, "Rehoboth City"; Septuagint he Rhohbos (Rhooboth) polis, "the city Rhoobos, Rhooboth"):<P>1. Probably Rebit Ninua:<P>The second of the cities built by Asshur (the Revised Version (British and American) by Nimrod) in Assyria (<a onClick="return mV(\'Gen\',10,11,12);">Ge 10:11,12</a>). Unlike the other three, the exact equivalent of this name is not found in Assyrian literature Fried. Delitzsch points out (Wo lag das Paradies? 260f) that rechobhoth is the equivalent of the Assyrian rebite, "streets," and suggests that the site referred to may be the Rebit Ninua, "streets of Nineveh," mentioned by Sargon of Assyria in connection with the peopling of Maganubba (Khorsabad or Dur-Sarru-kin; see <a href="./study/isbe/search.html?string=NINEVEH">NINEVEH</A>); and it was through this tract that Esar-haddon, his grandson, caused the heads of the kings of Kundi and Sidon to be carried in procession when he returned from his expedition to the Mediterranean.<P>2. Or, Possibly, the Old Capital, Assur:<P>Though the probabilities in favor of Rebit Ninua are great, it is doubtful whether a suburb could have been regarded as a foundation worthy of a primitive ruler, and that a very important city, Assur, the old capital of Assyria, would rather be expected. One of the groups expressing its name is composed of the characters Sag-uru, or, dialectically, Sab-eri, the second element being the original of the Hebrew \'ir. As the "center-city," Assur may have been regarded as the city of broad spaces (rechobhoth)—its ruins are of considerable extent. The German explorers there have made many important discoveries of temples, temple- towers, palaces and streets, the most picturesque in ancient times being the twin tower-temples of Anu (the sky) and Adad (Hadad). The ruins lie on the Tigris, about 50 miles south of Nineveh. It practically ceased to be the capital about the middle of the 8th century BC.`<a href="./study/isbe/search.html?string=NINEVEH">NINEVEH</a>`136';
isbe[7349]='Rehum`re\'-hum (rechum, or rechum):<P>(1) One of the twelve heads of the Jewish community returning from captivity with Zerubbabel (<a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>; <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a> (by a copyist\'s error "Nehum"); <a onClick="return mV(\'Neh\',12,3);">Ne 12:3</a>; 1Es 5:8, "Roimus").<P>(2) A Persian officer of high rank (literally, "master of judgment, taste, reason") who with others wrote a letter against Jerusalem to King Artaxerxes (<a onClick="return mV(\'Ezr\',4,8,9,17,23);">Ezr 4:8,9,17,23</a>).<P>(3) Son of Bani, a Levite, one of the wall-builders under Nehemiah (<a onClick="return mV(\'Neh\',3,17);">Ne 3:17</a>).<P>(4) One of the signers of the covenant in <a onClick="return mV(\'Neh\',10,25);">Ne 10:25</a>.<P>(5) In <a onClick="return mV(\'Neh\',12,3);">Ne 12:3</a> (omitted in the Septuagint) one Rehum is mentioned with those who went up with Zerubbabel. It is probable that we should read here "Harim" (charim for rechum of <a onClick="return mV(\'Neh\',12,15);">Ne 12:15</a>).``164';
isbe[7350]='Rei`re\'-i (re\'i, "friendly"; Rhesei): Rei, Shimei and the Gibborim who belonged to David are listed among those who did not join Adonijah in his attempt on the throne (<a onClick="return mV(\'1Ki\',1,8);">1Ki 1:8</a>). The name is very uncertain. Winckler (Geschichte, II, 247) identifies him with Ira, the Jairite, who was a "priest to David" (<a onClick="return mV(\'2Sa\',20,26);">2Sa 20:26</a> the Revised Version margin); he tries to prove that this Ira (or Jair) was a priest of Bethlehem. Stade (GVI, I, 293, note 1) holds that Shimei and Rei were two officers of David\'s bodyguard. Josephus (Ant., VII, xiv, 4) has ho Daouidou philos, thus making Shimei a "friend," the courtier of <a onClick="return mV(\'2Sa\',15,37);">2Sa 15:37</a>; <a onClick="return mV(\'2Sa\',16,16);">16:16</a>, and omitting Rei entirely. This would call for an original reading re\'h ha-melekh, or re\'eh ha-melekh, and is too wide a variant from the Massoretic Text. Assuming that Rei belongs in the text, it is safe to conjecture that he was an officer of the royal guard.``197';
isbe[7351]='Reign`ran: The Hebrew word malekhuth, may be rendered "kinghood," "royal dignity," "kingdom," "government" ("reign"). The verb is malakh, "to be king" ("to reign as king"), "to become king," "to accede to the throne," "to assume royal power publicly" and, generally speaking, "to become powerful." In the New Testament hegemonia, basileia, basileuein. The word is used, either as a noun or as a verb, of Yahweh (God), the Messiah (Christ) and men (kings, etc.); then of such terms as sin, death, grace; of the woman in Revelation and, conditionally, of the Christians; once, ironically, of the Corinthians. "Reign" as a noun referring to the time of reigning occurs in <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a> (Solomon); <a onClick="return mV(\'2Ki\',24,12);">2Ki 24:12</a> (Nebuchadnezzar); <a onClick="return mV(\'1Ch\',4,31);">1Ch 4:31</a> (David; compare <a onClick="return mV(\'1Ch\',29,30);">1Ch 29:30</a>); <a onClick="return mV(\'2Ch\',36,20);">2Ch 36:20</a> ("until the reign of the kingdom of Persia"); <a onClick="return mV(\'Neh\',12,22);">Ne 12:22</a> (Darius); <a onClick="return mV(\'Est\',2,16);">Es 2:16</a> (Ahasuerus); <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a> (Tiberius Caesar). More often occurs the verb "to reign," malakh, basileuein. It is applied to:<P>(1) Yahweh at the close of the song of Moses (<a onClick="return mV(\'Exd\',15,18);">Ex 15:18</a>); "Yahweh reigneth" (<a onClick="return mV(\'1Ch\',16,31);">1Ch 16:31</a>; compare <a onClick="return mV(\'Psa\',93,1);">Ps 93:1</a>; <a onClick="return mV(\'Psa\',96,10);">96:10</a>; <a onClick="return mV(\'Psa\',99,1);">99:1</a>; <a onClick="return mV(\'Rev\',19,6);">Re 19:6</a>); "God reigneth over the nations" (<a onClick="return mV(\'Psa\',47,8);">Ps 47:8</a>); "Yahweh of hosts will reign in mount Zion" (<a onClick="return mV(\'Isa\',24,23);">Isa 24:23</a>; compare <a onClick="return mV(\'Mic\',4,7);">Mic 4:7</a>); "Thy God reigneth" (<a onClick="return mV(\'Isa\',52,7);">Isa 52:7</a>); "Thou hast taken thy great power and didst reign" (<a onClick="return mV(\'Rev\',11,17);">Re 11:17</a>, meaning probably "thou didst assume thy might");<P>(2) the Messiah (Christ) as a just and righteous king (<a onClick="return mV(\'Jer\',23,5);">Jer 23:5</a>); an eternal king (<a onClick="return mV(\'Luk\',1,33);">Lu 1:33</a>; compare <a onClick="return mV(\'Rev\',11,15);">Re 11:15</a>); punishing and subduing His enemies (<a onClick="return mV(\'Luk\',19,14,27);">Lu 19:14,27</a>; <a onClick="return mV(\'1Cr\',15,25);">1Co 15:25</a>).<P>(3) Men (kings, etc.), in regard to the source of their power ("By me (i.e. the wisdom of God), kings reign" (<a onClick="return mV(\'Pro\',8,15);">Pr 8:15</a>)); respecting legitimate succession (<a onClick="return mV(\'2Ch\',23,3);">2Ch 23:3</a>); meaning "to have power or dominion" (<a onClick="return mV(\'Gen\',37,8);">Ge 37:8</a> and <a onClick="return mV(\'Job\',34,30);">Job 34:30</a>); in regard to an essential characteristic (<a onClick="return mV(\'Isa\',32,1);">Isa 32:1</a>); in connection with the covenant of Yahweh with David (<a onClick="return mV(\'Jer\',33,21);">Jer 33:21</a>); then the word is used in <a onClick="return mV(\'1Sa\',12,12);">1Sa 12:12</a>, where Samuel reminds the children of Israel of their demanding a king of him (compare verse <a onClick="return mV(\'1Sa\',12,14);">14</A>); of Saul (<a onClick="return mV(\'1Sa\',13,1);">1Sa 13:1</a>; compare <a onClick="return mV(\'1Sa\',11,12);">1Sa 11:12</a>); of Saul\'s son Ish-bosheth (<a onClick="return mV(\'2Sa\',2,10);">2Sa 2:10</a>); of David (<a onClick="return mV(\'2Sa\',5,4);">2Sa 5:4</a>f; compare <a onClick="return mV(\'2Sa\',3,21);">2Sa 3:21</a>); of Adonijah (<a onClick="return mV(\'1Ki\',1,11,24);">1Ki 1:11,24</a>; compare <a onClick="return mV(\'1Ki\',2,15);">1Ki 2:15</a>); of Solomon (<a onClick="return mV(\'1Ki\',1,13);">1Ki 1:13</a>); quite frequently of the kings of Judah and Israel (in the Books of Kings and Chronicles); of the kings of Edom (<a onClick="return mV(\'Gen\',36,31);">Ge 36:31</a>); of Jabin, king of Canaan, in Razor (<a onClick="return mV(\'Jdg\',4,2);">Jud 4:2</a>); of Abimelech, Jerubbaal\'s son, in Jotham\'s fable (<a onClick="return mV(\'Jdg\',9,\'8-15\');">Jud 9:8-15</a>); of Hanun, king of the Ammonites (<a onClick="return mV(\'2Sa\',10,1);">2Sa 10:1</a>); of Rezon and his men in Damascus (<a onClick="return mV(\'1Ki\',11,24);">1Ki 11:24</a>); of Hazael and Ben-hadad, kings of Syria (<a onClick="return mV(\'2Ki\',8,15);">2Ki 8:15</a>, <a onClick="return mV(\'2Ki\',8,13);">13:24</a>); of Esar-haddon, king of Assyria (<a onClick="return mV(\'2Ki\',19,37);">2Ki 19:37</a>); of Ahasuerus, king of Persia (<a onClick="return mV(\'Est\',1,1);">Es 1:1</a>); of Archelaus (<a onClick="return mV(\'Mat\',2,22);">Mt 2:22</a>).<P>(4) In the New Testament the term basileuein, "to reign," is used to illustrate and emphasize the power of sin, death and grace (<a onClick="return mV(\'Rom\',5,14,17,21);">Ro 5:14,17,21</a>; <a onClick="return mV(\'Rom\',6,12);">6:12</a>). Sin, the vitiating mental factor, is to be looked upon as being constantly and resolutely bent on maintaining or regaining its hold upon man, its power being exercised and reinforced by the lusts of the body. Death, the logical outcome of sin, at once testifies to the power of sin and its inherent corruption, while grace is the restoring spiritual factor following up and combating everywhere and always the pernicious influence of sin. It strives to dethrone sin, and to establish itself in man as the only dominating force.<P>(5) In describing the future glorious state of the believers, the New Testament uses the expression of those who endure (in faith; compare <a onClick="return mV(\'2Ti\',2,12);">2Ti 2:12</a>); of those \'purchased unto God with the blood of the Lamb\' (<a onClick="return mV(\'Rev\',5,10);">Re 5:10</a>); of those partaking in the first resurrection (<a onClick="return mV(\'Rev\',20,6);">Re 20:6</a>); of the servants of God, "they shall reign for ever and ever" (<a onClick="return mV(\'Rev\',22,5);">Re 22:5</a>); on the other hand, it teaches us not to anticipate the privileges of heaven, while our Christian life is anything but satisfactory (<a onClick="return mV(\'1Cr\',4,8);">1Co 4:8</a>), and <a onClick="return mV(\'Rev\',17,18);">Re 17:18</a> shows us the terrible fate of the woman, the great city (the corrupt church), "which reigneth over the kings of the earth."`<a href="./study/isbe/search.html?string=KING,+KINGDOM">KING, KINGDOM</a>`8';
isbe[7352]='Reins`ranz (kilyah; nephros, words promiscuously translated "heart," "inward parts," "kidneys" or "reins." The latter word, which is derived from Latin "renes" through Old French "reins", has given place in modern English to the word "kidneys" (see Skeat, Concise Etymological Dictionary of the English Language, 398). the Revised Version (British and American) has, however, retained the older word, at least in the margin, in all passages in which it is found in the King James Version): According to Hebrew psychology the reins are the seat of the deepest emotions and affections of man, which God alone can fully know. Thus the Revised Version (British and American) has substituted "heart" for "reins" in the text of <a onClick="return mV(\'Job\',19,27);">Job 19:27</a>; <a onClick="return mV(\'Psa\',7,9);">Ps 7:9</a>; <a onClick="return mV(\'Psa\',16,7);">16:7</a>; <a onClick="return mV(\'Psa\',26,2);">26:2</a>; <a onClick="return mV(\'Psa\',73,21);">73:21</a>; <a onClick="return mV(\'Pro\',23,16);">Pr 23:16</a>; <a onClick="return mV(\'Jer\',11,20);">Jer 11:20</a>; <a onClick="return mV(\'Jer\',12,2);">12:2</a>; <a onClick="return mV(\'Jer\',17,10);">17:10</a>; <a onClick="return mV(\'Jer\',20,12);">20:12</a>; the translation "inward parts" is found but once (<a onClick="return mV(\'Psa\',139,13);">Ps 139:13</a>). In one passage the King James Version has translated the Hebrew halac ("<a href="./study/isbe/search.html?string=LOINS">loins</a>") with "<a href="./study/isbe/search.html?string=REINS">reins</a>" (<a onClick="return mV(\'Isa\',11,5);">Isa 11:5</a>), where the Revised Version (British and American) has rightly substituted "waist" (which see). The Greek word nephros (which is etymologically allied to the Middle English nere, Get. Niere; see Skeat, ibid, 231, under the word "Kidney") is found in 1Macc 2:24; <a onClick="return mV(\'Rev\',2,23);">Re 2:23</a>.`<a href="./study/isbe/search.html?string=KIDNEYS">KIDNEYS</a>`106';
isbe[7353]='Rekem`re\'-kem (rekem, "friendship"):<P>(1) One of the five kings of Midian slain by the Israelites under Moses (<a onClick="return mV(\'Num\',31,8);">Nu 31:8</a>; <a onClick="return mV(\'Jos\',13,21);">Jos 13:21</a> (Codex Vaticanus Rhobok; Codex Alexandrinus Rhokom)). Like his companions, he is called a "king" in Numbers, but a "prince" or "chieftain" in the passage in Josh. The two references are hardly related; both are based on an earlier tradition.glish Language, 398). the Revised Version (British and American) has, however, retained the older word, at least in the margin, in all passages in which it is found in the King James Version): According to Hebrew psychology the reins are the seat of the deepest emotions and affections of man, which God alone can fully know. Thus the Revised Version (British and American) has substituted "heart" for "reins" in the text of <a onClick="return mV(\'Job\',19,27);">Job 19:27</a>; <a onClick="return mV(\'Psa\',7,9);">Ps 7:9</a>; <a onClick="return mV(\'Psa\',16,7);">16:7</a>; <a onClick="return mV(\'Psa\',26,2);">26:2</a>; <a onClick="return mV(\'Psa\',73,21);">73:21</a>; <a onClick="return mV(\'Pro\',23,16);">Pr 23:16</a>; <a onClick="return mV(\'Jer\',11,20);">Jer 11:20</a>; <a onClick="return mV(\'Jer\',12,2);">12:2</a>; <a onClick="return mV(\'Jer\',17,10);">17:10</a>; <a onClick="return mV(\'Jer\',20,12);">20:12</a>; the translation "inward parts" is found but once (<a onClick="return mV(\'Psa\',139,13);">Ps 139:13</a>). In one passage the King James Version has translated the Hebrew halac ("loins") with "reins" (<a onClick="return mV(\'Isa\',11,5);">Isa 11:5</a>), where the Revised Version (British and American) has rightly substituted "waist" (which see). The Greek word nephros (which is etymologically allied to the Middle English nere, Get. Niere; see Skeat, ibid, 231, under the word "Kidney") is found in 1Macc 2:24; <a onClick="return mV(\'Rev\',2,23);">Re 2:23</a>. compare <a onClick="return mV(\'Mic\',4,7);">Mic 4:7</a>); "Thy God reigneth" (<a onClick="return mV(\'Isa\',52,7);">Isa 52:7</a>); "Thou hast taken thy great power and didst reign" (<a onClick="return mV(\'Rev\',11,17);">Re 11:17</a>, meaning probably "thou didst assume thy might"); (2) the Messiah (Christ) as a just and righteous king (<a onClick="return mV(\'Jer\',23,5);">Jer 23:5</a>); an eternal king (<a onClick="return mV(\'Luk\',1,33);">Lu 1:33</a>; compare <a onClick="return mV(\'Rev\',11,15);">Re 11:15</a>); punishing and subduing His enemies (<a onClick="return mV(\'Luk\',19,14,27);">Lu 19:14,27</a>; <a onClick="return mV(\'1Cr\',15,25);">1Co 15:25</a>).<P>(2) Eponym of a Calebite family (<a onClick="return mV(\'1Ch\',2,43);">1Ch 2:43</a> (Rhekom). Probably a town in Southern Judah. A town of this name is given as belonging to Benjamin (<a onClick="return mV(\'Jos\',18,27);">Jos 18:27</a>).<P>(3) A city of Benjamin, mentioned with Irpeel and Taralah (<a onClick="return mV(\'Jos\',18,27);">Jos 18:27</a>); the site is unknown.`<a href="./study/isbe/search.html?string=RAKEM">RAKEM</a>`197';
isbe[7354]='Relationships, Family`re-la\'-shun-ships:<P><B>I. CONSANGUINITY</B><P class="in15">1. In General<P class="in15">2. Parents and Children<P class="in15">3. Brothers and Sisters<P class="in15">4. Uncles, Aunts, Cousins, Kinsmen<P><B>II. AFFINITY</B><P class="in15">1. Husband and Wife<P class="in15">2. Father-in-Law, etc.<P class="in15">3. Brother-in-Law, etc.<P><B>III. OTHER DOMESTIC RELATIONS</B><P class="in15">1. Foster-Father<P class="in15">2. Master and Servants<P class="in15">3. Host and Guest<P class="in15">4. The Dependent Stranger<HR /><P>The family or domestic relations of the Bible include<P>(1) those of consanguinity or blood relationship,<P>(2) affinity or marriage relationship, and<P>(3) legal convention.<P>Those of consanguinity may be divided into lineal and collateral groups; the former are those of parents and children, grandparents and grandchildren, and ancestors and descendants in general; the latter are those of brothers and sisters, uncles and aunts in relation to nephews and nieces, cousins of various degrees, including mere tribesmen and even remoter kinsfolk. The relations of affinity include besides that of husband and wife or concubine, the relations among rival wives, and their children, those of father-in-law and mother-in-law in relation to son-in-law and daughter-in-law, and those of brothers-in-law and sisters-in-law. The domestic relations based on legal convention are either legal fictions or the results of agreement: among the former we must include those of foster-father or mother and foster-children; among the latter the relations between master and the various classes of servants and slaves held by the ancient Hebrews, those between host and guest, especially where they became covenant brothers, and between the citizen and the stranger who had attached himself to him for his protection.<P>I. Consanguinity.<P>1. In General:<P>Genealogies were carefully kept by the ancient Hebrews (compare those of Genesis, Numbers, Chronicles, Ezra, Nehemiah, Matthew, Luke), not only because they formed the basis of a man\'s title to his property (<a onClick="return mV(\'Num\',27,\'8-11\');">Nu 27:8-11</a>; exceptional case, <a onClick="return mV(\'Num\',36,\'1-12\');">Nu 36:1-12</a>), but also because on one\'s pedigree depended the right of his family to intermarry with the priestly caste. Descent was traced through the father; a man\'s closest association was therefore with his father\'s family, and he was ordinarily referred to as the son of his father, thus Isaac the son of Abraham (<a onClick="return mV(\'Gen\',25,19);">Ge 25:19</a>), Joshua the son of Nun, Caleb the son of Jephunneh (<a onClick="return mV(\'Num\',14,6);">Nu 14:6</a>). Still there are instances of men named for their mothers (Joab the son of Zeruiah), and a man\'s relation with his mother\'s family was fully recognized in the laws forbidding incest. No lineal relatives were permitted to intermarry (<a onClick="return mV(\'Lev\',18,7,10);">Le 18:7,10</a>). The relations of ancestors and descendants were considered so close that the ordinary terms of relationship between children and parents are used constantly in relation to grandparents and remoter ancestors. The wishes of a great-grandfather are respected long after his death as the wishes of a father (<a onClick="return mV(\'Jer\',35,16);">Jer 35:16</a>).<P>2. Parents and Children:<P>The father (\'abh; pater) was the head of the family (mishpachah) or household (bayith), which was a religious (<a onClick="return mV(\'1Sa\',20,6,29);">1Sa 20:6,29</a>; <a onClick="return mV(\'Exd\',12,3);">Ex 12:3</a>; <a onClick="return mV(\'Job\',1,5);">Job 1:5</a>) as well as a social and political unit, consisting usually of a combination of families in the modern sense. As long as polygamy prevailed a family would include at least the several groups of children of the wives and concubines. The Bible represents the Hebrew father as commanding (<a onClick="return mV(\'Gen\',50,16);">Ge 50:16</a>; <a onClick="return mV(\'Jer\',35,6);">Jer 35:6</a>ff; <a onClick="return mV(\'Pro\',6,20);">Pr 6:20</a>), instructing (<a onClick="return mV(\'Pro\',1,8);">Pr 1:8</a>; <a onClick="return mV(\'Pro\',4,1);">4:1</a>), and rebuking (<a onClick="return mV(\'Gen\',37,10);">Ge 37:10</a>; <a onClick="return mV(\'Num\',12,14);">Nu 12:14</a>); at the same time, as loving (<a onClick="return mV(\'Gen\',25,28);">Ge 25:28</a>; <a onClick="return mV(\'Gen\',37,4);">37:4</a>; <a onClick="return mV(\'Gen\',44,20);">44:20</a>), pitying (<a onClick="return mV(\'Psa\',103,13);">Ps 103:13</a>), and blessing his household (<a onClick="return mV(\'Gen\',27,41);">Ge 27:41</a>), rejoicing over its triumphs (<a onClick="return mV(\'Pro\',10,1);">Pr 10:1</a>; <a onClick="return mV(\'Pro\',15,20);">15:20</a>), or grieving over its misfortunes (<a onClick="return mV(\'Gen\',37,35);">Ge 37:35</a>). The mother, too (\'em; meter), naturally displays love and care (<a onClick="return mV(\'Gen\',25,28);">Ge 25:28</a>; <a onClick="return mV(\'Pro\',4,3);">Pr 4:3</a>; <a onClick="return mV(\'Isa\',49,15);">Isa 49:15</a>; <a onClick="return mV(\'Isa\',66,13);">66:13</a>). To the Hebrew woman childlessness was considered the greatest of misfortunes (<a onClick="return mV(\'1Sa\',1,10);">1Sa 1:10</a>, of Hannah; <a onClick="return mV(\'Gen\',30,23);">Ge 30:23</a>, of Rachel). Children were looked upon as a blessing from God (<a onClick="return mV(\'Psa\',127,3);">Ps 127:3</a>) and the defenders of the home (<a onClick="return mV(\'Psa\',127,4,5);">Ps 127:4,5</a>). In early life a child was more directly under the control of the mother than the father; the mother was its first teacher (<a onClick="return mV(\'Pro\',1,8);">Pr 1:8</a>). Thereafter the father was expected to direct the training of the son (ben; huios, teknon) (<a onClick="return mV(\'Gen\',18,19);">Ge 18:19</a>; <a onClick="return mV(\'Exd\',12,26);">Ex 12:26</a>; <a onClick="return mV(\'Exd\',13,8,14,15);">13:8,14,15</a>; <a onClick="return mV(\'Deu\',6,7);">De 6:7</a>), while the daughter (bath; thugater) probably remained with the mother until her marriage (<a onClick="return mV(\'Mic\',7,6);">Mic 7:6</a>). Both parents are looked upon in the Law as objects of honor (<a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a> parallel <a onClick="return mV(\'Deu\',5,16);">De 5:16</a> (the Fifth Commandment); <a onClick="return mV(\'Exd\',21,15);">Ex 21:15</a>; <a onClick="return mV(\'Lev\',20,9);">Le 20:9</a>; <a onClick="return mV(\'Deu\',27,16);">De 27:16</a>; <a onClick="return mV(\'Pro\',20,20);">Pr 20:20</a>; <a onClick="return mV(\'Eze\',22,7);">Eze 22:7</a>; <a onClick="return mV(\'Mic\',7,6);">Mic 7:6</a>), obedience (<a onClick="return mV(\'Gen\',28,7);">Ge 28:7</a>; <a onClick="return mV(\'Lev\',19,3);">Le 19:3</a>; <a onClick="return mV(\'Deu\',21,18);">De 21:18</a>ff; <a onClick="return mV(\'Pro\',1,8);">Pr 1:8</a>; <a onClick="return mV(\'Pro\',30,17);">30:17</a>) and love (<a onClick="return mV(\'1Ki\',19,20);">1Ki 19:20</a>; <a onClick="return mV(\'Pro\',28,24);">Pr 28:24</a>; <a onClick="return mV(\'Pro\',30,11);">30:11</a>). The control of parents was so great as to include the right to sell daughters in marriage, but not, without restrictions, into slavery (<a onClick="return mV(\'Exd\',21,\'7-11\');">Ex 21:7-11</a>; compare <a onClick="return mV(\'Exd\',22,16);">Ex 22:16</a>ff; <a onClick="return mV(\'Neh\',5,5);">Ne 5:5</a>), and never into a life of shame (<a onClick="return mV(\'Lev\',19,29);">Le 19:29</a>); they could chastise children (<a onClick="return mV(\'Deu\',8,5);">De 8:5</a>; <a onClick="return mV(\'Deu\',21,18);">21:18</a>; <a onClick="return mV(\'Pro\',13,24);">Pr 13:24</a>; compare Ecclesiasticus 30:1-13), and in the early days even exerted the power of life and death over them (<a onClick="return mV(\'Gen\',22,\'1-\');">Ge 22</a>; <a onClick="return mV(\'Jdg\',11,39);">Jud 11:39</a>; <a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>; <a onClick="return mV(\'Lev\',20,\'2-5\');">20:2-5</a>; <a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>; compare <a onClick="return mV(\'Mat\',15,4);">Mt 15:4</a>). This power, at least for sacrificial purposes, was entirely removed by the Law, and changed, even for punishment, in the case of a stubborn, rebellious, gluttonous and disobedient son to a mere right of complaint to the proper authorities (<a onClick="return mV(\'Deu\',21,\'18-21\');">De 21:18-21</a>), who were to put him to death. Infanticide by exposure, such as was common among other ancient peoples, seems never to have been practiced by the Hebrews. That the children were nevertheless the chattels of the parents seems to be attested from the fact that they could be seized for the debts of the father (<a onClick="return mV(\'2Ki\',4,1);">2Ki 4:1</a>). The father could annul the vows of his daughter (<a onClick="return mV(\'Num\',30,\'3-5\');">Nu 30:3-5</a>), and damages for wrongs done to her were paid to him, as in English law "for loss of services" (<a onClick="return mV(\'Deu\',22,29);">De 22:29</a>). A widowed or divorced daughter could return to her father (<a onClick="return mV(\'Gen\',38,11);">Ge 38:11</a>; <a onClick="return mV(\'Lev\',22,13);">Le 22:13</a>; <a onClick="return mV(\'Rth\',1,15);">Ru 1:15</a>). At his death the mother would become the actual, if not the legal, head of the household (<a onClick="return mV(\'2Ki\',8,\'1-6\');">2Ki 8:1-6</a>, the Shunammite woman; Tobit 1:8, Tobit\'s grandmother; compare the position of the mother of Jesus). This was especially true of the queen mother (gebhirah), whose name is usually given in the accounts of the kings of Judah (<a onClick="return mV(\'1Ki\',1,11);">1Ki 1:11</a>; <a onClick="return mV(\'1Ki\',2,19);">2:19</a>, where a throne at the king\'s right hand was set for the king\'s mother; <a onClick="return mV(\'1Ki\',11,26);">1Ki 11:26</a>; <a onClick="return mV(\'1Ki\',14,21,31);">14:21,31</a>; <a onClick="return mV(\'1Ki\',15,2,10,13);">15:2,10,13</a>; <a onClick="return mV(\'1Ki\',22,42);">22:42</a>; <a onClick="return mV(\'2Ki\',8,26);">2Ki 8:26</a>; <a onClick="return mV(\'2Ki\',10,13);">10:13</a>; <a onClick="return mV(\'2Ki\',14,2);">14:2</a>; <a onClick="return mV(\'2Ki\',15,2,33);">15:2,33</a>; <a onClick="return mV(\'2Ki\',18,2);">18:2</a>; <a onClick="return mV(\'2Ki\',21,1,19);">21:1,19</a>; <a onClick="return mV(\'2Ki\',22,1);">22:1</a>; <a onClick="return mV(\'2Ki\',23,31,36);">23:31,36</a>; <a onClick="return mV(\'2Ki\',24,8,12,15,18);">24:8,12,15,18</a>; <a onClick="return mV(\'2Ch\',22,2);">2Ch 22:2</a>; <a onClick="return mV(\'Jer\',13,18);">Jer 13:18</a>; <a onClick="return mV(\'Jer\',22,26);">22:26</a>; see <a href="./study/isbe/search.html?string=QUEEN+MOTHER">QUEEN MOTHER</A>). While it is true that the position of the widowed mother depended to some extent on the will of her son (<a onClick="return mV(\'1Ki\',2,18);">1Ki 2:18</a>), it must be remembered that the sense of filial duty was highly developed among all classes in Palestine (<a onClick="return mV(\'Jos\',2,13,18);">Jos 2:13,18</a>; <a onClick="return mV(\'Jos\',6,23);">6:23</a>; <a onClick="return mV(\'1Sa\',22,3);">1Sa 22:3</a>; <a onClick="return mV(\'2Sa\',19,37);">2Sa 19:37</a>; <a onClick="return mV(\'1Ki\',19,20);">1Ki 19:20</a>). The rebellion of children marked the acme of social degeneration (<a onClick="return mV(\'Mic\',7,6);">Mic 7:6</a>; <a onClick="return mV(\'Pro\',30,11);">Pr 30:11</a>); on the other hand the "great day" according to Malachi (<a onClick="return mV(\'Mal\',4,5);">4:5 (Hebrew 3:23)</a>) is one of conciliation of parents and children.<P>3. Brothers and Sisters:<P>The terms "brother" (\'ach; adelphos) and "sister" (\'ahoth; adelphe) apply to children of the same father and mother (<a onClick="return mV(\'Gen\',4,2);">Ge 4:2</a>), and also to children of one father (<a onClick="return mV(\'Gen\',20,12);">Ge 20:12</a>) or of one mother (<a onClick="return mV(\'Gen\',43,7);">Ge 43:7</a>; <a onClick="return mV(\'Lev\',18,9);">Le 18:9</a>; <a onClick="return mV(\'Lev\',20,17);">20:17</a>). The brother as well as the father was the natural protector of the honor of his sister; thus, the sons of Jacob speak of Dinah as "our daughter" (<a onClick="return mV(\'Gen\',34,17);">Ge 34:17</a>). Absalom feels more deeply aggrieved over the crime against Tamar than does David himself (<a onClick="return mV(\'2Sa\',13,21);">2Sa 13:21</a>). The brother\'s other duties toward a sister were very much like those of a father (<a onClick="return mV(\'Sgs\',8,8);">So 8:8</a>). The Law strictly forbids the intermarriage of brother and sister, whether of the same father and mother or not, whether born at home or born abroad, as a "disgraceful thing" (chesedh, a different word from checedh, "kindness" (<a onClick="return mV(\'Lev\',18,9,11);">Le 18:9,11</a>; <a onClick="return mV(\'Lev\',20,17);">20:17</a>). In earlier times marriage between half-brother and sister was allowable (<a onClick="return mV(\'Gen\',20,12);">Ge 20:12</a>; compare <a onClick="return mV(\'2Sa\',13,13);">2Sa 13:13</a>). In fact, we are expressly told that the laws against incest were not obeyed by the Egyptians or the Canaanites (<a onClick="return mV(\'Lev\',18,3);">Le 18:3</a>ff; <a onClick="return mV(\'Lev\',20,23);">20:23</a>). Brotherly sentiment was highly developed (<a onClick="return mV(\'Gen\',24,60);">Ge 24:60</a>; <a onClick="return mV(\'Jos\',2,13);">Jos 2:13</a>; <a onClick="return mV(\'Pro\',17,17);">Pr 17:17</a>; compare <a onClick="return mV(\'Lev\',25,35);">Le 25:35</a>; <a onClick="return mV(\'Deu\',15,11);">De 15:11</a>f; <a onClick="return mV(\'Deu\',25,3);">25:3</a>); the dwelling of brothers together in unity is considered good and pleasant (<a onClick="return mV(\'Psa\',133,1);">Ps 133:1</a>). Brothers were ever ready to protect or avenge each other (<a onClick="return mV(\'2Sa\',3,27);">2Sa 3:27</a>). Indeed, it is part of the unwritten, common law, recognized though not necessarily approved in the Bible, that the brother or next of kin, the go\'el, is expected to avenge a death (<a onClick="return mV(\'Num\',35,19);">Nu 35:19</a>ff; <a onClick="return mV(\'Deu\',19,6);">De 19:6</a>; <a onClick="return mV(\'Jos\',20,3);">Jos 20:3</a>; <a onClick="return mV(\'2Sa\',14,11);">2Sa 14:11</a>), and no punishment is meted out to prevent such self-help, unless it occurs in a refuge-city. A brother was also expected to ransom a captive or slave (<a onClick="return mV(\'Lev\',25,48);">Le 25:48</a>; <a onClick="return mV(\'Psa\',49,7);">Ps 49:7</a>). Half-brothers were of course not so near as brothers of the full blood (compare Joseph and his brothers), and it is not surprising to find the sons of a wife despising and driving out the son of a harlot (<a onClick="return mV(\'Jdg\',11,1);">Jud 11:1</a>, Jephthah). The words "brother" and "sister" are used frequently of more distant relationships (see below) and figuratively of a friend.<P>4. Uncles, Aunts, Cousins, Kinsmen:<P>The Hebrew dodh (<a onClick="return mV(\'Lev\',10,4);">Le 10:4</a>, "uncles"; <a onClick="return mV(\'Num\',36,11);">Nu 36:11</a>, "cousins"; <a onClick="return mV(\'1Sa\',14,50);">1Sa 14:50</a>), coming from a primitive caressing word, possibly indicating "dandle" "fondle" "love" means both "uncle" and "beloved." It is used of the father\'s and also of the mother\'s brother, and the corresponding feminine form (dodhah) is used of the father\'s sister (<a onClick="return mV(\'Exd\',6,20);">Ex 6:20</a>; compare <a onClick="return mV(\'Num\',26,59);">Nu 26:59</a>) and even of the father\'s brother\'s wife (<a onClick="return mV(\'Lev\',18,14);">Le 18:14</a>; <a onClick="return mV(\'Lev\',20,20);">20:20</a>). Intermarriage between nephew and aunt (i.e. father\'s sister, mother\'s sister, or father\'s brother\'s wife, or, in general, uncle\'s wife) was prohibited (<a onClick="return mV(\'Lev\',18,12,13,14);">Le 18:12,13,14</a>; <a onClick="return mV(\'Lev\',20,19,20);">20:19,20</a>), though nothing is said of intermarriage between uncle and niece nor between cousins (compare <a onClick="return mV(\'Num\',36,11);">Nu 36:11</a>). On the relations between uncle and nephew compare the Bible accounts of Jacob and Laban, Abraham and Lot, David and Joab, etc. In a more general sense the word dodh is used of kinsmen, <a onClick="return mV(\'Amo\',6,10);">Am 6:10</a> (where the dodh, "even he that burneth him" (mecarepho, perhaps "maternal uncle"; the Jewish Encyclopedia, under the word "Cremation"), takes charge of a dead body); ben dodh is used of cousin (compare ben \'ahi \'immo, brother of his mother," etc.) and bath dodh of a female cousin. For other relations of this and remoter degrees the word for brother is loosely used (e.g. of nephews, <a onClick="return mV(\'Gen\',13,8);">Ge 13:8</a>; <a onClick="return mV(\'Gen\',14,14);">14:14</a>, etc.; of tribesmen, <a onClick="return mV(\'Lev\',21,10);">Le 21:10</a>; and of more distant relatives, <a onClick="return mV(\'Deu\',2,4,8);">De 2:4,8</a>; <a onClick="return mV(\'Deu\',23,7);">23:7</a>).<P>II. Affinity.<P>1. Husband and Wife:<P>The husband (\'ish; compare ba\'al, <a onClick="return mV(\'Hsa\',2,16);">Ho 2:16</a>; aner), though in a sense leaving father and mother for his wife (\'ishshah; gune) (<a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a>), under normal conditions remained a member of his father\'s family. If such passages as <a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a>; <a onClick="return mV(\'Gen\',21,10);">21:10</a>; <a onClick="return mV(\'Gen\',24,5,67);">24:5,67</a>; <a onClick="return mV(\'Gen\',30,3);">30:3</a>; <a onClick="return mV(\'Gen\',31,31);">31:31</a>; <a onClick="return mV(\'Jdg\',4,17);">Jud 4:17</a>ff; <a onClick="return mV(\'Jdg\',5,24);">5:24ff</a>; <a onClick="return mV(\'Jdg\',8,19);">8:19</a>; <a onClick="return mV(\'Jdg\',9,3);">9:3</a>, indicate the existence in pre-Biblical times of a matriarchate, the allusions are at least too vague to justify the predication of its persistence in Biblical times. The wife was "taken" by her husband, or "given" by her father or, in the case of a servant, by her master or mistress (<a onClick="return mV(\'Gen\',2,22);">Ge 2:22</a>; <a onClick="return mV(\'Gen\',16,3);">16:3</a>; <a onClick="return mV(\'Gen\',34,9,21);">34:9,21</a>), and although the contract was between the men (<a onClick="return mV(\'Gen\',29,\'1-\');">Ge 29</a>; <a onClick="return mV(\'Gen\',34,16);">34:16</a>; <a onClick="return mV(\'Exd\',22,16);">Ex 22:16</a>; <a onClick="return mV(\'Deu\',22,29);">De 22:29</a>; <a onClick="return mV(\'Rth\',4,10);">Ru 4:10</a>) or the parents (<a onClick="return mV(\'Gen\',21,21);">Ge 21:21</a>; <a onClick="return mV(\'Gen\',24,\'1-\');">24</a>), it is probable that the consent of the girl was usually asked (<a onClick="return mV(\'Gen\',24,58);">Ge 24:58</a>). Love between the young people was given due consideration (as in the case of Samson, Shechem, Jacob and Rachel (<a onClick="return mV(\'Gen\',29,18);">Ge 29:18</a>), David and Michal (<a onClick="return mV(\'1Sa\',18,20);">1Sa 18:20</a>)); at least it developed among married people, so that Hosea could compare the attitude of husband toward wife to that of Yahweh toward Israel. As a matter of legal right, it is probable that throughout the Orient long before the events narrated in the Book of Esther, every man did "bear rule in his own house" (<a onClick="return mV(\'Est\',1,22);">Es 1:22</a>). In fact a precedent for the Persian decree has been traced as far back as the first human pair (<a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>). Nevertheless, we find many instances in which the wife seems to take the lead in the affairs of the household, as in the case of Samson\'s parents (<a onClick="return mV(\'Jdg\',13,23);">Jud 13:23</a>), of the Shunammite woman (<a onClick="return mV(\'2Ki\',4,1);">2Ki 4</a>), of Jael (<a onClick="return mV(\'Jdg\',4,18);">Jud 4:18</a>ff; <a onClick="return mV(\'Jdg\',5,24);">5:24), of Achsah (<a onClick="return mV(\'Jos\',15,18);">Jos 15:18</a>f; <a onClick="return mV(\'Jdg\',1,12);">Jud 1:12</a>f), and in less pleasant matters of Jezebel (<a onClick="return mV(\'1Ki\',18,4);">1Ki 18:4</a>; <a onClick="return mV(\'1Ki\',21,\'1-\');">21</a>), Sapphira (<a onClick="return mV(\'Act\',5,2);">Ac 5:2</a>), and Zeresh (<a onClick="return mV(\'Est\',5,14);">Es 5:14</a>), who were at least consulted in the affairs of their several households. Abraham is even commanded by the voice of God, "In all that Sarah saith unto thee, hearken unto her voice" (<a onClick="return mV(\'Gen\',21,12);">Ge 21:12</a>). That most women were not so fortunate is probably best attested by the fact that at least in the earlier times the best of them had to resort to stratagem to accomplish their purposes (as in the cases of Rebekah (<a onClick="return mV(\'Gen\',27,6);">Ge 27:6</a>), Rachel (<a onClick="return mV(\'Gen\',31,34);">Ge 31:34</a>), Leah (<a onClick="return mV(\'Gen\',30,16);">Ge 30:16</a>) and Abigail (<a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>), and even to get information as to their husband\'s affairs (Sarah, <a onClick="return mV(\'Gen\',18,10);">Ge 18:10</a>; Rebekah, <a onClick="return mV(\'Gen\',27,5);">Ge 27:5</a>)). Perhaps their humbler sisters in later days accomplished their ends by being so contentious as to attract the notice of two proverb-collectors (<a onClick="return mV(\'Pro\',21,9);">Pr 21:9</a>; <a onClick="return mV(\'Pro\',25,24);">25:24</a>). Though we have no instance of the exercise of the right of life and death over the wife by the husband, and though it is clear that the Hebrew husband had no power of sale (compare <a onClick="return mV(\'Exd\',21,8);">Ex 21:8</a>), it is frequently asserted on the basis of the one-sided divorce doctrine of the Old Testament (<a onClick="return mV(\'Deu\',24,1);">De 24:1</a>), and on the basis of analogy with other ancient laws, as well as because the wife is spoken of in conjunction with property (<a onClick="return mV(\'Exd\',20,17);">Ex 20:17</a>) and because the husband exercised the right to annul the wife\'s vows (<a onClick="return mV(\'Num\',30,6);">Nu 30:6</a>), that the wife occupied in the ordinary Hebrew home a very subordinate position. It must not be forgotten, however, that the husband owed duties to the wife (<a onClick="return mV(\'Exd\',21,10);">Ex 21:10</a>). It must also be borne in mind that great divergence existed at different times and places, and in different stations of society. Most of our Old Testament evidence pertains to the wealthier classes. The two extremes of the women that are "at ease in Zion" (<a onClick="return mV(\'Isa\',32,\'9-20\');">Isa 32:9-20</a>; compare <a onClick="return mV(\'Amo\',4,1);">Am 4:1</a>ff; <a onClick="return mV(\'Amo\',6,1);">6:1</a>) and the busy "good wife" described in <a onClick="return mV(\'Pro\',31,10);">Pr 31:10</a>ff are hardly exceeded in the most complex society today. The latter probably gives the fairer as well as the more wholesome picture of the functions of the wife in the home, and it is significant that her husband as well as her sons are expected to call her blessed (<a onClick="return mV(\'Pro\',31,28);">Pr 31:28</a>).<P>It is difficult to estimate the extent to which polygamy and concubinage were practiced in ancient Palestine, but it is clear that the former practice was discouraged even among kings (<a onClick="return mV(\'Deu\',17,17);">De 17:17</a>), and the latter, an outgrowth of slavery, was not held in high repute (compare <a onClick="return mV(\'Deu\',21,\'10-14\');">De 21:10-14</a>). The position of a less-favored wife (<a onClick="return mV(\'Deu\',21,15);">De 21:15</a>, "hated") was naturally unpleasant, and her relations with other wives of her husband decidedly bitter—they were called each other\'s tsaroth, literally, "vexers" (the Revised Version (British and American) "rivals," <a onClick="return mV(\'Lev\',18,18);">Le 18:18</a>; <a onClick="return mV(\'1Sa\',1,6);">1Sa 1:6</a>, the King James Version "adversary"; compare Ecclesiasticus 37:11)—even when they were sisters (as in the case of Rachel and Leah, <a onClick="return mV(\'Gen\',30,1);">Ge 30:1</a>). Hence, the Law forbade the marrying of two sisters (<a onClick="return mV(\'Lev\',18,18);">Le 18:18</a>). On the other hand so strong was the desire of a Hebrew mother for children that the childless wife welcomed the children of a maidservant born to her husband as her own (<a onClick="return mV(\'Gen\',30,\'1-12\');">Ge 30:1-12</a>, etc.).<P>2. Father-in-Law, etc.:<P>In normal Hebrew society, for reasons already explained, the relations of a family with the husband\'s parents (cham, from chamoth) were closer than those with the wife\'s parents (chothen, feminine chotheneth; pentheros, penthera. Where under special conditions a man remained with his wife\'s tribe after marriage, as in the case of Jacob, serving out his mohar, or Moses fleeing from the wrath of the Egyptians, or the sons of Elimelech sojourning in the land of Moab because of the famine in Palestine, his identity with his own tribe was not destroyed, and at the first opportunity the natural impulse was to return to his own country. The bride, on the other hand, leaving her people, would become a member of her husband\'s family, with all the rights and duties of a daughter (<a onClick="return mV(\'Mic\',7,6);">Mic 7:6</a>). Thus Judah can order Tamar burned for violation of the obligations of a widow (<a onClick="return mV(\'Gen\',38,24);">Ge 38:24</a>). No doubt the position of the daughter-in-law varied in the Hebrew home between the extremes of those who vexed their parents-in-law unto-the death (<a onClick="return mV(\'Gen\',26,35);">Ge 26:35</a>; <a onClick="return mV(\'Gen\',27,46);">27:46</a>; <a onClick="return mV(\'Gen\',28,8);">28:8</a>) and the one who said to her mother-in-law, "Yahweh do so to me...if aught but death part thee and me" (<a onClick="return mV(\'Rth\',1,17);">Ru 1:17</a>). Parents-in-law and children-in-law were considered too closely related to intermarry (<a onClick="return mV(\'Lev\',18,15);">Le 18:15</a>; <a onClick="return mV(\'Lev\',20,12,14);">20:12,14</a>).<P>3. Brother-in-Law, etc.:<P>A woman\'s brother acting in loco parentis might perform all the offices of a father-in-law and possibly be called chothen (<a onClick="return mV(\'Gen\',24,50,55);">Ge 24:50,55</a>; <a onClick="return mV(\'Gen\',34,11);">34:11</a>). Naturally, brothers-in-law and sisters-in-law would be considered too closely related to intermarry (<a onClick="return mV(\'Lev\',18,16,18);">Le 18:16,18</a>; <a onClick="return mV(\'Lev\',20,21);">20:21</a>). Nevertheless the husband\'s brother (yabham) was expected to marry the childless widow to establish the name of the deceased on his inheritance (<a onClick="return mV(\'Deu\',25,\'5-10\');">De 25:5-10</a>). This custom dated back to Canaanitic practice (<a onClick="return mV(\'Gen\',38,8);">Ge 38:8</a>), and from the connection between marrying the childless widow and the redemption of land may be called a part of the land law of Palestine (<a onClick="return mV(\'Rth\',4,\'1-12\');">Ru 4:1-12</a>; compare <a onClick="return mV(\'Jer\',32,6);">Jer 32:6</a>). In practice the Levirate was probably considered more in the nature of a moral duty than a privilege (<a onClick="return mV(\'Deu\',25,7);">De 25:7</a>; <a onClick="return mV(\'Rth\',4,6);">Ru 4:6</a>), and devolved not only on the brother, but on other members of a deceased husband\'s family in the order of the nearness of their relationship to him (<a onClick="return mV(\'Rth\',3,12);">Ru 3:12</a>). In the Hebrew family brothers-in-law and sisters-in-law would form part of the same household. In this relation as in others we find both ideal friendship (David and Jonathan, <a onClick="return mV(\'1Sa\',18,3);">1Sa 18:3</a>; <a onClick="return mV(\'2Sa\',1,26);">2Sa 1:26</a>) and petty jealousies (in the matter of Moses\' wife, <a onClick="return mV(\'Num\',12,1);">Nu 12:1</a>).<P>III. Other Domestic Relations.<P>1. Foster-father:<P>The Hebrew \'omen, feminine \'omeneth (participle of \'aman), literally, "nourishing," is translated "nursing father" (<a onClick="return mV(\'Num\',11,12);">Nu 11:12</a>; <a onClick="return mV(\'Isa\',49,23);">Isa 49:23</a>), nursing mother" (<a onClick="return mV(\'Isa\',49,23);">Isa 49:23</a>), "nurse" (<a onClick="return mV(\'Rth\',4,16);">Ru 4:16</a>; <a onClick="return mV(\'2Sa\',4,4);">2Sa 4:4</a>), or simply as the equivalent of "bringing up" (<a onClick="return mV(\'2Ki\',10,1,5);">2Ki 10:1,5</a>; <a onClick="return mV(\'Est\',2,7);">Es 2:7</a>). In the case of Esther and of Ahab\'s children, and possibly in the other instances referred to, the relation of foster-parents is suggested. The foster-children under such conditions obeyed the words of the foster-father as the words of a father (<a onClick="return mV(\'Est\',2,20);">Es 2:20</a>). Michal is spoken of as the mother of Merab\'s two children (<a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a>) because she reared them (Sanhedhrin 19b). Adoption in the Roman sense was, however, hardly to be expected in a polygamous society where the childless father could remarry. Nevertheless, Jacob adopts Manasseh and Ephraim (<a onClick="return mV(\'Gen\',48,5);">Ge 48:5</a>), and thereby makes them the fathers of tribes. According to Josephus, while Abraham was childless he adopted Lot (Ant., I, vii, 1), and the daughter of Pharaoh adopted Moses (Ant., II, ix, 7; compare <a onClick="return mV(\'Exd\',2,10);">Ex 2:10</a>). In New Testament times the notion of adoption was so familiar that Paul uses the word figuratively of conversion (huiothesia, <a onClick="return mV(\'Rom\',8,15);">Ro 8:15</a>; <a onClick="return mV(\'Rom\',9,4);">9:4</a>; <a onClick="return mV(\'Gal\',4,5);">Ga 4:5</a>; <a onClick="return mV(\'Eph\',1,5);">Eph 1:5</a>).<P>2. Master and Servants:<P>The "family" as the word is used of ancient peoples included dependents. The Hebrew mishpachah is connected with the word shiphchah, "maidservant," as the Latin familia is connected with famulus, "servant." For a discussion of the various classes of servants and slaves, Hebrew and foreign, male and female, see <a href="./study/isbe/search.html?string=SLAVERY">SLAVERY</A>.<P>3. Host and Guest:<P>When Lot protested against betraying his visitors to the men of Sodom, forasmuch as they had come under the shadow of his roof, and he even preferred to give his daughters to the mob rather than fail in his duties as a host (<a onClick="return mV(\'Gen\',19,8);">Ge 19:8</a>), he was acting on the ancient principle of guest-friendship (compare Greek xenia), which bound host and guest by sacred ties. In the light of this principle the act of Jael, who receives Sisera as a guest, and then betrays him, becomes startling and capable of explanation only on the basis of the intense hatred existing at the time, and justifiable, if at all, only on theory that all is fair in war (<a onClick="return mV(\'Jdg\',4,\'18-21\');">Jud 4:18-21</a>; <a onClick="return mV(\'Jdg\',5,\'24-27\');">5:24-27</a>). The nomads of ancient times and even the post-exilic Hebrews, like the Arabs of today, were bound by a temporary covenant whenever there was "salt between them," that is, in the relation of host and guest (<a onClick="return mV(\'Ezr\',4,14);">Ezr 4:14</a>; compare the expression "covenant of salt," <a onClick="return mV(\'2Ch\',13,5);">2Ch 13:5</a>; <a onClick="return mV(\'Num\',18,19);">Nu 18:19</a>). In the early Christian church breaking bread together served as a sort of a berith \'ahim, or covenant of brothers. In large households such as those of a king, those that ate at the table were members of the household (<a onClick="return mV(\'2Sa\',9,11);">2Sa 9:11</a>, compared to sons; compare also <a onClick="return mV(\'2Sa\',9,7,10,13);">2Sa 9:7,10,13</a>; <a onClick="return mV(\'2Sa\',19,28);">19:28</a>; <a onClick="return mV(\'1Ki\',2,7);">1Ki 2:7</a>; <a onClick="return mV(\'1Ki\',4,27);">4:27</a>; <a onClick="return mV(\'1Ki\',18,19);">18:19</a>).<P>4. The Dependent Stranger:<P>The ger or stranger (as indicated by the expression "thy stranger" (<a onClick="return mV(\'Exd\',20,10);">Ex 20:10</a>; <a onClick="return mV(\'Lev\',25,6);">Le 25:6</a>; <a onClick="return mV(\'Deu\',5,14);">De 5:14</a>; <a onClick="return mV(\'Deu\',29,11);">29:11</a>; <a onClick="return mV(\'Deu\',31,12);">31:12</a>; compare <a onClick="return mV(\'Deu\',1,16);">De 1:16</a>), Hebrew gero, literally, "his stranger") attached himself to an influential Hebrew for protection. Thus we read of a "sojourner of the priest\'s" (<a onClick="return mV(\'Lev\',22,10);">Le 22:10</a>, toschabh; compare <a onClick="return mV(\'Lev\',25,6);">Le 25:6</a>) who was in many respects a dependent, but still to be distinguished from a servant (<a onClick="return mV(\'Lev\',22,11);">Le 22:11</a>). The Mosaic Law commands that such strangers be treated with consideration (<a onClick="return mV(\'Exd\',12,49);">Ex 12:49</a>; <a onClick="return mV(\'Exd\',20,10);">20:10</a>; <a onClick="return mV(\'Exd\',22,21);">22:21</a>ff; <a onClick="return mV(\'Exd\',23,9);">23:9</a>; <a onClick="return mV(\'Lev\',19,33);">Le 19:33</a>; <a onClick="return mV(\'Deu\',1,16);">De 1:16</a>; <a onClick="return mV(\'Deu\',10,18);">10:18</a>; <a onClick="return mV(\'Deu\',14,21);">14:21</a>, etc.; <a onClick="return mV(\'Psa\',146,9);">Ps 146:9</a>) and even with love (<a onClick="return mV(\'Deu\',16,14);">De 16:14</a>; <a onClick="return mV(\'Lev\',19,34);">Le 19:34</a>).`<a href="./study/isbe/search.html?string=HOSPITALITY">HOSPITALITY</a>; <a href="./study/isbe/search.html?string=STRANGER+AND+SOJOURNER">STRANGER AND SOJOURNER</a>`82';
isbe[7355]='Release`re-les\':(1) The forgiveness of a debt (shemittah (<a onClick="return mV(\'Deu\',15,1,2,9);">De 15:1,2,9</a>; <a onClick="return mV(\'Deu\',31,10);">31:10</a>; see <a href="./study/isbe/search.html?string=JUBILEE+YEAR">JUBILEE YEAR</A>)), with verb shamat, "to release," <a onClick="return mV(\'Deu\',31,2,3);">De 31:2,3</a>. (2) To exempt from taxation or military service (hanachah, "release," "rest" (<a onClick="return mV(\'Est\',2,18);">Es 2:18</a>)). Some would render "granted a holiday." (3) To set a prisoner or slave at liberty (apoluo, "to let go free" (<a onClick="return mV(\'Mat\',27,15);">Mt 27:15</a> parallel <a onClick="return mV(\'Jhn\',19,10);">Joh 19:10</a>), etc.).``1';
isbe[7356]='Religion`re-lij\'-un: "Religion" and "religious" in Elizabethan English were used frequently to denote the outward expression of worship. This is the force of threskeia, translated "religion" in <a onClick="return mV(\'Act\',26,5);">Ac 26:5</a>; <a onClick="return mV(\'Jam\',1,26,27);">Jas 1:26,27</a> (with adjective threskos, "religious"), while the same noun in <a onClick="return mV(\'Col\',2,18);">Col 2:18</a> is rendered "worshipping" ("cult" would give the exact meaning). And in the same external sense "religion" is used by the King James Version for latreia, "worship" (so the Revised Version (British and American)), in 1Macc 1:43; 2:19,22. Otherwise "Jews\' religion" (or "religion of the Jews") appears in 2Macc 8:1; 14:38 (the Revised Version (British and American) bis); <a onClick="return mV(\'Gal\',1,13,14);">Ga 1:13,14</a> (Ioudaismos, "Judaism"); and "an alien religion" in 2Macc 6:24 (allophulismos, "that belonging to another tribe"). The neglect of the external force of "religion" has led to much reckless misquoting of <a onClick="return mV(\'Jam\',1,26,27);">Jas 1:26,27</a>. Compare <a onClick="return mV(\'Act\',17,22);">Ac 17:22</a>.`<a href="./study/isbe/search.html?string=SUPERSTITION">SUPERSTITION</a>`48';

isbe[7359]='Remainder`re-man\'-der (yathar, "to be left," she\'erith, "remnant"): In <a onClick="return mV(\'2Sa\',14,7);">2Sa 14:7</a> "residue" would have been clearer (compare <a onClick="return mV(\'Psa\',76,10);">Ps 76:10</a>), but the changes of the Revised Version (British and American) in <a onClick="return mV(\'Lev\',6,16);">Le 6:16</a>; <a onClick="return mV(\'Lev\',7,16,17);">7:16,17</a> are pointless (contrast <a onClick="return mV(\'Exd\',29,34);">Ex 29:34</a>).``1';
isbe[7360]='Remaliah`rem-a-li\'-a (remalyahu, "whom Yahweh has adorned"): The father of Pekah (<a onClick="return mV(\'2Ki\',15,25);">2Ki 15:25</a>ff; <a onClick="return mV(\'Isa\',7,4);">Isa 7:4</a>ff; <a onClick="return mV(\'Isa\',8,6);">8:6</a>). The contemptuous allusion to Pekah as "the son of Remaliah" in <a onClick="return mV(\'Isa\',7,4);">Isa 7:4</a> (similarly "the son of Kish," <a onClick="return mV(\'1Sa\',10,11);">1Sa 10:11</a>) may be a slur on Remaliah\'s humble origin.``1';
isbe[7361]='Remember; Remembrance`re-mem\'-ber, re-mem\'-brans: "Remember" is mostly the translation, in the Old Testament, of zakhar, and in the New Testament of mnaomai (<a onClick="return mV(\'Mat\',5,23);">Mt 5:23</a>; <a onClick="return mV(\'Mat\',26,75);">26:75</a>; <a onClick="return mV(\'Jhn\',2,17);">Joh 2:17</a>, etc.), and of mnemoneuo (<a onClick="return mV(\'Mat\',16,9);">Mt 16:9</a>; <a onClick="return mV(\'Mar\',8,18);">Mr 8:18</a>; <a onClick="return mV(\'Luk\',17,32);">Lu 17:32</a>, etc.), and "remembrance" the translation of derivatives of these (zekher, anamnesis, etc.). There are a few other words. "To remember" is used of God in remembering persons (<a onClick="return mV(\'Gen\',8,1);">Ge 8:1</a>; <a onClick="return mV(\'Gen\',19,29);">19:29</a>, etc.), His covenant (<a onClick="return mV(\'Gen\',9,15);">Ge 9:15</a>; <a onClick="return mV(\'Exd\',2,24);">Ex 2:24</a>; <a onClick="return mV(\'Eze\',16,60);">Eze 16:60</a>, etc.), in answering prayer (<a onClick="return mV(\'Jdg\',16,28);">Jud 16:28</a>; <a onClick="return mV(\'Neh\',13,14,22);">Ne 13:14,22</a>; <a onClick="return mV(\'Psa\',20,3);">Ps 20:3</a>, etc.), and in other ways. Men are exhorted to "remember" God\'s dealings with them, His commandments (<a onClick="return mV(\'Deu\',8,2,18);">De 8:2,18</a>; <a onClick="return mV(\'Jdg\',8,34);">Jud 8:34</a>; <a onClick="return mV(\'1Ch\',16,12);">1Ch 16:12</a>, etc.), the Sabbath (<a onClick="return mV(\'Exd\',20,8);">Ex 20:8</a>), etc. A specially solemn command is that relating to the Lord\'s Supper in <a onClick="return mV(\'Luk\',22,19);">Lu 22:19</a>; <a onClick="return mV(\'1Cr\',11,24,25);">1Co 11:24,25</a>, "This do in remembrance of me." "Remembrancer" (writer of chronicles) occurs in the King James Version margin of <a onClick="return mV(\'2Sa\',8,16);">2Sa 8:16</a>; <a onClick="return mV(\'2Sa\',20,24);">20:24</a>; <a onClick="return mV(\'1Ki\',4,3);">1Ki 4:3</a>; <a onClick="return mV(\'1Ch\',18,15);">1Ch 18:15</a> (text "recorder," the Revised Version margin "chronicler"). In <a onClick="return mV(\'Isa\',62,6);">Isa 62:6</a>, the Revised Version (British and American) reads, "ye that are Yahweh\'s remembrancers." the Revised Version (British and American) has frequent changes on the King James Version text, as "have marked" (<a onClick="return mV(\'1Sa\',15,2);">1Sa 15:2</a>); "make mention of" (<a onClick="return mV(\'Psa\',20,7);">Ps 20:7</a>; <a onClick="return mV(\'Psa\',77,11);">77:11</a>; <a onClick="return mV(\'Sgs\',1,4);">So 1:4</a>); "remember" for "be ye mindful of" (<a onClick="return mV(\'1Ch\',16,15);">1Ch 16:15</a>); "memorial" for "remembrance" (<a onClick="return mV(\'Isa\',57,8);">Isa 57:8</a>); in the American Standard Revised Version, "to his holy memorial name" (<a onClick="return mV(\'Psa\',30,4);">Ps 30:4</a>; <a onClick="return mV(\'Psa\',97,12);">97:12</a>, the English Revised Version "to his holy name," margin "Hebrew \'memorial\' "); in <a onClick="return mV(\'2Ti\',1,5);">2Ti 1:5</a>, "having been reminded of" for the King James Version "call to remembrance," etc.``185';
isbe[7362]='Remeth`re\'-meth, rem\'-eth (remeth; Codex Vaticanus Rhemmas; Codex Alexandrinus Rhamath): A place in the territory of Issachar named with En-gannim (<a onClick="return mV(\'Jos\',19,21);">Jos 19:21</a>). It is probably identical with Ramoth of <a onClick="return mV(\'1Ch\',6,73);">1Ch 6:73</a>, and Jarmuth of <a onClick="return mV(\'Jos\',21,29);">Jos 21:29</a>. It is represented today by the village er-Rameh, situated on a hill which rises abruptly from the green plain about 11 miles southwest of Jenin (Engannim). While the southern boundary of Issachar was, roughly, the southern edge of the plain of Esdraelon, the possessions of the tribes seem sometimes to have overlapped.`<a href="./study/isbe/search.html?string=JARMUTH">JARMUTH</a>; <a href="./study/isbe/search.html?string=RAMOTH">RAMOTH</a>`1';
isbe[7363]='Remission of Sins`re-mish\'-un (aphesis, paresis): The two Greek words, of which the latter occurs only in <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>, were translated by the same English word in the King James Version. In the Revised Version (British and American), paresis is translation "passing over." It is contrasted with the other term as pretermission with remission. Remission is exemption from the consequences of an offense, forgiveness; pretermission is the suspension of the penalty (Philippi, Ellicott, Trench (Synonyms, XXXIII), Weiss; compare <a onClick="return mV(\'Act\',17,30);">Ac 17:30</a>). Cremer (Lexicon of N T Gr) regards the meaning of the two words as identical, except that the one refers to the Old Testament and the other to the New Testament. Sins are remitted when the offender is treated as though the offense had never been committed. Remission is restricted to the penalty, while forgiveness refers more particularly to the person, although it may be used also of the sin itself. Remission also is used of offenses against God\'s law; forgiveness, against either divine or human law.`<a href="./study/isbe/search.html?string=ABSOLUTION">ABSOLUTION</a>; <a href="./study/isbe/search.html?string=FORGIVENESS">FORGIVENESS</a>`84';
isbe[7364]='Remmon`rem\'-on (rimmon, <a onClick="return mV(\'Jos\',19,7);">Jos 19:7</a>).`<a href="./study/isbe/search.html?string=RIMMON">RIMMON</a>`1';
isbe[7365]='Remmon-Methoar`rem\'-on-meth\'-o-ar, rem\'-on-me-tho\'-ar (rimmon ha-metho\'-ar (<a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>)).`<a href="./study/isbe/search.html?string=RIMMON">RIMMON</a>`1';
isbe[7366]='Remnant`rem\'-nant: Remnant is the translation of yether, "what is left over" (<a onClick="return mV(\'Deu\',3,11);">De 3:11</a>; <a onClick="return mV(\'Deu\',28,54);">28:54</a>; <a onClick="return mV(\'Jos\',12,4);">Jos 12:4</a>, etc.); of she\'-ar, "the rest" (<a onClick="return mV(\'Ezr\',3,8);">Ezr 3:8</a> the King James Version; <a onClick="return mV(\'Isa\',10,20,21,22);">Isa 10:20,21,22</a>; <a onClick="return mV(\'Isa\',11,16);">11:16</a>, etc.; <a onClick="return mV(\'Zep\',1,4);">Ze 1:4</a>); more frequently of she\'-erith, "residue," etc. (<a onClick="return mV(\'2Ki\',19,4,31);">2Ki 19:4,31</a>; <a onClick="return mV(\'2Ch\',34,9);">2Ch 34:9</a>; <a onClick="return mV(\'Ezr\',9,14);">Ezr 9:14</a>; <a onClick="return mV(\'Isa\',14,30);">Isa 14:30</a>, etc.). As the translation of the last-mentioned two words, "remnant" has a special significance in the prophecies of Isaiah, as denoting "a holy seed," or spiritual kernel, of the nation which should survive impending judgment and become the germ of the people of God, being blessed of God and made a blessing (compare <a onClick="return mV(\'Mic\',2,12);">Mic 2:12</a>; <a onClick="return mV(\'Mic\',4,7);">4:7</a>; <a onClick="return mV(\'Mic\',5,7,8);">5:7,8</a>; <a onClick="return mV(\'Mic\',7,18);">7:18</a>; also <a onClick="return mV(\'Zep\',2,7);">Ze 2:7</a>; <a onClick="return mV(\'Zep\',3,13);">3:13</a>; <a onClick="return mV(\'Hag\',1,12,14);">Hag 1:12,14</a>; <a onClick="return mV(\'Zec\',8,6);">Zec 8:6</a>; <a onClick="return mV(\'Joe\',2,32);">Joe 2:32</a>). Paul, in <a onClick="return mV(\'Rom\',9,27);">Ro 9:27</a>, quotes from <a onClick="return mV(\'Isa\',10,22);">Isa 10:22</a>f; "the remnant [kataleimma, "what is left over"] shall be saved"; compare also <a onClick="return mV(\'Rom\',11,5);">Ro 11:5</a> (where the word is leimma) with <a onClick="return mV(\'2Ki\',19,4);">2Ki 19:4</a>. Several other Hebrew words are less frequently translated "remnant": \'ahar, "after"; yathar, "to be left over," etc.; in the New Testament (the King James Version) we have also loipos, "left," "remaining" (<a onClick="return mV(\'Mat\',22,6);">Mt 22:6</a>; <a onClick="return mV(\'Rev\',11,13);">Re 11:13</a>, etc.).<P>For "remnant" the Revised Version (British and American) has "overhanging part" (<a onClick="return mV(\'Exd\',26,12);">Ex 26:12</a>), "rest" (<a onClick="return mV(\'Lev\',14,18);">Le 14:18</a>, etc.); on the other hand gives "remnant" for "posterity" (<a onClick="return mV(\'Gen\',45,7);">Ge 45:7</a>), for "rest" (<a onClick="return mV(\'Jos\',10,20);">Jos 10:20</a>; <a onClick="return mV(\'1Ch\',4,43);">1Ch 4:43</a>; <a onClick="return mV(\'Isa\',10,19);">Isa 10:19</a>), for "residue" (<a onClick="return mV(\'Hag\',2,2);">Hag 2:2</a>; <a onClick="return mV(\'Zec\',8,11);">Zec 8:11</a>), etc.``185';
isbe[7367]='Remphan`rem\'-fan.`<a href="./study/isbe/search.html?string=REPHAN">REPHAN</a>`1';
isbe[7368]='Rending of Garments`ren\'-ding.`<a href="./study/isbe/search.html?string=BURIAL">BURIAL</a>; <a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[7369]='Renew`re-nu\': The word is used in various senses:<P>(1) of material things, e.g. <a onClick="return mV(\'Psa\',104,30);">Ps 104:30</a>; here it means to give a new appearance, to refresh, to restore the face of the earth;<P>(2) in <a onClick="return mV(\'1Sa\',11,14);">1Sa 11:14</a>, to establish more firmly the kingdom by reinstalling King Saul;<P>(3) in <a onClick="return mV(\'2Ch\',15,8);">2Ch 15:8</a>, to rebuild or repair the broken altar;<P>(4) in <a onClick="return mV(\'Lam\',5,21);">La 5:21</a>, "renew our days," restore the favors of former days;<P>(5) in <a onClick="return mV(\'Isa\',41,1);">Isa 41:1</a>, \'let them gather together, or marshal their strongest arguments for answer\';<P>(6) in <a onClick="return mV(\'Psa\',103,5);">Ps 103:5</a>; <a onClick="return mV(\'Isa\',40,31);">Isa 40:31</a>, it refers to the restoring of spiritual strength;<P>(7) in the New Testament it invariably refers to spiritual renewal, e.g. <a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>; <a onClick="return mV(\'2Cr\',4,16);">2Co 4:16</a>; <a onClick="return mV(\'Eph\',4,23);">Eph 4:23</a>; <a onClick="return mV(\'Col\',3,10);">Col 3:10</a>; <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>; <a onClick="return mV(\'Hbr\',6,6);">Heb 6:6</a>; all derivatives of kainos, "new."``64';
isbe[7370]='Repair`re-par\' (machceh, "refuge"): In <a onClick="return mV(\'Joe\',3,16);">Joe 3:16</a>, for the King James Version The Lord will be the hope of his people" the King James Version margin renders "place of repair," or, "harbour" = haven of repair. the Revised Version (British and American) gives "refuge." Other words are chazaq, "to strengthen," "harden," "fix" (<a onClick="return mV(\'2Ki\',12,5);">2Ki 12:5</a> and often; <a onClick="return mV(\'Neh\',3,\'1-\');">Ne 3</a>); rapha\' "to heal" (<a onClick="return mV(\'1Ki\',18,30);">1Ki 18:30</a>); \'amadh, "to cause to stand still" (<a onClick="return mV(\'Ezr\',9,9);">Ezr 9:9</a>); chayah, "to revive" (<a onClick="return mV(\'1Ch\',11,8);">1Ch 11:8</a>); caghar, "to close up" (<a onClick="return mV(\'1Ki\',11,27);">1Ki 11:27</a>).<P>In the Revised Version (British and American) Apocrypha for huporrapto, "to patch up" (Sirach 50:1); episkeuazo, "to get ready" (1Macc 12:37). In 1Macc 14:34 occurs "reparation" (modern English "repairs") for epanorthosis, "straightening up."``91';
