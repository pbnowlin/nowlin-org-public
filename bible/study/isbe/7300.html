isbe[7321]='Redound`re-dound\' (from re-," back," and undare, "to surge as a wave"): To be sent back as a reaction, to overflow; occurs only as the translation of perisseuo, "to be over and above," "to superabound" (frequent in the New Testament); in <a onClick="return mV(\'2Cr\',4,15);">2Co 4:15</a>, "might through the thanksgiving of many redound to the glory of God," the Revised Version (British and American) "may cause the thanksgiving to abound."``1';
isbe[7322]='Reed`red:<P>(1) achu, translated "reed-grass" (<a onClick="return mV(\'Gen\',41,2,18);">Ge 41:2,18</a>; <a onClick="return mV(\'Job\',8,11);">Job 8:11</a> margin). See <a href="./study/isbe/search.html?string=FLAG">FLAG</a>.<P>(2) \'ebheh, translated "swift," margin "reed" (<a onClick="return mV(\'Job\',9,26);">Job 9:26</a>). The "ships of reed" are the light skiffs made of plaited reeds used on the Nile; compare "vessels of papyrus" (<a onClick="return mV(\'Isa\',18,2);">Isa 18:2</a>).<P>(3) \'aghammim, translated "reeds," margin "marshes," Hebrew "pools" (<a onClick="return mV(\'Jer\',51,32);">Jer 51:32</a>); elsewhere "pools" (<a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a>; <a onClick="return mV(\'Exd\',8,5);">8:5</a>; <a onClick="return mV(\'Isa\',14,23);">Isa 14:23</a>, etc.). See <a href="./study/isbe/search.html?string=POOL">POOL</a>.<P>(4) \'aroth; achi, translated "meadows," the King James Version "paper reeds" (<a onClick="return mV(\'Isa\',19,7);">Isa 19:7</a>). See <a href="./study/isbe/search.html?string=MEADOW">MEADOW</A>.<P>(5) qaneh; kalamos (the English "cane" comes from Hebrew via Latin and Greek canna), "stalk" (<a onClick="return mV(\'Gen\',41,5,22);">Ge 41:5,22</a>); "shaft" (<a onClick="return mV(\'Exd\',37,17);">Ex 37:17</a>, etc.); "reed," or "reeds" (<a onClick="return mV(\'1Ki\',14,15);">1Ki 14:15</a>; <a onClick="return mV(\'2Ki\',18,21);">2Ki 18:21</a>; <a onClick="return mV(\'Isa\',36,6);">Isa 36:6</a>; <a onClick="return mV(\'Isa\',42,3);">42:3</a>; <a onClick="return mV(\'Psa\',68,30);">Ps 68:30</a>, the King James Version "spearman"); "calamus" (<a onClick="return mV(\'Exd\',30,23);">Ex 30:23</a>; <a onClick="return mV(\'Sgs\',4,14);">So 4:14</a>; <a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a>); "sweet cane," margin "calamus" (<a onClick="return mV(\'Isa\',43,24);">Isa 43:24</a>; <a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a>); "bone" (<a onClick="return mV(\'Job\',31,22);">Job 31:22</a>); used of the cross-beam of a "balance" (<a onClick="return mV(\'Isa\',46,6);">Isa 46:6</a>); "a measuring reed" (<a onClick="return mV(\'Eze\',40,3);">Eze 40:3</a>); "a staff of reed," i.e. a walking-stick (<a onClick="return mV(\'Isa\',36,6);">Isa 36:6</a>; <a onClick="return mV(\'Eze\',29,6);">Eze 29:6</a>); the "branches" of a candlestick (<a onClick="return mV(\'Exd\',37,18);">Ex 37:18</a>).<P>(6) kalamos, "a reed shaken with the wind" (<a onClick="return mV(\'Mat\',11,7);">Mt 11:7</a>; <a onClick="return mV(\'Luk\',7,24);">Lu 7:24</a>); "a bruised reed" (<a onClick="return mV(\'Mat\',12,20);">Mt 12:20</a>); they put "a reed in his right hand" (<a onClick="return mV(\'Mat\',27,29,30);">Mt 27:29,30</a>); "They smote his head with a reed" (<a onClick="return mV(\'Mar\',15,19);">Mr 15:19</a>); "put it on a reed" (<a onClick="return mV(\'Mat\',27,48);">Mt 27:48</a>; <a onClick="return mV(\'Mar\',15,36);">Mr 15:36</a>); "a measuring reed" (<a onClick="return mV(\'Rev\',11,1);">Re 11:1</a>; <a onClick="return mV(\'Rev\',21,15,16);">21:15,16</a>); "a pen" (<a onClick="return mV(\'3Jo\',1,13);">3Joh 1:13</a>).<P>It is clear that qaneh and its Greek equivalent kalamos mean many things. Some refer to different uses to which a reed is put, e.g. a cross-beam of a balance, a walking-stick, a measuring rod, and a pen (see above), but apart from this qaneh is a word used for at least two essentially different things:<P>(1) an ordinary reed, and<P>(2) some sweet-smelling substance.<P>(1) The most common reed in Palestine is the Arundo donax (Natural Order Gramineae), known in Arabic as qacabfarasi, "Persian reed." It grows in immense quantities in the Jordan valley along the river and its tributaries and at the oases near the Dead Sea, notably around \'Ain Feshkhah at the northwest corner. It is a lofty reed, often 20 ft. high, of a beautiful fresh green in summer when all else is dead and dry, and of a fine appearance from a distance in the spring months when it is in full bloom and the beautiful silky panicles crown the top of every reed. The "covert of the reed" (<a onClick="return mV(\'Job\',40,21);">Job 40:21</a>) shelters a large amount of animal and bird life. This reed will answer to almost all the requirements of the above references.<P>(2) Qaneh is in <a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a> qualified qaneh ha-tobh, "sweet" or "pleasant cane," and in <a onClick="return mV(\'Exd\',30,23);">Ex 30:23</a>, qeneh bhosem, "sweet calamus," or, better, a "cane of fragrance." <a onClick="return mV(\'Sgs\',4,14);">So 4:14</a>; <a onClick="return mV(\'Isa\',43,24);">Isa 43:24</a>; <a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a> all apparently refer to the same thing, though in these passages the qaneh is unqualified. It was an ingredient of the holy oil (<a onClick="return mV(\'Exd\',30,23);">Ex 30:23</a>); it was imported from a distance (<a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a>; <a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a>), and it was rare and costly (<a onClick="return mV(\'Isa\',43,24);">Isa 43:24</a>). It may have been the "scented calamus" (Axorus calamus) of Pliny (NH, xii.48), or some other aromatic scented reed or flag, or, as some think, some kind of aromatic bark. The sweetness refers to the scent, not the taste.`<a href="./study/isbe/search.html?string=BULRUSH">BULRUSH</a>; <a href="./study/isbe/search.html?string=PAPYRUS">PAPYRUS</a>`117';
isbe[7323]='Reed, Measuring`mezh\'-ur-ing (qeneh ha-middah): In Ezekiel\'s vision of the temple a "man" (an angel) appears with a "measuring reed" to measure the dimensions of the temple (<a onClick="return mV(\'Eze\',40,3);">Eze 40:3</a>ff; <a onClick="return mV(\'Eze\',42,16);">42:16</a>). The reed is described as 6 cubits long, "of a cubit and a handbreadth each," i.e. the cubit used was a handbreadth longer than the common cubit (see <a href="./study/isbe/search.html?string=CUBIT">CUBIT</A>; <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</A>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</A>). In the Apocalypse this idea of a measuring reed reappears for measuring the temple (<a onClick="return mV(\'Rev\',11,1);">Re 11:1</a>) and the holy city (<a onClick="return mV(\'Rev\',21,15,16);">Re 21:15,16</a>, "a golden reed"). The thought conveyed is exactitude in the dimensions of these edifices, symbolic of the symmetry and perfection of God\'s church.``132';
isbe[7324]='Reed-Grass`(<a onClick="return mV(\'Gen\',41,2,18);">Ge 41:2,18</a>; <a onClick="return mV(\'Job\',8,11);">Job 8:11</a> margin).`<a href="./study/isbe/search.html?string=FLAG">FLAG</a>; <a href="./study/isbe/search.html?string=REED">REED</a>`1';
isbe[7325]='Reelaiah`re-el-a\'-ya, re-el-i\'-a (re\'elyah): One of the 12 chiefs who returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a> parallel <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>). In the passage in Nehemiah the name is Raamiah" (ra\'amyah), and in 1Esdras 5:8 "Resaias." Which is the original, it is almost impossible to decide; "Reelaiah" seems preferable.``1';
isbe[7326]='Reelias`re-el\'-i-as (Codex Alexandrinus Rheelias (Fritzschel); Codex Vaticanus followed by Swete, Boroleias; the King James Version Reelius): One of the "leaders" with Zerubbabel in the return from exile (1Esdras 5:8, margin "Reelaiah"). It occupies the place of "Bigvai" in <a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>; <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>, but in form it must be the equivalent of "Reelaiah" of Ezra and "Raamiah" of Nehemiah. It is perhaps a duplicate of "Resaias."``1';
isbe[7327]='Reesaias`re-e-sa\'-yas, re-e-si\'-as: the King James Version; the Revised Version (British and American) <a href="./study/isbe/search.html?string=RESAIAS">RESAIAS</A> (which see).``1';
isbe[7328]='Refiner; Refining`re-fin\'-er, re-fin\'-ing: Two Hebrew words have been translated "refine": (1) tsaraph, literally, to "fuse" (<a onClick="return mV(\'Zec\',13,9);">Zec 13:9</a>; <a onClick="return mV(\'Isa\',48,10);">Isa 48:10</a>; <a onClick="return mV(\'Mal\',3,2,3);">Mal 3:2,3</a>, etc.). The same word is rendered also "tried" (<a onClick="return mV(\'Psa\',66,10);">Ps 66:10</a>); "melt" (<a onClick="return mV(\'Jer\',6,29);">Jer 6:29</a> the King James Version); "purge" (<a onClick="return mV(\'Isa\',1,25);">Isa 1:25</a>). (2) zaqaq, literally, to "strain" or "sift." In the case of silver and gold the term probably referred to some washing process in connection with refining, as in <a onClick="return mV(\'Mal\',3,3);">Mal 3:3</a> both tsaraph and zaqaq are used (<a onClick="return mV(\'1Ch\',28,18);">1Ch 28:18</a>; <a onClick="return mV(\'1Ch\',29,4);">29:4</a>; <a onClick="return mV(\'Job\',28,1);">Job 28:1</a>). The same word in <a onClick="return mV(\'Isa\',25,6);">Isa 25:6</a> referred to the straining of wine. Greek puroo, in the passive, literally, "to be ignited," is translated "refined," in <a onClick="return mV(\'Rev\',1,15);">Re 1:15</a>; <a onClick="return mV(\'Rev\',3,18);">3:18</a>.<P>The ancient process of refining gold has already been described under <a href="./study/isbe/search.html?string=METALLURGY">METALLURGY</A> (which see). Most of the Bible references are to the refining of silver (<a onClick="return mV(\'Pro\',25,4);">Pr 25:4</a>; <a onClick="return mV(\'Zec\',13,9);">Zec 13:9</a>; <a onClick="return mV(\'Isa\',48,10);">Isa 48:10</a>). The silver used by the ancients was probably obtained by smelting lead sulfide ore, rich in silver (argentiferous galena). After the ore had been reduced to a metallic condition, the lead was separated from the silver by blowing hot air over the surface of the melted metal. The lead was thus changed to lead oxide which, in a powdered condition, was driven away by the air blast. The resulting lead oxide, called in the Bible silver dross, was used for glazing pottery (<a onClick="return mV(\'Pro\',26,23);">Pr 26:23</a>), a use to which it is still put by Syrian potters. The description of refining in <a onClick="return mV(\'Eze\',22,\'18-22\');">Eze 22:18-22</a> may indicate that a flux (compare "as with lye," <a onClick="return mV(\'Isa\',1,25);">Isa 1:25</a> the American Revised Version margin) was sometimes added to the melted metal to dissolve the oxides of copper, lead, tin and iron as they formed, thus leaving the silver pure. Crude processes similar to those described above are used in the Taurus Mountains today.<P>Figurative:<P>In the various Bible references the refining of precious metals is used figuratively to illustrate the kind of trial God\'s children are called upon to go through. If they are of the right metal the dross will finally be blown away, leaving pure, clear, shining silver. If of base metal they will be like the dross described in <a onClick="return mV(\'Jer\',6,29,30);">Jer 6:29,30</a>. The refiner may blow fiercely, but in vain, for nothing but lead dross appears.``133';
isbe[7329]='Reform`re-form\' (yacar): The word in the Revised Version (British and American) is found only in <a onClick="return mV(\'Lev\',26,23);">Le 26:23</a>, in the phrase "ye will not be reformed." The meaning is, "to be instructed," or, more fully, "to let one\'s self be chastened," i.e. by God\'s discipline to learn the lessons of this chastening.<P>The Hebrew word is the same in a similar connection in <a onClick="return mV(\'Jer\',6,8);">Jer 6:8</a>, where it is rendered, "Be thou instructed," and in <a onClick="return mV(\'Jer\',31,18);">Jer 31:18</a>, "I was chastised." <a onClick="return mV(\'Psa\',2,10);">Ps 2:10</a> ("instructed"); <a onClick="return mV(\'Pro\',29,19);">Pr 29:19</a> ("corrected") use the Hebrew term of admonition by the words of man.<P>The King James Version also has "reform" in 2Esdras 8:12; <span class="noTag">The Wisdom of Solomon 9:18</span>.``1';
isbe[7330]='Reformation`ref-or-ma\'-shun: The word is found only in <a onClick="return mV(\'Hbr\',9,10);">Heb 9:10</a>, being the translation of diorthosis, in its only occurrence. This Greek word means etymologically "making straight," and was used of restoring to the normally straight condition that which is crooked or bent. In this passage it means the rectification of conditions, setting things to rights, and is a description of the Messianic time.``1';
isbe[7331]='Refresh; Refreshing`re-fresh\', re-fresh\'-ing: "Refresh" occurs a few times in the Old Testament as the translation of naphash, "to take breath," figurative "to be refreshed" (<a onClick="return mV(\'Exd\',23,12);">Ex 23:12</a>; <a onClick="return mV(\'Exd\',31,17);">31:17</a>; <a onClick="return mV(\'2Sa\',16,14);">2Sa 16:14</a>); of rawach, "to have room (<a onClick="return mV(\'1Sa\',16,23);">1Sa 16:23</a>; <a onClick="return mV(\'Job\',32,20);">Job 32:20</a>, margin "find relief," the King James Version margin "may breathe"); of ca\'adh, "to support" (<a onClick="return mV(\'1Ki\',13,7);">1Ki 13:7</a>); and in the New Testament as the translation of anapauo, "to give rest" (<a onClick="return mV(\'1Cr\',16,18);">1Co 16:18</a>; <a onClick="return mV(\'2Cr\',7,13);">2Co 7:13</a>; <a onClick="return mV(\'Phm\',1,7,20);">Phm 1:7,20</a>; in compound middle, <a onClick="return mV(\'Rom\',15,32);">Ro 15:32</a> the King James Version); also of anapsucho, "to invigorate," "revive" (<a onClick="return mV(\'2Ti\',1,16);">2Ti 1:16</a>), and other words. "Refreshing" is in <a onClick="return mV(\'Isa\',28,12);">Isa 28:12</a> marge\'ah, "rest" or "quiet"; and in <a onClick="return mV(\'Act\',3,19);">Ac 3:19</a>, anapsuxis, "seasons of refreshing," through the coming of Jesus, the Christ; compare 2Esdras 11:46 and the King James Version, Sirach 43:22 hilaroo).``185';
isbe[7332]='Refuge`ref\'-uj: A place of resort and safety. The principal words in the Old Testament are machceh (<a onClick="return mV(\'Psa\',14,6);">Ps 14:6</a>; <a onClick="return mV(\'Psa\',46,1);">46:1</a>; <a onClick="return mV(\'Psa\',62,7,8);">62:7,8</a>; <a onClick="return mV(\'Isa\',4,6);">Isa 4:6</a>, etc.), and manoc (<a onClick="return mV(\'2Sa\',22,3);">2Sa 22:3</a>; <a onClick="return mV(\'Psa\',59,16);">Ps 59:16</a>, etc.), both applied chiefly to God as a "refuge" for His people. For the King James Version "refuge" in <a onClick="return mV(\'Deu\',33,27);">De 33:27</a>, the Revised Version (British and American) has "dwelling-place," and in <a onClick="return mV(\'Psa\',9,9);">Ps 9:9</a>, "high tower." Conversely, the Revised Version (British and American) has "refuge" for the King James Version "shelter" in <a onClick="return mV(\'Psa\',61,3);">Ps 61:3</a>, and "hope" in <a onClick="return mV(\'Jer\',17,17);">Jer 17:17</a>.``1';
isbe[7333]='Refuge, Cities of`\'are ha-miqlat; poleis ton phugadeuterion (compare 1Macc 10:28), and other forms):<P>1. Location:<P>Six cities, three on each side of the Jordan, were set apart and placed in the hands of the Levites, to serve as places of asylum for such as might shed blood unwittingly. On the east of the Jordan they were <A href="./study/isbe/search.html?string=BEZER">Bezer</a> in the lot of Reuben, <A href="./study/isbe/search.html?string=RAMOTH-GILEAD">Ramoth-gilead</a> in the tribe of Gad, and <A href="./study/isbe/search.html?string=GOLAN; GAULONITIS">Golan</a> in the territory of Manasseh. On the west of the Jordan they were <A href="./study/isbe/search.html?string=HEBRON+(1)">Hebron</a> in Judah, <A href="./study/isbe/search.html?string=Shechem">Shechem</a> in Mt. Ephraim, and <A href="./study/isbe/search.html?string=KEDESH">Kedesh</a> in Naphtali (<a onClick="return mV(\'Num\',35,6,14);">Nu 35:6,14</a>; <a onClick="return mV(\'Jos\',20,2,7);">Jos 20:2,7</a>ff; <a onClick="return mV(\'Jos\',21,13,21,27,32,38);">21:13,21,27,32,38</a>; Bezer is named in <a onClick="return mV(\'Jos\',21,36);">Jos 21:36</a>, but not described as a City of Refuge). An account of these cities is given in separate articles under their names. <a onClick="return mV(\'Deu\',19,2);">De 19:2</a> speaks of three cities thus to be set apart, referring apparently to the land west of the Jordan.<P>2. Purpose:<P>From time immemorial in the East, if a man were slain the duty of avenging him has lain as a sacred obligation upon his nearest relative. In districts where more primitive conditions prevail, even to this day, the distinction between intentional and unintentional killing is not too strictly observed, and men are often done to death in revenge for what was the purest accident. To prevent such a thing where possible, and to provide for a right administration of justice, these cities were instituted. Open highways were to be maintained along, which the manslayer might have an unobstructed course to the city gate.<P>3. Regulations:<P>The regulations concerning the Cities of Refuge are found in <a onClick="return mV(\'Num\',35,\'1-\');">Nu 35</a>; <a onClick="return mV(\'Deu\',19,\'1-13\');">De 19:1-13</a>; <a onClick="return mV(\'Jos\',20,\'1-\');">Jos 20</a>. Briefly, everything was to be done to facilitate the flight of the manslayer, lest the avenger of blood, i.e. the nearest of kin, should pursue him with hot heart, and, overtaking him, should smite him mortally. Upon reaching the city he was to be received by the elders and his case heard. If this was satisfactory, they gave him asylum until a regular trial could be carried out. They took him, apparently, to the city or district from which he had fled, and there, among those who knew him, witnesses were examined. If it were proved that he was not a willful slayer, that he had no grudge against the person killed, and had shown no sign of purpose to injure him, then he was declared innocent and conducted back to the city in which he had taken refuge, where he must stay until the death of the high priest. Then he was free to return home in safety. Until that event he must on no account go beyond the city boundaries. If he did, the avenger of blood might slay him without blame. On the other hand, if he were found guilty of deliberate murder, there was no more protection for him. He was handed over to the avenger of blood who, with his own hand, took the murderer\'s life. Blood-money, i.e. money paid in compensation for the murder, in settlement of the avenger\'s claim, was in no circumstances permitted; nor could the refugee be ransomed, so that he might "come again to dwell in the land" until the death of the high priest (<a onClick="return mV(\'Num\',35,32);">Nu 35:32</a>).<P>A similar right of refuge seems to have been recognized in Israel as attaching to the altar in the temple at Jerusalem (<a onClick="return mV(\'1Ki\',1,50);">1Ki 1:50</a>; <a onClick="return mV(\'1Ki\',2,28);">2:28</a>; compare <a onClick="return mV(\'Exd\',21,12);">Ex 21:12</a>f). This may be compared with the right of asylum connected with the temples of the heathen.``54';
isbe[7334]='Refuse`re-fuz\': Formerly used with the additional meaning "reject," and hence, the change from the King James Version to the Revised Version (British and American) in <a onClick="return mV(\'1Sa\',16,7);">1Sa 16:7</a>; <a onClick="return mV(\'Eze\',5,6);">Eze 5:6</a>; <a onClick="return mV(\'1Ti\',4,4);">1Ti 4:4</a>; <a onClick="return mV(\'1Pe\',2,7);">1Pe 2:7</a>, etc.``1';
isbe[7335]='Refute`re-fut\': Only in <a onClick="return mV(\'Jud\',1,22);">Jude 1:22</a>, the American Revised Version margin "And some refute while they dispute with you," where the Revised Version (British and American) in the text reads "And on some have mercy, who are in doubt."<P>The Greek text of <a onClick="return mV(\'Jud\',1,22,23);">Jude 1:22,23</a> is very uncertain, being given very differently in the various manuscripts. the Revised Version (British and American) text follows the two oldest manuscripts, Codex Sinaiticus and Codex Vaticanus. Instead of eleate, "have mercy," the reading elegchete, "refute," "convict," has the powerful support of Codex Alexandrinus, Codex Ephraemi, the best cursives, Vulgate, Memphitic, Armenian and Ethiopian versions, and is placed in the text by Lachmann, Tischendorf, and Tregelles (Westcott-Hort in list of "Suspected Readings" says: "Some primitive error probable: perhaps the first eleate an interpolation"). Compare <a onClick="return mV(\'Jud\',1,15);">Jude 1:15</a>, where the same Greek word occurs in the same sense (the King James Version "convince," the Revised Version (British and American) "convict"); compare also <a onClick="return mV(\'1Ti\',5,20);">1Ti 5:20</a>; <a onClick="return mV(\'Tts\',1,9);">Tit 1:9</a>, where the same idea of refuting the sinful occurs.``49';
isbe[7336]='Regem`re\'-gem (reghem, "friend" (?)): A Calebite, the son of Jahdai (<a onClick="return mV(\'1Ch\',2,47);">1Ch 2:47</a>), mentioned as the eponym of a Calebite family or clan.``1';
isbe[7337]='Regem-Melech`re\'-gem-me\'-lek, re\'-gem-mel\'-ek (reghem melekh): One of a deputation sent to inquire concerning the propriety of continuing the commemoration of the destruction of the temple by holding a fast (<a onClick="return mV(\'Zec\',7,2);">Zec 7:2</a>). The text of the passage is in disorder. The name may mean "friend of the king"; hence, some have sought to remove the difficulty by interpreting reghem melekh as a title, not a personal name, reading the clause, "They of Beth-el had sent <a href="./study/isbe/search.html?string=SHAREZER">SHAREZER</A> (q.v. (2)), the friend of the king."``1';
isbe[7338]='Regeneration`re-jen-er-a\'-shun, re-:<P><B>I. THE TERM EXPLAINED</B><P class="in15">1. First Biblical Sense (Eschatological)<P class="in15">2. Second Biblical Sense (Spiritual)<P><B>II. THE BIBLICAL DOCTRINE OF REGENERATION</B><P class="in15">1. In the Old Testament<P class="in15">2. In the Teaching of Jesus<P class="in15">3. In Apostolic Teaching<P><B>III. LATER DEVELOPMENT OF THE DOCTRINE</b><P><B>IV. PRESENT SIGNIFICANCE</B><P><B>LITERATURE</b><HR /><P>I. The Term Explained.<P>The theological term "regeneration" is the Latin translation of the Greek expression palingenesia, occurring twice in the New Testament (<a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a>; <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>). The word is usually written paliggenesia, in classical Greek. Its meaning is different in the two passages, though an easy transition of thought is evident.<P>1. First Biblical Sense (Eschatological):<P>In <a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a> the word refers to the restoration of the world, in which sense it is synonymical to the expressions apokatastasis panton, "restoration of all things" (<a onClick="return mV(\'Act\',3,21);">Ac 3:21</a>; the verb is found in <a onClick="return mV(\'Mat\',17,11);">Mt 17:11</a>, apokatastsei panta, "shall restore all things"), and anapsuxis, "refreshing" (<a onClick="return mV(\'Act\',3,19);">Ac 3:19</a>), which signifies a gradual transition of meaning to the second sense of the word under consideration. It is supposed that regeneration in this sense denotes the final stage of development of all creation, by which God\'s purposes regarding the same are fully realized, when "all things (are put) in subjection under his feet" (<a onClick="return mV(\'1Cr\',15,27);">1Co 15:27</a>). This is a "regeneration in the proper meaning of the word, for it signifies a renovation of all visible things when the old is passed away, and heaven and earth are become new" (compare <a onClick="return mV(\'Rev\',21,1);">Re 21:1</a>). To the Jew the regeneration thus prophesied was inseparably connected with the reign of the Messiah.<P>We find this word in the same or very similar senses in profane literature. It is used of the renewal of the world in Stoical philosophy. Josephus (Ant., XI, iii, 9) speaks of the anaktesis kai paliggenesia tes patridos, "a new foundation and regeneration of the fatherland," after the return from the Babylonian captivity. Philo (ed. Mangey, ii.144) uses the word, speaking of the post-diluvial epoch of the earth, as of a new world, and Marcus Aurelius Antoninus (xi.1), of a periodical restoration of all things, laying stress upon the constant recurrence and uniformity of all happenings, which thought the Preacher expressed by "There is no new thing under the sun" (<a onClick="return mV(\'Ecc\',1,9);">Ec 1:9</a>). In most places, however, where the word occurs in philosophical writings, it is used of the "reincarnation" or "subsequent birth" of the individual, as in the Buddhistic and Pythagorean doctrine of the transmigration of souls (Plut., edition Xylander, ii.998c; Clement of Alexandria, edition Potter, 539) or else of a revival of life (Philo i.159). Cicero uses the word in his letters to Atticus (vi.6) metaphorically of his return from exile, as a new lease of life granted to him.<P>See <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT, IX</A>.<P>2. Second Biblical Sense (Spiritual):<P>This sense is undoubtedly included in the full Biblical conception of the former meaning, for it is unthinkable that a regeneration in the eschatological sense can exist without a spiritual regeneration of humanity or the individual. It is, however, quite evident that this latter conception has arisen rather late, from an analysis of the former meaning. It is found in <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a> which, without absolute certainty as to its meaning, is generally interpreted in agreement with the numerous nouns and verbs which have given the dogmatical setting to the doctrine of regeneration in Christian theology. Clement of Alexandria is the first to differentiate this meaning from the former by the addition of the adjective pneumatike, "spiritual" (compare anapsuxis, <a onClick="return mV(\'Act\',3,20);">Ac 3:20</a>; see <a href="./study/isbe/search.html?string=REFRESHING">REFRESHING</a>). In this latter sense the word is typically Christian, though the Old Testament contains many adumbrations of the spiritual process expressed thereby.<P>II. The Biblical Doctrine of Regeneration.<P>1. In the Old Testament:<P>It is well known that in the earlier portions of the Old Testament, and to a certain degree all through the Old Testament, religion is looked at and spoken of more as a national possession, the benefits of which are largely visible and tangible blessings. The idea of regeneration here occurs therefore—though no technical expression has as yet been coined for the process—in the first meaning of the word elucidated above. Whether the divine promises refer to the Messianic end of times, or are to be realized at an earlier date, they all refer to the nation of Israel as such, and to individuals only as far as they are partakers in the benefits bestowed upon the commonwealth. This is even true where the blessings prophesied are only spiritual, as in <a onClick="return mV(\'Isa\',60,21,22);">Isa 60:21,22</a>. The mass of the people of Israel are therefore as yet scarcely aware of the fact that the conditions on which these divine promises are to be attained are more than ceremonial and ritual ones. Soon, however, great disasters, threatening to overthrow the national entity, and finally the captivity and dispersion which caused national functions to be almost, if not altogether, discontinued, assisted in the growth of a sense of individual or personal responsibility before God. The sin of Israel is recognized as the sin of the individual, which can be removed only by individual repentance and cleansing. This is best seen from the stirring appeals of the prophets of the exile, where frequently the necessity of a change of attitude toward Yahweh is preached as a means to such regeneration. This cannot be understood otherwise than as a turning of the individual to the Lord. Here, too, no ceremony or sacrifice is sufficient, but an interposition of divine grace, which is represented under the figure of a washing and sprinkling from all iniquity and sin (<a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>; <a onClick="return mV(\'Jer\',13,23);">Jer 13:23</a>). It is not possible now to follow in full the development of this idea of cleansing, but already in <a onClick="return mV(\'Isa\',52,15);">Isa 52:15</a> the sprinkling of many nations is mentioned and is soon understood in the sense of the "baptism" which proselytes had to undergo before their reception into the covenant of Israel. It was the symbol of a radical cleansing like that of a "new-born babe," which was one of the designations of the proselyte (compare <a onClick="return mV(\'Psa\',87,5);">Ps 87:5</a>; see also the tractate Yebhamoth 62a). Would it be surprising that Israel, which had been guilty of many sins of the Gentiles, needed a similar baptism and sprinkling? This is what <a onClick="return mV(\'Eze\',36,25);">Eze 36:25</a> suggests: "I will sprinkle clean water upon you, and ye shall be clean: from all your filthiness, and from all your idols, will I cleanse you." In other passages the cleansing and refining power of fire is alluded to (e.g. <a onClick="return mV(\'Mal\',3,2);">Mal 3:2</a>), and there is no doubt that John the Baptist found in such passages the ground for his practice of baptizing the Jews who came to him (<a onClick="return mV(\'Jhn\',1,\'25-28\');">Joh 1:25-28</a> and parallel\'s).<P>The turning of Israel to God was necessarily meant to be an inward change of attitude toward Him, in other words, the sprinkling with clean water, as an outward sign, was the emblem of a pure heart. It was Isaiah and Jeremiah who drew attention to this (<a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>; <a onClick="return mV(\'Jer\',24,7);">Jer 24:7</a>; <a onClick="return mV(\'Jer\',31,\'33-35\');">31:33-35</a>; <a onClick="return mV(\'Jer\',32,\'38-40\');">32:38-40</a>, et passim). Here again reference is made to individuals, not only to the people in general (<a onClick="return mV(\'Jer\',31,34);">Jer 31:34</a>). This promised regeneration, so lovingly offered by Yahweh, is to be the token of a new covenant between God and His people (<a onClick="return mV(\'Jer\',31,31);">Jer 31:31</a>; <a onClick="return mV(\'Eze\',11,\'19-21\');">Eze 11:19-21</a>; <a onClick="return mV(\'Eze\',18,31,32);">18:31,32</a>; <a onClick="return mV(\'Eze\',37,23,24);">37:23,24</a>).<P>The renewing and cleansing here spoken of is in reality nothing else than what <a onClick="return mV(\'Deu\',30,6);">De 30:6</a> had promised, a circumcision of the heart in contradistinction to the flesh, the token of the former (Abrahamic) covenant (of circumcision, <a onClick="return mV(\'Jer\',4,4);">Jer 4:4</a>). As God takes the initiative in making the covenant, the conviction takes root that human sin and depravity can be effectually eliminated only by the act of God Himself renewing and transforming the heart of man (<a onClick="return mV(\'Hsa\',14,4);">Ho 14:4</a>). This we see from the testimony of some of Israel\'s best sons and daughters, who also knew that this grace was found in the way of repentance and humiliation before God. The classical expression of this conviction is found in the prayer of David: "Create in me a clean heart, O God; and renew a right (margin "stedfast") spirit within me. Cast me not away from thy presence; and take not thy holy Spirit from me. Restore unto me the joy of thy salvation; and uphold me with a willing spirit" (<a onClick="return mV(\'Psa\',51,\'10-12\');">Ps 51:10-12</a>). Jeremiah puts the following words into the mouth of Ephraim: "Turn thou me, and I shall be turned" (<a onClick="return mV(\'Jer\',31,18);">Jer 31:18</a>). Clearer than any passages of the Old Testament, John the Baptist, forerunner of Christ and last flaming torch of the time of the earlier covenant, spoke of the baptism, not of water, but of the Holy Spirit and of fire (<a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>; <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>; <a onClick="return mV(\'Jhn\',1,33);">Joh 1:33</a>), leading thus to the realization of Old Testament foreshadowings which became possible by faith in Christ.<P>2. In the Teaching of Jesus:<P>In the teaching of Jesus the need of regeneration has a prominent place, though nowhere are the reasons given. The Old Testament had succeeded—and even the Gentile conscience agreed with it—in convincing the people of this need. The clearest assertion of it and the explanation of the doctrine of regeneration is found in the conversation of Jesus with Nicodemus (<a onClick="return mV(\'Jhn\',3,\'1-\');">Joh 3</a>). It is based upon<P>(1) the observation that man, even the most punctilious in the observance of the Law, is dead and therefore unable to "live up" to the demands of God. Only He who gave life at the beginning can give the (spiritual) life necessary to do God\'s will.<P>(2) Man has fallen from his virginal and divinely-appointed sphere, the realm of the spirit, the Kingdom of God, living now the perishing earthly life. Only by having a new spiritual nature imparted to him, by being "born anew" (<a onClick="return mV(\'Jhn\',3,3);">Joh 3:3</a>, the Revised Version margin "from above," Greek anothen), by being "born of the Spirit" (<a onClick="return mV(\'Jhn\',3,6,8);">Joh 3:6,8</a>), can he live the spiritual life which God requires of man.<P>These words are a New Testament exegesis of Ezekiel\'s vision of the dead bones (<a onClick="return mV(\'Eze\',37,\'1-10\');">Eze 37:1-10</a>). It is the "breath from Yahweh," the Spirit of God, who alone can give life to the spiritually dead.<P>But regeneration, according to Jesus, is more than life, it is also purity. As God is pure and sinless, none but the pure in heart can see God (<a onClick="return mV(\'Mat\',5,8);">Mt 5:8</a>). This was always recognized as impossible to mere human endeavor. Bildad the Shuhite declared, and his friends, each in his turn, expressed very similar thoughts (<a onClick="return mV(\'Job\',4,17);">Job 4:17</a>; <a onClick="return mV(\'Job\',14,4);">14:4</a>): "How then can man be just with God? Or how can he be clean that is born of a woman? Behold, even the moon hath no brightness, and the stars are not pure in his sight: how much less man, that is a worm! and the son of man, that is a worm!" (<a onClick="return mV(\'Job\',25,\'4-6\');">Job 25:4-6</a>).<P>To change this lost condition, to impart this new life, Jesus claims as His God-appointed task: "The Son of man came to seek and to save that which was lost" (<a onClick="return mV(\'Luk\',19,10);">Lu 19:10</a>); "I came that they may have life, and may have it abundantly" (<a onClick="return mV(\'Jhn\',10,10);">Joh 10:10</a>). This life is eternal, imperishable: "I give unto them eternal life; and they shall never perish, and no one shall snatch them out of my hand" (<a onClick="return mV(\'Jhn\',10,28);">Joh 10:28</a>). This life is imparted by Jesus Himself: "It is the spirit that giveth life; the flesh profiteth nothing: the words that I have spoken unto you are spirit, and are life" (<a onClick="return mV(\'Jhn\',6,63);">Joh 6:63</a>). This life can be received on the condition of faith in Christ or by coming to Him (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>). By faith power is received which enables the sinner to overcome sin, to "sin no more" (<a onClick="return mV(\'Jhn\',8,11);">Joh 8:11</a>).<P>The parables of Jesus further illustrate this doctrine. The prodigal is declared to have been "dead" and to be "alive again" (<a onClick="return mV(\'Luk\',15,24);">Lu 15:24</a>). The new life from God is compared to a wedding garment in the parable of the Marriage of the King\'s Son (<a onClick="return mV(\'Mat\',22,11);">Mt 22:11</a>). The garment, the gift of the inviting king, had been refused by the unhappy guest, who, in consequence, was \'cast out into the outer darkness\' (<a onClick="return mV(\'Mat\',22,13);">Mt 22:13</a>).<P>Finally, this regeneration, this new life, is explained as the knowledge of God and His Christ: "And this is life eternal, that they should know thee the only true God, and him whom thou didst send, even Jesus Christ" (<a onClick="return mV(\'Jhn\',17,3);">Joh 17:3</a>). This seems to be an allusion to the passage in Hosea (<a onClick="return mV(\'Hsa\',4,6);">4:6</A>): "My people are destroyed for lack of knowledge: because thou hast rejected knowledge, I will also reject thee, that thou shalt be no priest to me."<P>3. In Apostolic Teaching:<P>It may be said in general that the teaching of the apostles on the subject of regeneration is a development of the teaching of Jesus on the lines of the adumbrations of the Old Testament. Considering the differences in the personal character of these writers, it is remarkable that such concord of views should exist among them. Paul, indeed, lays more stress on the specific facts of justification and sanctification by faith than on the more comprehensive head of regeneration. Still the need of it is plainly stated by Paul. It is necessary to salvation for all men. "The body is dead because of sin" (<a onClick="return mV(\'Rom\',8,\'3-11\');">Ro 8:3-11</a>; <a onClick="return mV(\'Eph\',2,1);">Eph 2:1</a>). The flesh is at enmity with God (<a onClick="return mV(\'Eph\',2,15);">Eph 2:15</a>); all mankind is "darkened in their understanding, alienated from the life of God" (<a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>). Similar passages might be multiplied. Paul then distinctly teaches that thus is a new life in store for those who have been spiritually dead. To the Ephesians he writes: "And you did he make alive, when ye were dead through your trespasses and sins" (<a onClick="return mV(\'Eph\',2,1);">2:1</A>), and later on: "God, being rich in mercy,...made us alive together with Christ" (<a onClick="return mV(\'Eph\',2,4,5);">2:4,5</a>). A spiritual resurrection has taken place. This regeneration causes a complete revolution in man. He has thereby passed from under the law of sin and death and has come under "the law of the Spirit of life in Christ Jesus" (<a onClick="return mV(\'Rom\',8,2);">Ro 8:2</a>). The change is so radical that it is possible now to speak of a "new creature" (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>; <a onClick="return mV(\'Gal\',6,15);">Ga 6:15</a>, margin "new creation"), of a "new man, that after God hath been created in righteousness and holiness of truth" (<a onClick="return mV(\'Eph\',4,24);">Eph 4:24</a>), and of "the new man, that is being renewed unto knowledge after the image of him that created him" (<a onClick="return mV(\'Col\',3,10);">Col 3:10</a>). All "old things are passed away; behold, they are become new" (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>).<P>Paul is equally explicit regarding the author of this change. The "Spirit of God," the "Spirit of Christ" has been given from above to be the source of all new life (<a onClick="return mV(\'Rom\',8,\'1-\');">Ro 8</a>); by Him we are proved to be the "sons" of God (<a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>); we have been adopted into the family of God (huiothesia, <a onClick="return mV(\'Rom\',8,15);">Ro 8:15</a>; <a onClick="return mV(\'Gal\',4,5);">Ga 4:5</a>). Thus Paul speaks of the "second Adam," by whom the life of righteousness is initiated in us; just as the "first Adam" became the leader in transgression, He is "a life-giving spirit" (<a onClick="return mV(\'1Cr\',15,45);">1Co 15:45</a>). Paul himself experienced this change, and henceforth exhibited the powers of the unseen world in his life of service. "It is no longer I that live," he exclaims, "but Christ liveth in me: and that life which I now live in the flesh I live in faith, the faith which is in the Son of God, who loved me, and gave himself up for me" (<a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>).<P>Regeneration is to Paul, no less than to Jesus, connected with the conception of purity and knowledge. We have already noted the second New Testament passage in which the word "regeneration" occurs (<a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>): "According to his mercy he saved us, through the washing (margin "laver") of regeneration and renewing of the Holy Spirit, which he poured out upon us richly, through Jesus Christ our Saviour." In <a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a> such cleansing is called the baptism of the Spirit in agreement with the oft-repeated promise (<a onClick="return mV(\'Joe\',2,28);">Joe 2:28 (in the Hebrew text 3:1)</a>; <a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>; <a onClick="return mV(\'Mar\',1,8);">Mr 1:8</a>; <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>; <a onClick="return mV(\'Act\',1,5);">Ac 1:5</a>; <a onClick="return mV(\'Act\',11,16);">11:16</a>). There is, of course, in these passages no reference to mere water baptism, any more than in <a onClick="return mV(\'Eze\',36,25);">Eze 36:25</a>. Water is but the tertium comparationis. As water cleanseth the outer body, so the spirit purifies the inner man (compare <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a>; <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>).<P>The doctrine that regeneration redounds in true knowledge of Christ is seen from <a onClick="return mV(\'Eph\',3,\'15-19\');">Eph 3:15-19</a> and <a onClick="return mV(\'Eph\',4,\'17-24\');">4:17-24</a>, where the darkened understanding and ignorance of natural man are placed in contradistinction to the enlightenment of the new life (see also <a onClick="return mV(\'Col\',3,10);">Col 3:10</a>). The church redeemed and regenerated is to be a special "possession," an "heritage" of the Lord (<a onClick="return mV(\'Eph\',1,11,14);">Eph 1:11,14</a>), and the whole creation is to participate in the final redemption and adoption (<a onClick="return mV(\'Rom\',8,\'21-23\');">Ro 8:21-23</a>).<P>James finds less occasion to touch this subject than the other writers of the New Testament. His Epistle is rather ethical than dogmatical in tone, still his ethics are based on the dogmatical presuppositions which fully agree with the teaching of other apostles. Faith to him is the human response to God\'s desire to impart His nature to mankind, and therefore the indispensable means to be employed in securing the full benefits of the new life, i.e. the sin-conquering power (<a onClick="return mV(\'Jam\',1,2,3,4);">1:2-4</A>), the spiritual enlightenment (<a onClick="return mV(\'Jam\',1,5);">1:5</A>) and purity (<a onClick="return mV(\'Jam\',1,27);">1:27</A>). There seems, however, to be little doubt that James directly refers to regeneration in the words: "Of his own will he brought us forth by the word of truth, that we should be a kind of firstfruits of his creatures" (<a onClick="return mV(\'Jam\',1,18);">1:18</A>). It is supposed by some that these words, being addressed "to the twelve tribes which are of the Dispersion" (<a onClick="return mV(\'Jam\',1,1);">1:1</a>), do not refer to individual regeneration, but to an election of Israel as a nation and so to a Christian Israel. In this case the aftermath would be the redemption of the Gentiles. I understand the expression "first-fruits" in the sense in which we have noticed Paul\'s final hope in <a onClick="return mV(\'Rom\',8,\'21-32\');">Ro 8:21-32</a>, where the regeneration of the believing people of God (regardless of nationality) is the first stage in the regeneration or restoration of all creation. The "implanted (the Revised Version margin "inborn") word" (<a onClick="return mV(\'Jam\',1,21);">Jas 1:21</a>; compare <a onClick="return mV(\'1Pe\',1,23);">1Pe 1:23</a>) stands parallel to the Pauline expression, "law of the Spirit" (<a onClick="return mV(\'Rom\',8,2);">Ro 8:2</a>).<P>Peter uses, in his sermon on the day of Pentecost, the words "refreshing" (<a onClick="return mV(\'Act\',3,19);">Ac 3:19</a>) and "restoration of all things" (<a onClick="return mV(\'Act\',3,21);">Ac 3:21</a>) of the final completion of God\'s plans concerning the whole creation, and accordingly looks here at God\'s people as a whole. In a similar sense he says in his Second Epistle, after mentioning "the day of God": "We look for new heavens and a new earth, wherein dwelleth righteousness" (<a onClick="return mV(\'2Pe\',3,13);">2Pe 3:13</a>). Still he alludes very plainly to the regeneration of individuals (<a onClick="return mV(\'1Pe\',1,3,13);">1Pe 1:3,13</a>). The idea of a second birth of the believers is clearly suggested in the expression, "newborn babes" (<a onClick="return mV(\'1Pe\',2,2);">1Pe 2:2</a>), and in the explicit statement of <a onClick="return mV(\'1Pe\',1,23);">1Pe 1:23</a>: "having been begotten again, not of corruptible seed, but of incorruptible, through the word of God, which liveth and abideth." It is in this sense that the apostle calls God "Father" (<a onClick="return mV(\'1Pe\',1,17);">1Pe 1:17</a>) and the believers "children of obedience" (<a onClick="return mV(\'1Pe\',1,14);">1Pe 1:14</a>), i.e. obedient children, or children who ought to obey. We have seen above that the agent by which regeneration is wrought, the incorruptible seed of the word of God, finds a parallel in Paul\'s and James\'s theology. All these expressions go back probably to a word of the Master in <a onClick="return mV(\'Jhn\',15,3);">Joh 15:3</a>. We are made partakers of the word by having received the spirit. This spirit (compare the Pauline "lifegiving spirit," <a onClick="return mV(\'1Cr\',15,45);">1Co 15:45</a>), the "mind" of Christ (<a onClick="return mV(\'1Pe\',4,1);">1Pe 4:1</a>), is the power of the resurrected Christ active in the life of the believer. Peter refers to the same thought in <a onClick="return mV(\'1Pe\',3,15,21);">1Pe 3:15,21</a>. By regeneration we become "an elect race, a royal priesthood, a holy nation, a people for God\'s own possession" in whom divine virtues, "the excellencies of him who called you" (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>), are manifested. Here the apostle uses well-known Old Testament expressions foreshadowing New Testament graces (<a onClick="return mV(\'Isa\',61,6);">Isa 61:6</a>; <a onClick="return mV(\'Isa\',66,21);">66:21</a>; <a onClick="return mV(\'Exd\',19,6);">Ex 19:6</a>; <a onClick="return mV(\'Deu\',7,6);">De 7:6</a>), but he individualizes the process of regeneration in full agreement with the increased light which the teaching of Jesus has brought. The theology of Peter also points out the contact of regeneration with purity and holiness (<a onClick="return mV(\'1Pe\',1,15,16);">1Pe 1:15,16</a>) and true knowledge (<a onClick="return mV(\'1Pe\',1,14);">1Pe 1:14</a>) or obedience (<a onClick="return mV(\'1Pe\',1,14);">1Pe 1:14</a>; <a onClick="return mV(\'1Pe\',3,16);">3:16</a>). It is not surprising that the idea of purity should invite the Old Testament parallel of "cleansing by water." The flood washed away the iniquity of the world "in the days of Noah," when "eight souls were saved through water: which also after a true likeness (the Revised Version margin "in the antitype") doth now save you, even baptism, not the putting away of the filth of the flesh, but the interrogation (the Revised Version margin "inquiry," "appeal") of a good conscience toward God, through the resurrection (-life) of Jesus Christ" (<a onClick="return mV(\'1Pe\',3,20,21);">1Pe 3:20,21</a>).<P>The teaching of John is very closely allied with that of Jesus, as we have already seen from the multitude of quotations we had to select from John\'s Gospel to illustrate the teaching of the Master. It is especially interesting to note the cases where the apostle didactically elucidates certain of these pronouncements of Jesus. The most remarkable apostolic gloss or commentary on the subject is found in <a onClick="return mV(\'Jhn\',7,39);">Joh 7:39</a>. Jesus had spoken of the change which faith in Him ("coming to him") would cause in the lives of His disciples; how divine energies like "rivers of water" should issue forth from them; and the evangelist continues in explanation: "But this spake he of the Spirit, which they that believed on him were to receive: for the Spirit was not yet given; because Jesus was not yet glorified." This recognition of a special manifestation of divine power, transcending the experience of Old Testament believers, was based on the declaration of Christ, that He would send "another Comforter (the Revised Version (British and American) "advocate," "helper," Greek Parakletos), that he may be with you for ever, even the Spirit of truth" (<a onClick="return mV(\'Jhn\',14,16,17);">Joh 14:16,17</a>).<P>In his Epistles, John shows that this Spirit bestows the elements of a Godlike character which makes us to be "sons of God," who before were "children of the devil" (<a onClick="return mV(\'1Jo\',3,10,24);">1Joh 3:10,24</a>; <a onClick="return mV(\'1Jo\',4,13);">4:13</a>, etc.). This regeneration is "eternal life" (<a onClick="return mV(\'1Jo\',5,13);">1Joh 5:13</a>) and moral similarity with God, the very character of God in man. As "God is love," the children of God will love (<a onClick="return mV(\'1Jo\',5,2);">1Joh 5:2</a>). At the same time it is the life of God in man, also called fellowship with Christ, victorious life which overcomes the world (<a onClick="return mV(\'1Jo\',5,4);">1Joh 5:4</a>); it is purity (<a onClick="return mV(\'1Jo\',3,\'3-6\');">1Joh 3:3-6</a>) and knowledge (<a onClick="return mV(\'1Jo\',2,20);">1Joh 2:20</a>).<P>The subject of regeneration lies outside of the scope of the Epistle to the Hebrews, so that we look in vain for a clear dogmatical statement of it. Still the epistle does in no place contradict the dogma, which, on the other hand, underlies many of the statements made. Christ, "the mediator of a better covenant, which hath been enacted upon better promises" (<a onClick="return mV(\'Hbr\',8,6);">8:6</A>), has made "purification of sins" (<a onClick="return mV(\'Hbr\',1,3);">1:3</A>). In contradistinction to the first covenant, in which the people approached God by means of outward forms and ordinances, the "new covenant" (<a onClick="return mV(\'Hbr\',8,13);">8:13</A>) brought an "eternal redemption" (<a onClick="return mV(\'Hbr\',9,12);">9:12</A>) by means of a divine cleansing (<a onClick="return mV(\'Hbr\',9,14);">9:14</A>). Christ brings "many sons unto glory" and is "author of their salvation" (<a onClick="return mV(\'Hbr\',2,10);">2:10</A>). Immature Christians are spoken of (as were the proselytes of the Old Testament) as babies, who were to grow to the stature, character and knowledge of "full-grown men" (<a onClick="return mV(\'Hbr\',5,13,14);">5:13,14</A>).<P>III. Later Development of the Doctrine.<P>Very soon the high spiritual meaning of regeneration was obscured by the development of priestcraft within the Christian church. When the initiation into the church was thought of as accomplished by the mediation of ministers thereto appointed, the ceremonies hereby employed became means to which magic powers were of necessity ascribed. This we see plainly in the view of baptismal regeneration, which, based upon half-understood passages of Scripture quoted above, was taught at an early date. While in the post-apostolic days we frequently find traces of a proper appreciation of an underlying spiritual value in baptism (compare Didache vii) many of the expressions used are highly misleading. Thus Gregory Nazianzen (Orations, xi.2) calls baptism the second of the three births a child of God must experience (the first is the natural birth, the third the resurrection). This birth is "of the day, free, delivering from passions, taking away every veil of our nature or birth, i.e. everything hiding the divine image in which we are created, and leading up to the life above" (Ullmann, Gregor v. Nazienz, 323). Cyril of Jerusalem (Cat., xvii, c. 37) ascribes to baptism the power of absolution from sin and the power of endowment with heavenly virtues. According to Augustine baptism is essential to salvation, though the baptism of blood (martyrdom) may take the place of water baptism, as in the case of the thief at the cross (Augustine, De Anima et Eius Origine, i.11, c. 9; ii.14, c. 10; ii.16, c. 12). Leo the Great compares the spirit-filled water of baptism with the spirit-filled womb of the Virgin Mary, in which the Holy Spirit engenders a sinless child of God (Serm. xxiv.3; xxv.5; see Hagenbach, Dogmengeschichte, section 137).<P>In general this is still the opinion of pronounced sacrmentarians, while evangelical Christianity has gone back to the teaching of the New Testament.<P>IV. Present Significance.<P>Although a clear distinction is not always maintained between regeneration and other experiences of the spiritual life, we may summarize our belief in the following theses:<P>(1) Regeneration implies not merely an addition of certain gifts or graces, a strengthening of certain innate good qualities, but a radical change, which revolutionizes our whole being, contradicts and overcomes our old fallen nature, and places our spiritual center of gravity wholly outside of our own powers in the realm of God\'s causation.<P>(2) It is the will of God that all men be made partakers of this new life (<a onClick="return mV(\'1Ti\',2,4);">1Ti 2:4</a>) and, as it is clearly stated that some fall short of it (<a onClick="return mV(\'Jhn\',5,40);">Joh 5:40</a>), it is plain that the fault thereof lies with man. God requires all men to repent and turn unto Him (<a onClick="return mV(\'Act\',17,30);">Ac 17:30</a>) before He will or can effect regeneration. Conversion, consisting in repentance and faith in Christ, is therefore the human response to the offer of salvation which God makes. This response gives occasion to and is synchronous with the divine act of renewal (regeneration). The Spirit of God enters into union with the believing, accepting spirit of man. This is fellowship with Christ (<a onClick="return mV(\'Rom\',8,10);">Ro 8:10</a>; <a onClick="return mV(\'1Cr\',6,17);">1Co 6:17</a>; <a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>; <a onClick="return mV(\'Col\',3,3);">Col 3:3</a>).<P>(3) The process of regeneration is outside of our observation and beyond the scope of psychological analysis. It takes place in the sphere of subconsciousness. Recent psychological investigations have thrown a flood of light on the psychic states which precede, accompany and follow the work of the Holy Spirit. "He handles psychical powers; He works upon psychical energies and states; and this work of regeneration lies somewhere within the psychical field." The study of religious psychology is of highest value and greatest importance. The facts of Christian experience cannot be changed, nor do they lose in value by the most searching psychological scrutiny.<P>Psychological analysis does not eliminate the direct workings of the Holy Spirit. Nor can it disclose its process; the "underlying laboratory where are wrought radical remedial processes and structural changes in the psychical being as portrayed in explicit scriptural utterances: \'Create in me a clean heart\' (<a onClick="return mV(\'Psa\',51,10);">Ps 51:10</a>); \'Ye must be born again\' (<a onClick="return mV(\'Jhn\',3,7);">Joh 3:7</a> the King James Version); \'If any man be in Christ, he is a new creature: old things are passed away; behold all things are become new\' (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a> the King James Version), is in the region of subconsciousness. To look in the region of consciousness for this Person or for His work is fruitless and an effort fraught with endless confusion. Christian psychology thus traces to its deep-lying retreat the divine elaboration of the regenerated life. Here God works in the depths of the soul as silently and securely as if on the remotest world of the stellar universe" (H. E. Warner, Psychology of the Christian Life, 117).<P>(4) Regeneration manifests itself in the conscious soul by its effects on the will, the intelligence and the affections. At the same time regeneration supplies a new life-power of divine origin, which enables the component parts of human nature to fulfill the law of God, to strive for the coming of God\'s kingdom, and to accept the teachings of God\'s spirit. Thus regenerate man is made conscious of the facts of justification and adoption. The former is a judicial act of God, which frees man from the law of sin and absolves him from the state of enmity against God; the latter an enduement with the Spirit, which is an earnest of his inheritance (<a onClick="return mV(\'Eph\',1,14);">Eph 1:14</a>). The Spirit of God, dwelling in man, witnesses to the state of sonship (<a onClick="return mV(\'Rom\',8,2,15,16);">Ro 8:2,15,16</a>; <a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>).<P>(5) Regeneration, being a new birth, is the starting-point of spiritual growth. The regenerated man needs nurture and training. He receives it not merely from outside experiences, but from an immanent power in himself, which is recognized as the power of the life of the indwelling Christ (<a onClick="return mV(\'Col\',1,26,27);">Col 1:26,27</a>). Apart from the mediate dealings of God with man through word and sacraments, there is therefore an immediate communication of life from God to the regenerate.<P>(6) The truth which is mentioned as the agent by whom regeneration is made possible (<a onClick="return mV(\'Jhn\',8,32);">Joh 8:32</a>; <a onClick="return mV(\'Jam\',1,18);">Jas 1:18</a>; <a onClick="return mV(\'1Pe\',1,23);">1Pe 1:23</a>), is nothing else than the Divine Spirit, not only the spoken or written word of God, which may convince people of right or wrong, but which cannot enable the will of man to forsake the wrong and to do the right, but He who calls Himself the Truth (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>) and who has become the motive power of regenerated life (<a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>).<P>(7) Recent philosophy expressive of the reaction from the mechanical view of bare materialism, and also from the depreciation of personality as seen in socialism, has again brought into prominence the reality and need of personal life. Johannes Muller and Rudolf Eucken among others emphasize that a new life of the spirit, independent of outward conditions, is not only possible, but necessary for the attainment of the highest development. This new life is not a fruit of the free play of the tendencies and powers of natural life, but is in sharp conflict with them. Man as he is by nature stands in direct contrast to the demands of the spiritual life. Spiritual life, as Professor Eucken says, can be implanted in man by some superior power only and must constantly be sustained by superior life. It breaks through the order of causes and effects; it severs the continuity of the outer world; it makes impossible a rational joining together of realities; it prohibits a monastic view of the immediate condition of the world. This new life derives its power not from mere Nature; it is a manifestation of divine life within us (Hauptprobleme der Religionsphilosophie, Leipzig,1912,17ff; Der Kampf um einen geistigen Lebensinhalt, Leipzig, 1907; Grundlinien einer neuen Lebensanschauung, Leipzig, 1907; Johannes Muller, Bausteine fur personliche Kultur, 3 volumes, Munchen, 1908). Thus the latest development of idealistic philosophy corroborates in a remarkable way the Christian truth of regeneration.<P>LITERATURE<P>New Testament Theologies by Weiss, Beyschlag, Holtzmann, Schlatter, Feine, Stevens, Sheldon, Weinel. Textbooks on Systematic Theology: articles "Bekehrung" by R. Seeberg; "Wiedergeburt" by O. Kirn in Hauck-Herzog RE3; "Regeneration" by J. V. Bartlett in HDB; "Conversion" by J. Strachan in ERE; George Jackson, The Fact of Conversion, London, 1908; Newton H. Marshall, Conversion; or, the New Birth, London, 1909; J. Herzog, Der Begriff der Bekehrung, Giessen, 1903; P. Feine, Bekehrung im New Testament und in der Gegenwart, Leipzig, 1908; P. Gennrich, Die Lehre yon der Wiedergeburt, Leipzig, 1907. Psychological: W. James, Varieties of Religious Experience, 189-258; G. Stanley Hall, Adolescence, II, 281-362; G. A. Coe, The Spiritual Life, New York, 1900; E. D. Starbuck, Psychology of Religion, New York, 1911; G. B. Cutten, Psychological Phenomena of Christianity, London, 1909; H. E. Warner, The Psychology of the Christian Life, New York, 1910; H. W. Clark, The Philosophy of Christian Experience, London, 1906; Harold Begbie, Broken Earthenware, or Twice-Born Men, London, 1909; M. Scott Fletcher, The Psychology of the New Testament, London, 1912.`<a href="./study/isbe/search.html?string=CONVERSION">CONVERSION</a>`129';

isbe[7340]='Region`re\'-jun: A "district," as in modern English. The word "region" is used by English Versions of the Bible interchangeably with "country," "coasts," etc., for various Hebrew and Greek terms, but "region round about" is usually in the King James Version and invariably in the Revised Version (British and American) the translation of perichoros, "surrounding country." For a possible technical use of "region" in <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a> and the Revised Version (British and American) <a onClick="return mV(\'Act\',18,23);">18:23</A>.`<a href="./study/isbe/search.html?string=GALATIA">GALATIA</a>`1';
