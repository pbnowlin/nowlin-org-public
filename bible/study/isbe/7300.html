isbe[7371]='Repentance`re-pen\'-tans:<P><B>I. OLD TESTAMENT TERMS</B><P class="in15">1. To Repent—"to Pant," "to Sigh"<P class="in15">2. To Repent—"to Turn" or "Return"<P><B>II. NEW TESTAMENT TERMS</B><P class="in15">1. Repent—"to Care," "Be Concerned"<P class="in15">2. Repent—"to Change the Mind"<P class="in15">3. Repent—"to Turn Over," "to Turn Upon," "to Turn Unto"<P><B>III. THE PSYCHOLOGICAL ELEMENTS</B><P class="in15">1. The Intellectual Element<P class="in15">2. The Emotional Element<P class="in15">3. The Volitional Element<P><b>LITERATURE</b><HR /><P>To get an accurate idea of the precise New Testament meaning of this highly important word it is necessary to consider its approximate synonyms in the original Hebrew and Greek The psychological elements of repentance should be considered in the light of the general teaching of Scripture.<P>I. Old Testament Terms.<P>1. To Repent—"to Pant," "to Sigh":<P>The Hebrew word naham, is an onomatopoetic term which implies difficulty in breathing, hence, "to pant," "to sigh," "to groan." Naturally it came to signify "to lament" or "to grieve," and when the emotion was produced by the desire of good for others, it merged into compassion and sympathy, and when incited by a consideration of one\'s own character and deeds it means "to rue," "to repent." To adapt language to our understanding, God is represented as repenting when delayed penalties are at last to be inflicted, or when threatened evils have been averted by genuine reformation (<a onClick="return mV(\'Gen\',6,6);">Ge 6:6</a>; <a onClick="return mV(\'Jon\',3,10);">Jon 3:10</a>). This word is translated "repent" about 40 times in the Old Testament, and in nearly all cases it refers to God. The principal idea is not personal relation to sin, either in its experience of grief or in turning from an evil course. Yet the results of sin are manifest in its use. God\'s heart is grieved at man\'s iniquity, and in love He bestows His grace, or in justice He terminates His mercy. It indicates the aroused emotions of God which prompt Him to a different course of dealing with the people. Similarly when used with reference to man, only in this case the consciousness of personal transgression is evident. This distinction in the application of the word is intended by such declarations as God "is not a man, that he should repent" (<a onClick="return mV(\'1Sa\',15,29);">1Sa 15:29</a>; <a onClick="return mV(\'Job\',42,6);">Job 42:6</a>; <a onClick="return mV(\'Jer\',8,6);">Jer 8:6</a>).<P>2. To Repent—"to Turn" or "Return":<P>The term shubh, is most generally employed to express the Scriptural idea of genuine repentance. It is used extensively by the prophets, and makes prominent the idea of a radical change in one\'s attitude toward sin and God. It implies a conscious, moral separation, and a personal decision to forsake sin and to enter into fellowship with God. It is employed extensively with reference to man\'s turning away from sin to righteousness (<a onClick="return mV(\'Deu\',4,30);">De 4:30</a>; <a onClick="return mV(\'Neh\',1,9);">Ne 1:9</a>; <a onClick="return mV(\'Psa\',7,12);">Ps 7:12</a>; <a onClick="return mV(\'Jer\',3,14);">Jer 3:14</a>). It quite often refers to God in His relation to man (<a onClick="return mV(\'Exd\',32,12);">Ex 32:12</a>; <a onClick="return mV(\'Jos\',7,26);">Jos 7:26</a>). It is employed to indicate the thorough spiritual change which God alone can effect (<a onClick="return mV(\'Psa\',85,4);">Ps 85:4</a>). When the term is translated by "return" it has reference either to man, to God, or to God and man (<a onClick="return mV(\'1Sa\',7,3);">1Sa 7:3</a>; <a onClick="return mV(\'Psa\',90,13);">Ps 90:13</a> (both terms, nacham and shubh; <a onClick="return mV(\'Isa\',21,12);">Isa 21:12</a>; <a onClick="return mV(\'Isa\',55,7);">55:7</a>). Both terms are also sometimes employed when the twofold idea of grief and altered relation is expressed, and are translated by "repent" and "return" (<a onClick="return mV(\'Eze\',14,6);">Eze 14:6</a>; <a onClick="return mV(\'Hsa\',12,6);">Ho 12:6</a>; <a onClick="return mV(\'Jon\',3,8);">Jon 3:8</a>).<P>II. New Testament Terms.<P>1. Repent—"to Care," "Be Concerned":<P>The term metamelomai, literally signifies to have a feeling or care, concern or regret; like nacham, it expresses the emotional aspect of repentance. The feeling indicated by the word may issue in genuine repentance, or it may degenerate into mere remorse (<a onClick="return mV(\'Mat\',21,29,32);">Mt 21:29,32</a>; <a onClick="return mV(\'Mat\',27,3);">27:3</a>). Judas repented only in the sense of regret, remorse, and not in the sense of the abandonment of sin. The word is used with reference to Paul\'s feeling concerning a certain course of conduct, and with reference to God in His attitude toward His purposes of grace (<a onClick="return mV(\'2Cr\',7,8);">2Co 7:8</a> the King James Version; <a onClick="return mV(\'Hbr\',7,21);">Heb 7:21</a>).<P>2. Repent—"to Change the Mind":<P>The word metanoeo, expresses the true New Testament idea of the spiritual change implied in a sinner\'s return to God. The term signifies "to have another mind," to change the opinion or purpose with regard to sin. It is equivalent to the Old Testament word "turn." Thus, it is employed by John the Baptist, Jesus, and the apostles (<a onClick="return mV(\'Mat\',3,2);">Mt 3:2</a>; <a onClick="return mV(\'Mar\',1,15);">Mr 1:15</a>; <a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>). The idea expressed by the word is intimately associated with different aspects of spiritual transformation and of Christian life, with the process in which the agency of man is prominent, as faith (<a onClick="return mV(\'Act\',20,21);">Ac 20:21</a>), and as conversion (<a onClick="return mV(\'Act\',3,19);">Ac 3:19</a>); also with those experiences and blessings of which God alone is the author, as remission and forgiveness of sin (<a onClick="return mV(\'Luk\',24,47);">Lu 24:47</a>; <a onClick="return mV(\'Act\',5,31);">Ac 5:31</a>). It is sometimes conjoined with baptism, which as an overt public act proclaims a changed relation to sin and God (<a onClick="return mV(\'Mar\',1,4);">Mr 1:4</a>; <a onClick="return mV(\'Luk\',3,3);">Lu 3:3</a>; <a onClick="return mV(\'Act\',13,24);">Ac 13:24</a>; <a onClick="return mV(\'Act\',19,4);">19:4</a>). As a vital experience, repentance is to manifest its reality by producing good fruits appropriate to the new spiritual life (<a onClick="return mV(\'Mat\',3,8);">Mt 3:8</a>).<P>3. Repent—"to Turn Over," "to Turn Upon," "to Turn Unto":<P>The word epistrepho, is used to bring out more clearly the distinct change wrought in repentance. It is employed quite frequently in Acts to express the positive side of a change involved in New Testament repentance, or to indicate the return to God of which the turning from sin is the negative aspect. The two conceptions are inseparable and complementary. The word is used to express the spiritual transition from sin to God (<a onClick="return mV(\'Act\',9,35);">Ac 9:35</a>; <a onClick="return mV(\'1Th\',1,9);">1Th 1:9</a>); to strengthen the idea of faith (<a onClick="return mV(\'Act\',11,21);">Ac 11:21</a>); and to complete and emphasize the change required by New Testament repentance (<a onClick="return mV(\'Act\',26,20);">Ac 26:20</a>).<P>There is great difficulty in expressing the true idea of a change of thought with reference to sin when we translate the New Testament "repentance" into other languages. The Latin version renders it "exercise penitence" (poenitentiam agere). But "penitence" etymologically signifies pain, grief, distress, rather than a change of thought and purpose. Thus Latin Christianity has been corrupted by the pernicious error of presenting grief over sin rather than abandonment of sin as the primary idea of New Testament repentance. It was easy to make the transition from penitence to penance, consequently the Romanists represent Jesus and the apostles as urging people to do penance (poenitentiam agite). The English word "repent" is derived from the Latin repoenitere, and inherits the fault of the Latin, making grief the principal idea and keeping it in the background, if not altogether out of sight, the fundamental New Testament conception of a change of mind with reference to sin. But the exhortations of the ancient prophets, of Jesus, and of the apostles show that the change of mind is the dominant idea of the words employed, while the accompanying grief and consequent reformation enter into one\'s experience from the very nature of the case.<P>III. The Psychological Elements.<P>1. The Intellectual Element:<P>Repentance is that change of a sinner\'s mind which leads him to turn from his evil ways and live. The change wrought in repentance is so deep and radical as to affect the whole spiritual nature and to involve the entire personality. The intellect must function, the emotions must be aroused, and the will must act. Psychology shows repentance to be profound, personal and all-pervasive. The intellectual element is manifest from the nature of man as an intelligent being, and from the demands of God who desires only rational service. Man must apprehend sin as unutterably heinous, the divine law as perfect and inexorable, and himself as coming short or falling below the requirements of a holy God (<a onClick="return mV(\'Job\',42,5,6);">Job 42:5,6</a>; <a onClick="return mV(\'Psa\',51,3);">Ps 51:3</a>; <a onClick="return mV(\'Rom\',3,20);">Ro 3:20</a>).<P>2. The Emotional Element:<P>There may be a knowledge of sin without turning from it as an awful thing which dishonors God and ruins man. The change of view may lead only to a dread of punishment and not to the hatred and abandonment of sin (<a onClick="return mV(\'Exd\',9,27);">Ex 9:27</a>; <a onClick="return mV(\'Num\',22,34);">Nu 22:34</a>; <a onClick="return mV(\'Jos\',7,20);">Jos 7:20</a>; <a onClick="return mV(\'1Sa\',15,24);">1Sa 15:24</a>; <a onClick="return mV(\'Mat\',27,4);">Mt 27:4</a>). An emotional element is necessarily involved in repentance. While feeling is not the equivalent of repentance, it nevertheless may be a powerful impulse to a genuine turning from sin. A penitent cannot from the nature of the case be stolid and indifferent. The emotional attitude must be altered if New Testament repentance be experienced. There is a type of grief that issues in repentance and another which plunges into remorse. There is a godly sorrow and also a sorrow of the world. The former brings life; the latter, death (<a onClick="return mV(\'Mat\',27,3);">Mt 27:3</a>; <a onClick="return mV(\'Luk\',18,23);">Lu 18:23</a>; <a onClick="return mV(\'2Cr\',7,9,10);">2Co 7:9,10</a>). There must be a consciousness of sin in its effect on man and in its relation to God before there can be a hearty turning away from unrighteousness. The feeling naturally accompanying repentance implies a conviction of personal sin and sinfulness and an earnest appeal to God to forgive according to His mercy (<a onClick="return mV(\'Psa\',51,1,2,\'10-14\');">Ps 51:1,2,10-14</a>).<P>3. The Volitional Element:<P>The most prominent element in the psychology of repentance is the voluntary, or volitional. This aspect of the penitent\'s experience is expressed in the Old Testament by "turn", or "return," and in the New Testament by "repent" or "turn." The words employed in the Hebrew and Greek place chief emphasis on the will, the change of mind, or of purpose, because a complete and sincere turning to God involves both the apprehension of the nature of sin and the consciousness of personal guilt (<a onClick="return mV(\'Jer\',25,5);">Jer 25:5</a>; <a onClick="return mV(\'Mar\',1,15);">Mr 1:15</a>; <a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'2Cr\',7,9,10);">2Co 7:9,10</a>). The demand for repentance implies free will and individual responsibility. That men are called upon to repent there can be no doubt, and that God is represented as taking the initiative in repentance is equally clear. The solution of the problem belongs to the spiritual sphere. The psychical phenomena have their origin in the mysterious relations of the human and the divine personalities. There can be no external substitute for the internal change. Sackcloth for the body and remorse for the soul are not to be confused with a determined abandonment of sin and return to God. Not material sacrifice, but a spiritual change, is the inexorable demand of God in both dispensations (<a onClick="return mV(\'Psa\',51,17);">Ps 51:17</a>; <a onClick="return mV(\'Isa\',1,11);">Isa 1:11</a>; <a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a>; <a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>).<P>Repentance is only a condition of salvation and not its meritorious ground. The motives for repentance are chiefly found in the goodness of God, in divine love, in the pleading desire to have sinners saved, in the inevitable consequences of sin, in the universal demands of the gospel, and in the hope of spiritual life and membership in the kingdom of heaven (<a onClick="return mV(\'Eze\',33,11);">Eze 33:11</a>; <a onClick="return mV(\'Mar\',1,15);">Mr 1:15</a>; <a onClick="return mV(\'Luk\',13,\'1-5\');">Lu 13:1-5</a>; <a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>; <a onClick="return mV(\'Act\',17,30);">Ac 17:30</a>; <a onClick="return mV(\'Rom\',2,4);">Ro 2:4</a>; <a onClick="return mV(\'1Ti\',2,4);">1Ti 2:4</a>). The first four beatitudes (<a onClick="return mV(\'Mat\',5,\'3-6\');">Mt 5:3-6</a>) form a heavenly ladder by which penitent souls pass from the dominion of Satan into the Kingdom of God. A consciousness of spiritual poverty dethroning pride, a sense of personal unworthiness producing grief, a willingness to surrender to God in genuine humility, and a strong spiritual desire developing into hunger and thirst, enter into the experience of one who wholly abandons sin and heartily turns to Him who grants repentance unto life.<P>LITERATURE.<P>Various theological works and commentaries Note especially Strong, Systematic Theology, III, 832-36; Broadus on <a onClick="return mV(\'Mat\',3,2);">Mt 3:2</a>, American Comm.; article "Busse" (Penance). Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche.``38';
isbe[7372]='Repetitions`rep-e-tish\'-unz: In <a onClick="return mV(\'Mat\',6,7);">Mt 6:7</a> only, "Use not vain repetitions," for battalogeo (so Codex Sinaiticus and Codex Vaticanus), a word found nowhere else and spelled variously in the manuscripts, battologeo in Codices K, L, M; etc., batologeo in Codices F G, blattologeo in Codex Bezae (probably influenced by the Latin blatero, "talk idly"); presumably connected with battarizo, "stammer," and perhaps formed under the influence of the Aramaic beta\', "speak carelessly," or batel, "useless." Whether, however battalogeo means the constant repetition of the same phrase or the mechanical recitation of a long series of obscure or meaningless formulas (if, indeed, a distinction between the acts was thought of) cannot be determined. Either practice is abundantly evidenced as a "heathen" custom of the day, and either can be classed as "much speaking."`<a href="./study/isbe/search.html?string=PRAYER">PRAYER</a>`48';
isbe[7373]='Rephael`re\'-fa-el, ref\'-a-el (repha\'el, "God has healed"; Rhaphael): The eponym of a family of gatekeepers (<a onClick="return mV(\'1Ch\',26,7);">1Ch 26:7</a>). The name occurs in Tobit and Enoch ("Raphael"); it probably belongs to a group of late formations. See Gray, HPN, 225, 311.``1';
isbe[7374]='Rephah`re\'-fa (rephach (the form is corrupt); Rhaphe): The eponym of an Ephraimite family (<a onClick="return mV(\'1Ch\',7,25);">1Ch 7:25</a>).``1';
isbe[7375]='Rephaiah`re-fa\'-ya, re-fi\'-a (rephayah, probably "Yah is healing"; Septuagint Rhaphaia(s)): <P>(1) In David\'s family, Septuagint also Rhaphal (<a onClick="return mV(\'1Ch\',3,21);">1Ch 3:21</a>).<P>(2) A captain of Simeon (<a onClick="return mV(\'1Ch\',4,42);">1Ch 4:42</a>).<P>(3) A grandson of Issachar, Septuagint also Rhaphara (<a onClick="return mV(\'1Ch\',7,2);">1Ch 7:2</a>).<P>(4) A descendant of Saul (<a onClick="return mV(\'1Ch\',9,43);">1Ch 9:43</a>; in <a onClick="return mV(\'1Ch\',8,37);">1Ch 8:37</a> called "Raphah" (raphah); Septuagint also Raphai).<P>(5) One of the repairers of the wall under Nehemiah (<a onClick="return mV(\'Neh\',3,9);">Ne 3:9</a>).``1';
isbe[7376]='Rephaim`ref\'-a-im, re-fa\'-im (repha\'-im, from rapha\', "a terrible one" hence "giant," in <a onClick="return mV(\'1Ch\',20,4);">1Ch 20:4</a>, yelidhe ha-rapha\', "sons of the giant"; the King James Version, Rephaims): A race of aboriginal or early inhabitants east of the Jordan in Ashterothkarnaim (<a onClick="return mV(\'Gen\',14,5);">Ge 14:5</a>) and in the valley of Rephaim southwest of Jerusalem (<a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>). They associated with other giant races, as the Emim and Anakim (<a onClick="return mV(\'Deu\',2,10,11);">De 2:10,11</a>) and the Zamzummim (<a onClick="return mV(\'Deu\',2,20);">De 2:20</a>). It is probable that they were all of the same stock, being given different names by the different tribes who came in contact with them. The same Hebrew word is rendered "the dead," or "the shades" in various passages (<a onClick="return mV(\'Job\',26,5);">Job 26:5</a> margin; <a onClick="return mV(\'Psa\',88,10);">Ps 88:10</a> margin; <a onClick="return mV(\'Pro\',2,18);">Pr 2:18</a> margin; <a onClick="return mV(\'Pro\',9,18);">Pr 9:18</a> margin; <a onClick="return mV(\'Pro\',21,16);">Pr 21:16</a> margin; <a onClick="return mV(\'Isa\',14,9);">Isa 14:9</a> margin; <a onClick="return mV(\'Isa\',26,14,19);">Isa 26:14,19</a> margin). In these instances the word is derived from rapheh, "weak," "powerless," "a shadow" or "shade."``138';
isbe[7377]='Rephaim, Vale of`(\'emeq repha\'-im; koilas Rhaphaeim, koilas ton Titanon): This was a fertile vale (<a onClick="return mV(\'Isa\',17,5);">Isa 17:5</a>), to the southwest of Jerusalem (<a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>; <a onClick="return mV(\'Jos\',18,16);">18:16</a>; the King James Version "Valley of the Giants"), on the border between Judah and Benjamin. Here David repeatedly defeated the invading Philistines (<a onClick="return mV(\'2Sa\',5,18,22);">2Sa 5:18,22</a>; <a onClick="return mV(\'2Sa\',23,13);">23:13</a>; <a onClick="return mV(\'1Ch\',11,15);">1Ch 11:15</a>; <a onClick="return mV(\'1Ch\',14,9);">14:9</a>). It is located by Josephus between Jerusalem and Bethlehem (Ant., VII, iv, i; xii, 4). It corresponds to the modern el-Biqa\', which falls away to the southwest from the lip of the valley of Hinnom. The name in ancient times may perhaps have covered a larger area, including practically all the land between Jerusalem and Bethlehem, where the head-waters of Nahr Ruben are collected.``54';
isbe[7378]='Rephan`re\'-fan: A name for Chiun, the planet Saturn.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=CHIUN">CHIUN</a>`1';
isbe[7379]='Rephidim`ref\'-i-dim (rephidhim, "rests"; Rhaphidin): A station in the Wanderings, between the wilderness of Sin and the wilderness of Sinai (<a onClick="return mV(\'Exd\',17,1,8);">Ex 17:1,8</a>; <a onClick="return mV(\'Exd\',19,2);">19:2</a>; <a onClick="return mV(\'Num\',33,14);">Nu 33:14</a>). The host expected to find water here; to their distress the streams were dry, and water was miraculously provided. Palmer (Desert of the Exodus, 158ff) states cogent reasons for identifying Rephidim with Wady Feiran. It is the most fertile part of the peninsula, well watered, with a palm grove stretching for miles along the valley. Palmer speaks of passing through the palm grove as a "most delightful" walk; "the tall, graceful trees afforded a delicious shade, fresh water ran at our feet, and, above all, bulbuls flitted from branch to branch uttering their sweet notes." His camp was pitched at "the mouth of Wady \'Aleyat, a large open space completely surrounded by steep, shelving mountains of gneiss, the fantastic cleavage of which added greatly to the beauty of the scene. Palms and tamarisks were dotted all around, and on every knoll and mountain slope were ruined houses, churches, and walls, the relics of the ancient monastic city of Paran. Behind our tents rose the majestic mass of Serbal, and beneath the rocky wall opposite ran a purling brook, only a few inches in depth, but still sufficiently cool, clear, and refreshing."<P>Such a place as this the Amalekites would naturally wish to preserve for themselves against an invading people. For these desert dwellers, indeed, the possession of this watered vale may well have been a matter of life and death.<P>If this identification is correct, then Jebel Tachuneh, "Mount of the mill," a height that rises on the north of the valley, may have been the hill from which Moses, with Aaron and Hur, viewed the battle.``54';
isbe[7380]='Reprobate`rep\'-ro-bat: This word occurs in the English Bible in the following passages: <a onClick="return mV(\'Jer\',6,30);">Jer 6:30</a> (the Revised Version (British and American) "refuse"); <a onClick="return mV(\'Rom\',1,28);">Ro 1:28</a>; <a onClick="return mV(\'2Cr\',13,5,6,7);">2Co 13:5,6,7</a>; <a onClick="return mV(\'2Ti\',3,8);">2Ti 3:8</a>; <a onClick="return mV(\'Tts\',1,16);">Tit 1:16</a>. In all these cases the Greek has adokimos. The same Greek word, however, is found with other renderings in <a onClick="return mV(\'Isa\',1,22);">Isa 1:22</a> ("dross"); <a onClick="return mV(\'Pro\',25,4);">Pr 25:4</a> ("dross"); <a onClick="return mV(\'1Cr\',9,27);">1Co 9:27</a> ("castaway," the Revised Version (British and American) "rejected"). The primary meaning of adokimos is "not-received," "not-acknowledged." This is applied to precious metals or money, in the sense of "not-current," to which, however, the connotation "not-genuine" easily attaches itself. It is also applied to persons who do not or ought not to receive honor or recognition. This purely negative conception frequently passes over into the positive one of that which is or ought to be rejected, either by God or men. Of the above passages <a onClick="return mV(\'1Cr\',9,27);">1Co 9:27</a> uses the word in this meaning. Probably <a onClick="return mV(\'Rom\',1,28);">Ro 1:28</a>, "God gave them up unto a reprobate mind" must be explained on the same principle: the nous of the idolatrous heathen is permitted by God to fall into such extreme forms of evil as to meet with the universal rejection and reprobation of men. Wettstein\'s interpretation, "an unfit mind," i.e. incapable of properly performing its function of moral discrimination, has no linguistic warrant, and obliterates the wordplay between "they refused to have God in their knowledge (ouk edokimasan)," and "God gave them up to a reprobate (= unacknowledged, adokimos) mind." Even <a onClick="return mV(\'Tts\',1,16);">Tit 1:16</a>, "unto every good work reprobate," affords no instance of the meaning unfit, but belongs to the following rubric.<P>The close phonetic resemblance and etymological affinity of dokimos to the verb dokimazo, "to try," "test," has caused the notion of "being tested," "tried," and its opposite of "being found wanting in the test" to associate itself more or less distinctly with the adjectives dokimos and adokimos. Thus the more complex meaning results of that which is acknowledged or rejected, because it has approved or not approved itself in testing. This connotation is present in <a onClick="return mV(\'2Cr\',13,5,6,7);">2Co 13:5,6,7</a>; <a onClick="return mV(\'2Ti\',3,8);">2Ti 3:8</a>; <a onClick="return mV(\'Tts\',1,16);">Tit 1:16</a>; <a onClick="return mV(\'Hbr\',6,8);">Heb 6:8</a>. In the first two of these passages the word is used of Christians who ostensibly were in the true faith, but either hypothetically or actually are represented as having failed to meet the test. "Reprobate unto every good work" (<a onClick="return mV(\'Tts\',1,16);">Tit 1:16</a>) are they who by their life have disappointed the expectation of good works. The "reprobate (rejected) land" of <a onClick="return mV(\'Hbr\',6,8);">Heb 6:8</a> is land that by bearing thorns and thistles has failed to meet the test of the husband man. It should be noticed, however, that adokimos, even in these cases, always retains the meaning of rejection because of failure in trial; compare in the last-named passage: "rejected and nigh unto cursing."<P>LITERATURE.<P>Cremer, Biblisch-theologisches Worterbuch der neutestamentlichen Gracitat(10), 356-57.``182';
isbe[7381]='Reproof; Reprove`re-proof\', re-proov\':"Reprove" in Elizabethan English had a variety of meanings ("reject" "disprove" "convince," "rebuke"), with "put to the proof" (see <a onClick="return mV(\'2Ti\',4,2);">2Ti 4:2</a> the Revised Version margin) as the force common to all, although in modern English the word means only "rebuke" (with a connotation of deliberateness). the King James Version uses the word chiefly (and the Revised Version (British and American) exclusively, except in 2Esdras 12:32; 14:13; 2Macc 4:33) for yakhach, and elegcho, words that have very much the same ambiguities of meaning. Hence, a fairly easy rendition into English was possible, but the result included all the ambiguities of the original, and to modern readers such a passage as "But your reproof, what doth it reprove? Do ye think to reprove words" (<a onClick="return mV(\'Job\',6,25,26);">Job 6:25,26</a> the American Standard Revised Version) is virtually incomprehensible. The meaning is, approximately: "What do your rebukes prove? Are you quibbling about words?" In <a onClick="return mV(\'Jhn\',16,8);">Joh 16:8</a> no single word in modern English will translate elegcho, and "reprove" (the King James Version), "convince" (King James Version margin), and "convict" (Revised Version) are all unsatisfactory. The sense is: "The Spirit will teach men the true meaning of these three words: sin, righteousness, judgment."``48';
isbe[7382]='Reptile`rep\'-til, -til: Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) in <a onClick="return mV(\'Mic\',7,17);">Mic 7:17</a> has reptilis for zohale, "crawling things," the American Standard Revised Version "worms of the earth," the King James Version margin "creeping things."`<a href="./study/isbe/search.html?string=LEVIATHAN">LEVIATHAN</a>; <a href="./study/isbe/search.html?string=LIZARD">LIZARD</a>; <a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>; <a href="./study/isbe/search.html?string=TORTOISE">TORTOISE</a>`1';
isbe[7383]='Reputation`rep-u-ta\'-shun: the King James Version uses "reputation" where modern English would use "repute," as connoting prominence rather than moral character. Hence, the Revised Version\'s change to "repute" in <a onClick="return mV(\'Gal\',2,2);">Ga 2:2</a> (for dokeo, "seem," perhaps with a slightly sarcastic touch). The Revised Version\'s alteration of "reputation" into "have in honor" (<a onClick="return mV(\'Act\',5,34);">Ac 5:34</a>; <a onClick="return mV(\'Phl\',2,29);">Php 2:29</a>) is to secure uniformity of translation for the derivatives of time, "honor," but the Revised Version (British and American) retains "reputation" in Susanna, verse 64. The King James Version\'s "made himself of no reputation" in <a onClick="return mV(\'Phl\',2,7);">Php 2:7</a> is a gloss. See <a href="./study/isbe/search.html?string=KENOSIS">KENOSIS</A>. On <a onClick="return mV(\'Ecc\',10,1);">Ec 10:1</a> see the commentaries.``1';
isbe[7384]='Require`re-kwir\':"Require" meant originally "seek after," whence "ask," and so (as in modern English) "demand." All meanings are common in the King James Version (e.g. <a onClick="return mV(\'1Sa\',21,8);">1Sa 21:8</a>; <a onClick="return mV(\'Ecc\',3,15);">Ec 3:15</a>; <a onClick="return mV(\'Ezr\',8,22);">Ezr 8:22</a>; <a onClick="return mV(\'1Cr\',4,2);">1Co 4:2</a>), and the Revised Version (British and American) has made little change.``1';
isbe[7385]='Rereward`rer\'-word.`<a href="./study/isbe/search.html?string=REARWARD">REARWARD</a>`1';
isbe[7386]='Resaias`re-sa\'-yas, re-si\'-as (Rhesaias; the King James Version Reesaias): One of the "leaders" with Zerubbabel in the return (1Esdras 5:8) = "Reelaiah" in <a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>, "Raamiah" in <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>. The name is apparently duplicated in 1Esdras 5:8 in the form "Reelias."``1';
isbe[7387]='Resen`re\'-sen (recen; Septuagint Dasen, Dasem):<P>1. The Name and Its Native Equivalent:<P>The Greek forms show that the Septuagint translators had "d", for "r", but the reading of the Massoretic Text is to be preferred. Resen—the last of the four cities mentioned in <a onClick="return mV(\'Gen\',10,11,12);">Ge 10:11,12</a> as having been founded by Nimrod (the King James Version by Asshur)—probably represents the Assyrian pronunciation of the place-name Res-eni, "fountainhead." The only town so named in the inscriptions is one of 18 mentioned by Sennacherib in the Bavian inscription as places from which he dug canals connecting with the river Khosr—in fact, it was one of the sources of Nineveh\'s water supply. It probably lay too far north, however, to be the city here intended. Naturally the name "Resen" could exist in any place where there was a spring.<P>2. Possibly the Modern Selamiyeh:<P>As the Biblical text requires a site lying between Nineveh and Calah (Kouyunjik and Nimroud), it is generally thought to be represented by the ruins at Selamiyeh, about 3 miles north of the latter city. It is noteworthy that Xenophon (Anab. iii.4) mentions a "great" city called Larissa as occupying this position, and Bochart has suggested that it is the same place. He supposes that when the inhabitants were asked to what city the ruins belonged, they answered la Resen, "to Resen," which was reproduced by the Greeks as Larissa. Xenophon describes its walls as being 25 ft. wide, 100 ft. high, and 2 parasangs in circuit. Except for the stone plinth 20 ft. high, they were of brick. He speaks of a stone-built pyramid near the city—possibly the temple-tower at Nimroud.`<a href="./study/isbe/search.html?string=CALAH">CALAH</a>; <a href="./study/isbe/search.html?string=NINEVEH">NINEVEH</a>`136';
isbe[7388]='Reservoir`rez\'-er-vwor, -vwar (miqwah; the King James Version ditch (<a onClick="return mV(\'Isa\',22,11);">Isa 22:11</a>)).`<a href="./study/isbe/search.html?string=DITCH">DITCH</a>; <a href="./study/isbe/search.html?string=CISTERN">CISTERN</a>; <a href="./study/isbe/search.html?string=POOL">POOL</a>`1';
isbe[7389]='Resh`resh, rash "r": The 20th letter of the Hebrew alphabet; transliterated in this Encyclopedia as "r". It came also to be used for the number 200.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[7390]='Resheph`re\'-shef (resheph, "flame" or "fire-bolt"): Personal name found in Phoenician as a divine name. In the Old Testament the name of a descendant of Ephraim, the eponym of an Ephraimite family or clan (<a onClick="return mV(\'1Ch\',7,25);">1Ch 7:25</a>).``1';
isbe[7391]='Residue`rez\'-i-du.`<a href="./study/isbe/search.html?string=REMNANT">REMNANT</a>`1';
isbe[7392]='Respect of Persons`re-spekt\':The phrase nasa\' phanim, means literally, "lift up the face," and, among other translations, is rendered indifferently "accept" or "respect the person" in the King James Version (contrast <a onClick="return mV(\'Pro\',18,5);">Pr 18:5</a> and <a onClick="return mV(\'Pro\',24,23);">24:23</A>). As applied to a (prostrate) suppliant, the phrase means "receive him with favor," and is so used in <a onClick="return mV(\'1Sa\',25,35);">1Sa 25:35</a>; <a onClick="return mV(\'Mal\',1,8,9);">Mal 1:8,9</a> (compare <a onClick="return mV(\'Gen\',19,21);">Ge 19:21</a>, etc.). By a shift in force the phrase came to mean "accept the person instead of the cause" or "show partiality" (<a onClick="return mV(\'Job\',13,8,10);">Job 13:8,10</a> the American Standard Revised Version), and is so used commonly. A literal translation into Greek gave lambano prosopon (Sirach 35:13 (32:16); <a onClick="return mV(\'Luk\',20,21);">Lu 20:21</a>; <a onClick="return mV(\'Gal\',2,6);">Ga 2:6</a>), with the noun prosopolempsia, "face-taking" (<a onClick="return mV(\'Rom\',2,11);">Ro 2:11</a>; <a onClick="return mV(\'Eph\',6,9);">Eph 6:9</a>; <a onClick="return mV(\'Col\',3,25);">Col 3:25</a>; <a onClick="return mV(\'Jam\',2,1);">Jas 2:1</a>), rendered uniformly "respect of persons" in English Versions of the Bible. A noun prosopolemptes, "respecter of persons," and a verb prosopolempteo, are found <a onClick="return mV(\'Act\',10,34);">Ac 10:34</a>; <a onClick="return mV(\'Jam\',2,9);">Jas 2:9</a>. God\'s judgment rests solely on the character of the man and will be influenced by no worldly (<a onClick="return mV(\'Eph\',6,9);">Eph 6:9</a>) or national (<a onClick="return mV(\'Rom\',2,11);">Ro 2:11</a>) considerations.`<a href="./study/isbe/search.html?string=ACCEPT">ACCEPT</a>`48';
isbe[7393]='Rest`(nuach, menuchah, "cessation from motion," "peace," "quiet," etc.; anapausis, katapausis): "Rest" in the above sense is of frequent occurrence, and is the translation of several words with various applications and shades of meaning, chiefly of the words given above. It is applied to God as ceasing from the work of creating on the 7th day (<a onClick="return mV(\'Gen\',2,2);">Ge 2:2</a>f); as having His place of rest in the midst of His people in the temple (<a onClick="return mV(\'1Ch\',28,2);">1Ch 28:2</a>; <a onClick="return mV(\'Psa\',132,8,14);">Ps 132:8,14</a>); as resting in His love among His people (<a onClick="return mV(\'Zep\',3,17);">Ze 3:17</a>, the Revised Version margin "Hebrew, \'be silent\' "). The 7th day was to be one of rest (<a onClick="return mV(\'Exd\',16,23);">Ex 16:23</a>; <a onClick="return mV(\'Exd\',31,15);">31:15</a>; see <a href="./study/isbe/search.html?string=SABBATH">SABBATH</A>); the land also was to have its rest in the 7th year (<a onClick="return mV(\'Lev\',25,4);">Le 25:4</a>f). Yahweh promised His people rest in the land He should give them; this they looked forward to and enjoyed (<a onClick="return mV(\'Deu\',12,9);">De 12:9</a>; <a onClick="return mV(\'Jos\',11,23);">Jos 11:23</a>). "To rest on" often means to come upon to abide, as of the Spirit of Yahweh (<a onClick="return mV(\'Num\',11,25);">Nu 11:25</a>f; <a onClick="return mV(\'Isa\',11,2);">Isa 11:2</a>), of wisdom (<a onClick="return mV(\'Pro\',14,33);">Pr 14:33</a>), of anger (<a onClick="return mV(\'Ecc\',7,9);">Ec 7:9</a>). There is again the "rest" of the grave (<a onClick="return mV(\'Job\',3,13,17,18);">Job 3:13,17,18</a>; <a onClick="return mV(\'Isa\',57,2);">Isa 57:2</a>; <a onClick="return mV(\'Dan\',12,13);">Da 12:13</a>). Rest is sometimes equivalent to trust, reliance (<a onClick="return mV(\'2Ch\',14,11);">2Ch 14:11</a>, the Revised Version (British and American) "rely"). Hence, rest in Yahweh (<a onClick="return mV(\'Psa\',37,7);">Ps 37:7</a>, etc.); "rest" in the spiritual sense is not, however, prominent in the Old Testament. In the New Testament Christ\'s great offer is rest to the soul (<a onClick="return mV(\'Mat\',11,28);">Mt 11:28</a>). In <a onClick="return mV(\'Hbr\',4,1);">Heb 4:1</a>ff, it is argued from God\'s having promised His people a "rest"—a promise not realized in Canaan (<a onClick="return mV(\'Hbr\',4,8);">4:8</A>)—that there remains for the people of God "a Sabbath rest" (sabbatismos, <a onClick="return mV(\'Hbr\',4,9);">4:9</A>). For "rest" the Revised Version (British and American) has "solemn rest" (<a onClick="return mV(\'Exd\',16,23);">Ex 16:23</a>; <a onClick="return mV(\'Exd\',31,15);">31:15</a>, etc.), "resting-place" (<a onClick="return mV(\'Psa\',132,8,14);">Ps 132:8,14</a>; <a onClick="return mV(\'Isa\',11,10);">Isa 11:10</a>), "peace" (<a onClick="return mV(\'Act\',9,31);">Ac 9:31</a>), "relief" (<a onClick="return mV(\'2Cr\',2,13);">2Co 2:13</a>; <a onClick="return mV(\'2Cr\',7,5);">7:5</a>), etc.`<a href="./study/isbe/search.html?string=REMNANT">REMNANT</a>`185';
isbe[7394]='Restitution; Restoration`res-ti-tu\'-shun.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[7395]='Restoration`res-to-ra\'-shun: The idea of a restoration of the world had its origin in the preaching of the Old Testament prophets. Their faith in the unique position and mission of Israel as the chosen people of God inspired in them the conviction that the destruction of the nation would eventually be followed by a restoration under conditions that would insure the realization of the original divine purpose. When the restoration came and passed without fulfillment of this hope, the Messianic era was projected into the future. By the time of Jesus the conception became more or less spiritualized, and the anticipation of a new order in which the consequences of sin would no longer appear was a prominent feature of the Messianic conception. In the teaching of Jesus and the apostles such a restoration is taken for granted as a matter of course.<P>In <a onClick="return mV(\'Mat\',17,11);">Mt 17:11</a> (compare <a onClick="return mV(\'Mar\',9,12);">Mr 9:12</a>), the moral and spiritual regeneration preached by John the Baptist is described as a restoration and viewed as a fulfillment of <a onClick="return mV(\'Mal\',4,6);">Mal 4:6</a>. It is "to be observed, however, that the work of John could be characterized as restoration only in the sense of an inception of the regeneration that was to be completed by Jesus. In <a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a> Jesus speaks of a regeneration (palingenesia) of the world in terms that ascribe to the saints a state of special felicity. Perhaps the most pointed expression of the idea of restoration as a special event or crisis is found in the address of Peter (<a onClick="return mV(\'Act\',3,21);">Ac 3:21</a>), where the restoration is described as an apokatastasis panton, and is viewed as a fulfillment of prophecy.<P>In all the passages cited the restoration is assumed as a matter with which the hearers are familiar, and consequently its nature is not unfolded. The evidence is, therefore, too limited to justify any attempt to outline its special features. Under such circumstances there is grave danger of reading into the language of the Scriptures one\'s own conception of what the restoration is to embody. We are probably expressing the full warrant of the Scripture when we say that the reconstruction mentioned in these passages contemplates the restoration of man, under the reign of Christ, to a life in which the consequences of sin are no longer present, and that this reconstruction is to include in some measure a regeneration of both the physical and the spiritual world.<P>Whether the benefits of the restoration are to accrue to all men is also left undefined in the Scriptures. In the passages already cited only the disciples of Christ appear in the field of vision. Certain sayings of Jesus are sometimes regarded as favorable to the more inclusive view. In <a onClick="return mV(\'Jhn\',12,32);">Joh 12:32</a> Jesus speaks of drawing all men to Himself, but here, as in <a onClick="return mV(\'Jhn\',3,14,15);">Joh 3:14,15</a>, it is to be observed that while Christ\'s sacrifice includes all men in its scope, its benefits will doubtless accrue to those only who respond willingly to His drawing power. The saying of Caiaphas (<a onClick="return mV(\'Jhn\',11,52);">Joh 11:52</a>) is irrelevant, for the phrase, "the children of God that are scattered abroad," probably refers only to the worthy Jews of the dispersion. Neither can the statements of Paul (<a onClick="return mV(\'Rom\',11,32);">Ro 11:32</a>; <a onClick="return mV(\'1Cr\',15,22);">1Co 15:22</a>; <a onClick="return mV(\'Eph\',1,9,10);">Eph 1:9,10</a>; <a onClick="return mV(\'Col\',1,20);">Col 1:20</a>; <a onClick="return mV(\'1Ti\',2,4);">1Ti 2:4</a>; <a onClick="return mV(\'1Ti\',4,10);">4:10</a>; <a onClick="return mV(\'Tts\',2,11);">Tit 2:11</a>) be pressed in favor of the restorationist view. They affirm only that God\'s plan makes provision for the redemption of all, and that His saving will is universal. But men have wills of their own, and whether they share in the benefits of the salvation provided depends on their availing themselves of its privileges. The doctrine of the restoration of all can hardly be deduced from the New Testament.`<a href="./study/isbe/search.html?string=PUNISHMENT,+EVERLASTING">PUNISHMENT, EVERLASTING</a>`121';
isbe[7396]='Resurrection`rez-u-rek\'-shun (in the New Testament anastasis, with verbs anistemi, "stand up," and egeiro, "raise." There is no technical term in the Old Testament, but in <a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a> are found the verbs chayah, "live," kum "rise," kic "awake").<P><B>I. ISRAEL AND IMMORTALITY</B><P class="in15">1. Nationalism<P class="in15">2. Speculation<P class="in15">3. Religious Danger<P class="in15">4. Belief in Immortality<P class="in15">5. Resurrection<P class="in15">6. Greek Concepts<P><B>II. RESURRECTION IN THE OLD TESTAMENT AND INTERMEDIATE LITERATURE</B><P class="in15">1. The Old Testament<P class="in15">2. The Righteous<P class="in15">3. The Unrighteous<P class="in15">4. Complete Denial<P><B>III. TEACHING OF CHRIST</B><P class="in15">1. <span class="noTag">Mark 12:18-27</span><P class="in15">2. In General<P><B>IV. THE APOSTOLIC DOCTRINE</B><P class="in15">1. References<P class="in15">2. Pauline Doctrine<P class="in15">3. Continuity<P class="in15">4. <span class="noTag">2 Corinthians 5</span><P><B>V. SUMMARY</B><P class="in15">1. New Testament Data<P class="in15">2. Interpretation<P><B>LITERATURE</B><HR /><P>I. Israel and Immortality.<P>1. Nationalism:<P>It is very remarkable that a doctrine of life after death as an essential part of religion was of very late development in Israel, although this doctrine, often highly elaborated, was commonly held among the surrounding nations. The chief cause of this lateness was that Israel\'s religion centered predominantly in the ideal of a holy nation. Consequently the individual was a secondary object of consideration, and the future of the man who died before the national promises were fulfilled either was merged in the future of his descendants or else was disregarded altogether.<P>2. Speculation:<P>Much speculation about life after death evidently existed, but it was not in direct connection with the nation\'s religion. Therefore, the Old Testament data are scanty and point, as might be expected, to non-homogeneous concepts. Still, certain ideas are clear. The living individual was composed of "flesh" and nephesh, or ruach (a trichotomy appears to be post-Biblical, despite <a onClick="return mV(\'1Th\',5,23);">1Th 5:23</a>; see <a href="./study/isbe/search.html?string=PSYCHOLOGY">PSYCHOLOGY</A>). In the individual nephesh and ruach seem to be fairly synonymous words, meaning primarily "breath," as the animating principle of the flesh (so for the lower animals in <a onClick="return mV(\'Psa\',104,29,30);">Ps 104:29,30</a>). But nephesh came to be used to denote the "inner man" or "self" (<a onClick="return mV(\'Deu\',12,20);">De 12:20</a>, etc.; see <a href="./study/isbe/search.html?string=HEART">HEART</A>), and so in English Versions of the Bible is usually rendered "soul." But there are only a very few cases where nephesh is used for the seat of the personality after death (<a onClick="return mV(\'Psa\',30,3);">Ps 30:3</a>; compare <a onClick="return mV(\'Psa\',16,10);">Ps 16:10</a>; <a onClick="return mV(\'Psa\',38,17);">38:17</a>; <a onClick="return mV(\'Job\',33,18);">Job 33:18</a>, etc.), and nearly all of such passages seem quite late. Indeed, in some 13 cases the nephesh of a dead man is unmistakably his corpse (<a onClick="return mV(\'Lev\',19,28);">Le 19:28</a>; <a onClick="return mV(\'Num\',5,2);">Nu 5:2</a>; <a onClick="return mV(\'Hag\',2,13);">Hag 2:13</a>, etc.). It seems the question of what survives death was hardly raised; whatever existed then was thought of as something quite new. On the one hand the dead man could be called a "god" (<a onClick="return mV(\'1Sa\',28,13);">1Sa 28:13</a>), a term perhaps related to ancestor-worship. But more commonly the dead are thought of as "shades," repha\'im (<a onClick="return mV(\'Job\',26,5);">Job 26:5</a> margin, etc.), weak copies of the original man in all regards (<a onClick="return mV(\'Eze\',32,25);">Eze 32:25</a>). But, whatever existence such "shades" might have, they had passed out of relation to Yahweh, whom the "dead praise not" (<a onClick="return mV(\'Psa\',115,17,18);">Ps 115:17,18</a>; <a onClick="return mV(\'Isa\',38,18,19);">Isa 38:18,19</a>), and there was no religious interest in them.<P>3. Religious Danger:<P>Indeed, any interest taken in them was likely to be anti-religious, as connected with necromancy, etc. (<a onClick="return mV(\'Deu\',14,1);">De 14:1</a>; <a onClick="return mV(\'Deu\',26,14);">26:14</a>; <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>; <a onClick="return mV(\'Psa\',106,28);">Ps 106:28</a>, etc.; see <a href="./study/isbe/search.html?string=SORCERY">SORCERY</A>), or as connected with foreign religions. Here, probably, the very fact that the surrounding nations taught immortality was a strong reason for Israel\'s refusing to consider it. That Egypt held an elaborate doctrine of individual judgment at death, or that Persia taught the resurrection of the body, would actually tend to render these doctrines suspicious, and it was not until the danger of syncretism seemed past that such beliefs could be considered on their own merits. Hence, it is not surprising that the prophets virtually disregard the idea or that Ecclesiastes denies any immortality doctrine categorically.<P>4. Belief in Immortality:<P>Nonetheless, with a fuller knowledge of God, wider experience, and deeper reflection, the doctrine was bound to come. But it came slowly. Individualism reaches explicit statement in <a onClick="return mV(\'Eze\',14,\'1-\');">Eze 14</a>; <a onClick="return mV(\'Eze\',18,\'1-\');">18</A>; <a onClick="return mV(\'Eze\',33,\'1-\');">33</A> (compare <a onClick="return mV(\'Deu\',24,16);">De 24:16</a>; <a onClick="return mV(\'Jer\',31,29,30);">Jer 31:29,30</a>), but the national point of view still made the rewards and punishments of the individual matters of this world only (<a onClick="return mV(\'Eze\',14,14);">Eze 14:14</a>; <a onClick="return mV(\'Psa\',37,\'1-\');">Ps 37</a>, etc.), a doctrine that had surprising vitality and that is found as late as Sirach (1:13; 11:26). But as this does not square with the facts of life (Job), a doctrine of immortality, already hinted at (II,1,below), was inevitable. It appears in full force in the post-Maccabean period, but why just then is hard to say; perhaps because it was then that there had been witnessed the spectacle of martyrdoms on a large scale (1Macc 1:60-64).<P>5. Resurrection:<P>Resurrection of the body was the form immortality took, in accord with the religious premises. As the saint was to find his happiness in the nation, he must be restored to the nation; and the older views did not point toward pure soul-immortality. The "shades" led a wretched existence at the best; and Paul himself shudders at the thought of "nakedness" (<a onClick="return mV(\'2Cr\',5,3);">2Co 5:3</a>). The nephesh and ruach were uncertain quantities, and even the New Testament has no consistent terminology for the immortal part of man ("soul," <a onClick="return mV(\'Rev\',6,9);">Re 6:9</a>; <a onClick="return mV(\'Rev\',20,4);">20:4</a>; "spirit," <a onClick="return mV(\'Hbr\',12,23);">Heb 12:23</a>; <a onClick="return mV(\'1Pe\',3,19);">1Pe 3:19</a>; Paul avoids any term in <a onClick="return mV(\'1Cr\',15,\'1-\');">1Co 15</a>, and in <a onClick="return mV(\'2Cr\',5,\'1-\');">2Co 5</a> says: "I"). In the Talmud a common view is that the old bodies will receive new souls (Ber. R. 2 7; 6 7; Vayy. R. 12 2; 15 1, etc.; compare Sib Or 4:187).<P>6. Greek Concepts:<P>Where direct Greek influence, however, can be predicated, pure soul-immortality is found (compare <span class="noTag">The Wisdom of Solomon 8:19,20; 9:15</a> (but Wisd\'s true teaching is very uncertain); Enoch 102:4-105; 108; Slavonic Enoch; 4Macc; Josephus, and especially Philo). According to Josephus (BJ, II, viii, 11) the Essenes held this doctrine, but as Josephus graecizes the Pharisaic resurrection into Pythagorean soul-migration (II, viii, 14; contrast Ant, XVIII, i, 3), his evidence is doubtful. Note, moreover, how <a onClick="return mV(\'Luk\',6,9);">Lu 6:9</a>; <a onClick="return mV(\'Luk\',9,25);">9:25</a>; <a onClick="return mV(\'Luk\',12,4,5);">12:4,5</a> has re-worded <a onClick="return mV(\'Mar\',3,4);">Mr 3:4</a>; <a onClick="return mV(\'Mar\',8,36);">8:36</a>; <a onClick="return mV(\'Mat\',10,28);">Mt 10:28</a> for Greek readers. In a vague way even Palestinian Judaism had something of the same concepts (2Esdras 7:88; <a onClick="return mV(\'2Cr\',4,16);">2Co 4:16</a>; <a onClick="return mV(\'2Cr\',12,2);">12:2</a>), while it is commonly held that the souls in the intermediate state can enjoy happiness, a statement first appearing in Enoch 22 (Jubilees 23:31 is hardly serious).<P>II. Resurrection in the Old Testament and Intermediate Literature.<P>1. The Old Testament:<P>For the reasons given above, references in the Old Testament to the resurrection doctrine are few. Probably it is to be found in <a onClick="return mV(\'Psa\',17,15);">Ps 17:15</a>; <a onClick="return mV(\'Psa\',16,11);">16:11</a>; <a onClick="return mV(\'Psa\',49,15);">49:15</a>; <a onClick="return mV(\'Psa\',73,24);">73:24</a>, and in each case with increased probability, but for exact discussions the student must consult the commentaries. Of course no exact dating of these Psalm passages is possible. With still higher probability the doctrine is expressed in <a onClick="return mV(\'Job\',14,\'13-15\');">Job 14:13-15</a>; <a onClick="return mV(\'Job\',19,\'25-29\');">19:25-29</a>, but again alternative explanations are just possible, and, again, Job is a notoriously hard book to date (see <a href="./study/isbe/search.html?string=JOB,+BOOK+OF">JOB, BOOK OF</A>). The two certain passages are <a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a> margin and <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>. In the former (to be dated about 332 (?)) it is promised that the "dew of light" shall fall on the earth and so the (righteous) dead shall revive. But this resurrection is confined to Palestine and does not include the unrighteous. For <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a> see below.<P>2. The Righteous:<P>Indeed, resurrection for the righteous only was thought of much more naturally than a general resurrection. And still more naturally a resurrection of martyrs was thought of, such simply receiving back what they had given up for God. So in Enoch 90:33 (prior to 107 BC) and 2Macc 7:9,11,23; 14:46 (only martyrs are mentioned in 2Macc); compare <a onClick="return mV(\'Rev\',20,4);">Re 20:4</a>. But of course the idea once given could not be restricted to martyrs only, and the intermediate literature contains so many references to the resurrection of the righteous as to debar citation. Early passages are Enoch 91:10 (perhaps pre-Maccabean); Testament of the Twelve Patriarchs, Test. Judah 25:4 (before 107). A very curious passage is Enoch 25:6, where the risen saints merely live longer than did their fathers, i.e. resurrection does not imply immortality. This passage seems to be unique.<P>3. The Unrighteous:<P>For a resurrection of unrighteous men (<a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>; Enoch 22:11; Testament of the Twelve Patriarchs, Test. Benj. 10:7,8, Armenian text—in none of these cases a general resurrection), a motive is given in Enoch 22:13: for such men the mere condition of Sheol is not punishment enough. For a general resurrection the motive is always the final judgment, so that all human history may be summed up in one supreme act. The idea is not very common, and Testament of the Twelve Patriarchs, Test. Benj. 10:7,8 (Greek text); Baruch 50:2; Enoch 51:1; Sib Or 4:178-90; Life of Adam (Greek) 10, and 2Esdras 5:45; 7:32; 14:35 about account for all the unequivocal passages. It is not found in the earliest part of the Talmud, Testament of the Twelve Patriarchs, Test. Benj. 10:7,8 (Greek) has two resurrections.<P>4. Complete Denial:<P>Finally, much of the literature knows no immortality at all. Ecclesiasticus, Sirach and 1Maccabees are the most familiar examples, but there are many others. It is especially interesting that the very spiritual author of 2Esdras did not think it worth while to modify the categorical denial in the source used in 13:20. Of course, the Jewish party that persisted most in a denial of any resurrection was the Sadducees (<a onClick="return mV(\'Mat\',22,23);">Mt 22:23</a> and parallel\'s; <a onClick="return mV(\'Act\',23,8);">Ac 23:8</a>), with an extreme conservatism often found among aristocrats.<P>III. Teaching of Christ.<P>1. <a onClick="return mV(\'Mar\',12,\'18-27\');">Mark 12:18-27</a>:<P>The question is discussed explicitly in the familiar passage <a onClick="return mV(\'Mar\',12,\'18-27\');">Mr 12:18-27</a> parallel <a onClick="return mV(\'Mat\',22,\'23-33\');">Mt 22:23-33</a> parallel <a onClick="return mV(\'Luk\',20,\'27-38\');">Lu 20:27-38</a>. The Sadducees assumed that resurrection implies simply a resuscitation to a resumption of human functions, including the physical side of marriage. Their error lay in the low idea of God. For the Scriptures teach a God whose ability and willingness to care for His creatures are so unlimited that the destiny He has prepared for them is caricatured if conceived in any terms but the absolutely highest. Hence, there follows not only the truth of the resurrection, but a resurrection to a state as far above the sexual sphere as that of the angels. (The possibility of mutual recognition by husband and wife is irrelevant, nor is it even said that the resurrection bodies are asexual) Luke (<a onClick="return mV(\'Luk\',20,36);">20:36</a>) adds the explanation that, as there are to be no deaths, marriage (in its relation to births) will not exist. It may be thought that Christ\'s argument would support equally well the immortality of the soul only, and, as a matter of fact, the same argument is used for the latter doctrine in 4Macc 7:18,19; 16:25. But in Jerusalem and under the given circumstances this is quite impossible. And, moreover, it would seem that any such dualism would be a violation of Christ\'s teaching as to God\'s care.<P>2. In General:<P>However, the argument seems to touch only the resurrection of the righteous, especially in the form given in Luke (compare <a onClick="return mV(\'Luk\',14,14);">Lu 14:14</a>). (But that Luke thought of so limiting the resurrection is disproved by <a onClick="return mV(\'Act\',24,15);">Ac 24:15</a>.) Similarly in <a onClick="return mV(\'Mat\',8,11);">Mt 8:11</a> parallel <a onClick="return mV(\'Luk\',13,28);">Lu 13:28</a>; <a onClick="return mV(\'Mar\',13,27);">Mr 13:27</a> parallel <a onClick="return mV(\'Mat\',24,31);">Mt 24:31</a>. But, as a feature in the Judgment, the resurrection of all men is taught. Then the men of sodom, Tyre, Nineveh appear (<a onClick="return mV(\'Mat\',11,22,24);">Mt 11:22,24</a>; <a onClick="return mV(\'Mat\',12,41,42);">12:41,42</a> parallel <a onClick="return mV(\'Luk\',10,14);">Lu 10:14</a>; <a onClick="return mV(\'Luk\',11,32);">11:32</a>), and those cast into Gehenna are represented as having a body (<a onClick="return mV(\'Mar\',9,\'43-47\');">Mr 9:43-47</a>; <a onClick="return mV(\'Mat\',5,29,30);">Mt 5:29,30</a>; <a onClick="return mV(\'Mat\',10,28);">10:28</a>; <a onClick="return mV(\'Mat\',18,8,9);">18:8,9</a>). And at the great final assize (<a onClick="return mV(\'Mat\',25,\'31-46\');">Mt 25:31-46</a>) all men appear. In the Fourth Gospel a similar distinction is made (<a onClick="return mV(\'Jhn\',6,39,40,44,54);">Joh 6:39,40,44,54</a>; <a onClick="return mV(\'Jhn\',11,25);">11:25</a>), the resurrection of the righteous, based on their union with God through Christ and heir present possession of this union, and (in <a onClick="return mV(\'Jhn\',5,28,29);">Joh 5:28,29</a>) the general resurrection to judgment. Whether these passages imply two resurrections or emphasize only the extreme difference in conditions at the one cannot be determined.<P>The passages in 4 Maccabees referred to above read: "They who care for piety with their whole heart, they alone are able to conquer the impulses of the flesh, believing that like our patriarchs Abraham, Isaac, Jacob, they do not die to God but live to God" (7:18,19); and "They knew that dying for God they would live to God, even as Abraham and Isaac and Jacob and all the patriarchs" (16:25). It is distinctly possible that our Lord\'s words rnay have been known to the author of 4 Maccabees, although the possibility that Christ approved and broadened the tenets of some spiritually-minded few is not to be disregarded. More possible is it that 4 Maccabees influenced Luke\'s Greek phraseology.<P>See <a href="./study/isbe/search.html?string=MACCABEES,+BOOKS+OF">MACCABEES, BOOKS OF, IV</A>.<P>IV. The Apostolic Doctrine.<P>1. References:<P>For the apostles, Christ\'s victory over death took the resurrection doctrine out of the realm of speculative eschatology. Henceforth, it is a fact of experience, basic for Christianity. Direct references in the New Testament are found in <a onClick="return mV(\'Act\',4,2);">Ac 4:2</a>; <a onClick="return mV(\'Act\',17,18,32);">17:18,32</a>; <a onClick="return mV(\'Act\',23,6);">23:6</a>; <a onClick="return mV(\'Act\',24,15,21);">24:15,21</a>; <a onClick="return mV(\'Rom\',4,17);">Ro 4:17</a>; <a onClick="return mV(\'Rom\',5,17);">5:17</a>; <a onClick="return mV(\'Rom\',6,5,8);">6:5,8</a>; <a onClick="return mV(\'Rom\',8,11);">8:11</a>; <a onClick="return mV(\'Rom\',11,15);">11:15</a>; <a onClick="return mV(\'1Cr\',6,14);">1Co 6:14</a>; <a onClick="return mV(\'1Cr\',15,\'1-\');">15</a>; <a onClick="return mV(\'2Cr\',1,9);">2Co 1:9</a>; <a onClick="return mV(\'2Cr\',4,14);">4:14</a>; <a onClick="return mV(\'2Cr\',5,\'1-10\');">5:1-10</a>; <a onClick="return mV(\'Phl\',3,10,11,21);">Php 3:10,11,21</a>; <a onClick="return mV(\'Col\',1,18);">Col 1:18</a>; <a onClick="return mV(\'1Th\',4,\'13-18\');">1Th 4:13-18</a>; <a onClick="return mV(\'2Ti\',2,18);">2Ti 2:18</a>; <a onClick="return mV(\'Hbr\',6,2);">Heb 6:2</a>; <a onClick="return mV(\'Hbr\',11,19,35);">11:19,35</a>; <a onClick="return mV(\'Rev\',20,4,5);">Re 20:4,5</a> (martyrs only); <a onClick="return mV(\'Rev\',20,12,13);">20:12,13</a>. Of these only <a onClick="return mV(\'Act\',24,15);">Ac 24:15</a>; <a onClick="return mV(\'Rev\',20,12,13);">Re 20:12,13</a>, refer to a general resurrection with absolute unambiguity, but the doctrine is certainly contained in others and in <a onClick="return mV(\'2Ti\',4,1);">2Ti 4:1</a> besides.<P>2. Pauline Doctrine:<P>A theology of the resurrection is given fully by Paul. Basic is the conception of the union of the believer with Christ, so that our resurrection follows from His (especially <a onClick="return mV(\'Rom\',6,\'5-11\');">Ro 6:5-11</a>; <a onClick="return mV(\'Phl\',3,10,11);">Php 3:10,11</a>). Every deliverance from danger is a foretaste of the resurrection (<a onClick="return mV(\'2Cr\',4,10,11);">2Co 4:10,11</a>). Indeed so certain is it, that it may be spoken of as accomplished (<a onClick="return mV(\'Eph\',2,6);">Eph 2:6</a>). From another standpoint, the resurrection is simply part of God\'s general redemption of Nature at the consummation (<a onClick="return mV(\'Rom\',8,11,\'18-25\');">Ro 8:11,18-25</a>). As the believer then passes into a condition of glory, his body must be altered for the new conditions (<a onClick="return mV(\'1Cr\',15,50);">1Co 15:50</a>; <a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>); it becomes a "spiritual" body, belonging to the realm of the spirit (not "spiritual" in opposition to "material"). Nature shows us how different "bodies" can be—from the "body" of the sun to the bodies of the lowest animals the kind depends merely on the creative will of God (<a onClick="return mV(\'1Cr\',15,\'38-41\');">1Co 15:38-41</a>). Nor is the idea of a change in the body of the same thing unfamiliar: look at the difference in the "body" of a grain of wheat at its sowing and after it is grown! (<a onClick="return mV(\'1Cr\',15,37);">1Co 15:37</a>). Just so, I am "sown" or sent into the world (probably not "buried") with one kind of body, but my resurrection will see me with a body adapted to my life with Christ and God (<a onClick="return mV(\'1Cr\',15,\'42-44\');">1Co 15:42-44</a>). If I am still alive at the Parousia, this new body shall be clothed upon my present body (<a onClick="return mV(\'1Cr\',15,53,54);">1Co 15:53,54</a>; <a onClick="return mV(\'2Cr\',5,\'2-4\');">2Co 5:2-4</a>) otherwise I shall be raised in it (<a onClick="return mV(\'1Cr\',15,52);">1Co 15:52</a>). This body exists already in the heavens (<a onClick="return mV(\'2Cr\',5,1,2);">2Co 5:1,2</a>), and when it is clothed upon me the natural functions of the present body will be abolished (<a onClick="return mV(\'1Cr\',6,13);">1Co 6:13</a>). Yet a motive for refraining from impurity is to keep undefiled the body that is to rise (<a onClick="return mV(\'1Cr\',6,13,14);">1Co 6:13,14</a>).<P>3. Continuity:<P>The relation of the matter in the present body to that in the resurrection body was a question Paul never raised. In <a onClick="return mV(\'1Cr\',6,13,14);">1Co 6:13,14</a> it appears that he thought of the body as something more than the sum of its organs, for the organs perish, but the body is raised. Nor does he discuss the eventual fate of the dead body. The imagery of <a onClick="return mV(\'1Th\',4,16,17);">1Th 4:16,17</a>; <a onClick="return mV(\'1Cr\',15,52);">1Co 15:52</a> is that of leaving the graves, and in the case of Christ\'s resurrection, the type of ours, that which was buried was that which was raised (<a onClick="return mV(\'1Cr\',15,4);">1Co 15:4</a>). Perhaps the thought is that the touch of the resurrection body destroys all things in the old body that are unadapted to the new state; perhaps there is an idea that the essence of the old body is what we might call "non-material," so that decay simply anticipates the work the resurrection will do. At all events, such reflections are "beyond what is written."<P>4. <a onClick="return mV(\'2Cr\',5,\'1-\');">2 Corinthians 5</a>:<P>A partial parallel to the idea of the resurrection body being already in heaven is found in Slavonic Enoch 22:8,9, where the soul receives clothing laid up for it (compare Ascension of <a onClick="return mV(\'Isa\',7,22,23);">Isaiah 7:22,23</a> and possibly <a onClick="return mV(\'Rev\',6,11);">Re 6:11</a>). But Christ also speaks of a reward being already in heaven (<a onClick="return mV(\'Mat\',5,12);">Mt 5:12</a>). A more important question is the time of the clothing in <a onClick="return mV(\'2Cr\',5,\'1-5\');">2Co 5:1-5</a>. A group of scholars (Heinrici, Schmiedel, Holtzmann, Clemen, Charles, etc.) consider that Paul has here changed his views from those of 1 Corinthians; that he now considers the resurrection body to be assumed immediately at death, and they translate <a onClick="return mV(\'2Cr\',5,2,3);">2Co 5:2,3</a> "\' we groan (at the burdens of life), longing to be clothed upon with our habitation which is from heaven\':because, when we shall be clothed with it, we shall have no more nakedness to experience" (Weizsacker\'s translation of the New Testament). But 2 Corinthians would have been a most awkward place to announce a change of views, for it was written in part as a defense against inconsistency (<a onClick="return mV(\'2Cr\',1,17);">1:17</A>, etc.). The willingness to be absent from the body (<a onClick="return mV(\'2Cr\',5,8);">5:8</A>) loses all its point if another and better body is to be given at once. The grammatical reasons for the interpretation above (best stated by Heinrici) are very weak. And the translation given reads into the verse something that simply is not there. Consequently it is far better to follow the older interpretation of Meyer (B. Weiss, Bousset, Lietzmann, Bachmann, Menzies, etc.; Bachmann is especially good) and the obvious sense of the passage: Paul dreads being left naked by death, but finds immediate consolation at the thought of being with Christ, and eventual consolation at the thought of the body to be received at the Parousia. (In <a onClick="return mV(\'Phl\',1,\'21-24\');">Php 1:21-24</a> this dread is overcome.)<P>Of a resurrection of the wicked, Paul has little to say. The doctrine seems clearly stated in <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a> (and in <a onClick="return mV(\'2Ti\',4,1);">2Ti 4:1</a>, unless the Pauline authorship of 2 Timothy is denied). But Paul is willing to treat the fate of the unrighteous with silence.<P>V. Summary.<P>1. New Testament Data:<P>The points in the New Testament doctrine of the resurrection of the righteous, then, seem to be these: The personality of the believer survives after death and is with Christ. But it is lacking in something that will be supplied at the consummation, when a body will be given in which there is nothing to hinder perfect intercourse with God. The connection of this body with the present body is not discussed, except for saying that some connection exists, with the necessity of a transformation for those alive at the end. In this state nothing remains that is inconsistent with the height to which man is raised, and in particular sexual relations (<a onClick="return mV(\'Mar\',12,25);">Mr 12:25</a>) and the processes of nutrition (<a onClick="return mV(\'1Cr\',6,13);">1Co 6:13</a>) cease. For this end the whole power of God is available. And it is insured by the perfect trust the believer may put in God and by the resurrection of Christ, with whom the believer has become intimately united. The unrighteous are raised for the final vindication of God\'s dealings in history. Two resurrections are found in <a onClick="return mV(\'Rev\',20,5,13);">Re 20:5,13</a> and quite possibly in <a onClick="return mV(\'1Th\',4,16);">1Th 4:16</a>; <a onClick="return mV(\'1Cr\',15,23,24);">1Co 15:23,24</a>. Hence, the phrase first resurrection.<P>See <a href="./study/isbe/search.html?string=JUDGMENT,+LAST">JUDGMENT, LAST</A>.<P>2. Interpretation:<P>Into the "blanks" of this scheme the believer is naturally entitled to insert such matter as may seem to him best compatible with his other concepts of Christianity and of philosophy. As is so often the case with passages in the Bible, the student marvels at the way the sacred writers were restrained from committing Christianity to metaphysical schemes that growth in human knowledge might afterward show to be false. But theologian must take care to distinguish between the revealed facts and the interpretation given them in any system that he constructs to make the doctrine conform to the ideas of his own time or circle—a distinction too often forgotten in the past and sometimes with lamentable results. Especially is it well to remember that such a phrase as "a purely spiritual immortality" rests on a metaphysical dualism that is today obsolete, and that such a phrase is hardly less naive than the expectation that the resurrection body will contain identically the material of the present body. We are still quite in the dark as to the relations of what we call "soul" and "body," and so, naturally, it is quite impossible to dogmatize. A. Meyer in his RGG article ("Auferstehung, dogmatisch") has some interesting suggestions. For an idealistic metaphysic, where soul and body are only two forms of God\'s thought, the resurrection offers no difficulties. If the body be regarded as the web of forces that proceed from the soul, the resurrection would take the form of the return of those forces to their center at the consummation. If "body" be considered to embrace the totality of effects that proceed from the individual, at the end the individual will find in these effects the exact expression of himself (Fechner\'s theory). Or resurrection may be considered as the end of evolution—the reunion in God of all that has been differentiated and so evolved and enriched. Such lines must be followed cautiously, but may be found to lead to results of great value.<P>In recent years the attention of scholars has been directed to the problem of how far the teachings of other religions assisted the Jews in attaining a resurrection doctrine. Practically only the Persian system comes into question, and here the facts seem to be these: A belief among the Persians in the resurrection of the body is attested for the pre-Christian period by the fragments of Theopompus (4th century BC), preserved by Diogenes Laertius and Aeneas of Gaza. That this doctrine was taught by Zoroaster himself is not capable of exact proof, but is probable. But on the precise details we are in great uncertainty. In the Avesta the doctrine is not found in the oldest part (the Gathas), but is mentioned in the 19th Yasht, a document that has certainly undergone post-Christian redaction of an extent that is not determinable. The fullest Persian source is the Bundahesh (30), written in the 9th Christian century. It certainly contains much very ancient matter, but the age of any given passage in it is always a problem. Consequently the sources must be used with great caution. It may be noted that late Judaism certainly was affected to some degree by the Persian religion (see Tob, especially), but there are so many native Jewish elements that were leading to a resurrection doctrine that familiarity with the Persian belief could have been an assistance only. Especially is it to be noted that the great acceptance of the doctrine lies in the post-Maccabean period, when direct Persian influence is hardly to be thought of.<P>See <a href="./study/isbe/search.html?string=ZOROASTRIANISM">ZOROASTRIANISM</A>.<P>LITERATURE.<P>The older works suffer from a defective understanding of the presuppositions, but Salmond, Christian Doctrine of Immortality, is always useful. Brown, The Christian Hope,1912,is excellent and contains a full bibliography. Charles, Eschatology, and article "Eschatology" in Encyclopedia Biblica are invaluable, but must be used critically by the thorough student, for the opinions are often individualistic. Wotherspoon\'s article "Resurrection" in DCG is good; Bernard\'s in HDB is not so good. On 1 Corinthians, Findlay or (better) Edwards; on 2 Corinthians, Menzies. In German the New Testament Theologies of Weiss, Holtzmann, Feine; Schaeder\'s "Auferstehung" in PRE3. On 1 Corinthians, Heinrici and J. Weiss in Meyer (editions 8 and 9); on 2 Corinthians, Bachmann in the Zahn series. On both Corinthian epistles Bousset in the Schriften des New Testament of J. Weiss (the work of an expert in eschatology), and Lietzmann in his Handbuch.`<a href="./study/isbe/search.html?string=BODY">BODY</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY+(old+testament+and+new+testament)">ESCHATOLOGY (OLD TESTAMENT AND NEW TESTAMENT)</a>; <a href="./study/isbe/search.html?string=FLESH">FLESH</a>; <a href="./study/isbe/search.html?string=SOUL">SOUL</a>; <a href="./study/isbe/search.html?string=SPIRIT">SPIRIT</a>`48';
isbe[7397]='Resurrection of Jesus Christ, The`1. First Proof: The Life of Jesus<P>2. Second Proof: The Empty Grave<P>3. Third Proof: Transformation of the Disciples<P>4. Fourth Proof: Existence of the Primitive Church<P>5. Fifth Proof: The Witness of Paul<P>6. Sixth Proof: The Gospel Record<P>7. Summary and ConClusion<P>8. Theology of the Resurrection<P>LITERATURE<HR /><P>The Resurrection has always been felt to be vital in connection with Christianity. As a consequence, opponents have almost always concentrated their attacks, and Christians have centered their defense, upon it. It is therefore of the utmost importance to give attention to the subject, as it appears in the New Testament. There are several converging lines of evidence, and none can be overlooked. Each must have its place and weight. The issues at stake are so serious that nothing must be omitted.<P>1. First Proof: The Life of Jesus:<P>The first proof is the life of Jesus Christ Himself. It is always a disappointment when a life which commenced well finishes badly. We have this feeling even in fiction; instinct demands that a story should end well. Much more is this true of Jesus Christ. A perfect life characterized by divine claims ends in its prime in a cruel and shameful death. Is that a fitting close? Surely death could not end everything after such a noble career. The Gospels give the resurrection as the completion of the picture of Jesus Christ. There is no real doubt that Christ anticipated His own resurrection. At first He used only vague terms, such as, "Destroy this Temple, and in three days I will raise it up." But later on He spoke plainly, and whenever He mentioned His death, He added, "The Son of man...must be raised the third day." These references are too numerous to be overlooked, and, in spite of difficulties of detail, they are, in any proper treatment of the Gospels, an integral part of the claim made for Himself by Jesus Christ (<a onClick="return mV(\'Mat\',12,\'38-40\');">Mt 12:38-40</a>; <a onClick="return mV(\'Mat\',16,21);">16:21</a>; <a onClick="return mV(\'Mat\',17,9,23);">17:9,23</a>; <a onClick="return mV(\'Mat\',20,19);">20:19</a>; <a onClick="return mV(\'Mat\',27,63);">27:63</a>; <a onClick="return mV(\'Mar\',8,31);">Mr 8:31</a>; <a onClick="return mV(\'Mar\',9,9,31);">9:9,31</a>; <a onClick="return mV(\'Mar\',10,34);">10:34</a>; <a onClick="return mV(\'Mar\',14,58);">14:58</a>; <a onClick="return mV(\'Luk\',9,22);">Lu 9:22</a>; <a onClick="return mV(\'Luk\',18,33);">18:33</a>; <a onClick="return mV(\'Jhn\',2,\'19-21\');">Joh 2:19-21</a>). His veracity is at stake if He did not rise. Surely the word of such a One must be given due credence. We are therefore compelled to face the fact that the resurrection of which the Gospels speak is the resurrection of no ordinary man, but of Jesus—that is of One whose life and character had been unique, and for whose shameful death no proper explanation was conceivable (Denhey, Jesus and the Gospel, 122f). Is it possible that, in view of His perfect truthfulness of word and deed, there should be such an anti-climax as is involved in a denial of His assurance that He would rise again (C.H. Robinson, Studies in the Resurrection, 30)? Consider, too, the death of Christ in the light of His perfect life. If that death was the close of a life so beautiful, so remarkable, so Godlike, we are faced with an insoluble mystery—the permanent triumph of wrong over right, and the impossibility of believing in truth or justice in the world (C.H. Robinson, op. cit., 36). So the resurrection is not to be regarded as an isolated event, a fact in the history of Christ separated from all else. It must be taken in close connection with what precedes. The true solution of the problem is to be found in that estimate of Christ which "most entirely fits in with the totality of the facts" (Orr, The Resurrection of Jesus, 14).<P>2. Second Proof: The Empty Grave:<P>Another line of proof is the fact of the empty grave and the disappearance of the body. That Jesus died and was buried, and that on the third morning the tomb was empty, is not now seriously challenged. The theory of a swoon and a recovery in the tomb is impossible, and to it Strauss "practically gives its deathblow" (Orr, op. cit., 43). At Christ\'s burial a stone was rolled before the tomb, the tomb was sealed, and a guard was placed before it. Yet on the third morning the body had disappeared, and the tomb was empty. There are only two alternatives. His body must have been taken out of the grave by human hands or else by superhuman power. If the hands were human, they must have been those of His friends or of His foes. If His friends had wished to take out His body, the question at once arises whether they could have done so in the face of the stone, the seal and the guard. If His foes had contemplated this action, the question arises whether they would seriously have considered it. It is extremely improbable that any effort should have been made to remove the body out of the reach of the disciples. Why should His enemies do the very thing that would be most likely to spread the report of His resurrection? As Chrysostom said, "If the body had been stolen, they could not have stolen it naked, because of the delay in stripping it of the burial clothes and the trouble caused by the drugs adhering to it" (quoted in Day, Evidence for the Resurrection, 35). Besides, the position of the grave-clothes proves the impossibility of the theft of the body (see Greek of <a onClick="return mV(\'Jhn\',20,6,7);">Joh 20:6,7</a>; <a onClick="return mV(\'Jhn\',11,44);">11:44</a>; Grimley, Temple of Humanity, 69, 70; Latham, The Risen Master; The Expository Times, XIII, 293f; XIV, 510). How, too, is it possible to account for the failure of the Jews to disprove the resurrection? Not more than seven weeks afterward Peter preached in that city the fact that Jesus had been raised. What would have been easier or more conclusive than for the Jews to have produced the dead body and silenced Peter forever? "The silence of the Jews is as significant as the speech of the Christians" (Fairbairn, Studies in the Life of Christ, 357).<P>The fact of the empty tomb with the disappearance of the body remains a problem to be faced. It is now admitted that the evidence for the empty tomb is adequate, and that it was part of the primitive belief (Foundations, 134, 154). It is important to realize the force of this admission, because it is a testimony to Paul\'s use of the term "third day" (see below) and to the Christian observance of the first day of the week. And yet in spite of this we are told that a belief in the empty tomb is impossible. By some writers the idea of resurrection is interpreted to mean the revival of Christ\'s spiritual influence on the disciples, which had been brought to a close by His death. It is thought that the essential idea and value of Christ\'s resurrection can be conserved, even while the belief in His bodily rising from the grave is surrendered (Orr, The Resurrection of Jesus, 23). But how can we believe in the resurrection while we regard the basis of the primitive belief in it as a mistake, not to say a fraud? The disciples found the tomb empty, and on the strength of this they believed He had risen. How can the belief be true if the foundation be false? Besides, the various forms of the vision-theory are now gradually but surely being regarded as inadequate and impossible. They involve the change of almost every fact in the Gospel history, and the invention of new scenes and conditions of which the Gospels know nothing (Orr, op. cit., 222). It has never been satisfactorily shown why the disciples should have had this abundant experience of visions; nor why they should have had it so soon after the death of Christ and within a strictly limited period; nor why it suddenly ceased. The disciples were familiar with the apparition of a spirit, like Samuel\'s, and with the resuscitation of a
