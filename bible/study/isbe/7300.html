isbe[7301]='Reba`re-bek\'-a (rebha\', "fourth part"; Septuagint: Codex Vaticanus Rhobe; Codex Alexandrinus Rhebek): One of the five chieftains of Midian who were slain by the Israelites, under Moses (<a onClick="return mV(\'Num\',31,8);">Nu 31:8</a>; <a onClick="return mV(\'Jos\',13,21);">Jos 13:21</a>). Like his comrades, he is termed a "king" in Numbers, but a "chief" or "prince" in Joshua.``1';
isbe[7302]='Rebekah`re-bek\'-a (ribhqah; Septuagint and New Testament Rhebekka, whence the usual English spelling Rebecca): Daughter of Bethuel and an unknown mother, grand-daughter of Nahor and Milcah, sister of Laban, wife of Isaac, mother of Esau and Jacob.<P>Her name is usually explained from the Arabic, rabqat, "a tie-rope for animals," or, rather, "a noose" in such a rope; its application would then by figure suggest the beauty (?) of her that bears it, by means of which men are snared or bound; The root is found in Hebrew only in the noun meaning "hitching-place" or "stall," in the familiar phrase "fatted calf" or "calf of the stall," and in view of the meaning of such names as Rachel and Eglah the name Rebekah might well mean (concrete for abstract, like riqmah, chemdah, etc.) a "tied-up calf" (or "lamb"?), one therefore peculiarly choice and fat.<P>Rebekah is first mentioned in the genealogy of the descendants of Nahor, brother of Abraham (<a onClick="return mV(\'Gen\',22,\'20-24\');">Ge 22:20-24</a>). In fact, the family is there carried down just so far as is necessary in order to introduce this woman, for whose subsequent appearance and role the genealogy is obviously intended as a preparation. All this branch of the family of Terah had remained in Aram when Abraham and Lot had migrated to Canaan, and it is at Haran, "the city of Nahor," that we first meet Rebekah, when in <a onClick="return mV(\'Gen\',24,\'1-\');">Genesis 24</a> she is made known to Abraham\'s servant at the well before the gate.<P>That idyllic narrative of the finding of a bride for Isaac is too familiar to need rehearsal and too simple to require comment. Besides, the substance both of that story and of the whole of Rebekah\'s career is treated in connection with the sketches of the other actors in the same scenes. Yet we note from the beginning the maiden\'s decision of character, which appears in every line of the narrative, and prepares the reader to find in subsequent chapters the positive, ambitious and energetic woman that she there shows herself.<P>Though the object of her husband\'s love (<a onClick="return mV(\'Gen\',24,67);">Ge 24:67</a>), Rebekah bore him no children for 20 years (<a onClick="return mV(\'Gen\',25,20,26);">Ge 25:20,26</a>). Like Sarah, she too was barren, and it was only after that score of years and after the special intercession of Isaac that God at length granted her twin sons. "The purpose of God according to election," as Paul expresses the matter in <a onClick="return mV(\'Rom\',9,11);">Ro 9:11</a>, was the cause of that strange oracle to the wondering, inquiring parents, "The elder shall serve the younger" (<a onClick="return mV(\'Gen\',25,23);">Ge 25:23</a>).<P>Whether because of this oracle or for some other reason, it was that younger son, Jacob, who became the object of his mother\'s special love (<a onClick="return mV(\'Gen\',25,28);">Ge 25:28</a>). She it was who led him into the deception practiced upon Isaac (<a onClick="return mV(\'Gen\',27,\'5-17\');">Ge 27:5-17</a>), and she it was who devised the plan for extricating Jacob from the dangerous situation into which that deception had brought him (<a onClick="return mV(\'Gen\',27,\'42-46\');">Ge 27:42-46</a>). When the absence of Jacob from home became essential to his personal safety, Rebekah proposed her own relations in Aram as the goal of his journey, and gave as motive the desirability of Jacob\'s marrying from among her kindred. Probably she did not realize that in sending her favorite son away on this journey she was sending him away from her forever. Yet such seems to have been the case. Though younger than Isaac, who was still living at an advanced age when Jacob returned to Canaan a quarter of a century later, Rebekah seems to have died during that term. We learn definitely only this, that she was buried in the cave of Machpelah near Hebron (<a onClick="return mV(\'Gen\',49,31);">Ge 49:31</a>).<P>Outside of Genesis, Rebekah is alluded to in Scripture only in the passage from Romans (<a onClick="return mV(\'Rom\',9,10,11,12);">9:10-12</a>) already cited. Her significance there is simply that of the wife of Isaac and the mother of two sons of such different character and destiny as Esau and Jacob. And her significance in Genesis, apart from this, lies in her contribution to the family of Abraham of a pure strain from the same eastern stock, thus transmitting to the founders of Israel both an unmixed lineage and that tradition of separateness from Canaanite and other non-Hebrew elements which has proved the greatest factor in the ethnological marvel of the ages, the persistence of the Hebrew people.``15';
isbe[7303]='Rebuke`re-buk\':As a verb "rebuke" is in the Old Testament the translation of ga\'ar and yakhach; another word, ribh, in <a onClick="return mV(\'Neh\',5,7);">Ne 5:7</a>, is in the Revised Version (British and American) translated "contended with." "Rebuke" (noun) is most frequently the translation of ge\'arah; also in the King James Version of cherpah (<a onClick="return mV(\'Isa\',25,8);">Isa 25:8</a>; <a onClick="return mV(\'Jer\',15,15);">Jer 15:15</a>, the Revised Version (British and American) "reproach"), and of a few other words signifying reproach, etc. "Rebuker" (mucar, literally, "correction," "chastisement") in <a onClick="return mV(\'Hsa\',5,2);">Ho 5:2</a> has the Revised Version margin "Hebrew \'rebuke.\'" In the New Testament "to rebuke" is most often the translation of epitimao (<a onClick="return mV(\'Mat\',8,26);">Mt 8:26</a>; <a onClick="return mV(\'Mat\',16,22);">16:22</a>; <a onClick="return mV(\'Mat\',17,18);">17:18</a>, etc.); also in the King James Version of elegcho, always in the Revised Version (British and American) rendered "reprove" (<a onClick="return mV(\'1Ti\',5,20);">1Ti 5:20</a>; <a onClick="return mV(\'Tts\',1,13);">Tit 1:13</a>; <a onClick="return mV(\'Tts\',2,15);">2:15</a>; <a onClick="return mV(\'Hbr\',12,5);">Heb 12:5</a>; <a onClick="return mV(\'Rev\',3,19);">Re 3:19</a>). Another word is epipletto (once, <a onClick="return mV(\'1Ti\',5,1);">1Ti 5:1</a>); "without rebuke" in <a onClick="return mV(\'Phl\',2,15);">Php 2:15</a> is in the Revised Version (British and American) "without blemish." On the other hand, the Revised Version (British and American) has "rebuke" for several words in the King James Version, as for "reprove" (<a onClick="return mV(\'2Ki\',19,4);">2Ki 19:4</a>; <a onClick="return mV(\'Isa\',37,4);">Isa 37:4</a>), "reproof" (<a onClick="return mV(\'Job\',26,11);">Job 26:11</a>; <a onClick="return mV(\'Pro\',17,10);">Pr 17:10</a>), "charged" (<a onClick="return mV(\'Mar\',10,48);">Mr 10:48</a>). In <a onClick="return mV(\'Isa\',2,4);">Isa 2:4</a>; <a onClick="return mV(\'Mic\',4,3);">Mic 4:3</a>, the English Revised Version has "reprove" for "rebuke," and in the margin "decide concerning," which is text in the American Standard Revised Version. In Ecclesiasticus 11:7 we have the wise counsel: "Understand first, and then rebuke" (epitimao).``185';
isbe[7304]='Recah`re\'-ka (rekhah; Codex Vaticanus Rhechab; Codex Alexandrinus Rhepha; the King James Version Rechah): In <a onClick="return mV(\'1Ch\',4,12);">1Ch 4:12</a> certain persons are described as "the men of Recah," but there is absolutely no information either about the place or its position.``1';
isbe[7305]='Receipt of Custom`re-set.`<a href="./study/isbe/search.html?string=CUSTOM">CUSTOM</a>`1';
isbe[7306]='Receiver`re-sev\'-er: Found in the King James Version (<a onClick="return mV(\'Isa\',33,18);">Isa 33:18</a>); but the Revised Version (British and American) substitutes "he that weighed the tribute." The Hebrew is shoqel, which means "one who weighs," "a weigher."``1';
isbe[7307]='Rechab; Rechabites`re\'-kab, rek\'-a-bits (rekhabh, rekhabhim): Rechab is the name of two men of some prominence in the Old Testament records:<P>(1) A Benjamite of the town of Beeroth, son of Rimmon (<a onClick="return mV(\'2Sa\',4,2);">2Sa 4:2</a>); he and his brother Baanah were "captains" of the military host of Ish-bosheth. On the death of Abner (<a onClick="return mV(\'2Sa\',3,30);">2Sa 3:30</a>) the two brothers treacherously entered Ish-bosheth\'s house, when at noon he was resting and helpless, beheaded him, and escaped with the head to David at Hebron (<a onClick="return mV(\'2Sa\',4,\'6-8\');">2Sa 4:6-8</a>). They expected to receive reward and honor from David for the foul deed, which left him without a rival for the throne of all Israel. But the just and noble-minded king ordered their immediate execution (<a onClick="return mV(\'2Sa\',4,\'9-12\');">2Sa 4:9-12</a>), as in the case of the Amalekite, who asserted that he had killed Saul (<a onClick="return mV(\'2Sa\',1,\'1-\');">2Sa 1</a>). For some reason the Beerothites left their own town and fled to Gittaim, another town in Benjamin, where they were still living when the Books of Samuel were written (<a onClick="return mV(\'2Sa\',4,3);">2Sa 4:3</a>).<P>(2) The more prominent of the men bearing this name was a Kenite (see <a href="./study/isbe/search.html?string=KENITES">KENITES</a>), a descendant of Hammath (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>). A part of the Kenite tribe joined the Israelites during the wilderness wanderings (<a onClick="return mV(\'Num\',10,\'29-32\');">Nu 10:29-32</a>; <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',4,17);">4:17</a>), becoming identified with the tribe of Judah, although Heber and Jael his wife were settled in Northern Palestine (<a onClick="return mV(\'Jdg\',4,17);">Jud 4:17</a>). Rechab was the ancestor or founder of a family, or order, in Israel known as the Rechabites, who at various times were conspicuous in the religious life of the nation. The most notable member of this family was Jehonadab (<a onClick="return mV(\'2Ki\',10,15,23);">2Ki 10:15ff, 23</a>), or Jonadab, as he is called in <a onClick="return mV(\'Jer\',35,\'1-\');">Jer 35</a>. Jehonadab was a zealous Yahweh-worshipper and took part with Jehu in the extirpation of Baal-worship and the house of Ahab. He set for his descendants a vow of asceticism: that they should drink no wine, nor plant fields or vineyards, nor build nor live in houses throughout their generations (<a onClick="return mV(\'Jer\',35,6,7);">Jer 35:6,7</a>). That must have been a singular feature in Palestinian life: the simple, nomadic life of this family from generation to generation in the midst of settled agricultural and industrial conditions! They followed this simple life in order to guard against the enervating tendencies of sensualism, and as a covenant of fidelity to Yahweh, to whom they wholly devoted themselves when they joined themselves to Israel. Jeremiah used the Rechabites, who had been driven into Jerusalem by Nebuchadnezzar\'s investment of the land, as an object-lesson to covenant-breaking Judah. The Rechabites, hungry and thirsty, refused wine when it was set before them, because of the command of their ancestor Jonadab (<a onClick="return mV(\'Jer\',35,\'8-10\');">Jer 35:8-10</a>); but Judah refused to heed Yahweh\'s commands or to keep His covenant (<a onClick="return mV(\'Jer\',35,14,15);">Jer 35:14,15</a>).<P>If the Rechab of <a onClick="return mV(\'Neh\',3,14);">Ne 3:14</a> is the same as this Kenite, then his descendant Malchijah, who assisted Nehemiah in rebuilding the wall of Jerusalem, may have abandoned the vow of his ancestors, for he was "ruler of the district of Beth-haccherem" (i.e. "house of the vineyard").``109';
isbe[7308]='Rechah`re\'-ka (rekhah).`<a href="./study/isbe/search.html?string=RECAH">RECAH</a>`1';
isbe[7309]='Reclining`re-klin\'-ing (<a onClick="return mV(\'Jhn\',13,23);">Joh 13:23</a>).`<a href="./study/isbe/search.html?string=MEALS">MEALS</a>; <a href="./study/isbe/search.html?string=TRICLINIUM">TRICLINIUM</a>`1';
isbe[7310]='Reconcile; Reconciliation`rek\'-on-sil, rek-on-sil-i-a\'-shun katallasso, katallage, also the compound form apokatallasso; once the cognate diallassomai is used in <a onClick="return mV(\'Mat\',5,24);">Mt 5:24</a>):<P>1. The Terms<P class="in15">(1) New Testament Usage<P class="in15">(2) Old Testament Usage<P class="in15">(3) Special Passage in <a onClick="return mV(\'1Sa\',29,4);">1 Samuel 29:4</a><P class="in15">(4) Usage in the Apocrypha<P>2. Non-doctrinal Passage—<a onClick="return mV(\'Mat\',5,24);">Matthew 5:24</a><P>3. Doctrinal Passages<P class="in15">(1) <a onClick="return mV(\'Rom\',5,\'1-\');">Romans 5</a><P class="in15">(2) <a onClick="return mV(\'2Cr\',5,\'18-20\');">2 Corinthians 5:18-20</a><P class="in15">(3) <a onClick="return mV(\'Eph\',2,16);">Ephesians 2:16</a><P class="in15">(4) <a onClick="return mV(\'Col\',1,\'20-22\');">Colossians 1:20-22</a><P>LITERATURE<HR /><P>1. The Terms:<P>(1) New Testament Usage.<P>In the last case, <a onClick="return mV(\'Mat\',5,24);">Mt 5:24</a>, the word is not used in a doctrinal sense, though its use is very helpful in considering the force of the other terms. All the other instances are in Paul\'s Epistles (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>; <a onClick="return mV(\'1Cr\',7,11);">1Co 7:11</a>; <a onClick="return mV(\'2Cr\',5,\'18-20\');">2Co 5:18-20</a>, the verb; <a onClick="return mV(\'Rom\',5,11);">Ro 5:11</a>; <a onClick="return mV(\'Rom\',11,15);">11:15</a>; <a onClick="return mV(\'2Cr\',5,18,19);">2Co 5:18,19</a>, the noun; <a onClick="return mV(\'Eph\',2,16);">Eph 2:16</a>; <a onClick="return mV(\'Col\',1,22);">Col 1:22</a>, the compound). The word "reconcile" has a double meaning and usage, and the context must in each case determine how it is to be taken. The great doctrine is the reconciliation of God and men, but the question to be decided is whether it is God who is reconciled to men, or men who are reconciled to God, and different schools of theology emphasize one side or the other. The true view embraces both aspects. The word "to reconcile" means literally to exchange, to bring into a changed relationship. Some maintain that it is only a change in the sinner that is intended, a laying aside of his enmity, and coming into peaceful relations with God. But that manifestly does not exhaust the meaning, nor is it in the great Pauline passages the primary and dominant meaning.<P>(2) Old Testament Usage.<P>The Old Testament usage does not materially help in the elucidation of the New Testament terms, for though the word occurs in a number of passages in the King James Version, it is in the Revised Version (British and American) generally changed to "atonement," which more accurately represents the Hebrew kaphar, which is generally rendered by "atonement," and by hilaskomai or exilaskomai in the Greek (In one passage of the New Testament (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>), the phrase "to make reconciliation" represents the Greek hilaskomai, and is better rendered in the Revised Version (British and American) by "to make propitiation.") The making atonement or propitiation is the basis of the reconciliation, the means of its accomplishment, and the fact that the translators of the King James Version sometimes rendered kaphar by "reconcile" shows that they understood reconciliation to have the Godward aspect. Whatever may be said of the nature of the atonement or propitiation in the old dispensation, it was something contemplated as appeasing or satisfying, or at least in some way affecting God so as to make Him willing, or render it possible for Him, to enter into, or abide in, gracious relations with men. In one passage in the Old Testament where "reconciliation" occurs (<a onClick="return mV(\'2Ch\',29,24);">2Ch 29:24</a>) it represents a different Hebrew word, but here the Revised Version (British and American) has changed it into "sin-offering," which is in harmony with the general meaning and usage of the Hebrew.<P>(3) Special Passage in <a onClick="return mV(\'1Sa\',29,4);">1 Samuel 29:4</a>.<P>There is yet another Hebrew word rendered "reconcile" in <a onClick="return mV(\'1Sa\',29,4);">1Sa 29:4</a>, and inasmuch as this passage in the Septuagint has as the equivalent of the Hebrew the Greek word diallasso, it is of some importance in guiding to the New Testament meaning. On one occasion when the Philistines gathered together to battle against Israel, David and his band of men accompanied Achish king of Gath to the muster-place. "The princes of the Philistines" did not at all appreciate the presence of "these Hebrews," and although Achish testified in favor of David\'s fidelity, they were very indignant, and demanded that David and his men be sent back, "lest in the battle he become an adversary to us: for wherewith should this fellow reconcile himself unto his lord? should it not be with the heads of these men?" The Hebrew is ratsah, which means "to be pleased with" or "to accept favorably," and the Hithpael form here used is "to make himself pleasing or acceptable," "to reconcile himself." But assuredly the Philistines\' idea of David reconciling himself to Saul was not that he should lay aside his enmity against Saul, and so become friends with him. The enmity was on Saul\'s side, and the thought of the princes was that David by turning against them in the battle would gratify Saul, and lead him to lay aside his enmity against David.<P>(4) Usage in the Apocrypha.<P>It may be noted that in 2Macc 5:20, katallage is used evidently of the Godward side: "And the place which was forsaken in the wrath of the Almighty was, at the reconciliation of the great Sovereign, restored again with all glory." The verb occurs in 2Macc 1:5 when again the Godward side seems intended, though not perhaps so certainly: "May God...hearken to your supplications, and be reconciled with you," and in 7:33: "If for rebuke and chastening our living Lord has been angered a little while, yet shall he again be reconciled with his own servants," and 8:29: "They besought the merciful Lord to be wholly reconciled with his servants." In these two, especially the last, it is unquestionably the laying aside of the divine displeasure that is meant.<P>2. Non-doctrinal Passage—<a onClick="return mV(\'Mat\',5,24);">Matthew 5:24</a>:<P>Before passing on to look at the great utterances in the Epistles, we may now look at the non-doctrinal passage referred to at the beginning. There is, indeed, another non-doctrinal instance in <a onClick="return mV(\'1Cr\',7,11);">1Co 7:11</a>, where the wife who has departed from her husband is enjoined either to "remain unmarried, or else be reconciled to her husband." But as it is indeterminate whether the wife or the husband is the offending party, and so which is the one to be influenced, the passage does not help us much. But <a onClick="return mV(\'Mat\',5,24);">Mt 5:24</a> is a very illuminating passage. Here as in the passage from 1 Samuel, the word used is diallasso, but it is practically identified in meaning with katallasso. The injunction is given by Christ to the one who is at variance with his brother, not to complete his offering until first he has been reconciled to his brother. But the whole statement shows that it is not a question of the one who is offering the gift laying aside his enmity against his brother, but the reverse. Christ says, "If therefore thou art offering thy gift at the altar, and there rememberest (not that thou hast a grudge against thy brother but) that thy brother hath aught against thee"—the brother was the offended one, he is the one to be brought round—"leave there thy gift before the altar, and go thy way, first be reconciled to thy brother, and then come and offer thy gift." Plainly it means that he should do something to remove his brother\'s displeasure and so bring about a reconciliation.<P>3. Doctrinal Passages:<P>(1) <a onClick="return mV(\'Rom\',5,\'1-\');">Romans 5</a>.<P>Turning now to <a onClick="return mV(\'Rom\',5,\'1-\');">Ro 5</a>, how stands the matter? Paul has been speaking of the blessed results of justification; one of these results is the shedding abroad of the love of God in the heart. Then he dwells upon the manifestation of that love in the death of Christ, a love that was displayed to the loveless, and he argues that if in our sinful and unloving state we were embraced by the love of God, a fortiori that love will not be less now that it has already begun to take effect. If He loved us when we were under His condemnation sufficiently to give His Son to die for our salvation, much more shall His love bestow upon us the blessings secured by that death. "Much more then, being now justified by his blood, shall we be saved from the wrath of God through him" (<a onClick="return mV(\'Rom\',5,9);">Ro 5:9</a>).<P>(a) The Fact of Divine Wrath:<P>It is well to note, then, that there is "wrath" on the part of God against sin and sinners. One of the key-thoughts of the apostle in this epistle is that "the wrath of God is revealed from heaven against all ungodliness and unrighteousness of men" (<a onClick="return mV(\'Rom\',1,18);">Ro 1:18</a>), and the coming day of judgment is "the day of wrath and revelation of the righteous judgment of God" (<a onClick="return mV(\'Rom\',2,5);">Ro 2:5</a>). And because of this stern fact, the gospel is a revelation not only of love, but specifically "a righteousness of God" (<a onClick="return mV(\'Rom\',1,17);">Ro 1:17</a>). And he shows that the essence of the gospel is found in the propitiatory death of the Lord Jesus Christ (<a onClick="return mV(\'Rom\',3,24,25,26);">Ro 3:24,25,26</a>), through whom alone can men who have been "brought under the judgment of God" (<a onClick="return mV(\'Rom\',3,19);">Ro 3:19</a>) find justification, salvation, deliverance from the wrath of God (<a onClick="return mV(\'Rom\',4,25);">Ro 4:25</a>; <a onClick="return mV(\'Rom\',5,\'1-6\');">5:1-6</a>). Of course it is not necessary to add that the wrath of God is not to be thought of as having any unworthy or capricious element in it—it is the settled opposition of His holy nature against sin.<P>(b) Reconciliation, Godward, as Well as Manward:<P>The apostle proceeds (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>): "For if, while we were enemies, we were reconciled to God through the death of his Son, much more, being reconciled, shall we be saved by his life." Now if, as many maintain, it is only the reconciliation on the manward side that is meant, that the manifested love led to the sinner laying aside his enmity, it would entirely reverse the apostle\'s argument. He is not arguing that if we have begun to love God we may reckon upon His doing so and so for us, but because He has done so much, we may expect Him to do more. The verse is parallel to the preceding, and the being reconciled is on the same plane as being justified; the being justified was God\'s action, and so is the reconciling. Justification delivers from "the wrath of God"; reconciliation takes effect upon enemies.<P>(c) The Meaning of the Word "Enemies":<P>The word "enemies" is important. By those who take the manward aspect of reconciliation as the only one, it is held that the word must be taken actively—those who hate God. But the passive meaning, "hatred of God," seems far the preferable, and is indeed demanded by the context. Paul uses the verb echthroi, "enemies," in <a onClick="return mV(\'Rom\',11,28);">Ro 11:28</a>, in antithesis to "beloved" of God, and that is the consistent sense here. The enemies are those who are the objects of the wrath of the previous verse. And when we were thus hated of God, the objects of His just displeasure on account of our sin, "we were reconciled to God by the death of his Son." God laid aside His enmity, and in the propitiatory death of Christ showed Himself willing to receive us into His favor.<P>(d) The Manward Side:<P>By this propitiation, therefore, the barrier was removed, and, God having assumed a gracious attitude toward the sinner, it is possible for the sinner now, influenced by His love, to come into a friendly relationship with God. And so in the second phrase, the two meanings, the Godward and the manward, may coalesce: "being reconciled, we shall be saved by his life." The reconciliation becomes mutual, for there is no kind of doubt that sinners are enemies to God in the active sense, and require to lay aside their hostility, and so be reconciled to Him. But the first step is with God, and the reconciliation which took place in the death of His Son could only be the Godward reconciliation, since at that time men were still uninfluenced by His love. But, perhaps, just because that first reconciliation is brought about through the divine love which provides the propitiation, the apostle avoids saying "God is reconciled," but uses the more indirect form of speech. The manward aspect is emphasized in the next verse, although the Godward is not lost sight of: "We also rejoice in God through our Lord Jesus Christ, through whom we have now received the reconciliation" (<a onClick="return mV(\'Rom\',5,11);">Ro 5:11</a>). It is therefore something that comes from God and does not proceed from man. God is the first mover; He makes the reconciliation as already indicated, and then the fruit of it is imputed to the believing sinner, and the very fact that our receiving the reconciliation, or being brought into a state of reconciliation; follows the being reconciled of <a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>, shows that the other is divine reconciliation as the basis of the human.<P>(2) <a onClick="return mV(\'2Cr\',5,\'18-20\');">2 Corinthians 5:18-20</a>.<P>(a) The Godward Aspect Primary:<P>In the same way the great passage in <a onClick="return mV(\'2Cr\',5,\'18-20\');">2Co 5:18-20</a> cannot be understood apart from the conception that there is a reconciliation on the divine side. There is unquestionably reference to the human side of the matter as well, but, as in Romans, the Godward aspect is primary and dominating: "All things are of God, who reconciled us to himself through Christ, and gave unto us the ministry of reconciliation." It might be possible to argue from the King James Version that this describes the process going on under gospel influences, men being brought into gracious relations with God, but the aorist of the Greek rightly rendered by the Revised Version (British and American), "who reconciled us to himself," points back to the historic time when the transaction took place. It cannot be simply the surrender of the sinner to God that is meant, though that comes as a consequence; it is a work that proceeds from God, is accomplished by God, and because of the accomplishment of that work it is possible for a ministry of reconciliation to be entrusted to men. To make this mean the human aspect of the reconciliation, it would be necessary unduly to confine it to the reconciliation of Paul and his fellow-workers, though even then it would be a straining of language, for there is the other historic act described, "and gave unto us the ministry of reconciliation." The plain meaning is that through Jesus Christ, God established the basis of agreement, removed the barrier to the sinner\'s approach to Himself, accomplished the work of propitiation, and, having done so, He entrusts His servants with the ministry of reconciliation, a ministry which, basing itself upon the great propitiatory, reconciling work of Christ, is directed toward men, seeking to remove their enmity, to influence them in their turn to be reconciled with God. This is more clearly set forth in the verse which follows, which in explaining the ministry of reconciliation says: "To wit, that God was in Christ reconciling the world unto himself, not reckoning unto them their trespasses." Here there can be no question that the historic Incarnation is meant, and the reconciling of the world can be nothing other than the objective work of atonement culminating in the cross. And in that transaction there can be no thought of the sinner laying aside his hostility to God; it is God in Christ so dealing with sin that the doom lying upon the guilty is canceled, the wrath is averted, propitiation is made.<P>(b) The Manward Side also Prominent:<P>God, in a word, enters into gracious relations with a world of sinners, becomes reconciled to man. This being done, gracious influences can be brought to bear upon man, the chief of which is the consideration of this stupendous fact of grace, that God has in Christ dealt with the question of sin. This is the substance of the "word of reconciliation" which is preached by the apostle. So he continues, "We are ambassadors therefore on behalf of Christ, as though God were entreating by us: we beseech you on behalf of Christ, be ye reconciled to God." Here is the human side. The great matter now is to get the sinner to lay aside his enmity, to respond to the gracious overtures of the gospel, to come into harmony with God. But that is only possible because the reconciliation in the Godward aspect has already been accomplished. If the first reconciliation, "the reconciliation of the world unto himself," had been the laying aside of human enmity, there could now be no point in the exhortation, "Be ye reconciled to God."<P>(3) <a onClick="return mV(\'Eph\',2,16);">Ephesians 2:16</a>.<P>The two passages where the compound word occurs are in complete harmony with this interpretation. <a onClick="return mV(\'Eph\',2,16);">Eph 2:16</a>: "And might reconcile them both (Jew and Gentile) in one body unto God through the cross, having slain the enmity thereby," is the outcome of Christ "making peace" (<a onClick="return mV(\'Eph\',2,15);">2:15</A>), and the reconciling work is effected through the cross, reconciliation both Godward and manward, and, having made peace, it is possible for Christ to come and preach peace to them that are far off—far off even though the reconciling work of the cross has been accomplished.<P>(4) <a onClick="return mV(\'Col\',1,\'20-22\');">Colossians 1:20-22</a>.<P>So in <a onClick="return mV(\'Col\',1,20);">Col 1:20</a>, "And through him to reconcile all things unto himself, having made peace through the blood of his cross; through him, I say, whether things upon the earth, or things in the heavens." Here the thought of the apostle trembles away into infinity, and there seems a parallel to the thought of <a onClick="return mV(\'Hbr\',9,23);">Heb 9:23</a>, that according to the typical teaching even "the things in the heavens" in some way stood in need of cleansing. May it be that the work of Christ in some sense affected the angelic intelligence, making it possible for harmony to be restored between redeemed sinners and the perfect creation of God? In any case, the reconciling all things unto Himself is not the laying aside of the creaturely hostility, but the determining of the divine attitude. Then comes the specific reference to the human side, "And you, being in time past alienated and enemies in your mind in your evil works, yet now hath he reconciled in the body of his flesh through death"; there, as in Romans, the two phases coalescing, God appearing gracious through the work of Christ, sinners coming into gracious relation with Him. "Having made peace through the blood of his cross," the ground of peace has been established. Christ has done something by His death which makes it possible to offer peace to men. God has laid aside His holy opposition to the sinner, and shows Himself willing to bring men into peace with Himself. He has found satisfaction in that great work of His Son, has been reconciled, and now calls upon men to be reconciled to Him—to receive the reconciliation.<P>LITERATURE.<P>See the works on New Testament Theology of Weiss, Schmid, Stevens, etc.; Denney, Death of Christ; articles on "Reconciliation" in Hastings, Dictionary of the Bible (five volumes), Hastings, Dictionary of Christ and the Gospels, etc.`<a href="./study/isbe/search.html?string=ATONEMENT">ATONEMENT</a>; <a href="./study/isbe/search.html?string=PROPITIATION">PROPITIATION</a>; <a href="./study/isbe/search.html?string=WRATH">WRATH</a>`110';
isbe[7311]='Record`rek\'-ord, rek\'-ord:<P>(1) The English word, where it occurs in the Old Testament and the New Testament in the sense of testimony, is translated in the Revised Version (British and American) "witness" (<a onClick="return mV(\'Deu\',30,19);">De 30:19</a>; <a onClick="return mV(\'Deu\',31,28);">31:28</a>; <a onClick="return mV(\'Jhn\',1,19,32);">Joh 1:19,32</a>; <a onClick="return mV(\'Jhn\',8,13,14);">8:13,14</a>; <a onClick="return mV(\'Rom\',10,2);">Ro 10:2</a>, etc.). See <a href="./study/isbe/search.html?string=WITNESS">WITNESS</A>. But in <a onClick="return mV(\'Job\',16,19);">Job 16:19</a> for the King James Version "my record," the Revised Version (British and American) has "he that voucheth for me."<P>(2) In <a onClick="return mV(\'Ezr\',4,15);">Ezr 4:15</a>; <a onClick="return mV(\'Ezr\',6,2);">6:2</a> (dokhran, dikhron), and <a onClick="return mV(\'Est\',6,1);">Es 6:1</a> (zikkaron), the word denotes Persian state chronicles; compare 1Macc 14:23; 2Macc 2:1.``1';
isbe[7312]='Recorder`re-kor\'-der (mazkir; the Revised Version margin "chronicler"): A high functionary in the court of the Jewish kings, part of whose duty seems to have been to chronicle the events of the reign, but who also occupied a position corresponding with that of the modern vizier (<a onClick="return mV(\'2Sa\',8,16);">2Sa 8:16</a>; <a onClick="return mV(\'2Sa\',20,24);">20:24</a>; <a onClick="return mV(\'1Ch\',18,15);">1Ch 18:15</a>, etc.). His high rank is shown by the facts that, with other officers, he represented Hezekiah in speaking with Rabshakeh (<a onClick="return mV(\'2Ki\',18,18);">2Ki 18:18</a>), and, in the reign of Josiah, superintended the repairs of the temple (<a onClick="return mV(\'2Ch\',34,8);">2Ch 34:8</a>).``1';
isbe[7313]='Recover`re-kuv\'-er: "Recover" has<P>(1) the transitive meaning of "to retake" or "regain" (anything); and<P>(2) the intransitive sense of "to regain health" or "become well."<P>In Judith 14:7 it means "restore to consciousness." In the former sense it is in the Old Testament the translation of natsal, "to snatch away" (<a onClick="return mV(\'Jdg\',11,26);">Jud 11:26</a>; <a onClick="return mV(\'1Sa\',30,8,22);">1Sa 30:8,22</a>; in <a onClick="return mV(\'Hsa\',2,9);">Ho 2:9</a>, the Revised Version (British and American) "pluck away"); also of shubh (Qal and Hiphil <a onClick="return mV(\'1Sa\',30,19);">1Sa 30:19</a> the King James Version; <a onClick="return mV(\'2Sa\',8,3);">2Sa 8:3</a>, etc.), and of various other words in single instances. In <a onClick="return mV(\'2Ki\',5,3,6,7,11);">2Ki 5:3,6,7,11</a>, "to restore to health" is \'acaph. In its intransitive sense "recover" is chiefly the translation of chayah, "to live," "revive" (<a onClick="return mV(\'2Ki\',1,2);">2Ki 1:2</a>, etc.; <a onClick="return mV(\'Isa\',38,9,21);">Isa 38:9,21</a>). "Recover" appears only twice in the King James Version of the New Testament; <a onClick="return mV(\'Mar\',16,18);">Mr 16:18</a> (for kalos hexousin) and <a onClick="return mV(\'2Ti\',2,26);">2Ti 2:26</a> (from ananepho, the Revised Version margin "Greek: \'return to soberness\' "); but the Revised Version (British and American) has "recover" for "do well" in <a onClick="return mV(\'Jhn\',11,12);">Joh 11:12</a> (sothesetai; margin "Greek: \'be saved\'"). "Recovering" (of sight) (anablepsis) occurs in <a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a>.``185';
