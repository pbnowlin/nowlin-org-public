estament. It will be seen from what has been said that notwithstanding the favorable attitude toward it of the eastern and western churches, from the earliest times, our Apocrypha was regarded with more or less suspicion, and the suspicion would be strengthened by the general antagonism toward it. In the Middle Ages, under the influence of Reuchlin (died 1532)—great scholar and Reformer—Hebrew came to be studied and the Old Testament read in its original language. The fact that the Apocrypha is absent from the Hebrew canon must have had some influence on the minds of the Reformers.<P>Moreover in the Apocrypha there are parts inconsistent with Protestant principles, as for example the doctrines of prayers for the dead, the intercession of the saints, etc. The Jews in the early Christian centuries had really two Bibles: (1) There was the Hebrew Bible which does not include the Apocrypha, and which circulated in Palestine and Babylon; (2) there was the Greek version (Septuagint) used by Greek-speaking Jews everywhere. Until in quite early times, instigated by the use made of it by Christians against themselves, the Jews condemned this version and made the Hebrew canon their Bible, thus rejecting the books of the Apocrypha from their list of canonical writings, and departing from the custom of Christian churches which continued with isolated remonstrances to make the Greek Old Testament canon, with which the Vulgate agrees almost completely, their standard. It is known that the Reformers were careful students of the Bible, and that in Old Testament matters they were the pupils of Jewish scholars—there were no other competent teachers of Hebrew. It might therefore have been expected that the Old Testament canon of the Reformers would agree in extent with that of the Jews and not with that of the Greek and Latin Christians. Notwithstanding the doubt which Ryle (Canon of the Old Testament, 156) casts on the matter, all the evidence goes to show that the Septuagint and therefore the other great Greek versions included the Apocrypha from the first onward.<P>But how comes it to be that the Greek Old Testament is more extensive than the Hebrew Old Testament? Up to the final destruction of Jerusalem in 71 AD the temple with its priesthood and ritual was the center of the religious thought and life of the nation. But with the destruction of the sanctuary and the disbanding of its officials it was needful to find some fresh binding and directing agency and this was found in the collection of sacred writings known by us as the Old Testament. By a national synod held at Jamnia, near Jaffa, in 90 AD, the Old Testament canon was practically though not finally closed, and from that date one may say that the limits of the Old Testament were once and for all fixed, no writings being included except those written in Hebrew, the latest of these being as old as 100 BC. Now the Jews of the Dispersion spoke and wrote Greek, and they continued to think and write long after their fellow-countrymen of the homeland had ceased to produce any fresh original literature. What they did produce was explanatory of what had been written and practical.<P>The Greek Bible—the Septuagint—is that of the Jews in Egypt and of those found in other Greek-speaking countries. John Wycliffe (died 1384) puts the Apocrypha together at the end of the Old Testament and the same course was taken by Luther (1546) in his great German and by Miles Coverdale (died 1568) in his English translation.<P>5. Hebrew Words for "Apocrypha":<P>Is it quite certain that there is no Hebrew word or expression corresponding exactly to the word "apocrypha" as first used by Christian writers, i.e. in the sense "esoteric"? One may answer this by a decisive negative as regards the Old Testament and the Talmud. But in the Middle Ages qabbalah (literally, "tradition") came to have \'a closely allied meaning (compare our "kabbalistic").<P>(1) Do such exist?<P>Is there in Hebrew a word or expression denoting "non-canonical," i.e. having the secondary sense acquired by "apocrypha"? This question does not allow of so decided an answer, and as matter of fact it has been answered in different ways.<P>(2) Views of Zahn, Schurer, Porter, etc. (ganaz, genuzim).<P>Zahn (Gesch. des neutest. Kanons, I, i, 123ff); Schurer (RE3, I, 623); Porter (HDB, I) and others maintain that the Greek word "Apocrypha (Biblia)" is a translation of the Hebrew Cepharim genuzim, literally, "books stored away." If this view is the correct one it follows that the distinction of canonical and non-canonical books originated among the Jews, and that the Fathers in using the word apocrypha in this sense were simply copying the Jews substituting Greek words for the Hebrew equivalent. But there are decisive reasons for rejecting this view.<P>(3) Reasons for Rejection.<P>(a) The verb ganaz of which the passive part. occurs in the above phrase means "to store away," "to remove from view"—of things in themselves sacred or precious. It never means to exclude as from the canon.<P>(b) When employed in reference to sacred books it is only of those recognized as canonical. Thus after copies of the Pentateuch or of other parts of the Hebrew Bible had, by age and use, become unfit to be read in the home or in the synagogue they were "buried" in the ground as being too sacred to be burnt or cut up; and the verb denoting this burying is ganaz. But those buried books are without exception canonical.<P>(c) The Hebrew phrase in question does not once occur in either the Babylonian or the Jerusalem Talmud, but only in rabbinical writings of a much later date. The Greek apocrypha cannot therefore be a rendering of the Hebrew expression. The Hebrew for books definitely excluded from the canon is Cepharim chitsonim = "outside" or "extraneous books." The Mishna (the text of the Gemara, both making up what we call the Talmud) or oral law with its additions came to be divided analogously into<P class="in15">(1) The Mishna proper;<P class="in15">(2) the external (chitsonah) Mishna: in Aramaic called Baraiytha\'.<P>6. Summary:<P>What has been said may be summarized:<P>(1) Among the Protestant churches the word "Apocrypha" is used for the books included in the Septuagint and Vulgate, but absent from the Hebrew Bible. This restricted sense of the word cannot be traced farther back than the beginning of the Reformation.<P>(2) In classical and Hellenistic Greek the adjective apokruphos denotes "hidden" of visible objects, or obscure, hard to understand (of certain kinds of knowledge).<P>(3) In early patristic Greek this adjective came into use as a synonym of the classical Greek esoterikos.<P>(4) In later patristic Greek (Irenaeus, etc.) and in Latin works beginning with Jerome, Greek apokruphos meant non-canonical, implying inferiority in subject-matter to the books in the canon.<P>(4) By the Protestant Reformers the term "apocrypha" ("apocryphal" "books" being understood) came to stand for what is now called the "Old Testament Apocrypha." But this usage is confined to Protestants, since in the eastern church and in the Roman branch of the western church the Old Testament Apocrypha is as much an integral part of the canon as Genesis or Kings or Psalms or Isaiah.<P>(5) There are no equivalents in Hebrew for apokruphos in the sense of either "esoteric" or in that of "non- canonical."<P>IV. Contents of the Apocrypha.<P>1. List of Books:<P>The following is a list of the books in the Apocrypha in the order in which they occur in the English versions (the King James Version and the Revised Version (British and American)):<P class="in15">(1) 1Esdras;<P class="in15">(2) 2Esdras (to be hereafter called "The Apocalyptic Esdras");<P class="in15">(3) Tobit;<P class="in15">(4) Judith;<P class="in15">(5) The Rest of Esther;<P class="in15">(6) The Wisdom of Solomon;<P class="in15">(7) Ecclesiasticus (to be hereafter called "Sirach");<P class="in15">(8) Baruch, with the Epistle of Jeremiah;<P class="in15">(9) The Song of the Three Holy Children;<P class="in15">(10) The History of Susanna;<P class="in15">(11) Bel and the Dragon;<P class="in15">(12) The Prayer of Manasses;<P class="in15">(13) 1Maccabees;<P class="in15">(14) 2Maccabees.<P>No. 5 in the above, "Addition to Esther;" as it may be called, consists of the majority (107 out of 270 verses) of the Book of Esther since it occurs in the best manuscripts of the Septuagint and in the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) over the text in the Hebrew Bible. These additions are in the Septuagint scattered throughout the book and are intelligible in the context thus given them, but not when brought together as they are in the collected Apocrypha of our English versions and as they are to some extent in Jerome\'s Latin version and the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) (see The Century Bible, Ezra, Nehemiah and Esther, 294f). <span class="noTag">Numbers 9-11</span> in the above enumeration are additions made in the Greek Septuagint and Vulgate versions of Daniel to the book as found in the Massoretic Text. It will be well to name them "Additions to Daniel." The bringing together of the writings of the Apocrypha into an apart collection was due in a large measure to Jerome, who separated many of the apocryphal additions from their original context because he suspected their genuineness. His version influenced the Vulgate, which follows Jerome\'s version closely.<P>Though it is generally true that the Apocrypha is the excess of the Greek (Septuagint) and Latin (Jerome, Vulgate) over the Hebrew Bibles (the Masoretic Text), the statement needs qualification. 2 (4) Ezra, i.e. the Apocalyptic Ezra (Esdras), is absent from the Septuagint, from Jerome\'s version, and also from Luther\'s Bible, but it occurs in the Vulgate and in the English and other modern versions of the Apocrypha. On the other hand 3 and 4 Macc occur in the best manuscripts of the Septuagint, but the Vulgate, following Jerome\'s version, rejects both as do modern versions (English, etc.) of the Apocrypha. Moreover, it has to be pointed out that in the Vulgate proper the Prayer of Manasses and 1 (3) Esdras and the Apocalyptic Esdras are appended to the New Testament as apocryphal.<P>2. Classification of Books:<P>(1) Historical.<P>The books of the Apocrypha proper may be thus classified:<P class="in15">(a) 1 and 2 (i.e. 3) Esdras;<P class="in15">(b) 1 and 2Maccabees;<P class="in15">(c) Additions to Daniel (nos. 9-11 in the above list);<P class="in15">(d) Additions to Esther;<P class="in15">(e) The Epistle of Jeremy (usually appended to Baruch);<P class="in15">(f) Prayer of Manasses.<P>(2) Legendary.<P class="in15">(a) Book of Baruch (sometimes classed with prophetic books, sometimes with Apocalypses);<P class="in15">(b) Tobit;<P class="in15">(c) Judith.<P>(3) Apocalyptic.<P>The Apocalyptic Esdras or 2 (4) Esdras.<P>(4) Didactic.<P class="in15">(a) The Wisdom of Solomon;<P class="in15">(b) Sirach (Ecclesiasticus).<P>R. H. Charles, our greatest living authority on the Apocalyptic and Apocryphal writings, embraces the following under the heading "Hellenistic Jewish Literature," the rest coming under the heading "Palestinian Jewish Literature" (Enc Brit, 11th edition, II, 177):<P class="in15">(1) The Additions to Daniel and Esther<P class="in15">(2) The Epistle of Jeremy;<P class="in15">(3) 2Macc;<P class="in15">(4) The Wisdom of Solomon.<P>V. Original Languages of the Apocrypha.<P>The bulk of the Apocrypha was written originally in the Greek language and existed at the first in that language alone. The following books were however written in Hebrew: Tobit, Judith, Sirach, Baruch (part probably in Greek), and 1Maccabees. In these cases some prefer regarding Aramaic as the original language in at least parts of the above books. For detailed information see under the several books.<P>VI. Date of the Apocryphal Writings.<P>The question of date as it applies to the separate books of the Apocrypha will be discussed in connection with the articles dealing with the several books. But a general statement regarding the extreme limits between which all the books were completed may safely be made. The oldest apocryphal book is Sirach, which in its original Hebrew form belongs to between 190-170 BC. In its Greek form the best modern scholars agree in fixing it at between 130-120 BC. None of the books can well belong to a date later than 100 AD, though some (2Esdras, etc.) may be as late as that. The whole of the Apocrypha may with more than average certainty be said to have been written some time between 200 BC and 100 AD. It will be seen that it is an inaccurate assumption that the Apocrypha was in all its parts of later date than the latest parts of the Old Testament. The canonical Book of Daniel and many of the Psalms are of later date than Sirach and 1Esdras, and there are cogent reasons for giving the canonical Esther a later date than any of the books named and perhaps than Judith as well (see, however, <a href="./study/isbe/search.html?string=DANIEL">DANIEL</a>; <a href="./study/isbe/search.html?string=ESTHER">ESTHER</a>). But it is quite certain that by far the greater part of the Apocrypha is of later date than the Old Testament; it is therefore of the utmost importance as reflecting the state of the Jews and the character of their intellectual and religious life at the various periods represented. And in later years much use has been made of it.<P>LITERATURE.<P>The Greek text of the Apocrypha is given in the various editions of the Septuagint (except the Apocalyptic Esdras, not extant in Gr). The best editions of the Septuagint are those by Tischendorf revised by E. Nestle (1887); and Swete (1895-99 and later editions). Critical editions of the Apocrypha have been issued by A. Fabricius (Hamburg, 1722-23); Apel (ib 1804) and a very valuable edition by O. T. Fritzsche (Leipzig, 1871) which includes the Latin version of the Apocalyptic Esdras—without the missing fragment. There are several modern translations, far the best being that in German edited by E. Kautzsch, containing Introductions, general and special, and valuable notes by the best German scholars. In English besides the Revised Version (British and American) there is the useful Variorum edition, edited by C. J. Ball. An English critical edition of the Apocrypha edited by R. H. Charles, with introductory notes, is now being printed at Oxford and will be very valuable.<P>The best commentary is that by O. F. Fritsche and C. L. W. Grimm, Kurzgef. Exeg. Handbuch, 1851-60; but the commentary by Bissell in Lange\'s Series of Commentaries and that edited by Wace, in the Speaker\'s Bible Series, are meritorious.<P>Introductory matter will be found in the various Bible Dictionaries under the word: see especially H. E. Ryle in DB (1893), Schurer (RE3), but especially in the valuable Introduction to the Old Testament in Greek, by H. B. Swete (1900), Hastings, Dictionary of the Bible (five volumes) (C. F. Porter), and R. H. Charles (Enc Brit11). See also the Einleitungen by Konig, Budde (A. Bertholet has written the part dealing with the Apocrypha), and Schurer, Geschichte, III, 1898 (Eng. translation, II, iii), where much literature is specified. For monographs on the several books of the Apocrypha or discussing special points, see the special articles.``33';
isbe[610]='Apocryphal Acts, General`a-pok\'-ri-fal akts:<P><b>A. GENERAL INTRODUCTION</b><P><b>I. THE MEANING OF "APOCRYPHAL"</b><P class="in15">1. Secret<P class="in15">2. False and Heretical<P class="in15">3. Extra-Canonical<P><b>II. GENERAL CHARACTERISTICS</b><P class="in15">1. Romance<P class="in15">2. The Supernatural<P class="in15">3. Sexual Asceticism<P class="in15">4. Heretical Teaching<P class="in15">5. Religious Feeling<P><b>III. ORIGIN</b><P class="in15">1. Reverence for Apostles<P class="in15">2. Pious Curiosity<P class="in15">3. Apostolic Authority Desired<P class="in15">4. Interests of Local Churches<P><b>IV. SOURCES</b><P class="in15">1. Canonical Acts<P class="in15">2. Traditions<P class="in15">3. Romances of Travel<P><b>V. ECCLESIASTICAL TESTIMONY</b><P class="in15">1. Eastern<P class="in15">2. Western<P class="in15">3. Photius<P class="in15">4. Ecclesiastical Condemnation<P><b>VI. AUTHORSHIP</b><P><b>VII. RELATIONSHIP OF DIFFERENT ACTS</b><P><b>VIII. VALUE</b><P class="in15">1. As History<P class="in15">2. As Records of Early Christianity<P><b>IX. INFLUENCE</b><P><b>LITERATURE</b><P><b>B. THE SEPARATE ACTS</b><P><b>I. ACTS OF PAUL</b><P><b>II. ACTS OF PETER</b><P><b>III. ACTS OF JOHN</b><P><b>IV. ACTS OF ANDREW</b><P><b>V. ACTS OF THOMAS</b><hr /><P>A. GENERAL INTRODUCTION<P>I. The Meaning of "Apocryphal."<P>As applied to early-Christian writings the term "apocryphal" has the secondary and conventional sense of "extra- canonical."<P>1. Secret:<P>Originally, as the etymology of the word shows (Greek apokrupto = "hide"), it denoted what was "hidden" or "secret." In this sense "apocryphal" was, to begin with, a title of honor, being applied to writings used by the initiated in esoteric circles and highly valued by them as containing truths miraculously revealed and kept secret from the outside world. Just as there were writings of this kind among the Jews, so there were in Christian circles, among Gnostic sects, apocrypha, which claimed to embody the deeper truths of Christianity, committed as a secret tradition by the risen Christ to His apostles.<P>2. False and Heretical:<P>When the conception of a catholic church began to take shape, it was inevitable that these secret writings should have been regarded with suspicion and have been ultimately forbidden, not only because they fostered the spirit of division in the church, but because they were favorable to the spread of heretical teaching. By a gradual and intelligible transference of ideas "apocryphal," as applied to secret writings thus discredited by the church, came to have the bad sense of spurious and heretical. In this sense the word is used both by Irenaeus and Tertullian.<P>3. Extra-Canonical:<P>Short of being stigmatized as false and heretical many books were regarded as unsuitable for reading in public worship, although they might be used for purposes of private edification. Chiefly under the influence of Jerome the term "apocryphal" received an extension of meaning so as to include writings of this kind, stress now being laid on their non-acceptance as authoritative Scriptures by the church, without any suggestion that the ground of non- acceptance lay in heretical teaching. It is in this wide sense that the word is used when we speak of "Apocryphal Acts." Although the Acts which bear this name had their origin for the most part in circles of heretical tendency, the description of them as "apocryphal" involves no judgment as to the character of their contents, but simply denotes that they are Acts which were excluded from the New Testament canon because their title or claims to recognition as authoritative and normative writings were not admitted by the church. This definition limits the scope of our investigation to those Acts which belong to the 2nd century, the Biblical Acts having secured their place as an authoritative scripture by the end of that century. See further, <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>.<P>II. General Characteristics.<P>The Apocryphal Acts purport to give the history of the activity of the apostles in fuller detail than the canonical Acts.<P>1. Romance:<P>The additions to the New Testament narrative found in them are highly flavored with romance and reveal an extravagant and unhealthy taste for the miraculous. Wonderful tales, the product of an exuberant fancy, often devoid of delicacy of feeling and always out of touch with reality, are freely heaped one upon the other. The apostles are no longer conceived as living on the ordinary levels of humanity; their human frailties, to which the canonical writers are not blind, have almost entirely disappeared; they walk through the world as men conversant with the mysteries of heaven and earth and possessed of powers to which no limit can be set. They have the power to heal, to exorcise demons, to raise the dead; and while marvelous deeds of that nature constantly recur, there are other miracles wrought by the apostles which remind one of the bizarre and non-moral prodigies of the Childhood Gospel of Thomas. A smoked fish is made to swim; a broken statue is made whole by the use of consecrated a wafer; a child of seven months is enabled to talk with a man\'s voice; animals receive the power of human speech.<P>2. The Supernatural:<P>The romantic character of the Apocryphal Acts is intensified by the frequent introduction of the supernatural. Angelic messengers appear in vision and in dream; heavenly voices are heard; clouds descend to hide the faithful in the hour of danger and lightnings smite their foes; the terrifying forces of Nature, earthquake, wind and fire, strike dismay into the hearts of the ungodly; and martyrs die transfigured in a blaze of unearthly glory. Especially characteristic of these Acts are the appearances of Christ in many forms; now as an old man, now as a comely youth, now as a child; but most frequently in the likeness of this or that apostle. (It is interesting to observe that Origen is familiar with a tradition that Jesus during His earthly life could change His appearance when and how He pleased, and gives that as a reason for the necessity of the traitor\'s kiss. Compare also <a onClick="return mV(\'Mar\',16,912);">Mr 16:9, 12</a>.)<P>3. Sexual Asceticism:<P>One must not suppose from the foregoing that the Apocryphal Acts with their profusion of romantic and supernatural details were designed merely to exalt the personality of the apostles and to satisfy the prevalent desire for the marvelous. They had a definite practical end in view. They were intended to confirm and popularize a type of Christianity in strong reaction against the world, in which emphasis was laid on the rigid abstinence from sexual relations as the chief moral requirement. This sexual asceticism is the dominant motif in all the Acts. The "contendings" of the apostles, their trials and their eventual martyrdom are in almost every case due to their preaching the sinfulness of conjugal life and to their success in persuading women to reject the society of their husbands. The Acts are penetrated throughout by the conviction that abstinence from marriage is the supreme condition of entering upon the highest life and of winning heaven. The gospel on its practical side is (to use the succinct expression of the Acts of Paul) "the word of God regarding abstinence and the resurrection."<P>4. Heretical Teaching:<P>Besides inculcating an ascetic morality the Apocryphal Acts show traces more or less pronounced of dogmatic heresy. All of them with the exception of the Acts of Paul represent a docetic view of Christ; that is to say, the earthly life of Jesus is regarded merely as an appearance, phantasmal and unreal. This docetic Christology is most prominent in the Acts of John, where we read that when Jesus walked no footprints were discernible; that sometimes when the apostle attempted to lay hold of the body of Jesus his hand passed through it without resistance; that when the crowd gathered round the cross on which to all appearance Jesus hung, the Master Himself had an interview with His disciple John on the Mount of Olives. The crucifixion was simply a symbolical spectacle; it was only in appearance that Christ suffered and died. Allied with the docetic Christology is a naive Modalism, according to which there is no clear distinction between the Father and the Son.<P>5. Religious Feeling:<P>In spite of the unfavorable impression created by the flood of miraculous and supernatural details, the pervading atmosphere of sexual asceticism and the presence of dogmatic misconception, it is impossible not to feel in many sections of the Apocryphal Acts the rapture of a great spiritual enthusiasm. Particularly in the Acts of John, Andrew and Thomas there are passages (songs, prayers, homilies), sometimes of genuine poetic beauty, which are characterized by religious warmth, mystic fervor and moral earnestness. The mystical love to Christ, expressed though it frequently is in the strange language of Gnostic thought, served to bring the Saviour near to men as the satisfaction of the deepest yearnings of the soul for deliverance from the dark power of death. The rank superstition and the traces of unconquered heathenism should not blind us to the fact that in the Apocryphal Acts we have an authentic if greatly distorted expression of the Christian faith, and that through them great masses of people were confirmed in their conviction of the spiritual presence and power of Christ the Saviour.<P>III. Origin.<P>The Apocryphal Acts had their origin at a time when the canonical Acts of the Apostles were not yet recognized as alone authoritative. Various motives contributed to the appearance of books dealing with the life and activity of the different apostles.<P>1. Reverence for Apostles:<P>Behind every variety of motive lay the profound reverence for the apostles as the authoritative depositories of Christian truth. In apostolic times the sole authority in Christian communities, outside Old Testament Scripture, was "the Lord." But as the creative period of Christianity faded into the past, "the apostles" (in the sense of the college of the Twelve, including Paul) were raised to a preeminent position alongside of Christ with the object of securing continuity in the credentials of the faith. The commandments of the Lord had been received through them (<a onClick="return mV(\'2Pe\',3,2);">2Pe 3:2</a>). In the Ignatian epistles they have a place of acknowledged supremacy by the side of Christ. Only that which had apostolic authority was normative for the church. The authority of the apostles was universal. They had gone into all the world to preach the gospel. They had, according to the legend referred to at the beginning of the Acts of Thomas, divided among themselves the different regions of the earth as the spheres of their activity. It was an inevitable consequence of the peculiar reverence in which the apostles were held as the securities for Christian truth that a lively interest should everywhere be shown in traditional stories about their work and that writings should be multiplied which purported to give their teaching with fullness of detail.<P>2. Pious Curiosity:<P>The canonical Acts were not calculated to satisfy the prevailing desire for a knowledge of the life and teaching of the apostles. For one thing many of the apostles are there ignored, and for another the information given about the chief apostles Peter and Paul is little more than a meager outline of the events of their life. In these circumstances traditions not preserved in the canonical Acts were eagerly accepted, and as the actual history of the individual apostles was largely shrouded in obscurity, legends were freely invented to gratify the insatiable curiosity. The marvelous character of these inventions is a testimony to the supernatural level to which the apostles had been raised in popular esteem.<P>3. Apostolic Authority Desired:<P>As in the case of the apocryphal Gospels, the. chief motive in the multiplication of apostolic romances was the desire to set forth with the full weight of apostolic authority conceptions of Christian life and doctrine which prevailed in certain circles.<P>(1) Alongside the saner and catholic type of Christianity there existed, especially in Asia Minor, a popular Christianity with perverted ideals of life. On its practical side the Christian religion was viewed as an ascetic discipline, involving not only abstinence from animal food and wine but also (and chiefly) abstinence from marriage. Virginity was the Christian ideal. Poverty and fastings were obligatory on all. The Apocryphal Acts are permeated by this spirit, and their evident design is to confirm and spread confidence in this ascetic ideal by representing the apostles as the zealous advocates of it.<P>(2) The Apocryphal Acts were also intended to serve a dogmatic interest. Heretical sects used them as a means of propagating their peculiar doctrinal views and sought to supplement or supplant the tradition of the growing catholic church by another tradition which claimed to be equally apostolic.<P>4. Interests of Local Churches:<P>A subsidiary cause in the fabrication of apostolic legends was the desire of churches to find support for the claims which they put forward for an apostolic foundation or for some connection with apostles. In some cases the tradition of the sphere of an apostle\'s activity may have been well based, but in others there is a probability that stories of an apostolic connection were freely invented for the purpose of enhancing the prestige of some local church.<P>IV. Sources.<P>In general it may be said that the Apocryphal Acts are full of legendary details. In the invention of these everything was done to inspire confidence in them as historically true.<P>1. Canonical Acts:<P>The narratives accordingly abound in clear reminiscences of the canonical Acts. The apostles are cast into prison and are marvelously set at liberty. Converts receive the apostles into their houses. The description of the Lord\'s Supper as "the breaking of bread" (<a onClick="return mV(\'Act\',2,42,46);">Ac 2:42, 46</a>) is repeated in the Apocryphal Acts and is strictly apposite to the ritual there set forth in which there is frequently no mention of wine in the celebration of the sacrament. In the Acts of Paul the author evidently used the canonical Acts as the framework of his narrative. This dependence on the canonical Acts and the variety of allusions to details in them served to give an appearance of historical truthfulness to the later inventions and to secure for them a readier acceptance. The fact that the canonical Acts were so used clearly shows that they had a position of exceptional authority at the time when the Apocryphal Acts were written.<P>2. Traditions:<P>The legendary character of the Apocryphal Acts does not preclude the possibility of authentic details in the additions made to the canonical history. There must have been many traditions regarding the apostles preserved in Christian communities which had a foundation in actual fact. Some of these would naturally find a place in writings which were designed in part at least to satisfy the popular curiosity for a fuller knowledge of the apostles. It is certain that there is some substratum of historical fact in the episode of Paul\'s association with Thecla (Acts of Paul). The description of Paul\'s appearance given in the same connection is in all likelihood due to trustworthy historical reminiscence. But it must be confessed that the signs of the presence of reliable traditions are very scanty. The few grains of historical fact are hidden in an overwhelming mass of material whose legendary character is unmistakable.<P>3. Romances of Travel:<P>Although a formal connection with the canonical Acts is recognizable and reliable traditions are to a slight extent incorporated in the Apocryphal Acts, it is unquestionable that as a whole they are the creation of the Hellenic spirit which reveled in the miraculous. A noteworthy type of popular literature whose influence is apparent on almost every page of the Apocryphal Acts was that of the travel-romance. The most famous example of this romantic literature is the Life of the neo-Pythagorean preacher, the great wonder-worker Apollonios of Tyana, who died about the end of the 1st century AD. The marvelous deeds reported to have been wrought by him on his travels were freely transferred in a somewhat less striking form to other teachers. It is in the atmosphere of these romances that the Apocryphal Acts had their birth. In particular the Acts of Thomas recall the history of Apollonios. For just as Thomas was a missionary in India, so "Apollonios as a disciple of Pythagoras had traveled, a peaceful Alexander, to the Indian wonderland and there preached his master\'s wisdom" (Geffcken, Christliche Apokryphen, 36).<P>V. Ecclesiastical Testimony.<P>From the nature of his reference to the canonical Acts it is probable that the writer of the Muratorian Canon (circa 190 AD) had the existence of other Acts in mind. "The Acts of all the apostles," he says, "are written in a single book. Luke relates them admirably to Theophilus, confining himself to such as fell under his own notice, as he plainly shows by the omission of all reference either to the martyrdom of Peter or to the journey of Paul from Rome to Spain." During the 3rd century there are slight allusions to certain of the Apocryphal Acts, but it is only in the 4th century that distinct references are frequent in writers both of the East and of the West. A few of the more important references may be given here. (For a full account of the ecclesiastical testimony see Harnack, Gesch. der altchr. Lit., I, 116ff.)<P>1. Eastern:<P>Among eastern writers Eusebius (died 340) is the first to make any clear reference to Apocryphal Acts. He speaks of "Acts of Andrew, of John and of the other apostles," which were of such a character that no ecclesiastical writer thought it proper to invoke their testimony. Their style and their teaching showed them to be so plainly of heretical origin that he would not put them even among spurious Scriptures, but absolutely rejected them as absurd and impious (Historia Ecclesiastic, III, 25.6.7). Ephraem (died 373) declares that Acts were written by the Bardesanites to propagate in the name of the apostles the unbelief which the apostles had destroyed. Epiphanius (circa 375) repeatedly refers to individual Acts which were in use among heretical sects. Amphilochius of Iconium, a contemporary of Epiphanius, declares that certain writings emanating from heretical circles were "not Acts preserved, dealt with apocryphal literature and had under special consideration the Acts of John to which the Iconoclasts appealed. In the synod\'s finding these Acts were characterized as "this abominable book," and on it the judgment was passed: "Let no one read it; and not only so, but we judge it worthy of being committed to the flames."<P>2. Western:<P>In the West from the 4th century onward references are frequent. Philastrius of Brescia (circa 387) testifies to the use of Apocryphal Acts among the Manicheans, and declares that although they are not suitable for general reading they may be read with profit by mature Christians (De Haeres, 88). The reason for this favorable judgment is to be found in the pronounced ascetic tendency of the Acts, which was in line with the moral ideal prevalent at that time in the West. Augustine refers repeatedly to apocryphal Acts in use among the Manicheans and characterizes them as the work of "cobblers of fables" (sutoribus fabularum). The Manicheans accepted them as true and genuine; ú and in respect of this claim Augustine says: "They would in the time of their authors have been counted worthy of being welcomed to the authority of the Holy Church, if saintly and learned men who were then alive and could examine such things had acknowledged them as speaking the truth" (Contra Faustum, XXII, 79). The Acts of John and the Acts of Thomas are mentioned by Augustine by name. He also refers to Leucius as the author of Apocryphal Acts. Turribius of Astorga (circa 450) speaks of Acts of Andrew, of John, of Thomas, and attributes them to the Manicheans. Of the heretical teaching in the Acts of Thomas, Turribius singles out for special condemnation baptism by oil instead of by water. Leucius is mentioned as the author of the Acts of John. The Acts of Andrew, Thomas, Peter, and Philip are condemned as apocryphal in the Gelasian Decree (496 AD) and in the same condemnation are included "all books written by Leucius, a disciple of the devil."<P>3. Photius:<P>The fullest and most important reference to the Apocryphal Acts is found in Photius, the Patriarch of Constantinople in the second half of the 9th century. In his Bibliotheca, which contains an account of 280 different books which he had read during his absence on a mission to Bagdad, we learn that among these was a volume, "the so-called Wanderings of the Apostles, in which were included Acts of Peter, John, Andrew, Thomas, Paul. The author of these Acts, as the book itself makes plain, was Leucius Charinus." The language had none of the grace which characterized the evangelic and apostolic writings. The book teemed with follies and contradictions. Its teaching was heretical. In particular it was taught that Christ had never really become man. Not Christ but another in His place had been crucified. After referring to the ascetic doctrine and the absurd miracles of the Acts and to the part which the Acts of John had played in the Iconoclastic Controversy, Photius concludes: "In short this book contains ten thousand things which are childish, incredible, ill-conceived, false, foolish, inconsistent, impious and godless. If anyone were to call it the fountain and mother of all heresy, he would not be far from the truth."<P>4. Ecclesiastical Condemnation:<P>There is thus a consensus of ecclesiastical testimony as to the general character of the Apocryphal Acts. They were writings used by a number of heretical sects but regarded by the church as unreliable and harmful. It is probable that the corpus of the Acts in five parts referred to by Photius was formed by the Manicheans of North Africa, who attempted to have them accepted by the church in place of the canonical Acts which they had rejected. These Acts in consequence were stamped by the church with a heretical character. The sharpest condemnation is that pronounced by Leo I (circa 450) who declares that "they should not only be forbidden but should be utterly swept away and burned. For although there are certain things in them which seem to have the appearance of piety, yet they are never free of poison and secretly work through the allurements of fables so that they involve in the snares of every possible error those who are seduced by the narration of marvelous things." The Acts of Paul, which show no trace of dogmatic heresy, were included in the ecclesiastical censure owing to the fact that they had received a place at the end of the corpus. Many teachers in the church, however, made a distinction between the miraculous details and the heretical doctrines of the Acts, and while they rejected the latter they retained the former. Witness the words of an orthodox reviser in regard to his heretical predecessor: "Quaedam de virtutibus quidem et miraculls quae per eos Dominus fecit, vera dixit; de doctrina vero multa mentitus est."<P>VI. Authorship.<P>In the notice of Photius (Bibliotheca codex 114) all the five Acts are ascribed to one author, Leucius Charinus. Earlier writers had associated the name of Leucius with certain Acts. In particular he is, on the witness of several writers, declared to be the author of the Acts of John. As these Acts show, the author professes to be a follower and companion of the apostle, and Epiphanius (Haeres., 51 6) mentions one named Leucius as being in the entourage of John. This notice of Epiphanius, however, is of doubtful value, as it probably rested on the association in his mind of the name of Leucius with the Acts of John. Whether or not there is any truth in the ascription of these Acts to a disciple of John must be left undecided, but the probabilities are against there being any. Be that as it may, when the different Acts were collected, the name of the reputed author of the Acts of John was transferred to the whole collection. This probably happened not later than the 4th century. Although all the Acts are certainly not from one hand (the difference of style is sufficient proof of this), there are so many striking similarities between some of them as to suggest a possible common authorship in those cases or at least a relation of literary dependence.<P>VII. Relationship of Different Acts.<P>That some connection existed between the different Acts was clearly recognized in early times, and it was doubtless due to this recognition that they were gathered together in a corpus under the name of one author. It is acknowledged that there is a close relationship between the Acts of Peter and the Acts of John, some holding that they are the work of the same author (James, Zahn), others that the former are dependent on the latter (Schmidt, Hennecke), while others again believe that their origin in the same theological school and in the same ecclesiastical atmosphere sufficiently explains all similarities (Ficker). The Acts of Andrew, too, reveal a near kinship to the Acts of Peter. But however the matter may stand in regard to literary dependence, the affinity between the different Acts in a material sense is manifest. All are pervaded by the ascetic spirit; in all Christ appears in the form of the apostle; in all women visit the apostle in prison. In respect of theological doctrine the Acts of Paul stand by themselves as anti-Gnostic in tendency, but the others agree in their docetic view of Christ\'s person; while in the Acts of John, Peter and Thomas, there is a similar mystical doctrine of the cross.<P>VIII. Value.<P>1. As History:<P>As a source for information about the life and work of the apostles the Apocryphal Acts are almost entirely worthless. A possible exception in this respect is the section of the Acts of Paul dealing with Paul and Thecla, although even there any historical elements are almost lost in the legendary overgrowth. The spheres of the apostles\' work, so far as they are mentioned only in these Acts, cannot be accepted without question, although they may be derived from reliable tradition. Taken as a whole the picture given in the Apocryphal Acts of the missionary labors of the apostles is a grotesque caricature.<P>2. As Records of Early Christianity:<P>The Apocryphal Acts, however, though worthless as history, are of extreme value as throwing light on the period in which they were written. They belong to the 2nd century and are a rich quarry for information about the popular Christianity of that time. They give us a vivid picture of the form which Christianity assumed in contact with the enthusiastic mystery-cults and Gnostic sects which then flourished on the soil of Asia Minor. We see in them the Christian faith deeply tinged with the spirit of contemporary paganism; the faith in Christ the Saviour-God, which satisfied the widespread yearning for redemption from the powers of evil, in association with the as yet unconquered elements of its heathen environment.<P>(1) The Acts show us popular Christianity under the influence of Gnostic ideas as contrasted with the Gnosticism of the schools which moves in a region of mythological conceptions, cold abstractions and speculative subtleties. At the basis of Gnosticism lay a contempt for material existence; and in the Christianity of the Apocryphal Acts we see the practical working up of the two chief ideas which followed from this fundamental position, a docetic conception of Christ\'s person and an ascetic view of life. In this popular religion Christ had few of the features of the historic Jesus; He was the Saviour-God, exalted above principalities and powers, through union with whom the soul was delivered from the dread powers of evil and entered into the true life.<P>The manhood of Christ was sublimated into mere appearance; and in particular the sufferings of Christ were conceived mystically and symbolically, "sometimes in the form that in the story of His sufferings we see only the symbol of human sufferings in general; sometimes in the form that Christ who is present in His church shares in the martyr-sufferings of Christians; sometimes, again, in the form that the sin, weakness and unfaithfulness of His people inflict upon Him ever-renewed sufferings" (Pfleiderer, Primitive Christianity, III, 181). The ethical influence of Gnosticism is apparent in the spirit of strict asceticism which is the most characteristic feature of these Acts. It is true that the ascetic ideal obtained not only in Gnostic but also in orthodox church circles, as we gather from the Acts of Paul as well as from other sources.<P>The prominence of the strict ascetic ideal in early Christianity is intelligible. The chief battle which the Christian faith had to fight with Hellenic heathenism was for sexual purity, and in view of the coarseness and laxity which prevailed in sexual relations it is not surprising that the Christian protest was exaggerated in many cases into a demand for complete continence. This ascetic note in primitive Christianity was emphasized by the spirit of Gnosticism and finds clear expression in the Acts which arose either in Gnostic circles or in an environment tinged with Gnostic ideas. It goes without saying that the influence of these romances which are so largely concerned with sexual morality and occasionally are unspeakably coarse, was to preoccupy the mind with unhealthy thoughts and to sully that purity of spirit which it was their intention to secure. There are, however, other ethical elements in these Acts which are in complete harmony with a true Christian morality.<P>(2) The Apocryphal Acts are an invaluable source for information about early-Christian forms of worship. The ritual of the sacraments is fully described in the Acts of Thomas. Some of the prayers found in the Acts are pervaded by a warm religious spirit and are rich in liturgical expression.<P>(3) The beginnings of Christian hymnology may be traced in the Acts of Thomas, in which occur Gnostic hymns breathing the fantastic oriental spirit. (4) Apparent in the Acts throughout is the excessive love for the supernatural and the religious enthusiasm which flourished in Asia Minor in the 2nd century (compare especially the dance of the disciples round Jesus in the Acts of John: chapter 94ff).<P>IX. lnfluence.<P>The Apocryphal Acts had a remarkable influence in the later history of the church. After the establishment of Christianity under Constantine men turned their eyes to the earlier years of struggle and persecution. A deep interest was awakened in the events of the heroic age of the faith—the age of martyrs and apostles. Acts of martyrs were eagerly read, and in particular the Apocryphal Acts were drawn upon to satisfy the desire for a fuller knowledge of the apostles than was afforded by the canonical books. The heretical teaching with which the apostolic legends were associated in these Acts led to their condemnation by ecclesiastical authority, but the ban of the church was unavailing to eradicate the taste for the vivid colors of apostolic romance. In these circumstances church writers set themselves the task of rewriting the earlier Acts, omitting what was clearly heretical and retaining the miraculous and supernatural elements. And not only so, but the material of the Acts was freely used in the fabrication of lives of other apostles, as we find in the collection of the so-called Abdias in the 6th century.<P>The result was that from the 4th to the 11th century literature of this kind, dealing with the apostles, grew apace and "formed the favorite reading of Christians, from Ireland to the Abyssinian mountains and from Persia to Spain" (Harnack). Apostolic legends were reproduced in religious poems; they appeared in martyrologies and calendars; they formed the subject of homilies on the feast-days of the apostles, and incidents from them were depicted in Christian art. New cycles of legends arose in the Syrian and Coptic churches; and the Coptic legends were translated into Arabic and from Arabic into Ethiopic (Gadla Hawaryat—The Contendings of the Apostles). Literature of this kind was the fruitful mother of every kind of superstition. "Whole generations of Christians (as Harnack says), yes, whole Christian nations were intellectually blinded by the dazzling appearance of these tales. They lost the eye not only for the true light of history but also for the light of truth itself" (Gesch. der altchr. Lit., I, xxvi). It is noteworthy that the apocryphal correspondence with the Corinthians in the Acts of Paul was received as canonical in the Syrian and Armenian churches.<P>LITERATURE.<P>The Apocryphal Acst form the subject of a voluminous literature. The earlier editions of the available texts by Fabricius (1703) and Tischendorf (1851) have been completely superseded by Lipsius-Bonnet, Acta Apostolorum apocrypha (1891-1903), which contains texts not only of the earlier but also of many of the later Acts. Translations of earlier Acts with valuable introductions are to be found in Hennecke, New Testament Apokryphen (1904), while critical discussions and elucidation of the text are given in Hennecke, Handbuch zu den New Testament Apokryphen (1904). These two works are indispensable to the student. English translations of earlier Acts with short introductions in Pick, Apocryphal Acts (1909).<P>The critical work of Lipsius on these Acts was epoch-making: Die apokryphen Apostelgeschichten und Apostellegenden (1883-90). Full lists of literature may be found in Hennecke and Pick. The following may be mentioned here: Zahn, Geschichte des New Testament Kanons, II, 832f (1892); Forschungen zur Gesch. des New Testament Kanons, VI, 14f; 194f (1900); Harnack, Geschichte der altchristlichen Literatur, I, 116f (1893); II, 493ff, 541f (1897); James, Apocrypha Anecdota (Texts and Studies, V,1,1897); Ehrhard, Die altchristliche Litteratur u. i. Erforsch. (1900); C. Schmidt, "Die Alten Petrusakten" (T U, IX,1,1903). Useful as setting forth the religious significance of the Acts are Pfleiderer, Primitive Christianity, III, 170f (translation 1910); Liechtenhahn, Die Offenbarung im Gnosticismus (1901). The chapter in Salmon\'s Introduction to the New Testament (325f) may be consulted. A short account of the Acts written with full knowledge is given in Geffcken, Christliche Apokryphen (Religionssgeschichtliche Volksbucher, 1908).``1';
isbe[611]='Apocryphal Acts, the Separate Acts`B. <a href="./study/isbe/search.html?string=THE+SEPARATE+ACTS"></a>THE SEPARATE ACTS<P>The Apocryphal Acts dealt with in this article are the Leucian Acts mentioned by Photius in his Bibliotheca. As we now have them they have undergone revision in the interest of ecclesiastical orthodoxy, but in their original form they belonged to the 2nd century. It is impossible to say how much the Acts in their present form differ from that in which they originally appeared, but it is evident at many points that the orthodox revision which was meant to eliminate heretical elements was not by any means thorough. Passages which are distinctly Gnostic were preserved probably because the reviser did not understand their true meaning.<P>I. Acts of Paul.<P>1. Ecclesiastical Testimony:<P>Origen in two passages of his extant writings quotes the Acts of Paul with approval, and it was possibly due to his influence that these Acts were held in high regard in the East. In the Codex Claromontanus (3rd century), which is of eastern origin, the Acts of Paul are treated as a catholic writing and take rank with the Shepherd of Hermas and the Apocalypse of Peter. Eusebius, who utterly rejects "The Acts of Andrew, John and the rest of the apostles," puts the Acts of Paul in the lower class of debated writings alongside Hermas, Epistle of Barnabas, Didache, the Apocalypse of John, etc. (Historia Ecclesiastica, III, 25.4). In the West, where Origen was viewed with suspicion, the Acts of Paul were apparently discredited, the only use of them as a reliable source being found in Hippolytus, the friend of Origen, who however does not mention them by name. (The reference by Hippolytus is found in his commentary on Daniel. He argues from Paul\'s conflict with the wild beasts to the credibility of the story of Daniel in the lions\' den.)<P>2. Contents:<P>Of the Acts of Paul only fragments remain. Little was known of them until in 1904 a translation from a badly preserved Coptic version was published by C. Schmidt, and the discovery was made that the well-known Acts of Paul and Thecla were in reality a part of the Acts of Paul. From the notes regarding the extent of the Acts given in the Cod. Claromontanus and in the Stichometry of Nicephorus we gather that the fragments amount to about one-fourth of the whole.<P>(1) Of these fragments the longest and the most important is the section which came to have a separate existence under the name The Acts of Paul and Thecla. When these were separated from the Acts of Paul we cannot tell, but this had happened before the time of the Gelasian Decree (496 AD), which without making mention of the Acts of Paul condemns as apocryphal the Acts of Paul and Thecla.<P>(a) An outline of the narrative is as follows: At Iconium, Thecla, a betrothed maiden, listened to the preaching of Paul on virginity and was so fascinated that she refused to have anything further to do with her lover. On account of his influence over her, Paul was brought before the proconsul and was cast into prison. There Thecla visited him with the result that both were brought to judgment. Paul was banished from the city and Thecla was condemned to be burned.<P>Having been miraculously delivered at the pile, Thecla went in search of Paul and when she had found him she accompanied him to Antioch. (There is confusion in the narrative of Antioch of Pisidia and Syrian Antioch.) In Antioch an influential citizen, Alexander by name, became enamored of her and openly embraced her on the street. Thecla, resenting the familiarity, pulled off the crown which Alexander wore and in consequence was condemned to fight with the wild beasts at the games. Until the day of the games Thecla was placed under the care of Queen Tryphaena, then living in Antioch. When Thecla was exposed in the amphitheater a lioness died in defending her against attack. In her peril Thecla cast herself into a tank containing seals and declared: "In the name of Jesus Christ I baptize myself on my last day." (It was with reference partly to this act of self-baptism that Tertullian gave the information about the authorship of these Acts: below 3.) When it was proposed to have Thecla torn asunder by maddened bulls Queen Tryphaena fainted, and through fear of what might happen the authorities released Thecla and handed her over to Tryphaena. Thecla once again sought Paul and having found him was commissioned by him to preach the Word of God.<P>This she did first at Iconium and then in Seleucia where she died. Various later additions described Thecla\'s end, and in one of them it is narrated that she went underground from Seleucia to Rome that she might be near Paul. Finding that Paul was dead she remained in Rome until her death.<P>(b) Although the Thecla story is a romance designed to secure apostolic authority for the ideal of virginity, it is probable that it had at least a slight foundation in actual fact. The existence of an influential Thecla-cult at Seleucia favors the view that Thecla was a historical person. Traditions regarding her association with Paul which clustered round the temple in Seleucia built in her honor may have provided the materials for the romance. In the story there are clear historical reminiscences. Tryphaena is a historical character whose existence is established by coins. She was the mother of King Polemon II of Pontus and a relative of the emperor Claudius. There are no grounds for doubting the information given us in the Acts that she was living at Antioch at the time of Paul\'s first visit. The Acts further reveal striking geographical accuracy in the mention of "the royal road" by which Paul is stated to have traveled from Lystra on his way to Iconium—a statement which is all the more remarkable because, while the road was in use in Paul\'s time for military reasons, it was given up as a regular route in the last quarter of the 1st century. In the Acts, Paul is described as "a man small in stature, bald-headed, bow-legged, of noble demeanor, with meeting eyebrows and a somewhat prominent nose, full of grace. He appeared sometimes like a man, and at other times he had the face of an angel."<P>This description may quite well rest on reliable tradition. On the ground of the historical features in the story, Ramsay (The Church in the Roman Empire, 375f) argued for the existence of a shorter version going back to the 1st century, but this view has not been generally accepted.<P>(c) The Acts of Paul and Thecla were very widely read and had a remarkable influence owing to the widespread reverence for Thecla, who had a high place among the saints as "the first female martyr." References to the Acts in the Church Fathers are comparatively few, but the romance had an extraordinary vogue among Christians both of the East and of the West. In particular, veneration for Thecla reached its highest point in Gaul, and in a poem entitled "The Banquet" (Caena) written by Cyprian, a poet of South-Gaul in the 5th century, Thecla stands on the same level as the great characters of Biblical history. The later Acts of Xanthippe and Polyxena are entirely derived from the Acts of Paul and Thecla.<P>(2) Another important fragment of the Acts of Paul is that containing the so-called Third Epistle to the Corinthians. Paul is represented as being in prison at Philippi (not at the time of <a onClick="return mV(\'Act\',16,23);">Ac 16:23</a> f., but at some later time). His incarceration was due to his influence over Stratonice, the wife of Apollophanes. The Corinthians who had been disturbed by two teachers of heresy sent a letter to Paul describing their pernicious doctrines, which were to the effect that the prophets had no authority, that God was not almighty, that there was no resurrection of the body, that man had not been made by God, that Christ had not come in the flesh or been born of Mary, and that the world was not the work of God but of angels. Paul was sorely distressed on receipt of this epistle and, "under much affliction," wrote an answer in which the popular Gnostic views of the false teachers are vehemently opposed. This letter which abounds in allusions to several of the Pauline epistles is chiefly remarkable from the fact that it found a place, along with the letter which called it forth, among canonical writings in the Syrian and Armenian churches after the second century. The correspondence was strangely enough believed to be genuine by Rinck who edited it in 1823. The original Greek version has not been preserved, but it exists in Coptic (not quite complete), in Armenian and in two Latin translations (both mutilated), besides being incorporated in Ephraem\'s commentary (in Armenian translation). The Syriac version has been lost.<P>(3) Besides the two portions of the Acts of Paul mentioned above there are others of less value, the Healing of a Dropsical Man at Myra by the apostle (a continuation of the Thecla-narrative), Paul\'s conflict with wild beasts at Ephesus (based on the misunderstanding of <a onClick="return mV(\'1Cr\',15,32);">1Co 15:32</a>), two short citations by Origen, and a concluding section describing the apostle\'s martyrdom under Nero, to whom Paul appeared after his death. Clement of Alexandria quotes a passage (Strom., VI,5,42 f.)—a fragment from the mission-preaching of Paul—which may have belonged to the Acts of Paul; and the same origin is possible for the account of Paul\'s speech in Athens given by John of Salisbury (circa 1156) in the Policraticus, IV, 3.<P>3. Authorship and Date:<P>From a passage in Tertullian (De Baptismo, chapter 17) we learn that the author of the Acts of Paul was "a presbyter of Asia, who wrote the book with the intention of increasing the dignity of Paul by additions of his own," and that "he was removed from office when, having been convicted, he confessed that he had done it out of love to Paul." This testimony of Tertullian is supported by the evidence of the writing itself which, as we have seen, shows in several details exact knowledge of the topography and local history of Asia Minor. A large number of the names occurring in these Acts are found in inscriptions of Smyrna, although it would be precarious on that ground to infer that the author belonged to that city. It is possible that he was a native of a town where Thecla enjoyed peculiar reverence and that the tradition of her association with Paul, the preacher of virginity, was the chief motive for his writing the book. Along with this was linked the motive to oppose the views of some Gnostics (the Bardesanites). The date of the Acts of Paul is the latter half of the second century, probably between 160 and 180 AD.<P>4. Character and Tendency:<P>The Acts of Paul, though written to enhance the dignity of the apostle, clearly show that both in respect of intellectual equipment and in breadth of moral vision the author, with all his love for Paul, was no kindred spirit. The intellectual level of the Acts is low. There is throughout great poverty in conception; the same motif occurs without variation; and the defects of the author\'s imagination have their counterpart in a bare and inartistic diction. New Testament passages are frequently and freely quoted. The view which the author presents of Christianity is narrow and one-sided. Within its limits it is orthodox in sentiment; there is nothing to support the opinion of Lipsius that the work is a revision of a Gnostic writing. The frequent occurrence of supernatural events and the strict asceticism which characterize the Acts are no proof of Gnostic influence. The dogmatic is indeed anti-Gnostic, as we see in the correspondence with the Corinthians. "The Lord Jesus Christ was born of Mary, of the Seed of David, the Father having sent the Spirit from heaven into her."<P>The resurrection of the body is assured by Christ\'s resurrection from the dead. Resurrection, however, is only for those who believe in it—in this we have the one thought which betrays any originality on the part of the author: "they who say that there is no resurrection shall have no resurrection." With faith in the resurrection is associated the demand for strict sexual abstinence. Only they who are pure (i.e. who live in chastity) shall see God. "Ye have no part in the resurrection unless ye remain chaste and defile not the flesh." The gospel which the apostle preached was "the word regarding self-control and the resurrection." In the author\'s desire to secure authority for a prevalent form of Christianity, which demanded sexual abstinence as a condition of eternal life, we recognize the chief aim of the book. Paul is represented as the apostle of this popular conception, and his teaching is rendered attractive by the miraculous and supernatural elements which satisfied the crude taste of the time.<P>LITERATURE.<P>Books mentioned under "Literature" (p. 188); C. Schmidt, "Die Paulusakten" (Neue Jahrbucher, 217f; 1897), Acta Pauli (1904); dealing with Acts of Paul and Thecla Ramsay, The Church in the Roman Empire (4th edition, 1895); Conybeare, The Apology and Acts of Apollonius....(1894); Cabrol, La legende de sainte Thecle (1895), Orr, The New Testament Apocrypha Writings (introd. translation, and notes, 1903). For further literature see Hennecke, Handbuch, etc., 358f; Pick, Apocrypha Acts,1,8 f.<P>II. Acts of Peter.<P>1. Contents:<P>A large portion (almost two-thirds) of the Acts of Peter is preserved in a Latin translation—the Actus Vercellenses, so named from the town of Vercelli in Piedmont, where the manuscript containing them lies in the chapter-library. A Coptic fragment discovered and published (1903) by C. Schmidt contains a narrative with the subscription Praxis Petrou (Act of Peter). Schmidt is of opinion that this fragment formed part of the work to which the Actus Vercellenses also belonged, but this is somewhat doubtful. The fragment deals with an incident in Peter\'s ministry at Jerusalem, while the Act. Vercell., which probably were meant to be a continuation of the canonical Acts, give an account of Peter\'s conflict with Simon Magus and of his martyrdom at Rome. References in ecclesiastical writers (Philastrius of Brescia, Isidore of Pelusium and Photius) make it practically certain that the Actus Vercellensus belong to the writing known as the Acts of Peter, which was condemned in the rescript of Innocent I (405 AD) and in the Gelasian Decree (496 AD).<P>(1) The Coptic Fragment contains the story of Peter\'s paralytic daughter. One Sunday while Peter was engaged in healing the sick a bystander asked him why he did not make his own daughter whole. To show that God was able to effect the cure through him, Peter made his daughter sound for a short time and then bade her return to her place and become as before. He explained that the affliction had been laid upon her to save her from defilement, as a rich man Ptolemy had been enamored of her and had desired to make her his wife. Ptolemy\'s grief at not receiving her had been such that he became blind. As the result of a vision he had come to Peter, had received his sight and had been converted, and when he died he had left a piece of land to Peter\'s daughter. This land Peter had sold and had given the proceeds to the poor. Augustine (Contra Adimantum, 17.5) makes a reference to this story but does not mention Acts of Peter. There are also two references to the incident in the Acts of Philip. In the later Acts of Nereus and Achilleus the story is given with considerable changes, the name of Peter\'s daughter, which is not mentioned in the fragment, being given as Petronilla.<P>(2) The contents of the Actus Vercellenses fall into three parts:<P>(a) The first three chapters which clearly are a continuation of some other narrative and would fitly join on to the canonical Acts tell of Paul\'s departure to Spain.<P>(b) The longest section of the Acts(4-32) gives an account of the conflict between Peter and Simon Magus at Rome. Paul had not been gone many days when Simon, who "claimed to be the great power of God," came to Rome and perverted many of the Christians. Christ appeared in a vision to Peter at Jerusalem and bade him sail at once for Italy. Arrived at Rome Peter confirmed the congregation, declaring that he came to establish faith in Christ not by words merely but by miraculous deeds and powers (allusion to <a onClick="return mV(\'1Cr\',4,20);">1Co 4:20</a>; <a onClick="return mV(\'1Th\',1,5);">1Th 1:5</a>). On the entreaty of the brethren Peter went to seek out Simon in the house of one named Marcellus, whom the magician had seduced, and when Simon refused to see him, Peter unloosed a dog and bade it go and deliver his challenge. The result of this marvel was the repentance of Marcellus. A section follows describing the mending of a broken statue by sprinkling the pieces with water in the name of Jesus. Meantime the dog had given Simon a lecture and had pronounced on him the doom of unquenchable fire.<P>After reporting on its errand and speaking words of encouragement to Peter, the dog expired at the apostle\'s feet. A smoked fish is next made to swim. The faith of Marcellus waxed strong at the sight of the wonders which Peter wrought, and Simon was driven out of him house with every mark of contempt. Simon, enraged at this treatment, came to challenge Peter. An infant of seven months speaking in a manly voice denounced Simon and made him speechless until the next Sabbath day. Christ appeared in a vision of the night encouraging Peter, who when morning was come narrated to the congregation his triumph over Simon, "the angel of Satan," in Judea. Shortly afterward, in the house of Marcellus which had been "cleansed from every vestige of Simon," Peter unfolded the true understanding of the gospel. The adequacy of Christ to meet every kind of need is shown in a characteristic passage which reveals docetic traits: "He will comfort you that you may love Him, this Great and Small One, this Beautiful and Ugly One, this Youth and Old Man, appearing in time yet utterly invisible in eternity, whom a human hand has not grasped, who yet is now grasped by His servants, whom flesh had not seen and now sees," etc. Next in a wonderful blaze of heavenly light blind widows received their sight and declared the different forms in which Christ had appeared to them.<P>A vision of Marcellus is described in which the Lord appearing in the likeness of Peter struck down with a sword "the whole power of Simon," which had come in the form of an ugly Ethiopian woman, very black and clad in filthy rags. Then follows the conflict with Simon in the forum in presence of the senators and prefects. Words were first exchanged between the combatants; then from words it came to deeds, in which the power of Peter was signally exhibited as greater than Simon\'s in the raising of the dead. Simon was now discredited in Rome, and in a last attempt to recover his influence he declared that he would ascend to God Before the assembled crowd he flew up over the city, but in answer to Peter\'s prayer to Christ he fell down and broke his leg in three places. He was removed from Rome and after having his limb amputated died.<P>(c) The Actus Vercellenses close with an account of Peter\'s martyrdom (33-41) Peter had recurred the enmity of several influential citizens by persuading their wives to separate from them. Then follows the well-known "Quo vadis?" story. Peter being warned of the danger he was in fled from Rome; but meeting Christ and leaning that He was going to the city to be crucified again, Peter returned and was condemned to death. At the place of execution Peter expounded the mystery of the cross. He asked to be crucified head downward, and when this was done he explained in words betraying Gnostic influence why he had so desired it. After a prayer of a mystical nature Peter gave up the ghost. Nero was enraged that Peter should have been put to death without his knowledge, because he had meant to heap punishments upon him. Owing to a vision he was deterred from a rigorous persecution of the Christians. (The account of Peter\'s martyrdom is also found in the Greek original.)<P>It is plain from the account given of these Acts that they are entirely legendary in character. They have not the slightest value as records of the activity of Peter.<P>2. Historical Value:<P>They are in reality the creation of the ancient spirit which delighted in the marvelous and which conceived that the authority of Christianity rested on the ability of its representatives to surpass all others in their possession of supernatural power. The tradition that Simon Magus exercised a great influence in Rome and that a statue was erected to him (10) may have had some basis in fact. Justin Martyr (Apol, I,26,56) states that Simon on account of the wonderful deeds which he wrought in Rome was regarded as a god and had a statue set up in his honor. But grave doubts are thrown on the whole story by the inscription SEMONI SANCO DEO FIDIO SACRUM which was found on a stone pedestal at Rome in 1574. This refers to a Sabine deity Semo Sancus, and the misunderstanding of it may have led to Justin\'s statement and possibly was the origin of the whole legend of Simon\'s activity at Rome. The tradition that Peter died a martyr\'s death at Rome is early, but no reliance can be placed on the account of it given in the Acts of Peter.<P>3. Authorship and Date:<P>Nothing can be said with any certainty as to the authorship of the Acts of Peter. James (Apocrypha Anecdota, II) believes them to be from the same hand as the Acts of John, and in this he is supported by Zahn (Gesch. des New Testament Kanons, II, 861). But all that can definitely be said is that both these Acts had their origin in the same religious atmosphere. Both are at home on the soil of Asia Minor. Opinion is not unanimous on the question where the Acts of Peter were written, but a number of small details as well as the general character of the book point to an origin in Asia Minor rather than at Rome. There is no knowledge of Roman conditions, while on the other hand there are probable reminiscences of historical persons who lived in Asia Minor. The date is about the close of the 2nd century.<P>4. General Character:<P>The Acts of Peter were used by heretical sects and were subjected to ecclesiastical censure. That however does not necessarily imply a heretical origin. There are traces in them of a spirit which in later times was regarded as heretical, but they probably originated within the church in an environment strongly tinged by Gnostic ideas. We find the principle of Gnosticism in the stress that is laid on understanding the Lord (22). The Gnostic view that the Scripture required to be supplemented by a secret tradition committed to the apostles is reflected in several passages (20 in particular). At the time of their earthly fellowship with Christ the apostles were not able to understand the full revelation of God. Each saw only so far as he was able to see. Peter professes to communicate what he had received from the Lord "in a mystery." There are slight traces of the docetic heresy. The mystical words of Peter as he hung on the cross are suggestive of Gnostic influence (33 f.). In these Acts we find the same negative attitude to creation and the same pronounced ascetic sprat as in the others. "The virgins of the Lord" are held in special honor (22). Water is used instead of wine at the Eucharist. Very characteristic of the Acts of Peter is the emphasis laid on the boundless mercy of God in Christ toward the backsliding (especially 7). This note frequently recurring is a welcome revelation of the presence of the true gospel-message in communities whose faith was allied with the grossest superstition.<P>LITERATURE.<P>Books mentioned under "Literature" (p. 188). In addition, Ficker, Die Petrusakten, Beitrage zu ihrem Verstandnis (1903); Harnack, "Patristische Miscellen" (TU, V,3,1900).<P>III. Acts of John.<P>1. Contents:<P>According to the Stichometry of Nicephorus the Acts of John in their complete state formed a book about the same length as the Gospel of Matthew. A number of sections which show links of connection with one another are extant- -about two-thirds of the whole. The beginning of the Acts is wanting, the existing narrative commencing at 18. What the contents of the earlier chapters were we cannot surmise. In Bonnet\'s reconstruction the first fourteen chapters deal with John\'s journey from Ephesus to Rome and his banishment to Patmos, while 15-17 describe John\'s return to Ephesus from Patmos. The sections given by Bonnet may contain material which belonged to the original Acts, but it is improbable that they stood at the beginning of the work, as it seems clear that the narrative commencing at 18 describes John\'s first visit to Ephesus. The first extant portion of the Acts (18-25) narrates that Lycomedes "the commander-in-chief of the Ephesians" met John as he drew near the city and besought him on behalf of his beautiful wife Cleopatra, who had become paralyzed.<P>When they came to the house the grief of Lycomedes was so great that he fell down lifeless. After prayer to Christ John made Cleopatra whole and afterward raised Lycomedes to life again. Prevailed upon by their entreaties John took up his abode with them. In 26-29 we have the incident of the picture of John which played so prominent a part in the discussion at the Second Council of Nicea. Lycomedes commissioned a friend to paint a picture of John and when it was completed he put it in bedroom with an altar before it and candlesticks beside it. John discovering why Lycomedes repaired so frequently to his room, taxed him with worshipping a heathen god and learned that the picture was one of himself. This he believed only when a mirror was brought that he might see himself. John charged Lycomedes to paint a picture of his soul and to use as colors faith in God, meekness, love, chastity, etc. As for the picture of his body it was the dead picture of a dead man.<P>Chapters 30-36 narrate the healing of infirm old women, and in theater where the miracles were wrought John gave an address on the vanity of all earthly things and on the destroying nature of fleshly passion. In 37-45 we read that in answer to the prayer of John the temple of Artemis fell to the ground, with the result that many people were won to the worship of Christ. The priest of Artemis who had been killed through the fall of the temple was raised to life again and became a Christian (46f). After the narration of further wonders (one of them the driving of bugs out of a house) follows the longest incident of the Acts, the inexpressibly repulsive story of Drusiana (62-86), which was used as theme of a poem by the nun Hroswitha of Gandersheim (10th century). The following section gives a discourse of John on the life, death and ascension of Jesus (87-105) which is characterized by distinct docetic traits, a long passage dealing with Christ\'s appearance in many forms and with the peculiar nature of His body. In this section occurs the strange hymn used by the Priscillianists, which purports to be that which Jesus sang after supper in the upper room (<a onClick="return mV(\'Mat\',26,30);">Mt 26:30</a>), the disciples dancing round Him in a ring and responding with "Amen." Here too we find the mystic doctrine of the Cross revealed to John by Christ. Chapters 106-15 narrate the end of John. After addressing the brethren and dispensing the sacrament of the Lord\'s Supper with bread alone, John ordered a grave to be dug; and when this was done, he prayed, giving thanks that he had been delivered from "the filthy madness of the flesh" and asking a safe passage through the darkness and dangers of death. Whereupon he lay down quietly in the grave and gave up the ghost.<P>2. Historical Value:<P>The Actsof John, it need hardly be said, have not the slightest hist
