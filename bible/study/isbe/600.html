orical value. They are a tissue of legendary incidents which by their miraculous character served to insinuate into the popular mind the dogmatic conceptions and the ideal of life which the author entertained. The Acts however are in harmony with the well-founded tradition that Ephesus was the scene of John\'s later activity. Very remarkable is the account of the destruction of the Artemis-temple by John—a clear proof that the Acts were not written in Ephesus. The Ephesian temple of Artemis was destroyed by the Goths in 262 AD.<P>3. General Character:<P>The Acts of John are the most clearly heretical of all the Acts. The docetic traits have already been referred to. The unreality of Christ\'s bodily existence is shown by the changing forms in which He appeared (88-90), by His ability to do without food (93) and without sleep ("I never at any time saw His eyes closing but only open," 89), by His leaving no footprint when He walked (93), by the varying character of His body when touched, now hard, now soft, now completely immaterial (89, 93) The crucifixion of Jesus, too, was entirely phantasmal (97, 99). The ascension followed immediately on the apparent crucifixion; there was no place for the resurrection of One who had never actually died. Gnostic features are further discernible in the disparagement of the Jewish Law (94), in the view which lays emphasis on a secret tradition committed by Christ to the apostles (96) and in the contempt for those who were not enlightened ("Care not for the many, and them that are outside the mystery despise," 100). The historical incidents of Christ\'s sufferings are sublimated into something altogether mystical (101); they are simply a symbol of human suffering, and the object of Christ\'s coming is represented as being to enable men to understand the true meaning of suffering and thus to be delivered from it (96). The real sufferings of Christ are those caused by His grief at the sins of His followers (106f).<P>He is also a partaker in the sufferings of His faithful people, and indeed is present with them to be their support in every trial (103). The Acts of John also reveal a strong encratite tendency, although that is not so pronounced as in the Acts of Andrew and of Thomas. Nowhere however do we get a more horrifying glimpse into the depths of corrupt sexualism than in these Acts. The writing and circulation of the story of Drusiana cast a lurid light on the gross sensual elements which survived in early Hellenic Christianity. Apart from this there are passages which reveal a warm and true religious feeling and some of the prayers are marked by glow and unction (112f). The Acts show that the author was a man of considerable literary ability; in this respect they form a striking contrast to the Acts of Paul.<P>4. Authorship and Date:<P>The author of the Acts of John represents himself as a companion of the apostle. He has participated in the events which he describes, and in consequence the narrative possesses a certain lively quality which gives it the appearance of actual history. The author according to testimony which goes back to the 4th century was Leucius, but nothing can with any certainty be said of him (see above A, VI). It is possible that in some part of the Acts which is lost the author mentioned his name The early date of the Acts is proved by a reference in Clement of Alexandria (circa 200) to the immaterial nature of Christ\'s body, the passage plainly indicating that Clement was acquainted with the Acts or had heard another speak of them (Hypotyposeis on <a onClick="return mV(\'1Jo\',1,1);">1Joh 1:1</a>). The probable date is between 150 and 180 and Asia Minor is the place of origin.<P>5. Influence:<P>The Acts of John exerted a wide influence. They are in all probability the earliest of the Apocryphal Acts and those written later owe much to them. The Acts of Peter and of Andrew show so close affinities with the Acts of John that some have regarded them as being from the same hand; but if that be not so, there is much to be said for the literary dependence of the former on the latter. We are probably right in stating that the author of the Acts of John was the pioneer in this sphere of apostolic romance and that others eagerly followed in the way which he had opened up. That the Acts of John were read in orthodox circles is clear from the reference in Clement of Alexandria. In later days however they were regarded with suspicion. Augustine quotes part of the hymn (95) which he read in a Priscillianist work sent him by a bishop Ceretius and makes severe animadversions on it and on the claim advanced regarding it that it had been revealed in secret to the apostles. The second Synod of Nicea (787 AD) passed judgment on the Acts of John in words of great severity (see above A, V, 1). The stories found in the Acts had, however, before this time passed into orthodox tradition and had been used by Prochorus (5th century), a supposed disciple of John, in the composition of his travel-romance dealing with the apostle, as well as by Abdias (6th century) whose work contains material from the older Acts which is not otherwise preserved.<P>LITERATURE.<P>See under "Literature" (p. 188); also Zahn, Acta Joannis (1880).<P>IV. Act of Andrew.<P>The first mention of these Acts which are referred to frequently by ecclesiastical writers is in Eusebius (Historia Ecclesiastica, III,25,6). They are there, along with other Acts, rejected as absurd and impious. Epiphanius refers to them in several passages (Haeres.,47,61, 68) as being in use among various heretical sects which practiced a strict ascetic morality. Early writers attribute them to Leucius, the author of the Acts of John.<P>1. Contents:<P>Of the Acts of Andrew only small portions remain. A fragment is preserved by Euodius of Uzala (died 424), a contemporary of Augustine, and a longer piece, found in a manuscript of the 10th or 11th century, containing lives of saints for November, was identified by Bonnet as belonging to the Acts of Andrew. The account of the death of Andrew is preserved in many forms; that which has the most appearance of retaining the form of the original Acts being found in a letter of the presbyters and deacons of the churches of Achaia.<P>(1) The fragment of Euodius gives two short passages describing the relations of Maximilla with her husband Egetes, whose claims she resisted.<P>(2) The longest section of the Acts deals with Andrew\'s imprisonment because he had induced Maximilla to separate from her husband "Aegeates," and to live a life of chastity. ("Aegeates," which occurs as the name of Maximilla\'s husband, denotes in reality "a native of Aegae," Aegae being a town in the vicinity of Patrae, where Andrew was described as carrying on his work.) The section opens in the middle of an address spoken to the brethren by Andrew in prison, in which they were enjoined to glory in their fellowship with Christ and in their deliverance from the baser things of earth. Maximilla with her companions frequently visited the apostle in prison. Aegeates expostulated with her and declared that if she did not resume relations with him he would subject Andrew to torture. Andrew counseled her to resist the importunity of Aegeates, and delivered an address on the true nature of man and stated that torture had no terrors for him. If Maximilla should yield, the apostle would suffer on her account. Through her fellowship with his sufferings she would know her true nature and thus escape from affliction. Andrew next comforted Stratocles, the brother of Aegeates, who declared his need of Andrew, the sower in him of the "seed of the word of salvation." Andrew thereafter announced his crucifixion on the following day. Maximilla again visited the apostle in prison, "the Lord going before her in the form of Andrew." To a company of the brethren the apostle delivered an address, in which he discoursed on the deceitfulness of the devil, who first had dealt with men as a friend but now was manifest as an enemy.<P>(3) When brought to the place of crucifixion Andrew addressed the cross which he joyfully welcomed. After being bound to the cross he hung smiling at the miscarriage of the vengeance of Aegeates, for (as he explained) "a man who belongs to Jesus because he is known of Him is armed against every vengeance." For three days and nights Andrew addressed the people from the cross, and they, moved by his nobility and eloquence, went to Aegeates, demanding that he should be delivered from death. Aegeates, fearing the wrath of the people, went to take Andrew down from the cross, but the apostle refused deliverance and prayed to Christ to prevent his release. After this he gave up the ghost. He was buried by Maximilla, and Aegeates soon afterward cast himself down from a great height and died.<P>2. General Character:<P>The encratite ideal in its most pronounced form is exhibited in the Acts of Andrew. (In view of this, and of Andrew\'s association elsewhere in ecclesiastical tradition with a strict asceticism, there is a curious irony in the fact that in some parts of Germany, Andrew is the patron saint of maidens seeking husbands. In the Harz and in Thuringen St Andrew\'s Night (November 30) is considered by maidens the most favorable time for the vision of their future husbands.) The Gnostic spirit is revealed in the feeling for the preeminent worth of the spiritual man (6). The true nature of man is pure; the weakness and sin are the work of the "evil enemy who is averse to peace." In seducing men he did not come out openly as an enemy but pretended friendship. When the light of the world appeared the adversary of man was seen in his true colors. Deliverance from sin comes through enlightenment. The mystical view of sufferings (9) reminds us of the similar view in the Acts of John. The addresses of the apostle are characterized by religious earnestness and warmth (words flow from his lips "like a stream of fire" 12), and by a profound sense of the Divine pity for sinful and tempted men.<P>3. Historical Value:<P>The only detail in the Acts of Andrew which has a claim to be considered historical is his activity at Patrae on the Corinthian Gulf. (Patrae is not actually mentioned in the fragmentary Acts, but that the scene of the imprisonment and martyrdom of Andrew is laid in that city may be inferred from the name "Aegeates"—see above 1 (2).) Ecclesiastical tradition speaks with great uncertainty of the sphere of Andrew\'s missionary labors, Scythia, Bithynia and Greece being all mentioned. It may be regarded as probable that Andrew came to Greece and suffered martyrdom at Patrae, although one must reckon with the possibility that the account of his work and crucifixion there was invented for the purpose of representing the church at Patrae as an apostolic foundation. The crucifixion of the apostle on the so-called Andrew\'s cross is a later tradition.<P>V. Acts of Thomas.<P>These Acts exist in a complete state and their great popularity in church circles is shown by the large number of manuscripts which contain them. It is probable that they were written originally in Syriac and that they were later freely translated into Greek and worked over from the Catholic point of view.<P>1. Contents:<P>In the Stichometry of Nicephorus the Acts of Thomas are mentioned as containing 1,600 stichoi (lines of about sixteen syllables), one-fifth fewer than the Gospel of Mark. If this notice is correct, the form in which we have the Acts is very much more extended. In the Greek versions the Acts are divided into thirteen "deeds" followed by the martyrdom of Thomas. Some idea of the contents may be given as follows:<P>(1) At a meeting of the apostles in Jerusalem, Thomas had India allotted to him as his sphere of service. He was unwilling to go, but at last consented when the Lord sold him to a messenger from King Gundaforus in India. On the journey to India, Thomas came to the city of Andrapolis where the nuptials of the king\'s daughter were being celebrated. In these the apostle took part and sang a hymn in praise of the heavenly wedding.<P>The king asked Thomas to pray for his daughter and after he had done so the Lord appeared in the form of Thomas and won the newly-married pair to a life of sexual abstinence. The king incensed at this sought Thomas, but the apostle had departed.<P>(2) Arrived in India Thomas undertook to build a palace for king Gundaforus. He received money for this purpose but gave it away in alms. The king discovering this cast Thomas into prison, but afterward released him when he learned from his brother who came back from the dead that Thomas had built a heavenly palace for him. Gundaforus and his brother became Christians.<P>(3) Traveling farther east Thomas found a youth who had been slain by a dragon because of a woman whom both desired. The dragon at the command of Thomas sucked the poison from the youth\'s body and itself died. The young man, restored to life, embraced the ideal of sexual abstinence and was counseled to set his affections on Christ.<P>(4) The story of a speaking colt.<P>(5) Thomas delivered a woman from the power of a filthy demon. An account given of the celebration of the Eucharist (with bread alone) which includes a Gnostic prayer.<P>(6) A youth partaking of the Eucharist was convicted of sin and confessed that he had killed a maiden who refused to live with him in unchaste intercourse. The maiden was raised to life and gave an account of her experience in hell.<P>(7) Thomas was besought by a commander named Sifor to deliver his wife and daughter from a demon of uncleanness.<P>(8) While they were on their way to the commander\'s house the beast which drew the carriage became exhausted and four wild asses allowed themselves to be quietly yoked. One of the wild asses was instructed by Thomas to exorcise the demons which dwelt in the women.<P>(9) A woman, Mygdonia, married to Charis, a near relative of King Misdai, listened to a discourse of the apostle and was led to reject the society of her husband. Charis complained to the king about the magician who had put a spell upon his wife and Thomas was cast into prison. At the request of his fellow-prisoners Thomas prayed for them and recited a hymn (known as "the hymn of the soul") which is entirely Gnostic in character.<P>(10) Mygdonia received the seal of Jesus Christ, being first anointed with oil, then being baptized, then receiving the Eucharist in bread and water. Thomas was released from prison, and Sifor, his wife and his daughter all received the seal.<P>(11) Tertia the queen was sent by Misdai to reason with Mygdonia and as a result she herself was won to the new life. Thomas was then brought to the place of judgment.<P>(12) There Vazan, the king\'s son, talked with the apostle and was converted. The king gave orders that Thomas should be tortured with hot plates of iron, but when these were brought water gushed forth from the earth and submerged them. Then follow an address and prayer of Thomas in prison.<P>(13) The apostle was visited in prison by the women and by Vazan and thereafter Vazan along with others was baptized and received the Eucharist, Thomas coming from prison to Vazan\'s house for this purpose.<P>(14) Thomas was put to death by the command of the king, being pierced with lances, but afterward he showed himself to his followers. Later a son of Misdai was cured of an unclean spirit by dust taken from the apostle\'s grave and Misdai himself became a Christian.<P>2. Character and Tendency:<P>The Acts of Thomas are in reality a treatise in the form of a travel-romance whose main design was to set forth abstinence from sexual intercourse as the indispensable condition of salvation. In the addresses of Thomas, however, positive Christian virtues are emphasized; and in particular the duty and the recompense of compassion are strikingly exhibited in the story of the building of the heavenly palace. The Acts clearly had their origin in Gnostic circles and were held in high estimation by various encratite sects. The original Acts underwent revision in the interest of orthodoxy. The hymns and dedication-prayers which showed marked Gnostic features were probably retained because their meaning was not understood. As Lipsius says, speaking of "the hymn of the soul": "The preservation of this precious relic of Gnostic poetry we owe to the happy ignorance of the Catholic reviser, who had no idea what heretical serpent lurked beneath the beautiful flowers of this poem."<P>The hymn, probably written by Bardesanes, the founder of a Gnostic sect, narrates in the form of an allegory the descent of the soul into the world of sense, its forgetfulness of its heavenly origin, its deliverance by the Divine revelation which awoke it to a consciousness of its true dignity, and its return to the heavenly home from which it came. In the opinion of some, however, the hymn is falsely called "the hymn of the soul." As Preuschen says: "It describes rather the descent of the Saviour to the earth, His deliverance of the soul which languishes there in the bondage of evil, and His return to the heavenly kingdom of light. One may characterize the whole as a Gnostic embellishment and extension of <a onClick="return mV(\'Phl\',2,\'5-11\');">Php 2:5-11</a>" (Hennecke, Handbuch, etc., 587). In whichever way the hymn is to be interpreted, it is a poem of great beauty and rich in oriental imagery. The ascriptions of praise to Christ in the addresses of the apostle are sometimes couched in noble language and always suffused by great warmth of feeling. Throughout the Acts we have miraculous and supernatural elements in abundance. Christ frequently appears in the likeness of Thomas who is represented as his twin-brother. The full name of the apostle is Judas Thomas—Judas the Twin. In 55f there is a graphic account of the tortures of the damned, which remind one of the Apocalypse of Peter.<P>3. Historical Value:<P>It goes without saying that the Acts of Thomas, which are a romance with a purpose, are in no sense a historical source for information about the apostle. The author however has made use of the names of historical persons. King Gundaforus (Vindafra) is known from other sources as an Indo-Parthian ruler in the 1st century AD. It is very doubtful whether the tradition preserved in the Acts as to the activity of Thomas in India is trustworthy. The earliest tradition with which we are acquainted places the sphere of his missionary labors in Parthia. Syrian tradition states that he died at Edessa, where in the 4th century there was a church dedicated to him. Thomas is also indirectly associated with Edessa in the Abgar Legend, in which we read that Thaddaeus who founded the church at Edessa was sent by Thomas. In the existing form of the Acts of Thomas we have a combination of the traditions regarding India and Edessa; we read (170) that some time after the apostle\'s death his bones were carried "into the regions of the West." Early tradition knows nothing of Thomas as a martyr; according to a statement of the Valentinian Heracleon (circa 170) quoted by Clement of Alexandria (Strom, IV, 9) the apostle died quietly in his bed. The name of the apostle is given in the Acts as Judas Thomas, and this we also find in the Doctrine of Addai and elsewhere. The statement in the Acts that the apostle was a twin-brother of Jesus was no doubt suggested by the meaning of the name Thomas (= "twin") and by the desire to enhance the dignity of the apostle. In 110 (in the Hymn of the Soul) there is a reference to the still existing Parthian kingdom, and as that kingdom came to an end in 227 AD, the poem must have been written before that date. The hymn, however, does not seem to have belonged to the original Acts, which probably were in existence before the end of the 2nd century.<P>LITERATURE.<P>Besides books mentioned under "Literature" (p. 188) Thilo, Acta Sancti Thomae apostoli (1823); Hoffman, ZNTW (1903, 273-309); Preuschen, Zweignostische Hymnen (1904); Hilgenfeld, ZWT (1904, 229-41). The Syrian Acts of Thomas were edition and translated by W. Wright, Apocryphal Acts of the Apostles (1871); also Bevan, in Texts and Studies, V, 3 (1897). The later Ethiopic version is found in Malan, The Conflicts of the Holy Apostles (1871), and in Budge, The Contendings of the Apostles (2 volumes containing Ethiopic text and translation, 1899-1901).``1';
isbe[612]='Apocryphal Epistles`a-pok\'-ri-fal e-pis\'-ls: A few epistles have been attributed to the Virgin Mary, but these are very late and without value. The following epistles fall to be noted as apocryphal:<P>1. Letter Attributed to our Lord:<P>The letter attributed to our Lord is given in Eusebius (Historia Ecclesiastica, I, 13) who records that in his day a copy of the letter was to be found among the archives of Edessa. Abgarus, king of Osroene, which was a small country in Mesopotamia, writes from Edessa, the capital, to our Lord, asking for healing and offering Him protection. Our Lord sends back a short letter saying that He cannot leave Palestine, but that, after His ascension, a messenger will come and heal Abgarus. The letters are obviously spurious. Osroene was actually Christianized about the beginning of the 3rd century, and the legend took shape and received official sanction in order to show that the country had received the Gospel at a much earlier date. See <a href="./study/isbe/search.html?string=ABGAR;+ABGARUS;+ABAGARUS">ABGAR</a>.<P>2. Letter Attributed to Peter:<P>The Clementine Homilies is a work of fiction attributed to Clement of Rome; it was actually written about the end of the 2nd century or the beginning of the 3rd. At the beginning of it there is set a letter of Peter to James. In it Peter counsels James not to show the book containing Peter\'s preaching except to a limited circle, and makes a violent attack upon the apostle Paul. It is thus evidently Ebionitic in tendency, and is, like the homilies to which it is prefixed, spurious.<P>3. Letters Attributed to Paul:<P>(1) The Epistle from Laodicea.<P>The mention of such an epistle in <a onClick="return mV(\'Col\',4,16);">Col 4:16</a> evidently tempted someone to forge a letter. It is written in Latin, and consists of 20 vs; it is a mere cento of Pauline phrases strung together. It is mentioned in the Muratorian Fragment (170 AD); and by the end of the 4th century. it had a wide circulation. It is now almost universally rejected as spurious. See <a href="./study/isbe/search.html?string=COLOSSIANS">COLOSSIANS</a>; <a href="./study/isbe/search.html?string=EPHESIANS">EPHESIANS</a>; <a href="./study/isbe/search.html?string=LAODICEANS+EPISTLE+TO+THE">LAODICEANS, EPISTLE TO THE</a>.<P>(2) Lost Epistle to the Corinthians.<P>In <a onClick="return mV(\'1Cr\',5,9);">1Co 5:9</a> a letter to the Corinthians is mentioned which appears to have been lost. In a 5th century Armenian version of the Scriptures there is inserted after 2 Corinthians a short letter from the Corinthians to Paul, and one from Paul to the Corinthians. These are also found in Syriac, and were evidently accepted in many quarters as genuine at the end of the 4th century. They formed a part of the Apocryphal Acts of Paul, and date from about 200 AD. See <a href="./study/isbe/search.html?string=CORINTHIANS">CORINTHIANS</a>.<P>(3) An Epistle to the Alexandrines.<P>This is mentioned only in the Muratorian Fragment, and has not come down to us.<P>(4) Letters of Paul to Seneca.<P>This is a correspondence in Latin, six of the letters being attributed to Paul and eight to Seneca. Regarding this correspondence Lightfoot says: "This correspondence was probably forged in the 4th century, either to recommend Seneca to Christian readers, or to recommend Christianity to students of Seneca." It had a wide circulation in the Middle Ages.<P>LITERATURE.<P>See article "Apocrypha" in Encyclopedia Biblica and RE. For text of Peter\'s letter to James, see Roberts\' and Donaldson\'s Ante-Nicene Christian Library, XVII. For the Pauline letters consult Zahn, Geschichte des New Testament Kanons, II. For Paul\'s Laodicean letter, see Lightfoot\'s Commentary on Colossians (where the text of the letter is graven); and for the letters to Seneca, Lightfoot\'s Commentary on Philippians, Dissertation II, with Appendix.``195';
isbe[613]='Apocryphal Gospels`a-pok\'-ri-fal gos\'-pels:<P><b>I. INTRODUCTORY</b><P class="in15">1. Early Gospels<P class="in15">2. Canonical Gospels<P class="in15">3. Apocryphal Gospels<P class="in15">4. Gospel according to the Hebrews<P><b>II. HERETICAL GOSPELS</b><P class="in15">1. Gospel of the Ebionites<P class="in15">2. Gospel of the Egyptians<P class="in15">3. Gospel of Marcion<P class="in15">4. Gospel of Peter<P class="in15">5. Gospel of the Twelve Apostles<P class="in15">6. Gospels of Barnabas and Bartholomew<P><b>III. SUPPLEMENTARY or LEGENDARY GOSPELS</b><P class="in15">1. Gospels of the Nativity<P class="in30">(a) Protevangelium of James<P class="in30">(b) Pseudo-Matthew<P class="in30">(c) The Nativity of Mary<P class="in30">(d) Gospel of Joseph the Carpenter<P class="in30">(e) The Passing of Mary<P class="in15">2. Gospels of the Infancy or Childhood<P class="in30">(a) Gospel of Thomas<P class="in30">(b) Arabic Gospel of the Childhood<P class="in15">3. Gospels of the Passion and Resurrection<P class="in30">(a) Gospel of Peter (as above)<P class="in30">(b) Gospel of Nicodemus<P class="in45">(1) Acts of Pilate<P class="in45">(2) Descent of Jesus into the Lower World<P class="in30">(c) Other Fabrications<P><b>LITERATURE</b><hr /><P>The apocryphal gospels form a branch of the apocryphal literature that attended the formation of the New Testament canon of Scripture. Apocryphal here means non-canonical. Besides gospels, this literature included acts, epistles and apocalypses.<P>I. Introductory.<P>1. Early Gospels:<P>The introduction to the third canonical Gospel shows that in the days of the writer, when the apostles of the Lord were still living, it was a common practice to write and publish accounts of the acts and words of Jesus. It has even been maintained (S. Baring-Gould, Lost and Hostile Gospels, xxiii, London, 1874) that at the close of the 1st century, almost every church had its own gospel with which alone it was acquainted. These were probably derived, or professed to be derived, from the oral reports of those who had seen, heard, and, it may be, conversed with our Lord. It was dissatisfaction with these compositions that moved Luke to write his Gospel. Whether any of these ante-Lukan documents are among those still known to us is hardly longer doubtful. Scholars of repute—Grotius, Grabe, Mill—were in earlier times disposed to place the Gospel of the Hebrews, the Gospel of the Ebionites, and the Gospel of the Egyptians among those alluded to by Luke, some holding the Gospel of the Hebrews to be as early as just after the middle of the 1st century. More recent criticism does not allow so early an appearance for those gospels, though a fairly early date is still postulated for the Gospel of the Hebrews. The Protevangelium of James (noticed below) is still held by some as possibly falling within the 1st century (EB, I, 259).<P>2. Canonical Gospels:<P>However this may be, there can be no doubt that by the close of the 1st century and the early part of the 2nd century, opinion was practically unanimous in recognition of the authority of the four Gospels of the canonical Scriptures. Irenaeus, Bishop of Lyons (180 AD), recognizes four, and only four Gospels, as "pillars" of the church. The Harmonies of Theophilus, bishop of Antioch (168-80 AD), and of Tatian, and the Apology of Justin Martyr carry back the tradition to a much earlier period of the century, and, as Liddon proves at considerable length (Bampton Lectures, 2nd ed., 210-19), "it is scarcely too much to assert that every decade of the 2nd century furnishes its share of proof that the four Gospels as a whole, and John\'s in particular, were to the church of that age what they are to the church of the present."<P>The recent attempt of Professor Bacon of Yale to get rid of the important authority of Irenaeus (The Fourth Gospel in Research and Debate, New York, 1910) will not succeed; it has been shown to be merely assertive where there is no evidence and agnostic where evidence is apparently demonstrative. During the last century the Gospels, as regards their composition, credibility and historicity, were subjected to the most searching and unsparing criticism which, though intimations of it were previously not wanting, may be said to have begun when Strauss, to use Liddon\'s words, "shocked the conscience of all that was Christian in Europe" by the publication of his first Life of Jesus. The methods pursued in this work consisted largely in the application to the sacred books, and especially to the Gospels, of the principles of criticism that had for forty years previously been used in estimating the structure and composition of some of the literary products of antiquity; and the controversy excited by this criticism can hardly yet be said to have subsided. This is not the place for entering upon an account of the controversy; it may be sufficient here to say that the traditional positions of the church have been ably defended, and in particular, that the claims of the canonical Gospels have been abundantly maintained.<P>3. Apocryphal Gospels:<P>Whatever was the fate of the ante-Lukan and other possible 1st-century gospels, it is with the 2nd century and the formation of an authoritative canon that the apocryphal gospels, such as we now have, for the most part begin to appear. In the days of the reproduction of documents by manuscript, of restricted communications between different localities, and when the church was only as yet forming and completing its organization, the formation and spread of such gospels would be much easier than now. The number of such gospels is very considerable, amounting to about fifty. These exist mainly in fragments and scattered notices; though some, as pointed out below, are either entire or nearly so. The apparent number has probably been increased by the use of different names for the same document. Thirty are named by Hofmann with more or less explanation in RE, I, 511; a complete hat is given in Fabricius (Cod. Apocrypha New Testament, I, 355f). Ebionistic and Gnostic circles were specially prolific of such gospels. "It would be easy," says Salmon (Intro, 1st ed., 239) "to make a long list of names of gospels said to have been in use in different Gnostic sects; but very little is known as to their contents, and that little is not such as to lead us to attribute to them the very slightest historical value."<P>Of many indeed no more is known than the names of the authors, such as the gospels of Basilides, of Cerinthus, of Apelles, of Matthias, of Barnabas, of Bartholomew, of Eve, of Philemon and many others. The scholars and authorities of the early church were quite well aware of the existence and aims of these productions. It is noteworthy also that they had no hesitation in characterizing them as they deserved. The Marcosians, according to Irenaeus, adduced "an unspeakable number of apocryphal and spurious writings, which they themselves had forged, to bewilder the minds of the foolish"; and Eusebius (Historia Ecclesiastica, III, 25) gives the following list of spurious and disputed books: "That we have it in our power to know both these books (the canonical) and those that are adduced by the heretics under the name of the apostles such, namely, as compose the gospels of Peter, of Thomas, and of Matthew, and certain others beside these or such as contain the Acts of Andrew and John, and of the other apostles, of which no one of those writers in the ecclesiastical succession has condescended to make any mention in his works: and, indeed, the character of the style itself is very different from that of the apostles, and the sentiments, and the purport of these things that are advanced in them, deviating as far as possible from sound orthodoxy, evidently prove they are the fictions of heretical men: whence they are not only to be ranked among the spurious writings but are to be rejected as altogether absurd and impious."<P>In the appendix to Westcott\'s Introduction to the Study of the Gospels will be found, with the exception of those recently discovered in Egypt, a complete list of the non-canonical sayings and deeds ascribed to our Lord as recorded in the patristic writings; and also a list of the quotations from the non-canonical gospels where these are only known by quotations.<P>The aim of the apocryphal gospels may be regarded as<P>(1) heretical or<P>(2) supplemental or legendary: that is to say, such as either were framed in support of some heresy or such as assume the canonical gospels and try to make additions—largely legendary—to them. Before considering these it may be well to take separate account of the Gospel according to the Hebrews.<P>4. Gospel According to the Hebrews:<P>The undoubted early date of this gospel, the character of most of its not very numerous quotations, the respect with which it is uniformly mentioned by early writers, and the esteem in which it is at present held by scholars in general, entitle the Gospel according to the Hebrews to special notice. Apart from the tradition, to which it is not necessary to attach too great importance, that represented our Lord as commanding His disciples to remain for twelve years in Jerusalem, it is reasonable to suppose that for the Christian communities resident in Jerusalem and Palestine a written gospel in their own language (Western Aramaic) would soon be a necessity, and such a gospel would naturally be used by Jewish Christians of the Diaspora. Jewish Christians, for example, settled in Alexandria, might use this gospel, while native Christians, as suggested by Harnack, might use the Gospel of the Egyptians, till of course both were superseded by the four Gospels sanctioned by the church.<P>There is no proof however that the gospel was earlier than the Synoptics, much less that it was among the ante- Lukan gospels. Harnack, indeed, by a filiation of documents for which there seems hardly sufficient warrant, placed it as early as between 65 and 100 AD. Salmon, on the other hand (Intro, Leer X) concludes that "the Nazarene gospel, so far from being the mother, or even the sister of one of our canonical four, can only claim to be a grand-daughter or grand-niece." Jerome (400 AD) knew of the existence of this gospel and says that he translated it into Greek and Lat; quotations from it are found in his works and in those of Clement of Alexandria. Its relation to the Gospel of Matthew, which by almost universal consent is declared to have been originally written in Hebrew (i.e. Aramaic), has given rise to much controversy. The prevalent view among scholars is that it was not the original of which Matthew\'s Gospel was a Greek translation, but still that it was a fairly early composition. Some, like Salmon and Harnack, are disposed to regard Jerome\'s Hebrew Gospel as to all intents a fifth gospel originally composed for Palestinian Christians, but which became of comparatively insignificant value with the development of Christianity into a world-religion. Besides two references to the baptism of Jesus and a few of his sayings, such as—"Never be joyful except when ye shall look upon your brother in love"; "Just now my Mother, the Holy Spirit, took me by one of my hairs and bore me away to the great mountain Thabor"—it records the appearance of our Lord to James after the resurrection, adduced by Paul (<a onClick="return mV(\'1Cr\',15,7);">1Co 15:7</a>) as one of the proofs of that event; but of course Paul might have learned this from the lips of James himself as well as from ordinary tradition, and not necessarily from this gospel.<P>This indeed is the principal detail of importance which the quotations from this gospel add to what we know from the Synoptics. In other divergences from the Synoptics where the same facts are recorded, it is possible that the Gospel according to the Hebrews may relate an earlier and more reliable tradition. On the other hand, the longest quotation, which gives a version of Christ\'s interview with the Rich Young Ruler, would seem to show, as Westcott suggests, that the Synoptics give the simpler and therefore the earlier form of the common narrative. Many scholars, however, allow that the few surviving quotations of this gospel should be taken into account in constructing the life of Christ. The Ebionites gave the name of Gospel of the Hebrews to a mutilated gospel of Matthew. This brings us to the heretical gospels.<P>II. Heretical Gospels.<P>1. Gospel of the Ebionites:<P>The Ebionites may be described generally as Jewish Christians who aimed at maintaining as far as possible the doctrines and practices of the Old Testament and may be taken as representing originally the extreme conservative section of the Council of Jerusalem mentioned in <a onClick="return mV(\'Act\',15,\'1-29\');">Ac 15:1-29</a>. They are frequently mentioned in patristic literature from the 2nd to the 4th centuries, and the prolonged Gnostic controversies of those times may well have founded among them different sects or at least parties. Accordingly Jerome, a writer of the 4th century, states (Ep ad August. 122 13) that he found in Palestine Jewish Christians known as Nazarenes and Ebionites. Whether these were separate sects or simply supporters of more liberal or narrower views of the same sect cannot well be determined. Some, such as Harnack and Uhlhorn, have held that the two names are general designations for Jewish Christians; others regard the Ebionites as the most retrograde and the narrowest of Jewish Christians, while the Nazarenes were more tolerant of difference of belief and practice.<P>The Gospel of the Ebionites or the Gospel of the Twelve Apostles, as it was also called, represented along with the Gospel of the Hebrews (noticed above) this Judeo-Christian spirit. Some fragments of the Gospel of the Ebionites are preserved in Epiphanius (d 376). He speaks of the Nazarenes as "having the Gospel according to Matthew in a most complete form, in Hebrew" (i.e. Aramaic), though he immediately adds that he does not know whether "they removed the genealogies from Abraham to Christ," that is to say, whether they accepted or rejected the virgin birth of Christ. In contrast with this statement he says that the Ebionites had a gospel "called the Gospel according to Matthew, not entire and perfectly complete, but falsified and mutilated, which they call the Hebrew gospel." The extant fragments from the gospel are given in Westcott (Intro, 437f). They "show that its value is quite secondary and that the author has simply compiled it from the canonical, and especially from the Synoptic Gospels, adapting it at the same time to the views and practices of Gnostic Ebionism" (DCG, I, 505).<P>2. Gospel of the Egyptians:<P>Three short and somewhat mystic verses are all that are left of what is known as the Gospel of the Egyptians. They occur in Book III of the Stromateis of Clement of Alexandria, who devoted that book to a refutation of Encratism, that is, the rejection, as absolutely unlawful, of the use of marriage, of flesh meat and of wine. Already in the Pauline Epistles are met parties with the cry (<a onClick="return mV(\'Col\',2,21);">Col 2:21</a>) "Handle not, nor taste, nor touch," and (<a onClick="return mV(\'1Ti\',4,3);">1Ti 4:3</a>) "forbidding to marry, and commanding to abstain from meats." The verses in Clement read as follows: "When Salome asked how long will death prevail? The Lord said, As long as ye women bear children: for I have come to destroy the function of women. And Salome said to him. Did I not well then in not bearing children? And the Lord answered and said, Eat of every herb, but do not eat of that which is bitter. And when Salome asked when the things would be known about which she had inquired, the Lord said, When ye trample on the garment of shame, and when the two shall be one, and the male with the female neither male nor female." The words assuredly vary much from the usual character of those of our Lord. Modern writers vary as to their encratite tendency and as to how far the Gospel of the Egyptians was practical. With so little to go upon, it is not easy to form a conclusion. It may have contained other passages on account of which Origen deemed it heretical. It was used by the Naassenes and Sabellians. The date of the Gospel is between 130 and 150.<P>3. Gospel of Marcion:<P>The Gospel of Marcion would seem to have been intended as a direct counteractive to the Aramaic gospels. A native of Pontus and the son of a bishop, Marcion settled at Rome in the first half of the 2nd century and became the founder of the anti-Jewish sect that acknowledged no authoritative writings but those of Paul. This work forms a striking example of what liberties, in days before the final formation of the canon, could be taken with the most authoritative and the most revered documents of the faith, and also as showing the free and practically unlimited nature of the controversy, of which the canon as finally adopted was the result. He rejected the Old Testament entirely, and of the New Testament retained only the Gospel of Luke, as being of Pauline origin, with the omission of sections depending on the Old Testament and ten epistles of Paul, the pastoral epistles being omitted. The principal Church Fathers agree upon this corruption of Luke\'s Gospel by Marcion; and the main importance of his gospel is that in modern controversy it was for some time assumed to be the original gospel of which Luke\'s Gospel was regarded as merely an expansion. The theory was shown first in Germany and afterward independently in England to be quite untenable. It was lately revived by the author of Supernatural Religion; but Dr. Sanday\'s work on The Gospels in the Second Century (chapter viii) may be said to have closed the controversy. (Compare also Salmon\'s Intro, Lect XI.)<P>4. Gospel of Peter:<P>Until about a quarter of a century ago no more was known of the Gospel of Peter than of the crowd of heretical gospels referred to above. From Eusebius (Historia Ecclesiastica, VI, 12, 2) it was known that a Gospel of Peter was in use in the church of Rhossus, a town in the diocese of Antioch at the end of the 2nd century, that controversy had arisen as to its character, and that after a careful examination of it Serapion, bishop of Antioch (190-203), had condemned it as docetic. Origen (died 253 AD), in his commentary on <a onClick="return mV(\'Mat\',10,17);">Mt 10:17</a>, refers to the gospel as saying that "there are certain brothers of Jesus, the sons of Joseph by a former wife, who lived with him before Mary." Eusebius further in Eusebius, Historia Ecclesiastica, III, 3, 2 knows nothing of the Gospel according to Peter being handed down as a catholic writing, and in Eusebius, Historia Ecclesiastica, III, 25, 6 he includes the Gospel of Peter among the forged heretical gospels. Theodoret, one of the Greek ecclesiastical historians (390-459), says that the Nazarenes used a gospel called "according to Peter."<P>The gospel is also referred to in Jerome (De Viris Illustr., chapter 1) and it is condemned by the Decretum Gelasianum (496?). Salmon (Intro, 231) remarks: "Of the book no extracts have been preserved, and apparently it never had a wide range of circulation." These words were written in 1885. In the following year the French Archaeological Mission, working in upper Egypt, found in a tomb, supposed to be a monk\'s, at Akhmim (Panopolis), a parchment containing portions of no less than three lost Christian works, the Book of Enoch, the Gospel of Peter and the Apocalypse of Peter. These were published in 1892 and have given rise to much discussion. The gospel has been carefully reproduced in facsimile and edited by competent scholars The fragment is estimated to contain about half of the original gospel. It begins in the middle of the history of the Passion, Just after Pilate has washed his hands from all responsibility and ends in the middle of a sentence when the disciples at the end of the Feast of Unleavened Bread were betaking themselves to their homes "But I (Simon Peter, the ostensible writer) and Andrew my brother took our nets and went to the sea; and there was with us Levi the son of Alpheus whom the Lord. ...." Harnack (Texte und Untersuchungen, IX, 2, 2nd edition, 76) exhibits about thirty new traits contained in the Petrine account of the Passion and burial.<P>These are given in detail in an additional volume of the Ante-Nicene Library: Recently Discovered manuscripts, etc., Edinburgh, 1897. But Dr. Swete (Gospel of Peter, xv, London, 1893) shows that "even details which seem to be entirely new or which directly contradict the canonical narrative, may have been suggested by it"; and he concludes that notwithstanding the large amount of new matter which it contains, "there is nothing in this portion of the Petrine Gospel which compels us to assume the use of sources other than the canonical gospels." To Professor Orr (NT Apocryphal Writings, xixf) the Gnostic origin of the gospel seems clear in the story given of the Resurrection; and its docetic character—that is, that it proceeded from those who held that Christ had only the semblance of a body—from the statement that on the cross Jesus was silent as one who felt no pain, and from the dying cry from the cross, "My power, my power, thou hast forsaken me," the really Divine Christ having departed before the crucifixion. The date of the gospel has been placed by some in the first quarter, and by others in the third quarter, of the 2nd century. For the other newly discovered "Sayings of Jesus," see <a href="./study/isbe/search.html?string=LOGIA">LOGIA</a>.<P>5. Gospel of the Twelve Apostles:<P>A Gospel of the Twelve is mentioned by Origen (Hom. I, in Luc), and a few fragments of it are preserved by Epiphanius (Haerea, 39 13-16,22). It commenced with the baptism, and was used by the Ebionites. It was written, Zahn thinks, about 170 AD.<P>6. Gospel of Barnabas and Bartholomew:<P>A Gospel of Barnabas and Gospel of Bartholomew are condemned in the decree of Pope Gelasius. The latter is mentioned by Jerome (Prooem ad Matt).<P>III. Supplementary or Legendary Gospels.<P>In all of the gospels of this class it is noteworthy that considering the desire of the writers of non-canonical gospels to multiply miracles, no notice is taken of the period in the life of Christ that intervened between his twelfth year and his thirtieth. The main reason for the omission probably is that no special dogmatic end was to be served by the narrative of this period of the Saviour\'s life. Where access cannot be had to these documents in their original languages, it may be useful to point out that a good and full translation of them may be found in Vol XVI of Clark\'s Ante-Nicene Library, Edinburgh, 1870.<P>1. Gospels of the Nativity:<P>(a) The Protevangelium of James.<P>The earliest of these documents is the Protevangelium of James. James is supposed to be the Lord\'s brother. The title "Protevangelium" or First Gospel—a catching title which assumes much and suggests more—was given to this document by Postellus, a Frenchman, who first published it in Latin in the year 1552. In the Greek and Syriac manuscripts, it is known by various other titles, such as, The History of James concerning the Birth of the All-Holy and Ever-Virgin Mother of God and of Her Son Jesus Christ. Tischendorf in the notes to chapter i of his Evang. Apocrypha gives a long list of the names descriptive of it in the various manuscripts. In the Gelasian Decree depriving it of canonical authority it is simply styled Evangelium nomine Jacobi minoris apocryphum. In this document the birth of Mary is foretold by angelic announcement to her parents, Joachim and Anna, as was that of Jesus to Mary. It contains in twenty-five chapters the period from this announcement to the Massacre of the Innocents, including accounts of the early training of Mary in the temple, the Lukan narrative of the birth of Christ with some legendary additions, and the death of Zacharias by order of Herod for refusing to give information regarding the place of concealment of Elisabeth and the child John who, in their flight during the massacre, are miraculously saved by the opening of a mountain.<P>At chapter 18 a change takes place in the narrative from the third to the first person, which has been taken (NT Apocrypha Writings by Professor Orr, D.D., London, 1903) to suggest an Essenian-Ebionitic origin for the document, and at least to argue for it a composite character, which again may account for the great variety of views taken of its date. It has been assigned (EB, I, 259) to the 1st century. Zahn and Kruger place it in the first decade, many scholars in the second half of the 2nd century; while others (e.g. Harnack) place it in its present form as late as the middle of the 4th century. Good scholars (Sanday, The Gospels in the Second Century) admit references to it in Justin Martyr which would imply that possibly in some older form it was known in the first half of the 2nd century. In its latest forms the document indicates the obvious aim of the writer to promote the sanctity and veneration of the Virgin. It has been shown to contain a number of unhistorical statements. It was condemned in the Western church by Popes Damasus (382), Innocent I (405) and by the Decretum Gelasianum (496?). It would seem as if the age thus deprived of the Protevangelium demanded some document of the same character to take its place.<P>(b) Pseudo-Matthew.<P>A forged correspondence between Jerome and two Italian bishops supplied a substitute in the Gospel of the Pseudo-Matthew, which Jerome was falsely represented to have rendered in Latin from the original Hebrew of Mt. The gospel is known only in Latin and, as already indicated, is not earlier than the 5th century. The Protevangelium is freely used and supplemented from some unknown (probably Gnostic) source, and further miracles especially connected with the sojourn in Egypt have been wrought into it with others added from the Childhood Gospel of Thomas. Some of the miracles recorded of Egypt are represented as fulfillments of Old Testament prophecy, as when (chapter 18) the adoration of the infant Jesus by dragons recalls the fulfillment of what was said by David the prophet: "Praise the Lord from the earth, ye dragons: ye dragons and all ye deeps"; or as when (chapter 19) lions and panthers adored them, showing the company the way in the desert, "bowing their heads and wagging their tails and adoring Him with great reverence," which was regarded as a fulfillment of the prophecy: "Wolves shall feed with lambs and the lions and the ox shall eat straw together." In this gospel, too, appears for the first time the notice of the ox and the ass adoring the child Jesus in the manger, of which much was made in Christian art The gospel is further eked out by the relation of several of the miracles connected with the Gospel of the Childhood.<P>(c) The Nativity of Mary.<P>The Gospel of the Nativity of Mary was written in Latin. It goes over much the same ground as the earlier portion of the Pseudo-Matthew, but so differs from it as to indicate a later date and a different author. It includes more of the miraculous element and daily angelic visits to Mary during her residence in the temple. This gospel makes Mary leave the temple in her 14th year; according to the gospel next described, where the narrator is represented as the Son of Mary Himself, she left the temple in her 12th year, having lived in it nine years. It was for long held to be the work of Jerome, and from this gospel was almost entirely formed the "Golden Legend" which largely took the place of the Scriptures in the 13th century. throughout Europe before the invention of printing. It was among the books early printed in some countries where (as in England) it might not be safe to print the Scriptures. Its services to medieval literature and art should not blind us to the fact that it was a forgery deliberately introduced into the service of the church about the 6th century, when the worship of Mary was specially promoted in the church.<P>(d) Gospel of Joseph the Carpenter.<P>To the same class of compositions belongs the Gospel of Joseph the Carpenter. Originally written in Coptic, it was translated into Arabic, in which language with a Latin version it was published in 1722. The composition is devoted to the glorification of Joseph, a cult which was specially favored by the monophysite Coptics. It dates from the 4th century. It contains in 22 chapters the whole history of Joseph and relates in the last part the circumstances of his death at the age of 111 years. These are of some importance for the history of dogma.<P>(e) The Passing of Mary.<P>Transitus Mariae: although not strictly a gospel of the Nativity notice may here be taken of the account of John the Theologian of the Falling Asleep (koimesis) of the Holy Mother of God or as it is more commonly called "the Passing of Mary" (transitus Mariae). It was originally written in Greek, but appears also in Latin and several other languages. Two years, it seems, after the ascension of Jesus, Mary, who paid frequent visits to the, "Holy tomb of our Lord to burn incense and pray" was persecuted by the Jews and prayed her Son that He would take her from the earth. The archangel Gabriel brings an answer to her prayers and announces that after three days she shall go to the heavenly places to her Son, into true and everlasting life. Apostles from their graves or from their dioceses are summoned to her bedside at Bethlehem and relate how they were occupied when the summons reached them. Miracles of healing are wrought round the dying bed; and after the instantaneous transportation of Mary and the attendant apostles to Jerusalem, on the Lord\'s Day, amidst visions of angels Christ Himself appears and receives her soul to Himself. Her body is buried in Gethsemane and thereafter translated to Paradise. Judged by its contents which reveal an advanced stage of the worship of the Virgin and also of church ritual, the document cannot have been produced earlier than the end of the 4th or the beginning of the 5th century, and it has a place among the apocryphal documents condemned by the Gelasian Decree. By this time indeed it appears as if the writers of such documents assumed the most unrestricted license in imagining and embellishing the facts and situations regarding the gospel narrative.<P>2. The Gospels of the Infancy or Childhood:<P>(a) Gospel of Thomas.<P>Next to the Protevangelium the oldest and the most widely spread of the apocryphal gospels is the Gospel of Thomas. It is mentioned by Origen and Irenaeus and seems to have been used by a Gnostic sect of the Nachashenes in the middle of the 2nd century. It was docetic as regards the miracles recorded in it and on this account was also acceptable to the Manichees. The author was one of the Marcosians referred to by Irenaeus. Great variations exist in the text, of which there are only late catholic recasts, two in Greek, one in Latin and one in Syriac. One of the Greek versions is considerably longer than the other, while the Latin is somewhat larger than either. They are very largely concerned with a record of miracles wrought by Jesus before He was 12 years of age. They depict Jesus as an extraordinary but by no means a lovable child. Unlike the miracles of the canonical Gospels those recorded in this gospel are mainly of a destructive nature and are whimsical and puerile in character. It rather shocks one to read them as recorded of the Lord Jesus Christ.<P>The wonder-worker is described by Renan as "un gamin omnipotent et omniscient," wielding the power of the Godhead with a child\'s waywardness and petulance. Instead of being subject to His parents He is a serious trouble to them; and instead of growing in wisdom He is represented as forward and eager to teach His instructors, and to be omniscient from the beginning. The parents of one of the children whose death He had caused entreat Joseph, "Take away that Jesus of thine from this place for he cannot dwell with us in this town; or at least teach him to bless and not to curse." Three or four miracles of a beneficent nature are mentioned; and in the Latin gospel when Jesus was in Egypt and in his third year, it is written (chapter 1), "And seeing boys playing he began to play with them, and he took a dried fish and put it into a basin and ordered it to move about. And it began to move about. And he said again to the fish: \'Throw out the salt which thou hast, and walk into the water.\' And it so came to pass, and the neighbors seeing what had been done, told it to the widowed woman in whose house Mary his mother lived. And as soon as she heard it she thrust them out of her house with great haste."<P>As Westcott points out in his Introduction to the Study of the Gospels, 444,"In the apocryphal miracles we find no worthy conception of the laws of providential interference; they are wrought to supply present wants or to gratify present feelings, and often are positively immoral; they are arbitrary displays of power, and without any spontaneity on our Lord\'s part or on that of the recipient." Possibly the compilers of the 1st-century narratives above mentioned had in many cases deemed it expedient to make the miraculous an essential—even a too prominent—part of their story; and this may be the reason why John in the opening of the Fourth Gospel declared all the reported miracles of the Childhood to be unauthorized by the statement that the first miracle was that performed, after the beginning of the public ministry, at the marriage at Cana of Galilee. "This beginning of his signs did Jesus in Cana of Galilee, and manifested his glory; and his disciples believed on him" (<a onClick="return mV(\'Jhn\',2,11);">Joh 2:11</a>).<P>(b) Arabic Gospel of the Childhood.<P>The Arabic Gospel of the Childhood is a composite production. Though first published in Arabic with a Latin translation in 1697, its Syriac origin may be inferred from the use of the era of Alexander the Great in chapter 2, from the acquaintance of the writer with oriental learning, and from that of the child Jesus, when in Egypt, with astronomy and physics. The popularity of the book among the Arabs and Coptics in Egypt may also be explained by the fact that the most important of its miracles take place during the Sojourn in Egypt. It is noteworthy also that according to this gospel (chapter 7) it was on the ground of a prophecy of Zoroaster regarding the birth of the Messiah that the Magi undertook their journey to Bethlehem. Some of its stories also appear in the Koran and in other Mohammedan writings. Chapters 1-9 are based on the canonical Gospels of Matthew and Luke and on the Protevangelium of James, while chapters 26 to the end are derived from the Gospel of Thomas. The intermediate portion of the work is thoroughly oriental in character and reads like extracts from the Arabian Nights. It is not easy to treat seriously the proposal to set productions like these on anything approaching equality with the canonical Gospels. The gospel also has much to do with the growth of the veneration of the Virgin.<P>3. Gospels of the Passion and Resurrection:<P>(a) Gospel of Peter (as above).<P>(b) Gospel of Nicodemus.<P>The principal documents in this connection are the Gospel of Nicodemus and to some extent, as above shown, the Gospel of Peter. The Gospel of Nicodemus is a name given not earlier than the 13th century to a duplicate composition the two parts of which were<P>(1) the Acta Pilati or Acts of Pilate and<P>(2) the Descent of Christ to the Lower World. The document professes to be a translation into Greek from the Hebrew, and to have been made in the 17th year of the emperor Theodosius and the 6th of Valentinian. It exists in six forms, two Greek and one Latin of the Acts of Pilate, and two Latin and one Greek of the Descent to the Lower World. The general consensus of scholars places the composition in the 5th century, though Tischendorf, relying upon references in Justin and Tertullian, places it in the 2nd century, a date by which it is quite possible for the legend to have arisen. Possibly there has been some confusion between the report on the proceedings connected with the trial and crucifixion of Jesus that had to be furnished to the emperor, as required by the rules of the Roman civil service, and the extended record of the proceedings contained in the Gospel of Nicodemus. The writer was obviously a Jewish Christian. He wrote for this class and was anxious to establish his record by evidence from the mouths of the enemies of Jesus and especially of the officials connected with the events before and after the death of Jesus.<P>(1) Acts of Pilate<P>Pilate in particular is shown to be favorable to Jesus and—a gap that must have struck many readers of the canonical narratives—several of those on whom miracles of healing had been wrought come forward to give evidence in favor of Jesus—a most natural step for a late narrator to suppose as having taken place in a regular and formal trial, but one which, as may be gathered from the silence of the canonical writers, was omitted in the turbulent proceedings of the priestly conspiracy that ended with the crucifixion. With all the writer\'s acquaintance with Jewish institutions "he shows himself in many points ignorant of the topography of Palestine; thinks, e.g. that Jesus was crucified in the garden in which he was seized (chapter 9) and places Mt. Mamilch or Malek (S. of Jerusalem) in Galilee, and confounds it with the Mount of Ascension" (Orr, op. cit., xix).<P>(2) Descent of Jesus into the Lower World<P>The second part of the gospel—The Descent of Christ to the Lower World—is an account of an early and widely accepted tradition not mentioned in any canonical Gospel but based upon <a onClick="return mV(\'1Pe\',3,19);">1Pe 3:19</a>: "He went and preached unto the spirits in prison." Two saints who were raised at His resurrection relate how they had been confined in Hades when the Conqueror appeared at its entrance, how the gates of brass were broken and the prisoners released, Jesus taking with Him to Paradise the souls of Adam, Isaiah, John the Baptist and other holy men who had died before Him. The document is purely imaginary: its only importance is in showing how this article of the creed was regarded in the 4th century.<P>(c) Other Fabrications.<P>Of even less importance are some late fabrications referring to Pilate sometimes in the manuscripts attached to the Gospel of Nicodemus, such as Pilate\'s Letter to the emperor Tiberius; Pilate\'s Official Report, above referred to; the Paradoses of Pilate and the Death of Pilate, who, after condemnation to the most disgraceful death, is represented as dying by his own hand. In the Narrative of Joseph of Arimathea the writer gives a loose rein to his imagination.<P>The study of the documents above described fully justifies the observation of the editors of the Ante-Nicene Library that while they afford us "curious glimpses of the state of the Christian conscience, and of modes of thought in the first centuries of our era, the predominant impression which they leave on our minds is a profound sense of the immeasurable superiority, the unapproachable simplicity and majesty, of the Canonical Writings."<P>LITERATURE.<P>In addition to the books quoted above may be mentioned the following: Fabricius, Codex Apocryphus, 1719; the collections and prolegomena of Thilo (1832); Tischendorf, Gospels, 1853, Ellicott, "On the Apocryphal Gospels" in Cambridge Essays, 1856; Lipsius, article "Gospels (Apocrypha)" in Dict. of Christ. Biog.; Dr. W. Wright in Journal of Sacred Lit. (January and April, 1865) on the Syriac versions of the Protevangelium, The Gospel of Thomas, and the Transitus Mariae: Studia Sinaitica (No. XI, 1902) giving new Syriac texts of the Protevangelium and Transitus Mariae. A. F. Findlay, article "Acts (Apocrypha)," where will be found a very copious body of references to works, British and foreign, dealing with all branches of the subject.``1';
isbe[614]='Apollonia`ap-o-lo\'-ni-a (Apollonia): A town in Mygdonia, a district in Macedonia. It was situated a little to the south of Lake Bolbe, on the Via Egnatia, the great Roman road leading from the coast of the Adriatic to the river Hebrus (Maritza), one of the main military and commercial highways of the empire: it lay between Amphipolis and Thessalonica, a day\'s journey (Livy xlv.28) or about 30 Roman miles from the former and 38 from the latter. The foundation of the town may perhaps be attributed to about 432 BC; in any case, coins are extant which attest its existence in the 4th century BC (Head, Historia Numorum, 181). Paul and Silas passed through the town on their journey from Philippi to Thessalonica, but do not appear to have stayed there (<a onClick="return mV(\'Act\',17,1);">Ac 17:1</a>). The name seems to have survived in the modern Pollina (Leake, Northern Greece, III, 458; Cousinery, Voyage dans la Macedoine, I, 115).``176';
isbe[615]='Apollonius`ap-o-lo\'-ni-us (Apollonios): A common name among the Syro-Macedonians. Prideaux (Connexion) interrupts his narrative of the year 148 BC to give an account of the different persons who bore this name<P>(1) Son of Thrasaeus (2Macc 3:5) who was governor of Coele-Syria (Palestine and Phoenicia) under Seleucus Philopator, when Heliodorus came to Jerusalem to rob the temple, and afterward, by his authority in that province, supported Simon the governor of the temple at Jerusalem against Onias the high priest. He was also chief minister of state to King Seleucus. But on the accession of Antiochus Epiphanes, Apollonius, in some way becoming obnoxious to the new king, left Syria and retired to Miletus.<P>(2) A son of (1) who, while his father resided at Miletus, was brought up at Rome along with Demetrius, son of Seleucus Philopator, and at that time held as a hostage by the Romans. This Apollonius lived in great intimacy with Demetrius, who, on recovering the crown of Syria, made him governor of Coele-Syria and Phoenicia, the same government which his father held under Seleucus Philopator. He seems to have been continued in the same government by Alexander (1Macc 10:69) but he revolted from him to embrace the interest of Demetrius.<P>(3) Son of Menestheus, and favorite and chief minister of Antiochus Epiphanes (2Macc 4:21). He went as ambassador from Antiochus, first to Rome (Livy xlii.6) and afterward to Ptolemy Philometor, king of Egypt (2Macc 4:21). This is generally held to be the same who is said to have been over the tribute (1Macc 1:29; 2Macc 5:24) and who, on the return of Antiochus from his last expedition into Egypt, was sent with a detachment of 22,000 men to destroy Jerusalem. He attacked the Jews while keeping the Sabbath day holy and slew great multitudes of them (2Macc 5:24-27).<P>(4) Governor of Samaria in the time of Antiochus Epiphanes. He was slain in battle by Judas Maccabeus (1Macc 3:10,11; Ant, XII, vii, 10). (5) Son of Gennaeus (2Macc 12:2); as governor of a toparchy in Palestine under Antiochus Eupator he proved a bitter enemy of the Jews.``79';
isbe[616]='Apollophanes`ap-o-lof\'-a-nez, a-pol-o-fa\'-nez (Apollophanes): A Syrian killed by Judas Maccabeus (2Macc 10:37).``1';
isbe[617]='Apollos`a-pol\'-os (Apollos, the short form of Apollonius): Apollos was a Jew of Alexandrian race (<a onClick="return mV(\'Act\',18,24);">Ac 18:24</a>) who reached Ephesus in the summer of 54 AD, while Paul was on his third missionary journey, and there he "spake and taught accurately the things concerning Jesus" (<a onClick="return mV(\'Act\',18,25);">Ac 18:25</a>). That he was eminently fitted for the task is indicated by the fact of his being a "learned man," "mighty in the scriptures," "fervent in spirit," "instructed in the way of the Lord" (<a onClick="return mV(\'Act\',18,24,25);">Ac 18:24-25</a>). His teaching was however incomplete in that he knew "only the baptism of John" (<a onClick="return mV(\'Act\',18,25);">Ac 18:25</a>), and this has given rise to some controversy. According to Blass, his information was derived from a written gospel which reached Alexandria, but it was more probably the fruits of what Apollos had heard, either directly or from others, of the preaching of John the Baptist at Bethany beyond Jordan (compare <a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>). Upon receiving further instruction from Priscilla and Aquila (<a onClick="return mV(\'Act\',18,26);">Ac 18:26</a>), Apollos extended his mission to Achaia, being encouraged thereto by the brethren of Ephesus (<a onClick="return mV(\'Act\',18,27);">Ac 18:27</a>).<P>In Achaia "he helped them much that had believed through grace; for he powerfully confuted the Jews, and that publicly, showing by the scriptures that Jesus was the Christ" (<a onClick="return mV(\'Act\',18,27,28);">Ac 18:27-28</a>). During Apollos\' absences in Achaia, Paul had reached Ephesus and learned of what had been taught by Apollos there. (<a onClick="return mV(\'Act\',19,1);">Ac 19:1</a>). Since Paul was informed that the Ephesians still knew nothing of the baptism of the Spirit (<a onClick="return mV(\'Act\',19,\'2-4\');">Ac 19:2-4</a>), it is probable that Apollos had not imparted to his hearers the further instruction he had received from Priscilla and Aquila, but had departed for Achaia shortly after receiving it. Paul remained upward of two years among the Ephesians (<a onClick="return mV(\'Act\',19,8,10);">Ac 19:8, 10</a>), and in the spring of 57 AD he wrote the First Epistle to the Corinthians. By this time Apollos was once more in Ephesus (compare <a onClick="return mV(\'1Cr\',16,12);">1Co 16:12</a>). It is incredible that this epistle of Paul could have been prompted by any feelings of jealousy or animosity on his part against Apollos. It was rather the outcome of discussion between the two regarding the critical situation then existing in Corinth.<P>The mission of Apollos had met with a certain success, but the breeding of faction, which that very success, through the slight discrepancies in his teaching (compare <a onClick="return mV(\'1Cr\',1,12);">1Co 1:12</a>; <a onClick="return mV(\'1Cr\',3,4);">3:4</a>) with that of Paul or of Cephas, had engendered, was utterly alien to his intentions. The party spirit was as distasteful to Apollos as it was to Paul, and made him reluctant to return to the scene of his former labors even at the desire of Paul himself (<a onClick="return mV(\'1Cr\',16,12);">1Co 16:12</a>). The epistle voiced the indignation of both. Paul welcomed the cooperation of Apollos (<a onClick="return mV(\'1Cr\',3,6);">1Co 3:6</a>: "I planted, Apollos watered"). It was not against his fellow-evangelist that he fulminated, but against the petty spirit of those who loved faction more than truth, who saw not that both he and Apollos came among them as "God\'s fellow-workers" (<a onClick="return mV(\'1Cr\',3,9);">1Co 3:9</a>), the common servants of the one Lord and Saviour Jesus Christ.<P>This view is also borne out by the tenor of Clement\'s Epistle to the Corinthians (compare Hennecke, Neutestamentliche Apokryphen, 84-112, especially 105): nor does it conflict with the passages <a onClick="return mV(\'1Cr\',12,\'1-7\');">1Co 12:1-7</a>; <a onClick="return mV(\'2Cr\',3,1);">2Co 3:1</a>; <a onClick="return mV(\'2Cr\',11,16);">11:16</a>, where Paul seems to allude to Apollos\' eloquence, wisdom, and letter of commendation. Paul wrote thus not in order to disparage Apollos but to affirm that, even without these incidental advantages, he would yield to none in the preaching of Christ crucified.<P>The last mention of Apollos is in the Epistle to Titus, where he is recommended along with Zenas to Titus (<a onClick="return mV(\'Tts\',3,13);">Titus 3:13</a>). He was then on a journey through Crete (<a onClick="return mV(\'Tts\',3,15);">Titus 3:15</a>), and was probably the bearer of the epistle. The time of this is uncertain, as the writing of the Epistle to Titus, though generally admitted to have been after the release of Paul from imprisonment at Rome, has been variously placed at 64-67 AD.`<a href="./study/isbe/search.html?string=TITUS+EPISTLE+TO">TITUS, EPISTLE TO</a>`1';
isbe[618]='Apollyon`a-pol\'-i-on (Apolluon; \'abhaddon, "destroyer"): Present participle of the verb apolluo, "to destroy."<P>I. Definition.<P>A proper name, original with the author of the Apocalypse and used by him once (<a onClick="return mV(\'Rev\',9,11);">Re 9:11</a>) as a translation of the Hebrew word "Abaddon" (see <a href="./study/isbe/search.html?string=ABADDON">ABADDON</a>) to designate an angel or prince of the lower world.<P>II. Old Testament Background.<P>1. Fundamental Meaning:<P>The term Abaddon ("destruction") appears solely in the Wisdom literature of the Old Testament and in the following narrow range of instances: <a onClick="return mV(\'Job\',26,6);">Job 26:6</a>; <a onClick="return mV(\'Job\',28,22);">28:22</a>; <a onClick="return mV(\'Job\',31,12);">31:12</a>; <a onClick="return mV(\'Psa\',88,11);">Ps 88:11</a>; <a onClick="return mV(\'Pro\',15,11);">Pr 15:11</a>. In all these passages save one (<a onClick="return mV(\'Job\',31,12);">Job 31:12</a>) the word is combined either with Sheol, "death," or "the grave," in such a way as to indicate a purely eschatological term based upon the advanced idea of moral distinctions in the realm of the dead. In the one exceptional passage (<a onClick="return mV(\'Est\',8,6);">Es 8:6</a> is incorrectly referred to—the word here is different, namely, \'abhedhan) where the combination does not occur, the emphasis upon the moral element in the "destruction" mentioned is so definite as practically to preclude the possibility of interpreting the term in any general sense (as Charles, HDB, article "Abaddon"; per con., Briggs, ICC, "Psalms" in the place cited.; BDB, sub loc.). The meaning of the word, therefore, is: the place or condition of utter ruin reserved for the wicked in the realm of the dead.<P>2. Personification:<P>One other feature of Old Testament usage is worthy of consideration as throwing light upon <a onClick="return mV(\'Rev\',9,11);">Re 9:11</a>. Abaddon and the accompanying terms "Death" and Sheol are personified (as in <a onClick="return mV(\'Job\',28,22);">Job 28:22</a>) and represented as living beings who speak and act (compare <a onClick="return mV(\'Rev\',6,8);">Re 6:8</a>).<P>III. New Testament Usage.<P>1. The Starting-Point:<P>The starting-point of the Apocalyptist\'s use of "Apollyon" is to be found in the fundamental meaning of "Abaddon" as moral destruction in the underworld, together with the occasional personification of kindred terms in the Old Testament. The imagery was in general terms familiar while the New Testament writer felt perfectly free to vary the usage to suit his own particular purposes.<P>2. Apollyon not Satan but Part of an Ideal Description:<P>(1) Since Apollyon is a personification he is not to be identified with Satan (compare <a onClick="return mV(\'Rev\',9,1);">Re 9:1</a> where Satan seems to be clearly indicated) or with any other being to whom historical existence and definite characteristics are ascribed. He is the central figure in an ideal picture of evil forces represented as originating in the world of lost spirits and allowed to operate destructively in human life. They are pictured as locusts, but on an enlarged scale and with the addition of many features inconsistent with the strict application of the figure (see <a onClick="return mV(\'Rev\',9,\'7-10\');">Re 9:7-10</a>). The intention is, by the multiplication of images which the author does not attempt to harmonize, to convey the impression of great power and far-reaching destructiveness.<P>(2) This interpretation finds additional support in the writer\'s significant departure from the familiar usage. In the Old Testament the place of destruction is personified—in <a onClick="return mV(\'Rev\',9,11);">Re 9:11</a>, personal forces issue from the Abyss, of which the presiding genius is Destruction in person. The seer\'s picture is equally independent of the tradition represented by the Talmud (Shab f. 55) where Abaddon is personified as jointly with Death president over six destroying angels. These modifications are evidently due to the exigencies of the pictorial form. It is clearly impossible to portray forces proceeding from the place of ruin in the charge of the place itself.<P>3. Apollyon Necessary to the Picture:<P>The importance of the conception of Apollyon to the completeness of the picture should not be overlooked. It is intended to represent these forces as having a certain principle of internal unity and as possessors of the power of effective leadership.<P>4. General Significance of the Description:<P>As to the specific significance of the vision of the locusts as a whole it is not easy to reach a conclusion. Professor Swete suggests (Commentary on Apocalypse in the place cited.) that "the locusts of the abyss may be the memories of the past brought home at times of divine visitation; they hurt by recalling forgotten sins." It seems to us more probable that it represents an actual historical movement, past or to come, demoniacal in origin and character, human in the mode of its operation and the sphere of its influence, used by God for a scourge upon mankind and kept in restraint by His grace and power.`<a href="./study/isbe/search.html?string=ABADDON">ABADDON</a>`169';
