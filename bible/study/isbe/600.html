ty.<P>The reign of Berial, who has come down upon Nero and incarnated himself in him is to be three years, seven months and twenty-seven days, in all 1,335 days (Asc <a onClick="return mV(\'Isa\',41,2);">Isa 41:2</a>), the number in the end of Daniel (<a onClick="return mV(\'Dan\',12,12);">Da 12:12</a>). This number, it may be noted, is reached by reckoning the years and months according to the Julian Calendar, proving this Apocalypse to have been written in Rome. But the number is singularly near the actual duration of Nero\'s reign after the persecution had begun. From the burning of Rome (July 19, 64) to the death of Nero (June 9, 68) was 1,421 days—that is, 86 days more. It was at least a month after the conflagration that the persecution began, and longer till the mad orgy of cruelty when Christians wrapt in pitch and set on fire illuminated Nero\'s gardens. If a Christian in Rome saw the persecution, he might hope for the end of this reign of terror, and fix on the number he found in Daniel. It would seem that already the 1,290 days had been overpassed, so he hopes that the 1,335 days will see the end of the tyrant.<P>There is a difficulty in the 332 days of Ascension of <a onClick="return mV(\'Isa\',41,4);">Isa 41:4</a>. The temptation is great to hold with Lucke, Dillmann and Charles that 1,000 has dropped out, and that the last figure ought to be 5; then we have the same number. In that case, this Apocalypse must have been written after the news of the rebellion of Vindex had reached Rome, but before the death of Nero. If we may adopt this—though the fact that the shorter number is found in all three Ethiopic manuscripts makes this method of adding a figure necessary to an explanation one to be avoided—this would point to the time immediately preceding Nero\'s death. The difficulty is, where dad the author get the number? If it is correct, it is probably the arithmogram of some name of Satan. Berial gives 322 by gematria. It would seem that another mark of time is given in the martyrdom of Peter, which may be dated 64 AD. Another negative note is the absence of any reference to the fall of Jerusalem. Had it happened, Jew though the writer was, his love for his crucified Master would have led him to see the vengeance of heaven on the city which had put Him to death, and exult in it. It must have been written in the course of the year 68.<P>5. The Fourth Book of Esdras:<P>Unlike the books we have been discussing hitherto, 4 Esdras has never disappeared from the knowledge of the church. It has, however, come down to us primarily in a Latin translation of a Greek original. Archbishop Laurence discovered an Ethiopic version of it. Later an Armenian version with Latin translation was published in Venice. An Arabic version is also in existence. It was received into the Apocrypha of the Anglican church, though excluded from that of Germany; by the Council of Trent, 1Esdras and 2Esdras of our Apocrypha were excluded from the Roman Catholic canon, and placed after Revelation, along with Pr Man.<P>(1) Summary.<P>The first two chapters contain a prophecy after the model of Isaiah. Not a few passages show the influence of the New Testament on it. Compare 2 (4) Esdras 1:30 with <a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>, and 2 (4) Esdras 2:45 with <a onClick="return mV(\'Rev\',7,13);">Re 7:13</a>. With 2 (4) Esdras 3 there is a new beginning. This opens with a prayer which occupies the whole chapter. In answer, Uriel is sent from God and reveals to Ezra by various symbols the plan of God in regard to Israel. This goes on to the middle of 2 (4) Esdras 5, and forms the first vision. After fasting seven days, a new communication is made by Uriel to Ezra. It begins as the former did with a prayer. Then follows a series of questions intended to bring out the limited understanding of man. When these are finished, Uriel gives an account of the history of the world from the creation. This vision ends with 2 (4) Esdras 6:35. The third vision is very interesting, as a large section of 70 verses had been lost, and were recovered only comparatively recently. This vision contains an account of Creation as it is in Genesis, only rhetorical expansions occur, and a full description is given of Leviathan and Behemoth. Ezra is shown the heavenly Zion in vision as difficult of access.<P>The portion recently discovered contains an account of the place of punishment, and there is mention of Paradise. The end of this is a prayer of Ezra, which seems an independent composition (2 (4) Esdras 8:20). The fourth vision begins with 4Esdras 9:26. In it Ezra is shown a woman weeping, who is interpreted to be Zion. She is transformed into a city (2 (4) Esdras 10:27). The fifth vision is the most important. It begins with an eagle appearing, which has three heads and twelve wings. This is interpreted as referring to the Roman empire. It would seem that this had been added to, as in addition to the twelve wings, eight other wings are spoken of. A lion appears who rebukes and destroys the eagle with the twelve wings. This lion is the Messiah and his kingdom. The sixth vision begins with chapter 13 and contains an account of the coming of Christ. In the seventh we have an account of the re-writing of the books at the dictation of Ezra, and the retention of the seventy secret sacred books. In what has preceded we have followed the scheme of Fritzsche. The last chapter proceeds from the same pen as do the opening chapters, and is combined with them by Fritzsche and called the Fifth Book of Esdras.<P>(2) Structure.<P>As has been indicated above, 4Esdras is marked off into several distinct portions, preceded by Ezra fasting, and introduced by a prayer on the part of the prophet. Kabisch has a more elaborate scheme than Fritzsche. Like him, he recognizes seven visions, and like him he separates off the first chapter and the last 17,15,16, as by a different hand from the rest of the book. But in addition, he recognizes additions made by a R throughout the book. To us the scheme appears too elaborate.<P>(3) Language.<P>As above mentioned, the immediate source of the Latin text appears to have been Greek. There is very little to enable us to settle the question whether Greek was the language in which this book was composed, or whether even the Greek is a translation from Hebrew or Aramaic. There are many echoes of the other Scriptures, but no direct quotations, so there is nothing to show whether the author used the Hebrew text or the Septuagint. The proper names do not supply any clue. Although there are so many versions of the Greek, they are all so paraphrastic that the Greek in most cases is not by any means certain. The few verses quoted in Greek by Clemens Alexandrinus do not afford space enough to discover through them if there is any other language behind. It possibly was written in Hebrew, as it seems to have been written in Palestine.<P>(4) Date.<P>From the tone of the book there is no doubt that it was written after the capture of Jerusalem by Titus. Had it been due to the later cataclysm, when the rebellion of Barcochba was overthrown, a Christian Jew would not have manifested such sorrow. The break between the church and the synagogue was complete by that time. Further, had this book been written under Hadrian, the previous disaster would have been referred to. Over and above the distinctly and avowedly Christian passages, there are numerous echoes of the New Testament Scriptures. The fifth vision affords notes of time which would be more unambiguous if there had not been additions made. The eagle with the three heads and twelve wings is declared to be the fourth monarchy of Daniel, and by the context this is shown to be imperial Rome.<P>The question that has exercised critics is the portion of the Roman history referred to. Lucke regarded the reference to be to rulers prominent in the time of Sulla, and the three heads to be the first triumvirate. This view implies a knowledge of Roman politics not possessed by any Jew of the pre-Christian period. Further, the echoes of New Testament language which occur (compare 2 (4) Esdras 5:1 with <a onClick="return mV(\'Luk\',18,8);">Lu 18:8</a>; <span class="noTag">2</span> (4) Esdras 6:5 with <a onClick="return mV(\'Rev\',7,3);">Re 7:3</a>, etc.) determine the decision against any idea that it was pre-Christian. The realization of the horrors of the overthrow of Jerusalem is too vivid to be the result merely of imagination. Another theory would see in the three heads the three Septimians, Severus and his sons Caracalla and Geta. This would find a place for the eight under- wings, as that is exactly the number of emperors between Domitian and Severus, if one neglects the short reign of Didius Julianus. The destruction of "the two under wings that thought to have reigned" (2 (4) Esdras 11:31) would be fulfilled in the defeat and death of pescennius Niger and Clodius Albinus.<P>The fact that it is the right-hand head that devours the head to the left fits the murder of Geta the younger son, by Caracalla, the elder. Against this view is the fact that the book is quoted by Clemens Alexandrinus. Further, the eight under-wings are said to be kings "whose times shall be small, and their years swift" (2 (4) Esdras 12:20). Though might be said of Nerva, it could not be affirmed of Trajan, Hadrian, Antoninus Plus or Marcus Aurelius. We are thus restricted to the view which maintains that the three heads are the three Flavians. The twelve wings are the first emperors, beginning with Julius Caesar. The reign of Augustus is longer than any of the monarchs that succeeded him, and it is noted that the second wing was to have that distinction (2 (4) Esdras 12:15). The date then may be placed between the death of Titus and that of Domitian—that is, from 81 to 96. The Lion who rebukes the Eagle for his unrighteousness is the Messiah—the Christ—in His second coming, when He shall come in the glory of His kingdom. The Christians had begun to doubt the speedy coming of the Master, hence He is spoken of as "kept unto the end of days" (2Esdras 12:32). Such are the Apocalypses, strictly speaking.``173';
isbe[607]='Apocalyptic Literature, 2`II. Legendary Works.<P>The Book of Jubilees:<P>The Book of Jubilees is the only one which survives of this class of composition. The portion of Ascension of Isaiah which contains the account of his martyrdom has much of this character. It, however, has been conjoined to the Apocalyptic "Ascension." It would seem that in some copies the Assumption of Moses was added to this work as a supplement. It is frequently cited as lepto Genesis—sometimes lepto-genesis, and again micro-genesis, "the little Genesis." This title cannot be meant to refer to its actual size, for it is considerably longer than the canonical book. It may either mean that this book is to be less regarded than the canonical Genesis or that it is taken up with lepta--"minutiae." Another, and possibly more plausible explanation is to be found in the Hebrew or Aramaic. There is a rabbinic book known as Bere\'shith Rabba\', in which the whole of Genesis is expanded by Midrashic additions, amplifications and explanations, to many times the size of the work before us, which, in comparison, would be Bere\'shith Zuta\'—"the small Genesis." The main difficulty is that the Jewish work, B. Rabbah, cannot well be dated earlier than 300 AD. We owe the work before us mainly—in its complete form—like so many others, to its inclusion in the canon of the Ethiopic church. Portions of it in Latin and Syriac have been found in the second main source of apocalyptic literature in recent times, the Ambrosian Library of Milan. There have been several editions of the Ethiopic text.<P>(1) Summary.<P>It is difficult to give anything like a summary of the Book of Jubilees in the ordinary sense of the word. Roughly speaking, the canonical Book of Genesis is the summary. The writer has omitted many features and incidents, but these have been more than compensated for by additions and expansions. Most of these omissions have an apologetic aim. The acts of deception of which Abraham was guilty in Egypt and toward Abimelech in regard to Sarah, the similar act of Isaac, would involve matters difficult to palliate. The way Simeon and Levi entrapped the Shechemites into being circumcised and then took advantage of their condition to murder them, is omitted also. Jacob\'s devices to increase his flocks at Laban\'s expense are also passed over in silence. The most marked omission is the blessing of Jacob in <a onClick="return mV(\'Gen\',49,\'1-\');">Ge 49</a>. This is to be explained by the way the writer has praised Simeon and Levi earlier which Jacob\'s denunciation of them flatly contradicts. Many of the additions have a similar apologetic intention, as the statement that Dinah was twelve years old at the time of the rape, the presents Jacob gave to his parents four times a year, etc. When Jacob deceives his father, he does not say he is Esau, but only "I am thy son." There are longer additions, chiefly ceremonial. Two incidents narrated at length are the warfare of the Amorites against Jacob (<a onClick="return mV(\'Gen\',34,\'1-9\');">34:1-9</a>), and the war of Esau (<a onClick="return mV(\'Gen\',37,\'1-\');">37</A> and <a onClick="return mV(\'Gen\',38,\'1-\');">38</A>).<P>(2) Structure.<P>The most marked characteristic of the book is that from which it has its most common name, "The Book of Jubilee," the dating of events by successive Jubilees. The whole history of the world is set in a framework of Jubilees and every event is dated by the Jubilee of the world\'s history in which it had occurred, and the year-week of that Jubilee and the year of that week. The writer has carried his septenary principle into the year and made the days in it, as did the writer of one of the Enoch books, a multiple of seven, 364 = 7 x 52 days. It does not seem to have been interpolated.<P>(3) Language.<P>Like so many more of the pseudepigrapha, the Ethiopic, from which our modern translations have been made, has been translated from a Greek original, which in turn has had a Semitic source. It is somewhat difficult to form a decision as to which of the two Semitic languages in use in Palestine was that in which it was composed. Certainly some, as Frankel, have maintained that it was written in Greek first of all. This is contrary to ancient evidence, as Jerome refers to the use of rissah, "a stadium," as used in the Book of Jubilees. More can be said for an Aramaic original The use of Mastema for Satan, and the plurals in "in," point in that direction. Dr. Charles\' arguments seem to us to settle the matter in favor of Hebrew. Compare the case of Jubilees 47:9, in which bath, "a daughter," is confused with bayith, "a house." One of his arguments is not so conclusive: 2:9 wahaba, "gave," appears where "appointed" is the meaning—a confusion of meanings only possible from the double meaning of nathan, as the Aramaic yahabh has the same double force: "See I have made thee (yehebhethakh) a God to Pharaoh" (compare Peshitta <span class="noTag">Ex 7:1</span>). These indications are few, but they seem sufficient.<P>(4) Date.<P>The formidable authority of Dr. Charles and that of Littmann are in favor of an early date—before the quarrel of John Hyrcanus with the Pharisees. Our reading of the history is different from that of either of these scholars. The Hassidh party had been lukewarm to the Maccabeans from the latter portion of the pontificate of Judas Maccabeus; the insult offered to Hyrcanus at his own table was the enmity reaching its height. If with Dr. Charles we assume the author to be a Pharisee, then the date is impossible. The Pharisaid party were never enthusiastic supporters of the Maccabeans, except when Alexandra threw herself into their arms. Two characteristics of this book strike the reader—its apologetic tone, and its hatred of Edom. During the time of John Hyrcanus the nation did not assume an apologetic attitude. It had thrown off the Syrian-Greek domination and repelled the attempt to Helenize its religion. It would be only Greeks, or those under Greek influences, that would necessitate the apologetic attitude. We are driven to the Herodian period when Romans abounded in the court and Greeks and Graeculi were frequent, when those who, being Jews and knowing Hebrew, yet had imbibed Hellenic culture, and readily saw the points where assault might be made on their faith and its sacred literature. This date would explain the hatred of Edom. We therefore would place it about the death of Herod—from 5 BC to 6 AD. Unlike the other books of this class, much of it has been found in the Talmud; hence, though we still think the author to have been an Essene, we think that he had much sympathy with the Pharisaic school in its latest development.``173';
isbe[608]='Apocalyptic Literature, 3`III. Psalmic Pseudepigrapha.<P>1. The Psalter of Solomon:<P>The Psalter of Solomon is the one of all the pseudepigrapha which seems to have hovered most nearly on the border of deutero-canonicity. Even 4Esdras, since not being found in Greek, scarcely can be counted an exception, as it was never admitted into the canon of Alexandria. The famous Codex Alexandrinus, as its table of contents proves, originally contained the book before us. In several catalogues of books that were acknowledged, by some at least, to be authoritative, it is named—sometimes to be declared uncanonical. Like so many other books—Jewish and Christian—during the Middle Ages, sank into oblivion. A manuscript of it was first noticed by Hoeschel the librarian in the Library at Augsburg, in the beginning of the 17th century, and published by de la Cerda in 1626. This manuscript has since been lost. More recently, four other Greek manuscripts have been brought to light. From these, with the assistance of de la Cerda\'s text, it has repeatedly been published. The name given to it, "The Psalter of Solomon," seems purely gratuitous; the writer makes no claim, direct or indirect, to be the Son of David.<P>(1) Summary.<P>The present collection consists of 18 psalms closely modeled as to line of thought and diction on the canonical Psalms. The first psalm announces the declaration of war, but is occupied with the denunciation of hypocrites. The second describes a siege of Jerusalem and acknowledges that the distresses of the siege have been deserved, but ends by the description of the death of the besieger on the coast of Egypt. The third psalm is one of thanksgiving on the part of the righteous. In the fourth we have the description and denunciation of a hypocrite in terms which suggest strongly our Lord\'s words against the Pharisees. It is evidently directed against a prominent individual member of the Sanhedrin. On the generally received date, Antipater may be the person denounced. The fifth psalm is a prayer for mercy from God and an appeal to His loving-kindness. The sixth is occupied with a description of the blessedness of the righteous.<P>The short psalm which follows is a prayer of Israel under chastisement, entreating God not to remove His tabernacle from their midst. The eighth psalm describes the siege of the temple and denounces the sins of the inhabitants of Jerusalem, which had brought the Smiter from afar against them, and a prayer for restoration to favor. Israel, a captive, prays to God for forgiveness in the ninth psalm. In the tenth we have the blessedness of the man who submits to the chastening of the Lord. The theme of the eleventh is the return of the captives. The idea of the following psalm is not unlike the middle stanza of <a onClick="return mV(\'Psa\',120,\'1-\');">Ps 120</a> of the canonical Psalter. The next has as its theme the blessedness of the righteous and the evil estate of the wicked. The fourteenth has a similar subject. The next begins with the sentiment so frequent in the canonical Pss: "When I was in trouble I called upon the Lord." The psalm which follows is experimental in the sense of the old Puritans.<P>The seventeenth psalm is the most important, as it is Messianic, and exhibits the hopes prevalent among the Jews at the time when it was written. The eighteenth gives a description of the blessedness of the return of the Jews to Divine favor. Messrs. Ryle and James would divide this psalm into two, as there seems to be a conclusion at the tenth verse with the sign diapsalma. Moreover, a slightly different theme is introduced at this point, but there is a reference in the Pistis Sophia to the 19th ps, and this is not the one implied. There seems to be some probability that a Latin translation once existed from references, though few, in the Latin Fathers; but no manuscript of it has yet been discovered. A Syriac translation has been discovered by Dr. Rendel Harris, along with a number of other psalms also attributed to Solomon, which he has called "Odes." Of these more will be said below.<P>(2) Language.<P>That the Greek of these psalms is a translation from the Hebrew may be proved by what seem to have been errors in translation, as tou eipein, "to say," where sense implies "to destroy," from the double meaning of dabhar, "to say," and later "to destroy"; heos enikese, "till he conquered," where the meaning must be "forever" or "continuously," equivalent to \'adh, la-netsach, which might be taken as in Aramaic, and translated as in the Greek. Further, the general character, the frequent occurrence of en in senses strained in Greek but suiting thoroughly the Hebrew preposition "b-", the omission of the substantive verb, the general simplicity in the structure of the sentences, serve to confirm this. For fuller elucidation the reader is directed to Ryle and James edition of this book (lxxviii-lxxxiv). Hilgenfeld has urged some arguments in favor of Greek being the original language. These really prove that the translator was very much influenced in making his translation by the Septuagint version of the canonical Psalter.<P>(3) Date.<P>While Ewald would place it back in the time of Epiphanes, if not even earlier, and Movers and Delitzsch would place it about the time of Herod, the description of the siege does not suit any siege but that of Pompey. Still more the death of the proud oppressor who besieged the Temple suits down to the minutest detail the death of Pompey, and suits that of no other. This is the opinion of Langen, Hilgenfeld, Drummond, Stanton, Schurer, Ryle and James. The psalms, however, were written at various dates between 64 BC, the year preceding the Pompeian siege, and the death of Pompey 46 BC. The common critical idea is that it is the Psalter of the Pharisees. The singular thing is that though the writer reverences the Temple, he speaks nothing of the sacrifices, and shows no horror at the dishonor of the high priests—the attitude one would expect, not from a Pharisee, but from an Essene.<P>(4) Christology.<P>The main interest of this pseudepigraphon is its Christology, which is principally to be seen in the 17th psalm. The Messiah is to be of the seed of David: He is to come on the downfall of the Asmoneans, to overthrow the Romans in turn. He is to gather the dispersed of Israel, and is to subject the Gentiles to Him rule. The character of this rule is to be spiritual, holy, wise and just. All these features indicate a preparation for the coming of Him who fulfilled the expectation of the Jews in a way which they had so little dreamed of.<P>2. The Odes of Solomon:<P>The students of Gnosticism in perusing the Pistis Sophia, one of the few literary remains left us by those bizarre heresies, found repeated quotations from the Psalter of Solomon, not one of which was to be found in the received collection. There was one numbered reference, but it was to the 19th psalm, whereas only eighteen were known to exist. Lactantius has a quotation from the Psalter of Solomon which, like those in Pistis Sophia, has no place in the "eighteen." It was obvious that there were more Solomonic writings that were called Psalms than those ordinarily known. In the beginning of 1909 the learned world was startled by the information that Dr. Rendel Harris had found on his shelves the missing Psalter of Solomon in a Syriac translation. The manuscript was defective both at the beginning and end, but there was, after all, little missing of the whole book. The title and the colophon were of course wanting. It begins with the new Psalms, or, to give them Dr. Harris\' title, "Odes," which are followed by those till now known.<P>(1) Relation to Pistis Sophia and Summary.<P>This cannot have been the order of the time when Pistis Sophia was published, as the first of these odes is quoted as the 19th. There are forty-two of them. They are the work of a Christian. The doctrine of the Trinity is present; very prominent is the miraculous birth of the Saviour; the descent upon Mary of the Holy Ghost in the form of a dove; the crucifixion, and the descent into Hades; and, though less clearly, the resurrection. One striking thing is the resemblance of the account of the virgin birth to that we find in the Ascension of Isaiah.<P>(2) Date.<P>Dr. Rendel Harris dates these Christian odes in the last quarter of the 1st century, and there seems every reason to agree with this. The relation the 19th psalm (Ode 37) bears to the Ascension of Isaiah is not discussed by him, but to our thinking, the Ascension of Isaiah seems the more primitive.<P>IV. Testaments.<P>Although, strictly speaking, Jewish law had no place for "testamentary dispositions" by those about to die—"the portion of goods" that fell to each being prescribed—yet the dying exhortations of Jacob addressed to his sons, the farewell song of Moses, David\'s deathbed counsels to Solomon, were of the nature of spiritual legacies. Under Greek and Roman law testaments were the regularly understood means of arranging heritages; with the thing the name was transferred, as in the Mishna, Babha\' Bathra\' 15 26f; dayytike, so also in Syriac. The idea of these pseudepigrapha is clearly not drawn from the "Last Will and Testament," but the dying exhortations above referred to.<P>1. Testaments of the Twelve Patriarchs:<P><a onClick="return mV(\'Gen\',49,\'1-\');">Ge 49</a> in which Jacob addresses his sons gathered round ins dying bed furnished the model for a number of pseudepigraphic writings. Of these the longest known is Testament of the Twelve Patriarchs. In it the writer imagines each of the sons of Jacob following his father\'s example and assembling his descendants in order that he might give his dying charge. While Jacob addressed each of his sons separately, the sons of none of his sons, save those of Joseph, became at all prominent; so in the case of the sons of Jacob they each address their descendants as a whole. These Testaments are occupied with moral advices mainly. The sin most warned against is incontinence.<P>(1) Summary.<P>(a) Reuben:<P>The first Patriarch whose Testament is given is Reuben. While he bewails the sin that deprived him of his birthright, he gives an account of the various propensities that tend to sin, and accommodates each of these with an evil spirit—spirits of deceit. He gives details of his sin, which, resembling those given in the Book of Jubilees, differs in an apologetic direction. This apologetic effort is carried farther in the Targum of the pseudo-Jonathan. In it Reuben is declared to have disordered the bed of Bilhah because it was put beside his mother\'s, and he was accused of impurity with her; but the Spirit revealed to Jacob that he was not guilty.<P>(b) Simeon:<P>The next Testament is that of Simeon. The crime that seems to have most affected Jacob, if we may judge by <a onClick="return mV(\'Gen\',49,\'5-7\');">Ge 49:5-7</a>, was the murder of the Shechemites by Simeon and Levi. That, however, is not touched upon in the Testament; his envy of Joseph is what he most repents of. A stanza, however, is inserted, warning against fornication (<a onClick="return mV(\'Gen\',49,3);">Ge 49:3</a>).<P>(c) Levi:<P>The Testament of Levi follows. It is mainly apocalyptic. The murder of the Shechemites is regarded as a wholly estimable action, and is commended by God. The treachery of the circumcision is not mentioned at all. He tells how he was admitted in dream to the third heaven. In another vision he is clothed with the garments of the priesthood. After a piece of autobiography followed by general admonitions Levi tells what he had learned from the writing of Enoch. He tells how his descendants will fall away and become corrupt. It is to be noted that fornication becomes very prominent in the picture of the future. The destruction of Jerusalem is foretold, and the captivity of Judah among all nations. This cannot refer to the setting up of the "Abomination of Desolation" by Epiphanes. The Temple was not laid waste, although it was desecrated; and there did not follow on the desecration by Epiphanes the scattering of the Jews unto all nations. It seems necessary to understand by this wasting the capture of Jerusalem by Titus. Consequently, the "new priest" of XII P 18 seems to us the priest "after the order of Melchizedek" according to the New Testament interpretation.<P>(d) Judah:<P>Judah is the next whose Testament is given. He first declares his own great personal prowess, slaying a lion, a bear, a boar, a leopard and a wild bull. When the Canaanite kings assailed Jacob as related in the Book of Jubilee, he showed his courage. Several warlike exploits, of which we only learn here, he relates. The assault made by the descendants of Esau upon the sons of Jacob and Jacob\'s victory is related in the manner and nearly in the terms of the account in the Book of Jubilees. He mentions with a number of explanatory and excusatory details his sin in the matter of Tamar. He denounces covetousness, drunkenness and fornication. Then he commands his descendants to look to Levi and reverence him. Then follows a Messianic passage which seems most naturally to bear a Christian interpretation.<P>(e) Issachar:<P>The Testament of Issachar is much shorter than either of the two preceding ones. After telling the story of the mandrakes, he dwells on husbandry. As is noted by Dr. Charles, this is at variance with the rabbinic representation of the characteristics of the tribe. He, too, denounces impurity and drunkenness.<P>(f) Zebulun:<P>Zebulun\'s Testament is little longer than that of Issachar. This Testament is greatly occupied with tho history of the sale of Joseph in which Zebulun protests he took only the smallest share and got none of the price.<P>(g) Dan:<P>The Testament of Dan also is short. He confesses his rage against Joseph, and so warns against anger. Here also are warnings against whoredom. The Messiah is to spring from Judah and Levi. Dr. Charles thinks the first of these was not in the original, because it would naturally have been "tribes," not "tribe," as it is. This somewhat hasty, as in <a onClick="return mV(\'1Ki\',12,23);">1Ki 12:23</a> (Septuagint) we have the precisely similar construction pros panta oikon Iouda kai Beniamin, a sentence which represents the construction of the Hebrew. In this there is a Messianic passage which describes the Messiah as delivering the captives of Beliar.<P>(h) Naphtali:<P>The Testament that follows, that of Naphtali, has apocalyptic elements in it. It opens with the genealogy of Bilhah, his mother, whose father is said to be Rotheus. His vision represents Levi seizing the sun and Judah the moon. The young man with the twelve palm branches seems to be a reference to the Apostles. Joseph seizes a bull and rides on it. He has a further dream in which he sees a storm at sea and the brethren being separated. Again there is a reference to the recurrent theme of sexual relation (XII P 8).<P>(i) Gad:<P>The subject of the Testament of Gad is hatred. Gad is associated with Simeon as being most filled with wrath against Joseph.<P>(j) Asher:<P>Asher urges whole-hearted obedience to righteousness, as the apostle James does in his epistle.<P>(k) Joseph:<P>One of the most important of these Testaments is that of Joseph. The opening is occupied with a prolonged description of the temptation of Joseph by Potiphar\'s wife. There is in that connection the unhealthy dwelling on sexual matters which is found in monkish writers. There are not a few resemblances to the language of the Gospels (compare XII P 1:6 and <a onClick="return mV(\'Mat\',25,36);">Mt 25:36</a>). There is a more important passage (XII P 19:8): "And I saw that from Judah was born a virgin wearing a linen garment, and from her was born a lamb, and on his left hand there was, as it were, a lion: and all the beasts rushed against him, and the lamb overcame them, and destroyed them, and trod them under foot." This to us is clearly Christian. Dr. Charles, without apocalyptic credence to support him, would amend it and change the reading.<P>(1) Benjamin:<P>The Testament of Benjamin is very much an appendix to that of Joseph. It opens with the account Joseph gave Benjamin of how he was sold to the Ishmaelites. He exhorts his descendants against deceit, but, as all his brethren, he warns them against fornication. There is a long Christian passage which certainly seems an interpolation, as it is not found in some of the texts, though others have all verses. The text concerning Paul (XII P 11:1,2) appears in varying forms in all versions.<P>(2) Structure.<P>That these "Testaments" have been interpolated is proved by the variations in the different texts. Dr. Charles has, however, gone much farther, and wherever there is a Christian clause has declared it an obvious interpolation. For our part, we would admit as a rule those passages to be genuine that are present in all the forms of the text. The Greek text was first in, so to say, recent times edited by Grosseteste, bishop of Lincoln, in the 13th century. Since then other manuscripts have been found, and a Slavonic and an Aramaic version. We are thus able to check the interpolations. In essence the Christian passage in T Josephus is found in all versions.<P>(3) Language.<P>Dr. Charles makes a very strong case for Hebrew being the original language. His numerous arguments are not all of equal value. While some of the alleged Hebraistic constructions may be actually so, not a few may be explained by imitation of the language of the Septuagint. As an example of the first, compare T Jud (XII P 7): ochlos barus = chel kabhedh, "a numerous host." On the other hand T Reub XII P 3:8: "understanding in the Law," is a turn of expression that might quite well be common among Greek-speaking Jews. Of passages that are only explicable by retranslation, as in T Josephus 11:7, "God...increased him in gold and silver and in work," this last turn is evidently due to the translator\'s rendering \'abhuddah, "servant," as if it were \'abhodhah, "work." On the whole, we are prepared to amend the decision elsewhere, and admit that the probability is that this book, like so many more of the same class, has been translated from Hebrew.<P>(4) Date and authorship.<P>Dr. Charles declares the author to have been a Pharisee who wrote in the early part of the reign of John Hyrcanus I. The initial difficulty with this, as with the other pseudepigrapha in attributing a Pharisaic authorship, is the preservation of the book among the Christian communities, and the ignorance or the ignoring of it among the Jews. The only sect of the Jews that survived the destruction of Jerusalem was that of the Pharisees. The Sadducees, who were more a political than a religious party, disappeared with the cessation of the Jewish state. When Judaism became merely a religion—a church—not a nation, their function was gone.<P>The third sect, the Essenes, disappeared, but did so into the Christian church. If the writer had been an Essene, as we suppose he was, the preservation of this writing by the Christians is easily explicable. If it were the work of a Pharisee, its disappearance from the literature of the synagogue is as inexplicable as its preservation by the Christians. The constant harping on the sin of fornication—in T Naph XII P 8:8 even marital intercourse is looked at askance—indicates a state of mind suitable to the tenets of the Essenes. The date preferred by Dr. Charles, if the author is a Pharisee, appears to us impossible. The Pharisees had, long before the final break, been out of sympathy with the Maccabeans. The Chasidim deserted Judas Maccabeus at Elasa, not improbably in consequence of the alliance he had made with the heathen Romans, and perhaps also his assumption of the high-priesthood. Further, the temple is laid waste and the people driven into captivity unto all nations (T <span class="noTag">Levi 15:1</span>). This does not suit the desecration of the temple under Epiphanes.<P>During that time the temple was not laid waste. The orgies of the worship of Bacchus and of Jupiter Olympius dishonored it, but that is a different thing from its being laid waste. The scattering unto all nations did not take place then. Some were taken captive and enslaved, but this was not general. The description would only apply to destruction of the temple by Titus and the enslaving and captivity of the mass of the inhabitants of Jerusalem. The "New Priest" cannot refer to the Maccabeans, for they were Aaronites as much as Alcimus or Onias, though not of the high-priestly family. This change of the priesthood only has point if it refers to the priesthood of Christ as in <a onClick="return mV(\'Hbr\',7,12);">Heb 7:12</a>. If Dr. Charles is right in maintaining that 2Macc in its account of Menelaus is to be preferred to Josephus, the change of the priesthood was not unprecedented, for Menelaus was a Benjamite, not a Levite. Yet 1Macc takes no notice of this enormity.<P>Further, there are the numerous passages that are directly and indirectly Christian. Dr. Charles certainly marks them all as interpolations, but he gives no reason in most of the cases for doing so. That the omission of such passages does not dislocate the narrative arises from the simpler construction of Semitic narrative, and is therefore not to be regarded as conclusive evidence of interpolation. The reference to Paul in T Ben XII P 11, occurring in all the sources, although with variations, also points to a post-Christian origin. For these reasons, we would venture to differ from Dr. Charles and regard the Testament of the Twelve Patriarchs as post-Christian, and to be dated in the first quarter of the 2nd century AD.<P>(5) Relation to Other Books.<P>From the decision we have reached in regard to the date of these Testaments, it follows that all the many resemblances which have been noted between them and the books of the New Testament are due to imitation on the part of the Testaments, not the reverse. A case in point is T Josephus XII P 1:6 where the resemblance to <a onClick="return mV(\'Mat\',25,\'31-36\');">Mt 25:31-36</a> is close; only, whereas in the Gospel the judge approves of the righteous on account of their visiting the sick and the imprisoned, and condemns the wicked because they did not do so, in T Josephus God ministers to His servants. The Testament is really an imitation of the passage in the Gospel. The direct visiting of the afflicted, whatever the form of the affliction, was a thing of everyday occurrence. To think of the Almighty doing so is the result of a bold metaphor. One familiar with the Gospel narrative might not unnaturally think of God\'s dealings with the saints in terms drawn from our Lord\'s description of the Last Judgment. In T Naph XII P 2:2 the figure of the potter and the clay is, as in <a onClick="return mV(\'Rom\',9,21);">Ro 9:21</a>, applied to God\'s power over His creatures. The passage in the T Naph is expanded, and has not the close intimate connection with the argument that the Pauline passage has. While none of the other resemblances give one any ground to decide, these instances really carry the others with them. We may thus regard the resemblances to the New Testament in the Testament of the Twelve Patriarchs as due to the latter\'s copying of the former.<P>2. Testament of Adam:<P>The Testament of Adam survives merely in a group of fragments published first by Renan in the Journal Asiatique (1853). A Greek fragment was published by M. R. James. A portion of it is apocalyptic, and gives an account of the adoration offered by all the different classes of God\'s creatures. More strictly of the nature of a Testament is a Syriac fragment entitled "More of Adam Our Father." It contains a prophecy of the incarnation, and appears to be of late date. It was used by the Sethires.<P>3. Testament of Abraham:<P>The Testament of Abraham is a late document. It opens with representing Abraham at his tent door. One recension declares his age then to be 995 years. Michael comes to him. The purpose for which Michael has been sent is to reveal to Abraham that he must die. He hesitates to do this. When, however, the fatal message is revealed, Abraham will not yield up his spirit at first. He is after a while persuaded, and as reward, before his death he has a revelation: there is given to him a vision of the whole world in the widest sense—the world of spirits as well. Seeing a soul, which, weighed in the balance, is nearly being found wanting, by his intercession the soul is admitted to Paradise.<P>There are several traces of Christian influence; many of the thoughts and phrases are similar to those to be found in the Gospels. At the same time, although to one who had read John\'s Gospel the statement of our Lord that Abraham had seen His day "and was glad" (<a onClick="return mV(\'Jhn\',8,55,56);">Joh 8:55-56</a>) would inevitably have led a Christian writer to have exhibited Abraham as seeing in vision the day of Christ. The writer\'s failure to do so seems to show that he was not a Christian. The echoes of the Gospel in the language and the want of that distinctive Christian mark is to be explained if we regard the translator as a Christian, while the original Midrash was the work of a Jew. The language was probably Aramaic. There are two Greek recensions, one longer than the other. There is an Arabic version which appears to be a translation direct from Aramaic. As there is no reference to the coming of Christ, this Testament is probably pre-Christian. The translation may be dated early in the 2nd century, as Origen knew it. In Arabic there is a manuscript of the Testaments of Isaac and Jacob. They are late and Christian. The latter is founded on the last chapter of Genesis.<P>4. Testament of Job:<P>More interesting is the Testament of Job published in Anecdota Apocrypha by M. R. James in 1897. It purports to be an account of his sufferings related by Job himself. It appears to be the work of a Jew, translated by a Christian. The position of Satan in the Midrash is not so subordinate as in the drama. Elihu, when not confused with Eliphaz, is regarded as inspired by Satan.<P>(1) Summary. It begins with Job, "who is called Jobab," summoning his seven sons and three daughters. The list of the sons forms a singular assemblage of names, most probably of Semitic origin. Most of them are certainly Greek words, though not Greek proper names—Choros and Nike, "dance" and "victory," Huon, "of pigs," Phoros, "tribute." The other names are Tersi, Phiphi, Phrouon. He tells his descendants how he had been called in the night and had had it revealed to him that the sacrifices that had been offered previously in the great temple near him were not offered to God, but to Satan. He was ordered to destroy the temple thus devoted to false worship. He did so, but knew that Satan would seek him, to take his revenge. Satan came disguised as a beggar, and Job, recognizing him, ordered his porteress to give him a burned cake of bread, all ashes. Satan reveals himself and threatens Job. With XII P 9 begins an account of Job\'s wealth and lordly beneficence founded on the canonical book.<P>It continues to XII P 16. This portion is an expansion of the canonical Job. In some portions there are marked variations. Job is a king, and since this is so, the power of Persia is invoked to overthrow him. After twenty years his friends come to condole with him. They also are kings. Sitis his wife is bemoaning her children. Job declares he sees them crowned with heavenly beauty. On learning this, Sitis dies, and so rejoins her children. The speeches of the friends are much condensed, and scarcely of the same character as those in the canonical book. Lyric passages are introduced. The most singular difference from the canonical book is the role assigned to Elihu. Job says, "Elihu inspired by Satan addressed to me rash words" (XII P 42). God then speaks to Job in the whirlwind and blames Elihu. Job sacrifices for the three friends, and Eliphaz in a lyric piece congratulates himself and his friends, and declares that the lamp and glory of Elihu will be quenched (XII P 43).<P>By a second wife we are told Job had the seven sons and three daughters who are summoned to his bedside. Closing his narrative (XII P 44) Job exhorts kindness to the poor. In the end of the book his successive daughters speak. He had divided his property, now double what it had originally been, among his seven sons and had left the daughters unprovided for. He, however, bestows upon them other gifts. Three golden vessels are brought him and given them, three cords besides, and each one has a several endowment. The first daughter, called, as in the Septuagint, Hemera, (Jemima in the canonical Job), had another heart given her, and she spoke in the tongue of the angels. Casia (Keziah), the second daughter, also had a changed heart, and it was given to her to speak in the dialect of the principalities (archon). Then the third daughter girded herself, and with the changed heart it was given her to speak in the language of the Cherubim. This daughter is called Amaltheias Keras, the rather strange translation of Keren Haphukh adopted by the Septuagint. All the names are transferred from that source. A brother of Job named Nereus (or Nereias) is introduced, who records further gifts to these daughters—a lyre to the first, a censer to the second and a drum to the third. This brother is a relative of whose existence we have no hint elsewhere. He is introduced to supply the conclusion to the narrative.<P>(2) Structure.<P>It would appear that from XII P 1 to 45 is the original Testament in which Job is the speaker. In XII P 46-51 a new state of matters comes into prominence, in which Nereus is the speaker. The last two chapters seem decidedly to be additions: the new gifts to the daughters seem unexplained. Of course, oriental authors do not look so strictly to the unity of parts as do Occidentals.<P>(3) Language.<P>The dependence on the Septuagint would suggest that Greek was the original tongue. One or two phenomena point to a Semitic tongue being behind the Greek. The names of Job\'s daughters are taken from the Septuagint; those of the seven sons have been invented. As we have seen, they are not Greek names, but are probably really Hellenized versions of some Semitic appellations. At the same time, they do not seem to be Hebrew, but rather Aramaic. It would seem to have been translated by one familiar with the New Testament.<P>(4) Date and authorship.<P>It has no direct references to Christian doctrines or the facts of Christian history. This seems conclusive against its having a Christian origin. The reason that would lead a Christian to compose such a document would be to give a further prophetic evidence for the mission of his Master. He would have no object in making Job out to be a connection of Israel, unless he were so himself. Dr. James thinks the writer to have been a Jewish Christian of the 2nd century resident in Egypt. By the 2nd century few Jews passed from Judaism to the faith of Jesus: the break between church and synagogue had become complete. That Job is made king of all Egypt (XII P 28) may indicate some relationship to that country, as if the writer had identified Job with Psammeticus, the Egyptian king overthrown by Cambyses. This, however, may have been due to the translator. If the original language were Semitic—Aramaic or Hebrew—the probability is that the author wrote in Palestine. There are no direct signs to indicate the date. There is no appearance of knowledge of Rome. The fire of the opposition to the Seleucids had died down. It may have been written in the reign of Alexander.<P>V. Sibylline Oracles.<P>The burning of the Capitol (83 BC) and the destruction of the famous Sibylline books led Sulla to search in Italy and Greece for any Oracles that might replace the contents of the volumes which had been burnt. About half a century later Augustus revived the search for Oracles. Such a demand would naturally produce a supply. It would seem that certain Jews of Alexandria, eager to propagate the faith of their fathers, invented verses in the shape in which these Oracles had been preserved, as we learn from Herodotus—i.e. in hexameter lines and in the epic dialect in which Homer and Hesiod had written. Those in Herodotus are mainly from the Oracle of Delphi. From Pausanias, who quotes several of them, we learn that the Oracles attributed to the various Sibyls were delivered in a similar style. Hence these Jewish forgeries were written in epic hexameters. Later, this industry was pursued with even greater zeal by Christians.<P>These have been collected into several books—some 15 are named—of which some have been lost. The books are made up of fragments of different ages. The first book begins with the creation, and narrates the history of the race to the flood and the going out of Noah from the ark. Then the history of our Lord is given succinctly, the miracle of the loaves, the crucifixion, and the destruction of Jerusalem. In it Hades is derived from "Adam." Reference is made to the sin of the watchers, as in En, and an arithmograph is given which seems to be fulfilled in Theos Soter. The second book is modeled largely on our Lord\'s eschatological discourses, many passages bearing a distinct echo of it. It may be noted that the four archangels of the Book of Enoch—Michael, Gabriel, Raphael and Uriel—are introduced. The third is by much the longest, but it is a confused mass of fragments.<P>There is early reference to the conquest of Egypt by Rome; the building of the tower of Babel, the siege of Troy, the conquest of Alexander and many other events appear. The fourth book is Christian throughout. After praise to the Christians, there is a sketch of the history of the great empires, beginning with the Assyrians and ending with Alexander; then an account of Nero appearing from the East and doing evil fills the end of all things. The fifth book begins with an account of the successive emperors from Julius Caesar to the Antonines. Then a new song begins with Egypt, and wanders off indefinitely, referring to Xerxes crossing the Hellespont, the impurities of Rome, and ending with Egypt and the burning up of all things. The sixth is short—28 lines in praise of the Cross; and the seventh is fragmentary. In the eighth is the arithmogram and acrostic: Iesous christos theou huios soter stauros. The remaining books have similar characteristics. The place of composition is evidently Egypt, as, whatever the immediate context may be, the writer gravitates to Egypt; and the authors are Jews or Jewish Christians. The dates of the various fragments of which this collection is composed fall between the first triumvirate and the age of Diocletian.<P>VI. Conclusion.<P>There are many points in which theology of the Apocalyptic prepared the way for that of Christianity. These, however, are more naturally taken up under their special headings. Angelology is much more developed in certain apocalyptic writings than it is in Christianity, if we except the writings published under the name of Dionysius the Areopagite. Most of them are occupied with the coming Messiah. The Christology of these writings is decidedly in advance of that of the Old Testament. That question, however, is discussed under its appropriate heading. Closely connected with this is the doctrine of God, or theology proper. In this, too, there is an approximation to the Christian doctrine of the Trinity. With these writers the doctrine of the Last Things is always brought into close relationship to that of the Messiah. His coming is the signal for the end of the world, the last judgment, the punishment of the wicked and the reward of the righteous. What we have just said applies mainly to the strictly Jewish and pre-Christian Apocalypses. In the Christian Jewish Apocalypses the place the incarnation and the miraculous birth hold is worthy of special note. The representation in regard to the latter of these subjects is independent of the gospel narrative. Connected with this independence of the written Scriptures are the variations these writings introduce into history. Many of these are due to apologetic reasons, not a few to the desire to enhance the national glory. The reverence for the letter of Scripture, so markedly characteristic of the rabbinic teachings found in the Talmud, is not found in the apocalyptic writings. Apocalyptic thus presents a stage in the doctrine of Scripture.<P>LITERATURE.<P>On Apocalyptic generally: Deane, Pseudepigrapha; Derembourg, Histoire de la Palestine; Drummond. Jewish Messiah; Ewald, History of Israel, translation V; Gratz, Geschichte der Juden, III; Hilgenfeld, Messias Judeorum; Judische Apocalyptik; Kautzsch, Die Apocryphen und Pseudepigraphen des Allen Testaments; Langen, Paldstina zur Zeit Christi; Renan, Histoire du Peuple d\'Israel; Schurer, Jewish People, translation V; Stanton, Jewish and Christian Messiah; Thomson, Books Which Influenced our Lord. On special books: Enoch (Text, Ethiopic): Laurence, Dillmann, Flemming; (English): Laurence, Schodde, Charles. Slavonic Book of Enoch: Morfill. Baruch (Text, Syriac): Ceriani; (English): Charles, The Assumption of Moses (Text, Latin): Ceriani; (English): Charles, The Ascension of Isaiah (Text, Ethiopic): Laurence, Dillmann; (English): Charles, Fourth Book of Esdras (Text, Latin): Vulgate; (English): Apocrypha the Revised Version (British and American) Book of Jubilees (Text, Ethiopic): Dillmann, Charles; (English): Schodde, Charles, Psalter of Solomon (Text, Greek): Pick, Ryle and James; (English): Whiston, Pick, Ryle and James, Rendel Harris (from Syriac). Odes of Solomon (English): Rendel Harris, Testaments of the XII Patriarchs (Text, Greek): Sinker, Charles; (English): Sinker, Charles, Testaments of Abraham and Job; Texts and Studies; Sibylline Oracles (Text): Alexandre, Rzach.``173';
isbe[609]='Apocrypha`a-pok\'-ri-fa:<P><b>I. DEFINITION</b><P><b>II. THE NAME APOCRYPHA</b><P class="in15">1. Original Meanings<P class="in30">(1) Classical<P class="in30">(2) Hellenistic<P class="in30">(3) In the New Testament<P class="in30">(4) Patristic<P class="in15">2. "Esoteric" in Greek Philosophy, etc.<P><b>III. USAGE AS TO APOCRYPHA</b><P class="in15">1. Early Christian Usage<P class="in30">"Apocalyptic" Literature<P class="in15">2. The Eastern Church<P class="in30">(1) "Esoteric" Literature (Clement of Alexandria, etc.)<P class="in30">(2) Change to "Religious" Books (Origen, etc.)<P class="in30">(3) "Spurious" Books (Athanasius, Nicephorus, etc.)<P class="in30">(4) "List of Sixty"<P class="in15">3. The Western Church<P class="in30">(1) The Decretum Gelasii<P class="in30">(2) "Non-Canonical" Books<P class="in15">4. The Reformers<P class="in30">Separation from Canonical Books<P class="in15">5. Hebrew Words for "Apocrypha"<P class="in30">(1) Do Such Exist?<P class="in30">(2) Views of Zahn, Schurer, Porter, etc. (ganaz, genuzim)<P class="in30">(3) Reasons for Rejection<P class="in30">6. Summary<P><b>IV. CONTENTS OF THE APOCRYPHA</b><P class="in15">1. List of Books<P class="in15">2. Classification of Books<P><b>V. ORIGINAL LANGUAGES OF THE APOCRYPHA</b><P><b>VI. DATE OF THE APOCRYPHAL WRITINGS</b><P><b>LITERATURE</b><hr /><P>I. Definition.<P>The word Apocrypha, as usually understood, denotes the collection of religious writings which the Septuagint and Vulgate (with trivial differences) contain in addition to the writings constituting the Jewish and Protestant canon. This is not the original or the correct sense of the word, as will be shown, but it is that which it bears almost exclusively in modern speech. In critical works of the present day it is customary to speak of the collection of writings now in view as "the Old Testament Apocrypha," because many of the books at least were written in Hebrew, the language of the Old Testament, and because all of them are much more closely allied to the Old Testament than to the New Testament. But there is a "New" as well as an "Old" Testament Apocrypha consisting of gospels, epistles, etc. Moreover the adjective "Apocryphal" is also often applied in modern times to what are now generally called "Pseudepigraphical writings," so designated because ascribed in the titles to authors who did not and could not have written them (eg. Enoch, Abraham, Moses, etc.). The persons thus connected with these books are among the most distinguished in the traditions and history of Israel, and there can be no doubt that the object for which such names have been thus used is to add weight and authority to these writings.<P>The late Professor E. Kautzsch of Halle edited a German translation of the Old and New Testament Apocrypha, and of the Pseudepigraphical writings, with excellent introductions and valuable notes by the best German scholars. Dr. Edgar Hennecke has edited a similar work on the New Testament Apocrypha. Nothing in the English language can be compared with the works edited by Kautzsch and Hennecke in either scholarship or usefulness. (A similar English work to that edited by Kautzsch is now passing through the (Oxford) press, Dr. R. H. Charles being the editor, the writer of this article being one of the contributors.)<P>II. The Name Apocrypha.<P>The investigation which follows will show that when the word "Apocryphal" was first used in ecclesiastical writings it bore a sense virtually identical with "esoteric": so that "apocryphal writings" were such as appealed to an inner circle and could not be understood by outsiders. The present connotation of the term did not get fixed until the Protestant Reformation had set in, limiting the Biblical canon to its present dimensions among Protestant churches.<P>1. Original Meanings:<P>(1) Classical.<P>The Greek adjective apokruphos, denotes strictly "hidden," "concealed," of a material object (Eurip. Here. Fur. 1070). Then it came to signify what is obscure, recondite, hard to understand (Xen. Mem. 3.5, 14). But it never has in classical Greek any other sense.<P>(2) Hellenistic.<P>In Hellenistic Greek as represented by the Septuagint and the New Testament there is no essential departure from classical usage. In the Septuagint (or rather Theodotion\'s version) of <a onClick="return mV(\'Dan\',11,43);">Da 11:43</a> it stands for "hidden" as applied to gold and silver stores. But the word has also in the same text the meaning "what is hidden away from human knowledge and understanding." So <a onClick="return mV(\'Dan\',2,20);">Da 2:20</a> (Theod.) where the apokrupha or hidden things are the meanings of Nebuchadnezzar\'s dream revealed to Daniel though "hidden" from the wise men of Babylon. The word has the same sense in Sirach 14:21; 39:3,7; 42:19; 48:25; 43:32.<P>(3) In the New Testament.<P>In the New Testament the word occurs but thrice, namely, <a onClick="return mV(\'Mar\',4,22);">Mr 4:22</a> and the parallel <a onClick="return mV(\'Luk\',8,17);">Lu 8:17</a>; <a onClick="return mV(\'Col\',2,3);">Col 2:3</a>. In the last passage Bishop Lightfoot thought we have in the word apokruphoi (treasures of Christ hidden) an allusion to the vaunted esoteric knowledge of the false teachers, as if Paul meant to say that it is in Christ alone we have true wisdom and knowledge and not in the secret books of these teachers. Assuming this, we have in this verse the first example of apokruphos in the sense "esoteric." But the evidence is against so early a use of the term in this—soon to be its prevailing—sense. Nor does exegesis demand such a meaning here, for no writings of any kind seem intended.<P>(4) Patristic.<P>In patristic writings of an early period the adjective apokruphos came to be applied to Jewish and Christian writings containing secret knowledge about the future, etc., intelligible only to the small number of disciples who read them and for whom they were believed to be specially provided. To this class of writings belong in particular those designated Apocalyptic (see <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>), and it will be seen as thus employed that apokruphos has virtually the meaning of the Greek esoterikos.<P>2. "Esoteric" in Greek Philosophy, etc.:<P>A brief statement as to the doctrine in early Greek philosophy will be found helpful at this point. From quite early times the philosophers of ancient Greece distinguished between the doctrines and rites which could be taught to all their pupils, and those which could profitably be communicated only to a select circle called the initiated. The two classes of doctrines and rites—they were mainly the latter—were designated respectively "exoteric" and "esoteric." Lucian (died 312; see Vit. Auct. 26) followed by many others referred the distinction to Aristotle, but as modern scholars agree, wrongly, for the exoterikoi logoi, of that philosopher denote popular treatises. The Pythagoreans recognized and observed these two kinds of doctrines and duties and there is good reason for believing that they created a corresponding double literature though unfortunately no explicit examples of such literature have come down to us.<P>In the Greek mysteries (Orphic, Dionysiac, Eleusinian, etc.) two classes of hearers and readers are implied all through, though it is a pity that more of the literature bearing on the question has not been preserved. Among the Buddhists the Samga forms a close society open originally to monks or bhikhus admitted only after a most rigid examination; but in later years nuns (bhikshunis) also have been allowed admission, though in their case too after careful testing. The Vinaya Pitaka or "Basket of Discipline" contains the rules for entrance and the regulations to be observed after entrance. But this and kindred literature was and is still held to be caviare to outsiders. See translation in the Sacred Books of the East, XI (Rhys Davids and Oldenberg).<P>III. Usage as to Apocrypha.<P>It must be borne in mind that the word apocrypha is really a Greek adjective in the neuter plural, denoting strictly "things hidden." But almost certainly the noun biblia is understood, so that the real implication of the word is "apocryphal books" or "writings." In this article apocrypha will be employed in the sense of this last, and apocryphal as the equivalent of the Greek apokruphos.<P>1. Early Christian Usage:<P>"Apocalyptic" literature.<P>The word apocrypha was first used technically by early Christian writers for the Jewish and Christian writings usually classed under "Apocalyptic" (see <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>). In this sense it takes the place of the classical Greek word esoterika and bears the same general meaning, namely, writings intended for an inner circle and cap. able of being understood by no others. These writings give intimations regarding the future, the ultimate triumph of the kingdom of God, etc., beyond, it was thought, human discovery and also beyond the intelligence of the uninitiated. In this sense Gregory of Nyssa (died 395; De Ordin., II, 44) and Epiphanius (died 403; Haeres, 51 3) speak of the Apocalypse of John as "apocryphal."<P>2. The Eastern Church:<P>Christianity itself has nothing corresponding to the idea of a doctrine for the initiated or a literature for a select few. The gospel was preached in its first days to the poor and ignorant, and the reading and studying of the sacred Scriptures have been urged by the churches (with some exceptions) upon the public at large.<P>(1) "Esoteric" Literature (Clement of Alexandria, etc.).<P>The rise of this conception in the eastern church is easily understood. When devotees of Greek philosophy accepted the Christian faith it was natural for them to look at the new religion through the medium of the old philosophy. Many of them read into the canonical writings mystic meanings, and embodied those meanings in special books, these last becoming esoteric literature in themselves: and as in the case of apocalyptic writings, this esoteric literature was more revered than the Bible itself. In a similar way there grew up among the Jews side by side with the written law an oral law containing the teaching of the rabbis and regarded as more sacred and authoritative than the writings they profess to expound. One may find some analogy in the fact that among many Christians the official literature of the denomination to which they belong has more commanding force than the Bible itself. This movement among Greek Christians was greatly aided by Gnostic sects and the esoteric literature to which they gave rise. These Gnostics had been themselves influenced deeply by Babylonian and Persian mysticism and the corresponding literature. Clement of Alexandria (died 220) distinctly mentions esoteric books belonging to the Zoroastrian (Mazdean) religion.<P>Oriental and especially Greek Christianity tended to give to philosophy the place which the New Testament and western Christianity assign the Old Testament. The preparation for the religion of Jesus was said to be in philosophy much more than in the religion of the Old Testament. It will be remembered that Marcian (died end of 2nd century AD), Thomas Morgan, the Welsh 18th-century deist (died 1743) and Friedrich Schleiermacher (died 1834) taught this very same thing.<P>Clement of Alexandria (see above) recognized 4 (2) Esdras (to be hereafter called the Apocalypse of Ezra), the Assumption of Moses, etc., as fully canonical. In addition to this he upheld the authority and value of esoterical books, Jewish, Christian, and even heathen. But he is of most importance for our present purpose because he is probably the earliest Greek writer to use the word apocrypha as the equivalent of esoterika, for he describes the esoteric books of Zoroastrianism as apocryphal.<P>But the idea of esoteric religious literature existed at an earlier time among the Jews, and was borrowed from them by Christians. It is clearly taught in the Apocalyptic Esdras (2 or 4 Esd) chapter 14, where it is said that Ezra aided by five amanuenses produced under Divine inspiration 94 sacred books, the writings of Moses and the prophets having been lost when Jerusalem and the temple were destroyed. Of this large number of sacred books 24 were to be published openly, for the unworthy as well as the worthy, these 24 books representing undoubtedly the books of the Hebrew Old Testament. The remaining 70 were to be kept for the exclusive use of the "wise among the people": i.e. they were of an esoteric character. Perhaps if the Greek original of this book had been preserved the word "apocrypha" would have been found as an epithetic attached to the 70 books. Our English versions are made from a Latin original <a href="./study/isbe/search.html?string=EZRA">EZRA</a> or the <a href="./study/isbe/search.html?string=APOCALYPTIC+ ESDRAS">APOCALYPTIC ESDRAS</a>. Modern scholars agree that in its present form this book arose in the reign of Domitian 81-96 AD. So that the conception of esoteric literature existed among the Jews in the 1st century of our era, and probably still earlier.<P>It is significant of the original character of the religion of Israel that no one has been able to point to a Hebrew word corresponding to esoteric (see below). When among the Jews there arose a literature of oral tradition it was natural to apply to this last the Greek notion of esoteric, especially as this class of literature was more highly esteemed in many Jewish circles than the Old Testament Scriptures themselves.<P>(2) Change to "Religious" Books (Origen, etc.).<P>The next step in the history of the word "apocrypha" is that by which it came to denote religious books inferior in authority and worth to the Scriptures of the Old Testament and New Testament. This change of attitude toward noncanonical writings took place under the influence of two principles: (1) that no writer could be inspired who lived subsequent to the apostolic age; (2) that no writing could be recognized as canonical unless it was accepted as such by the churches in general (in Latin the principle was—quod ubique, quod semper, quod ab omnibus). Now it was felt that many if not most of the religious writings which came in the end of the 2nd century to be called "apocryphal" in a disparaging sense had their origin among heretical sects like the Gnostics, and that they had never commanded the approval of the great bulk of the churches. Origen (died 253) held that we ought to discriminate between books called "apocryphal," some such having to be firmly rejected as teaching what is contrary to the Scriptures. More and more from the end of the 2nd century, the word "apocrypha" came to stand for what is spurious and untrustworthy, and especially for writings ascribed to authors who did not write them: i.e. the so-called "Pseudepigraphical books."<P>Irenaeus (died 202) in opposition to Clement of Alexandria denies that esoteric writings have any claims to credence or even respect, and he uses the Greek word for "apocryphal" to describe all Jewish and Christian canons. To him, as later to Jerome (died 420), "canonical" and "apocryphal" were antithetic terms. Tertullian (died 230) took the same view: "apocryphal" to him denoted non-canonical. But both Irenaeus and Tertullian meant by apocrypha in particular the apocalyptic writings. During the Nicene period, and even earlier, sacred books were divided by Christian teachers into three classes:<P class="in15">(1) books that could be read in church;<P class="in15">(2) books that could be read privately, but not in public;<P class="in15">(3) books that were not to be read at all. This classification is implied in the writings of Origen, Clement of Alexandria, Athanasius (died 373), and in the Muratorian Fragments (about 200 AD).<P>(3) "Spurious" Books (Athanasius, Nicephorus, etc.).<P>Athanasius, however, restricted the word apocrypha to the third class, thus making the corresponding adjective synonymous with "spurious." Nicephorus, patriarch of Constantinople (806-15 AD) in his chronography (belonging essentially to 500 AD according to Zahn) divides sacred books thus:<P class="in15">(1) the canonical books of the Old Testament and New Testament;<P class="in15">(2) the Antilegomena of both Testaments;<P class="in15">(3) the Apocrypha of both Testaments.<P>The details of the Apocrypha of the New Testament are thus enumerated:<P class="in15">(1) Enoch;<P class="in15">(2) The 12 Patriarchs;<P class="in15">(3) The Prayer of Joseph;<P class="in15">(4) The Testament of Moses;<P class="in15">(5) The Assumption of Moses;<P class="in15">(6) Abram;<P class="in15">(7) Eldad and Modad;<P class="in15">(8) Elijah the Prophet;<P class="in15">(9) Zephaniah the Prophet;<P class="in15">(10) Zechariah, father of John;<P class="in15">(11) The Pseudepigrapha of Baruch, Habakkuk, Ezekiel and Daniel.<P>The books of the New Testament Apocrypha are thus given:<P class="in15">(1) The Itinerary of Paul;<P class="in15">(2) The Itinerary of Peter;<P class="in15">(3) The Itinerary of John;<P class="in15">(4) The Itinerary of Thomas;<P class="in15">(5) The Gospel according to Thomas;<P class="in15">(6) The Teaching of the Apostles (the Didache);<P class="in15">(7) and (8) The Two Epistles of Clement;<P class="in15">(9) Epistles of Ignatius, Polycarp and Hermas.<P>The above lists are repeated in the so-called Synopsis of Athanasius. The authors of these so-called apocryphal books being unknown, it was sought to gain respect for these writers by tacking onto them well-known names, so that, particularly in the western church, "apocryphal" came to be almost synonymous with "pseudepigraphical." Of the Old Testament lists given above <span class="noTag">numbers</a> 1, 2, 4, 5 are extant wholly or in part. <span class="noTag">Numbers</span> 3, 7, 8 and 9 are lost though quoted as genuine by Origen and other eastern Fathers. They are all of them apocalypses designated apocrypha in accordance with early usage.<P>(4) "List of Sixty."<P>In the anonymous, "List of Sixty," which hails from the 7th century, we have represented probably the attitude of the eastern church. It divides sacred books into three classes:<P>(1) The sixty canonical books. Since the Protestant canon consists of but 57 books it will be seen that in this list books outside our canon are included.<P>(2) Books excluded from the 60, yet of superior authority to those mentioned as apocryphal in the next class.<p>(3) Apocryphal books, the names of which are as follows:<P class="in15">(a) Adam;<P class="in15">(b) Enoch;<P class="in15">(c) Lamech;<P class="in15">(d) The 12 Patriarchs;<P class="in15">(e) The Prayer of Joseph;<P class="in15">(f) Eldad and Modad;<P class="in15">(g) The Testament of Moses;<P class="in15">(h) The Assumption of Moses;<P class="in15">(i) The Psalms of Solomon;<P class="in15">(j) The Apocalypse of Elijah;<P class="in15">(k) The Ascension of Isaiah;<P class="in15">(l) The Apocalypse of Zephaniah (see <span class="noTag">number</span> 9</a> of the Old Testament Apocrypha books mentioned in the Chronography of Nicephorus);<P class="in15">(m) The Apocalypse of Zechariah;<P class="in15">(n) The Apocalyptic Ezra;<P class="in15">(o) The History of James;<P class="in15">(p) The Apocalypse of Peter;<P class="in15">(q) The Itinerary and Teaching of the Apostles;<P class="in15">(r) The Epistles of Barnabas;<P class="in15">(s) The Acts of Paul;<P class="in15">(t) Apocalypse of Paul;<P class="in15">(u) Didascalia of Clement;<P class="in15">(v) Didascalia of Ignatius;<P class="in15">(w) Didascalia of Polycarp;<P class="in15">(x) Gospel according to Barnabas;<P class="in15">(y) Gospel according to Matthew.<P>The greater number of these books come under the designation "apocryphal" in the early sense of "apocalyptic," but by this time the word had taken on a lower meaning, namely, books not good for even private reading. Yet the fact that these books are mentioned at all show that they were more highly esteemed than heathen and than even heretical Christian writings. The eastern churches down to the present day reject the meaning of "apocrypha" current among Protestants (see definition above), and their Bible includes the Old Testament Apocrypha, making no distinction between it and the rest of the Bible.<P>3. The Western Church:<P>(1) The Decretum Gelasii.<P>In the Western church the word apocrypha and the corresponding adjective had a somewhat different history. In general it may be said that the western church did not adopt the triple division of sacred books prevalent in the Eastern church. Yet the Decretum Gelasii (6th century in its present form) has a triple list which is almost certainly that of the Roman synod of 382 under Damasus, bishop of Rome, 366 to 384. It is as follows:<P class="in15">(1) the canonical books of both Testaments;<P class="in15">(2) writings of the Fathers approved by the church;<P class="in15">(3) apocryphal books rejected by the church.<P>Then there is added a list of miscellaneous books condemned as heretical, including even the works of Clement of Alexandria, Tertullian, and Eusebius, these works being all branded as "apocryphal." On the other hand Gregory of Nyssa and Epiphanius, both writing in the 4th century, use the word "apocrypha" in the old sense of apocalyptic, i.e. esoteric.<P>(2) "Non-Canonical" Books.<P>Jerome (died 420) in the Prologus Galeatus (so called because it was a defense and so resembled a helmeted warrior) or preface to his Latin version of the Bible uses the word "Apocrypha" in the sense of non-canonical books. His words are: Quidquid extra hos (i.e. the 22 canonical books) inter Apocrypha ponendum: "Anything outside of these must be placed within the Apocrypha" (when among the Fathers and rabbis the Old Testament is made to contain 22 (not 24) books, Ruth and Lamentations are joined respectively to Judges and Jeremiah). He was followed in this by Rufinus (died circa 410), in turns Jerome\'s friend and adversary, as he had been anticipated by Irenaeus. The western church as a whole departed from Jerome\'s theory by including the antilegomena of both Testaments among the canonical writings: but the general custom of western Christians about this time was to make apocryphal mean non-canonical. Yet Augustine (died 430; De Civitale Dei, XV, 23) explained the "apocrypha" as denoting obscurity of origin or authorship, and this sense of the word became the prevailing one in the West.<P>4. The Reformers:<P>Separation from Canonical Books.<P>But it is to the Reformers that we are indebted for the habit of using Apocrypha for a collection of books appended to the Old Testament and generally up to 1827 appended to every printed English Bible. Bodenstein of Carlstadt, usually called Carlstadt (died 1541), an early Reformer, though Luther\'s bitter personal opponent, was the first modern scholar to define "Apocrypha" quite clearly as writings excluded from the canon, whether or not the true authors of the books are known, in this, going back to Jerome\'s position. The adjective "apocryphal" came to have among Protestants more and more a disparaging sense. Protestantism was in its very essence the religion of a book, and Protestants would be sure to see to it that the sacred volume on which they based their religion, including the reforms they introduced, contained no book but those which in their opinion had the strongest claims to be regarded as authoritative.<P>In the eastern and western churches under the influence of the Greek (Septuagint) and Latin (Vulgate) versions the books of the Apocrypha formed an integral part of the canon and were scattered throughout the Old Testament, they being placed generally near books with which they have affinity. Even Protestant Bibles up to 1827 included the Apocrypha, but as one collection of distinct writings at the end of the Old T
