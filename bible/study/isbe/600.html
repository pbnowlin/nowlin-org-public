 the process is necessarily slow. So far, however, as the excavations have gone, the evidence is of a decided change in the culture even at such towns as Gezer, without, however, the Canaanite culture coming fully under Israelite influence and succumbing to it; exactly, in fact, as is represented in the Biblical narrative (PEFS, 1903, 49, Macalister; ib,1908, Macalister, 17; Vincent, 228).<P>(c) AD Date of Hermetic Writings:<P>The post-Christian view of the Hermetic Writings. These Egyptian documents in the Greek tongue have been thought to reflect early Christian thought in Egypt, chiefly because of a certain "unholy resemblance" to gospel language found in them. A recent critical examination of these writings has established, it is claimed, by archaeological evidence gathered from the writings themselves, that the "unholy resemblance" to gospel expressions arose not from the reflection of Christian teaching, but from the appropriation by the evangelists of current expressions of Alexandrian Greek in use in pre-Christian theological language. This view of the Hermetic Writings, if finally established, cannot but have a far-reaching effect upon New Testament study (Petrie, Personal Religion in Egypt before Christianity).<P>4. Reconstructive Criticism Not Confirmed.<P>(a) The Claims of Some Critics:<P>Not a single critical theory still maintained, either generally or by prominent individual critics, which proposes to take Scripture at other than its face value, has been sustained by archaeology. The assertion that is otherwise, that "on all other (controverted) points, the facts of archaeology, so far as they are at present known, harmonize entirely with the positions generally advocated by the critics" (Driver, Authority and Archaeology, 145; LOT (1897), Pref, xviii; Genesis, addenda to 7th edition, XXXIV-XXXVI), means either that such unsustained theories are not advocated by the person making the assertion and not by him regarded as generally advocated by critics, or, more commonly, that theori es in question have not been positively and definitely contradicted by archaeological evidence. But it is not enough that theories are not definitely contradicted by archaeological evidence; we have seen (compare above) that they must be definitely corroborated before being accepted and allowed to affect one\'s faith. An instance of the claims of criticism concerning the harmony between its theories and the facts of archaeology, a claim whose importance merits presentation at length, is found in the Addenda to the 7th edition of Driver\'s Introduction to Genesis, the latest and most positive utterance of criticism on this subject. Driver says (xxxiv): It is stated by Professor Sayce expressly, and by Dr. Orr and Professor A. T. Clay, by implication, that Noldeke\'s arguments against the historical character of the narrative of <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a> have been refuted by archaeology. The statement supplies such an object-lesson of the methods on which the opponents of criticism not infrequently rely, that it may be worth while to explain here the grounds upon which it rests.<P>Here are Professor Sayce\'s words (Monumental Facts, 1904, 54; cf, though without Noldeke\'s name, Monuments, 161f): "In 1869 the great Semitic scholar, Professor Noldeke, published a treatise on the Unhistorical Character of <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>. He declared that \'criticism\' had forever disproved its claim to be historical. The political situation presupposed by it was incredible and impossible; at so distant a date Babylonian armies could not have marched to Canaan, much less could Canaan have been a subject province of Babylonia. The whole story, in fact, was a fiction based upon the Assyrian conquest of Palestine in later days. The names of the princes commemorated in it were etymological inventions: eminent Semitic scholars had already explained those of Chedorlaomer and his allies from Sanskrit, and those of the Canaanite princes were derived from the events in which they were supposed to have borne a part." And then he goes on to declare triumphantly (55) how the progress of archaeology has refuted aH these statements. ....<P>It will probably surprise the reader to be told that, of the series of arguments thus attributed to Professor Noldeke, while the one about the names is attributed to him with partial correctness (though in so far as it is stated correctly, it has not been refuted by archaeology), the other arguments were never used by him at all ....(xxxv). The one grain of truth in Professor Sayce\'s long indictment is that of the names of the five Canaanite kings, which are given, Bera and Birsha (suggesting the idea of "evil" and "wickedness"), and perhaps Shinab and Shemeber as well, are formed artificially; but this (NB) is not asserted of the name of any of the four kings from the East....The fact is, Noldeke\'s arguments on <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a> have not been refuted, or even touched, by archaeology....Professor Sayce has simply not mentioned Noldeke\'s real arguments at all. Nor are they mentioned by Dr. Orr or Professor Clay.<p>.... Archaeology has met the arguments which Noldeke did not use; it has not met the arguments which he did use. Noldeke never questioned, as Professor Sayce declares that he did, the general possibility at this time of an expedition being sent from the Far East into Palestine: his argument consisted in pointing out various historical improbabilities attaching to the details of a particular expedition; and archaeology can overthrow this argument only by producing evidence that this expedition, with the details as stated in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, actually took place. And this up to the present time (June, 1909) archaeology has not done.<P>(b) Noldeke\'s Assertions:<P>Compare with these declarations of Driver, one by one, though in somewhat different order, Noldeke\'s own words. He says (Untersuchungen, 157-60):<P>"The chapter begins with an imposing enumeration of kings, in whose time the narrated event is alleged to have occurred....Of what use is the dating according to kings, the time of whose reign is perfectly unknown to us?...so that the dating is wholly superfluous and tells us nothing."<P>Bern and Birsha are said to be "quite decidedly unhistorical....The alliterative pairing also of these names speaks more for their fictitious than for their historical origin. It is striking that for the single historical city of Zoar, no name of the king is given....Besides, we are bound to no time, for the event recounted could quite as well have taken place in the year 4000 as 2000; the artificial chronology of Genesis is for us no rule....Whence the narrator got the names of the hostile kings we cannot say. They may really have been handed down to him, perhaps quite in another connection. However that may be, the utmost we can admit is that he has employed a few correct names intermingled with false or invented ones, and the appearance of historicity thus produced can as little permanently deceive us as the proper names and dates in the book of Esther....Concede provisionally the correctness of the names of the kings and test the narrative further."<P>Here in a long paragraph, Noldeke follows the reductio ad absurdum arguing that, from a historical standpoint, the provisional supposition is incredible and impossible, and concludes (163), "Now this whole expedition is historically improbable to the same extent that it is adapted to the production of a striking effect; the usual sign that it is fictitious....Does not the manifest improbability of the narrative lie precisely in the details which give it the appearance of historicity?"<P>Concerning the story of Abram\'s pursuit of the kings and the rescue of Lot, he says (165): "If that is possible, then is nothing impossible. It may be replied that the number of Abram\'s servants was in reality much greater; but everything depends upon it, and the number belongs again to the very things which spread over the narrative the deceptive shimmer of historicity."<P>Of Melchizedek and the Amorite allies of Abram, he says (168): "So do the proofs pile up, that our narrative has no historical worth....Even if the rest of the chapter were historical we would still hold Melchizedek a poetical figure." He sums up the argument in the following words (170-71): "In accordance with what has been said, it is very improbable that the composer in the chief matters rested upon a real tradition of the people, but we must accept as a fact that it is a free creation throughout."<P>On the same subject, in reply to some of his critics (Zeitschrift fur W. Theol,1870,218-19), he says: "I sum up once more the general points:<P>(1) Of the names mentioned in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, several are unhistorical (the name of Sodom and Gomorrah, the three Amorites, Melchizedek; in my view, also, Abram and Lot, and probably the four overwhelmed cities).<P>(2) The expedition of the kings cannot have taken place as narrated...even through the very clearness of the narrative are we made to know that we have here to do with a romantic expedition, the course of which is determined by aim at sharper effect, and which has for itself no historical probability.<P>(3) The small number of the host, in whose complete victory over the army of the four kings the story at last comes to a climax, is contrary to sense, while yet it designates about the utmost number which, as his own fighting men, a private citizen could put in the field.<P>"Whoever now throughout all of this will hold to an historical kernel may do so; he must then admit that at some perfectly uncertain time in great antiquity a king of Elam ruled over the Jordan land and made a warlike expedition thither. But that would be the utmost concession I could make. Everything more precise, as numbers, names, etc., and also exactly that which produces the appearance of careful tradition and trustworthiness is partly false, partly quite unreliable...more especially, beyond the conquest itself nothing whatever could be known. But to me it still seems much more probable, in view of the consistent, and for the aim of the narrator, exceedingly well ordered, but still, in reality, impossible course of the narrative, out from which there cannot be separated any single things as bare exaggeration of the tradition, that we have here a conscious fiction in which only a few historical names have been used."<P>(c) The Facts of Archaeology:<P>Now, recalling to mind the facts of archaeology in this case (compare above) it becomes evident that they are very far from "harmonizing entirely" with the opinion advanced by Noldeke and reiterated by Driver, and the method of advocating such "harmonizing" appears very clearly. Moreover, what is true of this particular theory of Noldeke and Driver is equally true of other radical critical theories at present held. Of the current reconstructive theories of criticism—the patriarchs not individuals but personifications; the rude, nomadic, semi-barbarous condition of Palestine in the patriarchal age; the desert; Egypt; the comparative unimportance of Moses as a lawgiver; the gradual invasion of Palestine; the naturalistic origin of Israel\'s religion from astral myths; and the late authorship of the Pentateuch—not one is being sustained. In fact, however much archaeological evidence there may be that is negative in character or that is not definitely against the reconstructive theories of criticism, no one can point to a single definite particular of archaeological evidence whereby any one of these theories is positively sustained and corroborated.<P>5. The Present State of the Discussion.<P>The present stage of progress of the testing of critical theories by archaeological evidence may briefly be stated. The Bible at its face value is being corroborated wherever archaeology immediately and definitely touches it. To illustrate this statement fully would be to cite every definite piece of archaeological evidence in the Biblical field of scientific research during the last one hundred years.<P>But views of Scripture must finally square with the results of archaeology, i.e. with contemporaneous history, and, just as archaeological research makes that contemporaneous history to appear, critical theories at variance therewith are of necessity giving way; so that, as far as the process has been carried to the present time, archaeology is bringing criticism into harmony with the face value of Scripture, and is not definitely and unequivocally encouraging attempts at literary reconstruction of any portion of the Bible, although sometimes asked to render such service.<P>LITERATURE.<P>The bibliography of the discussion has appeared in the references fully given throughout this article. The bibliography on the subject of this article, "Archaeology and Criticism," is, as indicated above, exceedingly meager, since the importance of the subject has but recently come to the front and been generally recognized. The following may be cited: Driver, in Authority and Archaeology (Hogarth), chapter i; Eerdmans, Hibbert Journal, July, 1909; also Alttestamentliche Studien; Orr, T he Problem of the Old Testament, chapter xi; Bennett, Contemporary Review,1906,518.``93';

isbe[698]='Archelaus`ar-ke-la\'-us (Archelaos, <a onClick="return mV(\'Mat\',2,22);">Mt 2:22</a>): Son of Herod the Great by his wife Malthace. He succeeded on his father\'s death to the government of Judea, Samaria and Idumaea, but was deposed by the Romans for misgovernment in 6 AD.`<a href="./study/isbe/search.html?string=HEROD">HEROD</a>`1';
isbe[699]='Archery`ar\'-cher-i:<P>(1) The art of using the arcus, or bow and arrow for hunting and in battle is of great antiquity. It is mentioned in <a onClick="return mV(\'Gen\',21,20);">Ge 21:20</a>, as well as in the Iliad and the Odyssey, and depicted on Egyptian monuments and in Assyrian sculptures. The Philistines excelled in the art, which led David to order that special training in it be given to the Hebrews (<a onClick="return mV(\'2Sa\',1,18);">2Sa 1:18</a>). It was an important art throughout the world in Biblical times (see <a onClick="return mV(\'Gen\',27,3);">Ge 27:3</a>; <a onClick="return mV(\'Isa\',22,6);">Isa 22:6</a>; <a onClick="return mV(\'Isa\',49,2);">49:2</a>; <a onClick="return mV(\'Psa\',127,4);">Ps 127:4</a>). The Benjamites among the Hebrews were noted as archers (<a onClick="return mV(\'Jdg\',20,\'1-\');">Jud 20</a>), and archers constituted much of the fighting strength, and played no mean part in the victories, of the world-famed Greek and Roman armies.<P>(2) The bow was common to civil (<a onClick="return mV(\'Gen\',21,20);">Ge 21:20</a>) and military life (<a onClick="return mV(\'Zec\',9,10);">Zec 9:10</a>), and vies with the spear in importance and antiquity. It was usually made of tough, elastic, seasoned wood, and often mounted with bronze (see <a onClick="return mV(\'Psa\',18,34);">Ps 18:34</a> Revised Version (British and American); compare <a onClick="return mV(\'Job\',20,24);">Job 20:24</a>). But horn, too, was used for bows by the ancients, some with double curves being evidently modeled after the horns of oxen. The bow-string was commonly ox-gut and the arrows were of reed, or light wood tipped with flint, bronze, or iron.<P>(3) The battle bows, such as are mentioned in <a onClick="return mV(\'Zec\',9,10);">Zec 9:10</a>; <a onClick="return mV(\'Zec\',10,4);">10:4</a>, must have been of great size, since they required to be strung by pressing the foot on the lower end, while the upper end was bent down to receive the string into a notch; hence the expression "to tread (= string) the bow," and "bowtreaders," for archers (<a onClick="return mV(\'Jer\',50,14,29);">Jer 50:14, 29</a> Hebrew). The arrows, "the sons of his quiver" (<a onClick="return mV(\'Lam\',3,13);">La 3:13</a> margin, the Revised Version (British and American) "shafts"), were ordinarily, of course, carried in the quiver, which was either placed on the back or slung on the left side, secured by a belt over the right shoulder (HDB). The day of gunpowder and firearms, of course, was not yet.``47';
isbe[700]='Archevite`ar\'-ke-vit (Kethibh, \'arkawey; Qere, \'arkewaye\'): One of the tribes which Osnappar transplanted to swell the mixed multitudes in the cities of Samaria (<a onClick="return mV(\'Ezr\',4,9);">Ezr 4:9</a>). The Archevites were the inhabitants of Erech, one of the four cities originally founded by Nimrod in Babylonia. (For its modern site compare Loftus, Travels in Chaldea and Susiana, 162f). Marquardt (Fund, 64f) emends the text to read di kuthaye\', "who are Cuthaeans" (<a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a>).``1';
