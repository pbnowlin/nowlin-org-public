isbe[651]='Apron`a\'-prun: Appears only in <a onClick="return mV(\'Gen\',3,7);">Ge 3:7</a> and <a onClick="return mV(\'Act\',19,12);">Ac 19:12</a> English Versions. English na-prun, north of England nap-peon, from Low Latin, through French nape, nappe, "napkin." The "n" was dropped owing to false division of the article a from the noun; thus "a napron" became "an apron:" In <a onClick="return mV(\'Gen\',3,7);">Ge 3:7</a> it is used to translate a Hebrew word rendered "girdles" in Revised Version margin: "And they sewed fig-leaves together and made themselves aprons." In <a onClick="return mV(\'Act\',19,12);">Ac 19:12</a> simikinthia, stands for semicinctia, which is really a Latin word meaning "half-girdle," i.e. girdles going only half round the body and covering the front of the person: "Unto the sick were carried away from his (Paul\'s) body handkerchiefs (soudaria, rendered "napkins" <a onClick="return mV(\'Luk\',19,20);">Lu 19:20</a>; <a onClick="return mV(\'Jhn\',11,44);">Joh 11:44</a>; <a onClick="return mV(\'Jhn\',20,7);">20:7</a>) or aprons." The word denotes here, probably, a workman\'s apron, perhaps those of Paul himself; though it seems more natural to suppose that the people brought their own "handkerchiefs" or "aprons" to Paul to secure the miraculous effect desired. The garments, at any rate, were such as could be easily removed and carried back and forth. (See Rich, Dict. of Roman and Greek Ant, under the word, for illust.; also Pope\'s Lexicon, under the word).``47';
isbe[652]='Apt`(Literally, "fitted"): Applied to one distinguished for readiness in meeting demands of some special situation, or emergency. For this, there is no specific Biblical word in either Old Testament or New Testament. It occurs always in the English translations in paraphrases, as "apt for war" (<a onClick="return mV(\'2Ki\',24,16);">2Ki 24:16</a>), "apt to teach," Greek "didaktikos" (<a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>; <a onClick="return mV(\'2Ti\',2,24);">2Ti 2:24</a>).``1';
isbe[653]='Aqueduct`ak\'-we-dukt.`<a href="./study/isbe/search.html?string=CISTERN">CISTERN</a>`1';
isbe[654]='Aquila`ak\'-wi-la (Akulas), ("an eagle"): Aquila and his wife Priscilla, the diminutive form of Prisca, are introduced into the narrative of the Acts by their relation to Paul. He meets them first in Corinth (<a onClick="return mV(\'Act\',18,2);">Ac 18:2</a>). Aquila was a native of Pontus, doubtless one of the colony of Jews mentioned in <a onClick="return mV(\'Act\',2,9);">Ac 2:9</a>; <a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>. They were refugees from the cruel and unjust edict of Claudius which expelled all Jews from Rome in 52 AD. The decree, it is said by Suetonius, was issued on account of tumults raised by the Jews, and he especially mentions one Chrestus (Suetonius Claud. 25). Since the word Christus could easily be confounded by him to refer to some individual whose name was Chrestus and who was an agitator, resulting in these disorders, it has been concluded that the fanatical Jews were then persecuting their Christian brethren and disturbances resulted. The cause of the trouble did not concern Claudius, and so without making inquiry, all Jews were expelled. The conjecture that Aquila was a freedman and that his master had been Aquila Pontius, the Roman senator, and that from him he received his name is without foundation.<P>He doubtless had a Hebrew name, but it is not known. It was a common custom for Jews outside of Palestine to take Roman names, and it is just that this man does, and it is by that name we know him. Driven from Rome, Aquila sought refuge in Corinth, where Paul, on his second missionary journey, meets him because they have the same trade: that of making tents of Cilician cloth (<a onClick="return mV(\'Act\',18,3);">Ac 18:3</a>). The account given of him does not justify the conclusion that he and his wife were already Christians when Paul met them. Had that been the case Luke would almost certainly have said so, especially if it was true that Paul sought them out on that account. Judging from their well-known activity in Christian work they would have gathered a little band of inquirers or possibly converts, even though they had been there for but a short time. It is more in harmony with the account to conclude that Paul met them as fellow-tradespeople, and that he took the opportunity of preaching Christ to them as they toiled.<P>There can be no doubt that Paul would use these days to lead them into the kingdom and instruct them therein, so that afterward they would be capable of being teachers themselves (<a onClick="return mV(\'Act\',18,26);">Ac 18:26</a>). Not only did they become Christians, but they also became fast and devoted friends of Paul, and he fully reciprocated their affection for him (<a onClick="return mV(\'Rom\',16,3,4);">Ro 16:3-4</a>). They accompanied him when he left Corinth to go to Ephesus and remained there while he went on his journey into Syria. When he wrote the first letter to the church at Corinth they were still at Ephesus, and their house there was used as a Christian assembly-place (<a onClick="return mV(\'1Cr\',16,19);">1Co 16:19</a>). The decree of Claudius excluded the Jews from Rome only temporarily, and so afterward Paul is found there, and his need of friends and their affection for him doubtless led them also to go to that city (<a onClick="return mV(\'Rom\',16,3);">Ro 16:3</a>). At the time of the writing of Paul\'s second letter to Timothy they have again removed to Ephesus, possibly sent there by Paul to give aid to, and further the work in that city (<a onClick="return mV(\'2Ti\',4,19);">2Ti 4:19</a>). While nothing more is known of them there can be no doubt that they remained the devoted friends of Paul to the end.<P>The fact that Priscilla\'s name is mentioned several times before that of her husband has called forth a number of conjectures. The best explanation seems to be that she was the stronger character.``87';
isbe[655]='Ar, Ar of Moab`ar, mo\'-ab (\'ar, \'ar-mo\'abh; Er; Aroer or Seeir): The city of Ar is named in a snatch of ancient song (<a onClick="return mV(\'Num\',21,15);">Nu 21:15</a>), literally "the site of Ar." It is identical with "Ar of Moab" (<a onClick="return mV(\'Num\',21,28);">Nu 21:28</a>; <a onClick="return mV(\'Isa\',15,1);">Isa 15:1</a>). This is probably the place called the City of Moab in <a onClick="return mV(\'Num\',22,36);">Nu 22:36</a>, where the Hebrew is \'ir mo\'abh. It is probably also intended by "the city that is in the middle of the valley" (<a onClick="return mV(\'Deu\',2,36);">De 2:36</a>; <a onClick="return mV(\'Jos\',13,9,16);">Jos 13:9, 16</a>; <a onClick="return mV(\'2Sa\',24,5);">2Sa 24:5</a>). It lay "on the border of the Arnon, which is in the utmost part of the border" (<a onClick="return mV(\'Num\',22,36);">Nu 22:36</a>). A possible identification might be the ruin noted by Burckhardt, in the floor of the valley, on a piece of pasture-land below the confluence of the Lejjun and the Mojib. Buhl however thinks that not a city but a Moabite district somewhere in the region south of the Arnon may be intended (GAP, 269).``54';
isbe[656]='Ara`a\'-ra (\'ara\', meaning unknown): A son of Jether of the tribe of Asher (<a onClick="return mV(\'1Ch\',7,38);">1Ch 7:38</a>).``1';
isbe[657]='Arab`a\'-rab (\'arabh, "ambush"): A city in the hill country of Judah, probably the site of the ruins Er-Rabiyeh south of Hebron (<a onClick="return mV(\'Jos\',15,52);">Jos 15:52</a>).``1';
isbe[658]='Arab; Arabians`ar\'-ab, a-ra\'-bi-ans.`<a href="./study/isbe/search.html?string=ARABIA">ARABIA</a>`1';
isbe[659]='Arabah`ar\'-a-ba, a-ra\'-ba ha-\'arabhah, ("the Arabah"): This word indicates in general a barren district, but is specifically applied in whole or in part to the depression of the Jordan valley, extending from Mount Hermon to the Gulf of Akabah. In the King James Version it is transliterated only once (<a onClick="return mV(\'Jos\',18,18);">Jos 18:18</a>) describing the border of Benjamin. Elsewhere it is rendered "plain." But in the Revised Version (British and American) it is everywhere transliterated. South of the Dead Sea the name is still retained in Wady el-Arabah. In <a onClick="return mV(\'Deu\',1,1);">De 1:1</a>; <a onClick="return mV(\'Deu\',2,8);">2:8</a> (the King James Version "plain") the southern portion is referred to; in <a onClick="return mV(\'Deu\',3,17);">De 3:17</a>; <a onClick="return mV(\'Deu\',4,49);">4:49</a>; <a onClick="return mV(\'Jos\',3,16);">Jos 3:16</a>; <a onClick="return mV(\'Jos\',11,2);">11:2</a>; <a onClick="return mV(\'Jos\',12,3);">12:3</a> and <a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a> the name is closely connected with the Dead Sea and the Sea of Chinnereth (Gennesaret). The allusions to the Arabah in <a onClick="return mV(\'Deu\',11,30);">De 11:30</a>; <a onClick="return mV(\'Jos\',8,14);">Jos 8:14</a>; <a onClick="return mV(\'Jos\',12,1);">12:1</a>; <a onClick="return mV(\'Jos\',18,18);">18:18</a>; <a onClick="return mV(\'2Sa\',2,29);">2Sa 2:29</a>; <a onClick="return mV(\'2Sa\',4,7);">4:7</a>; <a onClick="return mV(\'2Ki\',25,4);">2Ki 25:4</a>; <a onClick="return mV(\'Jer\',39,4);">Jer 39:4</a>; <a onClick="return mV(\'Jer\',52,7);">52:7</a> indicate that the word was generally used in its most extended sense, while in <a onClick="return mV(\'Jos\',11,16);">Jos 11:16</a>, and <a onClick="return mV(\'Jos\',12,8);">12:8</a> it is represented as one of the great natural divisions of the country.<P>The southern portion, which still retains the name of Arabah, is included in the wilderness of Zin (<a onClick="return mV(\'Num\',34,3);">Nu 34:3</a>). According to the survey of Lord Kitchener and George Armstrong made in 1883, under the auspices of the Palestine Exploration Fund, its length from the head of the Gulf of Akabah to the Dead Sea is 112 miles. The lowest point of the watershed <span class="noTag">is 45</span> miles from Akabah, and 660 feet above tide (1,952 above the Dead Sea). The average width of the valley up to this point is about 6 miles, but here a series of low limestone ridges (called Er Risheh) rising 150 feet above the plain runs obliquely across it for a distance of 10 miles, narrowing it up to a breadth of about one-half mile. North of this point, opposite Mount Hor, the valley widens out to 13 miles and then gradually narrows to 6 miles at the south end of the Dead Sea. At Ain Abu Werideh, 29 miles north of the watershed, the valley is at the sea-level—1,292 feet above that of the Dead Sea. North of the watershed, the main line of drainage is the Wady el-Jeib, which everywhere keeps pretty close to the west side of the valley.<P>At Ain Abu Werideh it is joined by numerous wadies descending from the Edomite mountains on the east, which altogether water an oasis of considerable extent, covered with a thicket of young palms, tamarisks, willows and reeds. Twenty-four miles farther north the Arabah breaks down suddenly into the valley of the Dead Sea, or the Ghor, as it is technically called. Lord Kitchener\'s report is here so vivid as to be worthy of literal reproduction. "The descent to the Ghor was down a sandy slope of 300 feet, and the change of climate was most marked, from the sandy desert to masses of tangled vegetation with streams of water running in all directions, birds fluttering from every tree, the whole country alive with life; nowhere have I seen so great and sudden a contrast" (Mount Seir, 214). The descent here described was on the eastern side of the semicircular line of cliffs formed of sand, gravel, and marl which enclose the Ghor at the south end, and which are probably what are referred to in <a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a> as the "ascent of Akrabbim." The ordinary route, however, leading to the plain of the Arabah from the Dead Sea is up the trough worn by the Wady el-Jeib along the west side of the valley. But this route would be impracticable during the rainy season after the cloudbursts which occasionally visit this region, when torrents of water pour down it, sufficient to roll boulders of considerable size and to transport an immense amount of coarse sediment.<P>South of the Dead Sea a muddy plain, known as the Sebkah, extends 6 miles, filling about one-half of the width of the Ghor. During most of the year the mud over this area is so thin and deep that it is impossible to cross it near its northern end. This whole area between the "ascent of Akrabbim" and the Dead Sea has evidently been greatly transformed by the sedimentary deposits which have been brought in by the numerous tributary wadies during the last 4,000 years, the coarser material having encroached upon it from either side, and the fine material having been deposited over the middle portion, furnishing the clay which is so embarrassing to travelers. (For further considerations upon this point see <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>; <a href="./study/isbe/search.html?string=CITIES+OF+THE+PLAIN">CITIES OF THE PLAIN</a>.)<P>1. Geology of the Region:<P>The Arabah in its whole extent occupies a portion of the great geological fault or crevasse in the earth\'s crust which extends from Antioch near the mouth of the Orontes southward between the Lebanon and the Anti-Lebanon Mountains to the valley of the Jordan and the Dead Sea, and onward to the Gulf of Akabah, whence it can be traced with considerable probability through the Red Sea and the interior lakes of Africa. The most remarkable portion of this phenomenal crevasse is that which extends from the Waters of Merom to the springs of Ain Abu Werideh; for through this entire distance the Arabah is below sea-level, the depression at the Dead Sea being approximately 1,292 feet. See <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>. Throughout the entire distance from the Waters of Merom to the watershed, 45 miles from Akabah, the western side of the Arabah is bordered by strata of Cretaceous (chalk) limestone rising pretty continuously to a height of from 2,000 to 3,000 feet above sea-level, no older rocks appearing upon that side. But upon the eastern side older sandstones (Nubian and lower Carboniferous) and granitic rocks border the plain, supporting, however, at a height of 2,000 or 3,000 feet Cretaceous limestones corresponding to those which descend to the level of the gorge on the western side.<P>Throughout this entire distance, therefore, the strata have either slipped down upon the western side or risen upon the eastern side, or there has been a movement in both directions. The origin of this crevasse dates from the latter part of the Cretaceous or the early part of the Tertiary period.<P>But in post-Tertiary times an expanded lake filled the region, extending from the Waters of Merom to Ain Abu Werideh, a distance of about 200 miles, rising to an elevation of about 1,400 feet above the present level of the Dead Sea, but not sufficiently high to secure connection with the ocean either through the Arabah proper or across the valley of Esdraelon. This body of water was, on the average, 30 miles wide and over the northern part of the Dead Sea had an extreme depth of 2,700 feet. The most distinct evidence of the existence of this enlargement of the lake is to be found at Ain Abu Werideh, where Hull reports "banks of horizontally stratified materials...sometimes of coarse material, such as gravel; at other times consisting of fine sand, loam, or white marl, with very even stratification, and containing blanched semi-fossil shells of at least two kinds of univalves, which Professor Haddon has determined to be Melania tuberculata Mull, and Melanopsis Saulcyi, Bourg" (Mount Seir,99,100).<P>These are shells which are now found, according to Tristram, in great numbers in semi-fossil condition in the marl deposits of the Dead Sea, and both of these genera are found in the fluvio-marine beds formed in the brackish or salt water of the Isle of Wight. The existence of the shells indicates the extent to which the saline waters of the Dead Sea were diluted at that time. It should be added, however, that species somewhat similar still exist around the borders of the Dead Sea in lagoons where fresh water is mingled in large quantities with that of the Dead Sea. This is especially true in eddies near the mouth of the Jordan. (See Merrill, East of the Jordan.) Huntington in 1909 confirms the fact that these high-level shore lines are found on both sides of the Dead Sea, though for some reason the have not been traced farther north.<P>At lower levels, especially at that which is 650 feet above the Dead Sea, there is, however, a very persistent terrace of gravel, sand and clay marking a shore line all the way from the south end of the Dead Sea to Lake Galilee. This can be seen running up into all the wadies on either side, being very prominent opposite their mouths, but much eroded since its deposition. On the shores of the lake between the wadies the line is marked by a slight accumulation of coarse material. Below the 650-foot line there are several other minor strands marking periods when the subsiding waters were for a short time stationary.<P>This period of enlargement of the waters in the Arabah is now, with abundant reason, correlated with the Glacial epoch whose influence was so generally distributed over the northern hemisphere in early post-Tertiary times. There were, however, no living glaciers within the limits of the Arabah Valley—Mount Hermon not being sufficiently large to support any extensive ice-sheet. The nearest glacier of any extent was on the west side of the Lebanon Mountains, 40 to 50 miles north of Beirut, where according to my own observations one descended from the summit of the mountains (10,000 feet high) 12 miles down the valley of the Kadesha River to a level 5,500 feet above the sea, where it built up an immense terminal moraine several miles across the valley, and 5 miles up it from its front, upon which is now growing the celebrated grove of the Cedars of Lebanon. (See Records of the Past, Am. series, V, 195-204.) The existence of the moraine, however, had been noted by Sir Joseph Hooker forty years before. (See Nat. Hist. Rev., January, 1862.)<P>But while there were no glaciers in the Arabah Valley itself, there, as elsewhere, semi-glacial conditions extended beyond the glacial limits a considerable distance into the lower latitudes, securing the increased precipitation and the diminished evaporation which would account for the enlargement of the bodies of water occupying enclosed basins within reach of these influences. The basin of Great Salt Lake in Utah presents conditions almost precisely like those of the Arabah, as do the Caspian and Aral seas, and lakes Urumiah, Van, and various others in central Asia. During the Glacial epoch the water level of Great Salt Lake rose more than 1,000 feet higher than now and covered ten times its present area. At the same time the Aral Sea discharged into the Caspian Sea through an outlet as large as Niagara. When the conditions of the Glacial epoch passed away the evaporation again prevailed, until the water areas of these enclosed basins were reduced to the existing dimensions and the present equilibrium was established between the precipitation and the evaporation.<P>While it is susceptible of proof that the close of this epoch was geologically recent, probably not more than 10,000 years ago (see Wright, Ice Age in North America, 5th edition, chapter xx), the present conditions had become established approximately long before the time of Abraham and the development of civilization in Babylonia and Egypt.<P>East of the Arabah between the Dead Sea and Akabah numerous mountain peaks rise to the height of more than 4,000 feet above tide level, the highest being Mount Hor, though back of it there is a limestone range reaching 5,000 feet. This mountainous region contains numerous fertile areas and furnishes through its numerous wadies a considerable amount of water to favor vegetation. The limestone floor of the Arabah south of the Dead Sea is deeply covered with sand and gravel, washed in from the granitic areas from the east. This greatly favors the accumulation of sediment at the mouths of the wadies emptying into the south end of the Ghor.<P>2. History: At present the Egyptian government maintains a fort and harbor at Akabah, but its authority does not extend into the interior. The Arabah has, however, from time immemorial furnished a caravan route between Northern Arabia and the Sinaitic Peninsula. It was this which supported the great emporium of Petra. The Israelites traversed its southern portion both on their way from Horeb to Kadesh-barnea and on their return, when the king of Edom refused passage through his land (<a onClick="return mV(\'Num\',20,21);">Nu 20:21</a>; <a onClick="return mV(\'Deu\',2,3);">De 2:3</a>). This opposition compelled them to turn up the forbidding Wady el-Ithem, which opens into the Arabah a few miles north of Akabah and leads to the Pilgrim route between Damascus and Mecca. The terrors of this passage are referred to in <a onClick="return mV(\'Num\',21,4);">Nu 21:4</a>, where it is said "the soul of the people was much discouraged because of the way." Around Akabah itself there are still groves of palms, the existence of which, at the time of the Exodus, is indicated by the name Elath (<a onClick="return mV(\'Deu\',2,8);">De 2:8</a>), "a grove of trees."<P>LITERATURE.<P>Burchkhardt, Travels in Syria and the Holy Land, 1822; De Laborde, Voyage en Orient, 1828; Hull, Mount Seir, Sinai, and Western Palestine, 1889; "The Physical Geol. and Geog. of Arabia Petrea," etc., in PEF, 1886; Lartet, Voyage d\'exploration de la Mer Morte, t. 3me, 1880; Robinson, BR, 1855; Stanley, Sinai and Pal5, 1860; Blankenkorn, "Entstehung u. Gesch. des Todten Meeres," in ZDPV, 1896; Ritter, "Comp. Geog. of Palestine and the Sinaitic Peninsula," 1866, translation by Wm. L. Gage; Huntington, Palestine and Its Transformation, 1911.``198';
isbe[660]='Arabattine`ar-a-ba-ti\'-ne.`<a href="./study/isbe/search.html?string=AKRABATTINE">AKRABATTINE</a>`1';
isbe[661]='Arabia`a-ra\'-bi-a (\'arabh, Arabia): <P><b>I. NAME AND SITUATION</b><P class="in15">1. Name<P class="in15">2. Situation and Configuration<P><b>II. PHYSICAL FEATURES</b><P class="in15">1. The Desert<P class="in15">2. Climate<P class="in15">3. Mountains<P class="in15">4. Rivers<P class="in15">5. Oases and Wells<P><b>III. POLITICAL DIVISIONS</b><P class="in15">1. Ancient Divisions<P class="in15">2. Modern Divisions<P class="in15">3. Political Situation<P class="in15">4. Chief Towns<P><b>IV. FLORA AND FAUNA</b><P class="in15">1. Flora<P class="in15">2. Fauna<P><b>V. INHABITANTS</b><P class="in15">1. Classification<P class="in15">2. Extinct Tribes<P class="in15">3. South Arabian Tribes<P class="in15">4. Migration of Tribes<P class="in15">5. North Arabian Tribes<P class="in15">6. Other Tribes<P class="in15">7. Foreign Elements<P><b>VI. RELIGION</b><P class="in15">1. Monotheism<P class="in15">2. The Ka\'bah, Pilgrimages and Fairs<P class="in15">3. Judaism<P class="in15">4. Christianity<P class="in15">5. Sabianism<P class="in15">6. Seekers after Truth: Islam<P><b>LITERATURE</b><hr /><P>I. Name and Situation.<P>1. Name:<P>The Hebrew word \'arabh always denotes, strictly speaking, not the country, but the people of Arabia taken collectively, and especially the nomadic Arabs. The name of the country does not occur in the Old Testament, but in the New Testament it is used to denote the Syrian desert or the peninsula of Sinai.<P>2. Situation and Configuration:<P>Surrounded as it is on three sides by the sea—by the Indian Ocean on the south, and its two branches, the Red Sea on the west and the Persian Gulf on the east—and on the fourth side by the desert of Syria, the country of Arabia is to all intents and purposes an island; and it is named by its inhabitants and by those who speak their language "the Island of the Arabs." In configuration the country is roughly of the form of a parallelogram, about 1,000 miles in length by 500 or 600 miles broad. This parallelogram is not of uniform altitude, but the generally even surface is tilted to one corner in such a way that the most southerly point contains mountains rising to 10,000 feet in height, whilst the northeast corner is almost on a level with the sea. The altitudes of the intervening portions are in proportion to their situation with respect to these extremes. Thus the mountains of the southeast corner have an altitude of from 5,000 to 6,000 feet, those of the northwest of 4,000 or 5,000, whereas those which are situated near the middle of the west coast rise to 8,000 feet, and the plateau which forms the northern half of the interior of the peninsula is between 3,000 and 4,000 feet above sea-level. In consequence of this configuration the main watershed of the country runs parallel to the west coast at a distance of between 50 and 100 miles from the sea, with a subsidiary watershed running along the south; and the principal outlets for the drainage run in a northeast direction. The whole of Arabia stretches from about 13 degrees to about 36 degrees north of the equator, and it lies between 33 degrees and 60 degrees east of Greenwich. Its area is about eight times that of the British Isles, or nearly 1,000,000 square miles.<P>II. Physical Features.<P>1. The Desert:<P>Although Arabia is considered by geographers as part of the continent of Asia, it belongs in almost every respect to Africa. The great bulk of the country is desert, of fine sand in the southern part, but consisting of coarse sand (the nefud), gravel and flints in the northern. It is in fact an offshoot from the great African Sahara. Of the southern half little is known, and it has never been crossed by the foot of European. The northern has been traversed in many directions; it has numerous caravan routes, and some important towns are situated in the heart of it. Arabian fancy has peopled the desert with strange creatures not of human kind (compare <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>), and fancy has been justified by the common phenomena of the mirage and the Fata Morgana (<a onClick="return mV(\'Isa\',35,7);">Isa 35:7</a>; <a onClick="return mV(\'Isa\',49,10);">49:10</a>). To the keen sight of the nomad the glowing desert heat is visible as a fine gossamer (<a onClick="return mV(\'Isa\',18,4);">Isa 18:4</a>). Perhaps this is the meaning of sharabh in <a onClick="return mV(\'Isa\',35,7);">Isa 35:7</a>; <a onClick="return mV(\'Isa\',49,10);">49:10</a> also. It is quite certain, however, that the whole of Arabia and especially the northern borders in the neighborhood of the Sinai peninsula and eastward to the south of Palestine and the country of Edom, were at one time very much better watered than they are at the present day. For centuries a constant process of desiccation has been going on. Indeed, persons now living can remember the existence of wells one or two generations ago, where now there are none. It follows that this district must formerly have supported a very much larger population that it does at present.<P>2. Climate:<P>It will be obvious that the climate of Arabia must vary greatly in its different parts, the temperature and rainfall depending not so much upon latitude as upon latitude, so that within a few miles the greatest extremes co-exist. In the southern angle where the mountains are highest there are two rainy seasons, one in spring the other in autumn, so that this province well deserves its Grecian name of Arabia Felix. In the higher reaches of this province, for example, at its capital San\'a, snow falls in December; while on the coast of the Red Sea at Loheia, scarcely 100 miles distant, thermometer rarely falls below 80 degrees. In the Red Sea 93 degrees is a common reading in the shade in summer, while the heat of the Persian Gulf, owing to its steep shores and great evaporation, is hardly endurable by a European. In the northwest province, in which are situated the two sacred cities of Mecca and Medina, the rainfall is unreliable and takes the form of heavy thunder showers which occasion frequent floods in the former town, and are, owing to the arborial denudation of the country, of little use for the purpose of agriculture or irrigation. These winter rains may commence as early as September, and by December at latest the new pasture will have covered the ground. Hence the true spring in Northern Arabia, or in Syria, falls in our autumn, but there is not the distinction of former and latter rain (compare <a onClick="return mV(\'Hsa\',6,3);">Ho 6:3</a>) which obtains in Palestine. The climate of the northern central plateau is described by Palgrave as one of the most salubrious in the world.<P>3. Mountains:<P>As has been indicated above, the backbone of the peninsula is the mountain range which runs down its western side. In its northern parts this is said to be an extension of the limestone ranges of the Lebanon and Anti-Libanus. In its midmost reaches it attains an elevation of between 8,000 and 9,000 feet, and at its southern extremity it spreads out into the plateau of Arabia Felix, where its highest peaks have an altitude of as much as 11,000 feet. In the southeast corner of the peninsula the range of Jebel Akhdar runs parallel to that on the west, and is connected with it along the south coast by a range of less elevation. In the interior the northern plateau is intersected by numerous irregular mountain ranges of moderate length, of which the most frequently mentioned are Jebel Aja and Jebel Selma, which face one another in the Shammar country.<P>4. Rivers:<P>The course of the rivers is determined by the direction of the mountain ranges. As has been said the drainage is mainly from west to east, but the fact is that Arabia is a land almost without rivers. The only quarter in which perennial streams are found is Arabia Felix, and to some extent they occur along the south coast. The rest of the peninsula is destitute of rivers and lakes. The scour (seyl) from the winter thunder showers cuts out for itself a torrent bed (wadi), which, however, may be filled only once or twice in a generation, and even so dries up as soon as the rain ceases. The most important of these wadis is the West Sirhan, which runs from the Hauran in a southeast direction to the Jauf (see <a href="./study/isbe/search.html?string=DUMAH">DUMAH</a>), the West el-Kora to the north of Medina, the West el-Hamth between Medina and Mecca, and the West Duweisir to the south of Mecca. Larger than any of these however is the West er-Rumma, which extends from the neighborhood of Medina to the head of the Persian Gulf. It has never been explored, and is filled with water only at long intervals.<p>5. Oases and Wells:<P>In these circumstances the Arabs have to seek their water supply elsewhere than in their rivers. In many places the surface of the country sinks into a depression down to the level of permanent water, thus forming an oasis, which word is probably none other than the Arabic wadi. The best known of these occur at Kheibar and Teima (see <a href="./study/isbe/search.html?string=TEMA">TEMA</a>) to the north of Medina, and also at Tabuk to the northwest. The West Duweisir is itself practically an oasis of a length of three days\' journey. In addition to these natural depressions there are also dotted over all the inhabited parts of Arabia and along the caravan routes numerous wells, these routes following naturally the course of the wadis. These wells are plentiful in the West Sirhan, and a number were sunk by command of Zubeida the wife of Harun al-Rashid, along the Pilgrim way from Persia to Mecca; but the most famous of all is the well of Zemzem in the Holy City itself. It is said that the water in it flows, so that it is probably one of those subterranean rivers which are not uncommon in Arabia. Its water, however, is heavy and brackish and causes indigestion, and the sweetest water obtainable in Mecca for drinking purposes was originally brought by Zubeida from a source some 15 miles distant. The purest water of all is that which collects after rain in the hollows of the numerous outcrops of lava which occur at frequent intervals and in great masses along the western mountain ranges. A spot where lava predominates is called a harrah (from the Arabic verb "to be hot"), and several of these volcanic regions still show signs of activity.<P>III. Political Divisions.<P>1. Ancient Divisions:<P>The peninsula of Arabia was divided by the ancient geographers into three parts: Arabia Petrea, Arabia Deserta and Arabia Felix. The first of these names, which is found in Ptolemy, means, not Arabia the Rocky, but that part of Arabia in which is situated the city of Petra (see <a href="./study/isbe/search.html?string=SELA">SELA</a>), and it also includes the peninsula of Sinai. It is identical with the desert of the Wanderings. Arabia Deserta is a translation from the Greek Arabia eremos of Strabo (circa 24 AD). It denotes the extreme north of the continent of Arabia which is thrust in like a wedge between the fertile lands which drain into the Euphrates on the east and into the Jordan valley on the west. It is thus equivalent to the Syrian Desert. The third term, Arabia Felix, is also a translation from the Greek—Arabia eudaimon—which is again a translation, or rather a mistranslation of the Arabic El-Yemen. This last name denotes the country to the right hand, i.e. the S, just as the Arabic Es-Shem (Syria) means the country to the left hand, or to the north El-Yemen, however, was interpreted as equivalent to El-Eyman, the Fortunate or Happy, a name which the district truly deserves.<P>2. Modern Divisions:<P>Since before the time of Mohammed (6th century) Arabia has been divided into seven or eight tribal or political states, the boundaries of which are for the most part clearly defined by intervening deserts or uninhabited tracts. The most important of these from a religious point of view is the Hijaz, which may be described as the northern half of the western coast, stretching from the Red Sea to a distance of between 100 and 200 miles inland. The whole of the coast line, indeed, where the land is low lying is called the Tihama. This may, however, be considered as belonging to the adjacent high land beneath which it lies. Hijaz means "Barrier," and the district is so called because it consists mainly of the mountain ranges which separate the great northern central plateau from the Tihama. This last name is connected with a root meaning "to be unwholesome." Whether the district gave its origin to the verb, or the verb gave its denomination to the district, the name is equally appropriate. The chief importance of the Hijaz arises from the fact that in it are situated the two holy cities of Mecca and Medina—the cradle and the grave of the Prophet. It is thus the religious center of the Islamic world.<P>The Yemen forms the southern corner of the peninsula. It is identical with Arabia Felix, and its physical characteristics have been described above. The Hijaz often fell to the sovereign of Egypt, but for the last four centuries it has, like Egypt, been subject to the Turk. It is only within the last fifty years, on the other hand, that the sultan has attempted to enforce his sovereign rights in the Yemen. The southern coast of Arabia is generally designated as Hadramaut, although in strictness that appellation is properly applicable to a section of it only. The eastern corner of Arabia is taken up by Oman, a state which has generally claimed and secured a position of independence. Both it and the southern states are now under the protection of the Indian government. The country adjacent to Oman toward the north formed the province of El-Bahrein ("the Two Seas"), but this name is now restricted to a large island at the western end of it and some smaller islands famous for their pearl fishery. The remaining province of El-Hasa is occupied by practically independent tribes. From many points of view the most interesting province of Arabia is the great northern central plateau called Nejd, that is, "high land." From its situation it is least susceptible to foreign influence. It contains some fairly large towns, but the bulk of its population live, as their fathers have done from time immemorial, the life of the Bedawi. Two small provinces remain to be noticed. Between the Yemen and the Hijaz lies the district of \'Asir, which largely resembles the first-named province in its physical features. To the east of Nejd lies the district of Yemama, which used to be the territory of an important tribe.<P>3. Political Situation:<P>On the whole the political situation in Arabia today bears a considerable resemblance to that which obtained immediately before the mission of Mohammad. At that time (about 600 AD) the northwest parts of the peninsula were more or less subject to the Byzantine emperor, while the whole east and south coasts were under the sway of Persia. Today the west coast of Arabia is again subject to Constantinople, and the east and south coasts are under the protection of an eastern power—in this case the government of India.<P>4. Chief Towns:<P>The principal towns of Arabia and the other centers of population owe their existence to the natural features of the country and have probably remained the same in all ages, just as those of Palestine have, and even their population does not seem to have altered much. Thus Mecca owes its existence to the presence of the famous well Zemzem; Teima, Kheibar and Tabuk to their oases; Mascat, the capital of Oman, to its natural harbor; and so on. An exception is the ancient town of Saba (see SHEBA) or Marib, which probably sprang up as the result of the building in prehistoric times of a gigantic dam for the purposes of irrigation. When the dam burst in the 2nd or 3rd Christian century, the population dispersed. Owing to the absence of a census it is not possible to make accurate statements regarding the population of an eastern town, and estimates by European travelers always vary greatly. Speaking generally, the cities of Arabia of the first magnitude appear to have some 35,000 inhabitants, though Mascat is said to have as many as 60,000.<P>IV. Flora and Fauna.<P>1. Flora:<P>The peninsula of Arabia belongs, as has been said, in its physical features to Africa, and its flora and fauna are those of that continent. Of all the products of the soil by far the most important is the date palm. It flourishes in every oasis. In the Wadi Duweisir alone it is said one may ride straight on for three days without leaving the shelter of the palm groves. The dates, which are the staff of life of the Arab, differ in quality in each locality, each district producing a variety of its own. In the Yemen, with its varied altitudes, almost every kind of fruit and vegetable known in temperate latitudes is cultivated on the terraced mountain sides. Vines are grown, as Ibn Khaldun remarks, for the sake of the berry, not for the purposes of wine making. The vine is common to Arabia and Palestine, whereas the date palm has almost gone out of cultivation in the latter country. On the other land the olive, which is so important in the northern country is almost unknown in the southern. The olive is constantly referred to in the Bible (<a onClick="return mV(\'Jdg\',9,8);">Jud 9:8</a> and often), the date never. From the south coast especially are exported frankincense, balsam, myrrh and other aromatic plants; and cotton is cultivated in the province of Oman. Cereals flourish in the Yemen and tobacco is grown wherever possible in Arabia The coffee of the Yemen is famous; it is exported to Constantinople and named from the port of export Mokha coffee; but the bulk of it is consumed within Arabia itself. Coffee and tobacco are the only two articles of consumption which are used in Arabia today, and which have not been used from time immemorial. Coffee was probably introduced into Arabia from Gallaland on the African mainland two or three centuries ago.<P>The Arabs are most inveterate coffee drinkers. Tobacco was probably first brought from English ships at Constantinople in the reign of James I. It is cultivated in every oasis, unless in the interior in Nejd, where its use is discouraged on religious grounds. There is only one other point in regard to which the Arabs of today differ from the Arabs of Mohammed\'s time—the use of gunpowder. Except in respect of the three commodities just mentioned, everyday life in the desert today goes on exactly as it did 1,600 years ago. Forest trees are extremely rare in Arabia, but a species of tamarisk called ghada which grows in the Northern Nefud is proverbial for the quality of charcoal it affords and is a favorite food of the camel. An acacia called katad is likewise a by-word on account of its long spines. The wood is used for making camels\' saddles; it grows in the Tihama. As in Palestine and in most countries which have been inhabited for many thousands of years, the larger trees have long been cut down for fuel or for building purposes.<P>2. Fauna:<P>Among beasts of prey panthers, wolves, hyenas, jackals and (it is said) even lions are found in Arabia Many of the tribes are named after these and other animals. The wild ox or oryx (see <a href="./study/isbe/search.html?string=UNICORN">UNICORN</a>) is rarely seen, but gazelles are plentiful. Apes abound in the Yemen, as they do all along the north of Africa, and are kept as pets (compare <a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a>). By far the most important domestic animal is the camel. Without it many parts of the country would be uninhabited. It is commonly supposed that the best breed of horses comes from Nejd, but this appears to be an error. In Nejd the camel is the indispensable beast of burden and mount; horses are comparatively useless there. The best Arabian horses are reared in Mesopotamia. Studs are, indeed, kept by the emirs of Nejd, but the horses are small and of little use. The pedigrees of the best horses go back, according to tradition, to the time of Solomon (<a onClick="return mV(\'1Ki\',10,28);">1Ki 10:28</a>). Dogs are trained to hunt the wild ox, to tend sheep and to watch the camp. All domestic animals—dogs, horses, mules, asses—receive names as with us.<P>The ostrich is rarely met with, but is found as far north as the Jauf; it no doubt found its way into Arabia from Africa. A common bird is the kata or sand grouse. It is noted for going straight to its watering place. "Better guided than a kata" is a common proverb. Hawks and falcons are found, and falconry among the Arabs was a favorite sport. In Arabia the locust, so far from being a scourge wherever it appears, is a valuable article of food. It is eaten not only by human beings (<a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>), but also by dogs, horses and even beasts of prey. As might be expected in a rocky and sun-scorched land like Arabia, scorpions and various sorts of serpents abound. The chameleon (<a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>) is common here. It is used as a simile for fickle people and those who do not fulfill their promises. It may be regarded as a substitute for thermometer, as on very hot days it ascends trees or any high places. Another sign of extreme heat is that the vipers writhe on the ground.<P>The Persian Gulf, especially the Bahrein archipelago, is famous for its pearls, while the Red Sea is noted for its coral reefs, which have caused many a shipwreck. It is believed that in the interior of Hadramaut there are many mineral deposits including gold.<P>V. Inhabitants.<P>1. Classification:<P>The inhabitants of Arabia are divided into three classes. There are in the first place a number of tribes which became extinct, and which are not connected genealogically with those which survived. The latter are divided into two great stems, the south Arabian and indigenous branch descended from Kahtan, and the north Arabian or immigrant tribes descended from Ishmael, the son of Abraham. There is naturally a good deal of inconsistency in the various traditions of the origins of these tribes and their subsequent history.<P>2. Extinct Tribes:<P>Of the extinct tribes the most familiar name is that of Amlak or Amlik (Amalek). By the Arabian genealogists he is variously described as a grandson of Shem and as a son of Ham. In <a onClick="return mV(\'Gen\',36,12);">Ge 36:12</a> he is a son of Esau\'s son, Eliphaz, by Timna. They are said to be first met with in Chaldea, from which they were expelled on the rise of the Assyrian power under Nimrod. They migrated into Ar, occupying in turn the Bahrein, Oman, the Yemen, and finally the Hijaz, where they are said to have been the first settlers at Yathrib (Medina) and also to have occupied land round Mecca and Kheibar. In the time of Abraham they were expelled from Mecca on the arrival of two new tribes from the south, those of Jurhum and Katura (<a onClick="return mV(\'Gen\',25,1);">Ge 25:1</a>). Later, it is said, David, during the rebellion of Absalom, took up his quarters in Kheibar and ruled over the surrounding districts. According to another tradition Moses sent an expedition against the Amalekites in the Hijaz, on which occasion the Israelites, disobeying his orders, spared their king Arkam (compare Rekem, <a onClick="return mV(\'Num\',31,8);">Nu 31:8</a>; <a onClick="return mV(\'Jos\',13,21);">Jos 13:21</a>)—a reminiscence of the incident in the life of Saul (<a onClick="return mV(\'1Sa\',15,\'1-\');">1Sa 15</a>). In any case the Amalekites were supplanted in the Northern Hijaz by Jewish tribes, who continued there until the time of Mohammad.<P>The Amalekites migrated into Egypt and Southern Palestine. The Pharaohs of the time of Abraham, Joseph and Moses are represented to have been Amalekites. Finally, broken up by Joshua, they fled into Northern Africa, where they are said to have grown into the Berber races. The rest of the tribes which became extinct like the Amalekites are of less interest for the present purpose, being unconnected with the Bible narrative. They are mentioned in the Koran, in which book their destruction is attributed to their idolatrous proclivities and to their rejection of the monotheistic prophets. The best known and most important are \'Ad and Thamud \'Ad is variously named the son of Amalek and the son of Uz (<a onClick="return mV(\'Gen\',10,23);">Ge 10:23</a>).<P>The tribe dwelt in the deserts behind the Yemen. They became polytheists; the prophet Hud was sent to them; they rejected him, and were destroyed by a hurricane. The remnant grew into a new tribe, whose chief, Lokman, built the great dam at Marib. In the end they were conquered by a tribe of Kahtan. Thamud was closely related to \'Ad, being a son of Aram the father of Uz. They were driven out of the Yemen and settled in the Northern Hijaz; they rejected their prophet Salih and were destroyed by an earthquake accompanied by a loud noise. The rock-cut sepulchral monuments of Medain Salih in the Wadi el-Kora are still pointed out as their dwellings. They were, therefore, considered to have been troglodites like the Horites of the Bible. A second pair were the brother tribes of Tasm and Jadis, grandsons of Aramaic Tasm oppressing Jadis, the latter rose and almost exterminated the former, only to be in turn destroyed by a king of the Yemen. Their home was Yemama.<P>3. South Arabian Tribes:<P>The Southern Arabs claim to be descended from an ancestor called Kahtan son of \'Abir, son of Shalikh, son of Arfakhshad, son of Shem, son of Noah. Kahtan is undoubtedly the Biblical Joktan (<a onClick="return mV(\'Gen\',10,26);">Ge 10:26</a>), and the names of his descendants reappear as Arabic place names. Indeed the tenth chapter of Genesis throws much light on the earliest history of Arabia and the movements of the tribes. Thus the fact that Sheba and Dedan appear as grandsons of Cush, that is, as Abyssinian tribes descended from Ham, in <a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a> and again as descendants of Keturah and Abraham in <a onClick="return mV(\'Gen\',25,3);">Ge 25:3</a> points to the fact that parts of these tribes migrated from the one country to the other. Havilah in <a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a> may similarly be connected with Havilah in <a onClick="return mV(\'Gen\',10,29);">Ge 10:29</a>, the intercourse between southwest Arabia and the opposite coast of Africa being always very close. Among the sons of Joktan are mentioned Almodad, Hazarmaveth, Uzal (Izal), Sheba, Ophir, Havilah. In Almodad we have probably the Arabic El-Mudad, a name which occurs among the descendants of Jurhum, son of Yaktan (Joktan). Hazarmaveth is obviously Hadramaut. Uzal is the ancient name of San\'a, the capital of the Yemen. Sheba is the Arabic Saba or Marib. Ophir and Havilah were probably in south or east Arabia. In <a onClick="return mV(\'Gen\',10,30);">Ge 10:30</a> it is said that the camping grounds of these tribes stretched from Mesha as you go toward Sephar, the mountain of the east, that is, probably from the north of the Persian Gulf to the center of south Arabia, Sephar being Zafar, the capital of the South Arab kingdom near to the present Mirbat.<P>4. Migration of Tribes:<P>Many of the most illustrious tribes are descended from Kahtan, and some of them still survive. A constant stream of migration went on toward the north. Thus the tribe of Jurhum left the Yemen on account of drought and settled in the Hijaz and the Tihama, from which they drove out the Amalekites, and were in turn driven out by Koda\'a, another Kahtanite tribe. After that they disappear from history and are reckoned among the extinct tribes. Koda\'a was a descendant of Himyar. The Himyarites founded, about the 1st century BC, a kingdom which lasted for five centuries. The king bore the title of Tubba\', and the capital was successively Marib (Saba), Zafar and San\'a. One of their monarchs was the queen Bilkis whom the Arabian historians identify with the queen of Sheba who visited Solomon, though she must have lived much later. The story of the meeting is given in the Koran, chapter 38. A chief occasion on which many of the tribes left the district northeast of the Yemen was the bursting of the great dam, built by Lokman at Marib, about the 2nd century AD. A section of these grew into the Arabian kingdom of Ghassan, whose capital was Damascus and many of whose kings bore the name Al-Harith (Aretas, <a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>). This kingdom lasted till the time of Mohammad (7th century) and was in alliance with the Roman and Greek empires. On the opposite side of the Syrian desert the Lakhmid kingdom of Al-Hira on the Euphrates (also of Kahtanite origin) was allied to Persia. The two Arabian "buffer-states" were almost constantly at war with one another.<P>5. North Arabian Tribes:<P>Among the Arabs Ishmael holds the place occupied by Isaac in the Hebrew tradition. It was to the valley, afterward the site of the town of Mecca, that Abraham conducted Hagar and her son, and that Ishmael grew up and became the father of a great nation. The locality is full of spots connected by tradition with his life history, the ground where Hagar searched for water, the well Zemzem of which Gabriel showed her the place, the mount Thabir where Abraham would have sacrificed his son (Ishmael), and the graves of Hagar and Ishmael. The Jurhum, among whom Ishmael grew up, gave him seven goats: these were the capital with which he began life. He married a woman of Jurhum. He had twelve sons (<a onClick="return mV(\'Gen\',25,16);">Ge 25:16</a>) of whom Kaidar and Nabat are the best known, perhaps the Cedrei and Nabataei of Pliny; other sons were <a href="./study/isbe/search.html?string=DUMAH">Dumah</a> and <a href="./study/isbe/search.html?string=TEMA">Tema</a> (which see). The subsequent history of the Ishmaelites is lost for several generations until we come to \'Adnan, who is said to have been defeated by Nebuchadnezzar, when the latter invaded Arabia. All the Ishmaelite tribes are descended from \'Adnan. They are the north Arabian tribes, as opposed to the Kahtanite or south Arabian. One of them, Koreish, under their chief, Kosay, became master of Mecca, driving out Koda\'a. Later, as the tribe of the Prophet, they became the rulers of Arabia and the aristocracy of the Muslim empire; and the descendants of Mohammad remain to this day the only hierarchy known to Islam.<P>6. Other Tribes:<P>There are one or two other branches which are not included in the above classification: such are the Nabateans (see <a href="./study/isbe/search.html?string=NEBAIOTH">NEBAIOTH</a>), and the descendants of Esau and Keturah. The Nabateans are not generally reckoned among the Arabian tribes. They were an Aramean stock, the indigenous inhabitants of Mesopotamia, and spoke not Arabic but Aramaic. They founded a kingdom in Arabia of which the capital was Petra (see <a href="./study/isbe/search.html?string=SELA">SELA</a>). This was the most famous of their colonies, and it endured, at first in alliance with the Romans and later in subjection to them, for 500 years—from the 2nd century BC to the 3rd century AD. Petra was an important trading emporium, but, when the trade left the overland routes and was carried by way of the Red Sea, it quickly fell into poverty and oblivion. The descendants of Esau are named in <a onClick="return mV(\'Gen\',36,1);">Ge 36:1</a>f; they were allied to the Hittites and Ishmaelites. Among the tribes descended from Keturah are Jokshan and Midian, Sheba and Dedan (<a onClick="return mV(\'Gen\',25,2);">Ge 25:2</a>f).<P>7. Foreign Elements:<P>In Arabia there was and still, in spite of religious disabilities, is a large Jewish population. Before the age of Mohammad they lived chiefly in the northwest, the two best known tribes—An-Nadir and Koreiza—occupying Yathrib (Medina). After the rise of Islam they were expelled from Arabia; but at the present time there are probably some 60,000 Jews in the Yemen alone. There has always been a close connection between the south and west of Arabia and the opposite African coast. Especially in the 6th century there was a large influx of Abyssinians into the Yemen, as there still is into the western districts. A like intermixture of population went on between Zanzibar and Oman.<P>VI. Religion.<P>1. Monotheism:<P>The religion of the greater part of the Arabs before the time of Mohammad consisted of a vague deism combined with a primitive form of stone-worship. This is chiefly true of the Ishmaelite tribes descended from Modan, a great- grandson of \'Adnan, and among them it is especially true of Koreish. The origin of this stone worship may have been that as each family was forced to hive off from the main stock and quit the sacred territory around Mecca, it carried with it a stone as a monument of the homeland. This stone soon became a fetich. It was worshipped by stroking it with the hand. Before setting out on a journey a man would perform this religious duty, and also immediately on his return, before even visiting his wife and family. The best known idols of the pagan Arabs, from the mention of them in the Koran, are Al-Lat, Al-Ozza and Al-Manat (Kor 53 19.20), worshipped by the Thakif at Taif, by the two tribes of Medina, the Aus and the Khazraj, and by Koreish, in a shrine near Mecca, respectively. Koreish had also a great idol named Hubal in the "house of God" at Mecca, which contained other idols besides.<P>The deity in each case was probably at first a large boulder of stone, then a portable image was made, apparently in human form. They were regarded as feminine and called the daughters of God. Indeed, Al-Lat is apparently merely the feminine of Allah (God). The deities mentioned in the Koran (71 23), Yaghuth, Ya\'uk and Nesr, were worshipped in the Yemen. It is certain, however, that the idolatry of the Arabs of "the Ignorance" (Jahiliyah, "roughness," "ignorance"; compare <a onClick="return mV(\'Act\',17,30);">Ac 17:30</a>)—so native writers name the ages before Mohammad (Koran 3 148, etc.)—has been greatly exaggerated by Mohammadan historians. It is remarkable that the words denoting an idol, sanam and wethen, are not Arabic roots, and the practice of idolatry seems also to have been an importation from without. Even the idolatrous Arabs believed in a supreme deity, whose daughters the idol deities were, and with whom they had powers of intercession. They therefore were rather images of saints than of gods. As Renan has said, the desert is monotheistic; it is too empty to give birth to a pantheon, as the fruitful plains of India could do. At the present day the desert Arabs are more strictly monotheistic than the Muslims themselves. Their religion consists in nothing save a vague belief in God.<P>2. The Ka\'ba, Pilgrimages and Fairs:<P>Though there were many houses of God in the country, the chief religious resort even before the time of Mohammad was Mecca. The House of God (see <a href="./study/isbe/search.html?string=BETHEL">BETHEL</a>) here was called the Ka\'ba, which is the English word "cube," the building being so called from its shape. It was believed to have been built by Abraham and Ishmael. The honor of acting as guardians of the House was a subject of rivalry among the tribes. The office was held consecutively by the tribes of Jurhum, Koda\'a and Koreish, and last by the grandfather and uncles of Mohammad. These, therefore, correspond to the tribe of Levi in Israel. It is said to have contained a large number of images, but it is remarkable that the nearer our authorities get to the time of Mohammad the smaller is the number of images mentioned.<P>The chief of these, Hubal, is not named in the Koran. The worship took the form of circumambulation (tawaf), running or marching round the sanctuary (compare <a onClick="return mV(\'Psa\',26,6);">Ps 26:6</a>). An annual visitation was and still is made by those living at a distance, and sacrifices are offered. This is the hajj or pilgrimage; the same name is used for the corresponding rite among the Hebrews (<a onClick="return mV(\'Exd\',10,9);">Ex 10:9</a> and often). These religious assemblies were combined with fairs, at which markets were held and a considerable trade carried on. Before the time of Mohammad the great annual fair was held at Okaz, a place still pointed out about three days\' journey east of Mecca and one day west of Taif. Here were not only all kinds of commercial transactions carried on—auctions, sales, settling of accounts and payment of blood-wit, but an academy was held at which poets recited their odes, and received judgment upon their merits. These fairs were generally held in the sacred months, that is, the first, seventh, eleventh and twelfth months, in which fighting was forbidden. They had therefore a great civilizing and pacifying influence.<P>3. Judaism:<P>Before the time of Mohammad Judaism prevailed extensively in Arabia, especially in the Hijaz. It began no doubt with the migration of families due to disturbed political conditions at home. The conquest of Palestine by Nebuchadnezzar, by the Seleucids, by the Romans under Pompey, Vespasian and finally Hadrian, drove many Jews to seek peace and safety in the deserts out of which their forefathers had come. Thither Paul also withdrew after his conversion (<a onClick="return mV(\'Gal\',1,17);">Ga 1:17</a>). Two of these emigrant tribes, the Nadir and Koreiza, settled at Medina, first in independence, then as clients of the Aus and Khazraj. In the end they were harried and destroyed by Mohammad. The Jewish colony at Kheibar met the same fate. Several free Arab tribes also professed the Jewish faith, especially certain branches of Himyar and Kinda, both descendants of Kahtan, the former in southern, the latter in central Arabia. Judaism was introduced into the Yemen by one of the Tubbas, probably in the 3rd century AD, but it was not until the beginning of the 6th century that it made much headway. At that epoch the Tubba Dhu Nuwas became a fierce protagonist of this creed. He seems to have attacked the Aus and Khazraj to whom the Jews of Yathrib (Medina) were subject. He instituted against the Christians of Nejran, a territory lying to the northeast of the Yemen, a persecution which brought upon him the vengeance of the Byzantine emperor and of the Negus of Abyssinia and involved his kingdom and dynasty in ruin.<P>4. Christianity:<P>Judaism did not hold such a large place in Arabia as did Christianity. The apostle Bartholomew is said to have carried the gospel thither. One of the Jurhum kings who may have lived about the beginning of the 2nd century AD is named Abd el-Masih ("Christ\'s slave"). There is said to have been a representation of the Virgin Mary and her Son in the Ka\'ba. The Christian emperor Constans (337-50) sent the Bishop Theophilus into south Arabia in order to obtain toleration for the Christians. The mission was successful. Churches were built at Zafar, at Aden, and on the shore of the Persian Gulf. The emperor\'s real object was doubtless political—to counteract the influence of Persia in these regions. Most of the Yemenite tribes were at this time pagan: they worshipped the idols mentioned above (Koran 71 23). Some time after we find the Abyssinian sovereign describing himself in the inscriptions at Axum as king of the Himyarites. This supremacy would be favorable to the spread of Christianity. One of the chief seats, however, of the Christian religion, was at the above-mentioned Nejran, the territory of the tribe Harith ibn Ka\'b, whom ecclesiastical writers seem to denote by Arethas son of Caleb.<P>It was this tribe that Dhu Nuwas, Tubba of the Yemen, on his conversion to Judaism, attacked. He threw all the Christians who held by their faith into a trench of fire in which they were burned (Koran 85 4). News of this atrocity was either carried by those who escaped or sent by the Lakhmid, king of Al-Hira, to the emperor Justin I, who, in turn, either directly or through the patriarch of Alexandria, invoked the cooperation of the Axumite king. The result was that the Abyssinians invaded the Yemen and overthrew the Himyarite dynasty. Christianity then became the prevailing religion of South Arabia. The Abyssinians were in their turn, however, expelled by the Persians, under whom all religions—Christianity, Judaism and paganism—were tolerated, until they all disappeared before Islam. Several of the Lakhmid kings of Al-Hira, although they were from circumstances under the influence of the Persian Zoroastrianism, professed Christianity. Nu\'man I who reigned at the end of the 4th and beginning of the 5th century, perhaps under the influence of Simon Stylites, retired from the world and became an ascetic. Mundhir II, in the middle of the 6th century, seems to have come temporarily under the influence of the Eutychian heresy. Nu\'man V, one of his successors, was also converted to Christianity. But the kingdom in which Christianity flourished most was naturally that in closest contact with the Byzantine empire—the kingdom of the Ghassanids, although it seems not to have been until after the conversion of Constantine that this was the case. From his reign date the monasteries of which the ruins are still visible in the Ghassanid country. The powerful Ishmaelite tribe of Taghlib, whose settlements were in Mesopotamia was also converted to Christianity through similar influences, but not until the end of the 6th century. Some members of the Kahtanite Koda\'a professed the same religion, as did the Kelb in the Jauf.<P>5. Sabianism:<P>In the Koran a third creed is bracketed with those of the Jews and Christians as entitled to toleration—that of the Sabians. These are monotheists who also worshipped the stars or the angels. The name Sabian has no connection with Sabean which is derived from the name of the town of Saba. An account of their religion, taken from Abu\'l Faraj (Bar Hebraeus), the Jacobite bishop, who wrote about the middle of the 13th century, will be found in Sale\'s Koran, Preliminary Discourse, section I. Sale, however, identified Sabianism with the primitive religion of the Arabs, which Mohammad sought to supplant. This is impossible, however, in view of the fact that Mohammad tolerated the one and proscribed the other. Since the publication of Chwolson\'s Ssabier und Ssabismus it has been recognized that under the term Sabians are included two very different groups of people. In the first place the devotees of the old Semitic idolatry which flourished at Harran assumed the name Sabian to enable them to claim the protection afforded by the Koran. It is the tenets of these Harranians of which Chwolson\'s work contains an exposition. The true Sabians, however, were a survival of primitive Christian Gnosticism; whence they were also called Mandeans. From their frequent ablutions they received their name derived from the Aramaic tsebha\', to "baptize," the \'ayin being softened to \'aleph, and connected with John the Baptist. The Jews, Christians and Sabians are called in the Koran "the people of the book," that is, those to whom a revelation had been vouchsafed, and who were in consequence of this tolerated. In one passage of the Koran (22 17) a fourth religion is added to these—the Magian, or Zoroastrian, introduced from Persia.<P>6. Seekers after Truth: Islam:<P>Shortly before the appearance of Mohammad a number of thinking persons had become dissatisfied with the old Arabian religion of their ancestors, and yet had not joined the Christian or Jewish faith. They gave up the worship of idols, studied the various sacred books, and sought to find out the true way. They are considered in the Koran as having been of the true faith even before Mohammad had appeared. About a dozen are mentioned by the historians, of whom the most important are four—Waraka the cousin of Mohammad\'s wife Khadija; Othman who became a Christian; Obeidallah who became a Christian and then a Muslim; Zeid who traveled in pursuit of Truth, but did not at tach himself to any one faith. The Hebrew prophets and those who accepted their doctrines are regarded as belonging to the same class. A person who is a monotheist, and who yet does not attach himself to any particular creed is called in the Koran a Hanif. This pure religion is called the religion of Abraham. Mohammad claimed to restore this primeval religion in Islam. By John of Damascus Mohammad was regarded as the founder of a Christian sect. It is probable that but for his appearance Christianity would have spread over the whole of Arabia.<P>LITERATURE.<P>Causinn de Perceval, Essai sur l\'histoire des Arabes; Sprenger, Die alte Geographie Arabiens; Hamdani, ed., Muller, Geographic der arabischen Halbinsel; Niebuhr, Travels through Arabia; Burckhardt, Travels in Arabia; Wellsted, Travels in Arabia; Burton, Personal Narrative of a Pilgrimage to El-Medinah and Meccah; Palgrave, Journey through Central and Eastern Arabia; Blunt, A Pilgrimage to Nejd; Hurgronje, Mecca; Doughty, Travels in Arabia Deserta; Harris, A Journey through the Yemen; Brunnow and Domazewski, Die Provincia Arabia; Musil, Arabia Deserta; Glaser, Skizze der Geschichte und Geographic Arabiens.``189';

isbe[665]='Arabic Language`ar\'-a-bik lan\'-gwaj: For the student of the Bible the Arabic language is of interest, first, as one of the members of the Semitic group of languages, to which belong the Hebrew and Aramaic tongues of the Bible; secondly, as one of the languages into which the Bible and other church literature were early translated and in which a Christian literature was produced; and thirdly, as the vernacular of Mohammed and his followers, the classical tongue of that religious system which is the offspring of a degenerate Judaism and Christianity.<P>1. Philological Characterization:<P>Scholars are generally agreed in grouping the Arabic and Ethiopic together as a South-Semetic branch of the Semitic stock. For the geographical and ethnological background of the Arabic language, see <a href="./study/isbe/search.html?string=ARABIA">ARABIA</a>. A general characteristic of this tongue of the desert is its remarkable retention into a late historical period, of grammatical features obliterated or in process of obliteration in the other Semitic tongues at their earliest emergence in literature; so that in the period since the golden age of its literature, the Arabic has been undergoing changes in some respects analogous to those which its sister-dialects underwent in their pre-literary or earliest literary stage. Thus, for example, the case-endings of nouns, lost in Aramaic and Canaanitish (including Hebrew), all but lost in the Abyssinian dialects, beginning to be disregarded in even the early (popular) Babylonian, lost also in the dialects of modern Arabic are in full vitality throughout the classical period of Arabic literature.<P>The Arabic language itself, ancient and modern, divides into a vast number of dialects, many of which have attained the distinction of producing a literature greater or less. But the dialect of the tribe of Koreish, to which Mohammed belonged, is the one that, naturally, by the circumstance of the Koran\'s composition and diffusion, has become the norm of pure Arabic. Old Arabic poems, some of them produced in "the Ignorance," that is, before the days of Mohammed, are in substantially the same dialect as that of the Koran, for it appears that Bedouin tribes ranging within the limits of the Arabian desert spoke an Arabic little differentiated by tribal or geographical peculiarities. On the other hand the inhabitants of the coast of the Indian Ocean from Yemen to Oman, and of the island of Socotra off that coast, spoke an Arabic differing widely from that of the northern tribes. The various dialects of this "South-Arabic," known partly through their daughter-dialects of today (Mehri, Socotri, etc.), partly from the numerous and important inscriptions ("Minaean" and "Sabaean") found in Yemen by recent travelers, notably Halevy and Glaser, show a closer affinity than do the "North-Arabic" with the Abyssinian dialects (Ge\'ez, i.e. "Ethiopic," Tigre, Tigrina, Amharic, etc.), as might indeed be expected from the admitted South Arabian origin of the Habesh-tribes or Abyssinians.<P>For the interpretation of the Old Testament the Arabic language has been of service in a variety of ways. In the department of lexicography it has thrown light not only on many a word used but once in the Bible or too seldom for usage alone to determine its meaning, but also on words which had seemed clear enough in their Biblical setting, but which have received illustration or correction from their usage in the immense bulk and range of Arabic literature with its enormous vocabulary. For the modern scientific study of Hebrew grammar, with its genetic method, Arabic has been of the greatest value, through the comparison of its cognate forms, where, in the main, the Arabic has the simpler, fuller and more regular morphology, and through the comparison of similar constructions, for which the highly developed Arabic syntax furnishes useful rubrics.<P>In addition to this the Arabic language plays a prominent part, perhaps the foremost part, in the determination of those laws of the mutation of sounds, which once governed the development and now reveal the mutual relationships of the various Semitic languages.<P>The script which we know as Arabic script, with its numerous varieties, developed out of the vulgar Aramaic alphabet in North Arabia; diacritical points were added to many of those letters, either to distinguish Arabic sounds for which no letter existed, or to differentiate letters the forms of which had become so similar as to create confusion. In Yemen another script arose early, that of the inscriptions above mentioned, admirably clear and adapted to express probably all the chief varieties of consonantal sounds in actual use, though quite without vowels.<P>2. Christian Arabic Literature:<P>For Arabic versions of the Bible, see <a href="./study/isbe/search.html?string=ARABIC+VERSIONS">ARABIC VERSIONS</a>. Outside of the Scriptures themselves there was most felt by Christian communities living in the Arabic-speaking world (primarily, though not exclusively, in Egypt and Syria) the need of a Christian literature suited to the tastes of the time and region. Apocryphal and legendary material makes up a large part, therefore, of the list of Christian Arabic literature. See <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</A>. But this material was not original. With the small degree of intellectual activity in those circles it is not surprising that most of such material, and indeed of the entire literary output, consists of translations from Syriac, Greek or Coptic, and that original productions are few in number.<P>Of these last the most noteworthy are the following: theological and apologetic tracts by Theodore, bishop of Haran, the same who held the famous disputation with Mohammedan scholars at the court of Caliph Al-Mamun early in the 9th century; apologetic and polemic writings of Yahya ibn Adi of Tekrit, and of his pupil Abu All Isa ibn Ishaq, both in the 10th century; the Arabic works of Bar Hebraeus, better known for his numerous Syriac compositions, but productive also of both historical and theological works in Arabic (13th century); in Egypt, but belonging to the same Jacobite or Monophysite communion as the above, the polemic and homiletic productions of Bishop Severus of Eshmunain (10th century), and, a generation earlier than Severus and belonging to the opposing or Melkite Egyptian church, the chronicle of Eutychius, patriarch of Alexandria, continued a century later by Yahya ibn Said of Antioch; large compilations of church history, church law and theological miscellany by the Coptic Christians Al-Makin, Abu Ishaq ibn Al-Assal, Abu\'l-Barakat and others, the leaders in a general revival of Egyptian Christianity in the 13th century; on the soil of Nestorianism, finally, the ecclesiastical, dogmatic and exegetical writings of Abulfaraj Abdallah ibn At-Tayyib, (11 century), the apologetic compositions of his contemporary, Elias ben Shinaya, the historian, and the Nestorian church chronicle begun in the 12th century by Mari ibn Suleiman and continued two centuries later by Amr ibn Mattai and Saliba bar Johannan. After this date there is no original literature produced by Arabic-speaking Christians until the modern intellectual revival brought about by contact with European Christianity.<P>3. The Literary Vehicle of Islam:<P>What Aramaic, Greek and Latin have been successively in the history of Christianity, all this, and more, Arabic has been in the history of Islam. The language of its founder and his "helpers," the language of the Koran "sent down" from God to Mohammed by the angel Gabriel, the language therefore in which it has always been preserved by the faithful, untranslated, whithersoever it has spread in the wide world of Islam, Arabic is identified with Islam in its origin, its history, its literature and its propaganda. All the points of contact between the religion of the Bible and the religion of the Koran, literary, historical, apologetic and missionary, are alike in this, that they demand of the intelligent student of Christianity a sympathetic acquaintance with the genius and the masterpieces of the great Arabic tongue.``15';
isbe[666]='Arabic Versions`ar\'-a-bik vur\'-shuns: Arabic translations of the Bible must have been made at a very early date, for Christianity and Judaism had penetrated far into Arabia by the 6th century of our era, but the oldest of which a copy has come down to our time is that of Sasdish the Gaon (942 AD). This version was made directly from the Massoretic Text and is said to have covered the whole of the Old Testament, but much of it is no longer extant. It is characterized by an avoidance of anthropomorphisms (e.g. <a onClick="return mV(\'Gen\',6,2);">Ge 6:2</a>, "sons of nobles" and "daughters of common people") and by giving modern equivalents, e.g. Turks, Franks, Chinese, for the Hebrew names. Saadiah\'s Pentateuch was first printed at Constantinople in 1546 and was incorporated into the Paris (1629-45) and London (1657) Polyglots.<P>When, after the rise of Islam, Arabic became the common language of Syria, Egypt and North Africa, translations were made from the Septuagint, from the Peshitta and from Coptic. In the Polyglots the translation of Joshua is, like the Pentateuch, made from the Massoretic Text, as also portions of Kings and Nehemiah, with interpolations from the Peshitta. Judges, Ruth, 1 and 2 Samuel, 1 and 2 Kings (in parts), 1 and 2 Chronicles (?), Nehemiah (in parts) and Job have been translated into Arabic from Syriac. The remaining books (Prophets, Psalms, Proverbs, etc.) are from the Septuagint, and that according to Codex Alexandrinus. In the New Testament the Gospels have been translated from the Vulgate, and the remaining books, although from the Greek, are late. A revised edition of the versions in Walton\'s Polyglot was published by J. D. Carlyle, professor of Arabic in Cambridge, and printed at Newcastle by Sarah Hodgson in 1811. A very fine translation of the entire Bible in classical Arabic has been issued by the Jesuit Fathers in Beirut, and a simpler version in Arabic which can be understood by the common people, educated and uneducated alike, was made by the late Dr. Cornelius Van Dyck of the Syrian Protestant College and published by the American Press in Beirut. Dr. Van Dyck had the benefit of the help and advice of the Sheikh Nacif al-Yaziji.<P>A large number of manuscripts of the Bible in Arabic, in whole or in part, are to be found in the British Museum, the Bibliotheque Nationale and the great libraries of the Continent, but none of them are of sufficient age to make them of value for the criticism of the text.``189';
