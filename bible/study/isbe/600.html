isbe[668]='Arad`a\'-rad (\'aradh; Arad):<P>(1) A city mentioned four times in the Old Testament. In the King James Version it is twice mistakenly rendered as the name of a king (<a onClick="return mV(\'Num\',21,1);">Nu 21:1</a>; <a onClick="return mV(\'Num\',33,40);">33:40</a>). Three times it is spoken of as in the South Country, one mention using the phrase \'the wilderness of Judah which is in the South Country of Arad\' (<a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>), that is, the part of the wilderness of Judah which is in the South Country near Arad. It was situated near the frontier of Judah and Simeon, being grouped with Debir, Hormah, Makkedah, etc. (<a onClick="return mV(\'Jos\',12,14);">Jos 12:14</a>). Arad and other cities joined in attacking Israel in the fortieth year of the sojourn in the wilderness (<a onClick="return mV(\'Num\',21,\'1-3\');">Nu 21:1-3</a>), and Israel vowed to "make their cities a devoted thing." In the case of Zephath, one of the cities, this vow was fulfilled after the death of Joshua (<a onClick="return mV(\'Jdg\',1,17);">Jud 1:17</a>). The Kenite relatives of Moses had their inheritance near Arad (<a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>). In the form a-ru-da the city is mentioned by Shishak of Egypt as among the places which he conquered in Palestine. The identification of the site with Tel Arad, about 17 miles south of Hebron, seems to be generally accepted.<P>(2) One of the descendants of Elpaal the son of Shaharaim, mentioned among the descendants of Benjamin (<a onClick="return mV(\'1Ch\',8,15);">1Ch 8:15</a>).``11';
isbe[669]='Aradus`ar\'-a-dus (Arados, 1Macc 15:23): Greek name of the Old Testament <a href="./study/isbe/search.html?string=ARVAD">ARVAD</a> (which see), a city on the coast of Phoenicia.``1';
isbe[670]='Arah`a\'-ra (\'arach, "traveler"?):<P>(1) The son of Ulla, an Asherite (<a onClick="return mV(\'1Ch\',7,39);">1Ch 7:39</a>).<P>(2) The head of a family that returned from the exile with Zerubbabel (<a onClick="return mV(\'Ezr\',2,5);">Ezr 2:5</a>; <a onClick="return mV(\'Neh\',7,10);">Ne 7:10</a>). He is sometimes identified with Arah of <a onClick="return mV(\'Neh\',6,18);">Ne 6:18</a> whose grand-daughter became the wife of Tobiah, the Ammonite who tried to thwart Nehemiah in rebuilding Jerusalem.``1';
isbe[671]='Aram`a\'-ram (\'aram):<P>(1) A son of Shem (<a onClick="return mV(\'Gen\',10,22);">Ge 10:22</a>; <a onClick="return mV(\'1Ch\',1,17);">1Ch 1:17</a>). See <a href="./study/isbe/search.html?string=ARAMEANS">ARAMEANS</a>; <a href="./study/isbe/search.html?string=SYRIA">SYRIA</a>.<P>(2) A grandson of Nahor (<a onClick="return mV(\'Gen\',22,21);">Ge 22:21</a>).<P>(3) A descendant of Asher (<a onClick="return mV(\'1Ch\',7,34);">1Ch 7:34</a>).<P>(4) Aram, King James Version: Greek form of Ram (thus the Revised Version (British and American) <a onClick="return mV(\'Mat\',13,4);">Mt 13:4</a>; Arni <a onClick="return mV(\'Luk\',3,33);">Lu 3:33</a>), grandson of Perez.``1';

isbe[679]='Aramaic; Aramaic Language`ar-a-ma\'-ik lan\'-gwaj (\'aramith; the King James Version Syrian, Syriac; <a href="./study/isbe/search.html?string=SYRIAN">SYRIAN</a> in the Revised Version (British and American)):<P>1. Early Notices of Aramaic in Scripture<P>2. Extra-Biblical Evidences of Aramaic<P>3. The Script of Aramaic Inscriptions<P>4. Dialects of Aramaic<P>5. Grammatical Peculiarities<P>6. Comparison of Aramaic of Sinjirli with That of Bible<P>7. Comparison of Aramaic of Assouan with That of Daniel<P>8. Elephantine Papyri<P>9. Comparison with Aramaic of the Targums<P>10. Chief Differences in Latter<P>LITERATURE<hr /><P>The name is given to a form of Semitic speech, most nearly related to Hebrew and Phoenician, but exhibiting marked peculiarities, and subsisting in different dialects. Its original home may have been in Mesopotamia (Aram), but it spread north and west, and, as below shown, became the principal tongue throughout extensive regions. After the return from the Captivity, it displaced Hebrew as the spoken language of the Jews in Palestine. In its eastern form it is known as Syriac. In its occurrence in the Old Testament, it formerly, though incorrectly, generally bore the name Chaldee. The present article deals with it chiefly in its. Old Testament relations.<P>1. Early Notices of Aramaic in Scripture:<P>If we neglect two words which occur in <a onClick="return mV(\'Gen\',31,47);">Ge 31:47</a>, the earliest notice of the use of this language in Scripture is in the request which the representatives of Hezekiah make to Rabshakeh: "Speak, I pray thee, to thy servants in the Syriac language" (\'aramith, <a onClick="return mV(\'2Ki\',18,26);">2Ki 18:26</a>; <a onClick="return mV(\'Isa\',36,11);">Isa 36:11</a>). The narrative from which we have made this excerpt, even if it stood alone, would prove that Aramaic, "the Syriac language," was so different from Hebrew, "the Jews\' language," that it was not understood by the inhabitants of Jerusalem. Further, it shows that Aramaic was the ordinary language of Assyrian diplomacy. We next meet with Aramaic in <a onClick="return mV(\'Jer\',10,11);">Jer 10:11</a> which appears to be an answer put into the mouths of the Jews as a reply to any attempt to seduce them to the worship of idols. If we assume the traditional date of Daniel to be correct, the six chapters in that book (<a onClick="return mV(\'Dan\',2,4);">Da 2:4-7:28</a>), forming the greater part of the whole, are the next and most important occurrence of Aramaic in Scripture. There are, further, passages in <a onClick="return mV(\'Ezr\',4,8);">Ezr 4:8-6:18</a>; <a onClick="return mV(\'Ezr\',7,\'12-26\');">7:12-26</a>, amounting approximately to three chapters, in which Aramaic is used. In the New Testament several Aramaic words and phrases occur, modified by having passed through Greek<P>2. Extra-Biblical Evidences of Aramaic:<P>Formerly our knowledge of Aramaic earlier than the Targums and the Peshitta was restricted to the above-noticed passages of Scripture. Now, however, discoveries, still comparatively recent, have put us in a different position. In the closing decade of last century extensive inscriptions were discovered in Sibbaldia, in the neighborhood of Aleppo, dated in the reigns of Tiglathpileser and the Sargonid monarchs, and one that seems earlier. More recent has been the discovery of the Assouan papyri; these bear dates which synchronize with Ezra and Nehemiah. Earlier than these in discovery, but between them in date of origin, are weights of the reign of Sargon, with two inscriptions, one, official, in cuneiform, which not only gives the designation of the weight, but relates the name and titles of the king; the other, popular, in Aramaic, which only tells the weight. More striking is the fact that frequently, in regard to contract tablets, while the binding document is in cuneiform character and the Assyrian language, the inscription on the clay envelope which served as a docquet is in Aramaic, language and letter. This affords proof that at all events before the reign of Tiglath-pileser Aramaic was the general speech for commerce and diplomacy all over southwest Asia.<P>3. The Script of Aramaic Inscriptions:<P>When we come in contact with it, Aramaic is a fully formed alphabetical language, and has attained a further stage of development than the Assyrian with its cumbrous cuneiform. To the end, Assyrian was largely ideographic and hieroglyphic. The same group of symbols represented very different sounds according to circumstances, and widely differing meanings were connected with the same sound, with the consequent necessity for determinatives. The alphabet employed in Aramaic is practically that found on the Moabite Stone. It evidently stands at the end of a long process of evolution. It is probable that a hieroglyphic stood behind it; whether it is derived from the Hittite (Conder), or from Egyptian (Rouge), or Assyrian (Delitzsch), or is of independent origin (Gesenius), cannot be determined. Aramaic is, like Hebrew and Assyrian, a North Semitic tongue, standing in a manner between them. It is more regular in its formation than either of the others, a character that may to some extent be due to its use as a lingua franca over so wide a territory. Aramaic was the official language of the extensive Persian empire, as it had been to some extent that of its predecessor, the empire of Assyria. It may be regarded as having been generally understood from Asia Minor on the north, to the Cataracts of the Nile on the south, and from the mountains of Media on the east, to the Mediterranean on the west. Its history has been long; spoken, as we learn by inscriptions, from before the days of Tiglath-pileser, it is still spoken on the banks of the Tigris and the Euphrates.<P>4. Dialects of Aramaic:<P>These extensive limits, geographical and chronological, imply dialectic differences. Means of communication were so ineffective that the distance between the eastern and western limits would require greater time to traverse, than does that which separates America from Europe, or New York from Brazil. The primary dialectic distinction was between eastern Aramaic (Syriac) and western (formerly called Chaldee). The peculiarity which most prominently distinguishes these is the preformative of the imperfect; in the western, as in Hebrew and Arabic, it is yodh (y), while in the eastern it is nun (n) or lamedh (l). Each of these has sub-dialects. In Palestine, besides the Chaldee of the Jewish Targums, there was the Samaritan Pentateuch; in it, besides many foreign elements in the vocabulary, the use of \'ayin instead of waw in the preterite of \'ayin-waw verbs is the most striking feature. The sub-dialect of eastern Aramaic is Mandean; it is characterized by the use of the matres lectionis instead of vowel signs. From the inscriptions and the papyri it would seem to follow that the eastern peculiarities are the more recent—changes introduced through passage of time. In eastern Aramaic the script became more cursive than in western, which retained the square character we associate with Hebrew: except the Samaritan, which used a still earlier script, less removed from the angular style of the inscriptions. The script of the Assouan papyri indicated a tendency toward the later square character.<P>5. Grammatical Peculiarities:<P>Although an article like the present is not the place to give a full grammar of Aramaic, yet we may advert to some of the more prominent peculiarities, common to all branches of the language, which distinguish it from Hebrew, the best-known of north Semitic tongues. The peculiarity that most strikes the beginner in Aramaic is the want of the article, and the presence instead of the status emphaticus, which follows the syntactic rules of the Hebrew article. The next thing likely to attract attention is the use of the relative pronoun zi or di as if it were a preposition meaning "of." While in Hebrew the passive voice is generally indicated in the derived conjugations by internal vocalic changes, as the pu\'al from the pi\'el; in Aramaic the syllable \'eth (E) or \'ith (W) is prefixed (earlier hith). Instead of the Hebrew causative hiph\'il there is the \'aph\'el earlier haph\'el with its passive \'ethtaph\'al or \'ittaph\'al (earlier hoph\'al). The causative had also shaph\'el and taph\'el forms, which occasionally are found. While in the Targums and the Old Testament Peshitta the syllable yath is the sign of the accusative (earlier vath, as in the Sinjirli inscriptions), the letter lamedh serves that purpose in Aramaic which is not a translation from Hebrew. A characteristic of later Aramaic prominent in the Peshitta of the New Testament is the facility with which it adopted words and phrases from Greek which had already largely displaced it as the common language. New Syriac shows a similar facility in regard to Arabic and Persian.<P>6. Comparison of the Aramaic of Sinjirli with That of the Bible:<P>A question of very considerable importance to the Biblical student is the relation in which the Aramaic of Daniel and Ezra stands to that of the Sinjirli inscriptions and that of the more nearly contemporary Assouan papyri. In making the comparison we must bear in mind that the Hebrew Massoretic Text is the result of transcriptions extending the Bible over 1,500 or 1,200 years, according as we take the traditional or the critical dates for the books in question. This implies probably a score or more of transcriptions each with its quota of variations from the original. While the variations introduced by any one transcription might be few and unimportant, they would all be in the direction of lateness, and cumulatively might easily become very great. The late Hebrew of Ecclesiastes, notwithstanding its ascription to Solomon, shows how little the idea of the chronology of style entered into the thoughts of the scribes of those days, to check this tendency to modernization. It follows that while the presence of late peculiarities proves nothing but the inaccuracy of the copyist, early grammatical forms and modes of spelling are nearly indisputable evidences of antiquity.<P>The Sinjirli inscriptions, if we neglect the less important, are three, the Panammu inscription, the Hadad inscription and the Barrekab inscription (Bauenschrift, Sachau). The first and last of these are dated in the reign of Tiglath- pileser, the middle one is placed by Sachau in the preceding century. It ought to be noted that, when first discovered, it was a matter of doubt whether the inscriptions should not be reckoned as Hebrew, rather than Aramaic The close affinity between them and Hebrew is shown in various ways. By a relation among the north Semitic tongues similar to that among the Aryan languages expressed by Grimm\'s law, where letters with the s- sound appear in Hebrew, in later Aramaic we find corresponding letters with the t-sound. But in the Sinjirli inscriptions we do not find this mark of the later language; thus we have sheqel, not theqel, shelathin instead of telathin, zehabh for dhehabh, etc. That this is not due to the proximity of Hebrew is proved by the fact that on the weights in Sargon\'s palace we find sheqel. Thus, the Sinjirli inscriptions date from a period when Hebrew and Aramaic had not been completely differentiated. There are other points of likeness. Instead of the \'aph\'el and \'ethtaph\'al or \'ittaph\'al of later Aramaic, there is haph\'el and hoph\'al; instead of the \'eth or \'ith as the sign of the passive, there is hith. The vocabularies also are nearly identical. In both, the syllable yath or wath, sign of the accusative, is present, as if a survival, only as the support of the oblique case of a pronoun (<a onClick="return mV(\'Dan\',3,12);">Da 3:12</a>; Sinjirli, Had 28). The pronouns exhibit a similar resemblance to Hebrew and also to Biblical Aramaic. The 1st person pronoun is \'anokh (once \'anokhi in Pan. 1.19), as in the Phoenician and Moabite dialects of Hebrew; \'anah occurs occasionally as in Daniel. The most marked differences from later Aramaic is "z" instead of "dh" in the demonstrative pronoun; here there is relation to the Hebrew zeh. Another case in frequent evidence is \'arqa\' instead of \'ar\'a.<P>7. Comparison of Aramaic of Assouan with That of Daniel:<P>More nearly contemporary with the Aramaic of Daniel and Ezra is that of the Assouan papyri. These are carefully dated, and extend from 471 BC to 411 BC; these two dates include the whole reign of Artaxerxes I, the king whose cupbearer Nehemiah was, and who sent him as governor to Jerusalem, and a few years of his predecessor\'s and successor\'s reigns. These documents, as written with a reed pen on papyrus, and not cut with a chisel on stone, manifest a very different style of letter; as already said, there is some approximation to the later square character. The resemblance between the grammar and vocabulary of these papyri and those of Biblical Aramaic is closer than that of the latter to the Sinjirli grammar and diction. Where, in the more ancient Aramaic, we have "z," in these papyri we occasionally find the later "dh." It is not improbable that, as in Spain, a lisping pronunciation became prevalent; the "dh" pronounced as "th" in "then" would in that case represent more accurately the sound actually uttered than would "z."<P>The word already noticed, \'arqa\' which generally appears in Biblical Aramaic as \'ar\'a, is a similar case. In Northern Palestine the Arabic qaf is pronounced much as if it were \'ain, if not even the related sound hemzeh; instances of this spelling also are found in the Assouan papyri. Both of these differences are due to frequent transcription assimilating the spelling to the pronunciation. Another peculiarity is probably due to a different cause. In Biblical Aramaic the preformative of the 3rd person singular and plural of the imperfect of the substantive verb is lamedh. Of this peculiarity Dr. Bevan gives an ingenious explanation. If the yodh preformative were used, the resulting word would have a resemblance to the sacred name: to avoid this, he thinks, the yodh was changed into a lamedh.<P>Unfortunately this explains too much, therefore explains nothing. Had this been the explanation, the name "Jehu," which consonantally is nearly the same as the 3rd person singular and plural of the substantive verb, would never have been written as it is. Further, if Jewish reverence for the Divine name expressed itself in this way, we should expect to find this preformative in the Targums, which, however, we do not. Hundreds of cases in proof may be found in Onkelos alone. The truth is, it is a Mandean form, which proves that the Aramaic of Daniel and Ezra is eastern. A further peculiarity is the nun compensative; as tinda\' (<a onClick="return mV(\'Dan\',4,23);">Da 4:23</a>), which regularly would be tidda\'. This also is found in the Mandean; it is, however, also found in papyri of Assouan, an evidence that the Mandean characteristic was a survival from an earlier time.<P>8. Elephantine Papyri:<P>Another interesting point of contact between the Aramaic of this period and that of Daniel is exhibited in the Elephantine papyri published by Sachau. These papyri, discovered in the island of Elephantine (opposite Assouan) in 1907, are three in number, and are dated in the 14th year of Darius II (407 BC). In the first, ll. 2, 27, 28, the second, l. 26, and the third ll. 3, 4, we have God called "the God of heaven," the title given to God throughout <a onClick="return mV(\'Dan\',2,1);">Da 2</a>. This is also the appellation used in the Aramaic of Ezra (<a onClick="return mV(\'Ezr\',5,11,12);">5:11-12</a>; <a onClick="return mV(\'Ezr\',6,9);">6:9</a> etc.) From the passages where it occurs it would seem that during the Babylonian and Persian rule this was the recognized governmental title of the God of the Hebrews.<P>9. Comparison with Aramaic of the Targums:<P>As it is frequently asserted that the Aramaic of Daniel and Ezra is that of the Targums, it is necessary to examine the truth of this statement. In considering this question son with we must have regard to the history of these paraphrases, as only in this way can we estimate truly the chronological value of this "great" resemblance, should it be found to exist. According to Talmudic tradition the Targums were delivered orally, and were not committed to writing till late in the 2nd century of our era. A traditional rendering was handed on from meturgeman (interpreter) to meturgeman. In such circumstances archaic forms, words and idioms, are perpetuated. The sacred always tends to preserve the antique; in illustration we need only refer to the song of the Fratres Arvales, a college of priests dating from primitive Latin times and continuing to the days of the Gordians. This sacred song of theirs preserves to us the most ancient form of the Latin tongue, though the inscriptions, from which we learn of it, date from the classic period. Hence the Aramaic of the Targums may represent the form of the language a couple of centuries before the Christian era.<P>10. Chief Differences in Latter:<P>We cannot attempt to give an exhaustive summary of the differences between Biblical and Targumic Aramaic, but indicate only some of the more obvious. Account need not be taken of yath, the sign of the accusative, as it appears only as representing the Hebrew \'eth. In verbs, reference has already been made to the "L" preformative in the substantive verb, a peculiarity which Biblical Aramaic shares with Mandean in distinction from other forms of the language: also to the fact that the hith of the earlier verbal forms is replaced by \'ith in the more recent \'ithpe\'el and \'ithpa\'al. This also is the case with \'aph\'el (in earlier and Biblical Aramaic haph\'el), the passive of which is hoph\'al, not \'ittaph\'al, as in Targumic. The importance of verbal forms in determining age is readily recognized; thus in English, if the 3rd person singular of the verbs in an English writing is in eth we decide that writing to belong, in fact or feigning, to a period not later than the 17th century. In regard to pronouns, while in Biblical Aramaic, as in Sinjirli and Assouan, the 1st person singular is \'an\'a, in Targumic it is \'anah: the plural in Biblical Aramaic is \'anachna\' akin to \'anachnah in Assouan, whereas in the Targums it is usually \'anan, though sometimes the Biblical form appears. The 2nd person singular in Biblical Aramaic is \'ant as in Assouan, with the plural \'antum (Assouan, \'antem): in Targumic it is \'att and \'attun.<P>To compare our own language, when we find "thou" and "ye" in a writing, we date it as not later than the 17th century. The ordinary vocabulary, though not without value in this respect, is not very important chronologically. Connective particles, however, are. Everyone acquainted with Hebrew knows how frequently yesh, "is" occurs; as frequent is \'ith in Targumic. In the Bible, the papyri, the form found is \'ithi. In the Targums \'i stands for "if"; in the Bible and papyri it is hen. Cognate with this, the Bible and the papyri have lahen, "therefore": this is not found in the Targums, which have instead \'al-ken. In our own language the presence of "eke" in serious prose or poetry as a conjunction would prove the antiquity of the composition. The fact that the distinction between "c" and "s" has disappeared in the Targums, but is still preserved in the Bible, is a note of age that cannot be passed over. Other examples might be given, but these will suffice. Professor Bevan lightly dismisses many of these differences as mere matters of orthography; yet in French the presence of "l" for "u" or as strengthening the "u" in such words as alx, eulx, aultres is regarded as a note of old as distinct from modern French; yet probably the pronunciation was not different.<P>In pursuing this part of the subject the latter portion of Pusey\'s first Lecture (Daniel the Prophet) is worthy of study. Pusey had not the advantage of contemporary documents with which to compare Biblical Aramaic; he could only emphasize the nature and amount of the differences which separated the language of Daniel from that of the Targums. The argument can now be supplemented by a yet stronger argument from the resemblance between the former and the contemporary papyri of Assouan, and yet the earlier Sinjirli inscriptions. See further, <a href="./study/isbe/search.html?string=SYRIAC+VERSIONS">SYRIAC VERSIONS</a>; <a href="./study/isbe/search.html?string=LANGUAGES+ OF+THE+OLD+TESTAMENT">LANGUAGES OF THE OLD TESTAMENT</a>; and compare the article "Aramaic" in Encyclopedia Biblica.<P>LITERATURE.<P>Numerous grammars and dictionaries of the two principal dialects of Aramaic, eastern (Syr) and western (Chaldee) may be seen in any catalogues. There is an excellent compendium of the grammar of Biblical Aramaic in Delitzsch\'s introduction to Baer\'s Text of Daniel and Ezra. For the Samaritan there is a small grammar by Nicholls, also one in the series "Porta Linguarum Orientalium." Noldeke has published grammars for Mandean and New Syriac``173';
isbe[680]='Aramitess`ar-am-it\'-es, ar\'-am-it-es, ar\'-am-it-es (\'arammiyah): The term applied to the concubine-mother of Machir, the father of Gilead (<a onClick="return mV(\'1Ch\',7,14);">1Ch 7:14</a>); the inhabitants of Gilead were thus in part Arameans (Syrians) by descent.``1';
isbe[681]='Aran`a\'-ran (\'aran, "wild goat"): A son of Dishan, the Horite (<a onClick="return mV(\'Gen\',36,28);">Ge 36:28</a>; <a onClick="return mV(\'1Ch\',1,42);">1Ch 1:42</a>). It may possibly be connected with the Yerahmelite Oren (\'-ren) (<a onClick="return mV(\'1Ch\',2,25);">1Ch 2:25</a>; compare Curtis, Chron. at the place; Dillmann, Genesis at the place; ZDMG, L, 168); Robertson Smith claims that this name is equivalent to the Samaritan (\'-r-n), "wild goat" (Jour. Phil., IX, 90). J. Jacobs translates it by "ass" (Stud. Biblical Arch., 71). This is one of the many totem names in the Bible. More than one-third of the Horites, the descendants of Seir, bear animal names, and those clans of the Edomites connected with the Horites also have animal names. The very name "Self" means a "he-goat," and Dishan, "a gazelle" (Stud. Biblical Arch., 70-72). Gray, however, remarks that "the instance (Aran) is most uncertain" (HPN, 108).``27';
isbe[682]='Ararah`Same as <a href="./study/isbe/search.html?string=ARARAT">ARARAT</a> (Tobit 1:21).``1';
isbe[683]='Ararat`ar\'-a-rat (\'ararat): A mountainous plateau in western Asia from which flow in different directions the Euphrates, the Tigris, the Aras and the Choruk rivers. Its general elevation <span class="noTag">is</span> 6,000 feet above the sea. Lake Van, which like the Dead Sea has no outlet, is nearly in its center. The Babylonian name was Urartu, the consonants being the same in both words. In <a onClick="return mV(\'2Ki\',19,37);">2Ki 19:37</a> and <a onClick="return mV(\'Isa\',37,38);">Isa 37:38</a> the word is translated in the King James Version Armenia, which correctly represents the region designated. It was to Armenia that the sons of Sennacherib fled. In <a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a> Ararat is associated with Minni and Ashkenaz, which according to the Assyrian monuments lay just to the east of Armenia. In <a onClick="return mV(\'Gen\',8,4);">Ge 8:4</a> the ark is said to have rested "upon the mountains of Ararat," i.e. in the mountainous region of Armenia, the plural showing that the mountain peak known as Ararat was not referred to. This peak is of volcanic origin and lies outside the general region, rising from the lowlands of the Araxes (Aras) River to a height of 17,000 feet, supported by another peak seven miles distant, 13,000 feet high. It is only in comparatively modern times that the present name has been given to it. The Armenians still call it Massis, but believe, however, that Noah was buried at Nachitchevan near its base.<P>The original name of the kingdom occupying Armenia was Bianias, which Ptolemy transliterated Byana. Later the "B" was modified into "V" and we have the modern Van, the present capital of the province. The "mountains of Ararat" on which the ark rested were probably those of the Kurdish range which separates Armenia from Mesopotamia and Kurdistan. In the Babylonian account the place is called "the mountain of Nizir" which is east of Assyria. Likewise Berosus locates the place "in the mountain of the Kordyaeans" or Kurds (Ant., I, iii, 6), while the Syriac version has Hardu in <a onClick="return mV(\'Gen\',8,4);">Gen. 8:4</a> instead of Ararat. The Kurds still regard Jebel Judi, a mountain on the boundary between Armenia and Kurdistan, as the place where the ark rested.<P>This elevated plateau of Armenia has still many attractions, and is eminently suited to have been the center from which the human race spread in all directions. Notwithstanding its high elevation the region is fertile, furnishing abundant pasture, and producing good crops of wheat and barley, while the vine is indigenous. Moreover there are unmistakable indications that in early historic times there was a much more abundant rainfall in all that region than there is now, so that the climate was then better adapted to the wants of primitive man. This is shown by the elevated beaches surrounding lakes Van, Urumiah, and, indeed, all the lakes of central Asia. Great quantities of mammoth bones have been found in these bordering lacustrine deposits corresponding to those found in the glacial and postglacial deposits of Europe and America. It should, also, be remembered that the drying up of the waters of the flood is represented to have been very gradual—it being 170 days from the time the waters began to subside before Noah could disembark. It may have been many centuries before the present conditions were established, the climate, meanwhile, being modified to a corresponding degree by the proximity of vast surrounding bodies of water.<P>Armenia abounds in inscriptions carved on the rocks, altar stones and columns, but they have been only imperfectly translated. The script is cuneiform and each letter has only a single phonetic character attached to it. But there are introduced a good many borrowed ideographs which have assisted in the decipherment. According to Sayce this cuneiform syllabary was introduced from Assyria after the conquest of Shalmaneser II in the 9th century BC.``198';
isbe[684]='Ararath`ar\'-a-rath: Same as <a href="./study/isbe/search.html?string=ARARAT">ARARAT</a> (which see).``1';
isbe[685]='Arathes`a-ra\'-thez (the King James Version Araiarthes; Arathes; Ariarathes): King of Cappadocia, 163-130 BC. Educated in Rome, he imbibed Roman ideas and became a faithful ally of the Romans, in conformity with whose wishes he declined a proposal of marriage with the sister of Demetrius Soter. The latter declared war, drove Arathes from his kingdom and set up Holophernes in his stead. He fled to Rome about 158, and through the good offices of the Romans succeeded in obtaining for himself a participation in the government of Cappadocia. Later he again became sole king. In 139 BC, as a result of an embassy sent by Simon Maccabeus, the Romans wrote letters to Arathes (1Macc 15:22) and other eastern kings in behalf of the Jews. (See Diodor. XXXI,19,28, 32; Justin, XXXV, 1; Polyb. III, 5; XXXII, 20-30; XXXIII, 12).``71';
isbe[686]='Araunah`a-ro\'-na (\'arawnah, <a onClick="return mV(\'2Sa\',24,16,20);">2Sa 24:16, 20</a>f; \'aranyah <a onClick="return mV(\'2Sa\',24,18);">2Sa 24:18</a>, and \'ornan, <a onClick="return mV(\'1Ch\',21,15);">1Ch 21:15</a>f; <a onClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a>, all from a Hebrew root meaning "to be strong"): A Jebusite from whom David at the request of the prophet Gad bought a threshing-floor located upon Mt. Moriah, as a site for an altar of the Lord at the time of the great plague (<a onClick="return mV(\'2Sa\',24,15);">2Sa 24:15</a>f; <a onClick="return mV(\'1Ch\',21,15);">1Ch 21:15</a>f), upon which Solomon later erected the temple (<a onClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a>).``1';
isbe[687]='Arba`ar\'-ba (\'arba\', "four"): Variously described as "the greatest man among the Anakim" (<a onClick="return mV(\'Jos\',14,15);">Jos 14:15</a>), "the father of Anak" (<a onClick="return mV(\'Jos\',15,13);">Jos 15:13</a>), "the father of Anok" (<a onClick="return mV(\'Jos\',21,11);">Jos 21:11</a> margin). Thus he seems to have been regarded as the ancestor of the Anakim, and as the most famous hero of that race. He was the reputed founder of the city called after him, on the site of which Hebron was built (<a onClick="return mV(\'Jos\',21,11);">Jos 21:11</a>).``1';
isbe[688]='Arba, City of``<a href="./study/isbe/search.html?string=KIRIATH+ARBA">KIRIATH-ARBA</a>`1';
isbe[689]='Arbathite`ar\'-bath-it (ha-\'arbhathi): Perhaps "a native of the Arabah." Klostermann suggests "a native of Beth-arabah." The Arbathite is Abi-albon (<a onClick="return mV(\'2Sa\',23,31);">2Sa 23:31</a>), also named Abiel (<a onClick="return mV(\'1Ch\',11,32);">1Ch 11:32</a>), one of David\'s heroes.``1';
isbe[690]='Arbatta`ar-bat\'-a, ar-bat\'-is: The King James Version Arbattis, (en Arbattois (plural)): Apparently a district in the neighborhood of Galilee, from which the Jews who were in danger of attack by the heathen were carried by Simon Maccabeus to Jerusalem (1Macc 5:21ff). It cannot be identified with certainty. Ewald (Hist, V, 314, English translation) favors el-Bateicha, the plain through which the Jordan flows into the Lake of Galilee. Encyclopedia Biblica (s.v.) suggests "the Arabah, or Araboth of Jordan." Possibly however we should look for it in the toparchy of Akrabattis, to the southeast of Shechem (BJ, III, iii, 4f).``54';
isbe[691]='Arbela`ar-be\'-la (en Arbelois): This place is mentioned in 1Macc 9:1ff, and in Ant, XII, xi,1,describing the march and encampment of Bacchides. The former says that "Demetrius sent Bacchides and Alcimus into the land of Judea...who went forth by the way that leadeth to Galgala, and pitched their tents before Masaloth, which is in Arbela, and after they had won it they slew much people." Josephus says that Bacchides "marched out of Antioch and came into Judea and pitched his camp at Arbela, a city of Galilee, and having besieged and taken those that were there in caves (for many people fled into such places) he removed and made all the haste he could to Jerusalem." It was from the caves near the village of Arbela in Galilee that Herod dislodged the robbers (Ant., XIV, xv, 4f; BJ, I, xvi, 2ff). Josephus fortified the caves of Arbela in lower Galilee (Vita, 37), "near the lake of Gennesar" (BJ, II, xx, 6). The references in Josephus point plainly to the caves in the cliff forming the south wall of the tremendous gorge of Wady el-Chamam which opens on the plain of Gennesaret, west of the village el-Mejdel. A series of these caves, skillfully adapted to purposes of refuge and defense, is still known as Qal\'at ibn Ma\'an, "fortress of the son of Ma\'an." On the height above stand the ruins of Irbid or Irbil (both forms are heard today), which unquestionably represent the Arbela of Josephus. The army from Antioch may quite well have come this way. No name however in the least resembling Masaloth has been recovered in this district. We may mention Robinson\'s suggestion (BR, II,398,note), that it may stand for the Hebrew mecilloth, "steps, stories, terraces," and may apply to the fortress in the rocks.<P>On the other hand the writer of 1Macc is an earlier authority than Josephus. If we accept his guidance, Bacchides must have crossed the plain of Esdraelon and followed the main highway southward through Samaria. Galgala may then be identified with Jiljilia, about 8 miles north of Bethel, and Masaloth with Meselieh, about 3 miles southeast of Dothan. Onomasticon mentions an Arbela in the great plain, 9 miles from Legio (Lejun), but it is now unknown. The phrase en arbelois might mean that Masaloth was in the district of Arbela; but there is no trace of this name as attaching to any tract in this neighborhood.<P>One or other of these routes must have been taken. While no certain decision can be reached, special weight attaches to the statement of Josephus, on account of his acquaintance with the localities in the region, and his unquestionable familiarity with the history.`<a href="./study/isbe/search.html?string=BETH+ARBEL">BETH-ARBEL</a>`54';
isbe[692]='Arbite`ar\'-bit (ha-\'arbi): The Arbite or perhaps an inhabitant of Arabia in Southern Judah (<a onClick="return mV(\'Jos\',15,52);">Jos 15:52</a>). The epithet is used in connection with one of David\'s mighty men in <a onClick="return mV(\'2Sa\',23,35);">2Sa 23:35</a>; where Paarai the Arbite occurs. In the parallel list (<a onClick="return mV(\'1Ch\',11,37);">1Ch 11:37</a>) we have Naarai the son of Ezbai.``1';
isbe[693]='Arbonai`ar-bo\'-nai, ar-bo\'na-i (Abrona): A torrent mentioned in Judith 2:24. Beyond what is indicated in this passage, it is not possible to determine the location; but from this it appears to have been near Cilicia. Identification with the modern Nahr Ibrahim is rejected on the ground (1) that the ancient name of this river was Adonis, and (2) that this does not answer to the term "torrent" applied by Judith. A possible misreading of "the high cities that were be\'ebher ha- nahar" ("beyond the river"; Encyclopedia Biblica under the word).``1';
isbe[694]='Arch`arch (\'ayil; Septuagint ta ailam, in sense of "posts" or "colonnade"): Referred to repeatedly in <a onClick="return mV(\'Eze\',40,16);">Eze 40:16</a>f; but translation is an error for "porch" or "portico." the Revised Version (British and American) gives in marg, "or, colonnade. The meaning of the Hebrew word is uncertain." The principle of arch construction was known to the Jews and examples of early Jewish rude arches have been found in Palestine. An arched form need not necessarily be constructed with radiating joints; it can be corbelled as at Mycenae (Treasury of Atreus). This type of construction has been found also in Palestine.``1';
isbe[695]='Archaeology of Asia Minor``<a href="./study/isbe/search.html?string=ASIA+MINOR+ARCHAEOLOGY+OF">ASIA MINOR, ARCHAEOLOGY OF</a>`1';
isbe[696]='Archaeology; Archaeology and Criticism`ar-ke-ol\'-o-ji, krit\'-i-siz\'-m: Archaeology, the science of antiquities, is in this article limited to the Biblical field, a field which has been variously delimited (De Wette,1814,Gesenius), but which properly includes not only all ancient facts bearing upon the Bible which had been lost and have been recovered, but all literary remains of antiquity bearing upon the Bible and, also, as of the first importance, the Bible itself (Hogarth, Authority and Archaeology, vi).<P>Scope of Article:<P>Criticism, the art of scrutiny, is here limited mainly, though not exclusively, to the literary criticism of the Bible, now, following Eichhorn, commonly called the Higher Criticism. Thus "Archaeology and Criticism," the title of this article, is meant to designate the bearing of the archaeology of Bible lands upon the criticism, especially the Higher Criticism, of the Bible. The subject as thus defined calls for the discussion of, I. What archaeology can do in the case—the powers, rights and authority, that is to say, the Function of archaeology in criticism; and II. What archaeology has done in the case, the resulting effects of such archaeological evidence, that is to say, the History of the bearing of archaeology upon the criticism of the Bible.<P>I. Function.<P>The function of archaeology in criticism has only recently been given much attention and the opinions thereon have varied greatly.<P>(a) Ignored by Encyclopaedists:<P>Biblical encyclopaedists generally, until the most recent, have not given this subject a place at all (Hastings Dictionary of the Bible, Encyclopedia Biblica, Smith, Dictionary of the Bible, Kitto, Encyclopedia of Biblical Literature, Hamburger, See Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche, Eadie, Biblical Encyclopedia). McClintock and Strong\'s Encyclopedia Biblical and Ecclesiastical Literature has an article on "Biblical Archeology" consisting entirely of bibliography, also an article of a general character under "Sac. Ant." The New Schaff-Herzog Encyclopedia of Religious Knowledge Encyclopedia has an article, The Catholic Encyclopedia,1907,has an article under the title "Biblical Antiquities," and the Jewish Encyclopedia, 1902, has an article of five pages on "Biblical Archeology" But on the function of archaeology in criticism there is almost nothing anywhere.<P>(b) Variously Estimated by Critics:<P>Critics have varied much in their estimate of the value of archaeology in criticism, according to their individual predilections and their critical theories, but until very recently archaeology has not generally been given a commanding, or even a prominent, place in criticism. Wellhausen seems to declare for the dominance of archaeology in criticism in the beginning of his History of Israel, though he very much ignores it in the pages that follow (History of Israel, 12). Driver (Authority and Archaeology, 143-50), thinks "testimony of archaeology sometimes determines the question decisively," but is "often strangely misunderstood," and the defeats of criticism at the hands of archaeology are often "purely imaginary" (LOT,1897,4). Orr thinks "archaeology bids fair before long to control both criticism and history" (POT, 305-435). Eerdmans, successor to Kuenen at Leyden, definitely and absolutely breaks with the Wellhausen school of criticism, chiefly on the ground that archaeology has discredited their viewpoint and the historical atmosphere with which they have surrounded the Old Testament. Wiener, the most prominent of recent Jewish critics, also believes that a proper apprehension of the nature of ancient institutions, customs, documents and codes, i.e. archaeology, and especially the archaeology of the Bible itself, is clearly decisive in its influence on the issue raised by the Wellhausen school (BS, 1908-10).<P>(c) Urged by Archaeologists:<P>Archaeologists generally for a long time have been putting forward the superior claims of their science in the critical controversy (Brugsch, Egypt under the Pharaohs; Naville, Recueil de Travaux, IV, N.S.; Petrie, Hyksos and Israelite Cities, chapters i-iv; Researches in Sinai, 188-223; Spiegelberg, Aufenthalt Israels in Aegypten; Steindorf, Explorations in Bible Lands (Hilprecht), 623-90; Sayce, Higher Criticism and the Monuments; Hommel, Ancient Hebrew Tradition, xi; Jeremias, Das alte Testament im Lichte des alten Orients).<P>The function of archaeology in criticism, as fully brought to light by recent discussion, is as follows:<P>1. Historical Setting.<P>Archaeology furnishes the true historical setting of Scripture. In the criticism of a painting, it is of the utmost importance to hang the picture aright before criticism begins. It is not greatly different in the criticism of literature, and especially Biblical literature. The patriarchs and prophets and psalmists are the "old masters" of spirituality and of religious literature; their productions were brought forth under certain social, political, moral and religious conditions, and within certain surroundings of influences, enemies, opportunities, temptations and spiritual privileges. It is only archaeology that can hang their pictures aright, and it is only when thus hung that true criticism is ready to begin. The critic is only then a critic when he has seen how archaeology has hung the picture (BST, 1906, 366).<P>2. Guidance to Methods.<P>Archaeology gives guidance to the methods of criticism. This it does; (a) Presuppositions:<P>With regard to presuppositions. Presuppositions are inevitable from our mental constitutions, and necessary to the consideration of any subject, since all subjects cannot be considered at once. But our presuppositions are naturally, to a large extent, those induced by our own experience and environment, until we are otherwise instructed. As it is only archaeology that is able to instruct us concerning the exact circumstances of certain portions of the Bible it is evident that, in those portions, without the instruction which archaeology can give, we cannot be assured of correct presuppositions in the critic.<P>(b) Canons:<P>Archaeology gives guidance concerning the canons of criticism. It is of the utmost importance that a literature should be judged only by the canons followed by its own literati. The innumerable literary remains of Egypt and Babylonia reveal methods and standards very different from each other, and still more different from those of modern western literature, but exhibiting to a marked degree the literary peculiarities of the Old Testament. In Babylonian literature, much attention is paid to epochal chronology. In Egyptian literature, comparatively little attention is given to chronology, and what chronology there is, is seldom epochal, but either synchronistic or merely historianic. In the Old Testament there is a mixture of all these kinds of chronology. Again, in Babylonian literature, there is carefulness and some degree of accuracy; in Egyptian literature, carelessness, slovenliness and inaccuracy are provokingly frequent. The Scriptures of the Old Testament are, in this respect, in striking contrast to these other literatures, yet nowhere in ancient oriental literature is there the mathematical rigidity of statement demanded in occidental literature today; on the other hand there is frequently a brevity and abruptness of literary method which, to western minds, appears to be fragmentariness of documents. The attempt to elucidate oriental literature in the Bible and out of it by applying thereto the tests and standards of western literature is not less disastrous than would be the attempt to judge western literature by these oriental peculiarities.<P>(c) Literary Form:<P>Archaeology gives guidance concerning literary form. Much of the definiteness and unity of modern literature is due to the arts of printing and book-binding. All archaeological literature of Bible lands, lacking, as it does, the influence of these arts, is, in form, indefinite, or fragmentary, or both. These peculiarities in form and the causes of the same, archaeology makes very plain by abundant illustration. It makes clear, also, that fragmentariness and indefiniteness in oriental literature, in so far as it arises from the literary form and not from partial destruction of documents, in no wise militates against integrity.<P>(d) Interpretation:<P>Archaeology gives guidance concerning interpretation. Archaeology admonishes us of the truism, too often overlooked, that a language or literature means only what it is understood to mean by those from whom it comes, so that the etymological, syntactical and speculative methods of interpretation employed in criticism, in order to be reliable, must have the support of the historical method. In the absence of this support, more especially if contemporary history as revealed by archaeology be antagonistic, interpretation, though supported by all the other methods of criticism, is very precarious. The interpretation of a rubric by the etymological and analytical methods may be partly or completely overthrown by a single picture or a brief description of the priest at the altar. For instance, it is very disquieting to compare the remarks of commentators on Bible references to the worship at high places with the facts revealed by the recent discovery of high places and the worship there conducted (Macalister, PEFS, 1903, 23-31; Robinson, BW, January, 1901; January, 1908, 219-25, 317-18; Vincent, Canaan, 144). Archaeology must guide in the interpretation of ancient literature, whether that which has just been dug up, as the recent finds of manuscripts and monuments, or that which has never been lost, as in the Bible itself.<P>3. Facts to Test Theories.<P>Archaeology supplies facts wherewith to test theories.<P>Facts and Correct Criticism Agree:<P>There can be no real antagonism between the facts of archaeology and a correct literary criticism of trustworthy documents. But who or what is to determine when the criticism is correct? If there is conflict between the facts of archaeology and the conclusions of criticism, which must give way? To ask the question is to answer it. Theory must always give way to facts. "Where the testimony of archaeology is direct, it is of the highest possible value, and, as a rule, determines a question decisively; even where it is indirect, if it is sufficiently circumstantial and precise, it may make a settlement highly probable" (Driver, Authority and Archaeology, 143). This prerogative of archaeological facts in the testing of critical theories must, then, of necessity be given wide and positive recognition.<P>(a) Theories Need Attestation:<P>No theory is to be finally accepted and made applicable to faith and life until tested and attested by facts; if it be a theory in the field of Nature, by the facts of Nature; if in the field of experience, by facts of experience; if in the field of history, byfacts of history. The Master brings even revelation to this test when He says, "If any man willeth to do his will, he shall know of the teaching, whether it is of God, or whether I speak from myself" (<a onClick="return mV(\'Jhn\',7,17);">Joh 7:17</a>). Anything in the Bible may be discredited by theory; as everything in heaven and earth may be—indeed, has been—discredited by theory. One might as safely abandon the beaten track for the most alluring but unconfirmed appearance of an eastern desert, as turn one\'s life aside to a theory unattested by fact. However perfect the appearance, it may, after all, be only the mirage, and the disappointed pilgrim may never get back to the safe road. Let theory first be confirmed by fact; then it may be received into the life.<P>(b) Success not Attestation:<P>Even a theory which meets all the known conditions of the case in hand is not by that fact proved to be true, and therefore to be received into the life. The most alluring danger to which criticism is subject is the contrary assumption that a theory which meets all the known conditions of the case in hand is thereby proved to be true. This is not the case. Such a theory must, in addition, be corroborated by facts independently brought to light, or by mysteries unlocked; and even if mysteries be unlocked, the theory is not necessarily an entirely correct theory—the key that turns the lock must be something like the key that belongs to it, but may after all, be a false key. There must, in any case, whether of mysteries unlocked or of facts otherwise brought to light, be independent, genuine evidence in addition to the adaptability of theory to all the known conditions of the case in hand. And furthermore, a theory must not only be able to meet the test of some additional facts, but the test of all the conditions imposed by any additional facts brought to light, and be able, also, to incorporate these new facts as naturally as those upon which theory was originally constructed.<P>(1) Theory in Life:<P>The problem is not to determine one or several of the ways in which an event might have taken place, but the one way in which it did take place. A theory which meets all the conditions of the case in hand may be one of the several ways in which the event might have taken place, but only by independent, genuine, corroborative evidence is any theory to be attested as the way in which the event actually did take place. That this statement of the case is correct in the experiences of life, we have abundant evidence in the proceedings of courts of law. The most careful procedure does not wholly prevent false convictions. The prosecutor presents a theory of the commission of a crime which meets all the conditions of the case as made out by the evidence, convinces twelve jurymen, and secures a conviction. Yet sometimes afterward it is found out that another person committed the crime in an entirely different way. That the dictum under discussion is inapplicable to literature is equally well established. Sir Peter LePage Renouf argued with great acuteness and force that it is possible to assign significations to an unknown script, give meanings to the words thus formed, construct a grammar and translate inscriptions as historical statements and make good sense, though not a single sign, or word, or construction, or thought be correct (Life-work, I, 6, 7). He says of such a method: "It is not difficult to make out the Ten Commandments, the Psalms of David, the Homeric Poems, or the Irish Melodies, on any ancient or modern monument whatever, and in any language you please."<P>(2) Theory in Literature:<P>Actual examples in fulfillment of Renouf\'s warning thesis are not wanting. The grotesque, yet confident, efforts at the decipherment of the Egyptian hieroglyphs before the discovery of the Rosetta Stone are not forgotten. Dr. Budge says (The Mummy, 124): "In more modern times the first writer at any length on hieroglyphics was Athanasius Kircher, the author of some ponderous works in which he pretended to have found the key to the hieroglyphic inscriptions, and to translate them. Though a man of great learning, it must be plainly said that, judged by scholars of today, he would be considered an impostor." Joseph de Guignes (1770) maintained that China was settled by Egyptians, and the Chinese characters only degenerate Egyptian hieroglyphs. Similar failures in the attempt to decipher the Hittite hieroglyphs and translate the Hittite inscriptions must form painful recollections to distinguished scholars yet living, whose efforts, extending in some cases not only to lists of signs but to syllabaries, vocabularies, grammars and translations, are now, in part, and in some cases, in toto, rejected by the whole learned world. However successful present or future efforts of these scholars may prove to be, they have, in part at least, themselves repudiated their former work. The most plausible theory of a literature, though it seem to embrace every detail, may, after all, be found to be, as in one or two of the instances referred to above, wholly false when tested by the principles of philology and the facts of contemporary history.<P>(3) Theory in History:<P>The dangers of unconfirmed theory in life and literature are even greater in history, which, in its present-day form, is but life written down, human experiences given over to all the accidents and conventionalities of literature. The warnings here from Egyptian and classical history and literature are not to be disregarded. Menes and other early kings of Egypt were declared by critics to be mere mythological characters; likewise Minos of Crete; and the stories of Troy and her heroes were said to belong to "cloudland." But the spades of Petrie at Abydos (Royal Tombs), of Evans at Knossos (Quarterly Review, October, 1904, 374-95), and of Schliemann at Troy (Ilios: City and Country of the Trojans), have shown the "cloudland" as solid earth, and the ghostly heroes to be substantial men of flesh and blood. If we are to learn anything from experience, certainly no theory of either sacred or profane history is to be accepted as final until tested and attested by facts.<P>(c) Source of the Needed Facts:<P>Only archaeology is bringing forth any new facts on the questions raised by criticism. Criticism produces only theories; it combines facts, but produces none. Exegetes and commentators rarely, if ever, now bring to light new facts any more than present-day philosophers give the world new thoughts. A flood of light is, indeed, pouring across the page of the exegete and the commentator in these latter days which makes their work inestimably more helpful for interpretation, but the source of that light is neither criticism nor exegesis, but archaeology. Archaeology it is which sets alongside the Bible history the facts of contemporary life and thus illustrates Biblical literature and literary methods by contemporary literature and the methods of contemporary literati, and which makes the purity, sanctity and divinity of the things of revelation stand out in their own glorious light by setting round about them the shadows of contemporary ritual and morality and superstition.<P>(d) Scope of Function:<P>Hence, no critical theory of the Bible is to be finally accepted and made a part of our faith until tested and attested by archaeological facts. Even Wellhausen, however far he departs from this principle in the course of his criticism, seems to lay it down as fundamental in the beginning of his History of Israel, when he says: "From the place where the conflagration was first kindled the fire men keep away; I mean the domain of religious antiquities and dominant religious ideas—that whole region as Vatke in his Biblical Theology has marked it out. But only here, where the conflict was kindled, can it be brought to a definite conclusion" (History of Israel, 12). G. A. Smith quotes also with approval these words from Napoleon (Campagnes d\'Egypte et de Syrie dictees par Napoleon lui-meme, II): "When camping upon the ruins of the ancient cities, someone read the Bible aloud every evening in the tent of the General-in-Chief. The verisimilitude and the truthfulness of the descriptions were striking. They are still suited to the land after all the ages and the vicissitudes." But Dr. Smith adds, "This is not more than true, yet it does not carry us very far....All that geography can do is to show whether or not the situations are possible at the time to which they are assigned; even this is a task often beyond our resources" (HGHL, 108). Thus critics, while here and there acknowledging the proper function of archaeology in criticism, have not heretofore allowed it much scope in the exercise of that function.<P>II. History.<P>Limitations of Discussion:<P>The history of archaeology in criticism to be set forth here has mainly to do with the testing of critical theories by archaeological facts. The contributions of archaeology to the furnishing of the historical setting of the Biblical narratives make up a large part of this and every dictionary of the Bible. The history of the guidance of critical methods by archaeological information is in the making. There can hardly as yet be said to be any to record.<P>A Wide Field:<P>The field opened up for the testing of critical theories by the results of archaeological research is so varied and so extended that only an outline can be given here. Extravagant claims concerning the outcome of this testing have been made both by some critics and by some of their opponents; as when Dr. Driver says, after except the points upon which the evidence of archaeology is neutral, "On all other points the facts of archaeology, so far as they are at present known, harmonize entirely with the position generally adopted by the critics" (Authority and Archaeology, 145); or as when the astronomer, C. Piazzi Smyth, thought that the great pyramid proved the "wisdom of the Egyptians" to have included some of the abstruse problems of higher mathematics; and Dr. Seiss, in his Miracle in Stone, was confident that the same colossal monument of Egypt definitely portrayed some of the extreme positions of the premillennial theology.<P>Some of the instances of the testing of critical theories concerning the Scriptures by the facts of archaeology, for which unquestionable historical proofs can be offered, are here presented.<P>1. Theories Not Affecting Historicity or Integrity.<P>Many critical theories, notably those not affecting the historicity or the integrity of the Scriptures, i.e. accordant with the face value of Scripture, have been corroborated and others discredited.<P>(a) Theories corroborated:<P>(1) Geography and Topography:<P>The theory of the geographical and topographical trustworthiness of Scripture, i.e. that the peoples, places and events of Scripture are to be found just where the Bible places them. Attempts to belittle the importance of this geographical and topographical corroboration of the trustworthiness of the Scriptures have been made (Driver, Authority and Archaeology, 148; also LOT, xi; Smith, HGHL, 108), but such attempts are not satisfying. The theory of the correctness of the Biblical statements has been of well-nigh universal acceptance; archaeologists have fitted out expensive expeditions in accordance with it, exegesis has allowed it to enter into its conclusions, discussion has proceeded upon the assumption of its correctness, the whole body of identifications which make up Biblical geography and topography attest it, and the whole list of sacred geographies, uniform in every essential particular, are in evidence in support of this theory, even the works of those writers who have spoken disparagingly of it.<P>(2) Story of the Nations:<P>The theory of the ethnographical correctness of Scripture. That the relation between peoples as indicated in Scripture is correct, has been a working theory for all general purposes and only departed from for special ends. Kautzsch says (Die bleibende Bedeutung des Alttestaments, 17): "The so-called Table of Nations remains, according to all the results of monumental exploration, an ethnographic original document of the first rank, which nothing can replace." The progress of archaeological research has confirmed this general working theory and every year adds new confirmation with regard to particular items which, for some special end, have been represented as against theory. That the general theory of the correctness of the tribal relationships in Scripture has been, and is being, sustained, is indisputable (Hommel, Ancient Hebrew Tradition; Gunkel, Israel und Babylonien, chapter vi; Sayce, Patriarchal Palestine, chapter ii; Winckler, OLZ, December 15, 1906; Budge, History of Egypt, I; Orr, POT, 400-401, 529-30). See <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>.<P>(3) Accuracy of Scripture:<P>The theory of the accuracy of Scripture in both the originals and the copies. Every theory of inspiration postulates this in greater or less degree, and the most prevalent analytical theory put forth by criticism, with its lists of words indicating, as it is asserted, authorship, demands, for its very life, a degree of accuracy and invariableness in the use of words in both the writing of originals and the transmission of them by copyists greater than that demanded by any the most exacting theory of inspiration. Wherever it has been possible to test the statements of Scripture in its multitudinous historical notices and references, archaeology has found it correct to a remarkable degree, and that in its present form and even in minute peculiarities of statement (Brugsch, Broderick edition, Egypt under the Pharaohs, chapters v-vi; Sayce, Patriarchal Palestine; Naville, Recueil de Travaux, IV, N.S.; Petrie, Tahpanhes; Tompkins, The Age of Abraham; Clay, Light on the Old Testament from Babel).<P>(4) Bible Imagery:<P>The theory of the correctness of the imagery of the Bible. This is another of the fundamental and universal working theories of criticism which is, however, sometimes forgotten. Whatever theory of the authorship and the origin of the various books of the Bible, there is always, with only a few special exceptions, the underlying assumption on the part of the critics of the correctness of the imagery reflecting the topography, the flora and the fauna, the seasons and the customs. Indeed, upon the trustworthiness of the imagery, as upon the exactness in the use of words, criticism depends. And this underlying assumption of criticism of every hue has been confirmed indisputably in its general features, and is being corroborated year by year in its minutest details, and even in those very special instances where it has been disputed. To this end testify the whole company of oriental residents, intelligent travelers and scientific investigators (Thomson; Van Lennap; Robinson; Stanley; Palmer, Desert of the Exodus; Trumbull, Kadesh Barnea; Clermont-Ganneau, Archaeological Researches; Van Dyke, Out of Doors in the Holy Land).<P>Besides these theories of a general character, some concerning particulars may be noticed:<P>(5) Garden of Eden:<P>The theory of the location of the Garden of Eden somewhere in the Euphrates Valley. This theory has been all but universally held and, while it is not yet definitely of substantiated, is receiving cumulative corroboration along ethnological lines. Wherever it is possible to trace back the lines of emigration of the early nations mentioned in the Bible, it is always found that the ultimate direction is toward a certain comparatively small area in western Asia.<P>(6) The Flood:<P>The geological theory concerning the flood of Noah as the last great change in land levels is being most exactly confirmed, not only by investigations into glacial history, but by examination of the records of the cataclysm left upon the mountains and valleys of central and western Asia (Wright, The Ice Age in North America; and Scientific Confirmations of Old Testament History, chapters vii-xi). See <a href="./study/isbe/search.html?string=DELUGE+OF+NOAH">DELUGE OF NOAH</a>.<P>(7) Sodom and Gomorrah:<P>The geological theory of the destruction of the Cities of the Plain has been exactly confirmed by the examination of the strata; a bituminous region, a great stratum of rock-salt capped by sulphur-bearing marls and conglomerates cemented by bitumen, an explosion of pent-up gases, which collect in such geological formations, blowing the burning brimstone high in the air, and the waters of the Jordan coming down to dissolve the salt of the ruptured rock-salt stratum—all this provides for exactly what the Bible describes and for the conditions found there today; the pillar of smoke rising up to heaven, the rain of fire and brimstone falling back from the blowing-off crater, the catching of Lot\'s wife in the edge of the cataclysm and her encrustation with salt (Wright, Scientific Confirmations of Old Testament History, 144; Blankenkorn, ZDPV, XIX, 1).<P>(8) Hyksos and Patriarchs:<P>It has long been thought that there might be some relationship between the mysterious Hyksos kings of Egypt and the Patriarchs to account for the favorable reception, even royal distinction, given the latter. This theory of relationship has been very fully established by the discoveries of Petrie at Tell el-Yehudiyeh (Petrie, Hyksos and Israelite Cities, 1-16). He has not shown to what race the Hyksos belonged, but he has shown their tribal character, that they were, as their name indicates, "Bedouin princes," leaders of the nomadic or semi-nomadic tribes of Upper and Lower Ruthen, i.e. Syria and Palestine, and Northern and Western Arabia, as were the Patriarchs, so that the latter were shown by the former the consideration of one "Bedouin prince" for another.<P>(b) Theories Discredited:<P>(1) Uncivilized Canaan:<P>The interesting picture which was wont to be drawn of Abraham leaving all his friends and civilization behind him to become a pioneer in a barbarous land has become dim and dimmer and at last faded out completely in the ever- increasing light of contemporary history revealed by Babylonian and Palestinian discoveries (Vincent, Canaan, chapters i-ii).<P>(2) Concerning Melchizedek:<P>Concerning Melchizedek, "without father and without mother" (<a onClick="return mV(\'Hbr\',7,3);">Heb 7:3</a>), Tell el-Amarna Letters, while not wholly affording the needed information, have put to flight a host of imaginings of old commentators, and pointed toward Melchizedek\'s place in a line of kings at Jerusalem of unique title disclaiming any hereditary rights in the crown. "It was not my father and it was not my mother who established me in this position, but it was the mighty arm of the king himself who made me master of the lands and possessions of my father." This title, over the correct translation of which there has been much controversy, occurs not once only, but seems to have been required at every formal mention of the sovereignty of the king (Budge, History of Egypt, IV, 231-35).<P>(3) Oriental Chronology:<P>The theory of the chronology of the early portions of the Old Testament, which made it to be so exactly on the principle of the system of chronology in vogue in our western world today, which, indeed, assumed that there could be no other system of chronology, and which was universally held as a working hypothesis by all classes of critics and commentators until very recently, has been greatly modified, if not utterly discredited, by both archaeological and ethnological research. Whatever may have been the system and method of chronology in use in early Biblical history, it certainly was not the same as our epochal chronology based upon exact astronomical time. The early chronologies of the Orient were usually historianic, oftentimes synchronistic, but very seldom epochal. The first, and usually the only, intent of present-day chronology is to chronicle the flight of time; the ancient systems of the East often introduced a moral element; events, rather than time, were chronicled, and the time in which nothing took place and the man who accomplished nothing were apt to be passed over in silence. Sometimes chronicles were arranged symmetrically, and again the visional conception of time found in all prophecy seems sometimes to have prevailed in the writing of history. Certain it is that ancient oriental thought regarded man\'s relation to life as of far greater importance than his relation to time—a more deeply moral conception of chronology than our own (Green, BS, April,1890,285-303).<P>2. Theories Affecting the Integrity or Historicity of Scripture.<P>Many critical theories attacking the integrity or historicity of Scripture, i.e. reconstructive theories, have been utterly discredited by archaeological evidence, and, in some cases, abandoned by those who held them (compare Driver, Genesis, addenda, 7th edition, xx).<P>(a) Ignorance of Patriarchal Age:<P>The ignorance of the patriarchal age was once a frontier fortress which threatened away all literary pretensions beyond that limit. This ignorance, though never held by all advocates of a reconstructing criticism, was held by some. Von Bohlen scoffed at the idea of the "undisciplined horde" possessing knowledge of laws (Gen, 29-41; compare Reuss, Gesch des Altes Testament, 96; Dillmann, Numbers and Joshua, 594). Dr. Driver says, indeed, "It is not denied that the patriarchs possessed the art of writing," but thinks the possession of a literature by them a mere hypothesis, for the truth of which no positive ground can be alleged (Gen, xlii-xliii; also Orr, POT, 375). That this theory is absolutely abandoned by everyone hardly needs to be stated. The discovery of evidence of a postal system in Canaan in the days of Naram Sin (Sayce, Archaeology of the Cuneiform Inscriptions, 143; Heuzey, Revue d\'Assyriologie,1897,1-12), the strict conformity of many of the patriarchal customs and events to written law, as revealed by DeMorgan\'s discovery of the Code of Hammurabi, Dr. Murch\'s discovery of the Tell el- Amarna Letters, revealing as they do the wide diffusion of the art of writing about one hundred and thirty years before the Exodus, together with the gradual pushing back by epigraphic evidence of the date of the origin of the Hebrew script (Clay, Amurru, 30-32), and the overwhelming evidence, from recent excavations, of the general culture and refinement of patriarchal Palestine, while not yet making known fully the exact state of the patriarchal civilization, has made any theory of the ignorance of that age impossible.<P>(b) Religious Ideas in Canaan:<P>The theory of the nomadic, semi-barbarous condition of Palestine and of the impossibility of high religious ideas among the patriarchs before the Exodus (Kuenen, Rel of Ideas Israel, I, 108-109), though most closely connected with the preceding, demands separate notice. This theory is essential to the current evolutionary view of Israel\'s history and has been definitely espoused by nearly all holding that view (G. A. Smith, The Expositor, 1908, 254-72; compare POT, 60). This theory, though less important to ot her schools of critics, has in fact been held by nearly all commentators. But the discovery of the earliest wall-and cistern-work at Taanach (Sellin), and the engineering feats on the defenses and the water-works at Gezer (Macalister and Vincent, PEFS), and the 40-ft. city wall pictured in Egyptian illustration of Canaanite war (Petrie, Deshasha, plural IV), as well as the list of richest booty taken by Thothmes III (Sayce, Archaeology of the Cuneiform Inscriptions, 156-57; Birch, RP, 1st ser, II, 35-52; Leps ius, Denkmaler, Abth. III, bl. 32, 32A, 30A, 30B; Auswahl, III, L. 42-45), which could scarcely be duplicated by all the museums of the world today, testify equally to the luxurious culture and refinement of the times. All this, in addition to the mass of evidence against the ignorance of the patriarchal age (see (a) above), overwhelmingly sustains the opinion of W. Max Muller that "the civilization of Palestine in the patriarchal age was fully equal to that of Egypt."<P>(c) Evolutionary History:<P>The theory of the evolution of Israel\'s history chiefly from a Palestinian origin and environment (Budde, Hist of Israel before the Exile, especially 77; Kuenen, Hist of Israel, 225; Wellhausen, Hist of Israel, 462). Palestine estinian discoveries show a contrast between the unique religion of the Hebrews and the religion of the surrounding peoples of Canaan as marked as it may well be. The evidence is not at all of a purer religion growing up out of the vile culture of Palestine, but of a purer re ligion coming down and overwhelming it (PEFS, 1902-9; G. A. Smith, Mod. Crit. and the Preaching of the Old Testament, chapter iv, especially 142; PEFS, 1905, 287-88).<P>Descending now to a few of the great mass of particulars, we may mention:<P>(d) Mythology and Bible:<P>The theory of the legendary character of the four kings of <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, and of the Hittites; and theory of the generally mythological character of the early portions of the Bible. The four kings have been called "petty sheiks of the desert," and their names "etymological inventions." The historical character of the account of these kings has been utterly discredited by many. Noldeke in his Untersuchungen arrives at the result that the history (<a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>) is throughout a "free creation," and the person of Melchizedek a "poetical figure." And Wellhausen thinks Noldeke gave the "death-blow" to the historicity of the story (Wellhausen, Comp. of the Hexateuch, 311-12). Ed. Meyer is of the same opinion as Noldeke, but expresses himself in a still more unfavorable manner (Gesch, 136). Hitzig, however, goes to the extreme of depreciation when he sees in the expedition of Chedorlaomer only an adumbration of the invasion by Sennacherib (<a onClick="return mV(\'2Ki\',19,13);">2Ki 19:13</a>). Delitzsch gives a very comprehensive review of those critics who have regarded this narrative of the kings as legend of small or no historical basis (Gen, I, 396- 99; compare Dillmann, Genesis, II, 32-33). In addition, the mythological character of the early portions of the Bible generally has had ardent advocates (Stade, Gesch, 129-30; Schultz, Old Testament Theology, I, 31; Wellhausen, Gesch Israels, 317-20).<P>(1) Chedorlaomer and Allies:<P>But the four kings have appeared in archaeological discoveries. While there is still some dispute about the identification of certain of them, the confederacy has appeared in Babylonia and also the Babylonian suzerainty over Palestine in the age called for by the narrative, and, indeed, the whole historical setting into which the narrative fits with perfect naturalness (Jeremias, Das alte Testament im Lichte des alten Orients; Hommel, Hebrew Tradition, chapter v; Clay, Light on the Old Testament from Babel, chapter vi). But myths do not receive archaeological confirmation such as has not only been given to the narrative of the confederacy of the four kings, but which is rapidly bringing out the features of the whole early Old Testament history (Gunkel, Genesis, 263; Ladd, Doct of Sac Scrip, I, 737).<P>(2) The Hittites:<P>Then grave doubts in the past have been raised concerning the Hittites. Occasionally it has been boldly said that "no such people ever existed" (compare Newman, Hebrew Monarchy, 184-85; Budge, Hist of Egypt, IV, 136). But in addition to the treaty of Rameses II with the "Kheta," long generally believed to have been the Hittites (RP, 2nd series, IV, 25-32), and the references to the "Hatti" in the Tell el-Amarna Letters, also thought to be the same people, we now have Winckler\'s great discovery of the Hittite capital at Boghaz-Koi, and the Hittite copy of the treaty with Rameses II in the cuneiform script. The Hittites are seen to be a great nation, a third with Egypt and Babylonia (OLZ, December 15, 1906). See <a href="./study/isbe/search.html?string=HITTITES">HITTITES</a>.<P>(e) The Theory of Anachronisms.<P>Aside from the general application of this theory by many critics to the traditional view of Scripture and the assertion of the systematic representation of earlier events in the light of much later times (Robertson, Early Religion, 30; Frip, Comp. of Gen), many special instances of anachronisms have been alleged. Edom has been said to be mentioned too early in the narrative (De Wette, Int, II,71,Parker\'s note; also Gunkel, Genesis, 61). But an officer of Seti Meremptah II, about the time of the Exodus, in an official report, mentions the people of Edom as desiring to pasture their flocks in Goshen. They had thus early found their way clear across the Sinai peninsula (Muller, Asien und Europa, 135; compare Papyrus Anastasia). Then Moab, long unidentified, has had doubt cast on its existence at so early a time as its first mention; but it also occurs in an inscription of Rameses II near the time of the Exodus, and the land of Moab is placed in "Ruthen," the Egyptian name for Syria and Palestine and Northern and Western Arabia (Kyle, "Geographical and Ethnic Lists of Rameses II," Recueil de Travaux, XXX).<P>3. Theories Now Challenged.<P>Several critical theories are just now challenged in the name of archaeological discovery; whether or not the challenges will ultimately be sustained remains to be determined. A few only are mentioned here, but they are of such a character as, if ultimately sustained, will have a far-reaching effect upon criticism.<P>(a) Semitic Origins:<P>The theory, long established and almost universally held, of the Babylonian origin and westward course of early Semitic culture, especially of religious traditions (Barton, Semitic Origins, chapter i; also "Tiamat," JAOS, XVI, 1- 27; Paton, Early Hist of Palestine and Syria, chapters iii-viii; Driver, Genesis, 30-31; Orr, POT, 397). This theory has been mildly questioned for some time and is now boldly challenged. A complete "right-about-face" is proposed by reason of many archaeological considerations, which, it is claimed, make Amurru, Syria and Palestine, the home of the northern Semite, to be, if not the original source of Semitic culture, at least an earlier source than Babylonia, and the course of religious culture among Semites in that early age to be not westward but eastward, as apparently in <a onClick="return mV(\'Gen\',11,2);">Ge 11:2</a> the Revised Version (British and American) (Clay, Amurru, the Home of the Northern Semites).<P>(b) Invasion of Canaan:<P>The theory of the gradual invasion of Palestine instead of the conquest is now for the first time challenged by evidence other than the record in Joshua. Such Palestinian researches and the collection of such evidence have but begun within a few years, and from the very breadth of the question
