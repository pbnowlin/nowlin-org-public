isbe[619]='Apostasy; Apostate`a-pos\'-ta-si, a-pos\'-tat (he apostasia, "a standing away from"): I.e. a falling away, a withdrawal, a defection. Not found in the English Versions of the Bible, but used twice in the New Testament, in the Greek original, to express abandonment of the faith. Paul was falsely accused of teaching the Jews apostasy from Moses (<a onClick="return mV(\'Act\',21,21);">Ac 21:21</a>); he predicted the great apostasy from Christianity, foretold by Jesus (<a onClick="return mV(\'Mat\',24,\'10-12\');">Mt 24:10-12</a>) which would precede "the day of the Lord" (<a onClick="return mV(\'2Th\',2,2);">2Th 2:2</a>). Apostasy, not in name but in fact, meets scathing rebuke in the Epistle of Jude, e.g. the apostasy of angels (<a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a>). Foretold, with warnings, as sure to abound in the latter days (<a onClick="return mV(\'1Ti\',4,\'1-3\');">1Ti 4:1-3</a>; <a onClick="return mV(\'2Th\',2,3);">2Th 2:3</a>; <a onClick="return mV(\'2Pe\',3,17);">2Pe 3:17</a>). Causes of: persecution (<a onClick="return mV(\'Mat\',24,9,10);">Mt 24:9,10</a>); false teachers (<a onClick="return mV(\'Mat\',24,11);">Mt 24:11</a>); temptation (<a onClick="return mV(\'Luk\',8,13);">Lu 8:13</a>); worldliness (<a onClick="return mV(\'2Ti\',4,4);">2Ti 4:4</a>); defective knowledge of Christ (<a onClick="return mV(\'1Jo\',2,19);">1Joh 2:19</a>); moral lapse (<a onClick="return mV(\'Hbr\',6,\'4-6\');">Heb 6:4-6</a>); forsaking worship and spiritual living (<a onClick="return mV(\'Hbr\',10,\'25-31\');">Heb 10:25-31</a>); unbelief (<a onClick="return mV(\'Hbr\',3,12);">Heb 3:12</a>). Biblical examples: Saul (<a onClick="return mV(\'1Sa\',15,11);">1Sa 15:11</a>); Amaziah (<a onClick="return mV(\'2Ch\',25,14,27);">2Ch 25:14,27</a>); many disciples (<a onClick="return mV(\'Jhn\',6,66);">Joh 6:66</a>); Hymeneus and Alexander (<a onClick="return mV(\'1Ti\',1,19,20);">1Ti 1:19,20</a>); Demas (<a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>). For further illustration see <a onClick="return mV(\'Deu\',13,13);">De 13:13</a>; <a onClick="return mV(\'Zep\',1,\'4-6\');">Ze 1:4-6</a>; <a onClick="return mV(\'Gal\',5,4);">Ga 5:4</a>; <a onClick="return mV(\'2Pe\',2,20,21);">2Pe 2:20,21</a>.<P>"Forsaking Yahweh" was the characteristic and oft-recurring sin of the chosen people, especially in their contact with idolatrous nations. It constituted their supreme national peril. The tendency appeared in their earliest history, as abundantly seen in the warnings and prohibitions of the laws of Moses (<a onClick="return mV(\'Exd\',20,3);">Ex 20:3</a>, <a onClick="return mV(\'Exd\',20,4);">4</a>, <a onClick="return mV(\'Exd\',20,23);">23</a>; <a onClick="return mV(\'Deu\',6,14);">De 6:14</a>; <a onClick="return mV(\'Deu\',11,16);">11:16</a>). The fearful consequences of religious and moral apostasy appear in the curses pronounced against this sin, on Mount Ebal, by the representatives of six of the tribes of Israel, elected by Moses (<a onClick="return mV(\'Deu\',27,\'13-26\');">De 27:13-26</a>; <a onClick="return mV(\'Deu\',28,\'15-68\');">28:15-68</a>). So wayward was the heart of Israel, even in the years immediately following the national emancipation, in the wilderness, that Joshua found it necessary to re-pledge the entire nation to a new fidelity to Yahweh and to their original covenant before they were permitted to enter the Promised Land (<a onClick="return mV(\'Jos\',24,\'1-28\');">Jos 24:1-28</a>). Infidelity to this covenant blighted the nation\'s prospects and growth during the time of the Judges (<a onClick="return mV(\'Jdg\',2,\'11-15\');">Jud 2:11-15</a>; <a onClick="return mV(\'Jdg\',10,6,10,13);">10:6, 10, 13</a>; <a onClick="return mV(\'1Sa\',12,10);">1Sa 12:10</a>). It was the cause of prolific and ever-increasing evil, civic and moral, from Solomon\'s day to the Assyrian and Babylonian captivities. Many of the kings of the divided kingdom apostatized, leading the people, as in the case of Rehoboam, into the grossest forms of idolatry and immorality (<a onClick="return mV(\'1Ki\',14,\'22-24\');">1Ki 14:22-24</a>; <a onClick="return mV(\'2Ch\',12,1);">2Ch 12:1</a>). Conspicuous examples of such royal apostasy are Jeroboam (<a onClick="return mV(\'1Ki\',12,\'28-32\');">1Ki 12:28-32</a>); Ahab (<a onClick="return mV(\'1Ki\',16,\'30-33\');">1Ki 16:30-33</a>); Ahaziah (<a onClick="return mV(\'1Ki\',22,\'51-53\');">1Ki 22:51-53</a>); Jehoram (<a onClick="return mV(\'2Ch\',21,6,10,\'12-15\');">2Ch 21:6, 10, 12-15</a>); Ahaz (<a onClick="return mV(\'2Ch\',28,\'1-4\');">2Ch 28:1-4</a>); Manasseh (<a onClick="return mV(\'2Ch\',33,\'1-9\');">2Ch 33:1-9</a>); Amen (<a onClick="return mV(\'2Ch\',33,22);">2Ch 33:22</a>). See <a href="./study/isbe/search.html?string=IDOLATRY">IDOLATRY</a>.<P>Prophecy originated as a Divine and imperative protest against this historic tendency to defection from the religion of Yahweh. In classical Greek, apostasy signified revolt from a military commander. In the roman catholic church it denotes abandonment of religious orders; renunciation of ecclesiastical authority; defection from the faith. The persecutions of the early Christian centuries forced many to deny Christian discipleship and to signify their apostasy by offering incense to a heathen deity or blaspheming the name of Christ. The emperor Julian, who probably never vitally embraced the Christian faith, is known in history as "the Apostate," having renounced Christianity for paganism soon after his accession to the throne. An apostate\'s defection from the faith may be intellectual, as in the case of Ernst Haeckel, who, because of his materialistic philosophy, publicly and formally renounced Christianity and the church; or it may be moral and spiritual, as with Judas, who for filthy lucre\'s sake basely betrayed his Lord. See exhaustive articles on "Apostasy" in the Jewish Encyclopedia.``139';
isbe[620]='Apostle`a-pos\'-l (apostolos, literally, "one sent forth," an envoy, missionary): For the meaning of this name as it meets us in the New Testament, reference is sometimes made to classical and Jewish parallels. In earlier classical Greek there was a distinction between an aggelos or messenger and an apostolos, who was not a mere messenger, but a delegate or representative of the person who sent him. In the later Judaism, again, apostoloi were envoys sent out by the patriarchate in Jerusalem to collect the sacred tribute from the Jews of the Dispersion. It seems unlikely, however, that either of these uses bears upon the Christian origin of a term which, in any case, came to have its own distinctive Christian meaning. To understand the word as we find it in the New Testament it is not necessary to go beyond the New Testament itself. To discover the source of its Christian use it is sufficient to refer to its immediate and natural signification. The term used by Jesus, it must be remembered, would be Aramaic, not Greek, and apostolos would be its literal equivalent.<P>1. The Twelve:<P>In the New Testament history we first hear of the term as applied by Jesus to the Twelve in connection with that evangelical mission among the villages on which He dispatched them at an early stage of His public ministry (<a onClick="return mV(\'Mat\',10,1);">Mt 10:1</a>f; <a onClick="return mV(\'Mar\',3,14);">Mr 3:14</a>; <a onClick="return mV(\'Mar\',6,30);">6:30</a>; <a onClick="return mV(\'Luk\',6,13);">Lu 6:13</a>; <a onClick="return mV(\'Luk\',9,1);">9:1</a>f). From a comparison of the Synoptics it would seem that the name as thus used was not a general designation for the Twelve, but had reference only to this particular mission, which was typical and prophetic, however, of the wider mission that was to come (compare Hort, Christian Ecclesia, 23-29). Luke, it is true, uses the word as a title for the Twelve apart from reference to the mission among the villages. But the explanation probably is, as Dr. Hort suggests, that since the Third Gospel and the Book of Acts formed two sections of what was really one work, the author in the Gospel employs the term in that wider sense which it came to have after the Ascension.<P>When we pass to Acts, "apostles" has become an ordinary name for the Eleven (<a onClick="return mV(\'Act\',1,2,26);">Ac 1:2, 26</a>), and after the election of Matthias in place of Judas, for the Twelve (<a onClick="return mV(\'Act\',2,37,42,43);">2:37, 42-43</a>, etc.). But even so it does not denote a particular and restricted office, but rather that function of a world-wide missionary service to which the Twelve were especially called. In His last charge, just before He ascended, Jesus had commissioned them to go forth into all the world and preach the gospel to every creature (<a onClick="return mV(\'Mat\',28,19,20);">Mt 28:19-20</a>; <a onClick="return mV(\'Mar\',16,15);">Mr 16:15</a>). He had said that they were to be His witnesses not only in Jerusalem and Judea, but in Samaria (contrast <a onClick="return mV(\'Mat\',10,5);">Mt 10:5</a>), and unto the uttermost part of the earth (<a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>). They were apostles, therefore, qua missionaries—not merely because they were the Twelve, but because they were now sent forth by their Lord on a universal mission for the propagation of the gospel.<P>2. Paul:<P>The very fact that the name "apostle" means what it does would point to the impossibility of confining it within the limits of the Twelve. (The "twelve apostles" of <a onClick="return mV(\'Rev\',21,14);">Re 21:14</a> is evidently symbolic; compare in 7:3ff the restriction of God\'s sealed servants to the twelve tribes.) Yet there might be a tendency at first to do so, and to restrict it as a badge of honor and privilege peculiar to that inner circle (compare <a onClick="return mV(\'Act\',1,25);">Ac 1:25</a>). If any such tendency existed, Paul effectually broke it down by vindicating for himself the right to the name. His claim appears in his assumption of the apostolic title in the opening words of most of his epistles. And when his right to it was challenged, he defended that right with passion, and especially on these grounds: that he had seen Jesus, and so was qualified to bear witness to His resurrection (<a onClick="return mV(\'1Cr\',9,1);">1Co 9:1</a>; compare <a onClick="return mV(\'Act\',22,6);">Ac 22:6</a>f); that he had received a call to the work of an apostle (<a onClick="return mV(\'Rom\',1,1);">Ro 1:1</a>; <a onClick="return mV(\'1Cr\',1,1);">1Co 1:1</a>, etc.; <a onClick="return mV(\'Gal\',2,7);">Ga 2:7</a>; compare <a onClick="return mV(\'Act\',13,2);">Ac 13:2</a>f; <a onClick="return mV(\'Act\',22,21);">22:21</a>); but, above all, that he could point to the signs and seals of his apostleship furnished by his missionary labors and their fruits (<a onClick="return mV(\'1Cr\',9,2);">1Co 9:2</a>; <a onClick="return mV(\'2Cr\',12,12);">2Co 12:12</a>; <a onClick="return mV(\'Gal\',2,8);">Ga 2:8</a>). It was by this last ground of appeal that Paul convinced the original apostles of the justice of his claim. He had not been a disciple of Jesus in the days of His flesh; his claim to have seen the risen Lord and from Him to have received a personal commission was not one that could be proved to others; but there could be no possibility of doubt as to the seals of his apostleship. It was abundantly clear that "he that wrought for Peter unto the apostleship of the circumcision wrought for (Paul) also unto the Gentiles" (<a onClick="return mV(\'Gal\',2,8);">Ga 2:8</a>). And so perceiving the grace that was given unto him, Peter and John, together with James of Jerusalem, recognized Paul as apostle to the Gentiles and gave him the right hand of fellowship (<a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>).<P>3. The Wider Circle:<P>It is sometimes said by those who recognize that there were other apostles besides the Twelve and Paul that the latter (to whom some, on the ground of <a onClick="return mV(\'1Cr\',15,7);">1Co 15:7</a>; <a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>, would add James the Lord\'s brother) were the apostles par excellence, while the other apostles mentioned in the New Testament were apostles in some inferior sense. It is hardly possible, however, to make out such a distinction on the ground of New Testament usage. There were great differences, no doubt, among the apostles of the primitive church, as there were among the Twelve themselves—differences due to natural talents, to personal acquirements and experience, to spiritual gifts. Paul was greater than Barnabas or Silvanus, just as Peter and John were greater than Thaddaeus or Simon the Cananean.<P>But Thaddaeus and Simon were disciples of Jesus in the very same sense as Peter and John; and the Twelve and Paul were not more truly apostles than others who are mentioned in the New Testament. If apostleship denotes missionary service, and if its reality, as Paul suggests, is to be measured by its seals, it would be difficult to maintain that Matthias was an apostle par excellence, while Barnabas was not. Paul sets Barnabas as an apostle side by side with himself (<a onClick="return mV(\'1Cr\',9,5);">1Co 9:5</a>f; <a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>; compare <a onClick="return mV(\'Act\',13,2);">Ac 13:2</a>f; <a onClick="return mV(\'Act\',14,4,14);">14:4, 14</a>); he speaks of Andronicus and Junias as "of note among the apostles" (<a onClick="return mV(\'Rom\',16,7);">Ro 16:7</a>); he appears to include Apollos along with himself among the apostles who are made a spectacle unto the world and to angels and to men (<a onClick="return mV(\'1Cr\',4,6,9);">1Co 4:6,9</a>); the natural inference from a comparison of <a onClick="return mV(\'1Th\',1,1);">1Th 1:1</a> with <a onClick="return mV(\'1Th\',2,6);">2:6</a> is that he describes Silvanus and Timothy as "apostles of Christ"; to the Philippians he mentions Epaphroditus as "your apostle" (<a onClick="return mV(\'Phl\',2,25);">Php 2:25</a> the Revised Version, margin), and to the Corinthians commends certain unknown brethren as "the apostles of the churches" and "the glory of Christ" (<a onClick="return mV(\'2Cr\',8,23);">2Co 8:23</a> the Revised Version, margin). And the very fact that he found it necessary to denounce certain persons as "false apostles, deceitful workers, fashioning themselves into apostles of Christ" (<a onClick="return mV(\'2Cr\',11,13);">2Co 11:13</a>) shows that there was no thought in the primitive church of restricting the apostleship to a body of 12 or 13 men. "Had the number been definitely restricted, the claims of these interlopers would have been self-condemned" (Lightfoot, Galatians, 97).<P>4. Apostles in Didache:<P>When we come to the Didache, which probably lies beyond the boundary-line of New Testament history, we find the name "apostles" applied to a whole class of nameless missionaries—men who settled in no church, but moved about from place to place as messengers of the gospel (chapter 11). This makes it difficult to accept the view, urged by Lightfoot (op. cit., 98) and Gwatkin (HDB, I, 126) on the ground of <a onClick="return mV(\'Luk\',24,48);">Lu 24:48</a>; <a onClick="return mV(\'Act\',1,8,22);">Ac 1:8, 22</a>; <a onClick="return mV(\'1Cr\',9,1);">1Co 9:1</a>, that to have seen the Lord was always the primary qualification of an apostle—a view on the strength of which they reject the apostleship of Apollos and Timothy, as being late converts to Christianity who lived far from the scenes of our Lord\'s ministry. Gwatkin remarks that we have no reason to suppose that this condition was ever waived unless we throw forward the Didache into the 2nd century. But it seems very unlikely that even toward the end of the 1st century there would be a whole class of men, not only still alive, but still braving in the exercise of their missionary functions all the hardships of a wandering and homeless existence (compare Didache 11:4-6), who were yet able to bear the personal testimony of eye-witnesses to the ministry and resurrection of Jesus. In <a onClick="return mV(\'Luk\',24,48);">Lu 24:48</a> and <a onClick="return mV(\'Act\',18,22);">Ac 18:22</a> it is the chosen company of the Twelve who are in view. In <a onClick="return mV(\'1Cr\',9,1);">1Co 9:1</a> Paul is meeting his Judaizing opponents on their own ground, and answering their insistence upon personal intercourse with Jesus by a claim to have seen the Lord. But apart from these passages there is no evidence that the apostles of the early church were necessarily men who had known Jesus in the flesh or had been witnesses of His resurrection—much less that this was the primary qualification on which their apostleship was made to rest.<P>5. The Apostleship:<P>We are led then to the conclusion that the true differentia of the New Testament apostleship lay in the missionary calling implied in the name, and that all whose lives were devoted to this vocation, and who could prove by the issues of their labors that God\'s Spirit was working through them for the conversion of Jew or Gentile, were regarded and described as apostles. The apostolate was not a limited circle of officials holding a well-defined position of authority in the church, but a large class of men who discharged one—and that the highest—of the functions of the prophetic ministry (<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>; <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>). It was on the foundation of the apostles and prophets that the Christian church was built, with Jesus Christ Himself as the chief corner-stone (<a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>). The distinction between the two classes was that while the prophet was God\'s spokesman to the believing church (<a onClick="return mV(\'1Cr\',14,4,22,25,30,31);">1Co 14:4, 22, 25, 30-31</a>), the apostle was His envoy to the unbelieving world (<a onClick="return mV(\'Gal\',2,7,9);">Ga 2:7, 9</a>).<P>The call of the apostle to his task might come in a variety of ways. The Twelve were called personally by Jesus to an apostolic task at the commencement of His earthly ministry (<a onClick="return mV(\'Mat\',10,1);">Mt 10:1</a>f parallel), and after His resurrection this call was repeated, made permanent, and given a universal scope (<a onClick="return mV(\'Mat\',28,19,20);">Mt 28:19-20</a>; <a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>). Matthias was called first by the voice of the general body of the brethren and thereafter by the decision of the lot (<a onClick="return mV(\'Act\',1,15,23,26);">Ac 1:15, 23, 26</a>). Paul\'s call came to him in a heavenly vision (<a onClick="return mV(\'Act\',26,\'17-19\');">Ac 26:17-19</a>); and though this call was subsequently ratified by the church at Antioch, which sent him forth at the bidding of the Holy Ghost (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>f), he firmly maintained that he was an apostle not from men neither through man, but through Jesus Christ and God the Father who raised Him from the dead (<a onClick="return mV(\'Gal\',1,1);">Ga 1:1</a>). Barnabas was sent forth (exapostello is the verb used) by the church at Jerusalem (<a onClick="return mV(\'Act\',11,22);">Ac 11:22</a>) and later, along with Paul, by the church at Antioch (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>); and soon after this we find the two men described as apostles (<a onClick="return mV(\'Act\',14,4);">Ac 14:4</a>). It was the mission on which they were sent that explains the title. And when this particular mission was completed and they returned to Antioch to rehearse before the assembled church "all things that God had done with them, and that he had opened a door of faith unto the Gentiles" (<a onClick="return mV(\'Act\',14,27);">Ac 14:27</a>), they thereby justified their claim to be the apostles not only of the church, but of the Holy Spirit.<P>The authority of the apostolate was of a spiritual, ethical and personal kind. It was not official, and in the nature of the case could not be transmitted to others. Paul claimed for himself complete independence of the opinion of the whole body of the earlier apostles (<a onClick="return mV(\'Gal\',2,6,11);">Ga 2:6,11</a>), and in seeking to influence his own converts endeavored by manifestation of the truth to commend himself to every man\'s conscience in the sight of God (<a onClick="return mV(\'2Cr\',4,2);">2Co 4:2</a>). There is no sign that the apostles collectively exercised a separate and autocratic authority. When the question of the observance of the Mosaic ritual by GentileChristians arose at Antioch and was referred to Jerusalem, it was "the apostles and elders" who met to discuss it (<a onClick="return mV(\'Act\',15,2,6,22);">Ac 15:2, 6, 22</a>), and the letter returned to Antioch was written in the name of "the apostles and the elders, brethren" (<a onClick="return mV(\'Act\',15,23);">Ac 15:23</a>).<P>In founding a church Paul naturally appointed the first local officials (<a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>), but he does not seem to have interfered with the ordinary administration of affairs in the churches he had planted. In those cases in which he was appealed to or was compelled by some grave scandal to interpose, he rested an authoritative command on some express word of the Lord (<a onClick="return mV(\'1Cr\',7,10);">1Co 7:10</a>), and when he had no such word to rest on, was careful to distinguish his own judgment and counsel from a Divine commandment (<a onClick="return mV(\'1Cr\',12,25,30);">1Co 12:25, 30</a>). His appeals in the latter case are grounded upon fundamental principles of morality common to heathen and Christian alike (<a onClick="return mV(\'1Cr\',5,1);">1Co 5:1</a>), or are addressed to the spiritual judgment (<a onClick="return mV(\'1Cr\',10,15);">1Co 10:15</a>), or are reinforced by the weight of a personal influence gained by unselfish service and by the fact that he was the spiritual father of his converts as having begotten them in Christ Jesus through the gospel (<a onClick="return mV(\'1Cr\',4,15);">1Co 4:15</a>f). It may be added here that the expressly missionary character of the apostleship seems to debar James, the Lord\'s brother, from any claim to the title. James was a prophet and teacher, but not an apostle. As the head of the church at Jerusalem, he exercised a ministry of a purely local nature. The passages on which it has been sought to establish his right to be included in the apostolate do not furnish any satisfactory evidence. In <a onClick="return mV(\'1Cr\',15,7);">1Co 15:7</a> James is contrasted with "all the apostles" rather than included in their number (compare <a onClick="return mV(\'1Cr\',9,5);">1Co 9:5</a>). And in <a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a> the meaning may quite well be that with the exception of Peter, none of the apostles was seen by Paul in Jerusalem, but only James the Lord\'s brother (compare the Revised Version, margin).<P>LITERATURE.<P>Lightfoot, Galatians, 92-101; Hort, Christian Ecclesia, Lect II; Weizsacker, The Apostolic Age, II, 291-99; Lindsay, The Church and the Ministry, 73-90.``94';
isbe[621]='Apostles\' Creed, the`kred.<P>The Oldest Creed:<P>The Apostles\' Creed is the oldest creed, and lies at the basis of most others. Though not, as the long-current legend of its origin affirmed, the direct work of the Apostles, it has its roots in apostolic times, and embodies, with much fidelity, apostolic teaching. It will be seen immediately that it had an important place in the early church, when as yet no creed but itself existed. The oldest usage of the term "Rule of Faith" (regula fidei), now commonly given to the Scriptures, has reference to this creed. It was the creed that could be appealed to as held by the church in all its great branches, and so as forming the test of catholicity. It was as resting on this creed that the church could be called "catholic and apostolic." Of late the creed has been the subject of great controversy, and violent attempts have been made to thrust out some of its chief articles from the Christian faith. This is a special reason for considering the foundations on which these articles of faith rest.<P>I. Form of the Creed.<P>In the first place, what is the creed? Here, first of all, it is to be pointed out that the received form of the creed is not its oldest or original form. The creed exists in two forms—a shorter and a longer; the former, known as the Old Roman Form, going back certainly as early as the middle of the 2nd century (about 140 AD), the latter, the enlarged form, in its present shape, of much later date. Its final form was probably given to it in South-Gaul not before the middle of the 5th century (in one or two clauses, as late as the 7th). It is desirable, at the outset, to put these two forms of the creed (in translation) clearly before the reader.<P>1. Old Roman Form:<P>First, the Old Roman Form is given from the Greek of Marcellus, of Ancyra, 341 AD. It runs thus: "I believe in God the Father Almighty. And in Jesus Christ His only (begotten) Son our Lord, who was born of the Holy Ghost and the Virgin Mary; crucified under Pontius Pilate, and buried; the third day He rose from the dead; He ascended into heaven, and sitteth at the right hand of the Father, from thence He shall come to judge the quick and the dead. And in the Holy Ghost; the holy Church; the forgiveness of sins; the resurrection of the body; (the life everlasting)."<P>The last clause is omitted in the Latin form preserved by Rufinus, 390 AD.<P>2. The Received Form:<P>The Received Form of the creed reads thus: "I believe in God the Father Almighty; Maker of Heaven and Earth; and in Jesus Christ His only (begotten) Son our Lord; who was conceived by the Holy Ghost, born of the Virgin Mary; suffered under Pontius Pilate, was crucified, dead, and buried; He descended into hell; the third day He rose from the dead; He ascended into heaven; and sitteth at the right hand of God the Father Almighty; from thence He shall come to judge the quick and the dead. I believe in the Holy Ghost; the holy catholic Church; the communion of saints; the forgiveness of sins; the resurrection of the body; and the life everlasting. Amen." Such is the form of the creed. Something must now be said of its origin and history.<P>II. Origin of the Creed.<P>The legend was that the creed took shape at the dictation of the Twelve Apostles, each of whom contributed a special article. Thus, Peter, it was alleged, under the inspiration of the Holy Ghost, commenced, "I believe in God the Father Almighty"; Andrew (or according to others, John) continued, "And in Jesus Christ, His only Son, our Lord"; James the elder went on, "Who was conceived by the Holy Ghost," etc. This legend is not older than the 5th or 6th centuries, and is absurd on the face of it.<P>1. Baptismal Confession:<P>The real origin of the creed has now been traced with great exactness. The original germ of it is to be sought for in the baptismal confession made by converts in the reception of that rite. The primitive confession may have contained no more than "I believe that Jesus is the Son of God," but we have evidence within the New Testament itself that it soon became enlarged. Paul speaks of the "form of teaching" delivered to converts (<a onClick="return mV(\'Rom\',6,17);">Ro 6:17</a>), and reminds Timothy of "the good (beautiful) confession" he had made in sight of many witnesses (<a onClick="return mV(\'1Ti\',6,12);">1Ti 6:12</a>). Similar language is used of Christ\'s confession before Pilate (<a onClick="return mV(\'1Ti\',6,13);">1Ti 6:13</a>). We may perhaps conjecture from the epistles that Timothy\'s confession contained references to God as the author of life, to Jesus Christ and His descent from David, to His witness before Pontius Pilate, to His being raised from the dead, to His coming again to judge the quick and the dead (<a onClick="return mV(\'1Ti\',6,13);">1Ti 6:13</a>; <a onClick="return mV(\'2Ti\',2,8);">2Ti 2:8</a>; <a onClick="return mV(\'2Ti\',4,1);">4:1</a>). Early Christian writers, as Ignatius (110 AD), and Aristides the apologist (circa 125 AD), show traces of other clauses.<P>2. "Rule of Faith":<P>In any case, the fact is certain that before the middle of the 2nd century the confession at baptism had crystallized into tolerably settled shape in all the greater churches. We have accounts given us of its contents (besides the Old Roman Form) in Irenaeus, Tertullian, Novatian, Origen, etc.; and they show substantial unity with a certain freedom of form in expression. But the form in the Roman church came gradually to be the recognized type. After the middle of the century, the confession rose to new importance as the result of the Gnostic controversies, and assumed more of the character of a formal creed. It came to be known as the "Rule of Truth," or "Rule of Faith," and was employed to check the license of interpretation of Scripture of these fantastic heretical speculators. The creed had originated independently of Scripture—in the early oral teaching and preaching of the apostles; hence its value as a witness to the common faith. But it was not used to supersede Scripture; it was held to corroborate Scripture, where men by their allegorical and other perversions sought to wrest Scripture from its real sense. It was employed as a check on those who sought to allegorize away the Christian faith.<P>III. History of the Creed.<P>1. The Roman Creed:<P>The Old Roman Form of the creed was, as said above, certainly in use by the middle of the 2nd century, in Rome; probably a considerable time before. We have it in both its Greek and Latin forms (the Greek being probably the original). The Latin form is given by Rufinus about 390 AD who compares it with the creed of his own church of Aquileia—a very old church. The Greek form is preserved by Marcellus, of Ancyra, in the 4th century. The old shorter form of the creed long maintained itself. We find it in England, e.g. up to nearly the time of the Norman Conquest (in 8th or 9th century manuscripts in British Museum).<P>2. The Received Creed:<P>The Received Form of the creed has a much more obscure history. The additional clauses came in at different times, though in themselves some of them are very old. The addition to the first article, e.g. "Maker of heaven and earth," first appears in this form in Gaul about 650 AD, though similar forms are found in much older creeds. Another addition, "He descended into hell," meets us first in Rufinus as part of the creed of Aquileia, but is probably also old in that church. It is known that the creed had assumed nearly its present shape (perhaps without the above clauses, and that on the communion of saints) by the time of Faustus of Reiz, about 460 AD. Thence it spread, and had reached Ireland apparently before the end of the 7th century. In England it appears a century later, about 850 AD (from the court of Charlemagne?), and from the beginning of the 10th century it largely superseded the older from. The same applies to other countries, so that the Gallican form is now the one in common use. Two significant changes may be noted in the form given to it. In England, whose form we follow, the Reformers substituted for "the resurrection of the flesh" the words, "the resurrection of the body," and in Germany the Lutherans change the word "catholic" to "Christian," in "the holy catholic Church."<P>IV. Structure of the Creed.<P>1. Its Trinitarian Form:<P>The Apostles\' Creed, it will be perceived, has no theological or metaphysical character. It is not only the oldest, but the simplest and least developed of all creeds. It is a simple enumeration, in order, of the great verities which the church was known to have held, and to have handed down from the beginning—which Scripture also taught. Originating from the baptismal confession, it naturally follows the Trinitarian order suggested by the customary formula for baptism. The first article declares belief in God the Father Almighty, Maker of heaven and earth. The second to the seventh articles declare belief in Jesus Christ, His only Son, our Lord, and in the great facts embraced in the gospel testimony regarding Him. The eighth article affirms belief in the Holy Ghost, to which are appended the additional clauses, declaring belief in the holy catholic church, the communion of saints, the forgiveness of sins, the resurrection of the flesh (body), and the life everlasting.<P>2. Creed of Apelles:<P>It will help to show the kind of heresies the church of that age had to contend with, and what the earnest struggles of the Fathers of the time (using the Apostles\' Creed as a bulwark), if we append here the Creed of Apelles, a 2nd-century Gnostic, as reconstructed by Principal Lindsay (The Church and the Ministry, 222) from Hippolytus: "We believe, that Christ descended from the Power above, from the Good, and that He is the Son of the Good; that He was not born of a virgin, and that when He did appear He was not devoid of flesh. That He formed His Body by taking portions of it from the substance of the universe, i.e. hot and cold, moist and dry; That He received cosmical powers in the Body, and lived for the time He did in the world; That He was crucified by the Jews and died; That being raised again after three days He appeared to His disciples; That He showed them the prints of the nails and (the wound) in His side, being desirous of persuading them that He was no phantom, but was present in the flesh; That after He had shown them His flesh He restored it to the earth; That after He had once more loosed the chains of His Body He gave back heat to what is hot, cold to what is cold, moisture to what is moist, and dryness to what is dry; That in this condition He departed to the Good Father, leaving the Seed of Life in the world for those who through His disciples should believe in Him."<P>V. Modern Controversies.<P>It was mentioned that of late the Apostles\' Creed has been the subject of many attacks and of keen controversies. In Germany, particularly, quite a fierce controversy broke out in 1892 over the refusal of a Lutheran pastor, named Schrempf, to use the creed in the administration of baptism. He did not believe in its articles about the virgin-birth of Christ, the resurrection of the flesh, etc. The offender was deposed, but a great battle ensued, giving rise to an enormous literature. The conflict has been overruled for good in leading to a more thorough examination than ever before of the history and meaning of the creed, but it has given precision also to the attacks made upon it. A leading part in this controversy was taken by Professor Harnack, of Berlin, whose objections may be regarded as representative. Professor Harnack, and those who think with him, criticize the creed from a twofold point of view:<P>(1) They deny that in all respects it represents true apostolical doctrine—this not only in its later articles, but even in such an article as that affirming the virgin-birth of Christ:<P>(2) They deny that the meaning we now put on many of the clauses of the creed is its true original meaning, i.e. we use the words, but with a different sense from the original framers.<P>Harnack\'s Criticism:<P>In considering these objections, it is always to be remembered that those who urge them do so from the standpoint of rejection of most that is usually considered essential to Christianity. There is in their view no incarnation, no real Godhead of Christ, no real miracle in His life (only faith-cures), no resurrection from Joseph\'s tomb. This no doubt takes the bottom from the Apostles\' Creed, but it takes the bottom also out of apostolic Christianity. Where Harnack, for instance, objects that "Father" and "Son" in the first and second articles of the creed have no Trinitarian reference, but relate only, the former to God\'s relation to creation, the latter, to Christ\'s historical appearance, the reply can only be the whole evidence in the New Testament for a Trinitarian distinction and for the essential Divinity of Christ. When it is declared that the virgin-birth is no part of the early Christian tradition, one can only appeal to the evidence of the fact in the Gospels, and recall that no section of the Christian church, except a heretical branch of the Ebionites, and some of the Gnostic sects, is known to have rejected it. (See <a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>.) For detailed replies to Harnack\'s criticisms, Dr. Swete\'s book on the Apostles\' Creed may be consulted.<P>LITERATURE.<P>A list of the voluminous pamphlet literature produced by the German controversy on the Apostles\' Creed may be seen in Nippold\'s Die theologische Einzelschule, II, 232-33. The most important contributions are those of Harnack (Das apostolische Glaubensbekenntniss, also English Translation); Kattenbusch, and Cremer. Compare also Schaff, Creeds of Christendom, I, 14-23; II, 45-55. Special works are: Pearson, Exposition of the Creed (1659); Kattenbusch, Das apostolische Symbolum, 2 volumes (1894-1900); Zahn, Das apostolische Syrnbolum (1893); English translation (1899); H. B. Swete, The Apostles\' Creed and Primitive Christianity (1894); A. C. McGiffert, The Apostles\' Creed, Its Origin, Its Purpose, and Its Historical Interpretation (1902).``132';
isbe[622]='Apostles, Gospel of the Twelve``<a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>`1';
isbe[623]='Apostolic Age`ap-os-tol\'-ik aj.<P>1. The Mission:<P>(1) When the disciples realized that they had seen the risen Christ for the last time and that it had now become their duty to spread His message, they gathered themselves together and restored the number of "witnesses" to the appointed Twelve. Immediately afterward the outpouring of the Holy Spirit gave them the signal to begin work. At first this work was rigidly centered in Jerusalem, and the first journeyings were the result of forcible dispersion and not of planned effort (<a onClick="return mV(\'Act\',11,19);">Ac 11:19</a>). But pilgrims to the feasts had carried away the gospel with them, and in this way Christianity had been spread at least as far as Damascus (<a onClick="return mV(\'Act\',9,2,19);">Ac 9:2, 19</a>). The dispersion itself widened the circle to Cyprus and to Antioch and marked the beginning of the Gentile work (<a onClick="return mV(\'Act\',11,\'19-20\');">Ac 11:19-20</a>). Here the extreme prominence of Paul\'s ministry in the New Testament should not obscure the success of the other missionaries.<P>When the apostles began their journeys we do not know but at the time of <a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a> only Peter represented the Twelve in Jerusalem. Paul mentions their extended work in <a onClick="return mV(\'1Cr\',9,5,6);">1Co 9:5-6</a> and it seems certain that Peter was in Rome shortly before his death. The troubles caused Paul by the Judaizers at least give evidence of the missionary zeal of the latter. Barnabas and Mark worked after their separation from Paul (<a onClick="return mV(\'Act\',15,39);">Ac 15:39</a>) and GentileChristianity existed in Rome long before the latter\'s arrival there (<a onClick="return mV(\'Rom\',1,13);">Ro 1:13</a>). By the year 100 it appears that Christianity extended around the Mediterranean from Alexandria to Rome (and doubtless farther, although data are scanty), while Asia Minor was especially pervaded by it.<P>(2) Many factors cooperated to help the work: Peace was universal and communication was easy. Greek was spoken everywhere. The protection given Judaism sheltered from civil interference. The presence of Judaism insured hospitality and hearers for at least the first efforts to convert. The Jews\' own proselytizing zeal (<a onClick="return mV(\'Mat\',23,15);">Mt 23:15</a>) had prepared Gentiles to receive Christianity. And not the least element was the break-up of the old religions and the general looking to the East for religious satisfaction.<P>(3) For the methods, Paul\'s procedure is probably typical. Avoiding the smaller places, he devoted himself to the cities as the strategic points and traveled in a direct route, without side-journeys. In this way a "line of fire" (Harnack) was traced, and the flame could be trusted to spread of its own accord to each side of the road. So as fruits of Paul\'s work at Ephesus there appear churches at Colosse and Laodicea some hundred and twenty miles away (<a onClick="return mV(\'Col\',2,1);">Col 2:1</a>; <a onClick="return mV(\'Col\',4,16);">4:16</a>). The churches founded needed revisiting and confirming, but when the apostle felt that they could shift for themselves, he felt also that his work in the East was over (<a onClick="return mV(\'Rom\',15,23);">Ro 15:23</a>).<P>2. Jerusalem Church:<P>The members of the earliest Jerusalem church thought of themselves simply as Jews who had a true understanding of the Messiah and so constituting a new "way" or "party" (hardly "sect") in Judaism (<a onClick="return mV(\'Act\',22,4);">Ac 22:4</a>, especially). At first they were suffered to grow unmolested and their right to exist was apparently unquestioned, for the Sadducean actions of <a onClick="return mV(\'Act\',4,1);">Ac 4:1</a>; <a onClick="return mV(\'Act\',5,17);">5:17</a> were in the nature of police precautions. And it is significant that the first attack was made on a foreigner, Stephen. He seems to have angered the crowds by preaching the impending destruction of the Temple, although he was martyred for ascribing (practically) Divine honors to Jesus (<a onClick="return mV(\'Act\',7,56);">Ac 7:56</a>). Yet the apostles were not driven from the city (<a onClick="return mV(\'Act\',8,1);">Ac 8:1</a>) and the church was able to continue its development. In 41 AD, the Roman representatives gave way to the Pharisaically inclined Agrippa I and (for reasons that are not clear) persecution broke out in which James was martyred and Peter delivered only by a miracle (<a onClick="return mV(\'Act\',12,\'1-\');">Ac 12</a>). With the resumption of Roman rule in 44 AD the persecution ceased.<P>Some peaceable mode of living was devised, as appears from the absence of further allusions to troubles (compare <a onClick="return mV(\'Act\',21,\'17-26\');">Ac 21:17-26</a>) and from the accounts of Josephus and Hegesippus of the esteem in which James the Lord\'s brother was held. His martyrdom (in 62 AD?) was due to the tension that preceded the final revolt against Rome, in which the Christians of Jerusalem took no part. Instead, they retired across the Jordan to Pella (<a onClick="return mV(\'Rev\',12,\'13-17\');">Re 12:13-17</a>), where they formed a close, intensely Jewish body under the rule of the descendants of Christ\'s brethren according to the flesh. Some mission work was done farther to the east but in the 2nd century they either were absorbed in normal Christianity or became one of the factors that produced Ebionism.<P>3. Judaists:<P>Many members of this body (and, doubtless, other Jewish Christians outside it) showed various degrees of inability to understand the Gentile work. The acceptance of an uncircumcised Christian as "saved" offered fairly slight difficulty (<a onClick="return mV(\'Gal\',2,3);">Ga 2:3</a>; <a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>). But to eat with him was another thing and one that was an offense to many who accepted his salvation (<a onClick="return mV(\'Gal\',2,12,13);">Ga 2:12-13</a>). The rigorous conclusion that the Law bound no Christian was still another thing and one that even James could not accept (<a onClick="return mV(\'Act\',21,21);">Ac 21:21</a>). At the time of <a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>, the "pillars" were as yet not thinking of doing Gentile work. Paul\'s controversies are familiar and probably the last friction did not end until the fall of Jerusalem. But the difficulties grew gradually less and 1 Peter is evidence that Peter himself finally accepted the full status of Gentiles.<P>4. Relations with Rome:<P>From the Roman power Christianity was safe at first, as the distinctions from Judaism were thought too slight to notice (<a onClick="return mV(\'Act\',18,\'14-16\');">Ac 18:14-16</a>; <a onClick="return mV(\'Act\',25,19);">25:19</a>). (Troubles such as those of <a onClick="return mV(\'Act\',17,9);">Ac 17:9</a> were due to disturbance of the peace.) So the government was thought of as a protector (<a onClick="return mV(\'2Th\',2,7);">2Th 2:7</a>) and spoken of in the highest terms (<a onClick="return mV(\'Rom\',13,1);">Ro 13:1</a>; <a onClick="return mV(\'1Pe\',2,13,14);">1Pe 2:13-14</a>). But, while absolute isolation was not observed (<a onClick="return mV(\'1Cr\',10,27);">1Co 10:27</a>), yet the Christians tended more and more to draw themselves into bodies with little contact with the world around them (<a onClick="return mV(\'1Pe\',4,\'3-5\');">1Pe 4:3-5</a>), so provoking suspicion and hostility from their neighbors. Hence they were a convenient scapegoat for Nero after the burning of Rome. It is uncertain how far his persecution spread or how far persecutions occurred from his time until the end of the reign of Domitian (see <a href="./study/isbe/search.html?string=PETER+THE+FIRST+EPISTLE+OF">PETER, THE FIRST EPISTLE OF</A>), but in Revelation, Rome has become the symbol for all that is hostile to Christ.<P>5. "Hellenism":<P>Influence of the "pagan" religions on Christianity is not very perceptible in the 1st century. But syncretism was the fashion of the day and many converts must have attempted to combine the new religion with views that they held already (or that they learned still later). Apparently little attention was paid to this attempt, if restricted to entirely minor details (<a onClick="return mV(\'1Cr\',15,29);">1Co 15:29</a>), but in <a onClick="return mV(\'Col\',2,\'8-23\');">Col 2:8-23</a> a vital matter is touched. The danger is more acute in the Pastorals (<a onClick="return mV(\'1Ti\',1,4);">1Ti 1:4</a>; <a onClick="return mV(\'1Ti\',4,3);">4:3</a>; <a onClick="return mV(\'Tts\',3,9);">Titus 3:9</a>) and in <a onClick="return mV(\'Rev\',2,\'1-\');">Re 2</a> great harm is being done. And Jude, 2 Peter, and 1 John contain direct polemics against the systems so arising, the beginnings of what in the 2nd century appeared as Gnosticism.<P>For further details see the separate articles, especially <a href="./study/isbe/search.html?string=MINISTRY">MINISTRY</A>; <a href="./study/isbe/search.html?string=NEW+TESTAMENT+CANON">NEW TESTAMENT CANON</A>; and (for life in the Apostolic Age) <a href="./study/isbe/search.html?string=SPIRITUAL+GIFTS">SPIRITUAL GIFTS</a>.<P>LITERATURE.<P>See the separate articles. Works with the title Apostolic Age are by Gilbert (brief), Bartlet (useful), Purves (very conservative), Ropes, McGiffert, and Weizsacker. The last three are for critical study.``48';

isbe[628]='Apostolical Council`ap-os-tol\'-i-kal koun\'-sil: The assembly of the apostles and elders held in Jerusalem (49 AD), an account of which is given in <a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>.``1';
isbe[629]='Apothecary`a-poth\'-e-ka-ri: Found in English Versions of the Bible eight times in the Old Testament and Apocrypha for Hebrew word rendered more accurately "perfumer" by the Revised Version (British and American) in <a onClick="return mV(\'Exd\',30,25,35);">Ex 30:25, 35</a>; <a onClick="return mV(\'Exd\',37,29);">37:29</a>; <a onClick="return mV(\'Ecc\',10,1);">Ec 10:1</a>; though inconsistently retained elsewhere (<a onClick="return mV(\'2Ch\',16,14);">2Ch 16:14</a> the English Revised Version; <a onClick="return mV(\'Neh\',3,8);">Ne 3:8</a> the English Revised Version (compare the margin); Sirach 38:8; 49:1).`<a href="./study/isbe/search.html?string=PERFUMER">PERFUMER</a>`1';
isbe[630]='Appaim`ap\'-aa-im, ap\'-a-im (appayim, "nostrils"): A son of Nadab of the house of Jerahmeel, of Judah (<a onClick="return mV(\'1Ch\',2,30);">1Ch 2:30</a>f).``1';
isbe[631]='Apparel`a-par\'-el: The English equivalent of six Hebrew and three Greek words, variously signifying all kinds of raiment, chiefly garments costly and beautiful: ornamental (<a onClick="return mV(\'2Sa\',1,24);">2Sa 1:24</a>); royal, as of Ahasuerus (<a onClick="return mV(\'Est\',6,8);">Es 6:8</a>), of Herod (<a onClick="return mV(\'Act\',12,21);">Ac 12:21</a>, esthes); of kings\' daughters (<a onClick="return mV(\'2Sa\',13,18);">2Sa 13:18</a>); priestly (<a onClick="return mV(\'Ezr\',3,10);">Ezr 3:10</a>); also mourning (<a onClick="return mV(\'2Sa\',14,2);">2Sa 14:2</a>). In <a onClick="return mV(\'1Sa\',17,38,39);">1Sa 17:38-39</a> "apparel" replaces "armor" of King James Version: "Saul clad David with his apparel," probably some close-fitting garment worn under the armor, or sometimes without it. Severe judgment was pronounced on Jewish princes who clothed themselves with "strange" (the King James Version), i.e. "with foreign apparel" (<a onClick="return mV(\'Zep\',1,8);">Ze 1:8</a>; compare <a onClick="return mV(\'Isa\',2,\'6-8\');">Isa 2:6-8</a>). "Modest apparel" as against "costly raiment" is commended as suited to Christians (<a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a>; himatismos, and katastole). Angels are robed in white apparel (<a onClick="return mV(\'Act\',1,10);">Ac 1:10</a>; compare <a onClick="return mV(\'Luk\',24,4);">Lu 24:4</a>, "dazzling"). Fig. of the glorious and red (suggestive of the wine-press) apparel of the Messiah (<a onClick="return mV(\'Isa\',63,1,2);">Isa 63:1-2</a>), and of "a meek and quiet spirit" (<a onClick="return mV(\'1Pe\',3,4);">1Pe 3:4</a>).``139';
isbe[632]='Apparently`a-par\'-ent-li (mar\'eh, the Revised Version (British and American) "manifestly," signifying in the only place so translated (<a onClick="return mV(\'Num\',12,8);">Nu 12:8</a>) "in the form of seeing" (Keil and Delitzsch), i.e. "an appearance," "a similitude," a manifestation of the invisible God in human form): This is the Old Testament manner of Divine revelation "in the person and form of the angel of Yahweh": "In the bush I did manifestly reveal myself, and talked with Moses" (2Esdras 14:3). God talked with Moses openly, without figure, in a direct manner revealing to him His will in the clear distinctness of a spiritual communication: "With him will I speak mouth to mouth, even manifestly, and not in dark speeches; and the form of Yahweh shall he behold."``91';
isbe[633]='Apparition`ap-a-rish\'-un (indalma, epiphaneia; phantasma): This word is not found in the Old Testament or New Testament canon, the King James Version or the American Standard Revised Version, but occurs twice in the Revised Version (British and American) and thrice in Apocrypha the King James Version as follows: The <span class="noTag">Wisdom of Solomon 17:3</span>, Greek indalma, the Revised Version (British and American) "spectral form"; 2Macc 3:24, Greek epiphaneia, the Revised Version (British and American) "apparition," the Revised Version, margin "manifestation"; 2Macc 5:4, Greek epiphaneia, the Revised Version (British and American) "vision," the Revised Version, margin "manifestation." New Testament, Revised Version: <a onClick="return mV(\'Mat\',14,26);">Mt 14:26</a>; <a onClick="return mV(\'Mar\',6,49);">Mr 6:49</a>; Greek phantasma, the American Standard Revised Version "ghost," the King James Version "Spirit."``1';
isbe[633]='Apparition`ap-a-rish\'-un (indalma, epiphaneia; phantasma): This word is not found in the Old Testament or New Testament canon, the King James Version or the American Standard Revised Version, but occurs twice in the Revised Version (British and American) and thrice in Apocrypha the King James Version as follows: The <span class="noTag">Wisdom of Solomon 17:3</span>, Greek indalma, the Revised Version (British and American) "spectral form"; 2Macc 3:24, Greek epiphaneia, the Revised Version (British and American) "apparition," the Revised Version, margin "manifestation"; 2Macc 5:4, Greek epiphaneia, the Revised Version (British and American) "vision," the Revised Version, margin "manifestation." New Testament, Revised Version: <a onClick="return mV(\'Mat\',14,26);">Mt 14:26</a>; <a onClick="return mV(\'Mar\',6,49);">Mr 6:49</a>; Greek phantasma, the American Standard Revised Version "ghost," the King James Version "Spirit."``1';
isbe[634]='Appeal`a-pel\': If an appeal be, as it properly is, a petition for the removal of a case that has been decided for rehearing and review and final decision by a higher court, we find no such instance either in the Old Testament or the New Testament.<P>In the institution of judges by Moses (<a onClick="return mV(\'Exd\',18,26);">Ex 18:26</a>), the reference: "The hard cases they brought unto Moses, but every small matter they judged themselves," indicates simply a distribution of cases between two courts, but gives no trace of any provision for the rehearing of any case, by a higher court, that has already been decided by a lower. In <a onClick="return mV(\'Deu\',17,\'8-13\');">De 17:8-13</a>, directions are given that a lower court, under certain conditions, shall ask a higher for instructions as to procedure, and shall strictly follow the order prescribed: nevertheless, the decision itself belongs to the lower court. When its sentence was once given, there was no appeal.<P>In the New Testament, the provision of the Roman law, for an appeal from a lower to a higher court, is clearly recognized, although the case of Paul in <a onClick="return mV(\'Act\',25,\'1-\');">Ac 25</a> does not strictly fall within its scope. The Roman law originally gave a citizen the right of appeal to the tribune of the people, but, with the establishment of the Empire, the emperor himself assumed this function of the tribune, and became the court of last resort. The case of Paul, however, had not been tried before Festus, nor any verdict rendered, when (<a onClick="return mV(\'Act\',25,10,11);">Ac 25:10-11</a>) he utters the proper legal formula: "I appeal unto Caesar" (Kaisara epikaloumai). That Roman citizens could insist upon such procedure, as right, is not perfectly certain (HJP, II, 2 279). Paul evidently acted upon the suggestion of the governor himself (<a onClick="return mV(\'Act\',25,9);">Ac 25:9</a>), who seems to have been desirous of avoiding the responsibility of a case involving questions most remote from his ordinary attention. At first sight, Paul\'s decision to appeal seems premature. He throws away his chance of acquittal by Festus, and acts upon the assumption that he has been already condemned. <a onClick="return mV(\'Act\',26,32);">Ac 26:32</a> shows that the possibility of his acquittal had amounted almost to a certainty. His course is explicable only by regarding his appeal the master stroke of a great leader, who was ready to take risks. In the proposition of Festus, he grasps at what had been an object of hope long deferred.<P>For many years, he had been desiring and praying to get to Rome (<a onClick="return mV(\'Act\',19,21);">Ac 19:21</a>; <a onClick="return mV(\'Rom\',1,11,15);">Ro 1:11, 15</a>; <a onClick="return mV(\'Rom\',15,23,24);">15:23-24</a>). The Lord had just assured him (<a onClick="return mV(\'Act\',23,11);">Ac 23:11</a>), that as he had testified at Jerusalem, "so must thou bear witness also at Rome." With this promise and direction in view, he hastens toward the world\'s capital and the center of the world\'s influence, in the seemingly precipitate words, "I appeal," which a lower order of prudence would have deferred until he had first been condemned.``84';
isbe[635]='Appear`a-per\': Of eight Hebrew originals the chief is ra\'ah, "to be seen." Used mainly of God\'s self-revelations in person and in dreams and visions: "Yahweh appeared unto Abram" (<a onClick="return mV(\'Gen\',12,7);">Ge 12:7</a>); to Moses (<a onClick="return mV(\'Exd\',3,2);">Ex 3:2</a>); to Solomon (<a onClick="return mV(\'1Ki\',3,5);">1Ki 3:5</a>). All originals used of Nature\'s processes, of the appearing, i.e. coming of the morning (<a onClick="return mV(\'Exd\',14,27);">Ex 14:27</a>); stars (<a onClick="return mV(\'Neh\',4,21);">Ne 4:21</a>); flowers, flocks of goats, tender grapes (<a onClick="return mV(\'Sgs\',2,12);">So 2:12</a>; <a onClick="return mV(\'Sgs\',4,1);">4:1</a> margin; <a onClick="return mV(\'Sgs\',7,12);">So 7:12</a> margin). So New Testament ophthen, passive of horao, "I see," "to be seen" used especially of angelic revelations and visions: as on the Mount of Transfiguration (<a onClick="return mV(\'Mat\',17,3);">Mt 17:3</a>); an angel (<a onClick="return mV(\'Luk\',1,11);">Lu 1:11</a>); the risen Lord (<a onClick="return mV(\'Luk\',24,34);">Lu 24:34</a>); cloven tongues at Pentecost (<a onClick="return mV(\'Act\',2,3);">Ac 2:3</a>); vision to Paul (<a onClick="return mV(\'Act\',16,9);">Ac 16:9</a>); a great wonder in heaven (<a onClick="return mV(\'Rev\',12,1);">Re 12:1</a>, the King James Version). opiano, in <a onClick="return mV(\'Act\',1,3);">Ac 1:3</a>, of Christ appearing after his suffering; phainomai, "to shine," like the above with the added thought of a resplendent, luminous revelation, as of the Bethlehem star (<a onClick="return mV(\'Mat\',2,7);">Mt 2:7</a>); the bringing to light of sin (<a onClick="return mV(\'Rom\',7,13);">Ro 7:13</a>, the King James Version). Also phaneroo, "to make manifest," used exclusively of the post-resurrection appearances and second coming of Christ and of the disclosures of the great judgment day. See <a onClick="return mV(\'Col\',3,4);">Col 3:4</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>; <a onClick="return mV(\'Rev\',3,18);">Re 3:18</a> and seven other passages the King James Version.``139';
isbe[636]='Appearance`a-per\'-ans (mar\'eh; chiefly used of the mystic and supernatural visions of Ezekiel and Daniel): A semblance, as of lightning, wheels, sapphire stone (<a onClick="return mV(\'Eze\',1,14,16,26);">Eze 1:14, 16, 26</a>); Gabriel\'s overpowering revelation (<a onClick="return mV(\'Dan\',8,15);">Da 8:15</a>; see also <a onClick="return mV(\'Dan\',10,6,18);">Da 10:6, 18</a>). In the New Testament refers exclusively, through three Greek words, prosopon, "sight," "countenance," to "outward appearance" (<a onClick="return mV(\'2Cr\',10,7);">2Co 10:7</a> the King James Version); and its possibly deceptive nature: opsis, "Judge not according to appearance." (<a onClick="return mV(\'Jhn\',7,24);">Joh 7:24</a>); "them that glory in appearance." (<a onClick="return mV(\'2Cr\',5,12);">2Co 5:12</a>; compare <a onClick="return mV(\'1Sa\',16,7);">1Sa 16:7</a>). See also <a onClick="return mV(\'1Th\',2,12);">1Th 2:12</a>, the English Revised Version, margin (eidos = "sight").``1';
isbe[637]='Appearing`a-per\'-ing (apokalupsis, "an unveiling"; epiphaneia, "a manifestation"): Exclusively technical, referring in the six passages where found to the return, the millennial advent of Christ (e.g. <a onClick="return mV(\'1Pe\',1,7);">1Pe 1:7</a>, the King James Version; <a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>; <a onClick="return mV(\'Tts\',2,13);">Tit 2:13</a>).``1';
isbe[638]='Appease`a-pez\': "To make one at peace." Esau is appeased, i.e. placated, won over by means of presents (<a onClick="return mV(\'Gen\',32,20);">Ge 32:20</a>). One "slow to anger appeaseth strife," i.e. puts an end to it (<a onClick="return mV(\'Pro\',15,18);">Pr 15:18</a>). the Revised Version (British and American) changes "appeased" of the King James Version in <a onClick="return mV(\'Act\',19,35);">Ac 19:35</a> into "quieted" (Greek katastello, "put down," "suppress," "restrain," referring to a popular commotion).``1';
isbe[639]='Appertain`ap-er-tan\': Only once in English Versions of the Bible, namely, in <a onClick="return mV(\'Jer\',10,7);">Jer 10:7</a>, for ya\'ah "it becometh," "it is seemly," Vulgate "Tuum est enim decus," "it is Thy honor." Generally in the sense of "to belong to" (<a onClick="return mV(\'Lev\',6,5);">Le 6:5</a>, "to whom it appertaineth"); <a onClick="return mV(\'Neh\',2,8);">Ne 2:8</a>, "the castle which appertained to the house" (Tobit 6:12; 1Esdras 8:95; 1Macc 10:42).``1';
isbe[640]='Appetite`ap\'-e-tit (chai, nephesh): This word occurs four times in Old Testament text and once in the King James Version margin. Once (<a onClick="return mV(\'Job\',38,39);">Job 38:39</a>) it is a translation of chai, "life"; "Canst thou...satisfy the appetite (life) of the young lions?" Twice (<a onClick="return mV(\'Pro\',23,2);">Pr 23:2</a>; <a onClick="return mV(\'Ecc\',6,7);">Ec 6:7</a>; also <a onClick="return mV(\'Isa\',56,11);">Isa 56:11</a>, the King James Version margin) it is a translation of nephesh: <a onClick="return mV(\'Pro\',23,2);">Pr 23:2</a>, ba\'al nephesh "a man given to appetite"; <a onClick="return mV(\'Ecc\',6,7);">Ec 6:7</a>, "the nephesh is not filled." In <a onClick="return mV(\'Isa\',56,11);">Isa 56:11</a>, "strong of nephesh" is translated "greedy." Nephesh means originally "breath," hence "the soul," psuche, "the vital principle," "life"; therefore in certain expressions referring to the sustaining of life the nephesh hungers (<a onClick="return mV(\'Pro\',10,3);">Pr 10:3</a>), thirsts (<a onClick="return mV(\'Pro\',25,25);">Pr 25:25</a>), fasts (<a onClick="return mV(\'Psa\',69,10);">Ps 69:10</a>). Nephesh then comes to mean the seat of the senses, affections, emotions, and to it is ascribed love, joy, desire (compare <a onClick="return mV(\'Deu\',12,20);">De 12:20</a>; <a onClick="return mV(\'Pro\',6,30);">Pr 6:30</a> the Revised Version, margin; <a onClick="return mV(\'Mic\',7,1);">Mic 7:1</a>, where the nephesh "desires"). The idea of desire or appetite of the nephesh may include all forms of longing; e.g. lust (<a onClick="return mV(\'Jer\',2,24);">Jer 2:24</a>; "her desire" is literally "the desire of her nephesh"), the appetite for revenge (<a onClick="return mV(\'Psa\',41,2);">Ps 41:2</a>, "the will of his enemies" is literally "the nephesh," etc.). The next step is to identify the nephesh with its desire, hence in the cases above nephesh is translated "appetite." In the 4th case (<a onClick="return mV(\'Isa\',29,8);">Isa 29:8</a>) "His soul hath appetite" is a free translation of naphsho shoqeqah, literally "His soul runneth to and fro."``78';
isbe[641]='Apphia`af\'-i-a, ap\'-fi-a (Apphia, dative case of Apphia; in <a onClick="return mV(\'Phm\',1,2);">Phm 1:2</a>, though Apphia, Amphia, and Appia, also occur): A Christian of Colosse, probably the wife of Philemon; certainly a member of his household, greeted as "the sister" the Revised Version, margin. In the Greek church, November 22 is sacred to her memory. It has been supposed, since this epistle concerns one household exclusively, that Apphia was Philemon\'s wife and the mother or sister of <a href="./study/isbe/search.html?string=ARCHIPPUS">ARCHIPPUS</a> (which see). She was stoned to death with Philemon, Onesimus, and Archippus in the reign of Nero. (See Lightfoot, Col., 372.)``1';
isbe[642]='Apphus`af\'-us, ap\'-fus: A name borne by Jonathan, the fifth son of Mattathias (Apphous, 1Macc 2:5). All the brothers, according to this passage, had double names; John is said to have been called Gaddis; Simon, Thassi; Judas, Maccabeus; Eleazar, Avaran; Jonathan, Apphus (1Macc 2:2-5). The latter were probably the names which Mattathias gave his sons, while the former were received later when they became "leaders of the people." The common explanation of the word "Apphus" relates it to the Syriac choppus, "the dissembler"; but Torrey (article "Maccabees," Encyclopedia Biblica) points out that we have no means of ascertaining with what guttural consonant the word began, or what Semitic consonant the Greek "s" represents. Both the form and meaning of the name are, therefore, still to be explained.``197';
isbe[643]='Appii Forum`ap\'-i-i fo\'-rum, transliteration of Lat; APPIUS ap\'-i-us, MARKET OF (Revised Version) (Appiou phoron): Appi Forum Cicero ad Att. 2.10; Suetonius Tib. 2: Appii Forum; Vulgate Revised Verson: Forum Appi; Horace Satires i.5; Pliny, Nat. Hist., iii.64; xiv.61; CIL, X,6824,or Market of Appius, was a town situated at the forty-third milestone on the Appian Road (39 1/2 English miles from Rome, a single day\'s journey for energetic travelers) according to the imperial itineraries (Ant., 108; Hierosol. 611; Geog. Rav. 4.34). Its existence probably dates from the time of Appius Claudius Caecus (Suet. Tib. 2; compare Mommsen, Rom. Forsch., I, 308), who laid out the famous highway from Rome to Capua in 312 BC. In the 1st century it had the rank of a municipality (Pliny, iii.64). Its importance as a highway station is due chiefly to the canal which ran by the side of the road from there to within a short distance of Tarracina (at the sixty-second milestone), affording an alternative means of conveyance (Strabo v.3.6). It was customary to cover this section of the journey, passing through the Pontine Marshes, by night in canal boats drawn by mules. Horace (Sat. i.5) offers a lively picture of the discomforts of the trip, mentioning the importunate inn-keepers and intolerable drinking water at Appii Forum, the gnats and frogs which were enemies to repose, and the exasperating procrastination of the muleteer.<P>The Christian brethren in Rome went out along the Appian Road to welcome the apostle Paul upon hearing of his arrival at Puteoli. One party awaited him at Three Taverns while another proceeded as far as Appii Forum <a onClick="return mV(\'Act\',28,15);">Ac 28:15</a>).``3';
isbe[644]='Apple, of the Eye`ap\'-\'-l: The eyeball, or globe of the eye, with pupil in center, called "apple" from its round shape. Its great value and careful protection by the eyelids automatically closing when there is the least possibility of danger made it the emblem of that which was most precious and jealously protected. The Hebrew terms for it were, \'ishon, diminutive of \'ish, "man," little man or mannikin, referring perhaps specially to the pupil, probably from "the little image one sees of himself when looking into another\'s pupil" (Davies\' Lexicon). "He kept him (Israel) as the apple of his eye" (<a onClick="return mV(\'Deu\',32,10);">De 32:10</a>); "Keep me as the apple of the eye," literally, "as the apple, the daughter of the eye" (<a onClick="return mV(\'Psa\',17,8);">Ps 17:8</a>). "Keep my law (the Revised Version, margin "teaching") as the apple of thine eye" (<a onClick="return mV(\'Pro\',7,2);">Pr 7:2</a>). Compare <a onClick="return mV(\'Pro\',7,9);">Pr 7:9</a> where it is used to denote what is the center (American Revised Version, "in the middle of the night"; the English Revised Version "in, the blackness of night"; margin "Hebrew pupil (of the eye)"); babhah perhaps an "opening," "gate"; others regard it as a mimetic word akin to Latin pupa, papilla ("He that toucheth you toucheth the apple of his eye," i.e. Yahweh\'s; <a onClick="return mV(\'Zec\',2,8);">Zec 2:8</a>); bath-\'ayin, "daughter of the eye"; "Give thyself no respite, let not the apple of thine eye cease" (<a onClick="return mV(\'Lam\',2,18);">La 2:18</a>), which means, either "sleep not," or "cease not to weep." kore, "young girl," "pupil of the eye": "He (the Lord) will keep the good deeds (the Revised Version (British and American) "bounty") of a man as the apple of the eye" (Ecclesiasticus 17:22); the Septuagint also has kore in all instances except <a onClick="return mV(\'Lam\',2,18);">La 2:18</a>, where it has thugater, "daughter."``185';
isbe[645]='Apple; Apple-Tree`ap\'-l ap\'-l tre, (tappuach): A fruit tree and fruit mentioned chiefly in Canticles, concerning the true nature of which there has been much dispute.<P><a onClick="return mV(\'Sgs\',2,3);">So 2:3</a> says: "As the apple-tree among the trees of the wood, so is my beloved among the sons. I sat down under his shadow with great delight"; <a onClick="return mV(\'Sgs\',8,5);">So 8:5</a>: "Under the apple-tree I awakened thee: there thy mother was in travail with thee, there was she in travail that brought thee forth." Of the fruit it is said, <a onClick="return mV(\'Sgs\',2,3);">So 2:3</a>: "His fruit was sweet to my taste"; <a onClick="return mV(\'Sgs\',2,5);">So 2:5</a>: "Stay ye me with raisins, refresh me with apples"; <a onClick="return mV(\'Sgs\',7,8);">So 7:8</a>: "the smell of thy breath (Hebrew "nose") like apples."<P>In all the above references the true apple, Pyrus malus, suits the conditions satisfactorily. The apple tree affords good shade, the fruit is sweet, the perfume is a very special favorite with the people of the East. Sick persons in Palestine delight to hold an apple in their hands, simply for the smell. (Compare Arabian Nights, "Prince Hassan and the Paribanou.") Further the Arabic for apple tuffah is without doubt identical with the Hebrew tappuach. The apple was well known, too, in ancient times; it was, for example, extensively cultivated by the Romans.<P>The one serious objection is that apples do not easily reach perfection in Palestine; the climate is too dry and hot; farther north in the Lebanon they flourish. At the same time it is possible to exaggerate this objection, for with careful grafting and cultivation exceedingly good apples may be produced in the mountain regions. Apple trees there need special care and renewal of the grafts, but there is no impossibility that at the time of the writing of Canticles skilled gardeners should have been able to produce sweet and perfumed apples in Palestine. Small but very sweet and fragrant apples are now grown at Gaza. Good apples are now plentiful in the market at Jerusalem, but they are chiefly importations from the north.<P>On account of the above difficulty three other fruits have been suggested by various writers. Two doubtless have been brought forward with a view to <a onClick="return mV(\'Pro\',25,11);">Pr 25:11</a>: "A word fitly spoken is like apples of gold in network of silver," but the reference would certainly seem to be to some silver filigree work ornamented with gold modeled to look like fruit rather than to any actual fruit. The citron and the apricot (Tristram) have both been suggested as the true tappuach. The former, which is a native of Persia, does not appear to have been introduced into Palestine until well into the Christian era and the apricot, though an attractive substitute for the apple and today one of the most beautiful and productive of fruit trees, can hardly have been established in Palestine at the time of the scriptural references. It is a native of China and is said to have first begun to find its way westward at the time of Alexander the Great.<P>The third of the fruits is the quince, Cydonia vulgaris (Natural Order Rosaceae), and this had more serious claims. It flourishes in Palestine and has been long indigenous there. Indeed it is probable that even if tappuach was a name for apple, it originally included also the closely allied quince. The greatest difficulty is its harsh and bitter taste. Further the Mishna distinguishes the tappuach from the quince, which is called parish, and from the crab apple or chazor (Kohler in Jewish Encyclopedia, II, 23). The quince along with the apple was sacred to Aphrodite, the goddess of love.<P>On the whole there does not appear to be any sufficient reason for rejecting the translation of the King James Version and the Revised Version (British and American); the Biblical references suit it; the identity of the Hebrew and Arabic words favor it and there is no insuperable objection on scientific grounds. The word tappuach appears in two place names, <a href="./study/isbe/search.html?string=BETH-TAPPUAH">BETH-TAPPUAH</a> and <a href="./study/isbe/search.html?string=TAPPUAH">TAPPUAH</a> (which see).``117';
isbe[646]='Apples of Sodom`sod\'-um: Josephus (BJ, IV, viii, 4) says that "the traces (or shadows) of the five cities (of the plain) are still to be seen, as well as the ashes growing in their fruits, which fruits have a color as if they were fit to be eaten; but if you pluck them with your hands they dissolve into smoke and ashes." What this "Dead Sea fruit" is, is uncertain. The name "Dead Sea apples" is often given to the fruit of the Solanum Sodomaean "a prickly shrub with fruit not unlike a small yellow tomato." Cheyne thinks that the fruits referred to by Josephus (compare Tacitus Hist. v.37) may be either<P>(1) those of the \'osher tree (\'usar, Calotropis procera, described by Hasselquist (Travels, 1766)), found in abundance about Jericho and near the Dead Sea, which are filled with dust when they have been attacked by an insect, leaving the skin only entire, and of a beautiful color. Tristram describes the fruit as being "as large as an apple of average size, of a bright yellow color, hanging three or four together close to the stem"; or as suggested by Tristram<P>(2) those of the wild colocynth; the fruit is fair of aspect with a pulp which dries up into a bitter powder (EB, article "Sodom," col. 4669, note 2). This colocynth is supposed to be the "wild vine" mentioned <a onClick="return mV(\'2Ki\',4,39);">2Ki 4:39</a>. The "vine of Sodom" of <a onClick="return mV(\'Deu\',32,32);">De 32:32</a> has been supposed to bear the "Dead Sea fruit"; but most modern writers regard the passage as figurative.``185';
isbe[647]='Apply`a-pli\': Purely an Old Testament term representing five Hebrew originals which signify respectively, "to enter," "to incline," "to give," "to go about," "to put or place," in each instance spoken of the heart in its attitude to wisdom (<a onClick="return mV(\'Psa\',90,12);">Ps 90:12</a> the King James Version); instruction (<a onClick="return mV(\'Pro\',23,12);">Pr 23:12</a>); understanding (<a onClick="return mV(\'Pro\',2,2);">Pr 2:2</a>); knowledge (<a onClick="return mV(\'Pro\',22,17);">Pr 22:17</a>).``1';
isbe[648]='Appoint`a-point\': This word is used for the expression of a large variety of ideas and the translation of almost as many words. naqabh = "stipulate" (<a onClick="return mV(\'Gen\',30,28);">Ge 30:28</a>). paqadh = "put into office" (<a onClick="return mV(\'Gen\',41,34);">Ge 41:34</a>; <a onClick="return mV(\'Num\',1,50);">Nu 1:50</a>; <a onClick="return mV(\'Est\',2,3);">Es 2:3</a>); "select" (<a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a>); "put in charge" (<a onClick="return mV(\'Jer\',49,19);">Jer 49:19</a>; <a onClick="return mV(\'Jer\',50,44);">50:44</a>); "assign" (<a onClick="return mV(\'Num\',4,27);">Nu 4:27</a>; <a onClick="return mV(\'Jer\',15,3);">Jer 15:3</a>); "send" (<a onClick="return mV(\'Lev\',26,16);">Le 26:16</a>); "designate," "select" (<a onClick="return mV(\'Exd\',21,13);">Ex 21:13</a>; <a onClick="return mV(\'Num\',4,19);">Nu 4:19</a>; <a onClick="return mV(\'2Sa\',7,10);">2Sa 7:10</a>; <a onClick="return mV(\'Isa\',61,3);">Isa 61:3</a>); "single out" (<a onClick="return mV(\'1Sa\',8,11,12);">1Sa 8:11-12</a>; <a onClick="return mV(\'Hsa\',1,11);">Ho 1:11</a>). nathan = "designate," "select" (<a onClick="return mV(\'Num\',35,6);">Nu 35:6</a> the King James Version; <a onClick="return mV(\'Jos\',20,2);">Jos 20:2</a> the King James Version; <a onClick="return mV(\'Eze\',45,6);">Eze 45:6</a>); "set aside" (<a onClick="return mV(\'Exd\',30,16);">Ex 30:16</a>). shith = "designate," "select" (<a onClick="return mV(\'Job\',14,13);">Job 14:13</a>; <a onClick="return mV(\'Isa\',26,1);">Isa 26:1</a>). So also \'amadh (<a onClick="return mV(\'1Ch\',15,16);">1Ch 15:16</a>; <a onClick="return mV(\'Neh\',7,3);">Ne 7:3</a>); so shalach (<a onClick="return mV(\'1Ki\',5,9);">1Ki 5:9</a>); qarah (<a onClick="return mV(\'Num\',35,11);">Nu 35:11</a>). tsawah = "choose" (<a onClick="return mV(\'2Sa\',6,21);">2Sa 6:21</a>). bachar = "select" (<a onClick="return mV(\'2Sa\',15,15);">2Sa 15:15</a> the King James Version). \'amar = "command" (<a onClick="return mV(\'1Ki\',5,6);">1Ki 5:6</a> the King James Version). tithemi = "designate," "select" (<a onClick="return mV(\'Mat\',24,51);">Mt 24:51</a>; <a onClick="return mV(\'Luk\',12,46);">Lu 12:46</a>). A careful reading of the above passages will bring to mind the doctrine that with reference to the world\'s work, God Himself calls men into office, selecting them from among the multitude and setting them aside for His special purposes; and that He calls to His assistance not only men but also events and forces of Nature (<a onClick="return mV(\'Lev\',26,16);">Le 26:16</a>).``77';
isbe[649]='Apprehend`ap-re-hend\': Occurs in the New Testament in two meanings: "to arrest" (piazo; <a onClick="return mV(\'Act\',12,4);">Ac 12:4</a>; <a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a> the Revised Version (British and American), "take"); and "to seize," "grasp," "take into one\'s possession," "attain," "inquire eagerly" (katalambano, the American Standard Revised Version "laid hold on," "laid fast hold of," <a onClick="return mV(\'Phl\',3,12,13);">Php 3:12-13</a>; <a onClick="return mV(\'Eph\',3,18);">Eph 3:18</a>). In <a onClick="return mV(\'Jhn\',1,5);">Joh 1:5</a>, "The darkness apprehended it not," the Revised Version, margin gives "overcame not."`<a href="./study/isbe/search.html?string=COMPREHEND">COMPREHEND</a>`1';
isbe[650]='Approve`a-proov\': This word, as ordinarily used, means "to entertain a favorable opinion concerning" (<a onClick="return mV(\'Psa\',49,13);">Ps 49:13</a>; <a onClick="return mV(\'Lam\',3,36);">La 3:36</a>). Its Biblical and archaic use conveys a much stronger meaning and is equivalent to its use in legal formalities of today, "to approve a bill," i.e. by some act, generally a signature, to express approval. In New Testament, a number of times, for Greek dokimazo, "to test, try, make proof of," and its derivative, dokimos, "tested," "tried." The word will, in almost every ease, imply that the proof is victoriously demonstrated, the proved is also approved, just as in English we speak of "tried men" (Trench, Greek Synonyms of New Testament). It is the word most frequently used for the testing of ores. That which does not stand the test is adokimos, "reprobate." Compare <a onClick="return mV(\'Jer\',6,30);">Jer 6:30</a> King James Version: "reprobate silver." That which stands the test is dokimos, "approved." "Salute Apelles the approved in Christ" (<a onClick="return mV(\'Rom\',16,10);">Ro 16:10</a>); "they that are approved" (<a onClick="return mV(\'1Cr\',11,19);">1Co 11:19</a>); "Present thyself approved unto God" (<a onClick="return mV(\'2Ti\',2,15);">2Ti 2:15</a>); when he hath been "approved" (<a onClick="return mV(\'Jam\',1,12);">Jas 1:12</a>). See also <a onClick="return mV(\'Rom\',14,18,22);">Ro 14:18, 22</a>; <a onClick="return mV(\'1Th\',2,4);">1Th 2:4</a>.``84';
