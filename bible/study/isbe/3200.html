f sources we see from the fact that in Exodus the distribution of the different portions and verses between P and E becomes a matter of doubt, and also in <a onClick="return mV(\'Exd\',16,\'1-\');">Ex 16</a> a harmony of view has not been gained as to whether only the Priestly Code (P), or in addition also J, E or JE have contributed to the text. The hymn found in <a onClick="return mV(\'Exd\',15,1);">Ex 15:1</a>ff, which certainly is an old composition, presupposes passages which are assigned to different sources, and in this way speaks for the unity of the text. Compare <a onClick="return mV(\'Exd\',15,2);">15:2</a> with <a onClick="return mV(\'Exd\',14,30);">14:30</a> J; <a onClick="return mV(\'Exd\',14,13);">14:13</A> JE (?); <a onClick="return mV(\'Exd\',15,3);">15:3</a> with <a onClick="return mV(\'Exd\',14,14);">14:14</a> JE (?); <a onClick="return mV(\'Exd\',14,25);">14:25</a> J; <a onClick="return mV(\'Exd\',14,4);">14:4a</a> with <a onClick="return mV(\'Exd\',14,9);">14:9</a> P; <a onClick="return mV(\'Exd\',14,4);">14:4b</a> with <a onClick="return mV(\'Exd\',14,7);">14:7</A> JE; <a onClick="return mV(\'Exd\',14,8);">14:8</a> with <a onClick="return mV(\'Exd\',14,22);">14:22</a> EP; <a onClick="return mV(\'Exd\',14,29);">14:29</a> P; with <a onClick="return mV(\'Exd\',14,9);">14:9</A>. On the other hand, <a onClick="return mV(\'Exd\',14,19);">Ex 14:19</a> a and b cannot be utilized in favor of a division of sources E and J; but rather the analogous structure of this passage presupposes the same author, and there is only indicated what elsewhere is always a presupposition, namely, that God Himself has taken His abode somewhere in the cloud of fire (<a onClick="return mV(\'Exd\',13,21,22);">13:21,22</A> JE; <a onClick="return mV(\'Exd\',14,24);">14:24</A> J; compare <a onClick="return mV(\'Exd\',40,34);">40:34</a>ff P). Just as little are the two commands found in <a onClick="return mV(\'Exd\',14,16);">14:16</A> to be divided between P and E and J, one stating what Moses does, and the other what Yahweh does, since both rather belong together (compare <a onClick="return mV(\'Exd\',9,22);">9:22</a>f with <a onClick="return mV(\'Exd\',9,33);">9:33</A>; <a onClick="return mV(\'Exd\',10,13);">10:13</A>). At first glance <a onClick="return mV(\'Exd\',16,6);">16:6</a>ff does not appear to be in its proper place, as Moses and Aaron in <a onClick="return mV(\'Exd\',16,6,7);">16:6,7</a> have already told Israel what only in <a onClick="return mV(\'Exd\',16,9);">16:9</a>ff is revealed through the appearance of Yahweh and His injunction to Moses. But these very verses are in harmony with the character of the whole section (compare under a above), since it is here stated that under all circumstances Israel is to be convinced of this, that Yahweh has proven Himself to be Yahweh, and has heard their murmuring. In addition, the appearance of Yahweh in <a onClick="return mV(\'Exd\',16,10);">16:10</a> is clearly announced by <a onClick="return mV(\'Exd\',16,7);">16:7</a>. Accordingly, <a onClick="return mV(\'Exd\',16,9);">16:9</a>ff serve only to confirm and strengthen what is found in <a onClick="return mV(\'Exd\',16,6);">16:6</a>ff. The fact that not until in <a onClick="return mV(\'Exd\',18,2);">18:2</a> JE Jethro brings the wife and the sons of Moses, while the latter himself according to <a onClick="return mV(\'Exd\',4,20);">4:20</a> J had taken them along when he joined Israel, finds a satisfactory explanation in <a onClick="return mV(\'Exd\',18,2);">18:2b</A>. He sent them back doubtless because of the conduct of Zipporah on the occasion of the circumcision of her son (<a onClick="return mV(\'Exd\',4,25);">4:25</a> J). The fact that Jethro comes to Moses at the Mount of God (<a onClick="return mV(\'Exd\',18,5);">18:5</a> JE), while the latter does not arrive at Mt. Sinai until <a onClick="return mV(\'Exd\',19,1);">19:1</a>ff according to P and J, is no contradiction; for by the Mount of God is meant the whole chain of Horeb, which Moses has already reached according to <a onClick="return mV(\'Exd\',17,6);">17:6</a> JE; but Mt. Sinai is a single mountain. The special legal ordinances and decisions mentioned in <a onClick="return mV(\'Exd\',18,20);">18:20</a> JE before the giving of the law (<a onClick="return mV(\'Exd\',19,\'1-\');">19</a>ff E and JE) are in perfect harmony with <a onClick="return mV(\'Exd\',15,25);">15:25</a> D; <a onClick="return mV(\'Exd\',16,4);">16:4</a> JE (?); <a onClick="return mV(\'Exd\',16,28);">16:28</a> R.<P>(4) <span class="noTag">Exodus 19:1-24:18a</span>:<P>(a) This fourth section contains the conclusion of the covenant at Mt. Sinai (compare <a onClick="return mV(\'Exd\',19,5);">19:5</a> R at beginning; <a onClick="return mV(\'Exd\',24,7,8);">24:7,8</a> JE toward the end). The contents cover a period of ten days (compare <a onClick="return mV(\'Exd\',19,10,11,16);">19:10,11,16</a>; <a onClick="return mV(\'Exd\',24,3,4);">24:3,4</a> JE; <a onClick="return mV(\'Exd\',24,16);">24:16</a> P). The text of this section can again be divided into ten pericopes. After the introduction (<a onClick="return mV(\'Exd\',19,\'1-8\');">19:1-8</a>), which contains a cardinal feature of Exodus (compare under I, 2 above), nos. 1 and 2 (<a onClick="return mV(\'Exd\',19,\'9-19\');">19:9-19</a>, <a onClick="return mV(\'Exd\',19,\'20-25\');">20-25</a>) report the preparation for the conclusion of the Covenant. No. 2</a> in <a onClick="return mV(\'Exd\',19,23);">Ex 19:23</a> refers expressly to no. 1, but is distinguished from no. 1 through the new addition in <a onClick="return mV(\'Exd\',19,20);">19:20</a> after <a onClick="return mV(\'Exd\',19,18);">19:18</a>, as also through the express amplified application of the ordinances referring to purifications and the restriction of the prohibition to the priests (compare <a onClick="return mV(\'Exd\',19,22);">19:22</a>, <a onClick="return mV(\'Exd\',19,21);">21</a>, <a onClick="return mV(\'Exd\',19,24);">24</a> with <a onClick="return mV(\'Exd\',19,10,12);">19:10,12</A>). Nos. 3 and 4 (<a onClick="return mV(\'Exd\',20,\'1-17\');">Ex 20:1-17</a>, <a onClick="return mV(\'Exd\',20,\'18-26\');">18-26</a>) contain the Decalogue and the directions for the cults, together with a description of the impression made by the revelation of the law. Nos. 5 and 6 (<span class="noTag">Ex 21:1-23:13</span> expressly circumscribed by a subscription, <a onClick="return mV(\'Exd\',23,\'14-19\');">EX 23:14-19</a>) contain legal ordinances and further directions for the cults. Nos. 3-6</a> accordingly contain the laws or the conditions of the Covenant. Now follow in nos. 7 and 8 the promises of the Covenant (<a onClick="return mV(\'Exd\',23,\'20-26\');">Ex 23:20-26</a>, <a onClick="return mV(\'Exd\',23,\'27-33\');">27-33</a>), which in verses <a onClick="return mV(\'Exd\',23,20);">20</a> and <a onClick="return mV(\'Exd\',23,27);">27</a>, <a onClick="return mV(\'Exd\',23,23);">23</a> and <a onClick="return mV(\'Exd\',23,28);">28</a> and <a onClick="return mV(\'Exd\',23,24);">24</a> and <a onClick="return mV(\'Exd\',23,32);">32</a>f correspond to each other. Nos. 9 and 10 (<a onClick="return mV(\'Exd\',24,\'3-8\');">Ex 24:3-8</a>, <a onClick="return mV(\'Exd\',24,\'9-18\');">9-18a</a>, combined more closely by <a onClick="return mV(\'Exd\',24,1,2);">Ex 24:1-2</a>) describe the conclusion of the Covenant and the Covenant congregation in different stages. Further, typical numbers at this place also appear in the laws, Nos. 3-6. No. 4 (<a onClick="return mV(\'Exd\',20,18);">Ex 20:18</a>ff) contains five directions (<a onClick="return mV(\'Exd\',20,\'23-26\');">Ex 20:23-26</a>); No. 6 (<a onClick="return mV(\'Exd\',23,\'14-19\');">Ex 23:14-19</a>) is divided into 2 X 5 ordinances (compare the anaphoristic addition in <a onClick="return mV(\'Exd\',23,14);">Ex 23:14</a> and <a onClick="return mV(\'Exd\',23,17);">17</a>), namely, verses <a onClick="return mV(\'Exd\',23,14);">Ex 23:14</a>, <a onClick="return mV(\'Exd\',23,15);">15a</a>, <a onClick="return mV(\'Exd\',23,15);">15b</a>, <a onClick="return mV(\'Exd\',23,16);">16a</a>, <a onClick="return mV(\'Exd\',23,\'16-19\');">16b-17,18a, 18b, 19a, 19b</a>. No. 3 (<a onClick="return mV(\'Exd\',20,1);">Ex 20:1</a>ff, the Decalogue) contains, according to <a onClick="return mV(\'Exd\',34,28);">Ex 34:28</a>; <a onClick="return mV(\'Deu\',4,13);">De 4:13</a>; <a onClick="return mV(\'Deu\',10,4);">10:4</a>, "ten words" margin, according to the two tables doubtless divided into two groups of five each, no matter how in detail we may divide and number them. In the same way no. 5 (21:1-23:13) falls into ten sections, separate in form and contents, yet belonging together; and these again are divided into 2 X 5 groups, as will appear presently. Taken altogether then we have in nos. 3-6</a> (<span class="noTag">Ex 20:1-23:19</span>) 17 X 5 legal ordinances or groups of laws. While in the historical sections the divisions into 5 X 2 pericopes was made, we here find three times the division into 2 X 5, although here too the beginning of the last five pericopes in the second and third sections is particularly noticeable (compare <a onClick="return mV(\'Exd\',9,8);">Ex 9:8</a> and <a onClick="return mV(\'Exd\',16,1);">Ex 16:1</a>), and in the same way a new division can be made at <a onClick="return mV(\'Exd\',4,18);">Ex 4:18</a>. No. 5</a> (<span class="notag">Ex 21:1-23:13</span>) is, however, divided as follows: I and II (<a onClick="return mV(\'Exd\',21,\'2-6\');">Ex 21:2-6</a>, <a onClick="return mV(\'Exd\',21,\'7-11\');">7-11</a>) ordinances for the protection of slaves; III and IV (<a onClick="return mV(\'Exd\',21,\'12-17\');">Ex 21:12-17</a>, <a onClick="return mV(\'Exd\',21,\'18-27\');">18-27</a>) protection of life, or liberty, of the dignity of parents, and hygienic laws; V (<a onClick="return mV(\'Exd\',21,28);">Ex 21:28-22:3</a>) harm to animals; VI (<a onClick="return mV(\'Exd\',22,\'4-16\');">Ex 22:4-16</a>) to property; VII (<a onClick="return mV(\'Exd\',22,\'17-26\');">Ex 22:17-26</a>) against witchcraft, against imitating the Canaanites, and lack of mercy; VIII (<a onClick="return mV(\'Exd\',22,\'27-30\');">Ex 22:27-30</a>) the relation to God; IX and X (<a onClick="return mV(\'Exd\',23,\'1-5\');">Ex 23:1-5</a>, <a onClick="return mV(\'Exd\',23,\'6-12\');">6-12</a>) ethical and humane law practice. I through IV accordingly contain laws pertaining to persons; V and VI those referring to things; VII through X, those referring to religion, morality, and administration of justice. But the chief line of demarcation is to be made after V; for I through V contain each four ordinances, VI through X each seven, which in the original text in almost each case are in their language separated from each other by particular conjunctions or by the construction. Only in VI (<a onClick="return mV(\'Exd\',22,\'4-16\');">Ex 22:4-16</a>) one command seems to be lacking; for only <a onClick="return mV(\'Exd\',22,4,5,6);">Ex 22:4-6</a>f; <a onClick="return mV(\'Exd\',22,\'9-13\');">9-13f</a>, <a onClick="return mV(\'Exd\',22,15);">15</a>f are distinguished by the "ki" in the beginning; but the seventh ordinance is found in <a onClick="return mV(\'Exd\',22,8);">22:8</A>. Here too, in each case, II and I, two and two as a rule are more closely connected, after the manner of the division in the first three sections, 1:8-7:7; 7:8-13:16; 13:17-18:27; at least this is the case in I and II, III and IV through VII and VIII, IX and X.<P>(b) In this section, too, <a onClick="return mV(\'Exd\',19,1);">Ex 19:1-24:18</a> a, there is no real occasion for a division into sources. It is claimed that P is found only in <a onClick="return mV(\'Exd\',19,1,2);">19:1,2a</a>; <a onClick="return mV(\'Exd\',24,\;15-18\');">24:15-18</a>; but <a onClick="return mV(\'Exd\',19,1,2);">19:1,2a</a> is indispensable for <a onClick="return mV(\'Exd\',19,2);">19:2b</a> on account of the word "there"; and before <a onClick="return mV(\'Exd\',24,15);">24:15</a>ff there is an omission, if the preceding verses are to be ascribed to a different source. The duplicates <a onClick="return mV(\'Exd\',19,8,9);">19:8,9</a>; <a onClick="return mV(\'Exd\',19,18,20);">19:18,20</a> are best explained by the assumption of a new beginning in <a onClick="return mV(\'Exd\',19,9);">19:9</a> at <a onClick="return mV(\'Exd\',19,20);">19:20</a> (compare above); <a onClick="return mV(\'Exd\',24,1,2);">24:1,2</a>, which at the same time introduces <a onClick="return mV(\'Exd\',24,9);">24:9</a>ff, is placed before <a onClick="return mV(\'Exd\',24,3);">24:3</a>, because in point of time it belongs here. According to the original text, the translation at this place must read: "To Moses he spoke," in contrast to the ordinances which, in <a onClick="return mV(\'Exd\',21,1);">21:1</A>ff, are addressed to the congregation of Israel. Certainly <a onClick="return mV(\'Exd\',24,\'3-8\');">24:3-8</a> is purposely formulated to show in almost the same words that <a onClick="return mV(\'Exd\',24,3);">24:3</a> reports the Violation and <a onClick="return mV(\'Exd\',24,4);">24:4</a>ff the writing of the decision to obey on the part of Israel (<a onClick="return mV(\'Exd\',24,3);">24:3b</a> and <a onClick="return mV(\'Exd\',24,7);">24:7b</a>). It is not perfectly clear to the reader where Moses was during the promulgation of the Decalogue, whether upon the mountain or at the foot of the mountain (compare <a onClick="return mV(\'Exd\',19,24);">19:24</a>f; <a onClick="return mV(\'Exd\',20,18);">20:18</a>ff; but also <a onClick="return mV(\'Deu\',5,5);">De 5:5</a>). In view of the importance of the matter itself and the vividness of the narrative and the continual change in the place where Moses abode, it is psychologically easily understood that the clearness of the account has suffered somewhat.<P>(5) Exodus 24:18b through 31:18:<P>(a) During the forty days which Moses tarries with God on the mountain, and at the conclusion of which he receives the two tables of the law (<a onClick="return mV(\'Exd\',31,18);">31:18</A>), God converses with him seven times (<a onClick="return mV(\'Exd\',25,1;">25:1</a>; <a onClick="return mV(\'Exd\',30,11,17,22,34);">30:11,17,22,34</A>; <a onClick="return mV(\'Exd\',31,1,12);">31:1,12</a>). No. 1</a> (25:1-30:10) contains directions in reference to the building of the Tabernacle, and laws for the priests serving in it. Nos. 2-6 bring a number of directions supplementing no. 1, namely, no. 2 (<a onClick="return mV(\'Exd\',30,\'11-16\');">Ex 30:11-16</a>), individual tax; no. 3 (<a onClick="return mV(\'Exd\',30,\'17-21\');">Ex 30:17-21</a>), copper washing vessels; no. 4 (<a onClick="return mV(\'Exd\',30,\'22-33\');">Ex 30:22-33</a>), oil for anointing; no. 5(<a onClick="return mV(\'Exd\',30,\'34-38\');">Ex 30:34-38</a>), incense; no. 6 (<a onClick="return mV(\'Exd\',31,\'1-11\');">Ex 31:1-11</a>), the calling of Bezalel and Aholiab to be the master builders; additionally and in conclusion, no. 7(<a onClick="return mV(\'Exd\',31,\'12-17\');">Ex 31:12-17</a>), the Sabbath command. It is probably not accidental that the Sabbath idea is touched upon 7 times, namely, in addition to the present passage, also in (a) <a onClick="return mV(\'Exd\',16,5);">Ex 16:5</a> JE (?); <a onClick="return mV(\'Exd\',16,\'23-29\');">16:23-29</a> P and R; (b) <a onClick="return mV(\'Exd\',20,\'8-11\');">20:8-11</a> E; (c) <a onClick="return mV(\'Exd\',23,\'10-12\');">23:10-12</a> E; (d) <a onClick="return mV(\'Exd\',24,16);">24:16</a> P; (e) <a onClick="return mV(\'Exd\',34,21);">34:21</a> J; (f) <a onClick="return mV(\'Exd\',35,1,2,3);">35:1-3</a> the Priestly Code (P), and that as is the case in this present passage, other passages too, such as <a onClick="return mV(\'Exd\',24,16);">24:16</a> P; <a onClick="return mV(\'Exd\',35,1,2,3);">35:1-3</a> P conclude a main section, and <a onClick="return mV(\'Exd\',22,\'10-22\');">22:10-22</a> a subordinate section, with this reference.<P>The first more complete pericope itself in Exodus (25:1-30:10) is, however, divided into 12 pieces (we cannot at this place enter into details in reference to the typical numbers found so often in the measurements of the Tabernacle, but can refer only to the cubical form of the Holy of Holies on the basis of 10 cubits), namely,<P>(1) contributions for the sanctuary (<a onClick="return mV(\'Exd\',25,\'1-9\');">25:1-9</a>);<P>(2) the holy ark (<a onClick="return mV(\'Exd\',25,\'10-22\');">25:10-22</a>);<P>(3) table of shewbread (<a onClick="return mV(\'Exd\',25,\'23-30\');">25:23-30</a>);<P>(4) golden candlesticks (<a onClick="return mV(\'Exd\',25,\'31-40\');">25:31-40</a>);<P>(5) tabernacle (<a onClick="return mV(\'Exd\',26,\'1-37\');">26:1-37</a>) in which at the same time the articles mentioned from 2 to 4 are placed (compare <a onClick="return mV(\'Exd\',26,33);">26:33</a>ff);<P>(6) altar for burnt sacrifices (<a onClick="return mV(\'Exd\',27,\'1-8\');">27:1-8</a>);<P>(7) court (<a onClick="return mV(\'Exd\',27,\'9-19\');">27:9-19</a>) in which this altar stood (compare <a onClick="return mV(\'Exd\',40,29,33);">40:29,33</A>);<P>(8) oil for the lights (<a onClick="return mV(\'Exd\',27,20,21);">27:20,21</a>);<P>(9) sacred garments for the priests (<a onClick="return mV(\'Exd\',28,\'1-43\');">28:1-43</a>);<P>(10) consecration of priests (<a onClick="return mV(\'Exd\',29,\'1-37\');">29:1-37</a>);<P>(11) the burnt sacrifices (<a onClick="return mV(\'Exd\',29,\'38-46\');">29:38-46</a>);<P>(12) incense altar (<a onClick="return mV(\'Exd\',30,\'1-10\');">30:1-10</a>).<P>The five articles included in 8 to 12 are combined into a contrast to the five in 1 to 7 by their express reference to the priests (compare in addition to 9 and 10 also <a onClick="return mV(\'Exd\',27,21);">27:21</a>; <a onClick="return mV(\'Exd\',29,44);">29:44</a>; <a onClick="return mV(\'Exd\',30,7,10);">30:7f; 10</a>). With the incense altar, which was of great importance, and of equal importance with the great altar on the Day of Atonement (<a onClick="return mV(\'Exd\',30,10);">30:10</a>), this section closes (compare (b)).<P>Thus it will under all circumstances be better to search for an explanation for putting oil in the place of the candlesticks and of the incense altar, which at first seems surprising, than in the case of every difficulty to appeal to a redactor\'s working without system or order. However, the entire portion <span class="noTag">Ex 24:18 b through 31:18</span> finds its explanation in the promise of <a onClick="return mV(\'Exd\',25,8);">25:8</a> that Yahweh will dwell in the midst of Israel (compare <a onClick="return mV(\'Exd\',29,45);">29:45</a>f). He is enthroned on the ark, in which the accusing law as the expression of the Divine will is deposited (for this reason called ha-\'edhuth; <a onClick="return mV(\'Exd\',25,16,21);">25:16,21</a>; <a onClick="return mV(\'Exd\',26,33,34);">26:33,34</a>), but above the atonement lid, the kapporeth, at which on the Day of Atonement, the atonement ceremony is carried out (compare <a onClick="return mV(\'Exd\',25,\'17-22\');">25:17-22</a>; <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>); see <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT</A>.<P>(b) This whole section, with the exception of <a onClick="return mV(\'Exd\',31,18);">Ex 31:18</a> E (?) is ascribed to the Priestly Code (P), although at this place, though without good reasons, different strata are distinguished. In regard to the contradiction claimed to exist in the different persons to be anointed (high priest, or all the priests; compare <a onClick="return mV(\'Exd\',19,7);">29:7</a> over against <a onClick="return mV(\'Exd\',28,41);">28:41</a>; <a onClick="return mV(\'Exd\',29,21);">29:21</A>), see <a href="./study/isbe/search.html?string=LEVITICUS,+1">LEVITICUS</A>. Also the duplicates of the tamidh sacrifice and of the candlesticks (compare I,3,above) are not at all the decisive factor in proof of a difference of sources within the parts treating of the priests, providing it can be shown that each passage stands where it belongs. With regard to the candlesticks, see <a href="./study/isbe/search.html?string=LEVITICUS,+1">LEVITICUS</A>. In addition compare passages like <a onClick="return mV(\'Mat\',10,39);">Mt 10:39</a> and <a onClick="return mV(\'Mat\',16,25);">16:25</a>; <a onClick="return mV(\'Mat\',10,22,24);">10:22</a> and <a onClick="return mV(\'Mat\',24,13);">24:13</a>; <a onClick="return mV(\'Mat\',6,14);">6:14</a>ff and <a onClick="return mV(\'Mat\',18,35);">18:35</a>; <a onClick="return mV(\'Mat\',5,29);">5:29</a>f and <a onClick="return mV(\'Mat\',18,8);">18:8</a>ff; <a onClick="return mV(\'Mat\',19,30);">19:30</a> and <a onClick="return mV(\'Mat\',20,16);">20:16</a>. But as far as attributing certain passages to P in general is concerned, it is self-evident that ordinances referring to the cults make use of technical terms pertaining to the cults, without this fact justifying any conclusion as to a particular author or group of authors. On the other hand, it could not at all be understood how P could so often call the Decalogue ha-\'edhuth, without having contained this all-important law itself (compare <a onClick="return mV(\'Exd\',25,16);">Ex 25:16</a>, <a onClick="return mV(\'Exd\',25,21);">21</a>f; <a onClick="return mV(\'Mat\',26,33);">26:33</a>f; <a onClick="return mV(\'Mat\',34,29);">34:29</a>; <a onClick="return mV(\'Mat\',38,21);">38:21</a>, etc.). On the other hand, as is well known, the fourth commandment (<a onClick="return mV(\'Exd\',20,\'8-11\');">Ex 20:8-11</a>) expressly refers back to <a onClick="return mV(\'Gen\',2,2,3);">Ge 2:2, 3</a>, that is, to P; also <a onClick="return mV(\'Exd\',23,15);">Ex 23:15</a> to <a onClick="return mV(\'Exd\',12,20);">12:20</a>.<P>(6) Exodus 32:1-35:3:<P>(a) God\'s promise to dwell in the midst of Israel, the turning-point in the fifth section, seems to have become a matter of doubt, through the apostasy of Israel, but is nevertheless realized in consequence of the intercession of Moses and of the grace of God, which, next to His primitive holiness, is emphasized very strongly. This entire sixth section is to be understood from this standpoint. As was the case in the preceding section, the forty days are prominent in this too (compare <a onClick="return mV(\'Exd\',34,28);">34:28</a> J with <a onClick="return mV(\'Exd\',24,18);">24:18</a> P). We can divide the contents here also into ten pericopes. No. 1</a> (<a onClick="return mV(\'Exd\',32,\'1-14\');">32:1-14</a>) reports that Yahweh tells Moses of the idolatry with the golden calf, that He is determined to destroy Israel, but is influenced to change this determination by the intercession of Moses. No. 2</a> (<a onClick="return mV(\'Exd\',32,\'15-29\');">32:15-29</a>) describes the wrath of Moses and the punishment through him. He breaks the tablets into pieces, grinds the golden calf into powder, reproves Aaron, dissolves through the Levites the curse which had for this reason impended over them since <a onClick="return mV(\'Gen\',49,\'5-7\');">Ge 49:5-7</a> and causes this to be changed into a blessing: three thousand killed. No. 3 (<a onClick="return mV(\'Exd\',32,\'30-35\');">32:30-35</a>) reports that Yahweh at the petition of Moses will send some of His angels, but later on will punish the people for their sins. No. 4</a> (<a onClick="return mV(\'Exd\',33,\'1-6\');">33:1-6</a>) reports that Yahweh Himself no longer accompanies His people, which, on the one hand, is an act of grace, since the presence of God would even harm the people, but on the other hand is a punishment, and is felt as such by Israel. No. 5</a> (<a onClick="return mV(\'Exd\',33,\'7-11\');">33:7-11</a>) declares that God meets Moses only outside of the camp in a tent, but communes with him face to face. No. 6 introduces the last six pericopes in a natural way, since God\'s grace is appearing in constantly increasing glory (<a onClick="return mV(\'Exd\',33,\'12-33\');">33:12-33</a>). Here we have the petition of Moses to Yahweh that He in person should accompany him and show him His glory (Yahweh\'s grace is made especially prominent in <a onClick="return mV(\'Exd\',33,12,12,16,17,19);">33:12,13,16,17,19</a>). No. 7</a> (<a onClick="return mV(\'Exd\',34,\'1-10\');">34:1-10</a>) describes the preparation for the new conclusion of the covenant; Yahweh appears to Moses as the gracious, merciful, long-suffering kind, and faithful God, so that Moses again appeals to His grace. No. 8</a> (<a onClick="return mV(\'Exd\',34,\'11-28\');">34:11-28</a>) describes the new establishment of the covenant on the basis of the renewal of the Divine and grandiose promises of ordinances pertaining to religion and cults, and the ten words. No. 9 (<a onClick="return mV(\'Exd\',34,\'29-35\');">34:29-35</a>) describes how, in consequence of his close communion with God, Moses\' face shines. No. 10 (<a onClick="return mV(\'Exd\',25,\'1-3\');">35:1-3</a>) contains the Sabbath command (see (5a)). Nos. 9 and 10 give expression to the renewed covenant relationship. If we again in the larger group 1 to 8 take two and two together we find that each of these four groups contains a petition of Moses: <a onClick="return mV(\'Exd\',32,11);">Ex 32:11</a>ff; <a onClick="return mV(\'Exd\',33,\'30-32\');">33:30-32</a>; <a onClick="return mV(\'Exd\',33,12);">33:12</a>ff; <a onClick="return mV(\'Exd\',38,8,9);">38:8,9</a>. The entire section brings out equally prominently the love and the holiness of God, and does this in such a way that both characteristics find their expression in each group of two of these ten numbers. The progress beyond the third section (leading Israel to Sinai) is noticeable, since the murmuring is in each case followed only by an expression of the love of God; but equally this present section stands in contrast to <a onClick="return mV(\'Num\',11,\'1-\');">Nu 11</a>ff, where, on the occasion of the continuous murmuring of Israel the love of God is not indeed ignored, but it must take a place in the background as compared with His punitive holiness, which is particularly apparent in the story of the return of the spies in <a onClick="return mV(\'Num\',14,11);">Nu 14:11</a>ff. Here is at once seen the great similarity with the present section of <a onClick="return mV(\'Num\',14,12,15,16,17);">Nu 14:12, 15-17</a>ff and with <a onClick="return mV(\'Exd\',32,10,12);">Ex 32:10,12</a>; <a onClick="return mV(\'Exd\',34,6);">34:6</a>f; but at the same time the great difference caused by a divergency of the events (compare <a onClick="return mV(\'Num\',14,21);">Nu 14:21</a>ff). In contrast to this, <a onClick="return mV(\'Exd\',32,34);">Ex 32:34</a> refers back to <a onClick="return mV(\'Num\',14,\'1-\');">Nu 14</a>, and <a onClick="return mV(\'Exd\',32,35);">Ex 32:35</a> is a proleptic judgment based on this experience.<P>(b) It is incomprehensible how critics have found in the renewal of the covenant caused by the apostasy of Israel and in the conditions of this renewal, namely, in the Books of the Covenant and in the Decalogue, duplicates, which are distributed between E and J (<a onClick="return mV(\'Exd\',20,1);">Ex 20:1</a>ff; <a onClick="return mV(\'Exd\',21,\'1-\');">21</a>ff; <span class="noTag">24:8-34:1</span>ff, <a onClick="return mV(\'Exd\',28,\'1-\');">28</a>; <a onClick="return mV(\'Exd\',34,\'1-26\');">34:11-26</a>; <a onClick="return mV(\'Exd\',34,27);">34:27</a>). But in <a onClick="return mV(\'Exd\',34,\'11-26\');">Ex 34:11-26</a> there is no sign of the number ten being used in connection with the ordinances referring to the religion and the cults. Goethe\'s attempt to find at this place the original Decalogue, which effort is constantly being repeated, is accordingly without any foundation, even in the use of the number ten. In <a onClick="return mV(\'Exd\',34,28);">34:28 b</a>, according to <a onClick="return mV(\'Exd\',34,1);">34:1</a> and tradition (compare <a onClick="return mV(\'Deu\',10,2,4);">De 10:2, 4</a>; also <a onClick="return mV(\'Exd\',24,12);">Ex 24:12</a>; <a onClick="return mV(\'Exd\',31,18);">31:18</a>), Yahweh is to be regarded as the subject. Again <a onClick="return mV(\'Exd\',33,4);">Ex 33:4</a> and <a onClick="return mV(\'Exd\',33,5);">5</a>ff are not duplicates. In <a onClick="return mV(\'Exd\',33,4);">33:4</A> the people are described as having laid aside their ornaments a single time as a sign of repentance; according to <a onClick="return mV(\'Exd\',33,5,6);">33:5,6</a> the people permanently dispense with these, a state of mind which makes it possible for God again to show His mercy. It is an arbitrary assumption that these ornaments were used in the construction of the Tabernacle, the building of which had been announced beforehand in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff, so that in front of <a onClick="return mV(\'Exd\',33,7);">33:7</a> a parallel account to <a onClick="return mV(\'Exd\',35,\'1-\');">35</a>ff P taken from JE would have been omitted. In <a onClick="return mV(\'Exd\',33,7);">33:7</a>ff according to the text the author has in mind a tent already in existence, which up to this time had been standing within the camp and now had to be taken without, because Yahweh for the present can no longer dwell in the midst of the people (<a onClick="return mV(\'Exd\',32,34);">32:34</a>; <a onClick="return mV(\'Exd\',33,3,5);">33:3,5</a>), until Moses, through his intercession, again makes this possible (<a onClick="return mV(\'Exd\',33,\'15-17\');">33:15-17</a>; <a onClick="return mV(\'Exd\',34,9,10);">34:9,10</a>). And the promised tabernacle takes the place of the provisional tent (<a onClick="return mV(\'Exd\',35,\'1-\');">Ex 35</a>ff), which, as is done by the Septuagint, is probably to be preferred to Moses\' own tent. In the Priestly Code (P), to whom <a onClick="return mV(\'Exd\',34,29);">34:29</a>ff is attributed, such a provisional arrangement is presupposed in <a onClick="return mV(\'Exd\',34,35);">34:35</a>, since already at this place, and before the building of the tabernacle in <a onClick="return mV(\'Exd\',35,\'1-\');">Ex 35</a>ff, mention is made of the fact that Moses entered for the purpose of receiving the revelation of God. This accordingly presupposes what is reported in <a onClick="return mV(\'Exd\',33,7);">33:7</a>ff. Even without the facts mentioned and for other reasons, too, an omission must be accepted before <a onClick="return mV(\'Exd\',33,29);">34:29</a>ff; for <a onClick="return mV(\'Exd\',34,29);">34:29</A> speaks of the tables of the Law, concerning the origin of which P has reported nothing; and in <a onClick="return mV(\'Exd\',34,32);">34:32</a> concerning the commandments which Moses received on Mr. Sinai and had imparted to the people, which, however, do not refer to the directions that were given in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff, since these, according to <a onClick="return mV(\'Exd\',35,4);">35:4</a>ff, are yet to be expressly communicated to the people.<P>(7) <a onClick="return mV(\'Exd\',35,4);">Exodus 35:4-40:38</a>:<P>(a) The construction of the Tabernacle. This section is divided into four pericopes, each with four subdivisions (compare Structure of <span class="noTag">Leviticus 16</span> in <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT</A>). The same principle of division is found also in the history of Abraham and in <span class="noTag">De 12-26</span>. No. I (<a onClick="return mV(\'Exd\',35,\'4-\');">Ex 35:4</a> - <a onClick="return mV(\'Exd\',36 \'1-7\');">36:7</a>) describes the preparation for the construction:<P>(1) <a onClick="return mV(\'Exd\',35,\'4-19\');">Ex 35:4-19</a> appeals for contributions for this purpose;<P>(2) <a onClick="return mV(\'Exd\',35,\'20-29\');">35:20-29</a>, contributions;<P>(3) <a onClick="return mV(\'Exd\',36,\'30-\');">35:30</a> - <a onClick="return mV(\'Exd\',36,1);">36:1</a>, characterization of the builders;<P>(4) <a onClick="return mV(\'Exd\',36,\'2-7\');">36:2-7</a>, delivering the contributions to the builders.<P>Nos. II and III (<a onClick="return mV(\'Exd\',36,8);">Ex 36:8-38:31</a>; <a onClick="return mV(\'Exd\',39,\'1-31\');">39:1-31</a>) report the construction of the Tabernacle and the preparation of the priests garments (compare <a onClick="return mV(\'Exd\',39,32);">Ex 39:32</a>, <a onClick="return mV(\'Exd\',39,1);">1</a>);<P>No. II:<P>(1) <a onClick="return mV(\'Exd\',36,\'8-38\');">Ex 36:8-38</a>, dwelling-place;<P>(2) <a onClick="return mV(\'Exd\',37,\'1-\');">37:1</a> - <a onClick="return mV(\'Exd\',38,\'1-9\');">38:9</a>, utensils;<P>(3) <a onClick="return mV(\'Exd\',38,\'10-20\');">38:10-20</a>, court;<P>(4) <a onClick="return mV(\'Exd\',38,\'24-31\');">38:24-31</a>, cost of <a onClick="return mV(\'Exd\',38,1,2,3);">38:1-3</a>;<P>No. III<P>(1) <a onClick="return mV(\'Exd\',39,\'2-7\');">39:2-7</a>, shoulder garment;<P>(2) <a onClick="return mV(\'Exd\',39,\'8-21\');">39:8-21</A>, pocket;<P>(3) <a onClick="return mV(\'Exd\',39,\'22-26\');">39:22-26</A>, outer garment;<P>(4) <a onClick="return mV(\'Exd\',39,\'27-31\');">39:27-31</A>, summary account concerning coats, miter, bonnets, breeches, girdle, diadem.<P>Number IV (<a onClick="return mV(\'Exd\',39,\'32-\');">39:32</a> - <a onClick="return mV(\'Exd\',40,\'1-38\');">40:38</a>) reports the completion:<P>(1) <a onClick="return mV(\'Exd\',39,\'32-43\');">39:32-43</a>, consecration of these objects;<P>(2) <a onClick="return mV(\'Exd\',40,\'1-15\');">40:1-15</A>, command to erect;<P>(3) <a onClick="return mV(\'Exd\',40,\'16-33\');">40:16-33</a>, carrying out this command;<P>(4) <a onClick="return mV(\'Exd\',40,\'34-38\');">40:34-38</a>, entrance of the glory of Yahweh.<P>In this way the dwelling of Yahweh, which had been promised in <a onClick="return mV(\'Exd\',25,8);">25:8</a> the Priestly Code (P), and in <a onClick="return mV(\'Exd\',32,\'32-\');">Exodus 32-34</a> JE had been uncertain, has become a reality. The whole section is closely connected with <a onClick="return mV(\'Exd\',25,\'25-\');">Exodus 25-31</a>, yet is independent in character. The full details found in both groups are completely justified by the importance of the object. It is self-evident that at this place, too, the language of the cults is demanded by the object itself.<P>(b) The attempts to distribute this section among different authors are a total failure in view of the unity of the structure, which is independent also over against <a onClick="return mV(\'Exd\',25,\'25-\');">Exodus 25-31</a>. Since the numbers given in <a onClick="return mV(\'Exd\',38,26);">38:26</A> agree entirely with the numbers gathered later in <a onClick="return mV(\'Num\',2,32);">Nu 2:32</a>, it is evident that for the latter the lists for the contributions were used, which in itself is very probable because it was practical. In case this section is ascribed to P it is inexplicable how the writer can in <a onClick="return mV(\'Exd\',40,34);">Ex 40:34</a>ff speak of the pillar of fire as of something well known, since this has not yet been mentioned in the parts ascribed to the Priestly Code (P), but has been in <a onClick="return mV(\'Exd\',13,21);">13:21</a>f JE; <a onClick="return mV(\'Exd\',14,19,24);">14:19,24</a> J.<P>Continued in next article…[<a href="./study/isbe/search.html?string=Exodus,+the+Book+of,+3-4">Exodus, the Book of, 3-4</A>]``122';
isbe[3300]='Exodus, the Book of, 3-4`III. Historical Character.<P>1. General Consideration:<P>The fact that extra-Israelitish and especially Egyptian sources that can lay claim to historical value have reported nothing authentic concerning the exodus of Israel need not surprise us when we remember how meager these documents are and how one-sided Egyptian history writing is. Whether the expulsion of the lepers and the unclean, who before this had desolated the country and acquired supremacy over it as reported by Manetho and other historians, is an Egyptian version of the exodus of Israel, cannot be investigated at this place, but is to the highest degree improbable. If Israel was oppressed by the Egyptians for a long period, then surely the latter would not have invented the fable of a supremacy on the part of Israel; and, on the other hand, it would be incomprehensible that the Israelites should have changed an era of prosperity in their history into a period of servitude. Over against this the remembrance of the exodus out of Egypt not only is re-echoed through the entire literature of Israel (compare I,4,above), but the very existence of the people of God forces us imperatively to accept some satisfactory ground for its origin, such as is found in the story of the exodus and only here. In addition, the Book of Exodus shows a good acquaintance with the localities and the conditions of Egypt, as also of the desert. It is indeed true that we are still in doubt on a number of local details. But other statements in the book have in such a surprising manner been confirmed by discoveries and geographical researches, that we can have the greatest confidence in regard to the other difficulties: compare eg. Naville\'s The Store-city of Pithom (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>). In general, the opening chapters of Exodus, especially the narratives of the different plagues, contain so much Egyptian coloring, that this could scarcely have resulted from a mere theoretical study of Egypt, especially since in the narrative everything makes the impression of resulting from recent experience. The fact that Israel from its very origin received ordinances in regard to religion, morality, law and cults, is explained from the very conditions surrounding this origin and is indispensable for the explanation of the later development of the nation. None of the later books or times claim to offer anything essentially new in this respect; even the prophets appear only as reformers; they know of the election of Israel, and, on the other hand, everywhere presuppose as something self-evident the knowledge of a righteous, well-pleasing relation with God and chide the violation of this relation as apostasy. Ethical monotheism as the normal religion of Israel is reflected in the same way in all the sources of Israel\'s history, as has been proven in my work ("Die Entwicklung der alttestamentlichen Gottesidee in vorexilischer Zeit," in the May,1903, issue of Beitrage zur Forderung christlicher Theologie). And the idea that an oriental people, especially if they came out of Egypt, should have had no religious cult, is in itself unthinkable. If all of these norms, also the direction for the cults in the Books of Covenant, of the Priestly Code, or D, at least in the kernel, do not go back to the Mosaic times, then we have to deal with an insoluble problem (compare my work, Are the Critics Right?).<P>2. The Miraculous Character:<P>The Book of Exodus is as a matter of fact from its first to its last page filled with miraculous stories; but in this characteristic these contents agree perfectly with the whole history of redemption. In this immediate and harmonious activity of God, for the purpose of establishing a chosen people, all these miracles find their purpose and explanation, and this again is only in harmony with other periods of sacred history. The reason is self-explanatory when these miracles are found grouped at the turning-points in this history, as is the case also in the critical age of Elijah and Elisha, and in the experiences and achievements of "Jonah," so significant for the universality of the Biblical religion. Above all is this true in the ministry of Jesus Christ; and also again in His return to judgment. And in the same way, too, we find this at the beginning of Israel as a nation (see my article in Murray\'s Dictionary). Compare in this respect the rapid numerical growth of the nation, the miracles, the plagues, in the presence of Pharaoh, the passage through the Red Sea, the miraculous preservation of the people in the desert, the many appearances of God to Moses, to the people, to the elders, the protection afforded by the cloud, the providential direction of the people of Israel and of the Egyptians, and of individual persons (Moses and Pharaoh). The fact that the author himself knows that Israel without the special care and protection of God could not have survived in the desert is in complete harmony with his knowledge of the geographical situation already mentioned.<P>3. The Legislative Portions:<P>If any part of the laws in Exodus is to be accepted as Mosaic, it is the Decalogue. It is true that the ten commandments are found in two recensions (<a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a>; <a onClick="return mV(\'Deu\',5,\'1-\');">De 5</a>). The original form is naturally found in <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a>. Only Moses could regard himself as inwardly so independent of the Decalogue as it had been written by God, that he did not consider himself bound in <a onClick="return mV(\'Deu\',5,\'1-\');">De 5</a> by its exact wording. The legal ordinances in <a onClick="return mV(\'Exd\',21,1);">Ex 21:1</a>ff have found an analogy already in Code of Hammurabi, more than 500 years older although moving in a lower sphere. As Israel had lived in Goshen, and according to <a onClick="return mV(\'Gen\',26,12);">Ge 26:12</a> Isaac had even been engaged in agriculture, and Israel could not remain in the desert but was to settle down in permanent abodes again, the fact of the existence of this law of Israel, which in a religious and ethical sense rises infinitely above the Code of Hammurabi, is in itself easily understood. And again since the sacred ark of the covenant plays an important role also in the other sources of the Pentateuch (<a onClick="return mV(\'Num\',10,33);">Nu 10:33</a>; <a onClick="return mV(\'Num\',14,44);">14:44</a>; <a onClick="return mV(\'Deu\',10,\'1-8\');">De 10:1-8</a>; <a onClick="return mV(\'Deu\',31,9,25);">31:9, 25</a>) and in the history of Israel (compare <a onClick="return mV(\'Jos\',3,\'1-\');">Jos 3</a>; <a onClick="return mV(\'Jos\',6,\'6-8\');">6:6-8</a>; <a onClick="return mV(\'Jos\',8,33);">8:33</a>; <a onClick="return mV(\'Jdg\',20,27);">Jud 20:27</a>; <a onClick="return mV(\'1Sa\',6,2);">1Sa 6:2</a>ff; <a onClick="return mV(\'2Sa\',15,24);">2Sa 15:24</a>f; <a onClick="return mV(\'1Ki\',3,15);">1Ki 3:15</a>; <a onClick="return mV(\'1Ki\',6,19);">6:19</a>; <a onClick="return mV(\'1Ki\',8,\'1-9\');">8:1-9</a>), then a suitable tent, such as is announced in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff, and was erected according to <a onClick="return mV(\'Exd\',35,\'1-\');">Ex 35</a>ff, was an actual necessity.<P>As the Paschal sacrifice, according to <a onClick="return mV(\'Exd\',12,3);">Ex 12:3</a>ff; <a onClick="return mV(\'Exd\',12,43);">12:43</A>ff P; <a onClick="return mV(\'Exd\',12,21);">12:21</a>ff JE (?) was to be killed in the houses, and this on the 14th of Nisan in the evening (<a onClick="return mV(\'Exd\',12,6);">12:6</A>), and as P directs that a festival assembly shall be held on the next day at the sanctuary (compare <a onClick="return mV(\'Lev\',23,6);">Le 23:6</a>ff; <a onClick="return mV(\'Num\',28,17);">Nu 28:17</a>ff), these are conditions which can be understood only in case Israel is regarded as being in the wilderness. For this reason <a onClick="return mV(\'Deu\',16,5);">De 16:5</a>ff changes this direction, so that from now on the Passover is no longer to be celebrated in the houses but at the central sanctuary. In the same way the direction <a onClick="return mV(\'Exd\',22,29);">Ex 22:29</a>, which ordered that the firstborn of animals should be given to Yahweh already on the 8th day, could be carried out only during the wanderings in the desert, and is for this reason changed by <a onClick="return mV(\'Deu\',14,23);">De 14:23</a>ff; <a onClick="return mV(\'Deu\',15,19);">15:19</A>ff to meet the conditions of the people definitely settled after this wandering. Compare my work, Are the Critics Right? 188-89, 194-95.<P>4. Chronology:<P>As is well known, the average critic handles the Biblical chronology in a very arbitrary manner and is not afraid of changing the chronology of events by hundreds of years. If we leave out of consideration some details that often cause great difficulties, we still have a reliable starting-point in the statements found in <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a> and <a onClick="return mV(\'Exd\',12,40);">Ex 12:40</a>f. According to the first passage, the time that elapsed between the exodus of the Israelites and the building of the temple in the 4th year of Solomon was 480 years; and according to the second passage, the time of the stay in Egypt was 430 years. A material change in the first-mentioned figures is not permitted by the facts in the Book of Judges, even if some particular data there mentioned are contemporaneous; and to reduce the 430 years of the stay in Egypt, as might be done after the Septuagint, which includes also the stay of the patriarchs in Canaan in this period, or to reduce the whole period from the entrance into Egypt to the building of the temple, is contrary to the synchronism of Hammurabi and Abraham (<a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>). The first-mentioned could not have lived later than 2100 BC. The 430 years in <a onClick="return mV(\'Exd\',12,40,41);">Ex 12:40-41</a> P are also, independently of this passage, expressly supported by the earlier prediction of an oppression of Israel for 400 years from the time of Abraham (<a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a> J); and the 480 years of <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a> are confirmed by <a onClick="return mV(\'Jdg\',11,26);">Jud 11:26</a>, according to which, at the time of the suppression by the Amorites and of Jephthah as judge, already 30 years must have elapsed since the east Jordan country had been occupied by the Israelites. According to this the exodus must have taken place not long after 1500 BC. And in perfect agreement with this supposition would be the condition of affairs in Palestine as we know them from the Tell el-Amarna Letters dating about 1450-1400 BC, according to which the different Canaanitish cities had been attacked by the Chabiri in the most threatening manner, as this is reported too in the Book of Joshua. As is well known linguistically, too, the identification of the Chabiri with the Hebrews is unobjectionable. Finally, on the well-known Menepthah stele of the 13th century BC, Israel is mentioned in connection with Canaan, Ashkelon, Gezer, Y-nu\'m (= Janoah, <a onClick="return mV(\'Jos\',16,6,7);">Jos 16:6, 7</a>?), and accordingly is already regarded as settled in Canaan. A date supported in such different ways makes it impossible for me to find in Rameses II the Pharaoh of the oppression, and in Menepthah the Pharaoh of the exodus (both between 1300 and 1200 BC). A conclusive proof that the name and the original building of the city Rameses (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>; <a onClick="return mV(\'Exd\',12,37);">12:37</a>; <a onClick="return mV(\'Num\',33,3,5);">Nu 33:3, 5</a>) necessarily leads back to Rameses II can, at least at the present time, not yet be given (compare on this point also, Kohler, Lehrbuch der biblischen Geschichte des Alten Testamentes, I, 238ff).<P>5. Unjustifiable Attacks:<P>All these attacks on the historical character of this book which originate only in the denial of the possibility of miracles, the Christian theologian can and must ignore. Such attacks do not stand on the ground of history but of dogma. Let us accordingly examine other objections. Thus, it is claimed that the number of men in Israel, which in <a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a> is said to have been 600,000, is too high, because not only the desert but Goshen also would not have been able to support two million people, and Israel had been too short a time in Egypt to grow into so populous a nation. Yet Israel, beginning with the time of the oppression, which, according to <a onClick="return mV(\'Exd\',2,23);">2:23</A>; <a onClick="return mV(\'Exd\',1,8);">1:8</a> continued many years and hence began before the highest number in population had been reached, had claims for support from the Egyptian corn (grain) granaries; and the 430 years in <a onClick="return mV(\'Exd\',12,40);">12:40</a> certainly cannot be reduced, as has been shown under (4) above. To this must be added that in <a onClick="return mV(\'Exd\',1,\'1-\');">Ex 1</a>; <a onClick="return mV(\'Exd\',7,9);">7:9</a>f; <a onClick="return mV(\'Exd\',7,12,20);">12,20</a>f the rapid numerical growth of Israel is represented as the result of a Divine blessing. Then, too, in the company of Jacob and his descendants, doubtless servants, male and female, came down to Egypt (compare the 318 servants of Abraham alone in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>). The figures in <a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a> P are further confirmed by <a onClick="return mV(\'Num\',11,21);">Nu 11:21</a> (according to critics from JE) and by the results of the two enumerations, <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1</a>f (<a onClick="return mV(\'Num\',2,31);">2:31</a>; compare <a onClick="return mV(\'Exd\',38,26);">Ex 38:26</a> (603,550)) and <a onClick="return mV(\'Num\',26,51);">Nu 26:51</a> (601,730). The attacks made also on the existence of the Tabernacle must be rejected as groundless. According to the Wellhauscn school the Tabernacle is only a copy of the temple of Solomon dated back into the Mosaic times; and the fact that there is only one central seat of the cults is regarded as a demand first made by the Deuteronomistic legislation in the 7th century. Against this latter claim militates not only the impossibility of placing Deuteronomy at this time (compare my work Are the Critics Right? 1-55), but also the legislation of the Book of the Covenant, which, in <a onClick="return mV(\'Exd\',23,17,19);">Ex 23:17, 19</a>; <a onClick="return mV(\'Exd\',34,23,24,26);">34:23-24, 26</a> presupposes a sanctuary, and which even in the passages incorrectly analyzed by Wellhausen, <a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a> (compare again, Are the Critics Right ? 19, 48, 161ff, 189ff) speaks only of a single altar (compare also <a onClick="return mV(\'Exd\',21,14);">Ex 21:14</a>) and not of several existing at the same time. (The matter mentioned here is the building of an altar, according to a theophany, for temporary use.) Against the critical view we can quote the prophetic utterances of Amos, who condemns the cult in the Northern Kingdom (<a onClick="return mV(\'Amo\',5,4);">5:4</a>f), but teaches that God speaks out of Zion (<a onClick="return mV(\'Amo\',1,2);">1:2</a>; compare probably also, <a onClick="return mV(\'Amo\',9,1);">9:1</A>); those of Isaiah (<a onClick="return mV(\'Isa\',1,12);">1:12</A>; <a onClick="return mV(\'Isa\',2,2);">2:2</A>ff; <a onClick="return mV(\'Isa\',4,5);">4:5</A>f; <a onClick="return mV(\'Isa\',6,\'1-\');">6</A>; <a onClick="return mV(\'Isa\',8,18);">8:18</A>; <a onClick="return mV(\'Isa\',18,7);">18:7</a>; <a onClick="return mV(\'Isa\',30,29);">30:29</a>; <a onClick="return mV(\'Isa\',33,20);">33:20</A>; <a onClick="return mV(\'Isa\',14,32);">14:32</A>; <a onClick="return mV(\'Isa\',28,16);">28:16</A>); also the facts of history (compare especially the central sanctuary in Shiloh, <a onClick="return mV(\'1Sa\',1,\'1-4\-);">1Sa 1-4</a>; <a onClick="return mV(\'Jdg\',21,19);">Jud 21:19</a>, which is placed on the same level with Zion in <a onClick="return mV(\'Jer\',7,12);">Jer 7:12</a>ff; <a onClick="return mV(\'Jer\',26,6);">26:6</A>; <a onClick="return mV(\'Psa\',78,\'60-72\');">Ps 78:60-72</a>). To this must be added such statements as <a onClick="return mV(\'2Sa\',7,6);">2Sa 7:6</a>; <a onClick="return mV(\'Jos\',18,1);">Jos 18:1</a>; <a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a>; <a onClick="return mV(\'1Ki\',8,4);">8:4</a>; <a onClick="return mV(\'1Ch\',16,39,40);">1Ch 16:39-40</a>; <a onClick="return mV(\'2Ch\',1,3);">2Ch 1:3</a>. All these facts are not overthrown by certain exceptions to the rule (compare <a href="./study/isbe/search.html?string=LEVITICUS,+1">LEVITICUS</A>). But the whole view leads to conclusions that in themselves cannot possibly be accepted. What a foolish fancy that would have been, which would have pictured the Tabernacle in the most insignificant details as to materials, amounts, numbers, colors, objects, which in <a onClick="return mV(\'Num\',4,\'1-\');">Nu 4</a> has determined with exact precision who was to carry the separate parts of the tent, while eg. for the service of the Tabernacle, so important for later times, only very general directions are given in <a onClick="return mV(\'Num\',18,2,4,6);">Nu 18:2, 4, 6</a>; <a onClick="return mV(\'Num\',8,22);">8:22</a>ff. This complete picture would be entirely without a purpose and meaningless, since it would have no connection whatever with the tendency ascribed to it by the critics, but rather, in part, would contradict it. Compare my book, Are the Critics Right? 72ff, 87ff.<P>That particularly in the post-exilic period it would have been impossible to center the Day of Atonement on the covering of the ark of the covenant, since the restoration of this ark was not expected according to <a onClick="return mV(\'Jer\',3,16);">Jer 3:16</a>, has already been emphasized in <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT</a>. If God had really determined to give to His people a pledge of the constant presence of His grace, then there can be absolutely no reason for doubting the erection of the Tabernacle, since the necessary artistic ability and the possession of the materials needed for the structure are sufficiently given in the text (compare also <a onClick="return mV(\'Exd\',25,9,40);">Ex 25:9, 40</a>; <a onClick="return mV(\'Exd\',26,30);">26:30</a>; <a onClick="return mV(\'Exd\',27,8);">27:8-31:2</a>ff; <a onClick="return mV(\'Exd\',35,30);">35:30</A>ff through <a onClick="return mV(\'Exd\',12,35);">12:35</a>; <a onClick="return mV(\'Exd\',3,21,22);">3:21,22</a>; <a onClick="return mV(\'Exd\',11,82;">11:2</a>f; <a onClick="return mV(\'Gen\',15,14);">Ge 15:14</a>; <a onClick="return mV(\'Exd\',33,4);">Ex 33:4</a>ff). The examination of the separate passages in Exodus, such as the relation of <a onClick="return mV(\'Exd\',20,24);">20:24</A> (see above) to Deuteronomy, or the ordinances concerning the Passover and the firstborn (<a onClick="return mV(\'Exd\',12,\'1-\');">Ex 12</a>f), and other laws in the different codices, goes beyond the purpose of this article (compare however under 3 above, at the close).<P>IV. Authorship.<P>1. Connection with Moses:<P>As the Book of Exodus is only a part of a large work (compare I, 3 above), the question as to authorship cannot be definitely decided at this place, but we must in substance restrict ourselves to those data which we find in the book itself. In several parts it is expressly claimed that Moses wrote them. He sang the hymn found in <a onClick="return mV(\'Exd\',15,\'1-\');">Ex 15</a>, after the passage of the Red Sea, and it breathes the enthusiasm of what the author has himself experienced. <a onClick="return mV(\'Exd\',15,13);">Ex 15:13</a>ff do not speak against the unity of the hymn, but rather for it, since the perfects here found as prophetic perfects only give expression to the certainty that the Israelites will take possession of the land of promise. In the course of history the nations often acted quite differently from what is here stated and often antagonized Israel (compare <a onClick="return mV(\'Num\',14,\'39-45\');">Nu 14:39-45</a>; <a onClick="return mV(\'Num\',20,18);">20:18</a>ff; <a onClick="return mV(\'Num\',21,4,\'21-35\');">21:4,21-35</a>; <a onClick="return mV(\'Num\',22,6);">22:6</A>; <a onClick="return mV(\'Jos\',6,\'1-\');">Jos 6-12</a>; also <a onClick="return mV(\'Exd\',13,17);">Ex 13:17</a>). In <a onClick="return mV(\'Exd\',15,13,17);">Ex 15:13, 17</a> not only Zion is meant, but all Canaan; compare <a onClick="return mV(\'Lev\',25,23);">Le 25:23</a>; <a onClick="return mV(\'Num\',35,34);">Nu 35:34</a>; <a onClick="return mV(\'Jer\',2,7);">Jer 2:7</a>; for har, "mountain," compare <a onClick="return mV(\'Deu\',1,7,20);">De 1:7, 20</a> ("hill-country"); <a onClick="return mV(\'Deu\',3,25);">3:25</A>; <a onClick="return mV(\'Psa\',78,54,55);">Ps 78:54-55</a>. According to <a onClick="return mV(\'Exd\',17,14);">Ex 17:14</a> Moses writes in a book the promise of Yahweh to destroy Amalek from the face of the earth. It is absolutely impossible that only this statement should have been written without any connecting thought and without at least a full description of the situation as given in <a onClick="return mV(\'Exd\',17,8);">Ex 17:8</a>ff. And as <a onClick="return mV(\'Exd\',17,14);">17:14</A> linguistically at least can mean merely \'to write a sheet,\' as <a onClick="return mV(\'Num\',5,23);">Nu 5:23</a>, it yet appears in the light of the connection of a comparison with related passages, such as <a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>; <a onClick="return mV(\'1Sa\',10,25);">1Sa 10:25</a>, much more natural to think of a book in this connection, in which already similar events had been recorded or could at any time be recorded.<P>The Ten Words (<a onClick="return mV(\'Exd\',20,1);">Ex 20:1</a>ff) were written down by God Himself and then handed over to Moses; compare <a onClick="return mV(\'Exd\',24,12);">Ex 24:12</a>; <a onClick="return mV(\'Exd\',31,18);">31:18</a>; <a onClick="return mV(\'Exd\',34,1);">34:1</a>ff, <a onClick="return mV(\'Exd\',34,28);">28</a> (<a onClick="return mV(\'Deu\',10,2,4);">De 10:2, 4</a>). The laws and judicial ordinances beginning with <a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>, according to <a onClick="return mV(\'Exd\',24,4);">24:4</a>, were also written down by Moses himself, and the same is true of the ordinances in <a onClick="return mV(\'Exd\',34,11);">34:11</A>ff, according to <a onClick="return mV(\'Exd\',34,27);">34:27</a>. The proof that formerly had to be furnished, to the effect that the knowledge of the art of writing in the days of Moses was not an anachronism, need not trouble us now, since both in Egypt and Babylon much older written documents have been discovered. But already from the passages quoted we could conclude nothing else than that Moses understood how to make use of different forms of literature—the poetical, the historical and the legal—unless the different statements to this effect by decisive reasons could be shown to be incorrect. In <a onClick="return mV(\'Num\',33,\'1-\');">Nu 33</a>, in the catalogue of stations, there is a portion ascribed to Moses that bears the express characteristics of the Priestly Code; and, finally Deuteronomy, with its hortatory, pastoral style, claims him as its author. Already in <a onClick="return mV(\'Exd\',17,14);">Ex 17:14</a> there were reasons to believe that Moses had written not only this statement which is there expressly attributed to him. Thus it becomes a possibility, that in general only in the case of particularly important passages the fact that Moses penned these also was to be made prominent, if it can be shown as probable that he in reality wrote more, as we find in parallel cases in the writings of the prophets (compare <a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>; <a onClick="return mV(\'Isa\',30,8);">30:8</a>; <a onClick="return mV(\'Jer\',30,2);">Jer 30:2</a>; <a onClick="return mV(\'Eze\',43,11);">Eze 43:11</a>; <a onClick="return mV(\'Hab\',2,2);">Hab 2:2</a>). In addition, we notice in this connection that in the catalogue of stations mentioned above and ascribed to Moses (<a onClick="return mV(\'Num\',33,\'1-\');">Nu 33</a>), the close relation of which to the portions attributed to P is certain, not only this part, but also the other words from JE in the present Bible text from <span class="noTag">Ex 12-19</span> (see above) are regarded as self-evident as Mosaic (as is the case also later with the corresponding historical part), and this is an important witness in favor of the Mosaic authorship of the historical parts. But <span class="noTag">Ex 25-31; 35-40</span> also claim, at least so far as contents are concerned, to be the product of the Mosaic period. The entire portable sanctuary is built with a view to the wanderings in the desert. Aaron and his sons are as yet the only representatives of the priesthood (<a onClick="return mV(\'Exd\',27,21);">27:21</A>; <a onClick="return mV(\'Exd\',28,4,12,41,42,43);">28:4,12,41-43</a>; <a onClick="return mV(\'Exd\',29,4);">29:4</A>ff, etc.). In view of the relationship which <a onClick="return mV(\'Num\',33,\'1-\');">Nu 33</a> shows with the Priestly Code (P), it is clear, if we accept the genuineness of this part, a matter that is in the highest degree probable, that this style was current in Moses\' time, and that he had the mastery of it, even if other hands, too, have contributed to the final literary forms of these laws. In favor of the Mosaic authorship of the whole Book of Exodus we find a weighty reason in the unity and the literary construction of the work as shown above. This indeed does not preclude the use and adaptation of other sources of historical or legal statements, either from the author\'s own hands or from others, if such a view should perhaps be suggested or made imperative by the presence of many hard constructions, unconnected transitions, unexpected repetitions, etc. But even on the presupposition of the Mosaic authorship, a difference in style in the different kinds of matters discussed is not impossible, just as little as this is the case with peculiarities of language, since these could arise particularly in the course of vivid narration of the story (compare the anacolouths in Paul\'s writings). But still more a reason for accepting the Mosaic authorship of Exodus is found in the grand and deep conception and reproduction of all the events recorded, which presupposes a congenial prophetic personality; and finally, too, the natural and strong probability that Moses did not leave his people without such a Magna Charta for the future. This Mosaic authorship becomes almost a certainty, in case the Book of Deuteronomy is genuine, even if only in its essential parts. For Deuteronomy at every step presupposes not only P (compare Are the Critics Right? 171ff), but also the history and the Books of the Covenant (<a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>ff; <a onClick="return mV(\'Exd\',34,11);">34:11</A>ff) as recorded in Exodus.<P>2. Examination of Objections:<P>Against the Mosaic authorship of Exodus the use of the third person should no longer be urged, since Caesar and Xenophon also wrote their works in the third person, and the use of this provision is eminently adapted to the purpose and significance of Exodus for all future times. In <a onClick="return mV(\'Isa\',20,1);">Isa 20:1</a>ff <a onClick="return mV(\'Eze\',24,24);">Eze 24:24</a>, we have analogies of this in prophetic literature. The statement (<a onClick="return mV(\'Exd\',11,3);">Ex 11:3</a>) that Moses was so highly regarded by the Egyptians is entirely unobjectionable in the connection in which it is found. That the book was not written for the self-glorification of Moses appears clearly in <a onClick="return mV(\'Exd\',4,\'10-16\');">4:10-16</a>; <a onClick="return mV(\'Exd\',6,12);">6:12</A>. In itself it is possible that some individual passages point to a later date, without thereby overthrowing the Mosaic authorship of the whole (compare also under (1)). In this case we are probably dealing with supplementary material. <a onClick="return mV(\'Exd\',16,35);">Ex 16:35</a> declares that Israel received manna down to the time when the people came to the borders of Canaan. Whether it was given to them after this time, too, cannot be decided on the basis of this passage (compare however <a onClick="return mV(\'Jos\',5,12);">Jos 5:12</a>). If the entire Book of Exodus was composed by Moses, then <a onClick="return mV(\'Exd\',16,35);">Ex 16:35</a> would be a proof that at least the final editing of the book had been undertaken only a short time before his death. This is suggested also by <a onClick="return mV(\'Exd\',16,34);">16:34b</A>, since at the time when the manna was first given the ark of the covenant did not yet exist; and the statement in <a onClick="return mV(\'Exd\',32,35);">32:35</a> takes into consideration the later development as found in <a onClick="return mV(\'Num\',13,\'1-\');">Nu 13</a>f. In the same way <a onClick="return mV(\'Exd\',16,36);">Ex 16:36</a> could be a later explanation, but is not necessarily so, if the \'omer was not a fixed measure, of which nothing further is known, and which probably was not to be found in every Israelite household, but a customary measure, the average content of which is given in <a onClick="return mV(\'Exd\',16,36);">16:36</a>. If we take Exodus alone there is nothing that compels us to go later than the Mosaic period (concerning the father-in-law of Moses, see under II,2,1 (1:8-7:7) at the close). The question as to whether there are contradictions or differences between the different legal ordinances in Exodus and in later books cannot be investigated at this place, nor the question whether the connection of Exodus with other books in any way modifies the conclusion reached under (1).<P>LITERATURE.<P>Books that in some way cover the ground discussed in the article: Against the separation into different sources: Eerdmans, Alttestamentliche Studien, III ("Das Buch Exodus"); Orr, Problem of the Old Testament; Moller, Wider den Bann der Quellenscheidung. In favor of the construction of <a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>ff: Merx, Die Bucher Moses und Josua ("Religionsgeschichtliche Volksbucher," II, Series, <span class="noTag">number 3</span>). For <a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>ff in its relation to the Code of Hammurabi: A. Jeremias, Das Alte Testament im Lichte des alten Orients; J. Jeremias, Moses und Hammurabi (with fuller literature); Histories of Israel by Kittel, Konig, Oettli, Kohler, Klostermann, Hengstenberg; Commentaries of Ryssel, Lange, Keil, Strack; Introductions to the Old Testament by Strack, Baudissin, Driver, Sellin. Against the Wellhausen hypothesis: Moller, Are the Critics Right? (with fuller literature); Orr (see above). Against the evolutionary theory: Orr (see above); Moller, Die Entwicklung der alttestamentlichen Gottesidee in vorexilischer Zeit (with fuller literature). Representatives of other schools: The Introductions of Kuenen and Cornill; the Commentaries of Holzinger and Baentsch; the Histories of Israel by Wellhausen and Stade.``122';
