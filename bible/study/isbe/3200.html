stimation of the book current among the ancient Jews is evident from its titles. It is usually headed "Megillath Esther" (the volume of Esther), and sometimes "Megillah" (the volume). Maimonides says that the wise men among the Jews affirm that the book was dictated by the Holy Spirit, and adds: "All the books of the Prophets, and all the Hagiographa shall cease in the days of the Messiah, except the volume of Esther; and, lo, that shall be as stable as the Pentateuch, and as the constitutions of the oral law which shall never cease."<P>2. Its Authorship:<P>By whom was the book written? This is a point in regard to which no help is afforded us either by the contents of the book or by any reliable tradition. Mordecai, whose claims have been strongly urged by some, is excluded by the closing words (<a onClick="return mV(\'Est\',10,3);">Es 10:3</a>), which sum up his life work and the blessings of which he had been the recipient. The words imply that when the book was written, that great Israelite had passed away.<P>3. Its Date:<P>Light is thrown upon the date of the book by the closing references to Ahasuerus (<a onClick="return mV(\'Est\',10,2);">Es 10:2</a>): "And all the acts of his power and of his might,...are they not written in the book of the chronicles of the kings of Media and Persia?" The entire history, therefore, of Xerxes was to be found in the state records when the book was written. In other words, Xerxes had passed away before it saw the light. That monarch was assassinated by Artabanus in 465 BC. This gives us, say 460 BC, as the highest possible date. The lowest possible date is the overthrow of the Persian empire by Alexander in 332 BC; for the royal records of the Median and Persian kings are plainly in existence and accessible, which they would not have been had the empire been overthrown. The book must have been written, therefore, some time within this interval of 128 years. There is another fact which narrows that interval. The initial waw shows that Esther was written after Nehemiah, that is, after 430 BC. The interval is consequently reduced to 98 years; and, seeing that the Persian dominion was plainly in its pristine vigor when Esther was written, we cannot be far wrong if we regard its date as about 400 BC.<P>4. Its Contents:<P>The book is characterized by supreme dramatic power. The scene is "Shushan the palace," that portion of the ancient Elamitic capital which formed the fortified residence of the Persian kings. The book opens with the description of a high festival. All the notabilities of the kingdom are present, together with their retainers, both small and great. To grace the occasion, Vashti is summoned to appear before the king\'s guests; and, to the dismay of the great assembly, the queen refuses to obey. A council is immediately summoned. Vashti is degraded; and a decree is issued that every man bear rule in his own house (<a onClick="return mV(\'Est\',1,\'1-\');">Es 1</a>). To find a successor to Vashti, the fairest damsels in the empire are brought to Shushan; and Hadassah, the cousin and adopted daughter of Mordecai, is of the number. Esther (<a onClick="return mV(\'Est\',2,\'1-\');">2</A>) closes with a notice of two incidents:<P>(1) the coronation of Hadassah (now and henceforth named "Esther") as queen;<P>(2) Mordecai\'s discovery of a palace plot to assassinate the king.<P>Chapter <a onClick="return mV(\'Est\',3,\'1-\');">3</a> introduces another leading personage, Haman, the son of Hammedatha, whose seat the king had set "above all the princes that were with him." All the king\'s servants who are at the king\'s gates prostrate themselves before the powerful favorite. Mordecai, who is not a trained courtier but a God-fearing Jew, refrains. Though expostulated with, he will not conform. The matter is brought to Haman\'s notice for whose offended dignity Mordecai is too small a sacrifice. The whole Jewish people must perish. Lots are cast to find a lucky day for their extermination. The king\'s consent is obtained, and the royal decree is sent into all the provinces fixing the slaughter for the 13th day of the 12th month.<P>The publication of the decree is followed by universal mourning among the Jews (<a onClick="return mV(\'Est\',4,\'1-\');">Es 4</a>). News of Mordecai\'s mourning is brought to Esther, who, through the messengers she sends to him, is informed of her own and her people\'s danger. She is urged to save herself and them. She eventually decides to seek the king s presence at the risk of her life. She presents herself (chapter <a onClick="return mV(\'Est\',5,\'1-\');">5</A>) before the king and is graciously received. Here we breathe atmosphere of the place and time. Everything depends upon the decision of one will—the king\'s. Esther does not attempt too much at first: she invites the king and Haman to a banquet. Here the king asks Esther what her petition is, assuring her that it shall be granted. In reply she requests his and Haman\'s presence at a banquet the following day. Haman goes forth in high elation. On his way home he passes Mordecai, who "stood not up nor moved for him." Haman passes on filled with rage, and unbosoms himself to his wife and all his friends. They advise that a stake, fifty cubits high, be prepared for Mordecai\'s impalement; that on the morrow he obtain the royal permission for Mordecai\'s execution; and that he then proceed with a merry heart to banquet with the queen. The stake is made ready.<P>But (<a onClick="return mV(\'Est\',6,\'1-\');">Es 6</a>) that night Xerxes cannot sleep. The chronicles of the kingdom are read before him. The reader has come to Mordecai\'s discovery of the plot, when the king asks what reward was given him. He is informed that the service had received no acknowledgment. It is now early morn, and Haman is waiting in the court for an audience to request Mordecai\'s life. He is summoned to the king\'s presence and asked what should be done to the man whom the king desires to honor. Believing that the king can be thinking only of him, he suggests that royal honors be paid him. He is appalled by the command to do so to Mordecai. Hurrying home from his lowly attendance upon the hated Jew, he has hardly time to tell the mournful story to his wife and friends when he is summoned to Esther\'s banquet. There, at the king\'s renewed request to be told her desire, she begs life for herself and for her people (<a onClick="return mV(\'Est\',7,\'1-\');">Es 7</a>). The king asks in astonishment, who he is, and where he is, who dared to injure her and them. The reply is that Haman is the adversary. Xerxes, filled with indignation, rises from the banquet and passes into the palace garden. He returns and discovers that Haman, in the madness of his fear, has thrown himself on the queen\'s couch, begging for his life. That act seals his doom. He is led away to be impaled upon the very stake he had prepared for the Jew. The seal of the kingdom is transferred to Mordecai (<a onClick="return mV(\'Est\',8,\'1-\');">Es 8</a>). Measures are immediately taken to avert the consequence of Haman\'s plot (<a onClick="return mV(\'Est\',9,\'1-\');">Es 9</a> - <a onClick="return mV(\'Est\',10,\'1-\');">10</a>). The result is deliverance and honor for the Jews. These resolve that the festival of Purim should be instituted and be ever after observed by Jews and proselytes. The decision was confirmed by letters from Esther and Mordecai.<P>5. The Greek Additions:<P>The Septuagint, as we now have it, makes large additions to the original text. Jerome, keeping to the Hebrew text in his own translation, has added these at the end. They amount to nearly seven chapters. There is nothing in them to reward perusal. Their age has been assigned to 100 BC, and their only value consists in the indication they afford of the antiquity of the book. That had been long enough in existence to perplex the Hebrew mind with the absence of the name of God and the omissions of any reference to Divine worship. Full amends are made in the additions.<P>6. The Attacks upon the Book:<P>The opponents of the Book of Esther may undoubtedly boast that Martin Luther headed the attack. In his Table-Talk he declared that he was so hostile "to the Book of Esther that I would it did not exist; for it Judaizes too much, and has in it a great deal of heathenish naughtiness." His remark in his reply to Erasmus shows that this was his deliberate judgment. Referring to Esther, he says that, though the Jews have it in their Canon, "it is more worthy than all" the apocryphal books "of being excluded from the Canon." That repudiation was founded, however, on no historical or critical grounds. It rested solely upon an entirely mistaken judgment as to the tone and the intention of the book. Luther\'s judgment has been carried farther by Ewald, who says: "We fall here as if from heaven to earth; and, looking among the new forms surrounding us, we seem to behold the Jews, or indeed the small men of the present day in general, acting just as they now do." Nothing of all this, however, touches the historicity of Esther.<P>The modern attack has quite another objective. Semler, who is its real fens et origo, believed Esther to be a work of pure imagination, and as establishing little more than the pride and arrogance of the Jews. DeWette says: "It violates all historical probability, and contains striking difficulties and many errors with regard to Persian manners, as well as just references to them." Dr. Driver modifies that judgment. "The writer," he says, "shows himself well informed on Persian manners and institutions; he does not commit anachronisms such as occur in Tobit or Judith; and the character of Xerxes as drawn by him is in agreement with history." The controversy shows, however, no sign of approaching settlement. Th. Noldeke (Encyclopaedia Biblica) is more violent than De Wette. "The story," he writes, "is in fact a tissue of improbabilities and impossibilities." We shall look first of all at the main objections urged by him and others and then at the recent confirmations of the historicity of Esther.<P>7. Some of the Objections:<P>(1) "There is something fantastic, but not altogether unskillful," says Noldeke, "in the touch whereby Mordecai and Haman are made to inherit an ancient feud, the former being a member of the family of King Saul, the latter a descendant of Agag, king of Amalek." It is surely unworthy of a scholar to make the book responsible for a Jewish fable. There is absolutely no mention in it of either King Saul or Agag, king of Amalek, and not the most distant allusion to any inherited feud. "Kish, a Benjamite" is certainly mentioned (<a onClick="return mV(\'Est\',2,5);">Es 2:5</a>) as the great-grandfather of Mordecai; but if this was also the father of Saul, then the first of the Israelite kings was a sharer in the experiences of the Babylonian captivity, a conception which is certainly fantastic enough. One might ask also how an Amalekite came to be described as an Agagite; and how a childless king, who was cut in pieces, became the founder of a tribe. But any semblance of a foundation which that rabbinic conceit ever had was swept away years ago by Oppert\'s discovery of "Agag" in one of Sargon\'s inscriptions as the name of a district in the Persian empire. "Haman the son of Hammedatha the Agagite" means simply that Haman or his father had come from the district of Agag.<P>(2) The statement that <a onClick="return mV(\'Est\',2,5,6);">Es 2:5-6</a> represents Mordecai as having been carried away with Jeconiah from Jerusalem, and as being therefore of an impossible age, is unworthy of notice. The relative "who" (<a onClick="return mV(\'Est\',2,6);">2:6</a>) refers to Kish, his great-grandfather.<P>(3) "Between the 7th and the 12th years of his reign, Xerxes\' queen was Amestris, a superstitious and cruel woman (Herod. vii.114; ix.112), who cannot be identified with Esther, and who leaves no place for Esther beside her" (Driver). Scaliger long ago identified Esther with Amestris, an identification which Prideaux rejected on account of the cruelty which Herodotus has attributed to that queen. Dr. Driver has failed to take full account of one thing—the striking fact that critics have leveled this very charge of cruelty against the heroine of our book. It is quite possible that Esther, moving in a world of merciless intrigue, may have had to take measures which would form a foundation for the tales recorded by the Greek historian.<P>(4) The aim of the book is said to be the glorification of the Jews. But, on the contrary, it is merely a record of their being saved from a skillfully planned extirpation.<P>(5) The description of the Jews (<a onClick="return mV(\'Est\',3,8);">Es 3:8</a>) as "dispersed among the peoples in all the provinces of" the kingdom is said to be inapplicable to the Persian period. That argument is based upon an ignorance of the ancient world which investigation is daily correcting. We now know that before the time of Esther, Jews were settled both in eastern and in southern Egypt, that is, in the extreme west of the Persian empire. In the troubles at the end of the 7th and of the 6th centuries BC, multitudes must have been dispersed, and when, at the latter period, the ties of the fatherland were dissolved, Jewish migrations must have vastly increased.<P>(6) The Hebrew of the book is said to belong to a much later period than that of Xerxes. But it is admitted that it is earlier than the Hebrew of Chronicles; and recent discoveries have shown decisively that the book belongs to the Persian period.<P>(7) The suggestion is made (Driver) "that the danger which threatened the Jews was a local one," and consequently, that the book, though possessed of a historical basis, is a romance. But against that are the facts that the observance of the feast has from the first been universal, and that it has not been observed more fully or more enthusiastically in any one place than in the others.<P>(8) There is no reference to it, it is urged, by Chronicles, Ezra or Ben Sira (Ecclesiasticus). But Chronicles ends with the proclamation of Cyrus, granting permission to the Jews to return and to rebuild the Temple. There is little to be wondered at that it contains no reference to events which happened 60 years afterward. In Ezra, which certainly covers the period of Esther, reference to the events with which she was connected is excluded by the plan of the work. It gives the history of the return, the first part under Zerubbabel in 536 BC, the second under Ezra himself, 458 BC. The events in Esther (which were embraced within a period of a few months) fell in the interval and were connected with neither the first return nor the second. Here again the objector is singularly oblivious of the purpose of the book to which he refers. There is quite as little force in the citation of Ecclesiasticus. In dealing with this time Ben Sira\'s eye is upon Jerusalem. He magnifies Zerubbabel, "Jesus the son of Josedek," and Nehemiah (<a onClick="return mV(\'Neh\',49,11,12,13);">49:11-13</A>). Even Ezra, to whom Jerusalem and the new Jewish state owed so much, finds no mention. Why, then, should Esther and Mordecai be named who seem to have had no part whatever in rebuilding the sacred city?<P>(9) The book is said to display ignorance of the Persian empire in the statement that it was divided into 127 provinces, whereas Herodotus tells us that it was partitioned into 20 satrapies. But there was no such finality in the number, even of these great divisions of the empire. Darius in his Behistun inscriptions gives the number as 21, afterward as 23, and in a third enumeration as 29. Herodotus himself, quoting from a document of the time of Xerxes, shows that there were then about 60 nations under the dominion of Persia. The objector has also omitted to notice that the medhinah ("province") mentioned in Esther (<a onClick="return mV(\'Ezr\',1,1);">1:1</a>) is not a satrapy but a subdivision of it. Judea is called a medhinah in <a onClick="return mV(\'Ezr\',2,1);">Ezr 2:1</a>, and that was only a small portion of the 5th satrapy, that, namely, of Syria. But the time is past for objections of this character. Recent discoveries have proved the marvelous accuracy of the book. "We find in the Book of Esther," says Lenormant (Ancient History of the East, II, 113), "a most animated picture of the court of the Persian kings, which enables us, better than anything contained in the classical writers, to penetrate the internal life and the details of the organization of the central government established by Darius."<P>8. Confirmations of the Book:<P>These discoveries have removed the discussion to quite another plane—or rather they have ended it. Since Grotefend in 1802 read the name of Xerxes in a Persian inscription and found it to be, letter for letter, the Ahasuerus of Eat, research has heaped up confirmation of the historical character of the book. It has proved, to begin with that the late date suggested for the book cannot be maintained. The language belongs to the time of the Persian dominion. It is marked by the presence of old Persian words, the knowledge of which had passed away by the 2nd century BC, and has been recovered only through the decipherment of the Persian monuments. The Septuagint translators were unacquainted with them, and consequently made blunders which have been repeated in our own the King James Version and in other translations. We read (<a onClick="return mV(\'Est\',1,5,6);">Es 1:5-6</a> the King James Version) that "in the court of the garden of the king\'s palace," "were white, green, and blue hangings, fastened with cords of fine linen and purple," etc. As seen in the ruins of Persepolis, a marked feature in the Persian palace of the period was a large space occupied by pillars which were covered with awnings. It may be noted in passing that these were situated, as the book says, in the court of the palace garden. But our knowledge of the recovered Persian compels us now to read: "where was an awning of fine white cotton and violet, fastened with cords of fine white linen and purple." White and blue (or violet) were the royal Persian colors. In accord with this we are told that Mordecai (<a onClick="return mV(\'Est\',8,15);">Es 8:15</a>) "went forth from the presence of the king in royal apparel of blue and white." The highly organized postal system, the king\'s scribes, the keeping of the chronicles of the kingdom, the rigid and elaborate court customs, are all characteristic of the Persia of the period. We are told of the decree obtained by Haman that "in the name of King Ahasuerus was it written, and sealed with the king\'s ring" (or signet). It was not signed but sealed. That was the Persian custom. The seal of Darius, Xerxes\' father, has been found, and is now in the British Museum. It bears the figure of the king shooting arrows at a lion, and is accompanied by an inscription in Persian, Susian and Assyrian: "I, Darius, Great King." The identification of Ahasuerus, made by Grotefend and which subsequent discoveries amply confirmed, placed the book in an entirely new light. As soon as that identification was assured, previous objections were changed into confirmations. In the alleged extravagances of the monarch, scholars saw then the Xerxes of history. The gathering of the nobles of the empire in "the third year of his reign" (<a onClick="return mV(\'Est\',1,3);">Es 1:3</a>) was plainly the historical assembly in which the Grecian campaign was discussed; and "the seventh year," in which Esther was made queen, was that of his return from Greece. The book implies that Susa was the residence of the Persian kings, and this was so. The proper form of the name as shown by the inscriptions was "Shushan"; "Shushan the Palace" indicates that there were two Susas, which was the fact, and birah ("palace") is a Persian word meaning fortress. The surprisingly rigid etiquette of the palace, to which we have referred, and the danger of entering unbidden the presence of the king have been urged as proof that the book is a romance. The contrary, however, is the truth. "The palace among the Persians," says Lenormant, "was quite inaccessible to the multitude. A most rigid etiquette guarded all access to the king, and made it very difficult to approach him....He who entered the presence of the king, without having previously obtained permission, was punished with death" (Ancient History of the East, II, 113-14; compare Herodotus i.99). But a further, and peculiarly conclusive, testimony to the historical character of the book is afforded by the recovery of the palace of Xerxes and Esther. An inscription of Artaxerxes Mnemon found at Susa tells us that it was destroyed by fire in the days of Artaxerxes Longimanus, the son and successor of Xerxes. Within some 30 years, therefore, from the time of Esther, that palace passed from the knowledge of men. Nevertheless, the references in the book are in perfect accord with the plan of the great structure as laid bare by the recent French excavations. We read (<a onClick="return mV(\'Est\',4,\'1-\');">Es 4</a>) that Mordecai, clad in sackcloth, walked in "the broad palace of the city, which was before the king\'s gate." The ruins show that the House of the Women was on the east side of the palace next to the city, and that a gate led from it into "the street of the city." In <a onClick="return mV(\'Est\',5,\'1-\');">Es 5:1</a>, we read that Esther "stood in the inner court of the king\'s house, over against the king\'s house." "The king," we also read, "sat upon his royal throne in the royal house, over against the entrance of the house," and that from the throne he "saw Esther the queen standing in the court." Every detail is exact. A corridor led from the House of the Women to the inner court; and at the side of the court opposite to the corridor was the hall, or throne-room of the palace. Exactly in the center of the farther wall the throne was placed and from that lofty seat the king, overlooking an intervening screen, saw the queen waiting for an audience. Other details, such as that of the king\'s passing from the queen\'s banqueting-house into the garden, show a similarly exact acquaintance with the palace as it then was. That is a confirmation the force of which it is hard to overestimate. It shows that the writer was well informed and that his work is characterized by minute exactitude.<P>The utter absence of the Divine name in Esther has formed a difficulty even where it has not been urged as an objection. But that is plainly part of some Divine design. The same silence is strictly maintained throughout in regard to prayer, praise and every approach toward God. That silence was an offense to the early Jews; for, in the Septuagint additions to the book, there is profuse acknowledgment of God both in prayer and in praise. But it must have struck the Jews of the time and the official custodians of the canonical books quite as painfully; and we can only explain the admission of Esther by the latter on the ground that there was overwhelming evidence of its Divine origin and authority. Can this rigid suppression be explained? In the original arrangement of the Old Testament canonical books (the present Hebrew arrangement is post-Christian), Esther is joined to Nehemiah. In 1895 I made a suggestion which I still think worthy of consideration: More than 60 years had passed since Cyrus had given the Jews permission to return. The vast majority of the people remained, nevertheless, where they were. Some, like Nehemiah, were restrained by official and other ties. The rest were indifferent or declined to make the necessary sacrifices of property and of rest. With such as these last the history of God\'s work in the earth can never be associated. In His providence He will watch over and deliver them: but their names and His will not be bound together in the record of the labor and the waiting for the earth\'s salvation.``180';
isbe[3220]='Esther, the Rest of`Contents<P>Introductory<P>1. Name<P>2. Contents<P>3. Original Language<P>4. Versions<P>5. Date<P>LITERATURE<hr /><P>Introductory.<P>The Book of Esther in the oldest manuscripts of the Septuagint (BAN, etc.) contains 107 verses more than in the Hebrew Bible. These additions are scattered throughout the book where they were originally inserted in order to supply the religious element apparently lacking in the Hebrew text. In Jerome\'s version and in the Vulgate, which is based on it, the longest and most important of these additions are taken out of their context and put together at the end of the canonical book, thus making them to a large extent unintelligible. In English, Welsh and other Protestant versions of the Scriptures the whole of the additions appear in the Apocrypha.<P>1. Name:<P>In the English Versions of the Bible the full title is "The Rest of the Chapters of the Book of Esther, which are found neither in the Hebrew, nor in the Chaldee." Since in the Septuagint, including the editions by Fritzsche, Tischendorf and Swete, these chapters appear in their original context, they bear no separate title. The same is true of Brereton\'s English translation of the Septuagint; but in Thompson\'s translation the whole of the Apocrypha is omitted, so that it is not strictly a translation of the whole Septuagint.<P>2. Contents:<P>In Swete\'s edition of the Septuagint the interpretations constituting "the Rest of Esther" (sometimes given as "Additions to Esther") are designated by the capital letters of the alphabet, and in the following enumeration this will be followed. The several places in the Greek Bible are indicated in each case.<P>A (Latin, English, Ad Es 11:2; 12:6): Mordecai\'s dream; how he came to honor. Precedes <a onClick="return mV(\'Est\',1,1);">Es 1:1</a>.<P>B (Latin, English, Ad Es 13:1-7): Letter of Artaxerxes. Follows <a onClick="return mV(\'Est\',3,13);">Es 3:13</a>.<P>C (Latin, English, Ad Es 13:8-14:19): The prayers of Mordecai and Esther. Follows <a onClick="return mV(\'Est\',4,17);">Es 4:17</a>.<P>D (Latin, Ad Es 15:4-19; English, 16:1-16): Esther visits the king and wins his favor. Follows C, preceding immediately <a onClick="return mV(\'Est\',5,1);">Es 5</a>.<P>E (Latin, English, Ad Es 16:1-24): Another letter of Artaxerxes. Follows <a onClick="return mV(\'Est\',8,12);">Es 8:12</a>. F (Latin, English, Ad Es 10:4-11): Epilogue describing the origin of the Feast Purim. Follows <a onClick="return mV(\'Est\',10,3);">Es 10:3</a>.<P>But besides the lengthy interpolations noticed above there are also in the Septuagint small additions omitted from the Latin and therefore from the English, Welsh, etc., Apocrypha. These short additions are nearly all explanatory glosses. In the Century Bible (Ezra, Nehemiah, Esther) the exact places where the insertions occur in the Septuagint are indicated and described in the notes dealing with the relevant passages of the canonical text. With the help thus given any English reader is able to read the additions in their original setting. Unless they are read in this way they are pointless and even in most cases senseless.<P>3. Original Language:<P>All scholars agree that "The Rest of Esther" was written originally in Greek Both external and internal evidence bears this out. But the Greek text has come down to us in two recensions which differ considerably.<P>(1) The commonly received text supported by the manuscripts B, A, N, and by Josephus (Ant., XI, i).<P>(2) A revision of (1) contained in the manuscripts 19, 93a and 108b. In the last two manuscripts both recensions occur. This revised text has been ascribed by many recent scholars (Lagarde, Schurer, R. H. Charles) to Lucian. In his Libr. Vet. Test. Canon. Graece, Pars Prior, 1833 (all published), Lagarde gives on parallel pages both recensions with critical notes on both.<P>4. Versions:<P>The two Greek texts are also given by Fritzsche (1871) and Swete (1891) in their editions of the Septuagint, and also by Scholz in his German Commentary on the Book of Esther (1892). For the ancient versions see "Esther Versions."<P>5. Date:<P>Practically all modern scholars agree in holding that "The Rest of Esther" is some decades later than the canonical book. In his commentary on Esther (Century Bible) the present writer has given reasons for dating the canonical Esther about 130 BC. One could not go far astray in fixing the date of the original Greek of the Additions to Esther at about 100 BC. It is evident that we owe these interpolations to a Jewish zealot who wished to give the Book of Esther a religious character. In his later years John Hyrcanus (135-103 BC) identified himself with the Sadducean or rationalistic party, thus breaking with the Pharisee or orthodox party to which the Maccabeans had hitherto belonged. Perhaps we owe these additions to the zeal aroused among orthodox Jews by the rationalizing temper prevailing in court circles. R. H. Charles (Encyclopedia Brit, XI, 797b) favors a date during the early (?) Maccabean period; but this would give the Ad Esther an earlier date than can be ascribed to the canonical Esther.<P>LITERATURE.<P>See the literature cited above, and in addition note the following: Fritzsche, Exegetisches Handbuch zu den Apokryphen (1851), 67-108; Schurer, History of the Jewish People, II, iii, 181ff (Ger. edition 4, III, 449ff); Ryssel (in Kautzsch, Apocrypha, 193ff); Swete, Introduction to the Old Testament in Greek, 257 if; the articles in the principal Bible Dictionaries, including Jewish Encyclopedia and Encyclopedia Britannica (11th edition).`<a href="./study/isbe/search.html?string=ESTHER">ESTHER</a>`33';
isbe[3221]='Estimate; Estimation`es\'-ti-mat, es-ti-ma\'-shun (\'arakh, \'erekh):<P>These words, meaning "to set in order," "valuation," are used in connection with the priestly services in <a onClick="return mV(\'Lev\',5,15,18);">Le 5:15, 18</a>; <a onClick="return mV(\'Lev\',6,6);">6:6</a>; <a onClick="return mV(\'Lev\',27,14);">27:14</a>, and frequently; <a onClick="return mV(\'Num\',18,16);">Nu 18:16</a>.``1';
isbe[3222]='Esyelus`e-si-e\'-lus (Esuel, Esuelos; the King James Version Syelus):<P>One of the governors of the Temple in the time of Josiah (1Esdras 1:8); called "Jehiel" in <a onClick="return mV(\'2Ch\',35,8);">2Ch 35:8</a>.``1';
isbe[3223]='Etam`e\'-tam \'etam; Codex Alexandrinus, Apan, Codex Vaticanus, Aitan:<P>(1) Mentioned in Septuagint along with Tekoa, Bethlehem and Phagor (<a onClick="return mV(\'Jos\',15,59);">Jos 15:59</a>). In <a onClick="return mV(\'2Ch\',11,6);">2Ch 11:6</a> it occurs, between Bethlehem and Tekoa, as one of the cities built "for defense in Judah" by Rehoboam. Josephus writes that "there was a certain place, about 50 furlongs distant from Jerusalem which is called Ethan, very pleasant it is in fine gardens and abounding in rivulets of water; whither he (Solomon) used to go out in the morning" (Ant., VIII, vii, 3). Mention of \'Ain \'Aitan, which is described as the most elevated place in Palestine, occurs in the Talmud (Zebhachim 54b), and in the Jer. Talmud (Yoma\' 3 fol 41) it is mentioned that a conduit ran from \'Atan to the Temple.<P>The evidence all points to \'Ain \'Atan, the lowest of the springs supplying the aqueduct running to Solomon\'s pools. The gardens of Solomon may very well—by tradition, at any rate—have been in the fertile valley below \'Urtas. The site of the ancient town Etam is rather to be looked for on an isolated hill, with ancient remains, a little to the east of \'Ain \'Atan. <a onClick="return mV(\'1Ch\',4,3);">1Ch 4:3</a> may also have reference to this Etam.<P>(2) A town assigned to Simeon (<a onClick="return mV(\'1Ch\',4,32);">1Ch 4:32</a>). Mentioned with <a href="./study/isbe/search.html?string=EN-RIMMON">EN-RIMMON</A> (which see), identified by Conder with Khurbet \'Aitun in the hills Northwest of Beersheba.<P>(3) The rock of Etam, where Samson took up his dwelling after smiting the Philistines "hip and thigh with a great slaughter" (<a onClick="return mV(\'Jdg\',15,8,11);">Jud 15:8, 11</a>), was in Judah but apparently in the low hill country (same place). The rocky hill on which lies the village of Beit \'Atab, near Sur\'ah (Zorah), was suggested by Conder, but unless (3) is really identical width (1), which is quite possible, the cavern known as \'Arak Isma\'in, described by Hanauer (PEFS, 1886, 25), suits the requirements of the story better. The cavern, high up on the northern cliffs of the Wady Isma\'in, is a noticeable object from the railway as the train enters the gorge.``117';
isbe[3224]='Eternal`e-tur\'-nal (\'olam; aionios, from aion):<P>The word "eternal" is of very varying import, both in the Scriptures and out of them.<P>1. \'Olam:<P>In the Old Testament, the Hebrew word \'olam is used for "eternity," sometimes in the sense of unlimited duration, sometimes in the sense of a cycle or an age, and sometimes, in later Hebrew, in the signification of world. The Hebrew \'olam has, for its proper New Testament equivalent, aion, as signifying either time of particular duration, or the unending duration of time in general. Only, the Hebrew term primarily signified unlimited time, and only in a secondary sense represented a definite or specific period. Both the Hebrew and the Greek terms signify the world itself, as it moves in time.<P>2. Aion, Aionios:<P>In the New Testament, aion and aionios are often used with the meaning "eternal," in the predominant sense of futurity. The word aion primarily signifies time, in the sense of age or generation; it also comes to denote all that exists under time-conditions; and, finally, superimposed upon the temporal is an ethical use, relative to the world\'s course. Thus aion may be said to mean the subtle informing spirit of the world or cosmos—the totality of things. By Plato, in his Timaeus, aion was used of the eternal Being, whose counterpart, in the sense-world, is Time. To Aristotle, in speaking of the world, aion is the ultimate principle which, in itself, sums up all existence.. In the New Testament, aion is found combined with prepositions in nearly three score and ten instances, where the idea of unlimited duration appears to be meant. This is the usual method of expressing eternity in the Septuagint also. The aionios of <a onClick="return mV(\'2Cr\',4,18);">2Co 4:18</a> must be eternal, in a temporal use or reference, else the antithesis would be gone.<P>3. Aidios:<P>In <a onClick="return mV(\'Rom\',1,20);">Ro 1:20</a> the word aidios is used of Divine action and rendered in the King James Version "eternal" (the Revised Version (British and American) "everlasting"), the only other place in the New Testament where the word occurs being <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a>, where the rendering is "everlasting," which accords with classical usage. But the presence of the idea of eternal in these passages does not impair the fact that aion and aionios are, in their natural and obvious connotation, the usual New Testament words for expressing the idea of eternal, and this holds strikingly true of the Septuagint usage also. For, from the idea of aeonian life, there is no reason to suppose the notion of duration excluded. The word aionios is sometimes used in the futurist signification, but often also, in the New Testament, it is concerned rather with the quality, than with the quantity or duration, of life. By the continual attachment of aionios to life, in this conception of the spiritual or Divine life in man, the aeonian conception was saved from becoming sterile.<P>4. Enlargement of Idea:<P>In the use of aion and aionios there is evidenced a certain enlarging or advancing import till they come so to express the high and complex fact of the Divine life in man. In Greek, aiones signifies ages, or periods or dispensations. The aiones of <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>, and <a onClick="return mV(\'Hbr\',11,3);">11:3</A>, is, however, to be taken as used in the concrete sense of "the worlds," and not "the ages," the world so taken meaning the totality of things in their course or flow.<P>5. Eternal Life:<P>Our Lord decisively set the element of time in abeyance, and took His stand upon the fact and quality of life—life endless by its own nature. Of that eternal life He is Himself the guarantee—"Because I live, ye shall live also" (<a onClick="return mV(\'Jhn\',14,19);">Joh 14:19</a>). Therefore said Augustine, "Join thyself to the eternal God, and thou wilt be eternal."`<a href="./study/isbe/search.html?string=ETERNITY">ETERNITY</a>`96';
isbe[3225]='Eternity`e-tur\'-ni-ti (olam; Greek equivalent, aion):<P><b>Contents</b><P>1. Contrast with Time<P>2. In the Old Testament<P>3. In the New Testament<P>4. The Eternal "Now"<P>5. Defect of This View<P>6. Philosophical Views<P>7. Time Conceptions Inadequate<P>8. All Succession Present in One Act to Divine Consciousness<P>9. Yet Connection between Eternity and Time<P>10. The Religious Attitude to Eternity<P><b>LITERATURE</b><hr /><P>1. Contrast with Time:<P>Eternity is best conceived, not in the merely negative form of the non-temporal, or immeasurable time, but positively, as the mode of the timeless self-existence of the Absolute Ground of the universe. The flux of time grows first intelligible to us, only when we take in the thought of God as eternal—exalted above time. Timeless existence—being or entity without change—is what we here mean by eternity, and not mere everlastingness or permanence through time. God, in His internal being, is raised above time; in His eternal absoluteness, He is throned above temporal development, and knows, as the Scriptures say, no changeableness. The conception of eternity, as without beginning or ending, leaves us with but a negation badly in need of filling out with reality. Eternity is not a mere negative idea; to make of eternity merely a blank and irrelevant negation of temporality would not satisfy any proper theory of being; it functions as the positive relation to time of that eternal God, who is King of all the eons.<P>2. In the Old Testament:<P>In the Old Testament, God\'s eternity is only negatively expressed, as implying merely indefinitely extended time (<a onClick="return mV(\'Gen\',21,33);">Ge 21:33</a>; <a onClick="return mV(\'Deu\',33,27);">De 33:27</a>), though <a onClick="return mV(\'Isa\',40,28);">Isa 40:28</a> takes more absolute form. Better is the view of eternity, objectively considered, as a mode of being of God in relation to Himself. For He was eternal, while as yet the world and time were not. But even in the New Testament, the negative form of expression prevails.<P>3. In the New Testament:<P>Time, with its succession of events, helps to fill out such idea as we can form of the eternal, conceived as an endless progress. But, as finite beings, we can form no positive idea of eternity. Time is less contradictory of eternity, than helpful in revealing what we know of it. Plato, in his Timaeus, says that time is the "moving image of eternity," and we may allow that it is its type or revelation. Not as the annulment of time, though it might be held to be in itself exclusive of time, is eternity to be taken, but rather as the ground of its reality.<P>4. The Eternal "Now":<P>Eternity might, no doubt, be taken as just time no longer measured by the succession of events, as in the finite universe. But, on a strict view, there is something absurd in an eternity that includes time, and an eternity apart from time is a vain and impossible conception. Eternity, as a discharge from all time limits, is purely negative, though not without importance. Eternity, absolutely taken, must be pronounced incommensurable with time; as Aquinas said, non sunt mensurae unius generis. Eternity, that is to say, would lose its character as eternal in the very entering into relations with the changeful or becoming. Eternity, as in God, has, since the time of Augustine and the Middle Ages, been frequently conceived as an eternal Now. The Schoolmen were wont to adopt as a maxim that "in eternity is one only instant always present and persistent." This is but a way of describing eternity in a manner characteristic of succession in time; but eternal Deity, rather than an eternal Now, is a conception far more full of meaning for us.<P>5. Defect of This View:<P>To speak of God\'s eternity as an eternal Now—a present in the time-sense—involves a contradiction. For the eternal existence is no more described by the notion of a present than by a past or a future. Such a Now or present presupposes a not-now, and raises afresh the old time-troubles, in relation to eternity. Time is certainly not the form of God\'s life, His eternity meaning freedom from time. Hence, it was extremely troublesome to theology of the Middle Ages to have a God who was not in time at all, supposed to create the world at a particular moment in time.<P>6. Philosophical Views:<P>Spinoza, in later times, made the eternity of God consist in His infinite—which, to Spinoza, meant His necessary—existence. For contingent or durational existence would not, in Spinoza\'s view, be eternal, though it lasted always. The illusoriness or unreality of time, in respect of man\'s spiritual life, is not always very firmly grasped. This wavering or uncertain hold of the illusiveness of time, or of higher reality as timeless, is still very prevalent; even so strong-souled a poet as Browning projects the shadow of time into eternity, with rarely a definite conception of the higher life as an eternal and timeless essence; and although Kant, Hegel and Schopenhauer may have held to such a timeless view, it has by no means become a generally adopted doctrine so far, either of theologians or of philosophers. If time be so taken as unreal, then eternity must not be thought of as future, as is done by Dr. Ellis McTaggart and some other metaphysicians today. For nothing could, in that case, be properly future, and eternity could not be said to begin, as is often done in everyday life.<P>The importance of the eternity conception is seen in the fact that neo-Kantian and neo-Hegelian thinkers alike have shown a general tendency to regard time-conceptions as unfit, in metaphysics, for the ultimate explanation of the universe.<P>7. Time-Conceptions Inadequate:<P>Eternity, one may surely hold, must span or include, for God\'s eternal consciousness, the whole of what happens in time, with all of past, present or future, that lies within the temporal succession. But we are by no means entitled to say, as does Royce, that such wholeness or totality of the temporal constitutes the eternal, for the eternal belongs to quite another order, that, namely, of timeless reality. Eternity is not to be defined in terms of time at all. For God is to us the supra-temporal ens perfectissimum, but One whose timeless self-sufficiency and impassable aloofness are not such as to keep Him from being strength and helper of our temporal striving. Our metaphysical convictions must not here be of barren and unfruitful sort for ethical results and purposes.<P>8. All Succession Present in One Act to Divine Consciousness:<P>Eternity is, in our view, the form of an eternal existence, to which, in the unity of a single insight, the infinite series of varying aspects or processes are, together-wise, as a totum simul, present. But this, as we have already shown, does not imply that the eternal order is nowise different, essentially, from the temporal; time is not to be treated as a segment of eternity, nor eternity regarded as interminable duration; the eternal cannot pass over into the temporal; for, an eternal Being, who should think all things as present, and yet view the time-series as a succession, must be a rather self-contradictory conception. For the Absolute Consciousness, time does not exist; the future cannot, for it, be thought of as beginning to be, nor the past as having ceased to be.<P>9. Yet Connection Between Eternity and Time:<P>After all that has been said, however, eternity and time are not to be thought of as without connection. For the temporal presupposes the eternal, which is, in fact, its positive ground and its perpetual possibility. These things are so, if only for the reason that the Divine mode of existence does not contradict or exclude the human mode of existence. The continuity of the latter—of the temporal—has its guaranty in the eternal. The unconditioned eternity of God brings into harmony with itself the limitations and conditions of the temporal. For time is purely relative, which eternity is not. No distinctions of before and after are admissible in the eternity conception, hence, we have no right to speak of time as a portion of eternity. Thus, while we maintain the essential difference between eternity and time, we at the same time affirm what may perhaps be called the affinity between them. The metaphysics of eternity and its time-relations continue to be matter of proverbial difficulty, and both orders—the eternal and the temporal—had better be treated as concrete, and not left merely to abstract reflection. Our idea of the eternal will best be developed, in this concrete fashion, by the growth of our God-idea, as we more completely apprehend God, as actualized for us in His incarnate Son.<P>10. The Religious Attitude to Eternity:<P>Thus, then, it is eternity, not as immeasurable time, but rather as a mode of being of the immutable God, who is yet progressively revealing Himself in time, which we have here set forth. This is not to say that the religious consciousness has not its own need of the conception of God as being "from everlasting to everlasting," as in <a onClick="return mV(\'Psa\',90,2);">Ps 90:2</a>, and of His kingdom as "an everlasting kingdom" (<a onClick="return mV(\'Dan\',4,3);">Da 4:3</a>). Nor is it to make us suppose that the absolute and self-existent God, who so transcends all time-dependence, is thereby removed far from us, while, on the contrary, His very greatness makes Him the more able to draw near unto us, in all the plenitude of His being. Hence, it is so truly spoken in <a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>, "Thus saith the high and lofty One that inhabiteth eternity, whose name is Holy: I dwell in the high and holy place, with him also that is of a contrite and humble spirit, to revive the spirit of the humble, and to revive the heart of the contrite." Hence, also the profound truthfulness of sayings like that in <a onClick="return mV(\'Act\',17,27,28);">Ac 17:27-28</a>, "He is not far from each one of us: for in him we live, and move, and have our being." After all that has been said, our best knowledge of eternity, as it exists in God, is not developed in any metaphysical fashion, but after the positive and timeless modes of the spiritual life—the modes of trust and love.<P>LITERATURE.<P>H. Cremer, Lexicon of New Testament Greek, English edition, 1880; G. B. Winer, Grammar of New Testament Greek, 3rd edition, 1882; R. C. French, Synonyms of the New Testament, 9th edition, 1880; E. H. Plumptre, The Spirits in Prison, 3rd edition, 1885; J. Orr, Christian View of God and the World, lst edition, 1893; I. A. Dorner, System of Christian Doctrine, English edition, 1885; J. H. Stirling, Philosophy and Theology, 1890; J. Lindsay, Studies in European Philosophy, 1909; The Fundamental Problems of Metaphysics, 1910.``96';
isbe[3226]='Eth-Kazin`eth-ka\'-zin (\'ittah qatsin; the King James Version Ittah Kazin):<P>A town on the eastern border of Zebulun, mentioned between Gath-hepher and Rimmon (<a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>). The site is not identified. "Ittah" of the King James Version is due to misunderstanding of the Hebrew letter "he" locale.``1';
isbe[3227]='Etham`e\'-tham (\'etham; Othom, <a onClick="return mV(\'Exd\',13,20);">Ex 13:20</a>; Bouthan, <a onClick="return mV(\'Num\',33,6,7);">Nu 33:6-7</a>; in <a onClick="return mV(\'Num\',33,8);">33:8</a> the Septuagint has a different reading, "in their wilderness" showing another pointing for the word):<P>The name used to be explained as the Coptic Atium, "border of the Sea" (Gesenius, Lexicon, under the word) which would agree with the Hebrew (<a onClick="return mV(\'Num\',33,8);">Nu 33:8</a>) where the "wilderness of Etham" is noticed instead of that of Shur (<a onClick="return mV(\'Exd\',15,22);">Ex 15:22</a>) east of the Red Sea (see <a href="./study/isbe/search.html?string=SHUR">SHUR</a>). At Etham (<a onClick="return mV(\'Exd\',13,20);">Ex 13:20</a>), the Hebrews camped in the "edge," or at "the end," of the desert west of the sea that they were to cross (see <a href="./study/isbe/search.html?string=EXODUS,+THE">EXODUS</a>). This camp was probably near the north end of the Bitter Lakes, a march from Succoth. Brugsch (Hist. Egypt, II, 359) would compare Etham with the Egyptian Khetam ("fort"), but the Hebrew word has no guttural. The word Khetam is not the name of a place (see Pierret, Vocab. hieroglyph., 453), and more than one such "fort" seems to be noticed (see <a href="./study/isbe/search.html?string=PITHOM">PITHOM</a>). In the reign of Seti II a scribe\'s report mentions the pursuit of two servants, apparently from Zoan, to the fortress of I-k-u southward, reaching Khetam on the 3rd day; but if this was the "Khetam of Rameses II," or even that "of Minepthah," it would not apparently suit the position of Etham.`<a href="./study/isbe/search.html?string=MIGDOL">MIGDOL</a>`28';
isbe[3228]='Ethan`e\'-than (\'ethan, "firm," "enduring"; Gaithan):<P>(1) A wise man with whom Solomon is compared (<a onClick="return mV(\'1Ki\',4,31);">1Ki 4:31</a>). Called there "Ethan the Ezrahite," to whom the title of <a onClick="return mV(\'Psa\',89,\'1-\');">Ps 89</a> ascribes the authorship of that poem.<P>(2) A "son of Kishi," or "Kishaiah," of the Merari branch of the Levites, and, along with Heman and Asaph, placed by David over the service of song (<a onClick="return mV(\'1Ch\',6,44);">1Ch 6:44</a>; <a onClick="return mV(\'1Ch\',15,17,19);">15:17, 19</a>).<P>(3) An ancestor of Asaph of the Gershomite branch of the Levites (<a onClick="return mV(\'1Ch\',6,42);">1Ch 6:42</a>).`<a href="./study/isbe/search.html?string=JEDUTHUN">JEDUTHUN</a>`1';
isbe[3229]='Ethanim`eth\'-a-nim (\'ethanim):<P>The seventh month of the Jewish year (<a onClick="return mV(\'1Ki\',8,2);">1Ki 8:2</a>). The word is of Phoenician origin and signifies "perennial," referring to living streams. It corresponds to September-October.`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>; <a href="./study/isbe/search.html?string=TIME">TIME</a>`1';
isbe[3230]='Ethanus`e-tha\'-nus, the King James Version Ecanus (Apocrypha):<P>One of the scribes who wrote for forty days at the dictation of Ezra (2Esdras 14:24).``1';
isbe[3231]='Ethbaal`eth-ba\'-al, eth\'-ba-al (\'ethba\'al, "with Baal"):<P>"King of the Sidonians," and father of Jezebel whom Ahab king of Israel took to wife (<a onClick="return mV(\'1Ki\',16,31);">1Ki 16:31</a>).``1';
isbe[3232]='Ether`e\'-ther (\'ether; Ather):<P>A town in Judah (<a onClick="return mV(\'Jos\',15,42);">Jos 15:42</a>), near Libnah, assigned to Simeon (<a onClick="return mV(\'Jos\',19,7);">Jos 19:7</a>). Kh. el \'Atr (identical in spelling with Ether) is possibly the site.<P>It is near Beit Jibrin and is described as "an ancient site: cisterns, foundations, quarried rock and terraces" (PEF, III, 261, 279).``1';
isbe[3233]='Ethics of Jesus`eth\'-iks:<P>Contents<p><b>I. IN THE SYNOPTIC GOSPELS</b><P class="in15">1. The Blessings of the Kingdom<P class="in30">(1) Nature of the Kingdom<P class="in30">(2) Blessedness of the Kingdom<P class="in30">(3) Righteousness—Its Contrasts<P class="in30">(4) Apocalyptic Theories<P class="in15">2. The Character of the Subjects of the Kingdom<P class="in30">(1) Condition of Entrance<P class="in30">(2) Christ\'s Attitude to Sin<P class="in30">(3) Attainment of Righteousness<P class="in45">(a) Repentance<P class="in45">(b) Faith "Coming" to Christ<P class="in45">(c) Imitation of Christ—Service Example of Jesus<P class="in15">3. Commandments of the King<P class="in30">The Great Commandments<P class="in45">(a) Love to God God\'s Worship, etc. The Church<P class="in45">(b) Duty to Man Exemplified in Christ The New Motives<P><b>II. IN THE FOURTH GOSPEL</b><P class="in15">1. Eternal Life<P class="in15">2. Its Source in God<P class="in15">3. Through the <span class="noTag">Son</span><P class="in15">4. Need of New Birth<P class="in15">5. Nature of Faith<P class="in15">6. Fruits of Union with Christ<P><b>LITERATURE</b><hr /><P>I. In the Synoptic Gospels.<P>If, following the custom prevalent at present, we adopt, as the general name for the teaching of Jesus in the Synoptists, the Kingdom of God, then the divisions of His ethical teaching will be (1) the Blessings of the Kingdom, (2) the Character of the Subjects, (3) the Commandments of the King.<P>1. The Blessings of the Kingdom:<P>(1) Nature of the Kingdom.<P>"The Kingdom of God" was not a phrase invented by Jesus. It was used before Him by the Baptist. Its proximate source, for both Jesus and John, was the prophet Daniel, who uses it in very striking passages (<a onClick="return mV(\'Dan\',2,44,45);">2:44,45</a>; <a onClick="return mV(\'Dan\',13,14);">7:13,14</a>). The idea of a kingdom of God goes back to the very commencement of the monarchy in Israel, when the prophet Samuel told those who demanded a king that Yahweh was their king, and that they should desire no other. Through all the subsequent history of the monarchy, which was, on the whole, so disappointing to patriotic and pious minds, the conviction lingered that, if God Himself were king, all would be well; and, when at length the Hebrew state was destroyed and the people were carried into captivity, the prophets still believed that for their country there was a future and a hope, if only Yahweh would take to Himself His great power and reign. In the period between the Old Testament and the New Testament such sentiments so greatly prevailed that Schurer has compiled, from the apocryphal literature, a kind of Messianic creed, embracing no fewer than eleven articles, which he supposes to have prevailed before the Advent. It may be doubtful how far such beliefs had taken possession of the general mind. Many of the Sadducees were too satisfied with things as they were to concern themselves about such dreams. But the Pharisees undoubtedly gave a large place in their minds to Messianic expectations, and for these the Zealots were ready to fight. It is, however, to the prosdechomenoi, as they are called, because they were "waiting for the consolation of Israel," that we must look for the purest expression of this heritage derived from the piety of the past. In the hymns at the beginning of the Gospels of Matthew and Luke, with which the birth of Jesus was greeted, we encounter an intense and lofty conception of the kingdom of God; and, as the earthly home in which Jesus grew up belonged to this select section of the population, there is little doubt that it was here He imbibed both His Messianic ideas and the phraseology in which these were expressed. His use of the term, the kingdom of God, has sometimes been spoken of as an accommodation to the beliefs and language of His fellow-countrymen. But it was native to Himself; and it is not unlikely that the very commonness of it in the circle in which He grew up rendered Him unconscious of the difference between His own conception and that which prevailed outside of this circle. For, as soon as He began to preach and to make known the sentiments which He included within this phrase, it became manifest that He and His contemporaries, under a common name, were thinking of entirely different things.<P>They emphasized the first half of the phrase—"the kingdom"; He the second—"of God." They were thinking of the external attributes of a kingdom—political emancipation, an army, a court, subject provinces; He of the doing of God\'s will on earth as it is done in heaven. Even He had felt, at one stage, the glamor of their point of view, as is manifest from the account of the Temptation in the Wilderness; but He had decisively rejected it, resolving not to commence with an external framework on a large scale, to be subsequently filled with character, but to begin with the individual, and trust to time and Providence for visible success. The triumphal entry into Jerusalem proves that He never abandoned the claim to be the fulfiller of all the Old Testament predictions about the kingdom of God; but His enemies not unnaturally interpreted the failure of that attempt as a final demonstration that their own view had been the correct one all along. Still, God was not mocked, and Jesus was not mocked. When, at the end of a generation, the Jewish state sank into ruin and the city by which Jesus was martyred had been destroyed, there were springing up, all over the world, communities the members of which were bound more closely to one another than the members of any other kingdom, obeyed the same laws and enjoyed the same benefits, which they traced up to a King ruling in the heavens, who would appear again on the great white throne, to be the Judge of quick and dead.<P>(2) Blessedness of the Kingdom.<P>The enemies of Jesus may be said to have carried out to the bitter end their conception of the kingdom of God, when they nailed Him to a tree; but, in the face of opposition, He carried out His own conception of it too, and He never abandoned the practice of employing this phrase as a comprehensive term for all the blessings brought by Him to mankind. He used, however, other nomenclature for the same objects, such as Gospel, Peace, Rest, Life, Eternal Life, Blessedness. His exposition of the last of these, at the commencement of the Sermon on the Mount, is highly instructive. Seldom, indeed, has the structure of the Beatitudes been clearly understood. Each of them is an equation, in which "blessed" stands on the one side and on the other two magnitudes—the one contained in the subject of the sentence, such as "the poor in spirit," "the meek," and so on; and the other contained in a qualifying clause introduced by "for." Sometimes one of these magnitudes may be a minus quantity, as in "they that mourn"; but the other is so large a positive magnitude that the two together represent a handsome plus, which thoroughly justifies the predicate "blessed." It is remarkable that the first and the eighth of the reasons introduced by "for" are the same: "for theirs is the kingdom of heaven," justifying the statement that this is Christ\'s own name for the blessedness brought by Him to the world; and the sentences between these, introduced in the same way, may be looked upon as epexegetic of this great phrase. They embrace such great conceptions as comfort, mercy, the inheritance of the earth, the vision of God and sonship, which are all certainly blessings of the kingdom; and the list does not finish without mentioning a great reward in heaven—an immortal hope, which is the greatest blessing of all.<P>(3) Righteousness—Its Contrasts.<P>If the preacher of the Sermon on the Mount was to expound at length any one of these bright conceptions, it might have been expected to be the kingdom of God itself; and this we should have desired. But the one to which this honor fell has still to be mentioned. It is "righteousness." In one of the Beatitudes the speaker had promised that to be filled with this should be part of the blessedness which He was expounding; and, when He had finished the Beatitudes, He turned back to this conception and devoted the rest of His discourse to its interpretation. Nowhere else, in the reports of His preaching which have come down to us, is there to be found an exposition so sustained and thorough. There is no better way of describing a new thing, with which those who listen are unfamiliar, than to contrast it with something with which they are perfectly acquainted; and this was the method adopted by Jesus. He contrasted the righteousness with which the subjects of the kingdom were to be blessed with the figure of the righteous man familiar to them, first, in the discourses of the scribes, to which they were wont to listen in the synagogue, and secondly, in the example of the Pharisees, to whom they were wont to look up as the patterns of righteousness. It is well known what ample opportunities He found, by means of this felicitous disposition, for probing to the very depths of morality, as well as for covering His opponents with ridicule and exploding the honor in which they stood with the masses. The whole of this scheme is, however, exhausted long before the Sermon comes to a close; and the question is, whether, in the latter half of the Sermon, He still keeps up the exposition of righteousness by contrasting it with the ordinary course of the world. I am inclined to think that this is the case, and that the key to the latter half of the discourse is the contrast between righteousness and worldliness. The doctrine, at all events, which issues from the whole discussion is that the righteousness promised is distinguished by three characteristics—inwardness, as distinguished from the externality of those who believed morality to extend to outward words and deeds alone, and not to the secret thoughts of the heart; secrecy, as distinguished from the ostentation of those who blew a trumpet before them when they were doing their alms; and naturalness, like that of the flower or the fruit, which grows spontaneously from a healthy root, without forcing.<P>See <a href="./study/isbe/search.html?string=SERMON+ON+THE+MOUNT">SERMON ON THE MOUNT</a>.<P>(4) Apocalyptic Theories. This substitution of righteousness for the kingdom in the greatest public discourse which has come down to us is a significant indication of the direction in which the mind of Jesus was tending, as He drew away from the notions and hopes of contemporary Judaism. It is evident that He was filling the idea of the kingdom more and more with religious and moral contents, and emptying it of political and material elements. There are scholars, indeed, at the present day, who maintain that His conception of the kingdom was futuristic, and that He was waiting all the time for an apocalyptic manifestation, which never came. He was, they think, expecting the heavens to open and the kingdom to descend ready made to the earth, like the New Jerusalem in the Apocalypse. But this is to assume toward Jesus exactly the attitude taken up toward Him in His own day by Pharisees and high priests, and it degrades Him to the level of an apocalyptic dreamer. It ignores many sayings of His, of which the parable of the Mustard Seed may be taken as an example, which prove that He anticipated for Christianity a long development such as it has actually passed through; and it fails to do justice to many passages in His teaching where He speaks of the kingdom as already come. Of the latter the most remarkable is where He says, "The kingdom of God is within you"—a statement preceded by a distinct rejection of the notion of an apocalyptic manifestation; for the word "observation," which He employs in describing the way in which the kingdom is not to come, is an astronomical term, describing precisely such a phenomenon as He is supposed by such scholars as John Weiss and Schweitzer to have been expecting. The more it became evident that He was not to command the homage of the nation, the more did He devote Himself to the education of the Twelve, that they might form the nucleus of His kingdom upon earth; and it was certainly not with apocalyptic visions that He fed their receptive minds.<P>2. The Character of the Subjects of the Kingdom:<P>(1) Conditions of Entrance.<P>The righteousness described so comprehensively in the Sermon on the Mount is not infrequently spoken of as the condition of entrance to the kingdom of God; but this is altogether to misunderstand the mind of Jesus. The righteousness described by Him is the gift of God to those who are already inside the kingdom; for it is the supreme blessing for the sake of which the kingdom is to be sought; and the condition imposed on those who are outside is not the possession of righteousness, but rather a bottomless sense of the want of it. The more utterly they feel their own lack of righteousness, the more ready are they for entrance into the kingdom. They must "hunger and thirst after righteousness." It has been remarked already that the description, in the Beatitudes, of the character of the candidates for the kingdom is sometimes of a negative character; and indeed, this is the account in the teaching of Jesus generally of those whom He attracts to Himself. They are drawn by a sense of boundless need in themselves and by the apprehension of an equivalent fullness in Him; He calls those "that labor and are heavy laden," that He may give them rest.<P>(2) Christ\'s Attitude to Sin.<P>The first word of the prophetic message in the Old Testament was always the denunciation of sin; and only after this had done its work did the vision of a good time coming rise on the horizon. The same was repeated in the message of John the Baptist; and it did not fail to reappear in the teaching of Jesus, though His mode of treating the subject was entirely His own. He did not, like the prophets, take up much time with convicting gross and open sinners. Perhaps He thought that this had been sufficiently done by His predecessors; or, perhaps He refrained because He understood the art of getting sinners to convict themselves. Yet, in the parable of the Prodigal Son, He showed how profoundly He understood the nature and the course of the commonest sins. If, however, He thus spared transgressors who had no covering for their wickedness, He made up for this leniency by the vigor and even violence with which He attacked those who hid their sins under a cloak of hypocrisy. Never was there a prophetic indignation like that with which He assailed such sinners in <a onClick="return mV(\'Mat\',23,\'1-\');">Mt 23</a>; and He shaped the same charges into an unforgettable picture in the parable of the Pharisee and the Publican. He never named the Sadducees in the same unreserved manner as He thus designated their antagonists; but in more parables than one it is possible that He had them in view. The Unjust Judge was probably a Sadducee; and so was the Rich Man at whose gate the beggar Lazarus was wont to sit. The sin of the Sadducees, at all events, did not escape His prophetic animadversion. In Luke especially He alludes with great frequency to worldliness and the love of money as cankers by which the life of the human soul is eaten out and its destiny destroyed. Thus did Jesus exercise the prophetic office of denouncing all the sins of His time; and He showed what, in this respect, He thought of mankind in general when He began a sentence with, "If ye then, being evil" (<a onClick="return mV(\'Luk\',11,13);">Lu 11:13</a>), and when He gave the dreadful description of the heart of man which begins, "Out of the heart come forth evil thoughts" (<a onClick="return mV(\'Mat\',15,19);">Mt 15:19</a>).<P>(3) Attainment of Righteousness.<P>To all serious students of the Sermon on the Mount it is well known that the popular notion of it, as containing a simple religion and an easy-going morality, is utterly mistaken; on the contrary, the righteousness sketched by the Preacher is far loftier than that ever conceived by any other religious teacher whatever. Not only, however, does He thus propose to conduct human beings to a platform of attainment higher than any attempted before, but He, at the same time, recognizes that He must begin with men lower than almost any others have allowed. It is here that the ethics of Jesus differ from those of the philosophers. He takes the task much more seriously; and, as the ascent from the one extreme to the other is much longer, so the means of reaching the goal are much more difficult. Philosophers, assuming that man is equal to his own destiny, lay the demands of the moral law before him at once, taking it for granted that he is able to fulfill them; but the path adopted by Jesus is more remote and humbling. There are in it steps or stages which, in His teaching, it is easy to discern.<P>(a) Repentance:<P>The first of these is repentance. This was a watchword of all the prophets: after sin had been denounced, penitence was called for; and no hope of improvement was held out until this had been experienced. In the message of John the Baptist it held the same place; and, in one of the Gospels, it is expressly stated that Jesus began His ministry by repeating this watchword of His predecessor. Not a few of the most touching scenes of His earthly ministry exhibit penitents at His feet, the most moving of them all being that of the woman who was "a sinner"; and, in the parable of the Prodigal Son, we have a full-length picture of the process of repentance.<P>(b) Faith:<P>The second step is faith—a word of constant recurrence in the teaching Of Jesus. In many cases it is connected with His healing ministry; but this was a parable of a more interior ministry for the soul. In many cases it formed a school of preparation for the other, as in the case of the man borne of four, who was brought to Christ for the healing of his body, but was presented, in addition, with the gift of the forgiveness of his sins. In healing him Jesus expressly claimed the power of forgiving sins; and, in His great saying at the institution of the Lord\'s Supper, He showed the connection which this was to have with His own death.<P>(c) Imitation of Christ—Service:<P>Instead of speaking of faith and of believing, Jesus frequently spoke of "coming" to Himself; and then followed the invitation to "follow" Him, which, accordingly, is the third stage. Following Him meant, in many cases, literally leaving home and occupation, in order to accompany Him from place to place, as He journeyed through the land; and, as this involved sacrifice and self-denial, He frequently combined with "following" the invitation to take up "the cross." But by degrees this literal meaning dropped away from the invitation, or at least became secondary to that of imitation, which must be the only meaning when Paul, adopting the language of his Master, calls upon men and women to be "followers" of him, as he was of Christ. It is seldom that Jesus, in so many words, calls upon others to imitate Himself; indeed, He does so less frequently than Paul; but it is implied in following Him, if not literally expressed; and it was a direct consequence of keeping company with Him and coming under the influence of His example. It is highly characteristic that, in the only place where He directly calls upon others to "learn" from Him, the virtue to which He draws attention is meekness—"Learn of me; for I am meek and lowly in heart." The same quality was often emphasized by Him, when He was describing the character which He wished to see exhibited by others, "For every one that exalteth himself shall be humbled; and he that humbleth himself shall be exalted" (<a onClick="return mV(\'Luk\',14,11);">Lu 14:11</a>). In spite, however, of the importance thus attached by Him to humility, He not only combined with it, as has been pointed out by Bushnell, in his famous chapter on the character of Christ in Nature and the Supernatural, the most stupendous personal claims, but also attributed to His followers a position of personal distinction among men, and called upon them to perform services far beyond the reach of ordinary mortals, saying to them, "Ye are the salt of the earth," "Ye are the light of the world," and ordering them to make disciples of all nations. The principle by which this apparent contradiction is bridged over is another favorite idea of His teaching, namely, Service. He who is able to serve others on a large scale is, in a sense, superior to those he serves, because he is furnished with the resources of which they stand in need; yet he places himself beneath them and forgets his own claims in ministering to their necessities. There are few of the utterances of Jesus in which the very genius of His ethical system is more fully expressed than that in which He contrasts greatness as it is conceived among men of the world with greatness as He conceives it and His followers must learn to conceive it: "Ye know that the princes of the Gentiles exercise dominion over them, and they that are great exercise authority upon them. But it shall not be so among you: but whosoever will be great among you, let him be your minister; and whosoever will be chief among you, let him be your servant." Of this difficult rule, He was able to add, He Himself had given, and was still to give, the most perfect illustration; for "even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many" (<a onClick="return mV(\'Mat\',20,25);">Mt 20:25</a>ff the King James Version).<P>This reminds us that, while the character of the subjects of the kingdom is to be learned from the words of Jesus, it may be also derived from His example. That which He demanded from others He fulfilled in His own conduct; and thus the dry precepts of the moral law were invested with the charm of a living personality. Brief as the records of His life are, they are wonderfully rich in instruction of this kind; and it is possible, by going through them with study and care, to form a clear image of how He bore Himself in all the departments of human life—in the home, in the state, in the church, as a friend, in society, as a man of prayer, as a student of Scripture, as a worker, as a sufferer, as a philanthropist, as a winner of souls, as a preacher, as a teacher, as a controversialist, and so on. This is the modern imitation of Christ—that of the details of His earthly existence—the Imitation of a Kempis was an imitation of the cosmical history of the Son of God, as He moves on His Divine mission from heaven to the cross and back to the throne of the universe. See the writer\'s Imago Christi.<P>3. Commandments of the King:<P>The Great Commandments.<P>In accordance with Scriptural usage, Jesus called by the name of "commandments" those actions which we call "duties"; and He has made this part of our subject easy by reducing the commandments to two: "Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind. This is the great and first commandment. And a second like unto it is this, Thou shalt love thy neighbor as thyself" (<a onClick="return mV(\'Mat\',22,\'37-39\');">Mt 22:37-39</a>). He did not invent either of these commandments; for both occur in the Old Testament (<a onClick="return mV(\'Deu\',6,5);">De 6:5</a>; <a onClick="return mV(\'Lev\',19,18);">Le 19:18</a>). There, however, they lie far apart and are buried out of sight. The second of them was still more deeply buried under a misinterpretation of the scribes, to which reference is made in the Sermon on the Mount. Jesus rescued them from oblivion; He showed the vital and indissoluble connection between the sentiments which they enforce—love of God and love of man—which had been long and violently separated; and He lifted them up into the firmament of ethics, to shine forever as the sun and moon of duty.<P>(a) Love to God:<P>It has been denied by some writers on Christian ethics that there can be any such thing as duties to God, and by writers on philosophical ethics love to God is not generally regarded as coming within the scope of their science. But the duty of man is concerned with all the objects, and especially all the beings, he is related to; and to Jesus the outflow of man\'s heart toward Him who is the author of his being and the source of all his blessings seemed the most natural of actions. "I love Yahweh" was a sentiment to which mankind had risen even in the Old Testament (<a onClick="return mV(\'Psa\',116,1);">Ps 116:1</a>), where it corresponds with not a few expressions of the Divine love equally fervent; and it is not a figure of speech at all when Jesus demands love for His Father from heart and soul, strength and mind.<P>Love to God involves, however, love to what may be called the Things of God, toward which Jesus always manifested tenderness and honor. Those who are not themselves ecclesiastically minded have, indeed, taken it for granted that Jesus<P>was indifferent, if not hostile, to the objects and actions by which the Almighty is honored; and it is often said that the only service of God which mattered in His eyes was the service of man. But, although, like the prophets before Him, Jesus exposed with withering rebuke the hypocrisy of those who put ritual in the place of righteousness, it requires no more than a glance at His sayings, and the other records of His life, to perceive that His mind was occupied no less with duties to God than with duties to men; indeed, the former bulk more largely in His teaching. The only arrangement of religion with which He seems out of sympathy is the Sabbath; but this was due to a peculiarity of the times; and it is quite conceivable that in other circumstances He might have been a strenuous supporter of Sabbath observance. If there had been in His day a Sadducean attempt to rob the people of the day of rest, He would have opposed it as strenuously as He did the Pharisaic attempt to make it a burden and a weariness to the common man. By declaring the Sabbath to have been made for man (<a onClick="return mV(\'Mar\',2,27);">Mr 2:27</a>) He recognized that it was instituted at the beginning and intended for the entire course of man\'s existence upon earth. With the other things of God, such as His House, His Word, and His Worship, He manifested sympathy equally by word and deed; He frequented both the Temple and the synagogue; so imbued was His mind with the lit of the Old Testament that He spoke habitually in its spirit and phraseology, having its figures and incidents perfectly at command; and by both precept and example He taught others to pray.<P>Nothing is commoner than the statement that Jesus had nothing to do with the founding of the church or the arrangement of its polity; but this is a subjective prejudice, blind to the facts of the case. Jesus realized that the worship of the Old Testament was passing away, but He was Himself to replace it by a better order. He did not merely breathe into the air a spirit of sweetness and light; if this had been all He did, Christianity would soon have vanished from the earth; but He provided channels in which, after His departure, His influence should flow to subsequent generations. Not only did He found the church, but He appointed the most important details of its organization, such as preaching and the sacraments; and He left the Twelve behind Him not only as teachers, but as those who were able to instruct other teachers also. There may be ecclesiastical arrangements which are worked in a spirit far removed from the love of God; and such are of course contrary to the mind of Christ; but the love of God, if it is strong, inevitably overflows into the things of God, and cannot, in fact, permanently exist without them.<P>(b) Duty to Man:<P>As has been hinted above, the sayings of our Lord about the
