d in the time of Jacob (<a onClick="return mV(\'Gen\',47,11);">Ge 47:11</a>), and since it is impossible to suppose that Jacob lived in the time of Rameses II, the followers of Lepsius are obliged to regard this notice as an anachronism, which destroys their case, as it might equally be an anachronism in the account of the Exodus, though it is probably correct.<P>2. 2nd Argument: Manetho\'s Statements:<P>The second argument is based on the account by Manetho of the expulsion of leprous and unclean tribes from Egypt. Manetho was an Egyptian priest who wrote about 268 BC, and who evidently hated the Jews. His account only reaches us secondhand through Josephus (Apion, I,14,15, 26-31), this Hebrew author rejecting it as fabulous. Manetho apparently said that, after the Hyksos kings had ruled for 511 years, and had fortified Avaris (see <a href="./study/isbe/search.html?string=ZOAN">ZOAN</a>), they agreed with King Thummosis to leave Egypt, and went through the desert to Jerusalem, being afraid of the Assyrians (who had no power in Palestine at this time). He continued to relate that, after Armesses Miamon (Rameses II) had ruled 66 years, he was succeeded by an Amenophis whom Josephus calls a "fictitious king"—and rightly so since the name does not occur in the XIXth Dynasty. Apparently Minepthah was meant—though perhaps confused with Amenophis II—and he is said by Manetho to have sent the leprous people to quarries east of the Nile, but to have allowed them later to live in Avaris where the shepherds had been. They were induced by Osarsiph, a priest of Heliopolls, to renounce the Egyptian gods, and this Osarsiph Manetho identified with Moses. They then induced the shepherds who had been expelled by Thummosis to return from Jerusalem to Avaris, and Amenophis fled to Memphis and Ethiopia. His son Rhampses (apparently Rameses III is meant) was sent later to expel the shepherd and polluted people, whom he met at Pelusium and pursued into Syria. This story Josephus discredits, remarking: "I think therefore that I have made it sufficiently evident that Manetho, while he followed his ancient records, did not much mistake the truth of the history, but that, when he had recourse to fabulous stories without any certain author, he either forged them himself without any probability, or else gave credit to some men who spoke so out of their ill will to us"—a criticism sounder than that of Lepsius, who prefers the libelous account of a prejudiced Egyptian priest of the 3rd century BC, identifying Moses with a renegade priest of Heliopolis named Osarsiph, to the ancient Hebrew records in the Bible.<P>3. Relation of Manetho\'s Stories to the Exodus:<P>A thread of truth underlay Manetho\'s stories, but it has nothing to do with the Exodus, and the details to be found on Egyptian monuments do not agree with Manetho\'s tale. The Hyksos rulers were not expelled by any Thothmes, but by Aahmes who took Avaris about 1700 BC, and who reopened the quarries of the Arabian chain. Minepthah, about 1265 BC, was attacked in Egypt by Aryan tribes from the North, who had nothing to do with Hyksos chiefs, being Lycians, Sardians and Cilicians. He repelled them, but they again attacked Rameses III (about 1200 BC), and were again driven to the North. No mention of Israel occurs in connection with any of these events.<P>4. Greek and Latin Writers:<P>The story of the leprous Jews was, however, repeated by other Greek writers. Cheremon (see Josephus, Apion I, 32) says that Rameses, the son of Amenophis, defeated and expelled a diseased people led against him, at Pelusium, by Tisithen and Petesiph, whom he identified with Moses and Joseph. Lysimachus said that a scabby people were led by Moses through the desert by Judea and Jerusalem in the time of Bocchoris (735 BC). Diodorus Siculus (Fr. of Bk, 34) repeats the tale, about 8 BC, saying that lepers were driven out of Egypt, and were led by Moses who founded Jerusalem, and "established by law all their wicked customs and practices," and again (Fr. of Bk, 40) that strangers in Egypt caused a plague by their impurity, and being driven out were led by Moses. Tacitus, about 100 AD (Hist, v. ii), believed the Jews to have fled from Crete to Libya and, being expelled from Egypt, to have been led by their "Captains Jerusalem and Judah." Again he says (v. iii) that under Bocchoris (735 BC) there was sickness in Egypt, and that the infected being driven out were led by Moses, and reached the site of their temple on the 7th day.<P>5. Condition of Egypt under Minepthah:<P>No true critic of the present time is likely to prefer these distorted accounts of the Exodus, or any of the Greek and Roman calumnies leveled against the hated Jews, to the simple narration of the Exodus in the Bible. The historic conditions in the 5th year of Minepthah were very different from those at the time of Moses. The invaders of Egypt reached Belbeis and Heliopolis (see Brugsch, History of Egypt, II, 117), and Minepthah states, in his text on the wall of the temple of Amon at Thebes, that he had to defend Hellopolls and Memphis against his foes from the East. The region was then "not cultivated but was left as pasture for cattle, on account of the foreigners. It lay waste from the time of our forefathers." The kings of upper Egypt remained in their entrenchments, and the kings of lower Egypt were besieged in their cities by warriors, and had no mercenaries to oppose them. But Israel, as Minepthah himself has told us now, was in Palestine, not in Egypt, in this year of his reign; and, far from desiring to expel Asiatic pastoral peoples, the same Pharaoh encouraged their immigration into the region of Goshen (see <a href="./study/isbe/search.html?string=PITHOM">PITHOM</a>) laid waste by the Aryan raid.<P>6. Explanations of Minepthah\'s Statements:<P>Objections to the view that the Exodus occurred two centuries and a half before the reign of Minepthah began, and attempts to explain away the statements on his monuments require some notice.<P>(1) Pithom was Heroopolis. The first of these objections is due to the belief that Pithom was Heroopolis, and was a city founded by Rameses II; but this (see <a href="./study/isbe/search.html?string=PITHOM">PITHOM</a>) is too hazardous a conclusion to suffice for the entire neglect of Old Testament chronology which it involves, since the site of this city is still very doubtful.<P>(2) Rameses II Not Named in Judges.<P>A second objection is made, that the Old Testament shows complete ignorance of Egyptian history if it makes Rameses II contemporary with Judges because he is not named in that book. But Old Testament references to foreign history are always very slight, while on the other hand it is quite probable that there are allusions, in this book, to the events which took place in the reigns of Rameses II, and of Minepthah. The Hebrews were then confined to the mountains (<a onClick="return mV(\'Jdg\',1,19);">Jud 1:19</a>) and the Egyptians to the plains. No Pharaoh is mentioned by name in the Old Testament till the time of Rehoboam. In his 8th year Rameses II took various towns in Galilee including Salem (North of Taanach), Merom, Beth-Anath, Anem and Dapur (Daberath at the foot of Tabor). The revolt of Barak probably occurred about the 25th year of Rameses II, and began at Tabor. In the So of Deborah (<a onClick="return mV(\'Jdg\',5,2);">Jud 5:2</a>), the first words (bi-pheroa\' pera\'oth), rendered by the Septuagint (Alex MS) "when the rulers ruled," may be more definitely translated "when the Pharaohs were powerful," especially as Sisera—who commanded the Canaanite forces—bears a name probably Egyptian (ses-Ra, or "servant of Ra"), and may have been an Egyptian resident at the court of Jabin. So again when, about 1265 BC, Minepthah says that "Israel is ruined, it has no seed," the date suggests the time of Gideon when wild tribes swarmed over the plains, "and destroyed the increase of the earth, till thou come unto Gaza, and left no sustenance in Israel" (<a onClick="return mV(\'Jdg\',6,4);">Jud 6:4</a>). The Midianites and Amalekites may have then joined the tribes from Asia Minor who, in the 5th year of Minepthah, ruined the Hittites and invaded the Delta.<P>(3) Some Hebrews Were Never in Egypt.<P>But another explanation of the presence of Israel in this year on the line of Minepthah\'s pursuit of these tribes after their defeat has been suggested, namely, that some of the Hebrews never went to Egypt at all. This of course contradicts the account in the Pentateuch (<a onClick="return mV(\'Exd\',1,\'1-5\');">Ex 1:1-5</a>; <a onClick="return mV(\'Exd\',12,41);">12:41</a>) where we read that all Jacob\'s family (70 men) went down to Goshen, and that "all the hosts of the Lord" left Egypt at the Exodus; but it is supposed to be supported by a passage (<a onClick="return mV(\'1Ch\',7,21);">1Ch 7:21</a>) where we read of one of the sons of Ephraim "whom the men of Gath born in the land slew, because they came down to take away their cattle." Ephraim however was born in Egypt (<a onClick="return mV(\'Gen\',41,52);">Ge 41:52</a>), and his sons and "children of the third generation" (<a onClick="return mV(\'Gen\',50,23);">Ge 50:23</a>) remained there. The meaning no doubt is that men of Gath raided Goshen; and there were probably many such raids by the inhabitants of Philistia during the times of the Hyksos kings, similar to those which occurred in the time of Minepthah and of Rameses III. The objections made to the Old Testament date for the Exodus early in the reign of Amenophis III, or in that of his predecessor Thothmes IV, thus appear to have little force; and the condition of Egypt before the 5th year of Minepthah was unlike that which would have existed at the time of the Exodus. The theory of Lepsius was a purely literary conjecture, and not based on any monumental records. It has been falsified by the evidence of monuments found during the last 20 years, and these are fully in accord with the history and chronology of the Old Testament.<P>IV. The Numbers.<P>1. Colenso\'s Criticism of Large Number:<P>The historic difficulty with respect to the Exodus does not lie in the account of plagues natural to Egypt even now, nor in the crossing of the Red Sea, but in a single statement as to the numbers of Israel (<a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a>), \'about 600,000 footmen—strong men—with many children, and also many wanderers.\' The women are not mentioned, and it has been supposed that this represents a host of 2,000,000 emigrants at least. The objection was urged by Voltaire, and the consequences were elaborately calculated by Colenso. Even if 600,000 means the total population, the "heroes," or "strong men on foot" would, it is urged, have been as numerous as the largest Assyrian army (120,000 men) employed in the conquest of Syria. With an army of more than half a million Moses would have held control over Egypt and Palestine alike; and the emigrants, even in close column of companies, would have stretched for 20 miles; the births would occur every ten minutes; and the assembly before Sinai would have been impossible.<P>2. Increase of Population:<P>It is also difficult to suppose, on ordinary calculations of the increase of population, that in 430 years (<a onClick="return mV(\'Exd\',12,40);">Ex 12:40</a>), or in 215 years as given in the Septuagint, a tribe of 70 males (<a onClick="return mV(\'Gen\',46,26);">Ge 46:26</a>f; <a onClick="return mV(\'Exd\',1,5);">Ex 1:5</a>; <a onClick="return mV(\'Exd\',6,14);">6:14</a>) could have increased to 600,000, or even 100,000 men. But on the other hand we are specially told (<a onClick="return mV(\'Exd\',1,\'7-20\');">Ex 1:7-20</a>) that the children of Israel "increased abundantly," and the comments of Dr Orr (Problem of the Old Testament,1906,363-65) on this question should be studied. A young and vigorous nation might multiply much faster than is now usual in the East. Dr. Flinders Petrie has suggested that for "thousand" we should read "families"; but, though the word (\'eleph) sometimes has that meaning (<a onClick="return mV(\'Jdg\',6,15);">Jud 6:15</a>; <a onClick="return mV(\'1Sa\',10,19);">1Sa 10:19</a>; <a onClick="return mV(\'1Sa\',23,23);">23:23</a>), it is in the singular, and not in the plural, in the passage in question (<a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a>).<P>3. Number a Corruption of Original Statement:<P>It should not be forgotten that variations in numbers are very commonly found in various texts, VSS, and parallel passages of the Old Testament. Thus for instance (<a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>) the Syriac version reads 3,000 for the 30,000 chariots mentioned in the Hebrew and Greek; and the Septuagint (<a onClick="return mV(\'1Ki\',5,11);">1Ki 5:11</a>) gives 20,000 for the 20 measures of oil noticed in the Hebrew text. The probable reason for these discrepancies may be found in the fact that the original documents may have used numeral signs—as did the Egyptians, Assyrians, Hittites and Phoenicians—instead of writing the words in full as they appear in the New Testament. These numeral signs—especially in cuneiform—were apt to be misread, and the sign for "unity" could easily be confused with those denoting "sixty" (the Babylonian unit) and "an hundred"—if, in the latter case, a short stroke was added. In the opinion of the present writer the difficulty is due to a corruption of the original statement, which occurred during the course of some fifteen centuries, or more, of continued recopying; but the reader will no doubt form his own conclusions as to this question.<P>4. Review:<P>The general questions of the credibility of that history of the Exodus which is given us in the Pentateuch, and of the approximate date of the event, have been treated above in the light of the most recent monumental information. No reference has yet been found in Egyptian records to the presence of Israel in the Delta, though the Hebrews are noticed as present in Palestine before the 5th year of Minepthah. The Pharaohs as a rule—like other kings—only recorded their victories, and no doubt reckoned Israel only as a tribe of those "hostile Shasu" (or "nomads") whom the Theban kings of the XVIIIth Dynasty drove back into Asia. It would be natural that a disaster at the Red Sea should not be noticed in their proud records still extant on the temple walls in Egypt.`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`28';
isbe[3298]='Exodus, the Book of, 1`ek\'-so-dus:<P>Contents<P><b>I. IN GENERAL</b><p class="in15">1. Name<p class="in15">2. Contents in General<p class="in15">3. Connection with the Other Books of the Pentateuch<p class="in15">4. Significance of These Events for Israel<p class="in15">5. Connecting Links for Christianity<P><b>II. STRUCTURE OF THE BOOK ACCORDING TO THE SCRIPTURES AND ACCORDING TO MODERN ANALYSES</b><p class="in15">1. In General<p class="in15">2. In the Separate Pericopes<P><b>III. HISTORICAL CHARACTER</b><p class="in15">1. General Consideration<p class="in15">2. The Miraculous Character<p class="in15">3. The Legislative Portions<p class="in15">4. Chronology<p class="in15">5. Unjustifiable Attacks<P><b>IV. AUTHORSHIP</b><p class="in15">1. Connection with Moses<p class="in15">2. Examination of Objections<P><b>LITERATURE</b><hr /><P>(NOTE: For the signs J (Jahwist), E (Elohist), P or Priestly Code (Priest Codex), R (Redactor) compare the article on <a href="./study/isbe/search.html?string=GENESIS,+1-2">GENESIS, 1-2</a>.)<hr /><P>I. In General.<P>1. Name:<P>The second book of the Pentateuch bears in the Septuagint the name of Exodos, in the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) accordingly Exodus, on the basis of the chief contents of the first half, dealing with the departure of the children of Israel out of Egypt. The Jews named the book after the first words: we-\'elleh shemoth ("and these are the names"), or sometimes after the first noun shemoth ("names") a designation already known to Origen in the form of Oualesmoth.<P>2. Contents in General:<P>In seven parts, after the Introduction (<a onClick="return mV(\'Exd\',1,\'1-7\');">Ex 1:1-7</a>), which furnishes the connection of the contents with Genesis, the book treats of<P>(1) the sufferings of Israel in Egypt, for which mere human help is insufficient (<span class="noTag">Ex 1:8-7:7</span>), while Divine help through human mediatorship is promised;<P>(2) the power of Yahweh, which, after a preparatory miracle, is glorified through the ten plagues inflicted on Pharaoh and which thus forces the exodus (<span class="noTag">Ex 7:8-13:16</span>);<P>(3) the love of Yahweh for Israel, which exhibits itself in a most brilliant manner, in the guidance of the Israelites to Mt. Sinai, even when the people murmur (<span class="noTag">Ex 13:17-18:27</span>);<P>(4) making the Covenant at Mt. Sinai together with the revelation of the Ten Words (<a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20:1</a>ff) and of the legal ordinances (<a onClick="return mV(\'Exd\',21,1);">Ex 21:1</a>ff) as the condition of making the Covenant (<span class="noTag">Ex 19:1-24:18</span>);<P>(5) the directions for the building of the Tabernacle, in which Yahweh is to dwell in the midst of His people (<span class="noTag">Ex 24:18-31:18</span>);<P>(6) the renewal of the Covenant on the basis of new demands after Israel\'s great apostasy in the worship of the Golden Calf, which seemed for the time being to make doubtful the realization of the promises mentioned in (5) above (<span class="noTag">Ex 32:1-35:3</span>);<P>(7) the building and erection of the Tabernacle of Revelation (or Tent of Meeting) and its dedication by the entrance of Yahweh (<span class="noTag">Ex 35:4-40:38</span>).<P>As clearly as these seven parts are separated from one another, so clearly again are they most closely connected and constitute a certain progressive whole.<P>In the case of the last four, the separation is almost self-evident. The first three as separate parts are justified by the ten plagues standing between them, which naturally belong together and cause a division between that which precedes and that which follows. Thus in the first part we already find predicted the hardening of the heart of Pharaoh, the miracles of Yahweh and the demonstrations of His power down to the slaying of the firstborn, found in the 2nd part (compare <span class="noTag">Ex 2:23-7:7</span>).<P>In part 3, the infatuation of Pharaoh and the demonstration of the power of Yahweh are further unfolded in the narrative of the catastrophe in the Red Sea (<a onClick="return mV(\'Exd\',14,4,17);">Ex 14:4, 17</a>). Further the directions given with reference to the Tabernacle (<a onClick="return mV(\'Exd\',25,31);">Ex 25:31</a> taken from P) presuppose the Decalogue (from E); compare eg. <a onClick="return mV(\'Exd\',25,16,21);">Ex 25:16, 21</a>; <a onClick="return mV(\'Exd\',31,18);">31:18</a>; as again the 6th section (<a onClick="return mV(\'Exd\',32,\'1-\');">Ex 32</a>ff) presupposes the 5th part, which had promised the continuous presence of God (compare <a onClick="return mV(\'Exd\',32,34);">Ex 32:34</a> J; <a onClick="return mV(\'Exd\',33,3,5,7);">33:3, 5, 7</a>ff JE; <a onClick="return mV(\'Exd\',33,12,\'14-17\');">33:12,14-17</a> J; <a onClick="return mV(\'Exd\',34,9);">34:9</a> J, with <a onClick="return mV(\'Exd\',25,8);">25:8</A>; <a onClick="return mV(\'Exd\',29,45);">29:45</a>f P; compare also the forty days in <a onClick="return mV(\'Exd\',34,28);">34:28</a> J with those in <a onClick="return mV(\'Exd\',24,18);">24:18</A> P) as in <a onClick="return mV(\'Exd\',34,1,28);">34:1, 28 J and <a onClick="return mV(\'Exd\',34,\'11-27\');">34:11-27</a> J refers back to the 4th part, namely, <a onClick="return mV(\'Exd\',20,1);">20:1</a>ff E; <a onClick="return mV(\'Exd\',21,1);">21:1</a>ff E; <a onClick="return mV(\'Exd\',24,7);">24:7</a> JE (Decalogue; Books of the Covenant; Making the Covenant). In the same way the last section presupposes the third, since the cloud in <a onClick="return mV(\'Exd\',40,34);">Ex 40:34</a>ff P is regarded as something well known (compare <a onClick="return mV(\'Exd\',13,21);">13:21</a>f JE; <a onClick="return mV(\'Exd\',14,19);">14:19</a> E and J, <a onClick="return mV(\'Exd\',14,24);">14:24</a> J). The entire contents of the Book of Exodus are summarized in an excellent way in the word of God to Israel spoken through Moses concerning the making of the covenant: Ye have seen what I did unto the Egyptians, and how I bare you on eagles\' wings, and brought you unto myself.<P>Now therefore, if ye will obey my voice indeed, and keep my covenant, then ye shall be mine own possession from among all peoples: for all the earth is mine: and ye shall be unto me a kingdom of priests, and a holy nation (<a onClick="return mV(\'Exd\',19,\'4-6\');">Ex 19:4-6</a>). Here reference is made to the powerful deeds of God done to the Egyptians, to His deeds of lovingkindness done to Israel in the history of how He led them to Sinai, to the selection of Israel, and to the conditions attached to the making of the covenant, to God\'s love, which condescended to meet the people, and to His holiness, which demands the observance of His commandments; but there is also pointed out here the punishment for their transgression. The whole book is built on one word in the preface to the ten commandments: I am Yahweh thy God, who brought thee out of the land of Egypt, out of the house of bondage (<a onClick="return mV(\'Exd\',20,2);">Ex 20:2</a> E; compare <a onClick="return mV(\'Exd\',29,45);">29:45</A>f P).<P>3. Connection with the Other Books of the Pentateuch:<P>The events which are described in the Book of Exodus show a certain contrast to those in Genesis. In the first eleven chapters of this latter book we have the history of mankind; then beginning with <a onClick="return mV(\'Gen\',11,27);">11:27</A>, a history of families, those of Abraham, Isaac and Jacob. In Exodus we have following this the beginning of the history of the chosen people. Then there is also a long period of time intervening between the two books. If Israel was 430 years in Egypt (compare <a onClick="return mV(\'Exd\',12,40);">12:40</a>f P; also <a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a> J; see III, 4 below), and if the oppression began during the long reign of the predecessors of the Pharaoh, during whose reign Israel left the country (<a onClick="return mV(\'Exd\',2,23);">Ex 2:23</a>; <a onClick="return mV(\'Exd\',1,8);">1:8</a>), then, too, several centuries must have elapsed between the real beginning of the book (<a onClick="return mV(\'Exd\',1,8);">Ex 1:8</a>ff), and the conclusion of Genesis. Notwithstanding these differences, there yet exists the closest connection between the two books. <a onClick="return mV(\'Exd\',1,\'1-7\');">Ex 1:1-7</a> connects the history of the people as found in Exodus with the family history of Genesis, by narrating how the seventy descendants of Jacob that had migrated to Egypt (compare <a onClick="return mV(\'Exd\',1,5);">Ex 1:5</a>; <a onClick="return mV(\'Gen\',46,27);">Ge 46:27</a>) had come to be the people of Israel, and that God, who offers Himself as a liberator to Moses and the people, is also the God of those fathers, of whom Genesis spoke (compare <a onClick="return mV(\'Exd\',3,6);">Ex 3:6</a> JE; <a onClick="return mV(\'Exd\',3,13);">3:13</a> E; <a onClick="return mV(\'Exd\',3,15);">3:15</a>f R; <a onClick="return mV(\'Exd\',4,5);">4:5</a> J; <a onClick="return mV(\'Exd\',6,3);">6:3</a> P). Indeed, His covenant with the fathers and His promises to them are the reasons why He at all cares for Israel (<a onClick="return mV(\'Exd\',2,24);">Ex 2:24</a> P; <a onClick="return mV(\'Exd\',6,8);">6:8</a> P; <a onClick="return mV(\'Exd\',33,1);">33:1</a> JE), and when Moses intercedes for the sinful people, his most effective motive over against God is found in the promises made to the patriarchs (<a onClick="return mV(\'Exd\',32,13);">Ex 32:13</a> JE).<P>As is the case with Genesis, Exodus stands in the closest connection also with the succeeding books of the Pentateuch. Israel is certainly not to remain at Sinai, but is to come into the promised land (<a onClick="return mV(\'Exd\',3,17);">3:17</a> JE; <a onClick="return mV(\'Exd\',6,8);">6:8</a> P; <a onClick="return mV(\'Exd\',23,20);">23:20</a>ff JE; <a onClick="return mV(\'Exd\',32,34);">32:34</a> J; <a onClick="return mV(\'Exd\',33,1);">33:1</a>ff JE; <a onClick="return mV(\'Exd\',33,12);">33:12</a>ff J; <a onClick="return mV(\'Exd\',34,9);">34:9</a>ff J and D; compare also the many ordinances of the Books of the Covenant, <a onClick="return mV(\'Exd\',21,1);">21:1</a>ff E; <a onClick="return mV(\'Exd\',34,11);">34:11</a>ff D and J). In this way the narratives of the following books, which begin again in <a onClick="return mV(\'Num\',10,11);">Nu 10:11</a>ff P and JE with the story of the departure from Sinai, continue the history in Exodus. But the legislation in Leviticus also is a necessary continuation and supplement of the Book of Exodus, and is prepared for and pointed to in the latter. The erection of the burnt-offering altar (<a onClick="return mV(\'Exd\',27,1);">27:1</a>ff; <a onClick="return mV(\'Exd\',38,1);">38:1</a>ff), as well as the mention made of the different kinds of sacrifices, such as the burnt sacrifices and the sin offering (<a onClick="return mV(\'Exd\',29,18);">29:18</a>; <a onClick="return mV(\'Exd\',29,14);">29:14</a>) and of the heave offering (<a onClick="return mV(\'Exd\',29,28);">29:28</a>), point to the promulgation of a law of sacrifices such as we find in <span class="noTag">Le 1-7</span>. The directions given in regard to the consecration of the priests (<a onClick="return mV(\'Exd\',29,\'1-\');">Ex 29</a>) are carried out in <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8</a>f. The indefinite commands of <a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a> in reference to the atonement on the horn of the incense altar once every year renders necessary the special ritual of the Day of Atonement in <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> as its supplement. The more complete enlargement in reference to the shewbread mentioned in <a onClick="return mV(\'Exd\',25,30);">Ex 25:30</a> is found in <a onClick="return mV(\'Lev\',24,\'5-9\');">Le 24:5-9</a>; and even the repetitions in references to the candlesticks (<a onClick="return mV(\'Exd\',25,31);">Ex 25:31</a>ff; <a onClick="return mV(\'Lev\',24,\'1-4\');">Le 24:1-4</a>; <a onClick="return mV(\'Num\',8,\'1-4\');">Nu 8:1-4</a>), as also the tamidh ("continuous") sacrifices (compare <a onClick="return mV(\'Num\',28,\'3-8\');">Nu 28:3-8</a> with <a onClick="return mV(\'Exd\',29,\'38-42\');">Ex 29:38-42</a>), point to a certain connection between Exodus and the following books. How close the connection between Deuteronomy and Exodus is, both in regard to the historical narratives and also to their legal portions (compare the Decalogue and the Books of the Covenant), can only be mentioned at this place.<P>4. Significance of These Events for Israel:<P>When we remember the importance which the exodus out of Egypt and the making of the covenant had for the people of Israel, and that these events signalized the birth of the chosen people and the establishment of theocracy, then we shall understand why the echo of the events recorded in Exodus is found throughout later literature, namely, in the historical books, in the preaching of the prophets and in the Psalms, as the greatest events in the history of the people, and at the same time as the promising type of future and greater deliverances. But as in the beginning of the family history the importance of this family for the whole earth is clearly announced (<a onClick="return mV(\'Gen\',12,\'1-3\');">Ge 12:1-3</a>), the same is the case here too at the beginning of the history of the nation, perhaps already in the expression "kingdom of priests" (<a onClick="return mV(\'Exd\',19,6);">Ex 19:6</a>), since the idea of a priesthood includes that of the transmission of salvation to others; and certainly in the conception \'first-born son of Yahweh\' (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>), since this presupposes other nations as children born later.<P>The passages quoted above are already links connecting this book with Christianity, in the ideas of a general priesthood, of election and of sonship of God. We here make mention of a few specially significant features from among the mass of such relationships to Christianity.<P>5. Connecting Links for Christianity:<P>How great a significance the Decalogue, in which the law is not so intimately connected with what is specifically Jewish and national, as eg. in the injunctions of the Priest Codex, according to the interpretation of Christ in <a onClick="return mV(\'Mat\',5,\'1-\');">Mt 5</a>, has attained in the history of mankind! But in <a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>ff Jesus has vindicated for the law in all its parts an everlasting authority and significance and has emphasized the eternal kernel, which accordingly is to be assigned to each of these legal behests; while Paul, on the other hand, especially in Romans, Galatians and Colossians, emphasizes the transitory character of the law, and discusses in detail the relation of the Mosaic period to that of the patriarchs and of the works of the law to faith, while in <a onClick="return mV(\'2Cr\',3,\'1-\');">2Co 3</a> he lauds the glory of the service in the spirit over that of the letter (compare <a onClick="return mV(\'Exd\',34,\'1-\');">Ex 34</a>)—an idea which in reference to the individual legal institutions is also carried out in the Ep. to the Hebrews. Compare on this subject also the articles <a href="./study/isbe/search.html?string=LEVITICUS,+1">LEVITICUS</a> and <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT</a>. Then too the Passover lamb was a type of Jesus Christ (compare eg. <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>; <a onClick="return mV(\'Jhn\',19,36);">Joh 19:36</a>; <a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>). In <a onClick="return mV(\'Exd\',12,\'1-\');">Ex 12</a> the Passover rite and the establishment of the covenant (<a onClick="return mV(\'Exd\',24,24);">24:3-8</a>) are found most closely connected also with the Lord\'s Supper and the establishment of the New Covenant.<P>In the permanent dwelling of God in the midst of His people in the pillar of fire and in the Tabernacle there is typified His dwelling among mankind in Christ Jesus (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>) and also the indwelling of the Holy Ghost in the Christian congregation (<a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>; <a onClick="return mV(\'Eph\',4,12);">Eph 4:12</a>) and in the individual Christian (<a onClick="return mV(\'1Cr\',3,16);">1Co 3:16</a>; <a onClick="return mV(\'1Cr\',6,19);">6:19</a>; <a onClick="return mV(\'2Cr\',6,16);">2Co 6:16</a>; <a onClick="return mV(\'Jhn\',14,23);">Joh 14:23</a>). The Apocalypse particularly is rich in thought suggested by the exodus out of Egypt. Unique thoughts in reference to the Old Testament are found in the conceptions that the law was given through angels (<a onClick="return mV(\'Act\',7,53);">Ac 7:53</a>; <a onClick="return mV(\'Gal\',3,19);">Ga 3:19</a>; <a onClick="return mV(\'Hbr\',2,2);">Heb 2:2</a>); further that the rock mentioned in <a onClick="return mV(\'Exd\',17,6);">Ex 17:6</a> followed, and was Christ (<a onClick="return mV(\'1Cr\',10,4);">1Co 10:4</a>); and that in <a onClick="return mV(\'Hbr\',9,4);">Heb 9:4</a> the real connection of the altar of incense with the Holy of Holies appears as changed into a local connection (<a onClick="return mV(\'Exd\',40,26,27);">Ex 40:26-27</a>), while the idea found in <a onClick="return mV(\'Hbr\',9,4);">Heb 9:4</a> that the manna was originally in the Ark of the Covenant, is perhaps not altogether excluded by <a onClick="return mV(\'Exd\',16,33);">Ex 16:33</a>; and the number 430 years, found in <a onClick="return mV(\'Gal\',3,17);">Ga 3:17</a>, probably agrees with <a onClick="return mV(\'Exd\',12,40,41);">Ex 12:40-41</a>, in so far as the whole of the patriarchal period could be regarded as a unit (compare on the reading of the Septuagint in <a onClick="return mV(\'Exd\',12,40,41);">Ex 12:40-41</a>, III, 4 below).<P>Continued in next article…[<a href="./study/isbe/search.html?string=Exodus,+the+Book+of,+2">Exodus, the Book of, 2</A>]``122';
isbe[3299]='Exodus, the Book of, 2`II. Structure of the Book According to the Scriptures and According to Modern Analyses.<P>In the following section (a) serves for the understanding of the Biblical text; (b) is devoted to the discussion and criticism of the separation into sources.<P>1. In General:<P>(a) The conviction must have been awakened already by the general account of the contents given in I, 2 above, that in the Book of Exodus we are dealing with a rounded-off structure, since in seven mutually separated yet intimately connected sections, one uniform fundamental thought is progressively carried through. This conviction will only be confirmed when the details of these sections are studied, the sections being themselves again organically connected by one leading thought. Since, in addition, the Book of Genesis is clearly divided into ten parts by the ten toledhoth ("generations") (compare also the division made by typical numbers in articles <a href="./study/isbe/search.html?string=LEVITICUS,+1">LEVITICUS</a> and <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT</a>), thus too the number seven, as itself dividing the Book of Exodus into seven parts, is probably not accidental; and this all the less, as in the subordinate parts too, a division is to be found according to typical numbers, this in many cases appearing as a matter of course, and in other cases traced without difficulty, and sometimes lying on the surface (compare 10 plagues, 10 commandments). Yet in all of the following investigations, as is the case in the articles <a href="./study/isbe/search.html?string=GENESIS,+1-2">GENESIS</a>; <a href="./study/isbe/search.html?string=LEVITICUS,+1">LEVITICUS</A> and <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">DAY OF ATONEMENT</a>, the demonstration of the fundamental thought must be the main thing for us. The division according to typical numbers is to be regarded merely as an additional confirmation of the literary unity of the book. We refer here first of all to a number of cases, where certain numbers independently of the separate chief parts combine the Biblical text into a unity. In <a onClick="return mV(\'Num\',14,22);">Nu 14:22</a> R, Yahweh states that Israel had now tempted Him and been disobedient to Him ten times: compare <a onClick="return mV(\'Exd\',14,11);">Ex 14:11</a>ff JE(?) (Red Sea); <a onClick="return mV(\'Exd\',15,23);">15:23</a>f JE (Marah); <a onClick="return mV(\'Exd\',16,2,3);">16:2-3</a> P; <a onClick="return mV(\'Exd\',16,20);">16:20</a> JE; <a onClick="return mV(\'Exd\',16,27,28);">16:27-28</a> R (Manna); <a onClick="return mV(\'Exd\',17,1);">17:1</a>ff JE (Massah and Meribah); <a onClick="return mV(\'Exd\',32,1);">32:1</a>ff JE (Golden Calf); <a onClick="return mV(\'Num\',11,1);">Nu 11:1</a>ff JE (Tuberah); <a onClick="return mV(\'Num\',11,4);">11:4</a>ff JE (Graves of Lust); <a onClick="return mV(\'Num\',14,2);">14:2</a>ff P and JE (Spies). Most of these cases are accordingly reported in the Book of Exodus, but in such manner that in this particular a clearly marked progress can be noticed, as Yahweh does not begin to punish until <a onClick="return mV(\'Exd\',32,\'1-\');">Ex 32</a>; but from here on He does so with constantly increasing severity, while down to <a onClick="return mV(\'Exd\',32,\'1-\');">Ex 32</a> grace alone prevails, and in this particular, previous to <a onClick="return mV(\'Exd\',32,\'1-\');">Ex 32</a>, there is found nothing but a warning (<a onClick="return mV(\'Num\',16,27);">16:27</a>).Ten times it is further stated of Pharaoh, in a great variety of forms of expression, that he hardened his own heart (<a onClick="return mV(\'Exd\',7,13);">7:13</a> P; <a onClick="return mV(\'Exd\',7,14);">7:14</a> JE; <a onClick="return mV(\'Exd\',7,22);">7:22</a> P; <a onClick="return mV(\'Exd\',8,15);">8:15</a> P; <a onClick="return mV(\'Exd\',8,32);">8:32</a> JE; <a onClick="return mV(\'Exd\',9,7,34,35);">9:7, 34-35</a> JE; <a onClick="return mV(\'Exd\',13,15);">13:15</a> D); ten times the hardening is ascribed to God (<a onClick="return mV(\'Exd\',4,21);">4:21</a> JE; <a onClick="return mV(\'Exd\',7,3);">7:3</a> P; <a onClick="return mV(\'Exd\',9,12);">9:12</a> P; <a onClick="return mV(\'Exd\',10,1);">10:1</a> R; <a onClick="return mV(\'Exd\',10,20);">10:20</a> JE; <a onClick="return mV(\'Exd\',10,27);">10:27</a> E; <a onClick="return mV(\'Exd\',11,10);">11:10</a> R; <a onClick="return mV(\'Exd\',14,4,8);">14: 4,8 P; <a onClick="return mV(\'Exd\',17,\'1-\');">17</a> P ?). Here already we must note that within the narrative of the miracles and the plagues at first there is mention made only of the hardening by Pharaoh himself (<a onClick="return mV(\'Exd\',7,13);">7:13</A> P; <a onClick="return mV(\'Exd\',7,14);">7:14</a> JE; <a onClick="return mV(\'Exd\',7,22);">7:22</A> P; <a onClick="return mV(\'Exd\',8,11);">8:11</a>ff; <a onClick="return mV(\'Exd\',8,15);">8:15</a> P; <a onClick="return mV(\'Exd\',8,28);">8:28</a> JE; <a onClick="return mV(\'Exd\',9,7);">9:7</a> JE, i.e. seven times) before a single word is said that God begins the hardening; and this latter kind of hardening thereupon alone concludes the whole tragedy (<a onClick="return mV(\'Exd\',14,4,8);">14:4, 8</a> P; <a onClick="return mV(\'Exd\',17,\'1-\');">17</a> P?). Ten months cover the time from the arrival at Sinai (<a onClick="return mV(\'Exd\',19,1);">19:1</a> P) to the erection of the sacred dwelling-place of God (<a onClick="return mV(\'Exd\',40,17);">40:17</a> P). Since, further, exactly three months of this time are employed in <a onClick="return mV(\'Exd\',19,10,16);">19:10, 16</a> JE; <a onClick="return mV(\'Exd\',24,3);">24:3</a>ff JE; <a onClick="return mV(\'Exd\',24,16);">24:16</a> P (ten days); <a onClick="return mV(\'Exd\',24,18);">24:18</a> P (40 days); <a onClick="return mV(\'Exd\',34,28);">34:28</a> J (40 days), there remain for the building of the tabernacle exactly seven months.<P>(b) What has been said does anything but speak in favor of the customary division of Exodus into different sources. It is generally accepted that the three sources found in Genesis are also to be found in this book; in addition to which a fourth source is found in <a onClick="return mV(\'Exd\',13,\'3-16\');">Ex 13:3-16</a>, of a Deuteronomistic character. It is true and is acknowledged that the advocates of this hypothesis have more difficulties to overcome in Exodus than in Genesis, in which latter book too, however, there are insufficient grounds for accepting this view, as is shown in the article <a href="./study/isbe/search.html?string=GENESIS">GENESIS</a>. Beginning with <a onClick="return mV(\'Exd\',6,\'1-\');">Ex 6</a> the chief marks of such a separation of sources falls away as far as P and J are concerned, namely, the different uses of the names of God, Elohim and Yahweh. For, according to the protagonists of the documentary theory, P also makes use of the name Yahweh from this chapter on; E, too, does the same from <a onClick="return mV(\'Exd\',3,13);">Ex 3:13</a>ff on, only that, for a reason not understood, occasionally the word Elohim is still used by this source later on, e.g. <a onClick="return mV(\'Exd\',13,17);">13:17</a>ff; <a onClick="return mV(\'Exd\',18,1);">18:1</a>ff. But as a number of passages using the name Elohim are unhesitatingly ascribed by the critics to J, this difference in the use of the name of God utterly fails to establish a difference of sources. To this is to be added, that J and E are at this place closely interwoven; that, while the attempt is constantly being made to separate these two sources, no generally accepted results have been reached and many openly acknowledge the impossibility of such a separation, or admit that it can be effected only to a very limited extent. Peculiarities which are regarded as characteristic of the different sources, such as the sin of Aaron in J, the staff of Moses in E, Sinai in J and the Priestly Code (P), Horeb in E, the dwelling of the Israelites in Goshen in J, but according to E their living in the midst of the Egyptians, and others, come to nought in view of the uniform text in the passages considered. This has been proved most clearly, e.g. by Eerdmans in his Alttestamentliche Studien, III ("Das Buck Exodus") in regard to many of these passages. Narratives of a similar character, like the two stories in which Moses is described as striking the rock to produce water (<a onClick="return mV(\'Exd\',17,1);">Ex 17:1</a>; <a onClick="return mV(\'Num\',20,1);">Nu 20:1</a>ff), are not duplicates, but are different events. Compare the different localities in <a onClick="return mV(\'Exd\',17,7);">Ex 17:7</a> and <a onClick="return mV(\'Num\',20,1);">Nu 20:1</a>, as also the improbability that Israel would without cause in the first passage have put into permanent form the story of its shame, and then in the latter there would have been an uncertainty as to the importance of this locality for the career of Moses; and finally, we must notice the distinction expressly made by the additional statement, "waters of Meribah of Kadesh in the wilderness of Zin," in <a onClick="return mV(\'Num\',27,\'12-14\');">Nu 27:12-14</a>; <a onClick="return mV(\'Deu\',32,51);">De 32:51</a> (compare <a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>; <a onClick="return mV(\'Eze\',48,28);">48:28</a>). Then, too, these occurrences, if we accept the division into J and E at this place, are not reduced to a single event, since both sources would share in both narratives. The same condition of affairs is found in <a onClick="return mV(\'Exd\',16,\'1-\');">Ex 16</a> in so far as JE comes into consideration, and in <a onClick="return mV(\'Exd\',18,\'1-\');">Ex 18</a> in comparison with <a onClick="return mV(\'Num\',11,\'1-\');">Nu 11</a>. In the case of <a onClick="return mV(\'Num\',11,\'1-\');">Nu 11</a> there is express reference made to a former narrative by the word "again" and in the second case all the details in their differences point to different occurrences. Concerning other so-called duplicates in Exodus, see later in this article. But the acceptance of P in contradistinction to the text of JE does also not lead to tangible results, notwithstanding that there exists a general agreement with regard to the portions credited to P. Not taking into consideration certain that are peculiar, the following sections are attributed to this source: <a onClick="return mV(\'Exd\',1,\'1-7\',\'13-15\');">Ex 1:1-7, 13-15</a>; <a onClick="return mV(\'Exd\',2,23,24,25);">2:23-25</a>; <a onClick="return mV(\'Exd\',6,\'2-\');">6:2</a> - <a onClick="return mV(\'Exd\',7,\'1-13\');">7:13</a>; (<a onClick="return mV(\'Exd\',6,\'6-30\');">6:28-30</a> R); <a onClick="return mV(\'Exd\',7,\'19-22\');">Ex 7:19a; 21b; 22</a>; <a onClick="return mV(\'Exd\',8,\'1-3\',\'11-15\');">8:1-3, 11b-15</a>; <a onClick="return mV(\'Exd\',9,\'8-12\');">9:8-12</a>; <a onClick="return mV(\'Exd\',12,\'1-20\',28,37,\'40-50\');">12:1-20, 28, 37, 40-50</a>; <a onClick="return mV(\'Exd\',13,1,2,20);">13:1-2, 20</a>; <a onClick="return mV(\'Exd\',14,\'1-4\',\'8-10\',\'15-18\',\'21-23\',29);">Ex 14:1-4, 8-10, 15-18, 21a, 22-23, 29</a>; <a onClick="return mV(\'Exd\',16,\'1-3\',\'9-14\',\'15-18\',\'21-26\',31,32,34,35);">16:1-3, 9-14, 15b-18, 21-26, 31-32, 34a, 35</a>; <a onClick="return mV(\'Exd\',17,1);">Ex 17:1</a>; <a onClick="return mV(\'Exd\',19,1,2);">19:1-2</a>; <span class="noTag">24:15-31:17</span>; <span class="noTag">34:29-40:38</a>. It is claimed that in the Book of Genesis these sources constitute the backbone of the whole work; but this is not claimed for Ex. The sections ascribed to P constitute in this place, too, anything but an unbroken story. In both language and substance they are, to a certain extent, most closely connected with the parts ascribed to JE, and in part they are indispensable for the connection whence they have been taken (compare for details below). It is absolutely impossible to separate on purely philological grounds in the purely narrative portions in Exodus the portions belonging to P. That genealogies like <a onClick="return mV(\'Exd\',6,14);">Ex 6:14</a>ff, or chronological notices like <a onClick="return mV(\'Exd\',12,40,41,51);">12:40,41,51</A>; <a onClick="return mV(\'Exd\',16,1);">16:1</a>; <a onClick="return mV(\'Exd\',19,1);">19:1</A>, or directions for the cults like <a onClick="return mV(\'Exd\',12,\'1-\');">Ex 12</a>; <a onClick="return mV(\'Exd\',25,\'1-\');">25</a>ff have their own peculiar forms, is justified by self-evident reasons; but this does not justify the acceptance of separate authors. It is the result of the peculiar matter found in each case. We must yet note that the passages attributed to P would in part contain views which could not be harmonized with theological ideas ascribed to this source, which are said to include an extreme transcendental conception of God; thus in <a onClick="return mV(\'Exd\',16,10);">16:10</a> the majesty of Yahweh suddenly appears to the congregation, and in <a onClick="return mV(\'Exd\',40,34);">40:34</a>ff this majesty takes possession of the newly erected dwelling. In <a onClick="return mV(\'Exd\',8,19);">8:19</A> mention is made of the finger of God, and in <a onClick="return mV(\'Exd\',7,1);">7:1</a> Moses is to be as God to Pharaoh. In <a onClick="return mV(\'Exd\',12,12);">Ex 12:12</a> the existence of the Egyptian gods is presupposed and the heathen sorcerers are able to act in competition with Moses and Aaron for a while; <a onClick="return mV(\'Exd\',7,11,2,22);">7:11,12,22</a>; <a onClick="return mV(\'Exd\',8,3);">8:3</A>. P also describes the Passover, which on account of the handling of the blood in <a onClick="return mV(\'Exd\',12,7);">12:7</a> cannot be regarded in any other light than as a sacrifice in the house, and in <a onClick="return mV(\'Num\',9,7,13);">Nu 9:7,13</a>, this act is expressly called a qorban Yahweh (\'sacrifice of Yahweh\'). Compare also the commands in <a onClick="return mV(\'Exd\',12,10,43,48);">Ex 12:10, 43, 48</a>. But more than anything else, what has been said under (a) above goes to show that all these sources have been united in a way that characterizes the work of a systematic writer, and declares against any view that would maintain that these sources have been mechanically placed side by side and interwoven into each other. What has here been outlined for the whole book in general must now be applied to the different parts in particular. <P>2. In the Separate Pericopes:<P>(1) <span class="noTag">Exodus 1:8-7:7</span>:<P>(a) Everything that is narrated in this section, which in so worthy a manner introduces the whole book, is written from a standpoint of the Egyptian oppression, from which human help could give no deliverance, but from which the mighty power of Yahweh, working through human agency, offered this deliverance. It is a situation which demands faith (<a onClick="return mV(\'Exd\',4,31);">4:31</a>). This section naturally falls into ten pericopes, of which in each instance two are still more closely connected. Nos. 1 and 2</a> (<a onClick="return mV(\'Num\',1,\'8-14\',\'15-22\');">1:8-14,15-22</a>), namely, the oppression through forced labor and the threat to take the life of the newly born males of the Israelites; and in contrast to this, the Divine blessing in the increase of the people in general and of the midwives in particular; Nos. 3 and 4 (<a onClick="return mV(\'Exd\',2,\'1-10\');">Ex 2:1-10</a>; <a onClick="return mV(\'Exd\',2,\'11-22\');">11-22</a>), namely, the birth and youth of Moses stand in contrast. The child seems to be doomed, but God provides for its deliverance. Moses, when grown to manhood, tries to render vigorous assistance to his people through his own strength, but he is compelled to flee into a far-off country. Nos. 5 and 6 (<a onClick="return mV(\'Exd\',2,\'23-\');">Ex 2:23-4:17</a>; <a onClick="return mV(\'Exd\',4,\'18-31\');">4:18-31</a>) report the fact that also in the reign of a new Pharaoh the oppression does not cease, and that this causes God to interfere, which in <a onClick="return mV(\'Exd\',2,\'23-25\');">Ex 2:23-25</a> is expressed in strong terms and repeatedly, and this again leads to the revelation in the burning bush (<a onClick="return mV(\'Exd\',3,1);">3:1</a>ff). And at the same time the narrative shows how little self-confidence Moses still had (three signs, a heavy tongue, direct refusal). The sixth pericope and also the beginning of the last four, describe, from an external viewpoint, the return of Moses to Midian, and his journey from there to Egypt. Here, too, mention is made of the troubles caused by Pharaoh, which God must remove through His power. This deliverance is not at all deserved by Israel, since not even any son in a family had up to this time been circumcised. On the other hand, everything here is what can be expected. Those who sought the life of Moses had died; the meeting with Aaron at the Mount of the Lord; in Egypt the faith of the people. In an effective way the conclusion (<a onClick="return mV(\'Exd\',4,31);">4:31</a>) returns to the point where the two companion narratives (<a onClick="return mV(\'Exd\',2,24);">2:24</a>f) begin. After this point, constituting the center and the chief point in the introductory section, Nos. 7 and 8 (<a onClick="return mV(\'Exd\',5,\'1-\');">Ex 5:1</a> - <a onClick="return mV(\'Exd\',6,1);">6:1</a>; <a onClick="return mV(\'Exd\',6,\'2-12\');">6:2-12</a>), everything seems to have become doubtful. Pharaoh refuses to receive Moses and Aaron; the oppression increases; dissatisfaction in Israel appears; Moses despairs; even the new revelations of God, with fair emphasis on fidelity to the Covenant which is to unfold Yahweh\'s name in full, are not able to overcome the lack of courage on the part of the people and of Moses. Nos. 9 and 10, introduced by <a onClick="return mV(\'Exd\',6,13);">Ex 6:13</a> (<a onClick="return mV(\'Exd\',6,\'14-27\');">6:14-27</A> and <a onClick="return mV(\'Exd\',6,\'28-\');">6:28</A> - <a onClick="return mV(\'Exd\',7,\'1-7\');">7:7</a>), show that after Moses and Aaron have already been mentioned together in <a onClick="return mV(\'Exd\',4,14,27);">4:14,27</a>ff; <a onClick="return mV(\'Exd\',5,1);">5:1</a>ff, and after it has become clear how little they are able of themselves to accomplish anything, they are now here, as it were, for the first time, before the curtain is raised, introduced as those who in the following drama are to be the mediators of God\'s will (compare the concluding verses of both pericopes, <a onClick="return mV(\'Exd\',6,27);">6:27</a>; <a onClick="return mV(\'Exd\',7,7);">7:7</a>), and they receive directions for their common mission, just at that moment when, humanly speaking, everything is as unfavorable as possible.<P>(b) The unity of thought here demonstrated is in this case too the protecting wall against the flood-tide of the documentary theory. For this theory involves many difficulties. In <a onClick="return mV(\'Exd\',1,13);">Ex 1:13</a>f there would be an account of the oppression by the Priestly Code (P), but the motive for this can be found only in the preceding verses, which are ascribed to JE; <a onClick="return mV(\'Exd\',2,24);">2:24</a> speaks of the Covenant of God With Isaac, concerning which P is said to have reported nothing in the Book of Genesis, as in the latter book a reference to this matter is found only in <a onClick="return mV(\'Gen\',26,\'2-5\');">Ge 26:2-5</a> R; <a onClick="return mV(\'Exd\',26,24);">26:24</a> J. In <a onClick="return mV(\'Exd\',6,2);">Ex 6:2</a>ff Moses and Aaron are mentioned; but as the text of P reads we know absolutely nothing from this source as to who these men are. According to <a onClick="return mV(\'Exd\',7,1);">7:1</a>ff Aaron is to be the speaker for Moses before Pharaoh. But according to P neither Moses nor Aaron speaks a single word. The omissions that are found by critics in documents J and E—which, if they are separated, have lines of demarcation claimed for the separation that are very unsettled—we here pass over in silence.<P>On the critical theory, the narratives of the Priestly Code (P), in the Book of Exodus, as also in Genesis, would have discarded many of the stereotyped formulas characteristic of this source (compare <a onClick="return mV(\'Exd\',2,23);">Ex 2:23</a>ff; <a onClick="return mV(\'Exd\',6,2);">6:2</a>ff; <a onClick="return mV(\'Exd\',7,1);">7:1</a>ff), and in both form and contents would be made very similar to the rest of the text <a onClick="return mV(\'Exd\',1,9,10,12);">Ex 1:9-10, 12</a> JE; <a onClick="return mV(\'Exd\',1,20);">1:20</a> E; <a onClick="return mV(\'Exd\',7,1);">7:1</a> P; and to a great extent expressions similar to these are here found and in part refer to these. The same must be said concerning <a onClick="return mV(\'Exd\',3,7);">3:7</a> JE in its relation to <a onClick="return mV(\'Exd\',2,23);">2:23</A>ff P; <a onClick="return mV(\'Exd\',6,6);">6:6</a>ff (sibhloth) P in its relation to <a onClick="return mV(\'Exd\',1,11);">1:11</A> JE; <a onClick="return mV(\'Exd\',2,11);">2:11</a> E; <a onClick="return mV(\'Exd\',5,4,5);">5:4,5</a> JE (in contrast <a onClick="return mV(\'Exd\',1,13,14);">1:13,14</a>; <a onClick="return mV(\'Exd\',2,23);">2:23</a>). JE, in <a onClick="return mV(\'Exd\',4,9);">4:9</a> for "dry land," makes use of the term ha-yabbashah, which in <a onClick="return mV(\'Gen\',1,9);">Ge 1:9</a>f and <a onClick="return mV(\'Exd\',14,16);">Ex 14:16</a> is ascribed to the Priestly Code (P), and a different expression is used for this thought by J in <a onClick="return mV(\'Gen\',7,22);">Ge 7:22</a>. In reference to <a onClick="return mV(\'Exd\',7,1);">Ex 7:1</a> P compare <a onClick="return mV(\'Exd\',4,14);">4:14</a> E (?). In reference to the hardening of Pharaoh, which is found in all the sources (<a onClick="return mV(\'Exd\',7,3);">7:3</a> P), see above under 1a; in reference to the miracles, and their purpose of making Yahweh known to the Egyptians (<a onClick="return mV(\'Exd\',7,\'3-5\');">7:3-5</a> P) see the following paragraph. The four generations mentioned in <a onClick="return mV(\'Exd\',7,14);">7:14</a>ff P find their parallel in <a onClick="return mV(\'Gen\',15,16);">Ge 15:16</a> J (compare <a onClick="return mV(\'Exd\',46,8);">46:8</a>ff); and the sons of Aaron mentioned in <a onClick="return mV(\'Exd\',6,23);">Ex 6:23</a> the Priestly Code (P), Nadab and Abihu, are mentioned also in the text of <a onClick="return mV(\'Exd\',24,1,9);">24:1,9</a>, ascribed to JE although, except in <a onClick="return mV(\'Lev\',10,\'1-\');">Le 10</a> the Priestly Code (P), their names are not found elsewhere in the Pentateuch. In reference to the repetitions, it must be said that <a onClick="return mV(\'Exd\',1,13);">Ex 1:13</a> P is either the continuation (in so far as the Israelites instead of being compulsory laborers became slaves), or is a concluding summary, such as is found frequently. The new revelation of God in <a onClick="return mV(\'Exd\',6,\'1-\');">Ex 6</a> the Priestly Code (P), according to chapter <a onClick="return mV(\'Exd\',3,\'1-\');">3</a> JE, finds its psychological and historical motive in the account of the failure described in <a onClick="return mV(\'Exd\',4,31);">5:1</a>ff JE, and in the discouragement of the Israelites and of Moses resulting therefrom. In the same way the renewed mention by Moses of his difficulties of speech (<a onClick="return mV(\'Exd\',6,12);">6:12</a> P; compare with <a onClick="return mV(\'Exd\',4,10);">4:10</a>ff J and E (?)) is very characteristic of human ways, and this again necessitates the twice repeated consideration of this matter by God (<a onClick="return mV(\'Exd\',6,30);">6:30</a> R; <a onClick="return mV(\'Exd\',4,10);">4:10</a>ff J and E (?); concerning the names of God, see <a href="./study/isbe/search.html?string=GENESIS,+1-2">GENESIS; <a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</A>).<P>One difficulty, which is also not made clear by the proposed division of sources, is found in the name of the father-in-law of Moses; since according to <a onClick="return mV(\'Exd\',2,18);">Ex 2:18</a> J, this name is Reuel, and according to <a onClick="return mV(\'Exd\',3,1);">3:1</a>; <a onClick="return mV(\'Exd\',18,1);">18:1</a> JE, it is Jethro (<a onClick="return mV(\'Exd\',4,18);">4:18</a> E in the form "Jether"); in <a onClick="return mV(\'Num\',10,29);">Nu 10:29</a> JE is called Hobab and a son of Reuel (the King James Version "Raguel") for all of these passages are ascribed to J or E. It is probable that the name Jethro is a title ("Excellency"); and as for the rest, in <a onClick="return mV(\'Num\',10,29);">Nu 10:29</a> chothen probably does not mean father-in-law but brother-in-law (<a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',4,11);">4:11</a>); or in <a onClick="return mV(\'Exd\',2,18);">Ex 2:18</a> we find father and in <a onClick="return mV(\'Exd\',2,21);">2:21</a> daughter in the place of grandfather and granddaughter; otherwise we should be compelled to accept different traditions, by which view, however, the Mosaic authorship of Exodus would be made impossible (compare IV, below).<P>(2) <span class="noTag">Exodus 7:8-13:16</span>:<P>(a) This section is separated as a matter of course from the rest by the typical number of ten plagues. It is introduced by the transformation of the rod into a serpent in the presence of Pharaoh (<a onClick="return mV(\'Exd\',7,\'8-13\');">7:8-13</a>). To explain the fact that there were ten plagues on the ground of the accidental combination of sources, is from the very outset a precarious undertaking. To this must be added the following reasons that indicate a literary editing of the material. All of the plagues are introduced by the same formula (<a onClick="return mV(\'Exd\',7,12);">7:12</a> JE; <a onClick="return mV(\'Exd\',8,1);">8:1</a> J; <a onClick="return mV(\'Exd\',8,12);">8:12</a> P; <a onClick="return mV(\'Exd\',8,16);">8:16</a> JE; <a onClick="return mV(\'Exd\',8,20);">8:20</a> JE; <a onClick="return mV(\'Exd\',9,1);">9:1</a> JE; <a onClick="return mV(\'Exd\',9,8);">9:8</a> P; <a onClick="return mV(\'Exd\',9,13);">9:13</a> JE; <a onClick="return mV(\'Exd\',10,1,12);">10:1,12</a> JE; <a onClick="return mV(\'Exd\',10,21);">10:21</a> E; <a onClick="return mV(\'Exd\',11,1);">11:1</a> E), and in connection with each plague the hardening of the heart of Pharaoh is mentioned (compare (1a) above); compare <a onClick="return mV(\'Exd\',7,22);">7:22</a> P; <a onClick="return mV(\'Exd\',8,11);">8:11</a> J; <a onClick="return mV(\'Exd\',8,15);">8:15</a> P; <a onClick="return mV(\'Exd\',8,28);">8:28</a> JE; <a onClick="return mV(\'Exd\',9,7);">9:7</a> JE; <a onClick="return mV(\'Exd\',9,12);">9:12</a> P; <a onClick="return mV(\'Exd\',9,34);">9:34</a> JE; <a onClick="return mV(\'Exd\',9,35);">9:35</a> JE; <a onClick="return mV(\'Exd\',10,1);">10:1</a> R; <a onClick="return mV(\'Exd\',10,20);">10:20</a> JE; <a onClick="return mV(\'Exd\',10,27);">10:27</a> E; <a onClick="return mV(\'Exd\',11,10);">11:10</a> R; <a onClick="return mV(\'Exd\',13,15);">13:15</a> D. As is the case in the first section, we find here too in each instance two plagues more closely connected, namely, Nos. 1 and 2 already externally united by the double address of Yahweh (compare <a onClick="return mV(\'Exd\',7,14);">7:14</a> JE; <a onClick="return mV(\'Exd\',7,19);">7:19</a> P and <a onClick="return mV(\'Exd\',7,26);">7:26</a> J; <a onClick="return mV(\'Exd\',8,1);">8:1</a> P), but also by the methods of punishment that are related to each other (water changed to blood and frogs); and, finally, by the extension of the plague (the Nile and beyond the river). In 3 and 4 we have to deal with insects (stinging flies and dung flies); in 5 and 6 with a kind of pest (pest among cattle, and boils); 7 and 8 are again formally joined by the repeated command of Yahweh to Moses in <a onClick="return mV(\'Exd\',9,13,22);">9:13, 22</a> JE and <a onClick="return mV(\'Exd\',10,1,12);">10:1,12</a> JE, as also by the fullness of the account the two show and their similarity, in both also use being made of the staff (<a onClick="return mV(\'Exd\',9,23);">9:23</a>f JE; <a onClick="return mV(\'Exd\',10,13);">10:13</a>f JE), in the repetition of the emphasis put on the remarkable character of the plague (<a onClick="return mV(\'Exd\',9,18,24);">9:18,24</a>; <a onClick="return mV(\'Exd\',10,6,14);">10:6,14</a> JE). By both plagues vegetation is destroyed; and in the plague of locusts special reference is made also to the hail (compare <a onClick="return mV(\'Exd\',10,5,12,15);">10:5,12,15</a>). In the case of 9 and 10, the darkness constitutes a connecting link (compare <a onClick="return mV(\'Exd\',10,21);">10:21</a> E; <a onClick="return mV(\'Exd\',11,4);">11:4</a> J; <a onClick="return mV(\'Exd\',12,12);">12:12</a> P; <a onClick="return mV(\'Exd\',12,30,31);">12:30,31</a> JE). By the side of the occasional rhythm formed of two members there is also one formed of three members (after the manner of a triole in a measure of two beats). In the case of each group of three plagues, two are announced beforehand (thus 1 JEP and 2 JP; 4 JE and 5 JE; 7 JE and 8 JE; 10 EJ over against 3 the Priestly Code (P), 6 P and 9 E); the first of each group of three plagues, as 1, 4 and 7, is to be announced by Moses on the following morning to Pharaoh (<a onClick="return mV(\'Exd\',7,15);">7:15</a>; <a onClick="return mV(\'Exd\',8,20);">8:20</a>; <a onClick="return mV(\'Exd\',9,13);">9:13</A> JE). Also in regard to the impression caused by the plagues a distinct progress can be noticed, in this too, that the Egyptian sorcerers are active only down to the third plague. Naturally, too, over against these facts, further peculiarities can be pointed out in the separate plagues, e.g. the fact that Goshen, or rather that Israel, is spared in the 4th, 5th, 7th through 10th plagues (<a onClick="return mV(\'Exd\',8,22);">8:22</a>; <a onClick="return mV(\'Exd\',9,6,26);">9:6,26</a> JE; <a onClick="return mV(\'Exd\',10,23);">10:23</a> E; <a onClick="return mV(\'Exd\',11,7);">11:7</A> J); and in the mention made of the intercession in the 2nd, 4th, 7th, 8th (<a onClick="return mV(\'Exd\',8,8);">8:8</a> J; <a onClick="return mV(\'Exd\',8,12);">8:12</a>; <a onClick="return mV(\'Exd\',9,28,33);">9:28,33</a>; <a onClick="return mV(\'Exd\',10,17);">10:17</a>f JE) without thereby destroying the artistic construction of the whole that has been described above, or that in each such case of individuality of presenting the matter there is to be found a reason for claiming a separate source.P>(b) In the same way, too, it is not a permissible conclusion, that in the first miracle and in the first three plagues mention is made of the fact that Aaron performed this miracle with his staff (<a onClick="return mV(\'Exd\',7,8);">Ex 7:8</a>ff, <a onClick="return mV(\'Exd\',7,19);">19</a>; <a onClick="return mV(\'Exd\',8,\'5-20\');">8:5-20</a>ff P). At any rate, in the parts ascribed to the Priestly Code (P), no absolute uniformity is to be found, since plagues 1 to 3 are commanded to Moses, while the 6th is commanded to Moses and Aaron (<a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a>; <a onClick="return mV(\'Exd\',8,1,20);">8:1, 20</a> over against <a onClick="return mV(\'Exd\',9,8);">Ex 9:8</a>); and since, further, in the 6th plague (<a onClick="return mV(\'Exd\',9,8);">Ex 9:8</a>) it is Moses, and in the 10th (<a onClick="return mV(\'Exd\',12,12);">Ex 12:12</a>) it is God Himself who really carries out the command, and not Aaron, as was the case in the introductory miracles and in the first three plagues. Further, according to JE (<a onClick="return mV(\'Exd\',4,30);">Ex 4:30</a>), it appears that the presupposition is that we are to consider all of the addresses and actions in general as taking place through Aaron, even in those cases where this is not especially mentioned.<P>Only the 1st plague (<a onClick="return mV(\'Exd\',7,14);">Ex 7:14</a>ff) furnishes an apparent reason for the acceptance of two sources. In this case mention is made at times of the waters of the Nile only, and then of all other waters being changed into blood; and a separation from this point of view at least could be carried through. But this possibility disappears at once in the case of the 2nd plague (frogs), where the passage <a onClick="return mV(\'Exd\',8,\'1-3\');">Ex 8:1-3</a>, ascribed to the Priestly Code (P), which verses contain the consummation of the plague announced in <a onClick="return mV(\'Exd\',7,\'26-29\');">7:26-29</a> J (Hebrew), is altogether necessary for this connection; as otherwise the impression made upon Pharaoh by this plague, which is not mentioned in P at all, would be a torso. The similarity in the construction of the 2nd and the 1st plague, however (compare under (a) above), and the same difference in the mention made of the Nile and of the other waters in the 2nd plague, make it possible and even advisable in the case of the first plague, too, to discard the hypothesis of a difference in sources, because in the 2nd plague this difference cannot be carried out. Then, too, there would be other omissions found in P. According to the customary separation of sources, P would not contain the fulfillment of the threatened tenth plague announced in <a onClick="return mV(\'Exd\',12,12);">12:12</a> at all. In the same way the statement in <a onClick="return mV(\'Exd\',12,28);">12:28</a> refers to the carrying out of a command, the announcement of which to Israel in <a onClick="return mV(\'Exd\',12,21);">12:21</a>ff would be found in another source. Further in <a onClick="return mV(\'Exd\',12,37);">12:37a</a> we would have the Priestly Code (P), as when the parts belonging to P have been eliminated, the other sources too would contain omissions in <a onClick="return mV(\'Exd\',12,21);">12:21</A>ff, mostly JE; <a onClick="return mV(\'Exd\',12,37);">12:37b</a> E; <a onClick="return mV(\'Exd\',13,3);">13:3</a>ff D. In the same way the announcement of a large number of miracles (<a onClick="return mV(\'Exd\',7,3);">7:3</a> P; <a onClick="return mV(\'Exd\',11,9</a>);">11:9</a> R) is too comprehensive, if these verses refer only to the narratives found in P. In addition, there is a remarkable similarity found in all of the narratives of P with those parts which are ascribed to JE; compare the first miracle in <a onClick="return mV(\'Exd\',7,8);">7:8</a>ff with <a onClick="return mV(\'Exd\',4,2);">4:2</a>ff J; <a onClick="return mV(\'Exd\',4,17);">4:17</a> E. In the Priestly Code (P), too, as is the case with JE, it is stated that the purpose of the miracle is, that Pharaoh, or the Egyptians, or Israel, are to recognize that Yahweh is God and the Lord of the earth, or something to this effect (<a onClick="return mV(\'Exd\',7,5);">7:5</a> P; <a onClick="return mV(\'Exd\',7,17);">7:17</a> JE; <a onClick="return mV(\'Exd\',8,10);">8:10</a> R; <a onClick="return mV(\'Exd\',8,22);">8:22</a>; <a onClick="return mV(\'Exd\',9,14,29,30);">9:14,29,30</a> JE; <a onClick="return mV(\'Exd\',10,2);">10:2</a> R; <a onClick="return mV(\'Exd\',11,7);">11:7</a> J; compare from the next section, <a onClick="return mV(\'Exd\',14,4);">14:4</a> P; <a onClick="return mV(\'Exd\',14,18);">14:18</a> the Priestly Code (P), which at the same time is also the fundamental thought that forms the connecting link of the whole section). The position of <a onClick="return mV(\'Exd\',11,\'1-3\');">Ex 11:1-3</a> E between <a onClick="return mV(\'Exd\',10,28,29);">10:28,29</a> E and <a onClick="return mV(\'Exd\',11,8);">11:8</a> J constitutes a difficulty, because in the last-mentioned passages Moses is represented as standing continuously before Pharaoh. The announcement made by Yahweh to Moses, that one more plague is to come, and that the Israelites should borrow articles of value from the Egyptians, must in reality have been made before, but for good reasons it is mentioned for the first time at this place, in order to explain the confident utterance of Moses, that he would not again appear before Pharaoh (<a onClick="return mV(\'Exd\',10,29);">10:29</a>). But the fact that according to <a onClick="return mV(\'Exd\',12,32);">12:31</a> JE Pharaoh does in reality once more cause Moses and Aaron to be called, can readily be explained on the ground of the events that happened in the meantime.<P>The structure of <a onClick="return mV(\'Exd\',12,\'1-\');">Exodus 12</a>f contains nothing that could not have been written by one and the same author. Only Moses naturally did not at once communicate (<a onClick="return mV(\'Exd\',12,21);">12:21</a>ff) to the leading men of Israel the command given in <a onClick="return mV(\'Exd\',12,15);">12:15</a>ff concerning the unleavened bread, which command had been given for later generations; and not until <a onClick="return mV(\'Exd\',13,3);">13:3</a>ff is this command mentioned in connection with the order given to the people in the meantime concerning the firstborn (<a onClick="return mV(\'Exd\',13,1);">13:1</a>f). The further fact, that the story of the exodus reaches a preliminary conclusion in <a onClick="return mV(\'Exd\',12,42);">12:42</a> before the details of the Passover (verses <a onClick="return mV(\'Exd\',12,3);">3</a>ff) have been given, is in itself justifiable. As far as contents are concerned, everything in chapters <a onClick="return mV(\'Exd\',12,\'1-\');">12</a>f; namely, the exodus, the festival of unleavened bread, the firstborn, and orders pertaining thereto, that the month of the exodus is to be regarded as the first month, etc., are closely connected with the Passover and the 10th plague. Because the latter had to be described more fully than the other plagues, we find already in <a onClick="return mV(\'Exd\',11,9,10);">11:9,10</a>, after the announcement of this plague and its results, a comprehensive notice concerning all the miracles through which Yahweh demonstrated how He, amid great manifestations of power (<a onClick="return mV(\'Exd\',7,4);">7:4</a> P) and with a mighty hand (<a onClick="return mV(\'Exd\',6,1);">6:1</a> JE), has led His people forth. <P>(3) <a onClick="return mV(\'Exd\',13,\'17-\');">Exodus 13:17</a> - <a onClick="return mV(\'Exd\',18,\'1-27\');">18:27</a>:<P>(a) This section finds its connecting thought in the emphasis placed on the love of Yahweh, on His readiness to help, and His long-suffering in the leading of His at times murmuring people on the road to and as far as Sinai. This section covers two months. What is narrated, beginning with <a onClick="return mV(\'Exd\',16,1);">Ex 16:1</a>, transpires even within a single two weeks (compare <a onClick="return mV(\'Exd\',19,1);">Ex 19:1</a>). No. 1</a> (<a onClick="return mV(\'Exd\',13,\'17-22\');">Ex 13:17-22</a>), describes the journey to Etham (out of love God does not lead the people the direct way, since He fears that they will become unfaithful in the event of a battle; Joseph\'s bones are taken along, since God now really is taking care of His people (compare <a onClick="return mV(\'Gen\',50,24,26);">Ge 50:24, 26</a>); Yahweh\'s friendly presence is shown in the pillar of fire). No. 2</a> (<a onClick="return mV(\'Exd\',14,\'1-31\');">Ex 14:1-31</a>) contains the passage through the Red Sea (Yahweh the helper; compare <a onClick="return mV(\'Exd\',14,10,15);">Ex 14:10, 15</a>, <a onClick="return mV(\'Exd\',14,13,14,20,21,26,31);">13-14, 20-21, 24, 26f; 31</a>, notwithstanding the murmuring of Israel, <a onClick="return mV(\'Exd\',14,11);">14:11</a>f). No. 3</a> (<a onClick="return mV(\'Exd\',15,1);">Ex 15:1</a>ff) contains the thanksgiving hymn of Moses for Yahweh\'s help, with which fact each one of the four strophes begins (<a onClick="return mV(\'Exd\',15,1);">Ex 15:1</a>ff, <a onClick="return mV(\'Exd\',15,6);">6</a>ff, <a onClick="return mV(\'Exd\',15,11,16);">11,16</a> bff). No. 4</a> (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>f) contains Miriam\'s responsorium. No. 5</a> (<a onClick="return mV(\'Exd\',15,\'22-27\');">Ex 15:22-27</a>) treats of Marah and Elim (Yahweh proves Himself to be Israel\'s helper and physician (<a onClick="return mV(\'Exd\',15,25);">Ex 15:25</a>f) notwithstanding the murmuring of Israel (<a onClick="return mV(\'Exd\',15,24);">Ex 15:24</a>)). No. 6</a> introduces the last five pericopes, with a designation of the time (<a onClick="return mV(\'Exd\',16,\'1-36\');">Ex 16:1-36</a>), and describes the miraculous feeding with manna and quails. (The murmuring is particularly emphasized in <a onClick="return mV(\'Exd\',16,2,7,8,9,12);">Ex 16:2,7-9, 12</a>. Israel also gathers more than they have been directed to do (<a onClick="return mV(\'Exd\',16,16);">Ex 16:16</a>f); reserves some for the following day (<a onClick="return mV(\'Exd\',16,19);">Ex 16:19</a>f); collects some on the Sabbath (<a onClick="return mV(\'Exd\',16,27);">Ex 16:27</a>); Yahweh, who in <a onClick="return mV(\'Exd\',16,\'6-12\');">Ex 16:6-12</a> alone is mentioned in rapid succession no fewer than ten times, at first does not even utter a word of reproach, and when the Sabbath has been violated He does nothing more than reprove.) No. 7</a> (<a onClick="return mV(\'Exd\',17,\'1-7\');">Ex 17:1-7</a>) reports the help of Yahweh (<a onClick="return mV(\'Exd\',17,4);">Ex 17:4</a>) at the Waters of Contention (Strife). He even appears on the rock (<a onClick="return mV(\'Exd\',17,6);">Ex 17:6</a>), notwithstanding the murmuring (<a onClick="return mV(\'Exd\',17,\'2-4\',7);">Ex 17:2-4,7</a>). No. 8</a> (<a onClick="return mV(\'Exd\',17,\'8-16\');">Ex 17:8-16</a>) describes the victory over the Amalekites, which furnished the occasion for the erection of the memorial altar, called \'Yahweh-my-Banner.\' Possibly in this connection Joshua ("Yahweh helps") was changed from Hosea (<a onClick="return mV(\'Num\',13,16);">Nu 13:16</a>). Compare Hengstenberg, Authenthic. des Pentateuches, II, 395f. No. 9</a> (<a onClick="return mV(\'Exd\',18,\'1-12\');">Ex 18:1-12</a>) shows in a constantly changing variety of expressions that emphasis is laid on the impression which the deeds of God in connection with Israel make on Jethro, the father-in-law of Moses, while he was visiting the latter (<a onClick="return mV(\'Exd\',18,1,\'8-12\');">Ex 18:1,8-12</a>). Effective in this connection is also the mention made of the symbolical names of the sons of Moses (Gershom, "I have been a sojourner in a foreign land"; and Eliezer, "The God of my father was my help, and delivered me from the sword of Pharaoh" (<a onClick="return mV(\'Exd\',18,3);">Ex 18:3</a>f)). Further, the name Mount of God (<a onClick="return mV(\'Exd\',18,5);">Ex 18:5</a>; compare <a onClick="return mV(\'Exd\',18,12);">Ex 18:12</a>) probably is a reminder of the fulfillment of <a onClick="return mV(\'Exd\',3,12);">Ex 3:12</a>. No. 10</a> (<a onClick="return mV(\'Exd\',18,\'13-17\');">Ex 18:13-17</a>) shows how God helps Moses (compare <a onClick="return mV(\'Exd\',18,19);">Ex 18:19</a>) through the advice of Jethro to appoint judges. In this part, too, <a onClick="return mV(\'Exd\',13,\'17-\');">Exodus 13:17-18:27</A>, we have ten sections, which can easily be arranged in groups of two and two. Thus Nos. 1 and 2 are connected by their analogous beginnings (<a onClick="return mV(\'Exd\',13,17,18);">13:17,18</a> RE; <a onClick="return mV(\'Exd\',14,1,2);">14:1,2</a> P) and by the cloud of fire (<a onClick="return mV(\'Exd\',13,21);">13:21</a>f JE; <a onClick="return mV(\'Exd\',14,19,24);">14:19,24</a> J); Nos. 3 and 4 by the responsive hymn; Nos. 5 and 6, which already by the feeling of hunger and thirst are connected in thought, by their reference to the ordinances of Yahweh (<a onClick="return mV(\'Exd\',15,25);">15:25</a> D; <a onClick="return mV(\'Exd\',16,4);">16:4</a> JE ?; <a onClick="return mV(\'Exd\',16,28);">16:28</a> R); Nos. 7 and 8 by the use made of Moses\' staff (<a onClick="return mV(\'Exd\',17,5,9);">17:5,9</a> JE); Nos. 9 and 10 by Jethro\'s person, and the close connection of their contents in point of time (<a onClick="return mV(\'Exd\',18,13);">18:13</a>). Further, the Biblical text of this place is clearly presupposed in the list of stations, expressly stated to have been prepared at the command of Moses (<a onClick="return mV(\'Num\',33,\'1\');">Nu 33</a>). This list, as is acknowledged on all sides, has the characteristics of P; and it takes into consideration not only the portions ascribed to this source, but also the text of JE. Compare <a onClick="return mV(\'Num\',33,9);">Nu 33:9</a> (Marah and Elim) with <a onClick="return mV(\'Exd\',15,\'22-27\');">Ex 15:22-27</a>, and <a onClick="return mV(\'Num\',33,14);">Nu 33:14</a> (lack of water in Rephidim) with <a onClick="return mV(\'Exd\',17,1);">Ex 17:1</a>ff.<P>(b) Over against the analysis into different sources the following data in detail can also be advanced. In P the last demonstration of the power of Yahweh over Pharaoh would be indeed endangered in <a onClick="return mV(\'Exd\',14,4,15);">Ex 14:4, 15</a>ff, <a onClick="return mV(\'Exd\',14,21);">21a</a>, but afterward would not be related. In <a onClick="return mV(\'Exd\',16,1);">Ex 16:1</a> we cannot find in the Priestly Code (P), unless we bring in also <a onClick="return mV(\'Exd\',15,27);">15:27</a> from JE, how Israel came to be in Elim. On the other hand, in <a onClick="return mV(\'Exd\',16,4);">16:4</a>ff (JE?) the promise of bread from heaven is groundless without the preceding verses, which are attributed to P; and without <a onClick="return mV(\'Exd\',17,1);">17:1</a> the Priestly Code (P), we do not know to what the word "there" in <a onClick="return mV(\'Exd\',17,3);">17:3</a> belonging to JE refers, and how in <a onClick="return mV(\'Exd\',17,8);">17:8</A> JE the Israelites had come to Rephidim. How entirely data taken from the language utterly fail here in establishing the separation o
