atural selection" and "survival of the fittest." But all efforts to harmonize Gen with science upon this basis lead at the best to the negative conclusion that these two are so far different in their purpose and scope as not to involve radical contradiction. A positive agreement between them cannot be claimed.<P>The difficulty vanishes in its entirety when it is borne in mind that the two accounts are controlled by different interests, treat primarily of different matters and, where they appear to cover the same ground, do so each in an incidental way. This means that their statements outside of the sphere of their primary interests are popularly conceived and expressed, and cannot be set over against each other as rivals in scientific presentation. Upon this basis the Genesis account is the vehicle of religious instruction (not, however, an allegory); its cosmogonic accounts are not intended to be scientifically correct, but popularly adequate. For all that science is concerned, they may be traditional conceptions, handed down in the form of folklore, and purged of the grotesque, purely mythological element so apt to luxuriate in folklore. Between such accounts and the dicta of pure science, it would be absurd either to assume or to seek for harmony or discord. They are parallel pictures; in the one the foreground is occupied by the actual unfolding of the facts, the religious element is concealed deep by the figures in the foreground. In the other the background of haze and cloud is the domain of fact, the foreground of definite figures consists of the religious ideas and teachings. The evolutionary notion of the origin of living forms on the earth can thus in no way be assumed as in contradiction either to the letter or the spirit of the teaching of Gen.<P>6. The Descent (Ascent) of Man:<P>A still more important problem arises when the evolutionary theory touches the origin of man upon earth. Here, too, not simply the Biblical account of the creation of Adam and Eve, and their primitive life in the Garden of Eden as recorded in <a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a> is affected, but all that is said of man as a child of God, clothed with peculiar dignity and eternal worth.<p>(1) The difference between the Biblical and evolutionary records of the creation of man may easily be resolved if the Biblical account (<a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a>) is not viewed as a literal statement of actual occurrences, but as the vehicle of certain determinative thoughts designed to affiliate man in his proper relation to God. This means that what is essential in the Biblical account is that man as a distinctive and different being in the world came into existence as the result of a special act of will on the part of God, that he was created as the golden summit of the whole upward movement of life. He is not a mere creature of Nature, but the offspring of the Divine will, with power to know his Maker, to hold fellowship with Him and to carry in him the rational and moral image of the Creator of all. Against this view of the origin of man, evolutionary science has nothing to set over. It is concerned with the process through which the emergence of such a being as man was accomplished, and the time and circumstances in which it took place. These points it finds as it finds similar points affecting other living beings.<P>It would be easy of course to take materialistic forms of the evolutionary theory, such as that advocated by Haeckel, Guyeau, Ray Lankester, and establish an irreconcilable discord between them and the Biblical account; but such varieties of theory are distinguished, not by the occurrence of the idea of evolution in them, but rather by the materialistic metaphysics underlying them; when, for instance, Haeckel defines the notion of evolution by excluding from it intelligence or purpose, and by obliterating differences between the lower animal creation and man, he does so not as an evolutionist in science, but as a materialist (Monist of the materialistic type) in metaphysics. The moment the evolutionist determines to limit himself to the scientific side of his task, and the interpreter of the Biblical account to the religious side of his task, the assumed discord in <a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a> and the evolutionary theory totally vanishes.<P>(2) The more important point of contact between theory of evolution and the Biblical conception of man, however, is that of the notion of the dignity and worth of man. The very existence of a Bible is based on the idea that man is of some consequence to the Creator. And through the Bible this idea not only appears early (<a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>), "Let us make man in our image, after our likeness," followed by the statement, "And God created man in his own image, in the image of God created he him; male and female created he them," but is interwoven with every fundamental teaching.<P>It is contended that a representation like this is not compatible with the evolutionary conception of the origin of man from simian ancestors. The contention would be well supported if the evolutionary theory actually obliterated the line of distinction between man and the lower creation; and in any form of it in which such line is ignored, and man is regarded as a being of the same order (neither more or less) as those from which he sprang, it is not capable of being harmonized with the Biblical doctrine. But as a matter of fact, the whole drift and tendency of evolutionary thought ought to be and is the very opposite of belittling man. For according to it, man is the culmination and summit of a process whose very length and complexity simply demonstrate his worth and dignity as its final product. Accordingly, some of the most radical evolutionists, such as John Fiske (Through Nature to God) have extended and strengthened the argument for the immortality of man by an appeal to his evolutionary origin.<P>7. The Origin and Nature of Religion:<P>Kindred to the problem of the origin of man, and, in some aspects of it, a part of that problem, is the further problem of the origin and nature of religion. First of all, according to evolution, religion cannot be an exception to the general law of the emergence of the more complex from simpler antecedents. Accordingly, it must be supposed to have evolved from non-religious or pre-religious elements. But the very statement of the case in this form necessitates the clear conception of the idea of religion. If religion is the sense in the human soul of an infinite and eternal being, or beings, issuing in influences upon life, then it is coeval with man and inseparable from the human soul. There never was a time when man was not religious. The very emergence of this sense in the mind of a prehuman ancestor of man would change the brute into the man.<P>We may speak of the states of the prehuman brute\'s mind as "materials for the making of religion," but not as religion. Their transformation into religion is therefore just as unique as the creation of the man himself. Whatever the mental condition of the brute before the emergence of the sense of an eternal reality and the dependence of itself upon that reality, it was not a religious being. Whatever the form of this sense, and whatever its first content and results, after the emergence of man it became religion. What caused it to appear at that particular moment and stage in the course of the onward movement? This is a question of causes, and its answer eludes the search of science, both pure and philosophical, and if undertaken by pure philosophy, leads to the same diversity of hypotheses as has been found to control the solution of the problem of beginnings in general (Agnosticism, Pantheism, Theism).<P>For the rest, that the general features hold true in the field of religion is obvious at a glance. Religious thought, religious practices, religious institutions, have undergone the same type of changes as are observed in the material universe and in the realm of life.<P>8. The Moral Nature:<P>What is true of religion as an inner sense of a reality or realities transcending the outward world is equally, and even more clearly, true of the moral life which in one aspect of it is the outward counterpart of religion. To speak of the evolution of the conscience from non-ethical instincts is either to extend the meaning and character of the ethical into a region where they can have no possible significance, or to deny that something different has come into being when the sense of obligation, of duty, of virtue, and the idea of the supreme good have appeared.<P>In other particulars, the development of the moral nature of man, both in the individual and in the community, manifestly follows the process discerned in the material universe at large, and in the realm of organized life in particular. As an observed fact of history, the gradual growth of moral ideas and the mutual play of the inner controlling principle of the sense of oughtness ("the voice of God") and of social conditions and necessities, arising from the nature of man as a social being, are so manifest that they could neither be denied nor better explained in any other way than in accordance with the evolutionary view.<P>9. Christianity and Christian Doctrine:<P>But the rise of the evolutionary theory calls for a new consideration not only of the questions of the origin and nature of religion and morality, but also of that of the content of the Gospel.<P>(1) At the basis of Christianity lies the idea of revelation. The God whom Jesus presented to men is supremely concerned in men. He communicates to them His interest in and His wishes concerning them. This fact the followers of Jesus have in general called "revelation." Some have insisted and still do insist that such revelation must be supernatural. Setting aside the consideration that the term "supernatural" does not occur in Biblical phraseology, and that the notion is deduced by a process of interpretation which leaves a large flexibility to it, i.e. a possibility of conceiving it in a variety of ways, revelation itself is not necessarily bound up with any special method of the communication of the Divine will (compare <a href="./study/isbe/search.html?string=REVELATION,+1-2">REVELATION</A>). Analogies drawn from human life furnish many different ways of making known to the minds of intelligent fellow-beings the thought of one\'s own mind. These include, first, the pragmatic resort to some act or attitude of a physical nature, as, for instance, the touch of the whip or the point of the spur on the horse; the flown or the smile for the higher class of understanding of the human type. Secondly, the linguistic, wherein by conventional, articulate, highly complex sounds, one tells in words what lies in his own consciousness. All such expression is necessarily partial, indirect and symbolic. Thirdly, the telepathic and mysterious method (whose reality some still doubt) by which communication takes place without the mediation of either language or action. The evolutionary view does not exclude the possibility of any of these methods conceived as ethical and psychological processes. It does exclude any and all of them if understood as magical or preternatural phenomena. There is nothing, however, in a proper interpretation of the facts of Christian revelation to force the magical interpretation of the coming of the Divine message.<P>On the contrary, there is everything in the gradual and progressive method of the formation of the Christian Scriptures to suggest that the law of evolution was not violated here. One of the latest writers in Scripture plainly represents the whole method of revelation from the Divine point of view as a cumulative delivery of knowledge in different and successive parts and aspects (<a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a>). Both at its inception and in the course of its history, the gospel shows conformity to this fundamental law.<P>(2) Evolution and incarnation: One of the strongest objections to the idea of an all-comprehensive generalization of the law of evolution has been said to be that such a law would destroy the uniqueness of the personality of Jesus Christ. This is, however, due to a confusion of thought. In reality it is no more a denial of uniqueness to say that the Son of God entered the world in accordance with the laws of the world as ordered by the Father, than to say that He was subject to those laws after He entered the world; for instance, that He hungered and thirsted, was weary and needed rest and sleep, that His hands and feet bled when they were pierced and that He ceased to breathe when His heart failed to beat. It is a denial of uniqueness as to the method of entrance into the world, but not a denial of uniqueness of character, of nature, even of essence in the Nicene sense. It behooved Him, in bringing many sons to perfection, "to make the captain of their salvation perfect through suffering." The question of the Virgin Birth of Jesus is definitely excluded from the discussion because it is one of historical evidence chiefly, and, in whatever way the evidence may solve it, theory of evolution will have no difficulty to set over against the solution.<P>See <a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>.<P>From the evolutionist\'s point of view, the incarnation is the climax and culmination of the controlling process of the universe (see <a href="./study/isbe/search.html?string=PERSON+OF+CHRIST,+1-3">INCARNATION</a>). Evolution demands such a consummation as the appearance of a new type of person, and particularly the type which appeared in Jesus Christ. This is not saying that other men can be or have been of the same nature and essence as the incarnate Saviour. It is saying simply that through the incarnation God brings into perfection the ideal embodied and unfolded in previous generations partially, and held in view as the goal through the whole process of previous struggle and attainment. In other words, the New Adam, in Jesus Christ, emerges in the course of the upward ascent of man as the Adam of Gen emerged in the upward ascent from the lower creation. Theology from the point of view of revelation must necessarily explain this as the voluntary entrance of the Son of God into humanity for purposes of redemption. In doing so it does not contradict the evolutionary view, but simply presents another aspect of the subject. Assuming, as is done throughout, that the evolution theory concerns not causes and principles, but the processes of transformation of life, the idea of the world is not complete with the creation of man in the image of God. That image must be brought into perfection through the incoming of eternal life. But eternal life is the life of God lived in the species of time and space. It could only come in a personal form through fellowship with God. The bringing of it must therefore be the necessary goal to which all the age-long ascent pointed.<P>The Incarnation fulfills the conditions of the evolutionary process in that it inserts into the world by a variation the new type governed by the principle of self-sacrifice for others. This is a new principle with Christ, although it is constituted out of preexisting motives and antecedents, such as the "struggle for others" (compare Drummond, The Ascent of Man) and "altruism" (in its noble instances in human history). It is a new principle, first, because in its pre-Christian and extra-Christian antecedents it is not real self-sacrifice, not being consciously consummated as the result of the outplay of the motive given in eternal life, and secondly, because it reverses the main stream of antecedent motive. It enthrones love by revealing God\'s supreme character and motive to be love. Thus viewed the Incarnation is the real entrance into the stream of cosmic movement of the Superman. Nietzsche\'s Superman would be exactly the contrary of this, i.e. the reversion of man to the beast, the denial of the supremacy of love, and the assertion of the supremacy of might.<P>(3) Another difficulty met by the harmonist of the Christian system with the evolutionary theory is that of the problem of sin. The method of the origin of sin in the human race, as well as its nature, are given in the Biblical account in apparently plain words. The first man was sinless. He became sinful by an act of his own.<P>As compared with this, according to one common conception of the law of evolution, all the bad tendencies and propensities in man are the survival of his animal ancestry. Cruelty, lust, deceitfulness and the like are but the "tiger and the ape" still lingering in his spiritual constitution, just as the vermiform appendix and the coccyx remain in the physical, mere rudiments of former useful organs; and just like the latter, they are apt to interfere with the welfare of the species later developed. Here, as in every previous stage of our survey, the difficulty arises from the failure to distinguish between that which appears in man as man, and the propensities in animals which lead to acts similar in appearance, but different in their place and function in the respective lives of those animals. As a matter of fact, the tendencies to cruelty, greed, lust and cunning in the brute are not sinful. They are the wholesome and natural impulses through which the individual and the race are preserved from extinction. They are sinful in man because of the dawn in the soul of a knowledge that his Maker is showing him a better way to the preservation of the individual and the race in the human form. Until the sense of the obligation to follow the better way has arisen, there can be no sin. But when it has come, the first act performed in violation of that sense must be regarded as sinful. As the apostle Paul puts it, "I had not known sin, except through the law." "I was alive apart from the law once: but when the commandment came, sin revived (was made to live) and I died" (<a onClick="return mV(\'Rom\',7,7,9);">Ro 7:7, 9</a>).<P>Instead of militating against the idea of a primitive fall, the discovery of the law of evolution confirms it by showing that at some time, as the moral sense in man arose, in the very earliest stage of his existence as man, by an act of his own will, he set aside the new and better principle of conduct presented to him in his inner consciousness (disobeyed the voice of God), and fell back to the prehuman non-moral rule of his life. If this is not the doctrine of the Fall expressed in the terms of present-day science, it would be hard to conceive how that doctrine could be formulated in modern words.<P>(F. J. Hall, Evolution and the Fall; compare <a href="./study/isbe/search.html?string=FALL,+THE">FALL, THE</a>.)<P>According to this theory, it was possible for man as he first began his career upon the earth to have passed at once into the condition of perfect fellowship with God. Development might have been sinless. But it was not likely. And it was not desirable that it should be (see <a href="./study/isbe/search.html?string=ADAM+IN+THE+OLD+TESTAMENT">ADAM IN THE OLD TESTAMENT</a>). For moral character apart from struggle and victory is weak and only negatively perfect. The elimination of sin was to be accomplished by a process which according to the evolutionary philosophy everywhere and always produces higher and stronger types. It is only as progress is achieved by regeneration following degeneration that the best results are secured. Thus "where sin abounded," it was \'in order that grace might superabound\' (<a onClick="return mV(\'Rom\',5,20);">Ro 5:20</a>). Yet neither is sin the less sinful nor grace the less supernatural. It would be reading an unwarrantable doctrine into Scripture to say that upon the whole an unfallen race would have been superior to a fallen and redeemed race. The world as it is is not a mistake but the wisest thought of God.<P>The mystery of evil in the world is thus left neither more nor less difficult to understand under the evolutionary conception than under any other. The difficulty of an unbroken continuity between the lower and the higher forms of life, culminating in the free will of man, with the necessary possibility of conflict with the will of God, is not treated by the evolutionary philosophy, even though it may not be materially relieved. To this extent, however, it is relieved, that the Divine action is here understood to be analogous and consistent with itself throughout, even though transcending in scope and extent the human intelligence.<P>(4) In the light of what has already been made clear, it will be easy to dismiss the correlative doctrine of salvation from sin as fully compatible with the idea of evolution. The Christian doctrine of salvation falls into two general parts: the objective mediatorial work of the Redeemer, commonly called the Atonement, and the subjective transforming work of the Holy Spirit, begun in regeneration and continued in sanctification.<P>The idea of the Atonement lies somewhat remote from the region where the law of evolution is most clearly seen to operate. At first sight it may be supposed to sustain no special relation to evolution either as offering difficulties to it or harmonizing with it and corroborating it. Yet in a system whose parts are vitally interrelated, it would be strange if the acceptance of the evolutionary theory did not in some way and to some extent affect the conception. It does so by fixing attention on the following particulars:<P>(a) That with the emergence of man as a personality, the relation of the creature to the Creator comes to be personal. If that personal relation is disturbed, it can be restored to its normal state in accordance with the laws observed in the relations of persons to one another. The Atonement is such a restoration of personal relations between God and man.<P>(b) In achieving the goal of perfect fellowship with Himself on the part of creatures bearing His own image, the Creator must in a sense sacrifice Himself. This Divine self-sacrifice is symbolized and represented in the Cross. Yet the meaning of the Cross is not exhausted in mere external influence upon the sinful creature whose return to the holy Father is thereby aimed at.<P>(c) Since the alienation of the creature by sin represents an offense to the person of the Creator, there is necessity that this offense should be removed; and this is done through the sacrifice of the Incarnate Son identifying Himself with, and taking the place of, the sinful creature.<P>The correlative doctrine of Regeneration stands much nearer the center of the thought of evolution. It has always been conceived and expressed in biological phraseology. The condition of sin postulated by this doctrine is one of death. Into this condition a new life is inserted, an act which is called the New Birth. Whatever life may be in its essence, it overcomes, reverses and directs the lower forces to other results than they are observed to achieve apart from its presence. In analogy to this course of life in the process of regeneration, a new direction is given to the energies of the new-born soul. But the analogy goes farther. Regeneration is from above as life is always from above. It is God\'s Spirit through the word and work of Christ that begets the new Christian life, nurtures, trains and develops it to its full maturity revealed in the image and stature of Christ Himself (see <a href="./study/isbe/search.html?string=REGENERATION">REGENERATION</a>).<P>10. Conclusion:<P>If the above considerations are valid, the evolutionary and the Christian views of the world cannot logically be placed against each other as mutually exclusive and contradictory. They must be conceived as supplementing one another, and fulfilling each the promise and possibility of the other. Evolution is a scientific generalization which, kept within the limits of science, commends itself as a satisfactory explanation of the great law controlling all the movements of matter, life and mind. Christianity, so far as it enters into the intellectual life, is interested in the idea of God and of man\'s relation to God. It may confidently leave the facts in the lower world of processes of transformation to be schematized under the scientific generalization of evolution.<P>LITERATURE.<P>The literature of the subject is vast. At the basis of the discussion stand the works of Darwin, Huxley, Wallace, Spencer, Weismann, Haeckel, Romanes and others. For a clear statement of theory, see Metcalf, An Outline of the Theory of Organic Evolution, 1905; Saleeby, Evolution the Master-Key, 1907; Osborn, From the Greeks to Darwin (historical), 1908. On its relation to religion and Christianity, B. F. Tefft, Evolution and Christianity, 1885; E. Caird, The Evolution of Religion, 1893; Le Conte, Evolution; Its Nature, Its Evidences and Its Religious Thought, 1888; McCosh, The Religious Aspect of Evolution, 1888; Iverach, Christianity and Evolution, 1894. On its bearing on the ideas of man, sin and redemption, Griffith-Jones, The Ascent through Christ, 1900; H. Drummond, The Ascent of Man, 12th edition, 1901; Tyler, The Whence and Whither of Man; Orr, The Image of God in Man, 1907; Sin as a Problem of Today, 1910; Hall, Evolution and the Fall, 1910; Murray, Christian Faith and the New Psychology, 1911; T. A. Palm, The Faith of an Evolutionist, 1911.<P>(EDITORIAL NOTE.—It will be understood, that while Professor Zenos has been asked and permitted to state his views on this question unreservedly, neither the publishers nor the editors are to be held as committed to all the opinions expressed.)``199';
isbe[3279]='Ewe`u (rachel, \'ul, seh, "a female sheep"):<P>Rachel (compare pr. note Rachel, and Arabic rachala, "to migrate") is the ordinary Hebrew word for ewe, but is translated "sheep," though with clear indication of sex in context, in <a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a> and <a onClick="return mV(\'Sgs\',6,6);">So 6:6</a> (the Revised Version (British and American) "ewes"). \'Aloth, participle of \'ul, "to suckle" (compare Arabic ghal) is found in <a onClick="return mV(\'Psa\',78,71);">Ps 78:71</a> and <a onClick="return mV(\'Isa\',40,11);">Isa 40:11</a> (the King James Version "are with young," the English Revised Version "that give suck," the American Standard Revised Version "have their young"). In <a onClick="return mV(\'1Sa\',6,7,10);">1Sa 6:7, 10</a> occurs paroth \'aloth, "milch kine." Seh, in <a onClick="return mV(\'Lev\',22,28);">Le 22:28</a>, while translated "ewe," might from the context be "ewe" or "shegoat" and indeed seems to be used here as a term applying equally to either, being used elsewhere for one of a flock of sheep or goats.`<a href="./study/isbe/search.html?string=SHEEP">SHEEP</a>`37';
isbe[3280]='Exact`eg-zakt\':<P>(1) naghas (<a onClick="return mV(\'Deu\',15,2,3);">De 15:2-3</a>; <a onClick="return mV(\'2Ki\',23,35);">2Ki 23:35</a>; <a onClick="return mV(\'Isa\',58,3);">Isa 58:3</a>), to secure by force or pressure interest or money for tribute, and perhaps, in <a onClick="return mV(\'Isa\',58,3);">Isa 58:3</a>, labor or toil; but compare the Revised Version, margin "oppress all your laborers"; probably better with a slight change of text, "exact money lent on pledges" (reading for \'abhoT beyedhekhem, \'atstsebhekhem).<P>(2) nasha\', or nashah (<a onClick="return mV(\'Neh\',5,7,10,11);">Ne 5:7, 10-11</a> (the King James Version not the Revised Version (British and American)) <a onClick="return mV(\'Job\',11,6);">Job 11:6</a> (but see below); <a onClick="return mV(\'Psa\',89,22);">Ps 89:22</a>), to demand interest, to be a harsh and importunate creditor, a practice which Nehemiah asks the Jews to forego. <a onClick="return mV(\'Job\',11,6);">Job 11:6</a> better with the Revised Version, margin for "exact," "causeth to be forgotten."<P>(3) yotse\' (<a onClick="return mV(\'2Ki\',15,20);">2Ki 15:20</a> (if text is correct)). Menahem secured the tribute which the king of Assyria demanded by levying a tax on the chief men of his kingdom.<P>(4) prassein (<a onClick="return mV(\'Luk\',3,13);">Lu 3:13</a> the King James Version (compare <a onClick="return mV(\'Dan\',11,20);">Da 11:20</a> Septuagint); 1Macc 10:35 the Revised Version (British and American)), to demand money or tribute or taxes of anyone.``13';
isbe[3281]='Exaction`eg-zak\'-shun:<P>(1) mashsha\' (<a onClick="return mV(\'Neh\',10,31);">Ne 10:31</a>), a demand for money lent on pledge, which the Jews agreed to forego in the seventh year;<P>(2) gerushah (<a onClick="return mV(\'Eze\',45,9);">Eze 45:9</a>, "your exactions," the Revised Version, margin "expulsions"), eviction from house and home.``1';
isbe[3282]='Exactors`eg-zak\'-ters (noghesayikh (<a onClick="return mV(\'Isa\',60,17);">Isa 60:17</a>, the Revised Version, margin "taskmasters"; compare <a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>; <a onClick="return mV(\'Exd\',3,7);">3:7</a>)):<P>Righteousness personified is in Zion to take the place of the officials who oppress the people. In <a onClick="return mV(\'Isa\',14,4);">Isa 14:4</a> the American Revised Version, margin, Babylon is called an "exactress of gold."``1';
isbe[3283]='Exalt`eg-zolt\' (rum, gabhah (mappiq he), nasa\'; hupsoo):<P>The Hebrew word most often translated "exalt," "exalted," is rum; "to lift up," "to be or become high." It is used with reference to both God and man, eg. <a onClick="return mV(\'Exd\',15,2);">Ex 15:2</a>, "My father\'s God, and I will exalt him"; <a onClick="return mV(\'Psa\',99,5,9);">Ps 99:5, 9</a>, "Exalt ye Yahweh our God"; compare <a onClick="return mV(\'Psa\',107,32);">107:32</a>; <a onClick="return mV(\'Psa\',118,5,28);">118:28</a>; <a onClick="return mV(\'1Sa\',2,10);">1Sa 2:10</a>, "Exalt the horn of his anointed"; <a onClick="return mV(\'Job\',17,4);">Job 17:4</a>, "Therefore shalt thou not exalt them"; compare <a onClick="return mV(\'Isa\',13,2);">Isa 13:2</a> the King James Version; <a onClick="return mV(\'Isa\',14,13);">14:13</a>; gabhah, "to be high," figuratively "to be exalted," occurs in <a onClick="return mV(\'Job\',36,7);">Job 36:7</a>; <a onClick="return mV(\'Pro\',17,19);">Pr 17:19</a> the King James Version; <a onClick="return mV(\'Isa\',5,16);">Isa 5:16</a>, etc.; nasa\', "to lift up," occurs in <a onClick="return mV(\'Num\',24,7);">Nu 24:7</a>; <a onClick="return mV(\'1Ch\',29,11);">1Ch 29:11</a>, etc.; other words are calal, "to raise up" (<a onClick="return mV(\'Exd\',9,17);">Ex 9:17</a>; <a onClick="return mV(\'Pro\',4,8);">Pr 4:8</a>), saghabh (<a onClick="return mV(\'Job\',5,11);">Job 5:11</a>; <a onClick="return mV(\'Job\',36,22);">36:22</a> the King James Version; <a onClick="return mV(\'Isa\',2,11,17);">Isa 2:11, 17</a>; <a onClick="return mV(\'Isa\',12,4);">12:4</a>; <a onClick="return mV(\'Isa\',33,5);">33:5</a>), ramam, "to be high" (<a onClick="return mV(\'Job\',24,24);">Job 24:24</a>; <a onClick="return mV(\'Psa\',118,16);">Ps 118:16</a>).<P>In the New Testament "exalt" is the translation of hupsoo, "to elevate" (not used with reference to God) (<a onClick="return mV(\'Mat\',11,23);">Mt 11:23</a>; <a onClick="return mV(\'Mat\',23,12);">23:12</a>; <a onClick="return mV(\'Act\',2,33);">Ac 2:33</a>; <a onClick="return mV(\'2Cr\',11,7);">2Co 11:7</a>; <a onClick="return mV(\'1Pe\',5,6);">1Pe 5:6</a>, etc.); also (twice) of epairo, "to lift up, upon or against" (<a onClick="return mV(\'2Cr\',10,5);">2Co 10:5</a>; <a onClick="return mV(\'2Cr\',11,20);">11:20</a>), once of huperairo, "to lift up above" (<a onClick="return mV(\'2Th\',2,4);">2Th 2:4</a>); in <a onClick="return mV(\'2Cr\',12,7);">2Co 12:7</a> bis, this word is translated "exalted above measure," the Revised Version (British and American) "exalted overmuch"; huperupsoo, "to lift up above" (<a onClick="return mV(\'Phl\',2,9);">Php 2:9</a>), is translated "highly exalted"; hupsos, "elevation," is translated "exalted" (<a onClick="return mV(\'Jam\',1,9);">Jas 1:9</a>, the Revised Version (British and American) "high estate").<P>For "it increaseth" (<a onClick="return mV(\'Job\',10,16);">Job 10:16</a>), the Revised Version (British and American) gives "and if my head exalt itself"; instead of "God exalteth by His, power" (<a onClick="return mV(\'Job\',36,22);">Job 36:22</a>), "God doeth loftily in his power"; for "though thou exalt thyself as the eagle" (<a onClick="return mV(\'Oba\',1,4);">Ob 1:4</a>), "mount on high"; for "highly esteemed" (<a onClick="return mV(\'Luk\',16,15);">Lu 16:15</a>) "exalted"; for "exalteth itself" (<a onClick="return mV(\'2Cr\',10,5);">2Co 10:5</a>), "is exalted"; for "He shall lift you up" (<a onClick="return mV(\'Jam\',4,10);">Jas 4:10</a>), "He shall exalt you." Self-exaltation is strongly condemned, especially by Christ; humbleness is the way to true exaltation (<a onClick="return mV(\'Mat\',23,12);">Mt 23:12</a>; <a onClick="return mV(\'Luk\',14,11);">Lu 14:11</a>; <a onClick="return mV(\'Luk\',18,14);">18:14</a>; compare <a onClick="return mV(\'Jam\',4,10);">Jas 4:10</a>; <a onClick="return mV(\'1Pe\',5,6);">1Pe 5:6</a>); the supreme example is that of Christ Himself (<a onClick="return mV(\'Phl\',2,\'5-11\');">Php 2:5-11</a>).``185';
isbe[3284]='Exaltation of Christ, the``<a href="./study/isbe/search.html?string=CHRIST,+THE+EXALTATION+OF">CHRIST, THE EXALTATION OF</a>`1';
isbe[3285]='Examine; Examination`eg-zam\'-in, eg-zam-i-na\'-shun:<P>darash, "to follow," "inquire," "make inquisition" (<a onClick="return mV(\'Ezr\',10,16);">Ezr 10:16</a>); and bachan, "to test," "investigate," "prove," "tempt" (<a onClick="return mV(\'Psa\',26,2);">Ps 26:2</a>). The former was the judicial term. anakrino, "scrutinize," "investigate," "interrogate" (in court), "judge," "search" (<a onClick="return mV(\'Luk\',23,14);">Lu 23:14</a>; <a onClick="return mV(\'Act\',4,9);">Ac 4:9</a>; <a onClick="return mV(\'Act\',12,19);">12:19</a>; <a onClick="return mV(\'Act\',28,18);">28:18</a>; <a onClick="return mV(\'1Cr\',9,3);">1Co 9:3</a>); and anetazo, "to investigate" (judicially), "examine" (<a onClick="return mV(\'Act\',22,24,29);">Ac 22:24, 29</a>). Also dokimazo, "to test," "examine," "try" (<a onClick="return mV(\'1Cr\',11,28);">1Co 11:28</a> the King James Version); and peirazo, "scrutinize," "discipline" (<a onClick="return mV(\'2Cr\',13,5);">2Co 13:5</a> the King James Version). The noun anakrisis, "examination," "investigation," occurs in <a onClick="return mV(\'Act\',25,26);">Ac 25:26</a>.`<a href="./study/isbe/search.html?string=COURTS,+JUDICIAL">COURTS, JUDICIAL</a>`77';
isbe[3286]='Example`eg-zam\'-p\'-l (tupos, "a pattern," hupodeigma, "copy" "representation" hupogrammos, "a writing-copy," example):<P>A typical, representative, or illustrative case; a pattern or model for imitation (hupodeigma, <a onClick="return mV(\'Jhn\',13,15);">Joh 13:15</a>; <a onClick="return mV(\'Hbr\',8,5);">Heb 8:5</a> the King James Version; <a onClick="return mV(\'Jam\',5,10);">Jas 5:10</a>; hupogrammos, <a onClick="return mV(\'1Pe\',2,21);">1Pe 2:21</a>; tupos, <a onClick="return mV(\'1Ti\',4,12);">1Ti 4:12</a> the King James Version) or warning (deigma, "a sample," "exhibition," <a onClick="return mV(\'Jud\',1,7);">Jude 1:7</a>; compare <a onClick="return mV(\'2Pe\',2,6);">2Pe 2:6</a>; hupodeigma, <a onClick="return mV(\'Hbr\',4,11);">Heb 4:11</a>; tupos, <a onClick="return mV(\'1Cr\',10,6,11);">1Co 10:6, 11</a>). "Ensample" (tupos, 2Macc 6:28,31; <a onClick="return mV(\'Phl\',3,17);">Php 3:17</a>; <a onClick="return mV(\'1Th\',1,7);">1Th 1:7</a>; <a onClick="return mV(\'2Th\',3,9);">2Th 3:9</a>; <a onClick="return mV(\'1Ti\',4,12);">1Ti 4:12</a>; <a onClick="return mV(\'1Pe\',5,3);">1Pe 5:3</a>) and "example" have the same meaning, but the former is always suggestive of goodness.``1';
isbe[3287]='Exceed; Exceeding; Exceedingly`ek-sed\':<P>The verb is found in other than its present sense in <a onClick="return mV(\'Job\',36,9);">Job 36:9</a> the King James Version, "They have exceeded" the (Revised Version (British and American)) "behaved themselves proudly"); <a onClick="return mV(\'1Sa\',20,41);">1Sa 20:41</a>, "They...wept...until David exceeded" (the King James Version and the Revised Version (British and American)). In both these passages the idea is that of going too far, beyond proper bounds (Hebrew, respectively, gabhar, "be strong" (in the Hithpael); gadhal, "be great" (in the Hiphil). "Exceeding" (as an adverb with adjectives and rarely as an adjective) and "exceedingly" occur often as representing various expressions for the superlative in Hebrew and Greek.``1';
isbe[3288]='Excellency`ek\'-se-len-si (ga-on, ga\'awah; huperbole):<P>"Excellency" in the Old Testament is chiefly the translation of ga\'on, "mounting," "swelling" (<a onClick="return mV(\'Exd\',15,7);">Ex 15:7</a>; <a onClick="return mV(\'Job\',37,4);">Job 37:4</a> the King James Version; <a onClick="return mV(\'Psa\',47,4);">Ps 47:4</a> the King James Version; <a onClick="return mV(\'Isa\',13,19);">Isa 13:19</a> the King James Version, etc.); ga\'awah, rising, is thrice so rendered (<a onClick="return mV(\'Deu\',33,26,29);">De 33:26, 29</a>; <a onClick="return mV(\'Psa\',68,34);">Ps 68:34</a>); se\'eth, "rising" (twice) (<a onClick="return mV(\'Job\',13,11);">Job 13:11</a> the King James Version; <a onClick="return mV(\'Psa\',62,4);">Ps 62:4</a> the King James Version); yether, "superabundance" (twice) (<a onClick="return mV(\'Gen\',49,3);">Ge 49:3</a> the King James Version; <a onClick="return mV(\'Job\',4,21);">Job 4:21</a> the King James Version), and chadhar, "honor," "beauty," "majesty" (twice) (<a onClick="return mV(\'Isa\',35,2);">Isa 35:2</a>); gobhah, "uplifted" (<a onClick="return mV(\'Job\',40,10);">Job 40:10</a>); yithron, "advantage" (<a onClick="return mV(\'Ecc\',7,12);">Ec 7:12</a>); si\', "elevation" (<a onClick="return mV(\'Job\',20,6);">Job 20:6</a>, the Revised Version (British and American) "height"). In the New Testament huperbole, "surpassing," "a casting beyond," occurs (<a onClick="return mV(\'2Cr\',4,7);">2Co 4:7</a>, "that the excellency of the power may be of God," the Revised Version (British and American) "exceeding greatness"); huperoche, "a holding over" or "beyond," is translated "excellency" (<a onClick="return mV(\'1Cr\',2,1);">1Co 2:1</a>), and to huperechon, "the pre-eminence" (<a onClick="return mV(\'Phl\',3,8);">Php 3:8</a>), "the excellency of the knowledge of Christ."<P>Instead of "excellency" the Revised Version (British and American) has "pride" (<a onClick="return mV(\'Isa\',13,19);">Isa 13:19</a>; <a onClick="return mV(\'Eze\',24,21);">Eze 24:21</a>), "majesty" (<a onClick="return mV(\'Job\',37,4);">Job 37:4</a> and the American Standard Revised Version <a onClick="return mV(\'Job\',13,11);">Job 13:11</a>; <a onClick="return mV(\'Job\',31,23);">31:23</a>), the American Standard Revised Version has "pre-eminence" (<a onClick="return mV(\'Gen\',49,3,4);">Ge 49:3-4</a>), "glory" (<a onClick="return mV(\'Psa\',47,4);">Ps 47:4</a>), "dignity" (<a onClick="return mV(\'Psa\',62,4);">Ps 62:4</a>); for "the fat of lambs" (<a onClick="return mV(\'Psa\',37,20);">Ps 37:20</a>), the English Revised Version has "the excellency of the pastures," with margin, "the fat of lambs"; the American Standard Revised Version retains the King James Version rendering with the English Revised Version in the margin; instead of "Doth not their excellency which is in them go away?" (<a onClick="return mV(\'Job\',4,21);">Job 4:21</a>), the Revised Version (British and American) has "Is not their tent-cord plucked up within them?" margin, "Is not their excellency which is in them removed?"``185';
isbe[3289]='Excellent`ek\'-se-lent \'addir, yattir (Aramaic); diaphoroteros, kratistos:<P>The translation of various Hebrew words, chiefly of \'addir, "great," "honorable" (<a onClick="return mV(\'Psa\',8,1,9);">Ps 8:1, 9</a>; <a onClick="return mV(\'Psa\',16,3);">16:3</a>; <a onClick="return mV(\'Psa\',76,4);">76:4</a>); yattir, "surpassing," is Aramaic, occurring in <a onClick="return mV(\'Dan\',2,31);">Da 2:31</a>; <a onClick="return mV(\'Dan\',4,36);">4:36</a>; <a onClick="return mV(\'Dan\',5,12,14);">5:12, 14</a>; <a onClick="return mV(\'Dan\',6,3);">6:3</a>. Other words are bachar, "to glow," "try," "choose" (<a onClick="return mV(\'Sgs\',5,15);">So 5:15</a>); ga\'on, "mounting," "swelling" (<a onClick="return mV(\'Isa\',4,2);">Isa 4:2</a>; see <a href="./study/isbe/search.html?string=EXCELLENCY">EXCELLENCY</A>); gadhal, "to make or become great" (<a onClick="return mV(\'Isa\',28,29);">Isa 28:29</a>), and other words occurring singly.<P>In the New Testament we have diaphoroteros, "greater," "better" (<a onClick="return mV(\'Hbr\',1,4);">Heb 1:4</a>; <a onClick="return mV(\'Hbr\',8,6);">8:6</a>); kratistos, "most excellent," "most noble" (<a onClick="return mV(\'Luk\',1,3);">Lu 1:3</a>; <a onClick="return mV(\'Act\',23,26);">Ac 23:26</a>); ta diapheronta, "things that differ," "are preeminent" (<a onClick="return mV(\'Rom\',2,18);">Ro 2:18</a>; <a onClick="return mV(\'Phl\',1,10);">Php 1:10</a>); megaloprepes, "becoming to the great" (<a onClick="return mV(\'2Pe\',1,17);">2Pe 1:17</a>, the King James Version "a voice to him from the excellent glory," the American Standard Revised Version and the English Revised Version, margin "the Majestic Glory"); kath\' huperbolen "very surpassing" (<a onClick="return mV(\'1Cr\',12,31);">1Co 12:31</a>, "Yet I show unto you a more excellent way," the Revised Version (British and American) "most excellent"); pleion, "greater," "fuller" (<a onClick="return mV(\'Hbr\',11,4);">Heb 11:4</a>; see <a href="./study/isbe/search.html?string=ABEL+(1)">ABEL</a>).``185';
isbe[3290]='Exchange; Exchanger`eks-chanj\', eks-chan\'-jer.`<a href="./study/isbe/search.html?string=BANK;+BANKING">BANK; BANKING</a>`1';
isbe[3291]='Excommunication`eks-ko-mu-ni-ka\'-shun:<P>Exclusion from church fellowship as a means of personal discipline, or church purification, or both. Its germs have been found in (1) the Mosaic "ban" or "curse" (cherem, "devoted"), given over entirely to God\'s use or to destruction (<a onClick="return mV(\'Lev\',27,29);">Le 27:29</a>); (2) the "cutting off," usually by death, stoning of certain offenders, breakers of the Sabbath (<a onClick="return mV(\'Exd\',31,14);">Ex 31:14</a>) and others (<a onClick="return mV(\'Lev\',17,4);">Le 17:4</a>; <a onClick="return mV(\'Exd\',30,\'22-38\');">Ex 30:22-38</a>); (3) the exclusion of the leprous from the camp (<a onClick="return mV(\'Lev\',13,46);">Le 13:46</a>; <a onClick="return mV(\'Num\',12,14);">Nu 12:14</a>). At the restoration (<a onClick="return mV(\'Ezr\',10,7,8);">Ezr 10:7-8</a>), the penalty of disobedience to Ezra\'s reforming movements was that "all his substance should be forfeited (cherem), and himself separated from the assembly of the captivity." Nehemiah\'s similar dealing with the husbands of heathen women helped to fix the principle. The New Testament finds a well-developed synagogal system of excommunication, in two, possibly three, varieties or stages. nidduy, for the first offense, forbade the bath, the razor, the convivial table, and restricted social intercourse and the frequenting of the temple. It lasted thirty, sixty, or ninety days. If the offender still remained obstinate, the "curse," cherem, was formally pronounced upon him by a council of ten, and he was shut out from the intellectual, religious and social life of the community, completely severed from the congregation. shammatha\', supposed by some to be a third and final stage, is probably a general term applied to both nidduy and cherem. We meet the system in <a onClick="return mV(\'Jhn\',9,22);">Joh 9:22</a>: "If any man should confess him to be Christ, he should be put out of the synagogue" (aposunagogos); <a onClick="return mV(\'Jhn\',12,42);">Joh 12:42</a>: "did not confess... lest they should be put out of the s."; and <a onClick="return mV(\'Jhn\',16,2);">Joh 16:2</a>: "put you out of the synagogue." In <a onClick="return mV(\'Luk\',6,22);">Lu 6:22</a> Christ may refer to the three stages: "separate you from their company (aphorisosin), and reproach you (oneidisosin = cherem, "malediction"), and cast out your name as evil (ekbalosin)."<P>It is doubtful whether an express prescription of excommunication is found in our Lord\'s words (<a onClick="return mV(\'Mat\',18,\'15-19\');">Mt 18:15-19</a>). The offense and the penalty also seem purely personal: "And if he refuse to hear the church also, let him be unto thee as the Gentile and the publican," out of the pale of association and converse. Yet the next verse might imply that the church also is to act: "Verily I say unto you, What things soever ye shall bind on earth shall be bound in heaven," etc. But this latter, like <a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>, seems to refer to the general enunciations of principles and policies rather than to specific ecclesiastical enactments. On the whole, Jesus seems here to be laying down the principle of dignified personal avoidance of the obstinate offender, rather than prescribing ecclesiastical action. Still, personal avoidance may logically correspond in proper cases to excommunication by the church. <a onClick="return mV(\'2Th\',3,14);">2Th 3:14</a>: "Note that man, that ye have no company with him"; <a onClick="return mV(\'Tts\',3,10);">Tit 3:10</a>: "A factious man...avoid" (American Revised Version margin); <a onClick="return mV(\'2Jo\',1,10);">2Joh 1:10</a>: "Receive him not into your house," etc., all inculcate discreet and faithful avoidance but not necessarily excommunication, though that might come to be the logical result. Paul\'s "anathemas" are not to be understood as excommunications, since the first is for an offense no ecclesiastical tribunal could well investigate: <a onClick="return mV(\'1Cr\',16,22);">1Co 16:22</a>, "If any man loveth not the Lord, let him be anathema"; the second touches Paul\'s deep relationship to his Lord: <a onClick="return mV(\'Rom\',9,3);">Ro 9:3</a>, "I myself...anathema from Christ"; while the third would subject the apostle or an angel to ecclesiastical censure: <a onClick="return mV(\'Gal\',1,8,9);">Ga 1:8-9</a>, "Though we, or an angel...let him be anathema."<P>Clear, specific instances of excommunication or directions regarding it, however, are found in the Pauline and Johannine writings. In the case of the incestuous man (<a onClick="return mV(\'1Cr\',5,\'1-12\');">1Co 5:1-12</a>), at the instance of the apostle ("I verily, being absent in body but present in spirit"), the church, in a formal meeting ("In the name of our Lord Jesus, ye being gathered together"), carrying out the apostle\'s desire and will ("and my spirit"), and using the power and authority conferred by Christ ("and with the power of our Lord Jesus"), formally cut off the offender from its fellowship, consigning (relinquishing?) him to the power of the prince of this world ("to deliver such a one unto Satan"). Further, such action is enjoined in other cases: "Put away the wicked man from among yourselves." <a onClick="return mV(\'2Cr\',2,\'5-11\');">2Co 2:5-11</a> probably refers to the same case, terminated by the repentance and restoration of the offender. \'Delivering over to Satan\' must also include some physical ill, perhaps culminating in death; as with Simon Magus (<a onClick="return mV(\'Act\',8,20);">Ac 8:20</a>), Elymas (<a onClick="return mV(\'Act\',13,11);">Ac 13:11</a>), Ananias (<a onClick="return mV(\'Act\',5,5);">Ac 5:5</a>). <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>: "Hymenaeus and Alexander...that they might be taught not to blaspheme," is a similar case of excommunication accompanied by judicial and disciplinary physical ill. In <a onClick="return mV(\'3Jo\',1,9,10);">3Joh 1:9-10</a> we have a case of excommunication by a faction in control: "Diotrephes...neither doth he himself receive...and them that would he...casteth out of the church."<P>Excommunication in the New Testament church was not a fully developed system. The New Testament does not clearly define its causes, methods, scope or duration. It seems to have been incurred by heretical teaching (<a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>) or by factiousness (<a onClick="return mV(\'Tts\',3,10);">Tit 3:10</a> (?)); but the most of the clear undoubted cases in the New Testament are for immoral or un-Christian conduct (<a onClick="return mV(\'1Cr\',5,1,11,13);">1Co 5:1, 11, 13</a>; perhaps also <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>). It separated from church fellowship but not necessarily from the love and care of the church (<a onClick="return mV(\'2Th\',3,15);">2Th 3:15</a> (?)). It excluded from church privileges, and often, perhaps usually, perhaps always, from social intercourse (<a onClick="return mV(\'1Cr\',5,11);">1Co 5:11</a>). When pronounced by the apostle it might be accompanied by miraculous and punitive or disciplinary physical consequences (<a onClick="return mV(\'1Cr\',5,5);">1Co 5:5</a>; <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>). It was the act of the local church, either with (<a onClick="return mV(\'1Cr\',5,4);">1Co 5:4</a>) or without (<a onClick="return mV(\'1Cr\',5,13);">1Co 5:13</a>; <a onClick="return mV(\'3Jo\',1,10);">3Joh 1:10</a>) the concurrence of an apostle. It might possibly be pronounced by an apostle alone (<a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>), but perhaps not without the concurrence and as the mouthpiece of the church. Its purpose was the amendment of the offender: "That the spirit may be saved in the day of the Lord Jesus" (<a onClick="return mV(\'1Cr\',5,5);">1Co 5:5</a>); and the preservative purification of the church: "Purge out the old leaven, that ye may be a new lump, even as ye are unleavened" (<a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>). It might, as appears, be terminated by repentance and restoration (<a onClick="return mV(\'2Cr\',2,\'5-11\');">2Co 2:5-11</a>). It was not a complex and rigid ecclesiastical engine, held in terrorem over the soul, but the last resort of faithful love, over which hope and prayer still hovered.<P>LITERATURE.<P>Arts. in HDB, DB, Jew Eric, DCG; Martensen, Christian Ethics, III, 330ff; Nowack, Benzinger, Heb Archaeol.; Commentary in the place cited.``31';
isbe[3292]='Execute; Executioner`ek\'-se-kut, ek-se-ku\'-shun-er (\'asah, "to do," din,"to judge," "decide"; poieo, "to do"; spekoulator, Latin speculator, "an attendant"):<P>"Execute" in the sense of "executing judgment," "vengeance," etc., is often found in the Old Testament (<a onClick="return mV(\'Exd\',12,12);">Ex 12:12</a>; <a onClick="return mV(\'Deu\',10,18);">De 10:18</a>; <a onClick="return mV(\'Psa\',149,7);">Ps 149:7</a>; <a onClick="return mV(\'Jer\',22,3);">Jer 22:3</a>; <a onClick="return mV(\'Eze\',25,11);">Eze 25:11</a>; <a onClick="return mV(\'Mic\',5,15);">Mic 5:15</a>; compare <a onClick="return mV(\'Jer\',21,12);">Jer 21:12</a>, "Execute justice in the morning") and a few times in the New Testament (<a onClick="return mV(\'Jhn\',5,27);">Joh 5:27</a>; <a onClick="return mV(\'Rom\',13,4);">Ro 13:4</a> the King James Version; <a onClick="return mV(\'Jud\',1,15);">Jude 1:15</a>). In the sense of punishing capitally, by legal process, it is not found. "Executioner" is found only in <a onClick="return mV(\'Mar\',6,27);">Mr 6:27</a> the King James Version, where Herod, the king, is said to have "sent an executioner" (spekoulator) to behead John the Baptist, but the Revised Version (British and American) and the American Standard Revised Version have instead, according to the stricter meaning of the text, "The king sent forth a soldier of his guard." The office of executioner, however, was a recognized office in all the great nations of antiquity.``47';
isbe[3293]='Exegesis`ek-se-je\'-sis.`<a href="./study/isbe/search.html?string=INTERPRETATION">INTERPRETATION</a>`1';
isbe[3294]='Exercise`ek\'-ser-siz (\'asah; gumnazo, poieo):<P>"Exercise" (meaning originally, "to drive or thrust out") has different shades of meaning: It means<P>(1) "to do," "to put into action" (<a onClick="return mV(\'Jer\',9,24);">Jer 9:24</a>, \'asah, "to do," "Yahweh who exerciseth lovingkindness"; <a onClick="return mV(\'Rev\',13,12);">Re 13:12</a>, poieo, "to do," "He exerciseth all the authority of the first"; Tobit 12:9, the Revised Version (British and American) "do");<P>(2) with violence implied, gazal, "to take away violently," "have exercised robbery" (<a onClick="return mV(\'Eze\',22,29);">Eze 22:29</a>); "to act habitually" (<a onClick="return mV(\'Psa\',131,1);">Ps 131:1</a>, halakh, "to walk," "Neither do I exercise myself in great matters" the Revised Version, margin "walk"; <a onClick="return mV(\'Act\',24,16);">Ac 24:16</a>, askeo, "to work up"; compare 2Esdras 15:8; Ecclesiasticus 50:28);<P>(3) "to train" or "discipline," gumnazo, "to use exercise," "to train up" (<a onClick="return mV(\'1Ti\',4,7);">1Ti 4:7</a>, "Exercise thyself unto godliness"; <a onClick="return mV(\'Hbr\',5,14);">Heb 5:14</a>; <a onClick="return mV(\'Hbr\',12,11);">12:11</a>; <a onClick="return mV(\'2Pe\',2,14);">2Pe 2:14</a>; compare 1Macc 6:30; 2Macc 15:12);<P>(4) "to afflict" (<a onClick="return mV(\'Ecc\',1,13);">Ec 1:13</a>; <a onClick="return mV(\'Ecc\',3,10);">3:10</a>, \'anah, "to be afflicted," "exercised therewith," "exercised in it"); in <a onClick="return mV(\'Mat\',20,25);">Mt 20:25</a>; <a onClick="return mV(\'Mar\',10,42);">Mr 10:42</a>, katakurieuo, "to lord it over," and katexousiazo, "to exercise authority," are translated respectively "exercise dominion" and "exercise authority," the English Revised Version "lord it over" and "exercise authority"; in <a onClick="return mV(\'Luk\',22,25);">Lu 22:25</a>, the Greek words are kurieuo, "to be lord over" and exousiazo, "to have power or authority over," the Revised Version (British and American) "have lordship," "have authority." In <a onClick="return mV(\'1Ti\',4,8);">1Ti 4:8</a> the noun, gumnasia, meaning gymnastic exercise, occurs (somatike gumnasia), translated "bodily exercise," contrasted with "exercise unto godliness," the Revised Version (British and American) "For bodily exercise is profitable for a little (m "for little"); but godliness is profitable for all things," a saying to which the youth of all times would do well to give heed. In 2Macc 4:9, Jason is said to have set up "a place of exercise" (gumnasion) in Jerusalem. In <a onClick="return mV(\'1Pe\',5,2);">1Pe 5:2</a> the Revised Version (British and American), "exercising the oversight" is substituted for "taking the oversight."``185';
isbe[3295]='Exhortation`ek-sor-ta\'-shun (paraklesis):<P>The Greek word translated "exhortation" (paraklesis) signifies, originally, "a calling near or for" (as an advocate or helper who should appeal on one\'s behalf), and carries the twofold sense of "<a href="./study/isbe/search.html?string=EXHORTATION">exhortation</a>" and "<a href="./study/isbe/search.html?string=CONSOLATION">consolation</a>" (which see). In the Septuagint of the Old Testament it is used in the sense of "consolation"; but in 2Macc 7:24, it is translated "exhort," the Revised Version (British and American) "appeal." The verb parakaleo is also translated "exhortation" (1Macc 13:3 the King James Version) and "exhort" (2Macc 9:26). In the New Testament paraklesis is translated "exhortation" (<a onClick="return mV(\'Act\',13,15);">Ac 13:15</a>; <a onClick="return mV(\'Rom\',12,8);">Ro 12:8</a>, the Revised Version (British and American) "exhorting"; <a onClick="return mV(\'1Cr\',14,3);">1Co 14:3</a>, the English Revised Version "comfort," the American Revised Version, margin "or comfort"; <a onClick="return mV(\'2Cr\',8,17);">2Co 8:17</a>; <a onClick="return mV(\'1Th\',2,3);">1Th 2:3</a>; <a onClick="return mV(\'1Ti\',4,13);">1Ti 4:13</a>; <a onClick="return mV(\'Hbr\',12,5);">Heb 12:5</a>; <a onClick="return mV(\'Hbr\',13,22);">13:22</a>). the American Standard Revised Version has also "exhortation," instead of "consolation" in <a onClick="return mV(\'Phl\',2,1);">Php 2:1</a>. In <a onClick="return mV(\'Luk\',3,18);">Lu 3:18</a>, parakaleo, "to call near or for," is translated "exhortation," "and many other things in his exhortation," the Revised Version (British and American) "with many other exhortations," and in <a onClick="return mV(\'Act\',20,2);">Ac 20:2</a>, parakaleo logo pollo is rendered (the King James Version and the Revised Version (British and American)), "had given them much exhortation."``185';
isbe[3296]='Exile`ek\'-sil, eg\'-zil (galah, tsa\'ah):<P>Occurs twice only in the King James Version (<a onClick="return mV(\'2Sa\',15,19);">2Sa 15:19</a> (galah, "to remove"); <a onClick="return mV(\'Isa\',51,14);">Isa 51:14</a> (tsa\'ah, "to be bowed down")). In the Revised Version (British and American) "exile" is substituted for "captivity" (<a onClick="return mV(\'Ezr\',8,35);">Ezr 8:35</a> (shebhi), and <a onClick="return mV(\'Eze\',12,4);">Eze 12:4</a> (golah)); "go into exile," for "remove and go" (<a onClick="return mV(\'Eze\',12,11);">Eze 12:11</a>); "exiles of Ethiopia" for "Ethiopians captives" (<a onClick="return mV(\'Isa\',20,4);">Isa 20:4</a>); "He shall let my exiles go free" for "He shall let go my captives" (<a onClick="return mV(\'Isa\',45,13);">Isa 45:13</a>); "an exile" for "a captive" (<a onClick="return mV(\'Isa\',49,21);">Isa 49:21</a>). "The exile" is in the King James Version and the Revised Version (British and American) "the <a href="./study/isbe/search.html?string=CAPTIVITY">captivity</a>" (which see).``1';
isbe[3297]='Exodus, the`ek\'-so-dus:<P>Contents<P><b>I. THE ROUTE</b><P class="in15">1. The Starting-Point<p class="in15">2. Rameses to Succoth<p class="in15">3. Succoth to Etham<p class="in15">4. Passage of the Sea<p class="in15">5. Other Views of the Route<P><b>II. THE DATE</b><p class="in15">1. Old Testament Chronology<p class="in15">2. Date of Conquest of Palestine<p class="in15">3. Date of Exodus<p class="in15">4. Other Views<p class="in15">5. Astronomical Calculations<p class="in15">6. Relation between Date of Exodus and Date of Patriarchs<p class="in15">7. Agreement between Monuments and Old Testament Chronology<p class="in15">8. A Text of Minepthah<P><b>III. THE THEORY OF LEPSIUS</b><p class="in15">1. 1st Argument: City Rameses<p class="in15">2. 2nd Argument: Manetho\'s Statements<p class="in15">3. Relation of Manetho\'s Stories to the Exodus<p class="in15">4. Greek and Latin Writings<p class="in15">5. Condition of Egypt under Minepthah<p class="in15">6. Explanations of Minepthah\'s Statements<P class="in30">(1) Pithore was Heroopolis<P class="in30">(2) Rameses II not Named in Judges<P class="in30">(3) Some Hebrews Were never in Egypt<P><b>IV. THE NUMBERS</b><p class="in15">1. Colenso\'s Criticism of Large Number<p class="in15">2. Increase of Population<P class="in15">3. Number a Corruption of Original Statement<p class="in15">4. Review<hr /><P>I. The Route.<P>1. The Starting-Point:<P>On the 14th Abib (early in April) the Hebrews were gathered at Rameses (<a onClick="return mV(\'Num\',33,5);">Nu 33:5</a>) where apparently the hostile Pharaoh was also living (<a onClick="return mV(\'Exd\',12,31);">Ex 12:31</a>). From <a onClick="return mV(\'Psa\',78,12,43);">Ps 78:12, 43</a> it appears that the wonders preceding the Exodus occurred in the "field of Zoan," where the starting-point may be placed (see <a href="./study/isbe/search.html?string=RAAMSES">RAAMSES</a>; <a href="./study/isbe/search.html?string=ZOAN">ZOAN</A>). Dr. Naville has suggested that the court was at Bubastis, not at Zoan, and that the route lay from near Zagazig down Wady Tumeilat—a line well fitted for a people driving flocks and herds. On the other hand, in favor of the starting-point having been at Zoan, we read that the "way of the land of the Philistines" was "near" (<a onClick="return mV(\'Exd\',13,17);">Ex 13:17</a>). This route, which was not taken lest the people should be discouraged by defeat at Gaza where the Egyptians always had troops, reached Egypt at Migdol (see <a href="./study/isbe/search.html?string=MIGDOL">MIGDOL, 2</A>), and ran thence to Daphnai—some 15 miles—and to Zoan by a second march of the same length. The route from Bubastis to Daphnai (some 50 miles) is less likely to have been described as "near." Although an Arab will march 30 miles in a day on foot, yet when moving camp with camels, who travel only about 2 miles an hour, with women and children and herds, he only covers about 12 or 15 miles a day. We cannot suppose the Hebrew cattle to have covered more than this distance without water on any single march.<P>2. Rameses to Succoth:<P>We are not told how many days were occupied on the way from Rameses to <a href="./study/isbe/search.html?string=SUCCOTH+(2)">SUCCOTH (2)</a> (which see), though the general impression is that the stages mentioned (<a onClick="return mV(\'Num\',33,\'1-\');">Nu 33</a>) represent a day\'s journey each. Measuring back from the first camp after crossing the Red Sea, we find that Succoth probably lay in the lower part of Wady Tumeilat, where there was plenty of water and herbage. The direct route from Zoan leads to Phakousa (Tell Faqus) by a march of 15 miles through well-watered lands. A second march, across the desert to Heroopolis and down the valley to Succoth, would be of the same length. The Hebrews departed "in haste," and no doubt made as long marches as they could. If the whole of the people were not in Rameses, but scattered over Goshen, it is possible that some came down the valley from near Bubastis, and that the whole force concentrated at Succoth.<P>3. Succoth to Etham:<P>The next march (<a onClick="return mV(\'Exd\',13,20);">Ex 13:20</a>; <a onClick="return mV(\'Num\',33,6);">Nu 33:6</a>) led Israel to Etham, on the "edge of the wilderness" which lies west of the Bitter Lakes, not far from where the Nile water then entered them, and no doubt made them sweet. The intention of Moses probably was to reach the desert of Shur by rounding the head of this stretch of water; but we are told (<a onClick="return mV(\'Exd\',14,2);">Ex 14:2</a>f) that he was commanded to "turn"—evidently to the south—and to encamp before "the mouth of the lakes" (see <a href="./study/isbe/search.html?string=PI-HAHIROTH">PI-HAHIROTH</a>), in order that Pharaoh might conclude that the Hebrews were "entangled in the land," and shut in between the lakes on their left and the desert mountains on their right. This camp would seem to have been west of the lakes, and some 10 miles north of Suez. It was perhaps two days\' journey from Etham, since the lakes are 30 miles long; or, if Etham was farther south than the head of the lakes, the distance may have been covered by one forced march of 20 to 25 miles, the beasts being watered from the lakes if they were then filled with fresh water, as they would be when having an outlet to a tideless sea.<P>4. Passage of the Sea:<P>The sea which Israel crossed is not named in the actual account of the journey, but in the Song of Moses (<a onClick="return mV(\'Exd\',15,4);">Ex 15:4</a>) it is called the "Red Sea" in the English Versions of the Bible, following the Septuagint, the Hebrew name being Yam Cuph, or "weedy sea," a term which applied not only to the Gulf of Suez (<a onClick="return mV(\'Num\',33,10);">Nu 33:10</a>), but also to the Gulf of \'Aqabah (<a onClick="return mV(\'Deu\',28,\'1-\');">De 28</a>; <a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>). We are also told that the route chosen was "the way of the wilderness by the Red Sea" (<a onClick="return mV(\'Exd\',13,18);">Ex 13:18</a>). It is generally supposed that the head of the Gulf of Suez at the time of the Exodus was farther north than at present; and, as the Bitter Lakes were then probably filled by the Nile waters flowing down Wddy Tumeildt, they would no doubt have carried the Nile mud into this gulf, which mud had gradually filled up this Nile branch before 600 BC. The probable point of passage was the narrow channel (about 2 miles across) by which the lakes discharged into the sea, and was thus about 10 miles north of Suez. We are told that the water was driven back by "a strong east (or "contrary") wind" in the night (<a onClick="return mV(\'Exd\',14,21);">Ex 14:21</a>), and the sea (or "lake," as the word yam often means in the Old Testament; see Gesenius, Lexicon, under the word) was thus "divided," a shoal being formed and the waters being heaped up (<a onClick="return mV(\'Exd\',15,8);">Ex 15:8</a>), so that when the wind ceased they rushed back; whereas, during the passage, they were a "wall" or "defence" (<a onClick="return mV(\'Exd\',14,22);">Ex 14:22</a>) against any flank attacks by the Egyptians (compare <a onClick="return mV(\'1Sa\',25,16);">1Sa 25:16</a>, where David\'s men are said to have been a "wall" when defending Nabal\'s shepherds). The effect of the wind on shallow waters can be seen at the mouth of the Kishon, where a shoal exists which is dry with a west wind, but under water and impassable when the wind blows down the river. In 1882, Sir Alexander Tulloch saw the waters of Lake Menzaleh driven back more than a mile by the east wind. Thus, however opportune the occurrence, the drying up of the sea, as described in the Bible, was a perfectly natural phenomenon. The Hebrews crossed in the morning, and a march of 15 miles would bring them to the springs from which Suez is supplied, called \'Ain Naba\' and \'Ayyun Musa ("the gushing spring" and "the spring of Moses"), from which point their wanderings in the desert of Shur would begin (see <a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>).<P>5. Other Views of the Route:<P>This view of the Exodus route is practically the same as advocated by Dr. Robinson, by Dr. E. Naville, by Sir S. Warren, by Sir W. Dawson, and by others who have visited the region in question. The view advocated by Brugsch, according to which the sea crossed was a lagoon near Pelusium, has found no supporters, because it directly conflicts with the statement that Israel did not follow the shore road to Philistia, but went by the wilderness of the Red Sea. Another theory (see <a href="./study/isbe/search.html?string=SINAI">SINAI</a>), according to which the "Red Sea" always means the Gulf of \'Aqabah, is equally discarded by most writers of experience, because the distance from Egypt to Elath on this gulf is 200 miles, and the Israelites could not have traversed that distance in four marches, especially as the route has hardly any water along it in springtime. As detailed above, the route offers no difficulties that would discredit the historical character of the narrative.<P>II. The Date.<P>1. Old Testament Chronology:<P>The actual statements of the Books of Kings, giving parallel reigns from the time of Solomon\'s death down to the fixed date of the fall of Samaria in 722 BC, place the foundation of the Temple within a few years of 1000 BC. It is true that this interval is reduced, by about 30 years, by scholars who accept the very doubtful identification of Ahabu of Sir-lai with Ahab of Israel; but this theory conflicts with the fact that Jehu was contemporary with Shalmaneser II of Assyria; and, since we have no historical account of the chronology of Hebrew kings other than that of the Old Testament, for this period, and no monumental notice of Israel in Egypt, or of the Exodus, we must either adopt Old Testament chronology or regard the dates in question as being unknown.<P>2. Date of Conquest of Palestine:<P>We have several statements which show that the Hebrew writers believed the conquest of Palestine by Joshua to have occurred early in the 15th century BC, and this date fully agrees with the most recent results of monumental study of the history of the XVIIIth (or Theban) Dynasty in Egypt, as about to be shown, and with the fact that Israel is noticed as being already in Palestine in the 5th year of Minepthah, the successor of Rameses II. In <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a> we read that the Temple was founded "in the 480th year after the children of Israel were come out of the land of Egypt," this referring to the Conquest and not to the Exodus, as appears from other notices. The Septuagint reads "440 years," but the details show that the Hebrew text is preferable. In <a onClick="return mV(\'Jdg\',11,26);">Jud 11:26</a> the first victory of Jephthah is said to have occurred 300 years after Joshua\'s conquest. The details given for this interval, in other passages of the same book, amount to 326 years; but the periods of "rest" may be given in round numbers, and thus account for this minor discrepancy. Samuel ruled apparently for 20 years (<a onClick="return mV(\'1Sa\',7,2);">1Sa 7:2</a>), and Saul (the length of whose reign is not stated in our present text of this same book) very probably ruled for 20 years also, as Josephus (Ant., VI, xiv, 9) states. Thus 175 years elapsed between Jephthah\'s victory and the foundation of the Temple—a total of 475 years, or rather more, from Joshua\'s conquest.<P>3. Date of Exodus:<P>The popular belief that many of the judges were contemporary does not agree with these facts, and is indeed in conflict with ten definite statements in Jgs. In <a onClick="return mV(\'Act\',13,19,20);">Ac 13:19-20</a> we read that after the Conquest there were judges about the space of 450 years, and this rough estimate (including the rule of Samuel) agrees pretty nearly with the 415, or 420, years of the various passages in the Old Testament. According to the Pentateuch and later accounts (<a onClick="return mV(\'Amo\',5,25);">Am 5:25</a>; <a onClick="return mV(\'Act\',7,30);">Ac 7:30</a>), Israel abode in the desert 40 years. We therefore find that Joshua\'s conquest is placed about 1480 BC, and the Exodus about 1520 BC. According to the revised chronology of the XVIIIth Dynasty of Egypt (see <a href="./study/isbe/search.html?string=HITTITES">HITTITES</a>), which rests on the notices of contemporary Kassite kings in Babylon, it thus appears that the Pharaoh of the oppression was Thothmes III—a great enemy of the Asiatics—and the Pharaoh of the Exodus would be Amenophis II or Thothmes IV. If Moses was 80 at the time of the Exodus, he must have been born when Thothmes III was an infant, and when his famous sister Hatasu (according to the more probable rendering of her name by French scholars) was regent, and bore the title Ma-ka-Ra. She therefore might be the "daughter of Pharaoh" (<a onClick="return mV(\'Exd\',2,5);">Ex 2:5</a>) who adopted Moses—no king being mentioned in this passage, but appearing (<a onClick="return mV(\'Exd\',2,15);">Ex 2:15</a>) only when Moses was "grown"; for her regency lasted more than 20 years, till Thothmes III came of age.<P>4. Other Views:<P>As regards this date, it should be remarked that theory of Lepsius, which has been adopted by Brugsch and by many writers who accept his authority, is not accepted by every scholar. E. de Bunsen supposed that the Exodus occurred early in the times of the XVIIIth Dynasty; Sir Peter le Page Renouf said that "no materials have yet been discovered for fixing historical dates in periods of Egyptian history as far back as the Hebrew Exodus"—which was true when he wrote. Professor J. Lieblein supposes the Exodus to have occurred late in the time of Amenophis III—also of the XVIIIth Dynasty (see Proc. Biblical Arch. Soc.,1890,157-60; 1892, 60-62; 1898, 277; 1899, 53; 1907, 214). Dr. Hommel has also recently declared in favor of the view that the Exodus took place under the XVIIIth Dynasty (Expository Times, February, 1899). Lepsius asserted that the Exodus occurred in 1314 BC, being the 15th year of Minepthah; but this is generally regarded as at least half a century too early for the year in question, and Israel was not in Egypt even ten years earlier in his reign.<P>5. Astronomical Calculations:<P>The approximate dates given by Brugsch for the XVIIIth and XIXth Dynasties are very close to those which can be deduced from notices of contemporary kings of Babylon (History of Egypt, II, 314). The later dates which Mahler based on certain astronomical calculations of the French astronomer Blot (Academie des inscriptions, March 30,1831,597, 602-4) are not accepted by other Egyptologists. Brugsch says that on this question, "scientific criticism has not yet spoken its last word" (Hist Egypt, I, 36). Renouf (Proc. Biblical Arch. Soc., December,1892,62) more definitely states that "unfortunately there is nothing on Egyptian documents which have as yet come down to us which can, by astronomical calculations, be made to result in a date." This judgment appears to be justified by recent discoveries, since Mahler\'s dates are about a century too late, as shown by the known history of the Kassites of Babylon. Biot\'s calculations were based on recorded observations of the rising of Sirius just before the sun, in certain years of certain Egyptian kings. But Sirius is not in the plane of the earth\'s orbit, and its rising is not constant in retardation. The "heliacal" rising is now about 2 1/2 min. later each year, but about the date in question the retardation was about 12 min., so that a cycle of 1,461 years cannot be used by simple addition. Blot also assumed that the Egyptian observations were as accurate as those made by a modern astronomer with a telescope, whereas, when using the naked eye, the Egyptian observer may well have been a day wrong, which would make a difference of 120 years in the date, or even more. The Babylonian chronology thus gives a far safer basis than do these doubtful observations. On the basis of Biot\'s calculations the Exodus has been placed in 1214 BC, or even (by Dr. Flinders Petrie) in 1192 BC (Proc. Biblical Arch. Soc., December,1896,248). He thus cuts off more than three centuries in the period of the Judges, many of whom he regards as contemporary. Lepsius in like manner, in order to establish his date, accepted the chronology of the Talmud, which is notoriously 166 years too late for the known date of the fall of Samaria, and he endeavored (while rejecting the Old Testament statement as to the 480 years) to base himself on the number of generations before the Exodus, whereas it is well known that the Hebrew genealogies often give only the better-known names and skip several links.<P>6. Relation between Date of Exodus and Date of Patriarchs:<P>As regards the relation between the earlier date for the Exodus (about 1520 BC) and the chronology of the Hebrew patriarchs, the Hebrew text gives an interval of 645 years, and the Greek text of 430 years between the Exodus and the call of Abraham; and the call would thus be dated about 2165 BC or 1950 BC. Abraham is very generally held to have been contemporary with Hammurabi of Babylon (Amraphel), whose accession dates (according to Dr. F. Peiser) in 2139 BC. Dr. Hommel and Mr. King prefer a later date, about 1950 BC, though Nabunahid (the last king of Babylon) places Hammurabi about 2140 BC. The longer reckoning is reconcilable with the Hebrew text, and the shorter with the Greek text, of Genesis, without disturbing the approximate date for the Exodus which has been advocated above.<P>7. Agreement between Monuments and Old Testament Chronology:<P>There is in fact no discrepancy between the actual results of monumental study and the chronology of the Old Testament. If the Exodus occurred under Thothmes IV, it would have been useless for Israel to attempt the entrance into Palestine by the "way of the land of the Philistines," because at Gaza, Ashkelon and in other cities, the road was still held by forces of Egyptian chariots, which had been established by Thothmes III. But about 40 years later the rebellion of the Amorites against Egypt began, in the time of the Egyptian general Yankhamu, and general chaos resulted in Southern Palestine. The Egyptian garrison at Jerusalem (Amarna Tablets, Berlin, No. 102) was withdrawn in his time—about 1480 BC—and it is then (nos. 102-3-4-6, 199) that a fierce people coming from Seir, and called the \'Abiri or Chabiri, are noticed by the Amorite king of Jerusalem as "destroying all the rulers" of the country. They are not named in any of the other Amarna letters (the term gum-gaz, or "man of war," though once applying probably to them, being used of other warriors as well); and the name is geographical for they are called (no. 199) "people of the land of the \'Abiri." The first sign has the guttural sounds \'A and Chronicles, and has not the sound K, which has been wrongly attributed to it, making the word to mean Kabiri, "or great ones." Nor can it be rendered "allies," for it is the name of a people, and quite another word is used for "allies" in this correspondence. The date agrees with that mentioned in the Old Testament for the Hebrew conquest of Palestine, and the only objection to the identification of the \'Abiri (who attacked Ajalon, Lachish, Ashkelon and other cities) with the Hebrews is, that it upsets theory of Lepsius and the popular views as to the date of the Exodus which he maintained.<P>8. A Text of Minepthah:<P>Nor is this the only evidence which destroys his theory; for Dr. Flinders Petrie (Contemporary Review, May, 1896) has published an equally important text of the 5th year of Minepthah, from Thebes. A slab of black syenite, bearing this text, was reused from a temple of Amenophis III. In it Minepthah boasts of his conquest of the invaders who—as elsewhere stated—attacked the Delta, and penetrated to Belbeis and Heliopolis. He says that "Sutekh (the Hittite god) has turned his back on their chief"; "the Hittites are quieted, Pa-Kan\'ana is ravaged with all violence"—this town being otherwise known to have been near Tyre—"the people of Israel is spoiled, it has no seed"; "Ruten has become as the widows of the land of Egypt." Thus, so far from the Exodus having occurred in the 15th year of Minepthah, Israel is noticed 10 years earlier in connection with a place near Tyre with Hittites yet farther North. Even if the Hebrews had only just arrived, they must have left Egypt 40 years before—in the reign of Rameses II—if we attach any value to Old Testament statements; and all the dates variously given by followers of Lepsius are quite upset; whereas the notice of the \'Abiri, two centuries before Minepthah\'s accession, is quite in accord with this allusion to Israel, as well as with Old Testament chronology.<P>III. The Theory of Lepsius.<P>The reasons which influenced Lepsius require, however, to be stated, and the objections to a date for the Hebrew Conquest about 1480 BC (or a little later) to be considered, since theory that Rameses II was the Pharaoh of the oppression, and Minepthah the Pharaoh of the Exodus is often said to be a secure result of monumental studies, whereas it is really not so, because the only monumental allusions to Israel and the Hebrews are those just mentioned.<P>1. 1st Argument: City Rameses:<P>The arguments adduced in favor of the later date are as follows: In the first place, Lepsius (Letters from Egypt, 1842-44) held that no city called Rameses could have been so named, or built by the Hebrews, before the reign of Rameses II, and he placed the site at Heroopolis. This was a very doubtful assumption (see <a href="./study/isbe/search.html?string=RAAMSES">RAAMSES</A>), and his identification of the city is now abandoned. The theory always was vitiated by an objection which he seems to have overlooked: for the "land of Rameses" is notice
