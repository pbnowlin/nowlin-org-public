ial benefits to the spiritual blessings which they enshrine. If even in the messages of the prophets there is not wanting some measure of threats and penalties, we must remember the character of the people they were dealing with—a people wayward and stubborn, whose imaginations could scarcely rise above the material and the temporal. We must judge prophecy by its best, and we shall see that these penalties and rewards which undoubtedly occupy a prominent place in Old Testament ethics were but goads to spur the apathetic. They were not ends in themselves, nor mere arbitrary promises or threats, but instruments subservient to higher ideals.<P>(b) As to extent:<P>With regard to the extent or application of the Hebrew ideal it must be acknowledged that here also Old Testament ethics is imperfect as compared with the universality of Christianity. God is represented as the God of Israel and not as the God of all men. It is true that a prominent commandment given to Israel is that which our Lord endorsed: "Thou shalt love thy neighbor as thyself" (<a onClick="return mV(\'Lev\',19,18);">Le 19:18</a>). The extent of the obligation, however, would seem to be restricted in the language immediately preceding it: "Thou shalt not take vengeance, nor bear any grudge against the children of thy people." It has been pointed out that the term rea\' is of wider signification than the English word "neighbor," and expresses the idea of friend, and is applied to any person. The wider rendering is enforced by the fact that in <a onClick="return mV(\'Lev\',19,33,34);">Le 19:33-34</a> the word "stranger" or "foreigner" is substituted for neighbor. The stranger is thus regarded as the special client of God and is commended to look to Him for protection. However this may be, in practice at least the Jews were not faithful to the humanitarianism of their law, and generally, in keeping with other races of antiquity, showed a tendency to restrict Divine favor within the limits of their own land and to maintain an attitude throughout their history of aloofness and repellent isolation toward foreigners. At the same time the obligation of hospitality was regarded as sacred and was practiced in early Hebrew life (<a onClick="return mV(\'Gen\',18,\'1-9\');">Ge 18:1-9</a>). Nor must we forget that whatever may have been the Jewish custom the promise enshrined in their revelation implies the unity of mankind (<a onClick="return mV(\'Gen\',19,3);">Ge 19:3</a>), while several of the prophecies and Psalms look forward to a world-wide blessing (<a onClick="return mV(\'Isa\',61,\'1-\');">Isa 61</a>; <a onClick="return mV(\'Psa\',22,27);">Ps 22:27</a>; <a onClick="return mV(\'Psa\',48,2,10);">48:2, 10</a>). In <a onClick="return mV(\'Isa\',54,\'1-\');">Isa 54</a> we even read, "God of the whole earth shall he be called." "Everything," it has been said, "is definitely stated except the equality of all men in God\'s love." The morality of bare justice is also in some measure transcended. The universal Fatherhood of God, if not clearly stated, is implied in many passages, and in Second Isaiah and Hosea there are most tender revelations of Divine mercy though it is mercy to Israel only. But we know that the apostle Paul drew the inference from God\'s treatment of Israel that His mercy and salvation would extend to all.<P>2. Outline of New Testament Ethics:<P>We are now prepared to indicate briefly the distinctive features of the ethics of Christianity. As this article is, however, professedly introductory, and as the ethics of Jesus forms the subject of a separate treatment (see <a href="./study/isbe/search.html?string=ETHICS+OF+JESUS">ETHICS OF JESUS</A>), it will not be necessary to offer an elaborate statement of the subject. It will be sufficient to suggest the formative principles and main characteristics. What we have to say may conveniently be divided under three heads:<P class="in15">(1) the Christian ideal;<P class="in15">(2) the dynamic power;<P class="in15">(3) the virtues, duties and spheres of Christian activity.<P>(1) Ethics of Jesus and Paul.<P>Before, however, entering upon these details, a few words may fittingly be said upon the relation of the ethics of Jesus to those of Paul. It has been recently alleged that a marked contrast is perceptible between the teaching of Jesus and that of Paul, and that there is a great gulf fixed between the Gospels and the Epistles. Jesus is a moralist, Paul a theologian. The Master is concerned with the conditions of life and conduct; the disciple is occupied with the elaboration of dogma. This view seems to us to be greatly exaggerated. No one can read the Epistles without perceiving the ethical character of a large portion of their teaching and noticing how even the great theological principles which Paul enunciates have a profound moral import. Nor does it seem to us that there is any radical difference in the ethical teaching of Christ and that of the Apostle.<P>(2) Character.<P>Both lay emphasis on character, and the great words of Christ are the great words of Paul. The inmost spring of the new life of love is the same for both. The great object of the Pauline dialectic is to place man emptied of self in a condition of receptiveness before God. But this idea, fundamental in Paul, is fundamental also in the teaching of Jesus. It is the very first law of the kingdom. With it the Sermon on the Mount begins: "Blessed are the poor in spirit." If we analyze this great saying it surely yields the whole principle of the Pauline argument and the living heart of the Pauline religion. In perfect agreement with this is the fundamental importance assigned both by Jesus and Paul to faith. With both it is something more than mental assent or even implicit confidence in providence. It is the spiritual vision in man of the ideal, the inspiration of life, the principle of conduct.<P>(3) Inwardness of Motive.<P>Again the distinctive note of Christ\'s ethic is the inwardness of the moral law as distinguished from the externality of the cereMonial law. Almost in identical terms Paul insists upon the need of inward purity, the purity of the inner man of the heart. Once more both lay emphasis upon the fulfillment of our duties to our fellow-men, and both are at one in declaring that man owes to others an even greater debt than duty. Christ\'s principle is, "Thou shalt love thy neighbor as thyself"; Paul\'s injunction is "Owe no man anything but to love one another." Christ transforms morality from a routine into a life; and with Paul also goodness ceases to be a thing of outward rule and becomes the spontaneous energy of the soul. For both all virtues are but the various expressions of a single vital principle. "Love is the fulfilling of the law." The dynamic of devotion according to Christ is, "God\'s love toward us"; according to Paul, "The love of Christ constraineth us."<P>Ideal of Life:<P>And if we turn from the motive and spring of service to the purpose of life, again we find substantial agreement: "Be ye perfect as your Father in heaven is perfect" is the standard of Christ; to attain to the perfect life—"the prize of the high calling of God in Christ"—is the aim of Paul.<P>(4) Ultimate End.<P>Nor do they differ in their conception of the ultimate good of the world. Christ\'s ethical ideal, which He worked for as the realization of the object of His mission, was a redeemed humanity, a reestablishment of human society, which He designated "the kingdom of God." Paul with his splendid conception of humanity sees that kingdom typified and realized in the Risen Life of his Lord. It is by growing up in all things unto Him who is the Head that the whole body will be perfected in the perfection of its members. And this is what Paul means when he sums up the goal and ideal of all human faith and endeavor—"till we all attain...unto a fullgrown man, unto...the fullness of Christ" (<a onClick="return mV(\'Eph\',4,13);">Eph 4:13</a>). Paul everywhere acknowledges himself to be a pupil of the Master and a teacher of His ways (<a onClick="return mV(\'1Cr\',4,17);">1Co 4:17</a>). Without pursuing this subject there can be no doubt that in their hidden depths and in their practical life the precepts of the apostle are in essential agreement with those of the Sermon on the Mount, and have a dommon purpose—the presenting of every man perfect before God (compare Alexander, Ethics of Paul).<P>3. The Ethical Ideal:<P>The ethical ideal of the New Testament is thus indicated. The chief business of ethics is to answer the question, What is man\'s supreme good? For what should a man live? What, in short, is the ideal of life? A careful study of the New Testament discloses three main statements implied in what Christ designates "the kingdom of God": man\'s highest good consists generally in doing God\'s will and more particularly in the attainment of likeness to Christ and in the realization of human brotherhood—a relation to God, to Christ and to man. The first is the pure white light of the ideal; the second is the ideal realized in the one perfect life which is viewed as standard or norm; the third is the progressive realization of the ideal in the life of humanity which is the sphere of the new life.<P>(1) Holiness.<P>Holiness as the fulfillment of the Divine will is, as we have seen, Christ\'s own ideal—Be ye perfect as your Father; and it is Paul\'s—This also we wish, even your perfection (<a onClick="return mV(\'2Cr\',13,11);">2Co 13:11</a>). The ideas of righteousness and holiness as the attributes of God are the features of the kingdom of God or of heaven, the realization of which Jesus continually set forth as the highest aim of man; and running through all the epistles of Paul the constant refrain is that ye might walk worthy of God who hath called you unto His kingdom and glory. To walk worthy of God, to fulfill His will in all sincerity and purity, is for the Christian as for the Jew the end of all morality. Life has a supreme worth and sacredness because God is its end. To be a man is to fulfill in his own person God\'s idea of humanity. Before every man, just because he is man with the touch of the Divine hand upon him and his Maker\'s end to serve, lies this ultimate goal of existence—the realization of the perfect life-according to the idea of God.<P>(2) Christlikeness.<P>If Godlikeness or holiness is the end, Christlikeness is the norm or standard in which that end is presented in the Gospel. In Christianity God is revealed to us through Jesus Christ, and the abstract impersonal ideas of holiness and righteousness are transmuted into the features of a living personality whose spirit is to be reproduced in the lives of men. In two different ways Christ is presented in the New Testament as ideal. He is at once the Pattern and the Principle or Power of the new life.<P>(a) He is the Pattern of goodness which is to be reproduced in human lives. It would lead us to trench on the succeeding article if we were to attempt here a portrayal of the character of Jesus as it is revealed in the Gospels. We only note that it is characteristic of the New Testament writers that they do not content themselves with imaginative descriptions of goodness, but present a living ideal in the historical person of Jesus Christ.<P>(b) He is also Principle of the new life—not example only, but power—the inspiration and cause of life to all who believe (<a onClick="return mV(\'Eph\',1,19,20);">Eph 1:19-20</a>). Paul says not, "Be like Christ," but "Have the mind in you which was also in Christ." The literal imitation of an example has but a limited reign. To be a Christian is not the mechanical work of a copyist. Kant goes the length of saying that "imitation finds no place in all morality" (Metaphysics of Ethics, section ii). Certainly the imitation of Christ as a test of conduct covers a quite inadequate conception of the intimate and vital relation Christ bears to humanity. "It is not to copy after Him," says Schultz (Grundriss d. evangelischen Ethik, 5), "but to let His life take form in us, to receive His spirit and make it effective, which is the moral task of the Christian." It is as its motive and creative power that Paul presents Him. "Let Christ be born in you." We could not even imitate Christ if He were not already within us. He is our example only because He is something more, the principle of the new life, the higher and diviner self of every man. "He is our life"; "Christ in us the hope of glory."<P>(3) Brotherhood and Unity of Man.<P>The emphasis hitherto has been laid on the perfection of the individual. But both Christ and His apostles imply that the individual is not to be perfected alone. No man finds himself till he finds his duties. The single soul is completed only in the brotherhood of the race. The social element is implied in Christ\'s idea of the Kingdom, and many of the apostolic precepts refer not to individuals but to humanity as an organic whole. The church is Christ\'s body of which individuals are the members, necessary to one another and deriving their life from the head. The gospel is social as well as individual, and the goal is the kingdom of God, the brotherhood of man. Paul proclaims the unity and equality before God of Greek and Roman, bond and free.<P>4. The Dynamic Power of the New Life:<P>In the dynamic power of the new life we reach the central and distinguishing feature of Christian ethics. Imposing as was the ethic of Greece, it simply hangs in the air. Plato\'s ideal state remains a theory only. Aristotle\'s "virtuous man" exists only in the mind of his creator. Nor was the Stoic more successful in making his philosophy a thing of actuality. Beautiful as these old-time ideals were, they lacked impelling force, the power to change dreams into realities. The problems which baffled Greek philosophy it is the glory of Christianity to have solved. Christian ethics is not a theory. The good has been manifested in a life. The Word was made flesh. It was a new creative force—a spirit given and received, to be worked out and realized in the actual life of common men.<P>(1) The Dynamic on Its Divine Side. The problem with Paul was, How can man achieve that good which has been embodied in the life and example of Jesus Christ? Without entering into the details of this question it may be said at once that the originality of the gospel lies in this, that it not only reveals the good but discloses the power which makes the good possible in the hitherto unattempted derivation of the new life from a new birth under the influence of the Spirit of God. Following his Master, when Paul speaks of the new ethical state of believers he represents it as a renewal or rebirth of the Holy Spirit. It is an act of Divine creative power.<P>Without following out the Pauline argument we may say he connects the working of the Holy Spirit with two facts in the life of Christ, for him the most important in history—the death and resurrection of our Lord. Here we are in the region of dogmatics, and it does not concern us to present a theory of the atonement. All we have to do with is the fact that between man and the new life lies sin, which must be overcome and removed, both in the form of guilt and power, before reconciliation with God can be effected. The deed which alone meets the case is the sacrifice of Christ. In virtue of what Christ has achieved by His death a fundamentally new relationship exists. God and man are now in full moral accord and vital union.<P>But not less important as a factor in creating the new life is the resurrection. It is the seal and crown of the sacrifice. It was the certainty that He had risen that gave to Christ\'s death its sacrificial value. "If Christ be not risen ye are yet in your sins." The new creature is the work of Christ. But His creative power is not an external influence. It is an inner spirit of life. All that makes life life indeed—an exalted, harmonious and completed existence—is derived from the Holy Spirit through the working of the crucified risen Christ.<P>(2) The Dynamic on Its Human Side.<P>Possession of power implies obligation to use it. The force is given; it has to be appropriated. The spirit of Christ is not offered to free a man from the duties and endeavors of the moral life. Man is not simply the passive recipient of the Divine energy. He has to make it his own and work it out by an act of free resolution. When we inquire what constitutes the subjective or human element, we find in the New Testament two actions which belong to the soul entering upon the new world in Christ—repentance and faith. These are complementary and constitute what is commonly called conversion. Repentance in the New Testament is a turning away in sorrow and contrition from a life of sin and a breaking with evil under the influence of Christ. If repentance looks back and forsakes, faith looks forward and accepts. In general it is the outgoing of the whole man toward his Lord, the human power or energy by which the individual receives and makes his own the life in Christ. It is not merely intellectual acceptance or moral trust; it is above all appropriating energy. It is the power of a new obedience. As the principle of moral appropriation it has its root in personal trust and its fruit in Christian service. Faith, in short, is the characteristic attitude and action of the whole Christian personality in its relation to the spiritual good offered to it in Christ.<P>5. Virtues, Duties and Spheres of the New Life:<P>It but remains to indicate how this new power manifests itself in character and in practical conduct. Character is expressed in virtue, and duty is conditioned by station and relationships.<P>(1) The Virtues.<P>The systematic enumeration of the virtues is one of the most difficult tasks of ethics. Neither in ancient nor in modern times has complete success attended attempts at classification. Plato\'s list is too meager. Aristotle\'s lacks system and is marred by omission. Nowhere in Scripture is there offered a complete description of all the virtues that flow from faith. But by bringing Christ\'s words and the apostolic precepts together we have a rich and suggestive cluster (<a onClick="return mV(\'Mat\',5,\'1-\');">Mt 5</a>; <a onClick="return mV(\'Mat\',6,\'1-\');">6</a>; <a onClick="return mV(\'Gal\',5,22,23);">Ga 5:22-23</a>; <a onClick="return mV(\'Col\',3,12,13);">Col 3:12-13</a>; <a onClick="return mV(\'Phl\',4,8);">Php 4:8</a>; <a onClick="return mV(\'1Pe\',2,18,19);">1Pe 2:18-19</a>; <a onClick="return mV(\'1Pe\',4,7,8);">4:7-8</a>; <a onClick="return mV(\'2Pe\',1,\'5-8\');">2Pe 1:5-8</a>; <a onClick="return mV(\'1Jo\',3,\'1-\');">1Joh 3</a>). We may make a threefold classification:<P>(a) The Heroic Virtues:<P>The heroic virtues, sometimes called the cardinal, handed down from antiquity-wisdom, fortitude, temperance, justice. While these were accepted and dwelt upon, Christianity profoundly modified their character so that they became largely new creations. "The old moral currency was still kept in circulation, but it was gradually minted anew" (Strong).<P>(b) The Amiable Virtues:<P>The amiable virtues, which are not merely added on to the pagan, but being incorporated with them, give an entirely new meaning to those already in vogue. While Plato lays stress on the intellectual or heroic features of character, Christianity brings to the foreground the gentler virtues. Two reasons may have induced the Christian writers to dwell more on the self-effacing side of character: partly as a protest against the spirit of militarism and the worship of material power prevalent in the ancient world; and chiefly because the gentler self-sacrificing virtues more truly expressed the spirit of Christ. The one element in character which makes it beautiful and effective and Christlike is love—the element of sacrifice. Love evinces itself in humility which lays low all vaunting ambition and proud selfsufficiency. Closely allied to humility are meekhess and its sister, long-suffering—the attitude of the Christian in the presence of trial and wrong. With these again are connected contentment and patience and forbearance, gentle and kindly consideration for others. Lastly there is the virtue of forgiveness. For it is not enough to be humble and meek; we have a duty toward wrongdoers. We must be ready to forget and forgive (<a onClick="return mV(\'Rom\',12,20);">Ro 12:20</a>). "Be ye kind one to another, tenderhearted, forgiving each other, even as God also in Christ forgave you" (<a onClick="return mV(\'Eph\',4,32);">Eph 4:32</a>).<P>(c) The Theological Virtues:<P>The theological virtues or Christian graces-faith, hope, charity. Some have been content to see in these three graces the summary of Christian excellence. They are fundamental in Christ\'s teaching and the apostolic combination of them may have had its basis in some lost word of the Master (Harnack). These graces cannot be separated. They are all of a piece. He who has faith has also love, and he who has faith and love cannot be devoid of hope. Love is the first and last word of apostolic Christianity. No term is more expressive of the spirit of Christ. Love was practically unknown in the ancient world. Pre-Christian philosophy exalted the intellect but left the heart cold. Love in the highest sense is the discovery and creation of the gospel, and it was reserved for the followers of Jesus to teach men the meaning of charity and to find in it the law of freedom. It is indispensable to true Christian character. Without it no profession of faith or practice of good deeds has any value (<a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>). It is the fruitful source of all else that is beautiful in conduct. Faith itself works through love and finds in its activity its outlet and exercise. If character is formed by faith it lives in love. And the same may be said of hope. It is a particular form of faith which looks forward to a life that is to be perfectly developed and completed in the future. Hope is faith turned to the future—a vision inspired and sustained by love.<P>(2) The Duties.<P>Of the duties of the Christian life it is enough to say that they find their activity in the threefold relationship of the Christian to self, to his fellow-men and to God. This distinction is not of course quite logical. The one involves the other. Self-love implies love of others, and all duty may be regarded as duty to God. The individual and society are so inextricably bound together in the kingdom of love that neither can reach its goal without the other.<P>(a) Duties Toward Self:<P>Duties toward self are, however, plainly recognized in the New Testament. our Lord\'s commandment, "Thou shalt love thy neighbor as thyself," makes a rightly conceived self-love the measure of love to one\'s neighbor. But the duties of self-regard are only lightly touched upon, and while the truth that the soul has an inalienable worth is insisted upon, to be constantly occupied with the thought of oneself is a symptom of morbid egoism and not a sign of healthy personality. But the chief reason why the New Testament does not enlarge upon the duty of self-culture is that according to the spirit of the gospel the true realization of self is identical with self-sacrifice. Only as a man loses his life does he find it. Not by anxiously standing guard over one\'s soul but by dedicating it freely to the good of others does one realize one\'s true self. At the same time several self-respecting duties are recognized, of which mention may be made:<P class="in15">(i) stability of purpose or singleness of aim;<P class="in15">(ii) independence of other\'s opinion;<P class="in15">(iii) supremacy of conscience and a proper self-estimate.<P>In this connection may be noticed also the Christian\'s proper regard for the body which, as the temple of God, is not to be despised but presented as a living sacrifice; his attitude to worldly goods; his obligation to work; his right to recreation; and his contentment with his station—all of which duties are to be interpreted by the apostolic principle, "Use the world as not abusing it." The Christian ideal is not asceticism or denial for its own sake. Each must make the best of himself and the most of life\'s trust. All the faculties, possessions, pursuits and joys of life are to be used as vehicles of spiritual service, instruments which make a man a fit subject of the kingdom of God to which he belongs.<P>(b) Duties in Relation to Others:<P>Duties in relation to others, or brotherly love, are defined as to their extent and limit by the Christian\'s relation to Christ. Their chief manifestations are:<P class="in15">(i) justice, involving respect for others, negatively refraining from injury and positively yielding deference and honor, truthfulness, in word and deed, "speaking the truth in love," just judgment, avoiding censoriousness and intolerance;<P class="in15">(ii) kindness or goodness, embracing sympathy, service and practical beneficence which provides for physical need, administers comfort and gives, by example and direct instruction, edification;<P class="in15">(iii) patience, comprising forbearance, peaceableness.<P>(c) Duties in Relation to God:<P>Here morality runs up into religion and duty passes into love. Love rests on knowledge of God as revealed in Christ, and expresses itself in devotion. Love to God is expressed generally in<P class="in15">(i) thankfulness,<P class="in15">(ii) humility,<P class="in15">(iii) trustfulness; and particularly in worship (sacraments and prayers), and in witness-bearing—adorning the doctrine by beauty of life.<P>(3) Spheres and Relationships.<P>Of the various spheres and relationships in which the Christian finds opportunity for the exercise and cultivation of his spiritual life we can only name, without enlarging upon them, the family, the state and the church. Each of these spheres demands its own special duties and involves its own peculiar discipline. While parents owe to their children care and godly nurture, children owe their parents obedience. The attitude of the individual to the state and of the state to the individual are inferences which may be legitimately drawn from New Testament teaching. It is the function of the state not merely to administer iustice but to create and foster those agencies and institutions which work for the amelioration of the lot and the development of the weal of its citizens, securing for each full liberty to make the best of his life. On the other hand it is the duty of the individual to realize his civic obligations as a member of the social organism. The state makes its will dominant through the voice of the people, and as the individuals are so the commonwealth will be.<P>6. Conclusion:<P>Absoluteness, Inwardness and Universality.<P>In closing we may say that the three dominant notes of Christian ethics are, its absoluteness, its inwardness and its universality. The gospel claims to be supreme in life and morals. For the Christian no incident of experience is secular and no duty insignificant, because all things belong to God and all life is dominated by the Spirit of Christ. The uniqueness and originality of the ethics of Christianity are to be sought, however, not so much in the range of its practical application as in the unfolding of an ideal which is at once the power and pattern of the new life. That ideal is Christ in whom the perfect life is disclosed and through whom the power for its realization is communicated. Life is a force, and character is a growth which takes its rise in and expands from a hidden seed. Hence, in Christian ethics all apathy, passivity and inaction, which occupy an important place in the moral systems of Buddhism, Stoicism, and even medieval Catholicism, play no part. On the contrary all is life, energy and unceasing endeavor.<P>There are many details of modern social life with which the New Testament does not deal: problems of presentday ethics and economics which cannot be decided by a direct reference to chapter and verse, either of the Gospels or Epistles. But Paul\'s great principles of human solidarity; of equality in Christ; of freedom of service and love; his teachings concerning the church and the kingdom of God, the family and the state; his precepts with regard to personal purity, the use of wealth and the duty of work, contained the germs of the subsequent renewal of Europe and still contain the potency of social and political transformation.<P>LITERATURE.<P>General Works on Ethics: Lotze, Paulsen, Wundt, Green, Sidgwick, Stephen, Dewey and Tufts, Palmer, Bowne, Mezer; Harris, Moral Evolution; Dubois; Randall, Theory of Good and Evil; Calderwood, Handbook of Moral Philosophy; Muirhead, Elementary Ethics; Sutherland, Origin and Growth of Moral Instinct; Simmel, Einleitung in die Moralwissenschaft; Givycky, Moralphilosophic; Guyot, La morale; Janet, Theory Morals (translation); Mackenzie, Manual of Ethics; Eucken, works generally; Hensel, Hauptproblem der Ethik; Lipps, Die ethischen Grundfragen; Natorp, Socialpadagogik; Schuppe, Grundzuge der Ethik u. Rechtsphilosophie; Schwarz, Das sittliche Leben; Wentscher, Ethik.<P>General History:<P>See Histories of Philosophy; Zeller, Erdmann, Windelband, Maurice, Turner, Weber, Rogers, Alexander; Jodl, Geschichte der Ethik in der neueren Philosophic. Works on Theological or Christian Ethics Old Testament: Dillmann, Baudissin, Bertmann, Geschichte der christlichen Sitte; Konig, Hauptprobleme der Altes Testament Religions-Geschichte; Delitzsch, Riehm, Kuenen; Mozley, Ruling Ideas in Early Ages; Hessey, Moral Difficulties in the Bible; Moore, in Lux mundi; Ladd, Doctrine of Sacred Scripture; Robertson, Early Religion of Israel; Caillard, Progressive Revelation; Schultz, Old Testament Theology (English translation); Bruce, Ethics of the Old Testament; N. Smyth, Christian Ethics; Startton; Strong.<P>New Testament and Christianity:<P>Martinsen, Wuttke, Schletermacher, Rothe, Dorner, H. Weiss, Harlen, Hofmann, Frank, Luthardt, Beck, Kiibel, Kahler, Pfieiderer, Schultz, Kostlin; Herrmann, Faith and Morals; Communion of the Christian with God; Thomas, Jacoby, Lemme, Strong, Knight, N. Smyth; Ottley in Lux mundi and Christian Ideas and Ideals; W. L. Davidson, Christian Ethics, Guild Series; W. T. Davidson, Christian Interpretation of Life and Christian Conscience; Mackintosh; Murray, Handbook of Christian Ethics; Maurice, Social Morality; Nash, Ethics and Revelation; Dobschiitz, Christian Life in the Primitive Church; Clark, Christian Method of Ethics; Mathews, The Church and the Changing Order; Freemantle, The World as the Subject of Redemption; The Gospel in Secular Life; Sladden, Applied Christianity; Leckie, Life and Religion; Rauschenbusch, Christianity and the Social Order; Peile, The Reproach of the Gospel; Coe, Education in Religion and Morals; Haering, The Ethics of the Christian Life (English translation); Tymms, Ancient Faith in Modern Light; Harris, God, the Creator; Bovon, Morale chretienne; Wace, Christianity and Morality; Kidd, Morality and Religion; Drummond, Via, Veritas, Vita; Hatch, Greek Ideas and the Christian Church; Matheson, Landmarks of New Testament Morality.<P>Works on New Testament Theology:<P>Also contain section on Ethics; Weiss, Holtzmann, Beyschlag; Harnack, Das Wesen, or What Is Christianity?; Stevens; Wernle, The Beginnings of Christianity; Adeney, Gould, Gardner, Bosworth, Briggs; Caird, Evolution of Religion. Works on the Teaching of Jesus: Especially Wendt, Bruce, Stevens, Horton, Jackson, Swete, Latham, Pastor Pastorum; Tolstoy; Julicher. See next article for the works on the <a href="./study/isbe/search.html?string=ETHICS+OF+JESUS">Ethics of Jesus</a>. Special Works on Apostolic Ethics: Ernesti, Ethik des Apostels Paulus; A. Alexander, The Ethics of Paul; Weinel, Paul; Baur, Paulinismus; Joh. Weiss, Paul and Jesus. History of Christian Ethics:<P>Wuttke, Sidgwick, Ziegler, Luthardt, Thomas; Martineau, Types of Ethical Theory; Gass; Scharling, Christliche Sittenlehre; Lecky, History of European Morals; Pfleiderer.``2';
isbe[3237]='Ethiopia`e-thi-o\'-pi-a (kush; Aithiopia):<P>1. Location, Extent and Population:<P>Critically speaking Ethiopia may refer only to the Nile valley above the First Cataract, but in ancient as in modern times the term was often used not only to include what is now known as Nubia and the Sudan (Soudan), but all the unknown country farther west and south, and also at times Northern, if not Southern, Abyssinia. While Ethiopia was so indefinitely large, yet the narrow river valley, which from the First to the Fifth Cataract represented the main agricultural resources of the country, was actually a territory smaller than Egypt and, excluding deserts, smaller than Belgium (W. Max Muller). The settled population was also small, since in ancient as in modern times Egypt naturally drew away most of the able-bodied and energetic youth as servants, police and soldiers. The prehistoric population of Northern Nubia was probably Egyptian but this was displaced in early historic time by a black race, and the thick lips and woolly hair of the typical African are as well marked in the oldest Egyptian paintings as in the latest. But by the side of these natives of K\'sh, the artist also represents various reddish-brown varieties; for from the beginning of historic time the pure Negro stock has been mixed with the fellaheen of Egypt and with the Sere population of the Arabian coast. The rulers of Ethiopia were generally of foreign blood. The Negroes, though brave and frugal, were slow in thought, and although controlled for centuries by cultivated neighbors, under whom they attained at times high official prominence, yet the body of the people remained uninfluenced by this civilization. The country which we now know as Abyssinia was largely controlled, from the earliest known date, by a Caucasian people who had crossed the Red Sea from Arabia. The true Abyssinians, as Professor Littmann shows, contain no Negro blood and no Negro qualities. In general they are "well formed and handsome, with straight and regular features, lively eyes, hair long and straight or somewhat curled and in color dark olive approaching brown." Modern discoveries prove their close racial and linguistic connection with Southern Arabia and particularly with the kingdom of Sheba (the Sabeans), that most powerful people whose extensive architectural and literary remains have recently come to light. The Sabean inscriptions found in Abyssinia go back some 2,600 years and give a new value to the Bible references as well as to the constant claim of Josephus that the queen of Sheba was a "queen of Ethiopia." The Falashas are a Jewish community living near Lake Tsana, of the same physical type and probably of the same race as other Abyssinians. Their religion is a "pure Mosaism" based upon the Ethiopic version of the Pentateuch, but modified by the fact that they are ignorant of the Hebrew language (Jewish Encyclopedia). It is uncertain when they became Jews. The older scholars thought of them as dating back to the Solomonic era, or at least to the Babylonian captivity. Since the researches of Joseph Halevy (1868), some date within the Christian era has seemed preferable, notwithstanding their ignorance of Talmudic rules. However, the newly discovered fact that a strong Jewish community was flourishing at Syene in the 6th century BC makes it clear that Jewish influence may have been felt in Ethiopia at least that early. Although Abyssinians are noted for their strict adherence to ancient custom, Jewish characteristics are prominent all over the entire country. The opening formula of the king in every official letter—"The Lion of the Tribe of Judah has Conquered!"—is no more Jewish than scores of ordinary phrases and customs. Although it is barely possible that some rites, like circumcision and observance of the Sabbath, may have been received from the ancient Egyptians or Christian Coptics (The New Schaff-Herzog Encyclopedia of Religious Knowledge Encyclopedia) yet a strong Hebrew influence cannot be denied. All travelers speak of the "industry" of the Falashas and of the "kindliness and grave courtesy" of the Abyssinians. Besides those named above there are many communities of mixed races in Ethiopia, but the ancient basis is invariably Negro, Semitic or Egyptian<P>2. History:<P>The ancient Greek writers are full of fantastic and fabulous stories about Ethiopia. Sometimes they become so puzzled in their geography as to speak of Ethiopia as extending as far as India; their notes concerning the miraculous fauna and flora are equally Munchausian. Homer praises the Ethiopians as the "blameless race," and other writers rank them first among all men for their religious knowledge. This latter notion may have had its origin from a priestly desire to consider the Ethiopian reverence for the priesthood—which had the power of life and death over the kings—as the Divinely ordained primitive custom, or it may have sprung from the fact that the Egyptian "Land of the Gods" was partly situated in Southern Abyssinia. It is suggestive that the Hebrew prophets never fell into these common errors but invariably "gave a very good idea of geographical and political conditions" (W. Max Muller). The oldest important historic document referring to Ethiopia is from the IVth Dynasty of Egypt. when Sneferu laid waste the land, capturing 7,000 slaves and 100,000 cattle. In the VIth Dynasty the Egyptians reached as far south as the Second Cataract and brought back some dwarfs, but did not establish any permanent control. In the XIIth Dynasty Egypt\'s real occupation of Ethiopia began. Usertesen III records his contempt by saying: "The Negro obeys as soon as the lips are opened. They are not valiant, they are miserable, both tails and bodies!" Notwithstanding this satiric reference, these naked Ethiopians clad in skins and tails of wild animals, compelled the Pharaoh to make several campaigns before he could establish a frontier at the Second Cataract beyond which no Negro could come without a permit. That the natives were not cowardly may be seen from the songs of triumph over their subjection and from the fact that every later Pharaoh encouraged them to enlist in his army, until finally the very hieroglyphic for archer became a Nubian. The XVIIIth Dynasty pushed the frontier beyond the Third Cataract into the splendid Dongola district and often boasts of the rich tribute from Ethiopia., in one case 2,667 "manloads" of ivory, ebony, perfumes, gold and ostrich feathers besides cattle, wild beasts and slaves. The chairs of ivory and the jewelry sometimes shown seem barbaric in style but excellent in workmanship. Copper and bronze factories and great iron foundries date also to a very early time in Ethiopia (PSBA, XXXIII, 96). The Ethiopian gold mines where hundreds of criminals toiled, with ears and noses mutilated, made gold in Egypt in the 15th century BC as "common as dust." The choicest son of the Pharaoh, next to him in power, was proud to be called "Prince of Kush." Amenhotep IV (1370 BC), the religious reformer, built his second greatest temple (the only one of his works now existent) in Nubia. The XIXth Dynasty sought to colonize Ethiopia., and some of the most magnificent temples ever built by man can be seen as far south as the Fourth Cataract. For over five centuries Egyptian rule was maintained, until about 1000 BC a war for independence began which was so successful that the victorious Ethiopian kings finally carried their armies against Thebes and Memphis and for a century (763-663) ruled all Egypt from Napata—which in religious architecture became the Southern Thebes—and for another century (and even at times during the Ptolemaic era) controlled upper Egypt. While the leaders of this revolution were doubtless descendants of exiled priests from Thebes, yet the mixture of Ethiopian blood is plainly discernible and is perhaps also shown in their "Puritan morals" (Petrie, III, 276) and spirit of clemency, so different from the legitimate Pharaohs. Shabaka = So (715-707) and Taharka = Tirhaqah (693-667), both mentioned in the Bible, were the last great kings of Ethiopia. When Tanutamen, son of Shabaka and nephew of Taharka (667-664), was forced by Ashurbanipal to give up his claim to Egypt and retire to the south, the influence of Ethiopia ceased. Cambyses (525-521) made Ethiopia tributary clear to the Third Cataract (compare <a onClick="return mV(\'Eze\',30,4);">Eze 30:4</a>), while King Ergamenes, near the close of the 3rd century BC, broke forever the power of the Egyptian priesthood. Though the Romans held a nominal protectorate over Ethiopia, it was of so little importance as to be scarcely ever mentioned. After being expelled from Egypt the Ethiopians still continued to honor the gods of Thebes, but, as foreign influence ceased, the representations of this worship became more and more African and barbaric. Even after Christianity had triumphed everywhere else, the Nubians, as late as the 5th century AD, were still coming to Philae to give honor to the statue of Isis (Erman). In the 6th century AD a native king, Silko, established a Christian kingdom in the Northern Sudan with Dongola as its capital. This raised somewhat the culture of the land. In the next century the Arabs made Nubia tributary, though it took an immense army to do it. For six centuries thereafter Islam demanded a tribute of 360 slaves annually, and other treasure, though innumerable campaigns were necessary to collect it. The Nubian kings refused all overtures to become Moslems, and Christian churches multiplied along the banks of the Nile. In the 8th century Egypt was invaded by 100,000 Nubians to repay an insult given to the Coptic patriarch and to the sacred pictures in the Egyptian Christian churches. In the 13th century, David, king of Nubia, not only withheld tribute but invaded Egypt. He was terribly punished, however, by the Arabs, who sacked churches and tortured Christians clear to the Fourth Cataract. This was the beginning of the end. By the close of the 15th century almost every Christian altar was desolate and every church destroyed.<P>3. Bible References:<P>Winckler long ago proved that the Assyrians designated a district in Northern Arabia by the same name which they ordinarily applied to Ethiopia. Skinner (Genesis, 1910, 208) thinks the Hebrews also made this distinction and were therefore entirely right when they spoke of Nimrod as "son of Gush," since the earliest Babylonian dynasty had as a matter of fact a Semitic origin. There may be other references to an Arabian district, but undoubtedly the African Kush must be the one generally designated. This is referred to once in the New Testament and over 40 times in the Old Testament. Many secular monuments speak of the high honor paid to women in Ethiopia., and Candace (<a onClick="return mV(\'Act\',8,27);">Ac 8:27</a>) seems certainly to have been an official or dynastic name for a number of Ethiopian queens. One of the pyramids of Meroe was Candace\'s—her picture can still be seen at Kaga—and to her belonged the wonderful treasure of jewelry found in 1834 by Ferlini and now in the Berlin museum. Petronius (24 BC) raided Ethiopia for Rome and stormed the capital, but Candace sent ambassadors to Rome and obtained peace. The "eunuch" who may have been the treasurer of this very queen was probably "no black proselyte but a Jew who had placed the business ability of his race at the service of the Nubian woman" (W. Max Muller). In the Old Testament Ethiopia is spoken of with great respect, and several Bible characters are named Cushi (<a onClick="return mV(\'2Sa\',18,21);">2Sa 18:21</a> the King James Version; <a onClick="return mV(\'Jer\',36,14);">Jer 36:14</a>; <a onClick="return mV(\'Zep\',1,1);">Ze 1:1</a>); even Moses married an Ethiopian wife (<a onClick="return mV(\'Num\',12,1);">Nu 12:1</a>), and Ebed-melek the Ethiopian is helper to Jeremiah (<a onClick="return mV(\'Jer\',38,7);">Jer 38:7</a>). It is a great land situated beyond the frontiers of the civilized world (<a onClick="return mV(\'Eze\',29,10);">Eze 29:10</a>), yet with Jews in its farthest district (<a onClick="return mV(\'Zep\',3,10);">Ze 3:10</a>). It is very rich (<a onClick="return mV(\'Job\',28,19);">Job 28:19</a>; <a onClick="return mV(\'Isa\',43,3);">Isa 43:3</a>); is engaged in trade with Arabia (<a onClick="return mV(\'Isa\',45,14);">45:14</a>), and its citizens are proud of their nationality (<a onClick="return mV(\'Psa\',87,4);">Ps 87:4</a>). Again and again the relation of Cush with Sheba is mentioned (<a onClick="return mV(\'Gen\',10,7,28);">Ge 10:7, 28</a>; <a onClick="return mV(\'Isa\',43,3);">Isa 43:3</a>, etc.), which latter statement is strangely corroborated by the recently discovered Sabean inscriptions throughout Abyssinia. Its typical inhabitants have a color as unchangeable as the leopard\'s spots (<a onClick="return mV(\'Jer\',13,23);">Jer 13:23</a>), are careless (<a onClick="return mV(\'Eze\',30,9);">Eze 30:9</a>), but very warlike (<a onClick="return mV(\'Eze\',38,5);">Eze 38:5</a>; <a onClick="return mV(\'Jer\',46,9);">Jer 46:9</a>), giving "infinite" strength to Nineveh (<a onClick="return mV(\'Nah\',3,9);">Na 3:9</a>), but who can be resisted by Israel because of Yahweh\'s favor (<a onClick="return mV(\'2Ch\',16,8);">2Ch 16:8</a>; <a onClick="return mV(\'Isa\',20,5);">Isa 20:5</a>; <a onClick="return mV(\'Isa\',36,6);">36:6</a>). Yahweh is interested in the history of Ethiopia as well as Egypt (<a onClick="return mV(\'Isa\',20,3);">Isa 20:3</a>), loves the children of Ethiopia as the children of Israel (<a onClick="return mV(\'Amo\',9,7);">Am 9:7</a>), and the time is coming when Ethiopia shall yet stretch out her hands to Yahweh (<a onClick="return mV(\'Psa\',68,31);">Ps 68:31</a>). Cush and Mizraim are correctly mentioned as political unit (<a onClick="return mV(\'Isa\',20,4);">Isa 20:4</a>f), and several kings of Ethiopia are mentioned by name—Zerah (<a onClick="return mV(\'2Ch\',14,9);">2Ch 14:9</a>), So (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>) and Tirhaqah (<a onClick="return mV(\'2Ki\',19,9);">2Ki 19:9</a>; <a onClick="return mV(\'Isa\',37,9);">Isa 37:9</a>). The statements concerning these kings have been pronounced incorrect because it seemed that Zerah could not possibly be an equivalent for Usarkon or So for Shabaka—the known kings of Egypt at those periods—and also because the reigns of Shabaka and Tirhaqah did not begin until after the dates at which in the Hebrew records they were called "kings of Ethiopia."<P>Recent, information, however, makes it clear that both Shabaka and Tirhaqah exercised royal authority in the Delta before they were given it farther south, and that the Hebrew transcription of names was very easy and natural. (See W. M. Flinders Petrie, Hist of Egypt, III, 280-309; Egypt and Israel (1911), 76-78.)<P>4. The Church in Abyssinia:<P>Sem influence entered Abyssinia at least as early as the 7th or 8th century BC (see above), and the kings of Axum claimed descent from Menelek, Son of Solomon, but the first certain information concerning the kingdom of Axum comes from the middle of the 1st century AD, at which time Axum was a rich capital, and its ancient sacredness was so great that from that period clear down to the 19th century the kings of Abyssinia would travel there to be crowned. There is no reason to doubt that Frumentius (circa 330 AD) was the first to introduce Christianity. Merope of Tyre, according to the often-told story, when returning from India with his two nephews, was captured and killed off the Ethiopian coast, but the two boys were carried to the Abyssinian king; and although one perished the other, Frumentius, succeeded in converting the king and his people to Christianity, and later was himself consecrated by Athanasius of Alexandria as the first Metropolitan of Ethiopia, taking as his title Abu Salama ("Father of Peace"). From that time until now, with but one single interruption, the Abuna ("Father") has always been appointed by the Patriarch of Alexandria and, since the 13th century, has been by legal necessity not a native Abyssinian, but a Copt.<P>After the Council of Chalcedon (450 AD) condemned all as heretics who did not accept the "double nature" of Christ, both the Egyptian and Abyssinian churches separated themselves from Rome, believing so thoroughly in the Deity of Christ as to refuse to accept His humanity as essential "nature." In the 5th century a great company of monks entered Abyssinia, since which time the monastic tendency has been strongly marked. About 525, Caleb, king of Axum, attacked the Homeritae across the Red Sea—either for their persecution of Christians or their interference with his trade—and for some half a century controlled a large district of Arabia. At this time Abyssinian trade was extensive. Greek influence was also felt, and the Christian cathedral at Axum was a magnificent work of architectural article The early churches were protected by heavy surrounding walls and strong towers. The invasion of Africa by Islam in the 7th century required 300 years of battle for the preservation of Abyssinian liberty and Christian faith. It alone of all the African states succeeded in preserving both—but its civilization was destroyed, and for 1,000 years it was completely hidden from the eyes of its fellow-Christians in Europe. Occasionally during those centuries a rumor would reach Europe of a "Prester John" somewhere in the Far East who was king of a Christian people, yet it was a thrilling surprise to Christendom when Pedro de Cavilham in the 15th century discovered this lost Christian kingdom of Abyssinia completely surrounded by infidel pagans and bigoted Mohammedans. When, early in the 16th century, the Negus of Abyssinia sent an envoy to the king of Portugal asking his help against the Moslems, the appeal was met with favor. In 1520 the Portuguese fleet arrived in the Red Sea and its chaplain, Father Francisco Alvarez, 20 years later stirred the Christian world by his curious narratives. Not long afterward, when the Arabs actually invaded the country, another Portuguese fleet was sent with a body of military, commanded by Christopher de Gama. These 450 musketeers and the six little pieces of artillery gave substantial aid to the endangered state. Father Lobe tells the story. The Abyssinian king must have been grateful for such help, yet presently the strenuous efforts of the Portuguese clergy to convert him and his people to the Roman Catholic faith became so offensive that Bermudez, the most zealous missionary, was compelled to leave the country and the Jesuits who remained were mistreated. Other efforts to win the Abyssinian Christians to renounce the Monophysitic heresy and accept the doctrine and control of Rome were somewhat more successful. Early in the 17th century Father Pedro Paez, an ecclesiastic of much tact, won the king fully to his faith, and under his direction many churches were erected and advantageous government works carried on. However, his successor Mendez lacked his conciliatory ability and, although a punishment of seven years\' chastisement was proclaimed against recalcitrants, the opposition became so violent and universal that the Negus Sysenius finally abdicated in favor of his son Fasilidas, who in 1633 sent all Jesuits out of the country and resumed official relations with the Egyptian church. Since then, although many efforts have been made, no controlling influence has ever been obtained by Rome. Once more, for over a century, Abyssinia became completely hidden from the eyes of the outside world until James Bruce, the explorer, visited the country, 1770-72, and made such a report as to arouse again the interest of Christendom. The translation of the Bible, which was made by his Abyssinian guide, was adopted and published by the British and Foreign Bible Society, and in 1829 the Church Missionary Society sent out Gobat and Kugler as the first Protestant missionaries to Abyssinia, who were followed shortly after by some Roman Catholics. Owing chiefly to the opposition of native priests the Protestants were expelled in 1838 and the expulsion of the Roman missionaries followed in 1854. In 1858 a Copt who had been influenced as a youth by a Protestant school, became Abuna, and Protestant missionaries were again admitted, but succeeded in doing little permanent work owing to the political disturbances while King Kesa (Theodore)—the Napoleon of Africa—was attempting to consolidate native resources and build up an African empire. At this period the influence of Great Britain began to be felt in Abyssinia. After the suicide of Theodore (1868) and especially after Menelek II had succeeded in making himself emperor (1899), this influence became great. During the 20th century missionaries have been able to work in Abyssinia without much danger, but the Moslem influence is so preponderating that little has been attempted and little done. The religion of the Crescent seems now almost completely victorious over the strange land which for so many centuries, alone and unhelped, held aloft in Africa the religion of the Cross. (See especially The Mohammedan World of Today, by Zwemer, Wherry, and Barton, 1907; Missionary World, 1910-11.)<P>5. Beliefs and Practices:<P>In creed, ritual, and practice, the Abyssinian church agrees generally with the Coptic. There are seven sacraments and prayers for the dead, high honor is paid to the Virgin Mary and to the saints; fasts and pilgrimages are in much favor; adults are baptized by immersion and infants by affusion. A blue cord is placed about the neck at baptism. An extract from one of the Gospels, a silver ring, an ear pick and a small cross, often very artistic, are also worn about the neck. No charms or beads or crucifixes ("graven images") are worn. The Jewish as well as the Christian Sabbath is kept sacred, and on an average every other day during the year is a religious holiday. The people are ignorant and superstitious, yet impress observers with their grave kindliness and seem at times eager to learn. The clergy can marry before but not after ordination. Priests must be able to read and recite the Nicene Creed (the "Apostles\' Creed" is not known), but do not understand the Ge\'ez language in which the liturgies are written. They conduct many and long services and attend to the ceremonial purifications. Deacons must also be able to read; they prepare the bread for the Holy Sacrament and in general help the priests. The monastic clergy have chief care of the education of the young—though this consists mainly in Scripture reading—and their head, the Etshege, ranks next to the Abuna.<P>The ancient churches were often basilican, but modern native churches are quadrangular or circular. The Holy of Holies always stands in the center, and is supposed to contain an ark. Tradition declares that the ark in the cathedral at Axum is the original ark from Solomon\'s temple. An outer court surrounds the body of the church, which is freely used by laymen and as a place of entertainment for travelers. Very crude pictures are common. These show both Egyptian and European influence, and are probably not merely decorations but have a relation, as in Egyptian thought, to spiritual advancement in this life or the next (compare Budge, Introduction to the Lives of Maba\' Segon and Gabra Krestos, 1898). The services consist of chanting psalms, reading Scriptures and reciting liturgies.<P>6. Abyssinian Literature:<P>The Abyssinian canon (Semanya Ahadu) consists of 46 Old Testament and 35 New Testament books. Besides the usually accepted books, they count Shepherd of Hermas, Synodos (Canons), Epistles of Clement, Maccabees, Tobit, Judith, Wisdom, Ecclesiasticus, Baruch, 4 Ezra, Ascension of Isaiah, Book of Adam, Joseph ben Gorion, Enoch and Jubilees. The Ethiopic texts of the two latter give these books in the most ancient form, and their discovery has led to much valuable discussion. The use of the Ge\'ez language in which these are written dates back to a time shortly before the introduction of Christianity. From the 5th to 7th centuries AD, the literature is almost exclusively translated from Greek writers or adaptations of such writings. Quotations abound from Basil, Gregory, Ignatius, Athanasius, Epiphanus, Cyril, Dioscurus, etc. The second literary period begins 1268, when the old "Solomonic" Dynasty regained its place and continues to the present; it consists mainly of translations from the Arabic. In both periods the topics are few: liturgies, hymns, sermons, the heroic deeds of the saints and their orthodoxy. Each saint uses the four Holy Gospels, as David his four stones, to kill every heretical Goliath (compare Goodspeed and Crum, Patrologia Orientalis, IV, 1908). A large place is given to miracles and magic prayers and secret names (compare Budge, Miracles of the Virgin Mary,1900,and "Magic Book of Disciples," JAOS, 1904). The legends or histories are occasionally well written, as the famous "Magda Queen of Sheba" (English Translation by Mrs. J. Van Vorst, 1907), but usually are as inferior in style as in thought (compare Littmann, Bibliotheca-Abessinica, 1904). A few specimens of "popular literature" and many Abyssinian "proverbs" are extant (JAOS, XXIII, 51-53; XXV, 1-48; Jour. asiatique, IV, 487-95).<P>7. Nubian Literature:<P>The modern Nubian does not write, and his ancient predecessors wrote but little. Even in the days of the Pharaohs the hieroglyphics in most Nubian temples were written so poorly as to be almost unintelligible, and in later pre-Christian monuments put up by native rulers the usual tablets accompanying the Divine tableaux are often left blank. Some centuries before our era the necessary monumental inscriptions began to be composed in the Nubian language, though still written in hieroglyphics. Shortly after the beginning of the Christian era a native cursive writing begins to be used on the monuments, closely resembling the Egyptian demotic, from which undoubtedly its alphabet was derived (F. L. Griffith in Areika). Finally, after Nubia became Christian (6th century), another native system appears written in Greek and Coptic letters. Lepsius found two such inscriptions on the Blue Nile and numbers have since been discovered, but until 1906 these were as unreadable as the other two forms of Nubian writing. In that year Dr. Karl Schmidt found in Cairo two precious fragments of parchment which had been owned by some Nubian Christians of probably the 8th or 9th century. One of these contained a selection of passages from the New Testament—as was ascertained by comparing it with the Greek and Coptic Scriptures. By the aid of bilingual cartouches several proper names were soon deciphered. New inscriptions are now being brought to light every few months, and undoubtedly the translation of this important tongue, which contains the "history of an African Negro dialect for some 2,000 years" and also the religious history of the long-lost Christian church of the Sudan, will soon be accomplished. The other fragment found by Schmidt was a curious Hymn of the Cross, well representing the ancient Ethiopian hymnology:<P>"The cross is the hope of Christians; The cross is the resurrection of the dead; The cross is the physician of the sick; The cross is the liberator of the slave," etc.<p>—James H. Breasted in Biblical World, December, 1908; Nation, June 2, 1910.<P>8. Exploration:<P>Scientific observation of Nubia began with Burckhardt (1813), Cailliaud, and Waddington (1821), and especially with Lepsius (1844), but excavation in the proper sense was begun by the University of Chicago (1905-7), followed (1907-10) by expeditions sent out by the Royal Academy of Berlin, University of Pennsylvania, University of Liverpool, and Oxford University.<P>LITERATURE.<P>Besides the works quoted above, among recent Encyclopedias, see especially Encyclopedia Britannica (11th edition) and New Sck-Herz; and among the more recent books: James T. Bent, The Sacred City of the Ethiopians (1893); Glaser, Die Abessinier in Arabien und Afrika (1895); A. B. Wylde, Modern Abyssinia (1901); R. P. Skinner, Abyssinia of Today (1906); Th. Noeldeke, Die athiopische Litteratur (1906); Louis J. Morie, Les civilisations africaines (1904); Littmann, Geschichte der athiopischen Litteratur (1907); W. Max Muller, Aethiopien (1904); Petrie, Hist of Egypt (1895-1901); J. H. Breasted, Temples of Lower Nubia (1906); Monuments of Sudanese Nubia (1908); A. E. Weigall, Report of Antiquities of Lower Nubia (1906); E. A. W. Budge, The Egyptian Sudan (1907); Kromrei, Glaubenslehre und Gebrauche der alteren abessinischen Kirche (1895); M. Fowler, Christian Egypt (1901); Dowling, Abyssinian Church (1909); "Meroe," the City of the Ethiopians, by Liverpool University Expedition (1909-10); University of Pennsylvania Publications, Egyptian Dept., Eckley B. Coxe, Jr., Expedition to Nubia, I-IV (1909-11); Archeological Survey of Nubia; and Egyptian government reports.``26';
isbe[3238]='Ethiopian Eunuch`e-thi-o\'-pi-an u\'-nuk eunouchos:<P>A man who occupied a leading position as treasurer at the court of Candace, queen of the Ethiopians, and who was converted and baptized by Philip the deacon (<a onClick="return mV(\'Act\',8,\'27-39\');">Ac 8:27-39</a>). Being a eunuch, he was not in the full Jewish communion (compare <a onClick="return mV(\'Deu\',23,1);">De 23:1</a>), but had gone up to Jerusalem to worship, probably as a proselyte at the gate. During his return journey he spent the time in studying Isaiah, the text which he used being that of the Septuagint (compare Professor Margoliouth, article "Ethiopian Eunuch" in HDB). On meeting with Philip the deacon, who was on his way to Gaza, he besought of him to shed light upon the difficulties of the Scripture he was reading, and through this was converted. The place of his baptism, according to Jerome and Eusebius, was Bethsura: by some modern authorities, eg. G A. Smith, it has been located at or near Gaza. The verse containing the confession of the eunuch, "I believe that Jesus Christ is the Son of God," is omitted either in whole or in part by some texts, but Hilgenfeld, Knowling, etc., regard it as quite in keeping with the context. Tischendorf, Westcott and Hort, Revised Version (British and American) text, etc., uphold the omission. The verse occurs in the body of the King James Version, but is given only as a footnote in the Revised Version (British and American) and the American Standard Revised Version. The diligence with which the eunuch pursued his reading, the earnestness with which he inquired of Philip, and the promptness with which he asked for baptism—all testify to the lofty nature of his character.``88';
isbe[3239]='Ethiopian Woman``<a href="./study/isbe/search.html?string=CUSHITE+WOMAN">CUSHITE WOMAN</a>`1';
isbe[3240]='Ethiopic Language`e-thi-op\'-ik lan\'-gwaj:<P>The language commonly called Ethiopic is the language in which the inscriptions of the kings of the ancient Aksumitic (Axumite) empire and most of the literature of Christian Abyssinia are written. It is called lesana Ge\'ez, "the tongue of Ge\'ez," by the Abyssinians themselves, most probably because it was originally the dialect of the Ge\'ez tribe, who in antiquity must have dwelt in or near Aksum (Axum).<P>The names Ethiopia and Ethiopians have been used in many different meanings by various peoples. To the Greeks, Ethiopia was a country south of Egypt, and in this sense the word is generally used in the histories of Egypt. The Ethiopian kings came from that country which is now called Nubia in the Anglo-Egyptian Sudan. In Hellenistic times the term received a wider meaning, and Ethiopia was the name of all the land between the Red Sea and the Nile, south of Egypt proper. Sometimes "Indian" and "Ethiopian" were synonymous, or Ethiopia was even considered to stretch as far as to the Atlantic Ocean in the west. But of these countries the Greeks and Romans had very little exact geographical knowledge.<P>The fact that Ethiopia at some time meant the country between the Red Sea and the Nile prompted the pagan kings of Aksum in Northern Abyssinia to adopt this name for their own country and to give it a narrower sense than the one which it had at that time. Therefore in the bilingual inscription of King Aeizanas (\'Ezana), the word Aithiopia, is a rendering of the Semitic Chabashat ("Abyssinia," but here more specially referring to Northern Abyssinia). Under this same king, about 350 AD, Abyssinia became Christian; and after the Bible had been translated into the Ge\'ez language, the Abyssinians found that Ethiopia was mentioned there several times. Their national pride was flattered by the thought that their country should be referred to in the Holy Scriptures, and for this reason they were all the more ready to apply the name in question to their own country. Up to the present day they call it Ethiopia (\'Itiopiya), and themselves Ethiopians; their legends speak even of an ancestor Itiopis.<P>We may then, if we choose to do so, speak of a Nubian and an Abyssinian Ethiopia, but the term "Ethiopic language" has come into general usage as an equivalent of lesana Ge\'ez, and should therefore be applied only to the ancient literary language of Abyssinia.<P>This language is closely allied to the languages of Southern Arabia: it represents the southwestern branch of the southern division of the Semitic languages. The most important branch of this division is, of course, the Arabic language, and with this Ethiopic has a great deal in common. On the other hand there are many words and forms in Ethiopic which are not found in Arabic, but in Hebrew or even in Babylonian and Assyrian. It has been held that the home of the Semites was in Africa; and if that were the case, the people who spoke the Ethiopic language may never have migrated very much. But the majority of scholars who have expressed their opinion upon the subject believe that Asia was the home of the Semites; this is the opinion of the writer of this article also. Then the Semitic inhabitants of Abyssinia must have come from across the Red Sea. Their migration must have begun many centuries BC. It has hardly ever stopped, since Arabs in smaller, and sometimes in larger, numbers have been drifting into Abyssinia at all periods.<P>The Semitic conquerors of Abyssinia found peoples of two different races in the country where they settled: (1) African aborigines and (2) Kushites, a branch of the Hamitic family. Their languages were different from each other and, of course, different from that of the Semites also; some of them are spoken up to the present day. When the Semites first came and formed their literary language, they did not allow the languages of the country to influence their own speech very much; but gradually this influence grew stronger and stronger, and it is very evident in the modern Semitic languages of Abyssinia. An outline of the history of the Ethiopic language is as follows: Its oldest monument known so far is the Semitic part of the bilingual inscription of King \'Ezana, which dates from the first half of the 4th century AD. Before that time Ethiopic must have been spoken, without doubt, but it was not written: Greek and Sabean were written instead. At the time of King \'Ezana the knowledge of the Sabean language seems to have been very little; but Sabean script was still used. The Semitic part of the inscription just mentioned is in the Ethiopic language, but carved once in Sabean script and a second time in the native Ethiopic script which had been derived from the Sabean. In the first of these two "editions" two or three Sabean words are used instead of their Ethiopic equivalents. A few other ancient inscriptions found in the Aksumitic empire may also be dated from the same period.<P>Possibly in the same 4th century the translation of the Bible into Ethiopic was begun; and this fact marks the beginning of a real Ethiopic literature. Perhaps the Psalms and the Gospels were translated first, being most needed in the service of the Christian church. The different books of the Scriptures were translated by different men, some of whom rendered literally, some more according to the sense, some having a good, some only a poor, knowledge of the language from which, and the language into which, they translated. Both Testaments were translated from the Greek by men whose mother-tongue was probably Aramaic. This is proved by the presence of Greek and Aramaic words and by the forms in which the Hebrew names appear in Ethiopic transliteration. The oldest influences which the Ethiopic language experienced were therefore:<P>(1) Sabean; a number of technical terms may have been adopted by the ancient Aksumites from the Sabean at the time when this was their literary language;<P>(2) African, i.e. Kushite and native African; the Semitic conquerors found a great many new animals and trees or plants, which they did not know, in their new country, and in many cases they adopted their African names;<P>(3) Aramaic, i.e. Jewish and Christian; these are mostly words referring to religious or theological matters;<P>(4) Greek; some of the Greek words found in Ethiopic refer to religious matters in the same way as the Aramaic, others denote objects or ideas which the ancient Abyssinians received from the civilized world, others again are mere transliterations of Greek words in the Bible and other religious books, which the translators did not understand.<P>The time of the Aksumitic empire was the time when the Ethiopic language flourished. This empire was overthrown probably in the 7th or 8th century AD; and we know very little indeed of the history of Abyssinia from about 700 until about 1300 AD. In 1270 the so-called Solomonic Dynasty came to the throne again; the seat of the empire, however, was no longer Aksum but Gondar, north of Lake Tsana. Meanwhile the literary language had become a dead language; new dialects had sprung up and taken its place in everyday conversation. But Ge\'ez continued to be the sacred language; it was the language of the Bible and of the church, and when in the 14th and 15th centuries a revival of Abyssinian literature came about, the literary language was Ge\'ez. But it was influenced by the new dialects, especially by the Amharic, the language of Amhara, where Gondar was situated and where most of the books were written or translated. This influence affected in particular the spelling of Ge\'ez in those books which dealt with religious matters and which therefore had to be written in pure Ge\'ez. In historical books a great many words were taken from the Amharic; and this language, called lesana tarik, "the tongue of the chronicles," has often the appearance of mixed language.<P>In the 16th and 17th centuries European missionaries came to Abyssinia and tried to convert the monophysite Abyssinian Christians to Romanism. In order to come into close contact with the common people they used Amharic as a literary language, so that everybody, not only the learned, might understand their books. Their example was followed by the defenders of the native church; and since that time Amharic has become a recognized literary language in Abyssinia, although Ge\'ez is still considered the real language of the church.<P>Amharic was derived from a sister language of the Ethiopic; the direct descendant of the Ethiopic language is modern Tigrina; a language derived from a dialect very closely related to Ge\'ez is modern Tigre.<p>LITERATURE.<P>Ludolf, Historia Aethiopica, 1681; id, Commentarius ad suam historiam Aethiopicam, 1691; Dillmann, Grammatik der athiopischen Sprache (translated into English by Crichton) 1907, Intro; Littmann, Geschichte der athiopischen Litteratur, 1907.`<a href="./study/isbe/search.html?string=ETHIOPIA">ETHIOPIA</a>`102';
isbe[3241]='Ethiopic Versions`e-thi-op\'-ik vur\'-shuns:<P>Christianity was introduced into Abyssinia by Tyrian missionaries, who probably spoke Greek, about the time of Constantine the Great. The Bible was translated into Ethiopic, or, to use the native name, Ge\'ez, the Old Testament being from the Septuagint, between the 4th and 5th centuries, by various hands, though the work was popularly ascribed to Frumentius, the first bishop. The fact of the Scriptures having been translated into Ethiopic was known to Chrysostom (Hom. II, in Joannem). The versions thus made were revised some time about the 14th century, and corrected by means of the Massoretic Text. The Ethiopic Scriptures contain the books found in the Alexandrine recension with the exception of the Books of Maccabees; but their importance lies in their pseudepigraphic writings, the Asc Isaiah, the Book of Enoch and the Book of Jubilees. The 1st edition of the New Testament appeared at Rome in 1545-49 (reprinted in Walton), but a critical edition has yet to be made; one issued by the British and Foreign Bible Society in 1830 contains many errors. The Old Testament canonical books and Apocrypha have been edited by Dillmann (the Octoteuch and 1-4 Kings and Apocrypha), Bachmann (died 1894) (Isa, Lam, Ob and Mal), and Ludolph (Pss). The Psalter has been often printed from 1513 on. The Book of Enoch was first translated by Richard Laurence and published at Oxford in 1821, but the standard editions are those of Dillmann (Leipzig, 1853) and R. H. Charles (Oxford, 1893). The importance of this work lies in the fact that "the influence of Enoch on the New Testament has been greater than that of all the other apocryphal and pseudepigraphal books taken together" (Charles, 41). Not only the phraseology and ideas, but the doctrines of the New Testament are greatly influenced by it. Of the canonical books and Apocrypha the manuscripts are too poor and too late to be of any value for the criticism of the Greek text.``189';

isbe[3247]='Eubulus`u-bu\'-lus (Euboulos, literally, "of good counsel," <a onClick="return mV(\'2Ti\',4,21);">2Ti 4:21</a>):<P>One of the members of the church in Rome at the time of Paul\'s second imprisonment in that city.<P>The apostle mentions how, at his first answer to the charges brought against him at the emperor\'s tribunal, the Roman Christians as a whole proved disloyal to him "no one took my part, but all forsook me" (<a onClick="return mV(\'2Ti\',4,16);">2Ti 4:16</a>). In these circumstances when the desertion of Paul by the Christians in Rome was so disheartening, it is pleasing to find that there were some among them who were true, and Eubulus was one of these. Paul therefore in writing the last of all his epistles sends to Timothy a greeting from Eubulus.<P>Nothing more is known in regard to Eubulus. As his name is Greek, he was probably a Gentile by birth. John Rutherfurd``1';
isbe[3248]='Eucharist`u\'-ka-rist.`<a href="./study/isbe/search.html?string=LORD\'S+SUPPER">LORD\'S SUPPER</a>`1';
isbe[3249]='Eumenes II`u\'-me-nez (Eumenes, "well-disposed"):<P>King of Pergamus, son and successor of Attalus I (197 BC). He is mentioned in the Apocrypha (1Macc 8:8) in connection with the league which Judas Maccabeus made with the Romans. As their ally in the war against Antiochus the Great and in recognition of his signal service at the decisive battle of Magnesia (190 BC), Eumenes II was rewarded with such extensive tracts of country as raised him at once from comparative insignificance to be the sovereign of a great state. The statement in the Apocrypha describing his extension of territory differs from those of Livy, Polybius and Appian, and cannot be correct.<P>The Romans are said to have taken "India, and Media and Lydia" from Antiochus and to have given them to Eumenes II. Antiochus never had any possessions in India nor had any earlier king of Syria. He was obliged to give up only the countries on the side of Taurus toward Rome. No suggestion for the reading "India" in the narrative has met with acceptance (it may possibly have been a copyist\'s error for "Ionia"; see Livy xxxvii.44). Eumenes II cultivated the Roman alliance carefully but became suspected in connection with the affairs of Perseus, the last king of Macedonia. He never came to an open rupture with the Romans, and died in 159 BC, after a reign of 39 years.``79';
isbe[3250]='Eunatan`u-na\'-tan.`<a href="./study/isbe/search.html?string=ENNATAN">ENNATAN</a>`1';
isbe[3251]='Eunice`u-ni\'-se, u\'-nis (Eunike, is the correct reading, and not Euneike, which is read by the Textus Receptus of the New Testament of Stephen, three syllables: Eu-ni-ke, literally, "conquering well"; <a onClick="return mV(\'2Ti\',1,5);">2Ti 1:5</a>): The mother of Timothy.<P>1. Eunice\'s Home:<P>Her name is Greek and this might lead to the inference that she was a Gentile by birth, but such a conclusion would be wrong, for we read in <a onClick="return mV(\'Act\',16,1);">Ac 16:1</a> that she was a Jewess. Her husband however was a heathen Greek She was in all probability a daughter of Lois, the grandmother of Timothy, for both of those Christian women are spoken of, in one breath, by Paul, and this in high terms of commendation.<P>2. How She Trained Her Son:<P>Timothy had not been circumcised in childhood, probably because of his father\'s being a Gentile; but the mother and the grandmother did all that lay in their power to train Timothy in the fear of God and in the knowledge of the Scriptures of the Old Testament. "From a child" Eunice had taught her boy to "know the holy scriptures" (<a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a> the King James Version). It is right therefore to connect this home training of Timothy in the fear of God, with his and his mother\'s conversion to the gospel. His name Timothy—chosen evidently not by the father, but by Eunice—signifies "one who fears God." The "wisdom" of the Hebrews consisted not in worldly prudence or in speculative philosophy, but in the fear of the Lord, as is shown in such passages as <a onClick="return mV(\'Psa\',111,10);">Ps 111:10</a>, and in <a onClick="return mV(\'Job\',28,\'1-\');">Job 28</a>, and in Proverbs throughout. His name, as well as his careful home training, shows how he was prepared to give a welcome both to Paul and to the gospel proclaimed by him, when the apostle in his first great missionary journey came to Lystra, one of the cities of Lycaonia or Southern (?) Galatia, wher
