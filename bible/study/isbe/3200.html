e Eunice and her family lived. This is implied in the account of Paul\'s second missionary journey (<a onClick="return mV(\'Act\',16,1);">Ac 16:1</a>), where we read that he came to Lystra, and found there a certain disciple named Timotheus, the son of a certain woman who was a Jewess, who believed.<P>3. Her Conversion to Christ:<P>It is therefore certain that Eunice and Timothy were not brought to a knowledge of the gospel at this time, but that they were already Christians; she, "a believer"; he, "a disciple." This evidently means that Eunice, Lois and Timothy had been converted on Paul\'s former visit to Lystra. This conclusion is confirmed in <a onClick="return mV(\'2Ti\',3,11);">2Ti 3:11</a>, where Paul recalls to Timothy the fact that he had fully known the persecutions and afflictions which came to him at Lystra. The apostle repeats it, that Timothy knew what persecutions he then endured. Now this persecution occurred on Paul\'s first visit to that city. Eunice was therefore one of those who on that occasion became "disciples." And her faith in Christ, and her son\'s faith too, were genuine, and stood the test of the "much tribulation" of which Paul warned them (<a onClick="return mV(\'Act\',14,22);">Ac 14:22</a> the King James Version); and on Paul\'s next visit to Lystra, Eunice had the great joy and satisfaction of seeing how the apostle made choice of her son to be his companion in his missionary work. Eunice is not afterward mentioned in the New Testament; though it is a possible thing that there may be reference to her in what is said about widows and the children of widows in <a onClick="return mV(\'1Ti\',5,4,5);">1Ti 5:4-5</a>.``155';
isbe[3252]='Eunuch`u\'-nuk (caric; spadon; eunouchos):<P>Primarily and literally, a eunuch is an emasculated man (<a onClick="return mV(\'Deu\',23,1);">De 23:1</a>). The Hebrew word caric seems, however, to have acquired a figurative meaning, which is reflected in English Versions of the Bible where "officer" and "chamberlain" are found as renderings (compare <a onClick="return mV(\'Gen\',37,36);">Ge 37:36</a>; <a onClick="return mV(\'Gen\',39,1);">39:1</a>, where caric is applied to married men; <a onClick="return mV(\'Est\',4,4);">Es 4:4</a>). The barbarous practice of self-mutilation and the mutilation of others in this way was prevalent throughout the Orient. The religious disabilities under which men thus deformed labored under the Mosaic law had the effect of making the practice abominable to the Jews as a people (<a onClick="return mV(\'Deu\',23,1);">De 23:1</a>; <a onClick="return mV(\'Lev\',22,\'23-25\');">Le 22:23-25</a>). The law excluded eunuchs from public worship, partly because self-mutilation was often performed in honor of a heathen god, and partly because a maimed creature of any sort was deemed unfit for the service of Yahweh (<a onClick="return mV(\'Lev\',21,16);">Le 21:16</a>ff; <a onClick="return mV(\'Lev\',22,24);">22:24</a>). That ban, however, was later removed (<a onClick="return mV(\'Isa\',56,4,5);">Isa 56:4-5</a>). On the other hand, the kings of Israel and Judah followed their royal neighbors in employing eunuchs (1) as guardians of the harem (<a onClick="return mV(\'2Ki\',9,32);">2Ki 9:32</a>; <a onClick="return mV(\'Jer\',41,16);">Jer 41:16</a>), and (2) in military and other official posts (<a onClick="return mV(\'1Sa\',8,15);">1Sa 8:15</a> margin; <a onClick="return mV(\'1Ki\',22,9);">1Ki 22:9</a> margin; <a onClick="return mV(\'2Ki\',8,6);">2Ki 8:6</a> margin; <a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a> the King James Version margin; <a onClick="return mV(\'2Ki\',24,12,13);">2Ki 24:12-13</a> margin; <a onClick="return mV(\'2Ki\',25,19);">2Ki 25:19</a> margin; <a onClick="return mV(\'1Ch\',28,1);">1Ch 28:1</a> margin; <a onClick="return mV(\'2Ch\',18,8);">2Ch 18:8</a> margin; <a onClick="return mV(\'Jer\',29,2);">Jer 29:2</a>; <a onClick="return mV(\'Jer\',34,19);">34:19</a>; <a onClick="return mV(\'Jer\',38,7);">38:7</a>; compare <a onClick="return mV(\'Gen\',37,36);">Ge 37:36</a>; <a onClick="return mV(\'Gen\',40,2,7);">40:2, 7</a>; <a onClick="return mV(\'Act\',8,27);">Ac 8:27</a>). Josephus informs us that eunuchs were a normal feature of the courts of the Herods (Ant., XV, vii, 4; XVI, viii, 1). From the single reference to the practice in the Gospels (<a onClick="return mV(\'Mat\',19,12);">Mt 19:12</a>), we infer that the existence and purpose of eunuchs as a class were known to the Jews of Jesus\' time. There is no question with Jesus as to the law of Nature: the married life is the norm of man\'s condition, and the union thereby effected transcends every other natural bond, even that of filial affection (<a onClick="return mV(\'Mat\',19,5,6);">Mt 19:5-6</a>).<P>But He would have His hearers recognize that there are exceptional cases where the rule does not hold. In speaking of the three classes of eunuchs (<a onClick="return mV(\'Mat\',19,12);">Mt 19:12</a>), He made a distinction which was evidently well known to those whom He addressed, as was the metaphorical use of the word in application to the third class well understood by them (compare Lightfoot, Horae Hebrew et Talmud; Schottgen, Horae Hebrew, in the place cited.).<P>How Origen misunderstood and abused the teaching of this passage is well known (Euseb., HE, VI, 8), and his own pathetic comment on the passage shows that later he regretted having taken it thus literally and acted on it. His is not the only example of such a perverted interpretation (see Talmud, Shabbath 152a, and compare Midrash on <a onClick="return mV(\'Ecc\',10,7);">Ec 10:7</a>). The Council of Nicea, therefore, felt called on to deal with the danger as did the 2nd Council of Aries and the Apos Canons (circa 21). (Compare Bingham\'s Ant, IV, 9.)<P>It is significant that Jesus expresses no condemnation of this horrible practice. It was in keeping with His far-reaching plan of instilling principles rather than dealing in denunciations (<a onClick="return mV(\'Jhn\',3,17);">Joh 3:17</a>; <a onClick="return mV(\'Jhn\',8,11);">8:11</a>). It was by His positive teaching concerning purity that we are shown the lines along which we must move to reach the goal. There is a more excellent way of achieving mastery of the sexual passion. It is possible for men to attain as complete control of this strong instinct as if they were physically sexless, and the resultant victory is of infinitely more value than the negative, unmoral condition produced by self-emasculation. These "make themselves eunuchs" with a high and holy purpose, "for the kingdom of heaven\'s sake"; and the interests created by that purpose are so absorbing that neither time nor opportunity is afforded to the "fleshly lusts, which war against the soul" (<a onClick="return mV(\'1Pe\',2,11);">1Pe 2:11</a>). They voluntarily forego marriage even, undertake virtual "eunuchism" because they are completely immersed in and engrossed by "the kingdom of heaven" (compare <a onClick="return mV(\'Jhn\',17,4);">Joh 17:4</a>; <a onClick="return mV(\'1Cr\',7,29,33);">1Co 7:29, 33</a>f; <a onClick="return mV(\'1Cr\',9,5);">9:5</a> and see Bengel, Gnomon Novi Test. in the place cited and Clement of Alexandria., Strom., iii.1ff).<P>LITERATURE.<P>Driver," Deuteronomy," ICC, <a onClick="return mV(\'Deu\',23,1);">De 23:1</a>; Commentary on Matthew, in the place cited. by Morison and Broadus; Neander, Ch. Hist, II, 493; Wendt, The Teaching of Jesus, 72ff; The Expositor, IV, vii (1893), 294ff; Encyclopedia Brit, article "Eunuch."`<a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>`47';
isbe[3253]='Euodia`u-o\'-di-a (Euodia, literally, "prosperous journey)."<P>1. Women Prominent in Church at Philippi:<P>The Textus Receptus of the New Testament of Stephen reads Euodia, which means "fragrant," <a onClick="return mV(\'Phl\',4,2);">Php 4:2</a>. King James Version has transformed Euodia into Euodias, which is a man\'s name. The mistake is rectified in the Revised Version (British and American): A Christian woman, one of the members of the church in Philippi. She and Syntyche, who is named in the same verse, were evidently persons of note, prominent in the work of the church there. At Philippi the gospel was first preached to women <a onClick="return mV(\'Act\',16,13);">Ac 16:13</a>, and the church was first formed among women—evidently in the house of Lydia <a onClick="return mV(\'Act\',16,15,40);">Ac 16:15, 40</a>. Paul here makes a request of Euodia and Syntyche. He requests—the word is never used of prayer from us to God—he asks, he beseeches. Euodia, and then he repeats the word, he beseeches Syntyche, to be of the same mind in the Lord. Possibly, as Lightfoot suggests, they may have been deaconesses in the Philippian church, but whatever their position in this respect may have been, differences had arisen between them on some subject, we know not what.<P>2. The Difference Which Arose:<P>But whatever the subject in dispute was, it had become so serious that, instead of the breach being healed, matters had become chronic; and news regarding this lack of forbearance between Euodia and Syntyche had been carried to Paul in his captivity in Rome.<P>3. Paul Entreats Them:<P>The state of Christian life in the church at Philippi gave Paul almost unmingled satisfaction. He regarded with joy their faith and steadfastness and liberality. There was no false teaching, no division; among them. The only thing which could cause him any uneasiness was the want of harmony between Euodia and Syntyche. He beseeches them to give up their differences, and to live at peace in the Lord. Such is the motive which he puts before them with a view to bring about their reconciliation; to live in dispute and enmity is not worthy of those who are "in the Lord," who have been redeemed by the Lord, and whose whole life should be an endeavor to please Him.<P>4. The True Yokefellow:<P>Paul proceeds to ask a certain person, unnamed, but whom he terms "true yokefellow" to assist them, that is, to assist Euodia and Syntyche; for each of them, he says, "labored with me in the gospel." It is uncertain what is meant by "true yokefellow." He may refer to Epaphroditus, who carried the epistle from Rome to Philippi. Other names have been suggested—Luke, Silas, Timothy. It has been thought by some that Paul here refers to his own wife, or to Lydia. But such a suggestion is untenable, inasmuch as we know from his own words (<a onClick="return mV(\'1Cr\',7,8);">1Co 7:8</a>) that he was either unmarried or a widower. And the idea that the "true yokefellow" is Lydia, is equally wrong, because the word "true" is in the Greek masculine Another suggestion is that "yokefellow" is really a proper name—Syzygus. If so, then the apostle addresses Syzygus; or if this is not so, then he speaks to the unnamed "true yokefellow"; and what he says is that he asks him to help Euodia and Syntyche, inasmuch as their work in the gospel was no new thing. Far from this, when Paul brought the gospel to Philippi at the first, these two Christian women had been his loyal and earnest helpers in spreading the knowledge of Christ.<P>5. The Plea for Reconciliation:<P>How very sad then that any difference should exist between them; how sad that it should last so long! He asks Clement also, and all the other Christians at Philippi, his fellow-laborers, whose names, though not mentioned by the apostle, are nevertheless in the book of life, to assist Euodia and Syntyche; he asks them all to aid in this work of reconciliation. Doubtless he did not plead in vain.`<a href="./study/isbe/search.html?string=SYNTYCHE">SYNTYCHE</a>; <a href="./study/isbe/search.html?string=YOKE-FELLOW">YOKE-FELLOW</a>`155';
isbe[3254]='Eupator`u\'-pa-tor (Eupator, "of noble father"):<P>The name given to Antiochus V who had succeeded his father Antiochus IV (Epiphanes), 164 BC, while still a child under the guardianship of Lysias (1Macc 3:32; 6:17). In the absence of Philip, a friend and foster-brother of the child\'s father, whom on his deathbed he had appointed guardian for his son, Lysias continued his duty as guardian, set the king upon the throne and named him Eupator. Shortly after his accession he collected a large army and marched against Jerusalem, accompanied by Lysias, for the relief of a Syrian garrison that was hard pressed by Judas Maccabeus (1Macc 6:19ff). Judas was repulsed at Bethzacharias and after a severe struggle Bethsura was captured (1Macc 6:31-50). The Jewish force in the temple was hard pressed and indeed reduced to the last extremity (1Macc 6:53), when Lysias, hearing that his rival Philip had returned from Persia and had made himself master of Antioch (Josephus, Ant, XII, ix, 5f), made a hasty peace and returned to meet Philip, whom he easily overpowered. In the following year (162 BC) Antiochus and Lysias were put to death by Demetrius Soter, son of Seleucus, in requital of wrongs inflicted upon himself by Antiochus Epiphanes (1Macc 7:2-4; 2Macc 14:1,2; Josephus, Ant, XII, x, 1).``79';
isbe[3255]='Euphrates`u-fra\'-tez (perath; Euphrates, "the good and abounding river"):<P>The longest (1,780 miles) and most important stream of Western Asia, generally spoken of in the Old Testament as "the river" (<a onClick="return mV(\'Exd\',23,31);">Ex 23:31</a>; <a onClick="return mV(\'Deu\',11,24);">De 11:24</a>).<P>Its description naturally falls into 3 divisions—the upper, middle and lower. The upper division traverses the mountainous plateau of Armenia, and is formed by the junction of 2 branches, the Frat and the Murad. The Frat rises 25 miles Northeast of Erzerum, and only 60 miles from the Black Sea. The Murad, which, though the shorter, is the larger of the two, rises in the vicinity of Mt. Ararat. After running respectively 400 and 270 miles in a westerly direction, they unite near Keban Maaden, whence in a tortuous channel of about 300 miles, bearing still in a southwesterly direction, the current descends in a succession of rapids and cataracts to the Syrian plain, some distance above the ancient city of Carchemish, where it is only about 200 miles from the Northeast corner of the Mediterranean. In its course through the Armenian plateau, the stream has gathered the sediment which gives fertility to the soil in the lower part of the valley. It is the melting snows from this region which produce the annual floods from April to June.<P>The middle division, extending for about 700 miles to the bitumen wells of Hit, runs southeast "through a valley of a few miles in width, which it has eroded in the rocky surface, and which, being more or less covered with alluvial soil, is pretty generally cultivated by artificial irrigation....Beyond the rocky banks on both sides is the open desert, covered in spring with a luxuriant verdure, and dotted here and there with the black tent of the Bedouin" (Sir Henry Rawlinson). Throughout this portion the river formed the ancient boundary between the Assyrians and Hittites whose capital was at Carchemish, where there are the remains of an old bridge. The ruins of another ancient bridge occur 200 miles lower down at the ancient Thapsacus, where the Greeks forded it under Cyrus the younger. Throughout the middle section the stream is too rapid to permit of successful navigation except by small boats going downstream, and has few and insignificant tributaries. It here has, however, its greatest width (400 yds.) and depth. Lower down the water is drawn off by irrigating canals and into lagoons.<P>The fertile plain of Babylonia begins at Hit, about 100 miles above Babylon; 50 miles below Hit the Tigris and Euphrates approach to within 25 miles of each other, and together have in a late geological period deposited the plain of Shinar or of Chaldea, more definitely referred to as Babylonia. This plain is about 250 miles long, and in its broadest place 100 miles wide. From Hit an artificial canal conducts water along the western edge of the alluvial plain to the Persian Gulf, a distance of about 500 miles. But the main irrigating canals put off from the east side of the Euphrates, and can be traced all over the plain past the ruins of Accad, Babylon, Nippur, Bismya, Telloh, Erech, Ur and numerous other ancient cities. Originally the Euphrates and Tigris entered into the Persian Gulf by separate channels. At that time the Gulf extended up as far as Ur, the home of Abraham, and it was a seaport. The sediment from these rivers has filled up the head of the Persian Gulf for nearly 100 miles since the earliest monumental records. Loftus estimates that since the Christian era the encroachment has proceeded at the rate of 1 mile in 70 years. In early times Babylonia was rendered fertile by immense irrigating schemes which diverted the water from the Euphrates, which at Babylon is running at a higher level than the Tigris. A large canal left the Euphrates just above Babylon and ran due east to the Tigris, irrigating all the intervening region and sending a branch down as far south as Nippur. Lower down a canal crosses the plain in an opposite direction. This ancient system of irrigation can be traced along the lines of the principal canals "by the winding curves of layers of alluvium in the bed," while the lateral channels "are hedged in by high banks of mud, heaped up during centuries of dredging. Not a hundredth part of the old irrigation system is now in working order. A few of the mouths of the smaller canals are kept open so as to receive a limited supply of water at the rise of the river in May, which then distributes itself over the lower lying lands in the interior, almost without labor on the part of the cultivators, giving birth in such localities to the most abundant crops; but by far the larger portion of the region between the rivers is at present an arid, howling wilderness, strewed in the most part with broken pottery, the evidence of former human habitation, and bearing nothing but the camel thorn, the wild caper, the colocynth-apple, wormwood and the other weeds of the desert" (Rawlinson). According to Sir W. Willcocks, the eminent English engineer, the whole region is capable of being restored to its original productiveness by simply reproducing the ancient system of irrigation. There are, however, in the lower part of the region, vast marshes overgrown with reeds, which have continued since the time of Alexander who came near losing his army in passing through them. These areas are probably too much depressed to be capable of drainage. Below the junction of the Euphrates and the Tigris, the stream is called Shat el Arab, and is deep enough to float war vessels.<P>LITERATURE.<P>Fried. Delitzsch, Wo lag das Paradies? 169f; Chesney, Narrative of the Euphrates Exped., I; Loftus, Travels, etc., in Chaldoea and Susiana; Layard, Nineveh and Babylon, chapters xxi, xxii; Rawlinson, Herodotus, I, essay ix; Ellsworth Huntington, "Valley of the Upper Euphrates River," Bull. Amer. Geog. Soc., XXXIV, 1902.``198';
isbe[3256]='Eupolemus`u-pol\'-e-mus (Eupolemos):<P>Son of John, the son of Accos = Hakkoz (Akkos; <a onClick="return mV(\'Neh\',3,4,21);">Ne 3:4, 21</a>, etc.); was one of the two deputies sent by Judas Maccabeus (1Macc 8:17; 2Macc 4:11) to Rome circa 161 BC to ask the help of the Romans against Demetrius. A critical estimate of the narrative (1Macc 8 and Josephus, Ant, XII, x, 6) of the first meeting of the representatives of the Jewish nation and the Romans will be found in Stanley, Lectures on the History of the Jewish Church, III, 350ff, where it is admitted that "inaccuracies of detail only confirm the general faithfulness of the impression." Keil (Comm., 14) further remarks on this point: "that the author of 1Macc wrote from twenty to twenty-five years after the destruction of Corinth (146 BC) by the Romans; and that the Jews of Palestine were not accurately informed concerning the wars of the Romans with the Greeks." Eupolemus has been identified with the historian of the same name quoted by Eusebius (Praep. Ev., IX, 17ff); but there is no evidence that the historian was of Jewish origin.``79';
isbe[3257]='Euraquilo`u-rak\'-wi-lo (the Revised Version (British and American) eurakulon; the King James Version eurokludon; the King James Version Euroclydon, u-rok\'-li-don):<P>The east or northeast wind which drove Paul\'s ship to shipwreck at Melita (<a onClick="return mV(\'Act\',27,14);">Ac 27:14</a>). The term seems to have been the sailor\'s term for that particular wind, and Paul uses the word which was used by them on that occasion. The difference in the text is explained by the fact that the term was not in general use and was therefore subject to being changed. The precise name is doubtful, but "the Euraquilo" is more easily explained as a compound of Greek euros, "east wind," and Latin aquilo, "northeast wind," hence, euraquilo, "east northeast wind." This agrees with the experience of navigators in those waters. For a summary of the various readings see Sanday, Appendices ad New Testament, 140. Full discussion of the circumstances are given in the Lives of Paul by various writers.``85';
isbe[3258]='Eutychus`u\'-ti-kus (Eutuchos, "fortunate"):<P>The story of Eutychus occurs in the "we" section of Acts, and is therefore related by an eyewitness of the incidents (<a onClick="return mV(\'Act\',20,\'7-12\');">Ac 20:7-12</a>). On the first day of the week the Christians of Troas had met for an evening service in an upper chamber, and were joined by Paul and his company. As he was to leave in the morning, Paul "prolonged his speech until midnight." A youth named Eutychus, who was sitting at the open window, became borne down with sleep owing to the lateness of the hour, and ultimately fell through the opening from the third story. He "was taken up dead." This direct statement is evaded by De Wette and Olshausen, who translate "for dead." Meyer says this expresses the judgment of those who took him up. However, Luke, the physician, is giving his verdict, and he plainly believes that a miracle was wrought by Paul in restoring a corpse to life. The intention of Luke in relating this incident is to relate a miracle. Paul went down and embraced the youth while comforting the lamenting crowd, "Make ye no ado; for his life is in him." The interrupted meeting was resumed, the bread was broken, and the conversation continued till break of day. "And they brought the lad alive, and were not a little comforted."``78';
isbe[3259]='Evangelist`e-van\'-jel-ist:<P>This is a form of the word ordinarily translated "gospel" (euaggelion), except that here it designates one who announces that gospel to others (euaggelistes, "a bringer of good tidings"), literally, God Himself is an evangelist, for He "preached the gospel beforehand unto Abraham" (<a onClick="return mV(\'Gal\',3,8);">Ga 3:8</a>); Jesus Christ was an evangelist, for He also "preached the gospel" (<a onClick="return mV(\'Luk\',20,1);">Lu 20:1</a>); Paul was an evangelist as well as an apostle (<a onClick="return mV(\'Rom\',1,15);">Ro 1:15</a>); Philip the deacon was an evangelist (<a onClick="return mV(\'Act\',21,8);">Ac 21:8</a>); and Timothy, the pastor (<a onClick="return mV(\'2Ti\',4,5);">2Ti 4:5</a>); and indeed all the early disciples who, on being driven out of Jerusalem, "went everywhere preaching the word" (<a onClick="return mV(\'Act\',8,4);">Ac 8:4</a> the King James Version).<P>But <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a> teaches that one particular order of the ministry, distinguished from every other, is singled out by the Head of the church for this work in a distinctive sense. All may possess the gift of an evangelist in a measure, and be obligated to exercise its privilege and duty, but some are specially endued with it. "He gave some to be apostles; and some, prophets; and some, evangelists; and some, pastors and teachers." It will be seen that as an order in the ministry, the evangelist precedes that of the pastor and teacher, a fact which harmonizes with the character of the work each is still recognized as doing. The evangelist has no fixed place of residence, but moves about in different localities, preaching the gospel to those ignorant of it before. As these are converted and united to Jesus Christ by faith, the work of the pastor and teacher begins, to instruct them further in the things of Christ and build them up in the faith.<P>At a later time, the name of "evangelist" was given the writers of the four Gospels because they tell the story of the gospel and because the effect of their promulgation at the beginning was very much like the work of the preaching evangelist. In character, the Gospels bear something of the same relation to the Epistles as evangelists bear to pastors and teachers.``69';
isbe[3260]='Eve in the New Testament`(Eua; Westcott and Hort, The New Testament in Greek, Heua):<P>"Eve" occurs twice in the New Testament and both references are in the Pauline writings. In <a onClick="return mV(\'1Ti\',2,\'12-14\');">1Ti 2:12-14</a> woman\'s place in teaching is the subject of discussion, and the writer declares that she is a learner and not a teacher, that she is to be in quietness and not to have dominion over a man. Paul elsewhere expressed this same idea (see <a onClick="return mV(\'1Cr\',14,34,35);">1Co 14:34-35</a>). Having stated his position in regard to woman\'s place, he used the Genesis account of the relation of the first woman to man to substantiate his teaching. Paul used this account to illustrate woman\'s inferiority to man, and he undoubtedly accepted it at its face value without any question as to its historicity. He argued that woman is inferior in position, for "Adam was first formed, then Eve." She is inferior in character, for "Adam was not beguiled, but the woman being beguiled hath fallen into transgression."<P>See <a href="./study/isbe/search.html?string=CHILD-BEARING">CHILD-BEARING</a>.<P>In <a onClick="return mV(\'2Cr\',11,3);">2Co 11:3</a>, Paul is urging loyalty to Christ, and he uses the temptation of Eve to illustrate the ease with which one is corrupted. Paul seems to have had no thought but that the account of the serpent\'s beguiling Eve should be taken literally.``62';
isbe[3261]='Eve in the Old Testament`ev, (chawwah, "life"; Eua; the name given, as the Scripture writer says, <a onClick="return mV(\'Gen\',3,20);">Ge 3:20</a> (Zoe), from her unique function as "the mother of all living"):<P>The first created woman; created secondarily from Adam (or man) as a "help meet for him" (<a onClick="return mV(\'Gen\',2,\'18-22\');">Ge 2:18-22</a>), and later named and designated as the mother of the human race.<P>For the literary type and object of the story of Eve, see under <a href="./study/isbe/search.html?string=ADAM">ADAM, i, 2</a>.<P>1. The Names Given to Her:<P>Two names are given to her, both bestowed by the man, her mate. The first, ishshah, "woman" (literally, "man-ess"), is not strictly a name but a generic designation, referring to her relation to the man; a relation she was created to fulfill in default of any true companionship between man and the beasts, and represented as intimate and sacred beyond that between child and parents (<a onClick="return mV(\'Gen\',2,\'18-24\');">Ge 2:18-24</a>). The second, Eve, or "life," given after the transgression and its prophesied results, refers to her function and destiny in the spiritual history or evolution of which she is the beginning (<a onClick="return mV(\'Gen\',3,16,20);">Ge 3:16, 20</a>). While the names are represented as bestowed by the man, the remarks in <a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a> and <a onClick="return mV(\'Gen\',3,20);">3:20b</A> may be read as the interpretative addition of the writer, suited to the exposition which it is the object of his story to make.<P>2. Her Relation to Man:<P>As mentioned in the article <a href="./study/isbe/search.html?string=ADAM">ADAM</a>, the distinction of male and female, which the human species has in common with the animals, is given in the general (or P) account of creation (<a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a>); and then, in the more particularized (or J) account of the creation of man, the human being is described at a point before the distinction of sex existed. This second account may have a different origin, but it has also a different object, which does not conflict with but rather supplements the other. It aims to give the spiritual meanings that inhere in man\'s being; and in this the relation of sex plays an elemental part. As spiritually related to the man-nature, the woman-nature is described as derivative, the helper rather than the initiator, yet equal, and supplying perfectly the man\'s social and affectional needs. It is the writer\'s conception of the essential meaning of mating and marriage. To bring out its spiritual values more clearly he takes the pair before they are aware of the species meanings of sex or family, while they are "naked" yet "not ashamed" <a onClick="return mV(\'Gen\',2,25);">Ge 2:25</a>, and portrays them purely as companions, individual in traits and tendencies, yet answering to each other. She is the helpmeet for him (ezer keneghdo, "a help answering to him").<P>3. Her Part in the Change of Condition:<P>True to her nature as the being relatively acted upon rather than acting, she is quicker than the man to respond to the suggestion initiated by the serpent and to follow it out to its desirable results. There is eagerness of desire in her act of taking the fruit quite different from the quasi matter-of-course attitude of the man. To her the venture presents itself wholly from the alluring side, while to him it is more like taking a desperate risk, as he detaches himself even from the will of God in order to cleave to her. All this is delicately true to the distinctive feminine and masculine natures. A part of her penalty is henceforth to be the subordinated one of the pair (<a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>), as if for her the values of life were to be mediated through him. At the same time it is accorded to her seed to perpetuate the mortal antipathy to the serpent, and finally to bruise the serpent\'s head (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>).<P>4. In Subsequent History:<P>After these opening chapters of Genesis, Eve is not once mentioned, nor even specifically alluded to, in the canonical books of the Old Testament. It was not in the natural scope of Old Testament history and doctrine, which were concerned with Abraham\'s descendants, to go back to so remote origins as are narrated in the story of the first pair. The name Eve occurs once in the Apocrypha, in the prayer of Tobit (Tobit 8:6): "Thou madest Adam, and gavest him Eve his wife for a helper and a stay; of them came the seed of men"; the text then going on to quote <a onClick="return mV(\'Gen\',2,18);">Ge 2:18</a>. In 1Esdras 4:20,21 there is a free quotation, or rather paraphrase, of <a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a>. But not even in the somber complaints of 2Esdras concerning the woe that Adam\'s transgression brought upon the race (see under <a href="./study/isbe/search.html?string=ADAM+IN+THE+OLD+TESTAMENT">ADAM IN THE OLD TESTAMENT, iii, 2</a>) is there any hint of Eve\'s part in the matter.``66';
isbe[3262]='Eve, Gospel of`A Gnostic doctrinal treatise mentioned by Epiphanius (Haer., xxvi.2ff) in which Jesus is represented as saying in a loud voice, "I am thou, and thou art I, and wherever thou art there am I, and in all things I am sown. And from whencesoever thou gatherest me, in gathering me thou gatherest thyself."<P>Compare Ropes, Die Spruche Jesu, 56.`<a href="./study/isbe/search.html?string=LOGIA">LOGIA</a>`1';
isbe[3263]='Even; Evening; Eventide`e\'-v\'-n, ev\'-ning, ev-\'-n-tid\' ("even," "evening," \'erebh; opsia, opse; see Thayer under the word):<P>The words are used in slightly different meanings:<P>(1) The time of sunset, the beginning of the Hebrew day, as in <a onClick="return mV(\'Lev\',15,\'1-\');">Le 15</a>, where directions are given for the removal of uncleanness, which took place at sunset.<P>(2) Twilight, the time of approaching darkness when lamps are lighted; <a onClick="return mV(\'Exd\',30,8);">Ex 30:8</a> (literally, "between the two evenings"); <a onClick="return mV(\'Jer\',6,4);">Jer 6:4</a> ("the shadows of the evening").<P>(3) The early part of the night (<a onClick="return mV(\'Pro\',7,9);">Pr 7:9</a>; <a onClick="return mV(\'Eze\',12,7);">Eze 12:7</a>).<P>The Greek opse is literally, "late" (<a onClick="return mV(\'Mar\',11,19);">Mr 11:19</a>). The Greek hespera, refers evidently to sunset, in <a onClick="return mV(\'Luk\',24,29);">Lu 24:29</a>. "Eventide," \'eth \'erebh, "time of evening" (<a onClick="return mV(\'2Sa\',11,2);">2Sa 11:2</a>; <a onClick="return mV(\'Isa\',17,14);">Isa 17:14</a>). "Evening," used in connection with wolves (<a onClick="return mV(\'Jer\',5,6);">Jer 5:6</a>; <a onClick="return mV(\'Zep\',3,3);">Ze 3:3</a>), is from the Hebrew [\'arabhah], which may mean "darkness" or "dark cloud," but more probably "plain" or "desert."``138';
isbe[3264]='Evenings, Between the`The time of day (the Revised Version (British and American) reads "at even," margin, "between the two evenings") when the Passover lamb was slain (<a onClick="return mV(\'Exd\',12,6);">Ex 12:6</a>; <a onClick="return mV(\'Num\',9,3);">Nu 9:3</a>), or the offering made of the evening portion of the continual burnt offering (<a onClick="return mV(\'Num\',28,4);">Nu 28:4</a>).`<a href="./study/isbe/search.html?string=EVEN;+EVENING;+EVENTIDE"</a>; EVEN; EVENING; EVENTIDE</a>`1';
isbe[3265]='Event`e-vent\':<P>In <a onClick="return mV(\'Ecc\',2,14);">Ec 2:14</a>; <a onClick="return mV(\'Ecc\',9,2,3);">9:2-3</a>, the translation of miqreh, "what happens," "lot," "fate." The English word bore this sense at the time of the King James Version. The meaning of "result," "outcome" ekbaseis, attaches to it in The <span class="noTag">Wisdom of Solomon 8:8</span>, "events of seasons," the Revised Version (British and American) "issues."``1';
isbe[3266]='Everlasting`ev-er-last\'-ing (olam, \'adh; aidios, aionios):<P>"Everlasting," in strictness, is that which endures forever; either that which has no beginning and will have no end (in which sense it is applicable to God only), or that which, having a beginning, will have no end, but henceforth will exist forever (thus of beings created for immortality; see <a href="./study/isbe/search.html?string=IMMORTALITY">IMMORTALITY</A>). Figuratively also the term is applied to objects of impressive stability and long duration, as mountains, hills (eg. <a onClick="return mV(\'Gen\',49,26);">Ge 49:26</a>; <a onClick="return mV(\'Hab\',3,6);">Hab 3:6</a>).<P>Of the terms indicated as rendered by this word, \'olam in the Old Testament and aionios in the New Testament, literally, "age-long," generally bear the full sense of "eternal" (always as applied to God, His mercy, His covenant, His kingdom and to the eternal life of believers). Hence, in the Revised Version (British and American) the rendering "everlasting" in the King James Version is, in the New Testament, uniformly changed to "eternal" (eg. <a onClick="return mV(\'Mat\',18,8);">Mt 18:8</a>; <a onClick="return mV(\'Mat\',25,41,46);">25:41, 46</a>; <a onClick="return mV(\'Luk\',16,9);">Lu 16:9</a>; <a onClick="return mV(\'Luk\',18,30);">18:30</a>; <a onClick="return mV(\'Jhn\',3,16,36);">Joh 3:16, 36</a>, etc.; <a onClick="return mV(\'Act\',13,46);">Ac 13:46</a>; <a onClick="return mV(\'Rom\',6,22);">Ro 6:22</a>; <a onClick="return mV(\'Rom\',16,26);">16:26</a>; <a onClick="return mV(\'Gal\',6,8);">Ga 6:8</a>; <a onClick="return mV(\'Hbr\',13,20);">Heb 13:20</a>). In the Old Testament the rendering "everlasting" is usually retained in the Revised Version (British and American), and sometimes takes the place of other words or phrases, as "lasting" (<a onClick="return mV(\'Deu\',33,15);">De 33:15</a>), "ever," "forever" (<a onClick="return mV(\'1Ch\',16,36);">1Ch 16:36</a>; <a onClick="return mV(\'Neh\',9,5);">Ne 9:5</a>), "perpetual" (<a onClick="return mV(\'Hab\',3,6);">Hab 3:6</a>; <a onClick="return mV(\'Jer\',50,5);">Jer 50:5</a>), "of old" (<a onClick="return mV(\'Hab\',3,6);">Hab 3:6</a> margin). In <a onClick="return mV(\'Psa\',100,5);">Ps 100:5</a>; <a onClick="return mV(\'Psa\',119,144);">119:144</a>, on the other hand, the Revised Version (British and American) changes the word to "for ever." In much the larger number of places \'olam is translated "ever" or "for ever."<P>The word \'adh, in the two cases in which it is translated "everlasting" in the King James Version (more frequently "for ever"), is in the Revised Version (British and American), in <a onClick="return mV(\'Isa\',9,6);">Isa 9:6</a>, retained, with margin, "Father of Eternity," and in <a onClick="return mV(\'Hab\',3,6);">Hab 3:6</a> is changed into "eternal." Another word, qedhem, with the meaning "ancient time," is rendered "everlasting" in <a onClick="return mV(\'Hab\',1,12);">Hab 1:12</a> ("Art not thou from everlasting?"). With the same meaning it occurs in <a onClick="return mV(\'Deu\',33,27);">De 33:27</a>, "The eternal God is thy dwelling-place."<P>The word which strictly answers to "everlasting" in the New Testament is aidios (<a onClick="return mV(\'Rom\',1,20);">Ro 1:20</a>; <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a>), rendered by the King James Version in the former passages "eternal," but correctly by the Revised Version (British and American) in both passages, "everlasting." The sense of the word "everlasting," in application to future punishment, is considered in the article <a href="./study/isbe/search.html?string=PUNISHMENT,+EVERLASTING">PUNISHMENT, EVERLASTING</a>.<P>The term "everlasting" or "eternal," applied to God, describes Him as filling, or enduring through, all the "ages" of time. It is only thus that we can symbolically represent eternity. In reality, however, the eternity of God is not simply His filling of ever-flowing "ages," but rather that aspect of His being in which He is above time; for which time (the succession-form of existence) does not exist; to which the terms past, present and future do not apply. Yet, while God is not in time (rather holds time in Himself), time-sequence, as the form of existence of the world, is a reality for God.`<a href="./study/isbe/search.html?string=ETERNAL">ETERNAL</a>; <a href="./study/isbe/search.html?string=ETERNITY">ETERNITY</a>`132';
isbe[3267]='Evi`e\'-vi (\'ewi, "desire"; Euei):<P>One of the five kings, or chiefs of the Midianites, slain by Israel during their sojourn in the plains of Moab (<a onClick="return mV(\'Num\',31,8);">Nu 31:8</a>; <a onClick="return mV(\'Jos\',13,21);">Jos 13:21</a>).``1';
isbe[3268]='Evidence; Evident; Evidently`ev\'-i-dens, ev\'-i-dent-li cepher; elegchos, phaneros:<P>In <a onClick="return mV(\'Jer\',32,10,11,12,14,16,44);">Jer 32:10-12, 14, 16, 44</a>, cepher, "a writing," is translated (the King James Version) "evidence" (of the purchase of the field in Anathoth), the Revised Version (British and American) "deed"; "evidence" is also the translation of elegchos, "conviction," in the King James Version of <a onClick="return mV(\'Hbr\',11,1);">Heb 11:1</a>, "Now faith is...the evidence of things not seen," the English Revised Version "proving," margin, "or test," better, as the American Standard Revised Version, "conviction," margin, "or test." The Greek word denotes "putting to the test," examining for the purpose of proof, bringing to conviction (Dr. W. F. Moulton). Thus if "test" or "proving" be adopted, a firm conviction of the reality of things not seen is implied as the result of putting to the proof. Trench remarks (New Testament Synonyms), "in juristic Greek elegchein is not merely to reply to, but to refute, an opponent." Hence, the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) translation argumentum, followed by Wyclif and Rheims version; Tyndale and Cranmer have "certayntie." (The sense of "conviction" appears in <a onClick="return mV(\'Jhn\',8,46);">Joh 8:46</a>, "Which of you convinceth (elegchei, the Revised Version (British and American) "convicteth") me of sin?"; <a onClick="return mV(\'Jhn\',3,20);">Joh 3:20</a>, "reproved," the Revised Version, margin "convicted"; <a onClick="return mV(\'Jhn\',16,8);">Joh 16:8</a> the King James Version "He will reprove the world of sin," the Revised Version (British and American) "convict." Compare <a onClick="return mV(\'1Cr\',14,24);">1Co 14:24</a>.) "Evident" is the translation of \'al panim ("on the face") in <a onClick="return mV(\'Job\',6,28);">Job 6:28</a>, the King James Version "Look upon me; for it is evident unto you if I lie," margin, "Hebrew before your face," the Revised Version (British and American) "to your face," margin, "And it will be evident unto you if I lie," which is, perhaps, to be preferred to the text; delos, "manifest," is translated "evident" (<a onClick="return mV(\'Gal\',3,11);">Ga 3:11</a>); katadelos, "very manifest," is in <a onClick="return mV(\'Hbr\',7,15);">Heb 7:15</a>, the King James Version "far more evident," the Revised Version (British and American) "more abundantly evident"; prodelos, "manifest before-hand" (<a onClick="return mV(\'Hbr\',7,14);">Heb 7:14</a>), "evident." "Evidently" occurs only in <a onClick="return mV(\'Act\',10,3);">Ac 10:3</a>, as the translation of phaneros, "openly," "manifestly," the Revised Version (British and American) "openly."<P>It is important to note the true nature of faith according to the correct translation of <a onClick="return mV(\'Hbr\',11,1);">Heb 11:1</a>, as being the well-grounded and assured conviction of things not seen.``185';
isbe[3269]='Evil`ev\'-\'-l, e\'-vil ra\'; poneros, kakos, kakon:<P>In the Bible it is represented as moral and physical. We choose to discuss the subject under these heads. Many of the evils that come upon men have not been intended by those who suffer for them. Disease, individual and national calamity, drought, scarcity of food, may not always be charged to the account of intentional wrong. Many times the innocent suffer with, and even for, the guilty. In such cases, only physical evil is apparent. Even when the suffering has been occasioned by sin or dereliction of duty, whether the wrong is active or passive, many, perhaps the majority of those who are injured, are not accountable in any way for the ills which come upon them. Neither is God the author of moral evil. "God cannot be tempted with evil, and he himself tempteth no man" (<a onClick="return mV(\'Jam\',1,13);">Jas 1:13</a>).<P>1. Moral Evil:<P>By this term we refer to wrongs done to our fellowman, where the actor is responsible for the action. The immorality may be present when the action is not possible. "But if that evil servant shall say in his heart" (<a onClick="return mV(\'Mat\',24,48,49);">Mt 24:48-49</a>), whether he shall smite his fellow-servants or not, the moral evil is present. See <a href="./study/isbe/search.html?string=SIN+(1)">SIN</A>. "All these evil things proceed from within, and defile the man" (<a onClick="return mV(\'Mar\',7,\'21-23\');">Mr 7:21-23</a>). The last six commandments of the Decalogue apply here (<a onClick="return mV(\'Exd\',20,\'12-17\');">Ex 20:12-17</a>). To dishonor one\'s parents, to kill, to commit adultery, to steal, to bear false witness and to covet are moral evils. The spiritual import of these commandments will be found in <a onClick="return mV(\'Mat\',5,21,22,27,28);">Mt 5:21-22, 27-28</a>. "But if thine eye be evil, thy whole body shall be full of darkness" (<a onClick="return mV(\'Mat\',6,23);">Mt 6:23</a>). Words and deeds are coined in the heart before the world sees or hears them (<a onClick="return mV(\'Mat\',12,34,35);">Mt 12:34-35</a>). The word ought or its equal may be found in all languages; hence, it is in the mind of all people as well as in our laws that for the deeds and words we do and speak, we are responsible. "Break off thy sins by righteousness" (<a onClick="return mV(\'Dan\',4,27);">Da 4:27</a>) shows that, in God\'s thought, it was man\'s duty, and therefore within his power, to keep the commandment. "Wash you, make you clean; put away the evil of your doings from before mine eyes; cease to do evil; learn to do well" (<a onClick="return mV(\'Isa\',1,16);">Isa 1:16</a>f). We cannot think of God commanding men to do what He knew they had no ability to do! God has a standing offer of pardon to all men who turn from their evil ways and do that which is right (<a onClick="return mV(\'Eze\',33,\'11-14\');">Eze 33:11-14</a>f). Evil begins in the least objectionable things. In <a onClick="return mV(\'Rom\',1,\'18-23\');">Ro 1:18-23</a>, we have Paul\'s view of the falling away of the Gentiles. "Knowing God" (verse <a onClick="return mV(\'Rom\',1,21);">21</a>), they were "without excuse" (verse <a onClick="return mV(\'Rom\',1,20);">20</a>), but "glorified him not as God, neither gave thanks; but became vain in their reasonings, and their senseless heart was darkened" (verse <a onClick="return mV(\'Rom\',1,21);">21</a>). "Professing themselves to be wise, they became fools" (verse <a onClick="return mV(\'Rom\',1,22);">22</a>). This led the way into idolatry, and that was followed by all the corruption and wrongdoing to be instigated by a heart turned away from all purity, and practiced in all the iniquity to be suggested by lust without control. Paul gives fifteen steps in the ladder on which men descend into darkness and ruin (<a onClick="return mV(\'Gal\',5,\'19-21\');">Ga 5:19-21</a>). When men become evil in themselves, they necessarily become evil in thought and deed toward others. This they bring upon themselves, or give way to, till God shall give "them up unto a reprobate mind, to do those things which are not fitting" (<a onClick="return mV(\'Rom\',1,28);">Ro 1:28</a>). Those thus fallen into habits of error, we should in meekness correct, that "they may recover themselves out of the snare of the devil, having been taken captive by him unto his will" (<a onClick="return mV(\'2Ti\',2,25,26);">2Ti 2:25-26</a>).<P>2. Physical Evil:<P>Usually, in the Old Testament the Hebrew word ra\' is employed to denote that which is bad. Many times the bad is physical; it may have been occasioned by the sins for which the people of the nation were responsible, or it may have come, not as a retribution, but from accident or mismanagement or causes unknown. Very many times the evil is a corrective, to cause men to forsake the wrong and accept the right. The flood was sent upon the earth because "all flesh had corrupted their way" (<a onClick="return mV(\'Gen\',6,12);">Ge 6:12</a>). This evil was to serve as a warning to those who were to live after. The ground had already been cursed for the good of Cain (<a onClick="return mV(\'Gen\',4,12);">Ge 4:12</a>). Two purposes seemed to direct the treatment: (1) to leave in the minds of Cain and his descendants the knowledge that sin brings punishment, and (2) to increase the toil that would make them a better people. God overthrew Sodom, Gomorrah, Admah and Zeboim, cities of the plain, making them "an example unto those that should live ungodly" (<a onClick="return mV(\'2Pe\',2,6);">2Pe 2:6</a>). In the Book of Isaiah the prophet, we find a number of "burdens": the burden of Babylon (<a onClick="return mV(\'Isa\',13,\'1-22\');">Isa 13:1-22</a>); the burden of Moab (<a onClick="return mV(\'Isa\',15,\'1-9\');">Isa 15:1-9</a>); the burden of Damascus (<a onClick="return mV(\'Isa\',17,\'1-14\');">Isa 17:1-14</a>); the burden of Egypt (<a onClick="return mV(\'Isa\',19,\'1-17\');">Isa 19:1-17</a>); the burden of the Wilderness of the Sea (<a onClick="return mV(\'Isa\',21,\'1-10\');">Isa 21:1-10</a>); the burden of Dumah (<a onClick="return mV(\'Isa\',21,11,12);">Isa 21:11-12</a>); the burden upon Arabia (<a onClick="return mV(\'Isa\',21,\'13-17\');">Isa 21:13-17</a>); the burden of the Valley of Vision (<a onClick="return mV(\'Isa\',22,\'1-25\');">Isa 22:1-25</a>); the burden of Tyre (<a onClick="return mV(\'Isa\',23,\'1-18\');">Isa 23:1-18</a>); the burden of the Beasts of the South (<a onClick="return mV(\'Isa\',30,\'6-14\');">Isa 30:6-14</a>); the burden of the Weary Beast (<a onClick="return mV(\'Isa\',46,1,2);">Isa 46:1-2</a>). These may serve as an introduction to the story of wrongdoing and physical suffering threatened and executed. Isaiah contains many denunciations against Israel: against the Ten Tribes for following the sin introduced by Jeroboam the son of Nebat; and the threatening against Judah and Benjamin for not heeding the warnings. Jeremiah saw the woes that were sure to come upon Judah; for declaring them, he was shut up in prison, and yet they came, and the people were carried away into Babylon. These were the evils or afflictions brought upon the nations for their persistence in sin. "I form the light, and create darkness; I make peace, and create evil; I am Yahweh, that doeth all these things" (<a onClick="return mV(\'Isa\',45,7);">Isa 45:7</a>). These chastisements seemed grievous, and yet they yielded peaceable fruit unto them that were exercised thereby (<a onClick="return mV(\'Hbr\',12,11);">Heb 12:11</a>).`<a href="./study/isbe/search.html?string=TEMPT;+TEMPTATION">TEMPTATION</a>`45';
isbe[3270]='Evil Eye`(ra\' \'ayin, "evil of eye"; ophthalmos poneros):<P>The superstition of the influence of the "evil eye," so widely spread over the earth, has had a mighty influence on life and language in Palestine, though direct references to it are not frequent in the Scriptures (<a onClick="return mV(\'Deu\',15,9);">De 15:9</a>; <a onClick="return mV(\'Deu\',28,54,56);">28:54, 56</a>; <a onClick="return mV(\'Pro\',23,6);">Pr 23:6</a>; <a onClick="return mV(\'Pro\',28,22);">28:22</a>; <a onClick="return mV(\'Mat\',20,15);">Mt 20:15</a> (compare <a onClick="return mV(\'Mat\',6,23);">Mt 6:23</a>; <a onClick="return mV(\'Luk\',11,34);">Lu 11:34</a>); <a onClick="return mV(\'Mar\',7,22);">Mr 7:22</a>). In the Bible the expression is synonymous with envy, jealousy and some forms of covetousness. In comparing <a onClick="return mV(\'Rom\',1,29);">Ro 1:29</a> with <a onClick="return mV(\'Mar\',7,22);">Mr 7:22</a> we find that ophthalmos poneros corresponds to phthonos. See Trench, New Testament Synonyms, under the word. The eye of the envious (as also the tongue of the invidious by an apparently appreciative word, which, however, only disguises the strong desire of possessing the object of comment or of destroying it for its rightful owner) was supposed to have a baneful influence upon the wellbeing of others, especially of children. Therefore mothers bestowed constant care against the frustration of such fancied designs by means of innumerable sorts of charms. They often allowed their darlings to appear as unlovely as possible, through uncleanliness or rags, so as to spare them the harmful rising of envy in the hearts of others.<P>Lane, Manners and Customs of the Modern Egyptians, gives perhaps the most accessible account of this superstition as held at the present day in Egypt, and Thomson, The Land and the Book, does the same for Palestine, while an equal amount of evidence might be collected from every other oriental country. Instances of the same superstition, though possibly slightly disguised, are by no means wanting among ourselves. Compare the expression, "green-eyed jealousy" (Othello, III, iii; Merchant of Venice, III, ii), etc.<P>For certain Biblical phrases referring to the "evil eye" see <a href="./study/isbe/search.html?string=ENVY">ENVY</a>; <a href="./study/isbe/search.html?string=EYE">EYE</a>.<P>LITERATURE.<P>F. T. Elworthy, The Evil Eye, London, 1895.``106';
isbe[3271]='Evil One`(ho poneros):<P>Nearly all peoples who have expressed their religious thought and feeling believe in a spirit that presides over the destinies of men for their good. They believe that there is also a spirit, a person, whose work it is to lead men into temptation: a spirit of light and a spirit of darkness. Feelings and preferences may have much to do with the conclusions. In <a onClick="return mV(\'Mat\',5,37,39,45);">Mt 5:37, 39, 45</a>; <a onClick="return mV(\'Mat\',6,13);">6:13</a>, the King James Version gives "evil," the Revised Version (British and American) "the evil one," margin, "evil," the personal form referring to the enemy of the race known by various terms: Satan, "the adversary" or "the accuser," occurs 50 times; Beelzebub is found 7 times; devil, 35 times; it means "accuser," "calumniator."`<a href="./study/isbe/search.html?string=SATAN">SATAN</a>`45';
isbe[3272]='Evil Spirit``<a href="./study/isbe/search.html?string=DEMON;+DEMONIAC;+DEMONOLOGY">DEMONIAC</a>; <a href="./study/isbe/search.html?string=COMMUNION+WITH+DEMONS">COMMUNION WITH DEMONS</a>; <a href="./study/isbe/search.html?string=SATAN">SATAN</a>`1';
isbe[3273]='Evil Thing`(to kakon, plural in <a onClick="return mV(\'Luk\',16,25);">Lu 16:25</a>):<P>An evil thing or evil things may be the thoughts of evil men, their plans or their deeds; or the things men suffer for their own wrongs; or the evils consequent upon the errors of others. In the dark picture of fallen men in <a onClick="return mV(\'Rom\',1,30);">Ro 1:30</a>, "inventors of evil things" appear. "The evil man out of his evil treasure bringeth forth evil (poneros) things" (<a onClick="return mV(\'Mat\',12,35);">Mt 12:35</a>). Men should not lust after evil (kakos) things (<a onClick="return mV(\'1Cr\',10,6);">1Co 10:6</a>). This fixing the mind upon, with desire, leads to increased wrong. "The mouth of the wicked poureth out evil (ra\') things" (<a onClick="return mV(\'Pro\',15,28);">Pr 15:28</a>). The rich man had good things in his life, but did not use them to the glory of God or the good of men. The poor man had evil things: sickness, nakedness, hunger. The scene changes after death (<a onClick="return mV(\'Luk\',16,25);">Lu 16:25</a>).``45';
isbe[3274]='Evil-Doers`e-v\'-l-doo\'-erz mere\'im; from ra\'-a\'; kakopoios, always plural:<P>Malefactors or offenders of God\'s law. Used generally of the ungodly, as, "Fret not thyself because of evil-doers." (<a onClick="return mV(\'Psa\',37,1);">Ps 37:1</a>). Sometimes also of personal offenders: "He hath delivered the soul of the needy from the hand of evil-doers." (<a onClick="return mV(\'Jer\',20,13);">Jer 20:13</a>).``1';
isbe[3275]='Evil-Favoredness`e-v\'-l-fa\'-verd-nes<P>The word is the translation of the Hebrew dabhar ra\', lit "evil thing," and refers to the ritual unfitness for sacrifice of any animal which, though included in the class of clean beasts, yet possesses a blemish (see the word), or otherwise lacks beauty of symmetry, or is lean-fleshed (<a onClick="return mV(\'Deu\',17,1);">De 17:1</a> the King James Version; compare "ill blemish," <a onClick="return mV(\'Deu\',15,21);">De 15:21</a>). We find these conditions combined in <a onClick="return mV(\'Gen\',41,3,4,19,20,21,27);">Ge 41:3-4, 19-21, 27</a>, where the seven "ill-favored and lean-fleshed" kine of Pharaoh\'s dream are mentioned.``1';
isbe[3276]='Evil-Merodach`e-vil-me-ro\'-dak; -mer\'-o-dak \'ewil merodhakh; Septuagint Eueialmarodek; so B in K, but B in Jeremiah, and A and Q in both places much corrupted:<P>The name of the son and immediate successor of Nebuchadnezzar II, king of Babylon. The Babylonian form of the name is Amelu-Marduk, that is, "man of Marduk." About 30 contract tablets dated in this reign have been found. They show that Evil-merodach reigned for two years and about five months. He is said by Berosus to have conducted his government in an illegal and improper manner, and to have been slain by his sister\'s brother, Nergalshar-ucur, who then reigned in his stead. Evil-merodach is said in <a onClick="return mV(\'2Ki\',25,\'27-30\');">2Ki 25:27-30</a> and in the parallel passage in <a onClick="return mV(\'Jer\',52,\'31-34\');">Jer 52:31-34</a> to have taken Jehoiachin, king of Judah, from his prison in Babylon, where he seems to have been confined for 37 years, to have clothed him with new garments, to have given him a seat above all the other kings, and to have allowed him to eat at the king\'s table all the days of his life. It is an undesigned coincidence, that may be worthy of mention, that the first dated tablet from this reign was written on the 26th of Elul, and <a onClick="return mV(\'Jer\',52,31);">Jer 52:31</a> says that Jehoiachin was freed from prison on the 25th of the same month.``196';
isbe[3277]='Evil-Speaking`e-v\'-l-spek\'-ing:<P>Occurs twice in English Versions:<P>(1) <a onClick="return mV(\'1Pe\',2,1);">1Pe 2:1</a> it is the translation of katalalia, "a speaking against," rendered "backbiting" in <a onClick="return mV(\'2Cr\',12,20);">2Co 12:20</a>; compare katalalos, "backbiter" (<a onClick="return mV(\'Rom\',1,30);">Ro 1:30</a>); the verb katalaleo is rendered to "speak against" (<a onClick="return mV(\'1Pe\',2,12);">1Pe 2:12</a>; <a onClick="return mV(\'Jam\',4,11);">Jas 4:11</a>; <a onClick="return mV(\'1Pe\',3,16);">1Pe 3:16</a>);<P>(2) of blasphemia, "what is hurtful to the good name of anyone," "detraction," "slander" (<a onClick="return mV(\'Eph\',4,31);">Eph 4:31</a> the Revised Version (British and American), "railing"; compare <a onClick="return mV(\'1Ti\',6,4);">1Ti 6:4</a>; <a onClick="return mV(\'Jud\',1,9);">Jude 1:9</a>; <a onClick="return mV(\'Col\',3,8);">Col 3:8</a>); the verb blasphemeo is rendered to "speak evil of" (<a onClick="return mV(\'Rom\',14,16);">Ro 14:16</a>; <a onClick="return mV(\'1Cr\',10,30);">1Co 10:30</a>; <a onClick="return mV(\'Tts\',3,2);">Tit 3:2</a>, etc.); to "speak evil" occurs in <a onClick="return mV(\'Mar\',9,39);">Mr 9:39</a> as the translation of kakologeo, "lightly (the Revised Version (British and American) "quickly") speak evil of me"; <a onClick="return mV(\'Act\',19,9);">Ac 19:9</a> the King James Version "spake evil of that way." In <a onClick="return mV(\'Psa\',140,11);">Ps 140:11</a>, we have "evil-speaker" as the translation of \'ish lashon, "a man of tongue"; so the Revised Version (British and American). The wrong thing condemned as evil-speaking seems to be essentially detraction, what is hurtful to the reputation, and it is often too lightly regarded even among Christians.`<a href="./study/isbe/search.html?string=BLASPHEMY">BLASPHEMY</a>; <a href="./study/isbe/search.html?string=RAILING">RAILING</a>; <a href="./study/isbe/search.html?string=SLANDER">SLANDER</a>`185';
isbe[3278]='Evolution`ev-o-lu\'-shun:<P>1. The Idea of Evolution:<P>Evolution is a scientific and philosophical theory designed to explain the origin and course of all things in the universe. By origin, however, is not understood the production or emergence of the substance and of the cause or causes of things, but that of the forms in which they appear to the observer. Sometimes the term is vaguely used to cover absolute origin in the sense just excluded. A moment\'s reflection will make it clear that such a view can never secure a place in the realm of pure science. The problem of ultimate origin is not one that science can solve. If it is solved at all, it must be by purely philosophical as distinguished from scientific or scientific-philosophical methods. Evolution, therefore, must be viewed in science purely and strictly as a process of orderly change in the form of things. As such it assumes the existence of substance or substances and of a force or forces working its successive transformations. (NOTE: This position is apparently contradicted in the title of Henri Bergson\'s L\'evolution creatrice. But an examination of Bergson\'s system shows that the contradiction is only apparent. Bergson\'s evolution is neither substance nor efficient cause or principle. The latter is given in his vital impetus (elan vital); the former in his concept of duration.)<P>As an orderly change of the form of things, evolution may be viewed as operative in the field of inorganic matter, or in that of life. In the first, it is known and called cosmic evolution; in the second, organic evolution. Of cosmic evolution again there appear two aspects, according as the process, or law of transformation, is observed to operate in the realm of the lower units of matter (atoms and molecules), or is studied in the region of the great. In the first sphere, it is made to account for the emergence in Nature of the qualities and powers of different kinds of matter called elements. In the second, it explains the grouping together, the movements and transformations of the solar and of stellar systems. Similarly, of organic evolution there appear to be two varieties. The first occurs in the world of life including the vegetable and animal kingdoms. Evolution here accounts for the various forms of living beings building their bodies and passing from one stage to another in their existence as individuals, and for the course of the history of all life as it differentiates into species and genera. The second variety of evolution operates in the higher realm of intelligence, morality, social activity and religion. The idea of a law of orderly change governing all things is not a new one.<P>Historians of science find it in some form or other embodied in the philosophies of Heraclitus, Democritus, Lucretius and Aristotle. There are those who find it also in the system of Gautama (Buddha).<P>2. Recent Origin of Notion:<P>But in none of these was there a sufficiently wide basis of fact inductively brought together, or a thorough enough digestion and assimilation of the material to give the view as presented by them a firm standing. Hegel\'s idealistic theory of Development is kindred to the evolution theory in its essence; but it too antedates the working out of the system upon the basis of the scientific induction of the phenomena of Nature.<P>Until the time of Herbert Spencer, the scientific use of the word evolution was limited to the narrow department of embryology. By him, the term was made synonymous with all orderly change in Nature. The notion that such change is the result of chance, however, was not a part of Spencer\'s teaching. On the contrary, that philosopher held that chance is but the expression of laws undiscerned by the human mind. Yet these laws are just as definite and rigid as those already discovered and formulated.<P>Since the appearance of the inductive method in scientific research, and the rise of the science of biology in particular, the idea of evolution has been elaborated into a great systematic generalization, and proposed as the philosophy of all perceptible phenomena. Beginning as a working hypothesis in a special narrow department, that of biology, it has been extended into all the sciences until all come under its dominance, and it is viewed no longer as a mere working hypothesis, but as a demonstrated philosophy with the force and certainty of fact.<P>3. Evolution and Biblical Truth:<P>It was natural that such an important proposition as the explanation of the present form of the whole universe by theory of evolution should in its course have occasioned much controversy. On one side extravagant claims were bound to be put forth in its behalf, combined with a misconception of its field. On the other a stubborn denial of its sufficiency as an explanation, even in the narrow sphere where it first made its appearance, was destined to confront it. This challenge, too, was the result of the misconception of it as an all-sufficient theory of the universe as distinguished from a law or method of the operation of a cause ulterior and superior to itself. The period of this warfare is now nearly, if not altogether, over. The task which remains to be accomplished is to recognize the bearings of theory on forms of thought arrived at apart from the light thrown on the world by itself.<P>Since such forms of thought are given in the Bible, certain problems arise which must be solved, if possible, in the light of evolution. These problems concern mainly the following topics:<P>(1) The belief in a personal God, such as the Christian Scriptures present as an object of revelation;<P>(2) The origin of the different species of living beings as portrayed in the Book of Genesis;<p>(3) The particular origin of the human species (the descent (ascent) of man);<P>(4) The origin of morality and religion, and<P>(5) The essential doctrines of the Christian faith, such as supernatural revelation, the idea of sin, the person of Christ, regeneration and immortality. Beyond the answers to these primary questions, it will be neither possible nor profitable to enter within the brief compass of the present article.<P>The relation of creation to evolution has been already suggested in the introductory explanation of the nature of evolution. If creation be the act of bringing into existence material or substance which did not previously exist, evolution does not touch the problem. It has nothing to say of a First Cause. The idea of a first cause may be regarded as material for metaphysics or the ground of religious belief.<P>4. Evolution and Creation:<P>It may be speculated about, or it may be assumed by faith. The theory of evolution begins with matter or substance already in existence. A fairly representative statement of this aspect of it is illustrated by Huxley\'s dictum, "The whole world living and not living is the result of the mutual attraction according to definite laws of the powers possessed by the molecules of which the primitive nebulosity of the universe was composed" (Life of Darwin, II, 210). This statement leaves two things unaccounted for, namely, molecules in the form of a "primitive nebulosity" and "powers possessed by these molecules." How did primitive nebulosity come to exist? How did it come to be composed of molecules possessed of certain powers, and how did there come to be definite laws governing these molecules? The agnostic answers, "We do not know, we shall not know" (ignoramus, ignorabimus, DuBois-Reymond). The pantheist says, "They are the substance and attributes of the Ultimate Being." The theist posits "an uncaused Cause who is greater than they, and possesses all the potentialities exhibited in them, together with much more (therefore at least a personal being), has brought them into existence by the power of His will" (compare <a href="./study/isbe/search.html?string=EPICUREANS">EPICUREANS</a>).<P>Thus the believer in evolution may be an agnostic, a pantheist or a theist, according to his attitude toward, and answer to, the question of beginnings. He is an evolutionist because he believes in evolution as the method of the transformation of molecules under the control of the powers possessed by them. Conversely theist (and by implication the Christian) may be an evolutionist. As an evolutionist he may be thoroughgoing. He may accept evolution either as a working hypothesis or as a well-established generalization, even in the form in which it is defined by Herbert Spencer: the integration of matter out of an indefinite incoherent homogeneity into definite coherent heterogeneity with concomitant dissipation of energy. (For the exact definition in its full length, see First Principles, 367.) In this definition, as in every other form of it, evolution is the name of a process of transformation, not a theory of absolute causation or creation ex nihilo. The human mind may leave the problem of initial creation uninvestigated; it may assume that there is no problem by regarding matter and energy as uncaused and ultimate realities or phases of one reality; or it may trace these back to a First Cause which has at least the powers and characteristics perceptible in the universe and particularly in itself as mind (i.e. individuality, intelligence and freedom), or in other words, to a personal God. In any of these contingencies it may hold to theory of evolution.<P>5. Evolution and the Origin of Species:<P>Evolution is strongest in the realm of life. It is here that it first achieved its most signal conquests; and it is here that it was first antagonized most forcibly by the champions of religious faith. Here it proved irresistibly fascinating because it broke down the barriers supposed to exist between different species (whether minor or major) of life. It showed the unity and solidarity of the entire living universe with all its infinite variety. It reduced the life-process to one general law and movement. It traced back all present different forms, whether recognized as individuals, varieties, species, genera, families or kingdoms, to a single starting-point. In this realm the adjective "organic" has been prefixed to it, because the characteristic result is secured through organization. One of its most enthusiastic supporters defines it as "progressive change according to certain laws and by means of resident forces" (LeConte).<P>The proof for organic evolution is manifold. It cannot be given here at any length. Its main lines, however, may be indicated as follows:<P>(1) The existence of gradations of structure in living forms beginning with the simplest (the amoeba usually furnishes the best illustration) and reaching to some of the most complex organisms (the human body).<P>(2) The succession of living forms in time. This means that, according to the evidence furnished by geology, the simpler organisms appeared earlier on the face of the earth than the more complex, and that the progress of forms has been in general from the simpler to the more complex.<P>(3) The parallelism between the order thus discovered in the history of life upon earth and the order observed in the transformations of the embryo of the highest living forms from their first individual appearance to their full development.<P>(4) The existence of rudimentary members and organs in the higher forms.<P>The most striking of these proofs of evolution are the two commonly designated the paleontological and the ontogenetic. The first is based on the fact that in the strata of the earth the simpler forms have been deposited in the earlier, and the more complex in the later. This fact points to the growth in the history of the earth of the later, more complex forms of life, from earlier simpler ones. The second consists in the observation that each individual of complexly constructed species of organisms begins its life in the embryonic stage as the simplest of all living forms, a single cell (constituted in some cases out of parts of two preexisting cells). From this beginning it advances to its later stages of growth as an embryo, assuming successively the typical forms of higher organisms until it attains the full form of its own species, and thus begins its individual post-embryonic life. It thus recapitulates in its individual history the history of its species as read in the paleontological records. This consideration shows that whatever the truth may be as to the species as a whole (for instance of man), each individual of the species (each man) has been evolved in his prenatal life, if not exactly from definitely known and identifiable species (anthropoid individuals perfectly formed), at least from foetal organisms apparently of the same type as those of anthropoids.<P>But assuming organic evolution to be true upon these grounds, and upon others of the same character, equally convincing to the scientific man, it must not be left out of account that it is to be distinguished quite sharply from cosmic evolution. These two phases of the law are identical at their basis, but become very different in their application according to the nature of the field in which they operate. Cosmic evolution works altogether through reactions. These are invariable in their cause and effect. Given material elements and conditions, they always issue in the same results. Their operations are grouped together under the sciences of chemistry and physics. Organic evolution works through processes to which the term "vital" is applied. Whether these are identical with the chemico-physical processes in the ultimate analysis is an open question among scientists. In the field of purely descriptive science, however, which limits itself to the observation of facts, it can scarcely emerge as a question, since the true nature of vitality is beyond the reach of observation. And upon the whole, theory that there is an inner difference between vitality and physico-chemical attractions and affinities is supported by certain obvious considerations. But even if vitality should prove to be nothing more than a series of reactions of a chemical and physical nature, the type of evolution to which it yields is differentiated by broad characteristics that distinguish it from merely molecular attractions and affinities.<P>(1) Vital processes cannot be correlated with the chemico-physical ones. Heat, light, electricity, magnetism, gravitation, chemical affinity, are interchangeable and interchanged among themselves. But none of these can be converted into life as far as now known.<P>(2) All life is from preexisting life (omne vivum e vivo). Biogenesis still holds the field as far as experimental science has anything to say about it, and abiogenesis is at the most an attractive hypothesis.<P>(3) The vital processes overcome and reverse the chemical and physical ones. When a living organism is constituted, and as long as it subsists in life, it breaks up and reconstitutes forms of matter into new forms. Carbon, nitrogen, hydrogen and oxygen, in combination with other elements, are separated from one another and reunited in new combinations in the tissues of the plant and the animal. On the other hand, the moment the vital process ceases, the chemical and physical resume their course. The organism in which the vital process has been annihilated is immediately put under the operation of chemical affinities, and reduced into its first elements. So long as the vital process is on, there seems to be a ruling or directive principle modifying and counteracting the normal and natural course of the so-called chemical and physical forces.<P>(4) The vital process is characterized by the manifestation in matter of certain peculiarities that never show themselves apart from it. These are irritability, assimilation of non-living matter in the process of growth, differentiation or the power in each kind of living organism to develop in its growth regularly recurring characteristics, and<P>(5) reproduction. The result of the vital process is the tendency in the organic product of it to maintain itself as a unity, and become more and more diversified in the course of its life. These features of organic evolution make it necessary to account not only for the origin of the matter and the energy which are assumed in the cosmic form of evolution, but also for the origin and nature of the unknown something (or combination of things) which is called life in the organism, whether this be a unitary and distinct force or a group of forces. (It is interesting to notice the return to the notion of life as primal energy in the philosophy of Bergson (elan vital); compare Creative Evolution. The same view is advocated by Sir Oliver Lodge, Life and Matter.)<P>Furthermore, care must be taken not to confuse any special variety of evolutionary theory in the organic realm with the generic theory itself. Evolutionists hold and propound different hypotheses as to the application of the principle. The Lamarckian, the Darwinian, the Weismannian, the De Vriesian views of evolution are quite different from, and at certain points contradictory of, one another. They assume the law to be real and aim to explain subordinate features or specific applications of it as seen in certain given series of facts. They differ from one another in insisting on details which may be real or unreal without affecting the truth of the main law. Lamarckian evolution, for instance (revived recently under the name neo-Lamarckian), makes. much of the alleged transmissibility through heredity of acquired traits. Darwinian evolution is based largely on the principle of accidental variations worked over by natural selection and the slow insensible accumulation of traits fitting individuals to survive in the struggle for life. Weismannian evolution posits an astonishingly complex germinal starting-point. DeVriesian evolution is built on the sudden appearance of mutations ("sports") which are perpetuated, leading to new species. It is unscientific to array any of these against the other in the effort to undermine the generic theory of evolution, or to take their differences as indicating the collapse of theory and a return to the idea of creation by fiat. The differences between them are insignificant as compared with the gulf which separates them all from the conception of a separate creative beginning for each species at the first appearance of life upon earth. (On some differences between the primitive form of Darwinian and later theories of the same general type, see Rudolph Otto, in Naturalism and Religion (ET).)<P>With these limitations, the law of organic evolution may be taken into the Biblical account of creation as given in Genesis, chapters <a onClick="return mV(\'Gen\',1,\'1-\');">1</a> and <a onClick="return mV(\'Gen\',2,\'1-\');">2</a>. The question raised at once is one of the relation of the doctrine to the Biblical account. If the evolutionary conception is true, it naturally follows that the Biblical account cannot be accepted in its literal interpretation. For the one of these accounts pictures the different species and general types as coming into existence gradually out of preexisting ones, whereas the other (literally interpreted) represents them as created by a Divine fiat. This difference it is true may be artificially exaggerated. Nowhere does the Biblical account explicitly ascribe the creation of each species to the fiat of God. The word "created" (bara\'), as used in Genesis, does not necessarily exclude pre-existing matter and form. On the other hand, expressions such as "Let the earth bring forth" (<a onClick="return mV(\'Gen\',1,11);">1:11</a> the King James Version) indicate a certain mediation of secondary powers in the elements ("resident forces," LeConte) through which organisms came into being. "After their kind" suggests the principle of heredity. "Abundantly" suggests the law of rapid and ample reproduction leading to the "struggle for life," "n
