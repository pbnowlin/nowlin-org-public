isbe = [];

isbe[6201]='Munition`mu-nish\'-un.`<a href="./study/isbe/search.html?string=SIEGE">SIEGE</a>`1';
isbe[6202]='Muppim`mup\'-im (muppim): A son of Benjamin (<a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a>), elsewhere called "[<A href="./study/isbe/search.html?string=SHUPPIM">Shuppim</a>" (<a onClick="return mV(\'1Ch\',7,12,15);">1Ch 7:12,15</a>; <a onClick="return mV(\'1Ch\',26,16);">26:16</a>), "<A href="./study/isbe/search.html?string=SHEPHUPHAM,+SHEPHUPHAN">Shephupham</a>" (<a onClick="return mV(\'Num\',26,39);">Nu 26:39</a>), and "<A href="./study/isbe/search.html?string=SHEPHUPHAM,+SHEPHUPHAN">Shephuphan</a>" (<a onClick="return mV(\'1Ch\',8,5);">1Ch 8:5</a>); compare separate articles on these names.``1';
isbe[6203]='Murder`1. Terms:<P>mur\'-der (haragh, "to smite," "destroy," "kill," "slay" (<a onClick="return mV(\'Psa\',10,8);">Ps 10:8</a>; <a onClick="return mV(\'Hsa\',9,13);">Ho 9:13</a> AV), ratsach, "to dash to pieces," "kill," especially with premeditation (<a onClick="return mV(\'Num\',35,16);">Nu 35:16</a> and frequently; <a onClick="return mV(\'Job\',24,14);">Job 24:14</a>; <a onClick="return mV(\'Psa\',94,6);">Ps 94:6</a>; <a onClick="return mV(\'Jer\',7,9);">Jer 7:9</a>; <a onClick="return mV(\'Hsa\',6,9);">Ho 6:9</a>); phoneus, "criminal homicide," from phoneuo, "to kill," "slay"; phonos, from pheno, has the same meaning; anthropoktonos, "manslayer," "murderer," is used to designate Satan (<a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>) and him that hates his brother (<a onClick="return mV(\'1Jo\',3,15);">1Joh 3:15</a>); a matricide is designated as metraloas (<a onClick="return mV(\'1Ti\',1,9);">1Ti 1:9</a>); compare adelphokionos, "fratricidal" (The <span class="noTag">Wisdom of Solomon 10:3</span>). The plural of phonos, "murders," occurs in <a onClick="return mV(\'Mat\',15,19);">Mt 15:19</a>; <a onClick="return mV(\'Mar\',7,21);">Mr 7:21</a>; <a onClick="return mV(\'Gal\',5,21);">Ga 5:21</a> the King James Version; <a onClick="return mV(\'Rev\',9,21);">Re 9:21</a>; compare 2Macc 4:3,18; 12:6):<P>2. The Hebrew Law:<P>The Hebrew law recognized the distinction between willful murder and accidental or justifiable homicide (<a onClick="return mV(\'Num\',25,16);">Nu 25:16</a>); but in legal language no verbal distinction is made. Murder was always subject to capital punishment (<a onClick="return mV(\'Lev\',24,17);">Le 24:17</a>; compare <a onClick="return mV(\'Gen\',9,6);">Ge 9:6</a>). Even if the criminal sought the protection of the sanctuary, he was to be arrested before the altar, and to be punished (<a onClick="return mV(\'Exd\',21,12,14);">Ex 21:12,14</a>; <a onClick="return mV(\'Lev\',24,17,21);">Le 24:17,21</a>; <a onClick="return mV(\'Num\',35,16,18,21,31);">Nu 35:16,18,21,31</a>). The Mishna says that a mortal blow intended for another than the victim is punishable with death; but such a provision is not found in the Law. No special mention is made of<P class="in15">(a) child murder;<P class="in15">(b) parricide; or<P class="in15">(c) taking life by poison;<P>but the intention of the law is clear with reference to all these cases (<a onClick="return mV(\'Exd\',21,15,17);">Ex 21:15,17</a>; <a onClick="return mV(\'1Ti\',1,9);">1Ti 1:9</a>; <a onClick="return mV(\'Mat\',15,4);">Mt 15:4</a>). No punishment is mentioned for attempted suicide (compare <a onClick="return mV(\'1Sa\',31,4);">1Sa 31:4</a>f; <a onClick="return mV(\'1Ki\',16,18);">1Ki 16:18</a>; <a onClick="return mV(\'Mat\',27,5);">Mt 27:5</a>); yet Josephus says (BJ, III, viii, 5) that suicide was held criminal by the Jews (see also <a onClick="return mV(\'Exd\',21,23);">Ex 21:23</a>). An animal known to be vicious must be confined, and if it caused the death of anyone, the animal was destroyed and the owner held guilty of murder (<a onClick="return mV(\'Exd\',21,29,31);">Ex 21:29,31</a>). The executioner, according to the terms of the Law, was the "revenger of blood"; but the guilt must be previously determined by the Levitical tribunal. Strong protection was given by the requirement that at least two witnesses must concur in any capital question (<a onClick="return mV(\'Num\',35,\'19-30\');">Nu 35:19-30</a>; <a onClick="return mV(\'Deu\',17,\'6-12\');">De 17:6-12</a>; <a onClick="return mV(\'Deu\',19,12,17);">19:12,17</a>). Under the monarchy the duty of executing justice on a murderer seems to have been assumed to some extent by the sovereign, who also had power to grant pardon (<a onClick="return mV(\'2Sa\',13,39);">2Sa 13:39</a>; <a onClick="return mV(\'2Sa\',14,7,11);">14:7,11</a>; <a onClick="return mV(\'1Ki\',2,34);">1Ki 2:34</a>).`<a href="./study/isbe/search.html?string=MANSLAYER">MANSLAYER</a>`77';
isbe[6204]='Murderers`mur\'-der-erz (<a onClick="return mV(\'Act\',21,38);">Ac 21:38</a> the King James Version, the Revised Version (British and American) "assassins"): Represents a word only once mentioned in the New Testament, the Greek word sikarios, Latin sicarius from sica, "a small sword," or "dagger." The word describes the hired assassin, of whom there were bands in the pay of agitators in Rome in the last days of the Republic, who employed them to remove surreptitiously their political opponents. In the later days of the Jewish commonwealth, Judea became infested with the same type of ruffian, and it is natural that the Roman commandant at Jerusalem should describe them by the name so well known in the imperial city.`<a href="./study/isbe/search.html?string=ASSASSINS">ASSASSINS</a>`128';
isbe[6205]='Murmur; Murmurings`mur\'-mur, mur\'-mur-ingz: The Hebrew word (lun) denotes the semi-articulated mutterings of disaffected persons. It is used in connection with the complaints of the Israelites in the desert against Yahweh on the one hand, and against Moses and Aaron on the other hand (<a onClick="return mV(\'Exd\',16,7,8);">Ex 16:7,8</a>; <a onClick="return mV(\'Num\',14,27,36);">Nu 14:27,36</a>; <a onClick="return mV(\'Num\',16,11);">16:11</a>; <a onClick="return mV(\'Num\',17,5);">17:5</a>). In three places (<a onClick="return mV(\'Deu\',1,27);">De 1:27</a>; <a onClick="return mV(\'Psa\',106,25);">Ps 106:25</a>; <a onClick="return mV(\'Isa\',29,24);">Isa 29:24</a>), "murmur" translates a Hebrew word (raghan) which suggests the malicious whispering of slander.<P>In the New Testament "murmur" renders two different words, namely, gogguzo, and embrimaomai. The latter word suggests indignation and fault-finding (<a onClick="return mV(\'Mar\',14,4);">Mr 14:4</a> the King James Version). The former word (or a compound of it) is generally used in connection with the complainings of the Pharisees and scribes (<a onClick="return mV(\'Mat\',20,11);">Mt 20:11</a>; <a onClick="return mV(\'Luk\',5,30);">Lu 5:30</a>; <a onClick="return mV(\'Luk\',15,2);">15:2</a>; <a onClick="return mV(\'Luk\',19,7);">19:7</a>).``103';
isbe[6206]='Murrain`mur\'-in, mur\'-en, mur\'-an (debher): This name is given to a fatal cattle-disease, which was the fifth of the plagues of Egypt (<a onClick="return mV(\'Exd\',9,3);">Ex 9:3</a>), and which affected not only the flocks and herds, but also the camels, horses and asses. The record of its onset immediately after the plague of flies makes it probable that it was an epizootic, whose germs were carried by these insects as those of rinderpest or splenic fever may be. Cattle plagues have in recent years been very destructive in Egypt; many writers have given descriptions of the great devastation wrought by the outbreak in 1842. In this case Wittmann noted that contact with the putrid carcasses caused severe boils, a condition also recorded in Exodus as following the murrain. The very extensive spread of rinderpest within the last few years in many districts of Egypt has not yet been completely stamped out, even in spite of the use of antitoxic serum and the most rigid isolation. The word "murrain" is probably a variant of the Old French morine. It is used as an imprecation by Shakespeare and other Elizabethan writers, and is still applied by herdsmen to several forms of epidemic cattle sickness. Among early writers it was used as well for fatal plagues affecting men; thus, Lydgate (1494) speaks of the people "slain by that moreyne."``107';
isbe[6207]='Muse; Musing`muz, muz\'-ing: The word occurs twice in the Old Testament, in the sense of "meditate" (<a onClick="return mV(\'Psa\',39,3);">Ps 39:3</a>, chaghigh; <a onClick="return mV(\'Psa\',143,5);">Ps 143:5</a>, siach); in the New Testament once (<a onClick="return mV(\'Luk\',3,15);">Lu 3:15</a>, dialogizomai, where the Revised Version (British and American) reads "reasoned").``1';
isbe[6208]='Mushi`mu\'-shi (mushi): Son of Merari (<a onClick="return mV(\'Exd\',6,19);">Ex 6:19</a>; <a onClick="return mV(\'Num\',3,20);">Nu 3:20</a>; <a onClick="return mV(\'1Ch\',6,19);">1Ch 6:19 (Hebrew 4)</a>; <a onClick="return mV(\'1Ch\',23,21);">23:21</A>; <a onClick="return mV(\'1Ch\',24,26);">24:26</A>). There is found also the patronymic "Mushites" (<a onClick="return mV(\'Num\',3,33);">Nu 3:33</a>; <a onClick="return mV(\'Num\',26,58);">26:58</a>).``1';
isbe[6209]='Music`mu\'-zik:<P><b>I. IMPORTANCE</b><P class="in15">1. The Sole Art Cultivated<P class="in15">2. A Wide Vocabulary of Musical Terms<P class="in15">3. Place in Social and Personal Life<P class="in15">4. Universal Language of Emotions<P class="in15">5. Use in Divine Service<P class="in15">6. Part at Religious Reformations<P><b>II. THEORY OF MUSIC</b><P class="in15">1. Dearth of Technical Information<P class="in15">2. Not Necessarily Unimpressive<P><b>III. MUSICAL INSTRUMENTS</b><P class="in15">1. Strings<P class="in15">2. Winds<P class="in15">3. Percussion Instruments<P><b>LITERATURE</b><hr /><P>I. Importance.<P>That the Hebrews were in ancient times, as they are at the present day, devoted to the study and practice of music is obvious to every reader of the Old Testament. The references to it are numerous, and are frequently of such a nature as to emphasize its importance. They occur not only in the Psalter, where we might expect them, but in the Historical Books and the Prophets, in narratives and in declamations of the loftiest meaning and most intense seriousness. And the conclusion drawn from a cursory glance is confirmed by a closer study.<P>1. The Sole Art Cultivated:<P>The place held by music in the Old Testament is unique. Besides poetry, it is the only art that seems to have been cultivated to any extent in ancient Israel. Painting is entirely, sculpture almost entirely, ignored. This may have been due to the prohibition contained in the Second Commandment, but the fidelity with which that was obeyed is remarkable.<P>2. A Wide Vocabulary of Musical Terms:<P>From the traces of it extant in the Old Testament, we can infer that the vocabulary of musical terms was far from scanty. This is all the more significant when we consider the condensed and pregnant nature of Hebrew. "Song" in our English Versions of the Bible represents at least half a dozen words in the original.<P>3. Place in Social and Personal Life:<P>The events, occasions, and occupations with which music was associated were extremely varied. It accompanied leave-taking with honored guests (<a onClick="return mV(\'Gen\',31,27);">Ge 31:27</a>); celebrated a signal triumph over the nation\'s enemies (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>); and welcomed conquerors returning from victory (<a onClick="return mV(\'Jdg\',11,34);">Jud 11:34</a>; <a onClick="return mV(\'1Sa\',18,6);">1Sa 18:6</a>). It was employed to exorcise an evil spirit (<a onClick="return mV(\'1Sa\',18,10);">1Sa 18:10</a>), and to soothe temper, or excite the inspiration, of a prophet (<a onClick="return mV(\'2Ki\',3,15);">2Ki 3:15</a>). The words "Destroy not" in the titles of four of the Psalms (compare <a onClick="return mV(\'Isa\',65,8);">Isa 65:8</a>) most probably are the beginning of a vintage-song, and the markedly rhythmical character of Hebrew music would indicate that it accompanied and lightened many kinds of work requiring combined and uniform exertion. Processions, as e.g. marriages (1Macc 9:39) and funerals (<a onClick="return mV(\'2Ch\',35,25);">2Ch 35:25</a>), were regulated in a similar way. The Psalms headed "Songs of Degrees" were probably the sacred marches sung by the pious as they journeyed to and from the holy festivals at Jerusalem.<P>4. Universal Language of Emotional:<P>It follows from this that the range of emotion expressed by Hebrew music was anything but limited. In addition to the passages just quoted, we may mention the jeering songs leveled at Job (<a onClick="return mV(\'Job\',30,9);">Job 30:9</a>). But the music that could be used to interpret or accompany the Psalms with any degree of fitness must have been capable of expressing a great variety of moods and feelings. Not only the broadly marked antitheses of joy and sorrow, hope and fear, faith and doubt, but every shade and quality of sentiment are found there. It is hardly possible to suppose that the people who originated all that wealth of emotional utterance should have been without a corresponding ability to invent diversified melodies, or should have been content with the bald and colorless recitative usually attributed to them.<P>This internal evidence is confirmed by other testimony. The Babylonian tyrants demanded one of the famous songs of Zion from their Jewish captives (<a onClick="return mV(\'Psa\',137,3);">Ps 137:3</a>), and among the presents sent by Hezekiah to Sennacherib there were included male and female musicians. In later times Latin writers attest the influence of the East in matters musical. We need only refer to Juvenal iii.62ff.<P>5. Use in Divine Service:<P>By far the most important evidence of the value attached to music by the Hebrews is afforded by the place given to it in Divine service. It is true that nothing is said of it in the Pentateuch in connection with the consecration of the tabernacle, or the institution of the various sacrifices or festivals. But this omission proves nothing. It is not perhaps atoned for by the tradition (The <span class="noTag">Wisdom of Solomon 18:9</span>) that at the first paschal celebration "the fathers already led the sacred songs of praise," but the rest of the history makes ample amends. In later days, at all events, music formed an essential part of the national worship of Yahweh, and elaborate arrangements were made for its correct and impressive performance. These are detailed in 1 Chronicles. There we are told that the whole body of the temple chorus and orchestra numbered 4,000; that they were trained and conducted, in 24 divisions, by the sons of Asaph, Heman and Jeduthun; and that in each group experts and novices were combined, so that the former preserved the correct tradition, and the latter were trained and fitted to take their place. This is, no doubt, a description of the arrangements that were carried out in the Second Temple, but it sheds a reflex, if somewhat uncertain, light on those adopted in the First.<P>6. Part at Religious Reformations:<P>We are told by the same authority that every reformation of religion brought with it a reconstruction of the temple chorus and orchestra, and a resumption of their duties. Thus when Hezekiah purged the state and church of the heathenism patronized by Ahaz, "he set the Levites in the house of Yahweh with cymbals, with psalteries, and with harps" (<a onClick="return mV(\'2Ch\',29,25);">2Ch 29:25</a>). The same thing took place under Josiah (<a onClick="return mV(\'2Ch\',34,\'1-\');">2Ch 34</a>). After the restoration—at the dedication of the Temple (<a onClick="return mV(\'Ezr\',3,10);">Ezr 3:10</a>) and of the walls of Jerusalem (<a onClick="return mV(\'Neh\',12,17);">Ne 12:17</a>)—music played a great part. In Nehemiah\'s time the descendants of the ancient choral guilds drew together, and their maintenance was secured to them out of the public funds in return for their services.<P>II. Theory of Music.<P>1. Dearth of Technical Information:<P>It is disappointing after all this to have to confess that of the nature of Hebrew music we have no real knowledge. If any system of notation ever existed, it has been entirely lost. Attempts have been made to derive one from the accents, and a German organist once wrote a book on the subject. One tune in our hymnals has been borrowed from that source, but it is an accident, if not worse, and the ingenuity of the German organist was quite misdirected. We know nothing of the scales, or tonal system of the Hebrew, of their intervals or of their method of tuning their instruments. Two terms are supposed by some to refer to pitch, namely, "upon," or "set to \'Alamoth," (<a onClick="return mV(\'Psa\',46,\'1-\');">Ps 46</a>), and "upon," or "set to the Sheminith" (<a onClick="return mV(\'Psa\',6,\'1-\');">Psa 6</a>; <a onClick="return mV(\'Psa\',12,\'1-\');">12</a>; compare also <a onClick="return mV(\'1Ch\',15,\'19-21\');">1Ch 15:19-21</a>). The former has been taken to mean "in the manner of maidens," i.e. soprano; the latter "on the lower octave," i.e. tenor or bass. This is plausible, but it is far from convincing. It is hardly probable that the Hebrews had anticipated our modern division of the scale; and the word sheminith or "eighth" may refer to the number of the mode, while \'alamoth is also translated "with Elamite instruments" (Wellhausen). Of one feature of Hebrew music we may be tolerably sure: it was rendered in unison. It was destitute of harmony or counterpoint. For its effect it would depend on contrast in quality of tone, on the participation of a larger or smaller number of singers, on antiphonal singing, so clearly indicated in many of the Psalms, and on the coloring imparted by the orchestra. That the latter occasionally played short passages alone has been inferred from the term celah, a word that occurs 71 times in the Psalms. It is rendered in the Septuagint by diapsalmos, which either means louder playing, forte, or, more probably, an instrumental interlude.<P>2. Not Necessarily Unimpressive:<P>Our knowledge is, therefore, very meager and largely negative. We need not, however, suppose that Hebrew music was necessarily monotonous and unimpressive, or, to those who heard it, harsh and barbarous. Music, more than any other of the arts, is justified of her own children, and a generation that has slowly learned to enjoy Wagner and Strauss should not rashly condemn the music of the East. No doubt the strains that emanated from the orchestra and chorus of the temple stimulated the religious fervor, and satisfied the aesthetic principles of the Hebrews of old, precisely as the rendering of Bach and Handel excites and soothes the Christian of today.<P>III. Musical Instruments.<P>The musical instruments employed by the Hebrews included representatives of the three groups: string, wind, and percussion. The strings comprised the kinnor, or nebhel or nebhel; the winds: the shophar, or qeren, chatsotserah, chalil, and \'ughabh; percussion: toph, metsiltayim, tsltselim, mena\'an\'im, shalishim. Besides these, we have in Daniel: mashroqitha\', cabbekha\', pecanterin, cumponyah. Further, there are Chaldean forms of qeren and kithara.<P>1. Strings:<P>(1) When Used.<P>The chief of these instruments were the kinnor and nebhel (the King James Version, the Revised Version (British and American) "the harp" and "the psaltery" or "viol"). They were used to accompany vocal music. In <a onClick="return mV(\'1Sa\',10,5);">1Sa 10:5</a>, Saul meets a band of prophets singing inspired strains to the music of the nebhel, "drum," "flute," and kinnor. In the description of the removal of the ark, we are told that songs were sung with kinnoroth, nebhalim, etc. (<a onClick="return mV(\'2Sa\',6,5);">2Sa 6:5</a>). Again, in various passages (<a onClick="return mV(\'1Ch\',15,16);">1Ch 15:16</a>; <a onClick="return mV(\'2Ch\',7,6);">2Ch 7:6</a>, etc.) we meet with the expression keleshir, i.e. instruments of, or suitable for accompanying, song. It is evident that only the flute and strings could render melodies. The music performed on these instruments seems to have been mainly of a joyful nature. It entered into all public and domestic festivities. In <a onClick="return mV(\'Psa\',81,2);">Ps 81:2</a>, the kinnor is called "pleasant," and <a onClick="return mV(\'Isa\',24,8);">Isa 24:8</a> speaks of the "joy" of the kinnor. Very striking is the invocation <a onClick="return mV(\'Psa\',108,2);">Ps 108:2</a>: the poet in a moment of exhilarations calls upon the two kele shir to echo and share his enthusiasm for Yahweh. Only once (<a onClick="return mV(\'Isa\',16,11);">Isa 16:11</a>) is the kinnor associated with mourning, and Cheyne infers from this passage "the kinnor was used at mourning ceremonies." But the inference is doubtful; the prophet is merely drawing a comparison between the trembling of the strings of the lyre and the agitation in his own bosom. Again, the Babylonian captives hang their kinnoroth on the willows in their dejection (<a onClick="return mV(\'Psa\',137,2);">Ps 137:2</a>), and the prophets (<a onClick="return mV(\'Isa\',24,8);">Isa 24:8</a>; <a onClick="return mV(\'Eze\',26,13);">Eze 26:13</a>) threaten that as a punishment for sin the sound of the kinnor will cease.<P>(2) Materials.<P>We have no exact information as to the materials of which these instruments were made. In <a onClick="return mV(\'2Sa\',6,5);">2Sa 6:5</a> the King James Version, mention is made of "instruments made of fir wood" (the English Revised Version "cypress"), but the text is probably corrupt, and the reading in <a onClick="return mV(\'1Ch\',13,8);">1Ch 13:8</a> is preferable. According to <a onClick="return mV(\'1Ki\',10,11);">1Ki 10:11</a>f; Hiram\'s fleet brought from Ophir quantities of \'almugh (<a onClick="return mV(\'2Ch\',2,8);">2Ch 2:8</a>; <a onClick="return mV(\'2Ch\',9,10);">9:10</a>, \'algum) wood, from which, among other things, the kinnor and nebhel were made. Probably this was red sandal-wood. Josephus (Ant., VIII, iii) includes among articles made by Solomon for the temple nebhalim and kinnoroth of electrum. Whether we understand this to have been the mixed metal so named or amber, the frame of the instrument could not have been constructed of it. It may have been used for ornamentation.<P>We have no trace of metal strings being used by the ancients. The strings of the Hebrew (minnim) may have consisted of gut. We read of sheep-gut being employed for the purpose in the Odyssey, xxi. 407. Vegetable fiber was also spun into strings. We need only add that bowed instruments were quite unknown; the strings were plucked with the fingers, or struck with a plectrum.<P>(a) The Kinnor:<P>The Old Testament gives us no clue to the form or nature of the kinnor, except that it was portable, comparatively light, and could be played while it was carried in processions or dances. The earliest authority to which we can refer on the subject is the Septuagint. While in some of the books kinnor is rendered by kinnura, or kinura—evidently a transliteration—in others it is translated by kithara. We cannot discuss here the question of the trustworthiness of the Septuagint as an authority for Hebrew antiquities, but considering the conservatism of the East, especially in matters of ritual, it seems at least hasty to say offhand, as Wellhausen does, that by the date of its production the whole tradition of ancient music had been lost. The translation, at all events, supplies us with an instrument of which the Hebrews could hardly have been ignorant. The kithara, which in its general outlines resembled the lyre, consisted of a rectilinear-shaped sound box from which rose two arms, connected above by a crossbar; the strings ran down from the latter to the sound-box, to which, or to a bridge on which, they were attached.<P>The most ancient copy of a kithara in Egypt was found in a grave of the XIIth Dynasty. It is carried by one of a company of immigrant captive Semites, who holds it close to his breast, striking the strings with a plectrum held in his right hand, and plucking them with the fingers of the left. The instrument is very primitive; it resembles a schoolboy\'s slate with the upper three-fourths of the slate broken out of the frame; but it nevertheless possesses the distinctive characteristics of the kithara. In a grave at Thebes of a somewhat later date, three players are depicted, one of whom plays a kithara, also primitive in form, but with slenderer arms. Gradually, as time advanced, the simple board-like frame assumed a shape more like that afterward elaborated by the Greeks. Numerous examples have been found in Asia Minor, but further developed, especially as regards the sound-box. It may be noted that, in the Assyrian monuments, the kithara is played along with the harp, as the kinnor was with the nebhel.<P>The evidence furnished by Jewish coins must not be overlooked. Those stamped with representations of lyre-shaped instruments have been assigned to 142-135 BC, or to 66-70 AD. On one side we have a kithara-like instrument of 3 or more strings, with a sound-box resembling a kettle. It is true that these coins are of a late date, and the form of the instruments shown on them has obviously been modified by Greek taste, but so conservative a people as the Jews would hardly be likely to adopt an essentially foreign object for their coinage.<P>One objection raised by Wellhausen to the identification of the kithara with the kinnor may be noted. Josephus undoubtedly says (Ant., VII, xii) that the kinnura was played with a plectrum, and in <a onClick="return mV(\'1Sa\',16,23);">1Sa 16:23</a> David plays the kinnor "with his hand." But even if this excludes the use of the plectrum in the particular case, it need not be held to disprove the identity of kinnor and kinnura. Both methods may have been in use. In paintings discovered at Herculaneum there are several instances of the lyre being played with the hand; and there is no reason for supposing that the Hebrews were restricted to one method of showing their skill, when we know that Greeks and Latins were not.<P>Since the ancient VSS, then, render kinnor by kithara, and the kithara, though subsequently developed and beautified by the Greeks, was originally a Semitic instrument, it is exceedingly probable, as Riehm says, "that we have to regard the ancient Hebrew kinnor, which is designated a kithara, as a still simpler form of the latter instrument. The stringed instruments on the Jewish coins are later, beautified forms of the kinnor, intermediate stage Egyptian modifications represent the intermediate stage."<P>(b) The Nebhel:<P>The nebhel has been identified with many instruments. The literal meaning of the word, "wine-skin," has suggested that it was the bagpipe! Others have thought that it was the lute, and this is supported by reference to the Egyptian nfr, which denotes a lute-like instrument frequently depicted on the monuments. The derivation of "nbl" from "nfr" is, however, now abandoned; and no long-necked instrument has been found depicted in the possession of a Semite. The kissar was favored by Pfeiffer. Its resonance-box is made of wood, and, the upper side, being covered tightly by a skin, closely resembles a drum. From this rise two arms, connected toward the top by a crossbar; and to the latter the strings are attached. The kissar has, however, only 5 strings, as opposed to 12 ascribed by Josephus to the nebhel, and the soundbox, instead of being above, as stated by the Fathers, is situated below the strings.<P>The supposition that the nebhel was a dulcimer is not without some justification. The dulcimer was well known in the East. An extremely interesting and important bas-relief in the palace at Kouyunjik represents a company of 28 musicians, of whom 11 are instrumentalists and 15 singers. The procession is headed by 5 men, 3 carrying harps, one a double flute, and one a dulcimer. Two of the harpists and the dulcimer-player appear to be dancing or skipping. Then follow 6 women; 4 have harps, one a double flute, and one a small drum which is fixed upright at the belt, and is played with the fingers of both hands. Besides the players, we see 15 singers, 9 being children, who clap their hands to mark the rhythm. One of the women is holding her throat, perhaps to produce the shrill vibrate affected by Persian and Arabian women at the present day. The dulcimer in this picture has been regarded by several Orientalists as the nebhel. Wettstein, e.g., says "This instrument can fairly be so designated, if the statement of so many witnesses is correct, that nablium and psalterium are one and the same thing. For the latter corresponds to the Arabic santir, which is derived from the Hebrew pecanterin, a transliteration of the Greek psalterion." And the santir is a kind of dulcimer.<P>This is not conclusive. The word psalterion was not always restricted to a particular instrument, but sometimes embraced a whole class of stringed instruments. Ovid also regarded the nabla as a harp, not a dulcimer, when he said (Ars Am. iii.329): "Learn to sweep the pleasant nabla with both hands." And, lastly, Josephus tells us (Ant., VII, xii) that the nebhel was played without a plectrum. The translation of nebhel by psalterion does not, therefore, shut us up to the conclusion that it was a dulcimer; on the contrary, it rather leads to the belief that it was a harp.<P>Harps of various sizes are very numerous on the Egyptian monuments. There is the large and elaborate kind with a well-developed sound-box, that served also as a pediment, at its base. This could not be the nebhel, which, as we have seen, was early portable. Then we have a variety of smear instruments that, while light and easily carried, would scarcely have been sonorous enough for the work assigned to the nebhel in the temple services. Berries, the more we learn of the relations of Egypt and Israel, the more dearly do we perceive how little the latter was influenced by the former. But the evidence of the Fathers, which need not be disregarded in a matter of this kind, is decisive against Egyptian harps of every shape and size. These have without exception the sound-box at the base, and Augustine (on <a onClick="return mV(\'Psa\',42,\'1-\');">Ps 42</a>) says expressly that the psalterium had its sound-box above. This is confirmed by statements of Jerome, Isidore, and others, who contrast two classes of instruments according to the position above or below of the sound-box, Jerome, further, likens the nebhel to the captial Greek letter delta.<P>All the evidence points to the nebhel having been the Assyrian harp, of which we have numerous examples in the ruins. We have already referred at length to the bas-relief at Kouyunjik in which it is played by 3 men and 4 women. It is portable, triangular, or, roughly, delta-shaped; it has a sound-box above that slants upward away from the player, and a horizontal bar to which the strings are attached about three-fourths of their length down. The number of the strings on the Assyrian harp ranges from 16 upward, but there may quite well have been fewer in some cases.<P>(c) Nebhel \'asor:<P>In <a onClick="return mV(\'Psa\',33,2);">Ps 33:2</a>; <a onClick="return mV(\'Psa\',144,9);">144:9</a>, "the psaltery of ten strings" is given as the rendering of nebhel \'asor; while in <a onClick="return mV(\'Psa\',91,3);">Ps 91:3</a> \'asor is translated "instrument of ten strings." No doubt, as we have just said above, there were harps of less and greater compass—the mention of the number of strings in two or three instances does not necessarily imply different kinds of harps.<P>(d) Gittith:<P>The word gittith is found in the titles of <a onClick="return mV(\'Psa\',8,\'1-\');">Ps 8</a>; <a onClick="return mV(\'Psa\',81,\'1-\');">81</a>; <a onClick="return mV(\'Psa\',84,\'1-\');">84</a>. It is a feminine adjective derived from Gath, but its meaning is quite uncertain. It has been explained to denote (i) some Gittite instrument; the Targum, on <a onClick="return mV(\'Psa\',8,1);">Ps 8</a>, gives "on the kithara which was brought from Gath"; or (ii) a melody or march popular in Gath. The Septuagint renders "concerning the vintage," and may have regarded these psalms as having been sung to a popular melody. See above.<P>(e) The Shalishim:<P>Shalishim occurs in <a onClick="return mV(\'1Sa\',18,6);">1Sa 18:6</a>, where it is rendered "instruments of music," the Revised Version margin "triangles, or three stringed instruments." The word seems from the context to represent a musical instrument of some sort, but which is very uncertain. Etymology points to a term involving the number three. The small triangular harp, or trigon, has been suggested, but it would hardly have made its presence felt among a number of drums or tambourines. If the shalishim was a harp, it might very well be the nebhel, which was also triangular. There is no evidence that the triangle was used by Semitic people, or we might have taken it to be the instrument referred to. If it was a percussion instrument, it might possibly be a three-ringed or three-stringed sistrum.<P>(f) The Cabbekha\':<P>Among the instruments mentioned in <a onClick="return mV(\'Dan\',3,5,7,10);">Da 3:5,7,10</a> occurs the cabbekha\' translated in the King James Version and the Revised Version (British and American) "sackbut," i.e. a trombone, why, it is impossible to say. The Septuagint renders the word by sambuke, and this is an instrument frequently mentioned by Greek and Latin writers. Though it is nowhere described, it was no doubt a harp, probably of high pitch. It was a favorite of dissolute women, and we frequently see in their hands in mural pictures a small triangular harp, possibly of a higher range than the trigon.<P>(g) Neghinoth:<P>The word neghinoth occurs in the title of 6 psalms, and in the singular in two others; it is also found elsewhere in the Old Testament. Derived from naghan, "to touch," especially to play on a stringed instrument (compare <a onClick="return mV(\'Psa\',68,25);">Ps 68:25</a>, where the players, noghenim, are contrasted with the singers, harim), it evidently means stringed instruments in general.<P>2. Winds:<P>(1) The \'Ughabh.<P>The first mention of a wind instrument occurs in <a onClick="return mV(\'Gen\',4,21);">Ge 4:21</a>, where we are told that Jubal was the "father of all such as handle the harp and pipe." The Hebrew word here translated "pipe" is \'ughabh. It occurs in 3 other places: <a onClick="return mV(\'Job\',21,12);">Job 21:12</a>; <a onClick="return mV(\'Job\',30,31);">30:31</a>; <a onClick="return mV(\'Psa\',150,4);">Ps 150:4</a>. In the Hebrew version of <a onClick="return mV(\'Dan\',3,5);">Da 3:5</a> it is given as the rendering of sumponyah, i.e. "bagpipe." Jerome translations by organon. The \'ughabh was probably a primitive shepherd\'s pipe or panpipe, though some take it as a general term for instruments of the flute kind, a meaning that suits all the passages cited.<P>(2) The Chalil.<P>The chalil is first mentioned in <a onClick="return mV(\'1Sa\',10,5);">1Sa 10:5</a>, where it is played by members of the band of prophets. It was used (<a onClick="return mV(\'1Ki\',1,40);">1Ki 1:40</a>) at Solomon\'s accession to the throne; its strains added to the exhilaration of convivial parties (<a onClick="return mV(\'Isa\',5,12);">Isa 5:12</a>), accompanied worshippers on their joyous march the sanctuary (<a onClick="return mV(\'Isa\',30,29);">Isa 30:29</a>), or, in turn, echoed the feelings of mourners (<a onClick="return mV(\'Jer\',48,36);">Jer 48:36</a>). In 1Macc 3:45, one of the features of the desolation of the temple consisted in the cessation of the sound of the pipe. From this we see that Ewald\'s assertion that the flute took no part in the music of the temple is incorrect, at least for the Second the Temple.<P>As we should expect from the simplicity of its construction, and the commonness of its material, the flute or pipe was the most ancient and most widely popular of all musical instruments.<P>Reeds, cane, bone, afterward ivory, were the materials; it was the easiest thing in the world to drill out the center, to pierce a few holes in the rind or bark, and, for the mouthpiece, to compress the tube at one end. The simple rustic pattern was soon improved upon. Of course, nothing like the modern flute with its complicated mechanism was ever achieved, but, especially on the Egyptian monuments, a variety of patterns is found. There we see the obliquely held flute, evidently played, like the Arabic nay, by blowing through a very slight paring of the lips against the edge of the orifice of the tube. Besides this, there are double flutes, which, though apparently an advance on the single flute, are very ancient. These double flutes are either of equal or unequal length, and are connected near the mouth by a piece of leather, or enter the frame of the mouthpiece.<P>Though the flutes of the East and West resembled each other more closely than the strings, it is to the Assyrian monuments that we must turn for the prototypes of the chalil. The Greeks, as their myths show, regarded Asia Minor as the birthplace of the flute, and no doubt the Hebrews brought it with them from their Assyrian home. In the Kouyunjik bas-relief we see players performing on the double flute. It is apparently furnished with a beaked mouthpiece; like that of the clarinet or flageolet. We cannot determine whether the Israelites used the flute with a mouthpiece, or one like the nay; and it is futile to guess. It is enough to say that they had opportunities of becoming acquainted with both kinds, and may have adopted both.<P>(3) Nechiloth.<P>Nechiloth occurs only in the title of <a onClick="return mV(\'Psa\',5,\'1-\');">Ps 5</a>. The context suggests that it is a musical term, and we explain neginoth as a general term for strings, this word may comprehend the wood-winds. the Revised Version margin renders "wind instruments."<P>(4) Neqebh.<P>In <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a> the King James Version, the Revised Version (British and American), neqabhim is rendered pipes. This translation is supported by Fetis: the double flute; Ambros: large flutes; and by Jahn: the nay or Arab flute. It is now, however abandoned, and Jerome\'s explanation that neqebh means the "setting" of precious stones is generally adopted.<P>(5) The Mashroqitha\'.<P>Mashroqitha\', found in <a onClick="return mV(\'Dan\',3,5);">Da 3:5</a>, etc., is also referred to the wood-winds. The word is derived from sharaq, "to hiss" (compare <a onClick="return mV(\'Isa\',5,26);">Isa 5:26</a>, where God hisses to summon the Gentiles). The Septuagint translates surigx or panpipes, and this is most probably the meaning.<P>(6) The Cumponyah.<P>Cumponyah (in Chaldaic sumponia) is another name for a musical instrument found in <a onClick="return mV(\'Dan\',3,5);">Da 3:5</a>, etc. It is generally supposed to have been the bagpipe, an instrument that at one time was exceedingly popular, even among highly civilized peoples. Nero is said to have been desirous of renown as a piper.<P>(7) The Shophar Qeren.<P>The shophar was a trumpet, curved at the end like a horn (qeren), and no doubt originally was a horn. The two words shophar and qeren are used synonymously in <a onClick="return mV(\'Jos\',6,4,5);">Jos 6:4,5</a>, where we read shophar ha-yobhelim and qeren ha-yobhel. With regard to the meaning of hayobhel, there is some difference of opinion. The Revised Version (British and American) renders in text "ram\'s horn," in the margin "jubilee." The former depends on a statement in the Talmud that yobhel is Arabic for "ram\'s horn," but no trace of such a word has been found in Arabic. A suggestion of Pfeiffer\'s that yobhel does not designate the instrument, but the manner of blowing, is advocated by J. Weiss. It gives a good sense in the passages in which yobhel occurs in connection with shophar or qeren. Thus in <a onClick="return mV(\'Jos\',6,5);">Jos 6:5</a>, we would translate, "when the priests blow triumph on the horn."<P>The shophar was used in early times chiefly, perhaps exclusively, for warlike purposes. It gave the signal "to arms" (<a onClick="return mV(\'Jdg\',6,34);">Jud 6:34</a>; <a onClick="return mV(\'1Sa\',13,3);">1Sa 13:3</a>; <a onClick="return mV(\'2Sa\',20,1);">2Sa 20:1</a>); warned of the approach of the enemy (<a onClick="return mV(\'Amo\',3,6);">Am 3:6</a>; <a onClick="return mV(\'Eze\',33,6);">Eze 33:6</a>; <a onClick="return mV(\'Jer\',4,5);">Jer 4:5</a>; <a onClick="return mV(\'Jer\',6,1);">6:1</a>); was heard throughout a battle (<a onClick="return mV(\'Amo\',2,2);">Am 2:2</a>, etc.); and sounded the recall (<a onClick="return mV(\'2Sa\',2,28);">2Sa 2:28</a>). Afterward it played an important part in connection with religion. It was blown at the proclamation of the Law (<a onClick="return mV(\'Exd\',19,13);">Ex 19:13</a>, etc.); and at the opening of the Year of Jubilee (<a onClick="return mV(\'Lev\',25,9);">Le 25:9</a>); heralded the approach of the Ark (<a onClick="return mV(\'2Sa\',6,15);">2Sa 6:15</a>); hailed a new king (<a onClick="return mV(\'2Sa\',15,10);">2Sa 15:10</a>); and is prophetically associated with the Divine judgment and restoration of the chosen people from captivity (<a onClick="return mV(\'Isa\',18,3);">Isa 18:3</a>, and often).<P>(8) The Chatsotseroth.<P>We are told (<a onClick="return mV(\'Num\',10,2);">Nu 10:2</a>) that Moses was commanded to make two silver trumpets which should serve to summon the people to the door of the tabernacle; give the signal for breaking up the camp; or call to arms. These instruments were the hatsotseroth, which differed from the shophar in that they were straight, not curved, were always made of metal, and were only blown by the priests. They are shown on the Arch of Titus and on Jewish coins, and are described by Josephus (Ant., III, xii, 6). The latter says: "In length it was not quite a yard. It was composed of a narrow tube somewhat thicker than a flute, widened slightly at the mouth to catch the breath, and ended in the form of a bell, like the common trumpets."<P>3. Percussion Instruments:<P>(1) The Toph.<P>The principal percussion instrument, the toph, is represented in English Versions of the Bible by "tabret" and "timbre," two words of different origin. "Tabret" is derived from Arabic tanbur, the name of a sort of mandolin. "Timbre" comes from Latin-Greek tympanum, through the French timbre, a small tambourine. The Arabs of today possess an instrument called the duf, a name that corresponds to the Hebrew toph. The duf is a circle of thin wood 11 inches in diameter and 2 inches in depth. Over this is tightly stretched a piece of skim, and in the wood are 5 openings in which thin metal disks are hung loosely; these jingle when the duf is struck by the hand. The toph probably resembled the duf.<P>Other drums are shown on the Egyptian and Assyrian monuments. In the Kouyunjik bas-relief the second last performer beats with his hands a small, barrel-like drum fixed at his waist. In the Old Testament the drum is used on festive occasions; it is not mentioned in connection with Divine service. It was generally played by women, and marked the time at dances or processions (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>; <a onClick="return mV(\'Jdg\',11,34);">Jud 11:34</a>; <a onClick="return mV(\'1Sa\',18,6);">1Sa 18:6</a>; <a onClick="return mV(\'Jer\',31,4);">Jer 31:4</a>; <a onClick="return mV(\'Psa\',150,4);">Ps 150:4</a>). At banquets (<a onClick="return mV(\'Isa\',24,8);">Isa 24:8</a>; <a onClick="return mV(\'Isa\',30,32);">30:32</a>; <a onClick="return mV(\'Job\',21,12);">Job 21:12</a>) and at marriages (1Macc 9:39) it accompanied the kinnor and nebhel. In solemn processions it was also occasionally played by men.<P>(2) Metsiltayim, Tseltselim.<P>In <a onClick="return mV(\'1Ch\',15,19);">1Ch 15:19</a> we read that "Heman, Asaph, and Ethan, were appointed, with cymbals of brass to sound aloud." These cymbals are the metsiltayim (in two places tseltselim). They were very popular in Egypt. A pair made of copper and silver has been found in a grave in Thebes. They are about 5 inches in diameter and have handles fixed in the center. In the Kouyunjik bas-relief we see cymbals of another pattern. These are conical, and provided with handles.<P>Cylindrical staves slightly bent at one end were also used in Egyptian processions. Villoteau, quoted by J. Weiss, describes a bas-relief in which three musicians are seen, of whom one plays the harp, a second the double flute, while a third appears to be marking time by striking two short rods together; this was a method of conducting practiced regularly by other ancient nations.<P>(3) Mena\'an\'im.<P>Lastly in <a onClick="return mV(\'2Sa\',6,5);">2Sa 6:5</a> we meet with a word that occurs nowhere else, and whose meaning is quite uncertain. the King James Version translates "cornets," the Revised Version (British and American) "castanets," and in the margin "sistra." The mena\'an\'im may have been the sistrum, an instrument formed of two thin, longish plates, bent together at the top so as to form an oval frame, and supplied with a handle at the lower end. One or more bars were fixed across this frame, and rings or disks loosely strung on these made a jingling noise when the instrument was shaken. This interpretation is supported by the derivation of the word, the Vulgate, and the rabbins.<P>LITERATURE.<P>Pfeiffer, Uber die Musik der alten Hebraer; Saalschutz, Form der heb. Poesie, etc.; Leyrer in RE; Riehm, Handwort. des bibl. Alterthums; Histories of Music by Fetis, Ambros, Rowbotham, Naumann, and Chappell; Wilkinson, Ancient Egypt; Wettstein in Del. Commentary on Isaiah; Lane, Modern Egyptians; Stainer, The Music of the Bible; Edersheim, The Temple, etc.; Wellhausen, "The Pss" in Polychrome Bible; Benzinger, HA; Nowack, HA; J. Weiss, Die mus. Instr. des AT; C. Engel, Music of the Most Ancient Nations; Vigoureux, Lea instruments de musique de la Bible; Driver, Joel and Amos; Cornill, Music in the Old Testament; and the various Bible Dictionaries.``120';
isbe[6210]='Musical Instruments`mu\'-zi-kal in\'-stroo-ments (shiddah we-shiddoth): "I gat me...musical instruments, and that of all sorts" (<a onClick="return mV(\'Ecc\',2,8);">Ec 2:8</a>). Thus the King James Version and the American Standard Revised Version; the English Revised Version and the American Revised Version margin "concubines very many." The word occurs only here; the meaning is not certain, but it has nothing to do with music.``1';
isbe[6211]='Musician; Chief`mu-zish\'-an.`<a href="./study/isbe/search.html?string=ASAPH">ASAPH</a>; <a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>; <a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[6212]='Mustard`mus\'-tard (sinapi (<a onClick="return mV(\'Mat\',13,31);">Mt 13:31</a>; <a onClick="return mV(\'Mar\',4,31);">Mr 4:31</a>; <a onClick="return mV(\'Luk\',13,19);">Lu 13:19</a>; <a onClick="return mV(\'Mat\',17,20);">Mt 17:20</a>; <a onClick="return mV(\'Luk\',17,6);">Lu 17:6</a>)): The minuteness of the seed is referred to in all these passages, while in the first three the large size of the herb growing from it is mentioned. In <a onClick="return mV(\'Mat\',13,32);">Mt 13:32</a> it is described as "greater than the herbs, and becometh a tree" (compare <a onClick="return mV(\'Luk\',13,19);">Lu 13:19</a>); in <a onClick="return mV(\'Mar\',4,32);">Mr 4:32</a> it "becometh greater than all the herbs, and putteth out great branches." Several varieties of mustard (Arabic, khardal) have notably small seed, and under favorable conditions grow in a few months into very tall herbs—10 to 12 ft. The rapid growth of an annual herb to such a height must always be a striking fact. Sinapis nigra, the black mustard, which is cultivated, Sinapis alba, or white mustard, and Sinapis arvensis, or the charlock (all of Natural Order Cruciferae), would, any one of them, suit the requirements of the parable; birds readily alight upon their branches to eat the seed (<a onClick="return mV(\'Mat\',13,32);">Mt 13:32</a>, etc.), not, be it noted, to build their nests, which is nowhere implied.<P>Among the rabbis a "grain of mustard" was a common expression for anything very minute, which explains our Lord\'s phrase, "faith as a grain of mustard seed" (<a onClick="return mV(\'Mat\',17,20);">Mt 17:20</a>; <a onClick="return mV(\'Luk\',17,6);">Lu 17:6</a>).<P>The suggestion that the New Testament references may allude to a tall shrub Salvadora persica, which grows on the southern shores of the Dead Sea, rests solely upon the fact that this plant is sometimes called khardal by the Arabs, but it has no serious claim to be the sinapi of the Bible.``117';
isbe[6213]='Muth-Labben`muth-lab\'-en (muth labben, "death of Ben," or "of the son"; <a onClick="return mV(\'Psa\',9,1);">Ps 9, title</a>).`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[6214]='Mutilation`mu-ti-la\'-shun.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[6215]='Mutter`mut\'-er (haghah (<a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>; <a onClick="return mV(\'Isa\',59,3);">59:3</a>)): An onomatopoetic word, used of the growling of a lion (<a onClick="return mV(\'Isa\',31,4);">Isa 31:4</a>), of the "mourning" of a dove (<a onClick="return mV(\'Isa\',38,14);">Isa 38:14</a>), or of the human voice, whether speaking inarticulately (<a onClick="return mV(\'Isa\',16,7);">Isa 16:7</a>) or articulately (<a onClick="return mV(\'Psa\',37,30);">Ps 37:30</a>, "The mouth of the righteous talketh of wisdom" compare <a onClick="return mV(\'Job\',27,4);">Job 27:4</a>; <a onClick="return mV(\'Pro\',8,7);">Pr 8:7</a>, etc.). Hence, it is only the context that can give to haghah the meaning "mutter." No such meaning can be gathered from the context of <a onClick="return mV(\'Isa\',59,3);">Isa 59:3</a>, and, in fact, the open shamelessness of the sinners seems to be in point. So the verse should be rendered, "Your lips have spoken lies, your tongue uttereth wickedness." In <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a> haghah describes the tone of voice used by the necromancers in uttering their formulas, "that chirp and that mutter." That this tone was subdued and indistinct is quite probable.`<a href="./study/isbe/search.html?string=PEEP">PEEP</a>`48';
isbe[6216]='Muzzle`muz\'l (chacam; phimoo) According to the Deuteronomic injunction (<a onClick="return mV(\'Deu\',25,4);">De 25:4</a>), the ox was not to be muzzled while treading the grain, i.e. threshing. The muzzle was a guard placed on the mouth of the oxen to prevent them from biting or eating. The threshing ox would have ample opportunity of feeding (compare <a onClick="return mV(\'Hsa\',10,11);">Ho 10:11</a>). The Deuteronomic injunction is quite in accordance with the humane spirit which inspires it all through. Paul quotes this law in two places (<a onClick="return mV(\'1Cr\',9,9);">1Co 9:9</a>; <a onClick="return mV(\'1Ti\',5,18);">1Ti 5:18</a>) to illustrate his view that the "laborer is worthy of his hire."``103';
isbe[6217]='Myndus`min\'-dus (Mundos): A city of Asia Minor, situated at the extreme western end of a peninsula jutting into the sea (see <a href="./study/isbe/search.html?string=CARIA">CARIA</a>). It seems that the city was independent at an early date and that many Jews lived there, for according to 1Macc 15:23, it was one of the several places to which the Roman senate, in the year 139 BC, sent a letter in their behalf. The place was important only because of the silver mines in its vicinity. The mines were worked from a very early period, even to the Middle Ages, and have therefore given to the place the modern Turkish name, Gumushlu, meaning a silver mine.``7';
isbe[6218]='Myra`mi\'-ra (Mura): A city of the ancient country of Lycia about 2 1/2 miles from the coast. Here, according to <a onClick="return mV(\'Act\',27,6);">Ac 27:6</a>, Paul found a grain ship from Alexandria. The city stood upon a hill formed by the openings of two valleys. At an early period Myra was of less importance than was the neighboring city Patara, yet later it became a prominent port for ships from Egypt and Cyprus, and Theodosius II made it the capital of the province. It was also famed as the seat of worship of an Asiatic deity whose name is no longer known. Nicholas, a bishop and the patron saint of sailors, is said to have been buried in a church on the road between Myra and Andraki, the port. Here an Arab fleet was destroyed in 807. In 808 Haroun al-Rashid, the renowned kalif of Bagdad, took the city, and here Saewulf landed on his return from Jerusalem. Dembre is the modern name of the ruins of Myra, which are among the most imposing in that part of Asia Minor. The elaborate details of the decoration of theater are unusually well preserved, and the rock-hewn tombs about the city bear many bas-reliefs and inscriptions of interest. On the road to Andraki the monastery of Nicholas may still be seen.``7';
isbe[6219]='Myrrh`mur:<P>(1) (mor or mowr; Arabic murr]): This substance is mentioned as valuable for its perfume (<a onClick="return mV(\'Psa\',45,8);">Ps 45:8</a>; <a onClick="return mV(\'Pro\',7,17);">Pr 7:17</a>; <a onClick="return mV(\'Sgs\',3,6);">So 3:6</a>; <a onClick="return mV(\'Sgs\',4,14);">4:14</a>), and as one of the constituents of the holy incense (<a onClick="return mV(\'Exd\',30,23);">Ex 30:23</a>; see also <a onClick="return mV(\'Sgs\',4,6);">So 4:6</a>; <a onClick="return mV(\'Sgs\',5,1,5,13);">5:1,5,13</a>). Mor is generally identified with the "myrrh" of commerce, the dried gum of a species of balsam (Balsamodendron myrrha). This is a stunted tree growing in Arabia, having a light-gray bark; the gum resin exudes in small tear-like drops which dry to a rich brown or reddish-yellow, brittle substance, with a faint though agreeable smell and a warm, bitter taste. It is still used as medicine (<a onClick="return mV(\'Mar\',15,23);">Mr 15:23</a>). On account, however, of the references to "flowing myrrh" (<a onClick="return mV(\'Exd\',30,23);">Ex 30:23</a>) and "liquid myrrh" (<a onClick="return mV(\'Sgs\',5,5,13);">So 5:5,13</a>), Schweinfurth maintains that mor was not a dried gum but the liquid balsam of Balsamodendron opobalsamum.<P>Whichever view is correct, it is probable that the smurna, of the New Testament was the same. In <a onClick="return mV(\'Mat\',2,11);">Mt 2:11</a> it is brought by the "Wise men" of the East as an offering to the infant Saviour; in <a onClick="return mV(\'Mar\',15,23);">Mr 15:23</a> it is offered mingled with wine as an anesthetic to the suffering Redeemer, and in <a onClick="return mV(\'Jhn\',19,39);">Joh 19:39</a> a "mixture of myrrh and aloes" is brought by Nicodemus to embalm the sacred body.<P>(2) (loT, stakte; translated "myrrh" in <a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>, margin "ladanum"; <a onClick="return mV(\'Gen\',43,11);">43:11</A>): The fragrant resin obtained from some species of cistus and called in Arabic ladham, in Latin ladanum. The cistus or "rock rose" is exceedingly common all over the mountains of Palestine (see <a href="./study/isbe/search.html?string=BOTANY">BOTANY</a>), the usual varieties being the C. villosus with pink petals, and the C. salviifolius with white petals. No commerce is done now in Palestine in this substance as of old (<a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>; <a onClick="return mV(\'Gen\',43,11);">43:11</a>), but it is still gathered from various species of cistus, especially C. creticus in the Greek Isles, where it is collected by threshing the plants by a kind of flail from which the sticky mass is scraped off with a knife and rolled into small black balls. In Cyprus at the present time the gum is collected from the beards of the goats that browse on these shrubs, as was done in the days of Herodotus iii.112).`<a href="./study/isbe/search.html?string=BALSAM">BALSAM</a>`117';
isbe[6220]='Myrtle`mur\'-t\'-l (hadhac; mursine (<a onClick="return mV(\'Isa\',41,19);">Isa 41:19</a>; <a onClick="return mV(\'Isa\',55,13);">55:13</a>; <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>; <a onClick="return mV(\'Zec\',1,8,10);">Zec 1:8,10</a>f); also as a name in Hadassah in <a onClick="return mV(\'Est\',2,7);">Es 2:7</a>, the Jewish form of <a href="./study/isbe/search.html?string=ESTHER">ESTHER</a> (which see)): The myrtle, Myrtus communis (Natural Order Myrtaceae), is a very common indigenous shrub all over Palestine. On the bare hillsides it is a low bush, but under favorable conditions of moisture it attains a considerable height (compare <a onClick="return mV(\'Zec\',1,8,10);">Zec 1:8,10</a>). It has dark green, scented leaves, delicate starry white flowers and dark-colored berries, which are eaten. In ancient times it was sacred to Astarte. It is mentioned as one of the choice plants of the land (<a onClick="return mV(\'Isa\',41,19);">Isa 41:19</a>). "Instead of the thorn shall come up the fir-tree; and instead of the brier shall come up the myrtle-tree" (<a onClick="return mV(\'Isa\',55,13);">Isa 55:13</a>), is one of the prophetic pictures of God\'s promised blessings. It was one of the trees used in the Feast of Tabernacles (<a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>): "<a href="./study/isbe/search.html?string=THICK+TREES">the branches of thick trees</a>" (which see) are interpreted in the Talmud (Cuk. 3 4; Yer Cuk. 3, 53rd) as myrtle boughs; also (id) the "<a href="./study/isbe/search.html?string=THICK+TREES">thick trees</a>" of <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a> as "wild myrtle." Myrtle twigs, particularly those of the broadleaved variety, together with a palm branch and twigs of willow, are still used in the ritual of the Feast of Tabernacles. For many references to myrtle in Jewish writings see Jewish Encyclopedia, IX, 137.``117';
isbe[6221]='Mysia`mish\'-i-a (Musia): A country in the northwestern part of Asia Minor, which formed an important part of the Roman province of Asia. Though its boundaries were always vague, it may be said to have extended on the north to the Sea of Marmora on the east to Bithynia and Phrygia, on the south to Lydia, and on the west to Hellespont. According to some authors it included the Troad. Its history is chiefly that of important cities, of which Assos, Troas, and Adramyttium on the border of Lydia, are mentioned in the New Testament. When Mysia became a part of the Roman province of Asia in 190 BC, its old name fell into disuse, and it was then generally known as the Hellespontus. According to <a onClick="return mV(\'Act\',16,7,8);">Ac 16:7,8</a>, Paul passed through the country, but without stopping to preach, until he reached Troas on the coast, yet tradition says that he founded churches at Poketos and Cyzicus. Onesiphorus, who was martyred some time between 109 and 114 AD, during the proconsulate of Adrian, is supposed to have evangelized this part of Asia. See The Expository Times, IX, 495 f.``7';
isbe[6222]='Mystery`mis\'-ter-i (musterion; from mustes, "one initiated into mysteries"; mueo "to initiate," muo, "to close" the lips or the eyes; stem mu-, a sound produced with closed lips; compare Latin mutus, "dumb"): Its usual modern meaning (equals something in itself obscure or incomprehensible, difficult or impossible to understand) does not convey the exact sense of the Greek musterion, which means a secret imparted only to the initiated, what is unknown until it is revealed, whether it be easy or hard to understand. The idea of incomprehensibility if implied at all, is purely accidental. The history of the word in ancient paganism is important, and must be considered before we examine its Biblical usage.<P>1. In Ancient Pagan Religions:<P>In the extant classics, the singular is found once only (Menander, "Do not tell thy secret (musterion) to thy friend"). But it is frequently found in the plural ta musteria, "the Mysteries," the technical term for the secret rites and celebrations in ancient religions only known to, and practiced by, those who had been initiated. These are among the most interesting, significant, and yet baffling religious phenomena in the Greek-Roman world, especially from the 6th century BC onward. In proportion as the public cults of the civic and national deities fell into disrepute, their place came more and more to be filled by secret cults open only to those who voluntarily underwent elaborate preliminary preparations. There was scarcely one of the ancient deities in connection with whose worship there was not some subsidiary cult of this kind. The most famous were the Mysteries celebrated in Eleusis, under the patronage and control of the Athenian state, and associated with the worship of Demeter and her daughter Persephone. But there were many others of a more private character than the Eleusinian, e.g. the Orphic Mysteries, associated with the name of Dionysus. Besides the Greek Mysteries, mention should be made of the Egyptian cults of Isis and Serapis, and of Persian Mithraism, which in the 3rd century AD was widely diffused over the whole empire.<P>It is difficult in a brief paragraph to characterize the Mysteries, so elaborate and varied were they, and so completely foreign to the modern mind. The following are some of their main features:<P>(1) Their appeal was to the emotions rather than to the intellect. Lobeck in his famous Aglaophamus destroyed the once prevalent view that the Mysteries enshrined some profound religious truth or esoteric doctrine. They were rather an attempt to find a more emotional and ecstatic expression to religious aspiration than the public ceremonies provided. Aristotle (as quoted by Synesius) declared that the initiated did not receive definite instruction, but were put in a certain frame of mind (ou mathein ti dein alla pathein). This does not mean that there was no teaching, but that the teaching was vague, suggestive and symbolic, rather than didactic or dogmatic.<P>(2) The chief purpose of the rites seems to have been to secure for the rotaries mystic union with some deity and a guaranty of a blissful immortality. The initiated was made to partake mystically in the passing of the deity through death to life, and this union with his saviour-god (theos soter) became the pledge of his own passage through death to a happy life beyond. This was not taught as an esoteric doctrine; it was well known to outsiders that the Mysteries taught the greater blessedness of the initiated in the under-world; but in the actual ceremony the truth was vividly presented and emotionally realized.<P>(3) The celebrations were marked by profuse symbolism of word and action. They were preceded by rites of purification through which all the mystae had to pass. The celebrations themselves were in the main a kind of religious drama, consisting of scenic representations illustrating the story of some deity or deities, on the basis of the old mythologies regarded as allegories of Nature\'s productive forces and of human immortality; combined with the recital of certain mystic formulas by the hierophant (the priest). The culminating point was the epopteia, or full vision, when the hierophant revealed certain holy objects to the assembly.<P>(4) The cults were marked by a strict exclusiveness and secrecy. None but the initiated could be present at the services, and the knowledge of what was said and done was scrupulously kept from outsiders. What they had seen and heard was so sacred that it was sacrilege to divulge it to the uninitiated.<P>(5) Yet the Mysteries were not secret societies, but were open to all who chose to be initiated (except barbarians and criminals). They thus stood in marked contrast to the old civic and national cults, which were confined to states or cities. They substituted the principle of initiation for the more exclusive principle of birthright or nationality; and so foreshadowed the disintegration of old barriers, and prepared the way for the universal religion. Thus the mystery-religions strangely combined a strict exclusiveness with a kind of incipient catholicity. This brief account will show that the Mysteries were not devoid of noble elements. They formed "the serious part of pagan religion" (Renan). But it must also be remembered that they lent themselves to grave extravagances and abuses. Especially did they suffer from the fact that they were withheld from the light of healthy publicity.<P>2. In the Old Testament and the Apocrypha:<P>The religion of the Old Testament has no Mysteries of the above type. The ritual of Israel was one in which the whole people partook, through their representatives the priests. There was no system of ceremonial initiation by which the few had privileges denied to the many. God has His secrets, but such things as He revealed belonged to all (<a onClick="return mV(\'Deu\',29,29);">De 29:29</a>); so far from silence being enjoined concerning them, they were openly proclaimed (<a onClick="return mV(\'Deu\',6,7);">De 6:7</a>; <a onClick="return mV(\'Neh\',8,1);">Neh 8:1</a>). True piety alone initiated men into confidential intercourse with Yahweh (<a onClick="return mV(\'Psa\',25,14);">Ps 25:14</a>; <a onClick="return mV(\'Pro\',3,32);">Pr 3:32</a>). The term "mystery" never occurs in the English Old Testament. The Greek word musterion occurs in the Septuagint of the Old Testament. Only in Daniel, where it is found several times as the translation of raza\', "a secret," in reference to the king\'s dream, the meaning of which was revealed to Daniel (<a onClick="return mV(\'Dan\',2,18,19,\'27-30\',47);">2:18,19,27-30,47</a>).<P>In the Apocrypha, musterion is still used in the sense of "a secret" (a meaning practically confined to the Septuagint in extant Greek); of the secrets of private life, especially between friends (Sirach 22:22; 27:16,17,21), and of the secret plans of a king or a state (Tobit 12:7,11; Judith 2:2; 2Macc 13:21). The term is also used of the hidden purpose or counsel of God or of Divine wisdom. The wicked "knew not the mysteries of God," i.e. the secret counsels that govern God\'s dealings with the godly (The <span class="noTag">Wisdom of Solomon 2:22</span>); wisdom "is initiated [mustis] into the knowledge of God" (The <span class="noTag">Wisdom of Solomon 8:4</span>), but (unlike the pagan mystagogues) the writer declares he "will not hide mysteries," but will "bring the knowledge of her (wisdom) into clear light" (The <span class="noTag">Wisdom of Solomon 6:22</span>). Hatch maintains that the analogy here is that of an oriental king\'s secrets, known only to himself and his trusted friends (Essays in Biblical Greek, 58); but it is more likely that the writer here betrays the influence of the phraseology of the Greek Mysteries (without acquiescing in their teaching). In another passage, at any rate, he shows acquaintance with the secret rites of the Gentiles, namely, in The <span class="noTag">Wisdom of Solomon 14:15,23</span>, where the "solemn rites" and "secret mysteries" of idolaters are referred to with abhorrence. The term "mystery" is not used in reference to the special ritual of Israel.<P>3. In the New Testament:<P>In the New Testament the word occurs 27 or (if we include the doubtful reading in <a onClick="return mV(\'1Cr\',2,1);">1Co 2:1</a>) 28 times; chiefly in Paul (20 or 21 times), but also in one passage reported by each of the synoptists, and 4 times in Revelation. It bears its ancient sense of a revealed secret, not its modern sense of that which cannot be fathomed or comprehended.<P>(1) In a few passages, it has reference to a symbol, allegory or parable, which conceals its meaning from those who look only at the literal sense, but is the medium of revelation to those who have the key to its interpretation (compare the rabbinic use of raza\', and codh, "the hidden or mystic sense"). This meaning appears in <a onClick="return mV(\'Rev\',1,20);">Re 1:20</a>; <a onClick="return mV(\'Rev\',17,5,7);">17:5,7</a>; probably also in <a onClick="return mV(\'Eph\',5,32);">Eph 5:32</a>, where marriage is called "a mystery," i.e. a symbol to be allegorically interpreted of Christ and His church. It also seems implied in the only passage in which the word is attributed to our Lord, "Unto you is given the mystery of the kingdom of God: but unto them that are without, all things are done in parables" (<a onClick="return mV(\'Mar\',4,11);">Mr 4:11</a>; compare parallel <a onClick="return mV(\'Mat\',13,11);">Mt 13:11</a>; <a onClick="return mV(\'Luk\',8,10);">Lu 8:10</a>). Here parables are spoken of as a veiled or symbolic form of utterance which concealed the truth from those without the kingdom, but revealed it to those who had the key to its inner meaning (compare <a onClick="return mV(\'Mat\',13,35);">Mt 13:35</a>; <a onClick="return mV(\'Jhn\',16,29);">Joh 16:29</a> margin).<P>(2) By far the most common meaning in the New Testament is that which is so characteristic of Paul, namely, a Divine truth once hidden, but now revealed in the gospels. <a onClick="return mV(\'Rom\',16,25);">Ro 16:25</a>f might almost be taken as a definition of it, "According to my gospel and the preaching of Jesus Christ, according to the revelation of the mystery which hath been kept in silence through times eternal, but now is manifested" (compare <a onClick="return mV(\'Col\',1,26);">Col 1:26</a>; <a onClick="return mV(\'Eph\',3,3);">Eph 3:3</a>ff).<P>(a) It should be noted how closely "mystery" is associated with "revelation" (apokalupsis), as well as with words of similar import, e.g. "to make known" (<a onClick="return mV(\'Eph\',1,9);">Eph 1:9</a>; <a onClick="return mV(\'Eph\',3,3,5,10);">3:3,5,10</a>; <a onClick="return mV(\'Eph\',6,19);">6:19</a>), "to manifest" (<a onClick="return mV(\'Col\',4,3,4);">Col 4:3,4</a>; <a onClick="return mV(\'Rom\',16,26);">Ro 16:26</a>; <a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>). "Mystery" and "revelation" are in fact correlative and almost synonymous terms. The mysteries of Christianity are its revealed doctrines, in contrast to the wisdom of worldly philosophy (see especially <a onClick="return mV(\'1Cr\',2,\'1-16\');">1Co 2:1-16</a>; compare <a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>f); the point of contrast being, not that the latter is comprehensible while the former are obscure, but that the latter is the product of intellectual research, while the former are the result of Divine revelation and are spiritually discerned. (b) From this it follows that Christianity has no secret doctrines, for what was once hidden has now been revealed. But here arises a seeming contradiction. On the one hand, there are passages which seem to imply a doctrine of reserve. The mystery revealed to some would seem to be still concealed from others. The doctrines of Christ and of His Kingdom are hidden from the worldly wise and the prudent (<a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>; <a onClick="return mV(\'1Cr\',2,6);">1Co 2:6</a>), and from all who are outside the kingdom (<a onClick="return mV(\'Mat\',13,11);">Mt 13:11</a> and parallel), and there are truths withheld even from Christians while in an elementary stage of development (<a onClick="return mV(\'1Cr\',3,1);">1Co 3:1</a>ff; <a onClick="return mV(\'Hbr\',5,\'11-14\');">Heb 5:11-14</a>). On the other hand, there are many passages in which the truths of revelation are said to be freely and unreservedly communicated to all (e.g. <a onClick="return mV(\'Mat\',10,27);">Mt 10:27</a>; <a onClick="return mV(\'Mat\',28,19);">28:19</a>; <a onClick="return mV(\'Act\',20,20,27);">Ac 20:20,27</a>; <a onClick="return mV(\'2Cr\',3,12);">2Co 3:12</a>f; <a onClick="return mV(\'Eph\',3,9);">Eph 3:9</a>, "all men"; <a onClick="return mV(\'Eph\',6,19);">6:19</A>f; <a onClick="return mV(\'Col\',1,28);">Col 1:28</a>; <a onClick="return mV(\'1Ti\',2,4);">1Ti 2:4</a>). The explanation is that the communication is limited, not by any secrecy in the gospel message itself or any reserve on the part of the speaker, but by the receptive capacity of the hearer. In the case of the carnally-minded, moral obtuseness or worldliness makes them blind to the light which shines on them (<a onClick="return mV(\'2Cr\',4,\'2-4\');">2Co 4:2-4</a>). In the case of the "babe in Christ," the apparent reserve is due merely to the pedagogical principle of adapting the teaching to the progressive receptivity of the disciple (<a onClick="return mV(\'Jhn\',16,12);">Joh 16:12</a>f). There is no esoteric doctrine or intentional reserve in the New Testament. The strong language in <a onClick="return mV(\'Mat\',13,\'11-15\');">Mt 13:11-15</a> is due to the Hebrew mode of speech by which an actual result is stated as if it were purposive.<P>(c) What, then, is the content of the Christian "mystery"? In a wide sense it is the whole gospel, God\'s world-embracing purpose of redemption through Christ (e.g. <a onClick="return mV(\'Rom\',16,25);">Ro 16:25</a>; <a onClick="return mV(\'Eph\',6,19);">Eph 6:19</a>; <a onClick="return mV(\'Col\',2,2);">Col 2:2</a>; <a onClick="return mV(\'1Ti\',3,9);">1Ti 3:9</a>). In a special sense it is applied to some specific doctrine or aspect of the gospel, such as the doctrine of the Cross (<a onClick="return mV(\'1Cr\',2,1,7);">1Co 2:1,7</a>), of the Incarnation (<a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>), of the indwelling of Christ as the pledge of immortality (<a onClick="return mV(\'Col\',1,27);">Col 1:27</a>), of the temporary unbelief of the Jews to be followed by their final restoration (<a onClick="return mV(\'Rom\',11,25);">Ro 11:25</a>), of the transformation of the saints who will live to see the Second Advent (<a onClick="return mV(\'1Cr\',15,51);">1Co 15:51</a>), and of the inclusion of the Gentiles in the gospel salvation (<a onClick="return mV(\'Eph\',3,\'3-6\');">Eph 3:3-6</a>). These are the Divine secrets now at last disclosed. In direct antithesis to the Divine mystery is the "mystery of lawlessness" (<a onClick="return mV(\'2Th\',2,7);">2Th 2:7</a>) culminating in the coming of the Antichrist. Here, too, the word means a revealed secret, only in this case the revelation belongs to the future (<a onClick="return mV(\'2Th\',2,8);">2Th 2:8</a>), though the evil forces which are to bring about its consummation are already silently operative. (Besides the references in this paragraph, the word occurs in <a onClick="return mV(\'1Cr\',4,1);">1Co 4:1</a>; <a onClick="return mV(\'1Cr\',13,2);">13:2</a>; <a onClick="return mV(\'1Cr\',14,2);">14:2</a>; <a onClick="return mV(\'Rev\',10,7);">Re 10:7</a>. It is interesting to note that the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) sometimes renders musterion by Latin sacramentum, namely, in <a onClick="return mV(\'Eph\',1,9);">Eph 1:9</a>; <a onClick="return mV(\'Eph\',3,3,9);">3:3,9</a>; <a onClick="return mV(\'Eph\',5,32);">5:32</a>; <a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>; <a onClick="return mV(\'Rev\',1,20);">Re 1:20</a>. This rendering in <a onClick="return mV(\'Eph\',5,32);">Eph 5:32</a> led to the ecclesiastical doctrine that marriage is a "sacrament.")<P>4. The Pagan Mysteries and the New Testament:<P>The question is now frequently discussed, how far the New Testament (and especially Paul) betrays the influence of the heathen mystery-cults. Hatch maintains that the Pauline usage of the word musterion is dependent on the Septuagint, especially on the Apocrypha (op. cit.), and in this he is followed by Anrich, who declares that the attempt to trace an allusion to the Mysteries in the New Testament is wholly unsuccessful; but Lightfoot admits a verbal dependence on the pagan Mysteries (Commentary on <a onClick="return mV(\'Col\',1,26);">Col 1:26</a>).<P>At present there is a strong tendency to attribute to Paul far more dependence than one of phraseology only, and to find in the Mysteries the key to the non-Jewish side of Paulinism. A. Loisy finds affinity to the mystery-religions in Paul\'s conception of Jesus as a Saviour-God, holding a place analogous to the deities Mithra, Osiris, and Attis; in the place Paul assigns to baptism as the rite of initiation; and in his transformation of the Lord\'s Supper into a symbol of mystic participation in the flesh and blood of a celestial being and a guaranty of a share in the blissful immortality of the risen Saviour. "In its worship as in its belief, Christianity is a religion of mystery" (article in Hibbert Journal, October, 1911). Percy Gardner traces similar analogies to the Mysteries in Paul, though he finds in these analogies, not conscious plagiarism, but "the parallel working of similar forces" (Religious Experience of Paul, chapters iv, v). Kirsopp Lake writes, "Christianity has not borrowed from the mystery-religions, because it was always, at least in Europe, mystery-religion itself" (The Earlier Epistles of Paul, 215). On the other hand, Schweitzer wholly denies the hypothesis of the direct or indirect influence of the Mysteries on Paul\'s thought (Geschichte der Paulinischen Forschung).<P>The whole question is sub judice among scholars, and until more evidence be forthcoming from inscriptions, etc., we shall perhaps vainly expect unanimous verdict. It can hardly be doubted that at least the language of Paul, and perhaps to some extent his thought, is colored by the phraseology current among the cults. Paul had a remarkably sympathetic and receptive mind, by no means closed to influences from the Greek-Roman environment of his day.<P>Witness his use of illustrations drawn from the athletic festivals, the Greek theater (<a onClick="return mV(\'1Cr\',4,9);">1Co 4:9</a>) and the Roman camp. He must have been constantly exposed to the contagion of the mystic societies. Tarsus was a seat of the Mithra religion; and the chief centers of Paul\'s activities, e.g. Corinth, Antioch and Ephesus, were headquarters of mystic religion. We are not surprised that he should have borrowed from the vocabulary of the Mysteries, not only the word musterion, but memuemai, "I learned the secret," literally, "I have been initiated" (<a onClick="return mV(\'Phl\',4,12);">Php 4:12</a>); sphragizesthai, "to be sealed" (<a onClick="return mV(\'Eph\',1,13);">Eph 1:13</a>, etc.); teleios, "perfect," term applied in the Mysteries to the fully instructed as opposed to novices (<a onClick="return mV(\'1Cr\',2,6,7);">1Co 2:6,7</a>; <a onClick="return mV(\'Col\',1,28);">Col 1:28</a>, etc.) (note, outside of Paul, epoptai, "eye-witnesses,"<a onClick="return mV(\'2Pe\',1,16);">2Pe 1:16</a>).<P>Further, the secret of Paul\'s gospel among the Gentiles lay, humanly speaking, in the fact that it contained elements that appealed to what was best and most vital in contemporary thought; and doubtless the Mysteries, by transcending all lines of mere citizenship, prepared the way for the universal religion. On the other hand, we must beware of a too facile acceptance of this hypothesis in its extreme form. Christianity can be ad
