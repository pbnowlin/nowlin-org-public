ortened to Jabneh, "he doth cause to be built" (<a onClick="return mV(\'Jos\',15,11);">Jos 15:11</a>; <a onClick="return mV(\'2Ch\',26,6);">2Ch 26:6</a>; compare 1Ma 4:15); Paltiel, "deliverance of God," was curtailed to Palti, "deliverance" (<a onClick="return mV(\'1Sa\',25,44);">1Sa 25:44</a>; <a onClick="return mV(\'2Sa\',3,15);">2Sa 3:15</a>); Abijah, "Yahweh is father," to Abi (<a onClick="return mV(\'2Ch\',29,1);">2Ch 29:1</a> with <a onClick="return mV(\'2Ki\',18,2);">2Ki 18:2</a>); and Bamoth-baal, "high places of Baal," to Bamoth (<a onClick="return mV(\'Jos\',13,17);">Jos 13:17</a> with <a onClick="return mV(\'Num\',21,19);">Nu 21:19</a>). Abdi, Othni, Uzzi, and not a few other similar names, probably represent curtailment of this sort. The omission of the Divine title has parallels in Assyrian and Babylonian literature: thus Nabu-nadin-ziri and Nabu-shum-ukin were called Nadinu and Shum-ukin respectively (Dynastic Tablet <span class="noTag">number 2</span>, col. iv, 4, 5, with Babylonian Chron., col. i, 13, 16).<P>(4) Abbreviation by the elision of the initial consonant, yet so that the remainder is a synonymous name of complete grammatical form. The name of King Hezekiah was written by the Hebrews both yechizchiyah, "Yahweh doth strengthen," and chizchiyah, "Yahweh is strength." The two forms interchange many times in <a onClick="return mV(\'2Ch\',29,\'1-\');">2Ch 29</a>, <a onClick="return mV(\'2Ch\',30,\'1-\');">30</a>, <a onClick="return mV(\'2Ch\',31,\'1-\');">31</a>, <a onClick="return mV(\'2Ch\',32,\'1-\');">32</a>, <a onClick="return mV(\'2Ch\',33,\'1-\');">33</a>. Similarly, Jeconiah was shortened to Coniah, as has already been noticed; the name of the town Jekabzeel, "God bringeth together," to Kabzeel, "God\'s bringing together" (<a onClick="return mV(\'Neh\',11,25);">Ne 11:25</a> with <a onClick="return mV(\'Jos\',15,21);">Jos 15:21</a>; <a onClick="return mV(\'2Sa\',23,20);">2Sa 23:20</a>); Meshelemiah, "Yahweh is recompensing," to Shelemiah, "Yahweh\'s recompensing" (<a onClick="return mV(\'1Ch\',26,1,2);">1Ch 26:1,2</a> with <a onClick="return mV(\'1Ch\',26,14);">1Ch 26:14</a>); Meshullam, "recompensed," to Shallum, "recompensed" (<a onClick="return mV(\'1Ch\',9,11);">1Ch 9:11</a>; <a onClick="return mV(\'Neh\',11,11);">Ne 11:11</a> with <a onClick="return mV(\'1Ch\',6,12);">1Ch 6:12</a>; <a onClick="return mV(\'Ezr\',7,2);">Ezr 7:2</a>).<P>II. The Range of Proper Names.<P>1. Personal Names:<P>(1) Not Exclusively Descriptive.<P>Simonis in his Onomasticum, published in 1741, and Gesenius in his Thesaurus, issued during the years from 1835 to 1853, endeavored to interpret the proper names as though they were ordinarily intended to characterize the person who bore them. Embarrassed by theory, Gesenius translated Malchiel by "rex Dei, h. e. a Deo constitutus"; and Simonis translated Malchi-shua by "regis auxilium, i.e. auxilium s. salus regi patri praestita"; Ammizabad was rendered by Gesenius "famulus largitoris, h.e. Jehovae," and by Simonis "populum (i.e. copiosissimam liberorum turbam) donavit"; Gesenius translated Gedaliah "quem Jehova educavit vel roboravit," Zerahiah "cui Jehova ortum dedit," Jehozadak "quem Jehova justum fecit," and Joel "cui Jehova est deus, i.e. cultor Jehovae"; but Simonis rendered Joel by "Jehoua (eat) Deus...vel (cui) Jehoua Deus (eat)." Now Malchiel means "God is king," Malchi-shua "the king, i.e. God, is salvation" (compare Joshua), Ammizabad "the Kinsman hath endowed," Gedaliah "Yah is great," Zerahiah "Yahweh hath risen in splendor," Jehozadak "Yahweh is righteous," and Joel, if a compound name, "Yah is God." A moment\'s reflection makes clear that these names do not describe the persons who bear them, but in every case speak of God. They emphasize the important facts that personal names might be, and often were, memorial and doctrinal, and that personal names were a part of the ordinary speech of the people, full of meaning and intelligible to all, subject to the phonetic laws of the Hebrews, and obedient to the rules of grammar.<P>(2) Drawn from a Wide Field.<P>Parents named their children, and contemporaries dubbed people, from physical and spiritual traits, whether a beauty or a blemish; thus Hophni, "pertaining to the fist," Japhia, "gleaming," Ikkesh, "perverse," Ira, "watchful," Gareb, "rough-skinned," and Hiddai, "joyful." Children were called by the names of natural objects, as Peninnah, "coral," Rimmon, "pomegranate," Tamar, "palm tree," Nahash, "serpent," Eglah, "heifer," Aiah, "bird of prey," and Laish, "lion"; or after kinsfolk or remoter members of the clan, as Absalom\'s daughter Tamar bore the name of her father\'s beautiful sister, and as the priest Phinehas took his strange name from the noted Phinehas, who belonged to the same father\'s house in earlier days. Or the name given to the child furnished a memorial of events in the national history, like Ichabod, "the glory is not" (<a onClick="return mV(\'1Sa\',4,21);">1Sa 4:21</a>), and probably Obed-edom, "Edom is serving" (compare <a onClick="return mV(\'1Sa\',14,47);">1Sa 14:47</a>; <a onClick="return mV(\'1Sa\',21,7);">21:7</a>); or it told of circumstances attending the child\'s birth, as Saul, "asked," and Elishama, "God hath heard"; or it embodied an article of the parent\'s creed, as Joab and Abijah, "Yah is a father," Joel, "Yah is God"; or it expressed a hope concerning the child or bore witness to a prophecy, as Jedidiah, "beloved of Yahweh," and Solomon, "peaceable" (<a onClick="return mV(\'2Sa\',12,25);">2Sa 12:25</a>; <a onClick="return mV(\'1Ch\',22,9);">1Ch 22:9</a>). Sometimes the name of the tribe or race to which a man belonged became his popular designation, as Cushi, "Cushite." All of these examples have been cited from the records of one period of Israel\'s history, the times of Samuel and David.<P>(3) Influences Leading to Choice.<P>The people in general gathered names for their children freely from all parts of this wide field, but in certain circles influences were at work which tended to restrict the choice to a smaller area. These influences were religious:<P>(a) In homes of piety conscious nearness to God on the part of the parents naturally prompted them to bestow religious names upon their children. The name may be without distinct religious mark in its form and meaning, as Ephraim, "double fruitfulness," Manasseh, "making to forget," and yet have been given in acknowledgment of God\'s grace and be a constant reminder of His goodness (<a onClick="return mV(\'Gen\',41,51,52);">Ge 41:51,52</a>); or the name may be religious in form, as Shemaiah, "Yah hath heard," and publicly testify to the parents\' gratitude to God.<P>(b) The covenant relation, which Yahweh entered into with Israel, made the name Yahweh, and that aspect of God\'s character which is denoted by this name, peculiarly precious to the people of God, and thenceforth the word Yahweh became a favorite element in the personal names of the Israelites, though not, of course, to the exclusion of the great name El, "God."<P>(c) Among the kings in the line of David, the consciousness of their formal adoption by Yahweh to be His vicegerents on the throne of Israel (<a onClick="return mV(\'2Sa\',7,\'1-\');">2Sa 7</a>; <a onClick="return mV(\'Psa\',2,\'1-\');">Ps 2</a>) found expression in the royal names. Yahweh, the God of Israel, was acknowledged in the personal name Abijah, borne by the son and successor of Rehoboam. But his was an isolated case, unless the name Asa is an abbreviated form. But with Jehoshaphat, Abijah\'s grandson, early in the 9th century, the custom became established. Henceforth it was conventional for the king of Judah to have for his name a sentence with Yahweh as its subject. The only exceptions among the 16 successors of Asa on the throne were Manasseh and his son Amon, both of whom were notoriously apostate from Yahweh. The full name of Ahaz was Jehoahaz. Josiah\'s son Shallum as king was known as Jehoahaz; and his brother Eliakim, when placed on the throne by Pharaoh-necoh, was given the name Jehoiakim.<P>(d) Akin to the influence exerted by the relation of the kings to the God of Israel, and manifesting almost equal power contemporaneously with it, was the influence of official connection with the sanctuary, either as priests or as subordinate ministers, and it frequently led to the choice of an ecclesiastical name containing the word God or Yahweh. During the five centuries and a half, beginning near the close of Solomon\'s reign and extending to the end of Nehemiah\'s administration, 22 high priests held office, so far as their names have been preserved in the records. Of these pontiffs 17 bear names which are sentences with Yahweh as subject, and another is a sentence with El as subject. The materials for investigation along this line are not complete, as they are in the case of the kings, and ratios derived from them are apt to be erroneous; but evidently the priests of Yahweh\'s temple at Jerusalem not only recognized the appropriateness for themselves and their families of names possessing a general religious character, but came to favor such as expressly mentioned God, especially those which mentioned God by His name of Yahweh.<P>(4) Popularity of Names: Hard to Determine.<P>Until abundant data come to light for all periods of the history, it is precarious to attempt to determine the relative popularity of the various kinds and types of names in any one generation, or to compare period with period with respect to the use or neglect of a particular class of names. For, first, in no period are the names which have been transmitted by the Hebrew records many as compared with the thousands in use at the time; and, secondly, the records deal with the historical event which was conspicuous at the moment, and rarely mention persons other than the actors in this event.<P>At one time men and women from the middle class of society are asserting themselves in the national life, and the personal names current in the families of farmers, shopkeepers and soldiers obtain place in the annals; at another time, when the activities of the court are of paramount importance, it is mainly names that were current in official circles which are chronicled; at yet another period, when matters of the national worship engaged the attention of the state, ecclesiastics and laymen from pious families, whose names were quite likely to have a religious meaning, receive mention. Very few names outside of the particular circle concerned are preserved in the records. It is unwarranted, therefore, to draw inferences regarding the relative use of particular names, secular names, for instance, at different periods of the history of Israel, by comparing the number of these names found in a record of political uprisings in the army with the number of similar names in the narrative of an episode which occurred at a later date and in which only priests took part. It is comparing things that differ. It is comparing the number of certain names current in military circles with the number of the same names among ecclesiastics, in order to learn whether these names were more common among the people as a whole in the one period than in the other.<P>2. Geographical Names:<P>The brine of its waters led the ancient Hebrews to call the Dead Sea the Salt Sea. Bethesda, "house of mercy," received its name from the belief in the healing virtue of its waters; Lebanon, "white," from the snows that cover its crest; Sidon on the Mediterranean Sea and Bethsaida on the Sea of Galilee, from their fisheries; Tyre, from the great rock in the sea on which it was built; the valley of Elah, from the terebinth tree; Luz, from the almond tree; Shittim, from the acacia groves on the eastern terrace of the Jordan valley; and Jericho, from the fragrance of its palms and balsams. The "crags of the wild goats" and En-gedi, "kid spring" (<a onClick="return mV(\'1Sa\',24,1,2);">1Sa 24:1,2</a>), were in a desolate, rocky region where the wild goats had their home; Aijalon signifies "place of harts," and Etam denotes a "place of beasts and birds of prey." The hopes of a people and pride in their town were expressed in names like Joppa, "beauty," Tirzah, "pleasantness," Janoah, "rest," Shiloh, "tranquillity," and Salem, "peace." The resemblance of the Sea of Galilee in shape to a harp secured for it its ancient name of Chinnereth. Poetic imagination saw in majestic Mt. Hermon likeness to a soldier\'s breastplate, and forthwith the mountain was called Serion and Senir. The sanctuary of a deity might give name to a town, hence, Beth-dagon, Beth-anath, and Ashtaroth. Sometimes the name of a place commemorated a victory, as rock Oreb, rock Zeeb, and Eben-ezer (<a onClick="return mV(\'Jdg\',7,25);">Jud 7:25</a>; <a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a>); or enshrined a religious transaction or experience, Beth-el and Beracah (<a onClick="return mV(\'Gen\',28,\'17-19\');">Ge 28:17-19</a>; <a onClick="return mV(\'2Ch\',20,26);">2Ch 20:26</a>); or told of a migration, as when colonists gave the name of their native town to their new settlement (<a onClick="return mV(\'Jdg\',1,\'-23-26\');">Jud 1:23-26</a>). Often the name of the founder or other famous inhabitant became attached to a town, and that for various reasons. It was often necessary to distinguish places of the same name from each other by this method; thus certain of the towns called Gibeah became Gibeath-saul and Gibeath-phinehas. The Jebusite stronghold captured by David was named by him the city of David, and was known by this name, as a quarter of Jerusalem, for many generations (<a onClick="return mV(\'2Sa\',5,9);">2Sa 5:9</a>; <a onClick="return mV(\'2Ki\',16,20);">2Ki 16:20</a>). The practice was common among the Semitic contemporaries of Israel, as is illustrated by Dur-sharruken, "Sargonsburg," and Kar-shalmanasharidu, "Shalmaneser\'s fortress." A town might also be named after the tribe which inhabited it or after the ancestor of the tribe, as Dan (<a onClick="return mV(\'Jdg\',18,29);">Jud 18:29</a>), and possibly under not a few geographical designations a tribal name is hidden, even when the fact has escaped record and is not revealed by the form of the name. In an inquiry after the origin of a geographical designation the first consideration is due to the causes known to be ordinarily at work in giving rise to names of the same aspect as the one under scrutiny; and only when they fail to yield a suitable explanation are less obvious causes worthy of serious attention.<P>III. Characteristics of Biblical References.<P>1. Derivation of Names Manifest:<P>As a rule, Semitic words clearly reveal their origin and structure. The Semite might, indeed, err with respect to the particular meaning intended, where a word was current in several significations. Thus, the vale of bakha\', mentioned in <a onClick="return mV(\'Psa\',84,6);">Ps 84:7 (Eng. 6)</a>, is open to two interpretations: namely, "valley of Baca," so called from the balsam trees in it, and "valley of weeping," as the versions render the unusual form, regarding it as equivalent to a similar word meaning "weeping." The plural bekha\'im, "mulberry or balsam trees" (<a onClick="return mV(\'2Sa\',5,23,24);">2Sa 5:23,24</a>), was understood by Josephus to denote a grove known by the name Weepers (Ant., VII, iv, 1; compare Septuagint). In those rare cases where several derivations were possible, the Israelite may not always have known which thought was intended to be embodied in the name which he heard. But he discerned the alternative possibilities; and a parent, in bestowing a name ambiguous in its derivation, might be deliberately taking advantage of its power to be the vehicle for the suggestion and expression of two thoughts (<a onClick="return mV(\'Gen\',30,23,24);">Ge 30:23,24</a>; Joseph being derivable from both yacaph and \'acaph).<P>2. The Narrator\'s Only Concern:<P>That the object of the Biblical writer was not to make known the derivation of the proper names is clear from cases like Esek, Rehoboth and Ishmael (<a onClick="return mV(\'Gen\',16,11);">Ge 16:11</a>; <a onClick="return mV(\'Gen\',26,20,22);">26:20,22</a>): Isaac called the name of the well, Contention, because the herdsmen of Gerar "contended" with him; another well he called Broad Places (roomy places), because Yahweh had "made room" for him; and Hagar was directed to name the son that she was about to bear "God doth hear," because Yahweh had "heard" her affliction. The narrator\'s purpose was not to declare that the Hebrew word for contention, \'eceq, is derived from the Hebrew verb for "contend," \'acaq, and that the name "God doth hear," yishma\'\'el, signifies God doth hear, yishma\' \'el. These derivations and meanings were plain. The purpose was to state the circumstances which led to the choice of the name. There are instances also where no part of the name reappears in the words that state the reason for the use of the name. For example, the name Maher-shalal-hash-baz is not explained by citing the words which compose it. One noun of the composite name appears, indeed, in the exposition of the meaning, but accidentally as it were, and without prominence or significance of position (<a onClick="return mV(\'Isa\',8,3,4);">Isa 8:3,4</a>). Samuel is a notable example of this method. Hannah called his name Samuel, saying, \'Because of Yahweh, I asked him\' (<a onClick="return mV(\'1Sa\',1,20);">1Sa 1:20</a>). Simonis, Ewald and Nestle derive the name from shemua\'\'el, "heard of God." This etymology would fully satisfy the reason given for the mother\'s choice of the name; but the suggested derivation is far-fetched, for it is not customary for a Hebrew word to lose the strong guttural \'ayin (\'). The guttural was not lost, but was distinctly heard, in Ishmael, where there is the same concurrence of sounds as in shemua\'\'el. Qimchi, on the other hand, suggested that Samuel is a contraction of sha\'ul me\'el, "asked of God"; and Ewald asserts that this origin is theory of the narrator (Lehrbuch der hebraischen Sprache, 275, note 3). This is incredible. Such a contraction is "alien to the genius of the Hebrew language” (Driver, Text of Samuel, 13), and the absence of the two Hebrew consonants \'aleph (\') and lamedh (l) before the letter "m" in the midst of the name Samuel would of itself prevent the Semite from imagining such an etymology. The derivation and meaning of Samuel were not obscure. The type was common, and was especially familiar by reason of the name Peniel, "face of God" (<a onClick="return mV(\'Gen\',32,30);">Ge 32:30</a>f). Samuel means "name of God" (Gesenius). As Jacob, upon his return from Paddan-aram, in fulfillment of his vow erected an altar at Beth-el as a memorial of God\'s bestowal of the promised blessings and named the place thus consecrated "The God of Beth-el" (<a onClick="return mV(\'Gen\',35,1,3,7);">Ge 35:1,3,7</a>), so Hannah having by vow dedicated to Yahweh the son for whose birth she was praying, now that her prayer has been answered and the son given, calls him "The name of God" in commemoration of the Giver. The Biblical narrator states the motive which led the mother to choose the name Samuel for her child. In this explanation no part of the name is used. Moreover, the slight assonance between shemu\'el and she\'iltiw in <a onClick="return mV(\'1Sa\',1,20);">1Sa 1:20</a> was unsought, for these words are separated in the Hebrew text, and the emphasis is placed on the gift\'s being "from Yahweh." The history of the discussion concerning this name shows how far astray criticism has been led by the false theory that the purpose of the narrator was to analyze the name and declare its derivation.<P>Reuben affords evidence to the same effect. The name was known to the early Hebrews in this form exclusively. It is attested by their most ancient literature (<a onClick="return mV(\'Gen\',29,32);">Ge 29:32</a>; <a onClick="return mV(\'Gen\',30,14);">30:14</a>; <a onClick="return mV(\'Jdg\',5,15,16);">Jud 5:15,16</a>), by the entire Old Testament, by the Greek translation (Codex Alexandrinus, Codex Vaticanus, and Lucian), by the Targums, and by the New Testament (<a onClick="return mV(\'Rev\',7,5);">Re 7:5</a>). Yet in the 1st century Josephus, adding a Greek termination, wrote Roubelos; and later the Syriac version gave the name as Rubil, and the Ethiopic version as Robel and Rubel. The late variation is reasonably explained as a softening of the pronunciation, which had come into vogue in certain circles. The liquids, or, to speak particularly regarding Reuben, the liquids n and l, sometimes interchanged, giving rise to two forms for a word in the same language or in kindred languages (Gesenius, Thesaurus, 727; Wright, Comp. Grammar, 67; Zimmern, Vergleichende Grammatik, section 11a). Notwithstanding the evidence furnished by the literature, preference has been given to Reubel as the original form on the ground that "the only plausible explanation of the etymology" given in <a onClick="return mV(\'Gen\',29,32);">Ge 29:32</a> "is that it is based on the form" Re\'ubel equals Re\'u ba\'al (Skinner, Genesis, 386). An exhibition of the etymology was needless, however, and was not the end which the writer had in view. His purpose was to state the occasion for bestowing this particular name upon the child; and in stating it he does full justice to the clear meaning of the good, simple Hebrew of the name Reuben. The name signifies either "vision of a son" or "Behold ye, a son!" In either case the emphatic word is "son." As Hannah, taunted on account of her barrenness, besought God to look on her affliction and give her a man-child (<a onClick="return mV(\'1Sa\',1,11);">1Sa 1:11</a>), so Leah, using the same words, speaking of the same mercy already shown her, and with the same thought in mind, exclaimed: "Yahweh hath looked upon my affliction; for now my husband will love me," and she called the name of her son "Look ye! It\'s a son" (or, "vision of a son "). A male child was to her a proof of God\'s regard for her misery, and a guaranty of the future love of her husband for her. Moreover, the name kept the thought constantly before the mind of her husband. Gesenius remarks that Reuben means "properly, \'See ye, a son!\' but the sacred writer in <a onClick="return mV(\'Gen\',29,32);">Ge 29:32</a> explains it as for ra\'-ah (ra\'uy) be\'onyi, \'provided in my affliction\'" (Lexicon, Thesaurus). This curious specimen of criticism may be regarded as the reductio ad absurdum of the hypothesis that the Hebrew writers intend to give the derivation of the proper names. The result of endeavoring to force the words of the explanation into an intentional etymology compels the assumption that the Hebrew writer misunderstood one of the simplest phrases of his own language and proposed a contraction impossible in itself and utterly foreign to the principles which underlie Hebrew speech.<P>3. Allusions Linked with Names:<P>Allusions to proper names are made for the purpose of stating the reason for the bestowal of the name, of pointing out a coincidence between the name and the character or experience of its bearer, or of attaching a prophecy; and it is common to link the allusion with the name by employing the root that underlies the name, or a cognate root, or some other word that resembles the name in sound:<P>(1) Statement of the reason for the choice of the name: In the case of Simeon, the root of the name is used (<a onClick="return mV(\'Gen\',29,33);">Ge 29:33</a>). Words of this type (with the termination on) are formed from nouns and verbs, and have the force of adjectives, diminutives, or abstract nouns, and are sometimes used as concrete nouns (Stade, Lehrbuch der hebraischen Grammatik, section 296). The Israelite at once recognized the root and formation of the name Simeon, which was a favorite with the Hebrews, and he knew that it could express the abstract idea of hearing. In <a onClick="return mV(\'Gen\',29,33);">Ge 29:33</a> the narrator is not seeking to impart etymological information; but it is clear that he discerned the derivation when he gave the reason for the choice of this particular name for Leah\'s second son: "(Leah) said, Because Yahweh hath heard that I am hated, he hath therefore given me this son also: and she called his name Simeon." The root of the name is used as a verb in the statement of the motive. It was convenient and natural to do so, since the verb shama\' was the proper word to express the idea and was one of the most common words in the language. There would be no reason to suppose that identity with the root of the name was intentional, except that care is taken by the narrator in the case of the other sons of Jacob to maintain a similar correspondence. Accordingly, that form of paronomasia is employed where a word is used that is one with the name in derivation, but differs from the name in form and grammatically is a different part of speech.<P>In the case of Cain a cognate root is used. The name is a segholate noun from the root qun, which means "to form," and then specifically to form at the anvil. Cain may accordingly be an abstract noun and denote formation, or a concrete noun denoting a forged weapon, or the agent in the work, namely a smith. In stating the reason for giving this name to the child, it was not feasible to use the verb qun, because of the technical meaning which had become attached to it. To avoid misunderstanding the cognate verb qanah is employed, which has radically the same significance, but is without the technical implications (<a onClick="return mV(\'Gen\',4,1);">Ge 4:1</a>). The result is that kind of paronomasia which exists between words of similar sound and cognate origin, but difference of meaning.<P>In the case of Noah a root unrelated to the name in origin, but containing a similar sound, is used. The Biblical narrator does not state whether the name Noah is the transliteration of a foreign word or is its translation into Hebrew; he merely declares that as given it expressed the father\'s hope that through this child men were to have relief from the ancient curse upon the ground. If the name is Hebrew, its root may be nuach, "rest." At any rate it promptly suggested to the ear of the Hebrew the idea of rest. But the verb nuach, is used in Hebrew, as is the corresponding verb "rest" in English, to express the two ideas of relief and cessation. Lamech did not mean that his son would cause men to cease from work, but that he would secure for them restful relief from toil due to God\'s curse on account of sin (<a onClick="return mV(\'Gen\',5,29);">Ge 5:29</a>, with a reference to <a onClick="return mV(\'Gen\',3,\'17-19\');">Ge 3:17-19</a>). The writer does not use the ambiguous word. To avoid ambiguity, yet with a view to preserving assonance with Noah, he employs the verb nacham, which has as one of its meanings the sense of comfort and relief.<P>(2) The indication of a coincidence between the character or experience of a person and his name: Naomi, returning to her home bereaved and in poverty, saw the contrast between her present condition and her name; and she played upon her name by using a word of opposite meaning, saying: \'Call me not Pleasant, call me Bitter; for the Almighty hath dealt very bitterly with me\' (<a onClick="return mV(\'Rth\',1,20);">Ru 1:20</a>). In whatever sense Nabal\'s name may have been bestowed upon him originally, at any rate his wife saw the correspondence between his name in its ordinary meaning and his conduct toward David, and she played upon it, saying: \'Fool is his name, and folly is with him\' (<a onClick="return mV(\'1Sa\',25,25);">1Sa 25:25</a>). Likewise the agreement between Jacob\'s character and a meaning that his name has in Hebrew was seen, and called forth the bitter word-play: \'Is he not rightly named "He supplants"? for he hath supplanted me these two times\' (<a onClick="return mV(\'Gen\',27,36);">Ge 27:36</a>). Isaac, so far as the formation is concerned, may be an abstract noun meaning "laughter," or a concrete noun, "laughing one," or a verb in the imperfect, "he laughs" or "one laughs" (compare Stade, Lehrbuch der hebraischen Grammatik, section 259a). Whichever specific meaning may have been in the mind of Abraham when he gave the name to his son, yet by reason of its ever speaking of laughter the name was a constant reminder to the parents of the laughter of unbelief with which they had listened to the promise of his birth (<a onClick="return mV(\'Gen\',17,17);">Ge 17:17</a>; <a onClick="return mV(\'Gen\',18,12);">18:12</a>). But in due time the child of promise has been born. His name, as determined upon, is Isaac. This Sarah knows (<a onClick="return mV(\'Gen\',17,19);">Ge 17:19</a>; <a onClick="return mV(\'Gen\',21,3);">21:3</a>). Accordingly, theme with which she greets his advent is laid in her mouth. She plays (puns) upon the name Isaac, using the root of the word in various forms, first as a noun and then as a verb, and giving to the verb a new subject and to the thought a new turn. Instead of the laughter of unbelief, with which the promise was received, \'God,\' she says, \'hath prepared for me laughter (of joy), everyone that heareth (of the event) will laugh (with joy) for me\' (<a onClick="return mV(\'Gen\',21,6);">Ge 21:6</a>; compare <a onClick="return mV(\'Psa\',126,2);">Ps 126:2</a>).<P>(3) Attachment of a prophecy to a name: Paronomasia in all of its forms is used for this purpose. A meaning of the name, or a sound heard in it, or a contrast suggested by it may be played upon. In these several ways the prophet Micah plays upon successive names in one paragraph (<a onClick="return mV(\'Mic\',1,\'10-15\');">Mic 1:10-15</a>). In answer to Abraham\'s prayer in behalf of Ishmael, a promise is given concerning the lad, which is introduced by a play upon his name: \'As for the boy (named) "God heareth," I have heard thee\' (<a onClick="return mV(\'Gen\',17,18,20);">Ge 17:18,20</a>). To Gad a prophecy is attached in <a onClick="return mV(\'Gen\',49,19);">Ge 49:19</a>. Two cognate roots are employed: gadhadh, which underlies the word rendered troop or marauding band, and gudh, which means "to press." In the use not only of the root of the name Gad, but of a different root also that is similar in sound, it is evident that the purpose is simply to play upon the name. The brief oracle is uttered almost exclusively by means of variations in the vocalization of the two roots, producing one of the most successful word-plays in Hebrew literature.<P>Judah is a noun corresponding to the Hophal imperfect, and means "thing being praised," "object of praise." In bestowing this name upon her child the mother signified that Yahweh was the object of her praise; for she said: "Now will I praise Yahweh" (<a onClick="return mV(\'Gen\',29,35);">Ge 29:35</a>). In <a onClick="return mV(\'Gen\',49,8);">Ge 49:8</a> a prophecy is spoken concerning Judah. The same etymology and meaning are recognized as before, but the application is different. The birth of Judah had made God an object of praise, the great deeds of the tribe of Judah were destined to make that tribe an object of praise. To quote the oracle: \'"Object of praise," thee shall thy brothers praise.\' In this difference of reference and in the repetition of the significant word consists the play upon the name.<P>Da is played upon in much the same way. The name may be a participle, used as a noun, and be rendered "judge"; but it probably belongs to that numerous class in which the names are verbs in the perfect, and signifies, "he hath judged." His adoptive mother had called his name Dan, because God had heard her complaint and decided the cause in her favor (<a onClick="return mV(\'Gen\',30,6);">Ge 30:6</a>). In attaching the prophecy, the name is played upon by changing the subject, and, in order to refer to the future, by substituting the imperfect for the perfect of the verb.: \'"He hath judged" shall judge his people, as one of the tribes of Israel\' (<a onClick="return mV(\'Gen\',49,16);">Ge 49:16</a>).`<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>; <a href="./study/isbe/search.html?string=NAME">NAME</a>`35';
isbe[6268]='Nanaea`na-ne\'-a (Nanaia; the King James Version Nanea): A female deity worshipped by the Assyrians, Babylonians and Persians and other Asiatic peoples, the Nana or Nanai of the Babylonians, known as "the lady of Babylon." The name means "the undefiled," and probably represented originally the productive powers of Nature (genetrix), and as such was the companion of the sun-god. She was identified with Ishtar in Assyria and Ashtoreth in Phoenicia, by the Greeks as Aphrodite (Clement of Alexandria Protr., 19), but sometimes as Artemis the huntress (Paus. iii.16,8; Plut. Artax. xxvii). Strabo (xv. 733) identifies her with Anaitis (equalsAnahita), the Asian Artemis. She was the Venus, but sometimes the Diana, of the Romans. There are many variants of the name: Anaea (Strabo xvi.738), Aneitis (Plut. Artax. xxvii), Tanais (Clement of Alexandria, loc. cit.), also Tanath, sometimes in Phoenician inscriptions, Tanata, Anta (Egyptian). In 2Macc 1:13ff, a fictitious account is given of the death of Antiochus Epiphanes, in a temple of Nanaea in Persia, by the treachery of Nanaea\'s priests. The public treasury was often placed in Nanaea\'s temple; this, Epiphanes was anxious to secure under the pretext of marrying the goddess and receiving the money as dowry. The priests threw down great stones "like thunderbolts" from above, killed the king and his suite and then cut off their heads. But 1Macc 1ff, which is more reliable, gives a different account of the death of Epiphanes after an attempt to rob a rich temple in Elymais. The account of 2Macc 1:13ff must be mere legend, as far as Epiphanes is concerned, but may have been suggested or colored by the story of the death of Antiochus the Great, who met his death while plundering a temple of Belus near Elymais (Strabo xvi.l.18; Diod. Sic. 573; Justin, xxxii.2). The temple of Nanaea referred to in 2Macc 1:13ff may be identified with that of Artemis (Polyb. xxxi.11; Josephus, Ant, XII, ix, 1) or Aphrodite (Appian, Syriac. 66; Rawlinson, Speaker\'s Comm.).``5';
isbe[6269]='Naomi`na\'-o-mi, na-o\'-mi, na-o\'-mi (no\'omi, probably equals "pleasantness"; Septuagint. Codex Vaticanus Noemein; Codex Alexandrinus Noemmei(n)): Wife of Elimelech and mother-in-law of Ruth (<a onClick="return mV(\'Rth\',1,\'2-\');">Ru 1:2-4:17</a>). She went with her husband to the land of Moab, and after his death returned to Bethlehem. When greeted on her return, she told the women of the town to call her, not no\'omi ("pleasantness"), but marah ("bitterness"), "for," she said, "the Almighty hath dealt very bitterly with me." She advised Ruth in her dealings with Boaz, and afterward nursed their child.<P>The name may mean "my joy," "my bliss," but is perhaps better explained according to the traditional interpretation as "the pleasant one."``149';
isbe[6270]='Naphath-Dor`na\'-fath-dor (<a onClick="return mV(\'Jos\',12,23);">Jos 12:23</a> the Revised Version margin).`<a href="./study/isbe/search.html?string=DOR">DOR</a>`1';
isbe[6271]='Naphish`na\'-fish (naphish; Naphes, D, Napheth): A son of Ishmael (<a onClick="return mV(\'Gen\',25,15);">Ge 25:15</a>; <a onClick="return mV(\'1Ch\',1,31);">1Ch 1:31</a>). Naphish, along with other Hagrite clans, was overwhelmingly defeated by the Israelite tribes on the east of the Jordan (<a onClick="return mV(\'1Ch\',5,19);">1Ch 5:19</a>, the King James Version "Nephish"). Their descendants are mentioned among the Nethinim by the name "Nephisim," the King James Version and the Revised Version margin "Nephusim" (<a onClick="return mV(\'Ezr\',2,50);">Ezr 2:50</a>); "Nephushesim," the King James Version and the Revised Version margin "Nephishesim" (<a onClick="return mV(\'Neh\',7,52);">Ne 7:52</a>); "Naphisi" (1Esdras 5:31).``1';
isbe[6272]='Naphisi`naf\'-i-si (Naphisi, Codex Vaticanus Napheisei): The name of one of the families which went up out of captivity with Zerubbabel (1Esdras 5:31) equals "Nephushesim" of <a onClick="return mV(\'Neh\',7,52);">Ne 7:52</a>; "Nephisim" of <a onClick="return mV(\'Ezr\',2,50);">Ezr 2:50</a>.`<a href="./study/isbe/search.html?string=NAPHISH">NAPHISH</a>`1';
isbe[6273]='Naphoth-Dor`na\'-foth-dor (<a onClick="return mV(\'Jos\',11,2);">Jos 11:2</a> the Revised Version margin).`<a href="./study/isbe/search.html?string=DOR">DOR</a>`1';
isbe[6274]='Naphtali`naf\'-ta-li (naphtali; Nephthaleim):<P><b>I. THE PATRIARCH</b><P class="in15">1. Name<P class="in15">2. Circumstances of His Birth<P class="in15">3. Historical and Traditional Details<P><b>II. TRIBE OF NAPHTALI</b><P class="in15">1. Its Relative Position<P class="in15">2. Its Location in Palestine<P class="in15">3. Physical Features<P class="in15">4. Distinction of the Tribe<P class="in15">5. Sites and Inhabitants<P class="in15">6. Labors of Jesus in This District<hr /><P>I. The Patriarch.<P>1. Name:<P>The 5th son of Jacob, and the 2nd born to him by Rachel\'s handmaid, Bilhah. He was full brother of Dan (<a onClick="return mV(\'Gen\',30,7);">Ge 30:7</a>).<P>At his birth Rachel is said to have exclaimed, naphtule \'Elohim niphtalti, "wrestlings of God"—i.e. "mighty wrestlings"—"have I wrestled."<P>2. Circumstances of His Birth:<P>Her sister\'s fruitfulness was a sore trial to the barren Rachel. By her artifice she had obtained children, the offspring of her maid ranking as her own; and thus her reproach of childlessness was removed. The name Naphtali given to this son was a monument of her victory. She had won the favor and blessing of God as made manifest in the way yearned for by the oriental heart, the birth of sons.<P>3. Historical and Traditional Details:<P>Personal details regarding the patriarch north are entirely wanting in Scripture; and the traditions have not much to say about him. According to Targum Pseudo-Jonathan, he was a swift runner. It also tells us that he was one of the 5 brethren whom Joseph chose to represent the family of Jacob in the presence of Pharaoh. He is said to have been 132 years old at his death (Testament of the Twelve Patriarchs, viii,1,1). When Jacob and his family moved to Egypt, Naphtali had 4 sons (<a onClick="return mV(\'Gen\',46,24);">Ge 46:24</a>). In Egypt, he died and was buried.<P>II. Tribe of Naphtali.<P>1. Its Relative Position:<P>When the first census was taken in the wilderness, the tribe numbered 53,400 fighting men (<a onClick="return mV(\'Num\',1,43);">Nu 1:43</a>; <a onClick="return mV(\'Num\',2,30);">2:30</a>). At the second census, the numbers had shrunk to 45,400 (<a onClick="return mV(\'Num\',26,48);">Nu 26:48</a>); but see <a href="./study/isbe/search.html?string=NUMBERS">NUMBERS</a>. The position of Naphtali in the desert was on the north of the tabernacle with the standard of the camp of Dan, along with the tribe of Asher (<a onClick="return mV(\'Num\',2,25);">Nu 2:25</a>). The standard, according to Jewish tradition, was a serpent, or basilisk, with the legend, "Return of Yahweh to the many thousands of Israel" (Targum Pseudo-Jonathan on <a onClick="return mV(\'Num\',2,25);">Nu 2:25</a>). When the host was on the march, this camp came in the rear (<a onClick="return mV(\'Num\',2,31);">Nu 2:31</a>). The prince of the tribe at Sinai was Ahira ben Enan (<a onClick="return mV(\'Num\',2,29);">Nu 2:29</a>). Among the spies the tribe was represented by Nahbi ben Vophsi (<a onClick="return mV(\'Num\',13,14);">Nu 13:14</a>). Prince Pedahel ben Ammihud was chosen from Naphtali to assist in the division of the land (<a onClick="return mV(\'Num\',34,28);">Nu 34:28</a>). Toward the end of David\'s reign the ruler of the tribe was Jeremoth ben Azriel (<a onClick="return mV(\'1Ch\',27,19);">1Ch 27:19</a>). Hiram the Tyrian artificer is described as "the son of a widow of the tribe of Naphtali" (<a onClick="return mV(\'1Ki\',7,14);">1Ki 7:14</a>). But in <a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a> he is called "the son of a woman of the daughters of Dan." <a onClick="return mV(\'Jdg\',5,15);">Jud 5:15</a> does not definitely associate Barak with the tribe of Issachar; his residence was at Kedesh (<a onClick="return mV(\'Jdg\',4,6);">Jud 4:6</a>); it is therefore possible that he belonged to the tribe of Naphtali.<P>2. Its Location in Palestine:<P>In the allocation of the land, the lot of Naphtali was the last but one to be drawn (<a onClick="return mV(\'Jos\',19,\'32-39\');">Jos 19:32-39</a>). The boundaries are stated with great fullness. While it is yet impossible to trace them with certainty, the identification of sites in recent years, for which we are mainly indebted to the late Col. Conder, makes possible an approximation. The territory was bounded on the east by the Sea of Galilee and the upper reaches of the Jordan. Josephus makes it extend to Damascus (Ant., V, i, 22); but there is nothing to support this. The southern boundary probably ran from the point where Wady el-Bireh enters the Jordan, westward along the northern side of the valley to Mt. Tabor. The western border may have gone up by way of Chattin (Ziddim) and Yaquq (Hukkok) to Kerr \'Anan (Hannathon), bending there to the west, including the land of er-Rameh (Ramah) until it reached the territory of Asher. Running northward again until nearly opposite Tyre, it bent eastward, and once more northward to the Litany (Leontes), taking in the larger part of what is called by the Arabs Belad Beshdrah and Belad es-Shukif. Nineteen cities in Naphtali are named in <a onClick="return mV(\'Jos\',19,32);">Jos 19:32</a>ff. Among them was the famous city of refuge, <a href="./study/isbe/search.html?string=KEDESH-NAPHTALI">KEDESH-NAPHTALI</a> (which see), on the heights to the west of the Waters of Merom, where extensive ruins are still to be seen (<a onClick="return mV(\'Jos\',20,7);">20:7</A>). It, along with Hammoth-dor and Kartan, was assigned to the Gershonite Levites (<a onClick="return mV(\'Jos\',19,32);">21:23</a>; <a onClick="return mV(\'1Ch\',6,76);">1Ch 6:76</a>).<P>The land lying around the springs of the Jordan was included in the lot of Naphtali. It is clear that from this part, as well as from the cities named in <a onClick="return mV(\'Jdg\',1,33);">Jud 1:33</a>, Naphtali did not drive out the Canaanites. These the Danites found in possession at the time of their raid. There is no indication that Naphtali resented in any way this incursion of their kindred tribe into their territory (<a onClick="return mV(\'Jdg\',18,\'1-\');">Jud 18</a>).<P>3. Physical Features:<P>The district thus indicated includes much excellent land, both pastoral and arable. There are the broad, rich terraces that rise away to the north and northwest of the Sea of Galilee, with the fertile plain of Gennesaret on the seashore. The mountains immediately north of the sea are rocky and barren; but when this tract is passed, we enter the lofty and spacious lands of upper Galilee, which from time immemorial have been the joy of the peasant farmer. Great breadths there are which in season yield golden harvests. The richly diversified scenery, mountain, hill and valley, is marked by a finer growth of trees than is common in Palestine. The terebinth and pine, the olive, mulberry, apricot, fig, pomegranate, orange, lemon and vine are cultivated to good purpose. Water is comparatively plentiful, supplied by many copious springs. It was one of the districts from which Solomon drew provisions, the officer in charge being the king\'s son-in-law, Ahimaaz (<a onClick="return mV(\'1Ki\',4,15);">1Ki 4:15</a>).<P>4. Distinction of the Tribe:<P>The free life of these spacious uplands, which yielded so liberally to the touch of the hand of industry, developed a robust manhood and a wholesome spirit of independence among its inhabitants. According to Josephus, who knew them well (BJ, III, iii, 2), the country never lacked multitudes of men of courage ready to give a good account of themselves on all occasions of war. Its history, as far as we know it, afforded ample opportunity for the development of warlike qualities. In the struggle with Sisera, Naphtali was found on the high places of the field (<a onClick="return mV(\'Jdg\',5,18);">Jud 5:18</a>). To David\'s forces at Hebron, Naphtali contributed a thousand captains "and with them with shield and spear thirty and seven thousand" (<a onClick="return mV(\'1Ch\',12,34);">1Ch 12:34</a>). Their position exposed them to the first brunt of attack by enemies from the north; and in the wars of the kings they bore an important part (<a onClick="return mV(\'1Ki\',15,20);">1Ki 15:20</a>; <a onClick="return mV(\'2Ki\',12,18);">2Ki 12:18</a>; <a onClick="return mV(\'2Ki\',13,22);">13:22</a>); and they were the first on the west of the Jordan to be carried away captive (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>).<P>5. Sites and Inhabitants:<P>The largest town in Mt. Naphtali today (in 1915) is Safed, on the heights due north of the Sea of Galilee, often spoken of as the "city set on a hill." It is built in the form of a horseshoe, open to the north, round the Castle Hill, on which are the ruins of the old fortress of the Templars. This is a position of great strength, which could hardly fail to be occupied in ancient times, although, so far, it cannot be identified with any ancient city. It contains between 20,000 and 30,000 inhabitants. Over against it to the northwest, beyond the deep gorge of Wady Leimun, rises Jebel Jermuk, the highest mountain in Palestine proper (circa 4,000 feet) which may be the scene of the <a href="./study/isbe/search.html?string=TRANSFIGURATION">TRANSFIGURATION</a> (which see). The inhabitants of Safed were massacred by Sultan Bibars in 1266. The city suffered severely from earthquake in 1759; and it shared with Tibefias, also a city of Naphtali., the disaster wrought by the earthquake of 1837. It is one of the holy cities of the Jews.<P>6. Labors of Jesus in This District:<P>In the land of Naphtali Jesus spent a great part of his public life, the land of Gennesaret, Bethsaida, Capernaum and Chorazin all lying within its boundaries (compare <a onClick="return mV(\'Mat\',4,15);">Mt 4:15</a>).`<a href="./study/isbe/search.html?string=GALILEE">GALILEE</a>`54';
isbe[6275]='Naphtali, Mount`(har naphtali; en to orei to Nephthalei): This was the most northerly of the three divisions of the Western Range, which derived their names from those of the tribes holding chief sway over them—Mt. Judah, Mt. Ephraim, and, Mt. Naphtali (<a onClick="return mV(\'Jos\',20,7);">Jos 20:7</a> the King James Version, the Revised Version (British and American) replaces Mount" by the hill country of").``1';
isbe[6276]='Naphthar`naf\'-thar (the King James Version): the Revised Version (British and American) "Nephthar."``1';
isbe[6277]='Naphtuhim`naf-tu\'-him (naphtuchim; Septuagint Nephthaleim): A son of Mizraim (<a onClick="return mV(\'Gen\',10,13);">Ge 10:13</a>; <a onClick="return mV(\'1Ch\',1,11);">1Ch 1:11</a>); but, according to most modern authorities, a district or a dependency of Egypt. Among the many efforts at identification the following deserve notice: Naphtuhim equals<p>(1) Nephthys (Nephthus) in the northeast of Egypt;<p>(2) Na-ptah, i.e. the people of Ptah, the dwellers in the neighborhood of Memphis;<p>(3) Nathu (according to Herodotus, Natho), which occurs in Assurbanipal\'s Annals as the name of a part of Lower Egypt;<p>(4) Erman (ZATW, X, 118), by the change of a letter, reads Petemhim, which signifies "The Northland"; <p>(5) Spiegelberg sees in the word an old designation of the Delta, and would therefore render the name, "the people of the Delta" (compare Johns, HDB; Skinner and Holzinger on Genesis).``95';
isbe[6278]='Napkin`nap\'-kin (soudarion; Latin sudarium): In <a onClick="return mV(\'Luk\',19,20);">Lu 19:20</a>, the cloth in which the "unprofitable servant" wrapped the money of his lord; compare <a onClick="return mV(\'Jhn\',11,44);">Joh 11:44</a>; <a onClick="return mV(\'Jhn\',20,7);">20:7</a>.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>; <a href="./study/isbe/search.html?string=HANDKERCHIEF">HANDKERCHIEF</a>`1';
isbe[6279]='Narcissus`nar-sis\'-us (Narkissos): In <a onClick="return mV(\'Rom\',16,11);">Ro 16:11</a> Paul sends greetings to "them of the household of Narcissus, that are in the Lord." "The last words may suggest that, though only the Christians in this household have a greeting sent to them, there were other members of it with whom the church had relations" (Denney).<P>Narcissus is a common name, especially among freedmen and slaves. But, as in the case of Aristobulus, some famous person of this name must be meant. Conybeare and Howson mention two, one the wellknown favorite of Claudius, the other a favorite of Nero. The latter, who was put to death by Galba (Dio Cass. lxiv.3), they think to be the Narcissus meant here (Paul, chapter xix). On the other hand, Bishop Lightfoot (Phil, 175) holds that "the powerful freedman Narcissus, whose wealth was proverbial (Juv. Sat. xiv.329), whose influence with Claudius was unbounded, and who bore a chief part in the intrigues of this reign, alone satisfies this condition." Shortly after the accession of Nero, he had been put to death by Agrippina (Tac. Ann. xiii.1; Dio Cass. lx.34) in 54 AD. As this occurred three or four years before the Epistle to the Romans was written, some think another Narcissus is meant. However, as was usual in such cases, his property would be confiscated, and his slaves, becoming the property of the emperor, would swell "Caesar\'s household" as Narcissiani.``78';
isbe[6280]='Nard`nard.`<a href="./study/isbe/search.html?string=SPIKENARD">SPIKENARD</a>`1';
isbe[6281]='Nasbas`nas\'-bas (Nasbas, Codex Sinaiticus Nabad, read by Fritzsche): A name otherwise unknown. It occurs only in Tobit 11:18, "And Achiacharus, and Nasbas his brother\'s son," came to Tobit\'s wedding. Opinions are divided as to whether he was "brother\'s son" of Tobit or Achiacharus. the King James Version margin gives the suggestion of Junius, "Achiacharus who is also called Nasbas," thus identifying Nasbas with Achiacharus, which might gain support from Tobit 1:22 where Achiacharus is mentioned as "brother\'s son" of Tobit. See <a href="./study/isbe/search.html?string=ACHIACHARUS">ACHIACHARUS</a>; <a href="./study/isbe/search.html?string=AMAN">AMAN</a>. Codex Sinaiticus reads "Achiacharus and Nabad his brother\'s sons," which is corrected by another hand to "brother\'s son" (exadelphos). The Itala gives "Nabal avunculus ("maternal uncle") illius"; the, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) "Nabath consobrini ("cousins") Tobiae"; Syriac "Laban his sister\'s son." This person is probably identical with the "Aman" of Tobit 14:10 (see variety of readings under <a href="./study/isbe/search.html?string=AMAN">AMAN</a>) and the nephew in Harris\' Story of Achiqar and His Nephew.``5';
isbe[6282]='Nasi`na\'-se (Codex Vaticanus Nasei; Codex Alexandrinus Nasith; the King James Version, Nasith): The head of one of the families which went up with Zerubbabel (1Esdras 5:32) equals "Neziah" of <a onClick="return mV(\'Ezr\',2,54);">Ezr 2:54</a>; <a onClick="return mV(\'Neh\',7,56);">Ne 7:56</a>.``1';
isbe[6283]='Nasor`na\'-sor.`<a href="./study/isbe/search.html?string=HAZOR">HAZOR</a>`1';
isbe[6284]='Nathan (1)`na\'-than (nathan, "gift"; Nathan): A court prophet in David\'s reign and a supporter of Solomon at his accession. There are three main incidents in his career as depicted in the Old Testament.<P>1. Nathan and David\'s Temple-Plans:<P>The two parallel narratives, <a onClick="return mV(\'2Sa\',7,\'1-17\');">2Sa 7:1-17</a> equals <a onClick="return mV(\'1Ch\',17,\'1-15\');">1Ch 17:1-15</a>, of which the former is the original, relate how David confided to Nathan his intention to build a house for Yahweh\'s ark. Nathan at first blesses the project, but that same night is given a Divine message, and returns to tell the king that instead of David building a house for Yahweh, Yahweh will build a house for David: "I will set up thy seed after thee,...and I will establish his kingdom....I will be his father, and he shall be my son: if he commit iniquity, I will chasten him with the rod of men" (<a onClick="return mV(\'2Sa\',7,\'12-14\');">2Sa 7:12-14</a>). <a onClick="return mV(\'2Sa\',7,13);">2Sa 7:13</a> says that "He shall build a house for my name, and I will establish the throne of his kingdom for ever," but this disturbs the one great thought of the passage, which is that God will build a house for David, and which is also the thought in David\'s prayer (<a onClick="return mV(\'2Sa\',7,\'18-29\');">7:18-29</a>).<P>The word "seed" in <a onClick="return mV(\'2Sa\',7,12);">2Sa 7:12</a> is collective and so throughout the passage, so that the prophecy does not refer to any individual, but, like <a onClick="return mV(\'Deu\',17,\'14-20\');">De 17:14-20</a>; <a onClick="return mV(\'Deu\',18,\'15-22\');">18:15-22</a>, belongs to the group of generic prophecies. Nor is it Messianic, for <a onClick="return mV(\'2Sa\',7,14);">2Sa 7:14</a> could not be reconciled with the sinlessness of Jesus. The message is rather a promise of the ever-merciful providence of God in dealing with David\'s family. (See, however, C.A. Briggs, Messianic Prophecy, 126ff.) Budde, who says that the section belongs to the 7th century and is certainly pre-exilic in the leading thought of the passage, sees in the prophecy something of the idealism of Amos and Hosea, for the prophet teaches that Yahweh dwells, not in "a holy place made with hands" (<a onClick="return mV(\'Hbr\',9,11,24);">Heb 9:11,24</a>), but rather in the life of the nation as represented by the direct succession of Davidic kings. This presents an extension of the teaching of Paul that the very body itself is a sanctuary unto God (<a onClick="return mV(\'1Cr\',6,19);">1Co 6:19</a>).<P>2. Nathan and David\'s Sin:<P><a onClick="return mV(\'2Sa\',12,\'1-25\');">2Sa 12:1-25</a> narrates Nathan\'s rebuke of David for his adultery, and for causing the death of Uriah; and then comes an account of the death of Bathsheba\'s child. In <a onClick="return mV(\'2Sa\',12,\'1-15\');">12:1-15a</a>, we have Nathan\'s parable of the rich man and the poor man\'s ewe lamb, and the application of it to David\'s conduct. But several difficulties arise when we ask exactly what Nathan\'s message to David was: <a onClick="return mV(\'2Sa\',12,13);">12:13</A>f represent the prophet as saying that God has forgiven David but that the child will die, while <a onClick="return mV(\'2Sa\',12,10-12);">12:10-12</a> speak of a heavy punishment that is to come upon David and his family, and <a onClick="return mV(\'2Sa\',12,16);">12:16</A> does not show any indication of a prophecy as to the child\'s death. Commentators regard <a onClick="return mV(\'2Sa\',12,\'1-15\');">12:1-15a</A> as later in origin than <a onClick="return mV(\'2Sa\',11,\'1-\');">2Sa 11</a>; <a onClick="return mV(\'2Sa\',12,\'1-\');">12</a> in the main, and hold <a onClick="return mV(\'2Sa\',12,\'10-12\');">12:10-12</A> to be still later than the rest of <a onClick="return mV(\'2Sa\',12,\'1-15\');">12:1-15a</A>. Budde omits <a onClick="return mV(\'2Sa\',12,9,10,11,12);">12:9a, 10ab, 11,12</A>, but regards even the rest of the story as interrupting the connection between <a onClick="return mV(\'2Sa\',11,27);">11:27b</A> and <a onClick="return mV(\'2Sa\',12,15);">12:15b</A>, and therefore of later date.<P>3. Nathan and Solomon\'s Accession:<P><a onClick="return mV(\'1Ki\',1,\'1-\');">1 Kings 1</a> is a part of "one of the best pieces of Hebrew narrative in our possession" (H.P. Smith, Old Testament History,153, note 2). It narrates the part that Nathan played in the events that led to Solomon\'s accession. David was getting old and feeble, and the succession had not been settled. When Adonijah, who was probably the eldest son living, gave a banquet to some of his father\'s state officials, Nathan, who was one of those that had not been invited, incited Bathsheba, Solomon\'s mother, to remind David of his promise to her that Solomon should succeed to the throne. This she did, and in the middle of her audience with David, Nathan appears with the news of Adonijah\'s feast and proclamation as king. Solomon is then anointed king by David\'s command, Nathan being one of his chief supporters. It has been suggested that it is only Nathan who interprets Adonijah\'s feast as a claim to the throne, but this contradicts <a onClick="return mV(\'1Ki\',1,5);">1Ki 1:5</a>. Yet, whereas in the two sections treated above Nathan is the prophet of Yahweh, he is represented in 1 Kings as an intriguing court politician, planning very cleverly an opportune entrance into David\'s presence at the very time that Bathsheba has an audience with the king. The parallel narrative of <a onClick="return mV(\'1Ch\',28,1);">1Ch 28</a> makes no mention of Nathan, Solomon being there represented as Divinely elected to succeed David.<P><a onClick="return mV(\'1Ki\',4,5);">1Ki 4:5</a> mentions a Nathan as father of Azariah and Zabud, two of the chief officers of Solomon. He is probably the prophet.<P><a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>; <a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a> refer to "the words" or rather "the acts of Nathan the prophet" as well as those of Samuel and Gad. "There can be no doubt that these are nothing more than references to the narratives in which Samuel, Nathan and Gad are mentioned in our Books of Samuel" (Curtis on <a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>). In <a onClick="return mV(\'2Ch\',29,25);">2Ch 29:25</a>, sanction is claimed for Levitical temple-music as being commanded by God through Nathan and Gad.<P>Curtis (on <a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>) observes that Nathan is always called nabhi\' ("prophet") in Samuel and Kings and not ro\'eh or chozeh, "seer."``149';
isbe[6285]='Nathan (2)`(1) A prophet (<a onClick="return mV(\'2Sa\',7,\'1-\');">2Sa 7</a>; <a onClick="return mV(\'Psa\',51,1);">Ps 51, title</a>). See preceding article [<A href="./study/isbe/search.html?string=NATHAN+(1)">Nathan (1)</a>].<P>(2) A son of King David (<a onClick="return mV(\'2Sa\',5,14);">2Sa 5:14</a>; <a onClick="return mV(\'1Ch\',3,5);">1Ch 3:5</a>; <a onClick="return mV(\'1Ch\',14,4);">14:4</a>).<P>(3) Father of Igal, one of David\'s heroes (<a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a>). In <a onClick="return mV(\'1Ch\',11,38);">1Ch 11:38</a>, we have "Joe the brother of Nathan"; the Septuagint\'s Codex Vaticanus has "son" in this verse, but it is impossible to say whether Igal or Joel is the correct name.<P>(4) A Jerahmeelite (<a onClick="return mV(\'1Ch\',2,36);">1Ch 2:36</a>), whose son is called Zabad, whom some suppose to be the same as Zabud (<a onClick="return mV(\'1Ki\',4,5);">1Ki 4:5</a>). On this view this Nathan is the same as the prophet (see 1, above).<P>(5) A companion of Ezra from Babylon (<a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a> and 1Es 8:44).<P>(6) Nathanias (1Esdras 9:34), one of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,39);">Ezr 10:39</a>).<P>(7) Name of a family (<a onClick="return mV(\'Zec\',12,12);">Zec 12:12</a>).``149';
isbe[6286]='Nathan-Melech`na\'-than-mel\'-ek (nethan-melekh, "king\'s gift"): A Judean official, to whose chamber King Josiah removed "the horses of the sun" (<a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>). The Septuagint calls him "Nathan, the king\'s eunuch" (Nathan basileos tou eunouchou).``1';
isbe[6287]='Nathanael (1)`na-than\'-a-el (Nathanael):<P>(1) One of the "captains over thousands" who furnished the Levites with much cattle for Josiah\'s Passover (1Esdras 1:9) equals "Nethanel" of <a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>.<P>(2) (Nathanaelos, Codices Vaticanus and Alexandrinus omit): One of the priests who had married a "strange wife" (1Esdras 9:22) equals "Nethanel" of <a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>.<P>(3) An ancestor of Judith (Judith 8:1).<P>(4) One of the Twelve Apostles.`<a href="./study/isbe/search.html?string=NATHANAEL+2">NATHANAEL 2</a>`1';
isbe[6288]='Nathanael (2)`(nethan\'el, "God has given"; Nathanael): Nathanael, who was probably a fisherman, belonged to Cana in Galilee (<a onClick="return mV(\'Jhn\',21,2);">Joh 21:2</a>). According to the "Genealogies of the Twelve Apostles" (compare Budge, Contendings of the Apostles, II, 50), Nathanael was the same as Simon, the son of Cleopas, and was one of the Twelve. He was among those who met and conversed with Jesus during the preaching of John the Baptist at Bethany beyond Jordan (compare <a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>). From the manner of the invitation extended to him by Philip (<a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>), it is evident that Nathanael was well versed in ancient Scripture, and that in him also the preaching of John had aroused a certain expectancy. His reply to Philip, "Can any good thing come out of Nazareth? (<a onClick="return mV(\'Jhn\',1,46);">Joh 1:46</a>), was prompted, not by any ill repute of the place, but by its petty insignificance and familiarity in Nathanael\'s eyes. To this question Philip made no direct answer, but replied, "Come and see." It was the answer best fitted to the man and the occasion; it appealed to Nathanael\'s fair-mindedness and sincerity of purpose. He responded nobly to the call, and on approaching Jesus was received with the words: "Behold, an Israelite indeed, in whom is no guile!" (<a onClick="return mV(\'Jhn\',1,47);">Joh 1:47</a>). It was a tribute to that singleness of heart which enabled him to overcome his initial prejudice. The same candor and openness distinguished the after-interview of Nathanael with Jesus, as is evident by his question, "Whence knowest thou me?" (<a onClick="return mV(\'Jhn\',1,48);">Joh 1:48</a>). The reply of Jesus was not what he expected. It concerned the time he had spent under the fig tree, kneeling, no doubt, in silent prayer and communion with God, and brought to mind all the sacred hopes and aspirations of that hour. It taught him that here was One who read on the instant the inmost secrets of his heart, and was Himself the ideal for whom he was seeking; and it drew from him the confession, "Rabbi, thou art the Son of God; thou art King of Israel" (<a onClick="return mV(\'Jhn\',1,49);">Joh 1:49</a>).<P>Although Nathanael is mentioned by name only once again in the New Testament, where he is one of the seven who witnessed the appearance of the risen Jesus at the Sea of Tiberias (<a onClick="return mV(\'Jhn\',21,2);">Joh 21:2</a>), it is evident that the connection and companionship of Nathanael with Jesus must have been much closer than those two incidents would lead us to suppose. Accordingly, attempts have been made to identify him with other New Testament characters, the most commonly accepted being Bartholomew (compare <a href="./study/isbe/search.html?string=BARTHOLOMEW">BARTHOLOMEW</a>). The principal arguments in support of this identification are:<P>(1) Nathanael is never mentioned by the synoptists, and Bartholomew is never mentioned by John, who further implies that Nathanael was one of the twelve disciples (compare <a onClick="return mV(\'Jhn\',20,\'24-26\');">Joh 20:24-26</a>; <a onClick="return mV(\'Jhn\',21,2);">21:2</a>);<P>(2) in the Synoptists, Philip is closely connected with Bartholomew (compare lists of the apostles), and in John with Nathaniel (compare <a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>ff);<P>(3) the fact that most of the other apostles bear two names. Arguments are also adduced to identify him wit h Simon the Cananean (compare <a href="./study/isbe/search.html?string=SIMON">SIMON</a>). Nathanael has also been identified with Matthew and Mattbias (based on the similarity of name-meanings), with John the son of Zebedee, with Stephen, and even with Paul.``88';
isbe[6289]='Nathanias`nath-a-ni\'-as (Nathanias): One of those who put away their foreign wives (1Esdras 9:34) equals "Nathan" of <a onClick="return mV(\'Ezr\',10,39);">Ezr 10:39</a>.``1';

isbe[6292]='Natural Features`fe\'-turz: As has been pointed out by various authors (compare HGHL), the principal physical features of Palestine run in north and south lines, or rather about from south-southwest to north-northeast.<P>The lowland or Shephelah (the King James Version "vale, valley, plain, or low country") includes the maritime plain and the western foothills.<P>The hill country consists of the mountains of Judea, and its features are continued northward to the plain of Esdraelon and southward to the Sinaitic peninsula. It is rocky and has very little water. Except for the few fountains, the scanty population depends upon rain water collected during the winter months.<P>The Arabah (Revised Version) includes the Jordan valley from the Sea of Galilee to the Dead Sea, as well as the depression running from the Dead Sea to the Gulf of Akabah. It is to the latter depression that the name Wady-ul-\'Arabah is now applied by the Arabs. It is bounded on the east by Mr. Seir or Edom, and on the west by the mountains of the Sinaitic peninsula. Its highest point, about halfway between the Dead Sea and the Gulf of Akabah, is a few hundred ft. higher than the level of the Mediterranean, but nearly 2,000 ft. above the level of the Dead Sea. From this point the valley slopes southward to the Gulf of Akabah, and northward to the Dead Sea. The lower Jordan valley slopes from about 600 ft. below ocean-level at the Sea of Galilee to about 1,300 ft. below ocean-level at the Dead Sea.<P>To the east are the highlands of Gilead and Moab rising abruptly from the valley, as does the hill country of Judea on the west. The country to the east of the Jordan-Dead Sea-Arabah depression, to the whole of which the name Ghaur (Ghor) is applied by the Arabs, is a great table-land sloping gradually to the east from the sharp edge which overlooks the Ghaur. It has no conspicuous peaks. What appear to be peaks when viewed from the Ghaur are irregularities of its western contour, which are invisible or appear as slight mounds to the observer who looks westward from any point some miles to the east Mt. Nebo, for instance, when seen from Medeba is not readily distinguishable. This is because it really does not rise above the general level of the table-land. The small annual rainfall on the heights near the Ghaur diminishes eastward, and the desert begins within from 20 to 40 miles.<P>Another term much used by Old Testament writers is south or Negeb, which embraces the southernmost portion of the promised land, and was never effectively occupied by the Israelites. Its uttermost boundary was the "river of Egypt" (al-\'Arish), and coincides roughly with the present boundary between the Ottoman territory on the east and the Anglo-Egyptian territory of Sinai on the west.<P>The term slopes, \'ashedhoth, the King James Version "springs," occurs in <a onClick="return mV(\'Jos\',10,40);">Jos 10:40</a>, "So Joshua smote all the land, the hill country...and the lowland, and the slopes, and all their kings"; and again in <a onClick="return mV(\'Jos\',12,7,8);">Jos 12:7,8</a>, "And Joshua gave it...for a possession according to their divisions; in the hill-country, and in the lowland, and in the Arabah, and in the slopes, and in the wilderness, and in the south." In the former passage, it seems to refer to the foothills which form the eastern or higher part of the lowland or Shephelah. In the latter passage, it might mean the same, or it might mean the descent from the Judean hills to the Ghaur. In <a onClick="return mV(\'Deu\',3,17);">De 3:17</a>; <a onClick="return mV(\'Deu\',4,49);">4:49</a>; <a onClick="return mV(\'Jos\',12,3);">Jos 12:3</a>; <a onClick="return mV(\'Jos\',13,20);">13:20</a>, we have "the slopes of Pisgah" (\'ashdoth-ha-pisgah, "springs of Pisgah"), which denotes the descent from the heights of Moab to the Ghaur. The same word occurs in the sing in <a onClick="return mV(\'Num\',21,15);">Nu 21:15</a>, referring to the descent to the Arnon. "Slopes," therefore, does not seem to be a term applied to any particular region.<P>The wilderness is usually the desert of the wandering, including the central part of the Sinaitic peninsula, but it is by no means always used in this sense, e.g. <a onClick="return mV(\'Jos\',8,15,20,24);">Jos 8:15,20,24</a>, where it clearly refers to a region near Ai. "The wilderness" of <a onClick="return mV(\'Mat\',4,1);">Mt 4:1</a> is thought to be the barren portion of Judea between Jerusalem and the Jordan.`<a href="./study/isbe/search.html?string=CHAMPAIGN">CHAMPAIGN</a>; <a href="./study/isbe/search.html?string=COUNTRY">COUNTRY</a>; <a href="./study/isbe/search.html?string=DESERT">DESERT</a>; <a href="./study/isbe/search.html?string=EAST">EAST</a>; <a href="./study/isbe/search.html?string=HILL">HILL</a>; <a href="./study/isbe/search.html?string=LOWLAND">LOWLAND</a>; <a href="./study/isbe/search.html?string=SOUTH">SOUTH</a>`37';

isbe[6295]='Natural; Nature`nat\'-u-ral, na\'-tur (leach; psuchikos, phusikos, phusis): <P>1. As Used in the Old Testament:<P>"Natural" is the translation of leach, "freshness or vigor" (<a onClick="return mV(\'Deu\',34,7);">De 34:7</a>). Of Moses it is said, "His eye was not dim, nor his natural force abated."<P>"Nature" in the sense of a system or constitution does not occur in the Old Testament. The world and men, each individual, were conceived as being the direct creation of a supra-mundane God, and conserved by His power and Spirit. The later conception of "nature" came in through Greek influences.<P>In the Apocrypha, we find "nature" in the sense of innate character or constitution (The <span class="noTag">Wisdom of Solomon 7:20</span>, "the natures (phuseis) of living creatures"; The <span class="noTag">Wisdom of Solomon 13:1</span>, "Surely vain are all men by nature" (phusei), 3Macc 3:29, "mortal nature" (phusis)).<P>2. As Used in the New Testament:<P>In the New Testament "nature" (phusis) is frequently found in the latter sense (<a onClick="return mV(\'Rom\',1,26);">Ro 1:26</a>, "against nature"; <a onClick="return mV(\'Rom\',2,14);">Ro 2:14</a>, "by nature"; <a onClick="return mV(\'Rom\',2,27);">Ro 2:27</a>; <a onClick="return mV(\'Rom\',11,24);">11:24</a>, also "contrary to nature"; <a onClick="return mV(\'1Cr\',11,14);">1Co 11:14</a>, "Doth not even nature itself teach you?"; <a onClick="return mV(\'Gal\',2,15);">Ga 2:15</a>; <a onClick="return mV(\'Gal\',4,8);">4:8</a>; <a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>; in <a onClick="return mV(\'2Pe\',1,4);">2Pe 1:4</a>, we have "that ye might be partakers of the divine nature," the Revised Version margin "or, a"); phusis occurs also in <a onClick="return mV(\'Jam\',3,7);">Jas 3:7</a>, "every kind of beasts," the Revised Version margin "Greek: nature," also "mankind" (<a onClick="return mV(\'Jam\',3,7);">3:7</a>), the Revised Version margin "Greek: the human nature." "Natural" (<a onClick="return mV(\'Rom\',11,21,24);">Ro 11:21,24</a>) is the translation of kata phusin, "according to nature." Paul in 1 Corinthians speaks of "the natural man" (<a onClick="return mV(\'1co\',2,14);">2:14</A>, the American Revised Version margin "or unspiritual, Greek: physical") and of a "natural body" (<a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a> twice), the Greek word being psuchikos, "of the soul" (psuche), the animal, natural, principle, as contrasted with what pertains to the higher principle of the spirit (pneuma). In <a onClick="return mV(\'1Cr\',15,46);">1Co 15:46</a> the contrast is expressed, "Howbeit that is not first which is spiritual, but that which is natural," the American Revised Version margin "Greek: physical." The "natural man" is the man in whom the spirit is unquickened, the "natural body" is that corresponding to the psychical or soul-nature, the "spiritual body" that corresponding to the Spirit as the dominant principle of the life. In <a onClick="return mV(\'Jud\',1,10);">Jude 1:10</a>, we have phusikos, "naturally" "naturally, as brute beasts," the Revised Version (British and American) "naturally, like the creatures without reason"; genesis, "origin," "birth," is translated "natural" (<a onClick="return mV(\'Jam\',1,23);">Jas 1:23</a>, "his natural face," the Revised Version margin "Greek: the face of his birth"); and "nature" (<a onClick="return mV(\'Jam\',3,6);">Jas 3:6</a>, "the course of nature" the Revised Version (British and American) "the wheel of nature" margin "or birth") ("wheel" probably means "circle of nature" (the whole creation; see <a href="./study/isbe/search.html?string=COURSE">COURSE</a>)); gnesios, "genuine" ("true to right nature") "legitimate," "sincere," is translated "naturally" (<a onClick="return mV(\'Phl\',2,20);">Php 2:20</a>, "who will naturally care for your state," the Revised Version (British and American) "truly," margin "Greek: genuinely").``185';

isbe[6297]='Naught; Naughty; Naughtiness`not, no\'-ti, nes: In the sense of bad, worthless, worthlessness, the words in the King James Version represent the Hebrew ra\', changed in the Revised Version (British and American) to "bad" (<a onClick="return mV(\'2Ki\',2,19);">2Ki 2:19</a>; <a onClick="return mV(\'Pro\',20,14);">Pr 20:14</a>; <a onClick="return mV(\'Jer\',24,2);">Jer 24:2</a>), roa\', retained in the Revised Version (British and American) "naughtiness" (<a onClick="return mV(\'1Sa\',17,28);">1Sa 17:28</a>), hawwah, rendered in the Revised Version (British and American) in <a onClick="return mV(\'Pro\',11,6);">Pr 11:6</a> "iniquity," and in <a onClick="return mV(\'Pro\',17,4);">17:4</A> "mischievous." In <a onClick="return mV(\'Pro\',6,12);">Pr 6:12</a>, "naughty person," literally, "man of Belial," is in the Revised Version (British and American) "worthless person." In the New Testament, "superfluity of naughtiness" in <a onClick="return mV(\'Jam\',1,21);">Jas 1:21</a> (for kakia) becomes margin the Revised Version (British and American) overflowing of wickedness," margin "malice," and in The <span class="noTag">Wisdom of Solomon 12:10</span>, the King James Version\'s "naughty generation" (poneros) is made into "by birth...evil."``132';
