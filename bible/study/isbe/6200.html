equately explained only by reference, not to what it had in common with other religions, but to what was distinctive and original in it. Paul was after all a Jew (though a broad one), who always retained traces of his Pharisaic training, and who viewed idolatry with abhorrence; and the chief formative factor of his thinking was his own profound religious experience. It is inconceivable that such a man should so assimilate Gentile modes of thought as to be completely colored by them. The characteristics which his teaching has in common with the pagan religions are simply a witness to the common religious wants of mankind, and not to his indebtedness to them. What turned these religions into Mysteries was the secrecy of their rites; but in the New Testament there are no secret rites. The gospel "mystery" (as we have seen) is not a secret deliberately withheld from the multitude and revealed only to a privileged religious aristocracy, but something which was once a secret and is so no longer. The perfect openness of Christ and His apostles sets them in a world apart from the mystic schools. It is true that later the Mysteries exercised a great influence on ecclesiastical doctrine and practice, especially on baptism and the Eucharist (see Hatch, Hibbert Lectures, chapter x). But in the New Testament, acts of worship are not as yet regarded as mystic rites. The most we can say is that some New Testament writers (especially Paul) make use of expressions and analogies derived from the mystery-religions; but, so far as our present evidence goes, we cannot agree that the pagan cults exercised a central or formative influence on them.<P>LITERATURE.<P>There is a large and growing literature on this subject. Its modern scientific study began with C.A. Lobeck\'s Aglaophamus (1829). The following recent works may be specially mentioned: Gustav Anrich, Das antike Mysterienwesen (1894); G. Wobbermin, Religiongeschichtliche Studien zur Frage, etc. (1896); E. Hatch, Essays in Biblical Greek (1889) and Hibbert Lectures, 1888 (published 1890); F.B. Jevons, An Introduction to the History of Religion (1896); S. Cheethara, The Mysteries, Pagan and Christian (1897); R. Reitzenstein, Die hellenistischen Mysterienreligionen (1910); P. Gardner, The Religious Experience of Paul (1911); K. Lake, The Earlier Epistles of Paul (1911); articles on "Mystery" in Encyclopedia Britannica (11th edition), edition 9 (W.M. Ramsay), and edition 11 (L.R. Farnell), Encyclopedia Biblica (A. Julicher), Hastings, Dictionary of the Bible (five volumes) (A. Stewart); 1-volume Hastings, Dictionary of the Bible; (G.G. Findlay); Hastings, Dictionary of Christ and the Gospels (R.W. Bacon); articles on musterion in Cremer and Grimm-Thayer New Testament Lexicons; the commentaries, including J.B. Lightfoot on Colossians, J. Armitage Robinson on Ephesians, H. Lietzmann on 1 Corinthians; 9 articles in The Expositor on "St. Paul and the Mystery Religions" by Professor H.A.A. Kennedy (April,1912,to February, 1913).``49';
isbe[6223]='Mythology`mi-thol\'-o-ji.`<a href="./study/isbe/search.html?string=FABLE">FABLE</a>; <a href="./study/isbe/search.html?string=BABYLONIA+AND+ASSYRIA,+RELIGION+OF">BABYLONIA AND ASSYRIA, RELIGION OF</a>; <a href="./study/isbe/search.html?string=GREECE,+RELIGION+IN+ANCIENT">GREECE, RELIGION IN ANCIENT</a>`1';
isbe[6224]='Naam`na\'-am (na\'am): A son of Caleb (<a onClick="return mV(\'1Ch\',4,15);">1Ch 4:15</a>)``1';
isbe[6225]='Naamah (1)`na\'-a-ma. (na\'amah, "pleasant"; Noema):<P>(1) Daughter of Lamech and Zillah, and sister of Tubal-cain (<a onClick="return mV(\'Gen\',4,22);">Ge 4:22</a>; compare Josephus, Ant, I, ii, 2).<P>(2) An Ammonitish woman whom Solomon married, and who became the mother of Rehoboam (<a onClick="return mV(\'1Ki\',14,21);">1Ki 14:21</a>; <a onClick="return mV(\'2Ch\',12,13);">2Ch 12:13</a>). According to an addition in the Septuagint following <a onClick="return mV(\'1Ki\',12,24);">1Ki 12:24</a>, "her name was Naaman, the daughter of Ana (Hanun) son of Nahash, king of the sons of Ammon" (see Benzinger, Konige, in the place cited.).``1';
isbe[6226]='Naamah (2)`(1) One of a group of 16 lowland (Shephelah) cities forming part of Judah\'s inheritance (<a onClick="return mV(\'Jos\',15,41);">Jos 15:41</a>).<P>(2) The home of Zophar, one of Job\'s friends (<a onClick="return mV(\'Job\',2,11);">Job 2:11</a>, etc.).`<a href="./study/isbe/search.html?string=NAAMATHITE">NAAMATHITE</a>`1';
isbe[6227]='Naaman`na\'-a-man (na\'aman, "pleasantness"; Septuagint; Codices Vaticanus and Alexandrinus Naiman; so Westcott and Hort, The New Testament in Greek in the New Testament; Textus Receptus of the New Testament, Neeman): <P>(1) A successful Syrian general, high in the confidence and esteem of the king of Syria, and honored by his fellow-countrymen as their deliverer (<a onClick="return mV(\'2Ki\',5,\'1-27\');">2Ki 5:1-27</a>). Afflicted with leprosy, he heard from a Hebrew slave-maid in his household of the wonder-working powers of an Israelite prophet. Sent by his master with a letter couched in somewhat peremptory terms to the king of Israel, he came to Samaria for healing. The king of Israel was filled with suspicion and alarm by the demands of the letter, and rent his clothes; but Elisha the prophet intervened, and sent word to Naaman that he must bathe himself seven times in the Jordan. He at first haughtily resented the humiliation and declined the cure; but on the remonstrance of his attendants he yielded and obtained cleansing. At once he returned to Samaria, testified his gratitude by the offer of large gifts to the prophet, confessed his faith in Elisha\'s God, and sought leave to take home with him enough of the soil of Canaan for the erection of an altar to Yahweh.<P>The narrative is throughout consistent and natural, admirably and accurately depicting the condition of the two kingdoms at the time. The character of Naaman is at once attractive and manly. His impulsive patriotic preference for the streams of his own land does not lessen the reader\'s esteem for him, and the favorable impression is deepened by his hearty gratitude and kindness.<P>The Israelite king is most probably Jehoram, son of Ahab, and the Syrian monarch Ben-hadad II. Josephus (Ant., VIII, xv, 5) identifies Naaman with the man who drew his bow at a venture, and gave Ahab his death wound (<a onClick="return mV(\'1Ki\',22,34);">1Ki 22:34</a>). There is one reference to Naaman in the New Testament. In <a onClick="return mV(\'Luk\',4,27);">Lu 4:27</a>, Jesus, rebuking Jewish exclusiveness, mentions "Naaman the Syrian."<P>(2) A son of Benjamin (<a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a>). Fuller and more precise is the description of <a onClick="return mV(\'Num\',26,38,40);">Nu 26:38,40</a>, where he is said to be a son of Bela and grandson of Benjamin (see also <a onClick="return mV(\'1Ch\',8,3);">1Ch 8:3</a>f).``95';
isbe[6228]='Naamathite`na\'-a-ma-thit, na-am\'-a-thit (na\'amdthi, "a dweller in Naaman"; ho M(e)inaion basileus): The description of Zophar, one of Job\'s friends (<a onClick="return mV(\'Job\',2,11);">Job 2:11</a>; <a onClick="return mV(\'Job\',11,1);">11:1</a>; <a onClick="return mV(\'Job\',20,1);">20:1</a>, etc.). Naamah is too common a place-name to permit of the identification of Zophar\'s home; the Septuagint renders it as "king of the Minaeans."``1';
isbe[6229]='Naamite`na\'-a-mit (ha-na\'ami, "the Naamite"): A family which traced its descent from Naaman (<a onClick="return mV(\'Num\',26,40);">Nu 26:40</a>).`<a href="./study/isbe/search.html?string=NAAMAN">NAAMAN</a>`1';
isbe[6230]='Naarah (1)`na\'-a-ra (na\'arah, "a girl"): One of the two wives of Ashhur, father of Tekoa (<a onClick="return mV(\'1Ch\',4,5);">1Ch 4:5</a>).``1';
isbe[6231]='Naarah (2)`na\'arah; Codex Vaticanus hai komai auton; Codex Alexandrinus Naaratha; the King James Version Naarath): A town in the territory of Ephraim (<a onClick="return mV(\'Jos\',16,7);">Jos 16:7</a>). It appears as "Naaran" in <a onClick="return mV(\'1Ch\',7,28);">1Ch 7:28</a> (Codex Vaticanus Naarnan; Codex Alexandrinus Naaran). Eusebius, Onomasticon (s.v. "Noorath") places it 5 Roman miles from Jericho. The name has not been recovered, and no identification is certain. The position would agree with that of el-\'Aujeh, about 5 miles northeast of Jericho.``1';
isbe[6232]='Naarai`na\'-a-ri (na\'aray): Son of Ezbai, one of David\'s heroes (<a onClick="return mV(\'1Ch\',11,37);">1Ch 11:37</a>). In the parallel passage (<a onClick="return mV(\'2Sa\',23,35);">2Sa 23:35</a>), he is called "Paarai the Arbite." The true forms of the name and description are uncertain (see Budde, Richter u. Samuel, and Curtis, Chronicles).``1';
isbe[6233]='Naaran; Narath`na\'-a-ran, na\'-a-rath (na\'aran, na\'arath).`<a href="./study/isbe/search.html?string=NAARAH">NAARAH</a>`1';
isbe[6234]='Naashon; Naason; Naasson`na\'-a-shon, na-ash\'-on, na\'-a-son, na-as\'-on (Naasson): the King James Version Greek form of "Nahshon" (thus, the Revised Version (British and American)) (<a onClick="return mV(\'Mat\',1,4);">Mt 1:4</a>; <a onClick="return mV(\'Luk\',3,32);">Lu 3:32</a>).``1';
isbe[6235]='Naathus`na\'-a-thus (Naathos): One of the sons of Addi who put away his foreign wife (1Esdras 9:31). It apparently corresponds to "Adna" of <a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>, of which it is a transposition. Codex Vaticanus reads Lathos, probably confusing a capital Alpha and a capital Lambda.``1';
isbe[6236]='Nabal`na\'-bal (nabhal, "foolish" or "wicked"; Nabal): A wealthy man of Maon in the highlands of Judah, not far from Hebron, owner of many sheep and goats which he pastured around Carmel in the same district. He was a churlish and wicked man (<a onClick="return mV(\'1Sa\',25,2);">1Sa 25:2</a>). When David was a fugitive from Saul, he and his followers sought refuge in the wilderness of Paran, near the possessions of Nabal, and protected the latter\'s flocks and herds from the marauding Bedouin. David felt that some compensation was due him for such services (<a onClick="return mV(\'1Sa\',25,15,25);">1Sa 25:15,25</a>), so, at the time of sheep-shearing—an occasion of great festivities among sheep masters—he sent 10 of his young men to Nabal to solicit gifts of food for himself and his small band of warriors. Nabal not only refused any assistance or presents, but sent back insulting words to David, whereupon the latter, becoming very angry, determined upon the extermination of Nabal and his household and dispatched 400 men to execute his purpose. Abigail, Nabal\'s wife, a woman of wonderful sagacity and prudence as well as of great beauty, having learned of her husband\'s conduct and of David\'s intentions, hurriedly proceeded, with a large supply of provisions, dainties and wine, to meet David and to apologize for her husband\'s unkind words and niggardliness, and thus succeeded in thwarting the bloody and revengeful plans of Israel\'s future king. Upon her return home she found her husband in the midst of a great celebration ("like the feast of a king"), drunken with wine, too intoxicated to realize his narrow escape from the sword of David. On the following morning, when sober, having heard the report of his wife, he was so overcome with fear that he never recovered from the shock, but died 10 days later (<a onClick="return mV(\'1Sa\',25,\'36-38\');">1Sa 25:36-38</a>). When David heard about his death, he sent for Abigail, who soon afterward became one of his wives.``34';
isbe[6237]='Nabarias`nab-a-ri\'-as (Nabarias B, Nabareias): One of those who stood upon Ezra\'s left hand as he expounded the Law (1Esdras 9:44). Esdras (loc. cit.) gives only 6 names, whereas Nehemiah (<a onClick="return mV(\'Neh\',8,4);">8:4</a>) gives 7. It is probable that the last (Meshullam) of Nehemiah\'s list is simply dropped and that Nabarias equals Hashbaddanah; or it may possibly be a corruption of Zechariah in Nehemiah\'s list.``1';
isbe[6238]='Nabataeans; Nabathaeans`nab-a-te\'-anz, nab-a-the\'-anz (Nabataioi; in 1Macc 5:25 Codex Sinaiticus reads anabatais hoi, V, Anabattaiois; the King James Version Nabathites, more correctly "Nabataeans"):<P>1. Locality and Early History:<P>A Semitic (Arabian rather than Syrian) tribe whose home in early Hellenistic times was southeast of Palestine, where they had either supplanted or mingled with the Edomites (compare <a onClick="return mV(\'Mal\',1,\'1-5\');">Mal 1:1-5</a>). In Josephus\' day they were so numerous that the territory between the Red Sea and the Euphrates was called Nabatene (Ant., I, xii, 4). They extended themselves along the east of the Jordan with Petra as their capital (Strabo xvi.779; Josephus, Ant, XIV, i, 4; XVII, iii, 2; BJ, I, vi, 2, etc.). Their earlier history is shrouded in obscurity. Jerome, Quaeat in <a onClick="return mV(\'Gen\',25,13);">Ge 25:13</a>, following the hint of Josephus (Ant., I, xii, 4), asserts they were identical with the Ishmaelite tribe of Nebaioth, which is possible, though Nebaioth is spelled with the Hebrew letter taw ("t") and Nabateans is spelled with the Hebrew letter teth ("t). They were apparently the first allies of the Assyrians in their invasions of Edom (compare <a onClick="return mV(\'Mal\',1,1);">Mal 1:1</a>ff). They were later subdued by Sennacherib (Sayce, New Light from the Ancient Monuments, II, 430), but before long regained their independence and resisted Ashurbanipal (Rawlinson, note, at the place). According to Alexander Polyhistor (Fr. 18), they were included in the nomadic tribes reduced by David. Their history is more detailed from 312 BC (Diod. Sic. xix), when Antigonus I (Cyclops) sent his general Athenaeus with a force against them in Petra. After an initial advantage, the army of Athenaeus was almost annihilated. Demetrius, the son of Antigonus, was sent against them a few years later, with little success, though he arranged a friendship with them. The first prince mentioned is Aretas I, to whom the high priest Jason fled in 169 BC. They were friendly to the early Maccabees in the anti-Hellenistic struggle, to Judas in 164 BC (1Macc 5:25) and to Jonathan in 160 BC (1Macc 9:35).<P>2. A Strong Kingdom:<P>Toward the end of the 2nd century BC on the fall of the Ptolemaic and Seleucid Dynasties, the Nabateans under King Erotimus founded a strong kingdom extending east of the Jordan (in 110 BC). Conscious now of their own strength, they resented the ambition of the Hasmonean Dynasty—their former allies—and opposed Alexander Janneus (96 BC) at the siege of Gaza (Josephus, Ant, XIII, xiii, 3). A few years later (90 BC) Alexander retaliated by attacking Obedas I, king of the Nabateans, but suffered a severe defeat east of the Jordan (Josephus, Ant, XIII, xiii, 5; BJ, I, iv, 4). Antiochus XII of Coele-Syria next led an expedition against the Nabateans, but was defeated and slain in the battle of Kana (Josephus, Ant, XIII, xv, 1-2; BJ, I, iv, 7-8). Consequently, Aretas III seized Coele-Syria and Damascus and gained another victory over Alexander Janneus at Adida (in 85 BC).<P>3. Conflicts:<P>The Nabateans, led by Aretas (III (?)), espoused the cause of Hyrcanus against Aristobulus, besieged the latter in Jerusalem and provoked the interference of the Romans, by whom under Scaurus they were defeated (Josephus, Ant, XIV, i, 4f; BJ, I, vi, 2f). After the capture of Jerusalem, Pompey attacked Aretas, but was satisfied with a payment (Josephus, ibid.), and Damascus was added to Syria, though later it appears to have again passed into the hands of Aretas (<a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>). In 55 BC Gabinius led another force against the Nabateans (Josephus, ibid.). In 47 BC Malchus I assisted Caesar, but in 40 BC refused to assist Herod against the Parthians, thus provoking both the Idumean Dynasty and the Romans. Antony made a present of part of Malchus\' territory to Cleopatra, and the Nabatean kingdom was further humiliated by disastrous defeat in the war against Herod (31 BC).<P>4. End of the Nation:<P>Under Aretas IV (9 BC-40 AD) the kingdom was recognized by Augustus. This king sided with the Romans against the Jews, and further gained a great victory over Herod Antipas, who had divorced his daughter to marry Herodias. Under King Abias an expedition against Adiabene came to grief. Malchus II (48-71 AD) assisted the Romans in the conquest of Jerusalem (Josephus, BJ, III, iv, 2). Rabel (71-106 AD) was the last king of the Nabateans as a nation. In 106 AD their nationality was broken up by the unwise policy of Trajan, and Arabia, of which Petra was the capital, was made a Roman province by Cornelius Palma, governor of Syria. Otherwise they might have at least contributed to protecting the West against the East. Diodorus (loc. cit.) represents the Nabateans as a wild nomadic folk, with no agriculture, but with flocks and herds and engaged in considerable trading. Later, however, they seem to have imbibed considerable Aramean culture, and Aramaic became at least the language of their commerce and diplomacy. They were also known as pirates on the Red Sea; they secured the harbor of Elah and the Gulf of \'Akaba. They traded between Egypt and Mesopotamia and carried on a lucrative commerce in myrrh, frankincense and costly wares (KGF, 4th edition (1901), I, 726-44, with full bibliography).``5';
isbe[6239]='Nabathites`nab\'-a-thits: the King James Version equals the Revised Version (British and American) "Nabathaeans."``1';
isbe[6240]='Naboth`na\'-both, na\'-both (nabhoth, from nubh, "a sprout"; Nabouthai): The owner of a vineyard contiguous to the palace of King Ahab. The king desired, by purchase or exchange, to add the vineyard to his own grounds. Naboth, however, refused to part on any terms with his paternal inheritance. This refusal made Ahab "heavy and displeased" (<a onClick="return mV(\'1Ki\',21,4);">1Ki 21:4</a>). Jezebel, the king\'s wife, then took the matter in hand, and by false accusation on an irrelevant charge procured the death of Naboth by stoning (<a onClick="return mV(\'1Ki\',21,\'7-14\');">1Ki 21:7-14</a>). As Ahab was on his way to take possession of the vineyard he met Elijah the prophet, who denounced his vile act and pronounced judgment on king and royal house. A temporary respite was given to Ahab because of a repentant mood (<a onClick="return mV(\'1Ki\',21,\'27-29\');">1Ki 21:27-29</a>); but later the blow fell, first upon himself in a conflict with Syria (<a onClick="return mV(\'1Ki\',22,\'34-40\');">1Ki 22:34-40</a>); then upon his house through a conspiracy of Jehu, in which Jehoram, Ahab\'s son, and Jezebel, his wife, were slain (<a onClick="return mV(\'2Ki\',9,\'25-26\',30);">2Ki 9:25-26,30</a>). In both cases the circumstances recalled the foul treatment of Naboth.``186';
isbe[6241]='Nabuchodonosor`nab-u-ko-don\'-o-sor (Nabouchodonosor): Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) form of "Nebuchadnezzar" ("Nebuchadrezzar") found in the King James Version of the Apocrypha in <span class="noTag">1Esdras 1:40,41,45,48; 2:10; 5:7; 6:26; Additions to Esther 11:4; Baruch 1:9,11,12</span>. It is the form used in the King James Version of the Apocrypha throughout. In the Revised Version (British and American) of Judith and Tobit 14:15, the form "Nebuchadnezzar" is given.``1';
isbe[6242]='Nachor`na\'-kor (Nachor) the King James Version; Greek form of "Nahor" (thus the Revised Version (British and American)). Grandfather of Abraham (<a onClick="return mV(\'Luk\',3,34);">Lu 3:34</a>).``1';
isbe[6243]='Nacon, the Threshing Floor of`na\'-kon, (nakhon; the King James Version Nachon): The place where Uzzah was smitten for putting forth his hand to steady the ark, hence, called afterward "Perezuzzah" (<a onClick="return mV(\'2Sa\',6,8);">2Sa 6:8</a>); in the parallel passage (<a onClick="return mV(\'1Ch\',13,9);">1Ch 13:9</a>) we have kidhon, and in Josephus (Ant., VII, iv, 2) Cheidon. In <a onClick="return mV(\'1Sa\',23,23);">1Sa 23:23</a> the word nakhon occurs, and is translated "of a certainty," margin "with the certainty" or "to a set place"; also in <a onClick="return mV(\'1Sa\',26,4);">1Sa 26:4</a> it is translated "of a certainty," margin "to a set place." It is uncertain whether in <a onClick="return mV(\'1Sa\',6,6);">1Sa 6:6</a> it is a place-name at all; and no successful attempt has been made to identify either Nacon or Chidon; possibly they are both personal names.``117';
isbe[6244]='Nadab`na\'-dab (nadhabh, "noble"; Nadab):<P>(1) Aaron\'s first-born son (<a onClick="return mV(\'Exd\',6,23);">Ex 6:23</a>; <a onClick="return mV(\'Num\',3,2);">Nu 3:2</a>; <a onClick="return mV(\'Num\',26,60);">26:60</a>; <a onClick="return mV(\'1Ch\',6,3);">1Ch 6:3 (Hebrew 5:29)</a>; <a onClick="return mV(\'1Ch\',24,1);">24:1</A>). He was permitted with Moses, Aaron, the 70 elders, and his brother Abihu to ascend Mt. Sinai and behold the God of Israel (<a onClick="return mV(\'Exd\',24,1,9);">Ex 24:1,9</a>). He was associated with his father and brothers in the priestly office (<a onClick="return mV(\'Exd\',28,1);">Ex 28:1</a>). Along with Abihu he was guilty of offering "strange fire," and both "died before Yahweh" (<a onClick="return mV(\'Lev\',10,1,2);">Le 10:1,2</a>; <a onClick="return mV(\'Num\',3,4);">Nu 3:4</a>; <a onClick="return mV(\'Num\',26,61);">26:61</a>). The nature of their offense is far from clear. The word rendered "strange" seems in this connection to mean no more than "unauthorized by the Law" (see zur, in BDB, and compare <a onClick="return mV(\'Exd\',30,9);">Ex 30:9</a>). The proximity of the prohibition of wine to officiating priests (<a onClick="return mV(\'Lev\',10,8,9);">Le 10:8,9</a>) has given rise to the erroneous suggestion of the Midrash that the offense of the brothers was drunkenness.<P>(2) A descendant of Jerahmeel (<a onClick="return mV(\'1Ch\',2,28,30);">1Ch 2:28,30</a>).<P>(3) A Gibeonite (<a onClick="return mV(\'1Ch\',8,30);">1Ch 8:30</a>).<P>(4) Son of Jeroboam I and after him for two years king of Israel (<a onClick="return mV(\'1Ki\',14,20);">1Ki 14:20</a>; <a onClick="return mV(\'1Ki\',15,25);">15:25</a>). While Nadab was investing Gibbethon, a Philistine stronghold, Baasha, who probably was an officer in the army, as throne-robbers usually were, conspired against him, slew him and seized the throne (<a onClick="return mV(\'1Ki\',15,\'27-31\');">1Ki 15:27-31</a>). With the assassination of Nadab the dynasty of Jeroboam was extirpated, as foretold by the prophet Ahijah (<a onClick="return mV(\'1Ki\',14,1);">1Ki 14</a>). This event is typical of the entire history of the Northern Kingdom, characterized by revolutions and counter-revolutions.``95';
isbe[6245]='Nadabath`na\'-da-bath (Nadabath; the King James Version Nadabatha, na-dab\'-a-tha): A city east of the Jordan from which the wedding party of Jambri were coming when Jonathan and Simon attacked them and slew very many, designing to avenge the murder of their brother John (1Macc 9:37ff). Nebo and Nabathaea have been suggested as identical with Nadabath. Clermont-Ganneau would read rhabatha, and identify it with Rabbath-ammon. There is no certainty.``1';
isbe[6246]='Naggai`nag\'-i, nag\'-a-i (Naggai; the King James Version Nagge): In <a onClick="return mV(\'Luk\',3,25);">Lu 3:25</a>, the Greek form of the Hebrew name <a href="./study/isbe/search.html?string=NOGAH">NOGAH</a> (which see).``1';
isbe[6247]='Nahalal`na\'-hal-al (nachalal; Codex Vaticanus, Baithman; Codex Alexandrinus Naalol, and other forms): A city in the territory of Zebulun assigned with its suburbs to the Merarite Levites, out of which the Canaanite inhabitants were not driven (<a onClick="return mV(\'Jos\',19,15);">Jos 19:15</a>, the King James Version (incorrectly) "Nahallal"; <a onClick="return mV(\'Jos\',21,35);">Jos 21:35</a>; <a onClick="return mV(\'Jdg\',1,30);">Jud 1:30</a>, "Nahalol"). In the Talmud Jerusalem (Meg., i.1) it is identified with Mahlul. This name might correspond either with \'Ain Mahil, or with Ma\'lul. The former lies about 3 1/2 miles northeast of Nazareth on a hill near the eastern boundary of Zebulun. The latter is situated about 3 1/2 miles west of Nazareth, near the southern border of Zebulun. The change of "n" to "m" is not unusual.``54';
isbe[6248]='Nahaliel`na-ha\'-li-el, na-hal\'-i-el (nachali\'el, "torrent valley of God"; Codex Vaticanus Manael; Codex Alexandrinus Naaliel): A place where Israel encamped on the way from Arnon to Jericho, named with Mattanah and Bamoth (<a onClick="return mV(\'Num\',21,19);">Nu 21:19</a>). Eusebius, Onomasticon places it near to the Arnon. It is natural to seek for this "torrent valley" in one of the tributaries of the Arnon. It may be Wady Waleh, which drains a wide area to the northeast of the Arnon; or perhaps Wady Zerqa Ma\'in farther to the north.``1';
isbe[6249]='Nahallal; Nahalol`na-hal\'-al, na\'-ha-lol.`<a href="./study/isbe/search.html?string=NAHALAL">NAHALAL</a>`1';
isbe[6250]='Naham`na\'-ham (nacham, "comfort"): A Judahite chieftain, father of Keilah the Garmite (<a onClick="return mV(\'1Ch\',4,19);">1Ch 4:19</a>); the passage is obscure.``1';
isbe[6251]='Nahamani`na-ha-ma\'-ni, na-ham\'-a-ni (nachamani "compassionate"): One of the twelve heads who returned with Zerubbabel (<a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>). The name is wanting in the parallel list (<a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>). In 1Esdras 5:8 he is called "Eneneus" (the Revised Version margin "Enenis").``1';
isbe[6252]='Naharai; Nahari`na\'-ha-ri, (nacharay), na\'-ha-ri (nachray): One of David\'s heroes, Joab\'s armor-bearer (<a onClick="return mV(\'2Sa\',23,37);">2Sa 23:37</a>, the King James Version "Nahari"; <a onClick="return mV(\'1Ch\',11,39);">1Ch 11:39</a>).``1';
isbe[6253]='Nahash`na\'-hash (nachash, "serpent"; Naas):<P>(1) The father of Abigail and Zeruiah, the sisters of David (<a onClick="return mV(\'2Sa\',17,25);">2Sa 17:25</a>; compare <a onClick="return mV(\'1Ch\',2,16);">1Ch 2:16</a>). The text in 2 Samuel, where this reference is made, is hopelessly corrupt; for that reason there are various explanations. The rabbis maintain that Nahash is another name for Jesse, David\'s father. Others think that Nahash was the name of Jesse\'s wife; but it is not probable that Nahash could have been the name of a woman. Others explain the passage by making Nahash the first husband of Jesse\'s wife, so that Abigail and Zeruiah were half-sisters to King David.<P>(2) A king of Ammon, who, at the very beginning of Saul\'s reign, attacked Jabesh-gilead so successfully, that the inhabitants sued for peace at almost any cost, for they were willing to pay tribute and serve the Ammonites (<a onClick="return mV(\'1Sa\',11,1);">1Sa 11:1</a>). The harsh king, not satisfied with tribute and slavery, demanded in addition that the right eye of every man should be put out, as "a reproach upon Israel." They were given seven days to comply with these cruel terms. Before the expiration of this time, Saul, the newly anointed king, appeared on the scene with an army which utterly routed the Ammonites (<a onClick="return mV(\'1Sa\',11,1);">1Sa 11:1</a>), and, according to Josephus, killed King Nahash (Ant., VI, v, 3).<P>If the Nahash of <a onClick="return mV(\'2Sa\',10,2);">2Sa 10:2</a> be the same as the king mentioned in <a onClick="return mV(\'1Sa\',11,1);">1Sa 11</a>, this statement of Josephus cannot be true, for he lived till the early part of David\'s reign, 40 or more years later. It is, of course, possible that Nahash, the father of Hanun, was a son or grandson of the king defeated at Jabesh-gilead by Saul. There is but little agreement among commentators in regard to this matter. Some writers go so far as to claim that "all passages in which this name (Nahash) is found refer to the same individual."<P>(3) A resident of Rabbath-ammon, the capital of Ammon (<a onClick="return mV(\'2Sa\',17,27);">2Sa 17:27</a>). Perhaps the same as <a href="./study/isbe/search.html?string=NAHASH">Nahash (2)</a>, which see. His son Shobi, with other trans-Jordanic chieftains, welcomed David at Mahanaim with sympathy and substantial gifts when the old king was fleeing before his rebel son Absalom. Some believe that Shobi was a brother of Hanun, king of Ammon (<a onClick="return mV(\'2Sa\',10,1);">2Sa 10:1</a>).``34';
isbe[6254]='Nahath`na\'-hath (nachath):<P>(1) A grandson of Esau (<a onClick="return mV(\'Gen\',36,13);">Ge 36:13</a>; <a onClick="return mV(\'1Ch\',1,37);">1Ch 1:37</a>).<P>(2) A descendant of Levi and ancestor of Samuel (<a onClick="return mV(\'1Ch\',6,26);">1Ch 6:26</a>); also called "Toah" (<a onClick="return mV(\'1Ch\',6,34);">1Ch 6:34</a>) and "Tohu" (<a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>).<P>(3) A Levite who, in the time of Hezekiah, assisted in the oversight of "the oblations and the tithes and the dedicated things" (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>).``1';
isbe[6255]='Nahbi`na\'-bi (nachbi): The representative of Naphtali among the 12 spies (<a onClick="return mV(\'Num\',13,14);">Nu 13:14</a>).``1';
isbe[6256]='Nahor`na\'-hor (nachor; in the New Testament Nachor):e representative of Naphtali among the 12 spies (<a onClick="return mV(\'Num\',13,14);">Nu 13:14</a>).<P>(1) Son of Serug and grandfather of Abraham (<a onClick="return mV(\'Gen\',11,\'22-25\');">Ge 11:22-25</a>; <a onClick="return mV(\'1Ch\',1,26);">1Ch 1:26</a>).<P>(2) Son of Terah and brother of Abraham (<a onClick="return mV(\'Gen\',11,26,27,29);">Ge 11:26,27,29</a>; <a onClick="return mV(\'Gen\',22,20,23);">22:20,23</a>; <a onClick="return mV(\'Gen\',24,1524,27);">24:15,24,47</a>; <a onClick="return mV(\'Gen\',29,5);">29:5</a>; <a onClick="return mV(\'Jos\',24,2);">Jos 24:2</a>).<P>A city of Nahor is mentioned in <a onClick="return mV(\'Gen\',24,10);">Ge 24:10</a>; the God of Nahor in <a onClick="return mV(\'Gen\',31,53);">Ge 31:53</a>. In the King James Version <a onClick="return mV(\'Jos\',24,2);">Jos 24:2</a>; <a onClick="return mV(\'Luk\',3,34);">Lu 3:34</a>, the name is spelled "Nachor."``1';
isbe[6257]='Nahshon`na\'-shon (nachshon; Septuagint and New Testament, Naasson): A descendant of Judah; brother-in-law of Aaron and ancestor of David and of Jesus Christ (<a onClick="return mV(\'Exd\',6,23);">Ex 6:23</a>; <a onClick="return mV(\'Num\',1,7);">Nu 1:7</a>; <a onClick="return mV(\'1Ch\',2,10,11);">1Ch 2:10,11</a>; <a onClick="return mV(\'Rth\',4,20);">Ru 4:20</a>; <a onClick="return mV(\'Mat\',1,4);">Mt 1:4</a>; <a onClick="return mV(\'Luk\',3,32);">Lu 3:32</a>).``1';
isbe[6258]='Nahum`na\'-hum (Naoum; the King James Version Naum): An ancestor of Jesus in Luke\'s genealogy, the 9th before Joseph, the husband of Mary (<a onClick="return mV(\'Luk\',3,25);">Lu 3:25</a>).``1';
isbe[6259]='Nahum; the Book of`na\'-hum:<P><b>I. AUTHORSHIP AND DATE</b><P class="in15">1. The Name<P class="in15">2. Life and Home of Nahum<P class="in30">The Four Traditions<P class="in15">3. Date, as Related to Assyrian History<P class="in30">(1) The Revolt of Shamash-shumukin<P class="in30">(2) The Invasion of 625 BC<P class="in30">(3) The Final Attack<P class="in30">(4) Probable Date<P><b>II. THE BOOK</b><P class="in15">1. Contents (<span class="notag">Nahum 1-3</a>)<P class="in15">2. Style<P class="in15">3. Integrity<P><b>III. TEACHING</b><P class="in15">1. The Character of Yahweh<P class="in15">2. Nahum\'s Glee over the Ruin of Nineveh<P class="in15">3. Universality of Yahweh\'s Rule<P class="in15">4. The Messianic Outlook<P><b>LITERATURE</b><hr /><P>I. Authorship and Date.<P>1. The Name:<P>The name Nahum (nachum; Septuagint and New Testament Naoum; Josephus, Naoumos) occurs nowhere else in the Old Testament; in the New Testament it is found in <a onClick="return mV(\'Luk\',3,25);">Lu 3:25</a>. It is not uncommon in the Mishna, and it has been discovered in Phoenician inscriptions. It means "consolation," or "consoler," and is therefore, in a sense, symbolical of the message of the book, which is intended to comfort the oppressed and afflicted people of Judah.<P>2. Life and Home of Nahum:<P>Of the personal life of Nahum, practically nothing is known. In <a onClick="return mV(\'Nah\',1,1);">Na 1:1</a> he is called "the Elkoshite," that is, an inhabitant of Elkosh. Unfortunately, the location of this place is not known.<P>The Four Traditions<P>One tradition, which cannot be traced beyond the 16th century AD, identifies the home of Nahum with a modern village Elkush, or Alkosh, not far from the left bank of the Tigris, two days\' journey north of the site of ancient Nineveh. A second tradition, which is at least as old as the days of Jerome, the latter part of the 4th century, locates Elkosh in Galilee, at a place identified by many with the modern El-Kauze, near Ramieh. Others identify the home of the prophet with Capernaum, the name of which means "Village of Nahum." A fourth tradition, which is first found in a collection of traditions entitled "Lives of the Prophets," says "Nahum was from Elkosh, beyond Bet Gabre, of the tribe of Simeon." A place in the south is more in harmony with the interest the prophet takes in the Southern Kingdom, so that the last-mentioned tradition seems to have much in its favor, but absolute certainty is not attainable.<P>3. Date, as Related to Assyrian History:<P>The Book of Nahum centers around the fall and destruction of Nineveh. Since the capture of the city is represented as still in the future, it seems evident that the prophecies were delivered some time before 607-606 BC, the year in which the city was destroyed. Thus the latest possible date of Nahum\'s activity is fixed. The earliest possible date also is indicated by internal evidence. In <a onClick="return mV(\'Nah\',3,8);">3:8</a>ff the prophet speaks of the capture and destruction of No-amon, the Egyptian Thebes, as an accomplished fact. The expedition of Ashurbanipal, king of Assyria, against Egypt, which resulted in the fall of Thebes, occurred about 663 BC. Hence, the activity of Nahum must be placed somewhere between 663 and 607.<P>As to the exact period between the two dates there is disagreement among scholars. One thing is made quite clear by the prophecy itself, namely, that at the time the words were spoken or written, Nineveh was passing through some grave crisis. Now we know that during the second half of the 7th century BC Assyria was threatened three times:<P>(1) The Revolt of Shamash-shumukin:<P>The revolt of Shamash-shumukin of Babylon against his brother, the king of Assyria, 650-648 BC.<P>(2) The Invasion of 625 BC:<P>The invasion of Assyria and threatened attack upon Nineveh by some unknown foe, perhaps the Scythians, about 625 BC.<P>(3) The Final Attack:<P>The final attack, which resulted in the fall and destruction of Nineveh in 607-606 BC. (4) Probable Date:<P>The first crisis does not offer a suitable occasion for Nahum\'s prophecy, because at that time the city of Nineveh was not in any danger. Little is known concerning the second crisis, and it is not possible either to prove or to disprove that it gave rise to the book. On the other hand, the years immediately preceding the downfall of Nineveh offer a most suitable occasion. The struggle continued for about 2 years. The united forces of the Chaldeans and Scythians met determined resistance; at last a breach was made in the northeast corner of the wall, the city was taken, pillaged and burned. Judah had suffered much from the proud Assyrian, and it is not difficult to understand how, with the doom of the cruel oppressor imminent, a prophet-patriot might burst into shouts of exultation and triumph over the distress of the cruel foe. "If," says A.B. Davidson, "the distress of Nineveh referred to were the final one, the descriptions of the prophecy would acquire a reality and naturalness which they otherwise want, and the general characteristics of Hebrew prophecy would be more truly conserved." There seems to be good reason, therefore, for assigning Nahum\'s activity to a date between 610 and 607 BC.<P>II. The Book.<P>1. Contents (<a onClick="return mV(\'Nah\',1,\'1-\');">Nahum 1-3</a>):<P>Nahum is the prophet of Nineveh\'s doom. <a onClick="return mV(\'Nah\',1,\'1-\');">Nahum 1</a> (plus <a onClick="return mV(\'Nah\',2,2);">2:2</A>) contains the decree of Nineveh\'s destruction. Yahweh is a God of vengeance and of mercy (<a onClick="return mV(\'Nah\',1,2,3);">1:2,3</A>); though He may at times appear slack in punishing iniquity, He will surely punish the sinner. No one can stand before Him in the day of judgment (<a onClick="return mV(\'Nah\',1,4,5,6);">1:4-6</a>). Yahweh, faithful to those who rely upon Him (<a onClick="return mV(\'Nah\',1,7);">1:7</A>), will be terrible toward His enemies and toward the enemies of His people (<a onClick="return mV(\'Nah\',1,8);">1:8</A>). Judah need not fear: the present enemy is doomed (<a onClick="return mV(\'Nah\',1,\'9-14\');">1:9-14</A>), which will mean the exaltation of Judah (<a onClick="return mV(\'Nah\',1,15);">1:15</a>; <a onClick="return mV(\'Nah\',2,2);">2:2</A>). The army appointed to execute the decree is approaching, ready for battle (<a onClick="return mV(\'Nah\',2,\'1-4\');">2:1-4</A>). All efforts to save the city are in vain; it falls (<a onClick="return mV(\'Nah\',2,5,6);">2:5,6</A>), the queen and her attendants are captured (<a onClick="return mV(\'Nah\',2,7);">2:7</a>), the inhabitants flee (<a onClick="return mV(\'Nah\',2,8);">2:8</A>), the city is sacked and left a desolation (<a onClick="return mV(\'Nah\',2,\'9-13\');">2:9-13</a>). The destruction of the bloody city is imminent (<a onClick="return mV(\'Nah\',3,\'1-3\');">3:1-3</a>); the fate is well deserved and no one will bemoan her (<a onClick="return mV(\'Nah\',3,\'4-7\');">3:4-7</a>); natural strength and resources will avail nothing (<a onClick="return mV(\'Nah\',3,\'8-11\');">3:8-11</a>); the soldiers turn cowards and the city will be utterly cut off (<a onClick="return mV(\'Nah\',3,\'12-18\');">3:12-18</a>); the whole earth will rejoice over the downfall of the cruel oppressor (<a onClick="return mV(\'Nah\',3,19);">3:19</A>).<P>2. Style:<P>Opinions concerning the religious significance of the Book of Nahum may differ, but from the stand-point of language and style all students assign to Nahum an exalted place among the prophet-poets of the ancient Hebrews; for all are impressed with the intense force and picturesqueness of his language and style. "Each prophet," says Kirkpatrick, "has his special gift for his particular work. Nahum bears the palm for poetic power. His short book is a Pindaric ode of triumph over the oppressor\'s fall." So also G.A. Smith: "His language is strong and brilliant; his rhythm rumbles and rolls, leaps and flashes, like the horsemen and chariots he describes."<P>3. Integrity:<P>Until recently no doubts were expressed concerning the integrity of the book, but within recent years scholars have, with growing unanimity, denied the originality of <a onClick="return mV(\'Nah\',1,\'2-\');">Na 1:2</A>-<a onClick="return mV(\'Nah\',2,\'1-2\');">2:2 (Hebrew 2:3)</a>, with the exception of <a onClick="return mV(\'Nah\',2,1);">2:1</A>, which is considered the beginning of Nahum\'s utterances. This change of opinion is closely bound up with the alleged discovery of distorted remnants of an old alphabetic poem in <a onClick="return mV(\'Nah\',1,1);">Nahum 1</a> (HDB, article "Nahum"; The Expositor, 1898, 207ff; ZATW, 1901, 225ff; Eiselen, Minor Prophets, 422ff). Now, it is true that in <a onClick="return mV(\'Nah\',2,\'2-7\');">1:2-7</A> traces of alphabetic arrangement may be found, but even here the artistic arrangement is not carried through consistently; in the rest of the chapter the evidence is slight.<P>The artificial character of acrostic poetry is generally supposed to point to a late date. Hence, those who believe that <a onClick="return mV(\'Nah\',1,\'1-\');">Nahum 1</a> was originally an alphabetic poem consider it an exilic or post-exilic production, which was at a still later date prefixed to the genuine prophecies of Nahum. In support of this view it is pointed out further that the prophecy in <a onClick="return mV(\'Nah\',1,\'1-\');">Nahum 1</a> is vague, while the utterances in <a onClick="return mV(\'Nah\',2,\'1-\');">Nahum 2</a> and <a onClick="return mV(\'Nah\',3,\'1-\');">3</a> are definite and to the point. Some derive support for a late date also from the language and style of the poem.<P>That difficulties exist in <a onClick="return mV(\'Nah\',1,\'1-\');">Nahum 1</a>, that in some respects it differs from <a onClick="return mV(\'Nah\',2,\'1-\');">Nahum 2</a> and <a onClick="return mV(\'Nah\',3,\'1-\');">3</A>, even the students of the English text can see; and that the Hebrew text has suffered in transmission is very probable. On the other hand, the presence of an acrostic poem in <a onClick="return mV(\'Nah\',1,\'1-\');">Nahum 1</a> is not beyond doubt. The apparent vagueness is removed, if <a onClick="return mV(\'Nah\',1,\'1-\');">Nahum 1</a> is interpreted as a general introduction to the more specific denunciation in <a onClick="return mV(\'Nah\',2,\'1-\');">Nahum 2</a> and <a onClick="return mV(\'Nah\',3,\'1-\');">3</a>. And a detailed examination shows that in this, as in other cases, the linguistic and stylistic data are indecisive. In view of these facts it may safely be asserted that no convincing argument has been presented against the genuineness of <a onClick="return mV(\'Nah\',2,\'2-\');">1:2</a>-<a onClick="return mV(\'Nah\',2,\'1-2\');">2:2</a>. "Therefore," says G.A. Smith, "while it is possible that a later poem has been prefixed to the genuine prophecies of Nahum, and the first chapter supplies many provocations to belief in such a theory, this has not been proved, and the able essays of proof have much against them. The question is open."<P>III. Teaching.<P>1. The Character of Yahweh:<P>The utterances of Nahum center around a single theme, the destruction of Nineveh. His purpose is to point out the hand of God in the impending fall of the city, and the significance of this catastrophe for the oppressed Hebrews. As a result they contain little direct religious teaching; and what there is of it is confined very largely to the opening verses of <a onClick="return mV(\'Nah\',1,\'1-\');">Nahum 1</a>. These verses emphasize the twofold manifestation of the Divine holiness, the Divine vengeance and the Divine mercy (<a onClick="return mV(\'Nah\',1,2,3);">1:2,3</a>). The manifestation of the one results in the destruction of the wicked (<a onClick="return mV(\'Nah\',1,2);">1:2</a>), the other in the salvation of the oppressed (<a onClick="return mV(\'Nah\',1,15);">1:15</A>; <a onClick="return mV(\'Nah\',2,2);">2:2</a>). Faith in Yahweh will secure the Divine favor and protection (<a onClick="return mV(\'Nah\',1,7);">1:7</a>).<P>2. Nahum\'s Glee over the Ruin of Nineveh:<P>The fierceness of Nahum, and his glee at the thought of Nineveh\'s ruin, may not be in accord with the injunction, "Love thine enemy"; but it should be borne in mind that it is not personal hatred that prompts the prophet; he is stirred by a righteous indignation over the outrages committed by Assyria. He considers the sin and overthrow of Nineveh, not merely in their bearing upon the fortunes of Judah, but in their relation to the moral government of the whole world; hence, his voice gives utterance to the outraged conscience of humanity.<P>3. Universality of Yahweh\'s Rule:<P>While Nahum\'s message, in its direct teaching, appears to be less spiritual and ethical than that of his predecessors, it sets in a clear light Yahweh\'s sway over the whole universe, and emphasizes the duty of nations as well as of individuals to own His sway and obey His will. This attitude alone will assure permanent peace and prosperity; on the other hand, disobedience to His purpose and disregard of His rule will surely bring calamity and distress. The emphasis of these ethical principles gives to the message of Nahum a unique significance for the present day and generation. "Assyria in his hands," says Kennedy, "becomes an object-lesson to the empires of the modern world, teaching, as an eternal principle of the Divine government of the world, the absolute necessity, for a nation\'s continued vitality, of that righteousness, personal, civic, and national, which alone exalteth a nation."<P>4. The Messianic Outlook:<P>In a broad sense, <a onClick="return mV(\'Nah\',1,15);">Na 1:15</a> is of Messianic import. The downfall of Nineveh and Assyria prepares the way for the permanent redemption and exaltation of Zion: "the wicked one shall no more pass through thee."<P>LITERATURE.<P>Comms. on the Minor Prophets by Ewald, Pusey, Keil, Orelli; G.A. Smith (Expositor\'s Bible); Driver (New Century); B.A. Davidson, commentary on "Nahum," "Habakkuk," "Zephaniah" (Cambridge Bible); A.F. Kirkpatrick, Doctrine of the Prophets; Eiselen, Prophecy and the Prophets; F.W. Farrar, Minor Prophets ("Men of the Bible" series); Driver, Introduction to the Lit. of the Old Testament; HDB, article "Nahum"; EB, article "Nahum."``50';
isbe[6260]='Naidus`na\'-i-dus (Codex Alexandrinus Naeidos; Codex Vaticanus Naaidos): One of those who had taken "strange wives" (1Esdras 9:31), apparently equals "Benaiah" of <a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>, of which it is probably a corruption or the latter part.``1';
isbe[6261]='Nail`nal: <p>(1) As denoting the finger-nail, the Hebrew word is tsipporen (<a onClick="return mV(\'Deu\',21,12);">De 21:12</a>), the captive woman "shall shave her head, and pare her nails." The latter was probably intended to prevent her from marring her beauty by scratching her face, an act of self-mutilation oriental women are repeatedly reported to have committed in the agony of their grief. Aramaic Tephar (<a onClick="return mV(\'Dan\',4,33);">Da 4:33</a>, "his nails like birds\' claws").<p>(2) As pin or peg (for tents, or driven into the wall) the word is yathedh (in <a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a> the Revised Version (British and American), "tent-pin"); in <a onClick="return mV(\'Isa\',22,23);">Isa 22:23</a>, "a nail in a sure place" is a peg firmly driven into the wall on which something is to be hung (<a onClick="return mV(\'Isa\',22,24);">22:24</A>); compare <a onClick="return mV(\'Ecc\',12,11);">Ec 12:11</a>, where the word is masmeroth, cognate with macmer below.<p>(3) For nails of iron (<a onClick="return mV(\'1Ch\',22,3);">1Ch 22:3</a>) and gold (<a onClick="return mV(\'2Ch\',3,9);">2Ch 3:9</a>), and in <a onClick="return mV(\'Isa\',41,7);">Isa 41:7</a> and <a onClick="return mV(\'Jer\',10,4);">Jer 10:4</a>, the word is macmer.<p>(4) In the New Testament the word is helos, used of the nails in Christ\'s hands (<a onClick="return mV(\'Jhn\',20,25);">Joh 20:25</a>), and "to nail" in <a onClick="return mV(\'Col\',2,14);">Col 2:14</a> ("nailing it to the cross") is proseloo.<P>In a figurative sense the word is used of the hard point of a stylus or engraving tool: "The sin of Judah is written with a pen of iron, and with the point (literally, "claw," "nail") of a diamond: it is graven upon the tablet of their heart, and upon the horns of your altars" (<a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>).``132';
isbe[6262]='Nain`na\'-in (Navi): This town is mentioned in Scripture only in connection with the visit of Jesus and the miracle of raising the widow\'s son from the dead (<a onClick="return mV(\'Luk\',7,11);">Lu 7:11</a>). The name persists to this day, and in the form of Nein clings to a small village on the northwestern slope of Jebel ed-Duchy ("Hill of Moreh"), the mountain which, since the Middle Ages, has been known as Little Hermon. The modern name of the mountain is derived from Neby Duchy whose wely crowns the height above the village. There are many ancient remains, proving that the place was once of considerable size. It was never enclosed by a wall, as some have thought from the mention of "the gate." This was probably the opening between the houses by which the road entered the town. Tristram thought he had found traces of an ancient city wall, but this proved to be incorrect. The ancient town perhaps stood somewhat higher on the hill than the present village. In the rocks to the east are many tombs of antiquity. The site commands a beautiful and extensive view across the plain to Carmel, over the Nazareth hills, and away past Tabor to where the white peak of Hermon glistens in the sun. To the south are the heights of Gilboa and the uplands of Samaria. The village, once prosperous, has fallen on evil days. It is said that the villagers received such good prices for simsum that they cultivated it on a large scale. A sudden drop in the price brought them to ruin, from which, after many years, they have not yet fully recovered.``54';
isbe[6263]='Naioth`na\'-yoth, ni\'-oth (nayoth; Codex Vaticanus Auath; Codex Alexandrinus Nauioth): This is the name given to a place in Ramah to which David went with Samuel when he fled and escaped from Saul (<a onClick="return mV(\'1Sa\',19,18);">1Sa 19:18</a>, etc.). The term has often been taken as meaning "houses" or "habitations"; but this cannot be justified. There is no certainty as to exactly what the word signified. Clearly, however, it attached to a particular locality in Ramah; and whatever its etymological significance, it denoted a place where the prophets dwelt together. On approaching it in pursuit of David, Saul was overcome by the Spirit of God, and conducted himself like one "possessed," giving rise to the proverb, "Is Saul also among the prophets?"``54';
isbe[6264]='Naked; Nakedness`na\'-ked, na\'-ked-nes: "Naked" in the Old Testament represents various derivatives of \'ur and \'arah chiefly, \'arom (adj.) and \'erwah (noun); in the New Testament the adjective is gumnos, the noun gumnotes, with verb gumneteuo, in <a onClick="return mV(\'1Cr\',4,11);">1Co 4:11</a>. In <a onClick="return mV(\'Exd\',32,25);">Ex 32:25</a>; <a onClick="return mV(\'2Ch\',28,19);">2Ch 28:19</a>, the King James Version adds para\', "break loose," "cast away restraint." Both the Greek and Hebrew forms mean "without clothing," but in both languages they, are used frequently in the sense of "lightly clad" or, simply, "without an outer garment." So, probably, is the meaning in <a onClick="return mV(\'Jhn\',21,7);">Joh 21:7</a>—Peter was wearing only the chiton (see <a href="./study/isbe/search.html?string=DRESS">DRESS</a>); and so perhaps in <a onClick="return mV(\'Mar\',14,51,52);">Mr 14:51,52</a> and <a onClick="return mV(\'Mic\',1,8);">Mic 1:8</a>. In <a onClick="return mV(\'Isa\',20,\'2-4\');">Isa 20:2-4</a>, however, the meaning is literally (for the "three years" of <a onClick="return mV(\'Isa\',20,3);">Isa 20:3</a> see the commentaries). So in <a onClick="return mV(\'Gen\',2,25);">Ge 2:25</a>; <a onClick="return mV(\'Gen\',3,7);">3:7</a>, where the act of sin is immediately followed by the sense of shame (see Delitzsch, Biblical Psychology, and Gunkel, at the place). A very common use of "naked" is also "without proper clothing" (<a onClick="return mV(\'Job\',22,6);">Job 22:6</a>; <a onClick="return mV(\'1Cr\',4,11);">1Co 4:11</a>, etc.), whence, of course, the expression "clothe naked." "Nakedness," in addition, is used as an euphemism in <a onClick="return mV(\'1Sa\',20,30);">1Sa 20:30</a>. A slightly different euphemistic usage is that of <a onClick="return mV(\'Lev\',18,19);">Le 18:19</a>, which in <a onClick="return mV(\'Eze\',16,36,37);">Eze 16:36,37</a> is played off against the literal sense (compare <a onClick="return mV(\'Eze\',22,10);">Eze 22:10</a>; <a onClick="return mV(\'Eze\',23,18,29);">23:18,29</a>). The point of <a onClick="return mV(\'Gen\',9,22,23);">Ge 9:22,23</a> is a little hard to grasp, but apparently there is here again an euphemism—this time for a particularly horrible act (see the commentaries and compare <a onClick="return mV(\'Hab\',2,15);">Hab 2:15</a>). Possibly some of these euphemisms are due to the Massoretes (see <a href="./study/isbe/search.html?string=TEXT+OF+THE+OLD+TESTAMENT">TEXT OF THE OLD TESTAMENT</a>). The Jews objected vigorously to exposure of the body (even athletes insisting on a loin-cloth (compare 2Macc 4:12,13)), and compulsory nudity was the extreme of shame and humiliation (<a onClick="return mV(\'Isa\',20,\'2-4\');">Isa 20:2-4</a>; <a onClick="return mV(\'Lam\',1,8);">La 1:8</a>; <a onClick="return mV(\'Hsa\',2,3);">Ho 2:3</a>; <a onClick="return mV(\'Nah\',3,5);">Na 3:5</a>, etc.). The relation of this attitude to Israel\'s high sexual morality needs no explanation.``48';
isbe[6265]='Name`nam (shem; onoma; Latin nomen (2Esdras 4:1); verbs onomazo; Latin nomino (2Esdras 5:26)): A "name" is that by which a person, place or thing is marked and known. In Scripture, names were generally descriptive of the person, of his position, of some circumstance affecting him, hope entertained concerning him, etc., so that "the name" often came to stand for the person. In <a onClick="return mV(\'Act\',1,15);">Ac 1:15</a>; <a onClick="return mV(\'Rev\',3,4);">Re 3:4</a>, onoma stands for "persons"; compare <a onClick="return mV(\'Num\',26,53,55);">Nu 26:53,55</a>.<P>I. Old Testament Word and Use.<P>1. General:<P>The word for "name" in the Old Testament is shem (also the name of one of the sons of Noah). The etymology is uncertain, although it may be from shamah (obs.), "to set a mark"; shum is the Aramaic form. For the name as descriptive of the person see <a href="./study/isbe/search.html?string=NAMES">NAMES</a>. Besides designating persons, the name also stands for fame, renown, reputation, character gained or expressed, etc. (<a onClick="return mV(\'Gen\',6,4);">Ge 6:4</a>; <a onClick="return mV(\'2Sa\',7,9,23);">2Sa 7:9,23</a>, etc.); it might be an "evil name" (<a onClick="return mV(\'Deu\',22,14,19);">De 22:14,19</a>); the "name" is also equivalent to a "people" or "nation" (which might be "blotted out," i.e. destroyed (<a onClick="return mV(\'Deu\',7,24);">De 7:24</a>, etc.)); to speak or write "in the name" signified authority (<a onClick="return mV(\'Exd\',5,23);">Ex 5:23</a>; <a onClick="return mV(\'1Ki\',21,8);">1Ki 21:8</a>, etc.); to "call one\'s name" over a place or people indicated possession or ownership (<a onClick="return mV(\'2Sa\',12,28);">2Sa 12:28</a>; <a onClick="return mV(\'Amo\',9,12);">Am 9:12</a>, etc.); to act "in the name" was to represent (<a onClick="return mV(\'Deu\',25,6);">De 25:6</a>); to be called or known "by name" indicated special individual notice (<a onClick="return mV(\'Exd\',31,2);">Ex 31:2</a>; <a onClick="return mV(\'Isa\',43,1);">Isa 43:1</a>; <a onClick="return mV(\'Isa\',45,3,4);">45:3,4</a>). <a onClick="return mV(\'Gen\',2,19,20);">Ge 2:19,20</a> even displays a conception of identity between the name and the thing.<P>"To name" is sometimes \'amar, "to say" (<a onClick="return mV(\'1Sa\',16,3);">1Sa 16:3</a>); dabhar, "to speak" (<a onClick="return mV(\'Gen\',23,16);">Ge 23:16</a>); naqabh, "to mark out" (<a onClick="return mV(\'Num\',1,17);">Nu 1:17</a>); qara\', "to call" (<a onClick="return mV(\'Gen\',48,16);">Ge 48:16</a>; <a onClick="return mV(\'Isa\',61,6);">Isa 61:6</a>).<P>2. The Divine Name:<P>Of special interest is the usage with respect to the name of God. (For the various Divine names and their significance see <a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>.) He revealed Himself to Israel through Moses by a new name (which was at the same time that of the God of their fathers)—<a href="./study/isbe/search.html?string=JEHOVAH">JEHOVAH</a> (which see) (Yahweh)—the nature of which should be shown by His manifestations on their behalf (<a onClick="return mV(\'Exd\',3,\'13-16\');">Ex 3:13-16</a>; <a onClick="return mV(\'Exd\',15,2,3);">15:2,3</a>). The "name of God was therefore not a mere word, but the whole of" the Divine manifestation, the character of God as revealed in His relations to His people and in His dealings with them (<a onClick="return mV(\'Exd\',9,16);">Ex 9:16</a>; <a onClick="return mV(\'Jos\',7,9);">Jos 7:9</a>; <a onClick="return mV(\'Jos\',9,9);">9:9</a>, etc.). The "name of Yahweh" was proclaimed to Moses on Mt. Sinai, "Yah, Yahweh, a God merciful and gracious, slow to anger, and abundant in lovingkindness and truth," etc. (<a onClick="return mV(\'Exd\',34,6);">Ex 34:6</a>); the name Yahweh (so revealed) was (<a onClick="return mV(\'Exd\',3,15);">Ex 3:15</a>) His "memorial Name" (so, often, in the American Standard Revised Version; see <a href="./study/isbe/search.html?string=MEMORIAL">MEMORIAL</a>). His sole Deity was such an important element in His name that <a onClick="return mV(\'Deu\',6,4);">De 6:4</a>f was termed the "Shema" (from shema\', "hear," the first word in <a onClick="return mV(\'Deu\',6,4);">6:4</a>), the first article of Israelite faith, taught to all the children, written on the phylacteries, and still recited as the first act in public and private worship "twice a day by every adult male Jew." Where Yahweh is said to record His name, or to put His name in a place (or person), some special Divine manifestation is implied, making the place or person sacred to Him (<a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>; <a onClick="return mV(\'1Ki\',8,16);">1Ki 8:16</a>). His "name" was in the angel of His Presence (<a onClick="return mV(\'Exd\',23,21);">Ex 23:21</a>); what He does is "for his great name\'s sake," in fidelity to and vindication of His revealed character and covenant relationship (<a onClick="return mV(\'2Ch\',6,32);">2Ch 6:32</a>; <a onClick="return mV(\'Psa\',25,11);">Ps 25:11</a>); the great things He should do would be "for a name" (<a onClick="return mV(\'Isa\',55,13);">Isa 55:13</a>); He would give His people a new name, "an everlasting name" (<a onClick="return mV(\'Isa\',56,5);">Isa 56:5</a>); to be "called by" the name of Yahweh is "to be his people" (<a onClick="return mV(\'2Ch\',7,14);">2Ch 7:14</a>; <a onClick="return mV(\'Isa\',43,7);">Isa 43:7</a>); it implies "protection," etc. (<a onClick="return mV(\'Isa\',63,19);">Isa 63:19</a>; <a onClick="return mV(\'Jer\',14,8,9);">Jer 14:8,9</a>); to "call upon" the name of Yahweh was "to worship him" as God (<a onClick="return mV(\'Gen\',21,33);">Ge 21:33</a>; <a onClick="return mV(\'Gen\',26,25);">26:25</a>, etc.); "to confess" His name, to "acknowledge him" (<a onClick="return mV(\'1Ki\',8,33,35);">1Ki 8:33,35</a>); to love, trust, act in, etc., "the name," was to love, trust, etc., Yahweh Himself (<a onClick="return mV(\'Psa\',5,11);">Ps 5:11</a>; <a onClick="return mV(\'Psa\',7,17);">7:17</a>). Very frequently, especially in the Psalms and prophecies of Isaiah and Jeremiah, "the name" of God stands for "God himself"; to "forget his name" was "to depart from him" (<a onClick="return mV(\'Jer\',23,27);">Jer 23:27</a>); "to minister, prophesy, or speak" in His name signified Divine appointment, inspiration, authority (<a onClick="return mV(\'Jer\',11,21);">Jer 11:21</a>; <a onClick="return mV(\'Jer\',14,14,15);">14:14,15</a>, etc.); we have "swearing by" or "in" the name of Yahweh (<a onClick="return mV(\'Deu\',6,13);">De 6:13</a>); to take His name "in vain" was to swear falsely (<a onClick="return mV(\'Exd\',20,7);">Ex 20:7</a>; <a onClick="return mV(\'Lev\',19,12);">Le 19:12</a>); we have "blessing" in His name (<a onClick="return mV(\'Deu\',10,8);">De 10:8</a>); "cursing" (<a onClick="return mV(\'2Ki\',2,24);">2Ki 2:24</a>). In <a onClick="return mV(\'Lev\',24,11);">Le 24:11</a>, we have the case of one who "blasphemed the Name, and cursed," the penalty for which was death by stoning (<a onClick="return mV(\'Lev\',24,\'13-16\');">24:13-16</a>). In later Jewish usage (compare The <span class="noTag">Wisdom of Solomon 14:21</span> ) the sacred name Yahweh was not pronounced in reading the Scriptures, \'Adhonay ("my Lord") being substituted for it (the vowels belonging to \'Adhonay were written with the consonants of the Divine name), hence, the frequent term "the Lord" in the King James Version, for which the American Standard Revised Version substitutes "Yahweh."<P>II. New Testament Word and Use.<P>1. Character and Work of the Person:<P>In the New Testament onoma has frequently also the significance of denoting the "character," or "work" of the person, e.g. <a onClick="return mV(\'Mat\',1,21);">Mt 1:21</a>, "Thou shalt call his name Jesus; for it is he that shall save," etc. (<a onClick="return mV(\'Luk\',1,31);">Lu 1:31</a>; <a onClick="return mV(\'Luk\',2,21);">2:21</a>; <a onClick="return mV(\'Luk\',1,63);">1:63</a>, "His name is John"; compare the new names given to Simon, James and John; Saul\'s new name of "Paul"). The "name" of God has the same relation to the character of God as in the Old Testament (<a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>; "Father, glorify thy name," <a onClick="return mV(\'Jhn\',12,28);">Joh 12:28</a>); it is manifested by Christ (<a onClick="return mV(\'Jhn\',17,26);">Joh 17:26</a>; compare <a onClick="return mV(\'Jhn\',17,3);">Joh 17:3</a>); the name of Jesus, as manifesting God, takes the place of the name of Yahweh in the Old Testament (compare <a onClick="return mV(\'Jam\',2,7);">Jas 2:7</a> with <a onClick="return mV(\'Jer\',14,9);">Jer 14:9</a>, and see below); to Him is given "the name which is above every name; that in the name of Jesus every knee should bow...and that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father," <a onClick="return mV(\'Phl\',2,9,10);">Php 2:9,10</a> (compare <a onClick="return mV(\'Isa\',45,23);">Isa 45:23</a>); "It is not the name Jesus, but the name of Jesus" (Lightfoot), i.e. the name ("Lord,") received by Jesus; we have with reference to Jesus simply "the Name" (<a onClick="return mV(\'Act\',5,41);">Ac 5:41</a>, "worthy to suffer dishonor for the Name"; <a onClick="return mV(\'Jam\',5,14);">Jas 5:14</a> (probable text, Westcott and Hort, The New Testament in Greek), "in the Name"; <a onClick="return mV(\'3Jo\',1,7);">3Joh 1:7</a>, "for the sake of the Name"); the "name of Christ" is equivalent to "Christ himself" (<a onClick="return mV(\'Mat\',10,22);">Mt 10:22</a>; <a onClick="return mV(\'Mat\',19,29);">19:29</a>); it is the same thing as "his manifestation" (<a onClick="return mV(\'Jhn\',20,31);">Joh 20:31</a>); therefore "to believe on his name" is to believe in Him as manifested in His life and work (<a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>; <a onClick="return mV(\'Jhn\',2,23);">2:23</a>); "in the name of God" means sent by God, as representing Him, with Divine authority (<a onClick="return mV(\'Mat\',21,9);">Mt 21:9</a>; <a onClick="return mV(\'Mat\',23,39);">23:39</a>); in like manner, we have "prophesying" or "preaching" in the name of Jesus (<a onClick="return mV(\'Act\',4,18);">Ac 4:18</a>; <a onClick="return mV(\'Act\',5,28);">5:28</a>). The "name of Jesus" represented His "authority" and "power," e.g. working miracles in His name (<a onClick="return mV(\'Mat\',7,22);">Mt 7:22</a>; <a onClick="return mV(\'Mar\',9,39);">Mr 9:39</a>; <a onClick="return mV(\'Act\',4,7);">Ac 4:7</a>, \'by what name (or "power") have ye done this?\'), and it is contrasted with casting out evil spirits by some other name or power (<a onClick="return mV(\'Act\',16,18);">Ac 16:18</a>; <a onClick="return mV(\'Act\',19,17);">19:17</a>). The gospel, of salvation was to be preached "in his name," by His authority and as making it effectual (<a onClick="return mV(\'Luk\',24,47);">Lu 24:47</a>); sinners were justified "through his name" (<a onClick="return mV(\'Act\',10,43);">Ac 10:43</a>; <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a>); sins were forgiven "for his name\'s sake" (<a onClick="return mV(\'1Jo\',2,12);">1Joh 2:12</a>); men "called upon the name" of Jesus, as they had done on that of Yahweh (<a onClick="return mV(\'Act\',9,14,21);">Ac 9:14,21</a> (compare <a onClick="return mV(\'Act\',7,59);">Ac 7:59</a>); <a onClick="return mV(\'Rom\',10,13);">Ro 10:13,14</a>).<P>"To name the name" of Christ was to belong to Him (<a onClick="return mV(\'2Ti\',2,19);">2Ti 2:19</a>); the calling of His name on the Gentiles signified their acceptance as God\'s people (<a onClick="return mV(\'Act\',15,17);">Ac 15:17</a> (quoted from <a onClick="return mV(\'Amo\',9,12);">Am 9:12</a>); compare <a onClick="return mV(\'Rom\',1,5);">Ro 1:5</a>); to "hold fast his name" is to be true to Him as made known (<a onClick="return mV(\'Rev\',2,13);">Re 2:13</a>; <a onClick="return mV(\'Rev\',3,8);">3:8</a>); to be "gathered together in his name," to "do all”things in his name," is as "acknowledging him" (<a onClick="return mV(\'Mat\',18,20);">Mt 18:20</a>; <a onClick="return mV(\'Col\',3,17);">Col 3:17</a>); "to baptize in" or "into the name" of Jesus Christ (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Act\',22,16);">22:16</a>, "calling on his name," contrasted with baptizing into one\'s own name in <a onClick="return mV(\'1Cr\',13,\'1-\');">1Co 13</a>, eis) is "to call over them his name" (in the rite), as claiming them for Christ and as their acknowledgment of Him or of faith in Him—becoming His disciples; similarly, to baptize "into (eis) the name of the Father, and of the Son, and of the Holy Spirit," represents "dedication to" God as He has been revealed in Christ.<P>"In the name of" means "as representing" (or as being), e.g. "in the name of a prophet," of "a righteous man," or of "a disciple" (<a onClick="return mV(\'Mat\',10,41,42);">Mt 10:41,42</a>); to receive a little child "in Christ\'s name," i.e. as belonging to Him, is to receive Himself (<a onClick="return mV(\'Mat\',18,5);">Mt 18:5</a>; <a onClick="return mV(\'Mar\',9,37);">Mr 9:37</a>; <a onClick="return mV(\'Mar\',9,41);">9:41</a> to disciples, the Revised Version (British and American) "because ye are Christ\'s," margin "Greek: in name that ye are (Christ\'s)"; <a onClick="return mV(\'Luk\',9,48);">Lu 9:48</a>; compare <a onClick="return mV(\'Mat\',18,20);">Mt 18:20</a>; <a onClick="return mV(\'Mar\',13,6);">Mr 13:6</a>, "Many shall come in my name"; <a onClick="return mV(\'Luk\',21,8);">Lu 21:8</a>).<P>2. In Relation to Prayer:<P>The significance of the name of Jesus in relation to prayer deserves special notice. To pray in the name of Jesus, to ask anything in His name, according to His promises, "Whatsoever ye shall ask in my name, that will I do" (<a onClick="return mV(\'Jhn\',14,13);">Joh 14:13</a>; compare <a onClick="return mV(\'Jhn\',14,14);">Joh 14:14</a>; <a onClick="return mV(\'Jhn\',15,16);">15:16</a>; <a onClick="return mV(\'Jhn\',16,23);">16:23</a>); "Hitherto have ye asked nothing in my name: ask...that your joy may be made full" (<a onClick="return mV(\'Jhn\',16,24);">Joh 16:24</a>), is not merely to add to our prayers (as is so often unthinkingly done): "we ask all in the name of Jesus," or "through Jesus Christ our Lord," etc., but to pray or ask as His representatives on earth, in His mission and stead, in His spirit and with His aim; it implies union with Christ and abiding in Him, He in us and we in Him. The meaning of the phrase is, "as being one with me even as I am revealed to you." Its two correlatives are "in me" (<a onClick="return mV(\'Jhn\',6,56);">Joh 6:56</a>; <a onClick="return mV(\'Jhn\',14,20);">14:20</a>; <a onClick="return mV(\'Jhn\',15,4);">15:4</a>ff; <a onClick="return mV(\'Jhn\',16,33);">16:33</a>; compare <a onClick="return mV(\'1Jo\',5,20);">1Joh 5:20</a>), and the Pauline "in Christ" (Westcott, The Gospel according to John).``185';
isbe[6266]='Names of God``<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>`1';
isbe[6267]='Names, Proper`<b>I. THE FORM OF HEBREW NAMES</b><P class="in15">1. Various Types<P class="in15">2. Vocalization<P class="in15">3. Transposition of Parts<P class="in15">4. Methods of Abbreviation<P><b>II. THE RANGE OF PROPER NAMES</b><P class="in15">1. Personal Names<P class="in30">(1) Not Exclusively Descriptive<P class="in30">(2) Drawn from a Wide Field<P class="in30">(3) Influences Leading to Choice<P class="in30">(4) Popularity of Names: Hard to Determine<P class="in15">2. Geographical Names<P><b>III. CHARACTERISTICS OF BIBLICAL REFERENCES</b><P class="in15">1. Derivation of Names Manifest<P class="in15">2. The Narrator\'s Only Concern<P class="in15">3. Allusions Linked with Names<hr /><P>I. The Form of Hebrew Names.<P>1. Various Types:<P>The Hebrew proper name consists of a single word, a phrase, or a sentence.<P>(1) Where the name is a single word, other than a verb, it may be<P>(a) a common noun, concrete, as Barak, "lightning," Tola, "crimson worm," Elon, "oak," Achsah, "anklet," Deborah, "bee" or abstract, as Uzzah, "strength," Manoah, "rest," Hannah, "grace"; or either abstract or concrete, as Zebul, "habitation";<P>(b) a participle, as Saul, "asked," Zeruiah, "cleft";<P>(c) an adjective, as Ikkesh, "perverse," Maharai, "impetuous," Shimei, "famous"; or<P>(d) a word that may be either an adjective or an abstract noun according to circumstances. Such are formations after the norm of qattul, as shammua\', which are generally adjectives; and formations by means of the ending -am or -on, as Adullam, Zalmon, Gideon, or, with the rejection of the final -n, Shilo(h) and Solomo(n).<P>(2) The name may be a phrase, consisting of<P>(a) two nouns, as Penuel, "face of God," Samuel, "name of God," Ish-bosheth, "man of shame"; or<P>(b) an adjective and a noun, as Jedidiah, "beloved of Yahweh"; or<P>(c) a preposition and one or more nouns, as Besodeiah, "in the intimacy of Yahweh" (<a onClick="return mV(\'Neh\',3,6);">Ne 3:6</a>).<P>When the name is a sentence, the predicate may be<P>(a) a noun, the copula being implied, as Abijah, "Yah is a father," Eliab, "God is a father," Elimelech, "God is king"; or<P>(b) an adjective, as Tobijah, "Yah is good" (<a onClick="return mV(\'Zec\',6,10);">Zec 6:10</a>); or<P>(c) a participle, as Obed-edom, "Edom is serving"; or<P>(d) a finite verb. This last type exhibits five or six varieties: the subject stands before a perfect, as Jonathan, "Yahweh hath given," Jehoshaphat, "Yahweh hath judged," Eleazar, "God hath helped," Elkanah, "God hath formed"; or before an imperfect, as Eliahba, "God hideth Himself"; or the subject comes after a perfect, as Benaiah, "Yahweh hath built," Shephatiah, "Yahweh hath judged," Asahel, "God hath made; or after an imperfect, as Jezreel, "God doth sow." Very often the subject is the pronoun included or implied in the verbal form, as Nathan, "he hath given," Hillel, "he hath praised," Jair, "he enlighteneth," Jephthah, "he openeth." Occasionally the predicate contains an object of the verb, as Shealtiel, "I have asked God" (<a onClick="return mV(\'Ezr\',3,2);">Ezr 3:2</a>), or a prepositional phrase, as Hephzibah, "my delight is in her" (<a onClick="return mV(\'2Ki\',21,1);">2Ki 21:1</a>). The sentence-name is usually a declaration, but it may be an exhortation or a prayer, as Jerub-baal, "let Baal strive," and Hoshea, "save!" (<a onClick="return mV(\'Num\',13,16);">Nu 13:16</a>), or it may be a question, as Micaiah, "who is like Yahweh?" All of the foregoing illustrations have been taken from the Books of Judges and Samuel, unless otherwise noted.<P>2. Vocalization:<P>The proper name is treated as one word, whether on analysis it consists of a single word, a phrase, or a sentence; and as such it is subject to the laws of accent and quantity which govern the Hebrew word.<P>(1) A common noun used as a name undergoes the variations of pronunciation due to the custom of lengthening a short vowel in pause and to the laws which control the aspiration of certain labials, linguals, and palatals. Thus, the name Perez, "breach," which appears also as Pharez in the King James Version of the Old Testament, occurs in the Hebrew text in the four forms perets, parets, pherets and pharets (<a onClick="return mV(\'Rth\',4,18);">Ru 4:18</a>; <a onClick="return mV(\'Neh\',11,4,6);">Ne 11:4,6</a>).<P>(2) In a name consisting of a phrase the normal advance of the accent as usual causes the loss of a pretonic vowel, as is indicated by the suspended letter in Jedidiah, "beloved of Yahweh"; requires a short vowel in a closed unaccented syllable, as in Mahalal\'el, "praise of God"; allows contraction, as in Beth-el, "house of God"; and occasions the return of a segholate noun to its primitive form, as in Abdiel, "servant of God," where the vowel i is an archaism which has lingered in compound names, but has generally disappeared elsewhere in speech.<P>(3) Names which consist of a sentence are also accented as one word, and the pronunciation is modified accordingly. The synonyms Eliam and Ammiel, "God is a kinsman," not only exhibit the common archaism in the retention of the vowel i, but the name Eliam also shows the characteristic lengthening of the vowel in the final accented syllable, so common in nouns. The four forms Eliphelet, Eliphalet, Elpelet and Elpalet, meaning "God is deliverance," represent the variations of the Hebrew due to the causes already mentioned (<a onClick="return mV(\'1Ch\',3,8);">1Ch 3:8</a>; <a onClick="return mV(\'1Ch\',14,5,7);">14:5,7</a>; see the King James Version and the Revised Version (British and American)). The requirements regarding the ellsion and the quantity and quality of vowels, on the shifting of the accent, are also regularly met by the various types of sentence-names in which the predicate is a verb Thus, the personal names \'elishama\' and \'elnathan (subject followed by verb in the perfect); \'elyaqim, \'elyahba\', and yehoyakhin (subject and imperfect); gedhalyah, yekholyahu, barakh\'el, in which the first vowel is protected by the implied reduplication of the Piel species, benayah, \'asah\'el, and \'asah-\'el, \'asi\'el, chazah\'el and chaza\'-el and pedhah\'el (perfect and subject); yigdalyahu, yibhneyah, ya\'asi\'el, yachdi\'el, yehallel\'el, yesimi\'el (imperfect and subject); yerubba\'al and yashobh\'am (jussive and subject; u in sharpened, and o in closed, syllable; in Jashobeam the first long vowel is retained by a secondary accent, marked by metheg); nathan and yiphtach, i.e. Jephthah. Ibneiah shows the customary apocopation of the imperfect of Lamedh-he verbs; and the names Benaiah to Pedahel show the methods of combining the perfect of such verbs with a following element. The short vowel of the final closed syllable of the imperfect is elided, if the final consonant is permitted to begin the syllable of the next element of the name, as in Jezreel, Jekabzeel, Jerahmeel, Ezekiel, Jehizkiah (see the Hebrew form of these names); but it is not elided in Ishmael, although the consonant is attached to the following syllable; and elision is avoided, as in Jiphthah-el, by keeping the ultimate and penultimate syllables distinct. Jehucal, a Hophal imperfect, is peculiar in not lengthening the vowel in the accented final syllable, when the verb is used as a personal name.<P>3. Transposition of Parts:<P>When the name was a sentence in Hebrew, its constituent parts could be transposed without changing the meaning. Thus the father of Bathsheba was called Ammiel, "a kinsman is God," and Eliam, "God is a kinsman" (<a onClick="return mV(\'2Sa\',11,3);">2Sa 11:3</a>; <a onClick="return mV(\'1Ch\',3,5);">1Ch 3:5</a>); and similarly, in letters written from Palestine to the king of Egypt in the 14th century BC, Ilimilki is also called Milkili, the name in either form signifying "God is king." Ahaziah, king of Judah, is called Jehoahaz (compare <a onClick="return mV(\'2Ch\',21,17);">2Ch 21:17</a> with <a onClick="return mV(\'2Ch\',22,1);">22:1</a>), a legitimate transposition of the verb and subject, and meaning in each case, "Yahweh hath laid hold."<P>Not only did transposition take place, but the substitution of a cognate root and even the use of a different part of the verb also occurred. Thus King Jehoiachin (<a onClick="return mV(\'2Ki\',24,6);">2Ki 24:6</a>; <a onClick="return mV(\'Jer\',52,31);">Jer 52:31</a>) was known also as Jeconiah (<a onClick="return mV(\'Jer\',24,1);">Jer 24:1</a>; <a onClick="return mV(\'Jer\',28,4);">28:4</a>) and Coniah (<a onClick="return mV(\'Jer\',22,24,28);">Jer 22:24,28</a>; <a onClick="return mV(\'Jer\',37,1);">37:1</a>). The two names Jehoiachin and Jeconiah have exactly the same meaning, "Yahweh doth establish"; and Coniah is a synonym, "the establishing of Yahweh." The Divine name which begins Jehoiachin is transferred to the end in Jeconiah and Coniah; and the Hiphil imperfect of the verb kun, which is seen in Jehoiachin, has been replaced by the Qal imperfect of the verb kanan in Jeconiah, and by the construct infinitive of the same species in Coniah. Parallel cases occur in Assyrian and Babylonian literature, among which the two forms of the king\'s name, Zamama-shum-iddina and Zamama-nadin-shum, exhibit both the transposition of constituent parts and an interchange of preterite and participle.<P>4. Methods of Abbreviation:<P>Twin forms like Abiner and Abner, Abishalom and Absalom, Elizaphan and Elzaphan, are not the full name and its abbreviation by syncopation, but are merely two variant, equally legitimate, modes of combining the constituent parts. The common methods of shortening were:<P>(1) contraction by the rejection of a weak consonant or the apocopation of a final unaccented vowel, notably illustrated by the divine name (c)yeho- at the beginning and -yahu at the end of proper names: hence, Jehoash became Joash (<a onClick="return mV(\'2Ki\',12,1,19);">2Ki 12:1,19</a>), and Amaziahu became Amaziah (<a onClick="return mV(\'2Ki\',14,1,8);">2Ki 14:1,8 Hebrew text, and 8</a>);<P>(2) abbreviation of composite geographical names by the omission of the generic noun or its equivalent: Jerusalem, which to the Hebrews meant "foundation of peace," was shortened to Salem, "peace" (<a onClick="return mV(\'Psa\',76,2);">Ps 76:2</a>); Kiriath-baal, "city of Baal" (<a onClick="return mV(\'Jos\',15,60);">Jos 15:60</a>), to Baal or Baalah (<a onClick="return mV(\'Jos\',15,9,10);">Jos 15:9,10</a>; compare <a onClick="return mV(\'2Sa\',6,2);">2Sa 6:2</a>); Beeshterah, "house or temple of Astarte," to Ashtaroth; Beth-lebaoth, "house of lionesses," to Lebaoth; Beth-azmaveth to Azmaveth; Beth-rehob to Rehob; Beth-bamoth to Bamoth (M S, l. 27, with <a onClick="return mV(\'Num\',21,19);">Nu 21:19</a>); Beth-baal-meon to Baal-meon (<a onClick="return mV(\'Num\',32,38);">Nu 32:38</a>; <a onClick="return mV(\'Jos\',13,17);">Jos 13:17</a>); the same custom existed among the Moabites who spoke of this town indifferently as Beth-baal-meon and Baal-meon (M S, ll.9, 30);<P>(3) abbreviation by the omission of the divine name: thus the name of the idolater Micaiah, which means, "who is like Yahweh?" (<a onClick="return mV(\'Jdg\',17,1,4);">Jud 17:1,4</a> (Hebrew)), was shortened to Micah, "who is like?" (<a onClick="return mV(\'Jdg\',17,5,8);">Jud 17:5,8</a>); and similarly in the case of three other men, namely the prophet (Micaiah, <a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a> the English Revised Version, and Micah, <a onClick="return mV(\'Mic\',1,1);">Mic 1:1</a>), the Levite musician (<a onClick="return mV(\'Neh\',12,35);">Ne 12:35</a> with <a onClick="return mV(\'Neh\',11,17,22);">Ne 11:17,22</a>), and the father of Abdon (<a onClick="return mV(\'2Ki\',22,12);">2Ki 22:12</a> with <a onClick="return mV(\'2Ch\',34,20);">2Ch 34:20</a>).<P>The king of Judah, Yauhazi, as he was known to the Assyrians, i.e. Jehoahaz, "Yahweh hath laid hold," is called simply Ahaz, "he hath laid hold," in the Hebrew records. The town of Jabneel, "God doth cause to be built," was sh
