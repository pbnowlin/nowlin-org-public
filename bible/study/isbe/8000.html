isbe = [];

isbe[8001]='Shemariah`shem-a-ri\'-a, she-mar\'-ya (shemaryah and shemaryahu, "whom Jahveh guards"):<P>(1) A Benjamite warrior who joined David at Ziklag (<a onClick="return mV(\'1Ch\',12,5);">1Ch 12:5</a>, Codex Vaticanus Sammaraia; Codex Sinaiticus and Codex Alexandrinus Samaria; Lucian, Samarias).<P>(2) A son of Rehoboam (<a onClick="return mV(\'2Ch\',11,19);">2Ch 11:19</a>).<P>(3) One of the sons of Harim who had married foreign wives (<a onClick="return mV(\'Ezr\',10,32);">Ezr 10:32</a>, Codex Vaticanus Samareia, Lucian, Samarias; Codex Sinaiticus and Codex Alexandrinus Semaria).<P>(4) One of the sons of Bani who had married foreign wives (<a onClick="return mV(\'Ezr\',10,41);">Ezr 10:41</a>, Codex Alexandrinus Samareias; Codex Vaticanus Samareia; Lucian, Samarias).``197';
isbe[8002]='Shemeber`shem-e\'-ber, shem\'-e-ber (shem\'-ebher): The king of Zeboiim (<a onClick="return mV(\'Gen\',14,2);">Ge 14:2</a>).`<a href="./study/isbe/search.html?string=SHINAB">SHINAB</a>`1';
isbe[8003]='Shemed`she\'-med.`<a href="./study/isbe/search.html?string=SHEMER">SHEMER</a>`1';
isbe[8004]='Shemer`she\'-mer (shemer; Semer, Lucian, Semmer):<P>(1) The owner of the hill which Omri bought and which became the site of Samaria (<a onClick="return mV(\'1Ki\',16,24);">1Ki 16:24</a>, shomeron). Shemer may be an ancient clan name. The fact, however, that the mountain was called Shomeron when Omri bought it makes one doubt that the city of Samaria was named after Shemer; the passage is questionable. The real etymology of Samaria roots it in "watch mountain" (see Stade, Zeitschrift, 165f).<P>(2) A Merarite (<a onClick="return mV(\'1Ch\',6,46);">1Ch 6:46</a> (31), Semmer).<P>(3) An Asherite (<a onClick="return mV(\'1Ch\',7,34);">1Ch 7:34</a>, A and Lucian, Somer), called "Shomer" in <a onClick="return mV(\'1Ch\',7,32);">1Ch 7:32</a>.<P>(4) A Benjamite (<a onClick="return mV(\'1Ch\',8,12);">1Ch 8:12</a>, Codex Vaticanus Semer; Codex Alexandrinus Semmer; Lucian, Samaiel); the Revised Version (British and American) "Shemed," the King James Version "Shamed."<P>The Hebrew manuscripts differ; some read "Shemer," others "Shemedh."``197';
isbe[8005]='Shemida; Shemidah; Shemidaites`she-mi\'-da, she-mi\'-da-its (shemidha): A Gileadite clan belonging to Manasseh (<a onClick="return mV(\'Num\',26,32);">Nu 26:32</a>; <a onClick="return mV(\'Jos\',17,2);">Jos 17:2</a>, Codex Vaticanus Sumareim; Codex Alexandrinus Semirae; Lucian, Samidae; <a onClick="return mV(\'1Ch\',7,19);">1Ch 7:19</a>, the King James Version "Shemidah," after whom the Shemidaites (<a onClick="return mV(\'Num\',26,32);">Nu 26:32</a>) were called).``1';
isbe[8006]='Sheminith`shem\'-i-nith.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>; <a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[8007]='Shemiramoth`she-mir\'-a-moth, she-mi\'-ra-moth, shem-i-ra\'-moth (shemiramoth; in <a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a>, Kethibh shemiramoth; Semeiramoth): The name of a Levitical family. In <a onClick="return mV(\'1Ch\',15,18,20);">1Ch 15:18,20</a>; <a onClick="return mV(\'1Ch\',16,5);">16:5</a> Shemiramoth is listed among the names of David\'s choirs; in <a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a> the same name is given among the Levites delegated by Jehoshaphat to teach the Law in the cities of Judah. According to Schrader (KAT (2), 366) the name is to be identified with the Assyrian Sammuramat; the latter occurs as a woman\'s name on the monuments, more especially on the statues of Nebo from Nimrod. Another suggestion is that Shemiramoth was originally a place-name meaning "image of Shemiram" (= name of Ram or "the Exalted One").``197';
isbe[8008]='Shemites`shem\'-its.`<a href="./study/isbe/search.html?string=SEMITES">SEMITES</a>`1';
isbe[8009]='Shemuel`she-mu\'-el, shem\'-u-el (shemu\'el, "name of God" (?) (<a onClick="return mV(\'1Ch\',6,33);">1Ch 6:33 (Hebrew 18)</a>); the Revised Version (British and American) Samuel, the prophet (see <a href="./study/isbe/search.html?string=SAMUEL">SAMUEL</A>); compare Gray, HPN, 200, note 3):<P>(1) The Simeonite appointed to assist in the division of the land (<a onClick="return mV(\'Num\',34,20);">Nu 34:20</a>). The Massoretic Text should be emended to shelumi\'el, to correspond with the form found in <a onClick="return mV(\'Num\',1,6);">Nu 1:6</a>; <a onClick="return mV(\'Num\',2,12);">2:12</a>; <a onClick="return mV(\'Num\',7,36,41);">7:36,41</a>; <a onClick="return mV(\'Num\',10,19);">10:19</a>. Septuagint has uniformly Salamiel.<P>(2) Grandson of Issachar (<a onClick="return mV(\'1Ch\',7,2);">1Ch 7:2</a>) (Codex Vaticanus Isamouel; Codex Alexandrinus and Lucian, Samouel).``1';
isbe[8010]='Shen`shen (ha-shen, "the tooth" or "peak"; tes palaias): A place named only in <a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a> to indicate the position of the stone set up by Samuel in connection with the victory over the Philistines, "between Mizpah and Shen." The Septuagint evidently reads yashan, "old." Probably we should here read yeshanah, as in <a onClick="return mV(\'2Ch\',13,19);">2Ch 13:19</a> (OHL, under the word). Then it may be represented by \'Ain Sinia, to the north of Beitin.``1';
isbe[8011]='Shenazar`she-na\'-zar: the King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=SHENAZZAR">SHENAZZAR</A> (which see).``1';
isbe[8012]='Shenazzar`she-naz\'-ar (shen\'atstsar): A son of Jeconiah (Jehoiachin) and uncle of Zerubbabel (<a onClick="return mV(\'1Ch\',3,18);">1Ch 3:18</a>, Codex Vaticanus and Codex Alexandrinus Sanesar; Lucian, Sanasar; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Sennaser, Senneser). It is highly probable that Sheshbazzar (<a onClick="return mV(\'Ezr\',1,8,11);">Ezr 1:8,11</a>), "the prince of Judah," and Shenazzar are identical (so Meyer, Rothstein, etc.). The name is difficult; some suggest a corruption of shushbalatstsar, and as equivalent to Sin-usur, "Sin (the moon-god) protect."``1';
isbe[8013]='Shenir`she\'-ner (senir, shenir): Only found in <a onClick="return mV(\'Sgs\',4,8);">So 4:8</a> (Massoretic Text).`<a href="./study/isbe/search.html?string=SENIR">SENIR</a>`1';
isbe[8014]='Sheol`she\'-ol (she\'ol):<P>1. The Name<P>2. The Abode of the Dead<P class="in15">(1) Not a State of Unconsciousness<P class="in15">(2) Not Removed from God\'s Jurisdiction<P class="in15">(3) Relation to Immortality<P>3. Post-canonical Period<hr /><P>1. The Name:<P>This word is often translated in the King James Version "grave" (e.g. <a onClick="return mV(\'Gen\',37,35);">Ge 37:35</a>; <a onClick="return mV(\'1Sa\',2,6);">1Sa 2:6</a>; <a onClick="return mV(\'Job\',7,9);">Job 7:9</a>; <a onClick="return mV(\'Job\',14,13);">14:13</a>; <a onClick="return mV(\'Psa\',6,5);">Ps 6:5</a>; <a onClick="return mV(\'Psa\',49,14);">49:14</a>; <a onClick="return mV(\'Isa\',14,11);">Isa 14:11</a>, etc.) or "hell" (e.g. <a onClick="return mV(\'Deu\',32,22);">De 32:22</a>; <a onClick="return mV(\'Psa\',9,17);">Ps 9:17</a>; <a onClick="return mV(\'Psa\',18,5);">18:5</a>; <a onClick="return mV(\'Isa\',14,9);">Isa 14:9</a>; <a onClick="return mV(\'Amo\',9,2);">Am 9:2</a>, etc.); in 3 places by "pit" (<a onClick="return mV(\'Num\',16,30,33);">Nu 16:30,33</a>; <a onClick="return mV(\'Job\',17,16);">Job 17:16</a>). It means really the unseen world, the state or abode of the dead, and is the equivalent of the Greek Haides, by which word it is translated in Septuagint. The English Revisers have acted somewhat inconsistently in leaving "grave" or "pit" in the historical books and putting "Sheol" in the margin, while substituting "Sheol" in the poetical writings, and putting "grave" in the margin ("hell" is retained in <a onClick="return mV(\'Isa\',14,\'1-\');">Isa 14</a>). Compare their "Preface." The American Revisers more properly use "Sheol" throughout. The etymology of the word is uncertain. A favorite derivation is from sha\'al, "to ask" (compare <a onClick="return mV(\'Pro\',1,12);">Pr 1:12</a>; <a onClick="return mV(\'Pro\',27,20);">27:20</a>; <a onClick="return mV(\'Pro\',30,15,16);">30:15,16</a>; <a onClick="return mV(\'Isa\',5,14);">Isa 5:14</a>; <a onClick="return mV(\'Hab\',2,5);">Hab 2:5</a>); others prefer the sha\'al, "to be hollow." The Babylonians are said to have a similar word Sualu, though this is questioned by some.<P>2. The Abode of the Dead:<P>Into Sheol, when life is ended, the dead are gathered in their tribes and families. Hence, the expression frequently occurring in the Pentateuch, "to be gathered to one\'s people," "to go to one\'s fathers," etc. (<a onClick="return mV(\'Gen\',15,15);">Ge 15:15</a>; <a onClick="return mV(\'Gen\',25,8,17);">25:8,17</a>; <a onClick="return mV(\'Gen\',49,33);">49:33</a>; <a onClick="return mV(\'Num\',20,24,28);">Nu 20:24,28</a>; <a onClick="return mV(\'Num\',31,2);">31:2</a>; <a onClick="return mV(\'Deu\',32,50);">De 32:50</a>; <a onClick="return mV(\'Deu\',34,5);">34:5</a>). It is figured as an under-world (<a onClick="return mV(\'Isa\',44,23);">Isa 44:23</a>; <a onClick="return mV(\'Eze\',26,20);">Eze 26:20</a>, etc.), and is described by other terms, as "the pit" (<a onClick="return mV(\'Job\',33,24);">Job 33:24</a>; <a onClick="return mV(\'Psa\',28,1);">Ps 28:1</a>; <a onClick="return mV(\'Psa\',30,3);">30:3</a>; <a onClick="return mV(\'Pro\',1,12);">Pr 1:12</a>; <a onClick="return mV(\'Isa\',38,18);">Isa 38:18</a>, etc.), <a href="./study/isbe/search.html?string=ABADDON">ABADDON</A> (which see) or Destruction (<a onClick="return mV(\'Job\',26,6);">Job 26:6</a>; <a onClick="return mV(\'Job\',28,22);">28:22</a>; <a onClick="return mV(\'Pro\',15,11);">Pr 15:11</a>), the place of "silence" (<a onClick="return mV(\'Psa\',94,17);">Ps 94:17</a>; <a onClick="return mV(\'Psa\',115,17);">115:17</a>), "the land of darkness and the shadow of death" (<a onClick="return mV(\'Job\',10,21);">Job 10:21</a>f). It is, as the antithesis of the living condition, the synonym for everything that is gloomy, inert, insubstantial (the abode of Rephaim, "shades," <a onClick="return mV(\'Job\',26,5);">Job 26:5</a>; <a onClick="return mV(\'Pro\',2,18);">Pr 2:18</a>; <a onClick="return mV(\'Pro\',21,16);">21:16</a>; <a onClick="return mV(\'Isa\',14,9);">Isa 14:9</a>; <a onClick="return mV(\'Isa\',26,14);">26:14</a>). It is a "land of forgetfulness," where God\'s "wonders" are unknown (<a onClick="return mV(\'Psa\',88,\'10-12\');">Ps 88:10-12</a>). There is no remembrance or praise of God (<a onClick="return mV(\'Psa\',6,5);">Ps 6:5</a>; <a onClick="return mV(\'Psa\',88,12);">88:12</a>; <a onClick="return mV(\'Psa\',115,17);">115:17</a>, etc.). In its darkness, stillness, powerlessness, lack of knowledge and inactivity, it is a true abode of death (see <a href="./study/isbe/search.html?string=DEATH">DEATH</a>); hence, is regarded by the living with shrinking, horror and dismay (<a onClick="return mV(\'Psa\',39,13);">Ps 39:13</a>; <a onClick="return mV(\'Isa\',38,\'17-19\');">Isa 38:17-19</a>), though to the weary and troubled it may present the aspect of a welcome rest or sleep (<a onClick="return mV(\'Job\',3,\'17-22\');">Job 3:17-22</a>; <a onClick="return mV(\'Job\',14,12);">14:12</a>f). The Greek idea of Hades was not dissimilar.<P>(1) Not a State of Unconsciousness.<P>Yet it would be a mistake to infer, because of these strong and sometimes poetically heightened contrasts to the world of the living, that Sheol was conceived of as absolutely a place without consciousness, or some dim remembrance of the world above. This is not the case. Necromancy rested on the idea that there was some communication between the world above and the world below (<a onClick="return mV(\'Deu\',18,11);">De 18:11</a>); a Samuel could be summoned from the dead (<a onClick="return mV(\'1Sa\',28,\'11-15\');">1Sa 28:11-15</a>); Sheol from beneath was stirred at the descent of the king of Babylon (<a onClick="return mV(\'Isa\',14,9);">Isa 14:9</a>). The state is rather that of slumbrous semi-consciousness and enfeebled existence from which in a partial way the spirit might temporarily be aroused. Such conceptions, it need hardly be said, did not rest on revelation, but were rather the natural ideas formed of the future state, in contrast with life in the body, in the absence of revelation.<P>(2) Not Removed from God\'s Jurisdiction.<P>It would be yet more erroneous to speak with Dr. Charles (Eschatology, 35ff) of Sheol as a region "quite independent of Yahwe, and outside the sphere of His rule." "Sheol is naked before God," says Job, "and Abaddon hath no covering" (<a onClick="return mV(\'Job\',26,6);">Job 26:6</a>). "If I make my bed in Sheol," says the Psalmist, "behold thou art there" (<a onClick="return mV(\'Psa\',139,8);">Ps 139:8</a>). The wrath of Yahweh burns unto the lowest Sheol (<a onClick="return mV(\'Deu\',32,22);">De 32:22</a>). As a rule there is little sense of moral distinctions in the Old Testament representations of Sheol, yet possibly these are not altogether wanting (on the above and others points in theology of Sheol).<P>See <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</A>.<P>(3) Relation to Immortality.<P>To apprehend fully the Old Testament conception of Sheol one must view it in its relation to the idea of death as something unnatural and abnormal for man; a result of sin. The believer\'s hope for the future, so far as this had place, was not prolonged existence in Sheol, but deliverance from it and restoration to new life in God\'s presence (<a onClick="return mV(\'Job\',14,\'13-15\');">Job 14:13-15</a>; <a onClick="return mV(\'Job\',19,\'25-27\');">19:25-27</a>; <a onClick="return mV(\'Psa\',16,10,11);">Ps 16:10,11</a>; <a onClick="return mV(\'Psa\',17,15);">17:15</a>; <a onClick="return mV(\'Psa\',49,15);">49:15</a>; <a onClick="return mV(\'Psa\',73,\'24-26\');">73:24-26</a>; see <a href="./study/isbe/search.html?string=IMMORTALITY">IMMORTALITY</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</A>; <a href="./study/isbe/search.html?string=RESURRECTION">RESURRECTION</A>). Dr. Charles probably goes too far in thinking of Sheol in <a onClick="return mV(\'Psa\',49,\'1-\');">Psalms 49</a> and <a onClick="return mV(\'Psa\',73,\'1-\');">73</a> as "the future abode of the wicked only; heaven as that of the righteous" (op. cit., 74); but different destinies are clearly indicated.<P>3. Post-canonical Period:<P>There is no doubt, at all events, that in the postcanonical Jewish literature (the Apocrypha and apocalyptic writings) a very considerable development is manifest in the idea of Sheol. Distinction between good and bad in Israel is emphasized; Sheol becomes for certain classes an intermediate state between death and resurrection; for the wicked and for Gentiles it is nearly a synonym for Gehenna (hell).`<a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=DEATH">DEATH</a>; <a href="./study/isbe/search.html?string=HADES">HADES</a>; <a href="./study/isbe/search.html?string=HELL">HELL</a>`132';
isbe[8015]='Shepham`she\'-fam (shepham; Sepphamar): A place, probably a hill town, on the ideal eastern boundary of Israel, named in <a onClick="return mV(\'Num\',34,10);">Nu 34:10</a>, but omitted in <a onClick="return mV(\'Eze\',47,\'15-18\');">Eze 47:15-18</a>. It lay between Hazar-enan and Harbel (Massoretic Text: "Hariblah"), which must have been in the neighborhood of Hermon. The word means a "naked" place, and doubtless indicates one of the barer midway ridges of Anti-Lebanon. It was probably the native place of Zabdi the Shiphmite, who was David\'s chief vine-gardener (<a onClick="return mV(\'1Ch\',27,27);">1Ch 27:27</a>).``1';
isbe[8016]='Shephatiah`shef-a-ti\'-a, she-fat\'-ya (shephatyah, "Yah has judged"):<P>(1) A son of David, by Abital (<a onClick="return mV(\'2Sa\',3,4);">2Sa 3:4</a>; <a onClick="return mV(\'1Ch\',3,3);">1Ch 3:3</a>).<P>(2) A Benjamite, father of Meshullam, of Jerusalem (<a onClick="return mV(\'1Ch\',9,8);">1Ch 9:8</a>).<P>(3) A Benjamite, who joined David at Ziklag (<a onClick="return mV(\'1Ch\',12,5);">1Ch 12:5</a>).<P>(4) A prince of the Simeonites in the time of David (<a onClick="return mV(\'1Ch\',27,16);">1Ch 27:16</a>).<P>(5) A son of King Jehoshaphat (<a onClick="return mV(\'2Ch\',21,2);">2Ch 21:2</a>).<P>(6) A family, 372 of whom returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,4);">Ezr 2:4</a>; <a onClick="return mV(\'Neh\',7,9);">Ne 7:9</a>); 80 more males of this family, with their head, returned with Ezra (<a onClick="return mV(\'Ezr\',8,8);">Ezr 8:8</a>).<P>(7) A servant of Solomon, 392 of whose descendants returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>f; <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>f); "Saphat" in 1Esdras 5:9 and "Saphatias" in 1Esdras 8:34.<P>(8) A Perezzite (Judahite), some of whose descendants dwelt at Jerusalem in the time of Nehemiah (<a onClick="return mV(\'Neh\',11,4);">Ne 11:4</a>).<P>(9) A son of Mattan, a contemporary of Jeremiah (<a onClick="return mV(\'Jer\',38,1);">Jer 38:1</a>).``132';
isbe[8017]='Shephelah`shef-e\'-la (ha-shephelah; sephela, saphela):<P>1. Name and References:<P>The word denotes "lowland," and is variously rendered in the King James Version. It is "vale" in <a onClick="return mV(\'Deu\',1,7);">De 1:7</a>; <a onClick="return mV(\'Jos\',10,40);">Jos 10:40</a>; <a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>; <a onClick="return mV(\'2Ch\',1,15);">2Ch 1:15</a>; <a onClick="return mV(\'Jer\',33,13);">Jer 33:13</a>; "valley" in <a onClick="return mV(\'Jos\',9,1);">Jos 9:1</a>; <a onClick="return mV(\'Jos\',11,2,16);">11:2,16</a>; <a onClick="return mV(\'Jos\',12,8);">12:8</a>; <a onClick="return mV(\'Jos\',15,33);">15:33</a>; <a onClick="return mV(\'Jdg\',1,9);">Jud 1:9</a>; <a onClick="return mV(\'Jer\',32,44);">Jer 32:44</a>; "low plain" in <a onClick="return mV(\'1Ch\',27,28);">1Ch 27:28</a>; <a onClick="return mV(\'2Ch\',9,27);">2Ch 9:27</a>; "plain" in <a onClick="return mV(\'Jer\',17,26);">Jer 17:26</a>; <a onClick="return mV(\'Oba\',1,19);">Ob 1:19</a>; <a onClick="return mV(\'Zec\',7,7);">Zec 7:7</a>; and "low country" in <a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a>. the Revised Version (British and American) renders uniformly "lowland." As the word always occurs with the definite article, indicating a distinct district, it might have been well to retain it without translation. The boundaries of the district are clearly marked and include much broken country; the hills being low compared with the mountains to the east, but much higher than the plain that runs to the shore. If a translation was to be made, perhaps "lowlands" would have been the best, as applied to the "Lowlands" of Scotland, "which likewise are not entirely plain, but have their groups and ranges of hills" (HGHL, 203). In the wide sense the Shephelah included the territory originally given to the tribe of Dan, and also a considerable part of Western and Southwestern Judea. At an early day the tribes of Dan and Simeon were practically absorbed by Judah, and hence, we find in <a onClick="return mV(\'Jos\',15,\'1-\');">Jos 15</a> many cities in the Shephelah which belonged to that tribe (LB, I, 211).<P>2. Districts and Features:<P>(1) The sites of many ancient cities named in the Shephelah have been identified. They all lie within the strip of hill country that runs along the western base of the mountains of Judah, terminating in the north at the Valley of Aijalon. Once indeed the name appears to apply to the low hills north of this (<a onClick="return mV(\'Jos\',11,16);">Jos 11:16</a>, \'the mount of Israel and its Shephelah\'). Every other reference applies only to the South.<P>Principal G. A. Smith has pointed out the difference between the district to the north and that to the south of Aijalon (HGHL, 203ff). "North of Ajalon the low hills which run out on Sharon are connected with the high mountains behind them. You ascend to the latter from Sharon either by long sloping ridges, such as that which today carries the telegraph wire and the high road from Jaffa to Nablus; or else you climb up terraces, such as the succession of ranges closely built upon one another by which the country rises from Lydda to Bethel. That is, the low hills west of Samaria are (to use the Hebrew phrase) \'ashedhoth, or slopes of the central range, and not a separate group. But South of Ajalon the low hills do not so hang upon the Central Range, but are separated from the mountains of Judah by a series of valleys, both wide and narrow, which run all the way from Ajalon to near Beersheba; and it is only when the low hills are thus flung off the Central Range into an independent group, separating Judea from Philistia, that the name Shephelah seems to be applied to them."<P>(2) On the east of the Shephelah, then, taking the name in this more limited sense, rises the steep wall of the mountain, into which access is gained only by narrow and difficult defiles. The hills of the Shephelah are from 500 to 800 ft. high, with nothing over 1,500. The formation is soft limestone. In the valleys and upland plains there is much excellent land which supports a fairly good population still. Wheat, barley and olives are the chief products. But ancient wine presses cut in the rocks testify to the culture of the vine in old times. The district is almost entirely dependent on the rain for its water-supply. This is collected in great cisterns, partly natural. The rocks are in many places honeycombed with caves.<P>The western boundary is not so definite as that on the east. Some have held that it included the Philistine plain. This contention draws support from the mention of the Philistine cities immediately after those of Judah, which are said to be in the Shephelah (<a onClick="return mV(\'Jos\',15,45);">Jos 15:45</a>; these verses can hardly be ruled out as of a later date). On the other hand the Philistines are said to have invaded the cities of the Shephelah (<a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a>), which implies that it was outside their country. In later times the Talmud (Jerusalem, Shebhi\'ith 9 2) distinguishes the Mountain, the Shephelah, and the Plain. See, however, discussion in Buhl (GAP, 104, n.; and G. A. Smith, The Expositor, 1896, 404ff).<P>3. The Five Valleys:<P>The Shephelah is crossed by five wide valleys which furnish easy access from the plain. These are of importance chiefly because from each of them a way, crossing the "foss," enters one of the defiles by which alone armies could approach the uplands of Judea. The hills of Judea are much steeper on the east than on the west, where they fall toward Philistia in long-rolling hills, forming the Shephelah.<P>(1) Vale of Aijalon:<P>The most noteworthy of these is the Vale of Aijalon. It winds its way first in a northeasterly direction, past the Beth-horons, then, turning to the Southeast, it reaches the plateau at el-Jib, the ancient Gibeon, fully 5 miles northwest of Jerusalem. This is the easiest of all the avenues leading from the plain to the heights, and it is the one along which the tides of battle most frequently rolled from the days of Joshua (<a onClick="return mV(\'Jos\',10,12);">Jos 10:12</a>) to those of the Maccabees (1Macc 3:16ff, etc.). It occupies also a prominent place in the records of the Crusades.<P>(2) Wady ec-Surar:<P>Wady ec-Surar, the Valley of Sorek, crosses the Shephelah South of Gezer, and pursues a tortuous course past Beth-shemesh and Kiriath-jearim to the plateau Southwest of Jerusalem. This is the line followed by the Jaffa-Jerus Railway.<P>(3) Wady ec-Sunt:<P>Wady ec-Sunt runs eastward from the north of Tell ec-Safieh (Gath) up the Vale of Elah to its confluence with Wady ec-Sur which comes in from the South near Khirbet Shuweikeh (Socoh); and from that point, as Wady el-Jindy, pursues its way South of Timnah to the uplands west of Bethlehem.<P>(4) Wady el-\'Afranj:<P>Wady el-\'Afranj crosses the plain from Ashdod (Esdud), passes Beit Jibrin (Eleutheropolis), and winds up through the mountains toward Hebron.<P>(5) Wady el-Chesy:<P>Wady el-Chesy, from the sea about 7 miles north of Gaza, runs eastward with many windings, passes to the north of Lachish, and finds its way to the plateau some 6 miles Southwest of Hebron.<P>From the Shephelah thus opened the gateways by which Judea and Jerusalem might be assailed: and the course of these avenues determined the course of much of the history. It is evident that the shephelah lay open to attack from both sides, and for centuries it was the debatable land between Israel and the Philistines. The ark for a time sojourned in this region (<a onClick="return mV(\'1Sa\',5,6);">1Sa 5:6</a>f). In this district is laid the scene of Samson\'s exploits (<a onClick="return mV(\'Jdg\',14,\'1-\');">Jud 14-16</a>). The scene of David\'s memorable victory over the giant was in the Wady ec-Sunt, between Socoh and Azekah (<a onClick="return mV(\'1Sa\',17,1);">1Sa 17:1</a>). David found refuge here in the cave of Adullam (<a onClick="return mV(\'1Sa\',22,1);">1Sa 22:1</a>). For picturesque and vivid accounts of the Shephelah and of the part it played in history see Smith, HGHL, 201ff; A. Henderson, Palestine, Its Historical Geography, 1894.``54';
isbe[8018]='Shepher`she\'-fer (shepher, "beauty"): A mount near which the Israelites encamped (<a onClick="return mV(\'Num\',33,23);">Nu 33:23</a>f).`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[8019]='Shepherd`shep\'-erd (ro\'eh, ro\'i; poimen, "a feeder"): The sheep owner frequently tends the flocks himself (<a onClick="return mV(\'Gen\',4,4);">Ge 4:4</a>; <a onClick="return mV(\'Gen\',30,40);">30:40</a>; compare <a onClick="return mV(\'Eze\',34,12);">Eze 34:12</a>), but more often he delegates the work to his children (<a onClick="return mV(\'Gen\',29,9);">Ge 29:9</a>; <a onClick="return mV(\'1Sa\',16,19);">1Sa 16:19</a>; <a onClick="return mV(\'1Sa\',17,15);">17:15</a>) or relatives (<a onClick="return mV(\'Gen\',31,6);">Ge 31:6</a>). In such cases the sheep have good care because the keepers have a personal interest in the well-being of the animals, but when they are attended by a hireling (<a onClick="return mV(\'1Sa\',17,20);">1Sa 17:20</a>) the flocks may be neglected or abused (<a onClick="return mV(\'Isa\',56,10,11);">Isa 56:10,11</a>; <a onClick="return mV(\'Eze\',34,8,10);">Eze 34:8,10</a>; <a onClick="return mV(\'Zec\',11,15,17);">Zec 11:15,17</a>; <a onClick="return mV(\'Jhn\',10,12);">Joh 10:12</a>). The chief care of the shepherd is to see that the sheep find plenty to eat and drink. The flocks are not fed in pens or folds, but, summer and winter, must depend upon foraging for their sustenance (<a onClick="return mV(\'Psa\',23,2);">Ps 23:2</a>). In the winter of 1910-11 an unprecedented storm ravaged Northern Syria. It was accompanied by a snowfall of more than 3 ft., which covered the ground for weeks. During that time, hundreds of thousands of sheep and goats perished, not so much from the cold as from the fact that they could get no food. Goats hunt out the best feeding-grounds, but sheep are more helpless and have to be led to their food (compare <a onClick="return mV(\'Num\',27,16,17);">Nu 27:16,17</a>); nor do they possess the instinct of many other animals for finding their way home (compare <a onClick="return mV(\'Eze\',34,\'6-8\');">Eze 34:6-8</a>). Flocks should be watered at least once a day. Where there are springs or streams this is an easy matter. Frequently the nearest water is hours away. One needs to travel in the dry places in Syria or Palestine, and then enter the watered valleys like those in Edom where the flocks are constantly being led for water, to appreciate the Psalmist\'s words, "He leadcth me beside still waters." Sometimes water can be obtained by digging shallow wells (<a onClick="return mV(\'Gen\',26,\'18-22\',25,32);">Ge 26:18-22,25,32</a>). The shepherd frequently carries with him a pail from which the sheep can drink when the water is not accessible to them. On the mountain tops the melting snows supply the needed water. In other districts it is drawn from deep wells (<a onClick="return mV(\'Gen\',29,2);">Ge 29:2</a>; <a onClick="return mV(\'Jhn\',4,6);">Joh 4:6</a>). The usual time for watering is at noon, at which time the flocks are led to the watering-places (<a onClick="return mV(\'Gen\',29,2,3);">Ge 29:2,3</a>). After drinking, the animals lie down or huddle together in the shade of a rock while the shepherd sleeps. At the first sound of his call, which is usually a peculiar guttural sound, hard to imitate, the flock follow off to new feeding-grounds. Even should two shepherds call their flocks at the same time and the sheep be intermingled, they never mistake their own master\'s voice (<a onClick="return mV(\'Jhn\',10,\'3-5\');">Joh 10:3-5</a>).<P>The shepherd\'s equipment is a simple one. His chief garment is a cloak woven from wool or made from sheepskins. This is sleeveless, and so made that it hangs like a cloak on his shoulders. When he sleeps he curls up under it, head and all. During the summer a lighter, short-sleeved \'aba or coat is worn. He carries a staff or club (see <a href="./study/isbe/search.html?string=STAFF">STAFF</A>), and a characteristic attitude is to make a rest for his arms by placing his staff on his shoulders against the back of his neck. When an especially productive spot is found, the shepherd may pass the time, while the animals are grazing, by playing on his pipe (<a onClick="return mV(\'Jdg\',5,16);">Jud 5:16</a>). He sometimes carries a sling (qela\') of goat\'s hair (<a onClick="return mV(\'1Sa\',17,40);">1Sa 17:40</a>). His chief belongings are kept in a skin pouch or bag (keli) (<a onClick="return mV(\'1Sa\',17,40);">1Sa 17:40</a>). This bag is usually a whole tawed skin turned wrong side out, with the legs tied up and the neck forming the opening. He is usually aided in the keeping and the defending of the sheep by a dog (<a onClick="return mV(\'Job\',30,1);">Job 30:1</a>). In Syria the Kurdish dogs make the best protectors of the sheep, as, unlike the cowardly city dogs, they are fearless and will drive away the wild beasts. The shepherd is often called upon to aid the dogs in defending the sheep (<a onClick="return mV(\'Gen\',31,39);">Ge 31:39</a>; <a onClick="return mV(\'1Sa\',17,34,35);">1Sa 17:34,35</a>; <a onClick="return mV(\'Isa\',31,4);">Isa 31:4</a>; <a onClick="return mV(\'Jer\',5,6);">Jer 5:6</a>; <a onClick="return mV(\'Amo\',3,12);">Am 3:12</a>).<P>Figurative:<P>The frequent use of the word "shepherd" to indicate a spiritual overseer is familiar to Bible readers (<a onClick="return mV(\'Psa\',23,1);">Ps 23:1</a>; <a onClick="return mV(\'Psa\',80,1);">80:1</a>; <a onClick="return mV(\'Ecc\',12,11);">Ec 12:11</a>; <a onClick="return mV(\'Isa\',40,4);">Isa 40:4</a>; <a onClick="return mV(\'Isa\',63,14);">63:14</a>; <a onClick="return mV(\'Jer\',31,10);">Jer 31:10</a>; <a onClick="return mV(\'Eze\',34,23);">Eze 34:23</a>; <a onClick="return mV(\'Eze\',37,24);">37:24</a>; <a onClick="return mV(\'Jhn\',21,\'15-17\');">Joh 21:15-17</a>; <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>; <a onClick="return mV(\'1Pe\',5,\'1-4\');">1Pe 5:1-4</a>). We still use the term "pastor," literally, "a shepherd." Leaders in temporal affairs were also called shepherds (<a onClick="return mV(\'Gen\',47,17);">Ge 47:17</a> margin; <a onClick="return mV(\'Isa\',44,28);">Isa 44:28</a>; <a onClick="return mV(\'Isa\',63,11);">63:11</a>). "Sheep without a shepherd" typified individuals or nations who had forgotten Yahweh (<a onClick="return mV(\'Num\',27,17);">Nu 27:17</a>; <a onClick="return mV(\'1Ki\',22,17);">1Ki 22:17</a>; <a onClick="return mV(\'2Ch\',18,16);">2Ch 18:16</a>; <a onClick="return mV(\'Eze\',34,5,8);">Eze 34:5,8</a>; <a onClick="return mV(\'Zec\',10,2);">Zec 10:2</a>; <a onClick="return mV(\'Mat\',9,36);">Mt 9:36</a>; <a onClick="return mV(\'Mar\',6,34);">Mr 6:34</a>).<P>Jesus is spoken of as the good shepherd (<a onClick="return mV(\'Jhn\',10,14);">Joh 10:14</a>); chief shepherd (<a onClick="return mV(\'1Pe\',5,4);">1Pe 5:4</a>); great shepherd (<a onClick="return mV(\'Hbr\',13,20);">Heb 13:20</a>); the one shepherd (<a onClick="return mV(\'Jhn\',10,16);">Joh 10:16</a>). "He will feed his flock like a shepherd, he will gather the lambs in his arm, and carry them in his bosom, and will gently lead those that have their young" (<a onClick="return mV(\'Isa\',40,11);">Isa 40:11</a>) is a picture drawn from pastoral life of Yahweh\'s care over His children. A strong sympathy for helpless animals, though sometimes misdirected, is a marked characteristic of the people of Bible lands. The birth of offspring in a flock often occurs far off on the mountain side. The shepherd solicitously guards the mother during her helpless moments and picks up the lamb and carries it to the fold. For the few days, until it is able to walk, he may carry it in his arms or in the loose folds of his coat above his girdle.`<a href="./study/isbe/search.html?string=SHEEP">SHEEP</a>`133';
isbe[8020]='Shephi, Shepho`she\'-fi, she\'-fo (shephi; Codex Vaticanus Sob, Codex Alexandrinus Sophar; Lucian, Sapphei (<a onClick="return mV(\'1Ch\',1,40);">1Ch 1:40</a>); or Shepho, shepho; Codex Alexandrinus Soph; Lucian, Sophan (<a onClick="return mV(\'Gen\',36,23);">Ge 36:23</a>)): A Horite chief.``1';
isbe[8021]='Shephupham, Shephuphan`she-fu\'-fam or she-fu\'-fan (shephupham; Codex Vaticanus and Codex Alexandrinus Sophan; Lucian, Sophan (<a onClick="return mV(\'Num\',26,39);">Nu 26:39 (Hebrew 43)</a>); or Shephuphan, shephuphan; Codex Vaticanus Sopharphak, Codex Alexandrinus Sophan, Lucian, Seppham (<a onClick="return mV(\'1Ch\',8,5);">1Ch 8:5</a>), "a kind of serpent," Gray, HPN, 95): Eponym of a Benjamite family. The name occurs in <a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a> as "Muppim" and in <a onClick="return mV(\'1Ch\',7,12,15);">1Ch 7:12,15</a>; <a onClick="return mV(\'1Ch\',26,16);">26:16</a> as "Shuppim." It is almost impossible to arrive at the original form; the gentilic "Shuphamites" appears in <a onClick="return mV(\'Num\',26,39);">Nu 26:39</a> (43).``1';
isbe[8022]='Sherah`she\'-ra.`<a href="./study/isbe/search.html?string=SHEERAH">SHEERAH</a>`1';
isbe[8023]='Sherd`shurd.`<a href="./study/isbe/search.html?string=POTSHERD">POTSHERD</a>`1';
isbe[8024]='Sherebiah`sher-e-bi\'-a, she-reb\'-ya (sherebhyah, "God has sent burning heat"(?); the form is doubtful): A post-exilic priest and family. Sherebiah, who joined Ezra at the river Ahava (<a onClick="return mV(\'Ezr\',8,18);">Ezr 8:18</a>; the Septuagint omits), and had charge, along with eleven others, of the silver and gold and vessels for the Temple (<a onClick="return mV(\'Ezr\',8,24);">Ezr 8:24</a>, Codex Vaticanus and Codex Alexandrinus Saraia, Lucian, Sarabias). He aided in the exposition of the Law (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>), was among those who made public confession (<a onClick="return mV(\'Neh\',9,4);">Ne 9:4</a>) and sealed the covenant (<a onClick="return mV(\'Neh\',10,12);">Ne 10:12 (13)</a>). His name also appears in <a onClick="return mV(\'Neh\',12,8,24);">Ne 12:8,24</a>. In every passage listed above except <a onClick="return mV(\'Neh\',10,12);">10:12 (13)</a>, Codex Vaticanus and Codex Alexandrinus read Sarabia, Lucian, Sarabias. In 1Esdras 8:47 the name appears as "Asebebia," the Revised Version (British and American) "Asebebias"; in 1Esdras 8:54, "Esebrias," the Revised Version (British and American) "Eserebias," and 1Esdras 9:48, "Sarabias." Many of the companion-names on the lists are plainly ethnic (Cheyne).``197';
isbe[8025]='Sheresh`she\'-resh, sharesh; Codex Vaticanus Souros; Codex Alexandrinus Soros, Lucian, Phares, Phoros): A Machirite name in a genealogy of Manasseh (<a onClick="return mV(\'1Ch\',7,16);">1Ch 7:16</a>).``1';
isbe[8026]='Sherezer`she-re\'-zer (<a onClick="return mV(\'Zec\',7,2);">Zec 7:2</a> the King James Version).`<a href="./study/isbe/search.html?string=SHAREZER">SHAREZER</a>`1';
isbe[8027]='Sherghat, Asshur, Assur`shur\'-gat, sher\'-gat: The name of the first capital city of Assyria is known by the Arabs as Qala\' at Sherghat, or the Fortress of Sherghat. Its ancient name was Asshur or Assur (<a onClick="return mV(\'Gen\',10,11);">Ge 10:11</a> margin). From it was derived the name of the country, Assyria, and of the people, Assyrians. The date of the founding of the city is not known. Apparently about 2000 BC a colony of Babylonians migrated northward along the Tigris River and settled upon the right shore about halfway between the Upper and Lower Zab, or halfway between the modern cities of Mosul and Bagdad. Assur, the local deity of the place, became the national god of Assyria. It is uncertain whether the deity gave the name to the city, or the city to the deity, but probably an early shrine of Assur stood there, and the people, building their city about it, became known as the Assyrians. At first the city was a Bah dependency, governed by priests from Babylonia. In time, as the city acquired a political significance, the power of the priesthood declined; allegiance to Babylonia ceased, and the Assyrian empire came into existence. About 1200 BC the political power had so increased that a new capital, Nimrud (Calah) was built to the north near the junction of the Upper Zab with the Tigris. In 722 BC the capital was transferred by Sargon to his new city, Dur-Sharrukin, and in 705 BC Sennacherib enlarged Nineveh, and it remained the capital city till the fall of the empire in 606 BC. Assur, however, as the seat of the national deity, never ceased to be the chief religious center.<P>The mounds of Assur are among the largest in Mesopotamia. They rise abruptly from the Tigris, which they follow for about half a mile, and extend a quarter of a mile inland. In the surrounding plain are other mounds, marking the sites of temples, and indicating that a part of the city was without the walls. At the northern end the mounds are surmounted by a high conical peak, which represents the tower or ziggurat of the temple of Assur.<P>Of the early excavators Layard and Rassam examined the ruins, but the fanaticism of the surrounding Arabs prevented extensive excavations. In 1904 Dr. W. Andrae, for the Deutsche Orientgesellschaft, began the systematic excavations which have been continued by Dr. P. Maresch for ten years. Discoveries of the greatest importance have been made. The city was found to have been surrounded on the land side by a double wall. The space between the walls, several rods in width, was occupied by houses, possibly the homes of the soldiers. The base of the outer wall was of stone; above it were mud bricks strengthened at intervals with courses of burned bricks. Along the outer upper edge was a parapet, protected by battlements. From the floor of the parapet small holes were bored vertically downward, so that the soldiers, without exposing themselves, might discharge their arrows at the enemy close to the base of the wall. Many of the holes are still visible. The wall was pierced with several gateways; the names "Gate of Assur," "Gate of the Tigris," "Gate of the Sun God" have survived. At the sides of the gateways were small chambers for the guards, and from them passageways led to the parapet above. The gates were reached by bridges which spanned the moat. Along the river side the city was protected by a high steep embankment, which was built partly of limestone, but chiefly of square bricks laid in bitumen.<P>The temple of Assur at the northern end of the city has been thoroughly excavated. With its outer and inner court and tower it conformed in its general plan to the older Babylonian temples. Several of the palaces of the early kings were discovered, but the best-preserved of the palaces was one which the excavators have called the residence of the mayor. It stood near the western edge of the city on the main street which ran from the western gate to the Tigris. It consisted of two courts surrounded by chambers. Grooves in the paved floor conducted fresh water to the kitchen, the baths and the chambers, and round tiles beneath the floor carried away the waste water to the arched city sewer and to the Tigris. To the rear of the mayor\'s house was a crowded residential quarter. The streets were very narrow and winding. The houses were exceedingly small; in some of them one could not lie at full length upon the floor. Among their ruins appeared little but stone mortars and broken pottery and other essential household implements.<P>Near the southern end of the city a most remarkable discovery was made. About a hundred monoliths, from 4 to 8 ft. high, were found still standing erect. On the side of each one, near the top, was an inscription of several lines, dedicating the stone to some individual who had been of great service to the state. They were not tombstones; apparently they had been erected during the lifetime of the people whom they honored. Of the greatest interest was one which bore the name of Sammuramat or Semiramis, the once supposed mythical queen of Nineveh. Its translation reads: "The column of Sa-am-mu-ra-mat, the palace wife of Samsi-Adad, king of the world, king of Assyria, the mother of Adad-Nirari, king of the world, king of Assyria, the...of Shalmaneser, king of the four regions." The inscription not only makes Semiramis a historical character, but places her among the foremost rulers of Assyria.<P>The tombs of the kings and nobles were found deep in the ruins in the very center of the city. They were rectangular structures of cut stone, covered above with a rounded arch of burned bricks. In some cases the massive stone doors still turned in their sockets. The roofs of many of them had fallen in; others, which were intact, were filled with dust. From the tombs a vast amount of silver, gold and copper jewelry and stone beads and ornaments were recovered.<P>One of the chief temples of the city stood at short distance without the eastern wall. Nothing but its foundations remain. However, the temple was surrounded by a park, traces of which still exist. The soil of the surrounding plain is a hard clay, incapable of supporting vegetable life. Into the clay large holes, several feet in diameter, were dug and filled with loam. Long lines of the holes may still be traced, each marking the spot where a tree, probably the date palm, stood in the temple park.<P>A modern cemetery on the summit of the main mound is still used by the neighboring Arabs, and therefore it will likely prevent the complete excavation of this oldest of the capital cities of Assyria.`<a href="./study/isbe/search.html?string=ASSYRIA">ASSYRIA</a>`7';
isbe[8028]='Sheriff`sher\'-if (Aramaic tiphtaye\' "judicial," "a lawyer," "a sheriff" (<a onClick="return mV(\'Dan\',3,2);">Da 3:2</a> f]): Probably a "lawyer" or "jurist" whose business it was to decide points of law. At best, however, the translation "sheriff" is but a conjecture.``1';
isbe[8029]='Sheshach`she\'-shak (sheshakh, as if "humiliation"; compare shakhakh, "to crouch"): The general explanation is that this is "a cypherform of \'Babel\' (Babylon)" which is the word given as equivalent to "Sheshach" by the Targum (<a onClick="return mV(\'Jer\',25,26);">Jer 25:26</a>; <a onClick="return mV(\'Jer\',51,41);">51:41</a>; the Septuagint omits in both passages). By the device known as Atbas \'atbas, i.e. disguising a name by substituting the last letter of the alphabet for the first, the letter next to the last for the second, etc., sh-sh-k is substituted for babhel. This theory has not failed of opposition. Delitzsch holds that "Sheshach" represents Sis-ku-KI of an old Babylonian regal register, which may have stood for a part of the city of Babylon. (For a refutation of this interpretation see Schrader, KAT2, 415; COT, II, 108 f.) Lauth, too, takes "Sheshach" to be a Hebraization of Siska, a Babylonian district. Winckler and Sayce read Uru-azagga. Finally, Cheyne and a number of critics hold that the word has crept into the text, being "a conceit of later editors."`<a href="./study/isbe/search.html?string=JEREMIAH">JEREMIAH</a>`197';
isbe[8030]='Sheshai`she\'-shi (sheshay): One of the sons of Anak, perhaps an old Hebronite clan name. (Sayce combines the name with Sasu, the root sh-c-h, the Egyptian name for the Syrian Bedouins.) The clan lived in Hebron at the time of the conquest and was expelled by Caleb (<a onClick="return mV(\'Num\',13,22);">Nu 13:22</a>, Codex Vaticanus Sessei; Codex Alexandrinus Semei; <a onClick="return mV(\'Jos\',15,14);">Jos 15:14</a>, Codex Vaticanus Sousei; Codex Alexandrinus Sousai; <a onClick="return mV(\'Jdg\',1,10);">Jud 1:10</a>, Codex Vaticanus Sessei; Codex Alexandrinus Geththi).``1';
isbe[8031]='Sheshan`she\'-shan (sheshan; Sosan): A Jerahmeelite whose daughter married his servant Jarha (<a onClick="return mV(\'1Ch\',2,31,34,35);">1Ch 2:31,34,35</a>). The genealogical list which follows embraces some very early names (compare Curtis, ICC, at the place).``1';
isbe[8032]='Sheshbazzar`shesh-baz\'-ar (shesh-batstsar or sheshbatstsar): Sheshbazzar is the Hebrew or Aramaic form of the Babylonian Shamash-aba-ucur, or Shamash-bana-ucur: "Oh Shamash, protect the father." It is possible that the full name was Shamash-ban-zeri-Babili-ucur, "Oh Shamash, protect the father (builder) of the seed of Babylon." (See Zerubbabel, and Compare the Babylonian names Ashur-banaucur, Ban-ziri, Nabu-ban-ziri, Shamash-ban-apli, Shamash-apil-ucur, Shamash-ban-achi, and others in Tallquist\'s Neubabylonisches Namenbuch, and the Aramaic names on <span class="noTag">numbers</span> 35, 44, 36, and 45 of Clay\'s Aramaic Dockets.) If this latter was the full name, there would be little doubt that Sheshbazzar may have been the same person as Zerubbabel, since the former is called in <a onClick="return mV(\'Ezr\',5,14);">Ezr 5:14</a> the governor of Judah, and the latter is called by the same title in <a onClick="return mV(\'Hag\',1,1,14);">Hag 1:1,14</a>; <a onClick="return mV(\'Hag\',2,2,21);">2:2,21</a>. It is more probable, however, that Sheshbazzar and Zerubbabel were different persons, and that Sheshbazzar was governor of Judah in the time of Cyrus and Zerubbabel in that of Darius. It is possible that Sheshbazzar came to Jerusalem in the time of Cyrus and laid the foundations, and that Zerubbabel came later in the time of Darius Hystaspis and completed the building of the temple (compare <a onClick="return mV(\'Ezr\',2,68);">Ezr 2:68</a>; <a onClick="return mV(\'Ezr\',4,2);">4:2</a>; <a onClick="return mV(\'Hag\',1,14);">Hag 1:14</a>).<P>According to <a onClick="return mV(\'Ezr\',1,8);">Ezr 1:8</a> Sheshbazzar was the prince (Hannasi) of Judah into whose hands Cyrus put the vessels of the house of the Lord which Nebuchadnezzar had brought forth out of Jerusalem and had put in the house of his gods. It is further said in <a onClick="return mV(\'Ezr\',1,11);">1:11</A> that Sheshbazzar brought these vessels with them of the captivity which he brought up from Babylon to Jerusalem. In <a onClick="return mV(\'Ezr\',5,14);">Ezr 5:14</a>f it is said that these vessels had been delivered by Cyrus unto one whose name was Sheshbazzar, whom he had made governor (pechah), and that Sheshbazzar came and laid the foundations of the house of God which was in Jerusalem.`<a href="./study/isbe/search.html?string=SANABASSAR">SANABASSAR</a>`196';
isbe[8033]='Sheth``<a href="./study/isbe/search.html?string=SETH">SETH</a>`1';
isbe[8034]='Shethar`she\'-thar (shethar); Codex Vaticanus and Lucian, Sarsathaios; Codex Alexandrinus Sarestheos): One of the "seven princes" at the court of Ahasuerus (<a onClick="return mV(\'Est\',1,14);">Es 1:14</a>); these princes "sat first in the kingdom" and had the right of entrance to the king\'s presence at any time, except when he was in the company of one of his wives. (According to Marquart, Fund., 69, Shethar comes from sh-r-sh-th-y with which the Persian siyatis, "joy," is to be compared.) The word has never really been satisfactorily explained; it is presumably Persian.``1';
isbe[8035]='Shethar-Bozenai, Shethar-Boznai`she\'-thar-boz\'-e-ni, she\'-thar-boz\'-ni, -boz\'-na-i, (shethar boznay, meaning uncertain): The name of a Persian (?) official mentioned with Tattenai in connection with the correspondence with Darius relative to the rebuilding of the Temple (<a onClick="return mV(\'Ezr\',5,3,6);">Ezr 5:3,6</a>; <a onClick="return mV(\'Ezr\',6,6,12);">6:6,12</a>; Codex Vaticanus Satharbouzan; Codex Alexandrinus Satharbouzanai, in <a onClick="return mV(\'Ezr\',5,3);">Ezr 5:3</a>; <a onClick="return mV(\'Ezr\',6,13);">6:13</a>; Satharbouzanes, in <a onClick="return mV(\'Ezr\',5,6);">Ezr 5:6</a>; Satharbouzane, in <a onClick="return mV(\'Ezr\',6,6);">Ezr 6:6</a>; Lucian, throughout, Tharbouzanaios), called in 1Esdras 6:3,7,27; 7:1 "Shathrabuzanes."<P>Among the conjectures as to the meaning and derivation of the name, the following may be mentioned:<P>(1) Shethar-boznai may be a corruption of metharboznay = Mithrobouzanes, Old Persian Mithrobauzana—i.e. "Mithra is deliverer."<P>(2) shathar is identical with the Old Persian Tsithra ("seed," "brilliance"); names have been found that are confounded with this word.<P>(3) shethar bowzenay may be a title, but sethar, must then be read for shethar.<P>(4) shethar boznay is equivalent to the Old Persian Sethrabuzana, "empire-delivering"; compare Encyclopedia Biblica, article "Shethar-boznai," and Brown, Driver, and Briggs, Hebrew and English Lexicon of the Old Testament.``197';
isbe[8036]='Sheva`she\'-va (shewa\'; Codex Vaticanus Saou; Codex Alexandrinus Saoul, Lucian, Soue):<P>(1) A son of Caleb by his concubine Maacah (<a onClick="return mV(\'1Ch\',2,49);">1Ch 2:49</a>).`<a href="./study/isbe/search.html?string=SHAVSHA">SHAVSHA</a>`1';
isbe[8037]='Shew, Show`sho: "Show" (so always the American Standard Revised Version) is simply a modernized spelling of "shew" (so always in the King James Version and generally in the English Revised Version), and it should be carefully noted that "shew" is never pronounced "shoo," not even in the combination "shewbread"; Compare "sew."<P>In the King James Version "shew" as a verb is the translation of a very large number of terms in the original. This number is reduced considerably by the Revised Version (British and American) (especially in the New Testament), but most of these changes are to secure uniformity of rendition, rather than to correct obscurities. The proper sense of the verb, of course, is "to cause a person to see" (<a onClick="return mV(\'Gen\',12,1);">Ge 12:1</a>, etc.) or "to cause a thing (or "person") to be seen" (<a onClick="return mV(\'Deu\',4,35);">De 4:35</a>; <a onClick="return mV(\'Jdg\',4,22);">Jud 4:22</a>, etc.). "Seeing," naturally, can be taken as intellectual or moral (<a onClick="return mV(\'Jer\',38,21);">Jer 38:21</a>; <a onClick="return mV(\'Psa\',16,11);">Ps 16:11</a>, etc.), and can even be used for "hearing" (<a onClick="return mV(\'Isa\',43,9);">Isa 43:9</a>, etc.; contrast the Revised Version (British and American) <a onClick="return mV(\'1Sa\',9,27);">1Sa 9:27</a>). Hence, "shew" can be used as a general translation for the most various phrases, as "be shewed" for ginomai, "come to pass" (<a onClick="return mV(\'Act\',4,22);">Ac 4:22</a>, the Revised Version (British and American) "be wrought"); "shew forth themselves" for energeo, "be active" (<a onClick="return mV(\'Mat\',14,2);">Mt 14:2</a>, the Revised Version (British and American) "work"); "shew" for poieo "do" (<a onClick="return mV(\'Act\',7,36);">Ac 7:36</a>, the Revised Version (British and American) "having wrought"); for diegeomai, "relate" (<a onClick="return mV(\'Luk\',8,39);">Lu 8:39</a> the Revised Version (British and American) "declare"); for deloo, "make clear" (<a onClick="return mV(\'2Pe\',1,14);">2Pe 1:14</a>, the Revised Version (British and American) "signify"), etc. In <a onClick="return mV(\'Sgs\',2,9);">So 2:9</a> the King James Version (English Revised Version) "shewing himself" and the American Standard Revised Version (English Revised Version margin) "glanceth" both miss the poetry of the original: "His eyes shine in through the lattice" (tsuts, "blossom" "sparkle").<P>The King James Version\'s uses of the noun "shew" usually connote appearance in contrast to reality. So <a onClick="return mV(\'Luk\',20,47);">Lu 20:47</a>, "for a shew" (prophasis, "apparent cause," the Revised Version (British and American) "pretence"); <a onClick="return mV(\'Col\',2,23);">Col 2:23</a>, "shew of wisdom" (so the Revised Version (British and American), logos, "word," "repute"); <a onClick="return mV(\'Gal\',6,12);">Ga 6:12</a>, "make a fair shew" (so the Revised Version (British and American), euprosopeo, "have a fair face"); <a onClick="return mV(\'Psa\',39,6);">Ps 39:6</a>, "vain shew" (so the American Standard Revised Version tselem, "image" the Revised Version margin "shadow"). However, in Sirach 43:1 (horama, "spectacle" (so the Revised Version (British and American))) and in <a onClick="return mV(\'Col\',2,15);">Col 2:15</a> deigmatizo, "to display") "shew" = "spectacle." In <a onClick="return mV(\'Isa\',3,9);">Isa 3:9</a> "the shew of their countenance" is a bad translation for "their respect of persons" (so the Revised Version margin for hakkarath penehem). The "shewing" of the Baptist "unto Israel" (<a onClick="return mV(\'Luk\',1,80);">Lu 1:80</a> the King James Version, the English Revised Version) is of course his appearing to begin his ministry.``48';
isbe[8038]='Shewbread, Table of`(shulchan (<a onClick="return mV(\'Exd\',25,\'25-30\');">Ex 25:25-30</a>, etc.); he trapeza kai he prothesis ton arton (<a onClick="return mV(\'Hbr\',9,2);">Heb 9:2</a>)): For construction, see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</A>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</A>. A rude representation of the table is given on the Arch of Titus in Rome. The bas-relief was measured by Professor Boni in 1905, and the height and width of the represented tables were found to be 48 centimeters, or nearly 19 inches. The table represented is, of course, that of Herod\'s temple, taken at the fall of Jerusalem in 70 AD. See the author\'s article on "The Temple Spoils" in PEFS,1906,306ff.<P>The table of shewbread is to be distinguished from the altar of incense. It has become the fashion of the newer criticism to deny the existence of the altar of incense in preexilic times, and to explain the allusion to it in <a onClick="return mV(\'1Ki\',6,20);">1Ki 6:20</a> as the table of shewbread (so in <a onClick="return mV(\'Eze\',41,22);">Eze 41:22</a>). The other references (<a onClick="return mV(\'1Ki\',6,22);">1Ki 6:22</a>; <a onClick="return mV(\'1Ki\',7,48);">7:48</a>; <a onClick="return mV(\'1Ki\',9,25);">9:25</a>) are dismissed as interpolations. The procedure is radically vicious. The table of shewbread is not an "altar," though the altar is once spoken of as a "table" (<a onClick="return mV(\'Eze\',41,22);">Eze 41:22</a>). There was only one altar of incense (<a onClick="return mV(\'1Ki\',6,20);">1Ki 6:20</a>), but (in <a onClick="return mV(\'2Ch\',4,8);">2Ch 4:8</a>) ten tables of shewbread.`<a href="./study/isbe/search.html?string=SHEWBREAD">SHEWBREAD</a>`17';
isbe[8039]='Shewbread, the`sho\'-bred lechem ha-panim, "bread of the presence"; he prothesis ton arton (<a onClick="return mV(\'Hbr\',9,2);">Heb 9:2</a>); the American Standard Revised Version "showbread").<P>See <a href="./study/isbe/search.html?string=SHEW,+SHOW">SHEW</A>:<P>1. The Term:<P>The marginal reading of <a onClick="return mV(\'Exd\',25,30);">Ex 25:30</a>; <a onClick="return mV(\'Exd\',35,13);">35:13</a>, the Revised Version (British and American) "Presence-bread," exactly gives the meaning of the Hebrew. In <a onClick="return mV(\'2Ch\',2,4);">2Ch 2:4</a> it is spoken of as the "continual showbread," because it was to be before Yahweh "alway" (<a onClick="return mV(\'Exd\',25,30);">Ex 25:30</a>).<P>2. Mosaic Regulations:<P>Later Judaism has much to say as to the number and size of the loaves, more properly thin cakes, which bore this name, together with many minute regulations as to the placing of the loaves, the covering of them with frankincense, and other ritualistic vapidities. All that the Mosaic legislation required was that, once in every week, there should be twelve cakes of unleavened bread, each containing about four-fifths of a peck of fine flour, placed in two piles upon a pure table with frankincense beside each pile and changed every Sabbath day (<a onClick="return mV(\'Lev\',24,\'5-9\');">Le 24:5-9</a>). From the description of the table upon which the fiat cakes were to lie (<a onClick="return mV(\'Exd\',25,\'23-30\');">Ex 25:23-30</a>; <a onClick="return mV(\'Exd\',37,\'10-16\');">37:10-16</a>), it held a series of golden vessels comprising dishes, spoons, flagons and bowls. As it is unlikely that empty cups were set before Yahweh—they being described as "the vessels which were upon the table"—we may conclude that the table held presentation offerings of "grain and wine and oil," the three chief products of the land (<a onClick="return mV(\'Deu\',7,13);">De 7:13</a>). The "dishes" were probably the salvers on which the thin cakes were piled, six on each. The "flagons" would contain wine, and the bowls (made with spouts, "to pour withal"), the oil; while the "spoons" held the frankincense, which was burned as a memorial, "even an offering made by fire unto Yahweh." The cakes themselves were eaten by the priests on every Sabbath day, as being among the "most holy" sacrifices. Each of the synoptists refers to the incident of David and his companions having eaten of the shewbread (hoi artoi tes protheseos), as told in <a onClick="return mV(\'1Sa\',21,\'4-6\');">1Sa 21:4-6</a> (<a onClick="return mV(\'Mat\',12,4);">Mt 12:4</a>; <a onClick="return mV(\'Mar\',2,26);">Mr 2:26</a>; <a onClick="return mV(\'Luk\',6,4);">Lu 6:4</a>).<P>3. On Journeyings:<P>At such times as the removal of the tabernacle took place, the separate appointments of the table of incense were not parted from it, but were carried with it—dishes, spoons, bowls, and cups (<a onClick="return mV(\'Num\',4,7);">Nu 4:7</a>). These, like the other furniture, were borne by the Kohathite Levites, but a few articles of lighter weight were in the personal care of the high priest. These comprised the oil for the candlestick, the sweet incense, the holy oil of consecration, and the meal for the continual bread offering (<a onClick="return mV(\'Num\',4,7,8,16);">Nu 4:7,8,16</a>). Small quantities of these alone would be borne from place to place, such as would be needed with the least delay to refurbish the vessels of the sanctuary on every reerection of the tent of meeting.<P>4. Significance:<P>With this view of the nature, we have a natural and adequate sense of the meanings and importance of the shewbread, in the economy of the temple ritual and service. It was a continual reminder to the worshippers of the truth that man does not live by bread alone, emphasized by the fact that these most holy offerings were afterward eaten. It was the Old Testament version of the prayer, "Give us this day our daily bread"; and in the fact that the holy table was never for a moment left without some loaves lying on it, we have the symbol of man\'s continued and unbroken dependence upon God. Even during the travels of the table of shewbread with the tabernacle, the "continual bread" was required to be in its place thereon (<a onClick="return mV(\'Num\',4,7);">Nu 4:7</a>).<P>It has been usual to say that "frankincense in golden urns stood beside the twelve loaves" (EB, IV, col. 4212). But this is a mere repetition of a Jewish legend, as spoons were the recognized holders of the frankincense to be burned (compare <a onClick="return mV(\'Num\',7,14);">Nu 7:14</a>ff). Such spoons formed a part of the equipment of the shewbread table, and on the removal of the week-old cakes the spoons were carried forth and the frankincense in them burned on the great altar on the Sabbath day. If this were done while the grain and wine and oil were being consumed, it would derive additional significance, as betokening the gratitude and adoration of the representative recipients of the bounties of Nature, just as the daily burning of incense in the holy place betokened the worship and adoration of the praying multitudes without the temple (<a onClick="return mV(\'Luk\',1,10);">Lu 1:10</a>).`<a href="./study/isbe/search.html?string=SHEWBREAD,+TABLE+OF">SHEWBREAD, TABLE OF</a>`17';
isbe[8040]='Shibah`shi\'-ba (shibh\'ah, "seven"; horkos; Swete reads Phrear horkou, literally, "well of oath"; the King James Version Shebah): The name of the original well of Beer-sheba according to <a onClick="return mV(\'Gen\',26,33);">Ge 26:33</a>.`<a href="./study/isbe/search.html?string=BEERSHEBA">BEERSHEBA</a>`1';
isbe[8041]='Shibboleth`shib\'-o-leth (shibboleth): A test of speech applied by the men of Gilead to the Ephraimites, who wished to cross the Jordan, after defeat. If they pronounced the word cibboleth, their dialectic variety of speech betrayed them. (<a onClick="return mV(\'Jdg\',12,6);">Jud 12:6</a>). The word probably has the sense of stream or "flood" (compare <a onClick="return mV(\'Psa\',69,2);">Ps 69:2</a>).``1';
isbe[8042]='Shibmah`shib\'-ma (sibhmah).`<a href="./study/isbe/search.html?string=SIBMAH">SIBMAH</a>`1';
isbe[8043]='Shicron`shik\'-ron (shikkeron).`<a href="./study/isbe/search.html?string=SHIKKERON">SHIKKERON</a>`1';
isbe[8044]='Shield`sheld.`<a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>`1';
isbe[8045]='Shiggaion`shi-ga\'-yon, shi-gi\'-on (shiggayon): Occurs in the title of <a onClick="return mV(\'Psa\',7,1);">Ps 7</a>, and, in the plural, in the verse introducing Habakkuk\'s prayer (<a onClick="return mV(\'Hab\',3,1);">Hab 3:1</a>). Derived from a verb meaning "to wander," it is generally taken to mean a dithyramb, or rhapsody. This is not supported by the Greek VSS, but they are evidently quite at a loss.`<a href="./study/isbe/search.html?string=PSALMS,+BOOK+OF">PSALMS, BOOK OF</a>`1';
isbe[8046]='Shihon`shi\'-hon (shi\'on).`<a href="./study/isbe/search.html?string=SHION">SHION</a>`1';
isbe[8047]='Shihor`shi\'-hor (shichor, also written without a yodh (y) and waw (w) in Hebrew and incorrectly "Sihor" in English): A stream of water mentioned in connection with Egypt. Joshua (<a onClick="return mV(\'Jos\',13,3);">13:3</a>) speaks of the "Shihor, which is before Egypt," a stream which commentators have thought to be "the brook of Egypt," the stream which separated Egypt from Palestine, now called Wady el-\'Arish. Jeremiah (<a onClick="return mV(\'Jer\',2,18);">2:18</a> the King James Version) says, "What hast thou to do in the way to Egypt, to drink the waters of Sihor?" Commentators have thought Shihor in this case to be a name for the Nile. Both interpretations cannot be correct. Whatever the name Sihor means, at least it did not denote a movable river. It must be the same stream in both these passages, and no identification of the stream can be correct that does not satisfy both of them. Professor Naville has recently shown conclusively (Proc. Soc. Biblical Arch., January, 1913) that neither of these interpretations is strictly correct, and has made clear the Biblical references to Sihor. In the northeasternmost province of ancient Egypt, Khentabt ("Fronting on the East"), was a canal, a fresh-water stream drawn off from the Nile, called in the Egyptian language Shi-t-Hor, i.e. "the Horus Canal" (the -t- is an Egyptian feminine ending). There have been many changes in the branches and canals from the Nile in the Delta, and this one with many others has been lost altogether; but there is a tradition among the Bedouin of Wady el-\'Arish to this day that once a branch of the Nile came over to that point. This Shi-t-Hor, "Stream of Horus," makes perfectly clear and harmonious the different references of Scripture to Sihor. It was "before Egypt," as Joshua describes it, and it was the first sweet water of Egypt which the traveler from Palestine in those days was able to obtain, as the words of Jeremiah indicate. "To drink the waters of Sihor" meant to reach the supply of the fresh water of the Nile at the border of the desert. The two other references to South (<a onClick="return mV(\'1Ch\',13,5);">1Ch 13:5</a>; <a onClick="return mV(\'Isa\',23,3);">Isa 23:3</a>) are perfectly satisfied by this identification. The "seed of Sihor" (<a onClick="return mV(\'Isa\',23,3);">Isa 23:3</a> the King James Version) would be grain from Egypt by way of the Shihor.``93';
isbe[8048]='Shihor-Libnath`shi\'-hor-lib\'-nath shichor libhnath; Codex Vaticanus to Seion kai Labanath; Codex Alexandrinus Seior, etc.): A place named on the boundary of Asher (<a onClick="return mV(\'Jos\',19,26);">Jos 19:26</a>). It seems to mark with Carmel the western limit, and may have been on the South of that mountain. Peshitta, Syriac, and Eusebius (Onomasticon) take this as two distinct names attaching to cities in this region. So far, however, no trace of either name has been found in the course of very careful exploration. More probably Shihor was the name of a river, "Libnath" distinguishing it from the Nile, which was called Shihor of Egypt. It may have been called Shihor because, like the Nile, it contained crocodiles. The boundary of Asher included Dor (Tanturah), so the river may be sought South of that town. Crocodiles are said still to be found in the Kishon; but this river runs north of Carmel. The Crocodeilon of Ptolemy (V. xv.5; xvi.2) and Pliny (v.19), which the latter makes the southern boundary of Phoenicia, may possibly be Nahr ez-Zerqa, which enters the sea about 5 miles South of Tanturah. Here also it is said the crocodile is sometimes seen. Perhaps therefore we may identify this stream with Shihor-libnath.``54';
isbe[8049]='Shikkeron`shik\'-er-on (shikkeron; the King James Version Shicron): A place mentioned in <a onClick="return mV(\'Jos\',15,11);">Jos 15:11</a> as being on the northern border of Judah, between Ekron and Baalah, Jabneel being beyond, toward the sea. The site is unknown, but Rev. C. Hauser (PEFS, 1907, 289) suggests Tell es-Sellakeh, northwest of \'Akir, remarking that if this were the site the boundary would follow a natural course over the mountain to Jabneel.``1';
isbe[8050]='Shilhi`shil\'-hi (shilchi): Father of Jehoshaphat\'s mother (<a onClick="return mV(\'1Ki\',22,42);">1Ki 22:42</a> = <a onClick="return mV(\'2Ch\',20,31);">2Ch 20:31</a>; Codex Vaticanus and Codex Alexandrinus in 2 Chronicles, Salei, Codex Vaticanus in 1 Kings, Semeei; Codex Alexandrinus in 1 Kings, Salala; Lucian in both, Seleei). Cheyne (Encyclopaedia Biblica, article "Shilhi") ventures the supposition that "Shilhi" is a misreading for "Shilhim" (<a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a>), and is therefore the name of place rather than that of a person; he holds it to be the name of the birthplace of Azubah, the king\'s mother.``1';
isbe[8051]='Shilhim`shil\'-him shilchim (<a onClick="return mV(\'Jos\',15,32);">Jos 15:32</a>)): See <a href="./study/isbe/search.html?string=SHAARAIM">SHAARAIM, (2)</A>. Possibly Azubah the mother of Jehoshaphat, who is called "the daughter of Shilhi" (<a onClick="return mV(\'1Ki\',22,42);">1Ki 22:42</a>; <a onClick="return mV(\'2Ch\',20,31);">2Ch 20:31</a>), was a native of Shilhim.``1';
isbe[8052]='Shillem, Shillemites`shil\'-em, shil\'-em-its (shillem, ha-shillemi): Shillem is found in <a onClick="return mV(\'Gen\',46,24);">Ge 46:24</a>, a son of Naphtali; Shillemites, his descendants, are mentioned in <a onClick="return mV(\'Num\',26,49);">Nu 26:49</a>; <a href="./study/isbe/search.html?string=SHALLUM">SHALLUM</A> (which see) is found in <a onClick="return mV(\'1Ch\',7,13);">1Ch 7:13</a>.``1';
isbe[8053]='Shiloah`shi-lo\'-a, shi-lo\'-a (<a onClick="return mV(\'Isa\',8,6);">Isa 8:6</a>).`<a href="./study/isbe/search.html?string=SILOAM">SILOAM</a>`1';
isbe[8054]='Shiloh (1)`shi\'-lo (shiloh): The prophecy in <a onClick="return mV(\'Gen\',49,10);">Ge 49:10</a>, "The scepter shall not depart from Judah,...until Shiloh come," etc., has been the subject of very diverse interpretations. the Revised Version margin gives as alternative renderings, "\' Till he come to Shiloh having the obedience of the peoples\' Or, according to the Syriac, \'Till he come whose it is,\' etc."<P>(1) From the earliest times the passage has been regarded as Messianic, but the rendering in the text, which takes "Shiloh" as a proper name, bearing a meaning such as "peaceful" (compare <a onClick="return mV(\'Isa\',9,6);">Isa 9:6</a>, "Prince of Peace"), labors under the difficulty that Shiloh is not found elsewhere as a personal name in the Old Testament, nor is it easy to extract from it the meaning desired. Further, the word was not personally applied to the Messiah in any of the ancient VSS, which rather assume a different reading (see below). Apart from a purely fanciful passage in the Talmud (compare Driver, Genesis, 413), this application does not appear earlier than the version of Seb. Munster in the 16th century (1534).<P>(2) The rendering, "till he come to Shiloh," where Shiloh is taken as the name of a place, not a person, is plausible, but is felt to yield no suitable sense in the context. It is, therefore, now also set aside by most recent scholars.<P>(3) The 3rd rendering, which regards Shiloh as representing the Hebrew shelloh = shiloh for \'asher low, "whose (it is)," has in its favor the fact that this is evidently the reading presupposed in the Septuagint, the Peshitta, and the this is evidently the reading presupposed in the Septuagint, the Peshitta, and the Jewish Targums, and seems to be alluded to in <a onClick="return mV(\'Eze\',21,27);">Eze 21:27</a>, "until he come whose right it is." In this view the passage has still a Messianic reference, though critics argue that it must then be regarded as late in origin. Other interpretations need not detain us. See for details the full discussions in Hengstenberg\'s Christology, I, 54ff, English translation, the commentaries of Delitzsch, Driver, and Skinner, on Genesis (especially Excursus II in Driver), and the articles in the various Bible dictionaries.`<a href="./study/isbe/search.html?string=PROPHECY">PROPHECY</a>`132';
isbe[8055]='Shiloh (2)`(The most usual form is shiloh, but it appears 8 times as shilo, and 3 times as Shilow; Selo, Selom): A town in the lot of Ephraim where Israel assembled under Joshua at the close of the war of conquest (<a onClick="return mV(\'Jos\',18,1);">Jos 18:1</a>). Here territory was allotted to the seven tribes who had not yet received their portions. A commission was sent out to "describe the land into seven portions"; this having been done, the inheritances were assigned by lot. Here also were assigned to the Levites their cities in the territories of the various tribes (<a onClick="return mV(\'Jos\',18,\'1-\');">Joshua 18-21</a>). From Shiloh Reuben and Gad departed for their homes east of the Jordan; and here the tribes gathered for war against these two, having misunderstood their building of the great altar in the Jordan valley (<a onClick="return mV(\'Jos\',22,\'1-\');">Joshua 22</a>). From <a onClick="return mV(\'Jdg\',18,31);">Jud 18:31</a> we learn that in the period of the Judges the house of God was in Shiloh; but when the sanctuary was moved thither from Gilgal there is no indication. The maids of Shiloh were captured by the Benjamites on the occasion of a feast, while dancing in the vineyards; this having been planned by the other tribes to provide the Benjamites with wives without involving themselves in responsibility (<a onClick="return mV(\'Jdg\',21,21);">21:21</a>ff). While the house of the Lord remained here it was a place of pilgrimage (<a onClick="return mV(\'1Sa\',1,3);">1Sa 1:3</a>). To Shiloh Samuel was brought and consecrated to God\'s service (<a onClick="return mV(\'1Sa\',1,24);">1Sa 1:24</a>). The sanctuary was presided over by Eli and his wicked sons; and through Samuel the doom of their house was announced. The capture of the ark by the Philistines, the fall of Hophni and Phinehas, and the death of the aged priest and his daughter-in-law followed with startling rapidity (<a onClick="return mV(\'1Sa\',3,\'1-\');">1Sa 3</a>; <a onClick="return mV(\'1Sa\',4,\'1-\');">4</a>). The sanctuary in Shiloh is called a "temple" (<a onClick="return mV(\'1Sa\',1,9);">1Sa 1:9</a>; <a onClick="return mV(\'1Sa\',3,3);">3:3</a>) with doorpost and doors (<a onClick="return mV(\'1Sa\',1,9);">1Sa 1:9</a>; <a onClick="return mV(\'1Sa\',3,15);">3:15</a>). It was therefore a more durable structure than the old tent. See <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</A>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</A>. It would appear to have been destroyed, probably by the Philistines; and we find the priests of Eli\'s house at Nob, where they were massacred at Saul\'s order (<a onClick="return mV(\'1Sa\',22,11);">1Sa 22:11</a>). The disaster that befell Shiloh, while we have no record of its actual occurrence, made a deep impression on the popular mind, so that the prophets could use it as an effective illustration (<a onClick="return mV(\'Psa\',78,60);">Ps 78:60</a>; <a onClick="return mV(\'Jer\',7,12);">Jer 7:12:14</a>; <a onClick="return mV(\'Jer\',26,6);">26:6</a>). Here the blind old prophet Ahijah was appealed to in vain by Jeroboam\'s wife on behalf of her son (<a onClick="return mV(\'1Ki\',14,2,4);">1Ki 14:2,4</a>), and it was still occupied in Jeremiah\'s time (<a onClick="return mV(\'Jer\',41,5);">Jer 41:5</a>).<P>The position of Shiloh is indicated in <a onClick="return mV(\'Jdg\',21,19);">Jud 21:19</a>, as "on the north of Beth-el, on the east side of the highway that goeth up from Beth-el to Shechem, and on the south of Lebonah." This is very explicit, and points definitely to Seilun, a ruined site on a hill at the northeast of a little plain, about 9 miles north of Beitin (Bethel), and 3 miles Southeast of Khan el-Lubban (Lebonah), to the east of the highway to Shechem (Nablus). The path to Seilun leaves the main road at Sinjil, going eastward to Turmus \'Aya, then northward across the plain. A deep valley runs to the north of the site, cutting it off from the adjoining hills, in the sides of which are rock-hewn tombs. A good spring rises higher up the valley. There are now no vineyards in the district; but indications of their ancient culture are found in the terraced slopes around.<P>The ruins on the hill are of comparatively modern buildings. At the foot of the hill is a mosque which is going quickly to ruin. A little distance to the Southeast is a building which seems to have been a synagogue. It is called by the natives Jami\' el-\'Arba\'in, "mosque of the Forty." There are many cisterns.<P>Just over the crest of the hill to the north, on a terrace, there is cut in the rock a rough quadrangle 400 ft. by 80 ft. in dimensions. This may have been the site of "the house of the Lord" which was in Shiloh.``54';
isbe[8056]='Shilonite`shi\'-lo-nit (shiloni (<a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>), shiloni (<a onClick="return mV(\'2Ch\',10,15);">2Ch 10:15</a>; <a onClick="return mV(\'Neh\',11,5);">Ne 11:5</a>), Shilowniy; Selonei, Seloneites): This denotes an inhabitant of Shiloh, and applies (1) to Ahijah the prophet (<a onClick="return mV(\'1Ki\',11,29);">1Ki 11:29</a>, etc.); and (2) to a family of the children of Judah, who, after the exile, made their home in Jerusalem (<a onClick="return mV(\'1Ch\',9,5);">1Ch 9:5</a>; <a onClick="return mV(\'Neh\',11,5);">Ne 11:5</a>, the King James Version "Shiloni").``1';
isbe[8057]='Shilshah`shil\'-sha shilshah; Codex Vaticanus and Codex Alexandrinus Saleisa; Lucian, Selemsan): An Asherite (<a onClick="return mV(\'1Ch\',7,37);">1Ch 7:37</a>).``1';
isbe[8058]='Shimea`shim\'-e-a (shim\'a\'):<P>See <a href="./study/isbe/search.html?string=SHAMMUA">SHAMMUA</A> and <a href="./study/isbe/search.html?string=SHAMMAH">SHAMMAH</A>.<P>(1) Brother of David. See <a href="./study/isbe/search.html?string=SHAMMAH">SHAMMAH</A>.<P>(2) Son of David (<a onClick="return mV(\'1Ch\',3,5);">1Ch 3:5</a>, Codex Vaticanus Saman; but in <a onClick="return mV(\'2Sa\',5,14);">2Sa 5:14</a>; <a onClick="return mV(\'1Ch\',14,4);">1Ch 14:4</a>, "Shammua").<P>(3) A Merarite Levite (<a onClick="return mV(\'1Ch\',6,30);">1Ch 6:30</a>, Codex Vaticanus Somea; Codex Alexandrinus Sama, Lucian, Samaa).<P>(4) A Gershonite Levite (<a onClick="return mV(\'1Ch\',6,39);">1Ch 6:39 (Hebrew 24)</a>, Semaa).``1';
isbe[8059]='Shimeah`shim\'-e-a (shim\'ah; Codex Vaticanus Semaa, Codex Alexandrinus Samea, Lucian, Samaa): A descendant of Jehiel, the "father" of Gibeon (<a onClick="return mV(\'1Ch\',8,32);">1Ch 8:32</a>); in <a onClick="return mV(\'1Ch\',9,38);">1Ch 9:38</a> he is called "Shimeam" (Codex Vaticanus, Codex Sinaiticus, Lucian; Samaa Codex Alexandrinus Sama; see Jewish Quarterly Review, XI, 110-13, section symbol section symbol 10-12).``1';
isbe[8060]='Shimeam`shim\'-e-am.`<a href="./study/isbe/search.html?string=SHIMEAH">SHIMEAH</a>`1';
isbe[8061]='Shimeath`shim\'-e-ath (shim\'ath, or shim\'ath; the Septuagint in 2 Kings, Iemouath, Codex Vaticanus in 2 Chronicles, Sama, Codex Alexandrinus Samath, Lucian, Samaath): Father of Jozacar (<a onClick="return mV(\'2Ki\',12,21);">2Ki 12:21 (22)</a>), one of the murderers of Joash, king of Judah. According to <a onClick="return mV(\'2Ch\',24,26);">2Ch 24:26</a> Shimeath is an Ammonitess and the mother, not the father, of Jozacar. Many textual emendations have been suggested (compare HDB, article "Shimeath"), but they are unnecessary, as the Chronicler\'s revised version of the incident in Kings was a deliberate one. The Chronicler was a sturdy opponent of intermarriage, and in the story of the assassination of King Joash he saw an opportunity to strike a blow against the hated practice. In the older account in Kings the names of the conspirators are given as "Jozakar the son of shim\'ath, and Jehozabad the son of shemer." The two names are both masculine; but the final taw (t) of the former looked to the Chronicler like the feminine ending and offered him his opportunity. In his account, the one of the two murderers (dastardly villains, even though the king had merited death) was "the son of (shim\'ath), the Ammonitess" and the other was "the son of (shimrith), the Moabitess" (compare Torrey, Ezra Studies, 212ff).``197';
