isbe[8062]='Shimeathites`shim\'-e-ath-its shim\'athim; Codex Vaticanus and Codex Alexandrinus Samathieim; Lucian, Samathein): A subdivision of the tribe of Caleb (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>). In the three families mentioned in this passage Jerome saw three distinct classes of religious functionaries: Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) canentes atque resonantes et in tabernaculis commorantes. The Targum has a similar explanation, except that the "Sucathites" are those "covered" with a spirit of prophecy. Bertheau (Handbuch zum Altes Testament) accepts Jerome\'s explanation, except that he regards the first class as gate-keepers (Aramaic tera\' = Hebrew sha\'ar). Wellhausen (DGJ, 30f) finds underlying the three names tir\'ah, a technical term for sacred music-making, shim\'ah, the Halacha or sacred tradition. Buhl (HWB13) derives Shimeathites and Sucathites from unknown places. Keil interprets as descendants from the unknown Shemei (compare Curtis, ICC). The passage is hopelessly obscure.``197';
isbe[8063]='Shimei`shim\'-e-i (shim\'i, possibly "hear me (El)" or "(Jah)"; Semeei, Semei): A name of frequent occurrence throughout the Old Testament records, sometimes varying slightly in form in English Versions of the Bible. The King James Version has "Shimi" in <a onClick="return mV(\'Exd\',6,17);">Ex 6:17</a>; "Shimhi" in <a onClick="return mV(\'1Ch\',8,21);">1Ch 8:21</a>; "Shimeah" in <a onClick="return mV(\'2Sa\',21,21);">2Sa 21:21</a>. The Revised Version (British and American) has "Shimeites" in <a onClick="return mV(\'Zec\',12,13);">Zec 12:13</a>, where the King James Version has "Shimei," and <a onClick="return mV(\'Num\',3,21);">Nu 3:21</a> for the King James Version "Shimites." English Versions of the Bible has "Shema" in <a onClick="return mV(\'1Ch\',8,13,21);">1Ch 8:13,21</a> margin for the "Shimei" of <a onClick="return mV(\'1Ch\',8,21);">8:21</A>. In all others of the many occurrences in the King James Version and the Revised Version (British and American) the form is "Shimei."<P>(1) A family name among the Levites before and after the exile, at least five of whom bore it:<P>(a) Son of Gershon and grandson of Levi (<a onClick="return mV(\'Exd\',6,17);">Ex 6:17</a>; <a onClick="return mV(\'Num\',3,18);">Nu 3:18</a>; <a onClick="return mV(\'1Ch\',6,17);">1Ch 6:17</a>; <a onClick="return mV(\'1Ch\',23,7,10);">23:7,10</a>). The text of <a onClick="return mV(\'1Ch\',6,\'1-\');">1 Chronicles 6</a> and <a onClick="return mV(\'1Ch\',23,\'1-\');">23</A> is corrupt, making difficult the tracing of the various genealogies and the identification of the several Shimeis. Evidently that of <a onClick="return mV(\'1Ch\',23,9);">23:9</A> is a scribe\'s error for one of the four sons of Ladan or Libni, whose names are given in the preceding verse.<P>(b) An ancestor of Asaph the musician (<a onClick="return mV(\'1Ch\',6,42);">1Ch 6:42</a>), possibly the same as (a) above, Jahath the son of South (compare <a onClick="return mV(\'1Ch\',23,10);">1Ch 23:10</a>) being by a copyist\'s error transposed so as to read as if he were the father of South<P>(c) A descendant of the Merarite branch of the Levites (<a onClick="return mV(\'1Ch\',6,29);">1Ch 6:29</a>).<P>(d) One of the 288 trained singers in the service of the sanctuary under Asaph (<a onClick="return mV(\'1Ch\',25,17);">1Ch 25:17</a>).<P>(e) One of the Levites who helped to cleanse the Temple in Hezekiah\'s reformation (<a onClick="return mV(\'2Ch\',29,14);">2Ch 29:14</a>). He was a descendant of Heman the musician. Hezekiah afterward appointed him with Conaniah to have chief oversight of "the oblations and the tithes and the dedicated things" which were brought into the chambers of Yahweh\'s house prepared for them (<a onClick="return mV(\'2Ch\',31,11,12);">2Ch 31:11,12</a>).<P>(f) A Levite who under Ezra put away his foreign wife (<a onClick="return mV(\'Ezr\',10,23);">Ezr 10:23</a>), "Semeis" in 1Esdras 9:23.<P>(2) The best-known Bible character of this name is the Benjamite, of the family of Saul (<a onClick="return mV(\'2Sa\',16,\'5-12\');">2Sa 16:5-12</a>; <a onClick="return mV(\'2Sa\',19,\'16-20\');">19:16-20</a>; <a onClick="return mV(\'1Ki\',2,8.9,\'36-46\');">1Ki 2:8,9,36-46</a>), who met David at Bahurim as he was fleeing from Absalom, and in bitter and cowardly fashion cursed and attacked the hard-pressed king. Apparently David\'s flight to the Jordan led through a narrow ravine, on one side of which, or on the ridge above, stood Shimei in safety as he cast stones at David and his men, cursing as he threw (<a onClick="return mV(\'2Sa\',16,5,6);">2Sa 16:5,6</a>). His hatred of David who had displaced his royal kinsman Saul had smouldered long in his mean heart; and now the flame bursts out, as the aged and apparently helpless king flees before his own son. Shimei seizes the long-coveted opportunity to pour out the acid hate of his heart. But when David\'s faithful companions would cross the ravine to make quick work of Shimei, the noble king forbade them with these remarkable words: "Behold, my son, who came forth from my bowels, seeketh my life: how much more may this Benjamite now do it? let him alone, and let him curse; for Yahweh hath bidden him. It may be that Yahweh...will requite me good for his cursing" (<a onClick="return mV(\'2Sa\',16,11,12);">2Sa 16:11,12</a>). After Absalom\'s overthrow, as the king was returning victorious and vindicated, Shimei met him at the Jordan with most abject confession and with vows of allegiance (<a onClick="return mV(\'2Sa\',19,\'16-23\');">2Sa 19:16-23</a>).<P>The king spared his life; but shortly before his death charged his son Solomon to see that due punishment should come to Shimei for his sins: "Thou shalt bring his hoar head down to Sheol with blood" (<a onClick="return mV(\'1Ki\',2,9);">1Ki 2:9</a>). When he came to the throne Solomon summoned Shimei and bade him build a house in Jerusalem, to which he should come and from which he must not go out on pain of death (<a onClick="return mV(\'1Ki\',2,\'36-38\');">1Ki 2:36-38</a>). Feeling secure after some years, Shimei left his home in Jerusalem to recapture some escaped slaves (<a onClick="return mV(\'1Ki\',2,\'39-41\');">1Ki 2:39-41</a>), and in consequence he was promptly dispatched by that gruesome avenger of blood, the royal executioner, "Benaiah the son of Jehoiada," who "fell upon him," as he had upon Adonijah and Joab, "so that he died" (<a onClick="return mV(\'1Ki\',2,46);">1Ki 2:46</a>).<P>(3) Another Benjamite, mentioned with Rei as an officer in the king\'s bodyguard, who was faithful to David in the rebellion of Adonijah (<a onClick="return mV(\'1Ki\',1,8);">1Ki 1:8</a>). Josephus reads Rei as a common noun, describing Shimei as "the friend of David." He is to be identified with the son of Elah (<a onClick="return mV(\'1Ki\',4,18);">1Ki 4:18</a>), whom Solomon, probably because of his fidelity, named as one of the 12 chief commissary officers appointed over all Israel, "who provided victuals for the king and his household."<P>(4) A man of some prominence in the tribe of Benjamin (<a onClick="return mV(\'1Ch\',8,21);">1Ch 8:21</a>), whose home was in Aijalon, where he was a "head of fathers\' houses" (<a onClick="return mV(\'1Ch\',8,13);">1Ch 8:13</a>); but his descendants lived in Jerusalem (<a onClick="return mV(\'1Ch\',8,28);">1Ch 8:28</a>). In the King James Version he is called "Shimhi"; in <a onClick="return mV(\'1Ch\',8,13);">1Ch 8:13</a> he is called "Shema."<P>(5) Another Benjamite, an ancestor of Mordecai (<a onClick="return mV(\'Est\',2,5);">Es 2:5</a>), "Semeias" in Additions to Esther 11:2.<P>(6) A brother of David (<a onClick="return mV(\'2Sa\',21,21);">2Sa 21:21</a>, the King James Version "Shimeah"); in <a onClick="return mV(\'1Sa\',16,9);">1Sa 16:9</a> he is called "Shammah"; compare "Shimeah," "Shimea."<P>(7) A man of Judah, called "the Ramathite," who was "over the vineyards" in David\'s reign (<a onClick="return mV(\'1Ch\',27,27);">1Ch 27:27</a>).<P>(8) A Simeonite living in the time of David (<a onClick="return mV(\'1Ch\',4,26,27);">1Ch 4:26,27</a>), whose chief claim to distinction was that he was father of 16 sons and 6 daughters. The descendants of such a numerous progeny, not being able to maintain themselves in their ancestral home in Beer-sheba, in the days of Hezekiah fell upon Gerar, and dispossessed "the sons of Ham" (<a onClick="return mV(\'1Ch\',4,39);">1Ch 4:39</a>, the Septuagint), and upon Mt. Seir, driving out the Amalekites (<a onClick="return mV(\'1Ch\',4,43);">1Ch 4:43</a>).<P>(9) A man of Reuben, son of Gog (<a onClick="return mV(\'1Ch\',5,4);">1Ch 5:4</a>).<P>(10), (11) Two men of "Israel," i.e. not priests or Levites, one "of the sons of Hashum" (<a onClick="return mV(\'Ezr\',10,33);">Ezr 10:33</a>), the other "of the sons of Bani" (<a onClick="return mV(\'Ezr\',10,38);">Ezr 10:38</a>), who put away their foreign wives at Ezra\'s command, in 1Esdras called respectively "Semei" (9:33) and "Someis" (9:34).<P>(12) A brother of Zerubbabel (<a onClick="return mV(\'1Ch\',3,19);">1Ch 3:19</a>).<P>The Shimeites were descendants of Shimei, grandson of Levi; compare (1) (a) above (<a onClick="return mV(\'Num\',3,21);">Nu 3:21</a>; <a onClick="return mV(\'Zec\',12,13);">Zec 12:13</a>).``109';
isbe[8064]='Shimeon`shim\'-e-on (shim\'on; elsewhere "Simeon"): One of the sons of Harim who had married foreign wives (<a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>; Codex Vaticanus and Codex Alexandrinus Semeon; Lucian, Sumeon = 1Esdras 9:32, "Simon Chosameus").``1';
isbe[8065]='Shimhi`shim\'-hi.`<a href="./study/isbe/search.html?string=SHIMEI">SHIMEI</a>`1';
isbe[8066]='Shimi, Shimites`shim\'-i, shi\'-mi, shim\'-its.`<a href="./study/isbe/search.html?string=SHIMEI">SHIMEI</a>`1';
isbe[8067]='Shimma`shim\'-a.`<a href="./study/isbe/search.html?string=SHAMMAH">SHAMMAH</a>`1';
isbe[8068]='Shimon`shi\'-mon (shimon; Codex Vaticanus Semion, Codex Alexandrinus Semeion; Lucian, Sami): A name in the Judahite genealogy (<a onClick="return mV(\'1Ch\',4,20);">1Ch 4:20</a>).``1';
isbe[8069]='Shimrath`shim\'-rath (shimrath; Samarath): The last of nine sons of Shimei of the tribe of Benjamin (<a onClick="return mV(\'1Ch\',8,21);">1Ch 8:21</a>).``1';
isbe[8070]='Shimri`shim\'-ri (shimri; various forms in the Septuagint): There are four Hebrews mentioned in the Bible who bear this name:<P>(1) A Simeonite, a son of Shemaiah and father of Jedaiah, a chief of his tribe (<a onClick="return mV(\'1Ch\',4,37);">1Ch 4:37</a>).<P>(2) The father of Jediael, a bodyguard of King David (<a onClick="return mV(\'1Ch\',11,45);">1Ch 11:45</a>).<P>(3) A son of Hosah, a Levite. He was appointed by David to be doorkeeper in the house of the Lord. He was made chief of the tribe, although not the firstborn of his family (<a onClick="return mV(\'1Ch\',26,10);">1Ch 26:10</a>).<P>(4) One of the sons of Elizaphan, a Levite. He assisted in purifying the temple in the time of Hezekiah (<a onClick="return mV(\'2Ch\',29,13);">2Ch 29:13</a>).``178';
isbe[8071]='Shimrith`shim\'-rith (shimrith, "guard," feminine): A Moabitess, the mother of Jehozabad, one of those that conspired against King Joash (<a onClick="return mV(\'2Ch\',24,26);">2Ch 24:26</a>). Elsewhere (<a onClick="return mV(\'2Ki\',12,21);">2Ki 12:21</a>) Jehozabad is described as the son of <a href="./study/isbe/search.html?string=SHOMER">SHOMER</A> (which see), the same name without the feminine ending.``1';
isbe[8072]='Shimron (1)`shim\'-ron (shimron, "watch"): The 4th son of Issachar (<a onClick="return mV(\'Gen\',46,13);">Ge 46:13</a>; <a onClick="return mV(\'Num\',26,24);">Nu 26:24</a>; <a onClick="return mV(\'1Ch\',7,1);">1Ch 7:1</a>), and ancestor of the Shimronites (<a onClick="return mV(\'Num\',26,24);">Nu 26:24</a>).``1';
isbe[8073]='Shimron (2)`(shimron; Codex Vaticanus Sumoon; Codex Alexandrinus Someron and other forms): A town whose king was tributary to Jabin king of Hazor, and who joined in the attempt to resist the invasion under Joshua (<a onClick="return mV(\'Jos\',11,1);">Jos 11:1</a>). It was in the territory allotted to Zebulun (<a onClick="return mV(\'Jos\',19,15);">Jos 19:15</a>). No sure identification is yet possible. The Septuagint and the Talmud both omit the "r" from the name; and Neubauer would identify it with Simonias (Vita, 24), the Simonia of the Talmud, which is now represented by Semuniyeh, a village about 5 miles west of Nazareth, on the edge of the plain (Geog. du Talm). Beit Lachm, named by Josephus along with it, is a short distance to the northwest Es-Semeiriyeh, about 3 miles north of Acre, has also been suggested; but it is perhaps too far to the west.``54';
isbe[8074]='Shimron-Meron`shim\'-ron-me\'-ron (shimron mer\'on; Sumoon...Mamroth, Codex Alexandrinus Samron...Phasga...Maron): A royal city of the Canaanites, the king of which was slain by Joshua (<a onClick="return mV(\'Jos\',12,20);">12:20</a>). Here the name is followed by that of Achshaph, which also follows the name of Shimron in <a onClick="return mV(\'Jos\',11,1);">11:1</A>. This suggests that the two are in reality one, and that Shimron-meron may only be the full name. A royal Canaanite city, Sam-simuruna, is mentioned in the inscriptions of Sen-nacherib, Esar-haddon and Assur-bani-pal, which Schrader (KAT2, 163) would identify with this, and thinks it may now be represented by es-Semeiri-yeh.`<a href="./study/isbe/search.html?string=SHIMRON">SHIMRON</a>`54';
isbe[8075]='Shimshai`shim\'-shi, shim\'-sha-i (shimshay; Codex Vaticanus Samasa, Samae, Sameais Samesa; Codex Alexandrinus Samsai; Lucian, Samaias, throughout; in 1Esdras 2:17 he is called "Semellius," the Revised Version (British and American) "Samellius"; a number of explanations of this name have been offered, but no one has been generally favored. One conjecture traces it to an Old Iranian caritative sh-sh-m-y conformed to shamash; another prefers the Old Bactrian simezhi = simaezhi; compare BDB, under the word The name looks as though it were derived from shemesh, "the sun"): A state secretary who, with <a href="./study/isbe/search.html?string=REHUM">REHUM</A> (which see) and others, wrote to Artaxerxes to persuade him to prohibit the rebuilding of the temple (<a onClick="return mV(\'Ezr\',4,8,9,17,23);">Ezr 4:8,9,17,23</a>).``197';
isbe[8076]='Shin, Sin`shen, sen "sh", "s": The 21st letter of the Hebrew alphabet; transliterated in this Encyclopedia as "sh" and "s". It came also to be used for the number 300. For name, etc., see <a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</A>.``1';
isbe[8077]='Shinab`shi\'-nab shin\'abh; Samaritan: shin\'ar; Sennaar): King of <a href="./study/isbe/search.html?string=ADMAH">ADMAH</a> (which see). He is mentioned with Shemeber, king of Zeboiim; he was attacked by Chedorlaomer and his allies (<a onClick="return mV(\'Gen\',14,2);">Ge 14:2</a>). The reading is very uncertain. If the incident narrated is founded on fact, Shinab may be identical with Sanibu, an Ammonite king in the time of Tiglath-pileser III (so French Delitzsch, Wo lag das Paradies? 294); or the name may be equated by the Assyrian Sin-sar-ucur (compare "Shenazzar"), and Shem-eber with the Assyrian Sumu-abi (Sayce, The Expository Times, VIII, 463). Jewish exegesis gives a sinister explanation of all four names (<a onClick="return mV(\'Gen\',14,2);">Ge 14:2</a>). The Midrash (Ber. Rab. 42) explains Shinab as sho\'-ebh mammon, "one who draws money (wherever he can)." It is of interest to note that the names fall into two alliterative pairs and that each king\'s name contains exactly as many letters as that of his city. On the whole, however, the list leaves an impression of artificiality; as the names are not repeated in <a onClick="return mV(\'Gen\',14,8);">Ge 14:8</a>, it is highly probable that they are later additions to the text.``197';
isbe[8078]='Shinar`shi\'-nar (shin\'ar; Senaar Sen(n)aar):<P>1. Identification<P>2. Possible Babylonian Form of the Name<P>3. Sumerian and Other Equivalents<P>4. The Syriac Sen\'ar<P>5. The Primitive Tongue of Shinar<P>6. Comparison with the Semitic Idiom<P>7. The Testimony of the Sculptures, etc., to the Race<P>8. The Sumerians Probably in Shinar before the Semites<P>9. The States of Shinar:<P class="in15">(1) Sippar;<P class="in15">(2) Kes;<P class="in15">(3) Babylon;<P class="in15">(4) Nippur;<P class="in15">(5) Adab;<P class="in15">(6) Surippak;<P class="in15">(7) Umma;<P class="in15">(8) Erech;<P class="in15">(9) Lagas;<P class="in15">(10) Larsa;<P class="in15">(11) Ur;<P class="in15">(12) Eridu;<P class="in15">(13) The Land of the Sea;<P class="in15">(14) Nisin, Isin, or Karrak;<P class="in15">(15) Upa or Upia (Opis);<P class="in15">(16) Other Well-known Cities<P>10. Shinar and Its Climate<P>11. Sculpture in Shinar<P>12. The First Nation to Use Writing in Western Asia<P>13. The System Employed, with an Example<HR /><P>1. Identification:<P>The name given, in the earliest Hebrew records, to Babylonia, later called Babel, or the land of Babel (babhel, \'erets babhel). In <a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a> it is the district wherein lay Babel, Erech, Accad, and Calneh, cities which were the "beginning" of Nimrod\'s kingdom. In <a onClick="return mV(\'Gen\',11,2);">11:2</A> Shinar is described as the land of the plain where migrants from the East settled, and founded Babel, the city, and its great tower.<P>2. Possible Babylonian Form of the Name:<P>Though sometimes identified with the Babylonian Sumer, the connection of Shinar with that name is doubtful. The principal difficulty lies in the fact that what might be regarded as the non-dialectical form singar (which would alone furnish a satisfactory basis of comparison) is not found, and would, if existent, only apply to the southern portion of Babylonia. The northern tract was called Akkad, after the name of its capital city (see <a href="./study/isbe/search.html?string=ACCAD">ACCAD</A>). The Greek form Sen(n)aar shows that, at the time the Septuagint translation was made, there was no tradition that the \'ayin was guttural, as the supposed Babylonian forms would lead us to expect. As the Biblical form Shinar indicates the whole of Babylonia, it corresponds with the native (Sumerian) Kingi-Ura, rendered "Sumer and Akkad," from which, by changing "K" into "Sh" (found in Sumerian), Shinar may have been derived, but this explanation is not free from difficulties.<P>3. Sumerian and Other Equivalents:<P>This two-fold designation, Kingi-Ura, is that which is commonly used in the inscriptions of the earlier kings, though it cannot then have indicated always the whole country, but only such parts of it as acknowledged their overlordship. Later on the corresponding term seems to have been Kar-Dunias ("the territory of the god Dunias," to all appearance a term introduced by the Kassite rulers). Nabonassar and his successors seem to have contented themselves with the title "king of Babylon," rule in the city implying also the dominion over the whole country. Often, however, the equivalent term for Babylonia is Ehi, probably an abbreviation of Eridu, and here standing for the land belonging to that sacred city—"the good city," a type of Paradise, Babylonia being, in fact, situated upon the edinu, or "plain."<P>See <a href="./study/isbe/search.html?string=EDEN">EDEN</A>.<P>4. The Syriac Sen\'ar:<P>All these comparisons tend to show that the Babylonian equivalent of Shinar is not any of the above, and as yet has not, in fact, been found. This is also implied by the fact, that Sen\'ar was used in Syriac for the country around Bagdad, and in ancient times included (it may be supposed) the plain upon which the ruins of Babylon stand. Sen\'ar was therefore in all probability an ancient Babylonian designation of the tract, now lost, but regarded by the Hebrews as synonymous with Babylonia.<P>5. The Primitive Tongue of Shinar:<P>From the inscriptions it would seem that the primitive language of Shinar was not Semitic, but the agglutinative idiom now named Sumerian—a tongue long regarded as Turanian, and having, it is thought, Turko-Chinese affinities—gal, "to be," Turkish ol-mak; ama (ana), "mother," Turkish ana; abba, "old man," Turkish baba, "father"; (h)e, "house," Turkish ev, etc. The Chinese affinities seem less close, but the following may be quoted: a(y)a "father," Chinese ye (Amoy ia); ge, "night," Chinese ye; gu, "to speak," Chinese yu; shu, "hand," Chinese sheu; kin, "business," Chinese kung, "work"; etc. Chinese and Turkish, however, have had time to pass through many changes since Sumerian was current in Shinar. Many words of the Sumerian language were borrowed by the Semitic Babylonians, and a few (like hekal, "temple," Semitic (h)egal, "great house") entered the other Semitic languages.<P>6. Comparison with the Semitic Idiom:<P>Halevy\'s contention, that Sumerian is simply "an allography" for the expression of Sera Babylonian, seems to be untenable, as they differ not only in words, but also in grammar; moreover, Sumerian had a dialect, called by the natives "woman\'s tongue." For the rest, the principal differences between Sumerian and Semitic Babylonian are:<P>(1) post-positional suffixes instead of prepositions;<P>(2) verbs with long strings of prefixes and infixes to express the persons and regimens, instead of a prefix and a suffix;<P>(3) compound words, both nouns and verbs, are common instead of being exceedingly rare. Sumerian seems to have borrowed several words from Semitic Babylonian.<P>7. The Testimony of the Sculptures, etc. to the Race:<P>Not only the language, but also the sculptures which they have left, point to the probability that the earlier inhabitants of Shinar belonged to a different race from the later. The Semites of Babylonia were to all appearance thick-set and muscular, but the Sumerians, notwithstanding the stumpy figures which their statues and bas-reliefs show, seem to have been slim—in any case, their warriors, in the better basreliefs, as well as the figures of the god Nin-Girsu (formerly known as "the god with the firestick"), and the engraved cylinders, have this type. Moreover, the sculptures and cylinder-seals show that certain classes—priests or the like—were clean shaven, in marked contrast to Semitic usage elsewhere. Their deities, however, always had hair and beard, implying that they came from a different, though possibly related, stock. These deities were very numerous, and it is noteworthy that, though those with Sumerian names may be counted by hundreds, those with Semitic names are only to be reckoned by tens.<P>8. The Sumerians Probably in Shinar before the Semites:<P>Though there is no certain indication which race entered Shinar first, it is to be noted that Nimrod, presumably Shinar\'s first king and the founder of its great cities, was a son of Cush (<a onClick="return mV(\'Gen\',10,8);">Ge 10:8</a>), and the name of Shinar seems to have existed before the foundation of Babel (Babylon) and its tower (<a onClick="return mV(\'Gen\',11,2);">Ge 11:2</a>). In the native sculptures, moreover, the non-Semitic type precedes the Semitic; and in the inscriptions the non-Semitic idiom precedes that of the Semitic tranlation. Everything points, therefore, to the Sumerians having been in Babylonia before the Semitic inhabitants.<P>9. The States of Shinar:<P>At the earliest period to which our records refer the Sumerians of Shinar were divided into a number of small states, of which the following may be regarded as the principal:<P>(1) Sippar:<P>Sippar or Sippar-Aruru (-Ya\'ruru), possibly including Accad (<a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>), some distance Southwest of Bagdad. It is the modern \'Abu-habbah, "father of grain." Though it seems to have fallen early under the dominion of the Semites, it was at first Sumerian, as its native name, Zimbir, and the ideographic writing thereof show. According to Berosus, who calls it Pantabiblion, one of its earliest kings was Amelon or Amillarus, who reigned 13 sari, or 46,800 years. Later on came Evedoreschus, the native Enwe-duran-ki, renowned as a priest favored by the gods. His descendants, if of pure race, inherited the divine grace which he enjoyed. It is said to have been in Sippara (Sippar) that Ut-napistim, the Babylonian Noah, buried the records before entering the ark.<P>(2) Kes:<P>About 18 miles north of Babylon lay Kes, now Oheimer—a foundation which seems to have preceded Babylon as the capital of Shinar. Its early queen, Azag-Bau, is said to have been the wife of a wine-merchant and to have reigned 100 years.<P>(3) Babylon:<P>Babylon, for which see <a href="./study/isbe/search.html?string=BABEL,+BABYLON">BABEL, BABYLON</A>. As one of its early kings, Berosus mentions Alorus, "the shepherd of the people," as having reigned for 10 sari, or 36,000 years. The state of Babylon probably included Cuthah. (Tel Ibrahim), which once had kings of its own, and possessed a special legend of the Creation. Belonging to Babylon, also, was the renowned city Borsippa, now Birs, or the Birs Nimroud, the traditional site of the Tower of Babel.<P>See <a href="./study/isbe/search.html?string=BABEL,+TOWER+OF">BABEL, TOWER OF</A>.<P>(4) Nippur:<P>Some distance Southeast of Babylon lay Nippur or Niffur, now Niffer (Noufar), identified by the rabbis with the "Calneh" of <a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>. It was a place of considerable importance, and the seat of the worship of Enlil and Ninlil, later, also, of their son Ninip and his spouse (see <a href="./study/isbe/search.html?string=CALNEH">CALNEH</A>). The American excavations on this site have thrown a flood of light upon almost every branch of Assyriological research.<P>(5) Adab:<P>Adab, now called Bismaya, the city of Mah, the goddess of reproduction. One of the earliest rulers of Adab was seemingly called Lugal-dalu, of whom a fine statue, discovered by the American explorers, exists. It was apparently renowned as a necropolis.<P>(6) Surippak:<P>South and a little west of Adab was Surippak, now Fara. This was the birthplace of the Babylonian Noah, Ut-napistim, son of Opartes (Umbara-Tutu), a Chaldean of Larancha. The coming of the Flood was revealed to Ut-napistim here.<P>(7) Umma:<P>Practically east of Fara lay Umma or Gisuh (or Giuh), now Jokha. This city was apparently of considerable importance, and the traditional rival of Lagas.<P>(8) Erech:<P>South of Fara lay Unuga, Semitic Uruk, the Biblical <a href="./study/isbe/search.html?string=ERECH">ERECH</a> (which see), now Warka. Its most celebrated king, after Gilgames, was Lugal-zaggi-si, one of the opponents of the rulers of Lagas.<P>(9) Lagas:<P>Some distance east of Warka was the territory of Lagas, now Tel-loh—a little state, rather in accessible, but of considerable importance to the antiquarian, which is a testimonial to the advance in civilization which it had made. Its kings and viceroys were among the most renowned, though apparently unknown outside their own domains. The most celebrated were the reformer Uru-ka-gina and viceroy Gudea, to whom many erections in the city were due. (See Gudea\'s remarkable statue in the Louvre.)<P>(10) Larsa:<P>Somewhat to the Southeast of Warka lay Larsa, the "Ellasar" of <a onClick="return mV(\'Gen\',14,1);">Ge 14:1</a> (which see). This center of learning maintained its independence even after the other states had been absorbed by Hammurabi and his dynasty into the Babylonian empire.<P>(11) Ur:<P>To the Southeast of Warka and Senqara lies the site of the ancient <a href="./study/isbe/search.html?string=UR+OF+THE+CHALDEES">UR OF THE CHALDEES</A> (which see) now Mugheir. It was renowned for its temple to the moon, and for the kings known as the dynasty of Ur: Sur-Engur, Dungi, Bur-Sin, Gimil-Sin, and Ibi-Sin.<P>(12) Eridu:<P>South of the Ur lay Eridu, or, in full, Guruduga, "the good city," wherein, apparently, lay the earthly Paradise. This is identified with the present \'Abu-shahrein, and was the seat of Ea or Enki, god of the sea and of fertilizing streams. According to the tradition, it was there that the "dark vine" grew—a type, seemingly, of the tree of life. The later kings of Babylon sometimes bear the title "king of Eridu," as though rulers of the domain of Paradise.<P>(13) The Land of the Sea:<P>The Land of the Sea (that bordering on the Persian Gulf), in which, seemingly, the Chaldeans afterward settled, seems to have played an important part in the early history of Shinar. Berosus speaks of its king Ammenon, who reigned 12 sari, or 43,200 years, and in whose time the Musarus Oannes, or Annedotus, arose out of the Persian Gulf. Like others referred to in the legends which Berosus refers to, he was half-man and half-fish. It is thought that these incidents, though evidently mythical, point to the introduction of civilization into Babylonia, from this point.<P>See also <a href="./study/isbe/search.html?string=JONAH">JONAH</a>; <a href="./study/isbe/search.html?string=JONAH,+THE+BOOK+OF">JONAH, THE BOOK OF</A>.<P>(14) Nisin, Isin, or Karrak:<P>Nisin, Isin, or Karrak, seat of the worship of Nin-Karraga, was also an important state governed by its own kings.<P>(15) Upe or Upia (Opis):<P>Upe or Upia, the Greek Opis, apparently obtained renown at a very early date, its kings being given in the great chronological list before those of Kis.<P>(16) Other Well-known Cities:<P>Other well-known cities, possibly state-capitals, were Larak, Greek Laranche; Amarda, one of the centers of the worship of Nergal; Asnunna, a province east of the present Bagdad; Dilmu, now Dailem; Nuru, Ennigi, and Kakra, seemingly centers of the worship of Hadad; Tilmun, at the head of the Persian Gulf, and including the island of Bahrein; the province of Sabu; Seseb or Bagdadu, possibly the modern Bagdad; and several others.<P>10. Shinar and Its Climate:<P>Whether the country was in the same seemingly uncared-for state in ancient times as at present is unknown; but one cannot help admiring the courage of the original immigrants into such a district, for example, as that of Lagas. This, which belongs to the southern region, is very inaccessible on account of the watercourses and marshes. Like the whole of Shinar in general, it is more or less dried up in summer, and unhealthy for Europeans. The alterations in the waterways, owing to changes in the irrigation-channels, must then, as now, have hindered communication. Sharp cold, with frost, succeeds the heat of summer, and from time to time sand-storms sweep across the plain. Notwithstanding the destruction sometimes wrought, the floods were always welcomed in consequence of the fruitfulness which followed, and which was such as to make Babylonia one of the most fertile tracts known.<P>11. Sculpture in Shinar:<P>The reference to the Sumerian sculptures in (7) above will have shown that the inhabitants of the Plain of Shinar possessed an art of no mean order and of some antiquity, even at the time when it first presents itself to our notice. It is true that many specimens are crude and uncouth, but this is probably due to the sculptors having been, often enough, the slaves of their material. Their stones were frequently more or less pebble-shaped, and they had neither the skill nor the tools to reduce them to better proportions—moreover, reduction of bulk would have meant a diminution of their importance. The broad, squat figures which they produced, however, gave them bad models for their bas-reliefs, and it was long ere this defect was removed, notwithstanding the superior work produced by their seal-engravers during and after the 4th millennium BC.<P>12. The First Nation to Use Writing in Western Asia:<P>But in all probability special renown will always be attached to the non-Semitic inhabitants of Shinar as the inventors, or at least the earliest users known to us, of the cuneiform script. It may be objected that the system which they introduced was cumbersome and imperfect, but they knew of nothing simpler, and modern Chinese, with which their script has been compared, is far less practical. Briefly, the system may be described as syllabic for the prefixes and suffixes, and ideographic for the roots. To show this the following transcribed example will probably suffice:<P>13. The System Employed, with an Example:<P>E nu-DU URU nu-DIM, A house was not built, a city was not constructed;<P>URU nu-DIM ADAM nu-mun-GAR, A city was not constructed, a community he had not founded;<P>ABZU nu-DU GURUDUGA nu-DIM, The abyss was not built, Eridu was not constructed;<P>E AZAGA DINGIRene KI-DURA-bi nu-DIM, The holy house of the gods, its seat was not constructed;<P>Su-NIGIN KURKURAgi AABBAama, The whole of the lands was sea.<P>The nominal and verbal roots of the above extract from the bilingual account of the Creation are in capitals, and the pronominal prefixes and suffixes, with a couple of lengthenings which determine the pronunciations of the nouns, in small letters. This will not only give an idea of the poetical form of the Sumerian legend of the Creation by Merodach and Aruru, but also show how short and concise, as a language, was the speech of Shinar, before Semitic supremacy.``136';
isbe[8079]='Shine`shin: The Hebrew words \'ahal, \'or, halal, zahar, zarach, yapha\', naghah, \'ashath and qaran are all translated "shine." All indicate either the direct or indirect diffusion of beams of light. In a direct and literal sense the word "shine" is used of the heavenly bodies, or of candles, and fire (<a onClick="return mV(\'Job\',18,5);">Job 18:5</a>; <a onClick="return mV(\'Job\',25,5);">25:5</a> the King James Version; <a onClick="return mV(\'Job\',29,3);">Job 29:3</a>; <a onClick="return mV(\'Job\',31,26);">31:26</a>; <a onClick="return mV(\'2Ki\',3,22);">2Ki 3:22</a>). In a figurative sense it is used of reflected light or brightness, in any sense (<a onClick="return mV(\'Exd\',34,29);">Ex 34:29</a>f; <a onClick="return mV(\'Exd\',35,\'1-\');">35</a>; <a onClick="return mV(\'Isa\',60,1);">Isa 60:1</a>; <a onClick="return mV(\'Eze\',43,2);">Eze 43:2</a>; <a onClick="return mV(\'Dan\',12,3);">Da 12:3</a>). God as the sun of righteousness is thus depicted in <a onClick="return mV(\'Psa\',50,2);">Ps 50:2</a>. The New Testament words astrapto, augazo, lampo and phaino are translated "shine." Thus literally it is said of the lightning that it shines (<a onClick="return mV(\'Mat\',24,27);">Mt 24:27</a> the King James Version; <a onClick="return mV(\'Luk\',17,24);">Lu 17:24</a>); the word is tropically applied to the life of faith or to men prominent in the kingdom of God (<a onClick="return mV(\'Mat\',5,16);">Mt 5:16</a>; <a onClick="return mV(\'Jhn\',5,35);">Joh 5:35</a>; <a onClick="return mV(\'2Cr\',4,6);">2Co 4:6</a>; <a onClick="return mV(\'Phl\',2,15);">Php 2:15</a>; <a onClick="return mV(\'2Pe\',1,19);">2Pe 1:19</a>); to the glory of God (<a onClick="return mV(\'Luk\',2,9);">Lu 2:9</a>); to angelic appearances (<a onClick="return mV(\'Luk\',24,4);">Lu 24:4</a>; <a onClick="return mV(\'Act\',12,7);">Ac 12:7</a>), or to Christ as He appeared to John on Patmos (<a onClick="return mV(\'Rev\',1,16);">Re 1:16</a>).``42';
isbe[8080]='Shion`shi\'-on (shi\'on; Codex Vaticanus Siona, Codex Alexandrinus Seian): A town in the territory of Issachar, named with Shunem, Hapharaim and Anaharath (<a onClick="return mV(\'Jos\',19,19);">Jos 19:19</a>). It is possibly identical with Khirbet Sha\'in, near \'Ain esh-Sha\'in, circa 4 miles northwest of Mt. Tabor.``1';
isbe[8081]='Shiphi`shi\'fi (shiph\'i; Codex Vaticanus Saphal, Codex Alexandrinus Sephein, Lucian, Sophei): A Simeonite prince (<a onClick="return mV(\'1Ch\',4,37);">1Ch 4:37 (Hebrew 36)</a>).``1';
isbe[8082]='Shiphmite`shif\'-mit.`<a href="./study/isbe/search.html?string=SHEPHAM">SHEPHAM</a>; <a href="./study/isbe/search.html?string=SIPHMOTH">SIPHMOTH</a>`1';
isbe[8083]='Shiphrah`shif\'-ra (shiphrah, "fairness," "beauty"; Septuagint Sepphora, the rendering also of tsipporah, in <a onClick="return mV(\'Exd\',2,21);">Ex 2:21</a>): The name of one of the Hebrew midwives (<a onClick="return mV(\'Exd\',1,15);">Ex 1:15</a>).`<a href="./study/isbe/search.html?string=ZIPPORAH">ZIPPORAH</a>`1';
isbe[8084]='Shiphtan`shif\'-tan (shiphtan; Codex Vaticanus Sabatha; Codex Alexandrinus Sabathan, F, Saphatan, Lucian, (S)ephatha): An Ephraimite prince (<a onClick="return mV(\'Num\',34,24);">Nu 34:24</a>).``1';

isbe[8087]='Ships and Boats`<B>I. THE HEBREWS AND THE SEA</B><P><B>II. SHIPS IN THE OLD TESTAMENT AND THE APOCRYPHA</B><P class="in15">1. Among the Hebrews<P class="in30">(1) In Early Times<P class="in30">(2) During the Monarchy<P class="in30">(3) In Later Times<P class="in15">2. Among Neighboring Nations<P class="in30">(1) Egypt<P class="in30">(2) Assyria and Babylonia<P class="in30">(3) Phoenicia<P class="in15">3. General References<P><b>III. SHIPS IN THE NEW TESTAMENT</B><P class="in15">1. In the Gospels<P class="in15">2. In the Acts of the Apostles<P class="in15">3. In Other Books<P><b>LITERATURE</b><hr /><P>In the Old Testament the following words are found:<P>(1) The word most commonly used in Hebrew for "a ship" is \'oniyah (<a onClick="return mV(\'Pro\',30,19);">Pr 30:19</a>; <a onClick="return mV(\'Jon\',1,3,4);">Jon 1:3,4</a>), of which the plural \'oniyoth is found most frequently (<a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a>; <a onClick="return mV(\'1Ki\',22,48);">1Ki 22:48</a>f; and many other places).<P>The collective term for "a navy of ships" is \'oni (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>f; <a onClick="return mV(\'1Ki\',10,22);">10:22</a>, \'oni Tharshish, "a navy (of ships) of Tarshish"; but <a onClick="return mV(\'Isa\',33,21);">Isa 33:21</a>, \'oni shayit, a "galley with oars").<P>(2) tsi (<a onClick="return mV(\'Num\',24,24);">Nu 24:24</a>; <a onClick="return mV(\'Eze\',30,9);">Eze 30:9</a>; <a onClick="return mV(\'Isa\',33,21);">Isa 33:21</a>), tsi \'addir, "gallant ship"; <a onClick="return mV(\'Dan\',11,30);">Da 11:30</a>, tsiyim Kittim, "ships of Kittim.\'<P>(3) cephinah, "innermost parts of the ship" the Revised Version (British and American), "sides of the ship" the King James Version (<a onClick="return mV(\'Jon\',1,5);">Jon 1:5</a>, the only place where the word is found).<P>In Apocrypha ploion, is the usual word (<span class="noTag">The Wisdom of Solomon 14:1</span>; Ecclesiasticus 33:2, etc.), translated "vessel" in <span class="noTag">The Wisdom of Solomon 14:1</span>, but "ship" elsewhere. For "ship" The <span class="noTag">Wisdom of Solomon 5:10</span> has naus. "Boat" in 2Macc 12:3,6 is for skaphos, and "navy" in 1Macc 1:17; 2Macc 12:9; 14:1 for stolos. In The <span class="noTag">Wisdom of Solomon 14:6</span> Noah\'s ark is called a schedia, a "clumsy ship" (the literal translation "raft" in the Revised Version (British and American) is impossible).<P>In the New Testament there are four words in use:<P>(1) naus (<a onClick="return mV(\'Act\',27,41);">Ac 27:41</a>, the only place where it occurs, designating the large sea-going vessel in which Paul suffered shipwreck).<P>(2) ploiarion, "a little boat" (<a onClick="return mV(\'Mar\',3,9);">Mr 3:9</a> and two other places, <a onClick="return mV(\'Jhn\',6,22);">Joh 6:22</a>ff; <a onClick="return mV(\'Jhn\',21,8);">21:8</a>).<P>(3) ploion, "boat" (<a onClick="return mV(\'Mat\',4,21,22);">Mt 4:21,22</a> and many other places in the Gospels—the ordinary fishingboat of the Sea of Galilee rendered "boat" uniformly in the Revised Version (British and American) instead of "ship" the King James Version), "ship" (<a onClick="return mV(\'Act\',20,13);">Ac 20:13</a>, and all other places where the ship carrying Paul is mentioned, except <a onClick="return mV(\'Act\',27,41);">Ac 27:41</a>, as above). In <a onClick="return mV(\'Jam\',3,4);">Jas 3:4</a>; <a onClick="return mV(\'Rev\',8,9);">Re 8:9</a>; <a onClick="return mV(\'Rev\',18,17);">18:17</a>ff, it is rendered "ship."<P>(4) skaphe, "boat" (<a onClick="return mV(\'Act\',27,16,30,32);">Ac 27:16,30,32</a>, where it means the small boat of the ship in which Paul was being conveyed as a prisoner to Rome).<P>Cognate expressions are: "shipmen," \'anshe \'oniyoth (<a onClick="return mV(\'1Ki\',9,27);">1Ki 9:27</a>); nautai (<a onClick="return mV(\'Act\',27,27.30);">Ac 27:27,30</a> the King James Version, "sailors" the Revised Version (British and American)); "mariners," mallachim (<a onClick="return mV(\'Jon\',1,15);">Jon 1:15</a>; <a onClick="return mV(\'Eze\',27,9,27,29);">Eze 27:9,27,29</a>), shatim (<a onClick="return mV(\'Eze\',27,8);">Eze 27:8</a> the King James Version, "rowers" the Revised Version (British and American); <a onClick="return mV(\'Eze\',27,26);">Eze 27:26</a>, the King James Version and the Revised Version (British and American)); "pilot," chobhel (<a onClick="return mV(\'Jon\',1,6);">Jon 1:6</a>; <a onClick="return mV(\'Eze\',27,8,27,28,29);">Eze 27:8,27,28,29</a>); "sailing," "voyage," plous (<a onClick="return mV(\'Act\',21,7);">Ac 21:7</a>; <a onClick="return mV(\'Act\',27,9,10);">27:9,10</a>, the Revised Version (British and American) "voyage" in all verses).<P>I. The Hebrews and the Sea.<P>The Hebrews were a pastoral and agricultural people, and had no inducements to follow a seafaring life. They were possessed of a considerable seaboard along the Mediterranean, but the character of their coast gave little encouragement to navigation. The coast line of the land of Israel from Carmel southward had no bays and no estuaries or river-mouths to offer shelter from storm or to be havens of ships. Solomon landed his timber and other materials for the Temple at Joppa, and tradition has handed down what is called "Solomon\'s Harbor" there. The builders of the second temple also got timber from Lebanon and conveyed it to Joppa. It was Simon Maccabeus, however, who built its harbor, and the harbor at Joppa was "the first and only harbor of the Jews" (G. A. Smith, HGHL, 136). Caesarea in New Testament times was a place of shipping and possessed a harbor which Josephus declared to be greater than the Piraeus, but it was Herodian and more Greek and Roman than Jewish. It was mostly inhabited by Greeks (Josephus, BJ, III, ix, 1). Now Caesarea has disappeared; and Joppa has only an open roadstead where vessels lie without shelter, and receive and discharge cargo and passengers by means of boats plying between them and the shore. It was in other directions that Israel made acquaintance with the activities of the sea. Of internal navigation, beyond the fishing-boats on the Sea of Galilee which belong exclusively to the New Testament, the ferry boat on the Jordan (<a onClick="return mV(\'2Sa\',19,18);">2Sa 19:18</a>, \'abharah) alone receives notice, and even that is not perfectly clear (the Revised Version margin "convoy," but a "ford" is doubtless meant). It is from Tyre and Egypt and even Assyria and Babylonia, rather than from their own waters, that the Hebrew prophets and psalmists drew their pictures of seafaring life.<P>II. Ships in the Old Testament and Apocrypha.<P>1. Among the Hebrews:<P>(1) In Early Times.<P>In the early books of the Old Testament there are references connecting certain of the tribes, and these northern tribes, with the activities of the sea. In the "Blessing of Jacob" and in the "Blessing of Moses" Zebulun and Issachar are so connected (<a onClick="return mV(\'Gen\',49,13);">Ge 49:13</a>; <a onClick="return mV(\'Deu\',33,19);">De 33:19</a>); and in Deborah\'s Song, which is acknowledged to be a very early fragment of Hebrew literature, Dan and Asher are also spoken of as connected with the life and work of the sea (<a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a>). The Oracle of Balaam (<a onClick="return mV(\'Num\',24,24);">Nu 24:24</a>) looks forward to a day when a fleet from Kittim should take the sea for the destruction of Assyria. "Ships of Kittim" are mentioned in Daniel (<a onClick="return mV(\'Dan\',11,30);">11:30</a>). Kittim is referred to in the three greater Prophets (<a onClick="return mV(\'Isa\',23,1,12);">Isa 23:1,12</a>; <a onClick="return mV(\'Jer\',2,10);">Jer 2:10</a>; <a onClick="return mV(\'Eze\',27,6);">Eze 27:6</a>). The land of Kittim is Cyprus, and in the references in Isaiah it is associated with Tyre and the ships of Tarshish.<P>(2) During the Monarchy.<P>It is not till the time of the monarchy that the Hebrews begin to figure as a commercial people. Already in the time of David commercial relations had been established between Israel and Tyre (<a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>f). The friendly cooperation was continued by Solomon, who availed himself not only of the cedar and the fir at Hiram\'s command on Lebanon, but also of the skilled service of Hiram\'s men to bring the timber from the mountains to the sea. Hiram also undertook to make the cedar and the fir into rafts (<a onClick="return mV(\'1Ki\',5,9);">1Ki 5:9</a>, dobheroth, the King James Version "floats"; <a onClick="return mV(\'2Ch\',2,16);">2Ch 2:16</a>, raphcodhoth, "flotes" the King James Version, "floats" the Revised Version (British and American)) to go by sea and to deliver them to Solomon\'s men at the place appointed, which the Chronicler tells us was Joppa. From this cooperation in the building of the Temple there grew up a larger connection in the pursuit of sea-borne commerce. It was at Ezion-geber near to Eloth on the Red Sea, in the land of Edom which David had conquered, that Solomon built his fleet, "a navy of ships" (<a onClick="return mV(\'1Ki\',9,\'26-28\');">1Ki 9:26-28</a>). Hiram joined Solomon in these enterprises which had their center on the Red Sea, and thus the Phoenicians had water communication with the coasts of Arabia and Africa, and even of India. The same partnership existed for the commerce of the West. "For the king (Solomon) had at sea a navy of Tarshish with the navy of Hiram: once every three years came the navy of Tarshish, bringing gold, and silver, ivory, and apes, and peacocks" (<a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a>).<P>Tarshish is the name of the Phoenician colony on the river Tartessus, called also Baetis, the modern Guadalquivir. It was the farthest limit of the western world as known to the Hebrews. Attempts have been made to identify it with Tarsus of Cilicia, but they are not convincing. It is conceived of in Hebrew literature as remote (<a onClick="return mV(\'Isa\',66,19);">Isa 66:19</a>; <a onClick="return mV(\'Jon\',1,3);">Jon 1:3</a>; <a onClick="return mV(\'Jon\',4,2);">4:2</a>), as rich (<a onClick="return mV(\'Psa\',72,10);">Ps 72:10</a>; <a onClick="return mV(\'Jer\',10,9);">Jer 10:9</a>), as powerful in commerce (<a onClick="return mV(\'Eze\',38,13);">Eze 38:13</a>). Ships of Tarshish were no doubt ships actually built for the Tarshish trade (<a onClick="return mV(\'2Ch\',20,36);">2Ch 20:36</a>f; <a onClick="return mV(\'Jon\',1,3);">Jon 1:3</a>), but the expression became a general designation for large sea-going vessels to any quarter. Ships of Tarshish made a deep impression upon the imagination of the Hebrew people. The Psalmist takes it as a proof of the power of Yahweh that He breaks the ships of Tarshish with an east wind (<a onClick="return mV(\'Psa\',48,7);">Ps 48:7</a>). Isaiah includes them among the great and lofty objects of power and glory which the terror of the Lord would certainly overtake (<a onClick="return mV(\'Isa\',2,16);">Isa 2:16</a>). Ezekiel regards them as the caravans that bore the merchandise of the mistress of the sea (<a onClick="return mV(\'Eze\',27,25);">Eze 27:25</a>). It is in ships of Tarshish that the prophet of the Return sees the exiles borne in crowds to Jerusalem as their natural home (<a onClick="return mV(\'Isa\',60,9);">Isa 60:9</a>).<P>From Solomon\'s time onward the kings of Judah retained their hold upon Eloth (<a onClick="return mV(\'1Ki\',22,48);">1Ki 22:48</a>f; <a onClick="return mV(\'2Ch\',20,\'35-37\');">2Ch 20:35-37</a>) till it was seized by the Syrians in the days of Ahaz (<a onClick="return mV(\'2Ki\',16,6);">2Ki 16:6</a>).<P>(3) In Later Times.<P>As Solomon had the cooperation of Hiram in securing material and craftsmen for the building of the first Temple, so Joshua and Zerubbabel by the favor of Cyrus obtained timber from Lebanon, and masons and carpenters from Sidon and Tyre for the building of the second. Again, cedar trees were brought from Lebanon by sea to Joppa, and thence conveyed to Jerusalem (<a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>).<P>From Joppa Jonah fled to avoid compliance with God\'s command to go to Nineveh and preach repentance there (<a onClick="return mV(\'Jon\',1,1);">Jon 1:1</a>). He found a ship bound for Tarshish as far toward the west as Nineveh to the east. The fare (cakhar) paid by him as a passenger, the hold of the ship in which he stowed himself away (cephinah), the crew (mallachim) the captain or shipmaster (rabh ha-chobhel), the storm, the angry sea, the terrified mariners and their cry to their gods, and the casting of Jonah overboard to appease the raging waters—all make a lifelike picture.<P>It was in the time of Simon, the last survivor of the Maccabean brothers, that Joppa became a seaport with a harbor for shipping—"Amid all his glory he took Joppa for a haven, and made it an entrance for the isles of the sea" (1Macc 14:5). When Simon reared his monument over the sepulcher of his father and brothers at Modin, he set up seven pyramids with pillars, upon which were carved figures of ships to be "seen of all that sail on the sea" (1Macc 13:29). About this period we hear of ships in naval warfare. When Antiochus IV Epiphanes planned his expedition against Egypt, he had with other armaments "a great navy," presumably ships of war (1Macc 1:17); and at a later time Antiochus VII speaks expressly of "ships of war" (1Macc 15:3).<P>2. Among Neighboring Nations:<P>(1) Egypt.<P>The Egyptians, like other nations of antiquity, had a great horror of the open sea, although they were expert enough in managing their craft upon the Nile. Pharaoh-necoh built up a powerful navy to serve him both in commerce and in war.<P>See <a href="./study/isbe/search.html?string=PHARAOH-NECOH">PHARAOH-NECOH</a>.<P>Of explicit references to Egyptian ships in the Old Testament there are but few. Isaiah speaks of "vessels of papyrus upon the waters" of the Upper Nile, on board of which are the messengers of Cush or Ethiopia returning to tell the tidings of the overthrow of Assyria to the inhabitants of those remote lands (<a onClick="return mV(\'Isa\',18,2);">18:2</a> the King James Version has "bulrushes" instead of "papyrus"). Ezekiel also, foretelling the overthrow of Egypt, speaks of messengers traveling with the news on swift Nile boats to strike terror into the hearts of the "careless Ethiopians" (<a onClick="return mV(\'Eze\',30,9);">30:9</a>). When Job compares his days to "the swift ships" ("the ships of reed" the Revised Version margin), the allusion is most likely to Egypt\'s, these being skiffs with a wooden keel and the rest of bulrushes, sufficient to carry one person, or at most two, and light, to travel swiftly (<a onClick="return mV(\'Job\',9,26);">9:26</A>).<P>(2) Assyria and Babylonia.<P>The Assyrians and Babylonians were mainly an inland people, but their rivers gave them considerable scope for navigation. The Assyrian monuments contain representations of naval engagements and of operations on the seacoast. When Isaiah pictures Yahweh as a better defense of Judah than the rivers and streams of Assyria and Egypt are to their people he says, "There Yahweh will be with us in majesty, a place of broad rivers and streams, wherein shall go no galley with oars (\'oni shayit), neither shall gallant ship (tsi \'addir) pass thereby....Thy tacklings (ropes, cables) are loosed; they could not strengthen the foot of their mast, they could not spread the sail" (<a onClick="return mV(\'Isa\',33,21,23);">Isa 33:21,23</a>). Speaking of Yahweh\'s wonders to be performed toward His people after Babylon had been overthrown, the prophet declares: "Thus saith Yahweh, your Redeemer, the Holy One of Israel: For your sake I have sent to Babylon, and I will bring down all of them as fugitives, even the Chaldeans, in the ships of their rejoicing" (<a onClick="return mV(\'Isa\',43,14);">Isa 43:14</a>). In this case, however, the ships are not war ships, but more probably merchant ships, or ships for pleasure, sailing in the Euphrates.<P>(3) Phoenicia.<P>It was from the Phoenicians that the Mediterranean peoples learned seamanship and skill in navigation. It is fitting, therefore, that in his dirge over the downfall of the mistress of the sea, Ezekiel should represent Tyre as a gallant ship, well built, well furnished, and well manned, broken by the seas in the depths of the waters, fallen into the heart of the seas in the day of her ruin. Ezekiel\'s description (chapter <a onClick="return mV(\'Eze\',27,\'1-\');">27</A>, with Davidson\'s notes) brings together more of the features of the ship of antiquity than any other that has come down to us. Her builders have made her perfect in beauty with planks of fir or cypress, mast of cedar, oars of the oak of Bashan, benches or deck of ivory inlaid with boxwood, sail of fine linen with broidered work from Egypt, and an awning of blue and purple from the coastlands of Elisha (possibly Sicily). She is manned with oarsmen of Sidon and Arvad, pilots of the wise men of Tyre, calkers from Gebal to stop up the cracks and seams in her timbers, mariners and men of war from other lands who enhanced her beauty by hanging up the shield and helmet within her. She is freighted with the most varied cargo, the produce of the lands around, her customers, or as they are called, her traffickers, being Tarshish in the far west, Sheba and Arabia in the south, Haran and Asshur in the east, Javan, which is Greece, and Togarmah, which is Armenia, in the north. One or two of the particulars of this description may be commented upon.<P>(a) As regards rigging, the Phoenician ships of the time of Ezekiel, as seen in Assyrian representations, had one mast with one yard and carried a square sail. Egyptian ships on the Red Sea about the time of the Exodus, from reliefs of the XIXth Dynasty, had one mast and two yards, and carried also one large square sail. The masts and yards were made of fir, or of pine, and the sails of linen, but the fiber of papyrus was employed as well as flax in the manufacture of sail-cloth. The sail had also to serve "for an ensign" (lenes, <a onClick="return mV(\'Eze\',27,7);">Eze 27:7</a>). "The flag proper," says Davidson (ad loc.), "seems not to have been used in ancient navigation; its purpose was served by the sail, as for example at the battle of Actium the ship of Antony was distinguished by its purple sail."<P>(b) As regards the crew, in the two-banked Phoenician ship the rowers of the first bank work their oars over the gunwale, and those of the second through portholes lower down, so that each may have free play for his oar. The calkers were those who filled up seams or cracks in the timbers with tow and covered them over with tar or wax, after the manner of the instruction given to Noah regarding the Ark: "Thou...shalt pitch it within and without with pitch" (<a onClick="return mV(\'Gen\',6,14);">Ge 6:14</a>).<P>(c) As regards cargo, it is to be noted that "the persons of men," that is, slaves, formed an article of merchandise in which Javan, Tubal, and Meshech, countries to the north, traded with Tyre.<P>3. General References:<P>Of general references to shipping and seafaring life there are comparatively few in the Old Testament. In his great series of Nature-pictures in <a onClick="return mV(\'Psa\',104,\'1-\');">Ps 104</a>, the Psalmist finds a place for the sea and ships (<a onClick="return mV(\'Psa\',104,25);">104:25</a>ff), and in <a onClick="return mV(\'Psa\',107,\'1-\');">Ps 107</a> there is a picture of the storm overtaking them that go down to the sea in ships, and of the deliverance that comes to them when God "bringeth" them into their desired haven" (<a onClick="return mV(\'Psa\',104,23);">107:23</A>ff). In the Book of Proverbs the ideal woman who brings her food from far is like "the merchant ships" (<a onClick="return mV(\'Pro\',31,14);">31:14</a>). In the same book the drunkard, because of his unnatural insensibility to danger, is likened to a man "that lieth down in the midst of the sea, or as he that lieth upon the top of a mast" (<a onClick="return mV(\'Pro\',23,34);">23:34</A>); and among the inscrutable things of the world the writer includes "the way of a ship in the midst of the sea" (<a onClick="return mV(\'Pro\',30,19);">30:19</A>). In Wisdom, human life is described "as a ship passing through the billowy water, whereof, when it is gone by, there is no trace to be found, neither pathway of its keel in the billows" (Wisd 5:10). The same book notes it as a striking example of the case of a divine and beneficent Providence that "men entrust their lives to a little piece of wood, and passing through the surge on a raft are brought safe to land" (Wisd 14:1-5). The Jews like the Egyptians and the Assyrians had a natural shrinking from the sea, and Ecclesiasticus interprets their feeling when he says: "They that sail on the sea tell of the danger thereof; and when we hear it with our ears, we marvel" (43:24).<P>III. Ships in the New Testament.<P>1. In the Gospels:<P>It is the fishing-boats of the Sea of Galilee which exclusively occupy attention in the Gospels. In the time of our Lord\'s ministry in Galilee the shores of the sea were densely peopled, and there must have been many boats engaged in the fishing industry. Bethsaida at the northern end of the Lake and Tarichea at the southern end were great centers of the trade. The boats were probably of a size and build similar to the few employed on the Lake today, which are between 20 and 30 ft. in length and 7 ft. in breadth. The word "launch," of putting a boat or a ship into the sea, has disappeared from the Revised Version (British and American), except in <a onClick="return mV(\'Luk\',8,22);">Lu 8:22</a>, where it is more appropriate to an inland lake. They were propelled by oars, but no doubt also made use of the sail when the wind was favorable (<a onClick="return mV(\'Luk\',8,23);">Lu 8:23</a>), though the pictures which we have in the Gospels are mostly of the boatmen toiling in rowing in the teeth of a gale (<a onClick="return mV(\'Mar\',6,48);">Mr 6:48</a>), and struggling with the threatening waves (<a onClick="return mV(\'Mat\',14,24);">Mt 14:24</a>). In the boat on which Jesus and the disciples were crossing the Lake after the feeding of the 5,000, Jesus was in the stern "asleep on the cushion" (<a onClick="return mV(\'Mar\',4,38);">Mr 4:38</a>, the King James Version "a pillow"; Greek proskephalaion, "headrest"). More than once Jesus made special use of a boat. As He was by the seashore a great concourse of people from all parts made it desirable that "a small boat" (ploiarion) should be in attendance off the shore to receive Him in case of need, though He does not seem to have required it (<a onClick="return mV(\'Mar\',3,9);">Mr 3:9</a>). On another occasion, when the crowds were still greater, He went into a boat and sat "in the sea" with the multitude on the sloping beach before Him (<a onClick="return mV(\'Mar\',4,1);">Mr 4:1</a>; <a onClick="return mV(\'Luk\',5,3);">Lu 5:3</a>). This boat is said in Luke\'s narrative to have been Simon\'s, and it seems from references to it as "the boat" on other occasions to have been generally at the disposal of Jesus.<P>2. In the Acts of the Apostles:<P>It is Paul\'s voyages which yield us the knowledge that we possess from Biblical sources of ships in New Testament times. They are recorded for us in the Acts by Luke, who, as Sir William Ramsay puts it, had the true Greek feeling for the sea (St. Paul the Traveler, 21). In Luke\'s writings there are many nautical terms, peculiar to him, used with great exactitude and precision.<P>When Paul had appealed to Caesar and was proceeding to Rome in charge of Julius, the centurion, along with other prisoners, a ship of Adramyttium, a coasting vessel, carried the party from Caesarea along the Syrian coast, northward of Cyprus, past Cilicia and Pamphylia, to Myra of Lycia. There the centurion found a ship of Alexandria sailing for Italy, one of the great corn fleet carrying grain from Egypt for the multitudes of Rome. (After the capture of Jerusalem the emperor Titus returned to Italy in such a vessel, touching at Rhegium and landing at Puteoil.) The size of the vessel is indicated by the fact that there were 276 persons on board, crew and passengers all told (<a onClick="return mV(\'Act\',27,37);">Ac 27:37</a>). Luke has made no note of the name of this or of the previous vessels in which Paul had voyaged. Of the presumably larger vessel, also an Alexandrian corn ship bound for Rome, which had wintered in Melita, and which afterward took on board the shipwrecked party (<a onClick="return mV(\'Act\',28,11);">Ac 28:11</a>), "the sign" (parasemon) is given, and she is called "The Twin Brothers." The expression shows that it was in painting or relief; a figurehead, with the Twin Brothers represented, would be given by episemon. The cargo (phortion, <a onClick="return mV(\'Act\',27,10);">Ac 27:10</a>, the King James Version and the Revised Version (British and American) "lading") in this case was wheat (<a onClick="return mV(\'Act\',27,38);">Ac 27:38</a>), but another word is used, gomos, by Luke of a ship\'s load of varied wares (<a onClick="return mV(\'Act\',21,3);">Ac 21:3</a>; compare <a onClick="return mV(\'Rev\',18,11);">Re 18:11</a>).<P>Of those engaged in handling the ship we find (<a onClick="return mV(\'Act\',27,11);">Ac 27:11</a>) the master (kubernetes), the owner (naukleros, although this expression seems not quite consistent with the ownership of a grain ship of the imperial service, and Ramsay\'s distinction between the words, making the former "sailing-master" and the latter "captain," may be better), the sailors (<a onClick="return mV(\'Act\',27,30);">Ac 27:30</a>, who treacherously sought to lower the ship\'s boat on the pretense of laying out anchors from the "foreship" or prow, and to get away from the doomed vessel).<P>Of operations belonging to the navigation of the vessel in the storm there were<P>(1) the taking on board of the ship\'s boat and securing it with ropes (<a onClick="return mV(\'Act\',27,16);">Ac 27:16</a>, in which operation Luke seems to have taken part; compare <a onClick="return mV(\'Act\',27,32);">Ac 27:32</a>),<P>(2) the undergirding of the ship (<a onClick="return mV(\'Act\',27,17);">Ac 27:17</a>, using helps, that is taking measures of relief and adopting the expedient, only resorted to in extremities, of passing cables under the keel of the ship to keep the hull together and to preserve the timbers from starting),<P>(3) the lowering of the gear (<a onClick="return mV(\'Act\',27,17);">Ac 27:17</a>, reducing sail, taking down the mainsail and the main yard),<P>(4) throwing freight overboard and later casting out the tackling of the ship (<a onClick="return mV(\'Act\',27,19);">Ac 27:19</a>),<P>(5) taking soundings (<a onClick="return mV(\'Act\',27,28);">Ac 27:28</a>),<P>(6) letting go four anchors from the stern (<a onClick="return mV(\'Act\',27,29);">Ac 27:29</a>, stern-anchoring being very unusual, but a necessity in the circumstances),<P>(7) further lightening the ship by throwing the wheat into the sea (<a onClick="return mV(\'Act\',27,38);">Ac 27:38</a>),<P>(8) cutting the anchor cables, unlashing the rudders, hoisting up the foresail to the wind, and holding straight for the beach (<a onClick="return mV(\'Act\',27,40);">Ac 27:40</a>).<P>Of the parts of the ship\'s equipment there are mentioned "the sounding lead" (bolis, though it is the verb which is here used), "the anchors" (agkurai, of which every ship carried several, and which at successive periods have been made of stone, iron, lead and perhaps other metals, each having two flukes and being held by a cable or a chain), "the rudders" (pedalia, of which every ship had two for steering, which in this case had been lifted out of the water and secured by "bands" to the side of the ship and unlashed when the critical moment came), "the foresail" artemon, not the mainsail, but the small sail at the bow of the vessel which at the right moment was hoisted to the wind to run her ashore), and "the boat" (skaphe, which had been in tow in the wake of the vessel, according to custom still prevalent in those seas—coasting-vessels being sometimes becalmed, when the crew get into the small boat and take the ship in tow, using the oars to get her round a promontory or into a position more favorable for the wind). The season for navigation in those seas in ancient times was from April to October. During the winter the vessels were laid up, or remained in the shelter of some suitable haven. The reason for this was not simply the tempestuous character of the weather, but the obscuration of the heavens which prevented observations being taken for the steering of the ship (<a onClick="return mV(\'Act\',27,20);">Ac 27:20</a>).<P>3. In Other Books:<P>In <a onClick="return mV(\'2Cr\',11,25);">2Co 11:25</a> Paul mentions among sufferings he had endured for Christ\'s sake that thrice he had suffered shipwreck, and that he had been "a night and a day in the deep," implying that he had been in danger of his life clinging to a spar, or borne upon a hurriedly constructed raft. It may be a reminiscence of the sea when Paul in the very earliest of his Epistles (<a onClick="return mV(\'1Th\',4,16);">1Th 4:16</a>), speaking of the coming of the Lord, says "The Lord himself shall descend from heaven, with a shout" en keleusmati), where the picture is that of the keleustes, giving the time to the rowers on board a ship. Although huperetes, was "an underrower" and huperesia, "the crew of a ship" as contrasted with kubernetes, "the sailing-master," the derived meaning of "servant" or "officer" has lost in the New Testament all trace of its origin (<a onClick="return mV(\'Mat\',5,25);">Mt 5:25</a>; <a onClick="return mV(\'Luk\',1,2);">Lu 1:2</a> and many passages; compare stellein, and sustellein, where the idea of "furling" or "shifting a sail" is entirely lost: <a onClick="return mV(\'1Cr\',7,29);">1Co 7:29</a>; <a onClick="return mV(\'2Cr\',8,20);">2Co 8:20</a>).<P>Figurative:<P>In Hebrews the hope of the gospel is figured as "an anchor...sure and stedfast, and entering into that which is within the veil" (<a onClick="return mV(\'Hbr\',6,19);">6:19</a>, especially with Ebrard\'s note in Alford, at the place). James, showing the power of little things, adduces the ships, large though they be, and driven by fierce winds, turned about by a very small "rudder" (pedalion), as "the impulse of the steersman willeth" (<a onClick="return mV(\'Jam\',3,4);">Jas 3:4</a>). In Revelation there is a representation of the fall of Babylon in language reminiscent of the fall of Tyre (<a onClick="return mV(\'Eze\',27,1);">Eze 27</a>), in which lamentations arise from the merchants of the earth who can no more buy her varied merchandise (ton gomon, "cargo" the Revised Version margin), and shipmasters and passengers and seafaring people look in terror and grief upon the smoke of her burning (<a onClick="return mV(\'Rev\',18,\'12-18\');">Re 18:12-18</a>).<P>LITERATURE.<P>The usual books on Greek and Roman antiquities furnish descriptions and illustrations. Works on the monuments like Layard, Nineveh, II, 379ff; Maspero, Ancient Egypt and Assyria; Ball, Light from the East, and Reissner, Cairo Museum Catalogue, "Models of Ships and Boats," 1913, contain descriptions and figured representations which are instructive. On shipping and navigation in classical antiquity Smith of Jordanhill, Voyage and Shipwreck of Paul, is still the standard authority.``128';
isbe[8088]='Shisha`shi\'-sha (shisha\'): One of Solomon\'s officers of state (<a onClick="return mV(\'1Ki\',4,3);">1Ki 4:3</a>).``1';
isbe[8089]='Shishak`shi\'-shak (shishaq (<a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>); Sousakeim):<P>1. Shishak, 952-930 BC:<P>Sheshonk or Sheshenq I, as he is called on the monuments, the founder of the XXIInd Dynasty, was in all probability of Libyan origin. It is possible that his claim to the throne was that of the sword, but it is more likely that he acquired it by marriage with a princess of the dynasty preceding. On the death of Pasebkhanu II, the last of the kings of the XXIst Dynasty, 952 BC, Shishak ascended the throne, with an efficient army and a well-filled treasury at his command. He was a warlike prince and cherished dreams of Asiatic dominion.<P>2. Patron of Jeroboam:<P>He had not long been seated on the throne when Jeroboam the son of Nebat, of the tribe of Ephraim, whom Solomon had promoted but afterward had cause to suspect, fled from the displeasure of his sovereign to the court of Shishak (<a onClick="return mV(\'1Ki\',11,26);">1Ki 11:26</a>). There Jeroboam remained till the death of Solomon, when he returned to Canaan, and, on Rehoboam\'s returning an unsatisfactory answer to the people\'s demands for relief from their burdens, headed the revolt of the Ten Tribes, over whom he was chosen king with his capital at Shechem (<a onClick="return mV(\'1Ki\',12,25);">1Ki 12:25</a>). Whether there was not in the XXIst Dynasty some kind of suzerainty of Egypt over Palestine, when Solomon married Pharaoh\'s daughter and received with her Gezer as a dowry, seems not to be clearly established. It is, however, natural that Jeroboam\'s patron in the day of adversity should take sides with him against Rehoboam, now that the kingdom was divided. Active support of Jeroboam would be in the line of his dreams of an eastern empire.<P>3. Syrian Campaign:<P>So it came to pass that in the 5th year of Rehoboam, Shishak came up against Jerusalem with 1,200 chariots, and 60,000 horsemen, and people without number out of Egypt, the Libyans, Sukkiim, and Ethiopians, and took the fenced cities of Judah, and came to Jerusalem. At the preaching of the prophet Shemaiah, Rehoboam and his people repented, and Jerusalem was saved from destruction, though not from plunder nor from servitude, for he became Shishak\'s servant (<a onClick="return mV(\'2Ch\',12,8);">2Ch 12:8</a>). Shishak took away the treasures of the house of the Lord and the treasures of the king\'s house, carrying off among the most precious of the spoils all the shields of gold which Solomon had made (<a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>ff; <a onClick="return mV(\'2Ch\',12,\'1-9\');">2Ch 12:1-9</a>). From the Scripture narrative it does not appear that there was any occupation of Palestine by the Egyptian forces on this occasion.<P>4. Shishak\'s Record at Karnak:<P>There is, however, a remarkable contemporary record of the campaign engraved on the south wall of the Temple of Amon at Karnak by Shishak himself. Not only is the expedition recorded, but there is a list of districts and towns of Palestine granted to his victories by Amon-Ra and the goddess of Thebes engraved there. A number of towns mentioned in the Book of Joshua have been identified; and among the names of the list are Rabbath, Taanach, Gibeon, Mahanaim, Beth-horon and other towns both of Israel and Judah. That names of places in the Northern Kingdom are mentioned in the list does not imply that Shishak had directed his armies against Jeroboam and plundered his territories. It was the custom in antiquity for a victorious monarch to include among conquered cities any place that paid tribute or was under subjection, whether captured in war or not; and it was sufficient reason for Shishak to include these Israelite places that Jeroboam, as seems probable, had invited him to come to his aid. Among the names in the list was "Jud-hamalek"—Yudhmalk on the monuments—which was at first believed to represent the king of Judah, with a figure which passed for Rehoboam. Being, however, a place-name, it is now recognized to be the town Yehudah, belonging to the king. On the death of Shishak his successor assumed a nominal suzerainty over the land of Canaan.<P>LITERATURE.<P>Flinders Petrie, History of Egypt, III, 227ff; Maspero, Struggle of the Nations, 772ff; Nicol, Recent Archaeology and the Bible, 222-25.``128';
isbe[8090]='Shitrai`shit\'-ri, shit-ra\'-i, shit\'-ra-i (shitray): A Sharonite, David\'s chief shepherd (<a onClick="return mV(\'1Ch\',27,29);">1Ch 27:29</a>).``1';
isbe[8091]='Shittah; Tree; Shittim Wood`shit\'a, (shittah; Septuagint xulon asepton; the Revised Version (British and American) <a href="./study/isbe/search.html?string=ACACIA+TREE">ACACIA TREE</a> (<a onClick="return mV(\'Isa\',41,19);">Isa 41:19</a>)); (\'ace shittim; the Revised Version (British and American) <a href="./study/isbe/search.html?string=ACACIA+WOOD">ACACIA WOOD</a> (<a onClick="return mV(\'Exd\',25,5,10,13);">Ex 25:5,10,13</a>; <a onClick="return mV(\'Exd\',26,15,26);">26:15,26</a>; <a onClick="return mV(\'Exd\',27,1,6);">27:1,6</a>; <a onClick="return mV(\'Deu\',10,3);">De 10:3</a>)): The word was originally shintah, derived from the Arabic sant, now a name confined to one species of acacia, Acacia nilotica (Natural Order, Leguminosae), but possibly was once a more inclusive term. The Acacia nilotica is at present confined to the Sinaitic peninsula and to Egypt. Closely allied species, the Acacia tortilis and Acacia seyal, both classed together under the Arabic name sayyal, are plentiful in the valleys about the Dead Sea from Engedi southward. Those who have ridden from \'Ain Jidy to Jebel Usdum will never forget these most striking features of the landscape. They are most picturesque trees with their gnarled trunks, sometimes 2 ft. thick, their twisted, thorny branches, which often give the whole tree an umbrella-like form, and their fine bipinnate leaves with minute leaflets. The curiously twisted pods and the masses of gum arabic which exude in many parts are also peculiar features. The trees yield a valuable, hard, close-grained timber, not readily attacked by insects.``117';
isbe[8092]='Shittim`shit\'-im (ha-shittim, "the acacias"; Sattein):<P>(1) This marked the last camping-ground of Israel before they crossed the Jordan to begin the conquest of Western Palestine. Here it was that the people fell into the snare set for them by the satanic counsel of Balaam, who thus brought upon them greater evil than all his prohibited curses could have done (<a onClick="return mV(\'Num\',25,1);">Nu 25:1</a>ff; <a onClick="return mV(\'Num\',31,16);">31:16</a>). In <a onClick="return mV(\'Num\',33,49);">Nu 33:49</a> it is called Abel-shittim. It was from Shittim that Joshua sent the spies to view out the land and Jericho (<a onClick="return mV(\'Jos\',2,1);">Jos 2:1</a>); and from this point the host moved forward to the river (<a onClick="return mV(\'Jos\',3,1);">Jos 3:1</a>). The place is mentioned by Micah in a passage of some difficulty (<a onClick="return mV(\'Jos\',6,5);">Jos 6:5</a>): after "what Balaam the son of Beor answered," perhaps some such phrase as "remember what I did" has fallen out. This would then be a reference to the display of divine power in arresting the flow of Jordan until the host had safely crossed. Josephus places the camp "near Jordan where the city Abila now stands, a place full of palm trees" (Ant., IV, viii, 1). Eusebius, Onomasticon says Shittim was near to Mt. Peor (Fogor). It may possibly be identical with Khirbet el-Kefrain, about 6 miles South of the Jordan, on the lip of Wady Seiseban, where there are many acacias.<P>(2) In <a onClick="return mV(\'Joe\',3,18);">Joe 3:18</a> we read of the valley of Shittim which is to be watered by a fountain coming forth of the house of the Lord. It must therefore be sought on the west of the Jordan. The waters from the Jerusalem district are carried to the Dead Sea down the Wady which continues the Brook Kidron: Wady en-Nar. The acacia is found plentifully in the lower reaches of this valley, which may possibly be intended by the prophet.``54';
isbe[8093]='Shiza`shi\'-za (shiza; Saiza): A Reubenite, one of David\'s leading warriors (<a onClick="return mV(\'1Ch\',11,42);">1Ch 11:42</a>).``1';
isbe[8094]='Shoa`sho\'-a (shoa\'; Soue): A people named in <a onClick="return mV(\'Eze\',23,23);">Eze 23:23</a> in association with Babylonians, Chaldeans and Assyrians. Schrader identifies with the Sutu of the inscriptions (East of the Tigris).``1';
isbe[8095]='Shobab`sho\'-bab (shobhabh; Sobab):<P>(1) One of the sons of David (<a onClick="return mV(\'2Sa\',5,14);">2Sa 5:14</a>; <a onClick="return mV(\'1Ch\',3,5);">1Ch 3:5</a>; <a onClick="return mV(\'1Ch\',14,4);">14:4</a>).<P>(2) A son of Caleb (<a onClick="return mV(\'1Ch\',2,18);">1Ch 2:18</a>).``1';
isbe[8096]='Shobach`sho\'-bak (shobhakh; Sobak): Captain of the Syrian host (<a onClick="return mV(\'2Sa\',10,16,18);">2Sa 10:16,18</a>); but "Shophach" (shophakh) in <a onClick="return mV(\'1Ch\',19,16,18);">1Ch 19:16,18</a>.``1';
isbe[8097]='Shobai`sho\'-bi, sho-ba\'-i, sho\'-ba-i (shobhay; Codex Vaticanus Abaou; Codex Alexandrinus Lucian, Sobai): The head of one of the families which returned from the Babylonian captivity (<a onClick="return mV(\'Ezr\',2,42);">Ezr 2:42</a>; <a onClick="return mV(\'Neh\',7,45);">Ne 7:45</a>).``1';
isbe[8098]='Shobal`sho\'-bal (shobhal, "overflowing"; Sobal, with variants):<P>(1) An Edomite name mentioned in connection with Lotan, Zibeon and Anah, as that of a "son" of Seir (<a onClick="return mV(\'Gen\',36,20);">Ge 36:20</a>), the father of a clan (<a onClick="return mV(\'Gen\',36,23);">Ge 36:23</a>), and a Horite "duke" (\'alluph) (<a onClick="return mV(\'Gen\',36,29);">Ge 36:29</a>; <a onClick="return mV(\'1Ch\',1,38,40);">1Ch 1:38,40</a>).<P>(2) A Calebite, the father (possibly of the inhabitants) of Kiriath-jearim (<a onClick="return mV(\'1Ch\',2,50,52);">1Ch 2:50,52</a>).<P>(3) A Judahite, perhaps to be identified with (2) above (<a onClick="return mV(\'1Ch\',4,1);">1Ch 4:1</a>f).``1';
isbe[8099]='Shobek`sho\'-bek (shobheq; Sobek): One of those who sealed the covenant under Nehemiah after the Babylonian captivity (<a onClick="return mV(\'Neh\',10,24);">Ne 10:24</a>).``1';
isbe[8100]='Shobi`sho\'-bi (shobhi; Ouesbei): One of those who remained faithful to David during the rebellion of Absalom (<a onClick="return mV(\'2Sa\',17,27);">2Sa 17:27</a>).``1';
