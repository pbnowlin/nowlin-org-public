her in his quiet manner of life and (for that reason perhaps) the companion and favorite of his mother, found early the opportunity to obtain Esau\'s sworn renunciation of his right of primogeniture, by taking advantage of his habits, his impulsiveness and his fundamental indifference to the higher things of the family, the things of the future (<a onClick="return mV(\'Gen\',25,32);">Ge 25:32</a>). It was not until long afterward that the companion scene to this first "supplanting" (<a onClick="return mV(\'Gen\',27,36);">Ge 27:36</a>) was enacted. Both sons meanwhile are to be thought of simply as members of Isaac\'s following, during all the period of his successive sojourns in Gerar, the Valley of Gerar and Beersheba (<a onClick="return mV(\'Gen\',26,\'1-\');">Ge 26</a>). Within this period, when the brothers were 40 years of age, occurred Esau\'s marriage with two Hittite women. Jacob, remembering his own mother\'s origin, bided his time to find the woman who should be the mother of his children. The question whether she should be brought to him, as Rebekah was to Isaac, or he should go to find her, was settled at last by a family feud that only his absence could heal. This feud was occasioned by the fraud that Jacob at Rebekah\'s behest practiced upon his father and brother, when these two were minded to nullify the clearly revealed purpose of the oracle (<a onClick="return mV(\'Gen\',25,23);">Ge 25:23</a>) and the sanctions of a solemn oath (<a onClick="return mV(\'Gen\',25,33);">Ge 25:33</a>). Isaac\'s partiality for Esau arose perhaps as much from Esau\'s resemblance to the active, impulsive nature of his mother, as from the sensual gratification afforded Isaac by the savory dishes his son\'s hunting supplied. At any rate, this partiality defeated itself because it overreached itself. The wife, who had learned to be eyes and ears for a husband\'s failing senses, detected the secret scheme, counterplotted with as much skill as unscrupulousness, and while she obtained the paternal blessing for her favorite son, fell nevertheless under the painful necessity of choosing between losing him through his brother\'s revenge or losing him by absence from home. She chose, of course, the latter alternative, and herself brought about Jacob\'s departure, by pleading to Isaac the necessity for obtaining a woman as Jacob\'s wife of a sort different from the Canaanitish women that Esau had married. Thus ends the first portion of Jacob\'s life.<P>2. To Aram and Back:<P>It is no young man that sets out thus to escape a brother\'s vengeance, and perhaps to find a wife at length among his mother\'s kindred. It was long before this that Esau at the age of forty had married the Hittite women (compare <a onClick="return mV(\'Gen\',26,34);">Ge 26:34</a> with <a onClick="return mV(\'Gen\',27,46);">27:46</A>). Yet to one who had hitherto spent his life subordinate to his father, indulged by his mother, in awe of a brother\'s physical superiority, and "dwelling in tents, a quiet (domestic) man" (<a onClick="return mV(\'Gen\',25,27);">Ge 25:27</a>), this journey of 500 or 600 miles, with no one to guide, counsel or defend, was as new an experience as if he had really been the stripling that he is sometimes represented to have been. All the most significant chapters in life awaited him: self-determination, love, marriage, fatherhood, domestic provision and administration, adjustment of his relations with men, and above all a personal and independent religious experience.<P>Of these things, all were to come to him in the 20 years of absence from Canaan, and the last was to come first; for the dream of Jacob at Beth-el was of course but the opening scene in the long drama of God\'s direct dealing with Jacob. Yet it was the determinative scene, for God in His latest and fullest manifestation to Jacob was just "the God of Beth-el" (<a onClick="return mV(\'Gen\',35,7);">Ge 35:7</a>; <a onClick="return mV(\'Gen\',48,3);">48:3</a>; <a onClick="return mV(\'Gen\',49,24);">49:24</a>).<P>With the arrival at Haran came love at once, though not for 7 years the consummation of that love. Its strength is naively indicated by the writer in two ways: impliedly in the sudden output of physical power at the well-side (<a onClick="return mV(\'Gen\',29,10);">Ge 29:10</a>), and expressly in the patient years of toil for Rachel\'s sake, which "seemed unto him but a few days for the love he had to her" (<a onClick="return mV(\'Gen\',29,20);">Ge 29:20</a>). Jacob is not primarily to be blamed for the polygamy that brought trouble into his home-life and sowed the seeds of division and jealousy in the nation of the future. Although much of Israel\'s history can be summed up in the rivalry of Leah and Rachel—Judah and Joseph—yet it was not Jacob\'s choice but Laban\'s fraud that introduced this cause of schism. At the end of his 7 years\' labor Jacob received as wife not Rachel but Leah, on the belated plea that to give the younger daughter before the elder was not the custom of the country. This was the first of the "ten times" that Laban "changed the wages" of Jacob (<a onClick="return mV(\'Gen\',31,7,41);">Ge 31:7, 41</a>). Rachel became Jacob\'s wife 7 days after Leah, and for this second wife he "served 7 other years." During these 7 years were born most of the sons and daughters (<a onClick="return mV(\'Gen\',37,35);">Ge 37:35</a>) that formed the actual family, the nucleus of that large caravan that Jacob took back with him to Canaan. Dinah is the only daughter named; <a onClick="return mV(\'Gen\',30,21);">Ge 30:21</a> is obviously in preparation for the story of <a onClick="return mV(\'Gen\',34,\'1-\');">Ge 34</a> (see especially <a onClick="return mV(\'Gen\',34,31);">34:31</a>). Four sons of Leah were the oldest: Reuben, with the right of primogeniture, Simeon, Levi and Judah. Next came the 4 sons of Bilhah and Zilpah, the personal slaves of the two wives (compare <a href="study/isbe/search.html?string=ABRAHAM">ABRAHAM, iv, 2</A>); the two pairs of sons were probably of about the same age (compare order in <a onClick="return mV(\'Gen\',49,\'1-\');">Ge 49</a>). Leah\'s 5th and 6th sons were separated by an interval of uncertain length from her older group. And Joseph, the youngest son born in Haran, was Rachel\'s first child, equally beloved by his mother, and by his father for her sake (<a onClick="return mV(\'Gen\',32,2);">33:2</A>; compare <a onClick="return mV(\'Gen\',44,20);">44:20</A>), as well as because he was the youngest of the eleven (<a onClick="return mV(\'Gen\',37,3);">37:3</A>).<P>Jacob\'s years of service for his wives were followed by 6 years of service rendered for a stipulated wage. Laban\'s cunning in limiting the amount of this wage in a variety of ways was matched by Jacob\'s cunning in devising means to overreach his uncle, so that the penniless wanderer of 20 years before becomes the wealthy proprietor of countless cattle and of the hosts of slaves necessary for their care (<a onClick="return mV(\'Gen\',32,10);">Ge 32:10</a>). At the same time the apology of Jacob for his conduct during this entire period of residence in Haran is spirited (<a onClick="return mV(\'Gen\',31,\'36-42\');">Ge 31:36-42</a>); it is apparently unanswerable by Laban (<a onClick="return mV(\'Gen\',31,43);">Ge 31:43</a>); and it is confirmed, both by the evident concurrence of Leah and Rachel (<a onClick="return mV(\'Gen\',31,\'14-16\');">Ge 31:14-16</a>), and by indications in the narrative that the justice (not merely the partiality) of God gave to each party his due recompense: to Jacob the rich returns of skillful, patient industry; to Laban rebuke and warning (<a onClick="return mV(\'Gen\',31,\'5-13\',24,29,42);">Ge 31:5-13, 24, 29, 42</a>).<P>The manner of Jacob\'s departure from Haran was determined by the strained relations between his uncle and himself. His motive in going, however, is represented as being fundamentally the desire to terminate an absence from his father\'s country that had already grown too long (<a onClick="return mV(\'Gen\',31,30);">Ge 31:30</a>; compare <a onClick="return mV(\'Gen\',30,25);">Ge 30:25</a>)—a desire which in fact presented itself to him in the form of a revelation of God\'s own purpose and command (<a onClick="return mV(\'Gen\',31,3);">Ge 31:3</a>). Unhappily, his clear record was stained by the act of another than himself, who nevertheless, as a member of his family, entailed thus upon him the burden of responsibility. Rachel, like Laban her father, was devoted to the superstition that manifested itself in the keeping and consulting of teraphim, a custom which, whether more nearly akin to fetishism, totemism, or ancestor-worship, was felt to be incompatible with the worship of the one true God. (Note that the "teraphim" of <a onClick="return mV(\'Gen\',31,19,34);">Ge 31:19, 34</a>f are the same as the "gods" of <a onClick="return mV(\'Gen\',31,30,43);">31:30,32</A> and, apparently, of <a onClick="return mV(\'Gen\',35,2,4);">35:2,4</a>.) This theft furnished Laban with a pretext for pursuit. What he meant to do he probably knew but imperfectly himself. Coercion of some sort he would doubtless have brought to bear upon Jacob and his caravan, had he not recognized in a dream the God whom Jacob worshipped, and heard Him utter a word of warning against the use of violence. Laban failed to find his stolen gods, for his daughter was as crafty and ready-witted as he. The whole adventure ended in a formal reconciliation, with the usual sacrificial and memorial token (<a onClick="return mV(\'Gen\',31,\'43-55\');">Ge 31:43-55</a>).<P>After Laban, Esau. One danger is no sooner escaped than a worse threatens. Yet between them lies the pledge of Divine presence and protection in the vision of God\'s host at Mahanaim: just a simple statement, with none of the fanciful detail that popular story-telling loves, but the sober record of a tradition to which the supernatural was matter of fact. Even the longer passage that preserves the occurrence at Peniel is conceived in the same spirit. What the revelation of the host of God had not sufficed to teach this faithless, anxious, scheming patriarch, that God sought to teach him in the night-struggle, with its ineffaceable physical memorial of a human impotence that can compass no more than to cling to Divine omnipotence (<a onClick="return mV(\'Gen\',32,\'22-32\');">Ge 32:22-32</a>). The devices of crafty Jacob to disarm an offended and supposedly implacable brother proved as useless as that bootless wrestling of the night before; Esau\'s peculiar disposition was not of Jacob\'s making, but of God\'s, and to it alone Jacob owed his safety. The practical wisdom of Jacob dictated his insistence upon bringing to a speedy termination the proposed association with his changeable brother, amid the difficulties of a journey that could not be shared by such divergent social and racial elements as Esau\'s armed host and Jacob\'s caravan, without discontent on the one side and disaster on the other. The brothers part, not to meet again until they meet to bury their father at Hebron (<a onClick="return mV(\'Gen\',35,29);">Ge 35:29</a>).<P>3. In Canaan Again:<P>Before Jacob\'s arrival in the south of Canaan where his father yet lived and where his own youth had been spent, he passed through a period of wandering in Central Palestine, somewhat similar to that narrated of his grandfather Abraham. To any such nomad, wandering slowly from Aram toward Egypt, a period of residence in the region of Mt. Ephraim was a natural chapter in his book of travels. Jacob\'s longer stops, recorded for us, were<P>(1) at Succoth, east of the Jordan near Peniel,<P>(2) at Shechem and<P>(3) at Beth-el.<P>Nothing worthy of record occurred at Succoth, but the stay at Shechem was eventful. <a onClick="return mV(\'Gen\',34,\'1-\');">Genesis 34</a>, which tells the story of Dinah\'s seduction and her brother\'s revenge, throws as much light upon the relations of Jacob and the Canaanites, as does chapter <a onClick="return mV(\'Gen\',14,\'1-\');">14</A> or chapter <a onClick="return mV(\'Gen\',23,\'1-\');">23</a> upon Abraham\'s relations, or chapter <a onClick="return mV(\'Gen\',26,\'1-\');">26</A> upon Isaac\'s relations, with such settled inhabitants of the land. There is a strange blending of moral and immoral elements in Jacob and his family as portrayed in this contretemps. There is the persistent tradition of separateness from the Canaanites bequeathed from Abraham\'s day (chapter <a onClick="return mV(\'Gen\',24,\'1-\');">24</A>), together with a growing family consciousness and sense of superiority (<a onClick="return mV(\'Gen\',34,7,14,31);">34:7,14,31</A>). And at the same time there is indifference to their unique moral station among the environing tribes, shown in Dinah\'s social relations with them (<a onClick="return mV(\'Gen\',34,1);">34:1</A>), in the treachery and cruelty of Simeon and Levi (<a onClick="return mV(\'Gen\',34,\'25-29\');">34:25-29</a>), and in Jacob\'s greater concern for the security of his possessions than for the preservation of his good name (verse <a onClick="return mV(\'Gen\',34,30);">30</A>).<P>It was this concern for the safety of the family and its wealth that achieved the end which dread of social absorption would apparently never have achieved—the termination of a long residence where there was moral danger for all. For a second time Jacob had fairly to be driven to Beth-el. Safety from his foes was again a gift of God (<a onClick="return mV(\'Gen\',35,5);">Ge 35:5</a>), and in a renewal of the old forgotten ideals of consecration (<a onClick="return mV(\'Gen\',35,\'2-8\');">Ge 35:2-8</a>), he and all his following move from the painful associations of Shechem to the hallowed associations of Beth-el. Here were renewed the various phases of all God\'s earlier communications to this patriarch and to his fathers before him. The new name of Israel, hitherto so ill deserved, is henceforth to find realization in his life; his fathers\' God is to be his God; his seed is to inherit the land of promise, and is to be no mean tribe, but a group of peoples with kings to rule over them like the nations round about (<a onClick="return mV(\'Gen\',35,\'9-12\');">Ge 35:9-12</a>). No wonder that Jacob here raises anew his monument of stone—emblem of the "Stone of Israel" (<a onClick="return mV(\'Gen\',49,24);">Ge 49:24</a>)—and stamps forever, by this public act, upon ancient Luz (<a onClick="return mV(\'Gen\',35,6);">Ge 35:6</a>), the name of Beth-el which he had privately given it years before (<a onClick="return mV(\'Gen\',28,19);">Ge 28:19</a>).<P>Losses and griefs characterized the family life of the patriarch at this period. The death of his mother\'s Syrian nurse at Beth-el (<a onClick="return mV(\'Gen\',35,8);">Ge 35:8</a>; compare <a onClick="return mV(\'Gen\',24,59);">Ge 24:59</a>) was followed by the death of his beloved wife Rachel at Ephrath (<a onClick="return mV(\'Gen\',35,19);">Ge 35:19</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a>) in bringing forth the youngest of his 12 sons, Benjamin. At about the same time the eldest of the 12, Reuben, forfeited the honor of his station in the family by an act that showed all too clearly the effect of recent association with Canaanites (<a onClick="return mV(\'Gen\',35,22);">Ge 35:22</a>). Finally, death claimed Jacob\'s aged father, whose latest years had been robbed of the companionship, not only of this son, but also of the son whom his partiality had all but made a fratricide; at Isaac\'s grave in Hebron the ill-matched brothers met once more, thenceforth to go their separate ways, both in their personal careers and in their descendants\' history (<a onClick="return mV(\'Gen\',35,29);">Ge 35:29</a>).<P>Jacob now is by right of patriarchal custom head of all the family. He too takes up his residence at Hebron (<a onClick="return mV(\'Gen\',37,14);">Ge 37:14</a>), and the story of the family fortunes is now pursued under the new title of "the generations of Jacob" (<a onClick="return mV(\'Gen\',37,2);">Ge 37:2</a>). True, most of this story revolves about Joseph, the youngest of the family save Benjamin; yet the occurrence of passages like <a onClick="return mV(\'Gen\',38,\'1-\');">Ge 38</a>, devoted exclusively to Judah\'s affairs, or <a onClick="return mV(\'Gen\',46,\'8-27\');">46:8-27</a>, the enumeration of Jacob\'s entire family through its secondary ramifications, or <a onClick="return mV(\'Gen\',49,\'1-\');">Ge 49</a>, the blessing of Jacob on all his sons—all these prove that Jacob, not Joseph, is the true center of the narrative until his death. As long as he lives he is the real head of his house, and not merely a superannuated veteran like Isaac. Not only Joseph, the boy of 17 (<a onClick="return mV(\'Gen\',37,2);">37:2</A>), but also the self-willed elder sons, even a score of years later, come and go at his bidding (<a onClick="return mV(\'Gen\',42,\'1-\');">Ge 42</a>; <a onClick="return mV(\'Gen\',43,\'1-\');">43</a>; <a onClick="return mV(\'Gen\',44,\'1-\');">44</a>; <a onClick="return mV(\'Gen\',45,\'1-\');">45</a>). Joseph\'s dearest thought, as it is his first thought, is for his aged father (<a onClick="return mV(\'Gen\',43,7,27);">43:7,27</a>; <a onClick="return mV(\'Gen\',44,19);">44:19</a>; and especially <a onClick="return mV(\'Gen\',45,3,9,13,23);">45:3,9,13,23</A>, and <a onClick="return mV(\'Gen\',46,29);">46:29</A>).<P>4. Last Years in Egypt:<P>It is this devotion of Joseph that results in Jacob\'s migration to Egypt. What honors there Joseph can show his father he shows him: he presents him to Pharaoh, who for Joseph\'s sake receives him with dignity, and assigns him a home and sustenance for himself and all his people as honored guests of the land of Egypt (<a onClick="return mV(\'Gen\',47,\'7-12\');">Ge 47:7-12</a>). Yet in Beersheba, while en route to Egypt, Jacob had obtained a greater honor than this reception by Pharaoh. He had found there, as ready to respond to his sacrifices as ever to those of his fathers, the God of his father Isaac, and had received the gracious assurance of Divine guidance in this momentous journey, fraught with so vast a significance for the future nation and the world (<a onClick="return mV(\'Gen\',46,\'1-4\');">Ge 46:1-4</a>): God Himself would go with him into Egypt and give him, not merely the gratification of once more embracing his long-lost son, but the fulfillment of the covenant-promise (<a onClick="return mV(\'Gen\',15,\'13-16\');">Ge 15:13-16</a>) that he and his were not turning their backs upon Canaan forever. Though 130 years of age when he stood before Pharaoh, Jacob felt his days to have been "few" as well as "evil," in comparison with those of his fathers (<a onClick="return mV(\'Gen\',47,9);">Ge 47:9</a>). And in fact he had yet 17 years to live in Goshen (<a onClick="return mV(\'Gen\',47,28);">Ge 47:28</a>).<P>These last days are passed over without record, save of the growth and prosperity of the family. But at their close came the impartation of the ancestral blessings, with the last will of the dying patriarch. After adopting Joseph\'s sons, Manasseh and Ephraim, as his own, Jacob blesses them, preferring the younger to the elder as he himself had once been preferred to Esau, and assigns to Joseph the "double portion" of the firstborn—that "preeminence" which he denies to Reuben (<a onClick="return mV(\'Gen\',48,22);">Ge 48:22</a>; <a onClick="return mV(\'Gen\',49,4);">49:4</a>). In poetry that combines with the warm emotion and glowing imagery of its style and the unsurpassed elevation of its diction, a lyrical fervor of religious sentiment which demands for its author a personality that had passed through just such course of tuition as Jacob had experienced, the last words of Jacob, in <a onClick="return mV(\'Gen\',49,\'1-\');">Ge 49</a>, mark a turning-point in the history of the people of God. This is a translation of biography into prophecy. On the assumption that it is genuine, we may confidently aver that it was simply unforgetable by those who heard it. Its auditors were its theme. Their descendants were its fulfillment. Neither the one class nor the other could ever let it pass out of memory.<P>It was "by faith," we are well reminded, that Jacob "blessed" and "worshipped" "when he was dying" (<a onClick="return mV(\'Hbr\',11,21);">Heb 11:21</a>). For he held to the promises of God, and even in the hour of dissolution looked for the fulfillment of the covenant, according to which Canaan should belong to him and to his seed after him. He therefore set Joseph an example, by "giving commandment concerning his bones," that they might rest in the burial-place of Abraham and Isaac near Hebron. To the accomplishment of this mission Joseph and all his brethren addressed themselves after their father\'s decease and the 70 days of official mourning. Followed by a "very great company" of the notables of Egypt, including royal officials and representatives of the royal family, this Hebrew tribe carried up to sepulture in the land of promise the embalmed body of the patriarch from whom henceforth they were to take their tribal name, lamented him according to custom for 7 days, and then returned to their temporary home in Egypt, till their children should at length be "called" thence to become God\'s son" (<a onClick="return mV(\'Hsa\',11,1);">Ho 11:1</a>) and inherit His promises to their father Jacob.<P>IV. Character and Beliefs.<P>In the course of this account of Jacob\'s career the inward as well as the outward fortunes of the man have somewhat appeared. Yet a more comprehensive view of the kind of man he was will not be superfluous at this point. With what disposition was he endowed—the natural nucleus for acquired characteristics and habits? Through what stages did he pass in the development of his beliefs and his character? In particular, what attitude did he maintain toward the most significant thing in his life, the promise of God to his house? And lastly, what resemblances may be traced in Israel the man to Israel the nation, of such sort that the one may be regarded as "typical" of the other? These matters deserve more than a passing notice.<P>1. Natural Qualities:<P>From his father, Jacob inherited that domesticity and affectionate attachment to his home circle which appears in his life from beginning to end. He inherited shrewdness, initiative and resourcefulness from Rebekah—qualities which she shared apparently with her brother Laban and all his family. The conspicuous ethical faults of Abraham and Isaac alike are want of candor and want of courage. It is not surprising, therefore, to find the same failings in Jacob. Deceit and cowardice are visible again and again in the impartial record of his life. Both spring from unbelief. They belong to the natural man. God\'s transformation of this man was wrought by faith—by awakening and nourishing in him a simple trust in the truth and power of the Divine word. For Jacob was not at any time in his career indifferent to the things of the spirit, the things unseen and belonging to the future. Unlike Esau, he was not callous to the touch of God. Whether through inheritance, or as a fruit of early teaching, he had as the inestimable treasure, the true capital of his spiritual career, a firm conviction of the value of what God had promised, and a supreme ambition to obtain it for himself and his children. But against the Divine plan for the attainment of this goal by faith, there worked in Jacob constantly his natural qualities, the non-moral as well as the immoral qualities, that urged him to save himself and his fortunes by "works"—by sagacity, cunning, compromise, pertinacity—anything and everything that would anticipate God\'s accomplishing His purpose in His own time and His own way. In short, "the end justifies the means" is the program that, more than all others, finds illustration and rebuke in the character of Jacob.<P>2. Stages of Development:<P>Starting with such a combination of natural endowments, social, practical, ethical, Jacob passed through a course of Divine tuition, which, by building upon some of them, repressing others and transfiguring the remainder, issued in the triumph of grace over nature, in the transformation of a Jacob into an Israel. This tuition has been well analyzed by a recent writer (Thomas, Genesis, III, 204f) into the school of sorrow, the school of providence and the school of grace. Under the head of sorrow, it is not difficult to recall many experiences in the career just reviewed: long exile; disappointment; sinful passions of greed, anger, lust and envy in others, of which Jacob was the victim; perplexity; and, again and again, bereavement of those he held most dear.<P>But besides these sorrows, God\'s providence dealt with him in ways most remarkable, and perhaps more instructive for the study of such Divine dealings than in the case of any other character in the Old Testament. By alternate giving and withholding, by danger here and deliverance there, by good and evil report, now by failure of "best laid schemes" and now by success with seemingly inadequate means, God developed in him the habit—not native to him as it seems to have been in part to Abraham and to Joseph, —of reliance on Divine power and guidance, of accepting the Divine will, of realizing the Divine nearness and faithfulness.<P>And lastly, there are those admirably graded lessons in the grace of God, that were imparted in the series of Divine appearances to the patriarch, at Beth-el, at Haran, at Peniel, at Beth-el again and at Beersheba. For if the substance of these Divine revelations be compared, it will be found that all are alike in the assurance (1) that God is with him to bless; (2) that the changes of his life are ordained of God and are for his ultimate good; and (3) that he is the heir of the ancestral promises.<P>It will further be found that they may be arranged in a variety of ways, according as one or another of the revelations be viewed as the climax. Thus (1), agreeing with the chronological order, the appearance at Beersheba may well be regarded as the climax of them all. Abraham had gone to Egypt to escape a famine (<a onClick="return mV(\'Gen\',12,10);">Ge 12:10</a>), but he went without revelation, and returned with bitter experience of his error. Isaac essayed to go to Egypt for the same cause (<a onClick="return mV(\'Gen\',26,1);">Ge 26:1</a>f), and was prevented by revelation. Jacob now goes to Egypt, but he goes with the express approval of the God of his fathers, and with the explicit assurance that the same Divine providence which ordained this removal (<a onClick="return mV(\'Gen\',50,20);">Ge 50:20</a>) will see that it does not frustrate any of the promises of God. This was a crisis in the history of the "Kingdom of God" on a paragraph with events like the Exodus, the Exile, or the Return.<P>(2) In its significance for his personal history, the first of these revelations was unique. Beth-el witnessed Jacob\'s choice, evidently for the first time, of his fathers\' God as his God. And though we find Jacob later tolerating idolatry in his household and compromising his religious testimony by sin, we never find a hint of his own unfaithfulness to this first and final religious choice. This is further confirmed by the attachment of his later revelations to this primary one, as though this lent them the significance of continuity, and made possible the unity of his religious experience. So at Haran it was the "God of Beth-el" who directed his return (<a onClick="return mV(\'Gen\',31,13);">Ge 31:13</a>); at Shechem it was to Beth-el that he was directed, in order that he might at length fulfill his Beth-el vow, by erecting there an altar to the God who had there appeared to him (<a onClick="return mV(\'Gen\',35,1);">Ge 35:1</a>); and at Beth-el finally the promise of former years was renewed to him who was henceforth to be Israel (<a onClick="return mV(\'Gen\',35,\'9-15\');">Ge 35:9-15</a>).<P>(3) Though thus punctuated with the supernatural, the only striking bit of the marvelous in all this biography is the night scene at Peniel. And this too may justly be claimed as a climax in Jacob\'s development. There he first received his new name, and though he deserved it as little in many scenes thereafter as he had deserved it before, yet the same could be said of many a man who has "seen the face of God," but has yet to grasp, like Jacob, the lesson that the way to overcome is through the helpless but clinging importunity of faith.<P>(4) Rather than in any of the other scenes, however, it was at Beth-el the second time that the patriarch reached the topmost rung on the ladder of development. As already noticed, the substance of all the earlier revelations is here renewed and combined. It is no wonder that after this solemn theophany we find Jacob, like Moses later, \'enduring as seeing him who is invisible\' (<a onClick="return mV(\'Hbr\',11,27);">Heb 11:27</a>), and "waiting for the salvation" (<a onClick="return mV(\'Gen\',49,18);">Ge 49:18</a>) of a God \'who is not ashamed of him, to be called his God\' (<a onClick="return mV(\'Hbr\',11,16);">Heb 11:16</a>), but is repeatedly called "the God of Jacob."<P>Finally, such a comparison of these revelations to Jacob reveals a variety in the way God makes Himself known. In the first revelation, naturally, the effort is made chiefly to impress upon its recipient the identity of the revealing God with the God of his fathers. And it has been remarked already that in the later revelations the same care is taken to identify the Revealer with the One who gave that first revelation, or else to identify Him, as then, with the God of the fathers. Yet, in addition to this, there is a richness and suitability in the Divine names revealed, which a mechanical theory of literary sources not only leaves unexplained but fails even to recognize. At Beth-el first it is Yahweh, the personal name of this God, the God of his fathers, who enters into a new personal relation with Jacob; now, of all times in his career, he needs to know God by the differential mark that distinguishes Him absolutely from other gods, that there may never be confusion as to Yahweh\'s identity. But this matter is settled for Jacob once for all. Thenceforth one of the ordinary terms for deity, with or without an attributive adjunct, serves to lift the patriarch\'s soul into communication with his Divine Interlocutor. The most general word of all in the Semitic tongues for deity is \'El, the word used in the revelations to Jacob at Haran in Genesis (<a onClick="return mV(\'Gen\',31,13);">31:13</A>), at Shechem (<a onClick="return mV(\'Gen\',35,1);">35:1</A>), at Beth-el the second time (<a onClick="return mV(\'Gen\',35,11);">35:11</A>) and at Beersheba (<a onClick="return mV(\'Gen\',46,3);">46:3</A>). But it is never used alone. Like Allah in the Arabic language (= the God), so \'El with the definite article before it serves to designate in Hebrew a particular divinity, not deity in general. Or else \'El without the article is made definite by some genitive phrase that supplies the necessary identification: so in Jacob\'s case, El-beth-el (<a onClick="return mV(\'Gen\',35,7);">35:7</a>; compare <a onClick="return mV(\'Gen\',31,13);">31:13</a>) or El-Elohe-Israel (<a onClick="return mV(\'Gen\',33,20);">33:20</a>). Or, lastly, there is added to \'El some determining title, with the force of an adjective, as Shaddai (translated "Almighty") in <a onClick="return mV(\'Gen\',35,11);">35:11</a> (compare <a onClick="return mV(\'Gen\',43,3);">43:3</A>). In clear distinction from this word, \'El, with its archaic or poetic flavor, is the common Hebrew word for God, \'Elohim. But while \'Elohim is used regularly by the narrator of the Jacob-stories in speaking, or in letting his actors speak, of Jacob\'s God, who to the monotheistic writer is of course the God and his own God, he never puts this word thus absolutely into the mouth of the revealing Deity. Jacob can say, when he awakes from his dream, "This is the house of \'Elohim," but God says to him in the dream, "I am the God (\'Elohim) of thy father" (<a onClick="return mV(\'Gen\',28,17);">28:17</a>, <a onClick="return mV(\'Gen\',28,13);">13</A>). At Mahanaim Jacob says, "This is the host of \'Elohim" (<a onClick="return mV(\'Gen\',32,2);">32:2</A>), but at Beersheba God says to Jacob, "I am...the God (\'Elohim) of thy father" (<a onClick="return mV(\'Gen\',46,3);">46:3</A>). Such are the distinctions maintained in the use of these words, all of them used of the same God, yet chosen in each case to fit the circumstances of speaker, hearer and situation.<P>The only passage in the story of Jacob that might appear to be an exception does in fact but prove the rule. At Peniel the angel of God explains the new name of Israel by saying, "Thou hast striven with God (\'Elohim) and with men, and hast prevailed." Here the contrast with "men" proves that \'Elohim without the article is just the right expression, even on the lips of Deity: neither Deity nor humanity has prevailed against Jacob (<a onClick="return mV(\'Gen\',32,28);">Ge 32:28</a>).<P>Throughout the entire story of Jacob, therefore, his relations with Yahweh his God, after they were once established (<a onClick="return mV(\'Gen\',28,\'13-16\');">Ge 28:13-16</a>), are narrated in terms that emphasize the Divinity of Him who had thus entered into covenant-relationship with him: His Divinity—that is to say, those attributes in which His Divinity manifested itself in His dealings with Jacob.<P>3. Attitude toward the Promise:<P>From the foregoing, two things appear with respect to Jacob\'s attitude toward the promise of God. First, with all his faults and vices he yet was spiritually sensitive; he responded to the approaches of his God concerning things of a value wholly spiritual—future good, moral and spiritual blessings. And second, he was capable of progress in these matters; that is, his reaction to the Divine tuition would appear, if charted, as a series of elevations, separated one from another, to be sure, by low levels and deep declines, yet each one higher than the last, and all taken collectively lifting the whole average up and up, till in the end faith has triumphed over sight, the future over present good, a yet unpossessed but Divinely promised Canaan over all the comfort and honors of Egypt, and the aged patriarch lives only to "wait for Yahweh\'s salvation" (<a onClick="return mV(\'Gen\',49,18);">Ge 49:18</a>).<P>The contrast of Jacob with Esau furnishes perhaps the best means of grasping the significance of these two facts for an estimate of Jacob\'s attitude toward the promise. For in the first place, Esau, who possessed so much that Jacob lacked—directness, manliness, a sort of bonhomie, that made him superficially more attractive than his brother—Esau shows nowhere any real "sense" for things spiritual. The author of Hebrews has caught the man in the flash of a single word, "profane" bebelos)—of course, in the older, broader, etymological meaning of the term. Esau\'s desires dwelt in the world of the non-sacred; they did not aspire to that world of nearness to God, where one must \'put off the shoes from off his feet, because the place whereon he stands is holy ground.\' And in the second place, there is no sign of growth in Esau. What we see him in his father\'s encampment, that we see him to the end—so far as appears from the laconic story. With the virtues as well as the vices of the man who lives for the present—forgiving when strong enough to revenge, condescending when flattered, proud of power and independent of parental control or family tradition—Esau is as impartially depicted by the sacred historian as if the writer had been an Edomite instead of an Israelite: the sketch is evidently true to life, both from its objectivity and from its coherence.<P>Now what Esau was, Jacob was not. His fault in connection with the promises of God, the family tradition, the ancestral blessing, lay not in despising them, but in seeking them in immoral ways. Good was his aim; but he was ready to "do evil that good might come." He was always tempted to be his own Providence, and God\'s training was clearly directed, both by providential leadings and by gracious disclosures, to this corresponding purpose: to enlighten Jacob as to the nature of the promise; to assure him that it was his by grace; to awaken personal faith in its Divine Giver; and to supplement his "faith" by that "patience" without which none can "inherit the promises." The faith that accepts was to issue at length in the faith that waits.<P>4. How Far a "Type" of Israel:<P>A nation was to take its name from Jacob-Israel, and there are some passages of Scripture where it is uncertain whether the name designates the nation or its ancestor. In their respective relations to God and to the world of men and nations, there is a true sense in which the father was a "type" of the children. It is probably only a play of fancy that would discover a parallel in their respective careers, between the successive stages of life in the father\'s home (Canaan), life in exile, a return, and a second exile. But it is not fanciful to note the resemblance between Jacob\'s character and that of his descendants. With few exceptions the qualities mentioned above (IV, 2) will be found, mutatis mutandis, to be equally applicable to the nation of Israel. And even that curriculum in which the patriarch learned of God may be viewed as a type of the school in which the Hebrew people—not all of them, nor even the mass, but the "remnant" who approximated to the ideal Israel of the prophets, the "servant of Yahweh"—were taught the lessons of faith and patience, of renunciation and consecration, that appear with growing clearness on the pages of Isaiah, of Habakkuk, of Jeremiah, of Malachi. This is apparently Hosea\'s point of view in <a onClick="return mV(\'Hsa\',12,\'2-4\',12);">Ho 12:2-4, 12</a>.<P>A word of caution, however, is needed at this point. There are limits to this equation. Even critics who regard Jacob under his title of Israel as merely the eponymous hero, created by legend to be the forefather of the nation (compare below, VI, 1), must confess that Jacob as Jacob is no such neutral creature, dressed only in the colors of his children\'s racial qualities. There is a large residuum in Jacob, after all parallelisms have been traced, that refuses to fit the lines of Hebrew national character or history, and his typical relation in fact lies chiefly in the direction of the covenant-inheritance, after the fashion of Malachi\'s allusion (<a onClick="return mV(\'Mal\',1,2);">Mal 1:2</a>), interpreted by Paul (<a onClick="return mV(\'Rom\',9,\'10-13\');">Ro 9:10-13</a>).<P>V. References Outside of Genesis.<P>Under his two names this personage Jacob or Israel is more frequently mentioned than any other in the whole of sacred history. Yet in the vast majority of cases the nation descended from him is intended by the name, which in the form of "Jacob" or "Israel" contains not the slightest, and in the form "children of Israel," "house of Jacob" and the like, only the slightest, if any, allusion to the patriarch himself. But there still remain many passages in both Testaments where the Jacob or Israel of Genesis is clearly alluded to.<P>1. In the Old Testament:<P>There is a considerable group of passages that refer to him as the last of the patriarchal triumvirate—Abraham, Isaac and Jacob: so particularly of Yahweh as the "God of Abraham, Isaac and Jacob," and of the covenant-oath as having been "sworn unto Abraham, Isaac and Jacob." And naturally the nation that is known by his name is frequently called by some phrase, equivalent to the formal bene yisra\'el, yet through its unusualness lending more significance to the idea of their derivation from him: so "seed of Jacob" and (frequently) "house of Jacob (Israel)." But there are a few Old Testament passages outside of Genesis in which so much of Jacob\'s history has been preserved, that from these allusions alone a fair notion might have been gathered concerning the Hebrews\' tradition of their common ancestor, even if all the story in Gen had been lost. These passages are: <a onClick="return mV(\'Jos\',24,3,4,32);">Jos 24:3-4, 32</a>; <a onClick="return mV(\'Psa\',105,\'10-23\');">Ps 105:10-23</a>; <a onClick="return mV(\'Hsa\',12,\'2-4\',12);">Ho 12:2-4, 12</a>; <a onClick="return mV(\'Mal\',1,2);">Mal 1:2</a>f. Besides these, there are other allusions, scattered a word here and a sentence there, from all of which together we learn as follows. God gave to Isaac twin sons, Esau and Jacob, the latter at birth taking the former by the heel. God elected Jacob to be the recipient of the covenant-promise made to his father Isaac and to his grandfather Abraham; and this choice involved the rejection of Esau. Yahweh appeared to Jacob at Beth-el and told him the land of Canaan was to be his and his seed\'s after him forever. Circumstances not explained caused Jacob to flee from his home in Canaan to Aram, where he served as a shepherd to obtain a wife as his wage. He became the father of 12 sons. He strove with the angel of God and prevailed amid earnest supplication. His name was by Yahweh Himself changed to Israel. Under Divine protection as God\'s chosen one and representative, his life was that of a wanderer from place to place; once only he bought a piece of land, for a hundred pieces, near Shechem, from Hamor, the father of Shechem. A famine drove him down to Egypt, but not without providential preparation for the reception there of himself and all his family, through the remarkable fortunes of his son Joseph, sold, exiled, imprisoned, delivered, and exalted to a position where he could dispose of rulers and nations. In Egypt the children of Jacob multiplied rapidly, and at his death he made the sons of Joseph the heirs of the only portion of Canaanitish soil that he had acquired.<P>From this it appears, first, that not much that is essential in the biography of Jacob would have perished though Genesis had been lost; and, second, that the sum of the incidental allusions outside Genesis resemble the total impression of the narratives in Genesis—in other words, that the Biblical tradition is self-consistent. And it runs back to a date (Hosea, 8th century BC) little farther removed from the events recounted than the length of time that separates our own day from the Norman conquest, or the Fall of Constantinople from the Hegira, or Jesus Christ from Solomon.<P>2. In the New Testament:<P>In the New Testament also there are, besides the references to Jacob simply as the father of his nation, several passages that recall events in his life or traits of his character. These are: <a onClick="return mV(\'Jhn\',4,5,6,12);">Joh 4:5-6, 12</a>; <a onClick="return mV(\'Act\',7,12,14,15,16);">Ac 7:12, 14-16</a>; <a onClick="return mV(\'Rom\',9,\'10-13\');">Ro 9:10-13</a>; <a onClick="return mV(\'Hbr\',11,9,20);">Heb 11:9, 20</a>f. In the conversation between Jesus and the Samaritan woman it appears that the Samaritans cherished the association of Jacob with the ground he bought near Shechem, and with the well he dug while sojourning there with his sons and his flocks; they prided themselves on its transmission to them through Joseph, not to the hated Jews through Judah, and magnified themselves in magnifying Jacob\'s "greatness" and calling him "our father." Stephen\'s speech, as Luke reports it, includes in its rapid historical flight a hint or two about Jacob beyond the bare fact of his place in the tribal genealogy. Moved by the famine prevailing in Egypt and Canaan, Jacob twice dispatches his sons to buy grain in Egypt, and the second time Joseph is made known to his brothers, and his race becomes manifest to Pharaoh. At Joseph\'s behest, Jacob and all the family remove to Egypt. There all remain until their death, but the "fathers" (Joseph and his brethren; compare Jerome, Epistola cviii, edition Migne) are buried in the family possession near Shechem. (Here emerges one of those divergences from the Old Testament tradition that are a notable feature of Stephen\'s speech, and that have furnished occasion for much speculation upon their origin, value and implications. See commentaries on Acts.) Paul\'s interest in Jacob appears in connection with his discussion of Divine election, where he calls attention to the oracle of <a onClick="return mV(\'Gen\',25,23);">Ge 25:23</a> and to the use already made of the passage by Malachi (<a onClick="return mV(\'Mal\',1,2);">1:2</A>f), and reminds his readers that this choice of Jacob and rejection of Esau was made by God even before these twin sons of Isaac and Rebecca were born. Finally, the author of He, when charting the heroes of faith, focuses his glass for a moment upon Jacob: first, as sharing with Abraham and Isaac the promise of God and the life of unworldly, expectant faith (<a onClick="return mV(\'Hbr\',11,9);">Heb 11:9</a>); and second, as receiving from Isaac, and at his death transmitting to his grandsons, blessings that had value only for one who worships and believes a God with power over "things to come" (<a onClick="return mV(\'Hbr\',11,20);">Heb 11:20</a>f).<P>VI. Modern Interpretations of Jacob.<P>For those who see in the patriarchal narratives anything—myth, legend, saga—rather than true biography, there is, of course, a different interpretation of the characters and events portrayed in the familiar Genesis-stories, and a different value placed upon the stories themselves.<P>Apart from the allegorizing treatment accorded them by Philo the Jew and early Christian writers of like mind (see specimen in <a href="study/isbe/search.html?string=ABRAHAM">ABRAHAM</a>), these views belong to modern criticism. To critics who make Hebrew history begin with the settlement of Canaan by the nomad Israelites fresh from the desert, even the Mosaic age and the Egyptian residence are totally unhistorical—much more so these tales of a pre-Mosaic patriarchal age. Yet even those writers who admit the broad outlines of a residence of the tribes in Egypt, an exodus of some sort, and a founder of the nation named Moses, are for the most part skeptical of this cycle of family figures and fortunes in a remote age, with its nomads wandering between Mesopotamia and Canaan. and to and fro in Canaan, its circumstantial acquaintance with the names and relationships of each individual through those 4 long patriarchal generations, and its obvious foreshadowing of much that the later tribes were on this same soil to act out centuries later. This, we are told, is not history. Whatever else it may be, it is not a reliable account of such memorable events as compel their own immortality in the memories and through the written records of mankind.<P>1. Personification of the Hebrew Nation:<P>The commonest view held, collectively of the entire narrative, specifically of Jacob, is that which sees here the precipitate from a pure solution of the national character and fortunes. Wellhausen, e.g., says (Prolegomena(6), 316): "The material here is not mythical, but national; therefore clearer (namely, than in <span class="noTag">Ge 1-11</span>) and in a certain sense historical. To be sure there is no historical knowledge to be gained here about the patriarchs, but only about the time in which the stories concerning them arose in the people of Israel; this later time with its inward and outward characteristics is here unintentionally projected into the gray antiquity and mirrored therein like a glorified phantasm ....(p. 318). Jacob is more realistically drawn than the other two (Abraham and Isaac)." In section IV, 4, above, we observed that, while many of Jacob\'s personal qualities prefigured the qualities of the later Hebrew people, there were some others that did not at all fit this equation. Wellhausen himself remarks this, in regard to the contrast between warlike Israel and the peaceful ancestors they invented for themselves. In his attempt to account for this contrast, he can only urge that a nation condemned to eternal wars would naturally look back upon, as well as forward to, a golden age of peace. (An alternative explanation he states, only to reject.) He fails to observe that this plea does not in the least alter the fact—his plea is indeed but a restatement of the fact—that this phenomenon is absolutely at variance with his hypothesis of how these stories of Jacob and the rest came to be what they are (see Meyer, Die Israeliten und ihre Nachbarstamme, 250ff).<P>2. God and Demi-God:<P>This general view, which when carried to its extreme implications (as by Steuernagel, Die Einwanderung der israelitischen Stamme in Kanaan, 1901) comes perilously near the reductio ad absurdum that is its own refutation, has been rejected by that whole group of critics, who, following Noldeke, see in Jacob, as in so many others of the patriarchs, an original deity (myth), first abased to the grade of a hero (heroic legend), and at last degraded to the level of a clown (tales of jest or marvel). Adherents of this trend of interpretation differ widely among themselves as to details, but Jacob is generally regarded as a Canaanitish deity, whose local shrine was at Shechem, Beth-el or Peniel, and whose cult was taken over by the Hebrews, their own object of worship being substituted for him, and the outstanding features of his personality being made over into a hero that Israel appropriated as their national ancestor, even to the extent of giving him the secondary name of Israel. Stade attempted a combination of this "mythical" view with the "national" view in the interest of his theory of primitive animism, by making the patriarch a "mythological figure revered as an eponymous hero." This theory, in any form, requires the assumption, which there is nothing to support, that Jacob (or Jacob-el) is a name originally belonging to a deity and framed to fit his supposed character. At first, then, it meant "\'El deceives" or "\'El recompenses" (so B. Luther, ZATW, 1901, 60ff; compare also the same writer, as well as Meyer himself, in the latter\'s Israeliten, etc., 109ff, 271ff). Meyer proposes the monstrosity of a nominal sentence with the translation, "\' He deceives\' is \'El." Thus, the first element of the name Jacob came to be felt as the name itself (= "Jacob is God"), and it was launched upon its course of evolution into the human personage that Genesis knows. It suffices to say with regard to all this, that in addition to its being inherently improbable—not to say, unproved—it goes directly in the face of the archaeological evidence adduced under I,1,above. The simple fact that Jacob(-el) was a personal name for men, of everyday occurrence in the 2nd-3rd millenniums BC, is quite enough to overthrow this whole hypothesis; for, as Luther himself remarks (op. cit., 65), the above evolution of the name is essential to the "mythical" theory: "when this alteration took place cannot be told; yet it has to be postulated, since otherwise it remains inexplicable, how personal names could arise out of these formations (like Jacob-el) by rejection of the \'El."<P>3. Character of Fiction:<P>The inadequacy of the two theories hitherto advanced to account for the facts of Genesis being thus evident, Gunkel and others have explicitly rejected them and enunciated a third theory, which may be called the saga-theory. According to Gunkel, "to understand the persons of Genesis as nations is by no means a general key to their interpretation"; and, "against the whole assumption that the principal patriarchal figures are originally gods is this fact first and foremost, that the names Jacob and Abraham are shown by the Babylonian to be customary personal names, and furthermore that the tales about them cannot be understood at all as echoes of original myths." In place of these discredited views Gunkel (compare also Gressmann, ZATW, 1910, 1ff) makes of Jacob simply a character in the stories (marvelous, humorous, pathetic and the like) current in ancient Israel, especially on the lips of the professional story-teller. Whereas much of the material in these stories came to the Hebrews from the Babylonians, Canaanites or Egyptians, Jacob himself is declared to have belonged to the old Hebrew saga, with its flavor of nomadic desert life and sheep-raising. "The original Jacob may be the sly shepherd Jacob, who fools the hunter Esau; another tale, of the deceit of a father-in-law by his son-in-law, was added to it—the more naturally because both are shepherds; a third cycle, about an old man that loves his youngest son, was transferred to this figure, and that youngest son received the name of Joseph at a time when Jacob was identified with Israel\'s assumed ancestor \'Israel.\' Thus our result is, that the most important patriarchs are creations of fiction" (Schriften des Altes Testament, 5te Lieferung, 42).<P>It is so obvious that this new attitude toward the patriarchs lends itself to a more sympathetic criticism of the narrative of Genesis, that critics who adopt it are at pains to deny any intention on their part of rehabilitating Jacob and others as historical figures. "Saga," we are told, "is not capable of preserving through so many centuries a picture" of the real character or deeds of its heroes, even supposing that persons bearing these names once actually lived; and we are reminded of the contrast between the Etzel of saga and the Attila of history, the Dietrich of saga and the Theodoric of history. But as against this we need to note, first, that the long and involved course of development through which, ex hypothesi, these stories have passed before reaching their final stage (the Jahwist document (Jahwist), 9th century BC; Gunkel, op. cit.,8,46) involves a very high antiquity for the earlier stages, and thus reduces to a narrow strip of time those "so many centuries" that are supposed to separate the actual Jacob from the Jacob of saga (compare <a href="study/isbe/search.html?string=ABRAHAM">ABRAHAM, vii, 4</A>); and second, that the presuppositions as to the origin, nature and value of saga with which this school of criticism operates are, for the most part, only an elaborate statement of the undisputed major premise in a syllogism, of which the minor premise is: the Genesis-stories are saga. Against this last proposition, however, there lie many weighty considerations, that are by no means counterbalanced by those resemblances of a general sort which any student of comparative literature can easily discern (see also Baethgen, op. cit., 158).`<a href="study/isbe/search.html?string=JACOB+(2)">JACOB (2)`15';
isbe[4786]='Jacob (2)`(ya\'aqobh; Iakob):<P>(1) The patriarch (see preceding article <a href="study/isbe/search.html?string=JACOB+(1)">JACOB (1)</A>).<P>(2) The father of Joseph the husband of Mary (<a onClick="return mV(\'Mat\',1,15,16);">Mt 1:15-16</a>).<P>(3) Patronymic denoting the Israelites (<a onClick="return mV(\'Isa\',10,21);">Isa 10:21</a>; <a onClick="return mV(\'Isa\',14,1);">14:1</a>; <a onClick="return mV(\'Jer\',10,16);">Jer 10:16</a>).``1';
isbe[4787]='Jacob\'s Well`(pege tou Iakob):<P>1. Position of Well:<P>In <a onClick="return mV(\'Jhn\',4,3);">Joh 4:3</a>ff we read that our Lord "left Judea, and departed again into Galilee. And he must needs pass through Samaria. So he cometh to a city of Samaria, called Sychar, near to the parcel of ground that Jacob gave to his son Joseph: and Jacob\'s well was there." When Jacob came to Shechem on his return from Paddanaram he encamped "before," i.e. east of the city, and bought the land on which he had spread his tent (<a onClick="return mV(\'Gen\',33,18);">Ge 33:18</a>f). This is doubtless the "portion" (Hebrew shekhem) spoken of in <a onClick="return mV(\'Gen\',48,22);">Ge 48:22</a>; although there it is said to have been taken with sword and bow from the Amorites. Where the pass of Shechem opens to the east, near the northern edge of the valley, lies the traditional tomb of Joseph. On the other side of the vale, close to the base of Gerizim, is the well universally known as Bir Ya\'qub, "the well of Jacob." The position meets perfectly the requirements of the narrative. The main road from the south splits a little to the east, one arm leading westward through the pass, the other going more directly to the north. It is probable that these paths follow pretty closely the ancient tracks; and both would be frequented in Jesus\' day. Which of them He took we cannot tell; but, in any case, this well lay in the fork between them, and could be approached with equal ease from either.<P>See <a href="study/isbe/search.html?string=SYCHAR">SYCHAR</A>.<P>2. Why Dug:<P>In the chapter quoted, it is said that Jacob dug the well (<a onClick="return mV(\'Jhn\',4,12);">Jhn 48:12</a>). The Old Testament says nothing of this. With the copious springs at \'Ain \'Askar and Balata, one might ask why a well should have been dug here at all. We must remember that in the East, very strict laws have always governed the use of water, especially when there were large herds to be considered. The purchase of land here may not have secured for Jacob such supplies as he required. There was danger of strife between rival herdsmen. The patriarch, therefore, may have dug the well in the interests of peace, and also to preserve his own independence.<P>3. Consensus of Tradition:<P>Jew, Samaritan, Moslem and Christian agree in associating this well with the patriarch Jacob. This creates a strong presumption in favor of the tradition: and there is no good reason to doubt its truth. Standing at the brink of the well, over-shadowed by the giant bulk of Gerizim, one feels how naturally it would be spoken of as "this mountain."<P>4. Description:<P>For long the well was unprotected, opening among the ruins of a vaulted chamber some feet below the surface of the ground. Major Anderson describes it (Recovery of Jerusalem, 465) as having "a narrow opening, just wide enough to allow the body of a man to pass through with arms uplifted, and this narrow neck, which is about 4 ft. long, opens into the well itself, which is cylindrically shaped, and about 7 ft. 6 inches in diameter. The mouth and upper part of the well are built of masonry, and the well appears to have been sunk through a mixture of alluvial soil and limestone fragments, till a compact bed of mountain limestone was reached, having horizontal strata which could be easily worked; and the interior of the well presents the appearance of having been lined throughout with rough masonry." The depth was doubtless much greater in ancient times; but much rubbish has fallen into it, and now it is not more than 75 ft. deep. It is fed by no spring, nor is the water conducted to it along the surface, as to a cistern. Its supplies depend entirely upon rainfall and percolation. Possibly, therefore, the water may never have approached the brim. The woman says "the well is deep." Pege, "spring," does not, therefore, strictly apply to it, but rather "tank" or "reservoir," phrear, the word actually used in verses <a onClick="return mV(\'Jhn\',4,11);">11</a>f. The modern inhabitants of Nablus highly esteem the "light" water of the well as compared with the "heavy" or "hard" water of the neighboring springs. It usually lasts till about the end of May; then the well is dry till the return of the rain. Its contents, therefore, differ from the "living" water of the perennial spring.<P>From the narratives of the pilgrims we learn that at different times churches have been built over the well. The Moslems probably demolished the last of them after the overthrow of the Crusaders in 1187. A description of the ruins with drawings, as they were 30 years ago, is given in PEF, II,174,etc. A stone found in 1881 may have been the original cover of the well. It measures 3 ft. 9 inches X 2 ft. 7 inches X 1 ft. 6 in. The aperture in the center <span class="noTag">is</span> 13 in. in diameter; and in its sides are grooves worn by the ropes used in drawing up the water (PEFS,1881,212ff).<P>5. Present Condition:<P>Some years ago the plot of ground containing the well was purchased by the authorities of the Greek church, and it has been surrounded by a wall. A chapel has been built over the well, and a large church building has also been erected beside it.``54';

isbe[4790]='Jada`ja\'-da (yadha\', "the knowing one"): Son of Onam and grandson of Jerahmeel by his wife Atarah (<a onClick="return mV(\'1Ch\',2,26,28,32);">1Ch 2:26, 28, 32</a>).``1';
isbe[4791]='Jadau`ja\'-do, ja-da\'-u (yiddo, Kethibh; yadday, Qere the King James Version; but the Revised Version (British and American) <a href="study/isbe/search.html?string=IDDO">IDDO</A>): In <a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>, one of those who had married foreign wives. the Revised Version margin has "Jaddai" (= "Edos," 1Esdras 9:35).`<a href="./study/isbe/search.html?string=IDDO">IDDO</a>`1';
isbe[4792]='Jaddai`jad\'-i, jad\'-a-i.`<a href="./study/isbe/search.html?string=IDDO">IDDO</a>; <a href="./study/isbe/search.html?string=JADAU">JADAU</a>`1';
isbe[4793]='Jaddua`jad\'-u-a, ja-du\'-a (yaddua\', "known"):<P>(1) One of the "chiefs of the people" who with Nehemiah sealed the covenant, thus signifying their voluntary acceptance of the law and their solemn promise to submit to its yoke (<a onClick="return mV(\'Neh\',10,21);">Ne 10:21 (Hebrew 22)</a>).<P>(2) Son of Jonathan or Johanan, and great-grandson of Eliashib, the high priest in Nehemiah\'s time (<a onClick="return mV(\'Neh\',12,11,22);">Ne 12:11, 22</a>). He is the last of the high priests mentioned in the Old Testament, and held office during the reign of Darius the Persian, i.e. Darius III Codomannus, the last king of Persia (336-332 BC), who was overthrown by Alexander the Great. It is doubtless to him that Josephus refers in his romantic account of Alexander\'s entrance into Jerusalem (Ant., XI, viii, 4f; vii, 2; viii, 7).``32';
isbe[4794]='Jaddus`jad\'-us (Codex Vaticanus, Iaddous; Codex Alexandrinus, Ioddous): the King James Version has "Addus" = Barzillai (<a onClick="return mV(\'Ezr\',2,61);">Ezr 2:61</a>; <a onClick="return mV(\'Neh\',7,63);">Ne 7:63</a>). Jaddus was removed from the office of the priesthood because he could not prove his right to it after the return to Jerusalem under Zerubbabel (1Esdras 5:38). He is called Barzillai in the. Old Testament, because he married Augia, the daughter of Zorzelleus (Barzillai the Gileadite, in the Old Testament).`<a href="./study/isbe/search.html?string=BARZILLAI">BARZILLAI</a>`1';
isbe[4795]='Jadon`ja\'-don (yadhon, perhaps "he will judge" or "plead"): One who helped to rebuild the wall of Jerusalem in company with the men of Gibeon and of Mizpah (<a onClick="return mV(\'Neh\',3,7);">Ne 3:7</a>). He is called the "Meronothite," and another Meronothite is referred to in <a onClick="return mV(\'1Ch\',27,30);">1Ch 27:30</a>, but there is no mention of a place Meronoth. Jadon is the name given by Josephus (Ant., VIII, viii, 5; ix, 1) to "the man of God" from Judah who confronted Jeroboam as he burned incense at the altar in Bethel, and who was afterward deceived by the lie of the old prophet (<a onClick="return mV(\'1Ki\',13,\'1-\');">1Ki 13</a>). Josephus may probably have meant Iddo the seer, whose visions concerning Jeroboam (<a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>) led to his being identified in Jewish tradition with "the man of God", from Judah.``32';
isbe[4796]='Jael`ja\'-el (ya\'el, "a wild or mountain goat," as in <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>; Iael): The wife of Heber the Kenite and the slayer of Sisera (<a onClick="return mV(\'Jdg\',4,\'17-22\');">Jud 4:17-22</a>; <a onClick="return mV(\'Jdg\',5,\'2-31\');">5:2-31</a>). Jael emerges from obscurity by this single deed, and by the kindest construction can hardly be said to have reached an enviable fame. The history of this event is clear. For years Jabin the king of Canaan had oppressed Israel. For twenty years the Israelites had been subject to him, and, in largest measure, the instrument of their subjugation had been Sisera, the king\'s general, the "man of the iron chariots." Deborah, a prophetess of Israel, by her passion for freedom, had roused the tribes of Israel to do battle against Sisera. They defeated him at "Taanach by the waters of Megiddo," but Sisera sought in flight to save himself. He came to the "oaks of the wanderers," where the tribe of Heber lived. Here he sought, and was probably invited, to take shelter in the tent of Jael (<a onClick="return mV(\'Jdg\',4,\'17-18\');">Jud 4:17-18</a>). There are two accounts of the subsequent events—one a prose narrative (<a onClick="return mV(\'Jdg\',4,\'19-22\');">Jud 4:19-22</a>), the other a poetic one, found in Deborah\'s song of triumph (<a onClick="return mV(\'Jdg\',5,\'24-27\');">Jud 5:24-27</a>). The two accounts are as nearly in agreement as could be expected, considering their difference in form.<P>It is evident that the tribe of Heber was regarded by both parties to the struggle as being neutral. They were descendants of Jethro, and hence, had the confidence of the Israelites. Though they had suffered somewhat at the hands of the Canaanites they had made a formal contract of peace with Jabin. Naturally Sisera could turn to the tents of Heber in Kedesh-naphtali with some confidence. The current laws of hospitality gave an added element of safety. Whether Jael met Sisera and urged him to enter her tent and rest (<a onClick="return mV(\'Jdg\',4,18);">Jud 4:18</a>), or only invited him after his appeal for refuge, the fact remains that he was her guest, was in the sanctuary of her home, and protected by the laws of hospitality: She gave him milk to drink, a mantle for covering, and apparently acquiesced in his request that she should stand guard at the tent and deny his presence to any pursuers. When sleep came to the wearied fugitive she took a "tent-pin, and took a hammer in her hand, and went softly unto him, and smote the pin into his temples" (<a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>), and having murdered him, goes forth to meet Barak the Israelite general and claims the credit for her deed. Some critics suggest that Sisera was not asleep when murdered, and thus try to convert Jael\'s treachery into strategy. But to kill your guest while he is drinking the milk of hospitality is little less culpable than to murder him while asleep. There is no evidence that Sisera offered Jael any insult or violence, and but little probability that she acted under any spiritual or Divine suggestion. It is really impossible to justify Jael\'s act, though it is not impossible to understand it or properly to appreciate Deborah\'s approval of the act as found in <a onClick="return mV(\'Jdg\',5,24);">Jud 5:24</a>. The motive of Jael may have been a mixed one. She may have been a sympathizer with Israel and with the religion of Israel. But the narrative scarcely warrants the interpretation that she felt herself as one called to render "stern justice on an enemy of God" (Expositor\'s Bible). Jael was unquestionably prudential. Sisera was in flight and Barak in pursuit. Probably her sympathy was with Barak, but certainly reflection would show her that it would not be wisdom to permit Barak to find Sisera in her tent. She knew, too, that death would be Sisera\'s portion should he be captured—therefore she would kill him and thus cement a friendship with the conqueror.<P>As to Deborah\'s praise of Jael (<a onClick="return mV(\'Jdg\',5,24);">Jud 5:24</a>), there is no call to think that in her hour of triumph she was either capable of or intending to appraise the moral quality of Jael\'s deed. Her country\'s enemy was dead and that too at the hand of a woman. The woman who would kill Sisera must be the friend of Israel. Deborah had no question of the propriety of meting out death to a defeated persecutor. Her times were not such as to raise this question. The method of his death mattered little to her, for all the laws of peace were abrogated in the times of war. Therefore Jael was blessed among women by all who loved Israel. Whether Deborah thought her also to be worthy of the blessing of God we may not tell. At any rate there is no need for us to try to justify the treachery of Jael in order to explain the words of Deborah.``158';
isbe[4797]='Jagur`ja\'-gur (yaghur): An unidentified town on the Edomite frontier of Judah in the south (<a onClick="return mV(\'Jos\',15,21);">Jos 15:21</a>).``1';
isbe[4798]='Jah`ja.`<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>`1';
isbe[4799]='Jahath`ja\'-hath (yachath, perhaps for yachteh, yachatheh, "he (God) will snatch up"):<P>(1) Son of Reaiah, son of Shobal, a descendant of Judah, and father of Ahumai and Lahad, the families of the Zorathites (<a onClick="return mV(\'1Ch\',4,2);">1Ch 4:2</a>).<P>(2) A frequent name for a descendant of Levi:<P class="in15">(a) Son of Libni, son of Gershom, the eldest son of Levi (<a onClick="return mV(\'1Ch\',6,20,43);">1Ch 6:20, 43 (Hebrew 6:5, 28)</a>, where "son of Libni" is omitted).<P class="in15">(b) Son of Shimei, son of Gershom (<a onClick="return mV(\'1Ch\',23,10);">1Ch 23:10</a>f).<P class="in15">(c) One of the "sons" of Shelomoth, a descendant of Izhar, son of Kohath, the second son of Levi (<a onClick="return mV(\'1Ch\',24,22);">1Ch 24:22</a>).<P class="in15">(d) A descendant of Merari, the third son of Levi, and an overseer in the repairing of the temple in the reign of Josiah (<a onClick="return mV(\'2Ch\',34,12);">2Ch 34:12</a>).``32';
isbe[4800]='Jahaz`ja\'-haz (yahats, <a onClick="return mV(\'Isa\',16,4);">Isa 16:4</a>; <a onClick="return mV(\'Jer\',48,34);">Jer 48:34</a>, yahatsah, or yahtsah, <a onClick="return mV(\'Num\',21,23);">Nu 21:23</a>; <a onClick="return mV(\'Deu\',2,32);">De 2:32</a>; <a onClick="return mV(\'Jos\',13,18);">Jos 13:18</a>; <a onClick="return mV(\'Jos\',21,36);">21:36</a>, the King James Version "Jahazah"; <a onClick="return mV(\'Jdg\',11,20);">Jud 11:20</a>; <a onClick="return mV(\'Jer\',48,21);">Jer 48:21</a>; <a onClick="return mV(\'1Ch\',6,78);">1Ch 6:78</a>, "Jahzah"): This is the place where in a great battle Israel overwhelmed Sihon king of the Amorites, and then took possession of all his territory (<a onClick="return mV(\'Num\',21,23);">Nu 21:23</a>, etc.). It is named along with Beth-baal-meon and Kedemoth (<a onClick="return mV(\'Jos\',13,18);">Jos 13:18</a>), with Kedemoth (<a onClick="return mV(\'Jos\',21,37);">Jos 21:37</a>) pointing to a position in the southeast of the Amorite territory. It was given to Reuben by Moses, and was one of the cities in the portion of that tribe assigned to the Merarite Levites. Mesha (MS, ll. 18 if) says that the king of Israel dwelt in Jahaz when at war with him. Mesha drove him out, and the city passed into the hands of Moab. It is referred to as a city of Moab in <a onClick="return mV(\'Isa\',15,4);">Isa 15:4</a>; <a onClick="return mV(\'Jer\',48,21,34);">Jer 48:21, 34</a>. Cheyne thinks that either Jahaz or Kedemoth must be represented today by the important ruins of Umm er-Recac, about 2 1/2 hours north of Dibon toward the desert (EB, under the word). No certain identification is possible.``54';
