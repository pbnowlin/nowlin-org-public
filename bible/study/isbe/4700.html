isbe[4704]='Israel, History of, 1<B>`INTRODUCTORY</b><P>1. Sources<P class="in15">(1) The Old Testament<P class="in15">(2) Josephus<P class="in15">(3) The Monuments<P>2. Religious Character of the History<P><b>I. ORIGINS OF ISRAEL IN PRE-MOSAIC TIMES</b><P>1. Original Home<P>2. Ethnographical Origin<P>3. Patriarchal Origins and History<P class="in15">(1) Patriarchal Conditions—<span class="noTag">Genesis 14</span><P class="in15">(2) Ideas of God<P class="in15">(3) Descent into Egypt<P><b>II. NATIONALITY UNDER MOSES</b><P>1. Israel in Egypt<P class="in15">(1) Chronology<P class="in15">(2) Moses<P>2. Historical Character of the Exodus<P class="in15">(1) Egyptian Version of the Exodus<P class="in15">(2) Geographical Matters<P class="in15">(3) The Wilderness Sojourn<P class="in15">(4) Entrance into Canaan<P><b>III. PERIOD OF THE JUDGES</b><P>1. General Character of Period<P>2. The Different Judges<P>3. Chronology of the Period<P>4. Loose Organization of the People<P><b>IV. THE KINGDOM: ISRAEL—JUDAH</b><P>1. Samuel<P>2. The Kingdom of Saul<P>3. David<P>4. Solomon<P>5. Division of the Kingdom<P>6. Sources of the History of the Kingdom<P>7. Chronological Matters<P><b>V. PERIOD OF THE SEPARATED KINGDOMS</b><P>1. Contrasts and Vicissitudes of the Kingdoms<P>2. The Successive Reigns<P>3. The Literary Prophets<P><b>VI. TIME OF THE BABYLONIAN EXILE</b><P>1. Influence of the Exile<P>2. Daniel<P>3. Elephantine Papyri<P><b>VII. RETURN FROM THE EXILE AND THE RESTORATION</b><P>1. Career of Cyrus<P>2. First Return under Zerubbabel<P class="in15">(1) Building of the Temple<P class="in15">(2) Haggai and Zechariah<P>3. Ezra and Nehemiah<P>Malachi<P><b>VIII. THE JEWS UNDER ALEXANDER AND HIS SUCCESSORS</b><P>1. Spread of Hellenism<P>2. The Hasmoneans<p>3. Herod<P><b>IX. THE ROMANS</b><P>1. Division of Territory<P>2. Destruction of Jerusalem by the Romans<P class="in15">Later Insurrection of Bar-Cochba<P>3. Spiritual Life of Period<P>Appearance of Jesus Christ<P><b>LITERATURE</b><hr /><P>Introductory.<P>1. Sources:<P>The chief and best source from which we can learn who this people was and what was its history is the Bible itself, especially the Old Testament, which tells us the story of this people from its earliest beginnings.<P>(1) The Old Testament.<P>The origins of Israel are narrated in Genesis; the establishment of theocracy, in the other books of the Pentateuch; the entrance into Canaan, in the Book of Joshua; the period preceding the kings, in the Book of Judges; the establishment of the monarchy and its development, in the Books of Samuel, and the opening chapters of the Books of Kings, which latter report also the division into two kingdoms and the history of these down to their overthrow. The Books of Chronicles contain, parallel with the books already mentioned, a survey of the historical development from Adam down to the Babylonian captivity, but confine this account to theocratical center of this history and its sphere. Connected with Chronicles are found the small Books of Ezra and Nehemiah, which probably originally constituted a part of Chronicles, but which pass over the Exile and begin at once with the story of the Return. Then, too, these two books contain only certain episodes in the history of the Return, which were of importance for the restoration of the Jewish theocracy, so that the story found in them is anything but complete. With the 5th century BC the Biblical narrative closes entirely. For the succeeding centuries we have nothing but some scattered data; but for the 2nd pre-Christian century we have a new source in the Books of the Maccabees, which give a connected account of the struggles and the rule of the Asmoneans, which reach, however, only from 174 to 135 BC.<P>The historical value of the Old Testament books is all the greater the nearer the narrator or his sources stand in point of time to the events that are recorded; e.g. the contents of the Books of Kings have in general greater value as historical sources than what is reported in the Books of Chronicles, written at a much later period. Yet it is possible that a later chronicler could have made use of old sources which earlier narrators had failed to employ. This is the actual state of affairs in connection with a considerable number of matters reported by the Biblical chroniclers, which supplement the exceedingly meager extracts furnished by the author of the Books of Kings. Then, further, the books of the prophets possess an extraordinary value as historical sources for the special reason that they furnish illustrations of the historical situation and events from the lips of contemporaries. As an example we can refer to the externally flourishing condition of the kingdom of Judah under King Uzziah, concerning which the Books of Kings report practically nothing, but of which Chronicles give details which are confirmed by the testimony of Isaiah.<P>(2) Josephus.<P>A connected account of the history of Israel has been furnished by Flavius Josephus. His work entitled Jewish Antiquities, however, as far as trustworthiness is concerned, is again considerably inferior to the Books of Chronicles, since the later traditions of the Jews to a still greater extent influenced his account. Only in those cases in which he could make use of foreign older sources, such as the Egyptian Manetho or Phoenician authors, does he furnish us with valuable material. Then for the last few centuries preceding his age, he fills out a certain want. Especially is he the best authority for the events which he himself passed through and which he reports in his work on the Jewish Wars, even if he is not free from certain personal prejudices (see <a href="study/isbe/search.html?string=JOSEPHUS">JOSEPHUS</a>). For the customs and usages of the later Jewish times the traditions deposited in the Talmud are also to be considered. Much less than to Josephus can any historical value be credited to the Alexandrian Jew, Philo. The foreign authors, e.g. the Greek and the Latin historians, contain data only for the story of the nations surrounding Israel, but not for the early history of Israel itself.<P>(3) The Monuments.<P>On the other hand, the early history of Israel has been wonderfully enriched in recent times through the testimonies of the monuments. In Palestine itself the finds in historical data and monuments have been, up to the present time, rather meager. Yet the excavations on the sites of ancient Taanach, Megiddo, Jericho, Gezer and Samaria have brought important material to light, and we have reasons to look for further archaeological and literary finds, which may throw a clear light on many points that have remained dark and uncertain. Also in lands round about Palestine, important documents (the Moabite Stone; Phoenician inscriptions) have already been found. Especially have the discovery and interpretation of the monuments found in Egypt, Assyria and Babylonia very materially advanced our knowledge of the history of Israel. Not only has the connection of the history of this people with universal history been clearly illuminated by these finds, but the history of Israel itself has gained in tangible reality. In some detail matters, traditional ideas have given way to clearer conceptions; e.g. the chronology of the Old Testament, through Assyriological research, has been set on a safer foundation. But all in all, these archaeological discoveries have confirmed the confidence that has been placed in the Biblical historical sources.<P>2. Religious Character of the History:<P>It is true that the rules applied to profane history cannot, without modification, be applied to the historical writings of the Hebrews. The Biblical narrators are concerned about something more than the preservation of historical facts and data. Just as little is it their purpose to glorify their people or their rulers, as this is done on the memorial tablets of the Egyptian the Assyrian, and the Babylonian kings. Looked at merely from the standpoint of profane history, there are many omissions in the Old Testament historical books that are found objectionable. Sometimes whole periods are passed over or treated very briefly. Then, too, the political pragmatism, the secular connection in the movements of the nations and historical events, are often scarcely mentioned. The standpoint of the writer is the religious. This appears in the fact that this history begins with the creation of the world and reports primitive traditions concerning the origin of mankind and their earliest history in the light of the revelation of the God of Israel, and that it makes this national history a member in the general historical development of mankind. Nor was this first done by the author of the Pentateuch in its present shape. Already the different documentary sources found combined in the Pentateuch, namely E (Elohist), J (Jahwist) and P (Priestly Code), depict the history of Israel according to the plan which the Creator of the world had with this people. Also, when they narrate the national vicissitudes of Israel, the writers are concerned chiefly to exhibit clearly the providential guidance of God. They give special prominence to those events in which the hand of God manifests itself, and describe with full detail the lives of those agents of whom Yahweh made use in order to guide His people, such as Moses, Samuel, David, Solomon and others. But it is not the glory of these men themselves that the writers aim to describe, but rather their importance for the spiritual and religious greatness of Israel. Let us note in this connection only the extreme brevity with which the politically successful wars of David are reported in 2 Samuel; and how fragmentary are the notices in which the author of the Books of Kings reports the reigns of the different kings; and how briefly he refers for all the other details of these kings to books that, unfortunately, have been lost for us. But, on the other hand, how full are the details when the Bible gives us its account of the early history of a Samuel or of a David, in which the providential guidance and protection of Yahweh appear in such a tangible form; or when it describes the building of the temple by Solomon, so epoch-making for the religious history of Israel, or the activity of such leading prophets as Elijah and Elisha. Much less the deeds of man than the deeds of God in the midst of His people constitute theme of the narrators. These facts explain, too, the phenomenal impartiality, otherwise unknown in ancient literatures, with which the weaknesses and the faults of the ancestors and kings of Israel are reported by the Biblical writers, even in the case of their most revered kings, or with which even the most disgraceful defeats of the people are narrated.<P>It cannot indeed be denied that this religious and fundamental characteristic is not found to the same degree in all the books and sources. The oldest narratives concerning Jacob, Joseph, the Judges, David and others reveal a naive and childlike naturalness, while in the Books of Chronicles only those things have been admitted which are in harmony with the regular cult. The stories of a Samson, Jephthah, Abimelech, Barak, and others impress us often as the myths or stories of old heroes, such as we find in the traditions of other nations. But the author of the Book of Judges, who wrote the introduction to the work, describes the whole story from the standpoint of edification. And when closely examined, it is found that the religious element is not lacking, even in the primitive and naive Old Testament narrative. This factor was, from the outset, a unique characteristic of the people and its history. To this factor Israel owed its individuality and existence as a separate people among the nations. But in course of time it became more and more conscious of its mission of being the people of Yahweh on earth, and it learned to understand its entire history from this viewpoint. Accordingly, any account of Israel\'s history must pay special attention to its religious development. For the significance of this history lies for us in this, that it constitutes the preparation for the highest revelation in Christ Jesus. In its innermost heart and kernel it is the history of the redemption of mankind. This it is that gives to this history its phenomenal character. The persons and the events that constitute this history must not be measured by the standards of everyday life. If in this history we find the providential activities of the living God operative in a unique way, this need not strike us as strange, since also the full fruit of this historical development, namely the appearance of Jesus Christ, transcends by far the ordinary course of human history. On the other hand, this history of Israel is not to be regarded as a purely isolated factor. Modern researches have shown how intimately this history was interwoven with that of other nations. Already, between the religious forms of the Old Testament and those of other Semitic peoples, there have been found many relations. Religious expressions and forms of worship among the Israelites often show in language and in cult a similarity to those of the ancient Canaanites, the Phoenicians, the Syrians, the Babylonians, and the Egyptians. But it is a mistake to believe that the history and the religion of Israel are merely an offspring of the Babylonian. As the Israelites clung tenaciously to their national life, even when they were surrounded by powerful nations, or were even scattered among these nations, as in the Exile, thus too their religion, at least in its official representatives, has been able at all times to preserve a very high originality and independence under the influence of the Divine Spirit, who had filled it.<P>I. Origins of Israel in Pre-Mosaic Times.<P>1. Original Home:<P>The Israelites knew at all times that Canaan was not their original home, but that their ancestors had immigrated into this land. What was their earlier and earliest home? Tradition states that they immigrated from Haran in the upper Euphrates valley. But it is claimed that they came to Haran from Ur of the Chaldees, i.e. from a city in Southern Babylonia, now called Mugheir. This city of Ur, now well known from Babylonian inscriptions, was certainly not the original home of the ancestors of Israel. They rather belonged to a purely Semitic tribe, which had found its way from Northern Arabia into these districts. A striking confirmation of this view is found in a mural picture on the rock-tombs of Benihassan in Upper Egypt. The foreigners, of whom pictures are here given (from the time of the XIIth Dynasty), called Amu, namely Bedouins from Northern Arabia or from the Sinai peninsula, show such indisputable Jewish physiognomies that they must have been closely related to the stock of Abraham. Then, too, the leader of the caravan, Ebsha\'a (Abishua), has a name formed just like that of Abraham. When, in later times, Moses fled to the country of the Midianites, he doubtless was welcomed by such tribal relatives.<P>2. Ethnographical Origin:<P>The Israelites at all times laid stress on their ethnographical connection with other nations. They knew that they were intimately related to a group of peoples who have the name of Hebrews. But they traced their origin still farther back to the tribal founder, Shem. Linguistics and ethnology confirm, in general, the closer connection between the Semitic tribes mentioned in <a onClick="return mV(\'Gen\',10,21);">Ge 10:21</a>ff. Undeniable is this connection in the cases of Assur, Aram, and the different Arabian tribes. A narrower group of Semites is called Hebrews. This term is used in Genesis in a wider sense of the word than is the case in later times, when it was employed as a synonym for Israel. According to its etymology, the word signified "those beyond," those who live on the other side of the river or have come over from the other side. The river meant is not the Jordan, but the Euphrates. About the same time that the ancestors of Israel were immigrating into Canaan and Egypt, other tribes also emigrated westward and were called, by the Canaanites and by the Egyptians, \'ibhrim. This term is identical with Chabiri, found in the Tell el-Amarna Letters, in which complaint is made about the inroads of such tribes. The Israelites cannot have been meant here, but related tribes are. Possibly the Egyptian Apriu is the same word.<P>3. Patriarchal Origins and History:<P>The Israelites declared that they were descended from a particular family. On account of the patriarchal characcter of their old tribal life, it is not a matter of doubt that, as a fact, the tribe did grow out of a single family. The tribal father, Abraham, was without a doubt the head of the small tribe, which through its large family of children developed into different tribes. Only we must not forget that such a tribe could rapidly be enlarged by receiving into it also serfs and clients (compare <a onClick="return mV(\'Gen\',14,14);">Ge 14:14</a>). These last-mentioned also regarded the head of the tribe as their father and considered themselves as his "sons," without really being his descendants. Possibly the tribe that immigrated first to Haran and from there to Canaan was already more numerous than would seem to be the case according to tradition, which takes into consideration only the leading personalities. Secondly, we must remember that the Israelites, because of their patriarchal life, had become accustomed to clothe all the relations of nations to nations in the scheme of the family. In this way such genealogies of nations as are found in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a> and <a onClick="return mV(\'Gen\',11,\'1-\');">11</A> originated. Here peoples, cities and countries have also been placed in the genealogies, without the author himself thinking of individual persons in this connection, who had borne the names, e.g. of Mizraim (Egypt), Gush (Ethiopia), etc., and were actually sons of Ham. The purpose of the genealogy in this form is to express only the closer or more remote relationship or connection to a group of nations. <a onClick="return mV(\'Gen\',25,1);">Ge 25:1</a>ff also is a telling example, showing how independently these groups are united. A new wife (Keturah) does not at this place fit into the family history of Abraham. But the writer still wants to make mention of an Arabian group, which was also related to Israel by blood, but in fact stood more distant from the Israelites than did the Ishmaelites. Out of this systematic further development of the living tradition, however, one difficulty arises. It is not in all places easy, indeed not always possible, to draw the line between what is reliable tradition and what is a freer continuation. But it is a misinterpretation of the historical situation, when the entire history of the patriarchs is declared to be incredible, and when in such sharply defined personalities as Abraham, Jacob, Joseph, and others, only personifications of tribes are found, the later history of which tribes is said to be embodied in the lives of these men; e.g. the name Abraham cannot have been the impersonal name of a tribe or of a god. It is found as the name of a person on old Babylonian tablets (Abu ramu); but originally in the nomadic tribe was doubtless pronounced \'abhi ram, i.e. "My father (God) is exalted." The same is true of the name Jacob (really Jakob-el); compare Joseph (Joseph-el), Ishmael, and others, which find their analogies in old Arabian names.<P>(1) Patriarchal Conditions—<a onClick="return mV(\'Gen\',14,\'1-\');">Genesis 14</a>.<P>Further, the conditions of life which are presupposed in the history of the Patriarchs are in perfect agreement with those which from the Tell el-Amarna Letters we learn existed in Canaan. While formerly it was maintained that it would have been impossible for a single tribe to force its way into Canaan at that time when the country was thickly populated, it is now known that at that very time when the ancestors of the Israelites entered, similar tribes also found their way into the land, sometimes in a peaceable way, sometimes by force. Egypt for the time being had control of the land, but its supremacy was at no place very strong. And the \'ibhrim, as did others who forced their way into the country, caused the inhabitants much trouble. Especially does <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, the only episode in which a piece of universal history finds its way into the story of the tribal ancestors, turn out to be a document of great value, which reflects beautifully the condition of affairs in Asia. Such expeditions for conquest in the direction of the Mediterranean lands were undertaken at an early period by Babylonian rulers, Sargon I of Akkad and his son Naram Sin. The latter undertook an expedition to the land of Magan along the exact way of the expedition described in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, this taking place in the days of Amraphel, i.e. Hammurabi. The fact that the latter was himself under an Elamitic superior is in perfect agreement with the story of the inscriptions, according to which the famous Hammurabi of Babylon had first freed himself from the supremacy of Elam. The fact that Hammurabi, according to accepted chronology, ruled shortly after the year 2000 BC, is also in agreement with Biblical chronology, which places Abraham in this very time. These expeditions into the country Martu, as the Babylonians call Syria, had for their purpose chiefly to secure booty and to levy tribute. That the allied kings themselves took part in this expedition is not probable. These were punitive expeditions undertaken with a small force.<P><a onClick="return mV(\'Gen\',14,\'1-\');">Genesis 14</a> seems to be a translation of an old cuneiform tablet. As a rule the stories of the patriarchal age for a long time were handed down orally, and naturally were modified to a certain extent. Then, too, scholars have long since discovered different sources, out of which the story in its present form has been compiled. This fact explains some irregularities in the story: e.g. the chronological data of the document the Priestly Code (P), which arranges its contents systematically, do not always harmonize with the order of events as reported by the other two leading documents, the Elohist (E) and the Jahwist (Jahwist), the first of which is perhaps the Ephraimitic and the second the Judaic version of the story. But, under all circumstances, much greater than the difference are the agreements of the sources. They contain the same picture of this period, which certainly has not been modified to glorify the participants. It is easily seen that the situation of the fathers, when they were strangers in the land, was anything but comfortable. A poetical or perfectly fictitious popular account would have told altogether different deeds of heroism of the founder of the people. The weaknesses and the faults of the fathers and mothers in the patriarchal families are not passed over in silence. But the fact that Yahweh, whom they trusted at all times, helped them through and did not suffer them to be destroyed, but in them laid the foundation for the future of His people, is the golden cord that runs through the whole history. And in this the difference between the individual characters finds a sharp expression; e.g. Abraham\'s magnanimity and tender feeling of honor in reference to his advantage in worldly matters find their expression in narratives which are ascribed to altogether different sources, as <a onClick="return mV(\'Gen\',13,8);">Ge 13:8</a>ff (Jahwist); <a onClick="return mV(\'Gen\',14,22);">14:22</A>ff (special source); <a onClick="return mV(\'Gen\',23,7);">23:7</A>ff (P). In what an altogether different way Jacob insists upon his advantage! This consistency in the way in which the different characters are portrayed must awaken confidence in the historical character of the narratives. Then, too, the harmony with Egyptian manners and customs in the story of Joseph, even in its minutest details, as these have been emphasized particularly by the Egyptologist Ebers, speaks for this historical trustworthiness.<P>(2) Ideas of God.<P>Further, the conception of God as held by these fathers was still of a primitive character, but it contains the elements of the later religious development (see <a href="study/isbe/search.html?string=ISRAEL,+RELIGION+OF,+1">ISRAEL, RELIGION OF</a>).<P>(3) Descent into Egypt.<P>During a long period of famine the sons of Jacob, through Divine providence, which made use of Joseph as an instrument, found refuge in Egypt, in the marshes of which country along the lower Nile Semitic tribes had not seldom had their temporary abodes. The land of Coshen in the northeast part of the Delta, Ed. Naville (The Shrine of Saft-el-Henneh and the Land of Goshen, London, 1887) has shown to be the region about Phakusa (Saft-el-Henneh). These regions had at that time not yet been made a part of the strictly organized and governed country of Egypt, and could accordingly still be left to such nomadic tribes. For the sons of Jacob were still wandering shepherds, even if they did, here and there, after the manner of such tribes, change to agricultural pursuits (<a onClick="return mV(\'Gen\',26,12);">Ge 26:12</a>). If, as is probable, at that time a dynasty of Semitic Hyksos was ruling in lower Egypt, it is all the more easily understood that kindred tribes of this character were fond of settling along these border districts. On account of the fertility of the amply watered districts, men and animals could increase rapidly, and the virile tribe could, in the course of a few centuries, grow into a powerful nation. One portion of the tribes pastured their flocks back and forth on the prairies; another builded houses for themselves among the Egyptians and engaged in agricultural pursuits and in gardening (<a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>). Egyptian arts and trades also found their way among this people, as also doubtless the art of writing, at least in the case of certain individuals. In this way their sojourning in this country became a fruitful factor in the education of the people. This stay explains in part the fact that the Israelites at all times were more receptive of culture and were more capable than their kinsmen, the Edomites, Ammonites and Moabites, and others in this respect. Moses, like Joseph, had learned all the mysteries of Egyptian wisdom. On the other hand, the sojourn in this old, civilized country was a danger to the religion of the people of Israel. According to the testimony of <a onClick="return mV(\'Jos\',24,14);">Jos 24:14</a>; <a onClick="return mV(\'Eze\',20,7);">Eze 20:7</a>ff; <a onClick="return mV(\'Eze\',23,8,19);">23:8,19</a>, they adopted many heathen customs from their neighbors. It was salutary for them, that the memory of this sojourn was embittered for them by hard oppression.<P>II. Nationality under Moses.<P>1. Israel in Egypt:<P>It is reported in <a onClick="return mV(\'Exd\',18,\'1-\');">Ex 18</a> that a new Pharaoh ascended the throne, who knew nothing of Joseph. This doubtless means that a new dynasty came into power, which adopted a new policy in the treatment of the Semitic neighbors. The expulsion of the Hyksos had preceded this, and the opposition to the Semitics had become more acute. The new government developed a strong tendency to expansion in the direction of the northeast. Under these circumstances it is not surprising that the laws of the empire were vigorously enforced in these border districts and that an end was made to the liberties of the unwelcome shepherd tribes. This led to constantly increasing measures of severity. In this way the people became more and more unhappy and finally were forced to immigrate.<P>(1) Chronology.<P>It is still the current conviction that the Pharaoh of the oppression was Rameses II, a king who was extraordinarily ambitious of building, whose long reign is by Eduard Meyer placed as late as 1310 to 1244 BC. His son Merenptah would then be the Pharaoh of the Exodus. But on this supposition, Biblical chronology not only becomes involved in serious difficulties, since then the time of the Judges must be cut down to unduly small proportions, but certain definite data also speak in favor of an earlier date for the Exodus of Israel. Merenptah boasts in an inscription that on an expedition to Syria he destroyed the men of Israel (which name occurs here for the first time on an Egyptian monument). And even the father of Rameses II, namely Seti, mentions Asher among those whom he conquered in Northern Palestine, that is, in the district afterward occupied by this tribe. These data justify the view that the Exodus already took place in the time of the XVIIIth Dynasty, a thing in itself probable, since the energetic rulers of this dynasty naturally have inaugurated a new method of treating this province. The oppression of Israel would then, perhaps, be the work of Thethroes III (according to Meyer, 1501-1447 BC), and the Exodus would take place under his successor, Amenophis II. In harmony with this is the claim of Manetho, who declares that the "Lepers," in whom we recognize the Israelites (see below), were expelled by King Amenophis.<P>The length of the sojourn of the Israelites in Egypt, according to <a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a> (P), was in round numbers 400 years; more exactly, according to <a onClick="return mV(\'Exd\',12,40);">Ex 12:40</a>f (P), 430 years. But the last-mentioned passage in Septuagint reads, "the sojourn of the sons of Jacob, when they lived in Egypt and in the land of Canaan." (The same reading is found in the Samaritan text, only that the land of Canaan precedes that of Egypt.) Since, according to this source (P), the Patriarchs lived 215 years in Canaan, the sojourn in Egypt would be reduced also 215 years. This is the way in which the synagogue reckons (compare <a onClick="return mV(\'Gal\',3,17);">Ga 3:17</a>), as also Josephus (Ant., II, xv, 2). In favor of this shorter period appeal is made to the genealogical lists, which, however, because they are incomplete, cannot decide the matter. In favor of a longer duration of this sojourn we can appeal, not only to <a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a> Septuagint has the same!), but also to the large number of those who left Egypt according to <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1</a> and <a onClick="return mV(\'Num\',26,\'1-\');">26</A> (P), even if the number of 600,000 men there mentioned, which would presuppose a nation of about two million souls, is based on a later calculation and gives us an impossible conception of the Exodus.<P>(2) Moses.<P>While no account has been preserved concerning the sojourn of the Israelites in Egypt, the history of the Exodus itself, which signifies the birth of Israel as a nation, is fully reported. In this crisis Moses is the prophetical mediator through whom the wonderful deed of God is accomplished. All the deeds of God, when interpreted by this prophet, become revelations for the people. Moses himself had no other authority or power than that which was secured for him through his office as the organ of God. He was the human instrument to bring about the synthesis between Israel and Yahweh for all times. He had, in doing this, indeed proclaimed the old God of the fathers, but under the new, or at any rate hitherto to the people unknown, name of Yahweh, which is a characteristic mark of the Mosaic revelations to such an extent, that the more accurate narrators (E and P) begin to make use of this name only from this period of time on. In the name of this absolute sovereign, God, Moses claims liberty for Israel, since this people was Yahweh\'s firstborn (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>). The contest which Moses carries on in the name of this God with Pharaoh becomes more and more a struggle between this God and the gods of Egypt, whose earthly representative Pharaoh is. The plagues which come over Egypt are all founded on the natural conditions of the country, but they occur in such extraordinary strength and rapidity at Moses\' prediction, and even appear at his command, that they convince the people, and finally Pharaoh himself, of the omnipotence of this God on the soil of this country. In the same way the act of deliverance at the Red Sea can be explained as the cooperation of natural causes, namely wind and tide. But the fact that these elementary. forces, just at this critical time, proved so serviceable to the people of God and destructive to their enemies, shows unmistakably the miraculous activity of God. This the Israelites experienced still further on the journey through the desert, when they were entirely dependent on Divine leadership and care. The outcome of these experiences, and at the same time its grandest demonstration, was the conclusion of the covenant at Mt. Sinai. From this time on Yahweh was Israel\'s God and Israel was the people of Yahweh. This God claimed to be the only and absolute ruler over the tribes that were now inwardly united into one nation. From this resulted as a matter of course, that Moses as the recognized organ of this God was not only the authority, who was to decide in all disputes concerning right, but also the one from whom a new and complete order of legal enactments proceeded. Moses became the lawgiver of Israel.<P>Even if the history of the origin of the Old Testament covenant is unique in character, it is nevertheless profitable to take note of an analogy which is found in a related people and which is adapted to make much in Israel\'s history clearer. Mohammed also, after he had at the critical point of his career persuaded his followers to migrate from their homes, soon after, in Medina, concluded a covenant, according to which he, as the recognized speaker of Allah (God), claimed for himself the right to decide in all disputes. He, too, in his capacity as the prophet of God, was consulted as an infallible authority in all questions pertaining to the cult, the civil and the criminal laws, as also in matters pertaining to politics and to war. And his decisions and judgments, uttered in the name of Allah, were written down and afterward collected. This Koran, too, became the basis of sacred law. And by causing the hitherto divided and antagonistic tribes to subject themselves to Allah, Mohammed united these his followers into a religious communion and in this way, too, into a national body. Mohammed has indeed copied the prophecy of earlier times, but the work of Moses was original in character and truly inspired by God.<P>2. Historical Character of the Exodus:<P>The historical character of the exodus out of Egypt cannot be a matter of doubt, though some suspect that the entire nation did not take part in the march through the Red Sea, but that certain tribes had before this already migrated toward the East. We must not forget that the song of victory in <a onClick="return mV(\'Exd\',15,\'1-\');">Ex 15</a> does not mention a word about Pharaoh\'s being himself destroyed in going through the Sea. It is only the late <a onClick="return mV(\'Psa\',136,15);">Ps 136:15</a> that presupposes this as a certainty. That an entire nation cannot emigrate in a single night cannot be maintained in view of the fact that the inhabitants of the same Wady-Tumilat, through which Israel marched, so late as the last century, emigrated in a single night and for similar reasons (compare Sayce, Monuments, 249).<P>(1) Egyptian Version of the Exodus.<P>The fact that the Egyptian monuments report nothing of this episode, so disgraceful to that people, is a matter of course, in view of the official character of these accounts and of their policy of passing over in absolute silence all disagreeable facts. And yet in the popular tradition of the people, which Manetho has handed down, there has been preserved some evidence of this event. It is indeed true that what this author reports about the Hyksos (see above) does not belong here, as this people is not, as Josephus thinks, identical with the Israelites. However (Apion, I, xxvi, 5ff), he narrates a story which may easily be the tradition concerning the exodus of the children of Israel as changed by popular use. King Amenophis, we are told, wanted to see the gods. A seer, who bore the same name, promised that his wish would be gratified under the condition that the country would be cleansed of lepers and all others that were unclean; and it is said that he accordingly drove 80,000 such persons into the stone quarries east of the Nile. As the seer was afraid that these measures would be displeasing to the gods and bring upon the land a subjection of 13 years to the supremacy of foreigners, he gave up to these lepers the former city of the Hyksos, Avaris by name. Here they appointed a priest by the name of Osarsiph, later called Moses, as their chief, who gave them a special body of laws and in these did not spare the sacred animals. He also carried on war against the Egyptians, the Hyksos helping him, and he even governed Egypt for 13 years, after which he and his followers were driven out into Syria. Similar stories are found in Chaeromon, Lysimachus, and others (Apion, I, xxxii, 36; compare Tacitus, History, verses 3-5). When we remember that it is nonsense to permit lepers to work in stone quarries and that the Egyptians also otherwise call the Semites Aatu, i.e. "plague," then this story must be regarded as referring to such a non-Egyptian nation. Hecataeus of Abdera has a report of this matter which is much more like the Biblical story, to the effect, namely, that a plague which had broken out in Egypt led the people to believe that the gods were angry at the Egyptians because they had neglected the religious cult; for which reason they expelled all foreigners. A part of these is said to have migrated under the leadership of Moses to Judea and there to have founded the city of Jerusalem (compare Diodorus Siculus xl.3; compare xxxvi.1).<P>(2) Geographical Matters.<P>The Red Sea, through which the Israelites went under the leadership of Moses, is without a doubt the northern extension of this body of water, which in former times reached farther inland than the present Gulf of Suez; compare Edouard Naville, The Store-City of Pithom and the Route of the Exodus, 1885; and The Route of the Exodus, 1891. This savant is entitled to the credit of having identified the station Sukkoth on the basis of the monuments; it is the modern Tell-Mashuta and identical with Pithom, which was the name of the sanctuary at that place. Later the city was called Heroopoils. The route accordingly went through the modern Wadi-Tumilat to the modern Bitter Sea, north of Suez. It is a more difficult task to trace the route geographically on the other side of the Sea. For it is a question whether "the Mountain of Yahweh," which formed the goal of the journey, is to be located on the Sinai peninsula, or in the land of the Edomites, or even on the western coast of Arabia. A.H. Sayce and others reject the traditional location of Sinai on the peninsula named after this mountain, and declare that the Israelites marched directly eastward toward the Gulf of Akaba. The reasons for this are found in the work of Sayce, The Verdict of the Monuments, 263ff. But even if on this supposition a number of difficulties fall away, there nevertheless are many arguments in favor of the traditional location of Sinai, especially the grandeur of the chain itself, for which a rival worth mentioning has not been discovered in the land of the Edomites or in Northwestern Arabia. The Sinai traveler, E. H. Palmer, has also shown how splendidly the surroundings of the Sinai chain, especially the Jebel Musa with the Ras Sufsafeh, is adapted for the purpose of concluding a covenant.<P>(3) The Wilderness Sojourn.<P>The duration of the sojourn in the "desert" is everywhere (as in <a onClick="return mV(\'Amo\',5,25);">Am 5:25</a>) given as 40 years. In harmony with this is the fact that only a few of those who had come out of Egypt lived to enter Canaan. The greater part of these 40 years the Israelites seem to have spent at Kadesh. At any rate, there was a sanctuary at that place, at which Moses administered justice, while the different tribes probably were scattered over the prairies and over the tillable districts. The central sanctuary, which Moses established, was the Tabernacle, which contained the Ark of the Covenant, the sanctissimum. This sacred ark with the cherubim above it represents the throne of God, who is thought to be enthroned above the cherubim. The ark itself is, as it were, His footstool. As in Egyptian sanctuaries not infrequently the most sacred laws are deposited beneath the feet of the statue of the gods, thus the sacred fundamental laws of God (the Decalogue), on two tablets, were deposited in this ark. This Ark of the Covenant presupposes an invisible God, who cannot be represented by any image. The other laws and ordinances of Moses covered the entire public and private legislation, given whenever the need for these made it necessary to determine such matters. In giving these laws Moses connected his system with the old traditional principles already current among the tribes. This fact is confirmed by the legal Code of Hammurabi, which contains remarkable parallels, especially to <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20-23:19</a>. But Moses has elevated the old traditional laws of the tribes and has given them a more humane character. By putting every enactment in the light of the religion of Yahweh, and by eliminating everything not in harmony with this religion, he has raised the people spiritually and morally to a higher plane.<P>Among the people, the undercurrents of superstition and of immorality were indeed still strong. At the outset Moses had much to contend with in the opposition of the badly mixed mass of the people. And the fact that he was able for the period of 40 years to hold the leadership of this stubborn people without military force is a phenomenal work, which shows at all hands the wonderful cooperation of Yahweh Himself. However, he did not indeed succeed in raising the entire people to the plane of his knowledge of God and of his faith in God. This generation had to die in the wilderness, because it lacked the sanctified courage to take possession of the land of promise. But the foundation had been laid for theocracy, which must not in any way be identified with a hierarchy.<P>(4) Entrance into Canaan.<P>It was Joshua, the successor of Moses, who was enabled to finish the work and to take possession of the land. Not far from Jericho he led the people over the Jordan and captured this city, which had been considered impregnable. After that, with his national army, he conquered the Canaanitish inhabitants in several decisive battles, near Gibeon and at the waters of Merom, and then went back and encamped at Gilgal on the Jordan. After this he advanced with his tribe of Ephraim into the heart of the land, while the southern tribes on their part forced their way into the districts assigned to them. Without reasons this account has been attacked as unreliable, and critics have thought that originally the different tribes, at their own initiative, either peaceably or by force, had occupied their land. But it is entirely natural to suppose that the inhabitants of the country who had allied themselves to resist this occupation by Israel, had first to be made submissive through several decisive defeats, before they would permit the entrance of the tribes of Israel, which entrance accordingly often took place without a serious struggle. That the occupation of the land was not complete is shown in detail in <a onClick="return mV(\'Jdg\',1,\'1-\');">Jud 1</a>. Also in those districts in which Israel had gained the upper hand, they generally did not wage the war of annihilation that Moses had commanded, but were content with making the Canaanites, by the side of whom they settled, bondsmen and subjects. This relation could, in later time, easily be reversed, especially in those cases in which the original inhabitants of the country were in the majority. Then, too, it must be remembered that the latter enjoyed a higher state of civilization than the Israelites. It was accordingly an easy matter for the Israelites to adopt the customs and the ideas of the Canaanites. But if this were done, their religion was also endangered. Together with the sacred "holy places" (bamoth) of the original inhabitants, the altars and the sanctuaries there found also came into possession of the Israelites. Among these there were some that had been sacred to the ancestors of Israel, and with which old memories were associated. As a consequence, it readily occurred that Israel appropriated also old symbols and religious ceremonies, and even the Baals and the Astartes themselves, however little this could be united in principle with the service of Yahweh. But if the Israelites lost their unique religion, then their connection with the kindred tribes and their national independence were soon matters of history. They were readily absorbed by the Canaanites.``131';
isbe[4705]='Israel, History of, 2`III. Period of the Judges.<P>1. General Character of Period:<P>In such a period of weakened national and religious life, it could easily happen that Israel would again lose the supremacy that it had won by the sword. It was possible that the Canaanites could again bring into their power larger parts of the land. Also energetic and pushing nomadic tribes, such as the Ammonites, the Moabites, or other warlike peoples, such as the Philistines, could bring the country under subjection, as actually did occur in the period of the Judges. The Book of Judges reports a number of such instances of the subjection of Israel, which did not extend over the whole land, and in part occurred in different sections of the country at the same time. Judah and Simeon, the two tribes in the south, as a rule took no part in these contests, and had their own battles to fight; and the same is true of the tribes east of the Jordan, among whom Northern Manasseh and Ephraim were in closest alliance. After a longer or shorter period of oppression, there followed in each case a revival of the national spirit against such oppression. And in all these cases the popular hero who became the liberator appealed to the religious consciousness that formed a bond of union between all the Israelirish tribes and their common God Yahweh. In however wild a manner the youthful vigor of the people may have found its expression on these occasions, they are nevertheless conscious of the fact that they are waging a holy war, which in every case also ended with the victory over the heathen spirit and false worship that had found their way into Israel. The most precious historical monument from these times is the song of Deborah (<a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>), which, like a mirror, reflects faithfully the conditions of affairs, and the thoughts of that age.<P><a onClick="return mV(\'Jdg\',17,\'1-\');">Judges 17-21</a> belong to the beginning of this period. The first of these old stories narrates the emigration of a large portion of the tribe of Dan to the extreme north of the country and the origin of idolatry in that region (<a onClick="return mV(\'Jdg\',17,\'1-\');">Jud 17</a>; <a onClick="return mV(\'Jdg\',18,\'1-\');">18</a>). But the second story, too, both in form and contents, is, at least in part, very old and its historical value is amply protected against the attacks of modern critics by <a onClick="return mV(\'Hsa\',9,9);">Ho 9:9</a>; <a onClick="return mV(\'Hsa\',10,9);">10:9</a>. This story reports a holy war of revenge against the tribe of Benjamin, which was unwilling to render satisfaction for a nefarious crime that had been committed at Gibeah in its territory. In the feeling of close solidarity and of high responsibility which appears in connection with the punishment of this crime, we still see the influence of the periods of Moses and Joshua.<P>2. The Different Judges:<P>First it is narrated of a king of Aram-naharaim that he had oppressed Israel for a period of 8 years (<a onClick="return mV(\'Jdg\',3,8);">Jud 3:8</a>). This probably means a king of the Mitanni (Sayce, Monuments, 297, 304), who at that time were trying to force their way through Canaan into Egypt. It was Othniel, the Kenazite, belonging to a tribe that was related to Judah, who delivered Israel. A second liberator was the Benjamite Ehud, who delivered the southeastern portion of the country from the servitude of Eglon, the king of the Moabites, by putting the latter to death (<a onClick="return mV(\'Jdg\',3,12);">Jud 3:12</a>). On a greater scale was the decisive battle against the Canaanitish kings in the north, when these had formed an alliance and had subjected Israel for a period of 20 years. At the appeal of Deborah, Barak conquered Sisera, the hostile king and leader of a mighty army of chariots, in the plain of Kishon (<a onClick="return mV(\'Jdg\',4,\'1-\');">Jud 4</a>; <a onClick="return mV(\'Jdg\',5,\'1-\');">5</a>). In the same region the battle of Gideon was fought with the plundering Bedouin swarms of the Midianites, who had repeatedly oppressed Israel (<a onClick="return mV(\'Jdg\',6,\'1-\');">Jud 6-8</a>). Abimelech, an unworthy son of the God-fearing hero, after the death of his father, had established a local kingdom in Shechem, which stood for only a short time and came to a disgraceful end. Little more than the names are known to us of Tola, of the tribe of Issachar, and of Jair, in Gilead (<a onClick="return mV(\'Jdg\',10,1);">Jud 10:1</a>). More fully is the story of Jephthah told, who delivered the country from the Ammonites coming from the east (<a onClick="return mV(\'Jdg\',11,\'1-\');">Jud 11</a>), with which was also connected a struggle with the jealous Ephraimites (<a onClick="return mV(\'Jdg\',12,\'1-\');">Jud 12</a>); and still more fully are the details reported of the personal contests of the Nazirite Samson, belonging to the tribe of Dan, against the Philistines making their inroads from the south, and who for many years proved to be the most dangerous enemies of Israel.<P>All these heroes, and a few others not so well known, are called judges, and it is regularly reported how long each of these "judged" Israel. They were not officials in the usual sense of the term, but were liberators of the people, who, at the inspiration of Yahweh, gave the signal for a holy war. After the victory they, as men of Yahweh, then enjoyed distinction, at least in their own tribes; and in so far as it was through their doing that the people had been freed, they were the highest authorities in political, legal, and probably, too, in religious questions. They are called judges in conscious contradistinction from the kingly power, which in Israel was recognized as the exclusive prerogative of Yahweh, so that Gideon declined it as improper when the people wanted to make him king (<a onClick="return mV(\'Jdg\',8,22);">Jud 8:22</a>f). The people recognized the Spirit of Yahweh in the fierce energy which came over these men and impelled them to arouse their people out of their disgraceful lethargy. For this reason, too, they could afterward be trusted in making their judicial decisions in harmony with the mind and the Spirit of God, as this had been done already by the prophetess Deborah in the time of oppression. Yet, at least in the case of Samson (notwithstanding <a onClick="return mV(\'Jdg\',16,31);">Jud 16:31</a>), it is not probable that he ever was engaged in the administration of justice. It is not even reported of him that he fought at the head of the people, but he carried on his contests with the Philistines in behalf of himself individually, even if, as one consecrated of God, he were a witness for the power of God.<P>3. Chronology of the Period:<P>The chronology of the period of the Judges exhibits some peculiar difficulties. If we add together the data that are given in succession in the Book of Judges, we get from <a onClick="return mV(\'Jdg\',3,\'8-\');">Jud 3:8-16:31</a>, 410 years altogether. But this number is too large to make it harmonize with the 480 years mentioned in <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>. Jewish tradition (e.g. Cedher \'Olam) accordingly does not include the years of oppression in this sum, but makes them a part of the period of the individual judges. In this way about 111 years are eliminated. But evidently the redactor of the Book of Judges did not share this view. Modern critics are of the opinion that the writer has dovetailed two chronological methods, one of which counted on the basis of periods of forty years each, while the other was more exact and contained odd numbers. In this way we can shorten this period as does the Cedher \'Olam. At any rate, it is justifiable, and is suggested by <a onClick="return mV(\'Jdg\',10,7);">Jud 10:7</a>, to regard the oppression by the Ammonites (<a onClick="return mV(\'Jdg\',10,8);">10:8</A>ff) and the oppression by the Philistines (<a onClick="return mV(\'Jdg\',13,1);">13:1</a>ff) as contemporaneous. And other events, too, which in the course of the narrative are related as following each other, may have taken place at the same time or in a somewhat different sequence, as the author used different sources for the different events. But for this very reason his story deserves to be credited as historical. Such characters as Deborah, Jephthah, Ehud, Gideon, Abimelech and Samson are described as tangible historical realities. Even if, in the case of the last-mentioned, oral tradition has added decorative details to the figure, yet Samson cannot possibly be a mere mythological character, but must have been a national hero characteristic of this period, in whom are represented the abundance of physical and mental peculiarities characteristic of the youthful nation, as also their good-natured indifference and carelessness over against their treacherous enemies.<P>4. Loose Organization of the People:<P>The lack of a central political power made itself felt all the more in the period of the Judges, since, because of the scattered condition of the people in the country that had been so minutely parceled out, and because of the weakening of the religious enthusiasm of the preceding age, the deeper unity of heart and mind was absent. It is indeed incorrect to imagine that at this time there was a total lack of governmental authority. A patriarchal organization had been in force from the beginning. The father of the family was the lawful head of those belonging to him: and a larger clan was again subject to an "elder," with far-reaching rights in the administration of law, but also with the duty to protect his subordinates, and in case of want to support them. Unfortunately we are nowhere informed how these elders were chosen or whether their offices were hereditary. Only a very few passages, such as <a onClick="return mV(\'Isa\',3,6);">Isa 3:6</a>f; throw a certain light on the subject. This institution of the elders Moses had already found established and had developed farther (<a onClick="return mV(\'Exd\',18,13);">Ex 18:13</a>). It was retained in all the periods of Israel\'s history. When the people began to live together in larger centers, as a natural consequence bodies of such city elders were established. The tribes, too, had "elders" at their head. But for a united action of the whole nation this arrangement did not suffice; and especially in the case of war the people of Israel felt that they were at a disadvantage compared with their enemies, who had kings to lead them. For this reason the desire for a king steadily grew in Israel. The dictators of the period of the Judges satisfied their needs only for the time being.<P>IV. The Kingdom: Israel-Judah.<P>In the time when the Israelites were oppressed by the Philistines the need of a king was especially felt. As Samson had come to his death in servitude, the people themselves thus, at the close of this period of glorious victories, were under the supremacy of a warlike race, which had only in recent times settled on the western coast of Palestine, and from this base was forcing its conquests into the heart of the country.<P>1. Samuel:<P>After the most disastrous defeats, during which even the Ark of the Covenant was lost, there arose for the people, indeed, a father and a deliverer in the person of Samuel, who saved them during the most critical period. What his activity meant for the uplift of the people cannot be estimated too highly. He was, above all, during peace the faithful watchman of the most sacred possessions of Israel, a prophet such as the people had not seen since the days of Moses; and he doubtless was the founder of those colonies of prophetical disciples who were in later times so influential in the development of a theocratical spirit in Israel. He guarded the whole nation also with all his power, by giving to them laws and cultivating piety in the land.<P>2. The Kingdom of Saul:<P>But as Samuel, too, became old and the people concluded for good reasons that his rule would have no worthy successors, their voice could no longer be silenced, and they demanded a king. Samuel tried in vain to persuade the people to desist from their demand, which to him seemed to be an evidence of distrust in the providence of Yahweh, but was himself compelled, by inspiration of God, to submit to their wishes and anoint the new king, whom Yahweh pointed out to him. It is indeed maintained by the critics that there are several accounts extant in Samuel concerning the selection of Saul to the kingdom, and that these accounts differ in this, that the one regards the kingdom as a blessing and the other as a curse. The first view, which is said to be the older, is claimed to be found in <a onClick="return mV(\'1Sa\',9,\'1-10\',16);">1Sa 9:1-10, 16</a>; and <a onClick="return mV(\'1Sa\',11,\'1-\');">11</a>; while the second is said to be in <a onClick="return mV(\'1Sa\',8,\'1-\');">1Sa 8</a>; <a onClick="return mV(\'1Sa\',10,\'17-27\');">10:17-27</a>; <a onClick="return mV(\'1Sa\',11,\'12-14\');">11:12-14</a>. Whatever may be the facts in regard to these sources, this is beyond any doubt, that Samuel, the last real theocratic leader, established the kingdom. But just as little can the fact be doubted, that he took this step with inner reluctance, since in his eyes this innovation meant the discarding of the ideals of the people to which he himself had remained true during his lifetime. The demand of the people was the outgrowth of worldly motives, but Yahweh brought it about, that the "Anointed of Yah" signified an advance in the history of the kingdom of God.<P>Saul himself, at first, in a vigorous and efficient manner, solved the immediate problems and overcame the enemies of his people. But he soon began to conceive of his kingdom after the manner of heathen kingdoms and did not subject himself to Yahweh and His appointed representative. There soon arose an open conflict between him and Samuel; and the fact that the Spirit of God had departed from him appears in his melancholy state of mind, which urged him on to constantly increasing deeds of violence. That under these circumstances God\'s blessing also departed from him is proved by the collapse of his life\'s work in his final failures against the Philistines.<P>3. David:<P>In contrast with this, David, his successor, the greatest king that Israel ever had, had a correct conception of this royal office, and even in his most brilliant successes did not forget that he was called to rule only as "the servant of Yahweh" (by which name he, next to Moses, is called most often in the Bible). As a gifted ruler, he strengthened his kingdom from within, which, considering the heterogeneous character of the people, was not an easy matter, and extended it without by overpowering jealous neighbors. In this way it was he who became the real founder of a powerful kingdom. The conquest of Jerusalem and its selection as the capital city also are an evidence of his political wisdom. It is indeed true that he, too, had his personal failings and that he made many mistakes, which caused him political troubles, even down to his old age. But his humility at all times made him strong enough again to subject himself to the hand of Yahweh, and this humility was based on the attitude of his spirit toward Yahweh, which shows itself in his Psalms. In this way he really came to be a connecting link between God and his people, and upon this foundation the prophets built further, who prophesied a still closer union of the two under a son of David.<P>While Saul was a Benjamite, David was of the tribe of Judah, and was for a short time the king of this tribe in Hebron, before the other tribes, becoming tired of the misrule of a descendant of Saul, also voluntarily chose him as their king. He soon after this established as the center of his new kingdom the city of Jerusalem, which really was situated on the territory that had been assigned to Benjamin; and he also set this city apart as the religious center of the people by transferring the Ark of the Covenant to this place. In this way David, through his wisdom and his popular bravery, succeeded in uniting the tribes more firmly under his supremacy, and especially did he bring the tribe of Judah, which down to this time had been more for itself, into closer connection with the others. Israel under David became a prominent kingdom. This position of power was, as a matter of fact, distasteful to their neighbors round about. The Philistines tried to destroy the ambitious kingdom, but were themselves repeatedly and definitely overpowered. But other neighboring people, too, who, notwithstanding the fact that David did not assume an offensive attitude toward them, assumed a hostile attitude toward him, came to feel his superiority. Particularly severe and tedious was the war against the allied Ammonites and Syrians; and although the Edomites, too, regarded this as a favorable time for attacking Israel, this struggle also ended in a complete triumph for David. The surrounding countries became subject to him from the Mediterranean Sea to Hamath (<a onClick="return mV(\'2Sa\',8,9);">2Sa 8:9</a>), and from the territory of the Lebanon, the inhabitants of which assumed a friendly attitude, to the borders of Egypt, which also recognized the new rule.<P>4. Solomon:<P>Solomon, the son of David, developed inwardly the powerful kingdom which he had inherited. To his father he seemed to be the right man for this because of his peaceful temperament and his high mental abilities. He justified the hopes placed in him. Out of love to Yahweh he built the temple on Mt. Zion, regulated the affairs of state and the administration of justice, and by commercial treaties with the Phoenicians (King Hiram) brought about great prosperity in the land. His was the "golden" period in Israel. The culture and civilization, too, of the people were materially advanced by Solomon as he widened their horizon and introduced the literature of Proverbs, which had up to this time been more extensively cultivated by the neighboring people (Edom, Arabia, Egypt). He even developed this literature into a higher type. On the other hand, the brilliant reign of Solomon brought serious dangers to the new kingdom. His liberal-mindedness in the treatment of his foreign wives, in permitting them to retain their heathen worship, probably because he thought that in the end it was the same Divinity which these women worshipped under different form, endangered theocracy with its serious cult and its strict morality. Through this conduct the king necessarily forfeited the sympathy of the most pious Israelites. At the same time, his love for magnificent structures surpassed the measure which was regarded as correct for the "Anointed of Yahweh." Then, too, his efforts, in themselves justifiable, to establish a more perfect organization of the monarchy, produced a great deal of dissatisfaction. Solomon did not understand, as did his father, how to respect the inherited liberty-loving tendencies of his people. The heavy services and taxation, to which the people were compelled to submit, were deeply felt, most of all by the Ephraimites, who at times had exhibited a jealous spirit, and could not forget their lost hegemony.<P>5. Division of the Kingdom:<P>So long, indeed, as the wise Solomon and his advisers were at the helm, the various rebellious tendencies could not make themselves felt. But after his death the catastrophe came. His son, Rehoboam, at the Diet in Shechem, at which the Ephraimites placed before him a kind of capitulation before his coronation, showed that he did not at all understand the situation. His domineering attitude brought things to a head, and he must have been glad that at least the tribe of Judah remained faithful to him. The Northern tribes chose for their king Jeroboam (I), who before this had already taken part in rebellious agitations, as the kingdom had been predicted to him by the prophet Ahijah (<a onClick="return mV(\'1Ki\',11,2);">1Ki 11:2</a>). Israel was torn into two parts.<P>6. Sources of the History of the Kingdom:<P>With this rupture the powerful kingdom established by David had reached its end. In regard to this flourishing period in Israel\'s history we are, on the whole, well informed through the sources. Especially in <span class="noTag">2Sa 9-20</span> and <a onClick="return mV(\'1Ki\',2,\'1-\');">1Ki 2</a>; <a onClick="return mV(\'1Ki\',3,\'1-\');">3</a>, we have a narrator who must have been a contemporary of the events recorded. Klostermann surmises that this may have been Ahimaaz, the son of Zadok (<a onClick="return mV(\'2Sa\',15,27);">2Sa 15:27</a>); while Duhm, Budde, Sellin and others believe it to have been the priest Abiathar. Less unity is in evidence in the first Book of Samuel, containing the history of the youth of David, which evidently was often described. The Books of Chronicles have only secondary value for the life of David. These books narrate in full detail the story of the preparations made by David for the erection of the temple and of his organization of the Levites. In regard to the reign of Solomon, the Books of Kings report more fully. Concerning the later kings, they generally give only meager extracts from more complete sources, which excerpts, however, have been shown to be reliable. The interest which the narrator has in telling his story is the religious. Especially does he carefully note the fact as to the relation of the different kings to the cult. Special sources have been used in compiling the detailed stories of the great prophets Elijah and Elisha, which are inserted in the history of the two kingdoms. On the other hand, the Books of Ch pass over entirely all reference to the work of the prophets of the Northern Kingdom, as they ignore the entire history of the Ephraimitic kingdom since the interest of these books is centered on the sanctuary in Jerusalem. Also in the case of the Judean history, the much older Books of Kings deserve the precedence. Yet we owe to the writer of Chronicles a number of contributions to this history, especially where he has made a fuller use of the sources than has been done by the author of the Books of Kings. The suspicion that everything which Chronicles contains, beyond what is to be found in Kings, is unhistorical, has turned out to be groundless. Thus, e.g., it would be impossible to understand the earlier prophecies of Isaiah under Jotham at all, if it did not appear from Chronicles to what prosperity and influence the people of Jerusalem had by that time again attained. For it is only Chronicles that give us an account of the flourishing reign of his predecessor Uzziah, who is treated but briefly in Kings.<P>7. Chronological Matters:<P>The chronology of the earlier portions of the period of the Kings is dependent on the date of the division of the kingdom. This date can be decided on the basis of the careful chronological data of the Books of K, which do not indeed agree in all particulars, but are to be adjusted by the Assyrian chronology. If we, with Kamphausen, Oettli and Kittel, regard the year 937 BC as the time of the division of the kingdom, then Solomon ruled from 977 to 937; David, from 1017 to 977. The length of the reign of Saul is not known, as the text of <a onClick="return mV(\'1Sa\',13,1);">1Sa 13:1</a> is defective. It is very probable that we can credit him with about twenty years, according to Josephus (Ant., X, viii, 4), i.e. from about 1037-1017. In this case David transferred the seat of government to Jerusalem about the year 1010, and the completion of the erection of the temple of Solomon took place in 966. But this basal date of 937 is not accepted as correct by all scholars. Klostermann places the date of the rupture of the kingdom in the year 978; Koehler, in 973. For later chronological data, Assyrian sources are an important factor. The Assyrians were accustomed to call each year after the name of an official (limu), and eponym lists are extant for 228 years. In these reference is made to an eclipse of the sun, which astronomically has been settled as having taken place on July 15, 763. We have in this list then the period from 893 to 666. On this basis, it is made possible to determine the exact dates of the different military expeditions of the Assyrian rulers and their conflicts with the kings of Judah and Israel, on the presupposition, however, that the Assyrian inscriptions here used really speak of these kings, which in a number of cases is denied. Valuable help for determining the chronology of this period is the fall of Samaria in the year 722 and the expedition of Sennacherib against Jerusalem in 701, and then the fall of Jerusalem in 587 and 586. The distribution of the years between these dates to the individual kings is in places doubtful, as the numbers in the text are possibly corrupt, and in the synchronistic data of the Books of Kings mistakes may have been made.``131';
isbe[4706]='Israel, History of, 3`V. Period of the Separated Kingdoms.<P>1. Contrasts and Vicissitudes of the Kingdoms:<P>The two separated kingdoms differed materially. The kingdom of Ephraim was the more powerful of the two. It embraced, according to an inaccurate usage of situdes of the words, 10 tribes; and to this the kingdom the vassals, such as Moab, as a rule remained subject, until they emancipated themselves. But, on the other hand, this Northern Kingdom was less firm spiritually. Even the resident city of the king changed frequently, until Omri founded the city of Samaria, which was well adapted for this purpose. The dynasties, too, were only of short duration. It occurred but rarely that one family was able to maintain its supremacy on the throne through several generations. A revolutionary character remained fixed in this kingdom and became its permanent weakness. On the other hand, the smaller and often overpowered kingdom of Judah, which faithfully adhered to the royal line of David, passed through dangerous crises and had many unworthy rulers. But the legitimate royal house, which had been selected by Yahweh, constituted spiritually a firm bond, which kept the people united, as is seen, e.g., by a glance at the addresses of Isaiah, who is thoroughly filled with the conviction of the importance of the house of David, no matter how unworthy the king who happened to rule might appear to him. In a religious respect, also, the arbitrary break with Zion proved to be fatal for the Northern Kingdom.<P>2. The Successive Reigns:<P>Jeroboam.<P>It is true that faithful prophets of Yahweh, such as the Abijah of Shiloh mentioned above, and Shemaiah (<a onClick="return mV(\'1Ki\',12,22);">1Ki 12:22</a>), proclaimed that the fateful division of the kingdom was a Divinely intended judgment from Yahweh. But they soon were compelled to reach the conclusion that Jeroboam did not regard himself as a servant of Yahweh, but as a sovereign who, through his own power and through the favor of the people, had secured the rule, and hence, could arbitrarily decide all matters in reference to the cult and the sacred sanctuaries of the people. According to his own will, and for political reasons, he established the new national sanctuary at Bethel, and another at Dan. At both shrines he caused Yahweh to be worshipped under the image of a calf, which was to constitute a paganizing opposition to the Ark of the Covenant on Mt. Zion, even if it was the idea that Yahweh, the God of the Covenant, was to be worshipped in these new images. In doing this, the king followed ancient national customs, which had broken with the purity of the Mosaic religion (concerning image worship in Daniel we have beard before. See <a href="study/isbe/search.html?string=GOLDEN+CALF">GOLDEN CALF</A>). His sojourn in Egypt, too, where he had lived as a fugitive, had doubtless furnished the king incentives in this direction. He created a priesthood that was submissive to his wishes, and disregarded the opposition of the few prophets who protested against the policy of the king. His successors, too, walked "in the ways of Jeroboam." The independent prophets, however, did not die out, but, rather, prophecy developed its greatest activity in this very Northern Kingdom. As a rule, in its work it stood in opposition to the government, but at times it succeeded in gaining the recognition of the rulers.<P>Omri.<P>The earliest times of the divided kingdoms are, from a political point of view, characterized by the fact that the kingdoms on the Euphrates and the Tigris, namely Assyria and Babylon, still had enough to do with themselves, and did not yet make any inroads into the Mediterranean lands; but, rather, it was the Syrians who first caused a good deal of trouble to the Northern Kingdom. Jeroboam did not succeed in rounding a dynasty. Already his son Nadab was eliminated by a usurper Baasha. The latter\'s son too, Elah, was murdered, after a reign of two years. It was not, however, his murderer Zimri, or Tibni, who strove to secure the kingdom. for himself, but Omri who became king (<a onClick="return mV(\'1Ki\',16,\'1-\');">1Ki 16</a>), and who also attained to such prominence abroad that the cuneiform inscriptions for a long time after call Israel "the land of Omri." His ability as a ruler was seen in the fact that the establishment of Samaria as the capital city was his work. The inscription on the Mesha stone reports that he also established the sovereignty of Israel vigorously on the east side of the Jordan.<P>Ahab.<P>His son Ahab, too, was an energetic and brave ruler, who succeeded in gaining a number of victories over the Syrians, who were now beginning to assume the offensive in a determined manner. Then, too, he was politic enough to win over to his interests the kingdom of Judah, with which his predecessors had lived in almost constant warfare. In this policy he succeeded, because the noble and large-hearted king Jehoshaphat was more receptive to such fraternal relations than was good for him. An expedition jointly undertaken by these two kings against Syria brought Jehoshaphat into extreme danger and ended with the death of Ahab.<P>Ahab\'s fate was his wife Jezebel, the daughter of the Phoenician king Ethbaal (Ithobal, according to Josephus, Ant, VIII, xiii, 2 and Apion, I, 18), who had been a priest of Astarte. This intermarriage with a fanatical heathen family brought untold and endless misfortune over all Israel. This bold and scheming woman planned nothing less than the overthrow of the religion of Yahweh, and the substitution for it of the Baal and the Astarte cult. As a first step she succeeded in having the king tolerate this religion. The leading temple in the new resident city, Samaria, was dedicated to the Baal cult. Already this introduction of a strange and lascivious ethnic religion was a great danger to the religion and the morals of the people. Hosts of Baal priests, ecstatic dervishes, traversed the country. Soon the queen undertook to persecute the faithful worshippers of Yahweh. The fact that these men protested against the tolerance of this foreign false religion was interpreted as disobedience on their part to the king. Many faithful prophets were put to death. At this critical period, when the existence of the religion of Yahweh was at stake, the prophet Elijah, the Tishbite, appeared on the stage, and through a bitter struggle reestablished the worship of Yahweh. However, the fateful influence that this woman exerted was thereby not yet destroyed. It extended to Judah also.<P>Rehoboam.<P>In the kingdom of Judah, apart from the apostasy of different tribes, which left him only the vigorous tribe of Judah and portions of Benjamin, Dan, Simeon, and Levi, Rehoboam experienced also other calamities, namely, a destructive invasion and tribute imposition by King Shishak of Egypt (Egyptian Sheshonk, founder of the XXIId Dynasty; <a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>f; compare <a onClick="return mV(\'2Ch\',12,2);">2Ch 12:2</a>ff). While under Solomon the relations of Israel to the Egyptian court had in the beginning been very friendly, this was changed when a new dynasty came to the throne. After Jeroboam had failed in his first revolutionary project, he had found refuge at the court of Shishak (<a onClick="return mV(\'1Ki\',11,40);">1Ki 11:40</a>). It is possible that Jeroboam made the Egyptian king lustful for the treasures of Jerusalem. The Egyptians did not, as a matter of fact, stop at the Ephraimitic boundaries, but in part also invaded the territory of Jeroboam; but their chief objective was Jerusalem, from which they carried away the treasures that had been gathered by Solomon. On the temple wall of Karnak this Pharaoh has inscribed the story of this victory and booty. From the names of the cities found in this inscription, we learn that this expedition extended as far as Megiddo and Taanach.<P>Abijah.<P>Rehoboam was succeeded by his son Abijah, or
