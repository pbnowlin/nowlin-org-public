sm was brought about. Here the Old Testament was translated into the Greek. This translation, known as the Septuagint (Septuagint), shows as yet but few signs of the Greek spirit; rather, a pronounced influence of legal and ritualistic Judaism. On the other hand, apologetical opposition to Hellenism appears to a more marked degree, among others, in the apocryphal work known as "Wisdom of Solomon," in which we find a positive defense of wisdom as the principle of revelation over against the Epicurean world wisdom of Hellenism. In doing this, the book leans on Platonism and Stoicism. The chokhmah, or wisdom of the old Jewish literature, has been Hellenized. Philo goes still farther in adapting Judaism to Greek taste and to humanism. A more liberal conception of inspiration also appears in the reception of contemporaneous literary products into the Old Testament Canon, even of some books which had originally been written in the Greek language. The means observed in adapting national Hebraism to Hellenistic universalism was the allegorical method of interpretation, which Philo practiced extensively and which then passed over to the Christian church Fathers of the Alexandrian school. This school constitutes the opposite extreme to the rabbinical, which clung most tenaciously to the letter of the sacred texts.<P>(6) Apocalyptic Literature.<P>A unique phenomenon at the close of the Biblical and in the earliest post-Biblical period is, finally, the <a href="study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a> (which see). Since the days of the Maccabees we find the custom in certain Jewish circles, by using the old prophecies and adapting them to the events of the times, of drawing up a systematic picture of the future. The authorship of these writings was usually ascribed to one of the ancient saints, e.g. to Enoch, or Abraham, or Moses, or Elijah, or Solomon, or Baruch, or Ezra, or others. The model of these Apocalypses is the Book of Daniel, which, on the basis of older visions, in the times of the oppression by Antiochus Epiphanes, pictures, in grand simplicity, the development of the history of the world down to the final triumph of the Kingdom of God over the kingdoms of the world.<P>III. Conclusion: Characteristic Features of the Religion of Israel.<P>When we consider this whole development, it cannot be denied that the religion of Israel passed through many changes. It grew and purified and spiritualized itself out of its own inherent strength; but it also suffered many relapses, when hindering and corrupting influence gained the upper hand. But it received from without not only degenerating influences, but also much that inspired and developed its growth. Its original and native strength also shows itself in this, that without losing its real character it was able to appropriate to itself elements of truth from without and assimilate these.<P>1. The Living God:<P>If we ask what the specific and unique character of this religion was, by which it was distinguished from all other religions of antiquity, and by reason of which it alone was capable of producing from itself the highest revelation in Christ, it must be answered that its uniqueness lies, most of all, in its conception of God and of Divine things, and of God\'s relation to the world. The term "monotheism" but inadequately expresses this peculiarity; for monotheistic tendencies are found also in other nations, and in Israel monotheism often shows itself in a strongly corrupted form. The advantage of Israel lies in its close contact with the living God. From the beginning of Israel\'s history a strictly personal God gave testimony of Himself to different personalities with a decision which demanded absolute submission; and, in addition, this was a holy God, who elevated mankind above Nature and above themselves, a God who stood in the most absolute contrast to all that was impure or sinful, but at the same time was wonderful in His grace and His mercy to the sinner. This direct revelation of God to specially chosen bearers of the Divine truth goes through the entire history of Israel. Through this factor this religion was being constantly purified and unfolded further. The Israelites learned to conceive God in a more spiritual, correct, and universal manner, the more they advanced in experience and culture. But this God did not thereby become a mere abstract being, separated from mankind, as was the case with so many nations. He always continued to be a living God who takes an active part in the lives of men. We need notice only those prophets who describe the greatness of God in the grandest way, such as Hosea, Isaiah, Deutero-Isaiah, who depict also the personal life of God in the boldest way through anthropomorphisms.<P>2. The Relation of Man to This God:<P>In agreement with this, too, we find that this religion demands the personal subjection of men to God. As was the case with all the religions of antiquity, that of the Old Testament, of Man to too, was originally rather a tribal and a national religion than one of the individual. This brought with it the demand for the external observance of the tribal customs in the name of religion. However, the traditional customs and legal ordinances had already been sifted and purified by Moses. And, as a matter of necessity, in a religion of such a pronounced personal nature, the personal relation of the individual to God must become more and more a matter of importance. This idea became deeper and more spiritual in the course of time and developed into a pure love for God. It did not prevent this religion from becoming petrified, even during the Exile, when the doctrines and the cult were most correctly observed. But the vital kernels found embedded in the revelation of God constantly proved their power of rejuvenation. And at that very time when the petrified legalism of Pharisaism attained its most pronounced development, the most perfect fruit of this religion came forth from the old stem of the history of Israel, namely Christ, who unfolded Judaism and converted it into the religion of salvation for the entire world.<P>LITERATURE.<P>Of the literature on the religion of Israel we may yet make particular mention of the following: The textbooks on Old Testament Theology by Oehler, 1891 (also the English translation), of Dillmann, 1895. The Kuenen-Wellhausen school is represented by Kuenen, De Godsdienst van Israel, 1869 (also the English translation); Stade, Biblische Theologie des A T, 1905; Marti, Theologie des A T, 1903; Smend, Lehrbuch der A T Religionsgeschichte, 1899; compare also the works of Robertson Smith, especially his lectures on The Religion of the Semites. Against this radical school, see, in addition to the work of Dillmann, James Robertson, Early Religion of Israel, 1893. On the subject of Semitism in general, S.I. Curtiss, Ursemitische Religion im Volksleben des heutigen Orients, 1903 (also the English translation); Baethgen, Beltrage zur semitischen Religionsgeschichte, 1880; M.J. Lagrange, Etudes sur les religions semitiques, 1905. The relation of Israel to the Assyrian and Babylonian religions is discussed by Hugo Winckler in several works; compare also Fritz Hommel, Alttestamentliche Ueberlieferungen, 1897 (also the English translation); Sayce, The Higher Criticism and the Verdict of the Monuments, 1895; Alfred Jerermias, Das A Tim Lichte des alten Orients, 1906; a good brief summary is found in Sellin, Die A T Religion im Rahmen der andern Altorientalischen, 1908. Full details are given in Kautzsch, "Religion of Israel," in HDB, extra vol, 1904. For the last centuries before Christ see particularly, Schurer, Geschichte des judischen Volkes im Zeitalter Jesu Christi, 1907 (also English Translation). The modern Jewish standpoint is represented by Montefiore, Lectures on the Origin and Growth of Religion as Illustrated by the History of the Ancient Hebrews, 1892.`<a href="study/isbe/search.html?string=Israel,+Religion+of,+1">ISRAEL, RELIGION OF, 1`131';
isbe[4710]='Israelite; Israelitish`iz\'-ra-el-it, iz\'-rael-it-ish: Belonging to the tribes of <a href="study/isbe/search.html?string=ISRAEL">ISRAEL</A> (which see). Occurs 4 times in the New Testament: of Nathanael (<a onClick="return mV(\'Jhn\',1,47);">Joh 1:47</a>); used by Paul (<a onClick="return mV(\'Rom\',9,4);">Ro 9:4</a>; <a onClick="return mV(\'Rom\',11,1);">11:1</a>; <a onClick="return mV(\'2Cr\',11,22);">2Co 11:22</a>).``1';
isbe[4711]='Issachar`is\'-a-kar (yissa(se)khar; Septuagint, Swete Issachar; Tischendorf, Issachar, so also in the New Testament, Tregelles, and Westcott and Hort, The New Testament in Greek):<P>(1) The 9th son of Jacob, the 5th borne to him by Leah (<a onClick="return mV(\'Gen\',30,17);">Ge 30:17</a>f).<P>1. The Name:<P>His birth is in this passage connected with the strange story of Reuben and his mandrakes, and the name given him is apparently conceived as derived from \'ish sakhar, "a hired workman." There is a play upon the name in this sense in <a onClick="return mV(\'Gen\',49,15);">Ge 49:15</a>, "He bowed his shoulder to bear, and became a servant under taskwork." Wellhausen (Textder Buch. Sam., 95) thinks that the second element of the name may denote a deity; and Sokar, an Egyptian god, has been suggested. The name in that case would mean "worshipper of Sokar." Practically nothing is preserved of the personal history of this patriarch beyond his share in the common actions of the sons of Jacob. Four sons were born to him before Jacob\'s family removed to Egypt (<a onClick="return mV(\'Gen\',46,13);">Ge 46:13</a>). In that land he died and was buried.<P>2. The Tribe:<P>At Sinai the tribe numbered 54,000 men of war over 20 years of age (<a onClick="return mV(\'Num\',1,29);">Nu 1:29</a>). At the end of the wanderings the numbers had grown to 64,300 (<a onClick="return mV(\'Num\',26,25);">Nu 26:25</a>). In the days of David, the Chronicler puts the figures at 87,000 (<a onClick="return mV(\'1Ch\',7,5);">1Ch 7:5</a>). See <a href="study/isbe/search.html?string=NUMBERS">NUMBERS</a>. The place of Issachar in the desert-march was with the standard of the tribe of Judah (along with Zebulun) on the east side of the tabernacle (<a onClick="return mV(\'Num\',2,5);">Nu 2:5</a>), this group forming the van of the host (<a onClick="return mV(\'Num\',10,14);">Nu 10:14</a>f). The rabbis say that this standard was of 3 colors, sardine, topaz and carbuncle, on which were inscribed the names of the 3 tribes, bearing the figure of a lion\'s whelp (Tg, pseudo. Jonathan. on <a onClick="return mV(\'Num\',2,3);">Nu 2:3</a>). The captain of the tribe was Nethanel ben-Zuar (<a onClick="return mV(\'Num\',1,8);">Nu 1:8</a>, etc.). Later this place was held by Igal ben-Joseph, the tribal representative among the spies (<a onClick="return mV(\'Num\',13,7);">Nu 13:7</a>). The prince chosen from Issachar to assist in the division of the land was Paltiel ben-Azzan (<a onClick="return mV(\'Num\',34,26);">Nu 34:26</a>). The position of Issachar at the strange ceremony near Shechem was on Mt. Gerizim, "to bless the people" (<a onClick="return mV(\'Deu\',27,12);">De 27:12</a>).<P>3. The Tribal Territory:<P>Sixteen cities of Issachar are mentioned in <a onClick="return mV(\'Jos\',19,17);">Jos 19:17</a>ff, but the only indications of boundaries are Tabor in the north and Jordan in the east. We gather elsewhere that the territory of this tribe marched on the north with Zebulun and Naphtali (<a onClick="return mV(\'Jos\',19,11,33);">19:11,33</A>); on the west with Manasseh and possibly Asher (<a onClick="return mV(\'Jos\',17,10);">17:10</A>); and on the south with Manasseh (<a onClick="return mV(\'Jos\',17,11);">17:11</A>). It does not seem to have had any point of contact with the sea. The portion of Issachar, therefore, included the plain of Esdraelon, Tabor, the hill of Moreh, and the slopes east to the Jordan. The fortresses along the south edge of the plain were held by Manasseh. Tola, a man of Issachar, held Shamir, a stronghold in Mt. Ephraim (<a onClick="return mV(\'Jdg\',10,1);">Jud 10:1</a>). To Manasseh was given Beth-shean with her "towns" (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>). No reliable line can be drawn for the south border. The district thus indicated was small; but it embraced some of the most fruitful land in Palestine. By the very riches of the soil Issachar was tempted. "He saw a resting-place that it was good, and the land that it was pleasant; and he bowed his shoulder to bear, and became a servant under taskwork" (<a onClick="return mV(\'Gen\',49,15);">Ge 49:15</a>). "The mountain" in <a onClick="return mV(\'Deu\',33,19);">De 33:19</a> may possibly be Tabor, on which, most likely, there was an ancient sanctuary and place of pilgrimage. This would certainly be associated with a market, in which Issachar and Zebulun, the adjoining tribes, would be able to enrich themselves by trade with the pilgrims from afar. Issachar took part in the battle with Sisera (<a onClick="return mV(\'Jdg\',5,15);">Jud 5:15</a>). To Israel Issachar gave one judge, Tola (<a onClick="return mV(\'Jdg\',10,1);">Jud 10:1</a>), and two kings, Baasha and his son (<a onClick="return mV(\'1Ki\',15,27);">1Ki 15:27</a>, etc.).<P>4. Men of Issachar:<P>Of the 200 "heads" of the men of Issachar who came to David at Hebron it is said that they were "men that had understanding of the times, to know what Israel ought to do" (<a onClick="return mV(\'1Ch\',12,32);">1Ch 12:32</a>). According to the Targum, this meant that they knew how to ascertain the periods of the sun and moon, the intercalation of months, the dates of solemn feasts, and could interpret the signs of the times. A company from Issachar came to the celebration of the Passover when it was restored by Hezekiah (<a onClick="return mV(\'2Ch\',30,18);">2Ch 30:18</a>). Issachar has a portion assigned to him in Ezekiel\'s ideal division of the land (<a onClick="return mV(\'Eze\',48,25);">Eze 48:25</a>); and he appears also in the list in Revelation (<a onClick="return mV(\'Rev\',7,7);">7:7</A>).<P>(2) A Korahite doorkeeper, the 7th son of Obededom (<a onClick="return mV(\'1Ch\',26,5);">1Ch 26:5</a>).``54';
isbe[4712]='Isshiah`is-shi\'-a (yishshiyahu, "Yah exists"; the King James Version Ishiah):<P>(1) Mentioned among David\'s heroes, a greatgrandson of Tola (<a onClick="return mV(\'1Ch\',7,3);">1Ch 7:3</a>).<P>(2) Mentioned among the men who came to David at Ziklag (<a onClick="return mV(\'1Ch\',12,6);">1Ch 12:6</a>; the King James Version "Jesiah").<P>(3) A member of the priesthood of the house of Rehabiah (<a onClick="return mV(\'1Ch\',24,21);">1Ch 24:21</a>; the King James Version "Jesiah").<P>(4) Another Levitical priest of the house of Uzziel (<a onClick="return mV(\'1Ch\',23,20);">1Ch 23:20</a>; <a onClick="return mV(\'1Ch\',24,25);">24:25</a>).``1';
isbe[4713]='Isshijah`is-shi\'-ja (yishshiyah, "Yah lends"; the King James Version Ishijah): A man of the household of Harim, named among those who, at Ezra\'s command, were induced to put away their "strange wives" (<a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>). Also called "Aseas" (1Esdras 9:32).``1';
isbe[4714]='Issue`ish\'-u:<P>(1) (moledheth, tse\'etsa\'im; sperma, "seed"): Offspring, descendants (<a onClick="return mV(\'Gen\',48,6);">Ge 48:6</a>; <a onClick="return mV(\'Isa\',22,24);">Isa 22:24</a>; <a onClick="return mV(\'Mat\',22,25);">Mt 22:25</a> the King James Version).<P>(2) (zirmah; yatsa\' (verb); rhusis): A gushing of fluid (semen, <a onClick="return mV(\'Eze\',23,20);">Eze 23:20</a>; water, 47:8; blood, <a onClick="return mV(\'Luk\',8,43);">Lu 8:43</a>).`<a href="./study/isbe/search.html?string=ISSUE+OF+BLOOD">ISSUE OF BLOOD</a>; <a href="study/isbe/search.html?string=BLOODY+FLUX">BLOODY FLUX `1';
isbe[4715]='Issue (of Blood)`(zobh, zubh; rhusis, haimorrhoos): When used as a description of a bodily affection the word signifies:<P>(1) A discharge, the consequence of uncleanness and sin (<a onClick="return mV(\'Lev\',15,2);">Le 15:2</a>ff; <a onClick="return mV(\'Num\',5,2);">Nu 5:2</a>). As such it was one of the judgments which were to afflict the family of Joab (<a onClick="return mV(\'2Sa\',3,29);">2Sa 3:29</a>);<P>(2) a hemorrhage, either natural (<a onClick="return mV(\'Lev\',12,7);">Le 12:7</a>, where the word used is maqor, literally, a "fountain"), or the consequence of disease (<a onClick="return mV(\'Mat\',9,20);">Mt 9:20</a>; <a onClick="return mV(\'Mar\',5,25);">Mr 5:25</a>; <a onClick="return mV(\'Luk\',8,43);">Lu 8:43</a>).``1';
isbe[4716]='Issues`ish\'-uz (tots\'-oth, literally, "outgoings"):<P>(1) Ways of escape (<a onClick="return mV(\'Psa\',68,20);">Ps 68:20</a> the King James Version);<P>(2) Free moral choices (<a onClick="return mV(\'Pro\',4,23);">Pr 4:23</a>).``1';
isbe[4717]='Istalcurus`is-tal-ku\'-rus (Istalkouros): 1Esdras 8:40, corresponding to Zabbud in <a onClick="return mV(\'Ezr\',8,14);">Ezr 8:14</a>. In Swete\'s text the name is Istakalkos.``1';

isbe[4723]='Italy`it\'-a-li (Italia): At first confined as a name to the extreme southern part of the Italian peninsula in the region now called Calabria, whence its application was gradually extended. In Greek usage of the 5th century BC, the name was applied to the coasts as far as Metapontum and Posidonia, being synonymous with Oenotria. The Oenotrians are represented as having assumed the name of Italians (Itali) from a legendary ruler Italus (Dionysius, i.12,35; Vergil, Aen. i.533). The extension of Roman authority seems to have given this name an ever-widening application, since it was used to designate their allies generally. As early as the time of Polybius the name Italy was sometimes employed as an appellation for all the country between the two seas (Tyrrhenian and Adriatic) and from the foot of the Alps to the Sicilian Straits (Polyb. i.6; ii.14; iii.39,54), although Cisalpine Gaul was not placed on a footing of complete equality with the peninsula as regards administration until shortly after the death of Julius Caesar. From the time of Augustus the term was used in practically its modern sense (Nissen, Italische Landeskunde, I, 57-87).<P>The name Italy occurs 3 times in the New Testament: <a onClick="return mV(\'Act\',18,2);">Ac 18:2</a>, Aquila "lately come from Italy," because of the expulsion of the Jews from Rome under Claudius; <a onClick="return mV(\'Act\',27,1);">Ac 27:1</a>, the decision that Paul be sent to Italy; <a onClick="return mV(\'Hbr\',13,24);">Heb 13:24</a>, salutation from those "of Italy." The adjective form is found in the appellation, "Italian band" (cobors Italica, <a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>).<P>The history of ancient Italy, in so far as it falls within the scope of the present work, is treated under <a href="study/isbe/search.html?string=ROME">ROME</A> (which see).``3';
isbe[4724]='Itch`(charec; psora): Only in <a onClick="return mV(\'Deu\',28,27);">De 28:27</a>, where it probably refers to the parasitic skin disease of that name which is very common in Palestine. It is due to a small mite, Sarcoptes scabiei, which makes burrows in the skin and sometimes causes extensive crusts or scabs, attended with a severe itching. It is very easily communicated from person to person by contact, and can be cured only by destruction of the parasite. This disease disqualified its victims for the priesthood (<a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>).``1';
isbe[4725]='Ithai`ith\'-a-i.`<a href="./study/isbe/search.html?string=ITTAI">ITTAI</a>`1';
isbe[4726]='Ithamar`ith\'-a-mar (\'ithamar, "land" or "island of palms": Gesenius; or "father of Tamar," \'i, being perhaps for \'abhi: Cook in Encyclopedia Biblica—though both derivations are uncertain): The 4th son of Aaron (<a onClick="return mV(\'Exd\',6,23);">Ex 6:23</a>; <a onClick="return mV(\'Exd\',28,1);">28:1</a>; <a onClick="return mV(\'1Ch\',6,3);">1Ch 6:3</a>), Eleazar being the 3rd son, Nadab and Abihu the 1st and 2nd sons. While Nadab and Abihu were prematurely cut off for offering strange fire before the Lord (<a onClick="return mV(\'Lev\',10,1,2);">Le 10:1-2</a>; <a onClick="return mV(\'Num\',3,4);">Nu 3:4</a>; <a onClick="return mV(\'Num\',26,61);">26:61</a>), and Eleazar was appointed chief of the tribe of Levi (<a onClick="return mV(\'Exd\',6,23,25);">Ex 6:23, 25</a>) and ultimately succeeded Aaron (<a onClick="return mV(\'Exd\',28,1);">Ex 28:1</a>), Ithamar was made the treasurer of the offerings for the Tabernacle (<a onClick="return mV(\'Exd\',38,21);">Ex 38:21</a>), and superintendent of the Gershonites and Merarites in the service of the Tabernacle (<a onClick="return mV(\'Num\',4,28,33);">Nu 4:28, 33</a>). In the time of Eli the high-priesthood had come to be in his family, but how, and whether before Eli\'s day or first in Eli\'s person, is not told and need not be conjectured. W. R. Smith in Encyclopedia Biblica (art. "Eli"), on the strength of <a onClick="return mV(\'1Sa\',2,27,28);">1Sa 2:27-28</a>, holds that the priesthood was originally in Eli\'s line; but the words "the house of thy father" do not necessarily mean only the house of Ithamar, but may, and most probably do, refer to Aaron and his descendants, of whom Ithamar was one. Nor does the cutting off of Eli\'s family from the priesthood and the setting in their place of "a faithful priest," who should do everything according to Yahweh\'s will and walk before Yahweh\'s anointed forever, find its complete fulfillment in the deposition of Abiathar or Ahimelech, his son, and the installation of Zadok in the time of Solomon (<a onClick="return mV(\'1Ki\',2,35);">1Ki 2:35</a>; <a onClick="return mV(\'1Ch\',29,22);">1Ch 29:22</a>; see <a href="study/isbe/search.html?string=ZADOK">ZADOK</A>). A descendant of Ithamar, Daniel by name, is mentioned among the exiles who returned from Babylon (<a onClick="return mV(\'Ezr\',8,2);">Ezr 8:2</a>).``192';
isbe[4727]='Ithiel`ith\'-i-el (\'ithi\'el, "God is"):<P>(1) A son of Jeshaiah of the tribe of Benjamin, mentioned among the inhabitants of Jerusalem in Nehemiah\'s day (<a onClick="return mV(\'Neh\',11,7);">Ne 11:7</a>).<P>(2) The name is perhaps also found in the oracle of Agur (<a onClick="return mV(\'Pro\',30,1);">Pr 30:1</a>).`<a href="./study/isbe/search.html?string=ITHIEL+AND+UCAL">ITHIEL AND UCAL</a>`1';
isbe[4728]='Ithiel And Ucal` (\'ithi\'el we\'ukhal): Names of the two men to whom Agur the son of Jakeh spoke his words (<a onClick="return mV(\'Pro\',30,1);">Pr 30:1</a>). The purport of introducing these persons is strange and obscure; the margin proposes therefore, by the use of a different pointing, to read the verse, "The man said, I have wearied myself, O God, I have wearied myself, O God, and am consumed," thus doing away with the proper names; a reading which corresponds not inaptly with the tone of the succeeding verses.`<a href="./study/isbe/search.html?string=AGUR">AGUR</a>; <a href="./study/isbe/search.html?string=PROVERBS+THE+BOOK+OF">PROVERBS, THE BOOK OF</a>`66';
isbe[4729]='Ithlah`ith\'-la (yithlah; the King James Version Jetblah): An unidentified town in the territory of Dan, named with Aijalon and Elon (<a onClick="return mV(\'Jos\',19,42);">Jos 19:42</a>).``1';
isbe[4730]='Ithmah`ith\'-ma (yithmah, "purity"): A citizen of the country of the Moabites, David\'s deadly enemies, yet mentioned as one of the king\'s heroes (<a onClick="return mV(\'1Ch\',11,46);">1Ch 11:46</a>).``1';
isbe[4731]='Ithnan`ith\'-nan (yithnan): A town in the south of Judah mentioned along with Hazor and Ziph (<a onClick="return mV(\'Jos\',15,23);">Jos 15:23</a>), apparently the "Ethnan" of Jerome (Onom 118 13). Not identified.``1';
isbe[4732]='Ithra`ith\'-ra (yithra\', "abundance"): The father of Amasa, commanding general in the rebel army of Absalom. It seems that his mother was Abigail, a sister or half-sister of King David (<a onClick="return mV(\'1Ch\',2,17);">1Ch 2:17</a>). She is called the sister of Zeruiah, Joab\'s mother (<a onClick="return mV(\'2Sa\',17,25);">2Sa 17:25</a>). In this same passage Ithra is called an "Israelite," but in <a onClick="return mV(\'1Ch\',2,17);">1Ch 2:17</a>; <a onClick="return mV(\'1Ki\',2,5,32);">1Ki 2:5, 32</a>, we read: "Jether the Ishmaelite."``1';
isbe[4733]='Ithran`ith\'-ran (yithran, "excellent"):<P>(1) A descendant of Seir the Horite, son of Dishon (<a onClick="return mV(\'Gen\',36,26);">Ge 36:26</a>; <a onClick="return mV(\'1Ch\',1,41);">1Ch 1:41</a>).<P>(2) One of the sons of Zophah of the tribe of Asher (<a onClick="return mV(\'1Ch\',7,37);">1Ch 7:37</a>).``1';
isbe[4734]='Ithream`ith\'-re-am (yithre\'am, "residue of the people"): The 6th son born to David at Hebron. His mother\'s name was Eglah (<a onClick="return mV(\'2Sa\',3,5);">2Sa 3:5</a>; <a onClick="return mV(\'1Ch\',3,3);">1Ch 3:3</a>).``1';
isbe[4735]='Ithrite`ith\'-rit (yithri, "excellence," "preeminence"): A family in Israel, whose home was Kiriath-jearim (<a onClick="return mV(\'1Ch\',2,53);">1Ch 2:53</a>). Among the 37 heroes of David, two are mentioned who belonged to this family, Ira and Gareb (<a onClick="return mV(\'2Sa\',23,38);">2Sa 23:38</a>; <a onClick="return mV(\'1Ch\',11,40);">1Ch 11:40</a>).``1';
isbe[4736]='Ittah-Kazin`it-a-ka\'-zin (\'ittah qatsin): <a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a> the King James Version for Eth-kazin. Ittah is correctly Eth with He locale, meaning "toward Eth."``1';
isbe[4737]='Ittai`it\'-a-i, it\'-i (\'ittay, \'ithay):<P>(1) A Gittite or native of Gath, one of David\'s chief captains and most faithful friends during the rebellion of Absalom (<a onClick="return mV(\'2Sa\',15,\'11-22\');">2Sa 15:11-22</a>; <a onClick="return mV(\'2Sa\',18,2,4,12);">18:2, 4, 12</a>). The narrative reveals David\'s chivalrous and unselfish spirit in time of trouble, as well as the most self-sacrificing loyalty on the part of Ittai. He seems to have but recently left his native city and joined David\'s army through personal attachment to the king. David rapidly promoted him. Hearing of Absalom\'s rebellion and approach to Jerusalem, he flees with David. The latter remonstrates, urges him to go back and join Absalom, as he is a foreigner and in exile. His interests are in the capital and with the king; there is no reason why he should be a fugitive and perhaps suffer the loss of everything; it would be better for him, with his band of men, to put himself and them at the service of Absalom, the new king. "Mercy and truth be with thee," says David in his magnanimity. Ittai, with a double oath, absolutely refuses to go back, but will stand by David until the last. Remonstrance being useless, the monarch orders him across the river, doubtless glad that he had such a doughty warrior and faithful friend by his side. On mustering his hosts to meet Absalom, David makes Ittai a chief captain with the intrepid Joab and Abishai. He doubtless did his part in the battle, and as nothing more is said of him it is possible that he fell in the fight.<P>(2) A Benjamite, one of David\'s 30 mighty men (<a onClick="return mV(\'2Sa\',23,29);">2Sa 23:29</a>; <a onClick="return mV(\'1Ch\',11,31);">1Ch 11:31</a>, "Ithai").``146';
isbe[4738]='Ituraea`it-u-re\'-a (Itouraia):<P>1. The Word an Adjective:<P>The term occurs only once in Scripture, in the definition of Philip\'s territory: tes Itouraias kai Trachonitidos choras, which the King James Version renders: "of Ituraea and of the region of Trachonitis," and Revised Version: "the region of Ituraea and Trachonitis" (<a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>). Sir W.M. Ramsay has given reasons for the belief that this word was certainly never used as a noun by any writer before the time of Eusebius (Expos, 1894, IX, 51ff, 143ff, 288ff). It must be taken as an adjective indicating the country occupied by the Itureans.<P>2. The Itureans:<P>The descent of the Itureans must probably be traced to Jetur, son of Ishmael (<a onClick="return mV(\'Gen\',25,15);">Ge 25:15</a>), whose progeny were clearly numbered among the Arabian nomads. According to Eupolemus (circa 150 BC), quoted by Eusebius (Praep. Evang. IX, 30), they were associated with the Nabateans, Moabites and Ammonites against whom David warred on the east of the Jordan. They are often mentioned by Latin writers; their skill in archery seems greatly to have impressed the Romans. They were skillful archers (Caesar, Bell. Afr. 20); a lawless (Strabo, xvi.2,10) and predatory people (Cicero, Philipp. ii.112). In the Latin inscriptions Iturean soldiers have Syrian names (HJP, I, ii, 326). They would therefore be the most northerly of the confederates opposed to David (supra), and their country may naturally be sought in the neighborhood of Mt. Hermon.<P>3. Indications of Their Territory:<P>There is nothing to show when they moved from the desert to this district. Aristobulus made war against the Itureans, compelled many of them to be circumcised, and added a great part of their territory to Judea, 140 BC (Ant., XIII, xi, 3). Dio Cassius calls Lysanias "king of the Itureans" (xlix.32), and from him Zenodorus leased land which included Ulatha and Paneas, 25 BC. The capital of Lysanias was Chalcis, and he ruled over the land from Damascus to the sea. Josephus speaks of Soemus as a tetrarch in Lebanon (Vita, 11); while Tacitus calls him governor of the Itureans (Ann. xii.23). The country of Zenodorus, lying between Trachonitis and Galilee, and including Paneas and Ulatha, Augustus bestowed on Herod, 20 BC (Ant., XV, x, 3). In defining the tetrarchy of Philip, Josephus names Batanea, Trachonitis and Auranitis, but says nothing of the Itureans (Ant., XVII, xi, 4; BJ, II, vi, 3). Paneas and Ulatha were doubtless included, and this may have been Iturean territory (HJP, I, ii, 333). It seems probable, therefore, that the Itureans dwelt mainly in the mountains, and in the broad valley of Coele-Syria; but they may also have occupied the district to the southeast of Hermon, the modern Jedur. It is not possible to define more closely the Iturean country; indeed it is not clear whether Luke intended to indicate two separate parts of the dominion of Philip, or used names which to some extent overlapped.<P>It has been suggested that the name Jedur may be derived from the Hebrew yetur, and so be equivalent to Ituraea. But the derivation is impossible.``54';
isbe[4739]='Ivah`i\'-va.`<a href="./study/isbe/search.html?string=IVVAH">IVVAH</a>`1';
isbe[4740]='Ivory`i\'-vo-ri (1) shen, "tooth" (translated "ivory," <a onClick="return mV(\'1Ki\',10,18);">1Ki 10:18</a>; <a onClick="return mV(\'1Ki\',22,39);">22:39</a>; <a onClick="return mV(\'2Ch\',9,17);">2Ch 9:17</a>; <a onClick="return mV(\'Psa\',45,8);">Ps 45:8</a>; <a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>; <a onClick="return mV(\'Sgs\',7,4);">7:4</a>; <a onClick="return mV(\'Eze\',27,6,15);">Eze 27:6, 15</a>; <a onClick="return mV(\'Amo\',3,15);">Am 3:15</a>; <a onClick="return mV(\'Amo\',6,4);">6:4</a>);<P>(2) shenhabbim; Septuagint odontes elephdntinoi, "elephants\' teeth" (<a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a>; <a onClick="return mV(\'2Ch\',9,21);">2Ch 9:21</a>);<P>(3) elephantinos, "of ivory" (<a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>)):<P>Shen occurs often, meaning "tooth" of man or beast. In the passages cited it is translated in English Versions of the Bible "ivory" (of "crag," <a onClick="return mV(\'1Sa\',14,4,5);">1Sa 14:4-5</a>; "cliff," <a onClick="return mV(\'Job\',39,28);">Job 39:28</a> twice; "flesh-hook of three teeth," <a onClick="return mV(\'1Sa\',2,13);">1Sa 2:13</a>). Shenhabbim is thought to be a contracted form of shen ha-\'ibbim, i.e. ha, the article, and \'ibbim, plural of \'ibbah or \'ibba\'; compare Egyptian ab, ebu, "elephant," and compare Latin ebur, "ivory" (see Liddell and Scott, under the word elephas). On the other hand, it may be a question whether -bim is not a singular form connected with the Arabic fil, "elephant." If the word for "elephant" is not contained in shenhabbim, it occurs nowhere in the Hebrew Bible.<P>Ivory was probably obtained, as now, mainly from the African elephant. It was rare and expensive. It is mentioned in connection with the magnificence of Solomon (<a onClick="return mV(\'1Ki\',10,18,22);">1Ki 10:18-22</a>), being brought by the ships of Tarshish (<a onClick="return mV(\'2Ch\',9,17,21);">2Ch 9:17, 21</a>). An "ivory house" of Ahab is mentioned in <a onClick="return mV(\'1Ki\',22,39);">1Ki 22:39</a>. It is mentioned among the luxuries of Israel in the denunciations of Amos (<a onClick="return mV(\'Amo\',3,15);">3:15</A>; <a onClick="return mV(\'Amo\',6,4);">6:4</A>). It occurs in the figurative language of <a onClick="return mV(\'Psa\',45,8);">Ps 45:8</a>; <a onClick="return mV(\'Sgs\',5,14);">So 5:14</a>; <a onClick="return mV(\'Sgs\',7,4);">7:4</a>. It is used for ornamentation of the ships of the Tyrians (<a onClick="return mV(\'Eze\',27,6);">Eze 27:6</a>), who obtain it with ebony through the men of Dedan (<a onClick="return mV(\'Eze\',27,15);">27:15</a>). It is among the merchandise of Babylon (<a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>).<P>We do not learn of the use of elephants in war until a few centuries before the Christian era. In 1Macc 8:6, there is a reference to the defeat of Antiochus the Great, "having an hundred and twenty elephants," by Scipio Africanus in 190 BC. 1Macc 1:17 speaks of the invasion of Egypt by Antiochus Epiphanes with an army in which there were elephants. 1Macc 6:28-47 has a detailed account of a battle between Antiochus Eupator and Judas Maccabeus at Bethsura (Beth-zur). There were 32 elephants. Upon the "beasts" theria) there were "strong towers of wood"; "There were also upon every one two and thirty strong men, that fought upon them, beside the Indian that ruled him."<P>In <a onClick="return mV(\'Job\',40,15);">Job 40:15</a>, the King James Version margin has for "behemoth," "the elephant, as some think."``37';
isbe[4741]='Ivory, Tower of`(mighdal hashen): In <a onClick="return mV(\'Sgs\',7,4);">So 7:4</a> the neck of the Shulammite is compared in whiteness and stateliness to a (or the) tower of ivory. The definite article may suggest that the comparison is with some actual tower in or near Jerusalem; but more probably the language is simply a figure.``1';
isbe[4742]='Ivvah`iv\'-a (\'iwwah; Aba (= Ava), Aua, <a onClick="return mV(\'2Ki\',18,34);">2Ki 18:34</a>, Oudou, <a onClick="return mV(\'2Ki\',19,13);">2Ki 19:13</a>, apparently due to a misreading): The name is wanting in the Massoretic Text and Septuagint of <a onClick="return mV(\'Isa\',36,19);">Isa 36:19</a>.<P>Ivvah was a city apparently conquered by the Assyrians, and is mentioned by them, in the verses quoted, with Hamath and Arpad, Sepharvaim and Hena. It has been assimilated with the Avva of <a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a> as one of the places whence Sargon brought captives to Samaria, and identified with Hit on the Euphrates, between Anah and Ramadieh, but this seems improbable, as is also the suggestion that it is Emma, the modern \'Imm, between Antioch and Aleppo. Hommel (Expository Times, April,1898,330) upholds the view that Hena and Ivvah, or, as he prefers to read, Avvah, are not places at all, but the names of the two chief gods of Hamath, Arpad and Sepharvaim. This would be consistent with <a onClick="return mV(\'2Ki\',18,34);">2Ki 18:34</a>; but <a onClick="return mV(\'2Ki\',19,13);">19:13</A>: "Where is the king...of Sepharvaim, of Hena, and Ivvah?" and <a onClick="return mV(\'2Ki\',17,31);">17:31</A>, where the gods of Sepharvaim are stated to be Adrammelech and Anammelech, raise serious difficulties. In all probability, the identification of Ivvah depends upon the correct localization of the twofold Sepharvaim, of which Hena and Ivvah may have been the names. The identification of Sepharvaim with the Babylonian Sip(p)ar is now practically abandoned.`<a href="./study/isbe/search.html?string=SEPHARVAIM">SEPHARVAIM</a>`136';
isbe[4743]='Ivy`i\'-vi (kissos): The only mention of the word in all the sacred writings is in 2Macc 6:7 in connection with the oppression of the Jews by Antiochus Epiphanes: "On the day of the king\'s birth every month they were brought by bitter constraint to eat of the sacrifices; and when the feast of Bacchus (Dionysus) was kept, the Jews were compelled to go in procession to Dionysus, carrying ivy," this plant (Hedera helix) being sacred to the Greek god of wine and of the culture of the vine (compare Eur. Bacchae, passim). It was of ivy or of pine that the "corruptible crown" of the famous Isthmian games was made (<a onClick="return mV(\'1Cr\',9,25);">1Co 9:25</a>).``79';
isbe[4744]='Iyar`e-yar\'.`<a href="./study/isbe/search.html?string=IYYAR">IYYAR</a>`1';
isbe[4745]='Iye-Abarim`i-ye-ab\'-a-rim (\'iye ha-\'abharim, "the heaps of the Abarim"; the King James Version Ije-abarim; in <a onClick="return mV(\'Num\',21,11);">Nu 21:11</a> the Septuagint reads Codex Vaticanus, Chalglei): A place in the journeyings of Israel named after Oboth, said to be "in the wilderness which is before Moab, toward the sunrising" (<a onClick="return mV(\'Num\',21,11);">Nu 21:11</a>), "in the border of Moab" (<a onClick="return mV(\'Num\',33,44);">Nu 33:44</a>). The indications of position here given are not sufficient to guide to any identification, and, so far, nothing has been discovered in the district to help us. Called simply "Iyim" (the King James Version "Iim") in <a onClick="return mV(\'Num\',33,45);">Nu 33:45</a>.``1';
isbe[4746]='Iyim`i\'-yim (iyim, "heaps"—the form of which, \'iye, is the construct):<P>(1) A short form of the name Iye-abarim (<a onClick="return mV(\'Num\',33,45);">Nu 33:45</a>).<P>(2) A town in the territory of Judah (<a onClick="return mV(\'Jos\',15,29);">Jos 15:29</a>; English Versions of the Bible wrongly "Iim"). It lay in the extreme south, "toward the border of Edom." It is not identified.``1';
isbe[4747]='Iyyar`e-yar\' (iyar; Iar): The 2nd month of the Jewish year, corresponding to May. It is not mentioned in the Bible.`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>`1';
isbe[4748]='Izehar`iz\'-e-har, i\'-ze-har (<a onClick="return mV(\'Num\',3,19);">Nu 3:19</a> the King James Version).`<a href="./study/isbe/search.html?string=IZHAR">IZHAR</a>`1';
isbe[4749]='Izhar`iz\'-har (yitshar, "the shining one"):<P>(1) The father of Korah (<a onClick="return mV(\'Num\',16,1);">Nu 16:1</a>), descended from a Kohathite Levite of this name, whose descendants formed a family, in the tribe of Levi (<a onClick="return mV(\'Exd\',6,18,21);">Ex 6:18, 21</a>; <a onClick="return mV(\'Num\',3,19,27);">Nu 3:19, 27</a>; <a onClick="return mV(\'1Ch\',6,18,38);">1Ch 6:18, 38</a>).<P>(2) A descendant of Judah, whose mother\'s name was Helah. the American Revised Version margin gives the name Zohar (<a onClick="return mV(\'1Ch\',4,7);">1Ch 4:7</a>).``1';
isbe[4750]='Izharites`iz\'-har-its (yitshari): The descendants of Izhar, son of Kohath, and grandson of Levi (<a onClick="return mV(\'Num\',3,19,27);">Nu 3:19, 27</a>). In David\'s reign some of these were "over the treasures of the house of Yahweh" (<a onClick="return mV(\'1Ch\',26,23);">1Ch 26:23</a>), others "were for the outward business over Israel, for officers and judges" (ibid., <a onClick="return mV(\'1Ch\',26,29);">26:29</a>).``1';
isbe[4751]='Izliah; Jezliah`iz-li\'-a (yizli\'ah, "Yah delivers"; the King James Version): A son of Elpaal, of the tribe of Benjamin (<a onClick="return mV(\'1Ch\',8,18);">1Ch 8:18</a>).``1';
isbe[4752]='Izrahiah`iz-ra-hi\'-a (yizrachyah, "Yah appears, or shines"):<P>(1) A descendant of Issachar, grandson of Tola, only son of Uzzi (<a onClick="return mV(\'1Ch\',7,3);">1Ch 7:3</a>).<P>(2) The leader of the singing at the purification of the people, on the occasion of Nehemiah\'s reformation; here rendered "Jezrahiah" (<a onClick="return mV(\'Neh\',12,42);">Ne 12:42</a>).``1';
isbe[4753]='Izrahite`iz\'-ra-hit (yizrach, "rising, shining"): Shamhuth, the captain of the 5th monthly course (<a onClick="return mV(\'1Ch\',27,8);">1Ch 27:8</a>), is called an "Izrahite." The name may be derived from the town or family of Izrah, but more likely is a corruption of the word "Zerahite," descendant of Zerah of Judah.``1';
isbe[4754]='Izri`iz\'-ri (yitsri, "creator," "former"): A man of the "sons of Jeduthun," leader of the fourth band of musicians, who served in the sanctuary (<a onClick="return mV(\'1Ch\',25,11);">1Ch 25:11</a>). Identical with Zeri (<a onClick="return mV(\'1Ch\',25,3);">25:3</A>).``1';
isbe[4755]='Izziah`iz-i\'-a (yizziyah, "Yah unites"; the King James Version Jeziah): One of the faithful Jews who put away their foreign wives. He belonged to the family of Parosh (<a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>; 1Esdras 9:26, "Ieddias").``1';
isbe[4756]='Jaakan`ja\'-a-kan.`<a href="./study/isbe/search.html?string=BEEROTH+BENE+JAAKAN">BEEROTH BENE-JAAKAN</a>`1';
isbe[4757]='Jaakobah`ja-a-ko\'-ba, ja-ak\'-o-ba (ya\'aqobhah, for meaning compare <a href="study/isbe/search.html?string=JACOB+(1)">JACOB, I,1,2</a>): <a onClick="return mV(\'1Ch\',4,36);">1Ch 4:36</a>, a Simeonite prince.``1';
isbe[4758]='Jaala; Jaalah`ja\'-a-la, ja-a\'-la (ya\'ala\', meaning unknown, <a onClick="return mV(\'Neh\',7,58);">Ne 7:58</a>) and (ya\'alah, "mountain goat" (?),<a onClick="return mV(\'Ezr\',2,56);">Ezr 2:56</a>): The name of a family of returned exiles, "children of Solomon\'s servants" = "Jeeli" in 1Esdras 5:33.``1';
isbe[4759]='Jaalam`ja\'-a-lam: the King James Version for <a href="study/isbe/search.html?string=JALAM">JALAM</A> (which see).``1';
isbe[4760]='Jaanai`ja\'-a-ni: the King James Version for <a href="study/isbe/search.html?string=JANAI">JANAI</A> (which see).``1';
isbe[4761]='Jaar`ja\'-ar (ya\'ar, "forest" or "wood"): Is only once taken as a proper name (<a onClick="return mV(\'Psa\',132,6);">Ps 132:6</a> the Revised Version margin), "We found it in the field of Jaar." It may be a shortened form of the name Kiriath-jearim, where the ark had rested 20 years.`<a href="./study/isbe/search.html?string=KIRIATH+JEARIM">KIRIATH-JEARIM</a>`1';
isbe[4762]='Jaare-Oregim`ja\'-a-re-or\'-e-jim, -or\'e-gim (ya\'are\'oreghim): In <a onClick="return mV(\'2Sa\',21,19);">2Sa 21:19</a>, given as the name of a Bethlehemite, father of Elhanan, who is said to have slain Goliath the Gittite (compare <a onClick="return mV(\'1Sa\',17,\'1-\');">1Sa 17</a>). The name is not likely to be a man\'s name; the second part means "weavers" and occurs also as the last word of the verse in the Massoretic Text, so it is probably a scribal error here due to repetition. The first part is taken to be<P>(1) an error for ya\'ir (see <a href="study/isbe/search.html?string=JAIR">JAIR</A>), which is to be read in the parallel section in <a onClick="return mV(\'1Ch\',20,5);">1Ch 20:5</a>;<P>(2) in <a onClick="return mV(\'2Sa\',23,24);">2Sa 23:24</a> Elhanan is the son of Dodo, also a Bethlehemite, and Klostermann would read here Dodai as the name of Elhanan\'s father.``149';
isbe[4763]='Jaareshiah`ja-ar-e-shi\'-a (ya\'areshyah, meaning unknown): In <a onClick="return mV(\'1Ch\',8,27);">1Ch 8:27</a>, a Benjamite, "son" of Jeroham. The King James Version has "Jaresiah."``1';
isbe[4764]='Jaasai; Jaasau`ja\'-a-si, ja\'-a-so.`<a href="./study/isbe/search.html?string=JAASU">JAASU</a>`1';
isbe[4765]='Jaasiel`ja-a\'-si-el (ya\'asi\'el, "God makes" (?)): In <a onClick="return mV(\'1Ch\',11,47);">1Ch 11:47</a>, a Mezobaite, one of "the mighty men of the armies," and probably = "Jaasiel" of <a onClick="return mV(\'1Ch\',27,21);">1Ch 27:21</a>, "the son of Abner," and a Benjamite tribal prince of David\'s. the King James Version "Jasiel."``1';
isbe[4766]='Jaasu; Jassai; Jaasau`ja\'-a-su (the Revised Version (British and American) and Kethibh, ya\'asu, meaning uncertain); (the Revised Version margin and Qere, ya\'asay), (the King James Version): In <a onClick="return mV(\'Ezr\',10,37);">Ezr 10:37</a>, one of those who had married foreign wives. Septuagint translates the consonantal text as a verb, kai epoiesan, "and they did." 1Esdras 9:34 has "Eliasis."``1';
isbe[4767]='Jaazaniah`ja-az-a-ni\'-a (ya\'azanyahu, in <a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a>; <a onClick="return mV(\'Eze\',8,11);">Eze 8:11</a>; ya\'azanyah, in <a onClick="return mV(\'Jer\',35,3);">Jer 35:3</a>; <a onClick="return mV(\'Eze\',11,1);">Eze 11:1</a>, "Yah hears"):<P>(1) In <a onClick="return mV(\'2Ki\',25,23);">2Ki 25:23</a>, "son of the Maacathite," and one of the Judean "captains of the forces" who joined Gedaliah, the Babylonian governor appointed by Nebuchadrezzar over Judah, at Mizpah. He is the "Jezaniah" of <a onClick="return mV(\'Jer\',40,8);">Jer 40:8</a>; <a onClick="return mV(\'Jer\',42,1);">42:1</a>. Though not mentioned by name, he was presumably one of those captains who joined Johnnan in his attack on Ishmael after the latter had slain Gedaliah (<a onClick="return mV(\'Jer\',41,\'11-18\');">Jer 41:11-18</a>). He is also the same as Azariah of <a onClick="return mV(\'Jer\',43,2);">Jer 43:2</a>, a name read by the Septuagint\'s Codex Vaticanus in <a onClick="return mV(\'Jer\',42,1);">42:1</A> also. <a onClick="return mV(\'Jer\',43,5);">Jer 43:5</a> relates how Johnnan and his allies, Jaazaniah (= Azariah) among them, left Judah with the remnant, and took up their abode in Egypt.<P>(2) In <a onClick="return mV(\'Jer\',35,3);">Jer 35:3</a>, son of Jeremiah (not the prophet), and a chief of the Rechabite clansmen from whose "staunch adherence to the precepts of their ancestor" Jeremiah "points a lesson for his own countrymen" (Driver, Jeremiah, 215).<P>(3) In <a onClick="return mV(\'Eze\',8,11);">Eze 8:11</a>, son of Shaphan, and one of the seventy men of the ciders of Israel whom Ezekiel saw in a vision of Jerusalem offering incense to idols.<P>(4) In <a onClick="return mV(\'Eze\',11,1);">Eze 11:1</a>, son of Azzur, and one of the 25 men whom Ezekiel saw in his vision of Jerusalem, at the east door of the Lord\'s house, and against whose iniquity he was commanded to prophesy (<a onClick="return mV(\'Eze\',11,1,2,3);">11:1-13</A>).``149';
isbe[4768]='Jaazer`ja\'-a-zer (ya\'azer).`<a href="./study/isbe/search.html?string=JAZER">JAZER</a>`1';
isbe[4769]='Jaaziah`ja-a-zi\'-a (ya\'aziyahu, "Yah strengthens"): In <a onClick="return mV(\'1Ch\',24,26,27);">1Ch 24:26-27</a>, a Levite, "son" of Merari. But the Massoretic Text is corrupt. The Septuagint\'s Codex Vaticanus reads (Ozeid), which some take to suggest Uzziah (compare <a onClick="return mV(\'1Ch\',27,25);">27:25</A>); see Curtis, Critical and Exegetical Commentary on the Books of Chronicles, 274-75; See Kittel, at the place.``1';
isbe[4770]='Jaaziel`ja-a\'-zi-el (ya\'azi\'el, "God strengthens"): In <a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18</a>, a Levite, one of the musicians appointed to play upon instruments at the bringing up of the ark by David. Kittel and Curtis, following the Septuagint (Ozeiel), read "Uzziel," the name they adopt for Aziel in <a onClick="return mV(\'1Ch\',15,20);">15:20</a>, and for Jeiel in <a onClick="return mV(\'1Ch\',16,5);">16:5</A>.``1';
isbe[4771]='Jabal`ja\'-bal (yabhal, meaning uncertain): In <a onClick="return mV(\'Gen\',4,20);">Ge 4:20</a>, a son of Lamech by Adah. He is called \'the father of those who dwell in tents and (with) herds.\' So Gunkel, Gen<sup>3</sup>, 52, who says that the corresponding word in Arabic means "the herdsman who tends the camels." Skinner, Genesis, 120, says that both Jabal and Jubal suggest yobhel, which in Phoenician and Hebrew "means primarily \'ram,\' then \'ram\'s horn\' as a musical instrument, and finally \'joyous music\' (in the designation of the year of Jubilee)." See also Skinner, Genesis, 103, on the supposed connection in meaning with Abel.``149';
isbe[4772]='Jabbok`jab\'-ok (yabboq, "luxuriant river"): A stream in Eastern Palestine first named in the history of Jacob, as crossed by the patriarch on his return from Paddan-aram, after leaving Mahanaim (<a onClick="return mV(\'Gen\',32,22);">Ge 32:22</a>). On the bank of this river he had his strange conflict with an unknown antagonist. The Jabbok was the northern boundary of the territory of Sihon the Amorite (<a onClick="return mV(\'Num\',21,24);">Nu 21:24</a>). It is also named as the border of Ammon (<a onClick="return mV(\'Deu\',3,16);">De 3:16</a>). It is now called Nahr ez-Zerqa, "river of blue," referring to the clear blue color of its water. It rises near to \'Amman—Rabbath Ammon—and makes a wide circuit, flowing first to the east, then to the northwest, until it is joined by the stream from Wady Jerash, at which point it turns westward, and flows, with many windings, to the Jordan, the confluence being just north of ed-Damiyeh. It drains a wider area than any other stream east of the Jordan, except the Yarmuk. The bed of the river is in a deep gorge with steep, and in many places precipitous, banks. It is a great cleft, cutting the land of Gilead in two. It is lined along its course by a luxuriant growth of oleander which, in season, lights up the valley with brilliant color. The length of the stream, taking no account of its innumerable windings, is about 60 miles. The mouth of the river has changed its position from time to time. In the lower reaches the vegetation is tropical. The river is fordable at many points, save when in full flood. The particular ford referred to in <a onClick="return mV(\'Gen\',32,\'1-\');">Ge 32</a> cannot now be identified.``54';
isbe[4773]='Jabesh`ja\'-besh (yabhesh): A short form of <a href="study/isbe/search.html?string=JABESH-GILEAD">JABESH-GILEAD</a> (which see).``1';
isbe[4774]='Jabesh-Gilead`ja\'-besh-gil\'-e-ad (yabhesh gil\'adh; or simply yabhish, "dry"): A city east of the Jordan, in the deliverance of which from Nahash the Ammonite Saul\'s military prowess was first displayed (<a onClick="return mV(\'1Sa\',11,1);">1Sa 11:1</a>). At an earlier time the inhabitants failed to share with their brethren in taking vengeance upon Benjamin. This laxity was terribly punished, only 400 virgins being spared alive, who afterward became wives to the Benjamites (<a onClick="return mV(\'Jdg\',21,\'1-\');">Jud 21</a>). The gratitude of the inhabitants to Saul was affectingly proved after the disaster to that monarch on Gilboa (<a onClick="return mV(\'1Sa\',31,\'1-\');">1Sa 31</a>). David, hearing of their deed, sent an approving message, and sought to win their loyalty to himself (<a onClick="return mV(\'2Sa\',2,4);">2Sa 2:4</a>). Robinson (Biblical Researches, III, 39) thought it might be represented by ed-Deir, about 6 miles from Pella (Fachil), on the southern bank of Wady Yabis. The distance from Pella agrees with the statement of Eusebius, Onomasticon (s.v.). Others (Oliphant, Land of Gilead, 277f; Merrill, East of Jordan, 430, etc.) would identify it with the ruins of Meriamin, about 3 miles southeast of Pella, on the north of Wady Yabis. The site remains in doubt; but the ancient name still lingers in that of the valley, the stream from which enters the Jordan fully 9 miles southeast of Beisan.``54';
isbe[4775]='Jabez`ja\'-bez (ya\'bets, "sorrow" ("height)):<P>(1) Place: An unidentified town probably in the territory of Judah, occupied by scribes (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>). For an ingenious reconstruction of the passage see EB, under the word<P>(2) Person: The head of a family of Judah, noted for his "honorable" character, though "his mother bare him with sorrow" (<a onClick="return mV(\'1Ch\',4,9,10);">1Ch 4:9-10</a>), ya\'bets being interpreted as if it stood for ya\'tsebh, "he causes pain." The same play upon words recurs in his prayer, "that it be not to my sorrow!" His request was granted, "and the sorrow implied by his ominous name was averted by prayer" (Dummelow, in the place cited.).``1';
isbe[4776]='Jabin`ja\'-bin (yabhin, "one who is intelligent," "discerning." The word may have been a hereditary royal title among the Northern Canaanites. Compare the familiar usage of par\'oh melekh mitsrayim):<P>(1) "The king of Hazor," the leading city in Northern Palestine, who led an alliance against Joshua. He was defeated at the waters of Merom, his city was taken and he was slain (<a onClick="return mV(\'Jos\',11,\'1-9\');">Jos 11:1-9</a>).<P>(2) "The king of Canaan, that reigned (or had reigned) in Hazor." It is not clear whether he dwelt in Hazor or Harosheth, the home of Sisera, the captain of his host at the time of the story narrated in Jgs. He oppressed Israel in the days preceding the victory of Deborah and Barak. To the Israelites he must have been but a shadowy figure as compared with his powerful captain, Sisera, for the song makes no mention of him and there is nothing to indicate that he even took part in the battle that freed Israel (<a onClick="return mV(\'Jdg\',4,2,7,17,23,24);">Jud 4:2, 7, 17, 23-24</a> bis; <a onClick="return mV(\'Psa\',83,9,10);">Ps 83:9-10</a>).``80';
isbe[4777]='Jabneel; Jabneh`jab\'-ne-el, jab\'-ne (yabhne\'el, "God is builder"; Septuagint Lebna, Swete reads Lemna; the Apocrypha has Iamnia, Iamneia):<P>(1) A town on the northern border of the land assigned to Judah, near the western sea, mentioned in connection with Ekron (<a onClick="return mV(\'Jos\',15,11);">Jos 15:11</a>). The place is now represented by the modern village of Yebna which stands upon a hill a little to the south of the Nahr Rubin, about 12 or 13 miles south of Jaffa, on the road from there to Askelon, and about 4 miles from the sea. It had a port, now called Mina Rubin, a short distance south of the mouth of the river, some remains of which still exist. Its harbor was superior to that of Jaffa (PEFS,1875,167-68). It does not occur in the Hebrew text of the Old Testament except in the passage mentioned, but it appears under the form "Jabneh" (yabhneh) in <a onClick="return mV(\'2Ch\',26,6);">2Ch 26:6</a>, as is evident from the mention of Gath and Ashdod in connection with it. The Septuagint reads Gemna (Jabneh) where the Hebrew reads wa-yammah, "even unto the sea," in <a onClick="return mV(\'Jos\',15,46);">Jos 15:46</a>, where Ekron and Ashdod and other cities and villages are mentioned as belonging to Judah\'s inheritance. Josephus (Ant., V, i, 22) assigns it to the tribe of Dan. We have no mention of its being captured by Joshua or occupied by Judah until the reign of Uzziah who captured it and demolished its wall, in connection with his war upon the Philistines (<a onClick="return mV(\'2Ch\',26,6);">2Ch 26:6</a>). The position of Jabneel was strong and was the scene of many contests, both in the period of the monarchy and that of the Maccabees. It is mentioned frequently in the account of the wars of the latter with the Syrians. It was garrisoned by the Seleucid kings, and served as a base for raiding the territory of Judah. When Judas Maccabeus defeated Gorgias and the Syrians he pursued them to the plains of Jabneel, but did not take the fortress (1Macc 4:15). Gorgias was there attacked by the Jewish generals Joseph and Azarias, contrary to Judas\' orders, who were repulsed with loss (1Macc 5:56-60; Josephus, Ant, XII, viii, 6). Apollonius occupied it for King Demetrius (1Macc 10:69); and Cendebeus for Antiochus, and from there harassed the Jews (1Macc 15:40). Judas burned the port and navy of Jabneel (2Macc 12:8-9). It was taken by Simon in 142 BC (Josephus, Ant, XIII, vi, 7; BJ, I, ii, 2), together with Gazara and Joppa, but was restored to its inhabitants by Pompey in 62 BC (Ant., XIV, iv, 4), and was rebuilt by Gabinius in 57 BC (BJ, I, viii, 4). It was restored to the Jews by Augustus in 30 AD. Herod gave it to his sister Salome and she bequeathed it to Julia, the wife of Augustus (Ant., XVIII, ii, 2; BJ, II, ix, 1). The town and region were prosperous in Roman times, and when Jerusalem was besieged by Titus the Sanhedrin removed to Jabneel, and it afterward became the seat of a great rabbinical school (Milman, History of the Jews, II, 411-12), but was suppressed in the persecution under Hadrian. Antonius allowed it to be revived, but it was again suppressed because of hostile language on the part of the rabbis (ibid., 451-52). The Crusaders built there the castle of Ibelin, supposing it to be the site of Gath. It was occupied by the Saracens, and various inscriptions in Arabic of the 13th and 14th centuries have been found there (SWP, II, 441-42).<P>(2) A town of Naphtali mentioned in <a onClick="return mV(\'Jos\',19,33);">Jos 19:33</a>, and supposed to be the site of the modern Yemma, southwest of the sea of Galilee (SWP, I, 365). It is the Kefr Yama of the Talmud``138';
isbe[4778]='Jacan`ja\'-kan (ya\'kan, meaning not known; the King James Version, Jachan): A chief of a family descended from Gad (<a onClick="return mV(\'1Ch\',5,13);">1Ch 5:13</a>).``1';
isbe[4779]='Jachin`ja\'-kin (yakhin, "he will establish"):<P>(1) The 4th son of Simeon (<a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>; <a onClick="return mV(\'Num\',26,12);">Nu 26:12</a>). In <a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a> his name is given as "Jarib" (compare the King James Version margin, the Revised Version margin). "Jachinites," the patronymic of the family, occurs in <a onClick="return mV(\'Num\',26,12);">Nu 26:12</a>.<P>(2) Head of the 21st course of priests in the time of David (<a onClick="return mV(\'1Ch\',24,17);">1Ch 24:17</a>). It is used as a family name in <a onClick="return mV(\'1Ch\',9,10);">1Ch 9:10</a>, and as such also in <a onClick="return mV(\'Neh\',11,10);">Ne 11:10</a>, where some of the course are included in the list of those who, having returned from Babylon, willingly accepted the decision of the lot, and abandoned their rural retreats to become citizens and guardians of Jerusalem (<a onClick="return mV(\'Neh\',11,1);">Ne 11:1</a>f).``32';
isbe[4780]='Jachin And Boaz`ja\'-kin (yakhin, "he shall establish"; bo\'az, "in it is strength," <a onClick="return mV(\'1Ki\',7,\'15-22\');">1Ki 7:15-22</a>; <a onClick="return mV(\'2Ki\',25,16,17);">2Ki 25:16-17</a>; <a onClick="return mV(\'2Ch\',3,\'15-17\');">2Ch 3:15-17</a>; <a onClick="return mV(\'Jer\',52,17);">Jer 52:17</a>): These were the names of the two bronze pillars that stood before the temple of Solomon. They were not used in supporting the building; their appearance, therefore, must have been solely due to moral and symbolic reasons. What these are it is not easy to say. The pillars were not altar pillars with hearths at their top, as supposed by W.R. Smith (Religion of the Semites, 191, 468); rather they were "pillars of witness," as was the pillar that witnessed the contract between Jacob and Laban (<a onClick="return mV(\'Gen\',31,52);">Ge 31:52</a>). At difficulty arises about the height of the pillars. The writers in Kings and Jeremiah affirm that the pillars before the porch were 18 cubits high apiece (<a onClick="return mV(\'1Ki\',7,15);">1Ki 7:15</a>; <a onClick="return mV(\'Jer\',52,21);">Jer 52:21</a>), while the Chronicler states that they were 35 cubits (<a onClick="return mV(\'2Ch\',3,15);">2Ch 3:15</a>). Various methods have been suggested of reconciling this discrepancy, but it is more probable that there is a corruption in the Chronicler\'s number. On the contruction of the pillars and their capitals, see <a href="study/isbe/search.html?string=TEMPLE,+A1">TEMPLE</a>. At the final capture of Jerusalem they were broken up and the metal of which they were composed was sent to Babylon (<a onClick="return mV(\'2Ki\',25,13,16);">2Ki 25:13, 16</a>). In Ezekiel\'s ideal temple the two pillars are represented by pillars of wood (<a onClick="return mV(\'Eze\',40,49);">Eze 40:49</a>).``17';
isbe[4781]='Jacimus`ja\'-si-mus (Ant., XII, ix, 3).`<a href="./study/isbe/search.html?string=ALCIMUS">ALCIMUS</a>`1';
isbe[4782]='Jacinth`ja\'-sinth.`<a href="./study/isbe/search.html?string=HYACINTH">HYACINTH</a>; <a href="./study/isbe/search.html?string=STONES+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[4783]='Jackal`jak\'-ol:<P>(1) tannim, "jackals," the King James Version "dragons"; compare Arabic tinan, "wolf"; and compare tannin, Arab tinnin, "sea monster" or "monster" the English Revised Version "dragon" (<a onClick="return mV(\'Job\',7,12);">Job 7:12</a>; <a onClick="return mV(\'Psa\',74,13);">Ps 74:13</a>; <a onClick="return mV(\'Psa\',148,7);">148:7</a>; <a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a>; <a onClick="return mV(\'Isa\',51,9);">51:9</a>; <a onClick="return mV(\'Jer\',51,34);">Jer 51:34</a>), "serpent" (<a onClick="return mV(\'Exd\',7,9,10,12);">Ex 7:9-10, 12</a>; <a onClick="return mV(\'Deu\',32,33);">De 32:33</a>; <a onClick="return mV(\'Psa\',91,13);">Ps 91:13</a>), the King James Version "whale" (<a onClick="return mV(\'Gen\',1,21);">Ge 1:21</a>; <a onClick="return mV(\'Job\',7,12);">Job 7:12</a>); but tannin, "jackals," the King James Version "sea monsters" (<a onClick="return mV(\'Lam\',4,3);">La 4:3</a>), "jackal\'s well," the King James Version "dragon well" (<a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a>), and tannim, "monster," the King James Version and the English Revised Version "dragon" (<a onClick="return mV(\'Eze\',29,3);">Eze 29:3</a>; <a onClick="return mV(\'Eze\',32,2);">32:2</a>).<P>(2) \'iyim, "wolves," the King James Version "wild beasts of the islands"; compare \'i, plural iyim, "island"; also \'ayyah, "a cry," \'awah, "to cry," "to howl"; Arabic \'auwa\', "to bark" (of dogs, wolves, or jackals); \'ibn \'awa\', colloquially wawi, "jackal."<P>(3) tsiyim, "wild beasts of the desert."<P>(4) \'ochim, "doleful creatures."<P>"Jackals" occurs as a translation of tannim, the King James Version "dragons," in <a onClick="return mV(\'Job\',30,29);">Job 30:29</a>; <a onClick="return mV(\'Psa\',44,19);">Ps 44:19</a>; <a onClick="return mV(\'Isa\',13,22);">Isa 13:22</a>; <a onClick="return mV(\'Isa\',34,13);">34:13</a>; <a onClick="return mV(\'Isa\',35,7);">35:7</a>; <a onClick="return mV(\'Isa\',43,20);">43:20</a>; <a onClick="return mV(\'Jer\',9,11);">Jer 9:11</a>; <a onClick="return mV(\'Jer\',10,22);">10:22</a>; <a onClick="return mV(\'Jer\',14,6);">14:6</a>; <a onClick="return mV(\'Jer\',49,33);">49:33</a>; <a onClick="return mV(\'Jer\',51,37);">51:37</a>; of the feminine plural form tannoth in <a onClick="return mV(\'Mal\',1,3);">Mal 1:3</a>, and of tannin in <a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a> and <a onClick="return mV(\'Lam\',4,3);">La 4:3</a>. Tannim is variously referred to a root meaning "to howl," and to a root meaning "to stretch out" trop. "to run swiftly, i.e. with outstretched neck and limb extended" (Gesenius). Either derivation would suit "wolf" equally as well as "jackal." The expression in <a onClick="return mV(\'Jer\',10,22);">Jer 10:22</a>, "to make the cities of Judah a desolation, a dwelling-place of jackals," seems, however, especially appropriate of jackals. The same is true of <a onClick="return mV(\'Isa\',34,13);">Isa 34:13</a>; <a onClick="return mV(\'Jer\',9,11);">Jer 9:11</a>; <a onClick="return mV(\'Jer\',49,33);">49:33</a>, and <a onClick="return mV(\'Jer\',51,37);">51:37</a>.<P>The jackal (from Persian shaghal), Canis aureus, is found about the Mediterranean except in Western Europe. It ranges southward to Abyssinia, and eastward, in Southern Asia, to farther India. It is smaller than a large dog, has a moderately bushy tail, and is reddish brown with dark shadings above. It is cowardly and nocturnal. Like the fox, it is destructive to poultry, grapes, and vegetables, but is less fastidious, and readily devours the remains of others\' feasts. Jackals generally go about in small companies. Their peculiar howl may frequently be heard in the evening and at any time in the night. It begins with a high-pitched, long-drawn-out cry. This is repeated two or three times, each time in a higher key than before. Finally there are several short, loud, yelping barks. Often when one raises the cry others join in. Jackals are not infrequently confounded with foxes. They breed freely with dogs.<P>While tannim is the only word translated "jackal" in English Versions of the Bible, the words \'iyim, tsiyim, and \'ochim deserve attention. They, as well as tannim, evidently refer to wild creatures inhabiting desert places, but it is difficult to say for what animal each of the words stands. All four (together with benoth ya\'anah and se\'irim) are found in <a onClick="return mV(\'Isa\',13,21,22);">Isa 13:21-22</a>: "But wild beasts of the desert (tsiyim) shall lie there; and their houses shall be full of doleful creatures (\'ochim); and ostriches (benoth ya\'anah) shall dwell there, and wild goats (se\'irim) shall dance there. And wolves (\'iyim) shall cry in their castles, and jackals (tannim) in the pleasant palaces."<P>In the King James Version \'iyim (<a onClick="return mV(\'Isa\',13,22);">Isa 13:22</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>; <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>) is translated "wild beasts of the islands" (compare \'iyim, "islands"). the King James Version margin has merely the transliteration iim, the Revised Version (British and American) "wolves," the Revised Version margin "howling creatures." Gesenius suggests the jackal, which is certainly a howler. While the wolf has a blood-curdling howl, it is much more rarely heard than the jackal.<P>Tsiyim (<a onClick="return mV(\'Psa\',72,9);">Ps 72:9</a>; <a onClick="return mV(\'Psa\',74,14);">74:14</a>; <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',23,13);">23:13</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>; <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>) has been considered akin to tsiyah, "drought" (compare \'erets tsiyah, "a dry land" (<a onClick="return mV(\'Psa\',63,1);">Ps 63:1</a>)), and is translated in the Revised Version (British and American) as follows: <a onClick="return mV(\'Psa\',72,9);">Ps 72:9</a>, "they that dwell in the wilderness"; <a onClick="return mV(\'Psa\',74,14);">74:14</A>, "the people inhabiting the wilderness"; <a onClick="return mV(\'Isa\',23,13);">Isa 23:13</a>, "them that dwell in the wilderness," the Revised Version margin "the beasts of the wilderness"; <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>; <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>, "wild beasts of the desert." There would be some difficulty in referring tsiyim in <a onClick="return mV(\'Psa\',72,9);">Ps 72:9</a> to beasts rather than to men, but that is not the case in <a onClick="return mV(\'Psa\',74,14);">Ps 74:14</a> and <a onClick="return mV(\'Isa\',23,13);">Isa 23:13</a>. "Wild cats" have been suggested.<p>\'Ochim, "doleful creatures," perhaps onomatopoetic, occurs only in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>. The translation "owls" has been suggested, and is not unsuitable to the context.<P>It is not impossible that tannim and \'iyim may be different names of the jackals. \'Iyim, tsiyim, and tannim occur together also in <a onClick="return mV(\'Isa\',34,13,14);">Isa 34:13-14</a>, and \'iyim and tsiyim in <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>. Their similarity in sound may have much to do with their collocation. The recognized word for "wolf," ze\'ebh (compare Arabic dhi\'b), occurs 7 times in the Old Testament.`<a href="./study/isbe/search.html?string=DRAGON">DRAGON</a>; <a href="./study/isbe/search.html?string=WOLF">WOLF</a>; <a href="./study/isbe/search.html?string=ZOOLOGY">ZOOLOGY</a>`37';
isbe[4784]='Jackal\'s Well`(\'en ha-tannin; Septuagint has pege ton sukon, "fountain of the figs"; the King James Version dragon well): A well or spring in the valley of Hinnom between the "Gate of the Gai" and the Dung Gate (<a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a>). No such source exists in the Wady er Rababi (see <a href="study/isbe/search.html?string=HINNOM,+VALLEY+OF">HINNOM, VALLEY OF</a>) today, although it is very probable that a well sunk to the rock in the lower parts of this valley might strike a certain amount of water trickling down the valley-bottom. G.A. Smith suggests (Jerusalem, I, chapter iv) that this source may have arisen as the result of an earthquake, hence, the name "dragon," and have subsequently disappeared; but it is at least as likely that it received its name from the jackals which haunted this valley, as the pariah dogs do today, to consume the dead bodies which were thrown there.`<a href="./study/isbe/search.html?string=HINNOM+VALLEY+OF">HINNOM, VALLEY OF</a>; <a href="./study/isbe/search.html?string=JACKAL">JACKAL</a>`117';
isbe[4785]='Jacob (1)`ja\'-kub:<P><b>I. NAME</b><P class="in15">1. Form and Distribution<P class="in15">2. Etymology and Associations<P><b>II. HIS PLACE IN THE PATRIARCHAL SUCCESSION</b><P class="in15">1. As the Son of Isaac and Rebekah<P class="in15">2. As the Brother of Esau<P class="in15">3. As the Father of the Twelve<P><b>III. BIOGRAPHY</b><P class="in15">1. With Isaac in Canaan<P class="in15">2. To Aram and Back<P class="in15">3. In Canaan Again<P class="in15">4. Last Years in Egypt<P><b>IV. CHARACTER AND BELIEFS</b><P class="in15">1. Natural Qualities<P class="in15">2. Stages of Development<P class="in15">3. Attitude toward the Promise<P class="in15">4. How Far a "Type" of Israel<P><b>V. REFERENCES OUTSIDE OF GENESIS</b><P class="in15">1. In the Old Testament<P class="in15">2. In the New Testament<P><b>VI. MODERN INTERPRETATIONS OF JACOB</b><P class="in15">1. Personification of the Hebrew Nation<P class="in15">2. God and Demi-God<P class="in15">3. Character of Fiction<hr /><P>I. Name.<P>1. Form and Distribution:<P>ya\'aqobh (5 times ya\'aqowbh); Iakob, is in form a verb in the Qal imperfect, 3rd masculine singular. Like some 50 other Hebrew names of this same form, it has no subject for the verb expressed. But there are a number of independent indications that Jacob belongs to that large class of names consisting of a verb with some Divine name or title (in this case \'El) as the subject, from which the common abbreviated form is derived by omitting the subject.<P>(a) In Babylonian documents of the period of the Patriarchs, there occur such personal names as Ja-ku-bi, Ja-ku-ub-ilu (the former doubtless an abbreviation of the latter), and Aq-bu-u (compare Aq-bi-a-hu), according to Hilprecht a syncopated form for A-qu(?)-bu(-u), like Aq-bi-ili alongside of A-qa-bi-ili; all of which may be associated with the same root \'aqabh, as appears in Jacob (see H. Ranke, Early Babylonian Personal Names,1905,with annotations by Professor Hilprecht as editor, especially pp. 67, 113, 98 and 4).<P>(b) In the list of places in Palestine conquered by the Pharaoh Thutmose III appears a certain J\'qb\'r, which in Egyptian characters represents the Semitic letters ya\'aqobh-\'el, and which therefore seems to show that in the earlier half of the 15th century BC (so Petrie, Breasted) there was a place (not a tribe; see W. M. Muller, Asien und Europa, 162ff) in Central Palestine that bore a name in some way connected with "Jacob." Moreover, a Pharaoh of the Hyksos period bears a name that looks like ya\'aqobh-\'el (Spiegelberg, Orientalische Literaturzeitung, VII, 130).<P>(c) In the Jewish tractate Pirqe Abhoth, iii.l, we read of a Jew named \'Aqabhyah, which is a name composed of the same verbal root as that in Jacob, together with the Divine name Yahu (i.e. Yahweh) in its common abbreviated form. It should be noted that the personal names \'Aqqubh and Ya\'aqobhah (accent on the penult) also occur in the Old Testament, the former borne by no less than 4 different persons; also that in the Palmyrene inscriptions we find a person named \'ath\'aqobh, a name in which this same verb \'aqabh is preceded by the name of the god \'Ate, just as in \'Aqabhyah it is followed by the name Yahu.<P>2. Etymology and Associations:<P>Such being the form and distribution of the name, it remains to inquire: What do we know of its etymology and what were the associations it conveyed to the Hebrew ear?<P>The verb in all its usages is capable of deduction, by simple association of ideas, from the noun "heel." "To heel" might mean:<P>(a) "to take hold of by the heel" (so probably <a onClick="return mV(\'Hsa\',12,3);">Ho 12:3</a>; compare <a onClick="return mV(\'Gen\',27,36);">Ge 27:36</a>);<P>(b) "to follow with evil intent," "to supplant" or in general "to deceive" (so <a onClick="return mV(\'Gen\',27,36);">Ge 27:36</a>; <a onClick="return mV(\'Jer\',9,4);">Jer 9:4</a>, where the parallel, "go about with slanders," is interesting because the word so translated is akin to the noun "foot," as "supplant" is to "heel");<P>(c) "to follow with good intent," whether as a slave (compare our English "to heel," of a dog) for service, or as a guard for protection, hence, "to guard" (so in Ethiopic), "to keep guard over", and thus "to restrain" (so <a onClick="return mV(\'Job\',37,4);">Job 37:4</a>);<P>(d) "to follow," "to succeed," "to take the place of another" (so Arabic, and the Hebrew noun \'eqebh, "consequence," "recompense," whether of reward or punishment).<P>Among these four significations, which most commends itself as the original intent in the use of this verb to form a proper name? The answer to this question depends upon the degree of strength with which the Divine name was felt to be the subject of the verb As Jacob-el, the simplest interpretation of the name is undoubtedly, as Baethgen urges (Beitrage zur sem. Religionsgeschichte, 158), "God rewardeth" (d) above), like Nathanael, "God hath given," etc. But we have already seen that centuries before the time when Jacob is said to have been born, this name was shortened by dropping the Divine subject; and in this shortened form it would be more likely to call up in the minds of all Semites who used it, associations with the primary, physical notion of its root (a) above). Hence, there is no ground to deny that even in the patriarchal period, this familiar personal name Jacob lay ready at hand—a name ready made, as it were—for this child, in view of the peculiar circumstances of its birth; we may say, indeed, one could not escape the use of it. (A parallel case, perhaps, is <a onClick="return mV(\'Gen\',38,28,30);">Ge 38:28, 30</a>, Zerah; compare Zerahiah.) The associations of this root in everyday use in Jacob\'s family to mean "to supplant" led to the fresh realization of its appropriateness to his character and conduct when he was grown (b) above). This construction does not interfere with a connection between the patriarch Jacob and the "Jacob-els" referred to above (under 1, (b)), should that connection on other grounds appear probable. Such a longer form was perhaps for every "Jacob" an alternative form of his name, and under certain circumstances may have been used by or of even the patriarch Jacob.<P>II. Place in the Patriarchal Succession.<P>1. As the Son of Isaac and Rebekah:<P>In the dynasty of the "heirs of the promise," Jacob takes his place, first, as the successor of Isaac. In Isaac\'s life the most significant single fact had been his marriage with Rebekah instead of with a woman of Canaan. Jacob therefore represents the first generation of those who are determinately separate from their environment. Abraham and his household were immigrants in Canaan; Jacob and Esau were natives of Canaan in the second generation, yet had not a drop of Canaanitish blood in their veins. Their birth was delayed till 20 years after the marriage of their parents. Rebekah\'s barrenness had certainly the same effect, and probably the same purpose, as that of Sarah: it drove Isaac to Divine aid, demanded of him as it had of Abraham that "faith and patience" through which they "inherited the promises" (<a onClick="return mV(\'Hbr\',6,12);">Heb 6:12</a>), and made the children of this pair also the evident gift of God\'s grace, so that Isaac was the better able "by faith" to "bless Jacob and Esau even concerning things to come" (<a onClick="return mV(\'Hbr\',11,20);">Heb 11:20</a>).<P>2. As the Brother of Esau:<P>These twin brothers therefore share thus far the same relation to their parents and to what their parents transmit to them. But here the likeness ceases. "Being not yet born, neither having done anything good or bad, that the purpose of God according to election might stand, not of works, but of him that calleth, it was said unto (Rebecca), The elder shall serve the younger" (<a onClick="return mV(\'Rom\',9,11,12);">Ro 9:11-12</a>). In the Genesis-narrative, without any doctrinal assertions either adduced to explain it, or deduced from it, the fact is nevertheless made as clear as it is in Malachi or Romans, that Esau is rejected, and Jacob is chosen as a link in the chain of inheritance that receives and transmits the promise.<P>3. As Father of the Twelve:<P>With Jacob the last person is reached who, for his own generation, thus sums up in a single individual "the seed" of promise. He becomes the father of 12 sons, who are the progenitors of the tribes of the "peculiar people." It is for this reason that this people bears his name, and not that of his father Isaac or that of his grandfather Abraham. The "children of Israel," the "house of Jacob," are the totality of the seed of the promise. The Edomites too are children of Isaac. Ishmaelites equally with Israelites boast of descent from Abraham. But the twelve tribes that called themselves "Israel" were all descendants of Jacob, and were the only descendants of Jacob on the agnatic principle of family-constitution.<P>III. Biography.<P>The life of a wanderer (<a onClick="return mV(\'Deu\',26,5);">De 26:5</a> the Revised Version, margin) such as Jacob was, may often be best divided on the geographical principle. Jacob\'s career falls into the four distinct periods: that of his residence with Isaac in Canaan, that of his residence with Laban in Aram, that of his independent life in Canaan and that of his migration to Egypt.<P>1. With Isaac in Canaan:<P>Jacob\'s birth was remarkable in respect of<P>(a) its delay for 20 years as noted above,<P>(b) that condition of his mother which led to the Divine oracle concerning his future greatness and supremacy, and<P>(c) the unusual phenomenon that gave him his name: "he holds by the heel" (see above, I, 2).<P>Unlike his twin brother, Jacob seems to have been free from any physical peculiarities; his smoothness (<a onClick="return mV(\'Gen\',27,11);">Ge 27:11</a>) is only predicated of him in contrast to Esau\'s hairiness. These brothers, as they developed, grew apart in tastes and habits. Jacob, like his fat
