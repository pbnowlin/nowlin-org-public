isbe = [];

isbe[6501]='Odes of Solomon`odz.`<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`1';
isbe[6502]='Odollam`o-dol\'-am (Odollam): The Greek form of <a href="./study/isbe/search.html?string=ADULLAM">ADULLAM</a> (which see), found only in 2Macc 12:38``1';
isbe[6503]='Odomera`od-o-me\'-ra (Odomera; Codex Vaticanus Odoaarres, Itala Odaren; the King James Version Odonarkes, margin Odomarra): It is not certain whether Odomera was an independent Bedouin chief, perhaps an ally of the Syrians, or an officer of Bacchides. He was defeated by Jonathan in his campaign against Bacchides (1Macc 9:66) in 156 BC.``1';
isbe[6504]='Odor`o\'-der: In the Old Testament the rendering of besem, "fragrance" (<a onClick="return mV(\'2Ch\',16,14);">2Ch 16:14</a>; <a onClick="return mV(\'Est\',2,12);">Es 2:12</a>; <a onClick="return mV(\'Jer\',34,5);">Jer 34:5</a>, the Revised Version (British and American) "burnings"), and of one or two other words; in the New Testament of osme (<a onClick="return mV(\'Jhn\',12,3);">Joh 12:3</a>; <a onClick="return mV(\'Phl\',4,18);">Php 4:18</a>; <a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a> the Revised Version (British and American)); in <a onClick="return mV(\'Rev\',5,8);">Re 5:8</a>; <a onClick="return mV(\'Rev\',18,13);">18:13</a>, of thumiama, where the Revised Version (British and American) (with the King James Version margin in former passage) has "incense."`<a href="./study/isbe/search.html?string=SAVOR">SAVOR</a>`1';
isbe[6505]='Of`ov:<P>(1) In Anglo-Saxon, had the meaning "from," "away from" (as the strengthened form "off" has still), and was not used for genitive or possessive relations, these being expressed by special case-forms. In the Norman period, however, "of" was taken to represent the French de (a use well developed by the time of Chaucer), and in the Elizabethan period both senses of "of" were in common use. But after about 1600 the later force of the word became predominant, and in the earlier sense (which is now practically obsolete) it was replaced by other prepositions. In consequence the King James Version (and in some cases the Revised Version (British and American)) contains many uses of "of" that are no longer familiar—most of them, to be sure, causing no difficulty, but there still being a few responsible for real obscurities.<P>(2) Of the uses where "of" signifies "from," the most common obscure passages are those where "of" follows a verb of hearing. In modern English "hear of" signifies "to gain information about," as it does frequently in the King James Version (<a onClick="return mV(\'Mar\',7,25);">Mr 7:25</a>; <a onClick="return mV(\'Rom\',10,14);">Ro 10:14</a>, etc.). But more commonly this use of "of" in the King James Version denotes the source from which the information is derived. So <a onClick="return mV(\'Jhn\',15,15);">Joh 15:15</a>, "all things that I have heard of my Father"; <a onClick="return mV(\'Act\',10,22);">Ac 10:22</a>, "to hear words of thee"; <a onClick="return mV(\'Act\',28,22);">28:22</a>, "We desire to hear of thee"; compare <a onClick="return mV(\'1Th\',2,13);">1Th 2:13</a>; <a onClick="return mV(\'2Ti\',1,13);">2Ti 1:13</a>; <a onClick="return mV(\'2Ti\',2,2);">2:2</a>, etc. (similarly <a onClick="return mV(\'Mat\',11,29);">Mt 11:29</a>, "and learn of me"; compare <a onClick="return mV(\'Jhn\',6,45);">Joh 6:45</a>). All of these are ambiguous and in modern English give a wrong meaning, so that in most cases (but not <a onClick="return mV(\'Mat\',11,29);">Mt 11:29</a> or <a onClick="return mV(\'Act\',28,22);">Ac 28:22</a>) the Revised Version (British and American) substitutes "from." A different example of the same use of "of" is <a onClick="return mV(\'2Cr\',5,1);">2Co 5:1</a>, "a building of God" (the Revised Version (British and American) "from"). So <a onClick="return mV(\'Mar\',9,21);">Mr 9:21</a>, "of a child," means "from childhood" ("from a child," the Revised Version (British and American), is dubious English). A still more obscure passage is <a onClick="return mV(\'Mat\',23,25);">Mt 23:25</a>, "full of extortion and excess." "Full of" elsewhere in the King James Version (and even in the immediate context, <a onClick="return mV(\'Mat\',23,27,28);">Mt 23:27,28</a>) refers to the contents, but here the "of" represents the Greek ek, "out of," and denotes the source—"The contents of your cup and platter have been purchased from the gains of extortion and excess." the Revised Version (British and American) again substitutes "from," with rather awkward results, but the Greek itself is unduly compressed. In <a onClick="return mV(\'Mar\',11,8);">Mr 11:8</a>, one of the changes made after the King James Version was printed has relieved an obscurity, for where the edition of 1611 read "cut down branches of the trees," the modern editions have "off" (the Revised Version (British and American) "from"). For clear examples of this use of "of," without the obscurities, compare Judith 2:21, "they went forth of Nineveh"; 2Macc 4:34, "forth of the sanctuary"; and, especially, <a onClick="return mV(\'Mat\',21,25);">Mt 21:25</a>, "The baptism of John, whence was it? from heaven, or of men?" Here "from" and "of" represent exactly the same Greek preposition, and the change in English is arbitrary (the Revised Version (British and American) writes "from" in both cases).<P>(3) In a weakened sense this use of "of" as "from" was employed rather loosely to connect an act with its source or motive. Such uses are generally clear enough, but the English today seems sometimes rather curious: <a onClick="return mV(\'Mat\',18,13);">Mt 18:13</a>, "rejoiceth more of that sheep" (the Revised Version (British and American) "over"); <a onClick="return mV(\'Psa\',99,8);">Ps 99:8</a>, "vengeance of their inventions" (so the King James Version); <a onClick="return mV(\'1Cr\',7,4);">1Co 7:4</a>, "hath not power of her own body" (the Revised Version (British and American) "over"), etc.<P>(4) A very common use of "of" in the King James Version is to designate the agent—a use complicated by the fact that "by" is also employed for the same purpose and the two interchanged freely. So in <a onClick="return mV(\'Luk\',9,7);">Lu 9:7</a>, "all that was done by him...it was said of some..," the two words are used side by side for the same Greek preposition (the Revised Version (British and American) replaces "of" by "by," but follows a different text in the first part of the verse). Again, most of the examples are clear enough, but there are some obscurities. So in <a onClick="return mV(\'Mat\',19,12);">Mt 19:12</a>, "which were made eunuchs of men," the "of men" is at first sight possessive (the Revised Version (British and American) "by men"). Similarly, 2Esdras 16:30, "There are left some clusters of them that diligently seek through the vineyard" (the Revised Version (British and American) "by them"). So <a onClick="return mV(\'1Cr\',14,24);">1Co 14:24</a>, "He is convinced of all he is judged of all," is quite misleading (the Revised Version (British and American) "by all" in both cases). <a onClick="return mV(\'Phl\',3,12);">Php 3:12</a>, the King James Version "I am apprehended of Christ Jesus," seems almost meaningless (the Revised Version (British and American) "by").<P>(5) In some cases the usage of the older English is not sufficient to explain "of" in the King James Version. So <a onClick="return mV(\'Mat\',18,23);">Mt 18:23</a>, "take account of his servants," is a very poor rendition of "make a reckoning with his servants" (so the Revised Version (British and American)). In <a onClick="return mV(\'Act\',27,5);">Ac 27:5</a>, the "sea of Cilicia" may have been felt to be the "sea which is off Cilicia" (compare the Revised Version (British and American)), but there are no other instances of this use. In <a onClick="return mV(\'2Cr\',2,12);">2Co 2:12</a>, "A door was opened unto me of the Lord" should be "in the Lord" (so the Revised Version (British and American)). <a onClick="return mV(\'2Sa\',21,4);">2Sa 21:4</a>, "We will have no silver nor gold of Saul, nor of his house," is very loose, and the Revised Version (British and American) rewrites the verse entirely. In all these cases, the King James Version seems to have looked solely for smooth English, without caring much for exactness. In <a onClick="return mV(\'1Pe\',1,11);">1Pe 1:11</a>, however, "sufferings of Christ" probably yields a correct sense for a difficult phrase in the Greek (so the Revised Version (British and American), with "unto" in the margin), but a paraphrase is needed to give the precise meaning. And, finally, in <a onClick="return mV(\'Hbr\',11,18);">Heb 11:18</a>, the Greek itself is ambiguous and there is no way of deciding whether the preposition employed (pros) means "to" (so the Revised Version (British and American)) or "of" (so the King James Version, the Revised Version margin; compare <a onClick="return mV(\'Hbr\',1,7);">Heb 1:7</a>, where "of" is necessary).``48';
isbe[6506]='Offence; offend`o-fens\', o-fend\' (mikhshol, \'asham, chata\'; skandalon, skandalizo): "Offend" is either transitive or intransitive As transitive it is primarily "to strike against," hence, "to displease" "to make angry," "to do harm to," "to affront," in Scripture, "to cause to sin"; intransitive it is "to sin," "to cause anger," in Scripture, "to be caused to sin." "Offence" is either the cause of anger, displeasure, etc., or a sin. In Scripture we have the special significance of a stumbling-block, or cause of falling, sin, etc.<P>1. Old Testament Usage:<P>In the Old Testament it is frequently the translation of \'asham, "to be guilty," "to transgress": <a onClick="return mV(\'Jer\',2,3);">Jer 2:3</a>, the Revised Version (British and American) "shall be held guilty"; <a onClick="return mV(\'Jer\',50,7);">50:7</A>, the Revised Version (British and American) "not guilty"; <a onClick="return mV(\'Eze\',25,12);">Eze 25:12</a>, "hath greatly offended"; <a onClick="return mV(\'Hsa\',4,15);">Ho 4:15</a>, the Revised Version margin "become guilty"; <a onClick="return mV(\'Hsa\',5,15);">5:15</a>, "till they acknowledge their offense," the Revised Version margin "have borne their guilt"; <a onClick="return mV(\'Hsa\',13,1);">13:1</A>, "He offended in Baal," the Revised Version margin "became guilty"; <a onClick="return mV(\'Hab\',1,11);">Hab 1:11</a>, "He shall pass over, and offend, (imputing) this his power unto his god," the Revised Version (British and American) "Then shall he sweep by (as) a wind, and shall pass over (margin "transgress"), and be guilty, (even) he whose might is his god."<P>In <a onClick="return mV(\'2Ch\',28,13);">2Ch 28:13</a>, we have \'ashmath \'al, literally, "the offense against," the Revised Version (British and American) "a trespass (margin "or guilt") against Yahweh"; we have also chata\', "to miss the mark," "to sin," "to err" (<a onClick="return mV(\'Gen\',20,9);">Ge 20:9</a>, the Revised Version (British and American) "sinned against thee"; <a onClick="return mV(\'Gen\',40,1);">40:1</A>, "offended their lord"; <a onClick="return mV(\'2Ki\',18,14);">2Ki 18:14</a>; <a onClick="return mV(\'Jer\',37,18);">Jer 37:18</a>, the Revised Version (British and American) "sinned against thee"); baghadh, "to deal treacherously" (<a onClick="return mV(\'Psa\',73,15);">Ps 73:15</a>, "offend against the generation of thy children," the Revised Version (British and American) "dealt treacherously with"); chabhal, "to act wickedly" (<a onClick="return mV(\'Job\',34,31);">Job 34:31</a>); mikhshol, "a stumbling block" (<a onClick="return mV(\'Lev\',19,14);">Le 19:14</a>; translated in <a onClick="return mV(\'Isa\',8,14);">Isa 8:14</a>, "a rock of offense"; compare <a onClick="return mV(\'Eze\',14,3);">Eze 14:3</a>; <a onClick="return mV(\'1Sa\',25,31);">1Sa 25:31</a>; <a onClick="return mV(\'Psa\',119,165);">Ps 119:165</a>, "nothing shall offend," the Revised Version (British and American) "no occasion of stumbling"; compare <a onClick="return mV(\'Isa\',57,14);">Isa 57:14</a>; <a onClick="return mV(\'Jer\',6,21);">Jer 6:21</a>, etc.); pasha\', "to be fractious," "to transgress" (<a onClick="return mV(\'Pro\',18,19);">Pr 18:19</a>, "a brother offended," the Revised Version margin "injured"). "Offence" is mikhshol (see above, <a onClick="return mV(\'1Sa\',25,31);">1Sa 25:31</a>; <a onClick="return mV(\'Isa\',8,14);">Isa 8:14</a>); chet\', "sin," etc. (<a onClick="return mV(\'Ecc\',10,4);">Ec 10:4</a>, "Yielding pacifleth great offenses," the American Standard Revised Version "Gentleness (the English Revised Version "yielding") allayeth," the American Revised Version margin "Calmness (the English Revised Version "gentleness") leaveth great sins undone"). "Offender" is chatta\' (<a onClick="return mV(\'1Ki\',1,21);">1Ki 1:21</a>, margin "Hebrew: sinners"; <a onClick="return mV(\'Isa\',29,21);">Isa 29:21</a>, "that make a man an offender for a word," the American Standard Revised Version "that make a man an offender in his cause," margin "make men to offend by (their) words," or, "for a word," the English Revised Version "in a cause," margin "make men to offend by (their) words").<P>2. New Testament Usage:<P>The New Testament usage of these words deserves special attention. The word most frequently translated "offend" in the King James Version is skandalizo (skandalon, "offence"), very frequent in the Gospels (<a onClick="return mV(\'Mat\',5,29);">Mt 5:29</a>, "if thy right eye offend thee"; <a onClick="return mV(\'Mat\',5,30);">5:30</A>; <a onClick="return mV(\'Mat\',11,6);">11:6</a>; <a onClick="return mV(\'Mat\',18,6);">18:6</A>, "whoso shall offend one of these little ones"; <a onClick="return mV(\'Mat\',13,41);">13:41</A>, "all things that offend"; <a onClick="return mV(\'Luk\',17,1);">Lu 17:1</a>, "It is impossible but that offenses will come," etc.; <a onClick="return mV(\'Rom\',14,21);">Ro 14:21</a>; <a onClick="return mV(\'Rom\',16,17);">16:17</a>, "Mark them which cause...offenses"; <a onClick="return mV(\'1Cr\',8,13);">1Co 8:13</a> twice, "if meat make my brother to offend," etc.). Skandalon is primarily "a trap-stick," "a bentstick on which the bait is fastened which the animal strikes against and so springs the trap," hence, it came to denote a "snare," or anything which one strikes against injuriously (it is Septuagint\'s word for moqesh, a "noose" or "snare," <a onClick="return mV(\'Jos\',23,13);">Jos 23:13</a>; <a onClick="return mV(\'1Sa\',18,21);">1Sa 18:21</a>); "a stumbling-block" Septuagint for mikhshol (see above), <a onClick="return mV(\'Lev\',19,14);">Le 19:14</a>). For skandalizo, skandalon, translated in the King James Version, "offend," "offence," the Revised Version (British and American) gives "cause to stumble," "stumbling-block," etc.; thus, <a onClick="return mV(\'Mat\',5,29);">Mt 5:29</a>, "if thy right eye causeth thee to stumble," i.e. "is an occasion for thy falling into sin"; <a onClick="return mV(\'Mat\',16,23);">Mt 16:23</a>, "Thou art a stumbling-block unto me," an occasion of turning aside from the right path; in <a onClick="return mV(\'Mat\',26,31,33);">Mt 26:31,33</a> twice, "offended" is retained, margin, <a onClick="return mV(\'Mat\',26,33);">26:33</A> twice, "Greek: caused to stumble" (same word in <a onClick="return mV(\'Mat\',26,31);">26:31</A>); <a onClick="return mV(\'Mar\',9,42);">Mr 9:42</a>, "whosoever shall cause one of these little ones that believe on me to stumble," to fall away from the faith, or fall into sin; <a onClick="return mV(\'Luk\',17,1);">Lu 17:1</a>, "It is impossible but that occasions of stumbling should come; but woe unto him, through whom they come"; in <a onClick="return mV(\'Rom\',14,21);">Ro 14:21</a>; <a onClick="return mV(\'Rom\',16,17);">16:17</a>; in <a onClick="return mV(\'1Cr\',8,\'1-\');">1Co 8</a>, Paul\'s language has the same meaning, and we see how truly he had laid to heart the Saviour\'s earnest admonitions—"weak brethren" with him answering to the master\'s "little ones who believe"; <a onClick="return mV(\'Rom\',14,21);">Ro 14:21</a>, "It is good not to eat flesh, nor to drink wine, nor to do anything whereby thy brother stumbleth," i.e. "is led by your example to do that which he cannot do with a good conscience"; <a onClick="return mV(\'Rom\',14,20);">14:20</A>, "It is evil for that man who eateth with offense (dia proskommatos)," so as to place a stumbling-block before his brother, or, rather, \'without the confidence that he is doing right\'; compare <a onClick="return mV(\'Rom\',14,23);">14:23</A>, "He that doubteth is condemned if he eat, because he eateth not of faith; and whatsoever is not of faith is sin"; so <a onClick="return mV(\'1Cr\',8,13);">1Co 8:13</a>; <a onClick="return mV(\'Rom\',16,17);">Ro 16:17</a>, "Mark them that are causing the divisions and occasions of stumbling, contrary to the doctrine, (margin "teaching") which ye learned" (Is not the "teaching" of Christ Himself implied here?). Everything that would embolden another to do that which would be wrong for him, or that would turn anyone away from the faith, must be carefully avoided, seeking to please, not ourselves, but to care for our brother, "for whom Christ died," "giving no occasion of stumbling (proskope) in anything" (<a onClick="return mV(\'2Cr\',6,3);">2Co 6:3</a>).<P>Aproskopos, "not causing to stumble," is translated "void of offense" (<a onClick="return mV(\'Act\',24,16);">Ac 24:16</a>, "a conscience void of offense"; <a onClick="return mV(\'1Cr\',10,32);">1Co 10:32</a>, the Revised Version (British and American) "occasion of stumbling"; <a onClick="return mV(\'Phl\',1,10);">Php 1:10</a>, "void of offense"); hamartano, "to miss the mark," "to sin," "to err," is translated "offended" (<a onClick="return mV(\'Act\',25,8);">Ac 25:8</a>, the Revised Version (British and American) "sinned"); hamartia, "sin," "error" (<a onClick="return mV(\'2Cr\',11,7);">2Co 11:7</a>, the Revised Version (British and American) "Did I commit a sin?"); ptaio, "to stumble," "fall" (<a onClick="return mV(\'Jam\',2,10);">Jas 2:10</a>; <a onClick="return mV(\'Jam\',3,2);">3:2</a> twice, "offend," the Revised Version (British and American) "stumble," "stumbleth"); paraptoma, "a falling aside or away," is translated "offence" (<a onClick="return mV(\'Rom\',4,25);">Ro 4:25</a>; <a onClick="return mV(\'Rom\',5,\'15-18\',20);">5:15,16,17,18,20</a>, in each case the Revised Version (British and American) "trespass"); adikeo, "to be unrighteous" (<a onClick="return mV(\'Act\',25,11);">Ac 25:11</a>, the Revised Version (British and American) "wrongdoer," the King James Version "offender").<P>In the Apocrypha we have "offence" (skandalon, Judith 12:2), the Revised Version (British and American) "I will not eat thereof, lest there be an occasion of stumbling"; "offend" (hamartano, Ecclesiasticus 7:7), the Revised Version (British and American) "sin"; "greatly offended" (prosochthizo, Ecclesiasticus 25:2); "offended" (skandalizo, Ecclesiasticus 32:15), the Revised Version (British and American) "stumble."``185';
isbe[6507]='Offer; offering`of\'-er, of\'-er-ing.`<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`1';
isbe[6508]='Office`of\'-is: In the Old Testament the word is often used in periphrastic renderings, e.g. "minister...in the priest\'s office," literally, act as priest (<a onClick="return mV(\'Exd\',28,1);">Ex 28:1</a>, etc.); "do the office of a midwife," literally, cause or help to give birth (<a onClick="return mV(\'Exd\',1,16);">Ex 1:16</a>). But the word is also used as a rendering of different Hebrew words, e.g. ken, "pedestal," "place" (<a onClick="return mV(\'Gen\',40,13);">Ge 40:13</a>, the King James Version "place"; <a onClick="return mV(\'Gen\',41,13);">Ge 41:13</a>); \'abhodhah, "labor," "work" (<a onClick="return mV(\'1Ch\',6,32);">1Ch 6:32</a>); pequddah, "oversight," "charge" (<a onClick="return mV(\'Psa\',109,8);">Ps 109:8</a>); ma\'amadh, literally, "standing," e.g. waiting at table (<a onClick="return mV(\'1Ch\',23,28);">1Ch 23:28</a>); mishmar, "charge," observance or service of the temple (<a onClick="return mV(\'Neh\',13,14);">Ne 13:14</a> the King James Version).<P>Similarly in the New Testament the word is used in periphrastic renderings, e.g. priest\'s office (<a onClick="return mV(\'Luk\',1,8,9);">Lu 1:8,9</a>); office of a deacon (diakonia, <a onClick="return mV(\'1Ti\',3,10);">1Ti 3:10</a>); office of a bishop (episkope, <a onClick="return mV(\'1Ti\',3,1);">1Ti 3:1</a>). the Revised Version (British and American) uses other renderings, e.g. "ministry" (<a onClick="return mV(\'Rom\',11,13);">Ro 11:13</a>); "serve as deacons" (<a onClick="return mV(\'1Ti\',3,10);">1Ti 3:10</a>). In <a onClick="return mV(\'Act\',1,20);">Ac 1:20</a>, the Revised Version (British and American) has "office" (margin "overseership") for the King James Version "bishoprick."``103';
isbe[6509]='Officer`of\'-i-ser: In the King James Version the term is employed to render different words denoting various officials, domestic, civil and military, such as caric, "eunuch," "minister of state" (<a onClick="return mV(\'Gen\',37,36);">Ge 37:36</a>); paqidh, "person in charge," "overseer" (<a onClick="return mV(\'Gen\',41,34);">Ge 41:34</a>); necibh, "stationed," "garrison," "prefect" (<a onClick="return mV(\'1Ki\',4,19);">1Ki 4:19</a>); shoter, "scribe" or "secretary" (perhaps arranger or organizer), then any official or overseer. In <a onClick="return mV(\'Est\',9,3);">Es 9:3</a> for the King James Version "officers of the king" the Revised Version (British and American) has (more literal) "they that did the king\'s business."<P>In the New Testament, "officer" generally corresponds to the Greek word huperetes, "servant," or any person in the employ of another. In <a onClick="return mV(\'Mat\',5,25);">Mt 5:25</a> the term evidently means "bailiff" or exactor of the fine imposed by the magistrate, and corresponds to praktor, used in <a onClick="return mV(\'Luk\',12,58);">Lu 12:58</a>.``103';
isbe[6510]='Offices of Christ``<a href="./study/isbe/search.html?string=CHRIST,+OFFICES+OF">CHRIST, OFFICES OF</a>`1';
isbe[6511]='Offscouring`of\'-skour-ing: This strong and expressive word occurs only once in the Old Testament and once in the New Testament. The weeping prophet uses it as he looks upon his erstwhile fair and holy city, despoiled, defiled, derided by the profane, the enemies of God and of His people (<a onClick="return mV(\'Lam\',3,45);">La 3:45</a>, cechi). The favored people, whose city lies in heaps and is patrolled by the heathen, are hailed and held up as the scrapings, the offscouring, the offal of the earth. They are humbled to earth, crushed into the dust, carried away to be the slaves of licentious idolaters. The haughty, cruel, cutting boastfulness of the victors covered Israel with contumely.<P>In <a onClick="return mV(\'1Cr\',4,13);">1Co 4:13</a> the greatest of the apostles reminds the prosperous and self-satisfied Corinthinns that they, the apostles, were "made as the filth of the world, the offscouring of all things." In such contempt were they held by the unbelieving world and by false apostles. The strange, strong word (peripsema) should remind us what it cost in former times to be a true servant of Christ.``64';
isbe[6512]='Offspring`of\'-spring.`<a href="./study/isbe/search.html?string=CHILDREN">CHILDREN</a>`1';
isbe[6513]='Often`of\'-n (puknos, "thick," "close"): An archaic usage for "frequent": "Thine often infirmities" (<a onClick="return mV(\'1Ti\',5,23);">1Ti 5:23</a>); compare "by often rumination" (Shakespeare, As You Like It, IV, i, 18); "The often round" (Ben Jonson, The Forest, III); "Of wrench\'d or broken limb—an often chance" (Tennyson, Gareth and Lynette).``1';
isbe[6514]='Og`(\'ogh; Og): King of Bashan, whose territory, embracing 60 cities, was conquered by Moses and the Israelites immediately after the conquest of Sihon, king of the Amorites (<a onClick="return mV(\'Num\',21,\'33-35\');">Nu 21:33-35</a>; <a onClick="return mV(\'Deu\',3,\'1-12\');">De 3:1-12</a>). The defeat took place at Edrei, one of the chief of these cities (<a onClick="return mV(\'Num\',21,33);">Nu 21:33</a>; <a onClick="return mV(\'Jos\',12,4);">Jos 12:4</a>), and Og and his people were "utterly destroyed" (<a onClick="return mV(\'Deu\',3,6);">De 3:6</a>). Og is described as the last of the <a href="./study/isbe/search.html?string=REPHAIM">REPHAIM</a> (which see), or giant-race of that district, and his giant stature is borne out by what is told in <a onClick="return mV(\'Deu\',3,11);">De 3:11</a> of the dimensions of his "bedstead of iron" (\'eres barzel), 9 cubits long and 4 broad (13 1/2 ft. by 6 ft.), said to be still preserved at Rabbath of Ammon when the verse describing it was written. It is not, of course, necessary to conclude that Og\'s own height, though immense, was as great as this. Some, however, prefer to suppose that what is intended is "a sarcophagus of black basalt," which iron-like substance abounds in the Hauran. The conquered territory was subsequently bestowed on the Reubenites, Gadites, and the half-tribe of Manasseh (<a onClick="return mV(\'Num\',32,33);">Nu 32:33</a>; <a onClick="return mV(\'Deu\',3,12,13);">De 3:12,13</a>). Other references to Og are <a onClick="return mV(\'Deu\',1,4);">De 1:4</a>; <a onClick="return mV(\'Deu\',4,47);">4:47</a>; <a onClick="return mV(\'Deu\',31,4);">31:4</a>; <a onClick="return mV(\'Jos\',2,10);">Jos 2:10</a>; <a onClick="return mV(\'Jos\',9,10);">9:10</a>; <a onClick="return mV(\'Jos\',13,12,30);">13:12,30</a>). The memory of this great conquest lingered all through the national history (<a onClick="return mV(\'Psa\',135,11);">Ps 135:11</a>; <a onClick="return mV(\'Psa\',136,20);">136:20</a>). On the conquest, compare Stanley, Lectures on the History of the Jewish Church, I, 185-87.`<a href="./study/isbe/search.html?string=ARGOB">ARGOB</a>; <a href="./study/isbe/search.html?string=BASHAN">BASHAN</a>`132';
isbe[6515]='Ohad`o\'-had (\'ohadh, meaning unknown): A son of Simeon, mentioned as third in order (<a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>). The name is not found in the list of <a onClick="return mV(\'Num\',26,\'12-14\');">Nu 26:12-14</a>.``1';
isbe[6516]='Ohel`o\'-hel (\'ohel, "tent"): A son of Zerubbabel (<a onClick="return mV(\'1Ch\',3,20);">1Ch 3:20</a>).``1';
isbe[6517]='Oholah`o-ho\'-la (\'oholah; the King James Version Aholah): The exact meaning is a matter of dispute. As written, it seems to mean a tent-woman, or the woman living in a tent. With a mappik in the last consonant it could mean "her tent." The term is used symbolically by Ezekiel to designate Samaria or the kingdom of Israel (<a onClick="return mV(\'Eze\',23,4,5,36,44);">Eze 23:4,5,36,44</a>).`<a href="./study/isbe/search.html?string=OHOLIBAH">OHOLIBAH</a>`1';
isbe[6518]='Oholiab`o-ho\'-li-ab (\'oholi\'abh, "father\'s tent"; the King James Version Aholiab): A Danite artificer, who assisted Bezalel in the construction of the tabernacle and its furniture (<a onClick="return mV(\'Exd\',31,6);">Ex 31:6</a>; <a onClick="return mV(\'Exd\',35,34);">35:34</a>; <a onClick="return mV(\'Exd\',36,1);">36:1</a>f; <a onClick="return mV(\'Exd\',38,23);">38:23</a>).``1';
isbe[6519]='Oholibah`o-hol\'-i-ba, o-ho\'-li-ba (\'oholibhah, "tent in her," or "my tent is in her"): An opprobrious and symbolical name given by Ezekiel to Jerusalem, representing the kingdom of Judah, because of her intrigues and base alliances with Egypt, Assyria and Babylonia, just as the name <a href="./study/isbe/search.html?string=OHOLAH">OHOLAH</a> (which see) was given to Samaria or the Northern Kingdom, because of her alliances with Egypt and Assyria. There is a play upon the words in the Hebrew which cannot be reproduced in English Both Oholah and Oholibah, or Samaria and Jerusalem, are the daughters of one mother, and wives of Yahweh, and both are guilty of religious and political alliance with heathen nations. Idolatry is constantly compared by the Hebrew prophets to marital unfaithfulness or adultery.``34';
isbe[6520]='Oholibamah`o-hol-i-ba\'-ma, o-hol-i-ba\'-ma (\'oholibhamah, "tent of the high place"):<P>(1) One of Esau\'s wives, and a daughter of Anah the Hivite (<a onClick="return mV(\'Gen\',36,2,5);">Ge 36:2,5</a>). It is strange that she is not named along with Esau\'s other wives in either <a onClick="return mV(\'Gen\',28,9);">Ge 28:9</a> or <a onClick="return mV(\'Gen\',26,30);">26:30</a>. Various explanations have been given, but none of them is satisfactory. There is probably some error in the text.<P>(2) An Edomite chief (<a onClick="return mV(\'Gen\',36,41);">Ge 36:41</a>; <a onClick="return mV(\'1Ch\',1,52);">1Ch 1:52</a>).``1';
isbe[6521]='Oil`oil (shemen; elaion):<P>1. Terms<P>2. Production and Storage<P>3. Uses<P class="in15">(1) As a Commodity of Exchange<P class="in15">(2) As a Cosmetic<P class="in15">(3) As a Medicine<P class="in15">(4) As a Food<P class="in15">(5) As an Illuminant<P class="in15">(6) In Religious Rites<P class="in30">(a) Consecration<P class="in30">(b) Offerings<P class="in30">(c) Burials<P>4. Figurative Uses<hr /><P>Shemen, literally, "fat," corresponds to the common Arabic senin of similar meaning, although now applied to boiled butter fat.<P>1. Terms:<P>Another Hebrew word, zayith (zeth), "olive," occurs with shemen in several passages (<a onClick="return mV(\'Exd\',27,20);">Ex 27:20</a>; <a onClick="return mV(\'Exd\',30,24);">30:24</a>; <a onClick="return mV(\'Lev\',24,2);">Le 24:2</a>). The corresponding Arabic zeit, a contraction of zeitun, which is the name for the olive tree as well as the fruit, is now applied to oils in general, to distinguish them from solid fats. Zeit usually means olive oil, unless some qualifying name indicates another oil. A corresponding use was made of shemen, and the oil referred to so many times in the Bible was olive oil (except <a onClick="return mV(\'Est\',2,12);">Es 2:12</a>). Compare this with the Greek elaion, "oil," a neuter noun from elaia, "olive," the origin of the English word "oil." yitshar, literally, "glistening," which occurs less frequently, is used possibly because of the light-giving quality of olive oil, or it may have been used to indicate fresh oil, as the clean, newly pressed oil is bright. meshach, a Chaldaic word, occurs twice: <a onClick="return mV(\'Ezr\',6,9);">Ezr 6:9</a>; <a onClick="return mV(\'Ezr\',7,22);">7:22</a>. elaion, is the New Testament term.<P>2. Production and Storage:<P>Olive oil has been obtained, from the earliest times, by pressing the fruit in such a way as to filter out the oil and other liquids from the residue. The Scriptural references correspond so nearly to the methods practiced in Syria up to the present time, and the presses uncovered by excavators at such sites as Gezer substantiate so well the similarity of these methods, that a description of the oil presses and modes of expression still being employed in Syria will be equally true of those in use in early Israelite times.<P>The olives to yield the greatest amount of oil are allowed to ripen, although some oil is expressed from the green fruit. As the olive ripens it turns black. The fruit begins to fall from the trees in September, but the main crop is gathered after the first rains in November. The olives which have not fallen naturally or have not been blown off by the storms are beaten from the trees with long poles (compare <a onClick="return mV(\'Deu\',24,20);">De 24:20</a>). The fruit is gathered from the ground into baskets and carried on the heads of the women, or on donkeys to the houses or oil presses. Those carried to the houses are preserved for eating. Those carried to the presses are piled in heaps until fermentation begins. This breaks down the oil cells and causes a more abundant flow of oil. The fruit thus softened may be trod out with the feet (<a onClick="return mV(\'Mic\',6,15);">Mic 6:15</a>)—which is now seldom practiced—or crushed in a handmill. Such a mill was uncovered at Gezer beside an oil press. Stone mortars with wooden pestles are also used. Any of these methods crushes the fruit, leaving only the stone unbroken, and yields a purer oil (<a onClick="return mV(\'Exd\',27,20);">Ex 27:20</a>). The method now generally practiced of crushing the fruit and kernels with an edgerunner mill probably dates from Roman times. These mills are of crude construction. The stones are cut from native limestone and are turned by horses or mules. Remains of huge stones of this type are found near the old Roman presses in Mt. Lebanon and other districts.<P>The second step in the preparation of the oil is the expression. In districts where the olives are plentiful and there is no commercial demand for the oil, the householders crush the fruit in a mortar, mix the crushed mass with water, and after the solid portions have had time to settle, the pure sweet oil is skimmed from the surface of the water. This method gives a delicious oil, but is wasteful. This is no doubt the beaten oil referred to in connection with religious ceremonials (<a onClick="return mV(\'Exd\',27,20);">Ex 27:20</a>). Usually the crushed fruit is spread in portions on mats of reeds or goats\' hair, the corners of which are folded over the mass, and the packets thus formed are piled one upon another between upright supports. These supports were formerly two stone columns or the two sections of a split stone cylinder hollowed out within to receive the mats. Large hollow tree trunks are still similarly used in Syria. A flat stone is next placed on top, and then a heavy log is placed on the pile in such a manner that one end can be fitted into a socket made in a wall or rock in close proximity to the pile. This socket becomes the fulcrum of a large lever of the second class. The lever is worked in the same manner as that used in the wine presses (see <a href="./study/isbe/search.html?string=WINE+PRESS">WINE PRESS</a>). These presses are now being almost wholly superseded by hydraulic presses. The juice which runs from the press, consisting of oil, extractive matter and water, is conducted to vats or run into jars and allowed to stand until the oil separates. The oil is then drawn off from the surface, or the watery fluid and sediment is drawn away through a hole near the bottom of the jar, leaving the oil in the container. (For the construction of the ancient oil presses, see The Excavations of Gezer, by Macalister.) The oil, after standing for some time to allow further sediment to settle, is stored either in huge earthenware jars holding 100 to 200 gallons, or in underground cisterns (compare <a onClick="return mV(\'1Ch\',27,28);">1Ch 27:28</a>) holding a much larger quantity. Some of these cisterns in Beirut hold several tons of oil each (<a onClick="return mV(\'2Ch\',11,11);">2Ch 11:11</a>; <a onClick="return mV(\'2Ch\',32,28);">32:28</a>; <a onClick="return mV(\'Neh\',13,5,12);">Ne 13:5,12</a>; <a onClick="return mV(\'Pro\',21,20);">Pr 21:20</a>). In the homes the oil is kept in small earthen jars of various shapes, usually having spouts by which the oil can be easily poured (<a onClick="return mV(\'1Ki\',17,12);">1Ki 17:12</a>; <a onClick="return mV(\'2Ki\',4,2);">2Ki 4:2</a>). In <a onClick="return mV(\'1Sa\',16,13);">1Sa 16:13</a>; <a onClick="return mV(\'1Ki\',1,39);">1Ki 1:39</a>, horns of oil are mentioned.<P>3. Uses:<P>(1) As a Commodity of Exchange.<P>Olive oil when properly made and stored will keep sweet for years, hence, was a good form of merchandise to hold. Oil is still sometimes given in payment (<a onClick="return mV(\'1Ki\',5,11);">1Ki 5:11</a>; <a onClick="return mV(\'Eze\',27,17);">Eze 27:17</a>; <a onClick="return mV(\'Hsa\',12,1);">Ho 12:1</a>; <a onClick="return mV(\'Luk\',16,6);">Lu 16:6</a>; <a onClick="return mV(\'Rev\',18,13);">Re 18:13</a>).<P>(2) As a Cosmetic.<P>From earliest times oil was used as a cosmetic, especially for oiling the limbs and head. Oil used in this way was usually scented (see <a href="./study/isbe/search.html?string=OINTMENT">OINTMENT</a>). Oil is still used in this manner by the Arabs, principally to keep the skin and scalp soft when traveling in dry desert regions where there is no opportunity to bathe. Sesame oil has replaced olive oil to some extent for this purpose. Homer, Pliny and other early writers mention its use for external application. Pliny claimed it was used to protect the body against the cold. Many Biblical references indicate the use of oil as a cosmetic (<a onClick="return mV(\'Exd\',25,6);">Ex 25:6</a>; <a onClick="return mV(\'Deu\',28,40);">De 28:40</a>; <a onClick="return mV(\'Rth\',3,3);">Ru 3:3</a>; <a onClick="return mV(\'2Sa\',12,20);">2Sa 12:20</a>; <a onClick="return mV(\'2Sa\',14,2);">14:2</a>; <a onClick="return mV(\'Est\',2,12);">Es 2:12</a>; <a onClick="return mV(\'Psa\',23,5);">Ps 23:5</a>; <a onClick="return mV(\'Psa\',92,10);">92:10</a>; <a onClick="return mV(\'Psa\',104,15);">104:15</a>; <a onClick="return mV(\'Psa\',141,5);">141:5</a>; <a onClick="return mV(\'Eze\',16,9);">Eze 16:9</a>; <a onClick="return mV(\'Mic\',6,15);">Mic 6:15</a>; <a onClick="return mV(\'Luk\',7,46);">Lu 7:46</a>).<P>(3) As a Medicine.<P>From early Egyptian literature down to late Arabic medical works, oil is mentioned as a valuable remedy. Many queer prescriptions contain olive oil as one of their ingredients. The good Samaritan used oil mingled with wine to dress the wounds of the man who fell among robbers (<a onClick="return mV(\'Mar\',6,13);">Mr 6:13</a>; <a onClick="return mV(\'Luk\',10,34);">Lu 10:34</a>.)<P>(4) As a Food.<P>Olive oil replaces butter to a large extent in the diet of the people of the Mediterranean countries. In Bible lands food is fried in it, it is added to stews, and is poured over boiled vegetables, such as beans, peas and lentils, and over salads, sour milk, cheese and other foods as a dressing. A cake is prepared from ordinary bread dough which is smeared with oil and sprinkled with herbs before baking (<a onClick="return mV(\'Lev\',2,4);">Le 2:4</a>). At times of fasting oriental Christians use only vegetable oils, usually olive oil, for cooking. For Biblical references to the use of oil as food see <a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>; <a onClick="return mV(\'Deu\',7,13);">De 7:13</a>; <a onClick="return mV(\'Deu\',14,23);">14:23</a>; <a onClick="return mV(\'Deu\',32,13);">32:13</a>; <a onClick="return mV(\'1Ki\',17,12,14,16);">1Ki 17:12,14,16</a>; <a onClick="return mV(\'2Ki\',4,2,4,6);">2Ki 4:2,6,7</a>; <a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a>; <a onClick="return mV(\'2Ch\',2,10,15);">2Ch 2:10,15</a>; <a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>; <a onClick="return mV(\'Pro\',21,17);">Pr 21:17</a>; <a onClick="return mV(\'Eze\',16,13,18);">Eze 16:13,18</a>; <a onClick="return mV(\'Hsa\',2,5,8,22);">Ho 2:5,8,22</a>; <a onClick="return mV(\'Hag\',2,12);">Hag 2:12</a>; <a onClick="return mV(\'Rev\',6,6);">Re 6:6</a>.<P>(5) As an Illuminant.<P>Olive oil until recent years was universally used for lighting purposes (see <a href="./study/isbe/search.html?string=LAMP">LAMP</a>). In Palestine are many homes where a most primitive form of lamp similar to those employed by the Israelites is still in use. The prejudice in favor of the exclusive use of olive oil for lighting holy places is disappearing. Formerly any other illuminant was forbidden (compare <a onClick="return mV(\'Exd\',25,6);">Ex 25:6</a>; <a onClick="return mV(\'Exd\',27,20);">27:20</a>; <a onClick="return mV(\'Exd\',35,8,,4,28);">35:8,14,28</a>; <a onClick="return mV(\'Exd\',39,37);">39:37</a>; <a onClick="return mV(\'Mat\',25,3,4,8);">Mt 25:3,4,8</a>).<P>(6) In Religious Rites.<P>(a) Consecration:<P>Consecration of officials or sacred things (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>; <a onClick="return mV(\'Gen\',35,14);">35:14</a>; <a onClick="return mV(\'Exd\',29,7,21);">Ex 29:7,21</a>ff; <a onClick="return mV(\'Lev\',2,1);">Le 2:1</a>ff; <a onClick="return mV(\'Num\',4,9);">Nu 4:9</a>ff; <a onClick="return mV(\'1Sa\',10,1);">1Sa 10:1</a>; <a onClick="return mV(\'1Sa\',16,1,13);">16:1,13</a>; <a onClick="return mV(\'2Sa\',1,21);">2Sa 1:21</a>; <a onClick="return mV(\'1Ki\',1,39);">1Ki 1:39</a>; <a onClick="return mV(\'2Ki\',9,1,3,6);">2Ki 9:1,3,6</a>; <a onClick="return mV(\'Psa\',89,20);">Ps 89:20</a>): This was adopted by the early Christians in their ceremonies (<a onClick="return mV(\'Jam\',5,14);">Jas 5:14</a>), and is still used in the consecration of crowned rulers and church dignitaries.<P>(b) Offerings:<P>Offerings, votive and otherwise: The custom of making offerings of oil to holy places still survives in oriental religions. One may see burning before the shrines along a Syrian roadside or in the churches, small lamps whose supply of oil is kept renewed by pious adherents. In Israelite times oil was used in the meal offering, in the consecration offerings, offerings of purification from leprosy, etc. (<a onClick="return mV(\'Exd\',29,2);">Ex 29:2</a>; <a onClick="return mV(\'Exd\',40,9);">40:9</a>ff; <a onClick="return mV(\'Lev\',2,2);">Le 2:2</a>ff; <a onClick="return mV(\'Num\',4,9);">Nu 4:9</a>ff; <a onClick="return mV(\'Deu\',18,4);">De 18:4</a>; <a onClick="return mV(\'1Ch\',9,29);">1Ch 9:29</a>; <a onClick="return mV(\'2Ch\',31,5);">2Ch 31:5</a>; <a onClick="return mV(\'Neh\',10,37,39);">Ne 10:37,39</a>; <a onClick="return mV(\'Neh\',13,5,12);">13:5,12</a>; <a onClick="return mV(\'Eze\',16,18,19);">Eze 16:18,19</a>; <a onClick="return mV(\'Eze\',45,\'1-\');">45</a>; <a onClick="return mV(\'Eze\',46,\'1-\');">46</a>; <a onClick="return mV(\'Mic\',6,7);">Mic 6:7</a>).<P>(c) Burials:<P>In connection with the burial of the dead: Egyptian papyri mention this use. In the Old Testament no direct mention is made of the custom. Jesus referred to it in connection with His own burial (<a onClick="return mV(\'Mat\',26,12);">Mt 26:12</a>; <a onClick="return mV(\'Mar\',14,\'3-8\');">Mr 14:3-8</a>; <a onClick="return mV(\'Luk\',23,56);">Lu 23:56</a>; <a onClick="return mV(\'Jhn\',12,\'3-8\');">Joh 12:3-8</a>; <a onClick="return mV(\'Jhn\',19,40);">19:40</a>).<P>4. Figurative Uses:<P>Abundant oil was a figure of general prosperity (<a onClick="return mV(\'Deu\',32,13);">De 32:13</a>; <a onClick="return mV(\'Deu\',33,24);">33:24</a>; <a onClick="return mV(\'2Ki\',18,32);">2Ki 18:32</a>; <a onClick="return mV(\'Job\',29,6);">Job 29:6</a>; <a onClick="return mV(\'Joe\',2,19,24;">Joe 2:19,24</a>). Languishing of the oil indicated general famine (<a onClick="return mV(\'Joe\',1,10);">Joe 1:10</a>; <a onClick="return mV(\'Hag\',1,11);">Hag 1:11</a>). Joy is described as the oil of joy (<a onClick="return mV(\'Isa\',61,3);">Isa 61:3</a>), or the oil of gladness (<a onClick="return mV(\'Psa\',45,7);">Ps 45:7</a>; <a onClick="return mV(\'Hbr\',1,9);">Heb 1:9</a>). Ezekiel prophesies that the rivers shall run like oil, i.e. become viscous (<a onClick="return mV(\'Eze\',32,14);">Eze 32:14</a>). Words of deceit are softer than oil (<a onClick="return mV(\'Psa\',55,21);">Ps 55:21</a>; <a onClick="return mV(\'Pro\',5,3);">Pr 5:3</a>). Cursing becomes a habit with the wicked as readily as oil soaks into bones (<a onClick="return mV(\'Psa\',109,18);">Ps 109:18</a>). Excessive use of oil indicates wastefulness (<a onClick="return mV(\'Pro\',21,17);">Pr 21:17</a>), while the saving of it is a characteristic of the wise (<a onClick="return mV(\'Pro\',21,20);">Pr 21:20</a>). Oil was carried into Egypt, i.e. a treaty was made with that country (<a onClick="return mV(\'Hsa\',12,1);">Ho 12:1</a>).``133';

isbe[6523]='Oil Tree`oil tre (\'ets shemen (<a onClick="return mV(\'Isa\',41,19);">Isa 41:19</a>), margin "oleaster," in <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>, translated "wild olive," the King James Version "pine"; \'atse shemen, in <a onClick="return mV(\'1Ki\',6,23,31,32);">1Ki 6:23,31,32</a>, translated "olive wood"): The name "oleaster" used to be applied to the wild olive, but now belongs to quite another plant, the silver-berry, Eleagnus hortensis (Natural Order Elaeagnaceae), known in Arabic as Zeizafan. It is a pretty shrub with sweet-smelling white flowers and silver-grey-green leaves. It is difficult to see how all the three references can apply to this tree; it will suit the first two, but this small shrub would never supply wood for carpentry work such as that mentioned in 1 Kings, hence, the translation "olive wood." On the other hand, in the reference in <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>, olive branches are mentioned just before, so the translation "wild olive" (the difference being too slight) is improbable. Post suggests the translation of \'ets shemen by <a href="./study/isbe/search.html?string=PINE">PINE</a> (which see), which if accepted would suit all the requirements.``117';
isbe[6524]='Oil, Anointing`(shemen hamishchah): This holy oil, the composition of which is described in <a onClick="return mV(\'Exd\',30,\'22-33\');">Ex 30:22-33</a>, was designed for use in the anointing of the tabernacle, its furniture and vessels, the altar and laver, and the priest, that being thus consecrated, they might be "most holy." It was to be "a holy anointing oil" unto Yahweh throughout all generations (<a onClick="return mV(\'Exd\',30,31);">30:31</A>). On its uses, compare <a onClick="return mV(\'Exd\',37,29);">Ex 37:29</a>; <a onClick="return mV(\'Lev\',8,12);">Le 8:12</a>; <a onClick="return mV(\'Lev\',10,7);">10:7</a>; <a onClick="return mV(\'Lev\',21,10);">21:10</a>. The care of this holy oil was subsequently entrusted to Eleazar (<a onClick="return mV(\'Num\',4,16);">Nu 4:16</a>); in later times it seems to have been prepared by the sons of the priests (<a onClick="return mV(\'1Ch\',9,30);">1Ch 9:30</a>). There is a figurative allusion to the oil on Aaron\'s head in <a onClick="return mV(\'Psa\',133,2);">Ps 133:2</a>.`<a href="./study/isbe/search.html?string=OIL">OIL</a>; <a href="./study/isbe/search.html?string=ANOINTING">ANOINTING</a>`132';
isbe[6525]='Oil, Beaten`(<a onClick="return mV(\'Exd\',27,20);">Ex 27:20</a>; <a onClick="return mV(\'Lev\',24,2);">Le 24:2</a>; <a onClick="return mV(\'Num\',28,5);">Nu 28:5</a>).`<a href="./study/isbe/search.html?string=OIL">OIL</a>; <a href="./study/isbe/search.html?string=CANDLESTICK,+THE+GOLDEN">CANDLESTICK, THE GOLDEN</a>`1';

isbe[6529]='Ointment`oint\'-ment: The present use of the word "ointment" is to designate a thick unguent of buttery or tallow-like consistency. the King James Version in frequent instances translates shemen or meshach (see <a onClick="return mV(\'Exd\',30,25);">Ex 30:25</a>) "ointment" where a perfumed oil seemed to be indicated. the American Standard Revised Version has consequently substituted the word "oil" in most of the passages. Merqachah is rendered "ointment" once in the Old Testament (<a onClick="return mV(\'Job\',41,31);">Job 41:31 (Hebrew 41:23)</a>). The well-known power of oils and fats to absorb odors was made use of by the ancient perfumers. The composition of the holy anointing oil used in the tabernacle worship is mentioned in <a onClick="return mV(\'Exd\',30,\'23-25\');">Ex 30:23-25</a>. Olive oil formed the base. This was scented with "flowing myrrh...sweet cinnamon...sweet calamus...and...cassia." The oil was probably mixed with the above ingredients added in a powdered form and heated until the oil had absorbed their odors and then allowed to stand until the insoluble matter settled, when the oil could be decanted. Olive oil, being a non-drying oil which does not thicken readily, yielded an ointment of oily consistency. This is indicated by <a onClick="return mV(\'Psa\',133,2);">Ps 133:2</a>, where it says that the precious oil ran down on Aaron\'s beard and on the collar of his outer garment. Anyone attempting to make the holy anointing oil would be cut off from his people (<a onClick="return mV(\'Exd\',30,33);">Ex 30:33</a>). The scented oils or ointments were kept in jars or vials (not boxes) made of alabaster. These jars are frequently found as part of the equipment of ancient tombs.<P>The word translated "ointment" in the New Testament is muron, "myrrh." This would indicate that myrrh, an aromatic gum resin, was the substance commonly added to the oil to give it odor. In <a onClick="return mV(\'Luk\',7,46);">Lu 7:46</a> both kinds of oil are mentioned, and the verse might be paraphrased thus: My head with common oil thou didst not anoint; but she hath anointed my feet with costly scented oil.`<a href="./study/isbe/search.html?string=ANOINTING">ANOINTING</a>; <a href="./study/isbe/search.html?string=OIL">OIL</a>`133';

isbe[6533]='Old Man`(palaios, "old," "ancient"): A term thrice used by Paul (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a>; <a onClick="return mV(\'Eph\',4,22);">Eph 4:22</a>; <a onClick="return mV(\'Col\',3,9);">Col 3:9</a>) to signify the unrenewed man, the natural man in the corruption of sin, i.e. sinful human nature before conversion and regeneration. It is theologically synonymous with "flesh" (<a onClick="return mV(\'Rom\',8,\'3-9\');">Ro 8:3-9</a>), which stands, not for bodily organism, but, for the whole nature of man (body and soul) turned away from God and devoted to self and earthly things.<P>The old man is "in the flesh"; the new man "in the Spirit." In the former "the works of the flesh" (<a onClick="return mV(\'Gal\',5,\'19-21\');">Ga 5:19-21</a>) are manifest; in the latter "the fruit of the Spirit" (<a onClick="return mV(\'Gal\',5,22,23);">Ga 5:22,23</a>). One is "corrupt according to the deceitful lusts"; the other "created in righteousness and true holiness" (<a onClick="return mV(\'Eph\',4,\'22-24\');">Eph 4:22-24</a> the King James Version).`<a href="./study/isbe/search.html?string=MAN,+NATURAL">MAN, NATURAL</a>; <a href="./study/isbe/search.html?string=MAN">MAN</a>`139';
isbe[6534]='Old Prophet, the`(nabhi\' \'echadh zaqen, "an old prophet" (<a onClick="return mV(\'1Ki\',13,11);">1Ki 13:11</a>), ha-nabhi\' ha-zaqen, "the old prophet" (<a onClick="return mV(\'1Ki\',13,29);">1Ki 13:29</a>)):<P>1. The Narrative:<P>The narrative of <a onClick="return mV(\'1Ki\',13,\'11-32\');">1Ki 13:11-32</a>, in which the old prophet is mentioned, is part of a larger account telling of a visit paid to Bethel by "a man of God" from Judah. The Judean prophet uttered a curse upon the altar erected there by Jeroboam I. When the king attempted to use force against him, the prophet was saved by divine intervention; the king then invited him to receive royal hospitality, but he refused because of a command of God to him not to eat or drink there. The Judean then departed (<a onClick="return mV(\'1Ki\',13,\'1-10\');">13:1-10</A>). An old prophet who lived in Bethel heard of the stranger\'s words, and went after him and offered him hospitality. This offer too was refused. But when the old prophet resorted to falsehood and pleaded a divine command on the subject, the Judean returned with him. While at table the old prophet is given a message to declare that death will follow the Southerner\'s disobedience to the first command. A lion kills him on his way home. The old prophet hears of the death and explains it as due to disobedience to God; he then buries the dead body in his own grave and expresses a wish that he also at death should be buried in the same sepulcher.<P>2. Critical:<P>There are several difficulties in the text. In <a onClick="return mV(\'1Ki\',13,11);">1Ki 13:11</a>, the King James Version reads "his sons came" instead of "one of his sons came," and translation <a onClick="return mV(\'1Ki\',13,12);">1Ki 13:12b</a>: "And his sons shewed the way the man of God went." There is a gap in the Massoretic Text after the word "table" in <a onClick="return mV(\'1Ki\',13,20);">13:20</A>; and <a onClick="return mV(\'1Ki\',13,23);">13:23</a> should be translated, "And it came to pass after he had eaten bread and drunk water, that he saddled for himself the ass, and departed again" (following Septuagint, B with W. B. Stevenson, HDB, III, 594a, note).<P>Benzinger ("Die Bucher der Konige," Kurz. Hand-Komm. zum Altes Testament, 91) holds that we have here an example of a midrash, i.e. according to LOT, 529,"an imaginative development of a thought or theme suggested by Scripture, especially a didactic or homiletic exposition or an edifying religious story." <a onClick="return mV(\'2Ch\',24,27);">2Ch 24:27</a> refers to a "midhrash of the book of the kings," and <a onClick="return mV(\'2Ch\',13,22);">2Ch 13:22</a> to a "midrash of the prophet Iddo." In <a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a> we have a reference to "the visions of Iddo the seer concerning Jeroboam the son of Nebat." Josephus names the Judean prophet Jadon (Ant., VIII, viii, 5), and so some would trace this narrative to the midrash of Iddo, which would be a late Jewish work. There is a trace of late Hebrew in <a onClick="return mV(\'1Ki\',13,3);">1Ki 13:3</a>, and evidence in several places of a later editing of the original narrative. Kittel and Benzinger think it possible that the section may be based on a historical incident. If the narrative is historical in the main, the mention of Josiah by name in <a onClick="return mV(\'1Ki\',13,2);">13:2</A> may be a later insertion; if not historical, the prophecy there is ex eventu, and the whole section a midrash on <a onClick="return mV(\'2Ki\',23,\'15-20\');">2Ki 23:15-20</a>.<P>3. Central Truths:<P>(1) Several questions are suggested by the narrative, but in putting as well as in answering these questions, it must be remembered that the old prophet himself, as has been pointed out, is not the chief character of the piece. Hence, it is a little pointless to ask what became of the old prophet, or whether he was not punished for his falsehood. The passage should be studied, like the parables of Jesus, with an eye on the great central truth, which is, here, that God punishes disobedience even in "a man of God." It is not inconsistent with this to regard the old prophet as an example of "Satan fashioning himself into an angel of light" (<a onClick="return mV(\'2Cr\',11,14);">2Co 11:14</a>), or of the beast which "had two horns like unto a lamb" (<a onClick="return mV(\'Rev\',13,11);">Re 13:11</a>).<P>(2) It must also be remembered that the false prophets of the Old Testament are called prophets in spite of their false prophecies. So here the old prophet in spite of his former lie is given a divine message to declare that death will follow the other\'s disobedience.<P>(3) One other question suggests itself, and demands an answer. Why did the old prophet make the request that at death he should be buried in the same grave as the Judean (<a onClick="return mV(\'1Ki\',13,31);">1Ki 13:31</a>)? The answer is implied in <a onClick="return mV(\'1Ki\',13,32);">1Ki 13:32</a>, and is more fully given in <a onClick="return mV(\'2Ki\',23,\'15-20\');">2Ki 23:15-20</a>, where King Josiah defiles the graves of the prophets at Bethel. On seeing a "monument" or grave-stone by one of the graves, he inquires what it is, and is told that it marks the grave of the prophet from Judah. Thereupon he orders that his bones be not disturbed. With these the bones of the old prophet escape. Perhaps no clearer instance of a certain kind of meanness exists in the Old Testament. The very man who has been the cause of another\'s downfall and ruin is base enough to plan his own escape under cover of the virtues of his victim. And the parallels in modern life are many.``149';

isbe[6541]='Olive Tree`ol\'-iv tre (zayith, a word occurring also in Aramaic, Ethiopic and Arabic; in the last it means "olive oil," and zaitun, "the olive tree"; elaia):<P>1. The Olive Tree:<P>The olive tree has all through history been one of the most characteristic, most valued and most useful of trees in Palestine. It is only right that it is the first named "king" of the trees (<a onClick="return mV(\'Jdg\',9,8,9);">Jud 9:8,9</a>). When the children of Israel came to the land they acquired olive trees which they planted not (<a onClick="return mV(\'Deu\',6,11);">De 6:11</a>; compare <a onClick="return mV(\'Jos\',24,13);">Jos 24:13</a>). The cultivation of the olive goes back to the earliest times in Canaan. The frequent references in the Bible, the evidences (see 4 below) from archaeology and the important place the product of this tree has held in the economy of the inhabitants of Syria make it highly probable that this land is the actual home of the cultivated olive. The wild olive is indigenous there. The most fruitful trees are the product of bare and rocky ground (compare <a onClick="return mV(\'Deu\',32,13);">De 32:13</a>) situated preferably at no great distance from the sea. The terraced hills of Palestine, where the earth lies never many inches above the limestone rocks, the long rainless summer of unbroken sunshine, and the heavy "clews" of the autumn afford conditions which are extraordinarily favorable to at least the indigenous olive.<P>The olive, Olea Europaea (Natural Order Oleaceae), is a slow-growing tree, requiring years of patient labor before reaching full fruitfulness. Its growth implies a certain degree of settlement and peace, for a hostile army can in a few days destroy the patient work of two generations. Possibly this may have something to do with its being the emblem of peace. Enemies of a village or of an individual often today carry out revenge by cutting away a ring of bark from the trunks of the olives, thus killing the trees in a few months. The beauty of this tree is referred to in <a onClick="return mV(\'Jer\',11,16);">Jer 11:16</a>; <a onClick="return mV(\'Hsa\',14,6);">Ho 14:6</a>, and its fruitfulness in <a onClick="return mV(\'Psa\',128,3);">Ps 128:3</a>. The characteristic olive-green of its foliage, frosted silver below and the twisted and gnarled trunks—often hollow in the center—are some of the most picturesque and constant signs of settled habitations. In some parts of the land large plantations occur: the famous olive grove near Beirut <span class="noTag">is</span> 5 miles square; there are also fine, ancient trees in great numbers near Bethlehem.<P>In starting an oliveyard the fellah not infrequently plants young wild olive trees which grow plentifully over many parts of the land, or he may grow from cuttings. When the young trees are 3 years old they are grafted from a choice stock and after another three or four years they may commence to bear fruit, but they take quite a decade more before reaching full fruition. Much attention is, however, required. The soil around the trees must be frequently plowed and broken up; water must be conducted to the roots from the earliest rain, and the soil must be freely enriched with a kind of marl known in Arabic as chuwwarah. If neglected, the older trees soon send up a great many shoots from the roots all around the parent stem (perhaps the idea in <a onClick="return mV(\'Psa\',128,3);">Ps 128:3</a>); these must be pruned away, although, should the parent stem decay, some of these may be capable of taking its place. Being, however, from the root, below the original point of grafting, they are of the wild olive type—with smaller, stiffer leaves and prickly stem—and need grafting before they are of use. The olive tree furnishes a wood valuable for many forms of carpentry, and in modern Palestine is extensively burnt as fuel.<P>2. The Fruit:<P>The olive is in flower about May; it produces clusters of small white flowers, springing from the axils of the leaves, which fall as showers to the ground (<a onClick="return mV(\'Job\',15,33);">Job 15:33</a>). The first olives mature as early as September in some places, but, in the mountain districts, the olive harvest is not till November or even December. Much of the earliest fruit falls to the ground and is left by the owner ungathered until the harvest. The trees are beaten with long sticks (<a onClick="return mV(\'Deu\',24,20);">De 24:20</a>), the young folks often climbing into the branches to reach the highest fruit, while the women and older girls gather up the fruit from the ground. The immature fruit left after such an ingathering is described graphically in <a onClick="return mV(\'Isa\',17,6);">Isa 17:6</a>: "There shall be left therein gleanings, as the shaking (margin "beating") of an olive-tree, two or three berries in the top of the uppermost bough, four or five in the outmost branches of a fruitful tree." Such gleanings belonged to the poor (<a onClick="return mV(\'Deu\',24,20);">De 24:20</a>), as is the case today. Modern villages in Palestine allow the poor of even neighboring villages to glean the olives. The yield of an olive tree is very uncertain; a year of great fruitfulness may be followed by a very scanty crop or by a succession of such.<P>The olive is an important article of diet in Palestine. Some are gathered green and pickled in brine, after slight bruising, and others, the "black" olives, are gathered quite ripe and are either packed in salt or in brine. In both cases the salt modifies the bitter taste. They are eaten with bread.<P>More important commercially is the oil. This is sometimes extracted in a primitive way by crushing a few berries by hand in the hollow of a stone (compare <a onClick="return mV(\'Exd\',27,20);">Ex 27:20</a>), from which a shallow channel runs for the oil. It is an old custom to tread them by foot (<a onClick="return mV(\'Mic\',6,15);">Mic 6:15</a>).<P>3. Olive Oil:<P>Oil is obtained on a larger scale in one of the many varieties of oil mills. The berries are carried in baskets, by donkeys, to the mill, and they are crushed by heavy weights. A better class of oil can be obtained by collecting the first oil to come off separately, but not much attention is given to this in Palestine, and usually the berries are crushed, stones and all, by a circular millstone revolving upright round a central pivot. A plenteous harvest of oil was looked upon as one of God\'s blessings (<a onClick="return mV(\'Joe\',2,24);">Joe 2:24</a>; <a onClick="return mV(\'Joe\',3,13);">3:13</a>). That the "labor of the olive" should fail was one of the trials to faith in Yahweh (<a onClick="return mV(\'Hab\',3,17);">Hab 3:17</a>). Olive oil is extensively used as food, morsels of bread being dipped into it in eating; also medicinally (<a onClick="return mV(\'Luk\',10,34);">Lu 10:34</a>; <a onClick="return mV(\'Jam\',5,14);">Jas 5:14</a>). In ancient times it was greatly used for anointing the person (<a onClick="return mV(\'Psa\',23,5);">Ps 23:5</a>; <a onClick="return mV(\'Mat\',6,17);">Mt 6:17</a>). In Rome\'s days of luxury it was a common maxim that a long and pleasant life depended upon two fiuids—"wine within and oil without." In modern times this use of oil for the person is replaced by the employment of soap, which in Palestine is made from olive oil. In all ages this oil has been used for illumination (<a onClick="return mV(\'Mat\',25,3);">Mt 25:3</a>).<P>4. Greater Plenty of Olive Trees in Ancient Times:<P>Comparatively plentiful as olive trees are today in Palestine, there is abundant evidence that the cultivation was once much more extensive. "The countless rock-cut oil-presses and wine-presses, both within and without the walls of the city (of Gezer), show that the cultivation of the olive and vine was of much greater importance than it is anywhere in Palestine today....Excessive taxation has made olive culture unprofitable" ("Gezer Mem," PEF, II, 23). A further evidence of this is seen today in many now deserted sites which are covered with wild olive trees, descendants of large plantations of the cultivated tree which have quite disappeared.<P>5. Wild Olives:<P>Many of these spring from the old roots; others are from the fallen drupes. Isolated trees scattered over many parts of the land, especially in Galilee, are sown by the birds. As a rule the wild olive is but a shrub, with small leaves, a stem more or less prickly, and a small, hard drupe with but little or no oil. That a wild olive branch should be grafted into a fruitful tree would be a proceeding useless and contrary to Nature (<a onClick="return mV(\'Rom\',11,17,24);">Ro 11:17,24</a>). On the mention of "branches of wild olive" in <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>.`<a href="./study/isbe/search.html?string=OIL+TREE">OIL TREE</a>`117';
