isbe[6563]='Onesimus`o-nes\'-i-mus (Onesimos, literally, "profitable," "helpful" (<a onClick="return mV(\'Col\',4,9);">Col 4:9</a>; <a onClick="return mV(\'Phm\',1,10);">Phm 1:10</a>)):<P>1. With Paul in Rome:<P>Onesimus was a slave (<a onClick="return mV(\'Phm\',1,16);">Phm 1:16</a>) belonging to Philemon who was a wealthy citizen of Colosse, and a prominent member of the church there. Onesimus was still a heathen when he defrauded his master and ran off from Colosse. He found his way to Rome, where evil men tended to flock as to a common center, as Tacitus tells us they did at that period. In Rome he came into contact with Paul, who was then in his own hired house, in military custody.<P>What brought him into contact with Paul we do not know. It may have been hunger; it may have been the pangs of conscience. He could not forget that his master\'s house in Colosse was the place where the Christians met in their weekly assemblies for the worship of Christ. Neither could he forget how Philemon had many a time spoken of Paul, to whom he owed his conversion. Now that Onesimus was in Rome—what a strange coincidence—Paul also was in Rome.<P>The result of their meeting was that Onesimus was converted to Christ, through the instrumentality of the apostle ("my child, whom I have begotten in my bonds," <a onClick="return mV(\'Phm\',1,10);">Phm 1:10</a>). His services had been very acceptable to Paul, who would gladly have kept Onesimus with him; but as he could not do this without the knowledge and consent of Philemon, he sent Onesimus back to Colosse, to his master there.<P>2. Paul\'s Epistles to Colosse and to Philemon:<P>At the same time Paul wrote to the church in Colosse on other matters, and he entrusted the Epistle to the Colossians to the joint care of Tychicus and Onesimus. The apostle recommends Onesimus to the brethren in Colosse, as a "faithful and beloved brother, who is one of you," and he goes on to say that Tychicus and Onesimus will make known to them all things that have happened to Paul in Rome. Such a commendation would greatly facilitate\' Onesimus\'s return to Colosse.<P>But Paul does more. He furnishes Onesimus with a letter written by himself to Philemon. Returning to a city where it was well known that he had been neither a Christian nor even an honest man, he needed someone to vouch for the reality of the change which had taken place in his life. And Paul does this for him both in the Epistle to the Colossians and in that to Philemon.<P>With what exquisite delicacy is Onesimus introduced! \'Receive him,\' says the apostle, \'for he is my own very heart\' (<a onClick="return mV(\'Phm\',1,12);">Phm 1:12</a>). "The man whom the Colossians had only known hitherto, if they knew him all, as a worthless runaway slave, is thus commended to them, as no more a slave but a brother, no more dishonest and faithless but trustworthy; no more an object of contempt but of love" (Lightfoot\'s Commentary on Col, 235).<P>(1) Onesimus Profitable.<P>The apostle accordingly begs Philemon to give Onesimus the same reception as he would rejoice to give to himself. The past history of Onesimus had been such as to belie the meaning of his name. He had not been "profitable"—far from it. But already his consistent conduct in Rome and his willing service to Paul there have changed all that; he has been profitable to Paul, and he will be profitable to Philemon too.<P>(2) Paul Guarantees.<P>Onesimus had evidently stolen his master\'s goods before leaving Colosse, but in regard to that the apostle writes that if he has defrauded Philemon in anything, he becomes his surety. Philemon can regard Paul\'s handwriting as a bond guaranteeing payment: "Put that to mine account," are his words, "I will repay it." Had Philemon not been a Christian, and had Paul not written this most beautiful letter, Onesimus might well have been afraid to return. In the Roman empire slaves were constantly crucified for smaller offenses than those of which he had been guilty. A thief and a runaway had nothing but torture or death to expect.<P>(3) The Change Which Christ Makes.<P>But now under the sway of Christ all is changed. The master who has been defrauded now owns allegiance to Jesus. The letter, which is delivered to him by his slave, is written by a bound "prisoner of Jesus Christ." The slave too is now a brother in Christ, beloved by Paul: surely he will be beloved by Philemon also. Then Paul intimates that he hopes soon to be set free, and then he will come and visit them in Colosse. Will Philemon receive him into his house as his guest?<P>(4) The Result.<P>It cannot be imagined that this appeal in behalf of Onesimus was in vain. Philemon would do more than Paul asked; and on the apostle\'s visit to Colosse he would find the warmest welcome, both from Philemon and from Onesimus.``155';
isbe[6564]='Onesiphorus`o-ne-sif\'-o-rus (Onesiphoros, literally, "profit bringer" (<a onClick="return mV(\'2Ti\',1,16);">2Ti 1:16</a>; <a onClick="return mV(\'2Ti\',4,19);">4:19</a>)):<P>1. The Friend of Paul:<P>Onesiphorus was a friend of the apostle Paul, who mentions him twice when writing to Timothy. In the former of the two passages where his name occurs, his conduct is contrasted with that of Phygellus and Hermogenes and others—all of whom, like Onesiphorus himself, were of the province of Asia—from whom Paul might well have expected to receive sympathy and help. These persons had "turned away" from him. Onesiphorus acted in a different way, for "he oft refreshed me, and was not ashamed of my chain; but, when he was in Rome, he sought me diligently, and found me."<P>Onesiphorus was one of the Christians of the church in Ephesus; and the second passage, where his name is found, merely sends a message of greeting from Paul, which Timothy in Ephesus is requested to deliver to "the household of Onesiphorus." (the King James Version).<P>2. Visits Paul in Rome:<P>Onesiphorus then had come from Ephesus to Rome. It was to Paul that the church at Ephesus owed its origin, and it was to him therefore that Onesiphorus and the Christians there were indebted for all that they knew of Christ. Onesiphorus gratefully remembered these facts, and having arrived in Rome, and learned that Paul was in prison, he "very diligently" sought for the apostle. But to do this, though it was only his duty, involved much personal danger at that particular time. For the persecution, inaugurated by Nero against the Christians, had raged bitterly; its fury was not yet abated, and this made the profession of the Christian name a matter which involved very great risk of persecution and of death.<P>Paul was not the man to think lightly of what his Ephesian friend had done. He remembered too, "in how many things he ministered at Ephesus." And, writing to Timothy, he reminded him that Onesiphorus\'s kindly ministrations at Ephesus were already well known to him, from his residence in Ephesus, and from his position, as minister of the church there.<P>It should be observed that the ministration of Onesiphorus at Ephesus was not, as the King James Version gives it, "to me," that is, to Paul himself. "To me" is omitted in the Revised Version (British and American). What Onesiphorus had done there was a wide Christian ministry of kindly action; it embraced "many things," which were too well known—for such is the force of the word—to Timothy to require repetition.<P>The visits which Onesiphorus paid to Paul in his Roman prison were intensely "refreshing." And it was not once or twice that he thus visited the chained prisoner, but he did so ofttimes.<P>3. His Household:<P>Though Onesiphorus had come to Rome, his household had remained in Ephesus; and a last salutation is sent to them by Paul. He could not write again, as he was now ready to be offered, and his execution could not long be delayed. But as he writes, he entertains the kindest feelings toward Onesiphorus and his household, and he prays that the Lord will give mercy to the household of Onesiphorus.<P>He also uses these words in regard to Onesiphorus himself: "The Lord grant unto him to find mercy of the Lord in that day." It is not clear whether Onesiphorus was living, or whether he had died, before Paul wrote this epistle. Different opinions have been held on the subject.<P>The way in which Paul refers twice to "the household (the Revised Version (British and American) "house") of Onesiphorus," makes it possible that Onesiphorus himself had died. If this is so—but certainty is impossible—the apostle\'s words in regard to him would be a pious wish, which has nothing in common with the abuses which have gathered round the subject of prayers for the dead, a practice which has no foundation in Scripture.``155';
isbe[6565]='Oniares`o-ni\'-a-rez, o-ni-a\'-rez: 1Macc 12:19 the King James Version equals the Revised Version (British and American) <a href="./study/isbe/search.html?string=ARIUS">ARIUS</a> (which see).``1';
isbe[6566]='Onias`o-ni\'-as (Onias): There were 3 high priests of the name of Onias, and a 4th Onias who did not become a high priest but was known as the builder of the temple of Leontopolis (Josephus, Ant, XIII, iii, 1-3). Only two persons of the name are mentioned in the Apocrypha—Onias I and Onias III.<P>(1) Onias I, according to Josephus (Ant., XI, viii, 7), the son of Jaddua and father of Simon the Just (ibid., XII, ii, 5; Sirach 50), and, according to 1Macc 12:7,20, a contemporary of Areus (Arius), king of Sparta, who reigned 309-265 BC (Diod. xx.29). This Onias was the recipient of a friendly letter from Areus of Sparta (1Macc 12:7; see manuscripts readings here, and 12:20). Josephus (Ant., XII, iv, 10) represents this letter as written to Onias III, which is an error, for only two Areuses are known, and Areus II reigned about 255 BC and died a child of 8 years (Paus. iii.6, 6). The letter—if genuine—exists in two copies (Josephus, Ant, XII, iv, 10, and 1Macc 12:20ff) (see Schurer, History of the Jewish People, 4th edition, I, 182 and 237).<P>(2) Onias III, son of Simon II (Josephus, Ant, XII, iv, 10), whom he succeeded, and a contemporary of Seleucus IV and Antiochus Epiphanes (2Macc 3:1; 4:7) and father of Onias IV. He was known for his godliness and zeal for the law, yet was on such friendly terms with the Seleucids that Seleucus IV Philopator defrayed the cost of the "services of the sacrifices." He quarreled with Simon the Benjamite, guardian of the temple, about the market buildings (Greek aedileship). Being unable to get the better of Onias and thirsting for revenge, Simon went to Apollonius, governor of Coele-Syria and Phoenicia, and informed him of the "untold sums of money," lodged in the treasury of the temple. The governor told the king, and Seleucus dispatched his chancellor, Heliodorus, to remove the money. Onias remonstrated in vain, pleading for the "deposits of widows and orphans." Heliodorus persisted in the object of his mission. The high priest and the people were in the greatest distress. But when Heliodorus had already entered the temple, "the Sovereign of spirits, and of all authority caused a great apparition," a horse with a terrible rider accompanied by two strong and beautiful young men who scourged and wounded Heliodorus. At the intercession of Onias, his life was spared. Heliodorus advised the king to send on the same errand any enemy or conspirator whom he wished punished. Simon then slandered Onias, and the jealousy having caused bloodshed between their followers, Onias decided to repair in person to the king to intercede for his country. Apparently before a decision was given, Seleucus was assassinated and Epiphanes succeeded (175 BC). Jason, the brother of Onias, having offered the new king larger revenue, secured the priesthood, which he held until he himself was similarly supplanted by Menelaus, Simon\'s brother (2Macc 4:23; Josephus, Ant, XII, v, 1, says Jason\'s brother). Menelaus, having stolen golden vessels belonging to the temple to meet his promises made to the king, was sharply reproved by Onias. Menelaus took revenge by persuading Andronicus, the king\'s deputy, to entice Onias by false promises of friendship from his sanctuary at Daphne and treacherously slay him—an act which caused indignation among both the Jews and the Greeks (2Macc 4:34ff). Josephus (Ant., XII, v, 1) says that "on the death of Onias the high priest, Antiochus gave the high-priesthood to his brother Jesus (Jason)," but the account of 2Macc given above is the more probable. Some see in <a onClick="return mV(\'Dan\',9,26);">Da 9:26</a>; <a onClick="return mV(\'Dan\',11,22);">11:22</a> reference to Onias III (Schurer, 4th edition, I, 194ff; III, 144).``5';
isbe[6567]='Onions`un\'-yunz (betsalim; krommuon): One of the delicacies of Egypt for which the children of Israel pined in the wilderness (<a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>). The onion, alllium cepa (Natural Order Liliaceae), is known in Arabic as bucal and is cultivated all over Syria and Egypt; it appears to be as much a favorite in the Orient today as ever.``1';
isbe[6568]='Only Begotten`on\'-li be-got-\'-\'n (monogenes): Although the English words are found only 6 times in the New Testament, the Greek word appears 9 times, and often in the Septuagint. It is used literally of an only child: "the only son of his mother" (<a onClick="return mV(\'Luk\',7,12);">Lu 7:12</a>); "an only daughter" (<a onClick="return mV(\'Luk\',8,42);">Lu 8:42</a>); "mine only child" (<a onClick="return mV(\'Luk\',9,38);">Lu 9:38</a>); "Isaac...his only begotten" (<a onClick="return mV(\'Hbr\',11,17);">Heb 11:17</a>). In all other places in the New Testament it refers to Jesus Christ as "the only begotten Son of God" (<a onClick="return mV(\'Jhn\',1,14,18);">Joh 1:14,18</a>; <a onClick="return mV(\'Jhn\',3,16,18);">3:16,18</a>; <a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>). In these passages, too, it might be translated as "the only son of God"; for the emphasis seems to be on His uniqueness, rather than on His sonship, though both ideas are certainly present. He is the son of God in a sense in which no others are. "Monogenes describes the absolutely unique relation of the Son to the Father in His divine nature; prototokos describes the relation of the Risen Christ in His glorified humanity to man" (Westcott on <a onClick="return mV(\'Hbr\',1,6);">Heb 1:6</a>). Christ\'s uniqueness as it appears in the above passages consists of two things:<P>(a) He reveals the Father: "No man hath seen God at any time; the only begotten Son, who is in the bosom of the Father, he hath declared him" (<a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a>). Men therefore behold His glory, "glory as of the only begotten from the Father" (<a onClick="return mV(\'Jhn\',1,14);">1:14</a>).<P>(b) He is the mediator of salvation: "God hath sent his only begotten Son into the world that we might live through him" (<a onClick="return mV(\'1Jo\',4,9);">1Joh 4:9</a>; <a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>); "He that believeth not (on him) hath been judged already" (<a onClick="return mV(\'Jhn\',3,18);">Joh 3:18</a>). Other elements in His uniqueness may be gathered from other passages, as His sinlessness, His authority to forgive sins, His unbroken communion with the Father, and His unique knowledge of Him. To say that it is a uniqueness of nature or essence carries thought no farther, for these terms still need definition, and they can be defined only in terms of His moral consciousness, of His revelation of God, and especially of His intimate union as Son with the Father.<P>The reading "God only begotten" in <a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a> the Revised Version margin, though it has strong textual support, is improbable, and can well be explained as due to orthodox zeal, in opposition to adoptionism. See Grimm-Thayer, Lexicon; Westcott, at the place`<a href="./study/isbe/search.html?string=BEGOTTEN">BEGOTTEN</a>; <a href="./study/isbe/search.html?string=PERSON+OF+CHRIST">PERSON OF CHRIST</a>; <a href="./study/isbe/search.html?string=SON+OF+GOD">SON OF GOD</a>`145';
isbe[6569]='Ono`o\'-no (\'ono; Codex Vaticanus Onan; Codex Alexandrinus Ono, and other forms): A town mentioned along with Lod as fortified by certain Benjamites (<a onClick="return mV(\'1Ch\',8,12);">1Ch 8:12</a>). The Mishna (Arakhin ix.6) says that Joshua fortified it, but there is no such early notice of it in Scripture. It was occupied by Benjamites after the return from exile (<a onClick="return mV(\'Ezr\',2,33);">Ezr 2:33</a>; <a onClick="return mV(\'Neh\',7,37);">Ne 7:37</a>; <a onClick="return mV(\'Neh\',11,35);">11:35</a>). In one of the villages in the plain of Ono, Sanballat and his friends vainly tried to inveigle Nehemiah into a conference (<a onClick="return mV(\'Neh\',6,2);">6:2</A>). It is represented by the modern Kefr \'Ana, which lies to the northwest of Lydda. In 1Esdras 5:22, the name appears as "Onus."``54';
isbe[6570]='Onus`o\'-nus.`<a href="./study/isbe/search.html?string=ONO">ONO</a>`1';
isbe[6571]='Onycha`on\'i-ka (shecheleth; compare Arabic suchalat, "filings," "husks"): "Onycha" is a transliteration of the Septuagint onucha, accusative of onux, which means "nail," "claw," "hoof," and also "onyx," a precious stone. The form "onycha" was perhaps chosen to avoid confusion with "onyx," the stone. The Hebrew shecheleth occurs only in <a onClick="return mV(\'Exd\',30,34);">Ex 30:34</a> as an ingredient of the sacred incense. It is supposed to denote the horny operculum found in certain species of marine gasteropod molluscs. The operculum is a disk attached to the upper side of the hinder part of the "foot" of the mollusc. When the animal draws itself into its shell, the hinder part of the foot comes last, and the operculum closes the mouth of the shell. The operculum, which may be horny or stony, is absent in some species. The horny opercula when burned emit a peculiar odor, and are still used in combination with other perfumes by the Arab women of Upper Egypt and Nubia. (See Sir S. Baker, The Nile Tributaries of Abyssinia, cited by EB, under the word "Onycha.")``37';
isbe[6572]='Onyx`on\'-iks o\'-niks.`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[6573]='Open`o\'-p\'-n: In the Old Testament represents chiefly pathach, but also other words, as galah, "to uncover"; of the opening of the eyes in vision, etc. (thus Balaam, <a onClick="return mV(\'Num\',22,31);">Nu 22:31</a>; <a onClick="return mV(\'Num\',24,4);">24:4</a>; compare <a onClick="return mV(\'Job\',33,16);">Job 33:16</a>; <a onClick="return mV(\'Job\',36,10);">36:10</a>; <a onClick="return mV(\'Psa\',119,18);">Ps 119:18</a>; <a onClick="return mV(\'Jer\',32,11,14);">Jer 32:11,14</a>). In the New Testament the usual word is anoigo (of opening of mouth, eyes, heavens, doors, etc.). A peculiar word, trachelizomai (literally, to have the neck bent back, to be laid bare), is used for "laid open" before God in <a onClick="return mV(\'Hbr\',4,13);">Heb 4:13</a>.``1';
isbe[6574]='Open Place`(1) The "open place" of <a onClick="return mV(\'Gen\',38,14);">Ge 38:14</a> the King James Version, in which Tamar sat, has come from a misunderstanding of the Hebrew, the translators having taken bephethach \'enayim to mean "in an opening publicly," instead of "in an opening (i.e. a gate) of Enaim" (compare <a onClick="return mV(\'Pro\',1,21);">Pr 1:21</a> in the Hebrew). The Revised Version (British and American) has corrected; see <a href="./study/isbe/search.html?string=ENAIM">ENAIM</a>.<P>(2) In <a onClick="return mV(\'1Ki\',22,10);">1Ki 22:10</a> parallel <a onClick="return mV(\'2Ch\',18,9);">2Ch 18:9</a> the Revised Version (British and American) relates that Ahab and Jehoshaphat sat "each on his throne, arrayed in their robes, in an open place (margin "Hebrew: a threshing-floor," the King James Version "a void place") at the entrance of the gate of Samaria." The Hebrew here is awkward, and neither the Septuagint nor the Syriac seems to have read the present text in <a onClick="return mV(\'1Ki\',22,10);">1Ki 22:10</a>, the former having "in arms, at the gate of Samaria," and the latter "in many-colored garments." Consequently various attempts have been made to emend the text, of which the simplest is the omission of beghoren, "in an open place." If, however, the text is right—as is not impossible—the open place is a threshing-floor close to the gate. See the commentaries.``48';
isbe[6575]='Operation`op-er-a\'-shun (ma\'ashe, "work"; energeia, energema, "energy"): Twice used in the Old Testament of God\'s creative work (<a onClick="return mV(\'Psa\',28,4,5);">Ps 28:4,5</a>; <a onClick="return mV(\'Isa\',5,12);">Isa 5:12</a>). The Holy Spirit\'s inworking and power are manifest in the bestowal of spiritual gifts on individuals and on the church (<a onClick="return mV(\'1Cr\',12,6);">1Co 12:6</a> the King James Version), and in the resurrection of Jesus Christ, through which energy or operation of God those dead in sins are, through faith, raised to newness of life (<a onClick="return mV(\'Col\',2,12);">Col 2:12</a> the King James Version).``1';
isbe[6576]='Ophel`o\'-fel (ha-\'ophel (<a onClick="return mV(\'2Ch\',27,3);">2Ch 27:3</a>; <a onClick="return mV(\'2Ch\',33,14);">33:14</a>; <a onClick="return mV(\'Neh\',3,26);">Ne 3:26</a>f; <a onClick="return mV(\'Neh\',11,21);">11:21</a>; and without article, <a onClick="return mV(\'Isa\',32,14);">Isa 32:14</a> and <a onClick="return mV(\'Mic\',4,8);">Mic 4:8</a>; also <a onClick="return mV(\'2Ki\',5,24);">2Ki 5:24</a>)):<P>1. Meaning of Name:<P>There has been considerable divergence of opinion with regard to the meaning of this name. Thus, in all the references given above with the article, the Revised Version (British and American) has simply "Ophel," but the King James Version adds in margin "the tower"; in <a onClick="return mV(\'Isa\',32,14);">Isa 32:14</a>, "the hill" with margin "Ophel," but the King James Version "the forts," margin "clifts"; <a onClick="return mV(\'Mic\',4,8);">Mic 4:8</a>, "the hill," margin "Hebrew: Ophel," but the King James Version "the stronghold"; <a onClick="return mV(\'2Ki\',5,24);">2Ki 5:24</a>, "the hill," margin "Hebrew: Ophel," but the King James Version "the tower," margin "secret place." It is true that the other occurrences of the word in <a onClick="return mV(\'1Sa\',5,9,12);">1Sa 5:9,12</a>; <a onClick="return mV(\'1Sa\',6,5);">6:5</a>f; where it is translated "tumors," and <a onClick="return mV(\'Hab\',2,4);">Hab 2:4</a>, where a verbal form is translated "puffed up," seem to imply that one meaning assigned to the root may be that of "swelling." Recently Dr. Burney (PEF, January, 1911) has produced strong arguments in favor of Ophel, when used as the name of a locality, meaning "fortress."<P>2. Three Ophels:<P>Three places are known to have received this name:<P>(1) A certain place on the east hill of Jerusalem, south of the temple; to this all the passages quoted above—except one—refer.<P>(2) The "Ophel," translated "hill," situated apparently in Samaria (compare <a onClick="return mV(\'2Ki\',5,3);">2Ki 5:3</a>), where Gehazi took his ill-gotten presents from the hands of the servants of Naaman the Syrian. The translation "tower" would suit the sense at least as well. It was some point probably in the wall of Samaria, perhaps the citadel itself.<P>(3) The third reference is not Biblical, but on the Moabite Stone, an inscription of Mesha, king of Moab, contemporary with Omri. He says: "I built Q-R-CH-H (? Karhah), the wall of ye\'arim, and the wall of \'Ophel and I built its gates and I built its towers."<P>In comparing the references to (1) and (3), it is evident that if Ophel means a "hill," it certainly was a fortified hill, and it seems highly probable that it meant some "artificial swelling in a fortification, e.g. a bulging or rounded keep or enceinte" (Burney, loc. cit.). <a onClick="return mV(\'Isa\',32,14);">Isa 32:14</a> reads, "The palace shall be forsaken; the populous city shall be deserted; the hill (Ophel) and the watch-tower shall be for dens for ever." Here we have palace, city and watch-tower, all the handiwork of the builder. Does it not seem probable that the Ophel belongs to the same category?<P>3. The Ophel of Jerusalem:<P>The situation of the Ophel of Jerusalem is very definitely described. It was clearly, from the references (<a onClick="return mV(\'Neh\',3,26,27);">Ne 3:26,27</a>; <a onClick="return mV(\'2Ch\',27,3);">2Ch 27:3</a>; <a onClick="return mV(\'2Ch\',33,14);">33:14</a>), on the east hill south of the temple. Josephus states (Josephus, Jewish Wars, V, iv, 2) that the eastern wall of the city ran from Siloam "and reaches as far as a certain place which they called Ophlas when it was joined to the eastern cloister of the temple." In BJ, V, vi,1,it states that "John held the temple and the parts thereto adjoining, for a great way, as also \'Ophla,\' and the Valley called the \'Valley of the Cedron.\' " It is noticeable that this is not identical with the "Acra" and "Lower City" which was held by Simon. There is not the slightest ground for applying the name Ophel, as has been so commonly done, to the whole southeastern hill. In the days of Josephus, it was a part of the hill immediately south of the temple walls, but the Old Testament references suit a locality nearer the middle of the southeastern hill. In the article <a href="./study/isbe/search.html?string=ZION">ZION</a> (which see) it is pointed out that that name does not occur (except in reference to the Jebusite city) in the works of the Chronicler, but that "the Ophel," which occurs almost alone in these works, is apparently used for it. <a onClick="return mV(\'Mic\',4,8);">Mic 4:8</a> margin seems to confirm this view: "O tower of the flock, the Ophel of the daughter of Zion." Here the "tower of the flock" may well refer to the shepherd David\'s stronghold, and the second name appears to be a synonym for the same place.<P>Ophel then was probably the fortified site which in earlier days had been known as "Zion" or "the City of David." King Jotham "built much" "on the wall of Ophel" (<a onClick="return mV(\'2Ch\',27,3);">2Ch 27:3</a>). King Manasseh "built an outer wall to the city of David, on the west side of Gihon, in the valley, even to the entrance at the fish gate; and he compassed Ophel about with it, and raised it up to a very great height" (<a onClick="return mV(\'2Ch\',33,14);">2Ch 33:14</a>). It was clearly a fortified place of great importance, and its situation must have been so near that of the ancient "Zion" that scarcely any other theory is possible except that it occupied the site of that ancient fortress.``117';
isbe[6577]='Ophir`o\'-fer, o\'-fir (\'owphiyr (<a onClick="return mV(\'Gen\',10,29);">Ge 10:29</a>), \'owphir (<a onClick="return mV(\'1Ki\',10,11);">1Ki 10:11</a>), \'ophir):<P>1. Scriptural References:<P>The 11th in order of the sons of Joktan (<a onClick="return mV(\'Gen\',10,29);">Ge 10:29</a> equals <a onClick="return mV(\'1Ch\',1,23);">1Ch 1:23</a>). There is a clear reference also to a tribe Ophir (<a onClick="return mV(\'Gen\',10,30);">Ge 10:30</a>). Ophir is the name of a land or city somewhere to the south or southeast of Palestine for which Solomon\'s ships along with Phoenician vessels set out from Ezion-geber at the head of the Gulf of Aqabah, returning with great stores of gold, precious stones and "almug"-wood (<a onClick="return mV(\'1Ki\',9,28);">1Ki 9:28</a>; <a onClick="return mV(\'1Ki\',10,11);">10:11</a>; <a onClick="return mV(\'2Ch\',9,10);">2Ch 9:10</a>; <a onClick="return mV(\'1Ki\',22,48);">1Ki 22:48</a>; <a onClick="return mV(\'2Ch\',8,18);">2Ch 8:18</a>). We get a fuller list of the wares and also the time taken by the voyage if we assume that the same vessels are referred to in <a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a>, "Once every three years came the navy of Tarshish, bringing gold, and silver, ivory, and apes, and peacocks." The other products may not have been native to the land of Ophir, but it is certain that the gold at least was produced there. This gold was proverbial for its purity, as is witnessed by many references in the Old Testament (<a onClick="return mV(\'Psa\',45,9);">Ps 45:9</a>; <a onClick="return mV(\'Job\',28,16);">Job 28:16</a>; <a onClick="return mV(\'Isa\',13,12);">Isa 13:12</a>; <a onClick="return mV(\'1Ch\',29,4);">1Ch 29:4</a>), and, in <a onClick="return mV(\'Job\',22,24);">Job 22:24</a>, Ophir is used for fine gold itself. In addition to these notices of Ophir, it is urged that the name. occurs also in two passages under the form "Uphaz" (<a onClick="return mV(\'Jer\',10,9);">Jer 10:9</a>; <a onClick="return mV(\'Dan\',10,5);">Da 10:5</a>).<P>2. Geographical Position:<P>At all times the geographical position of Ophir has been a subject of dispute, the claims of three different regions being principally advanced, namely<P class="in15">(1) India and the Far East,<P class="in15">(2) Africa,<P class="in15">(3) Arabia.<P>(1) India and the Far East.<P>All the wares mentioned are more or less appropriate to India, even including the fuller list of <a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a>. "Almug"-wood is conjectured to be the Indian sandal-wood. Another argument is based on the resemblance between the Septuagint form of the word (Sophera) and the Coptic name for India (Sophir). A closer identification is sought with Abhira, a people dwelling at the mouths of the Indus. Supara, an ancient city on the west coast of India near the modern Goa, is also suggested. Again, according to Wildman, the name denotes a vague extension eastward, perhaps as far as China.<P>(2) Africa.<P>This country is the greatest gold-producing region of the three. Sofala, a seaport near Mozambique on the east coast of Africa, has been advanced as the site of Ophir, both on linguistic grounds and from the nature of its products, for there all the articles of <a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a> could be procured. But Gesenius shows that Sofala is merely the Arabic form of the Hebrew shephelah. Interest in this region as the land of Ophir was renewed, however, by Mauch\'s discovery at Zimbabye of great ruins and signs of old Phoenician civilization and worked-out gold mines. According to Bruce (I, 440), a voyage from Sofala to Ezion-geber would have occupied quite three years owing to the monsoons.<P>(3) Arabia.<P>The claim of southeastern Arabia as the land of Ophir has on the whole more to support it than that of India or of Africa. The Ophir of <a onClick="return mV(\'Gen\',10,29);">Ge 10:29</a> beyond doubt belonged to this region, and the search for Ophir in more distant lands can be made only on the precarious assumption that the Ophir of Kings is not the same as the Ophir of Genesis. Of the various products mentioned, the only one which from the Old Testament notices can be regarded as clearly native to Ophir is the gold, and according to Pliny and Strabo the region of southeastern Arabia bordering on the Persian Gulf was a famous gold-producing country. The other wares were not necessarily produced in Ophir, but were probably brought there from more distant lands, and thence conveyed by Solomon\'s merchantmen to Ezion-geber. If the duration of the voyage (3 years) be used as evidence, it favors this location of Ophir as much as that on the east coast of Africa. It seems therefore the least assailable view that Ophir was a district on the Persian Gulf in southeastern Arabia and served in old time as an emporium of trade between the East and West.``63';
isbe[6578]='Ophni`of\'-ni (ha-\'ophni; Aphne): A place in the territory of Benjamin (<a onClick="return mV(\'Jos\',18,24);">Jos 18:24</a>). The modern Jifneh, in a fine vale west of the road to Nablus and 2 1/2 miles northwest of Bethel, might suit as to position; but the change in the initial letter from \'ain to jim is not easy. This is the Gophna of the rabbis (compare Josephus, Jewish Wars, III, iii, 5).``1';
isbe[6579]='Ophrah`of\'-ra (\'ophrah; Codex Vaticanus Aphra; Codex Alexandrinus Iephratha, etc.):<P>(1) A town in the territory allotted to Benjamin named between Parah and Chephar-ammoni (<a onClick="return mV(\'Jos\',18,23);">Jos 18:23</a>). It is mentioned again in <a onClick="return mV(\'1Sa\',13,17);">1Sa 13:17</a>. The Philistines who were encamped at Michmash sent out marauding bands, one of which went westward, another eastward, down "the valley of Zeboim toward the wilderness"; the third "turned unto the way that leadeth to Ophrah, unto the land of Shual." This must have been northward, as Saul commanded the passage to the south. Eusebius, Onomasticon places it 5 Roman miles east of Bethel. A site which comes near to fulfilling these conditions is eT-Taiyebeh, which stands on a conical hill some 5 miles northeast of Beitin. This is possibly identical with "Ephron" (<a onClick="return mV(\'2Ch\',13,19);">2Ch 13:19</a>), and "Ephraim" (<a onClick="return mV(\'Jhn\',11,54);">Jn. 11:54</a>).<P>(2) A city in the tribal lot of Manasseh west of Jordan. It is mentioned only in connection with Gideon, whose native place it was, and with his son Abimelech (<a onClick="return mV(\'Jdg\',6,11);">Jud 6:11</a>, etc.). It was, indeed, family property, belonging to Joash the Abiezrite, the father of Gideon. It was apparently not far from the plain of Esdraelon (<a onClick="return mV(\'Jdg\',6,33);">Jud 6:33</a>f), so that Gideon and his kinsmen smarted under the near presence of the oppressing Midianites. Manasseh, of course, as bordering on the southern edge of the plain, was in close touch with the invaders. At Ophrah, Gideon reared his altar to Yahweh, and made thorough cleansing of the instruments of idolatry. After his great victory, he set up here the golden ephod made from the spoils of the enemy, which proved a snare to himself and to his house (<a onClick="return mV(\'Jdg\',8,27);">Jud 8:27</a>). Here he was finally laid to rest. It was at Ophrah that Abimelech, aspiring to the kingdom, put to death upon one stone three score and ten of his brethren, as possible rivals, Jotham alone escaping alive (<a onClick="return mV(\'Jdg\',9,5);">Jud 9:5</a>). Apparently the mother of Abimelech belonged to Shechem; this established a relationship with that town, his connection with which does not therefore mean that Ophrah was near it.<P>No quite satisfactory identification has yet been suggested. Conder (PEFS, 1876, 1971) quotes the Samaritan Chronicle as identifying Ferata, which <span class="noTag">is</span> 6 miles west of Nablus, with an ancient Ophra, "and the one that suggests itself as most probably identical is Ophrah of the Abiezerite." But this seems too far to the south.<P>(3) A man of the tribe of Judah, son of Meonothai (<a onClick="return mV(\'1Ch\',4,14);">1Ch 4:14</a>).``54';
isbe[6580]='Opinion`o-pin\'-yun (dea\', ce\'ippim): "Opinion" occurs only 5 times, thrice in Job (<a onClick="return mV(\'Job\',32,6,10,17);">32:6,10,17</a>) as the translation of dea\', "knowledge," "opinion" (in the address of Elihu), and once of ce\'ippim, from ca\'aph, "to divide or branch out," hence, division or party, unsettled opinion (in the memorable appeal of Elijah, "How long halt ye between two opinions?" <a onClick="return mV(\'1Ki\',18,21);">1Ki 18:21</a>, the American Standard Revised Version "How long go ye limping between the two sides?"). In Ecclesiasticus 3:24, we have, "For many are deceived by their own vain opinion" (hupolepsis, "a taking up," "a hasty judgment"), the Revised Version (British and American) The conceit of many hath led them astray.``185';
isbe[6581]='Opobalsamum`op-o-bal\'-sa-mum: the Revised Version margin in <a onClick="return mV(\'Exd\',30,34);">Ex 30:34</a>.`<a href="./study/isbe/search.html?string=STACTE">STACTE</a>`1';
isbe[6582]='Oppression`o-presh\'-un: Used in the King James Version to translate a variety of Hebrew words, all of which, however, agree in the general sense of wrong done by violence to others. There are a few cases where the reference is to the oppression of Israel by foreigners, as by their Egyptian masters (<a onClick="return mV(\'Exd\',3,9);">Ex 3:9</a>; <a onClick="return mV(\'Deu\',26,7);">De 26:7</a>), or by Syria (<a onClick="return mV(\'2Ki\',13,4);">2Ki 13:4</a>), or by an unmentioned nation (<a onClick="return mV(\'Isa\',30,20);">Isa 30:20</a> King James Version, margin). In all these cases the Hebrew original is lachats. But in the vast number of cases the reference is to social oppression of one kind or another within Israel\'s own body. It is frequently theme of psalmist and prophet and wise man. The poor and weak must have suffered greatly at the hands of the stronger and more fortunate. The word lachats, various forms of the root \'ashaq, and other words are used by the writers as they express their sorrow and indignation over the wrongs of their afflicted brethren. In his own sorrow, Job remembers the suffering of the oppressed (<a onClick="return mV(\'Job\',35,9);">Job 35:9</a>; <a onClick="return mV(\'Job\',36,15);">36:15</a>); it is a frequent subject of song in the Psalms (<a onClick="return mV(\'Psa\',12,5);">Ps 12:5</a>; <a onClick="return mV(\'Psa\',42,9);">42:9</a>; <a onClick="return mV(\'Psa\',43,2);">43:2</a>; <a onClick="return mV(\'Psa\',44,24);">44:24</a>; <a onClick="return mV(\'Psa\',55,3);">55:3</a>; <a onClick="return mV(\'Psa\',119,134);">119:134</a>); the preacher observes and reflects upon its prevalence (<a onClick="return mV(\'Ecc\',4,1);">Ec 4:1</a>; <a onClick="return mV(\'Ecc\',5,8);">5:8</a>; <a onClick="return mV(\'Ecc\',7,7);">7:7</a> the King James Version); the prophets Amos (<a onClick="return mV(\'Amo\',3,9);">3:9</a>), Isaiah (<a onClick="return mV(\'Isa\',5,7);">5:7</a>; <a onClick="return mV(\'Isa\',59,13);">59:13</a>), Jeremiah (<a onClick="return mV(\'Jer\',6,6);">6:6</a>; <a onClick="return mV(\'Jer\',22,17);">22:17</a>) and Ezekiel (<a onClick="return mV(\'Eze\',22,7,29);">22:7,29</a>) thundered against it. It was exercised toward strangers and also toward the Israelites themselves, and was never wholly overcome. In <a onClick="return mV(\'Jam\',2,6);">Jas 2:6</a>, "oppress" is the rendering of katadunasteuo, "to exercise harsh control over one," "to use one\'s power against one."``114';
isbe[6583]='Or`or: The word is used once for either (<a onClick="return mV(\'1Sa\',26,10);">1Sa 26:10</a>), and is still in poetic use in this sense; as in, "Without or wave or wind" (Coleridge); "Or the bakke or some bone he breketh in his dzouthe" (Piers Plowman (B), VII, 93; compare Merchant of Venice, III, ii, 65). It is also used with "ever" for before (<a onClick="return mV(\'Psa\',90,2);">Ps 90:2</a>; Ecclesiasticus 18:19), which the American Standard Revised Version substitutes in <a onClick="return mV(\'Ecc\',12,6);">Ec 12:6</a> (compare <a onClick="return mV(\'Ecc\',12,1,2);">12:1,2</a>); <a onClick="return mV(\'Sgs\',6,12);">So 6:12</a>; <a onClick="return mV(\'Dan\',6,24);">Da 6:24</a>.``1';
isbe[6584]='Oracle`or\'-a-k\'-l:<P>(1) A divine utterance delivered to man, usually in answer to a request for guidance. So in <a onClick="return mV(\'2Sa\',16,23);">2Sa 16:23</a> for dabhar ("word," as in the Revised Version margin). The use in this passage seems to indicate that at an early period oracular utterances were sought from Yahweh by the Israelites, but the practice certainly fell into disuse at the rise of prophecy, and there are no illustrations of the means employed (<a onClick="return mV(\'1Sa\',14,18,19,\'36-42\');">1Sa 14:18,19,36-42</a>, etc., belong rather to <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a> (which see)). In. the Revised Version margin of such passages as <a onClick="return mV(\'Isa\',13,1);">Isa 13:1</a>, "oracle" is used in the titles of certain special prophecies as a substitute for <a href="./study/isbe/search.html?string=BURDEN">BURDEN</a> (which see) (massa\'), with considerable advantage (especially in <a onClick="return mV(\'Lam\',2,14);">La 2:14</a>).<P>(2) In heathen temples "oracle" was used for the chamber in which the utterances were delivered (naturally a most sacred part of the structure). This usage, coupled with a mistake in Hebrew philology (connecting debhir, "hinder part," with dibber, "speak"), caused English Versions of the Bible to give the title "oracle" to the Most Holy Place of the Temple, in <a onClick="return mV(\'1Ki\',6,5);">1Ki 6:5</a>, etc., following the example of Aquila, Symmachus and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) But the title is very unfortunate, as the Most Holy Place had nothing to do with the delivery of oracles, and the Revised Version (British and American) should have corrected (compare <a onClick="return mV(\'Psa\',28,2);">Ps 28:2</a> margin).<P>(3) In the New Testament English Versions of the Bible employs "oracle" as the translation of logion, "saying," in four places. In all, divine utterances are meant, specialized in <a onClick="return mV(\'Act\',7,38);">Ac 7:38</a> as the Mosaic Law ("living oracles" equals "commandments enforced by the living God"), in <a onClick="return mV(\'Rom\',3,2);">Ro 3:2</a> as the Old Testament in general, and in <a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a> as the revelations of Christianity (<a onClick="return mV(\'Hbr\',6,2,3);">Heb 6:2,3</a>). In <a onClick="return mV(\'1Pe\',4,11);">1Pe 4:11</a> the meaning is debated, but probably the command is addressed to those favored by a supernatural "gift of speech." Such men must keep their own personality in the background, adding nothing of their own to the inspired message as it comes to them.``48';
isbe[6585]='Oracles, Sibylline`sib\'-i-lin, -lin.`<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`1';
isbe[6586]='Orator; Ortion`or\'-a-ter, o-ra\'-shun: The word "orator" occurs twice:<P>(1) As the King James Version rendering of lachash; only <a onClick="return mV(\'Isa\',3,3);">Isa 3:3</a>, "the eloquent orator," the King James Version margin "skilful of speech," where the Revised Version (British and American) rightly substitutes "the skillful enchanter." The word lachash is probably a mimetic word meaning "a hiss," "a whisper" and is used in the sense of "incantation" "charm." Hence, nebhon lachash means "skillful in incantation," "expert in magic." See <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>; <a href="./study/isbe/search.html?string=ENCHANTMENT">ENCHANTMENT</a>.<P>(2) As the rendering of rhetor, the title applied to Tertullus, who appeared as the advocate of the Jewish accusers of Paul before Felix (<a onClick="return mV(\'Act\',24,1);">Ac 24:1</a>). The proceedings, as was generally the case in the provincial Roman courts, would probably be conducted in Latin, and under Roman modes of procedure, in which the parties would not be well versed; hence, the need of a professional advocate. Rhetor is here the equivalent of the older Greek sunegoros, "the prosecuting counsel," as opposed to the sundikos, "the defendant\'s advocate."<P>Oration occurs only in <a onClick="return mV(\'Act\',12,21);">Ac 12:21</a>: "Herod...made an oration unto them" (edemegorei pros autous). The verb demegoreo, "to speak in an assembly" (from demos, "people," agoreuo, "to harangue"), is often found in classical Greek, generally in a bad sense (Latin concionari); here only in the New Testament.``49';
isbe[6587]='Orchard`or\'-cherd:<P>(1) pardec, from Old Persian, "a walled-in enclosure"; paradeisos, a word in classical Greek applied to the garden of Babylon (Diodorus Siculus xi.10) and to a game park (Xenophon, Anab. i.2, 7). See <a onClick="return mV(\'Neh\',2,8);">Ne 2:8</a>, "forest," margin "park"; <a onClick="return mV(\'Sgs\',4,13);">So 4:13</a>, "orchard," margin "paradise" (of pomegranates); <a onClick="return mV(\'Ecc\',2,5);">Ec 2:5</a>, "parks," the King James Version "orchards"; see <a href="./study/isbe/search.html?string=PARADISE">PARADISE</a>.<P>(2) kepos, "garden" or "orchard": "a white thorn in an orchard" (Baruch 6:71).``1';
isbe[6588]='Ordain; Ordination`or-dan\', or-di-na-shun (Latin ordinare, "to set in order" "to arrange"; in post-Augustan Latin "to appoint to office"; from ordo, gen. ordinis, "order," "arrangement"): In the King James Version the verb "to ordain" renders as many as 35 different words (11 Hebrew words in the Old Testament, 21 Greek words in Apocrypha and the New Testament, and 3 Latin words in Apocrypha). This is due to the fact that the English word has many shades of meaning (especially as used in the time the King James Version was made), of which the following are the chief:<P>(1) To set in order, arrange, prepare:<P class="in15">"All things that we ordained festival,<P class="in15">Turn from their office to black funeral."<P class="in30">—Shakespeare, Romeo and Juliet, IV, v, 84.<P>This meaning is now obsolete. It is found in the King James Version of <a onClick="return mV(\'Psa\',132,17);">Ps 132:17</a>; <a onClick="return mV(\'Isa\',30,33);">Isa 30:33</a>; <a onClick="return mV(\'Hbr\',9,6);">Heb 9:6</a> (in each of which cases the Revised Version (British and American) or margin substitutes "prepare"); <a onClick="return mV(\'1Ch\',17,9);">1Ch 17:9</a> (the Revised Version (British and American) "appoint"); <a onClick="return mV(\'Psa\',7,13);">Ps 7:13</a> (the Revised Version (British and American) "maketh"); <a onClick="return mV(\'Hab\',1,12);">Hab 1:12</a> (also the Revised Version (British and American)).<P>(2) To establish, institute, bring into being: "When first this order (i.e. the Garter) was ordained, my Lord" (Shakespeare). So in <a onClick="return mV(\'1Ki\',12,32);">1Ki 12:32</a>, "Jeroboam ordained a feast in the 8th month" (<a onClick="return mV(\'1Ki\',12,33);">12:33</a>); <a onClick="return mV(\'Num\',28,6);">Nu 28:6</a>; <a onClick="return mV(\'Psa\',8,2,3);">Ps 8:2,3</a>; <a onClick="return mV(\'Isa\',26,12);">Isa 26:12</a>; 2Es 6:49 the King James Version (the Revised Version (British and American) "preserve"); Sirach 7:15; <a onClick="return mV(\'Gal\',3,19);">Ga 3:19</a>.<P>(3) To decree, give orders, prescribe:<P class="in15">"And doth the power that man adores<P class="in15">Ordain their doom "—Byron.<P>So <a onClick="return mV(\'Est\',9,27);">Es 9:27</a>, "The Jews ordained...that they would keep these two days according to the writing thereof"; 1Esdras 6:34; 2Esdras 7:17; 8:14 the King James Version; Tobit 1:6; 8:7 the King James Version (the Revised Version (British and American) "command"); <span class="noTag">Additions to Esther 14:9; 1Macc 4:59; 7:49</span>; <a onClick="return mV(\'Act\',16,4);">Ac 16:4</a>; <a onClick="return mV(\'Rom\',7,10);">Ro 7:10</a> the King James Version; <a onClick="return mV(\'1Cr\',2,7);">1Co 2:7</a>; <a onClick="return mV(\'1Cr\',7,17);">7:17</a>; <a onClick="return mV(\'1Cr\',9,14);">9:14</a>; <a onClick="return mV(\'Eph\',2,10);">Eph 2:10</a> the King James Version.<P>(4) To set apart for an office or duty, appoint, destine: "Being ordained his special governor" (Shakespeare). Frequent in EV. When the King James Version has "ordain" in this sense, the Revised Version (British and American) generally substitutes "appoint"; e.g. "He (Jesus) appointed (the King James Version "ordained") twelve, that they might be with him" (<a onClick="return mV(\'Mar\',3,14);">Mr 3:14</a>). So <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>; <a onClick="return mV(\'Jer\',1,5);">Jer 1:5</a>; <a onClick="return mV(\'Dan\',2,24);">Da 2:24</a>; 1Esdras 8:49; 1Ma 3:55; 10:20; <a onClick="return mV(\'Jhn\',15,16);">Joh 15:16</a>; <a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>; <a onClick="return mV(\'1Ti\',2,7);">1Ti 2:7</a>; <a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>; <a onClick="return mV(\'Hbr\',5,1);">Heb 5:1</a>; <a onClick="return mV(\'Hbr\',8,3);">8:3</a>. The Revised Version (British and American) substitutes "formedst" in The <span class="noTag">Wisdom of Solomon 9:2</span>, "recorded" in Sirach 48:10, "become" in <a onClick="return mV(\'Act\',1,22);">Ac 1:22</a>, "written of" (margin "set forth") in <a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a>, but retains "ordain" in the sense of "appoint," "set apart," in <a onClick="return mV(\'2Ki\',23,5);">2Ki 23:5</a>; <a onClick="return mV(\'1Ch\',9,22);">1Ch 9:22</a>; 1Esdras 8:23; <span class="noTag">Additions to Esther 13:6</span>; <a onClick="return mV(\'Act\',10,42);">Ac 10:42</a>; <a onClick="return mV(\'Act\',13,48);">13:48</a>; <a onClick="return mV(\'Act\',17,31);">17:31</a>; <a onClick="return mV(\'Rom\',13,1);">Ro 13:1</a>.<P>(5) To appoint ceremonially to the ministerial or priestly office, to confer holy orders on. This later technical or ecclesiastical sense is never found in English Versions of the Bible. The nearest approach is (4) above, but the idea of formal or ceremonial setting-apart to office (prominent in its modern usage) is never implied in the word.<P>Ordination: The act of arranging in regular order, especially the act of investing with ministerial or sacerdotal rank (ordo), the setting-apart for an office in the Christian ministry. The word does not occur in English Version of the Bible. The New Testament throws but little light on the origin of the later ecclesiastical rite of ordination. The 12 disciples were not set apart by any formal act on the part of Jesus. In <a onClick="return mV(\'Mar\',3,14);">Mr 3:14</a>; <a onClick="return mV(\'Jhn\',15,16);">Joh 15:16</a>, the King James Version rendering "ordain" is, in view of its modern usage, misleading; nothing more is implied than an appointment or election. In <a onClick="return mV(\'Jhn\',20,\'21-23\');">Joh 20:21-23</a>, we have indeed a symbolic act of consecration ("He breathed on them"), but "the act is described as one and not repeated. The gift was once for all, not to individuals but to the abiding body" (Westcott, at the place). In the Apostolic age there is no trace of the doctrine of an outward rite conferring inward grace, though we have instances of the formal appointment or recognition of those who had already given proof of their spiritual qualification.<P>(1) The Seven were chosen by the brethren as men already "full of the Spirit and of wisdom," and were then "appointed" by the Twelve, who prayed and laid their hands upon them (<a onClick="return mV(\'Act\',6,\'1-6\');">Ac 6:1-6</a>).<P>(2) The call of Barnabas and Saul came direct from God (<a onClick="return mV(\'Act\',13,2);">Ac 13:2</a>, "the work whereunto I have called them"; <a onClick="return mV(\'Act\',13,4);">Ac 13:4</a>, they were "sent forth by the Holy Spirit"). Yet certain prophets and teachers were instructed by the Holy Spirit to "separate" them (i.e. publicly) for their work, which they did by fasting and praying and laying on of hands (<a onClick="return mV(\'Act\',13,3);">Ac 13:3</a>). But it was utterly foreign to Paul\'s point of view to regard the church\'s act as constituting him an apostle (compare <a onClick="return mV(\'Gal\',1,1);">Ga 1:1</a>).<P>(3) Barnabas and Paul are said to have "ordained," the Revised Version (British and American) "appointed" (cheirotonesantes, "elect," "appoint," without indicating the particular mode of appointment), elders or presbyters in every city with prayers and fasting (<a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>). So Titus was instructed by Paul to "appoint elders in every city" in Crete (<a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>).<P>(4) The gift of Timothy for evangelistic work seems to have been formally recognized in two ways:<P>(a) by the laying on of the hands of the presbytery (<a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>),<P>(b) by the laying on of the hands of Paul himself (<a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>). The words "Lay hands hastily on no man" (<a onClick="return mV(\'1Ti\',5,22);">1Ti 5:22</a>) do not refer to an act of ordination, but probably to the restoration of the penitent. The reference in <a onClick="return mV(\'Hbr\',6,2);">Heb 6:2</a> is not exclusively to ordination, but to all occasions of laying on of hands (see <a href="./study/isbe/search.html?string=HANDS,+IMPOSITION+OF">HANDS, IMPOSITION OF</a>). From the few instances mentioned above (the only ones found in the New Testament), we infer that it was regarded as advisable that persons holding high office in the church should be publicly recognized in some way, as by laying on of hands, fasting, and public prayer. But no great emphasis was laid on this rite, hence, "it can hardly be likely that any essential principle was held to be involved in it" (Hort, The Christian Ecclesia, 216). It was regarded as an outward act of approval, a symbolic offering of intercessory prayer, and an emblem of the solidarity of the Christian community, rather than an indispensable channel of grace for the work of the ministry. (For the later ecclesiastical doctrine and rite see Edwin Hatch\'s valuable article on "Ordination" in the Dictionary of Christian Antiquity)``49';
isbe[6589]='Order`or\'-der (\'arakh, "to arrange"; tassein (diatassein, taxis, tagma)): "Order" in Biblical phrases may indicate<P>(1) arrangement in rows,<P>(2) sequence in time,<P>(3) classification and organization,<P>(4) likeness or manner,<P>(5) regulation, direction or command, or<P>(6) the declaring of a will.<hr /><P>In many passages it is difficult if not impossible to determine from the English text alone in which of these senses the word is used.<P>1. Arrangement in Rows:<P>The fundamental idea suggested by the Hebrew, Greek and English words is that of arrangement in rows. Thus "order" is used in the Bible of arranging wood for an altar (<a onClick="return mV(\'Lev\',1,7);">Le 1:7</a>; <a onClick="return mV(\'1Ki\',18,33);">1Ki 18:33</a>; compare Hebrew <a onClick="return mV(\'Gen\',22,9);">Ge 22:9</a>; <a onClick="return mV(\'Isa\',30,33);">Isa 30:33</a>); of laying out flax-stalks for drying (<a onClick="return mV(\'Jos\',2,6);">Jos 2:6</a>); of preparing offerings (<a onClick="return mV(\'Lev\',1,8,12);">Le 1:8,12</a>; compare <a onClick="return mV(\'Luk\',6,5);">Lu 6:5</a>; <a onClick="return mV(\'Jdg\',6,26);">Jud 6:26</a>); of arranging lamps (<a onClick="return mV(\'Exd\',27,21);">Ex 27:21</a>; <a onClick="return mV(\'Exd\',39,37);">39:37</a>; <a onClick="return mV(\'Lev\',24,3,4);">Le 24:3,4</a>; compare <a onClick="return mV(\'Psa\',132,17);">Ps 132:17</a>); of placing the shewbread on the table (<a onClick="return mV(\'Exd\',40,4.23);">Ex 40:4,23</a>; <a onClick="return mV(\'Lev\',6,12);">Le 6:12</a>; <a onClick="return mV(\'Lev\',24,8);">24:8</a>; <a onClick="return mV(\'2Ch\',13,11);">2Ch 13:11</a>); of drawing up the battle array (<a onClick="return mV(\'1Ch\',12,38);">1Ch 12:38</a> (Hebrew 39, \'adhar)); and of arranging weapons in order for battle (<a onClick="return mV(\'Jer\',46,3);">Jer 46:3</a>, the American Standard Revised Version "prepare"). As a verb "to order" in the older versions usually has the obsolete sense "to arrange" and not the more usual English meanings, "to demand" or "to direct." Thus: "In the tent of meeting shall Aaron order it" (<a onClick="return mV(\'Lev\',24,4);">Le 24:4</a>, the American Standard Revised Version "keep in order"); "Order ye the buckler and shield" (<a onClick="return mV(\'Jer\',46,3);">Jer 46:3</a>; compare <a onClick="return mV(\'Psa\',119,133);">Ps 119:133</a>; <a onClick="return mV(\'Job\',23,4);">Job 23:4</a>, the American Standard Revised Version "set in order"; Judith 2:16; The <span class="noTag">Wisdom of Solomon 8:1; 15:1</span>; Ecclesiasticus 2:6). The Hebrew pa\'am (literally, "hoof-beat," "occurrence," "repetition") in the plural conveys the idea of an architectural plan (<a onClick="return mV(\'Eze\',41,6);">Eze 41:6</a>). Another word, shalabh, literally, "to join," in connection with the tabernacle, has in some versions been translated as including the idea of orderly arrangement (<a onClick="return mV(\'Exd\',26,17);">Ex 26:17</a>). The word "order" standing by itself may mean orderly or proper arrangement (1Esdras 1:10; The <span class="noTag">Wisdom of Solomon 7:29</span>; 1Macc 6:40; <a onClick="return mV(\'Col\',2,5);">Col 2:5</a>). Akin to the idea of arranging things in a row is that of arranging words (<a onClick="return mV(\'Job\',33,5);">Job 33:5</a>; <a onClick="return mV(\'Job\',37,19);">37:19</a>; <a onClick="return mV(\'Psa\',5,3);">Ps 5:3</a>), of recounting things in order (<a onClick="return mV(\'Isa\',44,7);">Isa 44:7</a>; <a onClick="return mV(\'Luk\',1,1);">Lu 1:1</a> the King James Version (diatassein); <a onClick="return mV(\'Luk\',1,3);">Lu 1:3</a>; <a onClick="return mV(\'Act\',11,4);">Ac 11:4</a> (kathexes)), of setting forth a legal case (<a onClick="return mV(\'Job\',23,4);">Job 23:4</a>; <a onClick="return mV(\'Job\',13,18);">13:18</a>; compare <a onClick="return mV(\'Psa\',50,21);">Ps 50:21</a>). From the idea of arranging in order for the purpose of comparison the Hebrew \'arakh acquires the meaning "to compare" (<a onClick="return mV(\'Isa\',40,18);">Isa 40:18</a>; <a onClick="return mV(\'Psa\',89,7);">Ps 89:7</a>). This is clearly the meaning of \'en \'arokh \'elekha (<a onClick="return mV(\'Psa\',40,5);">Ps 40:5 (Hebrew 6)</a>), where "They cannot be set in order unto thee" must be interpreted to mean "There is nothing that can be compared unto thee."<P>2. Sequence in Time:<P>As the fundamental meaning of \'arakh is arrangement in space, that of cadhar is order or sequence in time. In later Hebrew cedher was used in the sense of "program." In <a onClick="return mV(\'Job\',10,22);">Job 10:22</a> lo\' cedharim, absence of regularity, in the description of the uncertain period that follows death probably means "confusion in time." (The Septuagint (pheggos) suggests, in the place of cedharim, a word for "light," possibly tsohorayim.) In the New Testament we find "order" used of time in connection with the resurrection of the dead (<a onClick="return mV(\'1Cr\',15,23);">1Co 15:23</a> (tagma)) and of a succession of places visited (<a onClick="return mV(\'Act\',18,23);">Ac 18:23</a> (kathexes)). The phrase "in order unto" (<a onClick="return mV(\'Psa\',119,38);">Ps 119:38</a>) expresses causal sequence and hence, purpose.<P>3. Classification and Organization:<P>The idea of classification is present in the Hebrew taqan, translated "set in order," with reference to a collection of proverbs (<a onClick="return mV(\'Ecc\',12,9);">Ec 12:9</a>). The same stem is used with reference to the arranging of singers before the altar (Hebrew Ecclesiasticus 47:9), The classification of priests according to their service is spoken of as "ordering" (<a onClick="return mV(\'1Ch\',24,3,19);">1Ch 24:3,19</a>, Hebrew paqadh). Next to the high priests ranked priests of the second order (mishneh, <a onClick="return mV(\'2Ki\',23,4);">2Ki 23:4</a>; compare <a onClick="return mV(\'2Ki\',25,18);">25:18</a> parallel <a onClick="return mV(\'Jer\',52,24);">Jer 52:24</a>). The related concept of organization is present where the Hebrew kun (literally, "to establish".) is translated "order" (<a onClick="return mV(\'Isa\',9,7);">Isa 9:7</a> the King James Version, "to establish" the American Standard Revised Version; <a onClick="return mV(\'Psa\',119,133);">Ps 119:133</a>; <a onClick="return mV(\'2Ch\',29,35);">2Ch 29:35</a>; compare 1Macc 16:14). A similar use of the term "order" is found in the New Testament in connection with the organization of the affairs of the church (<a onClick="return mV(\'1Cr\',16,1);">1Co 16:1</a> (diatassein); <a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a> (epidiorthoo); <a onClick="return mV(\'1Cr\',11,34);">1Co 11:34</a>).<P>4. Likeness or Manner:<P>"Order," in the sense of likeness or manner, is used in the phrase "after the order of Melchisedek" to translate the Hebrew \'al dibherath, or rather the archaic form \'al dibherathi (<a onClick="return mV(\'Psa\',110,4);">Ps 110:4</a>), which in other passages is translated "because of" (compare <a onClick="return mV(\'Ecc\',3,18);">Ec 3:18</a>; <a onClick="return mV(\'Ecc\',7,14);">7:14</a>; <a onClick="return mV(\'Ecc\',8,2);">8:2</a>). This well-known phrase is rendered in Septuagint kata ten taxin, a translation adopted in <a onClick="return mV(\'Hbr\',5,6,10);">Heb 5:6,10</a>; <a onClick="return mV(\'Hbr\',6,20);">6:20</a>; <a onClick="return mV(\'Hbr\',7,11,17);">7:11,17</a>, where the passage from Psalm is made the basis of an extended argument, in the course of which "order" is taken in the sense of "likeness" (<a onClick="return mV(\'Hbr\',7,16);">Heb 7:16</a>).<P>5. Regulation, Direction, Command:<P>In the sense of regulation, we find "order" as a translation of mishpat (which is literally, "the ruling of a shopheT," whether as a judicial decree or legislative act) in connection with the conduct of priests (<a onClick="return mV(\'1Ch\',6,32);">1Ch 6:32 (Hebrew 17)</a>; <a onClick="return mV(\'2Ch\',30,16);">2Ch 30:16</a>; compare <a onClick="return mV(\'Luk\',1,8);">Lu 1:8</a>; 1Esdras 1:6), and with reference to the Nazirite regulations in the story of Samson (<a onClick="return mV(\'Jdg\',13,12);">Jud 13:12</a>, the Revised Version (British and American) "manner"), church services (<a onClick="return mV(\'1Cr\',14,40);">1Co 14:40</a>) and, in the older English VSS, with reference to other ritual matters (<a onClick="return mV(\'1Ch\',15,13);">1Ch 15:13</a>; <a onClick="return mV(\'1Ch\',23,31);">23:31</a>; <a onClick="return mV(\'2Ch\',8,14);">2Ch 8:14</a>, the American Standard Revised Version "ordinance"). The phrase \'al yadh, literally, "according to the hand of," translated in <a onClick="return mV(\'Ezr\',3,10);">Ezr 3:10</a>; <a onClick="return mV(\'1Ch\',25,2,3,6);">1Ch 25:2b,3,6</a> twice in various ways, means "under the direction of," or "under the order of," as translated in the last instance. The modern sense of "command" is suggested here and in several other instances (1Esdras 8:10; 1Macc 9:55). He "that ordereth his conversation aright" (sam derekh, <a onClick="return mV(\'Psa\',50,23);">Ps 50:23</a>) is probably one who chooses the right path and directs his steps along it. "Who shall order the battle?" (<a onClick="return mV(\'1Ki\',20,14);">1Ki 20:14</a>) is corrected in the American Standard Revised Version: "Who shall begin the battle?" (compare <a onClick="return mV(\'2Ch\',13,3);">2Ch 13:3</a>, Hebrew \'acar, literally, "to bind," hence, "to join" or "begin"; compare proelium committere).<P>6. Declaring of Last Will:<P>The phrase "to set one\'s house in order" (<a onClick="return mV(\'Isa\',38,1);">Isa 38:1</a> parallel <a onClick="return mV(\'2Ki\',20,1);">2Ki 20:1</a>; <a onClick="return mV(\'2Sa\',17,23);">2Sa 17:23</a>), used of Hezekiah and Ahithophel, in contemplation of death, means to give final instructions to one\'s household or to make one\'s will. The Hebrew tsawah used in this phrase is the stem found in the later Hebrew tsawwa\'ah, "a verbal will" (Babha\' Bathra\' 147a, 151b; BDB). Great moral weight was attached in Biblical times to the charges laid upon a household by a deceased father or remoter ancestor, not only as to the disposition of property but also as to personal conduct. (Compare the case of the Rechabites, where the same Hebrew expression is used, tsiwwah \'alenu, <a onClick="return mV(\'Jer\',35,6);">Jer 35:6</a>.)``81';
isbe[6590]='Ordinance`or\'-di-nans:<P>1. Old Testament Use:<P>This word generally represents chuqqah, something prescribed, enactment, usually with reference to matters of ritual. In the King James Version the same word is frequently translated by "statute" or "statutes," which is also the rendering of a similar Hebrew word, namely, choq. the Revised Version (British and American) generally retains "ordinance," but sometimes substitutes "statute" (e.g. <a onClick="return mV(\'Exd\',18,20);">Ex 18:20</a>; <a onClick="return mV(\'Psa\',99,7);">Ps 99:7</a>). In one instance the Revised Version (British and American) renders "set portion" (<a onClick="return mV(\'Eze\',45,14);">Eze 45:14</a>). The word generally has a religious or ceremonial significance. It is used for instance in connection with the Passover (<a onClick="return mV(\'Exd\',12,43);">Ex 12:43</a>; <a onClick="return mV(\'Num\',9,14);">Nu 9:14</a>). According to <a onClick="return mV(\'Exd\',12,14);">Ex 12:14</a>, the Passover was "an ordinance for ever," i.e. a permanent institution. In the plural the word is often employed, along with such terms as commandments, laws, etc., with reference to the different prescriptions of the Deuteronomic and Priestly codes (<a onClick="return mV(\'Deu\',6,1,2);">De 6:1,2</a>; <a onClick="return mV(\'Lev\',18,4);">Le 18:4</a>).<P>In 11 passages (<a onClick="return mV(\'Exd\',15,25);">Ex 15:25</a>; <a onClick="return mV(\'Jos\',24,25);">Jos 24:25</a>; <a onClick="return mV(\'1Sa\',30,25);">1Sa 30:25</a>; <a onClick="return mV(\'2Ki\',17,34,37);">2Ki 17:34,37</a>; <a onClick="return mV(\'2Ch\',33,8);">2Ch 33:8</a>; <a onClick="return mV(\'2Ch\',35,13);">35:13</a>; <a onClick="return mV(\'Psa\',119,91);">Ps 119:91</a>; <a onClick="return mV(\'Isa\',58,2);">Isa 58:2</a> twice; <a onClick="return mV(\'Eze\',11,20);">Eze 11:20</a>) "ordinance" is the rendering of mishpat, judgment, decision or sentence by a judge or ruler. In the Book of the Covenant (<a onClick="return mV(\'Exd\',20,\'22-\');">Ex 20:22-23:33</a>) the term "judgments" denotes civil, as contrasted with ritual, enactments. In <a onClick="return mV(\'2Ki\',17,34);">2Ki 17:34</a> the King James Version employs "manners" and "ordinances" as renderings of this word. In 3 passages (<a onClick="return mV(\'Lev\',18,30);">Le 18:30</a>; <a onClick="return mV(\'Lev\',22,9);">22:9</a>; <a onClick="return mV(\'Mal\',3,14);">Mal 3:14</a>) "ordinance" is the translation of mishmereth, "charge," which the Revised Version (British and American) restores. In one instance (<a onClick="return mV(\'Neh\',10,32);">Ne 10:32</a>) ordinance renders mitswah, "commandment," while in <a onClick="return mV(\'Ezr\',3,10);">Ezr 3:10</a> the King James Version the phrase "after the ordinance of David" represents a Hebrew phrase which literally means "upon the hands of David," i.e. under the guidance or direction of David.<P>2. New Testament Use:<P>In the New Testament, "ordinance" renders different Greek words, namely,<P>(1) dikaioma, in <a onClick="return mV(\'Luk\',1,6);">Lu 1:6</a> and <a onClick="return mV(\'Hbr\',9,1,10);">Heb 9:1,10</a>. The word means literally, "anything declared right"; but in these passages ceremonial and religious regulation;<P>(2) dogma, in <a onClick="return mV(\'Eph\',2,15);">Eph 2:15</a>; <a onClick="return mV(\'Col\',2,14);">Col 2:14</a>. In the New Testament this word always means a decree or edict (<a onClick="return mV(\'Act\',17,7);">Ac 17:7</a>);<P>(3) paradosis, in <a onClick="return mV(\'1Cr\',11,2);">1Co 11:2</a> the King James Version, the Revised Version (British and American) substitutes "traditions";<P>(4) ktisis, "setting up," "institution" in <a onClick="return mV(\'1Pe\',2,13);">1Pe 2:13</a>. The term is used exclusively of the action of God. Peter implies that institutions, apparently human, such as the family and the state, are of divine origin. The same doctrine is found in <a onClick="return mV(\'Rom\',13,1);">Ro 13:1</a>.``103';

isbe[6593]='Oreb`In 2Esdras 2:33 the King James Version for Mt. <a href="./study/isbe/search.html?string=HOREB">HOREB</a> (which see; so the Revised Version (British and American)).``1';
isbe[6594]='Oreb; Zeeb`o\'-reb, ze\'-eb, zeb (\'orebh, "raven," especially "crow"), and (ze\'ebh, "wolf") (<a onClick="return mV(\'Jdg\',7,25);">Jud 7:25</a>; <a onClick="return mV(\'Jdg\',8,3);">8:3</a>; <a onClick="return mV(\'Psa\',83,11);">Ps 83:11</a>, <a onClick="return mV(\'Isa\',10,26);">Isa 10:26</a> (Oreb only)): Two Midianite chieftains captured and beheaded by the Ephraimites, who brought their heads to Gideon.<P>1. Meaning of Names:<P>As to the meaning of the two names, both words are found in Arabic. Robertson Smith, Kinship, etc. (190ff, 218ff), says that the use of the names of animals as names of persons is a relic of totemism. But Noldeke (ZDMG, XL, 160ff) and others hold that such a use shows a desire that those so named should be as disagreeable to their enemies as the plant or animal which the name denoted. Some again (e.g. Stade, Geschichte, 189ff) maintain that the two names here are borrowed from localities and not vice versa, as <a onClick="return mV(\'Jdg\',7,25);">Jud 7:25</a> implies. If so, we must take the names to be originally two places, apparently in Ephraim, for the words "beyond Jordan" in <a onClick="return mV(\'Jdg\',7,25);">7:25</A> contradict <a onClick="return mV(\'Jdg\',8,4);">8:4</A>, where it is said that Gideon came to the Jordan and passed over. Moore (Jgs, 214) suggests that the two localities were near the junction with the Jordan of the stream that comes from Wady Far\'ah. The construction of the Hebrew allows of a translation "the rock (called) Oreb," and "the winepress (called) Zeeb."<P>2. The Battle of Oreb:<P>The account of a battle here is corroborated by <a onClick="return mV(\'Isa\',10,26);">Isa 10:26</a>, a verse which mentions the "rock of Oreb," and suggests that the great defeat of the Midianites took place there (compare <a onClick="return mV(\'Isa\',9,4);">Isa 9:4</a>). The passage in <a onClick="return mV(\'Isa\',10,\'24-26\');">Isa 10:24-26</a> is prose, however, and is said to be late editing (see G.H. Box, Isaiah, 65). In <a onClick="return mV(\'Psa\',83,11);">Ps 83:11 (Hebrew 12)</a> there is a prayer that God would make the "nobles" among the Psalmist\'s enemies as Oreb and Zeeb.``149';
isbe[6595]='Oren`o\'-ren (\'oren; Aram, Alex. Aran): A son of Jerahmeel, the firstborn of Hezron (<a onClick="return mV(\'1Ch\',2,25);">1Ch 2:25</a>).``1';

isbe[6598]='Ornament`or\'-na-ment (\'adhi, "adornment"): In common with all the Orientals, the Hebrews were very fond of wearing ornaments, and their tendency to extravagance of this kind often met with stern prophetic rebuke (<a onClick="return mV(\'Isa\',3,\'16-24\');">Isa 3:16-24</a>; <a onClick="return mV(\'Eze\',13,\'18-20\');">Eze 13:18-20</a>). On this subject, little is said in the New Testament apart from Jesus\' (<a onClick="return mV(\'Luk\',7,25);">Lu 7:25</a>; <a onClick="return mV(\'Luk\',12,23);">12:23</a>) and James\' (<a onClick="return mV(\'Jam\',2,2);">Jas 2:2</a>) invectives against meretricious estimates of moral character. Yet the employment of attractive attire receives sanction in the divine example of <a onClick="return mV(\'Eze\',16,\'10-14\');">Eze 16:10-14</a>.<P>Ornaments in general would include finely embroidered or decorated fabrics, such as the priest\'s dress or the high-priestly attire, and the richly wrought veil, girdle and turban used by the wealthier class. But the term may be limited here to the various rings, bracelets and chains made of precious metals and more or less jeweled (compare <a onClick="return mV(\'Jer\',2,32);">Jer 2:32</a>).<P>These latter, described in detail under their own titles, may be summarized here as finger-rings, particularly prized as seal-rings (<a onClick="return mV(\'Gen\',38,18,25);">Ge 38:18,25</a>; <a onClick="return mV(\'Jer\',22,24);">Jer 22:24</a>); arm-rings or bracelets (<a onClick="return mV(\'Gen\',24,22);">Ge 24:22</a>; <a onClick="return mV(\'2Sa\',1,10);">2Sa 1:10</a>); earrings (<a onClick="return mV(\'Gen\',35,4);">Ge 35:4</a>; <a onClick="return mV(\'Exd\',32,2);">Ex 32:2</a>); noserings (<a onClick="return mV(\'Gen\',24,47);">Ge 24:47</a>; <a onClick="return mV(\'Eze\',16,12);">Eze 16:12</a>); anklets or ankle-chains (<a onClick="return mV(\'Isa\',3,16,18);">Isa 3:16,18</a>); head-bands or fillets or cauls (referred to in <a onClick="return mV(\'Isa\',3,18);">Isa 3:18</a> only), and necklaces or neck-chains (<a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>; <a onClick="return mV(\'Eze\',16,11);">Eze 16:11</a>).<P>Figurative: The universal devotion to ornament among the Orientals is the occasion for frequent Biblical allusions to the beauty and splendor of fine jewelry and attire. But everywhere, in divine injunctions, the emphasis of value is placed upon the beauty of holiness as an inward grace rather than on the attractions of outward ornament (<a onClick="return mV(\'Job\',40,10);">Job 40:10</a>; <a onClick="return mV(\'Psa\',110,3);">Ps 110:3</a>; <a onClick="return mV(\'Joe\',2,13);">Joe 2:13</a>; <a onClick="return mV(\'1Ti\',2,9,10);">1Ti 2:9,10</a>; <a onClick="return mV(\'1Pe\',3,4);">1Pe 3:4</a>). In grievous sorrow, all ornament was to be laid aside in token of mourning (<a onClick="return mV(\'Exd\',33,\'4-6\');">Ex 33:4-6</a>).``41';
isbe[6599]='Ornan`or\'-nan (<a onClick="return mV(\'1Ch\',21,15);">1Ch 21:15</a>).`<a href="./study/isbe/search.html?string=ARAUNAH">ARAUNAH</a>`1';
isbe[6600]='Orpah`or\'-pa (\'orpah; for meaning see below): A Moabitess, wife of Mahlon, son of Elimelech and Naomi. Unlike her sister Ruth she returned to her own people after escorting Naomi on her way to Judah (<a onClick="return mV(\'Rth\',1,4);">Ru 1:4</a>). Her name is supposed to be derived from the Hebrew word for "neck" (\'oreph), and so to mean "stiff-necked" because of her turning-back from following her mother-in-law; others take it to mean "gazelle."``1';
