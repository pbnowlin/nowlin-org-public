isbe[6545]='Olives, Mount of`ol\'-ivz, (har ha-zethim (<a onClick="return mV(\'Zec\',14,4);">Zec 14:4</a>), ma\'aleh ha-zethim, "the ascent of the mount of Olives" (<a onClick="return mV(\'2Sa\',15,30);">2Sa 15:30</a>, the King James Version "the ascent of (mount) Olivet"); to oros ton elaion, "the Mount of Olives" (<a onClick="return mV(\'Mat\',21,1);">Mt 21:1</a>; <a onClick="return mV(\'Mat\',24,3);">24:3</a>; <a onClick="return mV(\'Mat\',26,30);">26:30</a>; <a onClick="return mV(\'Mar\',11,1);">Mr 11:1</a>; <a onClick="return mV(\'Mar\',13,3);">13:3</a>; <a onClick="return mV(\'Mar\',14,26);">14:26</a>; <a onClick="return mV(\'Luk\',19,37);">Lu 19:37</a>; <a onClick="return mV(\'Luk\',22,39);">22:39</a>; <a onClick="return mV(\'Jhn\',8,1);">Joh 8:1</a>), to oros to kaloumenon elaion, "the mount that is called Olivet" (<a onClick="return mV(\'Luk\',19,29);">Lu 19:29</a>; <a onClick="return mV(\'Luk\',21,37);">21:37</a>; in both references in the King James Version "the mount called (the mount) of Olives"), tou elaionos (<a onClick="return mV(\'Act\',1,12);">Ac 1:12</a>, English Versions of the Bible "Olivet" literally, "olive garden")):<P>1. Names<P>2. Situation and Extent<P>3. Old Testament Associations<P class="in15">(1) David\'s Escape from Absalom<P class="in15">(2) The Vision of Ezekiel<P class="in15">(3) The Vision of Zechariah<P>4. High Places<P>5. Olivet and Jesus<P>6. View of the City from Olivet<P>7. Churches and Ecclesiastical Traditions<P>LITERATURE<hr /><P>Olivet comes to us through the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Oliverum, "an oliveyard."<P>1. Names:<P>Josephus frequently uses the expression "Mount of Olives" (e.g. Ant, VII, ix, 2; XX, viii, 6; BJ, V, ii, 3; xii, 2), but later Jewish writings give the name har ha-mishchah, "Mount of Oil"; this occurs in some manuscripts in <a onClick="return mV(\'2Ki\',23,13);">2Ki 23:13</a>, and the common reading har ha-mashchith, "Mount of Corruption," margin "destruction," may possibly be a deliberate alteration (see below). In later ages the Mount was termed "the mountain of lights," because here there used to be kindled at one time the first beacon light to announce throughout Jewry the appearance of the new moon.<P>To the natives of Palestine today it is usually known as Jebel et Tar ("mountain of the elevation," or "tower"), or, less commonly, as Jebel Tur ez zait ("mountain of the elevation of oil"). The name Jebel ez-zaitun ("Mount of Olives") is also well known. Early Arabic writers use the term Tur Zait, "Mount of Oil."<P>2. Situation and Extent:<P>The mountain ridge which lies east of Jerusalem leaves the central range near the valley of Sha\'phat and runs for about 2 miles due south. After culminating in the mountain mass on which lies the "Church of the Ascension," it may be considered as giving off two branches: one lower one, which runs south-southwest, forming the southern side of the Kidron valley, terminating at the Wady en Nar, and another, higher one, which slopes eastward and terminates a little beyond el-\'Azareyeh (modern Bethany). The main ridge is considerably higher than the site of ancient Jerusalem, and still retains a thick cap of the soft chalky limestone, mixed with flint, known variously as Nari and Ka\'kuli, which has been entirely denuded over the Jerusalem site (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM, II, 1</a>). The flints were the cause of a large settlement of paleolithic man which occurred in prehistoric times on the northern end of the ridge, while the soft chalky stone breaks down to form a soil valuable for the cultivation of olives and other trees and shrubs. The one drawback to arboriculture upon this ridge is the strong northwest wind which permanently bends most trees toward the southeast, but affects the sturdy, slow-growing olive less than the quicker-growing pine. The eastern slopes are more sheltered. In respect of wind the Mount of Olives is far more exposed than the site of old Jerusalem.<P>The lofty ridge of Olivet is visible from far, a fact now emphasized by the high Russian tower which can be seen for many scores of miles on the east of the Jordan. The range presents, from such a point of view particularly, a succession of summits. Taking as the northern limit the dip which is crossed by the ancient Anathoth (\'anata) road, the most northerly summit is that now crowned by the house and garden of Sir John Gray Hill, 2,690 ft. above sea-level. This is sometimes incorrectly pointed out as Scopus, which lay farther to the northwest. A second sharp dip in the ridge separates this northern summit from the next, a broad plateau now occupied by the great Kaiserin Augusta Victoria Stiftung and grounds. The road makes a sharp descent into a valley which is traversed from west to east by an important and ancient road from Jerusalem, which runs eastward along the Wady er Rawabeh. South of this dip lies the main mass of the mountain, that known characteristically as the Olivet of ecclesiastical tradition. This mass consists of two principal summits and two subsidiary spurs. The northern of the two main summits is that known as Karem es Sayyad, "the vineyard of the hunter," and also as "Galilee," or, more correctly, as Viri Galilaei (see below, 7). It reaches a height of 2,723 ft. above the Mediterranean and is separated from the southern summit by a narrow neck traversed today by the carriage road. The southern summit, of practically the same elevation, is the traditional "Mount of the Ascension," and for several years has been distinguished by a lofty, though somewhat inartistic, tower erected by the Russians. The two subsidiary spurs referred to above are:<P>(1) a somewhat isolated ridge running southeast, upon which lies the squalid village of el \'Azareyeh—Bethany;<P>(2) a small spur running south, covered with grass, which is known as "the Prophets," on account of a remarkable 4th-century Christian tomb found there, which is known as "the tomb of the Prophets"—a spot much venerated by modern Jews.<P>A further extension of the ridge as Batn el Hawa, "the belly of the wind," or traditionally as "the Mount of Offence" (compare <a onClick="return mV(\'1Ki\',11,7);">1Ki 11:7</a>; <a onClick="return mV(\'2Ki\',23,13);">2Ki 23:13</a>), is usually included in the Mount of Olives, but its lower altitude—it is on a level with the temple-platform—and its position south of the city mark it off as practically a distinct hill. Upon its lower slopes are clustered the houses of Silwan (Siloam).<P>The notices of the Mount of Olives in the Old Testament are, considering its nearness to Jerusalem, remarkably scanty.<P>3. Old Testament Associations:<P>(1) David\'s Escape from Absalom:<P>David fleeing before his rebellious son Absalom (<a onClick="return mV(\'2Sa\',15,16);">2Sa 15:16</a>) crossed the Kidron and "went up by the ascent of the mount of Olives, and wept as he went up; and he had his head covered, and went barefoot: and all the people that were with him covered every man his head, and they went up, weeping as they went (<a onClick="return mV(\'2Sa\',15,30);">2Sa 15:30</a>)....And it came to pass, that, when David was come to the top of the ascent where he was wont to worship God, (m), behold, Hushai the Archite came to meet him with his coat rent, and earth upon his head (<a onClick="return mV(\'2Sa\',15,32);">2Sa 15:32</a>). And when David was a little past the top of the ascent, behold, Ziba the servant of Mephibosheth met him, with a couple of asses saddled, and upon them two hundred loaves of bread, and a hundred clusters of raisins, and a hundred of summer fruits, and a bottle of wine" (<a onClick="return mV(\'2Sa\',16,1);">2Sa 16:1</a>).<P>It is highly probable that David\'s route to the wilderness was neither by the much-trodden Anathoth road nor over the summit of the mountain, but by the path running northeast from the city, which runs between the Viri Galilaei hill and that supporting the German Sanatorium and descends into the wilderness by Wady er Rawabi.<P>See <a href="./study/isbe/search.html?string=BAHURIM">BAHURIM</a>.<P>(2) The Vision of Ezekiel:<P>Ezekiel in a vision (<a onClick="return mV(\'Eze\',11,23);">11:23</A>) saw the glory of Yahweh go up from the midst of the city and stand "upon the mountain which is on the east side of the city" (compare <a onClick="return mV(\'1Ki\',43,2);">43:2</A>). In connection with this the Rabbi Janna records the tradition that the shekhinah stood 3 1/2 years upon Olivet, and preached, saying, "Seek ye the Lord while he may be found, call ye upon him while he is near"—a strange story to come from a Jewish source, suggesting some overt reference to Christ.<P>(3) The Vision of Zechariah:<P>In <a onClick="return mV(\'Zec\',14,4);">Zec 14:4</a> the prophet sees Yahweh in that day stand upon the Mount of Olives, "and the Mount of Olives shall be cleft in the midst thereof toward the east and toward the west, and there shall be a very great valley; and half of the mountain shall remove toward the north, and half of it toward the south."<P>In addition to these direct references, Jewish tradition associates with this mount—this "mount of Corruption"—the rite of the red heifer (<a onClick="return mV(\'Num\',19,\'1-\');">Nu 19</a>); and many authorities consider that this is also the mount referred to in <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>, whence the people are directed to fetch olive branches, branches of wild olive, myrtle branches, palm branches and branches of thick trees to make their booths.<P>4. High Places:<P>It is hardly possible that a spot with such a wide outlook—especially the marvelous view over the Jordan valley and Dead Sea to the lands of Ammon and Moab—should have been neglected in the days when Semitic religion crowned such spots with their sanctuaries. There is Old Testament evidence that there was a "high place" here. In the account of David\'s flight mention is made of the spot on the summit "where he was wont to worship God" (<a onClick="return mV(\'2Sa\',15,32);">2Sa 15:32</a> margin). This is certainly a reference to a sanctuary, and there are strong reasons for believing that this place may have been <a href="./study/isbe/search.html?string=NOB">NOB</a> (which see) (see <a onClick="return mV(\'1Sa\',21,1);">1Sa 21:1</a>; <a onClick="return mV(\'1Sa\',22,9,11,19);">22:9,11,19</a>; <a onClick="return mV(\'Neh\',11,32);">Ne 11:32</a>; but especially <a onClick="return mV(\'Isa\',10,32);">Isa 10:32</a>). This last reference seems to imply a site more commanding in its outlook over the ancient city than Ras el Musharif proposed by Driver, one at least as far south as the Anathoth road, or even that from Wady er Rawabi. But besides this we have the definite statement (<a onClick="return mV(\'1Ki\',11,7);">1Ki 11:7</a>): "Then did Solomon build a high place for Chemosh the abomination of Moab, in the mount that is before (i.e. east of) Jerusalem, and for Molech the abomination of the children of Ammon," and the further account that the "high places that were before (east of) Jerusalem, which were on the right hand (south) of the mount of corruption (margin "destruction") which Solomon the king of Israel had builded for Ashtoreth the abomination of the Sidonians, and for Chemosh the abomination of Moab, and for Milcom the abomination of the children of Ammon, did the king (Josiah) defile" (<a onClick="return mV(\'2Ki\',23,13);">2Ki 23:13</a>). That these high places were somewhere upon what is generally recognized as the Mount of Olives, seems clear, and the most probable site is the main mass where are today the Christian sanctuaries, though Graetz and Dean Stanley favor the summit known as Viri Galilaei. It is the recognition of this which has kept alive the Jewish name "Mount of Corruption" for this mount to this day. The term Mons offensionis, given to the southeastern extension, south of the city, is merely an ecclesiastical tradidition going back to Quaresmius in the 17th century, which is repeated by Burckhardt (1823 AD).<P>5. Olivet and Jesus:<P>More important to us are the New Testament associations of this sacred spot. In those days the mountain must have been far different from its condition today. Titus in his siege of Jerusalem destroyed all the timber here as elsewhere in the environs, but before this the hillsides must have been clothed with verdure—oliveyards, fig orchards and palm groves, with myrtle and other shrubs. Here in the fresh breezes and among the thick foliage, Jesus, the country-bred Galilean, must gladly have taken Himself from the noise and closeness of the over-crowded city. It is to the Passion Week, with the exception of <a onClick="return mV(\'Jhn\',8,1);">Joh 8:1</a>, that all the incidents belong which are expressly mentioned as occurring on the Mount of Olives; while there would be a special reason at this time in the densely packed city, it is probable that on other occasions also our Lord preferred to stay outside the walls. Bethany would indeed appear to have been His home in Judea, as Capernaum was in Galilee. Here we read of Him as staying with Mary and Martha (<a onClick="return mV(\'Luk\',10,\'38-42\');">Lu 10:38-42</a>); again He comes to Bethany from the wilderness road from Jericho for the raising of Lazarus (<a onClick="return mV(\'Jhn\',11,\'1-\');">Joh 11</a>), and later He is at a feast, six days before the Passover (<a onClick="return mV(\'Jhn\',12,1);">Joh 12:1</a>), at the house of Simon (<a onClick="return mV(\'Mat\',26,\'6-12\');">Mt 26:6-12</a>; <a onClick="return mV(\'Mar\',14,\'3-9\');">Mr 14:3-9</a>; <a onClick="return mV(\'Jhn\',12,\'1-9\');">Joh 12:1-9</a>). The Mount of Olives is expressly mentioned in many of the events of the Passion Week. He approached Jerusalem, "unto Bethphage and Bethany, at the mount of Olives" (<a onClick="return mV(\'Mar\',11,1);">Mr 11:1</a>; <a onClick="return mV(\'Mat\',21,1);">Mt 21:1</a>; <a onClick="return mV(\'Luk\',19,29);">Lu 19:29</a>); over a shoulder of this mount—very probably by the route of the present Jericho carriage road—He made His triumphal entry to the city (<a onClick="return mV(\'Mat\',21,\'1-\');">Mt 21</a>; <a onClick="return mV(\'Mar\',11,\'1-\');">Mr 11</a>; <a onClick="return mV(\'Luk\',19,\'1-\');">Lu 19</a>), and on this road, when probably the full sight of the city first burst into view, He wept over Jerusalem (<a onClick="return mV(\'Luk\',19,41);">Lu 19:41</a>). During all that week "every day he was teaching in the temple; and every night he went out, and lodged in the mount that is called Olivet" (<a onClick="return mV(\'Luk\',21,37);">Lu 21:37</a>)—the special part of the mount being Bethany (<a onClick="return mV(\'Mat\',21,17);">Mt 21:17</a>; <a onClick="return mV(\'Mar\',11,11);">Mr 11:11</a>). It was on the road from Bethany that He gave the sign of the withering of the fruitless fig tree (<a onClick="return mV(\'Mat\',21,\'17-19\');">Mt 21:17-19</a>; <a onClick="return mV(\'Mar\',11,\'12-14\');">Mr 11:12-14</a>,<a onClick="return mV(\'Mar\',11,\'20-24\');">20-24</a>), and "as he sat on the mount of Olives" (<a onClick="return mV(\'Mat\',24,3);">Mt 24:3</a>f; <a onClick="return mV(\'Mar\',13,3);">Mr 13:3</a>f) Jesus gave His memorable sermon with the doomed city lying below Him.<P>On the lower slopes of Olivet, in the Garden of Gethsemane (see <a href="./study/isbe/search.html?string=GETHSEMANE">GETHSEMANE</a>), Jesus endured His agony, the betrayal and arrest, while upon one of its higher points—not, as tradition has it, on the inhabited highest summit, but on the secluded eastern slopes "over against Bethany" (<a onClick="return mV(\'Luk\',24,\'50-52\');">Lu 24:50-52</a>)—He took leave of His disciples (compare <a onClick="return mV(\'Act\',1,12);">Ac 1:12</a>).<P>6. View of the City from Olivet:<P>The view of Jerusalem from the Mount of Olives must ever be one of the most striking impressions which any visitor to Jerusalem carries away with him. It has been described countless times. It is today a view but of ruin and departed glory compared with that over which Jesus wept. A modern writer with historic imagination has thus graphically sketched the salient features of that sight:<P>"We are standing on the road from Bethany as it breaks round the Mount of Olives and on looking northwest this is what we see....There spreads a vast stone stage, almost rectangular, some 400 yards. North and south by 300 east and west, held up above Ophel and the Kidron valley by a high and massive wall, from 50 to 150 ft. and more in height, according to the levels of the rock from which it rises. Deep cloisters surround this platform on the inside of the walls....Every gate has its watch and other guards patrol the courts. The crowds, which pour through the south gates upon the platform for the most part keep to the right; the exceptions, turning westward, are excommunicated or in mourning. But the crowd are not all Israelites. Numbers of Gentiles mingle with them; there are costumes and colors from all lands. In the cloisters sit teachers with groups of disciples about them. On the open pavement stand the booths of hucksters and money-changers; and from the north sheep and bullocks are being driven toward the Inner Sanctuary. This lies not in the center of the great platform, but in the northwest corner. It is a separately fortified, oblong enclosure; its high walls with their 9 gates rising from a narrow terrace at a slight elevation above the platform and the terrace encompassed by a fence within which none but Israelites may pass....Upon its higher western end rises a house \'like a lion broad in front and narrow behind.\'...From the open porch of this house stone steps descend to a great block of an altar perpetually smoking with sacrifices....Off the northwest of the Outer Sanctuary a castle (the Antonia) dominates the whole with its 4 lofty towers. Beyond...the Upper City rises in curved tiers like a theater, while all the lower slopes to the south are a crowded mass of houses, girded by the eastern wall of the city. Against that crowded background the sanctuary with its high house gleams white and fresh. But the front of the house, glittering with gold plates, is obscured by a column of smoke rising from the altar; and the Priests\' Court about the latter is colored by the slaughterers and sacrifices—a splash of red, as our imagination takes it, in the center of the prevailing white. At intervals there are bursts of music; the singing of psalms, the clash of cymbals and a great blare of trumpets, at which the people in their court in the Inner Sanctuary fall down and worship" (extracts from G.A. Smith\'s Jerusalem, II, 518-20).<P>7. Churches and Ecclesiastical Traditions:<P>To the Bible student the New Testament is the best guide to Olivet; tradition and "sites" only bewilder him. Once the main hilltop was a mass of churches. There was the "Church of the Ascension" to mark the spot whereby tradition (contrary to the direct statement of Luke) states that the Ascension occurred; now the site is marked by a small octagonal chapel, built in 1834, which is in the hands of the Moslems. There a "footprint of Christ" is shown in the rock. A large basilica of Helena was built over the place where it was said that Christ taught His disciples. In 1869 the Princess de Latour d\'Auvergne, learning that there was a Moslem tradition that this site was at a spot called el Battaniyeh south of the summit, here erected a beautiful church known as the Church of the Pater Noster and around the courtyard she had the Lord\'s Prayer inscribed in 32 languages. When the church was in course of erection certain fragments of old walls and mosaics were found, but, in 1911, as a result of a careful excavation of the site, the foundations of a more extensive mass of old buildings, with some beautiful mosaic in the baptistry, were revealed in the neighborhood; there is little doubt but that these foundations belonged to the actual Basilica of Helena. It is proposed to rebuild the church.<P>Mention has been made of the name Viri Galilaei or Galilee as given to the northern summit of the main mass of Olivet. The name "Mount Galilee" appears to have been first given to this hill early in the 4th century and in 1573 AD Rawolf explains the name by the statement that here was in ancient times a khan where the Galileans lodged who came up to Jerusalem. In 1620 Quaresmius applies the names "Galilee" and Viri Galilaei to this site and thinks the latter name may be due to its having been the spot where the two angels appeared and addressed the disciples as "Ye men of Galilee" (<a onClick="return mV(\'Act\',1,11);">Ac 1:11</a>). Attempts have been made, without much success, to maintain that this "Galilee" was the spot which our Lord intended (<a onClick="return mV(\'Mat\',28,10,16);">Mt 28:10,16</a>) to indicate to His disciples as the place of meeting.<P>The Russian enclosure includes a chapel, a lofty tower—from which a magnificent view is obtainable—a hospice and a pleasant pine grove. Between the Russian buildings to the north and the Church of the Ascension lies the squalid village of et tur, inhabited by a peculiarly turbulent and rapacious crowd of Moslems, who prey upon the passing pilgrims and do much to spoil the sentiment of a visit to this sacred spot. It is possible it may be the original site of <a href="./study/isbe/search.html?string=BETHPHAGE">BETHPHAGE</a> (which see).<P>LITERATURE.<P>PEF, Memoirs, "Jerusalem" volume; G. A. Smith, Jerusalem; Robinson, BRP, I, 1838; Stanley, Sinai and Palestine; Baedeker\'s Palestine and Syria (by Socin and Bensinger); Tobler, Die Siloahquelle und der Oelberg, 1852; Porter, Murray\'s Palestine and Syria; R. Hofmann, Galilaea auf dem Oelberg, Leipzig, 1896; Schick, "The Mount of Olives," PEFS, 1889, 174-84; Warren, article "Mount of Olives," in HDB; Gauthier, in EB, under the word; Vincent (Pere), "The Tombs of the Prophets," Revue Biblique, 1901.``117';

isbe[6547]='Olympas`o-lim\'-pas (Olumpas): The name of a Roman Christian to whom Paul sent greetings (<a onClick="return mV(\'Rom\',16,15);">Ro 16:15</a>). Olympas is an abbreviated form of Olympiadorus. The joining in one salutation of the Christians mentioned in <a onClick="return mV(\'Rom\',16,15);">16:15</A> suggests that they formed by themselves a small community in the earliest Roman church.``1';
isbe[6548]='Olympius`o-lim\'-pi-us (Olumpios): An epithet of <a href="./study/isbe/search.html?string=JUPITER">JUPITER</a> or <a href="./study/isbe/search.html?string=ZEUS">ZEUS</a> (which see) from Mt. Olympus in Thessaly, where the gods held court presided over by Zeus. Antiochus Epiphanes, "who on God\'s altars dansed," insulted the Jewish religion by dedicating the temple of Jerusalem to Jupiter Olympius, 168 BC (2Macc 6:2; 1Macc 1:54ff).``1';

isbe[6550]='Omar`o\'-mar (omar, connected perhaps with \'amar, "speak"; Septuagint Oman or Omar): Grandson of Esau and son of Eliphaz in <a onClick="return mV(\'Gen\',36,11);">Ge 36:11</a>; <a onClick="return mV(\'1Ch\',1,36);">1Ch 1:36</a>; given the title "duke" or "chief" in <a onClick="return mV(\'Gen\',36,15);">Ge 36:15</a>.``1';

isbe[6553]='Omer`o\'-mer (\'omer): A dry measure, the tenth of an ephah, equal to about 7 1/2 pints.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[6554]='Omnipotence`om-nip\'-o-tens:<P>1. Terms and Usage:<P>The noun "omnipotence" is not found in the English Bible, nor any noun exactly corresponding to it in the original Hebrew or Greek<P>The adjective "omnipotent" occurs in <a onClick="return mV(\'Rev\',19,6);">Re 19:6</a> the King James Version; the Greek for this, pantokrator, occurs also in <a onClick="return mV(\'2Cr\',6,18);">2Co 6:18</a>; <a onClick="return mV(\'Rev\',1,8);">Re 1:8</a>; <a onClick="return mV(\'Rev\',4,8);">4:8</a>; <a onClick="return mV(\'Rev\',11,17);">11:17</a>; <a onClick="return mV(\'Rev\',15,3);">15:3</a>; <a onClick="return mV(\'Rev\',16,7,14);">16:7,14</a>; <a onClick="return mV(\'Rev\',19,15);">19:15</a>; <a onClick="return mV(\'Rev\',21,22);">21:22</a> (in all of which the King James Version and the Revised Version (British and American) render "almighty"). It is also found frequently in the Septuagint, especially in the rendering of the divine names Yahweh tsebha\'oth and \'El Shadday. In pantokrator, the element of "authority," "sovereignty," side by side with that of "power," makes itself more distinctly felt than it does to the modern ear in "omnipotent," although it is meant to be included in the latter also. Compare further ho dunatos, in <a onClick="return mV(\'Luk\',1,49);">Lu 1:49</a>.<P>2. Inherent in Old Testament Names of God:<P>The formal conception of omnipotence as worked out in theology does not occur in the Old Testament. The substance of the idea is conveyed in various indirect ways. The notion of "strength" is inherent in the Old Testament conception of God from the beginning, being already represented in one of the two divine names inherited by Israel from ancient Semitic religion, the name \'El. According to one etymology it is also inherent in the other, the name \'Elohim, and in this case the plural form, by bringing out the fullness of power in God, would mark an approach to the idea of omnipotence.<P>In the patriarchal religion the conception of "might" occupies a prominent place, as is indicated by the name characteristic of this period, \'El Shadday; compare <a onClick="return mV(\'Gen\',17,1);">Ge 17:1</a>; <a onClick="return mV(\'Gen\',28,3);">28:3</a>; <a onClick="return mV(\'Gen\',35,11);">35:11</a>; <a onClick="return mV(\'Gen\',43,14);">43:14</a>; <a onClick="return mV(\'Gen\',48,3);">48:3</a>; <a onClick="return mV(\'Gen\',49,24,25);">49:24,25</a>; <a onClick="return mV(\'Exd\',6,3);">Ex 6:3</a>. This name, however, designates the divine power as standing in the service of His covenant-relation to the patriarchs, as transcending Nature and overpowering it in the interests of redemption.<P>Another divine name which signalizes this attribute is Yahweh tsebha\'oth, Yahweh of Hosts. This name, characteristic of the prophetic period, describes God as the King surrounded and followed by the angelic hosts, and since the might of an oriental king is measured by the splendor of his retinue, as of great, incomparable power, the King Omnipotent (<a onClick="return mV(\'Psa\',24,10);">Ps 24:10</a>; <a onClick="return mV(\'Isa\',2,12);">Isa 2:12</a>; <a onClick="return mV(\'Isa\',6,3,5);">6:3,5</a>; <a onClick="return mV(\'Isa\',8,13);">8:13</a>; <a onClick="return mV(\'Jer\',46,18);">Jer 46:18</a>; <a onClick="return mV(\'Mal\',1,14);">Mal 1:14</a>).<P>Still another name expressive of the same idea is \'Abhir, "Strong One," compounded with Jacob or Israel (<a onClick="return mV(\'Gen\',49,24);">Ge 49:24</a>; <a onClick="return mV(\'Psa\',132,2,5);">Ps 132:2,5</a>; <a onClick="return mV(\'Isa\',1,24);">Isa 1:24</a>; <a onClick="return mV(\'Isa\',49,26);">49:26</a>; <a onClick="return mV(\'Isa\',60,16);">60:16</a>). Further, \'El Gibbor, "God-Hero" (<a onClick="return mV(\'Isa\',9,6);">Isa 9:6</a> (of the Messiah); compare for the adjective gibbor, <a onClick="return mV(\'Jer\',20,11);">Jer 20:11</a>); and the figurative designation of God as Tsur, "Rock," occurring especially in the address to God in the Psalter (<a onClick="return mV(\'Isa\',30,29);">Isa 30:29</a>, the King James Version "Mighty One"). The specific energy with which the divine nature operates finds expression also in the name \'El Chay, "Living God," which God bears over against the impotent idols (<a onClick="return mV(\'1Sa\',17,26,36);">1Sa 17:26,36</a>; <a onClick="return mV(\'2Ki\',19,4,16);">2Ki 19:4,16</a>; <a onClick="return mV(\'Psa\',18,46);">Ps 18:46</a>; <a onClick="return mV(\'Jer\',23,36);">Jer 23:36</a>; <a onClick="return mV(\'Dan\',6,20,26);">Da 6:20,26</a>f). An anthropomorphic description of the power of God is in the figures of "hand," His "arm," His "finger."<P>3. Other Modes of Expression:<P>Some of the attributes of Yahweh have an intimate connection with His omnipotence. Under this head especially God\'s nature as Spirit and His holiness come under consideration. The representation of God as Spirit in the Old Testament does not primarily refer to the incorporealness of the divine nature, but to its inherent energy. The physical element underlying the conception of Spirit is that of air in motion, and in this at first not the invisibility but the force forms the point of comparison. The opposite of "Spirit" in this sense is "flesh," which expresses the weakness and impotence of the creature over against God (<a onClick="return mV(\'Isa\',2,22);">Isa 2:22</a>; <a onClick="return mV(\'Isa\',31,3);">31:3</a>).<P>The holiness of God in its earliest and widest sense (not restricted to the ethical sphere) describes the majestic, specifically divine character of His being, that which evokes in man religious awe. It is not a single attribute coordinated with others, but a peculiar aspect under which all the attributes can be viewed, that which renders them distinct from anything analogous in the creature (<a onClick="return mV(\'1Sa\',2,2);">1Sa 2:2</a>; <a onClick="return mV(\'Hsa\',11,9);">Ho 11:9</a>). In this way holiness becomes closely associated with the power of God, indeed sometimes becomes synonymous with divine power equals omnipotence (<a onClick="return mV(\'Exd\',15,11);">Ex 15:11</a>; <a onClick="return mV(\'Num\',20,12);">Nu 20:12</a>), and especially in Ezekiel, where God\'s "holy name" is often equivalent to His renown for power, hence, interchangeable with His "great name" (<a onClick="return mV(\'Eze\',36,\'20-24\');">Eze 36:20-24</a>). The objective Spirit as a distinct hypostasis and the executive of the Godhead on its one side also represents the divine power (<a onClick="return mV(\'Isa\',32,15);">Isa 32:15</a>; <a onClick="return mV(\'Mat\',12,28);">Mt 12:28</a>; <a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>; <a onClick="return mV(\'Luk\',4,14);">4:14</a>; <a onClick="return mV(\'Act\',10,38);">Ac 10:38</a>; <a onClick="return mV(\'Rom\',15,19);">Ro 15:19</a>; <a onClick="return mV(\'1Cr\',2,4);">1Co 2:4</a>).<P>4. Unlimited Extent of the Divine Power:<P>In all these forms of expression a great and specifically divine power is predicated of God. Statements in which the absolutely unlimited extent of this power is explicitly affirmed are rare. The reason, however, lies not in any actual restriction placed on this power, but in the concrete practical form of religious thinking which prevents abstract formulation of the principle. The point to be noticed is that no statement is anywhere made exempting aught from the reach of divine power. Nearest to a general formula come such statements as nothing is "too hard for Yahweh" (<a onClick="return mV(\'Gen\',18,14);">Ge 18:14</a>; <a onClick="return mV(\'Jer\',32,17);">Jer 32:17</a>); or "I know that thou canst do everything?" or "God...hath done whatever he pleased" (<a onClick="return mV(\'Psa\',115,3);">Ps 115:3</a>; <a onClick="return mV(\'Psa\',135,6);">135:6</a>), or, negatively, no one "can hinder" God, in carrying out His purpose (<a onClick="return mV(\'Isa\',43,13);">Isa 43:13</a>), or God\'s hand is not "waxed short" (<a onClick="return mV(\'Num\',11,23);">Nu 11:23</a>); in the New Testament: "With God all things are possible" (<a onClick="return mV(\'Mat\',19,26);">Mt 19:26</a>; <a onClick="return mV(\'Mar\',10,27);">Mr 10:27</a>; <a onClick="return mV(\'Luk\',18,27);">Lu 18:27</a>); "Nothing is impossible with God" (the Revised Version (British and American) "No word from God shall be void of power," <a onClick="return mV(\'Luk\',1,37);">Lu 1:37</a>). Indirectly the omnipotence of God is implied in the effect ascribed to faith (<a onClick="return mV(\'Mat\',17,20);">Mt 17:20</a> "Nothing shall be impossible unto you"; <a onClick="return mV(\'Mar\',9,23);">Mr 9:23</a> "All things are possible to him that believeth"), because faith puts the divine power at the disposal of the believer. On its subjective side the principle of inexhaustible power finds expression in <a onClick="return mV(\'Isa\',40,28);">Isa 40:28</a>: God is not subject to weariness. Because God is conscious of the unlimited extent of His resources nothing is marvelous in His eyes (<a onClick="return mV(\'Zec\',8,6);">Zec 8:6</a>).<P>5. Forms of Manifestation:<P>It is chiefly through its forms of manifestation that the distinctive quality of the divine power which renders it omnipotent becomes apparent. The divine power operates not merely in single concrete acts, but is comprehensively related to the world as such. Both in Nature and history, in creation and in redemption, it produces and controls and directs everything that comes to pass. Nothing in the realm of actual or conceivable things is withdrawn from it (<a onClick="return mV(\'Amo\',9,2,3);">Am 9:2,3</a>; <a onClick="return mV(\'Dan\',4,35);">Da 4:35</a>); even to the minutest and most recondite sequences of cause and effect it extends and masters all details of reality (<a onClick="return mV(\'Mat\',10,30);">Mt 10:30</a>; <a onClick="return mV(\'Luk\',12,7);">Lu 12:7</a>). There is no accident (<a onClick="return mV(\'1Sa\',6,9);">1Sa 6:9</a>; compare with <a onClick="return mV(\'1Sa\',6,12);">1Sa 6:12</a>; <a onClick="return mV(\'Pro\',16,33);">Pr 16:33</a>). It need not operate through second causes; it itself underlies all second causes and makes them what they are.<P>It is creative power producing its effect through a mere word (<a onClick="return mV(\'Gen\',1,3);">Ge 1:3</a>ff; <a onClick="return mV(\'Deu\',8,3);">De 8:3</a>; <a onClick="return mV(\'Psa\',33,9);">Ps 33:9</a>; <a onClick="return mV(\'Rom\',4,17);">Ro 4:17</a>; <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>; <a onClick="return mV(\'Hbr\',11,30);">11:30</a>). Among the prophets, especially Isaiah emphasizes this manner of the working of the divine power in its immediateness and suddenness (<a onClick="return mV(\'Isa\',9,8);">Isa 9:8</a>; <a onClick="return mV(\'Isa\',17,13);">17:13</a>; <a onClick="return mV(\'Isa\',18,\'4-6\');">18:4-6</a>; <a onClick="return mV(\'Isa\',29,5);">29:5</a>). All the processes of nature are ascribed to the causation of Yahweh (<a onClick="return mV(\'Job\',5,9);">Job 5:9</a>ff; <a onClick="return mV(\'Job\',9,5);">9:5</a>ff; <a onClick="return mV(\'Job\',38,\'1-\');">38</a>; <a onClick="return mV(\'Job\',38,\'1-\');"><a onClick="return mV(\'Job\',39,\'1-\');">39</a>; <a onClick="return mV(\'Isa\',40,12);">Isa 40:12</a>ff; <a onClick="return mV(\'Amo\',4,13);">Am 4:13</a>; <a onClick="return mV(\'Amo\',5,8,9);">5:8,9</a>; <a onClick="return mV(\'Amo\',9,5,6);">9:5,6</a>); especially God\'s control of the sea is named as illustrative of this (<a onClick="return mV(\'Psa\',65,7);">Ps 65:7</a>; <a onClick="return mV(\'Psa\',104,9);">104:9</a>; <a onClick="return mV(\'Isa\',50,2);">Isa 50:2</a>; <a onClick="return mV(\'Jer\',5,22);">Jer 5:22</a>; <a onClick="return mV(\'Jer\',31,35);">31:35</a>). The Old Testament seldom says "it rains" (<a onClick="return mV(\'Amo\',4,7);">Am 4:7</a>), but usually God causes it to rain (<a onClick="return mV(\'Lev\',26,4);">Le 26:4</a>; <a onClick="return mV(\'Deu\',11,17);">De 11:17</a>; <a onClick="return mV(\'1Sa\',12,17);">1Sa 12:17</a>; <a onClick="return mV(\'Job\',36,27);">Job 36:27</a>; <a onClick="return mV(\'Psa\',29,\'1-\');">Ps 29</a>; <a onClick="return mV(\'Psa\',65,\'1-\');">65</a>; <a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>; <a onClick="return mV(\'Act\',14,17);">Ac 14:17</a>).<P>The same is true of the processes of history. God sovereignly disposes, not merely of Israel, but of all other nations, even of the most powerful, e.g. the Assyrians, as His instruments for the accomplishment of His purpose (<a onClick="return mV(\'Amo\',1,1);">Am 1</A>-<a onClick="return mV(\'Amo\',2,1,2,3);">2:3</a>; <a onClick="return mV(\'Amo\',9,7);">9:7</a>; <a onClick="return mV(\'Isa\',10,5,15);">Isa 10:5,15</a>; <a onClick="return mV(\'Isa\',28,2);">28:2</a>; <a onClick="return mV(\'Isa\',45,1);">45:1</a>; <a onClick="return mV(\'Jer\',25,9);">Jer 25:9</a>; <a onClick="return mV(\'Jer\',27,6);">27:6</a>; <a onClick="return mV(\'Jer\',43,10);">43:10</a>). The prophets ascribe to Yahweh not merely relatively greater power than to the gods of the nations, but His power extends into the sphere of the nations, and the heathen gods are ignored in the estimate put upon His might (<a onClick="return mV(\'Isa\',31,3);">Isa 31:3</a>).<P>Even more than the sphere of Nature and history, that of redemption reveals the divine omnipotence, from the point of view of the supernatural and miraculous. Thus <a onClick="return mV(\'Exd\',15,\'1-\');">Ex 15</a> celebrates the power of Yahweh in the wonders of the exodus. It is God\'s exclusive prerogative to do wonders (<a onClick="return mV(\'Job\',5,9);">Job 5:9</a>; <a onClick="return mV(\'Job\',9,10);">9:10</a>; <a onClick="return mV(\'Psa\',72,18);">Ps 72:18</a>); He alone can make "a new thing" (<a onClick="return mV(\'Num\',16,30);">Nu 16:30</a>; <a onClick="return mV(\'Isa\',43,19);">Isa 43:19</a>; <a onClick="return mV(\'Jer\',31,22);">Jer 31:22</a>). In the New Testament the great embodiment of this redemptive omnipotence is the resurrection of believers (<a onClick="return mV(\'Mat\',22,29);">Mt 22:29</a>; <a onClick="return mV(\'Mar\',12,24);">Mr 12:24</a>) and specifically the resurrection of Christ (<a onClick="return mV(\'Rom\',4,17,21,24);">Ro 4:17,21,24</a>; <a onClick="return mV(\'Eph\',1,19);">Eph 1:19</a>); but it is evidenced in the whole process of redemption (<a onClick="return mV(\'Mat\',19,26);">Mt 19:26</a>; <a onClick="return mV(\'Mar\',10,27);">Mr 10:27</a>; <a onClick="return mV(\'Rom\',8,31);">Ro 8:31</a>; <a onClick="return mV(\'Eph\',3,7,20);">Eph 3:7,20</a>; <a onClick="return mV(\'1Pe\',1,5);">1Pe 1:5</a>; <a onClick="return mV(\'Rev\',11,17);">Re 11:17</a>).<P>6. Significance for Biblical Religion:<P>The significance of the idea may be traced along two distinct lines. On the one hand the divine omnipotence appears as a support of faith. On the other hand it is productlye of that specifically religious state of consciousness which Scripture calls "the fear of Yahweh." Omnipotence in God is that to which human faith addresses itself. In it lies the ground for assurance that He is able to save, as in His love that He is willing to save (<a onClick="return mV(\'Psa\',65,5,6);">Ps 65:5,6</a>; <a onClick="return mV(\'Psa\',72,18);">72:18</a>; <a onClick="return mV(\'Psa\',118,\'14-16\');">118:14-16</a>; <a onClick="return mV(\'Eph\',3,20);">Eph 3:20</a>).<P>As to the other aspect of its significance, the divine omnipotence in itself, and not merely for soteriological reasons, evokes a specific religious response. This is true, not only of the Old Testament, where the element of the fear of God stands comparatively in the foreground, but remains true also of the New Testament. Even in our Lord\'s teaching the prominence given to the fatherhood and love of God does not preclude that the transcendent majesty of the divine nature, including omnipotence, is kept in full view and made a potent factor in the cultivation of the religious mind (<a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>). The beauty of Jesus\' teaching on the nature of God consists in this, that He keeps the exaltation of God above every creature and His loving condescension toward the creature in perfect equilibrium and makes them mutually fructified by each other. Religion is more than the inclusion of God in the general altruistic movement of the human mind; it is a devotion at every point colored by the consciousness of that divine uniqueness in which God\'s omnipotence occupies a foremost place.<P>LITERATURE.<P>Oehler, Theologie des A T (3),131,139ff; Riehm, Alttestamentliche Theologie, 250ff; Dillmann, Handbuch der alttestamentlichen Theologie, 244; Davidson, Old Testament Theology, 163ff; Konig, Geschichte der alttestamentlichen Religion, 127, 135ff, 391, 475.`<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>; <a href="./study/isbe/search.html?string=GOD">GOD</a>`182';
isbe[6555]='Omnipresence`om-ni-prez\'-ens:<P>1. Non-Occurrence of the Term in Scripture:<P>Neither the noun "omnipresence" nor adjective "omnipresent" occurs in Scripture, but the idea that God is everywhere present is throughout presupposed and sometimes explicitly formulated. God\'s omnipresence is closely related to His omnipotence and omniscience: that He is everywhere enables Him to act everywhere and to know all things, and, conversely, through omnipotent action and omniscient knowledge He has access to all places and all secrets (compare <a onClick="return mV(\'Psa\',139,\'1-\');">Ps 139</a>). Thus conceived, the attribute is but the correlate of the monotheistic conception of God as the Infinite Creator, Preserver and Governor of the universe, immanent in His works as well as transcendent above them.<P>2. Philosophical and Popular Ideas of Omnipresence:<P>The philosophical idea of omnipresence is that of exemption from the limitations of space, subjectively as well as objectively; subjectively, in so far as space, which is a necessary form of all created consciousness in the sphere of sense-perception, is not thus constitutionally inherent in the mind of God; objectively, in so far as the actuality of space-relations in the created world imposes no limit upon the presence and operation of God. This metaphysical conception of transcendence above all space is, of course, foreign to the Bible, which in regard to this, as in regard to the other transcendent attributes, clothes the truth of revelation in popular language, and speaks of exemption from the limitations of space in terms and figures derived from space itself. Thus, the very term "omnipresence" in its two component parts "everywhere" and "present" contains a double inadequacy of expression, both the notion of "everywhere" and that of "presence" being spacial concepts. Another point, in regard to which the popular nature of the Scriptural teaching on this subject must be kept in mind, concerns the mode of the divine omnipresence. In treating the concept philosophically, it is of importance to distinguish between its application to the essence, to the activity, and to the knowledge of God. The Bible does not draw these distinctions in the abstract. Although sometimes it speaks of God\'s omnipresence with reference to the pervasive immanence of His being, it frequently contents itself with affirming the universal extent of God\'s power and knowledge (<a onClick="return mV(\'Deu\',4,39);">De 4:39</a>; <a onClick="return mV(\'Deu\',10,14);">10:14</a>; <a onClick="return mV(\'Psa\',139,\'6-16\');">Ps 139:6-16</a>; <a onClick="return mV(\'Pro\',15,3);">Pr 15:3</a>; <a onClick="return mV(\'Jer\',23,23,24);">Jer 23:23,24</a>; <a onClick="return mV(\'Amo\',9,2);">Am 9:2</a>).<P>3. Theories Denying Omnipresence of Being:<P>This observation has given rise to theories of a mere omnipresence of power or omnipresence by an act of will, as distinct from an omnipresence of being. But it is plain that in this antithetical form such a distinction is foreign to the intent of the Biblical statements in question. The writers in these passages content themselves with describing the practical effects of the attribute without reflecting upon the difference between this and its ontological aspect; the latter is neither affirmed nor denied. That no denial of the omnipresence of being is intended may be seen from <a onClick="return mV(\'Jer\',23,24);">Jer 23:24</a>, where in the former half of the verse the omnipresence of <a onClick="return mV(\'Jer\',23,23);">23:23</A> is expressed in terms of omniscience, while in the latter half the idea finds ontological expression. Similarly, in <a onClick="return mV(\'Psa\',139,\'1-\');">Ps 139</a>, compare verse <a onClick="return mV(\'Psa\',139,2);">2</A> with verses <a onClick="return mV(\'Psa\',139,7);">7</A>ff, and verses <a onClick="return mV(\'Psa\',139,13);">13</A>ff. As here, so in other passages the presence of God with His being in all space is explicitly affirmed (<a onClick="return mV(\'1Ki\',8,27);">1Ki 8:27</a>; <a onClick="return mV(\'2Ch\',2,6);">2Ch 2:6</a>; <a onClick="return mV(\'Isa\',66,1);">Isa 66:1</a>; <a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>).<P>4. Denial of the Presence of the Idea in the Earlier Parts of the Old Testament:<P>Omnipresence being the correlate of monotheism, the presence of the idea in the earlier parts of the Old Testament is denied by all those who assign the development of monotheism in the Old Testament religion to the prophetic period from the 8th century onward. It is undoubtedly true that the earliest narratives speak very anthropomorphically of God\'s relation to space; they describe Him as coming and going in language such as might be used of a human person. But it does not follow from this that the writers who do so conceive of God\'s being as circumscribed by space. Where such forms of statement occur, not the presence of God in general, but His visible presence in theophany is referred to. If from the local element entering into the description God\'s subjection to the limitations of space were inferred, then one might with equal warrant, on the basis of the physical, sensual elements entering into the representation, impute to the writers the view that the divine nature is corporeal.<P>5. The Special Redemptive and Revelatory Presence of God:<P>The theophanic form of appearance does not disclose what God is ontologically in Himself, but merely how He condescends to appear and work for the redemption of His people. It establishes a redemptive and revelatory presence in definite localities, which does not, in the mind of the writer, detract from the divine omnipresence. Hence, it is not confined to one place; the altars built in recognition of it are in patriarchal history erected in several places and coexist as each and all offering access to the special divine presence. It is significant that already during the patriarchal period these theophanies and the altars connected with them are confined to the Holy Land. This shows that the idea embodied in them has nothing to do with a crude conception of the Deity as locally circumscribed, but marks the beginning of that gradual restoration of the gracious presence of God to fallen humanity, the completion of which forms the goal of redemption. Thus, God is said to dwell in the ark, in the tabernacle, on Mt. Zion (<a onClick="return mV(\'Num\',10,35);">Nu 10:35</a>; <a onClick="return mV(\'2Sa\',6,2);">2Sa 6:2</a>; <a onClick="return mV(\'2Ki\',19,15);">2Ki 19:15</a>; <a onClick="return mV(\'Psa\',3,4);">Ps 3:4</a>; <a onClick="return mV(\'Psa\',99,1);">99:1</a>); in the temple (<a onClick="return mV(\'1Ki\',8,\'1-\');">1Ki 8</a>; <a onClick="return mV(\'Psa\',20,2);">Ps 20:2</a>; <a onClick="return mV(\'Psa\',26,8);">26:8</a>; <a onClick="return mV(\'Psa\',46,5);">46:5</a>; <a onClick="return mV(\'Psa\',48,2);">48:2</a>; <a onClick="return mV(\'Isa\',8,18);">Isa 8:18</a>; <a onClick="return mV(\'Joe\',3,16,21);">Joe 3:16,21</a>; <a onClick="return mV(\'Amo\',1,2);">Am 1:2</a>); in the Holy Land (<a onClick="return mV(\'1Sa\',26,19);">1Sa 26:19</a>; <a onClick="return mV(\'Hsa\',9,3);">Ho 9:3</a>); in Christ (<a onClick="return mV(\'Jhn\',1,14);">Joh 1:14</a>; <a onClick="return mV(\'Jhn\',2,19);">2:19</a>; <a onClick="return mV(\'Col\',2,9);">Col 2:9</a>); in the church (<a onClick="return mV(\'Jhn\',14,23);">Joh 14:23</a>; <a onClick="return mV(\'Rom\',8,9,9);">Ro 8:9,11</a>; <a onClick="return mV(\'1Cr\',3,16);">1Co 3:16</a>; <a onClick="return mV(\'1Cr\',6,19);">6:19</a>; <a onClick="return mV(\'Eph\',2,21,22);">Eph 2:21,22</a>; <a onClick="return mV(\'Eph\',3,11);">3:11</a>; <a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a>; <a onClick="return mV(\'Hbr\',10,21);">Heb 10:21</a>; <a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>); in the eschatological assembly of His people (<a onClick="return mV(\'Rev\',21,3);">Re 21:3</a>). In the light of the same principle must be interpreted the presence of God in heaven. This also is not to be understood as an ontological presence, but as a presence of specific theocratic manifestation (<a onClick="return mV(\'1Ki\',8,27);">1Ki 8:27</a>; <a onClick="return mV(\'Psa\',2,4);">Ps 2:4</a>; <a onClick="return mV(\'Psa\',11,4);">11:4</a>; <a onClick="return mV(\'Psa\',33,13);">33:13</a>ff; <a onClick="return mV(\'Psa\',104,3);">104:3</a>; <a onClick="return mV(\'Isa\',6,1);">Isa 6:1</a>ff; <a onClick="return mV(\'Isa\',63,15);">63:15</a>; <a onClick="return mV(\'Isa\',66,1);">66:1</a>; <a onClick="return mV(\'Hab\',2,20);">Hab 2:20</a>; <a onClick="return mV(\'Mat\',5,34);">Mt 5:34</a>; <a onClick="return mV(\'Mat\',6,9);">6:9</a>; <a onClick="return mV(\'Act\',7,48);">Ac 7:48</a>; <a onClick="return mV(\'Act\',17,28);">17:28</a>; <a onClick="return mV(\'Eph\',1,20);">Eph 1:20</a>; <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>). How little this is meant to exclude the presence of God elsewhere may be seen from the fact that the two representations, that of God\'s self-manifestation in heaven and in the earthly sanctuary, occur side by side (<a onClick="return mV(\'1Ki\',8,\'26-53\');">1Ki 8:26-53</a>; <a onClick="return mV(\'Psa\',20,\'2-6\');">Ps 20:2-6</a>; <a onClick="return mV(\'Amo\',9,6);">Am 9:6</a>). It has been alleged that the idea of God\'s dwelling in heaven marks a comparatively late attainment in the religion of Israel, of which in the pre-prophetic period no trace can as yet be discovered (so Stade, Bibl. Theol. des Altes Testament, I, 103, 104). There are, however, a number of passages in the Pentateuch bearing witness to the early existence of this belief (<a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a>; <a onClick="return mV(\'Gen\',19,24);">19:24</a>; <a onClick="return mV(\'Gen\',21,17);">21:17</a>; <a onClick="return mV(\'Gen\',22,11);">22:11</a>; <a onClick="return mV(\'Gen\',28,12);">28:12</a>). Yahweh comes, according to the belief of the earliest period, with the clouds (<a onClick="return mV(\'Exd\',14,19,20);">Ex 14:19,20</a>; <a onClick="return mV(\'Exd\',19,9,18);">19:9,18</a>; <a onClick="return mV(\'Exd\',24,15);">24:15</a>; <a onClick="return mV(\'Num\',11,25);">Nu 11:25</a>; <a onClick="return mV(\'Num\',12,5);">12:5</a>). That even in the opinion of the people Yahweh\'s local presence in an earthly sanctuary need not have excluded Him from heaven follows also from the unhesitating belief in His simultaneous presence in a plurality of sanctuaries. If it was not a question of locally circumscribed presence as between sanctuary and sanctuary, it need not have been as between earth and heaven (compare Gunkel, Genesis, 157).<P>6. Religious Significance:<P>Both from a generally religious and from a specifically soteriological point of view the omnipresence of God is of great practical importance for the religious life. In the former respect it contains the guaranty that the actual nearness of God and a real communion with Him may be enjoyed everywhere, even apart from the places hallowed for such purpose by a specific gracious self-manifestation (<a onClick="return mV(\'Psa\',139,\'5-10\');">Ps 139:5-10</a>). In the other respect the divine omnipresence assures the believer that God is at hand to save in every place where from any danger or foe His people need salvation (<a onClick="return mV(\'Isa\',43,2);">Isa 43:2</a>).<P>LITERATURE.<P>Oehler, Theologie des A T (3), 174ff; Riehm, Alttestamentliche Theologie, 262ff; Dillmann, Handbuch der alttestamentlichen Theologie, 246ff; Davidson, Old Testament Theology, 180ff; Konig, Geschichte der alttestamentlichen Religion, 197ff.``182';
isbe[6556]='Omniscience`om-nish\'-ens: The term does not occur in Scripture, either in its nominal or in its adjectival form.<P>1. Words and Usage:<P>In the Old Testament it is expressed in connection with such words as da\'ath, binah, tebhunah, chokhmah; also "seeing" and "hearing," "the eye" and "the ear" occur as figures for the knowledge of God, as "arm," "hand," "finger" serve to express His power. In the New Testament are found ginoskein, gnosis, eidenai, sophia, in the same connections.<P>2. Tacit Assumption and Explicit Affirmation:<P>Scripture everywhere teaches the absolute universality of the divine knowledge. In the historical books, although there is no abstract formula, and occasional anthropomorphic references to God\'staking knowledge of things occur (<a onClick="return mV(\'Gen\',11,5);">Ge 11:5</a>; <a onClick="return mV(\'Gen\',18,21);">18:21</a>; <a onClick="return mV(\'Deu\',8,3);">De 8:3</a>), none the less the principle is everywhere presupposed in what is related about God\'s cognizance of the doings of man, about the hearing of prayer, the disclosing of the future (<a onClick="return mV(\'1Sa\',16,7);">1Sa 16:7</a>; <a onClick="return mV(\'1Sa\',23,\'9-12\');">23:9-12</a>; <a onClick="return mV(\'1Ki\',8,39);">1Ki 8:39</a>; <a onClick="return mV(\'2Ch\',16,9);">2Ch 16:9</a>). Explicit affirmation of the principle is made in the Psalter, the Prophets, the chokhmah literature and in the New Testament. This is due to the increased internalizing of religion, by which its hidden side, to which the divine omniscience corresponds, receives greater emphasis (<a onClick="return mV(\'Job\',26,6);">Job 26:6</a>; <a onClick="return mV(\'Job\',28,24);">28:24</a>; <a onClick="return mV(\'Job\',34,22);">34:22</a>; <a onClick="return mV(\'Psa\',139,12);">Ps 139:12</a>; <a onClick="return mV(\'Psa\',147,4);">147:4</a>; <a onClick="return mV(\'Pro\',15,3,11);">Pr 15:3,11</a>; <a onClick="return mV(\'Isa\',40,26);">Isa 40:26</a>; <a onClick="return mV(\'Act\',1,24);">Ac 1:24</a>; <a onClick="return mV(\'Hbr\',4,13);">Heb 4:13</a>; <a onClick="return mV(\'Rev\',2,23);">Re 2:23</a>).<P>3. Extends to All Spheres:<P>This absolute universality is affirmed with reference to the various categories that comprise within themselves all that is possible or actual. It extends to God\'s own being, as well as to what exists outside of Him in the created world. God has perfect possession in consciousness of His own being. The unconscious finds no place in Him (<a onClick="return mV(\'Act\',15,18);">Ac 15:18</a>; <a onClick="return mV(\'1Jo\',1,5);">1Joh 1:5</a>). Next to Himself God knows the world in its totality. This knowledge extends to small as well as to great affairs (<a onClick="return mV(\'Mat\',6,8.32);">Mt 6:8,32</a>; <a onClick="return mV(\'Mat\',10,30);">10:30</a>); to the hidden heart and mind of man as well as to that which is open and manifest (<a onClick="return mV(\'Job\',11,11);">Job 11:11</a>; <a onClick="return mV(\'Job\',34,21,23);">34:21,23</a>; <a onClick="return mV(\'Psa\',14,2);">Ps 14:2</a>; <a onClick="return mV(\'Psa\',17,2);">17:2</a>ff; <a onClick="return mV(\'Psa\',33,\'13-18\');">33:13-18</a>; <a onClick="return mV(\'Psa\',102,19);">102:19</a>f; <a onClick="return mV(\'Psa\',139,\'1-4\');">139:1-4</a>; <a onClick="return mV(\'Pro\',5,21);">Pr 5:21</a>; <a onClick="return mV(\'Pro\',15,3);">15:3</a>; <a onClick="return mV(\'Isa\',29,15);">Isa 29:15</a>; <a onClick="return mV(\'Jer\',17,10);">Jer 17:10</a>; <a onClick="return mV(\'Amo\',4,13);">Am 4:13</a>; <a onClick="return mV(\'Luk\',16,15);">Lu 16:15</a>; <a onClick="return mV(\'Act\',1,24);">Ac 1:24</a>; <a onClick="return mV(\'1Th\',2,4);">1Th 2:4</a>; <a onClick="return mV(\'Hbr\',4,13);">Heb 4:13</a>; <a onClick="return mV(\'Rev\',2,23);">Re 2:23</a>). It extends to all the divisions of time, the past, present and future alike (<a onClick="return mV(\'Job\',14,17);">Job 14:17</a>; <a onClick="return mV(\'Psa\',56,8);">Ps 56:8</a>; <a onClick="return mV(\'Isa\',41,\'22-24\');">Isa 41:22-24</a>; <a onClick="return mV(\'Isa\',44,\'6-8\');">44:6-8</a>; <a onClick="return mV(\'Jer\',1,5);">Jer 1:5</a>; <a onClick="return mV(\'Hsa\',13,12);">Ho 13:12</a>; <a onClick="return mV(\'Mal\',3,16);">Mal 3:16</a>). It embraces that which is contingent from the human viewpoint as well as that which is certain (<a onClick="return mV(\'1Sa\',23,\'9-12\');">1Sa 23:9-12</a>; <a onClick="return mV(\'Mat\',11,22,23);">Mt 11:22,23</a>).<P>4. Mode of the Divine Knowledge:<P>Scripture brings God\'s knowledge into connection with His omnipresence. <a onClick="return mV(\'Psa\',139,\'1-\');">Ps 139</a> is the clearest expression of this. Omniscience is the omnipresence of cognition (<a onClick="return mV(\'Jer\',23,23);">Jer 23:23</a>). It is also closely related to God\'s eternity, for the latter makes Him in His knowledge independent of the limitations of time (<a onClick="return mV(\'Isa\',43,\'8-12\');">Isa 43:8-12</a>). God\'s creative relation to all that exists is represented as underlying His omniscience (<a onClick="return mV(\'Psa\',33,15);">Ps 33:15</a>; <a onClick="return mV(\'Psa\',97,9);">97:9</a>; <a onClick="return mV(\'Psa\',139,13);">139:13</a>; <a onClick="return mV(\'Isa\',29,15);">Isa 29:15</a>). His all-comprehensive purpose forms the basis of His knowledge of all events and developments (<a onClick="return mV(\'Isa\',41,\'22-27\');">Isa 41:22-27</a>; <a onClick="return mV(\'Amo\',3,7);">Am 3:7</a>).<P>This, however, does not mean that God\'s knowledge of things is identical with His creation of them, as has been suggested by Augustine and others. The act of creation, while necessarily connected with the knowledge of that which is to be actual, is not identical with such knowledge or with the purpose on which such knowledge rests, for in God, as well as in man, the intellect and the will are distinct faculties. In the last analysis, God\'s knowledge of the world has its source in His self-knowledge. The world is a revelation of God. All that is actual or possible in it therefore is a reflection in created form of what exists uncreated in God, and thus the knowledge of the one becomes a reproduction of the knowledge of the other (<a onClick="return mV(\'Act\',17,27);">Ac 17:27</a>; <a onClick="return mV(\'Rom\',1,20);">Ro 1:20</a>). The divine knowledge of the world also partakes of the quality of the divine self-knowledge in this respect, that it is never dormant. God does not depend for embracing the multitude and complexity of the existing world on such mental processes as abstraction and generalization.<P>The Bible nowhere represents Him as attaining to knowledge by reasoning, but everywhere as simply knowing. From what has been said about the immanent sources of the divine knowledge, it follows that the latter is not a posteriori derived from its objects, as all human knowledge based on experience is, but is exercised without receptivity or dependence. In knowing, as well as in all other activities of His nature, God is sovereign and self-sufficient. In cognizing the reality of all things He needs not wait upon the things, but draws His knowledge directly from the basis of reality as it lies in Himself. While the two are thus closely connected it is nevertheless of importance to distinguish between God\'s knowledge of Himself and God\'s knowledge of the world, and also between His knowledge of the actual and His knowledge of the possible. These distinctions mark off theistic conception of omniscience from the pantheistic idea regarding it. God is not bound up in His life with the world in such a sense as to have no scope of activity beyond it.<P>5. God\'s Omniscience and Human Freewill:<P>Since Scripture includes in the objects of the divine knowledge also the issue of the exercise of freewill on the part of man, the problem arises, how the contingent character of such decisions and the certainty of the divine knowledge can coexist. It is true that the knowledge of God and the purposing will of God are distinct, and that not the former but the latter determines the certainty of the outcome. Consequently the divine omniscience in such cases adds or detracts nothing in regard to the certainty of the event. God\'s omniscience does not produce but presupposes the certainty by which the problem is raised. At the same time, precisely because omniscience presupposes certainty, it appears to exclude every conception of contingency in the free acts of man, such as would render the latter in their very essence undetermined. The knowledge of the issue must have a fixed point of certainty to terminate upon, if it is to be knowledge at all. Those who make the essence of freedom absolute indeterminateness must, therefore, exempt this class of events from the scope of the divine omniscience. But this is contrary to all the testimony of Scripture, which distinctly makes God\'s absolute knowledge extend to such acts (<a onClick="return mV(\'Act\',2,23);">Ac 2:23</a>). It has been attempted to construe a peculiar form of the divine knowledge, which would relate to this class of acts specifically, the so-called scientia media, to be distinguished from the scientia necessaria, which has for its object God Himself, and the scientia libera which terminates upon the certainties of the world outside of God, as determined by His freewill. This scientia media would then be based on God\'s foresight of the outcome of the free choice of man. It would involve a knowledge of receptivity, a contribution to the sum total of what God knows derived from observation on His part of the world-process. That is to say, it would be knowledge a posteriori in essence, although not in point of time. It is, however, difficult to see how such a knowledge can be possible in God, when the outcome is psychologically undetermined and undeterminable. The knowledge could originate no sooner than the determination originates through the free decision of man. It would, therefore, necessarily become an a posteriori knowledge in time as well as in essence. The appeal to God\'s eternity as bringing Him equally near to the future as to the present and enabling Him to see the future decisions of man\'s free will as though they were present cannot remove this difficulty, for when once the observation and knowledge of God are made dependent on any temporal issue, the divine eternity itself is thereby virtually denied. Nothing remains but to recognize that God\'s eternal knowledge of the outcome of the freewill choices of man implies that there enters into these choices, notwithstanding their free character, an element of predetermination, to which the knowledge of God can attach itself.<P>6. Religious Importance:<P>The divine omniscience is most important for the religious life. The very essence of religion as communion with God depends on His all-comprehensive cognizance of the life of man at every moment. Hence, it is characteristic of the irreligious to deny the omniscience of God (<a onClick="return mV(\'Psa\',10,11,12);">Ps 10:11,12</a>; <a onClick="return mV(\'Psa\',94,\'7-9\');">94:7-9</a>; <a onClick="return mV(\'Isa\',29,15);">Isa 29:15</a>; <a onClick="return mV(\'Jer\',23,23);">Jer 23:23</a>; <a onClick="return mV(\'Eze\',8,12);">Eze 8:12</a>; <a onClick="return mV(\'Eze\',9,9);">9:9</a>). Especially along three lines this fundamental religious importance reveals itself:<P>(a) it lends support and comfort when the pious suffer from the misunderstanding and misrepresentation of men;<P>(b) it acts as a deterrent to those tempted by sin, especially secret sin, and becomes a judging principle to all hypocrisy and false security;<P>(c) it furnishes the source from which man\'s desire for self-knowledge can obtain satisfaction (<a onClick="return mV(\'Psa\',19,12);">Ps 19:12</a>; <a onClick="return mV(\'Psa\',51,6);">51:6</a>; <a onClick="return mV(\'Psa\',139,23,24);">139:23,24</a>).<P>LITERATURE.<P>Oehler, Theologie des A T (3), 876; Riehm, Alttestamentliche Theologie, 263; Dillmann, Handbuch der alttestamentlichen Theologie, 249; Davidson, Old Testament Theology, 180 if.``125';
isbe[6557]='Omri`om\'-ri (\'omri; Septuagint Ambri; Assyrian "Chumri" and "Chumria"):<P>(1) The 6th king of Northern Israel, and founder of the IIIrd Dynasty which reigned for nearly 50 years. Omri reigned 12 years, circa 887-876 BC. The historical sources of his reign are contained in <a onClick="return mV(\'1Ki\',16,\'15-28\');">1Ki 16:15-28</a>; <a onClick="return mV(\'1Ki\',20,34);">20:34</a>, the Moabite Stone, Assyrian inscriptions, and in the published accounts of recent excavations in Samaria. In spite of the brief passage given to Omri in the Old Testament, he was one of the most important of the military kings of Northern Israel.<P>1. His Accession:<P>Omri is first mentioned as an officer in the army of Elah, which was engaged in the siege of the Philistine town of Gibbethon. While Omri was thus engaged, Zimri, another officer of Elah\'s army, conspired against the king, whom he assassinated in a drunken debauch, exterminating at the same time the remnant of the house of Baasha. The conspiracy evidently lacked the support of the people, for the report that Zimri had usurped the throne no sooner reached the army at Gibbethon, than the people proclaimed Omri, the more powerful military leader, king over Israel. Omri lost not a moment, but leaving Gibbethon in the hands of the Philistines, he marched to Tirzah, which he besieged and captured, while Zimri perished in the flames of the palace to which he had set fire with his own hands (<a onClick="return mV(\'1Ki\',16,18);">1Ki 16:18</a>). Omri, however, had still another opponent in Tibni the son of Ginath, who laid claim to the throne and who was supported in his claims by his brother Joram (<a onClick="return mV(\'1Ki\',16,22);">1Ki 16:22</a> Septuagint) and by a large number of the people. Civil war-followed this rivalry for the throne, which seems to have lasted for a period of four years (compare <a onClick="return mV(\'1Ki\',16,15);">1Ki 16:15</a>, with <a onClick="return mV(\'1Ki\',16,23);">16:23</A> and <a onClick="return mV(\'1Ki\',16,29);">29</A>) before Omri gained full control.<P>Omri\'s military ability is seen from his choice of Samaria as the royal residence and capital of the Northern Kingdom. This step may have been suggested to Omri by his own easy conquest of Tirzah, the former capital. Accordingly, he purchased the hill Shomeron of Shemer for two talents of silver, about $4,352.00 in American money (1915). The conical hill, which rose from the surrounding plain to the height of 400 ft., and on the top of which there was room for a large city, was capable of easy defense.<P>2. The Founding of Samaria:<P>The superior strategic importance of Samaria is evidenced by the sieges it endured repeatedly by the Syrians and Assyrians. It was finally taken by Sargon in 722, after the siege had lasted for 3 years. That the Northern Kingdom endured as long as it did was due largely to the strength of its capital. With the fall of Samaria, the nation fell.<P>Recent excavations in Samaria under the direction of Harvard University throw new light upon the ancient capital of Israel. The first results were the uncovering of massive foundation walls of a large building, including a stairway 80 ft. wide. This building, which is Roman in architecture, is supposed to have been a temple, the work of Herod. Under this Roman building was recovered a part of a massive Hebrew structure, believed to be the palace of Omri and Ahab. During the year 1910 the explorations revealed a building covering 1 1/2 acres of ground. Four periods of construction were recognized, which, on archaeological grounds, were tentatively assigned to the reigns of Omri, Ahab, Jehu, and Jeroboam II. See <a href="./study/isbe/search.html?string=SAMAIAS">SAMAIAS</a> and articles by David G. Lyon in Harvard Theological Review, IV, 1911; JBL, V, xxx, Part I, 1911; PEFS, 1911, 79-83.<P>3. His Foreign Policy:<P>Concerning Omri\'s foreign policy the Old Testament is silent beyond a single hint contained in <a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>. Here we learn that he had to bow before the stronger power of Syria. It is probable that Ben-hadad I besieged Samaria shortly after it was built, for he forced Omri to make "streets" in the city for the Syrians. It is probable, too, that at this time Ramoth-gilead was lost to the Syrians. Evidently Omri, was weakened in his foreign policy at the beginning of his reign by the civil conflict engendered by his accession. However, he showed strength of character in his dealings with foreign powers. At least he regained control over the northern part of Moab, as we learn from the Moabite Stone. Lines 4-8 tell us that "Omri was king of Israel and afflicted Moab many days because Chemosh was angry with his land....Omri obtained possession of the land of Medeba and dwelt therein during his days and half the days of his son, forty years. "<P>Omri was the first king of Israel to pay tribute to the Assyrians under their king Asurnacirpal III, in 876 BC. From the days of Shalmaneser II (860 BC) down to the time of Sargon (722 BC), Northern Israel was known to the Assyrians as "the land of the house of Omri." On Shalmaneser\'s black obelisk, Jehu, who overthrew the dynasty of Omri, is called Ja\'uaabal Chumri, "Jehu son of Omri."<P>Omri entered into an alliance with the Phoenicians by the marriage of his son Ahab to Jezebel, daughter of Ethbaal, king of the Sidonians. This may have been done as protection against the powers from the East, and as such would have seemed to be a wise political move, but it was one fraught with evil for Israel.<P>4. His Religious Influence and Death:<P>Although Omri laid the foundation of a strong kingdom, he failed to impart to it the vitalizing and rejuvenating force of a healthy spiritual religion. The testimony of <a onClick="return mV(\'1Ki\',16,25,26);">1Ki 16:25,26</a>, that he "dealt wickedly above all that were before him," coupled with the reference to "the statutes of Omri" in <a onClick="return mV(\'Mic\',6,16);">Mic 6:16</a>, indicates that he may have had a share in substituting foreign religions for the worship of Yahweh, and therefore the unfavorable light in which he is regarded is justified. Upon his death, Omri was succeeded upon the throne by his son Ahab, to whom was left the task of shaking off the Syrian yoke, and who went beyond his father in making the Phoenician influence along with Baalism of prime importance in Israel, thus leading the nation into the paths that hastened its downfall.<P>(2) A Benjamite, son of Becher (<a onClick="return mV(\'1Ch\',7,8);">1Ch 7:8</a>).<P>(3) A Judahite, descendant of Perez, who lived at Jerusalem (<a onClick="return mV(\'1Ch\',9,4);">1Ch 9:4</a>).<P>(4) A prince of Issachar in the time of David (<a onClick="return mV(\'1Ch\',27,18);">1Ch 27:18</a>).``1';
isbe[6558]='On (1)`on (\'on; Egyptian An, Ant, Annu, probably pronounced An only, as this is often all that is written, a "stone" or "stone pillars"): Later called Hellopolis. The name On occurs only in <a onClick="return mV(\'Gen\',41,45,50);">Ge 41:45,50</a>; <a onClick="return mV(\'Gen\',46,20);">46:20</a>. It occurs in one other place in the Septuagint (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>), where On is mentioned with Pithom and Raamses as strong cities which the Israelites built. Hebrew slaves may have worked upon fortifications here, but certainly did not build the city. On is possibly referred to as \'ir ha-herec, in <a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a> (see <a href="./study/isbe/search.html?string=IR-HA-HERES">IR-HA-HERES</A>). On may also be mentioned by Jeremiah (<a onClick="return mV(\'Jer\',43,13);">43:13</a>) under the name Beth-shemesh. Ezekiel speaks of an Aven (\'awen) (<a onClick="return mV(\'Eze\',30,17);">Eze 30:17</a>), where it is mentioned with Pibeseth (Bubastis). Aven in this passage is almost certainly the same as On in <a onClick="return mV(\'Gen\',41,45);">Ge 41:45</a>; <a onClick="return mV(\'Gen\',46,20);">46:20</a>, as the letters of both words are the same in the Hebrew. Only the placing of the vowel-points makes any difference. If there is a mistake, it is a mistake of the Massoretes, not of the Hebrew writer.<P>1. Location and Description:<P>There were two Ons in Egypt: one in Upper Egypt, An-res (Hermonthis); the other in Lower Egypt, An-Meheet (Brugsch, Geogr. Inschr., 254, 255, numbers 1217, a, b,1218, 8708, 1225). The latter is the On referred to in the Bible. It lay about 20 miles north of the site of old Memphis, about 10 miles northeast of the location of modern Cairo. It has left until this time about 4 square miles of ruins within the old walls. Little or nothing remains outside the walls.<P>On was built at the edge of the desert, which has now retreated some 3 or 4 miles eastward, the result of the rising of the bed of the Nile by sediment from the inundation, and the broadening of the area of infiltration which now carries the water of the Nile that much to the east. The land around On has risen about 10 ft., and the waters of infiltration at the time of lowest Nile are now about 1 1/2 ft. above the floor-level of the temple.<P>2. History:<P>The history of On is very obscure, yet its very great importance is in no doubt. No clear description of the ancient city or sanctuary has come down to us, but there are so many incidental references, and so much is implied in ancient records, that it stands out as of the very first importance, both as capital and sanctuary. The city comes from the Ist Dynasty, when it was the seat of government, and indeed must have been founded by the Ist Dynasty or have come down to it from pre-historic time. From the IIIrd to the VIth Dynasty the seat of government was shifted from On to Memphis, and in the XIIth Dynasty to Diospolis. Throughout these changes On retained its religious importance. It had been the great sanctuary in the time of the Pyramid Texts, the oldest religious texts of Egypt, and judging from the evident great development of the temple of On at the time of the writing of the texts, the city must have antedated them by considerable time (Budge, History of Egypt, II,83,84, 108; Breasted, Development of Religion and Thought in Egypt, chapters i, ii). The myth of Osiris makes even the charge against Set for the murder of Osiris to have been preferred at Heliopolis (Breasted, op. cit., 34). This certainly implies a very great age for the sanctuary at On. It contained a temple of the sun under the name Ra, the sun, and also Atum, the setting sun, or the sun of the Underworld. There was also a Phoenix Hall and asacred object called a ben, probably a stone, and the origin of the name An, a "stone" or "pillar" (compare Breasted, op. cit.,76,11, and 71). Though the XIIth Dynasty removed the capital to Diospolis, Usertsen I (Senwesret) of that Dynasty erected a great obelisk at On in front of the entrance to the temple. The situation of this obelisk in the templearea indicates that the great temple was already more than a half-mile in length as early as the XIIth Dynasty. The mate of this obelisk on the opposite side of the entrance seems not to have been erected until the XVIIIth Dynasty. Its foundations were discovered in 1912 by Petrie. Some scraps of the granite of the obelisk bear inscriptions of Thothmes III. A great Hyksos wall, also discovered by Petrie in 1912, exactly similar to that of the fortified camp at Tel el Yehudiyeh, 4 miles north, makes it quite certain that these usurpers between the Old Empire and the New fortified On as the capital once more. The manifest subserviency of the priests of On in the story of Joseph makes it most probable that the old capital at On had already been subjugated in Joseph\'s time, and that within this old fortification still existing Joseph ruled as prime minister of Egypt. Merenptah in his 5th year began to fortify On. Sheshonk III called himself "divine prince of Annu," and seems to have made On one of the greatest sanctuaries of his long reign. On still figured in Egyptian history in the rebellion against Ashurbanipal. The city has been deserted since the Persian invasion of 525 BC. Tradition makes the dwelling-place of Joseph and Mary with the child Jesus, while in Egypt, to have been near Heliopolis.<P>The exploration of On was attempted by Schiaparelli, but was not carried out, and his work has not been published. In 1912 Petrie began a systematic work of excavation which, it is expected, will continue until the whole city has been examined. The only great discovery of the first season was the Hyksos wall of fortification. Its full import can only be determined by the continuance of the exploration.``93';
isbe[6559]='On (2)`(\'on; Aun): A Reubenite, son of Peleth, who took part with Dathan and Abiram in their revolt against Moses (<a onClick="return mV(\'Num\',16,1);">Nu 16:1</a>).``1';
isbe[6560]='Onam`o\'-na (\'onam, "vigorous"; compare <a href="./study/isbe/search.html?string=ONAN">ONAN</a>):<P>(1) "Son" of Shobal "son" of Seir the Horite (<a onClick="return mV(\'Gen\',36,23);">Ge 36:23</a>; <a onClick="return mV(\'1Ch\',1,40);">1Ch 1:40</a>).<P>(2) "Son" of Jerahmeel by Atarah; perhaps the name is connected with Onan son of Judah (<a onClick="return mV(\'1Ch\',2,26,28);">1Ch 2:26,28</a>).``1';
isbe[6561]='Onan`o\'-nan (\'onan, "vigorous"; compare <a href="./study/isbe/search.html?string=ONAM">ONAM</a>, a "son" of Judah (<a onClick="return mV(\'Gen\',38,4);">Ge 38:4</a>,<a onClick="return mV(\'Gen\',38,\'8-10\');">8-10</a>; <a onClick="return mV(\'Gen\',46,12);">46:12</a>; <a onClick="return mV(\'Num\',26,19);">Nu 26:19</a>; <a onClick="return mV(\'1Ch\',2,3);">1Ch 2:3</a>); "The story of the untimely death of Er and Onan implies that two of the ancient clans of Judah early disappeared" (Curtis, Chron, 84). See Skinner, Gen,452,where it is pointed out that in <a onClick="return mV(\'Gen\',38,11);">Ge 38:11</a> Judah plainly attributes the death of his sons in some way to Tamar herself. The name is allied to Onam.``1';
isbe[6562]='One`wun.`<a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
