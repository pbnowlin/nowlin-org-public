isbe[2821]='Duke`duk: The rendering in the King James Version in <a onClick="return mV(\'Gen\',36,15);">Ge 36:15</a>ff; <a onClick="return mV(\'Exd\',15,15);">Ex 15:15</a>, and <a onClick="return mV(\'1Ch\',1,51);">1Ch 1:51</a>ff of \'alluph (the American Standard Revised Version and the English Revised Version, margin "chief"), and in <a onClick="return mV(\'Jos\',13,21);">Jos 13:21</a> of necikhim ("dukes," the Revised Version (British and American) "princes"). It occurs also, as the rendering of strategos, in 1Macc 10:65 (the Revised Version (British and American) "captain"). Elsewhere necikhim is translated "princes" or "principal men." The fact that with two exceptions the term is applied in English Versions of the Bible only to the chiefs of Edom has led to the impression that in the family of Esau the chiefs bore a special and hereditary title. But \'alluph was a general term for tribal chief or prince (compare <a onClick="return mV(\'Zec\',9,7);">Zec 9:7</a>; <a onClick="return mV(\'Zec\',12,5,6);">12:5-6</a>; the Revised Version (British and American) "chieftains," the King James Version "governors").<P>Moreover, at the time the King James Version was made the word "duke" was not used as a title in England: the term had the same general force as dux, the word employed in the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) So Sir T. Elyot (died 1546) speaks of "Hannibal, duke of Carthage" (The Governor, II, 233); Shakespeare, Henry V, III,2,20, "Be merciful, great duke, to men of mould" (compare Midsummer Night\'s Dream, I,1,21); Sylvester (1591) Du Bartas, "The great Duke, that in dreadful aw upon Mt. Horeb learned the eternal law." In a still earlier age Wycliff uses the word of the Messiah (<a onClick="return mV(\'Mat\',2,6);">Mt 2:6</a>); and in Select Works, III,137,"Jesus Christ, duke of oure batel."<P>Yet in all probability the Hebrew word was more specific than "chief" or "duke" in the broad sense. For if \'alluph is derived from \'eleph, "thousand," "tribe," the term would mean the leader of a clan, a "chiliarch" (compare Septuagint, <a onClick="return mV(\'Zec\',9,7);">Zec 9:7</a>; <a onClick="return mV(\'Zec\',12,5,6);">12:5-6</a>). the American Standard Revised Version has eliminated the word "duke."`<a href="./study/isbe/search.html?string=CHIEF">CHIEF</a>`134';
isbe[2822]='Dulcimer`dul\'-si-mer.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[2823]='Dumah`du\'-ma (dumah, "silence"): This word occurs in the Old Testament with the following significations:<P>(1) the land of silence or death, the grave (<a onClick="return mV(\'Psa\',94,17);">Ps 94:17</a>; <a onClick="return mV(\'Psa\',115,17);">115:17</a>);<P>(2) a town in the highlands of Judah between Hebron and Beersheba, now ed-Daume (<a onClick="return mV(\'Jos\',15,52);">Jos 15:52</a>);<P>(3) an emblematical designation of Edom in the obscure oracle (<a onClick="return mV(\'Isa\',21,11,12);">Isa 21:11-12</a>);<P>(4) an Ishmaelite tribe in Arabia (<a onClick="return mV(\'Gen\',25,14);">Ge 25:14</a>; <a onClick="return mV(\'1Ch\',1,30);">1Ch 1:30</a>). According to the Arabic geographies this son of Ishmael rounded the town of Dumat-el-Jandal, the stone-built Dumah, so called to distinguish it from another Dumah near the Euphrates. The former now bears the name of the Jauf ("belly"), being a depression situated half-way between the head of the Persian Gulf and the head of the gulf of Akaba. Its people in the time of Mohammed were Christians of the tribe of Kelb. It contained a great well from which the palms and crops were irrigated. It has often been visited by European travelers in recent times. See Jour. Royal Geog. Soc., XXIV (1854), 138-58; W. G. Palgrave, Central and Eastern Arabia, chapter ii. It is possible that the oracle in Isaiah (<span class="noTag">number 3</span> above) concerns this place.``189';
isbe[2824]='Dumb`dum (alam, \'illem, literally, "tied in the tongue"; kophos): Used either as expressing the physical condition of speechlessness, generally associated with deafness, or figuratively as meaning the silence produced by the weight of God\'s judgments (<a onClick="return mV(\'Psa\',39,\'2-9\');">Ps 39:2-9</a>; <a onClick="return mV(\'Dan\',10,15);">Da 10:15</a>) or the oppression of external calamity (<a onClick="return mV(\'Psa\',38,13);">Ps 38:13</a>). As an adjective it is used to characterize inefficient teachers destitute of spirituality ("dumb dogs," <a onClick="return mV(\'Isa\',56,10);">Isa 56:10</a>). The speechlessness of Saul\'s companions (<a onClick="return mV(\'Act\',9,7);">Ac 9:7</a>) was due to fright; that of the man without the wedding garment was because he had no excuse to give (<a onClick="return mV(\'Mat\',22,12);">Mt 22:12</a>). Idols are called mute, because helpless and voiceless (<a onClick="return mV(\'Hab\',2,18,19);">Hab 2:18-19</a>; <a onClick="return mV(\'1Cr\',12,2);">1Co 12:2</a>). The dumbness of the sheep before the shearer is a token of submission (<a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a>; <a onClick="return mV(\'Act\',8,32);">Ac 8:32</a>).<P>Temporary dumbness was inflicted as a sign upon Ezekiel (<a onClick="return mV(\'Eze\',3,26);">3:26</a>; <a onClick="return mV(\'Eze\',24,27);">24:27</a>; <a onClick="return mV(\'Eze\',33,22);">33:22</A>) and as a punishment for unbelief upon Zacharias (<a onClick="return mV(\'Luk\',1,22);">Lu 1:22</a>). There are several cases recorded of our Lord\'s healing the dumb (<a onClick="return mV(\'Mat\',15,30);">Mt 15:30</a>; <a onClick="return mV(\'Mar\',7,37);">Mr 7:37</a>; <a onClick="return mV(\'Luk\',11,14);">Lu 11:14</a>, etc.). Dumbness is often associated with imbecility and was therefore regarded as due to demoniac possession (<a onClick="return mV(\'Mat\',9,32);">Mt 9:32</a>; <a onClick="return mV(\'Mat\',12,22);">12:22</a>). The evangelists therefore describe the healing of these as effected by the casting out of demons.<P>This is especially noted in the case of the epileptic boy (<a onClick="return mV(\'Mar\',9,17);">Mr 9:17</a>). The deaf man with the impediment in his speech (<a onClick="return mV(\'Mar\',7,32);">Mr 7:32</a>) is said to have been cured by loosening the string of his tongue. This does not necessarily mean that he was tongue-tied, which is a condition causing lisping, not stammering; he was probably one of those deaf persons who produce babbling, incoherent and meaningless sounds. I saw in the asylum in Jerusalem a child born blind and deaf, who though dumb, produced inarticulate noises.<P>In an old 14th-century psalter "dumb" is used as a verb in <a onClick="return mV(\'Psa\',39,\'1-\');">Ps 39</a>: "I doumbed and meked and was ful stille."``107';
isbe[2825]='Dung; Dung Gate`dung (\'ashpoth, domen, peresh; skubalon, etc.): Nine different words occurring in the Hebrew have been translated "dung" in the Old Testament. The word used to designate one of the gates of Jerusalem (\'ashpoth, <a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a>; <a onClick="return mV(\'Neh\',3,14);">3:14</a>) is more general than the others and may mean any kind of refuse. The gate was probably so named because outside it was the general dump heap of the city. Visitors in recent years riding outside the city walls of Jerusalem, on their way to the Mt. of Olives or Jericho, may have witnessed such a dump against the wall, which has existed for generations.<P>The first mention made of dung is in connection with sacrificial rites. The sacred law required that the dung, along with what parts of the animal were not burned on the altar, should be burned outside the camp (<a onClick="return mV(\'Exd\',29,14);">Ex 29:14</a>; <a onClick="return mV(\'Lev\',4,11);">Le 4:11</a>; <a onClick="return mV(\'Lev\',8,17);">8:17</a>; <a onClick="return mV(\'Lev\',16,27);">16:27</a>; <a onClick="return mV(\'Num\',19,5);">Nu 19:5</a>). The fertilizing value of dung was appreciated by the cultivator, as is indicated by <a onClick="return mV(\'Luk\',13,8);">Lu 13:8</a> and possibly <a onClick="return mV(\'Psa\',83,10);">Ps 83:10</a> and <a onClick="return mV(\'Isa\',25,10);">Isa 25:10</a>.<P>Dung was also used as a fuel. <a onClick="return mV(\'Eze\',4,12,15);">Eze 4:12, 15</a> will be understood when it is known that the dung of animals is a common fuel throughout Palestine and Syria, where other fuel is scarce. During the summer, villagers gather the manure of their cattle, horses or camels, mix it with straw, make it into cakes and dry it for use as fuel for cooking, especially in the winter when wood or charcoal or straw are not procurable. It burns slowly like peat and meets the needs of the kitchen. In Mesopotamia the writer saw it being used with forced draft to fire a steam boiler. There was no idea of uncleanness in Ezekiel\'s mind, associated with the use of animal dung as fuel (<a onClick="return mV(\'Eze\',4,15);">Eze 4:15</a>).<P>Figuratively: Dung was frequently used figuratively to express the idea<P>(a) of worthlessness, especially a perishable article for which no one cares (<a onClick="return mV(\'1Ki\',14,10);">1Ki 14:10</a>; <a onClick="return mV(\'2Ki\',6,25);">2Ki 6:25</a>; <a onClick="return mV(\'2Ki\',9,37);">9:37</a>; <a onClick="return mV(\'Job\',20,7);">Job 20:7</a>; <a onClick="return mV(\'Psa\',83,10);">Ps 83:10</a>; <a onClick="return mV(\'Jer\',8,2);">Jer 8:2</a>; <a onClick="return mV(\'Jer\',9,22);">9:22</a>; <a onClick="return mV(\'Jer\',16,4);">16:4</a>; <a onClick="return mV(\'Jer\',25,33);">25:33</a>; <a onClick="return mV(\'Zep\',1,17);">Ze 1:17</a>; <a onClick="return mV(\'Phl\',3,8);">Php 3:8</a> (the American Standard Revised Version "refuse")). Dunghill was used in the same way (<a onClick="return mV(\'1Sa\',2,8);">1Sa 2:8</a>; <a onClick="return mV(\'Ezr\',6,11);">Ezr 6:11</a>; <a onClick="return mV(\'Psa\',113,7);">Ps 113:7</a>; <a onClick="return mV(\'Isa\',25,10);">Isa 25:10</a>; <a onClick="return mV(\'Dan\',2,5);">Da 2:5</a>; <a onClick="return mV(\'Dan\',3,29);">3:29</a>; <a onClick="return mV(\'Luk\',14,35);">Lu 14:35</a>; <a onClick="return mV(\'Lam\',4,5);">La 4:5</a>);<P>(b) as an expression of disgust (<a onClick="return mV(\'2Ki\',18,27);">2Ki 18:27</a>; <a onClick="return mV(\'Isa\',36,12);">Isa 36:12</a>);<P>(c) of rebuke (<a onClick="return mV(\'Mal\',2,3);">Mal 2:3</a>).``133';
isbe[2826]='Dungeon`dun\'-jun.`<a href="./study/isbe/search.html?string=PRISON">PRISON</a>`1';
isbe[2827]='Dunghill`dung\'-hil (\'ashpoth, <a onClick="return mV(\'1Sa\',2,8);">1Sa 2:8</a>, madhmenah, etc., with other words; kopria, <a onClick="return mV(\'Luk\',14,35);">Lu 14:35</a>): Dung heap, or place of refuse. To sit upon a dunghill (<a onClick="return mV(\'1Sa\',2,8);">1Sa 2:8</a>; <a onClick="return mV(\'Psa\',113,7);">Ps 113:7</a>; <a onClick="return mV(\'Lam\',4,5);">La 4:5</a>) is significant of the lowest and most wretched condition. To turn a house into a dunghill (<a onClick="return mV(\'Dan\',2,5);">Da 2:5</a>; <a onClick="return mV(\'Dan\',3,29);">3:29</a>), or be flung upon a dunghill (<a onClick="return mV(\'Luk\',14,35);">Lu 14:35</a>), marks the extreme of ignominy.`<a href="./study/isbe/search.html?string=DUNG">DUNG</a>`1';
isbe[2828]='Dura`du\'-ra (dura\'): The name of the plain on which Nebuchadnezzar, king of Babylon, set up the great golden image which all his subjects were ordered to worship (<a onClick="return mV(\'Dan\',3,1);">Da 3:1</a>). Oppert placed it to the southeast of Babylon, near a small river and mounds bearing the name of Douair or Duair, where, also, was what seemed to be the base of a great statue (Exped. scientifique en Mesopotamie, I, 238f). Others have believed that name to indicate a portion of the actual site of Babylon within the great wall (duru) of the city—perhaps the rampart designated dur Su-anna, "the rampart (of the city) Lofty-defense," a name of Babylon.<P>The fact that the plain was within the city of Babylon precludes an identification with the city Duru, which seems to have lain in the neighborhood of Erech (Hommel, Grundriss, 264, note 5). It is noteworthy that the Septuagint substitutes Deeira, for Dura, suggesting that the Greek translators identified it with the Babylonian Deru, a city which apparently lay toward the Elamite border. It seems to have been called also Dur-ili, "god\'s rampart." That it was at some distance is supported by the list WAI, IV, 36 [38], where Duru, Tutul and Gudua (Cuthah), intervene between Deru or Dur-ili and Tindir (Babylon). "The plain of the dur" or "rampart" within Babylon would therefore seem to be the best rendering.``136';
isbe[2829]='Dure`dur (proskairos): Used for "<a href="./study/isbe/search.html?string=ENDURE">endure</a>" (which see), the King James Version <a onClick="return mV(\'Mat\',13,21);">Mt 13:21</a> (the Revised Version (British and American) "endureth").``1';
isbe[2830]='Dust`dust (\'aphar; koniortos, chous): Small particles of earth. The word has several figurative and symbolic meanings:<P>(1) Dust being the material out of which God is said to have formed man (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>), it became a symbol of man\'s frailty (<a onClick="return mV(\'Psa\',103,14);">Ps 103:14</a>, "For he knoweth our frame; he remembereth that we are dust"; compare <a onClick="return mV(\'Gen\',18,27);">Ge 18:27</a>; <a onClick="return mV(\'Job\',4,19);">Job 4:19</a>, etc.), and of his mortality (<a onClick="return mV(\'Gen\',3,19);">Ge 3:19</a>, "Dust thou art, and unto dust shalt thou return"; compare <a onClick="return mV(\'Job\',34,15);">Job 34:15</a>; <a onClick="return mV(\'Psa\',104,29);">Ps 104:29</a>; <a onClick="return mV(\'Ecc\',3,20);">Ec 3:20</a>; <a onClick="return mV(\'Ecc\',12,7);">12:7</a>, etc.) Hence, it is used figuratively for the grave (<a onClick="return mV(\'Psa\',22,15,29);">Ps 22:15, 29</a>; <a onClick="return mV(\'Psa\',30,9);">30:9</a>; <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>).<P>(2) Such actions as to lie in the dust, to lick the dust, to sprinkle dust on the head, are symbols expressive of deep humiliation, abasement or lamentation (e. g. <a onClick="return mV(\'Job\',2,12);">Job 2:12</a>; <a onClick="return mV(\'Job\',42,6);">42:6</a>; <a onClick="return mV(\'Psa\',72,9);">Ps 72:9</a>; <a onClick="return mV(\'Isa\',2,10);">Isa 2:10</a>; <a onClick="return mV(\'Isa\',47,1);">47:1</a>; <a onClick="return mV(\'Isa\',49,23);">49:23</a>; <a onClick="return mV(\'Lam\',2,10);">La 2:10</a>; <a onClick="return mV(\'Lam\',3,29);">3:29</a>; <a onClick="return mV(\'Eze\',27,30);">Eze 27:30</a>; <a onClick="return mV(\'Mic\',7,17);">Mic 7:17</a>; <a onClick="return mV(\'Rev\',18,19);">Re 18:19</a>). Hence, such expressions as "He raiseth up the poor out of the dust," i.e. out of their state of lowliness (<a onClick="return mV(\'1Sa\',2,8);">1Sa 2:8</a>; <a onClick="return mV(\'Psa\',113,7);">Ps 113:7</a>).<P>(3) Throwing dust was an act expressive of execration. Thus, Shimei "cursed" David and "threw stones at him, and cast dust," literally, "dusted (him) with dust" (<a onClick="return mV(\'2Sa\',16,13);">2Sa 16:13</a>). So the crowd which Paul addressed at Jerusalem manifested their wrath against him by tossing about their garments and casting dust into the air (<a onClick="return mV(\'Act\',22,23);">Ac 22:23</a>).<P>(4) Shaking the dust off one\'s feet against anyone (<a onClick="return mV(\'Mat\',10,14);">Mt 10:14</a>; <a onClick="return mV(\'Mar\',6,11);">Mr 6:11</a>; <a onClick="return mV(\'Luk\',9,5);">Lu 9:5</a>; <a onClick="return mV(\'Luk\',10,11);">10:11</a>; <a onClick="return mV(\'Act\',13,51);">Ac 13:51</a>) is symbolic of renunciation, as we would say "washing one\'s hands of him," an intimation that all further intercourse was at an end. It was practiced by the Pharisees on passing from Gentile to Jewish soil, it being a rabbinical doctrine that the dust of a heathen land defiles.<P>(5) It is also used figuratively for an innumerable multitude (e. g. <a onClick="return mV(\'Gen\',13,16);">Ge 13:16</a>; <a onClick="return mV(\'Gen\',28,14);">28:14</a>; <a onClick="return mV(\'Job\',27,16);">Job 27:16</a>; <a onClick="return mV(\'Psa\',78,27);">Ps 78:27</a>).<P>(6) The expression "Yahweh will make the rain of thy land powder and dust" (<a onClick="return mV(\'Deu\',28,24);">De 28:24</a>) means the dust in consequence of the drought shall fall down instead of rain on the dry ground. In Judea and vicinity during a sirocco, the air becomes filled with sand and dust, which are blown down by the wind with great violence.``49';
isbe[2831]='Duty`du\'-ti (dabhar; opheilo):<P>The word duty occurs only three times in the Old Testament and twice in the New Testament. In the Old Testament it is the translation of dabhar, which, meaning originally "speech," or "word," came to denote any particular "matter" that had to be attended to. In the two places where it is rendered "duty" (<a onClick="return mV(\'2Ch\',8,14);">2Ch 8:14</a>; <a onClick="return mV(\'Ezr\',3,4);">Ezr 3:4</a>) the reference is to the performance of the Temple services—praise and sacrifice—and it is probably from these passages that the phrase "taking duty" in church services is derived. In other passages we have different words employed to denote the priests\' dues: the King James Version <a onClick="return mV(\'Lev\',10,13,14);">Le 10:13-14</a>, hok ("statutory portion"); <a onClick="return mV(\'Deu\',18,3);">De 18:3</a>, mishpat ("judgment"). In <a onClick="return mV(\'Pro\',3,27);">Pr 3:27</a>, we have a reference to duty in the moral sense, "Withhold not good from them to whom it is due," ba\'-al (i.e. as in the King James Version margin, "from the owners thereof"). In <a onClick="return mV(\'Exd\',21,10);">Ex 21:10</a> we have the "duty of marriage" (\'onah), that which was due to the wife.<P>In the New Testament "duty" is expressed by opheilo, "to owe," "to be due." In <a onClick="return mV(\'Luk\',17,10);">Lu 17:10</a>, we have "Say,...we have done that which it was our duty to do," and in <a onClick="return mV(\'Rom\',15,27);">Ro 15:27</a> the King James Version, it is said of the Gentiles with reference to the Jewish Christians, "Their duty is also to minister unto them in carnal things," the American Standard Revised Version "they owe it." In <a onClick="return mV(\'Mat\',18,34);">Mt 18:34</a> we have "till he should pay all that was due" (opheilo, "owing"), and in <a onClick="return mV(\'1Cr\',7,3);">1Co 7:3</a> the King James Version, "Render unto the wife due opheile benevolence," the American Standard Revised Version "her due."`<a href="./study/isbe/search.html?string=ETHICS">ETHICS</a>`185';
isbe[2832]='Dwarf`dworf:<P>The rendering in English Versions of the Bible of the Hebrew word dak, "thin," "small," in <a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>, where a list is given of physical failings which forbade man of the seed of Aaron to officiate at the altar, though he might partake of the sacrificial gifts. The precise meaning of the Hebrew word here is uncertain; elsewhere it is used of the lean kine (<a onClick="return mV(\'Gen\',41,3);">Ge 41:3</a>) and blasted ears (verse <a onClick="return mV(\'Gen\',41,23);">23</a>) of Pharaoh\'s dream; of the grains of manna (<a onClick="return mV(\'Exd\',16,14);">Ex 16:14</a>), of the still, small voice (<a onClick="return mV(\'1Ki\',19,12);">1Ki 19:12</a>), of dust (<a onClick="return mV(\'Isa\',29,5);">Isa 29:5</a>), etc. Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) suggest defective eyes; but "withered" would perhaps best express the meaning.`<a href="./study/isbe/search.html?string=PRIESTS+AND+LEVITES">PRIESTS AND LEVITES</a>`57';
isbe[2833]='Dwell`dwel:<P>(1) In the Old Testament "dwell" is a translation of 9 words, of which by far the most frequent is yashabh, "to sit down," translated "dwell" over 400 times (<a onClick="return mV(\'Gen\',4,20);">Ge 4:20</a>; <a onClick="return mV(\'Jos\',20,4);">Jos 20:4</a>; <a onClick="return mV(\'1Ch\',17,1,4,5);">1Ch 17:1, 4-5</a>, etc.); also very frequently "sit," and sometimes "abide," "inhabit," "remain." Another word often rendered "dwell" is shakhan or shakhen ("to settle down"), from which is derived the rabbinic word shekhinah (literally, "that which dwells"), the light on the mercy-seat which symbolized the Divine presence (<a onClick="return mV(\'Exd\',25,8);">Ex 25:8</a>, etc.). In order to avoid appearing to localize the Divine Being, wherever God is said to "dwell" in a place, the Targum renders that He "causes His Shekinah to dwell" there.<P>(2) In the New Testament "dwell" most frequently stands for oikeo, or one of its compounds; also skenoo, and (chiefly in the Johannine writings) meno, which, however, is always translated "abide" in the Revised Version (British and American), and generally in the King James Version. Mention may be made of the mystical significance of the word in some New Testament passages, of the indwelling of the Father or of the Godhead in Christ (<a onClick="return mV(\'Jhn\',14,10);">Joh 14:10</a>; <a onClick="return mV(\'Col\',1,19);">Col 1:19</a>; <a onClick="return mV(\'Col\',2,9);">2:9</a>), of the believer in Christ (<a onClick="return mV(\'Jhn\',6,56);">Joh 6:56</a> the King James Version; <a onClick="return mV(\'Eph\',3,17);">Eph 3:17</a>), and in God (<a onClick="return mV(\'1Jo\',4,15);">1Joh 4:15</a> the King James Version; compare <a onClick="return mV(\'Psa\',90,1);">Ps 90:1</a>; <a onClick="return mV(\'Psa\',91,1);">91:1</a>), and of the Holy Spirit or God in the believer (<a onClick="return mV(\'Jhn\',14,17);">Joh 14:17</a>; the King James Version <a onClick="return mV(\'1Jo\',3,24);">1Joh 3:24</a>; <a onClick="return mV(\'1Jo\',4,15);">4:15</a>f).``49';
isbe[2834]='Dye; Dyeing`di, di\'-ing (me\'oddam, hamuc, tebhul, cebha\'):<P>Four different Hebrew words have been translated "dyed": the King James Version<P>(a) me\'-oddam, found in <a onClick="return mV(\'Exd\',25,5);">Ex 25:5</a>; <a onClick="return mV(\'Exd\',26,14);">26:14</a>; <a onClick="return mV(\'Exd\',35,7);">35:7</a>; <a onClick="return mV(\'Exd\',36,19);">36:19</a>; <a onClick="return mV(\'Exd\',39,34);">39:34</a>;<P>(b) hamuts (the Revised Version, margin "crimsoned") (<a onClick="return mV(\'Isa\',63,1);">Isa 63:1</a>);<P>(c) tebhul (<a onClick="return mV(\'Eze\',23,15);">Eze 23:15</a>). Tebhul is probably more correctly rendered "flowing turban" as in the Revised Version (British and American) of the above verses (Brown-Driver-Briggs\' Hebrew Lexicon);<P>(d) gebha\', "dyed" is so translated in the American Standard Revised Version of <a onClick="return mV(\'Jdg\',5,30);">Jud 5:30</a> (BDB); compare Arabic sabagh.<P>The above references and other color words mentioned elsewhere (see <a href="./study/isbe/search.html?string=COLOR">COLOR</a>) indicate that the Israelites were acquainted with dyed stuffs, even if they themselves did not do the dyeing. An analysis of the various Biblical references shows but four colors which were produced on cloth by dyeing, namely, purple, blue (violet), crimson and scarlet. Of these, purple is the one best known because of the many historical references to it. It was the symbol of royalty and luxury. Because of its high price, due to the expensive method of obtaining it, only royalty and the rich could afford purple attire. One writer tells us that the dyestuff was worth its weight in silver. Probably it was because of its scarcity, and because it was one of the very limited number of dyes known, rather than for any remarkable beauty of color, that the purple was so much sought after. If Pliny\'s estimate is to be accredited, then "in the dye the smell of it was offensive and the color itself was harsh, of a greenish hue and strongly resembling that of the sea when in a tempestuous state."<P>1. Purple and Blue:<P>The purple and blue dyes were extracted from shellfish. The exact process used by the ancients is still a question in spite of the attempts of early writers to describe it. Tyre and Sidon were noted as the suppliers of these colors, hence, the name "Tyrian purple." The inhabitants of these cities were at first simply dealers in the purple (<a onClick="return mV(\'Eze\',27,7,24);">Eze 27:7, 24</a>), but they afterward became the manufacturers, as the heaps of the emptied shells of the Murex trunculus, which still exist in the vicinity of these cities, testify. The pigment was secreted by a gland in the lining of the stomach. The shell was punctured and the fish removed in order to secure the dye. The juice, at first whitish, changed on exposure to yellowish or greenish and finally to red, amethyst or purple, according to the treatment. A modified color was obtained by first dipping the textile in a cochineal bath and then in the purple, Tyrian purple was considered most valuable when it was "exactly the color of clotted blood and of a blackish hue" (Pliny). See also <a href="./study/isbe/search.html?string=LYDIA">LYDIA</a>; <a href="./study/isbe/search.html?string=THYATIRA">THYATIRA</a>.<P>Besides the shellfish above mentioned, several other species are noted by different writers, namely, Murex branderis, Murex erinaceus, Murex buccinum (purpura haemastoma). This latter species is still used by the dwellers on the shores where it is found. Various species of the murex are found today at Haifa (Syria), about the Greek isles and on the north coast of Africa. The purple color has been produced from them by modern chemists, but it is of historical interest only, in the light of the discovery of modern artificial dyes with which it could not compete commercially.<P>Two words have been used in the Hebrew Bible to describe the colors from shellfish:<P>(a) \'argaman (Greek porphura). This has been translated "purple";<P>(b) tekheleth which was probably a shade of violet, but has been translated "blue" in both the King James Version and the Revised Version (British and American).<P>2. Crimson and Scarlet:<P>As indicated elsewhere (See <a href="./study/isbe/search.html?string=COLORS">COLORS</a>), three Hebrew words have been rendered crimson or scarlet:<P>(a) karmil (compare Arabic kirmiz and English "carmine"),<P>(b) tola\', and<P>(c) shani. We know nothing further about the method of producing these colors than that they were both obtained from the kermes insect which feeds on a species of live oak growing in Southern Europe and Turkey in Asia. The modern dyer can obtain several shades from the cochineal insect by varying the mordants or assistants used with the dye. Pliny mentions the same fact as being known by the ancient Egyptians. Some of the Syrian dyers still use the kermes, commonly called dud ("worms"), although most of them hove resorted to the artificial European dyes which they indiscriminately call dud frangy ("foreign worms").<P>The "rams\' skins dyed red" mentioned in Exodus are still made in Syria. After the ram\'s skin has been tanned in sumac, it is laid out on a table and a solution of the dye, made by boiling dud in water, is rubbed on. After the dye is dry, the skin is rubbed with oil and finally polished. No native product is more characteristic of the country than the slippers, Bedouin shoes, and other leather articles made from "rams\' skins dyed red" (see <a href="./study/isbe/search.html?string=TANNER">TANNER</a>).<P>3. Other Dyes Probably Known:<P>Other dyes probably known were:<P>(1) Madder.<P>In <a onClick="return mV(\'Jdg\',10,1);">Jud 10:1</a>, we read that "after Abimelech there arose to save Israel Tola the son of Puah." These were probably names of clans. In the Hebrew they are also color words. Tola\' is the scarlet dye and pu\'ah, if, as is probable, it is the same as the Arabic fuwah, means "madder." This would add another dyestuff. Until the discovery of alizarin, which is artificial madder, the growing of fuwah was one of the industries of Cyprus and Syria. It was exported to Europe and was also used locally for producing "Turkey red" on cotton and for dyeing dull reds on wool for rug making (see <a href="./study/isbe/search.html?string=THYATIRA">THYATIRA</a>). It was the custom near Damascus for a father to plant new madder field for each son that was born. The field began to yield in time to support the boy and later become his inheritance. Madder is mentioned in the Talmud and by early Latin writers. A Saracenic helmet and a shield of similar origin, in the possession of the writer, are lined with madder-dyed cotton.<P>(2) Indigo. Another dye has been discovered among the Egyptian mummy cloths, namely, indigo. Indigo blue was used in weaving to form the borders of the cloths. This pigment was probably imported from India.<P>(3) Yellows and Browns. Yellows and browns of doubtful origin have also been found in the Egyptian tombs. The Jews acquired from the Phoenicians the secret of dyeing, and later held the monopoly in this trade in some districts. A Jewish guild of purple dyers is mentioned on a tombstone in Hieropolis. In the 12th century AD Jews were still dyers and glass workers at Tyre. Akhissar, a Jewish stronghold in Asia Minor, was famous as a dyeing city.<p>LITERATURE.<P>See "<a href="./study/isbe/search.html?string=Crafts">CRAFTS</a>" especially in Wilkinson, Perrot and Chipiez, Jewish Encyclopedia, and HDB.`<a href="./study/isbe/search.html?string=ATTIRE">ATTIRE</a>; <a href="./study/isbe/search.html?string=DYED+ATTIRE">DYED ATTIRE</a>`133';
isbe[2835]='Dysentery`dis\'-en-ter-i (dusenteria):<P>In <a onClick="return mV(\'Act\',28,8);">Ac 28:8</a> the Revised Version (British and American) uses this word in place of the phrase "bloody flux" of the King James Version to describe the disease by which the father of Publius was affected in Malta at the time of Paul\'s shipwreck. The acute form of this disease is often attended with high temperature, hence, Luke speaks of it as "fever and dysentery" (puretois kai dusenteria).<P>The disease is still occasionally epidemic in Malta where there have been several bad outbreaks among the garrison in the last century, and it has proved to be an intractable and fatal disease there. It is due to parasitic microbe, the Bacillus dysenteriae. In <a onClick="return mV(\'2Ch\',21,19);">2Ch 21:19</a> there is reference to an epidemic of a similar nature in the days of Jehoram. The malady, as predicted by Elisha, attacked the king and assumed a chronic form in the course of which portions of the intestine sloughed. This condition sometimes occurs in the amoebic form of dysentery, cases of which sometimes last over two years.``107';
isbe[2836]='Eagle`e\'-g\'-l (nesher; aetos; Latin aquila): A bird of the genus aquila of the family falconidae.<P>The Hebrew nesher, meaning "to tear with the beak," is almost invariably translated "eagle," throughout the Bible; yet many of the most important references compel the admission that the bird to which they applied was a vulture.<P>There were many large birds and carrion eaters flocking over Palestine, attracted by the offal from animals slaughtered for tribal feasts and continuous sacrifice. The eagle family could not be separated from the vultures by their habit of feeding, for they ate the offal from slaughter as well as the vultures. One distinction always holds good. Eagles never flock. They select the tallest trees of the forest, the topmost crag of the mountain, and pairs live in solitude, hunting and feeding singly, whenever possible carrying their prey to the nest so that the young may gain strength and experience by tearing at it and feeding themselves. The vultures are friendly, and collect and feed in flocks. So wherever it is recorded that a "flock came down on a carcass," there may have been an eagle or two in it, but the body of it were vultures. Because they came in such close contact with birds of prey, the natives came nearer dividing them into families than any birds. Of perhaps a half-dozen, they recognized three eagles, they knew three vultures, four or five falcons, and several kites; but almost every Biblical reference is translated "eagle," no matter how evident the text makes it that the bird was a vulture.<P>For example, <a onClick="return mV(\'Mic\',1,16);">Mic 1:16</a>: "Make thee bald, and cut off thy hair for the children of thy delight: enlarge thy baldness as the eagle (m "vulture"); for they are gone into captivity from thee." This is a reference to the custom of shaving the head when in mourning, but as Palestine knew no bald eagle, the text could refer only to the bare head and neck of the griffon vulture. The eagles were, when hunger-driven, birds of prey; the vultures, carrion feeders only. There was a golden eagle (the osprey of the King James Version), not very common, distinguished by its tan-colored head; the imperial eagle, more numerous and easily identified by a dark head and white shoulders; a spotted eagle; a tawny eagle, much more common and readily distinguished by its plumage; and the short-toed eagle, most common of all and especially a bird of prey, as also a small hooded eagle so similar to a vulture that it was easily mistaken for one, save that it was very bold about taking its own food.<P>The first Biblical reference to the eagle referred to the right bird. <a onClick="return mV(\'Exd\',19,4);">Ex 19:4</a>: "Ye have seen what I did unto the Egyptians, and how I bare you on eagles\' wings, and brought you unto myself." This "bare you on eagles\' wings" must not be interpreted to mean that an eagle ever carried anything on its back. It merely means that by strength of powerful wing it could carry quite a load with its feet and frequently was seen doing this. Vultures never carried anything; they feasted and regurgitated what they had eaten to their young.<P>The second reference is found in <a onClick="return mV(\'Lev\',11,13);">Le 11:13</a> and repeated in <a onClick="return mV(\'Deu\',14,12);">De 14:12</a>, the lists of abominations. It would seem peculiar that Moses would find it necessary to include eagles in this list until it is known that Arab mountaineers were eating these birds at that time. The next falls in <a onClick="return mV(\'Deu\',28,49);">De 28:49</a>: "Yahweh will bring a nation against thee from far, from the end of the earth, as the eagle flieth; a nation whose tongue thou shalt not understand." This also refers to the true eagle and points out that its power of sustained flight, and the speed it could attain when hastening to its hunger-clamoring young, had been observed. The next reference is in <a onClick="return mV(\'Deu\',32,11);">De 32:11</a>: "As an eagle that stirreth up her nest, That fluttereth over her young, He spread abroad his wings, he took them, He bare them on his pinions."<P>This is good natural history at last. Former versions made these lines read as if the eagle carried its young on its wings, a thing wholly incompatible with flight in any bird. Samuel\'s record of the lamentation of David over Saul and Jonathan is a wonderful poetic outburst and contains reference to this homing flight of the eagle (<a onClick="return mV(\'2Sa\',1,23);">2Sa 1:23</a>). In <a onClick="return mV(\'Job\',9,26);">Job 9:26</a> the arrow-like downward plunge of the hunger-driven eagle is used in comparison with the flight of time. In <a onClick="return mV(\'Job\',39,\'1-\');">Job 39</a>, which contains more good natural history than any other chapter of the Bible, will be found everything concerning the eagle anyone need know:<P class="in15">"Is it at thy command that the eagle mounteth up,<br>And maketh her nest on high?<br>On the cliff she dwelleth, and maketh her home,<br>Upon the point of the cliff, and the stronghold.<br>From thence she spieth out the prey;<br>Her eyes behold it afar off.<br>Her young ones also suck up blood:<br>And where the slain are, there is she" (<a onClick="return mV(\'Job\',39,\'27-30\');">Job 39:27-30</a>).<p><a onClick="return mV(\'Psa\',103,5);">Ps 103:5</a> is a reference to the long life of the eagle. The bird has been known to live to an astonishing age in captivity; under natural conditions, the age it attains can only be guessed.<P class="in15">"Who satisfieth thy desire with good things,<br>So that thy youth is renewed like the eagle."<p><a onClick="return mV(\'Pro\',23,5);">Pr 23:5</a> compares the flight of wealth with that of an eagle; <a onClick="return mV(\'Pro\',30,17);">Pr 30:17</a> touches on the fact that the eye of prey is the first place attacked in eating, probably because it is the most vulnerable point and so is frequently fed to the young. <a onClick="return mV(\'Pro\',30,19);">Pr 30:19</a>:<p class="in15">"The way of an eagle in the air;<br>The way of a serpent upon a rock:<br>The way of a ship in the midst of the sea;<br>And the way of a man with a maiden."<P>This reference to the eagle is to that wonderful power of flight that enables a bird to hang as if frozen in the sky, for long periods appearing to our sight immovable, or to sail and soar directly into the eye of the sun, seeming to rejoice in its strength of flight and to exult in the security and freedom of the upper air. The word "way" is here improperly translated. To the average mind it always means a road, a path. In this instance it should be translated:<P class="in15">The characteristics of an eagle in the air;<br>The habit of a serpent upon the rock;<br>The path of a ship in the midst of the sea;<br>And the manner of a man with a maid.<p>Each of these lines stood a separate marvel to Agur, and had no connection with the others (but compare The <span class="noTag">Wisdom of Solomon 5:10-11</span>, and see <a href="./study/isbe/search.html?string=WAY">WAY</a>).<P><a onClick="return mV(\'Isa\',40,31);">Isa 40:31</a> is another flight reference. <a onClick="return mV(\'Jer\',49,16);">Jer 49:16</a> refers to the inaccessible heights at which the eagle loves to build and rear its young. <a onClick="return mV(\'Jer\',49,22);">Jer 49:22</a> refers to the eagle\'s power of flight. <a onClick="return mV(\'Eze\',1,10);">Eze 1:10</a> recounts a vision of the prophet in which strange living creatures had faces resembling eagles. The same book (<a onClick="return mV(\'Eze\',17,3);">17:3</a>) contains the parable of the eagle: "Thus saith the Lord Yahweh: A great eagle with great wings and long pinions, full of feathers, which had divers colors, came unto Lebanon, and took the top of the cedar." <a onClick="return mV(\'Hsa\',8,1);">Ho 8:1</a> is another flight reference. <a onClick="return mV(\'Oba\',1,4);">Obad 1:4</a> is almost identical with <a onClick="return mV(\'Jer\',49,16);">Jer 49:16</a>. The next reference is that of Micah, and really refers to the griffon vulture (<a onClick="return mV(\'Mic\',1,16);">Mic 1:16</a>). In <a onClick="return mV(\'Hab\',1,8);">Hab 1:8</a> the reference is to swift flight. <a onClick="return mV(\'Mat\',24,28);">Mt 24:28</a> undoubtedly refers to vultures. In <a onClick="return mV(\'Rev\',4,7);">Re 4:7</a> the eagle is used as a symbol of strength. In <a onClick="return mV(\'Rev\',8,13);">Re 8:13</a> the bird is represented as speaking: "And I saw, and I heard an eagle (the King James Version "angel"), flying in mid heaven, saying with a great voice, Woe, woe, woe, for them that dwell on the earth, by reason of the other voices of the trumpet of the three angels, who are yet to sound." The eagle makes its last appearance in the vision of the woman and the dragon (<a onClick="return mV(\'Rev\',12,14);">Re 12:14</a>).``167';
isbe[2837]='Eanes`e\'-a-nez (<span class="noTag"1Esdras 9:21</span>):<P>the Revised Version (British and American)<P><a href="./study/isbe/search.html?string=MANES">MANES</a> (which see), the Revised Version, margin "Harim."``1';
isbe[2838]='Ear`er (\'ozen; ous, otion, the latter word (literally, "earlet") in all the Gospels only used of the ear of the high priest\'s servant, which was cut off by Peter: <a onClick="return mV(\'Mat\',26,51);">Mt 26:51</a>; <a onClick="return mV(\'Mar\',14,47);">Mr 14:47</a>; <a onClick="return mV(\'Luk\',22,51);">Lu 22:51</a> (not <a onClick="return mV(\'Luk\',22,50);">22:50</a>); <a onClick="return mV(\'Jhn\',18,10,26);">Joh 18:10, 26</a>):<P>(1) The physical organ of hearing which was considered of peculiar importance as the chief instrument by which man receives information and commandments. For this reason the ear of the priest had to be specially sanctified, the tip of the right ear being touched with sacrificial blood at the consecration (<a onClick="return mV(\'Lev\',8,23);">Le 8:23</a>). Similarly the ear of the cleansed leper had to be rededicated to the service of God by blood and oil (<a onClick="return mV(\'Lev\',14,14,17,25,28);">Le 14:14, 17, 25, 28</a>). The ear-lobe of a servant, who preferred to remain with the family of his master rather than become free in the seventh year, was to be publicly bored or pierced with an awl in token of perpetual servitude (<a onClick="return mV(\'Exd\',21,6);">Ex 21:6</a>). It has been suggested that <a onClick="return mV(\'Psa\',40,6);">Ps 40:6</a> should be interpreted in this sense, but this is not probable (see below). The cutting off of the ears and noses of captives was an atrocious custom of war frequently alluded to in oriental literature, (<a onClick="return mV(\'Eze\',23,25);">Eze 23:25</a>). The phrase "to open the ear," which originally means the uncovering of the ear by partially removing the turban, so as to permit a clearer hearing, is used in the sense of revealing a secret or of giving important (private) information (<a onClick="return mV(\'1Sa\',9,15);">1Sa 9:15</a>; <a onClick="return mV(\'1Sa\',20,2,12,13);">20:2, 12-13</a>; <a onClick="return mV(\'2Sa\',7,27);">2Sa 7:27</a>; <a onClick="return mV(\'1Ch\',17,25);">1Ch 17:25</a>; <a onClick="return mV(\'Psa\',40,6);">Ps 40:6</a>), and the New Testament promises similarly that "things which eye saw not, and ear heard not" are to be revealed by the reconciled God to the heart that in gladsome surrender has come to Him to be taught by His spirit (<a onClick="return mV(\'1Cr\',2,9);">1Co 2:9</a>).<P>(2) The inner ear, the organ of spiritual perception. If the ear listens, the heart willingly submits, but often the spiritual ear is "hardened" (<a onClick="return mV(\'Isa\',6,10);">Isa 6:10</a>; <a onClick="return mV(\'Zec\',7,11);">Zec 7:11</a>; <a onClick="return mV(\'Mat\',13,15);">Mt 13:15</a>; <a onClick="return mV(\'Act\',28,27);">Ac 28:27</a>), or "heavy" (<a onClick="return mV(\'Isa\',6,10);">Isa 6:10</a>; <a onClick="return mV(\'Deu\',29,4);">De 29:4</a>), either by self-seeking obstinacy or by the judgment of an insulted God. Such unwilling hearers are compared to the "deaf adder....which hearkeneth not to the voice of charmers, charming never so wisely" (<a onClick="return mV(\'Psa\',58,4,5);">Ps 58:4-5</a>; <a onClick="return mV(\'Pro\',21,13);">Pr 21:13</a>; <a onClick="return mV(\'Pro\',28,9);">28:9</a>; <a onClick="return mV(\'Act\',7,57);">Ac 7:57</a>). The expression "He that hath ears to hear let him hear" is frequent in the Synoptic Gospels, occurring 7 or 8 times: <a onClick="return mV(\'Mat\',11,15);">Mt 11:15</a>; <a onClick="return mV(\'Mat\',13,9,43);">Mt 13:9, 43</a>; <a onClick="return mV(\'Mar\',4,9,23);">Mr 4:9, 23</a> (<a onClick="return mV(\'Mar\',7,16);">7:16</a> the Revised Version (British and American) omits); <a onClick="return mV(\'Luk\',8,8);">Lu 8:8</a>; <a onClick="return mV(\'Luk\',14,35);">14:35</a>, and while not found in the Fourth Gospel, it occurs seven times in <a onClick="return mV(\'Rev\',2,\'1-\');">Re 2</a> and <a onClick="return mV(\'Rev\',3,\'1-\');">3</a>. "Itching ears," on the other hand, are those that have become tired of the sound of oft-repeated truth and that long for new though deceitful teaching (<a onClick="return mV(\'2Ti\',4,3);">2Ti 4:3</a>). Ears may "tingle" at startling news, especially of disaster (<a onClick="return mV(\'1Sa\',3,11);">1Sa 3:11</a>; <a onClick="return mV(\'2Ki\',21,12);">2Ki 21:12</a>; <a onClick="return mV(\'Jer\',19,3);">Jer 19:3</a>).<P>(3) God\'s ears are often mentioned in the anthropopathic style of Scripture, signifying the ability of God to receive the petitions of His people, for "He that planted the ear, shall he not hear?" (<a onClick="return mV(\'Psa\',94,9);">Ps 94:9</a> also <a onClick="return mV(\'Psa\',10,17);">Ps 10:17</a>; <a onClick="return mV(\'Psa\',34,15);">34:15</a>; <a onClick="return mV(\'Psa\',130,2);">130:2</a>; <a onClick="return mV(\'Isa\',59,1);">Isa 59:1</a>; <a onClick="return mV(\'1Pe\',3,12);">1Pe 3:12</a>). But God also hears the murmurings of the wicked against Him (<a onClick="return mV(\'Num\',11,1);">Nu 11:1</a>; <a onClick="return mV(\'2Ki\',19,28);">2Ki 19:28</a>; <span class="noTag">Wis 1:10</span>; <a onClick="return mV(\'Jam\',5,4);">Jas 5:4</a>); still it lies in His power to refuse to hear (<a onClick="return mV(\'Eze\',8,18);">Eze 8:18</a>; <a onClick="return mV(\'Lam\',3,8);">La 3:8</a> compare also <a onClick="return mV(\'Lam\',3,56);">La 3:56</a>).``106';
isbe[2839]='Earing`er\'-ing (harish):<P>The Hebrew word is twice translated "earing" in the King James Version (<a onClick="return mV(\'Gen\',45,6);">Ge 45:6</a>; <a onClick="return mV(\'Exd\',34,21);">Ex 34:21</a>). The Revised Version (British and American) rendering is "plowing": "There shall be neither plowing nor harvest."<P>See also <a onClick="return mV(\'Deu\',21,4);">De 21:4</a>; <a onClick="return mV(\'1Sa\',8,12);">1Sa 8:12</a>; <a onClick="return mV(\'Isa\',30,24);">Isa 30:24</a>.``1';
isbe[2840]='Early`ur\'-li (orthros, and related words; proi):<P>The word generally refers to the day, and means the hour of dawn or soon after (<a onClick="return mV(\'Gen\',19,2);">Ge 19:2</a>; <a onClick="return mV(\'2Ch\',36,15);">2Ch 36:15</a>; <a onClick="return mV(\'Hsa\',6,4);">Ho 6:4</a>; <a onClick="return mV(\'Luk\',24,22);">Lu 24:22</a>). Sometimes it refers to the beginning of the season, eg. the early rain (<a onClick="return mV(\'Psa\',84,6);">Ps 84:6</a>; <a onClick="return mV(\'Jam\',5,7);">Jas 5:7</a>; see <a href="./study/isbe/search.html?string=RAIN">RAIN</a>). It may also have the sense of "speedily" (<a onClick="return mV(\'Psa\',46,5);">Ps 46:5</a>). The early morning is frequently commended as the hour for prayer. See examples of Jesus (<a onClick="return mV(\'Mar\',1,35);">Mr 1:35</a>; <a onClick="return mV(\'Luk\',21,38);">Lu 21:38</a>; <a onClick="return mV(\'Jhn\',8,2);">Joh 8:2</a>); also Abraham (<a onClick="return mV(\'Gen\',19,27);">Ge 19:27</a>), Jacob (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>), Gideon (<a onClick="return mV(\'Jdg\',6,38);">Jud 6:38</a>), Samuel (<a onClick="return mV(\'1Sa\',15,12);">1Sa 15:12</a>), David (<a onClick="return mV(\'1Sa\',17,20);">1Sa 17:20</a>).``64';
isbe[2841]='Earnest`ur\'-nest (arrhabon):<P>Found three times in the New Testament: The "earnest of our inheritance" (<a onClick="return mV(\'Eph\',1,14);">Eph 1:14</a>); "the earnest of the Spirit" (<a onClick="return mV(\'2Cr\',1,22);">2Co 1:22</a>; <a onClick="return mV(\'2Cr\',5,5);">5:5</a>).<P>It has an equivalent in Hebrew \'erabhon (found in <a onClick="return mV(\'Gen\',38,17,18,20);">Ge 38:17-18, 20</a>), in Latin arrabo, French arrhes and the Old English arles. The term is mercantile and comes originally from the Phoenicians. Its general meaning is that of a pledge or token given as the assurance of the fulfillment of a bargain or promise. It also carries with it the idea of forfeit, such as is now common in land deals, only from the obverse side. In other words, the one promising to convey property, wages or blessing binds the promise with an advance gift or pledge partaking of the quality of the benefit to be bestowed. If the agreement be about wages, then a part of the wages is advanced; if it be about land, then a clod given to the purchaser or beneficiary may stand as the pledge of final and complete conveyance of the property.<P>Figurative: In the spiritual sense, as used in the passages above named, the reference is to the work of the Spirit of God in our hearts being a token and pledge of a perfect redemption and a heavenly inheritance. There is more than the idea of security in the word as used, for it clearly implies the continuity and identity of the blessing.``158';
isbe[2842]='Earring`er\'-ring:<P>An ornamental pendant of some kind hanging from the ears has been worn by both sexes in oriental lands from the earliest times. Among the Greeks and Romans, as with western peoples in general, its use was confined to females. The ears in the statue of the Medicean Venus are pierced and probably were originally ornamented with earrings. It is clear, however, that among the Hebrews and related oriental peoples earrings were worn by both sexes. Abraham\'s servant "put the earring upon (Rebekah\'s) face, and the bracelets upon her hands" (<a onClick="return mV(\'Gen\',24,47);">Ge 24:47</a> King James Version), in accordance with custom, evidently, but it is implied that it was customary for men also to wear earrings, in that the relatives and friends of Job "every one (gave him) an earring of gold" (<a onClick="return mV(\'Job\',42,11);">Job 42:11</a> King James Version).<P>Such ornaments were usually made of gold, finely wrought, and often set with precious stones, as archaeology has shown. Such jewels were worn in ancient times for protective as well as for decorative purposes. the Revised Version (British and American) renders "amulets" for the King James Version "earrings" in <a onClick="return mV(\'Isa\',3,20);">Isa 3:20</a>, the Hebrew word (lechashim) being elsewhere associated with serpent-charming; but the earrings of <a onClick="return mV(\'Gen\',35,4);">Ge 35:4</a>, also, were more than mere ornaments, so the King James Version and the Revised Version (British and American) may both be right in their renderings here (Kennedy). The influence of Egypt, where amulets of various kinds were worn by men and gods, by the living and the dead, is shown by recent excavations at Gezer, Taanach and Megiddo.`<a href="./study/isbe/search.html?string=AMULET">AMULET</a>; <a href="./study/isbe/search.html?string=ORNAMENT">ORNAMENT</a>`47';
isbe[2843]='Earth`urth (\'adhamah, \'erets, \'aphar; ge, oikoumene):<P>In a hilly limestone country like Palestine, the small amount of iron oxide in the rocks tends to be oxidized, and thereby to give a prevailing reddish color to the soil. This is especially the case on relatively barren hills where there is little organic matter present to prevent reddening and give a more blackish tinge.<p>\'Adhamah (compare \'adham, "a man," and Adam) is from \'adham, "to be red," and is used in the senses: "earth" (<a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>), "land" (<a onClick="return mV(\'Psa\',105,35);">Ps 105:35</a>), a "land" or country (<a onClick="return mV(\'Isa\',14,2);">Isa 14:2</a>), "ground" (<a onClick="return mV(\'Gen\',4,11);">Ge 4:11</a>), "the earth" (<a onClick="return mV(\'Gen\',7,4);">Ge 7:4</a>).<P>The word most in use is \'erets, undoubtedly from a most ancient root occurring in many languages, as English "earth," German Erde, Arabic \'ard. It is used in most of the senses of \'adhamah, but less as "soil" and more as "the earth" as a part of the universe; frequently with shamayim, "heavens," as in <a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a>: "In the beginning God created the heavens and the earth."<P>\'Aphar and its root word and derivatives are closely paralleled in the Arabic, and refer mainly to "dust" or "dry earth" (compare Arabic \'afir, "to be of the color of dust"; \'afar "dust"; ya\'fur, "a gazelle"; Hebrew \'opher, "a gazelle"). Compare <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>: "Yahweh God formed man of the dust of the ground"; <a onClick="return mV(\'Job\',2,12);">Job 2:12</a>: "...sprinkled dust upon their heads"; <a onClick="return mV(\'Psa\',104,29);">Ps 104:29</a>: "...they die, and return to their dust"; <a onClick="return mV(\'Gen\',18,27);">Ge 18:27</a>: "dust and ashes."<P>In the Septuagint and New Testament, ge is used in nearly all cases, oikoumene being used a few times for the "habitable earth," as in <a onClick="return mV(\'Luk\',21,26);">Lu 21:26</a> the King James Version.`<a href="./study/isbe/search.html?string=WORLD">WORLD</a>; <a href="./study/isbe/search.html?string=ANTHROPOLOGY">ANTHROPOLOGY</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=EVOLUTION">EVOLUTION</a>`1';
isbe[2844]='Earth, Circle of the``<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2845]='Earth, Corners of the`The "corners" or "ends" of the earth are its "wings" (kanephoth ha-\'arets), i.e. its borders or extremities. The word in general means a wing, because the wing of a bird is used as a covering for its young, and from this meaning it acquires that of the extremity of anything stretched out. It is thus used in <a onClick="return mV(\'Deu\',22,12);">De 22:12</a>: "Thou shalt make thee fringes upon the four borders (wings) of thy vesture, wherewith thou coverest thyself." It thus also means the coasts or boundaries of the land surface of the earth; its extremities. It is translated "corners" in <a onClick="return mV(\'Isa\',11,12);">Isa 11:12</a>; "ends" in <a onClick="return mV(\'Job\',37,3);">Job 37:3</a>, <a onClick="return mV(\'Job\',38,13);">38:13</a>. The "four corners" of the earth (<a onClick="return mV(\'Isa\',11,12);">Isa 11:12</a>) or "land" (<a onClick="return mV(\'Eze\',7,2);">Eze 7:2</a>) are therefore simply the extremities of the land in the four cardinal directions.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`119';

isbe[2849]='Earth, Vault, of the`volt:<P>In one passage God is said to have "founded his vault (\'aghuddah) upon the earth" (<a onClick="return mV(\'Amo\',9,6);">Am 9:6</a>). It is not quite certain whether this dome or vault refers to the earth itself, or to the heavens arched above it.<P>The latter is the usual interpretation, but in either case the reference is rather to the strength of the structure than to its form; the word implying something that is firmly bound together and hence, an arch or dome because of its stability.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2850]='Earthen Vessels`urth\'-\'-n, (cheres, yetser; ostrakinos):<P>These vessels were heat-resisting and were used for cooking and for boiling clothes (<a onClick="return mV(\'Lev\',6,28);">Le 6:28</a>; <a onClick="return mV(\'Lev\',11,33);">11:33</a>; <a onClick="return mV(\'Lev\',14,5,50);">14:5, 50</a>). They were probably non-porous and took the place of the kidri or ma\'ajin used in Syria today. A traveler in the interior of Palestine may still meet with the hospitality showed to David (<a onClick="return mV(\'2Sa\',17,28);">2Sa 17:28</a>). The generous natives brought not only gifts of food but the necessary vessels in which to cook it. An earthen vessel was used to preserve a land deed (<a onClick="return mV(\'Jer\',32,14);">Jer 32:14</a>).<P>Figurative: In <a onClick="return mV(\'Jer\',19,1);">Jer 19:1</a> breaking of an earthen vessel was symbolical of the destruction of Jerusalem. These vessels were also used to symbolize the commonness (<a onClick="return mV(\'Lam\',4,2);">La 4:2</a>) and frailness of our bodies (<a onClick="return mV(\'2Cr\',4,7);">2Co 4:7</a>).`<a href="./study/isbe/search.html?string=POTTERY">POTTERY</a>`133';
isbe[2851]='Earthly`urth\'-li (epigeios, "existing upon the earth," "terrestrial," from epi, "upon" and ge, "earth"; Vulgate (Jerome\'s Latin Bible, 390-405 AD.) terrenus):<P>Of or pertaining to the earth, or to the present state of existence. The word epigeios is not found in Septuagint, but occurs in classical Greek from Plato down. In Plutarch Mor. 566 D, it occurs in the remarkable phrase, "that which is earthly of the soul."<P>Its meaning is primarily merely local ("being on the earth"). The word ge ("earth") has not in itself an ethical significance, and does not carry a suggestion of moral taint, such as the word kosmos ("world") has, especially in the Johannine writings, and sarx ("flesh"), especially in Paul. It does, however, suggest a certain limitation or frailty; and in some passages, the context gives the adjective epigeios an ethical color, though in the New Testament the purely local meaning is never lost sight of. It is translated "earthly" in the following passages:<P>(1) <a onClick="return mV(\'Jhn\',3,12);">Joh 3:12</a>, "if I told you earthly things," i.e. things which are realized on earth, things within the circle of human observation, truths of subjective experience (eg. the new birth); in contrast to "heavenly things," the objective truths which, as not directly realizable in human experience, must be revealed from above (the mysteries of the Divine purpose and plans). Clearly "earthly" here implies no moral contrast to the heavenly or spiritual.<P>(2) <a onClick="return mV(\'2Cr\',5,1);">2Co 5:1</a>, "the earthly house of our tabernacle," i.e. the body with which we are clothed on earth, in contrast to the spiritual resurrection-body, "which is from heaven" (verse <a onClick="return mV(\'2Cr\',5,2);">2</a>). Here again the word has a merely local, not an ethical, significance.<P>(3) <a onClick="return mV(\'Phl\',3,19);">Php 3:19</a>, "whose glory is in their shame, who mind earthly things," i.e. whose thoughts rest on earth, on the pleasures of life here below.<P>(4) <a onClick="return mV(\'Jam\',3,15);">Jas 3:15</a>, "This wisdom is not a wisdom that cometh down from above, but is earthly," i.e. it is on the plane of life on earth, merely human, incapable of ascending to the level of Divine wisdom. In the last two passages, the literal local meaning is still evident, but the word shades off into the moral and suggests that which is opposed to the spiritual in character. The same word is translated "terrestrial" in <a onClick="return mV(\'1Cr\',15,40);">1Co 15:40</a>, and "things in (the Revised Version (British and American) "on") earth" in <a onClick="return mV(\'Phl\',2,10);">Php 2:10</a> the King James Version has "earthly" in <a onClick="return mV(\'Jhn\',3,31);">Joh 3:31</a>, where it translates ek tes ges = literally, "out of the earth," the reference being to the character and mission of the Baptist as partaking of the limitations of his earthly (human) origin, in contrast to the Messiah "that cometh from heaven." The the King James Version rendering is somewhat misleading, for it introduces a confusion with the "earthly" of <a onClick="return mV(\'Jhn\',3,12);">Joh 3:12</a> (see Westcott in the place cited.). The Revised Version (British and American) rightly renders "of the earth."<P>"Earthly" is to be distinguished from "earthy" = made of earth or clay (choikos, from chous, "earth dug out," <a onClick="return mV(\'1Cr\',15,47);">1Co 15:47</a>ff).``49';
isbe[2852]='Earthquake`urth\'-kwak (ra\'ash; seismos):<P>1. Earthquakes in Palestine: The last earthquake which worked any damage in Palestine and Syria occurred in 1837, and destroyed the village of Safed, near Mt. Hermon, and was felt even all the way to Hebron. Since that time a few feeble shocks have been felt but no damage was done. The region is just on the edge of the great earthquake circle whose center is in Armenia, and is liable to earthquakes. The large number of references in the Bible to earthquakes, and the evident fear in the minds of the people of those times, would seem to indicate that they were more frequent in Bible times than recently.<P>2. Causes of Earthquakes: There are three main causes of earthquakes:<P>(1) Earthslips. In the slow process of cooling, the crust of the earth tends to wrinkle and fold as it contracts. This causes a stress to be set up in the strata composing the crust. If the strata are too rigid to bend there must come after a time a break or fault. The shock caused by the break, which is usually several miles below the surface of the earth, is an earthquake, and it spreads in the form of earth waves from the break as center. Seismographs in all parts of the world are now adjusted to receive the waves even though the origin is on the opposite side of the earth.<P>(2) Explosion of Steam or Gases under the Surface. Some earthquakes, especially those underneath the sea, are thought to be caused by water seeping through the soil and rocks and finding its way to the heated masses below. Steam is formed and if there is no escape for it, an explosion takes place whose force is felt on the surface.<P>(3) Volcanic. As earthquakes are of common occurrence in volcanic regions it seems likely that there is some connection between the two, but the relation has not been fully traced. It may be that the second cause is the origin of both the volcano and earthquake.<P>See further, <a href="./study/isbe/search.html?string=DELUGE+OF+NOAH">DELUGE OF NOAH</a>.<P>3. Earthquakes in Jerusalem: Many destructive earthquakes have been recorded in the history of Syria, but they have been mostly in the north, in the region of Aleppo. Jerusalem itself has seldom been affected by earthquakes. The Hauran beyond the Jordan is covered with volcanic remains and signs of violent shocks, and the cities on the coast have suffered much, but Jerusalem on the higher ground between has usually escaped with little destruction.<P>4. Earthquakes in Scripture: A number of earthquakes are mentioned in the Scriptures:<p class="in15">(1) At Mount Sinai (<a onClick="return mV(\'Exd\',19,18);">Ex 19:18</a>);<p class="in15">(2) Korah and companions destroyed in fissure and sinking ground (<a onClick="return mV(\'Num\',16,31);">Nu 16:31</a> Ant, IV, iii, 3);<p class="in15">(3) in the Philistine camp in the days of Saul (<a onClick="return mV(\'1Sa\',14,15);">1Sa 14:15</a>);<p class="in15">(4) after Elijah\'s flight (<a onClick="return mV(\'1Ki\',19,11);">1Ki 19:11</a>);<p class="in15">(5) in the reign of Uzziah, between 790 and 740 BC (<a onClick="return mV(\'Amo\',1,1);">Am 1:1</a>); <a onClick="return mV(\'Zec\',14,5);">Zec 14:5</a> probably refers to the same (Ant., IX, x, 4);<p class="in15">(6) at Christ\'s death (<a onClick="return mV(\'Mat\',27,\'51-54\');">Mt 27:51-54</a>);<p class="in15">(7) at Christ\'s resurrection (<a onClick="return mV(\'Mat\',28,2);">Mt 28:2</a>);<p class="in15">(8) at Philippi when Paul and Silas were freed from prison (<a onClick="return mV(\'Act\',16,26);">Ac 16:26</a>).<p>Most of these shocks seem to have been slight and caused little loss of life. Josephus mentions one in the reign of Herod, "such as had not happened at any other time, which was very destructive to men and cattle" (Ant., XV, v, 2). Professor G. A. Smith in his recent work on Jerusalem is of the opinion that earthquakes were sufficiently frequent and strong to account for the appearance and disappearance of Nehemiah\'s Fountain (Jerus, I, 74). The Hebrew ra\'ash is commonly used to mean a great noise. Large earthquakes are sometimes accompanied by a rumbling noise, but as a rule they come silently and without warning.<P>5. Symbolic Use: In the Scriptures earthquakes are mentioned as tokens of God\'s power (<a onClick="return mV(\'Job\',9,6);">Job 9:6</a>) and of His presence and anger (<a onClick="return mV(\'Psa\',68,8);">Ps 68:8</a>; <a onClick="return mV(\'Psa\',18,7);">18:7</a>; <a onClick="return mV(\'Isa\',13,13);">Isa 13:13</a>): "She shall be visited of Yahweh of hosts....with earthquake, and great noise" (<a onClick="return mV(\'Isa\',29,6);">Isa 29:6</a>); also as a sign of Christ\'s "coming, and of the end of the world" (<a onClick="return mV(\'Mat\',24,\'3-7\');">Mt 24:3-7</a>). See also <a onClick="return mV(\'Rev\',11,13,19);">Re 11:13, 19</a>; <a onClick="return mV(\'Rev\',16,18);">16:18</a>.<P>LITERATURE. Milne, Earthquakes (Inter. Scient. series); Plumptre, Biblical Studies, 136; Dutton, Earthquakes.``85';
isbe[2853]='Ease`ez (sha\'anan, shal\'anan, chiefly, "at ease"):<P>Used 19 times in the Old Testament and once in the New Testament, most frequently meaning tranquillity, security or comfort of mind; in an ethical sense, indicating carelessness or indifference with reference to one\'s moral or religious interests.<P>The prophet Jeremiah used the phrase as an indication of national or tribal indifference: "Moab hath been at ease from his youth" (<a onClick="return mV(\'Jer\',48,11);">Jer 48:11</a>); "I am very sore displeased with the nations that are at ease" (<a onClick="return mV(\'Zec\',1,15);">Zec 1:15</a>). Frequent allusions are made also by various prophets to individuals or groups of individuals, as "Woe to them that are at ease in Zion" (<a onClick="return mV(\'Amo\',6,1);">Am 6:1</a>); "Rise up, ye women that are at ease" (<a onClick="return mV(\'Isa\',32,9);">Isa 32:9</a>), and "Tremble, ye women that are at ease" (<a onClick="return mV(\'Isa\',32,11);">Isa 32:11</a>).<P>The word in another form is used also in a verbal sense and to apply to physical ease and comfort, as "My couch shall ease my complaint" (<a onClick="return mV(\'Job\',7,13);">Job 7:13</a> compare especially <a onClick="return mV(\'2Ch\',10,4,9);">2Ch 10:4, 9</a>). Simple mental tranquillity or peace of mind is also expressed by it (<a onClick="return mV(\'Jer\',46,27);">Jer 46:27</a>).<P>The single instance of its use in the New Testament is illustrative of its figurative but most common usage in the Old Testament, where it refers to moral indifference in the parable of the Rich Fool: "Soul...take thine ease, eat, drink, be merry" (<a onClick="return mV(\'Luk\',12,19);">Lu 12:19</a>).``25';
isbe[2854]='East (Eastern), Sea`es\'-tern (<a onClick="return mV(\'Zec\',14,8);">Zec 14:8</a>).`<a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>`1';
isbe[2855]='East Country`kun\'-tri (\'erets mizrach):<P>Lit. "country of the sunrise" over against the "country of the sunset" (<a onClick="return mV(\'Zec\',8,7);">Zec 8:7</a>). The two together form a poetical expression indicating the whole earth.``1';
