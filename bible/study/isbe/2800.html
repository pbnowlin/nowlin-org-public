isbe[2801]='Drawer of Water`dro\'-er, (sho\'ebh mayim, from sha\'abh, "to bale up" water): In Syria and Palestine, outside of Mt. Lebanon and the Anti-Lebanon, the springs of water are scarce and the inhabitants of these less favored places have always depended upon wells and cisterns for their water supply. This necessitates some device for drawing the water. In the case of a cistern or shallow well, an earthenware water jar or a bucket made of tanned goats\' skin is lowered into the water by a rope and then raised by pulling up the rope hand over hand (probably the ancient method), or by running the rope over a crude pulley fixed directly over the cistern or well. In the case of deep wells, the rope, attached to a larger bucket, is run over a pulley so that the water may be raised by the drawers walking away from the well as they pull the rope. Frequently animals are hitched to the rope to do the pulling.<P>In some districts where the water level is not too deep, a flight of steps leading down to the water\'s edge is constructed in addition to the opening vertically above the water. Such a well is pointed out near Haran in Mesopotamia as the one from which Rebekah drew water for Abraham\'s servant. In <a onClick="return mV(\'Gen\',24,16);">Ge 24:16</a> we read that Rebekah "went down to the fountain, and filled her pitcher, and came up."<P>The deep grooves in their curbs, worn by the ropes as the water was being raised, attest to the antiquity of many of the wells of Palestine and Syria. Any one of the hundreds of grooves around a single well was many years in being formed. The fact that the present method of drawing water from these wells is not making these grooves, shows that they are the work of former times.<P>The drawing of water was considered the work of women or of men unfit for other service (<a onClick="return mV(\'Gen\',24,11,13,43);">Ge 24:11, 13, 43</a>; <a onClick="return mV(\'1Sa\',9,11);">1Sa 9:11</a>; <a onClick="return mV(\'Jhn\',4,7);">Joh 4:7</a>). In Syria, today, a girl servant willingly goes to draw the daily supply of water, but seldom is it possible to persuade a boy or man to perform this service. When the well or fountain is at a distance, or much water is needed, tanned skins or earthen jars are filled and transported on the backs of men or donkeys.<P>Water drawing was usually done at evening time (<a onClick="return mV(\'Gen\',24,11);">Ge 24:11</a>), and this custom has remained unchanged. There is no sight more interesting than the daily concourse at a Syrian water source. It is bound to remind one of the Bible stories where the setting is a wellside (<a onClick="return mV(\'Gen\',24,\'1-\');">Ge 24</a>; <a onClick="return mV(\'Jhn\',4,\'1-\');">Joh 4</a>).<P>The service of water drawing was associated, in early times, with that of hewer of wood (<a onClick="return mV(\'Deu\',29,11);">De 29:11</a>). Joshua made the Gibeonites hewers of wood and drawers of water in exchange for their lives (<a onClick="return mV(\'Jos\',9,21,23,27);">Jos 9:21, 23, 27</a>). The inhabitants of Nineveh were exhorted to draw water and fill the cisterns of their fortresses in preparation for a siege (<a onClick="return mV(\'Nah\',3,14);">Na 3:14</a>).<P>Figurative: Water drawing is mentioned in the metaphor of <a onClick="return mV(\'Isa\',12,3);">Isa 12:3</a>, "Ye draw water out of the wells of salvation."``133';
isbe[2802]='Dream; Dreamer`drem, drem\'-er (chalom, chelem; onar): In all time dreams and their interpretation have been the occasion of much curious and speculative inquiry. Because of the mystery by which they have been enshrouded, and growing out of a natural curiosity to know the future, much significance has been attached to them by people especially of the lower stages of culture. Even the cultured are not without a superstitious awe and dread of dreams, attaching to them different interpretations according to local color and custom.<P>Naturally enough, as with all other normal and natural phenomena for which men could assign no scientific and rational explanation, they would be looked upon with a certain degree of superstitious fear. "Dreams, Which are the children of an idle brain, Begot of nothing but vain fantasy, Which is as thin of substance as the air And more inconstant than the wind." —Shakespeare.<P>1. Physiological and Psychological Ground:<P>While a fully satisfactory theory of dreams has not yet been established and while it is hardly possible that there will ever be a satisfactory explanation for each individual dream, yet through the rapid discoveries of physiological psychology in the recent decade or more, much new light is thrown on the subject. With the contribution modern psychology has made to our knowledge of the association of ideas through the connected relation of certain cortical centers and areas, it has come to be pretty well established that the excitation of certain bodily organs or surfaces will stimulate certain brain areas. Conversely the stimulation of certain cortical areas will produce a response in certain bodily regions over which these centers or areas preside.<P>Connecting thought processes are therefore dependent upon the proper correlation of ideas through what are known physiologically as the association centers. If then it comes to pass that, as occurs in dreams, only fragmentary ideas or loosely connected trains of thought occur, and if, as frequently happens, there is momentary connection, but little connection with normal waking experience, it will easily be seen that the excitation of certain centers will awaken certain trains of thought which are but poorly related to the balance of one\'s thinking processes. Much is being said about the dissociation of ideas and the disturbance of personality of which dreams are one of several forms. Others are hallucinations, trances, visions, etc.<P>Dreams are abnormal and sometimes pathological. Sleep is a normal experience. Perfect and natural sleep should be without dreams of any conscious occurrence. Perhaps psychologically there can be no such thing as perfectly dreamless sleep. Such a condition would probably be death itself. Nature doubtless has her silent vigils, keeping watch in the chambers of the soul during the deepest sleep. The only difference is that they do not come to the threshold of consciousness. Thus, dreams are to the sleeping state what visions and hallucinations are to the waking state, and like them have their ground in a distorted image-making function. While the source of the materials and the excitant may not be the same in each case, yet functionally they are the same.<P>The stimuli of dreams may be of two kinds. First, they may be physical and objective, or they may be due to suggestions and the association of ideas. They may be due to some physical disorder, such as imperfect digestion or circulation, improper ventilation or heating, or an uncomfortable position. Since by the very nature of the case dreams do not occur in a conscious state, the real cause cannot easily be discoverable and then only after the subject is entirely awakened through the effects of it.<P>They may also be due to the association of ideas. Suggestion plays a large part. The vividness and recency of a conscious impression during the waking state may be thrown up from the subconscious region during the sleeping hours. The usual distorted aspect of dreams is doubtless due to the uncoupling of groups of ideas through the uncoupling of the cortical association areas, some of them being less susceptible than others to the existing stimulus.<P>The materials of dreams need not be recent; they may have been furnished by the conscious processes a long time before, but are brought to the threshold only by means of some train of ideas during a semi-conscious state. It is interesting to note that while time and space seem quite real in dreams, the amount covered in a single dream may occupy but a moment of time for the dreamer.<P>2. History of Belief in Dreams:<P>Dreams have always played an important part in the literature and religion of all peoples. They have furnished mythologies; they have been the sources of systems of necromancy; they have become both the source and the explanation of otherwise inexplicable acts of Providence. Growing out of them we have a theory of nightmares and demonology. They have become the working material of the prophet both Biblical and pagan. Medieval civilization is not without its lasting effects of dreams, and modern civilization still clings with something of reverence to the unsolved mystery of certain dreams. While we have almost emerged from anything like a slavish adherence to a superstitious belief in dreams, we must still admit the possibility of the profound significance of dreams in the impressions they make upon the subject.<P>3. Dreams in the Old Testament:<P>The Bible, contrary to a notion perhaps too commonly held, attaches relatively little religious significance to dreams. Occasionally, however, reference is made to communications from God through dreams (<a onClick="return mV(\'Gen\',20,6);">Ge 20:6</a>; <a onClick="return mV(\'1Ki\',3,5);">1Ki 3:5</a>; <a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>; <a onClick="return mV(\'Mat\',2,12,13,19,22);">2:12-13, 19, 22</a>). It recognizes their human relations more frequently. In the Old Testament literature, dreams play but little part except in the Books of Genesis and Daniel, in which there are abundant references to them. For their moral bearings the most important ones perhaps are those referred to in <a onClick="return mV(\'Gen\',37,\'5-10\');">Ge 37:5-10</a>. An uncritical attitude will give to them a lifeless and mechanical interpretation. A sympathetic and rational explanation gives them beauty, naturalness and significance. Joseph was the youngest and most beloved son of Jacob. He was just in the prime of adolescence, the very period of day dreaming. He was perhaps inordinately ambitious. This was doubtless heightened by the attentions of a doting father. The most natural dream would be that suggested by his usual waking state, which was one of ambition and perhaps unhealthy rivalry (see <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY, sec. II, 6</a>). The source of Pharaoh\'s dreams and his solicitude are likewise capable of interpretation on somewhat natural grounds (<a onClick="return mV(\'Gen\',41,\'7-32\');">Ge 41:7-32</a>). The significance of them was given by Joseph.<P>Another illustration of the psychological exposition preceding is the dream of Solomon (<a onClick="return mV(\'1Ki\',3,5,\'11-15\');">1Ki 3:5, 11-15</a>). In this narrative, after Solomon had done what pleased Yahweh and had offered a most humble prayer on an occasion which to him was a great crisis and at the same time a moment of great ecstasy in his life, he doubtless experiences a feeling of sweet peace in consequence of it. His sleep would naturally be somewhat disturbed by the excitement of the day. The dream was suggested by the associations and naturally enough was the approving voice of Yahweh.<P>Dreaming and the prophetic function seem to have been closely associated (<a onClick="return mV(\'Deu\',13,1,3,5);">De 13:1, 3, 5</a>). Whether from a coldly mechanical and superstitious, a miraculous, or a perfectly natural point of view, this relation is consistent. The prophet must be a seer, a man of visions and ideals. As such he would be subject, as in his waking states, so in his sleeping states, to extraordinary experiences. The remarkable dreams of Nebuchadnezzar, who stands out as an exceptional example, afford an illustration of what may be styled a disturbed personality (<a onClick="return mV(\'Dan\',2,\'3-45\');">Da 2:3-45</a>; <a onClick="return mV(\'Dan\',4,\'5-19\');">4:5-19</a>). The effort made by the magicians, the enchanters, the Chaldeans, and the soothsayers, according to the best skill of the Orientals, was unavailing. Daniel, whether by extraordinary intellectual insight or by Divine communication, was able by his interpretation and its moral to set before the king a powerful lesson.<P>The New Testament gives still less place and importance to dreams than the Old Testament. There are only six references and one citation to dreams or dreamers. It is significant that all these references are by Matthew, and still more significant that Jesus nowhere refers to dreams, evidently attaching little if any importance to them. The references in Matthew are confined entirely to warnings and announcements (<a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>; <a onClick="return mV(\'Mat\',2,12,13,19,22);">2:12-13, 19, 22</a>; <a onClick="return mV(\'Mat\',27,19);">27:19</a>). Once a citation (<a onClick="return mV(\'Act\',2,17);">Ac 2:17</a>) is used for illustrative purposes (compare <a onClick="return mV(\'Joe\',2,28);">Joe 2:28</a>). See also <a href="./study/isbe/search.html?string=AUGURY">AUGURY, IV, 5</a>; <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION, VI,1,l(b)</a>; <a href="./study/isbe/search.html?string=MAGIC">MAGIC</a>; <a href="./study/isbe/search.html?string=REVELATION">REVELATION</a>.<P>Whether God communicates directly or indirectly by dreams is still unsettled. With our present knowledge of spirit communication it would not seem unreasonable to assume that He may reveal Himself directly; and yet on the other hand the safest and perhaps surest explanation for our own day and experience is that in dream states the mind is more impressionable and responsive to natural causes through which God speaks and operates. That dreams have been and are valuable means of shaping men\'s thoughts and careers cannot be denied, and as such, have played an important part in the social and moral life of individuals and of society. A valuable modern illustration of this is the dream of Adoniram Judson Gordon (see How Christ Came to Church), through the influence of which his entire religious life and that of his church were completely transformed.<P>LITERATURE.<P>Judd, Psychology; Cutten, The Psychological Phenomena of Christianity; Ladd, Philosophy of Knowledge; Baldwin, Dictionary of Philosophy and Psychology; Ellis, The World of Dreams (Houghton, Mifflin Co.).``25';
isbe[2803]='Dredge`drej: A mixture of oats and barley (<a onClick="return mV(\'Job\',24,6);">Job 24:6</a> the King James Version margin; the King James Version "corn"; the Revised Version (British and American) "provender"). The Hebrew word is belil, usually "mixed grain," ZDMG, XLVIII, 236: grain not ground and boiled in water. Compare <a onClick="return mV(\'Job\',6,5);">Job 6:5</a>; <a onClick="return mV(\'Isa\',30,24);">Isa 30:24</a>.``1';
isbe[2804]='Dregs`dregs: The "sediments," "lees," "grounds of liquor"; only in plural. In the King James Version it stands for:<P>(1) Hebrew qubba\'ath, "bowl," "chalice," found only in <a onClick="return mV(\'Isa\',51,17,22);">Isa 51:17, 22</a>: "the dregs of the cup of trembling"; "the dregs of the cup of my fury." the Revised Version (British and American) correctly changes "dregs" into "bowl."<P>(2) Hebrew shemarim, "sediments" or "dregs," especially lees of wine. "The dregs thereof, all the wicked of the earth shall wring (the American Standard Revised Version "drain") them out and drink them" (<a onClick="return mV(\'Psa\',75,8);">Ps 75:8</a>), i.e. God gives to the wicked the cup of wrathful judgment, which they must drink to the last drop.``1';
isbe[2805]='Dress`In the Hebrew and Greek there is a wonderful wealth of terminology having to do with the general subject of dress among the ancient Orientals. This is reflected in the numerous synonyms for "dress" to be found in English Versions of the Bible, "apparel," "attire," "clothes," "raiment," "garments," etc. But the words used in the originals are often greatly obscured through the inconsistent variations of the translators. Besides there are few indications even in the original Hebrew or Greek of the exact shape or specific materials of the various articles of dress named, and so their identification is made doubly difficult. In dealing with the subject, therefore, the most reliable sources of information, apart from the meaning of the terms used in characterization, are certain well-known facts about the costumes and dress-customs of the orthodox Jews, and others about the forms of dress worn today by the people of simple life and primitive habits in modern Palestine. Thanks to the ultraconservatism and unchanging usages of the nearer East, this is no mean help. In the endeavor to discover, distinguish and deal with the various oriental garments, then, we will consider:<P>1. The Meaning of Terms;<P>2. The Materials;<P>3. The Outer Garments;<P>4. The Inner Garments;<P>5. The Headdress;<P>6. The Foot-gear;<P>7. The Dress of Jesus and His Disciples.<hr /><P>1. Meaning of Terms:<P>There was originally a sharp distinction between classical and oriental costume, but this was palpably lessened under the cosmopolitanism of the Roman Empire. This of course had its effect both in the modification of the fashions of the day and upon the words used for articles of clothing in the New Testament.<P>(1) The terms most used for clothes in general were, in the Old Testament, cadhin, simlah, salmah, and in the New Testament himation (<a onClick="return mV(\'Mat\',21,7);">Mt 21:7</a>; <a onClick="return mV(\'Mat\',24,18);">24:18</a>; <a onClick="return mV(\'Mat\',26,65);">26:65</a>; <a onClick="return mV(\'Luk\',8,27);">Lu 8:27</a>) and enduma (<a onClick="return mV(\'Mat\',22,11);">Mt 22:11</a>f; compare <a onClick="return mV(\'Mat\',7,15);">Mt 7:15</a>), plural, though the oldest and most widely distributed article of human apparel was probably the "loin-cloth" (Hebrew \'ezor), entirely different from "girdle" (Greek zone). Biblical references for clothes are nearly all to the costume of the males, owing doubtless to the fact that the garments ordinarily used indoors were worn alike by men and women.<P>(2) The three normal body garments, the ones most mentioned in the Scriptures, are cadjin, a rather long "under garment" provided with sleeves; kethoneth (Greek chiton), a long-sleeved tunic worn over the cadhin, likewise a shirt with sleeves (see Masterman, DCG, article "Dress"); and simlah (Greek himation), the cloak of the King James Version and the Revised Version (British and American), used in the plural for "garments" in general; and the "girdle" (Greek zone; Arabic zunnar). The "headdress" (two types are now in use, the "turban" and the "kufiyeh") is never definitely named in the Bible, though we know it was the universal custom among ancient Orientals to cover the head.<P>(3) The simlah (Greek himation) signifies an "outer garment" (see below), a "mantle," or "cloak" (see lexicons). A kindred word in the Greek himatismos, (translated "raiment" in <a onClick="return mV(\'Luk\',9,29);">Lu 9:29</a>, "garments" in <a onClick="return mV(\'Mat\',27,35);">Mt 27:35</a>, and "vesture" in <a onClick="return mV(\'Jhn\',19,24);">Joh 19:24</a>) stands in antithesis to himation. The Greek chiton, Hebrew kethoneth, the "under garment," is translated "coat" in <a onClick="return mV(\'Mat\',5,40);">Mt 5:40</a>, "clothes" in <a onClick="return mV(\'Mar\',14,63);">Mr 14:63</a>. The Hebrew word me\'il, Greek stole, Latin stola, stands for a variety of garment used only by men of rank or of the priestly order, rendered the Revised Version (British and American) "robe." It stands for the long garments of the scribes rendered "long robes" (<a onClick="return mV(\'Mar\',12,38);">Mr 12:38</a>; <a onClick="return mV(\'Luk\',20,46);">Lu 20:46</a>) and "best robe" in the story of the Prodigal Son (<a onClick="return mV(\'Luk\',15,22);">Lu 15:22</a>). (For difference between me\'il and simlah, see Kennedy, one-vol HDB, 197.) Oriental influences led to the adoption of the long tunic in Rome, and in Cicero\'s time it was a mark of effeminacy. It came to be known in its white form as tunica alba, or "white tunic," afterward in English "alb."<P>Other New Testament terms are porphuran, the "purple" (<a onClick="return mV(\'Luk\',16,19);">Lu 16:19</a>); the purple robe of Jesus is called himation in <a onClick="return mV(\'Jhn\',19,2);">Joh 19:2</a>; lention, "the towel" with which Jesus girded himself (<a onClick="return mV(\'Jhn\',13,4,5);">13:4-5</a>); then othonion, "linen cloth" (<a onClick="return mV(\'Luk\',24,12);">Lu 24:12</a>; <a onClick="return mV(\'Jhn\',19,40);">Joh 19:40</a>); sindon, "linen cloth" (<a onClick="return mV(\'Mat\',27,59);">Mt 27:59</a>); and bussos, "fine linen" (<a onClick="return mV(\'Luk\',16,19);">Lu 16:19</a>).<P>The primitive "aprons" of <a onClick="return mV(\'Gen\',3,7);">Ge 3:7</a>, made of "sewed fig-leaves," were quite different from the "aprons" brought to the apostles in <a onClick="return mV(\'Act\',19,12);">Ac 19:12</a>. The latter were of a species known among the Romans as semicinctium, a short "waist-cloth" worn especially by slaves (Rich, Dict. of Roman and Greek Antiq.).<P>2. The Materials:<P>Anthropology, Scripture and archaeology all witness to the use by primitive man of skins of animals as dress material (<a onClick="return mV(\'Gen\',3,21);">Ge 3:21</a>, "coats of skin"; compare <a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>, "went about in sheepskins, in goatskins").<P>Even today the traveler will occasionally see in Palestine a shepherd clad in "a coat of skin." Then, as now, goat\'s hair and camel\'s hair supplied the materials for the coarser fabrics of the poor. John the Baptist had his raiment, enduma, of camel\'s hair (literally, "of camel\'s hairs," <a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>). This was a coarse cloth made by weaving camel\'s hairs. There is no evidence that coats of camel\'s skin, like those made of goat\'s skin or sheep\'s skin have ever been worn in the East, as imagined by painters (see Meyer, Bleek, Weiss and Broadus; but compare HDB, article "Camel"). The favorite materials, however, in Palestine, as throughout the Orient, in ancient times, were wool (see <a onClick="return mV(\'Pro\',27,26);">Pr 27:26</a>, "The lambs are for thy clothing") and flax (see <a onClick="return mV(\'Pro\',31,13);">Pr 31:13</a>, where it is said of the ideal woman of King Lemuel, "She seeketh wool and flax, and worketh willingly with her hands"). The finest quality of ancient "linen" seems to have been the product of Egypt (see <a href="./study/isbe/search.html?string=LINEN">LINEN</a>). The "silk" of <a onClick="return mV(\'Pro\',31,22);">Pr 31:22</a> the King James Version is really "fine linen," as in the Revised Version (British and American). The first certain mention of "silk" in the Bible, it is now conceded, is in <a onClick="return mV(\'Rev\',18,12);">Re 18:12</a>, as the word rendered "silk" in <a onClick="return mV(\'Eze\',16,10,13);">Eze 16:10, 13</a> is of doubtful meaning.<P>3. The Outer Garments:<P>(1) We may well begin here with the familiar saying of Jesus for a basal distinction: "If any man would go to law with thee, and take away thy coat (Greek chiton), let him have thy cloak (himation) also" (<a onClick="return mV(\'Mat\',5,40);">Mt 5:40</a>). Here the "coat" (Hebrew kethoneth) was the ordinary "inner garment" worn by the Jew of the day, in which he did the work of the day (see <a onClick="return mV(\'Mat\',24,18);">Mt 24:18</a>; <a onClick="return mV(\'Mar\',13,16);">Mr 13:16</a>). It resembled the Roman "tunic," corresponding most nearly to our "long shirt," reaching below the knees always, and, in case it was designed for dress occasions, reaching almost to the ground. Sometimes "two coats" were worn (<a onClick="return mV(\'Luk\',3,11);">Lu 3:11</a>; compare <a onClick="return mV(\'Mat\',10,10);">Mt 10:10</a>; <a onClick="return mV(\'Mar\',6,9);">Mr 6:9</a>), but in general only one. It was this garment of Jesus that is said by John (<a onClick="return mV(\'Jhn\',19,23);">Joh 19:23</a>) to have been "without seam, woven from the top throughout."<P>(2) The word himation, here rendered "cloak," denotes the well-known "outer garment" of the Jews (see <a onClick="return mV(\'Mat\',9,20,21);">Mt 9:20-21</a>; <a onClick="return mV(\'Mat\',14,36);">14:36</a>; <a onClick="return mV(\'Mat\',21,7-8);">21:7-8</a>; but compare also <a onClick="return mV(\'Mat\',9,16);">Mt 9:16</a>; <a onClick="return mV(\'Mat\',17,2);">17:2</a>; <a onClick="return mV(\'Mat\',24,18);">24:18</a>; <a onClick="return mV(\'Mat\',26,65);">26:65</a>; <a onClick="return mV(\'Mat\',27,31,35);">27:31, 35</a>). It appears in some cases to have been a loose robe, but in most others, certainly, it was a large square piece of cloth, like a modern shawl, which could be wrapped around the person, with more or less taste and comfort. Now these two, with the "girdle" (a necessary and almost universal article of oriental dress), were commonly all the garments worn by the ordinary man of the Orient. The "outer garment" was frequently used by the poor and by the traveler as his only covering at night, just as shawls are used among us now.<P>(3) The common Hebrew name for this "outer garment" in the Old Testament is as above, simlah or salmah. In most cases it was of "wool," though sometimes of "linen," and was as a rule certainly the counterpart of the himation of the Greek (this is its name throughout the New Testament). It answered, too, to the pallium of the Romans. It belonged, like them, not to the endumata, or garments "put on," but to the periblemata, or garments "wrapped, around" the body. It was concerning this "cloak" that the Law of Moses provided that, if it were taken in pawn, it should be returned before sunset—"for that is his only covering, it is his raiment for his skin: wherein shall he sleep?....for I am gracious" (<a onClick="return mV(\'Exd\',22,27);">Ex 22:27</a>). The Jewish tribunals would naturally, therefore, allow the "inner garment" to be taken by legal process, rather than the outer one (<a onClick="return mV(\'Mat\',5,40);">Mt 5:40</a>; <a onClick="return mV(\'Luk\',6,29);">Lu 6:29</a>); but Jesus virtually teaches that rather than have difficulty or indulge animosity one would better yield one\'s rights in this, as in other matters; compare <a onClick="return mV(\'1Cr\',6,7);">1Co 6:7</a>.<P>Some identify the simlah of the ancient Hebrews with modern aba, the coarse blouse or overcoat worn today by the Syrian peasant (Nowack, Benzinger, Mackie in HDB); but the distinction between these two garments of the Jews, so clearly made in the New Testament, seems to confirm the conclusion otherwise reached, that this Jewish "outer garment" closely resembled, if it was not identical with, the himation of the Greeks (see Jewish Encyclopedia, article "Cloke" and 1-vol HDB, "Dress," 197; but compare Masterman, DCG, article "Dress," 499, and Dearmer, DCG, article "Cloke"). In no respect has the variety of renderings in our English Versions of the Bible done more to conceal from English readers the meaning of the original than in the case of this word simlah. For instance it is the "garment" with which Noah\'s nakedness was covered (<a onClick="return mV(\'Gen\',9,23);">Ge 9:23</a>); the "clothes" in which the Hebrews bound up, their kneading-troughs (<a onClick="return mV(\'Exd\',12,34);">Ex 12:34</a>); the "garment" of Gideon in <a onClick="return mV(\'Jdg\',8,25);">Jud 8:25</a>; the "raiment" of Ruth (<a onClick="return mV(\'Rut\',3,3);">3:3</a>); just as the himation of the New Testament is the "cloak" of <a onClick="return mV(\'Mat\',5,40);">Mt 5:40</a>, the "clothes" of <a onClick="return mV(\'Mat\',24,18);">Mt 24:18</a> the King James Version (the Revised Version (British and American) "cloak"), the "garment" (<a onClick="return mV(\'Mar\',13,16);">Mr 13:16</a> the King James Version, the Revised Version (British and American) "cloak").<P>4. The Under Garments:<P>(1) In considering the under garments, contrary to the impression made by English Versions of the Bible, we must begin with the "loin-cloth" (Hebrew \'ezor), which unlike the "girdle" (see <a href="./study/isbe/search.html?string=GIRDLE">GIRDLE</a>), was always worn next to the skin. The figurative use made of it in <a onClick="return mV(\'Isa\',11,5);">Isa 11:5</a>, and <a onClick="return mV(\'Jer\',13,11);">Jer 13:11</a>, e. g. will be lost unless this is remembered. Often it was the only "under garment," as with certain of the prophets (Elijah, <a onClick="return mV(\'2Ki\',1,8);">2Ki 1:8</a>; compare John the Baptist, <a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>; <a onClick="return mV(\'Isa\',20,2);">Isa 20:2</a>; <a onClick="return mV(\'Jer\',13,1);">Jer 13:1</a>ff). In later times it was displaced among the Hebrews by the "shirt" or "tunic". The universal "sign of mourning" was the girding of the waist with an \'ezor or "hair-cloth" (English Versions, "sack-cloth"). A "loincloth" of "linen" was worn by the priests of early times and bore the special name of \'ephodh (<a onClick="return mV(\'1Sa\',2,18);">1Sa 2:18</a>; compare <a onClick="return mV(\'2Sa\',6,14);">2Sa 6:14</a>ff).<P>(2) The ordinary "under garment," later worn by all classes—certain special occasions and individuals being exceptions—was the "shirt" (Hebrew kethoneth) which, as we have seen, reappears as chiton in Greek, and tunica in Latin It is uniformly rendered "coat" in English Versions of the Bible, except that the Revised Version, margin has "tunic" in <a onClick="return mV(\'Jhn\',19,23);">Joh 19:23</a>. The well-known piece of Assyrian sculpture, representing the siege and capture of Lachish by Sennacherib, shows the Jewish captives, male and female, dressed in a moderately tight garment, fitting close to the neck (compare <a onClick="return mV(\'Job\',30,18);">Job 30:18</a>) and reaching almost to the ankles; which must represent the kethoneth, or kuttoneth of the period, as worn in towns at least. Probably the kuttoneth of the peasantry was both looser and shorter, resembling more the modern kamis of the Syrian fellah (compare Latin camisa, and English "chemise").<P>(3) As regards sleeves, they are not expressly mentioned in the Old Testament, but the Lachish tunics mentioned above have short sleeves, reaching half-way to the elbows. This probably represents the prevailing type of sleeve among the Hebrews of the earlier period. An early Egyptian picture of a group of Semitic traders (circa 2000 BC) shows a colored tunic without sleeves, which, fastened on the left shoulder, left the right bare. Another variety of sleeves, restricted to the upper and wealthy classes, had long and wide sleeves reaching to the ground. This was the tunic worn by Tamar, the royal princess (<a onClick="return mV(\'2Sa\',13,18);">2Sa 13:18</a>, "A garment of divers colors upon her; for with such robes were the king\'s daughters that were virgins appareled"), "the tunic of (i.e. reaching to) palms and soles" worn by Joseph, familiarly known as the "coat of many colors" (<a onClick="return mV(\'Gen\',37,3);">Ge 37:3</a>), a rendering which represents now an abandoned tradition (compare Kennedy, HDB). The long white linen tunic, which was the chief garment of the ordinary Jewish priest of the later period, had sleeves, which, for special reasons, were tied to the arms (compare Josephus, Ant., III, vii, 2).<P>(4) Ultimately it became usual, even with the people of the lower ranks, to wear an under "tunic," or "real shirt" (Josephus, Ant., XVII, vi, 7; Mishna, passim, where it is called chaluq). In this case the upper tunic, the kuttoneth proper, would be removed at night (compare <a onClick="return mV(\'Sgs\',5,3);">So 5:3</a>, "I have put off my garment").<P>The material for the tunic might be either<P>(1) woven on the loom in two pieces, and afterward put together without cutting (compare Dict. of Roman and Greek Antiq., article "Tunica"), or<P>(2) the garment might be woven whole on a special loom, "without seam," i.e. so as to require no sewing, as we know from the description given in <a onClick="return mV(\'Jhn\',19,23);">Joh 19:23</a>, and from other sources, was the chiton worn by our Lord just before His crucifixion. The garments intended by the Hebrew (<a onClick="return mV(\'Dan\',3,\'21-27\');">Da 3:21-27</a>), rendered "coats" the King James Version, have not been certainly made out. The King James Version margin has "mantles" the English Revised Version "hosen" the American Standard Revised Version "breeches" (see <a href="./study/isbe/search.html?string=HOSEN">HOSEN</a>). For "coat of mail" (<a onClick="return mV(\'1Sa\',17,5);">1Sa 17:5</a>) see <a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>.<P>5. The Headdress:<P>When the Hebrews first emerged into view, they seem to have had no covering for the head except on special demand, as in case of war, when a leather-helmet was worn (see <a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>). Ordinarily, as with the fellah of Palestine today, a rope or cord served as a fillet (compare <a onClick="return mV(\'1Ki\',20,32);">1Ki 20:32</a>, and Virgil, Aeneid (Dryden), iv.213: "A golden fillet binds his awful brows"). Such "fillets" may be seen surviving in the representation of Syrians on the monuments of Egypt. Naturally, in the course of time, exposure to the Syrian sun in the tropical summer time would compel recourse to some such covering as the modern kufiyeh, which lets in the breeze, but protects in a graceful, easy way, the head, the neck and the shoulders. The headgear of Ben-hadad\'s tribute carriers (see above) resembles the Phrygian cap.<P>The head covering, however, which is best attested, at least for the upper ranks of both sexes, is the turban (Hebrew tsaniph, from a root meaning to "wind round"). It is the ladies\' "hood" of <a onClick="return mV(\'Isa\',3,23);">Isa 3:23</a>, the Revised Version (British and American) "turban"; the "royal diadem" of <a onClick="return mV(\'Isa\',62,3);">Isa 62:3</a>, and the "mitre" of <a onClick="return mV(\'Zec\',3,5);">Zec 3:5</a>, the Revised Version, margin "turban" or "diadem." Ezekiel\'s description of a lady\'s headdress: "I bound thee with attire of fine linen" (<a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a> margin), points to a turban. For the egg-shaped turban of the priests see <a href="./study/isbe/search.html?string=BONNET">BONNET</a> (the Revised Version (British and American) "head-tires"). The hats of <a onClick="return mV(\'Dan\',3,21);">Da 3:21</a> (the Revised Version (British and American) "mantles") are thought by some to have been the conical Babylonian headdress seen on the monuments. According to 2Macc 4:12 the Revised Version (British and American) the young Jewish nobles were compelled by Antiochus Epiphanes to wear the petasos, the low, broad-brimmed hat associated with Hermes. Other forms of headdress were in use in New Testament times, as we learn from the Mishna, as well as from the New Testament, e. g. the suddar (soudarion) from Latin sudarium (a cloth for wiping off perspiration, sudor) which is probably the "napkin" of <a onClick="return mV(\'Jhn\',11,44);">Joh 11:44</a>; <a onClick="return mV(\'Jhn\',20,7);">20:7</a>, although there it appears as a kerchief, or covering, for the head. The female captives from Lachish (see above) wear over their tunics an upper garment, which covers the forehead and falls down over the shoulders to the ankles. Whether this is the garment intended by the Hebrew in <a onClick="return mV(\'Rth\',3,15);">Ru 3:15</a>, rendered "vail" by the King James Version and "mantle" by the Revised Version (British and American), and "kerchiefs for the head" (<a onClick="return mV(\'Eze\',13,18);">Eze 13:18</a> the Revised Version (British and American)), we cannot say. The "veil" with which Rebekah and Tamar "covered themselves" (<a onClick="return mV(\'Gen\',24,65);">Ge 24:65</a>; <a onClick="return mV(\'Gen\',38,14);">38:14</a>) was most likely a large "mantle" in which the whole body could be wrapped, like the cadhin (see above). But it seems impossible to draw a clear distinction between "mantle" and "veil" in the Old Testament (Kennedy). The case of Moses (<a onClick="return mV(\'Exd\',34,33);">Ex 34:33</a>) gives us the only express mention of a "face-veil."<P>6. Footgear:<P>The ancient Hebrews, like Orientals in general, went barefoot within doors. Out of doors they usually wore sandals, less frequently shoes. The simplest form of sandal then, as now, consisted of a sole of untanned leather, bound to the foot by a leather thong, the shoe-latchet of <a onClick="return mV(\'Gen\',14,23);">Ge 14:23</a> and the latchet of <a onClick="return mV(\'Mar\',1,7);">Mr 1:7</a>, etc. In the obelisk of Shalmaneser, however, Jehu\'s attendants are distinguished by shoes completely covering the feet, from the Assyrians, who are represented as wearing sandals fitted with a heel-cap. Ladies of Ezekiel\'s day wore shoes of "sealskin" (<a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a> the Revised Version (British and American)). The soldiers\' "laced boot" may be intended in <a onClick="return mV(\'Isa\',9,5);">Isa 9:5</a> (the Revised Version (British and American), margin). Then, as now, on entering the house of a friend, or a sacred precinct (<a onClick="return mV(\'Exd\',3,5);">Ex 3:5</a>; <a onClick="return mV(\'Jos\',5,15);">Jos 5:15</a>), or in case of mourning (<a onClick="return mV(\'2Sa\',15,30);">2Sa 15:30</a>), the sandals, or shoes, were removed. The priests performed their offices in the Temple in bare feet (compare the modern requirement on entering a mosque).<P>7. The Dress of Jesus and His Disciples:<P>In general we may say that the clothes worn by Christ and His disciples were of the simplest and least sumptuous kinds. A special interest must attach even to the clothes that Jesus wore. These consisted, it seems quite certain, not of just five separate articles (see Edersheim, LTJM, I, 625), but of six. In His day it had become customary to wear a linen shirt (chaluq) beneath the tunic (see above). That our Lord wore such a "shirt" seems clear from the mention of the laying aside of the upper garments (himatia, plural), i.e. the "mantle" and the "tunic," before washing His disciples\' feet (<a onClick="return mV(\'Jhn\',13,4);">Joh 13:4</a>). The tunic proper worn by Him, as we have seen, was "woven without seam" throughout, and was of the kind, therefore, that fitted closely about the neck, and had short sleeves. Above the tunic would naturally be the linen girdle, wound several times about the waist. On His feet were leather sandals (<a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>). His upper garment was of the customary sort and shape, probably of white woolen cloth, as is suggested by the details of the account of the Transfiguration (<a onClick="return mV(\'Mar\',9,3);">Mr 9:3</a>), with the four prescribed "tassels" at the corners. As to His headdress, we have no description of it, but we may set it down as certain that no Jewish teacher of that day would appear in public with the head uncovered. He probably wore the customary white linen "napkin" (sudarium), wound round the head as a turban, with the ends of it falling down over the neck. The dress of His disciples was, probably, not materially different.<P>In conclusion it may be said that, although the dress of even orthodox Jews today is as various as their lands of residence and their languages, yet there are two garments worn by them the world over, the Tallith and the \'arba\' kanephoth (see DCG, article "Dress," <span class="noTag">col. 1</span>). Jews who affect special sanctity, especially those living in the Holy Land, still wear the Tallith all day, as was the common custom in Christ\'s time. As the earliest mention of the \'arba\' kanephoth is in 1350 AD, it is clear that it cannot have existed in New Testament times.<P>LITERATURE.<P>Nowack\'s and Benzinger\'s Hebrew Archaologie; Tristram, Eastern Customs in Bible Lands; Rich, Dict. of Roman and Greek Antiq.; Edersheim, Life and Times of Jesus the Messiah,625,and elsewhere; articles on "Dress," "Clothing," "Costumes," etc., HDB, DCG, Jewish Encyclopedia (by Noldeke) in Encyclopedia Biblica (by Abrahams and Cook); Masterman, "Dress and Personal Adornment in Mod. Palestine," in Biblical World,1902,etc.``47';
isbe[2806]='Drink``<a href="./study/isbe/search.html?string=FOOD">FOOD</a>; <a href="./study/isbe/search.html?string=DRINK,+STRONG"><a href="./study/isbe/search.html?string=DRINK,+STRONG">DRINK, STRONG</a>`1';
isbe[2807]='Drink offering``<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`1';
isbe[2808]='Drink, Strong`(shekhar; sikera; from shakhar, "to be or become drunk"; probably from the same root as sugar, saccharine): With the exception of <a onClick="return mV(\'Num\',28,7);">Nu 28:7</a>, "strong drink" is always coupled with "wine." The two terms are commonly used as mutually exclusive, and as together exhaustive of all kinds of intoxicants.<P>Originally shekhar seems to have been a general term for intoxicating drinks of all kinds, without reference to the material out of which they were made; and in that sense, it would include wine. Reminiscences of this older usage may be found in <a onClick="return mV(\'Num\',28,7);">Nu 28:7</a> (where shekhar is clearly equivalent to wine, as may be seen by comparing it with <a onClick="return mV(\'Num\',28,14);">28:14</a>, and with <a onClick="return mV(\'Exd\',29,40);">Ex 29:40</a>, where the material of the drink offering is expressly designated "wine").<P>When the Hebrews were living a nomadic life, before their settlement in Canaan, the grape-wine was practically unknown to them, and there would be no need of a special term to describe it. But when they settled down to an agricultural life, and came to cultivate the vine, it would become necessary to distinguish it from the older kinds of intoxicants; hence, the borrowed word yayin ("wine") was applied to the former, while the latter would be classed together under the old term shekhar, which would then come to mean all intoxicating beverages other than wine (<a onClick="return mV(\'Lev\',10,9);">Le 10:9</a>; <a onClick="return mV(\'Num\',6,3);">Nu 6:3</a>; <a onClick="return mV(\'Deu\',14,26);">De 14:26</a>; <a onClick="return mV(\'Pro\',20,1);">Pr 20:1</a>; <a onClick="return mV(\'Isa\',24,9);">Isa 24:9</a>). The exact nature of these drinks is not clearly indicated in the Bible itself. The only fermented beverage other than grape-wine specifically named is pomegranate-wine (<a onClick="return mV(\'Sgs\',8,2);">So 8:2</a>: "the juice of my pomegranate," the Revised Version, margin "sweet wine of my pomegranate"); but we may infer that other kinds of shekhar besides that obtained from pomegranates were in use, such as drinks made from dates, honey, raisins, barley, apples, etc. Probably Jerome (circa 400 AD) was near the mark when he wrote, "Sikera in the Hebrew tongue means every kind of drink which can intoxicate, whether made from grain or from the juice of apples, or when honeycombs are boiled down into a sweet and strange drink, or the fruit of palm oppressed into liquor, and when water is colored and thickened from boiled herbs" (Ep. ad Nepotianum). Thus shekhar is a comprehensive term for all kinds of fermented drinks, excluding wine.<P>Probably the most common sort of shekhar used in Biblical times was palm or date-wine. This is not actually mentioned in the Bible, and we do not meet with its Hebrew name yen temarim ("wine of dates") until the Talmudic period. But it is frequently referred to in the Assyrian-Babylonian contract tablets (cuneiform), and from this and other evidence we infer that it was very well known among the ancient Semitic peoples. Moreover, it is known that the palm tree flourished abundantly in Biblical lands, and the presumption is therefore very strong that wine made of the juice of dates was a common beverage. It must not be supposed, however, that the term shekhar refers exclusively to date-wine. It rather designates all intoxicating liquors other than grape-wine, while in few cases it probably includes even wine.<P>There can be no doubt that shekhar was intoxicating. This is proved<P>(1) from the etymology of the word, it being derived from shakhar, "to be or become drunk" (<a onClick="return mV(\'Gen\',9,21);">Ge 9:21</a>; <a onClick="return mV(\'Isa\',29,9);">Isa 29:9</a>; <a onClick="return mV(\'Jer\',25,27);">Jer 25:27</a>, etc.); compare the word for drunkard (shikkar), and for drunkenness (shikkaron) from the same root;<P>(2) from descriptions of its effects: e. g. Isaiah graphically describes the stupefying effect of shekhar on those who drink it excessively (<a onClick="return mV(\'Isa\',28,7,8);">Isa 28:7-8</a>).<P>Hannah defended herself against the charge of being drunk by saying, "I have drunk neither wine nor strong drink," i.e. neither wine nor any other intoxicating liquor (<a onClick="return mV(\'1Sa\',1,15);">1Sa 1:15</a>). The attempt made to prove that it was simply the unfermented juice of certain fruits is quite without foundation. Its immoderate use is strongly condemned (<a onClick="return mV(\'Isa\',5,11,12);">Isa 5:11-12</a>; <a onClick="return mV(\'Pro\',20,1);">Pr 20:1</a>; see <a href="./study/isbe/search.html?string=DRUNKENNESS">DRUNKENNESS</a>). It was forbidden to ministering priests (<a onClick="return mV(\'Lev\',10,9);">Le 10:9</a>), and to Nazirites (<a onClick="return mV(\'Num\',6,3);">Nu 6:3</a>; <a onClick="return mV(\'Jdg\',13,4,7,14);">Jud 13:4, 7, 14</a>; compare <a onClick="return mV(\'Luk\',1,15);">Lu 1:15</a>), but was used in the sacrificial meal as drink offering (<a onClick="return mV(\'Num\',28,7);">Nu 28:7</a>), and could be bought with the tithe-money and consumed by the worshipper in the temple (<a onClick="return mV(\'Deu\',14,26);">De 14:26</a>). It is commended to the weak and perishing as a means of deadening their pain; but not to princes, lest it might lead them to pervert justice (<a onClick="return mV(\'Pro\',31,\'4-7\');">Pr 31:4-7</a>).``49';
isbe[2809]='Dromedary`drum\'-e-da-ri, drom\'-e-da-ri.`<a href="./study/isbe/search.html?string=CAMEL">CAMEL</a>`1';
isbe[2810]='Drop, Dropping`"To drop" expresses a "distilling" or "dripping" of a fluid (<a onClick="return mV(\'Jdg\',5,4);">Jud 5:4</a>; <a onClick="return mV(\'Pro\',3,20);">Pr 3:20</a>; <a onClick="return mV(\'Sgs\',5,5,13);">So 5:5,13</a>; <a onClick="return mV(\'Joe\',3,18);">Joe 3:18</a>; <a onClick="return mV(\'Amo\',9,13);">Am 9:13</a>; compare <a onClick="return mV(\'1Sa\',14,26);">1Sa 14:26</a>, "the honey dropped" (margin "a stream of honey")); <a onClick="return mV(\'Job\',29,22);">Job 29:22</a> and <a onClick="return mV(\'Isa\',45,8);">Isa 45:8</a> read "distil" (the King James Version "drop"). The continuous "droppings" of rain through a leaking roof (roofs were usually made of clay in Palestine, and always liable to cracks and leakage) on a "very rainy day" is compared to a contentious wife (<a onClick="return mV(\'Pro\',19,13);">Pr 19:13</a>; <a onClick="return mV(\'Pro\',27,15);">27:15</a>); "What is described is the irritating, unceasing, sound of the fall, drop after drop, of water through the chinks in the roof" (Plumptre, in the place cited); compare also the King James Version <a onClick="return mV(\'Ecc\',10,18);">Ec 10:18</a> (the Revised Version (British and American) "leaketh").``1';
isbe[2811]='Dropsy`drop\'-si (hudropikos, "a man afflicted with hudrops or dropsy"): Both forms of this disease occur in Palestine, that in which the limbs and body are distended with water called anasarca, depending generally on cardiac or renal disease, and the form confined to the abdomen, usually the result of liver infection. The latter is the commoner, as liver disease is a frequent result of recurrent attacks of malarial fever. The man was evidently able to move about, as he had entered into the Pharisee\'s house (<a onClick="return mV(\'Luk\',14,2);">Lu 14:2</a>).``1';
isbe[2812]='Dross`dros (sigh): The refuse of smelting of precious metal (<a onClick="return mV(\'Pro\',25,4);">Pr 25:4</a>; <a onClick="return mV(\'Pro\',26,23);">26:23</a>); used figuratively of what is base or worthless (<a onClick="return mV(\'Isa\',1,22,25);">Isa 1:22, 25</a>; <a onClick="return mV(\'Eze\',22,18,19);">Eze 22:18-19</a>; <a onClick="return mV(\'Psa\',119,119);">Ps 119:119</a>).``1';

isbe[2814]='Drove`drov.`<a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>`1';
isbe[2815]='Drowning`droun\'-ing.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[2816]='Drum`drum (tumpanon): This was the Hebrew toph, "tabret" or "timbrel," a hand-drum, consisting of a ring of wood or metal covered with a tightly drawn skin, with small pieces of metal hung around the rim, like a tambourine. It was raised in the one hand and struck with the other, usually by women, but sometimes also by men, at festivities and on occasions of rejoicing. See 1Macc 9:39, the Revised Version (British and American) "timbrels."``1';
isbe[2817]='Drunkenness`drunk\'-\'-n-nes (raweh, shikkaron, shethi; methe):<P>I. Its Prevalance.<P>The Bible affords ample proof that excessive drinking of intoxicants was a common vice among the Hebrews, as among other ancient peoples. This is evident not only from individual cases of intoxication, as Noah (<a onClick="return mV(\'Gen\',9,21);">Ge 9:21</a>), Lot (<a onClick="return mV(\'Gen\',19,33,35);">Ge 19:33, 35</a>), Nabal (<a onClick="return mV(\'1Sa\',25,36);">1Sa 25:36</a>), Uriah made drunk by David (<a onClick="return mV(\'2Sa\',11,13);">2Sa 11:13</a>), Amnon (<a onClick="return mV(\'2Sa\',13,28);">2Sa 13:28</a>), Elah, king of Israel (<a onClick="return mV(\'1Ki\',16,9);">1Ki 16:9</a>), Benhadad, king of Syria, and his confederates (<a onClick="return mV(\'1Ki\',20,16);">1Ki 20:16</a>), Holofernes (Judith 13:2), etc., but also from frequent references to drunkenness as a great social evil. Thus, Amos proclaims judgment on the voluptuous and dissolute rulers of Samaria "that drink wine in (large) bowls" (<a onClick="return mV(\'Amo\',6,6);">Am 6:6</a>), and the wealthy ladies who press their husbands to join them in a carousal (<a onClick="return mV(\'Amo\',4,1);">Am 4:1</a>); he also complains that this form of self-indulgence was practiced even at the expense of the poor and under the guise of religion, at the sacrificial meals (<a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>; see also <a onClick="return mV(\'Isa\',5,11,12,22);">Isa 5:11-12, 22</a>; <a onClick="return mV(\'Isa\',28,\'1-8\');">28:1-8</a>; <a onClick="return mV(\'Isa\',56,11);">56:11</a>f). Its prevalence is also reflected in many passages in the New Testament (e. g. <a onClick="return mV(\'Mat\',24,49);">Mt 24:49</a>; <a onClick="return mV(\'Luk\',21,34);">Lu 21:34</a>; <a onClick="return mV(\'Act\',2,13,15);">Ac 2:13, 15</a>; <a onClick="return mV(\'Eph\',5,18);">Eph 5:18</a>; <a onClick="return mV(\'1Th\',5,7);">1Th 5:7</a>). Paul complains that at Corinth even the love-feast of the Christian church which immediately preceded the celebration of the Eucharist, was sometimes the scene of excessive drinking (<a onClick="return mV(\'1Cr\',11,21);">1Co 11:21</a>). It must, however, be noted that it is almost invariably the well-to-do who are charged with this vice in the Bible. There is no evidence to prove that it prevailed to any considerable extent among the common people. Intoxicants were then an expensive luxury, beyond the reach of the poorer classes. See <a href="./study/isbe/search.html?string=DRINK,+STRONG">DRINK, STRONG</a>.<P>II. Its Symptoms and Effects.<P>These are most vividly portrayed:<P>(1) some of its physical symptoms (<a onClick="return mV(\'Job\',12,25);">Job 12:25</a>; <a onClick="return mV(\'Psa\',107,27);">Ps 107:27</a>; <a onClick="return mV(\'Pro\',23,29);">Pr 23:29</a>; <a onClick="return mV(\'Isa\',19,14);">Isa 19:14</a>; <a onClick="return mV(\'Isa\',28,8);">28:8</a>; <a onClick="return mV(\'Isa\',29,9);">29:9</a>; <a onClick="return mV(\'Jer\',25,16);">Jer 25:16</a>);<P>(2) its mental effects: exhilaration (<a onClick="return mV(\'Gen\',43,34);">Ge 43:34</a>), jollity and mirth (1Esdras 3:20), forgetfulness (1Esdras 3:20), loss of understanding and balance of judgment (<a onClick="return mV(\'Isa\',28,7);">Isa 28:7</a>; <a onClick="return mV(\'Hsa\',4,11);">Ho 4:11</a>);<P>(3) its effects on man\'s happiness and prosperity: its immediate effect is to make one oblivious of his misery; but ultimately it "biteth like a serpent, and stingeth like an adder," and leads to woe and sorrow (<a onClick="return mV(\'Pro\',23,\'29-32\');">Pr 23:29-32</a>) and to poverty (<a onClick="return mV(\'Pro\',23,21);">Pr 23:21</a>; compare <a onClick="return mV(\'Pro\',21,17);">Pr 21:17</a>; Ecclesiasticus 19:1); hence, wine is called a "mocker" deceiving the unwise (<a onClick="return mV(\'Pro\',20,1);">Pr 20:1</a>);<P>(4) its moral and spiritual effects: it leads to a maladministration of justice (<a onClick="return mV(\'Pro\',31,5);">Pr 31:5</a>; <a onClick="return mV(\'Isa\',5,23);">Isa 5:23</a>), provokes anger and a contentious, brawling spirit (<a onClick="return mV(\'Pro\',20,1);">Pr 20:1</a>; <a onClick="return mV(\'Pro\',23,29);">23:29</a>; 1Esdras 3:22; Ecclesiasticus 31:26,29f), and conduces to a profligate life (<a onClick="return mV(\'Eph\',5,18);">Eph 5:18</a>; "riot," literally, profligacy). It is allied with gambling and licentiousness (<a onClick="return mV(\'Joe\',3,3);">Joe 3:3</a>), and indecency (<a onClick="return mV(\'Gen\',9,21);">Ge 9:21</a>f). Above all, it deadens the spiritual sensibilities, produces a callous indifference to religious influences and destroys all serious thought (<a onClick="return mV(\'Isa\',5,12);">Isa 5:12</a>).<P>III. Attitude of the Bible to the Drink Question.<P>Intemperance is condemned in uncompromising terms by the Old Testament and the New Testament, as well as by the semi-canonical writings. While total abstinence is not prescribed as a formal and universal rule, broad principles are laid down, especially in the New Testament, which point in that direction.<P>1. In the Old Testament:<P>In the Old Testament, intemperance is most repugnant to the stern ethical rigorism of the prophets, as well as to the more utilitarian sense of propriety of the "wisdom" writers. As might be expected, the national conscience was but gradually quickened to the evil of immoderate drinking. In the narratives of primitive times, excessive indulgence, or at least indulgence to the point of exhilaration, is mentioned without censure as a natural thing, especially on festive occasions (as in <a onClick="return mV(\'Gen\',43,34);">Ge 43:34</a> the Revised Version, margin). But a conscience more sensitive to the sinfulness of overindulgence was gradually developed, and is reflected in the denunciations of the prophets and the warning of the wise men (compare references under I and II, especially <a onClick="return mV(\'Isa\',5,11);">Isa 5:11</a>f; <a onClick="return mV(\'Isa\',22,\'1-\');">Isa 22</a>; <a onClick="return mV(\'Isa\',22,\'1-8\');">28:1-8</a>; <a onClick="return mV(\'Pro\',23,\'29-33\');">Pr 23:29-33</a>). Nowhere is the principle of total abstinence inculcated as a rule applicable to all. In particular cases it was recognized as a duty. Priests while on duty in the sanctuary were to abstain from wine and strong drink (<a onClick="return mV(\'Lev\',10,9);">Le 10:9</a>; compare <a onClick="return mV(\'Eze\',44,21);">Eze 44:21</a>). Nazirites were to abstain from all intoxicants during the period of their vows (<a onClick="return mV(\'Num\',6,3);">Nu 6:3</a>f; compare <a onClick="return mV(\'Amo\',2,12);">Am 2:12</a>), yet not on account of the intoxicating qualities of wine, but because they represented the simplicity of the older pastoral life, as against the Canaanite civilization which the vine symbolized (W. R. Smith, Prophets of Israel, 84f). So also the Rechabites abstained from wine (<a onClick="return mV(\'Jer\',35,6,8,14);">Jer 35:6, 8, 14</a>) and social conveniences, because they regarded the nomadic life as more conducive to Yahweh-worship than agricultural and town life, with its temptations to Baal-worship. In Daniel and his comrades we have another instance of voluntary abstinence (<a onClick="return mV(\'Dan\',1,\'8-16\');">Da 1:8-16</a>). These, however, are isolated instances. Throughout the Old Testament the use of wine appears as practically universal, and its value is recognized as a cheering beverage (<a onClick="return mV(\'Jdg\',9,13);">Jud 9:13</a>; <a onClick="return mV(\'Psa\',104,15);">Ps 104:15</a>; <a onClick="return mV(\'Pro\',31,7);">Pr 31:7</a>), which enables the sick to forget their pains (<a onClick="return mV(\'Pro\',31,6);">Pr 31:6</a>). Moderation, however, is strongly inculcated and there are frequent warnings against the temptation and perils of the cup.<P>2. Deutero-Canonical and Extra-Canonical Writings:<P>In Apocrypha, we have the attitude of prudence and common sense, but the prophetic note of stern denunciation is wanting. The path of wisdom is the golden mean. "Wine is as good as life to men, if thou drink it in its measure;....wine drunk in season and to satisfy is joy of heart, and gladness of soul: wine drunk largely is bitterness of soul, with provocation and conflict" (Ecclesiasticus 31:27-30 the Revised Version (British and American)). A vivid picture of the effects of wine-drinking is given in 1Esdras. 3:18-24. Stronger teaching on the subject is given in the Testament of the Twelve Patriarchs. The use of wine is permitted to him who can use it temperately, but abstinence is enjoined as the wiser course (Testament to the Twelve Patriarchs, <span class="noTag">Jud 1:16:3</span>).<P>3. In the New Testament:<P>In the New Testament, intemperance is treated as a grave sin. Only once, indeed, does our Lord explicitly condemn drunkenness (<a onClick="return mV(\'Luk\',21,34);">Lu 21:34</a>), though it is implicitly condemned in other passages (<a onClick="return mV(\'Mat\',24,49);">Mt 24:49</a> = <a onClick="return mV(\'Luk\',12,45);">Lu 12:45</a>). The meagerness of the references in our Lord\'s teaching is probably due to the fact already mentioned, that it was chiefly prevalent among the wealthy, and not among the poorer classes to whom our Lord mainly ministered. The references in Paul\'s writings are very numerous (<a onClick="return mV(\'Gal\',5,21);">Ga 5:21</a>; <a onClick="return mV(\'Eph\',5,18);">Eph 5:18</a>, et al.). Temperance and sobriety in all things are everywhere insisted on (e. g. <a onClick="return mV(\'Act\',24,25);">Ac 24:25</a>; <a onClick="return mV(\'Gal\',5,23);">Ga 5:23</a>; <a onClick="return mV(\'2Pe\',1,6);">2Pe 1:6</a>). A bishop and those holding honorable position in the church should not be addicted to wine (<a onClick="return mV(\'1Ti\',3,2);">1Ti 3:2</a>f; <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>f; <a onClick="return mV(\'Tts\',2,2);">2:2</a>f). Yet Jesus and His apostles were not ascetics, and the New Testament gives no rough-and-ready prohibition of strong drink on principle. In contrast with John the Baptist, who was a Nazirite from birth (<a onClick="return mV(\'Luk\',1,15);">Lu 1:15</a>), Jesus was called by His enemies a "wine-bibber" (<a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>). He took part in festivities in which wine was drunk (<a onClick="return mV(\'Jhn\',2,10);">Joh 2:10</a>).<P>There are indications that He regarded wine as a source of innocent enjoyment (<a onClick="return mV(\'Luk\',5,38);">Lu 5:38</a>f; <a onClick="return mV(\'Luk\',17,8);">17:8</a>). To insist on a distinction between intoxicating and unfermented wine is a case of unjustifiable special pleading. It must be borne in mind that the drink question is far more complex and acute in modern than in Biblical times, and that the conditions of the modern world have given rise to problems which were not within the horizon of New Testament writers. The habit of excessive drinking has spread enormously among the common people, owing largely to the cheapening of alcoholic drinks. The fact that the evil exists today in greater proportions may call for a drastic remedy and a special crusade. But rather than defend total abstinence by a false or forced exegesis, it were better to admit that the principle is not formally laid down in the New Testament, while maintaining that there are broad principles enunciated, which in view of modern conditions should lead to voluntary abstinence from all intoxicants. Such principles may be found, e. g. in our Lord\'s teaching in <a onClick="return mV(\'Mat\',16,24);">Mt 16:24</a>f; <a onClick="return mV(\'Mar\',9,42);">Mr 9:42</a>f; and in the great Pauline passages—<a onClick="return mV(\'Rom\',14,\'13-21\');">Ro 14:13-21</a>; <a onClick="return mV(\'1Cr\',8,\'8-13\');">1Co 8:8-13</a>.<P>IV. Drunkenness in Metaphor.<P>Drunkenness very frequently supplies Biblical writers with striking metaphors and similes. Thus, it symbolizes intellectual or spiritual perplexity (<a onClick="return mV(\'Job\',12,25);">Job 12:25</a>; <a onClick="return mV(\'Isa\',19,14);">Isa 19:14</a>; <a onClick="return mV(\'Jer\',23,9);">Jer 23:9</a>), bewilderment and helplessness under calamity (<a onClick="return mV(\'Jer\',13,13);">Jer 13:13</a>; <a onClick="return mV(\'Eze\',23,33);">Eze 23:33</a>). It furnishes a figure for the movements of sailors on board ship in a storm (<a onClick="return mV(\'Psa\',107,27);">Ps 107:27</a>), and for the convulsions of the earth on the day of Yahweh (<a onClick="return mV(\'Isa\',24,20);">Isa 24:20</a>). Yahweh\'s "cup of staggering" is a symbol of affliction, the fury of the Lord causing stupor and confusion (<a onClick="return mV(\'Isa\',51,\'17-23\');">Isa 51:17-23</a>; compare <a onClick="return mV(\'Isa\',63,6);">Isa 63:6</a>; <a onClick="return mV(\'Jer\',25,15);">Jer 25:15</a>ff; <a onClick="return mV(\'Eze\',23,33);">Eze 23:33</a>; <a onClick="return mV(\'Psa\',75,8);">Ps 75:8</a>). The sword and the arrow are said to be sodden with drink like a drunkard with wine (<a onClick="return mV(\'Deu\',32,42);">De 32:42</a>; <a onClick="return mV(\'Jer\',46,10);">Jer 46:10</a>). In the Apocalypse, Babylon (i.e. Rome) is portrayed under the figure of a "great harlot" who makes kings "drunken with the wine of her fornication"; and who is herself "drunken with the blood of the saints, and...of the martyrs of Jesus" (<a onClick="return mV(\'Rev\',17,2,6);">Re 17:2, 6</a>).``49';
isbe[2818]='Drusilla`droo-sil\'-a (Drousilla, or Drousilla): Wife of Felix, a Jewess, who along with her husband "heard (Paul) concerning the faith in Christ Jesus" during Paul\'s detention in Caesarea (<a onClick="return mV(\'Act\',24,24);">Ac 24:24</a>).<P>Beta text gives the rendering "Drusilla the wife of Felix, a Jewess, asked to see Paul and to hear the word." The fact that Drusilla was a Jewess explains her curiosity, but Paul, who was probably acquainted with the past history of her and Felix, refused to satisfy their request in the way they desired, and preached to them instead concerning righteousness and self-restraint and the final judgment. At this "Felix was terrified" (<a onClick="return mV(\'Act\',24,25);">Ac 24:25</a>). Beta text states that Paul\'s being left in bonds on the retirement of Felix was due to the desire of the latter to please Drusilla (compare <a onClick="return mV(\'Act\',24,27);">Ac 24:27</a>). Probably this explanation, besides that of the accepted text, was true also, as Drusilla, who was a member of the ruling house, saw in Paul an enemy of its power, and hated him for his condemnation of her own private sins.<P>The chief other source of information regarding Drusilla is Josephus. Drusilla was the youngest of the three daughters of Agrippa I, her sisters being Bernice and Mariamne. She was born about 36 AD and was married when 14 years old to Azizus, king of Emeza. Shortly afterward she was induced to desert her husband by Felix, who employed a Cyprian sorcerer, Simon by name, to carry out his purpose. She was also influenced to take this step by the cruelty of Azizus and the hatred of Bernice who was jealous of her beauty. Her marriage with Felix took place about 54 AD and by him she had one son, Agrippa, who perished under Titus in an eruption of Mt. Vesuvius. The mention by Josephus of "the woman" who perished along with Agrippa (Ant., XX, vii, 2) refers probably not to his mother Drusilla but to his wife.``88';
