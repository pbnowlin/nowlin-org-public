isbe[2858]='East, Children of the`est, (mizrach, qedhem, qedhem, and other derivatives of the same root; anatole):<P>Mizrach is the equivalent of the Arabic meshriq, "the orient" or "place of sunrise." In the same way ma\'arabh, "west," corresponds to the Arabic maghrib, and both mizrach and ma\'arabh occur in <a onClick="return mV(\'Psa\',103,12);">Ps 103:12</a>: "As far as the east is from the west, so far hath he removed our transgressions from us." Qadham, "to precede" (whence qedhem, "east"), and its derivatives correspond closely to the Arabic qadham, except that the Arabic derivatives do not include the signification "east." In the majority of cases "east" and other words of direction require no explanation, but the expressions "the children of the east" (bene qedhem), "the land of the children of the east" (\'erets bene qedhem), and "the east country" (\'erets qedhem), belong to a different category. In the story of Gideon (<a onClick="return mV(\'Jdg\',6,3,13);">Jud 6:3, 13</a>; <a onClick="return mV(\'Jdg\',7,12);">7:12</a>; <a onClick="return mV(\'Jdg\',8,10);">8:10</a>), we find several times the expression "the Midianites and the Amalekites and the children of the east." In <a onClick="return mV(\'Jdg\',8,24);">Jud 8:24</a> it is said of the same host: "For they Go up to Kedar, and destroy the children of the east. Their tents and had golden earrings, because they were Ishmaelites." In <a onClick="return mV(\'Jer\',49,28,29);">Jer 49:28-29</a>: "Go up to Kedar, and destroy the children of the east. Their tents and their flocks shall they take." In <a onClick="return mV(\'Gen\',25,6);">Ge 25:6</a>: "But unto the sons of the concubines, that Abraham had, Abraham gave gifts; and he sent them away from Isaac his son, while he yet lived, eastward, unto the east country." Now Ishmael is the son of Abraham and Hagar, Midian of Abraham and Keturah, Kedar the son of Ishmael, and Amalek the grandson of Esau, dwelling in Edom. It is evident that we have to do with the Syrian desert and in a general way with Arabia, especially its northern part, and with peoples like the modern Bedouin who kept camels and dwelt in tents, \'houses of hair\' (buyut sha\'r), as they are called by the Arabs of today.<P>A striking passage is <a onClick="return mV(\'Gen\',29,1);">Ge 29:1</a>: "Then Jacob went on his journey, and came to the land of the children of the east." As one journeys eastward through the country east of the Jordan he traverses first a region of towns and villages with fields of grain, and then the wide desert where the Bedouin wander with their herds. The line is a sharp one. Within a very few hours he passes from the settled part where the rain, though scanty, is sufficient to bring the grain to maturity, to the bare desert.<P>Job was "the greatest of all the children of the east" (<a onClick="return mV(\'Job\',1,3);">Job 1:3</a>). These desert people had a name for wisdom as we see from <a onClick="return mV(\'1Ki\',4,30);">1Ki 4:30</a>, "Solomon\'s wisdom excelled the wisdom of all the children of the east, and all the wisdom of Egypt"; and from <a onClick="return mV(\'Mat\',2,1);">Mt 2:1</a>: "Now when Jesus was born...Wisemen from the east came."``37';
isbe[2859]='Easter`es\'-ter (pascha, from Aramaic paccha\' and Hebrew pecach, the Passover festival):<P>The English word comes from the Anglo-Saxon Eastre or Estera, a Teutonic goddess to whom sacrifice was offered in April, so the name was transferred to the paschal feast.<P>The word does not properly occur in Scripture, although the King James Version has it in <a onClick="return mV(\'Act\',12,4);">Ac 12:4</a> where it stands for Passover, as it is rightly rendered in the Revised Version (British and American). There is no trace of Easter celebration in the New Testament, though some would see an intimation of it in <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>. The Jewish Christians in the early church continued to celebrate the Passover, regarding Christ as the true paschal lamb, and this naturally passed over into a commemoration of the death and resurrection of our Lord, or an Easter feast. This was preceded by a fast, which was considered by one party as ending at the hour of the crucifixion, i.e. at 3 o\'clock on Friday, by another as continuing until the hour of the resurrection before dawn on Easter morning. Differences arose as to the time of the Easter celebration, the Jewish Christians naturally fixing it at the time of the Passover feast which was regulated by the paschal moon. According to this reckoning it began on the evening of the 14th day of the moon of the month of Nican without regard to the day of the week, while the GentileChristians identified it with the first day of the week, i.e. the Sunday of the resurrection, irrespective of the day of the month. This latter practice finally prevailed in the church, and those who followed the other reckoning were stigmatized as heretics. But differences arose as to the proper Sunday for the Easter celebration which led to long and bitter controversies. The Council of Nice, 325 AD, decreed that it should be on Sunday, but did not fix the particular Sunday. It was left to the bishop of Alexandria to determine, since that city was regarded as the authority in astronomical matters and he was to communicate the result of his determination to the other bishops.<P>But this was not satisfactory, especially to the western churches, and a definite rule for the determination of Easter was needed. By some it was kept as early as March 21, and by others as late as April 25, and others followed dates between. The rule was finally adopted, in the 7th century, to celebrate Easter on the Sunday following the 14th day of the calendar moon which comes on, or after, the vernal equinox which was fixed for March 21. This is not always the astronomical moon, but near enough for practical purposes, and is determined without astronomical calculation by certain intricate rules adopted by ecclesiastical authority. These rules involve the Dominical Letters, or the first seven of the alphabet, representing the days of the week, A standing for the first day of the year and the one on which Sunday falls being called the Dominical for that year. There are also involved the Golden Numbers and the Epacts, the first being the numbers from 1 to 19, the cycle of the moon when its phases recur on the same days of the year, the first of the cycle being that in which the new moon falls on January 1. The Epacts indicate the moon\'s age at the beginning of each year. Easter was thus fixed by these rules, but another difficulty arose when the Gregorian calendar was adopted in 1582, the difference between it and the Julian being then 10 days. This of course affected the determination of Easter, and its celebration by the Greek church, which has never admitted the Gregorian calendar, occurs usually at a different time from that followed by the western churches. This difference may be as much as five weeks and it may occur as late as April 30, while in the West it cannot occur later than April 25 nor earlier than March 22. Occasionally the two come together but this is rare, since the difference between the two calendars is now 13 days.<P>The Easter feast has been and still is regarded as the greatest in the Christian church, since it commemorates the most important event in the life of its Founder.``138';
isbe[2860]='Ebal, Mount`e\'-bal, (har \'ebhal; Gaibal):<P>Rises north of the vale of Shechem, over against Mt. Gerizim on the south. The mountain (Arabic el-Iclamiyeh) reaches a height of 1,402 ft. above the floor of the valley, and 3,077 ft. above the level of the Mediterranean. The Samaritans feign that Gerizim is the higher; but it is more than 200 ft. lower than Ebal. These two mountains overhang the pass through which runs the main artery of intercourse between East and West, the city of Nablus lying in the throat of the valley to the west. The ancient Shechem probably stood farther to the east. The lower slopes of Ebal as one ascends from Nablus are covered with gardens and orchards, the copious streams from the fountains under Gerizim washing its foot, and spreading fertility and beauty. The vine, the fig and the olive grow luxuriantly. Higher up we scramble over rough rocky terraces, where grow only the ubiquitous thistles and prickly shrubs.<P>From the broad summit a view of surpassing interest and beauty rewards the climber\'s toil. Westward beyond the hills and the plain of Sharon with its coast line of yellow sand running from Jaffa to Carmel, stretch the blue waters of the Mediterranean. From Carmel to Gilboa, Little Hermon and Tabor, roll the fruitful breadths of Esdraelon: the uplands of Galilee, with Nazareth showing on the brow above the plain, rise away to the buttresses of Lebanon in the North. From the snowy peak of Hermon the eye ranges over the Jaulan and Mount Gilead to the Mountain of Bashan in the east, with the steep eastern wall of the Jordan valley in the foreground. The land of Moab is visible beyond the Dead Sea; and the heights around Jerusalem close the view on the south.<P>Round this splendid mountain, seen from afar on all sides, religious associations have gathered from old time. The Moslem Weley on the top—the usual white-domed sanctuary—where it is said the head of the Baptist is buried, is doubtless the modern representative of some ancient seat of worship. The ruins of a church show that Christians also came under the spell of the hill.<P>The slopes of Ebal toward Gerizim played their part in that memorable scene, when, having conquered the central region of Palestine, Joshua led the people hither, erected an altar of unhewn stones, wrote upon the stones—either engraving on the stone itself, or impressing on plaster placed there for the purpose—a copy of the law, and then, as Moses the servant of the Lord had commanded, placed half the tribes on the slope of Gerizim, and half on those of Ebal, and the ark with the priests and Levites in the center. Then with dramatic responses from the two divisions of the people, the blessings and the cursings of the law were read (<a onClick="return mV(\'Jos\',8,30);">Jos 8:30</a>ff; compare <a onClick="return mV(\'Deu\',27,11);">De 27:11</a>ff). In all the future, therefore, this mountain, towering aloft in the very heart of the land, would remind beholders far and near of their people\'s covenant with God. It has sometimes been questioned if the reading of the law could be heard by the people in the way described. The formation of the sides of the valley at the narrowest part, and the acoustics, which have been tested more than once, leave no reasonable doubt as to the possibility.<P>The importance of the mountain from a military point of view is illustrated by the ruins of a massive fortress found on the summit.``54';
isbe[2861]='Ebal; Obal`e\'-bal (\'ebhal, "bare") or (\'obhal):<P>(1) A people and region of Joktanite, Arabia. See Dillmann, Genesis, and Glaser, Skizze, II, 426. The latter form of the name is that given in <a onClick="return mV(\'Gen\',10,28);">Ge 10:28</a>, the former in <a onClick="return mV(\'1Ch\',1,22);">1Ch 1:22</a> and in the Samaritan text of <a onClick="return mV(\'Gen\',10,28);">Ge 10:28</a>.<P>(2) A son of Shobal, son of Seir, the Horite (<a onClick="return mV(\'Gen\',36,23);">Ge 36:23</a>; <a onClick="return mV(\'1Ch\',1,40);">1Ch 1:40</a>).``1';
isbe[2862]='Ebed`e\'-bed (\'ebhedh, "servant"):<P>(1) Father of Gaal, who rebelled against Abimelech (<a onClick="return mV(\'Jdg\',9,\'26-35\');">Jud 9:26-35</a>).<P>(2) A companion of Ezra in his return (<a onClick="return mV(\'Ezr\',8,6);">Ezr 8:6</a>) = Obeth (1Esdras 8:32).``1';
isbe[2863]='Ebed-Melech`e-bed-me\'-lek, eb-ed-me\'-lek (\'ebhedh-mekekh, "servant of the king" or "of (god) Melek"):<P>An Ethiopian eunuch in the service of King Zedekiah, who interceded with the king for the prophet Jeremiah and rescued him from the dungeon into which he had been cast to die (<a onClick="return mV(\'Jer\',38,\'7-13\');">Jer 38:7-13</a>). For this, the word of Yahweh through Jeremiah promised Ebed-meleeh that his life should be spared in the fall of Jerusalem (<a onClick="return mV(\'Jer\',39,\'15-18\');">Jer 39:15-18</a>).``1';
isbe[2864]='Eben-Bohan``<a href="./study/isbe/search.html?string=BOHAN">BOHAN</a>`1';
isbe[2865]='Eben-Ezel``<a href="./study/isbe/search.html?string=EZEL">EZEL</a>`1';
isbe[2866]='Eben-Ezer`eb-en-e\'-zer (\'ebhen ha-\'ezer, "stone of the help"; Abenezer):<P>(1) Here Israel was defeated by the Philistines, 4,000 men falling in the battle (<a onClick="return mV(\'1Sa\',4,1);">1Sa 4:1</a>ff). It appears also to have been the scene of the disaster when the ark of God was captured (<a onClick="return mV(\'1Sa\',4,3);">1Sa 4:3</a>ff). The place is not identified. It was over against Aphek; but this site is also unknown (compare <a onClick="return mV(\'Jos\',12,18);">Jos 12:18</a>). Eusebius, Onomasticon places it between Jerusalem and Ascalon, in the neighborhood of Beth-shemesh. Conder suggests Deir Aban, fully 2 miles east of \'Ain Shems (PEF, III, 24).<P>(2) A stone set up by Samuel to perpetuate the memory of the signal victory granted to Israel over the Philistines in answer to his prayer (<a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a>). It stood between Mizpeh and Shen. The latter is probably identical with \'Ain Sinia, north of Bethel. This defines the district in which it may be found; but no identification is yet possible.``54';
isbe[2867]='Eber`e\'-ber (\'ebher; Eber, in Genesis; Obed, in Chronicles):<P>(1) Occurs in the genealogies (<a onClick="return mV(\'Gen\',10,21,25);">Ge 10:21-25</a>; <a onClick="return mV(\'Gen\',11,14);">11:14</a>ff) as the great-grandson of Shem and father of Peleg and Joktan. The word means "the other side," "across," and the form "Hebrew," which is derived from it, is intended to denote the people or tribe who came "from the other, side of the river" (i.e. the Euphrates), from Haran (<a onClick="return mV(\'Gen\',11,31);">Ge 11:31</a>), whence Abraham and his dependents migrated to Canaan.<P>(2) A Gadite (<a onClick="return mV(\'1Ch\',5,13);">1Ch 5:13</a>).<P>(3) & (4) Two Benjamites (<a onClick="return mV(\'1Ch\',8,12,22);">1Ch 8:12, 22</a>).<P>(5) The head of a priestly family (<a onClick="return mV(\'Neh\',12,20);">Ne 12:20</a>).``68';
isbe[2868]='Ebez`e\'-bez (\'ebhets, meaning unknown; Rhebes; the King James Version Abez):<P>One of the 16 cities in Issachar (<a onClick="return mV(\'Jos\',19,20);">Jos 19:20</a>). The name seems to be cognate to that of the judge Ibzan (<a onClick="return mV(\'Jdg\',12,\'8-10\');">Jud 12:8-10</a>). All else concerning it is conjecture.``1';
isbe[2869]='Ebiasaph`e-bi\'-a-saf:<P>A descendant of Kohath the son of Levi (<a onClick="return mV(\'1Ch\',6,37);">1Ch 6:37</a>).`<a href="./study/isbe/search.html?string=ABIASAPH">ABIASAPH</a>`1';
isbe[2870]='Ebionism; Ebionites`e\'-bi-o-niz\'-m, e\'-bio-nits (Ebionaioi, from \'ebhyonim, "poor people"):<P>Contents<P><b>General Statement</b><P><b>I. ORIGIN OF THE NAME</b><P class="in15">1. The Poor Ones <P class="in15">2. Origin of the Name<P><b>II. AUTHORITIES FOR THE OPINIONS OF THE EBIONITES</b><P class="in15">1. Irenaeus, Tertullian and Hippolytus<P class="in15">2. Origen and Jerome<P class="in15">3. Epiphanius\' Description<P class="in15">4. Justin Martyr<P><b>III. LITERATURE OF THE EBIONITES</b><P class="in15">1. The Gospel According to the <span class="noTag">Hebrews</span><P class="in15">2. The Clementines<P class="in15">3. Apocalyptic Literature<P><b>IV. HISTORY OF EBIONISM</b><P class="in15">1. Ebionites and Essenes<P class="in15">2. Organization of Ebionites<P><b>V. EVIDENCE FROM EBIONISM FOR THE DOCTRINE OF THE PRIMITIVE CHURCH</b><P class="in15">1. Christology of the Early Church<P class="in15">2. Paulinism of the Early Church<P>LITERATURE<hr /><P>General Statement:<P>The Ebionites were a sect of heretics frequently mentioned by the early Fathers. In regard to their opinions, as in regard to those of most early heretical sects, there is the difficulty that to a large extent we are dependent for our information on their opponents. These opponents were not generally very careful to apprehend exactly the views of those whose opinions they undertook to refute. It adds to the difficulty in the present case that there is a dubiety as to the persons designated by the title. Sometimes, it is admitted, the name was used to designate all Jewish Christians irrespective of their opinions; at other times it denotes a sect akin to the Gnostics, who ascribed a purely human origin to our Lord.<P>There are, however, certain works, the Clementine writings, which from statements of the Fathers may be assumed to represent the views of this sect, but as these represent views to some extent divergent, it is difficult to decide which is the truly Ebionitic. There are also certain apocalyptic books which present affinities with Ebionism. The quotations from the Gospel according to the Hebrews—the only gospel the Ebionites received—likewise afford means of appreciating their views. This gospel has come down to us only in isolated quotations, for the accuracy of which we have no guarantee. Finally, it has to be borne in mind that no sect can persist through centuries of changing circumstances, and not in turn undergo change.<P>I. Origin of the Name.<P>1. The Poor Ones:<P>Tertullian and Epiphanius assume the sect to have received its name from a certain Ebion or Hebion. Others of the Fathers, without affirming it, use language which seems to imply the belief in a person called Ebion. This, however, is generally now regarded as a mistake. No trace of the existence of such a person is to be found. The sect in question seems to have assumed the name Ebionites, "the poor ones," from the first Beatitude (<a onClick="return mV(\'Mat\',5,3);">Mt 5:3</a>), claiming to be the continuation into the new dispensation of the "poor and needy" of the Psalms, eg. <a onClick="return mV(\'Psa\',69,33);">Psalm 69:33</a>; <a onClick="return mV(\'Psa\',70,5);">70:5</a>; <a onClick="return mV(\'Psa\',74,21);">74:21</a>.<P>It has been mooted that the sect may have had a leader who assumed the title the poor man. Besides that we have no trace of his existence, the name would almost certainly have been treated as an Aramaic word and put in the status emphaticus as Ebiona, which in Greek would have become Ebionas.<P>2. Origin of the Name:<P>The ordinary view of the origin of the name has the advantage of analogy in its favor. The pre-Reformation Protestants of the 12th and 13th centuries in France called themselves "the poor men" (of Lyons). The fact that the apostle James in his Epistle implies a natural union between poverty and piety (<a onClick="return mV(\'Jam\',2,5);">2:5</a>), "Did not God choose them that are poor as to the world to be rich in faith...?" would confirm the Jewish Christians in their use of the name.<P>Some have been inclined to press unduly a play on the name in which some of the Fathers indulge, as if the poor views of this sect as to the person of Christ had led to their receiving this name from without.<P>II. Authorities for the Opinions of the Ebionites.<P>1. Irenaeus, Tertullian and Hippolytus:<P>As indicated above, the main authorities for these are Irenaeus, Tertullian and Hippolytus. The characteristics of the Ebionites noted by them were, first, the negative one that they did not, like the other Gnostics, distinguish between the Supreme God and the Creator of the world—the demiurge—who was identified with the God of the Jews. With them Yahweh was the Supreme God—the God of Israel and the Creator of the heavens and the earth. The second characteristic, also negative, was that they denied the supernatural birth of our Lord. He was the son of Joseph and Mary in the ordinary sense of the word. The third was that they, along with the Cerinthians and Carpocratians, affirmed that a Divine power came down on Jesus at His baptism—the reward of His perfect holiness. According to one form of theory, the Holy Ghost was the eternal Son of God. Another view was that the power which descended upon Him was the Divine wisdom, the Logos. By the influence of this Divine power He performed miracles and taught with superhuman wisdom. But this Divine influence deserted Jesus on the Cross, hence, the cry of being forsaken (<a onClick="return mV(\'Mat\',27,46);">Mt 27:46</a>). The Divine power, however, raised Him from the dead and caused Him to ascend on high. Hippolytus brings the Ebionites into close connection with the Elkasaites and with a certain Alcibiades, whose views he had to combat in Rome. The last claimed to found his views on a work of Elkasai.<P>2. Origen and Jerome:<P>From two other sources we derive further information: Origen and Jerome both notify the fact that the Ebionites translated \'almah "young woman" (it is rendered "virgin" in our the King James Version and the Revised Version (British and American)). This translation, so far as the mere word is concerned, is indubitably correct. There is another point in which both afford us information. The first says (Contra Celsum, v.61) that there are two classes of Ebionites, one of which denies the miraculous conception and birth of our Lord, the other of which affirms it. Jerome, in his letter to Augustine, not only asserts the same thing but calls the one class, those affirming the miraculous birth, Nazareans, and the other Ebionites. Origen in his second book against Celsus speaks as if the only distinction between the Ebionites and other Christians was their obedience to the Mosaic law, and by their example rebuts the assertion that the Jews in becoming Christians deserted the law of their fathers. Another feature of Ebionism presented to us by Jerome (In Jesaiam, lxvi.24) is their chiliastic view—the personal reign of our Lord for 1,000 years as the Jewish Messiah.<P>3. Epiphanius\' Description:<P>The writer who gives the most voluminous account of the Ebionites—"Ebionaeans" as he calls them—is Epiphanius. With him it is at once heresy No. X and heresy No. XXX. Before discussing the Ebionites he takes up the closely related sect of the Nazareans as heresy No. XXIX. He had already in a more compendious way considered a similarly named sect, numbering it No. XVIII. It, however, is Jewish while this is Christian. The Jewish sect is distinguished by eating no animal food and offering no sacrifices. They have thus an affinity with the Essenes. They have a peculiarity that, while they honored the patriarchs, they rejected the Pentateuch which related their history. These Nazareans dwelt east of the Jordan in Gilead and Bashan. Heresy No. XXIX is the Christian Nazareans. This name had been at first applied to all Christians. Epiphanius identifies them with the Essenes and declares their distinguishing peculiarity to be the retention of circumcision and the ceremonial law. They use the Gospel of Matthew but without the genealogies. As Heresy No. XXX he proceeds to consider the Ebionites. Ebion, Epiphanius assumes to have been a man, and calls him a "polymorphic portent," and asserts that he was connected with the Samaritans, the Essenes, the Cerinthians and Carpocratians, yet desired to be regarded a Christian. The heresy originated after the flight of the church to Pella. They denied the miraculous birth of our Lord, but maintained that a Divine influence came down upon Him at His baptism. This Divine wisdom had inspired, and in a sense dwelt, in all the patriarchs. In some sense the body of Jesus was regarded as that of Adam revived. This body was crucified and rose again. They receive only the Gospel of Matthew in the form the Cerinthians use it, i.e. the Gospel according to the Hebrews. Epiphanius gives some account of this gospel and its defects. They use also other books; one which he especially describes, The Journeyings of Peter, appears to be in the main identical with the Clementine Homilies. He connects the Ebionites, as does Hippolytus, with Elkasai; from him they learned that the heavenly Christ was 96 miles high and 24 broad, and that the Holy Ghost had a female form of similar dimensions, only invisible. Although he connects the Ebionites with the Essenes he mentions that, unlike the Essenes of Josephus and Philo, the Ebionites not only permitted but enjoined matrimony on young men. Epiphanius adds as an especial enormity that the Ebionites permit second, third and even seventh marriages. Although they enjoin marriage they have a low opinion of women, crediting Eve with originating heathenism, in this agreeing with the Essenian opinion of the sex. Mysteriously Epiphanius represents, the Ebionites as not only rejecting the prophets in a body but deriding them. He also mentions the rejection of Paul by the Ebionites. It is exceedingly difficult to form a clear, self-consistent view of the doctrines of the Ebionites from the statements of Epiphanius, yet there are points in which his information is of value.<P>4. Justin Martyr:<P>Though Justin Martyr does not name the Ebionites in his dialogue with Trypho the Jew (47), he mentions two classes of Jewish Christians:<P>(a) those who not only themselves observe the law but would compel the Gentile believers also to be circumcised and keep the whole law, and will hold no communion with those who refuse to become Jews;<P>(b) those who, observing the Mosaic law themselves, enter into communion with uncircumcised Gentile believers.<P>The former appear to be an early form of Ebionites. It is to be noted that Justin does not ascribe to them any doctrinal divergence from the orthodox views. In the following chapter he mentions some that denied the divinity of our Lord, but these were Gentiles (hemeterougenous) "of our race."<P>III. Literature of the Ebionites.<P>One thing of importance we do owe to Epiphanius—the indication of the literature produced by the Ebionites, from which we may get their views at first hand. This includes the Gospel according to the Hebrews, the Clementines (Homilies and Recognitions); to which we would add the Ascension of Isaiah and the Odes of Solomon. It may be remarked that this literature appears to represent the opinion of different classes of the Ebionites. We shall merely consider here the bearing these works have on the Ebionites.<P>1. The Gospel According to the Hebrews:<P>The Gospel according to the Hebrews we know only through quotations. We can have no certainty that these quotations are accurate. The quotations may have been interpolated, and further the book from which the quotations have been made has probably passed through several recensions. The discussion of the question of the relation of this book to the canonical Gospel of Matthew is considered elsewhere (see <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>). One thing is clear, there were at least two recensions of this gospel, one nearer and the other farther from the canonical Gospel; the former, the Nazarean, differed only by omitting the genealogy from the First Gospel of the Canon. The other was more strictly Ebionite and omitted all mention of the miraculous birth. The Ebionite recension began, as Epiphanius tells us, abruptly with the calling of the Apostles. The assertion of Epiphanius that the Ebionites rejected the prophets is supported by a quotation from the Gospel according to the Hebrews in Jerome (Adv. Pelag., iii.2): "In the prophets, after they were anointed by the Spirit, sin was found." The change from akridas ("locusts") to egkridas (literally, "cakes of honey and oil"; compare <a onClick="return mV(\'Exd\',16,31);">Ex 16:31</a>; <a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>) in the account of the food of John may be due to the avoidance of animal food attributed to this sect. One passage, which appears to be a denunciation of wealth in itself, is an addition of a second rich man to the story of the young ruler of the synagogue. A singular verse, quoted from this gospel both by Origen and Jerome, deserves special notice for several reasons: "My mother, the Holy Ghost, took me by one of my hairs and bore me to the great mountain Tabor." The designation of the Holy Ghost as "my mother" is unexampled. It implies a materialistic view of the doctrine of the Trinity after the form of a human family. It is a note of geographical ignorance to call Tabor a "great" mountain. It is only some 2,000 ft. high and behind it are the mountains of the hill country of Galilee rising up to 4,000 ft. in Jebel Jermuk, and behind that the white top of Hermon, 10,000 ft. It is difficult to understand anyone resident in Palestine calling Tabor a "great" mountain. Rising from the plain of Esdraelon it is prominent, but with the higher mountains behind it, it could not even seem great. In a quotation by Jerome (Adv. Pelag., iii.2) our Lord declares Himself unwilling to be baptized by John as unconscious of sin. This suits the representation of Ebionite views which we find in Irenaeus that it was His sinlessness that made Jesus capable of receiving the Holy Ghost.<P>2. The Clementines:<P>The Clementine literature attributed by Epiphanius to the Ebionites is a more important source of information for their opinions. It has come down to us complete in three or four forms, the Homilies, the Recognitions, and two Epitomes which, however, differ less than the two larger works. They all seem to be recensions of an earlier work which has disappeared. The foundation of all of these is a species of religious novel on which are grafted sermons of Peter and his discussions with Simon Magus. Clement, a young Roman orphan of rank in search of a religion, meets Barnabas, who tells him of Christ, describing Him as the "Son of God," and says that He had appeared in Judea. To learn more about Jesus, Clement proceeds to Caesarea, where he meets Peter. He thereafter accompanies Peter to the various places whither the apostle pursues Simon Magus, and in course of his journeyings he meets and recognizes his father, his brother and his mother; hence, the title Recognitions. It is in the discourses of Peter that the Ebionism appears. Its theology is fundamentally Jewish and Essenian. That it is Judaizing is evidenced by the covert hostility to the apostle Paul. There are elements that are not those of orthodox Judaism. The Messiah is coequal, or nearly so, with the devil; in other words, the position is a modification of Parseeism (Hom., III, 5). If the discourse of Barnabas is excluded, our Lord is always called the "prophet" (Hom.), the "Teacher" (Recog.). He is never asserted nor assumed to be Divine. Nothing is said of His miraculous birth. At the same time in the Recognitions He is regarded as not merely man. It is said He "assumed a Jewish body" (Recog, I, 60). This agrees with what Epiphanius says of the Ebionite idea that it was as the body of Adam that the Christ appeared. The apostle Peter, who is represented as the model Christian, eats only herbs and practices frequent ablutions, quite in the manner of the Essenes. In his discourses Peter declares that the true prophet "quenches the fire of altars and represses war." These are Essenian peculiarities, but he "sanctions marriage," against Essenism as we find it in Philo and Josephus The phrase implies an opposition to some who not only did not sanction, but forbade, marriage (Hom., III, 26).<P>3. Apocalyptic Literature:<P>If the ignoring of the work and apostleship of Paul be regarded as the criterion of the Judaizers, that is to say, the Ebionites, then in apocalyptic literature we find works from which we can draw information as to views. The Ascension of Isaiah was one of the earliest of these books to be recovered in modern times. The writer refers to the martyrdom of Peter in Rome, but makes no mention of Paul (IV, 3). The description of elders and shepherds hating one another (III, 29), "lawless elders and unjust shepherds who will ravage their sheep" (III, 24), seems a view of the church\'s state as it appeared to a Judaizer when the Pauline view was prevailing. Notwithstanding this not only is the Divine dignity maintained, but the doctrine of the Trinity, "They all glorified the Father of all and His beloved Son and the Holy Spirit" (VIII, 18), is affirmed. As to the person of Christ, He descended through the successive heavens to the earth to be born (IX, 13; X, 8-31). The virginity of Mary is affirmed (X, 12), and the child is born without pain, miraculously (XI, 8-14). A similar view of the birth of Christ is to be found in the Odes of Solomon (XIX, 7).<P>IV. History of Ebionism.<P>1. Ebionites and Essenes:<P>All authorities combine in asserting a close connection between the Ebionites and the Essenes. At first sight there are serious points of difference, principally these, the Ebionites enjoined marriage, while the Essenes, if we may believe Philo and Josephus, forbade it. This forbiddal, however, appears to have been true only of the Coenobites of Engedi. Moreover, some of the Judaizers, that is Ebionites, are charged with forbidding to marry (<a onClick="return mV(\'1Ti\',4,3);">1Ti 4:3</a>). The Essenes in all their varieties seem to have come over to Christianity on the fall of the Jewish state and the retreat of the church to Pella. When they joined the believers in their exile the Parsee elements began a ferment in the church and Ebionism was one of the products. This probably is the meaning of the statement that Ebion began to teach his doctrines at Pella. If we may judge from the statements of Scripture and from the earliest of the noncanonical apocalypses, the Ebionites were not at first heretical in their Christology. Only they maintained the universal obligation of the ceremonial law, holding that believers of Gentile descent could be received into the church only if they were first circumcised. The keen dialectic of Paul forced them from this position. The abrogation of the Law was closely connected in Paul\'s reasonings with the Divinity of our Lord; consequently some of them may have felt that they could maintain their views more easily by denying His supreme Divinity and the reality of the incarnation. The phenomena of His life rendered it impossible for anyone to declare Him to be merely man. Hence, the complex notion of a Divine influence—an eon, coming down upon Him. If, however, His birth were miraculous, then the supreme greatness of Moses would be impugned, consequently they were led to deny the virgin birth.<P>Not till Theodotus appeared was the purely humanitarian view of our Lord\'s person maintained. All the Hebrew Christians, however, did not pursue the above course. A large section remained at each general stage, and to the end one portion, the Nazareans, maintained their orthodox doctrinal position, and at the same time obeyed the requirements of the Law. The dualism which is found in the Clementines is an endeavor to explain the power of evil in the world and the function of Satan. The Clementines confirm the statement of the Fathers that the Ebionites used only the Gospel of Mark, for there are more quotations from Matthew than from all the other books of the New Testament put together: These quotations are, however, all from chapters after the 3rd chapter. There are, it is to be noted, several unmistakable quotations from the Fourth Gospel. In the Clementines as noticed above there is an avoidance of attributing Divinity to our Lord. He is the Teacher, the Prophet; only in the discourse ascribed to Barnabas is He called the Son of God. This, we are aware, is the reverse of the ordinarily received idea of the historic succession of beliefs. It is thought that, beginning with the belief in the purely ordinary nature of our Lord\'s birth, these Jewish believers gradually added feature after feature until He was regarded as a Divine person, the Divine Logos made flesh by miraculous conception and birth. The abstract possibility of such being the course of events is not denied, but we do say that what evidence we have tends in the direction we have taken. There are elements kindred to Ebionism in the Epistle of James, the prominence given to the poor, the little prominence given to the Divinity of Our Lord or to the doctrines of grace all tend in that direction. Yet there is no developed Ebionism; the Divinity of Christ, if not stated in terms, is implied. Schwegler, followed in more recent times by Dr. Campbell of Dundee, finds a strong Ebionite bias in the Gospel of Luke, in which certainly there is no lessening of our Lord\'s supreme Divinity. All that it amounts to is a prominence given to the poor. The identification of the poor with the righteous has not come down to us as a tenet of the Ebionites; it has been ascribed to them from their name. As already stated in the Ascension of Isaiah, the Divinity of the Messiah is strongly asserted. The farther down the stream of history we go more and more clearly do the Ebionite features appear, till by the time when Alcibiades, the follower of Elkasai, appeared in Rome, we have something widely removed from the Ebionism of the Clementines, far as that is from the simple position occupied by the Nazareans.<P>2. Organization of Ebionites:<P>The Jewish Christians appear to have formed an organization of their own, separate from the church Catholic. The places where they assembled they did not call ekklesiai, "churches," but sunagogai, "synagogues." If we may believe the Clementine Homilies they had evolved a complete episcopal system for themselves. We, however, must not think that every variation of faith had a separate organization for itself. Strict Jewish ceremonial allowed no Jew to eat with any other not a Jew. The "love-feasts" of the early church implied this eating in common. If GentileChristians were present, the Ebionites could not join, hence, the need of a separate church. All Jewish Christians who reverenced the law could meet together and partake of the "love-feast," whatever their belief as to the person of Christ. In short, Ebionism was a thing of individuals, whose opinion ran through the whole gamut of faith, from the Nazareans, who differed from the orthodox simply in remaining Jews, to those whose Judaism alone prevented them from becoming followers of Theodotus of Byzantium, and who therefore sank back into pure Judaism.<P>V. Evidence from Ebionism for the Doctrine of the Primitive Church.<P>1. Christology of the Early Church:<P>In dealing with this branch of our subject we have to consider that the tendency of those who in the early days wrote against heresy was to exaggerate the difference between the heretics and the orthodox. On the other hand we have to consider the psychological difficulty involved in a person recognizing that anyone whom he daily met, whom he saw eating and sleeping like other men, was more than man, was Divine. This difficulty, great to all, was doubly so to the Jew. Yet again we have to consider what the origin of Christian theology was. It was an attempt to give a reasoned and systematic explanation of the phenomenon of Jesus Christ. Christ\'s character, His deeds and His claims had to be explained. The orthodox explanation which gradually became more definite as time rolled on was that He was the second person of the Trinity become incarnate, and the purpose of this incarnation that He might save many from their sins. This purpose He accomplished by dying on the cross and rising again. The primitive church owed its theology to Paul and John. Repugnant as much of this was to the Jews, yet the Ebionites, earnest, prejudiced Jews as they were, could not affirm in the presence of the facts of His career that Jesus was merely a man. They had to imagine a Divine influence coming down upon Him at His baptism, setting Him apart from all others. We have no trace of this at first: it stands at the end of a process of degradation of the ideal concerning the person of Christ. It was only when the effect of His personality had somewhat faded that men began to doubt His Divinity. The division of the personality seems to emerge at the same time. The earlier Ebionites, like the rest of the 1st-century believers, regarded Christ as one person; only later do they reach the notion of a heavenly eon separate from Jesus. The Ebionites seem to have held under varying forms a doctrine of the Trinity, and their holding it is an evidence that the church at large held it, not of course in that definiteness it assumed later, but essentially.<P>2. Paulinism of the Early Church:<P>To some extent the same may be said in regard to the Pauline doctrine of redemption. It is to be observed that both writers, he of the Homilies as well as the writer of the Recognitions, dislike and ignore Paul, even if they do not attempt to pillory him under the image of Simon Magus, as many have thought that they do. What, however, is also to be observed, is that they do not venture to denounce him by name. Paul and his teachings must have been, in the early part of the 2nd century, held in such deep reverence that no one could hope to destroy them by direct assault; the only hope was a flank attack. This reverence for Paul implies the reception of all he taught. All the specially Pauline doctrines of original sin, of redemption through the sacrificial death of Christ, and all the cognate ideas must have been held strongly by the early church or the Ebionites would have denounced Paul in the Clementines by name. Schwegler would argue that Justin Martyr was an Ebionite because he neither mentions nor quotes Paul. To this it may be answered that as the emperors to whom he addressed his apologies were heathens, and Trypho, with whom he had his dialogue, was a Jew, he naturally did not name one whose authority would be valueless to those he was addressing. He is equally silent as to Peter, James and John. If he does not quote Paul there are several indubitable echoes of his phrases and his thoughts.<P>In the face of the recent discoveries made in Egypt one cannot despair of manuscripts turning up which may throw needed light on this heresy. Were the Gospel according to the Hebrews to be found, or a manuscript of Hegesippus, we should be in a better position to decide a number of questions.<P>LITERATURE.<P>Contemporary writers on Ebionites: Irenaeus; Tertullian; Hippolytus; Origen; Eusebius, III, 27; Epiphanius; Jerome; Justin Martyr (Trypho,47,48) refers to the Ebionites without naming them.<P>Ebionite writings: Clementine Homilies; Clementine Recognitions; Clementine Epitomes; Asc Isa; Odes of Solomon. Modern church historians: Neander, General History of the Christian Religion and Church; Schrock, Kirchengeschichte; Walch, Historic der Ketzereien, I, 95-124; Baur, Kirchengeschichte, I, 172-74, and Dogmengeschichte, 140-61, and Christliche Gnosis; Schwegler, Nachapostolisches Zeitalter, 17-198; Ritschl, Altkatholische Kirche, 107-271; Matter, Gnosticisme, III, 11-28; Harnack, History of Dogma, 1-89ff; Reuss, Hist. de la Theologie, I, 115-25; Donaldson, Christian Literature and Doctrine from the Death of the Apostles to the Nicene Council, I, 39ff; Mansel, Gnostic Heresies, 123-26; Helgenfeld, Ketzergeschichte, 421-46, and Clementines.<P>Articles in theological dictionaries: Smith and Wace; RE, 1st, 2nd and 3rd eds; Jewish Encyclopedia; Holtzman u. Zopffel; Lightfoot, Galatians, Disc. III; Colin Campbell, Studies in Luke.``173';

isbe[2872]='Ebony`eb\'-o-ni (hobhnim (pl. only), vocalization uncertain; compare Arabic abnus):<P>Mentioned (<a onClick="return mV(\'Eze\',27,15);">Eze 27:15</a>) along with ivory as merchandise of Tyre brought by the men of Dedan. This is the heavy, black, heart-wood of various species of Diospyros, natives of Southern India and Ceylon; the best kind is obtained from D. ebenum.<P>The sap-wood, being white and valueless, is cut away, but the trunks are sufficiently large to leave blocks of heart-wood 2 ft. in diameter and 10 or more ft. long. Ebony was used by the ancient Egyptians, Greeks and Romans, as well as the Phoenicians, for various purposes; it was frequently inlaid with ivory. In Europe it has been a favorite for cabinet-making down to recent times.``117';
isbe[2873]='Ebron`e\'-brun (\'ebhron; the King James Version wrongly, Hebron):<P>A town in the territory of Asher (<a onClick="return mV(\'Jos\',19,28);">Jos 19:28</a>). Probably we should read here Abdon, as in <a onClick="return mV(\'Jos\',21,30);">Jos 21:30</a>; <a onClick="return mV(\'1Ch\',6,74);">1Ch 6:74</a>, the substitution of the Hebrew letter resh ("r") for the Hebrew letter daleth ("d") being a common copyist\'s error.`<a href="./study/isbe/search.html?string=ABDON">ABDON</a>`1';

isbe[2877]='Ecce Homo`ek\'-se ho\'-mo (idou ho anthropos, "Behold, the man!" <a onClick="return mV(\'Jhn\',19,5);">Joh 19:5</a>):<P>Pilate\'s statement regarding Jesus during His trial. While the significance of this statement is somewhat debatable, yet there is little doubt, as judged from his attitude and statement immediately following, that Pilate was endeavoring to appeal to the accusers\' sympathies and to point out to them the manly qualities of Jesus. The ordinary punctuation which places an exclamation point after "Behold" and a period after "the man" is evidently incorrect if the grammatical structure in the Greek is to be observed, which gives to the second and third words the nominative form, and which therefore admits of a mild exclamation, and therefore of the emphasis upon "the man." Some, however, hold the contrary view and maintain that the utterance was made in a spirit of contempt and ridicule, as much as to say, "Behold here a mere man." See especially on this view Marcus Dods in Expositor\'s Greek Testament. It would seem, however, that the former of the two views would be sustained by the chief facts in the case.``25';
isbe[2878]='Ecclesiastes, the Preacher`e-kle-zi-as\'-tez, or (qoheleth; Ekklesiastes, perhaps "member of assembly"; see below):<P>Contents<P>1. Structure of the Book<P>2. The Contents<P>3. Composite Authorship?<P>4. Qoheleth<P>5. "King in Jerusalem"<P>6. Date and Authorship<P>7. Linguistic Peculiarities<P>8. Certain Inconclusive Arguments<P>9. Canonicity<hr /><P>1. Structure of the Book:<P>Reading this book one soon becomes aware that it is a discussion of certain difficult problems of human life. It begins with a title Ec (<a onClick="return mV(\'Ecc\',1,1);">1:1</a>), followed by a preface (<a onClick="return mV(\'Ecc\',1,\'2-11\');">1:2-11</a>). It has a formal conclusion (<a onClick="return mV(\'Ecc\',12,\'8-13\');">12:8-13</a>). Between the preface and the conclusion the body of the book is made up of materials of two kinds—first a series of "I" sections, sections uttered in the 1st person singular, a record of a personal experience; and second, an alternating series of gnomic sections, sections made up of proverbs (say <a onClick="return mV(\'Ecc\',4,5,6,\'9-12\');">4:5,6,9-12</a>; <a onClick="return mV(\'Ecc\',5,\'1-12\');">5:1-12</a>; <a onClick="return mV(\'Ecc\',7,\'1-14\',\'16-22\');">7:1-14,16-22</a>; <a onClick="return mV(\'Ecc\',8,\'1-8\');">8:1-8</a>; <a onClick="return mV(\'Ecc\',9,\'7-10\');">9:7-10</a>; <a onClick="return mV(\'Ecc\',10,\'1-4\');">10:1-4</a>; <a onClick="return mV(\'Ecc\',10,\'8-\');">10:8-12:7</a>). These may be called the "thou" sections, as most of them have the pronoun of the 2nd person singular. The idea of the vanity of all things characterizes the record of experience, but it also appears in the "thou" sections (eg. <a onClick="return mV(\'Ecc\',9,9);">9:9</a>). On the other hand the proverb element is not wholly lacking in the "I" sections (eg. <a onClick="return mV(\'Ecc\',4,1,2,3);">4:1-3</a>).<P>2. The Contents:<P>In the preface the speaker lays down the proposition that all things are unreal, and that the results of human effort are illusive (<a onClick="return mV(\'Ecc\',1,2,3);">1:2,3</a>). Human generations, day and night, the wind, the streams, are alike the repetition of an unending round (<a onClick="return mV(\'Ecc\',1,\'4-7\');">1:4-7</a>). The same holds in regard to all human study and thinking (<a onClick="return mV(\'Ecc\',1,\'8-11\');">1:8-11</a>). The speaker shows familiarity with the phenomena which we think of as those of natural law, of the persistence of force, but he thinks of them in the main as monotonously limiting human experience. Nothing is new. All effort of Nature or of man is the doing again of something which has already been done.<P>After the preface the speaker introduces himself, and recounts his experiences. At the outset he had a noble ambition for wisdom and discipline, but all he attained to was unreality and perplexity of mind (<a onClick="return mV(\'Ecc\',1,\'12-18\');">Ec 1:12-18</a>). This is equally the meaning of the text, whether we translate "vanity and vexation of spirit" or "vanity and a striving after wind," ("emptiness, and struggling for breath"), though the first of these two translations is the better grounded.<P>Finding no adequate satisfaction in the pursuits of the scholar and thinker, taken by themselves, he seeks to combine these with the pursuit of agreeable sensations—alike those which come from luxury and those which come from activity and enterprise and achievement Ec (<a onClick="return mV(\'Ecc\',2,\'1-12\');">2:1-12</a>). No one could be in better shape than he for making this experiment, but again he only attains to unreality and perplexity of spirit. He says to himself that at least it is in itself profitable to be a wise man rather than a fool, but his comfort is impaired by the fact that both alike are mortal (<a onClick="return mV(\'Ecc\',2,\'13-17\');">2:13-17</a>). He finds little reassurance in the idea of laboring for the benefit of posterity; posterity is often not worthy (<a onClick="return mV(\'Ecc\',2,\'18-21\');">2:18-21</a>). One may toil unremittingly, but what is the use (<a onClick="return mV(\'Ecc\',2,22,23);">2:22,23</a>)?<P>He does not find himself helped by bringing God into the problem. \'It is no good for a man that he should eat and drink and make his soul see good in his toil\' Ec (<a onClick="return mV(\'Ecc\',2,\'24-26\');">2:24-26</a>, as most naturally translated), even if he thinks of it as the gift of God; for how can one be sure that the gift of God is anything but luck? He sees, however, that it is not just to dismiss thus lightly the idea of God as a factor in the problem. It is true that there is a time for everything, and that everything is "beautiful in its time." It is also true that ideas of infinity are in men\'s minds, ideas which they can neither get rid of nor fully comprehend (<a onClick="return mV(\'Ecc\',3,\'1-18\');">3:1-18</a>). Here are tokens of God, who has established an infinite order. If we understood His ways better, that might unravel our perplexities. And if God is, immortality may be, and the solution of our problems may lie in that direction. For a moment it looks as if the speaker were coming out into the light, but doubt resumes its hold upon him. He asks himself, "Who knoweth?" and he settles back into the darkness. He has previously decided that for a man to "eat and drink, and make his soul enjoy good" is not worth while; and now he reaches the conclusion that, unsatisfactory as this is, there is nothing better (<a onClick="return mV(\'Ecc\',3,\'19-22\');">3:19-22</a>).<P>And so the record of experiences continues, hopeful passages alternating with pessimistic passages. After a while the agnosticism and pessimism recede somewhat, and the hopeful passages become more positive. Even though "the poor man\'s wisdom is despised," the speaker says, "the words of the wise heard in quiet are better than the cry of him that ruleth among fools" Ec (<a onClick="return mV(\'Ecc\',9,17);">9:17</a>). He says "Surely I know that it shall be well with them that fear God" (<a onClick="return mV(\'Ecc\',8,12);">8:12</a>), no matter how strongly appearances may indicate the contrary.<P>The gnomic sections are mostly free from agnosticism and pessimism. The book as a whole sums itself up in the conclusion, "Fear God, and keep his commandments" (<a onClick="return mV(\'Ecc\',12,13);">Ec 12:13</a>).<P>Of course the agnostic and pessimistic utterances in Ecc are to be regarded as the presentation of one side of an argument. Disconnect them and they are no part of the moral and religious teaching of the book, except in an indirect way. At no point should we be justified in thinking of the author as really doubting in regard to God or moral obligation. He delineates for us a soul in the toils of mental and spiritual conflict. It is a delineation which may serve for warning, and which is in other ways wholesomely instructive; and in the outcome of it, it is full of encouragement.<P>In some passages the speaker in Ecclesiastes has in mind the solution of the problems of life which we are accustomed to call Epicurean (eg. <a onClick="return mV(\'Ecc\',5,18,19,20);">5:18-20</a>; <a onClick="return mV(\'Ecc\',7,16,17);">7:16-17</a>; <a onClick="return mV(\'Ecc\',8,15);">8:15</a>; but not <a onClick="return mV(\'Ecc\',2,24);">2:24</a>)—the solution which consists in avoiding extremes, and in getting from life as many agreeable sensations as possible; but it is not correct to say that he advocates this philosophy. He rather presents it as an alternative.<P>His conclusion is the important part of his reasoning. All things are vanity. Everything passes away. Yet (he says) it is better to read and use good words than bad words. Therefore because the Great Teacher is wise, he ever teaches the people knowledge, and in so doing he ever seeks good words, acceptable words, upright words, words of truth. "The words of the wise are as goads; and as nails well fastened" ("clinched at the back") (<a onClick="return mV(\'Ecc\',12,11);">12:11</a>). Such are the words of all the great masters. So (he ends) my son, be warned! There are many books in this world. Choose good ones. And his conclusion is: Reverence the Mighty Spirit. Keep to good principles. That is the whole duty of man. For everything at last becomes clear; and "good" stands out clearly from "evil."<P>3. Composite Authorship?:<P>We have noticed that our book has "I" sections and "thou" sections. Certainly these are structural marks, but as such they are capable of being interpreted in various ways. Partitional hypotheses can easily be formed, and perhaps there is no great objection to them; but there are no phenomena which cannot be accounted for by the hypothesis that we have here just the work of one author, who sometimes quotes proverbial utterances, either his own or those of other men. As proving the integrity of the book three points present themselves. First, in some cases (eg. <a onClick="return mV(\'Ecc\',7,14,15,16);">Ec 7:14b-16</a>) the experience matter and the gnomic matter are closely combined in sense and in grammatical construction. Second, it is possible to interpret all the gnomic sections as a part of the continuous argument. Third, if we so interpret them the book is a unit, the argument moving forward continuously out of the speculative into the practical, and out of the darkness into the light.<P>4. Qoheleth:<P>The speaker in Ecclesiastes calls himself Qoheleth (<a onClick="return mV(\'Ecc\',1,1,2,12);">1:1,2,12</a> and other places), rendered "the Preacher" in the English Versions. The word does not occur elsewhere, although it is from a stem that is in common use. Apparently it has been coined for a purpose by the author of Ecclesiastes. In form it is a feminine participle, though it denotes a man. This is best explained as a case of the using of an abstract expression for a concrete, as when in English we say "Your Honor," "Your Majesty." The other words of the stem are used of people gathering in assemblies, and the current explanation is to the effect that Qoheleth is a person who draws an audience whom he may address. To this there are two objections: First, the participle is intransitive; its natural implication is that of a person who participates in an assembly, not of one who causes the participants to assemble. Second, the assembly distinctively indicated by the words of this stem is the official assembly for the transaction of public business. Worked out on this basis Qoheleth seems to mean citizenship, or concretely, a citizen—a citizen of such respectability that he is entitled to participate in public assemblies. It is in the character of citizen-king that the speaker in Ecclesiastes relates his experiences and presents his ideas.<P>This word for "assembly" and its cognates are in the Greek often translated by ekklesia and its cognates (eg. <a onClick="return mV(\'Deu\',4,10);">De 4:10</a>; <a onClick="return mV(\'Deu\',9,10);">9:10</a>; <a onClick="return mV(\'Jdg\',20,2);">Jud 20:2</a>; <a onClick="return mV(\'Jdg\',21,5,8);">21:5, 8</a>). So we are not surprised to find Qoheleth rendered by the Greek Ekklesiastes, and this Latinized into Ecclesiastes.<P>5. "King in Jerusalem":<P>The speaker in Ecc speaks not only in the character of Qoheleth, but in that of "the son of David, king in Jerus" (<a onClick="return mV(\'Ecc\',1,1);">1:1</a>). So far as this clause is concerned the king in question might be either Solomon or any other king of the dynasty, or might be a composite or an ideal king. He is represented (<a onClick="return mV(\'Ecc\',1,\'12-\');">1:12</a> - <a onClick="return mV(\'Ecc\',2,\'1-11\');">2:11</a>) as "king over Israel," and as distinguished for wisdom, for his luxuries, for his great enterprises in building and in business. These marks fit Solomon better than any other king of the dynasty, unless possibly Uzziah. Possibly it is not absurd to apply to Solomon even the phrase "all that were before me over Jerusalem," or "in Jerus" (<a onClick="return mV(\'Ecc\',1,16);">1:16</a>; <a onClick="return mV(\'Ecc\',2,7,9);">2:7,9</a>; compare <a onClick="return mV(\'1Ch\',29,25);">1Ch 29:25</a>; <a onClick="return mV(\'1Ki\',3,12);">1Ki 3:12</a>; <a onClick="return mV(\'2Ch\',1,12);">2Ch 1:12</a>). It is safer, however, to use an alternative statement. The speaker in Ecc is either Solomon or some other actual or composite or ideal king of the dynasty of David.<P>6. Date and Authorship:<P>If it were agreed that Solomon is the citizen king who, in Ecclesiastes, is represented as speaking, that would not be the same thing as agreeing that Solomon is the author of the book. No one thinks that Sir Galahad is the author of Tennyson\'s poem of that name. Qoheleth the king is the character into whose mouth the author of Ecclesiastes puts the utterances which he wishes to present, but it does not follow that the author is himself Qoheleth.<P>The statement is often made that Jewish tradition attributes the writing of Ecclesiastes to Solomon; but can anyone cite any relatively early tradition to this effect? Is this alleged tradition anything else than the confusing of the author with the character whom he has sketched? The well-known classic tradition in Babha\' Bathra\' attributes Ecc to "Hezekiah and his company," not to Solomon. And the tradition which is represented by the order in which the books occur in the Hebrew Bibles seems to place it still later. Concerning this tradition two facts are to be noted: First, it classes Ecclesiastes with the 5 miscellaneous books (Canticles, Ruth, Lamentations, Ecclesiastes, Esther) known as the five meghilloth, the five Rolls. Second, in the count of books which makes the <span class="noTag">number 22</span> or 24 it classes Ecclesiastes as one of the last 5 books (Ecclesiastes, Esther, Dan, Ezra-Nehemiah, 1 and 2 Chronicles). That the men who made this arrangement regarded the books of this group as the latest in the Bible is a natural inference.<P>7. Linguistic Peculiarities:<P>This agrees with the internal marks which constitute the principal evidence we have on this point. The grammatical character and the vocabulary of Ecclesiastes are exceptionally peculiar, and they strongly indicate that the book was written in the same literary period with these other latest books of the Old Testament. The true date is not much earlier or later than 400 BC (see <a href="./study/isbe/search.html?string=CHRONICLES">CHRONICLES</a>), though many place it a century or a century and a half later. Details concerning these phenomena may be found in Driver\'s Introduction or other Introductions, or in commentaries. Only a few of the points will be given here, with barely enough illustrative instances to render the points intelligible.<P>In Ecclesiastes the syntax of the verb is peculiar. The imperfect with waw consecutive, the ordinary Hebrew narrative tense, occurs—for example, "And I applied my heart" (<a onClick="return mV(\'Ecc\',1,17);">1:17</a>)—but it is rare. The narrator habitually uses the perfect with waw (eg. <a onClick="return mV(\'Ecc\',1,13);">1:13</a>; <a onClick="return mV(\'Ecc\',2,11,12,14,15,17);">2:11,12,14,15 bis. 17</a>). In any English book we should find it very noticeable if the author were in the habit of using the progressive form of the verb instead of the ordinary form—if instead of saying "And I applied my heart" he should say "And I was applying my heart," "And I was looking on all the works," "And I was turning" (<a onClick="return mV(\'Ecc\',1,13);">1:13</a>; <a onClick="return mV(\'Ecc\',2,11,12);">2:11-12</a>), and so on. Another marked peculiarity is the frequent repeating of the pronoun along with the verb: \'I said in my heart, even I\'; \'And I was hating, even I, all my labor\' (<a onClick="return mV(\'Ecc\',2,118);">2:1,18</a> and continually). The use of the pronoun as copula is abnormally common in Ecclesiastes as compared with other parts of the Hebrew Bible (eg. <a onClick="return mV(\'Ecc\',4,2);">4:2</a>). The abbreviated form of the relative pronoun is much used instead of the full form, and in both forms the pronoun is used disproportionately often as a conjunction. In these and many similar phenomena the Hebrew language of Ecclesiastes is affiliated with that of the later times.<P>The vocabulary presents phenomena that have the same bearing. Words of the stem taqan appear in Ecclesiastes (<a onClick="return mV(\'Ecc\',1,15);">1:15</a>; <a onClick="return mV(\'Ecc\',7,13);">7:13</a>; <a onClick="return mV(\'Ecc\',12,9);">12:9</a>) and in the Aramaic of Daniel (<a onClick="return mV(\'Dan\',4,36);">4:36</a>), and not elsewhere in the Bible; they are frequent in the Talmud Words of the stem zaman (<a onClick="return mV(\'Ecc\',3,1);">3:1</a>) are used only in Ecclesiastes, Ezra, Nehemiah, Daniel, Esther. Words of the stem shalaT, the stem whence comes our word "sultan," are frequent in Ecclesiastes—words which are used elsewhere only in the avowedly post-exilian books and in <a onClick="return mV(\'Gen\',42,6);">Ge 42:6</a>, though a different word of this stem appears in the history of the time of David. Only in Ecclesiastes and Esther are found the verb kasher, "to be correct" (whence the modern Jewish kosher) and its derivative kishron. The Persian word pardec, "park" (<a onClick="return mV(\'Ecc\',2,5);">Ec 2:5</a>), occurs elsewhere only in Nehemiah and Canticles, and the Persian word pithgam, "official decision" or "record" (<a onClick="return mV(\'Ecc\',8,11);">Ec 8:11</a>), only in <a onClick="return mV(\'Est\',1,20);">Es 1:20</a>, and in the Aramaic parts of Ezra and Daniel. Ecclesiastes also abounds in late words formed from earlier stems—for example, cekhel and cikheluth, "folly" (<a onClick="return mV(\'Ecc\',10,6);">Ec 10:6</a>; <a onClick="return mV(\'Ecc\',2,3);">2:3</a> et al.); or medhinah, "province" (<a onClick="return mV(\'Ecc\',5,8);">Ec 5:8</a>), frequent in the latest books, but elsewhere found only in one passage in 1Ki (<a onClick="return mV(\'1Ki\',20,14,15,17,19);">20:14,15,17,19</a>). Especially common are new derivatives that end in "-n," for example, yithron, "profit"; \'inyan, "travail"; checron, "that which is missing"; ra\'yon, "vexation" (<a onClick="return mV(\'Ecc\',1,3,13,15,17);">Ec 1:3, 13, 15, 17</a> and often). To these add instances of old words used in new meanings, and the various other groups of phenomena that are usual in such cases. No parts of the book are free from them.<P>The arguments for a later date than that which has been assigned are inconclusive. The Hebrew language of Ecclesiastes is more like the language of the Talmuds than is that of the Chronicler or Daniel or even Esther; but if one infers that Ecclesiastes is therefore later than the others the inference will prove to be in various ways embarrassing. The differences are better accounted for by the fact that Ecclesiastes belongs to a different type of literature from the others.<P>8. Certain Inconclusive Arguments:<P>Various passages have local color in Ec (eg. <a onClick="return mV(\'Ecc\',11,1);">11:1</a>), or make the impression of being allusions to specific events (eg. <a onClick="return mV(\'Ecc\',14,\'13-16\');">4:13-16</a>; <a onClick="return mV(\'Ecc\',6,2,3);">6:2-3</a>; <a onClick="return mV(\'Ecc\',9,\'13-18\');">9:13-18</a>), but the difficulty lies in locating the events. Dr. Kleinert argues plausibly for the writing of the book in Egypt in the time of the Ptolemies, but other equally probable hypotheses might be devised.<P>It is alleged that Ecclesiastes copies from Ecclesiasticus, but it is more probable that the latter copied from the former. It is alleged that the Wisdom disputes Ecclesiastes; if it does, that does not prove that the two are contemporary. It is alleged that the writer is familiar with the philosophy of Epicurus, and therefore must have lived later than Epicurus, who died 270 BC, or even later than Lucretius of the 1st century BC. If there were proof that this was a case of borrowing, Epicurus or Lucretius might have been the borrowers; but there is no such proof; the selfishness which constitutes the nucleus of Epicureanism has exhibited itself in human literature from the beginning. The strong resemblances between Ecclesiastes and Omar Khayyam have no weight to prove that the Hebrew author was later than the Persian Ecclesiastes presents a perfectly distinct doctrine of immortality, whether it affirms the doctrine or not; but that proves a relatively early date for the doctrine, rather than a late date for Ecclesiastes. At every point the marks of Ecclesiastes are those of the Persian period, not of the Greek.<P>9. Canonicity:<P>In the early Christian centuries, as in all the centuries since, there have been disputes concerning the canonicity of Ecclesiastes. It was not questioned that Ecclesiastes belonged to the canon as traditionally handed down. No question of admitting it to the canon was raised. But it was challenged because of the agnostic quality of some of its contents, and, every time, on close examination, the challenge was decided in its favor.<P>LITERATURE.<P>There are volumes on Ecclesiastes in all the great commentaries, and treatments of it in the volumes on Introduction. A few of the many separate commentaries are those of Moses Stuart, Andover, 1864; H. Gratz, Leipzig, 1871; G. Wildeboer, Tubingen, 1898; E. H. Plumptre, Cambridge, 1881. Other works are those of J. F. Genung, Ecclesiastes, and Omar Khayyam,1901,Words of Koheleth,1904,and The Hebrew Literature of Wisdom in the Light of Today, 1906; C. H. H. Wright, Book of Koheleth, 1883; S. Schiffer, Das Buch Coheleth nach Talmud und Midrasch, 1885; A. H. McNeile. Introduction to Ecclesiastes, New York, 1904.``11';

isbe[2881]='Ed`(\'edh, "witness"):<P>The name of the altar erected by the trans-Jordanic tribes upon finally taking possession of Gilead (<a onClick="return mV(\'Jos\',22,10,11,34);">Jos 22:10-11, 34</a>); probably east of the Jordan opposite Jericho. But neither the Massoretic Text nor the Septuagint contained the word. Both the King James Version and the Revised Version (British and American), however, insert the word on the authority of a few manuscripts. It has been suggested that it is the final \'edh in Gal\'edh, the name given by Laban and Jacob to the memorial heap of stones erected by them in the vicinity (<a onClick="return mV(\'Gen\',31,47,48);">Ge 31:47-48</a>). According to the Massoretic Text, the name of the altar is the entire sentence: "It is a witness between us that Yahweh is God." The opposition of the ten tribes to the erection of this altar was on the score that it was built after the pattern of the great altar of burnt offering (<a onClick="return mV(\'Jos\',22,11,29);">Jos 22:11, 29</a>), which was a horned altar forbidden in ordinary lay sacrifice. There is in it, therefore, no indication of a general opposition to lay sacrifices on altars of earth or unhewn stone (see Wiener, EPC, 198).``198';
isbe[2882]='Edar`e\'-dar.`<a href="./study/isbe/search.html?string=EDER">EDER</a>`1';
