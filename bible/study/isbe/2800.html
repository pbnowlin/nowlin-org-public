isbe[2884]='Eddinus`ed\'-i-nus (Eddeinous, Codex Alexandrinus, Eddinous):<P>One of the "holy singers" at Josiah\'s Passover (1Esdras 1:15). the King James Version reads here Jeduthun, the corresponding name in the parallel passage (<a onClick="return mV(\'2Ch\',35,15);">2Ch 35:15</a>).``1';
isbe[2885]='Eden`e\'-d\'-n (\'edhen, "delight"; Edem):<P>(1) The land in which "Yahweh God planted a garden," where upon his creation "he put the man whom he had formed" (<a onClick="return mV(\'Gen\',2,8);">Ge 2:8</a>).<P>In the Assyrian inscriptions idinu (Accadian, edin) means "plain" and it is from this that the Biblical word is probably derived. Following are the references to Eden in the Bible, aside from those in <a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a> and <a onClick="return mV(\'Gen\',3,\'1-\');">3</a>; <a onClick="return mV(\'Gen\',4,16);">Ge 4:16</a>; <a onClick="return mV(\'Isa\',51,3);">Isa 51:3</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>; <a onClick="return mV(\'Eze\',31,9,16,18);">31:9, 16, 18</a>; <a onClick="return mV(\'Eze\',36,35);">36:35</a>; <a onClick="return mV(\'Joe\',2,3);">Joe 2:3</a>. The Garden of Eden is said to be "eastward, in Eden" Genesis (<a onClick="return mV(\'Gen\',2,8);">2:8</a>); where the vegetation was luxurious (<a onClick="return mV(\'Gen\',2,9);">2:9</a>) and the fig tree indigenous (<a onClick="return mV(\'Gen\',3,7);">3:7</a>), and where it was watered by irrigation.<P>All kinds of animals, including cattle, beasts of the field and birds, were found there (<a onClick="return mV(\'Gen\',2,19,20);">2:19-20</a>). Moreover, the climate was such that clothing was not needed for warmth. It is not surprising, therefore, that the plural of the word has the meaning "delights," and that Eden has been supposed to mean the land of delights, and that the word became a synonym for Paradise.<P>The location of Eden is in part to be determined from the description already given. It must be where there is a climate adapted to the production of fruit trees and of animals capable of domestication, and in general to the existence of man in his primitive condition. In particular, its location is supposed to be determined by the statements regarding the rivers coursing through it and surrounding it. There is a river (nahar) (<a onClick="return mV(\'Gen\',2,10);">Ge 2:10</a>) which was parted and became four heads (ro\'shim), a word which (<a onClick="return mV(\'Jdg\',8,16);">Jud 8:16</a>; <a onClick="return mV(\'Job\',1,17);">Job 1:17</a>) designates main detachments into which an army is divided, and therefore would more properly signify branches than heads, permitting Josephus and others to interpret the river as referring to the ocean, which by the Greeks was spoken of as the river (okeanos) surrounding the world. According to Josephus, the Ganges, the Tigris, the Euphrates and the Nile are the four rivers, being but branches of this one river. Moreover, it is contended by some, with much show of reason, that the word perath translated Euphrates is a more general term, signifying "the broad" or "deep" river, and so may here refer to some other stream than the Euphrates, possibly to a river in some other region whose name is perpetuated in the present Euphrates, as "the Thames" of New England perpetuates the memory of the Thames of Old England. In ancient times there was a river Phrath in Persia, and perhaps two. It is doubtful whether the phrase "eastward, in Eden" refers to the position with reference to the writer or simply with reference to Eden itself. So far as that phrase is concerned, therefore, speculation is left free to range over the whole earth, and this it has done.<P>1. Central Asia:<P>Columbus when passing the mouth of the Orinoco surmised that its waters came down from the Garden of Eden. It is fair to say, however, that he supposed himself to be upon the east coast of Asia. The traditions of its location somewhere in Central Asia are numerous and persistent. Naturalists have, with Quatrefages, pretty generally fixed upon the portion of Central Asia stretching east from the Pamir, often referred to as the roof of the world, and from which flow four great rivers—the Indus, the Tarim, the Sur Daria (Jaxartes), and the Ainu Daria (Oxus)—as the original cradle of mankind. This conclusion has been arrived at from the fact that at the present time the three fundamental types of the races of mankind are grouped about this region. The Negro races are, indeed, in general far removed from the location, but still fragments of them both pure and mixed are found in various localities both in the interior and on the seashore and adjacent islands where they would naturally radiate from this center, while the yellow and the white races here meet at the present time in close contact. In the words of Quatrefages, "No other region of the globe presents a similar union of extreme human types distributed round a common center" (The Human Species, 176).<P>Philology, also, points to this same conclusion. On the east are the monosyllabic languages, on the north the polysyllabic or agglutinative languages, and on the west and south the inflectional or Aryan languages, of which the Sanskrit is an example, being closely allied to nearly all the languages of Europe. Moreover, it is to this center that we trace the origin of nearly all our domesticated plants and animals. Naturally, therefore, the same high authority writes, "There we are inclined to say the first human beings appeared and multiplied till the populations overflowed as from a bowl and spread themselves in waves in every direction" (ibid., 177). With this conclusion, as already said, a large number of most eminent authorities agree. But it should be noted that if, as we believe, there was a universal destruction of antediluvian man, the center of dispersion had in view by these naturalists and archaeologists would be that from the time of Noah, and so would not refer to the Eden from which Adam and Eve were driven. The same may be said of Haeckel\'s theory that man originated in a submerged continent within the area of the Indian Ocean.<P>2. The North Pole:<P>Dr. William F. Warren has with prodigious learning attempted to show that the original Eden was at the North Pole, a theory which has too many considerations in its support to be cast aside unceremoniously, for it certainly is true that in preglacial times a warm climate surrounded the North Pole in all the lands which have been explored. In Northern Greenland and in Spitzbergen abundant remains of fossil plants show that during the middle of the Tertiary period the whole circumpolar region was characterized by a climate similar to that prevailing at the present time in Southern Europe, Japan, and the Southern United States (see Asa Gray\'s lectures on "Forest Geography and Archaeology" in the American Journal of Science, CXVI, 85-94, 183-96, and Wright, Ice Age in North America, 5th edition, chapter xvii). But as the latest discoveries have shown that there is no land within several hundred miles of the North Pole, Dr. Warren\'s theory, if maintained at all, will have to be modified so as to place Eden at a considerable distance from the actual pole. Furthermore, his theory would involve the existence of "Tertiary man," and thus extend his chronology to an incredible extent, even though with Professor Green (see <a href="./study/isbe/search.html?string=ANTEDILUVIANS">ANTEDILUVIANS</a>) we are permitted to consider the genealogical table of <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> as sufficiently elastic to accommodate itself to any facts which may be discovered.<P>3. Armenia:<P>Much also can be said in favor of identifying Eden with Armenia, for it is here that the Tigris and Euphrates have their origin, while two others, the Aras (Araxes) emptying into the Caspian Sea and the Choruk (thought by some to be the Phasis) emptying into the Black Sea, would represent the Gihon and the Pishon. Havilah would then be identified with Colchis, famous for its golden sands. But Cush is difficult to find in that region; while these four rivers could by no possibility be regarded as branches of one parent stream.<P>4. Babylonia:<P>Two theories locate Eden in the Euphrates valley. Of these the first would place it near the head of the Persian Gulf where the Tigris and Euphrates after their junction form the Shatt el-\'Arab which bifurcates into the eastern and the western arm before reaching the Gulf. Calvin considered the Pishon to be the eastern arm and the Gihon the western arm. Other more recent authorities modify theory by supposing that Gihon and Pishon are represented by the Karum and the Kerkhah rivers which come into the Shatt el-\'Arab from the east. The most plausible objection to this theory is that the Biblical account represents all these branches as down stream from the main river, whereas this theory supposes that two of them at least are up stream. This objection has been ingeniously met by calling attention to the fact that 2,000 years before Christ the Persian Gulf extended up as far as Eridu, 100 miles above the present mouth of the river, and that the Tigris and the Euphrates then entered the head of the Gulf through separate channels, the enormous amount of silt brought down by the streams having converted so much of the valley into dry land. In consequence of the tides which extend up to the head of the Gulf, the current of all these streams would be turned up stream periodically, and so account for the Biblical statement. In this case the river (nahar) would be represented by the Persian Gulf itself, which was indeed called by the Babylonians nar marratum, "the bitter river." This theory is further supported by the fact that according to the cuneiform inscriptions Eridu was reputed to have in its neighborhood a garden, "a holy place," in which there grew a sacred palm tree. This "tree of life" appears frequently upon the inscriptions with two guardian spirits standing on either side.<P>The other theory, advocated with great ability by Friedrich Delitzsch, places Eden just above the site of ancient Babylon, where the Tigris and Euphrates approach to within a short distance of one another and where the country is intersected by numerous irrigating streams which put off from the Euphrates and flow into the Tigris, whose level is here considerably lower than that of the Euphrates—the situation being somewhat such as it is at New Orleans where the Mississippi River puts off numerous streams which empty into Lake Pontchartrain. Delitzsch supposes the Shatt el-Nil, which flows eastward into the Tigris, to be the Gihon, and the Pallacopas, flowing on the west side of the Euphrates through a region producing gold, to be the Pishon. The chief difficulties attending this theory pertain to the identification of the Pishon with the Pallacopas, and the location of Havilah on its banks. There is difficulty, also, in all these theories in the identification of Cush (Ethiopia), later associated with the country from which the Nile emerges, thus giving countenance to the belief of Josephus and many others that that river represented the Gihon. If we are compelled to choose between these theories it would seem that the one which locates Eden near the head of the Persian Gulf combines the greater number of probabilities of every kind.<P>(2) A Levite of the time of Hezekiah (<a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>; <a onClick="return mV(\'2Ch\',31,15);">31:15</a>).<P>LITERATURE.<P>Dawson Modern Science in Bible Lands; Friedrich Delitzsch, Wo lag das Paradies? (1881); Sayce, HCM, 95ff; Hommel, Anc. Hebrew Tradition, 314; William F. Warren, Paradise Found, 1885.``198';

isbe[2887]='Eden, House of``<a href="./study/isbe/search.html?string=AVEN">AVEN</a>; <a href="./study/isbe/search.html?string=BETH-EDEN">BETH-EDEN</a>; <a href="./study/isbe/search.html?string=CHILDREN+OF+EDEN">CHILDREN OF EDEN</a>`1';
isbe[2888]='Eder (1)`e\'-der (\'edher, "flock"):<P>(1) One of the "uttermost cities" of Judah in the Negeb ("south") near the border of Edom (<a onClick="return mV(\'Jos\',15,21);">Jos 15:21</a>), possibly Kh. el \'Adar, 5 miles south of Gaza, but probably this is too far west.<P>(2) Eder (the King James Version Edar) or better Migdal Eder, mighdal \'edher, "the tower of the flock"; Gader. After Rachel died and was buried "in the way to Ephrath (the same is Bethlehem)...Israel journeyed, and spread his tent beyond the tower of Eder" (<a onClick="return mV(\'Gen\',35,19,21);">Ge 35:19, 21</a>). In <a onClick="return mV(\'Gen\',35,27);">Ge 35:27</a> he is described as proceeding to Hebron. This "tower of the flock," which may have been only a tower and no town, must therefore be looked for between Bethlehem and Hebron. Jerome says that it was one Roman mile from Bethlehem. In the Septuagint, however, <a onClick="return mV(\'Gen\',35,16);">35:16</a> and <a onClick="return mV(\'Gen\',35,21);">21</a> are transposed, which suggests that there may have been a tradition that Migdal Eder was between Bethel and Bethlehem. There must have been many such towers for guarding flocks against robbers. Compare "tower of the watchman" (<a onClick="return mV(\'2Ki\',18,8);">2Ki 18:8</a>, etc.). The phrase "Migdal Eder" occurs in <a onClick="return mV(\'Mic\',4,8);">Mic 4:8</a> where Jerusalem is compared to such a tower.``117';
isbe[2889]='Eder (2)`e\'-der (\'edher, "flock").<P>(1) A Merarite Levite in the days of David (<a onClick="return mV(\'1Ch\',23,23);">1Ch 23:23</a>; <a onClick="return mV(\'1Ch\',24,30);">24:30</a>); son of Mushi.<P>(2) A Benjamite (<a onClick="return mV(\'1Ch\',8,15);">1Ch 8:15</a>, the King James Version "Ader").``1';
isbe[2890]='Edes`e\'-dez: the Revised Version (British and American)<P><a href="./study/isbe/search.html?string=EDOS">EDOS</a> (which see).``1';
isbe[2891]='Edge`ej:<P>Very frequently occurs in the phrase "the edge of the sword" (<a onClick="return mV(\'Jos\',10,28);">Jos 10:28</a>, et al.) from the Hebrew peh, "lip," or saphah, "lip." <a onClick="return mV(\'Exd\',28,7);">Ex 28:7</a> and <a onClick="return mV(\'Exd\',39,4);">39:4</a> read "ends," from qatsah, "end" (the King James Version "edge"), and <a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a> has "uttermost part" for the same Hebrew word (the King James Version "edge"). In <a onClick="return mV(\'Jer\',31,29);">Jer 31:29</a> and <a onClick="return mV(\'Eze\',18,2);">Eze 18:2</a>, "The children\'s teeth are set on edge" (qahah, "to be blunt"), i.e. set hard one against another.``1';
isbe[2892]='Edification; Edify`ed-i-fi-ka\'-shun, ed\'-i-fi:<P>The Greek words oikodomeo, "to build," oikodome, "the act of building," are used both literally and figuratively in the New Testament; "edify," "edifying," "edification," are the translation of the King James Version in some 20 passages, all in the figurative sense of the promotion of growth in Christian character. the Revised Version (British and American) in <a onClick="return mV(\'2Cr\',10,8);">2Co 10:8</a>; <a onClick="return mV(\'2Cr\',13,10);">13:10</a>; <a onClick="return mV(\'Eph\',4,12,16);">Eph 4:12, 16</a>; <a onClick="return mV(\'1Th\',5,11);">1Th 5:11</a> renders "build up," "building up," making the force of the figure clearer to the English reader. In <a onClick="return mV(\'1Ti\',1,4);">1Ti 1:4</a> the Greek text followed by the Revised Version (British and American) has oikonomia, "dispensation," instead of oikodomia, "edifying" (the King James Version).``57';
isbe[2893]='Edna`ed\'-na (Edna):<P>Wife of Raguel and mother of Sarah who married Tobias (Tobit 7:2, etc.; 10:12; 11:1). "Edna" in Hebrew means "pleasure" and corresponds to Latin Anna.``1';
isbe[2894]='Edom; Edomites`e\'-dum, e\'-dum-its \'edhom, "red"; Edom:<P>1. Boundaries:<P>The boundaries of Edom may be traced with some approach to accuracy. On the east of the \'Arabah the northern border ran from the Dead Sea, and was marked by Wady el-Kurachi, or Wady el-Chasa. On the east it marched with the desert. The southern border ran by Elath and Ezion-geber (<a onClick="return mV(\'Deu\',2,8);">De 2:8</a>). On the west of the \'Arabah the north boundary of Edom is determined by the south border of Israel, as indicated in <a onClick="return mV(\'Num\',34,3);">Nu 34:3</a> f: a line running from the Salt Sea southward of the Ascent of Akrabbim to Zin and Kadesh-barnea. This last, we are told, lay in the "uttermost" of the border of Edom (<a onClick="return mV(\'Num\',20,16);">Nu 20:16</a>). The line may be generally indicated by the course of Wady el-Fiqrah. How much of the uplands west of the \'Arabah southward to the Gulf of \'Aqaba was included in Edom it is impossible to say.<P>2. Character and Features:<P>The land thus indicated varies greatly in character and features. South of the Dead Sea in the bottom of the valley we have first the stretch of salt marsh land called es-Sebkha; then, beyond the line of white cliffs that crosses the valley diagonally from northwest to southeast, a broad depression strewn with stones and sandhills, the debris of an old sea bottom, rises gradually, and 60 miles to the south reaches a height of about 700 ft. above the level of the Red Sea, 2,000 ft. above that of the Dead Sea. From this point it sinks until it reaches the shore of the Gulf of \'Aqaba, 45 miles farther south. The whole depression is known today as Wady el-\'Arabah (compare Hebrew ha-\'arabhah, <a onClick="return mV(\'Deu\',2,8);">De 2:8</a> the Revised Version (British and American), etc.). On either side the mountains rise steeply from the valley, their edges carved into many fantastic shapes by the deep wadys that break down from the interior (see <a href="./study/isbe/search.html?string=ARABAH">ARABAH</a>). The northern part of the plateau on the west forms the spacious grazing ground of the \'Azdzimeh Arabs. The mountains rise to a height of from about 1,500 ft. to a little over 2,000 ft. This district was traversed by the ancient caravan road to south Palestine; and along the eastern side traces of the former civilization are still to be seen. The desert region to the south is higher, reaching to as much as 2,600 ft. The mountain range east of the \'Arabah is generally higher in the south than in the north. Jebel Harun beside Petra, is 4,780 ft. above sea-level; while east of \'Aqaba, Jebel el-Chisma may be as much as 5,900 ft. in height.<P>Limestone, porphyry and Nubian sandstone are the prevailing formation; but volcanic rocks are also found. The range consists mainly of rough rocky heights with many almost inaccessible peaks separated by deep gorges. But there are also breadths of fertile land where wheat, grapes, figs, pomegranates and olives are grown to advantage. The northern district is known today by the name el-Jebal, corresponding to the ancient Gebal. Seir is the name applied to the eastern range in <a onClick="return mV(\'Gen\',36,8);">Ge 36:8</a>; <a onClick="return mV(\'Deu\',2,1,5);">De 2:1, 5</a>; <a onClick="return mV(\'2Ch\',20,23);">2Ch 20:23</a>. It is also called Edom, and the Mount of Esau (<a onClick="return mV(\'Oba\',1,8);">Ob 1:8</a>f). Seir, however, is used for the western highlands in <a onClick="return mV(\'Deu\',33,2);">De 33:2</a>. This seems to be its meaning also in <a onClick="return mV(\'Jdg\',5,4);">Jud 5:4</a>, where it appears as the equivalent of "the field of Edom." With this same phrase, however, in <a onClick="return mV(\'Gen\',32,3);">Ge 32:3</a> it may more fitly apply to the eastern range.<P>See illustration under <a href="./study/isbe/search.html?string=DESERT">DESERT</a>.<P>3. Origin of Name:<P>The name Edom, "red," may have been derived from the red sandstone cliffs characteristic of the country. It was applied to Esau because of the color of his skin (<a onClick="return mV(\'Gen\',25,25);">Ge 25:25</a>), or from the color of the pottage for which he sold his birthright (<a onClick="return mV(\'Gen\',25,30);">Ge 25:30</a>). In <a onClick="return mV(\'Gen\',36,8);">Ge 36:8</a> Esau is equated with Edom as dwelling in Mt. Seir; and he is described as the father of Edom (36:9, Hebrew). The name however is probably much older. It may be traced in the records of the Twelfth Dynasty in Egypt. In the Tell el-Amarna Letters (Brit Mus No. 64) Udumu, or Edom, is named; and in Assyrian inscriptions the name Udumu occurs of a city and of a country. The latter may have been named from the former: this again may have been derived from a deity, Edom, who may be traced in such a name as Obed-edom (<a onClick="return mV(\'2Sa\',6,10);">2Sa 6:10</a>).<P>4. History:<P>The children of Esau are said to have "destroyed" the Horites who dwelt in Seir before them (<a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a>; <a onClick="return mV(\'Deu\',2,22);">De 2:22</a>). This only means that the Horites were subdued. Esau married the daughter of Anah, a Horite (<a onClick="return mV(\'Gen\',36,20);">Ge 36:20</a>—in verse <a onClick="return mV(\'Gen\',36,2);">2</a> he is called a Hivite); and the lists in this chapter show that the races intermingled. The Horite government was in the hands of "dukes" (<a onClick="return mV(\'Gen\',36,29);">Ge 36:29</a>f; the Revised Version (British and American) "chiefs"). They were succeeded by dukes of the house of Esau (<a onClick="return mV(\'Gen\',36,40);">Ge 36:40</a>ff). This form of government gave way to that of an elective monarchy (<a onClick="return mV(\'Gen\',36,31);">Ge 36:31</a>ff); and this had existed some time before Israel left the wilderness. The then reigning king would not permit Israel to pass through the land (<a onClick="return mV(\'Num\',20,14);">Nu 20:14</a>ff; <a onClick="return mV(\'Num\',21,4);">21:4</a>). Israel was forbidden to "abhor an Edomite," on the ground that he was a brother; and children of the third generation might enter the assembly of the Lord (<a onClick="return mV(\'Deu\',23,7);">De 23:7</a>f). War with Edom was out of the question.<P>Some thirty years after the Exodus, Ramses III "smote the people of Seir." The Israelites could not have been far off. We first hear of war between Israel and Edom under Saul (<a onClick="return mV(\'1Sa\',14,47);">1Sa 14:47</a>). David prosecuted the war with terrific energy, slaying 18,000 Edomites (so read instead of "Syrians") in the Valley of Salt (<a onClick="return mV(\'2Sa\',8,13);">2Sa 8:13</a>f); Joab remaining for six months in the country, which was garrisoned by Israelites, "until he had cut off every male in Edom" (<a onClick="return mV(\'1Ki\',11,15);">1Ki 11:15</a>f). Hadad of the blood royal of Edom escaped to Egypt, and later became a source of trouble to Solomon (<a onClick="return mV(\'1Ki\',11,14);">1Ki 11:14</a>ff, <a onClick="return mV(\'1Ki\',11,25);">25</a>). The conquest of Edom opened to Israel the ports of the Red Sea, whence the expeditions of Solomon and Jehoshaphat set out. In Jehoshaphat\'s time the king is called a "deputy" (<a onClick="return mV(\'1Ki\',22,47);">1Ki 22:47</a>). Its king acknowledged the supremacy of Judah (<a onClick="return mV(\'2Ki\',3,9);">2Ki 3:9</a>, etc.). Under Jehoram son of Jehoshaphat, Edom revolted. Jehoram defeated them at Zair, but was unable to quell the rebellion (<a onClick="return mV(\'2Ki\',8,20);">2Ki 8:20</a>ff). Amaziah invaded the country, slew 10,000 in the Valley of Salt, and took Sela which he named Joktheel (<a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>). Uzziah restored the Edomite port of Elath (<a onClick="return mV(\'2Ki\',14,22);">2Ki 14:22</a>). In the Syrian war Rezin regained Elath for Syria, and cast out the Jews. It was then permanently occupied by Syrians—here also probably we should read Edomites (<a onClick="return mV(\'2Ki\',16,6);">2Ki 16:6</a>). From the cuneiform inscriptions we learn that when Tiglath-pileser subdued Rezin, among the kings from whom he received homage at Damascus was Qaus-malaka of Edom (736 BC). Later Malik-ram paid homage to Sennacherib. To Ezarhaddon also they were compelled to render service. They gave what help they could to Nebuchadnezzar, and exulted in the destruction of Jerusalem, stirring the bitterest indignation in the hearts of the Jews (<a onClick="return mV(\'Lam\',4,21);">La 4:21</a>; <a onClick="return mV(\'Eze\',25,12);">Eze 25:12</a>; <a onClick="return mV(\'Eze\',35,3);">35:3</a>ff; <a onClick="return mV(\'Oba\',1,10);">Ob 1:10</a>ff). The Edomites pressed into the now empty lands in the south of Judah. In 300 BC Mt. Seir with its capital Petra fell into the hands of the Nabateans.<P>5. Idumaea and the Idumeans:<P>West of the \'Arabah the country they occupied came to be known by the Greek name Idumaea, and the people as Idumeans. Hebron, their chief city, was taken by Judas Maccabeus in 165 BC (1Macc 4:29,61; 5:65). In 126 BC the country was subdued by John Hyrcanus, who compelled the people to become Jews and to submit to circumcision. Antipater, governor of Idumaea, was made procurator of Judea, Samaria and Galilee by Julius Caesar. He paved the way to the throne for his son Herod the Great. With the fall of Judah under the Romans, Idumaea disappears from history.<P>The names of several Edomite deities are known: Hadad, Qaus, Koze, and, possibly, Edom; but of the religion of Edom we are without information. The language differed little from Hebrew.``54';
isbe[2895]='Edos`e\'-dos (Edais; the King James Version Edes):<P>One who agreed to put away his foreign wife (1Esdras 9:35); called Iddo, the King James Version "Jadan," in <a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>.``1';
isbe[2896]='Edrei`ed\'-re-i (\'edhre\'i; Edra-ein):<P>(1) One of the cities of Og, not far from Ashtaroth, where the power of his kingdom received its deathblow from the invading Israelites (<a onClick="return mV(\'Jos\',12,4);">Jos 12:4</a>; <a onClick="return mV(\'Num\',21,33);">Nu 21:33</a>ff, etc.). It seems to mark the western limit of Bashan as against Salecah on the east (<a onClick="return mV(\'Deu\',3,10);">De 3:10</a>). It was given to Machir, son of Manasseh (<a onClick="return mV(\'Jos\',13,31);">Jos 13:31</a>). Eusebius, Onomasticon places it 24 Roman miles from Bostra. The most probable identification is with Der\'ah, a town of between 4,000 and 5,000 inhabitants, on the southern lip of Wady Zeideh, about 29 miles as the crow flies east of the Sea of Galilee. It is the center of an exceedingly fruitful district. The accumulated rubbish in the town covers many remains of antiquity. It is, however, chiefly remarkable for the extraordinary subterranean city, as yet only partially explored, cut in the rock under the town. This is certainly very ancient, and was doubtless used by the inhabitants as a refuge in times of stress and peril. For a description see Schumacher, Across the Jordan, 121ff.<P>(2) A place not identified, between Kedesh and En-hazor (<a onClick="return mV(\'Jos\',19,37);">Jos 19:37</a>).``54';
isbe[2897]='Education`ed-u-ka\'-shun:<P>Contents<P><b>I. EDUCATION DEFINED</b><P><b>II. EDUCATION IN EARLY ISRAEL</b><P class="in15">1. Nomadic and Agricultural Periods<P class="in15">2. The Monarchical Period<P class="in15">3. Deuteronomic Legislation<P class="in15">4. Reading and Writing<P><b>III. EDUCATION IN LATER ISRAEL</b><P class="in15">1. Educational Significance of the Prophets<P class="in15">2. The Book of the Law<P class="in15">3. Wise Men or Sages<P class="in15">4. The Book of Proverbs<P class="in15">5. Scribes and Levites<P class="in15">6. Greek and Roman Influences<P><b>IV. EDUCATION IN NEW TESTAMENT TIMES</b><P class="in15">1. Subject Matter of Instruction<P class="in15">2. Method and Aims<P class="in15">3. Valuable Results of Jewish Education<P class="in15">4. The Preeminence of Jesus as a Teacher<P class="in15">5. Educational Work of the Early Disciples<P><b>V. LITERATURE</b><hr /><P>I. Education Defined.<P>By education we understand the sum total of those processes whereby society transmits from one generation to the next its accumulated social, intellectual and religious experience and heritage. In part these processes are informal and incidental, arising from participation in certain forms of social life and activity which exist on their own account and not for the sake of their educative influence upon the rising generation. The more formal educative processes are designed<P>(1) to give the immature members of society a mastery over the symbols and technique of civilization, including language (reading and writing), the arts, the sciences, and religion, and<P>(2) to enlarge the fund of individual and community knowledge beyond the measure furnished by the direct activities of the immediate environment (compare Dewey, article on "Education" in Monroe\'s CE; compare Butler, ME).<P>Religious education among ancient and modern peoples alike reveals clearly this twofold aspect of all education. On its informal side it consists in the transmission of religious ideas and experience by means of the reciprocal processes of imitation and example; each generation, by actually participating in the religious activities and ceremonies of the social group, imbibing as it were the spirit and ideals of the preceding generation as these are modified by the particular economic and industrial conditions under which the entire process takes place. Formal religious education begins with the conscious and systematic effort on the part of the mature members of a social group (tribe, nation, or religious fellowship) to initiate the immature members by means of solemn rites and ceremonies, or patient training, or both, into the mysteries and high privileges of their own religious fellowship and experience. As regards both the content and form of this instruction, these will in every case be determined by the type and stage of civilization reflected in the life, occupations, habits and customs of the people. Among primitive races educational method is simpler and the content of formal instruction less differentiated than on higher culture levels (Ames, PRE). All education is at first religious in the sense that religious motives and ideas predominate in the educational efforts of all primitive peoples. The degree to which religion continues preeminent in the educational system of a progressive nation depends upon the vitality of its religion and upon the measure of efficiency and success with which from the first that religion is instilled into the very bone and sinew of each succeeding generation. Here lies the explanation of the religious-educational character of Hebrew national life, and here, too, the secret of Israel\'s incomparable influence upon the religious and educational development of the world. The religion of Israel was a vital religion and it was a teaching religion (Kent, GTJC).<P>II. Education in Early Israel.<P>In their social and national development the Hebrews passed through several clearly marked cultural stages which it is important to note in connection with their educational history. At the earliest point at which the Old Testament gives us any knowledge of them, they, like their ancestors, were nomads and shepherds. Their chief interest centered in the flocks and herds from which they gained a livelihood, and in the simple, useful arts that seem gradually to have become hereditary in certain families. With the settlement of the Hebrew tribes in Palestine and their closer contact with Canaanitish culture, a more established agricultural life with resulting changes in social and religious institutions gradually superseded the nomadic stage of culture. A permanent dwelling-place made possible, as the continual warfare of gradual conquest made necessary, a closer federation of the tribes, which ultimately resulted in the establishment of the monarchy under David (W. R. Smith, RS; Davidson, HE).<P>1. Nomadic and Agricultural Periods:<P>In these earliest cultural periods, both the nomadic and the agricultural, there was no distinct separation between the spheres of religion and ordinary life. The relation of the people to Yahweh was conceived by them in simple fashion as involving on their part the obligation of filial obedience and loyalty, and on Yahweh\'s part reciprocal parental care over them as His people. The family was the social unit and its head the person in whom centered also religious authority and leadership, The tribal head or patriarch in turn combined in himself the functions which later were differentiated into those of priest and prophet and king. Education was a matter of purely domestic interest and concern. The home was the only school and the parents the only teachers. But there was real instruction, all of which, moreover, was given in a spirit of devout religious earnestness and of reverence for the common religious ceremonies and beliefs, no matter whether the subject of instruction was the simple task of husbandry or of some useful art, or whether it was the sacred history and traditions of the tribe, or the actual performance of its religious rites. According to Josephus (Ant., IV, viii, 12) Moses himself had commanded, "All boys shall learn the most important parts of the law since such knowledge is most valuable and the source of happiness"; and again he commanded (Apion, II, 25) to teach them the rudiments of learning (reading and writing) together with the laws and deeds of the ancestors, in order that they might not transgress or seem ignorant of the laws of their ancestors, but rather emulate their example. Certain it is that the earliest legislation, including the Decalogue, emphasized parental authority and their claim on the reverence of their children: "Honor thy father and thy mother, that thy days may be long in the land which Yahweh thy God giveth thee" (<a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>); "And he that smiteth his father, or his mother, shall be surely put to death. And he that curseth his father or his mother, shall surely be put to death" (<a onClick="return mV(\'Exd\',21,15,17);">Ex 21:15, 17</a>); while every father was exhorted to explain to his son the origin and significance of the great Passover ceremony with its feast of unleavened bread: "And thou shalt tell thy son in that day, saying, It is because of that which Yahweh did for me when I came forth out of Egypt" (<a onClick="return mV(\'Exd\',13,8);">Ex 13:8</a>).<P>2. The Monarchical Period:<P>The period of conquest and settlement developed leaders who not only led the allied tribes in battle, but served as judges between their people, and were active in the maintenance of the ancestral religion. In time, sufficient cooperation was obtained to make possible the organization of strong intertribal leagues and, finally, the kingship. "This increasing political unification," says Ames, "was accompanied by a religious consciousness which became ultimately the most remarkable product of the national development" (Ames, PRE, 174f). The establishment of the kingdom and the beginnings of city and commercial life were accompanied by more radical cultural changes, including the differentiation of religious from other social institutions, the organization of the priesthood, and the rise and development of prophecy. Elijah, the Tishbite, Amos, the herdsman from Tekoa, Isaiah, the son of Amoz, were all champions of a simple faith and ancient religious ideals as over against the worldly-wise diplomacy and sensuous idolatry of the surrounding nations. Under the monarchy also a new religious symbolism developed. Yahweh was thought of as a king in whose hands actually lay the supreme guidance of the state: "Accordingly the organization of the state included provision for consulting His will and obtaining His direction in all weighty matters" (W. R. Smith, RS, 30). Under the teaching of the prophets the ideal of personal and civic righteousness was moved to the very forefront of Hebrew religious thought, while the prophetic ideal of the future was that of a time when "the earth shall be full of the knowledge of Yahweh, as the waters cover the sea" (<a onClick="return mV(\'Isa\',11,9);">Isa 11:9</a>), when all "from the least of them unto the greatest of them" shall know him (<a onClick="return mV(\'Jer\',31,34);">Jer 31:34</a>). Concerning the so-called "schools of the prophets" which, in the days of Elijah, existed at Bethel, Jericho and Gilgal (<a onClick="return mV(\'2Ki\',2,3,5);">2Ki 2:3, 5</a>; <a onClick="return mV(\'2Ki\',4,38);">4:38</a>f), and probably in other places, it should be noted that these were associations or brotherhoods established for the purpose of mutual edification rather than education. The Bible does not use the word "schools" to designate these fraternities. Nevertheless, we cannot conceive of the element of religious training as being entirely absent.<P>3. Deuteronomic Legislation:<P>Shortly before the Babylonian captivity King Josiah gave official recognition and sanction to the teachings of the prophets, while the Deuteronomic legislation of the same period strongly emphasized the responsibility of parents for the religious and moral instruction and training of their children. Concerning the words of the law Israel is admonished: "Thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thy house, and when thou walkest by the way, and when thou liest down, and when thou risest up" (<a onClick="return mV(\'Deu\',6,7);">De 6:7</a>; <a onClick="return mV(\'Deu\',11,19);">11:19</a>). For the benefit of children as well as adults the law was to be written "upon the door-posts" and "gates" (<a onClick="return mV(\'Deu\',6,9);">De 6:9</a>; <a onClick="return mV(\'Deu\',11,20);">11:20</a>), and "very plainly" upon "great stones" set up for this purpose upon the hilltops and beside the altars (<a onClick="return mV(\'Deu\',27,\'1-8\');">De 27:1-8</a>). From the Deuteronomic period forward, religious training to the Jew became the synonym of education, while the word Torah, which originally denoted simply "Law" (<a onClick="return mV(\'Exd\',24,12);">Ex 24:12</a>; <a onClick="return mV(\'Lev\',7,1);">Le 7:1</a>; <a onClick="return mV(\'Lev\',26,46);">26:46</a>), came to mean "religious instruction or teaching," in which sense it is used in <a onClick="return mV(\'Deu\',4,44);">De 4:44</a>; <a onClick="return mV(\'Deu\',5,1);">5:1</a>, "This is the law which Moses set before the children of Israel:...Hear, O Israel, the statutes and the ordinances which I speak in your ears this day, that ye may learn them, and observe to do them"; and in <a onClick="return mV(\'Pro\',6,23);">Pr 6:23</a>,<P class="in15">"For the commandment is a lamp; and the law is light;<br>And reproofs of instruction are the way of life."<P class="in15">(Compare <a onClick="return mV(\'Psa\',19,8);">Ps 19:8</a>; <a onClick="return mV(\'Pro\',3,1);">Pr 3:1</a>; <a onClick="return mV(\'Pro\',4,2);">4:2</a>.)<P>4. Reading and Writing:<P>With the development and reorganization of the ritual, priests and Levites, as the guardians of the law, were the principal instructors of the people, while parents remained in charge of the training of the children. In families of the aristocracy the place of the parents was sometimes taken by tutors, as appears from the case of the infant Solomon, whose training stems to have been entrusted to the prophet Nathan (<a onClick="return mV(\'2Sa\',12,25);">2Sa 12:25</a>). There is no way of determining to what extent the common people were able to read and write. Our judgment that these rudiments of formal education in the modern sense were not restricted to the higher classes is based upon such passages as <a onClick="return mV(\'Isa\',29,11,12);">Isa 29:11-12</a>, which distinguishes between the man who "is learned" (literally, "knoweth letters") and the one who is "not learned," and <a onClick="return mV(\'Isa\',10,19);">Isa 10:19</a>, referring to the ability of a child "to write," taken together with such facts as that the literary prophets Amos and Micah sprang from the ranks of the common people, and that "the workman who excavated the tunnel from the Virgin\'s Spring to the Pool of Siloam carved in the rock the manner of their work" (Kennedy in HDB). It should be added that the later Jewish tradition reflected in the Talmud, Targum and Midrash, and which represents both public, elementary and college education as highly developed even in patriarchal times, is generally regarded as altogether untrustworthy.<P>III. Education in Later Israel.<P>The national disaster that befell the Hebrew people in the downfall of Jerusalem and the Babylonian captivity was not without its compensating, purifying and stimulating influence upon the religious and educational development of the nation. Under the pressure of adverse external circumstances the only source of comfort for the exiled people was in the law and covenant of Yahweh, while the shattering of all hope of immediate national greatness turned the thought and attention of the religious leaders away from the present toward the future. Two types of Messianic expectation characterized the religious development of the exilic period. The first is the priestly, material hope of return and restoration reflected in the prophecies of Ezekiel. The exiled tribes are to return again to Jerusalem; the temple is to be restored, its ritual and worship purified and exalted, the priestly ordinance and service elaborated. The second is the spiritualized and idealized Messianic expectation of the Second Isaiah, based on teachings of the earlier prophets. For the greatest of Hebrew prophets Yahweh is the only God, and the God of all nations as well as of Israel. For him Israel is Yahweh\'s servant, His instrument for revealing Himself to other nations, who, when they witness the redemption of Yahweh\'s suffering Servant, will bow down to Yahweh and acknowledge His rule. "Thus the trials of the nation lead to a comprehensive universalism within which the suffering Israel gains an elevated and ennobling explanation" (Ames, PRE, 185). In the prophetic vision of Ezekiel we must seek the inspiration for the later development of Jewish ritual, as well as the basis of those eschatological hopes and expectations which find their fuller expression in the apocalypse of Daniel and the kindred literature of the later centuries. The prophecies of the Isaiahs and the Messianic hope which these kindled in the hearts of the faithful prepared the way for the teachings of Jesus concerning a Divine spiritual kingdom, based upon the personal, ethical character of the individual and the mutual, spiritual fellowship of believers.<P>1. Educational Significance of the Prophets:<P>The educational significance of the prophetic writings of this as of the preceding periods is that the prophets themselves were the real religious leaders and representative men (Kulturtrager) of the nation. In advance of their age they were the heralds of Divine truth; the watchmen on the mountain tops whose clear insight into the future detected the significant elements in the social and religious conditions and tendencies about them, and whose keen intellect and lofty faith grasped the eternal principles which are the basis of all individual and national integrity and worth. These truths and principles they impressed upon the consciousness of their own and succeeding generations, thereby giving to future teachers of their race the essence of their message, and preparing the way for the larger and fuller interpretation of religion and life contained in the teachings of Jesus. The immediate influence of their teaching is explained in part by the variety and effectiveness of their teaching method, their marvelous simplicity and directness of speech, their dramatic emphasis upon essentials and their intelligent appreciation of social conditions and problems about them.<P>2. The Book of the Law:<P>The immediate bond of union, as well as the textbook and program of religious instruction, during the period of the captivity and subsequently, was the Book of the Law, which the exiles carried with them to Babylon. When in 458 BC a company of exiles returned to Palestine, they along with their poorer brethren who had not been carried away, restored the Jewish community at Jerusalem, and under the suzerainty of Persia, founded a new nationalism, based, even more than had been the earlier monarchy, upon the theocratic conception of Israel\'s relation to Yahweh. During this period it was that writings of poets, lawgivers, prophets and sages were brought together into one sacred collection of scrolls, known later as the Old Testament canon, of which the Torah (the law) was educationally the most significant. The recognized teachers of this period included, in addition to the priests and Levites, the "wise men," or "sages" and the "scribes" or copherim (literally, "those learned in Scriptures").<P>3. Wise Men or Sages:<P>Whether or not the sages and scribes of the later post-exilic times are to be regarded as one and the same class, as an increasing number of scholars are inclined to believe, or thought of as distinct classes, the wise men clearly antedate, not only the copherim but in all probability all forms of book learning as well. Suggestions of their existence and function are met with in earliest times both in Israel and among other nations of the east. As illustrations of their appearance in preexilic Old Testament history may be cited the references in <a onClick="return mV(\'2Sa\',14,\'1-20\');">2Sa 14:1-20</a>; <a onClick="return mV(\'1Ki\',4,32);">1Ki 4:32</a>; <a onClick="return mV(\'Isa\',29,10);">Isa 29:10</a>. It is no lesser personage than King Solomon who, both by his contemporaries and later generations as well, was regarded as the greatest representative of this earlier group of teachers who uttered their wisdom in the form of clever, epigrammatic proverbs and shrewd sayings. The climax of Wisdom-teaching belongs, however, to the later post-exilic period. Of the wise men of this later day an excellent description is preserved for us in the Book of Ecclesiasticus 39:3-10; 1:1-11<P class="in15">"He seeks out the hidden meaning of proverbs,<br >And is conversant with the subtleties of parables,<br >He serves among great men,<br >And appears before him who rules;<br >He travels through the land of strange nations;<br >For he hath tried good things and evil among men".<br>"He shows forth the instruction which he has been taught,<br >And glories in the law of the covenant of the Lord".<br >"Nations shall declare his wisdom,<br >And the congregation shall tell out his praise."<P>4. The Book of Proverbs:<P>Of the pedagogic experience, wisdom and learning of these sages, the Book of Proverbs forms the Biblical repository. Aside from the Torah it is thus the oldest handbook of education. The wise men conceive of life itself as a discipline. Parents are the natural instructors of their children:<P>"My son, hear the instruction of thy father, And forsake not the law of thy mother." <a onClick="return mV(\'Pro\',1,8);">Pr 1:8</a>.<P>(Compare <a onClick="return mV(\'Pro\',4,\'1-4\');">4:1-4ff</a>; <a onClick="return mV(\'Pro\',6,20);">6:20</a>; <a onClick="return mV(\'Pro\',13,1);">13:1</a>.) The substance of such parental teaching is to be the \'fear of Yahweh\' which "is the beginning of wisdom"; and fidelity in the performance of this parental obligation has the promise of success: "Train up a child in the way he should go, And even when he is old he will not depart from it." <a onClick="return mV(\'Pro\',22,6);">Pr 22:6</a>.<P>In their training of children, parents are to observe sternness, not hesitating to apply the rod of correction, when needed (compare <a onClick="return mV(\'Pro\',23,13,14);">Pr 23:13-14</a>), yet doing so with discretion, since wise reproof is better than "a hundred stripes" (<a onClick="return mV(\'Pro\',17,10);">Pr 17:10</a>). Following the home training there is provision for further instruction at the hands of professional teachers for all who would really obtain unto "wisdom" and who can afford the time and expense of such special training. The teachers are none other than the wise men or sages whose words "heard in quiet" (<a onClick="return mV(\'Ecc\',9,17);">Ec 9:17</a>) are "as goads, and as nails well fastened" (<a onClick="return mV(\'Ecc\',12,11);">Ec 12:11</a>). Their precepts teach diligence Pr (<a onClick="return mV(\'Pro\',6,\'6-11\');">6:6-11</a>), chastity (<a onClick="return mV(\'Pro\',7,5);">7:5</a>), charity (<a onClick="return mV(\'Pro\',14,21);">14:21</a>), truthfulness (<a onClick="return mV(\'Pro\',17,7);">17:7</a>) and temperance (<a onClick="return mV(\'Pro\',21,17);">21:17</a>; <a onClick="return mV(\'Pro\',23,20,21,\'29-35\');">23:20, 21, 29-35</a>); for the aim of all Wisdom-teaching is none other than<P class="in15">"To give prudence to the simple,<br>To the young man knowledge and discretion:<br>That the wise man may hear, and increase in learning;<br>And that the man of understanding may attain unto sound counsels."<br> — <a onClick="return mV(\'Pro\',1,4,5);">Pr 1:4-5</a>.<P>5. Scribes and Levites:<P>The copherim or "men of book learning" were editors and interpreters as well as scribes or copyists of ancient and current writings. As a class they did not become prominent until the wise men, as such, stepped into the background, nor until the exigencies of the situation demanded more teachers and teaching than the ranks of priests and Levites, charged with increasing ritualistic duties, could supply. Ezra was both a priest and a copher (<a onClick="return mV(\'Ezr\',7,11);">Ezr 7:11</a>; <a onClick="return mV(\'Neh\',8,1);">Ne 8:1</a>f), concerning whom we read that he "set his heart to seek the law of Yahweh, and to do it, and to teach in Israel statutes and ordinances" (<a onClick="return mV(\'Ezr\',7,10);">Ezr 7:10</a>). Likewise the Levites often appear as teachers of the law, and we must think of the development of sopherism (scribism) as a distinct profession as proceeding very gradually. The same is true of the characteristic Jewish religious-educational institution, the synagogue, the origin and development of which fell within this same general period (compare <a href="./study/isbe/search.html?string=SYNAGOGUE">SYNAGOGUE</a>). The pupils of the copherim were the Pharisees (perushim or "separatists") who during the Maccabean period came to be distinguished from the priestly party or Sadducees.<P>6. Greek and Roman Influences:<P>The conquest of Persia by Alexander (332 BC) marks the rise of Greek influence in Palestine. Alexander himself visited Palestine and perhaps Jerusalem (Josephus, Ant, X, i, 8), befriended the Jews and granted to them the privilege of seir-government, and the maintenance of their own social and religious customs, both at home and in Alexandria, the new center of Greek learning, in the founding of which many Jews participated (see <a href="./study/isbe/search.html?string=ALEXANDRIA">ALEXANDRIA</a>). During the succeeding dynasty of the Ptolemies, Greek ideas and Greek culture penetrated to the very heart of Judaism at Jerusalem, and threatened the overthrow of Jewish social and religious institutions. The Maccabean revolt under Antiochus Epiphanes (174-164 BC) and the reestablishment of a purified temple ritual during the early part of the Maccabean period (161-63 BC) were the natural reaction against the attempt of the Seleucids forcibly to substitute the Greek gymnasium and theater for the Jewish synagogue and temple (Felten, NZ, I, 83f; compare 1Macc 1, 3, 9, 13 and 2Macc 4-10). The end of the Maccabean period found Phariseeism and strict Jewish orthodoxy in the ascendancy with such Hellenic tendencies as had found permanent lodgment in Judaism reflected in the agnosticism of the aristocratic Sadducees. The establishment of Roman authority in Palestine (63 BC) introduced a new determining element into the environmental conditions under which Judaism was to attain its final distinguishing characteristics. The genius of the Romans was practical, legalistic and institutional. As organizers and administrators they were preeminent. But their religion never inspired to any exalted view of life, and education to them meant always merely a preparation for life\'s practical duties. Hence, the influence of Roman authority upon Judaism was favorable to the development of a narrow individualistic Phariseeism, rather than to the fostering of Greek idealism and universalism. With the destruction of Jerusalem by the Romans a little more than a century later (70 AD) and the cessation of the temple worship, the Sadducees as a class disappeared from Judaism, which has ever since been represented by the Pharisees devoted to the study of the law. Outside of Jerusalem and Palestine, meanwhile, the Jewish communities at Alexandria and elsewhere were much more hospitable to Greek culture and learning, at the same time exerting a reciprocal, modifying influence upon Greek thought. It was, however, through its influence upon early Christian theology and education that the Hellenistic philosophy of the Alexandrian school left its deeper impress upon the substance and method of later Christian education.<P>IV. Education in New Testament Times.<P>Elementary schools: Jewish education in the time of Christ was of the orthodox traditional type and in the hands of scribes, Pharisees and learned rabbis. The home was still the chief institution for the dispensation of elementary instruction, although synagogues, with attached schools for the young were to be found in every important Jewish community. Public elementary schools, other than those connected with the synagogues were of slower growth and do not seem to have been common until, some time after Joshua ben Gamala, high priest from 63-65 AD, ordered that teachers be appointed in every province and city to instruct children having attained the age of 6-7 years. In the synagogue schools the chazzan, or attendant, not infrequently served as schoolmaster (compare <a href="./study/isbe/search.html?string=SCHOOL">SCHOOL</a>; <a href="./study/isbe/search.html?string=SCHOOLMASTER">SCHOOLMASTER</a>).<P>1. Subject Matter of Instruction:<P>As in earlier times the Torah, connoting now the sacred Old Testament writings as a whole, though with emphasis still upon the law, furnished the subject-matter of instruction. To this were added, in the secondary schools (colleges) of the rabbis, the illustrative and parabolical rabbinical interpretation of the law (the haggadhah) and its application to daily life in the form of concise precept or rule of conduct (the halakhah). Together the haggadhah and halakhah furnish the content of the Talmud (or Talmuds), as the voluminous collections of orthodox Jewish teachings of later centuries came to be known.<P>2. Method and Aims:<P>As regards teaching method the scribes and rabbis of New Testament times did not improve much upon the practice of the copherim and sages of earlier centuries. Memorization, the exact reproduction by the pupil of the master\'s teaching, rather than general knowledge or culture, was the main objective. Since the voice of prophecy had become silent and the canon of revealed truth was considered closed, the intellectual mastery and interpretation of this sacred revelation of the past was the only aim that education on its intellectual side could have. On its practical side it sought, as formerly, the inculcation of habits of strict ritualistic observance, obedience to the letter of the law as a condition of association and fellowship with the selected company of true Israelites to which scribes and Pharisees considered themselves to belong. The success with which the teachings of the scribes and rabbis were accompanied is an evidence of their devotion to their work, and more still of the psychological insight manifested by them in utilizing every subtle means and method for securing and holding the attention of their pupils, and making their memories the trained and obedient servants of an educational ideal. The defects in their work were largely the defects in that ideal. Their theory and philosophy of education were narrow. "Their eyes were turned too much to the past rather than the present and future." They failed to distinguish clearly the gold from the dross in their inherited teachings, or to adapt these to the vital urgent needs of the common people. In its struggle against foreign cults and foreign culture, Judaism had encased itself in a shell of stereotyped orthodoxy, the attempt to adapt which to new conditions and to a constantly changing social order resulted in an insincere and shallow casuistry of which the fantastic conglomerate mass of Talmudic wisdom of the 4th and 6th centuries is the lasting memorial.<P>3. Valuable Results of Jewish Education:<P>Nevertheless, Jewish education, though defective both in matter and in method, and tending to fetter rather than to free the mind, achieved four valuable results:<P>(1) it developed a taste for close, critical study;<P>(2) it sharpened the wits, even to the point of perversity;<P>(3) it encouraged a reverence for law and produced desirable social conduct; and<P>(4) it formed a powerful bond of union among the Jewish people. To these four points of excellence enumerated by Davidson (Historia Ecclesiastica, 80) must be added a fifth which, briefly stated, is this:<P>(5) Jewish education by its consistent teaching of lofty monotheism, and its emphasis, sometimes incidental add sometimes outstanding, upon righteousness and holiness of life as a condition of participation in a future Messianic kingdom, prepared the way for the Christian view of God and the world, set forth in its original distinctness of outline and incomparable simplicity in the teachings of Jesus.<P>4. The Preeminence of Jesus as a Teacher:<P>Jesus was more than a teacher; but He was a teacher first. To His contemporaries he appeared as a Jewish rabbi of exceptional influence and popularity. He used the teaching methods of the rabbis; gathered about Him, as did they, a group of chosen disciples (learners) whom He trained and taught more explicitly with a view to perpetuating through them His own influence and work. His followers called Him Rabbi and Master, and the scribes and Pharisees conceded His popularity and power. He taught, as did the rabbis of His time, in the temple courts, in the synagogue, in private, and on the public highway as the exigencies of the case demanded. His textbook, so far as He used any, was the same as theirs; His form of speech (parable and connected discourse), manner of life and methods of instruction were theirs. Yet into His message and method He put a new note of authority that challenged attention and inspired confidence. Breaking with the traditions of the past He substituted for devotion to the letter of the law an interest in men, with boundless sympathy for their misfortune, abiding faith in their worth and high destiny and earnest solicitude for their regeneration and perfection. To say that Jesus was the world\'s greatest and foremost example as a teacher is to state a fact borne out by every inquiry, test and comparison that modern educational science can apply to the work and influence of its great creative geniuses of the past. Where His contemporaries and even His own followers saw only "as in a glass, darkly," He saw clearly; and His view of God and the world, of human life and human destiny, has come down through the ages as a Divine revelation vouchsafed the world in Him. Viewed from the intellectual side, it was the life philosophy of Jesus that made His teachings imperishable; esthetically it was the compassionate tenderness and solicitude of His message that drew the multitudes to Him; judged from the standpoint of will, it was the example of His life, its purpose, its purity, its helpfulness, that caused men to follow Him; and tested by its immediate and lasting social influence, it was the doctrine, the ideal and example of the human brotherliness and Divine sonship, that made Jesus the pattern of the great teachers of mankind in every age and generation. With a keen, penetrating insight into the ultimate meaning of life, He reached out, as it were, over the conflicting opinions of men and the mingling social and cultural currents of His time backward to the fundamental truths uttered by the ancient prophets of His race and forward to the ultimate goal of the race. Then with simple directness of speech He addressed Himself to the consciences and wills of men, setting before them the ideal of the higher life, and with infinite patience sought to lift them to the plane of fellowship with Himself in thought and action.<P>5. Educational Work of the Early Disciples:<P>It remained for the disciples of Jesus to perpetuate His teaching ministry and to organize the new forces making for human betterment. In this work, which was distinctly religious-educational in character, some found a field of labor among their own Jewish kinsmen, and others, like Paul, among the needy Gentiles (<a onClick="return mV(\'Gal\',1,16);">Ga 1:16</a>; <a onClick="return mV(\'Gal\',2,7);">2:7</a>; <a onClick="return mV(\'1Ti\',2,7);">1Ti 2:7</a>). As regards a division of labor in the apostolic church, we read of apostles, prophets, evangelists, pastors and teachers (<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>; <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>). The apostles were the itinerant leaders and missionaries of the entire church. Their work was largely that of teaching, Paul insisting on calling himself a teacher as well as an apostle (<a onClick="return mV(\'2Ti\',1,11);">2Ti 1:11</a>; <a onClick="return mV(\'1Cr\',4,17);">1Co 4:17</a>). The prophets were men with a special message like that of Agabus (<a onClick="return mV(\'Act\',21,10,11);">Ac 21:10-11</a>). The evangelists were itinerant preachers, as was Philip (<a onClick="return mV(\'Act\',8,40);">Ac 8:40</a>), while the pastors, also called bishops, had permanent charge of individual churches. The professional teachers included both laymen and those ordained by the laying on of hands. Their work was regarded with highest honor in the church and community. In contrast with the itinerant church officers, apostles and evangelists, they, like the pastors, resided permanently in local communities. With this class the author of the Epistle of James identifies himself, and there can be little doubt that the epistle which he wrote reflects both the content and form of the instruction which these earliest Christian teachers gave to their pupils. Before the close of the 1st century the religious educational work of the church had been organized into a more systematic form, out of which there developed gradually the catechumenate of the early post-apostolic period (see <a href="./study/isbe/search.html?string=CATECHIST">CATECHIST</a>). In the Didache, or Teachings of the Apostles, there has been reserved for us a textbook of religious instruction from this earlier period (Kent, GTJC). Necessarily, the entire missionary and evangelistic work of the apostolic church was educational in character, and throughout this earliest period of church history we must think of the work of apostles, evangelists and pastors, as well as that of professional teachers, as including a certain amount of systematic religious instruction.<P>See further <a href="./study/isbe/search.html?string=SCHOOL">SCHOOL</a>; <a href="./study/isbe/search.html?string=TEACHER">TEACHER</a>; <a href="./study/isbe/search.html?string=TUTOR">TUTOR</a>.<P>LITERATURE.<P>Ames, Psychology of Religious Experience, chapter x; Box, article "Education," in Encyclopedia Biblica; Butler, The Meaning of Education; Davidson, History of Education; Dewey, article "Education," in Monroe\'s Cyclopedia of Education; Edersheim, "The Upbringing of Jewish Children," in SJSL, and Life and Times of Jesus, I, 225f; Fairweather, Background of the Gospels; Felten, "Schriftgelehrten, Synagogen u. Schulen," in Neutestamentliche Zeitgeschichte, I; Ginsburg, article "Education," in Kitto\'s Biblical Cyclopedia; Hiegemoser u. Bock, Quellenbuch u. Uberblick d. Geschichte d. Padagogik; Katzer, articles "Jesus als Lehrer" and "Judenchristenturn," in Rein\'s Encyklopadisches Handbuch d. Padagogik; Kennedy, article "Education," in HDB, I; Kohler and Gudemann, article "Education" in Jewish Encyclopedia, V; Kent, Great Teachers of Judaism and Christianity and Makers and Teachers of Judaism; Laurie, Historical Survey of Pre-Christian Education; Lewit, Darstellung d. theoretischen u. praktischen Padagogik im jud. Altertume; Oehler, article "Padagogik d. Alten Testaments," in Schmid\'s Encyclopadie d. Gesammten Erziehungs-u. Unterrichtswesen; Schurer, "Schriftgelehrsamkeit, Schule u. Synagoge," in Geschichte d. jud. Volkes (ed 1907); W. R. Smith, Religion of the Semites; Straussburger, Geschichte d. Unterrichts bei d. Israeliten; von Rohden, article "Katechetik" in Rein\'s EHP.``118';
isbe[2898]='Eduth`e\'-duth (\'edhuth, "testimony," a technical term for the Ten Commandments or for the Law):<P>In <a onClick="return mV(\'Psa\',60,1);">Ps 60 title</a>, "set to Shushan Eduth" (literally, "a lily (is) the testimony"); <a onClick="return mV(\'Psa\',80,1);">80 title</a>, "set to Shoshannim Eduth" (literally, "lilies (is) the testimony"). The Hebrew words appear to be intended to designate a melody by the first few words ordinarily associated with it.`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[2899]='Effect; Effectual`e-fekt\', e-fek\'-tu-al:<P>In the Old Testament, the Revised Version (British and American) renders "fulfilment" for "effect" in <a onClick="return mV(\'Eze\',12,23);">Eze 12:23</a> (Hebrew dabhar, "matter"); and in <a onClick="return mV(\'Jer\',48,30);">Jer 48:30</a> "His boastings have wrought nothing" for the vaguer "His lies shall not so effect" of the King James Version. In the King James Version of the New Testament, "make of none effect" occurs repeatedly: as the translation of Greek akuroo, "render void" (<a onClick="return mV(\'Mat\',15,6);">Mt 15:6</a>; <a onClick="return mV(\'Mar\',7,13);">Mr 7:13</a>); of katargeo, "annul" (<a onClick="return mV(\'Rom\',3,3);">Ro 3:3</a> (the King James Version "make without effect"); <a onClick="return mV(\'Rom\',4,14);">Ro 4:14</a>; <a onClick="return mV(\'Gal\',3,17);">Ga 3:17</a>); and of kenoo, "make empty" (<a onClick="return mV(\'1Cr\',1,17);">1Co 1:17</a>). the Revised Version (British and American) renders "make of none effect" in <a onClick="return mV(\'Rom\',3,3);">Ro 3:3</a>; <a onClick="return mV(\'Gal\',3,17);">Ga 3:17</a>; "make void" in the other cases, with no apparent reason for the lack of uniformity. Greek energeo is the opposite in meaning of katargeo above. Its derivative energes, "effective," is rendered "effectual" by English Versions of the Bible in <a onClick="return mV(\'1Cr\',16,9);">1Co 16:9</a>; <a onClick="return mV(\'Phm\',1,6);">Phm 1:6</a>. the Revised Version (British and American) dispenses with "effectual," "effectually," in the other cases where the King James Version has used these words as auxiliary in the translation of energeo or of energeia, "working" (<a onClick="return mV(\'2Cr\',1,6);">2Co 1:6</a>; <a onClick="return mV(\'Gal\',2,8);">Ga 2:8</a>; <a onClick="return mV(\'Eph\',3,7);">Eph 3:7</a>; <a onClick="return mV(\'Eph\',4,16);">4:16</a>; <a onClick="return mV(\'1Th\',2,13);">1Th 2:13</a>; <a onClick="return mV(\'Jam\',5,16);">Jas 5:16</a>).``57';
isbe[2900]='Egg`(betsah; oon; Latin ovum):<P>An oval or spheroid body produced by birds, fishes and reptiles, from which their young emerge when incubated or naturally developed. The fertile egg of a bird consists of the yolk, a small disk from which the embryo develops, the albuminous white, and a calcareous shell. The most ancient records prove that eggs have been used as an article of diet ever since the use of the flesh of fowl began. Chickens were unknown in Palestine in the days of Job, so that his query concerning the taste of the white of an egg might have referred to those of pigeons, ducks, eggs taken from the nests of geese or swans, game birds or ostriches. "Can that which hath no savor be eaten without salt? Or is there any taste in the white of an egg?" (<a onClick="return mV(\'Job\',6,6);">Job 6:6</a>, the Revised Version, margin "the juice of purslain"). In <a onClick="return mV(\'Luk\',11,12);">Lu 11:12</a> there is every possibility that the egg of our common domestic fowl is referred to as "<a href="./study/isbe/search.html?string=CHICKEN">chickens</a>" (which see) had been imported and were numerous in Palestine at that time. "Or if he shall ask an egg, will he give him a scorpion?" The reference in <a onClick="return mV(\'Isa\',59,5);">Isa 59:5</a> is to the egg of a serpent, and is figurative of the schemes of evil men: "They hatch adders\' eggs, and weave the spider\'s web: he that eateth of their eggs dieth; and that which is crushed breaketh out into a viper."``167';
