a onClick="return mV(\'Hsa\',6,\'1-\');">6:2</a>); "I will ransom them from the power of Sheol: I will redeem them from death: O death, where are thy plagues? O Sheol, where is thy destruction?" (<a onClick="return mV(\'Hsa\',13,14);">13:14</a>)—later than the time of that prophet. In them the idea of resurrection is already fully present; as truly as in the picture in <a onClick="return mV(\'Eze\',37,\'1-10\');">Eze 37:1-10</a> of the valley of dry bones. The climax is, however, reached in <a onClick="return mV(\'Isa\',25,\'6-8\');">Isa 25:6-8</a>; <a onClick="return mV(\'Hsa\',26,19);">26:19</a>, above referred to, from which the individual element cannot be excluded (compare Salmond, op. cit., 211-12: "The theme of this great passage, <a onClick="return mV(\'Hsa\',26,19);">26:19</A>, therefore, is a personal, not a corporate resurrection").<P>(5) Daniel—Resurrection of Wicked.<P>Finally, in the Old Testament we have the striking statement in <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>, "And many of them that sleep in the dust...shall awake, some to everlasting life, and some to shame and everlasting contempt. And they that are wise shall shine as the brightness of the firmament," etc. The peculiarity of this passage is, that in it, for the first time, is announced a resurrection of the wicked as well as of the righteous (compare in the New Testament <a onClick="return mV(\'Jhn\',5,28,29);">Joh 5:28-29</a>; <a onClick="return mV(\'Act\',24,15);">Ac 24:15</a>; <a onClick="return mV(\'Rev\',20,12);">Re 20:12</a>ff). The word "many" is not to be understood in contrast with "all," though probably only Israel is in view. The event is connected with a "time of trouble" (<a onClick="return mV(\'Dan\',12,1);">Da 12:1</a>) following upon the overthrow of Antiochus, here representative of Antichrist. The really difficult problem is, How did this conception of the resurrection of the wicked come about? The resurrection of the righteous, it has been seen, is a corollary from the covenant-faithfulness of Yahweh. But this does not apply to the wicked. Whence then does the idea come? It is given as a revelation, but even revelation connects itself with existing ideas and experiences. The resurrection of the wicked, certainly, does not arise, like that of the righteous, from the consciousness of an indissoluble union with God, but it may well arise from the opposite conviction of the judgment of God. As the sense of individuality grew strong—and it is granted that the teaching of the prophets did much to strengthen that feeling—and the certainty of moral retribution developed, it was inevitable that this should react on the conception of the future, in making it as certain that the wicked should be punished, as that the good should be rewarded, in the world to come. Naturally too, as the counterpart of the other belief, this shaped itself into the form of a resurrection to judgment. We are thus brought, as a last step, to consider the idea of judgment and its effects as found in the prophetic teaching.<P>IV. The Idea of Judgment—the Day of Yahweh.<P>Judgment a Present Reality:<P>It was seen that, under Mosaism, the promises and threatenings of God were mainly confined to the present life, and that the sense of distinctions in Sheol, though not absent, was vague and wavering. Through temporal dispensations men were trained to faith in the reality of moral retribution. Under the prophets, while the judgments of God on nations and individuals were still primarily viewed as pertaining to this life, there gradually shaped itself a further idea—that of an approaching consummation of history, or Day of Yahweh, when God\'s enemies would be completely overthrown, His righteousness fully vindicated and His kingdom established in triumph throughout the earth. The developments of this idea may now briefly be exhibited. In this relation, it need only be stated that the writer does not follow the extraordinary mangling of the prophetic texts by certain critics, accepted, though with some misgiving, by Dr. Charles.<P>1. Day of Yahweh:<P>The "Day of Yahweh," in the prophetic writings, is conceived of, sometimes more generally, as denoting any great manifestation of God\'s power in judgment or salvation (e.g. the locusts in <a onClick="return mV(\'Joe\',2,\'1-\');">Joe 2</a>), sometimes more eschatologically, of the final crisis in the history of God\'s kingdom, involving the overthrow of all opposition, and the complete triumph of righteousness (e.g. <a onClick="return mV(\'Isa\',2,\'2-5\');">Isa 2:2-5</a>; <a onClick="return mV(\'Joe\',3,\'1-\');">Joe 3</a>; <a onClick="return mV(\'Amo\',9,11);">Am 9:11</a>ff; <a onClick="return mV(\'Zec\',14,\'1-\');">Zec 14</a>, etc.). The two things are not unconnected; the one is the prelude, or anticipatory stage, of the other. That feature of prophetic vision sometimes spoken of as the absence of perspective is very conspicuous in the fact that chronology is largely disregarded, and the "Day of Yahweh" is seen looming up as the immediate background of every great crisis in which the nation may for the time be involved (Assyrian invasions; Babylonian captivity; Maccabean persecution). The one thing ever certain to the prophet\'s mind is that the "Day" is surely coming—it is the one great, dread, yet for God\'s people joyful, event of the future—but the steps by which the goal is to be reached are only gradually revealed in the actual march of God\'s providence.<P>(1) Relation to Israel.<P>The "Day" is in its primary aspect a day of judgment (<a onClick="return mV(\'Isa\',2,12);">Isa 2:12</a>); not, however, to be thought of as a day of vengeance only on the adversaries of Israel (<a onClick="return mV(\'Amo\',5,18);">Am 5:18</a>ff). Israel itself would be the first to experience the strokes of the Divine chastisement: "You only have I known of all the families of the earth: therefore I will visit upon you all your iniquities" (<a onClick="return mV(\'Amo\',3,2);">Am 3:2</a>). God\'s judgments on Israel, while retributive, were also purifying and sifting; a "remnant" would remain, who would be the seed of a holier community (<a onClick="return mV(\'Isa\',6,13);">Isa 6:13</a>; <a onClick="return mV(\'Amo\',9,9);">Am 9:9</a>; <a onClick="return mV(\'Zep\',3,13,20);">Ze 3:13, 20</a>, etc.). The Book of Hosea beautifully exhibits this aspect of the Divine dealings.<P>(2) To the Nations.<P>Of wider scope is the relation of the "Day" to the Gentile world. The nations are used as the instruments of God\'s judgments on Israel (Assyrians, Chaldeans, Persians), but they, too, would in turn be judged by Yahweh (compare the prophecies against the nations in Isaiah, Jeremiah, Ezekiel, Nahum, Habakkuk, etc.). The end would be, although this does not fully appear in every prophet, that a remnant of the heathen also would turn to Yahweh, and be rescued from the judgment (<a onClick="return mV(\'Zec\',14,16);">Zec 14:16</a>). More generally, an extension of the kingdom of God would take place till the earth was filled with God\'s glory (e.g. <a onClick="return mV(\'Isa\',2,\'2-5\');">Isa 2:2-5</a>, with <a onClick="return mV(\'Mic\',4,\'1-5\');">Mic 4:1-5</a>; <a onClick="return mV(\'Isa\',42,4);">Isa 42:4</a>; <a onClick="return mV(\'Isa\',66,\'3-6\');">66:3-6</a>; <a onClick="return mV(\'Jer\',12,\'14-16\');">Jer 12:14-16</a>; <a onClick="return mV(\'Jer\',16,\'19-21\');">16:19-21</a>; <a onClick="return mV(\'Eze\',16,53,55,61);">Eze 16:53, 55, 61</a>, God will turn the captivity of Sodom and her daughters; <a onClick="return mV(\'Amo\',9,11);">Am 9:11</a>; <a onClick="return mV(\'Hab\',2,14);">Hab 2:14</a>; compare <a onClick="return mV(\'Psa\',22,\'27-31\');">Ps 22:27-31</a>; <a onClick="return mV(\'Psa\',65,2,5);">65:2, 5</a>; <a onClick="return mV(\'Psa\',86,9);">86:9</a>). These events, in prophetic speech, belong to "the latter days" (<a onClick="return mV(\'Isa\',2,2);">Isa 2:2</a>; <a onClick="return mV(\'Jer\',48,47);">Jer 48:47</a>; <a onClick="return mV(\'Eze\',38,16);">Eze 38:16</a>; <a onClick="return mV(\'Hsa\',3,5);">Ho 3:5</a>; <a onClick="return mV(\'Mic\',4,1);">Mic 4:1</a>). In Daniel\'s great prophecy of the four kingdoms, these are represented as broken in pieces by the kingdom of heaven, symbolized by a stone cut out of the mountain without hands (<a onClick="return mV(\'Dan\',2,44,45);">Da 2:44-45</a>; compare <a onClick="return mV(\'Dan\',7,27);">Dan 7:27</a>). The kingdom is given by the Ancient of Days to one "like unto a son of man" (<a onClick="return mV(\'Dan\',7,13);">Da 7:13</a>). Haggai and Zechariah, the post-exilian prophets, share in these glowing hopes (<a onClick="return mV(\'Hag\',2,6,7);">Hag 2:6-7</a>; <a onClick="return mV(\'Zec\',2,10);">Zec 2:10</a>; <a onClick="return mV(\'Zec\',8,\'20-23\');">8:20-23</a>; <a onClick="return mV(\'Zec\',14,16);">14:16</a>). In Malachi is found one of the noblest of all the prophetic utterances: "From the rising of the sun even unto the going down of the same my name shall be great among the Gentiles," etc. (<a onClick="return mV(\'Mal\',1,11);">1:11</a>); and prophecy closes with the announcement of Him, Yahweh\'s messenger, by whom this "great and terrible day of Yahweh" is to be brought in (<a onClick="return mV(\'Mal\',4,\'1-\');">Mal 4</a>).<P>2. Judgment beyond Death:<P>The purview, in what is said of the "Day of Yahweh," is thus seen to be confined to earth, though the references to resurrection, and the passages in the close of Isaiah (<a onClick="return mV(\'Isa\',65,17);">65:17</a>; <a onClick="return mV(\'Isa\',66,22);">66:22</a>) about "new heavens and a new earth" imply a further vista. The hope of immortality—of resurrection life—in the case of the righteous has already been considered. But what of judgment after death in the case of the wicked? Only dim premonitions of retribution, it was seen, are found in the earlier doctrine of Sheol. There are frequent references to "judgment" in the Psalms, sometimes on the world (e.g. <a onClick="return mV(\'Psa\',93,13);">96:13</a>; <a onClick="return mV(\'Psa\',98,9);">98:9</A>; compare <a onClick="return mV(\'Isa\',50,\'1-\');">50</a>), sometimes on individuals (e.g. <a onClick="return mV(\'Psa\',1,5);">1:5</a>), but it is doubtful if any of them look beyond earth. Yet many things combined to force this problem on the attention.<P>(1) Incompleteness of Moral Administration.<P>There was the sharpening of the sense of individual responsibility in the prophetic age (<a onClick="return mV(\'Jer\',31,29-30);">Jer 31:29-30</a>; <a onClick="return mV(\'Eze\',18,2);">Eze 18:2</a>ff), and the obvious fact of the incompleteness of the Divine moral administration in the present life, as respects the individual. The working of moral laws could be discerned, but this fell far short of exact individual retribution. Life was full of moral anomalies and perplexities (compare <a href="./study/isbe/search.html?string=JOB,+BOOK+OF">JOB, BOOK OF</a>).<P>(2) Prosperity of Wicked.<P>There was the special difficulty that the wicked did not always seem to meet with the punishment due to their misdeeds in time. On the contrary they often seemed to flourish, to have success in their schemes, to triumph over the godly, who were afflicted and oppressed. This was the enigma that so painfully exercised the minds of the psalmists (<a onClick="return mV(\'Psa\',10,\'1-\');">Pss 10</a>; <a onClick="return mV(\'Psa\',17,\'1-\');">17</a>; <a onClick="return mV(\'Psa\',37,\'1-\');">37</a>; <a onClick="return mV(\'Psa\',49,\'1-\');">49</a>; <a onClick="return mV(\'Psa\',73,\'1-\');">73</a>, etc.). The solution they found was that the prosperity of the wicked did not endure. It came to a sudden end (<a onClick="return mV(\'Psa\',37,35,36);">Ps 37:35-36</a>; <a onClick="return mV(\'Psa\',73,\'18-20\');">73:18-20</a>), while the righteous had a sure compensation in the future (<a onClick="return mV(\'Psa\',17,15);">Ps 17:15</a>; <a onClick="return mV(\'Psa\',49,15);">49:15</a>; <a onClick="return mV(\'Psa\',73,24);">73:24</a>, etc.). It was not, however, always the case that the wicked were thus visibly cut off. Besides, a sudden end hardly seemed an adequate punishment for a long career of triumphant iniquity, and, if the righteous were recompensed hereafter, the thought lay near that the wicked might be, and should be, also.<P>(3) Suffering of Righteous with Wicked.<P>There was the kindred fact that, in the calamities that overtook the wicked, the righteous were often the involuntary sharers. The wicked did not suffer by themselves; the godly were involved in the storm of judgment (war, captivity, plagues) that broke upon them. Here was something else calling for redress at the hands of a God of righteousness.<P>3. Retribution beyond Death:<P>From these causes the thought almost necessarily presented itself of the extension of retribution for the wicked into the state beyond death. Hence, as before seen, Sheol did come in the later age to assume something of a penal character for the unrighteous. There was a wrath of God that burned to the lowest Sheol (<a onClick="return mV(\'Deu\',32,22);">De 32:22</a>; compare Charles, op. cit., 74). But this abode of the shades was not, for the evil any more than for the good, a fitting sphere for moral recompense. If, for the complete reward of the righteous, a resurrection-state was necessary, did not the same hold true for the wicked? It is questioned whether the very definite announcements of an individual judgment in <a onClick="return mV(\'Ecc\',11,9);">Ec 11:9</a>; <a onClick="return mV(\'Ecc\',12,14);">12:14</a> refer to the state beyond death—it is probable that they do (compare Salmond, op. cit., 216-17). The first clear intimation of a resurrection of the wicked, however, is found, as already said, in <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>, which likewise implies judgment. Perhaps a hint of the same idea is given in <a onClick="return mV(\'Isa\',66,24);">Isa 66:24</a>: "They shall go forth (the prophet is speaking of the times of the new heavens and the new earth, verse <a onClick="return mV(\'Isa\',66,22);">22</a>), and look upon the dead bodies of the men that have transgressed against me: for their worm shall not die, neither shall their fire be quenched; and they shall be an abhorring unto all flesh." Dr. Charles connects this with the idea of Gehenna as "a place of punishment for rebellious and apostate Jews," which he thinks also to be implied in <a onClick="return mV(\'Isa\',50,11);">Isa 50:11</a> (op. cit., 158). It is the same word "abhorrence" (dera\'on), found in the above passage, which is rendered in <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a> "contempt," and the punishment "is conceived of as eternal" (pp. 158-59).<P>It is hardly possible to carry the subject farther within the limits of the Old Testament. Further developments belong to the later Judaism.<P>V. Later Jewish Conceptions—Apocryphal, Apocalyptic, Rabbinical.<P>1. Sources:<P>The sources of our knowledge of the eschatological conceptions among the Jews in the immediately pre-Christian period are:<P>(1) Apocrypha.<P>The books of the Old Testament Apocrypha (see <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>), taken over, with the exception of 2Esdras, from the Septuagint. 2Esdras, better known as 4Esdras, is more properly classed with the apocalyptic writings. The original work consists only of chapters 3-14, with a passage in chapter 7 not found in the ordinary version. The book is post-Christian (circa 80-96 AD).<P>(2) <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">Apocalyptic Literature</a>.<P>(See article under that head, II, i, 1; II, ii.) The remains of this literature consist of the Sibylline Oracles (oldest parts, Book III, from 2nd century BC), the Book Enoch (see below), the Psalms of Solomon (70-40 BC), with the Apocrypha Baruch (50-100 AD), the Book of Jubilees, and Testament of the Twelve Patriarchs (see below), the Assumption of Moses (early 1st century AD), and the Ascension of Isaiah (before 50 AD). A good deal turns on the dating of some of these books. Several (Apocrypha Baruch, Assumption of Moses, Ascension of Isaiah, with 4Esdras) are post-Christian. The Book of Jubilees and Testament of the Twelve Patriarchs have also usually been regarded as such, but Dr. Charles argues for dates going back to the close of the 2nd century BC for both. Late Jewish and Christian additions are recognized in the latter. Formerly Dr. Charles dated Jubilees "before 10 AD." The chief dispute relates to (the "Similitudes") of the Book of Enoch chapters 37-70. These important sections are held by some (Dr. Stanton, etc.) to be post-Christian (end of 1st century AD)--a view to which we incline; Dr. Charles and others place them in the 1st century BC. Most of the remaining portions of the book are assigned to dates in the 2nd century BC. To the above should be added the notices of Jewish opinions in Josephus<P>(3) Rabbinical Writings.<P>For rabbinical ideas, we are chiefly dependent on the Talmudic writings and the Targums—sources whose late character makes their witness often doubtful (see <a href="./study/isbe/search.html?string=TALMUD">TALMUD</a>; <a href="./study/isbe/search.html?string=TARGUM">TARGUM</a>).<P>2. Description of Views:<P>It is only possible to summarize very briefly the varying and frequently conflicting conceptions on eschatological subjects to be gleaned from this extensive literature. The representations are often wildly imaginative, and, so far as they are not genuine developments from Old Testament ideas, have value only as they may be supposed to throw light on the teachings of the New Testament. With one or two exceptions, little is to be gathered from the apocryphal books, and it will be best to treat the subject under headings.<P>(1) Less Definite Conceptions.<P>In the apocryphal Ecclesiasticus (Wisdom of the Son of Sirach) we remain still on the old ground of Sheol as a place in which there is no remembrance, thanksgiving or retribution (Sirach 17:27,28; 41:3,1, etc.; a somewhat different note is heard in 21:10). It is the same in Baruch (2:17) and Tobit (3:6). In 1Macc we have simply the Old Testament phrases, "gathered to his fathers" (2:69), "gathered to his people" (14:30). In the Book of Wisdom, the influence of Greek ideas is seen in a doctrine of the immortality of the soul only (2:23; 3:1-4; 4:13,14; 15:3; not a resurrection), possibly of pre-existence (8:20). The wicked suffer punishment in Sheol (3:1-10; 5:1-14, etc.).<P>(2) Ideas of Sheol.<P>Generally, however, in the apocalyptic books, a marked change is seen in the ideas of Sheol. It is still the place of the dead, but is regarded more as a state intermediate between death and the resurrection for such as shall be raised; in which righteous and wicked are separated; in which the wicked suffer punishment. The Book of Enoch distinguishes four abodes for the departed—two for the righteous, and two for the wicked (21:1-13). One class of the wicked (those already punished in this life) remain there forever, while the others are raised, and pass to the torment of Gehenna (17:2). The righteous are in Paradise—"the garden of life" (61:12), "the garden of righteousness" (67:3). This character of Sheol as a place of punishment (intermediate or final) is met with frequently (Book of Jubilees 7:29; 22:22; 2Macc 6:23; Psalter of Solomon 14:6; 15:11; 16:2, etc.). In certain places, Dr. Charles says, "Sheol has become an abode of fire, and therefore synonymous so far with Gehenna....In several passages in the Similitudes, and throughout Enoch 91-104, Sheol and Gehenna are practically identical" (op. cit., 237). Similar ideas are found in the Slavonic version of Enoch (ibid., 261ff).<P>(3) The Fallen Angels.<P>Much prominence in the Book of Enoch is given to the fallen angels (those who sinned with women, <a onClick="return mV(\'Gen\',6,2);">Ge 6:2</a>). They are consigned in the judgment to ever-burning fire (En 21:1-6; 90:20-25).<P>(4) Resurrection.<P>Ideas of the resurrection vary, In Enoch 22, the righteous and one class of the wicked are raised; elsewhere all the righteous are raised and none of the wicked (En 61:5; 90:33; Psalter of Solomon 3:16); sometimes there is to be a resurrection of all, just and unjust (En 51:1,2). 2Macc dwells much on the resurrection, which seems to embrace all Israel (3:16; 13:9; 7:9,14,23, etc.). For the Gentiles there is no resurrection (7:14,36). In Enoch 90:38, the bodies of the righteous are described as "transformed" in the resurrection (compare in the "Similitudes," 39:7; 51:4; 62:15). The doctrine of the resurrection (universal) is taught in the Apocrypha Baruch 30:2-5; 50; 51, and in 4Esdras 7:32-37. In Josephus the Pharisees are said to have believed in the resurrection of the righteous only (Ant., XVIII, i, 3). This does not coincide with Paul\'s statement in <a onClick="return mV(\'Act\',24,15);">Ac 24:15</a>.<P>(5) Judgment.<P>The reality of a final judgment, supervening upon the intermediate judgment in Sheol, is strongly affirmed in most of the apocalyptic books. The Book of Enoch speaks much of this final judgment. It describes it as "the great day," "the righteous judgment," "the great day of judgment" "the last judgment," "the judgment of all eternity" (10:6,12; 16:1; 19:1; 22:4,11; 25:4; 90:26,27, etc.). Wicked angels and men are judged, and sentenced to Gehenna—a doom without end.<P>The Messiah:<P>An interesting point is the relation of the Messiah to this judgment. With the exception of 4Esd, the apocryphal books are silent on the Messiah. In the apocalyptic books the Messiah does appear, but not always in the same light. In the Sibylline Oracles (3), Psalms of Solomon (17; 18), Apocrypha Baruch (39; 40) and in 4Esdras (13:32ff) the appearance of Messiah is associated with the overthrow and judgment of the ungodly worldly powers; in the older portions of Enoch (90:16-25) God Himself executes this judgment, and holds the great assize—the Messiah does not appear till after. In the section of Enoch, chapters 37-70, on the other hand, the Messiah appears definitely as the judge of the world, and titles resembling those in the New Testament, "the Righteous One" (38:2; 53:6), "the Elect One" (40:5; 45:3,4, etc.), above all, "the Son of Man" (46:2-4; 48:2, etc.), are given Him. It is these passages which suggest Christian influence, especially as the conception is not found elsewhere in pre-Christian Apocalypse, and the Book of Jubilees, which refers otherwise to Enoch, makes no mention of these passages. Yet another idea appears in later Apocalypse, that, namely, of a limited reign of Messiah, after which take place the resurrection and judgment. 4Esdras has the extraordinary notion that, after a reign of 400 years, the Messiah dies (7:28,29). God in this case is the judge.<P>(6) The Messianic Age and the Gentiles.<P>The Messianic age, when conceived of as following the judgment (the older view), is unlimited in duration, has Jerusalem for its center, and includes in the scope of its blessing the converted Gentiles (Sibylline Oracles 3:698-726; Enoch 90:30,37; compare 48:5; 53:1; Psalms of Solomon 17:32-35). The righteous dead of Israel are raised to participate in the kingdom. Already in Enoch 90:28,29 is found the idea that the new Jerusalem is not the earthly city, but a city that comes down from heaven, where, as in 4Esdras, the Messianic reign is limited, the blessed life after resurrection is transferred to heaven.<P>(7) Rabbinical Ideas.<P>Little is to be added from the rabbinical conceptions, which, besides being difficult to ascertain precisely, are exceedingly confused and contradictory. Most of the ideas above mentioned appear in rabbinical teaching. With the destruction of the hostile world-powers is connected in later rabbinism the appearance of "Armilus"—an Antichrist. The reign of Messiah is generally viewed as limited in duration—400 years (as in 4Esdras), and 1,000 years being mentioned (compare Schurer, History of Jewish People in the Time of Jesus Christ, Div. II, Vol. II,179,English translation). At its close takes place a renovation of the world, resurrection (for Israelites only, certain classes being excluded), judgment, and eternal heavenly happiness for the righteous. The punishments of the wicked appear mostly to be regarded as eternal, but the view is also met with of a limited duration of punishment (see authorities in Schurer, op. cit., 183; Edersheim, Jesus the Messiah, appendix. XIX, and other works noted in "Literature" below).<P>LITERATURE.<P>R. H. Charles, D. D., A Crit. History of the Doctrine of a Future Life (1899); apocalyptic works translated and edited by same writer (Book of Enoch, Apocrypha Baruch, Book of Jubilees, Testament of the 12 Patriarchs, etc.); V. H. Stanton, The Jewish and the Christian Messiah (1886); S. D. F. Salmond, Christian Doct of Immortality (4th edition, 1901); A. Edersheim, Life and Times of Jesus the Messiah, edition 1906 (especially appendix. XIX); E. Schurer, History of the Jewish People in the Time of Jesus Christ (Div. II, Vol. II, English translation). Old Testament Theologies: Oehler, A. B. Davidson, etc.; articles in Dictionaries: Hastings, Encyclopedia Biblica, etc. For fuller lists, see Charles.``132';
isbe[3183]='Eschew`es-choo\' (cur; ekklino):<P>Only 4 times in the King James Version (<a onClick="return mV(\'Job\',1,1,8);">Job 1:1, 8</a>; <a onClick="return mV(\'Job\',2,3);">2:3</a>; <a onClick="return mV(\'1Pe\',3,11);">1Pe 3:11</a>), in all of which the American Standard Revised Version renders by the appropriate form of "turn away from."``1';
isbe[3184]='Esdraelon, Plain of`es-dra-e\'-lon, (yizre\'e\'l; in Apocrypha the name varies: Esdrelon, Esdraelon, Esdrelom, Esrelon, Esrechon):<P>1. The Name:<P>The Greek name of the great plain in Central Palestine (Judith 3:9; 7:3, etc.). It is known in Scripture by the Hebrew name "valley of Jezreel" (<a onClick="return mV(\'Jos\',17,16);">Jos 17:16</a>; <a onClick="return mV(\'Jdg\',6,33);">Jud 6:33</a>, etc.). It is called \'emeq in <a onClick="return mV(\'Jdg\',5,15);">Jud 5:15</a>, which properly denotes "a depression," or "deepening," and is used more commonly of the vale running eastward between Gilboa and Little Hermon. Biq\'ah is the term usually employed (<a onClick="return mV(\'2Ch\',35,22);">2Ch 35:22</a>, etc.), which accurately describes it, "an opening," a level space surrounded by hills. The modern name is Merj ibn \'Amr, "meadow of the son of Amr."<P>2. Position and Description:<P>It lies between Gilboa and Little Hermon on the east, and Mt. Carmel on the west. It is enclosed by irregular lines drawn from the latter along the base of the foothills of Nazareth to Tabor; from Tabor, skirting Little Hermon and Gilboa to Jenin, and from Jenin along the north edge of the Samaritan uplands to Carmel. These sides of the triangle are, respectively, about 15, 15 and 20 miles in length. North of Jenin a bay of the plain sweeps eastward, hugging the foot of Mt. Gilboa. An offshoot passes down to the Jordan valley between Gilboa and Little Hermon; and another cuts off the latter hill from Tabor. The average elevation of the plain is 200 ft. above the level of the Mediterranean. The Vale of Jezreel between Zer\'in and Beisan, a distance of about 12 miles, descends nearly 600 ft., and then sinks suddenly to the level of the Jordan valley. The chief springs supplying water for the plain are those at Jenin and at Megiddo. The former are the most copious, and are used to create a "paradise" on the edge of the plain. Those at Megiddo drive mills and serve for irrigation, besides forming extensive marshes. The springs near Zer\'in, three in number, \'Ain Jalud, possibly identical with the well of Harod, being the most copious, send their waters down the vale to the Jordan. The streams from the surrounding heights are gathered in the bed of the Kishon, a great trench which zigzags through the plain, carrying the water through the gorge at Carmel to the sea. For the most of its course this sluggish stream is too low to be available for irrigation. The deep, rich soil, however, retains the moisture from the winter rains until far on in the year, the surface only, where uncovered by crops, being baked to brick in the sun. When winter sets in it quickly absorbs the rain, great breadths being turned to soft mud. This probably happened in the battle with Sisera: the northern cavalry, floundering in the morass, would be an easy prey to the active, lightly armed foot-soldiers. The fertility of the plain is extraordinary: hardly anywhere can the toil of the husbandman find a greater reward. The present writer has ridden through crops of grain there, when from his seat on the saddle he could no more than see over the tops of the stalks. Trees do not flourish in the plain itself, but on its borders, eg. at Jenin, the palm, the olive and other fruit trees prosper. The oak covers the slopes of the hills north of Carmel.<P>3. Part Played in History:<P>This wide opening among the mountains played a great part in the history of the land. This was due to the important avenues of communication between north and south that lay across its ample breadths. The narrow pass between the promontory of Carmel and the sea was not suitable for the transport of great armies: the safer roads over the plain were usually followed. So it happened that here opposing hosts often met in deadly strife. Hardly an equal area of earth can so often have been drenched with the blood of men. No doubt many conflicts were waged here in far-off times of which no record remains. The first battle fought in the plain known to history was that in which Sisera\'s host was overthrown (<a onClick="return mV(\'Jdg\',5,20);">Jud 5:20</a>). The children of the East were surprised and routed by Gideon\'s 300 chosen men in the stretches north of Zer\'in (<a onClick="return mV(\'Jdg\',7,\'1-\');">Jud 7</a>). Near the same place the great battle with the Philistines was fought in which Saul and his sons, worsted in the plain, retired to perish on the heights of Gilboa (<a onClick="return mV(\'1Sa\',31,\'1-\');">1Sa 31</a>). In the bed of the Kishon at the foot of Carmel Elijah slaughtered the servants of Baal (<a onClick="return mV(\'1Ki\',18,40);">1Ki 18:40</a>). Dark memories of the destruction of Ahab\'s house by the furiously driving Jehu linger round Jezreel. Ahaziah, fleeing from the avenger across the plain, was overtaken and cut down at Megiddo (<a onClick="return mV(\'2Ki\',9,\'1-\');">2Ki 9</a>). In the vale by Megiddo Josiah sought to stay the northward march of Pharaoh-necoh, and himself fell wounded to death (<a onClick="return mV(\'2Ki\',23,30);">2Ki 23:30</a>; <a onClick="return mV(\'2Ch\',35,20);">2Ch 35:20</a>ff). The army of Holofernes is represented as spreading out over all the southern reaches of the plain (Judith 7:18,19). Much of the fighting during the wars of the Jews transpired within the circle of these hills. It is not unnatural that the inspired seer should place the scene of war in "the great day of God" in the region so often colored crimson in the history of his people—the place called in the Hebrew tongue "Har-Magedon" (<a onClick="return mV(\'Rev\',16,14,16);">Re 16:14, 16</a>).<P>Esdraelon lay within the lot of Issachar (<a onClick="return mV(\'Jos\',19,17);">Jos 19:17</a>). The Canaanite inhabitants were formidable with their chariots of iron (<a onClick="return mV(\'Jos\',17,16,18);">Jos 17:16, 18</a>). The tribe does not appear to have prosecuted the conquest with vigor. Issachar seems to have resumed the tent life (<a onClick="return mV(\'Deu\',33,18);">De 33:18</a>), and ignobly to have secured enjoyment of the good things in the land by stooping to "taskwork" (<a onClick="return mV(\'Gen\',49,14);">Ge 49:14</a>f).<P>4. Arab Raids:<P>Through many centuries the plain was subject to raids by the Arabs from the east of the Jordan. The approach was open and easy, and the rich breadths of pasture irresistibly attracted these great flock masters. The Romans introduced some order and security; but with the passing of the eastern empire the old conditions resumed sway, and until comparatively recent times the alarm of an Arab invasion was by no means infrequent.<P>The railway connecting Haifa with Damascus and Mecca crosses the plain, and enters the Jordan valley near Beisan.``54';
isbe[3185]='Esdras 5 And 6`(or 4 Ezr):<P>These names have been applied respectively to the first two and the last two chapters of 2 (4) Esdras in the Latin Bible of 1462. In matter these chapters, which are of Christian origin, agree in the main with the genuine parts of 2 (4) Esdras. See foregoing article [<a href="./study/isbe/search.html?string=ESDRAS,+FOURTH+BOOK+OF">Esdras, Fourth Book of</A>].``1';
isbe[3186]='Esdras, Fourth Book of``<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`1';

isbe[3188]='Esdras, the First Book of`ez\'-dras, es\'-dras:<P>Contents<P>1. Name<P>2. Contents<P>3. Relation to Chronicles, Ezra, Nehemiah<P>4. Versions<P>5. Date and Authorship<P>LITERATURE<hr /><P>1. Name:<P>In some of the Greek uncials (Codex Vaticanus, etc.) of the Septuagint the book is called Esdras, Codex Alexandrinus (or Proton); so in the editions of Fritzsche, Tischendorf, Nestle and Swete. It is absent from Codex Sinaiticus and in Codex Alexandrinus its name is Ho Hiereus = The Priest, i.e. Ezra, who is emphatically the priest. It is also called 1Esdras in the old Latin and Syriac VSS, as well as in the English, Welsh and other modern translations. In the English and other Protestant Bibles which generally print the Apocrypha apart, this book stands first in the Apocrypha under the influence partly of its name, and in part on account of its contents, as it seemed a suitable link between the canonical and the apocryphal writings. The English 2Esdras is the apocalyptic Esdras and stands immediately after the English and Greek 1Esdras. The Vulgate, following Jerome\'s version, gave the names 1, 2 and 3 Esdras to our Ezra, Nehemiah, and 1Esdras, respectively, and in editions of the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) down to that of Pope Sixtus (died 1590) these three books appear in that order. The name 3Esdras is, therefore, that current in the Roman church, and it has the sanction of the 6th article of the Anglican Creed and of Miles Coverdale who in his translation follows the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) in naming the canonical Ezra, Nehemiah and the apocryphal 1Esdras,1, 2 and 3 Esdras, respectively. Other reformers adhered to these titles. In Fritzsche\'s commentary on the Apocrypha 3Esdras is preferred and he treats this book first. In Kautzsch\'s German edition of the Apocrypha and in most recent German works the Latin designation 3 is revived. The English commentators Bissell (Lange) and Wace (Speaker\'s Commentary) follow the custom of the Bible and speak of 1Esdras, placing the book first in the collection, and this is the prevailing custom among English Protestant theologians. The name 2Esdras has also been given to this book, the canonical Ezra and Nehemiah being then counted as one—1Esdras. See Origen quoted by HE, V, 25; Zunz, Der Gottesdienst, Vortrage Berlin,1832,15.<P>2. Contents:<P>With the exception of 1Esdras 3:1-5:6—the incident of the royal banquet and the contest for a prize of the three young men—the present books agree in everything essential, down to the minutest details, with the canonical Ezra and part of 2 Chronicles and Nehemiah. Before discussing the relation between 1Esdras and the Biblical books named (see next section), it will be advantageous to give an outline of the book now specially under consideration, with reference to the parallel passages in the corresponding parts of the Canon. It will be seen that practically the whole of Ezra is concerned, and for explanations of the parts common to this book and to Nehemiah reference may be made to the Century Bible Commentary on Ezra, Nehemiah, and Esther.<P>1. 1Esdras 1 = <a onClick="return mV(\'2Ch\',35,\'1-\');">2Ch 35:1</a> - <a onClick="return mV(\'2Ch\',36,\'1-21\');">36:21</a> and maybe analyzed thus: 1Esdras 1:1-20 = <a onClick="return mV(\'2Ch\',35,\'1-19\');">2Ch 35:1-19</a>: Josiah\'s great Passover. 1Esdras 1:21f has no exact parallel. 1Esdras 1:23-31 = <a onClick="return mV(\'2Ch\',35,\'20-27\');">2Ch 35:20-27</a>: The death of Josiah. This took place on the battlefield at Megiddo according to <a onClick="return mV(\'2Ki\',23,29);">2Ki 23:29</a>, but 1Esdras 1:31 and <a onClick="return mV(\'2Ch\',35,24);">2Ch 35:24</a> say he died at Jerusalem. 1Esdras 1:32-58 = <a onClick="return mV(\'2Ch\',36,\'1-21\');">2Ch 36:1-21</a>, closing years of the monarchy followed by the exile in Babylon.<P>2. 1Esdras 2:1-15 = <a onClick="return mV(\'Ezr\',1,\'1-11\');">Ezr 1:1-11</a>: The return from Babylon through the edict of Cyrus.<P>3. 1Esdras 2:16-26 = <a onClick="return mV(\'Ezr\',4,\'7-24\');">Ezr 4:7-24</a>. Certain Persian officials in Samaria induced King Artaxerxes I (died 424 BC) to stop the work of rebuilding the temple, which is not resumed until the second year of the reign of Darius Hystaspis (519 BC).<P>4. 1Esdras 3:1-5:6 has no parallel in any part of the Old Testament. King Darius (Hystaspis?) makes a great feast, after which he returns to his bedchamber but finds sleeping very difficult. Three young men belonging to his bodyguard resolve each to make a sentence to be written down and placed under the king\'s pillow, so that upon rising from his bed he might hear the three sayings read to him. The question which each one seeks to answer is, What in this world is strongest? The first says it is "wine," the second, that it is "the king." The reply of the third is "woman, though strongest of all is truth" (from this arose the Latin saying Magna est veritas et praevalebit). The third is declared the best, and as a reward the king offers him whatever he might wish. This young man happened to be Zerubbabel (Zorobabel), and the request that he makes is that King Darius might perform the vow which he made on coming to the throne to rebuild Jerusalem and its temple and to restore the sacred vessels removed to Babylon. This request is at once granted, and there follows an account of the home-coming of Jews exiled in Babylon and the protection accorded them by the Persian government similar to what we read of in 1Esdras 1 as taking place in the reign of Cyrus. But many things in this narrative are striking and indeed odd. Zerubbabel is called a young man. Among those mentioned in 1Esdras 5:5 Zerubbabel is not named, though his son Joakim is. In the very next verse (5:6) this Joakim is identified with the young man (Zerubbabel) who won the king\'s prize for writing the wisest sentence, though the sense is not quite clear; perhaps Zerubbabel is meant in 1Esdras 5:6. Fritzsche argues that Joakim can alone be meant. This whole episode stands in no organic connection with the rest of 1Esdras, and if it is omitted the narrative is continuous. Besides this the account given of the return from Babylon contradicts what is said in 1Esdras 1 and the corresponding part of Ezr. We must regard 1Esdras 3:1-5:6 as a Jewish haggadah which at an early time was written in the margin as supplying illustrative matter and then got incorporated into the text. Nevertheless, from a literary point of view this part of the book is the gem of the whole.<P>5. 1Esdras 5:7-73 = <span class="noTag">Ezr 2 - 4:1-5</a>: The names of those who returned with number of animals (horses, etc.) (1Esdras 5:7-43); altar of burnt offering erected (1Esdras 5:48); sacrifices offered on it (1Esdras 5:50). Foundation of the temple laid (1Esdras 5:56f). The Jews refuse the offer of the Samaritan party to help in the rebuilding of the temple, with the result that this party had the work stopped (1Esdras 5:66-73). <a onClick="return mV(\'Ezr\',4,\'6-24\');">Ezra 4:6-24</a> finds its parallel in 1Esdras 2:16-30 (see above). 1Esdras 2:30 and 5:73 are evidently duplicates.<P>6. 1Esdras 6:1-7:15 = <a onClick="return mV(\'Ezr\',5,\'1-\');">Ezr 5:1</a> - <a onClick="return mV(\'Ezr\',6,\'1-22\');">6:22</a>: Building of the temple resumed through the preaching of Haggai and Zechariah (1Esdras 6:1f). Persian officials unsuccessfully oppose the work (1Esdras 6:3-34) which is soon completed, the temple being then dedicated (1Esdras 7:1-11). Observance of the Passover (1Esdras 7:12-15). Between 1Esdras 7 and 8 there is an interval of some 60 years, for chapter 8 begins with the arrival of Ezra (458 BC).<P>7. 1Esdras 8:1-67 = <a onClick="return mV(\'Ezr\',7,\'1-\');">Ezr 7:1</a> - <a onClick="return mV(\'Ezr\',8,\'1-36\');">8:36</a>: Journey of Ezra and his party from Babylon to Jerusalem bearing letters of authority from King Artaxerxes I (died 424 BC) (1Esdras 8:1-27); list of those who return (1Esdras 8:28-40); gathering together of the party by the river Ahava; incidents of the journey; the arrival (1Esdras 8:41).<P>8. 1Esdras 8:68-90 = <a onClick="return mV(\'Ezr\',9,\'1-\');">Ezr 9</a>: Ezra\'s grief on hearing of the marriage of some Jews with foreign wives (1Esdras 8:68-73). His confession and prayer (1Esdras 8:74-90).<P>9. 1Esdras 8:91-9:36 = <a onClick="return mV(\'Ezr\',10,\'1-\');">Ezr 10</a>: The means used to end the mixed marriages; lists of the men (priests and others) who had married strange wives.<P>10. 1Esdras 9:37-55 = <a onClick="return mV(\'Neh\',7,\'73-\');">Ne 7:73 b</a> through <a onClick="return mV(\'Neh\',8,\'1-12\');">8:12</a>: The reforms of Ezra. In the Canonical Scriptures <a onClick="return mV(\'Neh\',7,\'73-\');">Ne 7:73 b through 10</a> gives the history of Ezra, not that of Nehemiah—the two never labored or lived together at Jerusalem. (The name Nehemiah in <a onClick="return mV(\'Neh\',8,9);">Ne 8:9</a> and <a onClick="return mV(\'Neh\',10,1);">10:1</a> is an evident interpolation.) In 1Esdras Nehemiah is not once mentioned in this section. In 1Esdras 9:49 (parallel <a onClick="return mV(\'Neh\',8,9);">Ne 8:9</a>) "Attharates" is the word used, and as a proper name (see 1Esdras 5:40, "Nehemiah and Attharates"). The majority of modern scholars assign this section to Ezra, adding it to <a onClick="return mV(\'Ezr\',10,\'1-\');">Ezr 10</a>, or incorporating it into the Ezra narrative. So Ewald, Wellhausen, Schrader, Klostermann, Baudissin, Budde and Ryssel. The present writer defends this view in the Century Bible in Ezra-Nehemiah-Esther, 242f. In this case 1Esdras borrows from Chronicles and Ezra alone and not from Nehemiah. It should be remembered however that Ezra-Nehemiah formed originally but one book. Some will say that Chronicles preceded Ezra-Nehemiah as a single book, but for this there is no evidence (see Century Bible, 4). The last verse of 1Esdras in all manuscripts ends in the middle of a sentence: "And they assembled ...." showing that the closing part of the book has been lost. The present writer suggests that the missing part is <a onClick="return mV(\'Neh\',8,\'13-\');">Ne 8:13 - Ne 10</a>, which begins, "And on the second day were gathered together (assembled) the heads of fathers\' houses," etc., the same verb being used in the Septuagint Greek of both passages with a very slight difference (episunechthesan, and sunechthesan, in Ezra and Esdras respectively).<P>3. The Relation to Chronicles, Ezra, Nehemiah:<P>Since <a onClick="return mV(\'Neh\',7,\'73-\');">Ne 7:73 b</a> through <a onClick="return mV(\'Neh\',8,\'1-12\');">8:12</a> belongs to the Book of Ezra (see above) describing the work of Ezra, not that of Nehemiah, the contents of 1Esdras are parallel with those of Ezra alone with the exception of chapter 1 which agrees with <a onClick="return mV(\'2Ch\',35,\'1-\');">2Ch 35:1</a> - <a onClick="return mV(\'2Ch\',36,\'1-21\');">36:21</a>. Various explanations have been offered, the following being the principal: (1) that 1Esdras is a compilation based on the Septuagint of Chronicles, Ezra and Nehemiah: so Keil, Bissell and formerly Schurer (GJV, II, ii, 179f; Herzog2, I, 496); the arguments for this opinion are well marshaled by Bissell in his Commentary on the Apocrypha (Lange); (2) that 1Esdras is an independent Greek translation from a now lost Hebrew (or Aramaic) origin in many respects superior to our Massoretic Text: so Whiston, Pohlmann, Herzfeld, Fritzsche, Ginsburg, Cheyne, Thackeray, Nestle, Howarth, Torrey and Bertholet. Most of these writers hold that the original 1Esdras included the whole of Chronicles, Ezra and Nehemiah; (3) the bulk of those who support view 2 argue that the original 1Esdras formed the real Septuagint version of Chronicles, Ezra and Nehemiah, what exists in our present Septuagint being another Greek translation, probably by Theodotion (fl, about 150 AD), just as we now know that what up to 1772 (the date of the publication in Rome of the Codex Chisianus) was considered as the Septuagint of Daniel is really Theodotion\'s version. Howarth (see articles in the Academy, 1893; PSBA, XXIX, etc.), and Torrey (Ezra Studies) stoutly champion this view. The evidence offered is of two kinds, external and internal:<P>(1) External Evidence.<P>(a) Josephus uses this version as his source for the period, though for other Old Testament books he follows the Septuagint. (b) In the foreword to the Syriac version of 1Esdras in Walton\'s Polyglot it is said that this version follows the Septuagint, which surely counts for nothing since copies of the Septuagint known to us contain both 1Esdras and the Greek translation reckoned up to recently as the true Septuagint. (c) Howarth maintains, but without proof, that in Origen\'s Hexapla, 1Esdras takes the place of our Septuagint version, and that the same is true of the Virus Itala.<P>(2) Internal Evidence.<P>(a) It is said by Dr. Gwyn, Thackeray and Howarth that the Greek of the true Septuagint of Daniel and that of 1Esdras are very similar in character, which however only goes to prove that one man translated both.<P>(b) Howarth holds that the Greek of Daniel and Ezra in the orthodox Septuagint version is very literal, as was all Theodotion\'s translation work. But such statements have to be received with very great caution, as in judging of style so much depends on the personal equation. The present writer has compared carefully parts ascribed with confidence to Theodotion and the Septuagint without reaching the above conclusions. At the most the matter has not been set at rest by any facts or reasoning as yet supplied. It must be admitted that 1Esdras and Josephus preserve the true sequence of the events chronicled in <a onClick="return mV(\'Neh\',7,\'73-\');">Ne 7:73b through 10</a>, the Massoretic Text and the Greek version based on it having gone wrong at this point, probably through the mixing of Hebrew skins or leaves. Those who see in 1Esdra the true Septuagint agree almost to a man that 1Esdras 3:1-5:6 is a late interpretation, never having had a Hob original. This may account in a large degree for the vigor and elegance of the Greek Howarth, however, parts company with his friends Torrey, Bertholet, etc., by arguing strenuously for this part. (See more fully in Century Bible, Ezra, etc., 27ff.)<P>4. Versions:<P>1Esdras exists in the following ancient versions in addition to the Greek text which may or may not be a translation (see 3 above):<P>(1) Latin: (a) Jerome. (b) Vulgate.<P>(2) Syriac: (a) The Peshitta. The Peshitta, given in Walton\'s Polyglot and with a critically revised text by Lagarde (Libri Veteris Testamenti Apocrypha Syriace, 1861). (b) The Hexaplar Syriac version. For details of manuscripts, etc., see "Literature" below.<P>5. Date and Authorship:<P>Nothing is known or can be conjectured as to the author or translator of 1Esdras, nor can anything be positively affirmed as to the date. If the work be the genuine Septuagint text this would give it an earlier origin than the view which makes it depend on the Septuagint. But this is to say but little. As Josephus (died 95 AD) used this book it must have been written some years before he wrote his history (say 67 AD). We must assume that it existed some time before the beginning of our era. Ewald, on account of some resemblances to the earliest of the Sibylline Books, dates 1Esdras about 190 BC. But admitting dependence in this matter—which is doubtful—it is impossible to say which is dependent and which is independent in such cases.<P>LITERATURE.<P>The most important books have been named at the end of the general article on <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a> (which see). Recent contributions by Howarth and Torrey have been mentioned in the course of the foregoing article.``33';
isbe[3189]='Esdras,The Second (Forth) Book; Apocalyptic Esdras`Or The Apocalyptic Esdras:<P>Contents<P>1. Name<P>2. Contents<P>3. Language<P>4. Versions<P>5. Origin of the Book<P>6. Date<P>LITERATURE<hr /><P>This book was not received by the Council of Trent as canonical, nor has it ever been acknowledged as such by the Anglican church.<P>1. Name:<P>The book is not found in the Septuagint and no complete copy of the Greek text is known, though at one time it did exist. The oldest extant name is "The Prophet Ezra" (Esdras ho prophetes; see Clement of Alexandria, Strom., iii.16): It has been often called the Latin Esdras because it exists more completely in that language; compare the name Greek Esdras for 1Esdras.<P>3Esdras is the designation in old editions of the Vulgate, 1Esdras being Ezra and Nehemiah, 2Esdras denoting what in English is called 1Esdras. But in editions of the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) later than the Council of Trent, and also in Walton\'s Polyglot, Ezra is called 1Esdras, Nehemiah, 2Esdras, 1Esdras = 3Esdras, the present book (the Latin Esdras) being known as 4Esdras. In authorized copies of the Vulgate, i.e. in those commonly used, this book is lacking. On account of its contents, Westcott, following the example of Anastasius Sinaita (bishop of Antioch from 559 AD), called the book the "Apocalypse of Esdras." But as Tischendorf in 1866 edited a later and inferior work with this title the present writer suggests the name "The Apocalyptic Esdras." Of all the Jewish apocalypses this is the sublimest and most pleading.<P>See <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE, sec. II,1,5</a>.<P>2. Contents:<P>The original work consists of 2Esdras 3-14, chapters 1f and 15f being late additions. The entire book of 16 chapters exists in the Latin version only, the other versions containing chapters 3-14 only. The real 2nd (apocalyptic) Esdras, consisting of chapters 3-14, is made up of 7 visions given to Ezra in exile 30 years after the destruction of Jerusalem by the Babylonians. The drift of these visions is, How can a just and loving God allow His own people to suffer so much? The problem thus raised is fully and beautifully dealt with. For lack of space the present writer must refer for a fuller analysis to the article <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE, sec. I,5</a>,and the literature there cited. For 2Esdras 1ff and 15ff see under <a href="./study/isbe/search.html?string=ESDRAS+5+AND+6">ESDRAS 5 AND 6</a>.<P>3. Language:<P>Though no complete text even of 2Esdras 3-14 has survived, a careful examination of the Latin shows that it has been made from a Greek original.<P>(1) Some fragments of the Greek can be traced, as 5:35 in Clement of Alexandria and 8:23 in the Apostolical Constitutions.<P>(2) The order of the twelve prophets in 1:39f follows that in the Septuagint.<P>(3) The Latin version bears throughout clear traces of Greek idiom.<P>Thus the gen. is used with the comparative (5:3; 11:29); we have the genitive (not ablative) absolute in 10:9, the double negative and the use of de (Greek apo) and ex (Greek ek) with the genitive in various parts. But there are cogent reasons for concluding that the Greek version implied in the Latin itself implies a Hebrew original, and the proof is similar to that of a Greek version as the basis of the Latin In the Greek there are idioms which are Hebrew, not Greek, not even in their frequency Hellenistic Greek. The participle used to strengthen the finite verb is the regular Hebrew idiom of the absolute with the finite verb: see 4:2 (excedens excessit); 5:30 (odiens odisti). For other examples see Gunkel (in Kautzsch, Die Apokryphen u. Pseud. des Altes Testament, 332f); R. H. Charles (Enc Brit, X, 106). Ewald was the first to defend a Hebrew original, but in 1866 he was followed by his distinguished pupil Wellhausen and also by R. H. Charles (Apoc Bar, lxxii).<P>4. Versions:<P>(1) Latin.<P>The Latin version is far the most important and on it the English Versions of the Bible depends. But all published editions of the Latin text (those of Fabricius, Hilgenfeld, Fritzsche, etc.) go back to one and the same MS, the so-called Codex Sangermanensis (date 822), which omits a large part of the text between 2Esdras 7:36 and 7:37 Any reader of the English text can see the lack of continuity between these verses. In 1875 Bensly published the missing fragment with an Introduction and critical notes. In 1895 Bensly and James published a critical edition of The Fourth Book of Ezra in Latin, restoring the missing fragment and correcting with the aid of the best-known manuscripts.<P>(2) Other Versions.<P>There are Syriac (Peshitta), Ethiopic, Arabic, Armenian and yet other VSS, but all depend on the lost Greek except one of the two extant Arabic translations. The number and variety of versions show that 2Esdras was widely circulated. By the Greek and Latin Fathers it was quoted as a genuine prophetical work. Its importance in the estimation of the medieval Roman church is vouched for by the fact that it has reached us in a number of wellknown manuscripts of the Scriptures, and that it was added to the authorized Vulgate (Jerome\'s Latin Bible, 390-405 AD.) as an appendix.<P>5. Origin of the Book:<P>Two main views may briefly be noted:<P>(1) That of Kabisch (Das vierte Buch Esra, 1889) who holds that the editor of the book freely used a goodly number of sources, subtracting, adding and altering to suit his purpose. He gives a list of probable sources. R. H. Charles (Enc Brit, X, 107) is inclined to adopt this analysis.<P>(2) Gunkel (loc. cit.) maintains and tries to prove that the book is the production of a single writer. Yet he admits that the book contains a large number of inconsistencies which he explains by assuming that the editor made free use of oral and written traditions. The two views do not therefore stand very far apart, for both take for granted that several sources have been used. It is simply a question of more or less.<P>Wellhausen is probably right in saying that the author of 2 (4) Esdras had before him the Apocrypha of Baruch, written under the impression awakened by the destruction of Jerusalem in 71 AD.<P>6. Date:<P>The opinion of the best modern scholars is that the book was written somewhere in the East in the last decade of the 1st century of our era. This conclusion rests mainly on the most likely interpretation of the vision of the Eagle and the Lion in 2Esdras 11:1-12:51; but also on the fact that Clement of Alexandria (died 217 AD) quotes the Greek of 5:35.<P>LITERATURE.<P>Besides the literature referred to above see Schurer, A Hist of the Jewish People in the Time of Jesus Christ, II, iii, 93ff (Ger. edition 4, III, 315ff); the articles in HDB (Thackeray) and Encyclopedia Biblica (James); the New Sch-Herz under the word "Pseudepigrapha, Old Testament" (G. Beer), and in the present work under <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a> and <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</A>.``33';
isbe[3190]='Esdris`ez\'-dris, es\'-dris (Esdris):<P>A leader mentioned in 2Macc 12:36 in best texts and adopted in the Revised Version (British and American) for Gorgias of the King James Version. Grotius conjectured "men of Ephron" from 12:27.``1';
isbe[3191]='Esebon`es\'-e-bon (Judith 5:15) = <a href="./study/isbe/search.html?string=HESHBON">HESHBON</a> (Revised Version (British and American)), the chief city of the Ammonites.``1';
isbe[3192]='Esebrias`es-e-bri\'-as, e-se\'-bri-as.`<a href="./study/isbe/search.html?string=ESEREBIAS">ESEREBIAS</a>; <a href="./study/isbe/search.html?string=SHEREBIAH">SHEREBIAH</a>`1';
isbe[3193]='Esek`e\'-sek (eseq; Septuagint Adikia):<P>The name given by Isaac to a well dug by his servants, for the use of which the herdsmen of Gerar strove with them—"contention" (<a onClick="return mV(\'Gen\',26,20);">Ge 26:20</a>). It lay in the neighborhood of Rehoboth and Gerar: but the site is not identified.``1';
isbe[3194]='Eserebias`es-er-e-bi\'-as (Eserebias):<P>One of the chiefs of the priests (1Esdras 8:54).``1';
isbe[3195]='Eshan`e\'-shan (\'esh\'an; Esan; the King James Version Eshean):<P>A town of Judah in the uplands of Hebron (<a onClick="return mV(\'Jos\',15,52);">Jos 15:52</a>). No satisfactory identification has yet been suggested. Some think the name may be a corruption of Beersheba (Encyclopaedia Biblica, which see).``1';
isbe[3196]='Eshbaal`esh\'-ba-al.`<a href="./study/isbe/search.html?string=ISH+BOSHETH">ISH-BOSHETH</a>`1';
isbe[3197]='Eshban`esh\'-ban (\'eshban; perhaps "thoughtful," "intelligent"; Asban):<P>Name of a chief of the Horites (<a onClick="return mV(\'Gen\',36,26);">Ge 36:26</a>; <a onClick="return mV(\'1Ch\',1,41);">1Ch 1:41</a>).``1';
isbe[3198]='Eshcol (1)`esh\'-kol (\'eshkol, "cluster"; Eschol):<P>The brother of Mamre and Aner, the Amorite allies of Abraham who took part with him in the pursuit and defeat of Chedorlaomer\'s forces (<a onClick="return mV(\'Gen\',14,13,14);">Ge 14:13-14</a>). He lived in the neighborhood of Hebron (<a onClick="return mV(\'Gen\',13,18);">Ge 13:18</a>), and may have given his name to the valley of Eshcol, which lay a little north of Hebron (<a onClick="return mV(\'Num\',13,23);">Nu 13:23</a>).``1';
isbe[3199]='Eshcol (2)`esh\'-kol (\'eshkol; Pharagx botruos), "a cluster of grapes":<P>The spies came to Hebron "and they came unto the valley of Eshcol, and cut down from thence a branch with one cluster of grapes" (<a onClick="return mV(\'Num\',13,23,24);">Nu 13:23-24</a>; <a onClick="return mV(\'Num\',32,9);">32:9</a>; <a onClick="return mV(\'Deu\',1,24);">De 1:24</a>). It was a valley near Hebron rich in vineyards. Fruitful vineyards are still the most characteristic feature of the environs of Hebron, especially on the North. No particular valley can be identified, though popular tradition favors the wide and fertile valley, near the traditional site of "Abraham\'s oak," a little to the west of the carriage road just before it enters the outskirts of Hebron.``117';
