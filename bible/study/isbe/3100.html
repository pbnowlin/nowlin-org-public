st be rendered "in all his epistle," i.e. in every part of his epistle, it is safer to take it as an exaggeration, "in all his epistles," justified to some extent in the fact that besides Ephesians, Paul does mention the Ephesian Christians in Romans (<a onClick="return mV(\'Rom\',16,5);">16:5</a>); 1 Corinthians (<a onClick="return mV(\'1Cr\',15,32);">15:32</a>; <a onClick="return mV(\'1Cr\',16,8,19);">16:8, 19</a>); 2 Corinthians (<a onClick="return mV(\'2Cr\',1,8);">1:8</a>f); 1 Timothy (<a onClick="return mV(\'1Ti\',1,3);">1:3</a>) and 2 Timothy (<a onClick="return mV(\'2Ti\',1,18);">1:18</a>). In the opening address the connection with <a onClick="return mV(\'Eph\',1,\'3-6\');">Eph 1:3-6</a> is too close to be accidental. There are echoes of our epistle in chap. i (<a onClick="return mV(\'Eph\',6,1);">Eph 6:1</a>); ix (<a onClick="return mV(\'Eph\',2,\'20-22\');">Eph 2:20-22</a>); xviii (oikonomia, <a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>); xx (<a onClick="return mV(\'Eph\',2,18);">Eph 2:18</a>; <a onClick="return mV(\'Eph\',4,24);">4:24</a>); and in Ignat. ad Polyc. v we have close identity with <a onClick="return mV(\'Eph\',5,25);">Eph 5:25</a> and less certain connection with <a onClick="return mV(\'Eph\',4,2);">Eph 4:2</a>, and in vi with <a onClick="return mV(\'Eph\',6,\'13-17\');">Eph 6:13-17</a>.<P>The Epistle of Polycarp in two passages shows verbal agreement with Eph: in chap. i with <a onClick="return mV(\'Eph\',1,8);">Eph 1:8</a>, and in xii with <a onClick="return mV(\'Eph\',4,26);">Eph 4:26</a>, where we have (the Greek is missing here) ut his scripturis dictum est. Hermas speaks of the grief of the Holy Spirit in such a way as to suggest Ephesians (Mand. X, ii; compare <a onClick="return mV(\'Eph\',4,30);">Eph 4:30</a>). Sim. IX, xiii, shows a knowledge of <a onClick="return mV(\'Eph\',4,\'3-6\');">Eph 4:3-6</a>, and possibly of <a onClick="return mV(\'Eph\',5,26);">5:26</a> and <a onClick="return mV(\'Eph\',1,13);">1:13</a>. In the Didache (4) we find a parallel to <a onClick="return mV(\'Eph\',6,5);">Eph 6:5</a>: "Servants submit yourselves to your masters." In Barnabas there are two or three turns of phrase that are possibly due to Ephesians. There is a slightly stronger connection between II Clement and Ephesians, especially in chap. xiv, where we have the Ephesian figure of the church as the body of Christ, and the relation between them referred to in terms of husband and wife. This early evidence, slight though it is, is strengthened by the part Ephesians played in the 2nd century where, as we learn from Hippolytus, it was used by the Ophites and Basilides and Valentinus. The latter (according to Hip., Phil., VI, 29) quoted <a onClick="return mV(\'Eph\',3,\'16-18\');">Eph 3:16-18</a>, saying, "This is what has been written in Scripture," while his disciple Ptolemais is said by Irenaeus (Adv. Haer., i.8, 5) to have attributed <a onClick="return mV(\'Eph\',5,13);">Eph 5:13</a> to Paul by name. According to the addenda to the eighth book of the Stromateis of Clement of Alexandria, Theodotus, a contemporary of Valentinus, quoted <a onClick="return mV(\'Eph\',4,10);">Eph 4:10</a> and <a onClick="return mV(\'Eph\',4,30);">30</a> with the words: "The apostle says," and attributes <a onClick="return mV(\'Eph\',4,24);">Eph 4:24</a> to Paul. Marcion knew Ephesians as Tertullian tells us, identifying it with the epistle referred to in <a onClick="return mV(\'Col\',4,16);">Col 4:16</a> as ad Laodicenos. We find it in the Muratorian Fragment (10b, l. 20) as the second of the epistles which "Paul wrote following the example of his predecessor John." It is used in the letter from the church of Lyons and Vienne and by Irenaeus, Tertullian, Clement of Alexandria, Origen and later writers. We can well accept the dictum of Dr. Hort that it "is all but certain on this evidence that the Epistle was in existence by 95 AD; quite certain that it was in existence by about fifteen years later or conceivably a little more" (Hort, Judaistic Christianity, 118).<P>2. Internal Evidence:<P>To this very strong chain of external evidence, reaching back to the very beginning of the 2nd century, if not into the end of the 1st, showing Ephesians as part of the original Pauline collection which no doubt Ignatius and Polycarp used, we must add the evidence of the epistle itself, testing it to see if there be any reason why the letter thus early attested should not be accredited to the apostle.<P>(1) That it claims to be written by Paul is seen not only in the greeting, "Paul, an apostle of Christ Jesus through the will of God, to the saints that are at Ephesus," but also in <a onClick="return mV(\'Eph\',3,1);">Eph 3:1</a>, where we read: "For this cause I Paul, the prisoner of Christ Jesus in behalf of you Gentiles," a phrase which is continued in <a onClick="return mV(\'Eph\',4,1);">4:1</a>: "I therefore, the prisoner in the Lord." This claim is substantiated by the general character of the epistle which is written after the Pauline norm, with greeting and thanksgiving, leading on to and serving as the introduction of the special doctrinal teaching of the epistle. This is the first great division of the Pauline epistles and is regularly followed by an application of the teaching to practical matters, which in turn yields to personal greetings, or salutations, and the final benediction, commonly written by the apostle\'s own hand. In only one particular does Ephesians fail to answer completely to this outline. The absence of the personal greetings has always been marked as a striking peculiarity of our letter. The explanation of this peculiarity will meet us when we consider the destination of the epistle (see III below).<P>(2) Further evidence for the Pauline authorship is found in the general style and language of the letter. We may agree with von Soden (Early Christ. Lit., 294) that "every sentence contains verbal echoes of Pauline epistles, indeed except when ideas peculiar to the Epistle come to expression it is simply a mosaic of Pauline phraseology," without accepting his conclusion that Paul did not write it. We feel, as we read, that we have in our hands the work of one with whom the other epistles have made us familiar. Yet we are conscious none the less of certain subtle differences which give occasion for the various arguments that critics have brought against the claim that Paul is the actual author. This is not questioned until the beginning of the last century, but has been since Schleiermacher and his disciple Usteri, though the latter published his doubts before his master did his. The Tubingen scholars attacked the epistle mainly on the ground of supposed traces of Gnostic or Montanist influences, akin to those ascribed to the Colossians. Later writers have given over this claim to put forward others based on differences of style (De Wette, followed by Holtzmann, von Soden and others); dependence on Colossians (Hitzig, Holtzmann); the attitude to the Apostles (von Soden); doctrinal differences, especially those that concern Christology and the Parousia, the conception of the church (Klopper, Wrede and others). The tendency, however, seems to be backward toward a saner view of the questions involved; and most of those who do not accept the Pauline authorship would probably agree with Julicher (Encyclopedia Biblica), who ascribes it to a "Pauline Christian intimately familiar with the Pauline epistles, especially with Colossians, writing about 90," who sought in Ephesians "to put in a plea for the true catholicism in the meaning of Paul and in his name."<P>(3) Certain of these positions require that we should examine the doctrinal objections.<p>(a) First of these is the claim that Ephesians has a different conception of the person and work of Christ from the acknowledged epistles of Paul. Not only have we the exaltation of Christ which we find in <a onClick="return mV(\'Col\',1,16);">Col 1:16</a>ff, but the still further statement that it was God\'s purpose from the beginning to "sum up all things in Christ, the things in the heavens, and the things upon the earth" (<a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>). This is no more than the natural expansion of the term, "all things," which are attributed to Christ in <a onClick="return mV(\'1Cr\',8,6);">1Co 8:6</a>, and is an idea which has at least its foreshadowing in <a onClick="return mV(\'Rom\',8,19,20);">Ro 8:19-20</a> and <a onClick="return mV(\'2Cr\',5,18,19);">2Co 5:18-19</a>. The relation between Christ and the church as given in <a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a> and <a onClick="return mV(\'Eph\',5,23);">5:23</a> is in entire agreement with Paul\'s teaching in <a onClick="return mV(\'Rom\',12,\'1-\');">Ro 12</a>, and <a onClick="return mV(\'1Cr\',12,\'1-\');">1Co 12</a>. It is still the Pauline figure of the church as the body of Christ, in spite of the fact that Christ is not thought of as the head of that body. The argument in the epistle does not deal with the doctrine of the cross from the standpoint of the earlier epistles, but the teaching is exactly the same. There is redemption (<a onClick="return mV(\'Eph\',1,7,14);">Eph 1:7, 14</a>; <a onClick="return mV(\'Eph\',4,30);">4:30</a>); reconciliation (<a onClick="return mV(\'Eph\',2,\'14-16\');">Eph 2:14-16</a>); forgiveness (<a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>; <a onClick="return mV(\'Eph\',4,32);">4:32</a>). The blood of Christ shed on the cross redeems us from our sin and restores us to God. In like manner it is said that the Parousia is treated (<a onClick="return mV(\'Eph\',2,7);">Eph 2:7</a>) as something far off. But Paul has long since given up the idea that it is immediately; even in <a onClick="return mV(\'2Th\',2,\'1-\');">2Th 2</a> he shows that an indeterminate interval must intervene, and in <a onClick="return mV(\'Rom\',11,25);">Ro 11:25</a> he sees a period of time yet unfulfilled before the end.<p>(b) The doctrine of the church is the most striking contrast to the earlier epistles. We have already dealt with the relation of Christ to the church. The conception of the church universal is in advance of the earlier epistles, but it is the natural climax of the development of the apostle\'s conception of the church as shown in the earlier epistles. Writing from Rome with the idea of the empire set before him, it was natural that Paul should see the church as a great whole, and should use the word ekklesia absolutely as signifying the oneness of the Christian brotherhood. As a matter of fact the word is used in this absolute sense in <a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a> before the Captivity Epistles (compare <a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>; <a onClick="return mV(\'1Cr\',10,32);">10:32</a>). The emphasis here on the unity of Jew and Gentile in the church finds its counterpart in the argument of the Epistle to the Romans, though in Ephesians this is "urged on the basis of God\'s purpose and Christian faith, rather than on the Law and the Promises."<P>Neither is it true that in Ephesians the Law is spoken of slightingly, as some say, by the reference to circumcision (<a onClick="return mV(\'Eph\',2,11);">2:11</a>). In no case is the doctrinal portion of the epistle counter to that of the acknowledged Pauline epistles, though in the matter of the church, and of Christ\'s relationship to it and to the universe, there is evidence of progress in the apostle\'s conception of the underlying truths, which none the less find echoes in the earlier writings. "New doctrinal ideas, or a new proportion of these ideas, is no evidence of different authorship."<p>(c) In the matter of organization the position of Ephesians is not in any essential different from what we have in 1 Corinthians.<P>(4) The linguistic argument is a technical matter of the use of Greek words that cannot well be discussed here. The general differences of style, the longer "turgid" sentences, the repetitions on the one hand; the lack of argument, the full, swelling periods on the other, find their counterpart in portions of Romans. The minute differences which show themselves in new or strange words will be much reduced in number when we take from the list those that are due to subjects which the author does not discuss elsewhere (e.g. those in the list of armor in <a onClick="return mV(\'Eph\',6,13);">Eph 6:13</a>ff). Holtzmann (Einl, 25) gives us a list of these hapax legomena (76 in all). But there are none of these which, as Lock says, Paul could not have used, though there are certain which he does not use elsewhere and others which are only found in his accepted writings and here. The following stand out as affording special ground for objection. The phrase "heavenly places" (ta epourania, <a onClick="return mV(\'Eph\',1,3,10);">Eph 1:3, 10</a>; <a onClick="return mV(\'Eph\',2,6);">2:6</a>; <a onClick="return mV(\'Eph\',3,10);">3:10</a>; <a onClick="return mV(\'Eph\',6,12);">6:12</a>) is peculiar to this epistle. The phrase finds a partial parallel it in <a onClick="return mV(\'1Cr\',15,49);">1Co 15:49</a> and the thought is found in <a onClick="return mV(\'Phl\',3,20);">Php 3:20</a>. The devil (ho diabolos, <a onClick="return mV(\'Eph\',4,27);">Eph 4:27</a>; <a onClick="return mV(\'Eph\',6,11);">6:11</a>) is used in place of the more usual Satan (satanas).<P>But in Acts, Paul is quoted as using diabolos in <a onClick="return mV(\'Act\',13,10);">13:10</a> and satanas in <a onClick="return mV(\'Act\',26,18);">26:18</a>. It is at least natural that he would have used the Greek term when writing from Rome to a Greek-speaking community. The objection to the expression "holy" (hagiois) apostles (<a onClick="return mV(\'Eph\',3,5);">Eph 3:5</a>) falls to the ground when we remember that the expression "holy" (hagios) is Paul\'s common word for Christian and that he uses it of himself in this very epistle (<a onClick="return mV(\'Eph\',3,8);">Eph 3:8</a>). In like manner "mystery" (musterion), "dispensation" (oikonomia) are found in other epistles in the same sense that we find them in here. The attack on the epistle fails, whether it is made from the point of teaching or language; and there is no ground whatever for questioning the truth of Christian tradition that Paul wrote the letter which we know as the Epistle to the Ephesians.<P>II. Place and Date of Writing.<P>The time and place of his writing Ephesians turn on the larger question of the chronology of Paul\'s life (see <a href="./study/isbe/search.html?string=PAUL">PAUL</a>) and the relation of the Captivity Epistles to each other; and the second question whether they were written from Caesarea or Rome (for this see <a href="./study/isbe/search.html?string=PHILEMON,+EPISTLE+TO">PHILEMON, EPISTLE TO</a>). Suffice it here to say that the place was undoubtedly Rome, and that they were written during the latter part of the two years\' captivity which we find recorded in <a onClick="return mV(\'Act\',28,30);">Ac 28:30</a>. The date will then be, following the later chronology, 63 or 64 AD; following the earlier, which is, in many ways, to be preferred, about 58 AD.<P>III. Destination.<P>To whom was this letter written?<P>1. Title:<P>The title says to the Ephesians. With this the witness of the early church almost universally agrees. It is distinctly stated in the Muratorian Fragment (10b, 1. 20); and the epistle is quoted as to the Ephesians by Irenaeus (Adv. Haer., v.14, 3; 24, 3); Tertullian (Adv. Marc., v.11, 17; De Praesc., 36; De Monag., v); Clement of Alexandria (Strom., iv.65; Paed., i.18) and Origen (Contra Celsum, iii.20). To these must be added the evidence of the extant manuscripts and VSS, which unite in ascribing the epistle to the Ephesians. The only exception to the universal evidence is Tertullian\'s account of Marcion (circa 150 AD) who reads Ad Laodicenos (Adv. Marc., v.11: "I say nothing here about another epistle which we have with the heading \'to the Ephesians,\' but the heretics \'to the Laodiceans\' ....(v.17): According to the true belief of the church we hold this epistle to have been dispatched to the Ephesians, not to the Laodiceans; but Marcion had to falsify its title, wishing to make himself out a very diligent investigator").<P>2. The Inscription:<P>This almost universal evidence for Ephesus as the destination of our epistle is shattered when we turn to the reading of the first verse. Here according to Textus Receptus of the New Testament we read "Paul unto the saints which are at Ephesus (en Epheso) and to the faithful in Christ Jesus." When we look at the evidence for this reading we find that the two words en Epheso are lacking in Codex Sinaiticus and Codex Vaticanus, and that the corrector of the cursive known as 67 has struck them out of his copy. Besides these a recently described MS, Cod. Laura 184, giving us a text which is so closely akin to that used by Origen that the scribe suggests that it was compiled from Origen\'s writings, omits these words (Robinson, Ephesians, 293). To this strong manuscript evidence against the inclusion of these two words in the inscription we must add the evidence of Origen and Basil. Origen, as quoted in Cramer\'s Catena at the place, writes: "In the Ephesians alone we found the expression \'to the saints which are,\' and we ask, unless the phrase \'which are\' is redundant, what it can mean. May it not be that as in Exodus He who speaks to Moses declares His name to be the Absolute One, so also those who are partakers of the Absolute become existent when they are called, as it were, from non-being into being?" Origen evidently knows nothing here of any reading en Epheso, but takes the words "which are" in an absolute, metaphysical sense. Basil, a century and a half later, probably refers to this comment of Origen (Contra Eun., ii.19) saying: "But moreover, when writing to the Ephesians, as to men who are truly united with the Absolute One through clear knowledge, he names them as existent ones in a peculiar phrase, saying \'to the saints which are and faithful in Christ Jesus.\' For so those who were before us have handed it down, and we also have found (this reading) in old copies." In Jerome\'s note on this verse there is perhaps a reference to this comment on Origen, but the passage is too indefinitely expressed for us to be sure what its bearing on the reading really is. The later writers quoted by Lightfoot (Biblical Essays, 384f) cannot, as Robinson shows (Eph, 293), be used as witnesses against the Textus Receptus. We may therefore conclude that the reading en Epheso was wanting in many early manuscripts, and that there is good ground for questioning its place in the original autograph. But the explanations suggested for the passage, as it stands without the words, offend Pauline usage so completely that we cannot accept them. To take "which are" in the phrase "the saints which are" (tois ousin) as absolute, as Origen did; or as meaning "truly," is impossible. It is possible to take the words with what follows, "and faithful" (kai pistois), and interpret this latter expression (pistois) either in the New Testament sense of "believers" or in the classical sense of "steadfast." The clause would then read either "to the saints who are also believers," or "to the saints who are also faithful," i.e. steadfast. Neither of these is wholly in accord with Paul\'s normal usage, but they are at least possible.<P>3. The Evidence of the Letter Itself:<P>The determining factor in the question of the destination of the epistle lies in the epistle itself. We must not forget that, save perhaps Corinth, there was no church with which Paul was so closely associated as that in Ephesus. His long residence there, of which we read in Acts (chapters <a onClick="return mV(\'Act\',19,\'1-\');">19</>; <a onClick="return mV(\'Act\',20,\'1-\');">20</a>), finds no echo in our epistle. There is no greeting to anyone of the Christian community, many of whom were probably intimate friends. The close personal ties, that the scene of <a onClick="return mV(\'Act\',20,\'17-38\');">Ac 20:17-38</a> shows us existed between him and his converts in Ephesus, are not even hinted at. The epistle is a calm discussion, untouched with the warmth of personal allusion beyond the bare statement that the writer is a prisoner (<a onClick="return mV(\'Eph\',3,\'1-\');">Eph 3:1</a>; <a onClick="return mV(\'Eph\',4,1);">4:1</a>), and his commendation of Tychicus (<a onClick="return mV(\'Eph\',6,21,22);">Eph 6:21-22</a>), who was to tell them about Paul\'s condition in Rome. This lack of personal touch is intensified by the assumption underlying <a onClick="return mV(\'Eph\',3,\'1-\');">Eph 3</a> and <a onClick="return mV(\'Eph\',4,\'1-\');">4</a> that the readers do not know his knowledge of the mysteries of Christ. In <a onClick="return mV(\'Eph\',3,2);">3:2</a> and <a onClick="return mV(\'Eph\',4,21,22);">4:21-22</a> there is a particle (eige, "if indeed") which suggests at least some question as to how far Paul himself was the missionary through whom they believed. All through the epistle there is a lack of those elements which are so constant in the other epistles, which mark the close personal fellowship and acquaintance between the apostle and those to whom he is writing.<P>4. Conclusion:<P>This element in the epistle, coupled with the strange fact of Marcion\'s attributing it to the Laodiceans, and the expression in <a onClick="return mV(\'Col\',4,16);">Col 4:16</a> that points to a letter coming from Laodicea to Colosse, has led most writers of the present day to accept Ussher\'s suggestion that the epistle is really a circular letter to the churches either in Asia, or, perhaps better, in that part of Phrygia which lies near Colosse. The readers were evidently Gentiles (<a onClick="return mV(\'Eph\',2,1);">Eph 2:1</a>; <a onClick="return mV(\'Eph\',3,1,2);">3:1-2</a>) and from the mission of Tychicus doubtless of a definite locality, though for the reasons given above this could not well be Ephesus alone. It is barely possible that the cities to whom John was bidden to write the Revelation (<a onClick="return mV(\'Rev\',1,\'1-\');">Re 1-3</a>) are the same as those to whom Paul wrote this epistle, or it may be that they were the churches of the Lycus valley and its immediate neighborhood. The exact location cannot be determined. But from the fact that Marcion attributed the epistle to Laodicea, possibly because it was so written in the first verse, and from the connection with Colossians, it is at least probable that two of these churches were at Colosse and Laodicea. On this theory the letter would seem to have been written from Rome to churches in the neighborhood of, or accessible to, Colosse, dealing with the problem of Christian unity and fellowship and the relations between Christ and the church and sent to them by the hands of Tychicus. The inscription was to be filled in by the bearer, or copies were to be made with the name of the local church written in, and then sent to or left with the different churches. It was from Ephesus, as the chief city of Asia in all probability, that copies of this circular letter reached the church in the world, and from this fact the letter came to be known in the church at large as that from Ephesus, and the title was written "to the Ephesians," and the first verse was made to read to the "saints which are in Ephesus."<P>IV. Relation to Other New Testament Writings.<P>Ephesians raises a still further question by the close resemblances that can be traced between it and various other New Testament writings.<P>1. Peter:<P>The connection between Ephesians and 1 Peter is not beyond question. In spite of the disclaimer of as careful a writer as Dr. Bigg (ICC) it is impossible to follow up the references given by Holtzmann and others and not feel that Peter either knew Ephesians or at the very least had discussed these subjects with its author. For, as Dr. Hort tells us, the similarity is one of thought and structure rather than of phrase. The following are the more striking passages with their parallels in 1 Peter: <a onClick="return mV(\'Eph\',1,3);">Eph 1:3</a> (<a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>); <a onClick="return mV(\'Eph\',1,18,19,20);">1:18-20</A> (<a onClick="return mV(\'1Pe\',1,\'3-5\');">1Pe 1:3-5</a>); <a onClick="return mV(\'Eph\',2,\'18-22\');">2:18-22</A> (<a onClick="return mV(\'1Pe\',2,\'4-6\');">1Pe 2:4-6</a>); <a onClick="return mV(\'Eph\',1,\'20-22\');">1:20-22</a> (<a onClick="return mV(\'1Pe\',3,22);">1Pe 3:22</a>); <a onClick="return mV(\'Eph\',3,9);">3:9</a> (<a onClick="return mV(\'1Pe\',1,20);">1Pe 1:20</a>); <a onClick="return mV(\'Eph\',3,20);">3:20</a> (<a onClick="return mV(\'1Pe\',1,12);">1Pe 1:12</a>); <a onClick="return mV(\'Eph\',4,19);">4:19</A> (<a onClick="return mV(\'1Pe\',1,14);">1Pe 1:14</a>). The explanations that 1 Peter and Ephesians are both from the pen of the same writer, or that Ephesians is based on 1 Peter, are overthrown, among other reasons, by the close relation between Ephesians and Colossians.<P>2. Johannine Writings:<P>The connection with the Apocalypse is based on <a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a> as compared with <a onClick="return mV(\'Rev\',21,14);">Re 21:14</a>; <a onClick="return mV(\'Eph\',3,5);">Eph 3:5</a> and <a onClick="return mV(\'Rev\',10,7);">Re 10:7</a>; <a onClick="return mV(\'Eph\',5,11);">Eph 5:11</a> and <a onClick="return mV(\'Rev\',18,4);">Re 18:4</a>, and the figure of the bride of the Lamb (<a onClick="return mV(\'Rev\',19,7);">Re 19:7</a>; compare <a onClick="return mV(\'Eph\',5,25);">Eph 5:25</a>). Holtzmann adds various minor similarities, but none of these are sufficient to prove any real knowledge of, let alone dependence on Ephesians. The contact with the Fourth Gospel is more positive. Love (agape) and knowledge (gnosis) are used in the same sense in both Ephesians and the Gospel. The application of the Messianic title, the Beloved (<a onClick="return mV(\'Eph\',1,6);">Eph 1:6</a>), to Christ does not appear in the Gospel (it is found in <a onClick="return mV(\'Mat\',3,17);">Mt 3:17</a>), but the statement of the Father\'s love for Him constantly recurs. The reference to the going up and coming down of Christ (<a onClick="return mV(\'Eph\',4,9);">Eph 4:9</a>) is closely akin to <a onClick="return mV(\'Jhn\',3,13);">Joh 3:13</a> ("No man hath ascended into heaven, but he," etc.). So, too, <a onClick="return mV(\'Eph\',5,11,13);">Eph 5:11, 13</a> finds echo in <a onClick="return mV(\'Jhn\',3,19,20);">Joh 3:19-20</a>; <a onClick="return mV(\'Eph\',4,4,7);">Eph 4:4, 7</a> in <a onClick="return mV(\'Jhn\',3,34);">Joh 3:34</a>; <a onClick="return mV(\'Eph\',5,6);">Eph 5:6</a> in <a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a>. <a onClick="return mV(\'Eph\',5,8);">Eph 5:8</a>f is akin to <a onClick="return mV(\'1Jo\',1,6);">1Joh 1:6</a> and <a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a> to <a onClick="return mV(\'1Jo\',3,10);">1Joh 3:10</a>.<P>3. Colossians:<P>When we turn to Colossians we find a situation that is without parallel in the New Testament. Out of 155 verses in Ephesians, 78 are found in Colossians in varying degrees of identity. Among them are these: <a onClick="return mV(\'Eph\',1,6);">Eph 1:6</a> parallel <a onClick="return mV(\'Col\',1,13);">Col 1:13</a>; <a onClick="return mV(\'Eph\',1,16);">Eph 1:16</a>ff parallel <a onClick="return mV(\'Col\',1,9);">Col 1:9</a>; <a onClick="return mV(\'Eph\',1,21);">Eph 1:21</a>ff parallel <a onClick="return mV(\'Col\',1,16);">Col 1:16</a>ff; <a onClick="return mV(\'Eph\',2,16);">Eph 2:16</a> parallel <a onClick="return mV(\'Col\',2,20);">Col 2:20</a>; <a onClick="return mV(\'Eph\',4,2);">Eph 4:2</a> parallel <a onClick="return mV(\'Col\',3,12);">Col 3:12</a>; <a onClick="return mV(\'Eph\',4,15);">Eph 4:15</a> parallel <a onClick="return mV(\'Col\',2,19);">Col 2:19</a>; <a onClick="return mV(\'Eph\',4,22);">Eph 4:22</a> parallel <a onClick="return mV(\'Col\',3,9);">Col 3:9</a>; <a onClick="return mV(\'Eph\',4,32);">Eph 4:32</a> parallel <a onClick="return mV(\'Col\',3,12);">Col 3:12</a>ff; <a onClick="return mV(\'Eph\',5,5);">Eph 5:5</a> parallel <a onClick="return mV(\'Col\',3,5);">Col 3:5</a>; <a onClick="return mV(\'Eph\',5,19);">Eph 5:19</a>ff parallel <a onClick="return mV(\'Col\',3,16);">Col 3:16</a>ff; <a onClick="return mV(\'Eph\',6,4);">Eph 6:4</a> parallel <a onClick="return mV(\'Col\',3,21);">Col 3:21</a>; <a onClick="return mV(\'Eph\',6,\'5-9\');">Eph 6:5-9</a> parallel <a onClick="return mV(\'Col\',3,\'22-\');">Col 3:22</a> - <a onClick="return mV(\'Col\',4,1);">4:1</a>. For a fuller list see Abbott (ICC, xxiii). Not only is this so, but there is an identity of treatment, a similarity in argument so great that Bishop Barry (NT Commentary for English Readers, Ellicott) can make a parallel analysis showing the divergence and similarity by the simple device of different type. To this we must add that there are at least a dozen Greek words common to these two epistles not found elsewhere. Over against this similarity is to be set the dissimilarity. The general subject of the epistles is not approached from the same standpoint.<P>In one it is Christ as the head of all creation, and our duty in consequence. In the other it is the church as the fullness of Christ and our duty—put constantly in the same words—in consequence thereof. In Ephesians we have a number of Old Testament references, in Colossians only one. In Ephesians we have unique phrases, of which "the heavenly spheres" (ta epourania) is most striking, and the whole treatment of the relation of Jew and Gentile in the church, and the marriage tie as exemplified in the relation between Christ and the church. In Colossians we have in like manner distinct passages which have no parallel in Ephesians, especially the controversial section in chapter <a onClick="return mV(\'Eph\',2,\'1-\');">2</a>, and the salutations. In truth, as Davies (Ephesians, Paul to Ephesians, Colossians, and Philippians.) well says: "It is difficult indeed to say, concerning the patent coincidences of expression in the two epistles, whether the points of likeness or of unlikeness between them are the more remarkable." This situation has given rise to various theories. The most complicated is that of H. Holtzmann, who holds that some passages point to a priority of Colossians, others to that of Ephesians; and as a result he believes that Colossians, as we have it, is a composite, based on an original epistle of Paul which was expanded by the author of Ephesians—who was not Paul—after he had written this epistle. So Holtzmann would give us the original Colossians (Pauline), Ephesians (based on it), and the present Colossians (not Pauline) expanded from the former through the latter. The theory falls to the ground on its fundamental hypothesis, that Colossians as it stands is interpolated. The most reasonable explanation is that both Colossians and Ephesians are the work of Paul, written at practically the same time, and that in writing on the same subjects, to different people, there would be just the differences and similarity which we have in these epistles. The objection that Paul could not repeat himself and yet differ as these two letters do is purely imaginary. Zahn shows us that men do just this very thing, giving an account of Bismarck\'s speaking on a certain subject to a group of officers and later to a large body of men, and yet using quite different language. Moreover, Paul is not averse to repeating himself (compare Romans and Galatians and 1 Timothy and 2 Timothy) when to do so will serve his purpose. "Simultaneous authorship by one writer," and that writer Paul, is the only explanation that will satisfy all the facts in the case and give them due proportion.<P>V. The Purpose.<P>If our interpretation of the circumstances, composition and destination of Ephesians be right, we are now in a position to look beneath the surface and ask why the apostle wrote it. To understand its central theme we must remember that Paul, the prisoner of the Lord, is writing in the calm of his imprisonment, far from the noise and turmoil, the conflict and strife, that marked his earlier life. He is now able to look out on the church and get a view of it in its wholeness, to see the part it is to play in God\'s scheme for the restoration of the human race, to see God\'s purpose in it and for it and its relation to Him. With this stand-point he can write to the churches about Ephesus on the occasion of Tychicus\' return to Colosse, not to correct false views on some special point, but to emphasize the great central truth which he had put in the very forefront of his letter. God\'s eternal purpose is to gather into one the whole created universe, to restore harmony among His creatures and between them and Himself. The apostle\'s whole prayer is for this end, his whole effort and desire is toward this goal: that they may have full, clear knowledge of this purpose of God which He is working out through Christ Jesus, who is the head of the church, the very fullness of Him who is being fulfilled all over the world. Everything, for the apostle, as he looks forth upon the empire, centers in the purpose of God. The discord between the elements in the church, the distinction between Jew and Gentile, all these must yield to that greater purpose. The vision is of a great oneness in Christ and through Him in God, a oneness of birth and faith and life and love, as men, touched with the fire of that Divine purpose, seek to fulfil, each in himself, the part that God has given him to play in the world, and, fighting against the foes of God, to overcome at last.<P>It is a noble purpose to set before men this great mystery of the church as God\'s means by which, in Christ, He may restore all men to union with Himself. It is an impossible vision except to one who, as Paul was at the time, is in a situation where the strife and turmoil of outside life can enter but little, but a situation where he can look out with a calm vision and, in the midst of the world\'s discord, discern what God is accomplishing among men.<P>VI. Argument.<P>The Argument of Ephesians is as follows:<P><a onClick="return mV(\'Eph\',1,1,2);">Ephesians 1:1-2</a>: Greeting.<P><a onClick="return mV(\'Eph\',1,\'3-10\');">Ephesians 1:3-10</a>: Hymn of praise to God for the manifestation of His purpose for men in Christ Jesus, chosen from the beginning to a holy life in love, predestined to adoption as sons through Jesus Christ, in whom as the Beloved He has given us grace (<a onClick="return mV(\'Eph\',1,\'3-6\');">1:3-6</a>). Redeemed by the blood of Christ by whom we have forgiveness of sins through His grace abounding in us and making us know the mystery of His purpose, namely, to unite all in one, even the entire universe (<a onClick="return mV(\'Eph\',1,\'7-10\');">1:7-10</a>).<P><a onClick="return mV(\'Eph\',1,\'11-14\');">Ephesians 1:11-14</a>: For this Israel has served as a preparation, and to this the Gentiles are come, sealed unto salvation by the Holy Spirit of power.<P><a onClick="return mV(\'Eph\',1,15,16);">Ephesians 1:15-16</a> a: Thanksgiving for their faith.<P><a onClick="return mV(\'Eph\',1,\'16-21\');">Ephesians 1:16-21</a>: Prayer that they may, by the spirit of wisdom and revelation, know their destiny and the power of God to fulfill it.<P><a onClick="return mV(\'Eph\',1,\'22-\');">Ephesians 1:22</a> - <a onClick="return mV(\'Eph\',1,\'1-10\');">2:10</a>: Summary of what God has done in Christ. Christ\'s sovereignty (<a onClick="return mV(\'Eph\',1,\'22-23\');">1:22-23</a>), and headship in the church (<a onClick="return mV(\'Eph\',1,\'22-23\');">1:22-23</a>); His work for men, quickening us from a death of sin into which man has sunk, and exalting us to fellowship with Christ by His grace, who has created us for good works as part of His eternal purpose (<a onClick="return mV(\'Eph\',2,\'1-10\');">2:1-10</a>).<P><a onClick="return mV(\'Eph\',2,\'11-13\');">Ephesians 2:11-13</a>: The contrast between the former estate of the Gentiles, as strangers and aliens, and their present one, "near" by the blood of Christ.<P><a onClick="return mV(\'Eph\',2,\'14-18\');">Ephesians 2:14-18</a>: Christ, who is our peace, uniting Jew and Gentile and reconciling man to God through the cross; by whom we all have access to the Father.<P><a onClick="return mV(\'Eph\',2,\'19-22\');">Ephesians 2:19-22</a>: This is theirs who as fellow-citizens of the saints, built up on the foundation of the apostles and prophets, become a sanctuary of God in the Spirit.<P><a onClick="return mV(\'Eph\',3,\'1-21\');">Ephesians 3:1-21</a>: A digression on the "mystery," i.e. the revelation to Paul, together with a prayer that men may grasp it. The "mystery" is that all men, Jews and Gentiles, are partakers of the promise. Of this Paul is a minister, to whom has been given the stewardship of that mystery, unfolding to all creatures God\'s wisdom, in accord with His eternal purpose (<a onClick="return mV(\'Eph\',3,\'1-13\');">3:1-13</a>). Prayer that they may live up to their opportunities (<a onClick="return mV(\'Eph\',3,\'14-19\');">3:14-19</a>). Doxology (<a onClick="return mV(\'Eph\',3,\'20-21\');">3:20-21</a>).<P><a onClick="return mV(\'Eph\',4,\'1-6\');">Ephesians 4:1-6</a>: The outcome of this privilege, the fulfillment of the Divine purpose, must show itself in unity of life in the Christian fellowship.<P><a onClick="return mV(\'Eph\',4,\'7-16\');">Ephesians 4:7-16</a>: The different gifts which the Christians have are for the upbuilding of the church into that perfect unity which is found in Christ.<P><a onClick="return mV(\'Eph\',4,\'17-24\');">Ephesians 4:17-24</a>: The spiritual darkness and corruption of the old Gentile life set over against the enlightenment and purity and holiness of the new life in Christ.<P><a onClick="return mV(\'Eph\',4,25);">Ephesians 4:25-6:9</a>: Special features of the Christian life, arising out of the union of Christians with Christ and making for the fellowship in the church. On the side of the individual: sins in word (<a onClick="return mV(\'Eph\',4,\'25-30\');">4:25-30</a>); of temper (<a onClick="return mV(\'Eph\',4,\'31-32\');">4:31-32</a>); self-sacrifice as opposed to self-indulgence (<a onClick="return mV(\'Eph\',5,\'1-8\');">5:1-8</a>); the contrast of the present and the past repeated (<a onClick="return mV(\'Eph\',5,\'9-14\');">5:9-14</A>); general behavior (<a onClick="return mV(\'Eph\',5,\'15-20\');">5:15-20</a>); on the side of social relations: husband and wife exemplified in the relation of Christ and the church (<a onClick="return mV(\'Eph\',5,\'23-33\');">5:23-33</a>); children and parents (<a onClick="return mV(\'Eph\',6,\'1-4\');">6:1-4</a>); servants and masters (<a onClick="return mV(\'Eph\',6,\'5-9\');">6:5-9</A>).<P><a onClick="return mV(\'Eph\',6,\'19-20\');">Ephesians 6:19-20</a>: The Christian warfare, its foes and armor and weapons.<P><a onClick="return mV(\'Eph\',6,\'21-24\');">Ephesians 6:21-24</a>: Conclusion.<P>VII. Teaching<P>The keynote to the doctrinal basis of the epistle is struck at the very outset. The hymn of praise centers in the thought of God, the Father of our Lord Jesus Christ. It is to Him that the blessing is due, to Him, who had chosen us from the beginning, in whom there is redemption in Eph (<a onClick="return mV(\'Eph\',1,\'3-7\');">1:3-7</a>). God as the very heart and soul of everything, "is over all, and through all, and in all" (<a onClick="return mV(\'Eph\',4,6);">4:6</a>). He is the Father from whom all revelation comes (<a onClick="return mV(\'Eph\',1,17);">1:17</a>), and from whom every human family derives its distinctive characteristics (<a onClick="return mV(\'Eph\',3,15);">3:15</a>). But He is not only Father in relation to the universe: He is in a peculiar sense the Father of our Lord Jesus Christ (<a onClick="return mV(\'Eph\',1,3);">1:3</a>). The eternity of our Lord is distinctly asserted (<a onClick="return mV(\'Eph\',1,4,5);">1:4-5</a>) as of one existing before the foundation of the world, in whom everything heavenly as well as earthly is united, summed up (<a onClick="return mV(\'Eph\',1,10);">1:10</A>; compare <a onClick="return mV(\'Eph\',2,12);">2:12</a>; <a onClick="return mV(\'Eph\',4,18);">4:18</a>). He is the Messiah (the Beloved (<a onClick="return mV(\'Eph\',1,6);">1:6</a>) is clearly a Messianic term, as the voice from heaven at Christ\'s baptism, "This is my beloved Son, in whom I am well pleased," shows (<a onClick="return mV(\'Mat\',3,17);">Mt 3:17</a>)). In Him we are quickened (<a onClick="return mV(\'Eph\',2,5);">2:5</a>). He is made flesh (<a onClick="return mV(\'Eph\',2,15);">2:15</a>). He died on the cross (<a onClick="return mV(\'Eph\',2,16);">2:16</a>), and by His blood (<a onClick="return mV(\'Eph\',1,7);">1:7</a>) we have redemption (<a onClick="return mV(\'Eph\',4,30);">4:30</a>), and reconciliation with God (<a onClick="return mV(\'Eph\',2,16);">2:16</a>). He whom God raised from the dead (<a onClick="return mV(\'Eph\',1,20);">1:20</a>), now is in heaven (<a onClick="return mV(\'Eph\',1,20);">1:20</A>; <a onClick="return mV(\'Eph\',4,8);">4:8</a>) from which place He comes (<a onClick="return mV(\'Eph\',4,8);">4:8</a>), bringing gifts to men. (This interpretation makes the descent follow the ascent, and the passage teaches the return of Christ through His gifts of the Spirit which He gave to the church.)<P>He who is in heaven fills all things (<a onClick="return mV(\'Eph\',4,10);">4:10</a>); and, from a wealth which is unsearchable (<a onClick="return mV(\'Eph\',3,8);">3:8</a>), as the Head of the church (<a onClick="return mV(\'Eph\',1,22);">1:22</a>), pours out His grace to free us from the power of sin (<a onClick="return mV(\'Eph\',2,1);">2:1</a>). To this end He endues us with His Spirit (<a onClick="return mV(\'Eph\',3,16);">3:16</a>). This teaching about God, Father, Son and Holy Spirit, is no abstract theorizing. It is all intensely practical, having at its heart the purpose of God from the ages, which, as we saw above, is to restore again the unity of all things in Him (<a onClick="return mV(\'Eph\',1,9,10);">1:9-10</a>); to heal the breach between man and God (<a onClick="return mV(\'Eph\',2,16,17);">2:16-17</a>); to break down the separation between Jew and Gentile, and to abolish the enmity not only between them, but between them and God. This purpose of God is to be accomplished in a visible society, the one church, built upon the foundation of the apostles and prophets (<a onClick="return mV(\'Eph\',2,20);">2:20</a>), of which Jesus Christ is the head of the corner, into which men are to be admitted by holy baptism, where they own one Lord, hold to one faith, in one God and Father of all who is above all and through all (<a onClick="return mV(\'Eph\',4,\'4-7\');">4:4-7</a>).<P>The teaching as to the church is one of the most striking elements of the epistle. In the first place we have the absolute use of the term, which has been already discussed. The apostle sees the whole Christian community throughout the world bound together into a unity, one fellowship, one body. He has risen to a higher vision than man had ever had before. But there is a further teaching in the epistle. Not only is the church throughout the world one body, but it is the body of Christ who is its Head (<a onClick="return mV(\'Eph\',1,21);">Eph 1:21</a>f). He has, as Lightfoot suggests, the same relation to the church which in <a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a> He has to the universe. He is its Head, "the inspiring, ruling, guiding, combining, sustaining power, the mainspring of its activity, the center of its unity, and the seat of its life." But the relation is still closer. If, as the evidence adduced would necessitate, one accepts J. Armitage Robinson\'s explanation of pleroma, as that without which a thing is incomplete (Ephesians, 255f), then the church, in some wonderful mystery, is the complement of Christ, apart from which He Himself, as the Christ, lacks fullness. We are needed by Him, that so He may become all in all. He, the Head of restored humanity, the Second Adam, needs His church, to fulfill the unity which He came upon earth to accomplish (compare Stone, Christian Church, 85, 86). Still further, we find in this epistle the two figures of the church as the Temple of the Spirit (<a onClick="return mV(\'Eph\',2,21);">2:21</a>ff; and the Bride of Christ (<a onClick="return mV(\'Eph\',5,23);">5:23</a>ff)). Under the latter figure we find the marriage relation of the Lord to Israel, which runs through the Old Testament (<a onClick="return mV(\'Hsa\',2,16);">Hos 2:16</a>, et al.), applied to the union between Christ and the church. The significance is the close tie that binds them, the self-sacrificing love of Christ and the self-surrender of obedience on the part of the church; and the object of this is that so the church may be free from any blemish, holy and spotless. In the figure of the Temple, which is an expansion of the earlier figure in <a onClick="return mV(\'1Cr\',3,16);">1Co 3:16</a>; <a onClick="return mV(\'2Cr\',6,16);">2Co 6:16</a>, we see the thought of a spiritual building, a sanctuary, into which all the diverse elements of the churches grow into a compact unity.<P>These figures sum up the apostle\'s thought of that in which the Divine purpose finds its fulfillment. The progress forward to that fulfillment is due to the combined effort of God and man. "The church, the society of Christian men...is built and yet it grows. Human endeavor and Divine energy cooperate in its development" (Westcott). Out of this doctrinal development the apostle works out the practical life by which this Divine purpose can find its fulfillment. Admitted into the fellowship of the church by baptism, we become members one of another Eph (<a onClick="return mV(\'Eph\',4,25);">4:25</a>). It is on this basis that he urges honesty and patience and truth in our intercourse with each other, and pleads for gentleness and a forgiving spirit (<a onClick="return mV(\'Eph\',4,\'25-32\');">4:25-32</a>). As followers of God we are to keep free from the sins that spring from pride and self-indulgence and any fellowship with the spirit of evil (<a onClick="return mV(\'Eph\',5,14);">5:1-14</a>). Our life is to be lived as seeking the fulfillment of God\'s purpose in all the relationships of life (<a onClick="return mV(\'Eph\',5,\'15-\');">5:15</a> - <a onClick="return mV(\'Eph\',6,\'1-9\');">6:9</a>). All is to be done with the full armor of the Christian soldier, as is fitting for those who fight spiritual enemies (<a onClick="return mV(\'Eph\',6,10);">6:10</a>ff). The epistle is preeminently practical, bringing the significance of the great revelation of God\'s will to the everyday duties of life, and lifting all things up to a higher level which finds its ideal in the indwelling of Christ in our hearts, out of which we may be filled with all the fullness of God (<a onClick="return mV(\'Eph\',3,\'17-19\');">3:17-19</a>).<P>VIII. LITERATURE. J. Armitage Robinson, Paul\'s Epistle to the Ephesians; Westcott, Epistle to the Ephesains; Abbott, "Ephesians and Colossians," International Critical Commentary; Moule, "Ephesians," Cambridge Bible; Salmond, "Ephesians," Expositor\'s Greek Testament; Macpherson, Commentary on Ephesians; Findlay, "Epistle to the Ephesians," Expositor\'s Bible; Alexander, "Colossians and Ephesians," Bible for Home and School; Haupt, Meyer\'s Exeget. und krit. Kommentar; von Soden, Handcommentar; Hort, Prolegomena to the Epistles to the Romans and Ephesians; Dale, Lectures on the Ephesians.``101';
isbe[3139]='Ephesus`ef\'-e-sus (Ephesos, "desirable"):<P>A city of the Roman province of Asia, near the mouth of the Cayster river, 3 miles from the western coast of Asia Minor, and opposite the island of Samos. With an artificial harbor accessible to the largest ships, and rivaling the harbor at Miletus, standing at the entrance of the valley which reaches far into the interior of Asia Minor, and connected by highways with the chief cities of the province, Ephesus was the most easily accessible city in Asia, both by land and sea. Its location, therefore, favored its religious, political and commercial development, and presented a most advantageous field for the missionary labors of Paul. The city stood upon the sloping sides and at the base of two hills, Prion and Coressus, commanding a beautiful view; its climate was exceptionally fine, and the soil of the valley was unusually fertile.<P>Tradition says that in early times near the place where the mother goddess of the earth was born, the Amazons built a city and a temple in which they might worship. This little city of the Amazons, bearing at different times the names of Samorna, Trachea, Ortygia and Ptelea, flourished until in the early Greek days it aroused the cupidity of Androclus, a prince of Athens. He captured it and made it a Greek city. Still another tradition says that Androclus was its founder. However, under Greek rule the Greek civilization gradually supplanted that of the Orientals, the Greek language was spoken in place of the Asiatic; and the Asiatic goddess of the temple assumed more or less the character of the Greek Artemis. Ephesus, therefore, and all that pertained to it, was a mixture of oriental and Greek Though the early history of the city is obscure, it seems that at different times it was in the hands of the Carians, the Leleges and Ionians; in the early historical period it was one of a league of twelve Ionfan cities. In 560 BC it came into the possession of the Lydians; 3 years later, in 557, it was taken by the Persians; and during the following years the Greeks and Persians were constantly disputing for its possession. Finally, Alexander the Great took it; and at his death it fell to Lysimachus, who gave it the name of Arsinoe, from his second wife. Upon the death of Attalus II (Philadelphus), king of Pergamos, it was bequeathed to the Roman Empire; and in 190, when the Roman province of Asia was formed, it became a part of it. Ephesus and Pergamos, the capital of Asia, were the two great rival cities of the province. Though Pergamos was the center of the Roman religion and of the government, Ephesus was the more accessible, the commercial center and the home of the native goddess Diana; and because of its wealth and situation it gradually became the chief city of the province. It is to the temple of Diana, however, that its great wealth and prominence are largely due. Like the city, it dates from the time of the Amazons, yet what the early temple was like we now have no means of knowing, and of its history we know little except that it was seven times destroyed by fire and rebuilt, each time on a scale larger and grander than before. The wealthy king Croesus supplied it with many of its stone columns, and the pilgrims from all the oriental world brought it of their wealth. In time the temple possessed valuable lands; it controlled the fisheries; its priests were the bankers of its enormous revenues. Because of its strength the people stored there their money for safe-keeping; and it became to the ancient world practically all that the Bank of England is to the modern world.<P>In 356 BC, on the very night when Alexander the Great was born, it was burned; and when he grew to manhood he offered to rebuild it at his own expense if his name might be inscribed upon its portals. This the priests of Ephesus were unwilling to permit, and they politely rejected his offer by saying that it was not fitting for one god to build a temple to another. The wealthy Ephesians themselves undertook its reconstruction, and 220 years passed before its final completion. Not only was the temple of Diana a place of worship, and a treasure-house, but it was also a museum in which the best statuary and most beautiful paintings were preserved. Among the paintings was one by the famous Apelles, a native of Ephesus, representing Alexander the Great hurling a thunderbolt. It was also a sanctuary for the criminal, a kind of city of refuge, for none might be arrested for any crime whatever when within a bowshot of its walls. There sprang up, therefore, about the temple a village in which the thieves and murderers and other criminals made their homes. Not only did the temple bring vast numbers of pilgrims to the city, as does the Kaaba at Mecca at the present time, but it employed hosts of people apart from the priests and priestesses; among them were the large number of artisans who manufactured images of the goddess Diana, or shrines to sell to the visiting strangers.<P>Such was Ephesus when Paul on his 2nd missionary journey in Acts (<a onClick="return mV(\'Act\',18,\'19-21\');">18:19-21</a>) first visited the city, and when, on his 3rd journey (<a onClick="return mV(\'Act\',19,\'8-10\');">19:8-10</a>; <a onClick="return mV(\'Act\',20,31);">20:31</a>), he remained there for two years preaching in the synagogue (<a onClick="return mV(\'Act\',19,8,10);">19:8,10</a>), in the school of Tyrannus (<a onClick="return mV(\'Act\',19,9);">19:9</A>) and in private houses (<a onClick="return mV(\'Act\',20,20);">20:20</a>). Though Paul was probably not the first to bring Christianity to Ephesus, for Jews had long lived there (<a onClick="return mV(\'Act\',2,9);">2:9</a>; <a onClick="return mV(\'Act\',6,9);">6:9</a>), he was the first to make progress against the worship of Diana. As the fame of his teachings was carried by the pilgrims to their distant homes, his influence extended to every part of Asia Minor. In time the pilgrims, with decreasing faith in Diana, came in fewer numbers; the sales of the shrines of the goddess fell off; Diana of the Ephesians was no longer great; a Christian church was rounded there and flourished, and one of its first leaders was the apostle John. Finally in 262 AD, when the temple of Diana was again burned, its influence had so far departed that it was never again rebuilt. Diana was dead. Ephesus became a Christian city, and in 341 AD a council of the Christian church was held there. The city itself soon lost its importance and decreased in population. The sculptured stones of its great buildings, which were no longer in use and were falling to ruins, were carried away to Italy, and especially to Constantinople for the great church of Saint Sophia. In 1308 the Turks took possession of the little that remained of the city, and deported or murdered its inhabitants. The Cayster river, overflowing its banks, gradually covered with its muddy deposit the spot where the temple of Diana had once stood, and at last its very site was forgotten.<P>The small village of Ayasaluk, 36 miles from Smyrna on the Aidin R. R., does not mark the site of the ancient city of Ephesus, yet it stands nearest to its ruins. The name Ayasaluk is the corruption of three Greek words meaning "the Holy Word of God." Passing beyond the village one comes to the ruins of the old aqueduct, the fallen city walls, the so-called church of John or the baths, the Turkish fort which is sometimes called Paul\'s prison, the huge theater which was the scene of the riot of Paul\'s time, but which now, with its marble torn away, presents but a hole in the side of the hill Prion. In 1863 Mr. J. T. Wood, for the British Museum, obtained permission from the Turkish government to search for the site of the lost temple of Diana. During the eleven years of his excavations at Ephesus, $80,000 were spent, and few cities of antiquity have been more thoroughly explored. The city wall of Lysimachus was found to be 36,000 ft. in length, enclosing an area of 1,027 acres. It was 10 1/2 ft. thick, and strengthened by towers at intervals of 100 ft. The six gates which pierced the wall are now marked by mounds of rubbish. The sites and dimensions of the various public buildings, the streets, the harbor, and the foundations of many of the private houses were ascertained, and numerous inscriptions and sculptures and coins were discovered. Search, however, did not reveal the site of the temple until January 1,1870, after six years of faithful work. Almost by accident it was then found in the valley outside the city walls, several feet below the present surface. Its foundation, which alone remained, enabled Mr. Wood to reconstruct the entire temple plan. The temple was built upon a foundation which was reached by a flight of ten steps. The building itself was 425 ft. long and 220 ft. wide; each of its 127 pillars which supported the roof of its colonnade was 60 ft. high; like the temples of Greece, its interior was open to the sky. For a further description of the temple, see Mr. Wood\'s excellent book, Discoveries at Ephesus.``7';
isbe[3140]='Ephlal`ef\'-lal (\'ephlal, "judgment"):<P>A descendant of Judah (<a onClick="return mV(\'1Ch\',2,37);">1Ch 2:37</a>).``1';
isbe[3141]='Ephod (1)`ef\'-od (\'ephowdh (28 times), \'ephodh (20 times), \'ephodh; Septuagint epomis, ephoth, ephod, ephoud, stole exallos, stole bussine):<P>(1) A sacred vestment originally designed for the high priest (<a onClick="return mV(\'Exd\',28,4);">Ex 28:4</a>ff; <a onClick="return mV(\'Exd\',39,2);">39:2</a>ff), and made "of gold, blue, and purple, and scarlet, and fine twined linen," held together by two shoulder-pieces and a skillfully woven band which served as a girdle for the ephod. On the shoulderpieces were two onyx stones on which were engraved the names of the twelve tribes of Israel. It is not known whether the ephod extended below the hips or only to the waist. Attached to the ephod by chains of pure gold was a breastplate containing twelve precious stones in four rows. Underneath the ephod was the blue robe of the ephod extending to the feet of the priest. The robe of the ephod was thus a garment comprising, in addition to the long robe proper, the ephod with its shoulderpieces and the breastplate of judgment.<P>(2) From the historical books we learn that ephods were worn by persons other than the high priest. Thus, the boy Samuel was girded with a linen ephod while assisting the aged high priest (<a onClick="return mV(\'1Sa\',2,18);">1Sa 2:18</a>); the priests at Nob, 85 in number, are described as men wearing a linen ephod (<a onClick="return mV(\'1Sa\',22,18);">1Sa 22:18</a>); and David was girded with a linen ephod when he danced in the procession that brought the ark into Jerusalem (<a onClick="return mV(\'2Sa\',6,14);">2Sa 6:14</a>). The ephod was considered appropriate for the king on this solemn and happy occasion; but it would be reading into the narrative more than it contains to infer that lay worshippers were regularly clothed with the ephod; nor are we to suppose that priests other than the high priest were accustomed to wear ephods as rich and elaborate as that of the high priest. Abiathar, who became high priest after the assassination of his father by Doeg, probably brought to the camp of David the ephod worn by the high priest in his ministrations at Nob (<a onClick="return mV(\'1Sa\',23,6);">1Sa 23:6</a>), and through this ephod David sought in certain crises to learn Yahweh\'s will (<a onClick="return mV(\'1Sa\',23,9);">1Sa 23:9</a>; <a onClick="return mV(\'1Sa\',30,7);">30:7</a>). Some have argued that the ephod, which Abiathar brought in his hand, was an image rather than a priestly garment, but there seems no sufficient reason for regarding it as other than a vestment for the high priest. The ephod behind which the sword of Goliath was kept wrapped in a cloth may well have been a garment suspended from the wall or itself wrapped in a protecting cloth (<a onClick="return mV(\'1Sa\',21,9);">1Sa 21:9</a>).<P>(3) The ephod mentioned in <a onClick="return mV(\'Jdg\',17,5);">Jud 17:5</a>; <a onClick="return mV(\'Jdg\',18,14);">18:14</a>f; <a onClick="return mV(\'Hsa\',3,4);">Ho 3:4</a> is associated with teraphim and other idolatrous images. We may frankly confess that we do not know the shape, size and use of the ephod in these cases, though even here also the ephod may well have been a priestly garment. The same remark holds good of the ephod made by Gideon, and which became an object of idolatrous worship in Israel (<a onClick="return mV(\'Jdg\',8,27);">Jud 8:27</a>). It has been argued that a vestment would not cost seventeen hundred shekels of gold. Possibly Gideon set up an apparatus of worship containing other articles just as the mother of Micah began with the promise to make a graven image and a molten image, and afterward added an ephod and teraphim (<a onClick="return mV(\'Jdg\',17,\'1-5\');">Jud 17:1-5</a>). Moreover, if gems and brilliants were put on Gidcon\'s ephod, who can say that it did not cost seventeen hundred shekels?<p>LITERATURE.<P>Braun, De vestitu sacerdotum (1698), 462ff; Ugolini, Thesaurus antiquitatum sacrarum (1744-69), XII, 785f; Ancessi, Annales de philos. chretienne, 1872; Konig, Rel. Hist. of Israel, 107ff; Van Hoonackcr, Le sacerdoce levitique (1899), 370ff; Foote, The Ephod, in "Johns Hopkins University Circulars," 1900.``156';
isbe[3142]='Ephod (2)`e\'-fod (\'ephodh):<P>Father of Hanniel, prince of Manasseh (<a onClick="return mV(\'Num\',34,23);">Nu 34:23</a>).``1';
isbe[3143]='Ephphatha`ef\'-a-tha, ef-a\'-tha (Ephphatha):<P>Aramaic word used by Christ (<a onClick="return mV(\'Mar\',7,34);">Mr 7:34</a>), the \'ethpa\'al imperative of Aramaic pethach (Hebrew pathach), translated, "Be (thou) opened"; compare <a onClick="return mV(\'Isa\',35,5);">Isa 35:5</a>. The Aramaic was the sole popular language of Palestine (Shurer, History of the Jewish People in the Time of Jesus Christ, IIg, 9) and its use shows that we have here the graphic report of an eyewitness, upon whom the dialectic form employed made a deep impression. This and the corresponding act of the touch with the moistened finger is the foundation of a corresponding ceremony in the Roman Catholic formula for baptism.``1';
isbe[3144]='Ephraim (1)`e\'-fra-im, e\'-fra-im (\'ephrayim, "double fruit"):<P>1. The Patriarch:<P>The younger of the two sons of Joseph and Asenath, born in Egypt. He and his brother Manasseh were adopted by Jacob, and ranked as his own sons, each becoming the ancestor of a tribe in Israel. In blessing his grandchildren, despite their father\'s protest, Jacob preferred the younger, foreshadowing the future eminence of his descendants (<a onClick="return mV(\'Gen\',41,50);">Ge 41:50</a>ff; <a onClick="return mV(\'Gen\',48,20);">48:20</a>ff). In the Blessing of Jacob however, the two are included under the name of Joseph (<a onClick="return mV(\'Gen\',49,22);">Ge 49:22</a>f).<P>2. The Tribe:<P>At the first census on leaving Egypt, Ephraim\'s men of war numbered 40,500; and at the second census they are given as 32,500 (<a onClick="return mV(\'Num\',1,33);">Nu 1:33</a>; <a onClick="return mV(\'Num\',26,37);">26:37</a>). See, however, article <a href="./study/isbe/search.html?string=NUMBERS">NUMBERS</A>. The head of the tribe at the Exodus was Elishama, son of Ammihud (<a onClick="return mV(\'Num\',1,10);">Nu 1:10</a>). With the standard of the tribe of Ephraim on the west of the tabernacle in the desert march were Manasseh and Benjamin (<a onClick="return mV(\'Num\',2,18);">Nu 2:18</a>ff). The Ephraimite among the spies was Hoshea (i.e. Joshua), the son of Nun (<a onClick="return mV(\'Num\',13,8);">Nu 13:8</a>). At the division of the land Ephraim was represented by prince Kemuel, son of Shiphtan (<a onClick="return mV(\'Num\',34,24);">Nu 34:24</a>). The future power of this tribe is again foreshadowed in the Blessing of Moses (<a onClick="return mV(\'Deu\',33,17);">De 33:17</a>). When Moses died, a member of the tribe, Joshua, whose faith and courage had distinguished him among the spies, succeeded to the chief place in Israel. It was natural that the scene of national assemblies, and the center of the nation\'s worship, should be chosen within the land occupied by the children of Joseph, at Shechem and Shiloh respectively. The leadership of Ephraim was further emphasized by the rule of Samuel. From the beginning of life in Palestine they enjoyed a certain prestige, and were very sensitive on the point of honor (<a onClick="return mV(\'Jdg\',7,24);">Jud 7:24</a>; <a onClick="return mV(\'Jdg\',8,1);">8:1</a>; <a onClick="return mV(\'Jdg\',12,1);">12:1</a>ff). Their acceptance of and loyalty to Saul, the first king chosen over Israel, may be explained by his belonging to a Rachel tribe, and by the close and tender relations existing between Joseph and Benjamin. But they were never reconciled to the passing of the scepter to Judah in the person of David (<a onClick="return mV(\'2Sa\',2,8);">2Sa 2:8</a>f). That Israel would have submitted to the sovereignty of Absalom, any more than to that of David, is not to be believed; but his revolt furnished an opportunity to deal a shrewd blow at the power of the southern tribe (<a onClick="return mV(\'2Sa\',15,13);">2Sa 15:13</a>). Solomon\'s lack of wisdom and the crass folly of Rehoboam in the management of the northern tribes fanned the smoldering discontent into a fierce flame. This made easy the work of the rebel Jeroboam; and from the day of the disruption till the fall of the Northern Kingdom there was none to dispute the supremacy of Ephraim, the names Ephraim and Israel being synonymous. The most distinguished of Ephraim\'s sons were Joshua, Samuel and Jeroboam I.<P>3. The Territory:<P>The central part of Western Palestine fell to the children of Joseph; and, while the boundaries of the territory allotted to Ephraim and Manasseh respectively are given in <a onClick="return mV(\'Jos\',16,\'1-\');">Jos 16</a>; <a onClick="return mV(\'Jos\',17,1);">17:1</a>ff, it seems to have been held by them in common for some time (<a onClick="return mV(\'Jos\',17,114;">17:14</A>). The Canaanites in certain cities of both divisions were not driven out. It was probably thought more profitable to enslave them (<a onClick="return mV(\'Jos\',16,10);">16:10</a>; <a onClick="return mV(\'Jos\',17,13);">17:13</A>). The boundaries of Ephraim cannot be followed with accuracy, but roughly, they were as follows: The southern boundary, agreeing with the northern border of Benjamin, started from Bethel, and passed down westward by nether Beth-horon and Gezer toward the sea (<a onClick="return mV(\'Jos\',16,3);">16:3</a>; in verse <a onClick="return mV(\'Jos\',16,5);">5</a> it stops at upper Beth-horon); it turned northward to the southern bank of the brook Kanah (Wady Kanah) along which it ran eastward (<a onClick="return mV(\'Jos\',17,10);">17:10</a>) to Michmethath (the plain of Mukhneh); thence it went northward along the western edge of the plain to Shechem. It then bent eastward and southward past Taanath-shiloh (Ta\'ana), Janoah (Yankun) to Ataroth and Naarah (unidentified) and the Jordan (<a onClick="return mV(\'Jos\',16,7);">16:7</a>). From Ataroth, which probably corresponds to Ataroth-addar (<a onClick="return mV(\'Jos\',16,5);">16:5</a>), possibly identical with the modern et-Truneh, the southern border passed up to Bethel. Along the eastern front of the land thus defined there is a steep descent into the Jordan valley. It is torn by many gorges, and is rocky and unfruitful. The long slopes to the westward, however, furnish much of the finest land in Palestine. Well watered as it is, the valleys are beautiful in season with cornfields, vineyards, olives and other fruit trees. The uplands are accessible at many points from the maritime plain; but the great avenue of entrance to the country runs up Wady esh-Sha\'ir to Nablus, whence, threading the pass between Gerizim and Ebal, it descends to the Jordan valley. In this favored region the people must have lived in the main a prosperous and happy life. How appropriate are the prophetic allusions to these conditions in the days of Ephraim\'s moral decay (<a onClick="return mV(\'Isa\',28,1,4);">Isa 28:1-4</a>; <a onClick="return mV(\'Jer\',31,18);">Jer 31:18</a>; <a onClick="return mV(\'Hsa\',9,13);">Ho 9:13</a>; <a onClick="return mV(\'Hsa\',10,11);">10:11</a>, etc.)!``54';
isbe[3145]='Ephraim (2)`(1) A position apparently of some importance, since the position of Baal-hazor (probably = Tell \'Asur) where Abraham\'s sheep-farm was located, is determined by relation to it (<a onClick="return mV(\'2Sa\',13,23);">2Sa 13:23</a>). That it lay north of Jerusalem seems to be indicated in <a onClick="return mV(\'2Sa\',13,34);">2Sa 13:34</a>. It may be identical with the Ephraim of Eusebius, Onomasticon, 20 Roman miles north of Jerusalem, and therefore to be sought somewhere in the neighborhood of Sinjil and el- Lubban. Connected with this may have been the name Aphaerema, a district in Samaria mentioned in 1Macc 11:34; Ant, XIII, iv, 9.<P>(2) The town near the wilderness to which Jesus retired after the raising of Lazarus (<a onClick="return mV(\'Jhn\',11,54);">Joh 11:54</a>). This probably corresponds to Ephrem of Eusebius, Onomasticon (s .v. "Afra") 5 Roman miles east of Bethel. This may be the place named along with Bethel by Josephus (BJ, IV, ix, 9). It probably answers to eT-Taiyebeh, a large village about 4 miles north of Beitin. The antiquity of the site is attested by the cisterns and rock tombs. It stands on a high hill with a wide outlook including the plains of Jericho and the Dead Sea.`<a href="./study/isbe/search.html?string=EPHRON">EPHRON</a>`54';
isbe[3146]='Ephraim, Forest of`(ya\'ar \'ephrayim):<P>The word ya\'ar (Hebrew) probably agrees in meaning with the Arabic wa\'r, which indicates a rough country, abounding in rocks, stones and scrub, with occasional trees; not a "forest," as we understand the term. Here Absalom was defeated and slain (<a onClick="return mV(\'2Sa\',18,6);">2Sa 18:6</a>ff, the King James Version "wood of Ephraim"). It must be sought, therefore, east of the Jordan, in the neighborhood of Mahanaim; but no identification is yet possible.``1';
isbe[3147]='Ephraim, Gate of``<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
isbe[3148]='Ephraim, Mount`(har \'ephrayim):<P>Means that part of the mountain which fell to Ephraim (<a onClick="return mV(\'Jos\',19,50);">Jos 19:50</a>, etc.). The natives speak today of Jebel Nablus, Jebel Cafed, etc., meaning that section of the central range which is subject to each city. It is better therefore to retain the rendering of the King James Version, and not to read with the Revised Version (British and American) "hill-country of Ephraim."``1';
isbe[3149]='Ephraim, Wood of``<a href="./study/isbe/search.html?string=EPHRAIM,+forest+of">EPHRAIM, FOREST OF</a>`1';
isbe[3150]='Ephraimite`e\'-fra-im-it (\'ephrayim; singular \'ephrathi):<P>A member of the tribe of Ephraim (<a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>, etc.).`<a href="./study/isbe/search.html?string=EPHRATHITE">EPHRATHITE</a>`1';
isbe[3151]='Ephrain`e\'-fra-in (<a onClick="return mV(\'2Ch\',13,19);">2Ch 13:19</a>), the Revised Version (British and American) <a href="./study/isbe/search.html?string=EPHRON">EPHRON</a>, which see.``1';
isbe[3152]='Ephrath; Ephrathah`ef\'-rath, e\'-frath, ef\'-ra-tha, ef-ra\'-tha (\'ephrath; Ephratha; <a onClick="return mV(\'Gen\',35,16);">Ge 35:16</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a>); (\'ephrathah, in the other references: <a onClick="return mV(\'Jos\',15,59);">Jos 15:59</a> (in added verse of Septuagint only); <a onClick="return mV(\'Rth\',4,11);">Ru 4:11</a>; <a onClick="return mV(\'1Ch\',2,19,24,50);">1Ch 2:19, 24, 50</a>; <a onClick="return mV(\'Psa\',132,6);">Ps 132:6</a>; <a onClick="return mV(\'Mic\',5,2);">Mic 5:2</a>, the King James Version "Ephratah"):<P>The name either of Bethlehem itself or of a district in which Bethlehem was situated. A man of this place was called an Ephrathite (<a onClick="return mV(\'Rth\',1,2);">Ru 1:2</a>; <a onClick="return mV(\'1Sa\',17,12);">1Sa 17:12</a>). It is held by many authorities that the Ephrath where Rachel was buried (<a onClick="return mV(\'Gen\',35,16);">Ge 35:16</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a>) was a different place, the words "the same is Bethlehem" being a gloss. The reading in <a onClick="return mV(\'Psa\',132,6);">Ps 132:6</a> is doubtful; the Revised Version, margin has "Ephraim."``117';
isbe[3153]='Ephrathite`ef\'-rath-it, e\'-frath-it.`<a href="./study/isbe/search.html?string=EPHRATH">EPHRATH</a>`1';
isbe[3154]='Ephron (1)`e\'-fron (\'ephron, "fawnlike"):<P>The Hittite of whom Abraham bought the field and cave of Machpelah (<a onClick="return mV(\'Gen\',23,8);">Ge 23:8</a>ff; <a onClick="return mV(\'Gen\',25,9);">25:9</a>; <a onClick="return mV(\'Gen\',49,30);">49:30</a>). The transaction was conducted in true oriental fashion, with excessive courtesy; but the large sum of 400 shekels\' weight of silver was in the end required (compare <a onClick="return mV(\'Gen\',33,19);">33:19</a>; <a onClick="return mV(\'1Ki\',16,24);">1Ki 16:24</a>).`<a href="./study/isbe/search.html?string=MONEY">MONEY</a>; <a href="./study/isbe/search.html??string=MONEY,+current">MONEY, CURRENT</a>`1';
isbe[3155]='Ephron (2)`e\'-fron (\'ephron; Ephron):<P>(1) <a onClick="return mV(\'2Ch\',13,19);">2Ch 13:19</a>: "And Abijah pursued after Jeroboam, and took cities from him, Beth-el with the towns thereof, and Jeshanah with the towns thereof, and Ephron with the towns thereof." Another reading is "Ephraim" (Revised Version, margin). This is thought by many to be identical with Ophrah (\'ophrah, <a onClick="return mV(\'Jos\',18,23);">Jos 18:23</a>) and perhaps with Ephraim (\'ephrayim, <a onClick="return mV(\'2Sa\',13,23);">2Sa 13:23</a>) which both have been localized at the lofty town of et Taiyibeh.<P>(2) A city east of the Jordan between Carnion (Ashteroth-karnain) and Scythopolis (Beisan): "Then Judas gathered together all the Israelites that were in the country....Now when they came unto Ephron (this was a great city in the way as they should go, very well fortified) they could not turn from it either on the right hand or on the left, but they must needs pass through the midst of it" (1Macc 5:45,46 the King James Version; Ant, XII, viii, 5; also 2Macc 12:27). Buhl and Schumacher propose Kacr Wady el Ghafr, a ruined tower which completely commands the deep Wady el Ghafr, but the ruins appear to be scanty.<P>(3) Mt. Ephron: The border of Judah is described (<a onClick="return mV(\'Jos\',15,9);">Jos 15:9</a>): "It went out to the cities of Mount Ephron." The position will depend on that of Nephtoah and of Kiriath-jearim.``117';
isbe[3156]='Epicureans`ep-i-ku-re\'-anz (Epikoureioi):<P>Contents<P>1. Social and Political Causes<P>2. Egoistic Hedonism<P>3. Back to Nature<P>4. Ataraxy<P>5. Pleasure Is the Absence of Pain<P>6. Social Contract<P>7. Atomic Theory<P>8. Materialism<P>9. Theory of Ideas<P>10. Epicurean Gods<P>11. Consensus Gentium<P>12. Causes of Success<P>13. Complete Antithesis of Paul\'s Teaching<P>14. LITERATURE<hr /><P>The Epicureans with the <a href="./study/isbe/search.html?string=STOICS">STOICS</A> (which see) encountered Paul in Athens (<a onClick="return mV(\'Act\',17,18);">Ac 17:18</a>). They were the followers of Epicurus, a philosopher who was born in Samos in 341 BC, and who taught first in Asia Minor and afterward in Athens till his death in 270 BC. His system, unlike most philosophies, maintained its original form, with little development or dissent, to the end of its course. The views of Paul\'s opponents of this school may therefore be gathered from the teaching of Epicurus.<P>1. Social and Political Causes:<P>The conditions for the rise of Epicureanism and Stoicism were political and social rather than intellectual. Speculative thought had reached its zenith in the great constructive ideals of Plato, and the encyclopaedic system of Aristotle. Criticism of these would necessarily drive men back upon themselves to probe deeper into the meaning of experience, as Kant did in later times. But the conditions were not propitious to pure speculation. The breaking up of the Greek city-states and the loss of Greek independence had filled men\'s minds with a sense of insecurity. The institutions, laws and customs of society, which had hitherto sheltered the individual, now gave way; and men demanded from philosophy a haven of rest for their homeless and weary souls. Philosophy, therefore, became a theory of conduct and an art of living.<P>Epicurus deprecated the pursuit of knowledge for its own sake, whether as philosophy or science, and directed his inquiries to the two practical questions: What is the aim of life? and How to attain to it? Philosophy he defined as "a daily business of speech and thought to secure a happy life."<P>2. Egoistic Hedonism:<P>His ethical teaching is therefore the central and governing factor of Epicurus\' philosophy. It belongs to the type generally described as Egoistic Hedonism. The same general principles had been taught by Aristippus and his school, the Cyrenaics, a century earlier, and they were again revived in the 17th century in England by Thomas Hobbes. The aim and end of life for every man is his own happiness, and happiness is primarily defined as pleasure. "Wherefore we call pleasure the Alpha and Omega of a blessed life. Pleasure is our first and kindred good. It is the starting-point of every choice and of every aversion, and to it we come back, inasmuch as we make feeling the rule by which to judge every good thing" (Epicurus, Letter to Menoeceus). So far Epicurus might seem to be simply repeating the view of the Cyrenaics. But there are important differences. Aristippus held the pleasure of the moment to be the end of action; but Epicurus taught that life should be so lived as to secure the greatest amount of pleasure during its whole course. And in this larger outlook, the pleasures of the mind came to occupy a larger place than the pleasures of the body. For happiness consists not so much in the satisfaction of desires, as in the suppression of wants, and in arriving at a state of independence of all circumstances, which secures a peace of mind that the privations and changes of life cannot disturb. Man\'s desires are of various kinds: "Some are natural, some are groundless; of the natural, some are necessary as well as natural, and some are natural only. And of the necessary desires, some are necessary if we are to be happy, some if the body is to be rid of uneasiness, some if we are even to live." Man\'s aim should be to suppress all desires that are unnecessary, and especially such as ar
