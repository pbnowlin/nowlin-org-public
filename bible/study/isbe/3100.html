isbe[3104]='English Versions`in\'-glish vur\'-shunz:<P>Contents<P>1. Introductory<P>2. The Bible in Anglo-Saxon and Norman Times<P>3. John Wycliffe<P>4. How Far Was the 14th-Century Version Wycliffe\'s Work?<P>5. From Wycliffe to Tyndale<P>6. William Tyndale<P>7. Miles Coverdale<P>8. Matthew\'s Bible<P>9. Richard Taverner<P>10. The Great Bible (Cranmer\'s Bible)<P>11. Reaction, 1541-57<P>12. Edward VI<P>13. Mary<P>14. The Geneva Bible (the "Breeches Bible")<P>15. The Bishops\' Bible<P>16. Rheims and Douai Version<P>17. The Authorized Version<P>18. The Apocrypha<P>19. Further Revisions<P>20. English Revised Version<P>21. American Revised Version<P>22. Has the Revised Version (British and American) Displaced the King James Version?<P>23. LITERATURE<hr /><P>English Versions of the Scriptures.<P>1. Introductory:<P>The battle for vernacular Scripture, the right of a nation to have the sacred writings in its own tongue, was fought and won in England. Ancient VSS, such as the Syriac and the Gothic, were produced to meet obvious requirements of the teacher or the missionary, and met with no opposition from any quarter. The same was the case with the efforts of the Anglo-Saxon church to provide portions of Scripture for the use of the people. Even in later times the Latin church seems to have followed no consistent policy in permitting or forbidding the translation of the Scriptures. In one country the practice was forbidden, in another it was regarded with forbearance or permitted under authority (Addis and Arnold, Catholic Dictionary, London, 1884, article "Bible"); and so it came about that the different nations of Europe came by the inestimable boon of an open Bible in different ways. Germany, for example, after the attempts of numerous translators who seem to have been quite untrammeled in their work owed, under Providence, to the faith, the intrepidity and the genius of Luther the national version which satisfied it for more than three centuries, and, after a recent and essentially conservative revision, satisfies it still. In England, as related below, things took a different course. In the Reformation period the struggle turned mainly on the question of the translation of the Bible.<P>2. The Bible in Anglo-Saxon and Norman Times:<P>The clergy and learned men had always of course access to the Scriptures in the Vulgate, a translation of the original Scriptures into Latin completed by Jerome at the very beginning of the 5th century; and from this version—the Vulgate (Jerome\'s Latin Bible, 390-405 AD.)—practically all further translations were made till the days of Luther. Within a century or little more after the landing of Augustine in England and his settlement at Canterbury (597 AD) Caedmon, a monk of Whitby, produced (670) his metrical version of the Bible, hardly indeed to be reckoned a version of the Scriptures in the ordinary sense, though it paved the way for such. Bede of Jarrow (672-735) translated the Creed and the Lord\'s Prayer and, according to the beautiful letter of his pupil, Cuthbert, breathed his last on the completion of his translation of the Gospel of John into the language of the people. Aldhelm, bishop of Sherborne in the county of Dorset (died 709), translated the Psalter in another translation with which the name of King Alfred is associated; and the other efforts of that ruler to spread the knowledge of the Scriptures among his people are well known. Notice, too, should be taken of the glosses. "The gloss," says Eadie (English Bible, I,14,note), "was neither a free nor yet a literal translation, but the interlinear insertion of the vernacular, word against word of the original, so that the order of the former was really irrespective of idiom and usage." The finest example of these is seen in the Lindisfarne Gospels, which were written in Latin about the year 700, and provided with an interlinear translation about 950 by Aldred, the priest. These with a version of a considerable section of the Old Testament by Aelfric, archbishop of Canterbury about the year 990, comprise the main efforts at Bible translation into English before the Norman Conquest. In Anglo-Saxon there is no proof of the existence of any translation of the complete Bible, or even of the complete New Testament. The sectional VSS, moreover, cannot be shown to have had any influence upon succeeding versions. For nearly three centuries after the Conquest the inter-relations of the different sections of the people and the conditions of the language prevented any real literary progress. The period, however, was marked by the appearance of fragmentary translations of Scripture into Norman French. From some Augustinian monastery, too, in the north of the East Midland district of England, about the year 1200, appeared the Ormulum, a curious metrical work of some 20,000 lines, consisting of a paraphrase of the Gospel of the day and an explanatory homily for 32 days of the year. Like the work of Caedmon the monk, it was not exactly Bible translation, but it doubtless prepared the way for such. Three versions of the Psalter, naturally always a favorite portion of Scripture with the translator, are assigned to the first half of Wycliffe\'s century. The reformer himself in one of his tracts urges a translation of the Bible to suit the humbler classes of society, on the plea that the upper classes already have their version in French. It was only in the long and splendid reign of Edward III (1327-77), when the two races that had existed in the country since the Conquest were perfectly united, that the predominance of English asserted itself, and the growth of the power and of the mental activity of the people instinctively demanded a new form of expression. The century of Wycliffe, it is to be remembered, was also that of Langland, Gower and Chaucer.<P>3. John Wycliffe:<P>Born in Yorkshire about the year 1320, Wycliffe was educated at Balliol College, Oxford, of which he soon became a Fellow and was for a short time Master, resigning the latter position in the year 1361 on his presentation to a living in Lincolnshire. He died at Lutterworth in Leicestcrshire in 1384. It was during the last quarter of his life that he came forward as a friend of the people and as a prolific writer on their behalf. Notwithstanding the external glory of the reign of Edward III, there was much in the ecclesiastical and social circumstances of the time to justify popular discontent. The Pope derived from England alone a revenue larger than that of any prince in Christendom. The nobles resented the extortion and pretensions of the higher clergy; and, according to Green, "the enthusiasm of the Friars, who in the preceding century had preached in praise of poverty, had utterly died away and left a crowd of impudent mendicants behind it." The Black Death, "the most terrible plague the world ever witnessed," fell in the middle of the century and did much further to embitter the already bitter condition of the poor. In France things were no better than in England, and the Turk had settled permanently in Europe. It is not wonderful that Wycliffe began, as is said, his version of the New Testament with the Book of Revelation. With his social teaching the present article is not specially concerned. It probably involved no more than the inculcation of the inherently democratic and leveling doctrines of Christianity, though some of the Lollards, like the Munster peasants in the German Reformation, associated it with dangerous socialistic practice. In any case the application of Christianity to the solution of social problems is not in any age easy to effect in practice. His tracts show (Eadie, I, 59ff) that it was from what Wycliffe had felt the Bible to be to himself that there sprang his strong desire to make the reading of it possible for his countrymen. To this was due the first English version of the Bible. To this also was likewise due the institution of the order of "poor priests" to spread the knowledge of the Bible as widely as possible throughout the country.<P>4. How Far Was the 14th-Century Version Wycliffe\'s Work?:<P>There is some uncertainty as to the exact share which Wycliffe had in the production of the 14th century version. The translation of the New Testament was finished about the year 1380 and in 1382 the translation of the entire Bible was completed, the greater part of the Old Testament being the work of Nicholas Hereford, one of the reformer\'s most ardent supporters at Oxford. The work was revised on thoroughly sound principles of criticism and interpretation, as these are explained in the prologue to the new edition, by John Purvey, one of Wycliffe\'s most intimate friends during the latter part of his life, and finished in 1388. "Other scholars," says Mr. F. G. Kenyon, of the British Museum, "assisted him in his work, and we have no certain means of knowing how much of the translation was actually done by himself. The New Testament is attributed to him, but we cannot say with certainty that it was entirely his own work" (Our Bible and the Ancient Manuscripts,200,3rd edition, London, 1898). This entirely corresponds with the position taken up by Forshall and Madden, the editors of the great Oxford edition of Wycliffe\'s version issued in 4 large quarto volumes in 1850. That work was undertaken to honor Wycliffe and in some measure to repay England\'s indebtedness to the reformer. The editors were men of the first literary rank; they spent 22 years upon this work; and it is recognized as a credit at once to the scholarship and research of Oxford and of England. Its honest and straightforward Introduction answers by anticipation by far the greater part of the criticisms and claims put forth by Dr. Gasquet (Our Old English Bible and Other Essays, London, 1898; 2nd edition, 1908). The claim is made that the work published in Oxford in 1850 is really not Wycliffe\'s at all but that of his bitterest opponents, the bishops of the English church who represented the party of Rome. Gasquet\'s work on this subject is mainly worthy of notice on account of his meritorious research in other departments of the English Reformation. His arguments and statements are met by Kenyon (op. cit., 204-8). The controversy is further noticed in The Age of Wycliffe, by G. M. Trevelyan (2nd edition, London, 1908), a work which cannot be too highly praised for its deep research, its interesting exposition and its cordial appreciation of the reformer and his works. "Nothing," says Trevelyan (Appendix, 361), "can be more damning than the licenses to particular people to have English Bibles, for they distinctly show that without such licenses it was thought wrong to have them." The age of printing, it is to be remembered, was not yet. The Wycliffe Bible was issued and circulated in copies each of which was written by the hand. About 170 copies of this manuscript Bible are still in existence. They form a striking proof of what England and the world owe to the faith, the courage and the labor of John Wycliffe and his "poor priests."<P>5. From Wycliffe to Tyndale:<P>It is a remarkable fact that before the year 1500 most of the countries of Europe had been supplied with a version of the Scriptures printed in the vernacular tongue, while England had nothing but the scattered copies of the Wycliffe manuscript version. Even Caxton, eager as was his search for works to translate and to print, while he supplied priests with service- books, preachers with sermons, and the clerk with the "Golden Legende," left the Scriptures severely alone. Nor was there a printed English version, even of the New Testament, for close on half a century after Caxton\'s death, a circumstance largely due to the energy of the Tudor dictatorship and the severity of the Arundelian Constitutions enacted by Convocation at Oxford in the year 1408:against Wycliffe and his work. These enactments forbade "upon pain of the greater excommunication the unauthorized translation of any text of the Scriptures into English or any other tongue by way of a book, pamphlet, treatise or the reading of such." Meanwhile the study of the new learning, including that of the original languages of Scripture, though generally resisted by the clergy, was greatly promoted by the invention of printing.<P>6. William Tyndale:<P>Erasmus, perhaps the chief representative name of the new age in the domain of learning, was professor of Greek at Cambridge from 1509 to 1524, and in the 2nd year of his professorship William Tyndale, an Oxford student in the 26th year of his age, migrated to Cambridge to study Greek. Ten years later Tyndale returned to his native county—Gloucestershire—to take up a private tutorship and there formed the determination which became the one fixed aim of his life—to put an English translation, not of the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) but of the original Greek and Hebrew Scriptures, into the hands of his countrymen. "If God spared him life," he said, "ere many years he would cause a boy that driveth a plow to know more of the Scriptures than the Pope did." Erasmus at Cambridge had uttered a similar aspiration. "He boldly avows his wish for a Bible open and intelligible to all. ....\' I long for the day when the husbandman shall sing to himself portions of the Scriptures as he follows the plow, when the weaver shall hum them to the time of his shuttle, when thetraveler shall while away with their stories the weariness of his journey\'"(Green, History of the English People, 1st edition, 308). In 1522 Tyndale went to London to try to find a patron for his work in Tunstall, bishop of London, who had studied Greek with Latimer at Padua and was one of the most noted humanists of the day. To show himself capable for the work, Tyndale took with him to London a version of a speech of Isocrates. But the Bishop of London\'s service was full; and after spending a year with a friendly alderman in London, "at last," he says in the Preface to his Five Books of Moses, "I understood not only that there was no room in my Lord of London\'s palace to translate the New Testament, but also that there was no place to do it in all England." He left the country and never returned to it. He spent the remaining twelve years of his life in exile and for the most part in great hardship, sustained by steady labor and by the one hope of his life—the giving to his countrymen of a reliable version of the Holy Scriptures in their own tongue. He went first to Hamburg, and there, as it seems, issued in the year 1524 versions of Matthew and Mark separately, with marginal notes. Next year he removed to Cologne, and arranged for the printing of the complete New Testament, the translation of which he accomplished alone, from the study of the Greek text of Erasmus in its original and revised editions and by a comparison of these with the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) and several European vernacular versions which, as already stated, had anticipated that of England. The story of the interruption by Cochlaeus of the actual work of printing, and of his warning the King and Wolsey of the impending invasion of England by Lutheranism, reads like a romance. His interference resulted in the prohibition by the city authorities of the printing of the work and in the sudden flight of Tyndale and his assistant, Joye, who sailed up the Rhine with the precious sheets already printed of their 3,000 quarto edition to Worms, the city of the famous Diet in which Luther four years before had borne his testimony before the Emperor. The place was now Lutheran, and here the work of printing could be carried out in security and at leisure. To baffle his enemies, as it seems, a small octavo edition was first printed without glosses; then the quarto edition was completed. The "pernicious literature" of both editions, without name of the translator, was shipped to England early in 1526; and by 1530 six editions of the New Testament in English (three surreptitiously) were distributed, numbering, it is computed, 15,000 copies. The unfavorable reception of Tyndale\'s work by the King and the church authorities may in some measure be accounted for by the excesses which at the moment were associated with the Reformation in Germany, and by the memories of Lollardism in connection with the work of Wycliffe.<P>So vehement was the opposition at any rate to Tyndale\'s work, and so determined the zeal in buying up and burning the book, that of the six editions above mentioned there "remains of the first edition one fragment only;...of the second one copy, wanting the title-page, and another very imperfect; and of the others, two or three copies which are not however satisfactorily identified" (Westcott, History of the English Bible,45,London, 1868). Meanwhile Tyndale took to working on the Old Testament. Much discussion has taken place on the question whether he knew Hebrew (see Eadie, I, 209ff). Tyndale\'s own distinct avowal is that it was from the Hebrew direct that such translation of the Old Testament as he accomplished was made. Very early in 1531 he published separately versions of Genesis and Deuteronomy, and in the following year the whole of the Pentateuch in one volume, with a preface and marginal glosses. In 1534 appeared the Book of Jonah, with a prologue; and in the same year a new version of the New Testament to counteract one made by Joye from the Vulgate (Jerome\'s Latin Bible, 390-405 AD.) This has been described by Westcott (op. cit., 185) as "altogether Tyndale\'s noblest monument," mainly on account of its short and pregnant glosses. "Bengel himself is not more terse or pointed." A beautifully illuminated copy of this edition was struck off on vellum and presented to Queen Anne Boleyn; and an edition of his revised New Testament was printed in London—"The first volume of Holy Scripture printed in England"—in 1536, the year of the Queen\'s death. Tyndale had for some time lived at Antwerp, enjoying a "considerable yearly exhibition" from the English merchants there; but his enemies in England were numerous, powerful and watchful. In 1534 he was betrayed and arrested; and after an imprisonment of nearly a year and a half at the castle of Vilorde, about 18:miles from Brussels, he was strangled and then burned in 1536, the same year as that of the death of the Queen. The last days of the hero and martyr may have been cheered by the news of the printing of his revised edition of the New Testament in England.<P>7. Miles Coverdale:<P>Miles Coverdale, who first gave England a complete and authorized version of the Bible, was a younger contemporary of Tyndale. Tyndale was a year younger than Luther, who was born in 1483, and Coverdale was four years younger than Tyndale. Born in the North Riding of Yorkshire, he found his way to Cambridge at the time when Erasmus was professor of Greek, and appears at an early date—how is not known—to have got into the good graces of Crumwell, the "malleus monachorum," factotum and secretary to Wolsey, and later on the King\'s principal abettor in his efforts to render the Church of England thoroughly national, if not to an equal extent Protestant. Adopting the liberal party in the church, he held Lutheran or evangelical views of religion, east off his monastic habit, and, as Bale says, gave himself up wholly to the preaching of the gospel. He is found in 1527 in intimate connection with More and Crumwell and probably from them he received encouragement to proceed with a translation of the Bible. In 1528 he was blamed before Tunstall, bishop of London, as having caused some to desert the mass, the confessional and the worship of images; and seeking safety, he left England for the Continent. He is said by Foxe to have met Tyndale at Hamburg in 1529, and to have given him some help in the translation of the Pentateuch. An uncertainty hangs over Coverdale\'s movements from 1529 to 1535, a period during which much was happening that could not fail to be powerfully changing opinion in England.<P>The result of the Assembly held at Westminster by Warham in May,1530,and of the Convocation held under his successor, Cranmer, in December,1534,was that in the latter it was petitioned that "his Majesty would vouchsafe to decree that the sacred Scriptures should be translated into the English tongue by certain honest and learned men, named for that purpose by his Majesty, and should be delivered to the people according to their learning." Crumwell, meanwhile, who had a shrewd forecast of the trend of affairs, seems to have arranged with Coverdale for the printing of his translation. However this may be, by the year 1534 "he was ready, as he was desired, to set forth" (i.e. to print) his translation; and the work was finished in 1535. And thus, "as the harvest springs from the seed which germinates in darkness, so the entire English Bible, translated no one knows where, presented itself, unheralded and unanticipated, at once to national notice in 1535" (Eadie, I, 266). It is declared on the title-page to be "faithfully and truly translated out of Douche and Latyn into Englishe: MDXXXV." Coverdale\'s own statements about his work leave the impression that he was a conspicuously honest man. Unlike Tyndale who regarded himself as, in a way, a prophet, with his work as a necessity Divinely laid upon him, Coverdale describes that he had no particular desire to undertake the work—and how he wrought, as it were, in the language of these days, under a committee from whom he took his instructions and who "required-him to use the Douche (i.e. the German) and the Latyn." He claims further to have done the work entirely himself, and he certainly produced a new version of the Old Testament and a revised version of the New Testament. He used, he says, five sundry interpreters of the original languages. These interpreters were, in all probability, the Vulgate, Luther\'s version, the Zurich or Swiss-German Bible, the Latin version of Pagninus, and he certainly consulted Tyndale on the Pentateuch and the New Testament. He successfully studied musical effect in his sentences and many of the finest phrases in the King James Version are directly traced to Coverdale. His version of the Psalms is that which is retained and is still in daily use in the ritual of the Church of England. Two new editions of Coverdale\'s version were issued in 1537 "with the King\'s most gracious license," and after this the English Bible was allowed to circulate freely. Certain changes in the title-page, prefaces and other details are discussed in the works mentioned at the end of this article.<P>8. Matthew\'s Bible:<P>Convocation meanwhile was not satisfied with Coverdale\'s translation, and Coverdale himself in his honest modesty had expressed the hope that an improved translation should follow his own. Accordingly in 1537—probably at the suggestion of, and with some support from, Crumwell and certainly to his satisfaction—a large folio Bible appeared, as edited and dedicated to the King, by Thomas Matthew. This name has, since the days of Foxe, been held to be a pseudonym for John Rogers, the protomartyr of the Marian persecution, a Cambridge graduate who had for some years lived in intimacy with Tyndale at Antwerp, and who became the possessor of his manuscript at his death. Besides the New Testament, Tyndale, as above mentioned, had published translations of the Pentateuch, the Book of Jonah, and portions of the Apocrypha, and had left a manuscript version of Joshua to 2 Chronicles. Rogers, apparently taking all he could find of the work of Tyndale, supplemented this by the work of Coverdale and issued the composite volume with the title, "The Bible, which is all the Holy Scriptures, in which are contayned the Olde and Newe Testaments, truely and purely translated into English by Thomas Matthew. Esaye I, Hearken to, ye heavens, and thou earth, geave eare: for the Lord speaketh. MDXXXVII." After the banning and burning of Tyndale\'s New Testament on its arrival in England 11 years before, it is not easy to account for the royal sanction with which the translation appeared. It was probably granted to the united efforts of Cranmer and Crumwell, aided perhaps by the King\'s desire to show action independent of the church. The royal sanction, it will be noted, was given in the same year in which it was given to Coverdale\'s second edition. That version became the basis of our present Bible. It was on Matthew\'s version that for 75 years thereafter all other versions were based.<P>9. Richard Taverner:<P>Matthew\'s first edition of 1,500 copies was soon exhausted, and a new edition was issued with some revision by Richard Taverner, a cultivated young layman and lawyer who had in his early years been selected by Wolsey for his college at Oxford. He was imprisoned in its cellar for reading Tyndale\'s New Testament; but he was soon released for his singular musical accomplishments. He was an excellent Grecian, of good literary taste and of personal dignity. For the Old Testament curiously enough he made, good Grecian as he was, no use of the Septuagint; but throughout aimed successfully at idiomatic expression, as also at compression and vividness. Some of his changes are kept in the King James Version, such as "parables" for "similitudes" and in <a onClick="return mV(\'Mat\',24,12);">Mt 24:12</a>, "The love of the many shall wax cold," and others. He also does greater justice to the Greek article. His dedication to the king is manly and dignified and compares most favorably with the dedications of other translators, including that of the King James Version. The book appeared in two editions, folio and quarto, in 1539, and in the same year two editions, folio and quarto, of the New Testament. The Bible and the New Testament were each reprinted once, and his Old Testament was adopted in a Bible of 1551. But with these exceptions Taverner\'s version was practically outside of influence on later translations.<P>10. The Great Bible (Cranmer\'s Bible):<P>The next Bible to appear was named from its size. Its pages are fully 15 inches long and over 9 inches broad. It was meant to be in a way a state edition, and is known as the Great Bible. As sufficiently good type, paper and other requisites could not be found in England, it was resolved that it should be printed in Paris. Coverdale and Grafton, the printer, went to Paris to superintend the printing; but the French church authorities interfered and the presses, types and workmen had to be transferred to London where the work was finished. It was the outcome of the Protestant zeal of Crumwell who wished to improve upon the merely composite volume of Tyndale and Coverdale. Its origin is not very accurately known, and authorities such as Hume, Burnet and Froude have ventured upon statements regarding it, for which there is really no proof (Eadie, I, 356ff). The duty of editor or reviser was by Crumwell assigned to Coverdale who, as a pliant man and really interested in the improvement of the English version, was quite willing to undertake a work that might supersede his own. The rapidity with which the work was executed and the proofs of the minute care devoted to it by Coverdale may appear remarkable to those who are acquainted with the deliberate and leisurely methods of the large committee that produced the King James Version in the reign of King James or the Revised Version (British and American) in the reign of Queen Victoria. Of course Coverdale had been over all the work before and knew the points at which improvements were to be applied; and a zealous and expert individual can accomplish more than a committee. Luther translated the New Testament and, after revising his work with Melanchthon, had it printed and published in less than a year. The printing of the Great Bible began in May, 1538, and was completed in April, 1539, a handsome folio, printed in black letter, with the title, "The Byble in Englyshe, that is to say, the contents of all the holy scripture, bothe of the olde and newe testament, truly translated after the veryte of the Hebrue and Greke textes, by the dylygent studye of dyverse excellent learned men, expert in the forsayde tongues. Prynted by Rychard Grafton and Edward Whitchurch. Cum privilegio ad imprimendum solum. 1539." The elaborate notes for which asterisks and various other marks are provided were never supplied; but the actual translation shows devoted attention to the work and much fine appreciation of the original languages and of English. In the New Testament the version derived assistance from the Latin version of Erasmus, and in the Old Testament from Munster and Pagninus. Variations in the text could of course be got from the Complutensian Polyglot. The Great Bible shows considerable improvement upon Tyndale in the New Testament, and upon Coverdale in the Old Testament. "So careful," says Eadie (I, 370), "had been Coverdale\'s revision and so little attachment had he to his own previous version, that in the 53rd chapter of Isaiah the Bible of 1539 differs in nearly forty places from his version of 1535." The clergy of course had no love for Crumwell and still less for his work, though to avert clerical prejudices, Coverdale had made concessions in his translation. The work was cordially welcomed by the people, and a copy was ordered to be printed for every parish church, the cost to be paid half by the parson and half by the parishioners. A further revision of this version was carried out by Coverdale for a second edition which appeared in April, 1540, and is known as Cranmer\'s Bible, mainly from the judicious and earnest preface which the archbishop wrote for it. "It exhibits a text formed on the same principles as that of 1539, but after a fuller and more thorough revision" (Westcott, 254). Two other editions followed in the same year and three more in the year following (1541).<P>11. Reaction, 1541-57:<P>After the publication of the Great Bible (1539-41) no further advance took place for many years. The later years of Henry VIII indeed were marked by serious reaction. In 1542 Convocation with the royal consent made an attempt, fortunately thwarted by Cranmer, to Latinize the English version and to make it in reality what the Romish version of Rheims subsequently became. In the following year Parliament, which then practically meant the King and two or three members of the Privy Council, restricted the use of the English Bible to certain social classes that excluded nine-tenths of the population; and three years later it prohibited the use of everything but the Great Bible. It was probably at this time that there took place the great destruction of all previous work on the English Bible which has rendered examples of that work so scarce. Even Tunstall and Heath were anxious to escape from their responsibility in lending their names to the Great Bible. In the midst of this reaction Henry VIII died, January 28, 1547.<p>12. Edward VI:<P>No new work marked the reign of Edward VI, but great activity prevailed in the printing of previous versions Thirty-five New Testaments and thirteen Bibles were published during his reign of six years and a half; and injunctions were issued urging every person to read "the very lively Word of God" and for a copy of the Great Bible with the English paraphrase of Erasmus to be set up in every church. By royal order a New Testament was to be sold for 22d, a sum representing as many shillings of present value.<P>13. Mary:<P>Less repressive work regarding the translation and diffusion of Scripture than might have been expected occurred in the reign of Mary, though in other directions the reaction was severe enough. According to Lord Burghley, during the three years and nine months of Mary\'s reign, the number of 400 persons perished—men, women, maidens and children—by imprisonment, torment, famine and fire. Among the martyrs were Cranmer and Rogers; Coverdale escaped martyrdom only by exile and the powerful intervention of the king of Denmark. The copies of the Bibles in the churches were of course burned; and—though individual translations were not specified—proclamations were issued against certain books and authors. Still the books were not, as formerly, bought up and confiscated; and so the activity of Edward\'s reign in the production of Bibles left copies widely distributed throughout the country at the close of Mary\'s reign. At this time a New Testament was printed at Geneva which had great influence upon future versions of the Bible.<P>14. The Geneva Bible (the Breeches Bible):<P>This New Testament was issued in 1557 and was most probably the work of West Whittingham, an English exile who had married Calvin\'s sister. It was translated from the Greek and compared carefully with other versions. It had also a marginal commentary which was more complete than anything similar that had yet appeared in England; and it was the first translation that was printed in roman letter and in which chapters were divided into verses. Calvin wrote for it an introductory epistle, and it had also an address by the reviser himself. A few months after its publication the more serious task of the revision of the whole Bible was begun and continued for the space of two years and more, the translators working at it "day and night." Who the translators were is not said; but Whittingham, probably with Gilby and Sampson, stayed at Geneva for a year and a half after Elizabeth came to the throne, and saw the work through. It was finished in 1560, and in a dignified preface was dedicated to Elizabeth. The cost was met by members of the Congregation at Geneva, among whom was John Bodley, father of the founder of the great library at Oxford. Its handy form—a modest quarto—along with its vigorously expressed commentary, made it popular even with people who objected to its source and the occasional Calvinistic tinge of its doctrines. It became and remained the popular edition for nearly three- quarters of a century. The causes of its popularity are explained in Westcott, 125f. Bodley had received the patent for its publication; and upon his asking for an extension of the patent for twelve years, the request was generously granted by Archbishop Parker and Grindly, bishop of London, though the Bishops\' Bible was already begun.<P>The "Breeches Bible."<P>The Geneva version is often called the "Breeches Bible" from its translation of <a onClick="return mV(\'Gen\',3,7);">Ge 3:7</a>: "They sewed figleaves together, and made themselves breeches." This translation, however, is not peculiar to the Genevan version. It is the translation of perizomata in both the Wycliffe VSS; it is also found in Caxton\'s version of the "Golden Legende."<P>15. The Bishops\' Bible:<P>Queen Elizabeth, the beginning of whose reign was beset with great difficulties, restored the arrangements of Edward VI. A copy of the Great Bible was required to be provided in every church, and every encouragement was given to the reading of the Scriptures. The defects of the Great Bible were admitted, and were the not unnatural result of the haste with which—notwithstanding its two revisions—it had been produced. These became more apparent when set beside the Geneva version, which, however, the archbishop and clergy could hardly be expected to receive with enthusiasm, as they had had nothing to do with its origin and had no control over its renderings and marginal notes. Archbishop Parker, moreover, who had an inclination to Biblical studies, had at the same time a passion for uniformity; and probably to this combination of circumstances may be traced the origin of the Bishops\' Bible. Parker superintended the work, which was begun in 1563-64; he was aided by eight bishops—from whom the version received its name—and other scholars. It appeared in a magnificent volume in 1568, without a word of flattery, but with a preface in which the revisers express a lofty consciousness of the importance of their work. It was published in 1568: cum privilegio regiae Majestatis. A revised and in many places corrected edition was issued in 1572, and another in 1575, the year of the archbishop\'s death. The general aim of the version is a quaint literality, but along with this is found the use of not a few explanatory words and phrases not found in the original text. More exact notice also than in previous versions is taken of the use of the Greek article and of the particles and conjunctions. It bears marks, however, of the hand of the individual translators by whom the work was done; and of the want of the revision of each translator\'s work by the rest, and of some general revision of the whole. The Genevan version was the work of collegiate labor, to which much of its superiority is due. Though Parker did not object to the circulation of the Genevan version, Convocation after his death made some unsuccessful attempts to popularize the Bishops\' Bible; but the Genevan translation was not easily thrust aside. "It grew," says Eadie (II, 35), "to be in greater demand than the Bishops\' or Cranmer\'s. Ninety editions of it were published in the reign of Elizabeth, as against forty of all the other versions. Of Bibles, as distinct from New Testaments, there were twenty-five editions of Cranmer\'s and the Bishops\', but sixty of the Genevan."<P>16. Rheims and Douai Version:<P>The production of an official version of the sacred Scriptures for English Roman Catholics was probably due more to rivalry with the Reformers than to any great zeal of the authorities of the Roman church for the spread of vernacular Scripture; though, according to the Arundelian Constitution above mentioned, it was only to the printing and reading of unauthorized translations that objection was then taken by the Roman authorities. But if there was to be a special version for Catholics, it was clearly reasonable that the work should be done by Catholics and accompanied by Catholic explanations. This was undertaken by some English Catholic scholars who, on the success of the Reformation in England, had left the country and settled at Douai in the Northeast of France, with a short transference of their seminary to Rheims. The version was probably produced under the influence of (Cardinal) Allen and an Oxford scholar, Gregory Martin. It was made from the Vulgate, the Bible of Jerome and Augustine, and not, like the Protestant VSS, from the Hebrew and Greek originals. The New Testament was issued from Rheims in 1582 and the Old Testament from Douai in 1609. The main objection to the version is the too close adherence of the translators to the words of the original and the too great Latinizing of the English, so that their translation "needs," as Fuller said, "to be translated." Still they have a few words which along with a few Latinisms were adopted by the translators of the King James Version, such as "upbraideth not," "bridleth his tongue," at his own charges, and others; and they have the special merit of preserving uniformity of rendering. The translation met with no great success and the circulation was not large.<P>17. The Authorized Version:<P>The King James Version owed its origin to a chance remark regarding mistranslations in the existing versions made at the Hampton Court Conference, a meeting of bishops and Puritan clergy held (1604) in the interest of religious toleration before James was actually crowned. The meeting was ineffectual in all points raised by the Puritans, but it led to the production of the English Bible. Dr. Reynolds, president of Corpus Christi College, Oxford, probably with some reference to the rivalry between the Bishops\' Bible and the Genevan version, remarked on the imperfections of the current Bibles. The remark was not very enthusiastically received except by the King, who caught eagerly at the suggestion of a fresh version, "professing that he could never yet see a Bible well translated in English," and blaming specially the Genevan version, probably on account of the pointed character of its marginal notes. Probably with the aid of the universities, the King without delay nominated the revisers to the number of fifty-four from among the best Hebrew and Greek scholars of the day. Only 47 actually took part in the work which, however—officially at least—they were in no hurry to begin; for, although named in 1604 and with all the preliminaries arranged before the end of that year, they did not begin their work till 1607. Their remuneration was to be by church preferment, for which the archbishop was to take measures. The immediate expenses, the King suggested, should be supplied by the bishops and chapters who, however, did not respond. "King James\' version never cost King James a farthing," says Eadie (II, 153f), who here gives some interesting information on this aspect of the revision. They wrought in six companies of which two met respectively in Westminster, Cambridge and Oxford. Elaborate rules, given in full in most histories of the Bible, were laid down for the revisers\' guidance, the King being particularly insistent upon Rule 9, which provided for the revision of the work of each Company by the rest. When any Company had finished the revision of a book, it was to be sent to all the rest for their criticism and suggestions, ultimate differences of opinion to be settled at a general meeting of each Company. Learned men outside the board of revisers were to be invited to give their opinions in cases of special difficulty.<P>18. The Apocrypha:<P>One of the Cambridge Companies was specially appointed to revise the Apocrypha, in which considerable license was taken, as the seven members composing the Company had probably no very firm belief in the inspiration of its books. The marginal notes, too, are freer in character than those of the Old Testament. By the early translators, Tyndale and Coverdale, the Apocrypha was simply accepted as part of the heritage of the church; it had a place likewise in the Great Bible, the Bishops\' Bible and most even of the Genevan copies. But by the middle of the 17th century opinion even in the Church of England had changed regarding it, and it was about this time that Bibles began to be printed having the canonical books only. The Apocrypha is now hardly at all printed otherwise than separately (note also should be taken of the treatment of the Apocrypha in the Revised Version (British and American), as stated below).<P>Impressed with the importance of their task, the revisers worked strenuously at it for two years; and nine months more were devoted to revision by a special committee consisting of two members from each center, and in 1611 the result of the work appeared. It is not wonderful that the work was described by a contemporary entitled to give a judgment on it (Selden, Table Talk) as "the best translation in the world"—a verdict that later opinion has abundantly ratified. It was the copestone of a work on which 90 years of solid labor had by different hands been expended, and it was done by half a hundred of the foremost scholars of the day who knew Hebrew and Greek, and who also knew English. For three centuries it has grown in popular esteem, and it is justly regarded as one of the best possessions and one of the most unifying influences of the widely scattered English-speaking race.<P>On the title-page as issued in 1611 the version is described as "newly translated out of the original tongues" and as "appointed to be read in churches," two statements not easy to reconcile with the actual facts. The first rule for the revisers\' guidance provided that the work was to consist in a revision of the Bishops\' Bible: it was not said that it was to be a new translation. There is, further, no sanction of the version by King, Parliament, Convocation or Privy Council. Like Jerome\'s version twelve centuries before, it was left to find acceptance as best it might by its own intrinsic merit.<P>19. Further Revisions:<P>Already in the days of the Commonwealth proposals were made for a new version; but though several meetings were held of a committee appointed by Parliament for the purpose in 1657, nothing came of the movement (Lewis, History of Translations, 354). For nearly half a century the chief rival of the King James Version was the Geneva Bible which was in wide private use. Formal revision was not undertaken again till the reign of Queen Victoria. But between 1611 and the date of the recent revision not a few small alterations had been silently introduced into the King James Version, as was indeed only to be expected if the changes in the orthography of the language were to be correctly represented on the printed page. Advancing literary criticism, too, and minute linguistic study showed that since the days of the revisers many words had changed their meaning, and that verbal inaccuracies and a few less venial errors could be proved in the revisers\' work. But what probably weighed most with scholars in inducing them to enter upon a new version was the extraordinary increase that since the last revision had taken place in our knowledge of the Hebrew text and more especially of the Greek text of Scripture. Important manuscripts had been brought to light of which the 17th-century revisers knew nothing, and scholars had with minute care examined and compared all the early copies of the Scripture studies which, without altering the main import of the gospel story, were shown to have considerable importance on the actual words\' and sometimes on the meaning of the text. After much discussion of the subject in special volumes and in the leading magazines and reviews of Britain and America, there was a general agreement among scholars that a fresh version was advisable.<P>20. English Revised Version:<P>The history of the English revision is given at length in the preface to the English Revised Version of the New Testament. It originated with the Convocation of Canterbury of the Church of England in the year 1870, when a committee of 16 members was appointed with power to add to its numbers. By this committee invitations to join it were issued to the outstanding Hebrew and Greek scholars of the country, irrespective of religious denomination, and eventually two Companies were formed, one for the Old Testament and one for the New Testament, consisting each of 27 members, in which all the churches of the country were represented, the Roman Catholics alone excepted, and Dr. Newman had been invited to join the New Testament committee. The churches of America were also invited to cooperate, and this they did by forming two Companies corresponding to the British with due provision for the mutual comparison of results and suggestions. Where the suggestions from America were not accepted by the British revisers, they were recorded in an appendix to the published volume. The names of the revisers and the rules and principles laid down for the procedure of both Companies will be found in Eadie (II, 481ff). The New Testament was published in May, 1881; the work occupied the Company for about 40 days in each year for 10 years. The Old Testament revision occupied the Company for 792 days in a period of 14 years. The entire Bible was published in May, 1885. It did not include the Apocrypha, a revision of which was issued separately in 1895.<P>21. American Revised Version:<P>This was undertaken, not by Convocation, but by the University Presses, a special Company being formed for the purpose from the Old Testament and New Testament Companies. For <a href="./study/isbe/search.html?string=AMERICAN+REVISED+VERSION">AMERICAN REVISED VERSION</A> see separate article.<P>On <a href="./study/isbe/search.html?string=REVISED+VERSION">REVISED VERSION</a> see also <a href="./study/isbe/search.html?string=BIBLE">BIBLE</a>.<P>22. Has the Revised Version (British and American) Displaced the American Version?:<P>The Revised Version (British and American) has been before the English-speaking world for a quarter of a century and it can hardly be said with safety that it has as yet made any progress in displacing the King James Version in public esteem. Of course as much could be said for the King James Version in its day. It was very slow in gaining acceptance with the people: and yet unreasoning affection for its very words and phraseology is now one of the main obstacles to the acceptance of an admittedly more scientifically based original text and a more correct and not displeasing rendering of the same. A large number of the changes are certainly not such as appeal strongly to popular sympathy. "The Greek text of the New Testament of 1881 has been estimated to differ from that of 1611 in no less than 5,788: readings, of which about a quarter are held notably to modify the subject-matter; though even of these only a small proportion can be considered as of first-rate importance" (Kenyon, 239). On the other hand Hebrew, and especially the cognate Semitic languages, are now a great deal better known than before 1611, and considerable improvement is noticeable in the bringing out of the meaning in the poetical and prophetical books. The Revised Version (British and American) contains the best results of the scholarship of the Victorian age and cannot fail to be regarded as of the greatest utility to the reader and student of the King James Version. In the religious life the mind is essentially conservative, and nothing but time will show whether the undoubted merits of the Revised Version (British and American) are such as to outweigh the claims of sentiment and affection with which the King James Version is held.<P>See further <a href="./study/isbe/search.html?string=AMERICAN+REVISED+VERSION">AMERICAN REVISED VERSION</a>.<P>23. LITERATURE.<P>Perhaps the most complete work on the subject in all its aspects is that by Dr. John Eadie, The English Bible: an External and Critical History of the Various English Translations of Scripture, 1876. Eadie was himself one of the revisers of 1870, and some of his concluding chapters contain "Remarks on the Need of Revision of the English New Testament." He is also highly appreciative but judiciously critical of his predecessors in the same field, eg. of Lewis, Complete History of Several Translations of the Holy Bible and New Testament into English, 1731,1 818; and Christopher Anderson, The Annals of the English Bible, 2 volumes, 1845,1 volume rev. edition, 1862. An earlier and also very good book is Westcott\'s General View of the History of the English Bible, 1868. Westcott was also one of the revisers of 1870 and criticizes the work of the various translators as well as narrates the succession of the translations. A good discussion of the internal history of the text will also be found in the History of the English Bible by Dr. Moulton, another of the revisers. Kenyon, Our Bible and Ancient manuscripts, 1895, considers specially the text on which the successive English versions were based. He writes judiciously also on the Wycliffe period and on the Revised Version (British and American). The Wycliffe period should also be studied in Forshall and Madden, 4 volumes, 4to, Oxford, 1850; England in the Age of Wycliffe, by G. M. Trevelyan; Dr. Gasquet\'s Our Old English Bible and Other Essays, 1908; and Lechler\'s John Wycliffe and His English Precursors, translated and edited by Lorimer. For the Reformation period generally Foxe\'s History of the Acts and Monuments of the Church still deserves to be studied. "Foxe\'s story is doubtless substantially true, although disfigured by credulity and bitter prejudice." For Tyndale\'s special work see William Tyndale, a Biography, by R. Demaus, new edition by Lovett, 1886; and Fry\'s Bibliographical Descriptions of the Editions of the New Testament, Tyndale\'s Version in English. Fry has also written special works on the Great Bible, Cranmer\'s Bible and the Genevan Version. The King James Version is very fully described in the works above mentioned, and in this connection notice is due to Scrivener, The Authorised Edition of the English Bible, 1884, and more especially to his careful and thorough "Introduction" to the Quarto Paragraph Bible, 1873. More popular histories of the Bible are those of Stoughton, Pattison, 1874, and Professor Milligan of Glasgow, 1895. General histories of England and of English literature may also be profitably consulted on the history of the Bible and its translation into the vernacular, such as those of Hume, Burnet, Hallam, Froude, Green and Gardiner. The revision of the King James Version called forth a large literature, either in the way of preparation for it or of criticism of it when carried through. To this literature many of the revisers themselves contributed, among whom may be mentioned Eadie, Ellicott, Westcott, Humphry, Newth and Kennedy; nor should the important contributions of Archbishop Trench and Dean Alford, though of a slightly earlier generation, be overlooked. The American revisers also republished a series of Essays written by some of their number on Biblical Revision: Its Necessity and Purpose, 1879; and account should be taken also of the Documentary History of the American Committee on Revision prepared by that committee for the use of its members.``79';

isbe[3108]='Enjoin`en-join\':<P>Its usual sense is "to impose something," as a command, a charge or a direction. In this last sense it is used in <a onClick="return mV(\'Job\',36,23);">Job 36:23</a>, i.e. "Who hath directed?" In <a onClick="return mV(\'Est\',9,31);">Es 9:31</a> it means "to command"; in <a onClick="return mV(\'Phm\',1,8);">Phm 1:8</a>, "to order" or "direct."``1';
isbe[3109]='Enlarge; Enlargement`en-larj\', en-larj\'-ment:<P>"To enlarge" is very frequently used figuratively: "God enlarge Japheth" (<a onClick="return mV(\'Gen\',9,27);">Ge 9:27</a>), i.e. "make him a great nation"; or "Thou hast enlarged my steps under me" (<a onClick="return mV(\'2Sa\',22,37);">2Sa 22:37</a>), i.e. "Thou hast given me success." A very peculiar use of "enlarge" is found in the King James Version <a onClick="return mV(\'Psa\',4,1);">Ps 4:1</a>: "Thou hast enlarged me" (the Revised Version (British and American) "set me at large"), i.e. "Thou hast given me freedom, deliverance from distress." "Our heart is enlarged" (platuno; <a onClick="return mV(\'2Cr\',6,11);">2Co 6:11</a>), and "Be ye also enlarged" (<a onClick="return mV(\'2Cr\',6,13);">2Co 6:13</a>), express great love of one party to another. See also <a onClick="return mV(\'1Sa\',2,1);">1Sa 2:1</a>, "My mouth is enlarged," i.e. "full of praise." <a onClick="return mV(\'Eze\',41,7);">Eze 41:7</a>, "were broader" (the King James Version "an enlarging").<P>Enlargement, the King James Version, <a onClick="return mV(\'Est\',4,14);">Es 4:14</a> from rawach, "to enlarge," "to respite," is rendered "relief" by the Revised Version (British and American) in better harmony with "deliverance" with which the word is paired.``16';
isbe[3110]='Enlighten`en-lit\'-\'-n:<P>(1) \'or, "illumination" in every sense, used in the ordinary sense of giving natural light (<a onClick="return mV(\'Psa\',97,4);">Ps 97:4</a> the King James Version; see also <a onClick="return mV(\'Ezr\',9,8);">Ezr 9:8</a>) or as a sign of health and vigor (<a onClick="return mV(\'1Sa\',14,27,29);">1Sa 14:27,29</a>). "His eyes were enlightened," literally, "became bright." He had become weary and faint with the day\'s exertions and anxieties, and now recovers (see <a onClick="return mV(\'Job\',33,30);">Job 33:30</a> and compare <a onClick="return mV(\'Psa\',13,3);">Ps 13:3</a>). Thus in sickness and grief, the eyes are dull and heavy; dying eyes are glazed; but health and joy render them bright and sparkling, as with a light from within.<P>(2) In <a onClick="return mV(\'Psa\',18,28);">Ps 18:28</a> the King James Version, The word naghah, figuratively describes the believer\'s deliverance from the gloom of adversity and the restoration of joy in the knowledge of God.<P>(3) Most frequently the terms so translated mean the giving of spiritual light to the soul (<a onClick="return mV(\'Psa\',19,8);">Ps 19:8</a>; <a onClick="return mV(\'Eph\',1,18);">Eph 1:18</a>, photizo; <a onClick="return mV(\'Hbr\',6,4);">Heb 6:4</a>; <a onClick="return mV(\'Hbr\',10,32);">10:32</a>). This spiritual enlightening the Spirit of God brings about through the Divine word (<a onClick="return mV(\'Psa\',119,130);">Ps 119:130</a>; <a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a>; <a onClick="return mV(\'2Pe\',1,19);">2Pe 1:19</a>). Sin mars the intellectual discernment; "but he that is spiritual discerneth all things" (<a onClick="return mV(\'1Cr\',2,15);">1Co 2:15</a> King James Version, margin).``91';
isbe[3111]='Enmity`en\'-mi-ti (\'ebhah; echthra):<P>"Enmity" (hate) occurs as the translation of \'ebhah in <a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>, "I will put enmity between thee and the woman, and between thy seed and her seed," and in <a onClick="return mV(\'Num\',35,21,22);">Nu 35:21-22</a>, where the absence of enmity on the part of the man-slayer modifies the judgment to be passed on him.<P>In the New Testament "enmity" is the translation of echthra: <a onClick="return mV(\'Luk\',23,12);">Lu 23:12</a>; <a onClick="return mV(\'Rom\',8,7);">Ro 8:7</a>, "The mind of the flesh is enmity against God." <a onClick="return mV(\'Jam\',4,4);">Jas 4:4</a>, "The friendship of the world is enmity with God" (because "the world" is preferred to God); in <a onClick="return mV(\'Eph\',2,15,16);">Eph 2:15-16</a>, Christ is said to have "abolished in his flesh the enmity," by His cross to have "slain the enmity," that is, the opposition between Jew and Gentile, creating in Himself "one new man, (so) making peace."`<a href="./study/isbe/search.html?string=ABOLISH">ABOLISH</a>; <a href="./study/isbe/search.html??string=HATE">HATE</a>`185';
isbe[3112]='Ennatan`en\'-a-tan (Ennatan; the King James Version Eunatan (a misprint)):<P>One of Ezra\'s messengers to fetch Levites for the temple service (1Esdras 8:44); called "Elnathan" in <a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>.``1';
isbe[3113]='Enoch`e\'-nok (chanokh, "initiated"; Henoch):<P>(1) The eldest son of Cain (<a onClick="return mV(\'Gen\',4,17,18);">Ge 4:17-18</a>).<P>(2) The son of Jared and father of Methuselah, seventh in descent from Adam in the line of Seth (<a onClick="return mV(\'Jud\',1,14);">Jude 1:14</a>). He is said (<a onClick="return mV(\'Gen\',5,23);">Ge 5:23</a>) to have lived 365 years, but the brief record of his life is comprised in the words, "Enoch walked with God: and he was not; for God took him" (<a onClick="return mV(\'Gen\',5,24);">Ge 5:24</a>). The expression "walked with God" denotes a devout life, lived in close communion with God, while the reference to his end has always been understood, as by the writer of He, to mean, "By faith Enoch was translated that he should not see death; and he was not found, because God translated him" (<a onClick="return mV(\'Hbr\',11,5);">Heb 11:5</a>).`<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`68';
isbe[3114]='Enoch (City)`In <a onClick="return mV(\'Gen\',4,17);">Ge 4:17</a> it is narrated that Cain, who had taken up his abode in the land of Nod, east of Eden (verse 16), built there a city, and called it after the name of his firstborn son Enoch. It is impossible to fix more definitely the locality of this first of cities, recorded, as Delitzsch says (Genesis, in the place cited.), as registering an advance in civilization. The "city" would be a very simple affair, a place of protection for himself, wife and household, perhaps connected with the fear spoken of in <a onClick="return mV(\'Gen\',4,14);">Ge 4:14</a>.``1';

isbe[3119]='Enormity`e-nor\'-mi-ti:<P>The marginal rendering in the King James Version of <a onClick="return mV(\'Hsa\',6,9);">Ho 6:9</a> for "lewdness," and in the Revised Version (British and American) of <a onClick="return mV(\'Lev\',18,17);">Le 18:17</a>; <a onClick="return mV(\'Lev\',19,29);">19:29</a>; <a onClick="return mV(\'Lev\',20,14);">20:14</a> for "wickedness." In each case it is the translation of zimmah, meaning originally, "thought" or "plot," mostly in a bad sense, lewdness, wickedness; in Leviticus it is unnatural wickedness - incest.``1';
isbe[3120]='Enos; Enosh`e\'-nos, e\'-nosh (\'enosh, "mortal"; \'Enos):<P>In the New Testament (the Revised Version (British and American) and the King James Version) and the Old Testament (the King James Version except <a onClick="return mV(\'1Ch\',1,1);">1Ch 1:1</a>), the form is Enos; in the Old Testament (the Revised Version (British and American) and <a onClick="return mV(\'1Ch\',1,1);">1Ch 1:1</a> the King James Version), the form is Enosh. The son of Seth and grandson of Adam (<a onClick="return mV(\'Gen\',4,26);">Ge 4:26</a>; <a onClick="return mV(\'Gen\',5,6);">5:6</a>ff; <a onClick="return mV(\'1Ch\',1,1);">1Ch 1:1</a>; <a onClick="return mV(\'Luk\',3,38);">Lu 3:38</a>). Enosh denotes man as frail and mortal. With Enosh a new religious development began, for "then began men to call upon the name of Yahweh" (<a onClick="return mV(\'Gen\',4,26);">Ge 4:26</a>). There seems to be an implied contrast to <a onClick="return mV(\'Gen\',4,17);">Ge 4:17</a>ff which records a development in another department of life, represented by Enoch the son of Cain.``78';
isbe[3121]='Enquire`en-kwir\':<P>This is an Old English word now obsolescent. It is common in the King James Version. In the American Standard Revised Version it is nearly always replaced by the more modern "inquire," a few times by "seek" and "ask," once by "salute" (<a onClick="return mV(\'1Ch\',18,10);">1Ch 18:10</a>). With this one exception in the Old Testament the change does not affect the meaning. In <a onClick="return mV(\'Act\',23,15);">Ac 23:15</a>, "enquire something more perfectly" is substituted by "judge more exactly." In <a onClick="return mV(\'Mat\',10,11);">Mt 10:11</a>, "search out" replaces it. In <a onClick="return mV(\'Mat\',2,7,16);">Mt 2:7, 16</a>, "learned exactly" replaces "inquired diligently."`<a href="./study/isbe/search.html?string=INQUIRE">INQUIRE</a>`1';
isbe[3122]='Enrolment`en-rol\'-ment`<a href="./study/isbe/search.html?string=QUIRINIUS">QUIRINIUS</a>; <a href="./study/isbe/search.html?string=TAX">TAX</a>`1';
isbe[3123]='Ensample`en-sam\'-p\'-l`<a href="./study/isbe/search.html?string=EXAMPLE">EXAMPLE</a>`1';
isbe[3124]='Ensign`en\'-sin`<a href="./study/isbe/search.html?string=BANNER">BANNER</a>`1';
isbe[3125]='Ensue`en-su\':<P>Synonymous with "to pursue," "ensue" is found in <a onClick="return mV(\'1Pe\',3,11);">1Pe 3:11</a> the King James Version as a translation of dioko, "to follow after," "to pursue."<P>Also in Judith 9:5, "such as ensued after" (ta metepeita, "the things that follow").``1';
isbe[3126]='Entangle`en-tan\'-g\'-l:<P>Found but 5 times in the Scriptures (the King James Version), once in the Old Testament, yet most significant as illustrating the process of mental, moral and spiritual confusion and enslavement.<P>(1) Physical:<P>Used of physical entanglement, as in the mazes of a labyrinth (bukh, to involve, "be perplexed"). At Moses\' command the children of Israel, before crossing the Red Sea, took the wrong way in order to give Pharaoh the impression that they were lost in the wilderness and cause him to say "They are entangled in the land" (<a onClick="return mV(\'Exd\',14,3);">Ex 14:3</a>).<P>(2) Mental:<P>pagideuo, "to entrap," "ensnare," with words, as birds are caught in a snare; compare <a onClick="return mV(\'Ecc\',9,12);">Ec 9:12</a>. The Pharisees sought to "entangle" (the Revised Version (British and American) "ensnare") Jesus in His talk (<a onClick="return mV(\'Mat\',22,15);">Mt 22:15</a>).<P>(3) Moral:<P>\'empleko, "to inweave," hence, intertwine and involve. "A god soldier of Jesus Christ," says Paul, does not "entangle himself," i.e. become involved, "in the affairs of this life" (<a onClick="return mV(\'2Ti\',2,4);">2Ti 2:4</a>). Having "escaped the defilements of the world," Christians are not to be "again entangled therein" (<a onClick="return mV(\'2Pe\',2,20);">2Pe 2:20</a>).<P>(4) Spiritual:<P>enecho, "to hold in," hence, to hold captive, as a slave in fetters or under a burden. Having experienced spiritual emancipation, freedom, through Christ from bondage to sin and false religion (<a onClick="return mV(\'Gal\',5,1);">Ga 5:1</a>; compare <a onClick="return mV(\'Gal\',4,8);">Ga 4:8</a>), the Gentiles were not to become "entangled again in a yoke of bondage" by submission to mere legal requirements, as the external rite of circumcision.<P>With reference to the thoroughness and irresistibleness of God\'s judgments, we read in <a onClick="return mV(\'Nah\',1,10);">Na 1:10</a>, "For entangled like thorns" (the King James Version "while they be folden together as thorns"), damp, closely packed and intertwined, "they are consumed utterly as dry stubble" (the King James Version "devoured as stubble fully dry").``139';
isbe[3127]='Entreat`en-tret\'.`<a href="./study/isbe/search.html?string=INTREAT">INTREAT</a>`1';
isbe[3128]='Envy`en\'-vi (qin\'ah; zelos, phthonos):<P>"Envy," from Latin in, "against," and video, "to look," "to look with ill-will," etc., toward another, is an evil strongly condemned in both the Old Testament and the New Testament. It is to be distinguished from jealousy. "We are jealous of our own; we are envious of another man\'s possessions. Jealousy fears to lose what it has; envy is pained at seeing another have" (Crabb\'s English Synonyms). In the Old Testament it is the translation of qin\'ah from kana\', "to redden," "to glow" (<a onClick="return mV(\'Job\',5,2);">Job 5:2</a>, the Revised Version (British and American) "jealousy," margin "indignation"; in <a onClick="return mV(\'Isa\',26,11);">Isa 26:11</a> the Revised Version (British and American) renders "see thy zeal for the people"; <a onClick="return mV(\'Pro\',27,4);">Pr 27:4</a>, etc.); the verb occurs in <a onClick="return mV(\'Gen\',26,14);">Ge 26:14</a>, etc.; <a onClick="return mV(\'Num\',11,29);">Nu 11:29</a> the King James Version; <a onClick="return mV(\'Psa\',106,16);">Ps 106:16</a>; <a onClick="return mV(\'Pro\',3,31);">Pr 3:31</a>, etc.; in the New Testament it is the translation of phthonos, "envy" (<a onClick="return mV(\'Mat\',27,18);">Mt 27:18</a>; <a onClick="return mV(\'Rom\',1,29);">Ro 1:29</a>; <a onClick="return mV(\'Gal\',5,21);">Ga 5:21</a>, "envyings," etc.); of zelos, "zeal", "jealousy," "envy" (<a onClick="return mV(\'Act\',13,45);">Ac 13:45</a>), translated "envying," the Revised Version (British and American) "jealousy" (<a onClick="return mV(\'Rom\',13,13);">Ro 13:13</a>; <a onClick="return mV(\'1Cr\',3,3);">1Co 3:3</a>; <a onClick="return mV(\'2Cr\',12,20);">2Co 12:20</a>; <a onClick="return mV(\'Jam\',3,14,16);">Jas 3:14, 16</a>); the verb phthoneo occurs in <a onClick="return mV(\'Gal\',5,26);">Ga 5:26</a>; zeloo in <a onClick="return mV(\'Act\',7,9);">Ac 7:9</a>; <a onClick="return mV(\'Act\',17,5);">17:5</a>, the Revised Version (British and American) "moved with jealousy"; <a onClick="return mV(\'1Cr\',13,4);">1Co 13:4</a>, "charity (the Revised Version (British and American) "love") envieth not."<P>The power of envy is stated in <a onClick="return mV(\'Pro\',27,4);">Pr 27:4</a>: "Who is able to stand before envy?" (the Revised Version (British and American) "jealousy"); its evil effects are depicted in <a onClick="return mV(\'Job\',5,2);">Job 5:2</a> (the Revised Version (British and American) "jealousy"), in <a onClick="return mV(\'Pro\',14,30);">Pr 14:30</a> (the Revised Version, margin "jealousy"); it led to the crucifixion of Christ (<a onClick="return mV(\'Mat\',27,18);">Mt 27:18</a>; <a onClick="return mV(\'Mar\',15,10);">Mr 15:10</a>); it is one of "the works of the flesh" (<a onClick="return mV(\'Gal\',5,21);">Ga 5:21</a>; compare <a onClick="return mV(\'Rom\',1,29);">Ro 1:29</a>; <a onClick="return mV(\'1Ti\',6,4);">1Ti 6:4</a>); Christian believers are earnestly warned against it (<a onClick="return mV(\'Rom\',13,13);">Ro 13:13</a> the King James Version; <a onClick="return mV(\'1Cr\',3,3);">1Co 3:3</a> the King James Version; <a onClick="return mV(\'Gal\',5,26);">Ga 5:26</a>; <a onClick="return mV(\'1Pe\',2,1);">1Pe 2:1</a>). In <a onClick="return mV(\'Jam\',4,5);">Jas 4:5</a> "envy" is used in a good sense, akin to the jealousy ascribed to God. Where the King James Version has "The spirit that dwelleth in us lusteth to envy," the Revised Version (British and American) reads "Doth the spirit which he made to dwell in us long unto envying?"; the American Revised Version, margin "The spirit which he made to dwell in us he yearneth for even unto jealous envy"; compare <a onClick="return mV(\'Jer\',3,14);">Jer 3:14</a>; <a onClick="return mV(\'Hsa\',2,19);">Ho 2:19</a>f; or the English Revised Version, margin "That spirit which he made to dwell in us yearneth (for us) even unto jealous envy." This last seems to give the sense; compare "Ye adulteresses" (<a onClick="return mV(\'Hsa\',2,4);">Ho 2:4</a>), the American Revised Version, margin "That is, who break your marriage vow to God."``185';
isbe[3129]='Epaenetus`ep-e\'-ne-tus (Epainetos, "praised"):<P>One of the Christians at Rome to whom greetings are sent by Paul (<a onClick="return mV(\'Rom\',16,5);">Ro 16:5</a>). All that is known of him is told here. Paul describes him as<P>(1) "my beloved,"<P>(2) "who is the firstfruits of Asia unto Christ."<P>Textus Receptus of the New Testament has "firstfruits of Achaia" but this wrong reading is due to <a onClick="return mV(\'1Cr\',16,15);">1Co 16:15</a>. He was one of the first Christians in the Roman province of Asia.<P>This salutation brings up the question of the destination of <a onClick="return mV(\'Rom\',16,\'3-16\');">Ro 16:3-16</a>, for it is argued that they are addressed to the church in Ephesus owing to the fact that Prisca and Aquila and Epenetus are known to have dwelt in Asia. On the other hand, there are more than 20 others in this list who are not known to have spent any time in Asia. Prisca and Aquila had once dwelt in Rome (<a onClick="return mV(\'Act\',18,2);">Ac 18:2</a>), and there is nothing unusual in an Ephesian dwelling in the capital of the empire. An interesting discovery was made in Rome of an inscription in which was the name of Epenetus, an Ephesian.``78';
isbe[3130]='Epaphras`ep\'-a-fras (Epaphras):<P>A contracted form of Epaphroditus. He must not, however, be confounded with the messenger of the Philippian community. He was with Paul during a part of his 1st Roman imprisonment, joining in Paul\'s greetings to Philemon (<a onClick="return mV(\'Phm\',1,23);">Phm 1:23</a>). Epaphras was the missionary by whose instrumentality the Colossians had been converted to Christianity (<a onClick="return mV(\'Col\',1,7);">Col 1:7</a>), and probably the other churches of the Lycus had been founded by him. In sending his salutation to the Colossians Paul testified, "He hath much labor for you, and for them in Laodicea, and for them in Hierapolis" (<a onClick="return mV(\'Col\',4,13);">Col 4:13</a>). Epaphras had brought to Paul good news of the progress of the gospel, of their "faith in Christ Jesus" and of their love toward all the saints (<a onClick="return mV(\'Col\',1,4);">Col 1:4</a>). Paul\'s regard for him is shown by his designating him "our beloved fellow-servant," "a faithful minister of Christ" (<a onClick="return mV(\'Col\',1,7);">Col 1:7</a>), and "a bondservant of Christ Jesus" (<a onClick="return mV(\'Col\',4,12);">Col 4:12</a> margin). The last designation Paul uses several times of himself, but only once of another besides Epaphras (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>).``78';
isbe[3131]='Epaphroditus`e-paf-ro-di\'-tus (Epaphroditos, "lovely"):<P>Mentioned only in <a onClick="return mV(\'Phl\',2,25);">Php 2:25</a>; <a onClick="return mV(\'Phl\',4,18);">4:18</a>. The name corresponds to the Latin Venustus (= handsome), and was very common in the Roman period. "The name occurs very frequently in inscriptions both Greek and Latin, whether at full length Epaphroditus, or in its contracted form Epaphras" (Lightfoot, Philippians, 123). Epaphroditus was the delegate of the Christian community at Philippi, sent with their gift to Paul during his first Roman imprisonment. Paul calls him "my brother and fellow-worker and fellow-soldier." "The three words are arranged in an ascending scale: common sympathy, common work, common danger and toil and suffering" (Lightfoot, l. c.). On his arrival at Rome, Epaphroditus devoted himself to "the work of Christ," both as Paul\'s attendant and as his assistant in missionary work. So assiduously did he labor that he lost his health, and "was sick nigh unto death." He recovered, however, and Paul sent him back to Philippi with this letter to quiet the alarm of his friends, who had heard of his serious illness. Paul besought for him that the church should receive him with joy and hold him in honor.``78';
isbe[3132]='Ephah (1)`e\'-fa \'ephah, "darkness"; Gephar (<a onClick="return mV(\'Gen\',25,4);">Ge 25:4</a>), Gaipha (<a onClick="return mV(\'Isa\',60,6);">Isa 60:6</a>):<P>The name of three persons in the Old Testament, both masculine and feminine<P>(1) The son of Midian, descended from Abraham by his wife Keturah (<a onClick="return mV(\'Gen\',25,4);">Ge 25:4</a>; <a onClick="return mV(\'1Ch\',1,33);">1Ch 1:33</a>), mentioned again in <a onClick="return mV(\'Isa\',60,6);">Isa 60:6</a> as a transporter of gold and frankincense from Sheba, who shall thus bring enlargement to Judah and praise to Yahweh. According to Fried. Delitzsch, Schrader, and Hommel, \'Ephah is an abbreviation of \'Ayappa, the Kha-yappa Arabs of the time of Tiglath-pileser III and Sargon. See treatment of this view in Dillmann\'s Commentary on Genesis (<a onClick="return mV(\'Gen\',25,4);">Ge 25:4</a>).<P>(2) A concubine of Caleb (<a onClick="return mV(\'1Ch\',2,46);">1Ch 2:46</a>).<P>(3) The son of Jahdai, a descendant of Judah (<a onClick="return mV(\'1Ch\',2,47);">1Ch 2:47</a>).``194';
isbe[3133]='Ephah (2)`e\'-fa (\'ephah):<P>A dry measure of about one bushel capacity. It corresponds to the bath in liquid measure and was the standard for measuring grain and similar articles since it is classed with balances and weights (<a onClick="return mV(\'Lev\',19,36);">Le 19:36</a>; <a onClick="return mV(\'Amo\',8,5);">Am 8:5</a>) in the injunctions regarding just dealing in trade. In <a onClick="return mV(\'Zec\',5,\'6-10\');">Zec 5:6-10</a> it is used for the utensil itself.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[3134]='Ephai`e\'-fi, e\'-fa-i (\'ephay, in Qere, \'ophai, in Kethibh; Iophe, Ophe, "gloomy," "obscuring," in the Septuagint, Septuagint):<P>"The Netophathite," whose sons were numbered among "the captains of the forces" left in Judah after the carrying away to Babylon (<a onClick="return mV(\'Jer\',40,\'1-\');">Jer 40</a>; <a onClick="return mV(\'Jer\',47,\'1-\');">Jer 47</a>). His sons assembled at Mizpah with Gedaliah, governor of the scattered Jews, and with him were slain by Ishmael, the son of Nethaniah (<a onClick="return mV(\'Jer\',41,3);">Jer 41:3).``1';
isbe[3135]='Epher`e\'-fer \'epher, "calf," "young deer"; Apher, Opher:<P>(1) The second son of Midian, descended from Abraham by his wife Keturah (<a onClick="return mV(\'Gen\',25,4);">Ge 25:4</a>; <a onClick="return mV(\'1Ch\',1,33);">1Ch 1:33</a>). See further Dillmann\'s Commentary on Genesis (<a onClick="return mV(\'Gen\',25,4);">Ge 25:4</a>).<P>(2) The third son of Ezra, descended from the tribe of Judah (<a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>).<P>(3) The first of five heads of their fathers\' houses, "mighty men of valor, famous men," in the halftribe of Manasseh, who dwelt between Bashan and Mt. Hermon (<a onClick="return mV(\'1Ch\',5,23,24);">1Ch 5:23-24</a>).``1';
isbe[3136]='Ephes-Dammim`e-fes-dam\'-im (\'ephec dammim):<P>Some spot between Socoh and Azekah (<a onClick="return mV(\'1Sa\',17,1);">1Sa 17:1</a>) where the Philistines were encamped; called in <a onClick="return mV(\'1Ch\',11,13);">1Ch 11:13</a>, "Pas- dammin." Ephes "end of" or "boundary" and the whole word may mean the "boundary of blood." The deep red color of the newly plowed earth in this situation is noticeable and may have given origin to the idea of "blood" (compare <a href="./study/isbe/search.html?string=ADUMMIM">ADUMMIM</A>). Cheyne suggests that from \'adhummin, to dammim, is an easy step, and that the former, meaning "red brown earth," may have been the original. No other satisfactory locality has been found to explain the name or fix the site.``117';
isbe[3137]='Ephesian; Ephesians`e-fe\'-zhan (Ephesios), e-fe\'-zhanz:<P>A term which, as in <a onClick="return mV(\'Act\',19,28,34,35);">Ac 19:28, 34-35</a> and <a onClick="return mV(\'Act\',21,29);">Ac 21:29</a>, was applied to those natives or residents of the city of Ephesus who were adherents of the cult of the goddess Diana. A Jew or a Christian, though a native of Ephesus, would probably have been designated as such, rather than as an Ephesian.``1';
isbe[3138]='Ephesians, Epistle to the`Contents<P><b>I. AUTHENTICITY</b><P class="in15">1. External Evidence<P class="in15">2. Internal Evidence<P><b>II. PLACE AND DATE OF WRITING</b><P><b>III. DESTINATION</b><P class="in15">1. Title<P class="in15">2. The Inscription<P class="in15">3. The Evidence of the Letter Itself<P class="in15">4. Conclusion<P><b>IV. RELATION TO OTHER NEW TESTAMENT WRITINGS</b><P class="in15">1. Peter<P class="in15">2. Johannine Writings<P class="in15">3. Colossians<P><b>V. THE PURPOSE</b><P><b>VI. ARGUMENT</b><P><b>VII. TEACHING</b><P><b>VIII. LITERATURE</b><hr /><P>I. Authenticity.<P>1. External Evidence:<P>None of the epistles which are ascribed to Paul have a stronger chain of evidence to their early and continued use than that which we know as the Epistle to the Ephesians. Leaving for the moment the question of the relation of Eph to other New Testament writings, we find that it not only colors the phraseology of the Apostolic Fathers, but is actually quoted. In Clement of Rome (circa 95 AD) the connection with Ephesians might be due to some common liturgical form in xlvi.6 (compare <a onClick="return mV(\'Eph\',4,6);">Eph 4:6</a>); though the resemblance is so close that we must feel that our epistle was known to Clement both here and in lxiv (compare <a onClick="return mV(\'Eph\',1,\'3-4\');">Eph 1:3-4</a>); xxxviii (compare <a onClick="return mV(\'Eph\',5,21);">Eph 5:21</a>); xxxvi (compare <a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>); lix (compare <a onClick="return mV(\'Eph\',1,18);">Eph 1:18</a>; <a onClick="return mV(\'Eph\',4,18);">4:18</a>). Ignatius (died 115) shows numerous points of contact with Ephesians, especially in his Epistle to the Ephesians. In chap. xii we read: "Ye are associates and fellow students of the mysteries with Paul, who in every letter makes mention of you in Christ Jesus." It is difficult to decide the exact meaning of the phrase "every letter," but in spite of the opinion of many scholars that it mu
