,4,1);">Ezra 4</a>; 2Esdras 7:28; Testament of the Twelve Patriarchs, <span class="noTag">Testament of Levi 18</span>; <a onClick="return mV(\'Jhn\',7,27);">Joh 7:27</a>; <a onClick="return mV(\'1Pe\',1,20);">1Pe 1:20</a>). It could be adopted by Christians because Christ had been withdrawn into heaven and would be publicly demonstrated the Christ on His return, hence used with special reference to enemies and unbelievers (<a onClick="return mV(\'Luk\',17,30);">Lu 17:30</a>; <a onClick="return mV(\'Act\',3,21);">Ac 3:21</a>; <a onClick="return mV(\'1Cr\',16,1);">1Co 16</a>; <a onClick="return mV(\'2Th\',1,7,8);">2Th 1:7-8</a>; <a onClick="return mV(\'1Pe\',1,13,20);">1Pe 1:13, 20</a>; <a onClick="return mV(\'1Pe\',5,4);">5:4</a>). Another synonymous term is "the day of the (Our) Lord," "the day," "that day," "the day of Jesus Christ." This is the rendering of the well-known Old Testament phrase. Though there is no reason in any particular passage why "the Lord" should not be Christ, the possibility exists that in some cases it may refer to God (compare "day of God" in <a onClick="return mV(\'2Pe\',3,12);">2Pe 3:12</a>). On the other hand, what the Old Testament with the use of this phrase predicates of God is sometimes in the New Testament purposely transferred to Christ. "Day," while employed of the parousia generally, is, as in the Old Testament, mostly associated with the judgment, so as to become a synonym for judgment (compare <a onClick="return mV(\'Act\',19,38);">Ac 19:38</a>; <a onClick="return mV(\'1Cr\',4,3);">1Co 4:3</a>). The phrase is found in <a onClick="return mV(\'Mat\',7,22);">Mt 7:22</a>; <a onClick="return mV(\'Mat\',24,36);">24:36</a>; <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>; <a onClick="return mV(\'Luk\',10,12);">Lu 10:12</a>; <a onClick="return mV(\'Luk\',17,24);">17:24</a>; <a onClick="return mV(\'Luk\',21,34);">21:34</a>; <a onClick="return mV(\'Act\',2,20);">Ac 2:20</a>; <a onClick="return mV(\'Rom\',13,12);">Ro 13:12</a>; <a onClick="return mV(\'1Cr\',1,8);">1Co 1:8</a>; <a onClick="return mV(\'1Cr\',3,13);">3:13</a>; <a onClick="return mV(\'1Cr\',5,5);">5:5</a>; <a onClick="return mV(\'2Cr\',1,14);">2Co 1:14</a>; <a onClick="return mV(\'Phl\',1,6);">Php 1:6</a>; <a onClick="return mV(\'Phl\',2,16);">2:16</a>; <a onClick="return mV(\'1Th\',5,2,4);">1Th 5:2, 4</a> (compare <a onClick="return mV(\'1Th\',5,5,8);">5:5, 8</a>); <a onClick="return mV(\'2Th\',2,2);">2Th 2:2</a>; <a onClick="return mV(\'2Ti\',1,12,18);">2Ti 1:12, 18</a>; <a onClick="return mV(\'2Ti\',4,8);">4:8</a>; <a onClick="return mV(\'Hbr\',10,25);">Heb 10:25</a>; <a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a>.<P>2. Signs Preceding the Parousia:<P>The parousia is preceded by certain signs heralding its approach. Judaism, on the basis of the Old Testament, had worked out the doctrine of "the woes of the Messiah," chebhele ha-mashiach, the calamities and afflictions attendant upon the close of the present and the beginning of the coming age being interpreted as birth pains of the latter. This is transferred in the New Testament to the parousia of Christ. The phrase occurs only in <a onClick="return mV(\'Mat\',24,8);">Mt 24:8</a>; <a onClick="return mV(\'Mar\',13,8);">Mr 13:8</a>, the idea, in <a onClick="return mV(\'Rom\',8,22);">Ro 8:22</a>, and allusions to it occur probably in <a onClick="return mV(\'1Cr\',7,26);">1Co 7:26</a>; <a onClick="return mV(\'1Th\',3,3);">1Th 3:3</a>; <a onClick="return mV(\'1Th\',5,\'1-\);">5</a> Besides these general "woes," and also in accord with Jewish doctrine, the appearance of the Antichrist is made to precede the final crisis. Without Jewish precedent, the New Testament links with the parousia as preparatory to it, the pouring out of the Spirit, the destruction of Jerusalem and the temple, the conversion of Israel and the preaching of the gospel to all the nations. The problem of the sequence and interrelation of these several precursors of the end is a most difficult and complicated one and, as would seem, at the present not ripe for solution. The "woes" which in our Lord\'s eschatological discourse (<a onClick="return mV(\'Mat\',24,1);">Mt 24</a>; <a onClick="return mV(\'Mar\',13,1);">Mr 13</a>; <a onClick="return mV(\'Luk\',21,\'1-\');">Lu 21</a>) are mentioned in more or less close accord with Jewish teaching are:<P class="in15">(1) wars, earthquakes and famines, "the beginning of travail";<P class="in15">(2) the great tribulation;<P class="in15">(3) commotions among the heavenly bodies; compare <a onClick="return mV(\'Rev\',6,\'2-17\');">Re 6:2-17</a>.<P>For Jewish parallels to these, compare Charles, Eschatology,326,327. Because of this element which the discourse has in common with Jewish apocalypses, it has been assumed by Colani, Weiffenbach, Weizsacker, Wendt, et al., that here two sources have been welded together, an actual prophecy of Jesus, and a Jewish or Jewish-Christian apocalypse from the time of the Jewish War 68-70 (Historia Ecclesiastica, III,5,3). In the text of Mark this so-called "small apocalypse" is believed to consist of <a onClick="return mV(\'Mar\',13,7,8,\'14-20\',\'24-47\',30,31);">13:7,8,14-20,24-27,30,31</a>. But this hypothesis mainly springs from the disinclination to ascribe to Jesus realistic eschatological expectations, and the entirely unwarranted assumption that He must have spoken of the end in purely ethical and religious terms only. That the typically Jewish "woes" bear no direct relation to the disciples and their faith is not a sufficient reason for declaring the prediction of them unworthy of Jesus. A contradiction is pointed out between the two representations, that the parousia will come suddenly, unexpectedly, and that it will come heralded by these signs. Especially in <a onClick="return mV(\'Mar\',13,30,32);">Mr 13:30, 32</a> the contradiction is said to be pointed. To this it may be replied that even after the removal of the assumed apocalypse the same twofold representation remains present in what is recognized as genuine discourse of Jesus, namely, in <a onClick="return mV(\'Mar\',13,28,29);">Mr 13:28-29</a> as compared with <a onClick="return mV(\'Mar\',13,\'32-37\');">13:32, 33-37</a> and other similar admonitions to watchfulness. A real contradiction between <a onClick="return mV(\'Mar\',13,30);">13:30</a> and <a onClick="return mV(\'Mar\',13,32);">13:32</a> does not exist. Our Lord could consistently affirm both: "This generation shall not pass away, until all these things be accomplished," and "of that day or that hour knoweth no one." To be sure, the solution should not be sought by understanding "this generation" of the Jewish race or of the human race. It must mean, according to ordinary usage, then living generation. Nor does it help matters to distinguish between the prediction of the parousia within certain wide limits and the denial of knowledge as to the precise day and hour. In point of fact the two statements do not refer to the same matter at all. "That day or that hour" in <a onClick="return mV(\'Mar\',13,32);">13:32</a> does not have "these things" of <a onClick="return mV(\'Mar\',13,30);">13:30</a> for its antecedent. Both by the demonstrative pronoun "that" and by "but" it is marked as an absolute self-explanatory conception. It simply signifies as elsewhere the day of the Lord, the day of judgment. Of "these things," the exact meaning of which phrase must be determined from the foregoing, Jesus declares that they will come to pass within that generation; but concerning the parousia, "that (great) day," He declares that no one but God knows the time of its occurrence. The correctness of this view is confirmed by the preceding parable, <a onClick="return mV(\'Mar\',13,28,29);">Mark 13:28-29</a>, where in precisely the same way "these things" and the parousia are distinguished. The question remains how much "these things" (verse <a onClick="return mV(\'Mar\',13,29);">29</a>; <a onClick="return mV(\'Luk\',21,31);">Lu 21:31</a>), "all these things" (<a onClick="return mV(\'Mat\',24,33,34);">Mt 24:33-34</a>; <a onClick="return mV(\'Mar\',13,30);">Mr 13:30</a>), "all things" (<a onClick="return mV(\'Luk\',21,32);">Lu 21:32</a>) is intended to cover of what is described in the preceding discourse. The answer will depend on what is there represented as belonging to the precursors of the end, and what as strictly constituting part of the end itself; and on the other question whether Jesus predicts one end with its premonitory signs, or refers to two crises each of which will be heralded by its own series of signs. Here two views deserve consideration. According to the one (advocated by Zahn in his Commentary on Matthew, 652-66) the signs cover only <a onClick="return mV(\'Mat\',24,\'4-14\');">Mt 24:4-14</a>.<P>What is related afterward, namely, "the abomination of desolation," great tribulation, false prophets and Christs, commotions in the heavens, the sign of the Son of Man, all this belongs to "the end" itself, in the absolute sense, and is therefore comprehended in the parousia and excepted from the prediction that it will happen in that generation, while included in the declaration that only God knows the time of its coming. The destruction of the temple and the holy city, though not explicitly mentioned in <a onClick="return mV(\'Mat\',24,\'4-14\');">Mt 24:4-14</a>, would be included in what is there said of wars and tribulation. The prediction thus interpreted would have been literally fulfilled. The objections to this view are:<P class="in15">(1) It is unnatural thus to subsume what is related in <a onClick="return mV(\'Mat\',24,\'15-29\');">24:15-29</a> under "the end." From a formal point of view it does not differ from the phenomena of <a onClick="return mV(\'Mat\',24,\'4-14\');">24:4-14</a> which are "signs."<P class="in15">(2) It creates the difficulty, that the existence of the temple and the temple-worship in Jerusalem are presupposed in the last days immediately before the parousia.<P>The "abomination of desolation" taken from <a onClick="return mV(\'Dan\',8,13);">Da 8:13</a>; <a onClick="return mV(\'Dan\',9,27);">9:27</a>; <a onClick="return mV(\'Dan\',11,31);">11:31</a>; <a onClick="return mV(\'Dan\',12,11);">12:11</a>; compare Sirach 49:2—according to some, the destruction of the city and temple, better a desecration of the temple-site by the setting up of something idolatrous, as a result of which it becomes desolate—and the flight from Judea, are put among events which, together with the parousia, constitute the end of the world. This would seem to involve chiliasm of a very pronounced sort. The difficulty recurs in the strictly eschatological interpretation of <a onClick="return mV(\'2Th\',2,3,4);">2Th 2:3-4</a>, where "the man of sin" (see <a href="./study/isbe/search.html?string=SIN,+MAN+OF">SIN, MAN OF</a>) is represented as sitting in "the temple of God" and in <a onClick="return mV(\'Rev\',11,1,2);">Re 11:1-2</a>, where "the temple of God" and "the altar," and "the court which is without the temple" and "the holy city" figure in an episode inserted between the sounding of the trumpet of the sixth angel and that of the seventh. On the other hand it ought to be remembered that eschatological prophecy makes use of ancient traditional imagery and stereotyped formulas, which, precisely because they are fixed and applied to all situations, cannot always bear a literal sense, but must be subject to a certain degree of symbolical and spiritualizing interpretation. In the present case the profanation of the temple by Antiochus Epiphanes may have furnished the imagery in which, by Jesus, Paul and John, anti-Christian developments are described of a nature which has nothing to do with Israel, Jerusalem or the temple, literally understood.<P>(3) It is not easy to conceive of the preaching of the gospel to all the nations as falling within the lifetime of that generation. It is true <a onClick="return mV(\'Rom\',1,13);">Ro 1:13</a>; <a onClick="return mV(\'Rom\',10,18);">10:18</a>; <a onClick="return mV(\'Rom\',15,\'19-24\');">15:19-24</a>; <a onClick="return mV(\'Col\',1,6);">Col 1:6</a>; <a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>; <a onClick="return mV(\'2Ti\',4,17);">2Ti 4:17</a> might be quoted in support of such a view. In the statement of Jesus, however, it is definitely predicted that the preaching of the gospel to all the nations not only must happen before the end, but that it straightway precedes the end: "Then shall the end come" (<a onClick="return mV(\'Mat\',24,14);">Mt 24:14</a>). To distinguish between the preaching of the gospel to all the nations and the completion of the Gentile mission, as Zahn proposes, is artificial. As over against these objections, however, it must be admitted that the grouping of all these later phenomena before the end proper avoids the difficulty arising from "immediately" in <a onClick="return mV(\'Mat\',24,29);">Mt 24:29</a> and from "in those days" in <a onClick="return mV(\'Mar\',13,24);">Mr 13:24</a>.<P>The other view has been most lucidly set forth by Briggs, Messiah of the Gospels, 132-65. It makes Jesus\' discourse relate to two things:<P class="in15">(1) the destruction of Jerusalem and the temple;<P class="in15">(2) the end of the world.<P>He further assumes that the disciples are informed with respect to two points:<P class="in15">(1) the time;<P class="in15">(2) the signs.<P>In the answer to the time, however, the two things are not sharply distinguished, but united into one prophetic perspective, the parousia standing out more conspicuously. The definition of the time of this complex development is: (a) negative (<a onClick="return mV(\'Mar\',13,\'5-8\');">Mr 13:5-8</a>); (b) positive (<a onClick="return mV(\'Mar\',13,\'9-13\');">Mr 13:9-13</a>). On the other hand in describing the signs Jesus discriminates between (a) the signs of the destruction of Jerusalem and the temple (<a onClick="return mV(\'Mar\',13,\'14-20\');">Mr 13:14-20</a>); (b) the signs of the parousia (<a onClick="return mV(\'Mar\',13,\'24-27\');">Mr 13:24-27</a>). This view has in its favor that the destruction of the temple and the city, which in the question of the disciples figured as an eschatological event, is recognized as such in the answer of Jesus, and not alluded to after a mere incidental fashion, as among the signs. Especially the version of <a onClick="return mV(\'Luk\',21,\'20-24\');">Lu 21:20-24</a> proves that it figures as an event. This view also renders easier the restriction of <a onClick="return mV(\'Mar\',13,30);">Mr 13:30</a> to the first event and its signs. It places "the abomination of desolation" in the period preceding the national catastrophe. The view that the two events are successively discussed is further favored by the movement of thought in <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>ff. Here, after the Apocalypse has been brought to a close, the application to the disciples is made, and, in the same order as was observed in the prophecy, first, the true attitude toward the national crisis is defined in the parable of the Fig Tree and the solemn assurance appended that it will happen in this generation (<a onClick="return mV(\'Mar\',13,\'28-31\');">13:28-31</a>); secondly, the true attitude toward the parousia is defined (<a onClick="return mV(\'Mar\',13,\'32-37\');">13:32-37</a>). The only serious objection that may be urged against this view arises from the close concatenation of the section relating to the national crisis with the section relating to the parousia (<a onClick="return mV(\'Mat\',24,29);">Mt 24:29</a>: "immediately after...those days"; <a onClick="return mV(\'Mar\',13,24);">Mr 13:24</a>: "in those days"). The question is whether this mode of speaking can be explained on the principle of the well-known foreshortening of the perspective of prophecy. It cannot be a priori denied that this peculiarity of prophetic vision may have here characterized also the outlook of Jesus into the future which, as <a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a> shows, was the prophetic outlook of His human nature as distinct from the Divine omniscience. The possibility of misinterpreting this feature and confounding sequence in perspective with chronological succession is in the present case guarded against by the statement that the gospel must first be preached to all the nations (compare <a onClick="return mV(\'Act\',3,19,25,26);">Ac 3:19, 25-26</a>; <a onClick="return mV(\'Rom\',11,25);">Ro 11:25</a>; <a onClick="return mV(\'Rev\',6,2);">Re 6:2</a>) before the end can come, that no one knows the time of the parousia except God, that there must be a period of desolation after the city shall have been destroyed, and that the final coming of Jesus to the people of Israel will be a coming not of judgment, but one in which they shall hail Him as blessed (<a onClick="return mV(\'Mat\',23,38,39);">Mt 23:38-39</a>; <a onClick="return mV(\'Luk\',13,34,35);">Lu 13:34-35</a>), which presupposes an interval to account for this changed attitude (compare <a onClick="return mV(\'Luk\',21,24);">Lu 21:24</a>: "until the times of the Gentiles be fulfilled"). It is not necessary to carry the distinction between the two crises joined together here into the question as put by the disciples in <a onClick="return mV(\'Mat\',24,3);">Mt 24:3</a>, as if "when shall these things be?" related to the destruction of the temple exclusively, as the other half of the question speaks of the coming of Jesus and the end of the world. Evidently here not the two events, but the events (complexly considered) and the signs are distinguished. "These things" has its antecedent not exclusively in <a onClick="return mV(\'Mat\',24,2);">24:2</a>, but even more in <a onClick="return mV(\'Mat\',23,38,39);">23:38-39</a>.<P>The disciples desired to know not so much when the calamitous national catastrophe would come, but rather when that subsequent coming of the Lord would take place, which would put a limit to the distressing results of this catastrophe, and bring with it the reacceptance of Israel into favor. This explains also why Jesus does not begin His discourse with the national crisis, but first takes up the question of the parousia, to define negatively and positively the time of the latter, and that for the purpose of warning the disciples who in their eagerness for the ultimate issue were inclined to foreshorten the preceding calamitous developments. That Jesus could actually join together the national and the cosmical crises appears from other passages, such as <a onClick="return mV(\'Mat\',10,23);">Mt 10:23</a>, where His interposition for the deliverance of the fugitive disciples is called a "coming" of the Son of Man (<a onClick="return mV(\'Mat\',16,28);">Mt 16:28</a>; <a onClick="return mV(\'Mar\',9,1);">Mr 9:1</a>; <a onClick="return mV(\'Luk\',9,27);">Lu 9:27</a>, where a coming of the Son of Man in His kingdom (Matthew), or a coming of the kingdom of God with power (Mark), or a seeing of the kingdom of God (Luke) is promised to some of that generation). It is true these passages are frequently referred to the parousia, because in the immediately preceding context the latter is spoken of. The connection of thought, however, is not that the parousia and this promised coming are identical. The proximate coming is referred to as an encouragement toward faithfulness and self-sacrifice, just as the reward at the parousia is mentioned for the same purpose. The conception of an earlier coming also receives light from the confession of Jesus at His trial (<a onClick="return mV(\'Mat\',26,64);">Mt 26:64</a>; where the "henceforth" refers equally to the coming on the clouds of heaven and to the sitting at the right hand of God; compare <a onClick="return mV(\'Mar\',14,62);">Mr 14:62</a>; <a onClick="return mV(\'Luk\',22,69);">Lu 22:69</a>). The point of the declaration is, that He who now is condemned will in the near future appear in theophany for judgment upon His judges. The closing discourses of John also have the conception of the coming of Jesus to His disciples in the near future for an abiding presence, although here this is associated with the advent of the Spirit (<a onClick="return mV(\'Jhn\',14,18,19,21,23);">Joh 14:18-19, 21, 23</a>; <a onClick="return mV(\'Jhn\',16,16,19,22,23);">16:16, 19, 22-23</a>). Finally the same idea recurs in Rev, where it is equally clear that a preliminary visitation of Christ and not the parousia for final judgment can be meant (<a onClick="return mV(\'Jhn\',2,5,);">Joh 2:5, 16</a>; <a onClick="return mV(\'Jhn\',3,3,10);">3:3, 10</a>; compare also the plural "one of the days of the Son of man" in <a onClick="return mV(\'Luk\',17,22);">Lu 17:22</a>).<P>3. Events Preceding the Parousia:<P>(1) The Conversion of Israel:<P>To the events preceding the parousia belongs, according to the uniform teaching of Jesus, Peter and Paul, the conversion of Israel (<a onClick="return mV(\'Mat\',23,39);">Mt 23:39</a>; <a onClick="return mV(\'Luk\',13,35);">Lu 13:35</a>; <a onClick="return mV(\'Act\',1,6,7);">Ac 1:6-7</a>; <a onClick="return mV(\'Act\',3,19,21);">3:19, 21</a>; where the arrival of "seasons of refreshing" and "the times of restoration of all things" is made dependent on the (eschatological) sending of the Christ to Israel), and this again is said to depend on the repentance and conversion and the blotting out of the sins of Israel; <a onClick="return mV(\'Rom\',11,\'1-\');">Ro 11</a>, where the problem of the unbelief of Israel is solved by the twofold proposition: (1) that there is even now among Israel an election according to grace; (2) that in the future there will be a comprehensive conversion of Israel (<a onClick="return mV(\'Rom\',11,5,\'25-32\');">Ro 11:5, 25-32</a>).<P>(2) The Coming of the Antichrist:<P>Among the precursors of the parousia appears further the Antichrist. The word is found in the New Testament in <a onClick="return mV(\'1Jo\',2,18,22);">1Joh 2:18, 22</a>; <a onClick="return mV(\'1Jo\',4,3);">4:3</a>; <a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a> only, but the conception occurs also in the Synoptics, in Paul and in Revelation. There is no instance of its earlier occurrence in Jewish literature. Anti may mean "in place of" and "against"; the former includes the latter. In John it is not clear that the heretical tendencies or hostile powers connected with the anti-Christian movement make false claim to the Messianic dignity. In the Synoptics the coming of false Christs and false prophets is predicted, and that not merely as among the nearer signs (<a onClick="return mV(\'Mar\',13,6);">Mr 13:6</a>), but also in the remote eschatological period (<a onClick="return mV(\'Mar\',13,22);">Mr 13:22</a>). With Paul, who does not employ the word, the conception is clearly the developed one of the counter-Christ. Paul ascribes to him an apokalupsis as he does to Christ (<a onClick="return mV(\'2Th\',2,6,8);">2Th 2:6, 8</a>); his manner of working and its pernicious effect are set over against the manner in which the gospel of the true Christ works (<a onClick="return mV(\'2Th\',9,\'1-\');">2Th 9-12</a>). Paul does not treat the idea as a new one; it must have come down from the Old Testament and Jewish eschatology and have been more fully developed by New Testament prophecy; compare in <a onClick="return mV(\'Dan\',7,8,20);">Da 7:8, 20</a>; <a onClick="return mV(\'Dan\',8,10,11);">8:10-11</a> the supernaturally magnified figure of the great enemy. According to Gunkel (Schopfung und Chaos, 1895) and Bousset (Der Antichrist in der Uberlieferung des Judenthums, des New Testament und der allen Kirche, 1875) the origin of the conception of a final struggle between God and the supreme enemy must be sought in the ancient myth of Chaos conquered by Marduk; what had happened at the beginning of the world was transferred to the end. Then this was anthropomorphized, first in the form of a false Messiah, later in that of a political tyrant or oppressor. But there is no need to assume any other source for the idea of a last enemy than Old Testament eschatological prophecy (Ezekiel and Daniel and Zechariah). And no evidence has so far been adduced that the Pauline idea of a counter-Messiah is of pre-Christian origin. This can only be maintained by carrying back into the older period the Antichrist tradition as found later among Jews and Christians. It is reasonable to assume in the present state of the evidence that the combination of the two ideas, that of the great eschatological enemy and that of the counter-Messiah, is a product of Christian prophecy. In fact even the conception of a single last enemy does not occur in pre- Christian Jewish literature; it is found for the first time in Apocrypha Baruch 40:1,2, which changes the general conception of 4Ezra to this effect. Even in the eschatological discourse of Jesus the idea is not yet unified, for false Christs and false prophets in the plural are spoken of, and the instigator of "the abomination of desolation," if any is presupposed, remains in the background. In the Epistle of John the same plural representation occurs (<a onClick="return mV(\'1Jo\',2,18,22);">1Joh 2:18, 22</a>; <a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a>), although the idea of a personal Antichrist in whom the movement culminates is not only familiar to the author and the reader (<a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a>, "as ye heard that antichrist cometh"), but is also accepted by the writer (<a onClick="return mV(\'1Jo\',4,3);">1Joh 4:3</a>, "This is the spirit of the antichrist, whereof ye have heard that it cometh; and now it is in the world already"; compare <a onClick="return mV(\'2Th\',2,7);">2Th 2:7</a>, "The mystery of lawlessness doth already work").<P>Various views have been proposed to explain the concrete features of the Pauline representation in <a onClick="return mV(\'2Th\',2,\'1-\');">2Th 2</a> and that of <a onClick="return mV(\'Rev\',13,\'1-\');">Re 13</a> and <a onClick="return mV(\'Rev\',17,\'1-\');">17</a>. According to Schneckenburger, JDT, 1859, and Weiss, SK, 1869, Paul has in mind the person whom the Jews will acclaim as their Messiah. The idea would then be the precipitate of Paul\'s experience of hostility and persecution from the part of the Jews. He expected that this Jewish Messianic pretender would, helped by Satanic influence, overthrow the Roman power. The continuance of the Roman power is "that which restraineth," or as embodied in the emperor, "one that restraineth now" (<a onClick="return mV(\'2Th\',2,6,7);">2Th 2:6-7</a>). (For an interesting view in which the roles played by these two powers are reversed, compare Warfield in The Expositor, 3rd series, IV, 30-44.) The objection to this is that "the lawless one," not merely from Paul\'s or the Christian point of view, but in his own avowed intent, opposes and exalts himself against all that is called God or worshipped. This no Jewish pretender to the Messiahship could possibly do: his very Messianic position would preclude it. And the conception of a counter-Christ does not necessarily point to a Jewish environment, for the idea of Messiahship had in Paul\'s mind been raised far above its original national plane and assumed a universalistic character (compare Zahn, Einleitung in das NT(1), I, 171). Nor does the feature that according to <a onClick="return mV(\'2Th\',2,4);">2Th 2:4</a>, "the lawless one" will take his seat in the temple favor the view in question, for the desecration of the temple by Antiochus Epiphanes and later similar experiences may well have contributed to the figure of the great enemy the attribute of desecrator of the temple. It is not necessary to assume that by Paul this was understood literally; it need mean no more than that the Antichrist will usurp for himself Divine honor and worship. Patristic and later writers gave to this feature a chiliastic interpretation, referring it to the temple which was to be rebuilt in the future. Also the allegorical exegesis which understands "the temple" of the Christian church has found advocates. But the terms in which "the lawless one" is described exclude his voluntary identification with the Christian church. According to a second view the figure is not a Jewish but a pagan one. Kern, Baur, Hilgenfeld and many others, assuming that 2 Thessalonians is post-Pauline, connect the prophecy with the at-one-time current expectation that Nero, the great persecutor, would return from the East or from the dead, and, with the help of Satan, set up an anti-Christian kingdom. The same expectation is assumed to underlie <a onClick="return mV(\'Rev\',13,3,12,14);">Re 13:3,12,14</a> (one of the heads of the beast smitten unto death and his death stroke healed); <a onClick="return mV(\'Rev\',17,8,10,11);">17:8,10-11</a> (the beast that was, and is not, and is about to come up out of the abyss; the eighth king, who is one of the seven preceding kings).<P>As to Paul\'s description, there is nothing in it to make us think of a Nero reappearing or redivivus. The parousia predicated of the lawless one does not imply it, for parousia as an eschatological term means not "return" but "advent." The Antichrist is not depicted as a persecutor, and Nero was the persecutor par excellence. Nor does what is said about the "hindering" or the "hinderer" suit the case of Nero, for the later Roman emperors could not be said to hold back Nero\'s reappearance. As to Revelation, it must be admitted that the role here ascribed to the beast would be more in keeping with the character of Nero. But, as Zahn has well pointed out (Einleitung in das NT(1), II, 617-26), this interpretation is incompatible with the date of Revelation. This book must have been written at a date when the earlier form of the expectation that Nero would reappear still prevailed, namely, that he would return from the East to which he had fled. Only when too long an interval had elapsed to permit of further belief in Nero\'s still being alive, was this changed into the superstition that he would return from the dead. But this change in the form of the belief did not take place until after Revelation must have been written. Consequently, if the returning Nero did figure in Revelation, it would have to be in the form of one reappearing from the East. As a matter of fact, however, the beast or the king in which Nero is found is said by <a onClick="return mV(\'Rev\',13,1);">Re 13:1</a>; <a onClick="return mV(\'Rev\',17,8);">17:8</a> to have been smitten unto death and healed of the death stroke, to come up out of the sea or the abyss, which would only suit the later form of the expectation. It is therefore necessary to dissociate the description of the beast and its heads and horns entirely from the details of the succession of the Roman empire; the prophecy is more grandly staged; the description of the beast as partaking of several animal forms in <a onClick="return mV(\'Rev\',13,2);">Re 13:2</a> refers back to Daniel, and here as there must be understood of the one world-power in its successive national manifestations, which already excludes the possibility that a mere succession of kings in one and the same empire can be thought of. The one of the heads smitten unto death and the death stroke healed must refer to the world-power to be made powerless in one of its phases, but afterward to revive in a new phase. Hence, here already the healing of the death stroke is predicated, not merely of one of the heads, but also of the beast itself (compare <a onClick="return mV(\'Rev\',13,3);">Re 13:3</a> with <a onClick="return mV(\'Rev\',13,12);">13:12</a>).<P>And the same interpretation seems to be required by the mysterious statements of <a onClick="return mV(\'Rev\',17,\'1-\');">Re 17</a>, where the woman sitting upon the beast is the metropolis of the world-power, changing its seat together with the latter, yet so as to retain, like the latter in all its transformations, the same character whence she bears the same name of Babylon (<a onClick="return mV(\'Rev\',17,5);">17:5</A>). Here as in <a onClick="return mV(\'Rev\',13,\'1-\');">Re 13</a> the beast has seven heads, i.e. passes through seven phases, which idea is also expressed by the representation that these seven heads are seven kings (<a onClick="return mV(\'Rev\',17,10);">17:10</a>), for, as in <a onClick="return mV(\'Dan\',7,\'1-\');">Da 7</a>, the kings stand not for individual rulers, but for kingdoms, phases of the world-power. This explains why in <a onClick="return mV(\'Rev\',17,11);">Re 17:11</a> the beast is identified with one of the kings. When here the further explanation, going beyond <a onClick="return mV(\'Rev\',13,\'1-\');">Re 13</a>, is added, that the beast was and is not and is about to come up out of the abyss (<a onClick="return mV(\'Rev\',13,8);">13:8</a>), and in <a onClick="return mV(\'Rev\',13,10,11);">13:10-11</a> that of the seven kings five are fallen, one is, the other is not yet come, and when he comes must continue a little while, to be followed by the eighth, who is identical with the beast that was and is not, and with one of the seven, the only way to reconcile these statements lies in assuming that "the beast," while in one sense a comprehensive figure for the world-power in all its phases, can also in another sense designate the supreme embodiment and most typical manifestation of the world-power in the past; in respect to this acute phase the beast was and is not and is to appear again, and this acute phase was one of seven successive forms of manifestation, and in its reappearance will add to this number the eighth. Although a certain double sense in the employment of the figures thus results, this is no greater than when on the other view Nero is depicted both as "the beast" and as one of the heads of "the beast." Which concrete monarchies are meant by these seven phases is a matter of minor importance. For a suggestion compare Zahn, op. cit., II, 624: (1) Egypt; (2) Assyria; (3) Babylon; (4) the Medo-Persian power; (5) the Greco-Alexandrian power; (6) the Roman power; (7) a short-lived empire to succeed Rome; (8) the eighth and last phase, which will reproduce in its acute character the fifth, and will bring on the scene the Antichrist, the counterpart and, as it were, reincarnation of Antiochus Epiphanes. The seer evidently has his present in the Roman phase of the power of the beast, and this renders it possible for him to give in <a onClick="return mV(\'Rev\',17,9);">Re 17:9</a> another turn to the figure of the seven heads, interpreting it of the seven mountains on which the woman sits, but this apocalyptic looseness of handling of the imagery can furnish no objection to the view just outlined, since on any view the two incongruous explanations of the seven heads as seven mountains and seven kings stand side by side in <a onClick="return mV(\'Rev\',17,9);">Re 17:9</a> and <a onClick="return mV(\'Rev\',17,10);">10</a>. Nor should the mysterious number of 666 in <a onClick="return mV(\'Rev\',13,18);">13:18</a> be appealed to in favor of the reference of the beast to Nero, for on the one hand quite a number of other equally plausible or implausible solutions of this riddle have been proposed, and on the other hand the interpretation of Nero is open to the serious objection, that in order to make out the required number from the letters of Nero\'s name this name has to be written in Hebrew characters and that with scriptio defectiva of Qesar (Neron Qesar) instead of Qeisar, the former of which two peculiarities is out of keeping with the usage of the book elsewhere (compare Zahn, op. cit., II, 622, 624, 625, where the chief proposed explanations of the number 666 are recorded). Under the circumstances the interpretation of the figure of the beast and its heads must be allowed to pursue its course independently of the mystery of the number 666 in regard to which no certain conclusion appears attainable.<P>The following indicates the degree of definiteness to which, in the opinion of the writer, it is possible to go in the interpretation of the prophecy. The terms in which, Paul speaks remind of Daniel\'s description of the "little horn." Similarly Revelation attaches itself to the imagery of the beasts in Daniel. Both Paul and Revelation also seem to allude to the self-deification of rulers in the Hellenistic and Roman world (compare Zeitsehrift fur neutestamentliche Wissenschaft, 1904, 335ff). Both, therefore, appear to have in mind a politically organized world-power under a supreme head. Still in both cases this power is not viewed as the climax of enmity against God on account of its political activity as such, but distinctly on account of its self-assertion in the religious sphere, so that the whole conception is lifted to a higher plane, purely spiritual standards being applied in the judgment expressed. Paul so thoroughly applies this principle that in his picture the seductive, deceptive aspect of the movement in the sphere of false teaching is directly connected with the person of "the lawless one" himself (<a onClick="return mV(\'2Th\',2,\'9-12\');">2Th 2:9-12</a>), and not with a separate organ of false prophecy, as in <a onClick="return mV(\'Rev\',13,\'11-17\');">Re 13:11-17</a> (the second beast). In Revelation, as shown above, the final and acute phase of anti-Christian hostility is clearly distinguished from its embodiment in the Roman empire and separated from the latter by an intermediate stage. In Paul, who stands at a somewhat earlier point in the development of New Testament prophecy, this is not so clearly apparent. Paul teaches that the "mystery of lawlessness" is already at work in his day, but this does not necessarily involve that the person of "the lawless one," subsequently to appear, must be connected with the same phase of the world-power, with which Paul associates this mystery already at work, since the succeeding phases being continuous, this will also insure the continuity between the general principle and its personal representative, even though the latter should appear at a later stage. It is impossible to determine how far Paul consciously looked beyond the power of the Roman empire to a later organIzation as the vehicle for the last anti-Christian effort. On the other hand, that Paul must have thought of "the lawless one" as already in existence at that time cannot be proven. It does not follow from the parallelism between his "revelation" and the parousia of Christ, for this "revelation" has for its correlate simply a previous hidden presence for some time somewhere, not an existence necessarily extending to Paul\'s time or the time of the Roman empire, far less a pre-existence, like unto Christ\'s, in the supernatural world. Nor is present existence implied in what Paul says of "the hindering power." This, to be sure, is represented as asserting itself at that very time, but the restraint is not exerted directly upon "the lawless one"; it relates to the power of which he will be the ultimate exponent; when this power, through the removal of the restraint, develops freely, his revelation follows. According to <a onClick="return mV(\'2Th\',2,9);">2Th 2:9</a> his "parousia is according to the working of Satan," but whether this puts a supernatural aspect upon the initial act of his appearance or relates more to his subsequent presence and activity in the world, which will be attended with all powers and signs and lying wonders, cannot be determined with certainty. But the element of the supernatural is certainly there, although it is evidently erroneous to conceive of "the lawless one" as an incarnation of Satan, literally speaking. The phrase "according to the working of Satan" excludes this, and "the lawless one" is a true human figure, "the man of sin" (or "the man of lawlessness," according to another reading; compare the distinction between Satan and "the beast" in <a onClick="return mV(\'Rev\',20,10);">Re 20:10</a>), <a onClick="return mV(\'2Th\',2,3);">2Th 2:3</a>. The "power" and "signs" and "wonders" are not merely "seeming"; the genitive pseudous is not intended to take them out of the category of the supernatural, but simply means that what they are intended to accredit is a lie, namely, the Divine dignity of "the lawless one." Most difficult of all is the determination of what Paul means by the hindering power or the hinderer in <a onClick="return mV(\'2Th\',2,7);">2Th 2:7</a>.<P>The most common view refers this to the Roman authority as the basis of civil order and protection, but there are serious objections to this. If Paul at all associated the Antichrist in any way with the Roman power, he cannot very well have sought the opposite principle in the same quarter. And not only the hindering power but also the hindering person seems to be a unit, which latter does not apply to the Roman empire, which had a succession of rulers. It is further difficult to dismiss the thought that the hindering principle or person must be more or less supernatural, since the supernatural factor in the work of "the lawless one" is so prominent. For this reason there is something attractive in the old view of von Hofmann, who assumed that Paul borrowed from Daniel, besides other features, also this feature that the historical conflict on earth has a supernatural background in the world of spirits (compare <a onClick="return mV(\'Dan\',10,\'1-\');">Da 10</a>). A more precise definition, however, is impossible. Finally it should be noticed that, as in the eschatological discourse of Jesus "the abomination of desolation" appears connected with an apostasy within the church through false teaching (<a onClick="return mV(\'Mar\',13,22,23);">Mr 13:22-23</a>), so Paul joins to the appearance of "the lawless one" the destructive effect of error among many that are lost (<a onClick="return mV(\'2Th\',2,\'9-12\');">2Th 2:9-12</a>). The idea of the Antichrist in general and that of the apostasy in particular reminds us that we may not expect an uninterrupted progress of the Christianization of the world until the parousia. As the reign of the truth will be extended, so the forces of evil will gather strength, especially toward the end. The universal sway of the kingdom of God cannot be expected from missionary effort alone; it requires the eschatological inter-position of God.<P>4. The Manner of the Parousia:<P>In regard to the manner and attending circumstances of the parousia we learn that it will be widely visible, like the lightning (<a onClick="return mV(\'Mat\',24,27);">Mt 24:27</a>; <a onClick="return mV(\'Luk\',17,24);">Lu 17:24</a>; the point of comparison does not lie in the suddenness); to the unbelieving it will come unexpectedly (<a onClick="return mV(\'Mat\',24,\'37-42\');">Mt 24:37-42</a>; <a onClick="return mV(\'Luk\',17,\'26-32\');">Lu 17:26-32</a>; <a onClick="return mV(\'1Th\',5,2,3);">1Th 5:2-3</a>). A sign will precede, "the sign of the Son of Man," in regard to the nature of which nothing can be determined. Christ will come "on the clouds," "in clouds," "in a cloud," "with great power and glory" (<a onClick="return mV(\'Mat\',24,30);">Mt 24:30</a>; <a onClick="return mV(\'Mar\',13,26);">Mr 13:26</a>; <a onClick="return mV(\'Luk\',21,27);">Lu 21:27</a>); attended by angels (<a onClick="return mV(\'Mat\',24,31);">Mt 24:31</a> (compare <a onClick="return mV(\'Mat\',13,41);">Mt 13:41</a>; <a onClick="return mV(\'Mat\',16,27);">16:27</a>; <a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a>; <a onClick="return mV(\'Luk\',9,26);">Lu 9:26</a>); <a onClick="return mV(\'Mar\',13,27);">Mr 13:27</a>; <a onClick="return mV(\'2Th\',1,7);">2Th 1:7</a>).<A href="file:./study/isbe/3100.html?toc=3181"><p>Continued...``182';
isbe[3181]='Eschatology of the New Testament, VI-X`VI. The Resurrection.<P>The resurrection coincides with the parousia and the arrival of the future aeon (<a onClick="return mV(\'Luk\',20,35);">Lu 20:35</a>; <a onClick="return mV(\'Jhn\',6,40);">Joh 6:40</a>; <a onClick="return mV(\'1Th\',4,16);">1Th 4:16</a>). From <a onClick="return mV(\'1Th\',3,13);">1Th 3:13</a>; <a onClick="return mV(\'1Th\',4,16);">4:16</a> it has been inferred that the dead rise before the descent of Christ from heaven is completed; the sounds described in the later passage are then interpreted as sounds accompanying the descent (compare <a onClick="return mV(\'Exd\',19,16);">Ex 19:16</a>; <a onClick="return mV(\'Isa\',27,13);">Isa 27:13</a>; <a onClick="return mV(\'Mat\',24,31);">Mt 24:31</a>; <a onClick="return mV(\'1Cr\',15,52);">1Co 15:52</a>; <a onClick="return mV(\'Hbr\',12,19);">Heb 12:19</a>; <a onClick="return mV(\'Rev\',10,7);">Re 10:7</a>; <a onClick="return mV(\'Rev\',11,15);">11:15</a>; "the trump of God" = the great eschatological trumpet). The two words for the resurrection are egeirein, "to wake," and anistanai, "to raise," the latter less common in the active than in the intransitive sense.<P>1. Its Universality:<P>The New Testament teaches in some passages with sufficient clearness that all the dead will be raised, but the emphasis rests to such an extent on the soteriological aspect of the event, especially in Paul, where it is closely connected with the doctrine of the Spirit, that its reference to non-believers receives little notice. This was already partly so in the Old Testament (<a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a>; <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>). In the intervening Jewish literature the doctrine varies; sometimes a resurrection of the martyrs alone is taught (Enoch 90); sometimes of all the righteous dead of Israel (<span class="noTag">Psalms of Solomon 3:10</span>ff; Enoch 91-94.); sometimes of all the righteous and of some wicked Israelites (Enoch 1-36); sometimes of all the righteous and all the wicked (<a onClick="return mV(\'Ezr\',4,\'1-\');">Ezra 4</a>; 2Esdras 5:45; 7:32;). Josephus ascribes to the Pharisees the doctrine that only the righteous will share in the resurrection. It ought to be noticed that these apocalyptic writings which affirm the universality of the resurrection present the same phenomena as the New Testament, namely, that they contain passages which so exclusively reflect upon the resurrection in its bearing upon the destiny of the righteous as to create the appearance that no other resurrection was believed in. Among the Pharisees probably a diversity of opinion prevailed on this question, which Josephus will have obliterated. Our Lord in His argument with the Sadducees proves only the resurrection of the pious, but does not exclude the other (<a onClick="return mV(\'Mar\',12,26,27);">Mr 12:26-27</a>); "the resurrection of the just" in <a onClick="return mV(\'Luk\',14,14);">Lu 14:14</a> may suggest a twofold resurrection. It has been held that the phrase, he anastasis he ek nekron <a onClick="return mV(\'Luk\',20,35);">Lu 20:35</a>; <a onClick="return mV(\'Act\',4,2);">Ac 4:2</a>, always describes the resurrection of a limited number from among the dead, whereas he anastasisis ton nekron would be descriptive of a universal resurrection Plummer, Commentary on <a onClick="return mV(\'Luk\',20,35);">Lu 20:35</a>, but such a distinction breaks down before an examination of the passages.<P>The inference to the universality of the resurrection sometimes drawn from the universality of the judgment is scarcely valid, since the idea of a judgment of disembodied spirits is not inconceivable and actually occurs. On the other hand the punishment of the judged is explicitly affirmed to include the body (<a onClick="return mV(\'Mat\',10,28);">Mt 10:28</a>). It cannot be proven that the term "resurrection" is ever in the New Testament eschatologically employed without reference to the body, of the quickening of the spirit simply (against, Fries, in ZNTW, 1900, 291ff). The sense of our Lord\'s argument with the Sadducees does not require that the patriarchs were at the time of Moses in possession of the resurrection, but only that they were enjoying the covenant-life, which would in due time inevitably issue in the resurrection of their bodies. The resemblance (or "equality") to the angels (<a onClick="return mV(\'Mar\',12,25);">Mr 12:25</a>) does not consist in the disembodied state, but in the absence of marriage and propagation. It has been suggested that Hebrews contains no direct evidence for a bodily resurrection (Charles, Eschatology, 361), but compare <a onClick="return mV(\'Heb\',11,22,35);">11:22, 35</a>; <a onClick="return mV(\'Heb\',12,2);">12:2</a>; <a onClick="return mV(\'Heb\',13,20);">13:20</a>. The spiritualism of the epistle points, in connection with its Pauline type of teaching, to the conception of a pneumatic heavenly body, rather than to a disembodied state.<P>2. The Millennium:<P>The New Testament confines the event of the resurrection to a single epoch, and nowhere teaches, as chiliasm assumes, a resurrection in two stages, one, at the parousia, of saints or martyrs, and a second one at the close of the millennium. Although the doctrine of a temporary Messianic kingdom, preceding the consummation of the world, is of pre-Christian Jewish origin, it had not been developed in Judaism to the extent of assuming a repeated resurrection; the entire resurrection is always placed at the end. The passages to which this doctrine of a double resurrection appeals are chiefly <a onClick="return mV(\'Act\',3,\'19-21\');">Ac 3:19-21</a>; <a onClick="return mV(\'1Cr\',15,\'23-28\');">1Co 15:23-28</a>; <a onClick="return mV(\'Phl\',3,\'9-11\');">Php 3:9-11</a>; <a onClick="return mV(\'1Th\',4,\'13-18\');">1Th 4:13-18</a>; <a onClick="return mV(\'2Th\',1,\'5-12\');">2Th 1:5-12</a>; <a onClick="return mV(\'Rev\',20,\'1-6\');">Re 20:1-6</a>. In the first-named passage Peter promises "seasons of refreshing," when Israel shall have repented and turned to God. The arrival of these coincides with the sending of the Christ to the Jews, i.e. with the parousia. It is argued that Peter in <a onClick="return mV(\'Act\',3,21);">Ac 3:21</a>, "whom the heavens must (present tense) receive until the times of restoration of all things," places after this coming of Jesus to His people a renewed withdrawal of the Lord into heaven, to be followed in turn, after a certain interval, by the restoration of all things. The "seasons of refreshing" would then constitute the millennium with Christ present among His people. While this interpretation is not grammatically impossible, there is no room for it in the general scheme of the Petrine eschatology, for the parousia of Christ is elsewhere represented as bringing not a provisional presence, but as bringing in the day of the Lord, the day of judgment (<a onClick="return mV(\'Act\',2,\'17-21\');">Ac 2:17-21</a>). The correct view is that "the seasons of refreshing" and "the times of restoration of all things" are identical; the latter phrase relates to the prospects of Israel as well as the former, and should not be understood in the later technical sense. The present tense in <a onClick="return mV(\'Act\',3,21);">Ac 3:21</a> "must receive" does not indicate that the reception of Christ into heaven still lies in the future, but formulates a fixed eschatological principle, namely, that after His first appearance the Christ must be withdrawn into heaven till the hour for the parousia has come. In <a onClick="return mV(\'1Cr\',15,\'23-28\');">1Co 15:23-28</a> two tagmata, "orders," of the resurrection are distinguished, and it is urged that these consist of "believers" and "non-believers." But there is no reflection here upon non-believers at all, the two "orders" are Christ, and they that are Christ\'s. "The end" in <a onClick="return mV(\'1Cr\',15,24);">15:24</a> is not the final stage in the resurrection, i.e. the resurrection of non-believers, but the end of the series of eschatological events. The kingdom of Christ which comes to a close with the end is not a kingdom beginning with the parousia, but dates from the exaltation of Christ; it is to Paul not future but already in operation.<P>In <a onClick="return mV(\'1Th\',4,\'13-18\');">1Th 4:13-18</a> the presupposition is not that the readers had worried about a possible exclusion of their dead from the provisional reign of Christ and from a first resurrection, but that they had sorrowed even as the Gentiles who have no hope whatever, i.e. they had doubted the fact of the resurrection as such. Paul accordingly gives them in <a onClick="return mV(\'1Th\',4,14);">4:14</a> the general assurance that in the resurrection of Jesus that of believers is guaranteed. The verb "precede" in <a onClick="return mV(\'1Th\',4,15);">4:15</a> does not imply that there was thought of precedence in the enjoyment of glory, but is only an emphatic way of affirming that the dead will not be one moment behind in inheriting with the living the blessedness of the parousia. In <a onClick="return mV(\'1Th\',4,17);">4:17</a>, "so shall we ever be with the Lord," the word "ever" excludes the conception of a provisional kingdom. <a onClick="return mV(\'2Th\',1,\'5-12\');">2Th 1:5-12</a> contains merely the general thought that sufferings and glory, persecution and the inheritance of the kingdom are linked together. There is nothing to show that this glory and kingdom are aught else but the final state, the kingdom of God (<a onClick="return mV(\'2Th\',1,5);">2Th 1:5</a>). In <a onClick="return mV(\'Phl\',3,\'9-11\');">Php 3:9-11</a>, it is claimed, Paul represents attainment to the resurrection as dependent on special effort on his part, therefore as something not in store for all believers. Since the general resurrection pertains to all, a special grace of resurrection must be meant, i.e. inclusion in the number of those to be raised at the parousia, at the opening of the millennial kingdom. The answer to this is, that it was quite possible to Paul to make the resurrection as such depend on the believer\'s progress in grace and conformity to Christ, seeing that it is not an event out of all relation to his spiritual development, but the climax of an organic process of transformation begun in this life. And in verse <a onClick="return mV(\'Phl\',3,20);">20</a> the resurrection of all is joined to the parousia (compare for the Pauline passages Vos, "The Pauline Eschatology and Chiliasm," PTR,1911,26-60).<P>The passage <a onClick="return mV(\'Rev\',20,\'1-6\');">Re 20:1-6</a> at first sight much favors the conception of a millennial reign of Christ, participated in by the martyrs, brought to life in a first resurrection, and marked by a suspension of the activity of Satan. And it is urged that the sequence of visions places this millennium after the parousia of Christ narrated in <a onClick="return mV(\'Rev\',19,\'1-\');">Re 19</a>. The question of historic sequence, however, is in Revelation difficult to decide. In other parts of the book the principle of "recapitulation," i.e. of cotemporaneousness of things successively depicted, seems to underlie the visions, and numbers are elsewhere in the book meant symbolically. These facts leave open the possibility that the thousand years are synchronous with the earlier developments recorded, and symbolically describe the state of glorified life enjoyed with Christ in heaven by the martyrs during the intermediate period preceding the parousia. The terms employed do not suggest an anticipated bodily resurrection. The seer speaks of "souls" which "lived" and "reigned," and finds in this the first resurrection. The scene of this life and reign is in heaven, where also the "souls" of the martyrs are beheld (<a onClick="return mV(\'Rev\',6,9);">Re 6:9</a>). The words "this is the first resurrection" may be a pointed disavowal of a more realistic (chiliastic) interpretation of the same phrase. The symbolism of the thousand years consists in this, that it contrasts the glorious state of the martyrs on the one hand with the brief season of tribulation passed here on earth, and on the other hand with the eternal life of the consummation. The binding of Satan for this period marks the first eschatological conquest of Christ over the powers of evil, as distinguished from the renewed activity to be displayed by Satan toward the end in bringing up against the church still other forces not hitherto introduced into the conflict. In regard to a book so enigmatical, it were presumptuous to speak with any degree of dogmatism, but the uniform absence of the idea of the millennium from the eschatological teaching of the New Testament elsewhere ought to render the exegete cautious before affirming its presence here (compare Warfield, "The Millennium and the Apocalypse," PTR, 1904, 599-617).<P>3. The Resurrection of Believers:<P>The resurrection of believers bears a twofold aspect. On the one hand it belongs to the forensic side of salvation. On the other hand it belongs to the pneumatic transforming side of the saving process. Of the former, traces appear only in the teaching of Jesus (<a onClick="return mV(\'Mat\',5,9);">Mt 5:9</a>; <a onClick="return mV(\'Mat\',22,\'29-32\');">22:29-32</a>; <a onClick="return mV(\'Luk\',20,35,36);">Lu 20:35-36</a>). Paul clearly ascribes to the believer\'s resurrection a somewhat similar forensic significance as to that of Christ (<a onClick="return mV(\'Rom\',8,10,23);">Ro 8:10, 23</a>; <a onClick="return mV(\'1Cr\',15,\'30-32\',\'55-58\');">1Co 15:30-32, 55-58</a>). Far more prominent with him is, however, the other, the pneumatic interpretation. Both the origin of the resurrection life and the continuance of the resurrection state are dependent on the Spirit (<a onClick="return mV(\'Rom\',8,\'1-\');">Ro 8</a>; <a onClick="return mV(\'Rom\',10,\'1-\');">10</a>; <a onClick="return mV(\'Rom\',11,\'1-\');">11</a>; <a onClick="return mV(\'1Cr\',15,\'45-49\');">1Co 15:45-49</a>; <a onClick="return mV(\'Gal\',6,8);">Ga 6:8</a>). The resurrection is the climax of the believer\'s transformation (<a onClick="return mV(\'Rom\',8,11);">Ro 8:11</a>; <a onClick="return mV(\'Gal\',6,8);">Ga 6:8</a>). This part ascribed to the Spirit in the resurrection is not to be explained from what the Old Testament teaches about the Spirit as the source of physical life, for to this the New Testament hardly ever refers; it is rather to be explained as the correlate of the general Pauline principle that the Spirit is the determining factor of the heavenly state in the coming eon. This pneumatic character of the resurrection also links together the resurrection of Christ and that of the believer. This idea is not yet found in the Synoptics; it finds expression in <a onClick="return mV(\'Jhn\',5,\'22-29\');">Joh 5:22-29</a>; <a onClick="return mV(\'Jhn\',11,25);">11:25</a>; <a onClick="return mV(\'Jhn\',14,6,19);">14:6, 19</a>. In early apostolic teaching a trace of it may be found in <a onClick="return mV(\'Act\',4,2);">Ac 4:2</a>. With Paul it appears from the beginning as a well-established principle. The continuity between the working of the Spirit here and His part in the resurrection does not, however, lie in the body. The resurrection is not the culmination of a pneumatic change which the body in this life undergoes. There is no preformation of the spiritual body on earth. <a onClick="return mV(\'Rom\',8,10,11);">Ro 8:10-11</a>; <a onClick="return mV(\'1Cr\',15,49);">1Co 15:49</a>; <a onClick="return mV(\'2Cr\',5,1,2);">2Co 5:1-2</a>; <a onClick="return mV(\'Phl\',3,12);">Php 3:12</a> positively exclude this, and <a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>; <a onClick="return mV(\'2Cr\',4,\'7-18\');">4:7-18</a> do not require it.<P>The glory into which believers are transformed through the beholding (or reflecting) of the glory of Christ as in a mirror is not a bodily but inward glory, produced by illumination of the gospel. And the manifestation of the life of Jesus in the body or in the mortal flesh refers to the preservation of bodily life in the midst of deadly perils. Equally without support is the view that at one time Paul placed the investiture with the new body immediately after death. It has been assumed that this, together with the view just criticized, marks the last stage in a protracted development of Paul\'s eschatological belief. The initial stage of this process is found in 1 Thessalonians: the resurrection is that of an earthly body. The next stage is represented by 1 Corinthians: the future body is pneumatic in character, although not to be received until the parousia. The third stage removes the inconsistency implied in the preceding position between the character of the body and the time of its reception, by placing the latter at the moment of death (2 Corinthians, Romans, Colossians), and by an extreme flight of faith the view is even approached that the resurrection body is in process of development now (Teichmann, Charles). This scheme has no real basis of fact. 1 Thessalonians does not teach an unpneumatic eschatology (compare <a onClick="return mV(\'1Th\',4,14,16);">4:14,16</A>). The second stage given is the only truly Pauline one, nor can it be shown that the apostle ever abandoned it. For the third position named finds no support in <a onClick="return mV(\'2Cr\',5,\'1-10\');">2Co 5:1-10</a>; <a onClick="return mV(\'Rom\',8,19);">Ro 8:19</a>; <a onClick="return mV(\'Col\',3,4);">Col 3:4</a>. The exegesis of <a onClick="return mV(\'2Cr\',5,\'1-10\');">2Co 5:1-10</a> is difficult and cannot here be given in detail. Our understanding of the main drift of the passage, put into paraphrase, is as follows: we feel assured of the eternal weight of glory (<a onClick="return mV(\'2Cr\',4,17);">4:17</a>), because we know that we shall receive, after our earthly tent-body shall have been dissolved (aorist subjunctive), a new body, a supernatural house for our spirit, to be possessed eternally in the heavens. A sure proof of this lies in the heightened form which our desire for this future state assumes. For it is not mere desire to obtain a new body, but specifically to obtain it as soon as possible, without an intervening period of nakedness, i.e. of a disembodied state of the spirit. Such would be possible, if it were given us to survive till the parousia, in which case we would be clothed upon with our habitation from heaven (= supernatural body), the old body not having to be put off first before the new can be put on, but the new body being superimposed upon the old, so that no "unclothing" would have to take place first, what is mortal simply being swallowed up of life (<a onClick="return mV(\'2Cr\',5,2,4);">5:2, 4</A>). And we are justified in cherishing this supreme aspiration, since the ultimate goal set for us in any case, even if we should have to die first and to unclothe and then to put on the new body over the naked spirit, since the ultimate goal, I say, excludes under all circumstances a state of nakedness at the moment of the parousia (<a onClick="return mV(\'2Cr\',5,3);">5:3</a>). Since, then, such a new embodied state is our destiny in any event, we justly long for that mode of reaching it which involves least delay and least distress and avoids intermediate nakedness. (This on the reading in <a onClick="return mV(\'2Cr\',5,3);">5:3</a> of ei ge kai endusamenoi ou gumnoi heurethesometha. If the reading ei ge kai ekdusamenoi be adopted the rendering of <a onClick="return mV(\'2Cr\',5,3);">5:3</a> will have to be: "If so be that also having put off (i.e. having died), we shall not at the end be found naked." If eiper kai ekdusamenoi be chosen it will be: "Although even having put off (i.e. having died) we shall not at the end be found naked." These other readings do not materially alter the sense.) The understanding of the passage will be seen to rest on the pointed distinction between being "clothed upon," change at the parousia without death (<a onClick="return mV(\'2Cr\',5,2,4);">5:2, 4</a>), to be "unclothed," loss of the body in death with nakedness resulting (<a onClick="return mV(\'2Cr\',5,4);">5:4</A>), and "being clothed," putting on of the new body after a state of nakedness (<a onClick="return mV(\'2Cr\',5,3);">5:3</a>). Interpreted as above, the passage expresses indeed the hope of an instantaneous endowment with the spiritual body immediately after this life, but only on the supposition that the end of this life will be at the parousia, not for the case that death should intervene before, which latter possibility is distinctly left open. In <a onClick="return mV(\'Rom\',8,19);">Ro 8:19</a> what will happen at the end to believers is called a "revealing of the sons of God," not because their new body existed previously, but because their status as sons of God existed before, and this status will be revealed through the bestowal upon them of the glorious body. <a onClick="return mV(\'Col\',3,3,4);">Col 3:3-4</a> speaks of a "life...hid with Christ in God," and of the "manifestation" of believers with Christ in glory at the parousia, but "life" does not imply bodily existence, and while the "manifestation" at the parousia presupposes the body, it does not imply that this body must have been acquired long before, as is the case with Christ\'s body. In conclusion it should be noted that there is ample evidence in the later epistles that Paul continued to expect the resurrection body at the parousia (<a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>; <a onClick="return mV(\'Phl\',3,20,21);">Php 3:20-21</a>).<P>4. The Resurrection-Body:<P>The main passage informing us as to the nature of the resurrection body is <a onClick="return mV(\'1Cr\',15,\'35-58\');">1Co 15:35-58</a>. The difficulty Paul here seeks to relieve does not concern the substance of the future body, but its kind (compare <a onClick="return mV(\'1Cr\',15,35);">1Co 15:35</a> "With what manner of body do they come?"). Not until <a onClick="return mV(\'1Cr\',15,50);">1Co 15:50</a> is the deeper question of difference in substance touched upon. The point of the figure of "sowing" is not that of identity of substance, but rather this, that the impossibility of forming a concrete conception of the resurrection body is no proof of its impossibility, because in all vegetable growth there appears a body totally unlike that which is sown, a body the nature and appearance of which are determined by the will of God. We have no right to press the figure in other directions, to solicit from it answers to other questions. That there is to be a real connection between the present and the future body is implied rather than directly affirmed. <a onClick="return mV(\'1Cr\',15,36);">1Co 15:36</a> shows that the distinction between the earthly body and a germ of life in it, to be entrusted with it to the grave and then quickened at the last day, does not lie in the apostle\'s mind, for what is sown is the body; it dies and is quickened in its entirety. Especially the turn given to the figure in <a onClick="return mV(\'1Cr\',15,37);">15:37</a>—that of a naked grain putting on the plant as a garment—proves that it is neither intended nor adapted to give information on the degree of identity or link of continuity between the two bodies. The "bare grain" is the body, not the spirit, as some would have it (Teichmann), for it is said of the seed that it dies; which does not apply to the Pneuma (compare also <a onClick="return mV(\'1Cr\',15,44);">15:44</a>). The fact is that in this entire discussion the subjective spirit of the believer remains entirely out of consideration; the matter is treated entirely from the standpoint of the body. So far as the Pneuma enters into it, it is the objective Spirit, the Spirit of Christ. As to the time of the sowing, some writers take the view that this corresponds to the entire earthly life, not to the moment of burial only (so already Calvin, recently Teichmann and Charles). In <a onClick="return mV(\'1Cr\',15,42,43);">15:42-43</a> there are points of contact for this, inasmuch as especially the three last predicates "in dishonor," "in weakness," "a natural body," seem more applicable to the living than to the dead body. At any rate, if the conception is thus widened, the act of burial is certainly included in the sowing. The objection arising from the difficulty of forming a conception of the resurrection body is further met in <a onClick="return mV(\'1Cr\',15,\'39-41\');">15:39-41</a>, where Paul argues from the multitude of bodily forms God has at His disposal. This thought is illustrated from the animal world (<a onClick="return mV(\'1Cr\',15,39);">15:39</a>); from the difference between the heavenly and the earthly bodies (<a onClick="return mV(\'1Cr\',15,40);">15:40</A>); from the difference existing among the heavenly bodies themselves (<a onClick="return mV(\'1Cr\',15,41);">15:41</a>). The structure of the argument is indicated by the interchange of two words for "other," allos and heteros, the former designating difference of species within the genus, the latter difference of genus, a distinction lost in the English version. In all this the reasoning revolves not around the substance of the bodies but around their kind, quality, appearance (sarx in <a onClick="return mV(\'1Cr\',15,39);">15:39</a> = soma, "body," not = "flesh").<P>The conclusion drawn is that the resurrection body will differ greatly in kind from the present body. It will be heteros, not merely allos. The points of difference are enumerated in <a onClick="return mV(\'1Cr\',15,42,43);">15:42-43</a>. Four contrasts are named; the first three in each case appear to be the result of the fourth. The dominating antithesis is that between the soma psuchikon and the soma pneumatikon. Still Paul can scarcely mean to teach that "corruption," "dishonor," "weakness" are in the same sense necessary and natural results of the "psychical" character of the earthly body, as the corresponding opposites are necessary and natural concomitants of the pneumatic character of the resurrection body. The sequel shows that the "psychical body" was given man at creation, and according to <a onClick="return mV(\'1Cr\',15,53);">15:53</a> corruption and death go together, whereas death is not the result of creation but of the entrance of sin according to Paul\'s uniform teaching elsewhere. Hence, also the predicate sarkikos is avoided in <a onClick="return mV(\'1Cr\',15,46,47);">15:46-47</a>, where the reference is to creation, for this word is always associated in Paul with sin. The connection, therefore, between the "natural (psychical, margin) body" and the abnormal attributes conjoined with it, will have to be so conceived, that in virtue of the former character, the body, though it need not of itself, yet will fall a prey to the latter when sin enters. In this lies also the explanation of the term "psychical body." This means a body in which the psuche, the natural soul, is the vitalizing principle, sufficient to support life, but not sufficient to that supernatural, heavenly plane, where it is forever immune to death and corruption. The question must be asked, however, why Paul goes back to the original state of man\'s body and does not content himself with contrasting the body in the state of sin and in the state of eternal life. The answer is found in the exigency of the argument. Paul wished to add to the argument for the possibility of a different body drawn from analogy, an argument drawn from the typical character of the original creation-body. The body of creation, on the principle of prefiguration, pointed already forward to a higher body to be received in the second stage of the world-process: \'if there exists a psychical body, there exists also a pneumatic body\' (<a onClick="return mV(\'1Cr\',15,44);">15:44</a>). The proof lies in <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>. Some think that Paul here adopts the Philonic doctrine of the creation of two men, and means <a onClick="return mV(\'1Cr\',15,45);">1Co 15:45b</a> as a quotation from <a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a>. But the sequence is against this, for Paul\'s spiritual man appears on the scene last, not first, as in Philo. Nor can the statement have been meant as a correction of Philo\'s sequence, for Paul cannot have overlooked that, once a double creation were found in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> and <a onClick="return mV(\'Gen\',2,\'1-\');">2</A>, then Philo\'s sequence was the only possible one, to correct which would have amounted to correcting Scripture.<P>If Paul does here correct Philo, it must be in the sense that he rejects the entire Philonic exegesis, which found in Genesis a twofold creation (compare <a onClick="return mV(\'1Cr\',11,7);">1Co 11:7</a>). Evidently for Paul, <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a> taken by itself contains the proof of his proposition, that there is both a psychical and a pneumatic body. Paul regarded the creation of the first Adam in a typical light. The first creation gave only the provisional form in which God\'s purpose with reference to man was embodied, and in so far looked forward to a higher embodiment of the same idea on a higher pneumatic plane (compare <a onClick="return mV(\'Rom\',5,14);">Ro 5:14</a>): "The first man is of the earth, earthy: the second man is of heaven" (<a onClick="return mV(\'1Cr\',15,47);">1Co 15:47</a>); "of" or "from heaven" does not designate heavenly material, for even here, by not giving the opposite to choikos, "earthly," Paul avoided the question of substantiality. A "pneumatic" body is not, as many assume, a body made out of pneuma as a higher substance, for in that case Paul would have had pneumatikon ready at hand as the contrast to choikon. Only negatively the question of substance is touched upon in <a onClick="return mV(\'1Cr\',15,50);">1Co 15:50</a>: "Flesh and blood cannot inherit the kingdom of God," but the apostle does not say what will take their place. Compare further, for the non-substantial meaning of pneumatikos, <a onClick="return mV(\'Rom\',15,27);">Ro 15:27</a>; <a onClick="return mV(\'1Cr\',9,11);">1Co 9:11</a>; <a onClick="return mV(\'1Cr\',10,3,4);">10:3-4</a>; <a onClick="return mV(\'Eph\',1,3);">Eph 1:3</a>; <a onClick="return mV(\'Eph\',5,19);">5:19</a>; <a onClick="return mV(\'Eph\',6,12);">6:12</a>; <a onClick="return mV(\'Col\',1,9);">Col 1:9</a>. The only positive thing which we learn in this direction is formal, namely, that the resurrection body of the believer will be the image of that of Christ (<a onClick="return mV(\'1Cr\',15,49);">1Co 15:49</a>).<P>VII. The Change of Those Living at the Parousia.<P>This is confined to believers. Of a change in the body of non-believers found living or raised at the parousia the New Testament nowhere speaks. The passages referring to this subject are <a onClick="return mV(\'1Cr\',15,\'51-53\');">1Co 15:51-53</a>; <a onClick="return mV(\'2Cr\',5,\'1-5\');">2Co 5:1-5</a>; <a onClick="return mV(\'Phl\',3,20,21);">Php 3:20-21</a>. The second of these has already been discussed: it represents the change under the figure of a putting-on of the heavenly body over the earthly body, in result of which what is mortal is swallowed up so as to disappear by life. This representation starts with the new body by which the old body is absorbed. In <a onClick="return mV(\'1Cr\',15,\'1-\');">1Co 15</a> and <a onClick="return mV(\'Phl\',3,\'1-\');">Php 3</a>, on the other hand, the point of departure is from the old body which is changed into a new. The difference between the resurrection and the charge of the living is brought out in <a onClick="return mV(\'2Cr\',5,\'1-5\');">2Co 5:1-5</a> in the two figures of "putting on" and "putting on over" endusasthai and ependusasthai. Some exegetes find in <a onClick="return mV(\'1Cr\',15,\'51-53\');">1Co 15:51-53</a> the description of a process kept in such general terms as to be equally applicable to those raised and to those transformed alive. If this be adopted it yields new evidence for the continuity between the present body and the resurrection body. Others, however, find here the expectation that Paul and his readers will "all" survive until the parousia, and be changed alive, in which case no light is thrown on the resurrection-process. The more plausible exegesis is that which joins the negative to "all" instead of to the verb, and makes Paul affirm that "not all" will die, but that all, whether dead or surviving, will be changed at the parousia; the difficulty of the exegesis is reflected in the early attempts to change the reading. In <a onClick="return mV(\'Phl\',3,20,21);">Php 3:20-21</a> there are no data to decide whether the apostle conceives of himself and his readers as living at the moment of the parousia or speaks generally so as to cover both possibilities.<P>VIII. The Judgment.<P>The judgment takes place on a "day" (<a onClick="return mV(\'Mat\',7,22);">Mt 7:22</a>; <a onClick="return mV(\'Mat\',10,15);">10:15</a>; <a onClick="return mV(\'Mat\',24,36);">24:36</a>; <a onClick="return mV(\'Luk\',10,12);">Lu 10:12</a>; <a onClick="return mV(\'Luk\',21,34);">21:34</a>; <a onClick="return mV(\'1Cr\',1,8);">1Co 1:8</a>; <a onClick="return mV(\'1Cr\',3,13);">3:13</a>; <a onClick="return mV(\'2Ti\',4,8);">2Ti 4:8</a>; <a onClick="return mV(\'Rev\',6,17);">Re 6:17</a>), but this rests on the Old Testament conception of "the day of Yahweh," and is not to be taken literally, whence also "hour" interchanges with "day" (<a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>; <a onClick="return mV(\'Rev\',14,7);">Re 14:7</a>). While not confined to an astronomical day the judgment is plainly represented as a definitely circumscribed transaction, not as an indefinite process. It coincides with its parousia. Of a judgment immediately after death, the New Testament nowhere speaks, not even in <a onClick="return mV(\'Hbr\',9,27,28);">Heb 9:27-28</a>. Its locality is the earth, as would seem to follow from its dependence on the parousia (<a onClick="return mV(\'Mat\',13,41,42);">Mt 13:41-42</a>; <a onClick="return mV(\'Mar\',13,26,27);">Mr 13:26-27</a>), although some infer from <a onClick="return mV(\'1Th\',4,17);">1Th 4:17</a> that, so far as believers are concerned, it will take place in the air. But this passage does not speak of the judgment, only of the parousia and the meeting of believers with Christ. The judge is God (<a onClick="return mV(\'Mat\',6,4,6,14,18);">Mt 6:4, 6, 14, 18</a>; <a onClick="return mV(\'Mat\',10,28,32);">10:28, 32</a>; <a onClick="return mV(\'Luk\',12,8);">Lu 12:8</a>ff; <a onClick="return mV(\'Luk\',21,36);">21:36</A>; <a onClick="return mV(\'Act\',10,42);">Ac 10:42</a>; <a onClick="return mV(\'Act\',17,30,31);">17:30-31</a>; <a onClick="return mV(\'Rom\',2,2,3,5,16);">Ro 2:2-3, 5, 16</a>; <a onClick="return mV(\'Rom\',14,10);">14:10</a>; <a onClick="return mV(\'1Cr\',4,\'3-5\');">1Co 4:3-5</a>; <a onClick="return mV(\'1Cr\',5,13);">5:13</a>; <a onClick="return mV(\'Hbr\',12,25);">Heb 12:25</a>; <a onClick="return mV(\'Hbr\',13,4);">13:4</a>; <a onClick="return mV(\'1Pe\',1,17);">1Pe 1:17</a>; <a onClick="return mV(\'1Pe\',2,23);">2:23</a>; <a onClick="return mV(\'Rev\',6,10);">Re 6:10</a>; <a onClick="return mV(\'Rev\',14,7);">14:7</a>), but also Christ, not only in the great scene depicted in <a onClick="return mV(\'Mat\',25,\'31-46\');">Mt 25:31-46</a>, but also in <a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a>; <a onClick="return mV(\'Mar\',13,26);">13:26</a>ff; <a onClick="return mV(\'Mat\',7,22);">Mt 7:22</a>; <a onClick="return mV(\'Luk\',13,\'25-27\');">Lu 13:25-27</a>; <a onClick="return mV(\'Act\',17,31);">Ac 17:31</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>; <a onClick="return mV(\'Rev\',19,11);">Re 19:11</a>, whence also the Old Testament co
