e artificially produced. Learning, culture, civilization and the distractions of social and political life are proscribed, much as they were in the opposite school of the Cynics, because they produce many desires difficult to satisfy, and so disturb the peace of the mind. This teaching has been compared to that of Rousseau and even of Buddha. Like the former, Epicurus enjoins the withdrawal of life from the complexities and perplexities of civilization, to the bare necessities of Nature, but he stops short of the doctrine of Nirvana, for life and the desire to live he regards as good things.<P>3. Back to Nature:<P>He even rises above Naturalism to a view that has some kinship with modern Spiritualism, in his affirmation of the mastery of mind over adverse circumstances. "Though he is being tortured on the rack, the wise man is still happy."<P>4. Ataraxy:<P>Epicurus\' definition of the end of life and of the way to it bears a superficial resemblance to that of his opponents, the Stoics. The end sought by both is ataraxia, "imperturbability," a peace of mind that transcends all circumstances, and the way to it is the life according to Nature. But Nature for Epicurus is purely physical and material, and the utmost happiness attainable is the complete absence of pain.<P>5. Pleasure Is the Absence of Pain:<P>He justly protests against the representation of his teaching as gross and immoral. "When we say, then, that pleasure is the end and aim, we do not mean the pleasures of the prodigal, or the pleasures of sensuality, as we are understood to do by some, through ignorance, prejudice or willful misrepresentation. By pleasure we mean the absence of pain in the body and trouble in the soul" (Letter to Menoeceus). His own life was marked by a simplicity verging on asceticism, and by kindly consideration for his friends. But theory was capable of serving the purposes of worse men to justify license and selfishness.<P>6. Social Contract:<P>Justice and ordinary morality were recognized in the system as issuing from an original social compact, such as Hobbes and Rousseau supposed, and resting upon the self-interest and happiness of individuals who entered into the compact the better to gain those ends. Ordinary morality has therefore no stronger sanction than the individual\'s desire to secure his own happiness. Against public violations of the moral code, the sanction finds its agent in the social order and the penalties it inflicts; but the only deterrent from secret immorality is the fear of being found out, and the necessarily disturbing character of that fear itself. Friendship, the supreme virtue of Epicureanism, is based upon the same calculating selfishness, and is to be cultivated for the happiness it begets to its owners. The fundamental defect of the system is its extreme individualism, which issues in a studied selfishness that denies any value of their own to the social virtues, and in the negation of the larger activities of life.<P>Epicurus had no interest in knowledge for its own sake, whether of the external world, or of any ultimate or supreme, reality. But he found men\'s minds full of ideas about the world, immortality and the gods, which disturbed their peace and filled them with vain desires and fears. It was therefore necessary for the practical ends of his philosophy to find a theory of the things outside of man that would give him tranquillity and serenity of mind.<P>7. Atomic Theory:<P>For this purpose Epicurus fell back upon Democritus\' atomic theory of the world. The original constituents of the universe, of which no account could be given, were atoms, the void, and motion. By a fixed law or fate, the atoms moved through the void, so as to form the world as we know it. The same uniform necessity maintains and determines the abiding condition of all that exists. Epicurus modified this system so far as to admit an initial freedom to the atoms, which enabled them to divert slightly from their uniform straight course as they fell like rain through space, and so to impinge, combine and set up rotatory motions by which the worlds, and all that is in them, came into being.<P>8. Materialism:<P>He did not follow the idea of freedom in Nature and man beyond the exigencies of his theory, and the thoroughly materialistic nature of his universe precluded him from deducing a moral realm. By this theory he gets rid of the causes of fear and anxiety that disturb the human mind. Teleology, providence, a moral order of the universe, the arbitrary action of the gods, blind fate, immortality, hell, reward and punishment after death, are all excluded from a universe where atoms moving through space do everything. The soul, like the body, is made of atoms, but of a smaller or finer texture. In death, the one like the other dissolves and comes to its end.<P>9. Theory of Ideas:<P>From the same premises one would expect the complete denial of any Divine beings. But it is a curiosity of the system that a grossly materialistic theory of knowledge should require the affirmation of the existence of the gods. Men\'s ideas are derived from thin material films that pass from the objects around them into the kindred matter of their minds. It follows that every idea must have been produced by a corresponding object. Men generally possess ideas of gods. Therefore, gods must exist to produce those ideas, which come to men in sleep and dreams. But they are not such gods as men generally believe to exist. They are constituted of the same atomic matter as men, but of a still finer texture. They dwell in the intermundia, the interspaces outside the worlds, where earthly cares and the dissolution of death cannot approach them. They are immortal and completely blessed. They cannot therefore know anything of the world, with its pain and its troubles, nor can they be in any way concerned with it. They are apotheoses of the Epicurean sage, entirely withdrawn from the world\'s turmoil, enjoying a life of calm repose, and satisfied with the bounty that Nature provides for them.<P>10. Epicurean Gods:<P>"For the nature of the gods must ever in itself of necessity enjoy immortality with supreme repose, far removed and withdrawn from our concerns; since exempt from every pain, exempt from all dangers, strong in its own resources, not wanting aught of us, it is neither gained by favors nor moved by anger" (Lucretius). All religion is banned, though the gods are retained. Epicurus\' failure to carry the logic of his system to the denial of the gods lies deeper than his theory of ideas.<P>11. Consensus Gentium:<P>He was impressed by the fact that "a steadfast unanimity continues to prevail among all men without exception" that gods exist. "A consciousness of godhead does not allow him to deny the existence of God altogether. Hence, his attempt to explain the fact so as not to interfere with his general theory" (Wallace, Epicureanism, 209). During his lifetime, Epicurus attracted a large following to his creed, and it continued to flourish far down into the Christian era. It was presented to the Roman world by the poet Lucretius in his poem De natura rerum, which is still the chief source for the knowledge of it. One Old Testament writer, the author of Ecclesiastes, may have been influenced by its spirit, though he did not adopt all its ideas.<P>12. Causes of Success:<P>The personal charm and engaging character of Epicurus himself drew men to him, and elevated him into the kind of ideal sage who personified the teaching of the school, as was the custom of all schools of philosophy. The system was clear-cut and easily understood by ordinary men, and it offered a plausible theory of life to such as could not follow the profounder and more difficult speculations of other schools. Its moral teaching found a ready response in all that was worldly, commonplace and self-seeking in men that had lost their high ideals and great enthusiasms. Above all it delivered men from the terrors of a dark superstition that had taken the place of religion. It is a remarkable revelation of the inadequacy of Greek religion that Epicurus should have relegated the gods from the visible world, without any sense of loss, but only the relief of a great deliverance.<P>13. Complete Antithesis of Paul\'s Teaching:<P>It was inevitable that the teaching of Paul should have brought this school up against him. He came to Athens teaching a God who had become man, who had suffered and died to accomplish the utmost self-sacrifice, who had risen from the dead and returned to live among men to guide and fashion their lives, and who at last would judge all men, and according to their deeds reward or punish them in a future world. To the Epicurean this was the revival of all the ancient and hated superstitions. It was not only folly but impiety; for Epicurus had taught that "not the man who denies the gods worshipped by the multitude, but he who affirms of the gods what the multitude believe about them, is truly impious."<P>14. LITERATURE.<P>Hicks, Stoic and Epicurean (whose translations are adopted in all quotations in this article); Zeller, Stoics, Epicureans and Sceptics; Wallace, Epicureanism; Lucretius, De natura rerum.``145';

isbe[3159]='Epiphi`ep\'-i-fi (Epiphi):<P>Name of a month mentioned in connection with Pachon in 1Macc 6:38.`<a href="./study/isbe/search.html?string=TIME">TIME</a>`1';
isbe[3160]='Epistle`e-pis\'-\'-l (epistole, "a letter," "epistle"; from epistello, "to send to"):<P>Contents<P>1. New Testament Epistles<P>2. Distinctive Characteristics<P>3. Letter-Writing in Antiquity<P>4. Letters in the Old Testament<P>5. Letters in the Apocrypha<P>6. Epistolary Writings in the New Testament<P>7. Epistles as Distinguished from Letters<P>8. Patristic Epistles<P>9. Apocryphal Epistles<hr /><P>1. New Testament Epistles:<P>A written communication; a term inclusive of all forms of written correspondence, personal and official, in vogue from an early antiquity. As applied to the twenty-one letters, which constitute well-nigh one-half of the New Testament, the word "epistle" has come to have chiefly a technical and exclusive meaning. It refers, in common usage, to the communications addressed by five (possibly six) New Testament writers to individual or collective churches, or to single persons or groups of Christian disciples. Thirteen of these letters were written by Paul; three by John; two by Peter; one each by James and Jude; one—the epistle to the Hebrews—by an unknown writer.<P>2. Distinctive Characteristics:<P>As a whole the Epistles are classified as Pauline, and Catholic, i.e. general; the Pauline being divided into two classes: those written to churches and to individuals, the latter being known as Pastoral (1 and 2 Timothy, and Titus; some also including Philemon; see Lange on Romans, American edition, 16). The fact that the New Testament is so largely composed of letters distinguishes it, most uniquely, from all the sacred writings of the world. The Scriptures of other oriental religions—the Vedas, the Zend Avesta, the Tripitaka, the Koran, the writings of Confucius—lack the direct and personal address altogether. The Epistles of the New Testament are specifically the product of a new spiritual life and era. They deal, not with truth in the abstract, but in the concrete. They have to do with the soul\'s inner experiences and processes. They are the burning and heart-throbbing messages of the apostles and their confreres to the fellow-Christians of their own day. The chosen disciples who witnessed the events following the resurrection of Jesus and received the power (<a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>) bestowed by the Holy Spirit on, and subsequent to, the Day of Pentecost, were spiritually a new order of men. The only approach to them in the spiritual history of mankind is the ancient Hebrew prophets. Consequently the Epistles, penned by men who had experienced a great redemption and the marvelous intellectual emancipation and quickening that came with it, were an altogether new type of literature. Their object is personal. They relate the vital truths of the resurrection era, and the fundamental principles of the new teaching, to the individual and collective life of all believers. This specific aim accounts for the form in which the apostolic letters were written. The logic of this practical aim appears conspicuously in the orderly Epistles of Paul who, after the opening salutation in each letter, lays down with marvelous clearness the doctrinal basis on which he builds the practical duties of daily Christian life. Following these, as each case may require, are the personal messages and affectionate greetings and directions, suited to this familiar form of address.<P>The Epistles consequently have a charm, a directness, a vitality and power unknown to the other sacred writings of the world. Nowhere are they equaled or surpassed except in the personal instructions that fell from the lips of Jesus. Devoted exclusively to experimental and practical religion they have, with the teachings of Christ, become the textbook of the spiritual life for the Christian church in all subsequent time. For this reason "they are of more real value to the church than all the systems of theology, from Origen to Schleiermacher" (Schaff on St. Paul\'s Epistles, History of the Christian Church, 741). No writings in history so unfold the nature and processes of the redemptive experience. In Paul and John, especially, the pastoral instinct is ever supreme. Their letters are too human, too personal, too vital to be formal treatises or arguments. They throb with passion for truth and love for souls. Their directness and affectionate intensity convert their authors into prophets of truth, preachers of grace, lovers of men and missionaries of the cross. Hence, their value as spiritual biographies of the writers is immeasurable. As letters are the most spontaneous and the freest form of writing, the New Testament Epistles are the very life-blood of Christianity. They present theology, doctrine, truth, appeal, in terms of life, and pulsate with a vitality that will be fresh and re-creative till the end of time. (For detailed study of their chronology, contents and distinguishing characteristics, see articles on the separate epistles.)<P>3. Letter-Writing in Antiquity:<P>While the New Testament Epistles, in style and quality, are distinct from and superior to all other literature of this class, they nevertheless belong to a form of personal and written address common to all ages. The earliest known writings were epistolary, unless we except some of the chronologies and inscriptions of the ancient Babylonian and Assyrian kings. Some of these royal inscriptions carry the art of writing back to 3800 BC, possibly to a period still earlier (see Goodspeed, Kent\'s Historical Series, 42-43, secs. 40-41), and excavations have brought to light "an immense mass of letters from officials to the court—correspondence between royal personages or between minor officials," as early as the reign of Khammurabi of Babylon, about 2275 BC (ibid., 33). The civilized world was astonished at the extent of this international correspondence as revealed in the Tell el-Amarna Letters (1480 BC), discovered in Egypt in 1887, among the ruins of the palace of Amenophis IV. This mass of political correspondence is thus approximately synchronous with the Hebrew exodus and the invasion of Canaan under Joshua.<P>4. Letters in the Old Testament:<P>As might be expected, then, the Old Testament abounds with evidences of extensive epistolary correspondence in and between the oriental nations. That a postal service was in existence in the time of Job (<a onClick="return mV(\'Job\',9,25);">Job 9:25</a>) is evident from the Hebrew term ratsim, signifying "runners," and used of the mounted couriers of the Persians who carried the royal edicts to the provinces. The most striking illustration of this courier service in the Old Testament occurs in <a onClick="return mV(\'Est\',3,13,15);">Es 3:13, 15</a>; <a onClick="return mV(\'Est\',8,10,14);">8:10, 14</a> where King Ahasuerus, in the days of Queen Esther, twice sends royal letters to the Jews and satraps of his entire realm from India to Ethiopia, on the swiftest horses. According to Herodotus, these were usually stationed, for the sake of the greatest speed, four parasangs apart. Hezekiah\'s letters to Ephraim and Manasseh were sent in the same way (<a onClick="return mV(\'2Ch\',30,1,6,10);">2Ch 30:1, 6, 10</a>). Other instances of epistolary messages or communications in the Old Testament are David\'s letter to Joab concerning Uriah and sent by him (<a onClick="return mV(\'2Sa\',11,14,15);">2Sa 11:14-15</a>); Jezebel\'s, to the elders and nobles of Jezreel, sent in Ahab\'s name, regarding Naboth (<a onClick="return mV(\'1Ki\',21,8,9);">1Ki 21:8-9</a>); the letter of Ben-hadad, king of Syria, to Jehoram, king of Israel, by the hand of Naaman (<a onClick="return mV(\'2Ki\',5,\'5-7\');">2Ki 5:5-7</a>); Jehu\'s letters to the rulers of Jezreel, in Samaria (<a onClick="return mV(\'2Ki\',10,1,2,6,7);">2Ki 10:1-2, 6-7</a>); Sennacherib\'s letter to Hezekiah (<a onClick="return mV(\'2Ki\',19,14);">2Ki 19:14</a>; <a onClick="return mV(\'Isa\',37,14);">Isa 37:14</a>; <a onClick="return mV(\'2Ch\',32,17);">2Ch 32:17</a>), and also that of Merodach- baladan, accompanied with a gift (<a onClick="return mV(\'2Ki\',20,12);">2Ki 20:12</a>; <a onClick="return mV(\'Isa\',39,1);">Isa 39:1</a>). Approximating the New Testament epistle in purpose and spirit is the letter of earnest and loving counsel sent by Jeremiah to the exiles in Babylon. It is both apostolic and pastoral in its prophetic fervor, and is recorded in full (<a onClick="return mV(\'Jer\',29,1,4-32);">Jer 29:1, 4-32</a>) with its reference to the bitterly hostile and jealous letter of Shemaiah, the false prophet, in reply.<P>As many writers have well indicated, the Babylonian captivity must have been a great stimulus to letter-writing on the part of the separated Hebrews, and between the Far East and Palestine. Evidences of this appear in the histories of Ezra and Nehemiah, e.g. the correspondence, back and forth, between the enemies of the Jews at Jerusalem and Artaxerxes, king of Persia, written in the Syrian language (<a onClick="return mV(\'Ezr\',4,\'7-23\');">Ezr 4:7-23</a>); also the letter of Tattenai (the King James Version "Tatnai") the governor to King Darius (<a onClick="return mV(\'Ezr\',5,\'6-17\');">Ezr 5:6-17</a>); that of Artaxerxes to Ezra (<a onClick="return mV(\'Ezr\',7,11);">Ezr 7:11</a>ff), and to Asaph, keeper of the royal forest (<a onClick="return mV(\'Neh\',2,8);">Ne 2:8</a>); finally the interchange of letters between the nobles of Judah and Tobiah; and those of the latter to Nehemiah (<a onClick="return mV(\'Neh\',6,17,19);">Ne 6:17, 19</a>; so Sanballat verse <a onClick="return mV(\'Neh\',6,5);">5</a>).<P>5. Letters in the Apocrypha:<P>The Old Testament Apocrypha contains choice specimens of personal and official letters, approximating in literary form the epistles of the New Testament. In each case they begin, like the latter, in true epistolary form with a salutation: "greeting" or "sendeth greeting" (1Macc 11:30,32; 12:6,20; 15:2,16), and in two instances closing with the customary "Fare ye well" or "Farewell" (2Macc 11:27-33,34-38; compare <a onClick="return mV(\'2Cr\',13,11);">2Co 13:11</a>), so universally characteristic of letter-writing in the Hellenistic era.<P>6. Epistolary Writings in the New Testament:<P>The most felicitous and perfect example official correspondence in the New Testament is Claudius Lysias\' letter to Felix regarding Paul (<a onClick="return mV(\'Act\',23,\'25-30\');">Ac 23:25-30</a>). Equally complete in form is the letter, sent, evidently in duplicate, by the apostles and elders to their Gentile brethren in the provinces of Asia (<a onClick="return mV(\'Act\',15,\'23-29\');">Ac 15:23-29</a>). In these two letters we have the first, and with <a onClick="return mV(\'Jam\',1,1);">Jas 1:1</a>, the only, instance of the Greek form of salutation in the New Testament (chairein). The latter is by many scholars regarded as probably the oldest letter in epistolary form in the New Testament, being in purport and substance a Pastoral Letter issued by the Apostolic Council of Jerusalem to the churches of Antioch, Syria and Cilicia. It contained instructions as to the basis of Christian fellowship, similar to those of the great apostle to the churches under his care.<P>The letters of the high priest at Jerusalem commending Saul of Tarsus to the synagogues of Damascus are samples of the customary letters of introduction (<a onClick="return mV(\'Act\',9,2);">Ac 9:2</a>; <a onClick="return mV(\'Act\',22,5);">22:5</a>; compare <a onClick="return mV(\'Act\',28,21);">Ac 28:21</a>; also <a onClick="return mV(\'Act\',18,27);">Ac 18:27</a>). As a Christian apostle Paul refers to this common use of "epistles of commendation" (<a onClick="return mV(\'2Cr\',3,1);">2Co 3:1</a>; <a onClick="return mV(\'1Cr\',16,3);">1Co 16:3</a>) and himself made happy use of the same (<a onClick="return mV(\'Rom\',16,1);">Ro 16:1</a>ff); he also mentions receiving letters, in turn, from the churches (<a onClick="return mV(\'1Cr\',7,1);">1Co 7:1</a>). Worthy of classification as veritable epistles are the letters, under the special guidance of the Holy Spirit, to the seven churches of Asia (<a onClick="return mV(\'Rev\',2,\'1-\');">Re 2:1</A> - <a onClick="return mV(\'Rev\',3,\'1-22\');">3:22</a>). In fact, the entire Book of Revelation is markedly epistolary in form, beginning with the benedictory salutation of personal and apostolic address, and closing with the benediction common to the Pauline epistles. This again distinguishes the New Testament literature in spirit and form from all other sacred writings, being almost exclusively direct and personal, whether in vocal or written address. In this respect the gospels, histories and epistles are alike the product and exponent of a new spiritual era in the life of mankind.<P>7. Epistles as Distinguished from Letters:<P>This survey of epistolary writing in the Far East, and especially in the Old Testament and New Testament periods, is not intended to obscure the distinction between the letter and the epistle. A clear line of demarcation separates them, owing not merely to differences in form and substance, but to the exalted spiritual mission and character of the apostolic letters. The characterization of a letter as more distinctly personal, confidential and spontaneous, and the epistle as more general in aim and more suited to or intended for publication, accounts only in part for the classification. Even when addressed to churches Paul\'s epistles were as spontaneous and intimately and affectionately personal as the ordinary correspondence. While intended for general circulation it is doubtful if any of the epistolary writers of the New Testament ever anticipated such extensive and permanent use of their letters as is made possible in the modern world of printing. The epistles of the New Testament are lifted into a distinct category by their spiritual eminence and power, and have given the word epistle a meaning and quality that will forever distinguish it from letter. In this distinction appears that Divine element usually defined as inspiration: a vitality and spiritual endowment which keeps the writings of the apostles permanently "living and powerful," where those of their successors pass into disuse and obscurity.<P>8. Patristic Epistles:<P>Such was the influence of the New Testament Epistles on the literature of early Christianity that the patristic and pseudepigraphic writings of the next century assumed chiefly the epistolary form. In letters to churches and individuals the apostolic Fathers, as far as possible, reproduced their spirit, quality and style.<P>9. Apocryphal Epistles:<P>Pseudo-epistles extensively appeared after the patristic era, many of them written and circulated in the name of the apostles and apostolic Fathers. See <a href="./study/isbe/search.html?string=APOCRYPHAL+EPISTLES">APOCRYPHAL EPISTLES</A>. This early tendency to hide ambitious or possibly heretical writings under apostolic authority and Scriptural guise may have accounted for the anathema pronounced by John against all who should attempt to add to or detract from the inspired revelation (<a onClick="return mV(\'Rev\',22,18,19);">Re 22:18-19</a>). It is hardly to be supposed that all the apostolic letters and writings have escaped destruction. Paul in his epistles refers a number of times to letters of his that do not now exist and that evidently were written quite frequently to the churches under his care (<a onClick="return mV(\'1Cr\',5,9);">1Co 5:9</a>; <a onClick="return mV(\'2Cr\',10,9,10);">2Co 10:9-10</a>; <a onClick="return mV(\'Eph\',3,3);">Eph 3:3</a>); "in every epistle" (<a onClick="return mV(\'2Th\',3,17);">2Th 3:17</a>) indicates not merely the apostle\'s uniform method of subscription but an extensive correspondence. <a onClick="return mV(\'Col\',4,16);">Col 4:16</a> speaks of an "epistle from Laodicea," now lost, doubtless written by Paul himself to the church at Laodicea, and to be returned by it in exchange for his epistle to the church at Colosse.`<a href="./study/isbe/search.html?string=LITERATURE,+sub-apostolic">LITERATURE, SUB-APOSTOLIC</a>`139';

isbe[3164]='Equal`e\'-kwal isos:<P>In <a onClick="return mV(\'Eze\',18,25);">Eze 18:25</a>; <a onClick="return mV(\'Eze\',29,\'1-\');">29</a>; <a onClick="return mV(\'Eze\',33,17,20);">33:17, 20</a>, "The way of the Lord is not equal" translates Hebrew yittakhen for takhan, "to weigh," and means "is not adjusted to any fixed standard," "arbitrary," "fitful," and, therefore, "not equitable, fair, or impartial" Septuagint ("is not set straight"). Compare same Hebrew word in <a onClick="return mV(\'1Sa\',2,3);">1Sa 2:3</a>, where the Lord is said to \'weigh actions.\' "Equal," therefore, is what will bear the closest investigation and strictest judgment. In <a onClick="return mV(\'Mat\',20,12);">Mt 20:12</a>, "made them equal" means "put them upon the same footing," i.e. regarded their brief service as though it were the very same as our long hours of toil. In <a onClick="return mV(\'Luk\',20,36);">Lu 20:36</a> the context restricts the equality to a particular relation. The precise meaning of isos in <a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a>, "making himself equal with God," is clearly defined by the preceding clause, for our Lord\'s opponents say that He has "called God his own Father" (Greek idion patera, i.e. His Father in a peculiar and exclusive sense; compare idiou huiou of <a onClick="return mV(\'Rom\',8,32);">Ro 8:32</a>, applying the same adjective to the Son in His relation to the Father, i.e. His Son in a sense in which no one else can claim the title). They correctly interpreted the language of Jesus as declaring that He was the Son of God in a way that put Him on an equality with God. The charge against Him is not that He said that He was "like" (homoios), but that He was "equal" (isos), i.e. of the very same rank and authority.``84';
isbe[3165]='Equality`e-kwol\'-i-ti (isotes):<P>In <a onClick="return mV(\'2Cr\',8,14);">2Co 8:14</a>, literally, ." out of equality," i.e. "in equal proportion" or "that there may be equality." In <a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>, it occurs in a paraphrase of Greek to einai isa theo, "the being on an equality with God." In this much-discussed passage, isa, according to a not unusual Attic idiom, is construed adverbially (see Meyer on passage), meaning, therefore, not \'the being equal\' (the King James Version), which would require ison, but "the having equal prerogatives and privileges." The personal equality is one thing; the equality of attributes is another, and it is the latter which is here expressed (Lightfoot). The "being on an equality" and the "having equal prerogatives" are both deductions from the possession of "the form of God." The thought is that if He who had "the form of God" had under all circumstances exercised His Divine attributes, He would have been employing only what belonged to Him, and would in no way have derogated from what belongs only to God. We regard this as referring to the incarnate Son in His historical manifestation.``84';
isbe[3166]='Equity`ek\'-wi-ti:<P>Is synonymous with "uprightness," which is found in <a onClick="return mV(\'Pro\',17,26);">Pr 17:26</a>; <a onClick="return mV(\'Isa\',59,14);">Isa 59:14</a>; <a onClick="return mV(\'Mal\',2,6);">Mal 2:6</a> in place of the King James Version "equity." <a onClick="return mV(\'Ecc\',2,21);">Ec 2:21</a> has "skilfulness" and the Revised Version, margin "success" for the King James Version "equity." The context favors this translation of kishron, which is derived from kasher, "to succeed."<P>Equity is the spirit of the law behind the letter; justice is the application of the spirit of equity; honesty is the general everyday use of justice or fairness, equity being the interior or abstract ideal. The Court of Equity overrides the Court of Common Law, deciding not upon terms, but the spirit of the deed.``91';
isbe[3167]='Er`ar (\'er, "watcher"; Er\'):<P>(1) The eldest son of Judah, the son of Jacob, by Shua the Canaanite. Judah took for him a wife named Tamar. It is recorded that Er "was wicked in the sight of Yahweh; and Yahweh slew him" (<a onClick="return mV(\'Gen\',38,3,6,7);">Ge 38:3, 6-7</a>; <a onClick="return mV(\'Gen\',46,12);">46:12</a>).<P>(2) "Er the father of Lecah" is mentioned among "the sons of Shelah the son of Judah" (<a onClick="return mV(\'1Ch\',4,21);">1Ch 4:21</a>).<P>(3) An ancestor of Jesus in Luke\'s genealogy in the 7th generation before Zerubbabel (<a onClick="return mV(\'Luk\',3,28);">Lu 3:28</a>).``1';
isbe[3168]='Era`e\'-ra:<P>We find no definite era in use in Old Testament times, and such usage does not appear until we reach the period of the Maccabees. There are some references to important events that might have served as eras had they been generally accepted and constantly employed. Such was the Exodus; and this is referred to as the starting-point in fixing the date of the building of Solomon\'s temple (<a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>), and also for the date of Aaron\'s death (<a onClick="return mV(\'Num\',33,38);">Nu 33:38</a>).<P>An earthquake is referred to by <a onClick="return mV(\'Amo\',1,1);">Amos 1:1</a> as a well-known event by which to date the beginning of his prophetic career; and Ezekiel in two passages refers to the captivity of Judah as a date for marking certain events in his life. Of these the Exodus would have been the most appropriate event to use as an era, since it marked the birth of the Hebrew nation; but the universal custom of antiquity was to date from the regnal years of the kings, as we see in the history of Egypt and Babylonia and Assyria; this custom was followed by the Israelites as soon as the kingdom was established, and was continued down to the Captivity. After the return of the Jews they naturally adopted the regnal years of the Persian kings, under whose rule they were, until the overthrow of the kingdom by Alexander. After this event, the era that prevailed most widely in Syria was that of the Seleucid kingdom, which began in 312 BC, and must have been familiar to the Jews, and we have evidence that they made use of it. When Simon the Maccabee secured the independence of the Jews from the Seleucid king, Demetrius II, in 141-140, they began to date their instruments and contracts from this event as is stated in 1Macc 13:41,42; and we find that the year of their independence is fixed by reference to the Seleucid era, the first year of Simon being the 170th of that era (see Josephus, Ant, XIII, vi, 7).<P>After this they used the era of Simon, dating by his regnal years; but whether they used this as a permanent era during the Asmonean Dynasty or dated simply from the accession of each king, we do not know. There is no doubt that the Seleucid era continued to be used throughout the country for several centuries after the downfall of the Seleucid kingdom, as we have abundant evidence from inscriptions. When the Romans took possession of Syria and Palestine, their era was of course employed by Roman officials, but this did not prevail among the people. The dynasty of the Herods sometimes employed their own regnal years and sometimes those of the emperors, as appears from their coins. The Jews must have been familiar with the eras employed by some of the Phoenician towns, such as Tyre and Sidon. Tyre had a local era which began in 126 BC, and Sidon one beginning in 112 BC; and most of the towns on the coast used the era of Alexander, dating from the battle of Issus, until the establishment of the Seleucid era. The Jews would be familiar with these from their commercial connections with the coast towns, but we do not know that they used them. They did not adopt the era of the Creation until after the time of Christ. It was fixed at 4,000 years before the destruction of the later temple, or 3760 BC.``138';
isbe[3169]='Eran`e\'-ran (\'eran, "watcher," "watchful"; Eden):<P>The son of Ephraim\'s oldest son Shuthelah (<a onClick="return mV(\'Num\',26,36);">Nu 26:36</a>).<P>Eranites, the descendants of Eran (same place) .``1';
isbe[3170]='Erastus`e-ras\'-tus (Erastos, "beloved"):<P>The name occurs three times, each time denoting a companion of Paul.<P>(1) Erastus was sent with Timothy from Ephesus into Macedonia while Paul remained in Asia for a while. They are designated "two of them that ministered unto him" (<a onClick="return mV(\'Act\',19,22);">Ac 19:22</a>).<P>(2) "Erastus the treasurer of the city" sent greetings to the Christians in Rome (<a onClick="return mV(\'Rom\',16,23);">Ro 16:23</a>). He was apparently an important person in the Corinthian community, and with Gaius probably represented that church in these fraternal relations with the Roman community.<P>(3) Erastus is one who, in <a onClick="return mV(\'2Ti\',4,20);">2Ti 4:20</a>, "remained at Corinth."<P>We have no means of discovering whether one or more than one person is meant in these references. A. C. Headlam (HDB, under the word) thinks it improbable that one who held an office implying residence in one locality should have been one of Paul\'s companions in travel. On the other hand Paul may be designating Erastus (<a onClick="return mV(\'Rom\',16,23);">Ro 16:23</a>) by an office he once held, but which he gave up to engage in mission work.``78';
isbe[3171]='Erech`e\'-rek, er\'-ek (\'erekh; Orech):<P>1. Etymology of the Name:<P>The second of the cities founded by Nimrod, the others being Babel, Accad and Calneh (<a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>). The derivation of the name is well known, Erech being the Semitic-Babylonian Uruk, from the Sumerian Unug, a word meaning "seat," probably in the sense of "residential city." The character with which it is written enters into the composition of the Babylonian names of Larsa and Ur of the Chaldees.<P>2. Position and Nature of the Ruins:<P>Its identification with Warka, on the left bank of the Euphrates, half-way between Hillah (Babylon) and Korna, is beyond a doubt. It is thought that the Euphrates must have flowed nearer to the city in ancient times, as the Gilgames legend relates that that hero and his companion Enkidu washed their hands in the stream after having killed the divine bull sent by the goddess Ishtar to destroy them. The shape of the ruin is irregular, the course of the walls of the Northeast having been seemingly determined by that of the Nile canal (Shatt-en-Nil), which flowed on that side. The extreme length of the site from north to south is over 3,000 yds., and its width about 2,800 yds. This space is very full of remains of buildings; and the foundations of the walls, with their various windings, gateways and defenses, are traceable even now.<P>3. Its Patron-Deities and Their Temples:<P>Two great deities, Ishtar and Nanaa, were worshipped in this city, the temple of the former being E-anna, "the house of heaven" (or "of Anu," in which case it is probable that the god of the heavens, Anu, was also one of the patrons of the city). The shrine dedicated to Ishtar is apparently now represented by the ruin known as Buwariyya or "reed-mats," and so called on account of the layers of matting at intervals of 4 or 5 ft. This is the great temple-tower (ziq-qurat) of the place, called E-gipar-imina, "the house of 7 enclosures." The remains are situated in a large courtyard measuring 350 ft. by 270 ft. As in the case of other Babylonian erections, the corners are directed toward the cardinal points, and its height is about 100 ft. above the desert-plain.<P>As Erech is mentioned with Babylon, Niffer (Calneh) and Eridu, as one of the cities created by Merodach (Nimrod), it is clear that it was classed with the oldest foundations in Babylonia. It was the city of Gilgames, the half-mythical king of the earliest period, who seems to have restored the walls and temples. Its earliest known ruler of historical times was Ensag-kus-anna, about 4,000 BC.<P>4. History of the City\'s Temples, etc.:<P>The celebrated shrine of Ishtar was already in existence in the time of Lugal-zaggi-si, who came somewhat later. King Dungi (2600 BC) restored E-anna and built its great wall. This was in the time of the great Ur Dynasty, but later the city seems to have come under the dominion of the kings of Isin, Libit-Ishtar having apparently restored the sanctuary of Ishtar on E- gipara. Another great ruler of the early period was Sin-gasid, king of Erech, who was a patron of E-anna; and when he restored this shrine, he endowed it with grain, wool, oil and 1 shekel of gold. There seems also to have been a shrine to Nergal, god of war, which was restored by King Sin-gamil. About 2280 BC Kudur-Nanchunde, the Elamite king, plundered the city, and carried off the statue of the goddess Nanaa, which was only restored to its place by Assur-bani-apli, the Assyrian king, about 635 BC. Samsu-iluna seems to have surpassed his father Hammurabi (Amraphel) in the restoration of the city\'s temples, and other rulers who did not forget Erech were Nebuchadrezzar and Nabonidus.<P>5. Literature Referring to Erech:<P>Many tablets have been found on the site, and give promise of interesting discoveries still to come. Having been the capital of the hero-king Gilgames, who saw the wonders of the wide world, spoke with the Babylonian Noah face to face, and almost attained immortality as a living man, it was always a place of romance. Poetical compositions concerning it exist, one of the most interesting being a lamentation possibly written after the invasion of Kudur-Nanchundi, when famine was rife in the city, blood flowed like water in E-ulbar, the house of Istar\'s oracle, and the enemy heaped up fire in all the goddess\' lands as one heaps up embers.<P>6. The City\'s Numerous Names:<P>The consideration in which the city was held is made plain by the geographical lists, from which it would seem that it had no less than 11 names, among them being Illab or Illag, Tir-anna, "the heavenly grove"; Ub-imina, "the 7 regions"; Uru- gipara-imina, "the city of the 7 enclosures"; and Uruk-supuri, "Erech of the folds" (the name which it always bears in the Gilgames legend), given to it either on account of its being a center where pastoral tribes gathered, or because of the flocks kept for sacrifice to its deities.<P>7. Tablets and Tombs of Late Date:<P>Besides the inscriptions of the kings already mentioned, tablets of the reigns of Nabopolassar, Nebuchadrezzar, Nabonidus, Cyrus, Darius and some of the Seleucids have been found on the site. In the ruins of the town and the country around, numerous glazed earthenware (slipper-shaped) coffins and other receptacles, used for and in connection with the burial of the dead, occur. These are mostly of the Parthian period, but they imply that the place was regarded as a necropolis, possibly owing to the sanctity attached to the site.<P>LITERATURE.<P>Schrader, KAT; Loftus, Chaldoea and Susiana, 162ff; Fried. Delitzsch, Wo lag das Paradies? 221f; Zehnpfund, Babylonien in seinen wichtigsten Ruinenstatten, 48ff.``136';
isbe[3172]='Eri-Aku`er-i-a-koo\', e-ri-a-ku\':<P>1. The Name and Its Etymology:<P>This is the probable Sumerian reading of the well-known Babylonian name written with the characters for "servant" (Sem wardu or ardu) and the group standing for the Moon-god Sin (written En-zu = Zu-en), otherwise Aku, the whole meaning "servant of the Moon-god." This ruler, who was king of Larsa (<a href="./study/isbe/search.html?string=ELLASAR">ELLASAR</a>, compare that article), is generally identified with the <a href="./study/isbe/search.html?string=ARIOCH">ARIOCH</a> (which see) of <a onClick="return mV(\'Gen\',14,9);">Ge 14:9</a>. Several Assyriologists read the name with the Semitic Babylonian pronunciation of Warad-Sin; and, if this be correct, there would be a certain amount of doubt as to the generally received identification; though this, on the other hand, might simply prove that the ancient Hebrews obtained their transcription from a Sumerian source.<P>2. Inscriptions Mentioning Eri-Aku:<P>In addition to a number of contract-tablets, the following inscriptions mentioning Eri-Aku or Warad-Sin are known:<P>(1) A dedication, by Kudur-mabuk, "father of Martu" (Amurru, the land of the Amorites), son of Simti-Silchak, of some sacred object to the Moon-god Nannar, for his own life and that of Eri-Aku, his son, the king of Larsa.<P>(2) A dedication, by Eri-Aku, to Ishtar of Challabu, for his own life and that of his father and begetter Kudur-mabuk. The text records the restoration of Istar\'s sanctuary.<P>(3) A dedication, by Eri-Aku, to the god Nannar, for the preservation of his own life and that of his father, Kudur-mabuk. The restoration of several temples is referred to.<P>(4) An inscription of Eri-Aku, "the powerful man," "the nourisher of Ur (of the Chaldees), the king of Larsa, the king of Sumer and Akkad; son of Kudur-mabuk, the father of Emutbala." The text records that he raised the wall of Ur, called "Nannar is the consolidator of the foundations of the land," high like a mountain.<P>(5) A dedication by Eri-Aku to Nin-insina (titles as above). It records the building of the temple E-u-namtila, for his own life, and the life of Kudurmabuk, the father his begetter.<P>3. The Nationality of His Family:<P>These inscriptions and others show that Eri-Aku belonged to an Elamite family which held the throne of Larsa, a state which, in common with Babylonia itself, acknowledged the suzerainty of Elam. Kudurmabuk would seem, from motives of policy, to have given his sons Sumerian and Semitic Babylonian names; and it is noteworthy that he did not retain the rule of Larsa for himself, but delegated it to his offspring, keeping for himself the dominion of Emutbala and, as his own inscription shows, the land of the Amorites. With regard to these it may be noted, that the expression adda, "father," probably means simply "administrator."<P>4. Eri-Aku and Rim-Sin:<P>Eri-Aku seems to have died while his father was still alive, and was succeeded by Rim-Sin, who, as Francois Thureau-Dangin points out, must have been his brother. As in the case of Eri-Aku, Kudur-mabuk inaugurated the reign of Rim-Sin by a dedication; but there seems to be no inscription in which Rim-Sin makes a dedication for the life of his father, implying that Kudur-mabuk died soon after his second son came to the throne.<P>And here the question of the identification of Eri-Aku with Eri-Eaku (var. -Ekua) claims consideration. This name occurs on certain tablets of late date from Babylonia, and is coupled with a name which may be read Kudur-lachgumal (for Kudurlachbgomar, i.e. Chedorlaomer), and Tud-chul, 1 (NOTE: 1 Written Tudchula, but the syllabaries indicate the final a as silent.) the Biblical Tidal.<P>5. Is Eri-Aku to Be Identified with Eri-Eaku?:<P>These inscriptions are very mutilated, but from the smaller one it would seem that Eri-(E)aku had a son named Durmah-ilani, who ravaged some district, and there were floods at Babylon. (But) his son slaughtered him like a lamb, and old man and child (were slain) with the sword. Similar things seem to be said of Tudchul or Tidal. The larger fragment gives further details of the life of Durmach-ilani, who had usurped royal power and had been killed with the sword. If the events recorded belong to this period, they must have taken place after the death of Eri-Aku (-Eaku, -Ekua), but before that of Kudur-lachgumal. It is to be noted that, in accordance with Elamite usage, the crown did not pass to the eldest son after a king\'s death, but to the king\'s eldest brother. In Elam this led to endless conflicts, and the same probably took place in Larsa until incorporated with the states of Babylonia.<P>6. A Historical Romance:<P>The fact that the history of Kudur-lachgumal (?) forms the subject of a poetical legend suggests that the texts mentioning these kings may have belonged to a kind of historical romance, of which Chedorlaomer (Amraphel), Arioch, and Tidal were the heroes—and, in truth, this is implied by their style. That they are utterly apocryphal, however, remains to be proved.<P>LITERATURE.<P>See "Inscriptions and Records Referring to Babylonia and Elam," etc., Journal of the Victoria Institute, 1895-96 (also separately); and the articles <a href="./study/isbe/search.html?string=CHEDORLAOMER">CHEDORLAOMER</a> and <a href="./study/isbe/search.html?string=ELAM">ELAM, section 12 (5)</a>.``136';
isbe[3173]='Eri; Erites`e\'-ri, e\'-rits (\'eri, "watcher"):<P>The fifth of the seven sons of Gad (<a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a>; <a onClick="return mV(\'Num\',26,16);">Nu 26:16</a>).<P>Patronymic, Erites (same place), a clan of Gad.``1';
isbe[3174]='Err; Error`ur, er\'-er:<P>To err is in the Old Testament the translation of shaghah, and ta\'ah, both of which mean literally, ." to wander," "to go astray." We have shaghah in <a onClick="return mV(\'1Sa\',26,21);">1Sa 26:21</a>, "I have played the fool, and have erred"; <a onClick="return mV(\'Job\',19,4);">Job 19:4</a>, "Mine error remaineth with myself," i.e. "is my own concern," or, perhaps, "only injures myself"; <a onClick="return mV(\'Psa\',119,118);">Ps 119:118</a>; <a onClick="return mV(\'Isa\',28,7);">Isa 28:7</a> the King James Version (thrice); ta\'ah, <a onClick="return mV(\'Psa\',95,10);">Ps 95:10</a>; <a onClick="return mV(\'Pro\',14,22);">Pr 14:22</a>; <a onClick="return mV(\'Isa\',35,8);">Isa 35:8</a>. It means also "to cause to err" (<a onClick="return mV(\'Isa\',3,12);">Isa 3:12</a>; <a onClick="return mV(\'Isa\',30,28);">30:28</a>, "a bridle that causeth to err"; <a onClick="return mV(\'Jer\',23,13,32);">Jer 23:13, 32</a>; "Their lies (i.e. the unreal deities, creatures of their own imagination) have caused them to err," <a onClick="return mV(\'Amo\',2,4);">Am 2:4</a>).<P>In the New Testament the word is generally planaomai, "to wander" (<a onClick="return mV(\'Mar\',12,24,27);">Mr 12:24, 27</a>; <a onClick="return mV(\'Hbr\',3,10);">Heb 3:10</a>; <a onClick="return mV(\'Jam\',5,19);">Jas 5:19</a>); astocheo, "to miss the mark," "to swerve," occurs twice (<a onClick="return mV(\'1Ti\',6,21);">1Ti 6:21</a>; <a onClick="return mV(\'2Ti\',2,18);">2Ti 2:18</a>).<P>Error in the Old Testament represents various words: sheghaghah, "mistake," "oversight" (<a onClick="return mV(\'Ecc\',5,6);">Ec 5:6</a>; compare <a onClick="return mV(\'Pro\',20,25);">Pr 20:25</a> and see <a href="./study/isbe/search.html?string=INQUIRE">INQUIRE</a>); meshughah, with the same meaning, "wandering" (<a onClick="return mV(\'Job\',19,4);">Job 19:4</a>; compare <a onClick="return mV(\'Psa\',19,12);">Ps 19:12</a>); shal, "rashness," "mistake" (<a onClick="return mV(\'2Sa\',6,7);">2Sa 6:7</a>, "God smote him there for his error," the Revised Version, margin "rashness"); shalu, Aramaic "mistake" (<a onClick="return mV(\'Dan\',6,4);">Da 6:4</a>); to\'ah, "injury" (<a onClick="return mV(\'Isa\',32,6);">Isa 32:6</a>).<P>In the New Testament we have plane, "wandering" (<a onClick="return mV(\'Rom\',1,27);">Ro 1:27</a>; <a onClick="return mV(\'Jam\',5,20);">Jas 5:20</a>; <a onClick="return mV(\'1Jo\',4,6);">1Joh 4:6</a>; <a onClick="return mV(\'Jud\',1,11);">Jude 1:11</a>, "the error of Balaam"); agnoema, "ignorance" (<a onClick="return mV(\'Hbr\',9,7);">Heb 9:7</a>, margin, Greek "ignorances"). For "is deceived" (<a onClick="return mV(\'Pro\',20,1);">Pr 20:1</a>) the Revised Version (British and American) has "erreth," margin "or reeleth"; for "them that are out of the way" (<a onClick="return mV(\'Hbr\',5,2);">Heb 5:2</a>), "the ignorant and erring"; for "deceit" (<a onClick="return mV(\'1Th\',2,3);">1Th 2:3</a>), "error."<P>The English word "error" has the same original meaning as the Hebrew and Greek main words, being derived from erro, "to wander." "To err is human," but there are errors of the heart as well as of the head. The familiar phrase just quoted seems to have its equivalent in the marginal rendering of <a onClick="return mV(\'Gen\',6,3);">Ge 6:3</a>, "in their going astray they are flesh." Errors through ignorance are in the Bible distinguished from errors of the heart and willful errors (<a onClick="return mV(\'Lev\',5,18);">Le 5:18</a>; <a onClick="return mV(\'Num\',15,22);">Nu 15:22</a>; <a onClick="return mV(\'Eze\',45,20);">Eze 45:20</a>).``185';

isbe[3176]='Esarhaddon`e-sar-had\'-on (\'ecar-chaddon; Assyrian Asur-ach-iddina, "Ashur hath given a brother"):<P>During his lifetime, Sennacherib, king of Assyria, made his favorite son, Esarhaddon (680-668 BC), the viceroy of Babylon; and although he was not the eldest son, he decreed that he should become the legal heir to the throne of Assyria. Sennacherib, having been slain in 681, apparently by two of his sons, who are called in the Old Testament Adrammelech and Sharezer (<a onClick="return mV(\'2Ki\',19,37);">2Ki 19:37</a>), Esarhaddon proceeded to Nineveh, where the rebellion which followed the death of his father collapsed, having existed for about a month and a half. The Old Testament informs us that the murderers of his father fled to Armenia. This is corroborated by the inscriptions which say that at Melid, in the land of Hanirabbat, which can be said to be in Armenia, Esarhaddon fought the rebels and defeated them; whereupon he was proclaimed king. His father had been so displeased with Babylon that he had attempted to annihilate the city by making it a swamp. Esarhaddon, however, having been infatuated with the ancient culture of the Babylonians, adopted a conciliatory attitude toward the people. Immediately he planned to restore the city on magnificent proportions. The foundations of his work were laid with impressive ceremonies, and in every way he endeavored to ameliorate the inhabitants by his gracious deeds. Even at Nippur evidences of his work in restoring the ancient shrine of Ellil are seen. The kings of the west who became his vassals, among them being Manasseh of Judah, were required to furnish building materials for his operations in Babylonia. His work in that land explains why the Judean king was incarcerated at Babylon (<a onClick="return mV(\'2Ch\',33,11);">2Ch 33:11</a>) instead of Assyria.<P>Esarhaddon was first compelled to defend the kingdom against the inroads of the hordes from the North. The Gimirra (perhaps referring to Gomer of the Old Testament), who were called Manda, seemed to pour into the land. A decisive victory was finally gained over them, and they were driven back into their own country. Afterward, the Medes and the Chaldeans were also subjugated. He then directed his attentions toward the west. Sidon having revolted against Assyria, Esarhaddon laid siege to the city, which after three years was finally captured and destroyed. He built another city upon the same site, which he called Kar-Esarhaddon, and endeavored to revive its commerce. And, as is mentioned in <a onClick="return mV(\'Ezr\',4,2);">Ezr 4:2</a>; compare 10, he repopulated the city (Samaria) with captives from Elam and Babylonia.<P>The capture of Tyre was also attempted, but, the city being differently situated, a siege from the land was insufficient to bring about submission, as it was impossible to cut off the commerce by sea. The siege, after several years, seems to have been lifted. Although on a great monolith Esarhaddon depicts Ba\'al, the king of Tyre, kneeling before him with a ring through his lips, there is nothing in the inscriptions to bear this out.<P>His work in Canaan was preparatory to his conquest of Egypt. Tirhakah, the Ethiopian king of Egypt, was attacked on the borders, but no victory was gained. Several years later he crossed the borders and gained a decisive victory at Iskhupri. He then proceeded to lay siege to Memphis, which soon capitulated; and Egypt, to the confines of Nubia, surrendered to Assyria. Esarhaddon reorganized the government, and even changed the names of the cities. Necoh was placed over the 22 princes of the land. In 668, Egypt revolted and Esarhaddon, while on his way to put down the revolt, died. He had arranged that the kingdom be divided between two of his sons: Ashurbanipal was to be king of Assyria, and Shamash-shum-ukin was to reign over Babylonia. The nobles decreed, however, that the empire should not be divided, but Shamash-shum-ukin was made viceroy of Babylonia.``24';
isbe[3177]='Esau`e\'-so (\'esaw, "hairy"; Esau):<P>Son of Isaac, twin brother of Jacob. The name was given on account of the hairy covering on his body at birth: "all over like a hairy garment" (<a onClick="return mV(\'Gen\',25,25);">Ge 25:25</a>). There was a prenatal foreshadowing of the relation his descendants were to sustain to those of his younger brother, Jacob (<a onClick="return mV(\'Gen\',25,23);">Ge 25:23</a>). The moment of his birth also was signalized by a circumstance that betokened the same destiny (<a onClick="return mV(\'Gen\',25,26);">Ge 25:26</a>).<P>The young Esau was fond of the strenuous, daring life of the chase—he became a skillful hunter, "a man of the field" (\'ish sadheh). His father warmed toward him rather than toward Jacob, because Esau\'s hunting expeditions resulted in meats that appealed to the old man\'s taste (<a onClick="return mV(\'Gen\',25,28);">Ge 25:28</a>). Returning hungry from one of these expeditions, however, Esau exhibited a characteristic that marked him for the inferior position which had been foretokened at the time of his birth. Enticed by the pottage which Jacob had boiled, he could not deny himself, but must, at once, gratify his appetite, though the calm and calculating Jacob should demand the birthright of the firstborn as the price (<a onClick="return mV(\'Gen\',25,\'30-34\');">Ge 25:30-34</a>). Impulsively he snatched an immediate and sensual gratification at the forfeit of a future glory. Thus he lost the headship of the people through whom God\'s redemptive purpose was to be wrought out in the world, no less than the mere secular advantage of the firstborn son\'s chief share in the father\'s temporal possessions. Though Esau had so recklessly disposed of his birthright, he afterward would have secured from Isaac the blessing that appertained, had not the cunning of Rebekah provided for Jacob. Jacob, to be sure, had some misgiving about the plan of his mother (<a onClick="return mV(\'Gen\',27,12);">Ge 27:12</a>), but she reassured him; the deception was successful and he secured the blessing. Now, too late, Esau bitterly realized somewhat, at least, of his loss, though he blamed Jacob altogether, and himself not at all (<a onClick="return mV(\'Gen\',27,34,36);">Ge 27:34, 36</a>). Hating his brother on account of the grievance thus held against him, he determined upon fratricide as soon as his father should pass away (<a onClick="return mV(\'Gen\',27,41);">Ge 27:41</a>); but the watchful Rebekah sent Jacob to Haran, there to abide with her kindred till Esau\'s wrath should subside (<a onClick="return mV(\'Gen\',27,\'42-45\');">Ge 27:42-45</a>).<P>Esau, at the age of forty, had taken two Hittite wives, and had thus displeased his parents. Rebekah had shrewdly used this fact to induce Isaac to fall in with her plan to send Jacob to Mesopotamia; and Esau, seeing this, seems to have thought he might please both Isaac and Rebekah by a marriage of a sort different from those already contracted with Canaanitish women. Accordingly, he married a kinswoman in the person of a daughter of Ishmael (<a onClick="return mV(\'Gen\',28,6,9);">Ge 28:6, 9</a>). Connected thus with the "land of Seir," and by the fitness of that land for one who was to live by the sword, Esau was dwelling there when Jacob returned from Mesopotamia. While Jacob dreaded meeting him, and took great pains to propitiate him, and made careful preparations against a possible hostile meeting, very earnestly seeking Divine help, Esau, at the head of four hundred men, graciously received the brother against whom his anger had so hotly burned. Though Esau had thus cordially received Jacob, the latter was still doubtful about him, and, by a sort of duplicity, managed to become separated from him, Esau returning to Seir (<a onClick="return mV(\'Gen\',33,\'12-17\');">Ge 33:12-17</a>). Esau met his brother again at the death of their father, about twenty years later (<a onClick="return mV(\'Gen\',35,29);">Ge 35:29</a>). Of the after years of his life we know nothing.<P>Esau was also called Edom ("red"), because he said to Jacob: "Feed me, I pray thee, with that same red pottage" (<a onClick="return mV(\'Gen\',25,30);">Ge 25:30</a>). The land in which he established himself was "the land of Seir," so called from Seir, ancestor of the Horites whom Esau found there; and called also Edom from Esau\'s surname, and, it may be, too, from the red sandstone of the country (Sayce).<P>"Esau" is sometimes found in the sense of the descendants of Esau, and of the land in which they dwelt (<a onClick="return mV(\'Deu\',2,5);">De 2:5</a>; <a onClick="return mV(\'Oba\',1,6,8,18,19);">Ob 1:6, 8, 18-19</a>).``61';
isbe[3178]='Esay`e\'-sa (Esaias):<P>the King James Version for Isaiah (2Esdras 2:18; Ecclesiasticus 48:22).``1';
isbe[3179]='Eschatology``<a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>`1';
isbe[3180]='Eschatology of the New Testament, I-V`es-ka-tol\'-o-ji:<P>Contents<P><b>I. DOCTRINAL AND RELIGIOUS SIGNIFICANCE</b><P><b>II. GENERAL STRUCTURE</b><P><b>III. COURSE OF DEVELOPMENT</b><P><b>IV. GENERAL AND INDIVIDUAL ESCHATOLOGY</b><P><b>V. THE PAROUSIA</b><P class="in15">1. Definition<P class="in15">2. Signs Preceding the Parousia<P class="in15">3. Events Preceding the Parousia<P class="in30">(1) The Conversion of Israel<P class="in30">(2) The Coming of the Antichrist<P class="in15">4. The Manner of the Parousia<P><b>VI. THE RESURRECTION</b><P class="in15">1. Its Universality<P class="in15">2. The Millennium<P class="in15">3. The Resurrection of Believers<P class="in15">4. The Resurrection-Body<P><b>VII. THE CHANGE OF THOSE LIVING AT THE PAROUSIA</b><P><b>VIII. THE JUDGMENT</b><P><b>IX. THE CONSUMMATE STATE</b><P><b>X. THE INTERMEDIATE STATE</b><P><b>XI. LITERATURE</b><hr /><P>I. Doctrinal and Religious Significance.<P>The subject of eschatology plays a prominent part in New Testament teaching and religion. Christianity in its very origin bears an eschatological character. It means the appearance of the Messiah and the inauguration of His work; and from the Old Testament point of view these form part of eschatology. It is true in Jewish theology the days of the Messiah were not always included in the eschatological age proper, but often regarded as introductory to it (compare Weber, Judische Theol. 2, 371ff). And in the New Testament also this point of view is to some extent represented, inasmuch as, owing to the appearance of the Messiah and the only partial fulfillment of the prophecies for the present, that which the Old Testament depicted as one synchronous movement is now seen to divide into two stages, namely, the present Messianic age and the consummate state of the future. Even so, however, the New Testament draws the Messianic period into much closer connection with the strictly eschatological process than Judaism. The distinction in Judaism rested on a consciousness of difference in quality between the two stages, the content of the Messianic age being far less spiritually and transcendentally conceived than that of the final state. The New Testament, by spiritualizing the entire Messianic circle of ideas, becomes keenly alive to its affinity to the content of the highest eternal hope, and consequently tends to identify the two, to find the age to come anticipated in the present. In some cases this assumes explicit shape in the belief that great eschatological transactions have already begun to take place, and that believers have already attained to at least partial enjoyment of eschatological privileges. Thus the present kingdom in our Lord\'s teaching is one in essence with the final kingdom; according to the discourses in John eternal life is in principle realized here; with Paul there has been a prelude to the last judgment and resurrection in the death and resurrection of Christ, and the life in the Spirit is the first-fruits of the heavenly state to come. The strong sense of this may even express itself in the paradoxical form that the eschatological state has arrived and the one great incision in history has already been made (<a onClick="return mV(\'Hbr\',2,3,5);">Heb 2:3, 5</a>; <a onClick="return mV(\'Hbr\',9,11);">9:11</a>; <a onClick="return mV(\'Hbr\',10,1);">10:1</a>; <a onClick="return mV(\'Hbr\',12,\'22-24\');">12:22-24</a>). Still, even where this extreme consciousness is reached, it nowhere supersedes the other more common representation, according to which the present state continues to lie this side of the eschatological crisis, and, while directly leading up to the latter, yet remains to all intents a part of the old age and world-order. Believers live in the "last days," upon them "the ends of the ages are come," but "the last day," "the consummation of the age," still lies in the future (<a onClick="return mV(\'Mat\',13,39,40,49);">Mt 13:39-40, 49</a>; <a onClick="return mV(\'Mat\',24,3);">24:3</a>; <a onClick="return mV(\'Mat\',28,20);">28:20</a>; <a onClick="return mV(\'Jhn\',6,39,44,54);">Joh 6:39, 44, 54</a>; <a onClick="return mV(\'Jhn\',12,48);">12:48</a>; <a onClick="return mV(\'1Cr\',10,11);">1Co 10:11</a>; <a onClick="return mV(\'2Ti\',3,1);">2Ti 3:1</a>; <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>; <a onClick="return mV(\'Hbr\',9,26);">9:26</a>; <a onClick="return mV(\'Jam\',5,3);">Jas 5:3</a>; <a onClick="return mV(\'1Pe\',1,5,20);">1Pe 1:5, 20</a>; <a onClick="return mV(\'2Pe\',3,3);">2Pe 3:3</a>; <a onClick="return mV(\'1Jo\',2,18);">1Joh 2:18</a>; <a onClick="return mV(\'Jud\',1,18);">Jude 1:18</a>).<P>The eschatological interest of early believers was no mere fringe to their religious experience, but the very heart of its inspiration. It expressed and embodied the profound supernaturalism and soteriological character of the New Testament faith. The coming world was not to be the product of natural development but of a Divine interposition arresting the process of history. And the deepest motive of the longing for this world was a conviction of the abnormal character of the present world, a strong sense of sin and evil. This explains why the New Testament doctrine of salvation has grown up to a large extent in the closest interaction with its eschatological teaching. The present experience was interpreted. in the light of the future. It is necessary to keep this in mind for a proper appreciation of the generally prevailing hope that the return of the Lord might come in the near future. Apocalyptic calculation had less to do with this than the practical experience that the earnest of the supernatural realities of the life to come was present in the church, and that therefore it seemed unnatural for the full fruition of these to be long delayed. The subsequent receding of this acute eschatological state has something to do with the gradual disappearance of the miraculous phenomena of the apostolic age.<P>II. General Structure.<P>New Testament eschatology attaches itself to the Old Testament and to Jewish belief as developed on the basis of ancient revelation. It creates on the whole no new system or new terminology, but incorporates much that was current, yet so as to reveal by selection and distribution of emphasis the essential newness of its spirit. In Judaism there existed at that time two distinct types of eschatological outlook. There was the ancient national hope which revolved around the destiny of Israel. Alongside of it existed a transcendental form of eschatology with cosmical perspective, which had in view the destiny of the universe and of the human race. The former of these represents the original form of Old Testament eschatology, and therefore occupies a legitimate place in the beginnings of the New Testament development, notably in the revelations accompanying the birth of Christ and in the earlier (synoptical) preaching of John the Baptist. There entered, however, into it, as held by the Jews, a considerable element of individual and collective eudaemonism, and it had become identified with a literalistic interpretation of prophecy, which did not sufficiently take into account the typical import and poetical character of the latter. The other scheme, while to some extent the product of subsequent theological development, lies prefigured in certain later prophecies, especially in Daniel, and, far from being an importation from Babylonian, or ultimately Persian, sources, as some at present maintain, represents in reality the true development of the inner principles of Old Testament prophetic revelation. To it the structure of New Testament eschatology closely conforms itself.<P>In doing this, however, it discards the impure motives and elements by which even this relatively higher type of Jewish eschatology was contaminated. In certain of the apocalyptic writings a compromise is attempted between these two schemes after this manner, that the carrying out of the one is merely to follow that of the other, the national hope first receiving its fulfillment in a provisional Messianic kingdom of limited duration (400 or 1,000 years), to be superseded at the end by the eternal state. The New Testament does not follow the Jewish theology along this path. Even though it regards the present work of Christ as preliminary to the consummate order of things, it does not separate the two in essence or quality, it does not exclude the Messiah from a supreme place in the coming world, and does not expect a temporal Messianic kingdom in the future as distinguished from Christ\'s present spiritual reign, and as preceding the state of eternity. In fact the figure of the Messiah becomes central in the entire eschatological process, far more so than is the case in Judaism. All the stages in this process, the resurrection, the judgment, the life eternal, even the intermediate state, receive the impress of the absolute significance which Christian faith ascribes to Jesus as the Christ. Through this Christocentric character New Testament eschatology acquires also far greater unity and simplicity than can be predicated of the Jewish schemes. Everything is practically reduced to the great ideas of the resurrection and the judgment as consequent upon the Parousia of Christ. Much apocalyptic embroidery to which no spiritual significance attached is eliminated. While the overheated fantasy tends to multiply and elaborate, the religious interest tends toward concentration and simplification.<P>III. Course of Development.<P>In New Testament eschatological teaching a general development in a well-defined direction is traceable. The starting-point is the historico-dramatic conception of the two successive ages. These two ages are distinguished as houtos ho aion, ho nun aion, ho enesios aion, "this age," "the present age" (<a onClick="return mV(\'Mat\',12,32);">Mt 12:32</a>; <a onClick="return mV(\'Mat\',13,22);">13:22</a>; <a onClick="return mV(\'Luk\',16,8);">Lu 16:8</a>; <a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>; <a onClick="return mV(\'1Cr\',1,20);">1Co 1:20</a>; <a onClick="return mV(\'1Cr\',2,6,8);">2:6, 8</a>; <a onClick="return mV(\'1Cr\',3,18);">3:18</a>; <a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>; <a onClick="return mV(\'Gal\',1,4);">Ga 1:4</a>; <a onClick="return mV(\'Eph\',1,21);">Eph 1:21</a>; <a onClick="return mV(\'Eph\',2,2);">2:2</a>; <a onClick="return mV(\'Eph\',6,12);">6:12</a>; <a onClick="return mV(\'1Ti\',6,17);">1Ti 6:17</a>; <a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>; <a onClick="return mV(\'Tts\',2,12);">Tit 2:12</a>), and ho aion ekeinos, ho aion mellon, ho aion erchomenos, "that age," "the future age" (<a onClick="return mV(\'Mat\',12,32);">Mt 12:32</a>; <a onClick="return mV(\'Luk\',18,30);">Lu 18:30</a>; <a onClick="return mV(\'Luk\',20,35);">20:35</a>; <a onClick="return mV(\'Eph\',2,7);">Eph 2:7</a>; <a onClick="return mV(\'Hbr\',6,5);">Heb 6:5</a>). In Jewish literature before the New Testament, no instances of the developed antithesis between these two ages seem to be found, but from the way in which it occurs in the teaching of Jesus and Paul it appears to have been current at that time. (The oldest undisputed occurrence is a saying of Johanan ben Zaqqay, about 80 AD.) The contrast between these two ages is (especially with Paul) that between the evil and transitory, and the perfect and abiding. Thus, to each age belongs its own characteristic order of things, and so the distinction passes over into that of two "worlds" in the sense of two systems (in Hebrew and Aramaic the same word \'olam, \'olam, does service for both, in Greek aion usually renders the meaning "age," occasionally "world" (<a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>; <a onClick="return mV(\'Hbr\',11,3);">11:3</a>), kosmos meaning "world"; the latter, however, is never used of the future world). Compare Dalman, Die Worte Jesu, I, 132-46. Broadly speaking, the development of New Testament eschatology consists in this, that the two ages are increasingly recognized as answering to two spheres of being which coexist from of old, so that the coming of the new age assumes the character of a revelation and extension of the supernal order of things, rather than that of its first entrance into existence. Inasmuch as the coming world stood for the perfect and eternal, and in the realm of heaven such a perfect, eternal order of things already existed, the reflection inevitably arose that these two were in some sense identical. But the new significance which the antithesis assumes does not supersede the older historicodramatic form. The higher world so interposes in the course of the lower as to bring the conflict to a crisis.<P>The passing over of the one contrast into the other, therefore, does not mark, as has frequently been asserted, a recession of the eschatological wave, as if the interest had been shifted from the future to the present life. Especially in the Fourth Gospel this "de-eschatologizing" process has been found, but without real warrant. The apparent basis for such a conclusion is that the realities of the future life are so vividly and intensely felt to be existent in heaven and from there operative in the believer\'s life, that the distinction between what is now and what will be hereafter enjoyed becomes less sharp. Instead of the supersedure of the eschatological, this means the very opposite, namely, its most real anticipation. It should further be observed that the development in question is intimately connected and keeps equal pace with the disclosure of the preexistence of Christ, because this fact and the descent of Christ from heaven furnished the clearest witness to the reality of the heavenly order of things. Hence, it is especially observable, not in the earlier epistles of Paul, where the structure of eschatological thought is still in the main historico-dramatic, but in the epistles of the first captivity (<a onClick="return mV(\'Eph\',1,3);">Eph 1:3</a>,<a onClick="return mV(\'Eph\',1,\'10-22\');">10-22</a>; <a onClick="return mV(\'Eph\',2,6);">2:6</a>; <a onClick="return mV(\'Eph\',3,9,10);">3:9-10</a>; <a onClick="return mV(\'Eph\',4,9,10);">4:9-10</a>; <a onClick="return mV(\'Eph\',6,12);">6:12</a>; <a onClick="return mV(\'Phl\',2,\'5-11\');">Php 2:5-11</a>; <a onClick="return mV(\'Phl\',3,20);">3:20</a>; <a onClick="return mV(\'Col\',1,15,17);">Col 1:15, 17</a>; <a onClick="return mV(\'Col\',3,2);">3:2</a>; further, in <a onClick="return mV(\'Hbr\',1,2,3);">Heb 1:2-3</a>; <a onClick="return mV(\'Hbr\',2,5);">2:5</a>; <a onClick="return mV(\'Hbr\',3,4);">3:4</a>; <a onClick="return mV(\'Hbr\',6,5,11);">6:5, 11</a>; <a onClick="return mV(\'Hbr\',7,13,16);">7:13, 16</a>; <a onClick="return mV(\'Hbr\',9,14);">9:14</a>; <a onClick="return mV(\'Hbr\',11,10,16);">11:10, 16</a>; <a onClick="return mV(\'Hbr\',12,22,23);">12:22-23</a>). The Fourth Gospel marks the culmination of this line of teaching, and it is unnecessary to point out how here the contrast between heaven and earth in its christological consequences determines the entire structure of thought. But here it also appears how the last outcome of the New Testament progress of doctrine had been anticipated in the highest teaching of our Lord. This can be accounted for by the inherent fitness that the supreme disclosures which touch the personal life of the Saviour should come not through any third person, but from His own lips.<P>IV. General and Individual Eschatology.<P>In the Old Testament the destiny of the nation of Israel to such an extent overshadows that of the individual, that only the first rudiments of an individual eschatology are found. The individualism of the later prophets, especially Jeremiah and Ezekiel, bore fruit in the thought of the intermediate period. In the apocalyptic writings considerable concern is shown for the ultimate destiny of the individual. But not until the New Testament thoroughly spiritualized the conceptions of the last things could these two aspects be perfectly harmonized. Through the centering of the eschatological hope in the Messiah, and the suspending of the individual\'s share in it on his personal relation to the Messiah, an individual significance is necessarily imparted to the great final crisis. This also tends to give greater prominence to the intermediate state. Here, also, apocalyptic thought had pointed the way. None the less the Old Testament point of view continues to assert itself in that even in the New Testament the main interest still attaches to the collective, historical development of events. Many questions in regard to the intermediate period are passed by in silence. The Old Testament prophetic foreshortening of the perspective, immediately connecting each present crisis with the ultimate goal, is reproduced in New Testament eschatology on an individual scale in so far as the believer\'s life here is linked, not so much with his state after death, but rather with the consummate state after the final judgment. The present life in the body and the future life in the body are the two outstanding illumined heights between which the disembodied state remains largely in the shadow. But the same foreshortening of the perspective is also carried over from the Old Testament into the New Testament delineation of general eschatology. The New Testament method of depicting the future is not chronological. Things lying widely apart to our chronologically informed experience are by it drawn closely together. This law is adhered to doubtless not from mere limitation of subjective human knowledge, but by reason of adjustment to the general method of prophetic revelation in Old Testament and New Testament alike.<P>V. The Parousia.<P>1. Definition:<P>The word denotes "coming," "arrival." It is never applied to the incarnation of Christ, and could be applied to His second coming only, partly because it had already become a fixed Messianic term, partly because there was a point of view from which the future appearance of Jesus appeared the sole adequate expression of His Messianic dignity and glory. The explicit distinction between "first advent" and "second advent" is not found in the New Testament. It occurs in Testament of the Twelve Patriarchs, Testament of Abraham 92:16. In the New Testament it is approached in <a onClick="return mV(\'Hbr\',9,28);">Heb 9:28</a> and in the use of epiphaneia for both the past appearance of Christ and His future manifestation (<a onClick="return mV(\'2Th\',2,8);">2Th 2:8</a>; <a onClick="return mV(\'1Ti\',6,14);">1Ti 6:14</a>; <a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>; <a onClick="return mV(\'2Ti\',4,1);">4:1</a>; <a onClick="return mV(\'Tts\',2,11,113);">Tit 2:11, 13</a>). The Christian use of the word parousia is more or less colored by the consciousness of the present bodily absence of Jesus from His own, and consequently suggests the thought of His future abiding presence, without, however, formally coming to mean the state of the Saviour\'s presence with believers (<a onClick="return mV(\'1Th\',4,17);">1Th 4:17</a>). Parousia occurs in <a onClick="return mV(\'Mat\',24,3,17,39);">Mt 24:3, 17, 39</a>; <a onClick="return mV(\'1Cr\',15,23);">1Co 15:23</a>; <a onClick="return mV(\'1Th\',2,19);">1Th 2:19</a>; <a onClick="return mV(\'1Th\',3,13);">3:13</a>; <a onClick="return mV(\'1Th\',4,15);">4:15</a>; <a onClick="return mV(\'1Th\',5,23);">5:23</a>; <a onClick="return mV(\'2Th\',2,1,8);">2Th 2:1, 8</a>; <a onClick="return mV(\'Jam\',5,7,8);">Jas 5:7-8</a>; <a onClick="return mV(\'2Pe\',1,16);">2Pe 1:16</a>; <a onClick="return mV(\'2Pe\',3,4,12);">3:4, 12</a>; <a onClick="return mV(\'1Jo\',2,28);">1Joh 2:28</a>. A synonymous term is apokalupsis, "revelation," probably also of pre-Christian origin, presupposing the pre-existence of the Messiah in hidden form previous to His manifestation, either in heaven or on earth (compare Apocrypha Baruch 3:29; 1:20; <a onClick="return mV(\'Ezr\'
