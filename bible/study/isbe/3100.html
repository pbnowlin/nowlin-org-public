nception of "the day of Yahweh" is changed into "the day of the Lord" (<a onClick="return mV(\'1Cr\',5,5);">1Co 5:5</a>; <a onClick="return mV(\'2Cr\',1,14);">2Co 1:14</a>; <a onClick="return mV(\'1Th\',5,2);">1Th 5:2</a>; <a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a>). In the sense of the final assize the judgment does not in earlier Jewish eschatology belong to the functions of the Messiah, except in Enoch 51:3; 55:4; 61:8ff; 62:1ff; 63. Only in the later apocalypses the Messiah appears as judge (4 Ezra (2Esdras) 13; Apocrypha Baruch 72:2 (compare Sibylline Oracles 3 286)). In the more realistic, less forensic, sense of an act of destruction, the judgment forms part of the Messiah\'s work from the outset, and is already assigned to Him by the Baptist and still more by Paul (<a onClick="return mV(\'Mat\',3,10,11,12);">Mt 3:10-12</a> = <a onClick="return mV(\'Luk\',3,16,17);">Lu 3:16-17</a>; <a onClick="return mV(\'2Th\',2,8,10,12);">2Th 2:8, 10, 12</a>).<P>The one representation passes over into the other. Jesus always claims for Himself the judgment in the strictly forensic sense. Already in His present state He exercises the right to forgive sin (<a onClick="return mV(\'Mar\',2,5,10);">Mr 2:5, 10</a>). In the Fourth Gospel, it is true, He denies that His present activity involves the task of judging (<a onClick="return mV(\'Jhn\',8,15);">Joh 8:15</a>; <a onClick="return mV(\'Jhn\',12,47);">12:47</a>). That this, however, does not exclude His eschatological judgeship appears from <a onClick="return mV(\'Jhn\',5,22,27);">Joh 5:22, 27</a> (notice the article in <a onClick="return mV(\'Jhn\',5,22);">5:22</a> "the whole judgment," which proves the reference to the last day). But even for the present, though not directly, yet indirectly by His appearance and message, Christ according to John effects a judgment among men (<a onClick="return mV(\'Jhn\',8,16);">8:16</A>; <a onClick="return mV(\'Jhn\',9,39);">9:39</A>), which culminates in His passion and death, the judgment of the world and the Prince of the world (<a onClick="return mV(\'Jhn\',12,31);">12:31</A>; <a onClick="return mV(\'Jhn\',14,30);">14:30</A>; <a onClick="return mV(\'Jhn\',16,11);">16:11</A>). A share of the judgment is assigned to angels and to the saints (<a onClick="return mV(\'Mat\',13,39,41,49);">Mt 13:39, 41, 49</a>; <a onClick="return mV(\'Mat\',16,27);">16:27</a>; <a onClick="return mV(\'Mat\',24,31);">24:31</a>; <a onClick="return mV(\'Mat\',25,31);">25:31</a>; <a onClick="return mV(\'1Th\',3,13);">1Th 3:13</a>; <a onClick="return mV(\'2Th\',1,7);">2Th 1:7</a>; <a onClick="return mV(\'Jud\',1,14);">Jude 1:14</a>f). In regard to the angels this is purely ministerial; of believers it is affirmed only in <a onClick="return mV(\'1Cr\',6,\'1-3\');">1Co 6:1-3</a> that they will have something to do with the act of judgment itself; passages like <a onClick="return mV(\'Mat\',19,28);">Mt 19:28</a>; <a onClick="return mV(\'Mat\',20,23);">20:23</a>; <a onClick="return mV(\'Luk\',22,30);">Lu 22:30</a>; <a onClick="return mV(\'Rev\',3,21);">Re 3:21</a> do not refer to the judgment proper, but to judging in the sense of "reigning," and promise certain saints a preeminent position in the kingdom of glory. The judgment extends to all men, Tyre, Sidon, Sodom, as well as the Galilean cities (<a onClick="return mV(\'Mat\',11,22,24);">Mt 11:22, 24</a>); all nations (<a onClick="return mV(\'Mat\',25,32);">Mt 25:32</a>; <a onClick="return mV(\'Jhn\',5,29);">Joh 5:29</a>; <a onClick="return mV(\'Act\',17,30,31);">Ac 17:30-31</a>; <a onClick="return mV(\'Rom\',2,6,16);">Ro 2:6, 16</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>). It also includes the evil spirits (<a onClick="return mV(\'1Cr\',6,3);">1Co 6:3</a>; <a onClick="return mV(\'2Pe\',2,4);">2Pe 2:4</a>; <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a>). It is a judgment according to works, and that not only in the case of non-believers; of believers also the works will come under consideration (<a onClick="return mV(\'Mat\',25,34);">Mt 25:34</a>ff; <a onClick="return mV(\'1Cr\',4,5);">1Co 4:5</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>; <a onClick="return mV(\'Rev\',22,12);">Re 22:12</a>). Side by side with this, however, it is taught already in the Synoptics that the decisive factor will be the acknowledgment of individuals by Jesus, which in turn depends upon the attitude assumed by them toward Jesus here, directly or indirectly (<a onClick="return mV(\'Mat\',7,23);">Mt 7:23</a>; <a onClick="return mV(\'Mat\',19,28);">19:28</a>; <a onClick="return mV(\'Mat\',25,\'35-45\');">25:35-45</a>; <a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a>).<P>By Paul the principle of judgment according to works is upheld, not merely hypothetically as a principle preceding and underlying every soteriological treatment of man by God (<a onClick="return mV(\'Rom\',2,\'1-\');">Ro 2</a>), and therefore applying to non-Christians for whose judgment no other standard is available, but also as remaining in force for Christians, who have already, under the soteriological regime of grace, received absolute, eternal acquittal in justification. This raises a twofold problem:<p class="in15">(a) why justification does not render a last judgment superfluous;<p class="in15">(b) why the last judgment in case of Christians saved by grace should be based on works.<p>In regard to (a) it ought to be remembered that the last judgment differs from justification in that it is not a private transaction in foro conscientiae, but public, in foro mundi. Hence, Paul emphasizes this element of publicity (<a onClick="return mV(\'Rom\',2,16);">Ro 2:16</a>; <a onClick="return mV(\'1Cr\',3,13);">1Co 3:13</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>). It is in accordance with this that God the Father is always the author of justification, whereas as a rule Christ is represented as presiding at the assize of the last day. As to (b), because the last judgment is not a mere private but a public transaction, something more must be taken into account than that on which the individual eternal destiny may hinge. There can be disapproval of works and yet salvation (<a onClick="return mV(\'1Cr\',3,15);">1Co 3:15</a>). But the trial of works is necessary for the sake of the vindication of God. In order to be a true theodicy the judgment must publicly exhibit and announce the complete overthrow of sin in man, and the complete working out in him of the idea of righteousness, including not merely his acquittal from the guilt, but also his deliverance from the power, of sin, not merely his imputed righteousness, but also his righteousness of life. In order to demonstrate this comprehensively, the judgment will have to take into account three things: faith (<a onClick="return mV(\'Gal\',5,5);">Ga 5:5</a>), works done in the Christian state, sanctification. Besides this the works of the Christian appear as the measure of gracious reward (<a onClick="return mV(\'Mat\',5,12,46);">Mt 5:12, 46</a>; <a onClick="return mV(\'Mat\',6,1);">6:1</a>; <a onClick="return mV(\'Mat\',10,41,42);">10:41-42</a>; <a onClick="return mV(\'Mat\',19,28);">19:28</a>; <a onClick="return mV(\'Mat\',20,\'1-16\');">20:1-16</a>; <a onClick="return mV(\'Mat\',25,\'14-45\');">25:14-45</a>; <a onClick="return mV(\'Mar\',9,41);">Mr 9:41</a>; <a onClick="return mV(\'Luk\',6,23,35);">Lu 6:23, 35</a>; <a onClick="return mV(\'1Cr\',3,8);">1Co 3:8, 14</a>; <a onClick="return mV(\'1Cr\',9,17,18);">9:17-18</a>; <a onClick="return mV(\'Col\',2,18);">Col 2:18</a>; <a onClick="return mV(\'Col\',3,24);">3:24</a>; <a onClick="return mV(\'Hbr\',10,35);">Heb 10:35</a>). These works, however, are not mechanically or commercially appraised, as in Judaism, for Paul speaks by preference of "work" in the singular (<a onClick="return mV(\'Rom\',2,7,15);">Ro 2:7, 15</a>; <a onClick="return mV(\'1Cr\',3,13);">1Co 3:13</a>; <a onClick="return mV(\'1Cr\',9,1);">9:1</a>; <a onClick="return mV(\'Gal\',6,4);">Ga 6:4</a>; <a onClick="return mV(\'Eph\',4,12);">Eph 4:12</a>; <a onClick="return mV(\'Phl\',1,6,22);">Php 1:6, 22</a>; <a onClick="return mV(\'1Th\',1,3);">1Th 1:3</a>; <a onClick="return mV(\'2Th\',1,11);">2Th 1:11</a>). And this one organic product of "work" is traced back to the root of faith (<a onClick="return mV(\'1Th\',1,3);">1Th 1:3</a>; <a onClick="return mV(\'2Th\',1,11);">2Th 1:11</a> where the genitive pisteos is a gen. of origin), and Paul speaks as a rule not of poiein but of prassein, i.e. of the practice, the systematic doing, of that which is good.<P>The judgment assigns to each individual his eternal destiny, which is absolute in its character either of blessedness or of punishment, though admittedly of degrees within these two states. Only two groups are recognized, those of the condemned and of the saved (<a onClick="return mV(\'Mat\',25,33,34);">Mt 25:33-34</a>; <a onClick="return mV(\'Jhn\',5,29);">Joh 5:29</a>); no intermediate group with as yet undetermined destiny anywhere appears. The degree of guilt is fixed according to the knowledge of the Divine will possessed in life (<a onClick="return mV(\'Mat\',10,15);">Mt 10:15</a>; <a onClick="return mV(\'Mat\',11,\'20-24\');">11:20-24</a>; <a onClick="return mV(\'Luk\',10,\'12-15\');">Lu 10:12-15</a>; <a onClick="return mV(\'Luk\',12,47);">12:47-48</a>; <a onClick="return mV(\'Jhn\',15,22,24);">Joh 15:22, 24</a>; <a onClick="return mV(\'Rom\',2,12);">Ro 2:12</a>; <a onClick="return mV(\'2Pe\',2,\'20-22\');">2Pe 2:20-22</a>). The uniform representation is that the judgment has reference to what has been done in the embodied state of this life; nowhere is there any reflection upon the conduct or product of the intermediate state as contributing to the decision (<a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>). The state assigned is of endless duration, hence described as aionios, "eternal." While this adjective etymologically need mean no more than "what extends through a certain eon or period of time," yet its eschatological usage correlates it everywhere with the "coming age," and, this age being endless in duration, every state or destiny connected with it partakes of the same character. It is therefore exegetically impossible to give a relative sense to such phrases as pur aionion, "eternal fire" (<a onClick="return mV(\'Mat\',18,8);">Mt 18:8</a>; <a onClick="return mV(\'Mat\',25,41);">25:41</a>; <a onClick="return mV(\'Jud\',1,7);">Jude 1:7</a>), kolasis aionios, "eternal punishment" (<a onClick="return mV(\'Mat\',25,46);">Mt 25:46</a>), olethros aionios, "eternal destruction" (<a onClick="return mV(\'2Th\',1,9);">2Th 1:9</a>), krisis aionios or krima aionion, "eternal judgment" (<a onClick="return mV(\'Mar\',3,29);">Mr 3:29</a>; <a onClick="return mV(\'Hbr\',6,2);">Heb 6:2</a>). This is also shown by the figurative representations which unfold the import of the adjective: the "unquenchable fire" (<a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>), "the never-dying worm" (<a onClick="return mV(\'Mar\',9,\'43-48\');">Mr 9:43-48</a>), "The smoke of their torment goeth up for ever and ever" (<a onClick="return mV(\'Rev\',14,11);">Re 14:11</a>), "tormented day and night forever and ever" (<a onClick="return mV(\'Rev\',20,10);">Re 20:10</a>). The endless duration of the state of punishment is also required by the absolute eternity of its counterpart, zoe aionios, "eternal life" (<a onClick="return mV(\'Mat\',25,46);">Mt 25:46</a>). In support of the doctrine of conditional immortality it has been urged that other terms descriptive of the fate of the condemned, such as apoleia, "perdition," phthora, "corruption," olethros, "destruction," thanatos, "death," point rather to a cessation of being. This, however, rests on an unscriptural interpretation of these terms, which everywhere in the Old Testament and the New Testament designate a state of existence with an undesirable content, never the pure negation of existence, just as "life" in Scripture describes a positive mode of being, never mere existence as such. Perdition, corruption, destruction, death, are predicated in all such cases of the welfare or the ethical spiritual character of man, without implying the annihilation of his physical existence. No more support can be found in the New Testament for the hypothesis of an apokatastasis panton, "restoration of all things," i.e. absolute universalism implying the ultimate salvation of all men. The phrase occurs only in <a onClick="return mV(\'Act\',3,21);">Ac 3:21</a>, where, however, it has no cosmical reference but relates to the fulfillment of the promises to Israel.<P>Josephus uses it of the restoration of the Jews to their land after the Captivity, Philo of the restoration of inheritances in the year of jubilee (compare <a onClick="return mV(\'Mal\',4,6);">Mal 4:6</a>; <a onClick="return mV(\'Mat\',17,11);">Mt 17:11</a>; <a onClick="return mV(\'Mar\',9,12);">Mr 9:12</a>; <a onClick="return mV(\'Act\',1,6);">Ac 1:6</a>). Absolute universalism has been found in <a onClick="return mV(\'Rom\',5,18);">Ro 5:18</a>; <a onClick="return mV(\'1Cr\',15,22,28);">1Co 15:22, 28</a>; <a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>; <a onClick="return mV(\'Col\',1,20);">Col 1:20</a>, but in all these passages only a cosmical or national universalism can be found, not the doctrine of the salvation of all individuals, which latter would bring the statements in question in direct contradiction to the most explicit deliverances of Paul elsewhere on the principle of predestination and the eternity of the destiny of the wicked.<P>IX. The Consummate State.<P>Side by side with "the future age," and characterizing it from a less formal point of view, the phrase "kingdom of God" designates the consummate state, as it will exist for believers after the judgment. Jesus, while making the kingdom a present reality, yet continues to speak of it in accordance with its original eschatological usage as "the kingdom" which lies in the future (<a onClick="return mV(\'Mat\',13,43);">Mt 13:43</a>; <a onClick="return mV(\'Mat\',25,34);">25:34</a>; <a onClick="return mV(\'Mat\',26,29);">26:29</a>; <a onClick="return mV(\'Mar\',9,47);">Mr 9:47</a>; <a onClick="return mV(\'Luk\',12,32);">Lu 12:32</a>; <a onClick="return mV(\'Luk\',13,28,29);">13:28-29</a>; <a onClick="return mV(\'Luk\',21,31);">21:31</a>). With Paul the phrase bears preponderatingly an eschatological sense, although occasionally he uses it of the present state of believers (<a onClick="return mV(\'Rom\',14,17);">Ro 14:17</a>; <a onClick="return mV(\'1Cr\',4,20);">1Co 4:20</a>; <a onClick="return mV(\'1Cr\',6,9,10);">6:9-10</a>; <a onClick="return mV(\'1Cr\',15,24,50);">15:24, 50</a>; <a onClick="return mV(\'Gal\',5,21);">Ga 5:21</a>; <a onClick="return mV(\'Eph\',5,5);">Eph 5:5</a>; <a onClick="return mV(\'Col\',1,13);">Col 1:13</a>; <a onClick="return mV(\'Col\',4,11);">4:11</a>; <a onClick="return mV(\'1Th\',2,12);">1Th 2:12</a>; <a onClick="return mV(\'2Th\',1,5);">2Th 1:5</a>; <a onClick="return mV(\'2Ti\',4,1,18);">2Ti 4:1, 18</a>). Elsewhere in the New Testament the eschatological use occurs in <a onClick="return mV(\'Hbr\',12,28);">Heb 12:28</a>; <a onClick="return mV(\'Jam\',2,5);">Jas 2:5</a>; <a onClick="return mV(\'2Pe\',1,11);">2Pe 1:11</a>; <a onClick="return mV(\'Rev\',11,15);">Re 11:15</a>. The idea is universalistic, unpolitical, which does not exclude that certain privileges are spoken of with special reference to Israel. Although the eschatological kingdom differs from the present kingdom largely in the fact that it will receive an external, visible embodiment, yet this does not hinder that even in it the core is constituted by those spiritual realities and relations which make the present kingdom. Still it will have its outward form as the doctrine of the resurrection and the regenerated earth plainly show. Hence, the figures in which Jesus speaks of it, such as eating, drinking, reclining at table, while not to be taken sensually, should not on the other hand be interpreted allegorically, as if they stood for wholly internal spiritual processes: they evidently point to, or at least include, outward states and activities, of which our life in the senses offers some analogy, but on a higher plane of which it is at present impossible to form any concrete conception or to speak otherwise than in figurative language. Equivalent to "the kingdom" is "life." But, unlike the kingdom, "life" remains in the Synoptics an exclusively eschatological conception.<P>It is objectively conceived: the state of blessedness the saints will exist in; not subjectively as a potency in man or a process of development (<a onClick="return mV(\'Mat\',7,14);">Mt 7:14</a>; <a onClick="return mV(\'Mat\',18,8,9);">18:8-9</a>; <a onClick="return mV(\'Mat\',19,16,29);">19:16, 29</a>; <a onClick="return mV(\'Mat\',25,46);">25:46</a>; <a onClick="return mV(\'Mar\',10,30);">Mr 10:30</a>). In John "life" becomes a present state, and in connection with this the idea is subjectivized, it becomes a process of growth and expansion. Points of contact for this in the Synoptics may be found in <a onClick="return mV(\'Mat\',8,22);">Mt 8:22</a> (<a onClick="return mV(\'Luk\',9,60);">Lu 9:60</a>); <a onClick="return mV(\'Luk\',15,24);">Lu 15:24</a>; <a onClick="return mV(\'Luk\',20,38);">20:38</a>. When this eschatological life is characterized as aionios, "eternal," the reference is not exclusively to its eternal duration, but the word has, in addition to this, a qualitative connotation; it describes the kind of life that belongs to the consummate state (compare the use of the adjective with other nouns in this sense: <a onClick="return mV(\'2Cr\',5,1);">2Co 5:1</a>; <a onClick="return mV(\'2Ti\',2,10);">2Ti 2:10</a>; <a onClick="return mV(\'Hbr\',5,9);">Heb 5:9</a>; <a onClick="return mV(\'Hbr\',9,12,15);">9:12, 15</a>; <a onClick="return mV(\'2Pe\',1,11);">2Pe 1:11</a>, and the unfolding of the content of the idea in <a onClick="return mV(\'1Pe\',1,4);">1Pe 1:4</a>). With Paul "life" has sometimes the same eschatological sense (<a onClick="return mV(\'Rom\',2,7);">Ro 2:7</a>; <a onClick="return mV(\'Rom\',5,17);">5:17</a>; <a onClick="return mV(\'Tts\',1,2);">Tit 1:2</a>; <a onClick="return mV(\'Tts\',3,7);">3:7</a>), but most often it is conceived as already given in the present state, owing to the close association with the Spirit (<a onClick="return mV(\'Rom\',6,11);">Ro 6:11</a>; <a onClick="return mV(\'Rom\',7,4,8,11);">7:4, 8, 11</a>; <a onClick="return mV(\'Rom\',8,2,6);">8:2, 6</a>; <a onClick="return mV(\'Gal\',2,19);">Ga 2:19</a>; <a onClick="return mV(\'Gal\',6,8);">6:8</a>; <a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>). In its ultimate analysis the Pauline conception of "life," as well as that of Jesus, is that of something dependent on communion with God (<a onClick="return mV(\'Mat\',22,32);">Mt 22:32</a>; <a onClick="return mV(\'Mar\',12,27);">Mr 12:27</a> = <a onClick="return mV(\'Luk\',20,38);">Lu 20:38</a>; <a onClick="return mV(\'Rom\',8,6,7);">Ro 8:6-7</a>; <a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>). Another Pauline conception associated with the consummate state is that of doxa, "glory." This glory is everywhere conceived as a reflection of the glory of God, and it is this that to the mind of Paul gives it religious value, not the external radiance in which it may manifest itself as such. Hence, the element of "honor" conjoined to it (<a onClick="return mV(\'Rom\',1,23);">Ro 1:23</a>; <a onClick="return mV(\'Rom\',2,7);">2:7</a>; <a onClick="return mV(\'Rom\',8,21);">8:21</a>; <a onClick="return mV(\'Rom\',9,23);">9:23</a>; <a onClick="return mV(\'1Cr\',15,43);">1Co 15:43</a>). It is not confined to the physical sphere (<a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>; <a onClick="return mV(\'2Cr\',4,16,17);">4:16-17</a>). The outward doxa is prized by Paul as a vehicle of revelation, an exponent of the inward state of acceptance with God. In general Paul conceives of the final state after a highly theocentric fashion (<a onClick="return mV(\'1Cr\',15,28);">1Co 15:28</a>); it is the state of immediate vision of and perfect communion with God and Christ; the future life alone can bring the perfected sonship (<a onClick="return mV(\'Rom\',6,10);">Ro 6:10</a>; <a onClick="return mV(\'Rom\',8,23,29);">8:23, 29</a>; compare <a onClick="return mV(\'Luk\',20,36);">Lu 20:36</a>; <a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>; <a onClick="return mV(\'2Cr\',5,6,7,8);">5:6-8</a>; <a onClick="return mV(\'2Cr\',13,4);">13:4</a>; <a onClick="return mV(\'Phl\',1,23);">Php 1:23</a>; <a onClick="return mV(\'Col\',2,13);">Col 2:13</a>; <a onClick="return mV(\'Col\',3,3,4);">3:3-4</a>; <a onClick="return mV(\'1Th\',4,17);">1Th 4:17</a>).<P>The scene of the consummate state is the new heaven and the new earth, which are called into being by the eschatological palingenesia "regeneration" (<a onClick="return mV(\'Mat\',5,18);">Mt 5:18</a>; <a onClick="return mV(\'Mat\',19,28);">19:28</a>; <a onClick="return mV(\'Mat\',24,35);">24:35</a>; <a onClick="return mV(\'1Cr\',7,31);">1Co 7:31</a>; <a onClick="return mV(\'Hbr\',1,12);">Heb 1:12</a>; <a onClick="return mV(\'Hbr\',12,26,27);">12:26-27</a>; <a onClick="return mV(\'2Pe\',3,10);">2Pe 3:10</a>; <a onClick="return mV(\'1Jo\',2,17);">1Joh 2:17</a>; <a onClick="return mV(\'Rev\',21,1);">Re 21:1</a>, in which last passage, however, some exegetes understand the city to be a symbol of the church, the people of God). An annihilation of the substance of the present world is not taught (compare the comparison of the future world-conflagration with the Deluge in <a onClick="return mV(\'2Pe\',3,6);">2Pe 3:6</a>). The central abode of the redeemed will be in heaven, although the renewed earth will remain accessible to them and a part of the inheritance (<a onClick="return mV(\'Mat\',5,5);">Mt 5:5</a>; <a onClick="return mV(\'Jhn\',14,2,3);">Joh 14:2-3</a>; <a onClick="return mV(\'Rom\',8,\'18-22\');">Ro 8:18-22</a>; and the closing visions of the Apocalypse).<P>X. The Intermediate State.<P>In regard to the state of the dead, previously to the parousia and the resurrection, the New Testament is far less explicit than in its treatment of what belongs to general eschatology. The following points may here briefly be noted:<P>(1) The state of death is frequently represented as a "sleeping," just as the act of dying as a "falling asleep" (<a onClick="return mV(\'Mat\',9,24);">Mt 9:24</a>; <a onClick="return mV(\'Jhn\',9,4);">Joh 9:4</a>; <a onClick="return mV(\'Jhn\',11,11);">11:11</a>; <a onClick="return mV(\'1Cr\',7,39);">1Co 7:39</a>; <a onClick="return mV(\'1Cr\',11,30);">11:30</a>; <a onClick="return mV(\'1Cr\',15,6,18,20,51);">15:6, 18, 20, 51</a>; <a onClick="return mV(\'1Th\',4,13,15);">1Th 4:13, 15</a>; <a onClick="return mV(\'2Pe\',3,4);">2Pe 3:4</a>). This usage, while also purely Greek, rests on the Old Testament. There is this difference, that in the New Testament (already in the apocryphal and pseudepigraphical books) the conception is chiefly used with reference to the righteous dead, and has associated with it the thought of their blessed awaking in the resurrection, whereas in the Old Testament it is indiscriminately applied to all the dead and without such connotation. With Paul the word always occurs of believers. The representation applies not to the "soul" or "spirit," so that a state of unconsciousness until the resurrection would be implied. It is predicated of the person, and the point of comparison is that as one who sleeps is not alive to his surroundings, so the dead are no longer en rapport with this earthly life. Whatever may have been the original implications of the word, it plainly had become long before the New Testament period a figurative mode of speech, just as egeirein, "to wake," was felt to be a figurative designation of the act of the resurrection. Because the dead are asleep to our earthly life, which is mediated through the body, it does not follow that they are asleep in every other relation, asleep to the life of the other world, that their spirits are unconscious. Against the unconsciousness of the dead compare <a onClick="return mV(\'Luk\',16,23);">Lu 16:23</a>; <a onClick="return mV(\'Luk\',23,43);">23:43</a>; <a onClick="return mV(\'Jhn\',11,25,26);">Joh 11:25-26</a>; <a onClick="return mV(\'Act\',7,59);">Ac 7:59</a>; <a onClick="return mV(\'1Cr\',15,8);">1Co 15:8</a>; <a onClick="return mV(\'Phl\',1,23);">Php 1:23</a>; <a onClick="return mV(\'Rev\',6,\'9-11\');">Re 6:9-11</a>; <a onClick="return mV(\'Rev\',7,9);">7:9</a>. Some have held that the sleep was for Paul a euphemism employed in order to avoid the terms "death" and "to die," which the apostle restricted to Christ. <a onClick="return mV(\'1Th\',4,16);">1Th 4:16</a> shows that this is unfounded.<P>(2) The New Testament speaks of the departed after an anthropomorphic fashion as though they were still possessed of bodily organs (<a onClick="return mV(\'Luk\',16,23,24);">Lu 16:23-24</a>; <a onClick="return mV(\'Rev\',6,11);">Re 6:11</a>; <a onClick="return mV(\'Rev\',7,9);">7:9</a>). That no inference can be drawn from this in favor of the hypothesis of an intermediate body appears from the fact that God and angels are spoken of in the same manner, and also from passages which more precisely refer to the dead as "souls," "spirits" (<a onClick="return mV(\'Luk\',23,46);">Lu 23:46</a>; <a onClick="return mV(\'Act\',7,59);">Ac 7:59</a>; <a onClick="return mV(\'Hbr\',12,23);">Heb 12:23</a>; <a onClick="return mV(\'1Pe\',3,19);">1Pe 3:19</a>; <a onClick="return mV(\'Rev\',6,9);">Re 6:9</a>; <a onClick="return mV(\'Rev\',20,4);">20:4</a>).<P>(3) The New Testament nowhere encourages the living to seek converse with the dead. Its representation of the dead as "sleeping" with reference to the earthly life distinctly implies that such converse would be abnormal and in so far discountenances it, without explicitly affirming its absolute impossibility. Not even the possibility of the dead for their part taking knowledge of our earthly life is affirmed anywhere. <a onClick="return mV(\'Hbr\',12,1);">Heb 12:1</a> does not necessarily represent the Old Testament saints as "witnesses" of our race of faith in the sense of spectators in the literal sense, but perhaps in the figurative sense, that we ought to feel, having in memory their example, as if the ages of the past and their historic figures were looking down upon us (<a onClick="return mV(\'Luk\',16,29);">Lu 16:29</a>; <a onClick="return mV(\'Act\',8,9);">Ac 8:9</a>; <a onClick="return mV(\'Act\',13,6);">13:6</a>ff; <a onClick="return mV(\'Act\',19,13);">19:13</a>ff).<P>(4) As to the departed saints themselves, it is intimated that they have mutual knowledge of one another in the intermediate state, together with memory of facts and conditions of the earthly life (<a onClick="return mV(\'Luk\',16,9,\'19-31\');">Lu 16:9, 19-31</a>). Nowhere, however, is it intimated that this interest of the departed saints in our earthly affairs normally expresses itself in any act of intercession, not even of intercession spontaneously proffered on their part.<P>(5) The New Testament does not teach that there is any possibility of a fundamental change in moral or spiritual character in the intermediate state. The doctrine of a so-called "second probation" finds in it no real support. The only passages that can with some semblance of warrant be appealed to in this connection are <a onClick="return mV(\'1Pe\',3,\'19-21\');">1Pe 3:19-21</a> and <a onClick="return mV(\'1Pe\',4,6);">4:6</a>. For the exegesis of the former passage, which is difficult and much disputed, compare <a href="./study/isbe/search.html?string=SPIRITS+IN+PRISON">SPIRITS IN PRISON</a>. Here it may simply be noted that the context is not favorable to the view that an extension of the opportunity of conversion beyond death is implied; the purport of the whole passage points in the opposite direction, the salvation of the exceedingly small number of eight of the generation of Noah being emphasized (<a onClick="return mV(\'1Pe\',3,20);">1Pe 3:20</a>). Besides this it would be difficult to understand why this exceptional opportunity should have been granted to this peculiar group of the dead, since the contemporaries of Noah figure in Scripture as examples of extreme wickedness. Even if the idea of a gospel-preaching with soteriological purpose were actually found here, it would not furnish an adequate basis for building upon it the broad hypothesis of a second probation for all the dead in general or for those who have not heard the gospel in this life. This latter view the passage is especially ill fitted to support, because the generation of Noah had had the gospel preached to them before death. There is no intimation that the transaction spoken of was repeated or continued indefinitely. As to the second passage (<a onClick="return mV(\'1Pe\',4,6);">1Pe 4:6</a>), this must be taken by itself and in connection with its own context. The assumption that the sentence "the gospel (was) preached even to the dead" must have its meaning determined by the earlier passage in <a onClick="return mV(\'1Pe\',3,\'19-21\');">1Pe 3:19-21</a>, has exercised an unfortunate influence upon the exegesis. Possibly the two passages had no connection in the mind of the author. For explaining the reference to "the dead" the connection with the preceding verse is fully sufficient. It is there stated that Christ is "ready to judge the living and the dead." "The living and the dead" are those who will be alive and dead at the parousia. To both the gospel was preached, that Christ might be the judge of both. But that the gospel was preached to the latter in the state of death is in no way indicated. On the contrary the telic clause, "that they might be judged according to men in the flesh," shows that they heard the gospel during their lifetime, for the judgment according to men in the flesh that has befallen them is the judgment of physical death. If a close connection between the passage in <a onClick="return mV(\'1Pe\',3,\'1-\');">1Pe 3</a> and that in chapter <a onClick="return mV(\'1Pe\',4,\'1-\');">4</a> did exist, this could only serve to commend the exegesis which finds in the earlier passage a gospel-preaching to the contemporaries of Noah during their lifetime, since, on that view, it becomes natural to identify the judgment in the flesh with the Deluge.<P>(6) The New Testament, while representing the state of the dead before the parousia as definitely fixed, nevertheless does not identify it, either in degree of blessedness or punishment, with the final state which follows upon the resurrection. Although there is no warrant for affirming that the state of death is regarded as for believers a positively painful condition, as has been mistakenly inferred from <a onClick="return mV(\'1Cr\',11,30);">1Co 11:30</a>; <a onClick="return mV(\'1Th\',4,13);">1Th 4:13</a>, nevertheless Paul shrinks from it as from a relatively undesirable state, since it involves "nakedness" for the soul, which condition, however, does not exclude a relatively high degree of blessedness in fellowship with Christ (<a onClick="return mV(\'2Cr\',5,2,3,4,6,8);">2Co 5:2-4, 6, 8</a>; <a onClick="return mV(\'Phl\',1,23);">Php 1:23</a>). In the same manner a difference in the degree or mode of punishment between the intermediate state and the age to come is plainly taught. For on the one hand the eternal punishment is related to persons in the body (<a onClick="return mV(\'Mat\',10,28);">Mt 10:28</a>), and on the other hand it is assigned to a distinct place, Gehenna, which is never named in connection with the torment of the intermediate state. This term occurs in <a onClick="return mV(\'Mat\',5,22,29,30);">Mt 5:22, 29-30</a>; <a onClick="return mV(\'Mat\',10,28);">10:28</a> = <a onClick="return mV(\'Luk\',12,5);">Lu 12:5</a>; <a onClick="return mV(\'Luk\',18,9);">18:9</a>; <a onClick="return mV(\'Luk\',23,33);">23:33</a>; <a onClick="return mV(\'Mar\',9,43,45,47);">Mr 9:43, 45, 47</a>; <a onClick="return mV(\'Jam\',3,6);">Jas 3:6</a>. Its opposite is the eschatological kingdom of God (<a onClick="return mV(\'Mar\',9,47);">Mr 9:47</a>). The term abussos differs from it in that it is associated with the torment of evil spirits (<a onClick="return mV(\'Luk\',8,31);">Lu 8:31</a>; <a onClick="return mV(\'Rom\',10,7);">Ro 10:7</a>; <a onClick="return mV(\'Rev\',9,1,2);">Re 9:1-2</a>; <a onClick="return mV(\'Rev\',11,7);">11:7</a>; <a onClick="return mV(\'Rev\',20,1);">20:1</a>), and in regard to it no such clear distinction between a preliminary and final punishment seems to be drawn (compare also the verb tartaroun, "to bind in Tartarus"; of evil spirits in <a onClick="return mV(\'2Pe\',2,4);">2Pe 2:4</a>). Where the sphere of the intermediate state is locally conceived, this is done by means of the term Hades, which is the equivalent of the Old Testament She\'ol. The passages where this occurs are <a onClick="return mV(\'Mat\',11,23);">Mt 11:23</a>; <a onClick="return mV(\'Mat\',16,18);">16:18</a>; <a onClick="return mV(\'Luk\',16,23);">Lu 16:23</a>; <a onClick="return mV(\'Act\',2,27,31);">Ac 2:27, 31</a>; <a onClick="return mV(\'1Cr\',15,55);">1Co 15:55</a> (where others read "death"); <a onClick="return mV(\'Rev\',1,18);">Re 1:18</a>; <a onClick="return mV(\'Rev\',6,8);">6:8</a>; <a onClick="return mV(\'Rev\',20,13,14);">20:13-14</a>. These passages should not be interpreted on the basis of the Greek classical usage, but in the light of the Old Testament doctrine about She\'ol. Some of them plainly employ the word in the non-local sense of the state of death (<a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>; possibly <a onClick="return mV(\'Act\',2,27,31);">Ac 2:27, 31</a>; <a onClick="return mV(\'1Cr\',15,55);">1Co 15:55</a> (personified); <a onClick="return mV(\'Rev\',1,18);">Re 1:18</a>; <a onClick="return mV(\'Rev\',6,8);">6:8</a> (personified); <a onClick="return mV(\'Rev\',20,13);">Re 20:13</a> (personified)). The only passage where the conception is local is <a onClick="return mV(\'Luk\',16,23);">Lu 16:23</a>, and this occurs in a parable, where aside from the central point in comparison, no purpose to impart topographical knowledge concerning the world beyond death can be assumed, but the imagery is simply that which was popularly current. But, even if the doctrine of Hades as a place distinct from Gehenna should be found here, the terms in which it is spoken of, as place of torment for Dives, prove that the conception is not that of a general abode of neutral character, where without blessedness or pain the dead as a joint-company await the last judgment, which would first assign them to their separate eternal habitations. The parable plainly teaches, whether Hades be local and distinct from Gehenna or not, that the differentiation between blessedness and punishment in its absolute character (<a onClick="return mV(\'Luk\',16,26);">Lu 16:26</a>) is begun in it and does not first originate at the judgment (see further, <a href="./study/isbe/search.html?string=HADES">HADES</A>).<P>LITERATURE.<P>Besides the articles on the several topics in the Bible Dictionaries and in Cremer\'s Lexicon of New Testament Greek, and the corresponding chapters in the handbooks on New Testament Theology, the following works and articles may be consulted: Bousset, Die Religion des Judenthums2,1906,especially 233-346; id, Der Antichrist in der Ueberlieferung des Judenthums, des New Testament und der alten Kirche, 1895; Bruston, La vie future d\'apres Paul, 1895; Charles, Eschatology Hebrew, Jewish and Christian: A Critical History of the Doctrine of a Future Life, 1899; Cremer, Ueber den Zustand nach dem Tode3, 1892; Grimm, "Ueber die Stelle 1 Kor 15:20-28," ZWT, 1873; Haupt, Die eschatologischen Aussagen Jesu in den synoptischen Evangelien, 1895; Kabisch, Eschatologie des Paulus in ihren Zusammenhangen mit dem Gesamtbegriff des Paulinismus, 1893; Kennedy, Paul\'s Conceptions of the Last Things, 1904; Kliefoth, Christliche Eschatologie, 1886; Klopper, "Zur Paulinischen Lehre von der Auferstehung: Auslegung von 2 Kor 5:1-6," JDT, 1862 (the author modified his views in his commentary on 2 Cor); Kostlin, "Die Lehre des Apostels Paulus von der Auferstehung," JDT, 1877; Luthardt, Lehre von den letzten Dingen3, 1885; Muirhead, The Eschatology of Jesus, 1904; Oesterley, The Doctrine of the Last Things, 1908; Philippi, Die biblische und kirchliche Lehre vom Antichrist, 1877; Rinck, Vom Zustande nach dem Tode, 1885; Salmond, The Christian Doctrine of Immortality5, 1901; Schwally, Das Leben nach dem Tode, 1892; Sharman, The Teaching of Jesus about the Future According to the Synoptic Gospels, 1909; Stahelin, "Zur Paulinischen Eschatologie," JDT, 1874; Teichmann, Die Paulinischen Vorstellungen von Auferstehung und Gericht, 1896; Volz, Judische Eschatologie von Daniel bis Akiba, 1903; Waitz, "Ueber 2 Kor 5:1-4," JPT, 1882; Wetzel, "Ueber 2 Kor 5:1-4," SK, 1886; Wendt, Die Begriffe Fleisch und Geist im biblischen Sprachgebrauch, 1878.``182';
isbe[3182]='Eschatology of the Old Testament`es-ka-tol\'-o-ji<P>Contents <p>(A) Scope of Article<p>(B) Dr. Charles\' Work<p>(C) Individual Religion in Israel<P><b>I. FUNDAMENTAL IDEAS</b><P class="in15">1. Idea of God<P class="in15">2. Idea of Man Body, Soul and Spirit<P class="in15">3. Sin and Death<P><b>II. CONCEPTIONS OF THE FUTURE LIFE—SHEOL</b><P class="in15">Had Israel No Belief in a Future Life?<P class="in15">1. Reserve on This Subject: Hopes and Promises Largely Temporal<P class="in15">2. A Future State not Therefore Denied Belief Non-Mythological<P class="in15">3. Survival of Soul, or Conscious Part<P class="in15">4. The Hebrew Sheol<P><b>III. THE RELIGIOUS HOPE—LIFE AND RESURRECTION</b><P class="in30">(a) Nature and Grace—Moral Distinctions <P class="in30">(b) Religious Hope of Immortality<P class="in15">1. Sheol, Like Death, Connected with Sin<P class="in15">2. Religious Root of Hope of Immortality Not Necessarily Late<P>3. Hope of Resurrection<P class="in30">(1) Not a Late or Foreign Doctrine<P class="in30">(2) The Psalms<P class="in30">(3) The Book of Job<P class="in30">(4) The Prophets <P class="in30">(5) Daniel—Resurrection of Wicked<P><b>IV. THE IDEA OF JUDGMENT—THE DAY OF YAHWEH</b><P class="in15">Judgment a Present Reality<P class="in15">1. Day of Yahweh<P class="in30">(1) Relation to Israel<P class="in30">(2) To the Nations<P class="in15">2. Judgment beyond Death<P class="in30">(1) Incompleteness of Moral Administration<P class="in30">(2) Prosperity of Wicked<P class="in30">(3) Suffering of Righteous with Wicked<P class="in15">3. Retribution beyond Death<P><b>V. LATER JEWISH CONCEPTIONS—APOCRYPHAL, APOCALYPTIC, RABBINICAL</b><P class="in15">1. Sources<P class="in30">(1) Apocrypha<P class="in30">(2) Apocalyptic Literature<P class="in30">(3) Rabbinical Writings<P class="in15">2. Description of Views<P class="in30">(1) Less Definite Conceptions<P class="in30">(2) Ideas of Sheol<P class="in30">(3) The Fallen Angels<P class="in30">(4) Resurrection<P class="in30">(5) Judgment The Messiah<P class="in30">(6) The Messianic Age and the Gentiles<P class="in30">(7) Rabbinical Ideas<P><b>LITERATURE</b><hr /><p>Eschatology of the Old Testament (with Apocryphal and Apocalyptic Writings).<P>(A) Scope of Article:<P>By "eschatology," or doctrine of the last things, is meant the ideas entertained at any period on the future life, the end of the world (resurrection, judgment; in the New Testament, the Parousia), and the eternal destinies of mankind. In this article it is attempted to exhibit the beliefs on these matters contained in the Old Testament, with those in the Jewish apocryphal and apocalyptic writings that fill up the interval between the Old Testament and the New Testament.<P>(B) Dr. Charles\' Work:<P>The subject here treated has been dealt with by many writers (see "Literature" below); by none more learnedly or ably than by Dr. R. H. Charles in his work on Hebrew, Jewish and Christian eschatology (A Critical History of the Doctrine of a Future Life in Israel, in Judaism, and in Christianity). The present writer is, however, unable to follow Dr. Charles in many of his very radical critical positions, which affect so seriously the view taken of the literary evidence, and of the development of Israel\'s religion; is unable, therefore, to follow him in his interpretation of the religion itself. The subject, accordingly, is discussed in these pages from a different point of view from his.<P>(C) Individual Religion in Israel.<P>One special point in which the writer is unable to follow Dr. Charles in his treatment, which may be noticed at the outset, is in his idea—now so generally favored—that till near the time of the Exile religion was not individual—that Yahweh was thought of as concerned with the well-being of the people as a whole, and not with that of its individual members. "The individual was not the religious unit, but the family or tribe" (op. cit., 58). How anyone can entertain this idea in face of the plain indications of the Old Testament itself to the contrary is to the present writer a mystery. There is, indeed, throughout the Old Testament, a solidarity of the individual with his family and tribe, but not at any period to the exclusion of a personal relation to Yahweh, or of individual moral and religious responsibility. The pictures of piety in the Book of Genesis are nearly all individual, and the narratives containing them are, even on the critical view, older than the 9th century. Adam, Noah, Abraham, Jacob, Joseph, are all of them, to the writers of the history, individuals; Moses, Joshua, Caleb, are individuals; the deeds of individuals are counted to them for righteousness; the sins of others slay them. If there had been ten righteous persons in Sodom, it would have been spared (<a onClick="return mV(\'Gen\',18,32);">Ge 18:32</a>). It was as an individual that David sinned; as an individual he repented and was forgiven. Kings are judged or condemned according to their individual character. It is necessary to lay stress on this at the beginning; otherwise the whole series of the Old Testament conceptions is distorted.<P>I. Fundamental Ideas.<P>The eschatology of the Old Testament, as Dr. Charles also recognizes, is dependent on, and molded by, certain fundamental ideas in regard to God, man, the soul and the state after death, in which lies the peculiarity of Israel\'s religion. Only, these ideas are differently apprehended here from what they are in this writer\'s learned work.<P>1. Idea of God:<P>In the view of Dr. Charles, Yahweh (Yahweh), who under Moses became the God of the Hebrew tribes, was, till the time of the prophets, simply a national God, bound up with the land and with this single people; therefore, "possessing neither interest nor jurisdiction in the life of the individual beyond the grave....Hence, since early Yahwism possessed no eschatology of its own, the individual Israelite was left to his hereditary heathen beliefs. These beliefs we found were elements of Ancestor Worship" (op. cit., 52; compare 35). The view taken here, on the contrary, is, that there is no period known to the Old Testament in which Yahweh—whether the name was older than Moses or not need not be discussed—was not recognized as the God of the whole earth, the Creator of the world and man, and Judge of all, nations. He is, in both <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> and <a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a>, the Creator of the first pair from whom the whole race springs; He judged the whole world in the Flood; He chose Abraham to be a blessing to the families of the earth (<a onClick="return mV(\'Gen\',12,3);">Ge 12:3</a>); His universal rule is acknowledged (<a onClick="return mV(\'Gen\',18,25);">Ge 18:25</a>); in infinite grace, displaying His power over Egypt, He chose Israel to be a people to Himself (<a onClick="return mV(\'Exd\',19,\'3-6\');">Ex 19:3-6</a>). The ground for denying jurisdiction over the world of the dead thus falls. The word of Jesus to the Sadducees is applicable here: "Have ye not read...I am the God of Abraham, and the God of Isaac, and the God of Jacob? God is not the God of the dead, but of the living" (<a onClick="return mV(\'Mat\',22,31,32);">Mt 22:31-32</a>). The Old Testament instances of resurrection in answer to prayer point in the same direction (<a onClick="return mV(\'1Ki\',17,21);">1Ki 17:21</a>ff; <a onClick="return mV(\'2Ki\',4,34);">2Ki 4:34</a>ff; compare <a onClick="return mV(\'Psa\',16,10);">Ps 16:10</a>; <a onClick="return mV(\'Psa\',49,15);">49:15</a>, etc.; see further, below).<P>2. Idea of Man:<P>According to Dr. Charles, the Old Testament has two contradictory representations of the constitution of man, and of the effects of death. The older or pre-prophetic view distinguishes between soul and body in man (pp. 37ff, 45ff), and regards the soul as surviving death (this is not easily reconcilable with the other proposition (p. 37) that the "soul or nephesh is identical with the blood"), and as retaining a certain self-consciousness, and the power of speech and movement in Sheol (pp. 39ff). This view is in many respects identical with that of ancestor worship, which is held to be the primitive belief in Israel (p. 41). The other and later view, which is thought to follow logically from the account in <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>, supposes the soul to perish at death (pp. 41ff). We read there that "Yahweh God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul." The "breath of life" (nishmath chayyim) is identified with the "spirit of life" (ruach chayyim) of <a onClick="return mV(\'Gen\',6,17);">Ge 6:17</a>, and is taken to mean that the soul has no independent existence, but is "really a function of the material body when quickened by the (impersonal) spirit" (p. 42). "According to this view the annihilation of the soul ensues inevitably at death, that is, when the spirit is withdrawn" (p. 43). This view is held to be the parent of Sadduceeism, and is actually affirmed to be the view of Paul (pp. 43-44, 409)—the apostle who repudiated Sadduceeism in this very article (<a onClick="return mV(\'Act\',23,\'6-9\');">Ac 23:6-9</a>). <p>Body, Soul and Spirit.<P>The above view of man\'s nature is here rejected, and the consistency of the Old Testament doctrine affirmed. The Biblical view has nothing to do with ancestor worship (compare the writer\'s Orr, The Problem of the Old Testament, 135-36). In <a onClick="return mV(\'Gen\',1,26,27);">Ge 1:26-27</a> man is created in God\'s image, and in the more anthropomorphic narrative of <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>, he becomes "a living soul" through a unique act of Divine inbreathing. The soul (nephesh) in man originates in a Divine inspiration (compare <a onClick="return mV(\'Job\',32,8);">Job 32:8</a>; <a onClick="return mV(\'Job\',33,4);">33:4</a>; <a onClick="return mV(\'Isa\',42,5);">Isa 42:5</a>), and is at once the animating principle of the body (the blood being its vehicle, <a onClick="return mV(\'Lev\',17,11);">Le 17:11</a>), with its appetites and desires, and the seat of the self-conscious personality, and source of rational and spiritual activities. It is these higher activities of the soul which, in the Old Testament, are specially called "spirit" (ruach). Dr. Charles expresses this correctly in what he says of the supposed earlier view ("the ruach had become the seat of the highest spiritual functions in man," p. 46; see more fully the writer\'s God\'s Image in Man, 47ff). There is no ground for deducing "annihilation" from <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>. Everywhere in Genesis man is regarded as formed for living fellowship with God, and capable of knowing, worshipping and serving Him.<P>See <a href="./study/isbe/search.html?string=SOUL">SOUL</a>; <a href="./study/isbe/search.html?string=SPIRIT">SPIRIT</a>.<P>3. Sin and Death:<P>It follows from the above account that man is regarded in the Old Testament as a compound being, a union of body and soul (embracing spirit), both being elements in his one personality. His destiny was not to death, but to life—not life, however, in separation of the soul from the body (disembodied existence), but continued embodied life, with, perhaps, as its sequel, change and translation to higher existence (thus Enoch, Elijah; the saints at the Parousia). This is the true original idea of immortality for man (see <a href="./study/isbe/search.html?string=IMMORTALITY">IMMORTALITY</a>). Death, accordingly, is not, as it appears in Dr. Charles, a natural event, but an abnormal event—a mutilation, separation of two sides of man\'s being never intended to be separated—due, as the Scripture represents it, to the entrance of sin (<a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a>; <a onClick="return mV(\'Gen\',3,19,22);">3:19, 22</a>; <a onClick="return mV(\'Rom\',5,12);">Ro 5:12</a>; <a onClick="return mV(\'1Cr\',15,21);">1Co 15:21-22</a>). It is objected that nothing further is said in the Old Testament of a "Fall," and a subjection of man to death as the result of sin. In truth, however, the whole picture of mankind in the Old Testament, as in the New Testament, is that of a world turned aside from God, and under His displeasure, and death and all natural evils are ever to be considered in relation to that fact (compare Dillmann, Alttest. Theol.,368,376ff; God\'s Image in Man, 198ff, 249ff). This alone explains the light in which death is regarded by holy men; their longing for deliverance from it (see below); the hope of resurrection; the place which resurrection—"the redemption of our body" (<a onClick="return mV(\'Rom\',8,23);">Ro 8:23</a>)—after the pattern of Christ\'s resurrection (<a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>), has in the Christian conception of immortality.<P>II. Conceptions of the Future Life—Sheol.<P>Had Israel No Belief in a Future Life?:<P>It is usual to find it contended that the Israelites, in contrast with other peoples, had not the conception of a future life till near the time of the Exile; that then, through the teaching of the prophets and the discipline of experience, ideas of individual immortality and of judgment to come first arose. There is, however, a good deal of ambiguity of language, if not confusion of thought, in such statements. It is true there is development in the teaching on a future life; true also that in the Old Testament "life" and "immortality" are words of pregnant meaning, to which bare survival of the soul, and gloomy existence in Sheol, do not apply. But in the ordinary sense of the expression "future life," it is certain that the Israelites were no more without that notion than any of their neighbors, or than most of the peoples and races of the world to whom the belief is credited.<P>1. Reserve on This Subject: Hopes and Promises Largely Temporal:<P>Israel, certainly, had not a developed mythology of the future life such as was found in Egypt. There, life in the other world almost over-shadowed the life that now is; in contrast with this, perhaps because of it, Israel was trained to a severer reserve in regard to the future, and the hopes and promises to the nation—the rewards of righteousness and penalties of transgression—were chiefly temporal. The sense of individual responsibility, as was shown at the commencement, there certainly was—an individual relation to God. But the feeling of corporate existence—the sense of connection between the individual and his descendants—was strong, and the hopes held out to the faithful had respect rather to multiplication of seed, to outward prosperity, and to a happy state of existence (never without piety as its basis) on earth, than to a life beyond death. The reason of this and the qualifications needing to be made to the statement will afterward appear; but that the broad facts are as stated every reader of the Old Testament will perceive for himself. Abraham is promised that his seed shall be multiplied as the stars of heaven, and that the land of Canaan shall be given them to dwell in (<a onClick="return mV(\'Gen\',12,\'1-3\');">Ge 12:1-3</a>; <a onClick="return mV(\'Gen\',15,\'1-\');">15</a>); Israel is encouraged by abundant promises of temporal blessing (<a onClick="return mV(\'Deu\',11,8);">De 11:8</a>ff; <a onClick="return mV(\'Deu\',28,\'1-14\');">28:1-14</A>), and warned by the most terrible temporal curses (<a onClick="return mV(\'Deu\',28,15);">De 28:15</a>ff); David has pledged to him the sure succession of his house as the reward of obedience (<a onClick="return mV(\'2Sa\',7,11);">2Sa 7:11</a>ff). So in the Book of Job, the patriarch\'s fidelity is rewarded with return of his prosperity (chapter <a onClick="return mV(\'Job\',42);">42</A>). Temporal promises abound in the Prophets (<a onClick="return mV(\'Hsa\',2,14);">Ho 2:14</a>ff; <a onClick="return mV(\'Hsa\',2,\'1-\');">14</a>; <a onClick="return mV(\'Isa\',1,19,26);">Isa 1:19, 26</a>, etc.); the Book of Proverbs likewise is full of such promises (<a onClick="return mV(\'Pro\',3,13);">3:13 </a>ff, etc.).<P>2. A Future State not Therefore Denied:<P>All this, however, in no way implies that the Israelites had no conceptions of, or beliefs in, a state of being beyond death, or believed the death of the body to be the extinction of existence. This was very far from being the case. A hope of a future life it would be wrong to call it; for there was nothing to suggest hope, joy or life in the good sense, in the ideas they entertained of death or the hereafter. In this they resembled most peoples whose ideas are still primitive, but to whom it is not customary to deny belief in a future state. They stand as yet, though with differences to be afterward pointed out, on the general level of Semitic peoples in their conceptions of what the future state was. This is also the view taken by Dr. Charles. He recognizes that early Israelite thought attributed a "comparatively large measure of life, movement, knowledge and likewise power (?) to the departed in Sheol" (op. cit., 41). A people that does this is hardly destitute of all notions of a future state. This question of Sheol now demands more careful consideration. Here again our differences from Dr. Charles will reveal themselves.<P>Belief Non-Mythological.<P>It would, indeed, have been amazing had the Israelites, who dwelt so long in Egypt, where everything reminded of a future life, been wholly destitute of ideas on that subject. What is clear is that, as already observed, they did not adopt any of the Egyptian notions into their religion. The simplicity of their belief in the God of their fathers kept them then and ever after from the importation of mythological elements into their faith. The Egyptian Amenti may be said, indeed, to answer broadly to the Hebrew Sheol; but there is nothing in Israelite thought to correspond to Osiris and his assessors, the trial in the hall of judgment, and the adventures and perils of the soul thereafter. What, then, was the Hebrew idea of Sheol, and how did it stand related to beliefs elsewhere?<P>3. Survival of Soul, or Conscious Part:<P>That the soul, or some conscious part of man for which the name may be allowed to stand, does not perish at death, but passes into another state of existence, commonly conceived of as shadowy and inert, is a belief found, not only among the lower, so-called nature-peoples, but in all ancient religions, even the most highly developed. The Egyptian belief in Amenti, or abode of the dead, ruled over by Osiris, is alluded to above; the Babylonian Arallu (some find the word "Sualu" = she\'ol), the land of death, from which there is no return; the Greek Hades, gloomy abode of the shades of the departed, are outstanding witnesses to this conception (the various ideas may be seen, among other works, in Salmond, Christian Doctrine of Immortality, I (ideas of lower races, Indian, Egyptian Babylonian, Persian and Greek beliefs); in Sayce, Hibbert Lectures, Religion of Ancient Babylonians, and Gifford Lectures, Religions of Ancient Egypt and Babylonia; Dr. Charles, Eschatology, chapter iii, on Greek conceptions). The Hebrew conception of Sheol, the gathering-place of the dead, is not in essentials dissimilar. "The resemblance," says Dr. Salmond, "between the Hebrew Sheol, the Homeric Hades, and Babylonian Arallu is unmistakable" (op. cit., 3rd edition, 173). As to its origin, Dr. Charles would derive the belief from ancestor worship. He supposes that "in all probability Sheol was originally conceived as a combination of the graves of the clan or nation, and as thus its final abode" (op. cit., 33). It is far from proved, however, that ancestor worship had the role he assigns to it in early religion; and, in any case, the explanation inverts cause and effect. The survival of the soul or shade is already assumed before there can be worship of ancestors. Far simpler is the explanation that man is conscious from the first of a thinking, active principle within him which disappears when death ensues, and he naturally thinks of this as surviving somewhere else, if only in a ghost-like and weakened condition (compare Max Muller, Anthropological Religion,195, 281, 337-38). Whatever the explanation, it is the case that, by a sure instinct, peoples of low and high culture alike all but universally think of the conscious part of their dead as surviving. On natural grounds, the Hebrews did the same. Only, in the Scriptural point of view, this form of survival is too poor to be dignified with the high name of "immortality."<P>4. The Hebrew Sheol:<P>It is not necessary to do more than sketch the main features of the Hebrew sheol (see <a href="./study/isbe/search.html?string=SHEOL">SHEOL</a>). The word, the etymology of which is doubtful (the commonest derivations are from roots meaning "to ask" or "to be hollow," sha\'al), is frequently, but erroneously, translated in the Revised Version (British and American) "grave" or "hell." It denotes really, as already said, the place or abode of the dead, and is conceived of as situated in the depths of the earth (<a onClick="return mV(\'Psa\',63,9);">Ps 63:9</a>; <a onClick="return mV(\'Psa\',86,13);">86:13</a>; <a onClick="return mV(\'Eze\',26,20);">Eze 26:20</a>; <a onClick="return mV(\'Eze\',31,14);">31:14</a>; <a onClick="return mV(\'Eze\',32,18,24);">32:18, 24</a>; compare <a onClick="return mV(\'Num\',16,30);">Nu 16:30</a>; <a onClick="return mV(\'Deu\',32,22);">De 32:22</a>). The dead are there gathered in companies; hence, the frequently recurring expression, "gathered unto his people" (<a onClick="return mV(\'Gen\',25,8);">Ge 25:8</a>; <a onClick="return mV(\'Gen\',35,29);">35:29</a>; <a onClick="return mV(\'Gen\',49,33);">49:33</a>; <a onClick="return mV(\'Num\',20,24);">Nu 20:24</a>, etc.), the phrase denoting, as the context shows, something quite distinct from burial. Jacob, e.g. was "gathered unto his people"; afterward his body was embalmed, and, much later, buried (<a onClick="return mV(\'Gen\',50,2);">Ge 50:2</a>ff). Poetical descriptions of Sheol are not intended to be taken with literalness; hence, it is a mistake, with Dr. Charles, to press such details as "bars" and "gates" (<a onClick="return mV(\'Job\',17,16);">Job 17:16</a>; <a onClick="return mV(\'Job\',38,17);">38:17</a>; <a onClick="return mV(\'Psa\',9,14);">Ps 9:14</a>; <a onClick="return mV(\'Isa\',38,10);">Isa 38:10</a>, etc.). In the general conception, Sheol is a place of darkness (<a onClick="return mV(\'Job\',10,21,22);">Job 10:21-22</a>; <a onClick="return mV(\'Psa\',143,3);">Ps 143:3</a>), of silence (<a onClick="return mV(\'Psa\',94,17);">Ps 94:17</a>; <a onClick="return mV(\'Psa\',115,17);">115:17</a>), of forgetfulness (<a onClick="return mV(\'Psa\',88,12);">Ps 88:12</a>; <a onClick="return mV(\'Ecc\',9,5,6,10);">Ec 9:5-6, 10</a>). It is without remembrance or praise of God (<a onClick="return mV(\'Psa\',6,5);">Ps 6:5</a>), or knowledge of what transpires on earth (<a onClick="return mV(\'Job\',14,21);">Job 14:21</a>). Even this language is not to be pressed too literally. Part of it is the expression of a depressed or despairing (compare <a onClick="return mV(\'Isa\',38,10);">Isa 38:10</a>ff) or temporarily skeptical (thus in Ecclesiastes; compare <a onClick="return mV(\'Ecc\',7,13,14);">12:7, 13-14</a>) mood; all of it is relative, emphasizing the contrast with the brightness, joy and activity of the earthly life (compare <a onClick="return mV(\'Job\',10,22);">Job 10:22</a>, "where the light is as midnight"—comparative). Elsewhere it is recognized that consciousness remains; in <a onClick="return mV(\'Isa\',14,9);">Isa 14:9</a>ff the shades (repha\'im) of once mighty kings are stirred up to meet the descending king of Babylon (compare <a onClick="return mV(\'Eze\',32,21);">Eze 32:21</a>). If Sheol is sometimes described as "destruction" (<a onClick="return mV(\'Job\',26,6);">Job 26:6</a> margin; <a onClick="return mV(\'Job\',28,22);">Job 28:22</a>; <a onClick="return mV(\'Pro\',15,11);">Pr 15:11</a> margin) and "the pit" (<a onClick="return mV(\'Psa\',30,9);">Ps 30:9</a>; <a onClick="return mV(\'Psa\',55,23);">55:23</a>), at other times, in contrast with the weariness and trouble of life, it is figured and longed for as a place of "rest" and "sleep" (<a onClick="return mV(\'Job\',3,17);">Job 3:17</a>ff; <a onClick="return mV(\'Job\',14,12,13);">14:12,13</a>). Always, however, as with other peoples, existence in Sheol is represented as feeble, inert, shadowy, devoid of living interests and aims, a true state of the dead (on Egyptian Babylonian and Greek analogies, compare Salmond, op. cit., 54-55, 73-74, 99ff, 173-74). The idea of Dr. Charles, already commented on, that Sheol is outside the jurisdiction of Yahweh, is contradicted by many passages (<a onClick="return mV(\'Deu\',32,22);">De 32:22</a>; <a onClick="return mV(\'Job\',26,6);">Job 26:6</a>; <a onClick="return mV(\'Pro\',15,11);">Pr 15:11</a>; <a onClick="return mV(\'Psa\',139,8);">Ps 139:8</a>; <a onClick="return mV(\'Amo\',9,2);">Am 9:2</a>, etc.; compare above).<P>III. The Religious Hope—Life and Resurrection.<P>(a) Nature and Grace—Moral Distinctions:<P>Such is Sheol, regarded from the standpoint of nature; a somewhat different aspect is presented when it is looked at from the point of view of grace. As yet no trace is discernible between righteous and wicked in Sheol; the element of retribution seems absent. Reward and punishment are in this world; not in the state beyond. Yet one must beware of drawing too sweeping conclusions even here. The state, indeed, of weakened consciousness and slumbrous inaction of Sheol does not admit of much distinction, and the thought of exchanging the joys of life for drear existence in that gloomy underworld may well have appalled the stoutest hearts, and provoked sore and bitter complainings. Even the Christian can bewail a life brought to a sudden and untimely close. But even on natural grounds it is hardly credible that the pious Israelite thought of the state of the godly gathered in peace to their people as quite the same as those who perished under the ban of God\'s anger, and went down to Sheol bearing their iniquity. There is a pregnancy not to be overlooked in such expressions as, "The wicked shall be turned back unto Sheol" (<a onClick="return mV(\'Psa\',9,17);">Ps 9:17</a>), a "lowest Sheol" unto which God\'s anger burns (<a onClick="return mV(\'Deu\',32,22);">De 32:22</a>), "uttermost parts of the pit" (<a onClick="return mV(\'Isa\',14,15);">Isa 14:15</a>; <a onClick="return mV(\'Eze\',32,23);">Eze 32:23</a>) to which the proud and haughty in this life are consigned. Dr. Charles goes so far as to find a "penal character of Sheol" in <a onClick="return mV(\'Psa\',49,\'1-\');">Psalms 49</a> and <a onClick="return mV(\'Psa\',73,\'1-\');">73</a> (op. cit., 74). Consolation breathes in such utterances as, "Mark the perfect man, and behold the upright; for there is a happy end to the man of peace" (<a onClick="return mV(\'Psa\',37,37);">Ps 37:37</a>), or (with reference to the being taken from the evil to come), "He entereth into peace; they rest in their beds, each one that walketh in his uprightness" (<a onClick="return mV(\'Isa\',57,2);">Isa 57:2</a>; compare <a onClick="return mV(\'Isa\',57,21);">Isa 57:21</a> "There is no peace, saith my God, to the wicked"). Even Balaam\'s fervent wish, "Let me die the death of the righteous, and let my last end be like his" (<a onClick="return mV(\'Num\',23,10);">Nu 23:10</a>), seems weakened when interpreted only of the desire for a green and blessed old age. It is possible to read too much into Old Testament expressions; the tendency at the present time would seem to be to read a great deal too little (P. Fairbairn, Typology of Scripture, I, 173ff, 422ff, may profitably be consulted).<P>(b) Religious Hope of Immortality:<P>To get at the true source and nature of the hope of immortality in the Old Testament, however, it is necessary to go much farther than the idea of any happier condition in Sheol. This dismal region is never there connected with ideas of "life" or "immortality" in any form. Writers who suppose that the hopes which find utterance in passages of Psalms and Prophets have any connection with existence in Sheol are on an altogether wrong track. It is not the expectation of a happier condition in Sheol, but the hope of deliverance from Sheol, and of restored life and fellowship with God, which occupies the mind. How much this implies deserves careful consideration.<P>1. Sheol, Like Death, Connected with Sin:<P>It has already been seen that, in the Old Testament, Sheol, like death, is not the natural fate of man. A connection with sin and judgment is implied in it. Whatever Sheol might be to the popular, unthinking mind, to the reflecting spirit, that really grasped the fundamental ideas of the religion of Yahweh, it was a state wholly contrary to man\'s true destiny. It was, as seen, man\'s dignity in distinction from the animal, that he was not created under the law of death. Disembodied existence, which is of necessity enfeebled, partial, imperfect existence, was no part of the Divine plan for man. His immortality was to be in the body, not out of it. Separation of soul and body, an after-existence of the soul in Sheol, belong to the doom of sin. Dr. Salmond fully recognizes this in his discussion of the subject. "The penal sense of death colors all that the Old Testament says of man\'s end. It is in its thoughts where it is not in its words" (op. cit., 159; see the whole passage; compare also Oehler, Theology of the Old Testament, I, 242ff, English translation; A. B. Davidson, Theology of the Old Testament, 432ff, 439ff). The true type of immortality is therefore to be seen in cases like those of Enoch (<a onClick="return mV(\'Gen\',5,24);">Ge 5:24</a>; compare <a onClick="return mV(\'Hbr\',11,5);">Heb 11:5</a>) and Elijah (<a onClick="return mV(\'2Ki\',2,11);">2Ki 2:11</a>); of a bare "immortality of the soul," Scripture has nothing to say.<P>It is on all hands conceded that, so far as the hope of immortality, in any full or real sense, is found in the Old Testament, it is connected with religious faith and hope. It has not a natural, but a religious, root. It springs from the believer\'s trust and confidence in the living God; from his conviction that God—his God—who has bound him to Himself in the bonds of an unchanging covenant, whose everlasting arms are underneath him (<a onClick="return mV(\'Deu\',33,27);">De 33:27</a>; compare <a onClick="return mV(\'Psa\',90,1);">Ps 90:1</a>), will not desert him even in Sheol—will be with him there, and will give him victory over its terrors (compare A. B. Davidson, Commentary on Job, 293-95; Salmond, op. cit., 175).<P>2. Religious Root of Hope of Immortality:<P>Life is not bare existence; it consists in God\'s favor and fellowship (<a onClick="return mV(\'Psa\',16,11);">Ps 16:11</a>; <a onClick="return mV(\'Psa\',30,5);">30:5</a>; <a onClick="return mV(\'Psa\',63,3);">63:3</a>). The relevant passages in Psalms and Prophets will be considered after. Only, it is contended by the newer school, this hope of immortality belongs to a late stage of Israel\'s religion—to a period when, through the development of the monotheistic idea, the growth of the sense of individuality, the acute feeling of the contradictions of life, this great "venture" of faith first became possible. One asks, however, Was it so? Was this hope so entirely a matter of "intuitous ventures, and forecasts of devout souls in moments of deepest experience or keenest conflict," as this way of considering the matter represents? Not Necessarily Late.<P>That the hope of immortality could only exist for strong faith is self-evident. But did strong faith come into existence only in the days of the prophets or the Exile? Exception has already been taken to the assumption that monotheism was a late growth, and that individual faith in God was not found in early times. It is not to be granted without demur that, as now commonly alleged, the Psalms and the Book of Job, which express this hope, are post-exilian products. If, however, faith in a covenant-keeping God is of earlier date—if it is present in patriarchal and Mosaic days—the question is not, Why should it not give rise to similar hopes? but rather, How should it be prevented from doing so? If a patriarch like Abraham truly walked with God, and received His promises, could he, any more than later saints, be wholly distrustful of God\'s power to keep and deliver him in and from Sheol? It is hard to credit it. It is replied, there is no evidence of such hope. Certainly these ancient saints did not write psalms or speak with the tongues of prophets. But is there nothing in their quiet and trustful walk, in their tranquil deaths, in their sense of uncompleted promises, in their pervading confidence in God in all the vicissitudes of life, to suggest that they, too, were able to commit themselves into the hands of God in death, and to trust Him to see that it was, or would ultimately be, well with them in the future? Thus at least Jesus understood it (<a onClick="return mV(\'Mat\',22,32);">Mt 22:32</a>); thus, New Testament writers believed (<a onClick="return mV(\'Hbr\',11,13,14);">Heb 11:13-14</a>). Faith might falter, but in principle, this hope must have been bound up with faith from the beginning.<P>3. Hope of Resurrection:<P>This raises now the crucial question, What shape did this hope of immortality assume? It was not, as already seen, an immortality enjoyed in Sheol; it could only then be a hope connected with deliverance from the power of Sheol—in essence, whether precisely formulated or not, a hope of resurrection. It is, we believe, because this has been overlooked, that writers on the subject have gone so often astray in their discussions on immortality in the Old Testament. They have thought of a blessedness in the future life of the soul (thus Charles, op. cit., 76-77); whereas the redemption the Bible speaks of invariably embraces the whole personality of man, body and soul together. Jesus, it may be remembered, thus interprets the words, "I am the God of Abraham," etc. (<a onClick="return mV(\'Mat\',22,32);">Mt 22:32</a>), as a pledge not simply of continued existence, but of resurrection. This accords with what has been seen of the connection of death with sin and its abnormality in the case of man. The immortality man would have enjoyed, had he not sinned, would have been an immortality of his whole person. It will be seen immediately that this is borne out by all the passages in which the hope of immortality is expressed in the Old Testament. These never contemplate a mere immortality of the soul, but always imply resurrection.<P>(1) Not a Late or Foreign Doctrine.<P>If the above is correct, it follows that it is a mistake to place the belief in resurrection so late as is often done, still more to derive it from Zoroastrianism (thus, Cheyne, Origin of Psalter, lecture viii) or other foreign sources. It was a genuine corollary from the fundamental Israelite beliefs about God, man, the soul, sin, death and redemption. Professor Gunkel emphasizes "the immeasurable significance" of this doctrine, and speaks of it as "one of the greatest things found anywhere in the history of religion," but thinks "it cannot be derived from within Judaism itself, but must take its origin from a ruling belief in the Orient of the later time" (Zum religionsgeschichtlichen Verstandniss des New Testament, 32-33; for criticism of Gunkel\'s positions see the writer\'s Resurrection of Jesus, 255ff). To make good his theory, however, he has to discount all the evidences for the belief furnished by the earlier Old Testament writings, and this, it is believed, cannot be done successfully. It was before noted that cases of resurrection appear in the historical books (<a onClick="return mV(\'1Ki\',17,21);">1Ki 17:21</a>ff; <a onClick="return mV(\'2Ki\',4,34);">2Ki 4:34</a>ff). It is not impossible that the reverent care of the patriarchs for their dead was, as with the Egyptians, inspired by some hope of this kind (<a onClick="return mV(\'Gen\',23,\'1-\');">Ge 23</a>; <a onClick="return mV(\'Gen\',50,5,25);">50:5, 25</a>; <a onClick="return mV(\'Exd\',13,19);">Ex 13:19</a>; compare <a onClick="return mV(\'Hbr\',11,22);">Heb 11:22</a>). In any case an impartial survey of the evidence proves that the thought of resurrection colors all the later expressions of the hope of immortality (see <a href="./study/isbe/search.html?string=IMMORTALITY">IMMORTALITY</a>; compare also the writer\'s appendix on the subject in Christian View of God, 200ff).<P>(2) The Psalms.<P>The passages in the Psalms in which faith rises to the hope of immortality are principally <a onClick="return mV(\'Psa\',16,\'8-11\');">Ps 16:8-11</a>; <a onClick="return mV(\'Psa\',17,15);">17:15</a>; <a onClick="return mV(\'Psa\',49,14,15);">49:14-15</a>; <a onClick="return mV(\'Psa\',73,24);">73:24</a>. There are a few others, but these are the chief, and so far as they are allowed to express a hope of immortality at all, they do so in a form which implies resurrection. Dr. Cheyne, believing them to be influenced by Zoroastrianism, formerly granted this (Origin of Psalter, lecture viii); now he reads the passages differently. There is no good reason for putting these psalms in post-exilian times, and, taken in their most natural sense, their testimony seems explicit. <a onClick="return mV(\'Psa\',16,\'8-11\');">Ps 16:8-11</a> (cited in <a onClick="return mV(\'Act\',2,\'24-31\');">Ac 2:24-31</a> as a prophecy of the resurrection of Christ) reads "My flesh also shall dwell in safety (or confidently, margin). For thou wilt not leave my soul to Sheol; neither wilt thou suffer thy holy one to see corruption (or the pit, margin). Thou wilt show me the path of life," etc. In <a onClick="return mV(\'Psa\',17,15);">Ps 17:15</a>, the Psalmist, after describing the apparent prosperity of the wicked, says, "As for me, I shall behold thy face in rightousness; I shall be satisfied, when I awake, with beholding thy form" (King James Version, the English Revised Version, "with thy likeness"). Cheyne (op. cit., 406) refers this to the resurrection (compare Delitzsch, Perowne, etc.). Yet more explicit is <a onClick="return mV(\'Psa\',49,14,15);">Ps 49:14-15</a>, "They (the wicked) are appointed as a flock for Sheol...and the upright shall have dominion over them in the morning....But God will redeem my soul from the power (hand, margin) of Sheol; for he will receive me." The last clause, literally, "He will take me," has, as Perowne, Delitzsch, Cheyne (formerly), even Duhm, allow, allusion to cases like those of Enoch and Elijah. It cannot, however, contemplate actual bodily translation; it must therefore refer to resurrection. Similar in strain is <a onClick="return mV(\'Psa\',73,24);">Ps 73:24</a>, "Thou wilt guide me with thy counsel, and afterward receive me to glory." Dr. Charles grants that, in <a onClick="return mV(\'Psa\',49,\'1-\');">Psalms 49</a> and <a onClick="return mV(\'Psa\',73,\'1-\');">73</A>, "God takes the righteous to Himself" in heaven (pp. 76-77), but fails to connect this with the doctrine of resurrection which he finds appearing about the same time (p. 78).<P>(3) The Book of Job.<P>Before looking at the prophets, a glance should be taken at the Book of Job, which, irrespective of date (it is quite unwarrantably made post-exilian), reflects patriarchal conditions. Ch <a onClick="return mV(\'Job\',14,\'1-\');">14</a> raises the question, "If a man die, shall he live again?" (<a onClick="return mV(\'Psa\',14,14);">14:14</A>), and it is to be remarked that the form in which it does it, is the possibility of bodily revival. The appearances hostile to man\'s living again are enumerated (<a onClick="return mV(\'Psa\',14,\'7-12\');">14:7-12</a>), then faith, reasserting itself, flings itself on God to accomplish the apparently impossible: "Oh that thou wouldest hide me in Sheol, that thou wouldest keep me secret, until thy wrath be past, that thou wouldest appoint me a set time and remember me. ...Thou wouldest call and I would answer thee: thou wouldest have a desire to the work of thy hands" (<a onClick="return mV(\'Psa\',14,\'13-15\');">14:13-15</a>; margin reads "Thou shalt call," etc.). Dr. A. B. Davidson says, "To his mind this involves a complete return to life again of the whole man" (Cambridge Commentary on Job, in the place cited.). With this must be taken the splendid outburst in <a onClick="return mV(\'Psa\',19,\'25-27\');">19:25-27</a>, "I know that my Redeemer liveth," etc., which, whatever doubts may attach to the precise rendering of certain clauses, undoubtedly expresses a hope not inferior in strength to that in the verse just quoted.<P>(4) The Prophets.<P>The presence of the idea of resurrection in the Prophets is not doubted, but the passages are put down to exilic or preexilic times, and are explained of "spiritual" or "national," not of individual, resurrection (compare Charles, op. cit., 128-29). It seems plain, however, that, before the figure of resurrection could be applied to the nation, the idea of resurrection must have been there; and it is by no means clear that in certain of the passages the resurrection of individuals is not included. Cheyne granted this regarding the passages in Isaiah (<a onClick="return mV(\'Isa\',25,\'6-8\');">25:6-8</a>; <a onClick="return mV(\'Psa\',26,19);">26:19</a>): "This prospect concerns not merely the church-nation, but all of its believing members, and indeed all, whether Jews or not, who submit to the true king, Yahweh" (op. cit., 402). There is no call for putting the remarkable passages in Hos—"After two days will he revive us: on the third day he will raise us up, and we shall live before him" (<
