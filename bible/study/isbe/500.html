<script type="text/javascript">
isbe = [];

isbe[501]='Anan`a\'-nan (\'anan, "cloud"):<P>(1) One of those who, with Nehemiah, sealed the covenant (<a onClick="return mV(\'Neh\',10,26);">Ne 10:26</a>).<P>(2) A returned exile (1Esdras 5:30). He is called Hanan in <a onClick="return mV(\'Ezr\',2,46);">Ezr 2:46</a> and <a onClick="return mV(\'Neh\',7,49);">Ne 7:49</a>.``1';
isbe[502]='Anani`a-na\'-ni \'anani, perhaps a shortened form of Ananiah, "Yah has covered"): A son of Elioenai of the house of David, who lived after the captivity (<a onClick="return mV(\'1Ch\',3,24);">1Ch 3:24</a>).``1';
isbe[503]='Ananiah`an-a-ni\'-a \'ananyah, ("Yah has covered"):<P>(1) Grandfather of Azariah. He assisted in repairing the walls of Jerusalem after his return from the exile (<a onClick="return mV(\'Neh\',3,23);">Ne 3:23</a>).<P>(2) A town of Benjamin mentioned in connection with Nob and Hazor (<a onClick="return mV(\'Neh\',11,32);">Ne 11:32</a>). It is commonly identified with Beit Hanina, between three and four miles north-northwest from Jerusalem.``1';
isbe[504]='Ananias (1)`an-a-ni\'-as (Ananias; Westcott and Hort, The New Testament in Greek, Hananias; chananyah, "Yah has been gracious"): The name was common among the Jews. In its Hebrew form it is frequently found in the Old Testament (e.g. <a onClick="return mV(\'1Ch\',25,4);">1Ch 25:4</a>; <a onClick="return mV(\'Jer\',28,1);">Jer 28:1</a>; <a onClick="return mV(\'Dan\',1,6);">Da 1:6</a>).<P>See <a href="./study/isbe/search.html?string=HANANIAH">HANANIAH</a>.<P>1. A Disciple at Jerusalem:<P>Husband of Sapphira (<a onClick="return mV(\'Act\',5,\'1-10\');">Ac 5:1-10</a>). He and his wife sold their property, and gave to the common fund of the church part of the purchase money, pretending it was the whole. When his hypocrisy was denounced by Peter, Ananias fell down dead; and three hours later his wife met the same doom. The following points are of interest.<P>(1) The narrative immediately follows the account of the intense brotherliness of the believers resulting in a common fund, to which Barnabas had made a generous contribution (<a onClick="return mV(\'Act\',4,\'32-37\');">Ac 4:32-37</a>). The sincerity and spontaneity of the gifts of Barnabas and the others set forth in dark relief the calculated deceit of Ananias. The brighter the light, the darker the shadow.<P>(2) The crime of Ananias consisted, not in his retaining a part, but in his pretending to give the whole. He was under no compulsion to give all, for the communism of the early church was not absolute, but purely voluntary (see especially <a onClick="return mV(\'Act\',5,4);">Ac 5:4</a>) Falsehood and hypocrisy ("lie to the Holy Spirit" <a onClick="return mV(\'Act\',5,3);">Ac 5:3</a>), rather than greed, were the sins for which he was so severely punished.<P>(3) The severity of the Judgment can be justified by the consideration that the act was "the first open venture of deliberate wickedness" (Meyer) within the church. The punishment was an "awe-inspiring act of Divine church-discipline." The narrative does not, however, imply that Peter consciously willed their death. His words were the occasion of it, but he was not the deliberate agent. Even the words in <a onClick="return mV(\'Act\',5,9);">Ac 5:9</a> are a prediction rather than a judicial sentence.<P>2. A Disciple at Damascus:<P>A disciple in Damascus, to whom the conversion of Saul of Tarsus was made known in a vision, and who was the instrument of his physical and spiritual restoration, and the means of introducing him to the other Christians in Damascus (<a onClick="return mV(\'Act\',9,\'10-19\');">Ac 9:10-19</a>). Paul makes honorable mention of him in his account of his conversion spoken at Jerusalem (<a onClick="return mV(\'Act\',22,\'12-16\');">Ac 22:12-16</a>), where we are told that Ananias was held in high respect by all the Jews in Damascus, on account of his strict legal piety. No mention is made of him in Paul\'s address before Agrippa in Caesarea (<a onClick="return mV(\'Act\',26,\'1-\');">Ac 26</a>). In late tradition, he is placed in the list of the seventy disciples of Jesus, and represented as bishop of Damascus, and as having died a martyr\'s death.<P>3. A High Priest at Jerusalem:<P>A high priest in Jerusalem from 47-59 AD. From Josephus (Ant., XX, v, 2; vi, 2; ix, 2; BJ, II, xvii, 9) we glean the following facts: He was the son of Nedebaeus (or Nebedaeus) and was nominated to the high-priestly office by Herod of Chalcis. In 52 AD he was sent to Rome by Quadratus, legate of Syria, to answer a charge of oppression brought by the Samaritans, but the emperor Claudius acquitted him. On his return to Jerusalem, he resumed the office of high priest. He was deposed shortly before Felix left the province, but continued to wield great influence, which he used in a lawless and violent way. He was a typical Sadducee, wealthy, haughty, unscrupulous, filling his sacred office for purely selfish and political ends, anti-nationalist in his relation to the Jews, friendly to the Romans. He died an ignominious death, being assassinated by the popular zealots (sicarii) at the beginning of the last Jewish war. In the New Testament he figures in two passages.<P>(1) <a onClick="return mV(\'Act\',23,\'1-5\');">Ac 23:1-5</a>, where Paul defends himself before the Sanhedrin. The overbearing conduct of Ananias in commanding Paul to be struck on the mouth was characteristic of the man. Paul\'s ire was for the moment aroused, and he hurled back the scornful epithet of "whited wall." On being called to account for "reviling God\'s high priest," he quickly recovered the control of his feelings, and said "I knew not, brethren, that he was high priest: for it is written, Thou shalt not speak evil of a ruler of thy people." This remark has greatly puzzled the commentators. The high priest could have been easily identified by his position and official seat as president of the Sanhedrin. Some have wrongly supposed that Ananias had lost his office during his trial at Rome, but had afterward usurped it during a vacancy (John Lightfoot, Michaelis, etc.). Others take the words as ironical, "How could I know as high priest one who acts so unworthily of his sacred office?" (so Calvin). Others (e.g. Alford, Plumptre) take it that owing to defective eyesight Paul knew not from whom the insolent words had come. Perhaps the simplest explanation is that Paul meant, "I did not for the moment bear in mind that I was addressing the high priest" (so Bengel, Neander, etc.).<P>(2) In <a onClick="return mV(\'Act\',24,1);">Ac 24:1</a> we find Ananias coming down to Caesarea in person, with a deputation from the Sanhedrin, to accuse Paul before Felix.``49';
isbe[505]='Ananias (2)`(Apocrypha), an-a-ni\'-as:<P>(1) Ananias, the Revised Version (British and American) Annis, the Revised Version, margin, Annias (1Esdras 5:16). See <a href="./study/isbe/search.html?string=ANNIS">ANNIS</a>.<P>(2) A son of Emmer (1Esdras 9:21) = Hanani, son of Immer in <a onClick="return mV(\'Ezr\',10,20);">Ezr 10:20</a>.<P>(3) A son of Bebai (1Esdras 9:29) = Hananiah in <a onClick="return mV(\'Ezr\',10,28);">Ezr 10:28</a>. The two last are mentioned in the list of priests who were found to have strange wives.<P>(4) One of those who stood by Esdras while he read the law to the people (1Esdras 9:43) = Anaiah in <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>.<P>(5) One of the Levites who explained the law to the people (1Esdras 9:48) = Hanan in <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>.<P>(6) Ananias the Great, son of Shemaiah the Great; a kinsman of Tobit, whom Raphael the angel, disguised as a man, gave out to be his father (Tobit 5:12 f.).<P>(7) Son of Gideon, mentioned as an ancestor of Judith (Judith 8:1).<P>(8) Another Ananias is mentioned in The Song of the Three Children (Azariah) (verse 66).``49';
isbe[506]='Ananiel`a-nan\'-i-el (Ananiel, "God is gracious"): An ancestor of Tobit (Tobit 1:1).``1';
isbe[507]='Anath`a\'-nath (\'anath): Father of Shamgar (<a onClick="return mV(\'Jdg\',3,31);">Jud 3:31</a>; <a onClick="return mV(\'Jdg\',5,6);">5:6</a>). This name is connected with the Phoenician and Canaanite goddess \'Anat, which was also worshipped in Egypt. She is mentioned in monuments of the 18th Dynasty, coupled with the war- goddess Astart (Moore, Judges, 105-896; DB; EB).``1';
isbe[508]='Anathema`a-nath\'-e-ma (anathema): This word occurs only once in the King James Version, namely, in the phrase "Let him be anathema. Maranatha" (<a onClick="return mV(\'1Cr\',16,22);">1Co 16:22</a>); elsewhere the King James Version renders anathema by "accursed" (<a onClick="return mV(\'Rom\',9,3);">Ro 9:3</a>; <a onClick="return mV(\'1Cr\',12,3);">1Co 12:3</a>; <a onClick="return mV(\'Gal\',1,8,9);">Ga 1:8-9</a>), once by "curse" (<a onClick="return mV(\'Act\',23,12);">Ac 23:12</a>). Both words—anathema and anathema—were originally dialectical variations and had the same connotation, namely, offering to the gods. The non-Attic form—anathema—was adopted in the Septuagint as a rendering of the Hebrew cherem (see <a href="./study/isbe/search.html?string=ACCURSED">ACCURSED</a>), and gradually came to have the significance of the Hebrew word—"anything devoted to destruction." Whereas in the Greek Fathers anathema—as cherem in rabbinic Hebrew—came to denote excommunication from society, in the New Testament the word has its full force. In common speech it evidently became a strong expression of execration, and the term connoted more than physical destruction; it invariably implied moral worthlessness. In <a onClick="return mV(\'Rom\',9,3);">Ro 9:3</a> Paul does not simply mean that, for the sake of his fellow-countrymen, he is prepared to face death, but to endure the moral degradation of an outcast from the kingdom of Christ. In <a onClick="return mV(\'1Cr\',12,3);">1Co 12:3</a> the expression, "Jesus is anathema"—with its suggestion of moral unfitness—reaches the lowest depths of depreciation, as the expression, "Jesus is Lord," reaches the summit of appreciation.``103';
isbe[509]='Anathoth`an\'-a-thoth (\'anathoth; Anathoth): A town which lay between Michmash and Jerusalem (<a onClick="return mV(\'Isa\',10,30);">Isa 10:30</a>), in the territory of Benjamin, assigned to the Levites (<a onClick="return mV(\'Jos\',21,18);">Jos 21:18</a>). It was the native place of Abiathar (<a onClick="return mV(\'1Ki\',2,26);">1Ki 2:26</a>), and of the prophet Jeremiah (<a onClick="return mV(\'Jer\',1,1);">Jer 1:1</a>; <a onClick="return mV(\'Jer\',11,21);">11:21</a> f., etc.). Here lay the field which, under remarkable circumstances, the prophet purchased (<a onClick="return mV(\'Jer\',32,7);">Jer 32:7</a> f.). Two of David\'s distinguished soldiers, Abiezer (<a onClick="return mV(\'2Sa\',23,27);">2Sa 23:27</a>) and Jehu (<a onClick="return mV(\'1Ch\',12,3);">1Ch 12:3</a>), also hailed from Anathoth. It was again occupied by the Benjamites after the return from the Exile (<a onClick="return mV(\'Neh\',11,32);">Ne 11:32</a>, etc.). It is identified with \'Anata, two and a quarter miles northeast of Jerusalem, a small village of some fifteen houses with remains of ancient walls. There are quarries in the neighborhood from which stones are still carried to Jerusalem. It commands a spacious outlook over the uplands to the north, and especially to the southeast, over the Jordan valley toward the Dead Sea and the mountains of Moab. There is nothing to shelter it from the withering power of the winds from the eastern deserts (<a onClick="return mV(\'Jer\',4,11);">Jer 4:11</a>; <a onClick="return mV(\'Jer\',18,17);">18:17</a>, etc.).``54';
isbe[510]='Anathothite`an\'-a-thoth-it (ha-\'annethothi): the Revised Version (British and American) form of the King James Version Anethothite, Anetothite, Antothite. An inhabitant of Anathoth, a town of Benjamin assigned to the Levites. The Anathothites are<P>(1) Abiezer, one of David\'s thirty heroes (<a onClick="return mV(\'2Sa\',23,27);">2Sa 23:27</a>; <a onClick="return mV(\'1Ch\',11,28);">1Ch 11:28</a>; <a onClick="return mV(\'1Ch\',27,12);">27:12</a>), and<P>(2) Jehu who came to David at Ziklag (<a onClick="return mV(\'1Ch\',12,3);">1Ch 12:3</a>).``1';
isbe[511]='Ancestors`an\'-ses-ters (ri\'shonim, "first ones"): The word ancestor appears in the English Bible only once (<a onClick="return mV(\'Lev\',26,45);">Le 26:45</a>). The Hebrew word, the ordinary adjective "first," occurs more than 200 times, and in a few places might fairly be rendered ancestors (e.g. <a onClick="return mV(\'Deu\',19,14);">De 19:14</a>; <a onClick="return mV(\'Jer\',11,10);">Jer 11:10</a>). In speaking of ancestors the Old Testament ordinarily uses the word for "fathers" (\'abhoth).``1';
isbe[512]='Anchor`an\'-ker`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[513]='Ancient`an\'-shent: This word renders several Hebrew words:<P>(1) qedhem, which denotes "beforetime," "yore"; generally the remote past (compare <a onClick="return mV(\'Deu\',33,15);">De 33:15</a>, "ancient mountains"; <a onClick="return mV(\'Jdg\',5,21);">Jud 5:21</a>, Kishon, the "ancient river"; <a onClick="return mV(\'Isa\',19,11);">Isa 19:11</a> "ancient kings").<P>(2) zaqen, "old" in years. Whereas the King James Version generally renders the word by "old" (or "elders" when the plural form is found) in six cases "ancient" is used and "ancients" in nine cases. See <a href="./study/isbe/search.html?string=ANCIENTS">ANCIENTS</a>.<P>(3) \'olam, which denotes "long duration" —past or future. In regard to the past it suggests remote antiquity. The connotation may be discovered in such expressions as: "the years of ancient times" (<a onClick="return mV(\'Psa\',77,5);">Ps 77:5</a>); "ancient land-mark" or "paths" (<a onClick="return mV(\'Pro\',22,28);">Pr 22:28</a>; <a onClick="return mV(\'Jer\',18,15);">Jer 18:15</a>); "ancient people" or "nation" (<a onClick="return mV(\'Isa\',44,7);">Isa 44:7</a>; <a onClick="return mV(\'Jer\',5,15);">Jer 5:15</a>); "ancient high places" (<a onClick="return mV(\'Eze\',36,2);">Eze 36:2</a>).<P>(4) \'attiq. This word—really Aramaic—comes from a stem which means "to advance," i.e. in age; hence old, aged (<a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>).<P>(5) yashish, literally, "weak," "impotent," hence decrepit aged; a rare and poetical word, and found only in Job. It is rendered "ancient" only in one instance (<a onClick="return mV(\'Job\',12,12);">Job 12:12</a> the King James Version).``103';
isbe[514]='Ancient of Days`(\'attiq yomin, = Aramaic): On \'attiq, see <a href="./study/isbe/search.html?string=ANCIENT">ANCIENT</a> (4). The expression is used in reference to God in <a onClick="return mV(\'Dan\',7,9,13,22);">Da 7:9, 13, 22</a> and is not intended to suggest the existence of God from eternity. It was the venerable appearance of old age that was uppermost in the writer\'s mind. "What Daniel sees is not the eternal God Himself, but an aged man, in whose dignified and impressive form God reveals Himself (compare <a onClick="return mV(\'Eze\',1,26);">Eze 1:26</a>)" (Keil).``1';
isbe[515]='Ancients`an-shents: This word (except in one instance) renders the Hebrew word zeqenim, (pl of zaqen), which should always be translated "old men" or "elders." The Hebrew word never has the connotation which "ancients" has in modern English. The words "I understand more than the ancients" (<a onClick="return mV(\'Psa\',119,100);">Ps 119:100</a> the King James Version) do not mean that the Psalmist claims greater wisdom than his distant forbears but than his contemporaries with all their age and experience. In the parallel clause "teachers" is the corresponding word. In such phrases as "ancients of the people" (<a onClick="return mV(\'Jer\',19,1);">Jer 19:1</a> the King James Version), "ancients of the house of Israel" (<a onClick="return mV(\'Eze\',8,12);">Eze 8:12</a>), "elders" would obviously be the correct rendering, as in the Revised Version (British and American). Even in <a onClick="return mV(\'Isa\',24,23);">Isa 24:23</a> ("before his ancients gloriously" the English Revised Version) "elders" is the right translation (American Revised Version). The writer probably alludes to the Sinaitic; theophany witnessed by the "seventy...elders" (<a onClick="return mV(\'Exd\',24,\'9-18\');">Ex 24:9-18</a>) Generally speaking the word suggests the experience, insight and practical acquaintance with life which age ought to bring with it (<a onClick="return mV(\'Psa\',119,100);">Ps 119:100</a>; <a onClick="return mV(\'Eze\',7,26);">Eze 7:26</a>). In one instance (<a onClick="return mV(\'1Sa\',24,13);">1Sa 24:13</a>) "ancients" is the right rendering for the Hebrew word qadhmonim, which means "men of former times."``103';
isbe[516]='Ancle`an\'-k\'-l`<a href="./study/isbe/search.html?string=ANKLE">ANKLE</a>`1';
isbe[517]='Andrew`an\'-droo (Andreas, i.e. "manly." The name has also been interpreted as "the mighty one, or conqueror"): Andrew was the first called of the Twelve Apostles.<P>I. In New Testament.<P>1. Early History and First Call:<P>Andrew belonged to Bethsaida of Galilee (compare <a onClick="return mV(\'Jhn\',1,44);">Joh 1:44</a>). He was the brother of Simon Peter and his father\'s name was John (compare <a onClick="return mV(\'Jhn\',1,42);">Joh 1:42</a>; <a onClick="return mV(\'Jhn\',21,15,16,17);">21:15-17</a>). He occupies a more prominent place in the Gospel of John than in the synoptical writings, and this is explicable at least in part from the fact that Andrew was Greek both in language and sympathies (compare infra), and that his subsequent labors were intimately connected with the people for whom John was immediately writing. There are three stages in the call of Andrew to the apostleship. The first is described in <a onClick="return mV(\'Jhn\',1,\'35-40\');">Joh 1:35-40</a>. Andrew had spent his earlier years as a fisherman on the Sea of Galilee, but on learning of the fame of John the Baptist, he departed along with a band of his countrymen to Bethabara (the Revised Version (British and American) "Bethany") beyond Jordan, where John was baptizing (<a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>). Possibly Jesus was of their number, or had preceded them in their pilgrimage. There Andrew learned for the first time of the greatness of the "Lamb of God" and "followed him" (<a onClick="return mV(\'Jhn\',1,40);">Joh 1:40</a>). He was the means at this time of bringing his brother Simon Peter also to Christ (<a onClick="return mV(\'Jhn\',1,41);">Joh 1:41</a>). Andrew was probably a companion of Jesus on his return journey to Galilee, and was thus present at the marriage in Cana of Galilee (<a onClick="return mV(\'Jhn\',2,2);">Joh 2:2</a>), in Capernaum (<a onClick="return mV(\'Jhn\',2,12);">Joh 2:12</a>), at the Passover in Jerusalem (<a onClick="return mV(\'Jhn\',2,13);">Joh 2:13</a>), at the baptizing in Judea (<a onClick="return mV(\'Jhn\',3,22);">Joh 3:22</a>), where he himself may have taken part (compare <a onClick="return mV(\'Jhn\',4,2);">Joh 4:2</a>), and in Samaria (<a onClick="return mV(\'Jhn\',4,5);">Joh 4:5</a>).<P>2. Second Call and Final Ordination:<P>On his return to Galilee, Andrew resumed for a time his old vocation as fisherman, till he received his second call. This happened after John the Baptist was cast into prison (compare <a onClick="return mV(\'Mar\',1,14);">Mr 1:14</a>; <a onClick="return mV(\'Mat\',4,12);">Mt 4:12</a>) and is described in <a onClick="return mV(\'Mar\',1,\'16-18\');">Mr 1:16-18</a>; <a onClick="return mV(\'Mat\',4,18,19);">Mt 4:18-19</a>. The two accounts are practically identical, and tell how Andrew and his brother were now called on definitely to forsake their mundane occupations and become fishers of men (<a onClick="return mV(\'Mar\',1,17);">Mr 1:17</a>). The corresponding narrative of Luke varies in part; it does not mention Andrew by name, and gives the additional detail of the miraculous draught of fishes. By some it has been regarded as an amalgamation of Mark\'s account with <a onClick="return mV(\'Jhn\',21,\'1-8\');">Joh 21:1-8</a> (see <a href="./study/isbe/search.html?string=JAMES">JAMES</a>). After a period of companionship with Jesus, during which, in the house of Simon and Andrew, Simon\'s wife\'s mother was healed of a fever (<a onClick="return mV(\'Mar\',1,\'29-31\');">Mr 1:29-31</a>; compare <a onClick="return mV(\'Mat\',8,14,15);">Mt 8:14-15</a>; <a onClick="return mV(\'Luk\',4,38,39);">Lu 4:38-39</a>); the call of Andrew was finally consecrated by his election as one of the Twelve Apostles (<a onClick="return mV(\'Mat\',10,2);">Mt 10:2</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>; <a onClick="return mV(\'Luk\',6,14);">Lu 6:14</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>).<P>3. Subsequent History:<P>Further incidents recorded of Andrew are: At the feeding of the five thousand by the Sea of Galilee, the attention of Jesus was drawn by Andrew to the lad with five sequent barley loaves and two fishes (<span class="noTag">John 6 History John 8.9</span>). At the feast of the Passover, the Greeks who wished to "see Jesus" inquired of Philip, who turned for advice to Andrew, and the two then told Jesus (<a onClick="return mV(\'Jhn\',12,\'20-36\');">Joh 12:20-36</a>). On the Mount of Olives, Andrew along with Peter, James and John, questioned Jesus regarding the destruction of Jerusalem and the end of the world (<a onClick="return mV(\'Mar\',13,\'3-23\');">Mr 13:3-23</a>; compare also <a onClick="return mV(\'Mat\',24,\'3-28\');">Mt 24:3-28</a>; <a onClick="return mV(\'Luk\',21,\'5-24\');">Lu 21:5-24</a>).<P>II. In Apocryphal Literature.<P>The name of Andrew\'s mother was traditionally Joanna, and according to the "Genealogies of the Twelve Apostles" (Budge, Contendings of the Apostles, II, 49) he belonged to the tribe of Reuben, the tribe of his father. A fragment of a Coptic gospel of the 4th or 5th century tells how not only Thomas (<a onClick="return mV(\'Jhn\',20,27);">Joh 20:27</a>), but also Andrew was compelled, by touching the feet of the risen Saviour, to believe in the bodily resurrection (Hennecke, Neutestamentlichen Apokryphen, etc., 38, 39). Various places were assigned as the scene of his subsequent missionary labors. The Syriac Teaching of the Apostles (ed Cureton, 34) mentions Bithynia, Eusebius gives Scythia (Historia Ecclesiastica, III, i, 1), and others Greece (Lipsius, Apokryphen Apostelgeschichten, I, 63). The Muratorian Fragment relates that John wrote his gospel in consequence of a revelation given to Andrew, and this would point to Ephesus (compare Hennecke id, 459). The Contendings of the Twelve Apostles (for historicity, authorship, etc., of this work, compare Budge, Contendings of the Apostles, Intro; Hennecke, Handbuch zu den neutestamentlichen Apokryphen, 351-58; RE, 664-66) contains several parts dealing with Andrew:<P>(1) "The Preaching of Andrew and Philemon among the Kurds" (Budge, II 163 f.) narrates the appearance of the risen Christ to His disciples, the sending of Andrew to Lydia and his conversion of the people there.<P>(2) The "Preaching of Matthias in the City of the Cannibals" (Budge, II, 267 f.; REH, 666) tells of how Matthias, on being imprisoned and blinded by the Cannibals, was released by Andrew, who had been brought to his assistance in a ship by Christ, but the two were afterward again imprisoned. Matthias then caused the city to be inundated, the disciples were set free, and the people converted.<P>(3) "The Acts of Andrew and Bartholomew" (Budge, II, 183 f.) gives an account of their mission among the Parthians.<P>(4) According to the "Martyrdom of Andrew" (Budge, II, 215) he was stoned and crucified in Scythia.<P>According to the surviving fragments of "The Acts of Andrew," a heretical work dating probably from the 2nd century, and referred to by Eusebius (Historia Ecclesiastica, III, ii, 5), the scene of Andrew\'s death was laid in Achaia. There he was imprisoned and crucified by order of the proconsul Eges (or Aegeates), whose wife had been estranged from him by the preaching of Andrew (compare Hennecke, 459-73; Pick, Apocryphal Acts, 201-21; Lipsius, I, 543-622). A so-called "Gospel of Andrew" mentioned by Innocent I (Ep, I, iii, 7) and Augustine (Contra Advers. Leg. et Prophet., I, 20), but this is probably due to a confusion with the above-mentioned "Ac of Andrew." The relics of Andrew were discovered in Constantinople in the time of Justinian, and part of his cross is now in Peter\'s, Rome. Andrew is the patron saint of Scotland, whither his arm is said to have been transferred by Regulus. The ascription to him of the decussate cross is of late origin.<P>III. Character.<P>There is something significant in Andrew\'s being the first called of the apostles. The choice was an important one, for upon the lead given by Andrew depended the action of the others. Christ perceived that the soul\'s unrest, the straining after higher things and a deeper knowledge of God, which had induced Andrew to make the pilgrimage to Bethany, gave promise of a rich spiritual growth, which no doubt influenced Him in His decision. His wisdom and insight were justified of the after event. Along with a keenness of perception regarding spiritual truths was coupled in Andrew a strong sense of personal conviction which enabled him not only to accept Jesus as the Messiah, but to win Peter also as a disciple of Christ. The incident of the Feeding of the Five Thousand displayed Andrew in a fresh aspect: there the practical part which he played formed a striking contrast to the feeble-mindedness of Philip. Both these traits—his missionary spirit, and his decision of character which made others appeal to him when in difficulties—were evinced at the time when the Greeks sought to interview Jesus. Andrew was not one of the greatest of the apostles, yet he is typical of those men of broad sympathies and sound common sense, without whom the success of any great movement cannot be assured.``88';
isbe[518]='Andronicus`an-dro-ni\'-kus (Andronikos):<P>(1) A deputy of Antiochus Epiphanes, who, while ruling at Antioch, excited the Jews by the murder of Onias, and, upon their formal complaint, was executed by his superior (2Macc 4:32-38); generally distinguished from another officer of the same name, also under Antiochus (2Macc 5:23).<P>(2) A kinsman of Paul, residing at Rome (<a onClick="return mV(\'Rom\',16,7);">Ro 16:7</a>). He had been converted to Christianity before Paul, and, like Paul, had suffered imprisonment, although when and where can only be surmised. When he and Junias, another kinsman of Paul, are referred to as "of note among the apostles," this may be interpreted as either designating the high esteem in which they were held by the Twelve, or as reckoning them in the number of apostles. The latter is the sense, if "apostle" be understood here in the more general meaning, used in <a onClick="return mV(\'Act\',14,14);">Ac 14:14</a> of Barnabas, in <a onClick="return mV(\'2Cr\',8,23);">2Co 8:23</a> of Titus, in <a onClick="return mV(\'Phl\',2,25);">Php 2:25</a> of Epaphroditus, and in the Didache of "the traveling evangelists or missionaries who preached the gospel from place to place" (Schaff, The Teaching of the Twelve Apostles, 67; see also Lightfoot on Philippians, 196). On this assumption, Andronicus was one of the most prominent and successful of the traveling missionaries of the early church.``84';
isbe[519]='Anem`a\'-nem (\'anem, "two springs"; Anam): Anem is mentioned with Ramoth among the cities of Issachar assigned to the priests, the sons of Gershom (<a onClick="return mV(\'1Ch\',6,73);">1Ch 6:73</a>). In the parallel list (<a onClick="return mV(\'Jos\',21,29);">Jos 21:29</a>), there are mentioned Jarmuth and En-gannim, corresponding to Ramoth and Anim, therefore Anim and En-gannim (Jenin) are identical. As the name denotes (Anem = "two springs"; En-gannim = "the spring of gardens"), it was well watered. Anem is identified by Eusebius with Aner, but Conder suggests the village of "Anim," on the hills west of the plain of Esdraelon which represents the Anea of the 4th century AD (Onom under the word "Aniel" and "Bethara"), a city lying 15 Roman miles from Caesarea, which had good baths.``91';
isbe[520]='Aner (1)`a\'-ner (\'aner; Septuagint Aunan; Samaritan Pentateuch, \'anram, "sprout," "waterfall"): One of the three "confederates" of Abraham in his pursuit after the four kings (<a onClick="return mV(\'Gen\',14,13,14);">Ge 14:13-14</a>). Judging from the meanings of the two other names, Mamre being the name of the sacred grove or tree (Jahwist) and synonymous with Hebron (Priestly Code); and Eschol—a name of a valley (lit. "grape cluster") from which the personal names are derived—it may be expected to explain the name Aner in a similar way. Dillmann suggested the name of a range of mountains in that vicinity (Comm. at the place and Rosen in ZDMG, XII, 479; Skinner, Genesis, 365).``27';
isbe[521]='Aner (2)`a\'-ner (\'aner, meaning doubtful): A Levitical town in Manasseh, west of the Jordan (<a onClick="return mV(\'1Ch\',6,70);">1Ch 6:70</a>). Gesenius and others identified it with Taanach of <a onClick="return mV(\'Jos\',21,25);">Jos 21:25</a>. There is, however, no agreement as to its location.``1';
isbe[522]='Anethothite`an\'-e-thoth-it: the King James Version form of Anathothite (thus the Revised Version (British and American) <a onClick="return mV(\'2Sa\',23,27);">2Sa 23:27</a>).``1';
isbe[523]='Anetothite`an\'-e-toth-it: the King James Version form of Anathothite (thus the Revised Version (British and American) <a onClick="return mV(\'1Ch\',27,12);">1Ch 27:12</a>).``1';
isbe[524]='Angel`an\'-jel (mal\'akh; Septuagint and New Testament, aggelos):<P><b>I. DEFINITION AND SCRIPTURE TERMS</b><P><b>II. ANGELS IN OLD TESTAMENT</b><P class="in15">1. Nature, Appearances and Functions<P class="in15">2. The Angelic Host<P class="in15">3. The Angel of the Theophany<P><b>III. ANGELS IN NEW TESTAMENT</b><P class="in15">1. Appearances<P class="in15">2. The Teaching of Jesus about Angels<P class="in15">3. Other New Testament References<P><b>IV. DEVELOPMENT OF THE DOCTRINE</b><P><b>V. THE REALITY OF ANGELS</b><P><b>LITERATURE</b><hr /><P>I. Definition and Scripture Terms.<p>The word angel is applied in Scripture to an order of supernatural or heavenly beings whose business it is to act as God\'s messengers to men, and as agents who carry out His will. Both in Hebrew and Greek the word is applied to human messengers (<a onClick="return mV(\'1Ki\',19,2);">1Ki 19:2</a>; <a onClick="return mV(\'Luk\',7,24);">Lu 7:24</a>); in Hebrew it is used in the singular to denote a Divine messenger, and in the plural for human messengers, although there are exceptions to both usages. It is applied to the prophet Haggai (<a onClick="return mV(\'Hag\',1,13);">Hag 1:13</a>), to the priest (<a onClick="return mV(\'Mal\',2,7);">Mal 2:7</a>), and to the messenger who is to prepare the way of the Lord (<a onClick="return mV(\'Mal\',3,1);">Mal 3:1</a>). Other Hebrew words and phrases applied to angels are bene ha-\'elohim (<a onClick="return mV(\'Gen\',6,2,4);">Ge 6:2, 4</a>; <a onClick="return mV(\'Job\',1,6);">Job 1:6</a>; <a onClick="return mV(\'Job\',2,1);">2:1</a>) and bene \'elim (<a onClick="return mV(\'Psa\',29,1);">Ps 29:1</a>; <a onClick="return mV(\'Psa\',89,6);">89:6</a>), i.e. sons of the \'elohim or \'elim; this means, according to a common Hebrew usage, members of the class called \'elohim or \'elim, the heavenly powers. It seems doubtful whether the word \'elohim, standing by itself, is ever used to describe angels, although Septuagint so translates it in a few passages.<p>The most notable instance is <a onClick="return mV(\'Psa\',8,5);">Ps 8:5</a>; where the Revised Version (British and American) gives, "Thou hast made him but little lower than God," with the English Revised Version, margin reading of "the angels" for "God" (compare <a onClick="return mV(\'Hbr\',2,7,9);">Heb 2:7, 9</a>); qedhoshim "holy ones" (<a onClick="return mV(\'Psa\',89,5,7);">Ps 89:5, 7</a>), a name suggesting the fact that they belong to God; \'ir, \'irim, "watcher," "watchers" (<a onClick="return mV(\'Dan\',4,13,17,23);">Da 4:13, 17, 23</a>). Other expressions are used to designate angels collectively: codh, "council" (<a onClick="return mV(\'Psa\',89,7);">Ps 89:7</a>), where the reference may be to an inner group of exalted angels; \'edhah and qahal, "congregation" (<a onClick="return mV(\'Psa\',82,1);">Ps 82:1</a>; <a onClick="return mV(\'Psa\',89,5);">89:5</a>); and finally tsabha\', tsebha\'oth, "host," "hosts," as in the familiar phrase "the God of hosts."<p>In New Testament the word aggelos, when it refers to a Divine messenger, is frequently accompanied by some phrase which makes this meaning clear, e.g. "the angels of heaven" (<a onClick="return mV(\'Mat\',24,36);">Mt 24:36</a>). Angels belong to the "heavenly host" (<a onClick="return mV(\'Luk\',2,13);">Lu 2:13</a>). In reference to their nature they are called "spirits" (<a onClick="return mV(\'Hbr\',1,14);">Heb 1:14</a>). Paul evidently referred to the ordered ranks of supra-mundane beings in a group of words that are found in various combinations, namely, archai, "principalities," exousiai, "powers," thronoi, "thrones," kuriotetes, "dominions," and dunameis, also translated "powers." The first four are apparently used in a good sense in <a onClick="return mV(\'Col\',1,16);">Col 1:16</a>, where it is said that all these beings were created through Christ and unto Him; in most of the other passages in which words from this group occur, they seem to represent evil powers. We are told that our wrestling is against them (<a onClick="return mV(\'Eph\',6,12);">Eph 6:12</a>), and that Christ triumphs over the principalities and powers (<a onClick="return mV(\'Col\',2,15);">Col 2:15</a>; compare <a onClick="return mV(\'Rom\',8,38);">Ro 8:38</a>; <a onClick="return mV(\'1Cr\',15,24);">1Co 15:24</a>). In two passages the word archaggelos, "archangel" or chief angel, occurs: "the voice of the archangel" (<a onClick="return mV(\'1Th\',4,16);">1Th 4:16</a>), and "Michael the archangel" (<a onClick="return mV(\'Jud\',1,9);">Jude 1:9</a>).<p>II. Angels in Old Testament.<p>1. Nature, Appearances and Functions:<p>Everywhere in the Old Testament the existence of angels is assumed. The creation of angels is referred to in <a onClick="return mV(\'Psa\',148,2,5);">Ps 148:2, 5</a> (compare <a onClick="return mV(\'Col\',1,16);">Col 1:16</a>). They were present at the creation of the world, and were so filled with wonder and gladness that they "shouted for joy" (<a onClick="return mV(\'Job\',38,7);">Job 38:7</a>). Of their nature we are told nothing. In general they are simply regarded as embodiments of their mission. Though presumably the holiest of created beings, they are charged by God with folly (<a onClick="return mV(\'Job\',4,18);">Job 4:18</a>), and we are told that "he putteth no trust in his holy ones" (<a onClick="return mV(\'Job\',15,15);">Job 15:15</a>).<p>References to the fall of the angels are only found in the obscure and probably corrupt passage <a onClick="return mV(\'Gen\',6,\'1-4\');">Ge 6:1-4</a>, and in the interdependent passages <a onClick="return mV(\'2Pe\',2,4);">2Pe 2:4</a> and <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a>, which draw their inspiration from the Apocryphal book of Enoch. Demons are mentioned (see <a href="./study/isbe/search.html?string=DEMON">DEMON</a>); and although Satan appears among the sons of God (<a onClick="return mV(\'Job\',1,6);">Job 1:6</a>; <a onClick="return mV(\'Job\',2,1);">2:1</a>), there is a growing tendency in later writers to attribute to him a malignity that is all his own (see <a href="./study/isbe/search.html?string=SATAN">SATAN</a>).<p>As to their outward appearance, it is evident that they bore the human form, and could at times be mistaken for men (<a onClick="return mV(\'Eze\',9,2);">Eze 9:2</a>; <a onClick="return mV(\'Gen\',18,2,16);">Ge 18:2, 16</a>). There is no hint that they ever appeared in female form. The conception of angels as winged beings, so familiar in Christian art, finds no support in Scripture (except, perhaps <a onClick="return mV(\'Dan\',9,21);">Da 9:21</a>; <a onClick="return mV(\'Rev\',14,6);">Re 14:6</a>, where angels are represented as "flying"). The cherubim and seraphim (see <a href="./study/isbe/search.html?string=CHERUB">CHERUB</a>; <a href="./study/isbe/search.html?string=SERAPHIM">SERAPHIM</a>) are represented as winged (<a onClick="return mV(\'Exd\',25,20);">Ex 25:20</a>; <a onClick="return mV(\'Isa\',6,2);">Isa 6:2</a>); winged also are the symbolic living creatures of Ezekiel (<a onClick="return mV(\'Eze\',1,6);">Eze 1:6</a>; compare <a onClick="return mV(\'Rev\',4,8);">Re 4:8</a>).<p>As above stated, angels are messengers and instruments of the Divine will. As a rule they exercise no influence in the physical sphere. In several instances, however, they are represented as destroying angels: two angels are commissioned to destroy Sodom (<a onClick="return mV(\'Gen\',19,13);">Ge 19:13</a>); when David numbers the people, an angel destroys them by pestilence (<a onClick="return mV(\'2Sa\',24,16);">2Sa 24:16</a>); it is by an angel that the Assyrian army is destroyed (<a onClick="return mV(\'2Ki\',19,35);">2Ki 19:35</a>); and Ezekiel hears six angels receiving the command to destroy those who were sinful in Jerusalem (<a onClick="return mV(\'Eze\',9,1,5,7);">Eze 9:1, 5, 7</a>). In this connection should be noted the expression "angels of evil," i.e. angels that bring evil upon men from God and execute His judgments (<a onClick="return mV(\'Psa\',78,49);">Ps 78:49</a>; compare <a onClick="return mV(\'1Sa\',16,14);">1Sa 16:14</a>). Angels appear to Jacob in dreams (<a onClick="return mV(\'Gen\',28,12);">Ge 28:12</a>; <a onClick="return mV(\'Gen\',31,11);">31:11</a>). The angel who meets Balaam is visible first to the ass, and not to the rider (<a onClick="return mV(\'Num\',22,\'1-\');">Nu 22</a> f.). Angels interpret God\'s will, showing man what is right for him (<a onClick="return mV(\'Job\',33,23);">Job 33:23</a>). The idea of angels as caring for men also appears (<a onClick="return mV(\'Psa\',91,11);">Ps 91:11</a> f.), although the modern conception of the possession by each man of a special guardian angel is not found in Old Testament.<p>2. The Angelic Host:<p>The phrase "the host of heaven" is applied to the stars, which were sometimes worshipped by idolatrous Jews (<a onClick="return mV(\'Jer\',33,22);">Jer 33:22</a>; <a onClick="return mV(\'2Ki\',21,3);">2Ki 21:3</a>; <a onClick="return mV(\'Zep\',1,5);">Ze 1:5</a>); the name is applied to the company of angels because of their countless numbers (compare <a onClick="return mV(\'Dan\',7,10);">Da 7:10</a>) and their glory. They are represented as standing on the right and left hand of Yahweh (<a onClick="return mV(\'1Ki\',22,19);">1Ki 22:19</a>). Hence God, who is over them all, is continually called throughout Old Testament "the God of hosts," "Yahweh of hosts," "Yahweh God of hosts"; and once "the prince of the host" (<a onClick="return mV(\'Dan\',8,11);">Da 8:11</a>). One of the principal functions of the heavenly host is to be ever praising the name of the Lord (<a onClick="return mV(\'Psa\',103,21);">Ps 103:21</a>; <a onClick="return mV(\'Psa\',148,1);">148:1</a>f.). In this host there are certain figures that stand out prominently, and some of them are named. The angel who appears to Joshua calls himself "prince of the host of Yahweh" (<a onClick="return mV(\'Jos\',5,14);">Jos 5:14</a> f.). The glorious angel who interprets to Daniel the vision which he saw in the third year of Cyrus (<a onClick="return mV(\'Dan\',10,5);">Da 10:5</a>), like the angel who interprets the vision in the first year of Belshazzar (<a onClick="return mV(\'Dan\',7,16);">Da 7:16</a>), is not named; but other visions of the same prophet were explained to him by the angel Gabriel, who is called "the man Gabriel," and is described as speaking with "a man\'s voice" (<a onClick="return mV(\'Dan\',9,21);">Da 9:21</a>; <a onClick="return mV(\'Dan\',8,15);">8:15</a>f.). In Daniel we find occasional reference made to "princes": "the prince of Persia," "the prince of Greece" (<a onClick="return mV(\'Dan\',10,20);">Da 10:20</a>). These are angels to whom is entrusted the charge of, and possibly the rule over, certain peoples. Most notable among them is Michael, described as "one of the chief princes," "the great prince who standeth for the children of thy people," and, more briefly, "your prince" (<a onClick="return mV(\'Dan\',10,13);">Da 10:13</a>; <a onClick="return mV(\'Dan\',12,1);">12:1</a>; <a onClick="return mV(\'Dan\',10,21);">10:21</a>); Michael is therefore regarded as the patron-angel of the Jews. In Apocrypha Raphael, Uriel and Jeremiel are also named. Of Raphael it is said (Tobit 12:15) that he is "one of the seven holy angels who present the prayers of the saints" to God (compare <a onClick="return mV(\'Rev\',8,2);">Re 8:2</a>, "the seven angels that stand before God"). It is possible that this group of seven is referred to in the above-quoted phrase, "one of the chief princes". Some (notably Kosters) have maintained that the expressions "the sons of the \'elohim," God\'s "council" and "congregation," refer to the ancient gods of the heathen, now degraded and wholly subordinated to Yahweh. This rather daring speculation has little support in Scripture; but we find traces of a belief that the patron-angels of the nations have failed in establishing righteousness within their allotted sphere on earth, and that they will accordingly be punished by Yahweh their over-Lord (<a onClick="return mV(\'Isa\',24,21);">Isa 24:21</a>f.; <a onClick="return mV(\'Psa\',82,\'1-\');">Ps 82</a>; compare <a onClick="return mV(\'Psa\',58,1);">Ps 58:1</a>f. the Revised Version, margin; compare <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a>).<p>3. The Angel of the Theophany:<p>This angel is spoken of as "the angel of Yahweh," and "the angel of the presence (or face) of Yahweh." The following passages contain references to this angel: <a onClick="return mV(\'Gen\',16,7);">Ge 16:7</a> f.—the angel and Hagar; <a onClick="return mV(\'Gen\',18,\'1-\');">Ge 18</a>—Abraham intercedes with the angel for Sodom; <a onClick="return mV(\'Gen\',22,11);">Ge 22:11</a> f.—the angel interposes to prevent the sacrifice of Isaac; <a onClick="return mV(\'Gen\',24,7,40);">Ge 24:7, 40</a>—Abraham sends Eliezer and promises the angel\'s protection; <a onClick="return mV(\'Gen\',31,11);">Ge 31:11</a> f.—the angel who appears to Jacob says "I am the God of Beth-el"; <a onClick="return mV(\'Gen\',32,24);">Ge 32:24</a> f.—Jacob wrestles with the angel and says, "I have seen God face to face"; <a onClick="return mV(\'Gen\',48,15);">Ge 48:15</a> f.—Jacob speaks of God and the angel as identical; <a onClick="return mV(\'Exd\',3,\'1-\');">Ex 3</a> (compare <a onClick="return mV(\'Act\',7,30);">Ac 7:30</a> f.)—the angel appears to Moses in the burning bush; <a onClick="return mV(\'Exd\',13,21);">Ex 13:21</a>; <a onClick="return mV(\'Exd\',14,19);">14:19</a> (compare <a onClick="return mV(\'Num\',20,16);">Nu 20:16</a>)—God or the angel leads Israel out of Egypt; <a onClick="return mV(\'Exd\',23,20);">Ex 23:20</a> f.—the people are commanded to obey the angel; <a onClick="return mV(\'Exd\',32,\'34-\');">Ex 32:34</a>-<a onClick="return mV(\'Exd\',33,\'1-17\');">33:17</a> (compare <a onClick="return mV(\'Isa\',63,9);">Isa 63:9</a>)—Moses pleads for the presence of God with His people; <a onClick="return mV(\'Jos\',5,\'13-\');">Jos 5:13</a>-<a onClick="return mV(\'Jos\',6,1,2);">6:2</a>—the angel appears to Joshua; <a onClick="return mV(\'Jdg\',2,\'1-5\');">Jud 2:1-5</a>—the angel speaks to the people; <a onClick="return mV(\'Jdg\',6,11);">Jud 6:11</a> f.—the angel appears to Gideon.<p>A study of these passages shows that while the angel and Yahweh are at times distinguished from each other, they are with equal frequency, and in the same passages, merged into each other. How is this to be explained? It is obvious that these apparitions cannot be the Almighty Himself, whom no man hath seen, or can see. In seeking the explanation, special attention should be paid to two of the passages above cited. In <a onClick="return mV(\'Exd\',23,20);">Ex 23:20</a>f. God promises to send an angel before His people to lead them to the promised land; they are commanded to obey him and not to provoke him "for he will not pardon your transgression: for my name is in him." Thus the angel can forgive sin, which only God can do, because God\'s name, i.e. His character and thus His authority, are in the angel. Further, in the passage <a onClick="return mV(\'Exd\',32,\'34-\');">Ex 32:34</a>-<a onClick="return mV(\'Exd\',33,\'1-17\');">33:17</a> Moses intercedes for the people after their first breach of the covenant; God responds by promising, "Behold mine angel shall go before thee"; and immediately after God says, "I will not go up in the midst of thee." In answer to further pleading, God says, "My presence shall go with thee, and I will give thee rest." Here a clear distinction is made between an ordinary angel, and the angel who carries with him God\'s presence. The conclusion may be summed up in the words of Davidson in his Old Testament Theology: "In particular providences one may trace the presence of Yahweh in influence and operation; in ordinary angelic appearances one may discover Yahweh present on some side of His being, in some attribute of His character; in the angel of the Lord He is fully present as the covenant God of His people, to redeem them." The question still remains, Who is theophanic angel? To this many answers have been given, of which the following may be mentioned:<p>(1) This angel is simply an angel with a special commission;<p>(2) He may be a momentary descent of God into visibility;<p>(3) He may be the Logos, a kind of temporary preincarnation of the second person of the Trinity. Each has its difficulties, but the last is certainly the most tempting to the mind. Yet it must be remembered that at best these are only conjectures that touch on a great mystery. It is certain that from the beginning God used angels in human form, with human voices, in order to communicate with man; and the appearances of the angel of the Lord, with his special redemptive relation to God\'s people, show the working of that Divine mode of self-revelation which culminated in the coming of the Saviour, and are thus a fore-shadowing of, and a preparation for, the full revelation of God in Jesus Christ. Further than this, it is not safe to go.<p>III. Angels in New Testament.<p>1. Appearances:<p>Nothing is related of angels in New Testament which is inconsistent with the teaching of Old Testament on the subject. Just as they are specially active in the beginning of Old Testament history, when God\'s people is being born, so they appear frequently in connection with the birth of Jesus, and again when a new order of things begins with the resurrection. An angel appears three times in dreams to Joseph (<a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>; <a onClick="return mV(\'Mat\',2,13,19);">2:13,19</a>). The angel Gabriel appears to Zacharias, and then to Mary in the annunciation (<a onClick="return mV(\'Luk\',1,\'1-\');">Lu 1</a>). An angel announces to the shepherds the birth of Jesus, and is joined by a "multitude of the heavenly host," praising God in celestial song (<a onClick="return mV(\'Luk\',2,8);">Lu 2:8</a>f.). When Jesus is tempted, and again during the agony at Gethsemane, angels appear to Him to strengthen His soul (<a onClick="return mV(\'Mat\',4,11);">Mt 4:11</a>; <a onClick="return mV(\'Luk\',22,43);">Lu 22:43</a>). The verse which tells how an angel came down to trouble the pool (<a onClick="return mV(\'Jhn\',5,4);">Joh 5:4</a>) is now omitted from the text as not being genuine. An angel descends to roll away the stone from the tomb of Jesus (<a onClick="return mV(\'Mat\',28,2);">Mt 28:2</a>); angels are seen there by certain women (<a onClick="return mV(\'Luk\',24,23);">Lu 24:23</a>) and (two) by Mary Magdalene (<a onClick="return mV(\'Jhn\',20,12);">Joh 20:12</a>). An angel releases the apostles from prison, directs Philip, appears to Peter in a dream, frees him from prison, smites Herod with sickness, appears to Paul in a dream (<a onClick="return mV(\'Act\',5,19);">Ac 5:19</a>; <a onClick="return mV(\'Act\',8,26);">8:26</a>; <a onClick="return mV(\'Act\',10,3);">10:3</a>; <a onClick="return mV(\'Act\',12,7);">12:7</a>f.; <a onClick="return mV(\'Act\',12,23);">12:23</a>; <a onClick="return mV(\'Act\',27,23);">27:23</a>). Once they appear clothed in white; they are so dazzling in appearance as to terrify beholders; hence they begin their message with the words "Fear not" (<a onClick="return mV(\'Mat\',28,\'2-5\');">Mt 28:2-5</a>).<p>2. The Teaching of Jesus about Angels:<p>It is quite certain that our Lord accepted the main teachings of Old Testament about angels, as well as the later Jewish belief in good and bad angels. He speaks of the "angels in heaven" (<a onClick="return mV(\'Mat\',22,30);">Mt 22:30</a>), and of "the devil and his angels" (<a onClick="return mV(\'Mat\',25,41);">Mt 25:41</a>). According to our Lord the angels of God are holy (<a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a>); they have no sex or sensuous desires (<a onClick="return mV(\'Mat\',22,30);">Mt 22:30</a>); they have high intelligence, but they know not the time of the Second Coming (<a onClick="return mV(\'Mat\',24,36);">Mt 24:36</a>); they carry (in a parable) the soul of Lazarus to Abraham\'s bosom (<a onClick="return mV(\'Luk\',16,22);">Lu 16:22</a>); they could have been summoned to the aid of our Lord, had He so desired (<a onClick="return mV(\'Mat\',26,53);">Mt 26:53</a>); they will accompany Him at the Second Coming (<a onClick="return mV(\'Mat\',25,31);">Mt 25:31</a>) and separate the righteous from the wicked (<a onClick="return mV(\'Mat\',13,41,49);">Mt 13:41, 49</a>). They watch with sympathetic eyes the fortunes of men, rejoicing in the repentance of a sinner (<a onClick="return mV(\'Luk\',15,10);">Lu 15:10</a>; compare <a onClick="return mV(\'1Pe\',1,12);">1Pe 1:12</a>; <a onClick="return mV(\'Eph\',3,10);">Eph 3:10</a>; <a onClick="return mV(\'1Cr\',4,9);">1Co 4:9</a>); and they will hear the Son of Man confessing or denying those who have confessed or denied Him before men (<a onClick="return mV(\'Luk\',12,8);">Lu 12:8</a> f.). The angels of the presence of God, who do not appear to correspond to our conception of guardian angels, are specially interested in God\'s little ones (<a onClick="return mV(\'Mat\',18,10);">Mt 18:10</a>). Finally, the existence of angels is implied in the Lord\'s Prayer in the petition, "Thy will be done, as in heaven, so on earth" (<a onClick="return mV(\'Mat\',6,10);">Mt 6:10</a>).<p>3. Other New Testament References:<p>Paul refers to the ranks of angels ("principalities, powers" etc.) only in order to emphasize the complete supremacy of Jesus Christ. He teaches that angels will be judged by the saints (<a onClick="return mV(\'1Cr\',6,3);">1Co 6:3</a>). He attacks the incipient Gnosticism of Asia Minor by forbidding the, worship of angels (<a onClick="return mV(\'Col\',2,18);">Col 2:18</a>). He speaks of God\'s angels as "elect," because they are included in the counsels of Divine love (<a onClick="return mV(\'1Ti\',5,21);">1Ti 5:21</a>). When Paul commands the women to keep their heads covered in church because of the angels (<a onClick="return mV(\'1Cr\',11,10);">1Co 11:10</a>) he probably means that the angels, who watch all human affairs with deep interest, would be pained to see any infraction of the laws of modesty. In <a onClick="return mV(\'Hbr\',1,14);">Heb 1:14</a> angels are described as ministering spirits engaged in the service of the saints. Peter also emphasizes the supremacy of our Lord over all angelic beings (<a onClick="return mV(\'1Pe\',3,22);">1Pe 3:22</a>). The references to angels in 2 Peter and Jude are colored by contact with Apocrypha literature. In Revelation, where the references are obviously symbolic, there is very frequent mention of angels. The angels of the seven churches (<a onClick="return mV(\'Rev\',1,20);">Re 1:20</a>) are the guardian angels or the personifications of these churches. The worship of angels is also forbidden (<a onClick="return mV(\'Rev\',22,8);">Re 22:8</a> f.). Specially interesting is the mention of elemental angels—"the angel of the waters" (<a onClick="return mV(\'Rev\',16,5);">Re 16:5</a>), and the angel "that hath power over fire" (<a onClick="return mV(\'Rev\',14,18);">Re 14:18</a>; compare <a onClick="return mV(\'Rev\',7,1);">Re 7:1</a>; <a onClick="return mV(\'Rev\',19,17);">19:17</a>). Reference is also made to the "angel of the bottomless pit," who is called <a href="./study/isbe/search.html?string=ABADDON">ABADDON</a> or <a href="./study/isbe/search.html?string=APOLLYON">APOLLYON</a> (which see), evidently an evil angel (<a onClick="return mV(\'Rev\',9,11);">Re 9:11</a> the King James Version, the Revised Version (British and American) "abyss"). In <a onClick="return mV(\'Rev\',12,7);">Re 12:7</a>f. we are told that there was war between Michael with his angels and the dragon with his angels.<p>IV. Development of the Doctrine.<p>In the childhood of the race it was easy to believe in God, and He was very near to the soul. In Paradise there is no thought of angels; it is God Himself who walks in the garden. A little later the thought of angels appears, but, God has not gone away, and as "the angel of Yahweh" He appears to His people and redeems them. In these early times the Jews believed that there were multitudes of angels, not yet divided in thought into good and bad; these had no names or personal characteristics, but were simply embodied messages. Till the time of the captivity the Jewish angelology shows little development. During that dark period they came into close contact with a polytheistic people, only to be more deeply confirmed in their monotheism thereby. They also became acquainted with the purer faith of the Persians, and in all probability viewed the tenets of Zoroastrianism with a more favorable eye, because of the great kindness of Cyrus to their nation.<p>There are few direct traces of Zoroastrianism in the later angelology of the Old Testament. It is not even certain that the number seven as applied to the highest group of angels is Persian in its origin; the number seven was not wholly disregarded by the Jews. One result of the contact was that the idea of a hierarchy of the angels was more fully developed. The conception in Daniel of angels as "watchers," and the idea of patron-princes or angel-guardians of nations may be set down to Persian influence. It is probable that contact with the Persians helped the Jews to develop ideas already latent in their minds. According to Jewish tradition, the names of the angels came from Babylon. By this time the consciousness of sin had grown more intense in the Jewish mind, and God had receded to an immeasurable distance; the angels helped to fill the gap between God and man. The more elaborate conceptions of Daniel and Zechariah are further developed in Apocrypha, especially in 2Esdras, Tobit and 2Macc.<p>In the New Testament we find that there is little further development; and by the Spirit of God its writers were saved from the absurdly puerile teachings of contemporary Rabbinism. We find that the Sadducees, as contrasted with the Pharisees, did not believe in angels or spirits (<a onClick="return mV(\'Act\',23,8);">Ac 23:8</a>). We may conclude that the Sadducees, with their materialistic standpoint, and denial of the resurrection, regarded angels merely as symbolical expressions of God\'s actions. It is noteworthy in this connection that the great priestly document (Priestly Code, P) makes no mention of angels. The Book of Revelation naturally shows a close kinship to the Books of Ezekiel and Daniel. Regarding the rabbinical developments of angelology, some beautiful, some extravagant, some grotesque, but all fanciful, it is not necessary here to speak. The Essenes held an esoteric doctrine of angels, in which most scholars find the germ of the Gnostic eons.<p>V. The Reality of Angels.<p>A belief in angels, if not indispensable to the faith of a Christian, has its place there. In such a belief there is nothing unnatural or contrary to reason. Indeed, the warm welcome which human nature has always given to this thought, is an argument in its favor. Why should there not be such an order of beings, if God so willed it? For the Christian the whole question turns on the weight to be attached to the words of our Lord. All are agreed that He teaches the existence, reality, and activity of angelic beings. Was He in error because of His human limitations? That is a conclusion which it is very hard for the Christian to draw, and we may set it aside. Did He then adjust His teaching to popular belief, knowing that what He said was not true? This explanation would seem to impute deliberate untruth to our Lord, and must equally be set aside. So we find ourselves restricted to the conclusion that we have the guaranty of Christ\'s word for the existence of angels; for most Christians that will settle the question.<p>The visible activity of angels has come to an end, because their mediating work is done; Christ has founded the kingdom of the Spirit, and God\'s Spirit speaks directly to the spirit of man. This new and living way has been opened up to us by Jesus Christ, upon whom faith can yet behold the angels of God ascending and descending. Still they watch the lot of man, and rejoice in his salvation; still they join in the praise and adoration of God, the Lord of hosts, still can they be regarded as "ministering spirits sent forth to do service for the sake of them that shall inherit salvation."<p>LITERATURE.<p>All Old Testament and New Testament theologies contain discussions. Among the older books Oehler\'s Old Testament Theology and Hengstenberg\'s Christology of Old Testament (for "angel of Yahweh") and among modern ones Davidson\'s Old Testament Theology are specially valuable. The ablest supporter of theory that the "sons of the Elohim" are degraded gods is Kosters. "Het onstaan der Angelologie onder Israel," TT 1876. See also articles on "Angel" in HDB (by Davidson), EB, DCG, Jewish Encyclopedia, RE (by Cremer). Cremer\'s Biblico-Theological New Testament Lexicon should be consulted under the word "aggelos." For Jewish beliefs see also Edersheim\'s Life and Times of Jesus, II, Appendix xiii. On the Pauline angelology see Everling, Die paulinische Angelologie. On the general subject see Godet, Biblical Studies; Mozley, The Word, chapter lix, and Latham, A Service of Angels.``195';
isbe[525]='Angel of God``<a href="./study/isbe/search.html?string=ANGEL">ANGEL</a>`1';
isbe[526]='Angel of Yahweh``<a href="./study/isbe/search.html?string=ANGEL">ANGEL</a>`1';
isbe[527]='Angels of the Seven Churches`It is evident from the contexts of the various Biblical passages in which the word "angel" appears, that the word does not always represent the same idea. In such passages as <a onClick="return mV(\'Dan\',12,1);">Da 12:1</a> and <a onClick="return mV(\'Act\',12,15);">Ac 12:15</a> it would seem that the angel was generally regarded as a superhuman being whose duty it was to guard a nation or an individual, not unlike the jenei of the Arabs. However, in <a onClick="return mV(\'Mal\',2,7);">Mal 2:7</a>; <a onClick="return mV(\'Mal\',2,3);">3:1</a> (Hebrew) the word is clearly used to represent men. In the New Testament also, there are passages, such as <a onClick="return mV(\'Jam\',2,25);">Jas 2:25</a> (Greek), in which the word seems to be applied to men. The seven angels of the seven churches (<a onClick="return mV(\'Rev\',1,20);">Re 1:20</a>) received seven letters, figurative letters, and therefore it would seem that the seven angels are also figurative and may refer to the seven bishops who presided over the seven churches of Asia. Or the angels may be regarded as the personifications of the churches.``7';
isbe[528]='Anger`an\'-ger: In the Old Testament, the translation of several Hebrew words, especially of \'aph (lit. "nostril," "countenance"), which is used some 45 times of human, 177 times of Divine, anger (OHL). The word occurs rarely in the New Testament (<a onClick="return mV(\'Mar\',3,5);">Mr 3:5</a>; <a onClick="return mV(\'Eph\',4,31);">Eph 4:31</a>; <a onClick="return mV(\'Col\',3,8);">Col 3:8</a>; <a onClick="return mV(\'Rev\',14,10);">Re 14:10</a>), its place being taken by the word "wrath" (see <a href="./study/isbe/search.html?string=WRATH">WRATH</a>). As a translation of words denoting God\'s "anger," the English word is unfortunate so far as it may seem to imply selfish, malicious or vindictive personal feeling. The anger of God is the response of His holiness to outbreaking sin. Particularly when it culminates in action is it rightly called His "wrath." The Old Testament doctrine of God\'s anger is contained in many passages in the Pentateuch, Psalms and the Prophets. In Proverbs men are dissuaded from anger (<a onClick="return mV(\'Pro\',15,1);">Pr 15:1</a>; <a onClick="return mV(\'Pro\',27,4);">27:4</a>), and the "slow to anger" is commended (<a onClick="return mV(\'Pro\',15,18);">Pr 15:18</a>; <a onClick="return mV(\'Pro\',16,32);">16:32</a>; <a onClick="return mV(\'Pro\',19,11);">19:11</a>). Christians axe enjoined to put away the feeling of self-regarding, vindictive anger (<a onClick="return mV(\'Eph\',4,31);">Eph 4:31</a>; <a onClick="return mV(\'Col\',3,8);">Col 3:8</a>), and to cherish no desire of personal revenge (<a onClick="return mV(\'Eph\',4,26);">Eph 4:26</a>).``57';
isbe[529]='Angle`an\'-g\'-l: Used in <a onClick="return mV(\'Isa\',19,8);">Isa 19:8</a> for a Hebrew noun that is rendered "hook" in <a onClick="return mV(\'Job\',41,1);">Job 41:1</a>: "The fishers shall lament, and all they that cast angle (hook) into the Nile shall mourn." For a striking figurative use of it see <a onClick="return mV(\'Hab\',1,15);">Hab 1:15</a> where, speaking of the wicked devouring the righteous, "making men as the fishes of the sea," the prophet says: "They take up all of them with the angle, they catch them in their net" (the Revised Version (British and American) uses singular).``1';
isbe[530]='Angling`an\'-gling: Angling, i.e. fishing with a hook or angle, was little known among the ancients. The fish were chiefly taken by casting nets, etc. (see <a onClick="return mV(\'Mat\',13,47);">Mt 13:47</a>). Compare e.g. "Then did Deucalion first the art invent of angling" (Davors, Secret of Angling, I).`<a href="./study/isbe/search.html?string=NET">NET</a>`1';
isbe[531]='Anglo-Saxon Versions`an-glo-sax\'-on vur\'-shuns.`<a href="./study/isbe/search.html?string=ENGLISH+VERSIONS">ENGLISH VERSIONS</a>`1';
isbe[532]='Anguish`an\'-gwish: Extreme distress of body, mind or spirit; excruciating pain or suffering of soul, e.g. excessive grief, remorse, despair. Chiefly expressed in Old Testament, by four derivatives of tsuq, "straitened," "pressed," and tsar, and two derivatives signifying "straitness," "narrowness," hence distress; also shabhats, "giddiness," "confusion of mind"; hul "to twist" with pain, "writhe." So in the New Testament, thlipsis, "a pressing together," hence affliction, tribulation, stenochoria, "narrowness of place," hence extreme affliction; sunoche, "a holding together," hence distress. The fundamental idea in these various terms is pressure—being straitened, compressed into a narrow place, or pain through physical or mental torture. Used of the physical agony of child-birth (<a onClick="return mV(\'Jer\',4,31);">Jer 4:31</a>; <a onClick="return mV(\'Jer\',6,24);">6:24</a>; <a onClick="return mV(\'Jer\',49,24);">49:24</a>; <a onClick="return mV(\'Jer\',50,43);">50:43</a>; <a onClick="return mV(\'Jhn\',16,21);">Joh 16:21</a>); of distress of soul as the result of sin and wickedness (<a onClick="return mV(\'Job\',15,24);">Job 15:24</a>; <a onClick="return mV(\'Pro\',1,27);">Pr 1:27</a>; <a onClick="return mV(\'Rom\',2,9);">Ro 2:9</a>); of anguish of spirit through the cruel bondage of slavery (<a onClick="return mV(\'Exd\',6,9);">Ex 6:9</a>) and Assyrian oppression (<a onClick="return mV(\'Isa\',8,22);">Isa 8:22</a>); of the anxiety and pain of Christian love because of the sins of fellow-disciples (<a onClick="return mV(\'2Cr\',2,4);">2Co 2:4</a>).``139';
isbe[533]='Aniam`a-ni\'-am (\'ani\'am, "lament of the people"): A son of Shemidah of Manasseh (<a onClick="return mV(\'1Ch\',7,19);">1Ch 7:19</a>).``1';
isbe[534]='Anim`a\'-nim (\'anim, "springs"): One of the cities of the hill country of Judah mentioned immediately after Eshtemoa (<a onClick="return mV(\'Jos\',15,50);">Jos 15:50</a>). It is probably represented by the double ruin of el Ghuwein situated south of es Semu\'a. The surface remains are Byzantine—a Christian town called Anem was here in the 4th century, but it is clearly an ancient site of importance (PEF, III,408,Sh, XXV).``1';
isbe[535]='Animal`an\'-i-mal: See under the various names and also the general article on <a href="./study/isbe/search.html?string=ZOOLOGY">ZOOLOGY</a>.``1';
isbe[536]='Anise; Dill`an\'-is, or dil; (RVm, anethon): Not the true anise, Pimpinella anisum, as was supposed by the King James Version translators, but Dill, Anethum graveolens. This is an annual or biennial herb of NO Umbelliferae, growing from one to three feet high, with small yellow flowers and brownish, flattened, oval fruits 1/5 inch long. It grows wild in lands bordering on the Mediterranean. The seeds have an aromatic flavor and are used as condiment in cooking, as carminative in medicine. "Dill water" is a favorite domestic remedy. Jesus said (<a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>): "Woe unto you scribes and Pharisees, hypocrites! for ye tithe mint and anise and cummin, and have left undone the weightier matters of the law," etc. In the tract, Ma\'aseroth (4 5) it is mentioned that this plant (Hebrew shabhath), its stem, leaves and seed, was subject to tithe.`<a href="./study/isbe/search.html?string=CUT">CUT</a>`117';
isbe[537]='Ankle`an\'-k\'-l (in older editions of the King James Version, ancle): From Hebrew me\'aphecayim literally, "water of ankles," i.e. shallow water (<a onClick="return mV(\'Eze\',47,3);">Eze 47:3</a>); "anklebones" (<a onClick="return mV(\'Act\',3,7);">Ac 3:7</a>) from sphudron "ankle chains" (the King James Version "chains"), from a Hebrew root meaning "to walk about proudly" (<a onClick="return mV(\'Num\',31,50);">Nu 31:50</a>). The same Hebrew word is translated "bracelet" (<a onClick="return mV(\'2Sa\',1,10);">2Sa 1:10</a>), but in <a onClick="return mV(\'Isa\',3,20);">Isa 3:20</a> another word from the same root "ankle chains" (the King James Version "ornaments of the legs"). Compare <a href="./study/isbe/search.html?string=ANKLET">ANKLET</a> (<a onClick="return mV(\'Isa\',3,18);">Isa 3:18</a>).``1';
isbe[538]='Anklet; Ankle-Chain`an\'-klet, an\'-k\'-l-chan: "Anklets" is rightly found in <a onClick="return mV(\'Isa\',3,18);">Isa 3:18</a> the Revised Version (British and American), and "ankle-chains" in <a onClick="return mV(\'Num\',31,50);">Nu 31:50</a> the Revised Version (British and American). A cognate word of essentially the same meaning is used in <a onClick="return mV(\'Isa\',3,20);">Isa 3:20</a>, and is rendered by the King James Version "ornaments of the legs." It was these "anklets" that Isaiah represented the ladies of Jerusalem as "rattling" as they walked (<a onClick="return mV(\'Isa\',3,16);">Isa 3:16</a> to end), "making a tinkling with their feet"; and a part of the punishment threatened is, "The Lord will take away the bravery of their tinkling ornaments about their feet" (<a onClick="return mV(\'Isa\',3,16);">Isa 3:16</a> the King James Version).``1';
isbe[539]='Anna`an\'-a (Anna (Westcott-Hort, Hanna; see Intro, 408); Hebrew equivalent channah, signifying "grace" <a onClick="return mV(\'1Sa\',1,2);">1Sa 1:2</a>):<P>(1) The wife of Tobit (Tobit 1:9).<P>(2) A "prophetess," daughter of Phanuel, of the tribe of Asher, and thus a Galilean, living in Jerusalem at the time of Jesus\' birth (<a onClick="return mV(\'Luk\',2,\'36-38\');">Lu 2:36-38</a>). "Of a great age," she must have been considerably over 100 years, having been a widow 84 years after a short married life of seven (see the Revised Version (British and American)). Exceptionally devout and gifted in spirit, she worshipped so constantly "with fastings and supplications night and day," that she is said to have "departed not from the temple." Some have mistakenly supposed that this signified permanent residence in the temple. The fact that her lineage is recorded indicates the distraction of her family. Tradition says that the tribe of Asher was noted for the beauty and talent of its women, who for these gifts, were qualified for royal and high-priestly marriage. While the tribe of Asher was not among the tribes that returned from the Babylonian exile to Palestine, many of its chief families must have done so as in the case of the prophetess. The period of war and national oppression, through which Anna\'s early life was passed, created in her, as in the aged Simeon, an intense longing for the "redemption" promised through the Messiah. See <a href="./study/isbe/search.html?string=SIMEON">SIMEON</a>. This hope of national deliverance sustained her through more than four decades of patient waiting. In the birth of Jesus her faith was abundantly rewarded, and she became a grateful and ceaseless witness "to all them that were looking for the redemption of Jerusalem," that the day of their spiritual deliverance had come.<P>LITERATURE.<P>See Edersheim, Life and Times of Jesus, I, 200-201, Gelkie, Life and Words of Christ, I, 133-34.``139';
isbe[540]='Annaas`an\'-a-as (Sanaas, 1Esdras 5:23, the Revised Version (British and American) <a href="./study/isbe/search.html?string=SANAAS">SANAAS</a>): The Senaah of <a onClick="return mV(\'Ezr\',2,35);">Ezr 2:35</a>.``1';
isbe[541]='Annas`an\'-as (Annas; Westcott and Hort, The New Testament in Greek Hannas; Josephus Ananos, the Greek form of Hebrew chanan; "merciful," "gracious"; compare <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>, etc.):<P>(1) A high priest of the Jews, the virtual head of the priestly party in Jerusalem in the time of Christ, a man of commanding influence. He was the son of Seth (Josephus: Sethi), and was elevated to the high-priesthood by Quirinius, governor of Syria, 7 AD. At this period the office was filled and vacated at the caprice of the Roman procurators, and Annas was deposed by Valerius Gratus, 15 AD. But though deprived of official status, he continued to wield great power as the dominant member of the hierarchy, using members of his family as his willing instruments. That he was an adroit diplomatist is shown by the fact that five of his sons (Ant., XX, ix, 1) and his son-in-law Caiaphas (<a onClick="return mV(\'Jhn\',18,13);">Joh 18:13</a>) held the high-priesthood in almost unbroken succession, though he did not survive to see the office filled by his fifth son Annas or Ananus II, who caused James the Lord\'s brother to be stoned to death (circa 62 AD). Another mark of his continued influence is, that long after he had lost his office he was still called "high priest," and his name appears first wherever the names of the chief members of the sacerdotal faction are given. <a onClick="return mV(\'Act\',4,6);">Ac 4:6</a>, "And Annas the high priest was there, and Caiaphas, and John, and Alexander, and as many as were of the kindred of the high priest." Annas is almost certainly called high priest in <a onClick="return mV(\'Jhn\',18,19,22);">Joh 18:19, 22</a>, though in <a onClick="return mV(\'Jhn\',18,13,24);">Joh 18:13, 24</a> Caiaphas is mentioned as the high priest. Note especially the remarkable phrase in <a onClick="return mV(\'Luk\',3,2);">Lu 3:2</a>, "in the high-priesthood of Annas and Caiaphas," as if they were joint holders of the office. The cases In which Josephus gives the title "high-priest" to persons who no longer held the office afford no real parallel to this. The explanation seems to be that owing to age, ability and force of character Annas was the virtual, though Caiaphas the titular, high priest. He belonged to the Sadducean aristocracy, and, like others of that class, he seems to have been arrogant, astute, ambitious and enormously wealthy. He and his family were proverbial for their rapacity and greed.<P>The chief source of their wealth seems to have been the sale of requisites for the temple sacrifices, such as sheep, doves, wine and oil, which they carried on in the four famous "booths of the sons of Annas" on the Mount of Olives, with a branch within the precincts of the temple itself. During the great feasts, they were able to extort high monopoly prices for theft goods. Hence, our Lord\'s strong denunciation of those who made the house of prayer "a den of robbers" (<a onClick="return mV(\'Mar\',11,\'15-19\');">Mr 11:15-19</a>), and the curse in the Talmud, "Woe to the family of Annas! Woe to the serpent- like hisses" (Pes 57a). As to the part he played in the trial and death of our Lord, although he does not figure very prominently in the gospel narratives, he seems to have been mainly responsible for the course of events. Renan\'s emphatic statement is substantially correct, "Annas was the principal actor in the terrible drama, and far more than Caiaphas, far more than Pilate, ought to bear the weight of the maledictions of mankind" (Life of Jesus). Caiaphas, indeed, as actual high priest, was the nominal head of the Sanhedrin which condemned Jesus, but the aged Annas was the ruling spirit. According to <a onClick="return mV(\'Jhn\',18,12,13);">Joh 18:12-13</a>, it was to him that the officers who arrested Jesus led Him first. "The reason given for that proceeding ("for he was father-in-law of Caiaphas") lays open alike the character of the man and the character of the trial" (Westcott, in the place cited). Annas (if he is the high priest of <a onClick="return mV(\'Jhn\',18,\'19-23\');">Joh 18:19-23</a>, as seems most likely) questioned Him concerning His disciples and teaching. This trial is not mentioned by the synoptists, probably because it was merely informal and preliminary and of a private nature, meant to gather material for the subsequent trial. Failing to elicit anything to his purpose from Jesus, "Annas therefore sent him bound unto Caiaphas the high priest" (<a onClick="return mV(\'Jhn\',18,24);">Joh 18:24</a> the King James Version is incorrect and misleading) for formal trial before the Sanhedrin, "but as one already stamped with a sign of condemnation" (Westcott). Doubtless Annas was present at the subsequent proceedings, but no further mention is made of him in New Testament, except that he was present at the meeting of the Sanhedrin after Pentecost when Peter and John defended themselves for preaching the gospel of the resurrection (<a onClick="return mV(\'Act\',4,6);">Ac 4:6</a>).<P>(2) Head of a family who returned with Ezra (1Esdras 9:32), called "Harim" in <a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>.``49';
isbe[542]='Annis`an\'-is (the King James Version Ananias; the Revised Version, margin Annias, Anneis Codex Vaticanus, Annias Codex Alexandrinus): The name of a family in the list of the returning exiles (1Esdras 5:16). The name is not given in the parallel list in Ezra and Nehemiah.``1';
isbe[543]='Annul; Disannul`a-nul\', dis-a-nul\':God, as the Supreme Ruler, can disannul His covenant for cause (<a onClick="return mV(\'Isa\',28,18);">Isa 28:18</a>); man, through willfulness and transgression, as party of the second part, may break the contract and thus release Yahweh, as party of the first part (<a onClick="return mV(\'Job\',40,8);">Job 40:8</a>; <a onClick="return mV(\'Isa\',14,27);">Isa 14:27</a>), though there are some purposes and laws which the Almighty will carry out in spite of ungodly rage and ravings (<a onClick="return mV(\'Gal\',3,15);">Ga 3:15</a> the King James Version); or an old law or covenant might be conceived as disannulled by a new one (<a onClick="return mV(\'Gal\',3,17);">Ga 3:17</a>), or because of its becoming obsolete and ineffective (<a onClick="return mV(\'Hbr\',7,18);">Heb 7:18</a>). For the first idea, the Hebrew employs kaphar = "to cover," "to expiate," "condone," "placate," "cancel," "cleanse," "disannul," "purge," "put off" (<a onClick="return mV(\'Isa\',28,18);">Isa 28:18</a>); and the Greek (<a onClick="return mV(\'Gal\',3,15);">Ga 3:15</a>), atheteo = "to set aside," "disesteem," "neutralize," "violate," "frustrate." One covenant disannulling another by "conflict of laws" is expressed by akuroo, "to invalidate," "disannul," "make of no effect." Atheteo is employed to express also the disannulling through age and disuse (<a onClick="return mV(\'Hbr\',7,18);">Heb 7:18</a>).``77';
isbe[544]='Annus`an\'-us (A, Annous, B, Anniouth; the King James Version Anus = Bani, <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>): One of the Levites who interpreted the law to the people (1Esdras 9:48).``1';
isbe[545]='Annuus`an\'-u-us (Announos): Returned with Ezra from Babylon to perform the functions of a priest in Jerusalem (1Esdras 8:48). Omitted in <a onClick="return mV(\'Ezr\',8,19);">Ezr 8:19</a>.``1';
isbe[546]='Anoint; Anointed`a-noint\', a-noint\'-ed (aleipho, chrio): Refers to a very general practice in the East. It originated from the relief from the effect of the sun that was experienced in rubbing the body with oil or grease. Among rude people the common vegetable or animal fat was used. As society advanced and refinement became a part of civilization, delicately perfumed ointments were used for this purpose. Other reasons soon obtained for this practice than that stated above. Persons were anointed for health (<a onClick="return mV(\'Mar\',6,13);">Mr 6:13</a>), because of the widespread belief in the healing power of oil. It was often employed as a mark of hospitality (<a onClick="return mV(\'Luk\',7,46);">Lu 7:46</a>); as a mark of special honor (<a onClick="return mV(\'Jhn\',11,2);">Joh 11:2</a>); in preparation for social occasions (<a onClick="return mV(\'Rth\',3,3);">Ru 3:3</a>; <a onClick="return mV(\'2Sa\',14,2);">2Sa 14:2</a>; <a onClick="return mV(\'Isa\',61,3);">Isa 61:3</a>). The figurative use of this word (chrio) has reference strictly to the coming of the Holy Spirit upon the individual (<a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a>; <a onClick="return mV(\'Act\',4,27);">Ac 4:27</a>; <a onClick="return mV(\'Act\',10,38);">10:38</a>). In this sense it is God who anoints (<a onClick="return mV(\'Hbr\',1,9);">Heb 1:9</a>; <a onClick="return mV(\'2Cr\',1,21);">2Co 1:21</a>). The thought is to appoint, or qualify for a special dignity, function or privilege. It is in this sense that the word is applied to Christ (<a onClick="return mV(\'Jhn\',1,41);">Joh 1:41</a> m; <a onClick="return mV(\'Act\',4,27);">Ac 4:27</a>; <a onClick="return mV(\'Act\',10,38);">10:38</a>; <a onClick="return mV(\'Hbr\',1,9);">Heb 1:9</a>; compare <a onClick="return mV(\'Psa\',2,2);">Ps 2:2</a>; <a onClick="return mV(\'Dan\',9,25);">Da 9:25</a>).`<a href="./study/isbe/search.html?string=ANOINTING">ANOINTING</a>`87';
