press, of the newspaper, now even of the atom" (Orr, God\'s Image in Man, 84). And yet, in spite of this very wide and far-reaching application of theory, the factors that enter into the process, the method or methods by which the great results in this process are obtained, may still be considered as under debate. Its application to the Bible doctrine of man presents serious difficulties.<P>1. Darwinism:<P>Darwin\'s argument may be presented in the following form. In Nature around us there is to be observed a struggle for existence, to which every organism is exposed, whereby the weaker ones are eliminated and the stronger or best-fitted ones made to survive. Those so surviving may be said metaphorically to be chosen by Nature for that purpose—hence the term "natural selection," assisted in the higher forms of life by "sexual selection," under the influence of which the best-organized males are preferred by the females, and thus as it were selected for propagation of the species. The properties or characteristics of the organisms so chosen are transmitted to their descendants, so that with indefinite variability "from a few forms or from one, into which life has been originally breathed, endless forms most beautiful and most wonderful have been, or are being evolved" (Origin of Species, 6th ed., 429). Applying this mode of procedure to the origin of man, the strength of the argument is found to lie in the analogies between man and the brute, which may be summed up as follows:<P>(1) morphological peculiarities in the structure of the bodily organs, in their liability to the same diseases, in their close similarity as regards tissues, blood, etc.;<P>(2) embryological characteristics, in the development of the human being, like the brute, from an ovule, which does not differ from and passes through the same evolutionary process as that of any other animal;<P>(3) the existence of rudimentary organs, which are considered to be either absolutely useless, in some cases harmful, often productive of disease, or in any case of very slight service to the human being, pointing back therefore—so it is maintained—to an animal ancestry, in which these organs may have been necessary;<P>(4) mental peculiarities of the same character, but perhaps not of the same range, in the brute as in man though the differences between the two may be as great as between "a terrier and a Hegel, a Sir William Hamilton, or a Kant";<P>(5) paleontological agreements, to show that a comparison of fossil remains brings modern civilized man and his primeval, anthropoid ancestor into close correspondence. Latterly Friedenthal\'s experiments, in regard to blood- transfusion between man and the ape, have been introduced into the argument by evolutionists.<P>2. Difficulties:<P>The difficulties which beset theory are so great that naturalists of repute have subjected it to very severe criticism, which cannot be disregarded. Some, like Du Bois-Reymond, have openly declared that supernaturalism has gained the day "es scheint keine andere Ausnahme ubrig zu sein, als sich dem Supranaturalismus in die Arme zu werfen" (compare Bavinck, Gereformeerde Dogmatik, II, 548). Others, like Virchow, have to the last pronounced against Darwinism as an established hypothesis, and a simian ancestry as an accepted fact "auf dem Wege der Speculation ist man zu der Affen-Theorie gekommen: man hatte eben so gut zu anderen theromorphischen Theorien kommen konnen, z. B. zu einer Elefanten-Theorie, oder zu einer Schaf-Theorie"—i.e. one might as well speak of an elephant- theory or a sheep-theory or any other animal-theory as of an ape-theory. This was in 1892. When two years later the discovery of the so-called pithecanthropus erectus, supposed to be the "missing link" between man and the lower animals, came under discussion, Virchow held as strongly, that "neither the pithecanthropus nor any other anthropoid ape showed any of the characteristics of primeval man." This was in 1896.<P>The difference of opinion among scientists on this point seems to be great. While Darwin himself uncompromisingly held to the simian ancestry of man, several of his followers reject that line of descent altogether. This may be seen in the Cambridge volume, dedicated to the memory of the British naturalist. Schwalbe, while instancing Cope, Adloff, Klaatsch and others as advocating a different ancestry for man, acknowledges, though reluctantly, that "the line of descent disappears in the darkness of the ancestry of the mammals," and is inclined to admit that "man has arisen independently" (Darwinism and Modern Science, 134). Two things therefore are clear, namely, that modern science does not endorse the favorite maxim of Darwin, Natura non facit saltum, "Nature does not make a jump," with which according to Huxley he "has unnecessarily hampered himself" (Lay Sermons, 342), and that "man probably arose by a mutation, that is, by a discontinuous variation of considerable magnitude" (J. A. Thomson, Darwinism and Human Life, 123). Granted therefore an ascent In the scale of evolution by "leaps" or "lifts," the words of Otto (Naturalism and Religion, 133) receive a new meaning for those who accept as historic the tradition recorded in the early chapters of Genesis: "There is nothing against the assumption, and there is much to be said in its favor, that the last step, or leap, was such an immense one, that it brought with it a freedom and richness of psychical life incomparable with anything that had gone before."<P>3. Objections:<P>The objections raised against the Darwinian theory are in the main threefold:<P class="in15">(1) its denial of teleology, for which it substitutes natural selection;<P class="in15">(2) its assumption, that the evolutionary process is by slow and insensible gradations;<P class="in15">(3) its assertion, that organic advance has been absolutely continuous from the lowest form to the highest (Orr, God\'s Image in Man, 108). This may be illustrated a little more fully:<P>(1) Chance Versus Creation.<P>The denial of teleology is clear and distinct, though Professor Huxley has spoken of a "wider teleology," by which however he simply meant (Critiques and Addresses, 305) that the teleologist can defy his opponent to prove that certain changes in structure were not intended to be produced. In Darwinism the choice seems to he between chance and creation. Mind, purpose, forethought, intention, Divine guidance and super-intendence are banished from the evolutionary process. Darwin himself, though originally inclined to call in the aid of a creator (Origin of Species, 6th edition, 429), regretted afterward, that he "had truckled to public opinion and used the pentateuchal term, by which he really meant appearance by some wholly unknown process" (Life and Letters, III, 18).<P>Admittedly, Darwin attributed too great a power to natural selection. He himself in the Descent of Man considered it "one of the greatest oversights" in his work, that "he had not sufficiently considered the existence of many structures which are neither beneficial nor injurious," and that he had "probably attributed too much to the action of natural selection on the survival of the fittest" (Descent of Man (2nd ed.), 61). Dr. A. R. Wallace, though like Darwin acknowledging the potency of natural selection, considers its operations to be largely negative. Writing to his friend he says: "Nature does not so much select special varieties, as exterminate unfavorable ones" (Darwin\'s Life and Letters, III, 46). It is this very insistence on a method of advance by slow and imperceptible gradations that has met with strong opposition from the very beginning. "Natural selection" Darwin writes, "acts solely by accumulating slight, successive, favorable variations; it can produce no great or sudden modifications; it can only act by short and slow steps" (Origin of Species (6th ed.), chapter 15). The process therefore according to Darwin is wholly fortuitous. This non-teleological aspect of Darwinism is characteristic of many treatises on evolution.<P>Weismann states with great clearness and force, that the philosophical significance of theory lies in the fact that "mechanical forces" are substituted for "directive force" to explain the origin of useful structures. Otto speaks of its radical opposition to teleology. And yet an ardent supporter of Darwinism, Professor J. A. Thomson, admits that "there is no logical proof of the doctrine of descent" (Darwinism and Human Life, 22)—a statement which finds its counterpart in Darwin\'s letters: "We cannot prove that a single species has changed" (Life and Letters, III, 25). Still more clearly, almost epigrammatically this is endorsed by Professor J. A. Thomson: "The fact of evolution forces itself upon us: the factors elude us" (Bible of Nature, 153), and again: "Natural selection explains the survival of the fittest, not the arrival of the fit" (ib 162). Still more extraordinary is the view expressed by Korchinsky that struggle "prevents the establishment of new variations and in reality stands in the way of new development. It is rather an unfavorable than advantageous factor" (Otto, Nature and Religion, 182). We are in fact being slowly led back to the teleology which by Darwin was considered fatal to his theory. Scientists of some repute are fond of speaking of directive purpose. "Wherever we tap organic nature," says Professor J. A. Thomson, "it seems to flow with purpose" (Bible of Nature, 25); and again, "If there is Logos at the end (of the long evolutionary process ending in man) we may be sure it was also at the beginning" (ib 86).<P>Where there is purpose there must be mind working with purpose and for a definite end; where there is mind there may be creation at the beginning; where creation is granted, an overruling Providence may be accepted. If natural selection "prunes the growing tree"; if it be "a directive, not an originative factor" (J. A. Thomson, Darwinism and Human Life, 193); if it produces nothing, and the evolutionary process is dependent upon forces which work from within and not from without, then surely the Duke of Argyll was right in maintaining (Unity of Nature, 272) that "creation and evolution, when these terms have been cleared from intellectual confusion, are not antagonistic conceptions mutually exclusive. They are harmonious and complementary." The ancient narrative, therefore, which posits God at the beginning, and ascribes the universe to His creative act, is after all not so unscientific as some evolutionists are inclined to make out.<P>(2) Variability Indefinite.<P>Indefinite variability, assumed by theory, is not supported by fact. Development there doubtless is, but always within carefully defined limits: at every stage the animal or plant is a complete and symmetrical organism, without any indication of an everlasting progression from the less to the more complex. Reversion to type seems ever to have a development proceeding indefinitely, and the sterility of hybrids seems to be Nature\'s protest against raising variability into a law of progression. It has been repeatedly pointed out, that variations as they arise in any organ are not of advantage to its possessor: "A very slight enlarged sebaceous follicle, a minute pimple on the nose of a fish, a microscopic point of ossification or consolidation amongst the muscles of any animal could (hardly) give its possessor any superiority over its fellows" (Elam, Winds of Doctrine, 128).<P>(3) Existing Gaps.<P>Nor can it be denied that no theory of evolution has been able to bridge the chasms which seem to exist between the various kingdoms in Nature. A gradual transition from the inorganic to the organic, from the vegetable to the animal kingdom, from one species of plant or animal to another species, from the animal to man, is not found in Nature. This is acknowledged by scientists of repute. Du Bois-Reymond has maintained that there are seven great enigmas, indicating a sevenfold limit to investigation, namely,<P>(a) the existence of matter and force;<P>(b) the origin of motion;<P>(c) the origin of life;<P>(d) the appearance of design in Nature;<P>(e) the existence of consciousness;<P>(f) intelligent thought and the origin of speech;<P>(g) the question of freewill.<P>Others have found equally serious difficulties in a theory of descent which ignores the existence of such gaps. Thus, Dr. A. R. Wallace—a strong upholder of theory of natural selection—allows that "there are at least three stages in the development of the organic world, when some new cause or power must necessarily have come into action," namely, at the introduction of life, at the introduction of sensation and consciousness and at the introduction of man" (Darwinism, 474-75).<P>(4) Applied to Man.<P>When theory is applied to the human species the difficulties are enormously increased. Psychically, man is akin to, yet vastly different from, the brute. Consciousness, thought, language (called by Max Muller "the Rubicon" between the human and the animal world), morality, religion cannot easily be explained under any theory of evolution. The recognition of moral obligations, the freedom of choice between moral alternatives, the categorical imperative of conscience, the feeling of responsibility and the pain of remorse are unaccounted for by the doctrine of descent. Man stands apart, forming psychologically a kingdom by himself, "infinitely divergent from the simian stirps" (Huxley, Man\'s Place in Nature, 103)—the riddle of the universe, apart from the Biblical narrative. In the very nature of things the conscious and the unconscious he far apart. "The assertion of the difference between them does not rest on our ignorance, but on our knowledge of the perceived distinction between material particles in motion and internal consciousness related to a self" (Orr, Homiletic Review, August, 1907).<P>There can be no transition from the one to the other. The "gulf" remains in spite of all attempts to bridge it. Strong supporters of Darwinism have acknowledged this. Thus Dr. A. R. Wallace, though vigorously maintaining the "essential identity of man\'s bodily structure with that of the higher mammals and his descent from some ancestral form common to man and the anthropoid apes," discards theory that "man\'s entire nature and all his faculties, moral, intellectual, spiritual, have been derived from their rudiments in lower animals"—a theory which he considers unsupported by adequate evidence and directly opposed to many well-ascertained facts (Darwinism, 461; Natural Selection, 322 f.).<P>(5) Transitional Forms Absent.<P>The absence of transitional forms is another difficulty which strikes at the very root of Darwinism. Zittel, a paleontologist of repute, endorsed the general opinion, when in 1895 at Zurich he declared, that the extinct transitional links are slowly not forthcoming, except in "a small and ever-diminishing number." The derivation of the modern horse from the "Eohippus," on which great stress is sometimes laid, can hardly be accepted as proved, when it is maintained by scientists of equal repute, that no "Eohippus," but Palaeotherium was the progenitor of the animal whose ancestry is in dispute. And as for man, the discovery by Dr. E. Du Bois, in the island of Java, of the top of a skull, the head of a leg bone, few teeth of an animal supposed to be a man-like mammal, does not convey the absolute proof demanded. From the very first, opinion was strangely divided among naturalists.<P>Virchow doubted whether the parts belonged to the same individual, and considered Du Bois\' drawings of the curves of a skull-outline to prove the gradual transition from the skull of a monkey to that of a man as imaginary. Of twenty-four scientists, who examined the remains when originally presented, ten thought they belonged to an ape, seven to a man, seven to some intermediate form (Otto, Naturalism and Religion, 110). At the Anthropological Congress held at Lindau in September,1899,"Dr. Bumiller read a paper in which he declared that the supposed \'pithecanthropus erectus\' is nothing but a gibbon, as Virchow surmised from the first" (Orr, in The Expositor, July, 1910).<P>4. The New Evolutionism:<P>Evolutionism apparently is undergoing a great change. Among others Fleischmann, and Dennert in Germany have submitted Darwinism to a keen and searching criticism. The latter especially, as a scientist, raises a strong protest against the acceptance of the Darwinian theory, He closes his researches with the remarkable words: "The theory of descent is accepted by nearly all naturalists. But in spite of assertions to the contrary, theory has not yet been fully (ganz unzweifelhaft) proved....Darwinism on the other hand, i.e. the doctrine of natural selection through struggle for existence, has been forced back all along the line" (vom Sterbelager des Darwinismus, 120). With equal vigor Professor Hugo de Vries, of Amsterdam, has recently taught a "theory of mutation," a term applied by him to "express the process of origination of a new species, or of a new specific character, when this takes place by the discontinuous method at a single step" (Lock, Recent Progress in the Study of Variation, 113). New species, according to De Vries, may arise from old ones by leaps, and this not in long-past geological times, but in the course of a human life and under our very eyes. This theory of "halmatogenesis," or evolution by leaps and not by insensible gradations, was not unknown to scientists.<P>Lyell, who was a slow convert to Darwinism, in his Antiquity of Man, admitted the possibility of "occasional strides, breaks in an otherwise continuous series of psychical changes, mankind clearing at one bound the space which separated the highest stage of the unprogressive intelligence of inferior animals from the first and lowest form of improvable reason of man." Even Professor Huxley, one of the staunchest supporters of Darwinism, acknowledged that "Nature does make jumps now and then," and that "a recognition of the fact is of no small importance in disposing of many minor objections to the doctrine of transmutation" (Orr, God\'s Image in Man, 116). Less conciliatory than either De Vries or Huxley is Eimer, who, while repudiating the "chance" theory of Darwinism, sets against it "definitely directed evolution," and holds that "natural selection is insufficient in the formation of species" (Otto, Naturalism and Religion, 174). Evidently the evolution theory is undergoing modifications, which may have important bearing on the interpretation of the Mosaic narrative of creation and especially on the descent of man. Man may therefore, from a purely scientific point of view, be an entirely new being, not brought about by slow and gradual ascent from a simian ancestry. He may have been introduced at a bound, not as a semi-animal with brute impulses, but as a rational and moral being, "internally harmonious, with possibilities of sinless development, which only his free act annulled." If the new theory of "mutational" evolution be accepted, the scriptural view of man\'s origin will certainly not be discredited.<P>5. Evolution and Genesis:<P>This much may fairly be granted, that within certain limits Scripture accepts an evolutionary process. In regard to the lower animals the creating (<a onClick="return mV(\'Gen\',1,21);">Ge 1:21</a>), or making (<a onClick="return mV(\'Gen\',1,28);">Ge 1:28</a>), is not described as an immediate act of Almighty Power, but as a creative impulse given to water and earth, which does not exclude, but rather calls into operation the powers that are in the sea and dry land (<a onClick="return mV(\'Gen\',1,11,20,24);">Ge 1:11, 20, 24</a> the King James Version): "And God said, Let the earth bring forth grass...Let the waters bring forth abundantly the moving creature." It is only in the creation of man that God works immediately: "And God said, Let us make man in our image...And God created man" (<a onClick="return mV(\'Gen\',1,26,27);">Ge 1:26-27</a>). The stride or jump of Lyell and Huxley, the "halmatogenesis" of De Vries are names which in the simple narrative disappear before the pregnant sentence: "And God said." Theologians of repute have given a theistic coloring to the evolution theory (compare Flint, Theism, 195 f.), inasmuch as development cannot be purposeless or causeless, and because "Nature is but effect whose cause is God." The deathblow which, according to Professor Huxley, the teleological argument has received from Darwin, may after all not be so serious. At any rate Lord Kelvin (Sir William Thomson) in 1871 before the British Association openly pleaded for "the solid and irrefragable argument so well put forward by Paley...teaching us, that all living things depended upon an everacting Creator and Ruler." See <a href="./study/isbe/search.html?string=EVOLUTION">EVOLUTION</a>.<P>VI. Primitive and Present Conditions of Man: Antiquity of Man.<P>1. The Time-Distance of Man\'s Origin:<P>The newer anthropology has carried the human race back to a remote antiquity. Ordinary estimates range between 100,000 and 500,000 years. Extraordinary computations go far beyond these numbers. Haeckel, e.g. speaks of "Sirius distances" for the whole evolutionary process; and what this means may easily be conjectured. The sun is 92,700,000 miles away from the earth, and Sirius is a million times as far from us as we are from the sun, so that the time-distance of man from the very lowest organisms, from the first germ or seed or ovule, is according to Haeckel almost incalculable. The human race is thus carried back by evolutionists into an immeasurable distance from the present inhabitants of the earth. Several primeval races are by some declared to have existed, and fossil remains of man are supposed to have been found, bringing him into touch with extinct animals.<P>The time-computations of evolutionists, however, are not shared by scientists in general. "These millionaires in time have received a rude blow, when another Darwin, Sir G. H. Darwin of Cambridge, demonstrated that the physical conditions were such that geology must limit itself to a period of time inside of 100,000 years" (Orr, God\'s Image, etc., 176). Professor Tait of Edinburgh limited the range to no more than 10,000,000 years and he strongly advised geologists to "hurry up their calculations." "I dare say," he says, "many of you are acquainted with the speculations of Lyell and others, especially of Darwin, who tells us, that even for a comparatively brief portion of recent geological history, three hundred millions of years will not suffice! We say, so much the worse for geology as at present understood by its chief authorities" (Recent Advances in Physical Science, 168). Recently, however, attention has been drawn to new sources of energy in the universe as the result of radio-activity.<P>Duncan, in The New Knowledge, contrasts the old conception, according to which God made the universe and started it at a definite time to run its course, with the need, which though it does not distinctly teach, at least is inclined to maintain, that the universe is immortal or eternal, both in the future and the past (p. 245). If this view be correct the Darwinian "eons" of time may be considered restored to the evolutionist. On the other hand it appears that Lord Kelvin seriously doubted the validity of these speculations. Professor Orr writes: "In a personal communication Lord Kelvin states to me that he thinks it \'almost infinitely improbable\' that radium had any appreciable effects on the heat and light of the earth or sun, and suggests it as \'more probable that the energy of radium may have come originally in connection with the excessively high temperatures\' produced by gravitational action" (Homiletic Review, August, 1906).<P>2. Antiquity of Primeval Man:<P>In regard to primeval man there is no agreement among scientists. Some, like Delaunay, de Mortillet, Quatrefages, believed that man existed in the Tertiary; while others, such as Virchow, Zittel, Prestwich, Dawson, maintain that man appeared on the scene only in the Quaternary. As the limits between these periods are not well defined a decision is by no means easy. Even if man be found to have been a contemporary of extinct animals, such as the mammoth, the inference from this fact would be equally just, not that man is as old as the extinct animal, but that the animal is as young as man and that the period assigned to these fossil remains must be brought considerably nearer to present-day life.<P>3. Various Calculations:<P>Calculations based on the gravels of the Somme, on the cone of the Tiniere, on the peat-bogs of France and Denmark, on fossil bones discovered in caves of Germany and France, on delta-formations of great rivers like the Nile and the Mississippi, on the "kitchen middings" of Denmark, and the lake-dwellings of Switzerland, must be carefully scrutinized. Sir J. W. Dawson, a geologist of great repute, has made the deliberate statement, that "possibly none of these reach farther back than six or seven thousand years, which according to Dr. Andrews have elapsed since the close of the boulder-clay in America," and that "the scientific pendulum must swing backward in this direction" (Story of the Earth and Man, 293). The "ice-age," formerly hypothetically calculated, has latterly been brought within calculable distance. G. F. Wright, Winchell and others have arrived at the conclusion that the glacial period in America, and consequently in Europe, does not lie more than some eight or ten thousand years behind us.<P>If such be the case, the antiquity of man is brought within reasonable limits, and may consequently not be in contradiction to the Biblical statements on this point. If the careful and precise calculations of Dr. Andrews on the raised beaches of Lake Michigan are accepted, then North America must have risen out of the waters of the Glacial period some 5,500 or 7,500 years ago; and if so, the duration of the human period in that continent is fixed and must be considerably reduced (Dawson, Story, etc., 295). One of the latest deliverances on this subject is that of Professor Russell of the University of Michigan (1904), who maintains that "we find no authentic and well-attested evidence of the presence of man in America either previous to or during the Glacial period." He is confident, that "all the geological evidence thus far gathered bearing on the antiquity of man in America points to the conclusion that he came after the Glacial epoch." Where all is vague and experts differ great caution is necessary in the arrangement of dates and periods of time. If moreover a comparatively rapid post-glacial submergence and reelevation is accepted, as some naturalists hold, and man were then on the earth, the question may fairly be asked, whether this subsidence did not "constitute the deluge recorded in that remarkable \'log-book\' of Noah preserved to us in Gen" (Dawson, op. cit., 290).<P>4. Chronology:<P>The chronology of ancient nations—China, Babylon, Egypt—has been considered as subversive of the scriptural view as to the age of the human race. But it is a well-known fact, that experts differ very seriously upon the point. Their calculations range, for Egypt—starting from the reign of King Menes—from 5,867 (Champollion) to 4,455 (Brugsch), and from 3,892 (Lepsius) to 2,320 (Wilkinson). As to Babylon Bunsen places the starting-point for the historic period in 3,784, Brandis in 2,458, Oppert in 3,540—a difference of thousands of years (compare Bavinck, Geref. Dogmatik, II, 557). Perhaps here, too, future research will bring the scientific and the Biblical view into fuller harmony. At any rate, Hommel\'s words on all these calculations require careful study: "The chronology for the first thousand years before Christ is fairly fixed: in the second thousand BC some points seem to be fixed: in the third thousand, i.e. before 2000 BC, all is uncertain." In this connection it may be mentioned, that attempts have frequently been made to cast discredit on the chronology of the early chapters of Genesis. Suffice it to say that the calculations are based on the genealogies of the patriarchs and their descendants, and that the generally accepted dates assigned to them by Archbishop Ussher and introduced into the margins of some editions of the Bible are not to be trusted. The Septuagint differs in this respect from the Hebrew text by more than 1,500 years: precise chronological data are not and cannot be given. The basis of calculation is not known. Perhaps we are not far wrong in saying that, "if we allow, say, from 12,000 to 15,000 years since the time of man\'s first appearance on the earth, we do ample justice to all the available facts" (Orr, God\'s Image, etc., 180). See <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+OLD+TESTAMENT">CHRONOLOGY OF THE OLD TESTAMENT</a>.<P>5. Man\'s Primitive Condition: That all these discussions have a bearing upon our view of man\'s primitive conditions can easily be understood. According to Scripture man\'s destiny was to \'replenish the earth, and subdue it; and have dominion over fish, fowl and every living thing\' (<a onClick="return mV(\'Gen\',1,28);">Ge 1:28</a>), as God\'s steward (oikonomos, <a onClick="return mV(\'Tts\',1,7);">Tit 1:7</a>), as fellow-laborer with God (sunergos, <a onClick="return mV(\'1Cr\',3,9);">1Co 3:9</a>). Hence he was placed by God in the garden of Eden (gan be\'edhen; Septuagint paradeisos tes trophes; Vulgate paradisus voluptatis, "paradise of delight"). The situation of that garden is carefully described, though the proper site remains unknown (<a onClick="return mV(\'Gen\',2,14,15);">Ge 2:14-15</a>). Some, like Driver, consider this an ideal locality (Genesis, 57); others take a very wide range in fixing upon the true site. Every continent has been chosen as the cradle of the race—Africa, among others, as the home of the gorilla and the chimpanzee—the supposed progenitors of humanity. In America, Greenland and the regions around the North Pole have had their supporters.<P>Certain parts of Europe have found favor in some quarters. An imaginary island—Lemuria—situated between the African and Australian continents—has been accepted by others. All this, however, lies beyond the scope of science, and beyond the range of Scripture. Somewhere to the east of Palestine, and in or near Babylonia, we must seek for the cradle of humanity. No trace of primeval man has been found, nor has the existence of primeval races been proved. The skulls which have been found (Neanderthal, Engis, Lansing) are of a high type, even Professor Huxley declaring of the first, that "it can in no sense be regarded as the intermediate between Man and the Apes," of the second, that it is "a fair, average skull, which might have belonged to a philosopher, or might have contained the thoughtless brains of a savage" (Man\'s Place in Nature, 156, 157). Of the Lansing skeleton found in Kansas, in 1902, this may at least be said—apart from the question as to its antiquity—that the skull bears close resemblance to that of the modern Indian. Even the skull of the Cro-Magnon man, supposed to belong to the paleolithic age, Sir J. W. Dawson considers to have carried a brain of greater size than that of the average modern man (Meeting-Place of Geology and History, 54). Primeval man can hardly be compared to the modern savage; for the savage is a deteriorated representative of a better type, which has slowly degenerated.<P>History does not know of an unaided emergence from barbarism on the part of any savage tribe; it does know of degradation from a better type. Whatever view we take of the original state of man, the following points must be borne in mind: we need not suppose him to have been a humanized ape, rising into true manhood by a slow and gradual process; nor need we picture him either as a savage of pronounced type, or as in every sense the equal of modern man, "the heir of all the ages." Scripture represents him to us as a moral being, "with possibilities of sinless development, which his own free act annulled." There the matter may rest, and the words of a non-canonical Scripture may fitly be applied to him: "God created man to be immortal, and made him to be an image of His own eternity" (The <span class="noTag">Wisdom of Solomon 2:23</span>, the King James Version). See also <a href="./study/isbe/search.html?string=PSYCHOLOGY">PSYCHOLOGY</a>.<P>LITERATURE.<P>Darwin, Origin of Species, Descent of Man; Lock, Recent Progress in the Study of Variation, etc.; A. R. Wallace, Darwinism, Natural Selection; Sir J. W. Dawson, Story of the Earth and Man, Origin of World according to Revelation and Science, Meeting-Place of Geology and History; R. Otto, Naturalism and Religion; Cambridge Memorial vol, Darwin and Modern Science; J. H. Stirling, Darwinianism; J. Young, Evolution and Design; J. Orr, God\'s Image in Man; J. A. Thomson, Bible of Nature, Darwinism and Human Life; Weismann, Essays on Heredity; Bavinck, Gereformeerde Dogmatik; Van Leeuwen. Bijbelsche Anthropologie; Laidlaw, Bible Doctrines of Man; O. Zockler, Vom Urstand des Menschen; A. Fleischmann; Die Darwin\'sche Theorie; E. Dennert, Vom Sterbelager des Darwinismus, Bibel und Naturwissenschaft; Huxley, Man\'s Place in Nature; Herzog, RE, articles "Geist" and "Seele"; Driver, Genesis; Delitzsch, Genesis; Dillmann, Die Genesis, etc., etc.``113';
isbe[559]='Anthropomorphism`an-thro-po-mor\'-fiz\'-m:<P>1. Definition of the Term<P>2. Old Testament Anthropomorphisms<P>3. In What Senses an Anthropomorphic Element Is Necessary<P>4. Anthropomorphism and the Exigencies of Human Thinking<P>5. Anthropomorphism and Theism<P>6. Symbolic Forms of Thought<P>7. Philosophic Pantheism<P>8. Anthropomorphism and Personalized or Mediated Knowledge<P>9. From Greek Polytheism to Modern Ethical Monotheism<P>10. Greek Thought<P>11. Anthropomorphism of Israel<P>12. Twofold Nature of the Anthropomorphic Difficulty<P>13. Need of Rising Higher<P>14. God in Christ the True Solution<hr /><P>1. Definition of the Term:<P>By this term is meant, conformably with its etymological signification, i.e. as being in the form or likeness of man, the attribution to God of human form, parts or passions, and the taking of Scripture passages which speak of God as having hands, or eyes, or ears, in a literal sense. This anthropomorphic procedure called forth Divine rebuke so early as <a onClick="return mV(\'Psa\',50,21);">Ps 50:21</a>: "Thou thoughtest that I was altogether such a one as thyself."<P>2. Old Testament Anthropomorphisms:<P>Fear of the charge of anthropomorphism has had a strangely deterrent effect upon many minds, but very needlessly so. Even that rich storehouse of apparently crude anthropomorphisms, the Old Testament, when it ascribes to Deity physical characters, mental and moral attributes, like those of man, merely means to make the Divine nature and operations intelligible, not to transfer to Him the defects and limitations of human character and life.<P>3. In What Senses an Anthropomorphic Element Is Necessity:<P>In all really theistic forms of religion, there is an anthropomorphic element present, for they all presuppose the psychological truth of a certain essential likeness between God and man. Nor, perfect as we may our theistic idea or conception of Deity, can we, in the realm of spirit, ever wholly eliminate the anthropomorphic element involved in this assumption, without which religion itself were not. It is of the essence of the religious consciousness to recognize the analogy subsisting between God\'s relations to man, and man\'s relations to his fellow. We are warned off from speaking of "the Divine will" or "the Divine purpose," as too anthropomorphic—savoring too much of simple humanity and human psychology—and are bidden speak only of "the Divine immanence" or "the Divine ground of our being."<P>4. Anthropomorphism and the Exigencies of Human Thinking:<P>But these speculative objections really spring from a shallow interpretation of the primary facts of human consciousness, which, in the deepest realm of inner experience, claims the indefeasible right to speak of the Divine nature in human terms, as may best be possible to our being. The proper duty or function of philosophy is to take due account of such direct and primary facts of our nature: the basal facts of our being cannot be altered to suit her convenience.<P>5. Anthropomorphism and Theism:<P>If we were to interpret the impalpable and omni-present Energy, from which all things proceed, in terms of force, then, as Flake said, "there is scarcely less anthropomorphism lurking in the phrase \'Infinite Power,\' than in the phrase \'Infinite Person.\'" Besides which, the soul of man could never be content with the former phrase, for the soul wants more than dynamics. But if we have ascribed to God certain attributes in keeping with the properties of the one Protean force behind all nature-manifestations, it has been to help purge our conception of God of objectionable anthropomorphic elements. The exigencies of human thinking require us to symbolize the nature of Deity in some psychical way whereby He shall have for us some real meaning; hence those quasi-personal or anthropomorphic forms of expression, which inhere in the most perfected conceptions of Deity, as well as in the crude ideas of unreflective spiritism. And if all anthropomorphism could be dissipated by us, we should in the process have demolished theism—a serious enough issue for religion.<P>6. Symbolic Forms of Thought:<P>Even speech has been declared to be a sensuous symbol, which makes knowledge of God impossible. To such an extent have the hyper-critical objections to anthropomorphism been pressed. Symbol of the Divine, speech may, in this sense, be; but it is a symbol whereby we can mark, distinguish or discern the super-sensible. Thus our abstract conceptions are by no means sensuous, however the language may originally have set out from a sensuous significance. Hence, it would be a mistake to suppose that our knowledge of God must remain anthropomorphic in content, and cannot think the Absolute Being or Essence save in symbolic form. It is a developmental law of religion—as of spirit in general—that the spiritual grows always more clearly differentiated from the symbolic and sensuous. The fact that our knowledge of God is susceptible of advance does not make the idea of God a merely relative one. God\'s likeness to man, in respect of the attributes and elements essential to personal spirit, must be presupposed as a fundamental reality of the universe. In this way or sense, therefore, any true idea of God must necessarily be anthropomorphic.<P>7. Philosophic Pantheism:<P>We cannot prove in any direct manner—either psychological or historical—that man was really made in God\'s image. But there is no manner of doubt that, on the other hand, man has always made God in his (man\'s) own image. Man can do no otherwise. Because he has purged his conceptions of Deity after human pattern, and no longer cares much to speak of God as a jealous or repentant or punitive Deity, as the case may be, it yet by no means follows that "the will of God" and "the love of God" have ceased to be of vital interest or primary importance for the religious consciousness. All man\'s constructive powers—intellectual, aesthetical, ethical, and spiritual—combine in evolving such an ideal, and believing in it as the personal Absolute, the Ideal-Real in the world of reality. Even in the forms of philosophic pantheism, the factors which play in man\'s personal life have not ceased to project themselves into the pantheistic conceptions of the cosmic processes or the being of the world.<P>8. Anthropomorphism and Personalized or Mediated Knowledge:<P>But man\'s making of God in his (man\'s) own image takes place just because God has made man in His own image. For the God, whom man makes for himself, is, before all things, real—no mere construction of his intellect, no figure or figment of his imagination, but the prius of all things, the Primal, Originative Reality. Thus we see that any inadequacy springing out of the anthropomorphic character of our religious knowledge or conceptions is not at all so serious as might at first sight be supposed, since it is due merely to the necessarily personalized or mediated character of all our knowledge whatsoever. For all our experience is human experience, and, in that sense, anthropomorphic. Only the most pitiful timidity will be scared by the word "anthropomorphism," which need not have the least deterrent effect upon our minds, since, in the territory of spirit, our conceptions are purged of anthropomorphic taint or hue, the purer our human consciousness becomes.<P>9. From Greek Polytheism to Modern Ethical Monotheism.<P>To say, as we have done, that all knowledge is anthropomorphic, is but to recognize its partial, fallible, progressive or developmental character. It is precisely because this is true of our knowledge of God that our improved and perfected conceptions of God are the most significant feature in the religious progress of humanity. Only in course of the long religious march, wherein thought has shot up through the superincumbent weight of Greek polytheism into monotheism, and emerged at last into the severely ethical monotheism of our time, has religion been gradually stripped of its more crude anthropomorphic vestments. It cannot too clearly be understood that the religious ideal, which man has formed in the conception of the Absolute Personality, is one which is rooted in the realm of actuality. Not otherwise than as a metaphysical unity can God be known by us—intelligible only in the light of our own self- conscious experience.<P>10. Greek Thought:<P>It is a mere modern—and rather unillumined—abuse of the term anthropomorphic which tries to affix it, as a term of reproach, to every hypothetical endeavor to frame a conception of God. In the days of the Greeks, it was only the ascription to the gods of human or bodily form that led Xenophanes to complain of anthropomorphism. This Xenophanes naturally took to be an illegitimate endeavor to raise one particular kind of being—one form of the finite—into the place of the Infinite. Hence he declared, "There is one God, greatest of all gods and men, who is like to mortal creatures neither in form nor in mind."<P>11. Anthropomorphism of Israel:<P>But the progressive anthropomorphism of Greece is seen less in the humanizing of the gods than in the claim that "men are mortal gods," the idea being, as Aristotle said, that men become gods by transcendent merit. In this exaltation of the nature of man, the anthropomorphism of Greece is in complete contrast with the anthropomorphism of Israel, which was prone to fashion its Deity, not after the likeness of anything in the heavens above, but after something in the earth beneath. Certain professors of science have been mainly responsible for the recent and reprehensible use of the term, so familiar to us, for which we owe them no particular gratitude.<P>12. Twofold Nature of the Anthropomorphic Difficulty:<P>The anthropomorphic difficulty is a twofold one. Religion, as we have just shown, must remain anthropomorphic in the sense that we cannot get rid of imputing to the universe the forms of our own mind or life, since religion is rooted in our human experience. As we have already hinted, however, religion is in no worse case in that respect than science. For nothing is more idle than the pretension that science is less anthropomorphic than religion—or philosophy either—as if science were not, equally with these, an outcome and manifestation of human thinking! It is surely most obvious that the scientist, in any knowledge of reality he may gain, can, no more than the religionist—or the metaphysician—jump off his own shadow, or make escape from the toils of his own nature and powers. For knowledge of any sort—whether religious or scientific or philosophical—a certain true anthropomorphism is necessary, for it is of the essence of rationality. Nature, of which science professes a knowledge, is really a man- made image, like unto its human maker. Say what science will, this is the objectively real of science—a cognition which, critically viewed, is only subjectively valid. There is no other way by which science can know the being of the world than after the human pattern. It is, however, a serious issue that this human element or factor has often unduly penetrated the realm of the Divine, subordinating it and dragging it down to human aims and conceptions.<P>13. Need of Rising Higher:<P>Hence arises the second aspect of the anthropomorphic difficulty, which is, the need of freeing religion from anthropomorphic tendency, since it can be no satisfactory revealer of truth, so long as its more or less unrefined anthropomorphism contracts or subjugates reality to the conditions of a particular kind of being. It is perfectly clear that religion, whose every aim is to raise man beyond the limitations of his natural being, can never realize its end, so long as it remains wholly within the human sphere, instead of being something universal, transcendent, and independent. This is precisely why religion comes to give man\'s life the spiritual uplift whereby it rises to a new center of gravity—a true center of immediacy—in the universe, rises, indeed, beyond time and its own finitude to a participation in the universal and transcendent life of the Eternal. It does so without feeling need to yield to the anthropomorphic tendency in our time to attribute a necessity in God for an object to love, as if His egoistic perfection were not capable of realizing love\'s infinite ideal in itself, and without dependence upon such object.<P>14. God in Christ the True Solution:<P>We affirm that God in Christ, in revealing the fact of the likeness of man being eternal in God, disclosed the true anthropomorphism of our knowledge of God—it is with respect to the essential attributes and elements of personal spirit. It is easy to see how the early ascriptions to God of the form and members of the human body, and other non-essential accompaniments of personality, arose. The scriptural representations as to God\'s hand, eye, and ear, were declared by Calvin to be but adaptations to the slow spiritual progress of men—an infantile mode of talk, as Calvin puts it, like that of nurses to children. But we have got finely clear of essential anthropomorphism, if, with <a onClick="return mV(\'Isa\',55,8);">Isa 55:8</a>, we fully recognize that God\'s "thoughts are not" our "thoughts," nor God\'s "ways" our "ways." LITERATURE.<P>E. Caird, Evolution of Religion, 1893; J. Martineau, A Study of Religion, 1889; J. Fiske, The Idea of God, 1901; J. Orr, God\'s Image in Man, 1905; D. B. Purinton, Christian Theism, 1889; J. Lindsay, Recent Advances in Theistic Philosophy of Religion, 1897; Studies in European Philosophy, 1909.``96';
isbe[560]='Anti-Libanus`an-ti-lib\'-a-nus.`<a href="./study/isbe/search.html?string=LEBANON">LEBANON</a>`1';
isbe[561]='Antichrist`an\'-ti-krist (antichristos):<P><b>I. IN THE OLD TESTAMENT</b><P><b>II. IN THE NEW TESTAMENT</b><P class="in15">1. The Gospels<P class="in15">2. Pauline Epistles<P class="in15">3. Johannine Epistles<P class="in15">4. Book of Revelation<P><b>III. IN APOCALYPTIC WRITINGS</b><P><b>IV. IN PATRISTIC WRITINGS</b><P><b>V. MEDIAEVAL VIEWS</b><P class="in15">1. Christian<P class="in15">2. Jewish<p><b/> VI. POST-REFORMATION VIEWS</b><P><b>LITERATURE</b><hr /><P>The word "antichrist" occurs only in <a onClick="return mV(\'1Jo\',2,18,22);">1Joh 2:18, 22</a>; <a onClick="return mV(\'1Jo\',4,3);">4:3</a>; <a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a>, but the idea which the word conveys appears frequently in Scripture.<P>I. In the Old Testament.<P>Antichrist in the Old Testament:<P>As in the Old Testament the doctrine concerning Christ was only suggested, not developed, so is it with the doctrine of the Antichrist. That the Messiah should be the divine Logos, the only adequate expression of God, was merely hinted at, not stated: so Antichrist was exhibited as the opponent of God rather than of His anointed. In the historical books of the Old Testament we find "Belial" used as if a personal opponent of Yahweh; thus the scandalously wicked are called in the King James Version "sons of Belial" (<a onClick="return mV(\'Jdg\',19,22);">Jud 19:22</a>; <a onClick="return mV(\'Jdg\',20,13);">20:13</a>), "daughter of Belial" (<a onClick="return mV(\'1Sa\',1,16);">1Sa 1:16</a>), etc. The the Revised Version (British and American) translates the expression in an abstract sense, "base fellows," "wicked woman." In <a onClick="return mV(\'Dan\',7,7,8);">Da 7:7-8</a> there is the description of a great heathen empire, represented by a beast with ten horns: its full antagonism to God is expressed in a little eleventh horn which had "a mouth speaking great things" and "made war with the saints" (<a onClick="return mV(\'Dan\',7,8,21);">Da 7:8, 21</a>). Him the \'Ancient of Days\' was to destroy, and his kingdom was to be given to a \'Son of Man\' (<a onClick="return mV(\'Dan\',7,\'9-14\');">Da 7:9-14</a>). Similar but yet differing in many points is the description of Antiochus Epiphanes in <a onClick="return mV(\'Dan\',8,\'9-12\',\'23-25\');">Da 8:9-12, 23-25</a>.<P>II. In the New Testament.<P>1. The Gospels:<P>In the Gospels the activity of Satan is regarded as specially directed against Christ. In the Temptation (<a onClick="return mV(\'Mat\',4,\'1-10\');">Mt 4:1-10</a>; <a onClick="return mV(\'Luk\',4,\'1-13\');">Lu 4:1-13</a>) the Devil claims the right to dispose of "all the kingdoms of the world," and has his claim admitted. The temptation is a struggle between the Christ and the Antichrist. In the parable of the Tares and the Wheat, while He that sowed the good seed is the Son of Man, he that sowed the tares is the Devil, who is thus Antichrist (<a onClick="return mV(\'Mat\',13,\'37-39\');">Mt 13:37-39</a>). our Lord felt it the keenest of insults that His miracles should be attributed to Satanic assistance (<a onClick="return mV(\'Mat\',12,\'24-32\');">Mt 12:24-32</a>). In <a onClick="return mV(\'Jhn\',14,30);">Joh 14:30</a> there is reference to the "Prince of the World" who "hath nothing" in Christ.<P>2. Pauline Epistles:<P>The Pauline epistles present a more developed form of the doctrine. In the spiritual sphere Paul identifies Antichrist with Belial. "What concord hath Christ with Belial?" (<a onClick="return mV(\'2Cr\',6,15);">2Co 6:15</a>). 2 Thessalonians, written early, affords evidence of a considerably developed doctrine being commonly accepted among believers. The exposition of <a onClick="return mV(\'2Th\',2,\'3-9\');">2Th 2:3-9</a>, in which Paul exhibits his teaching on the \'Man of Sin,\' is very difficult, as may be seen from the number of conflicting attempts at its interpretation. See <a href="./study/isbe/search.html?string=MAN+OF+SIN">MAN OF SIN</a>. Here we would only indicate what seems to us the most plausible view of the Pauline doctrine. It had been revealed to the apostle by the Spirit that the church was to be exposed to a more tremendous assault than any it had yet witnessed. Some twelve years before the epistle was penned, the Roman world had seen in Caligula the portent of a mad emperor. Caligula had claimed to be worshipped as a god, and had a temple erected to him in Rome. He went farther, and demanded that his own statue should be set up in the temple at Jerusalem to be worshipped. As similar causes might be expected to produce similar effects, Paul, interpreting "what the Spirit that was in him did signify," may have thought of a youth, one reared in the purple, who, raised to the awful, isolating dignity of emperor, might, like Caligula, be struck with madness, might, like him, demand Divine honors, and might be possessed with a thirst for blood as insatiable as his. The fury of such an enthroned maniac would, with too great probability, be directed against those who, like the Christians, would refuse as obstinately as the Jews to give him Divine honor, but were not numerous enough to make Roman officials pause before proceeding to extremities. So long as Claudius lived, the Antichrist manifestation of this "lawless one" was restrained; when, however, the aged emperor should pass away, or God\'s time should appoint, that "lawless one" would be revealed, whom the Lord would "slay with the breath of his mouth" (<a onClick="return mV(\'2Th\',2,8);">2Th 2:8</a>).<P>3. Johannine Epistles:<P>Although many of the features of the "Man of Sin" were exhibited by Nero, yet the Messianic kingdom did not come, nor did Christ return to His people at Nero\'s death. Writing after Nero had fallen, the apostle John, who, as above remarked, alone of the New Testament writers uses the term, presents us with another view of Antichrist (<a onClick="return mV(\'1Jo\',2,18,22);">1Joh 2:18, 22</a>; <a onClick="return mV(\'1Jo\',4,3);">4:3</a>; <a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a>). From the first of these passages ("as ye have heard that antichrist cometh"), it is evident that the coming of Antichrist was an event generally anticipated by the Christian community, but it is also clear that the apostle shared to but a limited extent in this popular expectation. He thought the attention of believers needed rather to be directed to the antichristian forces that were at work among and around them ("even now have...arisen many antichrists"). From <a onClick="return mV(\'1Jo\',2,22);">1Joh 2:22</a>; <a onClick="return mV(\'1Jo\',4,3);">4:3</a>; <a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a> we see that the apostle regards erroneous views of the person of Christ as the real Antichrist. To him the Docetism (i.e. the doctrine that Christ\'s body was only a seeming one) which portended Gnosticism, and the elements of Ebionism (Christ was only a man), were more seriously to be dreaded than persecution.<P>4. Book of Revelation:<P>In the Book of Revelation the doctrine of Antichrist receives a further development. If the traditional date of the Apocalypse is to be accepted, it was written when the lull which followed the Neronian persecution had given place to that under Domitian—"the bald Nero." The apostle now feels the whole imperial system to be an incarnation of the spirit of Satan; indeed from the identity of the symbols, seven heads and ten horns, applied both to the dragon (<a onClick="return mV(\'Rev\',12,3);">Re 12:3</a>) and to the Beast (<a onClick="return mV(\'Rev\',13,1);">Re 13:1</a>), he appears to have regarded the raison d\'etre of the Roman Empire to be found in its incarnation of Satan. The ten horns are borrowed from <a onClick="return mV(\'Dan\',7,\'1-\');">Da 7</a>, but the seven heads point, as seen from <a onClick="return mV(\'Rev\',17,9);">Re 17:9</a>, to the "seven hills" on which Rome sat. There is, however, not only the Beast, but also the "image of the beast" to be considered (<a onClick="return mV(\'Rev\',13,14,15);">Re 13:14-15</a>). Possibly this symbolizes the cult of Rome, the city being regarded as a goddess, and worshipped with temples and statues all over the empire.<P>From the fact that the seer endows the Beast that comes out of the earth with "two horns like unto a lamb" (<a onClick="return mV(\'Rev\',13,11);">Re 13:11</a>), the apostle must have had in his mind some system of teaching that resembled Christianity; its relationship to Satan is shown by its speaking "as a dragon" (<a onClick="return mV(\'Rev\',13,11);">Re 13:11</a>). The number 666 given to the Beast (<a onClick="return mV(\'Rev\',13,18);">Re 13:18</a>), though presumably readily understood by the writer\'s immediate public, has proved a riddle capable of too many solutions to be now readily soluble at all. The favorite explanation Neron Qecar (Nero Caesar), which suits numerically, becomes absurd when it implies the attribution of seven heads and ten horns. There is no necessity to make the calculation in Hebrew; the corresponding arithmogram in the Sib Or, 1 32830, in which 888 stands for Iesous, is interpreted in Greek. On this hypothesis Lateinos, a suggestion preserved by Irenaeus (V, 30) would suit. If we follow the analogy of Daniel, which has influenced the Apocalyptist so much, the Johannine Antichrist must be regarded as not a person but a kingdom. In this case it must be the Roman Empire that is meant.<P>III. In Apocalyptic Writings.<P>Antichrist in the Apocalyptic Writings:<P>Although from their eschatological bias one would expect that the Jewish Apocalyptic Writings would be full of the subject, mention of the Antichrist occurs only in a few of the apocalypses. The earliest certain notice is found in the Sibylline books (1 167). We are there told that "Beliar shall come and work wonders," and "that he shall spring from the Sebasteni (Augusti)" a statement which, taken with other indications, inclines one to the belief that the mad demands of Caligula, were, when this was written, threatening the Jews. There are references to Beliar in the XII the Priestly Code (P), which, if the date ascribed to them by Dr. Charles, i.e. the reign of John Hyrcanus I, be assumed as correct, are earlier. Personally we doubt the accuracy of this conclusion. Further, as Dr. Charles admits the presence of many interpolations, even though one might assent to his opinions as to the nucleus of the XII the Priestly Code (P), yet these Beliar passages might be due to the interpolator. Only in one passage is "Beliar" antichristos as distinguished from antitheos; <a onClick="return mV(\'Dan\',5,10,11);">Da 5:10-11</a> (Charles\' translation), "And there shall rise unto you from the tribe of Judah and of Levi the salvation of the Lord, and he shall make war against Beliar, and execute everlasting vengeance on our enemies, and the captivity shall he take from Beliar and turn disobedient hearts unto the Lord." Dr. Charles thinks he finds an echo of this last clause in <a onClick="return mV(\'Luk\',1,17);">Lu 1:17</a>; but may the case not be the converse?<P>The fullest exposition of the ideas associated with the antichrist in the early decades of Christian history is to be found in the Ascension of Isaiah. In this we are told that "Beliar" (Belial) would enter into "the matricide king" (Nero), who would work great wonders, and do much evil. After the termination of 1,332 days during which he has persecuted the plant which the twelve apostles of the Beloved have planted, "the Lord will come with his angels and with armies of his holy ones from the seventh heaven, with the glory of the seventh heaven, and he will drag Beliar into Gehenna and also his armies" (<a onClick="return mV(\'Dan\',4,3,13);">Da 4:3, 13</a>, Charles\' translation). If the date at which Beliar was supposed to enter into Nero was the night on which the great fire in Rome began, then the space of power given to him is too short by 89 days. From the burning of Rome till Nero\'s death was 1,421 days. It is to be noted that there are no signs of the writer having been influenced either by Paul or the Apocalypse. As he expected the coming of the Lord to be the immediate cause of the death of Nero, we date the writing some months before that event. It seems thus to afford contemporary and independent evidence of the views entertained by the Christian community as to Antichrist.<P>IV. In Patristic Writings.<P>Patristic References to Antichrist:<P>Of the patristic writers, Polycarp is the only one of the Apostolic Fathers who refers directly to Antichrist. He quotes John\'s words, "Whosoever doth not confess that Jesus Christ has come in the flesh is Antichrist" (7), and regards Docetism as Antichrist in the only practical sense. Barnabas, although not using the term, implies that the fourth empire of Daniel is Antichrist; this he seems to identify with the Roman Empire (4:5). Irenaeus is the first-known writer to occupy himself with the number of the Beast. While looking with some favor on Lateinos, he himself prefers Teitan as the name intended (5:30). His view is interesting as showing the belief that the arithmogram was to be interpreted by the Greek values of the letters. More particulars as to the views prevailing can be gleaned from Hippolytus, who has a special work on the subject, in which he exhibits the points of resemblance between Christ and Antichrist (On Christ and Antichrist, 4.14.15. 19.25). In this work we find the assertion that Antichrist springs from the terms of Jacob\'s blessing to Dan. Among other references, the idea of Commodian (250 AD) that Nero risen from the dead was to be Antichrist has to be noticed. In the commentary on Revelation attributed to Victorinus of Petau there is, inserted by a later hand, an identification of Genseric with the "Beast" of that book. It is evident that little light is to be gained on the subject from patristic sources.<P>V. Medieval Views.<P>Much time need not be spent on the medieval views of Antichrist in either of the two streams in which it flowed, Christian and Jewish.<P>1. Christian:<P>The Christian was mainly occupied in finding methods of transforming the names of those whom monkish writers abhorred into a shape that would admit of their being reckoned 666. The favorite name for this species of torture was naturally Maometis (Mohammed). Gregory IX found no difficulty in accommodating the name of Frederic II so as to enable him to identify his great antagonist with "the beast coming up out of the sea": this identification the emperor retorted on the pope. Rabanus Maurus gives a full account of what Antichrist was to do, but without any attempt to label any contemporary with the title. He was to work miracles and to rebuild the temple at Jerusalem. The view afterward so generally held by Protestants that the papacy was Antichrist had its representatives among the sects denounced by the hierarchy as heretical, as the Kathari. In various periods the rumor was spread that Antichrist had been already born. Sometimes his birthplace was said to be Babylon, sometimes this distinction was accorded to the mystical Babylon, Rome.<P>2. Jewish:<P>The Jewish views had little effect on Christian speculation. With the Talmudists Antichrist was named Armilus, a variation of Romulus. Rome is evidently primarily intended, but Antichrist became endowed with personal attributes. He makes war on Messiah, son of Joseph, and slays him, but is in turn destroyed by Messiah, Son of David.<P>VI. Post-Reformation Views.<P>Post-Reformation Theories of Antichrist:<P>In immediately post-Reformation times the divines of the Romish church saw in Luther and the Reformed churches the Antichrist and Beast of Revelation. On the other hand the Protestants identified the papacy and the Roman church with these, and with the Pauline Man of Sin. The latter view had a certain plausibility, not only from the many undeniably antichristian features in the developed Roman system, but from the relation in which the Romish church stood to the city of Rome and to the imperial idea. The fact that the Beast which came out of the earth (<a onClick="return mV(\'Rev\',13,11);">Re 13:11</a>) had the horns of a lamb points to some relation to the lamb which had been slain (<a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>). Futurist interpreters have sought the Antichrist in historical persons, as Napoleon III. These persons, however, did not live to realize the expectations formed of them. The consensus of critical opinion is that Nero is intended by the Beast of the Apocalypse, but this, on many grounds, as seen before, is not satisfactory. Some future development of evil may more exactly fulfill the conditions of the problem.<P>LITERATURE.<P>Bousset, Der Antichrist; "The Antichrist Legend," The Expositor T, contains an admirable vidimus of ancient authorities in the subject. See articles on subject in Schenkel\'s Biblical Lex. (Hausrath); Herzog\'s RE, 2nd edition (Kahler), 3rd edition (Sieffert); Encyclopedia Biblica (Bousset); with Commentaries on 2 Thessalonians and Revelation. A full account of the interpretations of the "Man of Sin" may be seen in Dr. John Eadie\'s essay on that subject in his Commentary on Thessalonians.``173';
