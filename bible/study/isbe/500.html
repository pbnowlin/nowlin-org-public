isbe[564]='Antioch, in Syria`an\'-ti-ok, (Antiocheia).<P>(2) Antioch in Syria.—In 301 BC, shortly after the battle of Ipsus, which made him master of Syria, Seleucus Nicator rounded the city of Antioch, naming it after his father Antiochus. Guided, it was said, by the flight of an eagle, he fixed its site on the left bank of the Orontes (the El-\'Asi) about 15 miles from the sea. He also rounded and fortified Seleucia to be the port of his new capital.<P>The city was enlarged and embellished by successive kings of the Seleucid Dynasty, notably by Seleucus Callinicus (246-226 BC), and Antiochus Epiphanes (175-164 BC). In 83 BC, on the collapse of the Seleucid monarchy, Antioch fell into the hands of Tigranes, king of Armenia, who held Syria until his defeat by the Romans fourteen years later. In 64 BC the country was definitely annexed to Rome by Pompey, who granted considerable privileges to Antioch, which now became the capital of the Roman province of Syria. In the civil wars which terminated in the establishment of the Roman principate, Antioch succeeded in attaching itself constantly to the winning side, declaring for Caesar after the fall of Pompey, and for Augustus after the battle of Actium. A Roman element was added to its population, and several of the emperors contributed to its adornment. Already a splendid city under the Seleucids, Antioch was made still more splendid by its Roman patrons and masters. It was the "queen of the East," the third city, after Rome and Alexandria, of the Roman world. About five miles distant from the city was the suburb of Daphne, a spot sacred to Apollo and Artemis.<P>This suburb, beautified by groves and fountains, and embellished by the Seleucids and the Romans with temples and baths, was the pleasure resort of the city, and "Daphnic morals" became a by-word. From its foundation Antioch was a cosmopolitan city. Though not a seaport, its situation was favorable to commercial development, and it absorbed much of the trade of the Levant. Seleucus Nicator had settled numbers of Jews in it, granting them equal rights with the Greeks (Ant., XII, iii, 1). Syrians, Greeks, Jews, and in later days, Romans, constituted the main elements of the population. The citizens were a vigorous, turbulent and pushing race, notorious for their commercial aptitude, the licentiousness of their pleasures, and the scurrility of their wit. Literature and the arts, however, were not neglected.<P>In the early history of Christianity, Antioch occupies a distinguished place. The large and flourishing Jewish colony offered an immediate field for Christian teaching, and the cosmopolitanism of the city tended to widen the outlook of the Christian community, which refused to be confined within the narrow limits of Judaism. Nicolas, a proselyte of Antioch, was one of the first deacons (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>). Antioch was the cradle of GentileChristianity and of Christian missionary enterprise. It was at the instance of the church at Antioch that the council at Jerusalem decided to relieve GentileChristians of the burden of the Jewish law (<a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>). Antioch was Paul\'s starting-point in his three missionary journeys (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>f.; <a onClick="return mV(\'Act\',15,36);">15:36</a>f.; <a onClick="return mV(\'Act\',18,23);">18:23</a>), and thither he returned from the first two as to his headquarters (<a onClick="return mV(\'Act\',14,26);">Ac 14:26</a>f.; <a onClick="return mV(\'Act\',18,22);">18:22</a>). Here also the term "Christian," doubtless originally a nickname, was first applied to the followers of Jesus (<a onClick="return mV(\'Act\',11,26);">Ac 11:26</a>). The honorable record of the church at Antioch as the mother- church of Gentile Christianity gave her a preeminence which she long enjoyed. The most distinguished of her later sons was John Chrysostom. The city suffered severely from earthquakes, but did not lose its importance until the Arab conquest restored Damascus to the first place among Syrian cities. Antioch still bears its ancient name (Antakiyeh), but is now a poor town with a few thousand inhabitants.``172';
isbe[565]='Antioch, of Pisidia`an\'-ti-ok, pi-sid\'-i-a (Antiocheia pros Pisidia, or aAntiocheia he Pisidia = "Pisidian").<P>1. History:<P>(1) Antioch of Pisidia was so called to distinguish it from the many other cities of the same name founded by Seleucus Nicator (301-280 BC) and called after his father Antiochus. It was situated in a strong position, on a plateau close to the western bank of the river Anthios, which flows down from the Sultan Dagh to the double lake called Limnai (Egerdir Gol). It was planted on the territory of a great estate belonging to the priests of the native religion; the remaining portions of this estate belonged later to the Roman emperors, and many inscriptions connected with the cult of the emperors, who succeeded to the Divine as well as to the temporal rights of the god, have survived. (See Sir W. M. Ramsay\'s paper on "The Tekmoreian Guest-Friends" in Studies in the History and Art of the Eastern Roman Provinces, 1906.) The plateau on which Antioch stood commands one of the roads leading from the east to the Meander and Ephesus; the Seleucid kings regularly founded their cities in Asia Minor at important strategical points, to strengthen their hold on the native tribes.<P>There is no evidence that a Greek city existed on the site of Antioch before the foundation of Seleucus. Ramsay must be right in connecting Strabo\'s statement that Antioch was colonized by Greeks from Magnesia on the Meander with the foundation by Seleucus; for it is extremely unlikely that Greeks could have built and held a city in such a dangerous position so far inland before the conquest of Alexander. Pre-Alexandrian Greek cities are seldom to be found in the interior of Asia Minor, and then only in the open river valleys of the west. But there must have been a Phrygian fortress at or near Antioch when the Phrygian kings were at the height of their power. The natural boundary of Phrygian territory in this district is the Pisidian Mts., and the Phrygians could only have held the rich valley between the Sultan Dagh and Egerdir Lake against the warlike tribes of the Pisidian mountains on condition that they had a strong settlement in the neighborhood. We shall see below that the Phrygians did occupy this side of the Sultan Dagh, controlling the road at a critical point.<P>The Seleucid colonists were Greeks, Jews and Phrygians, if we may judge by the analogy of similar Seleucid foundations. That there were Jews in Antioch is proved by <a onClick="return mV(\'Act\',13,14,50);">Ac 13:14, 50</a>, and by an inscription of Apollonia, a neighboring city, mentioning a Jewess Deborah, whose ancestors had held office in Antioch (if Ramsay\'s interpretation of the inscription, The Cities of Paul, 256, is correct). In 189 BC, after the peace with Antiochus the Great, the Romans made Antioch a "free city"; this does not mean that any change was made in its constitution but only that it ceased to pay tribute to the Seleucid kings. Antony gave Antioch to Amyntas of Galatia in 39 BC, and hence it was included in the province Galatia (see <a href="./study/isbe/search.html?string=GALATIA">GALATIA</a>) formed in 25 BC out of Amyntas\' kingdom. Not much before 6 BC, Antioch was made a Roman colony, with the title Caesareia Antiocheia; it was now the capital of Southern Galatia and the chief of a series of military colonies founded by Augustus, and connected by a system of roads as yet insufficiently explored, to hold down the wild tribes of Pisidia, Isauria and Pamphylia.<P>2. Pisidian Antioch:<P>Much controversy has raged round the question whether Antioch was in Phrygia or in Pisidia at the time of Paul. Strabo defines Antioch as a city of Phrygia toward Pisidia, and the same description is implied in <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>, and <a onClick="return mV(\'Act\',18,23);">18:23</a>. Other authorities assign Antioch to Pisidia, and it admittedly belonged to Pisidia after the province of that name was formed in 295 AD. In the Pauline period it was a city of Galatia, in the district of Galatia called Phrygia (to distinguish it from other ethnical divisions of Galatia, e.g. Lycaonia). This view is certain on a study of the historical conditions (see Ramsay, The Church in the Roman Empire, 25 f.); and is supported by the fact that Phrygian inscriptions (the surest sign of the presence of a Phrygian population, for only Phrygians used the Phrygian language) have been found around Antioch. See <a href="./study/isbe/search.html?string=PISIDIA">PISIDIA</a>. This corner of Phrygia owed its incorporation in the province Galatia to the military situation in 39 BC, when Amyntas was entrusted with the task of quelling the disorderly Pisidian tribes. No scheme of military conquest in the Pisidian mountains could omit this important strategical point on the northwest. This fact was recognized by Seleucus when he rounded Antioch, by Antony when he gave Antioch to Amyntas, and by Augustus when he made Antioch the chief of his military colonies in Pisidia. A military road, built by Augustus, and called the Royal Road, led from Antioch to the sister colony of Lystra. According to the story preserved in the legend of "Paul and Thekla," it was along this road that Paul and Barnabas passed on their way from Antioch to Iconium (<a onClick="return mV(\'Act\',13,51);">Ac 13:51</a>; compare <a onClick="return mV(\'2Ti\',3,11);">2Ti 3:11</a>; see Ramsay, The Church in the Roman Empire, 27-36).<P>3. Language and Religion:<P>Latin continued to be the official language of Antioch, from its foundation as a Roman colony until the later part of the 2nd century AD. It was more thoroughly Romanized than any other city in the district; but the Greek spirit revived in the 3rd century, and the inscriptions from that date are in Greek. The principal pagan deities were Men and Cybele. Strabo mentions a great temple with large estates and many hierodouloi devoted to the service of the god.<P>4. Paul at Antioch:<P>Antioch, as has been shown above, was the military and administrative center for that part of Galatia which comprised the Isaurian, Pisidian and Pamphylian mountains, and the southern part of Lycaonia. It was hence that Roman soldiers, officials, and couriers were dispatched over the whole area, and it was hence, according to <a onClick="return mV(\'Act\',13,49);">Ac 13:49</a>, that Paul\'s mission radiated over the whole region. (On the technical meaning of "region" here, see <a href="./study/isbe/search.html?string=PISIDIA">PISIDIA</a>.) The "devout and honorable women" (the King James Version) and the "chief men" of the city, to whom the Jews addressed their complaint, were perhaps the Roman colonists. The publicity here given to the action of the women is in accord with all that is known of their social position in Asia Minor, where they were often priestesses and magistrates. The Jews of Antioch continued their persecution of Paul when he was in Lystra (<a onClick="return mV(\'Act\',14,19);">Ac 14:19</a>). Paul passed through Antioch a second time on his way to Perga and Attalia (<a onClick="return mV(\'Act\',14,21);">Ac 14:21</a>). He must have visited Antioch on his second journey (<a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>; Ramsay, The Church in the Roman Empire, 74f.), and on his third (<a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>; ibid., 96).<P>LITERATURE.<P>Antioch was identified by Arundel, Discoveries in Asia Minor, I, 281f; with the ruins north of Yalovadj. A full account of the city in the Greek and Roman periods is given in Ramsay, The Cities of Paul, 247-314. The inscriptions are published in CIG, 3979-81; LeBas, III, 1189 f., 1815-25; CIL, III, 289 f.; Sterrett, Epigraphical Journey in Asia Minor, 121 f.; Wolfe Expedition in Asia Minor, 218 f.; Ephem. Epigr., V, 575; Athen. Mirth., XIV, 114. Add to this list (borrowed from Pauly-Wissowa) the inscriptions published in Ramsay\'s article on "The Tekmoreian Guest-Friends," referred to above. For the Phrygian inscriptions of the Antioch district, see Ramsay\'s paper in Jahresh. Oest. Arch. Inst., VIII, 85.``20';
isbe[566]='Antiochians`an-ti-o\'-ki-ans (Antiocheis, peculiar to the Apocrypha, 2Macc 4:9,19): Antiochus Epiphanes was on the throne of Syria from 175 to 164 BC. His determined policy was to Hellenize his entire kingdom. The greatest obstacle to his ambition was the fidelity of the Jews to their historic religion. Many worldly Hebrews, however, for material advantage were willing to apostatize, among them, Jason, the brother of the faithful high priest Onias III. With a large sum of money (2Macc 4:7-10) he bribed Antiochus to appoint him high priest in his brother\'s stead. This office, being, since Ezra\'s time, political as well as religious, made him virtually the head of the nation.<P>He promised, on condition the king would permit him to build a Greek gymnasium at Jerusalem, "to train up the youth of his race in the fashions of the heathen," and to enrol the Hellenized people as Antiochians, i.e. to give all Jews who would adopt Greek customs and the Greek religion the rights and privileges of citizens of Antioch. The granting of this request made Jason the head of the Greek party at Jerusalem. "Such was the height of Greek fashions, and the increase of heathenish manners" under his perverted high-priesthood, that the priests under him lost courage to "serve any more at the altar, but despising the temple and neglecting the sacrifices, hastened" to ally themselves with the Grecians.<P>When the sacrifice of Hercules was observed in connection with the Grecian games at Tyre "Jason sent special messengers from Jerusalem, who were Antiochians" (2Macc 4:19) with a large contribution of money. This Hellenizing program was supported by a decree of Antiochus which enjoined uniformity of worship throughout his dominions. He forbade the further observance of Jewish festivals, Sabbath, sacrifices in the temple and the rite of circumcision. His ambition included the like subjugation of Egypt, but being thwarted in his expedition thither by Roman envoys, he returned to Jerusalem to vent his anger on the Jews who refused to deny the faith of their fathers. The persecutions inflicted by the king upon these devout Jews abounded in every atrocity. All sacred books of the law that could be found were burned. This attempt to Hellenize the Jews was pushed to every remote rural village of Palestine. The universal peril led the Samaritans, eager for safety, to repudiate all connection and kinship with the Jews. They sent ambassadors and an epistle asking to be recognized as belonging to the Greek party, and to have their temple on Mt. Gerizim named "The Temple of Jupiter Hellenius." The request was granted. This was evidently the final breach between the two races indicated in <a onClick="return mV(\'Jhn\',4,9);">Joh 4:9</a>, "For Jews have no dealings with Samaritans."<P>Among those who refused to be enrolled as Antiochians was Mattathias, an aged priest of the order of Joarib. Mourning the terrible profanation of the holy city and temple he retired with his five sons to his ancestral estates among the mountains northwest of Jerusalem. The emissaries of Antiochus followed him thither and commanded him to offer sacrifices upon a heathen altar. He was promised special royal favor in case of obedience. The indignant priest not only "had no ear for the temptations of an abhorred Hellenism," but in his fury instantly slew the apostate priest who attempted to comply with the command. He killed also the king\'s commissioner and tore down the detested altar.<P>This act of heroism became the dawn of a new era. The people rallied to Mattathias\' support. The rebellion grew in power. After a year of inspiring leadership "the venerable priest-captain" died, having first committed "the cause of the law" to his sons, henceforth called Maccabees, from Judas Maccabeus, the son to whom he committed his work. Their victorious career brought to an end the Hellenizing process and the Greek party to which the Antiochians belonged. See also <a href="./study/isbe/search.html?string=ANTIOCHUS+IV">ANTIOCHUS IV</A>.<P>LITERATURE.<P>Ant, XII, v; Stanley, History of the Jewish Church, III, section 48; Riggs, History of the Jewish People, chapter ii, sections 15-26 (Kent\'s Hist. Series, IV).``1';
isbe[567]='Antiochis`an-ti\'-o-kis (Antiochis): A concubine of Antiochus Epiphanes who had presented her with the two Cilician cities, Tarsus and Mallus. Dissatisfied with this the cities made insurrection (2Macc 4:30).``1';
isbe[568]='Antiochus`an-ti\'-o-kus (Antiochos; A, Antimachos (1Macc 12:16)): The father of Numenius, who in company with Antipater, son of Jason, was sent by Jonathan on an embassy to the Romans and Spartans to renew "the friendship" and "former confederacy" made by Judas (1Macc 12:16; 14:22; Ant, XIII, vi; 8).``1';
isbe[569]='Antiochus I`an-ti\'-o-kus (Antiochos Soter, "savior"): born 323 BC; died 261, son of Seleucus Nicator. He fell in love with his stepmother, Stratonike, and became very ill. His father, when he discovered the cause of his son\'s illness, gave her to him in 293, and yielded to him the sovereignty over all the countries beyond the Euphrates, as well as the title of king. When Seleucus returned to Macedonia in 281, he was murdered by Ptolemeus Ceraunus. Antiochus thus became ruler of the whole Syrian kingdom. He waged war on Eumenes of Pergamum, but without success. For the victories of his elephant corps over the Gauls, who had settled in Asia Minor, he received the surname of Soter ("Deliverer"). It was in a battle with these inveterate foes of his country that he met his death (261 BC).`<a href="./study/isbe/search.html?string=SELEUCIDAE">SELEUCIDAE</a>`71';
isbe[570]='Antiochus Ii`Surnamed Theos (Theos, "god"): Son and successor of Antiochus (261-246 BC). He made a successful war on Ptolemy Philadelphus of Egypt, but was obliged to buy peace in 250 by divorcing his wife, Laodice, and by marrying Ptolemy\'s daughter, Berenice. After the death of Ptolemy, "the king of the south" (<a onClick="return mV(\'Dan\',11,6);">Da 11:6</a>) 248 BC, he recalled Laodice and named her eldest son (Seleucus Kallinikos) as his successor to the throne; but Laodice (probably because she feared a second repudiation) had Berenice, her child, and Antiochus all murdered (246 BC). The Milesians gave him the surname of Theos in gratitude for his liberating them from the tyranny of Timarchus. (See Arrian, I, 17, 10, and 18, 2; Josephus, Ant, XII, iii, 2; Dittenberger, Sylloge Inscr. Graec, 166-71.)``71';
isbe[571]='Antiochus Iii`(Megas, "The Great," mentioned in 1Macc 1:10; 8:6-8): Son of Seleucus Kallinikos; succeeded to the throne of Syria in 222 BC; put to death his general, Hermeas, and then led an army against Egypt. Theodotus surrendered to him Tyre, Ptolemais and his naval fleet. Rhodes and Cyzicus, as well as Byzantium and Aetolia, desired peace, but Antiochus declined to accept their terms. He renewed the war, but was defeated at Raphia in 217, and was obliged to give up Phoenicia and Coelesyria; Seleucia, however, he retained. He undertook to bring under his sway again all the territory of the Far East. His expedition against Bactria and Parthia gained for him the surname of "The Great." In 209 he carried away the treasure of the goddess Aine in Ecbatana, defeated the Parthians, and in 208 marched against the Bactrians. Later he made a treaty with an Indian rajah, and then returned to the West by way of Arachosia and Carmania, forcing the Gerraean Arabs to furnish him with frankincense, myrrh and silver. Then he took Ephesus, which he made his headquarters. In 196 he had crossed the Hellespont and rebuilt Lysimachia. Hannibal visited Antiochus in Ephesus the next year and became one of the king\'s advisers. He sought the friendship also of Eumenes of Pergamum, but without success.<P>Rome now requested the king not to interfere in Europe, or to recognize the right of the Romans to protect the Greeks in Asia. A war broke out in 192, and Antiochus was persuaded to come to Greece. The Aetolians elected him their general, who asked the Acheans to remain neutral. But the patriotic Philopoemen decided that an alliance with Rome was to be preferred. Antiochus first captured Calchis; then succeeded in gaining a footing in Boeotia, and later made an effort to get possession of Thessaly, but retired on the approach of the Macedonian army. In 191 the Romans made a formal declaration of war on Antiochus, who, being at that time in Acarnania, returned to Calchis, and finally sailed back to Ephesus. The Romans regained possession of Boeotia, Euboea and Sestus; but Polyxenidas defeated the Roman fleet near Samos, which island, together with Cyme and Phocaea, fell into the hands of Antiochus. The victorious Polyxenidas, however, soon sustained a crushing defeat at the hands of the Romans, and Antiochus abandoned Lysimachia, leaving an open road to Asia to the Romans. He was finally defeated at Magnesia and sent word to Scipio, who was at Sardis, that he was willing to make peace; but Scipio ordered him to send envoys to Rome. A decision was reached in 189; the Asiatic monarch was obliged to renounce everything on the Roman side of the Taurus; give up all his ships of war but ten and pay 15,000 talents to Rome, and 500 to Eumenes. Antiochus marched against the revolted Armenians in 187. In order to replenish his exhausted treasury, he attempted to plunder a temple and both he and his soldiers were slain by the Elymeans.<P>LITERATURE. Polyb. v.40.21; Livy xxxi.14; xxxiii. 19 f.; Josephus, Ant, XII; Heyden, Res ab Ant; Babelon, Rois de Syrie, 77-86; <span class="noTag">Dan 11:10-19</span>; Tetzlaff, De Antiochi III Magni rebus gestis (Munster, 1874).``71';
isbe[572]='Antiochus IV; Antiochus Epiphanes`(Epiphanes, e-pif\'-a-naz, "Illustrious"): Son of Antiochus III who became king after his brother, Seleucus IV, had been murdered by Heliodorus. As a boy Antiochus lived at Rome as a hostage. The Pergamene monarchs, Eumenes and Attalus, succeeded in placing upon the throne the brother of Seleucus, although Heliodorus had wished to ascend the throne himself. The young king was even more enterprising than his father. He was called in to settle a quarrel between Onias III and his brother, Jason, the leader of the Hellenizing faction in Jerusalem, and Onias was driven out (2Macc 4:4-6). Jason became high priest in his stead (2Macc 4:9-16; 1Macc 1:10-15; Ant, XII, v, 1). Antiochus himself afterward visited Jerusalem and was signally honored (2Macc 4:22). On the death of Ptolemy VI in 173, Antiochus laid claim to Coelesyria, Palestine and Phoenicia; whereupon war broke out between Syria and Egypt. In this war Antiochus was victorious. Ptolemy Philometor was taken prisoner, and Antiochus had himself crowned king of Egypt (171-167 BC) at Memphis; whereupon Alexandria revolted and chose Ptolemy\'s brother as their king. The Roman ambassador, Popilius Laenas, demanded the surrender of Egypt and the immediate withdrawal of its self-constituted king. Antiochus yielded; gave up Pelusium and withdrew his fleet from Cyprus, but retained Coelesyria, Palestine and Phoenicia.<P>While Antiochus was on a second campaign in Egypt, he heard of the siege of Jerusalem. He returned immediately, slew many thousands of the inhabitants and robbed the temple of its treasures (1Macc 1:20-24; 2Macc 5:11-21). By his prohibition of the Jewish worship and his introduction or substitution of the worship of the Olympian Zeus (1Macc 1:54; 2Macc 6:2; Ant, XII, v, 4) he brought about the insurrection of the Jews, under the Maccabees, upon whom he made an unsuccessful war in 167-164 BC. After this war Antiochus retired to the eastern provinces and died, after having failed in an attack on the temple of the Sun in Elymais, in Persia.`<a href="./study/isbe/search.html?string=ABOMINATION+OF+DESOLATION">ABOMINATION OF DESOLATION</a>; <a href="./study/isbe/search.html?string=ANTIOCHIANS">ANTIOCHIANS</a>`71';
isbe[573]='Antiochus V`(Eupator, "Nobleborn"): Son and successor to Antiochus Epiphanes, ascended the throne as a mere boy (163-161 BC) under the guardianship of Lysias, who led an expedition to the relief of Jerusalem, which had been besieged by Judas Maccabeus (1Macc 6:18-30; Ant, XII, ix, 4), who was defeated (1Macc 6:42). Antiochus then besieged Jerusalem. Peace was finally concluded on the condition that the Jews should not be compelled to change any of their national customs (1Macc 6:55-60; Ant, XII, ix, 7). Philip, the king\'s foster-brother (2Macc 9:29), was defeated at Antioch, but soon afterward Lysias and Antiochus were themselves defeated by Demetrius Soter, son of Seleucus Philopator (1Macc 7:4; 2Macc 14:2; Ant, XII, x, 1; Polyb. xxxi.19; Livy Epit. 46).``71';
isbe[574]='Antiochus Vi`(Surnamed Theos (Theos), or, according to coins, Dionysus Epiphanes): Was the son of Alexander Balas, who claimed to be the son of Antiochus Epiphanes. Alexander left the throne to his son in 146 BC. The young king retired to Arabia—perhaps through compulsion. The shrewd diplomatist and skillful general, Tryphon, succeeded first in winning over to his side the two leaders of the Jews, Jonathan and Simon, and then, by force of arms, in making the Syrians recognize his protege. As soon as the monarchy had been firmly established, Tryphon unmasked his projects: he had been ambitious only for himself; Antiochus had been only an instrument in his hands. In 143; after a reign of a little more than three years, Antiochus was assassinated by Tryphon, who ascended the throne himself (1Macc 13:31; Ant, XIII, vii, 1; Livy Epit. 55).``71';
isbe[575]='Antiochus Vii`(Surnamed Sidetes, Sidetes, after Sida in Pamphylia, where he was educated): Younger son of Demetrius Soter and brother of Demetrius Nicator, whose wife, Cleopatra, he married when Demetrius was taken prisoner by the Parthians. Antiochus overthrew the usurper, Tryphon, and ascended the throne himself and reigned from 139 to 130 BC. He defeated John Maccabeus and besieged Jerusalem (Ant., XIII, viii, 2), but concluded a favorable peace (Ant., XIII, viii, 3) from fear of Rome. Later he waged war with the Parthians and was slain in battle (1Macc 15:2-9, 28-31).``71';
isbe[576]='Antipas`an\'-ti-pas (Antipas): The name is an abbreviation of Antipater:<P>(1) A name of Herod "the tetrarch" (in Jos), son of Herod the Great, the brother of Archelaus (<a onClick="return mV(\'Mat\',14,1);">Mt 14:1</a>; <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>; <a onClick="return mV(\'Luk\',9,7);">9:7</a>; <a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>).<P>(2) A martyr of the church of Pergamum, described as "my witness, my faithful one" (<a onClick="return mV(\'Rev\',2,13);">Re 2:13</a>).`<a href="./study/isbe/search.html?string=HEROD">HEROD</a>`1';
isbe[577]='Antipater`an-tip\'-a-ter (Antipatros): One of two envoys sent by the senate of the Jews to the Romans and Spartans (1Macc 12:16; 14:22).``1';
isbe[578]='Antipatris`an-tip\'-a-tris (Antipatris): Is mentioned in Scripture only once, in connection with the descent of Paul from Jerusalem to Caesarea (<a onClick="return mV(\'Act\',23,31);">Ac 23:31</a>). References will be found in Ant, XIII, xv 1; XVI, v, 2; BJ, I, xxi, 9. It was a town built by Herod the Great, and called after his father Antipater. It is probably identical with the modern Ras el-\'Ain, "fountain head," a large mound with ruins at the source of Nahr El\'aujeh, in the plain to the northeast of Jaffa. There are remains of a crusading castle which may be the Mirabel of those times.``54';
isbe[579]='Antiquity`an-tik\'-wi-ti (qadhmah, from qadham, "to precede in time," "to be old"): In <a onClick="return mV(\'Eze\',16,55);">Eze 16:55</a>; <a onClick="return mV(\'Eze\',36,11);">36:11</a>, rendered "former"; in <a onClick="return mV(\'Psa\',129,6);">Ps 129:6</a>, "before." Translated "antiquity" only in <a onClick="return mV(\'Isa\',23,7);">Isa 23:7</a> to indicate the primeval age of Tyre, which Strabo terms, "after Sidon," the oldest Phoenician city. Delitzsch renders it "whose origin is from the days of the olden time."``1';
isbe[580]='Antonia`an-to\'-ni-a.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
isbe[581]='Antothijah`an-to-thi\'-ja.`<a href="./study/isbe/search.html?string=ANTHOTHIJAH">ANTHOTHIJAH</a>`1';
isbe[582]='Antothite`an\'-toth-it: the King James Version form of <a href="./study/isbe/search.html?string=ANATHOTHITE">ANATHOTHITE</a> (which see) (thus the Revised Version (British and American)) (<a onClick="return mV(\'1Ch\',11,28);">1Ch 11:28</a>; <a onClick="return mV(\'1Ch\',12,3);">12:3</a>).``1';
isbe[583]='Anub`a\'-nub (\'anubh, "ripe"): A descendant of Judah and son of Hakkoz (the King James Version Coz) <a onClick="return mV(\'1Ch\',4,8);">1Ch 4:8</a>.``1';
isbe[584]='Anus`a\'-nus.`<a href="./study/isbe/search.html?string=ANNUS">ANNUS</a>`1';
isbe[585]='Anvil`an\'-vil (pa\'am): The word is used only once to mean anvil. The passage (<a onClick="return mV(\'Isa\',41,7);">Isa 41:7</a>) refers to the custom still very common of workmen encouraging each other at their work. See <a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>. Just how pretentious the anvil of the ancients was we do not know. Most work requiring striking or beating, from the finest wrought jewelry to the largest copper vessels, is now done on an anvil shaped like an inverted letter L which is driven into a block of wood, or into the ground, or into a crack between two of the stone slabs of the workman\'s floor. The only massive anvils seen in the country today are modern and of foreign make.``133';
isbe[586]='Apace`a-pas\' ("at a pace"): With "come," <a onClick="return mV(\'2Sa\',18,25);">2Sa 18:25</a>; "flee," <a onClick="return mV(\'Jer\',46,5);">Jer 46:5</a>, for "rapidly," "hastily," "fast," corresponding to a Hebrew idiom that adds emphasis or intensity to an idea by repetition of the word or its equivalent.``1';
isbe[587]='Apame`a-pa\'-me, ap\'-a-me (Apame): A concubine of Darius and a daughter of Bartacus the Illustrious, whose behavior to the king is referred to in a speech of Zerubbabel before the king to prove to him the great power of women (1Esdras 4:29).`<a href="./study/isbe/search.html?string=BARTACUS">BARTACUS</a>; <a href="./study/isbe/search.html?string=ILLUSTRIOUS">ILLUSTRIOUS</a>`1';
isbe[588]='Apart`a-part\' (badh, "separation," i.e. alone, by oneself; niddah, "uncleanness" i.e. something put away: "an abomination"): In <a onClick="return mV(\'Zec\',12,\'12-14\');">Zec 12:12-14</a> the former word is used eleven times with powerful effect to indicate the separation of families and the isolation of wives through excessive grief in Jerusalem on account of the slain Messiah. The latter word signifies removal from ceremonial uncleanness (<a onClick="return mV(\'Lev\',15,19);">Le 15:19</a>; <a onClick="return mV(\'Lev\',18,19);">18:19</a>; <a onClick="return mV(\'Eze\',22,10);">Eze 22:10</a>). In Greek, kat\' idian, "by themselves," of marked significance as expressing Christ\'s desire for privacy in prayer, alone or with His disciples; either in a desert (<a onClick="return mV(\'Mat\',14,13);">Mt 14:13</a>); a mountain (<a onClick="return mV(\'Mat\',14,23);">Mt 14:23</a>); or a high mountain, at the time of the transfiguration (<a onClick="return mV(\'Mat\',17,1,19);">Mt 17:1, 19</a>), thus suggestive of the secrecy of prayer and communion with God. Used with reference also to Christ\'s disclosures of His purpose and of the purport of His teaching in private to His disciples (<a onClick="return mV(\'Mat\',20,17);">Mt 20:17</a>).``139';
isbe[589]='Ape`ap (qoph): The word occurs only in the two parallel passages (<a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a>; <a onClick="return mV(\'2Ch\',9,21);">2Ch 9:21</a>) in which the magnificence of Solomon is illustrated by the things which are brought to him from foreign countries. Apes are mentioned with gold, silver, ivory and peacocks. Peacocks are natives of India and Ceylon. Apes and ivory may have been brought from India or Africa. Gold and silver may have come from these or other quarters. An Indian origin may be inferred from the fact that the Hebrew qoph, the Greek kebos and the English "ape" are akin to the Sanskrit "kapi", which is referred to the root kap, kamp, "to tremble"; but the question of the source of these imports depends upon what is understood by <a href="./study/isbe/search.html?string=TARSHISH">TARSHISH</a> and <a href="./study/isbe/search.html?string=OPHIR">OPHIR</A> (which see). Canon Cheyne in Encyclopedia Biblica (s.v. "Peacock") proposes a reading which would give "gold, silver, ivory and precious stones" instead of "gold, silver, ivory, apes and peacocks." Assuming, however, that animals are here referred to, the word ape should be understood to mean some kind of monkey. The word "ape" is sometimes used for the tail-less apes or anthropoids such as the gorilla, the chimpanzee and the orangutang, as opposed to the tailed kinds, but this distinction is not strictly held to, and the usage seems formerly to have been freer than now.``37';
isbe[590]='Apelles`a-pel\'-ez (Apelles): A Christian at Rome to whom Paul sends greetings (<a onClick="return mV(\'Rom\',16,10);">Ro 16:10</a>). He is described by Paul as "the, approved in Christ," i.e. "that approved Christian" (Denney). In some way unknown to us Apelles had been tested and he had proved faithful (compare <a onClick="return mV(\'Jam\',1,12);">Jas 1:12</a>; <a onClick="return mV(\'2Ti\',2,15);">2Ti 2:15</a>). It is a common name. Many commentators refer to Horace (Satires, i.5.100): "Credat Judaeus Apella, non ego."``1';
isbe[591]='Aphaerema`a-fer\'-e-ma (Aphairema and Apherema; the King James Version Apherema). One of three districts taken from Samaria and added to Judea by Demetrius Nicator (1Macc 11:34). Compare Ant., XIII, iv, 9.``1';
isbe[592]='Apharsathchites; Apharsachites`af-ar-sath\'-kits, a-far\'-sak-its (\'apharcathkhaye\'): A tribe living in Samaria that protested against the rebuilding of the Temple, and brought their complaint to Darius (<a onClick="return mV(\'Ezr\',4,9);">Ezr 4:9</a>; <a onClick="return mV(\'Ezr\',5,6);">5:6</a>; <a onClick="return mV(\'Ezr\',6,6);">6:6</a>). The tribe has not yet been recognized with any certainty in the inscriptions. Rawlinson identifies them with the Persians; other scholars deny that any Assyrian king was ever so situated as to have been able to obtain colonists from Persia. Some maintain with Marquardt that the term is not the name of a tribe, but the title of certain officers under Darius. Fred. Delitzsch suggests the inhabitants of one of the two great Medean towns "Partakka" and "Partukka" mentioned in Esarhaddon\'s inscriptions. Andreas plausibly connects it with the Assyrian suparsak (Muss-Arnolt, Assyrian Dict., 1098), saqu (3) "general"; Scheft takes it from an old Iranian word aparasarka, "lesser ruler."``197';
isbe[593]='Apharsites`a-far\'-sits (\'apharcaye\'): A tribe transferred to Samaria by Asnappar of Assyria (<a onClick="return mV(\'Ezr\',4,9);">Ezr 4:9</a>). Rawlinson identifies them with the <a href="./study/isbe/search.html?string=APHARSACHITES">APHARSACHITES</a> (which see), taking Apharsites to be an accidental repetition of the same word. He understands "the Persians" to be meant in both cases. Others identify them with a Median tribe mentioned in the inscriptions of Sennacherib as dwellers in the district of Parsua.``1';
isbe[594]='Aphek`a\'-fek (\'apheq, "fortress"; Aphek):<P>(1) In <a onClick="return mV(\'Jos\',12,18);">Jos 12:18</a> we should probably read with the Septuagint "the king of Aphek in Sharon." This may correspond to Aphek in <a onClick="return mV(\'1Sa\',4,1);">1Sa 4:1</a>. It was a royal city of the Canaanites whose king was slain by Josh. Probably it is the Aphek mentioned by Josephus as being near to Antipatris (BJ, II, xix, 1). Kakon, a strong position commanding the main entrance to Samaria might suit; but the name has perished.<P>(2) (Greek Taphek or Apheka): A city in the lot of Asher (<a onClick="return mV(\'Jos\',13,4);">Jos 13:4</a>). The inhabitants were not ejected by Asher, nor is it said that they became tributary (<a onClick="return mV(\'Jdg\',1,31);">Jud 1:31</a>). In this passage it is written \'aphiq (Hebrew). It may be represented by \'Afqa on Nahr Ibrahim, although this is probably farther north than we should expect.<P>(3) To this place the Philistines gathered their hosts, while the Israelites pitched by the fountain which is in Jezreel (<a onClick="return mV(\'1Sa\',29,1);">1Sa 29:1</a>). It has been generally supposed that these two positions were over against each other, and that therefore Aphek must be sought in the plain of Esdraelon. No place answering this description has been found here. Fuqu\'ah on Mount Gilboa is plainly impossible. If, however, this was only the rallying point of the Philistines from which they went up to Jezreel (<a onClick="return mV(\'1Sa\',29,11);">1Sa 29:11</a>), it may be identical with the Aphek in the plain of Sharon (compare <a onClick="return mV(\'1Sa\',29,1);">1Sa 29:1</a> above).<P>(4) A city on the plateau east of the Jordan, where disaster befell Benhadad (<a onClick="return mV(\'1Ki\',20,26,30);">1Ki 20:26, 30</a>). The same place may be intended in <a onClick="return mV(\'2Ki\',13,17);">2Ki 13:17</a>. The modern Fiq or Afiq (for both forms are heard) on the brow of the hill beyond Qal\'at el-Chucn, east of the Sea of Galilee, probably represents this ancient city.``54';
isbe[595]='Aphekah`a-fe\'-ka (\'apheqah, "force" or "strength"): An unidentified city in the hill country of Judah (<a onClick="return mV(\'Jos\',15,53);">Jos 15:53</a>).``1';
isbe[596]='Apherema`a-fer\'-e-ma.`<a href="./study/isbe/search.html?string=APHAEREMA">APHAEREMA</a>`1';
isbe[597]='Apherra`a-fer\'-a (Apherra): Head of a family of children of Solomon\'s servants in the post-exilic list, one of eight listed in 1Esdras 5:34 after Pochereth-hazzebaim of <a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a> = <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>.``1';
isbe[598]='Aphiah`a-fi\'-a (\'aphiach): A Benjaminate and an ancestor of King Saul (<a onClick="return mV(\'1Sa\',9,1);">1Sa 9:1</a>).``1';
isbe[599]='Aphik`a\'-fik: Variant of <a href="./study/isbe/search.html?string=APHEK">APHEK</a> (which see).``1';
isbe[600]='Aphrah`af\'-ra: the King James Version form for the Revised Version (British and American) <a href="./study/isbe/search.html?string=BETH-LEAPHRAH">BETH-LEAPHRAH</a> (<a onClick="return mV(\'Mic\',1,10);">Mic 1:10</a>).``1';
