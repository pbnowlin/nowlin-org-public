isbe[547]='Anointing`a-noint\'-ing: A distinction was made by the ancient Hebrews between anointing with oil in private use, as in making one\'s toilet (cukh), and anointing as a religious rite (mashach).<P>1. Ordinary Use:<P>(1) As regards its secular or ordinary use, the native olive oil, alone or mixed with perfumes, was commonly used for toilet purposes, the very poor naturally reserving it for special occasions only (<a onClick="return mV(\'Rth\',3,3);">Ru 3:3</a>). The fierce protracted heat and biting lime dust of Palestine made the oil very soothing to the skin, and it was applied freely to exposed parts of the body, especially to the face (<a onClick="return mV(\'Psa\',104,15);">Ps 104:15</a>).<P>(2) The practice was in vogue before David\'s time, and traces of it may be found throughout the Old Testament (see <a onClick="return mV(\'Deu\',28,40);">De 28:40</a>; <a onClick="return mV(\'Rth\',3,3);">Ru 3:3</a>; <a onClick="return mV(\'2Sa\',12,20);">2Sa 12:20</a>; <a onClick="return mV(\'2Sa\',14,2);">14:2</a>; <a onClick="return mV(\'2Ch\',28,15);">2 Chron 28:15</a>; <a onClick="return mV(\'Eze\',16,9);">Eze 16:9</a>; <a onClick="return mV(\'Mic\',6,15);">Mic 6:15</a>; <a onClick="return mV(\'Dan\',10,3);">Da 10:3</a>) and in the New Testament (<a onClick="return mV(\'Mat\',6,17);">Mt 6:17</a>, etc.). Indeed it seems to have been a part of the daily toilet throughout the East.<P>(3) To abstain from it was one token of mourning (<a onClick="return mV(\'2Sa\',14,2);">2Sa 14:2</a>; compare <a onClick="return mV(\'Mat\',6,17);">Mt 6:17</a>), and to resume it a sign that the mourning was ended (<a onClick="return mV(\'2Sa\',12,20);">2Sa 12:20</a>; <a onClick="return mV(\'2Sa\',14,2);">14:2</a>; <a onClick="return mV(\'Dan\',10,3);">Da 10:3</a>; Judith 10:3). It often accompanied the bath (<a onClick="return mV(\'Rth\',3,3);">Ru 3:3</a>; <a onClick="return mV(\'2Sa\',12,20);">2Sa 12:20</a>; <a onClick="return mV(\'Eze\',16,9);">Eze 16:9</a>; Susanna 17), and was a customary part of the preparation for a feast (<a onClick="return mV(\'Ecc\',9,8);">Ec 9:8</a>; <a onClick="return mV(\'Psa\',23,5);">Ps 23:5</a>). One way of showing honor to a guest was to anoint his head with oil (<a onClick="return mV(\'Psa\',23,5);">Ps 23:5</a>; <a onClick="return mV(\'Luk\',7,46);">Lu 7:46</a>); a rarer and more striking way was to anoint his feet (<a onClick="return mV(\'Luk\',7,38);">Lu 7:38</a>). In <a onClick="return mV(\'Jam\',5,14);">Jas 5:14</a>, we have an instance of anointing with oil for medicinal purposes, for which see <a href="./study/isbe/search.html?string=OIL">OIL</a>.<P>2. Religious Use:<P>Anointing as a religious rite was practiced throughout the ancient East in application both to persons and to things.<P>(1) It was observed in Canaan long before the Hebrew conquest, and, accordingly, Weinel (Stade\'s Zeutschrift, XVIII, 50 f.) holds that, as the use of oil for general purposes in Israel was an agricultural custom borrowed from the Canaanites, so the anointing with sacred oil was an outgrowth from its regular use for toilet purposes. It seems more in accordance with the known facts of the case and the terms used in description to accept the view set forth by Robertson Smith (Religion of the Semites, 2nd ed., 233, 383f.; compare Wellhausen, Reste des arabischen Heidenthums, 2nd ed., 125 f.) and to believe that the cukh or use of oil for toilet purposes, was of agricultural and secular origin, and that the use of oil for sacred purposes, mashach, was in origin nomadic and sacrificial. Robertson Smith finds the origin of the sacred anointing in the very ancient custom of smearing the sacred fat on the altar (matstsebhah), and claims, rightly it would seem, that from the first there was a distinct and consistent usage, distinguishing the two terms as above.<P>(2) The primary meaning of mashach in Hebrew, which is borne out by the Arabic, seems to have been "to daub" or "smear." It is used of painting a ceiling in <a onClick="return mV(\'Jer\',22,14);">Jer 22:14</a>, of anointing a shield in <a onClick="return mV(\'Isa\',21,5);">Isa 21:5</a>, and is, accordingly, consistently applied to sacred furniture, like the altar, in <a onClick="return mV(\'Exd\',29,36);">Ex 29:36</a> and <a onClick="return mV(\'Dan\',9,24);">Da 9:24</a>, and to the sacred pillar in <a onClick="return mV(\'Gen\',31,13);">Ge 31:13</a>: "where thou anointedst a pillar."<P>(3) The most significant uses of mashach, however, are found in its application, not to sacred things, but to certain sacred persons. The oldest and most sacred of these, it would seem, was the anointing of the king, by pouring oil upon his head at his coronation, a ceremony regarded as sacred from the earliest times, and observed religiously not in Israel only, but in Egypt and elsewhere (see <a onClick="return mV(\'Jdg\',9,8,15);">Jud 9:8, 15</a>; <a onClick="return mV(\'1Sa\',9,16);">1Sa 9:16</a>; <a onClick="return mV(\'1Sa\',10,1);">10:1</a>; <a onClick="return mV(\'2Sa\',19,10);">2Sa 19:10</a>; <a onClick="return mV(\'1Ki\',1,39,45);">1Ki 1:39, 45</a>; <a onClick="return mV(\'2Ki\',9,3,6);">2Ki 9:3, 6</a>; <a onClick="return mV(\'2Ki\',11,12);">11:12</a>). Indeed such anointing appears to have been reserved exclusively for the king in the earliest times, which accounts for the fact that "the Lord\'s anointed" became a synonym for "king" (see <a onClick="return mV(\'1Sa\',12,3,5);">1Sa 12:3, 5</a>; <a onClick="return mV(\'1Sa\',26,11);">26:11</a>; <a onClick="return mV(\'2Sa\',1,14);">2Sa 1:14</a>; <a onClick="return mV(\'Psa\',20,6);">Ps 20:6</a>). It is thought by some that the practice originated in Egypt, and it is known to have been observed as a rite in Canaan at a very early day. Tell el-Amarna Letters 37 records the anointing of a king.<P>(4) Among the Hebrews it was believed not only that it effected a transference to the anointed one of something of the holiness and virtue of the deity in whose name and by whose representative the rite was performed, but also that it imparted a special endowment of the spirit of Yahweh (compare <a onClick="return mV(\'1Sa\',16,13);">1Sa 16:13</a>; <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>). Hence the profound reverence for the king as a sacred personage, "the anointed" (Hebrew, meshiach YHWH), which passed over into our language through the Greek Christos, and appears as "Christ".<P>(5) In what is known today as the Priestly Code, the high priest is spoken of as "anointed" (<a onClick="return mV(\'Exd\',29,7);">Ex 29:7</a>; <a onClick="return mV(\'Lev\',4,3);">Le 4:3</a>; <a onClick="return mV(\'Lev\',8,12);">8:12</a>), and, in passages regarded by some as later additions to the Priestly Code, other priests also are thus spoken of (<a onClick="return mV(\'Exd\',30,30);">Ex 30:30</a>; <a onClick="return mV(\'Exd\',40,\'13-15\');">40:13-15</a>). Elijah was told to anoint Elisha as a prophet (<a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a>), but seems never to have done so. <a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a> gives us the only recorded instance of such a thing as the anointing of a prophet. <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a> is purely metaphorical (compare Dillmann on <a onClick="return mV(\'Lev\',8,\'12-14\');">Le 8:12-14</a> with ICC on <a onClick="return mV(\'Num\',3,3);">Nu 3:3</a>; see also Nowack, Lehrbuch der hebraischen Archaologie, II, 124).<P>LITERATURE.<P>Jewish Encyclopedia, article "Anointing"; BJ, IV, ix, 10, DB, article "Anointing," etc.``47';
isbe[548]='Anon`a-non\' (eutheos, euthus): In the King James Version of <a onClick="return mV(\'Mar\',1,30);">Mr 1:30</a>; <a onClick="return mV(\'Mat\',13,20);">Mt 13:20</a>, for "straightway" of the Revised Version (British and American), i.e. "without delay," "immediately."``1';
isbe[549]='Anos`a\'-nos (Anos = Vaniah (<a onClick="return mV(\'Ezr\',10,36);">Ezr 10:36</a>): A son of Bani who put away his "strange wife" (1Esdras 9:34).``1';
isbe[550]='Answer`an\'-ser: In our English Bible the word "answer" does not always mean a simple reply to a question.<P>1. In the Old Testament:<P>Six different words are translated by answer.<P>(1) It is frequently used where no question has been asked and in such cases it means a word, a statement.<P>(2) It also means a response (<a onClick="return mV(\'Job\',21,34);">Job 21:34</a>; <a onClick="return mV(\'Job\',34,36);">34:36</a>).<P>(3) It often means a declaration or proclamation from God where no question has been asked. See the many passages that read: "The Lord answered and said."<P>(4) The other words translated "answer" or "answered" in the Old Testament are unimportant shadings and variations.<P>2. In the New Testament:<P>The words translated "answer" are not so varied.<P>(1) It sometimes means an apology, a defense (<a onClick="return mV(\'1Pe\',3,15);">1Pe 3:15</a>; <a onClick="return mV(\'Act\',24,10,25);">Ac 24:10, 25</a>).<P>(2) It may mean simply "to say" (<a onClick="return mV(\'Mar\',9,6);">Mr 9:6</a>).<P>(3) It may mean a revelation from God (<a onClick="return mV(\'Rom\',11,4);">Ro 11:4</a>).<P>(4) It is also used to apply to unspoken thoughts of the heart, especially in the sayings of Jesus; also by Peter to Sapphira (<a onClick="return mV(\'Act\',5,8);">Ac 5:8</a>).``64';
isbe[551]='Answerable`an\'-ser-a-bl: This word is found in the Old Testament only. Moses and Ezekiel alone use it (<a onClick="return mV(\'Exd\',38,18);">Ex 38:18</a>; <a onClick="return mV(\'Eze\',40,18);">Eze 40:18</a>; <a onClick="return mV(\'Eze\',45,7);">45:7</a>; <a onClick="return mV(\'Eze\',48,13,18);">48:13, 18</a>). It is used in the Old English sense of "corresponding to," "in harmony with." Bunyan uses it in the same sense (Holy War, Clar. Press ed., 92).``1';
isbe[552]='Ant`(nemalah = Arabic namalah): The word occurs only twice in the Bible, in the familiar passages in <a onClick="return mV(\'Pro\',6,6);">Pr 6:6</a>; <a onClick="return mV(\'Pro\',30,25);">30:25</a> in both of which this insect is made an example of the wisdom of providing in the summer for the wants of the winter. Not all ants store up seeds for winter use, but among the ants of Palestine there are several species that do so, and their well-marked paths are often seen about Palestinian threshing-floors and in other places where seeds are to be obtained. The path sometimes extends for a great distance from the nest.``37';
isbe[553]='Antediluvian Patriarchs`an-te-di-lu\'-vi-an pa\'-tri-arks.<P>1. The Ten Antediluvian Patriarchs:<P>Ten patriarchs who lived before the Flood are listed in the genealogical table of <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>, together with a statement of the age of each at the birth of his son, the number of years that remained to him till death, and the sum of both periods or the entire length of his life. The first half of the list, from Adam to Mahalalel inclusive, together with Enoch and Noah is the same in the three texts, except that the Septuagint has 100 years more in the first column in each case save that of Noah, and 100 years less in the second column.<P>2. Divergences between the Three Texts:<P>Divergence exists in the case of Jared, Methuselah and Lamech only. Even here the longevity of Jared and Methuselah is given similarly in the Hebrew and the Septuagint; and probably represents the reading of the source, especially since the different data in the Samaritan text bear evidence of adjustment to a theory. The customary excess of 100 years in the Septuagint over the other texts for the age of the patriarch at the birth of the son, and the variously divergent data for the total age of Jared, Methuselah and Lamech are, therefore, the matters that await explanation.<P>The general superiority of the Hebrew text of the Pentateuch as a whole to the Samaritan text and the Septuagint is no longer questioned by Biblical scholars. But whether the superiority obtains in this particular passage has given rise to long and earnest discussion. Keil and Delitzsch in their commentaries on Genesis, Preuss (Zeitrechnung der Septuaginta, 1859, 30ff), Noldeke (Untersuchung zur Kritik des Altes Testament, 1869, 112), and Eduard Konig (ZKW, 1883, 281f.), hold to the originality of the Hebrew data. Bertheau (Jahrbucher fur deutsche Theologie, XXIII, 657 f.) and Dillmann ascribe prior authority to the Samaritan numbers in <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>, but to the Hebrew numbers in <a onClick="return mV(\'Gen\',11,\'1-\');">Ge 11</a>. Klostermann argues for the originality of the Septuagint (Pentateuch, Neue Folge,1907,37-39).<P>3. Divergences not Accidental:<P>It is agreed by all that the divergences between the texts are mainly due, not to accidental corruption, but to systematic alteration. Accordingly, two tasks devolve upon the investigator, namely<P>(1) the removal of accidental corruptions from the numerical data in the several texts and<P>(2) the discovery of a principle that underlies and explains the peculiarities in each one or in two of the three sets of data.<P>4. Different Explanations:<P>On the interpretation that the names denote individuals and that no links have been omitted in the genealogy, readers of the Septuagint noticed that according to its data Methuselah survived the flood, and in order to avoid this incongruity a scribe changed the 167 years, ascribed to his age at the birth of his son, to 187 years. This reading was early in existence, and was followed by Josephus. Holding the same theory regarding the genealogy, the Samaritans noticed that by their data three men, Jared, Methuselah, and Lamech, survived the Flood. To correct the apparent mistake, without tampering with the age of these three men at parenthood, their longevity was reduced sufficiently to enable them to die in the year of the Deluge.<P>If the Hebrew text in its present form is not original, and is to be emended from the Samaritan and Septuagint, the same difficulty inhered in it. To overcome this difficulty, perhaps, 100 years were borrowed from the years that elapsed between parenthood and death and were added to the age of the three men at the time of begetting a son. This relieved the matter as far as Jared was concerned and perhaps in the case of Lamech also, and the borrowing of an additional 20 years set Methuselah right also. If the original number for Lamech was 53 in the Hebrew, as in the Samaritan, then it was necessary to increase the time between Methuselah\'s birth and the Flood not 20, but 49 years. These 49 years could not be added directly to either Methuselah\'s or Lamech\'s age at begetting a son without making this age exceed 200 years, and thus be out of proportion; and accordingly the 49 years were distributed.<P>The difference of a century in the age assigned to the patriarchs at the son\'s birth which distinguishes the data of the Hebrew in most cases from the Septuagint, and likewise from the Samaritan in several instances, in <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> and regularly until Nahor in <a onClick="return mV(\'Gen\',11,\'10-26\');">Ge 11:10-26</a>, is commonly explained in the following manner or in a similar way: namely, when any of these long-lived patriarchs was found recorded as having begotten a son at a more youthful age than 150 years, the translators of the Septuagint added 100 years; on the other hand the Samaritan struck off 100 years when necessary in order that no one save Noah might be recorded as reaching 150 years of age before entering upon parenthood, and added 100 years when the record made a patriarch become father of a son before attaining even 50 years. A different explanation is, however, attempted, and the reason for the constant variant is sought in the purpose to construct an artificial chronology; for on interpreting the names as denoting individual persons and the genealogy as proceeding from father to son without break, a method employed as early as the 1st century of the Christian era (Ant., I, iii, 3), the time that elapsed between the creation of man and the Deluge was 1,656 years according to the Hebrew text, 1,307 according to the Samaritan text, and 2,242 according to the Septuagint; and numerous attempts have been made to bring one or other of these totals into arithmetical relation with some conceivable larger chronological scheme. A conspectus of these studies is furnished by Delitzsch (Neuer Commentar uber die Genesis, 136-39), Dillmann (Genesis, 6te Aufl, 111-13), and most recently by Skinner (Critical and Exegetical Commentary on Genesis, 135, 136, 234). The different explanations that are offered naturally vary in plausibility; but all possess the common fault of lacking cogency at critical points and somewhere doing violence to the data.<P>5. The Relation of the Cainite and Sethite Genealogies:<P>In <a onClick="return mV(\'Gen\',4,\'1-\');">Ge 4</a> there are two distinct genealogies, one proceeding through Cain and the other through Seth. Since Hupfeld, the representative critics who partition Genesis have generally reached the conclusion that both of these genealogies were found in the primary document of J or in an ancient recension of it (Wellhausen, Composition des Hexateuchs 3, 8-14; Delitzsch, Neuer Commentar, etc., 126; Kautzsch und Socin; Dillmann, <span class="noTag">Genesis 6</span>, 104, 116; Budde, Urgeschichte, 182, 527-31; Driver, Introduction 10, 14, 21; Strack, <span class="noTag">Genesis 2</span>, 23; Gunkel, Genesis, 49; Skinner, Genesis, 2, 14, 99 (4); Stade on the other hand regards <a onClick="return mV(\'Gen\',4,25,26);">Ge 4:25-26</a>; <a onClick="return mV(\'Gen\',5,29);">5:29</a> as the compilation of a redactor, ZATW, XIV, 281). In <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> there is also a genealogy through Seth to Noah.<P>6. Resemblances and Differences in the Two Lists:<P>By removing <a onClick="return mV(\'Gen\',4,25,26);">Ge 4:25-26</a> from their present position and placing them before <a onClick="return mV(\'Gen\',4,1);">4:1</a> or, as Guthe does, before <a onClick="return mV(\'Gen\',4,17);">4:17</a>; and by exscinding the word "Eve" from <a onClick="return mV(\'Gen\',4,1);">4:1</a> and understanding "the man" (ha-\'adham) to be Enosh; and by exscinding from <a onClick="return mV(\'Gen\',4,25);">4:25</a> the words "again," "another," and "instead of Abel, for Cain slew him"; and by introducing the words "and Lamech begat" before "a son" in <a onClick="return mV(\'Gen\',5,28,29);">Ge 5:28-29</a> and inserting this material in between <a onClick="return mV(\'Gen\',4,18);">Ge 4:18</a> and <a onClick="return mV(\'Gen\',4,19);">4:19</a> or after<a onClick="return mV(\'Gen\',4,24);"> 4:24</a>: then the two genealogies of chapter 4 are reduced to one and, so far as the names are concerned, have become almost identical with the Sethite genealogy contained in <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>. In fact the resemblances between the six names in <a onClick="return mV(\'Gen\',4,17,18);">4:17-18</a> with six in chapter 5 have from the first been the basis of every attempt to identify the two genealogies (Buttmann, Mythologus, 170-72). The procedure is violent (see strictures, Skinner, Genesis, 99). It is a serious objection also that the work of reconstruction has been conducted without thought of the possible bearing of the tribal theory of the genealogies on this problem.<P>It is important to note that the number of links in the two genealogies may indicate that Jabal, Jubal, and Tubal-Cain, who mark stages of developing culture, lived several generations before Noah. It was ancient Semitic belief that civilization was far advanced before the Flood, and was continued in its various forms by the survivors (Berosus; and inscription 13, col. i. 18 in Lehmann\'s Shamash-shumukin). However, for the sake of comparison, the six links in the genealogical chain of the Cainites are placed side by side with those of the Sethites so as the better to reveal the resemblances and differences<P>Of these names two, Enoch and Lamech, occur in each genealogy, though Enoch does not occupy the same place in both lists. Kenan is readily derived from the same root as Kain. Instead of \'Irad the original Hebrew text may have been \'Idad, as was read by the Septuagint, Codex Alexandrinus and Lucian. But, accepting \'Irad as original, \'Irad and Jared may conceivably have been distorted in the oral tradition; yet as they stand they are radically different, and one might as well compare Prussia and Russia, Swede and Swiss, Austria and Australia. Methushael is written in the Septuagint exactly as is Methuselah; but both names are fully established by textual evidence and are fine Semitic names. Methushael particularly is of good Babylonian form, meaning "man of God"; archaic in Hebrew or smacking of the northern dialect, but quite intelligible to the Israelite.<P>7. The Need of Caution:<P>The resemblance between the six consecutive names in the two lists is indeed striking, but the differences are also great; and the wisdom of caution in pronouncing judgment is suggested and emphasized by a comparison of two lists from the later history of the people of Israel. The twelve kings of Judah compared with their nineteen contemporaries in northern Israel show almost as many resemblances as the ten Cainites to the twelve Sethites, Adam as the common ancestor not being reckoned. The two series begin with Rehoboam and Jeroboam, names as similar externally as \'Irad and Jared. Ahaziah of Israel was almost contemporary with Ahaziah of Judah; Jehoram was on the throne of Judah while Jehoram ruled over Israel, the reign of Jehoash of Judah overlapped that of Jehoash of Israel, and Jehoahaz of Israel preceded about half a century Ahaz, or, as his name appears In Assyrian inscriptions, Jehoahaz of Judah. If there can be two contemporary dynasties with these coincidences, surely there could be two antediluvian races with an equal similarity in the names. Then, too, the material differences between the Cainite and Sethite lines are great. Cain is the son of Adam; whereas Kenan is the third remove, being descended through Seth and Enosh. The two Enochs seem to have nothing in common save the name (<a onClick="return mV(\'Gen\',4,17,18);">Ge 4:17-18</a>; <a onClick="return mV(\'Gen\',5,22,23);">5:22-23</a>). The character of the two Lamechs is quite different, as appears from their speeches (<a onClick="return mV(\'Gen\',4,19,23);">Ge 4:19, 23</a>; <a onClick="return mV(\'Gen\',5,28,29);">5:28-29</a>). The line of Cain terminated in Lamech and his four children, of whom the three sons became of note in the annals of civilization; whereas the line of Seth continued through Noah, the hero of the Flood, and his three sons who were known only as the ancestors of peoples. Moreover, even excluding the section of Genesis assigned to the Priestly Code (P), the two lines were distinguished from each other, and most of the characteristic differences between them were clearly set forth, in the most ancient form of the Hebrew tradition, as it is actually known (Green, Unity of Genesis, 43-49; Delitzsch, Neuer Commentar, etc., 126, 127, 132, 140; Strack, <span class="noTag">Genesis 2, 22, 23</span>, section III).<P>The order of narration in the Book of Genesis is also significant. It indicates the writer\'s perception of a profound difference between the two races. The narrative regarding Cain and his descendants is completed, according to invariable custom in the Book of Genesis, before the line of Seth, in which eventually Abraham appeared, is taken up and its history recorded (Green, Unity of Genesis, 49; Delitzsch, Neuer Commentar, etc., 126). Thus at each stage of the history the story of the branch line is told before the fortunes are recited of the direct line of promise.<P>8. The Register of <span class="noTag">Ge 5</span> and Berosus\' List of Antediluvian Kings:<P>Berosus, a priest of Marduk\'s temple at Babylon about 300 BC, in the second book of his history tells of the ten kings of the Chaldeans who reigned before the Deluge. He says that the first king was Aloros of (the city) Babylon, a Chaldean. (He gave out a report about himself that God had appointed him to be shepherd of the people.) He reigned ten sars. (A sar is thirty-six hundred years.)<P>And afterward Alaparos (his son reigned three sars).<P>And (after him) Amelon (a Chaldean), who was of (the city of) Pautibibla (reigned thirteen sars).<P>Then Ammenon the Chaldean (of Pautibibla reigned twelve sars).<P>Then Megalaros of the city of Pautibibla, and he reigned eighteen sars.<P>And after him Daonos the shepherd of Pautibibla reigned ten sars.<P>Then Euedorachos of Pautibibla reigned eighteen sars.<P>Then Amempsinos, a Chaldean of Laraucha, reigned; and he, the eighth, was king ten sars.<P>Next Otiartes a Chaldean of Laraucha, reigned; and he (the ninth) was king eight sars.<P>And (last of all), upon the death of Otiartes, his son Xisouthros reigned eighteen sars. In his time the great deluge occurred. Thus, when summed up, the kings are ten; and the sars are one hundred and twenty (or four hundred and thirty-two thousand years, reaching to the Flood1).<P>(NOTE: 1 Syncellus quoting Alexander Polyhistor. 2 Syncellus quoting Apollodorus. 3 Syncellus quoting Abydenus. 4 Syncellus quoting Abydenus concerning the deluge. 5 Eusebius, Armenian Chronicle, quoting Alexander Polyhistor. 6 Eusebius, Armenian Chronicle, quoting Abydenus. The royal names have been transmitted with substantial uniformity, except the third, fifth, seventh and ninth. Amelon (2) is given as Amillaros (3) and Almelon (5, 6); Megalaros (2, 3) appears also as Amegalarus (5, 6); Euedorachos (2) as Eudoreschos (3), Edoranchus (5), and Edoreschus (6); and Ardates (1) as Otiartes (2, 5). For texts and readings see Richter, Berosi Chaldaeorum Historiae, 52-56; Migne, Patrologia Graeca, XIX, "Eusebii Chronicorum," Lib. I, cap. i et vi, pp. 106, 121; Schoene, Eusebii Chronicorum, Lib. I, pp. 7, 31.)<P>The original Babylonian form of seven of these ten names has been determined with a fair degree of certainty. Alaparos is in all probability a misreading by a copyist of the Greek Adaparos (Hommel, PSBA, XV, 243 f.; Zimmern, KAT3, 530 f.), and accordingly represents Adapa, followed perhaps by another element beginning with the letter "r"; Amelon and Ammenon are equivalent to the Babylonian nouns amelu (Delitzsch Wo lag das Paradies? S 149; Hommel, PSBA, XV, 243 f.; Zimmern, KAT3, 530 f.), man, and ummanu (Hommel, PSBA, XV, 243 f.; Zimmern, KAT3, 530 f.), workman; Euedorachos is Enmeduranki (pronounced Evveduranki) (Zimmern, KAT3, 530 f.); Amempsinos is probably Amelu-Sin (Delitzsch, Wo lag das Paradies? 149; Hommel, PSBA, XV, 243 f.; Zimmern, KAT3, 530 f.), servant of the moon-god; Otiartes, a misreading of the Greek Opartes, is Ubara-Tutu (Delitzsch, Wo lag das Paradues? 149; Hommel, PSBA, XV, 243 f.; Zimmern, KAT3, 530 f.), meaning servant of Marduk; and Xisouthros is Chasis-atra (Haupt, KAT2, 503; Zimmern, KAT3, 530 f.), equivalent to Atra-chasis, an epithet given to the hero of the Flood.<P>Several of these names are well known in Babylonian literature: Adapa was a human being, a wise man, a wizard, who failed to obtain immortality. He was an attendant at the temple of Ea in the town of Eridu, prepared bread and water for the sanctuary and provided it with fish. Perhaps it was his connection with the temple that led to his being called son of Ea, and described as created or built by Ea (Schrader, Keilinschriftliche Bibliothek, VI, 91-101). Similarly King Esarhaddon calls himself the faithful son, child of Beltis; and Ashurbanipal claims to have been created or built by the gods Ashur and Sin in the womb of his mother (compare Adam, the son of God, <a onClick="return mV(\'Luk\',3,38);">Lu 3:38</a>). Enmeduranki, whose name has been interpreted as possibly meaning chief priest of Duranki, the meeting place of sky and earth, was a king of Sippar, a city whose patron deity was the sun-god Shamash. He was a notable wise man who, it seems, was reputed to have been taken by the gods Shamash and Ramman into their fellowship and made acquainted with the secrets of heaven and earth (KAT3, 530f). As among the Hebrews the priests were descended from Aaron, so among the Babylonians Enmeduranki was regarded as the ancestor of the wizards and sooth-sayers or the founder of their guild. Amel-Sin is elsewhere mentioned as the wise one of Ur (KAT3, 537). In the Babylonian account of the Flood the hero is addressed as son of Ubara-Tutu. It is worth mention that legends grew up about the hero of the Flood, as they have about other historical personages since; and he even appears like some ancient kings, with the determinative for god before his name. Adapa also, who was classed with the wizards, early came to have a place in story.<P>9. Correspondences:<P>The first name in the list of Berosus is Aloros. Professor Hommel would understand the original Babylonian form to have been Aruru, a goddess. The identification is precarious, to say the least; and evidently it was not the conception of the Babylonian priest, for it makes his line of kings begin with a goddess. He should have called Aloros a queen. Professor Hommel regards Adapa also as a deity, contrary to the statements of the tale itself; thus holding that the second Babylonian king like the first was a Divine being. On such an interpretation the Babylonian and Hebrew lists are not identical, for the Hebrew genealogy commences in Adam, human being. With the third name, however, certain remarkable correspondences begin to appear. The third Babylonian king is Amelu, man, and the third patriarch is Enosh, also meaning man; the fourth king is Ummanu, artificer, and the fourth patriarch is Kenan, a name derived from a root meaning to form or fabricate. The seventh king is Enmeduranki, who apparently was reputed to have been summoned by the gods Shamash and Ramman into their fellowship and made acquainted with the secrets of heaven and earth; and the seventh patriarch was Enoch who walked with God (like Noah, <a onClick="return mV(\'Gen\',6,9);">Ge 6:9</a>; see KAT3, 540). The tenth king, like the tenth patriarch, was the hero of the Flood. These facts are capable of two interpretations: either the two catalogues are fundamentally different, having been constructed for different purposes, yet as they deal with prominent persons belonging to the same period of history and to the same country, cross each other at various points and culminate in the same individual (as do the genealogies of <a onClick="return mV(\'Mat\',1,\'1-\');">Mt 1</a> and <a onClick="return mV(\'Luk\',3,\'1-\');">Lu 3</a>); or else when the unexplained names of both lists shall have been finally interpreted, the two catalogues will be found to represent the same tradition.<P>10. Differences:<P>Differences between the catalogues exist, which in some instances may be more apparent than real.<P>(1) In the Babylonian hat the descent of the government from father to son is asserted in two instances only, namely, from the first king to the second and from the ninth to the tenth. The Hebrew asserts kinship, however remote, between the successive links. Yet the two records are quite compatible with each other in this respect on theory (see below) that the Hebrew genealogy was shortened by omissions in order to name but ten generations.<P>(2) Each of the ten patriarchs is assigned a long life; each of the ten kings has a greatly longer reign. The contrast is twofold: between the number of years in corresponding cases, and between length of life and length of reign. But instead of this difference indicating non-identity of the two lines, it may be found, when the Semitic tradition is fully known, to afford the explanation for the duration of life which is assigned to the patriarchs.<P>(3) There is no arithmetical ratio between the years connected with the corresponding names of the two lists. And the symmetry of the numbers in the Bah transmission is open to the suspicion of being artificial. The number of kings is ten; the sum of their united reigns is one hundred and twenty sars, a multiple of ten and of the basal number of the Babylonian duodecimal system. There are three reigns of ten sars each, and three successive reigns which taken together, 3 plus 13 plus 12, make ten and eighteen sars. Taking the reigns in the order in which they occur, we have as their duration the series 10, 18 plus 10, 18, 10, 18, 10, 8, and 18 (Davis, Genesis and Semitic Tradition, 96-100; Strack, <a onClick="return mV(\'Gen\',2,\'1-\');">Genesis 2</a>; <a onClick="return mV(\'Gen\',24,\'1-\');">24</a>).<P>11. The Interpretation of the Genealogy in <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>:<P>Three explanations of the genealogy in <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> may be mentioned.<P>(1) An interpretation, current at the time of Josephus (Ant., I, iii, 4) and adopted by Archbishop Usher in 1650 in his attempt to fix the dates of the events recorded in the Scriptures, assumes an unbroken descent from father to son, during ten generations, from Adam to Noah. On this theory the time from the creation of man to the Flood is measured by the sum of the years assigned to the patriarchs at the birth of the son and successor, together with Noah\'s age when he entered the Ark; so that all the years from the creation of Adam to the Flood were 1,656 years.<P>The extraordinary longevity of these patriarchs is accounted for by the known physical effects of sin. Sin works disease and death. Man was not as yet far removed from his state of sinlessness. The physical balance between man sinless and man the sinner had not been attained (compare Delitzsch, <span class="noTag">Genesis 3</span>, 139; see Ant, I, iii, 9). But after all are we really justified in supposing that the Hebrew author of these genealogies designed to construct a chronology of the period? He never puts them to such a use himself. He nowhere sums these numbers. No chronological statement is deduced from them. There is no computation anywhere in Scripture of the time that elapsed from the Creation or from the Deluge, as there is from the descent into Egypt to the Exodus (<a onClick="return mV(\'Exd\',12,40);">Ex 12:40</a>), or from the Exodus to the building of the temple (<a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>; Green, Bibliotheca Sacra,1890,296).<P>(2) A second method of interpretation assumes that links of the genealogy have been intentionally omitted in order that exactly ten may be named. It is based on the phenomena presented by other Hebrew genealogical registers. Matthew, for example, has outlined the lineage of Christ from Abraham.<P>The history naturally divides into three sections, and to give the tabulation symmetry Matthew names twice seven generations in each division, in one instance omitting three famous kings of Judah and saying "Joram begat Uzziah." As Joram is said to have begotten Uzziah, his grandson\'s grandson, so Enoch may be said to have begotten Methuselah, although the latter may have been Enoch\'s great-grandson or remoter descendant.<P>The book of Genesis is divided by its author into ten sections, each introduced by the same formula (<a onClick="return mV(\'Gen\',2,4);">Ge 2:4</a>; <a onClick="return mV(\'Gen\',5,1);">5:1</a>; <a onClick="return mV(\'Gen\',6,9);">6:9</a>, etc.). In the period from the creation of man to the birth of Abraham the crisis of the history was the Flood. Twice ten generations are named in the symmetrical register, ten before the Flood, Adam to Noah, and ten after the Flood, Shem to Abraham; and the latter period in its turn is divided into two equal parts, and five generations are named for the time to, and five for the time after, the birth of Peleg, in whose days \'the earth was divided\' (<a onClick="return mV(\'Gen\',11,\'10-26\');">Ge 11:10-26</a>; <a onClick="return mV(\'Gen\',10,25);">10:25</a>; compare perhaps <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a>).<P>On this conception of the tables, which is fully justified, there is no basis in the genealogy from Adam to Noah for the calculation of chronology. The table was constructed for a different purpose, and the years are noted for another reason than chronology (Green, Bibliotheca Sacra, 1890, 285-303; Warfield, Princeton Theological Review, 1911, 2-11; compare Dillmann, <span class="noTag">Genesis 6</span>, 106 "dritte Absicht"). The longevity is explained as it is on Usher\'s interpretation of the data (see above).<P>(3) A third method of interpretation understands the patriarchal name to denote the individual and his family spoken of collectively. The person and tribe form one conception. This method also agrees with the phenomena presented by Hebrew genealogical registers. Thus, Keturah bears to Abraham Jokshan, and Jokshan begat Sheba and Dedan, tribes and the countries they inhabited (<a onClick="return mV(\'Gen\',25,\'1-5\');">Ge 25:1-5</a>). Mizraim, as Egypt was called by the Hebrews, begat the Lydians and other ancient peoples (<a onClick="return mV(\'Gen\',10,13);">Ge 10:13</a>); and Canaan begat the town of Sidon and such famous tribes as the Jebusite and the Amorite (<a onClick="return mV(\'Gen\',10,\'15-18\');">Ge 10:15-18</a>). Similarly, countries like Media, Ionia (Javan), Tubal and Meshech, and peoples named by Gentile adjectives in the plural number, like Kittim and Dodanim, are hated as sons of Japheth; and Ethiopia, Egypt, Punt and Canaan, and districts in Arabia like Sheba and Havilah are recorded as descendants of Ham (<a onClick="return mV(\'Gen\',10,\'2-7\');">Ge 10:2-7</a>). Moreover, outside of genealogies, in common parlance Israel denotes a man and the tribe that sprang from him; David, the king of that name and the dynasty he founded (<a onClick="return mV(\'1Ki\',12,16);">1Ki 12:16</a>; compare <a onClick="return mV(\'Jer\',30,9);">Jer 30:9</a>); Nebaioth, a people and its prince (<a onClick="return mV(\'Gen\',25,13,16);">Ge 25:13, 16</a>; <a onClick="return mV(\'Gen\',28,9);">28:9</a>).<P>Sometimes the family takes its name from its progenitor or later leading member; sometimes the name of the tribe or of the country it inhabits is given to its chief representative, as today men are constantly addressed by their family name, and nobles are called by the name of their duchy or county. It is quite in accordance with usage, therefore, that Noah, for example, should denote the hero of the Flood and the family to which he belonged. The longevity is the period during which the family had prominence and leadership; the age at the son\'s birth is the date in the family history at which a new family originated that ultimately succeeded to the dominant position. If no links have been omitted in constructing the register, the period from the creation of man to the Flood is measured by the sum of the ages of Adam and his successors to Noah and 600 years of the life of Noah, amounting to 8,225 years. Thus, the family of Seth originated when Adam was 130 years old (<a onClick="return mV(\'Gen\',5,3);">Ge 5:3</a>). Adam and his direct line were at the head of affairs for 930 years (5), when they were superseded by the family of Seth. In Seth, 105 years after it attained headship, the family of Enosh took its rise (6). Seth, after being at the head of affairs for 912 years (8) was succeeded by the family of Enosh, in the year of the world 1842. And so on.`<a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+OLD+TESTAMENT">CHRONOLOGY OF THE OLD TESTAMENT</a>`35';
isbe[554]='Antediluvians`an-te-di-lu\'-vi-ans.<P>1. Chronology Uncertain:<P>According to the ordinary interpretation of the genealogical tables in <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> the lives of the antediluvians were prolonged to an extreme old age, Methuselah attaining that of 969 years. But before accepting these figures as a basis of interpretation it is important to observe that the Hebrew, the Samaritan and the Septuagint texts differ so radically in their sums that probably little confidence can be placed in any of them. The Septuagint adds 100 years to the age of six of the antediluvian patriarchs at the birth of their eldest sons. This, taken with the great uncertainty connected with the transmission of numbers by the Hebrew method of notation, makes it unwise to base important conclusions upon the data accessible. The most probable interpretation of the genealogical table in <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> is that given by the late Professor William Henry Green, who maintains that it is not Intended to give chronology, and does not give it, but only indicates the line of descent, as where (<a onClick="return mV(\'1Ch\',26,24);">1Ch 26:24</a>) we read that "Shebuel the son of Gershom, the son of Moses, was ruler over the treasures"; whereas, while Gershom was the immediate son of Moses, Shebuel was separated from Gershom by several generations. According to the interpretation of Professor Green all that we can certainly infer from the statement in Hebrew that Adam was 130 years old when he begat Seth, is that at that age the line branched off which culminated in Seth, it being permitted, according to Hebrew usage, to interpolate as many intermediate generations as other evidence may compel.<P>2. Meaning of Genealogies:<P>As in the genealogies of Christ in the Gospels, the object of the tables in Genesis is evidently not to give chronology, but the line of descent. This conclusion is supported by the fact that no use is made afterward of the chronology, whereas the line of descent is repeatedly emphasized. This method of interpretation allows all the elasticity to prehistoric chronology that any archaeologist may require. Some will get further relief from the apparent incredibility of the figures by the Interpretation of Professor A. Winchell, and T. P. Crawford (Winchell, Pre-adamites, 449 f.) that the first number gives the age of actual life of the individual while the second gives that of the ascendancy of his family, the name being that of dynasties, like Caesar or Pharaoh.<P>3. The Nephilim:<P>The nephilim (giants) and the mighty men born of "the sons of God" and the "daughters of men" (<a onClick="return mV(\'Gen\',6,4-5);">Ge 6:4-5</a>) are according to the best interpretation "giants in wickedness," being the fruit of intermarriage between the descendants of Seth ("sons of God" who called on the name of Yahweh, <a onClick="return mV(\'Gen\',4,26);">Ge 4:26</a>), and the "daughters of men." The idea that "sons of God" refers to angels or demigods has no support in Scripture. On this familiar designation of the worshippers of the true God see <a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>; <a onClick="return mV(\'Deu\',1,41);">De 1:41</a>; <a onClick="return mV(\'Deu\',32,\'1-\');">32</a>; repeatedly; <a onClick="return mV(\'Isa\',1,2);">Isa 1:2</a>; <a onClick="return mV(\'Isa\',43,6);">43:6</a>; <a onClick="return mV(\'Isa\',45,11);">45:11</a>; <a onClick="return mV(\'Hsa\',1,10);">Ho 1:10</a>; <a onClick="return mV(\'Hsa\',11,1);">11:1</a>. Intermarriage with depraved races such as is here intimated produced the results which were guarded against in the Mosaic law prohibiting marriages with the surrounding idolatrous nations. The word Nephilim in <a onClick="return mV(\'Gen\',6,4);">Ge 6:4</a> occurs again only in <a onClick="return mV(\'Num\',13,33);">Nu 13:33</a> (the King James Version "giants"). But the word is more probably a descriptive term than the name of a race. In the older Greek versions it is translated "violent men."<P>4. The Ice Age:<P>The antediluvians are, with great probability, identified by some geologists (Sir William Dawson, e.g.) with glacial or paleolithic man, whose implements and remains are found buried beneath the deposits of glacial floods in Northern France, Southern England, Southern Russia, and in the valleys of the Delaware, Ohio and Missouri rivers in America. The remains of "paleolithic" men reveal only conditions of extreme degradation and savagery, in which violence reigned. The sparse population which was spread over the northern hemisphere during the closing floods of the Glacial period lived in caves of the earth, and contended with a strange variety of gigantic animals which became extinct at the same time with their human contemporaries. See <a href="./study/isbe/search.html?string=DELUGE+OF+NOAH">DELUGE OF NOAH</a>.<P>LITERATURE.<P>Green, "Primeval Chronology," Bibliotheca Sacra, April, 1890; Dawson, Modern Science in Bible Lands; B. B. Warfield, "On the Antiquity and the Unity of the Human Race," Princeton Theol. Review, January, 1911; Winchell, Pre-adamites; Wright, Ice Age in North America, 5th ed.; Man and the Glacial Period, and Scientific Confirmations of Old Testament History.``198';
isbe[555]='Antelope`an\'-te-lop (RV; the King James Version "wild ox," te\'o (<a onClick="return mV(\'Deu\',14,5);">De 14:5</a>), and "wild bull," to (<a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>); orux (The Septuagint in Codex Vaticanus has hos seutlion hemiephthon, literally, "like a half-cooked beet-root"): The dorcas gazelle (Gazella dorcas) is widely distributed in Syria, Palestine and Arabia.<P>The recently discovered Merrill\'s gazelle (Gazella Merrilli) inhabits the hilly country near Jerusalem and is not commonly distinguished from the dorcas gazelle. Probably the only other antelope within this range is the Arabian oryx (Oryx beatrix). Tristram cites two African species (the bubaline antelope, Bubalis mauretanica, and the addax, Addax nasomaculatus) as existing in the Sinaitic peninsula, Southern Palestine and Arabia, but he did not collect specimens of either and was probably misled by statements of the Arabs which in both cases really referred to the oryx. The only naturalist who has ever penetrated into Northwest Arabia is Mr. Douglas Carruthers, who went in 1909 on a collecting expedition for the Syrian Protestant College at Beirut, his object being to obtain the oryx and any other large antelopes which might be found there. Through observation and repeated inquiry he became convinced that neither the addax nor the bubaline antelope is found in Arabia. Tristram says the addax is called maha\' and the bubaline antelope baqar-ul-wachsh, both of which names are in fact used by the Arabs for the oryx, which is also according to Doughty called wadichah.<P>Tsebhi in the list of clean animals in <a onClick="return mV(\'Deu\',14,5);">De 14:5</a> (the King James Version "<a href="./study/isbe/search.html?string=ROE;+ROEBUCK">roebuck</a>"; the Revised Version (British and American) "gazelle") is quite certainly <a href="./study/isbe/search.html?string=GAZELLE">gazelle</a>, Arabic zabi (which see), so it is quite possible that te\'o may be the oryx. It is noteworthy that it is rendered oryx (orux) in the Septuagint. It must be borne in mind that re\'m or re\'em, rendered "<a href="./study/isbe/search.html?string=UNICORN">unicorn</a>" (which see) in the King James Version and "<a href="./study/isbe/search.html?string=WILD+OX">wild ox</a>" in the Revised Version (British and American), may perhaps also be the oryx. That the oryx should be called by two names in the Bible need not be considered strange, in view of the indefiniteness of Semitic ideas of natural history, which is directly evidenced by the three names now used for this animal by the Arabs.<P>The slightly different form [to\'] (the King James Version "wild bull"; the Revised Version (British and American) "antelope") found in <a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a> ("Thy sons have fainted, they lie at the head of all the streets, as an antelope in a net") may quite as well refer to the oryx as to any other animal. According to Gesenius the word is derived from the verb ta\'ah, "to outrun," which would be appropriate for this or any antelope.<P>The accompanying illustration is from a photograph of a well-grown female oryx in the zoological gardens at Cairo, which <span clas="noTag">is</span> 35 inches high at the shoulder and whose horns are 21 inches long. An adult male measures 40 inches at the shoulders, 59 inches from tip of nose to root of tail, and the longest horns known measure 27 1/4 inches. The color is pure white with dark brown or black markings. It is a powerful animal and its horns may inflict dangerous wounds. It inhabits the deserts of Arabia and its remarkably large hoofs seem well adapted to traversing the sands. It feeds upon grasses and upon certain succulent roots, and the Bedouin declare that never drinks. Under its name of maha\' it is celebrated in Arabic poetry for the beauty of its eyes. Compare the Homeric "ox-eyed goddess Hera" (Boopis potnia Ere). Baqar-ul-wachsh, the name most commonly used by the Bedouin, means "wild cow" or "wild ox," which is identical with the translation of te\'o in the King James Version.``37';
isbe[556]='Anthedon`an-the\'-don: A city of Palestine, rebuilt along with Samaria, Ashdod, Gaza, and other cities, at Gabinius\' command (Josephus, Ant, XIV, v, 3).``1';
isbe[557]='Anthothijah`an-tho-thi\'-ja (\'anthothiyah, "belonging to Anathoth"(?)): A son of Shasak of Benjamin (<a onClick="return mV(\'1Ch\',8,24);">1Ch 8:24</a>), written in the King James Version Antothijah.``1';
isbe[558]='Anthropology`an-thro-pol\'-o-ji:<P><b>I. TERMS EMPLOYED</b><P><b>II. NATURE OF MAN BIBLICAL CONCEPTION</b><P><b>III. ORIGIN OF MAN FROM SCRIPTURE ACCOUNT: NARRATIVES OF CREATION</b><P><b>IV. UNITY OF THE RACE: VARIOUS THEORIES</b><P><b>V. EVOLUTIONARY THEORY AS TO ORIGIN OF MAN</b><P class="in15">1. Darwinism<P class="in15">2. Difficulties<P class="in15">3. Objections<P class="in15">4. The New Evolutionism<P class="in15">5. Evolution and Genesis<P><b>VI. PRIMITIVE AND PRESENT CONDITIONS OF MAN: ANTIQUITY OF MAN</b><P><b>LITERATURE</b><hr /><P>Under this heading is grouped whatever the Bible has to say regarding man\'s origin, nature, destiny and kindred topics. No systematized doctrine concerning man is found in Scripture; but the great facts about human nature and its elements are presented in the Bible in popular language and not in that of the schools. Delitzsch has well said: "There is a clearly defined psychology essentially proper to Holy Scripture, which underlies all the Biblical writers, and intrinsically differs from that many formed psychology which lies outside the circle of revelation....We do not need first of all to force the Biblical teaching: it is one in itself" (Biblical Psychology,17,18). What is said of the psychology of Scripture may with good reason be applied to its anthropology.<P>I. Terms Employed.<P>Several words are used in the Old Testament for our word "Man."<P>1. \'Adham:<p>\'adham, either as the name of the first man, (compare <a onClick="return mV(\'Luk\',3,38);">Lu 3:38</a>; <a onClick="return mV(\'Rom\',5,14);">Ro 5:14</a>; <a onClick="return mV(\'1Cr\',15,45);">1Co 15:45</a>); or as an appellative—the man; or, as the generic name of the human race (Septuagint: anthropos; Vulgate: homo). The origin of the name is obscure. In <a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a> Adam is connected with \'adhamah, from the earthly part of man\'s nature (dust out of the \'adhamah), as the earth-born one. The derivation of Adam from \'adhamah, however, is disputed—among others by Dillmann: "Sprachlich lasst sich die Ableitung aus Adamah nicht vertheidigen" (Genesis, 53). Delitzsch refers to Josephus (Ant., I, i, 2), who maintained that Adam really meant purrhos ("red as fire"), in reference to the redness of the earth, out of which man was formed. "He means," adds Delitzsch, "the wonderfully fruitful and aromatic red earth of the Hauran chum of mountains, which is esteemed of marvelously strong and healing power, and which is believed to be self-rejuvenescent" (N. Commentary on Genesis, 118). The connection with Edom in <a onClick="return mV(\'Gen\',25,30);">Ge 25:30</a> may perhaps point in the same direction. A connection has also been sought with the Assyrian admu ("child"), especially the young of the bird, in the sense of making or producing (Delitzsch; Oxford Dictionary); while Dillmann draws attention to an Ethiopic root adma, "pleasant," "agreeable," "charming"—a derivation, however, which he rejects. Suffice it to say, that no certain derivation has yet been found for the term (thus Dillmann, "ein sicheres Etymon fur Adam ist noch nicht gefunden," Genesis, 53). Evidently in the word the earthly side of man\'s origin is indicated.<P>2. Son of Man: The phrase ben-\'adham, "son of man" (<a onClick="return mV(\'Num\',23,19);">Nu 23:19</a>; <a onClick="return mV(\'Job\',25,6);">Job 25:6</a>; <a onClick="return mV(\'Eze\',2,3);">Eze 2:3</a>) is frequently found to denote man\'s frailty and unworthiness in the sight of God. So in the much-disputed passage in <a onClick="return mV(\'Gen\',6,2);">Ge 6:2</a>, where the "sons of God" are contrasted with the degenerate "daughters of men" (benoth ha-adham). See also <a onClick="return mV(\'Psa\',11,4);">Ps 11:4</a>; <a onClick="return mV(\'Psa\',12,1,8);">12:1, 8</a>; <a onClick="return mV(\'Psa\',14,2);">14:2</a>. On the other hand the dignity of man is sometimes indicated in the word Adam. Thus in <a onClick="return mV(\'Ecc\',7,28);">Ec 7:28</a>, "One man (\'adham) among a thousand have I found: but a woman among all those have I not found."<P>3. \'Enosh:<p>\'enosh (<a onClick="return mV(\'Psa\',8,4);">Ps 8:4</a>; <a onClick="return mV(\'Psa\',10,18);">10:18</a>; <a onClick="return mV(\'Psa\',90,3);">90:3</a>; <a onClick="return mV(\'Psa\',103,15);">103:15</a>; frequently in Job and Psalms), man in his impotence, frailty, mortality (like the Greek brotos) as against \'ish, man in his strength and vigor. In <a onClick="return mV(\'Gen\',4,26);">Ge 4:26</a> the word becomes a proper name, applied to the son of Seth. Delitzsch derives it from a root \'anash (related to the Arabic and Assyrian), signifying "to be or become frail." To intensify this frailty, we have the phrase in <a onClick="return mV(\'Psa\',10,18);">Ps 10:18</a>, "\'enosh (man) who is of the earth."<P>4. \'Ish:<p>(\'ish), Septuagint aner, Vulg, vir, male as against female, even among lower animals (<a onClick="return mV(\'Gen\',7,2);">Ge 7:2</a>); husband as contrasted with wife (\'ishshah, <a onClick="return mV(\'Gen\',2,23,24);">Ge 2:23-24</a>); man in his dignity and excellence (<a onClick="return mV(\'Jer\',5,1);">Jer 5:1</a>: "seek,...if ye can find a man"); persons of standing (<a onClick="return mV(\'Pro\',8,4);">Pro 8:4</a>, where \'ish is contrasted with bene \'adham, "Unto you, O men, I call; and my voice is to the sons of men")—"like the Attic andres and anthropoi, wisdom turning her discourse to high and low, to persons of standing and to the proletariat" (Delitzsch on Prov). Delitzsch maintains, that \'ish points to a root \'osh "to be strong," and \'ishshah to \'anash, as designating woman in her weakness (compare <a onClick="return mV(\'1Pe\',3,7);">1Pe 3:7</a>: "the weaker vessel"). "Thus \'ishshah and \'enosh come from a like verbal stem and fundamental notion" (Delitzsch, A New Commentary on Genesis, 145). The term \'ish is sometimes used generally, as the Greek tis, the French on, to express "anyone," as in <a onClick="return mV(\'Exd\',21,14);">Ex 21:14</a>; <a onClick="return mV(\'Exd\',16,29);">16:29</a>.<P>5. Gebher:<P>gebher, gibbor, man in his strength. The term is applied to men as contrasted with women and children (<a onClick="return mV(\'Job\',3,3);">Job 3:3</a>), "a male child," in opposition to a female (Septuagint: arsen); also in contrast to non-combatants (<a onClick="return mV(\'Exd\',10,11);">Ex 10:11</a>) and in New Testament, see <a onClick="return mV(\'Mat\',8,9);">Mt 8:9</a>; <a onClick="return mV(\'Jhn\',1,6);">Joh 1:6</a>, where anthropos is used. Thus we read: "Neither shall a man (gebher) put on a woman\'s garment" (<a onClick="return mV(\'Deu\',22,5);">De 22:5</a>). Heroes and warriors are specially indicated by the term in such phrases as "mighty man of valor" (<a onClick="return mV(\'Jdg\',6,12);">Jud 6:12</a>). Sometimes animals are denoted by the term, as in <a onClick="return mV(\'Pro\',30,30);">Pr 30:30</a> ("mightiest among beasts"); sometimes it is applied to God (<a onClick="return mV(\'Isa\',10,21);">Isa 10:21</a>) and to the Messiah (<a onClick="return mV(\'Isa\',9,6);">Isa 9:6</a>). In combination with \'ish it gives intensity to the meaning, as in <a onClick="return mV(\'1Sa\',14,52);">1Sa 14:52</a> "any mighty man."<P>6. Anthropos:<P>Of the Greek terms anthropos stands for man(kind) generally—a human being (<a onClick="return mV(\'Mat\',12,12);">Mt 12:12</a>; <a onClick="return mV(\'Mar\',10,27);">Mr 10:27</a>); though it is sometimes used to indicate man in his imperfection and weakness (<a onClick="return mV(\'1Cr\',3,3,4);">1Co 3:3-4</a>), in such expressions as "to speak as a man" (<a onClick="return mV(\'Rom\',3,5);">Ro 3:5</a> the King James Version), gospel "after man" (<a onClick="return mV(\'Gal\',1,11);">Ga 1:11</a>), "after the manner of men" (<a onClick="return mV(\'1Cr\',15,32);">1Co 15:32</a>) etc.; or as showing the contrast between the perishable and the imperishable (<a onClick="return mV(\'2Cr\',4,16);">2Co 4:16</a>, where the "outward man" is represented as slowly dying, while the "inward man" is being renewed from day to day). Thus Paul contrasts the "natural man" (<a onClick="return mV(\'1Cr\',2,14);">1Co 2:14</a>), the "old man," with the "new" (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a>; <a onClick="return mV(\'Col\',3,9,10);">Col 3:9-10</a>).<P>7. Aner:<P>Aner, Latin: vir—man in his vigor as contrasted with woman in her weakness (<a onClick="return mV(\'1Cr\',11,3);">1Co 11:3</a>; <a onClick="return mV(\'1Pe\',3,7);">1Pe 3:7</a>): sometimes, however, standing for "men in general" (<a onClick="return mV(\'Mar\',6,44);">Mr 6:44</a>: "They that ate the loaves were five thousand men"—andres).<P>II. The Nature of Man: Biblical Conception:<P>1. Biblical Terms:<P>The Biblical idea of man\'s nature may be summed up in the words of Paul, "of the earth, earthy" (<a onClick="return mV(\'1Cr\',15,47);">1Co 15:47</a>), as compared and contrasted with the statement in <a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a>: "God created man in his own image." This act of creation is described as the result of special deliberation on the part of God—the Divine Being taking counsel with Himself in the matter (verse <a onClick="return mV(\'Gen\',1,26);">26</a>). Man therefore is a creature, formed, fashioned, shaped out of "earth" and made after the "image of God." More than one word is employed in the Old Testament to express His idea:<P>(1) bara\', "create," a word of uncertain derivation, occurring five times in <a onClick="return mV(\'Gen\',1,\'1-\);">Ge 1</a>, to indicate the origin of the universe (verse <a onClick="return mV(\'Gen\',1,1);">1</a>), the origin of life in the waters (verse <a onClick="return mV(\'Gen\',1,24);">24</a>), the origin of man (verse <a onClick="return mV(\'Gen\',1,27);">27</a>), and always in connection with God\'s creative work, never where "second causes" are introduced. <p>(2) yatsar, "fashion," "form," "knead" (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>), "of the dust of the ground."<P>(3) banah, "build," in special reference to the creation of woman, "built out of the rib" (<a onClick="return mV(\'Gen\',2,22);">Ge 2:22</a>). By God\'s special interposition man becomes a nephesh chayyah ("a living soul"), where evidently there is a reference to the breath of life, which man shares with the animal world (<a onClick="return mV(\'Gen\',1,20,21,24);">Ge 1:20-21, 24</a>); yet with this distinction, that "God Himself breathed into man\'s nostrils the breath of life" (literally, "breath of lives," nishmath chayyim). With a single exception, that of <a onClick="return mV(\'Gen\',7,22);">Ge 7:22</a>, the word neshamah, "breath," is confined to man. In Job reference is made to his creative act, where Elihu says: "There is a spirit in man, and the breath (nishmath) of the Almighty (shaddai) giveth them understanding" (<a onClick="return mV(\'Job\',32,8);">Job 32:8</a>); compare also <a onClick="return mV(\'Isa\',42,5);">Isa 42:5</a>: "He...giveth breath (neshamah) unto the people." Man therefore is a being separated from the rest of creation and yet one with it.<P>2. Image and Likeness:<P>This distinction becomes more clear in the declaration that man was made in the "image" (tselem, eikon, imago), and after the likeness (demuth, homoiosis, similitudo) of God. The question has been asked whether the two terms differ essentially in meaning; some maintaining that "image" refers to the physical, "likeness" to the ethical side of man\'s nature; others holding that "image" is that which is natural to man, was created with him, was therefore as it were stamped upon him (concreata), and "likeness" that which was acquired by him (acquisita); while others again declare that "image" is the concrete and "likeness" the abstract for the same idea. There is very little scriptural ground for these assertions. Nor can we accept the interpretation of the older Socinians and some of the Remonstrants, that God\'s image consisted in dominion over all creatures, a reference to which is made in <a onClick="return mV(\'Gen\',1,28);">Ge 1:28</a>.<P>3. Meaning of Terms:<P>Turning to the narrative itself, it would appear that the two terms do not denote any real distinction. In <a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a> tselem ("image") alone is used to express all that separates man from the brute and links him to his Creator. Hence, the expression "in our image." In <a onClick="return mV(\'Gen\',1,26);">1:26</a>, however, the word demuth ("similitude") is introduced, and we have the phrase "after our likeness," as though to indicate that the creature bearing the impress of God\'s "image" truly corresponded in "likeness" to the original, the ectype resembling the archetype. Luther has translated the clause: "An image which is like unto us"—ein Bild das uns gleich sei—and in the new Dutch (Leyden) of the Old Testament by Kuenen, Hooijkaas and others, it is rendered: "as our image, like unto us"—als ons evenbeeld ons gelijkende.<P>The two words may therefore be taken as standing to each other in the same relation in which copy or model stands to the original image. "The idea in tselem—says Delitzsch—is more rigid, that of demuth more fluctuating and so to speak more spiritual: in the former the notion of the original image, in the latter that of the ideal predominates." At any rate we have scriptural warrant (see especially, <a onClick="return mV(\'Gen\',9,6);">Ge 9:6</a>; <a onClick="return mV(\'Jam\',3,9);">Jas 3:9</a>) for the statement, that the image is the inalienable property of the race (Laidlaw), so that offense against a fellow-man is a desecration of the Divine image impressed upon man. Calvin has put it very clearly: Imago Dei est integra naturae humanae praestantia ("The image of God is the complete excellence of human nature").<P>4. Subsidiary Questions:<P>Other questions have been asked by early Church Fathers and by Schoolmen of later days, which may here be left out of the discussion. Some, like Tertullian, considered the "image" to be that of the coming Christ (Christi futuri); others have maintained that Adam was created after the image of the Logos (the Word, the second person in the Trinity), which was impressed upon man at his creation. Of all this Scripture knows nothing. There man is represented as made after the image of "Elohim," of the Godhead and not of one person of the Trinity. Paul calls man "the image and glory (eikon kai doxa) of God" (<a onClick="return mV(\'1Cr\',11,7);">1Co 11:7</a>). We may safely let the matter rest there. The strange theory, that the image of God indicates the sphere or element into which man was created, may be mentioned without further discussion (on this see Bohl, Dogmatik, 154 and Kuijper, De vleeschwording des Woords).<P>5. Constituents of Image:<P>In what then does this image or likeness consist? Certainly in what is inalienably human—a body as the temple of the Holy Ghost (the "earthly house" of <a onClick="return mV(\'2Cr\',5,1);">2Co 5:1</a>), and the rational, inspiring, inbreathed spirit. Hence man\'s personably, linking into to what is above, separating him from what is beneath, constitutes him a being apart—a rational, self-conscious, self-determining creature, intended by his Creator for fellowship with Himself. "The animal feels the Cosmos and adapts himself to it. Man feels the Cosmos, but also thinks it" (G. H. Lewes, Problems of Life and Mind). Light is thrown on the subject by the New Testament, and especially by the two classical texts: <a onClick="return mV(\'Eph\',4,24);">Eph 4:24</a> and <a onClick="return mV(\'Col\',3,10);">Col 3:10</a>, where the "new man" is referred to as "after God hath been created in righteousness and holiness of truth" and "renewed unto knowledge after the image of him that created him." Knowledge, righteousness and holiness may fully be considered elements in the character of man as originally designed by God. Likeness to God therefore is man\'s privilege above all created beings. What was said of the Son of God absolutely, "He is the express image (character) of God," is applied to man relatively the created son is not the only-begotten Son. The created son was "like unto God" (homoiosis; <a onClick="return mV(\'1Jo\',3,2);">1Joh 3:2</a>), and even in his degradation there is the promise of renewal after that image: the eternal, only-begotten Son is God\'s equal (<a onClick="return mV(\'Phl\',2,6,7);">Php 2:6-7</a>), though he became a servant and was made in the likeness (homoiomati) of men.<P>This likeness of man with God is not merely a Scriptural idea. Many ancient nations seem to have grasped this thought. Man\'s golden age was placed by them in a far-off past, not in a distant future. Paul quotes a pagan poet in <a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>, "We are also his offspring" (Aratus of Soli, in Cilicia, a countryman of the apostle). This statement also occurs in the beautiful hymn to Jupiter, ascribed to Cleanthes, a Stoic native of Assos in the Troad, and contemporary of Aratus. Psychologically and historically therefore, the Bible view is justified.<P>III. Origin of Man from Scripture Account: Narratives of Creation.<P>The Divine origin of man is clearly taught in the early chapters of Genesis, as has lust been seen.<P>1. Scriptural Account:<P>Two narratives from different sources are supposed to have been combined by an unknown editor to form a not very harmonious whole. It is the purpose of criticism to determine the relationship in which they stand to each other and the dates of their composition. In both accounts man is the crowning glory of creation. The first account (<a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1:1-2:3</a>) is general, the second particular (<a onClick="return mV(\'Gen\',2,\'4-25\');">Ge 2:4-25</a>); in the first we have an account of man\'s appearance on a prepared platform—a gradual rise in the scale of organized existence from chaos upward to the climax, which is reached in man. There is recognized order in the whole procedure, represented by the writer as a process which occupied six days, or periods, measured by the appearance and dissipation of darkness. In the first period, chaotic disturbance is succeeded by the separation of light from darkness, which in its turn is followed by the separation of water from dry land, and to this a second period is assigned.<P>Then gradually in the next four periods we have in orderly sequence the rise of vegetable life, the formation of the creatures of the deep, of the air, of the dry land. When all is prepared man is called into being by a special fiat of the Almighty. Moreover, while other creatures were produced "after their kind," man alone as a unique conception of the Divine Intelligence is made to appear upon the scene, called into existence by direct Divine interposition, after a Divine type, and in distinction of sex; for both man and wife, in a later chapter, are called by the same name: Adam (<a onClick="return mV(\'Gen\',5,2);">Ge 5:2</a>). Such is the scope of the first narrative. No wonder, then, that Scripture elsewhere calls the first man "the son of God" (<a onClick="return mV(\'Luk\',3,38);">Lu 3:38</a>). It need not be determined here, whether the account is strictly chronological, whether the "days" are interludes between successive periods of darkness and not periods of twenty-four hours regulated by the rising and setting of the sun, or whether the whole narrative is but a prose poem of creation, not strictly accurate, or strictly scientific.<P>2. The Two Narratives:<P>In the second narrative (<a onClick="return mV(\'Gen\',2,\'2-25\');">Ge 2:2-25</a>) the order of procedure is different. Man here is not the climax, but the center. He is a creature of the dust, but with the breath of God in his nostrils (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>), holding sway over all things, as God\'s vice-gerent upon earth, creation circling around him and submitting to his authority. To this is added a description of man\'s early home and of his home-relationships. The second narrative therefore seems on the face of it to be supplementary to the first, not contradictory of it: the agreements indeed are far greater than the differences. "The first may be called typical, the second, physiological. The former is the generic account of man\'s creation—of man the race, the ideal; the latter is the production of the actual man, of the historic Adam" (Laidlaw).<P>3. Contrasts:<P>The differences between the two narratives have been magnified by supporters of the various documentary hypotheses. They are supposed to differ in style—the first "displaying clear marks of study and deliberation," the second being "fresh spontaneous, primitive" (Driver, Genesis). They differ also in representation, i.e. in detail and order of events—the earth, in the second narrative not emerging from the waters as in the first, but dry and not fitted for the support of vegetation, and man appearing not last but first on the scene, followed by beasts and birds and lastly by woman. The documents are further supposed to differ in their conception of Divine interposition and a consequent choice of words, the first employing words, like "creating," "dividing," "making," "setting," which imply nothing local, or sensible in the Divine nature, the second being strongly anthropomorphic—Yahweh represented as "moulding," "placing," "taking," "building," etc—and moreover locally determined within limits, confined apparently to a garden as His accustomed abode. Without foreclosing the critical question, it may be replied that the first narrative is as anthropomorphic as the second, for God is there represented as "speaking," "setting," (<a onClick="return mV(\'Gen\',1,17);">Ge 1:17</a>; <a onClick="return mV(\'Gen\',2,17);">2:17</a>), "delighting in" the work of His hands (<a onClick="return mV(\'Gen\',1,31);">Ge 1:31</a>), "addressing" the living creatures (<a onClick="return mV(\'Gen\',1,22);">Ge 1:22</a>), and "resting" at the close (<a onClick="return mV(\'Gen\',2,2);">Ge 2:2</a>). As to the home of Yahweh in a limited garden, we are expressly told, not that man was admitted to the home of his Maker, but that Yahweh specially "planted a garden" for the abode of man. The order of events may be different; but certainly the scope and the aim are not.<P>4. Objections:<P>More serious have been the objections raised on scientific grounds. The cosmogony of Genesis has been disputed, and elaborate comparisons have been made between geological theories as to the origin of the world and the Mosaic account. The points at issue are supposed to be the following: geology knows of no "periods" corresponding to the "days" of Genesis; "vegetation" in Genesis appears before animal life, geology maintains that they appear simultaneously; "fishes and birds" in Genesis preceded all land animals; in the geological record "birds" succeed "fishes" and are preceded by numerous species of land animals (so Driver, Genesis). To this a twofold reply has been given:<p>(1) The account in Genesis is not scientific, or intended to be so: it is a prelude to the history of human sin and of Divine redemption, and gives a sketch of the world\'s origin and the earth\'s preparation for man as his abode, with that one object in view. The starting-point of the narrative is the creation of the universe by God; the culminating point is the creation of man in the image of God. Between these two great events certain other acts of creation in orderly sequence are presented to our view, in so far as they bear upon the great theme of sin and redemption discussed in the record. The aim is practical, not speculative; theological, not scientific.<P>The whole creation-narrative must be judged from that point of view. See <a href="./study/isbe/search.html?string=COSMOGONY">COSMOGONY</a>.<p>(2) What has struck many scientists is not so much the difference or disharmony between the Mosaic and the geological record, as the wonderful agreements in general outline apart from discrepancies in detail. Geologists like Dana and Dawson have expressed this as clearly as Haeckel. The latter, e.g., has openly given utterance to his "just and sincere admiration of the Jewish lawgiver\'s grand insight into nature and his simple and natural hypothesis of creation...which contrasts favorably with the confused mythology of creation current among most of the ancient nations" (History of Creation, I,37,38). He draws attention to the agreement between the Mosaic account, which accepts "the direct action of a constructive Creator," and the non-miraculous theory of development, inasmuch as "the idea of separation and differentiation of the originally simple matter and of a progressive development" is to be found in the "Jewish lawgiver\'s" record.<P>5. Babylonian Origin:<P>Latterly it has been maintained that Israel was dependent upon Babylon for its creation-narrative; but even the most serious supporters of this view have had to concede that the first introduction of Babylonian myth into the sacred narrative "must remain a matter of conjecture," and that "it is incredible, that the monotheistic author of <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>, at whatever date he lived, could have borrowed any detail, however slight, from the polytheistic epic of Marduk and Tiamat" (Driver, Genesis, 31). The statement of Bauer in his Hebraische Mythologie, 1802: "Es ist heut zu Tage ausser allen Zweifel gesetzt, dass die ganze Erzahlung ein Mythus ist" (It is beyond all doubt, that the whole narrative is a myth), can no longer be satisfactorily maintained; much less the assertion that we have here an introduction of post-exilic Babylonian or Persian myth into the Hebrew narrative (compare Van Leeuwen, Anthropologie).<P>6. Later Critical Views:<P>Whether the division of the narrative into Elohistic and Jehovistic documents will stand the test of time is a question which exercises a great many minds. Professor Eerdmans of Leyden, the present occupant of Kuenen\'s chair, has lately maintained that a "thorough application of the critical theories of the school of Graf-Kuenen- Wellhausen leads to highly improbable results," and that "the present Old Testament criticism has to reform itself" (HJ, July, 1909). His own theory is worked out in his Alttestamentliche Studien, to which the reader is referred.<P>IV. Unity of the Race: Various Theories.<P>1. Its Solidarity:<P>The solidarity of the race may be said to be as distinctly a doctrine of science as it is of Scripture. It is implied in the account of the Creation and of the Deluge. It is strongly affirmed by Paul in his address to the Athenians (<a onClick="return mV(\'Act\',17,26);">Ac 17:26</a>), and is the foundation of the Biblical scheme of redemption (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>). The human race in the Old Testament is described as "sons of Adam" (<a onClick="return mV(\'Deu\',32,8);">De 32:8</a> the King James Version), as derived from one pair (<a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a>; <a onClick="return mV(\'Gen\',3,20);">3:20</a>), as having its origin in one individual (<a onClick="return mV(\'Gen\',2,18);">Ge 2:18</a>; <a onClick="return mV(\'1Cr\',11,8);">1Co 11:8</a>, where woman is described as derived \'from man\'). Hence the term "Adam" is applied to the race as well as to the individual (<a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>; <a onClick="return mV(\'Gen\',2,5,7);">2:5, 7</a>; <a onClick="return mV(\'Gen\',3,22,24);">3:22, 24</a>; <a onClick="return mV(\'Gen\',5,2);">5:2</a>); while in the New Testament this doctrine is applied to the history of redemption—Christ as the "second Adam" restoring what was lost in the "first Adam" (<a onClick="return mV(\'1Cr\',15,21,22,47,48,49);">1Co 15:21-22, 47-49</a>).<P>2. Various Theories:<P>Outside of Holy Scripture various theories have been held as to the origin, antiquity and primeval condition of the human race. That of polygenism (plurality of origin) has found special favor, partly as co-Adamitism, or descent of different races from different progenitors (Paracelsus and others), partly as pre-adamitism, or descent of dark- colored races from an ancestor who lived before Adam—the progenitor of the Jews and the light-colored races (Zanini and especially de la Peyrere). But no serious attempts have yet been made to divide the human race among a number of separately originated ancestors.<P>3. Evolutionary View:<P>The Biblical account, however, has been brought into discredit by modern theories of evolution. Darwinism in itself does not favor polygenism; though many interpreters of the evolutionary hypothesis have given it that application. Darwin distinctly repudiates polygenism. He says: "Those naturalists who admit the principle of evolution will feel no doubt, that all the races of man are descended from a single primitive stock" (Descent of Man, second ed., 176); and on a previous page we read: "Man has been studied more carefully than any other animal, and yet there is the greatest possible diversity amongst capable judges, whether he should be classed as a single species, or race, or as two (Verey), as three (Jacquinot), as four (Kant), five (Blumenbach), six (Buffon), seven (Hunter), eight (Agassiz), eleven (Pickering), fifteen (Bory Vincent), sixteen (Desmoulins), twenty-two (Morton), sixty (Crawford), or as sixty-three, according to Burke" (p. 174).<P>V. Evolutionary Theory as to Origin of Man.<P>Modern science generally accepts theory of evolution. Darwin gave to the hypothesis a character it never had before; but since his day its application has been unlimited. "From the organic it is extended to the inorganic world; from our planet and the solar system to the cosmos, from nature to the creations of man\'s mind—arts, laws, institutions, religion. We speak in the same breath of the evolution of organic beings and of the steam engine, of the printing-
