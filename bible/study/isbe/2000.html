to the Hebrews:<P>The chief source of the priestly conception of our Lord is the Epistle to the Hebrews. Christ is declared to have by Himself purged our sins (<a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>); to taste of death for every man (<a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>); that He might be a merciful and faithful High Priest to make reconciliation for the sins of the people (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>; compare <a onClick="return mV(\'Hbr\',3,1);">Heb 3:1</a>); the community of sacrifice (<a onClick="return mV(\'Hbr\',3,14);">Heb 3:14</a>); our great High Priest has passed into the heavens (<a onClick="return mV(\'Hbr\',4,14);">Heb 4:14</a>); His pitifulness (<a onClick="return mV(\'Hbr\',4,15);">Heb 4:15</a>); the authority and power of Christ\'s priesthood fully set forth (<a onClick="return mV(\'Hbr\',5,\'1-\');">Heb 5</a>). Christ was made a High Priest after the order of Melchizedek (<a onClick="return mV(\'Hbr\',5,6);">Heb 5:6</a>). The priesthood of Christ being of the order of Melchizedek is more excellent than the Aaronic priesthood (<a onClick="return mV(\'Hbr\',7,\'1-\');">Heb 7</a>). Christ\'s priesthood being eternal, that of the Aaronic is abolished (<a onClick="return mV(\'Hbr\',8,\'1-\');">Heb 8</a>). Christ\'s high-priesthood is made effectual by His own blood; and He entered once for all into the holy place, and has become the Mediator of a New Covenant (<a onClick="return mV(\'Hbr\',9,\'11-15\');">Heb 9:11-15</a>). Christ is forever the representative of man in heaven (<a onClick="return mV(\'Hbr\',9,\'24-28\');">Heb 9:24-28</a>). Christ by the sacrifice of Himself forever takes away sin, and has consecrated the new and living way to God (<a onClick="return mV(\'Hbr\',10,\'1-\');">Heb 10</a>). He is the Mediator of the New Covenant (<a onClick="return mV(\'Hbr\',12,24);">Heb 12:24</a>). The entire Epistle is steeped in the conception of Christ\'s priesthood.<P>In <a onClick="return mV(\'1Pe\',1,2);">1Pe 1:2</a> the sacrificial element appears in the "sprinkling of the blood of Jesus Christ." The sufferings of the Lord were prophesied, the spirit of the Anointed One signifying what the prophets desired to know (<a onClick="return mV(\'1Pe\',1,11);">1Pe 1:11</a>); the redemption by the precious blood of Christ is of "a lamb without blemish and without spot" (<a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>); the priesthood of believers was through Christ (<a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>), who carried up our sins in his body to the tree (<a onClick="return mV(\'1Pe\',2,24);">1Pe 2:24</a> the Revised Version, margin).<P>In the Johannine writings we have the cleansing from sin by the blood of Jesus Christ (<a onClick="return mV(\'1Jo\',1,7);">1Jo 1:7</a>). Christ is said to have laid down His life for us (<a onClick="return mV(\'1Jo\',3,16);">1Jo 3:16</a>). The sacrifice as well as the teaching of Christ is insisted on in the coming by blood as well as by water (<a onClick="return mV(\'1Jo\',5,6);">1Jo 5:6</a>).<P>The appearance of Christ in <a onClick="return mV(\'Rev\',1,13);">Re 1:13</a> is high-priestly; His robe is the talar, the high-priestly garment. The sacrificial place of Christ is indicated by "a Lamb...as though it had been slain" (<a onClick="return mV(\'Rev\',5,6,9,12);">Re 5:6, 9, 12</a>). The repeated title of Christ throughout the Apocalypse is The Lamb.<P>8. Christ\'s Relation to Sin Expressed in Sacrificial Terms:<P>This review of the Scripture teaching on priesthood clearly indicates the development of thought which led to the affirmation of our Lord\'s priestly office. He came to put away sin. The doctrine of sin was intimately associated with the priestly service of the temple. The sacrifices were in some cases sin offerings, and in these there ever appeared, by the function of the blood which is the life, the fatal loss of life by sin, the punishment of which was the withdrawal of the Divine gift of life. The life was always in the sacrifice reserved for God. It was natural therefore when Christ appeared that His work in taking away sin should have been interpreted in the light of sacrificial thought. We find the idea steadily developed in the New Testament. He was the sacrifice, the Lamb of God. The question as to who offered the sacrifice was answered—Himself. Then He became in the conception of apostolic teaching, especially emphasized in the Epistle to the He, the priest as well as the sacrifice. This was at length completely defined in theology of the church, and has generally been accepted as setting forth an important aspect of our Lord\'s redemptive work.<P>VI. Christ\'s Kingly Office.<P>The Breakdown of the Secular Monarchy:<P>The association of rule with the redemption of mankind was early found in Divine revelation. It is in the Protevangelium of <a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>; the covenant with Abraham contains it (<a onClick="return mV(\'Gen\',22,17,18);">Ge 22:17-18</a>); the blessing of Jacob reflects it (<a onClick="return mV(\'Gen\',49,10);">Ge 49:10</a>). After the successive attempts to establish a visible and earthly monarchy, its settlement in the family of David was associated with Divine premonitions of continued and gracious royalty (<a onClick="return mV(\'2Sa\',7,\'18-29\');">2Sa 7:18-29</a>; <a onClick="return mV(\'2Sa\',23,\'1-7\');">23:1-7</a>; <a onClick="return mV(\'Psa\',2,\'1-\');">Psalms 2</a>; <a onClick="return mV(\'Psa\',45,\'1-\');">45</a>; <a onClick="return mV(\'Psa\',72,\'1-\');">72</a>; <a onClick="return mV(\'Psa\',110,\'1-\');">110</a>). The failure of the earthly monarchy and the fatal experiences of the kingdom turned the thought of the devout, especially guided by prophetic testimony, to a coming king who should restore the glory of the Davidic house and the people of Israel. Here and there the conception appears of the more extended reign of the Coming One, and the royal authority finds a growing place in the prophetic Scriptures (<a onClick="return mV(\'Isa\',2,\'1-4\');">Isa 2:1-4</a>; <a onClick="return mV(\'Isa\',9,6,7);">9:6-7</a>; <a onClick="return mV(\'Isa\',11,\'1-10\');">11:1-10</a>; <a onClick="return mV(\'Isa\',42,\'1-4\');">42:1-4</a>; <a onClick="return mV(\'Isa\',52,\'13-15\');">52:13-15</a>; <a onClick="return mV(\'Isa\',53,12);">53:12</a>; <a onClick="return mV(\'Isa\',60,1);">60:1</a>ff; <a onClick="return mV(\'Jer\',23,5,6);">Jer 23:5-6</a>; <a onClick="return mV(\'Jer\',30,\'18-24\');">30:18-24</a>; <a onClick="return mV(\'Dan\',2,44);">Da 2:44</a>; <a onClick="return mV(\'Dan\',7,\'9-14\',27);">7:9-14, 27</a>; <a onClick="return mV(\'Mic\',5,\'1-4\');">Mic 5:1-4</a>; <a onClick="return mV(\'Zec\',3,\'1-\');">Zec 3</a>). The postexilic conception of the king became one of the supreme and most active ideas in the Jewish mind. The reign of the Messiah was to be earthly, and all nations were to be subject to the Jew. The Jews of Palestine seem to have retained the more patriotic and the more material form of the idea (see 1Macc 14:41), while the Egyptian and dispersed Jews began to regard the more spiritual character of the coming Messiah. References to the future blessedness of Israel under the restored royalty do not appear so largely in the Apocrypha writings which it must be remembered reflect chiefly their Egyptian-Jewish sources. Still there are some passages of interest (Baruch 4:21-5; Tobit 13; Ecclesiasticus 35:18,19; 36:11-16; 47:11,22). In the New Testament we have references to the strong ex pectation of the restored royalty and kingdom (<a onClick="return mV(\'Jhn\',1,49);">Joh 1:49</a>; <a onClick="return mV(\'Jhn\',6,15);">6:15</a>; <a onClick="return mV(\'Jhn\',12,\'12-15\');">12:12-15</a>; <a onClick="return mV(\'Act\',1,6);">Ac 1:6</a>). Christ\'s kingship was speedily recognized by those who saw His works of power, and acknowledged His authority. He Himself clearly claimed this authority (<a onClick="return mV(\'Mat\',22,\'43-45\');">Mt 22:43-45</a>; <a onClick="return mV(\'Jhn\',18,36,37);">Joh 18:36-37</a>). It was however not a kingdom based upon material and external power and rule, but on the foundation of truth and righteousness. The Kingdom of Heaven or of God is familiar to every reader of the words of Jesus. It was thus He described the new order which He had come to establish, of which He was to be the Lord and Administrator; not an earthly dominion after the fashion of this world\'s kingdoms; it was to be the rule of mind and of spirit. It was to be extended by ethical forces, and the principle of its authority was centered in Christ Himself. It was to be developed on earth but perfected in the future and eternal life. Some divines have distinguished Christ\'s regal power as that of nature, that of grace, that of glory. Many believe that there is to be a personal visible reign of Christ upon the earth. Some hold that this will be produced by His advent prior to an age of millennial glory. Other views regard the advent as the close of earthly conditions and the final judgment.<P>VII. The Messianic Basis of the Threefold Office of the Lord.<P>That the developments of Jewish thought centered round what may conveniently be called the idea of the Messiah is plain to any student of the Old Testament and other Jewish writings. They sprang from the ethical and theological ideas of this people, interpreted by and expressed in their political and religious forms, and continually nurtured by their experiences in the varied course of their national life. The essence of Messianic belief was a personal deliverer. Jewish history had always been marked by the appearance and the exploits of a great man. The capacity of the production of exceptional and creative individuals has been the characteristic of the race in all its ages. A judge, a lawgiver, a teacher, a seer, a king—each had helped, or even saved the people in some critical period. Each had added to the knowledge of God, whether received or rejected by the people. The issues of such service had remained, enshrined in a growing liturgy, or made permanent in a finally centralized and unified ritual, recorded in chronicle and lyric. The hope of Israel at one time did not take the completely personal form; indeed, it is probably easy to exaggerate the Messianic element as we look back from the perfect realization of it, in the Christian revelation and history. Much that has been called Messianic has been the result of reading into the Old Testament what has been derived from Christian thought and experience. Zephaniah has been described as a picture of Israel\'s restoration and triumph. Yet apparently it has no reference to the personal element. Still the "Messiah" begins to appear in the prophetic writings (see above), especially in the royal elements of His office. It is at this point that the meaning of the term is to be considered. "Yahweh\'s anointed" is found as applied to a king, and is familiar in this use in the Old Testament. But anointing belonged to the priesthood and to the prophetic order, if not actually, at least metaphorically, as sett ing apart (see <a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a>; <a onClick="return mV(\'Psa\',105,15);">Ps 105:15</a>; <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>). And the word Messiah (Christ) the Anointed, came to be used for that conception of a person, perhaps first employed definitely (<a onClick="return mV(\'Dan\',9,\'24-26\');">Da 9:24-26</a>), who should be the Deliverer of the Jews and even still more widely, a Redeemer. In the age immediately preceding the Christian, the idea had taken possession not only of the Jews, but also of the Samaritans (<a onClick="return mV(\'Jhn\',4,25);">Joh 4:25</a>); and was not altogether unknown in Gentile thought; e.g. Sib Or, iii.97; Virgil Ecl. iv. It involves certainly the prophetic and royal offices and, in the idea of a Suffering Servant, was closely allied to the objects of the sacrificial order.<P>The claim of Jesus to be the Christ, and the recognition of this claim by His followers and apostles, gave a new meaning to the teaching of the Old Testament, and the writings lying outside the canon, but which were familiar to the people. Especially was the suffering and death of the Lord and its relation to sin the occasion of a new Understanding of the Mosaic and later-developed sacrificial system. Jesus as the Offerer of Himself perfected the function of the priest, as He became the Lamb of God who taketh away the sins of the world. He thus completed the threefold ministry of the Messiah as the Prophet who reveals, the Priest who offers and intercedes, the King who rules. In Him the offices are commingled. He rules by His sacrifice and His teaching; He reveals by His Kingship and His offering. The offices spring from both His person and His work, and are united in the final issue of the salvation of the world.<P>LITERATURE.<P>Euseb., HE, I, 3; Aug., De civ. Dei, x. 6; Catech. Council of Trent; Calvin, Instit., II, 15; Heidelb. Catech. Ans. 31 and Reformed Liturg; Thanksgiving aft. Inft. Bapt.; J. Gerhard, Loci Theolog; Spener, Catechism.; Ernesti, De officio Christi triplici; Knapp, Theology, section 107; Ebrard, Herzog Realencyc., under the word Further discussion is found in the standard theologies, as Pye Smith, First Lines, and Scrip. Teatim. to the Messiah; Hodge, Shedd, Weiss, Biblical Theol. of the New Testament, Van Oosterzee, Christian Dogmatics. See also Higginson, Ecce Messias; Moule\'s brief but suggestive statement in Outlines of Christian Doctrine; Ritschl, A Critical History of the Christian Doctrine of Justification and Reconciliation, especially Introduction; Dorner, The Development of the Doctrine of the Person of Christ.``14';
isbe[2087]='Christ, Person of``<a href="./study/isbe/search.html?string=PERSON+OF+CHRIST">PERSON OF CHRIST</a>`1';
isbe[2088]='Christ, Temptation of``<a href="./study/isbe/search.html?string=TEMPTATION+OF+CHRIST">TEMPTATION OF CHRIST</a>`1';
isbe[2089]='Christ, the Exaltation of`egz-ol-ta\'-shun:<P><b>I. THE RESURRECTION</b><P class="in15">1. Its Glorification of Christ<P class="in15">2. Resurrection Body—Identity, Change, Present Locality<P class="in15">3. The Agent of the Resurrection<P><b>II. ASCENSION OF OUR LORD</b><P class="in15">1. Its Actuality<P class="in15">2. General Doctrine of the Church<P class="in15">3. Lutheran Doctrine<P class="in15">4. Theory of Laying Aside the Existence-Form of God<P class="in15">5. Necessity<P><b>III. EXALTATION TO THE RIGHT HAND OF GOD</b><P class="in15">1. Its Significance<P class="in15">2. Its Essential Necessity<P><b>V. THE SECOND ADVENT</b><P class="in15">1. Reality<P class="in15">2. Judgment<hr /><P>This term is given to that condition of blessedness, glory and dominion into which our Lord entered after the completion of His earthly career of humiliation and suffering, and which is to be regarded as the reward of His meritorious obedience, and the issue of His victorious struggle, and at the same time the means of His prosecution and completion of His work as Redeemer and Saviour of the world. The classic passage of Scripture, rich in suggestion, and the source of much controversy in the development of Christian theology, is <a onClick="return mV(\'Phl\',2,\'5-11\');">Php 2:5-11</a>. The word "exalted" of <a onClick="return mV(\'Phl\',2,9);">Php 2:9</a>, huperupsoo, occurs only in this place in the New Testament and, like its Latin representative, is limited to ecclesiastical use. Compare <a onClick="return mV(\'Rom\',14,9);">Ro 14:9</a>; <a onClick="return mV(\'Eph\',1,\'19-23\');">Eph 1:19-23</a>; <a onClick="return mV(\'1Pe\',3,21,22);">1Pe 3:21-22</a>.<P>Christ\'s Exaltation includes His Resurrection, Ascension, Session at the right hand of God, and Advent as Judge and Consummator of the world\'s redemption.<P>I. The Resurrection.<P>1. Its Glorification of Christ:<P>The historic place and validity of this event will be found under other heads; our concern is with the event as it relates to the glorification of our Lord.<P>(1) It revealed His power over death.<P>(2) It confirms all His claims to Divine Sonship.<P>(3) It attests His acceptance and that of His work by God.<P>(4) It crowns the process of the redemption of the world.<P>(5) It forms the beginning of that new creation which is life eternal, and over which death can have no power.<P>(6) It is the entrance of the Son of God into the power and glory of the New Kingdom, or the restored Kingdom of the Sovereign Ruler of the Universe.<P>The following Scriptures among many others may be consulted: <a onClick="return mV(\'Rev\',1,18);">Re 1:18</a>; <a onClick="return mV(\'Act\',2,24);">Ac 2:24</a>; <a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>; <a onClick="return mV(\'1Cr\',15,20);">1Co 15:20</a>; <a onClick="return mV(\'Jhn\',5,25);">Joh 5:25</a>; <a onClick="return mV(\'Rom\',4,25);">Ro 4:25</a>; <a onClick="return mV(\'Rom\',6,4,5);">Ro 6:4-5</a>; <a onClick="return mV(\'Col\',2,12);">Col 2:12</a>; <a onClick="return mV(\'Phl\',3,10);">Php 3:10</a>; <a onClick="return mV(\'Rom\',6,9);">Ro 6:9</a>.<P>2. Resurrection Body—Identity, Change, Present Locality:<P>An interesting and important question arises in connection with Christ\'s exaltation, relating to the nature of the body of the risen Lord. It was clearly identical with that of His natural life. It was recognized by the marks which were upon it: <a onClick="return mV(\'Luk\',24,39,40);">Lu 24:39-40</a>; <a onClick="return mV(\'Jhn\',20,\'24-29\');">Joh 20:24-29</a>. It received food: <a onClick="return mV(\'Luk\',24,43);">Lu 24:43</a> (compare <a onClick="return mV(\'Luk\',24,30);">Lu 24:30</a>; <a onClick="return mV(\'Jhn\',21,12,13);">Joh 21:12-13</a>; <a onClick="return mV(\'Act\',10,41);">Ac 10:41</a>). Nevertheless it was changed. After the resurrection, it was not at once recognized: <a onClick="return mV(\'Jhn\',20,15);">Joh 20:15</a>; <a onClick="return mV(\'Jhn\',21,7);">21:7</a>; <a onClick="return mV(\'Luk\',24,31);">Lu 24:31</a>. It appeared under apparently new conditions of relation to material substance: <a onClick="return mV(\'Jhn\',20,19);">Joh 20:19</a>; <a onClick="return mV(\'Luk\',24,36);">Lu 24:36</a>. It suddenly became visible, and as suddenly vanished. These facts suggest what reverently may be surmised as to its exalted condition. The apostle\'s declaration as to the resurrection-body of the redeemed furnishes some hints: <a onClick="return mV(\'1Cr\',15,\'35-49\');">1Co 15:35-49</a>; compare <a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>. We may cautiously, from the history of the resurrection and the Pauline doctrine, conclude, that our Lord still possesses a human body. It is of material substance, with new properties. It occupies space. It was seen by Paul, by Stephen, by the seer of the Apocalypse. It is glorious, incorruptible, spiritual.<P>3. The Agent of the Resurrection:<P>By whom was the resurrection effected? It is referred by some Scriptures to God. See <a onClick="return mV(\'Psa\',16,10);">Ps 16:10</a> (compare <a onClick="return mV(\'Act\',2,27,31);">Ac 2:27, 31</a>); and the distinct affirmation by Peter (<a onClick="return mV(\'Act\',2,32);">Ac 2:32</a>). Paul declares that Christ was "raised...through the glory of the Father" (<a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>). In <a onClick="return mV(\'Eph\',1,19,20);">Eph 1:19-20</a>, it was the mighty power of God which was wrought in Christ "when he raised him from the dead." Elsewhere it is ascribed to Christ Himself. He declared: "Destroy this temple, and in three days I will raise it up" (<a onClick="return mV(\'Jhn\',2,19);">Joh 2:19</a>). In <a onClick="return mV(\'Jhn\',10,17,18);">Joh 10:17-18</a>, our Lord declares: "I lay down my life, that I may take it again. No one taketh it away from me, but I lay it down of myself. I have power to lay it down, and I have power to take it again." The efficient agent is said, according to the generally received reading of <a onClick="return mV(\'Rom\',8,2);">Ro 8:2</a>, to have been the Spirit of God, and thus the resurrection is referred to each person of the Godhead. The doctrine of the Lutheran church refers the act to the human power of the Lord Himself, which by incarnation had been endowed with attributes of Deity. This view consists with their teaching of the omnipresence of the body of Jesus (see below on the section "Ascension").<P>II. The Ascension of our Lord.<P>1. Its Actuality:<P>The exaltation of Christ consisted further in His ascension. Some have held that the resurrection and ascension of Jesus ought to be regarded as aspects of the same event. But Mary saw the risen Lord, though she was forbidden to touch Him, for "I am not yet ascended unto the Father: but go unto my brethren, and say to them, I ascend," etc. (<a onClick="return mV(\'Jhn\',20,17);">Joh 20:17</a>). This, compared with the invitation to Thomas to touch Him, eight days later, suggests something in the ascension added to that which the resurrection implied, and the general thought of the church has consistently regarded the latter as a further step in the exaltation of the Lord.<P>2. General Doctrine of the Church:<P>The fact of ascension is recorded in <a onClick="return mV(\'Mar\',16,19);">Mr 16:19</a>, and <a onClick="return mV(\'Luk\',24,50,51);">Lu 24:50-51</a>, and with greater detail in <a onClick="return mV(\'Act\',1,9,10,11);">Ac 1:9-11</a>. According to these accounts, the ascension was seen by the disciples, and this suggests that heaven is a locality, where are the angels, who are not ubiquitous, and where Christ\'s disciples will find the place which He declared He was going to prepare for them (<a onClick="return mV(\'Jhn\',14,2);">Joh 14:2</a>). Heaven is also undoubtedly referred to as a state (<a onClick="return mV(\'Eph\',2,6);">Eph 2:6</a>; <a onClick="return mV(\'Phl\',3,20);">Php 3:20</a>), but Christ\'s body must be in some place, and where He is, there is Heaven.<P>3. Lutheran Doctrine:<P>This is certainly the doctrine of the church in general, and seems to be consistent with the Scriptural teaching. But the Lutherans have maintained that the ascension of the Lord merely involved a change of state in the human nature of Christ. He possessed during His life on earth the Divine attributes of omnipresence, omnipotence and omniscience, but He voluntarily abstained from their exercise. But at His ascension He returned to the full use of these powers. The ascension is Christ\'s return to immensity. The community of natures gave these Divine qualities to the humanity of Jesus, which Luther declared involved its ubiquity, and that as He was at the right hand of God, and God was everywhere, so Christ in His human personality was in no specific place but everywhere. This omnipresence is not of the infinite extension of the body of the Lord, but He is present as God is everywhere present in knowledge and power.<P>4. Theory of Laying Aside the Existence-Form of God:<P>Another theory of the ascended humanity-of the Lord depends upon the conception of the Son of God laying aside at incarnation the "existence-form of God," and while affirming that Christ\'s body is now in a definite place, it proceeds to hold that at the ascension the accidental and variable qualities of humanity were laid aside, and that He dwells in heaven as a glorified man. Ebrard says: "He has laid aside forever the existence form of God, and assumed that of man in perpetuity, in which form by His Spirit He governs the church and the world. He is thus dynamically present to all His people." This form of doctrine seems to involve as the result of the incarnation of the Son of God His complete and sole humanity. He is no more than a man. The Logos is no longer God, and as the ascension did not involve the reassumption of the "existence-form of God," Christ in glory is only a glorified man.<P>5. Necessity:<P>The ascension was necessary, in conformity with the spiritual character of the kingdom which Christ founded. Its life is that of faith, not sight. A perpetual life of even the resurrected Christ on earth would have been wholly inconsistent with the spiritual nature of the new order. The return of Christ to the special presence of God was also part of His high-priestly service (see <a href="./study/isbe/search.html?string=CHRIST,+OFFICES+OF">CHRIST, OFFICES OF</a>) and His corporal absence from His people was the condition of that gift of the Spirit by which salvation was to be secured to each believer and promulgated throughout the world, as declared by Himself (<a onClick="return mV(\'Jhn\',16,7);">Joh 16:7</a>). Finally, the ascension was that physical departure of the Lord to the place which He was to prepare for His people (<a onClick="return mV(\'Jhn\',14,2,3);">Joh 14:2-3</a>). The resurrection was this completion of the objective conditions of redemption. The ascension was the initial step in the carrying out of redemptive work in the final salvation of mankind.<P>III. Exaltation Completed at the Right Hand of God.<P>1. Its Significance:<P>The term "the right hand of God" is Scriptural (<a onClick="return mV(\'Act\',7,55,56);">Ac 7:55-56</a>; <a onClick="return mV(\'Rom\',8,34);">Ro 8:34</a>; <a onClick="return mV(\'Eph\',1,20);">Eph 1:20</a>; <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>; <a onClick="return mV(\'Hbr\',10,12);">10:12</a>; <a onClick="return mV(\'Hbr\',12,2);">12:2</a>; <a onClick="return mV(\'1Pe\',3,22);">1Pe 3:22</a>) and expresses the final step in the Lord\'s exaltation. Care must be taken in the use of the expression. It is a figure to express the association of Christ with God in glory and power. It must not be employed as by Luther to denote the relation of the body of Christ to space, neither must it be limited to the Divine nature of the Logos reinstated in the conditions laid aside in incarnation. Christ thus glorified is the God-man, theanthropic person, Divine and human.<P>2. Its Essential Necessity:<P>This exaltation is based upon the essential glory of the Son of God, who "being the brightness of his glory and the express image of his person...sat down on the right hand" (<a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a> the King James Version). It is the claim which the Lord makes for Himself in His prayer (<a onClick="return mV(\'Jhn\',17,4,5);">Joh 17:4-5</a>), and is thus specifically declared in <a onClick="return mV(\'Phl\',2,\'6-11\');">Php 2:6-11</a>: "God highly exalted Him." But in His glory Christ received the power universal and Divine. In <a onClick="return mV(\'Eph\',1,\'20-22\');">Eph 1:20-22</a> His supreme dignity and power are affirmed "far above...every name," "all things...under His feet" (compare <a onClick="return mV(\'Hbr\',2,8);">Heb 2:8</a>; <a onClick="return mV(\'1Cr\',15,27);">1Co 15:27</a>; <a onClick="return mV(\'1Pe\',3,22);">1Pe 3:22</a>). Christ at the "right hand of God" is the highly suggestive picture of His universal dominion asserted by Himself (<a onClick="return mV(\'Mat\',28,18);">Mt 28:18</a>): "All authority hath been given unto me in heaven and on earth." It is vain to speculate upon the relation of Christ\'s nature in this exalted state. We cannot distinguish between the human and Divine. We can only believe in, and trust and submit to the One Glorified Person who thus administers the kingdom in perfect harmony with its Divine laws in all the ages, and His own revelation of the will of God, as given to man in His own earthly career: pitiful, tender, serving, helping, restoring, saving, triumphant. The exaltation is for His mediatorial and finally saving work. He is the Head of His church; He is the Lord of angels and men; He is the Master of the ages.<P>IV. The Second Advent.<P>The exaltation of Christ is to be completed by His coming again at the close of the dispensation, to complete His redemptive work and judge the world, and so to establish the final Kingdom of God. This belief has found a place in all the ecumenical symbols. Theology has ever included it in its eschatology. It is clear that the apostles and the early church expected the second coming of the Lord as an immediate event, the significance of which, and especially the effect of the nonfulfillment of which expectation, does not fall within the province of this article to consider. The various theories of the Parousia, the different ideas as to the time and the form of the second Advent, do not concern its relation to the exaltation of the Lord. Whenever and however He may return; whether He is ever coming to the church and to the world, His visible or His spiritual presence, do not affect the fact that He has been exalted to the position of ultimate Lord and final judge of men. We may therefore define this crowning condition of exaltation as:<P>1. Reality:<P>An advent, real, personal and visible. We must guard against the extremes of limiting this advent on the one side to a final particular event, on the other to those critical and catastrophic movements in world history which have led to the extension of God\'s kingdom and a virtual judgment of men. The Lord is ever coming, and also He will return. See <a onClick="return mV(\'Act\',1,11);">Ac 1:11</a>; <a onClick="return mV(\'Luk\',17,24);">Lu 17:24</a>; <a onClick="return mV(\'Mat\',24,30);">Mt 24:30</a>; <a onClick="return mV(\'Mat\',25,31);">25:31</a>; <a onClick="return mV(\'Luk\',19,12);">Lu 19:12</a>; <a onClick="return mV(\'Mat\',13,40,41,49);">Mt 13:40-41, 49</a>; <a onClick="return mV(\'Luk\',18,8);">Lu 18:8</a>; <a onClick="return mV(\'Jhn\',5,28,29);">Joh 5:28-29</a>; <a onClick="return mV(\'Jhn\',6,40,54);">6:40, 54</a>; <a onClick="return mV(\'Jhn\',21,22);">21:22</a>; <a onClick="return mV(\'Act\',3,20);">Ac 3:20</a>; <a onClick="return mV(\'2Th\',1,10);">2Th 1:10</a>; <a onClick="return mV(\'Hbr\',9,28);">Heb 9:28</a>; <a onClick="return mV(\'Jam\',5,8);">Jas 5:8</a>; <a onClick="return mV(\'Jud\',1,14);">Jude 1:14</a>; <a onClick="return mV(\'1Jo\',2,28);">1Jo 2:28</a>; <a onClick="return mV(\'Rev\',1,7);">Re 1:7</a>. The reality and visibility of the advent depend upon the personal and abiding relation of the Lord to the world-redemption. Christianity is not merely a spiritual dynamic drawn from a series of past events. It is the living relation of the complete humanity of the redeemed to the God man, and must therefore be consummated in a spiritual and material form. The ultimate of Christianity is no more docetic than was its original. A reverent faith will be satisfied with the fact of the glory whenever it shall arrive. The form and time are unrevealed. Preparation and readiness are better than speculation and imaginary description.<P>2. Judgment:<P>The Judgment is clearly taught by Scripture. our Lord declares that He is appointed Judge. (<a onClick="return mV(\'Jhn\',5,22);">Joh 5:22</a>; <a onClick="return mV(\'Jhn\',9,39);">9:39</a>). Paul teaches that we must "all stand before the judgment- seat of God" (<a onClick="return mV(\'Rom\',14,10);">Ro 14:10</a>). Here again there is the suggestion of the judgment which is ever being made by the Lord in His office as Sovereign and Administrator of the kingdom; but there is also the expectation of a definite and final act of separation and discernment. Whatever may be the form of this judgment (and here again a wise and reverent silence as to the unrevealed is a becoming attitude for the believer), we are sure that He who will make it, is the glorified Word incarnate, and it will be the judgment of a wisdom and justice and love that will be the complete glory of the Christ.`<a href="./study/isbe/search.html?string=ASCENSION">ASCENSION</a>; <a href="./study/isbe/search.html?string=JUDGMENT">JUDGMENT</a>; <a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>; <a href="./study/isbe/search.html?string=RESURRECTION">RESURRECTION</a>`14';
isbe[2090]='Christian`kris\'-chan, kris\'-ti-an (Christianos):<P>1. Historicity of <span class="noTag">Ac 11:26</span><P>2. Of Pagan Origin<P>3. The Christian Attitude to the Name<P>4. Was "Christian" the Original Form?<P>5. The Christians and the Empire<P>6. Social Standing of the Early Christians<P>7. Christian Self-Designations<P>LITERATURE<hr /><P>1. Historicity of <a onClick="return mV(\'Act\',11,26);">Ac 11:26</a>:<P>The word Christian occurs only three times in the New Testament (<a onClick="return mV(\'Act\',11,26);">Ac 11:26</a>; <a onClick="return mV(\'Act\',26,28);">26:28</a>; and <a onClick="return mV(\'1Pe\',4,16);">1Pe 4:16</a>). The first passage, <a onClick="return mV(\'Act\',11,26);">Ac 11:26</a>, gives the origin of the term, "The disciples were called Christians first in Antioch." The older generation of critical scholars disputed the historicity of this statement. It was argued that, had the term originated so early, it must have been found far more frequently in the records of early Christianity; sometimes also that the termination -ianus points to a Latin origin. But there is general agreement now that these objections are groundless. The historicity of the Lukan account is upheld not only by Harnack, but by the more radical Knopf in Die Schriften des New Testament, edited by Johannes Weiss. In early imperial times, the adjectival termination -ianos was widely diffused throughout the whole empire. Originally applied to the slaves belonging to the great households, it had passed into regular use to denote the adherents of an individual or a party. A Christian is thus simply an adherent of Christ. The name belongs, as Ramsay says, to the popular slang, as indeed sect and party names generally do. It is only after a considerable interval, and very often under protest, that such names are accepted as self-designations.<P>2. Of Pagan Origin:<P>The name, then, did not originate with the Christians themselves. Nor would the Jews have applied it to the followers of Jesus, whose claim to be the Christ they opposed so passionately. They spoke of the Christians as "the sect of the Nazarenes" (<a onClick="return mV(\'Act\',24,5);">Ac 24:5</a>); perhaps also as "Galileans," a term which the emperor Julian attempted later vainly to revive. The word must have been coined by the heathen population of Antioch, as the church emerged from the synagogue, and a Christianity predominantly Gentile took its place among the religions of the world.<P>3. The Christian Attitude to the Name:<P>Perhaps the earliest occurrence of Christian as a self-designation is in Didache 12:4. In the Apologists and Ignatius on the other hand the word is in regular use. 1 Peter simply takes it over from the anti-Christian judicial procedure of the law courts, without in any way implying that the Christians used it among themselves. There is every probability, however, that it was the danger which thus began at an early date to attach to the name which commended it to the Christians themselves as a title of honor. Deissmann (Licht vom Osten, 286) suggests that Christian means slave of Christ, as Caesarian means slave of Caesar. But the word can scarcely have had that fullness of meaning till the Christians themselves had come to be proud of it.<P>According to tradition, Luke himself belonged to Antioch. In <a onClick="return mV(\'Act\',11,27,28);">Ac 11:27-28</a> Codex Bezae (D) reads "There was much rejoicing, and when we had assembled, there stood up," etc. In view of the greater authority now so frequently accorded to the so-called Western text, we cannot summarily dispose of such a reading as an interpolation. If the historian was not only an Antiochene, but a member of the original GentileChristian church, we have the explanation alike of his interest in the origin of the name Chris tian, and of the detailed precision of his information.<P>4. Was "Christian" the Original Form?:<P>In all three New Testament passages the uncorrected Codex Sinaiticus reads "Chrestian." We know from many sources that this variant was widely current in the 2nd century. Blass in his edition of Acts not only consistently reads "Chrestian," but conjectures that "Chrestian" is the correct reading in Tacitus (Annals, xv.44), the earliest extra- Biblical testimony to the word. The Tacitus manuscript has since been published in facsimile. This has shown, according to Harnack (Mission and Expansion (English translation), I, 413, 414), that "Chrestian" actually was the original reading, though the name "Christ" is correctly given. Harnack accordingly thinks that the Latin historian intended to correct the popular appellation of circa 64 AD, in the light of his own more accurate knowledge. "The common people used to call them \'Chrestians,\' but the real name of their founder was Christ." Be this as it may, a confusion between "Christos" (Christos) and the familiar Greek slave name "Chrestos" (chrestos is more intelligible at an early date than late r, when Christianity was better known). There must have been a strong tendency to conform the earlier witnesses to the later, familiar, and etymologically correct, usage. It is all the more remarkable, therefore, that the original scribe of Codex Sinaiticus retains "Chrestian." On the whole it seems probable that this designation, though bestowed in error, was the original one.<P>5. The Christians and the Empire:<P>The fuller discussion of this subject more appropriately falls under the articles dealing with the relation of the church and empire. Suffice it here to say that Paul apparently hoped that by his acquittal the legal position of Christianity as a religio licita would be established throughout the empire, and that 1 Peter belongs to a time when the mere profession of Christianity was a crime in the eyes of the state, but that in all probability this was a new position of affairs.<P>6. Social Standing of the Early Christians:<P>That early Christianity was essentially a movement among the lower non-literary classes has been rightly emphasized—above all by Deissmann. This is a circumstance of the utmost importance for the correct understanding of the early history of our faith, though probably Deissmann in some degree exaggerates and misplaces the significance. Is it correct to say, for example, that "primitive Christianity was relatively indifferent to politics, not as Christianity, but as a movement of the humbler folks, whose lot on the whole had certainly been lightened by the Empire" (Licht vom Osten, 254)? Very probably however the difficulties of the Pauline Gentile mission were appreciably increased by the fact that he touched a lower social stratum than that of the original Jewish Christianity of Palestine. No class more resents being associated in any way with the "submerged masses" than the self-respecting peasant or artisan, who seems to have formed the backbone of the Palestine church. The apostle had conseq uently to fight against social, no less than racial and religious, prejudices.<P>7. Christian Self-Designations:<P>The Christians originally called themselves "Disciples," a term afterward restricted to personal hearers of the Lord, and regarded as a title of high distinction. The ordinary self-designations of the apostolic age are "believers" (<a onClick="return mV(\'Act\',5,14);">Ac 5:14</a>; <a onClick="return mV(\'1Ti\',4,12);">1Ti 4:12</a>), "saints" (<a onClick="return mV(\'Act\',9,13,32,41);">Ac 9:13, 32, 41</a>; <a onClick="return mV(\'Rom\',1,7);">Ro 1:7</a>), "brethren" (<a onClick="return mV(\'Act\',6,3);">Ac 6:3</a>; <a onClick="return mV(\'Act\',10,23);">10:23</a>, etc.), "the elect" (<a onClick="return mV(\'Col\',3,12);">Col 3:12</a>; <a onClick="return mV(\'2Ti\',2,10);">2Ti 2:10</a>), "the church of God" (<a onClick="return mV(\'Act\',20,28);">Ac 20:28</a> margin), "servants (slaves) to God" (<a onClick="return mV(\'Rom\',6,22);">Ro 6:22</a>; <a onClick="return mV(\'1Pe\',2,16);">1Pe 2:16</a>). The apostolic authors refer to themselves as "servants (slaves) of Christ Jesus" (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>). Other expressions are occasionally met with, of which perhaps the most significant is: Those "that call upon the name of the Lord" (<a onClick="return mV(\'Act\',9,14);">Ac 9:14</a>; <a onClick="return mV(\'Rom\',10,12,13);">Ro 10:12-13</a>; <a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>). Compare Pliny\'s report to Trajan (Epistles, X, 97): "They affirmed that...they had been wont to assemble and address a hymn to Christ as to a god."<P>LITERATURE.<P>The most recent discussion of the names of Christian believers, including "Christian," is in Harnack\'s Mission and Expansion of Christianity, English translation (2nd edition, 1908), I, 399ff. See also EB, HDB, DCG, with the lit. there cited. On the social status of the early Christians, compare Orr\'s Neglected Factors in the Study of the Early Progress of Christianity; on the religious significance of the name.`<a href="./study/isbe/search.html?string=CHRISTIANITY">CHRISTIANITY</a>`40';
isbe[2091]='Christianity`kris-chan\'-i-ti, kris-chi-an\'-i-ti, kris-ti-an\'-i-ti (Christianismos):<P><b>I. IN PRINCIPLE AND ESSENCE</b><P class="in15">1. Early Use of Term<P class="in15">2. New Testament Implications:<P class="in60">Messiahship—Resurrection—Redemption<P class="in60">Pauline Summaries<P class="in15">3. Did Jesus Claim to Be Christ?<P class="in15">4. The Resurrection<P class="in30">Its Evidence<P class="in15">5. Two Contrasted Estimates of our Lord\'s Person<P class="in30">(1) The Non-Believing Estimate—not Truly Historical<P class="in30">(2) The Believing Estimate—Relation to Experience<P class="in15">6. Christianity an Experience of Salvation<P class="in15">7. Jesus and the Gospel<P class="in15">8. New Testament Types of Doctrines<P class="in15">9. Naturalistic Interpretations—the Religio-Historic School<P><b>II. HISTORICAL AND DOCTRINAL</b><P class="in15">1. "Religion of Christ" and "The Christian Religion"<P class="in30">(1) The Historical Jesus Is Supernatural<P class="in30">(2) Essence of Christianity in Redemption<P class="in15">2. Modern Definitions<P class="in30">(1) Schleiermacher<P class="in30">(2) Ritschl<P class="in15">3. Place in Historical Religions<P class="in30">(1) This Place Unique<P class="in30">(2) Universality of Christianity<P class="in30">(3) The Absolute Religion<P class="in30">(4) Religion of Redemption<P class="in15">4. Development and Influence<P class="in30">(1) Expansion of Christianity <P class="in60">(a) Apostolic Age<P class="in60">(b) Succeeding Period<P class="in60">(c) Modern Missions<P class="in30">(2) Doctrinal Shaping<P class="in60">(a) Gnosticism<P class="in60">(b) Monarchianism<P class="in60">(c) Arianism<P class="in60">(d) Sin and Grace<P class="in60">(e) Person of Christ<P class="in60">(f) The Atonement<P class="in60">(g) The Reformation<P class="in60">(h) Lutheran and Reformed<P class="in30">(3) Its Influence<P class="in60">(a) The Ancient World<P class="in60">(b) The Modern World<P class="in60">(c) Testimony of Professor Huxley<P><b>LITERATURE</b><hr /><P>I. In Principle and Essence.<P>1. Early Use of Term:<P>Unlike "Christian" (the King James Version), the term "Christianity," so far as is known, was first used by the Christians themselves, but does not occur in the New Testament. It is exactly parallel to Judaism ("the Jews\' religion"), found not only in <a onClick="return mV(\'Gal\',1,13,14);">Ga 1:13-14</a>, but in 2Macc 2:21, etc. Our earliest authority for the word "Christianism" is Ignatius of Antioch. Christian is now a title of honor, and the Christian\'s glory is "to live according to Christianism" (Ignatius, Ad magnes, 10).<P>2. New Testament Implications: Messiahship—Resurrection—Redemption: While, however, the name is foreign to the New Testament, the New Testament is by universal consent our most important source of information regarding the thing. Christianity arose out of the life and work of Jesus of Nazareth, who claimed to be "the Christ." During Jesus\' lifetime this claim was admitted by a circle of adherents, in whose view, afterwards, it was triumphantly vindicated by His resurrection from the dead. By resurrection He "was declared to be the Son of God with power" (<a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>). With this was united from the first the recognition of Christ as the God-sent Redeemer, through whom has come to the world forgiveness, reconciliation with God and Divine spiritual power.<P>Pauline Summaries.<P>One of the oldest summaries of Christianity is that of Paul in <a onClick="return mV(\'1Cr\',15,3,4);">1Co 15:3-4</a>: "For I delivered unto you first of all that which also I received: that Christ died for our sins according to the scriptures;...and that he hath been raised on the third day according to the scriptures." Of similar purport are the apostle\'s words in <a onClick="return mV(\'2Cr\',5,18,19);">2Co 5:18-19</a>: "God, who reconciled us to himself through Christ, and gave unto us the ministry of reconciliation; to wit, that God was in Christ, reconciling the world unto himself, not reckoning unto them their trespasses." From this reconciliation springs the new life of believers (<a onClick="return mV(\'Rom\',6,\'1-\');">Ro 6</a>; <a onClick="return mV(\'2Cr\',5,\'14-17\');">2Co 5:14-17</a>).<P>3. Did Jesus Claim to Be Christ?:<P>More recently some have denied that Jesus advanced any such claim to Messiahship, but always upon purely arbitrary and subjective grounds. On the one hand these writers have been profoundly impressed by the grandeur of Jesus\' character; on the other they have looked upon the claim to stand in such a unique relation to God and man as unfounded or meaningless. They have sought, accordingly, to escape the difficulty by denying that Jesus regarded Himself as the Anointed of the Lord (thus, e.g. Wrede). Sometimes they have gone the length even of affirming that Jesus was not so regarded by His personal disciples. Divine honors were accorded Him only gradually, as the memory of what He actually was faded away, and an idealization begotten of Christian faith took its place. The notion of Messiah is merely a piece of Jewish folklore. This position in its distinctively modern form has been answered, it seems to us, with absolute conclusiveness, by Professor James Denney in his Jesus and the Gospel. In a historical point of view, nothing in Jesus\' life is more certain than that He regarded Himself as the Christ, the culmination and fulfillment of the Divine revelation given to Israel. This conviction of His is the point round which His whole message revolves. The most recent New Testament theology, that, e.g. of Dr. Paul Feine (1910), rightly starts from Jesus\' Messianic consciousness, and seeks to understand His whole teaching in the light of it. Doubtless, like everything else which Jesus touched, the concept of Messiahship becomes transmuted and glorified in His hands. Our Lord was in no way dependent upon current beliefs and expectations for the content of His Messianic consciousness. But is it likely that His followers, without His authority, would have attributed Messiahship to one so utterly unlike the Messiah of popular fancy?<P>4. The Resurrection:<P>The New Testament proves not only that the Christians from the very outset were fully persuaded, on what they regarded as adequate grounds in history and experience, that their Lord had risen from the dead, but also that this conviction mastered them, giving direction and purpose to their whole lives. Historical Christianity was erected on the foundation of a Risen Lord.<P>Its Evidence.<P>On this point Professor Denney says (Jesus and the Gospel, 111): "The real historical evidence for the resurrection is the fact that it was believed, preached, propagated, and produced its fruit and effect in the new phenomenon of the Christian church, long before any of our gospels were written....Faith in the resurrection was not only prevalent but immensely powerful before any of our New Testament books were written. Not one of them would ever have been written but for that faith. It is not this or that in the New Testament—it is not the story of the empty tomb, or of the appearing of Jesus in Jerusalem or in Galilee—which is the primary evidence for the resurrection: it is the New Testament itself. The life that throbs in it from beginning to end, the life that always fills us again with wonder, as it beats upon us from its pages, is the life which the Risen Saviour has quickened in Christian souls. The evidence for the resurrection of Jesus is the existence of the church in that extraordinary spiritual vitality which confronts us in the New Testament. This is its own explanation of its being."<P>5. Two Contrasted Estimates of our Lord\'s Person:<P>The best Christian thought of our day has no more difficulty than had the apostles in holding and establishing what Principal Forsyth fitly calls "the superhistoric finality of Christ." In the very nature of the case, wherever the problem of our Lord\'s person has been seriously faced, there have always been two distinct estimates of His value, that of assured faith, based upon personal experience of His redemptive power, and that of mere externalism.<P>(1) The Non-Believing Estimate—not Truly Historical:<P>The latter or non-believing estimate has no more right now to call itself "historical" or "scientific," than it had, nearly nineteen hundred years ago, to crucify the Lord of glory. The priests doubtless thought that they understood Jesus better than the ignorant, deluded Galileans. Yet the boldest champion of "the religio-historic method" would scarcely claim that theirs was the correct judgment. As a matter of fact, the so-called critical school are no more free from presuppositions than is the most thoroughgoing traditionalist. Nor have they a monopoly either of historical knowledge or of critical acumen. No truths are accessible to them which are not equally available for the Christian believer. No proof exists, beyond their own unsupported assertions, that they are better interpreters of the common truth. On the other hand, that whole range of experience and conviction intop which the Christian believer finds the supreme assurance of the truth of his religion is to them a sealed book. Surely, then, it is the height of absurdity to maintain that the external, non-believing, estimate of our Lord\'s person is likely to be the more correct one. From the standpoint of Christian faith, such an external estimate is necessarily inadequate, whether it finds expression in a mechanical acceptance of the whole ecclesiastical Christology, or in the denial that such a person as Jesus of Nazareth ever lived.<P>(2) The Believing Estimate—Relation to Experience:<P>The believing estimate of our Lord\'s person is the essence of Christianity as a historical religion. But according to the New Testament this estimate is itself Divinely- inwrought and Divinely attested (<a onClick="return mV(\'Mat\',16,17);">Mt 16:17</a>; <a onClick="return mV(\'1Cr\',12,3);">1Co 12:3</a>; <a onClick="return mV(\'1Jo\',4,2,3);">1Jo 4:2-3</a>). It presupposes the perfect objective self-manifestation of God in Jesus Christ on the one hand, and the subjective appropriation of this revelation by faith on the other. No argument against the reality of the revelation can be built upon the fact, generally acknowle dged by Christian theologians nowadays, that the Deity of our Lord and the supernatural origin of our religion can neither be proved nor disproved independently of one\'s personal attitude to Christianity. This follows necessarily from the nature of the apprehension of Divine truth. Spiritual things are spiritually discerned. There can be no impersonal knowledge of religious, any more than of ethical and aesthetic, truth. In these realms another\'s knowledge has no real meaning for anyone till he has felt its power and tested it in his own experience. Evangelical Christians do not accept the Deity of the Lord as the cardinal article of their religious faith on any merely external authority whether of Scripture or of tradition, or even of His own recorded words apart from experience of Christ. They accept it precisely as they accept the authority of Scripture itself, because of the witness of the Spirit with their spirits. The combined testimony of Scripture and tradition is confirmed in their religious life, when by receiving Jesus as our Lord and Saviour they experience the Christian power. This power is the great experienced reality in the light of which alone the other realities become intelligible. "One thing I know, that, whereas I was blind, now I see" (<a onClick="return mV(\'Jhn\',9,25);">Joh 9:25</a>). "Lord, to whom shall we go? thou hast the words of eternal life" (<a onClick="return mV(\'Jhn\',6,68);">Joh 6:68</a>).<P>6. Christianity an Experience of Salvation:<P>The true church of Christ consists of all who have experienced the power of Christ, delivering them from the guilt, the stain, and the dominion of sin and bringing the peace of God into their souls. Nothing less than this is either the gospel of our Lord and Saviour Jesus Christ, or the historic faith of Christendom, or a religion adequate to human need. The Christian doctrine is partly the assertion of the reality of this power, partly its interpretation. Facts of history and theological propositions are vital to our faith, just in proportion as they are vitally related to this power. The Christian essentials are those elements, historical and dogmatic, without which Christianity would lose in whole or in part its living power to reconcile sinful man to the all-righteous, loving God.<P>7. Jesus and the Gospel:<P>Thus Jesus Himself belongs to His gospel. He is the heart and core of it. Christianity is both a rule of life and a doctrine. But in its inmost nature and being it is neither an ethic, nor a theology, but a religion—a new relation to God and man, Divinely mediated through Jesus Christ in His life, death and resurrection. As many as receive Him, to them gives He the right to become children of God, even to them that believe on His name, who are born not of blood, nor of the will of the flesh, nor of the will of man, but of God (<a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>). He brings man to God by bringing God to man, and the power of God into man\'s sin-stained life.<P>8. New Testament Types of Doctrines:<P>It can scarcely be claimed that New Testament Christianity was in a theological point of view absolutely homogeneous. Various types can be distinguished with more or less clearness; even the ordinary reader feels a difference of theological atmosphere between e.g. Romans and James. This is inevitable, and need occasion no perplexity to Christian faith. All theology is partly interpretation—the relation of universal and eternal reality to personal thought. Hofmann rightly says that genuine Christian faith is one and the same for all, but that everyone must have his own theology, if he is to have any at all. In all genuine serious thought there is a personal element not precisely the same for any two individuals. It is possible to find in the New Testament foreshadowings of all the great distinctive types of historic Christianity. But the essential purpose of the New Testament is to make Christ real to us, to proclaim reconciliation to God through Him, and to convey the Christian power to our lives. The New Testa ment everywhere exhibits the same Christ, and bears witness to the same redeeming, life-transforming power.<P>9. Naturalistic Interpretations—the Religio-Historic School:<P>The attempt has often been made to explain Christianity as the natural product of contemporary forces intellectual and religious—most recently by the so-called "religio- historic school." But at most they have only shown that the form in which the religious concepts of primitive Christianity found articulate expression was to some extent influenced ab extra, and that the earliest Christians were in their general intellectual outlook the children of their own time. They have not proved that the distinctive content of Christianity was derived from any external source. They have not even realized what they have to prove, in order to make good their contention. They have done nothing to account for the Christian power on their principles.<P>LITERATURE.<P>See the New Testament Theologies, especially that of Feine (1910); Seeberg, Fundamental Truths of the Christian Religion (English translation very incorrect, 1908); Seeberg\'s Lehrbuch d. Dogmengeschichte, 2nd edition I, 1908; Brown, Essence of Christianity, New York, 1902; W. N. Clarke, What Shall We Think of Christianity? New York, 1899; above all Denney, Jesus and the Gospel (1909), and Forsyth, Person and Place of Jesus Christ (1909).<P>John Dickie<P>II. Historical and Doctrinal.<P>In its historical and doctrinal relations, developments, and influence, and its connection with the successive phases of human thought, Christianity presents many points of interest, only the more prominent of which can here briefly be touched upon.<P>1. "Religion of Christ" and "The Christian Religion":<P>A convenient starting-point is the well-known distinction of Lessing (Fragment in Works, XI, 242ff) between "the religion of Christ" and "the Christian religion"—a distinction which still exactly marks the attitude to Christianity of the modern so-called "historical" school. By "the religion of Christ" is meant the religion which Christ Himself acknowledged and practiced as man; by "the Christian religion" is meant the view which regards Christ as more than man, and exalts Him as an object of worship. From this standpoint the problem for the historian is to show how the religion of Christ came to develop into the Christian religion—in modern speech, how the "Jesus of history" became the "Christ of faith."<P>(1) The Historical Jesus Is Supernatural.<P>It has already been pointed out (under I above) that the view of Jesus on which the assumed contrast rests is not one truly historical. The fallacy lies in regarding the Jesus of history as simply a man among men—holier, diviner in insight, but not essentially distinguished from the race of which He was a member. This is not the Christ of apostolic faith, but as little is it the picture of the historical Jesus as the Gospels actually present it. There, in His relations alike to God and to man, in His sinlessness, in His origin, claims, relation to Old Testament revelation, judgeship of the world, in His resurrection, exaltation, and sending of the Spirit, Jesus appears in a light which it is impossible to confine within natural or purely human limits. He is the Saviour who stands over against the race He came to save. It is the same fallacy which under-lies the contrast frequently sought to be drawn between the religious standpoints of Christ and Paul. Pau l never for an instant dreamed of putting himself on the same plane with Christ. Paul was sinner; Christ was Saviour. Paul was disciple; Christ was Lord. Paul was weak, struggling man; Christ was Son of God. Jesus achieved redemption; Paul appropriated it. These things involved the widest contrasts in attitude and speech.<P>(2) Essence of Christianity in Redemption.<P>Though, therefore, Christ, in His relations of love and trust to the Father, and perfection of holy character, necessarily ever remains the Great Exemplar to whose image His people are to be conformed (<a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>), in whose steps they are to follow (<a onClick="return mV(\'1Pe\',2,21);">1Pe 2:21</a>), it is not correct to describe Christianity simply as the religion which Christ practiced. Christianity takes into account also the work which Christ came to do, the redemption He achieved, the blessings which, through Him, are bestowed on those who accept Him as their Saviour, and acknowledge Him as their Lord. Essentially Christianity is a religion of redemption; not, therefore, a religion practiced by Jesus for Himself, but one based on a work He has accomplished for others. Experimentally, it may be described as consisting, above all, in the joyful consciousness of redemption from sin and reconciliation to God through Jesus Christ, and in the possession of a new life of sonship and holiness through Christ\'s Spirit. Everything in the way of holy obedience is included here. This, at least, reduced to its simplest terms, is undeniably what Christianity meant for its first preachers and teachers, and what historically it has meant for the church ever since.<P>2. Modern Definitions:<P>Definitions of Christianity are as numerous as the writers who treat of the subject; but one or two definitions may be glanced at as illustrative of the positions above assumed. As modern types, Schleiermacher and Ritschl may be selected in preference to writers of more conspicuous orthodoxy.<P>(1) Schleiermacher:<P>Schleiermacher, in his Der Christliche Glaube, has an interesting definition of Christianity. Christianity he speaks of as "a form of monotheistic faith, of the teleological order of religion (i.e. in which the natural is subordinated to the moral), the peculiarity of which, in distinction from other religions of this type, essentially is, that in it everything is referred to the redemption accomplished through Jesus of Nazareth" (section 11). As, in general, Schleiermacher\'s merit is recognized to lie in his bringing back, in a time of religious decay, the person of Christ to a central place in His religion, so here his true religious feeling is manifested in his fixing on the reference to redemption by Christ as the distinctive thing in Christianity.<P>(2) Ritschl:<P>Ritschl\'s definition is more complicated, and need not here be cited in full (compare his Justification and Reconciliation, III; English translation, 13). The important point is that, like Schleiermacher, Ritschl gives, together with the idea of the kingdom of God, an essential place to the idea of redemption in the conception of Christianity. "Christianity," he says, "so to speak, resembles not a circle described from a single center, but an ellipse which is determined by two foci" (Jb., 11). The idea of the kingdom of God furnishes the teleological, the idea of redemption the religious, element in Christianity. There is truth in this; only it is to be remembered that the kingdom of God, as representing the end, can only, in a world of sin, be into existence through a redemption. Redemption, therefore, still remains the basal conception.<P>3. Place in Historical Religions:<P>In the enlarged view of modern knowledge, Christianity can be no longer regarded in isolation, but is seen to take its place in the long series of historical religions. It appears, like these other religions, in a historical context; has, like some of them, a personal founder; claims, as they also do, or did, the allegiance of multitudes of the population of the world; presents in externals (e.g. the possession of Scriptures), sometimes in ideas, analogies to features in these religions. For this reason, an influential modern school is disposed to treat Christianity, as before it, the religion of Israel, as simply one of these historical religions—"nothing less, but also nothing more"—explaining it from the inherent laws of religious development, and rejecting the idea of any special, authoritative revelation. Sacred books are pitted against sacred books; moral codes against moral codes; Jesus against founders of other religions; gospel stories against legends of the Buddha; ideas like those of the virgin birth, the incarnation, the resurrection, against seeming parallels on other soils. For examination of the principal of these alleged resemblances, see <a href="./study/isbe/search.html?string=COMPARATIVE+RELIGION">COMPARATIVE RELIGION</a>.<P>(1) This Place Unique.<P>Here it is desirable to look at the place of Christianity in the series of historical religions in certain of its wider aspects. The uniqueness of Christ\'s religion, and justification of its claim to a special, Divine origin, will only appear the more clearly from the comparison. In general, it need only be remarked that no other religion in the world has ever even professed to present a plain, historically developed, progressive revelation, advancing through successive stages in the unfolding of a Divine purpose of grace, till it culminates in the appearance of a person, life, character and work, like that of Jesus Christ; not in one single instance.<P>(2) Universality of Christianity.<P>A distinction is commonly made between national and universal religions, and Christianity is classed as one of the three universal religions—the other two being Buddhism and Mohammedanism (compare e.g. Kuenen\'s Hibbert Lectures on National Religions and Universal Religions). There is certainly agreement in the fact that the two religions named with Christianity are not "national" religions; that they are "universal," in the sense in which Christianity is, may be denied. Neither Buddhism nor Mohammedanism has any fitness to become a religion for the world, nor, with all their remarkable extension, have they succeeded in establishing themselves, as Christianity has done, in East and West, in Old World and in New. Mohammed boasted that he would plant his religion wherever the palm tree grew (Palgrave), and this still marks very nearly the range of its conquests. It is not a revivifying influence, but a blight on all higher civilization. It degrades woman, perpetuates slavery, fosters intolerance, and brings no real healing for the spiritual woes of mankind. Buddhism, again, notwithstanding its wide spread in China and neighboring lands, has in it no real spring of moral progress, and is today withering up at the root. Its system of "salvation"—attainment of Nirvana—is not for the many but the few. It has not a message for all men alike. Buddha does not profess that all can accept his method, or ought to be asked to do so. For the multitude it is impossible of attainment. In practice, therefore, instead of one, he has three codes of duty—one for the laity, who continue to live in the world; one for the monks, who do not aspire to Arahatship or sainthood: and one for those who would reach the goal of Nirvana. These last are very few; only two cases are specified, besides Buddha himself, of success in this endeavor. In contrast with these Christianity approves itself as a strictly universal religion—the only religion of its kind in the world. In its doctrines of the one God and Father, and of the brotherhood of all mankind; its teaching on universal need through sin, and universal provision for salvation in Christ; its gospel of reconciliation addressed to all; its pure spirituality in worship and morality; its elevating and emancipating tendency in all the relations of human life, it approves itself as a religion for all sections and races of mankind, for all grades of civilization and stages of culture, appealing to that which is deepest in man, capable of being understood and received by all, and renewing and blessing each one who accepts and obeys it. The history of missions, even among the most degraded races, in all parts of the globe, is the demonstration of this truth. (On the universalism of Christianity, compare Baur, Church History of the First Three Centuries, I, Pt 1.)<P>(3) The Absolute Religion.<P>It is the custom, even in circles where the full supernatural claims of Christianity are not admitted, to speak of Christ\'s religion as, in comparison with others, "the absolute religion," meaning by this that in Christianity the true idea of religion, which in other faiths is only striven after, attains to complete and final expression. Hegel, e.g. speaks of Christianity as the "Absolute or Revealed Religion" in the sense that in it the idea is discovered of the essential unity of God and man (thus also T. H. Green, E. Caird, etc.); others (e.g. Pfleiderer) in the meaning that it expresses the absolute "principle" of religion—a Divine sonship. Christianity also claims for itself, though in a more positive way, to be the absolute religion. It is the final and perfect revelation of God for which not only revelation in Israel, but the whole providential history of the race, was a Divinely ordained preparation (<a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>). It is absolute in the sense that a larger and fulle r revelation than Christ has given is not needed, and is not to be looked for. Not only in this religion is all truth of Nature about God\'s being, attributes and character, with all truth of Old Testament revelation, purely gathered up and preserved, but in the person and work of the incarnate Son a higher and more complete disclosure is made of God\'s Fatherly love and gracious purposes to mankind, and a redemption is presented as actually accomplished adequate to all the needs of a sinful world. Mankind can never hope to attain to a higher idea of God, a truer idea of man, a profounder conception of the end of life, of sin, of duty, a Diviner provision for salvation, a more perfect satisfaction in fellowship with God, a grander hope of eternal life, than is opened to it in the gospel. In this respect again, Christianity stands alone (compare W. Douglas Mackenzie, The Final Faith, a Statement of the Nature and Authority of Christianity as the Religion of the World).<P>(4) Religion of Redemption.<P>A third aspect in which Christianity as a historical religion is sometimes regarded is as a religion of redemption. In this light a comparison is frequently instituted between it and Buddhism, which also in some sort is a religion of redemption. But the comparison brings out only the more conspicuously the unique and original character of the Christian system. Buddhism starts from the conception of the inherent evil and misery of existence, and the salvation it promises as the result of indefinitely prolonged striving through many successive lives is the eternal rest and peace of non-being; Christianity, on the other hand, starts from the conception that everything in its original nature and in the intent of its Creator is good, and that the evil of the world is the result of wrong and perverted development—holds, therefore, that redemption from it is possible by use of appropriate means. And redemption here includes, not merely deliverance from existing evils, but restoration of the Divine likeness which has been lost by man, and ultimate blessedness of the life everlasting. Dr. Boyd Carpenter sums up the contrast thus: "In Buddhism redemption comes from below; in Christianity it is from above; in Buddhism it comes from man; in Christianity it comes from God" (Permanent Elements in Religion, Introduction, 34).<P>4. Development and Influence:<P>Christianity, as an external magnitude, has a long and chequered history, into the details of which it is not the purpose of this article to enter. Ecclesiastical developments are left untouched. But a little may be said of its outward expansion, of the influences that helped to mould its doctrinal forms, and of the influence which it in turn has exercised on the thought and life of the peoples into whose midst it came.<P>(1) Expansion of Christianity.<P>From the first Christianity aimed at being a world-conquering principle. The task it set before itself was stupendous. Its message was not one likely to commend it to either Jew or Greek (<a onClick="return mV(\'1Cr\',1,23);">1Co 1:23</a>). It renounced temporal weapons (in this a contrast with Mohammedanism); had nothing to rely on but the naked truth. Yet from the beginning (<a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>) it had a remarkable reception. Its universal principle was still partially veiled in the Jewish-Christian communities, but with Paul it freed itself from all limitations, and entered on a period of rapid and wide diffusion.<P>(a) Apostolic Age:<P>It is the peculiarity of the Pauline mission, as Professor W. M. Ramsay points out, that it followed the great lines of Roman communication, and aimed at establishing itself in the large cities—the centers of civilization (Church in Roman Empire, 147, etc.). The Book of Acts and the Epistles show how striking were the results. Churches were planted in all the great cities of Asia Minor and Macedonia. In Rome Tacitus testifies that by the time of Nero\'s persecution (64 AD) the Christians were a "great multitude" ("ingens multitudo" (Annals xv.44)).<P>(b) Succeeding Period:<P>Our materials for estimating the progress of Christianity in the post-apostolic age are scanty, but they suffice to show us the church pursuing its way, and casting its spell alike on East and West, in centers of civilization and dim regions of barbarism. In the last quarter of the 2nd century great churches like those of Carthage and Alexandria burst into visibility, and reveal how firm a hold the new religion was taking of the empire. Deadly persecution could not stop this march of the church to victory. From the middle of the 3rd century there is no question that it was progressing by leaps and bounds. This is the period in which Harnack puts its great expansion (Expansion, II, 455, English Translation). On the back of the most relentless persecution it had yet endured, the Diocletian, it suddenly found itself raised by the arms of Constantine to a position of acknowledged supremacy. By this time it had penetrated into all ranks of society, and reckoned among its adherents many of noblest birth.<P>(c) Modern Missions:<P>It is unnecessary to trace the subsequent course of Christianity in its conquest of the northern nations. For a time the zeal for expansion slumbered, but, with the revival of the missionary spirit at the close of the 18th century, a new forward movement began, the effects of which in the various regions of the heathen world are only now beginning to be realized. It is impossible to read without a thrill what was accomplished by the pioneers of Christian missions in the South Seas and other early fields; now the tidings of what is being done in India, China, Japan, Korea, Africa and elsewhere, by Christian preaching and education, awaken even more astonishment. Countries long closed against the gospel are now opened, and the standard of the cross is being carried into all. The church is arousing to its missionary obligations as never before. Still, with all this progress, immense obstacles remain to be overcome. Including all the populations of nominally Christian lands, the adherents of the Christian religion are reckoned to amount only to some 560,000,000, out of a total of over 1,600,000,000 of the population of the world (Hickmann). This looks discouraging, but it is to be remembered that it is the Christian peoples that represent the really progressive portion of the human race.<P>(2) Doctrinal Shaping:<P>The doctrinal shaping of Christianity has taken place largely as the result of conflict with opposing errors. First, as was inevitable, its conflict was waged with that narrowest section of the Jewish-Christian community—the Ebionites of early church history—who, cleaving to circumcision, disowned Paul, and insisted that the Gentiles should observe the law (<a onClick="return mV(\'Gal\',5,13,14);">Ga 5:13-14</a>; see <a href="./study/isbe/search.html?string=EBIONITES">EBIONITES</a>). These, as a party of reaction, were soon left behind, and themselves fell under heretical (Essenian) influences.<P>(a) Gnosticism:<P>A more formidable conflict was that with Gnosticism—the distinctive heresy of the 2nd century, though its beginnings are already within the apostolic age (compare Lightfoot, Colossians). This strange compound of oriental theosophy and ideas borrowed from Christianity (see <a href="./study/isbe/search.html?string=GNOSTICISM">GNOSTICISM</a>) would have dissolved Christ\'s religion into a tissue of fantasies, and all the strength and learning of the Church were needed to combat its influence. Its opposition was overruled for good in leading to a fixing of the earliest creed (see <a href="./study/isbe/search.html?string=APOSTLES\'+CREED">APOSTLES\' CREED</a>), the formation of an authoritative New Testament canon (see <a href="./study/isbe/search.html?string=BIBLE">BIBLE</a>; <a href="./study/isbe/search.html?string=CANON+OF+THE+NEW+TESTAMENT">CANON OF THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=CANON+OF+THE+OLD+TESTAMENT">CANON OF THE OLD TESTAMENT</a>), and the firm assertion of the reality of Christ\'s humanity.<P>(b) Monarchianism:<P>Christianity had now entered the world of Greek thought, and ere long had contests to sustain within its own borders. First came assaults (3rd century) on the idea of the Trinity in what are known as the Monarchian heresies—the assertion that the Father Himself was incarnate and suffered in Christ (Patripassianism), or that the Trinity consisted only in "modes" of the Divine self-revelation (Sabellianism).<P>(c) Arianism:<P>These were hardly repelled when a yet greater danger overtook the church in the outbreak (318 AD) of the violent Arian controversy, the Son Himself being now declared to be a creature, exalted, before all worlds, but not truly of the nature of God. The commotion produced by this controversy led to the summoning of the first ecumenical council--that of Nicea (325 AD), and the framing of the Nicene Creed, affirming the full deity of the Son. A like controversy about the Spirit (the Macedonian, 4th century), led to the confirming of this creed, and adoption of additional clauses, at the Council of Constantinople (381 AD).<P>(d) Sin and Grace:<P>The doctrine of the Trinity was now settled, but new controversies speedily sprang up—in the West on sin and grace (Pelagius and Augustine) (411-18 AD), and in the East in the long series of controversies known as the Christological, bearing on the right apprehension of the person of Christ (4th to 7th centuries): as against Pelagius, who denied original sin, and affirmed man\'s natural ability to keep the whole law of God, Augustine vindicated the complete dependence of man on the grace of God for his salvation.<P>(e) Person of Christ:<P>And as against errors successively denying the reality of a human soul in Jesus (Appollinarianism), dissolving the unity of His person (Nestorianism, condemned at Ephesus, 431 AD), or conversely, fusing together the Divine and human into one nature (Eutychianism, Monophysitism), the church maintained, and embodied in a Creed at Chalcedon (451 AD), the integrity of the two natures, Divine and human, in the one Divine person of the Lord. These decisions are upheld by all branches of the church—Greek, Latin, Protestant.<P>(f) The Atonement:<P>The medieval scholastic period made one great advance in the attempt of Anselm in his Cur Deus Homo (1089) to lay deep the foundations of a doctrine of atonement in
