Ro 8:14</a>). God will be Father to the holy (<a onClick="return mV(\'2Cr\',6,18);">2Co 6:18</a>). The test and mark of the children of God is that they do righteousness and love the brethren (<a onClick="return mV(\'1Jo\',3,10);">1Jo 3:10</a>). They are blameless and harmless, without blemish, in the midst of a crooked and perverse generation (<a onClick="return mV(\'Phl\',2,15);">Php 2:15</a>). Therefore their ideal of life is to be "imitators of God" and to walk in love even as Christ did (<a onClick="return mV(\'Eph\',5,1);">Eph 5:1</a>). Sonship grows to its consummation as the life grows in the likeness of Christ, and the final destiny of all sons is to be ever like Him (<a onClick="return mV(\'1Jo\',3,2);">1Jo 3:2</a>).<P>4. As State of Being, or Ontological Fact:<P>Sonship is properly and primarily a relation, but it may so dominate and transform the whole of a man\'s life, thought and conduct as to become his essential being, the most comprehensive category under which all that he is may be summed up.<P>(1) Essence of Christ\'s Sonship.<P>It is so that the New Testament comprehends the person of Christ. Everything that He did, He did as God\'s son, so that He is the Son, always and ever Son. In the beginning, in the bosom of the Father, He is the <a href="./study/isbe/search.html?string=ONLY+BEGOTTEN">ONLY BEGOTTEN</a> (which see) Son (<a onClick="return mV(\'Jhn\',1,1,18);">Joh 1:1, 18</a>). He is born a Son of God (<a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>). He begins life in the things of His Father (<a onClick="return mV(\'Luk\',2,49);">Lu 2:49</a>). His whole life is that of the beloved Son (<a onClick="return mV(\'Mat\',3,17);">Mt 3:17</a>; <a onClick="return mV(\'Mat\',17,5);">17:5</a>). As Son of God He dies (<a onClick="return mV(\'Mat\',26,63);">Mt 26:63</a>; <a onClick="return mV(\'Luk\',22,70);">Lu 22:70</a>; <a onClick="return mV(\'Mat\',27,40,43);">Mt 27:40, 43</a>; compare <a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a>). In His resurrection He was declared to be the Son of God with power (<a onClick="return mV(\'Rom\',1,4);">Ro 1:4</a>); as Jesus the Son of God He is our great high priest in heaven (<a onClick="return mV(\'Hbr\',4,14);">Heb 4:14</a>), and in the glory of His father He will come to judge in the last day (<a onClick="return mV(\'Mat\',16,27);">Mt 16:27</a>).<P>(2) Men\'s Sonship.<P>Unlike Him, men\'s moral sonship is neither eternal nor universal. Are they therefore sons in any sense always and everywhere? All children are heirs of the kingdom of God and objects of the Father\'s care (<a onClick="return mV(\'Luk\',18,16);">Lu 18:16</a>; <a onClick="return mV(\'Mat\',18,10);">Mt 18:10</a>). But men may turn away from the Father and become unworthy to be called His sons (<a onClick="return mV(\'Luk\',15,13,19);">Lu 15:13, 19</a>). They may become children of the devil (<a onClick="return mV(\'1Jo\',3,10);">1Jo 3:10</a>; <a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>), and children of wrath (<a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>). Then they lose the actuality, but not the potentiality, of sonship. They have not the experience or character of sons, but they are still moral and rational beings made in the image of God, open to the appeal and influence of His love, and able to "rise and go to their Father." They are objects of God\'s love (<a onClick="return mV(\'Jhn\',15,13);">Joh 15:13</a>; <a onClick="return mV(\'Rom\',5,8);">Ro 5:8</a>) and of His gracious search and seeking (<a onClick="return mV(\'Luk\',15,4);">Lu 15:4</a>; <a onClick="return mV(\'Jhn\',11,52);">Joh 11:52</a>). But they are actual sons only when they are led by the Spirit of God (<a onClick="return mV(\'Rom\',8,14);">Ro 8:14</a>); and even so their sonship will only be consummated in the resurrection (<a onClick="return mV(\'Rom\',8,23);">Ro 8:23</a>; <a onClick="return mV(\'Luk\',20,36);">Lu 20:36</a>).<P>5. As Relation to God, or Theological Fact:<P>In the relation of father and son, fatherhood is original and creative. That does not necessarily mean priority in time.<P>(1) Eternal Generation.<P>Origen\'s doctrine of the eternal generation of Christ, by which is meant that God and Christ always stood in the relation of Father and Son to one another, is a just interpretation of the New Testament idea that the Son "was in the beginning with God" (pros ton Theon). But Jesus was conscious of His dependence upon the Father and that His sonship was derived from Him (<a onClick="return mV(\'Jhn\',5,19,36);">Joh 5:19, 36</a>). Still more manifest is it that men derive their sonship from God. He made them for Himself, and whatever in human nature qualifies men to become sons of God is the free gift of God. But men in their sin and disobedience could not come to a knowledge of the Father, had He not "sent forth his Son...that we might receive the adoption of sons" (<a onClick="return mV(\'Gal\',4,4,5);">Ga 4:4-5</a>): "Behold what manner of love the Father hath bestowed upon us, that we should be called children of God" (<a onClick="return mV(\'1Jo\',3,1);">1Jo 3:1</a>); "God so loved the world, that he gave his <a href="./study/isbe/search.html?string=ONLY+BEGOTTEN">only begotten son</a>" (which see) who gave men "the right to become children of God, even to them that believe on his name" (<a onClick="return mV(\'Jhn\',3,16);">Joh 3:16</a>; <a onClick="return mV(\'Jhn\',1,12);">1:12</a>). It is not the children of the flesh but the children of the promise who are children of God (<a onClick="return mV(\'Rom\',9,4);">Ro 9:4</a>). The mere act of birth does not constitute men into children of God, but His covenant of free grace must be added. God being essentially Father made men and the universe, sent His Son and His Spirit, "for the revealing of the sons of God." But they can only know the Father, and realize their sonship when they respond to His manifestation of fatherly love, by faith in God and obedience to Him.<P>(2) The Work of Grace.<P>The question whether sonship is natural and universal or conditional upon grace working through faith, does not admit of a categorical answer. The alternatives are not strict antitheses. God does all things as Father. To endow man with rational and moral nature capable of his becoming a son was an act of love and grace, but its whole purpose can be communicated only in response to faith in Christ. But a natural sonship which is not actual is meaningless. A man\'s moral condition and his attitude toward God are the most essential elements of his nature, for a man\'s nature is just the sum total of his thoughts, acts and states. If these are hostile or indifferent to God, there is nothing left that can have the reality or bear the name of son. For if the word son be used of mere creaturehood and potentiality, that is to give it a meaning entirely different from New Testament usage. All men by nature are potential sons, because God has made them for sonship and does all things to win them into their heritage. Men may be sons of God in a very imperfect and elementary manner. The sharp transitions of Pauline and Johannine theology are rather abstract distinctions for thought than actual descriptions of spiritual processes. But Paul and John also contemplate a growth in sonship, "till we all attain unto the unity of the faith, and of the knowledge of the Son of God, unto a full-grown man, unto the measure of the stature of the fullness of Christ" (<a onClick="return mV(\'Eph\',4,13);">Eph 4:13</a>). For lit. and further discussion, see special articles on <a href="./study/isbe/search.html?string=ADOPTION">ADOPTION</a>; <a href="./study/isbe/search.html?string=GOD">GOD</a>; <a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>.`<a href="./study/isbe/search.html?string=SONS+OF+GOD">SONS OF GOD</a>`145';
isbe[2050]='Children of Israel`iz\'-ra-el (bene yisra\'el): A very common term in both the Old Testament and the New Testament, and it refers to the Israelites as the descendants of a common ancestor, Jacob, whose name was changed to Israel (see <a onClick="return mV(\'Gen\',32,\'24-32\');">Ge 32:24-32</a>). It was customary to designate the members of the various tribes as the children of the one from whom the tribe originated (see <a onClick="return mV(\'Num\',1,\'20-43\');">Nu 1:20-43</a>; <a onClick="return mV(\'Ezr\',2,\'3-61\');">Ezr 2:3-61</a>), and it was natural that the people who boasted of Israel as their ancestor should be designated as his children. The first reference to the descendants of Jacob is found in the account of the changing of Jacob\'s name to Israel, and the purpose is to connect them with the experience in Jacob\'s life which led to the change in his name: "Therefore the children of Israel eat not the sinew of the hip, which is upon the hollow of the thigh, unto this day: because he touched the hollow of Jacob\'s thigh in the sinew of the hip." At the time when this was written "the children of Israel" was a phrase that was commonly applied to the Israelites. In <a onClick="return mV(\'2Ki\',17,34);">2Ki 17:34</a> they are called "the children of Jacob," and this occurs in connection with the account of the changing of Jacob\'s name to Israel and is intended to connect them closely with their father Jacob, who was favored of God.<P>After a time, it is quite likely that the phrase "children of Israel" lost its peculiar significance and was simply one of the popular terms designating the inhabitants of Palestine, but at first it was intended to connect these people with their ancestor Jacob whose name was changed to Israel. The Jews of the New Testament times connected themselves with Abraham rather than with Jacob (see <a onClick="return mV(\'Jhn\',8,39);">Joh 8:39</a>; <a onClick="return mV(\'Rom\',9,7);">Ro 9:7</a>; <a onClick="return mV(\'Gal\',3,7);">Ga 3:7</a>, tekna, or, huioi Abraam).``62';
isbe[2051]='Children of the Bridechamber``<a href="./study/isbe/search.html?string=BRIDE-CHAMBER,+SONS+(CHILDREN)+OF+THE">BRIDE-CHAMBER, SONS</a>`1';
isbe[2052]='Children of the East`est (bene qedhem): A term which in a general way designated the inhabitants of the country east of Palestine The Hebrews thought of their own country as occupying the central place, and of the other parts of the world in relation to this. They spoke of the "queen of the south" (<a onClick="return mV(\'Mat\',12,42);">Mt 12:42</a>), and of the "king of the south" (<a onClick="return mV(\'Dan\',11,5,6);">Da 11:5-6</a>). They spoke of people coming from "the east and the west" and sitting down with the patriarchs (<a onClick="return mV(\'Mat\',8,11);">Mt 8:11</a>).<P>The term "children of the east" seems to have been applied to the inhabitants of any part of the country east of Palestine It is stated that Jacob, when he fled from Esau, "came to the land of the children of the east" (<a onClick="return mV(\'Gen\',29,1);">Ge 29:1</a>), and the place to which he came was Haran in Mesopotamia. In <a onClick="return mV(\'Jer\',49,28);">Jer 49:28</a> the inhabitants of Kedar are called "the children of the east," and in later Jewish literature, Kedar is identified with the Arabs (see <a href="./study/isbe/search.html?string=KEDAR">KEDAR</a>). Job was designated as "the greatest of all the children of the east" (<a onClick="return mV(\'Job\',1,3);">Job 1:3</a>), and the land of Uz was mentioned as his home (<a onClick="return mV(\'Job\',1,1);">Job 1:1</a>). While it is impossible absolutely to locate the land of Uz, it must have been on the edge of the desert which was east of Palestine. The children of the east seem to have been famous for their wisdom. It is said that "Solomon\'s wisdom excelled the wisdom of all the children of the east" (<a onClick="return mV(\'1Ki\',4,30);">1Ki 4:30</a>), and "Wise-men from the east" came to Jerusalem seeking the one that was born king of the Jews (<a onClick="return mV(\'Mat\',2,1);">Mt 2:1</a>).<P>Many of the inhabitants of the east country were regarded as descending from Abraham (see <a onClick="return mV(\'Gen\',25,6);">Ge 25:6</a>), and hence, they were related to Israel.``62';
isbe[2053]='Chileab`kil\'-e-ab (kil\'abh; Dalouia, "restraint of father"): A son of David, born to him at Hebron. His mother was Abigail, whom David married after the death of her husband Nabal, the Carmelite (<a onClick="return mV(\'2Sa\',3,3);">2Sa 3:3</a>). In the corresponding account (<a onClick="return mV(\'1Ch\',3,1);">1Ch 3:1</a>) he is called "Daniel," the meaning of which name ("God is my judge") points to its having been given in order to commemorate God\'s judgment upon Nabal (<a onClick="return mV(\'1Sa\',25,39);">1Sa 25:39</a>; compare <a onClick="return mV(\'Gen\',30,6);">Ge 30:6</a>). Some suppose that he bore both names, but the Septuagint reading here Dalouia (Ch Damniel), and the identity of the last three letters of the Hebrew word "Chileab" with the first three of the following word, seems to indicate that the text of Samuel is corrupt.``197';
isbe[2054]='Chilion`kil’-i-on (kilyon, "pining," "wasting away"): One of the two sons of Elimelech and Naomi, "Mahlon and Chilion, Ephrathites of Bethlehem-judah" (<a onClick="return mV(\'Rth\',1,2);">Ru 1:2</a>). With his mother and brother he came into Moab and there both married Moabite women, Orpah being the name of Chilion’s wife and Ruth that of the wife of Mahlon (<a onClick="return mV(\'Rth\',4,9,10);">Ru 4:9-10</a>). Both died early and Orpah remained in Moab while Ruth accompanied Naomi back to Bethlehem. When Boaz married Ruth he "bought all that was Elimelech’s, and all that was Chilion’s, and Mahlon’s, of the hand of Naomi" (<a onClick="return mV(\'Rth\',4,9);">Ru 4:9</a>).``185';
isbe[2055]='Chilmad`kil\'-mad (kilmadh; Charman): A city or district mentioned after Sheba and Asshur as supplying merchandise to Tyre (<a onClick="return mV(\'Eze\',27,23);">Eze 27:23</a>). By changing "m" into "w" (common in Assytoprian-Babylonian) this has been compared with Kalwadha near Bagdad (G. Smith, Transactions of the Society of Biblical Archaeology, I, 61; Delitzsch, Paradies, 206), but the identification seems improbable. Though regarded as the name of a country in the Septuagint and the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) (Charman; Chelmad), there is some doubt whether this view of the word is correct. The Targum substitutes Madhai, "Media," and on this account Mez (Stadt Harran, 24) amends to Kol Madhai, "all Media." The absence of the copula "and" has caused others to further modify the vocalization, and by reading kelimmudh instead of Chilmad, the sense "Asshur was as the apprentice of thy trading" (Qimchi, Hitzig, Cornill) is obtained, but is not satisfactory. Probably both text and translation are susceptible of improvement.``136';
isbe[2056]='Chimham`kim\'-ham (kimham (<a onClick="return mV(\'2Sa\',19,37,38);">2Sa 19:37-38</a>) or kimhan (<a onClick="return mV(\'2Sa\',19,40);">2Sa 19:40</a>) or kemohem (<a onClick="return mV(\'Jer\',41,17);">Jer 41:17</a> Kt.); this reading, however, may probably be safely ignored): One of the sons of Barzillai the Gileadite, who supported David while the latter was in exile in Mahanaim (<a onClick="return mV(\'2Sa\',19,37);">2Sa 19:37</a>). After the death of Absalom, Barzillai was invited to spend the remainder of his life with the king; but he refused, and sent his son Chimham in his stead. From the mention of "the habitation of Chimham, which is by Beth-lehem" (<a onClick="return mV(\'Jer\',41,17);">Jer 41:17</a> the King James Version), it has been inferred that Chimham received a grant of land from David\'s patrimony at Bethlehem, which retained his name for at least four centuries. It has been suggested that his name was probably Ahinoam (\'achino\'am).``197';
isbe[2057]='Chimney`chim\'-ni.<P>kin\'-e-reth, kin\'-e-roth (kinnereth (<a onClick="return mV(\'Deu\',3,17);">De 3:17</a>; <a onClick="return mV(\'Jos\',19,35);">Jos 19:35</a>, etc.)), (kinaroth; Codex Vaticanus, Kenereth, Codex Alexandrinus, Cheneroth (<a onClick="return mV(\'Jos\',11,2);">Jos 11:2</a>)): Taking the order in which the towns are mentioned, this city seems to have lain north of Rakkath (?Tiberias). It may have occupied the site of el-Mejdel, at the southwest corner of the plain of Gennesaret. From this city the sea took its Old Testament name (<a onClick="return mV(\'Num\',34,11);">Nu 34:11</a>, etc.).`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>; <a href="./study/isbe/search.html?string=CHINNERETH">CHINNERETH</a>`1';
isbe[2058]='Chios`ke\'-os, ki\'-os (Chios): An island belonging to Turkey in the Aegean Sea, south of Lesbos, and very near the mainland of Asia Minor. Paul\'s vessel passed it on his last voyage to Jerusalem (<a onClick="return mV(\'Act\',20,15);">Ac 20:15</a>). The channel here is very picturesque. From Luke\'s expression, "we came the following day over against Chios," it has been conjectured that they were becalmed; more probably it simply means that, because of the dark moon, they lay at anchor for the night on the Asian coast opposite the island (Hastings Dictionary of the Bible, under the word). Herod, when on his way to Agrippa at the Bosphorus, "continued many days at Chios" and conferred many royal benefactions upon the inhabitants (Josephus, Ant, XVI, ii, 2).<P>The soil is sterile (though well cultivated), the climate mild. Earthquakes are frequent. In the mountains (highest 4,000 ft.) beautiful blue marble with white veins, and excellent potter\'s clay, were quarried in antiquity. In modern times large quantities of ochre are mined. The chief industry is the culture of the silkworm, the cocoons being sent to Lyons. Oranges, lemons, almonds, brandy, anise, mastich and leather are also exported. The inhabitants, who are almost entirely Greeks, number about 60,000. The capital, Castro, has a population of 15,000. The place where Homer is said to have collected his pupils around him is still pointed out to the traveler at the foot of Mt. Epos, near the coast. It is in reality (probably) a very old sanctuary of Cybele, the Mother of the Gods. The tragic poet Ion, the historian Theopompus and the sophist Theocritus were natives of Chios. The Chians were especially famous for their skill in telling stories, and for their levity. A familiar proverb says that "it is easier to find a green horse than a sober- minded Sciot" (Conybeare and Howson, XX, 549).<P>The oldest inhabitants of the island were Leleges, Cretans and Carians, who were conquered by the Ionians. The latter made Chios one of the most flourishing states in Ionia. When the Persians overran Asia Minor and oppressed the Greek colonies, the Chians showed a Pan-Hellenic spirit. They surrendered, however, to Cyrus in 546 BC. Nevertheless, 46 years later they joined in the rebellion of Aristagoras against the Persians. In the naval engagement off the island Lade they fought with 100 ships and displayed great bravery. Again they fell into the power of Persia; but after the battle of Mycale (479) the Chians joined the Athenian confederacy. In 412 they sided with the Peloponnesians, in the 19th year of the war which Athens had been waging against Sparta and her allies. For this act of treason the Athenians devastated the island. At the end of the war the Chians revolted from Sparta and, after the battle of Naxos (376), became an ally of Athens once more. Oppressed now by Athens, as she had been by Sparta, Chios made an alliance with Thebes in 363 and defended herself successfully against the Athenian general, Chares; and in 355 Athens was forced to recognize the island\'s independence. Later the Chians became friends of the Romans and in the war with Mithridates were obliged to surrender their ships to the Pontic king and in addition pay him 2,000 talents.<P>In 1307 AD Turkish pirates subjugated and laid waste the island. The Turks themselves became masters of Chios in 1566. In the war of the Greek revolution the Chians joined the Greeks (February 1821) but were overpowered by the Turks. The Pasha decreed that the island should be utterly devastated; 23,000 Chians were massacred and 47,000 sold into slavery. Only 5,000 escaped. A second attempt to regain their freedom was made in 1827, but met with failure. When the kingdom of Greece was established two years later, Chios was not included. On April 3,1881,the island was visited by a terrible earthquake, the city of Castro being almost entirely destroyed.<P>LITERATURE.<P>Conybeare and Howson, The Life and Epistles of Paul; W. M. Ramsay, Paul the Traveler; G. H. Gilbert, The Student\'s Life of Paul (chiefly concerned with the chronology and order of events in Paul\'s life); Eckenbrecher, Die Insel Chios (1845); Pauli, same person (in the Mitteilungen der Geogr. Gesellschaft in Hamburg, 1880-81).``71';
isbe[2059]='Chirp`cherp (tsaphaph): "Chirp" occurs in the King James Version marginand the Revised Version, margin of <a onClick="return mV(\'Isa\',29,4);">Isa 29:4</a>, "Thy voice shall be as of one that hath a familiar spirit, out of the ground, and thy speech shall whisper (margin, "chirp") out of the dust." The reference is to "the sounds made by wizards and ventriloquists, who imitated the chirping of the bats which was supposed to proceed from the Iower world"; hence, for "peep" of the King James Version in <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a> we have "chirp"—"wizards, that chirp and that mutter."<P>Figurative: We have also in <a onClick="return mV(\'Isa\',10,14);">Isa 10:14</a> the Revised Version (British and American), in a figurative allusion to young birds, "chirped" instead of "peeped."`<a href="./study/isbe/search.html?string=CHATTER">CHATTER</a>`185';
isbe[2060]='Chisleu; Chislev`kis\'-lu, kis\'-lev.`<a href="./study/isbe/search.html?string=KISLEV">KISLEV</a>`1';
isbe[2061]='Chislon`kis\'-lon, kiz\'-lon (kiclon, "strength"): A prince of Benjamin, the father of Elidad (<a onClick="return mV(\'Num\',34,21);">Nu 34:21</a>).``1';
isbe[2062]='Chisloth-Tabor`kis-loth-ta\'-bor, kiz\'-loth.`<a href="./study/isbe/search.html?string=CHESULLOTH">CHESULLOTH</a>`1';
isbe[2063]='Chitlish`kit\'-lish (kithlish, "separation"; the King James Version Kithlish, the English Revised Version "Chithlish," kith\'lish): An unidentified town named with Lahman and Gederoth in the Shephelah of Judah (<a onClick="return mV(\'Jos\',15,40);">Jos 15:40</a>).``1';
isbe[2064]='Chittim`kit\'-im.`<a href="./study/isbe/search.html?string=KITTIM">KITTIM</a>`1';
isbe[2065]='Chiun (1)`ki\'-un: Thus Hebrew kiyun, is transliterated in <a onClick="return mV(\'Amo\',5,26);">Am 5:26</a> the King James Version. The vowels represent an assimilation to some such word as shiqquts, "detestable thing," or gillul, "idol" (properly "a filthy thing"), in consonance with the well-known habit of the punctuators (compare molekh, Molech with the vowels of bosheth, "shame"). The Syriac version has preserved the correct vocalization; apparently also the Septuagint, albeit the consonants have suffered corruption (so particularly in the Greek manuscripts of <a onClick="return mV(\'Act\',7,43);">Ac 7:43</a>). There can be no doubt that we should vocalize kewan = the Assyrian Kai(a)-wanu = Kaiamanu by which at least in late Babylonian Saturn was indicated. The passage in Amos refers to the Saturn worship which appears to have been in vogue in the prophet\'s days. The Israelites shall carry with them into exile the images of their gods (render with the margin of the Revised Version (British and American): "Yea, ye shall take up," etc.). The received vocalization is as old as Aquila and Symmachus.``115';
isbe[2066]='Chiun (2)`ki\'-un (<a onClick="return mV(\'Amo\',5,26);">Am 5:26</a> the King James Version): Called in <a onClick="return mV(\'Act\',7,43);">Ac 7:43</a> "Rephan" (Rhemphan) the planet Saturn.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`1';
isbe[2067]='Chloe`klo\'-e (Chloe, "a tender shoot"): A woman, presumably a Christian, mentioned only in <a onClick="return mV(\'1Cr\',1,11);">1Co 1:11</a>. She was a resident either of Corinth or of Ephesus. Paul had been informed by some of her household, probably Christian slaves, of the dissensions in the church at Corinth. Nothing more is known of her.``1';
isbe[2068]='Choba; Chobai`ko\'-ba, ko\'-ba-i (Choba, Judith 4:4; Chobai, 15:4f): A place named along with Jericho, Asora, and the valley of Salem (Judith 4:4; 15:4f). Reland\'s (Pal, 721) suggestion of Choabis, which the Peutinger Tables give as 12 Roman miles from Scythopolis, seems probable. It may be identical with el-Mekhubby, about 11 miles from Beisan (Scythepolis), and 3 miles from Tubas.``1';
isbe[2069]='Choenix`ke\'-niks (choinix): A Greek dry measure, almost equal to one quart. Mentioned in the New Testament only in <a onClick="return mV(\'Rev\',6,6);">Re 6:6</a>, where the Revised Version, margin would read "choenix" instead of the indefinite translation "measure." The verse is then obviously a threat of famine.``1';
isbe[2070]='Choice`chois.`<a href="./study/isbe/search.html?string=CHOOSE">CHOOSE</a>; <a href="./study/isbe/search.html?string=WILL">WILL</a>`1';
isbe[2071]='Choke`chok (pnigo, and its compounds): Is used in its primary sense of "to strangle," or "to suffocate," in describing the fate of the swine (<a onClick="return mV(\'Luk\',8,33);">Lu 8:33</a> the King James Version). The Revised Version (British and American) has "drowned," but "choked" is the correct rendering of the Greek word.<P>Figurative: It is used in the sense of "to strangle" "smother," "suffocate," as if by depriving of breath, in describing the fate of the young grain growing in the midst of thorns (<a onClick="return mV(\'Mat\',13,7);">Mt 13:7</a>). The figurative is carried a little farther still in describing the way the word, planted in the heart, is overcome by the care of the world, and the deceitfulness of riches (<a onClick="return mV(\'Mat\',13,22);">Mt 13:22</a>).``62';
isbe[2072]='Chola`ko\'-la (Chola; the King James Version, Cola): This names occurs only with that of Chobai (see <a href="./study/isbe/search.html?string=CHOBA">CHOBA</a>) in Judith 15:4. It may be identical with the modern Ka\'un, between el- Mekhubby and Beisan.``1';
isbe[2073]='Choler`kol\'-er: Lit. "bile," is used in the sense of a disease (cholera) (Sirach 31:20; 37:30), and in the sense of bitter anger (marar) (<a onClick="return mV(\'Dan\',8,7);">Da 8:7</a>; <a onClick="return mV(\'Dan\',11,11);">11:11</a> English Versions of the Bible, the American Standard Revised Version "anger").``1';
isbe[2074]='Choose; Chosen`chooz, cho\'-z\'-n (bachar, qabhal, bara\', barah; ek-lego):<P><B>I. IN THE OLD TESTAMENT</B><P class="in15">1. Human Choice<P class="in15">2. God Chooses King of Israel<P class="in15">3. God Chooses Jerusalem<P class="in15">4. Election of Israel<P class="in15">5. Yahweh\'s Grace<P class="in30">(1) An Act of Sovereignty<P class="in30">(2) For Mankind\'s Sake<P><b>II. IN THE NEW TESTAMENT</b><P class="in15">1. Various Meanings<P class="in15">2. Of God\'s Free Grace<P class="in15">3. Ultimate Antinomies<P class="in15">4. Election Corresponds to Experience<hr /><P>The words denote an act of comparison of two or more objects or persons, the preference and selection of one, or of a few out of a larger number for a certain purpose, function, position or privilege.<P>I. In the Old Testament.<P>1. Human Choice:<P>For bachar and its derivatives: men choosing wives (<a onClick="return mV(\'Gen\',6,2);">Ge 6:2</a>); Lot choosing the cities of the Plain (<a onClick="return mV(\'Gen\',13,11);">Ge 13:11</a>); often of kings and generals choosing soldiers for their prowess (e.g. <a onClick="return mV(\'Exd\',17,9);">Ex 17:9</a>; <a onClick="return mV(\'Jos\',8,3);">Jos 8:3</a>; <a onClick="return mV(\'1Sa\',13,2);">1Sa 13:2</a>; <a onClick="return mV(\'2Sa\',10,9);">2Sa 10:9</a>; <a onClick="return mV(\'2Sa\',17,1);">17:1</a>). The word bachar is often used for "young men," as being choice, in the prime of manhood. The most important uses of bachar are these: of Israel choosing a king (<a onClick="return mV(\'1Sa\',8,18);">1Sa 8:18</a>; <a onClick="return mV(\'1Sa\',12,13);">12:13</a>); of moral and religious choice: choosing Yahweh as God (<a onClick="return mV(\'Jos\',24,15,22);">Jos 24:15, 22</a>), or other gods (<a onClick="return mV(\'Jdg\',5,8);">Jud 5:8</a>; <a onClick="return mV(\'Jdg\',10,14);">10:14</a>); the way of truth (<a onClick="return mV(\'Psa\',119,30);">Ps 119:30</a>); to refuse the evil and choose the good (<a onClick="return mV(\'Isa\',7,15,16);">Isa 7:15-16</a>); compare David\'s choice of evils (<a onClick="return mV(\'2Sa\',24,12);">2Sa 24:12</a>).<P>2. God Chooses King of Israel:<P>A leading idea is that of God choosing Moses as leader (<a onClick="return mV(\'Num\',16,5,7);">Nu 16:5, 7</a>; <a onClick="return mV(\'Num\',17,5);">17:5</a>); the Levites to the priesthood (<a onClick="return mV(\'1Sa\',2,28);">1Sa 2:28</a>; <a onClick="return mV(\'2Ch\',29,11);">2Ch 29:11</a>); Saul as king (<a onClick="return mV(\'1Sa\',10,24);">1Sa 10:24</a>), David (<a onClick="return mV(\'2Sa\',6,21);">2Sa 6:21</a>; <a onClick="return mV(\'1Ki\',11,34);">1Ki 11:34</a>), Solomon (<a onClick="return mV(\'1Ch\',28,5);">1Ch 28:5</a>). All this follows from theocratic idea that God rules personally over Israel as His chosen people.<P>3. God Chooses Jerusalem:<P>A more important, but still subsidiary, idea is that of Yahweh choosing Jerusalem as the place of His habitation and worship (<a onClick="return mV(\'Deu\',12,5);">De 12:5</a>; <a onClick="return mV(\'Deu\',20,\'1-\');">20</a> other times, <a onClick="return mV(\'Jos\',9,27);">Jos 9:27</a>; <a onClick="return mV(\'1Ki\',8,44,48);">1Ki 8:44, 48</a>; <a onClick="return mV(\'Psa\',132,13);">Ps 132:13</a>; <a onClick="return mV(\'Zec\',1,17);">Zec 1:17</a>; <a onClick="return mV(\'Zec\',2,12);">2:12</a>; <a onClick="return mV(\'Zec\',3,2);">3:2</a>). This was the ruling idea of Josiah\'s reformation which was instrumental in putting down polytheistic ideas and idolatrous practices in Israel, and was therefore an important factor in the development of Hebrew monotheism; but it was an idea that Hebrew monotheism had to transcend and reject to attain its full growth. "The hour cometh, when neither in this mountain, nor in Jerusalem, shall ye worship the Father" (<a onClick="return mV(\'Jhn\',4,21);">Joh 4:21</a>).<P>4. Election of Israel:<P>But the fundamental idea of choosing, which governs all others in the Old Testament, is that of God choosing Israel to be His peculiar people. He chose Abraham, and made a covenant with him, to give him the land of Canaan (<a onClick="return mV(\'Neh\',9,7);">Ne 9:7</a>ff): "For thou art a holy people unto Yahweh thy God: Yahweh thy God hath chosen thee to be a people for his own possession, above all peoples that are upon the face of the earth...because Yahweh loveth you, and because he would keep the oath which he sware unto your fathers" (<a onClick="return mV(\'Deu\',7,\'6-8\');">De 7:6-8</a>). Historically this idea originated in the old conception of Yahweh as the tribal God of Israel, bound to her by natural and indissoluble ties (see <a href="./study/isbe/search.html?string=GOD">GOD</a>). But as their conception of Yahweh became more moral, and the idea of His righteousness predominated, it was recognized that there was no natural and necessary relation and harmony between Israel and Yahweh that accounted for the favor of a righteous God toward her, for Israel was no better than her neighbors (<a onClick="return mV(\'Amo\',1,\'1-\');">Am 1</a>; <a onClick="return mV(\'Amo\',2,\'1-\');">2</a>). Why then was Yahweh Israel\'s God, and Israel His people?<P>5. Yahweh\'s Grace:<P>It was by an act of free choice and sovereign grace on God\'s part. "You only have I known of all the families of the earth" (<a onClick="return mV(\'Amo\',3,2);">Am 3:2</a>). In Ho the relation is described under the figure of a marriage tie. Yahweh is Israel\'s husband: and to realize the force of the figure, it is necessary to recall what ancient and oriental marriage customs were. Choice and favor were almost entirely made by the husband. The idea of the covenant which Yahweh out of His free grace made with Israel comes to the forefront in Deuteronomy and Jeremiah. Because He loved her, and for no other reason, He has chosen Israel to be His peculiar people. In <span class="noTag">Isa 40-66</span> the idea is carried farther in two directions:<P>(1) An Act of Sovereignty:<P>Yahweh\'s gracious choice of Israel rests ultimately on His absolute sovereignty: "O Jacob my servant, and Israel, whom I have chosen: thus saith Yahweh that made thee, and formed thee from the womb" (<a onClick="return mV(\'Isa\',44,1,2);">Isa 44:1-2</a>; compare <a onClick="return mV(\'Isa\',29,16);">Isa 29:16</a>; <a onClick="return mV(\'Jer\',18,6);">Jer 18:6</a>; <a onClick="return mV(\'Isa\',64,8);">Isa 64:8</a>). For Israel\'s deliverance Cyrus and his world-empire are in Yahweh\'s hands as clay in the potter\'s hands (<a onClick="return mV(\'Isa\',45,9,10);">Isa 45:9-10</a>).<P>(2) For Mankind\'s Sake:<P>"Israel is elect for the sake of mankind." This is the moral interpretation of a choice that otherwise appears arbitrary and irrational. God\'s purpose and call of salvation are unto all mankind. "Look unto me, and be ye saved, all the ends of the earth; for I am God, and there is none else" (<a onClick="return mV(\'Isa\',45,22);">Isa 45:22</a>). And Israel is His servant, chosen, the messenger He sends, "to bring forth justice to the Gentiles" (<a onClick="return mV(\'Isa\',42,1,19);">Isa 42:1, 19</a>; <a onClick="return mV(\'Isa\',43,10,12);">43:10, 12</a>). The idea is further developed in the conception of the <a href="./study/isbe/search.html?string=SERVANT+OF+JEHOVAH">SERVANT OF JEHOVAH</a> (which see) as the faithful few (or one) formed "from the womb to be his servant, to bring Jacob again to him," "for a light to the Gentiles," God\'s "salvation unto the end of the earth" (<a onClick="return mV(\'Isa\',49,\'1-6\');">Isa 49:1-6</a>; <a onClick="return mV(\'Isa\',52,\'13-\');">52:13-53:12</a>) (compare Isaiah\'s doctrine of the Remnant: Shearjashub; also, the righteous, the godly, the meek, in Pss; and see Skinner, Isaiah, II, xxxff). As the conception of personality and of individual relation and responsibility to God developed from Ezekiel onward, together with the resulting doctrine of personal immortality, the conditions were prepared for the application of the idea of election to individuals (compare <a onClick="return mV(\'Psa\',65,4);">Ps 65:4</a>).<P>Coordinate with the idea of God choosing Israel runs the complementary idea that Israel should prove faithful to the covenant, and worthy of the choice. God has chosen her, not for any merit in her, but of His free grace, and according to His purpose of salvation, but if Israel fails to respond by faithful conduct, fitting her to be His servant and messenger, He may and will cast her off, or such portion of her as proves unworthy. See Oehler, Old Testament Theology, I, 256ff, 287 f.<P>Three other Hebrew words expressing choice in minor matters are: qabhal, for David\'s choice of evils (<a onClick="return mV(\'1Ch\',21,11);">1Ch 21:11</a>); bara\', to mark out a place (<a onClick="return mV(\'Eze\',21,19);">Eze 21:19</a>), to select singers and porters for the temple (<a onClick="return mV(\'1Ch\',9,22);">1Ch 9:22</a>; <a onClick="return mV(\'1Ch\',16,41);">16:41</a>); barah, to choose a man to represent Israel against Goliath (<a onClick="return mV(\'1Sa\',17,8);">1Sa 17:8</a>).<P>II. In the New Testament.<P>1. Various Meanings:<P>The whole conception of God, of His relation to Israel, and of His action in history indicated above, constituted the religious heritage of Jesus Christ and His disciples. The national conciousness had to a considerable extent given place to that of the individual; and salvation extended beyond the present life into a state of blessedness in a future world. But the central ideas remain, and are only modified in the New Testament in so far as Jesus Christ becomes the Mediator and Agent of God\'s sovereign grace. Eklego and its derivatives are the words that generally express the idea in the New Testament. They are used<P>(1) of the general idea of selecting one out of many (<a onClick="return mV(\'Luk\',14,7);">Lu 14:7</a>);<P>(2) of choosing men for a particular purpose, e.g. of the church choosing the seven (<a onClick="return mV(\'Act\',6,5);">Ac 6:5</a>); of the choice of delegates from the Council of Jerusalem (<a onClick="return mV(\'Act\',15,22,25);">Ac 15:22, 25</a>; compare <a onClick="return mV(\'2Cr\',8,19);">2Co 8:19</a>), cheirotoneo; choose by vote (the Revised Version (British and American) "appoint") (compare <a onClick="return mV(\'Act\',10,41);">Ac 10:41</a>), procheirotoneo;<P>(3) of moral choice (<a onClick="return mV(\'Mar\',13,20);">Mr 13:20</a>): "Mary hath chosen the good part" (<a onClick="return mV(\'Luk\',10,42);">Lu 10:42</a>);<P>(4) of Christ as the chosen Messiah of God (<a onClick="return mV(\'Luk\',23,35);">Lu 23:35</a>; <a onClick="return mV(\'1Pe\',2,4);">1Pe 2:4</a> the King James Version);<P>(5) of Christ choosing His apostles (<a onClick="return mV(\'Luk\',6,13);">Lu 6:13</a>; <a onClick="return mV(\'Jhn\',6,70);">Joh 6:70</a>; <a onClick="return mV(\'Jhn\',13,18);">13:18</a>; <a onClick="return mV(\'Jhn\',15,16,19);">15:16, 19</a>; <a onClick="return mV(\'Act\',1,2,24);">Ac 1:2, 24</a>); Paul (<a onClick="return mV(\'Act\',9,15);">Ac 9:15</a>; compare <a onClick="return mV(\'Act\',22,14);">Ac 22:14</a> the King James Version), procheirizomai; Rufus (<a onClick="return mV(\'Rom\',16,13);">Ro 16:13</a>); and Paul chose Silas (<a onClick="return mV(\'Act\',15,40);">Ac 15:40</a>), epilego;<P>(6) of God<P>(a) choosing Israel (<a onClick="return mV(\'Act\',13,17);">Ac 13:17</a>; compare <a onClick="return mV(\'Rom\',9,11);">Ro 9:11</a>),<P>(b) choosing the Christian church as the new Israel (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a> the King James Version),<P>(c) choosing the members of the church from among the poor (<a onClick="return mV(\'Jam\',2,5);">Jas 2:5</a>), the foolish, weak and despised (<a onClick="return mV(\'1Cr\',1,\'27-28\');">1Co 1:27-28</a>),<P>(d) choosing into His favor and salvation a few out of many: "Many are called, but few are chosen"\' (<a onClick="return mV(\'Mat\',20,16);">Mt 20:16</a> (omitted in the Revised Version (British and American)); <a onClick="return mV(\'Mat\',22,14);">Mt 22:14</a>); God shortens the days of the destruction of Jerusalem "for the elect\'s sake, whom he chose" (<a onClick="return mV(\'Mar\',13,20);">Mr 13:20</a>).<P>2. Of God\'s Free Grace:<P>In <a onClick="return mV(\'Eph\',1,\'4-6\');">Eph 1:4-6</a> every phrase tells a different phase of the conception:<P>(1) God chose (and foreordained) the saints in Christ before the foundation of the world;<P>(2) according to the good pleasure of His will;<P>(3) unto adoption as sons through Jesus Christ unto Himself;<P>(4) to be holy and without blemish before Him in love;<P>(5) to the praise of the glory of His grace;<P>(6) which He freely bestowed on them in the Beloved. And in <a onClick="return mV(\'Rev\',17,14);">Re 17:14</a>, the triumphant church in heaven is described as "called and chosen and faithful." God\'s sovereign choice governs the experience and testing of the saints at every point from beginning to end.<P>Thus in the New Testament as in the Old Testament<P>(1) God\'s covenant of grace is free and unconditional. It is unto all men, now as individuals rather than nations, and without distinction of race or class. It is no less free and sovereign, because it is a father\'s grace.<P>(2) Israel is still a chosen race for a special purpose.<P>(3) The church and the saints that constitute it are chosen to the full experience and privileges of sonship.<P>(4) God\'s purpose of grace is fully revealed and realized through Jesus Christ.<P>3. Ultimate Antinomies:<P>This doctrine raises certain theological and metaphysical difficulties that have never yet been satisfactorily solved.<P>(1) How can God be free if all His acts are preordained from eternity? This is an antinomy which indeed lies at the root of all personality. It is of the essence of the idea of personality that a person should freely determine himself and yet act in conformity with his own character. Every person in practice and experience solves this antinomy continually, though he may have no intellectual category that can coordinate these two apparently contradictory principles in all personality.<P>(2) How can God be just, if a few are chosen and many are left? And<P>(3) How can man be free if his moral character proceeds out of God\'s sovereign grace? It is certain that if God chose all or left all He would be neither just nor gracious, nor would man have any vestige of freedom.<P>4. Election Corresponds to Experience:<P>The doctrine describes accurately (a) the moral fact, that some accept salvation and others reject it; (b) the religious fact that God\'s sovereign and unconditional love is the beginning and cause of salvation. The meeting-point of the action of grace, and of man\'s liberty as a moral and responsible being, it does not define. Nor has the category as yet been discovered wherewith to construe and coordinate these two facts of religious experience together, although it is a fact known in every Christian experience that where God is most sovereign, man is most free.`<a href="./study/isbe/search.html?string=ELECTION">ELECTION</a>`145';
isbe[2075]='Chop`(paras):<P>Figurative: This word, meaning "to cut in pieces," "to distribute," often translated "spread," is rendered "chop" in <a onClick="return mV(\'Mic\',3,3);">Mic 3:3</a>, they "chop them in pieces, as for the pot," figuratively for the destruction of God\'s people through the cruel exactions of their rulers.``1';

isbe[2077]='Chorazin`ko-ra\'-zin (Chorazin, <a onClick="return mV(\'Mat\',11,21);">Mt 11:21</a>; Chorazin, <a onClick="return mV(\'Luk\',10,13);">Lu 10:13</a>; Westcott and Hort, The New Testament in Greek Chorazein): A city whose name appears only in the woe pronounced against it by Christ (<a onClick="return mV(\'Mat\',11,21);">Mt 11:21</a>; <a onClick="return mV(\'Luk\',10,13);">Lu 10:13</a>). Its appearance there, however, shows that it must have been a place of some importance, and highly privileged by the ministry of Jesus. It was already deserted in the time of Eusebius, who places it 2 miles from Capernaum (Onomasticon, under the word). We can hardly doubt that it is represented by the extensive ruins of Kerazeh, on the heights to the north of Tell Chum. It is utterly desolate: a few carved stones being seen among the heaps. There are traces of a Roman road which connected the ancient city with the great highway between north and south which touched the lake shore at Khan Minyeh.``54';

isbe[2079]='Chosamaeus`kos-a-me\'-us (A, Simon Chosamaios; B, Chosamaos): Occurs in 1Esdras 9:32 as the name of one of the sons of Annas. But in the parallel passage (<a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>) the name is simply Shimeon followed by "Benjamin, Malluch, Shemariah," which are omitted in 1Esdras. The Septuagint of <a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a> has Semeon, followed by the three omitted names. The difference may have arisen from a mistake of a copyist, or from the use of an imperfect MS.``1';

isbe[2086]='Christ, Offices of`of\'-is-is.<P><b>General Titles of our Lord</b><P><b>I. CHRIST\'S MEDIATION EXPRESSED IN THE SPECIFIC OFFICES</b><P class="in15">Historical Review of the Theory<P><b>II. THE THREEFOLD OFFICE IN THE OLD TESTAMENT</b><P class="in15">The Failure of the Offices to Secure Their Desired Ends<P><b>III. THE PROPHET</b><P class="in15">The Forecast of the True Prophet<P><b>IV. CHRIST THE PROPHET</b><P class="in15">1. Christ\'s Manner of Teaching<P class="in15">2. Christ as Prophet in His Church<P><b>V. THE PRIESTHOOD OF CHRIST</b><P class="in15">1. Judaic Priesthood<P class="in15">2. Sacrificial Relations of Christ in the Gospels<P class="in15">3. Christ\'s Ethical Teaching Affected by Sacrificial Ideas<P class="in15">4. Mutual Confirmations of the Synoptics<P class="in15">5. The Dual Outgrowth of Sacrifice, the Victim and Sacrificer<P class="in15">6. Christ\'s Priesthood in the Apostolic Ministry and Epistles<P class="in15">7. The Crowning Testimony of the Epistle to the Hebrews<P class="in15">8. Christ\'s Relation to Sin Expressed in Sacrificial Terms<P><b>VI. CHRIST\'S KINGLY OFFICE</b><P class="in15">The Breakdown of the Secular Monarchy<P><b>VII. THE MESSIANIC BASIS OF THE THREEFOLD OFFICE OF THE LORD</b><P><b>LITERATURE</b><hr /><P>General Titles of our Lord:<P>This term has been used by theologians to describe the various characters of our Lord\'s redemptive work. Many appellative and metaphorical titles are found in Scripture for Christ, designative of His Divine and human natures and His work: God (<a onClick="return mV(\'Jhn\',20,28);">Joh 20:28</a>); Lord (<a onClick="return mV(\'Mat\',22,43,44);">Mt 22:43-44</a>); Word (<a onClick="return mV(\'Jhn\',1,1,14);">Joh 1:1, 14</a>); Son of God (<a onClick="return mV(\'Mat\',3,17);">Mt 3:17</a>; <a onClick="return mV(\'Luk\',1,35);">Lu 1:35</a>; <a onClick="return mV(\'Col\',1,15);">Col 1:15</a>; <a onClick="return mV(\'1Jo\',5,20);">1Joh 5:20</a>); Firstborn from the dead (<a onClick="return mV(\'Col\',1,18);">Col 1:18</a>); Beginning of the Creation of God (<a onClick="return mV(\'Rev\',3,14);">Re 3:14</a>); Image of God (<a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>); Express Image of His Person (<a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a> the King James Version); Alpha and Omega (<a onClick="return mV(\'Rev\',1,8);">Re 1:8</a>; <a onClick="return mV(\'Rev\',22,13);">22:13</a>); Son of Man (<a onClick="return mV(\'Mat\',8,20);">Mt 8:20</a>; <a onClick="return mV(\'Jhn\',1,51);">Joh 1:51</a>; <a onClick="return mV(\'Act\',7,56);">Ac 7:56</a>); Son of David (<a onClick="return mV(\'Mat\',9,27);">Mt 9:27</a>; <a onClick="return mV(\'Mat\',21,9);">21:9</a>); Last Adam (<a onClick="return mV(\'1Cr\',15,45,47);">1Co 15:45, 47</a>); Captain of Salvation (<a onClick="return mV(\'Hbr\',2,10);">Heb 2:10</a> margin); Saviour (<a onClick="return mV(\'Luk\',2,11);">Lu 2:11</a>; <a onClick="return mV(\'Jhn\',4,42);">Joh 4:42</a>; <a onClick="return mV(\'Act\',5,31);">Ac 5:31</a>); Redeemer (<a onClick="return mV(\'Isa\',59,20);">Isa 59:20</a>; <a onClick="return mV(\'Tts\',2,14);">Tit 2:14</a>); Author and Perfecter of Faith (<a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>); Light of the World (<a onClick="return mV(\'Jhn\',8,12);">Joh 8:12</a>); Lamb of God (<a onClick="return mV(\'Jhn\',1,29,36);">Joh 1:29, 36</a>); Creator of all things (<a onClick="return mV(\'Jhn\',1,3,10);">Joh 1:3, 10</a>); Mediator (<a onClick="return mV(\'1Ti\',2,5);">1Ti 2:5</a>); Prophet (<a onClick="return mV(\'Deu\',18,15);">De 18:15</a>; <a onClick="return mV(\'Luk\',24,19);">Lu 24:19</a>); Great High Priest (<a onClick="return mV(\'Hbr\',4,14);">Heb 4:14</a>); King (<a onClick="return mV(\'Luk\',1,33);">Lu 1:33</a>; <a onClick="return mV(\'Rev\',17,14);">Re 17:14</a>; <a onClick="return mV(\'Rev\',19,16);">19:16</a>); Way, Truth and Life (<a onClick="return mV(\'Jhn\',14,6);">Joh 14:6</a>). These and many others express the mediatorial office of the Lord. As mediator, He stands between God and Man, revealing the Father to man, and expressing the true relation of man to God. The term (Greek mesites), moreover, signifies messenger, interpreter, advocate, surety or pledge in <a onClick="return mV(\'Gal\',3,19,19);">Ga 3:19-20</a>, where a covenant is declared to be assured by the hand of one who intervenes. Thus the covenant is confirmed and fulfilled by Him who secures that its stipulations should be carried out, and harmony is restored where before there had been difference and separation (<a onClick="return mV(\'1Ti\',2,5);">1Ti 2:5</a>; <a onClick="return mV(\'Hbr\',8,6);">Heb 8:6</a>; <a onClick="return mV(\'Hbr\',9,15);">9:15</a>; <a onClick="return mV(\'Hbr\',12,24);">12:24</a>). Thus is expressed the purpose of God to redeem mankind by mediation.<P>I. Christ\'s Mediation Expressed in the Specific Offices.<P>In presenting a systematic idea of this Redemptive Work of Christ by Mediation, Christian thought gave to it a harmonious character by choosing the most general and familiar titles of the Lord as the most inclusive categories expressive of the mode of Redemption. These were prophetic, priestly and regal.<P>Historical Review of the Theory:<P>The first trace of this division is found in Eusebius, Historia Ecclesiastica, I,3,and his Demonstratio Evangelica, IV, 15. It was accepted very largely in the Greek church, and continues to be used by Russian ecclesiastical writers. The Roman church has not so generally followed it, though it is found in the writings of many Roman theologians. The earlier reformers, especially Lutheran, ignored it. But Gerhard employed it and the Lutheran theologians followed his example, although some of these repudiated it, as Ernesti, Doderlein and Knapp. Calvin employed the division in his Institutes, II, 15. It was incorporated in the Heidelberg Catechism and has been adopted by most theologians of the Reformed church and by English and American divines. In Germany most theological writers, such as De Wette, Schleiermacher, Tholuck, Nitzsch, Ebrard, adopt it, affirming it as expressive of the essential quality of the work of redemption, and the most complete presentment of its contents. The justification of this position is found in the important place occupied in the progress of revelation by those to whom were entrusted the duties of teaching and leading men in relation to God in the offices of priest, prophet and king. Even the modern development of Christian thought which extends the view of Divine dealing with man over the entire race and its religious history, not excluding those who would find in the most recent conditions of the world\'s life the outworking of the will of God in the purposes of human salvation, cannot discover any better form of expressing Christ\'s relation to man than in terms of the prophetic, the priestly and the governmental offices. The prophet is the instrument of teaching: the priest expresses the ethical relation of man to God; while the king furnishes the typical form of that exercise of sovereign authority and Providential direction which concerns the practical life of the race.<P>II. The Threefold Office in the Old Testament.<P>From the close relation which Jesus in both His person and work bore to the Old Testament dispensation, it is natural to turn to the preparatory history of the early Scriptures for the first notes of these mediatorial offices. That the development of the Jewish people and system ever moved toward Christ as an end and fulfillment is universally acknowledged. The vague and indeterminate conditions of both the religious and national life of Israel manifest a definite movement toward a clearer apprehension of man\'s relationship to God. Nothing is more clear in Israel\'s history than the gradual evolution of official service both of church and state, as expressed in the persons and duties of the prophet, the priest and the king. The early patriarch contained in himself the threefold dignity, and discharged the threefold duty. As the family became tribal, and the tribe national, these duties were divided. The order of the household was lost for a while in the chaos of the larger and less homogeneous society. The domestic altar was multiplied in many "high places." Professional interpreters of more or less religious value began to be seers, and here and there, prophets. The leadership of the people was occasional, ephemeral and uncertain. But the men of Divine calling appeared from time to time; the foundation work of Moses was built on; the regular order of the worship of Yahweh, notwithstanding many lapses, steadily prevailed. Samuel gave dignity to his post as judge, and he again beheld the open vision of the Lord; he offered the appointed sacrifices; he established the kingly office; and although he was not permitted to see the family of David on the throne, like Moses he beheld afar off the promised land of a Divinely appointed kingdom. With the accession of the Davidic house, the three orders of God\'s service were completely developed. The king was seated on the throne, the priest was ministering at the one altar of the nation, the prophet with the Divine message was ever at hand to teach, to guide and to rebuke.<P>The Failure of the Offices to Secure Their Desired Ends:<P>Notwithstanding this growth of the special institutions—prophet, priest and king—the religious and national condition was by no means satisfactory. The kingdom was divided; external foes threatened the existence of the nation; idolatry was not extinguished, and the prophets who were true to Yahweh were compelled to warn and rebuke the sins of the rulers and the people, and even to testify against the priests for their unfaithfulness to the truth and purity of the religion which they professed. The best hopes of Israel and the Divine promises seem thus to be contradicted by the constant failure of the people to realize their best ideals. Hence, slowly arose a vague expectation of reform. The idea of the better condition which was coming grew ever more distinct, and settled down at length to Israel\'s Messianic hope, expressed in various forms, finally converging to the looking for of one who should in some mysterious way gather into himself the ideas which belonged especially to the three great offices.<P>III. The Prophet.<P>In this article we are concerned only with the offices as they tend to their fulfillment in Christ. For the more general treatment of each office, reference must be made to the special articles.<P>The Forecast of the True Prophet:<P>The first appearance of the idea of the special prophet of Yahweh is in <a onClick="return mV(\'Deu\',18,15);">De 18:15</a>. Moses had been sent by the people to hear the Lord\'s words on their behalf (<a onClick="return mV(\'Exd\',20,19);">Ex 20:19</a>; <a onClick="return mV(\'Deu\',5,27);">De 5:27</a>); and this incident in the later passage of <a onClick="return mV(\'Deu\',18,\'15-22\');">De 18:15-22</a> is connected with the promise of a prophet, while at the same time reference is made to the general fact of prophecy and the conditions of its validity and acceptance. Here we find the germ of the expectation of the Prophet, which occupied so large a place in the mind of Israel. In the act of the people sending Moses to receive the word, and Yahweh\'s promise to send a prophet whom they would accept, we see also the suggestion of a distinction between the first dispensation and the latter. The Divine promise was to the effect that what was given by Moses God would consummate in a prophetic revelation through a person. The conception of this personality is found in the second part of <a onClick="return mV(\'Isa\',40,\'1-\');">Isa (40-66)</a>. Isaiah\'s mission was vain, <a onClick="return mV(\'Isa\',49,4);">Isa 49:4</a>, but the coming one shall prevail, <a onClick="return mV(\'Isa\',49,\'1-\');">49-53</A> (passim). But the success of this servant of Yahweh was not to be only as a prophet, but by taking on himself the penalty of sin (<a onClick="return mV(\'Isa\',53,5);">Isa 53:5</a>), and by being made an offering for sin; and as Mighty Victor triumphing over all foes (<a onClick="return mV(\'Isa\',53,\'10-12\');">Isa 53:10-12</a>), the dignities of whose kingship are set forth in various parts of the prophetic writings. Thus the general effect of the course of the earlier revelation may be summed up in this prophetic ministry with which has been combined a priestly and a royal character. It was an ever-advancing manifestation of the nature and will of God, delivered by inspired men who spake at sundry times and in divers manners, but whose message was perfected and extended by Jesus Christ (<a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a>), who thus became the Prophet of the Lord.<P>IV. Christ the Prophet.<P>Christ\'s ministry illustrates the prophetic office in the most extensive and exalted sense of the term. He was designed and appointed by the Father (<a onClick="return mV(\'Isa\',61,1,2);">Isa 61:1-2</a>; compare <a onClick="return mV(\'Luk\',4,\'16-21\');">Lu 4:16-21</a>; <a onClick="return mV(\'Mat\',17,5);">Mt 17:5</a>). In <a onClick="return mV(\'1Cr\',1,30);">1Co 1:30</a>, Christ is declared to be made to us wisdom. His intimate knowledge of God (<a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a>; <a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>; <a onClick="return mV(\'Jhn\',16,15);">Joh 16:15</a>), the qualities of His teaching dependent upon His nature, both Divine and human (<a onClick="return mV(\'Jhn\',3,34);">Joh 3:34</a>); His authority (<a onClick="return mV(\'Jhn\',1,9,17,18);">Joh 1:9, 17-18</a>; <a onClick="return mV(\'Luk\',4,\'18-21\');">Lu 4:18-21</a>); His knowledge of God (<a onClick="return mV(\'Mar\',12,29);">Mr 12:29</a>; <a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>; <a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>; <a onClick="return mV(\'Jhn\',17,11,25);">Joh 17:11, 25</a>; <a onClick="return mV(\'Mat\',18,35);">Mt 18:35</a>)—these all peculiarly fitted Christ to be the Revealer of God. Besides His doctrine of God, His ministry included the truth concerning Himself, His nature, claims, mission, the doctrine of the Holy Spirit, and the religious life of man. He taught as none other the foundation of religion, the facts on which it was based, the essence of Divine service, the nature of sin, the grace of God, the means of atonement, the laws of the kingdom of God and the future state. By the acknowledgment of even those who have denied His Divine nature and redemptive work, He has been recognized as the Supreme Moral Teacher of the world. His claim to be the Prophet is seen in that He is the source of the ever-extending revelation of the eternal. His own words and works He declared were only part of the fuller knowledge which would be furnished by the system which He established (<a onClick="return mV(\'Luk\',9,45);">Lu 9:45</a>; <a onClick="return mV(\'Luk\',18,34);">18:34</a>; <a onClick="return mV(\'Jhn\',12,16);">Joh 12:16</a>; <a onClick="return mV(\'Jhn\',14,26);">14:26</a>; <a onClick="return mV(\'Jhn\',15,26);">15:26</a>; <a onClick="return mV(\'Jhn\',16,12,13,14);">16:12-14</a>).<P>1. Christ\'s Manner of Teaching:<P>How remarkable was His method of teaching! Parable, proverb, absolute affirmation, suggestion, allusion to simple objects, practical life—these all made His teaching powerful, easily understood, living; sometimes His action was His word—and all with a commanding dignity and gracious winsomeness, that was felt by His hearers and has ever been recognized (<a onClick="return mV(\'Mat\',7,29);">Mt 7:29</a>). So perfect and exalted was the teaching of Jesus that many have supposed that revelation ceased with Him, and the immediate followers whom He especially inspired to be His witnesses and interpreters. Certainly in Him the prophetic ministry culminated.<P>2. Christ as Prophet in His Church:<P>An important aspect of Christ\'s prophetic office is that of His relation to the church as the source, through the instrumentality of His Spirit, of ever-enlarging knowledge of Divine truth which it has been able to gain. This is the real significance of the claim which some churches make to be the custodians and interpreters of the tradition of faith, with which has also gone theory of development—not as a human act but as a ministration of the Lord through His Spirit, which is granted to the church. Even those who hold that all Divine truth is to be found in the sacred Scriptures have yet maintained that God has much truth still to bring out of His word by the leading and direction of the Spirit of Jesus. The Scripture itself declares that Christ was the light which lighteth every man that cometh into the world (<a onClick="return mV(\'Jhn\',1,9);">Joh 1:9</a>). He Himself promised that the Spirit which He would give would guide His followers into all truth (<a onClick="return mV(\'Jhn\',16,13);">Joh 16:13</a>). The apostles claimed to receive their teaching and direction of the church from the Lord (<a onClick="return mV(\'1Cr\',11,23);">1Co 11:23</a>). The testimony of Jesus is definitely declared to be the spirit of prophecy (<a onClick="return mV(\'Rev\',19,10);">Re 19:10</a>). Indeed, all the apostolic writings in almost every line affirm that what they teach is received from the Spirit, who is the Spirit of the Lord.<P>V. The Priesthood of Christ.<P>1. Judaic Priesthood:<P>For the history of the development of the priesthood of Israel on which our Lord\'s High-Priesthood is ideally based, reference must be made to the article especially dealing of with that subject. The bearings of that institution upon the work of Jesus as Redeemer alone fall under this section. Judaism like all religions developed an extensive system priestly service. As the moral sense of the people enlarged and became more distinct, the original simplicity of sacrifice, especially as a commensal act, in which the unity of the celebrants with each other and with God was expressed, was expanded into acts regularly performed by officials, in which worship, thanksgiving, covenant and priestly expiation and atonement were clearly and definitely expressed. The progress of sacrifice may be seen in the history of the Old Testament from Cain and Abel\'s (<a onClick="return mV(\'Gen\',4,3,4);">Ge 4:3-4</a>), Noah\'s (<a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>), Abraham\'s covenant (<a onClick="return mV(\'Gen\',15,\'9-18\');">Ge 15:9-18</a>), etc., to the elaborate services of the Mosaic ritual set forth in Leviticus, the full development of which is found only in the later days of Israel. When Christ appeared, the entire sacerdotal system had become incorporated in the mind, customs and language of the people. They had learned more or less distinctly the truth of man\'s relation to God in its natural character, and especially in that aspect where man by his sin had separated himself from God and laid himself open to the penalty of law. The conception of priesthood had thus grown in the consciousness of Israel, as the necessary instrument of mediation between man and God. Priestly acts were performed on behalf of the worshipper. The priest was to secure for man the Divine favor. This could only be gained by an act of expiation. Something must be done in order to set forth the sin of man, his acknowledgment of guilt, the satisfaction of the law, and the assurance of the Divine forgiveness, the restored favor of God and finally the unity of man and God.<P>2. Sacrificial Relations of Christ in the Gospels:<P>That the work of Christ partook of the nature of priestly service is already indicated by references in the Gospels themselves. He was called "Jesus; for it is he that shall save his people from their sins" (<a onClick="return mV(\'Mat\',1,21);">Mt 1:21</a>). Salvation from sin, in the habit of thought at which the Jew had arrived, must have expressed itself most clearly in the symbolic signification of the sacrifices in the temple. Thus in the very name which our Lord received His priesthood is suggested. The frankincense of the Magi\'s offering is not without its mystical meaning (<a onClick="return mV(\'Mat\',2,11);">Mt 2:11</a>). Some may find in the Baptist\'s words, "baptize you in the Holy Spirit and in fire" (<a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>), a suggestion of priestly action, for the understanding of John\'s declaration must be found in the conventional ideas of the Jewish thought of the period, determined as they undoubtedly were by the history of priestly service in the past and the fully developed ritual of the temple. The baptizing of the proselyte was not necessarily a priestly act, as indeed we cannot be certain that the baptism was always necessary at the introduction of a proselyte into the Jewish church. But the association of circumcision with the initiation of the proselyte certainly introduced the priest, and the sprinkling of the congregation by the priest was a familiar part of his official duties. It is quite probable therefore that John\'s use of the expression carried with it something of the sacerdotal idea.<P>3. Christ\'s Ethical Teaching Affected by Sacrificial Ideas:<P>The spirit of our Lord\'s teaching, as seen in the Sermon on the Mount, etc., as it reflects the thought of the Galilean ministry, may be regarded as prophetic rather than priestly. Still the end of the teaching was righteousness, and it was impossible for a Jew to conceive of the securing of righteousness without some reference to priestly administration and influence. The contrast of the effect of Christ\'s teaching with that of the scribes (<a onClick="return mV(\'Mat\',7,29);">Mt 7:29</a>) keeps us in the vicinity of the law as applied through the sacerdotal service of which the scribes were the interpreters and teachers, and surely therefore a hint of our Lord\'s relation to priesthood may have found its way into the minds of His immediate hearers. He was careful to recognize the authority of the priest (<a onClick="return mV(\'Mat\',8,4);">Mt 8:4</a>). The doctrine of sacrifice emerges somewhat more distinctly in the reference to the cross, which our Lord associates with the thought of finding life by losing it (<a onClick="return mV(\'Mat\',16,24,25);">Mt 16:24-25</a>), and when the taking up the cross is interpreted by following Christ, and this hint is soon followed by Christ\'s distinct reference to His coming sufferings (<a onClick="return mV(\'Mat\',17,9, 12);">Mt 17:9, 12</a>), more definitely referred to in <a onClick="return mV(\'Mat\',17,22,23);">Mt 17:22-23</a>. Now the object of the work of the Lord takes clearer form. The Son of Man is come to save that which was lost (<a onClick="return mV(\'Mat\',18,11);">Mt 18:11</a> the American Revised Version, margin). As the time of the catastrophe drew nearer, the Lord became still more distinct in His references to His coming death (<a onClick="return mV(\'Mat\',20,18,19);">Mt 20:18-19</a>), and at length declares that "the Son of man came...to give his life a ransom for many" (<a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>). our Lord\'s quotations (<a onClick="return mV(\'Mat\',21,42);">Mt 21:42</a>; <a onClick="return mV(\'Mat\',23,39);">23:39</a>) concerning the rejected "corner stone," and the Blessed One "that cometh in the name of the Lord" (<a onClick="return mV(\'Psa\',118,22,26);">Ps 118:22, 26</a>), are drawn from a psalm filled with the spirit of the priestly service of the temple, and in their reference to Himself again illustrate the ever-increasing recognition of His priesthood. He also uses the official term "Christ" (Messiah, the anointed one) more frequently (<a onClick="return mV(\'Mat\',24,5,23,24);">Mt 24:5, 23-24</a>). On the eve of the betrayal and trial the crucifixion is clearly foretold (<a onClick="return mV(\'Mat\',26,2);">Mt 26:2</a>); and the death (<a onClick="return mV(\'Mat\',26,12);">Mt 26:12</a>). The full significance of the death is asserted at the institution of the Lord\'s Supper. The bread is "my body," the wine is "my blood of the new covenant," and it is declared to be "poured out for many unto remission of sins" (<a onClick="return mV(\'Mat\',26,\'26-28\');">Mt 26:26-28</a> margin).<P>4. Mutual Confirmations of the Synoptics:<P>A similar succession of ideas of our Lord\'s priestly work may be found in the other gospels (see <a onClick="return mV(\'Mar\',1,8,44);">Mr 1:8, 44</a>; <a onClick="return mV(\'Mar\',8,29);">8:29</a>; see below on the significance of the term Christ; <a onClick="return mV(\'Mar\',8,31,34);">Mr 8:31, 34</a>; <a onClick="return mV(\'Mar\',9,9,10);">9:9-10</a>). The inability of the disciples to understand the life that was to follow death here is indicated—the truth of the gospel of death and resurrection so closely bound up with the conception of sacrifice, where the blood is the life which given becomes the condition of the new union with God, being thus revealed by Christ as the initial doctrine to be continuously enlarged (<a onClick="return mV(\'Mar\',9,31);">Mr 9:31</a>; <a onClick="return mV(\'Mar\',10,21,33,34,45);">10:21, 33-34, 45</a>; <a onClick="return mV(\'Mar\',11,9);">11:9</a>; <a onClick="return mV(\'Mar\',12,10);">12:10</a>; <a onClick="return mV(\'Mar\',13,21,22);">13:21-22</a>; <a onClick="return mV(\'Mar\',14,8,\'22-25\',61,62);">14:8, 22-25, 61-62</a>). In Luke the priestly "atmosphere" is introduced in the earliest part of the narrative, the history of Zacharias and Elisabeth giving emphasis to the setting of John\'s own mission (<a onClick="return mV(\'Luk\',1,\'1-\');">Lu 1</a>). The name Jesus (<a onClick="return mV(\'Luk\',1,31);">Lu 1:31</a>); the special relation of the new kingdom to sin, necessarily connected with sacrifice in the mind of a priest, found in Zacharias\' psalm (<a onClick="return mV(\'Luk\',1,77,78);">Lu 1:77-78</a>); the subtle suggestion of the Suffering One in the "also" of <a onClick="return mV(\'Luk\',2,35);">Lu 2:35</a> the King James Version (the American Standard Revised Version omits) shows that the third Gospel is quite in line with the two other Synoptics (see also <a onClick="return mV(\'Luk\',3,3);">Lu 3:3</a>; <a onClick="return mV(\'Luk\',5,14);">5:14</a>). The claim to forgive sins must have suggested the sacrificial symbol of remission (<a onClick="return mV(\'Luk\',5,24);">Lu 5:24</a>; <a onClick="return mV(\'Luk\',9,23);">9:23</a>; <a onClick="return mV(\'Luk\',13,35);">13:35</a>; <a onClick="return mV(\'Luk\',14,27);">14:27</a>; <a onClick="return mV(\'Luk\',18,31);">18:31</a>; <a onClick="return mV(\'Luk\',20,14);">20:14</a>; <a onClick="return mV(\'Luk\',22,19,20);">22:19-20</a>; <a onClick="return mV(\'Luk\',24,7,26,46,47);">24:7, 26, 46-47</a>). In the Fourth Gospel, we have the word of the Baptist, "Behold, the Lamb of God" (<a onClick="return mV(\'Jhn\',1,29,36);">Joh 1:29, 36</a>), where Christ\'s relation to sin is distinctly expressed (see <a href="./study/isbe/search.html?string=LAMB+OF+GOD">LAMB OF GOD</a>)—the baptism in the Spirit (<a onClick="return mV(\'Jhn\',1,33);">Joh 1:33</a>). It is highly probable that the apostle John was the "other" of the two disciples, (<a onClick="return mV(\'Jhn\',1,40);">Joh 1:40</a>) and, having heard the Baptist\'s words, is the only evangelist who records them, thus introducing from his personal knowledge the sacrificial idea earlier into his history than the Synoptics. Christ declares that He will give His life for the life of the world (<a onClick="return mV(\'Jhn\',6,51);">Joh 6:51</a>). The entire passage (<a onClick="return mV(\'Jhn\',6,\'47-65\');">Joh 6:47-65</a>) is suffused with the conception of "life for life," one of the elements constituting the conception of the sacrificial act. In <a onClick="return mV(\'Jhn\',8,28);">Joh 8:28</a> (compare <a onClick="return mV(\'Jhn\',3,14);">Joh 3:14</a>; <a onClick="return mV(\'Jhn\',12,32);">12:32</a>) Christ predicts His crucifixion. The Good Shepherd gives His life for the sheep (<a onClick="return mV(\'Jhn\',10,15);">Joh 10:15</a>). In <a onClick="return mV(\'Jhn\',10,17,18);">Joh 10:17-18</a>, Christ claims the power to lay down His life and to take it again. He is the sacrifice and the Sacrificer.<P>5. The Dual Outgrowth of Sacrifice, the Victim and Sacrificer:<P>Here appears for the first time the double relation of Christ to the sacrificial idea, worked out in the later thought of the church into the full significance of our Lord\'s priestly office. In <a onClick="return mV(\'Jhn\',11,25,26);">Joh 11:25-26</a> Christ is the source of life, and life after death. It is hardly possible that this conception should not have, even if remotely suggested, some reference to the significance of sacrifice; for in the sacrifices the Divine claim for the blood, as specially to be set apart as the Divine portion, was ever present. God ever claimed the blood as His; for to Him the life was forfeited by sin. And moreover He alone possesses life and gives it. Of that forfeit and that Divine sovereignty of life, sacrifice is the expression. This is fully realized and made actual in Christ\'s life and death for man, in which man shares by His unity with Christ. Man at once receives the penalty of sin in dying with Christ, and rises again into the new life which our Lord opened, and of which He is the ceaseless energy and power through the spirit of God. The emergence of this idea is illustrated by the evangelist in the sayings of Caiaphas, where as the high priest of the nation he gives, though unconsciously, a significant expression to the truth that it was "expedient" that Jesus \'should die for the nation and for the children of God everywhere scattered\' (<a onClick="return mV(\'Jhn\',11,\'47-52\');">Joh 11:47-52</a>). Here the symbolic significance of sacrifice is practically realized: death in the place of another and the giving of life to those for whom the sacrifice was offered. The vitalizing power of Christ\'s death is asserted in the discourse following the visit of the Greeks (<a onClick="return mV(\'Jhn\',12,\'24-33\');">Joh 12:24-33</a>). The idea of life from the dying seed is associated with the conception of the power of attraction and union by the cross. The natural law of life through death is thus in harmony with the gift of life through sacrifice involving death. That sacrifice may be found much more widely than merely in death, is shown by the law of service illustrated in the washing of the disciples\' feet (<a onClick="return mV(\'Jhn\',13,\'14-17\');">13:14-17</a>); and this is declared to spring out of love (<a onClick="return mV(\'Jhn\',15,13);">Joh 15:13</a>). For the priestly ideas of our Lord\'s prayer (<a onClick="return mV(\'Jhn\',17,\'1-\');">Joh 17</a>) see <a href="./study/isbe/search.html?string=INTERCESSION">INTERCESSION</a>; <a href="./study/isbe/search.html?string=INTERCESSION+OF+CHRIST">INTERCESSION OF CHRIST</a>; <a href="./study/isbe/search.html?string=PRAYERS+OF+CHRIST">PRAYERS OF CHRIST</a>.<P>6. Christ\'s Priesthood in the Apostolic Ministry and Epistles:<P>Christ\'s priestly office finds illustration in the Acts of the Apostles, in the apostolic declaration of Christ\'s Messianic office, not only Lord, but also Christ the Anointed One (<a onClick="return mV(\'Act\',2,36);">Ac 2:36</a>). Peter\'s reference to the stone which completed the temple, the service of which was essentially sacrificial, as the Symbol of Christ, the Crown of that Spiritual Temple (<a onClick="return mV(\'Act\',4,11);">Ac 4:11</a>); Philip\'s application of the passage in Isaiah of the sheep led to the slaughter (<a onClick="return mV(\'Isa\',53,7,8);">Isa 53:7-8</a>) to our Lord (<a onClick="return mV(\'Act\',8,32,35);">Ac 8:32, 35</a>); Peter\'s discourse to Cornelius, culminating in the remission of sins through Christ (<a onClick="return mV(\'Act\',10,43);">Ac 10:43</a>)—all indicates the steady growth in the apostolic ministry of the conception of our Lord\'s priestly office. The idea takes its most distinct form in Paul\'s sermon at Antioch (<a onClick="return mV(\'Act\',13,38,39);">Ac 13:38-39</a>). The necessity of Christ\'s death and resurrection was the essence of Paul\'s message (<a onClick="return mV(\'Act\',17,3);">Ac 17:3</a>). And in the address to the elders, the church is declared to have been purchased by God with His own blood (<a onClick="return mV(\'Act\',20,28);">Ac 20:28</a>).<P>As the epistles express the more elaborated thought of the apostolic ministry, the sacrifice of our Lord naturally finds more definite exposition, and inasmuch as He was both active and passive in the offering of Himself, the conception of sacrifice branches into the twofold division, the object offered, and the person offering. It must never be forgotten, however, that the thought of Christ\'s sacrifice even when thus separated into its two great divisions necessarily involves in each conception the suggestion of the other: God setting Him forth as a propitiation through faith in His blood (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>). He was delivered for our offenses and raised for our justification (<a onClick="return mV(\'Rom\',4,25);">Ro 4:25</a>). Through Him we have access to the conditions of justification and peace (<a onClick="return mV(\'Rom\',5,2);">Ro 5:2</a>). Christ died for the ungodly, and we are justified by His blood (<a onClick="return mV(\'Rom\',5,8,9);">Ro 5:8-9</a>). The conception of life both as forfeit from man and gift by God, expressed by sacrifice, runs through the reasoning of <a onClick="return mV(\'Rom\',8,\'1-\');">Ro 8</a> (see especially <a onClick="return mV(\'Rom\',8,11,32,33,34);">Ro 8:11, 32-34</a>, where Christ who died for man rises from the dead, and becomes the intercessor; the victim and the High Priest are thus united in the Lord, and thus He becomes full expression and supplier of the love of God which is the perfect life). In <a onClick="return mV(\'1Cr\',1,23);">1Co 1:23</a> Paul affirms the preaching of the cross as the center of his message. The subject of his teaching was not merely Christ, but Christ and Him crucified (<a onClick="return mV(\'1Cr\',2,2);">1Co 2:2</a>). In <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a> Christ is declared to be the Passover, and sacrificed for us (<a onClick="return mV(\'1Cr\',10,\'16-18\');">1Co 10:16-18</a>). The manifestation of the death of the Lord by the bread and wine is given in the account of the institution of the Supper (<a onClick="return mV(\'1Cr\',11,26);">1Co 11:26</a>). In <a onClick="return mV(\'1Cr\',15,3);">1Co 15:3</a> Christ is said expressly to have died for our sins. Christ\'s sacrifice lies at the basis of all the thought of the Galatian epistle (<a onClick="return mV(\'Gal\',1,4);">Gal 1:4</a>; <a onClick="return mV(\'Gal\',2,20);">2:20</a>; <a onClick="return mV(\'Gal\',3,13);">3:13</a>). In Eph we have the definite statement of redemption through the blood of Christ (<a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>). Christ\'s humiliation to the cross is given in <a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>; community with Christ\'s death, one of the important elements of sacrifice, in <a onClick="return mV(\'Phl\',3,10,11);">Php 3:10-11</a>. Forgiveness, the essence of redemption, is declared to be through the blood of Christ (<a onClick="return mV(\'Col\',1,14);">Col 1:14</a>). Peace is secured through the blood of the cross, and reconciliation (<a onClick="return mV(\'Col\',1,20);">Col 1:20</a>); the presentation of us in Christ\'s flesh through death, holy and unblamable and unreprovable to God (<a onClick="return mV(\'Col\',1,22);">Col 1:22</a>). The community of sacrifice sets forth the oneness of believers with Christ (<a onClick="return mV(\'Col\',3,\'1-4\');">Col 3:1-4</a>). Christ is declared to be the one Mediator between God and man, who gave Himself a ransom for all (<a onClick="return mV(\'1Ti\',2,5,6);">1Ti 2:5-6</a>).<P>7. The Crowning Testimony of the Epistle
