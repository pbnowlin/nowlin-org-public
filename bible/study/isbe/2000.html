thew\'s representation. This indeed was one of the common modes of reckoning the imperial reigns. The mode of reckoning from the assumption of the tribunician power or from the designation as imperator is altogether unlikely in Luke\'s case and intrinsically improbable, since for Tiberius the one began in 748/6 and the other in 743/11 (Dio Cassius Iv. 9; liv. 33; Vell. ii. 99; Suet. Tib. ix.11). But if, as seems likely, the method of reckoning by imperial years rather than by the yearly consuls was not definitely fixed when Luke wrote, it is possible that he may have counted the years of Tiberius from his appointment in 764/11 or 765/12 to equal authority with Augustus in the provinces (Veil. ii 121; Suet. Tib. xx. 21; Tac. Ann. i.3). This method seems not to have been employed elsewhere (Lewin, op. cit., 1143f; compare Ramsay, op. cit., 202f). The coins of Antioch in which it is found are regarded as spurious (Eckhel, op. cit., III, 276), the genuine coins reckoning the reign of Tiberins from the death of Augustus (ibid., III, 278). If Luke reckoned the reign of Tiberins from 764/11 or 765/12, the 15th year would fall in 778/25 or 779/26, probably the latter, and Jesus\' birth about thirty years earlier, i.e. about 748/6 or 749/5.<P>3. First Passover:<P>At the time of the first Passover in Jesus\' ministry the Herodian temple had been building 46 years (<a onClick="return mV(\'Jhn\',2,20);">Joh 2:20</a>). Herod began the temple in the 18th year of his reign (Ant., XV, xi,1,which probably corrects the statement in BJ, I, xxi, I that it was the 15th year; compare Schurer, op. cit., I, 369f; note 12). As Josephus reckons from the accession of Herod in 717/37, the 18th year would be 734/20 to 735/21 and 46 years later would be 780/27 to 781/28. The interval implied in John between this Passover an d the beginning of Jesus\' ministry agrees well with the Lucan dating of the baptism in 779/26.<P>4. Death of John the Baptist:<P>The imprisonment of John the Baptist, which preceded the beginning of Jesus\' Galilean work, was continued for a time (<a onClick="return mV(\'Mat\',11,\'2-19\');">Mt 11:2-19</a>; <a onClick="return mV(\'Luk\',7,\'18-35\');">Lu 7:18-35</a>) but was finally terminated by beheading at the order of Herod Antipas. Announcement of the death was made to Jesus while in the midst of His Galilean ministry (<a onClick="return mV(\'Mat\',14,\'3-12\');">Mt 14:3-12</a>; <a onClick="return mV(\'Mar\',6,\'14-29\');">Mr 6:14-29</a>; <a onClick="return mV(\'Luk\',9,\'7-9\');">Lu 9:7-9</a>). Josephus reports that the defeat of Antipas by Aretas, in the summer of 789/36, was popularly regarded as a Divine punishment for the murder of John (Ant., XVIII, v, 2); But although Josephus mentions the divorce of Aretas daughter by Antipas as one of the causes of hostilities, no inference can be drawn from this or from the popular interpretation of Antipas\' defeat, by which the int erval between John s death and this defeat can be fixed (Schurer, op. cit., I, 443f).<P>5. Length of Jesus\' Ministry:<P>The Synoptic Gospels mention the Passion Passover at which Jesus\' ministry was terminated, but they contain no data by which the interval between the imprisonment of John the Baptist and this Passover can be fixed with certainty. Yet indications are not wanting that the interval consisted of at least two years. The Sabbath controversy broke out in Galilee when the grain was still standing in the fields (<a onClick="return mV(\'Mat\',12,1);">Mt 12:1</a>; <a onClick="return mV(\'Mar\',2,23);">Mr 2:23</a>; <a onClick="return mV(\'Luk\',6,1);">Lu 6:1</a>) and the condition of the grass when the Five Thousand were fed (<a onClick="return mV(\'Mat\',14,15);">Mt 14:15</a>; <a onClick="return mV(\'Mar\',6,39);">Mr 6:39</a>; <a onClick="return mV(\'Luk\',9,12);">Lu 9:12</a>) points to the springtime, the Passion Passover marking the return of still another springtime (compare also <a onClick="return mV(\'Luk\',13,7);">Lu 13:7</a>; <a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>). But the Gospel of John mentions explicitly three Passovers (<a onClick="return mV(\'Jhn\',2,23);">Joh 2:23</a>; <a onClick="return mV(\'Jhn\',6,4);">6:4</a>; <a onClick="return mV(\'Jhn\',11,55);">11:55</a>) and probably implies a fourth (<a onClick="return mV(\'Jhn\',5,1);">Joh 5:1</a>), thus necessitating a ministry of at least two years and making probable a ministry of three years after the first Passover. The Passover of <a onClick="return mV(\'Jhn\',6,4);">6:4</a> cannot be eliminated on textual grounds, for the documentary evidence is conclusive in its favor and the argument against it based on the statements of certain patristic writers is unconvincing (compare Turner, HDB, I, 407f; Zahn, Kom., IV, 708ff). The indications of time from <a onClick="return mV(\'Jhn\',6,4);">Joh 6:4</a>—the Passover when the Five Thousand were fed in Galilee—to <a onClick="return mV(\'Jhn\',11,55);">Joh 11:55</a>—the Passion Passover—are definite and clear (<a onClick="return mV(\'Jhn\',7,2);">Joh 7:2</a>; <a onClick="return mV(\'Jhn\',10,22);">10:22</a>). But the interval between the first Passover (<a onClick="return mV(\'Jhn\',2,23);">Joh 2:23</a>) and the Galilean Passover (<a onClick="return mV(\'Jhn\',6,4);">Joh 6:4</a>) must have been one and may have been two years. The following considerations favor the latter view: Jesus was present in Jerusalem at a feast (<a onClick="return mV(\'Jhn\',5,1);">Joh 5:1</a>) which is not named but is called simply "a" or "the" feast of the Jews. The best authorities for the text are divided, some supporting the insertion, others the omission of the definite article before "feast." If the article formed part of the original text, the feast may have been either Tabernacles—from the Jewish point of view—or Passover—from the Christian point of view. If the article was wanting in the original text, the identification of the feast must be made on contextual and other grounds. But the note of time in <a onClick="return mV(\'Jhn\',4,35);">Joh 4:35</a> indicates the lapse of about nine months since the Passover of <a onClick="return mV(\'Jhn\',2,23);">Joh 2:23</a> and it is not likely that the Galilean ministry which preceded the feeding of the Five Thousand lasted only about three months. In fact this is rendered impossible by the condition of the grain in the fields at the time of the Sabbath controversy. The identification of the feast of <a onClick="return mV(\'Jhn\',5,1);">Joh 5:1</a> with Purim, even if the article be not genuine, is extremely improbable; and if so, a Passover must have intervened between <a onClick="return mV(\'Jhn\',2,23);">Joh 2:23</a> and <a onClick="return mV(\'Jhn\',6,4);">Joh 6:4</a>, making the ministry of Jesus extend over a period of three years and the months which preceded the Passover of <a onClick="return mV(\'Jhn\',2,23);">Joh 2:23</a>. While the identification cannot be made with certainty, if the feast was Passover the subject of the controversy with the Jews in Jerusalem as well as the season of the year would harmonize with the Synoptic account of the Sabbath controversy in Galilee which probably followed this Passover (compare the variant reading in <a onClick="return mV(\'Luk\',6,1);">Lu 6:1</a>).<P>6. Death of Jesus:<P>Jesus was put to death in Jerusalem at the time of the Passover when Pontius Pilate was procurator of Judea (<a onClick="return mV(\'Mat\',27,2);">Mt 27:2</a>ff; <a onClick="return mV(\'Mar\',15,1);">Mr 15:1</a>ff; <a onClick="return mV(\'Luk\',23,1);">Lu 23:1</a>ff; <a onClick="return mV(\'Jhn\',18,29);">Joh 18:29</a>ff; <a onClick="return mV(\'Jhn\',19,1);">Joh 19:1</a>ff; <a onClick="return mV(\'Act\',3,13);">Ac 3:13</a>; <a onClick="return mV(\'Act\',4,27);">4:27</a>; <a onClick="return mV(\'Act\',13,28);">13:28</a>; <a onClick="return mV(\'1Ti\',6,13);">1Ti 6:13</a>; Tac. Ann. xv.44), Caiaphas being the high priest (<a onClick="return mV(\'Mat\',26,3,17);">Mt 26:3, 17</a>; <a onClick="return mV(\'Jhn\',11,49);">Joh 11:49</a>; <a onClick="return mV(\'Jhn\',18,13);">18:13</a>ff) and Herod Antipas the tetrarch of Galilee and Perea (<a onClick="return mV(\'Luk\',23,7);">Lu 23:7</a>ff). Pilate was procurator from 779/26 to 789/36 (Ant., XVIII, iv, 3; v, 3; compare Schurer, op. cit., I,487,note 141); Caiaphas was high priest from 771/18 to 789/36 (Ant., XVIII, ii, 2; iv, 3; compare Schurer, op. cit., II, 271) and Antipas was tetrarch from 750/4 to 792/39. If the first Passover of Jesus\' ministry was in 780/27, the fourth would fall in 783/30. The gospels name Friday as the day of the crucifixion (<a onClick="return mV(\'Mat\',27,62);">Mt 27:62</a>; <a onClick="return mV(\'Mar\',15,42);">Mr 15:42</a>; <a onClick="return mV(\'Luk\',23,54);">Lu 23:54</a>; <a onClick="return mV(\'Jhn\',19,14,31,42);">Joh 19:14, 31, 42</a>) and the Synoptic Gospels represent this Friday as Nisan 15—the day following (or according to Jewish reckoning from sunset to sunset, the same day as) the day on which the paschal supper was eaten (<a onClick="return mV(\'Mat\',26,17);">Mt 26:17</a>ff; <a onClick="return mV(\'Mar\',14,12);">Mr 14:12</a>ff; <a onClick="return mV(\'Luk\',22,7);">Lu 22:7</a>ff). But the Fourth Gospel is thought by many to represent the paschal meal as still uneaten when Jesus suffered (<a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>; compare <a onClick="return mV(\'Jhn\',13,29);">Joh 13:29</a>); and it is held that the Synoptic Gospels also contain traces of this view (<a onClick="return mV(\'Mat\',26,5);">Mt 26:5</a>; <a onClick="return mV(\'Mar\',14,2);">Mr 14:2</a>; <a onClick="return mV(\'Mar\',15,21);">15:21</a>; <a onClick="return mV(\'Luk\',23,26);">Lu 23:26</a>). Astronomical calculations show that Friday could have fallen on Nisan 14 or 15 in 783/30 according to different methods of reckoning (von Soden, EB, I, 806; compare Bacon, Journal of Biblical Literature, XXVIII, 2, 1910, 130ff; Fotheringham, Jour. of Theol. Studies, October, 1910, 120ff), but the empirical character of the Jewish calendar renders the result of such calculations uncertain (Schurer, op. cit., I, 749f). In the year 783/30 Friday, Nican 15, would fall on April 7. There is an early patristic tradition which dates the death of Jesus in the year 782/29, in the consulship of the Gemini (Turner, HDB, I, 413f), but its origin and trustworthy character are problematical.<P>7. Summary of Dates:<P>1. Birth of Jesus, 748/6.<P>2. Death of Herod the Great, 750/4.<P>3. Baptism of Jesus, 779/26.<P>4. First Passover of Jesus\' ministry, 780/27.<P>5. Death of Jesus, 783/30.<P>LITERATURE.<P>Schurer, Geschichte des Judischen Volkes im Zeitalter Jesu Christi, 3. und 4. Aufl., 1901-9, 3 volumes, English translation of the 2nd edition, in 5 volumes, 1885-94; Ideler, Handbuch der mathematischen und technischen Chronologie, 1825-26, 2 volumes; Wieseler, Chronologische Synopse der Evangelien,1843,English translation; Lewin, Fasti Sacri, 1865; Turner, article "Chronology of the NT" in HDB, 1900, I. 403-25; von Soden, article "Chronology" in Cheyne and Black, EB, 1899, I, 799-819; Ramsay, Was Christ Born at Bethlehem? 1898; F. R. Montgomery Hitchcock, article "Dates" in Hastings, Dictionary of Christ and the Gospels; Mommsen, Res Gestae Divi Augusti2.<P>II. Chronology of the Apostolic Age.<P>The chronology of the apostolic age must be based on the data in Acts and the epistolary literature of the New Testament which afford contacts with persons or events of the Greek-Roman world. From the fixed points thus secured a general outline of the relative chronology may be established with reasonable probability.<P>1. Paul\'s Conversion:<P>Paul was converted near Damascus (<a onClick="return mV(\'Act\',9,3);">Ac 9:3</a>ff; <a onClick="return mV(\'Act\',22,5);">Ac 22:5</a>ff; <a onClick="return mV(\'Act\',26,12);">Ac 26:12</a>ff; <a onClick="return mV(\'Gal\',1,17);">Ga 1:17</a>). After a brief stay in that city (<a onClick="return mV(\'Act\',9,19);">Ac 9:19</a>ff) he went to Arabia and then came again to Damascus (<a onClick="return mV(\'Gal\',1,17);">Ga 1:17</a>). When he left Damascus the second time, he returned to Jerusalem after an absence of three years (<a onClick="return mV(\'Gal\',1,18);">Ga 1:18</a>). The flight of Paul from Damascus (<a onClick="return mV(\'Act\',9,24);">Ac 9:24</a>) probably terminated his second visit to the city. At that time the ethnarch of Aretas, the king of the Nabateans, acting with the resident Jews (<a onClick="return mV(\'Act\',9,23);">Ac 9:23</a>f), guarded the city to seize him (<a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>). Aretas IV succeeded Obodas about 9 BC, and reigned until about 40 AD Damascus was taken by the Romans in 62 BC and probably continued under their control until the death of Tiberius (March 37 AD). Roman coins of Damascus exist from the time of Augustus, Tiberius and Nero, but there are no such coins from the time of Caligula and Claudius (Schurer, op. cit., I, 737; II, 153). Moreover the relations of Aretas to Augustus and Tiberius make it extremely improbable that he held Damascus during their reign as part of his kingdom or acquired it by conquest. The statement of Paul however seems to imply Nabatean control of the city, and this is best explained on the supposition that Damascus was given to Aretas by Caligula, the change in the imperial attitude being due perhaps to the influence primarily of Agrippa and possibly also of Vitellius (Steinmann, Aretas IV, 1909, 34ff). But if Paul\'s escape from Damascus was not earlier than 37 AD, his conversion cannot be placed earlier than 34 or 35 AD, and the journey to Jerusalem 14 years later (<a onClick="return mV(\'Gal\',2,1);">Ga 2:1</a>) not earlier than 50 or 51 AD.<P>2. Death of Herod Agrippa I:<P>Herod Agrippa I died in Caesarea shortly after a Passover season (<a onClick="return mV(\'Act\',12,23);">Ac 12:23</a>; compare <a onClick="return mV(\'Act\',12,3,19);">Ac 12:3, 19</a>). Caligula had given him the tetrarchy of Philip and of Lysanias in 37 AD—the latter either at this time or later—with the title of king (Ant., XVIII, vi, 10; BJ, II, ix, 6) and this was increased in 40 AD by the tetrarchy of Antipas (Ant., XVIII, vii, 1f; BJ, II, ix, 6). Claudius gave him also Judea and Samaria (Ant., XIX, v, 1; BJ, II, xi, 5) thus making his territory even more extensive than that of his grandfather, Herod the Great. Agrippa reigned over "all Judea" for three years under Claudius (Ant., XIX, viii, 2; BJ, II, xi, 6), his death falling in the spring of 44 AD, in the 7th year of his reign. The games mentioned by Josephus in this connection are probably those that were celebrated in honor of the return of Claudius from Britain in 44 AD. There are coins of Agrippa from his 6th year, but the attribution to him of coins from other years is questioned (Schurer, op. cit., 560, note 40; Madden, op. cit., 132).<P>3. Famine under Claudius:<P>The prophecy of a famine and its fulfillment under Claudius (<a onClick="return mV(\'Act\',11,28);">Ac 11:28</a>) are associated in Acts with the death of Herod Agrippa I (<a onClick="return mV(\'Act\',11,30);">Ac 11:30</a>; <a onClick="return mV(\'Act\',12,23);">12:23</a>). Famines in Rome during the reign of Claudius are mentioned by Suetonius (Claud. xviii), Dio Cassius (lx. 11), Tacitus (Annals xii. 43), and Orosius (vii. 6). Josephus narrates in the time of Fadus the generosity of Helena during a famine in Palestine (Ant., XX, ii, 5), but subsequently dates the famine generally in the time of Fadus and Alexander. The famine in Palestine would fall therefore at some time between 44 and 48 (Schurer, op. cit., I, 567, note 8).<P>4. Sergius Paulus:<P>When Paul visited Cyprus with Barnabas the island was administered by Sergius Paulus (<a onClick="return mV(\'Act\',13,7);">Ac 13:7</a>ff), a proprietor with the title proconsul (Marquardt, op. cit., I, 391). There is an inscription from Cyprus (Cagnat, Inscr. graec. ad res rom. pertin., III; 930) dating from the 1st century, and probably from the year 53 (Zahn, Neue kirch. Zeitschr.,1904, XV, 194) in which an incident in the career of a certain Apollonius is dated in the proconsulship of Paulus (epi Palilou (anth)upatou). From another inscription (CIG, 2632), dated in the 12th year of Claudius, it appears that L. Annins Bassus was proconsul in 52. If the Julius Cordus mentioned by Bassus was his immediate predecessor, the proconsulship of Sergius Paulus may be dated at some time before 51.<P>5. Edict of Claudius:<P>When Paul came to Corinth for the first time he met Aquila and Priscilla, who had left Rome because of an edict of Claudius expelling the Jews from the city (<a onClick="return mV(\'Act\',18,2);">Ac 18:2</a>). Suetonius mentions an expulsion of the Jews from Rome by Claudius but gives no date (Claud. xxv; compare Dio Cassius lx.6). Orosius however dates the edict in the 9th year of Claudius or 49 AD (Hist. vii. 6, 15); and though Josephus, from whom he quotes, does not mention this edict. but records the favor shown by Claudius to the Jews and to Herod Agrippa I (Ant., XIX, v, 1-3; compare Dio Cassius LX. 6, 6, 9, 10; 8, 2), it is not improbable that the date is approximately accurate (Schurer, op. cit., III, 62, note 92).<P>6. Gallio:<P>During Paul\'s first sojourn in Corinth the apostle was brought before the proconsul Gallio (<a onClick="return mV(\'Act\',18,12);">Ac 18:12</a>). This could not have been earlier than the year 44 when Claudius gave Achaia back to the Senate and the province was administered by a proprietor with the title of proconsul (Dio Cassius lx.24; Marquardt, op. cit., I, 331f; Ramsay, The Expositor.,1897, I, 207). Moreover the career of Seneca makes it improbable that his brother would be advanced to this position before 49 or 50 (Harnack, Chron., I, 237; Wieseler, Chron. d. apos. Zeitalters, 119). There is a fragmentary inscription from Delphi containing a letter from the emperor Claudius in which mention is made of Gallio. The inscription is dated by the title of the emperor which contains the <span class="noTag">number 26</span>. This is referred naturally to the acclammatio as "imperator" and dated in the year 52 before August, after which time the <span class="noTag">number 27</span> occurs in the title of Claudian inscriptions. Gallio may therefore have been proconsul from the spring or summer of the year 51-52 or 52-53. The latter seems the more probable time (compare Aem. Bourguet, De rebus Delphicis,1905,63f; Ramsay, The Expositor.,1909, I, 467f; Princeton Theological Review, 1911, 290f; 1912, 139f; Deissmann, Paulus, 1911, 159-177; Lietzmann, Zeitschrift fur wissenschaftliche Theologie, 1911, 345-54).<P>7. Festus:<P>When Paul had been for two years a prisoner in Caesarea Felix was succeeded by Festus as procurator of Judea (<a onClick="return mV(\'Act\',24,27);">Ac 24:27</a>). The accession of Festus, which is placed by Eusebius in the Church History in the reign of Nero (Historia Ecclesiastica, II, 22, 1), is dated in the Chronicle in the version of Jerome in the 2nd year of Nero, 56 AD, and in the Armenian version in the 14th year of Claudius, 54 AD. The excerpts from the Chronicle in Syncellus apparently follow the text underlying the version of Jerome, but state simply that Festus was sent as successor of Felix by Nero (ed. Schoene, II, 154). After his removal from office Felix was tried in Rome, but escaped punishment through the influence of his brother Pallas, who, according to Josephus, was in favor with Nero at that time (Ant., XX, viii, 9). Pallas was removed from office before February 13, 55 AD (Tac. Ann. xiii. 14, 1; compare 15, 1), but apparently continued to have influence with the emperor; for he fixed the terms of his removal and was permitted to enjoy his fortune for several years (Tac. Ann. xiii.14, 1f; 23, 1-3). His death occurred in 62 AD (Tac. Ann. xiv.65, 1). The trial of Felix must therefore have occurred before 62; but it is impossible to place it before the removal of Pallas, for this would necessitate the removal of Felix in 54 AD, and this is excluded by the fact that the first summer of Nero\'s reign fell in 55 AD. But if Eusebius reckoned the imperial years from September 1st after the accession (Turner, Jour. of Theol. Studies, 1902, 120f; HDB, I, 418f), the summer of the second year of Nero would fall in 57. In any event the removal and trial of Felix must have fallen after the removal of Pallas. The date of the Eusebian Chronicle is thus without support from Tacitus or Josephus, and its value depends on the character of the source from which it was obtained—if there was such a source, for it is at least possible that the definite date owes its origin solely to the necessities imposed on Eusebius by the form of the Chronicle. It is not unlikely that the error of 5 years made by Eusebius in the reign of Agrippa II may be the source of a similar error in regard to Festus in spite of the fact that the framework of the Chronicle is generally furnished not by the years of the Jewish kings but by the imperial years (Erbes in Gebhardt u. Harnack, Texte und Untersuchungen, N. F., IV, 1, 1899; Die Todestage d. Apos. Paulus u. Petrus; Turner, Jour. of Theol. Studies,1902,III, 120f; Ramsay, Pauline and Other Studies, 1906, 350ff). There is evidence however in <a onClick="return mV(\'Act\',21,38);">Ac 21:38</a> that Paul\'s arrest could not have been earlier than the spring of 55 AD. For Paul was supposed by the chief captain to be the Egyptian who had led an insurrection that had been suppressed by Felix during the reign of Nero (Ant., XX, viii, 6; BJ, II, 13, 5). Thus the accession of Festus, two years later (<a onClick="return mV(\'Act\',24,27);">Ac 24:27</a>), could not have been earlier than 57 AD.<P>But if the summer of 57 AD is the earliest date possible for the accession of Festus, the summer of 60 AD is the latest date that is possible. Albinus, the successor of Festus, was present in Jerusalem in October, 62 AD (Ant., XX, ix, 1ff), and while the administration of Festus was probably shorter than that of Felix (compare Ant, XX, viii, 9-11; BJ, II, xiv, 1 with Ant, XX, vii, 1-8, 8; BJ, II, 12-13), it is not likely that it lasted less than two years. But as between 57 AD and 60 AD, probability favo rs the latter. For greater justice is thus done to the words of Paul to Felix: "Forasmuch as I know that thou hast been of many years a judge unto this nation," etc. (<a onClick="return mV(\'Act\',24,10);">Ac 24:10</a>). Felix was appointed by Claudius in 52 AD (Tac. Ann. xii. 54; Ant, XX, v, 2) and was continued in office by Nero. Most of the events of his administration are narrated by Josephus under Nero (Ant., XX, viii, 5ff); and although Tacitus mentions an administration of Felix in Samaria when Cumanus was administering Galilee (Ann. xii.54), the omission of any direct reference to Judea, the unusual character of such a double administration and the explicit statement of Josephus that Claudius sent Felix as successor of Cumanus, make it unlikely that Paul\'s statement is to be understood of an administration beginning earlier than 52 AD. If Festus succeeded in the summer of 60 AD, Paul\'s arrest would fall in 58 and the "many years" of Felix\' administration would cover a period of 6 years, from 52 AD to 58 AD (compare Schurer, op. cit., I, 577f; note 38). Ramsay argues in favor of 57 AD as the year of Paul\'s arrest and 59 AD as the year of the accession of Festus (Pauline and Other Studies, 1906, 345ff).<P>8. Relative Chronology of Acts:<P>If Festus succeeded Felix in the summer of 60 AD, Paul would reach Rome in the spring of 61 AD, and the narrative in Acts would terminate in 63 AD (<a onClick="return mV(\'Act\',28,30);">Ac 28:30</a>). Paul\'s arrest in Jerusalem 2 years before the accession of Festus (<a onClick="return mV(\'Act\',24,27);">Ac 24:27</a>) would fall in the spring of 58 AD. Previous to this Paul had spent 3 months in Corinth (<a onClick="return mV(\'Act\',20,3);">Ac 20:3</a>) and 3 years in Ephesus (<a onClick="return mV(\'Act\',20,31);">Ac 20:31</a>; compare <a onClick="return mV(\'Act\',19,10);">Ac 19:10</a>), which would make the beginning of the third missionary journey fall about 54 AD. There was an interval between the second and the third journeys (<a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>), and as Paul spent 18 months at Corinth (<a onClick="return mV(\'Act\',18,11);">Ac 18:11</a>) the beginning of the second journey would fall about 51 AD. The Apostolic Council preceded the second journey and may be dated about 50 AD—14 years subsequent to Paul\'s first visit to Jerusalem (37 AD) in the third year after his conversion in 35 AD. The first missionary journey was made after the visit of Paul and Barnabas to Jerusalem with the alms from the church at Antioch (<a onClick="return mV(\'Act\',11,30);">Ac 11:30</a>; <a onClick="return mV(\'Act\',12,25);">12:25</a>), about the time of the death of Herod Agrippa I, and would fall between 44 AD and 50 AD. The growth of the early church in Jerusalem previous to Paul\'s conversion would thus extend over a period of about 5 years from 30 AD to 35 AD.<P>9. Pauline Epistles:<P>Ten of the thirteen Pauline epistles were written during a period of about ten years between Paul\'s arrival in Corinth and the close of his first Roman imprisonment. These epistles fall into three groups, each possessing certain distinctive characteristics; and although each reflects the difference in time and occasion of its production, they all reveal an essential continuity of thought and a similarity of style which evidences unity of authorship. The earliest group consists of the Thessalonian epistles, both of which were written from Corinth on the second missionary journey about 52 or 53 AD, while Silas (Silvanus) was still in Paul\'s company and shortly after Paul\'s visit to Athens (<a onClick="return mV(\'1Th\',1,1);">1Th 1:1</a>; <a onClick="return mV(\'1Th\',3,1,2,6);">3:1-2, 6</a>; <a onClick="return mV(\'2Th\',1,1);">2Th 1:1</a>). The major epistles belong to the third missionary journey. 1 Corinthians was written from Ephesus about 55 AD; Galatians probably from Ephesus, either before or after 1 Corinthians, for Paul had been twice in Galatia (<a onClick="return mV(\'Gal\',4,13);">Ga 4:13</a>); 2 Corinthians from Macedonia about 57 AD; and Romans from Corinth about 57 or 58 AD. The imprisonment epistles were written from Rome: Colossians, Ephesians and Philemon about 62 AD, and Philippians about 63 AD.<P>10. Release and Death of Paul:<P>When Paul wrote to Philemon (<a onClick="return mV(\'Phm\',1,22);">Phm 1:22</a>) and to the Philippians (<a onClick="return mV(\'Phl\',2,24);">Php 2:24</a>; compare <a onClick="return mV(\'Phl\',1,25);">Php 1:25</a>), he expected a favorable issue of his trial in Rome and was looking forward to another visit to the East. Before his arrest he had planned a journey to Spain by way of Rome (<a onClick="return mV(\'Rom\',15,28);">Ro 15:28</a>), and when he bade farewell to the Ephesian elders at Miletus (<a onClick="return mV(\'Act\',20,25);">Ac 20:25</a>) he must have had in mind not only the dangers of his journey to Jerusalem, but also his determination to enter another field of labor. 1 Clement 5, the Muratori Canon and the Apocryphal Acts of Peter (Zahn, Einltg.3, I, 444f) witness to the Spanish journey, and the Pastoral Epistles to a journey to the East and to another imprisonment in Rome. The two lines of evidence for Paul\'s release are independent and neither can be explained as derived merely from the statement of Paul\'s intention in Romans and in Philemon and Philippians. The historical situation implied in the Pastoral Epistles can be charged with artificiality only on the hypothesis that Paul was not released from his first Roman imprisonment. The data of these epistles cannot be fitted into any period of Paul\'s life previous to his imprisonment. But these data are embodied in just those parts of the Pastoral Epistles which are admitted to be Pauline by those who regard the epistles as containing only genuine fragments from Paul but assign the epistles in their present form to a later writer. On any hypothesis of authorship, however, the tradition which these epistles contain cannot be much later than the first quarter of the 2nd century. It is highly probable therefore that Paul was released from his first Roman imprisonment; that he visited Spain and the East; and that he was imprisoned a second time in Rome where he met his death in the closing years of Nero\'s reign, i.e. in 67 or 68 AD. According to early tradition Paul suffered martyrdom by beheading with the sword (Tert., De praescr. haer., xxxvi), but there is nothing to connect his death with the persecution of the Christians in Rome by Nero in 64 AD.<P>Little is known of Peter beside what is recorded of him in the New Testament. The tradition of his bishopric of 20 or 25 years in Rome (compare Harnack, Gesch. d. altchr. Lit., II; Die Chronologie, I, 243f) accords neither with the implications of Acts and Galatians nor with Paul\'s silence in Rom.<P>11. Death of Peter:<P>But 1 Peter was probably written from Rome (<a onClick="return mV(\'1Pe\',5,13);">1Pe 5:13</a>; compare Euseb., HE, ii.15, 2) and the testimony to Peter\'s martyrdom (implied in <a onClick="return mV(\'Jhn\',21,18);">Joh 21:18</a>f) under Nero in Rome by crucifixion (Tert., De praes. haer., xxxvi; compare 1 Clem 5:1ff) is early and probably trustworthy. Tradition also associates Peter and Paul in their Roman labors and martyrdom (Dionysius in Euseb., HE, ii. 25, 8; Iren., Adv. haer., iii.1, 2; iii. 3, 1). The mention of the Vatican as the place of Peter\'s interment (Caius in Euseb., HE, ii. 25, 6f) may indicate a connection of his martyrdom with the Neronian persecution in 64 AD; but this is not certain. Peter\'s death may therefore be dated with some probability in Rome between 64 and 67 AD. His two epistles were written at some time before his death, probably the First about 64 and the Second at some time afterward and subsequent to the Epistle of Jude which it apparently uses. (The arguments against the Roman sojourn and martyrdom of Peter are stated fully by Schmiedel in the Encyclopedia Biblica, under the word "Simon Peter," especially col. 458ff; on the other hand compare Zahn, Einleitung3, II, 17ff, English translation, II, 158ff.)<P>12. Death of James the Just:<P>James the Just, the brother of the Lord, was prominent in the church of Jerusalem at the time of the Apostolic Council (<a onClick="return mV(\'Act\',15,13);">Ac 15:13</a>ff; <a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>; compare <a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>; <a onClick="return mV(\'Gal\',2,12);">2:12</a>) and later when Paul was arrested he seems still to have occupied this position (<a onClick="return mV(\'Act\',21,18);">Ac 21:18</a>ff), laboring with impressive devotion for the Jewish people until his martyrdom about the year 66 AD (Ant., XX, ix, 1; Euseb., HE, ii.23, 3ff; HRE3, VIII, 581; Zahn, Einltg.3, I, 76). The Epistle of James contains numerous indications of its early origin and equally clear evidence that it was not written during the period when the questions which are discussed in the major epistles of Paul were agitating the church. It is probably the earliest book of the New Testament, written before the Apostolic Council.<P>13. The Synoptic Gospels, etc.:<P>In the decade just preceding the fall of Jerusalem, the tradition of the life and teaching of Jesus was committed to writing in the Synoptic Gospels. Early tradition dates the composition of Matthew\'s Gospel in the lifetime of Peter and Paul (Iren., Adv. haer., ill. l, 1; Eusebius, HE, v.8, 2ff), and that of the Gospel of Mark either just before or after Peter\'s death (Clement in Euseb., HE, vi.14, 7; compare ii.15; and Irenaeus, Adv. haer., iii.11, 1; Presbyter of Papias in Euseb., HE, iii. 39, 15; compare also <a onClick="return mV(\'2Pe\',1,15);">2Pe 1:15</a>). The Lucan writings—both the Gospel and Acts—probably fall also in this period, for the Gospel contains no intimation that Jesus\' prophecy of the destruction of Jerusalem had been fulfilled (compare <a onClick="return mV(\'Luk\',21,21);">Lu 21:21</a>; <a onClick="return mV(\'Act\',11,28);">Ac 11:28</a>), and the silence of Acts about the issue of Paul\'s trial is best explained on the hypothesis of an early date (Jerome, De vir. illustr., vii; Harnack, Neue Untersuch. zur Apostelgesch., 1911; compare also <a onClick="return mV(\'Luk\',10,7);">Lu 10:7</a>; <a onClick="return mV(\'1Ti\',5,18);">1Ti 5:18</a>). To this period belong also the Epistle of Jude and the Epistle to the He (if addressed to Jewish Christians of Palestine; but later, about 80 AD, if addressed to Jewish Christians of Rome (Zahn, Einltg.3, II, 152)), the former being used in 2 Peter and the latter in 1 Clement.<P>14. Death of John:<P>Early tradition connects John with Ephesus and mentions his continuing in life until the time of Trajan (Irenaeus, Adv. haer., ii.22, 5 (Eusebius, HE, v.24); iii. l, 1; v.30, 3; v.33, 4; Clement in Eusebius, HE, iii.23, 5-19; Polycrates in Eusebius, HE, iii. 31, 3; v.24, 3; Justin, Dialogue, lxxxi; compare <a onClick="return mV(\'Rev\',1,1,4,9);">Re 1:1, 4, 9</a>; <a onClick="return mV(\'Rev\',22,8);">22:8</a>; <a onClick="return mV(\'Jhn\',21,22,23,24);">Joh 21:22-24</a>; <a onClick="return mV(\'Jhn\',19,35);">19:35</a>). He died probably about the end of the 1st century. There is another but less well-attested tradition of martyrdom based chiefly on the De Boor fragment of Papias (Texte u. Unters., 1888), a Syriac Martyrology of the 4th century (Wright, Jour. of Sacred Lit., 1865-66, VIII, 56ff, 423ff), the Codex Coislinianus 305 of Georgius Hamartolus. This tradition, it is thought, finds confirmation in <a onClick="return mV(\'Mar\',10,\'35-40\');">Mr 10:35-40</a>; <a onClick="return mV(\'Mat\',20,\'20-23\');">Mt 20:20-23</a> (compare Bousset, Theologische Rundschau, 1905, 225ff, 277ff). During the closing years of his life John wrote the Revelation, the Fourth Gospel and the three Epistles.<P>15. Summary of Dates:<P>LITERATURE.<P>In addition to the literature mentioned in section 8: Anger, De temporum in actis apostolorum ratione. 1833; Wieseler, Chronologie des apos. Zeitalters, 1848: Hoennicke, Die Chronologie des Lebens des Apostels Paulus, 1903; Harnack, Gesch. d. altchr. Lit. bis Euseb., II,1,Die Chronologie bis Iren., 1897; Lightfoot, Biblical Essays, 1893; Zahn, Einleitung, II, 1907 (Eng. translation, 1909).``6';
isbe[2097]='Chronology of the Old Testament`kro-nol\'-o-ji:<P><b>I. INTRODUCTORY</b><P class="in15">1. Difficulties of the Subject<P class="in15">2. Plan of Treatment<P class="in15">3. Bible to be Regarded as Highest Authority<P><b>II. THE AGES BETWEEN THE TESTAMENTS</b><P><b>III. PERSIAN PERIOD</b><P><b>IV. BABYLONIAN PERIOD</b><P><b>V. ASSYRIAN PERIOD AND JUDAH AFTER FALL OF SAMARIA</b><P><b>VI. PERIOD OF DIVIDED KINGDOM</b><P class="in15">1. Causes of Variation in Systems<P class="in15">2. Some Important and Pivotal Dates<P class="in15">3. Difficulties to Be Removed<P class="in15">4. Overlappings<P><b>VII. FROM THE DISRUPTION TO THE EXODUS</b><P class="in15">Indications of Overlapping<P><b>VIII. FROM THE EXODUS TO BIRTH OF ABRAHAM</b><P class="in15">Main Points at Issue<P><b>IX. FROM ABRAHAM TO THE CREATION</b><P class="in15">A Suggested Interpretation<P><b>LITERATURE</b><hr /><P>I. Introductory.<P>1. Difficulties of the Subject:<P>For evident reasons the student of Biblical chronology must meet many difficulties, and must always be severely handicapped. First of all, the Old Testament is not purely nor intentionally a book of history. Nor does it present a formulated system of chronology, its many numbers and dates being used principally with a view to the spiritual facts and truths with which the authors were concerned. We are not, therefore, to expect to find a perfectly arranged order of periods and dates, though happily for us in our investigation we shall indeed find many accurately dated events, frequent consecutions of events, and orderly success ions of officials; as, for example, the numerous genealogical tables, the succession of judges and the lists of kings.<P>Furthermore, there is not to be found in the Old Testament one particular and definitely fixed era, from which all of its events are dated, as is the case in Christian history. The points of departure, or reckoning, are found to vary in different periods of the advancing history; being at one stage the Creation, at another the migration of Abraham, or the Exodus, or again the disruption of the kingdom. Ordinarily dates and all time-allusions are comparative, i.e. they are related to the reign of some contemporary monarch, as the vision of Isaiah "in the year that king Uzziah died" (<a onClick="return mV(\'Isa\',6,1);">Isa 6:1</a>), or to some unusual occurrence, historical or natural, as the great earthquake (<a onClick="return mV(\'Amo\',1,1);">Am 1:1</a>; <a onClick="return mV(\'Zec\',14,5);">Zec 14:5</a>). Only occasional reference is found to some event, which marks an era-beginning; such as the Exodus (<a onClick="return mV(\'Jdg\',11,16,26);">Jud 11:16, 26</a>; <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>).<P>The general lack of uniformity among writers on Biblical chronology contributes further toward increase of the already perplexing confusion. It is almost possible to say that no two writers agree; and proposed harmonies are with each other most inharmonious. The two articles on Old Testament chronology in a recent work (Murray, Illus. Bible Dictionary, 1908), for example, are several hundred years apart at certain points. Wide diversity of opinion exists about the most prominent events, such as the call of Abraham and the age of his famous contemporary Hammurabi, the year of the Exodus, and the beginning of Solomon\'s temple. Naturally there is less variance of opinion about later dates, some of which, e.g. the fall of Samaria and the destruction of Jerusalem, may be considered as fixed. A like wide range of opinion prevails among archaeologists with regard to events in contemporaneous history, the difference between Goodspeed and Hommel in the dates of early Babylonian history being five hundred years, and the beginning and extent of the Hyksos period in Egypt varying in different "authorities" by hundreds of years. Nor should the difference in the various and total numbers of the Hebrew, Samaritan and Septuagint texts of the pre-Abrahamic ages be left out of sight in any statement of the difficulties attending the discussion of this subject.<P>2. Plan of Treatment:<P>These difficulties, and others as serious, have determined the plan of this article. The usual method of development has been to begin with the sources of Old Testament history, and to follow its course downward. While such a system may have its advantages, there is, however, this serious disadvantage connected with it: that the least certain dates are confessedly those at the beginning of the records, and the use of them at the foundation renders the whole structure of the discussion more or less uncertain. Archaeology and comparative history have done much to fix dates from the Exodus downward, bringing these later centuries by discovery and translation almost into the position of attested history. But the ages before the Exodus, and particularly before Abraham, still lie from the very nature of the ease in great obscurity. And thus any system beginning with the indistinct early past, with its compacted numbers and their uncertain interpretation, is much like a chain hung on thin air. The writer purposes, therefore, beginning with certain familiar, important and pivotal dates, to gather around and relate to these the events and persons of the Old Testament. Such accepted dates are: the completion of the Second Temple in 516, the fall of Jerusalem in 586, the fall of Samaria in 721, tribute to Shalmaneser II from Jehu in 842, and from a member of Omri\'s dynasty in 854. Such Old Testament events as mark the beginning of eras are the Disruption, Solomon\'s temple, the Exodus and Abraham\'s Call. The material and the plan, then, almost necessarily require that we begin at the end of the history and work logically backward to the earlier stages, at which we may hope to arrive with firm ground under our feet for the disposition of the more uncertain problems. It is hoped that on this plan the system of chronology will not be mere speculation, nor a personal theory, but of some certainty and affording some assurance in days of wild assertion and free manipulation.<P>3. Bible to be Regarded as Highest Authority:<P>It should be remembered that this is a study of Bible chronology, and therefore full value will be given to the explicit and positive statements of the Bible. Surely the time has come, when all fair-minded men should recognize that a clear and straightforward declaration of the Sacred Scriptures is not to be summarily rejected because of its apparent contradiction by some unknown and irresponsible person, who could stamp clay or chisel stone. It has been all too common that archaeological and critical adventurers have doubted and required accurate proof of every Bible statement, but have been ready enough to give credence to any statement from ancient pagan sources. We assume, as we have every reason to do, the trustworthiness of the Bible records, which have been corroborated in countless instances; and we shall follow their guidance in preference to any other. The help of contemporaneous history and the witness of archaeology can be used to advantage, but should not be substituted for the plain facts of the Scriptures, which are full worthy of our trust and regard. The province of a chronology of the Bible is properly to present in system the dates therein given, with an honest effort to harmonize the difficulties, using the external helps, but ever regardful of Scripture authority and rights.<P>II. The Ages between the Testaments.<P>Between the coming of Christ and the end of Old Testament history there lie in round numbers four hundred years. But while these were extra-Biblical ages, they were neither barren nor uneventful years; for in them will be found much of the highest value in the development of Jewish life, and in the preparation for the Messiah. And thus they have their proper place in Bible chronology (see <a href="./study/isbe/search.html?string=BETWEEN+THE+TESTAMENTS">BETWEEN THE TESTAMENTS</a>). The birth of Jesus could not have been later than 4 BC, since Herod the Great died in April of that year. Herod became king of Judea in 37 BC. Palestine had been conquered and Jerusalem entered by the Romans under Pompey in 56 BC, the Jews coming in this way under the power of Rome. The Roman age was preceded by the government of priest-kings, with which the Idumean Antipater became identified by marriage, so that Herod, whom Rome made king, was both Jew and alien.<P>The period of the Maccabees, which ended in 39 BC with the removal of Antigonus by the Romans in favor of Herod, began 168 BC with Judas. Antipater, who had been appointed procurator of Judea in 47, was assassinated in 43 BC. The period of the Seleucids stretches from its close with the regency of Antiochus VII in 128 back to its founder, Seleucus, 312 BC. The most notable of these monarchs from the Jewish point of view was Antiochus Epiphanes, who reigned from 175 to 164, and in 168 gave occasion to the rise of the Maccabees by his many acts of impiety and oppression, particularly the desecration of the Jerusalem temple. In 203 BC Antiochus the Great, who had become king of Syria in 223, took Jerusalem, and later, in 198, annexed Judea to Syria. Previous to this Judea had been an Egyptian dependency, as after the death of Alexander the Great, 323 BC, and the division of his empire, it had been annexed by Ptolemy Soter to Egypt. Ptolemy Philadelphus, becoming king 280 BC, encouraged the translation of the Hebrew Scriptures into Greek, the result being the Septuagint version, and all it meant by way of preparation for the spread of Christianity. Alexander\'s defeat of Darius III, or Codomannus, at Arbela in 331 brought the Persian empire to an end, fulfilling the long-cherished ambition of the Greeks for mastery of Asia. The long reign of the Biblical king of Persia, Artaxerxes Longimanus, extended from 465 to 424 BC, and in reaching his reign we find ourselves in the region of the Old Testament history. Reversing the order of this brief review and setting out from Old Testament point of view, we have the following table for the centuries between the Testaments:<P>III. Persian Period.<P>Entering now the last period of Old Testament history, which may be called the Persian period, we find that the activities of Ezra, Nehemiah and other Jewish leaders are dated by the regnal years of the kings of Persia (e.g. <a onClick="return mV(\'Hag\',1,1);">Hag 1:1</a>; <a onClick="return mV(\'Zec\',1,1);">Zec 1:1</a>; <a onClick="return mV(\'Ezr\',1,1);">Ezr 1:1</a>; <a onClick="return mV(\'Neh\',2,1);">Ne 2:1</a>); and consequently the difficulties in the chronology of this period are not great. Recently a fanciful effort has been made to place the events narrated in Esther, Ezra and Nehemiah in the time of the Babylonian Captivity, claiming Scripture warrant from the occurrence of these names, with Mordecai, in <a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a> and <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>; but altogether without success (see Prince of Judah, or Days of Nehemiah Redated). These names were doubtless of common occurrence, and their appearance among those returning with Zerubbabel is not sufficient to affect the historical evidence for the accepted dates of Ezra and Nehemiah. The attempt to move back these dates into the 6th century, to associate Nehemiah with Daniel and Mordecai and to place his work before Zerubbabel may be dismissed as pure fancy and impossible of reconciliation with the Old Testament narrative.<P>Artaxerxes I began his reign, which gives date to Ezra and Nehemiah, in 465 BC. In his 7th year,458,Ezra went from Babylon to Jerusalem by the king\'s decree (<a onClick="return mV(\'Ezr\',7,7);">Ezr 7:7</a>), taking back with him the vessels of the Temple and much besides for the worship at Jerusalem, accompanied also by a great company of returning Jews. Nehemiah followed from Shushan in the 20th year of the king (<a onClick="return mV(\'Neh\',1,1);">Ne 1:1</a>), having heard of and being distressed by the partial failure of Ezra\'s efforts. Under his wise and courageous leadership, the city walls were speedily restored, and many reforms accomplished. He returned after twelve years (433) to the service of the king in Shushan (<a onClick="return mV(\'Neh\',13,6);">Ne 13:6</a>), but in a short time, hearing evil tidings from Jerusalem, went back to complete his reforms, and apparently spent the rest of his life in that work. Although the Bible is silent, such is the testimony of Josephus. The Book of Malachi, reflecting the difficulties and evils of this time, is evidently to be placed here, but not with exactness, as it might have been written as early as 460 or as late as 420.<P>The period from the return under Ezra (458) back to the completion of the Temple in the reign of Darius I (516) is, with the exception of incidental references and the assignment of undated books and incidents, practically a blank. Here belong, we believe, the Book of Esther, possibly Malachi, some of the Psalms, and those social and religious tendencies among the returned exiles, which made the vigorous reforms of Ezra and Nehemiah so necessary. But the Old Testament does not draw the curtain from the mystery of that half-century, that we may know the happenings and watch the development. Beyond this blank we come again to explicit dates. The second temple, begun with the Return under Zerubbabel, was completed in the 6th year of Darius, i.e. 516. The building of it, which had been early abandoned for selfish reasons, was resumed in the 2nd year of Darius under the exhortation of the prophets Haggai and Zechariah (<a onClick="return mV(\'Hag\',1,1);">Hag 1:1</a>; <a onClick="return mV(\'Zec\',1,1);">Zec 1:1</a>). Darius the Great began his reign in 521. Cambyses succeeded Cyrus in 527. Babyl on was taken by the Persians in 538, and shortly after the Jews, under the edict of Cyrus, began their return to Jerusalem, reaching their destination by 536 at the latest. Cyrus overthrew Lydia in 545, the Medes five years earlier, and must have come to the Persian throne not later than 555. His conquest of Asia Minor opened the contest between Persia and Greece for supremacy, to be continued by Darius and. Xerxes, resulting finally at Arbela (331) in Greek triumph under Alexander, and the inauguration of a new age.<P>The table for the Persian period of Old Testament history, following the stream upward, is therefore as follows:<P>IV. Babylonian Period.<P>Just preceding the Persian is the Babylonian period of Old Testament chronology, overlapping, of course, the former, and finally superseded by it in Cyrus\' conquest of Babylonia. This period may properly be said to begin with the death in 626 BC of Ashurbanipal, the last great ruler of Assyria. At this time Nabopolassar had been made governor of Babylonia, subject to the supremacy of Assyria. With Ashurbanipal\'s death Nabopolassar became independent sovereign of Babylonia, and shortly entered into league with the Medes to overthrow the rule of Assyria, and then to divide its empire between them. This was accomplished in the fall of Nineveh (606) which brought the end of the mighty Assyrian empire, the last king being Sinsharishkun (the historic Saracus), a son of Ashurbanipal. Some years before his death in 604 Nabopolassar associated with him on the throne of Babylonia his son Nebuchadnezzar, most illustrious ruler of the new Babylonian empire, and intimately connected with the history of Judah in the last years of that kingdom. His long reign came to an end in 562.<P>While the conflict, which brought Assyria to its end, and the attendant confusion, were absorbing the attention of Mesopotamian countries, Egypt under a new and virile dynasty was reviving her ambitions and intrigues for dominion in Asia. Pharaoh-necoh II taking advantage of the confusion and helplessness of Assyria invaded Palestine in 609, intending to march on through Palestine to attack Mesopotamia. King Josiah in loyalty to his Assyrian overlord opposed him, but was defeated and slain at the battle of Megiddo, after a reign of 31 years; apparently an unnecessary and foolish opposition on Josiah\'s part, as the plan of Necoh\'s march shows that Judah was not directly affected. After the victory at Megiddo, Necoh continued his march north-eastward, subduing Syria and hoping to have a hand in Mesopotamian affairs. But in 606 or 607 BC he was defeated at Carchemish and driven back to Egypt by Nebuchadnezzar, fresh from victory over Nineveh. In the same year Nebuchadnezzar marched against Egypt, receiving the submission of Jerusalem as he passed through Palestine, and sending noble hostages back to Babylon, among whom were Daniel and his three friends. The death of his father and his endangered succession recalled Nebuchadnezzar suddenly to Babylon, where he became sole ruler in 604. It appears that Necoh must have returned to Egypt after Megiddo and before the battle of Carchemish, as he made Jehoiakim, king in place of Jehoahaz, whom he carried captive to Egypt. Nebuchadnezzar\'s victory at Carchemish and his march southward brought Judah in close relations with Babylon, and opened up the dramatic chapter of Jerusalem\'s fall and exile. These historic events fix the dates of the last kings and the closing incidents of the kingdom of Judah, as shown in the following table:<P>V. Assyrian Period and Judah after Fall of Samaria.<P>This section, which may for convenience be treated as a division, is the chronology of Judah under Assyria after the fall of the Northern Kingdom in 721. As the Scripture time-references are frequent and explicit, and the contemporaneous Assyrian records are full, and explicit also, the problems of this period are neither many nor insoluble. One difficulty is found in the fact that the aggregate years of the reigns of Hezekiah, Manasseh, Amon and Josiah fall one or two years short of the period between Hezekiah\'s accession in 726 and Josiah\'s death in 609. But there is evidence of anarchical conditions at the close of Amon\'s reign (<a onClick="return mV(\'2Ki\',21,23,24);">2Ki 21:23-24</a>), and it is probable that at least a year should be counted for the interregnum. The chief difficulty is with the invasions of Sennacherib in Hezekiah\'s reign. The confusion is caused by the apparent dating of Sennacherib\'s famous and disastrous invasion of 701 in the 14th year of Hezekiah\'s reign (<a onClick="return mV(\'2Ki\',18,13);">2Ki 18:13</a>). Various attempts reconciliation have been made; one attempt has been to place the beginning of Hezekiah\'s reign in 715, which is out of the question entirely, as it disregards the exact terms in which the beginning of his reign is placed before the fall of Samaria (<a onClick="return mV(\'2Ki\',18,10);">2Ki 18:10</a>). Another suggestion has been that "24th" be read instead of "14th"; but this is pure conjecture. There is a simple and satisfactory solution: in the chapters which contain the record (<a onClick="return mV(\'2Ki\',18,\'1-\');">2Ki 18</a> and <a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</a>) it is evident that two invasions are described. Frequently in the Scriptures records are topical rather than chronological, and just so in this instance the topic is Sennacherib\'s menace of Judah, and the ultimate deliverance by Yahweh. The story includes two invasions: the first in the 14th year of Hezekiah (713) when Sennacherib led the armies of his father Sargon, the end of which, so far as Jerusalem was concerned, was the payment of tribute by Hezekiah, as is accurately stated in <a onClick="return mV(\'2Ki\',18,16);">2Ki 18:16</a>. The second invasion, the description of which begins with the following verse (<a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a>), was the more serious, and is probably identified as that of 701, when Sennacherib had become king. The necessary insertion of a paragraph indicator between <a onClick="return mV(\'2Ki\',18,16);">2Ki 18:16</a> and <a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a> satisfies every demand for harmony.<P>From 609 BC, the year of Josiah\'s death, we count back 31 years to the beginning Of his reign in 639; he attained his majority in the 8th year (632; <a onClick="return mV(\'2Ch\',34,3);">2Ch 34:3</a>); the reformation in his 12th year, at the time of the Scythian irruption, would fall in 628 (<a onClick="return mV(\'2Ch\',34,3);">2Ch 34:3</a>); in the following year Jeremiah began to prophecy; and in Josiah\'s 18th year (621) the temple was cleansed and the Book of the Law found (<a onClick="return mV(\'2Ch\',34,8);">2Ch 34:8</a>). Allowing a year of confusion, Amon began his short reign in 642, and Manasseh his long reign of 55 years in 697, Hezekiah\'s reign of 29 years dating back to 726. Some fixed important dates of contemporaneous history are: death of Ashurbanipal, Assyria\'s last great king, in 626, with the consequent independence of Babylon and beginning of the 2nd Babylonian empire. Ashurbanipal\'s long reign began in 668 on the death of his father Esarhaddon; who succeeded his father Sennacherib in 681. Sargon usurped the Assyrian throne in 722, and died in 705. Shalmaneser IV, successor of Tiglath-pileser III, reigned for the brief space between 727 and 722. In Egypt the XXVth, or Ethiopian Dynasty, was in power from circa 720 to 667, two of its kings, So and Tirhakah, having mention in the Old Testament (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>; <a onClick="return mV(\'2Ki\',19,9);">19:9</a>; <a onClick="return mV(\'Isa\',37,9);">Isa 37:9</a>), and after this the XXVIth (a native) Dynasty appeared, Pharaoh-necoh being one of its kings. The dates of this period we may summarize in the following table:<P>VI. Period of Divided Kingdom.<P>The most complex, but most interesting, problems of Old Testament chronology are found in the period of the Divided Kingdom. In the literature of this period are found larger number of dates and historical references than in that of any other. We have the assistance of several important sources and factors in arranging these dates:<P>(1) The parallel records of the kingdoms of Israel and Judah serve as checks to each other, since the accession and death of the kings in each nation are fixed by reference to reigns of those of the other. Many other events are similarly related.<P>(2) The history of the two kingdoms, or parts of it, at least, is given in three parallel authorities: the Books of Kings, of Chronicles, and of the Prophets.<P>(3) The Assyrian records are fullest and are practically continuous in this period, the limu lists extending unbroken from 893 to 650 BC.<P>1. Causes of Variation in Systems:<P>But while this apparently should be the most satisfactory field for the chronologist, it has been found impossible to arrive at anything approaching certainty, and consequently there is considerable divergence among individuals and schools. One cause of variation is the difference between the Assyrian royal lists and the total of the Old Testament numbers for this period, the Old Testament aggregate being 51 years greater then the Assyrian lists. Two common methods of harmonizing this difference have bee n adopted:<P>(1) to accept the Old Testament aggregate as correct and to assume that the 51 years have been omitted from the Assyrian lists (see W. J. Beecher, Dated Events of Old Testament, 18, 19);<P>(2) to harmonize the Old Testament numbers with the Assyrian lists by taking into account the overlapping of reigns of kings who were, for brief periods, associated on the throne.<P>Instances of such overlapping are the co-regency of Uzziah and Jotham in Judah (<a onClick="return mV(\'2Ki\',15,5);">2Ki 15:5</a>), and possibly the reign of Pekah contemporaneously with Menahem and Pekahiah in Israel (<a onClick="return mV(\'2Ki\',23,\'1-\');">2Ki 23-28</a>). The latter method yields the most satisfactory results, and will be adopted in this article. The chief point of difference will be the age of Solomon and the foundation-laying of the Temple. This may be found according to the former method by adding 51 years to the dates as given below. That the method of following the aggregate of the Old Testament numbers must assume arbitrarily that there have been omissions from the Assyrian lists, and that it also must resort to some overlapping and justment of the numb ers as they are given in the text, are sufficient reasons against its adoption. And in meeting the difficulties of this period it should always be borne in mind that the Old Testament is not a book of annals merely, and that dates are given not for any special interest in them, but to correlate and emphasize events. Ordinarily dates are given with reference to local situations and contemporary persons, and not as fixed by some great epoch-marking event; e.g. Uzziah\'s reign is fixed not with reference to the Disrupti on nor the Temple building, but by relation to his Israelite contemporary, Jeroboam II.<P>2. Some Important and Pivotal Dates:<P>However, there are some fixed dates, which are so by reason of their international significance, and upon these we may rest with reasonable assurance. Such are the fall of Samaria (721 BC); the accession of Tiglath-pileser III (745); tribute paid to Shalmaneser II by Jehu in 842, and by Ahab, or one of his dynasty, in 854; and the invasion of Judah by Pharaoh-shishak in the fifth year of Rehoboam (<a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>). There are also certain coincident dates, fixed with fair accuracy, in the parallel history of the two kingdoms, which serve both as starting-points and as checks upon each other. The most prominent of these are: the beginning of Hezekiah\'s reign, 5 years before the fall of Samaria (<a onClick="return mV(\'2Ki\',18,10);">2Ki 18:10</a>); the synchronism of the reigns of Jeroboam II and Jotham (<a onClick="return mV(\'1Ch\',5,17);">1Ch 5:17</a>), Jotham\'s accession being used as a basis of calculation for the reigns of Israelite kings (<a onClick="return mV(\'2Ki\',15,30);">2Ki 15:30</a>); the coincidence of the end of the Omri Dynasty and the death of Ahaziah, king of Judah (<a onClick="return mV(\'2Ki\',9,\'1-\');">2Ki 9</a>), Jehu and Athaliah therefore beginning their reigns at the same time; and, primarily, the division of the kingdom and the synchronous beginning of the reigns of Jeroboam I and Rehoboam. Using these fixed dates and coincidences, we must find the summaries of the reigns of Israelite and Jewish kings between 721, the 9th year of Hoshea and the 6th of Hezekiah, and 843, the beginning of the reigns of Jehu add Athaliah, to be 122 years each; and likewise the summaries from 843 back to the Disruption to be the same.<P>3. Difficulties to Be Removed:<P>The most serious difficulties are found near the end of the period, when conditions in the Northern Kingdom were becoming anarchical, and, also evident co-regencies, the extent of which is not evident, occurred in the Southern Kingdom. Pekah is said to have reigned 20 years (<a onClick="return mV(\'2Ki\',15,27);">2Ki 15:27</a>); and yet Menahem paid tribute to Assyria in 738, and he was succeeded for two years by his son Pekahiah, from whom Pekah seized the kingdom. This would allow Pekah only 6 years of sovereignty. The explanation lies in the context: in the confusion which followed the death of Jeroboam, Pekah established his authority over the section east of the Jordan, and to that year the numbers in <a onClick="return mV(\'2Ki\',15,27,32);">2Ki 15:27, 32</a>; <a onClick="return mV(\'2Ki\',16,1);">2Ki 16:1</a> refer. Uzziah was leprous the last 16 years of his life, and Jotham his son was over the kingdom (<a onClick="return mV(\'2Ki\',15,5);">2Ki 15:5</a>). The length of Jotham\'s reign was just 16 years, not additional to the 16 of the co-regency, as this would result in the absurdity of making him co-regent at the age of 9 years (<a onClick="return mV(\'2Ki\',15,33);">2Ki 15:33</a>). Therefore nearly his whole reign is included in the 52 years of his father. For some reason Ahaz was associated with his father Jotham before the death of the latter, since the 16 years of his reign plus the 5 of Hezekiah before the fall of Samaria bring his accession before the death of Uzziah and Jotham, i.e. in 741. So that for approximately 6 years the three reigns were contemporaneous. That these 6 years may not be accounted for by a co-regency with Hezekiah at the other end of Ahaz\' reign is evident from the age of Hezekiah at his accession (<a onClick="return mV(\'2Ki\',18,2);">2Ki 18:2</a>), and from the radical difference in the policy of the two kings. <a onClick="return mV(\'2Ki\',7,1);">2Ki 7:1</a> may suggest that Uzziah and Jotham died about the same time, and that Ahaz was regarded as succeeding both directly.<P>Another difficulty is found at the beginning of Uzziah\'s reign, where he is said to have succeeded his father Amaziah at the age of 16, but is also said to have accomplished certain notable things after his father\'s death (<a onClick="return mV(\'2Ki\',14,21,22);">2Ki 14:21-22</a>). Evidently, then, he became king before the death of Amaziah. When did this co-regency begin? No better time is suggested than Amaziah\'s ignominious defeat by Jehoash of Israel in the 15th year of his reign, after which the people arose and put Uzziah in his place, Amaziah living on for 15 years (<a onClick="return mV(\'2Ki\',14,17);">2Ki 14:17</a>), so that 15 of Amaziah\'s 29 years were contemporaneous with Uzziah. Further, in the last years of Joash of Judah there may have been a co-regency, since he was "very sick" in those years (<a onClick="return mV(\'2Ch\',24,25);">2Ch 24:25</a>). Thus the totals of 146 years for the reigns of the kings of Israel and of 165 for the reigns of the kings of Judah between 721 and 842 are reduced to the actual 121 by the overlappings, which are suggested in the narrative itself.<P>4. Overlappings:<P>For the first division of this period, from the rise of Jehu, circa 843, to the division of the kingdom, the totals of the reigns of the kings of Israel is 98 years, and of the kings of Judah is 95. But there must be some overlappings. The interval between Ahab and Jehu, as shown by mention of them in the Assyrian records, <span class="noTag">is</span> 12 years; but the two sons of Ahab reigned 14 years, Ahaziah 2 and Jehoram 12. Evidently the last year of Ahab, in which came the defeat at Karkar, was the 1st of Ahaziah, and the 2nd of Ahaziah, who suffered in that year serious accident (<a onClick="return mV(\'2Ki\',1,2);">2Ki 1:2</a>), was the first of Jehoram. It is probable that the long reign of Asa closed with Jehoshaphat as co-regent (<a onClick="return mV(\'1Ki\',15,23);">1Ki 15:23</a>), so the above totals of both kingdoms must be reduced to some extent, probably to 90 years, and the disruption of the kingdom placed about 933 BC. Shishak, founder of the XXIId Dynasty, invaded Palestine in the 5th year of Rehoboam (<a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>), and in, or shortly before, the 21st year of his own reign, so that he must have bec ome sovereign of Egypt about 950 BC. Jeroboam fled to Egypt after Solomon had reigned more than 20 years, as is shown by the connection of Jeroboam with the building of Millo; and so Jeroboam\'s flight must have been about the beginning of Shishak\'s reign. This is in accord with the Old Testament records, since the hostile Shishak Dynasty must have arisen in the reign of Solomon, the dynasty which was ruling at the beginning of his reign having been in alliance with him. So we place the accession of Shishak about 950, his invasion of Judah in 929, and the Disruption in 933 BC.<P>An interesting instance of co-regency in this period is that of Jehoshaphat and Jehoram, for while Ahaziah of Israel began to reign in the 17th year of Jehoshaphat (<a onClick="return mV(\'1Ki\',22,51);">1Ki 22:51</a>) and died in the 2nd year of Jehoram (<a onClick="return mV(\'2Ki\',1,17);">2Ki 1:17</a>), the year of his death was also the 18th of Jehoshaphat, so that the father and son reigned together about 5 years. It is evident also that Jehoshaphat ruled before his father\'s death, as the total of his reign is counted from the co-regency\'s beginning (<a onClick="return mV(\'1Ki\',22,41);">1Ki 22:41</a>), but certain events are dated from his sole reign on the death of Asa (<a onClick="return mV(\'1Ki\',22,51);">1Ki 22:51</a>; <a onClick="return mV(\'2Ki\',3,1);">2Ki 3:1</a>). It is probable that the 6 years of Athaliah were included in the 40 years of the reign of Joash, the legitimate king. The age of his son, Amaziah, at his accession (<a onClick="return mV(\'2Ch\',25,1);">2Ch 25:1</a>) does not operate against this probability, since the precocious Jewish sovereigns attained their majority at 15 years of age (compare <a onClick="return mV(\'2Ch\',34,3);">2Ch 34:3</a>). The co-regency for 2 years of Joash and Amaziah (<a onClick="return mV(\'2Ch\',24,25);">2Ch 24:25</a>) brings the aggregate years of the reigns of the kings of both kingdoms down to the accession of Jeroboam II, three years before Uzziah\'s accession, into exact accord. Finally, the difference of three years in the totals of reigns in the two kingdoms from Jehu\' to the Disruption is explained by the fact that in Israel the first year of a king was coincident with the last of his predecessor, whereas in Judah, certainly at the beginning of this period, the first year of a king followed the death of his predecessor; e.g. while Asa began to reign in the 20th year of Jeroboam (<a onClick="return mV(\'1Ki\',15,9);">1Ki 15:9</a>), Jeroboam, who reigned 22 years, died three years later in the second year of Asa (<a onClick="return mV(\'1Ki\',15,25);">1Ki 15:25</a>). Observation of this principle in the accessions of the first three kings after Jeroboam removes the difference, the long numbers of the reign of Asa being found to corroborate. The preceding table will illustrate these facts of the records, as harmonizing the dates of the two contemporaneous kingdoms.<P>VII. From the Disruption to the Exodus.<P>The period now to be considered extends from the disruption of the kingdom back to the Exodus. The reasons for combining the Biblical events within these widely separated dates into one period of such length are evident, namely,<P>(1) the regular sequence of the history;<P>(2) the occurrence of comprehensive numbers for the period as a whole, e.g. <a onClick="return mV(\'Jdg\',11,26);">Jud 11:26</a> and <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>; the chronological data of the Book of Judges, which lead directly up to the developments in the time of the united kingdom, e.g. the narrative of Ruth preparing the way for the reign of David. Characteristic of this period is the frequent occurrence of the general numbers 80, 40 and 20, which are not necessarily to be taken always as exact, but possibly at times indicating a round, or generation, number.<P>In order to get the time limits of this period, it is necessary to count back 37 years from the end of Solomon\'s reign in 933 BC, and this brings us to that epoch-marking event, the laying of the foundations of the Temple in 969 or 970, the 4th year of his reign (<a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>); and from this event we are brought by the addition of the comprehensive number 479, given in the same verse, back to the year of the Exodus, approximately 1448 BC, making the total length of the period about 516 years.<P>Indications of Overlapping:<P>But the addition of the numbers given for the various reigns and administrations of the period yields a total which is much greater than 516, and therefore one must seek in the text indications of overlapping, which will bring the narrative into harmony with itself. The reigns of Solomon (<a onClick="return mV(\'1Ki\',11,42);">1Ki 11:42</a>), David (<a onClick="return mV(\'1Ki\',2,11);">1Ki 2:11</a>) and Saul (<a onClick="return mV(\'Act\',13,21);">Ac 13:21</a>), are given as 40 years each; and here there may be some overlapping, Solomon, e.g. becoming king before David\'s death (<a onClick="return mV(\'1Ki\',1,\'43-48\');">1Ki 1:43-48</a>). We are rather surprised to find that there is no statement of the length of Samuel\'s ministry, such as its important place in the national life would lead us to expect. The probable reason for this is that his life was paralleled largely by the reign of Saul and the administration of Eli. A period of 40 years is assigned to Eli (<a onClick="return mV(\'1Sa\',4,18);">1Sa 4:18</a>); the aggregate of numbers given for the Judges is 410 years; Joshua ruled for 40 years (<a onClick="return mV(\'Jdg\',2,8);">Jud 2:8</a>); and finally the wilderness wanderings covered another 40-year period. The sum total of all these numbers is 670—far beyond the comprehensive reckonings of <a onClick="return mV(\'Jdg\',11,26);">Jud 11:26</a>; <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>, and <a onClick="return mV(\'Act\',13,19);">Ac 13:19</a>. It is evident from <a onClick="return mV(\'Jdg\',10,7,8);">Jud 10:7-8</a>; <a onClick="return mV(\'Jdg\',13,1);">13:1</a> that the periods of Ammonite and Philistine oppression were either contemporaneous or very near together, and therefore that the comprehensive number, 300 years, of <a onClick="return mV(\'Jdg\',11,26);">Jud 11:26</a>, reaches from the entrance into Canaan under Joshua down to the age of Samson, as well as of Jephthah. The administrations of Ibzan, Elon and Abdon (<a onClick="return mV(\'Jdg\',12,\'8-13\');">Jud 12:8-13</a>) should then be regarded as practically synchronous with Jephthah and Samson, and the number of their years should, in part at least, be left out of account. The numbers from Samson and Eli to Solomon are approximately fixed, 20 to Samson, 40 to Eli, 40 to Saul and 40 to David; and their total accords with the 300 before Jephthah, and the 40 of wilderness wanderings in making up the grand total (<a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>) from Solomon to the Exodus. This proportion before and after Jephthah, or Samson, and the Philistine oppression, approximately 330 and 150 years, is in agreement with the genealogies of <a onClick="return mV(\'Rth\',4,\'18-22\');">Ru 4:18-22</a>; <a onClick="return mV(\'1Sa\',14,3);">1Sa 14:3</a>; <a onClick="return mV(\'1Sa\',22,9);">22:9</a>; <a onClick="return mV(\'1Ch\',2,\'1-\');">1Ch 2</a>; <a onClick="return mV(\'1Ch\',6,\'1-\');">6</a>; <a onClick="return mV(\'1Ch\',24,\'1-\');">24</a>. The shortening therefore of the excessive aggregate of 670 years must be sought in the records from Samson back to Joshua. Assuming that the oppressions may be synchronous with the administrations of preceding or succeeding judges, that Abimelech\'s abortive attempt to become king (<a onClick="return mV(\'Jdg\',9,\'1-\');">Jud 9</a>) should be included in Gideon\'s 40 years, and that parallelings are possible in the three judges just after Jephthah (<a onClick="return mV(\'Jdg\',12,\'8-13\');">Jud 12:8-13</a>) and the two just before (<a onClick="return mV(\'Jdg\',10,\'1-5\');">Jud 10:1-5</a>), it is possible to bring the detailed time-references of the Book of Judges into satisfactory agreement with the comprehensive numbers. That the period of the Judges is shorter than the aggregate of the numbers assigned to each is further indicated by the manner in which the brief narratives at the end of the book—the migration of the Danites, the sin and punishment of Benjamin—and the Book of Ruth, bring the earlier generations into close touch with the later; compare the genealogy of David (<a onClick="return mV(\'Rth\',4,\'18-22\');">Ru 4:18-22</a>).<P>The preceding table (p. 641) shows the dates of events according to the longer reckoning, and also according to the suggested shortening by taking into account the possible synchronisms. It should be remembered that these figures are not indisputable, but merely tentative and suggestive.<P>VIII. From the Exodus to Birth of Abraham.<P>The period of Old Testament chronology now to receive our attention is that which extends from the Exodus in circa 1448 BC back to the call and migration of Abraham. This may be called the period of the patriarchal wanderings, the formative or infancy period of the nation, and therefore of the highest interest historically and religiously. But it is not possible to fix its dates with indisputable accuracy, since, with rare exceptions, the events of the Old Testament record are not related in their narration to eras or definite persons of the contemporary nations; and since also the chronology of these nations is much in dispute among historians and archaeologists, with variations of hundreds of years.<P>Main Points at Issue:<P>The chief points at issue here for determination of the chronological problems are the time of the Exodus, the duration of Israel\'s sojourn in Egypt and the date of Hammurabi. Considering these in their order:<P>(1) As to the Exodus, opinions have been divided among the XVIIIth, XIXth and XXth dynasties as the time of the Oppression and Exodus of Israel, and there are plausible arguments for, and serious objections to, each of these periods. When all things have been considered it seems best to fix upon the XVIIIth Dynasty as the age of the Oppression and Exodus, Thothmes III as the Pharaoh of the Oppression, and the years immediately following his death as the time of the Exodus, for the following reasons:<P>(a) This is in harmony with the time-reckoning from the Temple of Solomon back to the Exodus (<a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1</a>), and fully satisfies the Biblical numbers for the intervening period, as shown above; while either later dynastic period would necessitate either unnatural cramping or ruthless rejection of the Biblical numbers. To place the Exodus so late as Ramses III, after 1200 BC, is in the light of the Biblical reckoning an evident absurdity.<P>(b) In the XVIIIth Dynasty we can look best for the Pharaoh "that knew not Joseph," as it was the leader of this dynasty, Ahmes I, who conquered and drove out the Hyksos, and left to his followers as a legacy cordial hatred of the Asiatics.<P>(c) Thothmes III was a great builder, and the heavy tasks of the Hebrews would fit well into his reign. He was also the champion of Amon, the god of Thebes, having been a priest of that god; therefore the religious significance of the Exodus and the struggle preceding it were most natural in his age.<P>(d) An inscription of Menephthah, son of Ramses II, indicates that Israel was in Palestine in his time, therefore he could not have been the Pharaoh of the Exodus, nor his father the oppressor.<P>(e) The objection that Pharaohs of the XIXth and XXth dynasties invaded and claimed sovereignty over Palestine is of little consequence, since these invasions usually involved only the sea-plain, and any city or district might secure immunity and maintain its status quo by payment of tribute. In later centuries many foreign invasions swept through Israel without disturbing the national integrity. As for the objection that the cities Ramses and Pithom indicate the age of Ramses II, it is altogether probable that they were built long before his time, and only restored by him. For these reasons the earlier date is assigned to the Exodus.<P>(2) Whether the duration of the sojourn in Egypt was 430 or 215 years will depend upon the interpretation of the comprehensive 430, or roundly 400, which is of frequent occurrence in the Bible as indicating the extent of the period of the Hebrews\' wanderings among, and oppression by, the nations (<a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a>; <a onClick="return mV(\'Exd\',12,40);">Ex 12:40</a>; <a onClick="return mV(\'Act\',7,6);">Ac 7:6</a>; <a onClick="return mV(\'Gal\',3,17);">Ga 3:17</a>). These passages have been, an
