 the idea of the necessity of a satisfaction for human sin: Abelard, on the other hand, denied the need of satisfaction, and became the representative of what are known as moral theories of the atonement. It was reserved for the Protestant Reformers, however, to bring this doctrine to its true bearing, as furnishing the ground for man\'s free justification before God in his union with Christ, who had made full satisfaction for his guilt. There have been many theories of atonement, but the idea that Christ has "satisfied Divine justice" is too firmly imbedded in all the Reformation creeds, and has too profound a Scriptural support, to be removed.<P>(g) The Reformation:<P>The 16th century Reformation, on its outward side, was a revolt against the errors and corruptions of the papacy, but in its positive aspect it may be described as the reassertion of the sole mediatorship of Christ (as against priestly intervention), the sole authority of Scripture (as against tradition), and justification by faith alone (as against salvation by works of merit). The schism meant a separation of the great Protestant communities and nations from the church of Rome, which, by its claim of papal supremacy, had already separated from itself the great Greek communion.<P>(h) Lutheran and Reformed:<P>Within Protestantism itself a difference of genius between the Swiss and German Reformers, with divergences of view on the sacraments, led to the formation of two main types—the Lutheran (German) and the Reformed (Swiss)—and between these two, as respects theology and church order, later Protestantism has mostly been divided. Luther represented the one; Calvin for long was the chief name in the other. With the rise of Arminianism and other forms of dissent from the peculiarities of Calvinism, the aspect of Protestantism became more variegated. Of the later divisions, producing the numerous modern sects which yet own allegiance to the common head (Presbyterians, Episcopalians, Methodists, Baptists, Congregationalists, etc.), it is not necessary here to speak. The unity of spirit revealed in creed, worship and combined endeavors in Christ\'s service goes deeper than all outward differences.<P>(3) Its Influence.<P>Christianity preaches a kingdom of God, or supremacy of God\'s will in human hearts and human affairs, by which is meant, on its earthly side, nothing less than a complete reconstruction of society on the two great bases of love to God and love to man—"Thy will be done, as in heaven, so on earth" (<a onClick="return mV(\'Mat\',6,10);">Mt 6:10</a>). The influence of Christianity is paramount in all the great advances that have been made in the moral and social amelioration of the state of mankind.<P>(a) The Ancient World:<P>It was so undoubtedly in the ancient world. The world into which Christianity came was one fast sinking into dissolution through the weight of its own corruptions. Into that world Christianity brought a totally new idea of man as being of infinite dignity and immortal worth. It restored the well-nigh lost sense of responsibility and accountability to God; breathed into the world a new spirit of love and charity, and created that wealth of charitable and beneficent institutions with which Christian lands are now full (Lecky speaks of it as "covering the globe with countless institutions of mercy, absolutely unknown in the whole pagan world," History of Morals, II, 91); set up a new moral ideal and standard of integrity which has acted as an elevating force on moral conceptions till the present hour; restored woman to her rightful place as man\'s helpmeet and equal; created the Christian home; gave the slave an equal place with his master in the kingdom of God, and struck at the foundations of slavery by its doctrines of the natural brotherhood and dignity of man; created self-respect, and a sense of duty in the use of one\'s powers for self-support and the benefit of others; urged to honest labors; and in a myriad other ways, by direct teaching, by the protest of holy lives, and by its general spirit, struck at the evils, the malpractices, the cruelties of the time.<P>(b) The Modern World:<P>Despite many failures, and gross backslidings in the church itself, these ideas, implanted in the world, and liberating other forces, have operated ever since in advancing the progress of the race. They exist and operate far beyond the limits of the church. They have been taken up and contended for by men outside the church—by unbelievers even—when the church itself had become unfaithful to them. None the less they are of Christian parentage. They lie at the basis of our modern assertion of equal rights, of justice to the individual in social and state arrangements, of the desire for brotherhood, peace and amity among classes and nations. It is Christian love which is sustaining the best, purest and most self-sacrificing efforts for the raising of the fallen, the rescue of the drunkard, the promotion of enlightenment, virtues, social order and happiness. It is proving itself the grand civilizing agency in other regions of the world. Christian missions, with their benign effects in the spread of education, the checking of social evils and barbarities, the creation of trade and industry, the change in the status of women, the advance in social and civilized life, generally, is the demonstration of it (see Dennis, Christian Missions and Social Progress).<P>(c) Testimony of Professor Huxley:<P>Professor Huxley will not be regarded as a biased witness on behalf of Christianity. Yet this is what he writes on the influence of the Christian Scriptures, and his words may be a fitting close to this article: "Throughout the history of the western world," he says, "the Scriptures, Jewish, and Christian, have been the great instigators of revolt against the worst forms of clerical and political despotism. The Bible has been the Magna Charta of the poor, and of the oppressed; down to modern times no state has had a constitution in which the interests of the people are so largely taken into account, in which the duties, so much more than the privileges, of rulers are insisted upon, as that drawn up for Israel in Deuteronomy and Leviticus; nowhere is the fundamental truth that the welfare of the State, in the long run, depends upon the uprightness of the citizen so strongly laid down. Assuredly the Bible talks no trash about the rights of man; but it insists upon the equality of duties, on the liberty to bring about that righteousness which is somewhat different from struggling for \'rights\'; on the fraternity of taking thought for one\'s neighbor as for one\'s self."<P>LITERATURE.<P>See works cited in Part I above; also Kuenen, Hibbert Lectures for 1882, National Religions and Universal Religions; W. M. Ramsay, The Church in the Roman Empire; M. Dods, Mohammed, Buddha, and Christ; on early expansion of Christianity, Harnack, Mission and Expansion of Christianity, and Orr, Neglected Factors in the Study of the Early Progress of Christianity; on the essence of Christianity, W. Douglas Mackenzie, The Final Faith; on the influence of Christianity, C. L. Brace, Gesta Christi; Uhlhorn, Christian Charity in the Ancient Church; C. Schmidt, Social Results of Early Christianity; Lecky, History of European Morals; Dennis, Christian Missions and Social Progress; Reports of World Miss. Conference, 1910.``132';

isbe[2094]='Christs, False`fols (pseudo-christoi).<P>1. Christ\'s Warnings:<P>In His discourse on the last things, uttered by Him on the Tuesday of the week of His Passion, Jesus solemnly forewarned His disciples that many would come in His name, saying "I am the Christ," who would deceive many; that there would arise false Christs and false prophets, who would show great signs and wonders, so as to lead astray, if possible, even the elect; that, therefore, if any man said to them, "Lo, here is the Christ," or "Lo, there," they were not to believe it (<a onClick="return mV(\'Mat\',24,5,11,23,24,25);">Mt 24:5, 11, 23-25</a>; <a onClick="return mV(\'Mar\',13,6,21,22,23);">Mr 13:6, 21-23</a>; <a onClick="return mV(\'Luk\',21,8);">Lu 21:8</a>).<P>2. Early Notices:<P>The warning was needed. De Wette, Meyer, and others have, indeed, pointed out that there is no historical record of anyone expressly claiming to be the Christ prior to the destruction of Jerusalem. This, however, is probably only in appearance (compare Lange, Commentary on <a onClick="return mV(\'Mat\',24,3);">Mt 24:3</a>). Edersheim remarks: "Though in the multitude of impostors, who, in the troubled time between the rule of Pilate and the destruction of Jerusalem, promised Messianic deliverance to Israel, few names and claims of this kind have been specially recorded, yet the hints in the New Testament, and the references, however guarded, in the Jewish historian, imply the appearance of many such seducers" (Jesus the Messiah, V, chapter vi; in 1906 edition, II, 446). The revolts in this period were generally connected with religious pretensions in the leaders (Josephus, BJ, II, xiii, 4—"deceived and deluded the people under pretense of Divine inspiration"), and, in the fevered state of Messianic expectation, can hardly have lacked, in some instances, a Messianic character. Judas of Galilee (<a onClick="return mV(\'Act\',5,37);">Ac 5:37</a>; Josephus, Ant, XVIII, i, 1, 6; BJ, II, viii, 1) founded a numerous sect (the Gaulonites) by many of whom, according to Origen (Hom on Luke, 25), he was regarded as the Messiah (compare DB, under the word). The Theudas of <a onClick="return mV(\'Act\',5,36);">Ac 5:36</a>, "giving himself out to be somebody," may or may not be the same as the Theudas of Josephus (Ant., XX, v, 1), but the latter, at least, made prophetic claims and deluded many. He promised to divide the river Jordan by a word. Another instance is the "Egyptian" for whom Paul was mistaken, who had made an "uproar" (<a onClick="return mV(\'Act\',21,38);">Ac 21:38</a>; the Revised Version (British and American) "sedition")—one of a multitude of "impostors and deceivers," Josephus tells us, who persuaded multitudes to follow them into the wilderness, pretending that they would exhibit wonders and signs (Ant., XX, viii, 6). This Egyptian was to show them that, at his command, the walls of Jerusalem would fall down (BJ, II, xiii, 5). Of another class was the Samaritan Dositheus, with whom Simon Magus was said to be connected (see refs to Eusebius, Origen, Hippolytus, Clementine writings, etc., in DB, under the word). He is alleged to have been regarded as "the prophet like unto Moses," whom God was to raise up.<P>3. Bar-Cochba:<P>The most celebrated case of a false Christ is that of Bar-Cochba (to give the name its usual form), the leader of the great insurrection under Hadrian in 132 AD (Eus., HE, IV, 6; for Jewish and other authorities, see the full account in Schurer, HJP, I, 2, pp. 297ff, English Translation). The insurrection was on a scale which it required the whole force of the Roman empire to put down (compare Schurer). The leader\'s own name was Simon, but the title, "Bar-Cochba" ("son of a star"), was given him with reference to the pr ophecy in <a onClick="return mV(\'Num\',24,17);">Nu 24:17</a> of the star that should come out of Jacob. Rabbi Akiba, the most celebrated doctor of his time, applied this prophecy, with that in <a onClick="return mV(\'Hag\',2,6,7);">Hag 2:6-7</a>, to Simon, and announced him as the Messiah. He is commonly known in Jewish literature as Barcosiba, probably from his birthplace. Immense multitudes flocked to his standard, and the Christians in Palestine were severely persecuted. Coins were issued in his name. After tremendous efforts the rebellion was crushed, and Jerusalem was converted into a Roman colony (Aelia Capitolina), which Jews were forbidden to enter.<P>4. Jewish Pseudo-Messiahs:<P>Among the Jews themselves, in later times, many pseudo-Messiahs have arisen. An interesting account of some of these is given by Mr. Elkan Adler in his Introduction to the volume, Aspects of the Hebrew Genius (London, Routledge, 1910). "Such there had been," this writer says, "from time to time ever since the destruction of the Temple." In the 16th and 17th centuries, however, the belief in pseudo-Messiahs took new and remarkable shapes. Among the names mentioned is that of David Reubeni, or David of the tribe of Reuben (1524), who ultimately fell a sacrifice to the Inquisition. Under his influence a Portuguese royal secretary, Diego Pires, adopted the Jewish faith, changed his name to Solomon Molko, and finally proclaimed himself the Messiah. In 1529 he published some of his addresses under the title of The Book of Wonder. He was burned at the stake at Mantua. "Other Kabbalists, such as Isaac Luria and Chajim Vital and Abraham Shalom, proclaimed themselves to be Messiahs or forerunners of the Messiah, and their works and manuscripts are still piously studied by many oriental Jews." The chief of all these false Messiahs was Sabbatai Zevi, born at Smyrna in 1626. "His adventures," it is said, "created a tremendous stir in western Europe." He ultimately became an apostate to Islam; notwithstanding which fact he had a line of successors, in whom the sect of Donmeh, in Salonica, continue to believe. Another mentioned is Jacob Frank, of Podolia, who revealed himself in 1755 as the Holy Lord, in whom there dwelt the same Messiah-soul that had dwelt in David, Elijah, Jesus, Mohammed, Sabbatai Zevi, and his followers. Jewish literature in the 18th century is full of controversial writing connected with Sabbatianism. As a special source of information on modern false Messiahs among the Jews, Lange mentions the serial Dibhre \'emeth, or Words of Truth (Breslau, 1853-54).``132';
isbe[2095]='Chronicles, Books of`kron\'-i-k\'-ls (dibhere ha-yamim), "The Words of the Days"; Septuagint paraleipomenon:<P>1. The Name<P>2. The Position of Chronicles in the Old Testament<P>3. Two Books, or One?<P>4. The Contents<P>5. Sources Biblical and Extra-Biblical<P>6. Nehemiah\'s Library<P>7. The Way of Using the Biblical Sources<P>8. Additions by the Chronicler<P>9. Omissions by the Chronicler<P>10. The Extra-Biblical Sources<P>11. The Object in Writing the Books of Chronicles<P>12. The Text<P>13. Critical Estimates<P>14. Date and Authorship<P>15. Evidence as to Date and Authorship<P class="in15">Arguments for a Later Date<P>16. Truthfulness and Historicity<P class="in15">(1) Alleged Proofs of Untruthfulness<P class="in15">(2) Truthfulness in the Various Parts<P>17. The Values of the Chronicles<P>LITERATURE<hr /><P>1. The Name:<P>The analogy of this title to such English words as diary, journal, chronicle, is obvious. The title is one which frequently appears in the Hebrew of the Old Testament. It is used to denote the records of the Medo-Persian monarchy (<a onClick="return mV(\'Est\',2,23);">Es 2:23</a>; <a onClick="return mV(\'Est\',6,1);">6:1</a>; <a onClick="return mV(\'Est\',10,2);">10:2</a>), and to denote public records, either Persian or Jewish, made in late postexilian times (<a onClick="return mV(\'Neh\',12,23);">Ne 12:23</a>), and to denote public records of King David (<a onClick="return mV(\'1Ch\',27,24);">1Ch 27:24</a>). But its most common use is to denote the Judahite and Israelite records referred to in the Books of Kings as sources (<a onClick="return mV(\'1Ki\',14,19);">1Ki 14:19</a>; <a onClick="return mV(\'1Ki\',15,7);">15:7</a> and about 30 other places). The references in Kings are not to our present Books of Chronicles, for a large proportion of them are to matters not mentioned in these. Either directly or indirectly they refer the reader to public archives.<P>As applied to our present Books of Chronicles this title was certainly not intended to indicate that they are strictly copies of public documents, though it may indicate that they have a certain official character distinguishing them from other contemporary or future writings. The Greek title is Paraleipomenon, "Of Things that have been Left Untold." Some copies add "concerning the kings of Judah," and this is perhaps the original form of the title. That is, the Greek translators thought of Chronicles as a supplement to the other narrative Scriptural books. Jerome accepted the Greek title, but suggested that the Hebrew title would be better represented by a derivative from the Greek word chronos, and that this would fit the character of the book, which is a chronicle of the whole sacred history. Jerome\'s suggestion is followed in the title given to the book in the English and other languages.<P>2. The Position of Chronicles in the Old Testament:<P>In most of the VSS, as in the English, the Books of Chronicles are placed after the Books of Kings, as being a later account of the matters narrated in Kings; and Ezra and Nehemiah follow Chronicles as being continuations of the narrative. In the Hebrew Bibles the Books of Ezra and Nehemiah and 1 and 2 Chronicles are placed last. By common opinion, based on proof that is entirely sufficient, the three books constitute a single literary work or group of works, by one author or school of authors. It is co nvenient to use the term "the Chronicler" to designate the author, or the authors if there were more than one.<P>3. Two Books, or One?:<P>It is the regulation thing to say that 1 and 2 Chronicles were originally one book, which has been divided into two. The fact is that Chronicles is counted as one book in the count which regards the Old Testament as 22 or 24 books, and as two books in the count which regards the whole number of books as 39; and that both ways of counting have been in use as far back as the matter can be traced. Both ways of counting appear in the earliest Christian lists, those of Origen and Melito, for example. 1 Chronicles closes with a summary which may naturally be regarded as the closing of a book.<P>4. The Contents:<P>With respect to their contents the Books of Chronicles are naturally divided into three parts. The first part is preliminary, consisting mostly of genealogical matters with accompanying facts and incidents (<a onClick="return mV(\'1Ch\',1,\'1-\');">1Ch 1-9</a>). The second part is an account of the accession and reign of David (<a onClick="return mV(\'1Ch\',10,\'1-\');">1Ch 10-29</a>). The third part is an account of the events under David\'s successors in the dynasty (2 Chronicles).<P>The genealogies begin with Adam (<a onClick="return mV(\'1Ch\',1,1);">1Ch 1:1</a>) and extend to the latest Old Testament times (<a onClick="return mV(\'1Ch\',9,\'1-\');">1Ch 9</a>; compare <a onClick="return mV(\'Neh\',11,\'1-\');">Ne 11</a>, and the latest names in the genealogical lines, e. g. <a onClick="return mV(\'1Ch\',3,19);">1Ch 3:19</a>ff). The events incidentally mentioned in connection with them are more numerous and of more importance than the casual reader would imagine. They are some dozens in number. Some of them are repeated from the parts of the Old Testament from which the Chronicler draws as sources—for example, such statements as that Nimrod was a mighty one, or that in the time of Peleg the earth was divided, or the details concerning the kings of Edom (<a onClick="return mV(\'1Ch\',1,10,19,43);">1Ch 1:10, 19, 43</a>ff; compare <a onClick="return mV(\'Gen\',10,8,25);">Ge 10:8, 25</a>; <a onClick="return mV(\'Gen\',36,31);">36:31</a>ff). Others are instances which the Chronicler has taken from other sources than the Old Testament—for instance, the story of Jabez, or the accounts of the Simeonite conquests of the Meunim and of Amalek (<a onClick="return mV(\'1Ch\',4,9,10,\'38-43\');">1Ch 4:9-10, 38-43</a>).<P>The account in Chronicles of the reign of David divides itself into three parts. The first part (<a onClick="return mV(\'1Ch\',10,\'1-\');">1Ch 10-21</a>) is a series of sections giving a general view, including the death of Saul, the crowning of David over the twelve tribes, his associates, his wars, the bringing of the ark to Jerusalem, the great Davidic promise, the plague that led to the purchase of the threshing-floor of Ornan the Jebusite. The second part (<a onClick="return mV(\'1Ch\',22,\'1-\');">1Ch 22-29:22</a>) deals with one particular event and the preparations for it. The event is the making Solomon king, at a great public assembly (<a onClick="return mV(\'1Ch\',23,1);">1Ch 23:1</a>; <a onClick="return mV(\'1Ch\',28,1);">28:1</a>ff). The preparations for it include arrangements for the site and materials and labor for the temple that is to be built, and the organizing of Levites, priests, singers, doorkeepers, captains, for the service of the temple and the kingdom. The third part (<a onClick="return mV(\'1Ch\',29,\'22-30\');">1Ch 29:22-30</a>) is a brief account of Solomon\'s being made king "a second time" (compare <a onClick="return mV(\'1Ki\',1,\'1-\');">1Ki 1</a>), with a summary and references for the reign of David.<P>The history of the successors of David, as given in 2 Chronicles, need not here be commented upon.<P>5. Sources Biblical and Extra-Biblical:<P>The sources of the Books of Chronicles classify themselves as Biblical and extra-Biblical. Considerably more than half the contents come from the other Old Testament books, especially from Samuel and Kings. Other sources mentioned in the Books of Chronicles are the following:<P>(1) The Book of the Kings of Judah and Israel (<a onClick="return mV(\'2Ch\',16,11);">2Ch 16:11</a>; <a onClick="return mV(\'2Ch\',25,26);">25:26</a>; <a onClick="return mV(\'2Ch\',28,26);">28:26</a>; <a onClick="return mV(\'2Ch\',32,32);">32:32</a>).<P>(2) The Book of the Kings of Israel and Judah (<a onClick="return mV(\'2Ch\',27,7);">2Ch 27:7</a>; <a onClick="return mV(\'2Ch\',35,27);">35:27</a>; <a onClick="return mV(\'2Ch\',36,8);">36:8</a>).<P>(3) The Book of the Kings of Israel (<a onClick="return mV(\'2Ch\',20,34);">2Ch 20:34</a>).<P>(4) The Book of the Kings (<a onClick="return mV(\'2Ch\',24,27);">2Ch 24:27</a>).<P>It is possible that these may be four variant forms of the same title. It is also possible that they may be references to our present Books of Kings, though in that case we must regard the formulas of reference as conventional rather than exact.<P>(5) The Book of the Kings of Israel (<a onClick="return mV(\'1Ch\',9,1);">1Ch 9:1</a>), a genealogical work.<P>(6) The Midrash of the Book of the Kings (<a onClick="return mV(\'2Ch\',24,27);">2Ch 24:27</a>).<P>(7) The Words of the Kings of Israel (<a onClick="return mV(\'2Ch\',33,18);">2Ch 33:18</a>), referred to for details concerning Manasseh.<P>Observe that these seven are books of Kings, and that the contents of the last three do not at all correspond with those of our Biblical books. In the seventh title and in several of the titles that are yet to be mentioned it is commonly understood that "Words" is the equivalent of "acts" or "history"; but it is here preferred to retain the form "Words," as lending itself better than the others to the syntactical adjustments.<P>(8) The Words of Samuel the Man of Vision and the Words of Nathan the Prophet and the Words of Gad the Seer (<a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>) are perhaps to be counted as one work, and identified with our Books of Judges and Samuel.<P>(9) The Words of Nathan the Prophet (<a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>; compare <a onClick="return mV(\'1Ki\',11,41,42,43);">1Ki 11:41-43</a>). Source concerning Solomon.<P>(10) The Prophecy of Ahijah the Shilonite (<a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>; compare <a onClick="return mV(\'1Ki\',11,29);">1Ki 11:29</a>ff; <a onClick="return mV(\'1Ki\',14,2);">14:2</a>ff, etc.). Solomon.<P>(11) The Visions of Jedo the Seer (<a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>; compare <a onClick="return mV(\'1Ki\',13,\'1-\');">1Ki 13</a>). Solomon.<P>(12) The Words of Shemaiah the Prophet (<a onClick="return mV(\'2Ch\',12,15);">2Ch 12:15</a>; compare <a onClick="return mV(\'1Ki\',12,22);">1Ki 12:22</a>ff). Rehoboam.<P>(13) "Shemaiah wrote" (<a onClick="return mV(\'1Ch\',24,6);">1Ch 24:6</a>). David.<P>(14) Iddo the Seer in Reckoning Genealogies (<a onClick="return mV(\'2Ch\',12,15);">2Ch 12:15</a>). Rehoboam.<P>(15) "The Words (The History) of Jehu the son of Hanani, which is inserted in the Book of the Kings of Israel" (<a onClick="return mV(\'2Ch\',20,34);">2Ch 20:34</a>; compare <a onClick="return mV(\'1Ki\',16,1,7,12);">1Ki 16:1, 7, 12</a>). Jehoshaphat.<P>(16) "The rest of the acts of Uzziah, first and last, did Isaiah the Prophet, the son of Amoz, write" (<a onClick="return mV(\'2Ch\',26,22);">2Ch 26:22</a>; compare <a onClick="return mV(\'Isa\',1,1);">Isa 1:1</a>; <a onClick="return mV(\'Isa\',6,\'1-\');">6</a>).<P>(17) "The Vision of Isaiah...in the Book of the Kings of Judah and Israel" (<a onClick="return mV(\'2Ch\',32,32);">2Ch 32:32</a>; compare <a onClick="return mV(\'2Ki\',18,\'1-\');">2Ki 18-20</a>; <a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36-39</a>, etc.). Hezekiah.<P>(18) The Words of the Seers (<a onClick="return mV(\'2Ch\',33,19);">2Ch 33:19</a> margin). Manasseh.<P>(19) References to "Lamentations," and to "Jeremiah" etc. (<a onClick="return mV(\'2Ch\',35,25);">2Ch 35:25</a>). Josiah.<P>(20) The Midrash of the Prophet Iddo (<a onClick="return mV(\'2Ch\',13,22);">2Ch 13:22</a>). Abijah. These numbers, from 12 to 20, are referred to as works of prophets. At first thought there is plausibility in the idea that the references may be to the sections in Samuel and Kings where these several prophets are mentioned; but in nearly all the cases this explanation fades out on examination. The Chronicler had access to prophetic writings not now known to be in existence.<P>(21) Liturgical writings of David and Solomon (<a onClick="return mV(\'2Ch\',35,4);">2Ch 35:4</a>; compare <a onClick="return mV(\'Ezr\',3,10);">Ezr 3:10</a>). Josiah.<P>(22) Commandments of David and Gad and Nathan (<a onClick="return mV(\'2Ch\',29,25);">2Ch 29:25</a>). Hezekiah.<P>(23) The Commandment of David and Asaph and Heman and Jeduthun (<a onClick="return mV(\'2Ch\',35,15);">2Ch 35:15</a>). Josiah.<P>(24) Chronicles of King David (<a onClick="return mV(\'1Ch\',27,24);">1Ch 27:24</a>).<P>(25) Last Words of David (<a onClick="return mV(\'1Ch\',23,27);">1Ch 23:27</a>).<P>Add to these many mentions of genealogical works, connected with particular times, those for example of David, Jotham, Jeroboam II (<a onClick="return mV(\'1Ch\',9,22);">1Ch 9:22</a>; <a onClick="return mV(\'1Ch\',5,17);">5:17</a>), and mentions of matters that imply record-keeping, from Samuel and onward (e.g. <a onClick="return mV(\'1Ch\',26,\'26-28\');">1Ch 26:26-28</a>). Add also the fact that the Chronicler had a habit, exhibited in Ezra and Nehemiah, of using and quoting what he represents to be public documents, for example, letters to and from Cyrus and Artaxerxes and Darius and Artaxerxes Longimanus (<a onClick="return mV(\'Ezr\',1,1);">Ezr 1:1</a>; <a onClick="return mV(\'Ezr\',6,3);">6:3</a>; <a onClick="return mV(\'Ezr\',4,7,17);">4:7, 17</a>; <a onClick="return mV(\'Ezr\',5,6);">5:6</a>; <a onClick="return mV(\'Ezr\',6,6);">6:6</a>; <a onClick="return mV(\'Ezr\',7,11);">7:11</a>; <a onClick="return mV(\'Neh\',2,7);">Ne 2:7</a>). It is no exaggeration to say that the Chronicler claims to have had a considerable library at his command.<P>6. Nehemiah\'s Library:<P>If such a library as this existed we should perhaps expect to find some mention of it somewhere. Such a mention I think there is in the much discussed passage in 2Macc 2:13-15. It occurs in what purports to be a letter written after 164 BC by the Maccabean leaders in Jerusalem to Aristobulus in Egypt. The letter has a good deal to say concerning Nehemiah, and among other things this: "And how he, founding a library, gathered together the books about the kings and prophets, and the (books) of David, and letters of kings about sacred gifts." It says that these writings have been scattered by reason of the war, but that Judas has now gathered them again, and that they may be at the service of Aristobulus and his friends.<P>This alleged letter contains statements that seem fabulous to most modern readers, though they may not have seemed so to Judas and his compatriots. Leaving out of view, however, the intrinsic credibility of the witness, the fitting of the statement into certain other traditions and into the phenomena presented in Chronicles is a thing too remarkable to neglect. In the past, men have cited this passage as an account of the framing of a canon of Scripture—the canon of the Prophets, or of the Prophets and the Hagiographa. But it purports to be an account of a library, not of a body of Scripture; and its list of contents does not appear to be that of either the Prophets or the Hagiographa or both. But it is an exact list of the sources to which the author (or authors) of Chronicles and Ezra and Nehemiah claim to have access—"books about the kings" (see above, <a onClick="return mV(\'Num\',1,\'1-\');">Numbers 1-7</a>), "and prophets" (<a onClick="return mV(\'Num\',8,\'1-\');">Numbers 8-20</a>), "and of David" (<a onClick="return mV(\'Num\',21,\'1-\');">Numbers 21-25</a>ff), "and letters of kings about sacred gifts" (those cited in Ezra and Nehemiah). The library attributed to Nehemiah corresponds to the one which the Chronicler claims to have used; and the two independent pieces of evidence strongly confirm each the other.<P>7. The Way of Using the Biblical Sources:<P>The method in which the Biblical sources are used in Chronicles presents certain remarkable features. As a typical instance study <a onClick="return mV(\'1Ch\',10,\'1-\');">1Ch 10</a> in comparison with <a onClick="return mV(\'1Sa\',31,\'1-\');">1Sa 31</a>. <a onClick="return mV(\'1Ch\',10,\'1-12\');">1Ch 10:1-12</a> is just a transcription, with slight changes, of the passage in Samuel. A large part of Chronicles is thus made up of passages transcribed from Samuel and Kings. The alternative is that the Chronicler transcribed from sources which had earlier been transcribed in Samuel and Kings, and this alternative may in some cases be the true one.<P>This phenomenon is interesting for many reasons. It has its bearings on the trustworthiness of the information given; a copy of an ancient document is of higher character as evidence than a mere report of the contents of the document. It has a bearing on questions concerning the text; are the texts in Kings and Chronicles to be regarded as two recensions? It is especially interesting as illustrating the literary processes in use among the writers of our Scriptures.<P>It is sometimes said that they used their sources not by restating the contents as a modern compiler would do, but by just copying. It would be more correct to say that they do this part of the time. In <a onClick="return mV(\'1Ch\',10,\'1-\');">1Ch 10</a> the copying process ceases with <a onClick="return mV(\'1Ch\',10,12);">1Ch 10:12</a>. In <a onClick="return mV(\'1Ch\',10,13,14);">1Ch 10:13-14</a> the Chronicler condenses into a sentence a large part of the contents of 1 Samuel; one clause in particular is a condensation of <a onClick="return mV(\'1Sa\',28,\'1-\');">1Sa 28</a>. So it is with other parts. <a onClick="return mV(\'1Ch\',1,\'1-4\');">1Ch 1:1-4</a> is abridged from <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> at the rate of a name for a section; so is <a onClick="return mV(\'1Ch\',1,\'24-27\');">1Ch 1:24-27</a> from <a onClick="return mV(\'Gen\',11,\'10-26\');">Ge 11:10-26</a>. In the various parts of Chronicles we find all the methods that are used by any compiler; the differentiating fact is simply that the method of transcribing is more used than it would be by a modern compiler.<P>In the transcribed passages, almost without exception, there has been a systematic editorial revision. Words and clauses have been pruned out, and grammatical roughness smoothed away. Regularly the text in Chronicles is somewhat briefer, and is more fluent than in Samuel or Kings. If we give the matter careful attention we will be sure that this revisional process took place, and that it accounts for most of the textual differences between Chronicles and the earlier writings, not leaving many to be accounted for as corruptions.<P>8. Additions by the Chronicler:<P>Of course the most significant changes made by the Chronicler are those which consist in additions and omissions. It is a familiar fact that the added passages in Chronicles which bulk largest are those which deal with the temple and its Worship and its attendants—its priests, Levites, musicians, singers, doorkeepers. Witness for example the added matter in connection with the bringing of the ark to Jerusalem, the preparations for the temple, the priests\' joining Rehoboam, the war between Abijah and Jeroboam, the reforms under Asa and Jehoshaphat, details concerning Uzziah, Hezekiah\'s passover, the reform of Manasseh, the passover of Josiah (<a onClick="return mV(\'1Ch\',15,\'1-\');">1Ch 15</A>-<a onClick="return mV(\'1Ch\',16,\'1-\');">16</a>; <a onClick="return mV(\'1Ch\',22,\'1-\');">22-29</a>; <a onClick="return mV(\'2Ch\',11,\'13-17\');">2Ch 11:13-17</a>; <a onClick="return mV(\'2Ch\',13,\'1-\');">13</a>; <a onClick="return mV(\'2Ch\',14,\'1-\');">14</a>; <a onClick="return mV(\'2Ch\',15,\'1-\');">15</a>; <a onClick="return mV(\'2Ch\',17,\'1-\');">17</a>; <a onClick="return mV(\'2Ch\',19,\'1-\');">19</a>; <a onClick="return mV(\'2Ch\',20,\'1-\');">20</a>; <a onClick="return mV(\'2Ch\',26,\'16-21\');">26:16-21</a>; <a onClick="return mV(\'1Ch\',29,\'1-\');">29-31</a>; <a onClick="return mV(\'2Ch\',33,\'10-20\');">33:10-20</a>; <a onClick="return mV(\'2Ch\',35,\'1-\');">35</a>). It has been less noticed than it should be that while the Chronicler in these passages magnifies the ceremonial laws of Moses, he magnifies those of David yet more.<P>Next in bulk comes the added genealogical and statistical matter, for example, the larger part of the preliminary genealogies, details as to David\'s followers, Rehoboam\'s fortified cities and family affairs with details concerning the Shishak invasion, Asa\'s military preparations and the invasion by Zerah, with numbers and dates, Jehoshaphat\'s military arrangements, with numbers, Jehoram\'s brothers and other details concerning him, Uzziah\'s army and his business enterprises (<a onClick="return mV(\'1Ch\',2,\'1-\');">1Ch 2-9</a>; <a onClick="return mV(\'1Ch\',12,\'1-\');">12</a>; <a onClick="return mV(\'1Ch\',27,\'1-\');">27</a>; <a onClick="return mV(\'2Ch\',11,\'5-12\',\'18-23\');">2Ch 11:5-12, 18-23</a>; <a onClick="return mV(\'2Ch\',12,\'3-9\');">12:3-9</a>; <a onClick="return mV(\'2Ch\',14,\'3-15\');">14:3-15</a>; <a onClick="return mV(\'2Ch\',17,\'1-5\',\'10-19\');">17:1-5, 10-19</a>; <a onClick="return mV(\'2Ch\',26,\'6-15\');">26:6-15</a>).<P>The Chronicler is sometimes spoken of as interested in priestly affairs, and not in the prophets. That is a mistake. He takes particular pains to magnify the prophets (e.g. <a onClick="return mV(\'2Ch\',20,20);">2Ch 20:20</a>; <a onClick="return mV(\'2Ch\',36,12,16);">36:12, 16</a>). He uses the word "prophet" 30 times, and the two words for "seer" (chozeh and ro\'eh) respectively 5 and 11 times. He gives us additional information concerning many of the prophets—for example, Samuel, Gad, Nathan, Ahijah, Shemaiah, Hanani, Jehu, Elijah, Isaiah, Jeremiah. He has taken pains to preserve for us a record of many prophets concerning whom we should otherwise be ignorant—Asaph, Heman, Jeduthun, Jedo (<a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>), Iddo, the Oded of Asa\'s time, Jahaziel the son of Zechariah, Eliezer the son of Dodavah, two Zechariahs (<a onClick="return mV(\'2Ch\',24,20);">2Ch 24:20</a>; <a onClick="return mV(\'2Ch\',26,5);">26:5</a>), unnamed prophets of the time of Amaziah (<a onClick="return mV(\'2Ch\',25,\'5-10\',15,16);">2Ch 25:5-10, 15-16</a>), Oded of the time of Ahaz (<a onClick="return mV(\'2Ch\',28,9);">2Ch 28:9</a>).<P>In addition, however, to the materials that can be thus classified, it is the method of the Chronicler to preserve interesting incidents of all kinds by working them into his narrative. When he reaches Jair in his genealogical list, he finds himself in possession of a bit of information not contained in the older writings, and he inserts it (<a onClick="return mV(\'1Ch\',2,21);">1Ch 2:21</a>ff). He is interested to keep alive the memory of the "families of scribes which dwelt at Jabez" (<a onClick="return mV(\'1Ch\',2,55);">1Ch 2:55</a>). He has found items concerning craftsmen, and concerning a linen industry, and a potters\' industry, and he connects these with names in his list (<a onClick="return mV(\'1Ch\',4,14,21,23);">1Ch 4:14, 21, 23</a>). He has come across a bit of a hymn in the name of Jabez, and he attaches the hymn to his list of names as an annotation (<a onClick="return mV(\'1Ch\',4,9,10);">1Ch 4:9-10</a>). There are matters concerning the sickness and the burial of Asa, and concerning the bad conduct of Joash after the death of Jehoiada, and concerning constructions by Hezekiah (<a onClick="return mV(\'2Ch\',16,12,13);">2Ch 16:12-13</a>; <a onClick="return mV(\'2Ch\',24,\'15-27\');">24:15-27</a>; <a onClick="return mV(\'2Ch\',32,\'27-30\');">32:27-30</a>), that seem to the Chronicler worth preserving, though they are not recorded in the earlier writings. The fruits of the habit appear, in many scores of instances, in all parts of the Books of Chronicles.<P>9. Omissions by the Chronicler:<P>As the Books of Chronicles thus add matters not found in the older books, so they leave out much that is contained in the Books of Samuel and Kings. Here, however, the question should rather be as to what the Chronicler has retained from his sources than as to what he has omitted. He writes for readers whom he assumes to be familiar with the earlier books, and he retains so much of the older narrative as seems to him necessary for defining the relations of his new statements of fact to that narrative. From the point where the history of David begins he has omitted everything that is not strictly connected with David or his dynasty—the history of Northern Israel as such, the long narratives concerning the prophets, such distressing affairs as those of Amnon and Absalom and Adonijah and the faithlessness of Solomon, and a multitude of minor particulars. We have already noticed his systematic shortening of the passages which he transcribes.<P>10. The Extra-Biblical Sources:<P>There are two marked phenomena in the parts of Chronicles which were not taken from the other canonical books. They are written in later Hebrew of a pretty uniform type; many parts of them are fragmentary. The Hebrew of the parts that were copied from Samuel and Kings is of course the classical Hebrew of those books, generally made more classical by the revision to which it has been subjected. The Hebrew of the other parts is presumably that of the Chronicler himself. The difference is unmistakable. An obvious way of accounting for it is by supposing that the Chronicler treated his Scriptural sources with especial respect, and his other sources with more freedom. We will presently consider whether this is the true account.<P>There are indications that some of the non-Biblical sources were in a mutilated or otherwise fragmentary condition when the Chronicler used them. Broken sentences and passages and constructions abound. In the translations these are largely concealed, the translators having guessed the meanings into shape, but the roughnesses are palpable in the Hebrew. They appear less in the long narratives than in the genealogies and descriptive passages. They are sometimes spoken of as if they were characteristic of the later Hebrew, but there is no sense in that.<P>For example, most of the genealogies are incomplete. The priestly genealogies omit some of the names that are most distinguished in the history, such names as those of Jehoiada and two Azariahs (<a onClick="return mV(\'2Ki\',11,9);">2Ki 11:9</a>, etc.; <a onClick="return mV(\'2Ch\',26,17);">2Ch 26:17</a>; <a onClick="return mV(\'2Ch\',31,10);">31:10</a>). Many of the genealogies are given more than once, and in variant forms, but with their incompleteness still palpable. There are many breaks in the lists. We read the names of one group, and we suddenly find ourselves in the midst of names that belong to another group, and with nothing to call attention to the transition. The same phenomena appear in the sections in <a onClick="return mV(\'1Ch\',23,\'2-27\');">1Ch 23:2-27</a>. These contain a succession of matters arranged in absolutely systematic order in classes and subclasses, while many of the statements thus arranged are so fragmentary as to be hardly intelligible. The most natural explanation of these phenomena assumes that the writer had a quantity of fragments in writing—clay tablets, perhaps, or pottery or papyrus, or what not, more or less mutilated, and that he copied them as best he could, one after another. A modern writer, doing such work, would indicate the lacunae by dots or dashes or other devices. The ancient copyist simply wrote the bits of text one after another, without such indications. In regard to many of the supposable lacunae in Chronicles scholars would differ, but there are a large number in regard to which all would agree. If someone would print a text of Chronicles in which these should be indicated, he would make an important contribution to the intelligibility of the books.<P>11. The Object in Writing the Books of Chronicles:<P>On the basis of these phenomena what judgment can we form as to the purposes for which the Books of Chronicles were written? There are those who find the answer to this question a very simple one. They say that the interests of the writer were those of the temple priesthood, that it seemed to him that the older histories did not emphasize these interests as they ought, and that he therefore wrote a new history, putting into it the views and facts which he thought should be there. If this statement were modified so as not to impugn the good faith of the Chronicler, it would be nearly correct as a statement of part of his purpose. His purpose was to preserve what he regarded as historical materials that were in danger of being lost, materials concerning the temple-worship, but also concerning a large variety of other matters. He had the historian\'s instinct for laying hold of all sorts of details, and putting them into permanent form. His respiration from God (we do not here discuss the nature of that inspiration) led him this way. He wanted to save for the future that which he regarded as historical fact. The contents of the book, determined in part by his enthusiasm for the temple, were also determined in part by the nature of the materials that were providentially at his disposal. There seems also to have been present in his consciousness the idea of bringing to completion the body of sacred writings which had then been accumulating for centuries.<P>As we have seen, the Greek translators gave to the Books of Chronicles a title which expressed the idea they had of the work. They regarded it as the presentation of matters which had been omitted in the earlier Scriptures, as written not to supersede the older books, but to supplement them, as being, along with Ezra and Nehemiah, a work that brought the Scriptures up to date, and made them complete.<P>12. The Text:<P>The text of the Books of Chronicles has been less carefully preserved than that of some other parts of the Old Testament. Witness for example the numbers 42 and 8 for the ages of Ahaziah and Jehoiachin (<a onClick="return mV(\'2Ch\',22,2);">2Ch 22:2</a>; compare <a onClick="return mV(\'2Ki\',8,26);">2Ki 8:26</a>; <a onClick="return mV(\'2Ch\',36,9);">2Ch 36:9</a>; compare <a onClick="return mV(\'2Ki\',24,8);">2Ki 24:8</a>). There is no proof, however, of important textual corruption. As we have seen, the fragmentary character of certain parts is probably in the main due to exactness in following fragmentary sources, and not to bad text; and the differences between Samuel or Kings and Chronicles, in the transcribed passages, are mostly due to intended revision rather than to text variations.<P>13. Critical Estimates:<P>In critical discussions less semblance of fair play has been accorded to Chronicles than even to most of the other Scriptures. It is not unusual to assume that the Chronicler\'s reference to sources is mere make-believe, that he "has cited sources simply to produce the impression that he is writing with authority." Others hurry to the generalization that the Books of Kings mentioned in Chronicles (see <a onClick="return mV(\'Num\',1,\'1-\');">Numbers 1-7</a> above) are all one work, which must therefore have been an extensive Midrash (commentary, exe getical and anecdotal) on the canonical Books of Kings; and that the references to prophetic writings are to sections in this Midrash; so that practically the Chronicler had only two sources, the canonical books and this midrashic history of Israel; and that "it is impossible to determine" whether he gathered any bits of information from any other sources.<P>Into the critical theories concerning Chronicles enters a hypothesis of an earlier Book of Kings that was more extensive than our present canonical books. And in recent publications of such men as Buchler, Benzinger and Kittel are theories of an analysis of Chronicles into documents—for example, an earlier writing that made no distinction between priests and Levites, or an earlier writing which dealt freely with the canonical books; and the later writing of the Chronicler proper.<P>What we know in the matter is that three sets of authors combined in producing the Books of Chronicles—first, the men who produced the canonical sources, second, the men who produced the other sources, and third, the man or men who directly or indirectly put the contents of these sources together into the book which we have. We have no means of knowing what most of the intermediate processes were, and it is superlatively useless to guess. It is gratuitous to say that the mention of sources in Chronicl es is not made in good faith. It is probable that among the sources were Midrashim that were nearly contemporaneous. It is exceedingly improbable that none of the sources mentioned were genuine and ancient. All probabilities agree to the effect that the returned exiles and their near descendants were likely to study the ancient history of their race, and to gather materials for that purpose. As we have seen, the phenomena of the book indicate the presence of an antiquarian motive which was sure to be interested in genuine items of evidence from the remote past.<P>14. Date and Authorship:<P>The current opinion sixty years ago was that the Books of Chronicles and the whole Old Testament were completed about 404 BC, near the time when Artaxerxes Mnemon succeeded Darius Nothus. The statement now fashionable is that the Books of Chronicles were completed not later than about 250 BC, and this constantly degenerates into the statement that they were written about 250 BC or later. In fact, they were completed within the lifetime of Nehemiah, not later or not much later than 400 BC.<P>In discussing this we cannot ignore the fact that Chronicles and Ezra and Nehemiah are one work, or, if you prefer, one series. The closing verses of 2 Chronicles duplicate the opening verses of Ezr. This is not, probably, an inadvertent repetition. The Books of Chronicles were written later than the other parts of the series. The closing verses are the Chronicler\'s notification to his readers that he has brought up the earlier history to the point at which he had previously begun the narrative in Ezr. The testimony concerning Ezra and the "men of the Great Synagogue" and Nehemiah and their work on the Scriptures does not deserve the contempt with which some persons treat it. We know nothing concerning the Great Synagogue as an organization, but we know much concerning the succession of men, from Daniel to Simon the Just, who are called the men of the Great Synagogue. The old traditions do not say that Ezra was the founder of the succession, but they make him the typical person in it. Two bits of tradition are not necessarily inconsistent if one attributes work to Ezra which the other attributes to the men of the Great Synagogue. The regulation remark that tradition attributes Biblical work to Ezra and not to Nehemiah is untrue. Nehemiah was one of the men of the Great Synagogue, and prominent as such. He is introduced to us as a handsome boy, a king\'s favorite, coming to Jerusalem in 444 BC. In 433 BC he returned to the king. After an unknown interval of time he came back to Judea, and presumably spent the remainder of his long life there, dying some years or sortie decades after 400 BC.<P>15. Evidence as to Date and Authorship:<P>The placing of the work of the Chronicles at the close of the Hebrew Scriptures is in itself of the nature of testimony. The men who placed it there testify thereby to their belief that these are the latest writings of the Old Testament aggregate. We are familiar with the testimony of Babha\' Bathra\' to the effect that most of the later books of the Old Testament were due to the men of the Great Synagogue and to Ezra, but that Nehemiah completed the Books of Chronicles. We cannot avoid including the Chronicles among the 22 books which Josephus says were written before the death of Artaxerxes Longimanus (Apion, I, 8). Of course the limit of time here really intended by Josephus is not the death of Artaxerxes, but the lifetime of men who were contemporary with him—that of Nehemiah, for example. We have already noted the testimony concerning Nehemiah\'s library (2Macc 2:13-15). The time when the library was being gathered was the most likely time for it to be used as the Chronicler has used it. Add the recapitulation in Ecclesiasticus (44-49), which m entions Nehemiah latest in its list of Old Testament worthies.<P>Internal marks, also, justify the conclusion that the work of the Chronicler was complete before Nehemiah died. The abundant presence of Persian words and facts, with the absence of Greek words and facts, seems conclusive to the effect that the work was done before the conquests of Alexander rendered the Greek influence paramount. In some of the sections (e.g. <a onClick="return mV(\'Ezr\',7,28);">Ezr 7:28</a>ff; Nehemiah passim) Ezra and Nehemiah speak in the first person. The whole work makes the impression of being written up to date. The latest situation in Chronicles is the same with that in Nehemiah (<a onClick="return mV(\'1Ch\',9,\'1-\');">1Ch 9</a>; compare <a onClick="return mV(\'Neh\',11,\'3-\');">Ne 11:3-12:26</a>). The latest event mentioned is the differentiating of the Samaritan schism. A certain enrollment was made (<a onClick="return mV(\'Neh\',12,\'22-26\');">Ne 12:22-26</a>) in the reign of Darius, up to the high-priesthood of Johanan (elsewhere called Jonathan and John), but including Jaddua the son of Johanan in the high-priestly succession. Ezra and Nehemiah were still in office (<a onClick="return mV(\'Neh\',12,26);">Ne 12:26</a>). This enrollment naturally connects itself with the expulsion of Jaddua\'s bro ther Manasseh for marrying into the family of Sanballat (<a onClick="return mV(\'Neh\',13,28);">Ne 13:28</a>; Josephus, Ant, XI, 7-8). Jaddua belongs to the fifth generation from Jeshua, who was high priest 538 BC. Josephus says that Sanballat held a commission from Darius. He mentions a certain Bagoas, "general of another Artaxerxes\' army," as in relations with the high priest John.<P>Arguments for a Later Date.<P>Josephus, however, apparently regards the Darius who commissioned Sanballat as the last of the kings of that name, and says that Jaddua was contemporary with Alexander the Great, thus dating the Samaritan schism a little before 331 BC. All scholars reject these statements when they are used for dating the Samaritan schism, but some scholars eagerly accept them for the purpose of proving the late date of the last books of the Hebrew Bible. The argument never was valid, and it is completely exploded by the Aramaic papyri recently discovered in Egypt, which show that Bagoas and the high priest Johanan and the sons of Sanballat were contemporaries in 407 BC, the 17th year of Darius Nothus, and for some years earlier.<P>Dr. Driver (LOT, edition 1897, 518) expresses an opinion very commonly held concerning the Chronicles: "The only positive clue which the book contains as to the date at which it was composed is the genealogy in <a onClick="return mV(\'1Ch\',3,\'17-24\');">1Ch 3:17-24</a>,...carried down to the sixth generation after Zerubbabel. This would imply a date not earlier than about 350 BC." Turn to the passage and do your own arithmetic on it. Jeconiah was born 614 BC (<a onClick="return mV(\'2Ki\',24,8);">2Ki 24:8</a>). If as an average each of the sons in the succession was born when his fat her was about 25 years old, that would bring the first birth in the 6th generation from Zerubbabel to about 414 BC, and not 350 BC. This is not an improbable showing.<P>Dr. Driver suggests, however, that in <a onClick="return mV(\'1Ch\',3,21);">1Ch 3:21</a> we should follow the Greek reading instead of the Hebrew. This would give us: "And the sons of Hananiah: Pelatiah, and Jeshaiah his son, Rephaiah his son, Arnan his son, Obadiah his son, Shecaniah his son." The meaning here is ambiguous. It may be understood to be that each of the six men named after Hananiah was the son of the man named before him (compare <a onClick="return mV(\'1Ch\',3,\'10-14\');">1Ch 3:10-14</a>, or <a onClick="return mV(\'1Ch\',6,\'20-30\',\'50-53\');">1Ch 6:20-30, 50-53</a>); or as counting the six as the sons of Hananiah (compare <a onClick="return mV(\'1Ch\',3,16);">1Ch 3:16</a>; <a onClick="return mV(\'1Ch\',7,20,21);">7:20-21</a>, etc.). Understanding it in the first of these two ways the number of generations after Zerubbabel would be increased to eleven. So many generations before the early decades of the 4th century BC would be exceptional, though not impossible. But the statement that there were 11 generations is weak, being based on a conjectural interpretation of an unproved text emendation, and standing unconfirmed in opposition to credible proof.<P>16. Truthfulness and Historicity:<P>"The Books of Chronicles are a tendency writing of little historical value"; "a distorted picture in the interest of the later institutions of postexilic Judaism"; "some ancient facts, having trickled down through oral or written tradition, are doubtless preserved....They are few indeed compared with the products of the imagination, and must be sifted like kernels of wheat from a mass of chaff." These statements, taken at random from the book that happens to be handiest, fairly represent the opinion held by many. They regard the Chronicles as a fabrication made in the interest of a religious party, a fabrication in which the history has been intentionally falsified.<P>A principal motive for this opinion is to discredit the testimony of Chronicles against certain critical theories, the said testimony being more full and detailed than that in Samuel and Kings and the prophets. But on the whole question the testimony of Chronicles is to the same effect with that of the other books. The testimony of the other books supports that of the Chronicles. The discrediting of Chronicles is part of a theory which denies the historical trustworthiness of practically all parts of the Old Testament and New Testament.<P>(1) Alleged Proofs of Untruthfulness.<P>Against the Chronicles it is alleged that they sometimes contradict the older books; but nearly all the instances are capable of satisfactory solution. The large numerals in Chronicles, for example those concerning the armies of David, Abijah, Jeroboam, Asa, Zerah, Jehoshaphat, Amaziah, Uzziah, are adduced as extravagant and incredible. Most of the difficulty in connection with such numbers, whether in Chronicles or Exodus or Numbers or Judges or Samuel, disappears when we observe that they clearly belong to an artificial way of counting. These numbers are given in even thousands or even hundreds (even fifties or tens in a very few instances), which would not be the case if the hundreds and thousands were merely numerical. It is alleged that the Chronicler views the glories of the past as on a larger scale than that in which they are presented in the earlier books, but this is not uniformly the case. On the basis of these allegations the Chronicler is charged with an extravagance that is inconsistent with sober truthfulness, but this charge follows the fate of the others. It is said that the Chronicler lacked trustworthy sources, but that is a thing to be proved, not taken for granted, and we have seen that it is improbable. It is alleged that the text is in such bad shape as to render the contents unreliable. This may be balanced against the counter conjecture that, since the Books of Chronicles have not been so often copied as the Books of Kings, their text is in the transcribed passages to be preferred to that of Kings. In fine, the reasons alleged against the historicity of Chronicles dwindle on examination, though there remain some problems that cannot be so easily disposed of.<P>(2) Truthfulness in the Various Parts.<P>Different parts of the Chronicles have their own separate problems of historicity. Take the genealogies, for example. If anyone had fabricated them, he would not have put them into their present fragmentary form, in which they have no story interest, and are of no direct use to anybody. On the other hand it is reasonable to account for their present form by the hypothesis that the writer used such materials as he had. This hypothesis is not derogatory to the inspiration of the writer. Deity saw fit to have these materials placed in the Scriptures, and to this end He influenced men of different generations through providential leadings and through impulses of the Spirit. No one thinks that the Spirit-guided man who put the genealogies in their final form received them as miraculous revelations. He received them as the product of effort in study—his own efforts and those of his predecessors. He is entitled to be counted as truthful if he used good judgment and fidelity in selecting and recording his materials.<P>Similar statements would be true in regard to the other statistical matter, and in regard to the many incidents that are mentioned in connection with the genealogies and other matters. To think of them as inventions by the Chronicler is not congruous with human experience. They are too brief and broken to have interest by themselves as stories. You can assign no possible reason that one could have for inventing them. They bear the marks of being genuine antiquarian discoveries. The final writer believed that he had come across facts which would be of interest if put into connection with the history as currently narrated. These matters are much more reasonably accounted for as facts than as inventions. And furthermore, a good many of them, first and last, have been corroborated by exploration. Take, for example, Manasseh\'s being carried to Babylon by the captains of the king of Assyria, or the account of Uzziah\'s military greatness (<a onClick="return mV(\'2Ch\',33,11);">2Ch 33:11</a>; <a onClick="return mV(\'2Ch\',26,6);">26:6</a>ff), or the references to industries in <a onClick="return mV(\'1Ch\',4,\'14-23\');">1Ch 4:14-23</a> (compare PEFS, 1905, 243, 328; or Bible Sidelights from Gezer, 150ff).<P>Possibly on a different footing is such a passage as the account of Abijah and Jeroboam (<a onClick="return mV(\'2Ch\',13,\'3-18\');">2Ch 13:3-18</a>). It says that Abijah had 400,000 men and Jeroboam 800,000, of whom 500,000 were slain in the battle. One might plausibly argue that these numbers were intended as a notice to the reader that he is to understand the story, not as fact, but as a work of the imagination, a religious parable, a midrashic narrative sermon, taken from the Midrash of Iddo (verse 22). Whether or no one finds this argument convincing, anyone can see that it does not accuse the Books of Chronicles of being untruthful. If the passage is a parable it is true in the sense in which it was intended to be understood. A similar case is the account of Jehoshaphat\'s peril from the invading nations and his wonderful rescue (<a onClick="return mV(\'2Ch\',20,\'1-\');">2Ch 20</a>).<P>On still a different footing are such narratives as those concerning the bringing up of the ark, the first making of Solomon king, the reforms under Asa, Jehoshaphat, Hezekiah, Josiah. These are sober narratives, with nothing in them to suggest flights of the imagination. Probably no one doubts that the Chronicler intended them to be understood as historical fact. If one is under bondage to the modern tradition which dates Deuteronomy from the time of Josiah and the priestly laws from after the exile, he must needs count these parts of Chronicles as falsified history; but if he is free from that bondage he will see no strong reason for counting them so.<P>17. The Values of the Chronicles:<P>In fine men are correct when they say that the greatest values of the Books of Chronicles lie in their availability for vividly illustrating the great truths of religion. They are correct when they assign great value to these books as depicting the ideas of the time when they were written. But they are none the less of great value as repeating from the other Scriptures the outline of the history of the religion of Yahweh, and presenting additional material for the filling in of that outline.<P>LITERATURE.<P>Among the older commentaries on Chronicles see that of Keil in the Keil-Delitzsch series, published in English in 1872; that of Zockler in the Lange series, 1876; that of Barker in the Pulpit Commentary, after 1880. Among more recent works, from the point of view which denies the historicity of Chronicles, see R. Kittel in the Polychrome Bible, 1895, and Curtis and Masden in the International Critical Commentary, 1910. A brilliant characterization from that point of view is that by Torrey, "The Chronicler as Editor and as Independent Narrator" in AJSL, January, 1909, and subsequent numbers. On the other side see Beecher, Reasonable Biblical Criticism,1911, chapters xviii and xxii; "Is the Chronicler a Veracious Historian?" in Bible Student (October, 1899 and subsequent numbers), is a defense of the historicity. All works on Old Testament Introduction discuss the questions concerning Chronicles. In view of the many proper names in Chronicles, such a book as Gray, Studies in Hebrew Proper Names, has its uses. For the chronological facts, especially in connection with the closing of the Old Testament history, see Beecher, Dated Events of the Old Testament, 1907. For the Egyptian papyri see Drei Aramaische Papyrusurkunden aus Elephantine, Sachau, Berlin, 1907, or the Appendix to Toffteen, Historic Exodus. Also Sprengling\'s article in AJSL,  April, 1911. As to light on the Chronicles from explorations, see "The Excavations of Gezer, 1902-5, and 1907-9," PEF; or Bible Sidelights from the Mounds of Gezer, 1906. For other books see the lists in Encyclopedia Biblica and HDB.``11';
isbe[2096]='Chronology of the New Testament` <P><b>I. CHRONOLOGY OF THE LIFE OF JESUS</b><P class="in15">1. Birth of Jesus<P class="in30">(1) Death of Herod<P class="in30">(2) Census of Quirinius<P class="in30">(3) Star of the Magi<P class="in30">(4) Course of Abijah<P class="in30">(5) Day and Month<P class="in30">(6) Summary<P class="in15">2. Baptism of Jesus<P class="in15">3. First Passover<P class="in15">4. Death of John the Baptist<P class="in15">5. Length of Jesus\' Ministry<P class="in15">6. Death of Jesus<P class="in15">7. Summary of Dates<P><b>LITERATURE</b><P><b>II. CHRONOLOGY OF THE APOSTOLIC AGE</b><P class="in15">1. Paul\'s Conversion<P class="in15">2. Death of Herod Agrippa I<P class="in15">3. Famine under Claudius<P class="in15">4. Sergius Paulus<P class="in15">5. Edict of Claudius<P class="in15">6. Gallio<P class="in15">7. Festus<P class="in15">8. Relative Chronology of Acts<P class="in15">9. Pauline Epistles<P class="in15">10. Release and Death of Paul<P class="in15">11. Death of Peter<P class="in15">12. Death of James the Just<P class="in15">13. The Synoptic Gospels, etc.<P class="in15">14. Death of John<P class="in15">15. Summary of Dates<P><b>LITERATURE</b><hr /><P>The current Christian era is reckoned from the birth of Jesus and is based upon the calculations of Dionysius (6th century). Subsequent investigation has shown that the Dionysian date is at least four years too late. Several eras were in use in the time of Jesus; but of these only the Varronian will be used coordinately with the Dionysian in the discussion of the chronology of the life of Jesus, 753 A. U. C. being synchronous with 1 BC and 754 A. U. C. with 1 A. D.<P>I. Chronology of the Life of Jesus.<P>1. Birth of Jesus:<P>Jesus was born before the death of Herod the Great (<a onClick="return mV(\'Mat\',2,1);">Mt 2:1</a>ff) at the time of a census or enrollment made in the territory of Herod in accordance with a decree of Augustus when Quirinius (Revised Version; Cyrenius, the King James Version) was exercising authority in the Roman province of Syria (<a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>f). At the time of Jesus\' birth a star led the Magi of the East to seek in Jerusalem the infant whom they subsequently found in Bethlehem (<a onClick="return mV(\'Mat\',2,1);">Mt 2:1</a>ff). John the Baptist was six months older than Jesus (<a onClick="return mV(\'Luk\',1,36);">Lu 1:36</a>) and he was born in the days of Herod (<a onClick="return mV(\'Luk\',1,5);">Lu 1:5</a>; compare <a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>) after his father, Zacharias, of the priestly course of Abijah, had been performing the functions of his office in the temple.<P>(1) Death of Herod. <P>The death of Herod the Great occurred in the spring of 750/4. (NOTE: The alternative numbers are BC or AD, i. e, 750 A.U.C. = 4 BC, etc.) He ruled from his appointment in Rome 714/40 (Ant., XIV, xiv, 4-5, in the consulship of Caius Domitius Calvinus and Caius Asinius Pollio) 37 years, and from his accession in Jerusalem after the capture of the city 717/37 (Ant., XIV, xvi, 1-3; BJ, I, xvii, 9; I, xviii, 1-3; Dio Cassius xlix.22; compare Schurer, GJV3, I, 358,note 11) 34 years (Ant, XVII, xviii, 1; BJ, I, xxxiii, 7-8; compare Schurer, op. cit., I,415,note 167 where it is shown that Josephus reckons a year too much, probably counting from Nisan 1 and including partial years). Just before Herod\'s death there was an eclipse of the moon (Ant., XVII, vi, 4). According to astronomical calculations an eclipse was visible in Palestine on March 23 and September 15, 749/5, March 12, 750/4 and January 9, 753/1. Of these the most probable is that of March 12, 750/4. Soon after the eclipse Herod put to death his son Antipater and died five days later (Ant., XVII, vii; BJ, I, xxxiii, 7). Shortly after Herod\'s death the Passover was near at hand. (Ant., XVII, vi, 4 through ix, 3). In this year Passover (Nisan 15) fell on April 11; and as Archelaus had observed seven days of mourning for his father before this, Herod\'s death would fall between March 17 and April 4. But as the 37th (34th) year of his reign was probably reckoned from Nisan 1 or March 28, his death may be dated between March 28 and April 4, 750/4.<P>This date for Herod\'s death is confirmed by the evidence for the duration of the reigns of his three sons. Archelaus was deposed in 759/6 (Dio Cassius lv.27 in the consulship of Aemilius Lepidus and Lucius Arruntius) in the 10th year of his reign (Ant., XVII, xiii, 2; compare BJ, II, vii, 3 which gives the year as the 9th). Antipas was deposed most probably in the summer of 792/39 (Ant., XVIII, vii, 1-2; compare XVIII, vi, 11; XIX, viii, 2; BJ, II, ix, 6; Schurer, op. cit., I, 448, note 46 and 416, note 167). There are coins of Antipas from his 43rd year (Madden, Coins of the Jews, 121ff). The genuineness of a coin from the 44th year is questioned by Schurer but accepted by Madden. The coin from the 45th year is most probably spurious (Schurer, op. cit., I, 417, note 167). Philip died after reigning 37 years, in the 20th year of Tiberius—August 19, 786/33-787/34 (Ant., XVIII, iv, 6). There is also a coin of Philip from his 37th year (Madden, op. cit., 126). Thus Archelaus, Antipas and Philip began to reign in 750/4.<P>(2) Census of Quirinius.<P>The census or enrollment, which, according to <a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>f; was the occasion of the journey of Joseph and Mary to Bethlehem where Jesus was born, is connected with a decree of Augustus embracing the Greek-Roman world. This decree must have been carried out in Palestine by Herod and probably in accordance with the Jewish method—each going to his own city—rather than the Roman (Dig. 15,4,2; Zumpt, Das Geburtsjahr Christi, 195; Kenyon, Greek Papyri in the British Museum, III, 124f; Schurer, Theol. Ztg, 1907, 683f; and on the other hand, Ramsay, Expositor,1908,I,19,note). Certainly there is no intimation of an insurrection such as characterized a later census (<a onClick="return mV(\'Act\',5,37);">Ac 5:37</a>; Ant, XVIII, i, 1; BJ, II, xvii, 7; compare Tac. Ann. vi.41; Livy Epit. cxxxvi, cxxxvii; Dessau, Inscrip. lat. Sel. number 212, col. ii, 36) and this may have been due in no small measure to a difference in method. Both Josephus and Luke mention the later census which was made by Quirinius on the deposition of A rchelaus, together with the insurrection of Judas which accompanied it. But while Josephus does not mention the Herodian census—although there may be some intimation of it in Ant, XVI, ix, 3; XVII, ii, 4; compare Sanclemente, De vulg. aerae emend., 438f; Ramsay, Was Christ Born at Beth.1, 178ff—Luke carefully distinguishes the two, characterizing the census at the time of Jesus\' birth as "first," i.e. first in a series of enrollments connected either with Quirinius or with the imperial policy inaugurated by the decree of Augustus. The Greek-Roman writers of the time do not mention this decree and later writers (Cassiodor, Isidor and Suidas) cannot be relied upon with certainty as independent witnesses (Zumpt, Geburtsjahr, 148ff). Yet the geographical work of Agrippa and the preparation of a breviarium totius imperil by Augustus (Tac. Ann. i. 11; Suet. Aug. 28 and 101; Dio Cassius liii. 30; lvi. 33; compare Mommsen, Staatsrecht, II,1025,note 3), together with the interest of the emperor in the organization and finances of the empire and the attention which he gave to the provinces (Marquardt, Rom. Staatsverwaltung, II, 211f; compare 217), are indirectly corroborative of Luke\'s statement. Augustus himself conducted a census in Italy in 726/28, 746/8, 767/14 (Mommsen, Res Ges., 34ff) and in Gaul in 727/27 (Dio Cassius liii. 22, 5; Livy Epit. cxxxiv) and had a census taken in other provinces (Pauly-Wissowa, Realencyc., under the word "Census," 1918f; Marquardt, op. cit., II, 213). For Egypt there is evidence of a regular periodic census every 14 years extending back to 773/20 (Ramsay, op. cit., 131 if; Grenfell and Hunt, Oxy. Papyri, II, 207ff; Wilcken, Griech. Ostraka, I, 444ff) and it is not improbable that this procedure was introduced by Augustus (Schurer, op. cit., I, 515). The inference from Egyptian to similar conditions in other provinces must indeed be made cautiously (Wilcken, op. cit., 449; Marquardt, op. cit., 441); yet in Syria the regular tributum capitis seems to imply some such preliminary work (Dig, 1. 15, 3; Appian, Syriac., 50; Marquardt, op. cit., II, 200, note 2; Pauly-Wissowa, op. cit., 1921; Ramsay, op. cit., 154). The time of the decree is stated only in general terms by Luke, and it may have been as early as 727/27 (Zumpt, op. cit., 159; Marquardt, op. cit., II, 212) or later in 746-8 (Huschke, Census, 34; Ramsay, op. cit., 158ff), its execution in different provinces and subject kingdoms being carried out at different times. Hence, Luke dates the census in the kingdom of Herod specifically by connecting it with the administrative functions of Quirinius in Syria. But as P. Quintilius Varus was the legate of Syria just before and after the death of Herod from 748/6-750/4 (Ant., XVII, v, 2; XVII, ix., 3; XVII, x, 1 and 9; XVII, xi, 1; Tac. Hist. v.9; and coins in Eckhel, Doctr. num. vet., III, 275) and his predecessor was C. Sentius Saturninus from 745/9-748/6 (Ant; XVI, ix, 1; x, 8; xi, 3; XVII, i, 1; ii, 1; iii, 2), there seems to be no place for Quirinius during the closing years of Herod\'s reign. Tertullian indeed speaks of Saturninus as legate at the time of Jesus\' birth (Adv. Marc., iv.9). The interpretation of Luke\'s statement as indicating a date for the census before Quirinius was legate (Wieseler, Chron. Syn., 116; Lagrange, Revue Biblique, 1911, 80ff) is inadmissible. It is possible that the connection of the census with Quirinius may be due to his having brought to completion what was begun by one of his predecessors; or Quirinius may have been commissioned especially by the emperor as legatus ad census accipiendos to conduct a census in Syria and this commission may have been connected temporally with his campaign against the Homonadenses in Cilicia (Tac. Ann. iii.48; compare Noris, Cenotaph. Pis., 320ff; Sanclemente, op. cit., 426 passim; Ramsay, op. cit., 238). It has also been suggested by Bour (L\'Inscription de Quirinius, 48ff) that Quirinius may have been an imperial procurator specially charged with authority in the matter of the Herodian census. The titulus Tiburtinus (CIL, XIV, 3613; Dessau, Inscr. Latin Sel., 918)—if rightly assigned to him—and there seems to be no sufficient reason for questioning the conclusiveness of Mommsen\'s defense of this attribution (compare Liebenam, Verwaltungsgesch., 365)—proves that he was twice legate of Syria, and the titulus Venetus (CIL, III, 6687; Dessau, op. cit., 2683) gives evidence of a census conducted by him in Syria. His administration is dated by Ramsay (op. cit., 243) in 747/7; by Mommsen in the end of 750/4 or the beginning of 751/3 (op. cit., 172ff). Zahn (Neue kirch. Zeitschr.,1893, IV, 633ff), followed by Spitta (Zeitschr. f. d. neutest. Wiss., 1906, VII, 293ff), rejects the historicity of the later census connected by Josephus with the deposition of Archelaus, basing his view on internal grounds, and assigns the Lucan census to a time shortly after the death of Herod. This view however is rendered improbable by the evidence upon which the birth of Jesus is assigned to a time before the death of Herod (<a onClick="return mV(\'Mat\',2,1);">Mt 2:1</a>ff; <a onClick="return mV(\'Luk\',1,5);">Lu 1:5</a>; <a onClick="return mV(\'Luk\',2,1);">2:1</a>f); by the differentiation of the census in <a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>f and <a onClick="return mV(\'Act\',5,37);">Ac 5:37</a>; by the definite connection of the census in Josephus with Syria and the territory of Archelaus (compare also the tit. Venet.); and by the general imperial policy in the formation of a new province (Marquardt, op. cit., II, 213). Moreover there seems to be no adequate ground for identifying the Sabinus of Josephus with Quirinius as urged by Weber, who regards the two accounts (Ant., XVII, viii, 1ff and XVII, iv, 5; XVIII, i, 2; ii, 1ff) as due to the separation by Josephus of parallel accounts of the same events in his sources (Zeitschr. f. d. neutest. Wiss.,1909, X, 307ff)—the census of Sabinus-Quirinius being assigned to 4 BC, just after the death of Herod the Great. The synchronism of the second census of Quirinius with the periodic year of the Egyptian census is probably only a coincidence, for it was occasioned by the deposition of Archelaus; but its extension to Syria may be indicative of its connection with the imperial policy inaugurated by Augustus (Tac. Ann. vi.41; Ramsay, op. cit., 161f).<P>(3) Star of the Magi.<P>The identification of the star of the Magi (<a onClick="return mV(\'Mat\',2,2);">Mt 2:2</a>; compare <a onClick="return mV(\'Mat\',2,7,9,11);">Mt 2:7,9,16</a>; Macrobius, Sat., II, 4; Sanclemente, op. cit., 456; Ramsay, op. cit., 215ff) and the determination of the time of its appearance cannot be made with certainty, although it has been associated with a conjunction in 747/7 and 748/6 of Saturn and Jupiter in the sign of Pisces&mdash;a constellation which was thought to stand in close relation with the Jewish nation (Ideler, Handbuch d. math. u. tech. Chron., II, 400ff). When the Magi came to Jerusalem, however, Herod was present in the city; and this must have been at least several months before his death, for during that time he was sick and absent from Jerusalem (Ant., XVII, vi, 1ff; BJ, I, xxxiii, 1ff).<P>(4) Course of Abijah.<P>The chronological calculations of the time of the service of the priestly course of Abijah in the temple, which are made by reckoning back from the time of the course of Jehoiarib which, according to Jewish tradition, was serving at the time of the destruction of Jerusalem by Titus, are uncertain (Schurer, op. cit., II, 337, note 3; compare Lewin, Fasti Sacri, 836).<P>(5) Day and month.<P>The day and month of Jesus\' birth are also uncertain. December 25 was celebrated by the church in the West as early as the 2nd century—if the date in Hippolytus on Dan., IV, 23, be genuine (compare Ehrhardt, Altchr. Lit., 1880-1900, 383); but January 6 was celebrated in the East as the anniversary both of the birth and of the baptism. The fact that shepherds were feeding their flocks at night when Jesus was born (<a onClick="return mV(\'Luk\',2,8);">Lu 2:8</a>) makes it improbable that the season of the year was winter.<P>(6) Summary.<P>The birth of Jesus may therefore be assigned to the period 747/7 to 751/5, before the death of Herod, at the time of a census made by Herod in accordance with a decree of Augustus and when Quirinius was exercising extraordinary authority in Syria—Varus being the regular legate of the province, i.e. probably in 748/6.<P>See <a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>.<P>2. Baptism of Jesus:<P>The Synoptic Gospels begin their description of the public ministry of Jesus with an account of the ministry of John the Baptist (<a onClick="return mV(\'Mat\',3,1);">Mt 3:1</a>ff; <a onClick="return mV(\'Mar\',1,1);">Mr 1:1</a>ff; <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>ff; compare of in <a onClick="return mV(\'Jhn\',1,19);">Joh 1:19</a>ff; <a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>; Josephus, Ant, XVIII, iii, 3) and Luke definitely dates the baptism of Jesus by John in the 15th year of Tiberius. Luke also designates this event as the beginning of Jesus\' ministry, and by stating Jesus\' age approximately brings it into connection with the date of His birth. If Luke reckoned the reign of Tiberius fro m the death Augustus, August 19, 767/14, the 15th year would extend from August 19, 781/28 to August 18, 782/29; and if Jesus was about thirty years old at this time, His birth would fall 751//3 to 752/2—or sometime after the death of Herod, which is inconsistent with Luke\'s own and Mat
