isbe = [];

isbe[2001]='Cheese`chez.`<a href="./study/isbe/search.html?string=FOOD">FOOD</a>; <a href="./study/isbe/search.html?string=MILK">MILK</a>`1';
isbe[2002]='Chelal`ke\'-lal (kelal, "perfection"): One of the bene Pachath-Mo\'abh who took "strange wives" (<a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>).``1';
isbe[2003]='Chelcias`kel\'-si-as.`<a href="./study/isbe/search.html?string=HELKIAS">HELKIAS</a>; <a href="./study/isbe/search.html?string=HILKIAH">HILKIAH</a>`1';
isbe[2004]='Chellians`kel\'-i-anz: The people of "<a href="./study/isbe/search.html?string=CHELLUS">Chellus</a>" (Judith 2:23) (which see).``1';
isbe[2005]='Chelluh`kel\'-u.`<a href="./study/isbe/search.html?string=CHELUHI">CHELUHI</a>`1';
isbe[2006]='Chellus`kel\'-us (Chellous), a place named (Judith 1:9) among those west of the Jordan to which Nebuchadnezzar sent his summons. It is mentioned along with "Kades," and as it lay north of the "children of Ishmael" it may with some probability be taken as lying southwest of Jerusalem. It has been conjectured that it may be Chalutzah (Reland, Palestine, 717), a place under the form Elusa well known to the ancient geographers.``1';
isbe[2007]='Chelod`ke\'-lod (Cheleoud, Cheleoul): In Judith 1:6 it is said that "many nations of the sons of Chelod assembled themselves to the battle." They are mentioned as obeying the summons of Nebuchadnezzar to his war against Arphaxad. No very probable suggestion has been made as to the meaning of Chelod.``1';
isbe[2008]='Chelub`ke\'-lub:<P>(1) kelubh, father of Mehir (<a onClick="return mV(\'1Ch\',4,11);">1Ch 4:11</a>); the name is probably a variation of Caleb. Wellhausen (De gentibus et familiis Judaeis) reads kalebh ben chezron.<P>(2) Father of Ezri (<a onClick="return mV(\'1Ch\',27,26);">1Ch 27:26</a>), one of the officers of David.`<a href="./study/isbe/search.html?string=GENEALOGY">GENEALOGY</a>`1';
isbe[2009]='Chelubai`ke-loo\'-bi (kelubhay): Another form of Caleb used in <a onClick="return mV(\'1Ch\',2,9);">1Ch 2:9</a>; compare <a onClick="return mV(\'1Ch\',2,18,42);">1Ch 2:18, 42</a>. Caleb is here described as the brother of Jerahmeel, and son of Hezron, a remote ancestor, instead of as the son of Jephunneh.`<a href="./study/isbe/search.html?string=CALEB">CALEB</a>`1';
isbe[2010]='Cheluhi`kel\'-oo-hi (keluhi, Kt.; keluhu, Qere; the Revised Version, margin Cheluhu; the King James Version Chelluh): Mentioned in the list of persons with foreign wives (<a onClick="return mV(\'Ezr\',10,35);">Ezr 10:35</a> = 1Esdras 9:34).``1';
isbe[2011]='Chemarim`kem\'-a-rim (kemarim, a plural whose singular komer is not found in the Old Testament): Occurs only once in the text of English Versions of the Bible (<a onClick="return mV(\'Zep\',1,4);">Ze 1:4</a>, the King James Version Chemarims), though the Hebrew word is found also in <a onClick="return mV(\'2Ki\',23,5);">2Ki 23:5</a> (English Versions "idolatrous priests") and <a onClick="return mV(\'Hsa\',10,5);">Ho 10:5</a> (English Versions "priests," English Versions margins, however, having "Chemarim" in both places). Some regard the word as an interpolation in <a onClick="return mV(\'Zep\',1,4);">Ze 1:4</a>, since the Septuagint omits it and its presence disturbs the parallelism. The word, which is of Aramaic origin (kumra, priest), is used in the Old Testament only in an unfavorable sense, its origin and associations naturally suggesting Syriac affinities. In the Syriac, however, no such connotation is involved. In the Peshitta version of the Old Testament it is used indifferently of idolatrous priests and of priests of Yahweh, while in the same version of the New Testament it is used of the Levitical priests and of our Lord (e.g. <a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>; <a onClick="return mV(\'Hbr\',3,1);">3:1</a>; <a onClick="return mV(\'Hbr\',4,14,15);">4:14-15</a>, and often) and in <a onClick="return mV(\'Act\',19,35);">Ac 19:35</a> it is the rendering of neokoros (the Revised Version (British and American) "temple-keeper," the King James Version "worshipper"). The question of the root idea of the word remains unsettled. The traditional supposition, which finds some support even among modern scholars, is that the verbal form means "to be black," the priests being supposed to have been clad in black. But it is doubtful whether the root had this meaning. Another conjecture takes the root to mean "to be sad," the priest being a man of a sad countenance, an ascetic. Cheyne would relate the word to the Assyrian kummaru, having the sense of "a clean vesture." It is at all events probable that the priests, both in Israel and in the surrounding nations, employed white vestments, rather than black, when in the performance of their official functions. According to the Mishna, Middoth, verse 4, a Levitical priest who had become disqualified for service put on black garments and departed, while the others put on white garments and went in and ministered. The reference to the Baal worship in <a onClick="return mV(\'2Ki\',10,22);">2Ki 10:22</a> seems more congruous with this view; hence, probably blackrobed priests (Chemarim) of Baal and the unfaithful priests of Yahweh shall be cut off together. G. A. Smith (BTP, II, 56) reads "the priestlings with the priests."``134';
isbe[2012]='Chemosh`ke\'-mosh (kemosh; Chamos):<P>1. Moabites, the People of Chemosh<P>2. Solomon and Chemosh Worship<P>3. Josiah Putting Down Chemosh Worship<P>4. Chemosh and Ammonites<P>5. Moabite Stone<P>6. Mesha\'s Inscription and the Old Testament<P>7. Chemosh in the Inscription<P>8. Parallels between Inscription and Old Testament Record<P>9. Ethical Contrast<P>LITERATURE<hr /><P>1. Moabites, the People of Chemosh:<P>The national God of the Moabites, as Baal of the Zidonians, or Milcom (Moloch, Malcam) of the Ammonites. The Moabites are apostrophized in an old Hebrew song as the "people of Chemosh" (<a onClick="return mV(\'Num\',21,29);">Nu 21:29</a>). Jeremiah in his oracle of doom upon Moab has recourse to the same old song and calls the people "the people of Chemosh." The impotence of the god to deliver his people is described by the prophet in figures representing him as going into captivity with them, his priests and princes together, and Moab is to be ashamed of him as Israel was of the Golden Calf of Bethel, which did not avail to save the Northern Kingdom from the conquering Assyrian power (<a onClick="return mV(\'Jer\',48,7,13,16);">Jer 48:7, 13-16</a>).<P>2. Solomon and Chemosh Worship:<P>For Chemosh, "the abomination of Moab," as for Moloch, "the abomination of the children of Ammon," Solomon, under the influence of his idolatrous wives, built a high place in the mount before Jerusalem (<a onClick="return mV(\'1Ki\',11,7);">1Ki 11:7</a>). It was natural that they should desire to worship still after the manner of the gods of their native land, but although the effect of all this was seen in the moral and spiritual deterioration of Solomon himself there is no indication that the immoralities and cruelties associated with such worship were then practiced in Jerusalem. In the days of Ahaz and Manasseh, even as early as the days of Abijam of Judah, they were (<a onClick="return mV(\'1Ki\',15,12,13);">1Ki 15:12-13</a>).<P>3. Josiah Putting Down Chemosh Worship:<P>Josiah found these abominations of alien worship, which had been introduced by Solomon and added to by Ahaz and Manasseh, flourishing when he came to the throne. Moved by the prohibitions of the Book of the Law (<a onClick="return mV(\'Deu\',12,\'29-31\');">De 12:29-31</a>; <a onClick="return mV(\'Deu\',18,10);">18:10</a>), Josiah pulled down and defiled the high places and the altars, and in order to make a clean sweep of the idolatrous figures, "he brake in pieces the pillars," or obelisks, "and cut down the Asherim," or sacred poles, "and filled their places with the bones of men" (<a onClick="return mV(\'2Ki\',23,\'1-20\');">2Ki 23:1-20</a>).<P>4. Chemosh and Ammonites:<P>There is one passage where Chemosh is designated the god of the Ammonites (<a onClick="return mV(\'Jdg\',11,24);">Jud 11:24</a>). Jephthah is disputing the right of the Ammonites to invade territory which belongs to Israel because Yahweh has given it to them by conquest. And he asks: \'Shouldst thou not possess the territory of those whom Chemosh, thy god, dispossesses, and we the territory of all whom Yahweh, our god, dispossesses?\' It may be that he is called here the god of the Ammonites by a mere oversight of the historian; or that Moab and Ammon being kindred nations descended from a common ancestor, Lot, Chemosh may in a sense belong to both. We notice, however, that Jephthah\'s argument in meeting the claim preferred by the king of Ammon passes on to Israel\'s relation to the Moabites and makes mention only of well-known Moabite cities. Chemosh is accordingly named because of his association with Moab, the cities of which are being spoken of, although strictly and literally Milcom should have been named in an appeal addressed as a whole to the Ammonites (<a onClick="return mV(\'Jdg\',11,\'12-28\');">Jud 11:12-28</a>; compare Moore at the place).<P>5. Moabite Stone:<P>The discovery of the Moabite Stone in 1868 at Dibon has thrown light upon Chemosh and the relations of Moab to its national god. The monument, which is now one of the most precious treasures of the Louvre in Paris, bears an inscription which is the oldest specimen of Semitic alphabetic writing extant, commemorating the successful effort made about 860 or 850 BC by Mesha, king of Moab, to throw off the yoke of Israel. We know from the Old Testament record that Moab had been reduced to subjection by David (<a onClick="return mV(\'2Sa\',8,2);">2Sa 8:2</a>); that it paid a heavy tribute to Ahab, king of Israel (<a onClick="return mV(\'2Ki\',3,4);">2Ki 3:4</a>); and that, on the death of Ahab, Mesha its king rebelled against Israelite rule (<a onClick="return mV(\'2Ki\',3,5);">2Ki 3:5</a>). Not till the reign of Jehoram was any effort made to recover the lost dominion. The king of Israel then allied himself with the kings of Judah and Edom, and marching against Moab by the way of the Red Sea, inflicted upon Mesha a defeat so decisive that the wrath of his god, Chemosh, could be appeased only by the sacrifice of his son (<a onClick="return mV(\'2Ki\',3,6);">2Ki 3:6</a>ff).<P>6. Mesha\'s Inscription and the Old Testament:<P>The historical situation described in the Old Testament narrative is fully confirmed by Mesha\'s inscription. There are, however, divergences in detail. In the Book of Kings the revolt of Mesha is said to have taken place after the death of Ahab. The inscription implies that it must have taken place by the middle of Ahab\'s reign. The inscription implies that the subjection of Moab to Israel had not been continuous from the time of David, and says that \'Omri, the father of Ahab, had reasserted the power of Israel and had occupied at least a part of the land.<P>7. Chemosh in the Inscription:<P>It is with what the inscription says of Chemosh that we are chiefly concerned. On the monument the name appears twelve times. Mesha is himself the son of Chemosh, and it was for Chemosh that he built the high place upon which the monument was found. He built it because among other reasons Chemosh had made him to see his desire upon them that hated him. It was because Chemosh was angry with his land that \'Omri afflicted Moab many days. \'Omri had taken possession of the land of Medeba and Israel dwelt in it his days and half his son\'s days, but Chemosh restored it in Mesha\'s days. Mesha took \'Ataroth which the king of Israel had built for himself, slew all the people of the city, and made them a gazing-stock to Chemosh and to Moab. Mesha brought thence the altar-hearth of Dodo, and dragged it before Chemosh in Kerioth. By command of Chemosh, Mesha attacked Nebo and fought against Israel, and after a fierce struggle he took the place, slaying the inhabitants en masse, 7,000 men and women and maidservants, devoting the city to \'Ashtor-Chemosh and dragging the altar vessels of Yahweh before Chemosh. Out of Jahaz, too, which the king of Israel had built, Chemosh drove him before Mesha. At the instigation of Chemosh, Mesha fought against Horonaim, and, although the text is defective in the closing paragraph, we may surmise that Chemosh did not fail him but restored it to his dominions.<P>8. Parallels between Inscription and Old Testament Record:<P>Naturally enough there is considerable obscurity in local and personal allusions. Dodo may have been a local god worshipped by the Israelites east of the Jordan. Ashtor-Chemosh may be a compound divinity of a kind not unknown to Semitic mythology, Ashtor representing possibly the Phoenician Ashtoreth. What is of importance is the recurrence of so many phrases and expressions applied to Chemosh which are used of Yahweh in the Old Testament narratives. The religious conceptions of the Moabites reflected in the inscription are so strikingly like those of the Israelites that if only the name of Yahweh were substituted for that of Chemosh we might think we were reading a chapter of the Books of Kings. It is not in the inscriptions, however, but in the Old Testament narrative that we find a reference to the demand of Chemosh for human sacrifice. "He took his eldest son," says the Hebrew historian, "that should have reigned in his stead, and offered him for a burnt-offering upon the wall. And there was great wrath against Israel: and they departed from him, and returned to their own land" (<a onClick="return mV(\'2Ki\',3,27);">2Ki 3:27</a>). This appears to indicate that the Israelites had to give up their purpose to fasten the yoke of bondage again upon Mesha and that they returned empty-handed to their own land. But this fortunate result for Moab was due to the favor of Chemosh, and in particular to the human sacrifice by which he was propitiated.<P>9. Ethical Contrast:<P>If we find in these representations of Chemosh in the Old Testament narrative and in Mesha\'s inscription a striking similarity to the Hebrew conception of Yahweh, we cannot fail to notice the lack of the higher moral and spiritual elements supplied to the religion of Israel by the prophets and indeed from Moses and Abraham downward. "Chemosh," says W. Baudissin, "is indeed the ruler of his people whom he protects as Yahweh the Israelites, whom he chastises in his indignation, and from whom he accepts horrible propitiatory gifts. But of a God of grace whose long-suffering leads back even the erring to Himself, of a Holy God to whom the offering of a pure and obedient heart is more acceptable than bloody sacrifices, of such a God as is depicted in Israel\'s prophets and sweet singers there is no trace in the Moabite picture of Chemosh. While Mesha is represented as offering up his own son in accordance with the stern requirements of his religion, Old Testament law-givers and prophets from the beginning condemned human sacrifice" (RE3, article "Kemosh").<P>LITERATURE.<P>RE3, article "Kemosh"; Cooke, Text-Book of North-Semitic Inscriptions, "Moabite Stone," 1-14; W. Robertson Smith, Prophets of Israel, 49ff; Sayce, Sayce, Higher Criticism and the Monuments, 364ff.``128';
isbe[2013]='Chenaanah`ke-na\'-a-na (kena\'anah, feminine form of "Canaan," though others explain it as "toward Canaan"): The name of two men:<P>(1) The fourth-named of the seven sons of Bilham, son of Jediael, of the tribe of Benjamin, a leading warrior in the time of David (<a onClick="return mV(\'1Ch\',7,10);">1Ch 7:10</a>).<P>(2) Father of the false prophet Zedekiah, who encouraged Ahab against Micaiah (<a onClick="return mV(\'1Ki\',22,11,24);">1Ki 22:11, 24</a>; <a onClick="return mV(\'2Ch\',18,10,23);">2Ch 18:10, 23</a>).``1';
isbe[2014]='Chenani`ke-na\'-ni (kenani, "planted"): One of the names mentioned in <a onClick="return mV(\'Neh\',9,4);">Ne 9:4</a>, in connection with the constitution of "congregation." If the names represent houses or families, eight Levitical houses probably sang some well-known psalm on this occasion. If they are names of individual representatives, they were probably deputed to recite or chant some special prayer in order to lead the worship of the people.``1';
isbe[2015]='Chenaniah`ken-a-ni\'-a (kenanyahu, and kenanyah, literally "established by God"): Chief of the Levites who was over "the songs," or "the carrying" (namely, "of the ark") from the house of Obed-edom to Jerusalem (<a onClick="return mV(\'1Ch\',15,22,27);">1Ch 15:22, 27</a>; <a onClick="return mV(\'1Ch\',26,29);">26:29</a>).``1';
isbe[2016]='Chephar-Ammoni`ke-far-am\'-o-ni (the King James Version Chephar-haammoni; kephar ha\'ammoni; Codex Vaticanus, Kepheira kai Monei; A, Kapherammin, "village of the Ammonites"): A place in the territory of Benjamin (<a onClick="return mV(\'Jos\',18,24);">Jos 18:24</a>). It may be identical with Kefr \'Ana, a ruined site about two miles to the Northeast of Bethel.``1';
isbe[2017]='Chephar-Haamoni`ke-far-ha-am\'-o-ni.`<a href="./study/isbe/search.html?string=CHEPHAR+AMMONI">CHEPHAR-AMMONI</a>`1';
isbe[2018]='Chephirah`ke-fi\'-ra (ha-kephirah; Codex Vaticanus, Kapheira (<a onClick="return mV(\'Jos\',9,\'1-\');">Jos 9</a>); Codex Alexandrinus has Chepheira, Codex Vaticanus has kai Pheira (<a onClick="return mV(\'Jos\',18,\'1-\');">Jos 18</a>)): One of the cities of the Hivites who by guile made alliance with Israel (<a onClick="return mV(\'Jos\',9,17);">Jos 9:17</a>). It was in the lot of Benjamin (<a onClick="return mV(\'Jos\',18,26);">Jos 18:26</a>), and was reoccupied after the return from Babylon (<a onClick="return mV(\'Ezr\',2,25);">Ezr 2:25</a>; <a onClick="return mV(\'Neh\',7,29);">Ne 7:29</a>). It is represented by the modern Kefireh, to the southwest of Gibeon, and north of Karyat el-\'Anab. It stands on high ground, with many ancient remains.``1';
isbe[2019]='Cheran`ke\'-ran (keran): A Horite clan-name, occurring in the genealogy of Seir, the Horite (<a onClick="return mV(\'Gen\',36,26);">Ge 36:26</a>), and in the parallel list in <a onClick="return mV(\'1Ch\',1,41);">1Ch 1:41</a>. Dillmann derives it from kar, "a lamb."``1';
isbe[2020]='Cherethites`ker\'-e-thits (kerethim, ha-kerethi; Chelethi "executioners," "life-guardsmen"): A people in Southern Palestine whose territory bordered upon that of Judah (<a onClick="return mV(\'1Sa\',30,14);">1Sa 30:14</a>). In <a onClick="return mV(\'1Sa\',30,16);">1Sa 30:16</a> this land is apparently identical with that of the Philistines. In <a onClick="return mV(\'Eze\',25,16);">Eze 25:16</a> the Philistines and the Cherethites are threatened together; while in <a onClick="return mV(\'Zep\',2,5);">Zep 2:5</a> the Cherethites are evidently the dwellers in "the land of the Philistines," "the inhabitants of the seacoast." Septuagint in both Ezekiel and Zephaniah renders the name "Cretans." The translators may have been "guided only by the sound." But Zeus Cretagenes in Gaza suggests a connection with the island of Crete. See, however, <a href="./study/isbe/search.html?string=CAPHTOR">CAPHTOR</a>. It may be taken as certain that the Cherethites were a Philistine clan. In conjunction with the Pelethites they are frequently named as forming the guard of David (<a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a>, etc.). It was the custom of many ancient monarchs to have a guard of foreign mercenaries.``54';
isbe[2021]='Cherish`cher\'-ish (cakhan; thalpo): Cakhan, "to act the friend," "to be useful," is translated "cherish" (<a onClick="return mV(\'1Ki\',1,2,4);">1Ki 1:2, 4</a>); thalpo, "to warm," "to make warm," "to foster" (<a onClick="return mV(\'Eph\',5,29);">Eph 5:29</a>), said of the regard the husband should have for his wife, even as his own flesh which he "nourisheth and cherisheth, even as Christ also the church," and in <a onClick="return mV(\'1Th\',2,7);">1Th 2:7</a>, of Paul amongst his converts, "as when a nurse cherisheth her own children."``1';
isbe[2022]='Cherith, the Brook`ke\'-rith (nachal kerith; Cheimarrhous Chorrhath): The place where Elijah hid and was miraculously fed, after announcing the drought to Ahab (<a onClick="return mV(\'1Ki\',17,3);">1Ki 17:3</a>). It is described as being "before," that is "east," of Jordan. It cannot therefore be identified with Wady el-Kelt, to the west of Jericho. The retreat must be sought in some recess of the Gilead uplands with which doubtless Elijah had been familiar in his earlier days.``1';
isbe[2023]='Cherub`ke\'-rub (kerubh, Cheroub, Charoub): A place in Babylonia from which people whose genealogies had fallen into confusion went up at the return from exile (<a onClick="return mV(\'Ezr\',2,59);">Ezr 2:59</a>; <a onClick="return mV(\'Neh\',7,61);">Ne 7:61</a>); unidentified. In 1Esdras 5:36 we read "Charaathalan leading them, and Allar," a phrase that seems to have arisen through confusion of the names in the passages cited above.``1';
isbe[2024]='Cherubic, Forms in the Constellations`che-roo\'-bik.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2025]='Cherubim (1)`cher\'-u-bim, cher\'-oo-bim (kerubhim, plural of cherub, kerubh): Through the influence of the Septuagint, "cherubim" was used in the earlier English versions, also as a singular, hence, the plural was made to sound "cherubims." The etymology of the word cannot be ascertained.<P>1. As Guardians of Paradise:<P>In <a onClick="return mV(\'Gen\',3,24);">Ge 3:24</a> the cherubim are placed by God, after the expulsion of Adam from the garden of Eden, at the east thereof, together with the flaming sword "to keep the way of the tree of life." In their function as guardians of Paradise the cherubim bear an analogy to the winged bulls and lions of Babylonia and Assyria, colossal figures with human faces standing guard at the entrance of temples (and palaces), just as in Egypt the approaches to the sanctuaries are guarded by sphinxes. But the Babylonian colossi go by the name of lamassu, or shedu; no designation at all approaching the Hebrew kerubh has so far been found in the Assyrian language. Nor are thus named the winged figures, half human and half animal, which in Babylonian and Persian art are found on both sides of the "sacred tree." Thus, a Babylonian origin of the Hebrew cherubim is neither proved nor disproved. If we look for further analogies which, of course, do not indicate a borrowing on the part of the Hebrews, we may mention the fabulous griffins (grupes), usually represented as having the heads and wings of an eagle and the body and hind quarters of a lion; they were believed by the Greeks to inhabit Scythia, and to keep jealous watch over the gold of that country.<P>2. The Garden as the Abode of the Gods:<P>If we read between the lines of the Paradise account in Genesis (compare <a onClick="return mV(\'Gen\',3,8);">Ge 3:8</a>), the garden of Eden, the primeval abode of man, reveals itself as more than that: it was apparently the dwelling-place of God. In the polytheistic story of the creation of the world and early life of man, which, while in several respects analogous (compare <a onClick="return mV(\'Gen\',3,22);">Ge 3:22</a>), is devoid of the more spiritual notions of Hebraism, the garden was the abode of the gods who alone had access to the tree of life from the fruit of which they derived their immortality. Adam, before the fall, is conceived as a superhuman being; for while he is forbidden to taste of the fruit of the tree of knowledge, the way to immortality is open to him; for it is only after transgressing the Divine command that he merits death and becomes mortal. The choice of immortal innocence and mortal knowledge lay before him; he elected death with knowledge.<P>3. The Cherubim as Attendants of the Deity:<P>The mythical elements of the Paradise story are still more patent in <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>ff, where the fall of the king of Tyre is likened to that of primeval man. The garden is situated on a holy mountain of Elohim(= God to Ezekiel, but gods in the primitive source), the \'mountain of assembly\' of <a onClick="return mV(\'Isa\',14,13);">Isa 14:13</a>, high above the stars in the recesses of the North. It is a wonderful place, adorned with all manner of precious stones. There man, perfect from the day he was created, resplendent with beauty, excelling in wisdom, walks among the fiery stones, like a cherub with outstretched wings. The cherubs are apparently the attendants of the Deity, beauteous angels, of whom man was to be one: but he fell from glory and was hurled from the sanctuary which he had polluted. Some of the angelic attendants of the Deity within are placed in Genesis without, to do service as guardians of the unapproachable holy garden.<P>4. As Bearers of the Throne:<P>As attendants of God, they bear the throne upon which He descends from His high abode. Thus in the description of a theophany in <a onClick="return mV(\'Psa\',18,\'1-\');">Ps 18</a>, we read: " He bowed the heavens also, and came down; And thick darkness was under his feet. And he rode upon a cherub and did fly; Yea, he soared upon the wings of the wind." (<a onClick="return mV(\'Psa\',18,9,10);">Ps 18:9-10</a>) Hence, the Lord, or, as the fuller title goes, the Lord of Hosts, is repeatedly styled "He that sitteth (throned) above the cherubim" (<a onClick="return mV(\'Psa\',80,1);">Ps 80:1</a>; <a onClick="return mV(\'Psa\',99,1);">99:1</a>; <a onClick="return mV(\'1Sa\',4,4);">1Sa 4:4</a>, and elsewhere). There is certainly no trace here of bull figures: bulls do not fly. The underlying conception is, it seems, rather that of the storm cloud. Compare <a onClick="return mV(\'Psa\',104,3);">Ps 104:3</a>: " Who maketh the clouds his chariot; Who walketh upon the wings of the wind." The Hebrew for "chariot" is rekhubh, a sort of inverted kerubh. 5. In the Vision of Ezekiel:<P>But the function of the cherubim as bearers and movers of the Divine throne is brought out most clearly in the vision of Ezekiel (<a onClick="return mV(\'Eze\',1,\'1-\');">Eze 1</a>, with which compare <a onClick="return mV(\'Eze\',10,\'1-\');">Eze 10</a>). In chapter 1 the prophet designates them as "living creatures" (chayyoth); but upon hearing God\'s words addressed to the "man clothed in linen" (<a onClick="return mV(\'Eze\',10,2);">Eze 10:2</a>) he perceives that the living creatures which he saw in the first vision were cherubim (<a onClick="return mV(\'Eze\',10,20);">Eze 10:20</a>); hence, in <a onClick="return mV(\'Eze\',9,3);">Eze 9:3</a> the chariot or throne, from which the glory of God went up, is spoken of as a cherub. The following is a description in detail of the cherubim as seen by Ezekiel. They are represented as four living creatures, each with four faces, man, lion, ox (replaced in the parallel chapter by cherub), and eagle (<a onClick="return mV(\'Eze\',1,10);">Eze 1:10</a>; <a onClick="return mV(\'Eze\',10,14);">10:14</a>), having the figure and hands of men (<a onClick="return mV(\'Eze\',1,5,8);">Eze 1:5, 8</a>), and the feet of calves (<a onClick="return mV(\'Eze\',1,7);">Eze 1:7</a>). Each has four wings, two of which are stretched upward (<a onClick="return mV(\'Eze\',1,11);">Eze 1:11</a>), meeting above and sustaining the "firmament," that is, the bottom of the Divine throne (<a onClick="return mV(\'Eze\',1,22);">Eze 1:22</a>; <a onClick="return mV(\'Eze\',10,1);">10:1</a>), while two are stretched downward, conformable the one to the other, so as to cover their bodies (<a onClick="return mV(\'Eze\',1,11,23);">Eze 1:11, 23</a>). In appearance, the living creatures resemble coals of fire (compare <a onClick="return mV(\'Eze\',10,2,6);">Eze 10:2, 6</a>f; where the "man clothed in linen" is bidden fill both his hands with coals of fire from between the cherubim), burning like torches, the fire flashing up and down among the creatures, a bright fire out of which lightning goes forth (<a onClick="return mV(\'Eze\',1,13);">Eze 1:13</a>). Thus the creatures run and vanish as the appearance of a flash of lightning (<a onClick="return mV(\'Eze\',1,14);">Eze 1:14</a>). The cherubim do not turn as they change direction, but always go straight forward (<a onClick="return mV(\'Eze\',1,9,17);">Eze 1:9, 17</a>; <a onClick="return mV(\'Eze\',10,11);">10:11</a>), as do the wheels of the cherubic chariot with rings full of eyes round about (<a onClick="return mV(\'Eze\',1,18);">Eze 1:18</a>; <a onClick="return mV(\'Eze\',10,12);">10:12</a>). The cherubim represent the spirit, or will, in the wheels: at the direction of the spirit, the wheels are lifted up from the bottom and the chariot moves upward (<a onClick="return mV(\'Eze\',1,19);">Eze 1:19</a>f; <a onClick="return mV(\'Eze\',10,16);">10:16</a>f). The cherubim are thus the moving force of the vehicle.<P>6. Relation to Seraphim and Other Angels:<P>Ezekiel\'s cherubim are clearly related to the seraphim in Isaiah\'s inaugural vision (<a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>). Like the cherubim, the seraphim are the attendants on God as He is seated upon a throne high and exalted; they are also winged creatures: with twain they cover their faces, and with twain they cover their feet, and with twain they fly. Like the Levites in the sanctuary below, they sing a hymn of adoration: "Holy, holy, holy, is Yahweh of hosts: the whole earth is full of his glory." In the Book of Enoch, the cherubim, seraphim, and ophannim (wheels), and all the angels of power constitute the "host of God," the guardians of His throne, the singers of praise ascribing blessedness to "the Lord of Spirits," with the archangel Gabriel at their head (see <a onClick="return mV(\'Isa\',61,10);">Isa 61:10</a>f;). And so in the Jewish daily liturgy the seraphim, ophannim, and "living creatures" constitute the heavenly choir who, the elect ministers of the Living God, ready to do the will of their maker with trembling, intone in sweet harmony the Thrice-holy. In the Talmud, the cherubim are represented as having the likeness of youths (with a fanciful etymology, ke plus rubh, "like a youth"; Cukk 5b; Chag 13b), while, according to the Midrash, they have no definite shape, but appear indifferently as men or women, or as spirits and angelic beings (Ge rabba\' 21).<P>7. In <a onClick="return mV(\'Rev\',4,\'1-\');">Revelation 4</a>:<P>The "four living creatures" of <a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>ff are clearly modeled upon Ezekiel, with supplementary touches from Isaiah. Full of eyes before and behind, they are in the midst of the throne, and round about it. One resembles a lion, the other a calf, and the third a man, and the fourth a flying eagle. Each of the creatures has six wings. "They have no rest day and night, saying, Holy, holy, holy, is the Lord God, the Almighty, who was and who is and who is to come."<P>8. Ornamental Cherubim in the Temple of Solomon:<P>In the temple of Solomon, two gigantic cherubic images of olive-wood plated with gold, ten cubits high, stood in the innermost sanctuary (the debhir) facing the door, whose wings, five cubits each, extended, two of them meeting in the middle of the room to constitute the throne, while two extended to the walls (<a onClick="return mV(\'1Ki\',6,\'23-28\');">1Ki 6:23-28</a>; <a onClick="return mV(\'1Ki\',8,6,7);">8:6-7</a>; <a onClick="return mV(\'2Ch\',3,\'10-13\');">2Ch 3:10-13</a>; <a onClick="return mV(\'2Ch\',5,7,8);">5:7-8</a>). The Chronicler represents them as the chariot of the Lord (<a onClick="return mV(\'1Ch\',28,18);">1Ch 28:18</a>). There were also images of the cherubim carved on the gold-plated cedar planks which constituted the inner walls of the temple, and upon the olive-wood doors (<a onClick="return mV(\'1Ki\',6,29,35);">1Ki 6:29, 35</a>; <a onClick="return mV(\'2Ch\',3,7);">2Ch 3:7</a>); also on the bases of the portable lavers, interchanging with lions and oxen (<a onClick="return mV(\'1Ki\',7,\'29-36\');">1Ki 7:29-36</a>). According to the Chronicler, they were also woven in the veil of the Holy of Holies (<a onClick="return mV(\'2Ch\',3,14);">2Ch 3:14</a>).<P>9. In the Temple of Ezekiel:<P>Ezekiel represents the inner walls of the temple as carved with alternating palm trees and cherubim, each with two faces, the lion looking on one side, the man on the other (<a onClick="return mV(\'Eze\',41,\'18-25\');">Eze 41:18-25</a>).<P>10. In the Tabernacle:<P>In the Tabernacle, there were two cherubim of solid gold upon the golden slab of the "lid," or "mercy-seat," facing each other, with wings outstretched above, so as to constitute a throne on which the glory of the Lord appeared, and from which He spake (<a onClick="return mV(\'Exd\',25,\'18-22\');">Ex 25:18-22</a>; <a onClick="return mV(\'Exd\',37,\'7-9\');">37:7-9</a>; <a onClick="return mV(\'Num\',7,89);">Nu 7:89</a>; <a onClick="return mV(\'Hbr\',9,5);">Heb 9:5</a>). There were also cherubim woven into the texture of the inner curtain of the Tabernacle and the veil (<a onClick="return mV(\'Exd\',26,1,31);">Ex 26:1, 31</a>; <a onClick="return mV(\'Exd\',36,8,35);">36:8, 35</a>). There were no cherubim in the temple of Herod, but the walls were painted with figures of them (see Talmud Yoma\' 54a). In the times of Josephus no one knew what the Scriptural cherubim looked like (Ant., VIII, iii, 3).<P>LITERATURE.<P>Brown, Driver, and Briggs, Hebrew and English Lexicon of the Old Testament, under the word; KAT3, 529f; and references; commentaries on Genesis and Ezekiel.``115';
isbe[2026]='Cherubim (2)`The cherubic forms in the constellation figures.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2027]='Chesalon`kes\'-a-lon (kecalon; Chaslon, Chasalon): One of the cities on the Northern boundary of Judah (<a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a>). In the 4th century it was a "very large village." It is now Kesla, 2,087 ft. above sea-level, a small village perched on a mountain ridge to the south of Wady el Humar. See Palestine Exploration Fund, III, 25, 26; Sh XVII.``1';
isbe[2028]='Chesed`ke\'-sed, kes\'-ed (kasdim; Chaszad): One of the sons of Nahor and Milcah (<a onClick="return mV(\'Gen\',22,22);">Ge 22:22</a>); was probably the father of the Casdim. The early Babylonian form Kasdu appears in Assyrian as Kaldu or Kaldu. English Versions of the Bible follows the Assyrian and Greek style of writing the name and uses Chaldees or Chaldeans instead of Casdim. The Chaldeans dwelt in the lower valley of the Euphrates, at the head of the Persian Gulf. Abram came from Ur of the Chaldees (<a onClick="return mV(\'Gen\',11,28,31);">Ge 11:28, 31</a>; <a onClick="return mV(\'Gen\',15,7);">15:7</a>; <a onClick="return mV(\'Neh\',9,7);">Ne 9:7</a>). In <a onClick="return mV(\'Job\',1,17);">Job 1:17</a> the Casdim are described as invading the land of Uz, the eldest brother of Chesed (<a onClick="return mV(\'Gen\',22,21,22);">Ge 22:21-22</a>). In the days of Nebuchadrezzar the Casdim overran Syria and Palestine and carried the people of Judah in successive deportations into captivity (<a onClick="return mV(\'2Ki\',24,\'1-10\');">2Ki 24:1-10</a>; <a onClick="return mV(\'2Ki\',25,1);">25:1</a>ff). In <a onClick="return mV(\'Dan\',2,2,5);">Da 2:2, 5</a> the Casdim are named with the magicians and astrologers as a learned class, skilled in interpretations. Casdim is sometimes used in Hebrew for the land of Chaldea (<a onClick="return mV(\'Eze\',23,15);">Eze 23:15</a>f; <a onClick="return mV(\'Eze\',11,24);">11:24</a>).``156';
isbe[2029]='Chesil`ke\'-sil, kes\'-il (kecil; A, Chaseir): A town in the extreme south of Judah named with Eltolad, Hormah and Ziklag (<a onClick="return mV(\'Jos\',15,30);">Jos 15:30</a>). The name does not occur again. In <a onClick="return mV(\'Jos\',19,4);">Jos 19:4</a> it is replaced by Bethul (Septuagint Baithel), and in <a onClick="return mV(\'1Ch\',4,30);">1Ch 4:30</a> by Bethuel. "Chesil" may have arisen from a misreading of the text.``1';
isbe[2030]='Chesnut`ches\'-nut.`<a href="./study/isbe/search.html?string=CHESTNUT">CHESTNUT</a>`1';
isbe[2031]='Chest`chest (\'aron, genazim; kibotos):<P>(1) The ark of the covenant in Old Testament is invariably denoted by the word \'aron, elsewhere rendered the King James Version and the Revised Version (British and American) "chest."<P>See <a href="./study/isbe/search.html?string=ARK">ARK</a>.<P>(2) \'Aron is also the word rendered "coffin" (<a onClick="return mV(\'Gen\',50,26);">Ge 50:26</a>: "and he was put in a coffin in E.").<P>See <a href="./study/isbe/search.html?string=COFFIN">COFFIN</a>.<P>(3) In Kings and Chronicles (<a onClick="return mV(\'2Ki\',12,9,10);">2Ki 12:9-10</a>; <a onClick="return mV(\'2Ch\',24,8,10,11);">2Ch 24:8, 10-11</a>) \'aron stands uniformly for a money chest. It is the "chest" that Jehoiada, the priest, placed in the court "beside the altar" and "bored a hole in the lid of" that the priests might "put therein all the money that was brought into the house of Yahweh" (<a onClick="return mV(\'2Ki\',12,9);">2Ki 12:9</a>); and "the chest" that King Joash commanded to be made and set "without at the gate of the house of Yahweh" to receive "the tax that Moses the servant of God laid upon Israel" (<a onClick="return mV(\'2Ch\',24,8,10,11);">2Ch 24:8, 10-11</a>). One feature is common to the thing meant in all these applications—the chest was rectangular in shape, and, most probably in every instance, made of wood.<P>(4) Josephus (Ant., VI, 1,2) uses the equivalent of the word to denote the "coffer" (<a onClick="return mV(\'1Sa\',6,8);">1Sa 6:8</a>ff English Versions), or small chest, in which the princes of Philistia deposited the gold mice.<P>(5) In New Testament times the "chests" that were provided in the court of the women, in the temple of Herod, to receive the various kinds of money gifts had the exceptional shape of a trumpet (if Sheqalim, vi.5 may be trusted)—wide at the bottom and gradually narrowing toward the top, hence, called shopharoth. It was into these that the Master was watching the multitude casting in their money when He saw the poor widow cast in her two mites (<a onClick="return mV(\'Mar\',12,41,42);">Mr 12:41-42</a>).<P>(6) In <a onClick="return mV(\'Eze\',27,24);">Eze 27:24</a>, where the prophet is giving an inventory of the merchandise of Tyre, another word entirely is used (genazim), and it is rendered in the King James Version and the Revised Version (British and American) "chests" ("chests of rich apparel, bound with cords and made of cedar"). According to Cornill, Davidson, Smend and others this rendering is without sufficient support (see Smith, Dictionary of the Bible and commentary in the place cited.).``47';
isbe[2032]='Chestnut, Tree`ches\'-nut.`<a href="./study/isbe/search.html?string=PLANE+TREE">PLANE TREE</a>`1';
isbe[2033]='Chesulloth`ke-sul\'-oth (ha-keculloth; B, Chasaloth, A, Achesaloth): A town on the border of Zebulun (<a onClick="return mV(\'Jos\',19,18);">Jos 19:18</a>), the same as Chisloth-tabor (<a onClick="return mV(\'Jos\',19,12);">Jos 19:12</a>). It is represented by the modern village Iksal on the northern edge of Esdraelon, circa 3 miles west of Mt. Tabor.``1';
isbe[2034]='Cheth`khath.`<a href="./study/isbe/search.html?string=CHETH">CHETH</a>`1';
isbe[2035]='Chettiim`ket\'-i-im, ket-i\'-im (kittim).`<a href="./study/isbe/search.html?string=KITTIM">KITTIM</a>`1';
isbe[2036]='Chew; Cud`choo, chu, (ma\'aleh gerah, literally "bringing up" (American Revised Versions margin), i.e. "chewing the cud," from garar, "to roll," "ruminate"): One of the marks of cleanliness, in the sense of fitness for food, of a quadruped, given in <a onClick="return mV(\'Lev\',11,3);">Le 11:3</a> and <a onClick="return mV(\'Deu\',14,6);">De 14:6</a>, is the chewing of the cud. Among the animals considered clean are therefore included the ox, the sheep, the goat, the hart, the gazelle, the roebuck, the wild goat, the pygarg, the antelope and the chamois. Several of the forbidden animals are expressly named in the passages, e.g. the camel, the rock-badger, the hare and the swine. In addition to the distinctions between clean and unclean animals mentioned in the Bible, the Talmud points out that the clean animals have no upper teeth, that their horns are either forked, or if not forked they are clear of splinters, notched with scales and round, and that certain portions of the meat of clean animals tear lengthwise as well as across. Many theories have been advanced as to the reasons for the distinctions with regard to the chewing of the cud and the cloven hoof. See the Jewish Encyclopedia under the word "Clean." The most obvious is that ruminating animals and animals without claws were apparently cleaner-feeding animals than the others.``81';
isbe[2037]='Chezib`ke\'-zib.`<a href="./study/isbe/search.html?string=ACHZIB">ACHZIB</a>`1';
isbe[2038]='Chicken`chik\'-\'-n, chik\'-in (Anglo-Saxon, cicen or cycen; Latin, Gallus ferrugineus; alektruon, masculine and fem.): A barnyard fowl of any age. The record is to be found in the books of the disciples, but Jesus is responsible for the only direct mention of chickens in the Bible. <a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>, contains this: "O Jerusalem, Jerusalem, that killeth the prophets, and stoneth them that are sent unto her! how often would I have gathered thy children together, even as a hen gathereth her chickens under her wings, and ye would not!" Luke\'s version of the same scene says: "Even as a hen gathereth her own brood under her wings" (<a onClick="return mV(\'Luk\',13,34);">Lu 13:34</a>). There is no reference to chickens in the Old Testament sufficiently clear to specify our common domestic bird. The many references to "fatted fowl" in these older records, in accordance with the text and the history of the other nations, were pigeons, guineas, ducks, geese and swans. The importation of peafowl by Solomon is mentioned. The cock and hen are distinctive birds and would have been equally a marvel worth recording had they been introduced at that time. From the history of the bird in other countries it is a safe estimate to place their entrance into Palestine between five and six hundred years BC. That would allow sufficient time for them to increase and spread until they would be well known and common enough to be used effectively in the ministry of Jesus Christ. Every historical fact and indication points to the capture and domestication of the red jungle fowl in Burma. The Chinese records prove that they first secured imported fowl from the West in 1400 BC. Their use for food dated from 1200 to 800 BC, in the Book of Manu, but it was specified that only those that ran wild were to be eaten. From these countries they were imported to Greece and Italy, and from there carried south into Palestine Homer ([?] 10; compare also alektruon, P 602) names a man Cock, alektor, which seems to indicate that he knew the bird. Pindar gives them slight mention; Aristophanes wrote of them as "Persian birds," which indicates that they worked their way westward by importation. I cannot find them in the records of Aristotle, but Aristophanes advanced the idea that not the gods, but the birds were rulers of men in ancient times, and compared the comb of the cock with the crown of a king, and pointed out that when he "merely crows at dawn all jump up to their work" (Aves, 489-90). They were common in Italy in the days of Pliny, who was ten years old at the time of the crucifixion of Christ. Pliny gave many rules for raising chickens, proving that much was known of their habits in his time. Yet so credulous was he and so saturated with superstition, that, mixed with his instructions for preserving eggs, brooding and raising chickens, is the statement that on account of the fighting power of the cocks the lions feared them. He wrote that a man named Galerius in the time of the consuls, Lepidus and Catulus, owned a barnyard fowl that spoke. He names Lenius Strabo as the first man to devise a "coupe" to keep fowl in and "cram" them to fatness. He gave the laws governing the use of fowl at table and recorded that in Egypt eggs were hatched in manure beds, which is conclusive proof that birds had been carried across the Mediterranean several centuries previous. The records of Babylon, 600 BC, contain figures undoubtedly intended for cocks, and they were reproduced in marble in Lycia at that time, In all these reproductions the birds have the drooping tail of the wild, and there is no record of the date at which they erected the tail, lifted the head and assumed the upright bearing of today.``167';
isbe[2039]='Chide`chid: Only in the Old Testament, translating Hebrew ribh, a word which is more frequently rendered "strive." Since in <a onClick="return mV(\'Gen\',31,36);">Ge 31:36</a>; <a onClick="return mV(\'Jdg\',8,1);">Jud 8:1</a>; <a onClick="return mV(\'Psa\',103,9);">Ps 103:9</a>, the strife is one of words, it means in these passages, "scold," or "sharply censure," and is applied either to mutinous protests and reproaches of inferiors to a superior, or, as in the last of these passages, to rebukes administered by a superior to inferiors.``1';
isbe[2040]='Chidon, the Threshing-Floor of`ki\'-don, (goren kidhon; Septuagint B, omits; A has Cheilo): The place where Uzza perished because he touched the ark (<a onClick="return mV(\'1Ch\',13,9);">1Ch 13:9</a>). In <a onClick="return mV(\'2Sa\',6,6);">2Sa 6:6</a> it is called the threshing-floor of Nachon. No name resembling either of these has been discovered.``1';
isbe[2041]='Chief`chef: The English word is in the King James Version of Old Testament the translation of some 17 different Hebrew words, most frequently of ro\'sh, "head," sar, "prince," and re\'shith, "beginning." The principal changes made by the Revised Version (British and American) are:<P>(1) Hebrew beth\'abh, "house of a father," being recognized as a technical term denoting a subdivision of a tribe, ro\'sh is rendered literally "head," when it occurs in connection with this phrase, so that "chief fathers" (<a onClick="return mV(\'Num\',31,26);">Num 31:26</a>) and "chief of the fathers" (<a onClick="return mV(\'Ezr\',1,5);">Ezr 1:5</a>) become "heads of fathers\' houses";<P>(2) Hebrew naghidh and nasi\' are more accurately translated "prince" in such passages as <a onClick="return mV(\'1Ch\',5,2);">1Ch 5:2</a>; <a onClick="return mV(\'Num\',3,32);">Nu 3:32</a>;<P>(3) the misinterpretations which brought about the translation "chief" for \'atsilim, "corners," <a onClick="return mV(\'Isa\',41,9);">Isa 41:9</a>, and for ma\'aleh, "ascent," in <a onClick="return mV(\'2Ch\',32,33);">2Ch 32:33</a>, are corrected.<P>In the New Testament "chief" is in most of its appearances the translation of Greek protos, "first"; the Revised Version (British and American) reads "first" for the King James Version "chief," "chiefest," in <a onClick="return mV(\'Mat\',20,27);">Mt 20:27</a>; <a onClick="return mV(\'Mar\',10,44);">Mr 10:44</a>; <a onClick="return mV(\'Act\',16,12);">Ac 16:12</a>. The reading in the latter passage is a difficult one, but the King James Version "Philippi, which is the chief city of that part of Macedonia," seems to imply a political authority which Philippi did not possess; the Revised Version (British and American) "a city of Macedonia, the first of the district." Greek archon, "prince," "ruler," is rendered by the King James Version "chief," by the Revised Version (British and American) "prince," in <a onClick="return mV(\'Luk\',11,15);">Lu 11:15</a>; the King James Version "chief Pharisees," the Revised Version (British and American) "rulers of the Pharisees," in <a onClick="return mV(\'Luk\',14,1);">Lu 14:1</a>.<P>The original meaning of "chief" having been weakened, the comparative and superlative were admitted into English, the latter only appearing in the King James Version or the Revised Version: <a onClick="return mV(\'1Sa\',2,29);">1Sa 2:29</a>; <a onClick="return mV(\'Sgs\',5,10);">So 5:10</a>; <a onClick="return mV(\'2Cr\',11,5);">2Co 11:5</a>, etc. On "chief of Asia" (<a onClick="return mV(\'Act\',19,31);">Ac 19:31</a> the King James Version)`<a href="./study/isbe/search.html?string=ASIARCH">ASIARCH</a>`1';
isbe[2042]='Chief Friends; Good Men``<a href="./study/isbe/search.html?string=CHIEF+FRIENDS">CHIEF FRIENDS</a>; <a href="./study/isbe/search.html?string=GOOD,+CHIEF">GOOD, CHIEF</a>; <a href="./study/isbe/search.html?string=CHIEF">CHIEF</a>`1';
isbe[2043]='Chief Musician`mu-zish\'-an.`<a href="./study/isbe/search.html?string=ASAPH">ASAPH</a>`1';
isbe[2044]='Chief Seats`chef sets (protokathedria): It was one of the reproaches urged by our Lord against the scribes and Pharisees that they loved the chief seats in the synagogues (<a onClick="return mV(\'Mat\',23,6);">Mt 23:6</a>; <a onClick="return mV(\'Mar\',12,39);">Mr 12:39</a>; <a onClick="return mV(\'Luk\',11,43);">Lu 11:43</a>; <a onClick="return mV(\'Luk\',20,46);">20:46</a>). These were special seats set in front of the ark containing the Scriptures and of the reader\'s platform, and facing the congregation. They were specially reserved for those who were held in the highest honor in the congregation. There were seventy-one such seats in the great synagogue of Alexandria, which were occupied by the members of the great Council in that city (see <a href="./study/isbe/search.html?string=SYNAGOGUE">SYNAGOGUE</a>).``195';
isbe[2045]='Child-Bearing`child\'-bar-ing: Only in <a onClick="return mV(\'1Ti\',2,15);">1Ti 2:15</a>: "She shall be saved through her (m "the") child-bearing" (dia tes teknogonias). The reference is to the calling of woman as wife and mother, as her ordinary lot in life, and to the anxieties, pains and perils of maternity, as the culmination and representation of the penalties woman has incurred because of the Fall (<a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>). "She shall be saved by keeping faithfully and simply to her allotted sphere as wife and mother" (Dummelow). The preposition dia is not used here instrumentally, as though child-bearing were a means of her salvation, but locally, as in <a onClick="return mV(\'1Cr\',3,15);">1Co 3:15</a>, "saved so as through fire," where life is saved by rushing through the flames. The explanation by reference to the incarnation, with an appeal to <a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>, favored by Ellicott and others, seems very mechanical.``84';
isbe[2046]='Child; Children`child, chil\'-dren (ben, "son," yeledh, "child" na\'ar, "lad"; teknon, paidion): The Hebrews regarded the presence of children in the family as a mark of Divine favor and greatly to be desired (<a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a>; <a onClick="return mV(\'Gen\',30,1);">30:1</a>; <a onClick="return mV(\'1Sa\',1,11,20);">1Sa 1:11, 20</a>; <a onClick="return mV(\'Psa\',127,3);">Ps 127:3</a>; <a onClick="return mV(\'Luk\',1,7,28);">Lu 1:7, 28</a>). The birth of a male child was especially a cause for rejoicing (<a onClick="return mV(\'Psa\',128,3);">Ps 128:3</a>, Hebrew); more men, more defenders for the tribe. If there were no sons born to a household, that family or branch became lost. If the wife proved childless, other wife or wives might be added to the family (<a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a>f). Further, each Jewish mother, at least in later times, hoped that her son might prove to be the Messiah. The custom of Levirate marriage, which was not limited to the Hebrew people, rested on the principle that if a man died childless his brother should marry his widow, the children of such union being considered as belonging to the brother whose name and line were thus preserved from extinction (<a onClick="return mV(\'Deu\',25,5);">De 25:5</a>; <a onClick="return mV(\'Gen\',38,26);">Ge 38:26</a>; <a onClick="return mV(\'Mat\',22,24);">Mt 22:24</a>).<P>Children were sometimes dedicated to God, even before their birth (<a onClick="return mV(\'1Sa\',1,11);">1Sa 1:11</a>). Names often were significant: Moses (<a onClick="return mV(\'Exd\',2,10);">Ex 2:10</a>); Samuel (<a onClick="return mV(\'1Sa\',1,20);">1Sa 1:20</a>); Ichabod (<a onClick="return mV(\'1Sa\',4,21);">1Sa 4:21</a>; compare <a onClick="return mV(\'Gen\',30,\'1-\');">Ge 30</a>) (see <a href="./study/isbe/search.html?string=PROPER+NAMES">PROPER NAMES</a>). The firstborn son belonged to God (<a onClick="return mV(\'Num\',3,44);">Nu 3:44</a>ff). The ceremony of redeeming the firstborn occurred on the thirtieth day. Friends of the family were invited to a feast, the rabbi also being present. The child was placed in the hands of the priest. The father carried some gold or silver in a cup or vessel. The priest asked the mother whether this was her firstborn, and, on being answered in the affirmative, claimed the child as Yahweh\'s. The father offered the redemption money, which was accepted in exchange for the child (compare <a onClick="return mV(\'1Pe\',1,18);">1Pe 1:18</a>). See <a href="./study/isbe/search.html?string=FIRSTBORN">FIRSTBORN</a>. Other stages in the life of the child were celebrated with fitting ceremonies. In the fourth year, in Palestine, on the second day of the Passover occurred the ceremony of the first cutting of the boy\'s hair, the friends sharing the privilege. Sometimes, as in the case of the wealthy, the weight of the child in currency was given as a donation to the poor. In common with the custom of other eastern peoples, male children were circumcised (<a onClick="return mV(\'Gen\',17,12);">Ge 17:12</a>), the rite being performed on the eighth day.<P>Early education was cared for in the home, the children growing up more or less with the mother (<a onClick="return mV(\'Pro\',6,20);">Pr 6:20</a>; <a onClick="return mV(\'Pro\',31,1);">31:1</a>; <a onClick="return mV(\'2Ti\',1,5);">2Ti 1:5</a>; <a onClick="return mV(\'2Ti\',3,14,15);">3:14-15</a>), and the girl continuing with her mother until her marriage. In wealthier families tutors were employed (<a onClick="return mV(\'1Ch\',27,32);">1Ch 27:32</a>). Schools for children are first mentioned by Josephus (Ant., XV, x, 5). According to the Talmud the first school for children was established about 100 BC, but in the time of Jesus such schools were common. Children were taught to read and to write even in families of moderate means, these arts being widely diffused as early as 600 BC, if not earlier (<a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>; <a onClick="return mV(\'Isa\',10,19);">10:19</a>). Great stress was laid on the Torah, i.e. the law of Moses. Boys were trained also in farming, the tending of cattle, and in the trades. The religious training of the boy began in his fourth year, as soon as he could speak distinctly. The religious life of the girl also began early. In later times at least children took part in the Sabbath and Passover festivals and boys attended synagogue and school regularly.<P>Children were subject to the father (<a onClick="return mV(\'Neh\',5,5);">Ne 5:5</a> marks the extreme), who in turn was bound to protect them, though he himself had the power of life and death (<a onClick="return mV(\'Lev\',18,21);">Le 18:21</a>; <a onClick="return mV(\'Lev\',20,2);">20:2</a>ff). Respect for and obedience to parents were stoutly upheld by public opinion (<a onClick="return mV(\'Exd\',20,12);">Ex 20:12</a>; <a onClick="return mV(\'Deu\',5,16);">De 5:16</a>; compare <a onClick="return mV(\'Pro\',6,20);">Pr 6:20</a>; <a onClick="return mV(\'Mic\',7,6);">Mic 7:6</a>; <a onClick="return mV(\'Deu\',21,\'18-21\');">De 21:18-21</a>; <a onClick="return mV(\'Exd\',21,15);">Ex 21:15</a>).<P>Both the Old Testament and New Testament afford abundant evidence of the strength of the bond that bound the Hebrew family together (<a onClick="return mV(\'Gen\',21,16);">Ge 21:16</a>; <a onClick="return mV(\'2Sa\',18,33);">2Sa 18:33</a>; <a onClick="return mV(\'1Ki\',3,23);">1Ki 3:23</a>ff; <a onClick="return mV(\'2Ki\',4,19);">2Ki 4:19</a>; <a onClick="return mV(\'Isa\',8,4);">Isa 8:4</a>; <a onClick="return mV(\'Job\',29,5);">Job 29:5</a>; <a onClick="return mV(\'Mat\',19,13);">Mt 19:13</a>; <a onClick="return mV(\'Mat\',20,20);">20:20</a>; <a onClick="return mV(\'Mar\',9,24);">Mr 9:24</a>; <a onClick="return mV(\'Luk\',2,48);">Lu 2:48</a>; <a onClick="return mV(\'Jhn\',4,47);">Joh 4:47</a>; <a onClick="return mV(\'Hbr\',2,13);">Heb 2:13</a>; <a onClick="return mV(\'Hbr\',11,23);">11:23</a>). The gift of a son from Yahweh was the height of joy; the loss of a child marked the depth of woe. A hint occurs in the custom of naming a man as the father of his firstborn son (Hastings Dictionary of the Bible, I, 382), or even the use of the father\'s name as a surname (Bar-jonah, Bartimeus) and such continues in Syria at the present day. This idea is further instanced in the use, in both Old Testament and New Testament, of the terms to express the relation between God and men (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>; <a onClick="return mV(\'Deu\',14,1);">De 14:1</a>; <a onClick="return mV(\'Deu\',32,6);">32:6</a>; <a onClick="return mV(\'Jer\',3,4);">Jer 3:4</a>; <a onClick="return mV(\'Zec\',12,10);">Zec 12:10</a>; <a onClick="return mV(\'Mal\',1,6);">Mal 1:6</a>).<P>See also <a href="./study/isbe/search.html?string=FAMILY+RELATIONSHIPS">FAMILY RELATIONSHIPS</a>; <a href="./study/isbe/search.html?string=SONS">SONS</a>.<P>LITERATURE. Benzinger, Hebraische Archaologie, 2nd edition,1907,112-23; for rabbinical lore, Friedenberg in Jewish Encyclopedia, IV, 27 f.<P>W. N. Stearns<P>Figurative: Child is the English Versions of the Bible rendering of the Greek teknon. The corresponding Hebrew words (ben, and yeledh), are usually translated "son," but they have practically the same significance in the figurative use of the term. Child is used figuratively to describe:<P>(1) An affectionate greeting. Jesus addressed the sick of the palsy as "child" (<a onClick="return mV(\'Mar\',2,5);">Mr 2:5</a> the Revised Version, margin).<P>(2) The disciples, or followers, of a teacher. Jesus addressed His disciples as children (<a onClick="return mV(\'Mar\',10,24);">Mr 10:24</a>). Paul referred to Timothy as his child (<a onClick="return mV(\'1Ti\',1,2);">1Ti 1:2</a>), and also to Onesimus (<a onClick="return mV(\'Phm\',1,10);">Phm 1:10</a>). John also designated the disciples to whom he was writing as his children (<a onClick="return mV(\'2Jo\',1,4);">2Jo 1:4</a>). The same use of "children" or "sons" is common in the Old Testament (see <a onClick="return mV(\'1Ki\',20,35);">1Ki 20:35</a>; <a onClick="return mV(\'2Ki\',2,3,5,7);">2Ki 2:3, 5, 7</a>; <a onClick="return mV(\'2Ki\',4,38);">4:38</a>). As a term of special endearment, disciples are sometimes called "little children" (teknia). Jesus thus addressed His disciples when He was speaking about His departure (<a onClick="return mV(\'Jhn\',13,33);">Joh 13:33</a>). Paul thus addressed the Galatians (<a onClick="return mV(\'Gal\',4,19);">Ga 4:19</a>), and that was a favorite expression with John (see <a onClick="return mV(\'1Jo\',2,1);">1Jo 2:1</a>; <a onClick="return mV(\'1Jo\',4,4);">4:4</a>; <a onClick="return mV(\'1Jo\',5,21);">5:21</a>). A term that was even more endearing was paidia, which means "little ones" or "babes." Jesus used this term once in addressing His disciples after His resurrection (<a onClick="return mV(\'Jhn\',21,5);">Joh 21:5</a>), and John also used this term occasionally in saluting those to whom he was writing (<a onClick="return mV(\'1Jo\',2,18);">1Jo 2:18</a>).<P>(3) Those who belong to God. Children of God is a common expression in both the Old Testament and the New Testament. It is based on the relation between parents and children, and in general describes God\'s affection for His own, and their dependence upon Him, and moral likeness to Him. The term is sometimes used of those who are disloyal to God, and they are designated as "rebellious children" (see <a onClick="return mV(\'Isa\',30,1);">Isa 30:1</a>).<P>See <a href="./study/isbe/search.html?string=CHILDREN+OF+GOD">CHILDREN OF GOD</a>.<P>(4) Those who belong to the devil. Those who are like the devil in thought and action are designated as "children of the devil" (<a onClick="return mV(\'1Jo\',3,10);">1Jo 3:10</a>).<P>(5) One\'s relation to something to which he belongs, or by which he is dominated in his affection for it. Thus we have:<P>(a) the children of a city or country (see <a onClick="return mV(\'Jer\',2,16);">Jer 2:16</a>; <a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>), and this designates those who belong to that particular city or country;<P>(b) children of wisdom (<a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a> the King James Version; <a onClick="return mV(\'Luk\',7,35);">Lu 7:35</a>), and these are the ones whose lives are dominated by wisdom. Westcott and Hort, The New Testament in Greek adopted ergon for teknon in <a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a>, but this seems to be without any good reason;<P>(c) children of obedience (<a onClick="return mV(\'1Pe\',1,14);">1Pe 1:14</a>), and these are the ones who are eager to obey;<P>(d) children of light (<a onClick="return mV(\'Eph\',5,8);">Eph 5:8</a>), and this designates those whose souls are illumined by the light.<P>(6) Those who are liable to some particular fate. Thus, we have<P>(a) children of cursing, or those who are exposed to cursing (<a onClick="return mV(\'2Pe\',2,14);">2Pe 2:14</a>), and<P>(b) children of wrath or those who are exposed to wrath (<a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>).<P>(7) Moral likeness or spiritual kinship (<a onClick="return mV(\'Gal\',3,7);">Ga 3:7</a> the King James Version; compare <a onClick="return mV(\'Jhn\',8,39);">Joh 8:39</a>; "the children of Abraham"). See secs. (3), (4).``62';
isbe[2047]='Childhood, Gospels of the`child\'-hood.`<a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>`1';
isbe[2048]='Children of Eden`e\'-d\'-n (bene \'edhen): In <a onClick="return mV(\'2Ki\',19,12);">2Ki 19:12</a>; <a onClick="return mV(\'Isa\',37,12);">Isa 37:12</a> "the children of Eden that were in Telassar" are mentioned in connection with "Gozan, and Haran, and Rezeph" as having been destroyed by the Assyrians who were before the time of Sennacherib. The expression, "the children of Eden that were in Telassar," undoubtedly referred to a tribe which inhabited a region of which Telassar was the center. Telassar means "the hill of Asshur" and, according to Schrader, it was a name that might have been given to any place where a temple had been built to Asshur. Inasmuch as Gozan, and Haran, and Rezeph were in Mesopotamia it would seem probable that "the children of Eden that were in Telassar" belonged to the same locality. The "children of Eden" is quite probably to be identified with the Bit \'Adini of the inscriptions and this referred to a district on the middle Euphrates. According to the inscriptions Gozan, Haran, Rezeph, and Bit \'Adini were destroyed by Sennacherib\'s forefathers, and this is in accord with the account in 2 Kings and Isaiah.<P>The "Eden" of <a onClick="return mV(\'Eze\',27,23);">Eze 27:23</a> is usually taken as the name of a place in Mesopotamia with which Tyre had commercial relations, and probably belongs to the region of "the chilrden of Eden," discussed above.<P>Some writers think the "Beth-eden" of <a onClick="return mV(\'Amo\',1,5);">Am 1:5</a> the Revised Version, margin (the American Standard Revised Version "Aven") is to be identified with the Bit \'Adini of the inscriptions and hence, with "the children of Eden," but this is doubtful. This was perhaps in Syria in the neighborhood of Damascus.``62';
isbe[2049]='Children of God`Introduction: Meaning of Terms<P><b>I. OLD TESTAMENT TEACHING</b><P class="in15">1. Mythological Survivals<P class="in15">2. Created Sonship<P class="in15">3. Israel\'s Collective Covenant Sonship<P class="in15">4. Individual and Personal Relation<P class="in15">5. Universalizing the Idea<P><b>II. NEW TESTAMENT TEACHING</b><P class="in15">1. Physical and Limited Sonship Disappears<P class="in15">2. As Religious Experience, or Psychological Fact<P class="in30">(1) Filial Consciousness of Jesus<P class="in30">(2) Communicated to Men<P class="in15">3. As Moral Condition, or Ethical Fact<P class="in15">4. As State of Being, or Ontological Fact<P class="in30">(1) Essence of Christ\'s Sonship<P class="in30">(2) Men\'s Sonship<P class="in15">5. As Relation to God, or Theological Fact<P class="in30">(1) Eternal Generation<P class="in30">(2) The Work of Grace<P><hr />Introduction: Meaning of Terms:<P>Children (Sons and Daughters) of God (bene and benoth \'elohim, literally "sons and daughters of God"; tekna theou, and huioi theou): so the King James Version; but the Revised Version (British and American) translates the latter Greek phrase more accurately "sons of God." Tekna contains the idea of origin or descent, but also that of personal relation, and is often used metaphorically of "that intimate and reciprocal relationship formed between men by the bonds of love, friendship, trust, just as between parents and children" (Grimm-Thayer). Huioi, too, conveys the ideas of origin, and of personal relation, but the latter in the fuller form in which it appears in mature age. "The difference between huios and teknon appears to be that whereas teknon denotes the natural relationship of child to parent, huios implies in addition to this the recognized status and legal privileges reserved for sons" (Sanday and Headlam, on <a onClick="return mV(\'Rom\',8,14);">Ro 8:14</a>). This difference obtains, however, only in a very general sense.<P>The above phrases denote the relation in which men are conceived to stand to God, either as deriving their being from Him and depending upon Him, or as standing in that personal relation of intimate trust and love toward Him which constitutes the psychological fact of sonship. The exact significance of the expression depends upon the conception of God, and particularly of His Fatherhood, to which it corresponds. It therefore attains to its full significance only in the New Testament, and its meaning in the Old Testament differs considerably, even though it marks stages of development up to the New Testament idea.<P>I. Old Testament Teaching.<P>The most primitive form of the idea appears in <a onClick="return mV(\'Gen\',6,\'1-4\');">Ge 6:1-4</a>, where the sons of God by marrying the fair daughters of men become the fathers of the giants.<P>1. Mythological Survivals:<P>These were a subordinate order of Divine beings or demi-gods, and the title here may mean no more, although it was probably a survival of an earlier idea of the actual descent of these gods from a higher God. The idea of a heavenly court where the sons of God come to present themselves before Yahweh is found in quite late literature (<a onClick="return mV(\'Job\',1,6);">Job 1:6</a>; <a onClick="return mV(\'Job\',2,1);">2:1</a>; <a onClick="return mV(\'Job\',38,7);">38:7</a>; <a onClick="return mV(\'Psa\',29,1);">Ps 29:1</a>; <a onClick="return mV(\'Psa\',89,6);">89:6</a>). In all these cases the phrase implies a certain kinship with God and dependence upon Him on the part of the Divine society around Him. But there is no evidence to show whether the idea of descent of gods from God survived to any extent, nor is there any indication of a very close personal relationship. Satan is unsympathetic, if not hostile. In one obviously polytheistic reference, the term implies a similarity of appearance (<a onClick="return mV(\'Dan\',3,25);">Da 3:25</a>). In a secondary sense the titles "gods," and "sons of the Most High" are given to magistrates, as exercising God\'s authority (<a onClick="return mV(\'Psa\',82,6);">Ps 82:6</a>).<P>2. Created Sonship:<P>The idea of creation has taken the place of that of procreation in the Old Testament, but without losing the sense of sonship. "Saith Yahweh, the Holy One of Israel, and his Maker: Ask me...concerning my sons, and concerning the work of my hands" (<a onClick="return mV(\'Isa\',45,11);">Isa 45:11</a>). Israel acknowledges the absolute sovereignty of God as her Father and Maker (<a onClick="return mV(\'Isa\',64,8);">Isa 64:8</a>). Israel\'s Maker is also her Husband, and by inference the Father of her children (<a onClick="return mV(\'Isa\',54,5);">Isa 54:5</a>). Since all Israel has one Father, and one God created her, the tribes owe brotherly conduct to one another (<a onClick="return mV(\'Mal\',2,10);">Mal 2:10</a>). Yahweh upbraids His sons and daughters whom He as their Father bought, made and established. "He forsook God who made him, and lightly esteemed the Rock of his salvation....Of the Rock that begat thee thou art unmindful, and hast forgotten God that gave thee birth" (<a onClick="return mV(\'Deu\',32,6,15,18);">De 32:6, 15, 18</a>ff). These passages reveal the transition from the idea of original creation to that of making and establishing Israel as a nation. All things might be described as children of God if creation alone brought it to pass, but Israel stands in a unique relation to God.<P>3. Israel\'s Collective Covenant Sonship:<P>The covenant relation of God with Israel as a nation is the chief form in which man\'s sonship and God\'s fatherhood appear in the Old Testament. "Israel is my son, my firstborn" (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>); "When Israel was a child, then I loved him, and called my son out of Egypt" (<a onClick="return mV(\'Hsa\',11,1);">Ho 11:1</a>). And to be children of God involves the obligation to be a holy people (<a onClick="return mV(\'Deu\',14,1,2);">De 14:1-2</a>). But Israel has proved unworthy of her status: "I...have brought up children, and they have rebelled against me" (<a onClick="return mV(\'Isa\',1,2,4);">Isa 1:2, 4</a>; <a onClick="return mV(\'Isa\',30,1,9);">30:1, 9</a>). Yet He will have pity upon them: "for I am a father to Israel, and Ephraim is my firstborn" (<a onClick="return mV(\'Jer\',31,9,20);">Jer 31:9, 20</a>). Israel\'s unworthiness does not abolish the relation on God\'s side; she can therefore return to Him again and submit to His will (<a onClick="return mV(\'Isa\',63,16);">Isa 63:16</a>; <a onClick="return mV(\'Isa\',64,8);">64:8</a>); and His pity exceeds a mother\'s love (<a onClick="return mV(\'Isa\',49,15);">Isa 49:15</a>). The filial relation of Israel to God is summed up and symbolized in a special way in the Davidic king: "I will be his father, and he shall be my son" (<a onClick="return mV(\'2Sa\',7,14);">2Sa 7:14</a> = <a onClick="return mV(\'1Ch\',17,13);">1Ch 17:13</a>; compare <a onClick="return mV(\'1Ch\',22,10);">1Ch 22:10</a>; <a onClick="return mV(\'1Ch\',28,6);">28:6</a>; <a onClick="return mV(\'Psa\',2,7);">Ps 2:7</a>).<P>4. Individual and Personal Relation:<P>God\'s fatherhood to collective Israel necessarily tends to develop into a personal relation of father and son between Him and individual members of the nation. The children of Israel, whatever their number, shall be called "the sons of the living God" (<a onClick="return mV(\'Hsa\',1,10);">Ho 1:10</a>). Yahweh\'s marriage relation with Israel as a nation made individual Israelites His children (<a onClick="return mV(\'Hsa\',2,19,20);">Ho 2:19-20</a>; <a onClick="return mV(\'Jer\',3,14,22);">Jer 3:14, 22</a>; compare <a onClick="return mV(\'Isa\',50,1);">Isa 50:1</a>; <a onClick="return mV(\'Eze\',16,20,21);">Eze 16:20-21</a>; <a onClick="return mV(\'Eze\',23,37);">23:37</a>), and God\'s ownership of His children, the individual members of the nation, is asserted (compare <a onClick="return mV(\'Psa\',127,3);">Ps 127:3</a>). Chastisement and pity alike God deals forth as Father to His children (<a onClick="return mV(\'Deu\',1,31);">De 1:31</a>; <a onClick="return mV(\'Deu\',8,5);">8:5</a>; <a onClick="return mV(\'Psa\',103,13);">Ps 103:13</a>), and these are intimate personal relations which can only obtain between individuals.<P>5. Universalizing the Idea:<P>In another direction the idea of God as the father of Israel tends to be modified by the inclusion of the Gentiles. The word "first-born" (in <a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a> and <a onClick="return mV(\'Jer\',31,9,20);">Jer 31:9, 20</a>) may be only an emphatic form of expressing sonship, or it may already suggest the possibility of the adoption of the Gentiles. If that idea is not present in words, it is an easy and legitimate inference from several passages, that Gentiles would be admitted some day into this among the rest of Israel\'s privileges (<a onClick="return mV(\'Isa\',19,25);">Isa 19:25</a>; <a onClick="return mV(\'Isa\',65,1);">65:1</a>; <a onClick="return mV(\'Zec\',14,16);">Zec 14:16</a>).<P>II. New Testament Teaching.<P>1. Physical and Limited Sonship Disappears:<P>As the doctrine of Divine fatherhood attains its full spiritual and moral significance in the New Testament, so does the experience and idea of sonship. All traces of physical descent have disappeared. Paul\'s quotation from a heathen poet: "For we are also his offspring" (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>), whatever its original significance, is introduced by the apostle for the purpose of enforcing the idea of the spiritual kinship of God and men. The phrase "Son of God" applied to Christ by the Roman centurion (<a onClick="return mV(\'Mat\',27,54);">Mt 27:54</a>; <a onClick="return mV(\'Mar\',15,39);">Mr 15:39</a>) may or may not, in his mind, have involved the idea of physical descent, but its utterance was the effect of an impression of similarity to the gods, produced by the exhibition of power attending His death. The idea of creation is assumed in the New Testament, but generally it is not prominent in the idea of sonship. The virgin birth of Jesus, however, may be understood as implying either the creative activity of the Holy Spirit, or the communication of a preexistent Divine being to form a new human personality, but the latter idea also would involve creative activity in the physical realm (compare <a onClick="return mV(\'Luk\',3,38);">Lu 3:38</a>: "Adam (son) of God"). The limitations of the Old Testament conception of sonship as national and collective disappear altogether in the New Testament; God is father of all men, and of every man. In potentiality at least every man and all men are sons of God. The essence of sonship consists in a personal experience and moral likeness which places man in the most intimate union and communion with God.<P>2. As Religious Experience, or Psychological Fact:<P>(1) Filial Conciousness of Jesus.<P>Divine sonship was first realized and made manifest in the consciousness of Jesus (<a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>). For Him it meant unbroken personal knowledge of God and communion with Him, and the sense of His love for Him and of His satisfaction and delight in Him (<a onClick="return mV(\'Mat\',3,17);">Mt 3:17</a>; <a onClick="return mV(\'Mat\',17,5);">17:5</a>; <a onClick="return mV(\'Mar\',1,11);">Mr 1:11</a>; <a onClick="return mV(\'Mar\',9,7);">9:7</a>; <a onClick="return mV(\'Luk\',3,22);">Lu 3:22</a>; <a onClick="return mV(\'Luk\',9,35);">9:35</a>). Whether the "voice out of the heavens saying, This is my beloved Son, in whom I am well pleased" was objective or not, its message always dwelt in the filial consciousness of Jesus. The Father\'s love was to Him a source of knowledge and power (<a onClick="return mV(\'Jhn\',5,20);">Joh 5:20</a>), the reward of His self-sacrifice (<a onClick="return mV(\'Jhn\',10,17);">Joh 10:17</a>) and the inspiration of His love for men (<a onClick="return mV(\'Jhn\',15,9);">Joh 15:9</a>).<P>Sonship meant for Him His Messianic mission (<a onClick="return mV(\'Mat\',16,16,17);">Mt 16:16-17</a>). It involved His dependence on the Father and His obedience to Him (<a onClick="return mV(\'Jhn\',5,19,30);">Joh 5:19, 30</a>; <a onClick="return mV(\'Jhn\',8,29);">8:29</a>), and a resulting confidence in His mission (<a onClick="return mV(\'Jhn\',5,36);">Joh 5:36</a>; <a onClick="return mV(\'Jhn\',10,36,37);">10:36-37</a>). It filled Him with a sense of dignity, power and glory which the Father gave Him, and would yet give in larger measure (<a onClick="return mV(\'Mat\',26,63,64);">Mt 26:63-64</a>; <a onClick="return mV(\'Mat\',16,27);">16:27</a>; <a onClick="return mV(\'Jhn\',17,5);">Joh 17:5</a>).<P>(2) Communicated to Men.<P>Jesus communicated His own experience of God to men (<a onClick="return mV(\'Jhn\',14,9);">Joh 14:9</a>) that they also might know the Father\'s love and dwell in it (<a onClick="return mV(\'Jhn\',17,26);">Joh 17:26</a>). Through Him and through Him alone can they become children of God in fact and in experience (<a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>; <a onClick="return mV(\'Jhn\',14,6);">14:6</a>; <a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>). It is therefore a distinctively Christian experience and always involves a relation of faith in Christ and moral harmony with Him. It differs from His experience in one essential fact, at least in most men. It involves an inner change, a change of feeling and motive, of ideal and attitude, that may be compared to a new birth (<a onClick="return mV(\'Jhn\',3,3);">Joh 3:3</a>). Man must turn and return from disobedience and alienation through repentance to childlike submission (<a onClick="return mV(\'Luk\',15,\'18-20\');">Lu 15:18-20</a>). It is not the submission of slaves, but the submission of sons, in which they have liberty and confidence before God (<a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>), and a heritage from Him for their possession (<a onClick="return mV(\'Gal\',4,6,7);">Ga 4:6-7</a>; <a onClick="return mV(\'Rom\',8,17);">Ro 8:17</a>). It is the liberty of self-realization. As sons they recognize their kinship with God, and share his mind and purpose, so that His commands become their pleasure: "For this is the love of God, that we keep his commandments: and his commandments are not grievous" (<a onClick="return mV(\'1Jo\',5,3);">1Jo 5:3</a>). They have boldness and access to God (<a onClick="return mV(\'Eph\',2,18);">Eph 2:18</a>; <a onClick="return mV(\'Eph\',3,12);">3:12</a>). With this free union of love with God there comes a sense of power, of independence of circumstances, of mastery over the world, and of the possession of all things necessary which become the heirs of God (<a onClick="return mV(\'Mat\',6,26,32);">Mt 6:26, 32</a>; <a onClick="return mV(\'Mat\',7,11);">7:11</a>). "For whatsoever is begotten of God overcometh the world" (<a onClick="return mV(\'1Jo\',5,4);">1Jo 5:4</a>). They learn that the whole course and destiny of creation is for the "revealing of the sons of God" (<a onClick="return mV(\'Rom\',8,19,21);">Ro 8:19, 21</a>).<P>3. As Moral Condition, or Ethical Fact:<P>Christ\'s sonship involved His moral harmony with the Father: "I have kept my Father\'s commandments, and abide in his love" (<a onClick="return mV(\'Jhn\',15,10);">Joh 15:10</a>; <a onClick="return mV(\'Jhn\',8,53);">8:53</a>). He accomplished the work which the Father gave Him to do (<a onClick="return mV(\'Jhn\',17,4);">Joh 17:4</a>; <a onClick="return mV(\'Jhn\',5,19);">5:19</a>), "becoming obedient even unto death, yea, the death of the cross" (<a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>). And sonship makes the same demand upon men. The peacemakers and those who forgive like God are His children (<a onClick="return mV(\'Mat\',5,9,45);">Mt 5:9, 45</a>; <a onClick="return mV(\'Luk\',6,35);">Lu 6:35</a>). "For as many as are led by the Spirit of God, these (and these only) are sons of God" (<a onClick="return mV(\'Rom\',8,14);">
