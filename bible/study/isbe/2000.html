d may properly be, interpreted as indicating the time of the actual sojourn in Egypt, or the time from the entrance of Abraham into Canaan to the Exodus. Modern archaeological discoveries and the logical conclusions from them, our better knowledge of the history and conditions of contemporaneous Egypt, the shortening of the Hyksos period, as by Meyer, Mahler and Breasted, and the acceptance of a later date for Hammurabi, all seem to favor the shorter, or 215-year, view of the sojourn. The remaining 215 years cover the period from Jacob\'s descent into Egypt back to the migration of Abraham. The shorter period is adopted here for the reasons alread y given; but by the addition of 215 the dates from the death of Joseph backward may be conformed to theory of the longer period.<P>(3) Accepting the almost universal and well-grounded judgment that the Amraphel of <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a> is the famous Hammurabi of the 1st Babylonian Dynasty, we should have assistance in determining the date of his Biblical contemporary Abraham, if the opinions of scholars about the age of Hammurabi were not so divergent. Goodspeed (Hist Babylonian and Assyrian.) places his reign at 2297-2254 BC; Hommel (art. on "Babylonia," HDB) fixes the probable date at 1772-1717, an astonishing divergence of 500 years, and suggestive of the spend-thrift manner in which chronologists are accustomed to dispose of the past ages of man. The difference in this instance is caused by the disposition of the IId Babylonian Dynasty, Goodspeed making its more than 360 years follow the Hammurabi Dynasty, and adding the years of the two; Hommel on the other hand regarding the IId, or Southern Dynasty as contemporaneous with the Ist, or Northern. But it is more probable that the truth lies between these extremes, since the IId Dynasty must have had some independent standing, and must have ruled alone for a time, in order to secure consideration as a dynasty. This moderate reckoning is now commonly adopted, Breasted placing Hammurabi at 1900 BC, Davis (in DB) about 1975, and Pinches (in Murray\'s Illus. B. Dict.) later than 2000 BC. It is in accord with the Bible numbers, as the following table shows, and does not vary materially from the reckoning of Ussher, which was based upon those numbers. Therefore the age of Hammurabi and Abraham may be considered as about 1900 BC, or 2100, if one estimates the sojourn in Egypt at 430 years. The former is more reasonable. The Tell el- Amarna Letters, preserving correspondence of the 14th and 15th centuries between the Pharaohs of the XVIIIth Dynasty and Palestine and Babylon, by showing the contemporary sovereigns of the empires of the Nile and the Euphrates, contribute confirmation to the Biblical reckoning. It is possible that increased knowledge of the Hittite empire and its dealings with Egypt, Palestine and Babylonian may in the near future contribute further confirmation. The foregoing conclusions may be summarized in the following table:<P>IX. From Abraham to the Creation.<P>One other general period of Old Testament chronology remains for consideration: from the age of Abraham back to the creation of the world, about which in the nature of the case there can be no absolute certainty, and in which there is neither reason nor need for inflexible accuracy. The system, or succession, of numbers in the early chapters of Genesis (<a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> and <a onClick="return mV(\'Gen\',11,\'10-26\');">Ge 11:10-26</a>) has given rise, in the effort to explain these numbers, to several theories.<P>(1) The literal interpretation, the best known advocate of which was Archbishop Ussher (died 1656), whose literal arrangement was introduced into the margin of the King James Version after his death. This theory takes the birth- and death-numbers just as they are, and by addition of the time intervals between the birth of the various patriarchs, together with Adam\'s age at the birth of Seth, shows that 1,656 years elapsed from the Creation to the Flood, and 290 years from the Flood to Abraham\'s birth, accor ding to the Massoretic Text. But it must be apparent at the very outset, that, on the most liberal arrangement of the numbers and the most conservative geological and anthropological estimate, this reckoning is not sufficiently long to satisfy the known facts of the age of the earth, of the life of man upon the earth, and of established historic dates. Even the conservative system of Professor Breasted (Ancient Egypt) places the first certain date of Egyptian history, namely, the introduction of the Sothic calendar, as early as 4241 BC, which is more than two centuries beyond Ussher\'s beginning of the world. Moreover, at that time an astronomical basis of reckoning time was in existence, implying an age of culture already gone before. This difficulty was appreciated by the earliest interpreters, as indicated by the variations of the Samaritan and Septuagint texts, the latter increasing the total of the age about 1,500 years and inserting a new name into the genealogical list of <a onClick="return mV(\'Gen\',11,\'1-\');">Ge 11</a>. An interesting commentary on the literal method is that it make s Noah live until Abraham was seventy years old, and prolongs the life of Shem to within the lifetime of Jacob.<P>(2) A second theory is the dynastic: that the long number of a patriarch\'s lifetime indicates the era during which his house or dynasty prevailed, to be followed by the long number of the next dynasty; e.g. the 930 years of Adam were followed by the 912 of Seth, and so on until the period is stretched to cover thousands of years. But there are evident objections to this view: it does not account for the invariable origin of each succeeding dynasty so near the beginning of its predecessor, and it disregards the manifest plan of the inspired author to narrate the descent of the human race through families and not by eras or empires.<P>(3) By others it has been conjectured that the units of time have been different in the ancient ages of man; that originally the time-unit was the lunar cycle, by which the 969 lunar cycles of Methuselah\'s life really should be reduced to a little more than 80 years of more recent times; and that in the days of Abraham a year measured from equinox to equinox had superseded the lunar time-measurement. It is possible that the Septuagint variations were based upon this idea, since it increased the age at which every father begat a son to at least 162 in the generations before the Flood. But even this expedient would not remove all difficulties from the physical side; nor have we the slightest indication of the points at which these radical changes of the time-units were made. On the contrary the decrease of man\'s years seems to have come by somewhat gradual process, and not by sharp and tremendous breaks.<P>(4) Others have thought to meet the difficulties by suggesting the omission of links in the chain of descent, in accordance with Hebrew custom of omitting inconsequential names from a genealogical list. The omission by Matthew of certain names from his genealogy of Jesus Christ, in order to preserve his symmetrical scheme of fourteens (<a onClick="return mV(\'Mat\',1,8);">Mt 1:8</a>), is an illustration in point. As corroborative of this it might be urged that the Septuagint does insert a name between Arpachshad and Shelah (<a onClick="return mV(\'Gen\',11,12);">Ge 11:12</a>). It may be said confidently that whatever theory of the genealogies before Abraham one may adopt, it is altogether reasonable to suppose that one name, or many, may have been omitted from the line of descent.<P>The dates resulting from the literal and exact interpretation of the genealogical lists of <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a> and <a onClick="return mV(\'Gen\',11,\'1-\');">Ge 11</a> may be tabulated as follows:<P>If the 130 years of Kainan, whom the Septuagint inserts between Shelah and Arpachshad, be added, the date for Adam\'s creation is increased to 4031 BC. The exhibit of this table is most interesting and suggestive. Noah, Shem, Arpachshad, Shelah, Eber, Peleg were contemporaries of Abraham. Shem, Shelah and Eber were living after Jacob\'s birth. Adam, Enoch, Methuselah and Lamech were contemporary; and Methuselah\'s long life came to an end in the year of the Flood.<P>A Suggested Interpretation:<P>These genealogical lists of the early chapters of Genesis appear therefore not to have been given as an exact and exclusive system of chronology; but it is more probable that they were written to present a general, compact, or mere outline statement of the origin, early experience and apostasy of the human race, given without the purpose of recording every possible link in the chain of descent, or every incident in the early racial experience. There are many indications, or suggestions at least, that this is the sensible and Divinely intended interpretation, some of which have been stated: the variant items and summaries of the Massoretic Text, Septuagint and Sam; the frequent omission in Hebrew genealogies of one or more generations, the third, or later, descendant being truly regarded as a son; the age of the world; the comparative antiquity of man; and the more ancient dates disclosed by archaeology. It should be noticed further that the inspired writer gives ten generations from Adam to the Flood, and ten also from the Flood to Abraham, as if by the use of the decimal, or representatively human, number he would indicate to us that he is dealing with comprehensively complete numbers and not with those that are minutely complete, arranging in symbolic form the account of man\'s descent.<P>See <a href="./study/isbe/search.html?string=ANTEDILUVIAN+PATRIARCHS">ANTEDILUVIAN PATRIARCHS</a>.<P>But while the age of man may be greater than the mechanical and exact sum of the Genesis numbers, we should not be deluded into the belief that it is so great as some anthropologists and geologists, who are prodigal of their numbers, would have us think. The numbers of Geneisi are much nearer the facts than these dreary stretches and wastes of time. The formation of the Nile and the Euphrates valleys, which furnished historic man\'s first home, is quite recent, possibly not antedating 7000 BC; the account of the Flood is the record of a great cataclysm which came upon historic man within these millenniums; we have the records of the presence of intelligent man in these fertile and recently formed centers without traces of his origin and development in, and movement from, other homes. Archaeology and ancient history bring civilized man upon us with somewhat of suddenness, well established in homelands of recent formation. Whence came these peoples whose great works and thoughts are found near the beginning of an era so clearly limited by history and geography? If they came from elsewhere and developed tediously, why have they left no trail of their movement and no trace of the evolution? So late as the 3rd millennium BC Mesopotamia was sparsely settled, and Palestine in the first half of the 2nd millennium was still thinly settled. It is a legitimate conclusion, then, that intelligent man\'s life on the earth does not extend far beyond the total of the Bible numbers (see <a href="./study/isbe/search.html?string=ANTEDILUVIANS">ANTEDILUVIANS</a>; <a href="./study/isbe/search.html?string=DELUGE+OF+NOAH">DELUGE OF NOAH</a>). At the same time it is far from necessary to force a literal and exact interpretation on these numbers, which were given rather to trace lineage, keep relationships, show development under the Divine purpose, and fix responsibility, than to mark particular years.<P>LITERATURE.<P>Ussher, Chronologia Sacra; G. Smith, Assyrian Eponym Canon; Maspero, The Dawn of Civilization; The Struggle of the Nations; The Passing of the Empires; Goodspeed, A History of the Babylonians and Assyrians; Breasted, Ancient Egypt; History of Egypt, Mesopotamia and Israel in Hist of World; Hommel, Ancient Hebrew Tradition; L. W. King, Chronology of the Babylonian Kings; Beecher, Dated Events of Old Testament; Auchinloss, Chronology of the Holy Bible; various commentaries; Driver, Book of Genesis; Skinner, Genesis; Moore, Commentary on Judges; G. A. Smith, "Isaiah" in Expositor\'s Bible, etc. Magazines: James Orr, "Assyrian and Hebrew Chronology" in Presbyterian Review, 1889; "Israel and the Exodus" in Expositor, 1897; J. D. Davis. "Chronology of the Divided Kingdom" in Presbyterian and Reformed Review, 1891. Bible Dictionaries: J. D. Davis in Dict. of the Bible, Westminster Press; Hommel, articles on "Assyria" and "Babylonia" in HDB. Of interest also, Franke Parker, Chronology, 1858.``109';
