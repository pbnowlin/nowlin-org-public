isbe = [];

isbe[9401]='Zibiah`zib\'-i-a (tsibhyah, probably "gazelle"): A woman of Beersheba, mother of King Jehoash (Joash) of Judah (<a onClick="return mV(\'2Ki\',12,1);">2Ki 12:1 (Hebrew verse 2)</a>; <a onClick="return mV(\'2Ch\',24,1);">2Ch 24:1</a>. Codex Alexandrinus and Codex Vaticanus have Abia).``1';
isbe[9402]='Zichri`zik\'-ri (zikhri, meaning uncertain):<P>(1) Levites:<P class="in15">(a) grandson of Kohath (<a onClick="return mV(\'Exd\',6,21);">Ex 6:21</a>, where some the King James Version editions read wrongly, "Zithri");<P class="in15">(b) an Asaphite (<a onClick="return mV(\'1Ch\',9,15);">1Ch 9:15</a>), called "Zabdi" in <a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a>, where the Septuagint\'s Codex Alexandrinus has Zechri = Zichri, but the Septuagint\'s Codex Vaticanus other names; see <a href="./study/isbe/search.html?string=ZABDI">ZABDI, (4)</A>;<P class="in15">(c) a descendant of Eliezer (<a onClick="return mV(\'1Ch\',26,25);">1Ch 26:25</a>).<P>(2) Benjamites:<P class="in15">(a) <a onClick="return mV(\'1Ch\',8,19);">1Ch 8:19</a>;<P class="in15">(b) <a onClick="return mV(\'1Ch\',8,23);">1Ch 8:23</a>;<P class="in15">(c) <a onClick="return mV(\'1Ch\',8,27);">1Ch 8:27</a>;<P class="in15">(d) <a onClick="return mV(\'Neh\',11,9);">Ne 11:9</a>.<P>(3) Father of Eliezer, who was one of David\'s tribal princes (<a onClick="return mV(\'1Ch\',27,16);">1Ch 27:16</a>).<P>(4) Father of Amasiah, "who willingly offered himself unto Yahweh" (<a onClick="return mV(\'2Ch\',17,16);">2Ch 17:16</a>).<P>(5) Father of Elishaphat, a captain in Jehoiada\'s time (<a onClick="return mV(\'2Ch\',23,1);">2Ch 23:1</a>).<P>(6) "A mighty man of Ephraim," who when fighting under Pekah slew the son of Ahaz, the king of Judah (<a onClick="return mV(\'2Ch\',28,7);">2Ch 28:7</a>).<P>(7) A priest in the days of Joiakim (<a onClick="return mV(\'Neh\',12,17);">Ne 12:17</a>); the section, <a onClick="return mV(\'Neh\',12,\'14-21\');">Ne 12:14-21</a>, is omitted by the Septuagint\'s Codex Vaticanus with the exception of "of Maluchi" (<a onClick="return mV(\'Neh\',12,14);">12:14</A>); Lucian has Zacharias.``149';
isbe[9403]='Zid-Kijah`zid-ki\'-ja.`<a href="./study/isbe/search.html?string=ZEDEKIAH">ZEDEKIAH</a>`1';
isbe[9404]='Ziddim`zid\'-im (ha-tsiddim; Codex Vaticanus ton Turion; Codex Alexandrinus omits): A fortified city in Naphtali (<a onClick="return mV(\'Jos\',19,35);">Jos 19:35</a>), probably represented by the modern Chattin, about 5 miles northwest of Tiberias, in the opening of the gorge that breaks down seaward north of Qurun Chattin, the traditional Mount of Beatitudes.``1';
isbe[9405]='Zidon; Zidonians`zi\'-don, zi-do\'-ni-anz.`<a href="./study/isbe/search.html?string=SIDON,+SIDONIANS">SIDON, SIDONIANS</a>`1';
isbe[9406]='Zif`zif.`<a href="./study/isbe/search.html?string=ZIV">ZIV</a>`1';
isbe[9407]='Ziha`zi\'-ha (tsicha\', tsicha\' (<a onClick="return mV(\'Neh\',7,46);">Ne 7:46</a>), meaning unknown): An overseer of Nethinim (<a onClick="return mV(\'Neh\',11,21);">Ne 11:21</a>) who are called (<a onClick="return mV(\'Ezr\',2,43);">Ezr 2:43</a>; <a onClick="return mV(\'Neh\',7,46);">Ne 7:46</a>) "the children (or sons) of Ziha." The Septuagint\'s Codex Vaticanus and Alexandrinus omit <a onClick="return mV(\'Neh\',11,20);">Ne 11:20</a>f; the Septuagint has Sial, Lucian Siaau; in <a onClick="return mV(\'Neh\',7,46);">Ne 7:46</a>; the Septuagint Codex Vaticanus Sea; Codex Alexandrinus has Oiaa; Lucian has Soulai; in <a onClick="return mV(\'Ezr\',2,43);">Ezr 2:43</a> the Septuagint\'s Codex Vaticanus has Southia; Codex Alexandrinus has Souaa; Lucian has Souddaei.``1';
isbe[9408]='Ziklag`zik\'-lag (tsiqelagh, tsiqelagh (<a onClick="return mV(\'2Sa\',1,1);">2Sa 1:1</a>), tsiqelagh (<a onClick="return mV(\'1Ch\',12,1,20);">1Ch 12:1,20</a>); usually in the Septuagint Sekelak, or Sikelag): A town assigned (<a onClick="return mV(\'Jos\',19,5);">Jos 19:5</a>; <a onClick="return mV(\'1Ch\',4,30);">1Ch 4:30</a>) to Simeon, but in <a onClick="return mV(\'Jos\',15,31);">Jos 15:31</a> named, between Hornah and Madmannah, as one of the cities of the Negeb of Judah, "toward the border of Edom." It is said (<a onClick="return mV(\'1Sa\',27,6);">1Sa 27:6</a>) to have remained a royal city. In <a onClick="return mV(\'Neh\',11,28);">Ne 11:28</a> it is in the list of towns reinhabited by the returning children of Judah. Its chief associations are with David. Achish the Philistine king of Gath gave it to David as a residence (<a onClick="return mV(\'1Sa\',27,6);">1Sa 27:6</a>f; <a onClick="return mV(\'1Ch\',12,1);">1Ch 12:1,20</a>); it was raided by the Amalekites, on whom David took vengeance and so recovered his property (<a onClick="return mV(\'1Sa\',30,14);">1Sa 30:14,26</a>); here the messenger who came to announce Saul\'s death was slain (<a onClick="return mV(\'2Sa\',1,1);">2Sa 1:1</a>; <a onClick="return mV(\'2Sa\',4,10);">4:10</a>).<P>The site of this important place is not yet fixed with certainty; Conder proposed Zucheilika, a ruin 11 miles south-southeast of Gaza, and 4 miles north of Wady es-Sheri\'a, which may be the "Brook Besor" (<a onClick="return mV(\'1Sa\',30,9,10,21);">1Sa 30:9,10,21</a>); Rowland (1842) proposed \'Asluj, a heap of ruins south of Beersheba and 7 miles to the east of Bered. Neither site is entirely satisfactory. See Williams, Holy City, I, 463-68; BR, II, 201, PEF, 288, Sh XX.``117';
isbe[9409]='Zillah`zil\'-a (tsillah; Sella): One of Lamech\'s wives (<a onClick="return mV(\'Gen\',4,19);">Ge 4:19,22,23</a>). The name is perhaps connected with tsel, "shadow."``1';
isbe[9410]='Zillethai`zil\'-e-thi, zil-e\'-tha-i (tsillethay, meaning uncertain; the King James Version Zilthai):<P>(1) A Benjamite (<a onClick="return mV(\'1Ch\',8,20);">1Ch 8:20</a>).<P>(2) A Manassite who joined David at Ziklag (<a onClick="return mV(\'1Ch\',12,20);">1Ch 12:20</a> (Hebrew verse 21)).``1';
isbe[9411]='Zilpah`zil\'-pa (zilpah, meaning uncertain; Zelpha): The ancestress of Gad and Asher (<a onClick="return mV(\'Gen\',30,10);">Ge 30:10,12</a>; <a onClick="return mV(\'Gen\',35,26);">35:26</a>; <a onClick="return mV(\'Gen\',46,18);">46:18</a>), a slave girl of Leah\'s, given her by Laban (<a onClick="return mV(\'Gen\',29,24);">Ge 29:24</a>; <a onClick="return mV(\'Gen\',30,9);">30:9</a>). In <a onClick="return mV(\'Eze\',48,\'1-\');">Eze 48</a> the Zilpah tribes have the 5th division toward the south of Palestine and the 6th to the north, a slightly more favorable position than that of the Bilhah tribes.``1';
isbe[9412]='Zilthai`zil\'-thi, zil\'-tha-i.`<a href="./study/isbe/search.html?string=ZILLETHAI">ZILLETHAI</a>`1';
isbe[9413]='Zimmah`zim\'-a (zimmah, perhaps "device," "plan"): A Gershonite Levite (<a onClick="return mV(\'1Ch\',6,20);">1Ch 6:20 (Hebrew, verse 5)</a>; also in <a onClick="return mV(\'1Ch\',6,42);">6:42 (Hebrew verse 27)</A>; <a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>). See Curtis, Chronicles, 130, 134ff.``1';
isbe[9414]='Zimran`zim\'-ran (zimran, from zemer, "wild sheep" or "wild goat," the ending -an being gentilic; Skinner, Genesis, 350): Son of Abraham and Keturah (<a onClick="return mV(\'Gen\',25,2);">Ge 25:2</a>; <a onClick="return mV(\'1Ch\',1,32);">1Ch 1:32</a>). The various manuscripts of the Septuagint give the name in different forms, e.g. in Ge A, Zebran; Codex Sinaiticus Zemran; Codex Alexandrinus(1) Zembram; D(sil) Zombran; and Lucian Zemran; in Chronicles, Codex Vaticanus has Zembran, Codex Alexandrinus Zemran, Lucian Zemran (compare Brooke and McLean\'s edition of the Septuagint for Genesis).<P>Hence, some have connected the name with Zabram of Ptol. vi.7,5, west of Mecca; others with the Zamareni of Pliny (Ant. vi.158) in the interior of Arabia; but according to Skinner and E. Meyer (see Gunkel, Gen3, 261) these would be too far south. Curtis (Chronicles, 72) says the name is probably to be identified with the "Zimri" of <a onClick="return mV(\'Jer\',25,25);">Jer 25:25</a>. It would then be the name of a clan, with the mountain sheep or goat as its totem.`<a href="./study/isbe/search.html?string=TOTEMISM">TOTEMISM</a>`149';
isbe[9415]='Zimri (1)`zim\'-ri (zimri, "wild sheep" or "wild goat"; in 1Maccabees, with the King James Version, has Zambri; Codex Sinaiticus has Zambrei):<P>(1) A Simeonite prince (<a onClick="return mV(\'Num\',25,14);">Nu 25:14</a>; 1Macc 2:26), slain by Phinehas, Aaron\'s grandson. <a onClick="return mV(\'Num\',25,\'1-5\');">Nu 25:1-5</a> records how the Israelites, while they were at Shittim, began to consort with Moabite women and "they (i.e. the Moabite women) called the people unto the sacrifices of their gods" (<a onClick="return mV(\'Num\',25,2);">25:2</A>), i.e. as explained by <a onClick="return mV(\'Num\',25,5);">25:5</A> to take part in the immoral rites of the god Baal-peor. Moses is bidden to have the offenders punished. The next paragraph (<a onClick="return mV(\'Num\',25,\'6-9\');">25:6-9</A>) relates how the people engage in public mourning; but while they do this Zimri brings in among his brethren a Midianitess. Phinehas sees this and goes after Zimri into the qubbah, where he slays the two together, and thus the plague is stayed (<a onClick="return mV(\'Num\',25,\'6-9\');">25:6-9</A>).<P>The connection between these two paragraphs is difficult; Moabite women are mentioned in the first, a Midianitess in the second; the plague of <a onClick="return mV(\'Num\',25,8);">Nu 25:8</a>f is not previously referred to, although it seems clear that the plague is the cause of the weeping in <a onClick="return mV(\'Num\',25,6);">25:6</A>. The sequel, <a onClick="return mV(\'Num\',25,\'16-18\');">25:16-18</A>, makes the second paragraph have something to do with Baal-peor. Critics assign <a onClick="return mV(\'Num\',25,\'1-5\');">25:1-5</A> to J-E, <a onClick="return mV(\'Num\',25,\'6-18\');">25:6-18</A> to P.<P>It seems, however, that the two accounts refer to similar circumstances. This is evident if the meaning of qubbah in <a onClick="return mV(\'Num\',25,8);">Nu 25:8</a> be as the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) renders it, lupinar, "a house of ill-repute." The difficulty is that the word only occurs here in the Old Testament, but it has that meaning in New Heb (see Gray, Numbers, 385; BDB, however, translates it "a large vaulted tent." While one narrative says the women were Moabitesses and the other Midianitesses, the latter section presupposes something like the account in the former; and the point is that Zimri, at the very time that the rest of the people publicly mourned because of a plague that was due to their own dealings with foreign women, brought a Midianite woman among the people, possibly to be his wife, for he was a prince or chief, and she was the daughter of a Midianite chief. It may be urged that if this be the case, there was nothing wrong in it; but according to Hebrew ideas there was, and we only need to remember the evil influence of such marriages as those entered into by Solomon, or especially that of Ahab with Jezebel, to see at any rate a Hebrew justification for Zimri\'s death.<P><a onClick="return mV(\'Num\',31,\'1-\');">Numbers 31</a> describes the extermination of the Midianites at the bidding of Moses. All the males are slain by the Israelites (<a onClick="return mV(\'Num\',31,7);">31:7</A>), but the women are spared. Moses is angry at this: "Have ye saved all the women alive? Behold, these caused the children of Israel, through the counsel of Balaam, to commit trespass against Yahweh in the matter of Peor, and so the plague was among the congregation of Yahweh" (<a onClick="return mV(\'Num\',31,15);">31:15</a>f). Here we find, although the chapter is a Midrash (see Gray, Numbers, 417ff), that the Hebrews themselves connected the two events of <a onClick="return mV(\'Num\',25,\'1-\');">Numbers 25</a>, but in addition the name of Balaam is also introduced, as again in <a onClick="return mV(\'Num\',31,8);">31:8</A>, where he is said to have been slain along with the kings of Midian. See further <a onClick="return mV(\'Deu\',4,3);">De 4:3</a>, and Driver\'s note on the verse.<P>See <a href="./study/isbe/search.html?string=BAAL-PEOR">BAAL-PEOR</a>; <a href="./study/isbe/search.html?string=BALAAM">BALAAM</a>; <a href="./study/isbe/search.html?string=PEOR">PEOR</a>.<P>(2) A king of Israel (<a onClick="return mV(\'1Ki\',16,\'8-20\');">1Ki 16:8-20</a>). See special article.<P>(3) A Judahite "son" of Zerah (<a onClick="return mV(\'1Ch\',2,6);">1Ch 2:6</a>) = "Zabdi" of <a onClick="return mV(\'Jos\',7,1);">Jos 7:1,17</a> f.<P>See <a href="./study/isbe/search.html?string=ZABDI">ZABDI</a>, (1).<P>(4) A Benjamite, descendant of King Saul (<a onClick="return mV(\'1Ch\',8,36);">1Ch 8:36</a>; <a onClick="return mV(\'1Ch\',9,42);">9:42</a>).<P>(5) In <a onClick="return mV(\'Jer\',25,25);">Jer 25:25</a>, where "all the kings of Zimri" are mentioned along with those of Arabia (<a onClick="return mV(\'Jer\',25,24);">25:24</A>) and Elam and the Medes. The name is as yet unidentified, although thought to be that of a people called <a href="./study/isbe/search.html?string=ZIMRAN">ZIMRAN</a> (which see) in <a onClick="return mV(\'Gen\',25,2);">Ge 25:2</a>.``149';
isbe[9416]='Zimri (2)`(zimri; Septuagint Zambrei, Zambri): The 5th king of Israel, but who occupied the throne only seven days (<a onClick="return mV(\'1Ki\',16,\'9-20\');">1Ki 16:9-20</a>). Zimri had been captain of half the chariots under Elah, and, as it seems, made use of his position to conspire against his master. The occasion for his crime was furnished by the absence of the army, which, under the direction of Omri, was engaged in the siege of the Philistine town Gibbethon. While Elah was in a drunken debauch in the house of his steward Arza, who may have been an accomplice in the plot, he was foully murdered by Zimri, who ascended the throne and put the remnant of Elah\'s family to death, thus fulfilling the prophecy of Jehu concerning the house of Baasha. However, the conspiracy lacked the support of the people, for word of the crime no sooner reached Gibbethon, than the army raised Omri to the throne of Israel. Omri at once hastened to Tirzah and captured the place, which as it seems offered little resistance. Zimri resolved to die as king, and accordingly set fire to the palace with his own hands, and perished in the flames that he had kindled. Thus came to an ignominious end the short reign which remained as a blot even upon the blood-stained record of the deeds of violence that ushered in the change of dynasties in the Northern Kingdom, for the foul crime was abhorred even among arch plotters. When Jehu entered Jezreel he was met with Jezebel\'s bitter taunt, "Is it peace, thou Zimri, thy master\'s murderer?" (<a onClick="return mV(\'2Ki\',9,31);">2Ki 9:31</a>). The historian too, in the closing formula of the reign, specially mentions "his treason that he worked."``125';
isbe[9417]='Zin`zin (tsin; Sin):<P>(1) A town in the extreme south of Judah, on the line separating that province from Edom, named between the ascent of Akrabbim and Kadesh-barnea (<a onClick="return mV(\'Num\',34,4);">Nu 34:4</a>; <a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>). It must have lain somewhere between Wady el-Fiqra (the ascent of Akrabbim?) and \'Ain Qadis (Kadesh-barnea); but the site has not been recovered.<P>(2) The Wilderness of Zin is the tract deriving its name from the town (<a onClick="return mV(\'Num\',34,3);">Nu 34:3</a>). It is identified with the wilderness of Kadesh in <a onClick="return mV(\'Num\',33,36);">Nu 33:36</a>; while in other places Kadesh is said to be in the wilderness of Zin (<a onClick="return mV(\'Num\',20,1);">Nu 20:1</a>; <a onClick="return mV(\'Num\',27,14);">27:14</a>; <a onClick="return mV(\'Deu\',32,51);">De 32:51</a>). We may take it that the two names refer to the same region. The spies, who set out from Kadesh-barnea, explored the land from the wilderness of Zin northward (<a onClick="return mV(\'Num\',13,21);">Nu 13:21</a>; compare <a onClick="return mV(\'Num\',32,8);">32:8</A>). It bordered with Judah "at the uttermost part of the south" (<a onClick="return mV(\'Jos\',15,1);">Jos 15:1</a>). In this wilderness Moses committed the offense which cost him his hope of entering the promised land (<a onClick="return mV(\'Num\',27,14);">Nu 27:14</a>; <a onClick="return mV(\'Deu\',32,51);">De 32:51</a>). It is identical with the uplands lying to the north and northwest of the wilderness of Paran, now occupied by the \'Azazimeh Arabs.``54';
isbe[9418]='Zina`zi\'-na.`<a href="./study/isbe/search.html?string=ZIZAH">ZIZAH</a>`1';
isbe[9419]='Zion`zi\'-on (tsiyon; Sion):<P>1. Meaning of the Word<P>2. The Zion of the Jebusites<P>3. Zion of the Prophets<P>4. Zion in Later Poetical Writings and Apocrypha<P>5. Omission of Name by Some Writers<P>6. The Name "Zion" in Christian Times<P>LITERATURE<hr /><P>1. Meaning of the Word:<P>A name applied to Jerusalem, or to certain parts of it, at least since the time of David. Nothing certain is known of the meaning. Gesenius and others have derived it from a Hebrew root tsahah, "to be dry"; Delitzsch from tsiwwah, "to set up" and Wetzstein from tsin, "to protect." Gesenius finds a more hopeful suggestion in the Arabic equivalent cihw, the Arabic cahwat signifying "ridge of a mountain" or "citadel," which at any rate suitably applies to what we know to have been the original Zion (compare Smith, HGHL, under the word).<P>Considerable confusion has been caused in the past by the want of clear understanding regarding the different sites which have respectively been called "Zion" during the centuries. It will make matters clearer if we take the application of the name: in David\'s time; in the early Prophets, etc.; in late poetical writings and in the Apocrypha; and in Christian times.<P>2. The Zion of the Jebusites:<P>Jerus (in the form Uru-sa-lim) is the oldest name we know for this city; it goes back at least 400 years before David. In <a onClick="return mV(\'2Sa\',5,\'6-9\');">2Sa 5:6-9</a>, "The king and his men went to Jerusalem against the Jebusites....Nevertheless David took the stronghold of Zion; the same is the city of David...And David dwelt in the stronghold, and called it the city of David." It is evident that Zion was the name of the citadel of the Jebusite city of Jerusalem. That this citadel and incidentally then city of Jerusalem around it were on the long ridge running south of the Temple (called the southeastern hill in the article <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM, III, (3)</a> (which see)) is now accepted by almost all modern scholars, mainly on the following grounds:<P>(1) The near proximity of the site to the only known spring, now the "Virgin\'s Fount," once called <a href="./study/isbe/search.html?string=GIHON">GIHON</a> (which see). From our knowledge of other ancient sites all over Palestine, as well as on grounds of common-sense, it is hardly possible to believe that the early inhabitants of this site with such an abundant source at their very doors could have made any other spot their headquarters.<P>(2) The suitability of the site for defense.—The sites suited for settlement in early Canaanite times were all, if we may judge from a number of them now known, of this nature—a rocky spur isolated on three sides by steep valleys, and, in many sites, protected at the end where they join the main mountain ridge by either a valley or a rocky spur.<P>(3) The size of the ridge, though very small to our modern ideas, is far more in keeping with what we know of fortified towns of that period than such an area as presented by the southwestern hill—the traditional site of Zion. Mr. Macalister found by actual excavation that the great walls of Gezer, which must have been contemporaneous with the Jebusite Jerusalem, measured approximately 4,500 feet in circumference. G. A. Smith has calculated that a line of wall carried along the known and inferred scarps around the edge of this southeastern hill would have an approximate circumference of 4,250 feet. The suitability of the site to a fortified city like Gezer, Megiddo, Soco, and other sites which have been excavated, strikes anyone familiar with these places.<P>(4) The archaeological remains on these hills found by Warren and Professor Guthe, and more particularly in the recent excavations of Captain Parker (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>), show without doubt that this was the earliest settlement in pre-Israelite times. Extensive curves and rock-cuttings, cave-dwellings and tombs, and enormous quantities of early "Amorite" (what may be popularly called "Jebusite") pottery show that the spot must have been inhabited many centuries before the time of David. The reverse is equally true; on no other part of the Jerusalem site has any quantity of such early pottery been found.<P>(5) The Bible evidence that Zion originally occupied this site is clear. It will be found more in detail under the heading "City of David" in the article <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>, IV, (5), but three points may be mentioned here:<P>(a) The Ark of the Covenant was brought up out of the city of David to the Temple (<a nClick="return mV(\'1Ki\',8,1);">1Ki 8:1</a>; <a nClick="return mV(\'2Ch\',5,2);">2Ch 5:2</a>), and Pharaoh\'s daughter "came up out of the city of David unto her house which Solomon had built for her"—adjacent to the Temple (<a hnClick="return mV(\'1Ki\',9,24);">1Ki 9:24</a>). This expression "up" could not be used of any other hill than of the lower-lying eastern ridge; to go from the southwestern hill (traditional Zion) to the Temple is to go down.<P>(b) Hezekiah constructed the well-known Siloam tunnel from Gihon to the Pool of Siloam. He is described (<a hnClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>) as bringing the waters of Gihon "straight down on the west side of the city of David."<P>(c) Manasseh (<a hnClick="return mV(\'2Ch\',33,14);">2Ch 33:14</a>) built "an outer wall to the city of David, on the west side of Gihon, in the valley" (i.e. nachal—the name of the Kedron valley).<P>3. Zion of the Prophets:<P>Zion, renamed the City of David, then originally was on this eastern ridge. But the name did not stay there. It would almost seem as if the name was extended to the Temple site when the ark was carried there, for in the pre-exilic Prophets the references to Zion all appear to have referred to the Temple Hill. To quote a few examples: "And Yahweh will create over the whole habitation of mount Zion, and over her assemblies, a cloud and smoke by day, and the shining of a flaming fire by night" (<a hrClick="return mV(\'Isa\',4,5);">Isa 4:5</a>); "Yahweh of hosts, who dwelleth in mount Zion" (<a hrClick="return mV(\'Isa\',8,18);">Isa 8:18</a>); "Let us go up to Zion unto Yahweh our God" (<a hrClick="return mV(\'Jer\',31,6);">Jer 31:6</a>); "Yahweh will reign over them in mount Zion" (<a hrClick="return mV(\'Mic\',4,7);">Mic 4:7</a>). All these, and numbers more, clearly show that at that time Zion was the Temple Hill.<P>4. Zion in Later Poetical Writings and Apocrypha:<P>In many of the later writings, particularly poetical references, Zion appears to be the equivalent of Jerusalem; either in parallelism (<a hrClick="return mV(\'Psa\',102,21);">Ps 102:21</a>; <a hrClick="return mV(\'Amo\',1,2);">Am 1:2</a>; <a hrClick="return mV(\'Mic\',3,10);">Mic 3:10</a>,<a hrClick="return mV(\'Mic\',3,12);">12</a>; <a hrClick="return mV(\'Zec\',1,14,17);">Zec 1:14,17</a>; <a hrClick="return mV(\'Zec\',8,3);">8:3</a>; <a hrClick="return mV(\'Zep\',3,16);">Ze 3:16</a>) or alone (<a hrClick="return mV(\'Jer\',3,14);">Jer 3:14</a>; <a hrClick="return mV(\'Lam\',5,11);">La 5:11</a>); even here many of the references will do equally well for the Temple Hill. The term "Daughter of zion" is applied to the captive Jews (<a hrClick="return mV(\'Lam\',4,22);">La 4:22</a>), but in other references to the people of Jerusalem (<a hrClick="return mV(\'Isa\',1,8);">Isa 1:8</a>; <a hrClick="return mV(\'Isa\',52,2);">52:2</a>; <a hrClick="return mV(\'Jer\',4,31);">Jer 4:31</a>, etc.). When we come to the Apocrypha, in 2Esdras there are several references in which Zion is used for the captive people of Judah (2:40; 3:2,31; 10:20,39,44), but "Mount Zion" in this and other books (e.g. 1Macc 4:37,60; 5:54; 6:48,62, etc.) is always the Temple Hill.<P>5. Omission of Name by Some Writers:<P>It has been pointed out as a curious and unaccountable exception that in Ezekiel as well as in Chronicles, Ezra and Nehemiah, there is no mention of Zion, except the incidental reference to David\'s capture of the Jebusite fort. The references in the other Prophets and the Psalms are so copious that there must be some religious reason for this. The Chronicler (<a hrClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a>), too, alone refers to the Temple as on Mount Moriah. It is also noticeable that only in these books (<a onClick="return mV(\'2Ch\',27,3);">2Ch 27:3</a>; <a onClick="return mV(\'2Ch\',33,14);">33:14</a>; <a onClick="return mV(\'Neh\',3,26);">Ne 3:26</a>f; <a onClick="return mV(\'Neh\',11,21);">11:21</a>) does the name "Ophel" appear as a designation of a part of the southeastern hill, which apparently might equally fitly have been termed Zion. See <a href="./study/isbe/search.html?string=OPHEL">OPHEL</A>. Josephus never uses the name "Zion" nor does it occur in the New Testament, except in two quotations (<a onClick="return mV(\'Hbr\',12,22);">Heb 12:22</a>; <a onClick="return mV(\'Rev\',14,1);">Re 14:1</a>).<P>6. The Name "Zion" in Christian Times:<P>Among the earlier Christian writers who mention "Zion," Origen used it as equivalent to the Temple Hill, but in the 4th century writers commence to localize it up the southern part of the western hill. It was a period when Biblical topography was settled in a very arbitrary manner, without any scientific or critical examination of the evidence, and this tradition once established remained, like many such traditions, undisputed until very recent years. To W. F. Birch belongs much of the credit for the promulgation of the newer views which now receive the adherence of almost every living authority on the topography of Jerusalem.<P>LITERATURE.<P>See especially chapter vi in Smith\'s Jerusalem; for a defense of the older view see Kuemmel, Materialien z. Topog. des alt. Jerusalem.``117';
isbe[9420]='Zior`zi\'-or (tsi\'or; Sorth, or Sior): A town in the hill country of Judah (<a onClick="return mV(\'Jos\',15,54);">Jos 15:54</a>); probably Si\'air, 4 1/2 miles north-northeast of Hebron where the Mukam \'Aisa (Tomb of Esau) is now shown. It is a considerable village surrounded by cultivated land; a spring exists in the neighborhood; there are rock-cut tombs showing it is an ancient site (PEF, III, 309, Sh XXI).``1';
isbe[9421]='Ziph (1)`zif (ziph; Ozeib, or Ziph):<P>(1) A town in the hill country of Judah, mentioned along with Maon, Carmel and Jutah (<a onClick="return mV(\'Jos\',15,55);">Jos 15:55</a>). It is chiefly celebrated in connection with the earlier history of David: "David...remained in the hill-country in the wilderness of Ziph" (<a onClick="return mV(\'1Sa\',23,14,15,24);">1Sa 23:14,15,24</a>; <a onClick="return mV(\'1Sa\',26,2);">26:2</a>); the Ziphites (<a onClick="return mV(\'1Sa\',23,19);">1Sa 23:19</a>; <a onClick="return mV(\'1Sa\',26,1);">26:1</a>; compare <a onClick="return mV(\'Psa\',54,1);">Ps 54</a> title) sought to betray him to Saul, but David escaped. Ziph was fortified by Rehoboam (<a onClick="return mV(\'2Ch\',11,8);">2Ch 11:8</a>). The name also occurs in <a onClick="return mV(\'1Ch\',2,42);">1Ch 2:42</a>; <a onClick="return mV(\'1Ch\',4,16);">4:16</a>. In connection with this last (compare <a onClick="return mV(\'1Ch\',4,23);">4:23</A>) it is noticeable that Ziph is one of the four names occurring on the Hebrew stamped jar handles with the added la-melekh, "to the king."<P>The site is Tell Zif, 4 miles southeast of Hebron, conspicuous hill 2,882 ft. above sea-level; there are cisterns and, to the east, some ruins (PEF, III, 312, 315).<P>(2) A town in the Negeb of Judah (<a onClick="return mV(\'Jos\',15,24);">Jos 15:24</a>), site unknown.``117';
isbe[9422]='Ziph (2)`(ziph, meaning unknown):<P>(1) A grandson of Caleb (<a onClick="return mV(\'1Ch\',2,42);">1Ch 2:42</a>); the Septuagint has Zeiph.<P>(2) A son of Jehallelel (<a onClick="return mV(\'1Ch\',4,16);">1Ch 4:16</a>). In the Septuagint\'s Codex Alexandrinus reads Ziphai, but Codex Vaticanus has the totally different form Ameachei.``1';
isbe[9423]='Ziphah`zi\'-fa (ziphah, a feminine form of "Ziph"): A Judahite, "son" of Jehallelel. The name being feminine may be a dittography of the previous Ziph (<a onClick="return mV(\'1Ch\',4,16);">1Ch 4:16</a>).``1';
isbe[9424]='Ziphims`zif\'-imz: In title of <a onClick="return mV(\'Psa\',54,1);">Ps 54</a> the King James Version for the Revised Version (British and American) <a href="./study/isbe/search.html?string=ZIPHITES">ZIPHITES</A> (which see).``1';
isbe[9425]='Ziphion`zif\'-i-on (tsiphyon, "gaze" (?) (BDB)): A "son" of Gad (<a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a>) = "Zephon" of <a onClick="return mV(\'Num\',26,15);">Nu 26:15</a>.`<a href="./study/isbe/search.html?string=ZAPHON">ZAPHON</a>; <a href="./study/isbe/search.html?string=ZEPHONITES">ZEPHONITES</a>`1';
isbe[9426]='Ziphites`zif\'-its.`<a href="./study/isbe/search.html?string=ZIPH">ZIPH</a>`1';
isbe[9427]='Ziphron`zif\'-ron.`<a href="./study/isbe/search.html?string=SIBRAIM">SIBRAIM</a>`1';
isbe[9428]='Zippor`zip\'-or (tsippor; in <a onClick="return mV(\'Num\',22,4);">Nu 22:4</a>; <a onClick="return mV(\'Num\',23,18);">23:18</a>; tsippor, "bird," "swallow" (HPN, 94)): Father of Balak, king of Moab (<a onClick="return mV(\'Num\',22,2,10,16);">Nu 22:2,10,16</a>; <a onClick="return mV(\'Jos\',24,9);">Jos 24:9</a>; <a onClick="return mV(\'Jdg\',11,25);">Jud 11:25</a>).``1';
isbe[9429]='Zipporah`zi-po\'-ra, zip\'-o-ra (tsipporah; Sepphora): The Midianite wife of Moses, daughter of Jethro, also called Hobab, and probably grand-daughter of Reuel, a priest of Midian at the time Moses fled from Egypt, later succeeded at his death by Jethro, or Hobab (<a onClick="return mV(\'Exd\',2,21);">Ex 2:21,22</a>; <a onClick="return mV(\'Exd\',4,25);">4:25,26</a>; <a onClick="return mV(\'Exd\',18,\'2-6\');">18:2-6</a>).<P>Whether or not Zipporah was the "Cushite woman" (<a onClick="return mV(\'Num\',12,1);">Nu 12:1</a>) is a much-mooted question. There is little ground for anything more than speculation on the subject. The use of the words, "Cushite woman" in the mouth of Aaron and Miriam may have been merely a description of Zipporah and intended to be opprobrious, or they may have been ethnic in character and intended to denote another woman whom Moses had married, as suggested by Ewald (Gesch. des Volkes Israel, II, 252). The former view seems the more probable. The association of Midian and Cushan by Habakkuk (<a onClick="return mV(\'Hab\',3,7);">3:7</a>) more than 700 years afterward may hardly be adduced to prove like close relationship between these peoples in the days of Moses.``93';
isbe[9430]='Zithri`zith\'-ri.`<a href="./study/isbe/search.html?string=SITHRI">SITHRI</a>`1';
isbe[9431]='Ziv`ziv (ziw; the King James Version Zif): The 2nd month of the old Hebrew calendar, corresponding to Iyyar of the Jewish reckoning in later times. It is mentioned in <a onClick="return mV(\'1Ki\',6,1);">1Ki 6:1,37</a>.`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>`1';
isbe[9432]='Ziz, Ascent of`ziz (ma\'aleh ha-tsits; Hasae, Hasisa): A pass in the wilderness of Judea (<a onClick="return mV(\'2Ch\',20,16);">2Ch 20:16</a>) leading from Hazazon-tamar (En-gedi, <a onClick="return mV(\'2Ch\',20,2);">2Ch 20:2</a>). This is generally identified with Wady Chacaca, a valley by which the ancient road from En-gedi runs toward Jerusalem. At any rate, an echo of the ancient name survives here: possibly the actual ascent was the present steep pass from En-gedi to the plateau above.``1';
isbe[9433]='Ziza`zi\'-za (ziza\', probably a childish reduplicated abbreviation or a term of endearment (Curtis, Chron., 369, quoting Noldeke in EB, III 3294)):<P>(1) A Simeonite chief (<a onClick="return mV(\'1Ch\',4,37);">1Ch 4:37</a>).<P>(2) A son of King Rehoboam, his mother being a daughter or grand-daughter of Absalom (<a onClick="return mV(\'2Ch\',11,20);">2Ch 11:20</a>).<P>(3) A probable reading for <a href="./study/isbe/search.html?string=ZIZAH">ZIZAH</a> (which see).``1';
isbe[9434]='Zizah`zi\'-za (zizah; see <a href="./study/isbe/search.html?string=ZIZA">ZIZA</a>): A Gershonite Levite (<a onClick="return mV(\'1Ch\',23,11);">1Ch 23:11</a>); in verse <a onClick="return mV(\'1Ch\',23,10);">10</a> the name is "Zina" (zina\'), while the Septuagint and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) have "Ziza" (Ziza) in both verses, and one Hebrew manuscript has ziza\' in <a onClick="return mV(\'1Ch\',23,10);">1Ch 23:10</a>. We should then probably read ziza\' in both verses, i.e. "Ziza."``1';
isbe[9435]='Zoan`zo\'-an (tso\'an; Tanis):<P>1. situation<P>2. Old Testament Notices<P>3. Early History<P>4. Hyksos Monuments<P>5. Hyksos Population<P>6. Hyksos Age<P>7. Description of Site<hr /><P>1. Situation:<P>The name is supposed to mean "migration" (Arabic, tsan). The site is the only one connected with the history of Israel in Egypt, before the exodus, which is certainly fixed, being identified with the present village of San at the old mouth of the Bubastic branch of the Nile, about 18 miles southeast of Damietta. It should be remembered that the foreshore of the Delta is continually moving northward, in consequence of the deposit of the Nile mud, and that the Nile mouths are much farther north than they were even in the time of the geographer Ptolemy. Thus in the times of Jacob, and of Moses, Zoan probably lay at the mouth of the Bubastic branch, and was a harbor, Lake Menzaleh and the lagoons near Pelusium having been subsequently formed.<P>2. Old Testament Notices:<P>The city is only once noticed in the Pentateuch (<a onClick="return mV(\'Num\',13,22);">Nu 13:22</a>), as having been built seven years after Hebron, which existed in the time of Abraham. Zoan was certainly a very ancient town, since monuments of the VIth Egyptian Dynasty have been found at the site. It has been thought that Zoar on the border of Egypt (<a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a>) is a clerical error for Zoan, but the Septuagint reading (Zogora) does not favor this view, and the place intended is probably the fortress Zar, or Zor, often mentioned in Egyptian texts as lying on the eastern borders of the Delta. Zoan is noticed in the Prophets (<a onClick="return mV(\'Isa\',19,11);">Isa 19:11,13</a>; <a onClick="return mV(\'Isa\',30,4);">30:4</a>; <a onClick="return mV(\'Eze\',30,14);">Eze 30:14</a>), and its "princes" are naturally mentioned by Isaiah, since the capital of the XXIIInd Egyptian Dynasty (about 800 to 700 BC) was at this city. In <a onClick="return mV(\'Psa\',78,12,43);">Ps 78:12,43</a> the "field (or pastoral plain) of Zoan" is noticed as though equivalent to the land of <a href="./study/isbe/search.html?string=GOSHEN">GOSHEN</a> (which see).<P>3. Early History:<P>Zoan was the capital of the Hyksos rulers, or "shepherd kings," in whose time Jacob came into Egypt, and their monuments have been found at the site, which favors the conclusion that its plain was that "land of Rameses" (<a onClick="return mV(\'Gen\',47,11);">Ge 47:11</a>; <a onClick="return mV(\'Exd\',12,37);">Ex 12:37</a>; see <a href="./study/isbe/search.html?string=RAAMSES">RAAMSES</a>) where the Hebrews had possessions under Joseph. It is probably the site of Avaris, which lay on the Bubastic channel according to Josephus quoting Manetho (Apion, I, xiv), and which was rebuilt by the first of the Hyksos kings, named Salatis; for Avaris is supposed (Brugsch, Geog., I, 86-90, 278-80) to represent the Egyptian name of the city Ha-uar-t, which means "the city of movement" (or "flight"), thus being equivalent to the Semitic Zoan or "migration." It appears that, from very early times, the pastoral peoples of Edom and Palestine were admitted into this region. The famous picture of the Amu, who bring their families on donkeys to Egypt, and offer the Sinaitic ibex as a present, is found at Beni Chasan in a tomb as old as the time of Usertasen II of the XIIth Dynasty, before the Hyksos age. A similar immigration of shepherds (see <a href="./study/isbe/search.html?string=PITHOM">PITHOM</a>) from Aduma (or Edom) is also recorded in the time of Menepthah, or more than four centuries after the expulsion of the Hyksos by the XVIIIth, or Theban, Dynasty.<P>4. Hyksos Monuments:<P>Besides the name of Pepi of the Vlth Dynasty, found by Burton at Zoan, and many texts of the XIIth Dynasty, a cartouche of Apepi (one of the Hyksos kings) was found by Mariette on the arm of a statue apparently of older origin, and a sphinx also bears the name of Khian, supposed to have been an early Hyksos ruler. The Hyksos type, with broad cheek bones and a prominent nose, unlike the features of the native Egyptians, has been regarded by Virchow and Sir W. Flower as Turanian, both at Zoan and at Bubastis; which agrees with the fact that Apepi is recorded to have worshipped no Egyptian gods, but only Set (or Sutekh), who was also adored by Syrian Mongols (see <a href="./study/isbe/search.html?string=HITTITES">HITTITES</a>). At Bubastis this deity is called "Set of Rameses," which may indicate the identity of Zoan with the city Rameses.<P>5. Hyksos Population:<P>In the 14th century BC the city was rebuilt by Rameses II, and was then known as Pa-Ramessu. The Hyksos rulers had held it for 500 years according to Manetho, and were expelled after 1700 BC. George the Syncellus (Chronographia, about 800 AD) believed that Apepi (or Apophis) was the Pharaoh under whom Joseph came to Egypt, but there seems to have been more than one Hyksos king of the name, the latest being a contemporary of Ra-Sekenen of the XIIIth Dynasty, shortly before 1700 BC. Manetho says that some supposed the Hyksos to be Arabs, and the population of Zoan under their rule was probably a mixture of Semitic and Mongolic races, just as in Syria and Babylonia in the same ages. According to Brugsch (Hist of Egypt, II, 233), this population was known as Men or Menti, and came from Assyria east of Ruten or Syria. This perhaps connects them with the Minyans of Matiene, who were a Mongolic race. This statement occurs in the great table of nations, on the walls of the Edfu temple.<P>6. Hyksos Age:<P>The Hyksos age corresponds chronologically with that of the 1st Dynasty of Babylon, and thus with the age of the Hebrew patriarchs Abraham and Jacob—time when the power of Babylon was supreme in Syria and Palestine. It is very natural, therefore, that, like other Semitic tribes even earlier, these patriarchs should have been well received in the Delta by the Hyksos Pharaohs, and equally natural that, when Aahmes, the founder of the XVIIIth Egyptian Dynasty, took the town of Avaris and expelled the Asiatics, he should also have oppressed the Hebrews, and that this should be intended when we read (<a onClick="return mV(\'Exd\',1,8);">Ex 1:8</a>) that "there arose a new king over Egypt, who knew not Joseph." The exodus, according to the Old Testament dates, occurred in the time of the XVIIIth Dynasty (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS</a>) when Israel left Goshen. The later date advocated by some scholars, in the reign of Menepthah of the XIXth Dynasty, hardly agrees with the monumental notice of the immigration of Edomites into the Delta in his reign, which has been mentioned above; and in his time Egypt was being invaded by tribes from the north of Asia.<P>7. Description of Site:<P>Zoan, as described by G. J. Chester (Mem. Survey West Palestine, Special Papers, 1881, 92-96), is now only a small hamlet of mud huts in a sandy waste, west of the huge mounds of its ancient temple; but, besides the black granite sphinx, and other statues of the Hyksos age, a red sandstone figure of Rameses II and obelisks of granite have been excavated, one representing this king adoring the gods; while the names of Amen, Tum and Mut appear as those of the deities worshipped, in a beautiful chapel in the temple, carved in red sandstone, and belonging to the same age of prosperity in Zoan.``28';
isbe[9436]='Zoar`zo\'-ar (tso\'ar; the Septuagint usually Segor, Zogora): The name of the city to which Lot escaped from Sodom (<a onClick="return mV(\'Gen\',19,\'20-23\');">Ge 19:20-23,30</a>), previously mentioned in <a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a>; <a onClick="return mV(\'Gen\',14,2);">14:2,8</a>, where its former name is said to have been Bela. In <a onClick="return mV(\'Gen\',19,22);">19:22</A>, its name is said to have been given because of its littleness, which also seems to have accounted for its being spared. The location of Zoar has much to do with that of the cities of the Plain or Valley of Siddim, with which it is always connected. In <a onClick="return mV(\'Deu\',34,3);">De 34:3</a>, Moses is said to have viewed "the Plain of the valley of Jericho the city of palm trees, unto Zoar," while in <a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a> and <a onClick="return mV(\'Jer\',48,4);">Jer 48:4</a> (where the Septuagint reads unto "Zoar," instead of "her little ones") it is said to be a city of Moab. The traditional location of the place is at the south end of the Dead Sea. Josephus says (BJ, IV, viii, 4) that the Dead Sea extended "as far as Zoar of Arabia," while in Ant, I, xi, 4, he states that the place was still called Zoar. Eusebius (Onomasticon, 261) locates the Dead Sea between Jericho and Zoar, and speaks of the remnants of the ancient fertility as still visible. Ptolemy (v. 17,5) regards it as belonging to Arabia Petrea. The Arabian geographers mention it under the name Zughar, Sughar, situated 1 degrees south of Jericho, in a hot and unhealthful valley at the end of the Dead Sea, and speak of it as an important station on the trade route between Akkabah and Jericho. The Crusaders mention "Segor" as situated in the midst of palm trees. The place has not been definitely identified by modern explorers, but from <a onClick="return mV(\'Gen\',19,\'19-30\');">Ge 19:19-30</a> we infer that it was in the plain and not in the mountain. If we fix upon the south end of the Dead Sea as the Vale of Siddim, a very natural place for Zoar and one which agrees with all the traditions would be at the base of the mountains of Moab, east of Wady Ghurundel, where there is still a well-watered oasis several miles long and 2 or 3 wide, which is probably but a remnant of a fertile plain once extending out over a considerable portion of the shallow south end of the Dead Sea when, as shown elsewhere (see <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD+SEA</A>), the water level was considerably lower than now.<P>Robinson would locate it on the northeast corner of el-Lisan on the borders of the river Kerak, but this was done entirely on theoretical grounds which would be met as well in the place just indicated, and which is generally fixed upon by the writers who regard the Vale of Siddim as at the south end of the Dead Sea. Conder, who vigorously maintains that the Vale of Siddim is at the north end of the Dead Sea, looks favorably upon theory of W.H. Birch that the place is represented by the present Tell Shaghur, a white rocky mound at the foot of the Moab Mountains, a mile east of Beth-haram (Tell er-Rameh), 7 miles northeast of the mouth of the Jordan, a locality remarkable for its stone monuments and well-supplied springs, but he acknowledges that the name is more like the Christian Segor than the original Zoar.``198';
isbe[9437]='Zobah`zo\'-ba (tsobhah; Souba): The name is derived by Halevy from zehobhah as referring to its supplies of "bright yellow" brass; but this word might be more appropriately used to contrast its cornfields with white Lebanon. Zobah was an Aramean kingdom of which we have the first notice in Saul\'s wars (<a onClick="return mV(\'1Sa\',14,47);">1Sa 14:47</a>).<P>(1) David\'s First War.<P>When David sought to extend his boundary to the Euphrates, he came into contact with its king Hadadezer, and a great battle was fought in which David took many prisoners. Damascus, however, came to the rescue and fresh resistance was made, but a complete rout followed and great spoil fell to the victor, as well as access to the rich copper mines of Tebah and Berothai. Toi, king of Hamath, who had suffered in war with Hadadezer, now sent his son on an embassy with greetings and gifts to David (<a onClick="return mV(\'2Sa\',8,\'3-12\');">2Sa 8:3-12</a>; <a onClick="return mV(\'1Ch\',18,\'3-12\');">1Ch 18:3-12</a>). See <a onClick="return mV(\'Psa\',60,1);">Ps 60, title</a>.<P>(2) David\'s Second War.<P>During David\'s Ammonite war, the enemy was strengthened by alliance with Zobah, Maacah and Beth-rehob, and Israel was attacked from both north and south at the same time. The Northern confederation was defeated by Joab, but Hadadezer again gathered an army, including levies from beyond the Euphrates. These, under Shobach the captain of the host, were met by David in person at Helam, and a great slaughter ensued, Shobach himself being among the slain (<a onClick="return mV(\'2Sa\',10,\'6-19\');">2Sa 10:6-19</a>, the King James Version "Zoba"; <a onClick="return mV(\'1Ch\',19,\'3-19\');">1Ch 19:3-19</a>). Rezon, son of Eliada, now broke away from Hadadezer and, getting possession of Damascus, set up a kingdom hostile to Israel (<a onClick="return mV(\'1Ki\',11,\'23-25\');">1Ki 11:23-25</a>). Solomon seems (<a onClick="return mV(\'2Ch\',8,3);">2Ch 8:3</a>) to have invaded and subdued Hamath-zobah, but the text, especially Septuagint, is obscure.<P>(3) Geographical Position.<P>We can now consider the vexed question of the situation and extent of Aram-zobah. (See <a href="./study/isbe/search.html?string=SYRIA">SYRIA, 4, (10)</a>.) In addition to the Old Testament references we have the Assyrian name lists. In these Subiti is placed between Kui and Zemar, and, where it is otherwise referred to, a position is implied between Hamath and Damascus. It would thus lie along the eastern slopes of Anti-Lebanon extending thence to the desert, and in the north it may have at times included Emesa (modern Homs) around which Noldeke would locate it. Damascus was probably a tributary state till seized by Rezon. Winckler would identify it with another Cubiti, a place in the Hauran mentioned by Assurbanipal on the Hassam Cylinder vii, lines 110-12. This latter may be the native place of Igal, one of David\'s "thirty" (<a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a>), who is named among eastern Israelites.<P>The kingdom of Zobah in addition to its mineral wealth must have been rich in vineyards and fruitful fields, and its conquest must have added greatly to the wealth and power of Israel\'s king.``23';
isbe[9438]='Zobebah`zo-be\'-ba (ha-tsobhebhah, meaning uncertain): A Judahite name with the article prefixed (<a onClick="return mV(\'1Ch\',4,8);">1Ch 4:8</a>); some would read "Jabez" instead as in <a onClick="return mV(\'1Ch\',4,9);">1Ch 4:9</a>.``1';
isbe[9439]='Zohar`zo\'-har (tsochar, meaning uncertain):<P>(1) Father of Ephron the Hittite (<a onClick="return mV(\'Gen\',23,8);">Ge 23:8</a>; <a onClick="return mV(\'Gen\',25,9);">25:9</a>).<P>(2) "Son" of Simeon (<a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>) = "Zerah" of <a onClick="return mV(\'Num\',26,13);">Nu 26:13</a>; <a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a>.<P>See <a href="./study/isbe/search.html?string=ZERAH">ZERAH, 4</a>.<P>(3) In <a onClick="return mV(\'1Ch\',4,7);">1Ch 4:7</a>, where the Qere is "and tsochar" for the Kethibh is yitschar, the Revised Version (British and American) "Izhar," the King James Version wrongly "Jezoar."``1';
isbe[9440]='Zoheleth, the Stone of`zo\'-he-leth, (\'ebhen ha-zacheleth, "serpent\'s stone"): "And Adonijah slew sheep and oxen and fatlings by the stone of Zoheleth, which is beside En-rogel" (<a onClick="return mV(\'1Ki\',1,9);">1Ki 1:9</a>). Evidently this was a sacred stone—probably a matstsbhah such as marked a Canaanite sanctuary. A source of "living water" has always in the Semitic world been a sacred place; even today at most such places, e.g. at Bir Eyyub, the modern representative of En-rogel, there is a michrab and a platform for prayer. The stone has disappeared, but it is thought that an echo of the name survives in ez-Zechweleh, the name of a rocky outcrop in the village of Siloam. Because the name is particularly associated with an ascent taken by the woman coming from the Virgin\'s Fount, to which it is adjacent, some authorities have argued that this, the Virgin\'s Fount, must be En-rogel; on this see <a href="./study/isbe/search.html?string=EN-ROGEL">EN-ROGEL</a>; <a href="./study/isbe/search.html?string=GIHON">GIHON</a>. Against this view, as far as ez- Zechweleh is concerned, we may note:<P>(1) It is by no means certain that the modern Arabic name—which is used for similar rocky spots in other places—is really derived from the Hebrew;<P>(2) the name is now applied to quite different objects, in the Hebrew to a stone, in the Arabic to a rocky outcrop;<P>(3) the name is not confined to this outcrop near the Virgin\'s Fount alone, but applies, according to at least some of the fellahin of Siloam, to the ridge along the whole village site; and<P>(4) even if all the above were disproved, names are so frequently transferred from one locality to another in Palestine that no argument can be based on a name alone.``117';
isbe[9441]='Zoheth`zo\'-heth (zocheth, meaning unknown): A Judahite (<a onClick="return mV(\'1Ch\',4,20);">1Ch 4:20</a>). The name after "Ben-zoheth" at the end of the verse has fallen out.`<a href="./study/isbe/search.html?string=BEN+ZOHETH">BEN-ZOHETH</a>`1';
isbe[9442]='Zoology`zo-ol\'-o-ji: A systematic list of the animals of the Bible includes representatives of the principal orders of mammals, birds and reptiles, and not a few of the lower animals. For further notices of animals in the following list, see the articles referring to them:<P>Mammals:<P class="in15">PRIMATES: <a href="./study/isbe/search.html?string=APE">APE</A><P class="in15">INSECTIVORA: <a href="./study/isbe/search.html?string=HEDGEHOG">HEDGEHOG</a>. <a href="./study/isbe/search.html?string=MOLE">MOLE</a> (which see) not found in Palestine<P class="in15">CHIROPTERA: <a href="./study/isbe/search.html?string=Bat">Bat</A><P class="in15">CARNIVORA:<P class="in30">(a) Felidae, <a href="./study/isbe/search.html?string=Cat">CAT</a>, <a href="./study/isbe/search.html?string=Lion">LION</a>, <a href="./study/isbe/search.html?string=Leopard">LEOPARD</a><P class="in30">(b) Hyaenidae, <a href="./study/isbe/search.html?string=HYENA">HYENA</a><P class="in30">(c) Canidae, <a href="./study/isbe/search.html?string=DOG">DOG</a> (including <a href="./study/isbe/search.html?string=GREYHOUND">GREYHOUND</a>), <a href="./study/isbe/search.html?string=FOX">FOX</a>, <a href="./study/isbe/search.html?string=JACKAL">JACKAL</A>, <a href="./study/isbe/search.html?string=Wolf">WOLF</a><P class="in30">(d) Mustelidae, <a href="./study/isbe/search.html?string=Ferret">FERRET</A>, <a href="./study/isbe/search.html?string=BADGER">BADGER</a>, Marten (s.v. <a href="./study/isbe/search.html?string=CAT">CAT</A>)<P class="in30">(e) Ursidae, <a href="./study/isbe/search.html?string=Bear">BEAR</A><P class="in15">UNGULATA:<P class="in30">(a) Odd-toed: <a href="./study/isbe/search.html?string=Horse">HORSE</A>, <a href="./study/isbe/search.html?string=ASS">ASS</a>, <a href="./study/isbe/search.html?string=MULE">MULE</a>, <a href="./study/isbe/search.html?string=RHINOCEROS">RHINOCEROS</a><P class="in30">(b) Even-toed non-ruminants: <a href="./study/isbe/search.html?string=SWINE">SWINE</a>, <a href="./study/isbe/search.html?string=HIPPOPOTAMUS">HIPPOPOTAMUS</a> (<a href="./study/isbe/search.html?string=BEHEMOTH">BEHEMOTH</A>)<P class="in30">(c) Ruminants:<P class="in45">(1) Bovidae, Domestic <a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>, <a href="./study/isbe/search.html?string=WILD+OX">WILD OX</A> or <a href="./study/isbe/search.html?string=UNICORN">UNICORN</a>, Sinaitic Ibex (s.v. <a href="./study/isbe/search.html?string=GOAT">GOAT</a>), Persian Wild Goat (s.v. <a href="./study/isbe/search.html?string=CHAMOIS">CHAMOIS</a>), <a href="./study/isbe/search.html?string=GAZELLE">GAZELLE</A>, Arabian Oryx (s.v. <a href="./study/isbe/search.html?string=ANTELOPE">ANTELOPE</a>), <a href="./study/isbe/search.html?string=CHAMOIS">CHAMOIS</A><P class="in45">(2) Cervidae, Roe Deer, Fallow Deer, Red Deer (s.v. <a href="./study/isbe/search.html?string=DEER">DEER</a>)<P class="in45">(3) Camelidae, Camel<P class="in15">PROBOSCIDEA: <a href="./study/isbe/search.html?string=ELEPHANT">ELEPHANT</a><P class="in15">HYRACOIDEA: <a href="./study/isbe/search.html?string=CONEY">CONEY</a><P class="in15">SIRENIA: Dugong (s.v. <a href="./study/isbe/search.html?string=ROCK-BADGER">BADGER</a>)<P class="in15">CETACNA: <a href="./study/isbe/search.html?string=WHALE">WHALE</A>, <a href="./study/isbe/search.html?string=DOLPHIN">DOLPHIN</A>, <a href="./study/isbe/search.html?string=PORPOISE">PORPOISE</a><P class="in15">RODENTIA: <a href="./study/isbe/search.html?string=MOUSE;+MICE">MOUSE</A>, Mole-Rat (s.v. <a href="./study/isbe/search.html?string=MOLE">MOLE</a>), <a href="./study/isbe/search.html?string=PORCUPINE">PORCUPINE</A>, <a href="./study/isbe/search.html?string=HARE">HARE</A><p>Birds:<P class="in15">PASSERES: <a href="./study/isbe/search.html?string=SPARROW">SPARROW</A>, <a href="./study/isbe/search.html?string=SWALLOW">SWALLOW</a>, <a href="./study/isbe/search.html?string=RAVEN">RAVEN</A>, <a href="./study/isbe/search.html?string=HOOPOE">HOOPOE</A>, <a href="./study/isbe/search.html?string=NIGHT+HAWK">NIGHT HAWK</a><P class="in15">RAPTORES: <a href="./study/isbe/search.html?string=OWL,+GREAT">GREAT OWL</A>, <a href="./study/isbe/search.html?string=OWL,+LITTLE">LITTLE OWL</A>, <a href="./study/isbe/search.html?string=OWL,+SCREECH">HORNED OWL</A>, <a href="./study/isbe/search.html?string=EAGLE">EAGLE</A>, <a href="./study/isbe/search.html?string=VULTURE">VULTURE</a>, <a href="./study/isbe/search.html?string=GIER-EAGLE">GIER-EAGLE</a>, <a href="./study/isbe/search.html?string=OSPRAY">OSPREY</a>, <a href="./study/isbe/search.html?string=KITE">KITE</A>, <a href="./study/isbe/search.html?string=Glede">GLEDE</A>, <a href="./study/isbe/search.html?string=HAWK">HAWK</A>, <a href="./study/isbe/search.html?string=FALCON">FALCON</A><P class="in15">COLUMBAE: <a href="./study/isbe/search.html?string=DOVE">DOVE</A>, <a href="./study/isbe/search.html?string=TURTLE-DOVE">TURTLE-DOVE</a><P class="in15">GALLINAE: <a href="./study/isbe/search.html?string=COCK">COCK</A>, <a href="./study/isbe/search.html?string=PARTRIDGE">PARTRIDGE</A>, <a href="./study/isbe/search.html?string=QUAIL">QUAIL</A>, <a href="./study/isbe/search.html?string=PEACOCK">PEACOCK</a><P class="in15">GRALLATORES: <a href="./study/isbe/search.html?string=CRANE">CRANE</A>, <a href="./study/isbe/search.html?string=HERON">HERON</a>, <a href="./study/isbe/search.html?string=STORK">STORK</A><P class="in15">STEGANOPODES: <a href="./study/isbe/search.html?string=PELICAN">PELICAN</a>, <a href="./study/isbe/search.html?string=CORMORANT">CORMORANT</A><P class="in15">RATTAE: <a href="./study/isbe/search.html?string=Ostrich">OSTRICH</a><p>Reptiles:<P class="in15">CROCODILIA: <a href="./study/isbe/search.html?string=CROCODILE">CROCODILE</a> (<a href="./study/isbe/search.html?string=LEVIATHAN">LEVIATHAN</a>)<P class="in15">CHELONIA: <a href="./study/isbe/search.html?string=TORTOISE">TORTOISE</a><P class="in15">OPHIDIA: <a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>, <a href="./study/isbe/search.html?string=FIERY+SERPENT">FIERY SERPENT</a>, <a href="./study/isbe/search.html?string=ADDER">ADDER</A>, <a href="./study/isbe/search.html?string=ASP">ASP</A>, <a href="./study/isbe/search.html?string=VIPER">VIPER</A> (s.v. <a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>)<P class="in15">LACERTILIA: <a href="./study/isbe/search.html?string=LIZARD">LIZARD</A>, Great Lizard, <a href="./study/isbe/search.html?string=GECKO">GECKO</A>, <a href="./study/isbe/search.html?string=CHAMELEON">CHAMELEON</a>, <a href="./study/isbe/search.html?string=CROCODILE,+LAND">LAND CROCODILE</a>, Sand Lizard (s.v. <a href="./study/isbe/search.html?string=LIZARD">LIZARD</a>)<p>Amphibians: <a href="./study/isbe/search.html?string=FROG">FROG</a><P>Fishes: <a href="./study/isbe/search.html?string=FISH">FISH</a> (in general)<P>Mollusks: <a href="./study/isbe/search.html?string=SNAIL">SNAIL</a>, Murex (<a href="./study/isbe/search.html?string=PURPLE">Purple</A>)<P>Insects:<P class="in15">HYMENOPTERA: <a href="./study/isbe/search.html?string=ANT">ANT</a>, <a href="./study/isbe/search.html?string=Bee">BEE</A>, <a href="./study/isbe/search.html?string=HORNET">HORNET</A><P class="in15">LEPIDOPTERA: Clothes-Moth (s.v. <a href="./study/isbe/search.html?string=MOTH">MOTH</a>), <a href="./study/isbe/search.html?string=SILK;+SILKWORM">Silk-Worm</A>, <a href="./study/isbe/search.html?string=WORM; SCARLET-WORM">WORM (Larva)</A><P class="in15">SIPHONAPTERA: <a href="./study/isbe/search.html?string=FLEA">FLEA</a><P class="in15">DIPTERA: <a href="./study/isbe/search.html?string=FLY,+FLIES">FLY</A><P class="in15">RHYNCHOTA; <a href="./study/isbe/search.html?string=LICE">LOUSE</a>, <a href="./study/isbe/search.html?string=SCARLET+(WORM)">SCARLET-WORM</A><P class="in15">ORTHOPTERA: <a href="./study/isbe/search.html?string=GRASSHOPPER">GRASSHOPPER</A>, <a href="./study/isbe/search.html?string=LOCUST">LOCUST</A> (s.v. <a href="./study/isbe/search.html?string=INSECTS">INSECTS</A>)<P>Arachnida: <a href="./study/isbe/search.html?string=Spider">SPIDER</a>, <a href="./study/isbe/search.html?string=SCORPION">SCORPION</A><P>Coelenterata: <a href="./study/isbe/search.html?string=CORAL">CORAL</A><P>Porifera: <a href="./study/isbe/search.html?string=SPONGE">SPONGE</a><hr /><P>Some interesting problems arise in connection with the lists of clean and unclean animals in Leviticus and Deuteronomy. The list of clean animals in <a onClick="return mV(\'Deu\',14,\'4-5\');">De 14:4-5</a> is as follows:<P>Probably the most valuable modern work on Bible animals is Tristram\'s Natural History of the Bible, published in 1867 and to a great extent followed in the Revised Version (British and American) and in articles in various Biblical encyclopedias. In the table given above, the Revised Version (British and American) really differs from Tristram only in 6, 8 and 10. Hart is the male of the red deer, the ibex is a kind of wild goat, and the oryx is a kind of antelope. The first three in the table are domestic animals whose identification is not questioned. The other seven are presumably wild animals, regarding every one of which there is more or less uncertainty. \'Aqqo, dishon and zemer occur only in this passage, te\'o only here and in <a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>. \'Ayyal occurs 22 times, tsebhi 16 times, yachmur only twice. The problem is to find seven ruminant mammals to correspond to these names. The camel (<a onClick="return mV(\'Deu\',14,7);">De 14:7</a>) is excluded as unclean. The gazelle, the Sinaitic ibex, and the Persian wild goat are common. The roe deer was fairly common in Carmel and Southern Lebanon 20 years ago, but is now nearly or quite extinct. The fallow deer exists in Mesopotamia, and Tristram says that he saw it in Galilee, though the writer is inclined to question the accuracy of the observation. The oryx is fairly common in northwestern Arabia, approaching the limits of Edom. Here, then, are six animals, the gazelle, ibex, Persian wild goat, roe deer, fallow deer, and oryx, whose existence in or near Palestine is undisputed.<P>The bubale, addax and Barbary sheep of Tristram\'s list are North African species which the writer believes do not range as far east as Egypt, and which he believes should therefore be excluded. In Asia Miner are found the red deer, the chamois and the Armenian wild sheep, but there is no proof that any of these ever ranged as far south as Palestine. The bison exists in the Caucasus, and the wild ox, urus or aurochs, seems to be depicted in Assyrian sculptures. The buffalo is found in Palestine, but is believed to have been introduced since Bible times. The Tartarian roe is named Cervus pygargus, and there is a south African antelope named Bubalis pygargus, but the pygarg of English Versions of the Bible has no real existence. The word means "white-rumped," and might apply to various deer and antelopes.<P>To complete the list of seven we are therefore driven to one of the following: the red deer, the chamois, the Armenian wild sheep, the bison and the aurochs, no one of which has a very good claim to be included; The writer considers that the roe, which has been the commonest deer of Palestine, is the \'ayyal (compare Arabic \'aiyil, "deer"). Tsebhi is very near to Arabic zabi, "gazelle," and, with its 16 occurrences in the Old Testament, may well be that common animal. There is reason to think that yachmur is the name of a deer, and the writer prefers to apply it to the fallow deer of Mesopotamia, as being more likely to have inhabited Palestine than the red deer of Asia Minor. There is little evidence regarding \'aqqo, which occurs only here. The etymology is uncertain. Septuagint has tragelaphos, "goat-stag." Targum and Syriac VSS, according to BDB, have ibex. Ya\'el (<a onClick="return mV(\'Job\',39,1);">Job 39:1</a>; <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>; <a onClick="return mV(\'1Sa\',24,2);">1Sa 24:2</a>), English Versions of the Bible "wild goat," is quite certainly the ibex, but it is possible that \'aqqo may be another name for the same animal, ya\'el not occurring in this list. In BDB dishon is derived from dush, "to tread," and is considered to be a kind of wild goat. Since we have assigned \'aqqo to the ibex, we may then assign this name to the other wild goat of the country, the Persian wild goat or pasang. Te\'o is in the Revised Version (British and American) antelope and in the Septuagint orux, "oryx." This is a possible identification which suits also, <a onClick="return mV(\'Isa\',51,20);">Isa 51:20</a>, and does not preclude the possibility that the re\'em, the King James Version "unicorn," the Revised Version (British and American) "wild-ox," may also be the oryx. The oryx is known to the Arabs under at least three names, the most common of which, baqr el-wachsh, means "wild-ox." Under <a href="./study/isbe/search.html?string=CHAMOIS">CHAMOIS</a>, the writer suggests that zemer may be the pasang or Persian wild goat, which is figured in that article. There is little to choose in the assignment of the names, but as dishon has here been provisionally assigned to the pasang, nothing better is left for zemer than the "chamois" of English Versions of the Bible, the claims of which are referred to above.<P>The list of unclean animals is considered in the article on <a href="./study/isbe/search.html?string=LIZARD">LIZARD</a>.<P>Prophecies of the desolation of Babylon and Edom in <a onClick="return mV(\'Isa\',13,21,22);">Isa 13:21,22</a>; <a onClick="return mV(\'Isa\',34,\'11-15\');">34:11-15</a> contain names of animals, some of which present apparently insuperable difficulties. See under <a href="./study/isbe/search.html?string=JACKAL">JACKAL</a> and <a href="./study/isbe/search.html?string=SATYR">SATYR</A>. The Book of Job contains some remarkable references to animals, especially in chapters <a onClick="return mV(\'Job\',39,\'1-\');">39</a>; <a onClick="return mV(\'Job\',40,\'1-\');">40</A>; <a onClick="return mV(\'Job\',41,\'1-\');">41</a>: to the wild goat, the wild ass, the wild ox, the ostrich, the horse, the hawk, the behemoth and the leviathan.<P><a onClick="return mV(\'Pro\',30,\'1-\');">Pr 30</a> contains some curious allusions to natural history:<p>".... Things which are too wonderful for me ....<P>The way of an eagle in the air;<P>The way of a serpent upon a rock (see <a href="./study/isbe/search.html?string=EAGLE">EAGLE</a>; <a href="./study/isbe/search.html?string=WAY">WAY</a>);<P>There are four things which are little upon the earth,<P>But they are exceeding wise:<P>The ants are a people not strong,<P>Yet they provide their food in the summer;<P>The conies are but a feeble folk,<P>Yet they make their houses in the rocks;<P>The locusts have no king,<P>Yet go they forth all of them by bands;<P>The lizard taketh hold with her hands,<P>Yet is she in kings\' palaces.<P>There are three things which are stately in their march,<P>Yea, four which are stately in going:<P>The lion, which is might, lest among beasts,<P>And turneth not away for any;<P>The greyhound; the he-goat also;<P>And the king against whom there is no rising up."<P>An interesting grouping is found in the prophecy in <a onClick="return mV(\'Isa\',11,\'6-8\');">Isa 11:6-8</a> (compare <a onClick="return mV(\'Isa\',65,25);">65:25</a>): "And the wolf shall dwell with the lamb, and the leopard shall lie down with the kid; and the calf and the young lion and the fatling together; and a little child shall lead them. And the cow and the bear shall feed; their young ones shall lie down together; and the lion shall eat straw like the ox. And the sucking child shall play on the hole of the asp, and the weaned child shall put his hand on the adder\'s den."<P>The fauna of Palestine is mainly European and Asiatic, but resembles in some important points the fauna of Africa. The Syrian coney is not found elsewhere and its only near allies are the conies of Africa. The gazelle and oryx belong to the group of antelopes which is especially African. The lion and leopard range throughout Africa and southwest Asia. The ostrich is found outside of Africa only in Arabia. Some of the smaller birds, as for instance the sun-bird, have their nearest allies in Africa. The fish of the Sea of Tiberias and the Jordan present important resemblances to African fishes. The same is true of some of the butterflies of Palestine. Allying the fauna of Palestine with that of Europe and Northern Asia may be noted the deer, bear, wolf, fox, hare and others. The ibex and Persian wild goat constitute links with central Asia, which is regarded as the center of distribution of the goat tribe.<P>The fauna of Palestine has undoubtedly changed since Bible times. Lions have disappeared, bears and leopards have become scarce, the roe deer has nearly or quite disappeared within recent years. It is doubtful whether the aurochs, the chamois and the red deer were ever found in Palestine, but if so they are entirely gone. The buffalo has been introduced and has become common in some regions. Domestic cats, common now, were perhaps not indigenous to ancient Palestine. In prehistoric times, or it may be before the advent of man, the glacial period had an influence upon the fauna of this country, traces of which still persist. On the summits of Lebanon are found two species of butterfly, Pieris callidice, found also in Siberia, and Vanessa urticae, common in Europe. When the glacial period came on, these butterflies with a host of other creatures were driven down from the north. When the cold receded northward they moved back again, except for these, and perhaps others since become extinct, which found the congenial cold in ascending the mountains where they became isolated. Syria and Palestine were never covered with a sheet of ice, but the famous cedar grove of Lebanon stands on the terminal moraine of what was once an extensive glacier.``37';
isbe[9443]='Zophah`zo\'-fa (tsophach, meaning uncertain): An Asherite (<a onClick="return mV(\'1Ch\',7,35);">1Ch 7:35,36</a>).``1';
isbe[9444]='Zophai`zo\'fi, zo\'-fa-i (tsophay, meaning uncertain): In <a onClick="return mV(\'1Ch\',6,26);">1Ch 6:26</a> (Hebrew verse 11) = Zuph, the Qere of <a onClick="return mV(\'1Ch\',6,35);">1Ch 6:35</a> (Hebrew, verse 20), and <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>.`<a href="./study/isbe/search.html?string=ZUPH">ZUPH</a>`1';
isbe[9445]='Zophar`zo\'-far (tsphar, meaning doubtful, supposed from root meaning "to leap"; Sophar): One of the three friends of Job who, hearing of his affliction, make an appointment together to visit and comfort him. He is from the tribe of Naamah, a tribe and place otherwise unknown, for as all the other friends and Job himself are from lands outside of Palestine, it is not likely that this place was identical with Naamah in the west of Judah (<a onClick="return mV(\'Jos\',15,41);">Jos 15:41</a>). He speaks but twice (<a onClick="return mV(\'Job\',11,1);">Job 11</a>; <a onClick="return mV(\'Job\',20,\'1-\');">20</a>); by his silence the 3rd time the writer seems to intimate that with Bildad\'s third speech (<a onClick="return mV(\'Job\',25,\'1-\');">Job 25</a>; see under <a href="./study/isbe/search.html?string=BILDAD">BILDAD</a>) the friends\' arguments are exhausted. He is the most impetuous and dogmatic of the three (compare <a onClick="return mV(\'Job\',11,2);">Job 11:2,3</a>; <a onClick="return mV(\'Job\',20,2);">20:2,3</a>); stung to passionate response by Job\'s presumption in maintaining that he is wronged and is seeking light from God. His words are in a key of intensity amounting to reckless exaggeration. He is the first to accuse Job directly of wickedness; averring indeed that his punishment is too good for him (<a onClick="return mV(\'Job\',11,6);">11:6</A>); he rebukes Job\'s impious presumption in trying to find out the unsearchable secrets of God (<a onClick="return mV(\'Job\',11,\'7-12\');">11:7-12</a>); and yet, like the rest of the friends, promises peace and restoration on condition of penitence and putting away iniquity (<a onClick="return mV(\'Job\',11,\'13-19\');">11:13-19</a>). Even from this promise, however, he reverts to the fearful peril of the wicked (<a onClick="return mV(\'Job\',11,20);">11:20</A>); and in his 2nd speech, outdoing the others, he presses their lurid description of the wicked man\'s woes to the extreme (<a onClick="return mV(\'Job\',20,\'5-29\');">20:5-29</A>), and calls forth a straight contradiction from Job, who, not in wrath, but in dismay, is constrained by loyalty to truth to acknowledge things as they are. Zophar seems designed to represent the wrong-headedness of the odium theologicum.``66';
isbe[9446]='Zophim, the Field of`zo\'-fim, (sedheh tsophim; eis agrou skopian): The place on the top of Pisgah to which Balak took Balaam, whence only a part of the host of Israel could be seen (<a onClick="return mV(\'Num\',23,14);">Nu 23:14</a>). Perhaps we should simply translate "field of watchers." Conder draws attention to the name Tal\'at es-Sufa attached to an ascent leading up to the ridge of Neba from the north Here possibly is a survival of the old name.`<a href="./study/isbe/search.html?string=RAMAH">RAMAH</a>`1';
isbe[9447]='Zorah`zo\'-ra (tsor\'ah; Saraa): A city on the border of Dan, between Eshtaol and Ir-shemesh (<a onClick="return mV(\'Jos\',19,41);">Jos 19:41</a>); the birthplace of Samson (<a onClick="return mV(\'Jdg\',13,2);">Jud 13:2,25</a>); near here too he was buried (<a onClick="return mV(\'Jdg\',16,31);">Jud 16:31</a>); from here some Danites went to spy out the land (<a onClick="return mV(\'Jdg\',18,2,11);">Jud 18:2,11</a>). In <a onClick="return mV(\'Jos\',15,33);">Jos 15:33</a> it is, with Eshtaol, allotted to Judah, and after the captivity it was reinhabited by the "children of Judah" (<a onClick="return mV(\'Neh\',11,29);">Ne 11:29</a>, the King James Version "Zareah"). It was one of the cities fortified by Rehoboam (<a onClick="return mV(\'2Ch\',11,10);">2Ch 11:10</a>). It is probable that it is mentioned under the name Tsarkha along with Aialuna (Aijalon; <a onClick="return mV(\'2Ch\',11,10);">2Ch 11:10</a>) in the Tell el-Amarna Letters (no. 265, Petrie) as attacked by the Khabiri.<P>It is the modern Sur\'a, near the summit of a lofty hill on the north side of the Wady es-Surar (Vale of Sorek). The summit itself is occupied by the Mukam Nebi Samit, overhung by a lofty palm, and there are many remains of ancient tombs, cisterns, wine presses, etc., around. From here Eshu\'a (Eshtaol), \'Ain Shems (Beth-shemesh) and Tibnah (Timnah) are all visible. See PEF, III,158,Sh XVII.``117';
isbe[9448]='Zorathites`zo\'-rath-its (tsor\'athi; Sarathaioi (<a onClick="return mV(\'1Ch\',2,53);">1Ch 2:53</a>, the King James Version "Zareathites"), Codex Vaticanus ho Arathei; Codex Alexandrinus ho Sarathi (4 2)): The inhabitants of Zorah, who are said to be descended from Kiriath-jearim families.``1';
isbe[9449]='Zoreah`zo\'-re-a (tsor\'ah): the King James Version of <a onClick="return mV(\'Jos\',15,33);">Jos 15:33</a> for <a href="./study/isbe/search.html?string=ZORAH">ZORAH</a> (which see).``1';
isbe[9450]='Zorites`zo\'-rits (tsor\'i; Codex Vaticanus ho Hesarsei; Codex Alexandrinus ho Hesaraei): In <a onClick="return mV(\'1Ch\',2,54);">1Ch 2:54</a> for "Zorites" we should probably read <a href="./study/isbe/search.html?string=ZORATHITES">ZORATHITES</A> (which see). These formed a half of the inhabitants of <a href="./study/isbe/search.html?string=MANAHATH">MANAHATH</a> (which see).``1';
isbe[9451]='Zoroastrianism`zo-ro-as\'-tri-an-iz\'-m:<P><b>I. HISTORY SOURCES</b><P><b>II. RELATION TO ISRAEL</b><P class="in15">1. Influence on Occident<P class="in15">2. Popular Judaism<P class="in15">3. Possible Theological Influence<P class="in15">4. Angelology and Demonology<P class="in15">5. Eschatology<P class="in15">6. Messiah<P class="in15">7. Ethics<P class="in15">8. Summary<P><b>LITERATURE</b><hr /><P>I. History.<P>Sources:<P>The sacred book of the Persians, the Avesta, is a work of which only a small part has survived. Tradition tells that the Avestan manuscripts have suffered one partial and two total destructions (at the hands of Turanians, Macedonians, and Mohammedans, respectively), and what remains seems to be based on a collection of passages derived from oral tradition and arranged for liturgical purposes at the time of the first Sassanians (after 226 AD). None the less, a portion (the Gathas) of the present work certainly contains material from Zoroaster himself and much of the remainder of the Avesta is pre-Christian, although some portions are later. Outside of the Avesta there is an extensive literature written in Pahlavi. Most of this in its final form belongs to the 9th Christian century, or to an even later date, but in it there is embodied much very early matter. Unfortunately criticism of these sources is as yet in a very embryonic condition. The Greek historians, especially Plutarch and Strabo, are naturally of great importance, but the chief Greek work (that of Theopompus) is lost.<P>For a general account of Zoroastrianism, see <a href="./study/isbe/search.html?string=PERSIAN+RELIGION">PERSIAN RELIGION</a>.<P>II. Relation to Israel.<P>1. Influence on Occident:<P>Zoroastrianism was an active, missionary religion that has exerted a profound influence on the world\'s thought, all the more because in the West (at any rate) Ahura Mazda was not at all a jealous god, and Mazdeism was always quite ready to enter into syncretism with other systems. But this syncretistic tendency makes the task of the historian very delicate. None of the three great streams that swept from Persia over the West—Mithraism, Gnosticism, and Manicheism—contained much more than a Mazdean nucleus, and the extrication of Mazdean from other (especially older Magian and Babylonian) elements is frequently impossible. Yet the motive force came from Zoroaster, and long before the Christian era "Magi" were everywhere (as early as 139 BC they were expelled from Rome; compare <a href="./study/isbe/search.html?string=RAB-MAG">RAB-MAG</a>; <a href="./study/isbe/search.html?string=BRANCH">BRANCH</a>). Often, doubtless, charlatans, they none the less brought teachings that effected a far-reaching modification of popular views and produced an influence on so basic a writer as Plato himself.<P>2. Popular Judaism:<P>Within the period 538-332 BC (that Cyrus was a Zoroastrian seems now established) Israel was under the rule of Mazdeans, and Mazdean influence on at least the popular conceptions was inevitable. It appears clearly in such works as Tobit (Expository Times, XI, 257ff), and Hystaspis (GJV, edition 4, III, 592-95), in many Talmudic passages (ZDMG, XXI, 552-91), certain customs of the Essenes, various anti-demoniac charms (see <a href="./study/isbe/search.html?string=EXORCISM">EXORCISM</a>; <a href="./study/isbe/search.html?string=SORCERY">SORCERY</a>), and, perhaps, in the feast of Purim. And the stress laid on the prophetic ability of the Magi in <a onClick="return mV(\'Mat\',2,\'1-12\');">Mt 2:1-12</a> is certainly not without significance. But the important question is the existence or extent of Mazdean influence on the formal Jewish religion.<P>3. Possible Theological Influence:<P>As a matter of fact, after Israel\'s contact with Persia the following elements, all known to Mazdeism, appear, and apparently for the first time:<P>(1) a formal angelology, with six (or seven) archangels at the head of the developed hierarchy;<P>(2) these angels not mere companions of God but His intermediaries, established (often) over special domains;<P>(3) in the philosophical religion, a corresponding doctrine of hypostases;<P>(4) as a result, a remoter conception of God;<P>(5) a developed demonology;<P>(6) the conception of a supreme head (Satan) over the powers of evil;<P>(7) the doctrine of immortality;<P>(8) rewards or punishments for the soul immediately after death;<P>(9) a schematic eschatology especially as regards chronological systems;<P>(10) a superhuman Messiah;<P>(11) bodily resurrection;<P>(12) a rationalized, legalistic conception of God\'s moral demands.<P>4. Angelology and Demonology:<P>In this list Mazdean influence may be taken as certain in points (1), (2), (5), (6). Of course belief in angels and (still more) in demons had always existed in Israel, and a tendency to classification is a natural product of increased culture. But the thoroughness and rapidity of the process and the general acceptance of its principles show something more than cultural growth (compare the influence of pseudo-Dionysius on Christianity). In particular, the doctrine of patrons (angelic or demoniac) seems to find no expression in the pre-exilic religion. Nor was the incorporation into a single being, not only of phases, but of the whole power of evil, a necessary growth from the earlier religion; the contrast between <a onClick="return mV(\'2Sa\',24,1);">2Sa 24:1</a> and <a onClick="return mV(\'1Ch\',21,1);">1Ch 21:1</a> shows a sharp alteration in viewpoint. On the other hand, the dualism that Ahriman was to explain produced no effect on Israel, and God remained the Creator of all things, even of Satan. See <a href="./study/isbe/search.html?string=SATAN">SATAN</a>; <a href="./study/isbe/search.html?string=ANTICHRIST">ANTICHRIST</a>. (3) presents a problem that still needs proper analysis. The Zoroastrian abstractions may well have stimulated Jewish speculation. But the influence of Greek thought can certainly not be i
