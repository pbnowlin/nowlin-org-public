gnored, and a rationalizing process applied to the angelelegy would account for the purely Jewish growth of the concepts. (4) is bound up to some degree with the above, and presents the most unpleasant feature of the later Judaism. Sharply counter to prophetic and pre-prophetic teaching, it was modified by the still later Talmudism. Its inconsistency with the teaching of Christ needs no comment. In part, however, it may well have been due to the general "transcendentalizing" tendencies of the intermediate period.<P>See <a href="./study/isbe/search.html?string=GOD">GOD</a>; <a href="./study/isbe/search.html?string=SALVATION">SALVATION</a>.<P>5. Eschatology:<P>It is possible, similarly, to understand the advanced Jewish eschatology as an elaboration and refinement of the genuinely prophetic Day of Yahweh concepts, without postulating foreign influence. In particular, a doctrine of immortality was inevitable in Judaism, and the Jewish premises were of a sort that made a resurrection belief necessary. The presence of similar beliefs in Mazdeism may have hastened the process and helped determine the specific form, and for certain details direct borrowing is quite likely (compare the twelve periods of world-history in Apocrypha Abraham 29; Syriac Baruch 53ff; 2Esdras 14). But too much stress cannot be laid on details. The extant Persian apocalypses are all very late, and literary (if not religious) influence on them from Christian and Jewish sources seems inevitable (for the Bahman Yast it is certain). Nor could the effect of the Mazdean eschatology have been very thorough. Of its two most cardinal doctrines, the Chinvat Bridge is absent from Judaism, and the molten-metal ordeal is referred to only in the vaguest terms, if at all. Indeed, the very fact that certain doctrines were identified with the "heathen" may well have deterred Jewish acceptance.<P>See <a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>; <a href="./study/isbe/search.html?string=RESURRECTION">RESURRECTION</a>.<P>6. Messiah:<P>Similarly, the Messiah, as future king, was fixed in Jewish belief, and His elevation to celestial position was an inevitable step in the general refining process. The Persian Saoshyant doctrine may well have helped, and the appearance of the Messiah "from...the sea" in 2Esdras 13:3 certainly recalls the Mazdean appearance from a lake. But Saoshyant is not a celestial figure. He has no existence before his final appearance (or birth) and he comes from earth, not from heaven. The Jewish Son of man—Messiah—on the other hand, is a purely celestial figure and (even in 2Esdras 13) existed from (or before) creation. The birth of Saoshyant from the seed of Zoroaster and that of the (non-celestial) Messiah from the seed of David have no connection whatever.<P>See <a href="./study/isbe/search.html?string=MESSIAH">MESSIAH</a>; <a href="./study/isbe/search.html?string=SON+OF+MAN">SON OF MAN</a>.<P>7. Ethics:<P>Not much can be made of the parallel in legalism. Nearly every religion has gone through a similar legalistic state. The practical eudemonistic outlook of such works as Proverbs and Sirach (see <a href="./study/isbe/search.html?string=WISDOM">WISDOM</a>) doubtless have analogies in Mazdeism, and the comfortable union of religion and the good things of the present life among the Persians may well have had an effect on certain of the Jews, especially as the Persians preserved a good ethical standard. But only a part of Judaism was eudemonistic, and Mazdean and Jewish casuistry are based on entirely distinct principles.<P>8. Summary:<P>Summarizing, about the most that can be asserted for Mazdean influence is that it left its mark on the angelology and demonology and that it possibly contributed certain eschatological details. Apart from this, it may well have helped determine the development of elements already present in Israel\'s faith. On the common people (especially the more superstitious) its influence was considerably greater. But there is nothing in the formal theology of Judaism that can be described as "borrowed" from Mazdean teachings.<P>NOTE.<P>There is almost certainly no reference to Mazdean dualism in <a onClick="return mV(\'Isa\',45,7);">Isa 45:7</a>.<P>LITERATURE.<P>The Avesta is in SBE, IV,23,31, but the Gathas are best studied in L.H. Mills, The Gathas of Zarathushtra (1900); Pahlavi texts in SBE, V,18,24,37,47. The best presentation of Mazdeism is in Saussaye\'s Lehrbuch der Religionsgeschichte, II, 162-233 (by Ed. Lehmann); compare the articles "Zoroastrianism" in Encyclopedia Biblica (Geldner and Cheyne) and HDB (J. H. Moulton, excellent); on the relation to Judaism, Stave, Uber den Einfluss des Parsismus auf das Judenthum (1898); Soderblom, La vie future d\'apres le Mazdeisme (An. Mus. Guimet,1901,needs checking); Boklen, Die Verwandtschaft der jud.-chr. mit der parsischen Eschatologie (1902, good material but very uncritical); L. H. Mills, Our Own Religion in Ancient Persia (1912, theory of parallel development; Mazdeism rather idealized); J. H. Moulton, Early Zoroastrianism (1913) and articles by T. K. Cheyne, The Expository Times, II,202,224, 248; and J. H. Moulton, The Expository Times, IX, 352. For details compare Clemen, Religionsgeschichtliche Erklarung des New Testament (1909, English translation, Primitive Christianity and Its non-Jewish Sources); Bousset, Religion des Judenthums (2nd edition, 1906); Offenbarung Johannis (1906); Hauptprobleme der Gnosis (1907, indispensable).``48';
isbe[9452]='Zorobabel`zo-rob\'-a-bel, zo-ro\'-ba-bel (Zerobabel): In the King James Version; Greek form of "Zerubbabel," thus the Revised Version (British and American) (<a onClick="return mV(\'Mat\',1,12);">Mt 1:12,13</a>; <a onClick="return mV(\'Luk\',3,27);">Lu 3:27</a>).``1';
isbe[9453]='Zorzelleus`zor-zel\'-e-us (Zorzelleos, Codex Vaticanus (and Swete) Phaezeldaios; Fritzsche, Berzellaios; the King James Version Berzelus; the Revised Version margin "Phaezeldaeus"): The father of Augia, the wife of Jaddus, head of a family that "usurped the office of the priesthood" in the return under Zerubbabel (1Esdras 5:38); "Barzillai" of <a onClick="return mV(\'Ezr\',2,61);">Ezr 2:61</a>; <a onClick="return mV(\'Neh\',7,63);">Ne 7:63</a>.`<a href="./study/isbe/search.html?string=BARZILLAI">BARZILLAI</a>`1';
isbe[9454]='Zuar`zu\'-ar, zoo\'-ar (tsu\'-ar "little one"; Sogar): Father of Nethanel (<a onClick="return mV(\'Num\',1,8);">Nu 1:8</a>; <a onClick="return mV(\'Num\',2,5);">2:5</a>; <a onClick="return mV(\'Num\',7,18);">7:18,23</a>; <a onClick="return mV(\'Num\',10,15);">10:15</a>), who was head of the tribe of Issachar.``1';
isbe[9455]='Zuph`zuf (tsuph, "honeycomb"):<P>(1) According to <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1b</a>; <a onClick="return mV(\'1Ch\',6,35);">1Ch 6:35 (Hebrew verse 20)</a> = "Zophai" of <a onClick="return mV(\'1Ch\',6,26);">1Ch 6:26</a> (11), an ancestor of Elkanah and Samuel. But Budde and Wellhausen take it to be an adjective, and so read tsuphi, in <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a> b: "Tohu a Zuphite, an Ephraimite." It should probably be read also in <a onClick="return mV(\'1Sa\',1,1);">1:1a</A>: "Now there was a certain man of the Ramathites, a Zuphite of the hill-country of Ephraim," as the Hebrew construction in the first part of the verse is otherwise unnatural. The Septuagint\'s Codex Alexandrinus has Soup; Lucian has Souph in <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1b</a>; <a onClick="return mV(\'1Ch\',6,26);">1Ch 6:26</a> (11); Codex Vaticanus has Souphei; Codex Alexandrinus and Lucian have Souphi; <a onClick="return mV(\'1Ch\',6,35);">6:35 (20)</A>, Codex Vaticanus and Codex Alexandrinus have Souph; Lucian has Souphi; and the Kethibh has tsiph.<P>(2) The Septuagint\'s Codex Vaticanus and Codex Alexandrinus have Seiph; Lucian has Sipha, "the land of Zuph," a district in Benjamin, near its northern border (<a onClick="return mV(\'1Sa\',9,5);">1Sa 9:5</a>).``149';
isbe[9456]='Zur`zur (tsur "rock"):<P>(1) A prince or chief (<a onClick="return mV(\'Num\',25,15);">Nu 25:15</a>; <a onClick="return mV(\'Num\',31,8);">31:8</a>) of Midian, father of the woman slain with Zimri by Phinehas. <a onClick="return mV(\'Jos\',13,21);">Jos 13:21</a> describes him as one of the princes of Sihon, but the reference there is regarded as a gloss.<P>(2) An inhabitant of Gibeon (<a onClick="return mV(\'1Ch\',8,30);">1Ch 8:30</a>; <a onClick="return mV(\'1Ch\',9,36);">9:36</a>), to be connected probably, according to Curtis, with "Zeror" of <a onClick="return mV(\'1Sa\',9,1);">1Sa 9:1</a>.``1';
isbe[9457]='Zuriel`zu\'-ri-el (tsuri\'-el, "my rock is El (God)"): Prince of the house of Merari (<a onClick="return mV(\'Num\',3,35);">Nu 3:35</a>).<P>The word tsur, "rock," occurs also in the compound names Elizur (<a onClick="return mV(\'Num\',1,5);">Nu 1:5</a>), Zurishaddai (<a onClick="return mV(\'Num\',1,6);">Nu 1:6</a>, etc.) and Pedahzur (<a onClick="return mV(\'Num\',1,10);">Nu 1:10</a>). Gray, <a onClick="return mV(\'Num\',6,\'1-\');">Numbers 6</a>, says that a Sabean name Suri\'addana is found in an inscription said to be of the 8th century BC, or somewhat carrier (Hommel, Ancient Hebrew Tradition, 320), and bartsur, in a Zinjirli inscription of the 8th century BC (Panammu Inscr., 1. 1), and that possibly the Old Testament place-name "Beth-zur" should be added (<a onClick="return mV(\'Jos\',15,58);">Jos 15:58</a>; <a onClick="return mV(\'1Ch\',2,45);">1Ch 2:45</a>; <a onClick="return mV(\'2Ch\',11,7);">2Ch 11:7</a>; <a onClick="return mV(\'Neh\',3,16);">Ne 3:16</a>).``149';
isbe[9458]='Zurishaddai`zu-ri-shad\'-a-i, zu-ri-shad\'-i (tsurishadday, "my rock is Shadday"): Father of Shelumiel the head of the tribe of Simeon (<a onClick="return mV(\'Num\',1,6);">Nu 1:6</a>; <a onClick="return mV(\'Num\',2,12);">2:12</a>; <a onClick="return mV(\'Num\',7,36);">7:36,41</a>; <a onClick="return mV(\'Num\',10,19);">10:19</a>).`<a href="./study/isbe/search.html?string=GOD+NAMES+OF">GOD, NAMES OF</a>; <a href=".study/isbe/search.html?string=ZURIEL">ZURIEL</a>`1';
isbe[9459]='Zuzim`zu\'-zim (zuzim; (ethne ischura, "strong nations." So Jerome in Quaest. Hebr.: genres fortes): A people conquered by Chedorlaomer (<a onClick="return mV(\'Gen\',14,5);">Ge 14:5</a>). They dwelt in Ham, a region not otherwise known but, from the connection, inferred to be east of the Jordan. It may also be inferred that they were a race of giants. They were perhaps to be identified with the Zamzummim.``1';
