 the Holy Spirit." The belief in the Trinity is fundamental to Christianity; accordingly, the sacred rite by which men are initiated into the Christian religion justly emphasizes this belief. The three Persons are mentioned as distinct from one another, but the baptismal command is issued upon their joint and coequal authority ("in the name," not "names"), thus indicating the Unity in Trinity. This ancient baptismal formula represents "the Father as the Originator, the Son as the Mediator, the Holy Ghost as the Realization, and the vital and vitalizing blessing of the promise and fulfillment," which is extended to men in this ordinance (Cremer).<P>2. The Biblical History of the Ordinance:<P>After the Lord had entered into His glory, we find that in the era of the apostles and in the primitive Christian church baptism is the established and universally acknowledged rite by which persons are admitted to communion with the church (<a onClick="return mV(\'Act\',2,38,41);">Ac 2:38, 41</a>; <a onClick="return mV(\'Act\',8,12,36,38);">8:12f, 36, 38</a>; <a onClick="return mV(\'Act\',9,18);">9:18</a>; <a onClick="return mV(\'Act\',10,47);">10:47f</a>; <a onClick="return mV(\'Act\',16,15,33);">16:15, 33</a>; <a onClick="return mV(\'Act\',18,8);">18:8</a>; <a onClick="return mV(\'Rom\',6,3);">Ro 6:3</a>; <a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a>; <a onClick="return mV(\'Gal\',3,27);">Ga 3:27</a>). Even in cases where an outpouring of the special gifts of the Holy Spirit had already taken place, baptism is still administered (<a onClick="return mV(\'Act\',10,44);">Ac 10:44</a>ff; <a onClick="return mV(\'Act\',11,15);">11:15</a>f). "Thus, baptism occupied among the Gentile converts to Christianity, and later among all Christians, the same position as circumcision in the Old Covenant (<a onClick="return mV(\'Col\',2,11);">Col 2:11</a>f; <a onClick="return mV(\'Gal\',5,2);">Ga 5:2</a>). It is, essentially, part of the foundation on which the unity of the Christian society rested from the beginning (<a onClick="return mV(\'Eph\',4,5);">Eph 4:5</a>; <a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a>; <a onClick="return mV(\'Gal\',3,27);">Ga 3:27</a>f)" (Riehm, Handworterb.).<p>3. Types of Baptism:<P>In <a onClick="return mV(\'1Cr\',10,1,2);">1Co 10:1-2</a> the apostle states that the Israelites "were all baptized unto Moses in the cloud and in the sea." Farrar attempts the following solution of this type: "The passing under the cloud (<a onClick="return mV(\'Exd\',14,19);">Ex 14:19</a>) and through the sea, constituting as it did their deliverance from bondage into freedom, their death to Egypt, and their birth to a new covenant, was a general type or dim shadow of Christian baptism (compare our collect, \'figuring thereby Thy holy baptism\'). But the typology is quite incidental; it is the moral lesson which is paramount. \'Unto Moses\'; rather, into. By this \'baptism\' they accepted Moses as their Heaven sent guide and teacher" (Pulpit Comm.). In <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a> the apostle calls baptism the antitupon of the Deluge. Delitzsch (on <a onClick="return mV(\'Hbr\',9,24);">Heb 9:24</a>) suggests that tupos and antitupon in Greek represent the original figure and a copy made therefrom, or a prophetic foretype and its later accomplishment. The point of comparison is the saving power of water in either instance. Water saved Noah and his family by floating the ark which sheltered them, and by removing from them the disobedient generation which had sorely tried their faith, as it had tried God\'s patience. In like manner the water of baptism bears up the ark of the Christian church and saves its believing members, by separating them from their filthy and doomed fellow-men.<P>III. Difficulties.<P>1. Are <a onClick="return mV(\'Mat\',28,\'18-20\');">Matthew 28:18-20</a> and <a onClick="return mV(\'Mar\',16,15,16);">Mark 16:15-16</a> Genuine?:<P>Feine (PER3, XIX, 396f) and Kattenbusch (Sch-Herz, I, 435f) argue that the Trinitarian formula in <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a> is spurious, and that the text in Mark belongs to a section which was added to this Gospel at a later time. The former claim had first been advanced by Conybeare, but later research by Riggenbach has established the genuineness of the Trinitarian formula in Matthew. Feine still maintains his doubts, however, on subjective grounds. As to the concluding section in Mark (<a onClick="return mV(\'Mar\',16,\'9-20\');">16:9-20</a>), Jerome is the first to call attention to its omission in most Greek manuscripts to which he had access. But Jerome himself acknowledged <a onClick="return mV(\'Mar\',16,14);">Mr 16:14</a> as genuine. Gregory of Nyssa reports that, while this section is missing in some manuscripts, in the more accurate ones many manuscripts contain it. No doctrinal scruple can arise on account of this section; for it contains nothing that is contrary to the doctrine of Scripture in other places on the same subject; and it has always been treated as genuine by the Christian church. The question is a purely historical one (see Bengel, Apparatus Criticus, 170f).<P>2. Was the Trinitarian Formula Used in New Testament Times?:<P>No record of such use can be discovered in the Acts or the epistles of the apostles. The baptisms recorded in the New Testament after the Day of Pentecost are administered "in the name of Jesus Christ" (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>), "into the name of the Lord Jesus" (<a onClick="return mV(\'Act\',8,16);">Ac 8:16</a>), "into Christ" (<a onClick="return mV(\'Rom\',6,3);">Ro 6:3</a>; <a onClick="return mV(\'Gal\',3,27);">Ga 3:27</a>). This difficulty was considered by the Fathers; Ambrose says: Quod verbo tacitum fuerat, expressum est fide, "What had not been expressed in word, was expressed by faith." On close inspection the difficulty is found to rest on the assumption that the above are records of baptismal formulas used on those occasions. The fact is that these records contain no baptismal formula at all, but "merely state that such persons were baptized as acknowledged Jesus to be the Lord and the Christ" (Plummer). The same can be said of any person baptized in our day with the Trinitarian formula. That this formula was the established usage in the Christian church is proven by records of baptisms in Justin (Apol., I, 61) and Tertullian (Adv. Prax., XXVI).<p>3. Was Christian Baptism Really a New Ordinance?:<P>Baptism was practiced among the Jews prior to the solemn inauguration of this ordinance by the risen Christ. The ceremonial washings of the Jews are classed with the transient forms of the Levitical worship (<a onClick="return mV(\'Hbr\',9,9,10);">Heb 9:9-10</a>), which had not been intended to endure except "until a time of reformation." They were removed when Christian baptism was erected into an abiding ordinance of the church of God (<a onClick="return mV(\'Col\',2,\'11-13\');">Col 2:11-13</a>). It is erroneous to say that those ancient washings developed into Christian baptism. A shadow does not develop into a substance. Nor do we find the origin of Christian baptism in the baptism of proselytes, which seems to have been a Jewish church custom in the days of Christ. Though the rite of baptism was not by unknown to the Jews, still the baptism of John startled them (<a onClick="return mV(\'Jhn\',1,25);">Joh 1:25</a>). Such passages as <a onClick="return mV(\'Isa\',4,4);">Isa 4:4</a> (<a onClick="return mV(\'Isa\',1,16);">1:16</a>); <a onClick="return mV(\'Eze\',36,25);">Eze 36:25</a>; <a onClick="return mV(\'Eze\',37,23);">37:23</a>; <a onClick="return mV(\'Zec\',13,1);">Zec 13:1</a> had, no doubt, led them to expect a rite of purification in the days of the Messiah, which would supersede their Levitical purification. The delegation which they sent to John was to determine the Messianic character of John and his preaching and baptizing. Johannic baptism has been a fruitful theme of debate. The question does not affect the personal faith of any Christian at the present time; for there is no person living who has received Johannic baptism (Chemnitz). The entire subject and certain features of it, as the incident recorded <a onClick="return mV(\'Act\',19,\'1-7\');">Ac 19:1-7</a>, will continue to be debated. It is best to fix in our minds a few essential facts, which will enable us to put the Scriptural estimate on the baptism of John. John had received a Divine commission to preach and baptize (<a onClick="return mV(\'Luk\',3,2);">Lu 3:2</a>; <a onClick="return mV(\'Jhn\',1,33);">Joh 1:33</a>; <a onClick="return mV(\'Mat\',21,25);">Mt 21:25</a>). He baptized with water (<a onClick="return mV(\'Jhn\',3,23);">Joh 3:23</a>). His baptism was honored by a wonderful manifestation of the holy Trinity (<a onClick="return mV(\'Mat\',3,16,17);">Mt 3:16-17</a>), and the Redeemer, in His capacity as the Representative of sinful mankind, the sin-bearing Lamb of God, accepting baptism at John\'s hand (<a onClick="return mV(\'Mat\',3,13);">Mt 3:13</a>ff; <a onClick="return mV(\'Jhn\',1,29);">Joh 1:29</a>ff). It was of the necessity of receiving John\'s baptism that Christ spoke to Nicodemus (<a onClick="return mV(\'Jhn\',3,3);">Joh 3:3</a>ff). The Pharisees invited their eternal ruin by refusing John\'s baptism (<a onClick="return mV(\'Luk\',7,30);">Lu 7:30</a>); for John\'s baptism was to shield them from the wrath to come (<a onClick="return mV(\'Mat\',3,7);">Mt 3:7</a>); it was for the remission of sin (<a onClick="return mV(\'Mar\',1,4);">Mr 1:4</a>); it was a washing of regeneration (<a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>). When Jesus began His public ministry, He took up the preaching and baptism of John, and His disciples practiced it with such success that John rejoiced (<a onClick="return mV(\'Jhn\',3,22,\'25-36\');">Joh 3:22, 25-36</a>; <a onClick="return mV(\'Jhn\',4,1,2);">4:1-2</a>). All this evidence fairly compels the belief that there was no essential difference between the baptism of John and the baptism instituted by Christ; that what the risen Christ did in <a onClick="return mV(\'Mat\',28,\'18-20\');">Mt 28:18-20</a> was merely to elevate a rite that had previously been adopted by an order "from above" to a permanent institution of His church, and to proclaim its universal application. The contrast which John himself declares between his baptism and that of Christ is not a contrast between two baptisms with water. The baptism of Christ, which John foretells, is a baptism with the Holy Ghost and with fire, the Pentecostal baptism. But for the general purpose of begetting men unto a new life, sanctifying and saving them, the Spirit was also bestowed through John\'s baptism (<a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>). <p>4. Should Infants Be Baptized?:<P>The command in <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>; <a onClick="return mV(\'Mar\',16,16);">Mr 16:16</a> is all-embracing; so is the statement concerning the necessity of baptism in <a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>. After reading these statements, one feels inclined, not to ask, Should infants be baptized? but Why should they not be baptized? The onus probandi rests on those who reject infant baptism. The desire to have their infants baptized must have been manifested on the day when the first three thousand were baptized at Jerusalem, assuming that they were all adults. The old covenant had provided for their children; was the new to be inferior to the old in this respect? (See Plummer in Hastings, Dictionary of the Bible (five volumes).) The baptism of entire households is presumptive evidence that children and infants were baptized in apostolic times (<a onClick="return mV(\'Act\',16,15,33);">Ac 16:15, 33</a>; <a onClick="return mV(\'Act\',18,8);">18:8</a>; <a onClick="return mV(\'1Cr\',1,16);">1Co 1:16</a>). The arguments against infant baptism imply defective views on the subject of original sin and the efficacy of baptism. Infant faith—for, faith is as necessary to the infant as to the adult—may baffle our attempts at explanation and definition; but God who extends His promises also to children (<a onClick="return mV(\'Act\',2,39);">Ac 2:39</a>), who established His covenant even with beasts (<a onClick="return mV(\'Gen\',9,16,17);">Ge 9:16-17</a>); Christ who blessed also little children (<a onClick="return mV(\'Mar\',10,13);">Mr 10:13</a>ff), and spoke of them as believers (<a onClick="return mV(\'Mat\',18,6);">Mt 18:6</a>), certainly does not consider the regeneration of a child or infant a greater task than that of an adult (compare <a onClick="return mV(\'Mat\',18,3,4);">Mt 18:3-4</a>).<P>5. Why Did Paul not Baptize?:<P>Paul did baptize Crispus, Gaius and Stephanas with his household. These baptisms he performed at Corinth alone; we have no record of his baptisms at other places. What Paul declares in <a onClick="return mV(\'1Cr\',1,\'14-17\');">1Co 1:14-17</a> is, that by his baptizing he could not have become the cause of the divisions in the Corinthian congregation, because he had baptized only a few persons at Corinth, and, moreover, he had not baptized in his own name, hence had attached no one to his person. The statement, "Christ sent me not to baptize," is made after the Semitic idiom, and means: "not so much to baptize as to preach" (Farrar in Pulpit Commentary). If they are taken in any other sense, it is impossible to protect Paul against the charge that he did something that he was not authorized to do, when he baptized Crispus, etc.<P>6. What Is the Baptism for the Dead?:<P><a onClick="return mV(\'1Cr\',15,29);">1Co 15:29</a> is sometimes taken to mean that the early Christians practiced baptism by proxy. After they had been converted to Christianity, it is held, they desired to convey the benefits of their faith to their departed friends who had died in paganism, by having themselves baptized "in their behalf," perhaps on their graves. We have no evidence from history that such a practice prevailed in the early Christian churches. Nor does the text suggest it. The Greek preposition huper expresses also the motive that may prompt a person to a certain action. In this case the motive was suggested by the dead, namely, by the dead in so far as they shall rise. The context shows this to be the meaning: If a person has sought baptism in view of the fact that the dead are to rise to be judged, his baptism is valueless, if the dead do not rise.`<a href="./study/isbe/search.html?string=BAPTISM+FOR+THE+DEAD">BAPTISM FOR THE DEAD</a>`36';
isbe[1149]='Baptism (Non-Immersionist View)`<b>I. THE SCRIPTURAL NAMES FOR THE RITE</b><P><b>II. PRE-CHRISTIAN BAPTISM</b><P class="in15">1. Baptism of Proselytes<P class="in15">2. Baptism of John<P class="in15">3. Baptism in the Pagan Mysteries<P><b>III. CHRISTIAN BAPTISM</b><P class="in15">1. The administration of the Rite<P class="in15">2. The Mode of Using the Water<P class="in30">(1) Immersion<P class="in30">(2) Affusion<P class="in15"><P class="in30">(3) Aspersion<P class="in30">3. Who May Perform Baptism<P class="in15">4. Who May Receive Baptism<P class="in30">(1) Baptism of Infants<P class="in30">(2) Baptism for the Dead<P><b>IV. THE FORMULA OF BAPTISM</b><P><b>V. THE DOCTRINE OF BAPTISM</b><P class="in15">The Doctrine of Infant Baptism<P><b>LITERATURE</b><hr /><P>Baptism (baptisma, baptismos, baptizein) has been from the earliest times the initiatory rite signifying the recognition of entrance into or of presence within the Christian church. We find the earliest mention of the ceremony in the Epistle to the Galatians (<a onClick="return mV(\'Gal\',3,27);">Ga 3:27</a>), written about 20 years after the death of Jesus. There and in 1 Corinthians (<a onClick="return mV(\'1Cr\',1,13);">1Co 1:13</a>; <a onClick="return mV(\'1Cr\',12,13);">12:13</a>) Paul takes for granted that everyone who becomes a Christian (himself included) must be baptized. The rite seems also to have existed among the discipleship of Jesus before His death. We are told (<a onClick="return mV(\'Jhn\',4,1,2);">Joh 4:1-2</a>) that, although Jesus Himself did not baptize, His disciples did, and that their baptisms were more numerous than those of John.<P>I. The Scriptural Names for the Rite.<P>The words commonly used in the New Testament to denote the rite are the verb baptizo, and the nouns baptisma and baptismos; but none are employed in this sense alone. The verb is used to denote the ceremonial purification of the Jews before eating, by pouring water on the hands (<a onClick="return mV(\'Luk\',11,38);">Lu 11:38</a>; <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>); to signify the sufferings of Christ (<a onClick="return mV(\'Mar\',10,38,39);">Mr 10:38-39</a>; <a onClick="return mV(\'Luk\',12,50);">Lu 12:50</a>); and to indicate the sacrament of baptism. It is the intensive form of baptein, "to dip," and takes a wider meaning. The passages <a onClick="return mV(\'Luk\',11,38);">Lu 11:38</a> and <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a> show conclusively that the word does not invariably signify to immerse the whole body. Some have held that baptismos invariably means ceremonial purification, and that baptisma is reserved for the Christian rite; but the distinction can hardly be maintained. The former certainly means ceremonial purification in <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>, and in <a onClick="return mV(\'Mar\',7,8);">Mr 7:8</a> (the King James Version); but it probably means the rite of baptism in <a onClick="return mV(\'Hbr\',6,2);">Heb 6:2</a>. Exegetes find other terms applied to Christian baptism. It is called \'the Water\' in <a onClick="return mV(\'Act\',10,47);">Ac 10:47</a>: "Can any man forbid \'the Water,\' that these should not be baptized?"; the layer of the water in <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a> the Revised Version, margin (where baptism is compared to the bridal bath taken by the bride before she was handed over to the bridegroom); and perhaps the laver of regeneration in <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a> the Revised Version, margin (compare <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a>), and illumination in <a onClick="return mV(\'Hbr\',6,4);">Heb 6:4</a>; <a onClick="return mV(\'Hbr\',10,32);">10:32</a>.<P>II. Pre-Christian Baptism.<P>1. Baptism of Proselytes:<P>Converts in the early centuries, whether Jews or Gentiles, could not have found this initiatory rite, in which they expressed their new-born faith, utterly unfamiliar. Water is the element naturally used for cleansing the body and its symbolical use entered into almost every cult; and into none more completely than the Jewish, whose ceremonial washings were proverbial. Besides those the Jew had what would seem to the convert a counterpart of the Christian rite in the baptism of proselytes by which Gentiles entered the circle of Judaism. For the Jews required three things of strangers who declared themselves to be converts to the Law of Moses: circumcision, baptism, and to offer sacrifice if they were men: the two latter if they were women. It is somewhat singular that no baptism of proselytes is forthcoming until about the beginning of the 3rd century; and yet no competent scholar doubts its existence. Schurer is full of contempt for those who insist on the argument from silence. Its presence enables us to see both how Jews accepted readily the baptism of John and to understand the point of objectors who questioned his right to insist that all Jews had to be purified ere they could be ready for the Messianic kingdom, although he was neither the Messiah nor a special prophet (<a onClick="return mV(\'Jhn\',1,\'19-23\');">Joh 1:19-23</a>).<P>2. Baptism of John:<P>The baptism of John stood midway between the Jewish baptism of proselytes and Christian baptism. It differed from the former because it was more than a symbol of ceremonial purification; it was a baptism of repentance, a confession of sin, and of the need of moral cleansing, and was a symbol of forgiveness and of moral purity. All men, Jews who were ceremonially pure and Gentiles who were not, had to submit to this baptism of repentance and pardon. It differed from the latter because it only symbolized preparation to receive the salvation, the kingdom of God which John heralded, and did not imply entrance into that kingdom itself. Those who had received it, as well as those who had not, had to enter the Christian community by the door of Christian baptism (<a onClick="return mV(\'Act\',19,\'3-6\');">Ac 19:3-6</a>). The Jewish custom of baptizing, whether displayed in their frequent ceremonial washings, in the baptism of proselytes or in the baptism of John, made Christian baptism a familiar and even expected rite to Jewish converts in the 1st century.<P>3. Baptism in the Pagan Mysteries:<P>Baptism, as an initiatory rite, was no less familiar to Gentile converts who had no acquaintance with the Jewish religion. The ceremonial washings of the priests of pagan in the religions have been often adduced as something which might familiarize Gentile converts with the rite which introduced them into the Christian community, but they were not initiations. A more exact parallel is easily found. It is often forgotten that in the earlier centuries when Christianity was slowly making its way in the pagan world pagan piety had deserted the official religions and taken refuge within the Mysteries, and that these Mysteries represented the popular pagan religions of the times. They were all private cults into which men and women were received one by one, and that by rites of initiation which each had to pass through personally. When admitted the converts became members of coteries, large or small, of like-minded persons, who had become initiated because their souls craved something which they believed they would receive in and through the rites of the cult. These initiations were secret, jealously guarded from the knowledge of all outsiders; still enough is known about them for us to be sure that among them baptism took an important place (Apuleius Metamorphoses xi). The rite was therefore as familiar to pagan as to Jewish converts, and it was no unexpected requirement for the convert to know that baptism was the doorway into the church of Christ. These heathen baptisms, like the baptism of proselytes, were for the most part simply ceremonial purifications; for while it is true that both in the cult of the Mysteries and beyond it a mode of purifying after great crimes was baptizing in flowing water (Eurip. Iph. in Tauri 167) or in the sea, yet it would appear that only ceremonial purification was thought of. Nor were ceremonial rites involving the use of water confined to the paganism of the early centuries. Such a ceremony denoted the reception of the newly-born child into pagan Scandinavian households. The father decided whether the infant was to be reared or exposed to perish. If he resolved to preserve the babe, water was poured over it and a name was given to it.<P>III. Christian Baptism.<P>1. The Administration of the Rite:<P>In the administration of the rite of Christian baptism three things have to be looked at: the act of baptizing; those who are entitled to perform it; and the recipients or those entitled to receive it. A complete act of baptizing involves three things: what has been called the materia sacramenti; the method of its use; and the forma sacramenti, the baptismal formula or form of words accompanying the use of the water. The materia sacramenti is water and for this reason baptism is called the Water Sacrament. The oldest ecclesiastical manual of discipline which has descended to us, the Didache, says that the water to be preferred is "living," i.e. running water, water in a stream or river, or fresh flowing from a fountain; "But if thou hast not living water, baptize in other water; and if thou canst not in cold, then in warm" (c. 7). In those directions the prescriptions of the ceremonial for the Jewish baptism of proselytes are closely followed. The earlier canons of the church permit any kind of water, fresh or salt, provided only it be true and natural water (aqua vera et naturalis).<P>2. The Mode of Using the Water:<P>(1) Immersion.<P>The use of the water is called ablutio. According to the rules of by far the largest portion of the Christian church the water may be used in any one of three ways: Immersion, where the recipient enters bodily into the water, and where, during the action, the head is plunged either once or three times beneath the surface; affusion, where water was poured upon the head of the recipient who stood either in water or on dry ground; and aspersion where water was sprinkled on the head or on the face. It has frequently been argued that the word baptizein invariably means "to dip" or immerse, and that therefore Christian baptism must have been performed originally by immersion only, and that the two other forms of affusion and aspersion or sprinkling are invalid—that there can be no real baptism unless the method of immersion be used. But the word which invariably means "to dip" is not baptizein but baptein. Baptizein has a wider signification; and its use to denote the Jewish ceremonial of pouring water on the hands (<a onClick="return mV(\'Luk\',11,38);">Lu 11:38</a>; <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>), as has already been said, proves conclusively that it is impossible to conclude from the word itself that immersion is the only valid method of performing the rite. It may be admitted at once that immersion, where the whole body including the head is plunged into a pool of pure water, gives a more vivid picture of the cleansing of the soul from sin; and that complete surrounding with water suits better the metaphors of burial in <a onClick="return mV(\'Rom\',6,4);">Roman 6:4</a> and <a onClick="return mV(\'Col\',2,12);">Col 2:12</a>, and of being surrounded by cloud in <a onClick="return mV(\'1Cr\',10,2);">1Co 10:2</a>.<P>(2) Affusion.<P>On the other hand affusion is certainly a more vivid picture of the bestowal of the Holy Spirit which is equally symbolized in baptism. No definite information is given of the mode in which baptism was administered in apostolic times. Such phrases as "coming up out of the water," "went down into the water" (<a onClick="return mV(\'Mar\',1,10);">Mr 1:10</a>; <a onClick="return mV(\'Act\',8,38);">Ac 8:38</a>) are as applicable to affusion as to immersion. The earliest account of the mode of baptizing occurs in the Didache (c. 7), where it is said: "Now concerning Baptism, thus baptize ye: having first uttered all these things, baptize in the name of the Father, and of the Son and of the Holy Ghost, in living water. But if thou hast not living water, baptize in other water; and if thou canst not in cold, then in warm. But if thou hast neither, pour water upon the head thrice in the name of Father, and Son, and Holy Ghost." This seems to say that to baptize by immersion was the practice recommended for general use, but that the mode of affusion was also valid and enjoined on occasions. What is here prescribed in the Didache seems to have been the practice usually followed in the early centuries of the Christian church. Immersion was in common use: but affusion was also widely practiced: and both were esteemed usual and valid forms of baptizing. When immersion was used then the head of the recipient was plunged thrice beneath the surface at the mention of each name of the Trinity; when the mode was by affusion the same reference to the Trinity was kept by pouring water thrice upon the head. The two usages which were recognized and prescribed by the beginning of the 2nd century may have been in use throughout the apostolic period although definite information is lacking. When we remember the various pools in Jerusalem, and their use for ceremonial washings it is not impossible to suppose that the 3,000 who were baptized on the day of Pentecost may have been immersed, but, when the furnishing and conditions of Palestinian houses and of oriental jails are taken into account, it is difficult to conceive that at the baptisms of Cornelius and of the jailer, the ceremony was performed otherwise than by affusion. It is a somewhat curious fact that if the evidence from written texts, whether ancient canons or writings of the earlier Fathers, be studied by themselves, the natural conclusion would seem to be that immersion was the almost universal form of administering the rite; but if the witness of the earliest pictorial representation be collected, then we must infer that affusion was the usual method and that immersion was exceptional; for the pictorial representations, almost without exception, display baptism performed by affusion, i.e. the recipient is seen standing in water while the minister pours water on the head. It may therefore be inferred that evidence for the almost universal practice of immersion, drawn from the fact that baptisms took place in river pools (it is more than probable that when we find the names of local saints given to pools in rivers, those places were their favorite places of administering the rite), or from the large size of almost all early medieval baptisteries, is by no means so conclusive as many have supposed, such places being equally applicable to affusion. It is also interesting to remember that when most of the Anabaptists of the 16th century insisted on adult baptism (re-baptism was their name for it) immersion was not the method practiced by them. During the great baptismal scene in the market-place of the city of Munster the ordinance was performed by the ministers pouring three cans of water on the heads of the recipients. They baptized by affusion and not by immersion. This was also the practice among the Mennonites or earliest Baptists. This double mode of administering the sacrament—by immersion or by affusion—prevailed in the churches of the first twelve centuries, and it was not until the 13th that the practice of aspersio or sprinkling was almost universally employed.<P>(3) Aspersion.<P>The third method of administering baptism, namely, by aspersio or sprinkling, has a different history from the other two. It was in the early centuries exclusively reserved for sick and infirm persons too weak to be submitted to immersion or affusion. There is evidence to show that those who received the rite in this form were somewhat despised; for the nicknames clinici and grabatorii were, unworthily Cyprian declares, bestowed on them by neighbors. The question was even raised in the middle of the 3rd century, whether baptism by aspersio was a valid baptism and Cyprian was asked for his opinion on the matter. His answer is contained in his lxxvth epistle (lxix Hartel\'s ed.). There he contends that the ordinance administered this way is perfectly valid, and quotes in support of his opinion various Old Testament texts which assert the purifying effects of water sprinkled (<a onClick="return mV(\'Eze\',36,25,26);">Eze 36:25-26</a>; <a onClick="return mV(\'Num\',8,\'5-7\');">Nu 8:5-7</a>; <a onClick="return mV(\'Num\',19,8,9,12,13);">19:8-9, 12-13</a>). It is not the amount of the water or the method of its application which can cleanse from sin: "Whence it appears that the sprinkling also of water prevails equally with the washing of salvation...and that where the faith of the giver and receiver is sound, all things hold and may be consummated and perfected by the majesty of God and by the truth of faith." His opinion prevailed. Aspersio was recognized as a valid, though exceptional, form of baptism. But it was long of commending itself to ministers and people, and did not attain to almost general use until the 13th century.<P>The idea that baptism is valid when practiced in the one method only of immersion can scarcely be looked on as anything else than a ritualistic idea.<P>3. Who May Perform Baptism:<P>The Scripture nowhere describes or limits the qualifications of those who are entitled to perform the rite of baptism. We find apostles, wandering preachers (<a onClick="return mV(\'Act\',8,38);">Ac 8:38</a>), a private member of a small and persecuted community (<a onClick="return mV(\'Act\',9,18);">Ac 9:18</a>) performing the rite. So in the sub-apostolic church we find the same liberty of practice. Clement of Alexandria tells us that the services of Christian women were necessary for the work of Christian missions, for they alone could have access to the gynaeceum and carry the message of the gospel there (Strom., III, 6). Such women missionaries did not hesitate to baptize. Whatever credit may be given to the Acts of Paul and Theckla, it is at least historical that Theckla did exist, that she was converted by Paul, that she worked as a missionary and that she baptized her converts. Speaking generally it may be said that as a sacrament has always been looked upon as the recognition of presence within the Christian church, it is an act of the church and not of the individual believer; and therefore no one is entitled to perform the act who is not in some way a representative of the Christian community—the representative character ought to be maintained somehow. As soon as the community had taken regular and organized form the act of baptism was suitably performed by those who, as office-bearers, naturally represented the community. It was recognized that the pastor or bishop (for these terms were synonymous until the 4th century at least) ought to preside at the administration of the sacrament; but in the early church the power of delegation was recognized and practiced, and elders and deacons presided at this and even at the Eucharist. What has been called lay-baptism is not forbidden in the New Testament and has the sanction of the early church. When superstitious views of baptism entered largely into the church and it was held that no unbaptized child could be saved, the practice arose of encouraging the baptism of all weakling infants by nurses. The Reformed church protested against this and was at pains to repudiate the superstitious thought of any mechanical efficacy in the rite by deprecating its exercise by any save approved and ordained ministers of the church. Still, while condemning lay-baptism as irregular, it may be questioned whether they would assert any administration of the rite to be invalid, provided only it had been performed with devout faith on the part of giver and receiver.<P>4. Who May Receive Baptism:<P>The recipients of Christian baptism are all those who make a presumably sincere profession of repentance of sin and of faith in the Lord Jesus Christ, the Saviour; together with the children of such believing parents. The requirements are set forth in the accounts given us of the performance of the rite in the New Testament, in which we see how the apostles obeyed the commands of their Master. Jesus had ordered them to "make disciples of all the nations, baptizing them into the name of the Father and of the Son and of the Holy Spirit" (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>)—to "preach the gospel to the whole creation. He that believeth and is baptized shall be saved; but he that disbelieveth shall be condemned" (<a onClick="return mV(\'Mar\',16,15,16);">Mr 16:15-16</a>). The apostle Peter said to the inquirers on the Day of Pentecost, "Repent ye, and be baptized every one of you in the name of Jesus Christ unto the remission of your sins; and ye shall receive the gift of the Holy Spirit"; and 3,000 were added to the church through the initiatory rite of baptism. The Samaritans, who believed on Jesus through the preaching of Philip, were admitted to the Christian community through baptism; though in this case one of the baptized, Simon Magus, after his reception, was found to be still in "the bond of iniquity" (<a onClick="return mV(\'Act\',8,12,23);">Ac 8:12, 23</a>). The jailer and all his, Lydia and her household, at Philippi, were baptized by Paul on his and her profession of faith on Jesus, the Saviour. There is no evidence in any of the accounts we have of apostolic baptisms that any prolonged course of instruction was thought to be necessary; nothing of classes for catechumens such as we find in the early church by the close of the 2nd century, or in modern missionary enterprise. We find no mention of baptismal creeds, declarative or interrogative, in the New Testament accounts of baptisms. The profession of faith in the Lord Jesus, the Saviour, made by the head of the family appears, so far as the New Testament records afford us information, to have been sufficient to secure the baptism of the "household"—a word which in these days included both servants and children.<P>(1) Baptism of Infants.<P>This brings us to the much-debated question whether infants are to be recognized as lawful recipients of Christian baptism. The New Testament Scriptures do not in so many words either forbid or command the baptism of children. The question is in this respect on all fours with the change of the holy day from the seventh to the first day of the week. No positive command authorizes the universal usage with regard to the Christian Sabbath day; that the change is authorized must be settled by a weighing of evidence. So it is with the case of infant baptism. It is neither commanded nor forbidden in so many words; and the question cannot be decided on such a basis. The strongest argument against the baptizing of infants lies in the thought that the conditions of the rite are repentance and faith; that these must be exercised by individuals, each one for himself and for herself; and that infants are incapable either of repentance or of faith of this kind. The argument seems weak in its second statement; it is more dogmatic than historical; and will be referred to later when the doctrine lying at the basis of the rite is examined. On the other hand a great deal of evidence supports the view that the baptism of infants, if not commanded, was at least permitted and practiced within the apostolic church. Paul connects baptism with circumcision and implies that under the gospel the former takes the place of the latter (<a onClick="return mV(\'Col\',2,12);">Col 2:12</a>); and as children were circumcised on the 8th day after birth, the inference follows naturally that children were also to be baptized. In the Old Testament, promises to parents included their children. In his sermon on the Day of Pentecost Peter declares to his hearers that the gospel promise is "to you and to your children" and connects this with the invitation to baptism (<a onClick="return mV(\'Act\',2,38,39);">Ac 2:38-39</a>). It is also noteworthy that children shared in the Jewish baptism of proselytes. Then we find in the New Testament narratives of baptisms that "households" were baptized—of Lydia (<a onClick="return mV(\'Act\',16,15);">Ac 16:15</a>), of the jailer at Philippi (<a onClick="return mV(\'Act\',16,32);">Ac 16:32</a>), of Stephanas (<a onClick="return mV(\'1Cr\',1,16);">1Co 1:16</a>). It is never said that the children of the household were exempted from the sacred rite. One has only to remember the position of the head of the household in that ancient world, to recollect how the household was thought to be embodied in its head, to see how the repentance and faith of the head of the household was looked upon as including those of all the members, not merely children but servants, to feel that had the children been excluded from sharing in the rite the exclusion would have seemed such an unusual thing that it would have at least been mentioned and explained. our Lord expressly made very young children the types of those who entered into His kingdom (<a onClick="return mV(\'Mar\',10,\'14-16\');">Mr 10:14-16</a>); and Paul so unites parents with children in the faith of Christ that he does not hesitate to call the children of the believing husband or wife "holy," and to imply that the children had passed from a state of "uncleanness" to a state of "holiness" through the faith of a parent. All these things seem to point to the fact that the rite which was the door of entance into the visible community of the followers of Jesus was shared in by the children of believing parents. Besides evidence for the baptism of children goes back to the earliest times of the sub-apostolic church. Irenaeus was the disciple of Polycarp, who had been the disciple of John, and it is difficult to draw any other conclusion from his statements than that he believed that the baptism of infants had been an established practice in the church long before his days (Adv. Haer., II, 22; compare 39). The witness of Tertullian is specially interesting; for he himself plainly thinks that adult baptism is to be preferred to the baptism of infants. He makes it plain that the custom of baptizing infants existed in his days, and we may be sure from the character and the learning of the man, that had he been able to affirm that infant-baptism had been a recent innovation and had not been a long-established usage descending from apostolic times, he would certainly have had no hesitation in using what would have seemed to him a very convincing way of dealing with his opponents. Tertullian\'s testimony comes from the end of the 2nd century or the beginning of the 3rd century. Origen, the most learned Christian writer during the first three centuries and who comes a little later than Tertullian, in his 14th Homily on Luke bears witness to the fact that the baptism of infants was usual. He argues that original sin belongs to children because the church baptizes them. At the same time it is plain from a variety of evidence too long to cite that the baptism of infants was not a universal practice in the early church. The church of the early centuries was a mission church. It drew large numbers of its members from heathendom. In every mission church the baptism of adults will naturally take the foremost place and be most in evidence. But is is clear that many Christians were of the opinion of Tertullian and believed that baptism ought not to be administered to children but should be confined to adults. Nor was this a theory only; it was a continuous practice handed down from one generation to another in some Christian families. In the 4th century, few Christian leaders took a more important place than Basil the Great and his brother Gregory of Nyssa. They belonged to a family who had been Christians for some generations; yet neither of the brothers was baptized until after his personal conversion, which does not appear to have come until they had attained the years of manhood. The whole evidence seems to show that in the early church, down to the end of the 4th century at least, infant and adult baptism were open questions and that the two practices existed side by side with each other without disturbing the unity of the churches. In the later Pelagian controversy it became evident that theory and practice of infant baptism had been able to assert itself and that the ordinance was always administered to children of members of the church.<P>(2) Baptism for the Dead.<P>Paul refers to a custom of "baptizing for the dead" (<a onClick="return mV(\'1Cr\',15,29);">1Co 15:29</a>). What this "vicarious baptism" or "baptism for the dead" was it is impossible to say, even whether it was practiced within the primitive Christian church. The passage is a it very difficult one and has called forth a very large number of explanations, which are mere guesses. Paul neither commends nor disapproves of it; he simply mentions its existence and uses the fact as an argument for the resurrection. See <a href="./study/isbe/search.html?string=BAPTISM+FOR+THE+DEAD">BAPTISM FOR THE DEAD</a>.<P>IV. The Formula of Baptism.<P>The Formula of Christian baptism, in the mode which prevailed, is given in <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>: "I baptize thee in the name of the Father, of the Son, and of the Holy Ghost." But it is curious that the words are not given in any description of Christian baptism until the time of Justin Martyr: and there they are not repeated exactly but in a slightly extended and explanatory form. He says that Christians "receive the washing with water in the name of God, the Ruler and Father of the universe, and of our Saviour, Jesus Christ, and of the Holy Spirit" (1 Apol., 61). In every account of the performance of the rite in apostolic times a much shorter formula is in use. The 3,000 believers were baptized on the Day of Pentecost "in the name of Jesus" (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>); and the same formula was used at the baptism of Cornelius and those that were with him (<a onClick="return mV(\'Act\',10,48);">Ac 10:48</a>). Indeed it would appear to have been the usual one, from Paul\'s question to the Corinthians: "Were ye baptized into the name of Paul?" (<a onClick="return mV(\'1Cr\',1,13);">1Co 1:13</a>). The Samaritans were baptized "into the name of the Lord Jesus" (<a onClick="return mV(\'Act\',8,16);">Ac 8:16</a>); and the same formula (a common one in acts of devotion) was used in the case of the disciples at Ephesus. In some instances it is recorded that before baptism the converts were asked to make some confession of their faith, which took the form of declaring that Jesus was the Lord or that Jesus Christ was the Son of God. It may be inferred from a phrase in <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a> that a formal interrogation was made, and that the answer was an acknowledgment that Jesus Christ was Lord. Scholars have exercised a great deal of ingenuity in trying to explain how, with what appear to be the very words of Jesus given in the Gospel of Matthew, another and much shorter formula seems to have been used throughout the apostolic church. Some have imagined that the shorter formula was that used in baptizing disciples during the lifetime of our Lord (<a onClick="return mV(\'Jhn\',4,1,2);">Joh 4:1-2</a>), and that the apostles having become accustomed to it continued to use it during their lives. Others declare that the phrases "in the name of Jesus Christ" or "of the Lord Jesus" are not meant to give the formula of baptism, but simply to denote that the rite was Christian. Others think that the full formula was always used and that the narratives in the Book of Acts and in the Pauline Epistles are merely brief summaries of what took place—an idea rather difficult to believe in the absence of any single reference to the longer formula. Others, again, insist that baptism in the name of one of the persons of the Trinity implies baptism in the name of the Three. While others declare that Matthew does not give the very words of Jesus but puts in His mouth what was the common formula used at the date and in the district where the First Gospel was written. Whatever explanation be given it is plain that the longer formula became universal or almost universal in the sub-apostolic church. Justin Martyr has been already. quoted. Tertullian, nearly half a century later, declares expressly that the "law of baptism has been imposed and the formula prescribed" in <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a> (De Bapt., 13); and he adds in his Adversus Praxean (c. 26): "And it is not once only, but thrice, that we are immersed into the Three Persons, at each several mention of Their names." The evidence to show that the formula given by Matthew became the established usage is overwhelming; but it is more than likely that the use of the shorter formula did not altogether die out, or, if it did, that it was revived. The historian Socrates informs us that some of the more extreme Arians "corrupted" baptism by using the name of Christ only in the formula; while injunctions to use the longer formula and punishments, including deposition, threatened to those who presumed to employ the shorter which meet us in collections of ecclesiastical canons (Apos. Canons,43,50), prove that the practice of using the shorter formula existed in the 5th and 6th centuries, at all events in the East.<P>V. The Doctrine of Baptism.<P>The sacraments, and baptism as one of them, are always described to be<P>(1) signs representing as in a picture or figure spiritual benefits (<a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>), and also<P>(2) as seals or personal tokens and attestations corroborative of solemn promises of spiritual benefits.<P>Hence, the sacrament is said to have two parts: "the one an outward and sensible sign, used according to Christ\'s appointment; the other an inward and spiritual grace thereby signified." It is held, moreover, that when the rite of baptism has been duly and devoutly performed with faith on the part of both giver and receiver, the spiritual benefits do follow the performance of the rite. The question therefore arises: What are the spiritual and evangelical blessings portrayed and solemnly promised in baptism? In the New Testament we find that baptism is intimately connected with the following: with remission of sins, as in <a onClick="return mV(\'Act\',22,16);">Ac 22:16</a> ("Arise, and be baptized, and wash away thy sins"), and in <a onClick="return mV(\'Hbr\',10,22);">Heb 10:22</a>; with regeneration or the new birth, as in <a onClick="return mV(\'Tts\',3,6);">Tit 3:6</a> and <a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a> (this idea also entered into the baptism of proselytes and even into the thought of baptism in the Mysteries; neophytes were taught that in the water they died to their old life and began a new one (Apuleius Meta. xi)); with engrafting into Christ, with union with Him, as in <a onClick="return mV(\'Gal\',3,27);">Ga 3:27</a>—and union in definite ways, in His death, His burial and His resurrection, as in <a onClick="return mV(\'Rom\',6,\'3-6\');">Ro 6:3-6</a>; with entering into a new relationship with God, that of sonship, as in <a onClick="return mV(\'Gal\',3,26,27);">Ga 3:26-27</a>; with the bestowal of the Holy Spirit, as in <a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a>; with belonging to the church, as in <a onClick="return mV(\'Act\',2,41);">Ac 2:41</a>; with the gift of salvation, as in <a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>. From these and similar passages theologians conclude that baptism is a sign and seal of our engrafting into Christ and of our union with Him, of remission of sins, regeneration, adoption and life eternal; that the water in baptism represents and signifies both the blood of Christ, which takes away all our sins, and also the sanctifying influence of the Holy Spirit against the dominion of sin and the corruption of our human nature; and that baptizing with water signifies the cleansing from sin by the blood and for the merit of Christ, together with the mortification of sin and rising from sin to newness of life by virtue of the death and resurrection of Christ. Or to put it more simply: Baptism teaches that all who are out of Christ are unclean by reason of sin and need to be cleansed. It signifies that just as washing with water cleanses the body so God in Christ cleanses the soul from sin by the Holy Spirit and that we are to see in this cleansing not merely pardon but also an actual freeing of the soul from the pollution and power of sin and therefore the beginnings of a new life. The sacrament also shows us that the cleansing is reached only through connection with the death of Christ, and further that through the new life begun in us we become in a special way united to Christ and enter into a new and filial relationship with God. Probably all Christians, reformed and unreformed, will agree in the above statement of the doctrinal meaning in the rite of baptism; and also that when the sacrament is rightly used the inward and spiritual grace promised is present along with the outward and visible signs. But Romanists and Protestants differ about what is meant by the right use of the sacrament. They separate on the question of its efficacy. The former understand by the right use simply the correct performance of the rite and the placing no obstacle in the way of the flow of efficacy. The latter insist that there can be no right use of the sacrament unless the recipient exercises faith, that without faith the sacrament is not efficacious and the inward and spiritual blessings do not accompany the external and visible signs. Whatever minor differences divide Protestant evangelical churches on this sacrament they are all agreed upon this, that where there is no faith there can be no regeneration. Here emerges doctrinally the difference between those who give and who refuse to give the sacrament to infants.<P>The Doctrine of Infant Baptism:<P>The latter taking their stand on the fundamental doctrine of all evangelical Christians that faith is necessary to make any sacrament efficacious, and assuming that the effect of an ordinance is always tied to the precise time of its administration, insist that only adults can perform such a conscious, intelligent, and individually independent act of faith, as they believe all Protestants insist on scriptural grounds to be necessary in the right use of a sacrament. Therefore they refuse to baptize infants and young children.<P>The great majority of evangelical Protestants practice infant baptism and do not think, due explanations being given, that it in any way conflicts with the idea that faith is necessary to the efficacy of the sacrament. The Baptist position appears to them to conflict with much of the teaching of the New Testament. It implies that all who are brought up in the faith of Christ and within the Christian family still lack, when they come to years of discretion, that great change of heart and life which is symbolized in baptism, and can only receive it by a conscious, intelligent and thoroughly independent act of faith. This seems in accordance neither with Scripture nor with human nature. We are told that a child may be full of the Holy Ghost from his mother\'s womb (<a onClick="return mV(\'Luk\',1,15);">Lu 1:15</a>); that little children are in the kingdom of Christ (<a onClick="return mV(\'Mat\',19,14);">Mt 19:14</a>); that children of believing parents are holy (<a onClick="return mV(\'1Cr\',7,14);">1Co 7:14</a>). Is there nothing in the fact that in the New Testament as in the Old Testament the promise is "to you and your children"? Besides, the argument of those who oppose the baptism of infants, if logically carried out, leads to consequences which few of them would accept. Faith is as essential to salvation, on all evangelical theology, as it is for the right use of the sacrament; and every one of the arguments brought against the baptism of infants is equally applicable to the denial of their salvation. Nor can the Baptist position be said to be true to the facts of ordinary human nature. Faith, in its evangelical sense of fiducia or trust, is not such an abrupt thing as they make it. Their demand for such a conscious, intelligent, strictly individualist act of faith sets aside some of the deepest facts of human nature. No one, young or old, is entirely self-dependent; nor are our thoughts and trust always or even frequently entirely independent and free from the unconscious influences of others. We are interwoven together in society; and what is true generally reveals itself still more strongly in the intimate relations of the family. Is it possible in all cases to trace the creative effects of the subtle imperceptible influences which surround children, or to say when the slowly dawning intelligence is first able to apprehend enough to trust in half-conscious ways? It is but a shallow view of human nature which sets all such considerations on the one side and insists on regarding nothing but isolated acts of knowledge or of faith. With all those thoughts in their minds, the great majority of evangelical churches admit and enjoin the baptism of infants. They believe that the children of believing parents are "born within the church and have interest in the covenant of grace and a right to its seal." They explain that the efficacy of a sacrament is not rigidly tied to the exact time of administration, and can be appropriated whenever faith is kindled and is able to rest on the external sign, and that the spiritual blessings signified in the rite can be appropriated again and again with each fresh kindling of faith. They declare that no one can tell how soon the dawning intelligence may awaken to the act of appropriation. Therefore these churches instruct their ministers in dispensing the sacrament to lay vows on parents that they will train up the infants baptized "in the knowledge and fear of the Lord," and will teach them the great blessings promised to them in and through the sacrament and teach them to appropriate these blessings for themselves. They further enjoin their ministers to admonish all who may witness a baptismal service to look back on their own baptism in order that their faith may be stirred afresh to appropriate for themselves the blessings which accompany the proper use of the rite.<P>LITERATURE.<P>The literature on the subject of baptism is very extensive. It may be sufficient to select the following: J. S. Candlish, The Sacraments, 10th thousand, 1900; J. C. W. Augusti, Denkwurdigkeiten aus d. christ. Archaologie, V, 1820; Hofling, Das Sakrament der Taufe, 1846-48; J. B. Mozley, Review of the Baptismal Controversy, 2nd edition, 1895; W. Goode, The Doctrine of the Church of England as to the Effects of Baptism in the Case of Infants, 1849; W. Wall, History of Infant Baptism, 1705; E. B. Underhill, Confessions of Faith...of Baptist Churches of England (Hanserd Knollys Soc., IX), 1854.``99';
isbe[1150]='Baptism (The Baptist Interpretation)`bap\'-tiz-m:<P><b>I. MEANING OF BAPTISM</b><P class="in15">1. Terminology<P class="in15">2. Proselyte Baptism<P class="in15">3. Greek Usage<P class="in15">4. New Testament Usage<P class="in15">5. The Didache<P class="in15">6. Baptismal Regeneration<P><p>II. THE SUBJECTS OF BAPTISM</b><P><b>III. THE PRESENT OBLIGATION</b><P><b>LITERATURE</b><hr /><P>This article is not a discussion of the whole subject, but is merely a presentation of the Baptist interpretation of the ordinance. The origin and history of the ordinance, as a whole, do not come within the range of the present treatment.<P>I. Meaning of Baptism.<P>1. Terminology:<P>The verb used in the New Testament is (baptizo). The substantives baptisma and baptismos occur, though the latter is not used in the New Testament of the ordinance of baptism except by implication (<a onClick="return mV(\'Hbr\',6,2);">Heb 6:2</a>, "the teaching of baptisms") where the reference is to the distinction between the Christian ordinance and the Jewish ceremonial ablutions. Some documents have it also in <a onClick="return mV(\'Col\',2,12);">Col 2:12</a> (compare <a onClick="return mV(\'Hbr\',9,10);">Heb 9:10</a>, "divers washings") for a reference purely to the Jewish purifications (compare the dispute about purifying in <a onClick="return mV(\'Jhn\',3,25);">Joh 3:25</a>). The verb baptizo appears in this sense in <a onClick="return mV(\'Luk\',11,38);">Lu 11:38</a> (margin) where the Pharisee marveled that Jesus "had not first bathed himself before breakfast" (noon-day meal). The Mosaic regulations required the bath of the whole body (<a onClick="return mV(\'Lev\',15,16);">Le 15:16</a>) for certain uncleannesses. Tertullian (de Baptismo, XV) says that the Jew required almost daily washing. Herodotus (ii.47) says that if an Egyptian "touches a swine in passing with his clothes, he goes to the river and dips himself (bapto) from it" (quoted by Broadus in Commentary on Matthew, 333). See also the Jewish scrupulosity illustrated in Sirach 34:25 and Judith 12:7 where baptizo occurs. The same thing appears in the correct text in <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>, "And when they come from the market-place, except they bathemselves, they eat not." Here baptizo is the true text. The use of rhantizo ("sprinkle") is due to the difficulty felt by copyists not familiar with Jewish customs. See also the omission of "couches" in the same verse. The couches were "pallets" and could easily be dipped into water. It is noteworthy that here rhantizo is used in contrast with baptizo, showing that baptizo did not mean sprinkle. The term baptismos occurs in Josephus (Ant., XVIII, v, 2) in connection with John\'s baptism (compare also Irenaeus 686 B about Christ\'s baptism). In general, however, baptisma is the substantive found for the ordinance. The verb baptizo is in reality a frequentative or intensive of bapto ("dip"). Examples occur where that idea is still appropriate, as in <a onClick="return mV(\'2Ki\',5,14);">2Ki 5:14</a> (Septuagint) where Naaman is said to have "dipped himself seven times in the Jordan" (ebaptisato). The notion of repetition may occur also in Josephus (Ant., XV, iii, 3) in connection with the death of Aristobulus, brother of Mariamne, for Herod\'s friends "dipped him as he was swimming, and plunged him under water, in the dark of the evening." But in general the term baptizo, as is common with such forms in the late Greek, is simply equivalent to bapto (compare <a onClick="return mV(\'Luk\',16,24);">Lu 16:24</a>) and means "dip," "immerse," just as rhantizo, like rhaino, means simply "sprinkle."<P>If baptizo never occurred in connection with a disputed ordinance, there would be no controversy on the meaning of the word. There are, indeed, figurative or metaphorical uses of the word as of other words, but the figurative is that of immersion, like our "immersed in cares," "plunged in grief," etc. It remains to consider whether the use of the word for a ceremony or ordinance has changed its significance in the New Testament as compared with ancient Greek<P>It may be remarked that no Baptist has written a lexicon of the Greek language, and yet the standard lexicons, like that of Liddell and Scott, uniformly give the meaning of baptizo as "dip," "immerse." They do not give "pour" or "sprinkle," nor has anyone ever adduced an instance where this verb means "pour" or "sprinkle." The presumption is therefore in favor of "dip" in the New Testament.<P>2. Proselyte Baptism:<P>Before we turn directly to the discussion of the ceremonial usage, a word is called for in regard to Jewish proselyte baptism. It is still a matter of dispute whether this initiatory rite was in existence at the time of John the Baptist or not. Schurer argues ably, if not conclusively, for the idea that this proselyte baptism was in use long before the first mention of it in the 2nd century. (Compare The Jewish People in the Time of Jesus Christ, Div ii, II, 319ff; also Edersheim, Life and Times of Jesus, appendix, xii, Baptism of Proselytes). It matters nothing at all to the Baptist contention what is true in this regard. It would not be strange if a bath was required for a Gentile who became a Jew, when the Jews themselves required such frequent ceremonial ablutions. But what was the Jewish initiatory rite called proselyte baptism? Lightfoot (Horae Hebraicae, <a onClick="return mV(\'Mat\',3,7);">Mt 3:7</a>) gives the law for the baptism of proselytes: "As soon as he grows whole of the wound of circumcision, they bring him to Baptism, and being placed in the water they again instruct him in some weightier and in some lighter commands of the Law. Which being heard, he plunges himself and comes up, and, behold, he is an Israelite in all things." To this quotation Marcus Dods (Presbyterian) HDB adds: "To use Pauline language, his old man is dead and buried in the water, and he rises from this cleansing grave a new man. The full significance of the rite would have been lost had immersion not been practiced." Lightfoot says further: "Every person baptized must dip his whole body, now stripped and made naked, at one dipping. And wheresoever in the Law washing of the body or garments is mentioned, it means nothing else than the washing of the whole body." Edersheim (op. cit.) says: "Women were attended by those of their own sex, the rabbis standing at the door outside." Jewish proselyte baptism, an initiatory ceremonial rite, harmonizes exactly with the current meaning of baptizo already seen. There was no peculiar "sacred" sense that changed "dip" to "sprinkle."<P>3. Greek Usage:<P>The Greek language has had a continuous history, and baptizo is used today in Greece for baptism. As is well known, not only in Greece, but all over Russia, wherever the Greek church prevails, immersion is the unbroken and universal practice. The Greeks may surely be credited with knowledge of the meaning of their own language. The substitution of pouring or sprinkling for immersion, as the Christian ordinance of baptism, was late and gradual and finally triumphed in the West because of the decree of the Council of Trent. But the Baptist position is that this substitution was unwarranted and subverts the real significance of the ordinance. The Greek church does practice trine immersion, one immersion for each person of the Trinity, an old practice (compare ter mergitamur, Tertullian ii.79 A), but not the Scriptural usage. A word will be needed later concerning the method by which pouring crept in beside immersion in the 2nd and later centuries. Before we turn directly to the New Testament use of bapti zo it is well to quote from the Greek Lexicon of the Roman and Byzantine Periods by Professor E. A. Sophocles, himself a native Greek. He says (p. 297): "There is no evidence that Luke and Paul and the other writers of the New Testament put upon this verb meanings not recognized by the Greeks." We expect therefore to find in the New Testament "dip," as the meaning of this word in the ceremonial sense of an initiatory Christian rite. Thayer\'s Lexicon likewise defines the word in this ceremonial Christian use to mean "an immersion in water, performed as a sign of the removal of sin."<P>Baptists could very well afford to rest the matter right here. There is no need to call for the testimony of a single Baptist scholar on this subject. The world of scholarship has rendered its decision with impartiality and force on the side of the Baptists in this matter. A few recent deliverances will suffice. Dr. Alfred Plummer (Church of England) in his new Commentary on Matthew (p. 28) says that the office of John the Baptist was "to bind them to a new life, symbolized by immersion in water." Swete (Church of England) in his Commentary on Mark (p. 7) speaks of "the added thought of immersion, which gives vividness to the scene." The early Greek ecclesiastical writers show that immersion was employed (compare Barnabas, XI, 11): "We go down into the water full of sins and filth, and we come up bearing fruit in the heart." For numerous ecclesiastical examples see Sophocles\' Lexicon.<P>4. New Testament Usage:<P>But the New Testament itself makes the whole matter perfectly plain. The uniform meaning of "dip" for baptizo and the use of the river Jordan as the place for baptizing by John the Baptist makes inevitable the notion of immersion unless there is some direct contradictory testimony. It is a matter that should be lifted above verbal quibbling or any effort to disprove the obvious facts. The simple narrative in <a onClick="return mV(\'Mat\',3,6);">Mt 3:6</a> is that "they were baptized of him in the river Jordan." In <a onClick="return mV(\'Mar\',1,9,10);">Mr 1:9-10</a> the baptism is sharpened a bit in the use of eis and ek. Jesus "was baptized of John in (eis) the Jordan. And straightway coming up out of (ek) the water, he saw." So in <a onClick="return mV(\'Act\',8,38);">Ac 8:38</a> we read: "They both went down into (eis) the water, both Philip and the eunuch; and he baptized him. And when they came up out of (ek) the water, the Spirit...caught away Philip." If one could still be in doubt about the matter, Paul sets it at rest by the symbolism used in <a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>, "We were buried therefore with him through bapti sm into death: that like as Christ was raised from the dead through the glory of the Father, so we also might walk in newness of life." The submergence and emergence of immersion thus, according to Paul, symbolize the death and burial to sin on the one hand and the resurrection to the new life in Christ on the other. Sanday and Headlam (Church of England) put it thus in their Commentary on Romans (p. 153): "It expresses symbolically a series of acts corresponding to the redeeming acts of Christ. Immersion = Death. Submersion = Burial (the ratification of death). Emergence = Resurrection." In <a onClick="return mV(\'Col\',2,12);">Col 2:12</a> Paul again says: "having been buried with him in baptism, wherein ye were also raised with him through faith in the working of God, who raised him from the dead." The same image is here presented. Lightfoot (Church of England) on Colossians (p. 182) says: "Baptism is the grave of the old man, and the birth of the new. As he sinks beneath the baptismal waters, the believer buries there all his corrupt affections and past sins; as he emerges thence, he rises regenerate, quickened to new hopes and new life."<P>There is nothing in the New Testament to offset this obvious and inevitable interpretation. There are some things which are brought up, but they vanish on examination. The use of "with" after baptize in the English translation is appealed to as disproving immersion. It is enough to reply that the Committee of the American Standard Revision, which had no Baptist member at the final revision, substituted "in" for "with." Thus: "I indeed baptize you in water unto repentance" (<a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>; compare also <a onClick="return mV(\'Mar\',1,8);">Mr 1:8</a>). The use of both "with" and "in" in <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a> is a needless stickling for the use of the Greek en with the locative case. In <a onClick="return mV(\'Mar\',1,8);">Mr 1:8</a> en is absent in the best manuscripts, and yet the American Revisers correctly render "in." In <a onClick="return mV(\'Act\',1,5);">Ac 1:5</a> they seek to draw the distinction between the mere locative and en and the locative. As a matter of fact the locative case alone is amply sufficient in Greek without en for the notion of "in." Thus in <a onClick="return mV(\'Jhn\',21,8);">Joh 21:8</a> the translation is: "But the other disciples came in the little boat." There is no en in the Greek, but "the boat" is simply in the locative case. If it be argued that we have the instrumental case (compare the instrumental case of en as in <a onClick="return mV(\'Rev\',6,8);">Re 6:8</a>, "kill with sword"), the answer is that the way to use water as an instrument in dipping is to put the subject in the water, as the natural way to use the boat (<a onClick="return mV(\'Jhn\',21,8);">Joh 21:8</a>) as an instrument is to get into it. The presence or absence of en with baptizo is wholly immaterial. In either case "dip" is the meaning of the verb The objection that three thousand people could not have been immersed in Jerusalem on the day of Pentecost is superficial. Jerusalem was abundantly supplied with pools. There were 120 disciples on hand, most of whom were probably men (compare the 70 sent out before by Jesus). It is not at all necessary to suppose that the 12 (Matthias was now one of them) apostles did all the baptizing. But even so, that would be only 250 apiece. I myself have baptized 42 candidates in a half-hour in a creek where there would be no delay. It would at most be only a matter of four or five hours for each of the twelve. Among the Telugus this record has been far exceeded. It is sometimes objected that Paul could not have immersed the jailer in the prison; but the answer is that Luke does not say so. Indeed Luke implies just the opposite: "And he took (took along in the Greek, para) them the same hour of the night, and washed their stripes; and was baptized." He took Paul and Silas along with him and found a place for the baptism, probably, somewhere on the prison grounds. There is absolutely nothing in the New Testament to dispute the unvarying significance of baptizo.<P>5. The Didache:<P>Appeal has been made to the Teaching of the Twelve Apostles, which may belong to the first half of the 2nd century. Here for the first time pouring is distinctly admitted as an ordinance in place of immersion. Because of this remarkable passage it is argued by some that, though immersion was the normal and regular baptism, yet alongside of it, pouring was allowed, and that in reality it was a matter of indifference which was used even in the 1st century. But that is not the true interpretation of the facts in the case. The passage deserves to be quoted in full and is here given in the translation of Philip Schaff (Presbyterian) in his edition of the Didache (pp. 184ff): "Now concerning baptism, baptize thus: Having first taught all these things, baptize ye into (eis) the name of the Father, and of the Son, and of the Holy Ghost, in living water. And if thou hast not living water, baptize into other water; and if thou canst not in cold, then in warm (water). But if thou hast neither, pour water thrice upon the head in (eis) the name of the Father, and of the Son, and of the Holy Ghost." There is thus no doubt that early in the 2nd century some Christians felt that baptism was so important that, when the real baptism (immersion) could not be performed because of lack of water, pouring might be used in its place. This is absolutely all that can be deduced from this passage. It is to be noted that for pouring another word (ekcheo) is used, clearly showing that baptizo does not mean "to po ur." The very exception filed proves the Baptist contention concerning baptizo. Now in the New Testament baptizo is the word used for baptism. Ekcheo is never so used. Harnack in a letter to C. E. W. Dobbs, Madison, Ind. (published in The Independent for February 9, 1885), under date of January 16, 1885 says:<P>(1) Baptizein undoubtedly signifies immersion (eintauchen).<P>(2) No proof can be found that it signifies anything else in the New Testament and in the most ancient Christian literature. The suggestion regarding \'a sacred sense\' is out of the question.<P>This is the whole point of the Baptists admirably stated by Adolph Harnack. There is no thought of denying that pouring early in the 2nd century came to be used in place of immersion in certain extreme cases. The meaning of baptizo is not affected a particle by this fact. The question remains as to why this use of pouring in extreme cases grew up. The answer is that it was due to a mistaken and exaggerated estimate put upon the value of baptism as essential to salvation. Those who died without baptism were felt by some to be lost. Thus arose "clinic" baptisms.<P>6. Baptismal Regeneration:<P>(For the doctrine of baptismal regeneration see Justin Martyr, First Apology, 61.) Out of this perversion of the symbolism of baptism grew both pouring as an ordinance and infant baptism. If baptism is necessary to salvation or the means of regeneration, then the sick, the dying, infants, must be baptized, or at any rate something must be done for them if the real baptism (immersion) cannot be performed because of extreme illness or want of water. The Baptist contention is to protest against the perversion of the significance of baptism as the ruin of the symbol. Baptism, as taught in the New Testament, is the picture of death and burial to sin and resurrection to new life, a picture of what has already taken place in the heart, not the means by which spiritual change is wrought. It is a privilege and duty, not a necessity. It is a picture that is lost when something else is substituted in its place.<P>See <a href="./study/isbe/search.html?string=BAPTISMAL+REGENERATION">BAPTISMAL REGENERATION</a>.<P>II. The Subjects of Baptism.<P>It is significant that even the Teaching of the Twelve apostles with its exaggerated notion of the importance of baptism does not allow baptism of infants. It says: "Having first taught all these things." Instruction precedes baptism. That is a distinct denial of infant baptism. The uniform practice in the New Testament is that baptism follows confession. The people "confessing their sins" were baptized by John (<a onClick="return mV(\'Mat\',3,6);">Mt 3:6</a>). It is frankly admitted by Paedobaptist scholars that the New Testament gives no warrant for infant baptism. Thus Jacobus (Congregationalist) in the Standard Bible Dictionary says: "We have no record in the New Testament of the baptism of infants." Scott (Presbyterian) in the 1-vol HDB says: "The New Testament contains no explicit reference to the baptism of infants or young children." Plummer (Church of England), HDB, says: "The recipients of Christian baptism were required to repent and believe." Marcus Dods (Presbyterian), DCG, says: "A rite wherein by immersion in water the participant symbolizes and signalizes his transition from an impure to a pure life, his death to a past he abandons, and his new birth to a future he desires." It would be hard to state the Baptist interpretation in better terms. Thus no room is found in the New Testament for infant baptism which would symbolize what the infant did not experience or would be understood to cause the regeneration in the child, a form of sacramentalism repugnant to the New Testament teaching as understood by Baptists. The dominant Baptist note is the soul\'s personal relation to God apart from ordinance, church or priest. The infant who dies unbaptized is saved without baptism. The baptized individual, child (for children are often baptized by Baptists, children who show signs of conversion) or man, is converted before his baptism. The baptism is the symbol of the change already wrought. So clear is this to the Baptist that he bears continual protest against that perversion of this beautiful ordinance by those who treat it as a means of salvation or who make it meaningless when performed before conversion. Baptism is a preacher of the spiritual life. The Baptist contention is for a regenerated church membership, placing the kingdom before the local church. Membership in the kingdom precedes membership in the church. The passages quoted from the New Testament in support of the notion of infant baptism are wholly irrelevant, as, for instance, in <a onClick="return mV(\'Act\',2,39);">Ac 2:39</a> where there is no such idea as baptism of infants. So in <a onClick="return mV(\'1Cr\',7,14);">1Co 7:14</a>, where note husband and wife. The point is that the marriage relation is sanctified and the children are legitimate, though husband or wife be heathen. The marriage relation is to be maintained. It is begging the question to assume the presence of infants in the various household baptisms in Acts. In the case of the family of Cornelius they all spake with tongues and magnified God (<a onClick="return mV(\'Act\',10,46);">Ac 10:46</a>). The jailer\'s household "rejoiced greatly" (<a onClick="return mV(\'Act\',16,34);">Ac 16:34</a>). We do not even know that Lydia was married. Her household may have been merely her employes in her business. The New Testament presents no exceptions in this matter.<P>III. The Present Obligation.<P>The Baptists make one more point concerning baptism. It is that, since Jesus himself submitted to it and enjoined it upon His disciples, the ordinance is of perpetual obligation. The arguments for the late ecclesiastical origin of <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a> are not convincing. If it seem st
