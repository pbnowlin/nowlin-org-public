range that Jesus should mention the three persons of the Trinity in connection with the command to baptize, one should remember that the Father and the Spirit were both manifested to Him at His baptism. It was not a mere ceremonial ablution like the Jewish rites. It was the public and formal avowal of fealty to God, and the names of the Trinity properly occur. The new heart is wrought by the Holy Spirit. Reconciliation with the Father is wrought on the basis of the work of the Son, who has manifested the Father\'s love in His life and death for sin. The fact that in the acts in the examples of baptism only the name of Jesus occurs does not show that this was the exact formula used. It may be a mere historical summary of the essential fact. The name of Jesus stood for the other two persons of the Trinity. On the other hand the command of Jesus may not have been regarded as a formula for baptism; while in no sense sacramental or redemptive, it is yet obligatory and of perpetual significance. It is not to be dropped as one of the Jewish excrescences on Christianity. The form itself is necessary to the significance of the rite. Hence, Baptists hold that immersion alone is to be practiced, sinc e immersion alone was commanded by Jesus and practiced in the New Testament times. Immersion alone sets forth the death to sin, and burial in the grave the resurrection to new life in Christ. Baptism as taught in the New Testament is "a mould of doctrine," a preacher of the heart of the gospel. Baptists deny the right of disciples of Jesus to break that mould. The point of a symbol is the form in which it is cast. To change the form radically is to destroy the symbolism. Baptists insist on the maintenan ce of primitive New Testament baptism because it alone is baptism, it alone proclaims the death and resurrection of Jesus, the spiritual death and resurrection of the believer, the ultimate resurrection of the believer from the grave. The disciple is not above his Lord, and has no right to destroy this rich and powerful picture for the sake of personal convenience, nor because he is willing to do something else which Jesus did not enjoin and which has no association with Him. The long years of perversion do not justify this wrong to the memory of Jesus, but all the more call upon modern disciples to follow the example of Jesus who himself fulfilled righteousness by going into the waters of the Jordan and receiving immersion at the hands of John the Baptist.<P>LITERATURE.<P>The Greek Lexicons, like Suicer, Liddell and Scott, Sophocles, Thayer, Preuschen; the Biblical Dictionaries; the Critical Commentaries on the New Testament; books of antiquities like Smith\'s Dictionary of Christian Antiquities; the new Sch-Herz; Binghara\'s Antiquities of the Christian Church; Schaff\'s Creeds of Christendom; Neale\'s History of the Holy Eastern Church; Lives of Christ, like Edersheim\'s LTJM, or a survey of the customs of the Jews like Schurer\'s HJP; books on John the Baptist like Reynolds\' John the Baptist, Feather\'s Last of the Prophets, Robertson\'s John the Loyal; special treatises on Baptism like Wall\'s History of Infant Baptism, Stanley\'s Christian Institutions, Dargan\'s Ecclesiology, Conant\'s Baptizein, Mozley\'s Review of the Baptismal Controversy, Christian\'s Immersion, Broadus\' Immersion, Frost\'s The Moral Dignity of Baptism, Whitsitt\'s a Question in Baptist History, Lofton\'s The Baptist Reformation, Lambert\'s The Sacraments of the New Testament, Dale\'s Classic Baptism and Christian and Patristic Baptism, Kirtley\'s Design of Baptism, Forester\'s The Baptist Position, Frost\'s Baptist Why and Why Not, Ford\'s Studies in Baptism.``150';
isbe[1151]='Baptism For the Dead`(baptizomai huper ton nekron).<P>1. Paul\'s Argument:<P>Some of the Corinthian Christians denied the resurrection of the dead, and Paul advances three arguments to convince them that the dead will be raised:<P>(1) "If there is no resurrection of the dead, neither hath Christ been raised," but Christ is raised (<a onClick="return mV(\'1Cr\',15,13,20);">1Co 15:13, 20</a>).<P>(2) If the dead are not raised, why are men being baptized for the dead (<a onClick="return mV(\'1Cr\',15,29);">1Co 15:29</a>)?<P>(3) Why should the apostle himself wage his spiritual warfare (<a onClick="return mV(\'1Cr\',15,30);">1Co 15:30</a>)? The first argument rests upon the central fact of Christianity, and the other two are appeals to the consistency of the Corinthians, and of Paul himself. Whatever "baptism for the dead" meant, it was, in Paul\'s opinion, as real, valid and legitimate a premise from which to conclude that the dead would rise as his own sufferings. The natural meaning of the words is obvious. Men in Corinth, and possibly elsewhere, were being continually baptized on behalf of others who were at the time dead, with a view to benefiting them in the resurrection, but if there be no resurrection, what shall they thus accomplish, and why do they do it? "The only legitimate reference is to a practice...of survivors allowing themselves to be baptized on behalf of (believing?) friends who had died without baptism" (Alford in the place cited.).<P>2. Patristic Evidence:<P>Tertullian believed that Paul referred to a custom of vicarious baptism (Res., 48c; Adv. Marc., 5.10). There is evidence that the early church knew such a practice. Epiphanius mentions a tradition that the custom obtained among the Cerinthians (Haer., 28 6). And Chrysostom states that it prevailed among the Marcionites.<P>3. Modern Views:<P>But commentators have offered between thirty and forty other interpretations, more or less strained, of the passage. (For a summary of different views see T. C. Edwards and Stanley, Comms., at the place) Two of the most reasonable views from recent commentators are: "What shall they do who receive baptism on account of the dead? i.e. with a view to the resurrection of the dead?" and therefore to sharing in it themselves (Canon Evans, Speaker\'s Comm., at the place); "that the death of Christians led to the conversion of survivors, who in the first instance \'for the sake of the dead\' (their beloved dead), and in the hope of reunion, turn to Christ" (Findlay, Expositor\'s Greek Test., at the place). Both ideas may be true, but they are simply imported into this passage, and the latter also is quite irrelevant to the argument and makes Paul identify conversion with baptism.<P>4. The Difficulty:<P>But why is all this ingenuity expended to evade the natural meaning? Because<P>(1) such a custom would be a superstition involving the principle of opus operarum; and<P>(2) Paul could not share or even tolerate a contemporary idea which is now regarded as superstition.<P>To reply (with Alford) that Paul does not approve the custom will not serve the purpose, for he would scarcely base so great an argument, even as an argumentum ad hominem, on a practice which he regarded as wholly false and superstitious. The retort of those who denied the resurrection would be too obvious. But why should it be necessary to suppose that Paul rose above all the limitations of his age? The idea that symbolic acts had a vicarious significance had sunk deeply into the Jewish mind, and it would not be surprising if it took more than twenty years for the leaven of the gospel to work all the Jew out of Paul. At least it serves the apostle\'s credit ill to make his argument meaningless or absurd in order to save him from sharing at all in the inadequate conceptions of his age. He made for himself no claim of infallibility.``145';
isbe[1152]='Baptism of Fire`(en pneumati hagio kai puri): This expression is used in <a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>. The copulative kai requires that the baptism "in the Holy Ghost and in fire," should be regarded as one and the same thing. It does violence to the construction, therefore, to make this statement refer to the fire Of judgment. The difficulty has always been in associating fire with the person of the Holy Ghost. But in the connection of fire with the work or influence of the Holy Ghost the difficulty disappears. The thought of John is that the Saviour would give them the Divine Sanctifier as purifying water to wash away their sins and as a refining fire to consume their dross; to kindle in their hearts the holy flame of Divine love and zeal; to illuminate their souls with heavenly wisdom. The statement, therefore, in this verse indicates the manner in which Christ will admit them to discipleship and prepare them for His service.`<a href="./study/isbe/search.html?string=BAPTISM">BAPTISM</a>; <a href="./study/isbe/search.html?string=FIRE">FIRE</a>`87';
isbe[1153]='Baptism of the Holy Spirit`1. The Biblical Material:<P>The expression "baptism of the Holy Spirit" is based on a number of predictions found in our four Gospels and in connection with these the record of their fulfillment in the Book of Acts. The passages in the Gospels are as follows: <a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>: "I indeed baptize you in water unto repentance: but he that cometh after me is mightier than I, whose shoes I am not worthy to bear: he shall baptize you in the Holy Spirit and in fire." The last clause is autos humas baptisei en pneumati hagio kai puri. In <a onClick="return mV(\'Mar\',1,8);">Mr 1:8</a> and <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a> we have the declaration in a slightly modified form; and in <a onClick="return mV(\'Jhn\',1,33);">Joh 1:33</a> John the Baptist declares that the descent of the Spirit upon Jesus at the baptism of the latter marked out Jesus as "he that baptizeth in the Holy Spirit." Again in <a onClick="return mV(\'Jhn\',7,37,38);">Joh 7:37-38</a> we read: "Now on the last day, the great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me and drink. He that believeth on me, as the scripture hath said, from within him shall flow rivers of living water." Then the evangelist adds in <a onClick="return mV(\'Jhn\',7,39);">Joh 7:39</a>: "But this spake he of the Spirit, which they that believed on him were to receive: for the Spirit was not yet given; because Jesus was not yet glorified." These are the specific references in the four Gospels to the baptisms of the Holy Spirit. In Acts we find direct reference by Luke to the promised baptism in the Holy Spirit. In <a onClick="return mV(\'Act\',1,5);">Ac 1:5</a> Jesus, just before the ascension, contrasts John\'s baptism in water with the baptism in the Holy Spirit which the disciples are to receive "not many days hence," and in <a onClick="return mV(\'Act\',1,8);">Ac 1:8</a> power in witnessing for Jesus is predicted as the result of the baptism in the Holy Spirit. On the evening of the resurrection day Jesus appeared to the disciples and "he breathed on them, and saith unto them, Receive ye the Holy Spirit" (<a onClick="return mV(\'Jhn\',20,22);">Joh 20:22</a>). This was probably not a wholly symbolic act but an actual communication to the disciples, in some measure, of the gift of the Spirit, preliminary to the later complete bestowal.<P>We observe next the fulfillment of these predictions as recorded in Acts. The gift of the Holy Spirit on the Day of Pentecost and the miraculous manifestations which followed are clearly the chief historical fulfillment of the prediction of the baptism of the Holy Spirit. Among the manifestations of the coming of the Spirit at Pentecost were first those which were physical, such as "a sound as of the rushing of a mighty wind, and it filled all the house where they were sitting" (<a onClick="return mV(\'Act\',2,2);">Ac 2:2</a>), and the appearance of "tongues parting asunder, like as of fire; and it sat upon each one of them" (<a onClick="return mV(\'Act\',2,3);">Ac 2:3</a>). Secondly, there were spiritual results: "And they were all filled with the Holy Spirit, and began to speak with other tongues, as the Spirit gave them utterance" (<a onClick="return mV(\'Act\',2,4);">Ac 2:4</a>). In <a onClick="return mV(\'Act\',2,16);">Ac 2:16</a>ff Peter declares that this bestowment of the Holy Spirit is in fulfillment of the prediction made by the prophet Joel and he cites the words in <a onClick="return mV(\'Act\',2,28);">Ac 2:28</a>ff of Joel\'s prophecy.<P>There is one other important passage in Acts in which reference is made to the baptism of the Holy Spirit. While Peter was speaking to Cornelius (<a onClick="return mV(\'Act\',10,44);">Ac 10:44</a>) the Holy Spirit fell on all that heard the word and they of the circumcision who were with Peter "were amazed" "because that on the Gentiles also was poured out the gift of the Holy Spirit." When giving the brethren at Jerusalem an account of his visit to Cornelius, Peter declares that this event which he had witnessed was a baptism of the Holy Spirit (<a onClick="return mV(\'Act\',11,16);">Ac 11:16</a>): "And I remembered the word of the Lord, how he said, John indeed baptized with water; but ye shall be baptized in the Holy Spirit."<P>2. Significance of Baptism of the Holy Spirit:<P>We consider next the significance of the baptism of the Holy Spirit from various points of view.<P>(1) From the Point of View of Old Testament Teaching as to the Gift of the Spirit.<P>The prophecy of Joel quoted by Peter indicates something extraordinary in the gift of the Spirit at Pentecost. The Spirit now comes in new forms of manifestation and with new power. The various classes mentioned as receiving the Spirit indicate the wide diffusion of the new power. In the Old Testament usually the Spirit was bestowed upon individuals; here the gift is to the group of disciples, the church. Here the gift is permanently bestowed, while in the Old Testament it was usually transient and for a special purpose. Here again the Spirit comes in fullness as contrasted with the partial bestowment in Old Testament times.<P>(2) From the Point of View of the Ascended Christ.<P>In <a onClick="return mV(\'Luk\',24,49);">Lu 24:49</a> Jesus commands the disciples to tarry in the city "until ye be clothed with power from on high," and in <a onClick="return mV(\'Jhn\',15,26);">Joh 15:26</a> He speaks of the Comforter "whom I will send unto you from the Father," "he shall bear witness of me"; and in <a onClick="return mV(\'Jhn\',16,13);">Joh 16:13</a> Jesus declares that the Spirit when He comes shall guide the disciples into all truth, and He shall show them things to come. In this verse the Spirit is called the Spirit of truth. It was fitting that the Spirit who was to interpret truth and guide into all truth should come in fullness after, rather than before, the completion of the life-task of the Messiah. The historical manifestation of Divine truth as thus completed made necessary the gift of the Spirit in fullness. Christ Himself was the giver of the Spirit. The Spirit now takes the place of the ascended Christ, or rather takes the things of Christ and shows them to the disciples. The baptism of the Spirit at Pentecost thus becomes the great historic event signalizing the beginning of a new era in the kingdom of God in which the whole movement is lifted to the spiritual plane, and the task of evangelizing the world is formally begun.<P>(3) The Significance of the Baptism of the Spirit from the Point of View of the Disciples.<P>It can scarcely be said with truth that Pentecost was the birthday of the church. Jesus had spoken of His church during His earthly ministry. The spiritual relation to Christ which constitutes the basis of the church existed prior to the baptism of the Holy Spirit. But that baptism established the church in several ways. First in unity. The external bond of unity now gives place to an inner spiritual bond of profound significance. Secondly, the church now becomes conscious of a spiritual mission, and theocratic ideals of the kingdom disappear. Thirdly, the church is now endued with power for its work. Among the gifts bestowed were the gift of prophecy in the large sense of speaking for God, and the gift of tongues which enabled disciples to speak in foreign tongues. The account in the second chapter of Acts admits of no other construction. There was also bestowed power in witnessing for Christ. This was indeed one of the most prominent blessings named in connection with the promise of the baptism of the Spirit. The power of working miracles was also bestowed (<a onClick="return mV(\'Act\',3,4);">Ac 3:4</a>ff; <a onClick="return mV(\'Act\',5,12);">5:12</A>ff). Later in the epistles of Paul much emphasis is given to the Spirit as the sanctifying agency in the hearts of believers. In Acts the word of the Spirit is chiefly Messianic, that is, the Spirit\'s activity is all seen in relation to the extension of the Messianic kingdom. The occasion for the outpouring of the Spirit is Pentecost when men from all nations are assembled in Jerusalem. The symbolic representation of tongues of fire is suggestive of preaching, and the glossolalia, or speaking with tongues which followed, so that men of various nations heard the gospel in their own languages, indicates that the baptism of the Spirit had a very special relation to the task of world-wide evangelization for the bringing in of the kingdom of God.<P>3. Finality of the Baptism of the Holy Spirit:<P>The question is often raised whether or not the baptism of the Holy Spirit occurred once for all or is repeated in subsequent baptisms. The evidence seems to point to the former view to the extent at least of being limited to outpourings which took place in connection with events recorded in the early chapters of the Book of Acts. The following considerations favor this view:<P>(1) In the first chapter of Acts, Jesus predicts, according to Luke\'s account, that the baptism of the Holy Spirit would take place, "not many days hence" (<a onClick="return mV(\'Act\',1,5);">Ac 1:5</a>). This would seem to point to a definite and specific event rather than to a continuous process.<P>(2) Again, Peter\'s citation in <a onClick="return mV(\'Act\',2,\'17-21\');">Ac 2:17-21</a> of Joel\'s prophecy shows that in Peter\'s mind the event which his hearers were then witnessing was the definite fulfillment of the words of Joel.<P>(3) Notice in the third place that only one other event in the New Testament is described as the baptism of the Holy Spirit, and for special reasons this may be regarded as the completion of the Pentecostal baptism. The passage is that contained in <a onClick="return mV(\'Act\',10,\'1-\');">Ac 10:1</a>-<a onClick="return mV(\'Act\',11,\'1-18\');">11:18</a></a> in which the record is given of the following events:<P>(a) miraculous vision given to Peter on the housetop (<a onClick="return mV(\'Act\',10,\'11-16\');">Ac 10:11-16</a>) indicating that the things about to occur are of unique importance;<P>(b) the speaking with tongues (<a onClick="return mV(\'Act\',10,45,46);">Ac 10:45-46</a>);<P>(c) Peter declares to the brethren at Jerusalem that the Holy Ghost fell on the Gentiles in this instance of Cornelius and his household "as on us at the beginning" (<a onClick="return mV(\'Act\',11,15);">Ac 11:15</a>);<P>(d) Peter also declares that this was a fulfillment of the promise of the baptism of the Holy Spirit (<a onClick="return mV(\'Act\',11,16,17);">Ac 11:16-17</a>);<P>(e) the Jewish Christians who heard Peter\'s account of the matter acknowledged this as proof that God had also extended the privileges of the gospel to the Gentiles (<a onClick="return mV(\'Act\',11,18);">Ac 11:18</a>). The baptism of the Holy Spirit bestowed upon Cornelius and his household is thus directly linked with the first outpouring at Pentecost, and as the event which signalized the opening of the door of the gospel formally to Gentiles it is in complete harmony with the missionary significance of the first great Pentecostal outpouring. It was a turning point or crisis in the Messianic kingdom and seems designed to complete the Pentecostal gift by showing that Gentiles as well as Jews are to be embraced in all the privileges of the new dispensation.<P>(4) We observe again that nowhere in the epistles do we find a repetition of the baptism of the Spirit. This would be remarkable if it had been understood by the writers of the epistles that the baptism of the Spirit was frequently to be repeated. There is no evidence outside the Book of Acts that the baptism of the Spirit ever occurred in the later New Testament times. In <a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a> Paul says, "For in one Spirit were we all baptized into one body,...and were all made to drink of one Spirit." But here the reference is not to the baptism of the Spirit, but rather to a baptism into the church which is the body of Christ. We conclude, therefore, that the Pentecostal baptism taken in conjunction with the baptism of the Spirit in the case of Cornelius completes the baptism of the Holy Spirit according to the New Testament teaching. The baptism of the Spirit as thus bestowed was, however, the definite gift of the Spirit in His fullness for every form of spiritual blessing necessary in the progress of the kingdom and as the permanent and abiding gift of God to His people. In all subsequent New Testament writings there is the assumption of this presence of the Spirit and of His availability for all believers. The various commands and exhortations of the epistles are based on the assumption that the baptism of the Spirit has already taken place, and that, according to the prediction of Jesus to the disciples, the Spirit was to abide with them forever (<a onClick="return mV(\'Jhn\',14,16);">Joh 14:16</a>). We should not therefore confound other forms of expression found in the New Testament with the baptism of the Holy Spirit. When Christians are enjoined to "walk by the Spirit" (<a onClick="return mV(\'Gal\',5,16);">Ga 5:16</a>) and "be filled with the Spirit" (<a onClick="return mV(\'Eph\',5,18);">Eph 5:18</a>), or when the Spirit is described as an anointing (chrisma) as in <a onClick="return mV(\'1Jo\',2,\'20-27\');">1Jo 2:20-27</a>, and as the "earnest of our inheritance" (arrabon). as in <a onClick="return mV(\'Eph\',1,14);">Eph 1:14</a>, and when various other similar expressions are employed in the epistles of the New Testament, we are not to understand the baptism of the Holy Spirit. These expressions indicate aspects of the Spirit\'s work in believers or of the believer\'s appropriation of the gifts and blessings of the Spirit rather than the historical baptism of the Spirit.<P>4. Relation of Baptism of the Spirit to Other Baptisms:<P>Three final points require brief attention, namely, the relation of the baptism of the Spirit to the baptism in water, and to the baptism in fire, and to the laying on of hands.<P>(1) We note that the baptism in fire is coupled with the baptism in the Spirit in <a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a> and in <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>. These passages give the word of John the Baptist. John speaks of the coming One who "shall baptize you in the Holy Spirit and in fire" (<a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>). This baptism in fire is often taken as being parallel and synonymous with the baptism in the Spirit. The context however in both Matthew and Luke seems to favor another meaning. Jesus\' Messianic work will be both cleansing and destructive. The "you" addressed by John included the people generally and might naturally embrace both classes, those whose attitude to Jesus would be believing and those who would refuse to believe. His action as Messiah would affect all men. Some He would regenerate and purify through the Holy Ghost. Others He would destroy through the fire of punishment. This view is favored by the context in both gospels. In both the destructive energy of Christ is coupled with His saving power in other terms which admit of no doubt. The wheat He gathers into the garner and the chaff He burns with unquenchable fire.<P>(2) The baptism of the Holy Spirit was not meant to supersede water baptism. This is clear from the whole of the history in the Book of Acts, where water baptism is uniformly administered to converts after the Pentecostal baptism of the Spirit, as well as from the numerous references to water baptisms in the epistles. The evidence here is so abundant that it is unnecessary to develop it in detail. See <a onClick="return mV(\'Rom\',6,3);">Ro 6:3</a>; <a onClick="return mV(\'1Cr\',1,\'14-17\');">1Co 1:14-17</a>; <a onClick="return mV(\'1Cr\',10,2);">10:2</a>; <a onClick="return mV(\'1Cr\',12,13);">12:13</a>; <a onClick="return mV(\'1Cr\',15,29);">15:29</a>; <a onClick="return mV(\'Gal\',3,27);">Ga 3:27</a>; <a onClick="return mV(\'Eph\',4,5);">Eph 4:5</a>; <a onClick="return mV(\'Col\',2,12);">Col 2:12</a>; <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>.<P>(3) In <a onClick="return mV(\'Act\',8,17);">Ac 8:17</a> and <a onClick="return mV(\'Act\',19,6);">19:6</a> the Holy Spirit is bestowed in connection with the laying on of the hands of apostles, but these are not to be regarded as instances of the baptism of the Spirit in the strict sense, but rather as instances of the reception by believers of the Spirit which had already been bestowed in fullness at Pentecost.<P>LITERATURE.<P>Arts. on Holy Spirit in Hastings, Dictionary of the Bible (five volumes) and Hastings, Dictionary of Christ and the Gospels; article on "Spiritual Gifts" in Encyclopedia Biblica; Moule, Veni Creator; Smeaton, The Doctrine of the Holy Spirit; Kuyper, The Work of the Holy Spirit.`<a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>`127';
isbe[1154]='Baptism, Infant``<a href="./study/isbe/search.html?string=BAPTISM">BAPTISM</a>`1';
isbe[1155]='Baptismal Regeneration`bap-tiz\'-mal re-jen-er-a\'-shun: As indicated in the general articles on <a href="./study/isbe/search.html?string=BAPTISM">BAPTISM </a>and <a href="./study/isbe/search.html?string=SACRAMENTS">SACRAMENTS</a>, the doctrine ordinarily held by Presbyterians, Congregationalists, Baptists, Methodists, and also by Low-Church Episcopalians, differs from that of the Roman and Greek churches, and of High-Church Anglicans, in its rejection of the idea that baptism is the instrumental cause of regeneration, and that the grace of regeneration is effectually conveyed through the administration of that rite wherever duly performed. The teaching of Scripture on this subject is held to be that salvation is immediately dependent on faith, which, as a fruit of the operation of the Spirit of God in the soul, already, in its reception of Christ, implies the regenerating action of that Spirit, and is itself one evidence of it. To faith in Christ is attached the promise of forgiveness, and of all other blessings. Baptism is administered to those who already possess (at least profess) this faith, and symbolizes the dying to sin and rising to righteousness implicit in the act of faith (<a onClick="return mV(\'Rom\',6,\'1-\');">Ro 6</a>). It is the symbol of a cleansing from sin and renewal by God\'s Spirit, but not the agency effecting that renewal, even instrumentally. Baptism is not, indeed, to be regarded as a bare symbol. It may be expected that its believing reception will be accompanied by fresh measures of grace, strengthening and fitting for the new life. This, however, as the life is already there, has nothing to do with the idea of baptism as an opus operatum, working a spiritual change in virtue of its mere administration. In Scripture the agency with which regeneration is specially connected is the Divine "word" (compare <a onClick="return mV(\'1Pe\',1,23);">1Pe 1:23</a>). Without living faith, in those capable of its exercise, the outward rite can avail nothing. The supposed "regeneration" may be received—in multitudes of instances is received—without the least apparent change in heart or life.<P>The above, naturally, applies to adults; the case of children, born and growing up within the Christian community, is on a different footing. Those who recognize the right of such to baptism hold that in the normal Christian development children of believing parents should be the subjects of Divine grace from the commencement (<a onClick="return mV(\'Eph\',6,4);">Eph 6:4</a>); they therefore properly receive the initiatory rite of the Christian church. The faith of the parent, in presenting his child for baptism, lays hold on God\'s promise to be a God to him and to his children; and he is entitled to hope for that which baptism pledges to him. But this, again, has no relation to the idea of regeneration through baptism.<P>James Orr<hr /><P>ANGLICAN (HIGH-CHURCH) DOCTRINE<P>Regeneration, the initial gift of life in Christ, is, in the church\'s normal system, associated with the sacrament of baptism. The basis for this teaching and practice of the church is found primarily in our Lord\'s discourse to Nicodemus (<a onClick="return mV(\'Jhn\',3,\'1-8\');">Joh 3:1-8</a>) wherein the new birth is associated not only with the quickening Spirit but with the element of water. The Saviour\'s words, literally translated, are as follows: "Except one be born (out) of water and Spirit (ex hudatos kai pneumatos gennaomai), he cannot enter into the kingdom of God." (That it is the impersonal aspect of the Divine Spirit, i.e. as equivalent to "spiritual life" which is here presented, is indicated by the absence of the article in the Greek of <a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>.) Entrance into the kingdom of God implies entrance into the church as the outward and visible embodiment of that kingdom. our Lord, in the passage above cited, does not limit the possibility or the need of "new birth" to those who have arrived at adult age, or "years of discretion," but uses the general pronoun tis, "anyone." The Anglican church does not, however, teach that baptism is unconditionally necessary, but only that it is "generally" necessary to salvation (compare the language of the Church Catechism with the qualification mentioned in the Prayer-Book "Office for the Baptism of Those of Riper Years," "Whereby ye may perceive the great necessity of this Sacrament, where it may be had"). It is not taught that the grace of God is absolutely or unconditionally bound to the external means, but only that these sacramental agencies are the ordinary and normal channels of Divine grace.<P>The typical form of baptism is that appropriate to the initiation of adults into the Christian body. Justin Martyr in his First Apology (chapter lxi) no doubt testifies to what was the general view of Christians in the 2nd century (circa 150 AD): "As many as are persuaded and believe that the things taught and said by us are true, and, moreover, take upon them to live accordingly, are taught to pray and ask of God with fasting for forgiveness of their former sins;...and then they are brought to a place of water, and there regenerated after the same manner with ourselves; for they are washed in the name of God, the Father and Lord of the universe, and of our Saviour Jesus Christ, and of the Holy Spirit." For the due administration of this sacrament, personal faith and repentance on the part of the candidate are prerequisite conditions. However, "the baptism of young children" (i.e. of infants) "is in any wise to be retained in the Church, as most agreeable to the institution of Christ" (XXXIX Articles, Art. XXVII, sub fin.). In the service "For the Baptism of Infants," repentance and faith are promised for the children by their "sureties" (ordinarily known as "sponsors" or "godparents"), "which promise, when they come to age (the children) themselves are bound to perform."<P>The person, whether adult or infant, receives in his baptism a real forgiveness; a washing away of all sins, whether original or actual. He also receives, at least in germ, the beginnings of new life in Christ; which life, however, must be developed and brought to perfection through his personal cooperation with the grace of God. But regeneration, as such, is not conversion; it is not even faith or love, strictly speaking. These latter, while they are conditions, or effects, or evidences of regeneration, are not regeneration itself, which is purely the work of God, operating by His creative power, through the Holy Ghost. The moral test of the existence of spiritual life is the presence in heart and conduct of the love of God and of obedience to His commandments (see 1Joh passim).<P>It may be added that the bestowment of the gifts of spiritual strength—of the manifold graces and of the fullness of the Holy Spirit—is primarily associated with the laying on of hands (confirmation) rather than with baptism proper; the rite of confirmation was, however, originally connected with the baptismal service, as an adjunct to it. The newly-made Christian is not to rest content with the initial gift of life; he is bound to strive forward unto perfection. Confirmation is, in a sense, the completion of baptism. "The doctrine of laying on of hands" is accordingly connected with "the doctrine of baptisms," and both are reckoned by the author of the Epistle to the He as among "the first principles of Christ" (<a onClick="return mV(\'Hbr\',6,1,2);">Heb 6:1-2</a> the King James Version).<P>LITERATURE.<P>For the Anglican doctrine on the subject of regeneration in baptism the following authorities may be consulted: Hooker, Ecclesiastical Polity, V, lix, lx; Waterland, The Doct. Use of Christian Sacraments; Regeneration; Wall, Infant Baptism; R. I. Wilberforce, The Doctrine of Holy Baptism; Darwell Stone, Holy Baptism, in "The Oxford Library of Practical Theology"; A. J. Mason, The Faith of the Gospel. For patristic teaching on this subject, compare Tertullian, De Baptismo.<P>William Samuel Bishop<hr /><P>LUTHERAN DOCTRINE<P>1. Definition of Terms:<P>Regeneration is here taken in its strict meaning to denote that internal spiritual change, not of the substance, but of the qualities, of the intellect and will of natural man, by which blindness, darkness in regard to spiritual matters, especially the gospel, is removed from the former, and spiritual bondage, impotency, death from the latter (<a onClick="return mV(\'2Cr\',3,5);">2Co 3:5</a>; <a onClick="return mV(\'Act\',26,18);">Ac 26:18</a>; <a onClick="return mV(\'Phl\',2,13);">Php 2:13</a>), and the heart of the sinner is made to savingly know and appropriate the Lord Jesus Christ and the merits of His of atoning sacrifice, as its only hope for a God-pleasing life here in time and a life in glory hereafter. Regeneration in the strict sense signifies the first spiritual movements and impulses in man, the beginning of his thinking Divine thoughts, cherishing holy desires and willing God-like volitions. But it does not signify the radical extinction of sin in man; for evil concupiscence remains also in the regenerate as a hostile element to the new life (<a onClick="return mV(\'Rom\',7,\'23-25\');">Ro 7:23-25</a>; <a onClick="return mV(\'Gal\',5,16,17);">Ga 5:16-17</a>). Peccatum tollitur in baptismo, non ut non sit, sed ut non obsit—Augustine. "Sin is removed in baptism, not that it may not be, but that it may not hurt." Reduced to its lowest terms, regeneration in the strict sense may be defined as the kindling saving faith in the heart of the sinner; for according to <a onClick="return mV(\'1Jo\',5,1);">1Joh 5:1</a>, "whosoever believeth that Jesus is the Christ is begotten of God." Such terms as new creation (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>; <a onClick="return mV(\'Gal\',6,15);">Ga 6:15</a> margin), spiritual quickening, or vivification (<a onClick="return mV(\'Eph\',2,5);">Eph 2:5</a>; <a onClick="return mV(\'Rom\',6,11);">Ro 6:11</a>), spiritual resurrection (<a onClick="return mV(\'Eph\',2,6);">Eph 2:6</a>; <a onClick="return mV(\'Col\',3,1);">Col 3:1</a>), are true synonyms of regeneration in the strict sense. In the point of time justification coincides with regeneration in the strict sense; for it is by faith, too, that the sinner is justified. But these two spiritual events must not be confounded; for justification affects, not the internal conditions of the sinner\'s heart, but his legal standing with God the righteous Judge. Regeneration is called baptismal regeneration in so far as it occurs in the event and as an effect of the application of the Christian baptism.<P>See <a href="./study/isbe/search.html?string=BAPTISM">BAPTISM</a> (I), I, 6.<P>2. Scriptural Basis of This Doctrine:<P>The two leading texts of Scripture which declare in plain terms that baptism is a means for effecting regeneration in the strict sense are <a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a> and <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>. But this doctrine is implied in <a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>; <a onClick="return mV(\'Gal\',3,27);">Ga 3:27</a>; <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>. In <a onClick="return mV(\'Jhn\',3,7);">Joh 3:7</a> it is immaterial whether anothen gennethenai is rendered "to be born from above" or "to be born a second time." For the second birth is never of the flesh (<a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>; <a onClick="return mV(\'Jhn\',3,4,5);">3:4-5</a>); hence, is always of divine origin, "from above." It is ascribed to the agency of the entire Trinity: the Father (<a onClick="return mV(\'Jam\',1,18);">Jas 1:18</a>; <a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>); the Son (<a onClick="return mV(\'Jhn\',1,12);">Joh 1:12</a>); and the Spirit (<a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>). But by appropriation it is generally attributed to the Spirit alone, whose particular function is that of Quickener (see Cremer, Bibl.-theol. Worterb., 9th edition, under the word "pneuma," 894f). Baptism is an instrument by which the Holy Spirit effects regeneration. "Water and the Spirit" (<a onClick="return mV(\'Jhn\',3,5);">Joh 3:5</a>) is a paraphrastic description of baptism: "water," inasmuch as the man is baptized therewith (<a onClick="return mV(\'1Jo\',5,7,8);">1Joh 5:7-8</a>; <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>) for the forgiveness of sin (<a onClick="return mV(\'Act\',2,33);">Ac 2:33</a>; <a onClick="return mV(\'Act\',22,16);">22:16</a>; <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a>), and "Spirit," inasmuch as the Holy Ghost is given to the person baptized in order to his spiritual renewal and sanctification; "both together—the former as causa medians, the latter as causa efficiens—constitute the objective and causative element out of which (compare <a onClick="return mV(\'Jhn\',1,13);">Joh 1:13</a>) the birth from above is produced (ek)" (Meyer). In <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a> "the expression to loutrou palingenesias, literally, \'bath of regeneration,\' has been very arbitrarily interpreted by some expositors, some taking loutron as a figurative name for the regeneration itself, or for the praedicario evangelii, \'preaching of the gospel\' or for the Holy Spirit, or for the abundant imparting of the Spirit. From <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a> it is clear that it can mean nothing else than baptism; compare too, <a onClick="return mV(\'Hbr\',10,22);">Heb 10:22</a>; <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a>; <a onClick="return mV(\'Act\',22,16);">Ac 22:16</a>." Of this laver of regeneration Paul says that through it (dia), i.e. by its instrumentality, men are saved. Meyer is right when, correcting a former view of his, he states: "According to the context, Paul calls baptism the bath of the new birth, not meaning that it pledges us to the new birth (\'to complete the process of moral purification, of expiation and sanctification,\' Matthies), nor that it is a visible image of the new birth (Wette), for neither in the one sense nor in the other could it be regarded as a means of saving. Paul uses that name for it as the bath by means of which God actually brings about the new birth." The application of baptism and the operation of the Spirit must be viewed as one undivided action. Thus the offense of Spurgeon, Weiss and others at "regeneration by water-baptism" can be removed.<P>3. Faith in Baptism:<P>Baptism does not produce salutary effects ex opere operato, i.e. by the mere external performance of the baptismal action. No instrument with which Divine grace works does. Even the preaching of the gospel is void of saving results if not "mixed with faith" (<a onClick="return mV(\'Hbr\',4,2);">Heb 4:2</a> the King James Version). Luther correctly describes the working of baptism thus: "How can water do such great things? It is not the water indeed that does them, but the Word of God which is in and with the water (God\'s giving hand), and faith which trusts such word of God in the water (man\'s receiving hand)." But this faith, which is required for a salutary use of the gospel and baptism, is wrought by these as instruments which the Holy Spirit employs to produce faith; not by imparting to them a magical power but by uniting His Divine power with them (<a onClick="return mV(\'Rom\',10,17);">Ro 10:17</a>; <a onClick="return mV(\'2Cr\',4,6);">2Co 4:6</a>; <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>).<P>4. Infants and Adults:<P>The comprehensive statements in <a onClick="return mV(\'Jhn\',3,6);">Joh 3:6</a>; <a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a> ("by nature") show that infants are in need of being regenerated, and <a onClick="return mV(\'Mat\',18,3,6);">Mt 18:3, 6</a>, that they are capable of faith. It is not more difficult for the Holy Spirit to work faith in infants by baptism, than in adults by the preaching of the gospel. And infant faith, though it may baffle our attempts at exact definition, is nevertheless honored in Scripture with the word which denotes genuine faith, pisteuein, i.e. trustfully relying on Christ (<a onClick="return mV(\'Mat\',18,6);">Mt 18:6</a>; compare <a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a>; <a onClick="return mV(\'2Ti\',1,5);">1:5</a>). In the case of adults who have received faith through hearing and reading the gospel (<a onClick="return mV(\'Jam\',1,18);">Jas 1:18</a>; <a onClick="return mV(\'1Pe\',1,23);">1Pe 1:23</a>; <a onClick="return mV(\'1Cr\',4,15);">1Co 4:15</a>), baptism is still "the washing of regeneration," because it is a seal to them of the righteousness which these people have previously obtained by believing the gospel (<a onClick="return mV(\'Rom\',4,\'11-13\');">Ro 4:11-13</a>; <a onClick="return mV(\'Gal\',3,7);">Ga 3:7</a>); and it reminds them of, and enables them to discharge, their daily duty of putting away the old and putting on the new man (<a onClick="return mV(\'Eph\',4,22,24);">Eph 4:22, 24</a>), just as the Word is still the regenerating word of truth (<a onClick="return mV(\'Jam\',1,18);">Jas 1:18</a>) though it be preached to persons who are regenerated a long time ago. Accordingly, Luther rightly extends the regenerating and renewing influences of baptism throughout the life of a Christian, when he says "Baptizing with water signifies that the old Adam in us should, by daily contrition and repentance, be drowned and die, with all sins and evil lusts; and, again, a new man should come forth and arise, who shall live before God in righteousness and purity forever" (Smaller Catechism).``36';
isbe[1156]='Baptist`bap\'-tist.`<a href="./study/isbe/search.html?string=JOHN+THE+BAPTIST">JOHN THE BAPTIST</a>`1';
isbe[1157]='Bar (1)`bar (prefix): Aramaic for the Hebrew ben, "son." Compare Aramaic sections of Ezra and Daniel. In the Old Testament the word is found three times in <a onClick="return mV(\'Pro\',31,2);">Pr 31:2</a> and once in Syriac <a onClick="return mV(\'Psa\',2,12);">Ps 2:12</a> (Hier. translates "pure"). In the New Testament "Bar" is frequently employed as prefix to names of persons. Compare Barabbas; Bar-Jesus; Bar-Jonah; Barnabas; Barsabbas; Bartholomew; Bartimeus.`<a href="./study/isbe/search.html?string=BEN">BEN</a>`1';
isbe[1158]='Bar (2)`bar (substantive):<P>(1) beriach = "a bolt" (<a onClick="return mV(\'Exd\',26,\'26-29\');">Ex 26:26-29</a>; <a onClick="return mV(\'Exd\',35,11);">35:11</a>; <a onClick="return mV(\'Exd\',36,\'31-34\');">36:31-34</a>; <a onClick="return mV(\'Exd\',39,33);">39:33</a>; <a onClick="return mV(\'Exd\',40,18);">40:18</a>; <a onClick="return mV(\'Num\',3,36);">Nu 3:36</a>; <a onClick="return mV(\'Num\',4,31);">4:31</a>; <a onClick="return mV(\'Deu\',3,5);">De 3:5</a>; <a onClick="return mV(\'Jdg\',16,3);">Jud 16:3</a>; <a onClick="return mV(\'1Sa\',23,7);">1Sa 23:7</a>; <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>; <a onClick="return mV(\'2Ch\',8,5);">2Ch 8:5</a>; <a onClick="return mV(\'2Ch\',14,7);">14:7</a>; <a onClick="return mV(\'Neh\',3,3,6,\'13-15\');">Ne 3:3, 6, 13-15</a>; <a onClick="return mV(\'Job\',38,10);">Job 38:10</a> "bars and doors" for the sea (the bank or shore of the sea); <a onClick="return mV(\'Psa\',107,16);">Ps 107:16</a>; <a onClick="return mV(\'Psa\',147,13);">147:13</a> "the bars of thy gates": the walls of the city were now rebuilt and its gates only closed and barred by night (see <a onClick="return mV(\'Neh\',7,3);">Ne 7:3</a>); <a onClick="return mV(\'Pro\',18,19);">Pr 18:19</a>, "bars of a castle"; <a onClick="return mV(\'Isa\',45,2);">Isa 45:2</a>; <a onClick="return mV(\'Jer\',49,31);">Jer 49:31</a>; <a onClick="return mV(\'Jer\',51,30);">51:30</a>; <a onClick="return mV(\'Lam\',2,9);">La 2:9</a>; <a onClick="return mV(\'Eze\',38,11);">Eze 38:11</a>): meaning "a rock in the sea" (<a onClick="return mV(\'Jon\',2,6);">Jon 2:6</a>).<P>(2) mot = "a staff," "stick," "pole" (<a onClick="return mV(\'Num\',4,10,12);">Nu 4:10, 12</a> margin); "strong fortification and great impediment" (<a onClick="return mV(\'Isa\',45,2);">Isa 45:2</a>; <a onClick="return mV(\'Amo\',1,5);">Am 1:5</a>, "the bolt of Damascus": no need here to render prince, as some do (G. A. Smith in the place cited.)).<P>(3) badh = "staff," "part of body," "strength" (<a onClick="return mV(\'Job\',17,16);">Job 17:16</a>, "bars of Sheol": the gates of the world of the dead; compare <a onClick="return mV(\'Isa\',38,10);">Isa 38:10</a>; some read, "Will the bars of Sheol fall?").<P>(4) metil = "something hammered out, a (forged) bar" (<a onClick="return mV(\'Job\',40,18);">Job 40:18</a>).`<a href="./study/isbe/search.html?string=DOOR">DOOR</a>; <a href="./study/isbe/search.html?string=GATE">GATE</a>; <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`77';
isbe[1159]='Bar-Jesus`bar-je\'-zus (Bariesous): "A certain sorcerer (Greek magos), a false prophet, a Jew" whom Paul and Silas found at Paphos in Cyprus in the train of Sergius Paulus, the Roman proconsul (<a onClick="return mV(\'Act\',13,6);">Ac 13:6</a>ff). The proconsul was "a man of understanding" (literally, a prudent or sagacious man), of an inquiring mind, interested in the thought and magic of his times. This characteristic explains the presence of a magos among his staff and his desire to hear Barnabas and Saul. Bar-Jesus was the magician\'s Jewish name. Elymas is said to be the interpretation of his name (<a onClick="return mV(\'Act\',13,8);">Ac 13:8</a>). It is the Greek transliteration of an Aramaic or Arabic word equivalent to Greek magos. From Arabic \'alama, "to know" is derived \'alim, "a wise" or "learned man." In Koran, Sur note 106, Moses is called Sachir \'alim, "wise magician." Elymas therefore means "sorcerer" (compare Simon "Magus").<P>The East was flooding the Roman Empire with its new and wonderful religious systems, which, culminating in neo-Platonism, were the great rivals of Christianity both in their cruder and in their more strictly religious forms. Superstition was extremely prevalent, and wonder-workers of all kinds, whether imposters or honest exponents of some new faith, found their task easy through the credulity of the public. Babylonia was the home of magic, for charms are found on the oldest tablets. "Magos" was originally applied to the priests of the Persians who overran Babylonia, but the title degenerated when it was assumed by baser persons for baser articles Juvenal (vi.562, etc.), Horace (Sat. i.2.1) and other Latin authors mention Chaldean astrologers and impostors, probably Babylonian Jews. Many of the Magians, however, were the scientists of their day, the heirs of the science of Babylon and the lore of Persia, and not merely pretenders or conjurers (see <a href="./study/isbe/search.html?string=MAGIC">MAGIC</a>). It may have been as the representative of some oriental system, a compound of "science" and religion, that Bar-Jesus was attached to the train of Sergius Paulus.<P>Both Sergius and Elymas had heard about the teaching of the apostles, and this aroused the curiosity of Sergius and the fear of Elymas. When the apostles came, obedient to the command of the proconsul, their doctrine visibly produced on him a considerable impression. Fearing lest his position of influence and gain would be taken by the new teachers, Elymas "withstood them, seeking to turn aside the proconsul from the faith" (<a onClick="return mV(\'Act\',13,8);">Ac 13:8</a>). Paul, inspired by the Holy Spirit, worked a wonder on the wonder-worker by striking him blind with his word, thus revealing to the proconsul that behind him was Divine power. Sergius Paulus believed, "being astonished at the teaching of the Lord" (<a onClick="return mV(\'Act\',13,12);">Ac 13:12</a>).``78';
isbe[1160]='Bar-Jonah`bar-jo\'-na (Bar-ionas): Simon Peter\'s patronymic (<a onClick="return mV(\'Mat\',16,17);">Mt 16:17</a>). Bar is Aramaic for "son" (compare Bar-timaeus, Bartholomew, etc.), and corresponds to Hebrew ben. Thus we are to understand that Peter\'s father\'s name was Jonah. But in <a onClick="return mV(\'Jhn\',1,42);">Joh 1:42</a>; <a onClick="return mV(\'Jhn\',21,\'15-17\');">21:15-17</a>, according to the best reading, his name is given as John (so the Revised Version (British and American), instead of the King James Version Jona, Jonas). There are two hypotheses to account for this difference:<P>(1) Ionas (Jonah) in <a onClick="return mV(\'Mat\',16,17);">Mt 16:17</a> may be simply a contraction of Ioanes (John);<P>(2) Peter\'s father may have been known by two names, Jonah and John.``49';
isbe[1161]='Barabbas`ba-rab\'-as (Barabbas): For Aramaic Bar-abba = literally, "son of the father," i.e. of the master or teacher. Abba in the time of Jesus was perhaps a title of honor (<a onClick="return mV(\'Mat\',23,9);">Mt 23:9</a>), but became later a proper name. The variant Barrabban found in the 19-Harclean Syriac would mean "son of the rabbi or teacher." Origen knew and does not absolutely condemn a reading of <a onClick="return mV(\'Mat\',27,16,17);">Mt 27:16-17</a>, which gave the name "Jesus Barabbas," but although it is also found in a few cursives and in the Aramaic and the Jerusalem Syriac versions in this place only, it is probably due to a scribe\'s error in transcription (Westcott-Hort, App., 20). If the name was simply Barabbas or Barrabban, it may still have meant that the man was a rabbi\'s son, or it may have been a purely conventional proper name, signifying nothing. He was the criminal chosen by the Jerusalem mob, at the instigation of the priests, in preference to Jesus Christ, for Pilate to release on the feast of Passover (<a onClick="return mV(\'Mar\',15,15);">Mr 15:15</a>; <a onClick="return mV(\'Mat\',27,20,21);">Mt 27:20-21</a>; <a onClick="return mV(\'Luk\',23,18);">Lu 23:18</a>; <a onClick="return mV(\'Jhn\',18,40);">Joh 18:40</a>). Matthew calls him "a notable (i.e. notorious) prisoner" (<a onClick="return mV(\'Mat\',27,16);">Mt 27:16</a>). Mark says that he was "bound with them that had made insurrection, men who in the insurrection had committed murder" (<a onClick="return mV(\'Mat\',15,7);">Mt 15:7</a>). Luke states that he was cast into prison "for a certain insurrection made in the city, and for murder" (<a onClick="return mV(\'Luk\',23,19);">Lu 23:19</a>; compare <a onClick="return mV(\'Act\',3,14);">Ac 3:14</a>). John calls him a "robber" or "brigand" (<a onClick="return mV(\'Jhn\',18,40);">Joh 18:40</a>). Nothing further is known of him, nor of the insurrection in which he took part. Luke\'s statement that he was a murderer is probably a deduction from Mark\'s more circumstantial statement, that he was only one of a gang, who in a rising had committed murder. Whether robbery was the motive of his crime, as John suggests, or whether he was "a man who had raised a revolt against the Roman power" (Gould) cannot be decided. But it seems equally improbable that the priests (the pro-Roman party) would urge the release of a political prisoner and that Pilate would grant it, especially when the former were urging, and the latter could not resist, the execution of Jesus on a political charge (<a onClick="return mV(\'Luk\',23,2);">Lu 23:2</a>). The insurrection may have been a notorious case of brigandage. To say that the Jews would not be interested in the release of such a prisoner, is to forget the history of mobs. The custom referred to of releasing a prisoner on the Passover is otherwise unknown. "What Matthew (and John) represents as brought about by Pilate, Mark makes to appear as if it were suggested by the people themselves. An unessential variation" (Meyer). For a view of the incident as semi-legendary growth, see Schmiedel in Encyclopedia Biblica. See also Allen, Matthew, and Gould, Mark, at the place, and article "Barabbas" by Plummer in Hastings, Dictionary of the Bible (five volumes).``145';
isbe[1162]='Barachel`bar\'-a-kel (barakh\'el, "God blesses"): Barachel, the Buzite, of the family of Ram, was the father of Elihu, who was the last one to reason with Job (<a onClick="return mV(\'Job\',32,2,6);">Job 32:2, 6</a>). Compare<a href="./study/isbe/search.html?string=BUZ"> BUZ</a>; <a href="./study/isbe/search.html?string=RAM">RAM</a>.``1';
isbe[1163]='Barachiah`bar-a-ki\'-a (Barachias; the King James Version Barachias; <a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>): Father of Zachariah who was murdered between the sanctuary and the altar. It is possible that reference is made to Zechariah, the son of Jehoiada (<a onClick="return mV(\'2Ch\',24,20);">2Ch 24:20</a>ff), whom Matthew by mistake calls "Z., the son of Barachiah." <a onClick="return mV(\'Luk\',11,51);">Lu 11:51</a> omits the name of the father of Z. (compare Zahn\'s Kommentar, 649, note).``1';
isbe[1164]='Barachias`bar-a-ki\'-as.`<a href="./study/isbe/search.html?string=BARACHIAH">BARACHIAH</a>`1';
isbe[1165]='Barak`ba\'-rak (baraq, "lightning flash"): The name occurs in Sabeanbarqac, in Palmyrene baraq, and in Punic Barcas, as surname of Hamilcar; and as Divine name in Assyrian Ramman-Birqu and Gibil-Birqu (Del. Assyrian, HWB, 187). Barak was the son of Abinoam of Kedesh, a refuge city in Mt. Naphtali. He was summoned by the prophetess Deborah to lead his countrymen to war against the Canaanites under the leadership of Sisera. From the celebrated ode of Deborah we gather that Israel suffered at the hand of the enemy; the caravan roads were in danger, traffic almost ceased; the cultivated country was plundered (<a onClick="return mV(\'Jdg\',5,6,7);">Jud 5:6-7</a>). The fighting men in Israel were disarmed, a shield was not to be seen nor a spear among forty thousand men (<a onClick="return mV(\'Jdg\',5,8);">Jud 5:8</a>). The prophetess raised the signal of struggle for independence. Soon Barak came to her aid. With an army of 10,000 men—according to <a onClick="return mV(\'Jdg\',4,10);">Jud 4:10</a> they were all drawn from Zebulun and Naphtali, whereas <a onClick="return mV(\'Jdg\',5,\'13-18\');">Jud 5:13-18</a> adds Benjamin, Machir and Issachar to the list of faithful tribes—Barak, accompanied by Deborah, rushed to the summit of Mt. Tabor. This location was very favorable to the rudely armed Israelites in warding off the danger of the well-armed enemy. The wooded slopes protected them against the chariots of the Canaanites. In addition they were within striking distance should the enemy expose himself on the march. Under the heavy rainfall the alluvial plain became a morass, in which the heavy-armed troops found it impossible to move. Soon the little stream Kishon was filled with chariots, horses and Canaanites. Sisera abandoned his chariot and fled on foot. Barak pursued him and found him murdered by Jael in her tent. This completed the victory.`<a href="./study/isbe/search.html?string=BEDAN">BEDAN</a>`27';
isbe[1166]='Barbarian; Barbarous`bar-ba\'-ri-an, bar\'-ba-rus (barbaros): A word probably formed by imitation of the unintelligible sounds of foreign speech, and hence, in the mouth of a Greek it meant anything that was not Greek, language, people or customs. With the spread of Greek language and culture, it came to be used generally for all that was non-Greek. Philo and Josephus sometimes called their own nation "barbarians," and so did Roman writers up to the Augustan age, when they adopted Greek culture, and reckoned themselves with the Greeks as the only cultured people in the world. Therefore Greek and barbarian meant the whole human race (<a onClick="return mV(\'Rom\',1,14);">Ro 1:14</a>).<P>In <a onClick="return mV(\'Col\',3,11);">Col 3:11</a>, "barbarian, Scythian" is not a classification or antithesis but a "climax" (Abbott) = "barbarians, even Scythians, the lowest type of barbarians." In Christ, all racial distinctions, even the most pronounced, disappear.<P>In <a onClick="return mV(\'1Cr\',14,11);">1Co 14:11</a> Paul uses the term in its more primitive sense of one speaking a foreign, and therefore, an unintelligible language: "If then I know not the meaning of the voice, I shall be to him that speaketh a barbarian, and he that speaketh will be a barbarian unto me." The speaking with tongues would not be a means of communication. The excited inarticulate ejaculations of the Corinthian revivalists were worse than useless unless someone had the gift of articulating in intelligible language the force of feeling that produced them (dunamis tes phones, literally, "the power of the sound").<P>In <a onClick="return mV(\'Act\',28,2,4);">Ac 28:2, 4</a> (in the King James Version of <a onClick="return mV(\'Act\',28,2);">Ac 28:2</a> "barbarous people" = barbarians) the writer, perhaps from the Greek-Roman standpoint, calls the inhabitants of Melita barbarians, as being descendants of the old Phoenician settlers, or possibly in the more general sense of "strangers." For the later sense of "brutal," "cruel," "savage," see 2Macc 2:21; 4:25; 15:2.``145';
isbe[1167]='Barber`bar\'-ber:<P>(1) The English word "barber" is from Latin barba, "beard" = a man who shaves the beard. Dressing and trimming the hair came to be added to his work. "Barber" is found only once English Versions of the Bible, in <a onClick="return mV(\'Eze\',5,1);">Eze 5:1</a>, "Take thee a sharp sword; as a barber\'s razor shalt thou take it unto thee, and shalt cause it to pass upon thy head and upon thy beard" (compare Chaghigha\' 4b, Shab, section 6).<P>(2) In <a onClick="return mV(\'Gen\',41,14);">Ge 41:14</a> we probably have a case of conformity to Egyptian, rather than Palestinian custom, where Joseph "shaved himself, and changed his raiment, and came in unto Pharaoh." It is known that Egyptians of the higher classes shaved the beard regularly and completely (as the Hittites, Elamites and early Babylonians seem to have done), except that fashion allowed, as an exception to the rule, a small tuft, or "goatee," under the chin.<P>(3) We learn from various Scriptural allusions, as well as from other sources (compare W. Max Muller, Asien und Europa, 296ff), that the business of the oriental barber included, besides ceremonial shaving, the trimming and polling of the hair and the beard. Compare <a onClick="return mV(\'2Sa\',19,24);">2Sa 19:24</a> where it appears that the moustache (Hebrew sapham; the King James Version "beard") received regular trimming; and <a onClick="return mV(\'1Sa\',21,14);">1Sa 21:14</a>, where the neglect of the beard is set down as a sign of madness.<P>That men wore wigs and false beards in ancient days, the latter showing the rank of the wearer, appears from Herodotus ii.36; iii.12; and Wilkinson, Anc. Egypt, II,324,etc. Josephus, Vita, II, gives one case where false hair appears to have been used as an intentional disguise. See also Polyb. iii. 78.<P>(4) The business of the barber (see <a onClick="return mV(\'Eze\',5,1);">Eze 5:1</a>, "as a barber\'s razor shalt thou take it unto thee, and shalt cause it to pass upon thy head and upon thy beard"), outside of ceremonial shaving, may have consisted in trimming and polling the beard and the hair of the head. Of other nations with whom Israel of old came in contact, the Hittites and Elamites, it is now known, shaved the beard completely, as the earliest Babylonians also seem to have done.<P>(5) The prohibition enjoined in the Mosaic law upon "the priests the Levites, the sons of Zadok" (<a onClick="return mV(\'Eze\',44,15,20);">Eze 44:15, 20</a>) forbidding either "shaving the head," or "suffering their locks to grow long," or shaving off the corners of their beard (<a onClick="return mV(\'Lev\',21,5);">Le 21:5</a>), was clearly, in a sense peculiar to the priests, etc.: "They (the priests) shall only cut off," i.e. trim, not shave, "the hair of their heads" (<a onClick="return mV(\'Eze\',44,20);">Eze 44:20</a>). But in the Apostolical Constitutions, I,3,insistence is laid upon the Biblical prohibition as applicable to all as regards the removal of the beard (compare Clement of Alexandria, Paed., III, edition Migne, I, 580f). Jerome on <a onClick="return mV(\'Eze\',44,20);">Eze 44:20</a> and some of the Jewish sages find the basis of this prohibition in the fact that God gave a beard to man to distinguish him from the woman—so, they reasoned, it is wrong thus to go against Nature (compare Bahya, on <a onClick="return mV(\'Lev\',19,27);">Le 19:27</a>).<P>(6) In the Palestine of the Greek period, say in the 3rd century BC, when there was a large infusion of Hellenic population and influence, clipping of the beard prevailed in some circles, being omitted only in times of mourning, etc. The common people, however, seem to have seen little distinction between clipping the beard and shaving. But see pictures of captive Jews with clipped beard in the British Museum.<P>LITERATURE.<P>Benzinger, heb. Arch., 110; Nowack, Lehrbuch der Heb. Arch., 134; W. Max Muller, Asien und Europa, 296ff.``47';
isbe[1168]='Barchus`bar\'-kus (Codex Vaticanus, Bachous; Codex Alexandrinus, Barchoue; the King James Version Charchus, from Aldine edition, Charkous; 1Esdras 5:32 = Barkos (<a onClick="return mV(\'Ezr\',2,53);">Ezr 2:53</a>; <a onClick="return mV(\'Neh\',7,55);">Ne 7:55</a>)): The descendants of Barchus (temple-servants) returned with Zerubbabel to Jerusalem.``1';
isbe[1169]='Barefoot`bar\'-foot.<P>1. Introductory:<P>The word is found in the following passages: English Versions of the Bible, "He went barefoot" (<a onClick="return mV(\'2Sa\',15,30);">2Sa 15:30</a>); "(Isaiah) did so, walking...barefoot" (<a onClick="return mV(\'Isa\',20,2);">Isa 20:2</a>); and like the Egyptians, "naked and barefoot" (<a onClick="return mV(\'Isa\',20,3,4);">Isa 20:3-4</a>). It seems that David in his flight before Absalom "went barefoot," not to facilitate his flight, but to show his grief (<a onClick="return mV(\'2Sa\',15,30);">2Sa 15:30</a>), and that Micah (<a onClick="return mV(\'Mic\',1,8);">Mi 1:8</a>) makes "going barefoot" a sign of mourning (Septuagint: "to be barefoot"; the King James Version "stripped"). The nakedness and bare feet of the prophet Isaiah (<a onClick="return mV(\'Isa\',20,2);">20:2</a>) may have been intended to symbolize and express sympathy for the forlorn condition of captives (compare <a onClick="return mV(\'Job\',12,17,19);">Job 12:17, 19</a>, where the King James Version and the Revised Version (British and American) have "spoiled," but some authorities give as the true translation "barefoot").<P>Jastrow, in article on "Tearing the Garments" (Jour. of the Am. Oriental Soc., XXI, 23-39) presents a view worth considering of going barefoot as a sign of mourning and then of grief in general (compare also Jewish Encyclopedia, article "Barefoot"). All these passages seem to imply the discomfort or going barefoot on long journeys, over stony roads or hot sands; but then, as now, in the Orient sandals seem to have been little worn ordinarily in and around the house.<P>See <a href="./study/isbe/search.html?string=SHOE">SHOE</a>.<P>2. An Ancient Oriental Custom:<P>The "shoes" of the ancients, as we know from many sources, were "sandals," i.e. simply soles, for the most part of rawhide, tied to the feet to protect them against the gravel, stones or thorns of the road. Shoes of the modern sort, as well as socks and stockings, were unknown. In ancient times it was certainly a common custom in Bible lands to go about in and around one\'s house without sandals. The peasantry, indeed, like the fellaheen of today, being hardened to it, often went afield barefoot. But for a king, or a prophet, a priest or a worshipper, to go barefoot, was another matter, as it was also for a mourner, for one in great distress, to be found walking the streets of a city, or going any distance in bare feet. Here we come again to customs peculiar to the Orient, and of various significance. For instance, it was considered then, as it is now in the Moslem world, profane and shocking, nothing short of a desecration, to enter a sanctuary, or walk on "holy ground," with dust-covered shoes, or unwashed feet. Moses and Joshua were commanded to take off their shoes when on "holy ground" (<a onClick="return mV(\'Exd\',3,5);">Ex 3:5</a>; <a onClick="return mV(\'Jos\',5,15);">Jos 5:15</a>). "No one was allowed to walk on the temple ground with shoes on, or with dust on his feet" (Ber., IX, 5; compare Jamblichus, Pythagoras, section 105). No one in the East today is allowed to enter any mosque with shoes on, or without first putting slippers furnished for the purpose over his shoes. As a rule, too, the feet must be cleansed by ablution in every such case, as well as hands and feet before each meal.<P>3. Priests on Duty Went Barefoot:<P>The priests of Israel, as would seem true of the priests in general among the ancients, wore no shoes when ministering (see Silius Italicus, III, 28; compare Theodoret on <span class="noTag">Ex 3</span>, question 7; and Yer. Shet., 5, 48d). In ancient times, certainly the priests of Israel, when going upon the platform to serve before the ark, in Tabernacle or temple, as later in the synagogue to bless the congregation, went barefoot; though today strange to say, such ministering priests among the Jews wear stockings, and are not supposed to be barefoot (Cotah, 40a; RH, 316; Shulchan \'Arukh, \'Orach Chayyim,128,5; see Jewish Encyclopedia, article "Barefoot").<P>4. Reasons for the Ancient Custom:<P>The reason or reasons for the removal of the shoes in such cases as the above, we are not at a loss to divine; but when it comes to the removal of the shoes in times of mourning, etc., opinions differ. Some see in such customs a trace of ancestor- worship; others find simply a reversion or return to primitive modes of life; while others still, in agreement with a widely prevalent Jewish view, suggest that it was adopted as a perfectly natural symbol of humility and simplicity of life, appropriate to occasions of grief, distress and deep solemnity of feeling.<P>The shoes are set aside now by many modern Jews on the Day of Atonement and on the Ninth of Ab.<P>LITERATURE.<P>Winer, Robinson, Biblical Researches, under the word "Priester und Schuhe"; Riehm, Handworterbuch des bib. Alt., under the word "Schuhe."``47';
isbe[1170]='Barhumite`bar-hu\'-mit.`<a href="./study/isbe/search.html?string=BAHARUMITE">BAHARUMITE</a>`1';
isbe[1171]='Bariah`ba-ri\'-ah (bariach, "fugitive"): Bariah was a descendant of David in the line of Solomon (<a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>).``1';
isbe[1172]='Barkos`bar\'-kos (barqoc, "party-colored" (?) compare Gray, Studies in Hebrew Proper Names, 68, note 2): The descendants of Barkos returned with Zerubbabel to Jerusalem (<a onClick="return mV(\'Ezr\',2,53);">Ezr 2:53</a>; <a onClick="return mV(\'Neh\',7,55);">Ne 7:55</a>). Compare Barchus (1Esdras 5:32).``1';
isbe[1173]='Barley`bar\'-li (se\'orah):<P>(1) In the Bible, as in modern times, barley was a characteristic product of Palestine—"a land of wheat and barley, and vines and fig-trees," etc. (<a onClick="return mV(\'Deu\',8,8);">De 8:8</a>), the failure of whose crop was a national disaster (<a onClick="return mV(\'Joe\',1,11);">Joe 1:11</a>). It was, and is, grown chiefly as provender for horses and asses (<a onClick="return mV(\'1Ki\',4,28);">1Ki 4:28</a>), oats being practically unknown, but it was, as it now is, to some extent, the food of the poor in country districts (<a onClick="return mV(\'Rth\',2,17);">Ru 2:17</a>; <a onClick="return mV(\'2Ki\',4,42);">2Ki 4:42</a>; <a onClick="return mV(\'Jhn\',6,9,13);">Joh 6:9, 13</a>). Probably this is the meaning of the dream of the Midianite concerning Gideon: "Behold, I dreamed a dream; and, lo, a cake of barley bread tumbled into the camp of Midian, and came unto the tent, and smote it so that it fell, and turned it upside down, so that the tent lay flat. And his fellow answered and said, This is nothing else save the sword of Gideon, the son of Joash, a man of Israel" (<a onClick="return mV(\'Jdg\',7,13);">Jud 7:13</a>f). Here the barley loaf is type of the peasant origin of Gideon\'s army and perhaps, too, of his own lowly condition.<P>Barley was (<a onClick="return mV(\'Eze\',4,9);">Eze 4:9</a>) one of the ingredients from which the prophet was to make bread and "eat it as barley cakes" after having baked it under repulsive conditions (<a onClick="return mV(\'Eze\',4,12);">Eze 4:12</a>), as a sign to the people. The false prophetesses (<a onClick="return mV(\'Eze\',13,19);">Eze 13:19</a>) are said to have profaned God among the people for "handfuls of barley and for pieces of bread."<P>Barley was also used in the Ordeal of Jealousy (s. v.). It was with five barley loaves and two fishes that our Lord fed the five thousand (<a onClick="return mV(\'Jhn\',6,9,10);">Joh 6:9-10</a>).<P>(2) Several varieties of barley are grown in Palestine The Hordeum distichum or two-rowed barley is probably the nearest to the original stock, but Hordeum tetrastichum, with grains in four rows, and Hordeum hexastichum, with six rows, are also common and ancient; the last is found depicted upon Egyptian monuments.<P>Barley is always sown in the autumn, after the "early rains," and the barley harvest, which for any given locality precedes the wheat harvest (<a onClick="return mV(\'Exd\',9,31);">Ex 9:31</a>f), begins near Jericho in April—or even March—but in the hill country of Palestine is not concluded until the end of May or beginning of June.<P>The barley harvest was a well-marked season of the year (see <a href="./study/isbe/search.html?string=TIME">TIME</a>) and the barley-corn was a well-known measure of length.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`117';
isbe[1174]='Barn`barn (meghurah, "a granary," "fear," <a onClick="return mV(\'Hag\',2,19);">Hag 2:19</a>; acam, "a storehouse," <a onClick="return mV(\'Pro\',3,10);">Pr 3:10</a>; mammeghurah, "a repository," <a onClick="return mV(\'Joe\',1,17);">Joe 1:17</a>; apotheke, <a onClick="return mV(\'Mat\',6,26);">Mt 6:26</a>; <a onClick="return mV(\'Mat\',13,30);">13:30</a>; <a onClick="return mV(\'Luk\',12,18,24);">Lu 12:18, 24</a>): A place for the storing of grain, usually a dry cistern in the ground, covered over with a thick layer of earth. "Grain is not stored in the East until it is threshed and winnowed. The apotheke in Roman times was probably a building of some kind. But the immemorial usage of the East has been to conceal the grain, in carefully prepared pits or caves, which, being perfectly dry, will preserve it for years. It thus escaped, as far as possible, the attentions of the tax-gatherer as well as of the robber—not always easily distinguished in the East; compare <a onClick="return mV(\'Jer\',41,8);">Jer 41:8</a>" (Temple Dictionary, 215). Figurative of heaven (<a onClick="return mV(\'Mat\',13,30);">Mt 13:30</a>).`<a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>; <a href="./study/isbe/search.html?string=GARNER">GARNER</a>`91';
isbe[1175]='Barnabas`bar\'-na-bas (Barnabas, "son of exhortation," or possibly "son of Nebo"): This name was applied to the associate of Paul, who was originally called Joses or Joseph (<a onClick="return mV(\'Act\',4,36);">Ac 4:36</a>), as a testimony to his eloquence. Its literal meaning is "son of prophecy" (bar, "son"; nebhu\'ah, "prophecy"). Compare word for prophet in <a onClick="return mV(\'Gen\',20,7);">Ge 20:7</a>; <a onClick="return mV(\'Deu\',18,15 18);">De 18:15, 18</a>, etc. This is interpreted in <a onClick="return mV(\'Act\',4,36);">Ac 4:36</a> as "son of exhortation" the Revised Version (British and American), or "son of consolation" the King James Version, expressing two sides of the Greek paraklesis, that are not exclusive. The office of a prophet being more than to foretell, all these interpretations are admissible in estimating Barnabas as a preacher. Deismann (Bibelstudien, 175-78) considers Barnabas the Jewish Grecized form of Barnebous, a personal Semitic name recently discovered in Asia Minor inscriptions, and meaning "son of Nebo" (Standard Bible Dictionary in the place cited.).<P>He was a Levite from the island of Cyprus, and cousin, not "nephew" (the King James Version), of the evangelist Mark, the word anepsios (<a onClick="return mV(\'Col\',4,10);">Col 4:10</a>), being used in <a onClick="return mV(\'Num\',36,11);">Nu 36:11</a>, for "father\'s brothers\' sons." When we first learn of him, he had removed to Jerusalem, and acquired property there. He sold "a field," and contributed its price to the support of the poorer members of the church (<a onClick="return mV(\'Act\',4,36);">Ac 4:36</a>ff). In <a onClick="return mV(\'Act\',11,24);">Ac 11:24</a> he is described as "a good man and full of the Holy Spirit" (compare <a onClick="return mV(\'Isa\',11,2);">Isa 11:2</a>; <a onClick="return mV(\'1Cr\',12,8,11);">1Co 12:8, 11</a>) "and of faith," traits that gave him influence and leadership. Possibly on the ground of former acquaintanceship, interceding as Paul\'s sponsor and surety, he removed the distrust of the disciples at Jerusalem and secured the admission of the former persecutor into their fellowship. When the preaching of some of the countrymen of Barnabas had begun a movement toward Christianity among the Greeks at Antioch, Barnabas was sent from Jerusalem to give it encouragement and direction, and, after a personal visit, recognizing its importance and needs, sought out Paul at Tarsus, and brought him back as his associate. At the close of a year\'s successful work, Barnabas and Paul were sent to Jerusalem with contributions from the infant church for the famine sufferers in the older congregation (<a onClick="return mV(\'Act\',11,30);">Ac 11:30</a>). Ordained as missionaries on their return (<a onClick="return mV(\'Act\',13,3);">Ac 13:3</a>), and accompanied by John Mark, they proceeded upon what is ordinarily known as the "First Missionary Journey" of Paul (<a onClick="return mV(\'Act\',13,4,5);">Ac 13:4-5</a>). Its history belongs to Paul\'s life. Barnabas as well as Paul is designated "an apostle" (<a onClick="return mV(\'Act\',14,14);">Ac 14:14</a>). Up to <a onClick="return mV(\'Act\',13,43);">Ac 13:43</a>, the precedency is constantly ascribed to Barnabas; from that point, except in <a onClick="return mV(\'Act\',14,14);">14:14</a> and <a onClick="return mV(\'Act\',15,12,25);">15:12, 25</a>, we read "Paul and Barnabas," instead of "Barnabas and Saul." The latter becomes the chief spokesman. The people at Lystra named Paul, because of his fervid oratory, Mercurius, while the quiet dignity and reserved strength of Barnabas gave him the title of Jupiter (<a onClick="return mV(\'Act\',14,12);">Ac 14:12</a>). Barnabas escaped the violence which Paul suffered at Iconium (<a onClick="return mV(\'Act\',14,19);">Ac 14:19</a>).<P>Upon their return from this first missionary tour, they were sent, with other representatives of the church at Antioch, to confer with the apostles and elders of the church at Jerusalem concerning the obligation of circumcision and the ceremonial law in general under the New Testament—the synod of Jerusalem. A separation from Paul seems to begin with a temporary yielding of Barnabas in favor of the inconsistent course of Peter (<a onClick="return mV(\'Gal\',2,13);">Ga 2:13</a>). This was followed by a more serious rupture concerning Mark. On the second journey, Paul proceeded alone, while Barnabas and Mark went to Cyprus. Luther and Calvin regard <a onClick="return mV(\'2Cr\',8,18,19);">2Co 8:18-19</a> as meaning Barnabas by "the brother whose praise is spread through all the churches," and indicating, therefore, subsequent joint work. The incidental allusions in <a onClick="return mV(\'1Cr\',9,6);">1Co 9:6</a> and <a onClick="return mV(\'Gal\',2,13);">Ga 2:13</a> ("even Barnabas") show at any rate Paul\'s continued appreciation of his former associate. Like Paul, he accepted no support from those to whom he ministered.<P>Tertullian, followed in recent years by Grau and Zahn, regard him as the author of the Epistle to the He. The document published among patristic writings as the Epistle of Barnabas, and found in full in the Codex Sinaiticus, is universally assigned today to a later period. "The writer nowhere claims to be the apostle Barnabas; possibly its author was some unknown namesake of \'the son of consolation\' "(Lightfoot, Apostolic Fathers, 239f).``84';
isbe[1176]='Barnabas, Epistle of``<a href="./study/isbe/search.html?string=APOCRYPHAL+EPISTLES">APOCRYPHAL EPISTLES</a>`1';
isbe[1177]='Barnabas, Gospel of``<a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>`1';
isbe[1178]='Barodis`ba-ro\'-dis (Barodeis, 1Esdras 5:34): The descendants of Barodis (sons of the servants of Solomon) returned with Zerubbabel to Jerusalem. Omitted in <a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a> and <a onClick="return mV(\'Neh\',7,\'1-\');">Ne 7</a>.``1';
isbe[1179]='Barrel`bar\'-el: The word "barrel" in the King James Version (see <a onClick="return mV(\'1Ki\',17,12,14,16);">1Ki 17:12, 14, 16</a>; <a onClick="return mV(\'1Ki\',18,33);">18:33</a>: "The barrel of meal," "fill four barrels with water," etc.) stands for the large earthenware jar (so the American Standard Revised Version) used in the East for carrying water from the spring or well, and for storing grain, etc., according to a custom that still persists. It is elsewhere (EV) more fitly rendered "pitcher."`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>; <a href="./study/isbe/search.html?string=PITCHER">PITCHER</a>`1';
