isbe[1180]='Barren; Barrenness`bar\'-en, (bar\'-en-nes tsiyah; melehah; shakhol; \'aqar; steiros; argos):<P>(1) Of land that bears no crop, either<P>(a) because it is naturally poor and sterile: tsiyah "dry" (<a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a>), melechah, "salt" (<a onClick="return mV(\'Job\',39,6);">Job 39:6</a> the King James Version), shakhol, "miscarrying" (<a onClick="return mV(\'2Ki\',2,19,21);">2Ki 2:19, 21</a>), or<P>(b) because it is, under God\'s curse, turned into a melechah or salt desert, for the wickedness of the people that dwell therein (<a onClick="return mV(\'Psa\',107,34);">Ps 107:34</a> the King James Version; compare <a onClick="return mV(\'Gen\',3,17,18);">Ge 3:17-18</a>).<P>(2) Of females that bear no issue: \'aqar: Sarah (<a onClick="return mV(\'Gen\',11,30);">Ge 11:30</a>); Rebekah (<a onClick="return mV(\'Gen\',25,21);">Ge 25:21</a>); Rachel (<a onClick="return mV(\'Gen\',29,31);">Ge 29:31</a>); Manoah\'s wife (<a onClick="return mV(\'Jdg\',13,2,3);">Jud 13:2-3</a>); Hannah (<a onClick="return mV(\'1Sa\',2,5);">1Sa 2:5</a>); steiros: Elisabeth (<a onClick="return mV(\'Luk\',1,7,36);">Lu 1:7, 36</a>).<P>In Israel and among oriental peoples generally barrenness was a woman\'s and a family\'s greatest misfortune. The highest sanctions of religion and patriotism blessed the fruitful woman, because children were necessary for the perpetuation of the tribe and its religion. It is significant that the mothers of the Hebrew race, Sarah, Rebekah and Rachel, were by nature sterile, and therefore God\'s special intervention shows His particular favor to Israel. Fruitfulness was God\'s special blessing to His people (<a onClick="return mV(\'Exd\',23,26);">Ex 23:26</a>; <a onClick="return mV(\'Deu\',7,14);">De 7:14</a>; <a onClick="return mV(\'Psa\',113,9);">Ps 113:9</a>). A complete family is an emblem of beauty (<a onClick="return mV(\'Sgs\',4,2);">So 4:2</a>; <a onClick="return mV(\'Sgs\',6,6);">6:6</a>). Metaphorically, Israel, in her days of adversity, when her children were exiled, was barren, but in her restoration she shall rejoice in many children (<a onClick="return mV(\'Isa\',54,1);">Isa 54:1</a>; <a onClick="return mV(\'Gal\',4,27);">Ga 4:27</a>). The utter despair and terror of the destruction of Jerusalem could go no farther than that the barren should be called blessed (<a onClick="return mV(\'Luk\',23,29);">Lu 23:29</a>).<P>(3) Argos is translated in the King James Version "barren," but in the Revised Version (British and American) more accurately "idle" (<a onClick="return mV(\'2Pe\',1,8);">2Pe 1:8</a>).``145';
isbe[1181]='Barsabas; Barsabbas`bar\'-sa-bas, bar-sab\'-as.`<a href="./study/isbe/search.html?string=JOSEPH+BARSABBAS">JOSEPH BARSABBAS</a>; <a href="./study/isbe/search.html?string=JUDAS+BARSABBAS">JUDAS BARSABBAS</a>`1';
isbe[1182]='Bartacus`bar\'-ta-kus (Bartakos; Josephus Rhabezdkes; Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) Bezazes (1Esdras 4:29)): The father of Apame. He is called "the illustrious," probably because of rank and merits. The family seems to be of Persian origin since the name Bartacus (Syriac,) in the form of Artachaeas is mentioned by Herodotus (vii. 22. 117) as a person of rank in the Persian army of Xerxes and the name of his daughter Apame is identical with that of a Persian princess who married Seleucus I, Nicator, and became the mother of Antiochus I. Apamea, a city in Asia Minor founded by Seleucus I, is named in honor of his wife Apame. Compare <a href="./study/isbe/search.html?string=APAME">APAME</a>; <a href="./study/isbe/search.html?string=ILLUSTRIOUS">ILLUSTRIOUS</a>.``1';
isbe[1183]='Bartholomew`bar-thol\'-o-mu (Bartholomaios, i.e. "son of Tolmai or Tolmai"): One of the Twelve Apostles (<a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>; <a onClick="return mV(\'Luk\',6,14);">Lu 6:14</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>). There is no further reference to him in the New Testament. According to the "Genealogies of the Twelve Apostles" (Budge, Contendings of the Apostles, II, 50) "Bartholomew was of the house of Naphtali. Now his name was formerly John, but our Lord changed it because of John the son of Zebedee, His beloved." A "Gospel of Bartholomew" is mentioned by Hieronymus (Comm. Proem ad Matth.), and Gelasius gives the tradition that Bartholomew brought the Hebrew gospel of Matthew to India. In the "Preaching of Bartholomew in the Oasis" (compare Budge, II, 90) he is referred to as preaching probably in the oasis of Al Bahnasa, and according to the "Preaching of Andrew and Bartholomew" he labored among the Parthians (Budge, II, 183). The "Martyrdom of Bartholomew" states that he was placed in a sack and cast into the sea.<P>From the 9th century onward, Bartholomew has generally been identified with Nathanael, but this view has not been conclusively established.`<a href="./study/isbe/search.html?string=NATHANAEL">NATHANAEL</a>`88';
isbe[1184]='Bartholomew, Gospel of``<a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>; <a href="./study/isbe/search.html?string=BARTHOLOMEW">BARTHOLOMEW</a>`1';
isbe[1185]='Bartimaeus`bar-ti-me\'-us (Bartimaios): A hybrid word from Aramaic bar = "son," and Greek timaios = "honorable." For the improbability of the derivation from bar-tim\'ai = "son of the unclean," and of the allegorical meaning = the Gentiles or spiritually blind, see Schmiedel in Encyclopedia Biblica. In Mark (<a onClick="return mV(\'Mar\',10,\'46-52\');">Mr 10:46-52</a>) Bartimeus is given as the name of a blind beggar, whose eyes Jesus Christ opened as He went out from Jericho on His last journey to Jerusalem. An almost identical account is given by Luke (<a onClick="return mV(\'Luk\',18,\'35-43\');">Lu 18:35-43</a>), except that the incident occurred "as he drew nigh unto Jericho," and the name of the blind man is not given. Again, according to Matthew (<a onClick="return mV(\'Mat\',20,\'29-34\');">Mt 20:29-34</a>), "as they went out from Jericho" (like Mark) two blind men (unlike Mark and Luke) receive their sight. It is not absolutely impossible that two or even three events are recorded, but so close is the similarity of the three accounts that it is highly improbable. Regarding them as referring to the same event, it is easy to understand how the discrepancies arose in the passage of the story from mouth to mouth. The main incident is clear enough, and on purely historical grounds, the miracle cannot be denied. The discrepancies themselves are evidence of the wide currency of the story before our Gospels assumed their present form. It is only a most mechanical theory of inspiration that would demand their harmonization.``145';
isbe[1186]='Baruch`ba\'-ruk, bar\'-uk (baruk; Barouch, "blessed"):<P>(1) Son of Neriah and brother of Seraiah, King Zedekiah\'s chamberlain (<a onClick="return mV(\'Jer\',51,59);">Jer 51:59</a>). He was the devoted friend (<a onClick="return mV(\'Jer\',32,12);">Jer 32:12</a>), the amanuensis (<a onClick="return mV(\'Jer\',36,4);">36:4</a>ff, <a onClick="return mV(\'Jer\',36,32);">32</a>) and faithful attendant (<a onClick="return mV(\'Jer\',36,10);">36:10</a>ff; Josephus, Ant, X, vi, 2) of the prophet Jeremiah. He seems to have been of noble family (see Ant, X, ix, 1; compare <a onClick="return mV(\'Jer\',51,59);">Jer 51:59</a>; Baruch 1:1). He was also according to Josephus a man of unusual acquirements (Ant., X, ix, 1). He might have risen to a high position and seemed conscious of this, but under Jeremiah\'s influence (see <a onClick="return mV(\'Jer\',45,5);">Jer 45:5</a>) he repressed his ambition, being content to throw in his lot with the great prophet whose secretary and companion he became. Jeremiah dictated his prophecies to Baruch, who read them to the people (<a onClick="return mV(\'Jer\',36,\'1-\');">Jer 36</a>). The king (Jehoiakim) was greatly angered at these prophecies and had Baruch arrested and the roll burnt. Baruch however rewrote the prophet\'s oracles. In the final siege of Jerusalem Baruch stood by his master, witnessing the purchase by the latter of his ancestral estate in Anathoth (<a onClick="return mV(\'Jer\',32,\'1-\');">Jer 32</a>). According to Josephus (Ant., X, ix, 1) he continued to reside with Jeremiah at Mizpah after the fall of Jerusalem. Subsequent to the murder of Gedaliah, he was accused of having unduly influenced Jeremiah when the latter urged the people to remain in Judah—a fact which shows how great was the influence which Baruch was believed to have had over his master (<a onClick="return mV(\'Jer\',43,3);">Jer 43:3</a>). He was carried with Jeremiah to Egypt (<a onClick="return mV(\'Jer\',43,6);">Jer 43:6</a>; Ant, X, ix, 6), and thereafter our knowledge of him is merely legendary. According to a tradition preserved by Jerome (on <a onClick="return mV(\'Isa\',30,6);">Isa 30:6</a>f) he died in Egypt soon after reaching that country. Two other traditions say that he went, or by Nebuchadnezzar was carried, to Babylon after this king conquered Egypt. The high character of Baruch and the important part he played in the life and work of Jeremiah induced later generations still further to enhance his reputation, and a large number of spurious writings passed under his name, among them the following:<P>(a) The <a href="./study/isbe/search.html?string=APOCALYPSE+OF+BARUCH">APOCALYPSE OF BARUCH</a> (which see);<P>(b) the Book of Baruch;<P>(c) the Rest of the Words of Baruch;<P>(d) the Gnostic Book of Baruch;<P>(e) the Latin Book of Baruch, composed originally in Latin;<P>(f) a Greek Apocalypse of Baruch belonging to the 2nd century of our era;<P>(g) another Book of Baruch belonging to the 4th or 5th century.<P>(2) A son of Zabbai who aided Nehemiah in rebuilding the walls of Jerusalem (<a onClick="return mV(\'Neh\',3,20);">Ne 3:20</a>).<P>(3) One of the priests who signed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,6);">Ne 10:6</a>).<P>(4) The son of Colhozeh, a descendant of Perez, the son of Judah (<a onClick="return mV(\'Neh\',11,5);">Ne 11:5</a>).``33';
isbe[1187]='Baruch, Apocalypse of``<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`1';
isbe[1188]='Baruch, Book of`One of the Apocryphal or Deutero-canonical books, standing between Jeremiah and Lamentations in the Septuagint, but in the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) after these two books.<P>I. Name.<P>See under <a href="./study/isbe/search.html?string=BARUCH">BARUCH</a> for the meaning of the word and for the history of the best-known Biblical. personage bearing the name. Though Jewish traditions link this book with Jeremiah\'s amanuensis and loyal friend as author, it is quite certain that it was not written or compiled for hundreds of years after the death of this Baruch. According to <a onClick="return mV(\'Jer\',45,1);">Jer 45:1</a> it was in the 4th year (604 BC) of the reign of Jehoiakim (608-597 BC) that Baruch wrote down Jeremiah\'s words in a book and read them in the ears of the nobles (English Versions, "princes," but king\'s sons are not necessarily meant; <a onClick="return mV(\'Jer\',36,\'1-\');">Jer 36</a>). The Book of Baruch belongs in its present form to the latter half of the 1st century of our era; yet some modern Roman Catholic scholars vigorously maintain that it is the work of Jeremiah\'s friend and secretary.<P>II. Contents.<P>This book and also the Epistle of Jeremy have closer affinities with the canonical Book of Jeremiah than any other part of the Apocrypha. It is probably to this fact that they owe their name and also their position in the Septuagint and in the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) The book is apparently made up of four separate parts by independent writers, brought together by an editor, owing it is very likely to a mere accident—each being too small to occupy the space on one roll they were all four written on one and the same roll. The following is a brief analysis of the four portions of the book:<P>1. Historical Introduction:<P>Historical Introduction, giving an account of the origin and purpose of the book (Baruch 1:1-14). Baruch 1:1f tell us that Baruch wrote this book at Babylon "in the fifth month (not "year" as the Septuagint) in the seventh day of the month, what time as the Chaldeans took Jerusalem, and burnt it with fire" (see <a onClick="return mV(\'2Ki\',25,8);">2Ki 25:8</a>ff). Fritzsche and others read: "In the fifth year, in the month Sivan (see 1:8), in the seventh day of the month," etc. Um gives the date of the feast Pentecost, and the supposition is that the party who made a pilgrimage to Jerusalem did so in order to observe that feast. According to 1:3-14, Baruch read his book to King Jehoiachin and his court by the (unidentified) river Sud. King and people on hearing the book fell to weeping, fasting and praying. As a result money was collected and sent, together with Baruch\'s book, to the high priest Jehoiakim, (NOTE: So spelled in the canonical books; but it is Joacim or Joachim in Apocrypha the King James Version, and in the Apocrypha the Revised Version (British and American) it is invariably Joakim) to the priests and to the people at Jerusalem. The money is to be used in order to make it possible to carry on the services of the temple, and in particular that prayers may be offered in the temple for the king and his family and also for the superior lord King Nebuchadnezzar and his son Baltasar (= the Belshazzar of <a onClick="return mV(\'Dan\',5,\'1-\');">Da 5</a>).<P>2. Confession and Prayer:<P>Confession and prayer (Baruch 1:15-3:8) (1) of the Palestinian remnant (Baruch 1:15-2:15). The speakers are resident in Judah not in Babylon (Baruch 1:15; compare 2:4), as J. T. Marshall and R. H. Charles rightly hold. This section follows throughout the arrangement and phraseology of a prayer contained in <a onClick="return mV(\'Dan\',9,\'7-15\');">Da 9:7-15</a>. It is quite impossible to think of Daniel as being based on Baruch, for the writer of the former is far more original than the author or authors of Baruch. But in the present section the original passage in Daniel is altered in a very significant way. Thus in <a onClick="return mV(\'Dan\',9,7);">Da 9:7</a> the writer describes those for whom he wrote as \'the men of Judah and the inhabitants of Jerusalem and all Israel(ites): those near and those far off, in all the lands (countries) whither thou hast driven them on account of their unfaithfulness toward thee.\' The italicized words are omitted from Baruch 1:15, though the remaining part of <a onClick="return mV(\'Dan\',9,7);">Da 9:7</a> is added. Why this difference? It is evident, as Marshall has ably pointed out, that the editor of the section intends to put the confession and prayer of Baruch 1:15-2:5 into the mouths of Jews who had not been removed into exile. Ewald (History, V,208,6) holds that <a onClick="return mV(\'Dan\',9,\'7-9\');">Da 9:7-9</a> is dependent on Baruch 1:15-2:17. The section may thus be analyzed:<P>(a) Baruch 1:15-22: Confession of the sins of the nation from the days of Moses down to the exile. The principle of solidarity (see Century Bible, "Psalms," II, 21,195, 215) so governed the thoughts of the ancient Israelites that the iniquities of their forefathers were in effect their own.<P>(b) Baruch 2:1-5: God\'s righteous judgment on the nation in humbling and scattering them.<P>Confession and prayer (2) of the exiles in Babylon Baruch 2:16-3:8. That the words in this section are supposed to be uttered by Babylonian exiles appears from 2:13f; 3:7f and from the general character of the whole. This portion of the book is almost as dependent on older Scriptures as the foregoing. Three sources seem in particular to have been used.<P>(a) The Book of Jeremiah has been freely drawn upon.<P>(b) Deuteronomic phrases occur frequently, especially in the beginning and end. These are perhaps taken second-hand from Jeremiah, a book well known to the author of these verses and deeply loved by him.<P>(c) Solomon\'s prayer as recorded in <a onClick="return mV(\'1Ki\',8,\'1-\');">1Ki 8</a> is another quarry from which our author appears to have dug. This section may be thus divided:<P>(i.) Baruch 2:6-12: Confession, opening as the former (see 1:15) with words extracted from <a onClick="return mV(\'Dan\',9,7);">Da 9:7</a>.<P>(ii.) Baruch 2:13-3:8: Prayer for restoration. Baruch 3:1-8 shows more independence than the rest, for the author at this point makes use of language not borrowed from any original known to us. As such these verses are important as a clue to the writer\'s position, views and character.<P>In Baruch 3:4 we have the petition: "Hear now the prayer of the dead Israelites," etc., words which as they stand involve the doctrine that the dead (Solomon, Daniel, etc.) are still alive and make intercession to Goal on behalf of the living. But this teaching is in opposition to 2:17 which occurs in the same context. Without making any change in the Hebrew consonants we can and should read for "dead (methe) Israelites" "the men of (methe) Israel." The Septuagint confuses the same words in <a onClick="return mV(\'Isa\',5,13);">Isa 5:13</a>.<P>3. The Praise of Wisdom:<P>The praise of "Wisdom," for neglecting which Israel is now in a strange land. God alone is the author of wisdom, and He bestows it not upon the great and mighty of this world, but upon His own chosen people, who however have spurned the Divine gift and therefore lost it (Baruch 3:9-4:4).<P>The passage, Baruch 3:10-13 (Israel\'s rejection of "Wisdom" the cause of her exile), goes badly with the context and looks much like an interpolation. The dominant idea in the section is that God has made Israel superior to all other nations by the gift of "wisdom," which is highly extolled. Besides standing apart from the context these four verses lack the rhythm which characterize the other verses. What is so cordially commended is described in three ways, each showing up a different facet, as do the eight synonyms for the Divine word in each of the 22 strophes in <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a> (see Century Bible, "Psalms," II, 254).<P>(1) It is called most frequently "Wisdom."<P>(2) In Baruch 4:1 it is described as the Commandments of God and as the Law or more correctly as authoritative instruction. The Hebrew word for this last (torah) bears in this connection, it is probable, the technical meaning of the Pentateuch, a sense which it never has in the Old Testament. Compare <a onClick="return mV(\'Deu\',4,6);">De 4:6</a>, where the keeping of the commandments is said to be "wisdom" and understanding.<P>4. The Dependence of This Wisdom Section:<P>(1) The line of thought here resembles closely that pursued in <a onClick="return mV(\'Job\',28,\'1-\');">Job 28</a>, which modern scholars rightly regard as a later interpolation. Wisdom, the most valuable of possessions, is beyond the unaided reach of man. God only can give it—that is what is taught in these parts of both Baruch and Job with the question "Where shall wisdom be found?" (<a onClick="return mV(\'Job\',28,12);">Job 28:12</a>; compare Baruch 3:14f; where a similar question forms the basis of the greater portion of the section of <a onClick="return mV(\'Job\',38,\'1-\');">Job 38</a>f). Wisdom is not here as in Proverbs hypostatized, and the same is true of <a onClick="return mV(\'Job\',28,\'1-\');">Job 28</a>. This in itself is a sign of early date, for the personifying of "wisdom" is a later development (compare Philo, <a onClick="return mV(\'Jhn\',1,\'1-\');">John 1</a>).<P>(2) The language in this section is modeled largely on that of Deuteronomy, perhaps however through Jeremiah, which is also especially after chapter 10 Deuteronomic in thought and phraseology. See ante II, 2 (2 1b).<P>The most original part of this division of the book is where the writer enumerates the various classes of the world\'s great ones to whom God had not given "wisdom": princes of the heathen, wealthy men, silversmiths, merchants, theologians, philosophers, etc. (Baruch 3:16ff).<P>See <a href="./study/isbe/search.html?string=WISDOM">WISDOM</a><P>5. Words of Cheer to Israel:<P>The general thought that pervades the section, Baruch 4:5-5:9, is words of cheer to Israel (i.e. Judah) in exile, but we have here really, according to Rothstein, a compilation edited so skillfully as to give it the appearance of a unity which is not real. Earlier Biblical writings have throughout been largely drawn upon. Rothstein (Kautzsch, Die Apokryphen, etc., 213-15) divides the section in the following manner:<P>(1) Baruch 4:5-9a: Introductory section, giving the whole its keynote—"Be of good cheer," etc.; 4:7f follows <a onClick="return mV(\'Deu\',32,\'15-18\');">De 32:15-18</a>.<P>(2) Baruch 4:9b-29: A song, divisible into two parts.<P>(a) Personified Jerusalem deplores the calamities of Israel in exile (Baruch 4:9b-16).<P>(b) She urges her unfortunate children to give themselves to hope and prayer, amending their ways so that God may bring about their deliverance (Baruch 4:17-29).<P>(c) Baruch 4:30-5:9: A second song, beginning as the first with the words, "Be of good cheer," and having the same general aim, to comfort exiled and oppressed Israel.<P>In all three parts earlier Scriptures have been largely used, and in particular Deutero-Isaiah has had much influence upon the author. But there do not seem to the present writer reasons cogent enough for concluding, with Rothstein, that these three portions are by as many different writers. There is throughout the same recurring thought "Be of good cheer," and there is nothing in the style to suggest divergent authorship.<P>(3) The Relation between Baruch 4:36-5:9 and Psalter of Solomon 11. It was perhaps Ewald (Geschichte, IV, 498) who first pointed out the similarity of language and viewpoint between Baruch 4:36-5:9 and Psalter of Solomon 11, especially 11:3-8. The only possible explanation is that which makes Baruch 4:36ff an imitation of Psalter of Solomon 11. So Ewald (op. cit.); Ryle and James (<a onClick="return mV(\'Psa\',70,2);">Ps 70:2</a>ff).<P>Ps Sol were written originally in Hebrew, and references to Pompey (died 48 BC) and to the capture of Jerusalem (63 BC) show that this pseudepigraphical Psalter must have been written in the first half of the 1st century BC. Bar, as will be shown, is of much later date than this. Besides it is now almost certain that the part of Baruch under discussion was written in Greek (see below, IV) and that it never had a Hebrew original. Now it is exceedingly unlikely that a writer of a Hebrew psalm would copy a Greek original, though the contrary supposition is a very likely one.<P>On the other hand A. Geiger (Psalt. Sol., XI, 137-39, 1811), followed by W. B. Stevenson (Temple Bible), and many others argue for the priority of Baruch, using this as a reason for giving Baruch an earlier date than is usually done. It is possible, of course, that the Pseudo-Solomon and the Pseudo-Baruch have been digging in the same quarry; and that the real original used by both is lost.<P>III. Language.<P>For our present purpose the book must be divided into two principal parts:<P>(1) Baruch 1-3:8;<P>(2) 3:9-5:9.<P>There is general agreement among the best recent scholars from Ewald downward that the first portion of the book at least was written originally in Hebrew.<P>(1) In the Syro-Hex. text there are margin notes to 1:17 and 2:3 to the effect that these verses are lacking in the Hebrew, i.e. in the original Hebrew text.<P>(2) There are many linguistic features in this first part which are best explained on the supposition that the Greek text is from a Hebrew original. In Baruch 2:25 the Septuagint English Versions of the Bible apostole at the end of the verse means "a sending of." The English Versions of the Bible ("pestilence") renders a Hebrew word which, without the vowel signs (introduced late) is written alike for both meanings (d-b-r). The mistake can be explained only on the assumption of a Hebrew original. Similarly the reading "dead Israelites" for "men of Israel" (= Israelites) in 3:4 arose through reading wrong vowels with the same consonants, which last were alone written until the 7th and 8th centuries of our era. off, in all the lands (countries) whither thou hast driven them on account of their unfaithfulness toward thee.\' The italicized words are omitted from Baruch 1:15, though the remaining part of <a onClick="return mV(\'Dan\',9,7);">Da 9:7</a> is added. Why this difference? It is evident, as Marshall has ably pointed out, that the editor of the section intends to put the confession and prayer of Baruch 1:15-2:5 into the mouths of Jews who had not been removed into exile. Ewald (History, V,208,6) holds that <a onClick="return mV(\'Dan\',9,\'7-9\');">Da 9:7-9</a> is dependent on Baruch 1:15-2:17. The section may thus be analyzed:<P>Frequently, as in Hebrew, sentences begin with Greek kai (= "and") which, without somewhat slavish copying of the Hebrew, would not be found. The construction called parataxis characterizes Hebrew; in good Greek we meet with hypotaxis.<P>The Hebrew way of expressing "where" is put literally into the Greek of this book (Baruch 2:4,13,29; 3:8). Many other Hebrew idioms, due, it is probable, to the translator\'s imitations of his original, occur: in "to speak in the ears of" (Baruch 1:3); the word "man" (anthropos) in the sense "everyone" (Baruch 2:3); "spoken by thy servants the prophets" is in Greek by "the hand of the servants," which is good Hebrew but bad Greek Many other such examples could be added.<P>There is much less agreement among scholars as to the original language or languages of the second part of the book (Baruch 3:9-5:9). That this part too was written in Hebrew, so that in that case the whole book appeared first in that language, is the position held and defended by Ewald (op. cit.), Kneucker (op. cit.), Konig (Ein), Rothstein (op. cit.) and Bissell (Lange). It is said by these writers that this second part of Baruch equally with the first carries with it marks of being a translation from the Hebrew. But one may safely deny this statement. It must be admitted by anyone who has examined the text of the book that the most striking Hebraisms and the largest number of them occur in the first part of the book. Bissell writes quite fully and warmly in defense of the view that the whole book was at first written in Hebrew, but the Hebraisms which he cites are all with one solitary exception taken from the first part of the book. This one exception is in Baruch 4:15 where the Greek conjunction holi is used for the relative ho, the Hebrew \'asher having the meaning of both. There seems to be a Hebraism in 4:21: "He shall deliver thee from...the hand of your enemies," and there are probably others. But there are Hebraisms in Hellenistic Greek always—the present writer designates them "Hebraisms" or "Semiticisms" notwithstanding what Deismann, Thumb and Moulton say. In the first part of this book it is their overwhelming number and their striking character that tell so powerfully in favor of a Hebrew original.<P>(3) The following writers maintain that the second part of the book was written first of all in Greek: Fritzsche, Hilgenfeld, Reuss, Schurer, Gifford, Cornill and R. H. Charles, though they agree that the first part had a Hebrew original. This is probably the likeliest view, though much may be written in favor of a Hebrew original for the whole book and there is nothing quite decisively against it. J. Turner Marshall (Hastings Dictionary of the Bible, I, 253) tries to prove that Baruch 3:9-4:4 was written first in Aramaic, the rest of the book (4:5-5:9) in Greek But though he defends his case with great ability he does not appear to the present writer to have proved his thesis. Ewald (op. cit.), Hitzig (Psalmen2, II, 119), Dillmann, Ruetschi, Fritzsche and Bissell were so greatly impressed by the close likeness between the Greek of Baruch and that of the Septuagint of Jeremiah, that they came to the conclusion that both books were translated by the same person. Subsequently Hitzig decided that Baruch was not written until after 70 AD, and therefore abandoned his earlier opinion in favor of this one—that the translator of Baruch was well acquainted with the Septuagint of Jeremiah and was strongly influenced by it.<P>IV. Date or Dates.<P>It is important to distinguish between the date of the completion of the entire book in its present form and the dates of the several parts which in some or all cases may be much older than that of the whole as such.<P>1. The Historical Introduction:<P>Baruch 1:1-14 was written after the completion of the book expressly to form a prologue or historical explanation of the circumstances under which the rest of the book came to be written. To superficial readers it could easily appear that the whole book was written by one man, but a careful examination shows that the book is a compilation. One may conclude that the introduction was the last part of the book to be composed and that therefore its date is that of the completion of the book. Reasons will be given (see below) for believing that 4:5-5:9 belongs to a time subsequent to the destruction of Jerusalem and its temple in 70 AD. This is still more true of this introduction intended as a foreword to the whole book.<P>2. Confession and Prayer:<P>The following points bear on the date of the section Baruch 1:15-3:8, assuming it to have one date:<P>(1) The generation of Israelites to which the writer belonged were suffering for the sins of their ancestors; see especially Baruch 3:1-8.<P>(2) The second temple was in existence in the writer\'s day. Baruch 2:26 must (with the best scholars) be translated as follows: "And thou hast made the house over which thy name is called as it is this day," i.e. the temple—still in being—is shorn of its former glory. Moreover though <a onClick="return mV(\'Dan\',9,\'7-14\');">Da 9:7-14</a> is largely quoted in Baruch 1:15-2:12, the prayer for the sanctuary and for Jerusalem in <a onClick="return mV(\'Dan\',9,16);">Da 9:16</a> is omitted, because the temple is not now in ruins.<P>(3) Though it is implied (see above II,2,(1)) that there are Jews in Judah who have never left their land there are a large number in foreign lands, and nothing is said that they were servants of the Babylonian king.<P>(4) The dependence of Baruch 2:13-3:8 on Deuteronomy, Jeremiah and <a onClick="return mV(\'1Ki\',8,\'1-\');">1Ki 8</a> (Solomon\'s prayer) shows that this part of the book is later than these writings, i.e. later than say 550 BC. Compare Baruch 2:13 with <a onClick="return mV(\'Deu\',28,62);">De 28:62</a> and <a onClick="return mV(\'Jer\',42,2);">Jer 42:2</a>.<P>(5) The fact that <a onClick="return mV(\'Dan\',9,\'7-14\');">Da 9:7-14</a> has influenced Baruch 1:15-2:12 proves that a date later than Daniel must be assumed for at least this portion of Baruch. The temple is still standing, so that the book belongs somewhere between 165 BC, when Daniel was written, and 71 AD, when the temple was finally destroyed.<P>Ewald, Gifford and Marshall think that this section belongs to the period following the conquest of Jerusalem by Ptolemy I (320 BC). According to Ewald the author of Baruch 1:1-3:8 (regarded as by one hand) was a Jew living in Babylon or Persia. But Daniel had not in 320 BC been written. Fritzsche, Schrader, Keil, Toy and Charles assign the section to the Maccabean age—a quite likely date. On the other hand Hitzig, Kneucker and Schurer prefer a date subsequent to 70 AD. The last writer argues for the unity of this section, though he admits that the middle of chapter 1 comports ill with its context.<P>3. The Wisdom Section Baruch 3:9-4:4:<P>It has been pointed out (see above, II, 3) that Baruch 3:10-13 does not belong to this section, being manifestly a later interpolation. The dependence of this Wisdom portion on <a onClick="return mV(\'Job\',28,\'1-\');">Job 28</a> and on Deuteronomy implies a post-exilic date. The identification of Wisdom with the Torah which is evidently a synonym for the Pentateuch, argues a date at any rate not earlier than 300 BC. But how much later we have no means of ascertaining. The reasons adduced by Kneucker and Marshall for a date immediately before or soon af ter the fall of Jerusalem in 70 AD have not convinced the present writer.<P>4. Words of Cheer Baruch 4:5-5:9:<P>The situation implied in these words may be thus set forth:<P>(1) A great calamity has happened to Jerusalem (Baruch 4:9f). Nothing is said proving that the whole land has shared the calamity, unless indeed this is implied in Baruch 4:5 f.<P>(2) A large number of Jerusalemites have been transported (Baruch 4:10).<P>(3) The nation that has sacked Jerusalem and carried away many of its inhabitants is "shameless," having "a strange language, neither reverencing old men nor pitying children" (Baruch 4:15).<P>(4) The present home of the Jerusalemites is a great city (Baruch 4:32-35), not the country. Now the above details do not answer to any dates in the history of the nation except these two:<P>(a) 586 BC, when the temple was destroyed by the Babylonians;<P>(b) 71 AD, when the temple was finally destroyed by the Romans.<P>But the date 586 BC is out of the question, and no modern scholar pleads for it. We must therefore assume for this portion of the book a date soon after 70 AD. In the time of Pompey, to which Graetz assigns the book, neither Jerusalem nor the temple was destroyed. Nor was there any destruction of either during the Maccabean war. In favor of this date is the dependence of Baruch 4:36ff on Psalter of Solomon 11 (see above, II,5,(3)).<P>Rothstein (in Kautzsch) says that in this section there are at least three parts by as many different writers. Marshall argues for four independent parts. But if either of these views is correct the editor has done his work exceedingly well, for the whole harmonizes well together.<P>Kneucker, author of the fullest Commentary, endeavors to prove that the original book consisted of Baruch 1:1f plus 3a (the heading) plus 3:9-5:9, and that it belongs to the reign of Domitian (81-96 AD). The confession and prayer in 1:15-3:8 were written, he says, somewhat earlier and certainly before 71 AD, and as a separate work, being inserted in the book by the scribe who wrote 1:4-14.<p>V. Versions.<P>The most important versions are the following. It is assumed in the article that the Greek text of the book up to Baruch 3:8 is itself a translation from a Hebrew text now lost. The same remark may be true of the rest of the book or of a portion of it (see above, III).<P>1. Latin:<P>There are two versions in this language:<P>(1) The Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) which is really the Old Latin, since Jerome\'s revision was confined to the Hebrew Scriptures, the Apocrypha being therefore omitted in this revision. This version is a very literal one based on the Greek It is therefore for that reason the more valuable as a witness to the Greek text.<P>(2) There is a later Latin translation, apparently a revision of the former, for its Latinity is better; in some cases it adopts different readings and in a general way it has been edited so as to bring it into harmony with the Vatican uncial (B). This Latin version was published in Rome by J. Maria Caro (died circa 1688) and was reprinted by Sabatier in parallel columns with the pre-Jeromian version noticed above (see Bibliotheca Casinensis, I, 1873).<P>2. Syriac:<P>There are also in this language two extant versions:<P>(1) The Peshitta, a very literal translation, can be seen in the London (Walton\'s) Polyglot and most conveniently in Lagarde\'s Libr. Apocrypha. Syriac., the last being a more accurate reproduction.<P>(2) The Hexapla Syriac translation made by Paul, bishop of Telle, near the beginning of the 7th century AD. It has been published by Ceriani with critical apparatus in his beautiful photograph-lithographed edition of the Hexapla Syriac Bible.<P>3. Arabic:<P>There is a very literal translation to be found in the London Polyglot, referred to above.<P>LITERATURE.<P>For editions of the Greek text see under <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>. Of commentaries the fullest and best is that by Kneucker, Das Buch Baruch (1879), who gives an original German rendering based on a restored Hebrew original. Other valuable commentaries are those by Fritzsche (1851); Ewald, Die Propheten2, etc. (1868), III, 251-82 (Eng. translation); The Prophets of the Old Testament, V, 108-37, by Reusch (1855); Zockler (1891) and Rothstein (op. cit.); and in English, Bissell (in Lange\'s series edited by D. S. Schaff, 1880); and Gifford (Speaker\'s Comm., 1888). The S. P. C. K. has a handy and serviceable volume published in the series of popular commentaries on the Old Testament. But this commentary, though published quite recently (my copy belongs to 1894, "nineteenth thousand"), needs strengthening on the side of its scholarship.<P>Arts. dealing with introduction occur in the various Bible Dictionaries (Smith\'s Dictionary of the Bible, Westcott and Ryle; Hastings, Dictionary of the Bible (five volumes), J. T. Marshall, able and original; Encyclopedia Biblica, Bevan, rather slight). To these must be added excellent articles in Jewish Encyclopedia (G. F. Moore), and Encyclopedia Biblica (R. H. Charles).``33';
isbe[1189]='Barzillai`bar-zil\'-a-i, bar-zil\'-i (barzillay; Berzelli, "man of iron" (BDB, but compare Cheyne, Encyclopedia Biblica)):<P>(1) A Gileadite of Rogelim who brought provisions to David and his army to Mahanaim, in their flight from Absalom (<a onClick="return mV(\'2Sa\',17,\'27-29\');">2Sa 17:27-29</a>). When David was returning to Jerusalem after Absalom\'s defeat, Barzillai conducted him over Jordan, but being an old man of 80 years of age, he declined David\'s invitation to come to live in the capital, and sent instead his son Chimham (<a onClick="return mV(\'2Sa\',19,\'31-39\');">2Sa 19:31-39</a>). David before his death charged Solomon to "show kindness unto the sons of Barzillai." (<a onClick="return mV(\'1Ki\',2,7);">1Ki 2:7</a>). Cheyne in Encyclopedia Biblica, without giving any reason, differentiates this Barzillai from Barzillai the Gileadite (<a onClick="return mV(\'Ezr\',2,61);">Ezr 2:61</a> = <a onClick="return mV(\'Neh\',7,63);">Ne 7:63</a>). See (2) below.<P>(2) The father of a family of priests who in Ezra\'s time, after the return of the exiles, could not trace their genealogy. "Therefore were they deemed polluted and put from the priesthood." This Barzillai had taken "a wife of the daughters of Barzillai the Gileadite," and had adopted his wife\'s family name (<a onClick="return mV(\'Ezr\',2,61,62);">Ezr 2:61-62</a> = <a onClick="return mV(\'Neh\',7,63,64);">Ne 7:63-64</a>). His original name is given as Jaddus (the King James Version Addus) (1Esdras 5:38). (See <a href="./study/isbe/search.html?string=ZORZELLEUS">ZORZELLEUS</a>; the Revised Version, margin "Phaezeldaeus.")<P>(3) Barzillai the Meholathite, whose son Adriel was married to Saul\'s daughter, either Michal (<a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a>) or Merab (<a onClick="return mV(\'1Sa\',18,19);">1Sa 18:19</a>).``145';
isbe[1190]='Basaloth`bas\'-a-loth (A, Baaloth; B, Basalem; 1Esdras 5:31 = Bazluth (<a onClick="return mV(\'Ezr\',2,52);">Ezr 2:52</a>) and Bazlith (<a onClick="return mV(\'Neh\',7,54);">Ne 7:54</a>)): The descendants of Basaloth (temple-servants) returned with Zerubbabel to Jerusalem.``1';
isbe[1191]='Bascama`bas\'-ka-ma (Baskama (1Macc 13:23)): A town located in the country of Gilead, where Tryphon slew Jonathan, the son of Absalom. Compare <a href="./study/isbe/search.html?string=JONATHAN">JONATHAN</a> (Apocrypha).``1';
isbe[1192]='Base`bas:<P>(1) Substantive from Latin basis, Greek basis, a foundation.<P>(a) (mekhonah): the fixed resting-place on which the lavers in Solomon\'s temple were set (<a onClick="return mV(\'1Ki\',7,\'27-43\');">1Ki 7:27-43</a>; <a onClick="return mV(\'2Ki\',16,17);">2Ki 16:17</a>; <a onClick="return mV(\'2Ki\',25,13,16);">25:13,16</a>; <a onClick="return mV(\'2Ch\',4,14);">2Ch 4:14</a>; <a onClick="return mV(\'Jer\',27,19);">Jer 27:19</a>; <a onClick="return mV(\'Jer\',52,17,20);">52:17,20</a>; compare <a onClick="return mV(\'Ezr\',3,3);">Ezr 3:3</a>; <a onClick="return mV(\'Zec\',5,11);">Zec 5:11</a> the American Revised Version, margin).<P>(b) (ken): pedestal in the King James Version and the Revised Version (British and American) (<a onClick="return mV(\'1Ki\',7,29,31);">1Ki 7:29, 31</a>) and in the Revised Version (British and American) only (<a onClick="return mV(\'Exd\',30,18,28);">Ex 30:18,28</a>; <a onClick="return mV(\'Exd\',31,9);">31:9</a>; <a onClick="return mV(\'Exd\',35,16);">35:16</a>; <a onClick="return mV(\'Exd\',38,8);">38:8</a>; <a onClick="return mV(\'Exd\',39,39);">39:39</a>; <a onClick="return mV(\'Exd\',40,11);">40:11</a>; <a onClick="return mV(\'Lev\',8,11);">Le 8:11</a>) of the base of the laver of the tabernacle (the King James Version "foot").<P>(c) (yarekh): "base of candlestick" (the Revised Version (British and American) of <a onClick="return mV(\'Exd\',25,31);">Ex 25:31</a>; <a onClick="return mV(\'Exd\',37,17);">37:17</a>) the King James Version "shaft."<P>(d) (yecodh): the Revised Version (British and American) "base of altar"; the King James Version "bottom" (<a onClick="return mV(\'Exd\',29,12);">Ex 29:12</a>; <a onClick="return mV(\'Exd\',38,8);">38:8</a>; <a onClick="return mV(\'Lev\',4,7,18,25,30,34);">Le 4:7, 18, 25, 30, 34</a>; <a onClick="return mV(\'Lev\',5,9);">5:9</a>; <a onClick="return mV(\'Lev\',8,15);">8:15</a>; <a onClick="return mV(\'Lev\',9,9);">9:9</a>).<P>(e) (gabh): the Revised Version (British and American) "elevation," i.e. basement of altar; the King James Version "higher place" (<a onClick="return mV(\'Eze\',43,13);">Eze 43:13</a>).<P>(2) Adjective from French bas—low, or Welsh bas—"shallow": of lowly birth or station, of voluntary humility and of moral depravity.<P>(a) (shaphal, shephal): of David\'s self-humiliation (<a onClick="return mV(\'2Sa\',6,22);">2Sa 6:22</a>): "a modest unambitious kingdom" (<a onClick="return mV(\'Eze\',17,14);">Eze 17:14</a>; <a onClick="return mV(\'Eze\',29,14,15);">29:14-15</a> (BDB); <a onClick="return mV(\'Dan\',4,17);">Da 4:17</a> (the American Standard Revised Version "lowest")): compare shephelah = "lowland."<P>(b) (qalah): men of humble birth and station as opposed to the nobles (<a onClick="return mV(\'Isa\',3,5);">Isa 3:5</a>).<P>(c) (beli-shem): "nameless," "of no account": "children of fools, yea, children of base men" (<a onClick="return mV(\'Job\',30,8);">Job 30:8</a>).<P>(d) the King James Version men, sons, daughters, children of Belial; literally "worthless persons"; in the American Standard Revised Version "base," except <a onClick="return mV(\'1Sa\',1,16);">1Sa 1:16</a> "wicked woman"; also the English Revised Version of <a onClick="return mV(\'Deu\',13,13);">De 13:13</a>, "base," which elsewhere retains the King James Version rendering.<P>(e) (tapeinos): "lowly," "humble or abject" (<a onClick="return mV(\'2Cr\',10,1);">2Co 10:1</a>); the Revised Version (British and American), "lowly"; so Paul\'s enemies said he appeared when present in the church at Corinth.<P>(f) (agenes): "of low birth," "of no account" (<a onClick="return mV(\'1Cr\',1,28);">1Co 1:28</a>): "base things of the world."<P>(g) (agoraios): " belonging to the market-place," loafers, worthless characters (<a onClick="return mV(\'Act\',17,5);">Ac 17:5</a>): "certain lewd fellows of the baser sort"; the Revised Version (British and American) "certain vile fellows of the rabble."``145';
isbe[1193]='Basemath; Bashemath; Basmath`bas\'-e-math, bash\'-e-math, bas\'-math (basemath, "fragrant"):<P>(1) Basemath, one of the wives of Esau, a daughter of Elon, the Hittite (<a onClick="return mV(\'Gen\',26,34);">Ge 26:34</a>; the King James Version Bashemath), probably identical with or a sister of Adah whom he also married (<a onClick="return mV(\'Gen\',36,2);">Ge 36:2</a>). Compare <a href="./study/isbe/search.html?string=ADAH">ADAH</a>.<P>(2) Basemath (the King James Version Bashemath), another wife of Esau, a daughter of Ishmael and a sister of Nebaioth (<a onClick="return mV(\'Gen\',36,3,4,10,13,17);">Ge 36:3-4, 10, 13, 17</a>). This wife is also called Mahalath (<a onClick="return mV(\'Gen\',28,9);">Ge 28:9</a>), and is of the house of Abraham. Esau married her because his father was not pleased with his other wives who were daughters of Canaan. Compare <a href="./study/isbe/search.html?string=MAHALATH">MAHALATH</a>.<P>(3) Basemath (the King James Version Basmath), the daughter of Solomon, and wife of Ahimaaz, a commissariat-officer in the service of Solomon (<a onClick="return mV(\'1Ki\',4,15);">1Ki 4:15</a>).``16';
isbe[1194]='Bashan`ba\'-shan (ha-bashan, "the Bashan"; Basan): This name is probably the same in meaning as the cognate Arabic bathneh, "soft, fertile land," or bathaniyeh (batanaea), "this land sown with wheat" ("wheatland").<P>1. Boundaries:<P>It often occurs with the article, "the Bashan," to describe the kingdom of Og, the most northerly part of the land east of the Jordan. It stretched from the border of Gilead in the south to the slopes of Hermen in the North. Hermon itself is never definitely included in Bashan, although Og is said to have ruled in that mountain (<a onClick="return mV(\'Jos\',12,5);">Jos 12:5</a>; <a onClick="return mV(\'Jos\',13,11);">13:11</a>). In <a onClick="return mV(\'Deu\',3,10);">De 3:10</a> Salecah and Edrei seem to indicate the east and west limits respectively. This would agree with <a onClick="return mV(\'Jos\',12,5);">Jos 12:5</a>; <a onClick="return mV(\'Jos\',13,11);">13:11</a>, which seem to make Geshur and Maacath the western boundary of Bashan. If this were so, then these unconquered peoples literally "dwelt in the midst of Israel." On the other hand <a onClick="return mV(\'Deu\',4,47);">De 4:47</a> may mean that the Jordan formed the western boundary; while <a onClick="return mV(\'Deu\',33,22);">De 33:22</a> makes Bashan extend to the springs of the Jordan. If Golan lay in the district in which its name is still preserved (el Jaulan), this also brings it to the lip of the Jordan valley (<a onClick="return mV(\'Deu\',4,43);">De 4:43</a>). "A mountain of summits," or "protuberances" (<a onClick="return mV(\'Psa\',68,15,16);">Ps 68:15-16</a>: Hebrew), might describe the highlands of the Jaulan, with its many volcanic hills as seen from the west. "A mountain of God" however does not so well apply to this region. Perhaps we should, with Wetzstein (Das batanaische Giebelgebirge) take these phrases as descriptive of Jebel Chauran, now usually called Jebel ed-Druze, with its many striking summits. This range protected the province from encroachment by the sands of the wilderness from the east. On the south Bashan marched with the desert steppe, el-Chamad, and Gilead. Of the western boundary as we have seen there can be no certainty. It is equally impossible to draw any definite line in the North.<P>2. Characteristics:<P>Bashan thus included the fertile, wooded slopes of Jebel ed-Druze, the extraordinarily rich plain of el-Chauran (en-Nuqrah—see <a href="./study/isbe/search.html?string=HAURAN">HAURAN</a>), the rocky tract of el-Leja\', the region now known as el-Jedur, resembling the Chauran in character, but less cultivated; and, perhaps, the breezy uplands of el-Jaulan, with its splendid reaches of pasture land. It was a land rich in great cities, as existing ruins sufficiently testify. It can hardly be doubted that many of these occupy sites of great antiquity. We may specially note Ashtaroth and Edrei, the cities of Og; Golan, the city of refuge, the site of which is still in doubt; and Salecah (Calkhad), the fortress on the ridge of the mountain, marking the extreme eastern limit of Israel\'s possessions.<P>The famous oaks of Bashan (<a onClick="return mV(\'Isa\',2,13);">Isa 2:13</a>; <a onClick="return mV(\'Eze\',27,6);">Eze 27:6</a>) have their modern representatives on the mountain slopes. It seems strange that in Scripture there is no notice of the wheat crops for which the country is in such repute today. Along with Carmel it stood for the fruitfulness of the land (<a onClick="return mV(\'Isa\',33,9);">Isa 33:9</a> etc.); and their languishing was an evident mark of God\'s displeasure (<a onClick="return mV(\'Nah\',1,4);">Na 1:4</a>). The "bulls of Bashan" represent blatant and brutal strength (<a onClick="return mV(\'Psa\',22,12);">Ps 22:12</a>, etc.). It is long since the lion deserted the plateau (<a onClick="return mV(\'Deu\',33,22);">De 33:22</a>); but the leopard is still not unknown among the mountains (<a onClick="return mV(\'Sgs\',4,8);">So 4:8</a>).<P>3. History:<P>In pre-Israelite days Bashan was ruled by Og the Amorite. His defeat at Edrei marked the end of his kingdom (<a onClick="return mV(\'Num\',21,33);">Nu 21:33</a>ff; <a onClick="return mV(\'Jos\',13,11);">Jos 13:11</a>), and the land was given to the half tribe of Manasseh (<a onClick="return mV(\'Jos\',13,30);">Jos 13:30</a>, etc.). In the Syrian wars Bashan was lost to Israel (<a onClick="return mV(\'1Ki\',22,3);">1Ki 22:3</a>ff; <a onClick="return mV(\'2Ki\',8,28);">2Ki 8:28</a>; <a onClick="return mV(\'2Ki\',10,32);">10:32</a>f), but it was regained by Jeroboam II (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>). It was incorporated in the Assyrian empire by Tiglath-pileser III (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). In the 2nd century BC it was in the hands of the Nabateans. It formed part of the kingdom of Herod the Great, and then belonged to that of Philip and Agrippa II.``54';
isbe[1195]='Bashan-Havvoth-Jair`ba\'-shan-hav\'-oth-ja\'-ir (bashan chawwoth ya\'ir)`<a href="./study/isbe/search.html?string=HAVVOTH+JAIR">HAVVOTH-JAIR</a>`1';
isbe[1196]='Bashemath`bash\'-e-math.`<a href="./study/isbe/search.html?string=BASEMATH">BASEMATH</a>`1';
isbe[1197]='Basilisk`baz\'-i-lisk (tsepha\', tsiph\'oni, from obsolete root tsapha\', "to hiss": <a onClick="return mV(\'Isa\',11,8);">Isa 11:8</a>; <a onClick="return mV(\'Isa\',14,29);">14:29</a>; <a onClick="return mV(\'Isa\',59,5);">59:5</a>; <a onClick="return mV(\'Jer\',8,17);">Jer 8:17</a>; <a onClick="return mV(\'Pro\',23,32);">Pr 23:32</a> m. In <a onClick="return mV(\'Pro\',23,32);">Pr 23:32</a>, the King James Version has "adder," margin "cockatrice"; in the other passages cited the King James Version has "cockatrice," margin "adder" (except <a onClick="return mV(\'Jer\',8,17);">Jer 8:17</a>, no margin)): The word is from basiliskos, "kinglet," from basileus, "king," and signifies a mythical reptile hatched by a serpent from a cock\'s egg. Its hissing drove away other serpents. Its look, and especially its breath, was fatal. According to Pliny, it was named from a crown-like spot on its head. It has been identified with the equally mythical <a href="./study/isbe/search.html?string=COCKATRICE">COCKATRICE</a> (which see). In all the passages cited, it denotes a venomous serpent (see <a href="./study/isbe/search.html?string=ADDER">ADDER</a>; <a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>), but it is impossible to tell what, if any, particular species is referred to. It must be borne in mind that while there are poisonous snakes in Palestine, there are more which are not poisonous, and most of the latter, as well as some harmless lizards, are commonly regarded as deadly. Several of the harmless snakes have crownlike markings on their heads, and it is quite conceivable that the basilisk myth may have been founded upon one of these.``37';
isbe[1198]='Basin; Bason`ba\'-s\'-n.<P>1. The Terms Used and Their Meaning:<P>The American Standard Revised Version has "basin," the King James Version and the Revised Version (British and American) "bason," the preferred spelling of the English revisers. In the Appendix to the Revised Old Testament the American Revisers (section viii) say, "The modern spelling is preferred for the following words"; then follow among others "basin" for "bason"; but no similar statement appears in the Appendix to the Revised New Testament. The Hebrew word so rendered in English Versions of the Bible is chiefly used for the large bowl of bronze (the King James Version "brass") employed by the priests to receive the blood of the sacrificial victims (<a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a>; compare <a onClick="return mV(\'Exd\',29,16);">Ex 29:16</a>; <a onClick="return mV(\'1Ki\',7,45);">1Ki 7:45</a>, etc.). It is found only once in secular use (<a onClick="return mV(\'Amo\',6,6);">Am 6:6</a>, "drink wine in bowls"), if the text there is correct; the Septuagint has it otherwise. See <a href="./study/isbe/search.html?string=BOWL">BOWL</a>. The "basins" of <a onClick="return mV(\'Exd\',12,22);">Ex 12:22</a>; <a onClick="return mV(\'2Sa\',17,28);">2Sa 17:28</a> were probably of earthenware.<P>2. Of Various Materials and Forms:<P>While the priests\' bowls were of bronze, similar bowls or basins of silver were presented by the princes of the congregation, according to <a onClick="return mV(\'Num\',7,13);">Nu 7:13</a>ff; and those spoken of in <a onClick="return mV(\'1Ki\',7,50);">1Ki 7:50</a> as destined for Solomon\'s temple were of gold (compare <a onClick="return mV(\'1Ch\',28,17);">1Ch 28:17</a>).<P>3. The Typical Ewer of the East:<P>(1) The well-known eastern mode of washing the hands was and is by pouring water on the hands, not by dipping them in water, an act, of course, calling for the aid of an attendant. Elisha "poured water on the hands of Elijah" (<a onClick="return mV(\'2Ki\',3,11);">2Ki 3:11</a>; see Kitto\'s note in Pictorial Bible 2, II, 330). A disciple came to be known as "one who poured water on the hands of another." Such was beyond question the prevailing custom among the ancient Hebrews, as it was, and is, among eastern peoples in general. They incline to look with disgust, if not with horror, upon our western practice of washing face and hands in water retained in a basin.<P>(2) The typical vessel of the East used in such ablutions has a long spout, not unlike our large coffee-pot (see Kitto, Pict. Biblical, II,331,note). While the English Versions of the Bible unfortunately often suggests nothing like such pouring, the Hebrew expresses it, e.g. in <a onClick="return mV(\'1Sa\',25,41);">1Sa 25:41</a>, where we have the Qal of rachats compare Kennedy in 1-vol HDB, and HDB, articles "Bath," "Bathing." Kennedy shows that "affusion," "pouring on" of water, was meant in many cases where we read "bathe" or "wash" in Enoch glish Versions. Lane (Mod. Egypt, chapter v) says: "A servant brings him a basin and ewer (called Tsisht and ibreek) of tinned copper or brass. The first has a cover with holes, with a raised receptacle for the soap; and the water is poured upon the hands and passes through the ewer into the space below; so that when the basin is brought to a second person the water with which the former has washed is not seen."<P>4. A Basin of a Unique Sort:<P>(1) A wash-basin of a special sort was used by Jesus for washing the disciples\' feet (see <a onClick="return mV(\'Jhn\',13,5);">Joh 13:5</a>). The Greek is nipter eita ballei hudor eis ton niptera, translated the Revised Version (British and American), "then he poureth water into the basin." This word nipter is not found elsewhere in the New Testament, nor in the Septuagint, nor, indeed, in Greek profane literature. But fortunately the general sense is here made plain by the context and by comparison of the cognate verbs niptein and n izein. It evidently denotes an article, not necessarily a vessel, specifically suited to the use of washing a part of the body, e.g. the hands or the feet, and hence is used with the article, "the basin," the Revised Version (British and American). It is doubtful, therefore, if "basin," or "bason," conveys a true idea of either the oriental article here meant or the scene portrayed. The fact that, according to the custom of the day, the position of the disciples here was reclining, precludes the possibility of the use of a "basin" of our sort, in the way we are accustom edition to, i.e. for immersing the feet in the water, in whole or in part.<P>(2) So it is likely that the nipter was a jug, or ewer, with a dish, saucer, or basin placed under it and combined with it to catch the dripping water. We know from other sources that such a vessel was kept in the Jewish house regularly for ordinary handwashings, etc. (see <a onClick="return mV(\'Mat\',15,2);">Mt 15:2</a>; <a onClick="return mV(\'Mar\',7,3);">Mr 7:3</a>), and for ceremonial ablutions. Hence, it would naturally be ready here in the upper room as a normal part of the preparation of the "goodman of the house" for his guests (the King James Version <a onClick="return mV(\'Mar\',14,14);">Mr 14:14</a>; <a onClick="return mV(\'Luk\',22,12);">Lu 22:12</a>), and so it is distinguished by the Greek article ton. Jesus Himself used the nipter, standing, doubtless, to impress upon His disciples the lessons of humility, self-abasement and loving service which He ever sought to impart and illustrate.<P>(3) Our conclusion, we may say with George Farmer in DCG, article "Bason," is that nipter was not simply one large basin, but the set of ewer and basin combined, such a set as was commonly kept in the Jewish house for the purpose of cleansing either the hands or the feet by means of affusion. The Arabic Tisht, authorities tell us, is the exact rendering of nipter, and it comes from a root which means "to pour," or "rain slightly." (See Anton Tien, reviser of the Arabic prayer-book, author of Arabic an d Mod. Greek Grammars, etc., quoted in DCG, article "Bason.")``47';
isbe[1199]='Basket`bas\'-ket: Four kinds of "baskets" come to view in the Old Testament under the Hebrew names, dudh, Tene\', cal and kelubh. There is little, however, in these names, or in the narratives where they are found, to indicate definitely what the differences of size and shape and use were. The Mishna renders us some help in our uncertainty, giving numerous names and descriptions of "baskets" in use among the ancient Hebrews (see Kreugel, Dasse Hausgerat in der Mishna, 39-45). They were variously m ade of willow, rush, palm-leaf, etc., and were used for various purposes, domestic and agricultural, for instance, in gathering and serving fruit, collecting alms in kind for the poor, etc. Some had handles, others lids, some both, others neither.<P>1. Meaning of Old Testament Terms:<P>(1) Dudh was probably a generic term for various kinds of baskets. It was probably the "basket" in which the Israelites in Egypt carried the clay for bricks (compare <a onClick="return mV(\'Psa\',81,6);">Ps 81:6</a>, where it is used as a symbol of Egyptian bondage), and such as the Egyptians themselves used for that purpose (Wilkinson, Ancient Egyptians, I, 379), probably a large, shallow basket, made of wicker-work. It stood for a basket that was used in fruit-gathering (see <a onClick="return mV(\'Jer\',24,1);">Jer 24:1</a>), but how it differed from Amos\' "basket of summer fruit" (<a onClick="return mV(\'Amo\',8,1);">Am 8:1</a>) we do not know. Dudh is used for the "pot" in which meat was boiled (<a onClick="return mV(\'1Sa\',2,14);">1Sa 2:14</a>), showing probably that a pot-shaped "basket" was known by this name. Then it seems to have stood for a basket tapering toward the bottom like the calathus of the Romans. So we seem forced to conclude that the term was generic, not specific.<P>(2) The commonest basket in use in Old Testament times was the cal. It was the "basket" in which the court-baker of Egypt carried about his confectionery on his head (<a onClick="return mV(\'Gen\',40,16);">Ge 40:16</a>). It was made in later times at least of peeled willows, or palm leaves, and was sometimes at least large and flat like the canistrum of the Romans, and, like it, was used for carrying bread and other articles of food (<a onClick="return mV(\'Gen\',40,16);">Ge 40:16</a>; <a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>). Meat for the meat offerings and the unleavened bread, were placed in it (<a onClick="return mV(\'Exd\',29,3);">Ex 29:3</a>; <a onClick="return mV(\'Lev\',8,2);">Le 8:2</a>; <a onClick="return mV(\'Num\',6,15);">Nu 6:15</a>). It is expressly required that the unleavened cakes be placed and offered in such a "basket." While a "basket," it was dish-shaped, larger or smaller in size, it would seem, according to demand, and perhaps of finer texture than the dudh.<P>(3) The Tene\' was a large, deep basket, in which grain and other products of garden or field were carried home, and kept (<a onClick="return mV(\'Deu\',28,5,17);">De 28:5, 17</a>), in which the first-fruits were preserved (<a onClick="return mV(\'Deu\',26,2);">De 26:2</a>), and the tithes transported to the sanctuary (<a onClick="return mV(\'Deu\',26,2);">De 26:2</a>f). It has been thought probable that the chabya, the basket of clay and straw of the Palestine peasantry of today, is a sort of survival or counterpart of it. It has the general shape of a jar, and is used for storing and keeping wheat, barley, oats, etc. At the top is the mouth into which the grain is poured, and at the bottom is an orifice through which it can be taken out as needed, when the opening is again closed with a rag. The Septuagint translates Tene\' by kartallos, which denotes a basket of the shape of an inverted cone.<P>(4) The term kelubh, found in <a onClick="return mV(\'Amo\',8,1);">Am 8:1</a> for a "fruit-basket," is used in <a onClick="return mV(\'Jer\',5,27);">Jer 5:27</a> (the King James Version and the Revised Version (British and American) "cage") for a bird-cage. But it is not at all unreasonable to suppose that a coarsely woven basket with a cover would be used by a fowler to carry home his feathered captives.<P>2. Meaning of New Testament Terms:<P>In the New Testament interest centers in two kinds of "basket," distinguished by the evangelists in their accounts of the feeding of the 5,000 and of the 4,000, called in Greek kophinos and spuris (Westcott-Hort sphuris).<P>(1) The kophinos (<a onClick="return mV(\'Mat\',14,20);">Mt 14:20</a>; <a onClick="return mV(\'Mar\',6,43);">Mr 6:43</a>; <a onClick="return mV(\'Luk\',9,17);">Lu 9:17</a>; <a onClick="return mV(\'Jhn\',6,13);">Joh 6:13</a>) may be confidently identified with the kuphta\' of the Mishna which was provided with a cord for a handle by means of which it could be carried on the back with such provisions as the disciples on the occasions under consideration would naturally have with them (of Kreugel, and Broadus, Commentary in the place cited.). The Jews of Juvenal\'s day carried such a specific "provision-basket" with them on their journeys regularly, and the Latin for it is a transliteration of this Greek word, cophinus (compare Juvenal iii.14, and Jastrow, Dictionary, article "Basket"). Some idea of its size may be drawn from the fact that in CIG,1625,46, the word denotes a Beotian measure of about two gallons.<P>(2) The sphuris or spuris (<a onClick="return mV(\'Mat\',15,37);">Mt 15:37</a>; <a onClick="return mV(\'Mar\',8,8);">Mr 8:8</a>) we may be sure, from its being used in letting Paul down from the wall at Damascus (<a onClick="return mV(\'Act\',9,25);">Ac 9:25</a>, etc.), was considerably larger than the kophinos and quite different in shape and uses. It might for distinction fitly be rendered "hamper," as Professor Kennedy suggests. Certainly neither the Greek nor ancient usage justifies any confusion.<P>(3) The sargane (<a onClick="return mV(\'2Cr\',11,33);">2Co 11:33</a>) means anything plaited, or sometimes more specifically a fish-basket.``47';
