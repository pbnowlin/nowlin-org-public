isbe = [];

isbe[1101]='Bahurim`ba-hu\'-rim bachurim; (Baoureim usually, but there are variants): A place in the territory of Benjamin which lay on an old road from Jerusalem to Jericho followed by David in his flight from Absalom (<a onClick="return mV(\'2Sa\',15,32);">2Sa 15:32-16:5</a>ff). It ran over the Mount of Olives and down the slopes to the east. The Talmud identifies it with Ale, math, the modern Almit, about a mile beyond \'Anata, going from Jerusalem. If this identification is correct, Wady Farah may be the brook of water (<a onClick="return mV(\'2Sa\',17,20);">2Sa 17:20</a>). Here Paltiel was parted from his wife Miehal by Abner (<a onClick="return mV(\'2Sa\',3,16);">2Sa 3:16</a>). It was the home of Shimei, who ran along a ridge of the hill cursing and throwing stones at the fugitive king (<a onClick="return mV(\'2Sa\',16,5);">2Sa 16:5</a>; <a onClick="return mV(\'1Ki\',2,8);">1Ki 2:8</a>). In Bahurim Jonathan and Ahimaaz, the native messengers of David, were concealed in a well by a loyal woman (<a onClick="return mV(\'2Sa\',17,18);">2Sa 17:18</a>ff). Azmaveth, one of David\'s heroes, was a of Bahurim. In <a onClick="return mV(\'2Sa\',23,31);">2Sa 23:31</a> we should read, as in <a onClick="return mV(\'1Ch\',11,33);">1Ch 11:33</a>,``54';
isbe[1102]='Baiterus`ba-i\'-ter-us Baiterous; (the King James Version Meterus): The descendants of Baiterus returned with Zerubbabel to Jerusalem (1Esdras 5:17). Omitted in <a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a> and <a onClick="return mV(\'Neh\',7,\'1-\');">Ne 7</a>.``1';
isbe[1103]='Bajith`ba\'-jith.`<a href="./study/isbe/search.html?string=BAYITH">BAYITH</a>`1';
isbe[1104]='Bakbakkar`bak-bak\'-ar baqbaqqar, "investigator": A Levite (<a onClick="return mV(\'1Ch\',9,15);">1Ch 9:15</a>).``1';
isbe[1105]='Bakbuk`bak\'-buk baqbuq, "bottle" perhaps onomatopoetical, referring to the clucking noise created by the pouring out of the contents of a bottle = Acub, (1Esdras 5:31): The descendants of Bakbuk returned with Zerubbabel to Jerusalem (<a onClick="return mV(\'Ezr\',2,51);">Ezr 2:51</a>; <a onClick="return mV(\'Neh\',7,53);">Ne 7:53</a>).``1';
isbe[1106]='Bakbukiah`bak-bu-ki\'-a baqbuqyah, ("the Lord pours out"):<P>(1) A Levite who "dwelt in Jerusalem" after the return from Babylon (<a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a>).<P>(2) A Levite who returned with Zerubbabel to Jerusalem (<a onClick="return mV(\'Neh\',12,9);">Ne 12:9</a>).<P>(3) A Levite and porter keeping "the watch at the store-houses of the gates" (<a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>).``1';
isbe[1107]='Bakemeats`bak\'-mets: Only in <a onClick="return mV(\'Gen\',40,17);">Ge 40:17</a> the King James Version and the English Revised Version. "All manner of baked food for Pharaoh" the American Standard Revised Version. Any kind of meat baked or cooked.`<a href="./study/isbe/search.html?string=BREAD">BREAD</a>; <a href="./study/isbe/search.html?string=FOOD">FOOD</a>`1';
isbe[1108]='Baking`bak\'-ing.`<a href="./study/isbe/search.html?string=BREAD">BREAD</a>`1';
isbe[1109]='Baking Pan``<a href="./study/isbe/search.html?string=BREAD">BREAD</a>; <a href="./study/isbe/search.html?string=PAN">PAN</a>`1';
isbe[1110]='Balaam`ba\'-lam bil\'am, ("devourer"): The son of Beor, from a city in Mesopotamia called Pethor, a man possessing the gift of prophecy, whose remarkable history may be found in <a onClick="return mV(\'Num\',22,\'2-\');">Nu 22:2-24:25</a>; compare <a onClick="return mV(\'Num\',31,8,16);">Num 31:8, 16</a>; <a onClick="return mV(\'Deu\',23,4);">De 23:4</a>; <a onClick="return mV(\'Jos\',13,22);">Jos 13:22</a>; <a onClick="return mV(\'Jos\',24,9);">24:9</a>; <a onClick="return mV(\'Neh\',13,2);">Ne 13:2</a>; <a onClick="return mV(\'Mic\',6,5);">Mic 6:5</a>; <a onClick="return mV(\'2Pe\',2,15);">2Pe 2:15</a>; <a onClick="return mV(\'Jud\',1,11);">Jude 1:11</a>; <a onClick="return mV(\'Rev\',2,14);">Re 2:14</a>.<P>1. History:<P>When the children of Israel pitched their tents in the plains of Moab, the Moabites entered into some sort of an alliance with the Midianites. At the instigation of Balak, at that time king of the Moabites, the elders of the two nations were sent to Balaam to induce him, by means of a bribe, to pronounce a curse on the advancing hosts of the Israelites. But, in compliance with God\'s command Balaam, refused to go with the elders. Quite different was the result of a second request enhanced by the higher rank of the messengers and by the more alluring promises on the part of Balak. Not only did God permit Balaam to go with the men, but he actually commanded him to do so, cautioning him, however, to act according to further instructions. While on his way to Balak, this injunction was strongly impressed on the mind of Balaam by the strange behavior of his ass and by his encounter with the Angel of the Lord.<P>Accompanied by Balak who had gone out to meet the prophet, Balaam came to Kiriath-huzoth. On the next morning he was brought up "into the high places of Baal" commanding a partial view of the camp of the Israelites. But instead of a curse he pronounced a blessing. From there he was taken to the top of Peor, yet this change of places and external views did not alter the tendency of Balaam\'s parables; in fact, his spirit even soared to greater heights and from his lips fell glowing words of praise and admiration, of benediction and glorious prophecy. This, of course, fully convinced Balak that all further endeavors to persuade the seer to comply with his wishes would be in vain, and the two parted.<P>Nothing else is said of Balaam, until we reach <a onClick="return mV(\'Num\',31,\'1-\');">Nu 31</a>. Here in <a onClick="return mV(\'Num\',31,8);">31:8</a> we are told of his violent death at the hands of the Israelites, and in <a onClick="return mV(\'Num\',31,16);">31:16</a> we learn of his shameful counsel which brought disgrace and disaster into the ranks of the chosen people.<P>2. Problems:<P>Now, there are a number of interesting problems connected with this remarkable story. We shall try to solve at least some of the more important ones.<P>(1) Was Balaam a prophet of Jeh? For an answer we must look to <a onClick="return mV(\'Num\',22,\'1-\');">Nu 22-24</a>. Nowhere is he called a prophet. He is introduced as the son of Beor and as a man reputed to be of great personal power (compare <a onClick="return mV(\'Num\',22,6);">Nu 22:6</a>). The cause of this is to be found in the fact that he had intercourse of some kind with God (compare <a onClick="return mV(\'Num\',22,9,20);">Nu 22:9,20</a>; <a onClick="return mV(\'Num\',22,\'22-35\');">22:22-35</a>; <a onClick="return mV(\'Num\',23,4);">23:4</a>; <a onClick="return mV(\'Num\',23,16);">23:16</a>). Furthermore, it is interesting to note how Balaam was enabled to deliver his parables. First it is said: "And Yahweh put a word in Balaam\'s mouth" (<a onClick="return mV(\'Num\',23,5);">Nu 23:5</a>; compare <a onClick="return mV(\'Num\',23,16);">Nu 23:16</a>), a procedure seemingly rather mechanical, while nothing of the kind is mentioned in <a onClick="return mV(\'Num\',24,\'1-\');">Nu 24</a>. Instead we meet with the remarkable sentence: "And when Balaam saw that it pleased Yahweh to bless Israel, he went not, as at the other times, to meet with enchantments ...."(<a onClick="return mV(\'Num\',24,1);">Nu 24:1</a>), and then: "the Spirit of God came upon him" (<a onClick="return mV(\'Num\',24,2);">24:2b</a>). All this is very noteworthy and highly instructive, especially if we compare with it <a onClick="return mV(\'Num\',24,3);">24:3</a> the Revised Version, margin and <a onClick="return mV(\'Num\',24,4);">Nu 24:4</a>: "The man whose eye is opened saith; he saith, who heareth the words of God, who seeth the vision of the Almighty," etc. The inference is plain enough: Balaam knew the Lord, the Yahweh of the Israelites, but his knowledge was dimmed and corrupted by heathen conceptions. He knew enough of God to obey Him, yet for a long time he hoped to win Him over to his own selfish plan (compare <a onClick="return mV(\'Num\',23,4);">23:4</a>). Through liberal sacrifices he expected to influence God\'s actions. Bearing this in mind, we see the import of <a onClick="return mV(\'Num\',24,1);">Nu 24:1</a>. After fruitless efforts to cajole God into an attitude favorable to his hidden purpose, he for a time became a prophet of the Lord, yielding to the ennobling influences of His spirit. Here was a chance for his better nature to assert itself permanently and to triumph over the dark forces of paganism. Did he improve this opportunity? He did not (compare <a onClick="return mV(\'Num\',31,8,16);">Nu 31:8,16</a>).<P>(2) Is the Balaam of <a onClick="return mV(\'Num\',22,\'1-\');">Nu 22-24</a> identical with the person of the same name mentioned in <a onClick="return mV(\'Num\',31,\'1-\');">Nu 31</a>? Quite a number of scholars deny it, or, to be more accurate, there are according to their theory two accounts of Balaam: the one in <a onClick="return mV(\'Num\',22,\'1-\');">Nu 22-24</a> being favorable to his character, and the other in <a onClick="return mV(\'Num\',31,\'1-\');">Nu 31</a> being quite the reverse. It is claimed the two accounts could only be made to agree by modifying or eliminating <a onClick="return mV(\'Num\',24,25);">Nu 24:25</a>. Now, we believe that <a onClick="return mV(\'Num\',31,16);">Nu 31:16</a> actually does modify the report of Balaam\'s return contained in <a onClick="return mV(\'Num\',24,25);">Nu 24:25</a>. The children of Israel slew Balaam with the sword (<a onClick="return mV(\'Num\',31,8);">Nu 31:8</a>). Why? Because of his counsel of <a onClick="return mV(\'Num\',31,16);">Num 31:16</a>. We maintain that the author of <a onClick="return mV(\'Num\',24,25);">Nu 24:25</a> had this fact in mind when he wrote <a onClick="return mV(\'Num\',25,1);">Nu 25:1</a>: "And...the people began to play the harlot," etc. Thus, he closely connects the report of Balaam\'s return with the narrative contained in <a onClick="return mV(\'Num\',9,5);">Nu 9:5</a>. Therefore, we regard <a onClick="return mV(\'Num\',31,8,16);">Nu 31:8, 16</a> as supplementary to <a onClick="return mV(\'Num\',22,\'1-\');">Nu 22-24</a>. But here is another question:<P>(3) Is the narrative in <a onClick="return mV(\'Num\',22,\'1-\');">Nu 22-24</a> the result of combining different traditions? In a general way, we may answer this question in the affirmative, and only in a general way we can distinguish between two main sources of tradition. But we maintain that they are not contradictory to each other, but supplementary.<P>(4) What about the talking of the ass and the marvelous prophecies of Balaam? We would suggest the following explanation. By influencing the soul of Balaam, God caused him to interpret correctly the inarticulate sounds of the animal. God\'s acting on the soul and through it on the intellect and on the hearts of men—this truth must be also applied to Balaam\'s wonderful prophetic words. They are called meshaliym or sayings of a prophet, a diviner.<P>In the first of these "parables" (<a onClick="return mV(\'Num\',23,\'7-10\');">Nu 23:7-10</a>) he briefly states his reasons for pronouncing a blessing; in the second parable (<a onClick="return mV(\'Num\',23,\'18-24\');">Nu 23:18-24</a>) he again emphasizes the fact that he cannot do otherwise than bless the Israelites, and then he proceeds to pronounce the blessing at some greater length. In the 3rd (<a onClick="return mV(\'Num\',24,\'3-9\');">Nu 24:3-9</a>) he describes the glorious state of the people, its development and irresistible power. In the last four parables (<a onClick="return mV(\'Num\',24,\'15-24\');">Nu 24:15-24</a>) he partly reveals the future of Israel and other nations: they are all to be destroyed, Israel\'s fate being included in the allusion to Eber. Now, at last, Balaam is back again in his own sphere denouncing others and predicting awful disasters. (On the "star out of Jacob," <a onClick="return mV(\'Num\',24,17);">Nu 24:17</a>, see <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>, ii, 9; <a href="./study/isbe/search.html?string=STAR+OF+THE+MAGI">STAR OF THE MAG</a>I.)<P>3. Balaam\'s Character:<P>This may furnish us a clue to his character. It, indeed, remains "instructively composite." A soothsayer who might have become a prophet of the Lord; a man who loved the wages of unrighteousness, and yet a man who in one supreme moment of his life surrendered himself to God\'s holy Spirit; a person cumbered with superstition, covetousness and even wickedness, and yet capable of performing the highest service in the kingdom of God: such is the character of Balaam, the remarkable Old Testament type and, in a sense, the prototype of Judas Iscariot.<P>4. Balaam as a Type:<P>In <a onClick="return mV(\'2Pe\',2,15);">2Pe 2:15</a> Balaam\'s example is used as a means to illustrate the pernicious influence of insincere Christian teachers. The author might have alluded to Balaam in the passage immediately preceding <a onClick="return mV(\'2Pe\',2,15);">2Pe 2:15</a> because of his abominable counsel. This is done in <a onClick="return mV(\'Rev\',2,14);">Re 2:14</a>. Here, of course, Balaam is the type of a teacher of the church who attempts to advance the cause of God by advocating an unholy alliance with the ungodly and worldly, and so conforming the life of the church to the spirit of the flesh.<P>LITERATURE.<P>Butler\'s Sermons, "Balaam"; ICC, "Numbers."``8';
isbe[1111]='Balac`ba\'-lak.`<a href="./study/isbe/search.html?string=BALAK">BALAK</a>`1';
isbe[1112]='Baladan`bal\'-a-dan bal\'adhan, "He (i.e. Merodach) has given a son": Baladan is said in <a onClick="return mV(\'2Ki\',20,12);">2Ki 20:12</a> and <a onClick="return mV(\'Isa\',39,1);">Isa 39:1</a> to have been the father of Berodach (Merodach)-Baladan, king of Babylon. Some have thought that the Biblical. writer was wrong here, inasmuch as it is said in the inscriptions of Sargon (Annals, 228, 315; Pt., 122), that Merodach-Baladan was the son of Yakin. It is evident, however, from the analogy of Jehu, who is called by the Assyrian kings the son of Omri, that Yakin is to be looked upon as the founder of the dynasty or kingdom, rather than as the father of Merodach-Baladan. The Bith Yakin, over which Merodach-Baladan is said to have been king, corresponds exactly to the phrase Bith Khumria, or House of Omri, over which Jehu is said to have ruled. There is no reason, then, for supposing that there is an error in either case. There is, however, good reason for believing that the Merodach-Baladan of the Book of Kings was the son of another king of the same name. That only the latter part of the father\'s name is here mentioned may be compared with the Shalman of <a onClick="return mV(\'Hsa\',10,14);">Ho 10:14</a> for the more fully-written Shalmaneser of <a onClick="return mV(\'2Ki\',17,3);">2Ki 17:3</a>; and with the Jareb of <a onClick="return mV(\'Hsa\',5,13);">Ho 5:13</a> and <a onClick="return mV(\'Hsa\',10,6);">Ho 10:6</a>, probably for Sennacherib. Such abbreviation of proper names was usual among the Assyrians and Babylonians. See Tallquist, Namenbuch, xiv-xix.``196';
isbe[1113]='Balah`ba\'la balah; Bola: A place, unidentified, in the territory of Simeon (<a onClick="return mV(\'Jos\',19,3);">Jos 19:3</a>), called Bilhah in <a onClick="return mV(\'1Ch\',4,29);">1Ch 4:29</a>. It may be identical with Baalah in Judah (<a onClick="return mV(\'Jos\',15,29);">Jos 15:29</a>).``1';
isbe[1114]='Balak`ba\'-ak balaq, ("devastator" or "one who lays waste"): Mentioned in connection with the story of Balaam/Balak (<a onClick="return mV(\'Num\',22,\'1-\');">Nu 22-24</a>; compare <a onClick="return mV(\'Jos\',24,9);">Jos 24:9</a>; <a onClick="return mV(\'Jdg\',11,25);">Jud 11:25</a>; <a onClick="return mV(\'Mic\',6,5);">Mic 6:5</a>; <a onClick="return mV(\'Rev\',2,14);">Re 2:14</a>). He was the king of Moab who hired Balaam to pronounce a curse on the Israelites.`<a href="./study/isbe/search.html?string=BALAAM">BALAAM</a>`1';
isbe[1115]='Balamon`bal\'-a-mon Balamon; (the King James Version, Balamo): In the field between Balamon and Dothaim Manasses, the husband of Judith, was buried (Judith 8:3). Compare Baal-hamon (<a onClick="return mV(\'Sgs\',8,11);">So 8:11</a>).``1';
isbe[1116]='Balance`bal\'-ans The English word "balance" is from the Latin bilanx = "having two scales" (bi = "two" and lanx = "plate," or "scale"). It is used to render three Hebrew words:<P>(1) mo\'znayim (<a onClick="return mV(\'Lev\',19,36);">Le 19:36</a>; <a onClick="return mV(\'Job\',6,2);">Job 6:2</a>; <a onClick="return mV(\'Psa\',62,9);">Ps 62:9</a>; <a onClick="return mV(\'Pro\',11,1);">Pr 11:1</a>; <a onClick="return mV(\'Isa\',40,12,15);">Isa 40:12, 15</a>; <a onClick="return mV(\'Jer\',32,10);">Jer 32:10</a>, etc.);<P>(2) qaneh (<a onClick="return mV(\'Isa\',46,6);">Isa 46:6</a>), and<P>(3) pelec (<a onClick="return mV(\'Pro\',16,11);">Pr 16:11</a>).<P>It is found in the sing., e.g. "a just balance" (<a onClick="return mV(\'Pro\',16,11);">Pr 16:11</a>); "a pair of balances" (<a onClick="return mV(\'Rev\',6,5);">Re 6:5</a>, etc.), as well as in the plural, e.g. "just balances" (<a onClick="return mV(\'Lev\',19,36);">Le 19:36</a>), "weighed in the balances" (<a onClick="return mV(\'Dan\',5,27);">Da 5:27</a>, etc.).<P>1. Balances among the Ancient Hebrews; the Parts, etc.:<P>(1) The "balances" of the ancient Hebrews differed little, if at all, from those used by the Egyptians (Wilkinson, Anc. Egypt (1878), II, 246f). They consisted, probably, of a horizontal bar, either pivoted on a perpendicular rod (see Erman, Aegypten, I, 615 for similar Egyptian balances), or suspended from a cord and held in the hand, the more primitive form. At the ends of the bar were pans, or hooks, from which the things to be weighed were suspended, sometimes in bags.<P>A good description of the more developed and final form is this: A beam with its fulcrum in the middle and its arms precisely equal. From the ends of the arms were suspended two scales, the one to receive the object to be weighed, the other the counterpoise, or weight.<P>(2) The weights were of stone at first and are so named in <a onClick="return mV(\'Deu\',25,13);">De 25:13</a> King James Version, margin. A pair of scales (the King James Version "a pair of balances") is used in <a onClick="return mV(\'Rev\',6,5);">Re 6:5</a> by a figure of speech for the balance as a whole; only once is the beam so used, in <a onClick="return mV(\'Isa\',46,6);">Isa 46:6</a>, literally, "weigh silver in the beam." Abraham, we are told (<a onClick="return mV(\'Gen\',23,16);">Ge 23:16</a>), "weighed the silver."<P>2. Probably of Babylonian Origin:<P>The basis and fountain-head of all systems of weights and measurements is to be traced, it is now thought, to Babylonia; but the primitive instruments and systems were subject to many modifications as they entered other regions and passed into the derivative systems. The Roman "balance" is the same as our steelyard (vulgarly called "stillyards"). Compare the Chinese, Danish, etc.<P>3. The System of Weighing Liable to Fraud:<P>Though the "balances" in ancient times were rudely constructed, the weighing could be done quite accurately, as may be seen in the use of equally primitive balances in the east today. But the system was liable to fraud. A "false balance" might be literally one so constructed that the arms were of unequal length, when the longer arm would be intended, of course, for the article to be weighed. The system was liable, however, to various other subtle abuses then as now; hence the importance in God\'s sight of "true weights" and a "just balance" is enforced again and again (see <a onClick="return mV(\'Lev\',19,36);">Le 19:36</a>; <a onClick="return mV(\'Pro\',11,1);">Pr 11:1</a>; <a onClick="return mV(\'Pro\',16,11);">16:11</a>; <a onClick="return mV(\'Pro\',20,23);">20:23</a>; <a onClick="return mV(\'Amo\',8,5);">Am 8:5</a>; <a onClick="return mV(\'Mic\',6,11);">Mic 6:11</a>, etc.).<P>4. "Wicked Balances" Condemned:<P>"A false balance is an abomination to Yahweh" (<a onClick="return mV(\'Pro\',11,1);">Pr 11:1</a>; compare <a onClick="return mV(\'Pro\',20,23);">Pr 20:23</a>), and "a just balance and scales are Yahweh\'s" (<a onClick="return mV(\'Pro\',16,11);">Pr 16:11</a>). <a onClick="return mV(\'Hsa\',12,7);">Ho 12:7</a> condemns "the balances of deceit" in the hand of the wicked; <a onClick="return mV(\'Amo\',8,5);">Am 8:5</a> (the King James Version) cries out upon "falsifying the balances by deceit," and <a onClick="return mV(\'Mic\',6,11);">Mic 6:11</a> denounces "wicked balances." Indeed, the righteousness of a just balance and true weights, and the iniquity of false ones are everywhere emphasized by the lawmakers, prophets and moral teachers of Israel, and the preacher or teacher who would expose and denounce such things in God\'s name today need be at no loss for texts and precedents.<P>See <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>.<P>LITERATURE.<P>Wilkinson, Ancient Egypt; Erman, Egypt; Lepsius, Denkmaler; and articles on "Balance." etc., in Smith, DB, EB, Jewish Encyclopedia, HDB, etc.``47';
isbe[1117]='Balancings`bal\'-ans-ins: "The balancings of the clouds" (<a onClick="return mV(\'Job\',37,16);">Job 37:16</a>), the manner in which they are poised and supported in the air, alike with their mysterious spreadings and motions, challenge the strongest intellect to explain.``1';
isbe[1118]='Balasamus`ba-las\'-a-mus.`<a href="./study/isbe/search.html?string=BAALSAMUS">BAALSAMUS</a>`1';
isbe[1119]='Bald Locust`bold lo\'kust.`<a href="./study/isbe/search.html?string=LOCUST">LOCUST</a>`1';
isbe[1120]='Baldness`bald\'-ness qorchah: The reference in the Bible to baldness is not to the natural loss of hair, but to baldness produced by shaving the head. This was practiced as a mark of mourning for the dead (<a onClick="return mV(\'Lev\',21,5);">Le 21:5</a>; <a onClick="return mV(\'Isa\',15,2);">Isa 15:2</a>; <a onClick="return mV(\'Isa\',22,12);">22:12</a>); as the result of any disaster (<a onClick="return mV(\'Amo\',8,10);">Am 8:10</a>; <a onClick="return mV(\'Mic\',1,16);">Mic 1:16</a>). The custom arose from the fact that the hair was regarded as a special ornament. It was the custom of the people of the land, and the Israelites were strictly forbidden to practice it (<a onClick="return mV(\'Lev\',21,5);">Le 21:5</a>; <a onClick="return mV(\'Deu\',14,1);">Deut 14:1</a>). These are striking passages with reference to the knowledge the Israelites had concerning the future life. This is saying to them what Paul said to the Thessalonians (<a onClick="return mV(\'1Th\',4,13);">1Th 4:13</a>). To call one a "bald head" was an epithet of contempt, and was sometimes applied to persons who were not naturally bald. It was the epithet applied by certain infidel young men to Elisha (<a onClick="return mV(\'2Ki\',2,23,24);">2Ki 2:23-24</a>). In a figurative sense it is used to express the barrenness of the country (<a onClick="return mV(\'Jer\',47,5);">Jer 47:5</a>).`<a href="./study/isbe/search.html?string=HAIR">HAIR</a>; <a href="./study/isbe/search.html?string=SHAVING">SHAVING</a>`87';
isbe[1121]='Ball`bol (dur): A rare Hebrew word used in this sense only in <a onClick="return mV(\'Isa\',22,18);">Isa 22:18</a>, and correctly rendered in the American Standard Revised Version "He will surely wind thee round and round, and toss thee like a ball into a large country." De Or, Bottcher, Jastrow, following Talmud, regard the noun as kaddur, but perhaps incorrectly.`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>`1';
isbe[1122]='Balm`bam (tseri, tsori; Septuagint rhetine): The name of an odoriferous resin said to be brought from Gilead by Ishmaelite Arabs on their way to Egypt (<a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>). It is translated "balm" in the King James Version and the Revised Version (British and American), but is called "mastic," the Revised Version, margin. In <a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a> it is one of the gifts sent by Jacob to Joseph, and in <a onClick="return mV(\'Eze\',27,17);">Eze 27:17</a> it is named as one of the exports from Judea to Tyre. The prophet Jeremiah refers figuratively to its medicinal properties as an application to wounds and as a sedative (<a onClick="return mV(\'Jer\',8,22);">Jer 8:22</a>; <a onClick="return mV(\'Jer\',46,11);">46:11</a>; <a onClick="return mV(\'Jer\',51,8);">51:8</a>). The name is derived from a root signifying "to leak," and is applied to it as being an exudation. There is a sticky, honeylike gum resin prepared at the present day at Jericho, extracted from the Balanites Aegyptiaca grown in the Ghor, and sold to travelers in small tin boxes as "Balm of Gilead," but it is improbable that this is the real tscori and it has no medicinal value. The material to which the classic authors applied the name is that known as Mecca balsam, which is still imported into Egypt from Arabia, as it was in early times. This is the exudation from the Balsamodendron opobalsamum, a native of Southern Arabia and Abyssinia. The tree is small, ragged-looking and with a yellowish bark like that of a plane tree, and the exudation is said to be gathered from its smaller branches. At the present day it grows nowhere in Palestine. Dr. Post and other botanists have sought for it on the Ghor and in Gilead, and have not found it, and there is no trace of it in the neighborhood of Jericho, which Pliny says is its only habitat. Strabo describes it as growing by the Sea of Galilee, as well as at Jericho, but both these and other ancient writers give inconsistent and incorrect descriptions of the tree evidently at second hand. We learn from Theophrastus that many of the spices of the farther East reached the Mediterranean shore through Palestine, being brought by Arab caravans which would traverse the indefinitely bounded tract east of Jordan to which the name Gilead is given, and it was probably thus that the balm received its local name. Mecca balsam is an orange-yellow, treacly fluid, mildly irritating to the skin, possibly a weak local stimulant and antiseptic, but of very little remedial value.``107';
isbe[1123]='Balm of Gilead`The people of Jericho today prepare for the benefit of pilgrims a "Balm of Gilead" from the zaqqum (Balanites Aegyptiaca), but this has no serious claims to be the balm of antiquity. If we are to look beyond the borders of modern Palestine we may credit the tradition which claims that Mecca balsam, a product of Balsamodendron Gileadense and B. opobalsamum, was the true "balm," and Post (HDB, I, 236) produces evidence to show that these plants were once grown in the Jordan valley. Yet another suggestion, made by Lagarde, is that the tsori = sturax, and if so then "balm" would be the inspissated juice of the Storax- tree (Stytax officinalis), a common inhabitant of Gilead.`<a href="./study/isbe/search.html?string=BALM">BALM</a>`117';
isbe[1124]='Balnuus`bal-nu\'-us (Codex Alexandrinus, Balnouos; Codex Vaticanus, Balnous = Binnui (<a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>)): Balnuus put away his "strange wife" (1Esdras 9:31).``1';
isbe[1125]='Balsam`bol\'-sam (basam, besem; hedusmata; thumiamata): Is usually "spices" but in the Revised Version, margin (<a onClick="return mV(\'Sgs\',5,1,13);">So 5:1, 13</a>; <a onClick="return mV(\'Sgs\',6,2);">6:2</a>) is rendered as "balsam." It was an ingredient in the anointing oil of the priests (<a onClick="return mV(\'Exd\',25,6);">Ex 25:6</a>; <a onClick="return mV(\'Exd\',35,28);">35:28</a>). The Queen of Sheba brought it as a present to Solomon (<a onClick="return mV(\'1Ki\',10,2);">1Ki 10:2</a>) in large quantity (<a onClick="return mV(\'1Ki\',10,10);">1Ki 10:10</a>) and of a finer quality (<a onClick="return mV(\'2Ch\',9,9);">2Ch 9:9</a>) than that brought as a regular tribute by other visitors (<a onClick="return mV(\'1Ki\',10,25);">1Ki 10:25</a>). In the later monarchy Hezekiah had a treasure of this perfume (<a onClick="return mV(\'2Ch\',32,27);">2Ch 32:27</a>) which he displayed to his Babylonian visitors (<a onClick="return mV(\'Isa\',39,2);">Isa 39:2</a>); and after the captivity the priests kept a store of it in the temple (<a onClick="return mV(\'1Ch\',9,30);">1Ch 9:30</a>). According to Ezekiel the Syrians imported it from Sheba (<a onClick="return mV(\'Eze\',27,22);">Eze 27:22</a>). There is a tradition preserved in Josephus (Ant., VIII, vi, 6) that the Queen of Sheba brought roots of the plant to Solomon, who grew them in a garden of spices at Jericho, probably derived from the references to such a garden in <a onClick="return mV(\'Sgs\',5,1,13);">So 5:1, 13</a>; <a onClick="return mV(\'Sgs\',6,2);">6:2</a>. This may be the source of the statements of Strabo, Trogus and Pliny quoted above (see <a href="./study/isbe/search.html?string=BALM">BALM</a>). It was probably the same substance as the <a href="./study/isbe/search.html?string=BALM">BALM</a> described above, but from the reference in <a onClick="return mV(\'Exd\',30,7);">Ex 30:7</a>; <a onClick="return mV(\'Exd\',35,8);">35:8</a>, it may have been used as a generic name for fragrant resins. The root from which the word is derived signifies "to be fragrant," and fragrant balsams or resins are known in modern Arabic as bahasan. The trees called in <a onClick="return mV(\'2Sa\',5,23,24);">2Sa 5:23-24</a> (Revised Version, margin) "balsam-trees" were certainly not those which yielded this substance, for there are none in the Shepehlah but there are both mulberry trees and terebinths in the district between Rephaim and Gezer. When used as a perfume the name basam seems to have been adopted, but as a medicinal remedy it is called tsori.``107';
isbe[1126]='Baltasar`bal-ta\'-sar (Baltasar; the King James Version Balthasar):<P>(1) The Greek of Hebrew, beltesha\'tstsar, or belte\'shatstsar, perhaps corresponding to BalaT-sar-ucur, "protect the life of the king," the Babylonian cognomen of Daniel. Compare Belteshazzar (<a onClick="return mV(\'Dan\',1,7);">Da 1:7</a>; <a onClick="return mV(\'Dan\',2,26);">2:26</a>; <a onClick="return mV(\'Dan\',4,8);">4:8</a>ff, et al.).<P>(2) Baltasar is also the Greek of the Hebrew belsha\'tstsar, or bel\'shatstsar, the name of the last king of Babylon (corresponding to the Babylonian Bel-sar-ucur; Schrader, Die Keilinschriften und das Alte Testament, III, 396; Syriac Blitshazzar; Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) Baltassar). Compare Baruch 1 11 and Belshazzar (<a onClick="return mV(\'Dan\',5,1);">Da 5:1</a>ff; <a onClick="return mV(\'Dan\',7,1);">7:1</a>; <a onClick="return mV(\'Dan\',8,1);">8:1</a>).<P>(3) The name of one of the Magi who according to the legend visited Jesus at Bethlehem: Melchior from Nubia, Balthasar from Godolia, Caspar from Tharsis.``16';
isbe[1127]='Bamah`ba\'-ma, ba\'-ma (bamah, "high place"): The word appears in <a onClick="return mV(\'Eze\',20,29);">Eze 20:29</a> where reference is made to former "high-place worship," the prophet speaking with contempt of such manner of worship. Ewald suggests a play of words, ba\', "come" and mah, "what," "what (mah) is the high place (ba-mah) whereunto ye come (ba\')?" It is possible that reference is made to a prominent high place like the one at Gibeon (compare <a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a>; <a onClick="return mV(\'1Ch\',16,39);">1Ch 16:39</a>; <a onClick="return mV(\'1Ch\',21,29);">21:29</a>; <a onClick="return mV(\'2Ch\',13,\'1-\');">2Ch 13</a>) for which the name "Bamah" was retained after the reform mentioned by the prophet.``1';
isbe[1128]='Bamoth; Bamoth-Baal`ba\'-moth, ba\'-moth-ba\'-al (bamoth-ba\'al, "high places of Baal"): Bamoth is referred to in <a onClick="return mV(\'Num\',21,19,20);">Nu 21:19-20</a>, as a station in the journeyings of Israel north of the Arnon. It is probably the same place as the Bamoth-baal of <a onClick="return mV(\'Num\',22,41);">Nu 22:41</a> (Revised Version margin), whither Balak, king of Moab, conducted Balaam to view and to curse Israel. Bamoth-baal is named in <a onClick="return mV(\'Jos\',13,17);">Jos 13:17</a> as one of the cities given to Reuben. Mesha, on the Moabite Stone, speaks of having "rebuilt" Beth-bamoth.``1';
isbe[1129]='Ban`(A, Ban; B, Bainan; 1Esdras 5:37 = Tobiah (<a onClick="return mV(\'Ezr\',2,60);">Ezr 2:60</a>; <a onClick="return mV(\'Neh\',7,62);">Ne 7:62</a>); some manuscripts of the Septuagint read Boua): The descendants of Ban were not able to trace their ancestry to show "how they were of Israel."``1';
isbe[1130]='Banaias`ban-a-i\'-as (Banaias; 1Esdras 9:35 = Benaiah (<a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>)): Banaias put away his "strange wife."``1';
isbe[1131]='Band`The English word has two generic meanings, each shading off into several specific meanings:<P>(1) that which holds together, binds or encircles: a bond;<P>(2) a company of men. The second sense may philologically and logically have been derived from the first, men being held together by social ties. Both meanings appear in Old Testament and New Testament representing various Hebrew and Greek words.<P>(1) A band<P>(a) (\'ecur): a flaxen rope (<a onClick="return mV(\'Jdg\',15,14);">Jud 15:14</a>); a band of iron and brass (<a onClick="return mV(\'Dan\',4,15,23);">Da 4:15, 23</a>); metaphorically used of a false woman\'s hands (<a onClick="return mV(\'Ecc\',7,26);">Ec 7:26</a>).<P>(b) (chebhel): "The bands of the wicked have robbed me" (the King James Version of <a onClick="return mV(\'Psa\',119,61);">Ps 119:61</a>), where "bands" = "troops" by mistr; the Revised Version (British and American) "The cords of the wicked have wrapped me round"; plural chobhlim = "bands" = the name of the prophet\'s symbolic staff representing the brotherhood between Judah and Israel (<a onClick="return mV(\'Zec\',11,7,14);">Zec 11:7, 14</a>).<P>(c) (\'abhoth): "I drew them with cords of a man, with bands of love" (<a onClick="return mV(\'Hsa\',11,4);">Ho 11:4</a>; compare <a onClick="return mV(\'Eze\',3,25);">Eze 3:25</a>; <a onClick="return mV(\'Eze\',4,8);">4:8</a>; <a onClick="return mV(\'Job\',39,10);">Job 39:10</a>).<P>(d) (saphah): the edge of the round opening in the robe of the ephod with a band (the Revised Version (British and American) "binding") round about the hole of it (only in <a onClick="return mV(\'Exd\',39,23);">Ex 39:23</a>).<P>(e) (chartsubboth): bands (the Revised Version (British and American) "bonds") of wickedness (<a onClick="return mV(\'Isa\',58,6);">Isa 58:6</a>); bands (= pains) in death (<a onClick="return mV(\'Psa\',73,4);">Ps 73:4</a>); the Revised Version, margin ("pangs," Cheyne, "torments").<P>(f) (motah): the cross bar of oxen\'s yoke, holding them together (<a onClick="return mV(\'Lev\',26,13);">Le 26:13</a>; <a onClick="return mV(\'Eze\',34,27);">Eze 34:27</a> the King James Version; the Revised Version (British and American) "bars").<P>(g) (mocer): a fetter: "Who hath loosed the bonds of the swift ass?" (<a onClick="return mV(\'Job\',39,5);">Job 39:5</a>; <a onClick="return mV(\'Psa\',2,3);">Ps 2:3</a>; <a onClick="return mV(\'Psa\',107,14);">107:14</a>; <a onClick="return mV(\'Isa\',28,22);">Isa 28:22</a>; <a onClick="return mV(\'Isa\',52,2);">52:2</a>; <a onClick="return mV(\'Jer\',2,20);">Jer 2:20</a>; all in the King James Version and the Revised Version (British and American)). The same Hebrew word (in <a onClick="return mV(\'Psa\',116,16);">Ps 116:16</a>; <a onClick="return mV(\'Jer\',5,5);">Jer 5:5</a>; <a onClick="return mV(\'Jer\',27,2);">27:2</a>; <a onClick="return mV(\'Jer\',30,8);">30:8</a>; <a onClick="return mV(\'Nah\',1,13);">Na 1:13</a>) is translated "bonds " in the King James Version, and in the English Revised Version of <a onClick="return mV(\'Psa\',116,16);">Ps 116:16</a>, and <a onClick="return mV(\'Nah\',1,13);">Na 1:13</a>, but "bands" in the English Revised Version of <a onClick="return mV(\'Jer\',5,5);">Jer 5:5</a>; <a onClick="return mV(\'Jer\',27,2);">27:2</a>; <a onClick="return mV(\'Jer\',30,8);">30:8</a>; the American Standard Revised Version has "bonds" throughout. See <a href="./study/isbe/search.html?string=BOND">BOND</a>.<P>(h) (moshekhoth): "Canst thou...loose the bands of Orion?" (only in <a onClick="return mV(\'Job\',38,31);">Job 38:31</a>).<P>(i) (desmos, sundesmos): a fetter: that which binds together: of the chains of a lunatic or prisoner (<a onClick="return mV(\'Luk\',8,29);">Lu 8:29</a>; <a onClick="return mV(\'Act\',16,26);">Ac 16:26</a>; <a onClick="return mV(\'Act\',22,30);">22:30</a> the King James Version), metaphorically of the mystic union of Christ and the church (<a onClick="return mV(\'Col\',2,19);">Col 2:19</a>). These words are often translated by "bond" in the King James Version and the Revised Version (British and American).<P>(j) (zeukteria): the rudder\'s bands (only in <a onClick="return mV(\'Act\',27,40);">Ac 27:40</a>).<P>(2) A company of men<P>(a) (gedhudh): a band of soldiers (<a onClick="return mV(\'2Sa\',4,2);">2Sa 4:2</a>; <a onClick="return mV(\'1Ki\',11,24);">1Ki 11:24</a>, the King James Version; <a onClick="return mV(\'2Ki\',6,23);">2Ki 6:23</a>; <a onClick="return mV(\'2Ki\',13,20,21);">13:20-21</a>; <a onClick="return mV(\'2Ki\',24,2);">24:2</a>; <a onClick="return mV(\'1Ch\',7,4);">1Ch 7:4</a>; <a onClick="return mV(\'1Ch\',12,18,21);">12:18, 21</a>; <a onClick="return mV(\'2Ch\',22,1);">2Ch 22:1</a>). So the Revised Version (British and American) (except in <a onClick="return mV(\'1Ki\',11,24);">1Ki 11:24</a>, "troop").<P>(b) (ro\'sh): "head" = "division": "The Chaldeans made three bands" (<a onClick="return mV(\'Job\',1,17);">Job 1:17</a>); <a onClick="return mV(\'1Ch\',12,23);">1Ch 12:23</a> the Revised Version (British and American) translates "heads."<P>(c) (chayil): "a band of men" the Revised Version (British and American) the "host" (only in <a onClick="return mV(\'1Sa\',10,26);">1Sa 10:26</a>).<P>(d) (\'aghappim): "the wings of an army," only in Ezekiel, armies of the King of Judah (<a onClick="return mV(\'Eze\',12,14);">12:14</a>; <a onClick="return mV(\'Eze\',17,21);">17:21</a>); of Gomer and of Togarmah (<a onClick="return mV(\'Eze\',38,6);">38:6</a>); of Gog (the Revised Version (British and American) "hordes") (<a onClick="return mV(\'Eze\',38,9,22);">38:9, 22</a>; <a onClick="return mV(\'Eze\',39,4);">39:4</a>).<P>(e) (machaneh): "camp": only in <a onClick="return mV(\'Gen\',32,7,10);">Ge 32:7, 10</a>; the Revised Version (British and American) "companies."<P>(f) (chotsets): of locusts dividing into companies or swarms (<a onClick="return mV(\'Pro\',30,27);">Pr 30:27</a>).<P>(g) (speira): usually a "cohort" (see the Revised Version, margin) of Roman soldiers; the tenth part of a legion, about 600 men: (<a onClick="return mV(\'Mat\',27,27);">Mt 27:27</a>; <a onClick="return mV(\'Mar\',15,16);">Mr 15:16</a>; <a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>; <a onClick="return mV(\'Act\',21,31);">21:31</a>; <a onClick="return mV(\'Act\',27,1);">27:1</a>). A smaller detachment of soldiers (<a onClick="return mV(\'Jhn\',18,3,12);">Joh 18:3, 12</a>; compare 2Macc 8:23; Judith 1:4:11).<P>(h) (poiein sustrophen): "to make a conspiracy": "The Jews banded together" (<a onClick="return mV(\'Act\',23,12);">Ac 23:12</a>).<P>T. Rees<P>(3) The Augustan Band (speira Sebaste) to which Julius, the Roman centurion who had charge of Paul as a prisoner on his voyage to Rome, belonged, was a cohort apparently stationed at Caesarea at the time (<a onClick="return mV(\'Act\',27,1);">Ac 27:1</a>). Schurer (GJV, I3, 461f) is of opinion that it was one of five cohorts mentioned by Josephus, recruited in Samaria and called Sebastenes from the Greek name of the city of Samaria (Sebaste). This particular cohort had in all likelihood for its full name Cohors Augusta Sebastenorum, Augusta being an honorific title of which examples are found in the case of auxiliary troops. Sir William Ramsay, following Mommsen (Paul the Traveler,315,348), thinks it denotes a body of legionary centurions, selected from legions serving abroad, who were employed by the emperor on confidential business between the provinces and Rome, the title Augustan being conferred upon them as a mark of favor and distinction. The grounds on which the views of Mommsen and Ramsay rest are questioned by Professor Zahn (Introduction to the New Testament, I, 551ff), and more evidence is needed to establish them.<P>See <a href="./study/isbe/search.html?string=ARMY,+ROMAN">ARMY (ROMAN)</a>.<P>(4) The Italian Band (speira Italike) was a cohort composed of volunteer Roman citizens born in Italy and stationed at Caesarea at this time (<a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>). Schurer maintains that there could have been no Roman cohort there at this time, although he accepts the testimony of inscriptions to the presence of an Italian cohort at a later time. He accordingly rejects the story of Cornelius, holding that the author of the Acts has given in this narrative conditions belonging to a later time (GJV, I3, 462f). In reply to Schurer, Blass asks why one of the five cohorts mentioned by Josephus may not have been composed of Roman citizens living at Caesarea or Sebaste, and bearing this name (Blass, Acta Apostolorum, 124). From a recently discovered inscription, Sir W. M. Ramsay has ascertained that there was an Italian cohort stationed in Syria in 69 AD, which heightens the probability of one actually being found in Caesarea at 41-44 AD, and he shows that even if his cohort was at the time on duty elsewhere a centurion like Cornelius might well have been at Caesarea at the time mentioned (Expositor, 5th series, IV, V, with Schurer\'s rejoinder). The subject of detached service in the provinces of the Roman Empire is admittedly obscure, but nothing emerges in this discussion to cast doubt upon the historical character of Luke\'s narrative.`<a href="./study/isbe/search.html?string=ARMY,+roman">ARMY (ROMAN)</a>`128';

isbe[1134]='Bani`ba\'-ni (bani, "posterity"):<P>(1) A Gadite, one of David\'s mighty men (<a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a>).<P>(2) A Levite whose son was appointed for service in the tabernacle at David\'s time (<a onClick="return mV(\'1Ch\',6,46);">1Ch 6:46</a>).<P>(3) A Judahite whose son lived in Jerusalem after the captivity (<a onClick="return mV(\'1Ch\',9,4);">1Ch 9:4</a>).<P>(4) The descendants of Bani (called Binnui, <a onClick="return mV(\'Neh\',7,15);">Ne 7:15</a>) returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,10);">Ezr 2:10</a>) and had taken "strange wives" (<a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>).<P>(5) Bani who had taken a "strange wife" (<a onClick="return mV(\'Ezr\',10,38);">Ezr 10:38</a>) mentioned with his brothers, the sons of Bani who also had taken "strange wives" (<a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>).<P>(6) Son of Bani, a Levite and builder (<a onClick="return mV(\'Neh\',3,17);">Ne 3:17</a>).<P>(7) Bani, who instructed the people at Ezra\'s time (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>).<P>(8) Three Levites mentioned in connection with the temple worship at Ezra\'s time (<a onClick="return mV(\'Neh\',9,4,5);">Ne 9:4-5</a>).<P>(9) A Levite who sealed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,13);">Ne 10:13</a>).<P>(10) A leader of the people who also signed the covenant (<a onClick="return mV(\'Neh\',10,14);">Ne 10:14</a>).<P>(11) One whose son Uzzi was overseer of the Levites at Jerusalem (<a onClick="return mV(\'Neh\',11,22);">Ne 11:22</a>).`<a href="./study/isbe/search.html?string=BINNUI">BINNUI</a>`16';
isbe[1135]='Banias (1)`ba-ni\'-as (B, Banias; A, Bani; the King James Version Banid (1Esdras 8:36)): An ancestor of Salimoth. The descendants of Banias returned with Ezra to Jerusalem. The name is omitted (<a onClick="return mV(\'Ezr\',8,10);">Ezr 8:10</a>), perhaps due to the oversight of a copyist or a mistaken reading of bene, "sons of," for bani.``1';

isbe[1139]='Bank`bank:<P>(1) (saphah, "lip," "edge"): "By the bank of the Jordan" (<a onClick="return mV(\'2Ki\',2,13);">2Ki 2:13</a>); "Upon the bank of the river were very many trees" (<a onClick="return mV(\'Eze\',47,7,12);">Eze 47:7, 12</a>).<P>(2) (gadhah, "cuttings"): Always of banks overflowed (<a onClick="return mV(\'Jos\',3,15);">Jos 3:15</a>; <a onClick="return mV(\'Jos\',4,18);">4:18</a>; <a onClick="return mV(\'Isa\',8,7);">Isa 8:7</a>), as also<P>(3) (gidhyah, <a onClick="return mV(\'1Ch\',12,15);">1Ch 12:15</a>). (4) (solelah, "mound," "rampart"): "Cast up a bank against the city" (<a onClick="return mV(\'2Sa\',20,15);">2Sa 20:15</a>, the English Revised Version "mount," the American Standard Revised Version "mound"; compare <a onClick="return mV(\'2Ki\',19,32);">2Ki 19:32</a>; <a onClick="return mV(\'Isa\',37,33);">Isa 37:33</a>). "Banks of sweet herbs" (<a onClick="return mV(\'Sgs\',5,13);">So 5:13</a>); "the marginal rendering is the right one, \'towers of perfumes,\' i.e. plants with fragrant leaves and flowers trained on trellis-work" (Speaker\'s Commentary in the place cited.).<P>(5) (charax, "a stake," "entrenchment"): "Thine enemies shall cast up a bank about thee" (<a onClick="return mV(\'Luk\',19,43);">Lu 19:43</a> the King James Version "trench"). It is probably a military term and stands for a "palisade" (so the Revised Version, margin), i.e. probably an embankment of stakes strengthened with branches and earth, with a ditch behind it, used by the besiegers as a protection against arrows or attacking parties (Latin vallum), such, no doubt, as was employed by Titus in the siege of Jerusalem, 70 AD (Josephus, BJ, V, vi, 2).<P>(6) <a href="./study/isbe/search.html?string=BANK;+BANKING">BANK; BANKING</a> (which see).``91';
isbe[1140]='Bank; Banking`1. Introductory:<P>"Banking" in the full modern sense, of taking money on deposit and lending it out on interest, is of comparatively recent origin. A few "banks of deposit" were founded in Italy in the Middle Ages, but the earliest "banks of issue," of the modern sort, were those of Amsterdam (1609) and Hamburg (1619), beginning in the 17th century. The law of Moses forbade Israelites to charge each other interest (<a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a>; <a onClick="return mV(\'Lev\',25,35,37);">Le 25:35, 37</a>; <a onClick="return mV(\'Deu\',23,19);">De 23:19</a>), but let them lend on interest to Gentiles (<a onClick="return mV(\'Deu\',23,20);">De 23:20</a>), though this law was often evaded or disregarded (<a onClick="return mV(\'Neh\',5,10,12);">Ne 5:10, 12</a>). Banks and banking, however, are found in operation in the Greek cities; "moneychangers," sitting at their tables (trapezai) in the market place, both changed coins and took money on deposit, giving high interest; and banking of a sort, in its incipient stages, existed among the ancient Hebrews. But the Phoenicians are now thought to have been the inventors of the money-changing, money-lending system which is found in more or less modified and developed forms among ancient peoples and in full development and operation in the palmy days of the Roman Empire. In the Greek-Roman period, without doubt, bankers both received money on deposit, paying interest, and let it out at a higher rate, or employed it in trade, as the publicani at Rome did, in farming the revenues of a province (Plumptre).<P>2. Banking among the Ancient Hebrews:<P>(1) The Hebrew money-changer, like his modern Syrian counterpart, the saraf (see PEFS, 1904, 49ff, where the complexity of exchange in Palestine today is graphically described), changed the large coins current into those of smaller denominations, e.g. giving denarii for tetradrachms, or silver for gold, or copper for silver.<P>(2) But no mean part of his business was the exchanging of foreign money, and even the money of the country of a non- Phoenician standard, for shekels and half-shekels on this standard, the latter being accepted only in payment of the temple dues (see <a href="./study/isbe/search.html?string=MONEY">MONEY</a>). The "money-changers" of <a onClick="return mV(\'Mat\',21,12);">Mt 21:12</a>, as the Greek signifies, were men who made small change. Such men may be seen in Jerusalem now with various coins pried in slender pillars on a table (compare epi trapezan, <a onClick="return mV(\'Luk\',19,23);">Lu 19:23</a>), ready to be used in changing money for a premium into such forms, or denominations, as would be more current or more convenient for immediate use.<P>(3) "Usury" in English Versions of the Bible is simply Old English for what we today call "interest," i.e. the sum paid for the use of money, Latin usura; and "interest" should take the place of it in all passages in the Old Testament and New Testament, where it has such significance.<P>3. Banking in New Testament Times:<P>The Greek word rendered (tokos), "usury" in the New Testament (see <a onClick="return mV(\'Luk\',19,23);">Lu 19:23</a>f) means literally, "what is born of money," "what money brings forth or produces." "Usury" has come to mean "exorbitant interest," but did not mean this at the time of the King James Version, 1611.<P>(1) In Christ\'s time, and immediately following, there was great need for money-changers and money-changing, especially on the part of foreign Jews whom custom forbade to put any but Jewish coins into the temple treasury (see <a onClick="return mV(\'Mar\',12,41);">Mr 12:41</a>). It was mainly for the convenience of these Jews of the Dispersion, and because it was in order to a sacred use, that the people thought it proper to allow the money-changers to set up their tables in the outer court of the temple (see <a onClick="return mV(\'Mat\',21,12);">Mt 21:12</a>ff).<P>(2) The language of <a onClick="return mV(\'Mat\',25,27);">Mt 25:27</a>, \'Thou oughtest to have put my money to the bankers,\' etc., would seem to indicate the recognition by Christ of the custom and propriety of lending out money on interest (compare <a onClick="return mV(\'Mat\',19,23);">19:23</a>). The "exchangers" here are "bankers" (compare <a onClick="return mV(\'Mat\',25,27);">Mt 25:27</a>). The Greek (trapezitai) is from a word for "bank" or "bench" (trapeza), i.e. the "table" or "counter" on which the money used to be received and paid out. These "bankers" were clearly of a higher class than the "small-change men" of <a onClick="return mV(\'Mat\',21,12);">Mt 21:12</a>, etc. (compare "changers of money," <a onClick="return mV(\'Jhn\',2,14);">Joh 2:14</a>, and "changers," <a onClick="return mV(\'Jhn\',2,15);">Joh 2:15</a>, English Versions). Christ upbraids the "slothful servant" because he had not given his pound to "the bank" (or "banker," epi trapezan, literally, "on a banker\'s table"), who, it is implied, would have kept it safe and paid interest for it (<a onClick="return mV(\'Luk\',19,23);">Lu 19:23</a>f). It is noteworthy that the "tenminae" of <a onClick="return mV(\'Luk\',19,24);">Lu 19:24</a> are those acquired by "the good servant" from the "one" which was first lent him. So these wealthier bankers even then in a way received money on deposit for investment and paid interest on it, after the fashion of the Greeks.<P>4. Interpretations, Figurative Uses, etc.:<P>(1) In Christ\'s parable (<a onClick="return mV(\'Luk\',19,23);">Lu 19:23</a>ff) "the bank" (literally, "a bank," "table") is taken by some to mean "the synagogue," by others to mean "the church" (Lange, LJ, II, 1, 414); i.e. it is thought that Christ meant to teach that the organized body, "synagogue" or "church," might use the gifts or powers of an adherent or disciple, when he himself could not exercise them (compare DCG, article "Bank").<P>(2) Then some have thought that Christ was here pointing to prayer as a substitute for good works, when the disciple was unable to do such. Such views seem far-fetched and unnecessary (compare Bruce, Parabolic Teaching of Christ, 209f).<P>(3) The "money-changers," then as now, had ever to be on guard against false money, which gives point to the oft-quoted extra-scriptural saying (agraphon) of Jesus to His disciples: "Be ye expert money-changers" (Greek ginesthai trapezitai dokimoi; see Origen, in Joam, XIX), which was taken (Clem., Hom., III, 61) to mean, "Be skillful in distinguishing true doctrine from false" (HDB, 1-vol).``47';

isbe[1142]='Bannas`ban\'-as (Bannos; the King James Version, Banuas): A name occurring in the list of those who returned from the captivity with Zerubbabel (1Esdras 5:26). Bannas and Sudias are represented by Hoodaviah in the lists of Ezra and Nehemiah.``1';
isbe[1143]='Banneas`ban-e\'-as (Bannaias; the King James Version Baanias (1Esdras 9:26) = Benaiah (<a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>)): Banneas put away his "strange wife."``1';
isbe[1144]='Banner`ban\'-er (<a href="./study/isbe/search.html?string=ENSIGN">ENSIGN</a>; <a href="./study/isbe/search.html?string=STANDARDS">STANDARDS</a>): The English word "banner" is from banderia, Low Latin, meaning a banner (compare bandum, Latin, which meant first a "band," an organized military troop, and then a "flag"). It has come to mean a flag, or standard, carried at the head of a military band or body, to indicate the line of march, or the rallying point, and it is now applied, in its more extended significance, to royal, national, or ecclesiastical "banners" also. We find it applied sometimes to a streamer on the end of a lance, such as is used by the Arab sheik today. "Banner" occurs in the following significant Old Testament passages:<P>(1) in the singular, "Lift ye up a banner upon the high mountain" (<a onClick="return mV(\'Isa\',13,2);">Isa 13:2</a> the King James Version); "a banner to them that fear thee" (<a onClick="return mV(\'Psa\',60,4);">Ps 60:4</a>); and<P>(2) in the plur., "In the name of our God we will set up our banner" (<a onClick="return mV(\'Psa\',20,5);">Ps 20:5</a>); "terrible as an army with banner" (<a onClick="return mV(\'Sgs\',6,4);">So 6:4</a>).<P>1. Military Ensigns among the Hebrews:<P>The Hebrews, it would seem, like the Assyrians, the Egyptians, and other ancient nations, had military ensigns. As bearing upon this question, a very significant passage is that found in <a onClick="return mV(\'Num\',2,2);">Nu 2:2</a>: "The children of Israel shall encamp every man by his own standard, with the ensigns of their fathers\' houses." "Standard-bearer" in <a onClick="return mV(\'Isa\',10,18);">Isa 10:18</a> the King James Version, "They shall be as when a standard-bearer fainteth," is not a case in point, but is to be rendered as in the Revised Version, margin, "as when a si ck man pineth away."<P>In this noted passage a distinction seems intentionally made (another view is held by some) between "the ensigns of their fathers\' houses" (literally, "signs"; compare <a onClick="return mV(\'Psa\',74,4);">Ps 74:4</a>, where the reference is thought by some today to be to the standards of Antiochus\' army), and "the standards" of the four great divisions of the Hebrew tribes in the wilderness (compare the "banner" of <a onClick="return mV(\'Sgs\',2,4);">So 2:4</a> and <a onClick="return mV(\'Sgs\',6,4,10);">So 6:4, 10</a>).<P>2. A Distinction with a Difference:<P>The relation of these to the "standard" of <a onClick="return mV(\'Num\',21,8);">Nu 21:8</a>f (Hebrew nec, the King James Version and the Revised Version (British and American) "standard") is by no means clear. The word nec, here translated "standard," seems to have meant at first a pole set up on an eminence as a signal for mustering troops (compare "mast" <a onClick="return mV(\'Isa\',30,17);">Isa 30:17</a> the English Revised Version, margin). But it occurs frequently in the prophets both in this literal and original sense, and in the figurative or derived sense of a rallying point for God\'s people (see <a onClick="return mV(\'Isa\',5,26);">Isa 5:26</a>; <a onClick="return mV(\'Isa\',11,10);">11:10</a>; <a onClick="return mV(\'Jer\',4,21);">Jer 4:21</a> and elsewhere). Here the rendering in English Versions of the Bible alternates between "ensign" and "banner" (see HDB, 1-vol, article "Banner").``47';
isbe[1145]='Bannus`ban\'-us (Bannous (1Esdras 9:34) = Bani or Binnui (<a onClick="return mV(\'Ezr\',10,29,30);">Ezr 10:29-30</a>)): The sons of Bannus put away their "strange wives."``1';
isbe[1146]='Banquet`ban\'-kwet.<P>1. The Ancient Hebrew Customs:<P>(1) "Banquet" and "banqueting" in the King James Version always include and stand for wine-drinking, not simply "feast" or "feasting" in our sense. Thus (<a onClick="return mV(\'Sgs\',2,4);">So 2:4</a>), "He brought me to the banqueting-house" is literally, "the house of wine," and <a onClick="return mV(\'Est\',7,2);">Es 7:2</a> has in the Hebrew "a banquet of wine." In the New Testament we see a reflection of the same fact in <a onClick="return mV(\'1Pe\',4,3);">1Pe 4:3</a> the King James Version, "We walked in...excess of wine, banquetings" (Greek "drinkings"; the Revised Version (British and American) "carousings"). Compare <a onClick="return mV(\'Amo\',6,7);">Amos 6:7</a> the King James Version, "The banquet of them that stretched themselves," where the reference seems to be to reclining at wine-drinkings.<P>See <a href="./study/isbe/search.html?string=MEALS">MEALS</a>.<P>The Hebrew of <a onClick="return mV(\'Job\',1,4);">Job 1:4</a>, "make a banquet," may refer to a social feast of a less objectionable sort (compare <a onClick="return mV(\'Job\',41,6);">Job 41:6</a> the King James Version), though the Hebrew for "to drink" yayin "wine," was used as synonymous with "banquet."<P>Music, dancing and merriment usually attended all such festivities. Certainly the ancient Hebrews, like other peoples of the ancient East, were very fond of social feasting, and in Christ\'s day had acquired, from contact with Greeks and Romans, luxurious and bibulous habits, that often carried them to excess in their social feasts.<P>2. In Christ\'s Teaching and Practice:<P>Among the Greeks the word for "feast" (doche) is from dechomai "to receive" (compare our English usage, "to receive" and "reception"). This word doche is used with poiein "to make," to signify "to make" or "give a feast." Compare <a onClick="return mV(\'Luk\',5,29);">Lu 5:29</a> where Levi "made a feast."<P>(1) In view of existing customs and abuses, Christ taught His followers when they gave a banquet to invite the poor, etc. (<a onClick="return mV(\'Luk\',14,13);">Lu 14:13</a>), rather than, as the fashion of the day called for, to bid the rich and influential. Much in the New Testament that has to do with banquets and banquetings will be obscure to us of the West if we do not keep in mind the many marked differences of custom between the East and the West.<P>(2) "Banquets" were usually given in the house of the host to specially invited guests (<a onClick="return mV(\'Luk\',14,15);">Lu 14:15</a>; <a onClick="return mV(\'Jhn\',2,2);">Joh 2:2</a>), but much more freedom was accorded to the uninvited than we of the West are accustomed to, as one finds to be true everywhere in the East today. The custom of reclining at meals (see <a href="./study/isbe/search.html?string=MEALS">MEALS</a>; <a href="./study/isbe/search.html?string=TRICLINIUM">TRICLINIUM</a>, etc.) was everywhere in vogue among the well-to-do in Christ\'s day, even in the case of the ordinary meals, the guest leaning upon the left arm and eating with the aid of the right (compare <a onClick="return mV(\'Mat\',26,20);">Mt 26:20</a> margin "reclining," and <a onClick="return mV(\'1Cr\',11,20);">1Co 11:20</a>, "the Lord\'s supper").<P>(3) "Banquets" were considered normal parts of weddings as they are now throughout the East. Jesus and His disciples were bidden to one at Cana in Galilee, and accepted the invitation (<a onClick="return mV(\'Jhn\',2,2);">Joh 2:2</a>ff), and wine-drinking was a part of the feast. The "banquet" Levi gave was in Christ\'s honor (<a onClick="return mV(\'Luk\',5,29);">Lu 5:29</a>). There were numbers present and marked gradations in the places at table (<a onClick="return mV(\'Mat\',23,6);">Mt 23:6</a>; <a onClick="return mV(\'Mar\',12,39);">Mr 12:39</a>; <a onClick="return mV(\'Luk\',14,7);">Lu 14:7</a>; <a onClick="return mV(\'Luk\',20,46);">20:46</a>). Guests were invited in advance, and then, as time-pieces were scarce, specially notified when the feast was ready, which helps to explain Christ\'s words (<a onClick="return mV(\'Mat\',22,4);">Mt 22:4</a>), "All things are ready: come to the marriage" (compare <a onClick="return mV(\'Luk\',14,17);">Lu 14:17</a>; <a onClick="return mV(\'Est\',5,8);">Es 5:8</a>; <a onClick="return mV(\'Est\',6,14);">6:14</a>).<P>(4) Matthew tells us (<a onClick="return mV(\'Mat\',23,6);">Mt 23:6</a>) that the Pharisees "love the chief place ("uppermost rooms" the King James Version) at feasts."<P>In <a onClick="return mV(\'Mat\',22,3,4);">Mt 22:3-4</a> "made a marriage feast," is rendered by some simply "a feast," because Greek gamos, "marriage," was used by Septuagint to translate the Hebrew for "feast" in <a onClick="return mV(\'Est\',1,5);">Es 1:5</a>. But, as this is the only known example of such a use compare gamos, it is better to take it here in the literal sense of "marriage feast," as would seem to be required by the words "for his son" (Messiah). The Greek is plural (gamous) to indicate the several parts or stages of the feast (Button, 23; compare English "nuptials").<P>wine was provided, superintend the drinking, etc. (compare <a onClick="return mV(\'Luk\',22,27);">Lu 22:27</a>).<P>3. A Distinction Giving Rise to a Question:<P>(1) In <a onClick="return mV(\'Mat\',22,4);">Mt 22:4</a>, "I have made ready my dinner," "dinner" in Greek is ariston (compare <a onClick="return mV(\'Luk\',11,38);">Lu 11:38</a>). "Supper" (Greek deipnon) is found in <a onClick="return mV(\'Mat\',23,6);">Mt 23:6</a> and often in the New Testament. Both words are found in <a onClick="return mV(\'Luk\',14,12);">Lu 14:12</a>. The question arises, What was the distinction? Thus much may be said in answer: The ariston (English Versions "dinner") was a meal usually taken about the middle of the forenoon, with variations of earlier or later; the deipnon (English Versions "supper"), the one taken at the close of the day, often after dark. In Ant, V, iv, 2 Josephus supposes Eglon\'s guards (<a onClick="return mV(\'Jdg\',3,24);">Jud 3:24</a>) were negligent about noon, "both because of the heat and because their attention was turned to dinner" (ariston). So the "dinner" (ariston) was sometimes as late as noon. Yet <a onClick="return mV(\'Jhn\',21,12,15);">Joh 21:12, 15</a> shows, on the other hand, that the ariston was on some occasions taken shortly after dawn.<P>(2) Another question raised is this, Were the ancient Jews accustomed to have two or three meals a day? Vambery, quoted by Morison, gives a saying of the Turks that is in point: "There are only two meals a day, the smaller at 10 or 11 o\'clock in the morning, the second and larger after sunset." There seems no evidence to sustain the view, maintained by Grimm and entertained by others, that the Jews of Christ\'s day were accustomed to take a separate and slight meal on rising, as the later Greeks and some of the later Romans did. There is certainly no clear evidence that the Jews of that day had more than two meals a day (see DB, article "Meals").<P>(3) The marriage feast of <a onClick="return mV(\'Mat\',22,3);">Mt 22:3</a>f was an ariston, somewhat like an English "wedding-breakfast"; but that in <a onClick="return mV(\'Luk\',14,16);">Lu 14:16</a>f was a deipnon, which was as usual delayed till after dark (<a onClick="return mV(\'Luk\',14,17);">Lu 14:17</a>). Perhaps the ariston in this case was preliminary, while the marriage with its accompanying deipnon was after dark; such things are not unheard of today (compare <a onClick="return mV(\'Mat\',26,20);">Mt 26:20</a> and <a onClick="return mV(\'1Cr\',11,20);">1Co 11:20</a>, "the Lord\'s deipnon").``47';
isbe[1147]='Banuas`ban\'-u-as (1Esdras 5:26): A misprint for <a href="./study/isbe/search.html?string=BANNAS">BANNAS</a> (Revised Version), which see.``1';
isbe[1148]='Baptism (Lutheran Doctrine)`<b>I. THE TERM</b><P class="in15">1. The Derivation<P class="in15">2. The Meaning<P class="in15">3. The Application<P class="in15">4. Equivalent Terms<P><b>II. THE ORDINANCE</b><P class="in15">1. The Teaching of Scripture<P class="in30">(1) An Authoritative Command<P class="in30">(2) A Clear Declaration of the Object in View<P class="in30">(3) A Definite Promise<P class="in30">(4) A Plain Indication of the Scope<P class="in30">(5) A Prescribed Formula for Administering the Ordinance<P class="in15">2. The Biblical History of the Ordinance<P class="in15">3. Types of Baptism<P><b>III. DIFFICULTIES</b><P class="in15">1. Are <a onClick="return mV(\'Mat\',28,\'18-20\');">Matthew 28:18-20</a> and <a onClick="return mV(\'Mar\',16,15,16);">Mark 16:15-16</a> Genuine?<P class="in15">2. Was the Trinitarian Formula Used in New Testament Times?<P class="in15">3. Was Christian Baptism Really a New Ordinance?<P class="in15">4. Should Infants Be Baptized?<P class="in15">5. Why Did Paul not Baptize?<P class="in15">6. What Is the Baptism for the Dead?<hr /><P>I. The Term.<P>1. The Derivation:<P>The word "baptism" is the Anglicized form of the Greek baptisma, or baptismos. These Greek words are verbal nouns derived from baptizo, which, again, is the intensive form of the verb bapto. "Baptismos denotes the action of baptizein (the baptizing), baptisma the result of the action (the baptism)" (Cremer). This distinction differs from, but is not necessarily contrary to, that of Plummer, who infers from <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a> and <a onClick="return mV(\'Hbr\',9,10);">Heb 9:10</a> that baptismos usually means lustrations or ceremonial washings, and from <a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>; <a onClick="return mV(\'Eph\',4,1);">Eph 4:1</a>; <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a> that baptisma denotes baptism proper (Hastings, Dictionary of the Bible (five volumes)).<P>2. The Meaning:<P>The Greek words from which our English "baptism" has been formed are used by Greek writers, in classical antiquity, in the Septuagint and in the New Testament, with a great latitude of meaning. It is not possible to exhaust their meaning by any single English term. The action which the Greek words express may be performed by plunging, drenching, staining, dipping, sprinkling. The nouns baptisma and baptismos do not occur in the Septuagint; the verb baptizo occurs only in four places, and in two of them in a figurative sense (<a onClick="return mV(\'2Ki\',5,14);">2Ki 5:14</a>; Judith 12:7; <a onClick="return mV(\'Isa\',21,4);">Isa 21:4</a>; Ecclesiasticus 31 (34):25). Wherever these words occur in the New Testament, the context or, in the case of quotations, a comparison with the Old Testament will in many instances suggest which of the various renderings noted above should be adopted (compare <a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>; <a onClick="return mV(\'Hbr\',9,10);">Heb 9:10</a> with <a onClick="return mV(\'Num\',19,18,19);">Nu 19:18-19</a>; <a onClick="return mV(\'Num\',8,7);">8:7</a>; <a onClick="return mV(\'Exd\',24,\'4-6\');">Ex 24:4-6</a>; <a onClick="return mV(\'Act\',2,16,17,41);">Ac 2:16-17, 41</a> with <a onClick="return mV(\'Joe\',2,28);">Joe 2:28</a>). But there are passages in which the particular form of the act of baptizing remains in doubt. "The assertion that the command to baptize is a command to immerse is utterly unauthorized" (Hodge).<P>3. The Application:<P>In the majority of Biblical instances the verbs and nouns denoting baptism are used in a lit sense, and signify the application of water to an object or a person for a certain purpose. The ceremonial washings of the Jews, the baptism of proselytes to the Jewish faith, common in the days of Christ, the baptism of John and of the disciples of Christ prior to the Day of Pentecost, and the Christian sacrament of baptism, are literal baptisms (baptismus fluminis, "baptism of the river," i.e. water). But Scripture speaks also of figurative baptisms, without water (<a onClick="return mV(\'Mat\',20,22);">Mt 20:22</a>; <a onClick="return mV(\'Mar\',10,38);">Mr 10:38</a>; <a onClick="return mV(\'Luk\',12,50);">Lu 12:50</a> = the sufferings which overwhelmed Christ and His followers, especially the martyrs—baptismus sanguinis, "baptism of blood"; <a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>; <a onClick="return mV(\'Mar\',1,8);">Mr 1:8</a>; <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>; <a onClick="return mV(\'Act\',1,5);">Ac 1:5</a>; <a onClick="return mV(\'Act\',11,16);">11:16</a> = the outpouring of the miraculous gifts of the Holy Ghost, which was a characteristic phenomenon of primitive Christianity—baptismus flaminis, "baptism of wind, breeze," i.e. "spirit"). Some even take <a onClick="return mV(\'Mat\',21,25);">Mt 21:25</a>; <a onClick="return mV(\'Mar\',11,30);">Mr 11:30</a>; <a onClick="return mV(\'Act\',18,25);">Ac 18:25</a>; <a onClick="return mV(\'1Cr\',10,2);">1Co 10:2</a> in a synecdochical sense, for doctrine of faith, baptism being a prominent feature of that doctrine (baptismus luminis, "baptism of light").<P>4. Equivalent Terms:<P>Scripture occasionally alludes to Christian baptism without employing the regular term. Thus in <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>, and <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a> we have the term loutron, "washing," instead lent terms of baptisma. From this term the Latin church derived its lavacrum (English "laver") as a designation of baptism. In <a onClick="return mV(\'Hbr\',10,22);">Heb 10:22</a> we have the verbs rhantizo and louo, "sprinkle" and "wash"; in <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a> the verb katharizo, "cleanse"; in <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a> the verb apolouo, "wash" are evidently synonyms of baptizo, and the act has been so denominated from its prime effect.<P>II. The Ordinance.<P>1. The Teaching of Scripture:<P>Christian baptism, as now practiced, is a sacred ordinance of evangelical grace, solemnly appointed by the risen Christ, prior to His entering into the state of glory by His ascension, and designed to be a means, until His second coming, for admitting men to discipleship with Him. <a onClick="return mV(\'Mat\',28,\'18-20\');">Mt 28:18-20</a> and its parallel <a onClick="return mV(\'Mar\',16,15,16);">Mr 16:15-16</a> are the principal texts of Scripture on which the church in all ages has based every essential point of her teaching regarding this ordinance. The host of other baptismal texts of Scripture expand and illustrate the contents of these two texts. We have in these texts:<P>(1) An Authoritative Command<P>An authoritative (<a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>) command, issued in plain terms: "Make disciples...baptizing." This command declares (a) speciem actus, i.e. it indicates with sufficient clearness, by the use of the term "baptize," the external element to be employed, namely, water, and the form of the action to be performed by means of water, namely, any dipping, or pouring, or sprinkling, since the word "baptize" signifies any of these modes. On the strength of this command Luther held: "Baptism is not simple water only, but it is the water comprehended in God\'s command"; and the Westminster Shorter Catechism (Ques. 94) calls baptism "a washing with water." Water is distinctly mentioned as the baptismal element in <a onClick="return mV(\'Act\',8,38);">Ac 8:38</a>; <a onClick="return mV(\'Act\',10,47);">10:47</a>; <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>; <a onClick="return mV(\'Hbr\',10,22);">Heb 10:22</a>. "There is no mention of any other element" (Plummer). The phraseology of <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>, "the washing of water with the word," shows that not the external element alone, nor the physical action of applying the water, constitutes baptism; but "the word" must be added to the element and the action, in order that there may be a baptism. (Detrahe verbum, et quid est aqua nisi aqua? Accedit verbum ad elementum, et fit sacramentum, "Remove the word and what is water but water? The word is added to the element and it becomes a sacrament" Augustine). "Without the Word of God the water is simple water, and no baptism" (Luther). The command prescribes (b) exercitium actus, i.e. it enjoins a continued exercise of this function of the messengers of Christ for all time.<P>(2) A Clear Declaration of the Object in View.<P>The participle "baptizing" qualifies the imperative "make disciples," and expresses that, what the imperative states as the end, is to be attained by what the participle names as a means to that end. The participle "baptizing," again, is qualified by "teaching" (<a onClick="return mV(\'Mat\',28,20);">Mt 28:20</a>). The second participle is not connected by "and" with the first, hence, is subordinate to the first (Meyer). Discipleship is to be obtained by baptizing-teaching. There is no rigid law regarding the order and sequence of these actions laid down in these words; they merely state that Christ desires His disciples to be both baptized and fully informed as to His teaching.<P>(3) A Definite Promise:<P>Salvation (<a onClick="return mV(\'Mar\',16,16);">Mr 16:16</a>), i.e. complete and final deliverance from all evil, the securing of "the end of faith" (<a onClick="return mV(\'1Pe\',1,9);">1Pe 1:9</a>). This is a comprehensive statement, as in <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>, of the blessing of baptism. Scripture also states, in detail, particular baptismal blessings:<P>(a) Regeneration, <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>; <a onClick="return mV(\'Jhn\',3,3,5);">Joh 3:3, 5</a>. Despite Calvin and others, the overwhelming consensus of interpreters still agrees with the ancient church and with Luther in explaining both these texts of baptism.<P>(b) Remission of sins, or justification (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Act\',22,16);">22:16</a>; <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a>; <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>; <a onClick="return mV(\'Hbr\',10,22);">Heb 10:22</a>). This blessing, no doubt, is also intended in <a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>, where eperotema has been rendered "answer" by the King James Version while the Revised Version (British and American) renders "interrogation." The word denotes a legal claim, which a person has a right to set up (See Cremer under the word and <a onClick="return mV(\'Rom\',8,1);">Ro 8:1</a>).<P>(c) The establishment of a spiritual union with Christ, and a new relationship with God (<a onClick="return mV(\'Gal\',3,26,27);">Ga 3:26-27</a>; <a onClick="return mV(\'Rom\',6,3,4);">Ro 6:3-4</a>; <a onClick="return mV(\'Col\',2,12);">Col 2:12</a>). In this connection the prepositions with which baptizein in the New Testament connects may be noted. Baptizein eis, "to baptize into," always denotes the relation into which the party baptized is placed. The only exception is <a onClick="return mV(\'Mar\',1,9);">Mr 1:9</a>. Baptizein en, or baptizein epi, "to baptize in" (<a onClick="return mV(\'Act\',10,48);">Ac 10:48</a>; <a onClick="return mV(\'Act\',2,38);">2:38</a>), denotes the basis on which the new relation into which the baptized enters, is made to rest (Cremer).<P>(d) The sanctifying gifts of the Holy Spirit (<a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a>; <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>). All these blessings Scripture declares to be effects of baptism (Wirkung der Taufe, Riehm, Handworterb.). "Baptism is called \'washing of regeneration,\' not merely because it symbolizes it, or pledges a man to it, but also, and chiefly, because it effects it" (Holtzmann, Huther, Pfleiderer, Weiss). "Regeneration, or being begotten of God, does not mean merely a new capacity for change in the direction of goodness, but an actual change. The legal washings were actual external purifications. Baptism is actual internal purification" (Plummer). To these modern authorities Luther can be added. He says: "Baptism worketh forgiveness of sin, delivers from death and the devil, and gives eternal salvation to all who believe, as the words and promises of God declare" (Smaller Catech.). In <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a> the King James Version the force of the preposition dia, "by," deserves to be noted: it declares baptism to be the regenerating, renewing, justifying, glorying medium to the heirs of eternal life. The baptismal promise is supported, not only in a general way, by the veracity and sincerity of the Speaker, who is the Divine Truth incarnate, but also in a special way, by the Author\'s appeal to His sovereign majesty (<a onClick="return mV(\'Mat\',28,18);">Mt 28:18</a>), and by the significant assurance of His personal ("I" = ego, is emphatic: Meyer) presence with the disciples in their afore-mentioned activity (<a onClick="return mV(\'Mat\',28,20);">Mt 28:20</a>; compare <a onClick="return mV(\'Mar\',16,20);">Mr 16:20</a>).<P>(4) A Plain Indication of the Scope:<P>"All nations," "the whole creation" (pase te ktisei to be understood as in <a onClick="return mV(\'Col\',1,23);">Col 1:23</a> = "all men"). Baptism is of universal application; it is a cosmopolitan ordinance before which differences such as of nationality, race, age, sex, social or civil status, are leveled (compare <a onClick="return mV(\'Col\',3,11);">Col 3:11</a> with <a onClick="return mV(\'1Cr\',12,13);">1Co 12:13</a>). Accordingly, Christ orders baptism to be practiced "alway" (literally, "all days"), "even unto the end of the world," i.e. unto the consummation of the present age, until the Second Advent of the Lord. For, throughout this period Christ promises His cooperative presence with the efforts of His disciples to make disciples.<P>(5) A Prescribed Formula for Administering the Ordinance:<P>"Into the name of the Father and of the Son and of
