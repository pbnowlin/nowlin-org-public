rsorily Apostles speak of Scripture by that pregnant name and adduce it with the simple "It is written," with the implication that whatever stands written in it is Divinely authoritative. As Jesus\' official life begins with this "It is written" (<a onClick="return mV(\'Mat\',4,4);">Mt 4:4</a>), so the evangelical proclamation begins with an "Even as it is written" (<a onClick="return mV(\'Mar\',1,2);">Mr 1:2</a>); and as Jesus sought the justification of His work in a solemn "Thus it is written, that the Christ should suffer, and rise again from the dead the third day" (<a onClick="return mV(\'Luk\',24,46);">Lu 24:46</a>), so the apostles solemnly justified the Gospel which they preached, detail after detail, by appeal to the Scriptures, "That Christ died for our sins according to the scriptures" and "That he hath been raised on the third day according to the scriptures" (<a onClick="return mV(\'1Cr\',15,3,4);">1Co 15:3-4</a>; compare <a onClick="return mV(\'Act\',8,35);">Ac 8:35</a>; <a onClick="return mV(\'Act\',17,3);">17:3</a>; <a onClick="return mV(\'Act\',26,22);">26:22</a>, and also <a onClick="return mV(\'Rom\',1,17);">Ro 1:17</a>; <a onClick="return mV(\'Rom\',3,4,10);">3:4, 10</a>; <a onClick="return mV(\'Rom\',4,17);">4:17</a>; <a onClick="return mV(\'Rom\',11,26);">11:26</a>; <a onClick="return mV(\'Rom\',14,11);">14:11</a>; <a onClick="return mV(\'1Cr\',1,19);">1Co 1:19</a>; <a onClick="return mV(\'1Cr\',2,9);">2:9</a>; <a onClick="return mV(\'1Cr\',3,19);">3:19</a>; <a onClick="return mV(\'1Cr\',15,45);">15:45</a>; <a onClick="return mV(\'Gal\',3,10,13);">Ga 3:10, 13</a>; <a onClick="return mV(\'Gal\',4,22,27);">4:22, 27</a>). Wherever they carried the gospel it was as a gospel resting on Scripture that they proclaimed it (<a onClick="return mV(\'Act\',17,2);">Ac 17:2</a>; <a onClick="return mV(\'Act\',18,24,28);">18:24, 28</a>); and they encouraged themselves to test its truth by the Scriptures (<a onClick="return mV(\'Act\',17,11);">Ac 17:11</a>). The holiness of life they inculcated, they based on Scriptural requirement (<a onClick="return mV(\'1Pe\',1,16);">1Pe 1:16</a>), and they commended the royal law of love which they taught by Scriptural sanction (<a onClick="return mV(\'Jam\',2,8);">Jas 2:8</a>). Every detail of duty was supported by them by an appeal to Scripture (<a onClick="return mV(\'Act\',23,5);">Ac 23:5</a>; <a onClick="return mV(\'Rom\',12,19);">Ro 12:19</a>). The circumstances of their lives and the events occasionally occurring about them are referred to Scripture for their significance (<a onClick="return mV(\'Rom\',2,26);">Ro 2:26</a>; <a onClick="return mV(\'Rom\',8,36);">8:36</a>; <a onClick="return mV(\'Rom\',9,33);">9:33</a>; <a onClick="return mV(\'Rom\',11,8);">11:8</a>; <a onClick="return mV(\'Rom\',15,9,21);">15:9, 21</a>; <a onClick="return mV(\'2Cr\',4,13);">2Co 4:13</a>). As our Lord declared that whatever was written in Scripture must needs be fulfilled (<a onClick="return mV(\'Mat\',26,54);">Mt 26:54</a>; <a onClick="return mV(\'Luk\',22,37);">Lu 22:37</a>; <a onClick="return mV(\'Luk\',24,44);">24:44</a>), so His followers explained one of the most startling facts which had occurred in their experience by pointing out that "it was needful that the scripture should be fulfilled, which the Holy Spirit spake before by the mouth of David" (<a onClick="return mV(\'Act\',1,16);">Ac 1:16</a>). Here the ground of this constant appeal to Scripture, so that it is enough that a thing "is contained in scripture" (<a onClick="return mV(\'1Pe\',2,6);">1Pe 2:6</a>) for it to be of indefectible authority, is plainly enough declared: Scripture must needs be fulfilled, for what is contained in it is the declaration of the Holy Ghost through the human author. What Scripture says, God says; and accordingly we read such remarkable declarations as these: "For the scripture saith unto Pharaoh, For this very purpose did I raise thee up" (<a onClick="return mV(\'Rom\',9,17);">Ro 9:17</a>); "And the scripture, foreseeing that God would justify the Gentiles by faith, preached the gospel beforehand unto Abraham, ...In thee shall all the nations be blessed" (<a onClick="return mV(\'Gal\',3,8);">Ga 3:8</a>). These are not instances of simple personification of Scripture, which is itself a sufficiently remarkable usage (<a onClick="return mV(\'Mar\',15,28);">Mr 15:28</a>; <a onClick="return mV(\'Jhn\',7,38,42);">Joh 7:38, 42</a>; <a onClick="return mV(\'Jhn\',19,37);">19:37</a>; <a onClick="return mV(\'Rom\',4,3);">Ro 4:3</a>; <a onClick="return mV(\'Rom\',10,11);">10:11</a>; <a onClick="return mV(\'Rom\',11,2);">11:2</a>; <a onClick="return mV(\'Gal\',4,30);">Ga 4:30</a>; <a onClick="return mV(\'1Ti\',5,18);">1Ti 5:18</a>; <a onClick="return mV(\'Jam\',2,23);">Jas 2:23</a>; <a onClick="return mV(\'Jam\',4,5);">4:5</a>f), vocal with the conviction expressed by James (<a onClick="return mV(\'Jam\',4,5);">4:5</A>) that Scripture cannot speak in vain. They indicate a certain confusion in current speech between "Scripture" and "God," the outgrowth of a deep-seated conviction that the word of Scripture is the word of God. It was not "Scripture" that spoke to Pharaoh, or gave his great promise to Abraham, but God. But "Scripture" and "God" lay so close together in the minds of the writers of the New Testament that they could naturally speak of "Scripture" doing what Scripture records God as doing. It was, however, even more natural to them to speak casually of God saying what the Scriptures say; and accordingly we meet with forms of speech such as these: "Wherefore, even as the Holy Spirit saith, Today if ye shall hear His voice," etc. (<a onClick="return mV(\'Hbr\',3,7);">Heb 3:7</a>, quoting <a onClick="return mV(\'Psa\',95,7);">Ps 95:7</a>); "Thou art God ...who by the mouth of thy servant David hast said, Why did the heathen rage," etc. (<a onClick="return mV(\'Act\',4,25);">Ac 4:25</a> the King James Version, quoting <a onClick="return mV(\'Psa\',2,1);">Ps 2:1</a>); "He that raised him from the dead ...hath spoken on this wise, I will give you ...because he saith also in another (place) ...."(<a onClick="return mV(\'Act\',13,34);">Ac 13:34</a>, quoting <a onClick="return mV(\'Isa\',55,3);">Isa 55:3</a> and <a onClick="return mV(\'Psa\',16,10);">Ps 16:10</a>), and the like. The words put into God\'s mouth in each case are not words of God recorded in the Scriptures, but just Scripture words in themselves. When we take the two classes of passages together, in the one of which the Scriptures are spoken of as God, while in the other God is spoken of as if He were the Scriptures, we may perceive how close the identification of the two was in the minds of the writers of the New Testament.<P>7. Their Identification of God and Scripture:<P>This identification is strikingly observable in certain catenae of quotations, in which there are brought together a number of passages of Scripture closely connected with one another. The first chapter of the Epistle to the Hebrews supplies an example. We may begin with <a onClick="return mV(\'Hbr\',1,5);">Heb 1:5</a>:"for unto which of the angels said he"—the subject being necessarily "God"—"at any time, Thou art my Son, this day have I begotten thee?"—the citation being from <a onClick="return mV(\'Psa\',2,7);">Ps 2:7</a> and very appropriate in the mouth of God—"and again, I will be to him a Father, and he shall be to me a Son?"—from <a onClick="return mV(\'2Sa\',7,14);">2Sa 7:14</a>, again a declaration of God\'s own—"And when he again bringeth in the firstborn into the world he saith, And let all the angels of God worship him"—from <a onClick="return mV(\'Deu\',32,43);">De 32:43</a>, Septuagint, or <a onClick="return mV(\'Psa\',97,7);">Ps 97:7</a>, in neither of which is God the speaker—"And of the angels he saith, Who maketh his angels winds, and his ministers a flame of fire"—from <a onClick="return mV(\'Psa\',104,4);">Ps 104:4</a>, where again God is not the speaker but is spoken of in the third person—"but of the Son he saith, Thy throne, O God, etc."—from <a onClick="return mV(\'Psa\',45,6,7);">Ps 45:6-7</a> where again God is not the speaker, but is addressed—"And, Thou, Lord, in the beginning," etc.—from <a onClick="return mV(\'Psa\',102,\'25-27\');">Ps 102:25-27</a>, where again God is not the speaker but is addressed—"But of which of the angels hath he said at any time, Sit thou on my right hand?" etc.—from <a onClick="return mV(\'Psa\',110,1);">Ps 110:1</a>, in which God is the speaker. Here we have passages in which God is the speaker and passages in which God is not the speaker, but is addressed or spoken of, indiscriminately assigned to God, because they all have it in common that they are words of Scripture, and as words of Scripture are words of God. Similarly in <a onClick="return mV(\'Rom\',15,9);">Ro 15:9</a>ff we have a series of citations the first of which is introduced by "as it is written," and the next two by "again he saith," and "again," and the last by "and again, Isaiah saith," the first being from <a onClick="return mV(\'Psa\',18,49);">Ps 18:49</a>; the second from <a onClick="return mV(\'Deu\',32,43);">De 32:43</a>; the third from <a onClick="return mV(\'Psa\',117,1);">Ps 117:1</a>; and the last from <a onClick="return mV(\'Isa\',11,10);">Isa 11:10</a>. Only the last (the only one here assigned to the human author) is a word of God in the text of the Old Testament.``187';
isbe[4621]='Inspiration, 8-18`8. The "Oracles of God":<P>This view of the Scriptures as a compact mass of words of God occasioned the formation of a designation for them by which this their character was explicitly expressed. This designation is "the sacred oracles," "the oracles of God." It occurs with extraordinary frequency in Philo, who very commonly refers to Scripture as "the sacred oracles" and cites its several passages as each an "oracle." Sharing, as they do, Philo\'s conception of the Scriptures as, in all their parts, a word of God, the New Testament writers naturally also speak of them under this designation. The classical passage is <a onClick="return mV(\'Rom\',3,2);">Ro 3:2</a> (compare <a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>; <a onClick="return mV(\'Act\',7,38);">Ac 7:38</a>). Here Paul begins an enumeration of the advantages which belonged to the chosen people above other nations; and, after declaring these advantages to have been great and numerous, he places first among them all their possession of the Scriptures: "What advantage then hath the Jew? or what is the profit of circumcision? Much every way: first of all, that they were entrusted with the oracles of God." That by "the oracles of God" here are meant just the Holy Scriptures in their entirety, conceived as a direct Divine revelation, and not any portions of them, or elements in them more especially thought of as revelatory, is perfectly clear from the wide contemporary use of this designation in this sense by Philo, and is put beyond question by the presence in the New Testament of habitudes of speech which rest on and grow out of the conception of Scripture embodied in this term. From the point of view of this designation, Scripture is thought of as the living voice of God speaking in all its parts directly to the reader; and, accordingly, it is cited by some such formula as "it is said," and this mode of citing Scripture duly occurs as an alternative to "it is written" (<a onClick="return mV(\'Luk\',4,12);">Lu 4:12</a> replacing "it is written" in Matthew; <a onClick="return mV(\'Hbr\',3,15);">Heb 3:15</a>; compare <a onClick="return mV(\'Rom\',4,18);">Ro 4:18</a>). It is due also to this point of view that Scripture is cited, not as what God or the Holy Spirit "said," but what He "says," the present tense emphasizing the living voice of God speaking in Scriptures to the individual soul (<a onClick="return mV(\'Hbr\',3,7);">Heb 3:7</a>; <a onClick="return mV(\'Act\',13,35);">Ac 13:35</a>; <a onClick="return mV(\'Hbr\',1,7,8,10);">Heb 1:7-8, 10</a>; <a onClick="return mV(\'Rom\',15,10);">Ro 15:10</a>). And especially there is due to it the peculiar usage by which Scripture is cited by the simple "saith, without expressed subject, the subject being too well understood, when Scripture is adduced, to require stating; for who could be the speaker of the words of Scripture but God only (<a onClick="return mV(\'Rom\',15,10);">Ro 15:10</a>; <a onClick="return mV(\'1Cr\',6,16);">1Co 6:16</a>; <a onClick="return mV(\'2Cr\',6,2);">2Co 6:2</a>; <a onClick="return mV(\'Gal\',3,16);">Ga 3:16</a>; <a onClick="return mV(\'Eph\',4,8);">Eph 4:8</a>; <a onClick="return mV(\'Eph\',5,14);">5:14</a>)? The analogies of this pregnant subjectless "saith" are very widespread. It was with it that the ancient Pythagoreans and Platonists and the medieval Aristotelians adduced each their master\'s teaching; it was with it that, in certain circles, the judgments of Hadrian\'s great jurist Salvius Julianus were cited; African stylists were even accustomed to refer by it to Sallust, their great model. There is a tendency, cropping out occasionally, in the Old Testament, to omit the name of God as superfluous, when He, as the great logical subject always in mind, would be easily understood (compare <a onClick="return mV(\'Job\',20,23);">Job 20:23</a>; <a onClick="return mV(\'Job\',21,17);">21:17</a>; <a onClick="return mV(\'Psa\',114,2);">Ps 114:2</a>; <a onClick="return mV(\'Lam\',4,22);">La 4:22</a>). So, too, when the New Testament writers quoted Scripture there was no need to say whose word it was: that lay beyond question in every mind. This usage, accordingly, is a specially striking intimation of the vivid sense which the New Testament writers had of the Divine origin of the Scriptures, and means that in citing them they were acutely conscious that they were citing immediate words of God. How completely the Scriptures were to them just the word of God may be illustrated by a passage like <a onClick="return mV(\'Gal\',3,16);">Ga 3:16</a>: "He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ." We have seen our Lord hanging an argument on the very words of Scripture (<a onClick="return mV(\'Jhn\',10,34);">Joh 10:34</a>); elsewhere His reasoning depends on the particular tense (<a onClick="return mV(\'Mat\',22,32);">Mt 22:32</a>) or word (<a onClick="return mV(\'Mat\',22,43);">Mt 22:43</a>) used in Scripture. Here Paul\'s argument rests similarly on a grammatical form. No doubt. it is the grammatical form of the word which God is recorded as having spoken to Abraham that is in question. But Paul knows what grammatical form God employed in speaking to Abraham only as the Scriptures have transmitted it to him; and, as we have seen, in citing the words of God and the words of Scripture he was not accustomed to make any distinction between them. It is probably the Scriptural word as a Scriptural word, therefore, which he has here in mind: though, of course, it is possible that what he here witnesses to is rather the detailed trustworthiness of the Scriptural record than its direct divinity—if we can separate two things which apparently were not separated in Paul\'s mind. This much we can at least say without straining, that the designation of Scripture as "scripture" and its citation by the formula, "It is written," attest primarily its indefectible authority; the designation of it as "oracles" and the adduction of it by the formula, "It says," attest primarily its immediate divinity. Its authority rests on its divinity and its divinity expresses itself in its trustworthiness; and the New Testament writers in all their use of it treat it as what they declare it to be—a God-breathed document, which, because God-breathed, is through and through trustworthy in all its assertions, authoritative in all its declarations, and down to its last particular, the very word of God, His "oracles."<P>9. The Human Element in Scripture:<P>That the Scriptures are throughout a Divine book, created by the Divine energy and speaking in their every part with Divine authority directly to the heart of the readers, is the fundamental fact concerning Scripture them which is witnessed by Christ and the sacred writers to whom we owe the New Testament. But the strength and constancy with which they bear witness to this primary fact do not prevent their recognizing by the side of it that the Scriptures have come into being by the agency of men. It would be inexact to say that they recognize a human element in Scripture: they do not parcel Scripture out, assigning portions of it, or elements in it, respectively to God and man. In their view the whole of Scripture in all its parts and in all its elements, down to the least minutiae, in form of expression as well as in substance of teaching, is from God; but the whole of it has been given by God through the instrumentality of men. There is, therefore, in their view, not, indeed, a human element or ingredient in Scripture, and much less human divisions or sections of Scripture, but a human side or aspect to Scripture; and they do not fail to give full recognition to this human side or aspect. In one of the primary passages which has already been before us, their conception is given, if somewhat broad and very succinct, yet clear expression. No \'prophecy,\' Peter tells us (<a onClick="return mV(\'2Pe\',1,21);">2Pe 1:21</a>), \'ever came by the will of man; but as borne by the Holy Ghost, men spake from God.\' Here the whole initiative is assigned to God, and such complete control of the human agents that the product is truly God\'s work. The men who speak in this "prophecy of scripture" speak not of themselves or out of themselves, but from "God": they speak only as they are "borne by the Holy Ghost." But it is they, after all, who speak. Scripture is the product of man, but only of man speaking from God and under such a control of the Holy Spirit as that in their speaking they are "borne" by Him. The conception obviously is that the Scriptures have been given by the instrumentality of men; and this conception finds repeated incidental expression throughout the New Testament.<P>It is this conception, for example, which is expressed when our Lord, quoting <a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a>, declares of its words that "David himself said in the Holy Spirit" (<a onClick="return mV(\'Mar\',12,36);">Mr 12:36</a>). There is a certain emphasis here on the words being David\'s own words, which is due to the requirements of the argument our Lord was conducting, but which none the less sincerely represents our Lord\'s conception of their origin. They are David\'s own words which we find in <a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a>, therefore; but they are David\'s own words, spoken not of his own motion merely, but "in the Holy Spirit," that is to say—we could not better paraphrase it—"as borne by the Holy Spirit." In other words, they are "God-breathed" words and therefore authoritative in a sense above what any words of David, not spoken in the Holy Spirit, could possibly be. Generalizing the matter, we may say that the words of Scripture are conceived by our Lord and the New Testament writers as the words of their human authors when speaking "in the Holy Spirit," that is to say, by His initiative and under His controlling direction. The conception finds even more precise expression, perhaps, in such a statement as we find—it is Peter who is speaking and it is again a psalm which is cited—in <a onClick="return mV(\'Act\',1,16);">Ac 1:16</a>, "The Holy Spirit spake by the mouth of David." Here the Holy Spirit is adduced, of course, as the real author of what is said (and hence, Peter\'s certainty that what is said will be fulfilled); but David\'s mouth is expressly designated as the instrument (it is the instrumental preposition that is used) by means of which the Holy Spirit speaks the Scripture in question. He does not speak save through David\'s mouth. Accordingly, in <a onClick="return mV(\'Act\',4,25);">Ac 4:25</a>, \'the Lord that made the heaven and earth,\' acting by His Holy Spirit, is declared to have spoken another psalm \'through the mouth of ...David,\' His "servant"; and in <a onClick="return mV(\'Mat\',13,35);">Mt 13:35</a> still another psalm is adduced as "spoken through the prophet" (compare <a onClick="return mV(\'Mat\',2,5);">Mt 2:5</a>). In the very act of energetically asserting the Divine origin of Scripture the human instrumentality through which it is given is constantly recognized. The New Testament writers have, therefore, no difficulty in assigning Scripture to its human authors, or in discovering in Scripture traits due to its human authorship. They freely quote it by such simple formulas as these: "Moses saith" (<a onClick="return mV(\'Rom\',10,19);">Ro 10:19</a>); "Moses said" (<a onClick="return mV(\'Mat\',22,24);">Mt 22:24</a>; <a onClick="return mV(\'Mar\',10,\'1-\');">Mr 10</a>; <a onClick="return mV(\'Act\',3,22);">Ac 3:22</a>); "Moses writeth" (<a onClick="return mV(\'Rom\',10,5);">Ro 10:5</a>); "Moses wrote" (<a onClick="return mV(\'Mar\',12,19);">Mr 12:19</a>; <a onClick="return mV(\'Luk\',20,28);">Lu 20:28</a>); "Isaiah ...saith" (<a onClick="return mV(\'Rom\',10,20);">Ro 10:20</a>); "Isaiah said" (<a onClick="return mV(\'Jhn\',12,39);">Joh 12:39</a>); "Isaiah crieth" (<a onClick="return mV(\'Rom\',9,27);">Ro 9:27</a>); "Isaiah hath said before" (<a onClick="return mV(\'Rom\',9,29);">Ro 9:29</a>); "said Isaiah the prophet" (<a onClick="return mV(\'Jhn\',1,23);">Joh 1:23</a>); "did Isaiah prophesy" (<a onClick="return mV(\'Mar\',7,6);">Mr 7:6</a>; <a onClick="return mV(\'Mat\',15,7);">Mt 15:7</a>); "David saith" (<a onClick="return mV(\'Luk\',20,42);">Lu 20:42</a>; <a onClick="return mV(\'Act\',2,25);">Ac 2:25</a>; <a onClick="return mV(\'Rom\',11,9);">Ro 11:9</a>); "David said" (<a onClick="return mV(\'Mar\',12,36);">Mr 12:36</a>). It is to be noted that when thus Scripture is adduced by the names of its human authors, it is a matter of complete indifference whether the words adduced are comments of these authors or direct words of God recorded by them. As the plainest words of the human authors are assigned to God as their real author, so the most express words of God, repeated by the Scriptural writers, are cited by the names of these human writers (<a onClick="return mV(\'Mat\',15,7);">Mt 15:7</a>; <a onClick="return mV(\'Mar\',7,6);">Mr 7:6</a>; <a onClick="return mV(\'Rom\',10,5,8,20);">Ro 10:5,19,20</a>; compare <a onClick="return mV(\'Mar\',7,10);">Mr 7:10</a> from the Decalogue). To say that "Moses" or "David says," is evidently thus only a way of saying that "Scripture says," which is the same as to say that "God says." Such modes of citing Scripture, accordingly, carry us little beyond merely connecting the name, or perhaps we may say the individuality, of the several writers with the portions of Scripture given through each. How it was given through them is left meanwhile, if not without suggestion, yet without specific explanation. We seem safe only in inferring this much: that the gift of Scripture through its human authors took place by a process much more intimate than can be expressed by the term "dictation," and that it took place in a process in which the control of the Holy Spirit was too complete and pervasive to permit the human qualities of the secondary authors in any way to condition the purity of the product as the word of God. The Scriptures, in other words, are conceived by the writers of the New Testament as through and through God\'s book, in every part expressive of His mind, given through men after a fashion which does no violence to their nature as men, and constitutes the book also men\'s book as well as God\'s, in every part expressive of the mind of its human authors.<P>10. Activities of God in Giving Scripture:<P>If we attempt to get behind this broad statement and to obtain a more detailed conception of the activities by which God has given the Scriptures, we are thrown back upon somewhat general representations, supported by the analogy of the modes Scripture of God\'s working in other spheres of His operation. It is very desirable that we should free ourselves at the outset from influences arising from the current employment of the term "inspiration" to designate this process. This term is not a Biblical term and its etymological implications are not perfectly accordant with the Biblical conception of the modes of the Divine operation in giving the Scriptures. The Biblical writers do not conceive of the Scriptures as a human product breathed into by the Divine Spirit, and thus heightened in its qualities or endowed with new qualities; but as a Divine product produced through the instrumentality of men. They do not conceive of these men, by whose instrumentality Scripture is produced, as working upon their own initiative, though energized by God to greater effort and higher achievement, but as moved by the Divine initiative and borne by the irresistible power of the Spirit of God along ways of His choosing to ends of His appointment. The difference between the two conceptions may not appear great when the mind is fixed exclusively upon the nature of the resulting product. But they are differing conceptions, and look at the production of Scripture from distinct points of view—the human and the Divine; and the involved mental attitudes toward the origin of Scripture are very diverse. The term "inspiration" is too firmly fixed, in both theological and popular usage, as the technical designation of the action of God in giving the Scriptures, to be replaced; and we may be thankful that its native implications lie as close as they do to the Biblical conceptions. Meanwhile, however, it may be justly insisted that it shall receive its definition from the representations of Scripture, and not be permitted to impose upon our thought ideas of the origin of Scripture derived from an analysis of its own implications, etymological or historical. The Scriptural conception of the relation of the Divine Spirit to the human authors in the production of Scripture is better expressed by the figure of "bearing" than by the figure of "inbreathing"; and when our Biblical writers speak of the action of the Spirit of God in this relation as a breathing, they represent it as a "breathing out" of the Scriptures by the Spirit, and not a "breathing into" the Scriptures by Him.<P>11. General Problem of Origin: God\'s Part:<P>So soon, however, as we seriously endeavor to form for ourselves a clear conception of the precise nature of the Divine action in this "breathing out" of the Scriptures—this "bearing" of the writers of the Scriptures to their appointed goal of the production of a book of Divine trustworthiness and indefectible authority—we become acutely aware of a more deeply lying and much wider problem, apart from which this one of inspiration, technically so called, cannot be profitably considered. This is the general problem of the origin of the Scriptures and the part of God in all that complex of processes by the interaction of which these books, which we call the sacred Scriptures, with all their peculiarities, and all their qualities of whatever sort, have been brought into being. For, of course, these books were not produced suddenly, by some miraculous act—handed down complete out of heaven, as the phrase goes; but, like all other products of time, are the ultimate effect of many processes cooperating through long periods. There is to be considered, for instance, the preparation of the material which forms the subject-matter of these books: in a sacred history, say, for example, to be narrated; or in a religious experience which may serve as a norm for record; or in a logical elaboration of the contents of revelation which may be placed at the service of God\'s people; or in the progressive revelation of Divine truth itself, supplying their culminating contents. And there is the preparation of the men to write these books to be considered, a preparation physical, intellectual, spiritual, which must have attended them throughout their whole lives, and, indeed, must have had its beginning in their remote ancestors, and the effect of which was to bring the right men to the right places at the right times, with the right endowments, impulses, acquirements, to write just the books which were designed for them. When "inspiration," technically so called, is superinduced on lines of preparation like these, it takes on quite a different aspect from that which it bears when it is thought of as an isolated action of the Divine Spirit operating out of all relation to historical processes. Representations are sometimes made as if, when God wished to produce sacred books which would incorporate His will—a series of letters like those of Paul, for example—He was reduced to the necessity of going down to earth and painfully scrutinizing the men He found there, seeking anxiously for the one who, on the whole, promised best for His purpose; and then violently forcing the material He wished expressed through him, against his natural bent, and with as little loss from his recalcitrant characteristics as possible. Of course, nothing of the sort took place. If God wished to give His people a series of letters like Paul\'s, He prepared a Paul to write them, and the Paul He brought to the task was a Paul who spontaneously would write just such letters.<P>12. How Human Qualities Affected Scripture. Providential Preparation:<P>If we bear this in mind, we shall know what estimate to place upon the common representation to the effect that the human characteristics of the writers must, and in point of fact do, condition and qualify the writings produced by them, the implication being that, therefore, we cannot get from mark a pure word of God. As light that passes through the colored glass of a cathedral window, we are told, is light from heaven, but is stained by the tints of the glass through which it passes; so any word of God which is passed through the mind and soul of a man must come out discolored by the personality through which it is given, and just to that degree ceases to be the pure word of God. But what if this personality has itself been formed by God into precisely the personality it is, for the express purpose of communicating to the word given through it just the coloring which it gives it? What if the colors of the stained-glass window have been designed by the architect for the express purpose of giving to the light that floods the cathedral precisely the tone and quality it receives from them? What if the word of God that comes to His people is framed by God into the word of God it is, precisely by means of the qualities of the men formed by Him for the purpose, through which it is given? When we think of God the Lord giving by His Spirit a body of authoritative Scriptures to His people, we must remember that He is the God of providence and of grace as well as of revelation and inspiration, and that He holds all the lines of preparation as fully under His direction as He does the specific operation which we call technically, in the narrow sense, by the name of "inspiration." The production of the Scriptures is, in point of fact, a long process, in the course of which numerous and very varied Divine activities are involved, providential, gracious, miraculous, all of which must be taken into account in any attempt to explain the relation of God to the production of Scripture. When they are all taken into account we can no longer wonder that the resultant Scriptures are constantly spoken of as the pure word of God. We wonder, rather, that an additional operation of God—what we call specifically "inspiration," in its technical sense—was thought necessary. Consider, for example, how a piece of sacred history—say the Book of Chronicles, or the great historical work, Gospel and Acts, of Luke—is brought to the writing. There is first of all the preparation of the history to be written: God the Lord leads the sequence of occurrences through the development He has designed for them that they may convey their lessons to His people: a "teleological" or "etiological" character is inherent in the very course of events. Then He prepares a man, by birth, training, experience, gifts of grace, and, if need be, of revelation, capable of appreciating this historical development and eager to search it out, thrilling in all his being with its lessons and bent upon making them clear and effective to others. When, then, by His providence, God sets this man to work on the writing of this history, will there not be spontaneously written by him the history which it was Divinely intended should be written? Or consider how a psalmist would be prepared to put into moving verse a piece of normative religious experience: how he would be born with just the right quality of religious sensibility, of parents through whom he should receive just the right hereditary bent, and from whom he should get precisely the right religious example and training, in circumstances of life in which his religious tendencies should be developed precisely on right lines; how he would be brought through just the right experiences to quicken in him the precise emotions he would be called upon to express, and finally would be placed in precisely the exigencies which would call out their expression. Or consider the providential preparation of a writer of a didactic epistle—by means of which he should be given the intellectual breadth and acuteness, and be trained in habitudes of reasoning, and placed in the situations which would call out precisely the argumentative presentation of Christian truth which was required of him. When we give due place in our thoughts to the universality of the providential government of God, to the minuteness and completeness of its sway, and to its invariable efficacy, we may be inclined to ask what is needed beyond this mere providential government to secure the production of sacred books which should be in every detail absolutely accordant with the Divine will.<P>13. "Inspiration" More than Mere "Providence":<P>The answer is, Nothing is needed beyond mere providence to secure such books—provided only that it does not lie in the Divine purpose that these books should possess qualities which rise above the powers of men to produce, even under the most complete Divine guidance. For providence is guidance; and guidance can bring one only so far as his own power can carry him. If heights are to be scaled above man\'s native power to achieve, then something more than guidance, however effective, is necessary. This is the reason for the superinduction, at the end of the long process of the production of Scripture, of the additional Divine operation which we call technically "inspiration." By it, the Spirit of God, flowing confluently in with the providentially and graciously determined work of men, spontaneously producing under the Divine directions the writings appointed to them, gives the product a Divine quality unattainable by human powers alone. Thus, these books become not merely the word of godly men, but the immediate word of God Himself, speaking directly as such to the minds and hearts of every reader. The value of "inspiration" emerges, thus, as twofold. It gives to the books written under its "bearing" a quality which is truly superhuman; a trustworthiness, an authority, a searchingness, a profundity, a profitableness which is altogether Divine. And it speaks this Divine word immediately to each reader\'s heart and conscience; so that he does not require to make his way to God, painfully, perhaps even uncertainly, through the words of His servants, the human instruments in writing the Scriptures, but can listen directly to the Divine voice itself speaking immediately in the Scriptural word to him.<P>14. Witness of New Testament Writers to Divine Operation:<P>That the writers of the New Testament themselves conceive the Scriptures to have been produced thus by Divine operations extending through the increasing ages and involving a multitude of varied activities, can be made clear by simply attending to the occasional references they make to this or that step in the process. It lies, for example, on the face of their expositions, that they of New Testament looked upon the Biblical history as teleological. Not only do they tell us that to "whatsoever things were written afore-time were written for our learning, that through patience and through comfort of the scriptures we might have hope" (<a onClick="return mV(\'Rom\',15,4);">Ro 15:4</a>; compare <a onClick="return mV(\'Rom\',4,23,24);">Ro 4:23-24</a>); they speak also of the course of the historical events themselves as guided for our benefit: "Now these things happened unto them by way of example"—in a typical fashion, in such a way that, as they occurred, a typical character, or predictive reference impressed itself upon them; that is to say, briefly, the history occurred as it did in order to bear a message to us—"and they were written for our admonition, upon whom the ends of the ages are come" (<a onClick="return mV(\'1Cr\',10,11);">1Co 10:11</a>; compare <a onClick="return mV(\'1Cr\',10,6);">1Co 10:6</a>). Accordingly, it has become a commonplace of Biblical exposition that "the history of redemption itself is a typically progressive one" (Kuper), and is "in a manner impregnated with the prophetic element," so as to form a "part of a great plan which stretches from the fall of man to the first consummation of all things in glory; and, in so far as it reveals the mind of God toward man, carries a respect to the future not less than to the present" (P. Fairbairn). It lies equally on the face of the New Testament allusions to the subject that its writers understood that the preparation of men to become vehicles of God\'s message to man was not of yesterday, but had its beginnings in the very origin of their being. The call by which Paul, for example, was made an apostle of Jesus Christ was sudden and apparently without antecedents; but it is precisely this Paul who reckons this call as only one step in a long process, the beginnings of which antedated his own existence: "But when it was the good pleasure of God, who separated me, even from my mother\'s womb, and called me through his grace, to reveal his Son in me" (<a onClick="return mV(\'Gal\',1,15,16);">Ga 1:15-16</a>; compare <a onClick="return mV(\'Jer\',1,5);">Jer 1:5</a>; <a onClick="return mV(\'Isa\',49,1,5);">Isa 49:1, 5</a>). The recognition by the writers of the New Testament of the experiences of God\'s grace, which had been vouchsafed to them as an integral element in their fitting to be the bearers of His gospel to others, finds such pervasive expression that the only difficulty is to select from the mass the most illustrative passages. Such a statement as Paul gives in the opening verses of 2Co is thoroughly typical. There he represents that he has been afflicted and comforted to the end that he might "be able to comfort them that are in any affliction, through the comfort wherewith" he had himself been "comforted of God." For, he explains, Whether we are afflicted, it is for your comfort and salvation; or whether we are comforted, it is for your comfort, which worketh in the patient enduring of the same sufferings which we also suffer" (<a onClick="return mV(\'2Cr\',1,\'4-6\');">2Co 1:4-6</a>). It is beyond question, therefore, that the New Testament writers, when they declare the Scriptures to be the product of the Divine breath, and explain this as meaning that the writers of these Scriptures wrote them only as borne by the Holy Spirit in such a fashion that they spoke, not out of themselves, but "from God," are thinking of this operation of the Spirit only as the final act of God in the production of the Scriptures, superinduced upon a long series of processes, providential, gracious, miraculous, by which the matter of Scripture had been prepared for writing, and the men for writing it, and the writing of it had been actually brought to pass. It is this final act in the production of Scripture which is technically called "inspiration"; and inspiration is thus brought before us as, in the minds of the writers of the New Testament, that particular operation of God in the production of Scripture which takes effect at the very point of the writing of Scripture—understanding the term "writing" here as inclusive of all the processes of the actual composition of Scripture, the investigation of documents, the collection of facts, the excogitation of conclusions, the adaptation of exhortations as means to ends and the like—with the effect of giving to the resultant Scripture a specifically supernatural character, and constituting it a Divine, as well as human, book. Obviously the mode of operation of this Divine activity moving to this result is conceived, in full accord with the analogy of the Divine operations in other spheres of its activity, in providence and in grace alike, as confluent with the human activities operative in the case; as, in a word, of the nature of what has come to be known as "immanent action."<P>15. "Inspiration" and "Revelation":<P>It will not escape observation that thus "inspiration" is made a mode of "revelation." We are often exhorted, to be sure, to distinguish sharply between "inspiration" and "revelation"; and the exhortation is just when "revelation" is taken in one of its narrower senses, of, say, an external manifestation of God, or of an immediate communication from God in words. But "inspiration" does not differ from "revelation" in these narrowed senses as genus from genus, but as a species of one genus differs from another. That operation of God which we call "inspiration," that is to say, that operation of the Spirit of God by which He "bears" men in the process of composing Scripture, so that they write, not of themselves, but "from God," is one of the modes in which God makes known to men His being, His will, His operations, His purposes. It is as distinctly a mode of revelation as any mode of revelation can be, and therefore it performs the same office which all revelation performs, that is to say, in the express words of Paul, it makes men wise, and makes them wise unto salvation. All "special" or "supernatural" revelation (which is redemptive in its very idea, and occupies a place as a substantial element in God\'s redemptive processes) has precisely this for its end; and Scripture, as a mode of the redemptive revelation of God, finds its fundamental purpose just in this: if the "inspiration" by which Scripture is produced renders it trustworthy and authoritative, it renders it trustworthy and authoritative only that it may the better serve to make men wise unto salvation. Scripture is conceived, from the point of view of the writers of the New Testament, not merely as the record of revelations, but as itself a part of the redemptive revelation of God; not merely as the record of the redemptive acts by which God is saving the world, but as itself one of these redemptive acts, having its own part to play in the great work of establishing and building up the kingdom of God. What gives it a place among the redemptive acts of God is its Divine origination, taken in its widest sense, as inclusive of all the Divine operations, providential, gracious and expressly supernatural, by which it has been made just what it is—a body of writings able to make wise unto salvation, and profitable for making the man of God perfect. What gives it its place among the modes of revelation is, however, specifically the culminating one of these Divine operations, which we call "inspiration"; that is to say, the action of the Spirit of God in so "bearing" its human authors in their work of producing Scripture, as that in these Scriptures they speak, not out of themselves, but "from God." It is this act by virtue of which the Scriptures may properly be called "God-breathed."<P>16. Scriptures a Divine-Human Book?:<P>It has been customary among a certain school of writers to speak of the Scriptures, because thus "inspired," as a Divine-human book, and to appeal to the analogy of Our Lord\'s Divine-human personality to explain their peculiar qualities as such. The expression calls attention to an important fact, and the analogy holds good a certain distance. There are human and Divine sides to Scripture, and, as we cursorily examine it, we may perceive in it, alternately, traits which suggest now the one, now the other factor in its origin. But the analogy with our Lord\' s Divine-human personality may easily be pressed beyond reason. There is no hypostatic union between the Divine and the human in Scripture; we cannot parallel the "inscripturation" of the Holy Spirit and the incarnation of the Son of God. The Scriptures are merely the product of Divine and human forces working together to produce a product in the production of which the human forces work under the initiation and prevalent direction of the Divine: the person of our Lord unites in itself Divine and human natures, each of which retains its distinctness while operating only in relation to the other. Between such diverse things there can exist only a remote analogy; and, in point of fact, the analogy in the present instance amounts to no more than that in both cases Divine and human factors are involved, though very differently. In the one they unite to constitute a Divine-human person, in the other they cooperate to perform a Divine-human work. Even so distant an analogy may enable us, however, to recognize that as, in the case of our Lord\'s person, the human nature remains truly human while yet it can never fall into sin or error because it can never act out of relation with the Divine nature into conjunction with which it has been brought; so in the case of the production of Scripture by the conjoint action of human and Divine factors, the human factors have acted as human factors and have left their mark on the product as such, and yet cannot have fallen into that error which we say it is human to fall into, because they have not acted apart from the Divine factors, by themselves, but only under their unerring guidance.<P>17. Scripture of New Testament Writers Was the Old Testament:<P>The New Testament testimony is to the Divine origin and qualities of "Scripture"; and "Scripture" to the writers of the New Testament was fundamentally, of course, the Old Testament. In the primary passage, in which we are told that "every" or "all Scripture" is "God breathed," the direct reference is to the "sacred writings" which Timothy had had in knowledge since his infancy, and these were, of course, just the sacred books of the Jews (<a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>). What is explicit here is implicit in all the allusions to inspired Scriptures in the New Testament. Accordingly, it is frequently said that our entire testimony to the inspiration of Scripture concerns the Old Testament alone. In many ways, however, this is overstated. Our present concern is not with the extent of "Scripture" but with the nature of "Scripture"; and we cannot present here the considerations which justify extending to the New Testament the inspiration which the New Testament writers attribute to the Old Testament. It will not be out of place, however, to point out simply that the New Testament writers obviously themselves made this extension. They do not for an instant imagine themselves, as ministers of a new covenant, less in possession of the Spirit of God than the ministers of the old covenant: they freely recognize, indeed, that they have no sufficiency of themselves, but they know that God has made them sufficient (<a onClick="return mV(\'2Cr\',3,5,6);">2Co 3:5-6</a>). They prosecute their work of proclaiming the gospel, therefore, in full confidence that they speak "by the Holy Spirit" (<a onClick="return mV(\'1Pe\',1,12);">1Pe 1:12</a>), to whom they attribute both the matter and form of their teaching (<a onClick="return mV(\'1Cr\',2,13);">1Co 2:13</a>). They, therefore, speak with the utmost assurance of their teaching (<a onClick="return mV(\'Gal\',1,7,8);">Ga 1:7-8</a>); and they issue commands with the completest authority (<a onClick="return mV(\'1Th\',4,2,14);">1Th 4:2, 14</a>; <a onClick="return mV(\'2Th\',3,6,12);">2Th 3:6, 12</a>), making it, indeed, the test of whether one has the Spirit that he should recognize what they demand as commandments of God (<a onClick="return mV(\'1Cr\',14,37);">1Co 14:37</a>). It would be strange, indeed, if these high claims were made for their oral teaching and commandments exclusively. In point of fact, they are made explicitly also for their written injunctions. It was "the things" which Paul was "writing," the recognition of which as commands of the Lord, he makes the test of a Spirit-led man (<a onClick="return mV(\'1Cr\',14,37);">1Co 14:37</a>). It is his "word by this epistle," obedience to which he makes the condition of Christian communion (<a onClick="return mV(\'2Th\',3,14);">2Th 3:14</a>). There seems involved in such an attitude toward their own teaching, oral and written, a claim on the part of the New Testament writers to something very much like the "inspiration”which they attribute to the writers of the Old Testament.<P>18. Inclusion of New Testament:<P>And all doubt is dispelled when we observe the New Testament writers placing the writings of one another in the same category of "Scripture" with the books of the Old Testament. The same Paul who, in <a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>, declared that \'every\' or \'all scripture is God-breathed\' had already written in <a onClick="return mV(\'1Ti\',5,18);">1Ti 5:18</a>: "For the scripture saith, Thou shall not muzzle the ox when he treadeth out the corn (grain). And, The laborer is worthy of his hire." The first clause here is derived from Deuteronomy and the second from the Gospel of Luke, though both are cited as together constituting, or better, forming part of the "Scripture" which Paul adduces as so authoritative as by its mere citation to end all strife. Who shall say that, in the declaration of the later epistle that "all" or "every" Scripture is God-breathed, Paul did not have Luke, and, along with Luke, whatever other new books he classed with the old under the name of Scripture, in the back of his mind, along with those old books which Timothy had had in his hands from infancy? And the same Peter who declared that every "prophecy of scripture" was the product of men who spoke "from God," being \'borne\' by the Holy Spirit (<a onClick="return mV(\'2Pe\',1,21);">2Pe 1:21</a>), in this same epistle (<a onClick="return mV(\'2Pe\',3,16);">2Pe 3:16</a>), places Paul\'s Epistles in the category of Scripture along with whatever other books deserve that name. For Paul, says he, wrote these epistles, not out of his own wisdom, but "according to the wisdom given to him," and though there are some things in them hard to be understood, yet it is only the ignorant and unsteadfast" who wrest these difficult passages—as what else could be expected of men who wrest "also the other Scriptures" (obviously the Old Testament is meant)—"unto their own destruction"? Is it possible to say that Peter could not have had these epistles of Paul also lurking somewhere in the back of his mind, along with "the other scriptures," when he told his readers that every "prophecy of scripture" owes its origin to the prevailing operation of the Holy Ghost? What must be understood in estimating the testimony of the New Testament writers to the inspiration of Scripture is that "Scripture" stood in their minds as the title of a unitary body of books, throughout the gift of God through His Spirit to His people; but that this body of writings was at the same time understood to be a growing aggregate, so that what is said of it applies to the new books which were being added to it as the Spirit gave them, as fully as to the old books which had come down to them from their hoary past. It is a mere matter of detail to determine precisely what new books were thus included by them in the category "Scripture." They tell us some of them themselves. Those who received them from their hands tell us of others. And when we put the two bodies of testimony together we find that they constitute just our New Testament. It is no pressure of the witness of the writers of the New Testament to the inspiration of the Scripture, therefore, to look upon it as covering the entire body of "Scriptures," the new books which they were themselves adding to this aggregate, as well as the old books which they had received as Scripture from the fathers. Whatever can lay claim by just right to the appellation of "Scripture," as employed in its eminent sense by those writers, can by the same just right lay claim to the "inspiration" which they ascribe to this "Scripture."<P>LITERATURE.<P>J. Gerhard, Loci Theolog., Locus I; F. Turretin, Instit. Theol., Locus II; B. de Moor, Commentary in J. Marckii Comp., cap. ii; C. Hodge, Syst. Theol., New York,1871,I, 151-86; Henry B. Smith, The Inspiration of the Holy Scriptures, New York,1855,new edition, Cincinnati, 1891; A. Kuyper, Encyclopedia der heilige Godgeleerdheid, 1888-89, II, 347ff, English translation; Encyclopedia of Sacred Theology, New York,1898,341-563; also De Schrift her woord Gods, Tiel, 1870; H. Bavinck, Gereformeerde Dogmatiek2, Kampen,1906,I, 406-527; R. Haldane, The Verbal Inspiration of the Scriptures Established, Edinburgh, 1830; J. T. Beck, Einleitung in das System der christlichen Lehre, Stuttgart,1838,2nd edition, 1870; A. G. Rudelbach, "Die Lehre yon der Inspiration der heil. Schrift," Zeitschrift fur die gesammte Lutherische Theologie und Kirche, 1840,1,1841,1,1842, 1; S. R. L. Gaussen, Theopneustie ou inspiration pleniere des saintes ecritures2, Paris,1842,English translation by E. N. Kirk, New York, 1842; also Theopneustia; the Plenary Inspiration of the Holy Scriptures, David Scott\'s translation, reedited and revised by B. W. Carr, with a preface by C. H. Spurgeon, London, 1888; William Lee, The Inspiration of the Holy Scriptures, Donellan Lecture,1852,New York, 1857; James Bannerman, Inspiration: the Infallible Truth and Divine Authority of the Holy Scriptures, Edinburgh, 1865; F. L. Patton, The Inspiration of the Scriptures, Philadelphia, 1869 (reviewing Lee and Bannerman); Charles Elliott, A Treatise on the Inspiration of the Holy Scriptures, Edinburgh, 1877; A. A. Hodge and B. B. Warfield, "Inspiration," Presbyterian Review, April,1881,also tract, Philadelphia, 1881; R. Watts, The Rule of Faith and the Doctrine of Inspiration, Edinburgh, 1885; A. Cave, The Inspiration of the O T Inductively Considered, London, 1888; B. Manly, The Bible Doctrine of Inspiration, New York, 1888; W. Rohnert, Die Inspiration der heiligen Schrift und ihre Bestreiter, Leipzig, 1889; A. W. Dieckhoff, Die Inspiration und Irrthumlosigkeit der heiligen Schrift, Leipzig, 1891; J. Wichelhaus, Die Lehre der heiligen Schrift, Stuttgart, 1892; J. Macgregor, The Revelation and the Record, Edinburgh, 1893; J. Urquhart, The Inspiration and Accuracy of the Holy Scriptures, London, 1895; C. Pesch, De Inspiratione Sacrae Scripturae, Freiburg, 1906; James Orr, Revelation and Inspiration, London, 1910.``187';
isbe[4622]='Instant; Instantly`in\'-stant, in\'-stant-li: Derivative from Latin instare. Found in English with various meanings from the 15th century to the present time.<P>Instant is used once in <a onClick="return mV(\'Isa\',29,5);">Isa 29:5</a> in the sense of immediate time; elsewhere in the sense of urgent, pressing; <a onClick="return mV(\'Luk\',23,23);">Lu 23:23</a>, where "were instant" is the King James Version translation of the verb epekeinto; <a onClick="return mV(\'Rom\',12,12);">Ro 12:12</a>, where it is involved in the verb proskartereo; compare <a onClick="return mV(\'Act\',6,4);">Ac 6:4</a>. In <a onClick="return mV(\'2Ti\',4,2);">2Ti 4:2</a> it stands for the expressive verb epistethi, "stand to."<P>Instantly (urgently, steadfastly) is the King James Version rendering of two different Greek phrases, spoudaios, found in <a onClick="return mV(\'Luk\',7,4);">Lu 7:4</a>; and en ekteneia, in <a onClick="return mV(\'Act\',26,7);">Ac 26:7</a>. In both cases the American Standard Revised Version renders "earnestly."``121';
isbe[4623]='Instruction`in-struk\'-shun.`<a href="./study/isbe/search.html?string=CATECHIST">CATECHIST</a>; <a href="./study/isbe/search.html?string=EDUCATION">EDUCATION</a>; <a href="./study/isbe/search.html?string=SCHOOL">SCHOOL</a>`1';
isbe[4624]='Instrument`in\'-stroo-ment (keli; in Greek plural hopla, <a onClick="return mV(\'Rom\',6,13);">Ro 6:13</a>): The word in the Old Testament is used for utensils for service, chiefly in connection with the sanctuary (compare <a onClick="return mV(\'Exd\',25,9);">Ex 25:9</a>; <a onClick="return mV(\'Num\',4,12,26,32);">Nu 4:12, 26, 32</a>; <a onClick="return mV(\'1Ki\',19,21);">1Ki 19:21</a>; <a onClick="return mV(\'1Ch\',9,29);">1Ch 9:29</a>; <a onClick="return mV(\'2Ch\',4,16);">2Ch 4:16</a>, the King James Version); for weapons of war (<a onClick="return mV(\'1Sa\',8,12);">1Sa 8:12</a>; <a onClick="return mV(\'1Ch\',12,33,37);">1Ch 12:33, 37</a>, etc.); notably for musical instruments. See <a href="study/isbe/search.html?string=MUSIC">MUSIC</A>. The members of the body are described by Paul (<a onClick="return mV(\'Rom\',6,13);">Ro 6:13</a>) as "instruments" to be used in the service of righteousness, as before they were in the service of unrighteousness.``1';
isbe[4625]='Instruments of Music`(shalishim): Thus, the Revised Version (British and American) and the King James Version (<a onClick="return mV(\'1Sa\',18,6);">1Sa 18:6</a>), the Revised Version margin "triangles" or "three-stringed instruments."`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[4626]='Insurrection`in-su-rek\'-shun: The word in <a onClick="return mV(\'Psa\',64,2);">Ps 64:2</a> the King James Version is changed in the Revised Version (British and American) into "tumult"; in <a onClick="return mV(\'Ezr\',4,19);">Ezr 4:19</a> (verb) it represents the Aramaic nesa\', to "lift up oneself." In the New Testament stasis, is rendered "insurrection" in <a onClick="return mV(\'Mar\',15,7);">Mr 15:7</a> the King James Version (where compare the verb "made insurrection"), but in <a onClick="return mV(\'Luk\',23,19,25);">Lu 23:19, 25</a> "sedition." the Revised Version (British and American) correctly renders "insurrection" throughout; also in <a onClick="return mV(\'Act\',24,5);">Ac 24:5</a> "insurrections" for the King James Version "sedition."``1';
isbe[4627]='Integrity`in-teg\'-ri-ti (tom, tummah): The translation of tom, "simplicity," "soundness," "completeness," rendered also "upright," "perfection." Its original sense appears in the phrase letom (<a onClick="return mV(\'1Ki\',22,34);">1Ki 22:34</a>; <a onClick="return mV(\'2Ch\',18,33);">2Ch 18:33</a>), "A certain man drew his bow at a venture" margin "Hebrew, in his simplicity" (compare <a onClick="return mV(\'2Sa\',15,11);">2Sa 15:11</a>, "in their simplicity"). It is translated "integrity" (<a onClick="return mV(\'Gen\',20,5,6);">Ge 20:5-6</a>; <a onClick="return mV(\'1Ki\',9,4);">1Ki 9:4</a>; <a onClick="return mV(\'Psa\',7,8);">Ps 7:8</a>; <a onClick="return mV(\'Psa\',25,21);">25:21</a>; <a onClick="return mV(\'Psa\',26,1,11);">26:1, 11</a>; <a onClick="return mV(\'Psa\',41,12);">41:12</a>; <a onClick="return mV(\'Psa\',78,72);">78:72</a>; <a onClick="return mV(\'Pro\',19,1);">Pr 19:1</a>; <a onClick="return mV(\'Pro\',20,7);">20:7</a>), in all which places it seems to carry the meaning of simplicity, or sincerity of heart and intention, truthfulness, uprightness. In the plural (tummim) it is one of the words on the breastplate of the high priest (<a onClick="return mV(\'Exd\',28,30);">Ex 28:30</a>; <a onClick="return mV(\'Deu\',33,8);">De 33:8</a>; <a onClick="return mV(\'Ezr\',2,63);">Ezr 2:63</a>; <a onClick="return mV(\'Neh\',7,65);">Ne 7:65</a>), one of the sacred lots, indicating, perhaps, "innocence" or "integrity" Septuagint aletheia). See <a href="study/isbe/search.html?string=URIM+AND+THUMMIM">URIM AND THUMMIM</a>. Another word translated "integrity" is tummah, from tamam, "to complete," "be upright," "perfect," only in <a onClick="return mV(\'Job\',2,3,9);">Job 2:3, 9</a>; <a onClick="return mV(\'Job\',27,5);">27:5</a>; <a onClick="return mV(\'Job\',31,6);">31:6</a>; <a onClick="return mV(\'Pro\',11,3);">Pr 11:3</a>.<P>The word "integrity" does not occur in the New Testament, but its equivalents may be seen in "sincerity," "truth," the "pure heart," the "single eye," etc. In the above sense of simplicity of intention it is equivalent to being honest, sincere, genuine, and is fundamental to true character.``185';
isbe[4628]='Intelligence`in-tel\'-i-gens (bin): Occurs only once in the King James Version as the translation of bin, "to discriminate" (frequently translated "to understand"), in <a onClick="return mV(\'Dan\',11,30);">Da 11:30</a> the King James Version, "(he shall) have intelligence with them that forsake the holy covenant," the Revised Version (British and American) renders "have regard unto them." "Intelligence" occurs in 2Macc 3:9 the King James Version, in the sense of information (so the Revised Version (British and American)).``1';
isbe[4629]='Intend; Intent`in-tend\', in-tent\':Early English words derived from Latin and used in the King James Version, sometimes in the Revised Version (British and American), to translate a number of different expressions of the original.<P>Intend is sometimes used in English in the literal sense of Latin intendere, "to stretch," but in the English Bible it is used only of the direction of the mind toward an object. Sometimes it is used of mere design (mello), <a onClick="return mV(\'Act\',5,35);">Ac 5:35</a> the King James Version; <a onClick="return mV(\'Act\',20,13);">Ac 20:13</a>; or of desired action (thelo), <a onClick="return mV(\'Luk\',14,28);">Lu 14:28</a> the King James Version; again of a fixed purpose (boulomai), <a onClick="return mV(\'Act\',5,28);">Ac 5:28</a>; <a onClick="return mV(\'Act\',12,4);">12:4</a>; or, finally, of a declared intention (\'amar), <a onClick="return mV(\'Jos\',22,33);">Jos 22:33</a> the King James Version; <a onClick="return mV(\'2Ch\',28,13);">2Ch 28:13</a> the King James Version.<P>Intent is used only of purpose, and is the translation sometimes of a conjunction (lebha\'abhur), <a onClick="return mV(\'2Sa\',17,14);">2Sa 17:14</a>; (lema\'an), <a onClick="return mV(\'2Ki\',10,19);">2Ki 10:19</a>; (hina), <a onClick="return mV(\'Eph\',3,10);">Eph 3:10</a>; sometimes of an infinitive of purpose, <a onClick="return mV(\'1Cr\',10,6);">1Co 10:6</a>; or of a preposition with pronoun (eis touto), <a onClick="return mV(\'Act\',9,21);">Ac 9:21</a>, and sometimes of a substantive (logo), <a onClick="return mV(\'Act\',10,29);">Ac 10:29</a>. This variety of original expressions represented in the English by single terms is an interesting illustration of the extent of interpretation embodied in our English Bible.``121';
isbe[4630]='Inter-Testamental, History And Literature`in-ter-tes-ta-men\'-tal.`<a href="./study/isbe/search.html?string=BETWEEN+THE+TESTAMENTS">BETWEEN THE TESTAMENTS</a>`1';
isbe[4631]='Intercession`in-ter-sesh\'-un (pagha\', "to make intercession"; originally "to strike upon," or "against"; then in a good sense, "to assail anyone with petitions," "to urge," and when on behalf of another, "to intercede" (<a onClick="return mV(\'Rth\',1,16);">Ru 1:16</a>; <a onClick="return mV(\'Jer\',7,16);">Jer 7:16</a>; <a onClick="return mV(\'Jer\',27,18);">27:18</a>; <a onClick="return mV(\'Job\',21,15);">Job 21:15</a>; <a onClick="return mV(\'Gen\',23,8);">Ge 23:8</a>; <a onClick="return mV(\'Isa\',53,12);">Isa 53:12</a>; <a onClick="return mV(\'Jer\',36,25);">Jer 36:25</a>). A similar idea is found in enteuxis, used as "petition," and in the New Testament "intercession." The English word is derived from Latin intercedo, "to come between," which strangely has the somewhat opposed meanings of "obstruct" and "to interpose on behalf of" a person, and finally "to intercede." The growth of meaning in this word in the various languages is highly suggestive. In the Greek New Testament we find the word in <a onClick="return mV(\'1Ti\',2,1);">1Ti 2:1</a>; <a onClick="return mV(\'1Ti\',4,5);">4:5</a>; entugchano, is also found in <a onClick="return mV(\'Rom\',8,\'26-34\');">Ro 8:26-34</a>):<P><b>Etymology and Meaning of Term</b><P><b>I. MAN\'S INTERCESSION FOR HIS FELLOW-MAN</b><P class="in15">1. Patriarchal Examples<P class="in15">2. Intercessions of Moses<P class="in15">3. The Progress of Religion, Seen in Moses\' Intercessions<P class="in15">4. Intercessory Prayer in Israel\'s Later History<P class="in15">5. The Rise of Official Intercession<P class="in15">6. Samuel as an Intercessor in His Functions as Judge, Priest and Prophet<P class="in15">7. Intercession in the Poetic Books<P class="in15">8. The Books of Wisdom<P class="in15">9. The Prophets\' Succession to Moses and Samuel<P class="in15">10. The Priest and Intercession<P class="in15">11. Intercession in the Gospels<P class="in15">12. Intercessory Prayers of the Church<P class="in15">13. Intercession Found in the Epistles<P><b>II. INTERCESSION PERFECTED IN CHRIST\'S OFFICE AND IN THE CHURCH</b><P><b>III. INTERCESSION OF THE HOLY SPIRIT</b><hr /><P>Etymology and Meaning of Term:<P>The meaning of the word is determined by its use in <a onClick="return mV(\'1Ti\',2,1);">1Ti 2:1</a>, "I exhort, therefore, first of all, that supplications, prayers, intercessions, thanksgivings, be made for all and men"; where the different kinds of prayers appear to be distinguished. Considerable discussion has arisen on the exact meaning of these words. Augustine refers them to the liturgy of the Eucharist. This seems to be importing the significance of the various parts of the ceremony as observed at a time much later than the date of the passage in question. "Supplications" and "prayers" refer to general and specific petitions; "intercessions" will then have the meaning of a request concerning others.<P>Intercession is prayer on behalf of another, and naturally arises from the instinct of the human heart—not merely prompted by affection and interest, but recognizing that God\'s relation to man is not merely individual, but social. Religion thus involves man\'s relations to his fellow-man, just as in man\'s social position intercession with one on behalf of another is a common incident, becoming, in the development of society, the function of appointed officials; as in legal and courtly procedure, so in religion, the spontaneous and affectionate prayer to God on behalf of another grows into the regular and orderly service of a duly appointed priesthood. Intercession is thus to be regarded:<P>(1) as the spontaneous act of man for his fellowman;<P>(2) the official act of developed sacerdotalism;<P>(3) the perfecting of the natural movement of humanity, and the typified function of priesthood in the intercession of Christ and the Holy Spirit.<P>I. Man\'s Intercession for His Fellow-Man.<P>1. Patriarchal Examples:<P>Many such prayers are recorded in Scripture. The sacrificial act of Noah may have been partly of this nature, for it is followed by a promise of God on behalf of the race and the earth at large (<a onClick="return mV(\'Gen\',8,\'20-22\');">Ge 8:20-22</a>). Such also is Abraham\'s prayer for Ishmael (<a onClick="return mV(\'Gen\',17,18);">Ge 17:18</a>); Abraham\'s prayer for Sodom (<a onClick="return mV(\'Gen\',18,\'23-33\');">Ge 18:23-33</a>); Abraham for Abimelech (<a onClick="return mV(\'Gen\',20,17);">Ge 20:17</a>). Jacob\'s blessing of Joseph\'s sons is of the nature of intercession (<a onClick="return mV(\'Gen\',48,\'8-22\');">Ge 48:8-22</a>). His dying blessing of his sons is hardly to be regarded as intercessory; it is, rather, declarative, although in the case of Joseph it approaches intercession. The absence of distinct intercessory prayer from Abraham to Moses is to be observed, and shows how intensely personal and individual the religious consciousness was still in its undeveloped quality. In Moses, however, the social element finds a further development, and is interesting as taking up the spirit of the Father of the Faithful. Moses is the creator of the national spirit. He lifts religion from its somewhat selfish character in the patriarchal life to the higher and wider plane of a national and racial fellowship.<P>2. Intercessions of Moses:<P>The progressive character of the Divine leading of man is found thus in the development of the intercessory spirit, e.g. Moses\' prayer for the removal of plagues (<a onClick="return mV(\'Exd\',15,25);">Ex 15:25</a>f); for water at Rephidim (<a onClick="return mV(\'Exd\',17,4);">Ex 17:4</a>); for victory over Amalek (<a onClick="return mV(\'Exd\',17,\'8-16\');">Ex 17:8-16</a>); prayer for the people after the golden calf (<a onClick="return mV(\'Exd\',32,\'11-14\',\'21-34\');">Ex 32:11-14, 21-34</a>; <a onClick="return mV(\'Exd\',33,12);">33:12</a>f); after the renewal of the tables of stone (<a onClick="return mV(\'Exd\',34,9);">Ex 34:9</a>); at the setting forth and stopping of the Ark (<a onClick="return mV(\'Num\',10,35);">Nu 10:35</a>f); after the burning at Taberah (<a onClick="return mV(\'Num\',11,2);">Nu 11:2</a>); for the healing of Miriam\'s leprosy (<a onClick="return mV(\'Num\',12,13);">Nu 12:13</a>); after the return of the spies (<a onClick="return mV(\'Num\',14,\'13-19\');">Nu 14:13-19</a>); after the destruction by serpents (<a onClick="return mV(\'Num\',21,7);">Nu 21:7</a>); for direction in the case of the daughters of Zelophehad (<a onClick="return mV(\'Num\',27,5);">Nu 27:5</a>); for a successor (<a onClick="return mV(\'Num\',27,15);">Nu 27:15</a>); recital of his prayer for the people for their entrance into Canaan (<a onClick="return mV(\'Deu\',3,23);">De 3:23</a>f); recital of his prayer for the people after the worship of the golden calf (<a onClick="return mV(\'Deu\',9,18);">De 9:18</a>); recital of prayers for the rebellious people (<a onClick="return mV(\'Deu\',9,\'25-29\');">De 9:25-29</a>); a command to him who pays his third-year tithes to offer prayer for the nation (<a onClick="return mV(\'Deu\',26,15);">De 26:15</a>); Moses\' final blessing of the tribes (<a onClick="return mV(\'Deu\',33,\'1-\');">De 33</a>).<P>3. The Progress of Religion, Seen in Moses\' Intercessions:<P>This extensive series of the intercessory prayers of Moses forms a striking illustration of the growth of religion, represented by the founder of the national life of Israel. It is the history of an official, but it is also the history of a leader whose heart was filled with the intensest patriotism and regard for his fellows. None of these prayers are perfunctory. They are the vivid and passionate utterances of a man full of Divine enthusiasm and human affection. They are real prayers wrung from a great and devout soul on occasions of deep and critical importance. Apart from their importance in the history of Israel, they are a noble record of a great leader of men and servant of God.<P>4. Intercessory Prayer in Israel\'s Later History:<P>In the history of Joshua we find only the prayer for the people after the sin of Achan (<a onClick="return mV(\'Jos\',7,\'6-9\');">Jos 7:6-9</a>), although the communications from God to Joshua are numerous. A faint intercessory note may be heard in Deborah\'s song (<a onClick="return mV(\'Jdg\',5,31);">Jud 5:31</a>) though it is almost silenced by the stern and warlike tone of the poem. Gideon\'s prayer History of seems to reecho something of the words of Moses (<a onClick="return mV(\'Jdg\',6,13);">Jud 6:13</a>), and accords with the national and religious spirit of the great leader who helped in the formation of the religious life of his people (see <a onClick="return mV(\'Jdg\',6,24);">Jud 6:24</a>), notwithstanding the evident lower plane on which he stood (<a onClick="return mV(\'Jdg\',8,27);">Jud 8:27</a>), which may account partially for the apostasy after his death (<a onClick="return mV(\'Jdg\',8,33);">Jud 8:33</a>f). Manoah\'s prayers (<a onClick="return mV(\'Jdg\',13,\'1-\');">Jud 13</a>) may be noted.<P>5. The Rise of Official Intercession:<P>(The satisfaction of Micah at securing a priest for his house, and the subsequent story, belong rather to the history of official intercession (<a onClick="return mV(\'Jdg\',18,\'1-\');">Jud 18</a>; see below), as also the inquiry of the people through Phinehas at Shiloh (<a onClick="return mV(\'Jdg\',20,27);">Jud 20:27</a>f), and the people\'s mourning and prayer (<a onClick="return mV(\'Jdg\',21,2);">Jud 21:2</a>f).)<P>6. Samuel as an Intercessor in His Functions as Judge, Priest and Prophet:<P>Samuel is the real successor of Moses, and in connection with his life intercession again appears more distinct and effective. Hannah\'s song, though chiefly of thankfulness, is not without the intercessory spirit (<a onClick="return mV(\'1Sa\',2,\'1-11\');">1Sa 2:1-11</a>). So also of Samuel\'s prayer at Mizpeh (<a onClick="return mV(\'1Sa\',7,5);">1Sa 7:5</a>), and the recognition by the people of Samuel\'s place (<a onClick="return mV(\'1Sa\',7,8);">1Sa 7:8</a>f; see also <a onClick="return mV(\'1Sa\',8,6,21);">1Sa 8:6, 21</a>; <a onClick="return mV(\'1Sa\',10,\'17-25\');">10:17-25</a>; <a onClick="return mV(\'1Sa\',12,19);">12:19</a>) (for the custom of inquiring of the Lord through a seer see <a onClick="return mV(\'1Sa\',9,\'6-10\');">1Sa 9:6-10</a>); Samuel\'s prayer for Saul (<a onClick="return mV(\'1Sa\',15,11);">1Sa 15:11</a>); Saul\'s failure to secure inquiry of God, even through intercession (<a onClick="return mV(\'1Sa\',28,6);">1Sa 28:6</a>); Saul\'s final appeal through the witch of Endor (<a onClick="return mV(\'1Sa\',28,\'7-20\');">1Sa 28:7-20</a>); David\'s prayer to God (<a onClick="return mV(\'2Sa\',7,18);">2Sa 7:18</a>); David\'s Judge, prayer for deliverance of the people from pestilence (<a onClick="return mV(\'2Sa\',24,17);">2Sa 24:17</a>); Solomon\'s prayer for wisdom to govern the people (<a onClick="return mV(\'1Ki\',3,\'5-15\');">1Ki 3:5-15</a>); Solomon\'s prayer at the dedication of the temple (<a onClick="return mV(\'1Ki\',8,\'12-61\');">1Ki 8:12-61</a>); Jeroboam\'s appeal to the man of God to pray for the healing of his hand (<a onClick="return mV(\'1Ki\',13,6);">1Ki 13:6</a>); Elijah\'s prayer for the widow\'s son (<a onClick="return mV(\'1Ki\',17,20);">1Ki 17:20</a>); Elijah\'s prayer for rain (<a onClick="return mV(\'1Ki\',18,42);">1Ki 18:42</a>); Elisha\'s prayer for the widow\'s son (<a onClick="return mV(\'2Ki\',4,33);">2Ki 4:33</a>); Elisha\'s prayer for the opening of the young man\'s eyes (<a onClick="return mV(\'2Ki\',6,17);">2Ki 6:17</a>); Hezekiah\'s appeal to Isaiah (<a onClick="return mV(\'2Ki\',19,4);">2Ki 19:4</a>); Hezekiah\'s prayer (<a onClick="return mV(\'2Ki\',19,\'14-19\');">2Ki 19:14-19</a>); Josiah\'s command for prayer concerning the "book that is found" (<a onClick="return mV(\'2Ki\',22,13);">2Ki 22:13</a>). In Ch we find David\'s prayer for his house (<a onClick="return mV(\'1Ch\',17,\'16-27\');">1Ch 17:16-27</a>); David\'s prayer for deliverance from the plague (<a onClick="return mV(\'1Ch\',21,17);">1Ch 21:17</a>); David\'s prayer for the people and for Solomon at the offering of gifts for the temple (<a onClick="return mV(\'1Ch\',29,\'10-19\');">1Ch 29:10-19</a>); Solomon\'s prayer at the consecration of the temple (<a onClick="return mV(\'2Ch\',6,\'1-42\');">2Ch 6:1-42</a>); Asa\'s prayer (<a onClick="return mV(\'2Ch\',14,11);">2Ch 14:11</a>); Jehoshaphat\'s prayer (<a onClick="return mV(\'2Ch\',20,\'5-13\');">2Ch 20:5-13</a>); Hezekiah\'s prayer for the people who had not prepared to eat the Passover (<a onClick="return mV(\'2Ch\',30,18);">2Ch 30:18</a>); Josiah\'s command for prayer concerning the book (<a onClick="return mV(\'2Ch\',34,21);">2Ch 34:21</a>). In the Prophets we note Ezra\'s prayer (<a onClick="return mV(\'Ezr\',9,\'5-15\');">Ezr 9:5-15</a>); Nehemiah\'s prayer (<a onClick="return mV(\'Neh\',1,\'5-11\');">Ne 1:5-11</a>); the prayer of the Levites for the nation (<a onClick="return mV(\'Neh\',9,\'4-38\');">Ne 9:4-38</a>).<P>7. Intercession in the Poetic Books:<P>The poetic books furnish a few examples of intercessory prayer: Job\'s intercession for his children (<a onClick="return mV(\'Job\',1,5);">Job 1:5</a>); Job\'s regret at the absence of intercession (<a onClick="return mV(\'Job\',16,21);">Job 16:21</a>); the Lord\'s command that Job should pray for his friends (<a onClick="return mV(\'Job\',42,8);">Job 42:8</a>). It is remarkable that the references to the Poetic intercession in the Psalms are few; but it must not be forgotten that the psalm is generally a lyrical expression of an intense subjective condition. This does not seem in the consciousness of Israel to have reached an altruistic development. The Psalms express very powerfully the sense of obligation to God, consciousness of sin, indignation against the sin of others. Occasionally the patriotic spirit leads to prayer for Israel; but only rarely does any deep sense of interest in the welfare of others appear to possess the hearts of Israel\'s singers. In <a onClick="return mV(\'Psa\',2,12);">Ps 2:12</a> there is a hint of the intercessory office of the Son, which reflects, perhaps, the growth of the Messianic spirit in the mind of Israel; <a onClick="return mV(\'Psa\',20,\'1-\');">Ps 20</a> is intercessional; it is the prayer of a people for their king. In <a onClick="return mV(\'Psa\',25,22);">Ps 25:22</a> we find a prayer for the redemption of Israel, as in <a onClick="return mV(\'Psa\',28,9);">Ps 28:9</a>. In <a onClick="return mV(\'Psa\',35,13);">Ps 35:13</a> the Psalmist refers to his intercession for others. But the "prayer returned into mine own bosom," and the final issue of the prayer becomes rather denunciatory than intercessional. The penitence of <a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a> rises into a note of prayer for the city (<a onClick="return mV(\'Psa\',51,18);">51:18</a>). Sometimes (<a onClick="return mV(\'Psa\',60,\'1-\');">Ps 60</a>, and perhaps <a onClick="return mV(\'Psa\',67,\'1-\');">Ps 67</a>), the prayer is not individual but for the community, though even there it is hardly intercession. A common necessity makes common prayer. In <a onClick="return mV(\'Psa\',69,\'1-\');">Ps 69</a> there is the recognition of the injury that folly and sin may do to others, and a kind of compensatory note of intercession is heard. <a onClick="return mV(\'Psa\',72,\'1-\');">Ps 72</a> is regarded by some as the royal father\'s prayer for his son and successor, but the reading of the title adopted by the Revised Version (British and American) takes even this psalm from the category of intercession. In Asaph\'s Masehil (<a onClick="return mV(\'Psa\',74,\'1-\');">Ps 74</a>), intercession is more distinct; it is a prayer for the sanctuary and the people in their desolation and calamity. Asaph appears to have caught something of the spirit of Moses, as in <a onClick="return mV(\'Psa\',79,\'1-\');">Ps 79</a> he again prays for the deliverance of Jerusa
