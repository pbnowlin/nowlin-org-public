acter and mission of the suffering "Servant" of Yahweh. Already, in <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40-48</a>, he had alluded several times to this unique and somewhat enigmatical personage, speaking of him both collectively and as an individual (<a onClick="return mV(\'Isa\',41,\'8-10\');">41:8-10</a>; <a onClick="return mV(\'Isa\',42,\'1-9\',\'10-22\');">42:1-9, 18-22</a>; <a onClick="return mV(\'Isa\',43,10);">43:10</A>; <a onClick="return mV(\'Isa\',44,\'1-5\',\'21-28\');">44:1-5, 21-28</a>; <a onClick="return mV(\'Isa\',45,4);">45:4</a>; <a onClick="return mV(\'Isa\',48,\'20-22\');">48:20-22</a>); but now he defines with greater precision both his prophetic and priestly functions, his equipment for his task, his sufferings and humiliation, and also his final exaltation. Altogether in these prophecies he mentions the "Servant" some 20 times. But there are four distinctively so-called "Servant-Songs" in which the prophet seems to rise above the collective masses of all Israel to at least a personification of the pious within Israel, or better, to a unique Person embodying within himself all that is best in the Israel within Israel. They are the following:<p>(1) <a onClick="return mV(\'Isa\',42,\'1-9\');">42:1-9</a>, a poem descriptive of the Servant\'s gentle manner and world-wide mission;<p>(2) <a onClick="return mV(\'Isa\',49,\'1-13\');">49:1-13</a>, describing the Servant\'s mission and spiritual success;<p>(3) <a onClick="return mV(\'Isa\',50,\'4-11\');">50:4-11</A>, the Servant\'s soliloquy concerning His perfection through suffering; and<p>(4) <a onClick="return mV(\'Isa\',52,\'13-\');">52:13</A>-<a onClick="return mV(\'Isa\',53,\'1-12\');">53:12</a>, the Servant\'s vicarious suffering and ultimate exaltation.<p>In this last of the four "Servant-Songs" we reach the climax of the prophet\'s inspired symphony, the acme of Hebrew Messianic hope. The profoundest thoughts in the Old Testament revelation are to be found in this section. It is a vindication of the "Servant," so clear and so true, and wrought out with such pathos and potency, that it holds first place among Messianic predictions. Polycarp called it "the golden passional of the Old Testament." It has been realized in Jesus Christ.<p><a onClick="return mV(\'Isa\',58,\'1-\');">Isaiah 58-66</a> describe the future glory of the people of God. Having described in <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40-48</a> the temporal agent of Israel\'s salvation, Cyrus, and in <a onClick="return mV(\'Isa\',49,\'1-\');">Isa 49-57</a> the spiritual agent of their salvation, the "Servant" of Yahweh, the prophet proceeds in this last section to define the conditions on which salvation may be enjoyed. He begins, as before, with a double imperative, "Cry aloud, spare not" (compare <a onClick="return mV(\'Isa\',40,1);">40:1</a>; <a onClick="return mV(\'Isa\',49,1);">49:1</a>).<p>In <a onClick="return mV(\'Isa\',58,\'1-\');">Isa 58</a> he discusses true fasting and faithful Sabbath observance.<p>In <a onClick="return mV(\'Isa\',59,\'1);">Isa 59</a> he beseeches Israel to forsake their sins. It is their sins, he urges, which have hidden Yahweh\'s face and retarded the nation\'s salvation. In <a onClick="return mV(\'Isa\',59,9);">59:9</a>ff the prophet identifies himself with the people and leads them in their devotions. Yahweh is grieved over Israel\'s forlorn condition, and, seeing their helplessness, He arms himself like a warrior to interfere judicially (<a onClick="return mV(\'Isa\',59,\'15-19\');">59:15-19</A>). Israel shall be redeemed. With them as the nucleus of a new nation, Yahweh will enter anew into covenant relation, and put His Spirit upon them, which will abide with them henceforth and forever (<a onClick="return mV(\'Isa\',59,20,21);">59:20-21</a>).<p><a onClick="return mV(\'Isa\',60,\'1-\');">Isaiah 60</a>-<a onClick="return mV(\'Isa\',61,\'1-\');">61</a> describe the future blessedness of Zion. The long-looked-for "light" (compare <a onClick="return mV(\'Isa\',59,9);">59:9</a>) begins to dawn: "Arise, shine; for thy light is come, and the glory of Yahweh is risen upon thee" (<a onClick="return mV(\'Isa\',60,1);">60:1</a>). The prophet pauses at this point to paint a picture of the redeemed community. As in <a onClick="return mV(\'Isa\',2,3,4);">2:3,4</a>, the Gentiles are seen flocking to Zion, which becomes the mistress of the nations. Foreigners build her walls, and her gates are kept open continually without fear of siege. The Gentiles acknowledge that Zion is the spiritual center of the world. Even Israel\'s oppressors regard her as "the city of Yahweh," as "an eternal excellency," in which Yahweh sits as its everlasting light (<a onClick="return mV(\'Isa\',60,\'10-22\');">60:10-22</a>).<p>In <a onClick="return mV(\'Isa\',61,\'1-\');">Isa 61</a>, which Drummond has called "the program of Christianity," the "Servant" of Yahweh is again introduced, though anonymously, as the herald of salvation (<a onClick="return mV(\'Isa\',61,\'1-3\');">61:1-3</A>). The gospel monologue of the "Servant" is followed by a promise of the restoration and blessedness of Jerusalem (<a onClick="return mV(\'Isa\',61,\'4-11\');">61:4-11</a>). Thus the prophecy moves steadily forward toward its goal in Jesus Christ (compare <a onClick="return mV(\'Luk\',4,\'18-21\');">Lu 4:18-21</a>).<p>In <a onClick="return mV(\'Isa\',62,\'1-\');">Isa 62:1</A>-<a onClick="return mV(\'Isa\',63,\'1-6\');">63:6</a> Zion\'s salvation is described as drawing near. The nations will be spectators of the great event. A new name which will better symbolize her true character shall be given to Zion, namely, Hephzibah, "My delight is in her"; for Jerusalem shall no more be called desolate. On the other hand, Zion\'s enemies will all be vanquished. In a brief poem of peculiar dramatic beauty (<a onClick="return mV(\'Isa\',63,\'1-6\');">63:1-6</a>), the prophet portrays Yahweh\'s vengeance, as a victorious warrior, upon all those who retard Israel\'s deliverance. Edom in particular was Israel\'s insatiate foe. Hence, the prophet represents Yahweh\'s judgment of the nations as taking place on Edom\'s unhallowed soil. Yahweh, whose mighty arm has wrought salvation, returns as victor, having slain all of Israel\'s foes.<p>In <a onClick="return mV(\'Isa\',63,\'7-\');">Isa 63:7</a>-<a onClick="return mV(\'Isa\',64,\'1-12\');">64:12</a>, Yahweh\'s "servants" resort to prayer. They appeal to Yahweh as the Begetter and Father of the nations (<a onClick="return mV(\'Isa\',63,16);">63:16</A>; <a onClick="return mV(\'Isa\',64,8);">64:8</a>). With this thought of the fatherhood of God imbedded in his language, Isaiah had opened his very first oracle to Judah and Jerusalem (compare <a onClick="return mV(\'Isa\',1,2);">1:2</a>). As the prayer proceeds, the language becomes increasingly tumultuous. The people are thrown into despair because Yahweh seems to have abandoned them altogether (<a onClick="return mV(\'Isa\',63,19);">63:19</A>). They recognize that the condition of Jerusalem is desperate. "Our holy and our beautiful house, where our fathers praised thee, is burned with fire; and all our pleasant places are laid waste" (<a onClick="return mV(\'Isa\',64,11);">64:11</A>). Such language, however, is the language of fervent prayer and must not be taken with rigid literalness, as <a onClick="return mV(\'Isa\',63,18);">63:18</a> and <a onClick="return mV(\'Isa\',3,8);">3:8</A> plainly show.<p>Finally, in <a onClick="return mV(\'Isa\',65,\'1-\');">Isa 65</A>-<a onClick="return mV(\'Isa\',66,\'1-\');">66</a>, Yahweh answers His people\'s supplications, distinguishing sharply between His own "servants" and Israel\'s apostates. Only His chosen "seed" shall be delivered (<a onClick="return mV(\'Isa\',65,9);">65:9</a>). Those who have obdurately provoked Yahweh by sacrificing in gardens (<a onClick="return mV(\'Isa\',65,3);">65:3</A>; <a onClick="return mV(\'Isa\',66,17);">66:17</A>), offering libations to Fortune and Destiny (<a onClick="return mV(\'Isa\',65,11);">65:11</A>), sitting among the graves to obtain oracles from the dead, and, like the Egyptians, eating swine\'s flesh and broth of abominable things which were supposed to possess magical properties, lodging in vaults or crypts in which heathen mysteries were celebrated (<a onClick="return mV(\'Isa\',65,4);">65:4</A>), and at the same time fancying that by celebrating such heathen mysteries they are holier than others and thereby disqualified to discharge the ordinary duties of life (<a onClick="return mV(\'Isa\',65,5);">65:5</a>)—such Yahweh designs to punish, measuring their work into their bosom and destroying them utterly with the sword (<a onClick="return mV(\'Isa\',65,7,12);">65:7,12</A>). On the other hand, the "servants" of Yahweh shall inherit His holy mountains. They shall rejoice and sing for joy of heart, and bless themselves in the God of Amen, i.e. in the God of Truth (<a onClick="return mV(\'Isa\',65,9,14,16);">65:9,14,16</a>). Yahweh will create new heavens and a new earth, men will live and grow old like the patriarchs; they will possess houses and vineyards and enjoy them; for an era of idyllic peace will be ushered in with the coming of the Messianic age, in which even the natures of wild animals will be changed and the most rapacious of wild animals will live together in harmony (<a onClick="return mV(\'Isa\',65,\'17-25\');">65:17-25</A>). Religion will become spiritual and decentralized, mystic cults will disappear, incredulous scoffers will be silenced. Zion\'s population will be marvelously multiplied, and the people will be comforted and rejoice (<a onClick="return mV(\'Isa\',66,\'1-14\');">66:1-14</a>). Furthermore, all nations will flock to Zion to behold Yahweh\'s glory, and from one new moon to another, and from one Sabbath to another, all flesh will come up to worship in Jerusalem (<a onClick="return mV(\'Isa\',66,\'15-23\');">66:15-23</a>).<p>It is evident that the Book of Isaiah closes, practically as it begins, with a polemic against false worship, and the alternate reward of the righteous and punishment of the wicked. The only essential difference between the prophet\'s earlier and later oracles is this: Isaiah, in his riper years, on the basis of nearly half a century\'s experience as a preacher, paints a much brighter eschatological picture than was possible in his early ministry. His picture of the Messianic age not only transcends those of his contemporaries in the 8th century BC, but he penetrates regions beyond the spiritual horizon of any and all Old Testament seers. Such language as that contained in <a onClick="return mV(\'Isa\',66,1,2);">Isa 66:1-2</a>, in particular, anticipates the great principle enunciated by Jesus in <a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>, namely, that "God is a Spirit: and they that worship him must worship in spirit and truth." To attempt to date such oracles as these on the basis of internal evidence is an absolute impossibility. Humanly speaking, one age could have produced such revelations quite as easily as another. But no age could have produced them apart from the Divine spirit.``152';
isbe[4664]='Isaiah, 8-9`8. Isaiah\'s Prophecies Chronologically Arranged:<P>The editorial arrangement of Isaiah\'s prophecies is very suggestive. In the main they stand in chronological order. That is to say, all the dates mentioned are in strict historical sequence; e.g. <a onClick="return mV(\'Isa\',6,1);">Isa 6:1</a>, "In the year that king Uzziah died" (740 BC); <a onClick="return mV(\'Isa\',7,1);">7:1</A>, "In the days of Ahaz" (736ff BC); <a onClick="return mV(\'Isa\',14,28);">14:28</A>, "In the year that king Ahaz died" (727 BC); <a onClick="return mV(\'Isa\',20,1);">20:1</A>, "In the year that Tartan came unto Ashdod, when Sargon the king of Assyria sent him" (711 BC); <a onClick="return mV(\'Isa\',36,1);">36:1</A>, "In the 14th year of king Hezekiah" (701 BC). These points are all in strict chronological order. Taken in groups, also, Isaiah\'s great individual messages are likewise arranged in true historical sequence; thus, <span class="noTag">Isa 1-6</span> for the most part belong to the last years of Jotham\'s reign (740-736 BC); <span class="noTag">Isa 7-12</span> to the period of the Syro-Ephraimitic war (734 BC); <a onClick="return mV(\'Isa\',20,\'1-\');">Isa 20</a>, to the year of Sargon\'s siege of Ashdod (711 BC); <span class="noTag">Isa 28-32</span>, to the invasion of Judah by Sennacherib (701 BC); while the distinctively promissory portions (<span class="noTag">Isa 40-66</span>), as is natural, conclude the collection. In several minor instances, however, there are notable departures from a rigid chronological order. For example, <a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>, which describes the prophet\'s initial call to preach, follows the rebukes and denunciations of <span class="noTag">Isa 1-5</span>; but this is probably due to its being used by the prophet as an apologetic. Again, the oracles against foreign nations in <span class="noTag">Isa 13-23</span> belong to various dates, being grouped together, in part, at least, because of their subject-matter. Likewise, <a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</a>-<a onClick="return mV(\'Isa\',39,\'1-\');">39</a>, which give an account of Hezekiah\'s sickness and Merodach-baladan\'s embassy to him upon his recovery (714-712 BC), chronologically precede <a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</A>-<a onClick="return mV(\'Isa\',37,\'1-\');">37</a>, which describe Sennacherib\'s investment of Jerusalem (701 BC).These points are all in strict chronological order. Taken in groups, also, Isaiah\'s great individual messages are likewise arranged in true historical sequence; thus, <span class="noTag">Isa 1-6</span> for the most part belong to the last years of Jotham\'s reign (740-736 BC); <a onClick="return mV(\'Isa\',7,\'1-\');">Isa 7-12</a> to the period of the Syro-Ephraimitic war (734 BC); <a onClick="return mV(\'Isa\',20,\'1-\');">Isa 20</a>, to the year of Sargon\'s siege of Ashdod (711 BC); <span class="noTag">Isa 28-32</span>, to the invasion of Judah by Sennacherib (701 BC); while the distinctively promissory portions (<span class="noTag">Isa 40-66</span>), as is natural, conclude the collection. In several minor instances, however, there are notable departures from a rigid chronological order. For example, <a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>, which describes the prophet\'s initial call to preach, follows the rebukes and denunciations of <span class="noTag">Isa 1-5</span>; but this is probably due to its being used by the prophet as an apologetic. Again, the oracles against foreign nations in <span class="noTag">Isa 13-23</span> belong to various dates, being grouped together, in part, at least, because of their subject-matter. Likewise, <a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</a>-<a onClick="return mV(\'Isa\',39,\'1-\');">39</a>, which give an account of Hezekiah\'s sickness and Merodach-baladan\'s embassy to him upon his recovery (714-712 BC), chronologically precede <a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</A>-<a onClick="return mV(\'Isa\',37,\'1-\');">37</a>, which describe Sennacherib\'s investment of Jerusalem (701 BC). This chiastic order, however, in the last instance, is due probably to the desire to make <a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</A>-<a onClick="return mV(\'Isa\',37,\'1-\');">37</a> (about Sennacherib, king of Assyria) an appropriate conclusion to <span class="noTag">Isa 1-35</span> (which say much about Assyria), and, on the other hand, to make <a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</A>-<a onClick="return mV(\'Isa\',39,\'1-\');">39</a> (about Merodach-baladan of Babylon) a suitable introduction to <span class="noTag">Isa 40-66</span> (which speak of Babylon). <P>The attempt to date Isaiah\'s individual messages on the basis of internal criteria alone, is a well-nigh impossible task; and yet no other kind of evidence is available. Often passages stand side by side which point in opposite directions; in fact, certain sections seem to be composed of various fragments dating from different periods, as though prophecies widely separated from each other in time had been fused together. In such cases much weight should be given to those features which point to an early origin, because of the predominatingly predictive character of Isaiah\'s writings.<P>Isaiah always had an eye upon the future. His semi-historical and biographical prophecies are naturally the easiest to date; on the other hand, the form of his Messianic and eschatological discourses is largely due to his own personal temper and psychology, rather than to the historical circumstances of the time. The following is a table of Isaiah\'s prophecies chronologically arranged:<p>Chapters; Written Probably; BC</p><p>1-6...................................c 740-736</p><p>7-12.................................c 734-732</p><p>15:1-16; 12; 17.................c 734</p><p>13:1-14:23...between ..........732-722</p><p>14:24-27......between ..........732-722</p><p>14:28-32...........................c 727</p><p>23.......shortly before...........722</p><p>24-27...shortly before..........722</p><p>28:1-6...shortly before.........722</p><p>19....................................c 720</p><p>38....................................c 714</p><p>29....................................c 712</p><p>21:11,12,13-17.................c 711</p><p>22:15-25...........................c 711</p><p>21:1-10.............................c 709</p><p>22:1-10.............................c 709</p><p>28:7-33:24...shortly before...701</p><p>18.....................................c 701</p><p>34-35................................c 701</p><p>36-37...soon after................701</p><p>40-66...soon after................701</p><P>The prophet\'s standpoint in <span class="noTag">Isa 40-66</span> is that of Isaiah himself. For if Isaiah, before 734 BC, in passages confessedly his own, could describe Judah\'s cities as already "burned with fire," Zion as deserted as "a booth in a vineyard" (<a onClick="return mV(\'Isa\',1,7,8);">1:7,8</A>), Jerusalem as "ruined," Judah as "fallen" (<a onClick="return mV(\'Isa\',3,8);">3:8</A>), and Yahweh\'s people as already "gone into captivity" (<a onClick="return mV(\'Isa\',5,13);">5:13</A>), surely after all the destruction and devastation wrought on Judah by Assyria in the years 722, 720, 711, and 701 BC, the same prophet with the same poetic license could declare that the temple had been "trodden down" (<a onClick="return mV(\'Isa\',63,18);">63:18</A>) and "burned with fire," and all Judah\'s pleasant places "laid waste" (<a onClick="return mV(\'Isa\',64,11);">64:11</A>); and, in perfect keeping with his former promises, could add that "they shall repair the waste cities, the desolations of many generations" (<a onClick="return mV(\'Isa\',61,4);">61:4</A>; compare <a onClick="return mV(\'Isa\',44,26);">44:26</A>; <a onClick="return mV(\'Isa\',58,12);">58:12</A>).<P>Or again, if Isaiah the son of Amoz could comfort Jerusalem with promises of protection when the Assyrian (734 BC) should come like an overflowing river (<a onClick="return mV(\'Isa\',8,9,10);">8:9,10</a>; <a onClick="return mV(\'Isa\',10,24,25);">10:24,25</a>); and conceive a beautiful parable of comfort like that contained in <a onClick="return mV(\'Isa\',28,\'23-29\');">28:23-29</A>; and insert among his warnings and exhortations of the gloomy year 702 BC so many precious promises of a brighter future which was sure to follow Sennacherib\'s invasion (<a onClick="return mV(\'Isa\',19,\'17-24\');">29:17-24</A>; <a onClick="return mV(\'Isa\',30,\'29-33\');">30:29-33</A>; <a onClick="return mV(\'Isa\',31,8,9);">31:8,9</a>); and, in the very midst of the siege of 701 BC, conceive of such marvelous Messianic visions as those in <a onClick="return mV(\'Isa\',33,\'17-24\');">33:17-24</a> with which to dispel the dismay of his compatriots, surely the same prophet might be conceived of as seizing the opportunity to comfort those in Zion who survived the great catastrophe of 701 BC. The prophet who had done the one was prepared to do the other.<P>There was one circumstance of the prophet\'s position after 701 BC which was new, and which is too often overlooked, a circumstance which he could not have employed to anything like the same degree as an argument in enforcing his message prior to the Assyrian\'s overthrow and the deliverance of Jerusalem. It was this: the fulfillment of former predictions as proof of Yahweh\'s deity. From such passages we obtain an idea of the prophet\'s true historical position (<a onClick="return mV(\'Isa\',42,9);">Isa 42:9</a>; <a onClick="return mV(\'Isa\',44,8);">44:8</a>; <a onClick="return mV(\'Isa\',45,21);">45:21</a>; <a onClick="return mV(\'Isa\',46,10);">46:10</a>; <a onClick="return mV(\'Isa\',48,3);">48:3</a>). Old predictions have already been fulfilled (<a onClick="return mV(\'Isa\',6,\'11-13\');">Isa 6:11-13</a>; <a onClick="return mV(\'Isa\',29,8);">29:8</a>; <a onClick="return mV(\'Isa\',30,31);">30:31</a>; <a onClick="return mV(\'Isa\',31,8);">31:8</a>; <a onClick="return mV(\'Isa\',37,7,30);">37:7, 30</a>), on the basis of which the prophet ventures to predict new and even more astounding things concerning the overthrow of Babylon by Cyrus, and Israel\'s deliverance through him from their captors (<a onClick="return mV(\'Isa\',43,6);">Isa 43:6</a>). Isaiah\'s book is signally full of predictions (<a onClick="return mV(\'Isa\',7,8,10);">Isa 7:8, 10</a>ff; <a onClick="return mV(\'Isa\',8,4,8);">8:4,8</A>; <a onClick="return mV(\'Isa\',9,11,12);">9:11,12</A>; <a onClick="return mV(\'Isa\',10,26);">10:26</A>ff; <a onClick="return mV(\'Isa\',14,\'24-27\');">14:24-27</a>; <a onClick="return mV(\'Isa\',16,14);">16:14</a>; <a onClick="return mV(\'Isa\',17,9,12,13,14);">17:9,12-14</A>; <a onClick="return mV(\'Isa\',20,4,5,6);">20:4-6</A>; <a onClick="return mV(\'Isa\',21,16);">21:16</A>; <a onClick="return mV(\'Isa\',22,19);">22:19</A>ff; <a onClick="return mV(\'Isa\',23,15);">23:15</a>; <a onClick="return mV(\'Isa\',38,5);">38:5</A>), some of which, written down and sealed, were evidently committed by the prophet to his inner circle of disciples to be used and verified by them in subsequent crises (<a onClick="return mV(\'Isa\',8,16);">Isa 8:16</a>).Failure to recognize this element in Isaiah\'s book is fatal to a true interpretation of the prophet\'s real message.<P>9. The Critical Problem:<P>"For about twenty-five centuries" as A. B. Davidson observes (Old Testament Prophecy,1903,244), "no one dreamed of doubting that Isaiah the son of Amoz was the author of every part of the book that goes under his name; and those who still maintain the unity of authorship are accustomed to point, with satisfaction, to the unanimity of the Christian church on the matter, till a few German scholars arose, about a century ago, and called in question the unity of this book." Tradition is unanimous in favor of the unity of the book.<P>(1) The History of Criticism.<P>The critical disintegration of the book began with Koppe, who in 1780 first doubted the genuineness of <a onClick="return mV(\'Isa\',50,\'1-\');">Isa 50</a>. Nine years later Doederlein suspected the whole of <span class="noTag">Isa 40-66</span>. He was followed by Rosenmueller, who was the first to deny to Isaiah the prophecy against Babylon in <a onClick="return mV(\'Isa\',13,\'1-\');">13:1</A>-<a onClick="return mV(\'Isa\',14,\'1-23\');">14:23</A>. Eichhorn, at the beginning of the last century, further eliminated the oracle against Tyre in <a onClick="return mV(\'Isa\',23,\'1-\');">Isa 23</a>, and he, with Gesenius and Ewald, also denied the Isaianic origin of <span class="noTag">Isa 24-27</span>. Gesenius also ascribed to some unknown prophet <a onClick="return mV(\'Isa\',15,\'1-\');">Isa 15</a> and <a onClick="return mV(\'Isa\',16,\'1-\');">16</A>. Rosenmueller then went farther, and pronounced against <a onClick="return mV(\'Isa\',34,\'1-\');">Isa 34</a> and <a onClick="return mV(\'Isa\',35,\'1-\');">35</A>, and not long afterward (1840) Ewald questioned <a onClick="return mV(\'Isa\',12,\'1-\');">Isa 12</a> and <a onClick="return mV(\'Isa\',33,\'1-\');">33</A>. Thus by the middle of the 19th century some 37 or 38 chapters were rejected as no part of Isaiah\'s actual writings. In 1879-80, the celebrated Leipzig professor, Franz Delitzsch, who for years previous had defended the genuineness of the entire book, finally yielded to the modern critical position, and in the new edition of his commentary published in 1889, interpreted <span class="noTag">Isa 40-66</span>, though with considerable hesitation, as coming from the close of the period of Babylonian exile. About the same time (1888-90), Drs. Driver and G.A. Smith gave popular impetus to similar views in Great Britain. Since 1890, the criticism of Isaiah has been even more trenchant and microscopic than before. Duhm, Stade, Guthe, Hackmann, Cornill and Marti on the Continent, and Cheyne, Whitehouse, Box, Glazebrook, Kennett, Gray, Peake, and others in Great Britain and America have questioned portions which hitherto were supposed to be genuine.<P>(2) The Disintegration of "Deutero-Isaiah."<P>Even the unity of <span class="noTag">Isa 40-66</span>, which were supposed to be the work of the "Second" or "Deutero-Isaiah," is now given up. What prior to 1890 was supposed to be the unique product of some celebrated but anonymous seer who lived in Babylonia about 550 BC is today commonly divided and subdivided and in large part distributed among various writers from Cyrus to Simon (538-164 BC). At first it was thought sufficient to separate <span class="noTag">sa 63-66</span> as a later addition to "Deutero-Isaiah\'s" prophecies; but more recently it has become the fashion to distinguish between <span class="noTag">Isa 40-55</span>, which are claimed to have been written by "Deutero-Isaiah" in Babylonia about 549-538 BC, and <span class="noTag">Isa 56-66</span>, which are now alleged to have been composed by a "Trito-Isaiah" about 460-445 BC.(3) Recent Views.<P>Among the latest to investigate the problem is Professor R.H. Kennett of Cambridge, English, who, in his Schweich Lectures (The Composition of the Book of Isaiah in the Light of History and Archaeology,1910,84ff), sums up the results of investigations as follows:<P>(a) all of <a onClick="return mV(\'Isa\',3,\'1-\');">Isa 3</a>; <a onClick="return mV(\'Isa\',5,\'1-\');">5</a>; <a onClick="return mV(\'Isa\',6,\'1-\');">6</a>; <a onClick="return mV(\'Isa\',7,\'1-\');">7</a>; <a onClick="return mV(\'Isa\',20,\'1-\');">20</a> and <a onClick="return mV(\'Isa\',31,\'1-\');">31</a>, and large portions of <a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1</a>; <a onClick="return mV(\'Isa\',2,\'1-\');">2</a>; <a onClick="return mV(\'Isa\',4,\'1-\');">4</a>; <a onClick="return mV(\'Isa\',8,\'1-\');">8</a>; <a onClick="return mV(\'Isa\',9,\'1-\');">9</a>; <a onClick="return mV(\'Isa\',10,\'1-\');">10</a>; <a onClick="return mV(\'Isa\',14,\'1-\');">14</a>; <a onClick="return mV(\'Isa\',17,\'1-\');">17</a>; <a onClick="return mV(\'Isa\',22,\'1-\');">22</a> and <a onClick="return mV(\'Isa\',23,\'1-\');">23</A>, may be assigned to Isaiah, the son of Amoz;<P>(b) all of <a onClick="return mV(\'Isa\',13,\'1-\');">Isa 13</a>; <a onClick="return mV(\'Isa\',40,\'1-\');">40</a> and <a onClick="return mV(\'Isa\',47,\'1-\');">47</a>, and large portions of <a onClick="return mV(\'Isa\',14,\'1-\');">Isa 14</a>; <a onClick="return mV(\'Isa\',21,\'1-\');">21</a>; <a onClick="return mV(\'Isa\',41,\'1-\');">41</a>; <a onClick="return mV(\'Isa\',43,\'1-\');">43</a>; <a onClick="return mV(\'Isa\',44,\'1-\');">44</a>; <a onClick="return mV(\'Isa\',45,\'1-\');">45</a>; <a onClick="return mV(\'Isa\',46,\'1-\');">46</a> and <a onClick="return mV(\'Isa\',48,\'1-\');">48</A>, may be assigned to the time of Cyrus;<P>(c) all of <a onClick="return mV(\'Isa\',15,\'1-\');">Isa 15</a>; <a onClick="return mV(\'Isa\',36,\'1-\');">36</a>; <a onClick="return mV(\'Isa\',37,\'1-\');">37</a> and <a onClick="return mV(\'Isa\',39,\'1-\');">39</a>, and portions of <a onClick="return mV(\'Isa\',16,\'1-\');">Isa 16</a> and <a onClick="return mV(\'Isa\',38,\'1-\');">38</A>, may be assigned to the period between Nebuchadnezzar and Alexander the Great, but cannot be dated precisely;<P>(d) the passage <a onClick="return mV(\'Isa\',23,\'1-14\');">23:1-14</A> may be assigned to the time of Alexander the Great;<P>(e) all of <a onClick="return mV(\'Isa\',11,\'1-\');">Isa 11</a>; <a onClick="return mV(\'Isa\',12,\'1-\');">12</a>; <a onClick="return mV(\'Isa\',19,\'1-\');">19</a>; <span class="noTag">24-27</span>; <a onClick="return mV(\'Isa\',29,\'1-\');">29</a>; <a onClick="return mV(\'Isa\',30,\'1-\');">30</a>; <span class="noTag">32-35</span>; <a onClick="return mV(\'Isa\',42,\'1-\');">42</a>; <span class="noTag">49-66</span>; and portions of <a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1</a>; <a onClick="return mV(\'Isa\',2,\'1-\');">2</a>; <a onClick="return mV(\'Isa\',4,\'1-\');">4</a>; <a onClick="return mV(\'Isa\',8,\'1-\');">8</a>; <a onClick="return mV(\'Isa\',9,\'1-\');">9</a>; <a onClick="return mV(\'Isa\',10,\'1-\');">10</a>; <a onClick="return mV(\'Isa\',16,\'1-\');">16</a>; <a onClick="return mV(\'Isa\',17,\'1-\');">17</a>; <a onClick="return mV(\'Isa\',18,\'1-\');">18</a>; <a onClick="return mV(\'Isa\',23,\'1-\');">23</a>; <a onClick="return mV(\'Isa\',41,\'1-\');">41</a>; <a onClick="return mV(\'Isa\',44,\'1-\');">44</a>; <a onClick="return mV(\'Isa\',45,\'1-\');">45</a>; <a onClick="return mV(\'Isa\',48,\'1-\');">48</a> may be assigned to the 2nd century BC (167-140 BC).<P>Professor C. F. Kent, also (Sermons, Epistles, and Apocalypses of Israel\'s Prophets, 1910, 27ff), makes the following critical observations on <span class="noTag">Isa 40-66</span>. He says: "The prophecies of Haggai and Zechariah ...afford by far the best approach for the study of the difficult problems presented by <span class="noTag">Isa 40-66</span>. <span class="noTag">Isaiah 56-66</span> are generally recognized as post-exilic. ...In <a onClick="return mV(\'Isa\',56,\'1-\');">Isa 56</a> and the following chapters there are repeated references to the temple and its service, indicating that it had already been restored. Moreover, these references are not confined to the latter part of the book. ...The fact, on the one hand, that there are few, if any, allusions to contemporary events in these chapters, and on the other hand, that little or nothing is known of the condition and hopes of the Jews during this period (the closing years of the Babylonian exile) makes the dating of these prophecies possible, although far from certain. ...Also, the assumption that the author of these chapters lived in the Babylonian exile is not supported by a close examination of the prophecies themselves. Possibly their author was one of the few who, like Zerubbabel, had been born in Babylon and later returned to Palestine. He was also dealing with such broad and universal problems that he gives few indications of his date and place of abode; but all the evidence that is found points to Jerusalem as the place where he lived and wrote. ...The prophet\'s interest and point of view center throughout in Jerusalem, and he shows himself far more familiar with conditions in Palestine than in distant Babylon. Most of his illustrations are drawn from the agricultural life of Palestine. His vocabulary is also that of a man dwelling in Palestine, and in this respect is in marked contrast with the synonyms employed by Ezekiel, the prophet of the Babylonian exile."<P>That is to say, two of the most recent investigators of the Book of Isaiah reach conclusions quite at variance with the opinions advocated in 1890, when Delitzsch so reluctantly allowed that <span class="noTag">Isa 40-66</span> may have sprung from the period of Babylonian exile. Now, it is found that these last 27 chapters were written after the exile, most probably in Palestine, rather than in Babylonia as originally claimed, and are no longer considered addressed primarily to the suffering exiles in captivity as was formerly urged.<P>(4) The Present State of the Question.<P>The present state of the Isaiah question is, to say the least, confusing. Those who deny the integrity of the book may be divided into two groups, which we may call moderates and radicals. Among the moderates may be included Drs. Driver, G.A. Smith, Skinner, Kirkpatrick, Koenig, A.B. Davidson, Barnes and Whitehouse. These all practically agree that the following chapters and verses are not Isaiah\'s: <a onClick="return mV(\'Isa\',11,\'10-16\');">11:10-16</A>; <a onClick="return mV(\'Isa\',12,\'1-\');">12</A>; <a onClick="return mV(\'Isa\',13,\'1-\');">13:1</a>-<a onClick="return mV(\'Isa\',14,\'1-23\');">14:23</A>; <a onClick="return mV(\'Isa\',15,\'1-\');">15:1</A>-<a onClick="return mV(\'Isa\',16,\'1-12\');">16:12</a>; <a onClick="return mV(\'Isa\',21,\'1-10\');">21:1-10</a>; <a onClick="return mV(\'Isa\',24,\'1-\');">24-27</a>; <a onClick="return mV(\'Isa\',34,\'1-\');">34</A>-<a onClick="return mV(\'Isa\',35,\'1-\');">35</a>; <a onClick="return mV(\'Isa\',36,\'1-\');">36-39</a>; <a onClick="return mV(\'Isa\',40,\'1-\');">40-66</a>. That is to say, some 44 chapters out of the whole number, 66, were not written by Isaiah; or, approximately 800 out of 1,292 verses are not genuine. Among the radicals are Drs. Cheyne, Duhm, Hackmann, Guthe, Marti, Kennett and Gray. These all reject approximately 1,030 verses out of the total 1,292, retaining the following only as the genuine product of Isaiah and his age: <a onClick="return mV(\'Isa\',1,\'2-26\');">1:2-26</A>; <a onClick="return mV(\'Isa\',29,\'1-\');">29-31</a>; <a onClick="return mV(\'Isa\',2,\'6-19\');">2:6-19</A>; <a onClick="return mV(\'Isa\',3,1,5,8,9,\'12-17\');">3:1, 5, 8, 9, 12-17</a>; <a onClick="return mV(\'Isa\',4,1);">4:1</a>; <a onClick="return mV(\'Isa\',5,\'1-14\',\'17-29\');">5:1-14,17-29</a>; <a onClick="return mV(\'Isa\',6,\'1-\');">6</a>; <a onClick="return mV(\'Isa\',7,\'1-8\',22);">7:1-8, 22</a>; <a onClick="return mV(\'Isa\',9,\'8-\');">9:8</a>-<a onClick="return mV(\'Isa\',10,\'1-9\');">10:9</a>; <a onClick="return mV(\'Isa\',10,13,14,\'27-32\');">10:13,14, 27-32</A>; <a onClick="return mV(\'Isa\',17,\'1-14\');">17:1-14</a>; <a onClick="return mV(\'Isa\',18,\'1-\');">18</a>; <a onClick="return mV(\'Isa\',20,\'1-\');">20</A>; <a onClick="return mV(\'Isa\',22,\'1-22\');">22:1-22</A>; <a onClick="return mV(\'Isa\',28,\'1-4\',\'7-22\');">28:1-4, 7-22</a>; <a onClick="return mV(\'Isa\',29,\'1-6\',9,10,13,14,15);">29:1-6,9,10,13-15</a>; <a onClick="return mV(\'Isa\',30,\'1-17\');">30:1-17</a>; <a onClick="return mV(\'Isa\',31,\'1-4\');">31:1-4</A>. That is, only about 262 verses out of the total 1,292 are allowed to be genuine. This is, we believe, a fair statement of the Isaiah-question as it exists in the hands of divisive critics today.<P>On the other hand there have been those who have defended and who still defend the essential unity of Isaiah\'s entire book, e.g. Strachey (1874), Nagelsbach (1877), Bredenkamp (1887), Douglas (1895), W.H. Cobb (1883-1908), W.H. Green (1892), Vos (1898-99), Thirtle (1907), Margoliouth (1910) and O.T. Allis (1912).<P>(5) Reasons for Dissecting the Book.<P>The fundamental axiom of criticism is the dictum that a prophet always spoke out of a definite historical situation to the present needs of the people among whom he lived, and that a definite historical situation shall be pointed out for each prophecy. This fundamental postulate, which on the whole is reasonable and perfectly legitimate if not overworked, underlies all modern criticism of Old Testament prophecy. It is not possible, however, always to trace a mere snatch of sermonic discourse to a definite historical situation apart from its context. Moreover, the prophets often spoke consciously, not only to their own generation, but also to the generations to come. Isaiah in particular commanded, "Bind thou up the testimony, seal the law among my disciples" (<a onClick="return mV(\'Isa\',8,16);">8:16</A>); that is, preserve my teachings for the future. Again in <a onClick="return mV(\'Isa\',30,8);">30:8</a>, he says, "Now go, ...inscribe it in a book, that it may be for the time to come for ever and ever." And also in <a onClick="return mV(\'Isa\',42,23);">42:23</a>, "Who is there among you that will give ear to this? that will hearken and hear for the time to come?"<P>Certain false presuppositions often govern critics in their disintegration of the book. Only a few examples need be given by way of illustration:<P>(a) According to some, "the conversion of the heathen" lay quite beyond the horizon of any 8th-century prophet; consequently, <a onClick="return mV(\'Isa\',2,\'2-4\');">Isa 2:2-4</a> and all similar passages which foretell the conversion of those outside the chosen people are to be relegated to an age subsequent to Isaiah.<P>(b) To others, "the picture of universal peace" in <a onClick="return mV(\'Isa\',11,\'1-9\');">Isa 11:1-9</a> is a symptom of late date, and therefore this section and all kindred ones must be deleted.<P>(c) To others, the thought of "universal judgment" upon "the whole earth" in <a onClick="return mV(\'Isa\',14,26);">14:26</A> and elsewhere quite transcends Isaiah\'s range of thought.<P>(d) To others still, the apocalyptic character of <a onClick="return mV(\'Isa\',24,\'1-\');">Isa 24-27</a> represents a phase of Hebrew thought which prevailed in Israel only after Ezekiel.<P>(e) Even to those who are considered moderates "the poetic character" of a passage like <a onClick="return mV(\'Isa\',12,\'1-\');">Isa 12</a>, and the references to a "return" from captivity, as in <a onClick="return mV(\'Isa\',11,\'11-16\');">11:11-16</a>, and the promises and consolations such as are found in <a onClick="return mV(\'Isa\',33,\'1-\');">Isa 33</a> are cited as grounds for assigning these and similar passages to a much later age. Radicals deny in toto the existence of all Messianic passages among Isaiah\'s own predictions, relegating all Messianic hope to a much later age.<P>But to deny to the Isaiah of the 8th century all catholicity of grace, all universalism of salvation or judgment, every highly developed Messianic ideal, every rich note of promise and comfort, all sublime faith in the sacrosanct character of Zion, as some do, is unwarrantably to create a new Isaiah of greatly reduced proportions, a mere preacher of righteousness, a statesman of not very optimistic vein, and the exponent of a cold ethical religion without the warmth and glow of the messages which are actually ascribed to the prophet of the 8th century.<P>As a last resort, certain critics have appealed to <a onClick="return mV(\'2Ch\',36,22,23);">2Ch 36:22-23</a> as external evidence that <span class="noTag">Isa 40-66</span> existed as a separate collection in the Chronicler\'s age. But the evidence obtained from this source is so doubtful that it is well-nigh valueless. For it is not the prediction of Isaiah concerning Cyrus to which the Chronicler points as Jeremiah\'s, but the "70 years" of Babylonian supremacy spoken of in <a onClick="return mV(\'2Ch\',36,21);">2Ch 36:21</a>, which Jeremiah actually did predict (compare <a onClick="return mV(\'Jer\',25,11);">Jer 25:11</a>; <a onClick="return mV(\'Jer\',29,10);">29:10</a>). On the other hand, <span class="noTag">Isa 40-66</span> were certainly ascribed to Isaiah as early as 180 BC, for Jesus Ben-Sirach, the author of Ecclesiasticus, speaks of Isaiah as the prophet who "saw by an excellent spirit that which should come to pass at the last, and comforted them that mourned in Zion" (Ecclesiasticus 48:20ff; compare <a onClick="return mV(\'Isa\',40,1);">Isa 40:1</a>ff). Furthermore, there is absolutely no proof that <span class="noTag">Isa 1-39</span>, or <span class="noTag">Isa 40-66</span>, or any other section of Isaiah\'s prophecies ever existed by themselves as an independent collection; nor is there any substantial ground for supposing that the promissory and Messianic portions have been systematically interpolated by editors long subsequent to Isaiah\'s own time. The earlier prophets presumably did more than merely threaten.<P>(6) Arguments for One Isaiah.<P>It is as unreasonable to expect to be able to prove the unity of Isaiah as to suppose that it has been disproved. Internal evidence is indecisive in either case. There are arguments, however, which corroborate a belief that there was but one Isaiah. Here are some of those which might be introduced:<P>(a) The Circle of Ideas:<P>The circle of ideas, which are strikingly the same throughout the entire book: For example, take the characteristic name for God, which is almost peculiar to Isaiah, "the Holy One of Israel." This title for Yahweh occurs in the Book of Isaiah a total of 25 times, and only 6 times elsewhere in the Old Testament, one of which is a parallel passage in Kings. This unique epithet, "the Holy One of Israel," interlocks all the various portions with one another and stamps them with the personal imprimatur of him who saw the vision of the majestic God seated upon His throne, high and lifted up, and heard the angelic choirs singing: "Holy, holy, holy, is Yahweh of hosts: the whole earth is full of his glory" (<a onClick="return mV(\'Isa\',6,3);">6:3</A>). The presence of this Divine title in all the different sections of the book is of more value in identifying Isaiah as the author of all these prophecies than though his name had been inserted at the beginning of every chapter, for the reason that his theology—his conception of God as the Holy One—is woven into the very fiber and texture of the whole book. It occurs 12 times in <span class="noTag">Isa 1-39</span>, and 13 times in <span class="noTag">Isa 40-66</span>; and it is simply unscientific to say that the various alleged authors of the disputed portions all employed the same title through imitation (compare <a onClick="return mV(\'Isa\',1,4);">1:4</a>; <a onClick="return mV(\'Isa\',5,19,24);">5:19, 24</a>; <a onClick="return mV(\'Isa\',10,20);">10:20</a>; <a onClick="return mV(\'Isa\',12,6);">12:6</A>; <a onClick="return mV(\'Isa\',17,7);">17:7</a>; <a onClick="return mV(\'Isa\',29,19);">29:19</a>; <a onClick="return mV(\'Isa\',30,11,12,15);">30:11, 12, 15</A>; <a onClick="return mV(\'Isa\',31,1);">31:1</A>; <a onClick="return mV(\'Isa\',37,23);">37:23</A>; also <a onClick="return mV(\'Isa\',41,14,16,20);">41:14, 16, 20</a>; <a onClick="return mV(\'Isa\',43,3,14);">43:3, 14</a>; <a onClick="return mV(\'Isa\',45,11);">45:11</a>; <a onClick="return mV(\'Isa\',47,4);">47:4</a>; <a onClick="return mV(\'Isa\',48,17);">48:17</a>; <a onClick="return mV(\'Isa\',49,7);">49:7</a>; <a onClick="return mV(\'Isa\',54,5);">54:5</a>; <a onClick="return mV(\'Isa\',55,5);">55:5</a>; <a onClick="return mV(\'Isa\',60,9,14);">60:9,14</a>; elsewhere, only in <a onClick="return mV(\'2Ki\',19,22);">2Ki 19:22</a>; <a onClick="return mV(\'Psa\',71,22);">Ps 71:22</a>; <a onClick="return mV(\'Psa\',78,41);">78:41</a>; <a onClick="return mV(\'Psa\',89,18);">89:18</a>; <a onClick="return mV(\'Jer\',50,29);">Jer 50:29</a>; <a onClick="return mV(\'Jer\',51,5);">51:5</a>).<P>Another unique idea which occurs with considerable repetition in the Book of Isaiah is the thought of a "highway" (compare <a onClick="return mV(\'Isa\',11,16);">11:16</a>; <a onClick="return mV(\'Isa\',35,8);">35:8</a>; <a onClick="return mV(\'Isa\',40,3);">40:3</a>; <a onClick="return mV(\'Isa\',43,19);">43:19</a>; <a onClick="return mV(\'Isa\',49,11);">49:11</a>; <a onClick="return mV(\'Isa\',57,14);">57:14</a>; <a onClick="return mV(\'Isa\',62,10);">62:10</a>). Another characteristic idea is that of a "remnant" (compare <a onClick="return mV(\'Isa\',1,9);">1:9</a>; <a onClick="return mV(\'Isa\',10,20,21,22);">10:20, 21, 22</a>; <a onClick="return mV(\'Isa\',11,11,16);">11:11,16</a>; <a onClick="return mV(\'Isa\',14,22,30);">14:22, 30</a>; <a onClick="return mV(\'Isa\',15,9);">15:9</a>; <a onClick="return mV(\'Isa\',16,14);">16:14</a> <a onClick="return mV(\'Isa\',17,3);">17:3</a>; <a onClick="return mV(\'Isa\',21,7);">21:17</a>; <a onClick="return mV(\'Isa\',28,5);">28:5</a>; <a onClick="return mV(\'Isa\',37,31);">37:31</a>; <a onClick="return mV(\'Isa\',46,3);">46:3</a>; compare <a onClick="return mV(\'Isa\',65,8,9);">65:8,9</A>). Another striking trait of the book is the position occupied by "Zion" in the prophet\'s thoughts (compare <a onClick="return mV(\'Isa\',2,3);">2:3</a>; <a onClick="return mV(\'Isa\',4,5);">4:5</a>; <a onClick="return mV(\'Isa\',18,7);">18:7</a>; <a onClick="return mV(\'Isa\',24,23);">24:23</a>; <a onClick="return mV(\'Isa\',28,16);">28:16</a>; <a onClick="return mV(\'Isa\',29,8);">29:8</a>; <a onClick="return mV(\'Isa\',30,19);">30:19</a>; <a onClick="return mV(\'Isa\',31,9);">31:9</a>; <a onClick="return mV(\'Isa\',33,5,20;">33:5,20</a>; <a onClick="return mV(\'Isa\',34,8);">34:8<a/>; <a onClick="return mV(\'Isa\',46,13);">46:13</a>; <a onClick="return mV(\'Isa\',49,14);">49:14</a>; <a onClick="return mV(\'Isa\',51,3,16);">51:3,16</a>; <a onClick="return mV(\'Isa\',52,1);">52:1</a>; <a onClick="return mV(\'Isa\',59,20);">59:20</a>; <a onClick="return mV(\'Isa\',60,14);">60:14</a>; <a onClick="return mV(\'Isa\',62,1,11);">62:1, 11</a>; <a onClick="return mV(\'Isa\',66,8);">66:8</a>). Still another is the oft-repeated expression, "pangs of a woman in travail" (compare <a onClick="return mV(\'Isa\',13,8);">13:8</a>; <a onClick="return mV(\'Isa\',21,3);">21:3</a>; <a onClick="return mV(\'Isa\',26,17,18);">26:17,18</a>; <a onClick="return mV(\'Isa\',42,14);">42:14</a>; <a onClick="return mV(\'Isa\',54,1);">54:1</a>; <a onClick="return mV(\'Isa\',66,7);">66:7</a>). These, and many others less distinctive, psychologically stamp the book with an individuality which it is difficult to account for, if it be broken up into countless fragments and distributed, as some do, over the centuries.<P>(b) The Literary Style:<P>As negative evidence, literary style is not a very safe argument; for, as Professor McCurdy says, "In the case of a writer of Isaiah\'s environments, style is not a sure criterion of authorship" (History, Prophecy and the Monuments, II, 317,note). Yet it is certainly remarkable that the clause "for the mouth of Yahweh hath spoken it" should be found 3 times in the Book of Isaiah, and nowhere else in the Old Testament (compare <a onClick="return mV(\'Isa\',1,20);">1:20</a>; <a onClick="return mV(\'Isa\',40,5);">40:5</a>; <a onClick="return mV(\'Isa\',58,14);">58:14</a>). And it is noteworthy that the phrase, "streams of water," should occur twice in Isaiah and nowhere else (compare <a onClick="return mV(\'Isa\',30,25);">30:25</a>; <a onClick="return mV(\'Isa\',44,4);">44:4</a> in the Hebrew). And very peculiar is the tendency on the prophet\'s part to emphatic reduplication (compare <a onClick="return mV(\'Isa\',2,7,8);">2:7,8</a>; <a onClick="return mV(\'Isa\',6,3);">6:3</a>; <a onClick="return mV(\'Isa\',8,9);">8:9</a>; <a onClick="return mV(\'Isa\',24,16,23);">24:16, 23</a>; <a onClick="return mV(\'Isa\',40,1);">40:1</a>; <a onClick="return mV(\'Isa\',43,11,25);">43:11,25</a>; <a onClick="return mV(\'Isa\',48,15);">48:15</a>; <a onClick="return mV(\'Isa\',51,12);">51:12</a>; <a onClick="return mV(\'Isa\',57,19);">57:19</a>; <a onClick="return mV(\'Isa\',62,10);">62:10</a>). In fact, it is not extravagant to say that Isaiah\'s style differs widely from that of every other Old Testament prophet, and is as far removed as possible from that of Ezekiel and the post-exilic prophets. <P>(c) Historical References:<P>Take, for example, first, the prophet\'s constant reference to Judah and Jerusalem, his country and its capital (<a onClick="return mV(\'Isa\',1,\'7-9\');">Isa 1:7-9</a>; <a onClick="return mV(\'Isa\',3,8);">3:8</a>; <a onClick="return mV(\'Isa\',24,19);">24:19</a>; <a onClick="return mV(\'Isa\',25,2);">25:2</a>; <a onClick="return mV(\'Isa\',40,2,9);">40:2, 9</a>; <a onClick="return mV(\'Isa\',62,4);">62:4</a>); likewise, to the temple and its ritual of worship and sacrifice. In <a onClick="return mV(\'Isa\',1,\'11-15\');">Isa 1:11-15</a>, when all was prosperous, the prophet complained that the people were profuse and formal in their ceremonies and sacrifices; in <a onClick="return mV(\'Isa\',43,23,24);">43:23-24</a>, on the contrary, when the country had been overrun by the Assyrian and Sennacherib had besieged the city, the prophet reminds them that they had not brought to Yahweh the sheep of their burnt offerings, nor honored Him with their sacrifices; while in <a onClick="return mV(\'Isa\',66,1,2,3,6,20);">66:1-3,6,20</a>, not only is the existence of the Temple and the observance of the ritual presupposed, but those are sentenced who place their trust in the material temple, and the outward ceremonials of temple-worship. As for the "exile," the prophet\'s attitude to it throughout is that of both anticipation and realization. Thus, in <a onClick="return mV(\'Isa\',57,1);">57:1</a>, judgment is only threatened, not yet inflicted: "The righteous is taken away from the evil to come." That is to say, the exile is described as still future. On the other hand, in <a onClick="return mV(\'Isa\',3,8);">3:8</a>, "Jerusalem is ruined, and Judah is fallen," which seems to describe the exile as in the past; yet, as everybody admits, these are the words of Isaiah of the 8th century. In <a onClick="return mV(\'Isa\',11,11,12);">11:11,12</a>, the prophet says, "The Lord will set his hand again the second time to recover the remnant of his people. ...from the four corners of the earth." To interpret such a statement literally and mechanically without regard to 8th-century conditions, or to Isaiah\'s manifest attitude to the exile, leads to confusion. No prophet realized so keenly or described so vividly the destiny of the Hebrews.<P>(d) The Predictive Element:<P>This is the strongest proof of the unity of the Book of Isaiah. Prediction is the very essence of prophecy (compare <a onClick="return mV(\'Deu\',18,22);">De 18:22</a>); Isaiah was preeminently a prophet of the future. With unparalleled suddenness, he repeatedly leaps from despair to hope, from threat to promise, and from the actual to the ideal. What Professor Kent says of "Deutero-Isaiah" may with equal justice be said of Isaiah himself: "While in touch with his own age, the great unknown prophet lives in the atmosphere of the past and the future" (Sermons, Epistles, and Apocalypses of Israel\'s Prophets, 28). Isaiah spoke to his own age, but he also addressed himself to the ages to follow. His verb tenses are characteristically futures and prophetic perfects. Of his book A.B. Davidson\'s words are particularly true: "If any prophetic book be examined ...it will appear that the ethical and religious teaching is always secondary, and that the essential thing in the book or discourse is the prophet\'s outlook into the future" (HDB, article "Prophecy and Prophets," IV, 119).<P>Isaiah was exceptionally given to predicting: thus (a) before the Syro-Ephraimitic war (734 BC), he predicted that within 65 years Ephraim should be broken to pieces (<a onClick="return mV(\'Isa\',7,8);">7:8</a>); and that before the child Maher-shalal-hash-baz should have knowledge to cry, "My father," or "My mother," the riches of Damascus and the spoil of Samaria should be carried away (<a onClick="return mV(\'Isa\',8,4);">8:4</a>; compare <a onClick="return mV(\'Isa\',7,16);">7:16</a>). These are, however, but two of numerous predictions, as shown above, among his earlier prophecies (compare <a onClick="return mV(\'Isa\',1,27,28);">1:27,28</a>; <a onClick="return mV(\'Isa\',2,2,3,4);">2:2-4</a>; <a onClick="return mV(\'Isa\',6,13);">6:13</a>; <a onClick="return mV(\'Isa\',10,\'20-23\');">10:20-23</a>; <a onClick="return mV(\'Isa\',11,\'6-16\');">11:6-16</a>; <a onClick="return mV(\'Isa\',17,14);">17:14</a>).<P>(i) Shortly before the downfall of Samaria in 722 BC, Isaiah predicted that Tyre should be forgotten 70 years, and that after the end of 70 years her merchandise should be holiness to Yahweh (<a onClick="return mV(\'Isa\',23,15,18);">23:15,18</a>).<P>(ii) In like manner prior to the siege of Ashdod in 711 BC, he proclaimed that within 3 years Moab should be brought into contempt (<a onClick="return mV(\'Isa\',16,14);">Isa 16:14</a>), and that within a year all the glory of Kedar should fail (<a onClick="return mV(\'Isa\',21,16);">Isa 21:16</a>).<P>(iii) And not long prior to the siege of Jerusalem by Sennacherib in 701 BC, he predicted that in an instant, suddenly, a multitude of Jerusalem\'s foes should be as dust (<a onClick="return mV(\'Isa\',29,5);">Isa 29:5</a>); that yet a very little while and Lebanon should be turned into a fruitful field (<a onClick="return mV(\'Isa\',29,17);">Isa 29:17</a>); and that Assyria should be dismayed and fall by the sword, but not of men (<a onClick="return mV(\'Isa\',30,17,31);">Isa 30:17, 31</a>; <a onClick="return mV(\'Isa\',31,8);">31:8</a>). And more, that for days beyond a year, the careless women of Jerusalem should be troubled (<a onClick="return mV(\'Isa\',32,10,\'16-20\');">Isa 32:10, 16-20</a>); and that the righteous in Zion should see Jerusalem a quiet habitation, and return and come with singing (<a onClick="return mV(\'Isa\',33,17);">Isa 33:17</a>ff; <a onClick="return mV(\'Isa\',35,4,10);">35:4,10</A>); but that Sennacherib, on the contrary, should hear tidings and return without shooting an arrow into the city (<a onClick="return mV(\'Isa\',37,7,\'26-29\',\'33-35\');">Isa 37:7, 26-29, 33-35</a>).<P>In like manner, also, after the siege of Jerusalem by Sennacherib in 701 BC was over, the prophet seems to have continued to predict; and, in order to demonstrate to the suffering and unbelieving remnant about him the deity of Yahweh and the folly of idolatry, pointed to the predictions which he had already made in the earlier years of his ministry, and to the fact that they had been fulfilled. Thus, he says, "Who hath declared it from the beginning, that we may know? and beforetime, that we may say, He is right?" (<a onClick="return mV(\'Isa\',41,\'21-23\',26);">Isa 41:21-23, 26</a>); "Behold, the former things are come to pass, and new things do I declare; before they spring forth I tell you of them" (<a onClick="return mV(\'Isa\',42,9,23);">Isa 42:9, 23</a>); "Who among them can declare this, and show us former things (i.e. things to come in the immediate future)? ...I have declared, and I have saved, and I have showed" (<a onClick="return mV(\'Isa\',43,9,12);">Isa 43:9,12</a>); "Who, as I, shall call, and shall declare it ....? And the things that are coming, and that shall come to pass, let them (the idols) declare. ...Have I not declared unto thee of old, and showed it? And ye are my witnesses. ...That saith of Cyrus, He is my shepherd, and shall perform all my pleasure, even saying of Jerusalem, She shall be built; and of the temple, Thy foundation shall be laid" (<a onClick="return mV(\'Isa\',44,7,8,27,28);">Isa 44:7-8, 27-28</a>); "It is I, Yahweh, who call thee by thy name, even the God of Israel. ...I have called thee by thy name: I have surnamed thee, though thou hast not known me. ...Ask me of the things that are to come. ...I have raised him (Cyrus) up in righteousness, and ...he shall build my city, and he shall let my exiles go free" (<a onClick="return mV(\'Isa\',45,3,4,11,13);">45:3,4,11,13</a>); "Declaring the end from the beginning, and from ancient times things that are not yet done; ...calling a ravenous bird (Cyrus) from the east, the man of my counsel from a far country; yea, I have spoken, I will also bring it to pass" (<a onClick="return mV(\'Isa\',46,10,11);">Isa 46:10-11</a>); "I have declared the former things from of old, ...and I showed them: suddenly I did them, and they came to pass. ...I have declared it ...from of old; before it came to pass I showed it thee; lest thou shouldest say, Mine idol hath done them" (<a onClick="return mV(\'Isa\',48,3,5);">Isa 48:3, 5</a>); "I have showed thee new things from<P>this time, even hidden things. ...Yea, from of old thine ear was not opened. ...Who among them hath declared these things? ...I, even I, have spoken; yea, I have called him; ...from the beginning I have not spoken in secret" (<a onClick="return mV(\'Isa\',48,\'6-8\',\'14-16\');">Isa 48:6-8, 14-16</a>). Such predictions are explicit and emphatic.<P>(e) Cyrus a Subject of Prediction:<P>From all the above-mentioned explicit and oft-repeated predictions one thing is obvious, namely, that great emphasis is laid by the prophet on prediction throughout the entire Book of Isaiah. And it must be further allowed that "Cyrus" is represented by the author as predicted, from any point of view. The only question is, Does the prophet emphasize the fact that he himself is predicting the coming of Cyrus? or that former predictions concerning Cyrus are now, as the prophet writes, coming to pass before his readers\' eyes? Canon Cheyne\'s remark upon this point is instructive. He says: "The editor, who doubtless held the later Jewish theory of prophecy, may have inferred from a number of passages, especially <a onClick="return mV(\'Isa\',41,26);">Isa 41:26</a>; <a onClick="return mV(\'Isa\',48,3,6,14);">48:3, 6, 14</a>, that the first appearance of Cyrus had been predicted by an ancient prophet, and observing certain Isaianic elements in the phraseology of these chapters, may have identified the prophet with Isaiah" (Introduction to the Book of Isaiah, 238).<P>Dr. G.A. Smith likewise allows that Cyrus is the fulfillment of former predictions.<P>He says: "Nor is it possible to argue, as some have tried to do, that the prophet is predicting these things as if they had already happened. For as part of argument for the unique divinity of the God of Israel, Cyrus, \'alive and irresistible,\' and already accredited with success, is pointed out as the unmistakable proof that former prophecies of a deliverance for Israel are already coming to pass. Cyrus, in short, is not presented as a prediction, but as a proof that a prediction is being fulfilled" (HDB, article "Isaiah," 493). And further he says: "The chief claim, therefore, which <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40</a>ff make for the God of Israel is His power to direct the history of the world in conformity to a long-predicted and faithfully followed purpose. This claim starts from the proof that Yahweh has long before predicted events now happening or about to happen, with Cyrus as their center. But this is much more than a proof of isolated predictions, though these imply omniscience. It is a declaration of the unity of history sweeping to the high ends which have been already revealed to Israel—an exposition, in short, of the Omnipotence, Consistence, and Faithfulness of the Providence of the One True God" (ibid., 496).<P>It is obvious, therefore, in any case, whether these chapters are early or late, that Cyrus is the subject of prediction. It really makes little difference at which end of history one takes his stand, whether in the 8th century BC with Isaiah, or in the 6th century BC with "Deutero-Isaiah." Cyrus, to the author of these chapters, is the subject of prediction. In other words, whether indeed the author is really predicting Cyrus in advance of all apparent fulfillment, or Cyrus is the fulfillment of some ancient prediction by another, does not alter the fact that Cyrus was the subject of prediction on the part of somebody. Accordingly, as was stated at the outset, the whole question is, which does the prophet emphasize, (a) the fact that he himself is predicting? or, (b) that former predictions by someone else are now before his eyes coming to pass? The truth is, the prophet seems to live in the atmosphere of the past and the future as well as in the present, all of which are equally vivid to his prophetic mind. This is a peculiar characteristic of Isaiah. It is seen in the account he gives of his inaugural vision (<a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>), of which Delitzsch remarks that it is "like a prediction in the process of being fulfilled." The same is true of <span class="noTag">Isa 24-27</span>. There the prophet repeatedly projects himself into the future, and speaks from the standpoint of the fulfillment of his predictions. It is especially true of <span class="noTag">Isa 40-48</span>. At one time the prophet emphasizes the fact that he is predicting, and a little later he describes his predictions as coming to pass. When, accordingly, a decision is made as to when the author predicted Cyrus, it is more natural to suppose that he was doing so long before Cyrus\' actual appearance. This, in fact, is in keeping with the test of true prophecy contained in <a onClick="return mV(\'Deu\',18,22);">De 18:22</a>: "When a prophet speaketh in the name of Yahweh, if the thing follow not, nor come to pass, that is the thing which Yahweh hath not spoken; the prophet hath spoken it presumptuously, thou shalt not be afraid of him." Besides, there is a similar explicit prediction in the Old Testament, namely, that of King Josiah, who was foretold by name two centuries before he came (<a onClick="return mV(\'1Ki\',13,2);">1Ki 13:2</a>; compare <a onClick="return mV(\'2Ki\',23,15,16);">2Ki 23:15-16</a>).<P>Dr. W. H. Cobb in the Journal of Biblical Literature and Exegesis,1901,79, pleads for a "shrinkage of Cyrus," because Cyrus figures only in <span class="noTag">Isa 40-48</span>, and is then dismissed. Dr. Thirtle, on the other hand, argues that the name "Cyrus" is a mere appellative, being originally not Koresh (Cyrus), but choresh ("workman," "artificer," "imagebreaker"), and that <a onClick="return mV(\'Isa\',44,27,28);">44:27,28</a> is a gloss (compare Old Testament Problems, 244-64). But in opposition to these views the present writer prefers to write Cyrus large, and to allow frankly that he is the subject of extraordinary prediction. For the very point of the author\'s argument is, that he is predicting events which Yahweh alone is capable of foretelling or bringing to pass; in other words, that prescience is the proof of Yahweh\'s Deity. Isaiah lived in an age when Yahweh\'s secrets were first revealed privately unto His servants the prophets (compare <a onClick="return mV(\'Amo\',3,7);">Am 3:7</a>). Political conditions were unsettled and kaleidoscopic, and there was every incentive to predict. That Isaiah actually uttered wonderful predictions. is attested, furthermore, both by Jesus Ben-Sirach in Ecclesiasticus 48:20-25 (written circa 180 BC), and by Josephus in his Ant, XI, i,1,2 (dating from circa 100 AD); and these are ancient traditions worthy of credence.<P>Recently, Mr. Oswald T. Allis, after a thorough and exhaustive critical investigation of "the numerico-climactic structure" of the poem in <a onClick="return mV(\'Isa\',44,\'24-28\');">Isa 44:24-28</a>, concludes that "the most striking and significant features of the poem favor the view that while the utterance was significant in and of itself, it was chiefly significant in view of the exceptional circumstance under which it was spoken, i.e. in view of its early date. The chronological arrangement of the poem assigns the Restoration and Cyrus to the future. The perspective of the poem, together with the abrupt change of person in the 2nd strophe, argues that the future is a remote future. And finally the carefully constructed double climax attaches a significance to the definiteness of the utterance which is most easily accounted for if this future was so remote that a definite disclosure concerning it would be of extraordinary importance." And he further alleges that "it is impossible, if justice is done to the plain declarations of Scripture, to limit the prophetic horizon of the prophet Isaiah to the preexilic period and that ...when the form of the poem is recognized, there is every reason to assign it to a pre-exilic prophet, to Isaiah, since the form of the poem is admirably calculated to emphasize the fact that Cyrus and the Restoration belong to a distant future, and to make it clear that it is just because of this fact that the definitehess of the prophecy, the mention of Cyrus by name, is so remarkable and of such unique significance" (Biblical and Theological Studies, by the members of the Faculty of Princeton Theological Seminary, Centennial Volume, 1912, 628-29).<P>After all, why should men object to prediction on so large a scale? Unless there is definiteness about any given prediction, and unless it transcends ordinary prognostication, there is no especial value in it. Should it be objected, however, that prediction of so minute a character is "abhorrent to reason," the answer is already at hand; it may be abhorrent to reason, but it is a handmaid to faith. Faith has to do with the future, even as prediction has to do with the future; and the Old Testament is preeminently a book which encourages faith. There is really no valid objection to the prediction of Cyrus. For the one outstanding differentiating characteristic of Israel\'s religion is predictive prophecy. The Hebrews certainly predicted the coming of a Messiah. Indeed, the Hebrews were the only people of antiquity whose "Golden Age" lay in the future rather than in the past. Accordingly, to predict the coming of a Cyrus as the human agent of Israel\'s salvation is but the reverse side of the same prophet\'s picture of the Divine agent, namely, the obedient, Suffering Servant of Yahweh, who would redeem Israel from its sin. Deny to Isaiah the son of Amoz the prediction concerning Cyrus, and it is but logical to go farther and to deny to him the Messianic hope which is usually associated with his name. Deny to Isaiah the son of Amoz the predictions concerning a return from captivity, and the prophecies of his book are robbed of their essential character and unique perspective. Emasculate those portions of the Book of Isaiah which unveil the future, and they are reduced to a mere vaticinium ex eventu, and their religious value as Divine oracles is largely lost.<P>LITERATURE.<P>So much has been written on Isaiah\'s prophecies that only a selected list can be given here:<P>I. Commentaries on Isaiah:<P>Owen C. Whitehouse, The New Century Bible, 2 volumes, 1905; J. Skinner, The Cambridge Bible for Schools and Colleges, 2 volumes, 1896-98; W.E. Barnes, The Churchman\'s Bible, 2 volumes, 1901-3; G.A. Smith, The Expositor\'s Bible, 2 volumes, 1888-90; Franz Delitzsch, Clark\'s Foreign Theological Library, 2 volumes, 1892; (C. von Orelli, Clark\'s Foreign Theological Library, 1895; T.K. Cheyne, The Prophecies of Isaiah, 2 volumes, 1892; G.W. Wade, Westminster Commentaries, 1911; G.H. Box, The Book of Isaiah, 1909; G.B. Gray, International Critical Commentary, I, chapters i-xxvii, 1912; II, chapters xxviii-lxvi, by G.B. Gray and A.S. Peake; J.E. McFadyen, "Book of the Prophecies of Isaiah" (The Bible for Home and School), 1910; G. Campbell Morgan, The Analyzed Bible, 2 volumes, 1910; Alexander Maclaren, Expositions of Holy Scripture, 2 volumes, 1906; H.G. Mitchell, Isaiah: A Study of chapters 1-12, 1897; Nagelsbach in Lange\'s Bibelwerk, English edition, 1878; J.A. Alexander, 1865; H. Ewald, English edition, 1876-81; John Calvin, English edition, 1850; R. Lowth, 1778; Vitringa, 1732; W. Gesenius, 1820-21; F. Hitzig, 1833; C.J. Bredenkamp, 1887; A. Dillmann,1890,as revised by Kittel, 1898; B. Duhm, in Nowack\'s Handkommentar zum Altes Testament, 1892; K. Marti, 1900; A. Condamin (Roman Catholic), 1905.<P>II. Introduction and Criticism:<P>S.R. Driver, Isaiah, His Life and Times, in "The Men of the Bible Series," 1888; T.K. Cheyne, Introduction to the Book of Isaiah, 1895; W.R. Smith, The Prophets of Israel, 2nd edition, 1896; A.F. Kirkpatrick, The Doctrine of the Prophets, 1892; J.W. Thirtle, Old Testament Problems, 1907; W.E. Barnes, An Examination of <span class="noTag">Isaiah 24-27</span>, 1891; G. Douglas, Isaiah One and His Book One, 1895; J. Kennedy, A Popular Argument for the Unity of Isaiah, 1891; E. Koenig, The Exiles\' Book of Consolation, 1899; G.C. Workman, The Servant of Yahweh, 1907; M.G. Glazebrook, Studies in the Book of Isaiah, 1910; R.H. Kennett, The Composition of the Book of Isaiah in the Light of History and Archaeology, 1910; R.R. Ottley, Isaiah according to the Septuagint, 1904; Hackmann, Die Zukunftserwartung des Jesaia, 1893; J. Meinhold, Die Jesajaerzahlungen, Jesaja 36-39, 1898; O.T. Allis, "The Transcendence of Yahweh, God of Israel, <span class="noTag">Isa 44:24-28</span>," in Biblical and Theological Studies, Princeton\'s Centennial Commemoration Volume, 1912, 579634; J. Hastings, The Great Texts of the Bible, 1910; C.S. Robinson, The Gospel in Isaiah, 1895; E. Sievers, Metrische Studien, 1901; G.L. Robinson, The Book of Isaiah, 1910; H. Guthe, Das Zukunfisbild des Jesaia, 1885; Feldmann, Der Knecht Gottes, 1907; W. Urwick, The Servant of Yahweh, 1877; K. Cramer, The Historical Background of <span class="noTag">Isa 56-66</span>, 1905; A.B. Davidson, Old Testament Prophecy, 1903.<P>III. Articles in Journals and Dictionaries:<P>W.H Cobb in Journal of Biblical Literature and Exegesis,1891,II; 1895, I and II; 1898, I; 1901, I; 1908, I; F. Brown, JBL,1890,I; W. H. Cobb, in the BS, 1882; G. A. Smith, article "Isaiah" in HDB, 1899; T. K. Cheyne, in the EB,1901,and in the Encyclopedia Brit, 11th edition, 1910; Jas. Robertson, in the Illustrated Bible Dict., 1908; E. Koenig, in the Standard Bible Dict., 1909; A. Klostermann and J. A. Kelso, in The New Sch-Herz, 1910; A. Klostermann in the See Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche, 1900; G. Vos, Presbyterian and Reformed Review, 1898; D.S. Margoliouth, in The Temple Dictionary, 1910; C.A. Briggs, article "Analysis of <span class="noTag">Isa 40-62</span>" in Harper Memorial Volume. ``152';
