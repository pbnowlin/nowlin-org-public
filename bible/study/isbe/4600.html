isbe = [];

isbe[4601]='Influences`in\'-floo-ens-iz (ma\'adhannoth): This word occurs only in <a onClick="return mV(\'Job\',38,31);">Job 38:31</a> the King James Version, "Canst thou bind the sweet influences of Pleiades?" the Revised Version (British and American) "the cluster of the Pleiades," margin "or chain, or sweet influences"; Delitzsch, Dillmann and others render "fetters," that which binds the group together; "influences," if correct, would refer to the seasons, which were believed to be regulated, so far, by the <a href="study/isbe/search.html?string=PLEIADES">PLEIADES</A> (which see). In The <span class="noTag">Wisdom of Solomon 7:25</span>, it is said of Wisdom that she is "a pure influence (aporrhoia, the Revised Version (British and American) "effluence") flowing from the glory of the Almighty."``185';
isbe[4602]='Ingathering, Feasts of`in\'-gath-er-ing.`<a href="./study/isbe/search.html?string=FEASTS+AND+FASTS">FEASTS AND FASTS</a>; <a href="./study/isbe/search.html?string=BOOTH">BOOTH</a>`1';
isbe[4603]='Inhabit; Inhabitant`in-hab\'-it, in-hab\'-it-ant (yashabh, "to sit," "remain, "dwell," "inhabit" shakhen, "to settle down" "tabernacle," "dwell"; katoikeo, "to settle," "dwell"): See <a href="study/isbe/search.html?string=DWELL">DWELL</A>. The verb "to inhabit," now used only transitively, had once an intransitive meaning as well. Compare Cowper, Olney Hymns, XIV,<P>"Who built it, who inhabits there?"<P>So in <a onClick="return mV(\'1Ch\',5,9);">1Ch 5:9</a> the King James Version, "And eastward he inhabited unto the entering in of the wilderness" (but the Revised Version (British and American) "dwelt"). We have the obsolete inhabiters for "inhabitants" in <a onClick="return mV(\'Rev\',8,13);">Re 8:13</a> the King James Version (but the Revised Version (British and American) "them that dwell") and <a onClick="return mV(\'Rev\',12,12);">Re 12:12</a> the King James Version (but omitted in the Revised Version (British and American)). The rare inhabitress (feminine) is found only in <a onClick="return mV(\'Jer\',10,17);">Jer 10:17</a> margin; "the church called the inhabitress of the gardens" (Bishop Richardson).``49';
isbe[4604]='Inheritance`in-her\'-i-tans (nahalah, "something inherited," "occupancy," "heirloom," "estate," "portion"): The word is used in its widest application in the Old Testament Scriptures, referring not only to an estate received by a child from its parents, but also to the land received by the children of Israel as a gift from Yahweh. And in the figurative and poetical sense, the expression is applied to the kingdom of God as represented in the consecrated lives of His followers. In a similar sense, the Psalmist is represented as speaking of the Lord as the portion of his inheritance. In addition to the above word, the King James Version translations as inheritance, morashah, "a possession," "heritage" (<a onClick="return mV(\'Deu\',33,4);">De 33:4</a>; <a onClick="return mV(\'Eze\',33,24);">Eze 33:24</a>); yerushshah, "something occupied," "a patrimony," "possession" (<a onClick="return mV(\'Jdg\',21,17);">Jud 21:17</a>); cheleq, "smoothness," "allotment" (<a onClick="return mV(\'Psa\',16,5);">Ps 16:5</a>); kleronomeo, "to inherit" (<a onClick="return mV(\'Mat\',5,5);">Mt 5:5</a>, etc.); kleronomos, "heir" (<a onClick="return mV(\'Mat\',21,38);">Mt 21:38</a>, etc.); kleronomia, "heirship," "patrimony, "possession"; or kleros, "an acquisition" "portion," "heritage," from kleroo, "to assign," "to allot," "to obtain an inheritance" (<a onClick="return mV(\'Mat\',21,38);">Mt 21:38</a>; <a onClick="return mV(\'Luk\',12,13);">Lu 12:13</a>; <a onClick="return mV(\'Act\',7,5);">Ac 7:5</a>; <a onClick="return mV(\'Act\',20,32);">20:32</a>; <a onClick="return mV(\'Act\',26,18);">26:18</a>; <a onClick="return mV(\'Gal\',3,18);">Ga 3:18</a>; <a onClick="return mV(\'Eph\',1,11,14,18);">Eph 1:11, 14, 18</a>; <a onClick="return mV(\'Eph\',5,5);">5:5</a>; <a onClick="return mV(\'Col\',1,12);">Col 1:12</a>; <a onClick="return mV(\'Col\',3,24);">3:24</a>; <a onClick="return mV(\'Hbr\',1,4);">Heb 1:4</a>; <a onClick="return mV(\'Hbr\',9,15);">9:15</a>; <a onClick="return mV(\'Hbr\',11,8);">11:8</a>; <a onClick="return mV(\'1Pe\',1,4);">1Pe 1:4</a>).<P>The Pentateuch distinguishes clearly between real and personal property, the fundamental idea regarding the former being the thought that the land is God\'s, given by Him to His children, the people of Israel, and hence, cannot be alienated (<a onClick="return mV(\'Lev\',25,23,28);">Le 25:23, 28</a>). In order that there might not be any respecter of persons in the division, the lot was to determine the specific piece to be owned by each family head (<a onClick="return mV(\'Num\',26,\'52-56\');">Nu 26:52-56</a>; <a onClick="return mV(\'Num\',33,54);">33:54</a>). In case, through necessity of circumstances, a homestead was sold, the title could pass only temporarily; for in the year of Jubilee every homestead must again return to the original owner or heir (<a onClick="return mV(\'Lev\',25,\'25-34\');">Le 25:25-34</a>). Real estate given to the priesthood must be appraised, and could be redeemed by the payment of the appraised valuation, thus preventing the transfer of real property even in this case (<a onClick="return mV(\'Lev\',27,\'14-25\');">Le 27:14-25</a>). Inheritance was controlled by the following regulations:<P>(1) The firstborn son inherited a double portion of all the father\'s possession (<a onClick="return mV(\'Deu\',21,\'15-17\');">De 21:15-17</a>);<P>(2) the daughters were entitled to an inheritance, provided there were no sons in the family (<a onClick="return mV(\'Num\',27,8);">Nu 27:8</a>);<P>(3) in case there were no direct heirs, the brothers or more distant kinsmen were recognized (<a onClick="return mV(\'Num\',27,\'9-11\');">27:9-11</A>); in no case should an estate pass from one tribe to another.<P>The above points were made the subject of statutory law at the instance of the daughters of Zelophehad, the entire case being clearly set forth in <a onClick="return mV(\'Num\',27,\'1-\');">Nu 27</a>; <a onClick="return mV(\'Num\',36,\'1-\');">36</a>.``77';
isbe[4605]='Iniquity`in-ik\'-wi-ti (\'awon; anomia): In the Old Testament of the 11 words translated "iniquity," by far the most common and important is \'awon (about 215 times). Etymologically, it is customary to explain it as meaning literally "crookedness," "perverseness," i.e. evil regarded as that which is not straight or upright, moral distortion (from \'iwwah, "to bend," "make crooked," "pervert"). Driver, however (following Lagarde), maintains that two roots, distinct in Arabic, have been confused in Hebrew, one equals "to bend," "pervert" (as above), and the other equals "to err," "go astray"; that \'awon is derived from the latter, and consequently expresses the idea of error, deviation from the right path, rather than that of perversion (Driver, Notes on Sam, 135 note) Whichever etymology is adopted, in actual usage it has three meanings which almost imperceptibly pass into each other:<P>(1) iniquity,<P>(2) guilt of iniquity,<P>(3) punishment of iniquity.<P>Primarily, it denotes "not an action, but the character of an action" (Oehler), and is so distinguished from "sin" (chatta\'th). Hence, we have the expression "the iniquity of my sin" (<a onClick="return mV(\'Psa\',32,5);">Ps 32:5</a>). Thus the meaning glides into that of "guilt," which might often take the place of "iniquity" as the translation of \'awon (<a onClick="return mV(\'Gen\',15,16);">Ge 15:16</a>; <a onClick="return mV(\'Exd\',34,7);">Ex 34:7</a>; <a onClick="return mV(\'Jer\',2,22);">Jer 2:22</a>, etc.). From "guilt" it again passes into the meaning of "punishment of guilt," just as Latin piaculum may denote both guilt and its punishment. The transition is all the easier in Hebrew because of the Hebrew sense of the intimate relation of sin and suffering, e.g. <a onClick="return mV(\'Gen\',4,13);">Ge 4:13</a>, "My punishment is greater than I can bear"; which is obviously to be preferred to King James Version margin, the Revised Version, margin "Mine iniquity is greater than can be forgiven," for Cain is not so much expressing sorrow for his sin, as complaining of the severity of his punishment; compare <a onClick="return mV(\'2Ki\',7,9);">2Ki 7:9</a> (the Revised Version (British and American) "punishment," the Revised Version margin "iniquity"); <a onClick="return mV(\'Isa\',5,18);">Isa 5:18</a> (where for "iniquity" we might have "punishment of iniquity," as in <a onClick="return mV(\'Lev\',26,41,43);">Le 26:41, 43</a>, etc.); <a onClick="return mV(\'Isa\',40,2);">Isa 40:2</a> ("iniquity," the Revised Version margin "punishment"). The phrase "bear iniquity" is a standing expression for bearing its consequences, i.e. its penalty; generally of the sinner bearing the results of his own iniquity (<a onClick="return mV(\'Lev\',17,16);">Le 17:16</a>; <a onClick="return mV(\'Lev\',20,17,19);">20:17, 19</a>; <a onClick="return mV(\'Num\',14,34);">Nu 14:34</a>; <a onClick="return mV(\'Eze\',44,10);">Eze 44:10</a>, etc.), but sometimes of one bearing the iniquity of another vicariously, and so taking it away (e.g. <a onClick="return mV(\'Eze\',4,4);">Eze 4:4</a>f; <a onClick="return mV(\'Eze\',18,19);">18:19</A>f). Of special interest in the latter sense are the sufferings of the Servant of Yahweh, who shall "bear the iniquities" of the people (<a onClick="return mV(\'Isa\',53,11);">Isa 53:11</a>; compare <a onClick="return mV(\'Isa\',53,6);">Isa 53:6</a>).<P>Other words frequently translated "iniquity" are: \'awen, literally, "worthlessness," "vanity," hence, "naughtiness," "mischief" (47 times in the King James Version, especially in the phrase "workers of iniquity," <a onClick="return mV(\'Job\',4,8);">Job 4:8</a>; <a onClick="return mV(\'Psa\',5,5);">Ps 5:5</a>; <a onClick="return mV(\'Psa\',6,8);">6:8</a>; <a onClick="return mV(\'Pro\',10,29);">Pr 10:29</a>, etc.); \'awel and \'awlah, literally, "perverseness" (<a onClick="return mV(\'Deu\',32,4);">De 32:4</a>; <a onClick="return mV(\'Job\',6,29);">Job 6:29</a> the King James Version, etc.).<P>In the New Testament "iniquity" stands for anomia equals properly, "the condition of one without law," "lawlessness" (so translated in <a onClick="return mV(\'1Jo\',3,4);">1Joh 3:4</a>, elsewhere "iniquity," e.g. <a onClick="return mV(\'Mat\',7,23);">Mt 7:23</a>), a word which frequently stood for \'awon in the Septuagint; and adikia, literally, "unrighteousness" (e.g. <a onClick="return mV(\'Luk\',13,27);">Lu 13:27</a>).``49';
isbe[4606]='Injoin`in-join\'.`<a href="./study/isbe/search.html?string=ENJOIN">ENJOIN</a>`1';
isbe[4607]='Injurious`in-joo\'-ri-us, in-ju\'-ri-us (hubristes, "insolent"): In former usage, the word was strongly expressive of insult as well as hurtfulness. So in <a onClick="return mV(\'1Ti\',1,13);">1Ti 1:13</a>. In <a onClick="return mV(\'Rom\',1,30);">Ro 1:30</a> the same adjective is translated "insolent" (the King James Version "despiteful").``1';
isbe[4608]='Injury`in\'-ju-ri, in\'-joo-ri.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>`1';
isbe[4609]='Ink`ink (deyo, from root meaning "slowly flowing," BDB, 188; melan, "black"): Any fluid substance used with pen or brush to form written characters. In this sense ink is mentioned once in the Hebrew Bible (<a onClick="return mV(\'Jer\',36,2);">Jer 36:2</a>) and 3 times in the Greek New Testament (<a onClick="return mV(\'2Cr\',3,3);">2Co 3:3</a>; <a onClick="return mV(\'2Jo\',1,12);">2Joh 1:12</a>; <a onClick="return mV(\'3Jo\',1,13);">3Joh 1:13</a>), and it is implied in all references to writing on papyrus or on leather. The inference from the "blotting out" of <a onClick="return mV(\'Exd\',32,33);">Ex 32:33</a> and <a onClick="return mV(\'Num\',5,23);">Nu 5:23</a> that the Hebrew ink was a lamp-black and gum, or some other dry ink, is confirmed by the general usage of antiquity, by the later Jewish prejudice against other inks (OTJC, 71 note) and by a Jewish receipt referring to ink-tablets (Drach, "Notice sur l\'encre des Hebreux," Ann. philos. chret., 42, 45, 353). The question is, however, now being put on a wholly new basis by the study of the Elephantine Jewish documents (Meyer, Papyrusfund2, 1912, 15, 21), and above all of the Harvard Ostraca from Samaria which give actual specimens of the ink in Palestine in the time of Ahab (Harvard Theological Review, Jan. 1911, 136-43). It is likely, however, that during the long period of Bible history various inks were used. The official copy of the law in the time of Ptolemy Philadelphus was, according to Josephus (Ant., XII, ii, 11), written in gold, and the vermilion and red paints and dyes mentioned in <a onClick="return mV(\'Jer\',22,14);">Jer 22:14</a>; <a onClick="return mV(\'Eze\',23,14);">Eze 23:14</a>, and The <span class="noTag">Wisdom of Solomon 13:14</span> (milto kai phukei) were probably used also for writing books or coloring incised inscriptions. See literature under <a href="study/isbe/search.html?string=WRITING,+1">WRITING</A>; especially Krauss, Talmud, Arch. 3, 148-53; Gardthausen, Greek Palestine, 1911, I, 202-17, and his bibliographical references passim.``147';
isbe[4610]='Ink-Horn`ink\'-horn (keceth equals keseth, BDB, 903): This term "inkhorn" occurs 3 times in <a onClick="return mV(\'Eze\',9,\'1-\');">Eze 9</a> (<a onClick="return mV(\'Eze\',9,2,3,11);">9:2,3,11</a>), in the phrase "writer\'s inkhorn upon his loins" (or "by his side"). The word is more exactly "implement case," or "writing-case" (calamarium atramentarium, theca calamaria, theca libraria, graphiaria). This may have been the Egyptian palette (Budge, Mummy, 350-52) seen so often in the monuments of all periods, or the later form of pen-case with ink-well attached, which is a modified form adapted for ink carried in fluid form. The Egyptian palette was carried characteristically over the shoulder or under the arm, neither of which methods is strictly "upon the loins." The manner of carrying, therefore, was doubtless in the girdle, as in modern oriental usage (Benzinger, Hebrew Archaeol., 185). A good example of the pen-case and inkwell writing-case (given also in Garucci, Daremberg-Saglio, Gardthausen, etc.) is given from the original in Birt, Die Buchrolle in der Kunst,220,and is reproduced (a) in this article, together with (b) an Egyptian palette. Whether the form of Ezekiel\'s case approached the palette or the ink-well type probably depends on the question of whether dry ink or fluid ink was used in Ezekiel\'s time (see <a href="study/isbe/search.html?string=INK">INK</A>). Compare Hieronymus at the place, and for literature, see <a href="study/isbe/search.html?string=WRITING,+1">WRITING</A>, and especially Gardthausen, Greek Palestine,1911,I, 193-94.``147';
isbe[4611]='Inn`(malon; pandocheion, kataluma):<P>1. Earliest Night Resting-Places:<P>The Hebrew word malon means literally, a "night resting-place," and might be applied to any spot where caravans (<a onClick="return mV(\'Gen\',42,27);">Ge 42:27</a>; <a onClick="return mV(\'Gen\',43,21);">43:21</a> the King James Version), individuals (<a onClick="return mV(\'Exd\',4,24);">Ex 4:24</a>; <a onClick="return mV(\'Jer\',9,2);">Jer 9:2</a>), or even armies (<a onClick="return mV(\'Jos\',4,3,8);">Jos 4:3, 8</a>; <a onClick="return mV(\'2Ki\',19,23);">2Ki 19:23</a>; <a onClick="return mV(\'Isa\',10,29);">Isa 10:29</a>) encamped for the night. In the slightly altered form melunah, the same word is used of a nightwatchman\'s lodge in a garden (<a onClick="return mV(\'Isa\',1,8);">Isa 1:8</a>; <a onClick="return mV(\'Isa\',24,20);">24:20</a>, the King James Version "cottage"). The word in itself does not imply the presence of any building, and in the case of caravans and travelers was doubtless originally, as very often at the present day, only a convenient level bit of ground near some spring, where baggage might be unloaded, animals watered and tethered, and men rest on the bare ground. Nothing in the Old Testament suggests the occupancy of a house in such cases. The nearest approach to such an idea occurs in <a onClick="return mV(\'Jer\',41,17);">Jer 41:17</a> margin, where geruth kimham is translated "the lodging-place of Chimham," but the text is very doubtful and probably refers rather to sheepfolds. We cannot say when buildings were first used, but the need of shelter for caravans traveling in winter, and of protection in dangerous times and districts, would lead to their introduction at an early period in the history of trade.<P>2. Public Inns:<P>It is noteworthy that all the indisputable designations of "inn" come in with the Greek period. Josephus (Ant., XV, v, 1; BJ, I, xxi, 7) speaks of "Public inns" under the name of katagogal, while in the Aramaic Jewish writings we meet with \'ushpiza\', from Latin hospitium, and \'akhcanya\' from the Greek xenia; the New Testament designation pandocheion has passed into the Aramaic pundheqa\' and the Arabic funduq. All these are used of public inns, and they all correspond to the modern "khan" or "caravanserai." These are to be found on the great trade routes all over the East. In their most elaborate form they have almost the strength of a fortress. They consist of a great quadrangle into which admission is gained through a broad, strong gateway. The quadrangle is enclosed on all sides by a 2-story building, the windows in the case of the lower story opening only to the interior. The upper story is reached by stairways, and has a gangway all around, giving access to the practically bare rooms which are at the disposal of travelers.<p>3. Their Evil Name:<P>There is usually a well of good water in the center of the quadrangle, and travelers as a rule bring their own food and often that of their animals (<a onClick="return mV(\'Jdg\',19,19);">Jud 19:19</a>) with them. There are no fixed payments, and on departure, the arranging of haqq el-khan generally means a disagreeable dispute, as the innkeepers are invariably untruthful, dishonest and oppressive. They have ever been regarded as of infamous character. The Roman laws in many places recognize this. In Mishna, Yebhamoth, xvi. 7 the word of an innkeeper was doubted, and Mishna, \'Abbodhah Zarah, ii.4 places them in the lowest scale of degradation. The New Testament is quite clear in speaking of "Rahab the harlot" (<a onClick="return mV(\'Hbr\',11,31);">Heb 11:31</a>; <a onClick="return mV(\'Jam\',2,25);">Jas 2:25</a>). The Targum designates her an "innkeeper," while Rashi translates zonah as "a seller of kinds of food," a meaning the word will bear. Chimchi, however, accepts both meanings. This evil repute of public inns, together with the Semitic spirit of hospitality, led the Jews and the early Christians to prefer to recommend the keeping of open house for the entertainment of strangers. In the Jewish Morning Prayers, even in our day, such action is linked with great promises, and the New Testament repeatedly (<a onClick="return mV(\'Hbr\',13,2);">Heb 13:2</a>; <a onClick="return mV(\'1Pe\',4,9);">1Pe 4:9</a>; <a onClick="return mV(\'3Jo\',1,5);">3Joh 1:5</a>) commends hospitality. It is remarkable that both the Talmud (Shab 127a) and the New Testament (<a onClick="return mV(\'Hbr\',13,2);">Heb 13:2</a>) quote the same passage (<a onClick="return mV(\'Gen\',18,3);">Ge 18:3</a>) in recommending it.<P>The best-known khans in Palestine are Khan Jubb-Yusuf, north of the Lake of Galilee, Khan et-Tujjar, under the shadow of Tabor, Khan el-Lubban (compare <a onClick="return mV(\'Jdg\',21,19);">Jud 21:19</a>), and Khan Chadrur, midway between Jerusalem and Jericho. This last certainly occupies the site of the inn referred to in <a onClick="return mV(\'Luk\',10,34);">Lu 10:34</a>, and it is not without interest that we read in Mishna, Yebhamoth, xvi.7, of another sick man being left at that same inn. See illustration, p. 64.<P>4. Guest Chambers:<P>The Greek word kataluma, though implying a "loosing" for the night, seems rather to be connected with the idea of hospitality in a private house than in a public inn. Luke with his usual care distinguishes between this and pandocheion, and his use of the verb kataluo (<a onClick="return mV(\'Luk\',9,12);">Lu 9:12</a>; <a onClick="return mV(\'Luk\',19,7);">19:7</a>) makes his meaning clear. In the Septuagint, indeed, malon is sometimes translated kataluma, and it appears in <a onClick="return mV(\'1Sa\',9,22);">1Sa 9:22</a> for lishkah, the King James Version "parlour." It is the word used of the "upper room" where the Last Supper was held (<a onClick="return mV(\'Mar\',14,14);">Mr 14:14</a>; <a onClick="return mV(\'Luk\',22,11);">Lu 22:11</a>, "guest-chamber"), and of the place of reception in Bethlehem where Joseph and Mary failed to find quarters (<a onClick="return mV(\'Luk\',2,7);">Lu 2:7</a>). It thus corresponds to the spare or upper room in a private house or in a village, i.e. to the manzil adjoining the house of the sheikh, where travelers received hospitality and where no payment was expected, except a trifle to the caretaker. In Jerusalem such payments were made by leaving behind the earthenware vessels that had been used, and the skins of the animals that had been slaughtered (Yoma\' 12a).<P>5. Birth of Christ:<P>Judging from the word used, and the conditions implied, we are led to believe that Joseph and Mary had at first expected reception in the upper room or manzil at the house of the sheikh of Bethlehem, probably a friend and member of the house of David; that in this they were disappointed, and had to content themselves with the next best, the elevated platform alongside the interior of the stable, and on which those having the care of the animals generally slept. It being now the season when they were in the fields (<a onClick="return mV(\'Luk\',2,8);">Lu 2:8</a>), the stable would be empty and clean. There then the Lord Jesus was born and laid in the safest and most convenient place, the nearest empty manger alongside of this elevated platform. Humble though the circumstances were, the family were preserved from all the annoyance and evil associations of a public khan, and all the demands of delicacy and privacy were duly met.``23';
isbe[4612]='Inner Man``<a href="./study/isbe/search.html?string=INWARD+MAN">INWARD MAN</a>`1';
isbe[4613]='Innocence; Innocency; Innocent`in\'-o-sens, in\'-o-sen-si, in\'-o-sent (zakhu, niqqayon, chinnam, chaph, naqi; athoos): the King James Version and the American Standard Revised Version have innocency in <a onClick="return mV(\'Gen\',20,5);">Ge 20:5</a>; <a onClick="return mV(\'Psa\',26,6);">Ps 26:6</a>; <a onClick="return mV(\'Psa\',73,13);">73:13</a>; <a onClick="return mV(\'Dan\',6,22);">Da 6:22</a>; <a onClick="return mV(\'Hsa\',8,5);">Ho 8:5</a>. In Daniel the Hebrew is zakhu, and the innocence expressed is the absence of the guilt of disloyalty to God. In all the other places the Hebrew is niqqayon, and the innocence expressed is the absence of pollution, Hosea having reference to the pollution of idolatry, and the other passages presenting the cleansing under the figure of washing hands. the King James Version has innocent not fewer than 40 times. In one place (<a onClick="return mV(\'1Ki\',2,31);">1Ki 2:31</a>) the Hebrew is chinnam, meaning "undeserved," or "without cause," and, accordingly, the American Standard Revised Version, instead of "innocent blood ...shed," has "blood ...shed without cause." In another place (<a onClick="return mV(\'Job\',33,9);">Job 33:9</a>) the Hebrew is chaph, meaning "scraped," or "polished," therefore "clean," and refers to moral purity. In all the other places the Hebrew is naqi, or its cognates, and the idea is doubtless the absence of pollution. In more than half the passages "innocent" is connected with blood, as "blood of the innocent," or simply "innocent blood." In some places there is the idea of the Divine acquittal, or forgiveness, as in <a onClick="return mV(\'Job\',9,28);">Job 9:28</a>: "I know that thou wilt not hold me innocent" (compare <a onClick="return mV(\'Job\',10,14);">Job 10:14</a>, where the same Hebrew word is used). The New Testament has "innocent" twice in connection with blood—"innocent blood," and "innocent of the blood" (<a onClick="return mV(\'Mat\',27,4,24);">Mt 27:4, 24</a>).``61';
isbe[4614]='Innocents, Massacre of the`in\'-o-sents, mas\'-a-ker,<P><b>I. MEANING AND HISTORY OF THE TERM</b><P><b>II. ANALYSIS OF NARRATIVE WITH SPECIAL REFERENCE TO MOTIVE</b><P class="in15">1. Focus of Narrative—Residence at Nazareth<P class="in15">2. Corollaries from Above Facts<P class="in15">3. Marks of Historicity<hr /><P>I. Meaning and History of the Term.<P>The conventional, ecclesiastical name given to the slaughter by <a href="study/isbe/search.html?string=HEROD">HEROD, I</a> (which see) of children two years old and under in Bethlehem and its environs at the time of the birth of Christ (<a onClick="return mV(\'Mat\',2,16);">Mt 2:16</a>). The accepted title for this event may be traced through Augustine to Cyprian.<P>Irenaeus (died 202 AD) calls these children "martyrs," and in a very beautiful passage interprets the tragedy which ended their brief lives as a gracious and tender "sending before" into His kingdom by the Lord Himself.<P>Cyprian (died 258 AD) says: "That it might be manifest that they who are slain for Christ\'s sake are innocent, innocent infancy was put to death for his name\'s sake" (Ep. lv. 6).<P>Augustine (born 354 AD), following Cyprian, speaks of the children, formally, as "the Innocents" (Commentary on <a onClick="return mV(\'Psa\',43,5);">Ps 43:5</a>).<P>The ecclesiastical treatment of the incident is remarkable because of the exaggeration which was indulged in as to the extent of the massacre and the number of victims. At an early date the Greek church canonized 14,000, and afterward, by a curious misinterpretation of <a onClick="return mV(\'Rev\',14,1,3);">Re 14:1, 3</a>, the number was increased to 144,000.<P>According to Milman the liturgy of the Church of England retains a reminiscence of this ancient error in the use of <a onClick="return mV(\'Rev\',14,\'1-\');">Re 14</a> on Holy Innocents\' Day (see History of Christianity, I, 107, note e). This exaggeration, of which there is no hint in the New Testament, is worthy of note because the most serious general argument against the historicity of the narrative is drawn from the silence of Josephus. As in all probability there could not have been more than twenty children involved (compare Farrar, Life of Christ, I, 45, note), the incident could not have bulked very largely in the series of horrors perpetrated or planned by Herod in the last months of his life (see Farrar, The Herods, 144f).<P>II. Analysis of Narrative with Special Reference to Motive.<P>In estimating the value of such a narrative from the viewpoint of historicity, the first and most important step is to gauge the motive. Why was the story told? This question is not always easy to answer, but in the present instance there is a very simple and effective test at hand.<P>1. Focus of Narrative—Residence at Nazareth:<P>In Matthew\'s infancy section (<a onClick="return mV(\'Mat\',1,\'1-\');">Mt 1</a>; <a onClick="return mV(\'Mat\',2,\'1-\');">2</A>) there are five quotations from the Old Testament which are set into the narrative of events. These five quotations represent the cardinal and outstanding points of interest. The quotations are placed thus:<P>(1) at the Virgin Birth (<a onClick="return mV(\'Mat\',1,23);">Mt 1:23</a>);<P>(2) at the birth at Bethlehem (<a onClick="return mV(\'Mat\',2,6);">Mt 2:6</a>);<P>(3) at the visit to Egypt (<a onClick="return mV(\'Mat\',2,15);">Mt 2:15</a>);<P>(4) at the murder of the children (<a onClick="return mV(\'Mat\',2,18);">Mt 2:18</a>);<P>(5) at the Nazareth residence (<a onClick="return mV(\'Mat\',2,23);">Mt 2:23</a>).<P>It will be noticed at once as peculiar and significant that no quotation is attached to the visit of the Magi. This omission is the more noteworthy because in <a onClick="return mV(\'Num\',24,7);">Nu 24:7</a>; <a onClick="return mV(\'Psa\',72,15);">Ps 72:15</a>; <a onClick="return mV(\'Isa\',60,6);">Isa 60:6</a>, and numerous references to the ingathering of the Gentiles there are such beautiful and appropriate passages to link with the visit of the strangers from the Far East. This peculiar omission, on the part of a writer so deeply interested in prophecy and its fulfillment and so keen to seize upon appropriate and suggestive harmonies, in a section constructed with a view to such harmonies, can be explained only on the ground that the visit of the Magi did not, in the writer\'s view of events, occupy a critical point of especial interest. Their visit is told, not for its own sake, but because of its connection with the murder of the children and the journey to Egypt. The murder of the children is of interest because it discloses the character of Herod and the perils surrounding the newborn Messiah. It also explains the visit to Egypt and the subsequent residence at Nazareth. The latter is evidently the objective point, because it is given a place by itself and marked by a quotation. Moreover, the one evidence of overstrain in the narrative is in the ambiguous and obscure statement by which the Old Testament is brought into relationship with the Nazareth residence. The center of interest in the entire section which is concerned with Herod and the Magi is the Nazareth residence. The story is told for the express purpose of explaining why the heir of David, who was born at Bethlehem, lived at Nazareth.<P>This brings the narrative of Matthew into striking relationship with that of Luke. The latter\'s concern is to show how it was that the Messiah who lived at Nazareth was born at Bethlehem. We have here one of the undesigned unities which bind together these two narratives which are seemingly so divergent. That Matthew says nothing about a previous residence at Nazareth and that Luke says nothing about a forced return thither may be explained, in accordance with the balance of probabilities, on the ground, either that each evangelist was ignorant of the fact omitted by himself, or that in his condensed and rapid statement he did not see fit to mention it. In any case the harmony immeasurably outweighs the discrepancy.<P>2. Corollaries from Above Facts:<P>The fact that the focus of the entire narrative lies in the residence of Jesus at Nazareth effectually disposes of a number of current hypotheses as to its origin.<P>(1) The idea that it is merely legend told for the purpose of literary embellishment. The dovetailing of what would be the main item into the rest of the narrative and its subordination to secondary features cannot be explained on this hypothesis. The absence of adornment by available passages from the Old Testament alone is conclusive on this point (see Allen, "Matthew," ICC,14,15).<P>(2) The idea that the story is told for the purpose of illustrating the scope of the Messiah\'s influence beyond Israel. Here, again, the subordinate position assigned to the story of the Magi together with the absence of Old Testament material is conclusive. Moreover, the history of the Magi is abruptly dropped with the statement of their return home. Interest in them flags as soon as their brief connection with the movement of the history through Herod ceases. And the intensely Hebraic character of Matthew\'s infancy section as a whole is incidental evidence pointing in the same direction (compare remarks of the writer, Birth and Infancy of Jesus Christ, 70f).<P>(3) The idea that the story is told to emphasize the wonder-element in connection with the birth of Christ. The facts contradict this. In addition to the primary consideration, the subordinate position, there are others of great value. That the Magi were providentially guided to the feet of the Messiah is evidently the firm conviction of the narrator. The striking feature of the story is that with this belief in his mind he keeps so strictly within the limits of the natural order. In <a onClick="return mV(\'Mat\',2,9,12);">Mt 2:9 and 12</a> only is there apparent exception. Of these the statement in <a onClick="return mV(\'Mat\',2,9);">2:9</A> is the only one peculiar to this part of the narrative. Two things are to be remembered concerning it: It is clear that the verse cannot be interpreted apart from a clear understanding of the whole astronomical occurrence of which it forms a part.<P>It is also evident that <a onClick="return mV(\'Mat\',2,9);">Mt 2:9</a> must not be interpreted apart from the context. From the viewpoint of a wonder-tale the writer makes a fatal blunder at the most critical point of his story. The popular notion that the Magi were miraculously led to the Messiah finds no support in the text. The Magi did not come to Bethlehem, but to Jerusalem, asking: "Where is he that is born King of the Jews?" <a onClick="return mV(\'Mat\',2,9);">Mt 2:9</a> comes after this statement and after the conclave called by Herod in which Bethlehem was specified. In view of all this it seems clear that the Magi were led, not miraculously, but in accordance with the genius of their own system, and that the Providential element lay in the striking coincidence of their visit and the birth of Jesus. The interest of the writer was not in the wonder-element, else, infallibly, he would have sharpened its outlines and expurgated all ambiguity as to the nature of the occurrence.<P>We may now glance at the positive evidence for the historicity of the event.<P>3. Marks of Historicity:<P>(1) The centering of the narrative upon the residence of Jesus at Nazareth. This not only brings Luke\'s Gospel in support of the center, but groups the story around a point of known interest to the first generation of believers. It is interesting to note that the residence in Egypt has independent backing of a sort. There are in existence two stories, one traced by Origen through Jews of his own day to earlier times, and the other in the Talmud, which connect Jesus with Egypt and attempt to account for His miracles by reference to Egyptian magic (see Plummer, "Matthew," Ex. Comm., 17,18).<P>(2) The fact that the story of the Magi is told so objectively and with such personal detachment. Both Jews and early Christians had strong views both as to astrology and magic in general (see Plummer, op. cit., 15), but the author of this Gospel tells the story without emphasis and without comment and from the viewpoint of the Magi. His interest is purely historical and matter-of-fact.<P>(3) The portrait of Herod the Great. So far as Herod is concerned the incident is usually discussed with exclusive reference to the savagery involved. By many it is affirmed that we have here a hostile and unfair portrait. This contention could hardly be sustained even if the question turned entirely upon the point of savagery. But there is far more than savagery in the incident.<P>(a) In the first place there is this undeniable element of inherent probability in the story. Practically all of Herod\'s murders, including those of his beloved wife and his sons, were perpetrated under the sway of one emotion and in obedience to a single motive. They were in practically every instance for the purpose of consolidating or perpetuating his power. He nearly destroyed his own immediate family in the half-mad jealousy that on occasion drove him to the very limits of ferocity, simply because they were accused of plotting against him. The accusations were largely false, but the suspicion doomed those accused. The murder of the Innocents was another crime of the same sort. The old king was obsessed by the fear of a claimant to his petty throne; the Messianic hope of the Jews was a perpetual secret torment, and the murder of the children, in the attempt to reach the child whose advent threatened him, was at once so original in method and so characteristic in purpose as to give an inimitable veri-similitude to the whole narrative. There are also other traits of truth.<P>(b) Herod\'s prompt discovery of the visit of the Magi and their questions is in harmony with what we know of the old ruler\'s watchfulness and his elaborate system of espionage.<P>(c) Characteristic also is the subtlety with which he deals with the whole situation. How striking and vivid, with all its rugged simplicity, is the story of the king\'s pretended interest in the quest of the strangers, the solemn conclave of Jewish leaders with himself in the role of earnest inquirer, his urgent request for information that he may worship also, followed by his swift anger (note that ethumothe, "was wroth," verse <a onClick="return mV(\'Mat\',2,16);">16</a>, is not used elsewhere in the New Testament) at being deceived, and the blind but terrible stroke of his questing vengeance.<P>All these items are so true to the man, to the atmosphere which always surrounded him, and to the historic situation, that we are forced to conclude, either that we have veracious history more or less directly received from one who was an observer of the events described, or the work of an incomparably clever romancer.``169';
isbe[4615]='Inordinate`in-or\'-di-nat ("ill-regulated," hence, "immoderate," "excessive"; Latin in, "not," ordinatus, "set in order"): Only twice in the King James Version. In each case there is no corresponding adjective in the original, but the word was inserted by the translators as being implied in the noun. It disappears in Revised Version: <a onClick="return mV(\'Eze\',23,11);">Eze 23:11</a>, "in her inordinate love" (the Revised Version (British and American) "in her doting"); aghabhah, "lust"; <a onClick="return mV(\'Col\',3,5);">Col 3:5</a> "inordinate affection" (the Revised Version (British and American) "passion"); pathos, a word which in classical Greek may have either a good or a bad sense (any affection or emotion of the mind), but in the New Testament is used only in a bad sense (passion).``49';
isbe[4616]='Inquire`in-kwir\' (sha\'al, "to ask," "desire"; zeteo, "to seek"); A form sometimes employed with reference to the practice of divination, as where Saul "inquires of" (or "consults") the witch of Endor as to the issue of the coming battle (<a onClick="return mV(\'1Sa\',28,6,7);">1Sa 28:6-7</a>) (see <a href="study/isbe/search.html?string=DIVINATION">DIVINATION</A>).<P>In <a onClick="return mV(\'Job\',10,6);">Job 10:6</a>, "to inquire (baqash) after iniquity" signifies to bring to light and punish for it, and Job asks distractedly if God\'s time is so short that He is in a hurry to find him guilty and to punish him as if He had only a man\'s few days to live.<P>"To inquire of Yahweh" denotes the consultation of oracle, priest, prophet or Yahweh Himself, as to a certain course of action or as to necessary supplies. (<a onClick="return mV(\'Jdg\',20,27);">Jud 20:27</a> the King James Version, "to ask"; <a onClick="return mV(\'1Ki\',22,5);">1Ki 22:5</a>; <a onClick="return mV(\'1Sa\',9,9);">1Sa 9:9</a> (darash); <a onClick="return mV(\'1Sa\',10,22);">1Sa 10:22</a> the King James Version; <a onClick="return mV(\'2Sa\',2,1);">2Sa 2:1</a>; <a onClick="return mV(\'2Sa\',5,19,23);">5:19, 23</a>; <a onClick="return mV(\'Eze\',36,37);">Eze 36:37</a>).<P>"To inquire (baqar) in his temple" (palace) means to find out all that constant fellowship or unbroken intercourse with God can teach (<a onClick="return mV(\'Psa\',27,4);">Ps 27:4</a>).<P><a onClick="return mV(\'Pro\',20,25);">Pr 20:25</a> warns against rashness in making a vow and afterward considering (baqar, "to make inquiry") as to whether it can be fulfilled or how it may be eluded.<P>In the King James Version, the translation of several Greek words: diaginosko, "to know thoroughly" (<a onClick="return mV(\'Act\',23,15);">Ac 23:15</a>); epizeteo, "to seek after" (<a onClick="return mV(\'Act\',19,39);">Ac 19:39</a>); suzeteo, "to seek together" (<a onClick="return mV(\'Luk\',22,23);">Lu 22:23</a>); exetazo, "to search out" (<a onClick="return mV(\'Mat\',10,11);">Mt 10:11</a>).``91';
isbe[4617]='Inquisition`in-kwi-zish\'-un (darash, "to follow," "diligently inquire," "question," "search" (<a onClick="return mV(\'Deu\',19,18);">De 19:18</a>; <a onClick="return mV(\'Psa\',9,12);">Ps 9:12</a>), baqash, "to search out," "to strive after," "inquire" (<a onClick="return mV(\'Est\',2,23);">Es 2:23</a>)): The term refers, as indicated by these passages, first of all to a careful and diligent inquiry necessary to ascertain the truth from witnesses in a court, but may also refer to a careful examination into circumstances or conditions without official authority.``1';
isbe[4618]='Inscription`in-skrip\'-shun (verb epigrapho, "to write upon," "inscribe"): The word occurs once in English Versions of the Bible in <a onClick="return mV(\'Act\',17,23);">Ac 17:23</a> of the altar at Athens with the inscription "To an Unknown God."`<a href="./study/isbe/search.html?string=ARCHAEOLOGY;+ARCHAEOLOGY+AND+CRITICISM">ARCHAEOLOGY</a>; <a href="./study/isbe/search.html?string=ASSYRIA">ASSYRIA</a>; <a href="./study/isbe/search.html?string=BABYLONIA">BABYLONIA</a>`1';
isbe[4619]='Insects`in\'-sekts: In English Versions of the Bible, including the marginal notes, we find at least 23 names of insects or words referring to them: ant, bald locust, bee, beetle, cankerworm, caterpillar, creeping thing, cricket, crimson, flea, fly, gnat, grasshopper, honey, hornet, locust, louse, (lice), moth, palmer-worm, sandfly, scarlet-worm, silk-worm. These can be referred to about 12 insects, which, arranged systematically, are: Hymenoptera, ant, bee, hornet; Lepidoptera, clothes-moth, silk-worm; Siphonaptera, flea; Diptera, fly; Rhynchota, louse, scarletworm; Orthoptera, several kinds of grasshoppers and locusts.<P>The word "worm" refers not only to the scarletworm, but to various larvae of Lepidoptera, Coleoptera, and Diptera. "Creeping things" refers indefinitely to insects, reptiles, and beasts. In the list of 23 names given above honey and bee refer to one insect, as do crimson and scarlet. Sandfly has no place if "lice" be retained in <a onClick="return mV(\'Exd\',8,16);">Ex 8:16</a>ff. Bald locust, beetle, canker-worm, cricket, and palmerworm probably all denote various kinds of grasshoppers and locusts. When the translators of English Versions of the Bible had to do with two or more Hebrew words for which there was only one well-recognized English equivalent, they seem to have been content with that alone, if the two Hebrew words occurred in different passages; e.g. zebhubh, "fly" (<a onClick="return mV(\'Ecc\',10,1);">Ec 10:1</a>; <a onClick="return mV(\'Isa\',7,18);">Isa 7:18</a>), and \'arobh, "fly" (<a onClick="return mV(\'Exd\',8,21);">Ex 8:21</a>). On the other hand, they were put to it to find equivalents for the insect names in <a onClick="return mV(\'Lev\',11,22);">Le 11:22</a>; <a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a>, and elsewhere. For cale\'am (<a onClick="return mV(\'Lev\',11,22);">Le 11:22</a>) they evidently coined "bald locust," following a statement of the Talmud that it had a smooth head. For gazam and yeleq they imported "palmer-worm" and "canker-worm," two old English names of caterpillars, using "caterpillar" for chasil. The King James Version "beetle" for chargol is absolutely inappropriate, and the Revised Version (British and American) "cricket," while less objectionable, is probably also incorrect. The English language seems to lack appropriate names for different kinds of grasshoppers and locusts, and it is difficult to suggest any names to take the places of those against which these criticisms are directed. See under the names of the respective insects. See also <a href="study/isbe/search.html?string=SCORPION">SCORPION</A> and <a href="study/isbe/search.html?string=SPIDER">SPIDER</a>, which are not included here because they are not strictly insects.``37';
isbe[4620]='Inspiration, 1-7`in-spi-ra\'-shun:<P>1. Meaning of Terms<P>2. Occurrences in the Bible<P>3. Consideration of Important Passages<P class="in15">(1) <a onClick="return mV(\'2Ti\',3,16);">2 Timothy 3:16</a><P class="in15">(2) <a onClick="return mV(\'2Pe\',1,\'19-21\');">2 Peter 1:19-21</a><P class="in15">(3) <a onClick="return mV(\'Jhn\',10,34);">John 10:34</a> f<P>4. Christ\'s Declaration That Scripture Must Be Fulfilled<P>5. His Testimony That God Is Author of Scripture<P>6. Similar Testimony of His Immediate Followers<P>7. Their Identification of God and Scripture<P>8. The "Oracles of God"<P>9. The Human Element in Scripture<P>10. Activities of God in Giving Scripture<P>11. General Problem of Origin: God\'s Part<P>12. How Human Qualities Affected Scripture. Providential Preparation<P>13. "Inspiration" More than Mere "Providence"<P>14. Witness of New Testament Writers to Divine Operation<P>15. "Inspiration" and "Revelation"<P>16. Scriptures a Divine-Human Book?<P>17. Scripture of the New Testament Writers Was the Old Testament<P>18. Inclusion of the New Testament<P>LITERATURE<hr /><P>1. Meaning of Terms:<P>The word "inspire" and its derivatives seem to have come into Middle English from the French, and have been employed from the first (early in the 14th century) in a considerable number of significations, physical and metaphorical, secular and religious. The derivatives have been multiplied and their applications extended during the procession of the years, until they have acquired a very wide and varied use. Underlying all their use, however, is the constant implication of an influence from without, producing in its object movements and effects beyond its native, or at least its ordinary powers. The noun "inspiration," although already in use in the 14th century, seems not to occur in any but a theological sense until late in the 16th century. The specifically theological sense of all these terms is governed, of course, by their usage in Latin theology; and this rests ultimately on their employment in the Latin Bible. In the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Latin Bible the verb inspiro (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>; <span class="noTag">The Wisdom of Solomon 15:11</span>; Ecclesiasticus 4:12; <a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>; <a onClick="return mV(\'2Pe\',1,21);">2Pe 1:21</a>) and the noun inspiratio (<a onClick="return mV(\'2Sa\',22,16);">2Sa 22:16</a>; <a onClick="return mV(\'Job\',32,8);">Job 32:8</a>; <a onClick="return mV(\'Psa\',18,15);">Ps 18:15</a>; <a onClick="return mV(\'Act\',17,25);">Ac 17:25</a>) both occur 4 or 5 times in somewhat diverse applications. In the development of a theological nomenclature, however, they have acquired (along with other less frequent applications) a technical sense with reference to the Biblical writers or the Biblical books. The Biblical books are called inspired as the Divinely determined products of inspired men; the Biblical writers are called inspired as breathed into by the Holy Spirit, so that the product of their activities transcends human powers and becomes Divinely authoritative. Inspiration is, therefore, usually defined as a supernatural influence exerted on the sacred writers by the Spirit of God, by virtue of which their writings are given Divine trustworthiness.<P>2. Occurrences in the Bible:<P>Meanwhile, for English-speaking men, these terms have virtually ceased to be Biblical terms. They naturally passed from the Latin Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) into the English versions made from it (most fully into the Rheims-Douay: <a onClick="return mV(\'Job\',32,8);">Job 32:8</a>; <span class="noTag">The <span class="noTag">Wisdom of Solomon 15:11</span>; Ecclesiasticus 4:12</span>; <a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>; <a onClick="return mV(\'2Pe\',1,21);">2Pe 1:21</a>). But in the development of the English Bible they have found ever-decreasing place. In the English Versions of the Bible of the Apocrypha (both the King James Version and the Revised Version (British and American)) "inspired" is retained in <span class="noTag">The <span class="noTag">Wisdom of Solomon 15:11</span>; but in the canonical books the nominal form alone occurs in the King James Version and that only twice: <a onClick="return mV(\'Job\',32,8);">Job 32:8</a>, "But there is a spirit in man: and the inspiration of the Almighty giveth them understanding"; and <a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>, "All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness." the Revised Version (British and American) removes the former of these instances, substituting "breath" for "inspiration"; and alters the latter so as to read: "Every scripture inspired of God is also profitable for teaching, for reproof, for correction, for instruction which is in righteousness," with a marginal alternative in the form of, "Every scripture is inspired of God and profitable," etc. The word "inspiration" thus disappears from the English Bible, and the word "inspired" is left in it only once, and then, let it be added, by a distinct and even misleading mistranslation.<P>For the Greek word in this passage—theopneustos—very distinctly does not mean "inspired of God." This phrase is rather the rendering of the Latin, divinitus inspirata, restored from the Wycliff ("Al Scripture of God ynspyrid is ....") and Rhemish ("All Scripture inspired of God is ....") versions of the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) The Greek word does not even mean, as the King James Version translates it, "given by inspiration of God," although that rendering (inherited from, Tyndale: "All Scripture given by inspiration of God is ...." and its successors; compare Geneva: "The whole Scripture is given by inspiration of God and is ....") has at least to say for itself that it is a somewhat clumsy, perhaps, but not misleading, paraphrase of the Greek term in theological language of the day. The Greek term has, however, nothing to say of inspiring or of inspiration: it speaks only of a "spiring" or "spiration." What it says of Scripture is, not that it is "breathed into by God" or is the product of the Divine "inbreathing" into its human authors, but that it is breathed out by God, "God-breathed," the product of the creative breath of God. In a word, what is declared by this fundamental passage is simply that the Scriptures are a Divine product, without any indication of how God has operated in producing them. No term could have been chosen, however, which would have more emphatically asserted the Divine production of Scripture than that which is here employed. The "breath of God" is in Scripture just the symbol of His almighty power, the bearer of His creative word. "By the word of Yahweh," we read in the significant parallel of <a onClick="return mV(\'Psa\',33,6);">Ps 33:6</a> "were the heavens made, and all the host of them by the breath of his mouth." And it is particularly where the operations of God are energetic that this term (whether ruach, or neshamah) is employed to designate them—God\'s breath is the irresistible outflow of His power. When Paul declares, then, that "every scripture" or "all scripture" is the product of the Divine breath, "is God-breathed," he asserts with as much energy as he could employ that Scripture is the product of a specifically Divine operation.<P>3. Consideration of Important Passages:<P>(1) <a onClick="return mV(\'2Ti\',3,16);">2 Timothy 3:16</a>:<P>In the passage in which Paul makes this energetic assertion of the Divine origin of Scripture he is engaged in explaining the greatness of the advantages which Timothy had enjoyed for learning the saving truth of God. He had had good teachers; and from his very infancy he had been, by his knowledge of the Scriptures, made wise unto salvation through faith in Jesus Christ. The expression, "sacred writings," here employed (<a onClick="return mV(\'1Ti\',3,15);">1Ti 3:15</a>), is a technical one, not found elsewhere in the New Testament, it is true, but occurring currently in Philo and Josephus to designate that body of authoritative books which constituted the Jewish "Law." It appears here anarthrously because it is set in contrast with the oral teaching which Timothy had enjoyed, as something still better: he had not only had good instructors, but also always "an open Bible," as we should say, in his hand. To enhance yet further the great advantage of the possession of these Sacred Scriptures the apostle adds now a sentence throwing their nature strongly up to view. They are of Divine origin and therefore of the highest value for all holy purposes.<P>There is room for some difference of opinion as to the exact construction of this declaration. Shall we render "Every Scripture" or "All Scripture"? Shall we render "Every (or all) Scripture is God-breathed and (therefore) profitable," or "Every (or all) Scripture, being God-breathed, is as well profitable"? No doubt both questions are interesting, but for the main matter now engaging our attention they are both indifferent. Whether Paul, looking back at the Sacred Scriptures he had just mentioned, makes the assertion he is about to add, of them distributively, of all their parts, or collectively, of their entire mass, is of no moment: to say that every part of these Sacred Scriptures is God-breathed and to say that the whole of these Sacred Scriptures is God-breathed, is, for the main matter, all one. Nor is the difference great between saying that they are in all their parts, or in their whole extent, God-breathed and therefore profitable, and saying that they are in all their parts, or in their whole extent, because God-breathed as well profitable. In both cases these Sacred Scriptures are declared to owe their value to their Divine origin; and in both cases this their Divine origin is energetically asserted of their entire fabric. On the whole, the preferable construction would seem to be, "Every Scripture, seeing that it is God-breathed, is as well profitable." In that case, what the apostle asserts is that the Sacred Scriptures, in their every several passage—for it is just "passage of Scripture" which "Scripture" in this distributive use of it signifies—is the product of the creative breath of God, and, because of this its Divine origination, is of supreme value for all holy purposes.<P>It is to be observed that the apostle does not stop here to tell us either what particular books enter into the collection which he calls Sacred Scriptures, or by what precise operations God has produced them. Neither of these subjects entered into the matter he had at the moment in hand. It was the value of the Scriptures, and the source of that value in their Divine origin, which he required at the moment to assert; and these things he asserts, leaving to other occasions any further facts concerning them which it might be well to emphasize. It is also to be observed that the apostle does not tell us here everything for which the Scriptures are made valuable by their Divine origination. He speaks simply to the point immediately in hand, and reminds Timothy of the value which these Scriptures, by virtue of their Divine origin, have for the "man of God." Their spiritual power, as God-breathed, is all that he had occasion here to advert to. Whatever other qualities may accrue to them from their Divine origin, he leaves to other occasions to speak of.<P>(2) <a onClick="return mV(\'2Pe\',1,\'19-21\');">2 Peter 1:19-21</a>:<P>What Paul tells us here about the Divine origin of the Scriptures is enforced and extended by a striking passage in 2 Peter (<a onClick="return mV(\'2Pe\',1,\'19-21\');">1:19-21</a>). Peter is assuring his readers that what had been made known to them of "the power and coming of our Lord Jesus Christ" did not rest on "cunningly devised fables." He offers them the testimony of eyewitnesses of Christ\'s glory. And then he intimates that they have better testimony than even that of eyewitnesses. "We have," says he, "the prophetic word" (English Versions of the Bible, unhappily, "the word of prophecy"): and this, he says, is "more sure," and therefore should certainly be heeded. He refers, of course, to the Scriptures. Of what other "prophetic word" could he, over against the testimony of the eyewitnesses of Christ\'s "excellent glory" (the King James Version) say that "we have" it, that is, it is in our hands? And he proceeds at once to speak of it plainly as "Scriptural prophecy." You do well, he says, to pay heed to the prophetic word, because we know this first, that "every prophecy of scripture ...." It admits of more question, however, whether by this phrase he means the whole of Scripture, designated according to its character, as prophetic, that is, of Divine origin; or only that portion of Scripture which we discriminate as particularly prophetic, the immediate revelations contained in Scripture. The former is the more likely view, inasmuch as the entirety of Scripture is elsewhere conceived and spoken of as prophetic. In that case, what Peter has to say of this "every prophecy of scripture"—the exact equivalent, it will be observed, in this case of Paul\'s "every scripture" (<a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>)—applies to the whole of Scripture in all its parts. What he says of it is that it does not come "of private interpretation"; that is, it is not the result of human investigation into the nature of things, the product of its writers\' own thinking. This is as much as to say it is of Divine gift. Accordingly, he proceeds at once to make this plain in a supporting clause which contains both the negative and the positive declaration: "For no prophecy ever came (margin: "was brought") by the will of man, but it was as borne by the Holy Spirit that men spoke from God." In this singularly precise and pregnant statement there are several things which require to be carefully observed. There is, first of all, the emphatic denial that prophecy—that is to say, on the hypothesis upon which we are working, Scripture—owes its origin to human initiative: "No prophecy ever was brought—\'came\' is the word used in the English Versions of the Bible text, with \'was brought\' in the Revised Version margin—by the will of man." Then, there is the equally emphatic assertion that its source lies in God: it was spoken by men, indeed, but the men who spoke it "spake from God." And a remarkable clause is here inserted, and thrown forward in the sentence that stress may fall on it, which tells us how it could be that men, in speaking, should speak not from themselves, but from God: it was "as borne"—it is the same word which was rendered "was brought" above, and might possibly be rendered "brought" here—"by the Holy Spirit" that they spoke. Speaking thus under the determining influence of the Holy Spirit, the things they spoke were not from themselves, but from God.<P>Here is as direct an assertion of the Divine origin of Scripture as that of <a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>. But there is more here than a simple assertion of the Divine origin of Scripture. We are advanced somewhat in our understanding of how God has produced the Scriptures. It was through the instrumentality of men who "spake from him." More specifically, it was through an operation of the Holy Ghost on these men which is described as "bearing" them. The term here used is a very specific one. It is not to be confounded with guiding, or directing, or controlling, or even-leading in the full sense of that word. It goes beyond all such terms, in assigning the effect produced specifically to the active agent. What is "borne" is taken up by the "bearer," and conveyed by the "bearer\'s" power, not its own, to the "bearer\'s" goal, not its own. The men who spoke from God are here declared, therefore, to have been taken up by the Holy Spirit and brought by His power to the goal of His choosing. The things which they spoke under this operation of the Spirit were therefore His things, not theirs. And that is the reason which is assigned why "the prophetic word" is so sure. Though spoken through the instrumentality of men, it is, by virtue of the fact that these men spoke "as borne by the Holy Spirit," an immediately Divine word. It will be observed that the proximate stress is laid here, not on the spiritual value of Scripture (though that, too, is seen in the background), but on the Divine trustworthiness of Scripture. Because this is the way every prophecy of Scripture "has been brought," it affords a more sure basis of confidence than even the testimony of human eyewitnesses. Of course, if we do not understand by "the prophetic word" here the entirety of Scripture described, according to its character, as revelation, but only that element in Scripture which we call specifically prophecy, then it is directly only of that element in Scripture that these great declarations are made. In any event, however, they are made of the prophetic element in Scripture as written, which was the only form in which the readers of this Epistle possessed it, and which is the thing specifically intimated in the phrase "every prophecy of scripture." These great declarations are made, therefore, at least of large tracts of Scripture; and if the entirety of Scripture is intended by the phrase "the prophetic word," they are made of the whole of Scripture.<P>(3) <a onClick="return mV(\'Jhn\',10,34);">John 10:34</a> f:<P>How far the supreme trustworthiness of Scripture, thus asserted, extends may be conveyed to us by a passage in one of our Lord\'s discourses recorded by John (<a onClick="return mV(\'Jhn\',10,\'34-35\');">Joh 10:34-35</a>). The Jews, offended by Jesus\' "making himself God," were in the act to stone Him, when He defended Himself thus: "Is it not written in your law, I said, Ye are gods? If he called them gods, unto whom the word of God came (and the Scripture cannot be broken), say ye of him, whom the Father sanctified (margin "consecrated") and sent unto the world, Thou blasphemest; because I said, I am the Son of God?" It may be thought that this defense is inadequate. It certainly is incomplete: Jesus made Himself God (<a onClick="return mV(\'Jhn\',10,33);">Joh 10:33</a>) in a far higher sense than that in which "Ye are gods" was said of those "unto whom the word of God came": He had just declared in unmistakable terms, "I and the Father are one." But it was quite sufficient for the immediate end in view—to repel the technical charge of blasphemy based on His making Himself God: it is not blasphemy to call one God in any sense in which he may fitly receive that designation; and certainly if it is not blasphemy to call such men as those spoken of in the passage of Scripture adduced gods, because of their official functions, it cannot be blasphemy to call Him God whom the Father consecrated and sent into the world. The point for us to note, however, is merely that Jesus\' defense takes the form of an appeal to Scripture; and it is important to observe how He makes this appeal. In the first place, He adduces the Scriptures as law: "Is it not written in your law?" He demands. The passage of Scripture which He adduces is not written in that portion of Scripture which was more specifically called "the Law," that is to say, the Pentateuch; nor in any portion of Scripture of formally legal contents. It is written in the Book of Psalms; and in a particular psalm which is as far as possible from presenting the external characteristics of legal enactment (<a onClick="return mV(\'Psa\',82,6);">Ps 82:6</a>). When Jesus adduces this passage, then, as written in the "law" of the Jews, He does it, not because it stands in this psalm, but because it is a part of Scripture at large. In other words, He here ascribes legal authority to the entirety of Scripture, in accordance with a conception common enough among the Jews (compare <a onClick="return mV(\'Jhn\',12,34);">Joh 12:34</a>), and finding expression in the New Testament occasionally, both on the lips of Jesus Himself, and in the writings of the apostles. Thus, on a later occasion (<a onClick="return mV(\'Jhn\',15,25);">Joh 15:25</a>), Jesus declares that it is written in the "law" of the Jews, "They hated me without a cause," a clause found in <a onClick="return mV(\'Psa\',35,19);">Ps 35:19</a>. And Paul assigns passages both from the Psalms and from Isaiah to "the Law" (<a onClick="return mV(\'1Cr\',14,21);">1Co 14:21</a>; <a onClick="return mV(\'Rom\',3,19);">Ro 3:19</a>), and can write such a sentence as this (<a onClick="return mV(\'Gal\',4,21);">Ga 4:21</a>f): "Tell me, ye that desire to be under the law, do ye not hear the law? For it is written ...." quoting from the narrative of Genesis. We have seen that the entirety of Scripture was conceived as "prophecy"; we now see that the entirety of Scripture was also conceived as "law": these three terms, the law, prophecy, Scripture, were indeed, materially, strict synonyms, as our present passage itself advises us, by varying the formula of adduction in contiguous verses from "law" to "scripture." And what is thus implied in the manner in which Scripture is adduced, is immediately afterward spoken out in the most explicit language, because it forms an essential element in Our Lord\'s defense. It might have been enough to say simply, "Is it not written in your law?" But our Lord, determined to drive His appeal to Scripture home, sharpens the point to the utmost by adding with the highest emphasis: "and the scripture cannot be broken." This is the reason why it is worth while to appeal to what is "written in the law," because "the scripture cannot be broken." The word "broken" here is the common one for breaking the law, or the Sabbath, or the like (<a onClick="return mV(\'Jhn\',5,18);">Joh 5:18</a>; <a onClick="return mV(\'Jhn\',7,23);">7:23</a>; <a onClick="return mV(\'Mat\',5,19);">Mt 5:19</a>), and the meaning of the declaration is that it is impossible for the Scripture to be annulled, its authority to be withstood, or denied. The movement of thought is to the effect that, because it is impossible for the Scripture—the term is perfectly general and witnesses to the unitary character of Scripture (it is all, for the purpose in hand, of a piece)—to be withstood, therefore this particular Scripture which is cited must be taken as of irrefragable authority. What we have here is, therefore, the strongest possible assertion of the indefectible authority of Scripture; precisely what is true of Scripture is that it "cannot be broken." Now, what is the particular thing in Scripture, for the confirmation of which the indefectible authority of Scripture is thus invoked? It is one of its most casual clauses—more than that, the very form of its expression in one of its most casual clauses. This means, of course, that in the Savior\'s view the indefectible authority of Scripture attaches to the very form of expression of its most casual clauses. It belongs to Scripture through and through, down to its most minute particulars, that it is of indefectible authority.<P>It is sometimes suggested, it is true, that our Lord\'s argument here is an argumentum ad hominem, and that His words, therefore, express not His own view of the authority of Scripture, but that of His Jewish opponents. It will scarcely be denied that there is a vein of satire running through our Lord\'s defense: that the Jews so readily allowed that corrupt judges might properly be called "gods," but could not endure that He whom the Father had consecrated and sent into the world should call Himself Son of God, was a somewhat pungent fact to throw up into such a high light. But the argument from Scripture is not ad hominem but e concessu; Scripture was common ground with Jesus and His opponents. If proof were needed for so obvious a fact, it would be supplied by the circumstance that this is not an isolated but a representative passage. The conception of Scripture thrown up into such clear view here supplies the ground of all Jesus\' appeals to Scripture, and of all the appeals of the New Testament writers as well. Everywhere, to Him and to them alike, an appeal to Scripture is an appeal to an indefectible authority whose determination is final; both He and they make their appeal indifferently to every part of Scripture, to every element in Scripture, to its most incidental clauses as well as to its most fundamental principles, and to the very form of its expression. This attitude toward Scripture as an authoritative document is, indeed, already intimated by their constant designation of it by the name of Scripture, the Scriptures, that is "the Document," by way of eminence; and by their customary citation of it with the simple formula, "It is written." What is written in this document admits so little of questioning that its authoritativeness required no asserting, but might safely be taken for granted. Both modes of expression belong to the constantly illustrated habitudes of our Lord\'s speech. The first words He is recorded as uttering after His manifestation to Israel were an appeal to the unquestionable authority of Scripture; to Satan\'s temptations He opposed no other weapon than the final "It is written"! (<a onClick="return mV(\'Mat\',4,4,7,10);">Mt 4:4, 7, 10</a>; <a onClick="return mV(\'Luk\',4,4,8);">Lu 4:4, 8</a>). And among the last words which He spoke to His disciples before He was received up was a rebuke to them for not understanding that all things "which are written in the law of Moses, and the prophets, and psalms" concerning Him—that is (<a onClick="return mV(\'Luk\',24,45);">Lu 24:45</a>) in the entire "Scriptures"—"must needs be" (very emphatic) "fulfilled" (<a onClick="return mV(\'Luk\',24,44);">Lu 24:44</a>). "Thus it is written," says He (<a onClick="return mV(\'Luk\',24,46);">Lu 24:46</a>), as rendering all doubt absurd. For, as He had explained earlier upon the same day (<a onClick="return mV(\'Luk\',24,25);">Lu 24:25</a>), it argues only that one is "foolish and slow of heart" if he does not "believe in" (if his faith does not rest securely on, as on a firm foundation) "all" (without limit of subject-matter here) "that the prophets" (explained in <a onClick="return mV(\'Luk\',24,27);">Lu 24:27</a> as equivalent to "all the scriptures") "have spoken."<P>4. Christ\'s Declaration That Scripture Must Be Fulfilled:<P>The necessity of the fulfillment of all that is written in Scripture, which is so strongly asserted in these last instructions to His disciples, is frequently adverted to by our Lord. He repeatedly explains of occurrences occasionally happening that they have come to pass "that the scripture might be fulfilled" (<a onClick="return mV(\'Mar\',14,49);">Mr 14:49</a>; <a onClick="return mV(\'Jhn\',13,18);">Joh 13:18</a>; <a onClick="return mV(\'Jhn\',17,12);">17:12</a>; compare <a onClick="return mV(\'Jhn\',12,14);">Joh 12:14</a>; <a onClick="return mV(\'Mar\',9,12,13);">Mr 9:12-13</a>). On the basis of Scriptural declarations, therefore, He announces with confidence that given events will certainly occur: "All ye shall be offended (literally, "scandalized") in me this night: for it is written ...."(<a onClick="return mV(\'Mat\',26,31);">Mt 26:31</a>; <a onClick="return mV(\'Mar\',14,27);">Mr 14:27</a>; compare <a onClick="return mV(\'Luk\',20,17);">Lu 20:17</a>). Although holding at His command ample means of escape, He bows before on-coming calamities, for, He asks, how otherwise "should the scriptures be fulfilled, that thus it must be?" (<a onClick="return mV(\'Mat\',26,54);">Mt 26:54</a>). It is not merely the two disciples with whom He talked on the way to Emmaus (<a onClick="return mV(\'Luk\',24,25);">Lu 24:25</a>) whom He rebukes for not trusting themselves more perfectly to the teaching of Scripture. "Ye search the scriptures," he says to the Jews, in the classical passage (<a onClick="return mV(\'Jhn\',5,39);">Joh 5:39</a>), "because ye think that in them ye have eternal life; and these are they which bear witness of me; and ye will not come to me, that ye may have life!" These words surely were spoken more in sorrow than in scorn: there is no blame implied either for searching the Scriptures or for thinking that eternal life is to be found in Scripture; approval rather. What the Jews are blamed for is that they read with a veil lying upon their hearts which He would fain take away (<a onClick="return mV(\'2Cr\',3,15);">2Co 3:15</a>f). "Ye search the scriptures"—that is right: and "even you" (emphatic) "think to have eternal life in them"—that is right, too. But "it is these very Scriptures" (very emphatic) "which are bearing witness" (continuous process) "of me; and" (here is the marvel!) "ye will not come to me and have life!"—that you may, that is, reach the very end you have so properly in view in searching the Scriptures. Their failure is due, not to the Scriptures but to themselves, who read the Scriptures to such little purpose.<P>5. His Testimony That God Is Author of Scripture:<P>Quite similarly our Lord often finds occasion to express wonder at the little effect to which Scripture had been read, not because it had been looked into too curiously, but because it had not been looked into earnestly enough, with sufficiently simple and robust trust in its every declaration. "Have ye not read even this scripture?" He demands, as He adduces <a onClick="return mV(\'Psa\',118,\'1-\');">Ps 118</a> to show that the rejection of the Messiah was already intimated in Scripture (<a onClick="return mV(\'Mar\',12,10);">Mr 12:10</a>; <a onClick="return mV(\'Mat\',21,42);">Mt 21:42</a> varies the expression to the equivalent: "Did ye never read in the scriptures?"). And when the indignant Jews came to Him complaining of the Hosannas with which the children in the Temple were acclaiming Him, and demanding, "Hearest thou what these are saying?" He met them (<a onClick="return mV(\'Mat\',21,16);">Mt 21:16</a>) merely with, "Yea: did ye never read, Out of the mouths of babes and sucklings thou has perfected praise?" The underlying thought of these passages is spoken out when He intimates that the source of all error in Divine things is just ignorance of the Scriptures: "Ye do err," He declares to His questioners, on an important occasion, "not knowing the scriptures" (<a onClick="return mV(\'Mat\',22,29);">Mt 22:29</a>); or, as it is put, perhaps more forcibly, in interrogative form, in its parallel in another Gospel: "Is it not for this cause that ye err, that ye know not the scriptures?" (<a onClick="return mV(\'Mar\',12,24);">Mr 12:24</a>). Clearly, he who rightly knows the Scriptures does not err. The confidence with which Jesus rested on Scripture, in its every declaration, is further illustrated in a passage like <a onClick="return mV(\'Mat\',19,4);">Mt 19:4</a>. Certain Pharisees had come to Him with a question on divorce and He met them thus: "Have ye not read, that he who made them from the beginning made them male and female, and said, For this cause shall a man leave his father and mother, and shall cleave to his wife; and the two shall become one flesh? ...What therefore God hath joined together, let not man put asunder." The point to be noted is the explicit reference of <a onClick="return mV(\'Gen\',2,24);">Ge 2:24</a> to God as its author: "He who made them ...said"; "what therefore God hath joined together." Yet this passage does not give us a saying of God\'s recorded in Scripture, but just the word of Scripture itself, and can be treated as a declaration of God\'s only on the hypothesis that all Scripture is a declaration of God\'s. The parallel in Mark (<a onClick="return mV(\'Mar\',10,5);">10:5</a>ff) just as truly, though not as explicitly, assigns the passage to God as its author, citing it as authoritative law and speaking of its enactment as an act of God\'s. And it is interesting to observe in passing that Paul, having occasion to quote the same passage (<a onClick="return mV(\'1Cr\',6,16);">1Co 6:16</a>), also explicitly quotes it as a Divine word: "For, The twain, saith he, shall become one flesh"—the "he" here, in accordance with a usage to be noted later, meaning just "God."<P>Thus clear is it that Jesus\' occasional adduction of Scripture as an authoritative document rests on an ascription of it to God as its author. His testimony is that whatever stands written in Scripture is a word of God. Nor can we evacuate this testimony of its force on the plea that it represents Jesus only in the days of His flesh, when He may be supposed to have reflected merely the opinions of His day and generation. The view of Scripture He announces was, no doubt, the view of His day and generation as well as His own view. But there is no reason to doubt that it was held by Him, not because it was the current view, but because, in His Divine-human knowledge, He knew it to be true; for, even in His humiliation, He is the faithful and true witness. And in any event we should bear in mind that this was the view of the resurrected as well as of the humiliated Christ. It was after He had suffered and had risen again in the power of His Divine life that He pronounced those foolish and slow of heart who do not believe all that stands written in all the Scriptures (<a onClick="return mV(\'Luk\',24,25);">Lu 24:25</a>); and that He laid down the simple "Thus it is written" as the sufficient ground of confident belief (<a onClick="return mV(\'Luk\',24,46);">Lu 24:46</a>). Nor can we explain away Jesus\' testimony to the Divine trustworthiness of Scripture by interpreting it as not His own, but that of His followers, placed on His lips in their reports of His words. Not only is it too constant, minute, intimate and in part incidental, and therefore, as it were, hidden, to admit of this interpretation; but it so pervades all our channels of information concerning Jesus\' teaching as to make it certain that it comes actually from Him. It belongs not only to the Jesus of our evangelical records but as well to the Jesus of the earlier sources which underlie our evangelical records, as anyone may assure himself by observing the instances in which Jesus adduces the Scriptures as Divinely authoritative that are recorded in more than one of the Gospels (e.g. "It is written," <a onClick="return mV(\'Mat\',4,4,7,10);">Mt 4:4, 7, 10</a> (<a onClick="return mV(\'Luk\',4,4,8,10);">Lu 4:4, 8, 10</a>); <a onClick="return mV(\'Mat\',11,10);">Mt 11:10</a>; (<a onClick="return mV(\'Luk\',7,27);">Lu 7:27</a>); <a onClick="return mV(\'Mat\',21,13);">Mt 21:13</a> (<a onClick="return mV(\'Luk\',19,46);">Lu 19:46</a>; <a onClick="return mV(\'Mar\',11,17);">Mr 11:17</a>); <a onClick="return mV(\'Mat\',26,31);">Mt 26:31</a> (<a onClick="return mV(\'Mar\',14,21);">Mr 14:21</a>); "the scripture" or "the scriptures," <a onClick="return mV(\'Mat\',19,4);">Mt 19:4</a> (<a onClick="return mV(\'Mar\',10,9);">Mr 10:9</a>); <a onClick="return mV(\'Mat\',21,42);">Mt 21:42</a> (<a onClick="return mV(\'Mar\',12,10);">Mr 12:10</a>; <a onClick="return mV(\'Luk\',20,17);">Lu 20:17</a>); <a onClick="return mV(\'Mat\',22,29);">Mt 22:29</a> (<a onClick="return mV(\'Mar\',12,24);">Mr 12:24</a>; <a onClick="return mV(\'Luk\',20,37);">Lu 20:37</a>); <a onClick="return mV(\'Mat\',26,56);">Mt 26:56</a> (<a onClick="return mV(\'Mar\',14,49);">Mr 14:49</a>; <a onClick="return mV(\'Luk\',24,44);">Lu 24:44</a>)). These passages alone would suffice to make clear to us the testimony of Jesus to Scripture as in all its parts and declarations Divinely authoritative.<P>6. Similar Testimony of His Immediate Followers<P>The attempt to attribute the testimony of Jesus to His followers has in its favor only the undeniable fact that the testimony of the writers of the New Testament is to precisely the same effect as His. They, too, cu
