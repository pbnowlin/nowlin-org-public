isbe[4668]='Isdael`is\'-da-el (Isdael): In 1Esdras 5:33; called "Giddel" in <a onClick="return mV(\'Ezr\',2,56);">Ezr 2:56</a>.``1';
isbe[4669]='Ish`(\'ish): In the following Hebrew proper names, a prefix meaning "man of," or, collectively, "men of": Ish-bosheth, Ishhod, Ish-tob (but the Revised Version (British and American) correctly "the men of Tob").`<a href="./study/isbe/search.html?string=ESHBAAL">ESHBAAL</a>; <a href="./study/isbe/search.html?string=ESHBAN">ESHBAN</a>; <a href="./study/isbe/search.html?string=ISCARIOT">ISCARIOT</a>`1';
isbe[4670]='Ish-Bosheth`ish-bo\'-sheth (ish-bosheth, "man of shame"\' Iesbosthe): Called \'eshba\'al, "man of Baal" (<a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a>), and yishwi, "man of Yahweh" (?), perhaps for \'isheyo (<a onClick="return mV(\'1Sa\',14,49);">1Sa 14:49</a>). Compare <a href="study/isbe/search.html?string=ESHBAAL">ESHBAAL</A> and <a href="study/isbe/search.html?string=ISHVI">ISHVI</a> (the King James Version "Ishui"). We probably have the right meaning of the name in Eshbaal and Ishvi, the words Baal and Yahweh being frequently interchanged. The change to Ish-bosheth, "man of shame," in 2 Samuel, where the story of his shameful murder is related, may be better explained as reference to this (see <a href="study/isbe/search.html?string=MEPHIBOSHETH">MEPHIBOSHETH</a>, whose name was also changed from Merib-baal for similar reasons), than to find here a suggestion of Baal-worship, but see HPN,121,where the change is explained as a correction of the scribes, in consequence of prophetic protests.<P>One of the sons of Saul (<a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a>; <a onClick="return mV(\'1Ch\',9,39);">9:39</a>; <a onClick="return mV(\'1Sa\',14,49);">1Sa 14:49</a>) who, when his father and brothers were slain in the battle of Gilboa (<a onClick="return mV(\'1Sa\',31,1);">1Sa 31:1</a>), was proclaimed king over Israel by Abner, the captain of Saul\'s host, at Mahanaim (<a onClick="return mV(\'2Sa\',2,8);">2Sa 2:8</a>). Ishbosheth was 40 years old at this time and reigned over Israel 2 years (<a onClick="return mV(\'2Sa\',2,10);">2Sa 2:10</a>). Judah, however, proclaimed David its king. The consequence was war (<a onClick="return mV(\'2Sa\',2,12);">2Sa 2:12</a>). The house of David prevailed against the house of Saul (<a onClick="return mV(\'2Sa\',3,1);">2Sa 3:1</a>), but the war did not come to a close until Abner, angry on account of the rebuke he suffered from Ish-Bosheth for his unlawful intimacy with Rizpah, Saul\'s concubine, joined David (<a onClick="return mV(\'2Sa\',3,6);">2Sa 3:6</a>). David\'s condition to return to him Michal, his wife before peace could be made, was fulfilled by Ish-Bosheth (<a onClick="return mV(\'2Sa\',3,14);">2Sa 3:14</a>f), but it was not until after Abner\'s death that Ish-Bosheth seems to have given up hopes of retaining his power (<a onClick="return mV(\'2Sa\',4,1);">2Sa 4:1</a>). The shameful murder of Ish-Bosheth by his own captains is recorded in <a onClick="return mV(\'2Sa\',4,5);">2Sa 4:5</a>ff. David punished the murderers who had expected reward and buried Ish-Bosheth in the grave of Abner at Hebron (<a onClick="return mV(\'2Sa\',4,12);">2Sa 4:12</a>f).``16';
isbe[4671]='Ish-Sechel`ish\'-se-kel (\'ish sekhel, "man of discretion"): Ezra, at one time in need of ministers for the house of God, sent "unto Iddo the chief at the place Casiphia." "And according to the good hand of our God upon us they brought us a man of discretion (m "Ish-sechel"), of the sons of Mahli, the son of Levi, the son of Israel" (<a onClick="return mV(\'Ezr\',8,18);">Ezr 8:18</a>). This is the only reference to Ish-sechel.``1';
isbe[4672]='Ish-Tob`ish\'-tob (\'ish Tobh, the American Standard Revised Version "the men of Tob"): A place in Palestine, probably a small kingdom, large enough, however, to supply at least 12,000 men of valor to the children of Ammorn in their struggle against Joab, David\'s general (<a onClick="return mV(\'2Sa\',10,6,8);">2Sa 10:6, 8</a>).`<a href="./study/isbe/search.html?string=ISH">ISH</a>`1';
isbe[4673]='Ishbaal`ish\'-ba-al.`<a href="./study/isbe/search.html?string=ISH+BOSHETH">ISH-BOSHETH</a>`1';
isbe[4674]='Ishbah`ish\'-ba (yishbach): A member of the tribe of Judah, father of Eshtemoa (<a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>).``1';
isbe[4675]='Ishbak`ish\'-bak (yishbaq): A name in the list of sons of Abraham by Keturah (<a onClick="return mV(\'Gen\',25,2);">Ge 25:2</a> parallel <a onClick="return mV(\'1Ch\',1,32);">1Ch 1:32</a>). These names probably represent tribes; the tribe of Ishbak has not been certainly identified.``1';
isbe[4676]='Ishbi-Benob`ish-bi-be\'-nob (yishbi bhenobh): One of the four "born to the giant in Gath" who were slain by David and his men (<a onClick="return mV(\'2Sa\',21,\'15-22\');">2Sa 21:15-22</a>). Ishbi-benob was slain by Abishai, and David\'s life saved by the act (<a onClick="return mV(\'2Sa\',21,16,17);">21:16,17</a>).``1';
isbe[4677]='Ishhod`ish\'-hod (\'ishehodh, "man of majesty"): A man of the tribe of Manasseh (<a onClick="return mV(\'1Ch\',7,18);">1Ch 7:18</a>, the King James Version "Ishod").``1';
isbe[4678]='Ishi (1)`ish\'-i (yish\'i, "salutary"):<P>(1) A Jerahmeelite (<a onClick="return mV(\'1Ch\',2,31);">1Ch 2:31</a>); the genealogy may denote his membership by blood, or only by adoption, in the tribe of Judah.<P>(2) A Judahite (<a onClick="return mV(\'1Ch\',4,20);">1Ch 4:20</a>).<P>(3) A Simeonite, whose sons led 500 of their tribe against the Amalekites in Mt. Seir (<a onClick="return mV(\'1Ch\',4,42);">1Ch 4:42</a>).<P>(4) One of the chiefs of Manasseh east of the Jordan (<a onClick="return mV(\'1Ch\',5,24);">1Ch 5:24</a>).``1';
isbe[4679]='Ishi (2)`ish\'-i, i\'-shi (\'ishi, "my husband"; Septuagint ho aner mou): The name symbolic of Yahweh\'s relation to Israel which Hosea (<a onClick="return mV(\'Hsa\',2,16);">2:16</A>) declares shall be used when Baali, "my lord," has become hateful on account of its associations with the worship of the Baals.``1';
isbe[4680]='Ishiah`i-shi\'-ya.`<a href="./study/isbe/search.html?string=ISSHIAH">ISSHIAH</a>`1';
isbe[4681]='Ishijah`i-shi\'-ja.`<a href="./study/isbe/search.html?string=ISSHIJAH">ISSHIJAH</a>`1';
isbe[4682]='Ishma`ish\'-ma (yishma\', from the root yasham, "to lie waste," therefore meaning "desolate"): A brother of Jezreel and Idbash, "the sons of the father of Etam" (<a onClick="return mV(\'1Ch\',4,3);">1Ch 4:3</a>). They were brothers of Hazzelelponi.``1';
isbe[4683]='Ishmael (1)`ish\'-ma-el (yishma\'e\'l, "God heareth," or "God may," "shall hear"; Ismael):<P>(1) The son of Abraham by Hagar, the Egyptian slave of his wife Sarah. The circumstances connected with his birth reveal what seems to us to be a very strange practice. It was customary among ancient peoples to correct the natural defect of barrenness by substituting a slave woman. In our narrative, this is shown to be authorized and brought about by the legitimate wife with the understanding that the offspring of such a union should be regarded as her own: "It may be that I shall obtain children by her," literally, "that I shall be builded by her" (<a onClick="return mV(\'Gen\',16,2);">Ge 16:2</a>).<P>1. Birth:<P>The hopes of Sarah were realized, for Hagar gave birth to a son, and yet the outcome was not fully pleasing to Abraham\'s wife; there was one serious drawback. As soon as Hagar "saw that she had conceived," her behavior toward her mistress underwent a radical change; she was "despised in her eyes." But for the intervention of the angel of Yahweh, the boy might have been born in Egypt. For, being dealt with hardly (or humbled) by Sarah, the handmaid fled toward that country. On her way she was told by the angel to return to her mistress and submit herself "under her hands." She obeyed, and the child who was to be as "a wild ass among men" was born when his father was 86 years old (<a onClick="return mV(\'Gen\',16,\'7-16\');">Ge 16:7-16</a>).<P>2. Circumcision:<P>At the age of 13 years the boy was circumcised (<a onClick="return mV(\'Gen\',17,25);">Ge 17:25</a>) in accordance with the Divine command received by Abraham: "Every male among you shall be circumcised" (<a onClick="return mV(\'Gen\',17,10);">Ge 17:10</a>). Thus young Ishmael was made a party to the covenant into which God had entered with the lad\'s father. The fact that both Abraham and his son were circumcised the same day (<a onClick="return mV(\'Gen\',17,26);">Ge 17:26</a>) undoubtedly adds to the importance of Ishmael\'s partaking of the holy rite. He was certainly made to understand how much his father loved him and how deeply he was concerned about his spiritual welfare. We may even assume that there was a time when Abraham looked upon Ishmael as the promised seed. His error was made clear to him when God promised him the birth of a son by Sarah. At first this seemed to be incredible, Abraham being 100 years of age and Sarah 90. And yet, how could he disbelieve the word of God? His cherished, though mistaken, belief about Ishmael, his doubts regarding the possibility of Sarah\'s motherhood, and the first faint glimmer of the real meaning of God\'s promise, all these thoughts found their expression in the fervid wish: "O that Ishmael might live before thee!" (<a onClick="return mV(\'Gen\',17,18);">Ge 17:18</a>). Gradually the truth dawned upon the patriarch that God s thoughts are not the thoughts of men, neither their ways His ways. But we have no reason to believe that this entire changing of the mental attitude of Abraham toward Ishmael reacted unfavorably on his future treatment of this son "born of the flesh" (compare <a onClick="return mV(\'Gen\',21,11);">Ge 21:11</a>). If there were troubles in store for the boy likened by the angel of Yahweh to a wild ass, it was, in the main, the youngster\'s own fault.<P>3. Banishment:<P>When Isaac was weaned, Ishmael was about 16 years of age. The weaning was made an occasion for great celebration. But it seems the pleasure of the day was marred by the objectionable behavior of Ishmael. "And Sarah saw the son of Hagar the Egyptian ...mocking" (<a onClick="return mV(\'Gen\',21,9);">Ge 21:9</a>). Her jealous motherly love had quickened her sense of observation and her faculty of reading the character of children. We do not know exactly what the word used in the Hebrew for "mocking" really means. The Septuagint and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) render the passage: "When Sarah saw the son of Hagar ...playing with Isaac," and Paul followed a later tradition when he says: "He that was born after the flesh persecuted him that was born after the Spirit" (<a onClick="return mV(\'Gal\',4,29);">Ga 4:29</a>). Lightfoot (in his notes to the Epistle to the Galatians) says: "At all events the word seems to mean mocking, jeering." At any rate, the fact remains that Sarah objected to the bringing up of the son of promise together with the "mocker," and so both mother and son were banished from the tents of Abraham.<P>Now there came a most critical time in the life of young Ishmael. Only some bread and a bottle of water were "put on the shoulder" of Hagar by Abraham when he expelled her with her son. Aimlessly, as it seems, the two walked about in the wilderness of Beersheba. The water was soon spent, and with it went all hope and energy. The boy, being faint with thirst and tired out by his constant walking in the fierce heat of the sun, seemed to be dying. So his mother put him rapidly down in the shade of some plant. (We do not share the opinion of some writers that the narrative of <a onClick="return mV(\'Gen\',21,8);">Ge 21:8</a>ff represented Ishmael as a little boy whom his mother had carried about and finally flung in the shade of some shrub. Even if this passage is taken from a different source, it is certainly not in conflict with the rest as to the age of Ishmael.) After this last act of motherly love—what else could she do to help the boy?—she retired to a place at some distance and resignedly expected the death of her son and perhaps her own.<P>For the 2nd time in her life, she had a marvelous experience. "God heard the voice of the lad" and comforted the unhappy mother most wonderfully. Through His angel He renewed His former promise regarding her son, and then He showed her a well of water. The lad\'s life was saved and, growing up, he became in time an archer. He lived in the wilderness of Paran and was married by his mother to an Egyptian wife (<a onClick="return mV(\'Gen\',21,21);">Ge 21:21</a>).<P>4. His Children:<P>When Abraham died, his exiled son returned to assist his brother to bury their father (<a onClick="return mV(\'Gen\',25,9);">Ge 25:9</a>). In the same chapter we find the names of Ishmael\'s 12 sons (<a onClick="return mV(\'Gen\',25,12);">25:12</A>ff) and a brief report of his death at the age of 137 years (<a onClick="return mV(\'Gen\',25,17);">25:17</A>). According to <a onClick="return mV(\'Gen\',28,9);">Ge 28:9</a> he also had a daughter, Mahalath, whom Esau took for his wife; in <a onClick="return mV(\'Gen\',36,3);">Ge 36:3</a> her name is given as Basemath.<P>5. Descendants:<P>The character of Ishmael and his descendants (Arabian nomads or Bedouins) is very accurately and vividly depicted by the angel of Yahweh: "He shall be as a wild ass among men; his hand shall be against every man, and every man\'s hand against him" (<a onClick="return mV(\'Gen\',16,12);">Ge 16:12</a>). These nomads are, indeed, roaming the wilds of the desert, jealous of their independence, quarrelsome and adventurous. We may well think of their progenitor as of a proud, undaunted and rugged son of the desert, the very counterpart of the poor boy lying half dead from fatigue and exposure under the shrub in the wilderness of Beersheba.<P>6. In the New Testament:<P>The person and the history of Ishmael, the son of Abraham, "born after the flesh," is of special interest to the student of the New Testament because Paul uses him, in the Epistle to the Galatians, as a type of those Jews who cling to the paternal religion in such a manner as to be unable to discern the transient character of the Old Testament institutions, and especially those of the Mosaic law. By doing so they could not be made to see the true meaning of the law, and instead of embracing the grace of God as the only means of fulfilling the law, they most bitterly fought the central doctrine of Christianity and even persecuted its advocates. Like Ishmael, they were born of Hagar, the handmaid or slave woman; like him, they were Abraham\'s sons only "after the flesh," and their ultimate fate is foreshadowed in the casting out of Hagar and her son. They could not expect to maintain the connection with the true Israel, and even in case they should acclaim Christ their Messiah they were not to be the leaders of the church or the expounders of its teachings (<a onClick="return mV(\'Gal\',4,\'21-28\');">Ga 4:21-28</a>).<P>(2) The son of Nethaniah (<a onClick="return mV(\'Jer\',40,\'8-\');">Jer 40:8</A>-<a onClick="return mV(\'Jer\',40,\'1-18\');">41:18</a>; compare <a onClick="return mV(\'2Ki\',25,\'23-25\');">2Ki 25:23-25</a>). It is a dreary story of jealousy and treachery which Jeremiah has recorded in chapters 40, 41 of his book. After the destruction of Jerusalem and the deportation of the better class of Jewish citizens, it was necessary to provide for some sort of a government in the depopulated country. Public order had to be restored and maintained; the crops of the fields were endangered and had to be taken care of. It was thus only common political prudence that dictated to the king of Babylon the setting up of a governor for the remnant of Judah. He chose Gedaliah, the son of Ahikam, for the difficult position. The new officer selected for his place of residence the city of Mizpah, where he was soon joined by Jeremiah. All the captains of the Jewish country forces came to Mizpah with their men and put themselves under Gedaliah\'s orders (<a onClick="return mV(\'Jer\',40,13);">Jer 40:13</a>). Ishmael the son of Nethaniah, the son of Elishama "of the seed royal" (<a onClick="return mV(\'2Ki\',25,25);">2Ki 25:25</a>) was among their number—all of which must have been rather gratifying to the new governor. But he was destined to be cruelly disappointed. A traitor was among the captains that had gathered around him. Yet the governor might have prevented his dastardly scheme. Johnnan, the son of Kareah, and other loyal captains warned him of the treachery of Ishmael, telling him he was induced by Baalis, the Ammonite king, to assassinate the governor. But the governor\'s faith in Ishmael was not to be shaken; he even looked upon Johanan\'s report as false and calumnious (<a onClick="return mV(\'Jer\',40,16);">Jer 40:16</a>).<P>About 2 months after the destruction of Jerusalem, Ishmael was ready to strike the mortal blow. With 10 men he came to Mizpah, and there, at a banquet given in his honor, he killed Gedaliah and all the Jews and Chaldeans that were with him. He succeeded in keeping the matter secret, for, 2 days after the horrible deed, he persuaded a party of 80 pious Jews to enter the city and killed all but 10 of them, throwing their bodies into a pit. These men were coming from the ruins of the Temple with the offerings which they had intended to leave at Jerusalem. Now they had found out, to their great distraction, that the city was laid waste and the Temple destroyed. So they passed by Mizpah, their beards shaven, their clothes rent, and with cuts about their persons (<a onClick="return mV(\'Jer\',41,5);">Jer 41:5</a>). We may, indeed, ask indignantly, Why this new atrocity? The answer may be found in the fact that Ishmael did not kill all of the men. He spared 10 of them because they promised him some hidden treasures. This shows his motive. He was a desperate man and just then carrying out a desperate undertaking. He killed those peaceful citizens because of their money, and money he needed to realize his plans. They were those of a traitor to his country, inasmuch as he intended to deport the inhabitants of Mizpah to the land of his high confederate, the king of the Ammonites. Among the captives were Jeremiah and the daughters of the Jewish king. But his efforts came to naught. When Johnnan and the other captains were told of Ishmael\'s unheard-of actions, they immediately pursued the desperate adventurer and overtook him by the "great waters that are in Gibeon." Unfortunately, they failed to capture Ishmael; for he managed to escape with eight men to the Ammonites.<P>(3) A descendant of Benjamin and the son of Azel (<a onClick="return mV(\'1Ch\',8,38);">1Ch 8:38</a>; compare <a onClick="return mV(\'1Ch\',9,44);">9:44</A>).<P>(4) The father of Zebadiah who was "the ruler of the house of Judah, in all the king\'s (Jehoshaphat, <a onClick="return mV(\'2Ch\',19,8);">2Ch 19:8</a>) matters" (<a onClick="return mV(\'2Ch\',19,11);">2Ch 19:11</a>).<P>(5) The son of Jehohanan, and a "captain of hundreds," who lived at the time of Jehoiada and Joash (<a onClick="return mV(\'2Ch\',23,1);">2Ch 23:1</a>).<P>(6) One of the sons of Pashhur the priest. He was one of those men who had married foreign women and were compelled to "put away their wives" (<a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>).`<a href="./study/isbe/search.html?string=GEDALIAH">GEDALIAH</a>`8';
isbe[4684]='Ishmael (2)`(Ismael):<P>(1) the King James Version "Ismael" (Judith 2:23), the son of Abraham by Hagar.<P>(2) 1Esdras 9:22 (King James Version, the Revised Version (British and American) "Ismael"), corresponding to Ishmael in <a onClick="return mV(\'Ezr\',10,22);">Ezr 10:22</a>. See preceding article <a href="study/isbe/search.html?string=ISHMAEL+(1)">ISHMAEL (1).``1';
isbe[4685]='Ishmaelites`ish\'-ma-el-its (yishme\'e\'lim): The supposed descendants of Ishmael, the son of Abraham and Hagar, whom Abraham sent away from him after the birth of Isaac (<a onClick="return mV(\'Gen\',21,\'14-21\');">Ge 21:14-21</a>). The sons of Ishmael are given in <a onClick="return mV(\'Gen\',25,13,14);">Ge 25:13-14</a>; they were twelve in number and gave rise to as many tribes, but the term Ishmaelite has a broader signification, as appears from <a onClick="return mV(\'Gen\',37,28,36);">Ge 37:28, 36</a>, where it is identified with Midianite. From <a onClick="return mV(\'Gen\',16,12);">Ge 16:12</a> it may be inferred that it was applied to the Bedouin of the desert region east of the Jordan generally, for the character there assigned to Ishmael, "His hand shall be against every man, and every man\'s hand against him," fits the habits of Bedouin in all ages. Such was the character of the Midianites as described in <a onClick="return mV(\'Jdg\',7,\'1-\');">Jud 7</a>, who are again identified with the Ishmaelites (<a onClick="return mV(\'Jdg\',8,24);">8:24</A>). These references show that the Ishmaelites were not confined to the descendants of the son of Abraham and Hagar, but refer to the desert tribes in general, like "the children of the east" (<a onClick="return mV(\'Jdg\',7,12);">Jud 7:12</a>).``138';
isbe[4686]='Ishmaiah`ish-ma\'-ya (yishma\'yah, "Yah is hearing"):<P>(1) A man of Gibeon, chief of David\'s 30 great warriors, who came to him at Ziklag (<a onClick="return mV(\'1Ch\',12,4);">1Ch 12:4</a>, the King James Version "Ismaiah").<P>(2) Chief of the armed contingent of the tribe of Zebulun, which served David in the monthly order of the tribes (<a onClick="return mV(\'1Ch\',27,19);">1Ch 27:19</a>).``1';
isbe[4687]='Ishmeelites`ish\'-me-el-its (yishme\'e\'li).`<a href="./study/isbe/search.html?string=ISHMAELITES">ISHMAELITES</a>`1';
isbe[4688]='Ishmerai`ish\'-me-ri (yishmeray, from shamar, meaning "to hedge about," i.e. "to guard," and therefore a "guard," "protector"): A descendant of Benjamin, son of Epaal, resident of Jerusalem, one of the "heads of fathers\' houses throughout their generations, chief men" (<a onClick="return mV(\'1Ch\',8,18);">1Ch 8:18</a>).``1';
isbe[4689]='Ishod`i\'-shod, ish\'-od (\'ishehodh): the King James Version <a onClick="return mV(\'1Ch\',7,18);">1Ch 7:18</a> for <a href="study/isbe/search.html?string=ISHHOD">ISHHOD</A> (which see).``1';
isbe[4690]='Ishpah`ish\'-pa (yishpah, "firm," "strong"): A man of the tribe of Benjamin, of the house of Beriah (<a onClick="return mV(\'1Ch\',8,16);">1Ch 8:16</a>).``1';
isbe[4691]='Ishpan`ish\'-pan (yishpan, literally, "he will hide"): Descendant of Benjamin, son of Shashak, one of "the chief men, heads of fathers\' houses"; lived at Jerusalem (<a onClick="return mV(\'1Ch\',8,22);">1Ch 8:22</a>).``1';
isbe[4692]='Ishuah; Isuah`ish\'-u-a, is\'-u-a (yishwah, literally, "he will level").`<a href="./study/isbe/search.html?string=ISHUAI">ISHUAI</a>; <a href="./study/isbe/search.html?string=ISHVAH">ISHVAH</a>; <a href="./study/isbe/search.html?string=ISHVI">ISHVI</a>`1';
isbe[4693]='Ishuai, Ishui`ish\'-u-i, ish\'-u-i (yishwi "level").`<a href="./study/isbe/search.html?string=ISHVI">ISHVI</a>`1';
isbe[4694]='Ishvah`ish\'-va (yishwah, "even," "level"; the King James Version Ishuah and Isuah): Second son of Asher (<a onClick="return mV(\'Gen\',46,17);">Ge 46:17</a>; <a onClick="return mV(\'1Ch\',7,30);">1Ch 7:30</a>). As only the families of his brothers Ishvi, etc., are mentioned in <a onClick="return mV(\'Num\',26,44);">Nu 26:44</a>, the supposition is that he left no issue.``1';
isbe[4695]='Ishvi`ish\'-vi (yishwi, "equal"):<P>(1) The third son of Asher (<a onClick="return mV(\'Gen\',46,17);">Ge 46:17</a>; <a onClick="return mV(\'1Ch\',7,30);">1Ch 7:30</a>), and founder of the family of the Ishvites (<a onClick="return mV(\'Num\',26,44);">Nu 26:44</a>, the King James Version "Jesuites"), the King James Version "Isui," "Jesui," and "Ishui."<P>(2) The name is also found among the sons of Saul (<a onClick="return mV(\'1Sa\',14,49);">1Sa 14:49</a>), the King James Version "Ishui."``1';
isbe[4696]='Island; Isle`i\'-land, il<P>(1) \'i, "island" or "isle"; the American Standard Revised Version has "coast" or "coast-land" in <a onClick="return mV(\'Isa\',20,6);">Isa 20:6</a>; <a onClick="return mV(\'Isa\',23,2,6);">23:2, 6</a>; the Revised Version margin has "coast-lands" in <a onClick="return mV(\'Gen\',10,5);">Ge 10:5</a>; <a onClick="return mV(\'Isa\',11,11);">Isa 11:11</a>; <a onClick="return mV(\'Isa\',24,15);">24:15</a>; <a onClick="return mV(\'Isa\',59,18);">59:18</a>; <a onClick="return mV(\'Jer\',25,22);">Jer 25:22</a>; <a onClick="return mV(\'Eze\',39,6);">Eze 39:6</a>; <a onClick="return mV(\'Dan\',11,18);">Da 11:18</a>; <a onClick="return mV(\'Zep\',2,11);">Ze 2:11</a>; the Revised Version margin has "sea-coast" in <a onClick="return mV(\'Jer\',47,4);">Jer 47:4</a>.<P>(2) plural \'iyim, the King James Version "wild beasts of the islands," the Revised Version (British and American) "wolves," the Revised Version margin "howling creatures" (<a onClick="return mV(\'Isa\',13,22);">Isa 13:22</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>; <a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>).<P>(3) nesion, "small island" (<a onClick="return mV(\'Act\',27,16);">Ac 27:16</a>)<P>(4) nesos, "island" (<a onClick="return mV(\'Act\',13,6);">Ac 13:6</a>; <a onClick="return mV(\'Act\',27,26);">27:26</a>; <a onClick="return mV(\'Act\',28,1,7,9,11);">28:1, 7, 9, 11</a>; <a onClick="return mV(\'Rev\',1,9);">Re 1:9</a>; <a onClick="return mV(\'Rev\',6,14);">6:14</a>; <a onClick="return mV(\'Rev\',16,20);">16:20</a>):<P>Except as noted above, \'i in the Revised Version (British and American) is translated "isle" or "island." <a href="study/isbe/search.html?string=ARVAD">ARVAD</A> (which see), a Phoenician island-city north of Tripoli, Syria, is mentioned in <a onClick="return mV(\'Gen\',10,18);">Ge 10:18</a>; <a onClick="return mV(\'1Ch\',1,16);">1Ch 1:16</a>; <a onClick="return mV(\'Eze\',27,8,11);">Eze 27:8, 11</a>. This and Tyre were the only important islands on the coast, both of them very small. We find references to Kittim or Chittim, Cyprus (<a onClick="return mV(\'Gen\',10,4);">Ge 10:4</a>; <a onClick="return mV(\'Num\',24,24);">Nu 24:24</a>; <a onClick="return mV(\'1Ch\',1,7);">1Ch 1:7</a>; <a onClick="return mV(\'Isa\',23,1,12);">Isa 23:1, 12</a>; <a onClick="return mV(\'Jer\',2,10);">Jer 2:10</a>; <a onClick="return mV(\'Eze\',27,6);">Eze 27:6</a>; <a onClick="return mV(\'Dan\',11,30);">Da 11:30</a>); to Elisha, perhaps Carthage (<a onClick="return mV(\'Gen\',10,4);">Ge 10:4</a>; <a onClick="return mV(\'1Ch\',1,7);">1Ch 1:7</a>; <a onClick="return mV(\'Eze\',27,7);">Eze 27:7</a>); to "isles of the nations" (<a onClick="return mV(\'Gen\',10,5);">Ge 10:5</a>; <a onClick="return mV(\'Zep\',2,11);">Ze 2:11</a>); to "isles of the sea" (<a onClick="return mV(\'Est\',10,1);">Es 10:1</a>; <a onClick="return mV(\'Isa\',11,11);">Isa 11:11</A>; <a onClick="return mV(\'Isa\',24,15);">Isa 24:15</a>; <a onClick="return mV(\'Eze\',26,18);">Eze 26:18</a>); to "Tarshish and the isles" (<a onClick="return mV(\'Psa\',72,10);">Ps 72:10</a>; compare <a onClick="return mV(\'Isa\',66,19);">Isa 66:19</a>); to "isle (the Revised Version margin "sea-coast") of Caphtor" (<a onClick="return mV(\'Jer\',47,4);">Jer 47:4</a>). Communication with these islands or distant coasts is kept up by the Tyrians (<a onClick="return mV(\'Eze\',27,3,15);">Eze 27:3, 15</a>). The Jews were not a maritime people, and in early times their geographical knowledge was very limited. Of 32 Old Testament passages referring to "island" or "isle," 25 are in Isaiah, Jeremiah, and Ezekiel. In the New Testament, besides the passages noted above, and Patmos (<a onClick="return mV(\'Rev\',1,9);">Re 1:9</a>), various islands are mentioned by name in connection with the voyages of Paul, e.g. Cyprus, Crete, Lesbos, Samos, Samothrace, Chios, Melita, Sicily (Syracuse, <a onClick="return mV(\'Act\',28,12);">Ac 28:12</a>). "Jackals" is a perfectly possible translation of \'iyim (the King James Version "wild beasts of the islands," the Revised Version (British and American) "wolves," the Revised Version margin "howling creatures").`<a href="./study/isbe/search.html?string=COAST">COAST</a>; <a href="./study/isbe/search.html?string=GEOGRAPHY">GEOGRAPHY</a>; <a href="./study/isbe/search.html?string=JACKAL">JACKAL</a>; <a href="./study/isbe/search.html?string=WOLF">WOLF</a>`37';
isbe[4697]='Isles of the Gentiles`(<a onClick="return mV(\'Gen\',10,5);">Ge 10:5</a>): the American Standard Revised Version "isles (margin "coast-lands") of the nations," said of the territories of the sons of Japheth. The reference is to the coasts of the Western Mediterranean, with their islands (compare "isles of the sea," <a onClick="return mV(\'Est\',10,1);">Es 10:1</a>; <a onClick="return mV(\'Eze\',26,18);">Eze 26:18</a>, etc.).`<a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>`1';
isbe[4698]='Ismachiah`is-ma-ki\'-a (yicmakhyahu, "Yah will sustain"): One of the "overseers under the hand of Conaniah and Shimei his brother, by the appointment of Hezekiah the king, and Azariah the ruler of the house of God" (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>).``1';
isbe[4699]='Ismael`is\'-ma-el.`<a href="./study/isbe/search.html?string=ISHMAEL">ISHMAEL</a>`1';
isbe[4700]='Ismaerus`is-ma-e\'-rus (Ismaeros): the King James Version "Omaerus" (1Esdras 9:34), corresponding to Amram in <a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>.``1';
