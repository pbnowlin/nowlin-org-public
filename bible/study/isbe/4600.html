n where his parents had been buried (<a onClick="return mV(\'Gen\',49,31);">Ge 49:31</a>), and where\' his place of sepulture is still honored.<P>IV. Biblical References.<P>There is a great contrast between Abraham and Jacob on the one hand, and Isaac on the other, with respect to their prominence in the literature of the nation that traced to them its descent. To be sure, when the patriarchs as a group are to be named, Isaac takes his place in the stereotyped formula of "Abraham, Isaac and Jacob," or "Israel" (so 23 times in the Old Testament, 7 times in the New Testament).<P>1. In the Old Testament:<P>But apart from this formula Isaac is referred to in the Old Testament only as follows. During the lifetime of Jacob the names of Abraham and Isaac are repeatedly linked in the same way as are all three subsequently: they form for that age the dynasty of the covenant. But several times Jacob calls Yahweh the God (or, the Fear; see infra) of Isaac, because Isaac is his own immediate predecessor in this chain of the faithful. Isaac is called the "gift" of God to Abraham, in the farewell address of Joshua, just as Jacob and Esau are called God\'s "gifts" to Isaac (<a onClick="return mV(\'Jos\',24,3);">Jos 24:3</a>f; compare Koran, Sura 6 84). The "house of Isaac" is used by Amos as a parallel expression for "Israel," and "the high places of Isaac" for "the sanctuaries of Israel" (<a onClick="return mV(\'Amo\',7,16);">Am 7:16</a>; <a onClick="return mV(\'Amo\',7,9);">7:9</a>), in the same way as "Jacob" is often used elsewhere Septuagint in <a onClick="return mV(\'Amo\',7,16);">Am 7:16</a> reads "Jacob"). Other references to Isaac are simply as to his father\'s son or his children\'s father.<P>2. In the New Testament:<P>He fares better in the New Testament. For, besides the genealogical references, Isaac\'s significance as the first to receive circumcision on the 8th day is remembered (<a onClick="return mV(\'Act\',7,8);">Ac 7:8</a>); his position as first of the elect seed is set forth (<a onClick="return mV(\'Rom\',9,7);">Ro 9:7</a>); his begetting of two sons so unlike in their relation to the promise as were Esau and Jacob is remarked (<a onClick="return mV(\'Rom\',9,10);">Ro 9:10</a>); the facts of his being heir to the promise, a child of old age, and, though but one, the father of an innumerable progeny, are emphasized in Heb (<a onClick="return mV(\'Hbr\',11,\'9-12\');">11:9-12</A>), which also discovers the deeper significance of his sacrifice and restoration to his father (<a onClick="return mV(\'Hbr\',11,\'17-19\');">11:17-19</a>; compare <a onClick="return mV(\'Jam\',2,21);">Jas 2:21</a>); and in the same context is noticed the faith in God implied in Isaac\'s blessing of his sons. But Isaac receives more attention than anywhere else in that famous passage in Ga (<a onClick="return mV(\'Gal\',4,\'21-31\');">4:21-31</a>), in which Paul uses Isaac and his mother as allegorical representations of Christians who are justified by faith in the promise of God, and are the free-born heirs of all the spiritual inheritance implied in that promise. Even Isaac\'s persecution by Ishmael has its counterpart in the attitude of the enemies of Paul\'s gospel toward him and his doctrines and converts.<P>V. Views Other than the Historical.<P>Philo, the chief allegorizer of Scriptural narratives, has little to say of Isaac, whom he calls "the self-instructed nature." But modern critics have dissolved his personality by representing him as the personification of an ethnic group. "All Israel," writes Wellhausen (Prol., 6th edition, 316), "is grouped with the people of Edom under the old name Isaac (<a onClick="return mV(\'Amo\',7,9,16);">Am 7:9, 16</a>) ...the material here is not mythical (as in <span class="noTag">Ge 1-11</span>) but national." And just as Israel plus Edom had little or no significance in national customs or political events, when compared on the one hand with Israel alone (= Jacob), and with Israel plus Edom plus Moab and Ammon (= Abraham) on the other hand; so likewise the figure of Isaac is colorless and his story brief, as compared with the striking figures of Jacob on the one hand and of Abraham on the other hand, and the circumstantial stories of their lives.<P>Other scholars will have none of this national view, because they believe Isaac to be the name of an ancient deity, the local numen of Beersheba. Stark, whom others have followed, proposes to interpret the phrase translated "the Fear of Isaac" in <a onClick="return mV(\'Gen\',31,42,53);">Ge 31:42, 53</a> as the name of this god used by his worshippers, the Terror Isaac, Isaac the terrible god. For the sense of Isaac in that case see above under I,2,(1). Meyer (loc. cit.) defends the transfer of the name from a god to the hero of a myth, by comparing the sacrifice of Isaac ("the only story in which Isaac plays an independent role"!) with the Greek myth of Iphigenia\'s sacrifice (Hesiod, Euripides, etc.), in which the by-name of a goddess (Iphigenia) identified with Artemis has passed to the intended victim rescued by Artemis from death.<P>The most recent critical utterances reject both the foregoing views of Isaac as in conflict with the data of Genesis. Thus Gunkel (Schriften des Altes Testament, 5te Lieferung, 1910, 41) writes: "Quite clearly the names of Abraham, Isaac, and all the patriarchal women are not tribal names. ...The interpretation of the figures of Genesis as nations furnishes by no means a general key." And again: "Against the entire assumption that the principal patriarchal figures are originally gods, is above all to be noted that the names Jacob and Abraham are proved by the Babylonian to be personal names in current use, and at the same time that the sagas about them can in no wise be understood as echoes of original myths. Even Winckler\'s more than bold attempt to explain these sagas as original calendar-myths must be pronounced a complete failure." Yet Gunkel and those who share his position are careful to distinguish their own view from that of the "apologetes," and to concede no more than the bare fact that there doubtless were once upon a time persons named Abraham, Isaac, etc. For these critics Isaac is simply a name about which have crystallized cycles of folk-stories, that have their parallels in other lands and languages, but have received with a Hebrew name also a local coloring and significance on the lips of successive Hebrew story-tellers, saga-builders and finally collectors and editors; "Everyone who knows the history of sagas is sure that the saga is not able to preserve through the course of so many centuries, a true picture" of the patriarchs.`<a href="./study/isbe/search.html?string=ABRAHAM">ABRAHAM</a>`15';
isbe[4662]='Isaac, Testament of``<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`1';
isbe[4663]='Isaiah, 1-7`i-za\'-ya, i-zi\'-a:<P>1. Name<P>2. Personal History<P>3. Call<P>4. Literary Genius and Style<P>5. Traditions concerning His Martyrdom<P>6. Period<P>7. Analysis and Contents<P>8. Isaiah\'s Prophecies Chronologically Arranged<P>9. The Critical Problem<P class="in15">(1) The History of Criticism<P class="in15">(2) The Disintegration of "Deutero-Isaiah"<P class="in15">(3) Recent Views<P class="in15">(4) The Present State of the Question<P class="in15">(5) Reasons for Dissecting the Book<P class="in15">(6) Arguments for One Isaiah<p class="in30">(a) The Circle of Ideas<p class="in30">(b) The Literary Style<p class="in30">(c) Historical References<p class="in30">(d) The Predictire Element<p class="in30">(e) Cyrus a Subject of Prediction<P>LITERATURE<hr /><P>Of all Israel\'s celebrated prophets, Isaiah is the king. The writings which bear his name are among the profoundest in all literature. One great theme—salvation by faith—stamps them all. Isaiah is the Paul of the Old Testament.<P>1. Name:<P>In Hebrew yesha\'yahu, and yesha\'yah; Greek Esaias; Latin Esaias and Isaias. His name was symbolic of his message. Like "Joshua," it means "Yahweh saves," or "Yahweh is salvation," or "salvation of Yahweh."<P>2. Personal History:<P>Isaiah was the son of Amoz (not Amos). He seems to have belonged to a family of some rank, as may be inferred from his easy access to the king (<a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>), and his close intimacy with the priest (<a onClick="return mV(\'Isa\',8,2);">Isa 8:2</a>). Tradition says he was the cousin of King Uzziah. He lived in Jerusalem and became court preacher. He was married and had two sons: Shear-jashub, his name signifying "a remnant shall return" (<a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>), and Maher-shalal-hash-baz, "hasting to the spoil, hurrying to the prey," symbolic of Assyria\'s mad lust of conquest (<a onClick="return mV(\'Isa\',8,3);">Isa 8:3</a>). Jewish tradition, based upon a false interpretation of <a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a>, declares he was twice married.<P>3. Call:<P>In the year that King Uzziah died, Isaiah, apparently while worshipping in the temple, received a call to the prophetic office (<a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>). He responded with noteworthy alacrity, and accepted his commission, though he knew from the outset that his task was to be one of fruitless warning and exhortation (<a onClick="return mV(\'Isa\',6,\'9-13\');">6:9-13</a>). Having been reared in Jerusalem, he was well fitted to become the political and religious counselor of the nation, but the experience which prepared him most for his important work was the vision of the majestic and thrice-holy God which he saw in the temple in the death-year of King Uzziah. There is no good reason for doubting that this was his inaugural vision, though some regard it as a vision which came to him after years of experience in preaching and as intended to deepen his spirituality. While this is the only explicit "vision" Isaiah saw, yet his entire book, from first to last, is, as the title (<a onClick="return mV(\'Isa\',1,1);">1:1</a>) suggests, a "vision." His horizon, both political and spiritual, was practically unbounded. In a very true sense, as Delitzsch says, he was "the universal prophet of Israel."<p>4. Literary Genius and Style:<p>For versatility of expression and brilliancy of imagery Isaiah had no superior, not even a rival. His style marks the climax of Hebrew literary art. Both his periods and genius and descriptions are most finished and sublime. He is a perfect artist in words. Beauty and strength are characteristic of his entire book. Epigrams and metaphors, particularly of flood, storm and sound (<a onClick="return mV(\'Isa\',1,13);">1:13</A>; <a onClick="return mV(\'Isa\',5,18,22);">5:18,22</a>; <a onClick="return mV(\'Isa\',8,8);">8:8</a>; <a onClick="return mV(\'Isa\',10,22);">10:22</a>; <a onClick="return mV(\'Isa\',28,17,20);">28:17,20</A>; <a onClick="return mV(\'Isa\',30,28,30);">30:28,30</A>), interrogation and dialogue (<a onClick="return mV(\'Isa\',6,8);">6:8</A>; <a onClick="return mV(\'Isa\',10,8,9);">10:8,9</A>), antithesis and alliteration (<a onClick="return mV(\'Isa\',1,18);">1:18</A>; <a onClick="return mV(\'Isa\',3,24);">3:24</A>; <a onClick="return mV(\'Isa\',17,10,12);">17:10,12</A>), hyperbole and parable (<a onClick="return mV(\'Isa\',2,7);">2:7</A>; <a onClick="return mV(\'Isa\',5,\'1-7\');">5:1-7</A>; <a onClick="return mV(\'Isa\',28,\'23-29\');">28:23-29</A>), even paranomasia, or play upon words (<a onClick="return mV(\'Isa\',5,7);">5:7</A>; <a onClick="return mV(\'Isa\',7,9);">7:9</A>), characterize Isaiah\'s book as the great masterpiece of Hebrew literature.He is also famous for his richness of vocabulary and synonyms. For example, Ezekiel uses 1,535 words; Jeremiah, 1,653; the Psalmists 2,170; while Isaiah uses 2,186. Isaiah was also an orator: Jerome likened him to Demosthenes; and a poet: he frequently elaborates his messages in rhythmic or poetic style (<a onClick="return mV(\'Isa\',12,\'1-6\');">12:1-6</A>; <a onClick="return mV(\'Isa\',25,\'1-5\');">25:1-5</A>; <a onClick="return mV(\'Isa\',26,\'1-12\');">26:1-12</A>; <a onClick="return mV(\'Isa\',38,\'10-20\');">38:10-20</A>; <a onClick="return mV(\'Isa\',42,\'1-4\');">42:1-4</A>; <a onClick="return mV(\'Isa\',49,\'1-9\');">49:1-9</A>; <a onClick="return mV(\'Isa\',50,\'4-9\');">50:4-9</A>; <a onClick="return mV(\'Isa\',52,\'13-\');">52:13</A>-<a onClick="return mV(\'Isa\',53,\'1-12\');">53:12</A>; <a onClick="return mV(\'Isa\',60,\'1-\');">60-62</A>; <a onClick="return mV(\'Isa\',66,\'5-24\');">66:5-24</A>); and in several instances slips into elegiac rhythm, e.g. in <a onClick="return mV(\'Isa\',37,\'22-29\');">37:22-29</A> there is a fine taunting poem on Sennacherib, and in <a onClick="return mV(\'Isa\',14,\'4-23\');">14:4-23</A> another on the king of Babylon. As Driver observes, "Isaiah\'s poetical genius is superb."<p>5. Traditions concerning His Martyrdom:<p>Nothing definite or historical is known concerning the prophet\'s end. Toward the close of the 2nd century AD, however, there was a tradition to the effect that he suffered martyrdom in the heathen reaction which occurred under King Manasseh, because of certain speeches concerning God and the Holy City which his contemporaries alleged were contrary to the law. Indeed the Jewish Mishna explicitly states that Manasseh slew him. Justin Martyr also (150 AD), in his controversial dialogue with the Jew Trypho, reproaches the Jews with this accusation, "whom ye sawed asunder with a wooden saw"; this tradition is further confirmed by a Jewish Apocalypse of the 2nd century AD, entitled, The Ascension of Isaiah, and by Epiphanius in his so-called Lives of the Prophets. It is barely possible that there is an allusion to his martyrdom in <a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>, which reads, "They were stoned, they were sawn asunder," but this is by no means certain. In any case Isaiah probably survived the great catastrophe of the siege of Jerusalem by Sennacherib in 701 BC, and possibly also the death of Hezekiah in 699 BC; for in <a onClick="return mV(\'2Ch\',32,32);">2Ch 32:32</a> it is stated that Isaiah wrote a biography of King Hezekiah. If so, his prophetic activity extended over a period of more than 40 years. Dr. G. A. Smith extends it to "more than 50" (Jerusalem, II, 180; compare Whitehouse, "Isaiah," New Century Bible, I, 72).<p>6. Period:<p>According to the title of his book (<a onClick="return mV(\'Isa\',1,1);">1:1</A>), Isaiah prophesied during the reigns of Uzziah, Jotham, Ahaz and Hezekiah, kings of Judah. He dates his inaugural vision (<a onClick="return mV(\'Isa\',6,1);">6:1</A>) in Uzziah\'s death-year, which was approximately 740 BC. This marks, therefore, the beginning of his prophetic ministry. And we know that he was still active as late as the siege of Jerusalem by Sennacherib in 701 BC. Hence, the minimum period of his activity as a prophet was from 740 to 701 BC. As a young man Isaiah witnessed the rapid development of Judah into a strong commercial and military state; for under Uzziah Judah attained a degree of prosperity and strength never before enjoyed since the days of Solomon. Walls, towers, fortifications, a large standing army, a port for commerce on the Red Sea, increased inland trade, tribute from the Ammonites, success in war with the Philistines and the Arabians—all these became Judah\'s during Uzziah\'s long and prosperous reign of 52 years. But along with power and wealth came also avarice, oppression, religious formality and corruption. The temple revenues indeed were greatly increased, but religion and life were too frequently dissociated; the nation\'s progress was altogether material. During the reign of Jotham (740-736 BC), who for several years was probably associated with his father as co-regent, a new power began to appear over the eastern horizon. The Assyrians, with whom Ahab had come in contact at the battle of Karkar in 854 BC, and to whom Jehu had paid tribute in 842 BC, began to manifest anew their characteristic lust of conquest. Tiglathpileser III, who is called "Pul" in <a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a> and reigned over Assyria from 745 to 727 BC, turned his attention westward, and in 738 BC reduced Arpad, Calno, Carchemish, Hamath and Damascus, causing them to pay tribute. His presence in the West led Pekah, king of Northen Israel, and Rezin, king of Damascus, to form an alliance in order to resist further encroachment on the part of Assyria. When Ahaz refused to join their confederacy they resolved to dethrone him and set in his stead the son of Tabeel upon the throne of David (<a onClick="return mV(\'2Ki\',16,5);">2Ki 16:5</a>; <a onClick="return mV(\'Isa\',7,6);">Isa 7:6</a>). The struggle which ensued is commonly known as the Syro-Ephraimitic war (734 BC)—one of the great events in Isaiah\'s period. Ahaz in panic sent to Tiglath-pileser for help (<a onClick="return mV(\'2Ki\',16,7);">2Ki 16:7</a>), who of course responded with alacrity. The result was that the great Assyrian warrior sacked Gaza and carried all of Galilee and Gilead into captivity (734) and finally took Damascus (732 BC). Ahaz was forced to pay dearly for his protection and Judah was brought very low (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>; <a onClick="return mV(\'2Ki\',16,\'7-9\');">16:7-9</a>; <a onClick="return mV(\'2Ch\',28,19);">2Ch 28:19</a>; <a onClick="return mV(\'Isa\',7,1);">Isa 7:1</a>). The religious as well as the political effect of Ahaz\' policy was decidedly baneful. To please Tiglath-pileser, Ahaz went to Damascus to join in the celebration of his victories, and while there saw a Syrian altar, a pattern of which he sent to Jerusalem and had a copy set up in the temple in place of the brazen altar of Solomon. Thus Ahaz, with all the influence of a king, introduced idolatry into Jerusalem, even causing his sons to pass through the fire (<a onClick="return mV(\'2Ki\',16,\'10-16\');">2Ki 16:10-16</a>; <a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>).<p>5. Traditions concerning His Martyrdom:<p>Nothing definite or historical is known concerning the prophet\'s end. Toward the close of the 2nd century AD, however, there was a tradition to the effect that he suffered martyrdom in the heathen reaction which occurred under King Manasseh, because of certain speeches concerning God and the Holy City which his contemporaries alleged were contrary to the law. Indeed the Jewish Mishna explicitly states that Manasseh slew him. Justin Martyr also (150 AD), in his controversial dialogue with the Jew Trypho, reproaches the Jews with this accusation, "whom ye sawed asunder with a wooden saw"; this tradition is further confirmed by a Jewish Apocalypse of the 2nd century AD, entitled, The Ascension of Isaiah, and by Epiphanius in his so-called Lives of the Prophets. It is barely possible that there is an allusion to his martyrdom in <a onClick="return mV(\'Hbr\',11,37);">Heb 11:37</a>, which reads, "They were stoned, they were sawn asunder," but this is by no means certain. In any case Isaiah probably survived the great catastrophe of the siege of Jerusalem by Sennacherib in 701 BC, and possibly also the death of Hezekiah in 699 BC; for in <a onClick="return mV(\'2Ch\',32,32);">2Ch 32:32</a> it is stated that Isaiah wrote a biography of King Hezekiah. If so, his prophetic activity extended over a period of more than 40 years. Dr. G. A. Smith extends it to "more than 50" (Jerusalem, II, 180; compare Whitehouse, "Isaiah," New Century Bible, I, 72).<p>6. Period:<p>According to the title of his book (<a onClick="return mV(\'Isa\',1,1);">1:1</A>), Isaiah prophesied during the reigns of Uzziah, Jotham, Ahaz and Hezekiah, kings of Judah. He dates his inaugural vision (<a onClick="return mV(\'Isa\',6,1);">6:1</A>) in Uzziah\'s death-year, which was approximately 740 BC. This marks, therefore, the beginning of his prophetic ministry. And we know that he was still active as late as the siege of Jerusalem by Sennacherib in 701 BC. Hence, the minimum period of his activity as a prophet was from 740 to 701 BC. As a young man Isaiah witnessed the rapid development of Judah into a strong commercial and military state; for under Uzziah Judah attained a degree of prosperity and strength never before enjoyed since the days of Solomon. Walls, towers, fortifications, a large standing army, a port for commerce on the Red Sea, increased inland trade, tribute from the Ammonites, success in war with the Philistines and the Arabians—all these became Judah\'s during Uzziah\'s long and prosperous reign of 52 years. But along with power and wealth came also avarice, oppression, religious formality and corruption. The temple revenues indeed were greatly increased, but religion and life were too frequently dissociated; the nation\'s progress was altogether material. During the reign of Jotham (740-736 BC), who for several years was probably associated with his father as co-regent, a new power began to appear over the eastern horizon. The Assyrians, with whom Ahab had come in contact at the battle of Karkar in 854 BC, and to whom Jehu had paid tribute in 842 BC, began to manifest anew their characteristic lust of conquest. Tiglathpileser III, who is called "Pul" in <a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a> and reigned over Assyria from 745 to 727 BC, turned his attention westward, and in 738 BC reduced Arpad, Calno, Carchemish, Hamath and Damascus, causing them to pay tribute. His presence in the West led Pekah, king of Northern Israel, and Rezin, king of Damascus, to form an alliance in order to resist further encroachment on the part of Assyria. When Ahaz refused to join their confederacy they resolved to dethrone him and set in his stead the son of Tabeel upon the throne of David (<a onClick="return mV(\'2Ki\',16,5);">2Ki 16:5</a>; <a onClick="return mV(\'Isa\',7,6);">Isa 7:6</a>). The struggle which ensued is commonly known as the Syro-Ephraimitic war (734 BC)—one of the great events in Isaiah\'s period. Ahaz in panic sent to Tiglath-pileser for help (<a onClick="return mV(\'2Ki\',16,7);">2Ki 16:7</a>), who of course responded with alacrity. The result was that the great Assyrian warrior sacked Gaza and carried all of Galilee and Gilead into captivity (734) and finally took Damascus (732 BC). Ahaz was forced to pay dearly for his protection and Judah was brought very low (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>; <a onClick="return mV(\'2Ki\',16,\'7-9\');">16:7-9</a>; <a onClick="return mV(\'2Ch\',28,19);">2Ch 28:19</a>; <a onClick="return mV(\'Isa\',7,1);">Isa 7:1</a>). The religious as well as the political effect of Ahaz\' policy was decidedly baneful. To please Tiglath-pileser, Ahaz went to Damascus to join in the celebration of his victories, and while there saw a Syrian altar, a pattern of which he sent to Jerusalem and had a copy set up in the temple in place of the brazen altar of Solomon. Thus Ahaz, with all the influence of a king, introduced idolatry into Jerusalem, even causing his sons to pass through the fire (<a onClick="return mV(\'2Ki\',16,\'10-16\');">2Ki 16:10-16</a>; <a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>).<p>Hezekiah succeeded Ahaz, beginning to rule at the age of 25 and reigning 29 years (727-699 BC). Isaiah was at least 15 years his senior. The young king inherited from his father a heavy burden. The splendor of Uzziah\'s and Jotham\'s reigns was rapidly fading before the ever-menacing and avaricious Assyrians. Hezekiah began his reign with reformation. "He removed the high places, and brake the pillars, and cut down the Asherah" (<a onClick="return mV(\'2Ki\',18,4,22);">2Ki 18:4, 22</a>). He even invited the surviving remnant of Northern Israel to join in celebrating the Passover (<a onClick="return mV(\'2Ch\',30,1);">2Ch 30:1</a>). But Israel\'s end was drawing near. Hoshea, the vacillating puppet-king of Northern Israel (730-722 BC), encouraged by Egypt, refused longer to pay Assyria his annual tribute (<a onClick="return mV(\'2Ki\',17,4);">2Ki 17:4</a>); whereupon Shalmaneser IV, who had succeeded Tiglath-pileser, promptly appeared before the gates of Samaria in 724 BC, and for 3 weary years besieged the city (<a onClick="return mV(\'2Ki\',17,5);">2Ki 17:5</a>). Finally, the city was captured by Sargon II, who succeeded Shalmaneser IV in 722 BC, and 27,292 of Israel\'s choicest people (according to Sargon\'s own description) were deported to Assyria, and colonists were brought from Babylon and other adjacent districts and placed in the cities of Samaria (<a onClick="return mV(\'2Ki\',17,6,24);">2Ki 17:6, 24</a>). Thus the kingdom of Northern Israel passed into oblivion, and Judah was left ever after quite exposed to the direct ravages, political and religious, of her Assyrio-Babylonian neighbors. In fact Judah herself barely escaped destruction by promising heavy tribute. This was the second great political crisis during Isaiah\'s ministry. Other crises were soon to follow. One was the desperate illness of King Hezekiah, who faced assured death in 714 BC. Being childless, he was seriously concerned for the future of the Davidic dynasty. He resorted to prayer, however, and God graciously extended his life 15 years (<a onClick="return mV(\'2Ki\',20,\'1-\');">2Ki 20</a>; <a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</a>). His illness occurred during the period of Babylon\'s independence under Merodach-baladan, the ever-ambitious, irresistible and uncompromising enemy of Assyria, who for 12 years (721-709 BC) maintained independent supremacy over Babylon. Taking advantage of Hezekiah\'s wonderful cure, Merodach seized the opportunity of sending an embassy to Jerusalem to congratulate him on his recovery (712 BC), and at the same time probably sought to form an alliance with Judah to resist Assyrian supremacy (<a onClick="return mV(\'2Ki\',20,12);">2Ki 20:12</a>ff; <a onClick="return mV(\'Isa\',39,\'1-\');">Isa 39</a>). Nothing, however, came of the alliance, for the following year Sargon\'s army reappeared in Philistia in order to discipline Ashdod for conspiracy with the king of Egypt (711 BC). The greatest crisis was yet to come. Its story is as follows: Judah and her neighbors groaned more and more under the heavy exactions of Assyria. Accordingly, when Sargon was assassinated and Sennacherib came to the throne in 705 BC, rebellion broke out on all sides. Merodach-baladan, who had been expelled by Sargon in 709 BC, again took Babylon and held it for at least six months in 703 BC. Hezekiah, who was encouraged by Egypt and all Philistia, except Padi of Ekron, the puppet-king of Sargon, refused longer to pay Assyria tribute (<a onClick="return mV(\'2Ki\',18,7);">2Ki 18:7</a>). Meanwhile a strong pro-Egyptian party had sprung up in Jerusalem. In view of all these circumstances, Sennacherib in 701 BC marched westward with a vast army, sweeping everything before him. Tyre was invested though not taken; on the other hand, Joppa, Eltekeh, Ekron, Ashkelon, Ammon, Moab, and Edom all promptly yielded to his demands. Hezekiah was panic stricken and hastened to bring rich tribute, stripping even the temple and the palace of their treasures to do so (<a onClick="return mV(\'2Ki\',18,\'13-16\');">2Ki 18:13-16</a>). But Sennacherib was not satisfied. He overran Judah, capturing, as he tells us in his inscription, 46 walled towns and smaller villages without number, carrying 200,150 of Judah\'s population into captivity to Assyria, and demanding as tribute 800 talents of silver and 30 talents of gold, in all, over $1,500,000; he took also, he claims, Hezekiah\'s daughters and palace women, seized his male and female singers, and carried away enormous spoil. But the end was not yet. Sennacherib himself, with the bulk of the army, halted in Philistia to reduce Lachish; thence he sent a strong detachment under his commander-in-chief, the Rabshakeh, to besiege Jerusalem (<a onClick="return mV(\'2Ki\',18,\'17-\');">2Ki 18:17</A>-<a onClick="return mV(\'Isa\',19,\'1-8\');">19:8</a>; <a onClick="return mV(\'Isa\',36,\'2-\');">Isa 36:2</A>-<a onClick="return mV(\'Isa\',37,\'1-8\');">37:8</a>). As he describes this blockade in his own inscription: "I shut up Hezekiah in Jerusalem like a bird in a cage." The Rabshakeh, however, failed to capture the city and returned to Sennacherib, who meanwhile had completely conquered Lachish, and was now warring against Libnab. A second expedition against Jerusalem was planned, but hearing that Tirhakah (at that time the commander-in-chief of Egypt\'s forces and only afterward "king of Ethiopia") was approaching, Sennacherib was forced to content himself with sending messengers with a letter to Hezekiah, demanding immediate surrender of the city (<a onClick="return mV(\'2Ki\',19,9);">2Ki 19:9</a>ff; <a onClick="return mV(\'Isa\',37,9);">Isa 37:9</a>). Hezekiah, however, through Isaiah\'s influence held out; and in due time, though Sennacherib disposed of Tirhakah\'s army without difficulty, his immense host in some mysterious way—by plague or otherwise—was suddenly smitten, and the great Assyrian conqueror was forced to return to Nineveh; possibly because Merodach-baladan had again appeared in Babylonia. Sennacherib never again returned to Palestine, so far as we know, during the subsequent 20 years of his reign, though he did make an independent expedition into North Arabia (691-689 BC). This invasion of Judah by Sennacherib in 701 BC was the great political event in Isaiah\'s ministry. Had it not been for the prophet\'s statesmanship, Jerusalem might have capitulated. As it was, only a small, insignificantly small, remnant of Judah\'s population escaped. Isaiah had at this time been preaching 40 years. How much longer he labored is not known.<p>7. Analysis and Contents:<p>There are six general divisions of the book:<p>(1) <span class="noTag">Isa 1-12</span>, prophecies concerning Judah and Jerusalem, closing with promises of restoration and a psalm of thanksgiving;<p>(2) <span class="noTag">Isa 13-23</span>, oracles of judgment and salvation, for the most part concerning those foreign nations whose fortunes affected Judah and Jerusalem;<p>(3) <span class="noTag">Isa 24-27</span>, Yahweh\'s world-judgment in the redemption of Israel;<p>(4) <span class="noTag">Isa 28-35</span>, a cycle of prophetic warnings against alliance with Egypt, closing with a prophecy concerning Edom and a promise of Israel\'s ransom;<p>(5) <span class="noTag">Isa 36-39</span>, history, prophecy and song intermingled; serving both as an appendix to <span class="noTag">Isa 1-35</span>, and as an introduction to <span class="noTag">Isa 40-66</span>;<p>(6) <span class="noTag">Isa 40-66</span>, prophecies of comfort and salvation, and also of the future glory awaiting Israel.<p>By examining in detail these several divisions we can trace better the prophet\'s thought.<p>Thus, <a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1-12</a> unfold Judah\'s social sins (<a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1-6</a>), and her political entanglements (<a onClick="return mV(\'Isa\',7,\'1-\');">Isa 7-12</a>);<p><a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1</a> is an introduction, in which the prophet strikes the chief notes of his entire book: namely, <p class="in15">thoughtlessness (<a onClick="return mV(\'Isa\',1,\'2-9\');">1:2-9</A>), <p class="in15">formalism in worship (<a onClick="return mV(\'Isa\',1,\'10-17\');">1:10-17</A>), <p class="in15">pardon (<a onClick="return mV(\'Isa\',1,\'18-23\');">1:18-23</A>) and <p class="in15">judgment (<a onClick="return mV(\'Isa\',1,\'24-31\');">1:24-31</A>).<p><a onClick="return mV(\'Isa\',2,\'1-\');">Isa 2-4</a> contain three distinct pictures of Zion:<p class="in15">(a) her exaltation (<a onClick="return mV(\'Isa\',2,\'2-4\');">2:2-4</A>),<p class="in15">(b) her present idolatry (<a onClick="return mV(\'Isa\',2,\'5-\');">2:5-4:1</a>), and <p class="in15">(c) her eventual purification (<a onClick="return mV(\'Isa\',4,\'2-6\');">4:2-6</A>).<p><a onClick="return mV(\'Isa\',5,\'1-\');">Isa 5</a> contains an arraignment of Judah and Jerusalem, composed of three parts:<p class="in15">(a) a parable of Yahweh\'s vineyard (<a onClick="return mV(\'Isa\',5,\'1-7\');">5:1-7</A>);<p class="in15">(b) a series of six woes pronounced against<br>insatiable greed (<a onClick="return mV(\'Isa\',5,\'8-10\');">5:8-10</A>),<br>dissipation (<a onClick="return mV(\'Isa\',5,\'11-17\');">5:11-17</A>), daring defiance against Yahweh (<a onClick="return mV(\'Isa\',5,18,19);">5:18,19</A>),<br>confusion of moral distinctions (<a onClick="return mV(\'Isa\',5,20);">5:20</A>),<br>political self-conceit (<a onClick="return mV(\'Isa\',5,21);">5:21</A>), and <br>misdirected heroism (<a onClick="return V(\'Isa\',5,22,23);">5:22,23</A>); and<p class="in15">(c) an announcement of imminent judgment. The Assyrian is on the way and there will be no escape (<a onClick="return mV(\'Isa\',5,\'24-30\');">5:24-30</A>).<p><a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a> recounts the prophet\'s inaugural vision and commission. It is really an apologetic, standing as it does after the prophet\'s denunciations of his contemporaries. When they tacitly object to his message of threatening and disaster, he is able to reply that, having pronounced "woe" upon himself in the year that King Uzziah died, he had the authority to pronounce woe upon them (<a onClick="return mV(\'Isa\',6,5);">6:5</A>). Plainly Isaiah tells them that Judah\'s sins are well-nigh hopeless. They are becoming spiritually insensible. They have eyes but they cannot see. Only judgment can, avail: "the righteous judgment of a forgotten God" awaits them. A "holy seed," however, still existed in Israel\'s stock (<a onClick="return mV(\'Isa\',6,13);">6:13</A>).<p>Coming to <a onClick="return mV(\'Isa\',7,\'1-\');">Isa 7-12</a>, Isaiah appears in the role of a practical statesman. He warns Ahaz against political entanglements with Assyria. The section <span class="noTag">7:1-9:7</span> is a prophecy of Immanuel, history and prediction being intermingled.<p>They describe the Syro-Ephraimitic uprising in 736 BC, when Pekah of Northern Israel and Rezin of Damascus, in attempting to defend themselves against the Assyrians, demanded that Ahaz of Jerusalem should become their ally. But Ahaz preferred the friendship of Assyria, and refused to enter into alliance with them. And in order to defend himself, he applied to Assyria for assistance, sending ambassadors with many precious treasures, both royal and sacred, to bribe Tiglath-pileser. It was at this juncture that Isaiah, at Yahweh\'s bidding, expostulates with Ahaz concerning the fatal step he is about to take, and as a practical statesman warns Ahaz, "the king of No-Faith," that the only path of safety lies in loyalty to Yahweh and keeping clear of foreign alliances; that "God is with us" for salvation; and that no "conspiracy" can possibly be successful unless God too is against us. When, however, the prophet\'s message of promise and salvation finds no welcome, he commits it to his disciples, bound up and sealed for future use; assuring his hearers that unto them a child is born and unto them a son is given, in whose day the empire of David will be established upon a basis of justice and righteousness. The Messianic scion is the ground of the prophet\'s hope; which hope, though unprecedented, he thus early in his ministry commits, written and sealed, to his inner circle of "disciples."<p>See, further, <a href="study/isbe/search.html?string=IMMANUEL">IMMANUEL</A>.<p>The section <a onClick="return mV(\'Isa\',9,\'8-\');">Isa 9:8</a>-<a onClick="return mV(\'Isa\',10,\'1-4\');">10:4</a> contains an announcement to Northern Israel of accumulated wrath and impending ruin, with a refrain (<a onClick="return mV(\'Isa\',9,12,17,21);">9:12,17,21</A>; <a onClick="return mV(\'Isa\',10,4);">10:4</A>). Here, in an artistic poem composed of four strophes, the prophet describes the great calamities which Yahweh has sent down upon Northern Israel but which have gone unheeded:<br>foreign invasion (<a onClick="return mV(\'Isa\',9,\'8-12\');">9:8-12</A>),<br>defeat in battle (<a onClick="return mV(\'Isa\',9,\'13-17\');">9:13-17</A>),<br>anarchy (<a onClick="return mV(\'Isa\',9,\'18-21\');">9:18-21</A>), and<br>impending captivity (<a onClick="return mV(\'Isa\',10,\'1-4\');">10:1-4</A>).<p>Yet Yahweh\'s judgments have gone unheeded: "For all this his anger is not turned away, but his hand is stretched out still." Divine discipline has failed; only judgment remains.<p>In <a onClick="return mV(\'Isa\',10,\'5-34\');">Isa 10:5-34</a>, Assyria is declared to be an instrument of Yahweh, the rod of Yahweh\'s anger. <p><a onClick="return mV(\'Isa\',11,\'1-\');">Isa 11</A>-<a onClick="return mV(\'Isa\',12,\'1-\');">12</a> predict Israel\'s return from exile, including a vision of the Messiah\'s reign of ideal peace. For Isaiah\'s vision of the nation\'s future reached far beyond mere exile. To him the downfall of Assyria was the signal for the commencement of a new era in Israel\'s history. Assyria has no future, her downfall is fatal; Judah has a future, her calamities are only disciplinary. An Ideal Prince will be raised up in whose advent all Nature will rejoice, even dumb animals (<a onClick="return mV(\'Isa\',11,\'1-10\');">11:1-10</A>). A second great exodus will take place, for the Lord will set His hand again "the second time" to recover the remnant of His people "from the four corners of the earth" (<a onClick="return mV(\'Isa\',11,11,12);">11:11,12</A>). In that day, "Ephraim shall not envy Judah, and Judah shall not vex Ephraim" (<a onClick="return mV(\'Isa\',11,13);">11:13</A>). On the contrary, the reunited nation, redeemed and occupying their rightful territory (<a onClick="return mV(\'Isa\',11,\'14-16\');">11:14-16</A>), shall sing a hymn of thanksgiving, proclaiming the salvation of Yahweh to all the earth (<a onClick="return mV(\'Isa\',12,\'1-\');">Isa 12</a>). <p><a onClick="return mV(\'Isa\',13,\'1-\');">Isaiah 13-23</a> contain oracles of judgment and salvation, for the most part concerning those foreign nations whose fortunes affected Judah and Jerusalem. They are grouped together by the editor, as similar foreign oracles are in <a onClick="return mV(\'Isa\',46,\'1-\');">Jer 46-51</a> and <a onClick="return mV(\'Eze\',25,\'1-\');">Eze 25-32</a>. Isaiah\'s horizon was world-wide. First among the foreign prophecies stands the oracle concerning Babylon (<a onClick="return mV(\'Isa\',13,\'1-\');">Isa 13:1</A>-<a onClick="return mV(\'Isa\',14,\'1-23\');">14:23</a>), in which he predicts the utter destruction of the city (<a onClick="return mV(\'Isa\',13,\'2-22\');">Isa 13:2-22</a>), and sings a dirge or taunt-song over her fallen king (<a onClick="return mV(\'Isa\',14,\'4-23\');">Isa 14:4-23</a>). The king alluded to is almost beyond doubt an Assyrian (not a Babylonian) monarch of the 8th century; the brief prophecy immediately following in <a onClick="return mV(\'Isa\',14,\'24-27\');">Isa 14:24-27</a> concerning Assyria tacitly confirms this interpretation. Another brief oracle concerning Babylon (<a onClick="return mV(\'Isa\',21,\'1-10\');">21:1-10</A>) describes the city\'s fall as imminent. Both oracles stand or fall together as genuine prophecies of Isaiah. Both seem to have been written in Jerusalem (<a onClick="return mV(\'Isa\',13,2);">13:2</a>; <a onClick="return mV(\'Isa\',21,9,10);">21:9,10</A>). It cannot be said that either is absolutely unrelated in thought and language to Isaiah\'s age (<a onClick="return mV(\'Isa\',14,13);">14:13</a>; <a onClick="return mV(\'Isa\',21,2);">21:2</a>); each foretells the doom to fall on Babylon (<a onClick="return mV(\'Isa\',13,19);">13:19</A>; <a onClick="return mV(\'Isa\',21,9);">21:9</a>) at the hands of the Medes (<a onClick="return mV(\'Isa\',13,17);">13:17</A>; <a onClick="return mV(\'Isa\',21,2);">21:2</A>); and each describes the Israelites as already in exile—but not necessarily all Israel.<p>The section <a onClick="return mV(\'Isa\',14,\'24-27\');">Isa 14:24-27</a> tells of the certain destruction of the Assyrian.<p>The passage <a onClick="return mV(\'Isa\',14,\'28-32\');">Isa 14:28-32</a> is an oracle concerning Philistia.<p><a onClick="return mV(\'Isa\',15,\'1-\');">Isaiah 15</A>-<a onClick="return mV(\'Isa\',16,\'1-\');">16</a> are ancient oracles against Moab, whose dirgelike meter resembles that of <a onClick="return mV(\'Isa\',13,\'1-\');">Isa 13</a>-<a onClick="return mV(\'Isa\',14,\'1-\');">14</a>. It is composed of two separate prophecies belonging to two different periods in Isaiah\'s ministry (<a onClick="return mV(\'Isa\',16,13,14);">16:13,14</A>). The three points of particular interest in the oracle are:<p class="in15">(1) the prophet\'s tender sympathy for Moab in her affliction (<a onClick="return mV(\'Isa\',15,5);">15:5</A>; <a onClick="return mV(\'Isa\',16,11);">16:11</A>). Isaiah mingles his own tears with those of the Moabites. As Delitzsch says, "There is no prophecy in the Book of Isaiah in which the heart of the prophet is so painfully moved by what his spirit beholds and his mouth must prophecy."<p class="in15">(2) Moab\'s pathetic appeal for shelter from her foes; particularly the ground on which she urges it, namely, the Messianic hope that the Davidic dynasty shall always stand and be able to repulse its foes (<a onClick="return mV(\'Isa\',16,5);">16:5</A>). The prophecy is an echo of <a onClick="return mV(\'Isa\',9,5,6,7);">9:5-7</A>.<p class="in15">(3) The promise that a remnant of Moab, though small, shall be saved (<a onClick="return mV(\'Isa\',16,14);">16:14</a>). Wearied of prayer to Chemosh in his high places, the prophet predicts that Moab will seek the living God (<a onClick="return mV(\'Isa\',16,12);">16:12</A>). <p>The passage <a onClick="return mV(\'Isa\',17,\'1-11\');">Isa 17:1-11</a> is an oracle concerning Damascus and Northern Israel, in which Isaiah predicts the fate of the two allies—Syria and Ephraim—in the Syro-Ephraimitic war of 734 BC, with a promise that only a scanty remnant will survive (<a onClick="return mV(\'Isa\',17,6);">17:6</a>). In <a onClick="return mV(\'Isa\',17,\'12-14\');">17:12-14</a>, the prophet boldly announces the complete annihilation of Judah\'s unnamed foes—the Assyrians. <p><a onClick="return mV(\'Isa\',18,\'1-\');">Isaiah 18</a> describes Ethiopia as in great excitement, sending ambassadors hither and thither—possibly all the way to Jerusalem—ostensibly seeking aid in making preparations for war. Assyria had already taken Damascus (732 BC) and Samaria (722 BC), and consequently Egypt and Ethiopia were in fear of invasion. Isaiah bids the ambassadors to return home and quietly watch Yahweh thwart Assyria\'s self-confident attempt to subjugate Judah; and he adds that when the Ethiopians have seen God\'s hand in the coming deliverance of Judah and Jerusalem (701 BC), they will bring a present to Yahweh to His abode in Mount Zion. <p><a onClick="return mV(\'Isa\',19,\'1-\');">Isaiah 19</a>, which is an oracle concerning Egypt, contains both a threat (<a onClick="return mV(\'Isa\',19,\'1-17\');">19:1-17</a>) and a promise (<a onClick="return mV(\'Isa\',19,\'18-25\');">19:18-25</a>), and is one of Isaiah\'s most remarkable foreign messages. Egypt is smitten and thereby led to abandon her idols for the worship of Yahweh (<a onClick="return mV(\'Isa\',19,\'19-22\');">19:19-22</a>). Still more remarkable, it is prophesied that in that day Egypt and Assyria will join with Judah in a triple alliance of common worship to Yahweh and of blessing to others (<a onClick="return mV(\'Isa\',19,\'23-25\');">19:23-25</a>). Isaiah\'s missionary outlook here is wonderful!<p><a onClick="return mV(\'Isa\',20,\'1-\');">Isaiah 20</a> describes Sargon\'s march against Egypt and Ethiopia, containing a brief symbolic prediction of Assyria\'s victory over Egypt and Ethiopia. By donning a captive\'s garb for three years, Isaiah attempts to teach the citizens of Jerusalem that the siege of Ashdod was but a means to an end in Sargon\'s plan of campaign, and that it was sheer folly for the Egyptian party in Jerusalem, who were ever urging reliance upon Egypt, to look in that direction for help. <a onClick="return mV(\'Isa\',21,11,12);">Isaiah 21:11-12</a> is a brief oracle concerning Seir or Edom, "the only gentle utterance in the Old Testament upon Israel\'s hereditary foe." Edom is in great anxiety. The prophet\'s answer is disappointing, though its tone is sympathetic. <a onClick="return mV(\'Isa\',21,13);">Isaiah 21:13</a>ff is a brief oracle concerning Arabia. It contains a sympathetic appeal to the Temanites to give bread and water to the caravans of Dedan, who have been driven by war from their usual route of travel.<p><a onClick="return mV(\'Isa\',22,\'1-\');">Isaiah 22</a> is concerning the foreign temper within theocracy. It is composed of two parts:<p>(1) an oracle "of the valley of vision," i.e. Jerusalem (<a onClick="return mV(\'Isa\',22,\'1-14\');">22:1-14</a>); and<p>(2) a philippic against Shebna, the comptroller of the palace. Isaiah pauses, as it were, in his series of warnings to foreign nations to rebuke the foreign temper of the frivolous inhabitants of Jerusalem, and in particular Shebna, a high official in the government.<p>The reckless and God-ignoring citizens of the capital are pictured as indulging themselves in hilarious eating and drinking, when the enemy is at that very moment standing before the gates of the city. Shebna, on the other hand, seems to have been an ostentatious foreigner, perhaps a Syrian by birth, quite possibly one of the Egyptian party, whose policy was antagonistic to that of Isaiah and the king. Isaiah\'s prediction of Shebna\'s fall was evidently fulfilled (<a onClick="return mV(\'Isa\',36,3);">36:3</a>; <a onClick="return mV(\'Isa\',37,2);">37:2</a>).<p><a onClick="return mV(\'Isa\',23,\'1-\');">Isaiah 23</a> is concerning Tyre. In this oracle Isaiah predicts that Tyre shall be laid waste (<a onClick="return mV(\'Isa\',23,1);">23:1</a>), her commercial glory humbled (<a onClick="return mV(\'Isa\',23,9);">23:9</a>), her colonies become independent of her (<a onClick="return mV(\'Isa\',23,10);">23:10</a>), and she herself forgotten for "seventy years" (<a onClick="return mV(\'Isa\',23,15);">23:15</a>); but "after the end of seventy years," her trade will revive, her business prosperity will return, and she will dedicate her gains in merchandise as holy to Yahweh (<a onClick="return mV(\'Isa\',23,18);">23:18</a>).<p>The third great section of the Book of Isaiah embraces <a onClick="return mV(\'Isa\',24,\'1-\');">Isa 24-27</a>, which tell of Yahweh\'s world-judgment, issuing in the redemption of Israel. These prophecies stand closely related to <a onClick="return mV(\'Isa\',13,\'1-\');">Isa 13-23</a>. They express the same tender emotion as that already observed in <a onClick="return mV(\'Isa\',15,5);">15:5</A>; <a onClick="return mV(\'Isa\',16,11);">16:11</a>, and sum up as in one grand finale the prophet\'s oracles to Israel\'s neighbors. For religious importance they stand second to none in the Book of Isaiah, teaching the necessity of Divine discipline and the glorious redemption awaiting the faithful in Israel. They are a spiritual commentary on the great Assyrian crisis of the 8th century; they are messages of salvation intended, not for declamation, but for meditation, and were probably addressed more particularly to the prophet\'s inner circle of "disciples" (<a onClick="return mV(\'Isa\',8,16);">8:16</a>). These chapters partake of the nature of apocalypse. Strictly speaking, however, they are prophecy, not apocalypse. No one ascends into heaven or talks with an angel, as in <a onClick="return mV(\'Dan\',7,\'1-\');">Da 7</a> and <a onClick="return mV(\'Rev\',4,\'1-\');">Re 4</a>. They are apocalypse only in the sense that certain things are predicted as sure to come to pass. Isaiah was fond of this kind of prophecy. He frequently lifts his reader out of the sphere of mere history to paint pictures of the far-off, distant future (<a onClick="return mV(\'Isa\',2,2,3,4);">2:2-4</a>; <a onClick="return mV(\'Isa\',21,\'2-6\');">4:2-6</a>; <a onClick="return mV(\'Isa\',11,\'6-16\');">11:6-16</a>; <a onClick="return mV(\'Isa\',30,\'27-30\');">30:27-33</a>).<p>In <a onClick="return mV(\'Isa\',24,\'1-\');">Isa 24</a> the prophet announces a general judgment of the earth (i.e. the land of Judah), and of "the city" (collective, for Judah\'s towns), after which will dawn a better day (<a onClick="return mV(\'Isa\',24,\'1-15\');">24:1-15</a>). The prophet fancies he hears songs of deliverance, but alas! they are premature; more judgment must follow. In <a onClick="return mV(\'Isa\',25,\'1-\');">Isa 25</a> the prophet transports himself to the period after the Assyrian catastrophe and, identifying himself with the redeemed, puts into their mouths songs of praise and thanksgiving for their deliverance. <a onClick="return mV(\'Isa\',25,\'6-8\');">Isa 25:6-8</a> describe Yahweh\'s bountiful banquet on Mount Zion to all nations, who, in keeping with <a onClick="return mV(\'Isa\',2,2,3,4);">2:2-4</a>, come up to Jerusalem, to celebrate "a feast of fat things," rich and marrowy. While the people are present at the banquet, Yahweh graciously removes their spiritual blindness so that they behold Him as the true dispenser of life and grace. He also abolishes violent death, that is to say, war (compare <a onClick="return mV(\'Isa\',2,4);">2:4</a>) and its sad accompaniment, "tears," so that "the earth" (i.e. the land of Judah) is no longer the battlefield of the nations, but the blessed abode of the redeemed, living in peace and happiness. The prophet\'s aim is not political but religious.<p>In <a onClick="return mV(\'Isa\',26,\'1-19\');">Isa 26:1-19</a> Judah sings a song over Jerusalem, the impregnable city of God. The prophet, taking again his stand with the redeemed remnant of the nation, vividly portrays their thankful trust in Yahweh, who has been unto them a veritable "Rock of Ages" (<a onClick="return mV(\'Isa\',26,4);">26:4</a> margin). With hope he joyfully exclaims, Let Yahweh\'s dead ones live! Let Israel\'s dead bodies arise! Yahweh will bring life from the dead! (<a onClick="return mV(\'Isa\',26,19);">26:19</a>). This is the first clear statement of the resurrection in the Old Testament. But it is national and restricted to Israel (compare <a onClick="return mV(\'Isa\',26,14);">26:14</a>), and is merely Isaiah\'s method of expressing a hope of the return of Israel\'s faithful ones from captivity (compare <a onClick="return mV(\'Hsa\',6,2);">Ho 6:2</a>; <a onClick="return mV(\'Eze\',37,\'1-14\');">Eze 37:1-14</a>; <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>).<p>In <a onClick="return mV(\'Isa\',26,\'20-\');">Isa 26:20</a>-<a onClick="return mV(\'Isa\',27,\'1-13\');">27:13</a> the prophet shows that Israel\'s chastisements are salutary. He begins by exhorting his own people, his disciples, to continue a little longer in the solitude of prayer, till God\'s wrath has shattered the world-powers (<a onClick="return mV(\'Isa\',26,\'20-\');">26:20</a>-<a onClick="return mV(\'Isa\',27,1);">27:1</a>). He next predicts that the true vineyard of Yahweh will henceforth be safely guarded against the briars and thorns of foreign invasion (<a onClick="return mV(\'Isa\',27,\'2-6\');">27:2-6</a>). And then, after showing that Yahweh\'s chastisements of Israel were light compared with His judgments upon other nations (<a onClick="return mV(\'Isa\',27,\'7-11\');">27:7-11</a>), he promises that if Israel will only repent, Yahweh will spare no pains to gather "one by one" the remnant of His people from Assyria and Egypt (compare <a onClick="return mV(\'Isa\',11,11);">11:11</a>); and together they shall once more worship Yahweh in the holy mountain at Jerusalem (<a onClick="return mV(\'Isa\',27,12,13);">27:12,13</a>).<p>The prophet\'s fundamental standpoint in <a onClick="return mV(\'Isa\',24,\'1-\');">Isa 24-27</a> is the same as that of <a onClick="return mV(\'Isa\',2,2,3,4);">2:2-4</a> and <a onClick="return mV(\'Isa\',13,\'1-\');">Isa 13-23</a>. Yet the prophet not infrequently throws himself forward into the remote future, oscillating backward and forward between his own times and those of Israel\'s restoration. It is especially noteworthy how he sustains himself in a long and continued transportation of himself to the period of Israel\'s redemption. He even studies to identify himself with the new Israel which will emerge out of the present chaos of political events. His visions of Israel\'s redemption carry him in ecstasy far away into the remote future, to a time when the nation\'s sufferings are all over; so that when he writes down what he saw in vision he describes it as a discipline that is past. For example, in <a onClick="return mV(\'Isa\',25,\'1-8\');">25:1-8</a> the prophet, transported to the end of time, celebrates in song what he saw, and describes how the fall of the world-empire is followed by the conversion of the heathen. In <a onClick="return mV(\'Isa\',26,8,9);">26:8,9</a> he looks back into the past from the standpoint of the redeemed in the last days, and tells how Israel longingly waited for the manifestation of God\'s righteousness which has now taken place, while in <a onClick="return mV(\'Isa\',27,7,8,9);">27:7-9</a> he places himself in the midst of the nation\'s sufferings, in full view of their glorious future, and portrays how Yahweh\'s dealings with Israel have not been the punishment of wrath, but the discipline of love. This kind of apocalypse, or prophecy, indeed, was to be expected from the very beginning of the group of prophecies, which are introduced with the word "Behold!" Such a manner of introduction is peculiar to Isaiah, and of itself leads us to expect a message which is unique.<p>The practical religious value of these prophecies to Isaiah\'s own age would be very great. In a period of war and repeated foreign invasion, when but few men were left in the land (<a onClick="return mV(\'Isa\',24,6,13);">Isa 24:6, 13</a>; <a onClick="return mV(\'Isa\',26,18);">26:18</a>), and Judah\'s cities were laid waste and desolate (<a onClick="return mV(\'Isa\',24,10,12);">Isa 24:10, 12</a>; <a onClick="return mV(\'Isa\',25,2);">25:2</a>; <a onClick="return mV(\'Isa\',26,5);">26:5</a>; <a onClick="return mV(\'Isa\',27,10);">27:10</a>), and music and gladness were wanting (<a onClick="return mV(\'Isa\',24,8);">Isa 24:8</a>), when the nation still clung to their idols (<a onClick="return mV(\'Isa\',27,9);">Isa 27:9</a>) and the Assyrians\' work of destruction was still incomplete, other calamities being sure to follow (<a onClick="return mV(\'Isa\',24,16);">Isa 24:16</a>), it would certainly be comforting to know that forgiveness was still possible (<a onClick="return mV(\'Isa\',27,9);">Isa 27:9</a>), that Yahweh was still the keeper of His vineyard (<a onClick="return mV(\'Isa\',27,3,4);">Isa 27:3-4</a>), that His judgments were to last but for a little moment (<a onClick="return mV(\'Isa\',26,20);">Isa 26:20</a>), and that though His people should be scattered, He would soon carefully gather them "one by one" (<a onClick="return mV(\'Isa\',27,12,13);">Isa 27:12-13</a>), and that in company with other nations they would feast together on Mt. Zion as Yahweh\'s guests (<a onClick="return mV(\'Isa\',25,6,7,10);">Isa 25:6-7, 10</a>), and that Jerusalem should henceforth become the center of life and religion to all nations (<a onClick="return mV(\'Isa\',24,23);">Isa 24:23</a>; <a onClick="return mV(\'Isa\',25,6);">25:6</a>; <a onClick="return mV(\'Isa\',27,13);">27:13</a>). Such faith in Yahweh, such exhortations and such songs and confessions of the redeemed, seen in vision, would be a source of rich spiritual comfort to the few suffering saints in Judah and Jerusalem, and a guiding star to the faithful disciples of the prophet\'s most inner circle.<p><a onClick="return mV(\'Isa\',28,\'1-\');">Isaiah 28-35</a> contain a cycle of prophetic warnings against alliance with Egypt, closing with a prophecy concerning Edom and a promise of Israel\'s ransom. As in <a onClick="return mV(\'Isa\',5,\'8-23\');">5:8-23</a>, the prophet indulges in a series of six woes:<p>(1) Woe to drunken, scoffing politicians (<a onClick="return mV(\'Isa\',28,\'1-\');">Isa 28</a>). This is one of the great chapters of Isaiah\'s book. In the opening section (<a onClick="return mV(\'Isa\',28,\'1-6\');">28:1-6</a>) the prophet points in warning to the proud drunkards of Ephraim whose crown (Samaria) is rapidly fading. He next turns to the scoffing politicians of Jerusalem, rebuking especially the bibulous priests who stumble in judgment, and the staggering prophets who err in vision (<a onClick="return mV(\'Isa\',28,\'7-22\');">28:7-22</a>); closing with a most instructive parable from agriculture, teaching that God\'s judgments are not arbitrary; that as the husbandman does not plow and harrow his fields the whole year round, so God will not punish His people forever; and as the husbandman does not thresh all kinds of grain with equal severity, no more will God discipline His people beyond their deserts (<a onClick="return mV(\'Isa\',28,\'23-29\');">28:23-29</a>).<p>(2) Woe to formalists in religion (<a onClick="return mV(\'Isa\',29,\'1-14\');">Isa 29:1-14</a>). Isaiah\'s second woe is pronounced upon Ariel, the altar-hearth of God, i.e. Jerusalem, the sacrificial center of Israel\'s worship. David had first inaugurated the true worship of Yahweh in Zion. But now Zion\'s worship has become wholly conventional, formal, and therefore insincere; it is learned by rote (<a onClick="return mV(\'Isa\',29,13);">29:13</a>; compare <a onClick="return mV(\'Isa\',1,\'10-15\');">1:10-15</a>; <a onClick="return mV(\'Mic\',6,\'6-8\');">Mic 6:6-8</a>). Therefore, says Isaiah, Yahweh is forced to do an extraordinary work among them, in order to bring them back to a true knowledge of Himself (<a onClick="return mV(\'Isa\',29,14);">Isa 29:14</a>).<p>(3) Woe to those who hide their plans from God (<a onClick="return mV(\'Isa\',29,\'15-24\');">Isa 29:15-24</a>). What their plans are, which they are devising in secret, the prophet does not yet disclose; but he doubtless alludes to their intrigues with the Egyptians and their purpose to break faith with the Assyrians, to whom they were bound by treaty to pay annual tribute. Isaiah bravely remonstrates with them for supposing that any policy will succeed which excludes the counsel and wisdom of the Holy One. They are but clay; He is the potter. At this point, though somewhat abruptly, Isaiah turns his face toward the Messianic future. In a very little while, he says, Lebanon, which is now overrun by Assyria\'s army, shall become a fruitful field, and the blind and deaf and spiritually weak shall rejoice in the Holy One of Israel.<p>(4) Woe to the pro-Egyptian party (<a onClick="return mV(\'Isa\',30,\'1-\');">Isa 30</a>). Isaiah\'s fourth woe is directed against the rebellious politicians who stubbornly, and now openly, advocate making a league with Egypt. They have at length succeeded apparently in winning over the king to their side, and an embassy is already on its way to Egypt, bearing across the desert of the exodus rich treasures with which to purchase the friendship of their former oppressors. Isaiah now condemns what he can no longer prevent. Egypt is a Rahab "sitstill," i.e. a mythological sea-monster, menacing in mien but laggard in action. When the crisis comes, she will sit still, causing Israel only shame and confusion.<p>(5) Woe to those who trust in horses and chariots (<a onClick="return mV(\'Isa\',31,\'1-\');">Isa 31</a>-<a onClick="return mV(\'Isa\',32,\'1-\');">32</a>). Isaiah\'s fifth woe is a still more vehement denunciation of those who trust in Egypt\'s horses and chariots, and disregard the Holy One of Israel. Those who do so forget that the Egyptians are but men and their horses flesh, and that mere flesh cannot avail in a conflict with spirit. Eventually Yahweh means to deliver Jerusalem, if the children of Israel will but turn from their idolatries to Him; and in that day, Assyria will be vanquished. A new era will dawn upon Judah. Society will be regenerated. The renovation will begin at the top. Conscience also will be sharpened, and moral distinctions will no longer be confused (<a onClick="return mV(\'Isa\',32,\'1-8\');">32:1-8</a>). As Delitzsch puts it, "The aristocracy of birth and wealth will be replaced by an aristocracy of character." The careless and indifferent women, too, in that day will no longer menace the social welfare of the state (<a onClick="return mV(\'Isa\',32,\'9-14\');">32:9-14</a>); with the outpouring of Yahweh\'s spirit an ideal commonwealth will emerge, in which social righteousness, peace, plenty and security will abound (<a onClick="return mV(\'Isa\',32,\'15-20\');">32:15-20</a>).<p>(6) Woe to the Assyrian destroyer (<a onClick="return mV(\'Isa\',33,\'1-\');">Isa 33</a>). Isaiah\'s last woe is directed against the treacherous spoiler himself, who has already laid waste the cities of Judah, and is now beginning to lay siege to Jerusalem (701 BC). The prophet prays, and while he prays, behold! the mighty hosts of the Assyrians are routed and the long-besieged but now triumphant inhabitants of Jerusalem rush out like locusts upon the spoil which the vanishing adversary has been forced to leave behind. The destroyer\'s plan to reduce Jerusalem has come to naught. The whole earth beholds the spectacle of Assyria\'s defeat and is filled with awe and amazement at the mighty work of Yahweh. Only the righteous may henceforth dwell in Jerusalem. Their eyes shall behold the Messiah-king in his beauty, reigning no longer like Hezekiah over a limited and restricted territory, but over a land unbounded, whose inhabitants enjoy Yahweh\'s peace and protection, and are free from all sin, and therefore from all sickness (<a onClick="return mV(\'Isa\',33,\'17-24\');">33:17-24</a>). With this beautiful picture of the Messianic future, the prophet\'s woes find an appropriate conclusion. Isaiah never pronounced a woe without adding a corresponding promise.<p>In <a onClick="return mV(\'Isa\',34,\'1-\');">Isa 34</a>-<a onClick="return mV(\'Isa\',35,\'1-\');">35</a>, the prophet utters a fierce cry for justice against "all the nations," but against Edom in particular. His tone is that of judgment. Edom is guilty of high crimes against Zion (<a onClick="return mV(\'Isa\',34,8);">34:8</a>f), therefore she is doomed to destruction. On the other hand, the scattered ones of Israel shall return from exile and "obtain gladness and joy, and sorrow and sighing shall flee away" (<a onClick="return mV(\'Isa\',35,\'1-\');">Isa 35</a>).<p><a onClick="return mV(\'Isa\',36,\'1-\');">Isaiah 36-39</a> contain history, prophecy and song intermingled. These chapters serve both as an appendix to <a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1-35</a> and as an introduction to <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40-66</a>. In them three important historical events are narrated, in which Isaiah was a prominent factor:<p>(1) the double attempt of Sennacherib to obtain possession of Jerusalem (<a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</a>-<a onClick="return mV(\'Isa\',37,\'1-\');">37</a>);<p>(2) Hezekiah\'s sickness and recovery (<a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</a>);<p>(3) the embassy of Merodach-baladan (<a onClick="return mV(\'Isa\',39,\'1-\');">Isa 39</a>).<p>With certain important omissions and insertions these chapters are duplicated almost verbatim in <a onClick="return mV(\'2Ki\',18,\'13-\');">2Ki 18:13-20:19</a>. They are introduced with the chronological note, "Now it came to pass in the fourteenth year of king Hezekiah." Various attempts have been made to solve the mystery of this date; for, if the author is alluding to the siege of 701 BC, difficulty arises, because that event occurred not in Hezekiah\'s "14th" but 26th year, according to the Biblical chronology of his life; or, if with some we date Hezekiah\'s accession to the throne of Judah as 720 BC, then the siege of 701 BC occurred, as is evident, in Hezekiah\'s 19th year. It is barely possible of course that "the 14th year of king Hezekiah" was the 14th of the "15 years" which were added to his life, but more probably it alludes to the 14th of his reign. On the whole it is better to take the phrase as a general chronological caption for the entire section, with special reference to <a onClick="return mV(\'Isa\',38,\'1-\');">Isa 38</a>, which tells of Hezekiah\'s sickness, which actually fell in his 14th year (714 BC), and which, coupled with Sargon\'s expected presence at Ashdod, was the great personal crisis of the king\'s life.<p>Sennacherib made two attempts in 701 BC to reduce Jerusalem: one from Lachish with an army headed by the Rabshakeh (<a onClick="return mV(\'Isa\',36,\'2-\');">Isa 36:2</a>-<a onClick="return mV(\'Isa\',37,\'1-8\');">37:8</a>), and another from Libnah with a threat conveyed by messengers (<a onClick="return mV(\'Isa\',37,9);">Isa 37:9</a>). The brief section contained in <a onClick="return mV(\'2Ki\',18,\'14-16\');">2Ki 18:14-16</a> is omitted from between verses <a onClick="return mV(\'Isa\',36,1,2);">1 and 2</a> of <a onClick="return mV(\'Isa\',36,\'1-\');">Isa 36</a>, because it was not the prophet\'s aim at this time to recount the nation\'s humiliation. Isaiah\'s last "word" concerning Assyria (<a onClick="return mV(\'Isa\',37,\'21-35\');">Isa 37:21-35</a>) is one of the prophet\'s grandest predictions. It is composed of three parts:<p>(1) a taunt-song, in elegiac rhythm, on the inevitable humiliation of Sennacherib (<a onClick="return mV(\'Isa\',37,\'22-29\');">Isa 37:22-29</a>);<p>(2) a short poem in different rhythm, directed to Hezekiah, in order to encourage his faith (<a onClick="return mV(\'Isa\',37,\'30-32\');">Isa 37:30-32</a>);<p>(3) a definite prediction, in less elevated style, of the sure deliverance of Jerusalem (<a onClick="return mV(\'Isa\',37,\'33-35\');">Isa 37:33-35</a>). Isaiah\'s prediction was literally fulfilled.<p>The section <a onClick="return mV(\'Isa\',38,\'9-20\');">Isa 38:9-20</a> contains Hezekiah\'s Song of Thanksgiving, in which he celebrates his recovery from some mortal sickness. It is a beautiful plaintive "writing"; omitted altogether by the author of the Book of Kings (compare <a onClick="return mV(\'2Ki\',20,\'1-\');">2Ki 20</a>). Hezekiah was sick in 714 BC. Two years later Merodach-baladan, the veteran arch-enemy of Assyria, having heard of his wonderful recovery, sent letters and a present to congratulate him. Doubtless, also, political motives prompted the recalcitrant Babylonian. But be that as it may, Hezekiah was greatly flattered by the visit of Merodach-baladan\'s envoys, and, in a moment of weakness, showed them all his royal treasures. This was an inexcusable blunder, as the sight of his many precious possessions would naturally excite Babylonian cupidity to possess Jerusalem. Isaiah not only solemnly condemned the king\'s conduct, but he announced with more than ordinary insight that the days were coming when all the accumulated resources of Jerusalem would be carried away to Babylon (<a onClick="return mV(\'Isa\',39,\'3-6\');">39:3-6</A>; compare <a onClick="return mV(\'Mic\',4,10);">Mic 4:10</a>). This final prediction of judgment is the most marvelous of all Isaiah\'s minatory utterances, because he distinctly asserts that, not the Assyrians, who were then at the height of their power, but the Babylonians, shall be the instruments of the Divine vengeance in consummating the destruction of Jerusalem. There is absolutely no reason for doubting the genuineness of this prediction. In it, indeed, we have a prophetic basis for <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40-66</a>, which follow.<p>Coming now to <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40-66</a>, we have prophecies of comfort, salvation, and of the future glory awaiting Israel. These chapters naturally fall into three sections:<p>(1) <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40-48</a>, announcing deliverance from captivity through Cyrus;<p>(2) <a onClick="return mV(\'Isa\',49,\'1-\');">Isa 49-57</a>, describing the sufferings of the "Servant" of Yahweh, this section ending like the former with the refrain, "There is no peace, saith my God, to the wicked" (<a onClick="return mV(\'Isa\',57,21);">57:21</a>; compare <a onClick="return mV(\'Isa\',48,22);">48:22</a>);<p>(3) <a onClick="return mV(\'Isa\',58,\'1-\');">Isa 58-66</a>, announcing the final abolition of all national distinctions and the future glory of the people of God. <a onClick="return mV(\'Isa\',60,\'1-\');">Isaiah 60</a> is the characteristic chapter of this section, as <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> is of the second, and <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40</a> of the first.<p>Entering into greater detail, the first section (<a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40-48</a>) demonstrates the deity of Yahweh through His unique power to predict. The basis of the comfort which the prophet announces is Israel\'s incomparable God (<a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40</a>). Israel\'s all-powerful Yahweh in comparison with other gods is incomparable. In the prologue (<a onClick="return mV(\'Isa\',40,\'1-11\');">Isa 40:1-11</a>) he hears the four voices:<p>(1) of grace (<a onClick="return mV(\'Isa\',40,1,2);">Isa 40:1-2</a>);<p>(2) of prophecy (<a onClick="return mV(\'Isa\',40,\'3-5\');">Isa 40:3-5</a>);<p>(3) of faith (<a onClick="return mV(\'Isa\',40,\'6-8\');">Isa 40:6-8</a>), and<p>(4) of evangelism (<a onClick="return mV(\'Isa\',40,\'9-11\');">Isa 40:9-11</a>).<p>Then, after exalting the unique character of Israel\'s all-but-forgotten God (<a onClick="return mV(\'Isa\',40,\'12-26\');">Isa 40:12-26</a>), he exhorts them not to suppose that Yahweh is ignorant of, or indifferent to, Israel\'s misery. Israel must wait for salvation. They are clamoring for deliverance prematurely. Only wait, he repeats; for with such a God, Israel has no reason to despond (<a onClick="return mV(\'Isa\',40,\'27-31\');">Isa 40:27-31</a>).<p>In <a onClick="return mV(\'Isa\',41,\'1-\');">Isa 41</a> he declares that the supreme proof of Yahweh\'s sole deity is His power to predict. He inquires, "Who hath raised up one from the east?" Though the hero is left unnamed, Cyrus is doubtless in the prophet\'s mind (compare <a onClick="return mV(\'Isa\',44,28);">44:28</a>; <a onClick="return mV(\'Isa\',45,1);">45:1</a>). He is not, however, already appearing upon the horizon of history as some fancy, but rather predicted as sure to come. The verb tenses which express completed action are perfects of certainty, and are used in precisely the same manner as those in <a onClick="return mV(\'Isa\',3,8);">3:8</a>; <a onClick="return mV(\'Isa\',5,13);">5:13</a>; <a onClick="return mV(\'Isa\',21,9);">21:9</a>. The answer to the inquiry is, "I, Yahweh, the first, and with the last, I am he" (<a onClick="return mV(\'Isa\',41,4);">41:4</a>). Israel is Yahweh\'s servant. The dialogue continues; but it is no longer between Yahweh and the nations, as in <a onClick="return mV(\'Isa\',41,\'1-7\');">Isa 41:1-7</a>, but between Yahweh and the idols (<a onClick="return mV(\'Isa\',41,\'21-29\');">41:21-29</a>). Addressing the dumb idols, Yahweh is represented as saying, Predict something, if you are real deities. As for myself, I am going to raise up a hero from the north who will subdue all who oppose him. And I announce my purpose now in advance "from the beginning," "beforetime," before there is the slightest ground for thinking that such a hero exists or ever will exist (<a onClick="return mV(\'Isa\',41,26);">41:26</a>), in order that the future may verify my prediction, and prove my sole deity. I, Yahweh, alone know the future. In <a onClick="return mV(\'Isa\',41,\'21-29\');">41:25-29</a>, the prophet even projects himself into the future and speaks from the standpoint of the fulfillment of his prediction. This, as we saw above, was a characteristic of Isaiah in <a onClick="return mV(\'Isa\',24,\'1-\');">Isa 24-27</a>.<p>In <a onClick="return mV(\'Isa\',42,\'1-\');">Isa 42:1</a>-<a onClick="return mV(\'Isa\',43,\'1-13\');">43:13</a> the prophet announces also a spiritual agent of redemption, namely, Yahweh\'s "Servant." Not only a temporal agent (Cyrus) shall be raised up to mediate Israel\'s redemption, which is the first step in the process of the universal salvation contemplated, but a spiritual factor. Yahweh\'s "Servant" shall be employed in bringing the good tidings of salvation to the exiles and to the Gentiles also. In <a onClick="return mV(\'Isa\',42,\'1-9\');">42:1-9</a> the prophet describes this ideal figure and the work he will execute. The glorious future evokes a brief hymn of thanksgiving for the redemption which the prophet beholds in prospect (<a onClick="return mV(\'Isa\',42,\'10-17\');">42:10-17</a>). Israel has long been blind and deaf to Yahweh\'s instructions (<a onClick="return mV(\'Isa\',41,18,19);">41:18,19</A>), but now Yahweh is determined to redeem them even at the cost of the most opulent nations of the world, that they may publish His law to all peoples (<a onClick="return mV(\'Isa\',42,\'18-\');">42:18</a>-<a onClick="return mV(\'Isa\',43,\'1-13\');">43:13</a>).<p>In <a onClick="return mV(\'Isa\',13,\'14-\');">Isa 13:14-44:23</a> forgiveness is made the pledge of deliverance. Yahweh\'s determination to redeem Israel is all of grace. Salvation is a gift. Yahweh has blotted out their transgressions for His own sake (<a onClick="return mV(\'Isa\',43,25);">43:25</a>). "This passage," Dillmann observes, "marks the highest point of grace in the Old Testament." Gods of wood and stone are nonentities. Those who manufacture idols are blind and dull of heart, and are "feeding on ashes." The section <a onClick="return mV(\'Isa\',44,\'9-20\');">44:9-20</a> is a most remorseless exposure of the folly of idolatry.<p>In <a onClick="return mV(\'Isa\',44,\'24-\');">Isa 44:24</a>-<a onClick="return mV(\'Isa\',45,\'1-25\');">45:25</a> the prophet at length names the hero of Israel\'s salvation and describes his mission. He is Cyrus. He shall build Jerusalem and lay the foundations of the temple (<a onClick="return mV(\'Isa\',44,28);">44:28</a>); he shall also subdue nations and let the exiles go free (<a onClick="return mV(\'Isa\',45,1,13);">45:1,13</a>). He speaks of Cyrus in the most extraordinary, almost extravagant terms. He is Yahweh\'s "shepherd" (<a onClick="return mV(\'Isa\',44,28);">44:28</a>), he is also Yahweh\'s "anointed," i.e. Messiah (<a onClick="return mV(\'Isa\',45,1);">45:1</a>), "the man of my counsel" (<a onClick="return mV(\'Isa\',46,11);">46:11</a>), whom Yahweh has called by name, and surnamed without his ever knowing Him (<a onClick="return mV(\'Isa\',45,3,4);">45:3,4</a>); the one "whom Yahweh loveth" (<a onClick="return mV(\'Isa\',48,14);">48:14</a>), whose right hand Yahweh upholdeth (<a onClick="return mV(\'Isa\',45,1);">45:1</a>), and who will perform all Yahweh\'s pleasure (<a onClick="return mV(\'Isa\',44,8);">44:28</a>); though but "a ravenous bird from the east (<a onClick="return mV(\'Isa\',46,11);">46:11</a>). The vividness with which the prophet speaks of Cyrus leads some to suppose that the latter is already upon the horizon. This, however, is a mistake. Scarcely would a contemporary have spoken in such terms of the real Cyrus of 538 BC. The prophet regards him (i.e. the Cyrus of his own prediction, not the Cyrus of history) as the fulfillment of predictions spoken long before. That is to say, in one and the same context, Cyrus is both predicted and treated as a proof that prediction is being fulfilled (<a onClick="return mV(\'Isa\',44,\'24-28\');">44:24-28</a>; <a onClick="return mV(\'Isa\',45,21);">45:21</A>). Such a phenomenon in prophecy can best be explained by supposing that the prophet projected himself into the future from an earlier age. Most extraordinary of all, in <a onClick="return mV(\'Isa\',45,\'14-17\');">45:14-17</a>, the prophet soars in imagination until he sees, as a result of Cyrus\' victories, the conquered nations renouncing their idols, and attracted to Yahweh as the Saviour of all mankind (<a onClick="return mV(\'Isa\',45,22);">45:22</a>). On any theory of origin, the predictive element in these prophecies is written large.<p><a onClick="return mV(\'Isa\',46,\'1-\');">Isaiah 46</a>-<a onClick="return mV(\'Isa\',47,\'1-\');">47</a> describe further the distinctive work of Cyrus, though Cyrus himself is but once referred to. Particular emphasis is laid on the complete collapse of the Babylonian religion; the prophet being apparently more concerned with the humiliation of Babylon\'s idols than with the fall of the city itself. Of course the destruction of the city would imply the defeat of her gods, as also the emancipation of Israel. But here again all is in the future; in fact Yahweh\'s incomparable superiority and unique deity are proven by His power to predict "the end from the beginning" and bring His prediction to pass (<a onClick="return mV(\'Isa\',46,10,11);">46:10,11</a>).<p><a onClick="return mV(\'Isa\',47,\'1-\');">Isaiah 47</a> is a dirge over the downfall of the imperial city, strongly resembling the taunt-song over the king of Babylon in <a onClick="return mV(\'Isa\',14,\'4-21\');">14:4-21</a>.<p><a onClick="return mV(\'Isa\',48,\'1-\');">Isaiah 48</a> is a hortatory summary and recapitulation of the argument contained in <a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40-47</a>, the prophet again emphasizing the following points:<p>(1) Yahweh\'s unique power to predict;<p>(2) that salvation is of grace;<p>(3) that Cyrus\' advent will be the crowning proof of Yahweh\'s abiding presence among His people;<p>(4) that God\'s chastisements were only disciplinary; and<p>(5) that even now there is hope, if they will but accept of Yahweh\'s proffered salvation. Alas! that there is no peace or salvation for the godless (<a onClick="return mV(\'Isa\',48,\'20-22\');">48:20-22</a>). Thus ends the first division of Isaiah\'s remarkable "vision" of Israel\'s deliverance from captivity through Cyrus.<p>The second section (<a onClick="return mV(\'Isa\',19,\'1-\');">Isa 49-57</a>) deals with the spiritual agent of salvation, Yahweh\'s suffering "Servant." With <a onClick="return mV(\'Isa\',49,\'1-\');">Isa 49</a> the prophet leaves off attempting further to prove the sole deity of Yahweh by means of prediction, and drops entirely his description of Cyrus\' victories and the overthrow of Babylon, in order to set forth in greater detail the char
