lem; while a faint echo of the intercessory plea for the nation is heard in Ethan\'s psalm (<a onClick="return mV(\'Psa\',89,\'1-\');">Ps 89</a>). It sounds faintly in <a onClick="return mV(\'Psa\',106,\'1-\');">Ps 106</a>. In <a onClick="return mV(\'Psa\',122,\'1-\');">Ps 122</a> we seem to breathe a larger and more liberal spirit. It contains the appeal to pray for the peace of Jerusalem (<a onClick="return mV(\'Psa\',122,6);">122:6</a>), as if the later thought of Israel had begun to expand beyond the mere limits of personal penitence, or desire for deliverance, or denunciation of the enemy. In one of the Songs of Degrees (<a onClick="return mV(\'Psa\',125,\'1-\');">Ps 125</a>), there is the somewhat severely ethical prayer: "Do good, O Yahweh, unto those that are good." The yearning for the salvation of man as man has not yet been born. The Christ must come before the fullness of Divine love is shed abroad in the hearts even of the pious. This comparative absence of intercessory prayer from the service-book of Israel, and its collected expressions of spiritual experience, is instructive. We find continued references to those who needed prayer; but for the most part these references are descriptive of their wickedness, or denunciatory of their hostility to the Psalmist. The Book of Psalms is thus a striking commentary on the growth of Israel\'s spiritual life. Intense as it is in its perception of God and His claim on human righteousness, it is only when the supreme revelation of Divine love and the regard for universal man has appeared in the person of our Lord that the large and loving spirit which intercession signifies is found in the experience and expressions of the pious.<P>8. The Books of Wisdom:<P>In the Wisdom books there is little, if any, reference to intercession. But they deal rather with ethical character, and often on a merely providential and utilitarian basis. It is noticeable that the only reference to pleading a cause is said to be by the Lord Himself as against the injustice of man (<a onClick="return mV(\'Pro\',22,23);">Pr 22:23</a>): "Yahweh will plead their (the poor\'s) cause." Action on behalf of others does not appear to have been very highly regarded by the current ethics of the Israelite. A kind of negative helpfulness is indicated in <a onClick="return mV(\'Pro\',24,28);">Pr 24:28</a>: "Be not a witness against thy neighbor without cause"; and it is significant that the office of advocate was not known among the Jews until they had come under the authority of Rome, when, not knowing the forms of Roman law, they were obliged to secure the aid of a Roman lawyer before the courts. Such practitioners were found in the provinces (Cic. pro Coelio c. 30); Tertullus (<a onClick="return mV(\'Act\',24,1);">Ac 24:1</a>) was such an advocate.<P>9. The Prophets\' Succession of Moses and Samuel:<P>In the prophetical books the note of intercession reappears. The prophet, though primarily a messenger from God to man, has also something of the character of the intercessor (see Isaiah\'s call, <a onClick="return mV(\'Isa\',6,\'1-\');">Isa 6</a>). <a onClick="return mV(\'Isa\',25,\'1-\');">Isa 25</a>; <a onClick="return mV(\'Isa\',26,\'1-\');">26</a> exhibit the intercessory characteristics. The request of Hezekiah for the prayers of Isaiah (<a onClick="return mV(\'Isa\',37,4);">Isa 37:4</a>), and the answer of the Lord implied in <a onClick="return mV(\'Isa\',37,6);">37:6</A>, recall the constantly recurring service of Moses to the people. Hezekiah himself becomes an intercessor (<a onClick="return mV(\'Isa\',37,\'14-21\');">37:14-21</A>). In <a onClick="return mV(\'Jer\',4,10);">Jer 4:10</a> intercession is mingled with the words of the messenger. The sin of the people hinders such prayers as were offered on their behalf (<a onClick="return mV(\'Jer\',7,16);">Jer 7:16</a>; compare <a onClick="return mV(\'Jer\',11,14);">Jer 11:14</a>; <a onClick="return mV(\'Jer\',14,11);">14:11</a>). Intercessory prayers are found in <a onClick="return mV(\'Jer\',10,23);">Jer 10:23</a>ff; <a onClick="return mV(\'Jer\',14,7);">14:7</A>ff, <a onClick="return mV(\'Jer\',14,\'19-22\');">19-22</A>. The message of Zedekiah requesting Jeremiah\'s help is perhaps an instance of seer-inquiry as much as intercession (<a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>f; compare <a onClick="return mV(\'1Sa\',9,19);">1Sa 9:19</a>). In <a onClick="return mV(\'Jer\',42,4);">Jer 42:4</a>, the prophet consents to the request of Johanan to seek the Lord on behalf of the people. The Book of Lamentations is naturally conceived in a more constantly recurring spirit of intercession. In the prophecies Jeremiah has been the messenger of God to the people. But, after the catastrophe, in his sorrow he appeals to God for mercy upon them (<a onClick="return mV(\'Lam\',2,20);">La 2:20</a>; <a onClick="return mV(\'Lam\',5,1,19);">5:1, 19</a>). Ezekiel in the same way is rather the seer of visions and the prophetic representative of God. Yet at times he appeals to God for the people (<a onClick="return mV(\'Eze\',9,8);">Eze 9:8</a>; <a onClick="return mV(\'Eze\',11,13);">11:13</a>). In Daniel we find the intercession of his three friends sought for in order to secure the revelation of the king\'s dream (<a onClick="return mV(\'Dan\',2,17);">Da 2:17</a>); and Daniel\'s prayer for Jerusalem and her people (<a onClick="return mV(\'Dan\',9,\'16-19\');">Da 9:16-19</a>).<P>In the Minor Prophets intercession rarely appears; even in the graphic pictures of Jonah, though the work itself shows the enlarging of the conception of God\'s relation to humanity outside of Israel, the prophet himself exhibits no tenderness and utters no pleas for the city against which he had been sent to prophesy, and receives the implied rebuke from the Lord for his want of sympathy, caring more for the perished gourd than for the vast population of Nineveh, whom the Lord, however, pitied and spared (<a onClick="return mV(\'Jon\',4,\'1-\');">Jon 4</a>). Even the sublime prayer of <a onClick="return mV(\'Hab\',3,\'1-\');">Hab 3</a> has only a suggestion of intercession. <a onClick="return mV(\'Zec\',6,13);">Zec 6:13</a> relieves the general severity of the prophetic message, consisting of the threatenings of judgment, by the gleam of the promise of a royal priest whose office was partially that of an intercessor, though the picture is darkened by the character of the priesthood and the people, whose services had been selfish, without mercy and compassion (<a onClick="return mV(\'Zec\',7,4,7);">Zec 7:4, 7</a>). Now the spirit of tenderness, the larger nature, the loving heart, are to be restored to Israel (<a onClick="return mV(\'Zec\',8,\'16-23\');">Zec 8:16-23</a>). Other nations than Israel will share in the mercy of God. In <a onClick="return mV(\'Mal\',2,7);">Mal 2:7</a> we find the priest rebuked for the loss of his intercessory character.<P>10. The Priest and Intercession:<P>How far intercession was regarded as a special duty of the priesthood it is not very easy to determine. The priestly office itself was undoubtedly intercessory. In the Priest and offering of the sacrifice even for the individual, and certainly in the national functions, both of the regular and the occasional ceremonies, the priest represented the individual or the community. In <a onClick="return mV(\'Joe\',2,17);">Joe 2:17</a> the priests are distinctly bidden to "weep between the porch and the altar, and let them say, Spare thy people, O Yahweh." <a onClick="return mV(\'Mal\',1,9);">Mal 1:9</a> appeals to them for intercession to God, and the graphic scene in 1Macc 7:33-38 shows the priests interceding on behalf of the people against Nicanor.<P>11. Intercession in the Gospels:<P>In the New Testament, all prayer necessarily takes a new form from its relation to our Lord, and in this intercessory prayer shares. At the outset, Christ teaches prayer on behalf of those "which despitefully use you" (<a onClick="return mV(\'Mat\',5,44);">Mt 5:44</a> the King James Version). How completely does this change the entire spirit of prayer! We breathe a new atmosphere of the higher revelation of love. The Lord\'s Prayer (<a onClick="return mV(\'Mat\',6,\'9-13\');">Mt 6:9-13</a>) is of this character. Its initial word is social, domestic; prayer is the address of children to the Father. Even though some of the petitions are not original, yet their place in the prayer, and the general tone of the Master\'s teaching, exhibit the social and altruistic spirit, not so pervasive of the older dispensation. "Thy kingdom come" leads the Order of petitions, with its essentially intercessory character. The forgiveness of others, which is the measure and plea of our own forgiveness, brings even those who have wronged us upon the same plane as ourselves, and if the plea be genuine, how can we refuse to pray for them? And if for our enemies, then surely for our friends. In <a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>f; the good things sought of the Father are to be interpreted as among those that if we desire from others we should do to them. And from this spirit the intercessory prayer cannot be absent. We find the spirit of intercession in the pleas of those who sought Christ\'s help for their friends, which He was always so quick to recognize: the centurion for his servant (<a onClick="return mV(\'Mat\',8,13);">Mt 8:13</a>); the friends of the paralytic (<a onClick="return mV(\'Mat\',9,\'2-6\');">Mt 9:2-6</a>), where the miracle was wrought on the ground of the friends\' faith. Of a similar character are the requests of the woman for her child and the Lord\'s response (<a onClick="return mV(\'Mat\',15,28);">Mt 15:28</a>); of the man for his lunatic son (<a onClick="return mV(\'Mat\',17,\'14-21\');">Mt 17:14-21</a>). There is the suggestion of the intercessory spirit in the law of trespass, specifically followed by the promise of the answer to the prayer of the two or three, agreed and in fellowship (<a onClick="return mV(\'Mat\',18,\'15-20\');">Mt 18:15-20</a>), with the immediately attached precepts of forgiveness (<a onClick="return mV(\'Mat\',18,\'21-35\');">Mt 18:21-35</a>). A remarkable instance of intercession is recorded in <a onClick="return mV(\'Mat\',20,\'20-23\');">Mt 20:20-23</a>, where the mother of Zebedee\'s sons makes a request on behalf of her children; the added expression, "worshipping him," raises the occasion into one of intercessory prayer. our Lord\'s rebuke is not to the prayer, but to its lack of wisdom.<P>It is needless to review the cases in the other Gospels. But the statement of <a onClick="return mV(\'Mar\',6,5);">Mr 6:5</a>f; that Christ could not perform mighty works because of unbelief, sheds a flood of light upon one of the important conditions of successful intercession, when contrasted with the healing conditioned by the faith of others than the healed. One of the most distinct examples of intercessory prayer is that of the Lord\'s intercession for Peter (<a onClick="return mV(\'Luk\',22,31);">Lu 22:31</a>f), and for those who crucified Him (<a onClick="return mV(\'Luk\',23,34);">Lu 23:34</a>). The place of intercession in the work of Christ is seen clearly in our Lord\'s intercessory prayer (see <a href="study/isbe/search.html?string=INTERCESSION+OF+CHRIST">INTERCESSION OF CHRIST</a>), where it is commanded by definite precept and promise of acceptance. The promise of the answer to prayer in the name of Christ is very definite (<a onClick="return mV(\'Jhn\',16,24);">Joh 16:24</a>). Christ\'s high-priestly prayer is the sublimest height of prayer to God and is intercessory throughout (<a onClick="return mV(\'Jhn\',17,\'1-\');">Joh 17</a>); <a onClick="return mV(\'Jhn\',16,26);">Joh 16:26</a> does not, as some have held, deny His intercession for His disciples; it only throws open the approach to God Himself.<P>12. Intercessory Prayers of the Church:<P>Ac introduces us to the working of the fresh elements which Christ gave to life. Hence, the prayers of the church become Christian prayers, involving the wider outlook on others and on the world at large which Christianity has bestowed on men. The prayer of the assembled believers upon the liberation of the apostles breathes this spirit (<a onClick="return mV(\'Act\',4,\'24-30\');">Ac 4:24-30</a>). The consecrating prayer for the seven was probably intercessory (<a onClick="return mV(\'Act\',6,6);">Ac 6:6</a>; compare <a onClick="return mV(\'Act\',1,24);">Ac 1:24</a>). How pathetic is the plea of Stephen for his murderers (<a onClick="return mV(\'Act\',7,60);">Ac 7:60</a>)! How natural is intercession (<a onClick="return mV(\'Act\',8,24);">Ac 8:24</a>)! Peter at Joppa (<a onClick="return mV(\'Act\',9,40);">Ac 9:40</a>); the church making prayer with-out ceasing for Peter (<a onClick="return mV(\'Act\',12,5,12);">Ac 12:5, 12</a>); the prayer for Barnabas and Saul at Antioch (<a onClick="return mV(\'Act\',13,3);">Ac 13:3</a>); Paul and Barnabas praying for the churches (<a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>); the church at Antioch commending Paul and Silas to the grace of God (<a onClick="return mV(\'Act\',15,40);">Ac 15:40</a>); Paul and the elders of Ephesus (<a onClick="return mV(\'Act\',20,36);">Ac 20:36</a>), are all examples, more or less defined, of intercessory prayer.<P>13. Intercession Found in the Epistles:<P>In the Epistles we may expect to find intercession more distinctly filled with the relation of prayer through Christ. Paul gives us many examples in his Epistles: for the Romans (<a onClick="return mV(\'Rom\',1,9);">Ro 1:9</a>); the Spirit\'s interceding (<a onClick="return mV(\'Rom\',8,27);">8:27</A>); Paul\'s prayer for his race (<a onClick="return mV(\'Rom\',10,1);">10:1</A>); his request for prayers (<a onClick="return mV(\'Rom\',15,30);">15:30</A>); the help that he found from the prayer of his friends (<a onClick="return mV(\'2Cr\',1,11);">2Co 1:11</a>); prayer for the Corinthian church (<a onClick="return mV(\'2Cr\',13,7);">2Co 13:7</a>); for the Ephesians (<a onClick="return mV(\'Eph\',1,\'16-23\');">Eph 1:16-23</a>; <a onClick="return mV(\'Eph\',3,\'14-21\');">3:14-21</a>; see also <a onClick="return mV(\'Eph\',6,18);">Eph 6:18</a>; <a onClick="return mV(\'Phl\',1,\'3-11\',19);">Php 1:3-11, 19</a>; <a onClick="return mV(\'Col\',1,3,9);">Col 1:3, 9</a>; <a onClick="return mV(\'Col\',4,3);">4:3</a>; <a onClick="return mV(\'1Th\',1,2);">1Th 1:2</a>; <a onClick="return mV(\'1Th\',5,23,25);">5:23, 25</a>; <a onClick="return mV(\'2Th\',1,2);">2Th 1:2</a>); a definite command that intercession be made for all men and for kings and those in authority (<a onClick="return mV(\'1Ti\',2,1,2);">1Ti 2:1-2</a>); his prayer for Timothy (<a onClick="return mV(\'2Ti\',1,3);">2Ti 1:3</a>); for Philemon (<a onClick="return mV(\'Phm\',1,4);">1:4</A>); and prayer to be offered for the sick by the elders of the church (<a onClick="return mV(\'Jam\',5,\'14-18\');">Jas 5:14-18</a> see also <a onClick="return mV(\'Hbr\',13,\'18-21\');">Heb 13:18-21</a>; <a onClick="return mV(\'1Jo\',5,14);">1Joh 5:14</a>).<P>II. Intercession Perfected in Christ\'s Office and in the Church.<P>This review of the intercession of the Scriptures prepares us for the development of a specific office of intercession, perfectly realized in Christ. We have seen Moses complying with the people\'s request to represent them before God. In a large and generous spirit the leader of Israel intercedes with God for his nation. It was natural that this striking example of intercessory prayer should be followed by other leaders, and that the gradually developed system of religious worship should furnish the conception of the priest, and especially the high priest, as the intercessor for those who came to the sacrifice. This was particularly the significance of the great Day of Atonement, when after offering for himself, the high priest offered the sacrifice for the whole people. This official act, however, does not do away with the intercessory character of prayer as offered by men. We have seen how it runs through the whole history of Israel. But it is found much more distinctly in the Christian life and apparently in the practice of the Christian assembly itself. Paul continually refers to his own intercessory prayers, and seeks for a similar service on his own behalf from those to whom he writes. Intercession is thus based upon the natural tendency of the heart filled by love and a deep sympathetic sense of relation to others. Christ\'s intercessory prayer is the highest example and pattern of this form of prayer. His intercessions for His disciples, for His crucifiers, are recorded, and the sacred record rises to the supreme height in the prayer of <a onClick="return mV(\'Jhn\',17,\'1-\');">Joh 17</a>. In this prayer the following characteristics are to be found:<P>(1) It is based upon the intimate relation of Jesus to the Father. This gives to such prayer its justification; may it be said, its right.<P>(2) It follows the completest fulfillment of duty. It is not the mere expression of desire, even for others. It is the crown of effort on their behalf. He has revealed God to His disciples. He has given to them God\'s words; therefore He prays for them (<a onClick="return mV(\'Jhn\',17,6,7,8,9);">Joh 17:6, 7-9</a>).<P>(3) It recognizes the Divine, unbroken relation to the object of the prayer: "I am no more in the world, and these are in the world, and I come to Thee. Holy Father, keep," etc. (<a onClick="return mV(\'Jhn\',17,11);">17:11</A>).<P>(4) The supreme end of the prayer is salvation from the evil of the world (<a onClick="return mV(\'Jhn\',17,15);">17:15</A>).<P>(5) The wide sweep of the prayer and its chief objects—unity with God, and the presence with Christ, and the indwelling of the Divine love. The prayer is a model for all intercessory prayer.<P>III. Intercession of the Holy Spirit.<P>In connection with the subject of intercession, there arises a most interesting question as to whether the Holy Spirit is not presented in Scriptures as an intercessor. The text in which the doctrine seems to be taught is that of <a onClick="return mV(\'Rom\',8,26);">Ro 8:26</a> f: "In like manner the Spirit also helpeth our infirmity: for we know not how to pray as we ought; but the Spirit himself maketh intercession for us with groanings which cannot be uttered; and he that searcheth the hearts knoweth what is the mind of the Spirit, because he maketh intercession for the saints according to the will of God." By far the larger number of expositors have understood by the Spirit, the Holy Spirit. The older commentators, in general, refer to the Holy Spirit. Tholuck, Ewald, Philippi, Meyer, most of the American theologians and English commentators, as Shedd, Alford, Jowett, Wordsworth, interpret it in the same way. Lange and Olshausen refer it to the human spirit. Undoubtedly, the "groanings" have led to the denial of the reference to the Holy Spirit. But the very form of the word translated "helpeth" indicates cooperation, and this must be of something other than the spirit of man himself. The undoubted difficulties of the passage, which are strongly urged by Lange (see Lange\'s Commentary on <a onClick="return mV(\'Rom\',8,26);">Ro 8:26</a>), must be acknowledged. At the same time the statement seems to be very clear and definite. An explanation has been given that the Holy Spirit is here referred to as dwelling in us, and thus making intercession. The Divine Spirit is said to be a Spirit of supplication (<a onClick="return mV(\'Zec\',12,10);">Zec 12:10</a>). The distinction which is made between the intercession of Christ in heaven in His priestly office and that of the Holy Spirit interceding within the souls of believers, referred to by Shedd (see Commentary on Romans), must be carefully used, for if pressed to its extreme it would lead to the materialization and localization of the Divine nature. Moreover, may not the intercession of our Lord be regarded as being partially exemplified in that of the Spirit whom He has declared to be His agent and representative? If Christ dwells in believers by His Spirit, His intercession, especially if subjective in and with their spirits, may properly be described as the intercession of the Holy Ghost.`<a href="./study/isbe/search.html?string=INTERCESSION+OF+CHRIST">INTERCESSION OF CHRIST</a>; <a href="./study/isbe/search.html?string=PRAYERS+OF+CHRIST">PRAYERS OF CHRIST</a>; <a href="./study/isbe/search.html?string=CHRIST,+OFFICES+OF">OFFICES OF CHRIST</a>`14';
isbe[4632]='Intercession of Christ`The general conception of our Lord\'s mediatorial office is specially summed up in His intercession in which He appears in His high-priestly office, and also as interceding with the Father on behalf of that humanity whose cause He had espoused.<P>1. Christ\'s Intercession Viewed in Its Priestly Aspect:<P>The function of priesthood as developed under Judaism involved the position of mediation between man and God. The priest represented man, and on man\'s behalf approached God; thus he offered sacrifice, interceded and gave to the offerer whom he represented the benediction and expression of the Divine acceptance. (For the various forms of these offerings, see special articles [<a href="./study/isbe/search.html?string=OFFER;+OFFERING">Offer; Offering</A>]) As in sacrifice, so in the work of Christ, we find the proprietary rights of the offerer in the sacrifice. For man, Christ as one with man, and yet in His own personal right, offers Himself (see <a onClick="return mV(\'Rom\',5,\'1-\');">Ro 5</a>; and compare <a onClick="return mV(\'Gal\',4,5);">Ga 4:5</a> with <a onClick="return mV(\'Hbr\',2,11);">Heb 2:11</a>). There was also the transfer of guilt and its conditions, typically by laying the hand on the head of the animal, which then bore the sins of the offerer and was presented to God by the priest. The acknowledgment of sin and the surrender to God is completely fulfilled in Christ\'s offering of Himself, and His death (compare <a onClick="return mV(\'Lev\',3,2,8,13);">Le 3:2, 8, 13</a>; <a onClick="return mV(\'Lev\',16,21);">16:21</a>; with <a onClick="return mV(\'Isa\',53,6);">Isa 53:6</a>; <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>). our Lord\'s intercessory quality in the sacrifice of Himself is not only indicated by the imputation of guilt to Him as representing the sinner, but also in the victory of His life over death, which is then given to man in God\'s acceptance of His representative and substitute.<P>In the Epistle to the Hebrews, the intercessory character of our Lord\'s high-priestly office is transferred to the heavenly condition and work of Christ, where the relation of Christ\'s work to man\'s condition is regarded as being still continued in the heavenly place (see <a onClick="return mV(\'Hbr\',9,\'11-28\');">Heb 9:11-28</a>). This entrance into heaven is once for all, and in the person of the high priest the way is open to the very presence of God. From one point of view (<a onClick="return mV(\'Hbr\',10,12);">Heb 10:12</a>) the priestly service of the Lord was concluded and gathered up into His kingly office (<a onClick="return mV(\'Hbr\',10,13,\'14-18\');">Heb 10:13, 14-18</a>). But from another point of view, we ourselves are bidden to enter into the Holiest Place; as if in union with Christ we too become a kingly priesthood (<a onClick="return mV(\'Hbr\',10,\'19-22\');">Heb 10:19-22</a>; and compare <a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>).<P>It must not be forgotten, however, that this right of entrance into the most Holy Place is one that depends entirely upon our vital union with Christ, He appears in heaven for us and we with Him, and in this sense He fulfills the second duty of His high-priestly office as intercessor, with the added conception drawn from the legal advocacy of the Roman court. The term translated "Advocate" in <a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a> is parakletos, which in <a onClick="return mV(\'Jhn\',14,16);">Joh 14:16</a> is translated "Comforter." The word is of familiar use in Greek for the legal advocate or patronus who appeared on behalf of his client. Thus, in the double sense of priestly and legal representative, our Lord is our intercessor in Heaven.<P>Of the modes in which Christ carries out His intercessory office, we can have no knowledge except so far as we may fairly deduce them from the phraseology and suggested ideas of Scripture. As high priest, it may surely be right for us to aid our weak faith by assuring ourselves that our Lord pleads for us, while at the same time we must be careful not to deprave our thought concerning the glorified Lord by the metaphors and analogies of earthly relationship.<P>The intercessory work of Christ may thus be represented: He represents man before God in His perfect nature, His exalted office and His completed work. The Scripture word for this is (<a onClick="return mV(\'Hbr\',9,24);">Heb 9:24</a>) "to appear before the face of God for us." There is also an active intercession. This is the office of our Lord as advocate or parakletos. That this conveys some relation to the aid which one who has broken the law receives from an advocate cannot be overlooked, and we find Christ\'s intercession in this aspect brought into connection with the texts which refer to justification and its allied ideas (see <a onClick="return mV(\'Rom\',8,34);">Ro 8:34</a>; <a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a>).<P>2. Christ\'s Intercessory Work from the Standpoint of Prayer:<P>In <a href="study/isbe/search.html?string=PRAYERS+OF+CHRIST">PRAYERS OF CHRIST</a> (which see), the intercessory character of many of our Lord\'s prayers, and especially that of <a onClick="return mV(\'Jhn\',17,\'1-\');">Joh 17</a>, is considered. And it has been impossible for Christian thought to divest itself of the idea that the heavenly intercession of Christ is of the order of prayer. It is impossible for us to know; and even if Christ now prays to the Father, it can be in no way analogous to earthly prayers. The thought of some portion of Christendom distinctly combined prayer in the heavenly work of the Lord. There is danger in extreme views. Scriptural expressions must not be driven too far, and, on the other hand, they must not be emptied of all their contents. Modern Protestant teaching has, in its protest against a merely physical conception of our Lord\'s state and occupation in heaven, almost sublimed reality from His intercessory work. In Lutheran teaching the intercession of our Lord was said to be "vocal," "verbal" and "oral." It has been well remarked that such forms of prayer require flesh and blood, and naturally the teachers of the Reformed churches, for the most part, have contented themselves (as for example Hodge, Syst. Theol., II, 593) with the declaration that "the intercession of Christ includes: (1) His appearing before God in our behalf, as the sacrifice for our sins, as our high priest, on the ground of whose work we receive the remission of our sins, the gift of the Holy Spirit, and all needed good; (2) defense against the sentence of the law and the charges of Satan, who is the great accuser; (3) His offering Himself as our surety, not only that the demands of justice shall be shown to be satisfied, but that His people shall be obedient and faithful; (4) the oblation of the persons of the redeemed, sanctifying their prayers, and all their services, rendering them acceptable to God, through the savor of his own merits."<P>Even this expression of the elements which constitute the intercession of the Lord, cautious and spiritual as it is in its application to Christian thought and worship, must be carefully guarded from a too complete and materialistic use. Without this care, worship and devout thought may become degraded and fall into the mechanical forms by which our Lord\'s position of intercessor has been reduced to very little more than an imaginative and spectacular process which goes on in some heavenly place. It must not be forgotten that the metaphorical and symbolic origin of the ideas which constitute Christ\'s intercession is always in danger of dominating and materializing the spiritual reality of His intercessional office.``14';
isbe[4633]='Interest`in\'-ter-est (neshekh, mashsha\'; tokos): The Hebrew word neshekh is from a root which means "to bite"; thus interest is "something bitten off." The other word, mashsa\', means "lending on interest." The Greek term is from the root tikto, "to produce" or "beget," hence, interest is something begotten or produced by money. The Hebrew words are usually translated "usury," but this meant the same as interest, all interest being reckoned as usury.<P>Long before Abraham\'s time money had been loaned at a fixed rate of interest in Babylonia and almost certainly in Egypt. The Code of Hammurabi gives regulations regarding the lending and borrowing of money, the usual interest being 20 percent. Sometimes it was only 11 2//3 and 13 1/3, as shown by contract tablets. In one case, if the loan was not paid in two months, 18 per cent interest would be charged. Corn (grain), dates, onions, etc., were loaned at interest. Thus Moses and Israel would be familiar with commercial loans and interest. In Israel there was no system of credit or commercial loans in Moses\' time and after. A poor man borrowed because he was poor. The law of Moses (<a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a>) forbade loaning at interest. There was to be no creditor and no taker of interest among them (<a onClick="return mV(\'Lev\',25,36,37);">Le 25:36-37</a>). Deuteronomy permits them to lend on interest to a foreigner (<a onClick="return mV(\'Deu\',23,19,20);">De 23:19-20</a>), but not to a brother Israelite. That this was considered the proper thing in Israel for centuries is seen in <a onClick="return mV(\'Psa\',15,5);">Ps 15:5</a>, while <a onClick="return mV(\'Pro\',28,8);">Pr 28:8</a> implies that it was an unusual thing, interest being generally exacted and profit made. Ezekiel condemns it as a heinous sin (<a onClick="return mV(\'Eze\',18,8,13,17);">Eze 18:8, 13, 17</a>) and holds up the ideal of righteousness as not taking interest (<a onClick="return mV(\'Eze\',22,12);">22:12</A>). <a onClick="return mV(\'Isa\',24,2);">Isa 24:2</a> implies that it was a business in that age, the lender and borrower being social types. Jeremiah implies that there was not always the best feeling between lenders and borrowers (<a onClick="return mV(\'Jer\',15,10);">15:10</A>). According to <a onClick="return mV(\'Neh\',5,7,10);">Ne 5:7, 10</a>, rich Jews were lending to others and exacting heavy interest. Nehemiah condemns such conduct and forbids its continuance, citing himself as an example of lending without interest. The lenders restored 1 percent of that exacted.<P>In the New Testament, references to interest occur in the parable of the Pounds (<a onClick="return mV(\'Luk\',19,23);">Lu 19:23</a>) and of the Talents (<a onClick="return mV(\'Mat\',25,27);">Mt 25:27</a>). Here the men were expected to put their master\'s money out at interest, and condemnation followed the failure to do so. Thus the principle of receiving interest is not condemned in the Old Testament, only it was not to be taken from a brother Israelite. In the New Testament it is distinctly encouraged.`<a href="./study/isbe/search.html?string=USURY">USURY</a>`146';
isbe[4634]='Intermeddle`in-ter-med\'-\'-l (\'arabh, "to mix up (self) with something," "mingle in," "share," "take interest in"): The word occurs only once (<a onClick="return mV(\'Pro\',14,10);">Pr 14:10</a>) in a passage descriptive of "the ultimate solitude of each man\'s soul at all times." "The heart knoweth its own bitterness."<P>"Nor even the tenderest heart, and next our own, Knows half the reasons why we smile and sigh."<P>(Compare <a onClick="return mV(\'1Ki\',8,38);">1Ki 8:38</a>.) Something there is in every sorrow which no one else can share. "And a stranger doth not intermeddle with its joy," not necessarily in an interfering or any offensive way, but simply does not share or take any interest in the other\'s joy.<P>For "intermeddleth with" (<a onClick="return mV(\'Pro\',18,1);">Pr 18:1</a> the King James Version), the Revised Version (British and American) gives "rageth against" (margin "quarrelleth with").``91';
isbe[4635]='Intermediate, State`in-ter-me\'-di-at.`<a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT,+I-V">ESCHATOLOGY OF THE NEW TESTAMENT</a>`1';
isbe[4636]='Interpretation`in-tur-pre-ta\'-shun:<P>1. General Principles:<P>Is a generic term and may refer to any work of literature. Referred specifically to the sacred Scriptures, the science of interpretation is generally known as hermeneutics, while the practical application of the principles of this science is exegesis. In nearly all cases, interpretation has in mind the thoughts of another, and then, further, these thoughts expressed in another language than that of the interpreter. In this sense it is used in Biblical research. A person has interpreted the thoughts of another when he has in his own mind a correct reproduction or photograph of the thought as it was conceived in the mind of the original writer or speaker. It is accordingly a purely reproductive process, involving no originality of thought on the part of the interpreter. If the latter adds anything of his own it is eisegesis and not exegesis. The moment the Bible student has in his own mind what was in the mind of the author or authors of the Biblical books when these were written, he has interpreted the thought of the Scriptures.<P>The interpretation of any specimen of literature will depend on the character of the work under consideration. A piece of poetry and a chapter of history will not be interpreted according to the same principles or rules. Particular rules that are legitimate in the explanation of a work of fiction would be entirely out of place in dealing with a record of facts. Accordingly, the rules of the correct interpretation of the Scriptures will depend upon the character of these writings themselves, and the principles which an interpreter will employ in his interpretation of the Scriptures will be in harmony with his ideas of what the Scriptures are as to origin, character, history, etc. In the nature of the case the dogmatical stand of the interpreter will materially influence his hermeneutics and exegesis. In the legitimate sense of the term, every interpreter of the Bible is "prejudiced," i.e. is guided by certain principles which he holds antecedently to his work of interpretation. If the modern advanced critic is right in maintaining that the Biblical books do not differ in kind or character from the religious books of other ancient peoples, such as the Indians or the Persians, then the same principles that he applies in the case of the Rig Veda or the Zend Avesta he will employ also in his exposition of the Scriptures. If, on the other hand, the Bible is for him a unique collection of writings, Divinely inspired and a revelation from the source of all truth, the Bible student will hesitate long before accepting contradictions, errors, mistakes, etc., in the Scriptures.<P>2. Special Principles:<P>The Scriptures are a Divine and human product combined. That the holy men of God wrote as they were moved by the Spirit is the claim of the Scriptures themselves. Just where the line of demarcation is to be drawn between the human and the Divine factors in the production of the sacred Scriptures materially affects the principles of interpreting these writings (see <a href="study/isbe/search.html?string=INSPIRATION">INSPIRATION</a>). That the human factor was sufficiently potent to shape the form of thought in the Scriptures is evident on all hands. Paul does not write as Peter does, nor John as James; the individuality of the writer of the different books appears not only in the style, choice of words, etc., but in the whole form of thought also. There are such things as a Pauline, a Johannine and a Petrine type of Christian thought, although there is only one body of Christian truth underlying all types. Insofar as the Bible is exactly like other books, it must be interpreted as we do other works of literature. The Scriptures are written in Hebrew and in Greek, and the principles of forms and of syntax that would apply to the explanation of other works written in these languages and under these circumstances must be applied to the Old Testament and New Testament also. Again, the Bible is written for men, and its thoughts are those of mankind and not of angels or creatures of a different or higher spiritual or intellectual character; and accordingly there is no specifically Biblical logic, or rhetoric, or grammar. The laws of thought and of the interpretation of thought in these matters pertain to the Bible as they do to other writings.<P>But in regard to the material contents of the Scriptures, matters are different and the principles of interpretation must be different. God is the author of the Scriptures which He has given through human agencies. Hence, the contents of the Scriptures, to a great extent, must be far above the ordinary concepts of the human mind. When John declares that God so loved the world that He gave His only begotten Son to redeem it, the interpreter does not do justice to the writer if he finds in the word "God" only the general philosophical conception of the Deity and not that God who is our Father through Christ; for it was the latter thought that was in the mind of the writer when he penned these words. Thus, too, it is a false interpretation to find in "Our Father" anything but this specifically Biblical conception of God, nor is it possible for anybody but a believing Christian to utter this prayer (<a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>) in the sense which Christ, who taught it to His disciples, intended.<P>Again, the example of Christ and His disciples in their treatment of the Old Testament teaches the principle that the ipse dixit of a Scriptural passage is to be interpreted as decisive as to its meaning. In the about 400 citations from the Old Testament found in the New Testament, there is not one in which the mere "It is written" is not regarded as settling its meaning. Whatever may be a Bible student\'s theory of inspiration, the teachings and the examples of interpretation found in the Scriptures are in perfect. harmony in this matter.<P>These latter facts, too, show that in the interpretation of the Scriptures principles must be applied that are not applicable in the explanation of other books. As God is the author of the Scriptures He may have had, and, as a matter of fact, in certain cases did have in mind more than the human agents through whom He spoke did themselves understand. The fact that, in the New Testament, persons like Aaron and David, institutions like the law, the sacrificial system, the priesthood and the like, are interpreted as typical of persons and things under the New Covenant shows that the true significance, e.g. of the Levitical system, can be found only when studied in the light of the New Testament fulfillment.<P>Again, the principle of parallelism, not for illustrative but for argumentative purposes, is a rule that can, in the nature of the case, be applied to the interpretation of the Scriptures alone and not elsewhere. As the Scriptures represent one body of truth, though in a kaleidoscopic variety of forms, a statement on a particular subject in one place can be accepted as in harmony with a statement on the same subject elsewhere. In short, in all of those characteristics in which the Scriptures are unlike other literary productions, the principles of interpretation of the Scriptures must also be unlike those employed in other cases.<P>3. Historical Data:<P>Owing chiefly to the dogmatical basis of hermeneutics as a science, there has been a great divergence of views in the history of the church as to the proper methods of interpretation. It is one of the characteristic and instructive features of the New Testament writers that they absolutely refrain from the allegorical method of interpretation current in those times, particularly in the writings of Philo. Not even <a onClick="return mV(\'Gal\',4,22);">Ga 4:22</a>, correctly understood, is an exception, since this, if an allegorical interpretation at all, is an argumentum ad hominem. The sober and grammatical method of interpretation in the New Testament writers stands out, too, in bold and creditable contrast to that of the early Christian exegetes, even of Origen. Only the Syrian fathers seemed to be an exception to the fantasies of the allegorical methods. The Middle Ages produced nothing new in this sphere; but the Reformation, with its formal principle that the Bible and the Bible alone is the rule of faith and life, made the correct grammatical interpretation of the Scriptures practically a matter of necessity. In modern times, not at all prolific in scientific discussions of hermeneutical principles and practices, the exegetical methods of different interpreters are chiefly controlled by their views as to the origin and character of the Scriptural books, particularly in regard to their inspiration.<P>LITERATURE.<P>Terry, Biblical Hermeneutics, New York, 1884. Here the literature is fully given, as also in Weidner\'s Theological Encyclopedia, I, 266ff.``159';
isbe[4637]='Interpretation of Tongues``<a href="./study/isbe/search.html?string=TONGUES,+INTERPRETATION,+OF">TONGUES, INTERPRETATION OF</a>`1';
isbe[4638]='Interrogation`in-ter-o-ga\'-shun (eperotema): This word is not found at all in the King James Version, and once only in the American Standard Revised Version (<a onClick="return mV(\'1Pe\',3,21);">1Pe 3:21</a>), where it replaces the word "answer" of the King James Version. This change according to Alford and Bengel is correct. "The interrogation of a good conscience" may refer to the question asked of a convert before baptism (compare <a onClick="return mV(\'Act\',8,37);">Ac 8:37</a>), or the appeal of the convert to God (compare <a onClick="return mV(\'1Jo\',3,\'20-21\');">1Joh 3:20-21</a>). The opportunity to do this was given in baptism.``1';
isbe[4639]='Intreat; Intreaty; (Entreat)`in-tret\', in-tret\'-i: The two forms are derived from the same verb. In 1611 the spelling was indifferently "intreat" or "entreat." In editions of the King James Version since 1760 "intreat" is used in the sense of "to beg"; "entreat" in the sense of "deal with." As examples of "intreat" see <a onClick="return mV(\'Exd\',8,8);">Ex 8:8</a>, "Intreat the Lord" (tsa\'aq); <a onClick="return mV(\'Rth\',1,16);">Ru 1:16</a>, "Intreat me not to leave thee" (pagha\'); <a onClick="return mV(\'2Cr\',8,4);">2Co 8:4</a>, "praying us with much entreaty" paraklesis). In <a onClick="return mV(\'Gen\',25,21);">Ge 25:21</a> "intreat" is used to indicate the success of a petition. For entreat see <a onClick="return mV(\'Gen\',12,16);">Ge 12:16</a>, "He entreated Abraham well"; <a onClick="return mV(\'Act\',27,3);">Ac 27:3</a>, "And Julius courteously entreated Paul" (philanthropos chresamenos, literally, "to use in a philanthropic way"); compare also <a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>, where eupeithes, literally, "easily persuaded," is translated "easy to be entreated."<P>The Revised Version changes all passages of the King James Version where "intreat" is found to "entreat," with the exception of those mentioned below. The meaning of "entreat" is "to ask," "to beseech," "to supplicate": <a onClick="return mV(\'Job\',19,17);">Job 19:17</a> reads "and my supplication to the children" (hannothi, the King James Version "though I entreated for the children," the Revised Version, margin "I make supplication"). <a onClick="return mV(\'Jer\',15,11);">Jer 15:11</a> reads, "I will cause the enemy to make supplication" (hiphga\'ti), instead, the King James Version "I will cause the enemy to entreat" (the Revised Version margin "I will intercede for thee with the enemy"). <a onClick="return mV(\'1Ti\',5,1);">1Ti 5:1</a> changes the King James Version "intreat" to "exhort." <a onClick="return mV(\'Phl\',4,3);">Php 4:3</a> renders the King James Version "entreat" by "beseech."``121';
isbe[4640]='Inward Man`in\'-werd: A Pauline term, nearly identical with the "hidden man of the heart" (<a onClick="return mV(\'1Pe\',3,4);">1Pe 3:4</a>). The Greek original, ho eso (also esothen) anthropos (<a onClick="return mV(\'Rom\',7,22);">Ro 7:22</a>) is lexigraphically defined "the internal man," i.e. "soul," "conscience." It is the immaterial part of man—mind, spirit—in distinction from the "outward man" which "perishes" (<a onClick="return mV(\'2Cr\',4,16);">2Co 4:16</a> the King James Version). As the seat of spiritual influences it is the sphere in which the Holy Spirit does His renewing and saving work (<a onClick="return mV(\'Eph\',3,16);">Eph 3:16</a>). The term "inward man" cannot be used interchangeably with "the new man," for it may still be "corrupt," and subject to "vanity" and "alienated from the life of God." Briefly stated, it is mind, soul, spirit—God\'s image in man—man\'s higher nature, intellectual, moral, and spiritual.``139';
isbe[4641]='Inward Part`A symbolic expression in the Old Testament represented by three Hebrew words: chedher, "chamber," hence, inmost bowels or breast; tuchoth, "the reins"; qerebh, "midst," "middle," hence, heart. Once in the New Testament (esothen, "from within," <a onClick="return mV(\'Luk\',11,39);">Lu 11:39</a>). The viscera (heart, liver, kidneys) were supposed by the ancients to be the seat of the mind, feelings, affections: the highest organs of the psyche, "the soul." The term includes the intellect ("wisdom in the inward parts," <a onClick="return mV(\'Job\',38,36);">Job 38:36</a>); the moral nature ("inward part is very wickedness," <a onClick="return mV(\'Psa\',5,9);">Ps 5:9</a>); the spiritual ("my law in their inward parts," <a onClick="return mV(\'Jer\',31,33);">Jer 31:33</a>). Its adverbial equivalent in Biblical use is "inwardly." <a href="study/isbe/search.html?string=INWARD+MAN">INWARD MAN</A> (which see) is identical in meaning.``139';
isbe[4642]='Iob`yob (yobh; the King James Version Job): Third son of Issachar (<a onClick="return mV(\'Gen\',46,13);">Ge 46:13</a>). In parallel passages (<a onClick="return mV(\'Num\',26,24);">Nu 26:24</a>; <a onClick="return mV(\'1Ch\',7,1);">1Ch 7:1</a>) the name is Jashub (yashubh), which the versions in Genesis also support as the correct form.``1';
isbe[4643]='Iphdeiah`if-de\'-ya (yiphdeyah, "Yah redeems"; the King James Version Iphedeiah): A descendant of Benjamin (<a onClick="return mV(\'1Ch\',8,25);">1Ch 8:25</a>).``1';
isbe[4644]='Iphtah`if\'-ta (yiphtach; the King James Version Jiphtah): An unidentified town in the Shephelah of Judah, named with Libnab, Ether and Ashan (<a onClick="return mV(\'Jos\',15,43);">Jos 15:43</a>).``1';
isbe[4645]='Iphtah-El`if\'-ta-el (yiphtach-\'el; the King James Version Jiphtah-el): The valley of Iphtah-el lay on the north border of Zebulun (<a onClick="return mV(\'Jos\',19,14,27);">Jos 19:14, 27</a>). Northwest of the plain of el-Battauf stands a steep hill, connected only by a low saddle with the hills on the north. The name Tell Jefat suggests the Jotapata of Josephus (BJ, III, vi, i; vii, i, etc.), and the place answers well to his description. It probably corresponds to the ancient Iphtah-el. In that case the valley is most probably that which begins at Tell Jefat, passes round the south of Jebel Kaukab, and, as Wady \'Abellin, opens on the plain of Acre.``54';
isbe[4646]='Ir`ir (\'ir): A descendant of Benjamin (<a onClick="return mV(\'1Ch\',7,12);">1Ch 7:12</a>), called Iri in <a onClick="return mV(\'1Ch\',7,7);">1Ch 7:7</a>.``1';
isbe[4647]='Ir-Ha-Heres`ir-ha-he\'-rez (\'ir haherec, according to the Massoretic Text, Aquila, Theodotion, Septuagint, the King James Version and the Revised Version (British and American); according to some Hebrew manuscripts, Symmachus, and the Vulgate, \'ir ha-cherec): A city of Egypt referred to in <a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a>. Jewish quarrels concerning the temple which Onias built in Egypt have most probably been responsible for the altering of the texts of some of the early manuscripts, and it is not now possible to determine absolutely which have been altered and which accord with the original. This difference in manuscripts gives rise to different opinions among authorities here to be noted. Most of the discussion of this name arises from this uncertainty and is hence rather profitless.<P>The starting-point of any proper discussion of Ir-ha-h is that the words are by Isaiah and that they are prophecy, predictive prophecy. They belong to that portion of the prophecies of Isaiah which by nearly all critics is allowed to the great prophet. Nothing but unfounded speculation or an unwillingness to admit that there is any predictive prophecy can call in question Isaiah\'s authorship of these words. Then the sense of the passage in which these words occur imperatively demands that they be accounted predictive prophecy. Isaiah plainly refers to the future, "shall be called"; and makes a definite statement concerning what shall take place in the future (<a onClick="return mV(\'Isa\',19,\'18-24\');">19:18-24</A>). The reality of predictive prophecy may be discussed by those so inclined, but that the intention of the author here was to utter predictive prophecy does not seem to be open to question. For the verification of this prediction by its fulfillment in history we shall inquire concerning:<P>(1) the times intended: "that day";<P>(2) the "five cities";<P>(3) "Ir-ha-heres."<P>1. The Times Intended: "That Day":<P>The prophet gives a fairly specific description of "that day." It was at least to begin when "there shall be five cities in the land of Egypt that speak the language of Canaan, and swear to Yahweh of hosts" (<a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a>), and "In that day shall there be an altar to Yahweh in the midst of the land of Egypt, and a pillar at the border thereof to Yahweh" (<a onClick="return mV(\'Isa\',19,19);">Isa 19:19</a>). There was to be also some inroad made upon the heathenism of Egypt by the message of the Lord (<a onClick="return mV(\'Isa\',19,21);">Isa 19:21</a>f), and about that time a deliverer should arise in Egypt (<a onClick="return mV(\'Isa\',19,20);">Isa 19:20</a>), and all this should take place before the power of the land of Assyria should pass away (<a onClick="return mV(\'Isa\',19,23);">Isa 19:23</a>f) .<P>2. The "Five Cities":<P>The first historical fulfillment of these words is found at the period when Onias built his imitation of the Temple of Jerusalem at the place called by the Greeks Leontopolis (Tell el-Yehudiyeh), and the worship of Yahweh was set up at Elephantine, and the Jews were a great power at Alexandria and at Tahpanhes. While any of these latter three might have contained the "pillar," the "altar" would thus be either at Leontopolis or the other one of the "five cities" which cannot be named with much probability. The great deliverer would seem to be Alexander. Some think that the conversion of the Egyptians indicated in <a onClick="return mV(\'Isa\',19,21,22);">Isa 19:21-22</a> is furthered, though still not completed, in the Christian invasion of the 1st century, and again in the success of modern Christian missions in Egypt.<P>3. "Ir-ha-heres":<P>It will be seen that it does not follow from what has been said that Leontopolis was Ir-ha-h as some seem to think. It is not said by the prophet that the place where was the "altar" was called Ir-ha-h, even if it were certain that the altar was at Leontopolis. Nevertheless, Leontopolis may be Ir-ha-h. The problem is not in the first place the identification of the name, but the determination of which one of the "five cities" was destroyed. The expression "shall be called the city of destruction" seems clearly to indicate that Ir-ha-h is not a name at all, but merely a descriptive appellation of that city which should "be destroyed." It still remains to inquire whether or not this was an independent appellation, or whether, more probably, it bore some relation to the name of that city at the time at which the prophet wrote, a play upon the sound, or the significance of the name or both of these, either through resemblance or contrast. If Gesenius is right, as he seems to be, in the opinion that "in the idiom of Isaiah Ir-ha-h means simply \'the city that shall be destroyed,\' " then the original problem of finding which one of the cities was destroyed seems to be the whole problem. Still, in the highly-wrought language of Isaiah and according to the genius of the Hebrew tongue, there is probably a play upon words. It is here that the consideration of the name itself properly comes in and probably guides us rightly. Speculation, by Gesenius, Duhm, Cheyne and others, has proposed various different readings of this name, some of them requiring two or three changes in the text to bring it to its present state. Speculation can always propose readings. On was sometimes called "Heres" and meant "house of the sun," which would be both translated and transliterated into Hebrew ha-cherec and might have \'ir ("city") prefixed. Naville, through his study of the great Harris papyrus, believed that the old Egyptian city which later was called Leontopolis (Tell el-Yehudiyeh) was immediately connected with On and called "House of Ra," also "House of the Sun." Thus, this name might be both transliterated and translated into the Hebrew ha-cherec and have \'ir prefixed. The difference between this expression and "Ir-ha-h" which Isaiah used is only the difference between "h" and "ch." So that Ir-ha-h is most probably a predictive prophecy concerning the disaster that was to overtake one of the "five cities," with a play upon the name of the city, and that city is either On, the later Heliopolis, or the ancient sacred city about 4 miles to the north of On, where Onias was to build his temple and which later became Leontopolis (Tellel-Yehudiyeh). No more positive identification of Ir-ha-h is yet possible.``93';
isbe[4648]='Ir-Nahash`ur-na\'-hash, ir-na\'-hash (\'ir nachash): A town of Judah of which Tehinnah is called the "father," probably meaning "founder" (<a onClick="return mV(\'1Ch\',4,12);">1Ch 4:12</a>). English Versions of the Bible margin suggests the translation "city of Nahash."``1';
isbe[4649]='Ir-Shemesh`ur-she\'-mesh, ir-she\'-mesh (\'ir shemesh, "city of the sun").`<a href="./study/isbe/search.html?string=BETH+SHEMESH">BETH-SHEMESH</a>; <a href="./study/isbe/search.html?string=HERES">HERES</a>`1';
isbe[4650]='Ira`i\'-ra (\'ira\'; Eiras):<P>(1) A person referred to in <a onClick="return mV(\'2Sa\',20,26);">2Sa 20:26</a> as "priest" (so the Revised Version (British and American) correctly; the King James Version "a chief ruler," the American Standard Revised Version "chief minister") unto David. The translation of the Revised Version (British and American) is the only possible one; but, according to the text, Ira was "a Jairite," and thus of the tribe of Manasseh (<a onClick="return mV(\'Num\',32,41);">Nu 32:41</a>) and not eligible to the priesthood. On the basis of the Peshitta some would correct "Jairite" of <a onClick="return mV(\'2Sa\',20,26);">2Sa 20:26</a> into "Jattirite," referring to Jattir, a priestly city within the territory of Judah (<a onClick="return mV(\'Jos\',21,14);">Jos 21:14</a>). Others point to <a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a> margin, "David\'s sons were priests," as an indication that in David\'s time some non-Levites were permitted to serve—in some sense—as priests.<P>(2) An "Ithrite," or (with a different pointing of the text) a "Jattirite," one of David\'s "thirty" (<a onClick="return mV(\'2Sa\',23,38);">2Sa 23:38</a> parallel <a onClick="return mV(\'1Ch\',11,40);">1Ch 11:40</a>); possibly identical with (1).<P>(3) Another of David\'s "thirty," son of Ikkesh of Tekoa (<a onClick="return mV(\'2Sa\',23,26);">2Sa 23:26</a>; <a onClick="return mV(\'1Ch\',11,28);">1Ch 11:28</a>) and a captain of the temple guard (<a onClick="return mV(\'1Ch\',27,9);">1Ch 27:9</a>).``57';
isbe[4651]='Irad`i\'-rad (\'iradh; Septuagint Gaidad): Grandson of Cain and son of Enoch (<a onClick="return mV(\'Gen\',4,18);">Ge 4:18</a>).``1';
isbe[4652]='Iram`i\'-ram (\'iram; Septuagint variously in Gen): A "chief" of Edom (<a onClick="return mV(\'Gen\',36,43);">Ge 36:43</a> parallel <a onClick="return mV(\'1Ch\',1,54);">1Ch 1:54</a>).``1';
isbe[4653]='Iri`i\'-ri (\'iri).`<a href="./study/isbe/search.html?string=IR">IR</a>; <a href="./study/isbe/search.html?string=URIAS">URIAS</a>`1';
isbe[4654]='Irijah`i-ri\'-ja (yir\'iyayh, "Yah sees"): A captain at the gate of Benjamin in Jerusalem, who arrested Jeremiah the prophet on suspicion of intending to desert to the Chaldeans (<a onClick="return mV(\'Jer\',37,13,14);">Jer 37:13-14</a>).``1';
isbe[4655]='Iron (1)`i\'-urn (barzel; sideros): It is generally believed that the art of separating iron from its ores and making it into useful forms was not known much earlier than 1000 BC, and that the making of brass (bronze) antedates it by many centuries, in spite of the frequent Biblical references where brass and iron occur together. This conjecture is based upon the fact that no specimen of worked iron has been found whose antiquity can be vouched for. The want of such instruments, however, can be attributed to the ease with which iron corrodes. Evidence that iron was used is found, for example, in the hieroglyphics of the tomb of Rameses III, where the blades of some of the weapons are painted blue while others are painted red, a distinction believed to be due to the fact that some were made of iron or steel and some of brass. No satisfactory proof has yet been presented that the marvelous sculpturing on the hard Egyptian granite was done with tempered bronze. It seems more likely that steel tools were used. After the discovery of iron, it was evidently a long time in replacing bronze. This was probably due to the difficulties in smelting it. An old mountaineer once described to the writer the process of iron smelting as it was carried on in Mt. Lebanon in past centuries. As a boy he had watched his father, who was a smelter, operate one of the last furnaces to be fired. For each firing, many cords of wood, especially green oak branches, were used, and several days of strenuous pumping at the eight bellows was necessary to supply the air blast. As a result a small lump of wrought iron was removed from the bottom of the furnace after cooling. The iron thus won was carried to Damascus where it was made into steel by workers who kept their methods secret. This process, which has not been worked now for years, was undoubtedly the same as was used by the ancients. It is not at all unlikely that the Lebanon iron, transformed into steel, was what was referred to as "northern iron" in <a onClick="return mV(\'Jer\',15,12);">Jer 15:12</a> (the King James Version). In many districts the piles of slag from the ancient furnaces are still evident.<P>Aside from the limited supply of iron ore in Mt. Lebanon (compare <a onClick="return mV(\'Deu\',8,9);">De 8:9</a>), probably no iron was found in Syria and Palestine. It was brought from Tarshish (<a onClick="return mV(\'Eze\',27,12);">Eze 27:12</a>) and Vedan and Jayan (<a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a>), and probably Egypt (<a onClick="return mV(\'Deu\',4,20);">De 4:20</a>).<P>The first mention of iron made in the Bible is in <a onClick="return mV(\'Gen\',4,22);">Ge 4:22</a>, where Tubal-Cain is mentioned as "the forger of every cutting instrument of brass and iron." It is likely that the Jews learned the art of metallurgy from the Phoenicians (<a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a>) (see <a href="study/isbe/search.html?string=CRAFTS">CRAFTS</A>). Iron was used in Biblical times much as it is today. For a description of a smith at work see Ecclesiasticus 38:28. Huge city gates, overlaid with strips of iron (<a onClick="return mV(\'Psa\',107,16);">Ps 107:16</a>; <a onClick="return mV(\'Isa\',45,2);">Isa 45:2</a>), held in place by crude square-headed nails (<a onClick="return mV(\'1Ch\',22,3);">1Ch 22:3</a>), are still a familiar sight in the larger cities of Palestine and Syria (<a onClick="return mV(\'Act\',12,10);">Ac 12:10</a>). Threshing instruments were made of iron (<a onClick="return mV(\'Amo\',1,3);">Am 1:3</a>); so also harrows (<a onClick="return mV(\'2Sa\',12,31);">2Sa 12:31</a>), axes (ib; <a onClick="return mV(\'2Ki\',6,6);">2Ki 6:6</a>; see <a href="study/isbe/search.html?string=AX">Ax</a>), branding irons (<a onClick="return mV(\'1Ti\',4,2);">1Ti 4:2</a>), and other tools (<a onClick="return mV(\'1Ki\',6,7);">1Ki 6:7</a>). There were iron weapons (<a onClick="return mV(\'Num\',35,16);">Nu 35:16</a>; <a onClick="return mV(\'Job\',20,24);">Job 20:24</a>), armor (<a onClick="return mV(\'2Sa\',23,7);">2Sa 23:7</a>), horns (<a onClick="return mV(\'1Ki\',22,11);">1Ki 22:11</a>), fetters (<a onClick="return mV(\'Psa\',105,18);">Ps 105:18</a>), chariots (<a onClick="return mV(\'Jos\',17,16);">Jos 17:16</a>), yokes (<a onClick="return mV(\'Jer\',28,14);">Jer 28:14</a>), breastplates (<a onClick="return mV(\'Rev\',9,9);">Re 9:9</a>), pens (chisels) (<a onClick="return mV(\'Job\',19,24);">Job 19:24</a>; <a onClick="return mV(\'Jer\',17,1);">Jer 17:1</a>), sheets or plates (<a onClick="return mV(\'Eze\',4,3);">Eze 4:3</a>), gods (<a onClick="return mV(\'Dan\',5,4);">Da 5:4</a>), weights (<a onClick="return mV(\'1Sa\',17,7);">1Sa 17:7</a>), bedsteads (<a onClick="return mV(\'Deu\',3,11);">De 3:11</a>). Iron was used extensively in building the temple.<P>Figurative: "The iron furnace" is used metaphorically for affliction, chastisement (<a onClick="return mV(\'Deu\',4,20);">De 4:20</a>; <a onClick="return mV(\'Eze\',22,\'18-22\');">Eze 22:18-22</a>). Iron is also employed figuratively to represent barrenness (<a onClick="return mV(\'Deu\',28,23);">De 28:23</a>), slavery ("yoke of iron," <a onClick="return mV(\'Deu\',28,48);">De 28:48</a>), strength ("bars of iron," <a onClick="return mV(\'Job\',40,18);">Job 40:18</a>), severity ("rod of iron," <a onClick="return mV(\'Psa\',2,9);">Ps 2:9</a>), captivity (<a onClick="return mV(\'Psa\',107,10);">Ps 107:10</a>), obstinacy ("iron sinew," <a onClick="return mV(\'Isa\',48,4);">Isa 48:4</a>), fortitude ("iron pillar," <a onClick="return mV(\'Jer\',1,18);">Jer 1:18</a>), moral deterioration (<a onClick="return mV(\'Jer\',6,28);">Jer 6:28</a>), political strength (<a onClick="return mV(\'Dan\',2,33);">Da 2:33</a>), destructive power ("iron teeth," <a onClick="return mV(\'Dan\',7,7);">Da 7:7</a>); the certainty with which a real enemy will ever show his hatred is as the rust returning upon iron (Ecclesiasticus 12:10 the King James Version, the Revised Version (British and American) "brass"); great obstacles ("walls of iron," 2Macc 11:9).`<a href="./study/isbe/search.html?string=METALS">METALS</a>`133';
isbe[4656]='Iron (2)`i\'-ron (yir\'on): One of the fenced cities in the territory of Naphtali, named with Migdal-el and En-hazor (<a onClick="return mV(\'Jos\',19,38);">Jos 19:38</a>). It is represented by the modern Yarun, a village with the ruins of a synagogue, at one time used as a monastery, fully 6 miles West of Qedes.``1';
isbe[4657]='Irpeel`ur\'-pe-el, ir\'-pe-el (yirpe\'el): An unidentified city in Benjamin (<a onClick="return mV(\'Jos\',18,27);">Jos 18:27</a>). It may possibly be represented by Rafat, a ruin to the north of el-Jib, the ancient Gibeon.``1';
isbe[4658]='Irreverence`i-rev\'-er-ens.`<a href="./study/isbe/search.html?string=CRIME+CRIMES">CRIME, CRIMES</a>`1';
isbe[4659]='Irrigation`ir-i-ga\'-shun: No equivalent for this word is found in Biblical writings, although the use of irrigation for maintaining vegetable life is frequently implied (<a onClick="return mV(\'Ecc\',2,5,6);">Ec 2:5-6</a>; <a onClick="return mV(\'Isa\',58,11);">Isa 58:11</a>). To one familiar with the methods of irrigation practiced in Palestine, Syria and Egypt, the passage, "where thou sowedst thy seed, and wateredst it with thy foot, as a garden of herbs" (<a onClick="return mV(\'Deu\',11,10);">De 11:10</a>), is easily explained. The water is brought in channels to the gardens, where it is distributed in turn to the different square plots bounded by banks of earth, or along the rows of growing vegetables planted on the sides of the trenches. In stony soil the breach in the canal leading to a particular plot is opened and closed with a hoe. Any obstruction in the trench is similarly removed, while in the soft, loamy soil of the coastal plain or in the Nile valley these operations can be done with the foot; a practice still commonly seen.<P>The remains of the great irrigation works of the ancient Egyptians and Babylonians leave no doubt as to the extent to which they used water to redeem the deserts. In Palestine and Syria there was less need (<a onClick="return mV(\'Deu\',10,7);">De 10:7</a>; <a onClick="return mV(\'Deu\',11,11);">11:11</a>) for irrigation. Here there is an annual fall of from 30 to 40 inches, coming principally during the winter. This is sufficient for the main crops. The summer supply of vegetables, as well as the fruit and mulberry trees, requires irrigation. Hardly a drop of many mountain streams is allowed to reach the sea, but is used to water the gardens of the mountain terraces and plains. This supply is now being supplemented by the introduction of thousands of pumps and oil engines for raising the water of the wells sufficiently to run it through the irrigation canals. Where a spring is small, its supply is gathered into a birket, or cistern, and then drawn off through a large outlet into the trenches, sometimes several days being required to fill the cistern. In <a onClick="return mV(\'Ecc\',2,6);">Ec 2:6</a>, Solomon is made to say, "I made me pools of water, to water therefrom the forest." This passage helps to explain the uses of the so-called Pools of Solomon, south of Jerusalem. In this same district are traces of the ancient terraces which were probably watered from these pools.`<a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>; <a href="./study/isbe/search.html?string=GARDEN">GARDEN</a>`133';
isbe[4660]='Iru`i\'-roo (\'iru): Eldest son of Caleb (<a onClick="return mV(\'1Ch\',4,15);">1Ch 4:15</a>); probably to be read Ir, the syllable "-u" being the conjunction "and" belonging to the following word.``1';
isbe[4661]='Isaac`i\'-zak:<P><b>I. NAME</b><P class="in15">1. Root, Forms, Analogues<P class="in15">2. Implication<P><b>II. FAMILY AND KINDRED</b><P class="in15">1. Birth and Place in the Family<P class="in15">2. Relation to the Religious Birthright<P class="in15">3. Significance of Marriage<P><b>III. STORY OF LIFE</b><P class="in15">1. Previous to Marriage<P class="in15">2. Subsequent to Marriage<P><b>IV. BIBLICAL REFERENCES</b><P class="in15">1. In the Old Testament<P class="in15">2. In the New Testament<P><b>V. VIEWS OTHER THAN THE HISTORICAL</b><hr /><P>I. Name.<P>1. Root, Forms and Analogues:<P>This name has the double spelling, yitschaq, and yitschaq (Isaak), corresponding to the two forms in which appears the root meaning "to laugh"—a root that runs through nearly all the Semitic languages. In Hebrew both tsachaq and sachaq have their cognate nouns, and signify, in the simple stem, "to laugh," in the intensive stem, "to jest, play, dance, fondle," and the like. The noun yitshar, meaning "fresh oil," from a root tsahar ("to be bright, conspicuous"), proves that nouns can be built on precisely the model of yitschaq, which would in that case signify "the laughing one," or something similar. Yet Barth (Die Nominalbildung in den semitischen Sprachen, 154, b and c) maintains that all proper names beginning with yodh prefixed to the root are really pure imperfects, i.e. verbal forms with some subject to be understood if not actually present. Hence, Isaac would mean "laughs": either indefinite, "one laughs," or "he laughs," namely, the one understood as the subject. There are some 50 Hebrew names that have a similar form with no accompanying subject. Of these sometimes the meaning of the root is quite obscure, sometimes it is appropriate to any supposable subject. Each is a problem by itself; for the interpretation of any one of them there is little help to be gained from a comparison with the others.<P>2. Implication:<P>What subject, then, is to be understood with this imperfect verb yitschaq? Or is no definite subject to be supplied?<P>(1) \'El, God, may be supplied: "God laughs." Such an expression might be understood of the Divine benevolence, or of the fearful laughter of scorn for His enemies (<a onClick="return mV(\'Psa\',2,4);">Ps 2:4</a>), or, euphemistically, of the Divine wrath, the "terrible glance," as of Moloch, etc. (so Meyer, Israeliten und ihre Nachbarstdmme, 255).<P>(2) Some human person: "he laughs." So, for example, he himself, namely, the child who receives the name; or, the father; or, the brother (not the mother, which would require titschaq). In the light now of these possibilities we turn to the narratives of Isaac\'s birth and career and find the following subjects suggested:<P>(a) father, <a onClick="return mV(\'Gen\',17,17);">Ge 17:17</a>;<P>(b) indefinite, "one laughs" (not "she laughs," see above), <a onClick="return mV(\'Gen\',18,\'12-15\');">Ge 18:12-15</a>; <a onClick="return mV(\'Gen\',21,6);">21:6</a>;<p>(c) brother, <a onClick="return mV(\'Gen\',21,9);">Ge 21:9</a>;<p>(d) himself, <a onClick="return mV(\'Gen\',26,8);">Ge 26:8</a>. Of these passages the last two show the verb in the intensive stem in the signification of (c) "mock" (?), and (d) "dally."<P>We find this same verb in these senses in <a onClick="return mV(\'Gen\',19,14);">Ge 19:14</a> and <a onClick="return mV(\'Gen\',39,14,17);">39:14,17</a>, in the stories of Lot and of Joseph, and it is possible that here also in the story of Isaac it has no more connection with the name Isaac than it has there with the names Lot and Joseph. However, this may be, there is obviously one interpretation of the name Isaac, which, required in two of the passages, is equally appropriate in them all, namely, that with the indefinite subect, "one laughs." Consideration of the sources to which these passages are respectively assigned by the documentary hypothesis tends only to confirm this result.<P>II. Family and Kindred.<P>The two things in Isaac\'s life that are deemed worthy of extensive treatment in the sacred narrative are his birth and his marriage. His significance, in fact, centers in his transmission of what went before him to what came after him. Hence, his position in his father\'s family, his relation to its greatest treasure, the religious birthright, and his marriage with Rebekah are the subjects that require special notice in this connection.<P>1. Birth and Place in the Family:<P>The birth of Isaac is represented as peculiar in these respects: the age of his parents, the purity of his lineage, the special Divine promises accompanying. What in Abraham\'s life is signalized by the Divine "call" in the from his father\'s house, and what in Jacob\'s life is brought about by a series of providential interpositions, seems in Isaac\'s case to become his by his birth. His mother, who is not merely of the same stock as Abraham but actually his half-sister, is the legal wife. As her issue Isaac is qualified by the laws of inheritance recognized in their native land to become his father\'s heir. But Ishmael, according to those laws, has a similarly valid claim (see <a href="study/isbe/search.html?string=ABRAHAM">ABRAHAM, iv, 2</a>), and it is only by express command that Abraham is led to abandon what was apparently both custom and personal preference, to "cast out the bondwoman and her son," and to acquiesce in the arrangement that "in Isaac shall thy seed be called."<P>2. Relation to the Religious Birthright:<P>But the birthright of Isaac was of infinitely more importance than the birthright in the family of any other wealthy man of that day. All that limitless blessing with which Abraham set forth under God\'s leadership was promised not only to him but to his "seed"; it was limitless in time as well as in scope. To inherit it was of more consequence to Isaac than to inherit any number of servants, flocks or wells of his father\'s acquisition. A sense of these relative values seems to have been a part of Isaac\'s spiritual endowment, and this, more than anything else related of him, makes him an attractive figure on the pages of Gen.<P>3. Significance of Marriage:<P>The raising up of a "seed" to be the bearers of these promises was the prime concern of Isaac\'s life. Not by intermarriage with the Canaanites among whom he lived, but by marriage with one of his own people, in whom as much as in himself should be visibly embodied the separateness of the chosen family of God—thus primarily was Isaac to pass on to a generation as pure as his own the heritage of the Divine blessing. Rebekah enters the tent of Isaac as truly the chosen of God as was Abraham himself.<P>III. Story of Life.<P>Previous to his marriage Isaac\'s life is a part of the story of Abraham; after his marriage it merges into that of his children. It is convenient, therefore, to make his marriage the dividing-line in the narrative of his career.<P>1. Previous to Marriage:<P>A child whose coming was heralded by such signal marks of Divine favor as was Isaac\'s would be, even apart from other special considerations, a welcome and honored member of the patriarchal household. The covenant-sign of circumcision (which Isaac was the first to receive at the prescribed age of 8 days), the great feast at his weaning, and the disinheritance of Ishmael in his favor, are all of them indications of the unique position that this child held, and prepare the reader to appreciate the depth of feeling involved in the sacrifice of Isaac, the story of which follows thereupon. The age of Isaac at the time of this event is not stated, but the fact that he is able to carry the wood of the offering shows that he had probably attained his full growth. The single question he asks his father and his otherwise unbroken silence combine to exhibit him in a favorable light, as thoughtful, docile and trustful. The Divine interposition to save the lad thus devoted to God constitutes him afresh the bearer of the covenant-promise and justifies its explicit renewal on this occasion. From this point onward the biographer of Isaac evidently has his marriage in view, for the two items that preceded the long 24th chaper, in which Rebekah\'s choice and coming are rehearsed, are, first, the brief genealogical paragraph that informs the reader of the development of Nahor\'s family just as far as to Rebekah, and second, the chapter that tells of Sarah\'s death and burial—an event clearly associated in the minds of all with the marriage of Isaac (see <a onClick="return mV(\'Gen\',24,3,16,67);">Ge 24:3, 16, 67</a>). Divine interest in the choice of her who should be the mother of the promised seed is evident in every line of the chapter that dramatizes the betrothal of Isaac and Rebekah. Their first meeting is described at its close with the tender interest in such a scene natural to every descendant of the pair, and Issac is sketched as a man of a meditative turn (<a onClick="return mV(\'Gen\',24,63);">Ge 24:63</a>) and an affectionate heart (<a onClick="return mV(\'Gen\',24,67);">Ge 24:67</a>).<P>2. Subsequent to Marriage:<P>The dismissal of the sons of Abraham\'s concubines to the "East-country" is associated with the statement that Isaac inherited all that Abraham had; yet it has been remarked that, besides supplying them with gifts, Abraham was doing them a further kindness in thus emancipating them from continued subjection to Isaac, the future head of the clan. After Abraham\'s death we are expressly informed that God "blessed Isaac his son" in fulfillment of previous promise. The section entitled "the toledhoth (generations) of Isaac" extends from <a onClick="return mV(\'Gen\',25,\'19-\');">Ge 25:19 to 35:29</a>. At the opening of it Isaac is dwelling at Beer-lahai-roi (<a onClick="return mV(\'Gen\',25,11);">25:11</A>), then at Gerar (<a onClick="return mV(\'Gen\',26,1,6);">26:1,6</a>) and "the valley of Gerar" (<a onClick="return mV(\'Gen\',26,17);">26:17</A>), then at Beer-sheba (<a onClick="return mV(\'Gen\',26,23);">26:23</a>; <a onClick="return mV(\'Gen\',28,10);">28:10</a>), all localities in the Negeb or "south-country." But after the long narrative of the fortunes of Jacob and his family, occupying many years, we find Isaac at its close living where his father Abraham had lived, at Hebron.<P>For 20 years Isaac and Rebekah remained childless; it was only upon the entreaty of Isaac that God granted them their twin sons. A famine was the usual signal for emigration to Egypt (compare <a onClick="return mV(\'Gen\',12,10);">Ge 12:10</a>; <a onClick="return mV(\'Gen\',42,2);">42:2</a>); and Isaac also appears to have been on his way thither for the same cause, when, at Gerar, he is forbidden by God to proceed, and occasion is found therein to renew to him the covenant-promise of his inheritance: land, posterity, honor and the Divine presence (<a onClick="return mV(\'Gen\',26,\'1-4\');">Ge 26:1-4</a>).<P>But Isaac had also received from his father traditions of another sort; he too did not hesitate to say to the men of Gerar that his wife was his sister, with the same intent to save his own life, but without the same justification in fact, as in the case of Abraham\'s earlier stratagem. Yet even the discovery by the king of Gerar of this duplicity, and repeated quarrels about water in that dry country, did not suffice to endanger Isaac\'s status with the settled inhabitants, for his large household and great resources made him a valuable friend and a dangerous enemy.<P>The favoritism which Isaac showed for one son and Rebekah for the other culminated in the painful scene when the paternal blessing was by guile obtained for Jacob, and in the subsequent enforced absence of Jacob from his parental home. Esau, too, afforded no comfort to his father and mother, and ere long he also withdrew from his father\'s clan. The subsequent reconciliation of the brothers permitted them to unite at length in paying the last honors to Isaac on his decease. Isaac was buried at Hebro
