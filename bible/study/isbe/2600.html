<script type="text/javascript">
isbe = [];

isbe[2601]='Declaration; Declare`dek-la-ra\'-shun, deklar\':"Declare" is the translation of a variety of Hebrew and Greek words in the Old Testament and New Testament, appearing to bear uniformly the meaning "to make known," "set forth," rather than (the older meaning) "to explain" (<a onClick="return mV(\'Deu\',1,5);">De 1:5</a>). Declaration (<a onClick="return mV(\'Est\',10,2);">Es 10:2</a> the King James Version, the Revised Version (British and American) "full account"; <a onClick="return mV(\'Job\',13,17);">Job 13:17</a>; <span class="noTag">Ecc 43:6</a>; <a onClick="return mV(\'Luk\',11,\'1-\');">Lu 11</a> the King James Version, the Revised Version (British and American) "narrative"; <a onClick="return mV(\'2Cr\',8,19);">2Co 8:19</a> the King James Version, the Revised Version (British and American) "to show") has the like meaning.``1';
isbe[2602]='Decline`de-klin\' (sur, natah): In the King James Version this word occurs 9 times in its original sense (now obsolete) of "turn aside." the Revised Version (British and American) substitutes "turn aside" in <a onClick="return mV(\'Exd\',23,2);">Ex 23:2</a>; <a onClick="return mV(\'Deu\',17,11);">De 17:11</a>; <a onClick="return mV(\'2Ch\',34,2);">2Ch 34:2</a>; <a onClick="return mV(\'Job\',23,11);">Job 23:11</a>. In <a onClick="return mV(\'Psa\',102,11);">Ps 102:11</a>; <a onClick="return mV(\'Psa\',109,23);">109:23</a>, the lengthening shadows of afternoon are said to "decline," and the Revised Version (British and American) introduces the word in the same general sense in <a onClick="return mV(\'Jdg\',19,8);">Jud 19:8</a>; <a onClick="return mV(\'2Ki\',20,10);">2Ki 20:10</a>; <a onClick="return mV(\'Jer\',6,4);">Jer 6:4</a>.` <a href="./study/isbe/search.html?string=AFTERNOON">AFTERNOON</a>`1';
isbe[2603]='Dedan; Dedanites`de\'-dan, de\'dan-its (the King James Version Dedanim, ded\'-a-nim; dedhan, "low," dedhanim): An Arabian people named in <a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a> as descended from Cush; in <a onClick="return mV(\'Gen\',25,3);">Ge 25:3</a> as descended from Keturah. Evidently, they were, like the related Sheba (Sabaeans), of mixed race (compare <a onClick="return mV(\'Gen\',10,7,28);">Ge 10:7, 28</a>). In <a onClick="return mV(\'Isa\',21,13);">Isa 21:13</a> allusion is made to the "caravans of Dedanites" in the wilds of Arabia, and Ezekiel mentions them as supplying Tyre with precious things (<a onClick="return mV(\'Eze\',27,20);">Eze 27:20</a>; in verse <a onClick="return mV(\'Eze\',27,15);">15</a>, "Dedan" should probably be read as in Septuagint, "Rodan," i.e. Rhodians). The name seems still to linger in the island of Dadan, on the border of the Persian Gulf. It is found also in Min. and Sab. inscriptions (Glazer, II, 392ff).``132';
isbe[2604]='Dedicate; Dedication`ded\'-i-kat, ded-ika\'-shun (chanukkah, "initiation," "consecration"; qadhesh, "to be clean," "sanctify"; cherem, "a thing devoted (to God)"): Often used in Hebrew of the consecration of persons, but usually in the English Versions of the Bible of the setting apart of things to a sacred use, as of the altar (<a onClick="return mV(\'Num\',7,10,74,88);">Nu 7:10f, 84,88</a>; compare <a onClick="return mV(\'Dan\',3,2,3);">Da 3:2-3</a>, "the dedication of the image"), of silver and gold (<a onClick="return mV(\'2Sa\',8,11);">2Sa 8:11</a>; <a onClick="return mV(\'2Ki\',12,4);">2Ki 12:4</a>), of the Temple (<a onClick="return mV(\'1Ki\',8,63);">1Ki 8:63</a>; <a onClick="return mV(\'Ezr\',6,16);">Ezr 6:16</a>f; compare <a onClick="return mV(\'Exd\',29,44);">Ex 29:44</a>), of the wall of Jerusalem (<a onClick="return mV(\'Neh\',12,27);">Ne 12:27</a>), of private dwellings (<a onClick="return mV(\'Deu\',20,5);">De 20:5</a>). the Revised Version (British and American) substitutes "devoted" for "dedicated" in <a onClick="return mV(\'Eze\',44,29);">Eze 44:29</a>.` <a href="./study/isbe/search.html?string=CONSECRATION">CONSECRATION</a>; <a href="./study/isbe/search.html?string=SANCTIFICATION">SANCTIFICATION</a>`1';
isbe[2605]='Dedication, Feast of`ded-i-ka\'-shun (ta egkainia, <a onClick="return mV(\'Jhn\',10,22);">Joh 10:22</a>): A feast held by the Jews throughout the country for eight days, commencing on the 25th Kiclev (December), in commemoration of the cleansing of the temple and dedication of the altar by Judas Maccabeus after their desecration by Antiochus Epiphanes (1Macc 4:56,59). The feast was to be kept "with mirth and gladness." 2Macc 10:6,7 says it was kept like the Feast of the Tabernacles, with the carrying of palm and other branches, and the singing of psalms. Josephus calls it "Lights," from the joy which accompanied it (Ant., XII, vii, 7). At this winter feast Jesus delivered in the temple the discourse recorded in <a onClick="return mV(\'Jhn\',10,24);">Joh 10:24</a>ff, at Jerusalem.``132';
isbe[2606]='Deed`ded: Used in its ordinary modern sense in EV. In the Old Testament it is used to translates five Hebrew words: gemylah, literally, "recompense" (<a onClick="return mV(\'Isa\',59,18);">Isa 59:18</a>); dabhar, literally, "word," "thing" (<a onClick="return mV(\'2Ch\',35,27);">2Ch 35:27</a> the King James Version, the Revised Version (British and American) "acts"; <a onClick="return mV(\'Est\',1,17,18);">Es 1:17-18</a>; <a onClick="return mV(\'Jer\',5,28);">Jer 5:28</a>); ma\'aseh (<a onClick="return mV(\'Gen\',20,9);">Ge 20:9</a>; <a onClick="return mV(\'Gen\',44,15);">44:15</a>; <a onClick="return mV(\'Ezr\',9,13);">Ezr 9:13</a>); \'alilah (<a onClick="return mV(\'1Ch\',16,8);">1Ch 16:8</a> the King James Version, the Revised Version (British and American) "doings"; <a onClick="return mV(\'Psa\',105,1);">Ps 105:1</a> the King James Version, the Revised Version (British and American) "doings"); po\'al (<a onClick="return mV(\'Psa\',28,4);">Ps 28:4</a> the King James Version, the Revised Version (British and American) "work"; <a onClick="return mV(\'Jer\',25,14);">Jer 25:14</a>).<P>In the New Testament "deed" very frequently translates ergon (same root as English "work"; compare "energy"), which is still more frequently (espescially in the Revised Version (British and American)) rendered "work." In <a onClick="return mV(\'Luk\',23,51);">Lu 23:51</a>; <a onClick="return mV(\'Act\',19,18);">Ac 19:18</a>; <a onClick="return mV(\'Rom\',8,13);">Ro 8:13</a>; <a onClick="return mV(\'Col\',3,9);">Col 3:9</a> the King James Version, the Revised Version (British and American) "doings," it stands for Greek praxis (literally, "a doing," "transaction"), each time in a bad sense, equivalent to wicked deed, crime, a meaning which is frequently associated with the plural of praxis (compare English "practices" in the sense of trickery; so often in Polybius; Deissmann maintains that praxis was a technical term in magic), although in <a onClick="return mV(\'Mat\',16,27);">Mt 16:27</a> (the King James Version "works") and <a onClick="return mV(\'Rom\',12,4);">Ro 12:4</a> the same Greek word has a neutral meaning. In <a onClick="return mV(\'Jam\',1,25);">Jas 1:25</a> the King James Version "deed" is the translation of Greek poiesis, more correctly rendered "doing" in the Revised Version (British and American).``49';
isbe[2607]='Deep`(tehom; abussos, <a onClick="return mV(\'Luk\',8,31);">Lu 8:31</a> the King James Version; <a onClick="return mV(\'Rom\',10,7);">Ro 10:7</a> the King James Version; bathos, <a onClick="return mV(\'Luk\',5,4);">Lu 5:4</a>; buthos, <a onClick="return mV(\'2Cr\',11,25);">2Co 11:25</a>):<P>The Hebrew word ("water in commotion") is used<P>(1) of the primeval watery waste (<a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>), where some suggest a connection with Babylonian Tiamat in the creation-epic;<P>(2) of the sea (<a onClick="return mV(\'Isa\',51,10);">Isa 51:10</a> and commonly);<P>(3) of the subterranean reservoir of water (<a onClick="return mV(\'Gen\',7,11);">Ge 7:11</a>; <a onClick="return mV(\'Gen\',8,2);">8:2</a>; <a onClick="return mV(\'Gen\',49,25);">49:25</a>; <a onClick="return mV(\'Deu\',33,13);">De 33:13</a>; <a onClick="return mV(\'Eze\',31,4);">Eze 31:4</a>, etc.). In the Revised Version (British and American) the Greek word first noted is rendered, literally, "abyss."` <a href="./study/isbe/search.html?string=ABYSS">ABYSS</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2608]='Deep Sleep`` <a href="./study/isbe/search.html?string=SLEEP,+DEEP">SLEEP, DEEP</a>`1';
isbe[2609]='Deer`der (\'ayyal, feminine \'ayyalah, and \'ayyeleth (compare Arabic, \'ayyal and \'iyal, "deer" and \'ayil, "ram," and Latin caper and capra, "goat," caprea, capreolus, "wild goat," "chamois," or "roe deer")); yachmur (compare Arabic, yachmur, "deer"); ya\'alah, feminine of ya\'el (compare Arabic, wa\'l, "Pers wild goat"); tsebhi, and feminine tsebhiyah (compare Arabic, zabi and feminine zabiyah, "gazelle"); \'opher (compare Arabic, ghafr and ghufr, "young of the mountain goat"):<P>Of the words in the preceding list, the writer believes that only the first two, i.e. \'ayyal (with its feminine forms) and yachmur should be translated "deer," \'ayyal for the roe deer and yachmur for the fallow deer. Further, he believes that ya\'el (including ya\'alah) should be translated "ibex," and tsebhi, "gazelle." \'Opher is the young of a roe deer or of a gazelle.<P>\'Ayyal and its feminine forms are regularly in English Versions of the Bible rendered "hart" and "hind," terms which are more commonly applied to the male and female of the red deer, Cervus elaphus, which inhabits Great Britain, the continent of Europe, the Caucasus and Asia Minor, but which has never been reported as far south as Syria or Palestine. The roe deer, Capreolus caprea, however, which inhabits the British Isles, the greater part of Europe, the Caucasus and Persia, is certainly found in Palestine. The museum of the Syrian Protestant College at Beirut possesses the skeleton of a roe deer which was shot in the mountains near Tyre. As late as 1890 it was fairly common in Southern Lebanon and Carmel, but has now (1912) become very scarce. The fallow deer, Cervus dama, is a native of Northern Africa and countries about the Mediterranean. It is found in central Europe and Great Britain, where it has been introduced from its more southern habitat. A variety of the fallow deer, sometimes counted as a separate species under the name of Cervus Mesopotamicus, inhabits northeastern Mesopotamia and Persia. It may in former times have been found in Palestine, and Tristram reports having seen the fallow deer in Galilee (Fauna and Flora of Pal), but while Tristram was a remarkably acute observer, he appears sometimes to have been too readily satisfied, and his observations, when unaccompanied, as in this case, by specimens, are to be accepted with caution. Now \'ayyal (and its feminine forms) occurs in the Bible 22 times, while yachmur occurs only twice, i.e. in the list of clean animals in <a onClick="return mV(\'Deu\',14,5);">De 14:5</a>, and in <a onClick="return mV(\'1Ki\',4,23);">1Ki 4:23</a>, in the list of animals provided for Solomon\'s table. In both places the King James Version has "fallow deer" and the Revised Version (British and American) "roebuck." In view of the fact that the roe deer has within recent years been common in Palestine, while the occurrence of the fallow deer must be considered doubtful, it seems fair to render \'ayyal "roe deer" or "roebuck," leaving yachmur for fallow deer.<P>The Arabs call the roe deer both \'ayyal and wa\'l. Wa\'l is the proper name of the Persian wild goat, Capra aegagrus, and is also often used for the Arabic or Sinaitic ibex, Capra beden, though only by those who do not live within its range. Where the ibex is at home it is always called beden. This looseness of nomenclature must be taken into account, and we have no reason to suppose that the Hebrews were more exact than are the Arabs. There are many examples of this in English, e. g. panther, coney, rabbit (in America), locust, adder and many others.<P>Ya\'el (including ya\'alah) occurs 4 times. In <a onClick="return mV(\'Job\',39,1);">Job 39:1</a>; <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>; <a onClick="return mV(\'1Sa\',24,2);">1Sa 24:2</a>, English Versions of the Bible render ya\'el by "wild goat." For ya\'alah in <a onClick="return mV(\'Pro\',5,19);">Pr 5:19</a>, the King James Version has "roe," while the Revised Version (British and American) has "doe," which is non-committal, since the name, "doe," may be applied to the female of a deer or of an ibex. Since the Arabic, wa\'l, which is etymologically closely akin to ya\'el, means the Persian wild goat, it might be supposed that that animal was meant, were it not that it inhabits the plains of the Syrian desert, and not the mountains of Southern Palestine, where the ibex lives. At least two of the passages clearly indicate the latter locality, i.e. <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>: "The high mountains are for the wild goats," and <a onClick="return mV(\'1Sa\',24,2);">1Sa 24:2</a>: "Saul...went to seek David and his men upon the rocks of the wild goats." The conclusion then seems irresistible that ya\'el, and consequently ya\'alah, is the ibex.<P>Tsebhi (including tsebhiyah) is uniformly rendered "roe" or "roebuck" in the King James Version, while the Revised Version (British and American), either in the text or in the margin, has in most cases "gazelle." In two places "roe" is retained in the Revised Version (British and American) without comment, i.e. <a onClick="return mV(\'2Sa\',2,18);">2Sa 2:18</a>: "Asahel was as light of foot as a wild roe," and <a onClick="return mV(\'1Ch\',12,8);">1Ch 12:8</a>: "were as swift as the roes upon the mountains." \'Ayyal and tsebhi occur together in <a onClick="return mV(\'Deu\',12,15,22);">De 12:15, 22</a>; <a onClick="return mV(\'Deu\',14,5);">14:5</a>; <a onClick="return mV(\'Deu\',15,22);">15:22</a>; <a onClick="return mV(\'1Ki\',4,23);">1Ki 4:23</a>; <a onClick="return mV(\'Sgs\',2,9,17);">So 2:9,17</a>, i.e. in 7 of the 16 passages in which we find tsebhi. If therefore it be accepted that \'ayyal is the roe deer, it follows that tsebhi must be something else. Now the gazelle is common in Palestine and satisfies perfectly every passage in which we find tsebhi. Further, one of the Arabic names of the gazelle is zabi, a word which is etymologically much nearer to tsebhi than appears in this transliteration.<P>\'Opher is akin to \'aphar, "dust," and has reference to the color of the young of the deer or gazelle, to both of which it is applied. In <a onClick="return mV(\'Sgs\',2,9,17);">So 2:9,17</a> and <a onClick="return mV(\'Sgs\',8,14);">8:14</a>, we have \'opher ha-\'ayyalim, English Versions of the Bible "young hart," literally, "fawn of the roe deer." In <a onClick="return mV(\'Sgs\',4,5);">So 4:5</a> and <a onClick="return mV(\'Sgs\',7,3);">7:3</a>, we have \'opharim te\'ome tsebhiyah, the King James Version "young roes that are twins," the Revised Version (British and American) "fawns that are twins of a roe," the Revised Version, margin "gazelle" (for "roe"). For further reference to these questions, see <a href="./study/isbe/search.html?string=ZOOLOGY">ZOOLOGY</A>.<P>With the exception of mere lists of animals, as in <a onClick="return mV(\'Deu\',14,\'1-\');">De 14</a> and <a onClick="return mV(\'1Ki\',4,\'1-\');">1Ki 4</a>, the treatment of these animals is highly poetical, and shows much appreciation of their grace and beauty.``37';
isbe[2610]='Defame; Defaming`de-fam\', de-fam\'-ing: These words occur but twice in the King James Version, and are translations of dibbah, "slander," from dabhath, "to slander," or spread an evil report, and blasphemeo, "to speak injuriously" of anyone (<a onClick="return mV(\'Jer\',20,10);">Jer 20:10</a>; <a onClick="return mV(\'1Cr\',4,13);">1Co 4:13</a>). "To defame" differs from "to revile" in that the former refers to public slander, the latter to personal abuse.``1';
isbe[2611]='Defect; Defective`de-fekt\', de-fekt\'-iv (hettema, "loss," "a defect"): Occurs in <a onClick="return mV(\'1Cr\',6,7);">1Co 6:7</a>: "Nay, already it is altogether a defect in you (the King James Version "there is utterly a fault among you"), that ye have lawsuits one with another." "Defect" means "want or absence of something necessary for completeness" (the Revised Version, margin "a loss to you"). The meaning of the passage in the Revised Version (British and American) is that when Christians have lawsuits one with another it produces a lack of something which brings them short of completeness, they suffer a spiritual loss or defeat, and perhaps defect is not quite strong enough fully to express that idea.<P>Defective: Sirach 49:4 the King James Version, the Revised Version (British and American) "committed trespass."``62';
isbe[2612]='Defence`de-fens\'.` <a href="./study/isbe/search.html?string=COURTS,+JUDICIAL">COURTS, JUDICIAL</a>`1';
isbe[2613]='Defenced`` <a href="./study/isbe/search.html?string=FORTIFICATION">FORTIFICATION</a>`1';
isbe[2614]='Defer`de-fur\' (\'achar (in Hiphil), \'arakh (in Hiphil), mashakh (in Niphal), "to postpone," more or less definitely; "delay": In Old Testament passages such as <a onClick="return mV(\'Isa\',48,9);">Isa 48:9</a>; <a onClick="return mV(\'Eze\',12,25,28);">Eze 12:25, 28</a>; <a onClick="return mV(\'Dan\',9,19);">Da 9:19</a>, the idea of indefinite postponement agrees with the Hebrew and with the context. In the only New Testament occurrence of the word anaballo, in the middle voice, (<a onClick="return mV(\'Act\',24,22);">Ac 24:22</a>) a definite postponement is implied.``1';
isbe[2615]='Defile; Defilement`de-fil\', de-fil\'-ment (Anglo-Saxon, afylau, etc.; Middle English, defoulen, "make foul," "pollute," render (the King James Version) 9 Hebrew roots (the Revised Version (British and American) six): ga\'al, "defile"; chalal, "defile" (from "untie, loosen, open," i.e. "make common," hence, "profane"); chaneph, "incline away" (from right or religion), hence, "profane," "defile" (<a onClick="return mV(\'Jer\',3,9);">Jer 3:9</a>, the American Standard Revised Version "pollute"); Tame\', the principal root, over 250 times translated "defile" 74 times "to become, or render, unclean"; Tanaph, "to soil" (<a onClick="return mV(\'Sgs\',5,3);">So 5:3</a>); \'alal, "deal severely, or decidedly, with," "roll" (<a onClick="return mV(\'Job\',16,15);">Job 16:15</a>, the King James Version, the American Revised Version, margin); \'anah, "humble" (<a onClick="return mV(\'Gen\',34,2);">Ge 34:2</a> the King James Version, the American Standard Revised Version "humble"); qadhash, "separate," "sanctify," "devote to religious use," hence, "forfeit" (<a onClick="return mV(\'Deu\',22,9);">De 22:9</a> the King James Version, the American Standard Revised Version "forfeit," margin "consecrated"). They also render 6 (the King James Version) Greek roots (American Revised Version, 4): koinos, etc., "common" or "unclean," because appertaining to the outside world and not to the people of God, opposite of katharos, "clean," used 13 times; miaino, miasma, miasmos, "stain," "tinge," "dye": "In their dreamings defile the flesh," <a onClick="return mV(\'Jud\',1,8);">Jude 1:8</a>; moluno, "stain," "contaminate": "not defile their garments" (<a onClick="return mV(\'Rev\',3,4);">Re 3:4</a>); spiloo, "spot," "stain": "defile the whole body" (<a onClick="return mV(\'Jam\',3,6);">Jas 3:6</a>); phtheiro, "corrupt," "destroy": the temple of God (<a onClick="return mV(\'1Cr\',3,17);">1Co 3:17</a> the King James Version, the American Standard Revised Version "destroyeth"); arsenokoites: "defile themselves with men" (<a onClick="return mV(\'1Ti\',1,10);">1Ti 1:10</a> the King James Version, the American Standard Revised Version "abusers of")):<P>1. Defilement in the Old Testament:<P>Defilement in the Old Testament was physical, sexual, ethical, ceremonial, religious, the last four, especially, overlapping.<P>(1) Physical: "I have washed my feet; how shall I defile them?" (<a onClick="return mV(\'Sgs\',5,3);">So 5:3</a>).<P>(2) Sexual: which might be ceremonial or moral; of individuals by illicit intercourse (<a onClick="return mV(\'Lev\',18,20);">Le 18:20</a>), or by intercourse at forbidden times (<a onClick="return mV(\'Lev\',15,24);">Le 15:24</a>; <a onClick="return mV(\'1Sa\',21,5);">1Sa 21:5</a>); of the land by adultery: "Shall not that land be greatly defiled?" (<a onClick="return mV(\'Jer\',3,1);">Jer 3:1</a> the American Standard Revised Version "polluted," usually substituted where the moral or religious predominates over the ceremonial).<P>(3) Ethical: "Your hands are defiled with blood" (<a onClick="return mV(\'Isa\',59,3);">Isa 59:3</a>); "Neither shall they defile themselves any more with...any of their transgressions" (<a onClick="return mV(\'Eze\',37,23);">Eze 37:23</a>).<P>(4) Ceremonial: to render ceremonially unclean, i.e. disqualified for religious service or worship, and capable of communicating the disqualification.<P>(a) Persons were defiled by contact with carcasses of unclean animals (<a onClick="return mV(\'Lev\',11,24);">Le 11:24</a>); or with any carcass (<a onClick="return mV(\'Lev\',17,15);">Le 17:15</a>); by eating a carcass (<a onClick="return mV(\'Lev\',22,8);">Le 22:8</a>); by contact with issues from the body, one\'s own or another\'s, e. g. abnormal issues from the genitals, male or female (<a onClick="return mV(\'Lev\',15,2,25);">Le 15:2, 25</a>); menstruation (<a onClick="return mV(\'Lev\',15,19);">Le 15:19</a>); by contact with anyone thus unclean (<a onClick="return mV(\'Lev\',15,24);">Le 15:24</a>); copulation (<a onClick="return mV(\'Lev\',15,\'16-18\');">Le 15:16-18</a>); uncleanness after childbirth (<a onClick="return mV(\'Lev\',12,\'2-5\');">Le 12:2-5</a>); by contact with unclean persons (<a onClick="return mV(\'Lev\',5,3);">Le 5:3</a>), or unclean things (<a onClick="return mV(\'Lev\',22,6);">Le 22:6</a>), or with leprosy (especially defiling; <a onClick="return mV(\'Lev\',13,14);">Le 13:14</a>), or with the dead (<a onClick="return mV(\'Num\',6,12);">Nu 6:12</a>), or with one unclean by such contact (<a onClick="return mV(\'Num\',19,22);">Nu 19:22</a>), or by funeral rites (<a onClick="return mV(\'Lev\',21,1);">Le 21:1</a>); by contact with creeping things (<a onClick="return mV(\'Lev\',22,5);">Le 22:5</a>), or with unclean animals (<a onClick="return mV(\'Lev\',11,26);">Le 11:26</a>).<P>(b) Holy objects were ceremonially defiled by the contact, entrance or approach of the defiled (<a onClick="return mV(\'Lev\',15,31);">Le 15:31</a>; <a onClick="return mV(\'Num\',19,13);">Nu 19:13</a>); by the presence of dead bodies, or any remains of the dead (<a onClick="return mV(\'Eze\',9,7);">Eze 9:7</a>; <a onClick="return mV(\'2Ki\',23,16);">2Ki 23:16</a>: Josiah\'s defilement of heathen altars by the ashes of the priests); by the entrance of foreigners (<a onClick="return mV(\'Psa\',79,1);">Ps 79:1</a>; see <a onClick="return mV(\'Act\',21,28);">Ac 21:28</a>); by forbidden treatment, as the altar by being tooled (<a onClick="return mV(\'Exd\',20,25);">Ex 20:25</a>); objects in general by contact with the unclean. Ceremonial defilement, strictly considered, implied, not sin, but ritual unfitness.<P>(5) Religious: not always easily distinguished or entirely distinguishable from the ceremonial, still less from the ethical, but in which the central attitude and relationship to Yahweh as covenant God and God of righteousness, was more fully in question. The land might be defiled by bloodshed (<a onClick="return mV(\'Num\',35,33);">Nu 35:33</a>), especially of the just or innocent; by adultery (<a onClick="return mV(\'Jer\',3,1);">Jer 3:1</a>); by idolatry and idolatrous practices, like sacrificing children to idols, etc. (<a onClick="return mV(\'Lev\',20,3);">Le 20:3</a>; <a onClick="return mV(\'Psa\',106,39);">Ps 106:39</a>); the temple or altar by disrespect (<a onClick="return mV(\'Mal\',1,7,12);">Mal 1:7, 12</a>); by offering the unclean (<a onClick="return mV(\'Hag\',2,14);">Hag 2:14</a>); by any sort of unrighteousness (<a onClick="return mV(\'Eze\',36,17);">Eze 36:17</a>); by the presence of idols or idolatrous paraphernalia (<a onClick="return mV(\'Jer\',7,30);">Jer 7:30</a>).<P>2. Defilement in New Testament:<P>The scope of defilement in its various degrees (direct, or primary, as from the person or thing defiled; indirect, or secondary, tertiary, or even further, by contact with the defiled) had been greatly widened by rabbinism into a complex and immensely burdensome system whose shadow falls over the whole New Testament life. Specific mentions are comparatively few. Physical defilement is not mentioned. Sexual defilement appears, in a figurative sense: "These are they that were not defiled with women" (<a onClick="return mV(\'Rev\',14,4);">Re 14:4</a>). Ceremonial defilement is found in, but not approved by, the New Testament. Examples are: by eating with unwashed, "common," not ceremonially cleansed, hands (<a onClick="return mV(\'Mar\',7,2);">Mr 7:2</a>); by eating unclean, "common," food (<a onClick="return mV(\'Act\',10,14);">Ac 10:14</a>; Peter\'s vision); by intimate association with Gentiles, such as eating with them (not expressly forbidden in Mosaic law; <a onClick="return mV(\'Act\',11,3);">Ac 11:3</a>), or entering into their houses (<a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>; the Pharisees refusing to enter the Pretorium); by the presence of Gentiles in the Temple (<a onClick="return mV(\'Act\',21,28);">Ac 21:28</a>).<P>But with Christ\'s decisive and revolutionary dictum (<a onClick="return mV(\'Mar\',7,19);">Mr 7:19</a>): "This he said, making all meats clean," etc., and with the command in Peter\'s vision: "What God hath cleansed, make not thou common" (<a onClick="return mV(\'Act\',10,15);">Ac 10:15</a>), and with Paul\'s bold and consistent teaching: "All things indeed are clean" (<a onClick="return mV(\'Rom\',14,20);">Ro 14:20</a>, etc.), the idea of ceremonial or ritual defilement, having accomplished its educative purpose, passed. Defilement in the New Testament teaching, therefore, is uniformly ethical or spiritual, the two constantly merging. The ethical is found more predominantly in: "The things which proceed out of the mouth come forth out of the heart; and they defile the man" (<a onClick="return mV(\'Mat\',15,18);">Mt 15:18</a>); "that did not defile their garments" (<a onClick="return mV(\'Rev\',3,4);">Re 3:4</a>); "defileth the whole body" (<a onClick="return mV(\'Jam\',3,6);">Jas 3:6</a>). The spiritual seems to predominate in: "defiled and unbelieving" (<a onClick="return mV(\'Tts\',1,15);">Tit 1:15</a>); "conscience being weak is defiled" (by concession to idolatry.) (<a onClick="return mV(\'1Cr\',8,7);">1Co 8:7</a>); "lest any root of bitterness springing up trouble you, and thereby the many be defiled" (<a onClick="return mV(\'Hbr\',12,15);">Heb 12:15</a>). For the supposed origins of the idea and details of defilement, as from hygienic or aesthetic causes, "natural aversions," "taboo," "totemism," associations with ideas of death, or evil life, religious symbolism, etc., see <a href="./study/isbe/search.html?string=POLLUTION">POLLUTION</a>; <a href="./study/isbe/search.html?string=PURIFICATION">PURIFICATION</a>; <a href="./study/isbe/search.html?string=UNCLEANNESS">UNCLEANNESS</a>. Whatever use God may have made of ideas and feelings common among many nations in some form, the Divine purpose was clearly to impress deeply and indelibly on the Israelites the ideas of holiness and sacredness in general, and of Yahweh\'s holiness, and their own required holiness and separateness in particular, thus preparing for the deep New Testament teachings of sin, and of spiritual consecration and sanctification.``31';
isbe[2616]='Defy`de-fi\' (charaph, za\'am): In <a onClick="return mV(\'1Sa\',17,10,25,26,36,45);">1Sa 17:10, 25-26, 36, 45</a> (the story of David and Goliath) and kindred passages, this word is used in its most familiar sense—"to taunt," "challenge to combat" (Hebrew charaph). In <a onClick="return mV(\'Num\',23,7,8);">Nu 23:7-8</a> "denounce" would be a better translation than "defy" (Hebrew za\'am).``1';
isbe[2617]='Degenerate`de-jen\'-er-at: Only in <a onClick="return mV(\'Jer\',2,21);">Jer 2:21</a>, where Judah is compared to a "noble vine" which it "turned into the degenerate branches of a foreign vine." It represents Hebrew curim = "stray" or "degenerate (shoots)," from cur = "to turn aside," especially to turn aside from the right path (Greek pikria, literally, "bitterness").``1';
isbe[2618]='Degree`de-gre\' (ma\'alah, "a going up" or "ascent," hence, a staircase or flight of steps; "rank": tapeinos, "low"): By derivation it should mean "a step down" (Latin, de, down, gradus, step). It is used, however, of any step, up or down; then of grade or rank, whether high or low.<P>(1) In its literal sense of step (as of a stair), it is used in the plural to translate Hebrew ma\'aloth ("steps"), in the parallel passages <a onClick="return mV(\'2Ki\',20,\'9-11\');">2Ki 20:9-11</a> the King James Version (5 t); <a onClick="return mV(\'Isa\',38,8);">Isa 38:8</a> the King James Version (3 t), where we read of the "degrees" (the Revised Version (British and American) "steps") on the "dial of Ahaz" (Hebrew "steps of Ahaz"). See <a href="./study/isbe/search.html?string=DIAL+OF+AHAZ">DIAL OF AHAZ</a>. It seems to mean steps or progressive movements of the body toward a certain place in the phrase "A Song of Degrees" (the Revised Version (British and American) "Ascents"), which forms the title of each of the <span class="noTag">Psalms 120-134</span>, probably because they were sung on the way up to the great feasts at Jerusalem. See <a href="./study/isbe/search.html?string=PSALMS">PSALMS</a><P>(2) The secondary (but now the more usual) sense of rank, order, grade is found in the following passages:<P>(a) <a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18</a>, "their brethren of the second (degree)," literally, "of the seconds" (Hebrew mishnim; compare <a onClick="return mV(\'2Ch\',28,7);">2Ch 28:7</a>, "Elkanah that was next to the king," Hebrew, "the king\'s second," i.e. in rank);<P>(b) <a onClick="return mV(\'1Ch\',17,17);">1Ch 17:17</a>, "a man of high degree" (Hebrew ma\'alah, "step");<P>(c) <a onClick="return mV(\'Psa\',62,9);">Ps 62:9</a>, "men of low degree...men of high degree," a paraphrase of Hebrew "sons of man...sons of man," the first "man" being Hebrew \'adham ("common humanity"; compare Greek anthropos, Latin homo, Welsh dyn), and the second Hebrew \'ish (man in a superior sense; compare Greek aner, Latin vir, Welsh gwr);<P>(d) "of low degree" for Greek tapeinos in Sirach 11:1; <a onClick="return mV(\'Luk\',1,52);">Lu 1:52</a>; <a onClick="return mV(\'Jam\',1,9);">Jas 1:9</a>; <P>(e) In <a onClick="return mV(\'1Ti\',3,13);">1Ti 3:13</a> the King James Version "a good degree" (Greek bathmos kalos, the Revised Version (British and American) "a good standing") is assured to those who have "served well as deacons." Some take this to mean promotion to a higher official position in the church; but it probably means simply a position of moral weight and influence in the church gained by faithfulness in service (so Hort).``49';
isbe[2619]='Degrees, Songs of`(shir ha-ma\'aloth; Septuagint ode ton anabathmon; Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) canticum graduum, the Revised Version (British and American) "a song of ascents"): The title prefixed to 15 psalms (<span class="noTag">Pss 120-134</span>) as to the significance of which there are four views:<P>(1) The Jewish interpretation. According to the Mishna, Middoth 2 5, Cukkah 51b, there was in the temple a semi-circular flight of stairs with 15 steps which led from the court of the men of Israel down to the court of the women. Upon these stairs the Levites played on musical instruments on the evening of the first day of Tabernacles. Later Jewish writers say that the 15 psalms derived their title from the 15 steps.<P>(2) Gesenius, Delitzsch and others affirm that these psalms derive their name from the step-like progressive rhythm of their thoughts. They are called Songs of Degrees because they move forward climactically by means of the resumption of the immediately preceding word. But this characteristic is not found in several of the group.<P>(3) Theodoret and other Fathers explain these 15 hymns as traveling songs of the returning exiles. In <a onClick="return mV(\'Ezr\',7,9);">Ezr 7:9</a> the return from exile is called "the going up (ha-ma\'alah) from Babylon." Several of the group suit this situation quite well, but others presuppose the temple and its stated services.<P>(4) The most probable view is that the hymns were sung by pilgrim bands on their way to the three great festivals of the Jewish year. The journey to Jerusalem was called a "going up," whether the worshipper came from north or south, east or west. All of the songs are suitable for use on such occasions. Hence, the title Pilgrim Psalms is preferred by many scholars.` <a href="./study/isbe/search.html?string=DIAL+OF+AHAZ">DIAL OF AHAZ</a>`156';
isbe[2620]='Dehaites`de-ha\'-tez (dehawe\'; the King James Version Dehavites): A people enumerated in <a onClick="return mV(\'Ezr\',4,9);">Ezr 4:9</a> with Elamites, ere, as among those settled by the Assyrian king Osnappar (Assurbanipal) in Samaria. The identification is uncertain.``1';
isbe[2621]='Dehort`de-hort\' (apostrepho; the Revised Version (British and American) <a href="./study/isbe/search.html?string=DISSUADE">DISSUADE</a>): Not found in the English Bible; once only in Apocrypha (1Macc 9:9). An obsolete English word; the opposite of "exhort." It means "to dissuade," "to forbid," "to restrain from."``1';
isbe[2622]='Dekar`de\'-kar (deqer, "lancer"): Father of one of Solomon\'s commissaries (<a onClick="return mV(\'1Ki\',4,9);">1Ki 4:9</a> the King James Version).` <a href="./study/isbe/search.html?string=BEN-DEKER">BEN-DEKER</a>`1';
isbe[2623]='Delaiah`de-la\'-ya (delayah, "God has raised"):<P>(1) A descendant of David (<a onClick="return mV(\'1Ch\',3,24);">1Ch 3:24</a>; the King James Version "Dalaiah").<P>(2) One of David\'s priests and leader of the 23rd course (<a onClick="return mV(\'1Ch\',24,18);">1Ch 24:18</a>).<P>(3) One of the princes who pleaded with Jehoiakim not to destroy the roll containing the prophecies of Jeremiah (<a onClick="return mV(\'Jer\',36,12,25);">Jer 36:12, 25</a>).<P>(4) The ancestor of a post-exilic family whose genealogy was lost (<a onClick="return mV(\'Ezr\',2,60);">Ezr 2:60</a>; <a onClick="return mV(\'Neh\',7,62);">Ne 7:62</a>; <span class="noTag">1Esdras 5:37</span> margin). See <a href="./study/isbe/search.html?string=DALAN">DALAN</a>.<P>(5) The father of timorous Shemaiah (<a onClick="return mV(\'Neh\',6,10);">Ne 6:10</a>).``1';
isbe[2624]='Delay`de-la\':The noun "delay" (<a onClick="return mV(\'Act\',25,17);">Ac 25:17</a>, "I made no delay"; the King James Version "without any delay") means "procrastination." The verb "to delay" (<a onClick="return mV(\'Exd\',22,29);">Ex 22:29</a>; \'achar) involves the idea "to stop for a time," the people being admonished not to discontinue a custom. The Pil. perfect of bush (<a onClick="return mV(\'Exd\',32,1);">Ex 32:1</a>), "Moses delayed to come," expresses not only the fact that he tarried, but also the disappointment on the part of the people, being under the impression that he possibly was put to shame and had failed in his mission, which also better explains the consequent action of the people. "To delay" (chronizo) is used transitively in <a onClick="return mV(\'Mat\',24,48);">Mt 24:48</a> (the Revised Version (British and American) "My lord tarrieth") and in <a onClick="return mV(\'Luk\',12,45);">Lu 12:45</a>. The meaning here is "to prolong," "to defer."``16';
isbe[2625]='Delectable`de-lek\'-ta-bl (chamadh, "to desire"): Found only in <a onClick="return mV(\'Isa\',44,9);">Isa 44:9</a>, King James Version: "Their delectable things shall not profit," the King James Version margin"desirable." the American Standard Revised Version translates: "the things that they delight in." The reference is to idols or images. Delitzsch renders the phrase: "Their darlings are good for nothing." The word may be traced back to the Latin delectabilis, "pleasant," or "delightful."``1';
isbe[2626]='Delicacy`del\'-i-ka-si (to strenos): Found only in <a onClick="return mV(\'Rev\',18,3);">Re 18:3</a>, King James Version: "The merchants of the earth are waxed rich through the abundance of her delicacies." the Revised Version (British and American) has very properly changed delicacies to "wantonness," and "luxury" in the margin, which is much nearer to the original.``1';
isbe[2627]='Delicate; Delicately`del\'-i-kat, del\'-i-kat-li (\'edhen, \'anogh; en truphe): "Delicate" usually an adjective, but once a substantive (<a onClick="return mV(\'Jer\',51,34);">Jer 51:34</a> the King James Version). "He hath filled his belly (the Revised Version (British and American) "maw") with my delicates." the Revised Version (British and American) retains the word, but the American Standard Revised Version very properly has replaced it with "delicacies." In Sirach 30:18, the Revised Version (British and American) agatha, "good things." The adjective seems to have two meanings, though not easily distinguished:<P>(1) tenderly reared, and<P>(2) wanton or voluptuous. In <a onClick="return mV(\'Deu\',28,54,56);">De 28:54, 56</a>; <a onClick="return mV(\'Isa\',47,1);">Isa 47:1</a>; <a onClick="return mV(\'Jer\',6,2);">Jer 6:2</a>, "luxurious" or "daintily bred" would certainly be nearer the original than "delicate." "Delicate children" of <a onClick="return mV(\'Mic\',1,16);">Mic 1:16</a>, the King James Version, is changed by the Revised Version (British and American) to "children of thy delight," i.e. beloved children, rather than children begotten in passion. The adverb "delicately" is employed in the same sense as the adjective (<a onClick="return mV(\'Lam\',4,5);">La 4:5</a>; <a onClick="return mV(\'Luk\',7,25);">Lu 7:25</a>). In the old English writers "delicate" is often used for voluptuous: "Dives for his delicate life to the devil went" (Piers Ploughman). The meaning of "delicately" (ma\'adhan) in <a onClick="return mV(\'1Sa\',15,32);">1Sa 15:32</a> (the King James Version) is a real puzzle. The King James Version reads, "And Agag came unto him delicately," with a possible suggestion of weakness or fear. the American Standard Revised Version and the Revised Version, margin substitute "cheerfully." Others, by metathesis or change of consonants in the Hebrew word, translation "in bonds" or "fetters."``34';
isbe[2628]='Deliciously`de-lish\'-us-li (streniao "to live hard or wantonly"): "She (Babylon)...lived deliciously" (<a onClick="return mV(\'Rev\',18,7,9);">Re 18:7, 9</a> the King James Version, the Revised Version (British and American) "wantonly," the Revised Version, margin "luxuriously").``1';
isbe[2629]='Delight`de-lit\' (verb, chaphets, ratsah, sha\'a\'; sunedomai): "To delight" is most frequently expressed by chaphets, which means originally "to bend" (compare <a onClick="return mV(\'Job\',40,17);">Job 40:17</a>, "He moveth his tail"), hence, "to incline to," "take pleasure in." It is used of God\'s pleasure in His people (<a onClick="return mV(\'Num\',14,8);">Nu 14:8</a>; <a onClick="return mV(\'2Sa\',22,20);">2Sa 22:20</a>; <a onClick="return mV(\'Psa\',18,19);">Ps 18:19</a>, etc.), and in righteousness, etc. (<a onClick="return mV(\'Isa\',66,4);">Isa 66:4</a>; <a onClick="return mV(\'Jer\',9,24);">Jer 9:24</a>; <a onClick="return mV(\'Mic\',7,18);">Mic 7:18</a>, etc.), also of man\'s delight in God and His will (<a onClick="return mV(\'Psa\',40,8);">Ps 40:8</a>; <a onClick="return mV(\'Psa\',73,25);">73:25</a>; the King James Version and the Revised Version (British and American), "There is none upon earth that I desire besides thee"), and in other objects (<a onClick="return mV(\'Gen\',34,19);">Ge 34:19</a>; <a onClick="return mV(\'1Sa\',18,22);">1Sa 18:22</a>; <a onClick="return mV(\'Est\',2,14);">Es 2:14</a>; <a onClick="return mV(\'Isa\',66,3);">Isa 66:3</a>); sha\'a\', "to stroke," "caress," "be fond of," occurs in <a onClick="return mV(\'Psa\',94,19);">Ps 94:19</a>, "Thy comforts delight my soul"; <a onClick="return mV(\'Psa\',119,16,47,70);">Ps 119:16, 47, 70</a>, "I will delight myself in thy statutes." Similarly, Paul says (<a onClick="return mV(\'Rom\',7,22);">Ro 7:22</a>), "I delight (sunedomai) in (margin, the Revised Version (British and American) "Greek with") the law of God after the inward man." This is the only occurrence of the word in the New Testament.<P>"To delight one\'s self" (in the Lord) is represented chiefly by \'anagh (<a onClick="return mV(\'Job\',22,26);">Job 22:26</a>; <a onClick="return mV(\'Job\',27,10);">27:10</a>; <a onClick="return mV(\'Psa\',37,4,11);">Ps 37:4, 11</a>; <a onClick="return mV(\'Isa\',58,14);">Isa 58:14</a>).<P>Delight (noun), chiefly chephets (<a onClick="return mV(\'1Sa\',15,22);">1Sa 15:22</a>; <a onClick="return mV(\'Psa\',1,2);">Ps 1:2</a>; <a onClick="return mV(\'Psa\',16,3);">16:3</a>), ratson (<a onClick="return mV(\'Pro\',11,1,20);">Pr 11:1, 20</a>; <a onClick="return mV(\'Pro\',12,22);">12:22</a>; <a onClick="return mV(\'Pro\',15,8);">15:8</a>), sha\'ashu\'im (<a onClick="return mV(\'Psa\',119,24,77,92,143,174);">Ps 119:24, 77, 92, 143, 174</a>; <a onClick="return mV(\'Pro\',8,30,31);">Pr 8:30-31</a>). the Revised Version (British and American) has "delight" for "desire" (<a onClick="return mV(\'Neh\',1,11);">Ne 1:11</a>; <a onClick="return mV(\'Psa\',22,8);">Ps 22:8</a>; <a onClick="return mV(\'Psa\',51,16);">51:16</a>), for "observe," different reading (<a onClick="return mV(\'Pro\',23,26);">Pr 23:26</a>), "no delight in" for "smell in" (<a onClick="return mV(\'Amo\',5,21);">Am 5:21</a>), "delightest in me" for "favorest me" (<a onClick="return mV(\'Psa\',41,11);">Ps 41:11</a>), "his delight shall be in" (m "Hebrew \'scent\' ") for "of quick understanding" (<a onClick="return mV(\'Isa\',11,3);">Isa 11:3</a>).<P>The element of joy, of delight in God and His law and will, in the Hebrew religion is noteworthy as being something which we are apt to fall beneath even in the clearer light of Christianity.``185';
isbe[2630]='Delightsome`de-lit\'-sum: chephets, is rendered "delightsome": <a onClick="return mV(\'Mal\',3,12);">Mal 3:12</a>, "Ye shall be a delightsome land," literally, "a land of delight."``1';
isbe[2631]='Delilah`de-li\'-la (delilah, "dainty one," perhaps; Septuagint Daleida, Dalida): The woman who betrayed Samson to the Philistines (<a onClick="return mV(\'Jdg\',16,\'1-\');">Jud 16</a>). She was presumably a Philistine, though that is not expressly stated. She is not spoken of as Samson\'s wife, though many have understood the account in that way. The Philistines paid her a tremendously high price for her services. The account indicates that for beauty, personal charm, mental ability, self-command, nerve, she was quite a wonderful woman, a woman to be admired for some qualities which she exhibits, even while she is to be utterly disapproved.` <a href="./study/isbe/search.html?string=SAMSON">SAMSON</a>`11';
isbe[2632]='Deliver`de-liv\'-er (natsal, nathan; rhuomai, paradidomi): Occurs very frequently in the Old Testament and represents various Hebrew terms.<P>The English word is used in two senses,<P class="in15">(1) "to set free," etc.,<P class="in15">(2) "to give up or over."<P>(1) The word most often translated "deliver" in the first sense is natsal, meaning originally, perhaps, "to draw out." It is used of all kinds of deliverance (<a onClick="return mV(\'Gen\',32,11);">Ge 32:11</a>; <a onClick="return mV(\'Psa\',25,20);">Ps 25:20</a>; <a onClick="return mV(\'Psa\',143,9);">143:9</a>, etc.; <a onClick="return mV(\'Jer\',7,10);">Jer 7:10</a>; <a onClick="return mV(\'Eze\',3,19);">Eze 3:19</a>, etc.; <a onClick="return mV(\'Zep\',1,18);">Ze 1:18</a>, etc.). The Aramaic netsal occurs in <a onClick="return mV(\'Dan\',3,29);">Da 3:29</a>; <a onClick="return mV(\'Dan\',6,14);">6:14</a>; <a onClick="return mV(\'Dan\',8,4,7);">8:4, 7</a>; yasha\', "to save," in <a onClick="return mV(\'Jdg\',3,9,31);">Jud 3:9, 31</a> the King James Version, etc.; malaT, "to let or cause to escape," in <a onClick="return mV(\'Isa\',46,2);">Isa 46:2</a>, "recover," etc. In the New Testament rhuomai, "to rescue," is most frequently translated "deliver" in this sense (<a onClick="return mV(\'Mat\',6,13);">Mt 6:13</a> the King James Version, "Deliver us from evil"); katargeo, "to make useless" or "without effect" (<a onClick="return mV(\'Rom\',7,6);">Ro 7:6</a> the Revised Version (British and American), "discharged"). In the New Testament "save" takes largely the place of "deliver" in the Old Testament, and the idea is raised to the spiritual and eternal.<P>(2) For "deliver" in the sense of "give over, up," etc., the most frequent word is nathan, the common word for "to give" (<a onClick="return mV(\'Gen\',32,16);">Ge 32:16</a>; <a onClick="return mV(\'Gen\',40,13);">40:13</a> the King James Version; <a onClick="return mV(\'Exd\',5,18);">Ex 5:18</a>). Other words are maghan (<a onClick="return mV(\'Hsa\',11,8);">Ho 11:8</a>, the King James Version and the English Revised Version "How shall I deliver thee Israel?" i. e. "How shall I give thee up?" as in the first clause of the verse, with a different word (nathan), the American Standard Revised Version "How shall I cast thee off?"), yehabh, Aramaic (<a onClick="return mV(\'Ezr\',5,14);">Ezr 5:14</a>). In the New Testament paradidomi, "to give over to," is most frequent (<a onClick="return mV(\'Mat\',5,25);">Mt 5:25</a>; <a onClick="return mV(\'Mat\',11,27);">11:27</a>, "All things have been delivered (given or made over) unto me of my Father"; <a onClick="return mV(\'Mar\',7,13);">Mr 7:13</a>; <a onClick="return mV(\'Luk\',1,2);">Lu 1:2</a>; <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>, etc.); charizomai, "to grant as a favor" (<a onClick="return mV(\'Act\',25,11,17);">Ac 25:11, 16</a> the King James Version).<P>(3) Yaladh, "to bring forth," is also rendered "deliver" in the sense of childbirth (<a onClick="return mV(\'Gen\',25,24);">Ge 25:24</a>; <a onClick="return mV(\'Exd\',1,19);">Ex 1:19</a>, etc.). In the New Testament this sense is borne by tikto (<a onClick="return mV(\'Luk\',1,57);">Lu 1:57</a>; <a onClick="return mV(\'Luk\',2,6);">2:6</a>; <a onClick="return mV(\'Rev\',12,2,4);">Re 12:2, 4</a>), and gennao (<a onClick="return mV(\'Jhn\',16,21);">Joh 16:21</a>).<P>In the Revised Version (British and American) there are many changes, such as, for "deliver," "restore" (<a onClick="return mV(\'Gen\',37,22);">Ge 37:22</a>; <a onClick="return mV(\'Gen\',40,13);">40:13</a>; <a onClick="return mV(\'Exd\',22,26);">Ex 22:26</a>; <a onClick="return mV(\'Deu\',24,13);">De 24:13</a>); for "delivered," "defended" (<a onClick="return mV(\'1Ch\',11,14);">1Ch 11:14</a>); for "cannot deliver thee," "neither...turn thee aside" (<a onClick="return mV(\'Job\',36,18);">Job 36:18</a>); for "betray," "betrayed" we have "deliver," "delivered up," etc. (<a onClick="return mV(\'Mat\',10,4);">Mt 10:4</a> margin; <a onClick="return mV(\'Mar\',13,12);">Mr 13:12</a>; <a onClick="return mV(\'Mar\',14,10);">14:10</a>f; <a onClick="return mV(\'Luk\',21,16);">Lu 21:16</a>); for "delivered into chains," "committed to pits" (<a onClick="return mV(\'2Pe\',2,4);">2Pe 2:4</a>, margin "some ancient authorities read chains"; compare The <span class="noTag">Wisdom of Solomon 17:17</span>); "Deliver us from evil," omitted in <a onClick="return mV(\'Luk\',11,4);">Lu 11:4</a>, margin "Many ancient authorities add but deliver us from the evil one (or, from evil)."``185';
isbe[2633]='Delos`de\'-los (Delos): An island, now deserted, one of the Cyclades in the Aegean Sea, about 3 miles long and 1 mile broad, with a rocky mountain (Cynthus) several hundred feet high in the center. In antiquity Delos enjoyed great prosperity. According to Greek legend the island once floated on the surface of the water, until Poseidon fastened it on four diamond pillars for the wandering Leto, who, like Io, was pursued by the vengeful Hera. It was here that Apollo and Artemis were born; hence, the island was sacred, and became one of the chief seats of worship of the two deities. Numerous temples embellished Delos. The most magnificent was that of Apollo, which contained a colossal statue of the god, a dedicatory offering of the Naxians. This temple was a sanctuary visited by all the Greeks, who came from far and near to worship at the deity\'s shrine. There was a Dorian peripteral temple in Delos from the beginning of the 4th century BC. To the north was a remarkable altar composed entirely of ox-horns. The various Ionian cities sent sacred embassies (theoriai) with rich offerings. There was also a celebrated oracle in Delos which was accounted one of the most trustworthy in the world. Every five years the famous Delian festival was celebrated with prophecies, athletic contests and games of every kind. All the nations of Greece participated.<P>The earliest inhabitants of Delos were Carians; but about 1000 BC the island was occupied by Ionians. For a long time it enjoyed independence. In 478 Delos was chosen as the place for the convention of the representatives of the Greek states for deliberation about means for defense against Persia. The treasury of the Athenian Confederacy was kept here after 476. The island became independent of Athens in 454. During the 2nd and 1st centuries BC it became one of the chief ports of the Aegean. This was partly due to its location, and partly to the fact that the Romans, after 190 BC, favored the island as a rival to the sea-power of Rhodes. In 166 Delos was given to Athens; the inhabitants fled to Achea, and the island was colonized by Athenians, together with Romans.<P>The ruins of the city of Delos, which became a flourishing commercial port, are to the north of the temple. It became the center of trade between Alexandria and the Black Sea, and was for a long time one of the chief slave markets of the Greek world. But Delos received a severe blow, from which it never recovered, in the war between Rome and Mithridates. The latter\'s general landed in 88 BC and massacred many, and sold the remainder of the defenseless people, and sacked and destroyed the city together with the temple and its countless treasures. At the conclusion of peace (84) Delos came into the possession of the Romans, who later gave it back to Athens. Under the Empire the island lost its importance entirely.<P>Delos was one of the states to which Rome addressed letters in behalf of the Jews (138-137 BC; see 1Macc 15:16-23). Among those who came to Delos from the East must have been many of this nation. Josephus cites in full a decree passed in Delos which confirmed the Jewish exemption from military service (Ant., XIV, x, 4).<P>The excavations of the French have laid bare 8 temples within the sacred enclosure (Apollo, Artemis, Dionysus). Numerous statues, dating from the earliest times of Greek art down to the latest, have been discovered; also 2,000 inscriptions, among which was an inventory of the temple treasure.<P>By the side of Delos, across a very narrow strait, lies Rheneia, another island which was the burying-ground of Delos; for on the sacred isle neither births, deaths nor burials were permitted. In 426 BC Delos was "purified" by the Athenians—by the removal of the bodies that had been interred there previously.<P>LITERATURE.<P>Lebegue, Recherches sur Delos (Paris, 1876); V. v. Schoffer, De Deli Insulae rebus, Berliner Studien fur klass. Phil. (Berlin, 1889); Homolle, S. Reinach and others, in the Bulletin de corresp. Hellen. (VI, 1-167; VII, 103-25, 329-73; VIII, 75-158; XIV, 389-511; XV, 113-68); Homolle, Archives de l\'intendance sacree a Delos; Jebb, Journal of Hellenic Studies (1880), 7-62.``71';
isbe[2634]='Deluge of Noah`del\'-uj<P>1. The Biblical Account<P>2. "Noah\'s Log Book"<P>3. The Egyptian Tradition<P>4. The Indian Tradition<P>5. The Chinese Tradition<P>6. The Greek Tradition<P>7. The British Tradition<P>8. The American Indian Traditions<P>9. The Babylonian Tradition<P>10. Cuneiform Tablets<P>11. Was the Flood Universal?<hr /><P>1. The Biblical Account:<P>The means described in <a onClick="return mV(\'Gen\',6,\'1-\');">Ge 6-8</a> by which the Lord destroyed, on account of their wickedness, all the members of the human race except Noah and his family. According to the account, Noah was warned of the event 120 years before (<a onClick="return mV(\'Gen\',6,3);">Ge 6:3</a>; <a onClick="return mV(\'1Pe\',3,20);">1Pe 3:20</a>; <a onClick="return mV(\'2Pe\',2,5);">2Pe 2:5</a>). During all this time he is said to have been a "preacher of righteousness" "while the ark was a preparing," when we may well suppose (according to theory to be presently propounded) the physical events leading up to the final catastrophe may have given point to his preaching. When the catastrophe came, the physical means employed were twofold, namely, the breaking up of the "fountains of the great deep" and the opening of "the windows of heaven" (<a onClick="return mV(\'Gen\',7,11);">Ge 7:11</a>). But the rain is spoken of as continuing as a main cause only 40 days, while the waters continued to prevail for 150 days (<a onClick="return mV(\'Gen\',7,24);">Ge 7:24</a>), when (<a onClick="return mV(\'Gen\',8,2,3);">Ge 8:2-3</a>) "the fountains also of the deep and the windows of heaven were stopped, and the rain from heaven was restrained; and the waters returned from off the earth continually," so that after 10 months the ark rested upon "the mountains of Ararat" (not the peak of Mount Ararat, but the highlands of Armenia in the upper part of the valley of the Euphrates and Tigris; see <a href="./study/isbe/search.html?string=ARARAT">ARARAT</a>). Here it rested 40 days before the water subsided sufficiently to suggest disembarking, when a raven (which could easily find its food on the carcasses of the animals which had been destroyed) was sent forth, and did not return (<a onClick="return mV(\'Gen\',8,7);">Ge 8:7</a>); but a dove sent out at the same time found no rest and returned empty to the ark (<a onClick="return mV(\'Gen\',8,9);">Ge 8:9</a>). After 7 days, however, it was sent out again and returned with a fresh olive leaf (<a onClick="return mV(\'Gen\',8,11);">Ge 8:11</a>). After 7 days more the dove was sent forth again and did not return. After 56 days more of waiting Noah and his family departed from the ark.<P>2. "Noah\'s Log Book":<P>The following are the leading points in the story which has been appropriately styled by Sir William Dawson "Noah\'s log book" (see Southeast Bishop\'s article in Biblical Sac. (1906), 510-17, and Joseph B. Davidson in the author\'s Scientific Confirmations of Old Testament History, 180-184).<P>It will thus be seen that there is no need of supposing any duplication and overlapping of accounts in the Biblical story. There is continual progress in the account from beginning to end, with only such repetitions for literary effect as we are familiar with in oriental writings. In <a onClick="return mV(\'Gen\',6,5);">Ge 6:5-7:13</a> the wickedness of the world is assigned as the reason which prevailed in the Divine counsels for bringing about the contemplated catastrophe. While emphasizing the righteousness of Noah which led to his preservation, <a onClick="return mV(\'Gen\',6,\'13-21\');">Ge 6:13-21</a> contains the direction for the making of the ark and of the preparations to bring into it a certain number of animals. This preparation having been made, the order was given (<a onClick="return mV(\'Gen\',7,\'1-4\');">Ge 7:1-4</a>) for the embarkation which (<a onClick="return mV(\'Gen\',7,5);">Ge 7:5</a>) was duly accomplished. We are then told that Noah and his family, and beasts both clean and unclean, were shut up in the ark during the prevalence of the water and its final subsidence. Altogether the account is most graphic and impressive (see W. H. Green, Unity of the Book of Genesis, 83ff).<P>Compared with other traditions of the Deluge, the Biblical account appears in a most favorable light, while the general prevalence of such traditions strongly confirms the reality of the Biblical story.<P>3. The Egyptian Tradition:<P>An Egyptian legend of the Deluge is referred to in Plato\'s Timaeus, where the gods are said to have purified the earth by a great flood of water from which only a few shepherds escaped by climbing to the summit of a high mountain. In the Egyptian documents themselves, however, we find only that Ra\' the creator, on account of the insolence of man, proceeded to exterminate him by a deluge of blood which flowed up to Heliopolis, the home of the gods; but the heinousness of the deed so affected him that he repented and swore never more to destroy mankind.<P>4. The Indian Tradition:<P>In Indian mythology there is no reference to the Flood in the Rig Veda, but in the laws of Manu we are told that a fish said to Manu, "A deluge will sweep all creatures away ..... Build a vessel and worship me. When the waters rise enter the vessel and I will save thee ..... When the Deluge came, he had entered the vessel....Manu fastened the cable of the ship to the horn of the fish, by which means the latter made it pass over the mountains of the North. The fish said: \'I have saved thee; fasten the vessel to a tree that the water may not sweep it away while thou art in the mountain; and in proportion as the waters decrease, thou shalt descend.\' Manu descended with the waters, and this is what is called the Descent of Manu on the mountains of the North. The Deluge had carried away all creatures, and Manu remained alone" (translated by Max Muller).<P>5. The Chinese Tradition:<P>The Chinese tradition is embodied in sublime language in their book of Li-Ki: "And now the pillars of heaven were broken, the earth shook to its very foundation; the sun and the stars changed their motions; the earth fell to pieces, and the waters enclosed within its bosom burst forth with violence, and overflowed. Man having rebelled against heaven, the system of the universe was totally disordered, and the grand harmony of nature destroyed. All these evils arose from man\'s despising the supreme power of the universe. He fixed his looks upon terrestrial objects and loved them to excess, until gradually he became transformed into the objects which he loved, and celestial reason entirely abandoned him."<P>6. The Greek Tradition:<P>The Greeks, according to Plutarch, had five different traditions of the Deluge, that of Deucalion being the most important. According to this, Prometheus warned his son Deucalion of the flood which Zeus had resolved to bring upon the earth by reason of its wickedness. Accordingly, Deucalion constructed an ark and took refuge in it, but with his vessel was stranded on Mount Parnassus in Thessaly, whereupon they disembarked and repopulated the earth by the fantastic process revealed to them by the goddess Themis of throwing stones about them, those which Deucalion threw becoming men and those which Pyrrha threw becoming women. Lucian\'s form of the legend, however, is less fantastic and more nearly in line with Semitic tradition. In the Greek legend as in the Semitic, a dove is sent forth which returns both a first and a second time, its feet being tinged with mud the second time, intimating the abatement of the flood. But neither Homer nor Hesiod have this tradition. Probably it was borrowed from the Semites or the Hindus.<P>7. The British Tradition:<P>In Britain there is a Druid legend that on account of the profligacy of mankind, the Supreme Being sent a flood upon the earth when "the waves of the sea lifted themselves on high round the border of Britain. The rain poured down from heaven and the waters covered the earth." But the patriarch, distinguished for his integrity, had been shut up with a select company in a strong ship which bore them safely upon the summit of the waters (Editor Davies in his Mythology and Rites of British Druids). From these the world was again repopulated. There are various forms of this legend but they all agree in substance.<P>8. The American Indian Traditions:<P>Among the American Indians traditions of the Deluge were found by travelers to be widely disseminated. Mr. Catlin says, "Among the 120 different tribes which I visited in North, South, and Central America, not a tribe exists that has not related to me distinct or vague traditions of such a calamity, in which one, or three, or eight persons were saved above the waters upon the top of a high mountain" (quoted by Wm. Restelle in Biblical Sac. (January, 1907), 157). While many, perhaps most, of these traditions bear the stamp of Christian influence through the early missionaries, the Mexican legend bears evident marks of originality. According to it the 4th age was one of water, when all men were turned into fishes except Tezpi and his wife Hochiquetzal and their children, who with many animals took refuge in a ship which sailed safely over the tumultuous waters which overwhelmed the earth. When the flood subsided the ship stranded on Mount Cohuacan, whereupon he sent forth a vulture which did not return, and then a humming bird which returned with some leaves in its beak. The Peruvian story differs from this in many particulars. According to it a single man and woman took refuge in a box and floated hundreds of miles from Cuzco to an unknown land where they made clay images of all races, and animated them.<P>The Moravian missionary Cranz, in his History of Greenland, says that "the first missionaries among the Greenlanders found a tolerably distinct tradition of the Deluge" to the effect that "the earth was once tilted over and all men were drowned" except one "who smote afterward upon the ground with a stick and thence came out a woman with whom he peopled the earth again." Moreover, the Greenlanders point to the remains of fishes and bones of a whale on high mountains where men never could have dwelt, as proof that the earth was once flooded. Among the North American Indians generally legends of the Deluge are so embellished that they become extremely fantastic, but in many of them there are peculiarities which point unquestionably to a common origin of extreme antiquity.<P>The unprejudiced reader cannot rise from the study of the subject without agreeing in general with Francois Lenormant, who writes: "As the case now stands, we do not hesitate to declare that, far from being a myth, the Biblical Deluge is a real and historical fact, having, to say the least, left its impress on the ancestors of three races—Aryan, or Indo-European, Semitic, or Syrio-Arabian, Chamitic, or Kushite—that is to say on the three great civilized races of the ancient world, those which constitute the higher humanity—before the ancestors of these races had as yet separated, and in the part of Asia together inhabited" (Contemporary Review, November, 1879).<P>9. The Babylonian Tradition:<P>The most instructive of these traditions are those which have come down to us from Babylonia, which until recently were known to us only through the Greek historian Berosus of the 4th century BC, who narrates that a great deluge happened at some indefinite time in the past during the reign of Xisuthrus, son of Ardates. Xisuthrus was warned beforehand by the deity Cronos, and told to build a ship and take with him his friends and relations and all the different animals with all necessary food and trust himself fearlessly to the deep, whereupon he built "a vessel 5 stadia (3,000 ft.) long and 2 stadia (1,200 ft.) broad." After the flood subsided Xisuthrus, like Noah, sent out birds which returned to him again. After waiting some days and sending them out a second time, they returned with their feet tinged with mud. Upon the third trial they returned no more, whereupon they disembarked and Xisuthrus with his wife, daughter and pilot offered sacrifice to the gods and were translated to live with the gods. It was found that the place where they were was "the land of Armenia," but they were told to return to Babylon. Berosus concluded his account by saying that "the vessel being thus stranded in Armenia, some part of it yet remains in the Corcyrean mountains."<P>10. Cuneiform Tablets:<P>An earlier and far more important tradition was found inscribed on cuneiform tablets in Babylonia dating from 3000 BC. These were discovered by George Smith in 1870 and filled as many as 180 lines. The human hero of the account, corresponding to Noah of the Bible and Xisuthrus of Berosus, is Gilgamesh, who lived is Shurippak, a city full of violence, on the banks of the Euphrates. He was warned of an approaching flood and exhorted to pull down his house and build a ship and cause "seed of life of every sort to go up into it." The ship, he says, was to be "exact in its dimensions, equal in its breadth and its length....Its sides were 140 cubits high, the border of its top equaled 140 cubits....I constructed it in 6 stories, dividing it into 7 compartments. Its floors I divided into 9 chambers....I chose a mast (or rudder pole), and supplied what was necessary. Six sars of bitumen I poured over the outside; three sars of bitumen over the inside." After embarking, the storm broke with fearful violence and the steering of the ship was handed over to Bezur-Bel, the ship man. But amidst the roll of thunder and the march of mountain waves the helm was wrenched from the pilot\'s hands and the pouring rain and the lightning flashes dismayed all hearts. "Like a battle charge upon mankind" the water rushed so that the gods even were dismayed at the flood and cowered like dogs, taking refuge in the heaven of Anu while Ishtar screamed like a woman in travail, and repenting of her anger, resolved to save a few and "to give birth to my people" till like "the fry of fishes they fill the sea." The ship was therefore turned to the country of Nizir (Armenia).<P>It is worthy of notice that the cuneiform tablet exhibits as much variety of style as does the Biblical account. Plain narrative and rhetorical prose are intermingled in both accounts, a fact which effectually disposes of the critical theory which regards the Biblical account as a clumsy combination made in later times by piecing together two or more independent traditions. Evidently the piecing together, if there was any, had been accomplished early in Babylonian history. See <a href="./study/isbe/search.html?string=BABYLONIA+AND+ASSYRIA">BABYLONIA AND ASSYRIA</a>.<P>On comparing the Biblical account with that of the cuneiform tablets, the following similarities and contrasts are brought to light:<P>(1) That the cuneiform inscription is from start to finish polytheistic (II. 3-17), whereas the narrative in Genesis is monotheistic.<P>(2) The cuneiform agrees with the Biblical narrative in making the Deluge a Divine punishment for the wickedness of the world (II. 5, 6).<P>(3) The names differ to a degree that is irreconcilable with our present knowledge.<P>(4) The dimensions of the ark as given in Genesis (<a onClick="return mV(\'Gen\',6,15);">6:15</a>) are reasonable, while those of Berosus and the cuneiform tablets are unreasonable. According to Genesis, the ark was 300 cubits (562 1/2 ft.) long, 50 cubits (93 2/3 ft.) wide, and 30 cubits (56 1/4 ft.) deep, which are the natural proportions for a ship of that size, being in fact very close to those of the great steamers which are now constructed to cross the Atlantic. The "Celtic" of the White Star line, built in 1901, is 700 ft. long, 75 ft. wide and 49 1/3 ft. deep. The dimensions of the "Great Eastern," built in 1858 (692 ft. long, 83 ft. broad, and 58 ft. deep), are still closer to those of the ark. The cuneiform tablets represent the length, width and depth each as 140 cubits (262 ft.) (II. 22,23,38-41), the dimensions of an entirely unseaworthy structure. According to Berosus, it was 5 stadia (3,000 ft.) and 2 stadia (1,200 ft.) broad; while Origen (Against Celsus, 4,41), represented it to be 135,000 ft. (25 miles) long, and 3,750 ft. (3/4 mile) wide.<P>(5) In the Biblical account, nothing is introduced conflicting with the sublime conception of holiness and the peculiar combination of justice and mercy ascribed to God throughout the Bible, and illustrated in the general scheme of providential government manifest in the order of Nature and in history; while, in the cuneiform tablets, the Deluge is occasioned by a quarrel among the gods, and the few survivors escape, not by reason of a merciful plan, but by a mistake which aroused the anger of Bel (II. 146-50).<P>(6) In all the accounts, the ark is represented as floating up stream. According to Genesis, it was not, as is usually translated, on "Mount Ararat" (<a onClick="return mV(\'Gen\',8,4);">8:4</a>), but in the "mountains of Ararat," designating an indefinite region in Armenia upon which the ark rested; according to the inscriptions, it was in Nizir (II. 115-20), a region which is watered by the Zab and the Tornadus; while, according to Berosus, it was on the Corcyrean Mountains, included in the same indefinite area. In all three cases, its resting-place is in the direction of the headwaters of the Euphrates valley, while the scene of the building is clearly laid in the lower part of the valley.<P>(7) Again, in the Biblical narrative, the spread of the water floating the ark is represented to have been occasioned, not so much by the rain which fell, as by the breaking-up of "all the fountains of the great deep" (<a onClick="return mV(\'Gen\',7,11);">Ge 7:11</a>), which very naturally describes phenomena connected with one of the extensive downward movements of the earth\'s crust with which geology has made us familiar. The sinking of the land below the level of the ocean is equivalent, in its effects, to the rising of the water above it, and is accurately expressed by the phrases used in the sacred narrative. This appears, not only in the language concerning the breaking-up of the great deep which describes the coming-on of the Flood, but also in the description of its termination, in which it is said, that the "fountains also of the deep...were stopped,...and the waters returned from off the earth continually" (<a onClick="return mV(\'Gen\',8,2,3);">Ge 8:2-3</a>). Nothing is said of this in the other accounts.<P>(8) The cuneiform tablets agree in general with the two other accounts respecting the collecting of the animals for preservation, but differ from Genesis in not mentioning the sevens of clean animals and in including others beside the family of the builder (II. 66-69).<P>(9) The cuneiform inscription is peculiar in providing the structure with a mast, and putting it in charge of a pilot (II. 45,70,71).<P>(10) The accounts differ decidedly in the duration of the Flood. According to the ordinary interpretation of the Biblical account, the Deluge continued a year and 17 days; whereas, according to the cuneiform tablets, it lasted only 14 days (II. 103-7, 117-22).<P>(11) All accounts agree in sending out birds; but, according to Genesis (<a onClick="return mV(\'Gen\',8,8);">8:8</a>) a raven was first sent out, and then in succession two doves (<a onClick="return mV(\'Gen\',8,\'8-12\');">8:8-12</a>); while the cuneiform inscription mentions the dove and the raven in reverse order from Genesis, and adds a swallow (II. 121-30).<P>(12) All accounts agree in the building of an altar and offering a sacrifice after leaving the ark. But the cuneiform inscription is overlaid with a polytheistic coloring: "The gods like flies swarmed about the sacrifices" (II. 132-43).<P>(13) According to the Biblical account, Noah survived the Flood for a long time; whereas Nuhnapishtim and his wife were at once deified and taken to heaven (II. 177-80).<P>(14) Both accounts agree in saying that the human race is not again to be destroyed by a flood (<a onClick="return mV(\'Gen\',9,11);">Ge 9:11</a>; II. 162-6).<P>Close inspection of these peculiarities makes it evident that the narrative in Genesis carries upon its face an appearance of reality not found in the other accounts. It is scarcely possible that the reasonable dimensions of the ark, its floating up stream, and the references to the breaking-up of the fountains of the great deep should have been hit upon by accident. It is in the highest degree improbable that correct statements of such unobvious facts should be due to the accident of legendary guesswork. At the same time, the duration of the Deluge, according to Genesis, affords opportunity for a gradual progress of events which best accords with scientific conceptions of geological movements. If, as the most probable interpretation would imply, the water began to recede after 150 days from the beginning of the Flood and fell 15 cubits in 74 days, that would only be 3 2/3 inches per day—a rate which would be imperceptible to an ordinary observer. Nor is it necessary to suppose that the entire flooded area was uncovered when Noah disembarked. The emergence of the land may have continued for an indefinite period, permitting the prevailing water to modify the climate of all western and central Asia for many centuries. Evidence that this was the case will be found in a later paragraph.<P>11. Was the Flood Universal?:<P>In considering the credibility of the Biblical story we encounter at the outset the question whether the narrative compels us to believe the Flood to have been universal. In answer, it is sufficient to suggest that since the purpose of the judgment was the destruction of the human race, all the universality which it is necessary to infer from the language would be only such as was sufficient to accomplish that object. If man was at that time limited to the Euphrates valley, the submergence of that area would meet all the necessary conditions. Such a limitation is more easily accepted from the fact that general phrases like "Everybody knows," "The whole country was aroused," are never in literature literally interpreted. When it is said (<a onClick="return mV(\'Gen\',41,\'54-57\');">Ge 41:54-57</a>) that the famine was "in all lands," and over "all the face of the earth," and that "all countries came into Egypt...to buy grain," no one supposes that it is intended to imply that the irrigated plains of Babylonia, from which the patriarchs had emigrated, were suffering from drought like Palestine (For other examples of the familiar use of this hyperbole, see <a onClick="return mV(\'Deu\',2,25);">De 2:25</a>; <a onClick="return mV(\'Job\',37,3);">Job 37:3</a>; <a onClick="return mV(\'Act\',2,25);">Ac 2:25</a>; <a onClick="return mV(\'Rom\',1,8);">Ro 1:8</a>.)<P>As to the extent to which the human race was spread over the earth at the time of the Flood, two suppositions are possible. First, that of Hugh Miller (Testimony of the Rocks) that, owing to the shortness of the antediluvian chronology, and the violence and moral corruption of the people, population had not spread beyond the boundary of western Asia. An insuperable objection to this theory is that the later discoveries have brought to light remains of prehistoric man from all over the Northern hemisphere, showing that long before the time of the Flood he had become widely scattered.<P>Another theory, supported by much evidence, is that, in connection with the enormous physical changes in the earth\'s surface during the closing scenes of the Glacial epoch, man had perished from off the face of the earth except in the valley of the Euphrates, and that the Noachian Deluge is the final catastrophe in that series of destructive events (see <a href="./study/isbe/search.html?string=ANTEDILUVIANS">ANTEDILUVIANS</a>). The facts concerning the Glacial epoch naturally lead up to this conclusion. For during the entire epoch, and especially at its close, the conditions affecting the level of the land surfaces of the Northern hemisphere were extremely abnormal, and continued so until some time after man had appeared on the earth.<P>The Glacial epoch followed upon, and probably was a consequence of, an extensive elevation of all the land surfaces of the Northern hemisphere at the close of the Tertiary period. This elevation was certainly as much as 2,000 ft. over the northern part of the United States, and over Canada and Northern Europe. Snow accumulated over this high land until the ice formed by it was certainly a mile thick, and some of the best authorities say 2, or even 3 miles. The surface over which this was spread amounted to 2,000,000 square miles in Europe and 4,000,000 in North America. The total amount of the accumulation would therefore be 6,000,000 cubic miles at the lowest calculation, or twice or three times that amount if the largest estimates are accepted. (For detailed evidence see Wright, Ice Age in North America, 5th edition) But in either case the transference of so much weight from the ocean beds to the land surfaces of the Northern hemisphere brings into the problem a physical force sufficient to produce incalculable effects. The weight of 6,000,000 cubic miles of ice would be twenty-four thousand million million (24,000,000,000,000,000) tons, which is equal to that of the entire North American continent above sea level. Furthermore this weight was first removed from the ocean beds, thus disturbing still more the balance of forces which secure the stability of the land. The geological evidence is abundant that in connection with the overloading of the land surfaces in the Northern Hemisphere, and probably by reason of it, the glaciated area and a considerable margin outside of it sank down until it was depressed far below the present level. The post-Glacial depression in North America was certainly 600 ft. below sea level at Montreal, and sev
