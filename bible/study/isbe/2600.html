eral hundred feet lower further north. In Sweden the post-Glacial sea beaches show a depression of the land 1,000 ft. below the sea.<P>The evidences of a long-continued post-Glacial subsidence of the Aral-Caspian basin and much of the surrounding area is equally conclusive. At Trebizond, on the Black Sea, there is an extensive recent sea beach clinging to the precipitous volcanic mountain back of the city 750 ft. above the present water level. The gravel in this beach is so fresh as to compel a belief in its recent origin, while it certainly has been deposited by a body of water standing at that elevation after the rock erosion of the region had been almost entirely effected. The deposit is about 100 ft. thick, and extends along the precipitous face of the mountain for a half-mile or more. So extensive is it that it furnishes an attractive building place for a monastery. When the water was high enough to build up this shore line, it would cover all the plains of Southern Russia, of Western Siberia and of the Aral-Caspian depression in Turkestan. Similar terraces of corresponding height are reported by competent authorities on the south shore of the Crimea and at Baku, on the Caspian Sea.<P>Further and most interesting evidence of this post-Glacial land depression is found in the existence of Arctic seal 2,000 miles from the Arctic Ocean in bodies of water as widely separated as the Caspian Sea, the Aral Sea and Lake Baikal. Lake Baikal is now 1,500 ft. above sea level. It is evident, therefore, that there must have been a recent depression of the whole area to admit the migration of this species to that distant locality. There are also clear indications of a smaller depression around the eastern shores of the Mediterranean Sea, where there are abandoned sea beaches from 200 to 300 ft. above tide, which abound in species of shells identical with those now living nearby.<P>These are found in Egypt, in the valley of the Red Sea, and in the vicinity of Joppa and Beirut. During their formation Asia and Africa must have been separated by a wide stretch of water connecting the Mediterranean with the Red Sea. The effect of such lingering wide expanses of water upon the climate of Western Asia must have been profound, and would naturally provide those conditions which would favor the early development of the human race in Armenia (where even now at an elevation of 5,000 ft. the vine is indigenous), from which the second distribution of mankind is said to have taken place.<P>Furthermore there is indubitable evidence that the rainfall in central Asia was, at a comparatively recent time, immensely greater than it has been in the historic period, indicating that gradual passage from the conditions connected with the Deluge to those of the present time, at which we have hinted above. At the present time the evaporation over the Aral Sea is so great that two rivers (the ancient Oxus and the Jaxartes), coming down from the heights of central Asia, each with a volume as great as that of Niagara, do not suffice to cause an overflow into the Caspian Sea. But the existence of such an overflow during the prehistoric period is so plain that it has been proposed to utilize its channel (which is a mile wide and as distinctly marked as that of any living stream) for a canal.<P>Owing to the comparatively brief duration of the Noachian Deluge proper, we cannot expect to find many positive indications of its occurrence. Nevertheless, Professor Prestwich (than whom there has been no higher geological authority in England during the last century) adduces an array of facts relating to Western Europe and the Mediterranean basin which cannot be ignored (see Phil. Trans. of the Royal Soc. of London, CXXIV (1893), 903-84; Wright, Scientific Confirmation of the Old Testament History, 238-82). Among these evidences one of the most convincing is to be found in the cave of San Ciro at the base of the mountains surrounding the plain of Palermo in Sicily. In this cave there was found an immense mass of the bones of hippopotami of all ages down to the fetus, mingled with a few of the deer, ox and elephant. These were so fresh when discovered that they were cut into ornaments and polished and still retained a considerable amount of their nitrogenous matter. Twenty tons of these bones were shipped for commercial purposes in the first six months after their discovery. Evidently the animals furnishing these bones had taken refuge in this cave to escape the rising water which had driven them in from the surrounding plains and cooped them up in the amphitheater of mountains during a gradual depression of the land. Similar collections of bones are found in various ossiferous fissures, in England and Western Europe, notably in the Rock of Gibraltar and at Santenay, a few miles south of Chalons in central France, where there is an accumulation of bones in fissures 1,000 ft. above the sea, similar in many respects to that in the cave described at San Ciro, though the bones of hippopotami did not appear in these places; but the bones of wolves, bears, horses and oxen, none of which had been gnawed by carnivora, were indiscriminately commingled as though swept in by all-pervading currents of water. Still further evidence is adduced in the deposits connected with what is called the rubble drift on both sides of the English Channel and on the Jersey Islands. Here in various localities, notably at Brighton, England, and near Calais, France, elephant bones and human implements occur beneath deep deposits of unassorted drift, which is not glacial nor the product of limited and local streams of water, but can be accounted for only by general waves of translation produced when the land was being reelevated from beneath the water by a series of such sudden earthquake shocks as cause the tidal waves which are often so destructive.<P>Thus, while we cannot appeal to geology for direct proof of the Noachian Deluge, recent geological discoveries do show that such a catastrophe is perfectly credible from a scientific point of view; and the supposition that there was a universal destruction of the human race, in the Northern hemisphere at least, in connection with the floods accompanying the melting off of the glacial ice is supported by a great amount of evidence. There was certainly an extensive destruction of animal species associated with man during that period. In Europe the great Irish elk, the machairodus, the cave lion, the rhinoceros, the hippopotamus and the elephant disappeared with prehistoric man, amid the floods at the close of the Glacial epoch. In North America equally large felines, together with horses, tapirs, llamas, great mastodons and elephants and the huge megalonyx went to destruction in connection with the same floods that destroyed so large a part of the human race during the dramatic closing scenes of the period. It is, therefore, by no means difficult for an all-round geologist to believe in a final catastrophe such as is described in Genesis. If we disbelieve in the Biblical Deluge it is not because we know too much geology, but too little.``198';
isbe[2635]='Delusion`de-lu\'-zhun:<P>(1) <a onClick="return mV(\'Isa\',66,4);">Isa 66:4</a>, "I also will choose their delusions" (the Revised Version, margin "mockings"), Hebrew ta\'alulim, which occurs only here and <a onClick="return mV(\'Isa\',3,4);">Isa 3:4</a> (where it is translated "babes," the Revised Version, margin "childishness"). Its meaning is somewhat ambiguous. The best translation seems to be "wantonness," "caprice." "Their wanton dealing, i .e. that inflicted on them" (BDB). Other translations suggested are "insults" (Skinner), "freaks of fortune" (Cheyne), "follies" (Whitehouse). Septuagint has empaigmata, "mockings," Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) illusiones.<P>(2) <a onClick="return mV(\'2Th\',2,11);">2Th 2:11</a> the King James Version, "God shall send them strong delusion" (the Revised Version (British and American) "God sendeth them a working of error"), plane, "a wandering," "a roaming about," in the New Testament "error" either of opinion or of conduct.``49';
isbe[2636]='Demand`de-mand\':The peremptory, imperative sense is absent from this word in its occurrences in the King James Version, where it means no more than "ask," "inquire" (compare French, demander) one or the other of which the Revised Version (British and American) substitutes in <a onClick="return mV(\'2Sa\',11,7);">2Sa 11:7</a>; <a onClick="return mV(\'Mat\',2,4);">Mt 2:4</a>; <a onClick="return mV(\'Luk\',3,14);">Lu 3:14</a>; <a onClick="return mV(\'Luk\',17,20);">17:20</a>; <a onClick="return mV(\'Act\',21,33);">Ac 21:33</a>. the Revised Version (British and American) retains "demand" in <a onClick="return mV(\'Exd\',5,14);">Ex 5:14</a>; <a onClick="return mV(\'Job\',38,3);">Job 38:3</a>; <a onClick="return mV(\'Job\',40,7);">40:7</a>; <a onClick="return mV(\'Job\',42,4);">42:4</a>; <a onClick="return mV(\'Dan\',2,27);">Da 2:27</a>; and inserts it (the King James Version "require") in <a onClick="return mV(\'Neh\',5,18);">Ne 5:18</a>.``1';
isbe[2637]='Demas`de\'-mas (Demas, "popular"): According to <a onClick="return mV(\'Col\',4,14);">Col 4:14</a>; <a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>; <a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a>, one who was for a time a "fellow-worker" with Paul at Rome (Col, Philem), but at last, "having loved this present world," forsook the apostle and betook himself to Thessalonica (2 Tim). No other particulars are given concerning him.` <a href="./study/isbe/search.html?string=APOSTASY">APOSTASY</a>; <a href="./study/isbe/search.html?string=DEMETRIUS">DEMETRIUS</a>`1';
isbe[2638]='Demetrius (1)`de-me\'-tri-us (Demetrios, "of" or "belonging to Demeter," an ordinary name in Greece):<P>(1) Demetrius I, surnamed Soter ("saviour"), was the son of Seleucus IV (Philopator). He was sent as a boy to Rome, by his father, to serve as a hostage, and remained there quietly during his father\'s life. He was detained also during the reign of his uncle, <a href="./study/isbe/search.html?string=ANTIOCHUS+EPIPHANES">ANTIOCHUS EPIPHANES</a> (which see) from 175 to 164 BC; but when Antiochus died Demetrius, who was now a young man of 23 (Polyb. xxxi.12), chafed at a longer detention, particularly as his cousin, Antiochus Eupator, a boy of 9, succeeded to the kingdom with Lysias as his guardian. The Roman Senate, however, refused to listen to his plea for the restoration to Syria, because, as Polybius says, they felt surer of their power over Syria with a mere boy as king.<P>In the meantime, a quarrel had arisen between Ptolemy Philometor and Euergetes Physkon (Livy Epit. 46; Diod. Sic. fr xi), and Gnaeus Octavius, who had been sent to quell the disorder, was assassinated in Syria, while plundering the country. Demetrius, taking advantage of the troubled condition of affairs, consulted with his friend Polybius as to the advisability of attempting to seize the throne of Syria (op. cit. xxxi. 19). The historian advised him not to stumble twice on the same stone, but to venture something worthy of a king, so after a second unsuccessful appeal to the Senate, Demetrius escaped to Tripolis, and from there advanced to Antioch where he was proclaimed king (162 BC). His first act was to put to death young Antiochus, his cousin, and his minister Lysias (Appian, Syriac., c. 47; Ant, XII, x, 1; 1Macc 7:1-4; 2Macc 14:1,2).<P>As soon as he was established in power, Demetrius made an attempt to placate the Romans by sending them valuable gifts as well as the assassin of Gn. Octavius (Polyb. xxi.23); and he then tried to secure the Hellenizing party by sending his friend <a href="./study/isbe/search.html?string=BACCHIDES">BACCHIDES</a> (which see) to make the wicked Alcimus high priest. After a violent struggle and much treachery on the part of Bacchides (Ant., XII, x, 2), the latter left the country, having charged all the people to obey Alcimus, who was protected by an army.<P>The Jews under Judas resented his presence, and Judas inflicted severe punishment on all who had gone over to Alcimus (1Macc 7:24). Alcimus, in fear, sent a message for aid to Demetrius, who sent to his assistance Nicanor, the best disposed and most faithful of his friends, who had accompanied him in his flight from Rome (Ant., XII, x, 4). On his arrival in Judea, he attempted to win by guile, but Judas saw through his treachery, and Nicanor was forced to fight openly, suffering two signal defeats, the first at Capharsalama (1Macc 7:31,32), and the second (in which Nicanor himself was killed), at Adasa (1Macc 7:39ff; 2Macc 15:26ff).<P>In a short while, however, Demetrius, hearing of the death of Nicanor, sent Bacchides and Alcimus into Judea again (1Macc 9:1). Judas arose against them with an army of 3,000 men, but when these saw that 20,000 opposed them, the greater part of them deserted, and Judas, with an army of 800, lost his life, like another Leonidas, on the field of battle (1Macc 9:4,6,18). Then Bacchides took the wicked men and made them lords of the country (1Macc 9:25); while Jonathan, who was appointed successor to Judas, fled with his friends (1Macc 9:29ff).<P>During the next seven years, Demetrius succeeded in alienating both the Romans (Polyb. xxxii.20) and his own people, and <a href="./study/isbe/search.html?string=ALEXANDER+BALAS">ALEXANDER BALAS</a> (which see) was put forward as a claimant to the throne, his supporters maintaining that he was the son of Antiochus Epiphanes (1Macc 10:1-21; Ant, XIII, ii, 1-3). Both Alexander and Demetrius made bids for the support of the Jews, the former offering the high-priesthood and the title of King\'s Friend (1Macc 10:20), and the latter freedom from taxes, tributes and customs (1Macc 10:28ff). Alexander\'s bait proved more alluring, since the Jews "gave no credence" to the words of Demetrius, and with the aid of the Maccabees, he vied with Demetrius for the space of two years for the complete sovereignty of Syria. At the end of this time, a decisive battle took place, in which Demetrius was slain, and Alexander became king of Syria (150 BC) (1Macc 10:48-50; Ant, XIII, ii, 4; Polyb. iii.5; see also <a href="./study/isbe/search.html?string=MACCABEES">MACCABEES</a>).<P>(2) Demetrius II, surnamed Nikator ("conqueror"), was the son of Demetrius Soter. When Balas was warring with Demetrius I, he sent his son to a place of safety in Crete. Three years after his father\'s death (147 BC), the unpopularity of Alexander gave the young man an opportunity to return and seize the government. He landed in Cilicia with Cretan mercenaries and secured the support of all Syria with the exception of Judea (1Macc 10:67ff). Apollonius, his general, the governor of Coele-Syria, who essayed the conquest of the Jews, was defeated at Azotus with great loss.<P>Ptolemy Philometor, whose daughter was the wife of Alexander Balas, now entered into the struggle, and taking Cleopatra, his daughter, from Alexander, he gave her to Demetrius (1Macc 11:12). He then joined Demetrius\' army and the combined forces inflicted a defeat on Balas (145 BC), and from this Demetrius received his surname Nikator (Ant., XIII, iv, 8; 1Macc 11:14ff).<P>Jonathan now concluded a favorable treaty with Demetrius, whereby three Samaritan provinces were added to Judea and the whole country was made exempt from tax (1Macc 11:20-37; Ant, XIII, iv, 9). Demetrius then dismissed his army except the foreigners, thinking himself safe with the loyalty of the Jews assured. In the meantime, Tryphon, one of Balas\' generals, set up the son of Alexander, Antiochus, as a claimant to the throne, and secured the assistance of the discarded army of Demetrius. Jonathan\'s aid was sought and he quelled the rebellion, on condition that the Syrian garrison be removed from Jerusalem (1Macc 11:41-52; Ant, XIII, v, 2-3).<P>The king, however, falsified all that he had said, and kept none of his promises, so the Jews, deserting him, took sides with Tryphon and supported the claims of the boy Antiochus (1Macc 11:53-59; Ant, XIII, v, 5-11). Demetrius\' generals then entered Syria but were defeated by Jonathan at Hazor (1Macc 11:63-74), and by skillful generalship he made futile a second attempt at invasion (1Macc 12:24ff).<P>Tryphon, who was now master of Syria, broke faith with Jonathan (1Macc 12:40) and essayed the conquest of Judea. Jonathan was killed by treachery, and Simon, his successor, made proposals of peace to Demetrius, who agreed to let bygones be bygones (1Macc 13:36-40; Ant, XIII, vi, 7). Demetrius then left Simon to carry on the war, and set out to Parthia, ostensibly to secure the assistance of the king, Mithridates, against Tryphon (1Macc 14:1). Here he was captured and imprisoned (14:3; Ant, XIII, v, 11; Josephus, however, puts this event in 140 rather than 138 BC).<P>After an imprisonment of ten years, he was released and resumed the sovereignty 128 BC, but becoming involved in a quarrel with Ptolemy Physkon, he was defeated in battle at Damascus. From this place, he fled to Tyre, where he was murdered in 125 BC, according to some, at the instigation of Cleopatra, his wife (Josephus, Ant, XIII, ix, 3).<P>(3) Demetrius III, Eukairos ("the fortunate"), was the son of Antiochus Grypus, and grandson of Demetrius Nikator. When his father died, civil war arose, in which his two elder brothers lost their lives, while Philip, the third brother, secured part of Syria as his domain. Demetrius then took up his abode in Coele-Syria with Damascus as his capital (Ant., XIII, xiii, 4; BJ, I, iv, 4).<P>War now broke out in Judea between Alexander Janneus and his Pharisee subjects, who invited Demetrius to aid them. Thinking this a good opportunity to extend his realm, he joined the insurgent Jews and together they defeated Janneus near Shechem (Ant., XIII, xiv, 1; BJ,1,iv, 5).<P>The Jews then deserted Demetrius, and he withdrew to Berea, which was in the possession of his brother Philip. Demetrius besieged him, and Philip summoned the Parthians to his assistance. The tables were turned, and Demetrius, besieged in his camp and starved into submission, was taken prisoner and sent to Arsaces, who held him captive until his death (Ant., XIII, xiv, 3). The dates of his reign are not certain.``89';
isbe[2639]='Demetrius (2)`de-me\'-tri-us (Demetrios, "belonging to Ceres"): The name of two persons:<P>(1) A Christian disciple praised by John (<a onClick="return mV(\'3Jo\',1,12);">3Joh 1:12</a>).<P>(2) A silversmith of Ephesus who manufactured the little silver shrines of the goddess Diana to sell to the visiting pilgrims (<a onClick="return mV(\'Act\',19,23);">Ac 19:23</a>ff). Because the teachings of Paul were injuring the trade of the silversmiths, there arose a riot of which Demetrius was the chief. Upon an inscription which Mr. Wood discovered among the ruins of the city, there appeared the name Demetrius, a warden of the Ephesian temple for the year 57 AD, and some authors believe the temple warden to be identical with the ringleader of the rebellion. The name, however, has been most common among the Greeks of every age. Because of its frequent use it cannot be supposed that Demetrius, the disciple of <a onClick="return mV(\'3Jo\',1,12);">3Joh 1:12</a>, was the silversmith of Ephesus, nor that Demas of <a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>, who bore the name in a contracted form, may be identified with him.``7';
isbe[2640]='Demon; Demoniac; Demonology`dem\'-mon, de-mo\'-ni-ak, de-mon-ol\'-o-ji (daimonion, earlier form daimon = pneuma akatharton, poneron, "demon," "unclean or evil spirit," incorrectly rendered "devil" in the King James Version):<P>I. Definition.<P>The word daimon or daimonion seems originally to have had two closely related meanings; a deity, and a spirit, superhuman but not supernatural. In the former sense the term occurs in the Septuagint translation of <a onClick="return mV(\'Deu\',32,17);">De 32:17</a>; <a onClick="return mV(\'Psa\',106,37);">Ps 106:37</a>; <a onClick="return mV(\'Act\',17,18);">Ac 17:18</a>. The second of these meanings, which involves a general reference to vaguely conceived personal beings akin to men and yet belonging to the unseen realm, leads to the application of the term to the peculiar and restricted class of beings designated "demons" in the New Testament.<P>II. The Origin of Biblical Demonology.<P>An interesting scheme of development has been suggested (by Baudissin and others) in which Biblical demonism is brought through polytheism into connection with primitive animism.<P>1. The Evolutionary Theory:<P>A simple criticism of this theory, which is now the ascendant, will serve fittingly to introduce what should be said specifically concerning Biblical demonology.<P>(1) Animism, which is one branch of that general primitive view of things which is designated as spiritism, is theory that all Nature is alive (see Ladd, Phil. Rel., I, 89f) and that all natural processes are due to the operation of living wills.<P>(2) Polytheism is supposed to be the outcome of animism. The vaguely conceived spirits of the earlier conception are advanced to the position of deities with names, fixed characters and specific functions, organized into a pantheon.<P>(3) Biblical demonology is supposed to be due to the solvent of monotheism upon contemporary polytheism. The Hebrews were brought into contact with surrounding nations, especially during the Persian, Babylonian and Greek periods, and monotheism made room for heathenism by reducing its deities to the dimension of demons. They are not denied all objective reality, but are denied the dignity and prerogatives of deity.<P>2. Objections to the Theory:<P>The objections to this ingenious theory are too many and too serious to be overcome.<P>(1) The genetic connection between animism and polytheism is not clear. In fact, the specific religious character of animism is altogether problematical. It belongs to the category of primitive philosophy rather than of religion. It is difficult to trace the process by which spirits unnamed and with characteristics of the vaguest become deities—especially is it difficult to understand how certain spirits only are advanced to the standing of deities. More serious still, polytheism and animism have coexisted without close combination or real assimilation (see Sayce, Babylonia and Assyria, 232; Rogers, Religion of Babylonia and Assyria, 75f) for a long course of history. It looks as if animism and polytheism had a different raison d\'etre, origin and development. It is, at least, unsafe to construct a theory on the basis of so insecure a connection.<P>(2) The interpretation of heathen deities as demons by no means indicates that polytheism is the source of Biblical demonology. On general principles, it seems far more likely that the category of demons was already familiar, and that connection with polytheism brought about an extension of its application. A glance at the Old Testament will show how comparatively slight and unimportant has been the bearing of heathen polytheism upon Biblical thought. The demonology of the Old Testament is confined to the following passages: <a onClick="return mV(\'Lev\',16,21,22);">Le 16:21-22</a>; <a onClick="return mV(\'Lev\',17,7);">17:7</a>; <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,13);">34:13</a>; <a onClick="return mV(\'Deu\',32,17);">De 32:17</a>; <a onClick="return mV(\'Psa\',106,37);">Ps 106:37</a> (elsewhere commented upon; see <a href="./study/isbe/search.html?string=COMMUNION+WITH+DEMONS">COMMUNION WITH DEMONS</a>). Gesenius well says of <a onClick="return mV(\'Lev\',16,21);">Le 16:21</a> that it is "vexed with the numerous conjectures of interpreters." If the prevalent modern view is accepted we find in it an actual meeting-point of popular superstition and the religion of Yahweh (see <a href="./study/isbe/search.html?string=AZAZEL">AZAZEL</a>). According to Driver (HDB, I, 207), this item in the Levitical ritual "was intended as a symbolical declaration that the land and the people are now purged from guilt, their sins being handed over to the evil spirit to whom they are held to belong, and whose home is in the desolate wilderness remote from human habitations (verse <a onClick="return mV(\'Lev\',16,22);">22</a>, into a land cut off)." A more striking instance could scarcely be sought of the way in which the religion of Yahweh kept the popular spiritism at a safe distance. <a onClick="return mV(\'Lev\',17,7);">Le 17:7</a> (see <a href="./study/isbe/search.html?string=COMMUNION+WITH+DEMONS">COMMUNION WITH DEMONS</a>) refers to participation in the rites of heathen worship. The two passages— <a onClick="return mV(\'Isa\',13,20,21);">Isa 13:20-21</a>; <a onClick="return mV(\'Isa\',34,13,14);">34:13-14</a>—are poetical and really imply nothing as to the writer\'s own belief. Creatures both seen and unseen supposed to inhabit places deserted of man are used, as any poet might use them, to furnish the details for a vivid word-picture of uninhabited solitude. There is no direct evidence that the narrative of the Fall (<a onClick="return mV(\'Gen\',3,\'1-19\');">Ge 3:1-19</a>) has any connection with demonology (see HDB, I, 590 note), and the suggestion of Whitehouse that the mention of satyrs and night-monsters of current mythology with such creatures as jackals, etc., implies "that demons were held to reside more or less in all these animal denizens of the ruined solitude" is clearly fanciful. It is almost startling to find that all that can possibly be affirmed of demonology in the Old Testament is confined to a small group of passages which are either legal or poetical and which all furnish examples of the inhibiting power of high religious conceptions upon the minds of a naturally superstitious and imaginative people. Even if we add all the passages in which a real existence seems to be granted to heathen deities (e. g. <a onClick="return mV(\'Num\',21,29);">Nu 21:29</a>; <a onClick="return mV(\'Isa\',19,1);">Isa 19:1</a>, etc.) and interpret them in the extreme sense, we are still compelled to affirm that evidence is lacking to prove the influence of polytheism in the formation of the Biblical doctrine of demons.<P>(3) This theory breaks down in another still more vital particular. The demonology of the Bible is not of kin either with primitive animism or popular Sere demonism. In what follows we shall address ourselves to New Testament demonology—that of the Old Testament being a negligible quantity.<P>III. New Testament Demonology.<P>The most marked and significant fact of New Testament demonology is that it provides no materials for a discussion of the nature and characteristics of demons. Whitehouse says (HDB, I, 593) that New Testament demonology "is in all its broad characteristics the demonology of the contemporary Judaism stripped of its cruder and exaggerated features." How much short of the whole truth this statement comes will appear later, but as it stands it defines the specific direction of inquiry into the New Testament treatment of demons; namely, to explain its freedom from the crude and exaggerated features of popular demonism. The presence among New Testament writers of an influence curbing curiosity and restraining the imagination is of all things the most important for us to discover and emphasize. In four of its most vital features the New Testament attitude on this subject differs from all popular conceptions:<P>(a) in the absence of all imaginative details concerning demons;<P>(b) in the emphasis placed upon the moral character of demons and their connection with the ethical disorders of the human race;<p>(c) in the absence of confidence in magical methods of any kind in dealing with demons;<P>(d) in its intense restrictions of the sphere of demoniacal operations.<P>A brief treatment under each of these heads will serve to present an ordered statement of the most important facts.<P>(a) In the New Testament we are told practically nothing about the origin, nature, characteristics or habits of demons. In a highly figurative passage (<a onClick="return mV(\'Mat\',12,43);">Mt 12:43</a>) our Lord speaks of demons as passing through "waterless places," and in the story of the Gadarene demoniac (<a onClick="return mV(\'Luk\',8,31);">Lu 8:31</a>) the "abyss" is mentioned as the place of their ultimate detention. The method of their control over human beings is represented in two contrasted ways (compare <a onClick="return mV(\'Mar\',1,23);">Mr 1:23</a>ff; <a onClick="return mV(\'Luk\',4,33);">Lu 4:33</a>ff), indicating that there was no fixed mode of regarding it. With these three scant items our direct information ceases. We are compelled to infer from the effects given in the limited number of specific instances narrated. And it is worthy of more than passing mention that no theoretical discussion of demons occurs. The center of interest in the Gospels is the person of Jesus, the sufferers and the cures. Interest in the demons as such is absent. Certain passages seem to indicate that the demons were able to speak (see <a onClick="return mV(\'Mar\',1,24,26,34);">Mr 1:24, 26, 34</a>; <a onClick="return mV(\'Luk\',4,41);">Lu 4:41</a>, etc.), but comparing these statements with others (compare <a onClick="return mV(\'Mar\',1,23);">Mr 1:23</a>; <a onClick="return mV(\'Luk\',8,28);">Lu 8:28</a>) it is seen that no distinction is drawn between the cries of the tormented in the paroxysms of their complaint and the cries attributed to the demons themselves. In other particulars the representation is consistent. The demons belong to the unseen world, they are incapable of manifestation except in in the disorders which they cause—there are no materializations, no grotesque narratives of appearances and disappearances, no morbid dealing with repulsive details, no license of speculation in the narratives. In contrast with this reticence is not merely the demonology of primitive people, but also that of the non-canonical Jewish books. In the Book of Enoch demons are said to be fallen angels, while Josephus holds that they are the spirits of the wicked dead. In the rabbinical writings speculation has run riot in discussing the origin, nature and habits of demons. They are represented as the offspring of Adam and Eve in conjunction with male and female spirits, as being themselves sexed and capable of reproduction as well as performing all other physical functions. Details are given of their numbers, haunts and habits, of times and places where they are especially dangerous, and of ways and methods of breaking their power (see <a href="./study/isbe/search.html?string=EXORCISM">EXORCISM</a>). Full sweep is also given to the imagination in descriptive narratives, oftentimes of the most morbid and unwholesome character, of their doings among men. After reading some of these narratives one can agree with Edersheim when he says, "Greater contrast could scarcely be conceived than between what we read in the New Testament and the views and practices mentioned in Rabbinic writings" (LTJM, II, 776).<P>(b) It is also clearly to be noted that while in its original application the term daimonion is morally indifferent, in New Testament usage the demon is invariably an ethically evil being. This differentiates the New Testament treatment from extra-canonical Jewish writings. In the New Testament demons belong to the kingdom of Satan whose power it is the mission of Christ to destroy. It deepens and intensifies its representations of the earnestness of human life and its moral issues by extending the sphere of moral struggle to the invisible world. It clearly teaches that the power of Christ extends to the world of evil spirits and that faith in Him is adequate protection against any evils to which men may be exposed. (For significance of this point see Plummer, Luke (ICC), 132-33.)<P>(c) The New Testament demonology differs from all others by its negation of the power of magic rites to deliver from the affliction. Magic which is clearly separable from religion at that specific point (see Gwatkin, Knowledge of God, I, 249) rests upon and is dependent upon spiritism. The ancient Babylonian incantation texts, forming a surprisingly large proportion of the extant documents, are addressed directly to the supposed activities and powers of demons. These beings, who are not trusted and prayed to in the sense in which deities are, command confidence and call forth prayer, are dealt with by magic rites and formulas (see Rogers, op. cit., 144). Even the Jewish non-canonical writings contain numerous forms of words and ceremonies for the expulsion of demons. In the New Testament there is no magic. The deliverance from a demon is a spiritual and ethical process (see <a href="./study/isbe/search.html?string=EXORCISM">EXORCISM</a>).<P>(d) In the New Testament the range of activities attributed to demons is greatly restricted. According to Babylonian ideas: "These demons were everywhere; they lurked in every corner, watching for their prey. The city streets knew their malevolent presence, the rivers, the seas, the tops of mountains; they appeared sometimes as serpents gliding noiselessly upon their victims, as birds horrid of mien flying resistlessly to destroy or afflict, as beings in human forms, grotesque, malformed, awe-inspiring through their hideousness. To these demons all sorts of misfortune were ascribed—a toothache; a headache, a broken bone, a raging fever, an outburst of anger, of jealousy, of incomprehensible disease" (Rogers, op. cit., 145). In the extra-canonical Jewish sources the same exuberance of fancy appears in attributing all kinds of ills of mind and body to innumerable, swarming hosts of demons lying in wait for men and besieging them with attacks and ills of all descriptions. Of this affluence of morbid fancy there is no hint in the New Testament. A careful analysis of the instances will show the importance of this fact. There are, taking repetitions and all, about 80 references to demons in the New Testament. In 11 instances the distinction between demon-possession and diseases ordinarily caused is clearly made (<a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>; <a onClick="return mV(\'Mat\',8,16);">8:16</a>; <a onClick="return mV(\'Mat\',10,8);">10:8</a>; <a onClick="return mV(\'Mar\',1,32,34);">Mr 1:32, 34</a>; <a onClick="return mV(\'Mar\',6,13);">6:13</a>; <a onClick="return mV(\'Mar\',16,17,18);">16:17-18</a>; <a onClick="return mV(\'Luk\',4,40,41);">Lu 4:40-41</a>; <a onClick="return mV(\'Luk\',9,1);">9:1</a>; <a onClick="return mV(\'Luk\',13,32);">13:32</a>; <a onClick="return mV(\'Act\',19,12);">Ac 19:12</a>). The results of demon-possession are not exclusively mental or nervous (<a onClick="return mV(\'Mat\',9,32,33);">Mt 9:32-33</a>; <a onClick="return mV(\'Mat\',12,22);">12:22</a>). They are distinctly and peculiarly mental in two instances only (Gadarene maniac, <a onClick="return mV(\'Mat\',8,28);">Mt 8:28</a> and parallels, and <a onClick="return mV(\'Act\',19,13);">Ac 19:13</a>f). Epilepsy is specified in one case only (<a onClick="return mV(\'Mat\',17,15);">Mt 17:15</a>). There is distinction made between demonized and epileptic, and demonized and lunatic (<a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>). There is distinction made between diseases caused by demons and the same disease not so caused (compare <a onClick="return mV(\'Mat\',12,22);">Mt 12:22</a>; <a onClick="return mV(\'Mat\',15,30);">15:30</a>). In most of the instances no specific symptoms are mentioned. In an equally large proportion, however, there are occasional fits of mental excitement often due to the presence and teaching of Christ.<P>Conclusions:<P>A summary of the entire material leads to the conclusion that, in the New Testament cases of demon-possession, we have a specific type of disturbance, physical or mental, distinguishable not so much by its symptoms which were often of the most general character, as by its accompaniments. The aura, so to say, which surrounded the patient, served to distinguish his symptoms and to point out the special cause to which his suffering was attributed. Another unique feature of New Testament demonology should be emphasized. While this group of disorders is attributed to demons, the victims are treated as sick folk and are healed. The whole atmosphere surrounding the narrative of these incidents is calm, lofty and pervaded with the spirit of Christ. When one remembers the manifold cruelties inspired by the unreasoning fear of demons, which make the annals of savage medicine a nightmare of unimaginable horrors, we cannot but feel the worldwide difference between the Biblical narratives and all others, both of ancient and modern times, with which we are acquainted. Every feature of the New Testament narratives points to the conclusion that in them we have trustworthy reports of actual cures. This is more important for New Testament faith than any other conclusion could possibly be.<P>It is also evident that Jesus treated these cases of invaded personality, of bondage of depression, of helpless fear, as due to a real superhuman cause, to meet and overcome which He addressed Himself. The most distinctive and important words we have upon this obscure and difficult subject, upon which we know far too little to speak with any assurance or authority, are these: "This kind can come out by nothing, save by prayer" (<a onClick="return mV(\'Mar\',9,29);">Mr 9:29</a>).<P>LITERATURE.<P>(1) The most accessible statement of Baudissin\'s theory is in Whitehouse\'s article "Demons," etc., in Hastings, Dictionary of the Bible (five volumes).<P>(2) For extra-canonical Jewish ideas use Lange, Apocrypha, 118, 134; Edersheim, LTJM, Appendices XIII, XVI.<P>(3) For spirit-lore in general see Ladd, Phil. Rel., index under the word, and standard books on Anthropology and Philosophy of Religion under Spiritism.<P>(4) For Babylonian demonology see summary in Rogers, Religion of Babylonia and Assyria, 144ff.``169';
isbe[2641]='Demophon`dem\'-o-fon (Demophon): A Syrian general in Palestine under Antiochus V (Eupator) who continued to harass the Jews after covenants had been made between Lysias and Judas Maccabeus (2Macc 12:2).``1';
isbe[2642]='Den`(ma\'on, me\'onah, "habitation"; me\'arah, and spelaion, "cave"; me\'urah (<a onClick="return mV(\'Isa\',11,8);">Isa 11:8</a>), "a light-hole," from \'or, "light," perhaps for me\'arah; cokh (<a onClick="return mV(\'Psa\',10,9);">Ps 10:9</a> the King James Version), and cukkah (<a onClick="return mV(\'Job\',38,40);">Job 38:40</a>), "a covert," elsewhere "booth"; \'erebh (<a onClick="return mV(\'Job\',37,8);">Job 37:8</a>), "covert," as in the Revised Version (British and American); gobh; compare Arabic jubb, "pit" (<a onClick="return mV(\'Dan\',6,7);">Da 6:7</a>); minharoth, "fissure" or "cleft" (<a onClick="return mV(\'Jdg\',6,2);">Jud 6:2</a>)): In the limestone mountains of Palestine caves, large and small, are abundant, the calcium carbonate, of which the rock is mainly composed, being dissolved by the water as it trickles over them or through their crevices. Even on the plains, by a similar process, pits or "lime sinks" are formed, which are sometimes used by the Arabs for storing straw or grain. Of this sort may have been the pit, bor, into which Joseph was cast by his brethren (<a onClick="return mV(\'Gen\',37,20);">Ge 37:20</a>). Caves and crevices and sometimes spaces among piled-up boulders at the foot of a cliff or in a stream bed are used as dens by jackals, wolves and other wild animals. Even the people, for longer or shorter periods, have lived as troglodytes. Compare <a onClick="return mV(\'Jdg\',6,2);">Jud 6:2</a>: "Because of Midian the children of Israel made them the dens (minharoth) which are in the mountains, and the caves (me\'arah), and the strongholds (metsadh)." The precipitous sides of the valleys contain many caves converted by a little labor into human habitations. Notable instances are the valley of the Kidron near Mar-Saba, and Wadi-ul-Chamam near the Sea of Tiberias.` <a href="./study/isbe/search.html?string=CAVE">CAVE</a>`37';
isbe[2643]='Denarius`de-na\'-ri-us (denarion): A Roman silver coin, 25 of which went to the aureus, the standard gold coin of the empire in the time of Augustus, which was equal in value to about one guinea or $5,25; more exactly &pound;1.0,6 = $5.00, the &pound; = $4.866 (in 1915). Hence, the value of the denarius would be about 20 cents and this was the ordinary wage of a soldier and a day laborer. The word is uniformly rendered "penny" in the King James Version and "shilling" in the American Standard Revised Version, except in <a onClick="return mV(\'Mat\',22,19);">Mt 22:19</a>; <a onClick="return mV(\'Mar\',12,15);">Mr 12:15</a> and <a onClick="return mV(\'Luk\',20,24);">Lu 20:24</a>, where the Latin word is used, since in these passsages it refers to the coin in which tribute was paid to the Roman government.` <a href="./study/isbe/search.html?string=MONEY">MONEY</a>`138';
isbe[2644]='Denounce`de-nouns\':Occurs in <a onClick="return mV(\'Deu\',30,18);">De 30:18</a>: "I denounce unto you this day, that ye shall surely perish." It is used here in the obsolete sense of "to declare," to make known in a solemn manner. It is not found in the Bible with the regular meaning of "to censure," "arraign," etc.``1';
isbe[2645]='Deny`de-ni\':This word is characteristic of the New Testament rather than the Old Testament, although it translates three different Hebrew originals, namely, kachash, "to lie," "disown" (<a onClick="return mV(\'Gen\',18,15);">Ge 18:15</a>; <a onClick="return mV(\'Jos\',24,27);">Jos 24:27</a>; <a onClick="return mV(\'Job\',8,18);">Job 8:18</a>; <a onClick="return mV(\'Job\',31,28);">31:28</a>; <a onClick="return mV(\'Pro\',30,9);">Pr 30:9</a>); mana\', "to withhold," "keep back" (<a onClick="return mV(\'1Ki\',20,7);">1Ki 20:7</a>; <a onClick="return mV(\'Pro\',30,7);">Pr 30:7</a>); shubh, "to turn back," "say no" (<a onClick="return mV(\'1Ki\',2,16);">1Ki 2:16</a>).<P>In the New Testament, antilego, is once translated "deny," in the case of the Sadducees who denied the resurrection (<a onClick="return mV(\'Luk\',20,27);">Lu 20:27</a> the King James Version), and where it carries the sense of speaking against the doctrine. But the word commonly is arneomai, with or without the prefix ap-. In the absence of the prefix the sense is "to disown," but when it is added it means "to disown totally" or to the fullest extent. In the milder sense it is found in <a onClick="return mV(\'Mat\',10,33);">Mt 10:33</a>; <a onClick="return mV(\'Mat\',26,70,72);">26:70, 72</a>; of Simon Peter, <a onClick="return mV(\'Mar\',14,68,70);">Mr 14:68, 70</a> (<a onClick="return mV(\'Act\',3,13,14);">Ac 3:13-14</a>; <a onClick="return mV(\'2Ti\',2,12,13);">2Ti 2:12-13</a>; <a onClick="return mV(\'2Pe\',2,1);">2Pe 2:1</a>; <a onClick="return mV(\'1Jo\',2,22,23);">1Joh 2:22-23</a>; <a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a>; <a onClick="return mV(\'Rev\',2,13);">Re 2:13</a>; <a onClick="return mV(\'Rev\',3,8);">3:8</a>). But it is significant that the sterner meaning is associated with <a onClick="return mV(\'Mat\',16,24);">Mt 16:24</a> and its parallels, where Christ calls upon him who would be His disciple to deny himself and take up his cross and follow Him.` <a href="./study/isbe/search.html?string=PETER,+SIMON">PETER, SIMON</a>`69';
isbe[2646]='Deposit`de-poz\'-it (paratheke, <a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>; <a onClick="return mV(\'2Ti\',1,12,14);">2Ti 1:12, 14</a> the Revised Version, margin, paraphrased in both the King James Version and the Revised Version (British and American) into "that which is committed" (see <a href="./study/isbe/search.html?string=COMMEND">COMMEND</a>)): The noun was used in the classical Greek, just as its English equivalents, for "that which is placed with another for safe keeping," a charge committed to another\'s hands, consisting often of money or property; compare <a onClick="return mV(\'Exd\',22,7);">Ex 22:7</a>; <a onClick="return mV(\'Lev\',6,2);">Le 6:2</a>. This practice was common in days when there were no banks.<P>(1) In <a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>; also <a onClick="return mV(\'2Ti\',1,14);">2Ti 1:14</a>, the reference is to a deposit which God makes with man, and for which man is to give a reckoning. The context shows that this deposit is the Christian faith, "the pattern of sound words" (<a onClick="return mV(\'2Ti\',1,13);">2Ti 1:13</a>), that which is contrasted with the "oppositions of the knowledge which is falsely so called" (<a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>). "Keep the talent of the Christian faith safe and undiminished" (Vincentius Lirenensis).<P>(2) In <a onClick="return mV(\'2Ti\',1,12);">2Ti 1:12</a>, the deposit is one which man makes with God. The key to the meaning of this expression is found probably in <a onClick="return mV(\'Psa\',31,5);">Ps 31:5</a>: "Into thy hand I commend my spirit: Thou hast redeemed me," i.e. "All that I am, with all my interests, have been entrusted to Thy safe keeping, and, therefore, I have no anxieties with respect to the future. The day of reckoning, \'that day,\' will show how faithful are the hands that hold this trust."``84';
isbe[2647]='Depth`` <a href="./study/isbe/search.html?string=ABYSS">ABYSS</a>`1';
isbe[2648]='Deputy`dep\'-u-ti: This is the correct rendering of nitsabh (<a onClick="return mV(\'1Ki\',22,47);">1Ki 22:47</a>). In <a onClick="return mV(\'Est\',8,9);">Es 8:9</a>; <a onClick="return mV(\'Est\',8,9);">9:3</a> the term improperly represents caghan, in the King James Version, and is corrected to "governor" in the Revised Version (British and American). In the New Testament "deputy" represents anthupatos (<a onClick="return mV(\'Act\',13,7,8,12);">Ac 13:7-8, 12</a>; <a onClick="return mV(\'Act\',18,12);">18:12</a>; <a onClick="return mV(\'Act\',19,38);">19:38</a>), which the Revised Version (British and American) correctly renders "<a href="./study/isbe/search.html?string=PROCONSUL">proconsul</a>" (which see). The Roman proconsuls were officers invested with consular power over a district outside the city, usually for one year. Originally they were retiring consuls, but after Augustus the title was given to governors of senatorial provinces, whether they had held the office of consul or not. The proconsul exercised judicial as well as military power in his province, and his authority was absolute, except as he might be held accountable at the expiration of his office.` <a href="./study/isbe/search.html?string=GOVERNMENT">GOVERNMENT</a>`75';
isbe[2649]='Derbe`dur\'-be (Derbe, <a onClick="return mV(\'Act\',14,20,21);">Ac 14:20-21</a>; <a onClick="return mV(\'Act\',16,1);">16:1</a>; Derbaios, <a onClick="return mV(\'Act\',20,4);">20:4</a>; Derbetes, Strabo, Cicero): A city in the extreme southeast corner of the Lycaonian plain is mentioned twice as having been visited by Paul (on his first and second missionary journeys respectively), and it may now be regarded as highly probable that he passed through it on his third journey (to the churches of Galatia). The view that these churches were in Southern Galatia is now accepted by the majority of English and American scholars, and a traveler passing through the Cilician Gates to Southern Galatia must have traversed the territory of Derbe.<P>1. History:<P>Derbe is first mentioned as the seat of Antipater, who entertained Cicero, the Roman orator and governor of Cilicia. When the kingdom of Amyntas passed, at his death in 25 BC, to the Romans, it was made into a province and called Galatia (see <a href="./study/isbe/search.html?string=GALATIA">GALATIA</a>). This province included Laranda as well as Derbe on the extreme southeast, and for a time Laranda was the frontier city looking toward Cappadocia and Cilicia and Syria via the Cilician Gates. But between 37 and 41 AD Laranda was transferred to the "protected" kingdom of Antiochus, and Derbe became the frontier city. It was the last city on distinctively Roman territory, on the road leading from Southern Galatia to the east; it was here that commerce entering the province had to pay the customs dues. Strabo records this fact when he calls Derbe a limen or "customs station." It owed its importance (and consequently its visit from Paul on his first journey) to this fact, and to its position on a great Roman road leading from Antioch, the capital of Southern Galatia, to Iconium, Laranda, Heracleia-Cybistra, and the Cilician Gates. Roman milestones have been found along the line of this road, one at a point 15 miles Northwest of Derbe. It was one of those Lycaonian cities honored with the title "Claudian" by the emperor Claudius; its coins bear the legend "Claudio-Derbe." This implied considerable importance and prosperity as well as strong pro-Roman feeling; yet we do not find Derbe standing aloof, like the Roman colonies Iconium and Lystra, from the Common Council of Lycaonian cities (Koinon Lykaonias).<P>Derbe remained in the province Galatia till about 135 AD, when it passed to the jurisdiction of the triple province Cilicia-Isauria-Lycaonia. It continued in this division till 295 AD, and was then included in the newly formed province Isauria. This arrangement lasted till about 372 AD, when Lycaonia, including Derbe, was formed into a separate province. The statement of Stephanus of Byzantium that Derbe was "a fortress of Isauria" originated in the arrangement which existed from 295 to 372 AD. Coins of the city represent Heracles, Fortuna and a winged Victory writing on a shield (after the pattern of the Venus of Melos, in the Louvre, Paris). Derbe is mentioned several times in the records of the church councils. A bishop, Daphnus of Derbe, was present at the Council of Constantinople in 381.<P>2. Situation:<P>The site of Derbe was approximately fixed by the American explorer Sterrett, and more accurately by Sir W. M. Ramsay, who, after carefully examining all the ruins in the neighborhood, placed it at Gudelisin. Up to 1911, certain epigraphic evidence fixing the site had not been found, but Ramsay\'s identification meets all the conditions, and cannot be far wrong. On the east, Derbe was conterminous with Laranda, on the Northeast with Barata in the Kara Dagh. It bordered on the territory of Iconium on the northwest, and on Isauria on the west. Its territory touched the foothills of Taurus on the south, and the site commands a fine view of the great mountain called Hadji Baba or the Pilgrim Father. The Greeks of the district say that the name is a reminiscence of Paul, "over whose travels" the mountain "stood as a silent witness."<P>The remains are mostly of the late Roman and Byzantine periods, but pottery of an earlier date has been found on the site. An inscription of a village on the territory of Derbe records the erection of a building by two architects from Lystra. A line of boundary stones, separating the territory of Derbe from that of Barata, is still standing. It probably belongs to an early delimitation of the territory of the frontier town of Galatia (Ramsay).<P>3. Paul at Derbe:<P>In <a onClick="return mV(\'Act\',14,20,21);">Ac 14:20-21</a>, it is narrated that Paul and Barnabas, after being driven out of Lystra, departed to Derbe, where they "preached the gospel...and made many disciples." But they did not further. Paul\'s mission included only the centers of Greco-Roman civilization; it was no part of his plan to pass over the frontier of the province into non-Roman territory. This aspect of his purpose is illustrated by the reference to Derbe on his second journey (<a onClick="return mV(\'Act\',16,1);">Ac 16:1</a>). Paul started from Antioch and "went through Syria and Cilicia, confirming the churches" (<a onClick="return mV(\'Act\',15,41);">Ac 15:41</a>). "Then he came to Derbe and Lystra" (<a onClick="return mV(\'Act\',16,1);">Ac 16:1</a> the King James Version). The unwarned reader might forget that in going from Cilicia to Derbe, Paul must have, passed through a considerable part of Antiochus\' territory, and visited the important cities of Heracleia-Cybistra and Laranda. But his work ends with the Roman Cilicia and begins again with the Roman Galatia; to him, the intervening country is a blank. Concentration of effort, and utilization only of the most fully prepared material were the characteristics of Paul\'s missionary journeys in Asia Minor. That Paul was successful in Derbe may be gathered (as Ramsay points out) from the fact that he does not mention Derbe among the places where he had suffered persecution (<a onClick="return mV(\'2Ti\',3,11);">2Ti 3:11</a>). Gaius of Derbe (among others) accompanied Paul to Jerusalem, in charge of the donations of the churches to the poor in that city (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>).<P>LITERATURE.<P>The only complete account of Derbe is that given in Sir W. M. Ramsay\'s Cities of Paul, 385-404. On Paul\'s mission there, see the same author\'s Paul the Traveler and Roman Citizen,119,178. Many inscriptions of the later Roman period are collected in Sterrett, Wolfe Expedition to Asia Minor, Numbers 18-52. The principal ancient authorities, besides Acts, are Cicero Ad Fam. xiii.73; Strabo xxx.569; Ptolemeus, v.6, 17; Steph. Byz., Hierocl., 675; Notit, Episcop., I,404,and the Acta Conciliorum.``20';
isbe[2650]='Derision`de-rizh\'-un: Three verbs are so translated luts, "scorn" (<a onClick="return mV(\'Psa\',119,51);">Ps 119:51</a>); la\'agh, "mock" (<a onClick="return mV(\'Psa\',2,4);">Ps 2:4</a>; <a onClick="return mV(\'Psa\',59,8);">59:8</a>; <a onClick="return mV(\'Eze\',23,32);">Eze 23:32</a>); and sachaq, "laugh at" (<a onClick="return mV(\'Job\',30,1);">Job 30:1</a>; <a onClick="return mV(\'Exd\',32,25);">Ex 32:25</a> margin, "a whispering"; compare The <span class="noTag">Wisdom of Solomon 5:3</span>). This word is found almost exclusively in the Psalms and Prophets; Jeremiah is fond of it. It is used both as a substantive and a verb, the latter in the phrase "to have in derision:"``1';
isbe[2651]='Descend; Descent`de-send\', de-sent\' (yaradh; katabaino, "go down"); (katabasis): Of Yahweh (<a onClick="return mV(\'Exd\',34,5);">Ex 34:5</a>); of the Spirit (<a onClick="return mV(\'Mat\',3,16);">Mt 3:16</a>); of angels (<a onClick="return mV(\'Gen\',28,12);">Ge 28:12</a>; <a onClick="return mV(\'Mat\',28,2);">Mt 28:2</a>; <a onClick="return mV(\'Jhn\',1,51);">Joh 1:51</a>); of Christ (<a onClick="return mV(\'1Th\',4,16);">1Th 4:16</a>; <a onClick="return mV(\'Eph\',4,9);">Eph 4:9</a>). "He also descended into the lower parts of the earth" is variously interpreted, the two chief interpretations being the one of the incarnation, and the other of the "descent into hell" (<a onClick="return mV(\'1Pe\',3,19);">1Pe 3:19</a>). The former regards the clause "of the earth," an appositive genitive, as when we speak of "the city of Rome," namely, "the lower parts, i.e. the earth." The other regards the genitive as possessive, or, with Meyer, as governed by the comparative, i.e. "parts lower than the earth." For the former view, see full discussion in Eadie; for the latter, Ellicott and especially Meyer, in commentaries on Eph.``84';
isbe[2652]='Descent, of Jesus`de-sent\'.` <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>`1';
isbe[2653]='Describe`de-skrib\':This verb, now obsolete, in the sense used in <a onClick="return mV(\'Jos\',18,4,6,8,9);">Jos 18:4, 6, 8-9</a> and <a onClick="return mV(\'Jdg\',8,14);">Jud 8:14</a>, is a translation of kathabh, usually rendered "to write" or "inscribe." But in the above passages it has the Old English meaning of dividing into parts or into lots, as for example: "Walk through the land, and describe it according to their inheritance" (<a onClick="return mV(\'Jos\',18,4);">Jos 18:4</a>); that is, describe in writing the location and size of the several parcels of land thus portioned out. In <a onClick="return mV(\'Jdg\',8,14);">Jud 8:14</a> "described" should be translated "wrote down a list of." "Describe" occurs twice in the King James Version of the New Testament (<a onClick="return mV(\'Rom\',4,6);">Ro 4:6</a>; <a onClick="return mV(\'Rom\',4,10);">10:5</a>), where lego, and grapho, are both rendered "describeth." the Revised Version (British and American) corrects both, and substitutes "pronounceth" in the first and "writeth" in the second passage.<P>Description = "list" (1Esdras 5:39).``34';
isbe[2654]='Descry`de-skri\': This word like "describe" came into the English through the French descrire (Latin, describere); it occurs only in the King James Version of <a onClick="return mV(\'Jdg\',1,23);">Jud 1:23</a>: "And the house of Joseph sent to Bethel." tur the verb thus translated, signifies "to explore" or "examine," and the Revised Version (British and American) correctly renders "sent to spy out."``1';
isbe[2655]='Desert`dez\'-ert midhbar, chorbah, yeshimon, \'arabhah, tsiyah, tohu; eremos, eremia: Midhbar, the commonest word for "desert," more often rendered "wilderness," is perhaps from the root dabhar, in the sense of "to drive," i.e. a place for driving or pasturing flocks. Yeshimon is from yasham, "to be empty", chorbah (compare Arabic kharib, "to lie waste"; khirbah, "a ruin"; kharab, "devastation"), from charabh "to be dry"; compare also \'arabh, "to be dry," and \'arabhah, "a desert" or "the Arabah" (see <a href="./study/isbe/search.html?string=CHAMPAIGN">CHAMPAIGN</a>). For \'erets tsiyah (<a onClick="return mV(\'Psa\',63,1);">Ps 63:1</a>; <a onClick="return mV(\'Isa\',41,18);">Isa 41:18</a>), "a dry land," compare tsiyim, "wild beasts of the desert" (<a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>, etc.). Tohu, variously rendered "without form" (<a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a> the King James Version), "empty space," the King James Version "empty place" (<a onClick="return mV(\'Job\',26,7);">Job 26:7</a>), "waste," the King James Version "nothing" (<a onClick="return mV(\'Job\',6,18);">Job 6:18</a>), "confusion," the Revised Version, margin, "wasteness" (<a onClick="return mV(\'Isa\',24,10);">Isa 24:10</a> the English Revised Version), may be compared with Arabic tah, "to go astray" at-Tih, "the desert of the wandering." In the New Testament we find eremos and eremia: "The child (John)...was in the deserts till the day of his showing unto Israel" (<a onClick="return mV(\'Luk\',1,80);">Lu 1:80</a>); "Our fathers did eat manna in the desert" (<a onClick="return mV(\'Jhn\',6,31);">Joh 6:31</a> the King James Version).<P>The desert as known to the Israelites was not a waste of sand, as those are apt to imagine who have in mind the pictures of the Sahara. Great expanses of sand, it is true, are found in Arabia, but the nearest one, an-Nufud, was several days\' journey distant from the farthest southeast reached by the Israelites in their wanderings. Most of the desert of Sinai and of Palestine is land that needs only water to make it fruitful. East of the Jordan, the line between "the desert" and "the sown" lies about along the line of the Chijaz railway. To the west there is barely enough water to support the crops of wheat; to the east there is too little. Near the line of demarcation, the yield of wheat depends strictly upon the rainfall. A few inches more or less of rain in the year determines whether the grain can reach maturity or not. The latent fertility of the desert lands is demonstrated by the season of scant rains, when they become carpeted with herbage and flowers. It is marvelous, too, how the camels, sheep and goats, even in the dry season, will find something to crop where the traveler sees nothing but absolute barrenness. The long wandering of the Israelites in "the desert" was made possible by the existence of food for their flocks and herds. Compare <a onClick="return mV(\'Psa\',65,11,12);">Ps 65:11-12</a>: "Thou crownest the year with thy goodness; And thy paths drop fatness. They drop upon the pastures of the Wilderness. And the hills are girded with joy"; and also <a onClick="return mV(\'Joe\',2,22);">Joe 2:22</a>: "The pastures of the wilderness do spring."<P>"The desert" or "the wilderness" (ha-midhbar) usually signifies the desert of the wandering, or the northern part of the Sinaitic Peninsula. Compare <a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a> King James Version: "<a href="./study/isbe/search.html?string=MOSES">MOSES</a>...led the flock (of Jethro) to the backside of the desert"; <a onClick="return mV(\'Exd\',5,3);">Ex 5:3</a> King James Version: "Let us go...three days\' journey into the desert"; <a onClick="return mV(\'Exd\',19,2);">Ex 19:2</a> King James Version: "They...were come to the desert of Sinai"; <a onClick="return mV(\'Exd\',23,31);">Ex 23:31</a> King James Version: "I will set thy bounds from the Red Sea even unto the sea of the Philistines, and from the desert unto the river" (Euphrates). Other uncultivated or pasture regions are known as Wilderness of Beersheba (<a onClick="return mV(\'Gen\',21,14);">Ge 21:14</a>), west of Judah (<a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>), west of En-gedi (<a onClick="return mV(\'1Sa\',24,1);">1Sa 24:1</a>), west of Gibeon (<a onClick="return mV(\'2Sa\',2,24);">2Sa 2:24</a>), west of Maon (<a onClick="return mV(\'1Sa\',23,24);">1Sa 23:24</a>), west of Damascus; compare Arabic Badiyet-ush-Sham (<a onClick="return mV(\'1Ki\',19,15);">1Ki 19:15</a>), etc. Midhbar yam, "the wilderness of the sea" (<a onClick="return mV(\'Isa\',21,1);">Isa 21:1</a>), may perhaps be that part of Arabia bordering upon the Persian Gulf.<P>Aside from the towns and fields, practically all the land was midhbar or "desert," for this term included mountain, plain and valley. The terms, "desert of En-gedi," "desert of Maon," etc., do not indicate circumscribed areas, but are applied in a general way to the lands about these places. To obtain water, the shepherds with their flocks traverse long distances to the wells, springs or streams, usually arranging to reach the water about the middle of the day and rest about it for an hour or so, taking shelter from the sun in the shadows of the rocks, perhaps under some overhanging ledge.``37';
isbe[2656]='Desire`de-zir\':The verb "to desire" in the Scriptures usually means "to long for," "to ask for," "to demand," and may be used in a good or bad sense (compare <a onClick="return mV(\'Deu\',7,25);">De 7:25</a> the King James Version). the Revised Version (British and American) frequently renders the more literal meaning of the Hebrew. Compare <a onClick="return mV(\'Job\',20,20);">Job 20:20</a>, "delight"; <a onClick="return mV(\'Pro\',21,20);">Pr 21:20</a>, "precious"; <a onClick="return mV(\'Psa\',40,6);">Ps 40:6</a>, "delight"; aiteo (except <a onClick="return mV(\'Col\',1,9);">Col 1:9</a>), and erotao (except <a onClick="return mV(\'Luk\',7,36);">Lu 7:36</a>) are rendered "to ask" and zeteo, "to seek" (compare <a onClick="return mV(\'Luk\',9,9);">Lu 9:9</a> et. al.). The Hebrew kacaph, literally, "to lose in value," is translated (<a onClick="return mV(\'Zep\',2,1);">Zep 2:1</a>) by "hath no shame" (the Revised Version, margin "longing," the King James Version "not desired"). The literal translation "to lose in value," "to degenerate," would be more in harmony with the context than the translations offered. The Hebrew chemdah (<a onClick="return mV(\'2Ch\',21,20);">2Ch 21:20</a>, "without being desired"), means according to the Arabic "to praise," "to give thanks." The context brings in contrast the burial of the king Jehoram with that of his fathers. In the latter case there was "burning," i.e. recognition and praise, but when Jehoram died, there was no chemdah, i.e. there was no praise for his services rendered to the kingdom. For "desire" in <a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a>` <a href="./study/isbe/search.html?string=CAPERBERRY">CAPERBERRY</a>`16';
isbe[2657]='Desire of All Nations`This phrase occurs only in <a onClick="return mV(\'Hag\',2,7);">Hag 2:7</a> (King James Version, the English Revised Version "desirable things," the American Revised Version, margin "things desired"), and is commonly applied to the Messiah.<P>At the erection of the temple in Ezra\'s time, the older men who had seen the more magnificent house of Solomon were disappointed and distressed at the comparison. The prophet, therefore, is directed to encourage them by the assurance that Yahweh is with them nevertheless, and in a little while will shake the heavens, the earth, the sea, the dry land and the nations, and "the desire of all nations" shall come, and the house shall be filled with glory, so that "the later glory of this house shall be greater than the former."<P>(1) Many expositors refer the prophecy to the first advent of Christ. The shaking of the heavens, the earth, the sea and the dry land is the figurative setting of the shaking of the nations, while this latter expression refers to those changes of earthly dominion coincident with the overthrow of the Persians by the Greeks, the Greeks by the Romans, and so on down to the beginning of our era. The house then in process of construction was filled with glory by the later presence of the Messiah, which glory was greater than the Shekinah of Solomon\'s time. Objections are presented to this view as follows: First, there is the element of time. Five centuries, more or less, elapsed between the building of Ezra\'s temple and the first advent of Christ, and the men of Ezra\'s time needed comfort for the present. Then there is the difficulty of associating the physical phenomena with any shaking of the nations occurring atthe first advent. Furthermore, in what sense, it is asked, could Christ, when He came, be said to be the desire of all nations? And finally, what comfort would a Jew find in this magnifying of the Gentiles?<P>(2) These difficulties, though not insuperable, lead others to apply the prophecy to the second advent of Christ. The Jews are to be restored to Jerusalem, and another temple is to be built (<span class="noTag">Eze 40-48</span>). The shaking of the nations and the physical phenomena find their fulfillment in the "Great Tribulation" so often spoken of in the Old Testament and Revelation, and which is followed by the coming of Christ in glory to set up His kingdom (<a onClick="return mV(\'Mal\',3,1);">Mal 3:1</a>; <a onClick="return mV(\'Mat\',24,29,30);">Mt 24:29-30</a> and other places). Some of the difficulties spoken of in the first instance apply here also, but not all of them, while others are common to both interpretations. One such common difficulty is that Ezra\'s temple can hardly be identified with that of the time of Herod and Christ, and certainly not with that of Ezekiel; which is met, however, by saying that all the temples, including Solomon\'s, are treated as but one "house"—the house of the Lord, in the religious sense, at least, if not architecturally. Another such difficulty touches the question of time, which, whether it includes five centuries or twenty, is met by the principle that to the prophets, "ascending in heart to God and the eternity of God, all times and all things of this world are only a mere point." When the precise time of particular events is not revealed, they sometimes describe them as continuous, and sometimes blend two events together, having a near or partial, and also a remote or complete fulfillment. "They saw the future in space rather than in time, or the perspective rather than the actual distance." It is noted that the Lord Jesus so blends together the destruction of Jerusalem by Titus, AD 70, and the days of the anti-Christ at the end of this age, that it is difficult to separate them, and to say which belongs exclusively to either (<a onClick="return mV(\'Mat\',24,\'1-\');">Mt 24</a>). That the words may have an ultimate fulfillment in the second advent of Christ receives strength from a comparison of <a onClick="return mV(\'Hag\',2,21,22);">Hag 2:21-22</a> with <a onClick="return mV(\'Hbr\',12,26,27);">Heb 12:26-27</a>. The writer of that epistle condenses the two passages in <a onClick="return mV(\'Hag\',2,6,7);">Hag 2:6-7</a> and <a onClick="return mV(\'Hag\',2,21,22);">Hag 2:21-22</a>, implying that it was one and the same shaking, of which the former verses denote the beginning, and the latter the end. The shaking, in other words, began introductory to the first advent and will be finished at the second. Concerning the former, compare <a onClick="return mV(\'Mat\',3,17);">Mt 3:17</a>; <a onClick="return mV(\'Mat\',27,51);">27:51</a>; <a onClick="return mV(\'Mat\',28,2);">28:2</a>; <a onClick="return mV(\'Act\',2,2);">Ac 2:2</a>; <a onClick="return mV(\'Act\',4,31);">4:31</a>, and concerning the latter, <a onClick="return mV(\'Mat\',24,7);">Mt 24:7</a>; <a onClick="return mV(\'Rev\',16,20);">Re 16:20</a>; <a onClick="return mV(\'Rev\',20,11);">20:11</a> (Bengel, quoted by Canon Faussett).<P>(3) Other expositors seek to cut the Gordian knot by altogether denying the application to the Messiah, and translating "the desire of all nations" by "the beauty," or "the desirable things of all nations," i.e. their precious gifts (see <a onClick="return mV(\'Isa\',60,5,11);">Isa 60:5, 11</a>; <a onClick="return mV(\'Isa\',61,6);">61:6</a>). This application is defended in the following way:<P>(a) The Hebrew word means the quality and not the thing desired;<P>(b) the Messiah was not desired by all the nations when He came;<P>(c) the verb "shall come" is plural, which requires the noun to be understood in the plural, whereas if the Messiah be intended, the noun is singular;<P>(d) "The silver is mine," etc. (<a onClick="return mV(\'Hag\',2,8);">Hag 2:8</a>) accords with the translation "the desirable things of all nations";<P>(e) the agreement of the Septuagint and Syriac versions with such rendering.<P>All these arguments, however, can be fairly met by counter-arguments, leaving the reader still in doubt.<P>(a) An abstract noun is often put for the concrete;<P>(b) the result shows that while the Jews rejected Christ, the Gentiles received and hence, desired Him;<P>(c) where two nouns stand together after the manner of "the desire" and "nations," the verb agrees in number sometimes with the latter, even though the former be its nominative;<P>(d) the 8th verse of the prophecy can be harmonized about as easily with one view as the other;<P>(e) the King James Version is sustained by the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) and early Jewish rabbis.``69';
isbe[2658]='Desolate`des\'-o-lat (very frequently in the Old Testament for shamem, and its derivatives; less frequently, charebh, and its derivatives, and other words. In the New Testament it stands for eremos (<a onClick="return mV(\'Mat\',23,38);">Mt 23:38</a>; <a onClick="return mV(\'Act\',1,20);">Ac 1:20</a>; <a onClick="return mV(\'Gal\',4,27);">Ga 4:27</a>) eremoo (<a onClick="return mV(\'Rev\',17,16);">Re 17:16</a>), and monoo (<a onClick="return mV(\'1Ti\',5,5);">1Ti 5:5</a>)): From Latin de, intens., solus, alone. Several shades of meaning can be distinguished:<P>(1) Its primary sense is "left lonely," "forlorn," e. g. <a onClick="return mV(\'Psa\',25,16);">Ps 25:16</a>, "Have mercy upon me; for I am desolate" (Hebrew yachidh, "alone"); <a onClick="return mV(\'1Ti\',5,5);">1Ti 5:5</a>, "she that is a widow indeed, and desolate" (Greek memonomene, "left alone").<P>(2) In the sense of "laid waste," "destitute of inhabitants," e. g. <a onClick="return mV(\'Jer\',4,7);">Jer 4:7</a>, "to make thy land desolate, that thy cities be laid waste, without inhabitant."<P>(3) With the meaning "comfortless," "afflicted," e. g. <a onClick="return mV(\'Psa\',143,4);">Ps 143:4</a>, "My heart within me is desolate."<P>(4) In the sense of "barren," "childless," "unfruitful," e. g. <a onClick="return mV(\'Job\',15,34);">Job 15:34</a>; <a onClick="return mV(\'Isa\',49,21);">Isa 49:21</a> (Hebrew galmudh).``49';
isbe[2659]='Desolation, Abomination of`` <a href="./study/isbe/search.html?string=ABOMINATION+OF+DESOLATION">ABOMINATION OF DESOLATION</a>`1';
isbe[2660]='Despair`de-spar\':The substantive only in <a onClick="return mV(\'2Cr\',4,8);">2Co 4:8</a>, "perplexed, but not in (the Revised Version (British and American) "yet not unto") despair," literally, "being at a loss, but not utterly at a loss." "Unto despair" here conveys the force of the Greek prefix ex ("utterly," "out and out"). Desperate, in <a onClick="return mV(\'Job\',6,26);">Job 6:26</a>; <a onClick="return mV(\'Isa\',17,11);">Isa 17:11</a>. In the latter instance, the Hebrew adjective is derived from a verb = "to be sick," and the literally, rendering would be "incurable" (compare <a onClick="return mV(\'Job\',34,6);">Job 34:6</a>, "my wound is incurable"). Desperately in <a onClick="return mV(\'Jer\',17,9);">Jer 17:9</a> the King James Version, where the heart is said to be "desperately (i.e. incurably) wicked" or "sick."``1';
isbe[2661]='Despite; Despiteful`de-spit\', de-spit\'-fool: "Despite" is from Latin despectus, "a looking down upon." As a noun (= "contempt") it is now generally used in its shortened form, "spite," while the longer form is used as a preposition (= "in spite of"). In English Versions of the Bible it is always a noun. In the Old Testament it translates Hebrew she\'aT, in <a onClick="return mV(\'Eze\',25,6);">Eze 25:6</a>, and in the Revised Version (British and American) <a onClick="return mV(\'Eze\',25,15);">Eze 25:15</a>; <a onClick="return mV(\'Eze\',36,5);">36:5</a> ("with despite of soul"). In <a onClick="return mV(\'Hbr\',10,29);">Heb 10:29</a> ("hath done despite unto the Spirit of grace") it stands for Greek enubrizo, "to treat with contempt."<P>The adjective "despiteful" occurs in the King James Version <a onClick="return mV(\'Eze\',25,15);">Eze 25:15</a>; <a onClick="return mV(\'Eze\',36,5);">36:5</a>; Sirach 31:31 ("despiteful words," the Revised Version (British and American) "a word of reproach"); <a onClick="return mV(\'Rom\',1,30);">Ro 1:30</a> (the Revised Version (British and American) "insolent" = Greek hubristes, from huper, "above"; compare English "uppish").``49';
isbe[2662]='Dessau`des\'-o, des\'-a-u (Dessaou (2Macc 14:16)): the Revised Version (British and American) <a href="./study/isbe/search.html?string=LESSAU">LESSAU</a> (which see).``1';
isbe[2663]='Destiny, (Meni)`des\'-ti-ni: A god of Good Luck, possibly the Pleiades.` <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=MENI">MENI</a>`1';
isbe[2664]='Destroyer`de-stroi\'-er: In several passages the word designates a supernatural agent of destruction, or destroying angel, executing Divine judgment.<P>(1) In <a onClick="return mV(\'Exd\',12,23);">Ex 12:23</a>, of the "destroyer" who smote the first-born in Egypt, again referred to under the same title in <a onClick="return mV(\'Hbr\',11,28);">Heb 11:28</a> the Revised Version (British and American) (the King James Version "he that destroyed").<P>(2) In <a onClick="return mV(\'Job\',33,22);">Job 33:22</a>, "the destroyers" (literally, "they that cause to die") = the angels of death that are ready to take away a man\'s life during severe illness. No exact parallel to this is found in the Old Testament. The nearest approach is "the angel that destroyed the people" by pestilence (<a onClick="return mV(\'2Sa\',24,16);">2Sa 24:16-17</a> parallel <a onClick="return mV(\'1Ch\',21,15,16);">1Ch 21:15-16</a>); the angel that smote the Assyrians (<a onClick="return mV(\'2Ki\',19,35);">2Ki 19:35</a> = <a onClick="return mV(\'Isa\',37,36);">Isa 37:36</a> parallel <a onClick="return mV(\'2Ch\',32,21);">2Ch 32:21</a>); "angels of evil" (<a onClick="return mV(\'Psa\',78,49);">Ps 78:49</a>).<P>(3) In the Apocrypha, "the destroyer" is once referred to as "the minister of punishment" (Revised Version; literally, "him who was punishing"), who brought death into the world (The Wisdom of <span class="noTag"Solomon 18:22-25</span>).<P>(4) In <a onClick="return mV(\'1Cr\',10,10);">1Co 10:10</a>, "the destroyer" is the angelic agent to whose instrumentality Paul attributes the plague of <a onClick="return mV(\'Num\',16,\'46-49\');">Nu 16:46-49</a>.<P>In later Jewish theology (the Targums and Midrash), the "destroyer" or "angel of death" appears under the name Sammael (i.e. the poison of God), who was once an arch-angel before the throne of God, and who caused the serpent to tempt Eve. According to Weber, he is not to be distinguished from Satan. The chief distinction between the "destroyer" of early thought and the Sammael of later Judaism is that the former was regarded as the emissary of Yahweh, and subservient to His will, and sometimes was not clearly distinguished from Yahweh Himself, whereas the latter was regarded as a perfectly distinct individuality, acting in independence or semi-independence, and from purely malicious and evil motives. The change was largely due to the influence of Persian dualism, which made good and evil to be independent powers.``49';
isbe[2665]='Destruction`de-struk\'-shun: In the King James Version this word translates over 30 Hebrew words in the Old Testament, and 4 words in the New Testament. Of these the most interesting, as having a technical sense, is \'abhaddon (from verb \'abhadh, "to be lost," "to perish"). It is found 6 times in the Wisdom Literature, and nowhere else in the Old Testament; compare <a onClick="return mV(\'Rev\',9,11);">Re 9:11</a>.` <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html?string=IR-HA-HERES">IR-HA-HERES</a>; <a href="./study/isbe/search.html?string=ON">ON</a>; <a href="./study/isbe/search.html?string=ABADDON">ABADDON</a>; <a href="./study/isbe/search.html?string=CITY+OF+DESTRUCTION">CITY OF DESTRUCTION</a>; <a href="./study/isbe/search.html?string=HELIOPOLIS">HELIOPOLIS</a>`1';
isbe[2666]='Determinate`de-tur\'-mi-nat (horismenos, "determined," "fixed"): Only in <a onClick="return mV(\'Act\',2,23);">Ac 2:23</a>, "by the determinate counsel and foreknowledge of. God," Greek horismenos, from horizo, "to set boundaries," "determine," "settle" (compare English word "horizon"—literally, "that which bounds"). It is remarkable that Peter in one and the same sentence speaks of the death of Christ from two quite distinct points of view.<P>(1) From the historical standpoint, it was a crime perpetrated by men who were morally responsible for their deed ("him...ye by the hand of lawless men did crucify and slay").<P>(2) From the standpoint of Divine teleology, it was part of an eternal plan ("by the determinate," etc.). No effort is made to demonstrate the logical consistency of the two ideas. They represent two aspects of the one fact. The same Greek word is used in <a onClick="return mV(\'Luk\',22,22);">Lu 22:22</a>, where Christ speaks of His betrayal as taking place "as it was (the Revised Version (British and American) "hath been") determined" (kata to horismenon). Compare <a onClick="return mV(\'Luk\',24,26);">Lu 24:26</a>.``49';
