isbe[2682]='Diana; Artemis`di-an\'-a (Artemis "prompt," "safe"): A deity of Asiatic origin, the mother goddess of the earth, whose seat of worship was the temple in Ephesus, the capital of the Roman province of Asia. Diana is but the Latinized form of the Greek word Artemis, yet the Artemis of Ephesus should not be confused with the Greek goddess of that name.<P>She may, however, be identified with the Cybele of the Phrygians whose name she also bore, and with several other deities who were worshipped under different names in various parts of the Orient. In Cappadocia she was known as Ma; to the Syrians as Atargatis or Mylitta; among the Phoenicians as Astarte, a name which appears among the Assyrians as Ishtar; the modern name Esther is derived from it. The same goddess seems to have been worshipped by the Hittites, for a female deity is sculptured on the rocks at Yazili Kaya, near the Hittite city of Boghazkeui. It may be shown ultimately that the various goddesses of Syria and Asia Minor all owe their origin to the earlier Assyrian or Babylonian Ishtar, the goddess of love, whose chief attributes they possessed. The several forms and names under which she appears axe due to the varying developments in different regions.<P>Tradition says that Diana was born in the woods near Ephesus, where her temple was built, when her image of wood (possibly ebony; Pliny, NH, xvi. 40; <a onClick="return mV(\'Act\',19,35);">Ac 19:35</a>) fell from the sky (see also <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>, sec. I, 8 (2)). Also according to tradition the city which was later called Ephesus was founded by the Amazons, and Diana or Cybele was the deity of those half-mythical people. Later when Ephesus fell into the possession of the Greeks, Greek civilization partly supplanted the Asiatic, and in that city the two civilizations were blended together. The Greek name of Artemis was given to the Asiatic goddess, and many of the Greek colonists represented her on their coins as Greek. Her images and forms of worship remained more Asiatic than Greek Her earliest statues were figures crudely carved in wood. Later when she was represented in stone and metals, she bore upon her head a mural headdress, representing a fortitled city wall; from it, drapery hung upon each side of her face to her shoulders. The upper part of her body was completely covered with rows of breasts to signify that she was the mother of all life. The lower arms were extended. The lower part of the body resembled a rough block, as if her legs had been wrapped up in cloth like those of an Egyptian mummy. In later times her Greek followers represented her with stags or lions standing at her sides. The most renowned of her statues stood on the platform before the entrance to her temple in Ephesus. As the statues indicate, she impersonated the reproductive powers of men and of animals and of all other life.<P>At the head of her cult was a chief priest, originally a eunuch who bore the name and later the title Megabyzos. Under him were priests known as Essenes, appointed. perhaps from the city officials, for but a single year; it was their duty to offer the sacrifices to the goddess in behalf of the city. Other subordinate classes of priests known as Kouretes, Krobatai and Hilroi performed duties which are now obscure. The priestesses were even more numerous, and, probably from their great numbers, they were called Melissai or bees; the Ephesian symbol therefore which appears commonly upon the coins struck in the city, is a bee. The Melissai, which in the early times were all virgins, were of three classes; it is no longer known just what the special duties of each class were. The ritual of the temple services consisted of sacrifices and of ceremonial prostitution, a practice which was common to many of the religions of the ancient Orient, and which still exists among some of the obscure tribes of Asia Minor.<P>The temple of Diana was not properly the home of the goddess; it was but a shrine, the chief one, devoted to her service. She lived in Nature; she was everywhere wherever there was life, the mother of all living things; all offerings of every possible nature were therefore acceptable to her; hence, the vast wealth which poured into her temple. Not only was she worshipped in her temple, but in the minute shrines or naoi which were sometimes modeled after the temple. More frequently the shrines were exceedingly crude objects, either of silver or stone or wood or clay. They were made at Ephesus by dependents of the temple, and carried by the pilgrims throughout the world. Before them Diana might also be worshipped anywhere, just as now from the soil of the sacred Mesopotamian city of Kerbela, where the sons of Ali were martyred, little blocks are formed and are carried away by the Shiah Moslems that they may pray upon sacred ground wherever they may be. The makers of the shrines of Diana formed an exceedingly large class among whom, in Paul\'s time, was Demetrius (<a onClick="return mV(\'Act\',19,24);">Ac 19:24</a>). None of the silver shrines have been discovered, but those of marble and of clay have appeared among the ruins of Ephesus. They are exceedingly crude; in a little shell-like bit of clay, a crude clay female figure sits, sometimes with a tambourine in one hand and a cup in the other, or with a lion at her side or beneath her foot. Though the shrines were sold as sacred dwelling-places of the goddess, that the pilgrims who carried them to their distant homes, or buried them in the graves with their dead, might be assured of her constant presence, their real purpose was to increase the temple revenues by their sale at a price which was many times their cost. With the shrines of Diana may be compared the household gods of clay found in abundance among the ruins of the earlier Babylonian cities, especially those cities in which temples to the goddess Ishtar stood.``7';

isbe[2684]='Diblah`dib\'-la (dibhlah, "circle"; Deblatha): The name occurs only in <a onClick="return mV(\'Eze\',6,14);">Eze 6:14</a> (the King James Version "Diblath"), and the place has not been identified. If the reading is correct it may possibly be represented by Dibl, a village in Upper Galilee, south of Tibnin. But more likely it is a scribal error for Riblah.``1';
isbe[2685]='Diblaim`dib\'-la-im, dib-la\'-im (dibhlayim, "two cakes"): A native of Northern Israel and father of Gomer, the wife of Hosea (<a onClick="return mV(\'Hsa\',1,3);">Ho 1:3</a>).``1';

isbe[2688]='Dibon; Dibon-Gad`di\'-bon (dibhon, "washing"; Daibon):<P>(1) A city of Moab captured by the Amorites (<a onClick="return mV(\'Num\',21,30);">Nu 21:30</a>), and held by them at the invasion by Israel. It was taken and given to the tribe of Gad, whence it is called Dibon-gad (<a onClick="return mV(\'Num\',32,34);">Nu 32:34</a>; <a onClick="return mV(\'Num\',33,45);">33:45</a>). In <a onClick="return mV(\'Jos\',13,17);">Jos 13:17</a> it is reckoned to Reuben. Along with other cities in the territory north of the Arnon, Dibon changed hands several times between Moab and Israel. Mesha claims it (MS), and in <a onClick="return mV(\'Jer\',48,18);">Jer 48:18</a>, <a onClick="return mV(\'Jer\',48,22);">22</a> it is named among the cities of Moab. The form of the name, Dimon, in <a onClick="return mV(\'Isa\',15,9);">Isa 15:9</a>, may have been given to make it resemble the Hebrew dam, "blood," to support the play upon words in the verse (HDB, under the word). It is represented by the modern Dhiban, about 4 miles north of Aroer (\'Ara\'ir), on the line of the old Roman road. The ruins that spread over two adjacent knolls are of no importance: walls, a tower, cistern, etc. Near Dibon the famous Moabite Stone was found.<P>(2) A town in Judah, occupied after the exile (<a onClick="return mV(\'Neh\',11,25);">Ne 11:25</a>). It may be the same as Dimonah (<a onClick="return mV(\'Jos\',15,22);">Jos 15:22</a>); unidentified.``54';
isbe[2689]='Dibri`dib\'-ri (dibhri, "eloquent" (?)): A Danite, whose daughter Shelomith married an Egyptian. Their son was "cut off" (stoned) for blasphemy (<a onClick="return mV(\'Lev\',24,11);">Le 24:11</a>).``1';

isbe[2691]='Dictionaries`dik\'-shun-a-riz: A dictionary is a word-book or a list of words arranged in some fixed order, generally alphabetical, for ready reference, and usually with definitions or longer treatises. The vocabulary or glossary is a mere list of words, often without definitions; the Lexicon or dictionary of language (words or concepts) has bare definitions, and the alphabetical encyclopedia or dictionary of knowledge or information (objects, things, subjects, topics, etc.) has longer treatises, but they are all dictionaries: the alphabetical order being the main essential in modern use. There is, however, historically no good reason why the dictionary should not be logical or chronological. The earliest use of the word as quoted by Murray\'s Dictionary (Joh. de Garlandia, circa 1225) was of a collection of words classified and not alphabetical. So, too, almost the earliest use in English (J. Withal\'s Dictionarie, 1556) was of a book of words classified by subjects. A book like Roget\'s Thesaurus, which is a list of classified words without definition, or a systematic encyclopedia of treatises like Coleridge\'s unfortunate experiment, the Encyclopedia Metropolitana, is a dictionary in the historic sense. The earliest books usually quoted in the lists of Biblical dictionaries were also in fact classified or chronological, and not alphabetical (Eusebius\' Onomasticon; Jerome\'s De viris illustribus). Classified word lists, syllabaries, etc., of pre-alphabetic times, as well as in Chinese and other non-alphabetic languages of today, are of course also non-alphabetic, but strictly dictionaries.<P>In pre-alphabetic times the dictionaries include, besides the syllabaries of which there were many examples in Assyria, Babylonia, Egypt, Cyprus, etc., and the word lists proper, chronological lists of kings and various classified lists of tribute, and of astronomical or other objects. They include, in short, all the many lists where the material is grouped round a series of catchwords.<P>The alphabetical dictionary began with the alphabet itself, for this is a list of names of objects. The earlier alphabetical dictionaries were sometimes called alphabets. In a sense the alphabetical acrostics are dictionaries rather than acrostics, and <a onClick="return mV(\'Psa\',119,1);">Ps 119</a>, where considerable material is grouped under each letter of the alphabet, comes rather close to the dictionary idea.<P>So long as the quantity of literary material remained small, there was very little need for the development of the alphabetical dictionary, and the examples are rather few, the Lexicon of Suidas being perhaps the most noteworthy. With the immense increase in literary material there was a rapidly growing appreciation of the advantage of alphabetical arrangement, over the chronological or the systematic, in all cases where the object is to refer to a specific topic, rather than to read a book through or survey many topics with reference to their relation to one another. The number of alphabetical dictionaries of knowledge increased rapidly with the growth of learning from the 13th century; now it has become legion and there are few subjects so narrow that they cannot boast their dictionary of information.<P>1. Bible Dictionaries:<P>The earliest Bible dictionary is usually counted the Eusebius, Onomasticon of Eusebius, a geographical encyclopedia; then came Jerome\'s De nominibus hebraicis, and his De viris illustribus (chronological). The more noteworthy steps in the history of Bible dictionaries are represented by the names of Alsted, Calmet, Winer, Kitto, William Smith, Fairbairn, Schenkel. The best recent dictionaries among the larger works are the Encyclopedia Biblica, standing for the extreme higher critical wing; Hastings, representing the slightly less radical; and this present International Standard Bible Encyclopedia, which represents a growing distrust of the extreme positions of the 19th century higher critics. All of these are on a large scale and stand for the latest and best scholarship, and the same quality is reflected in at least two of the recent single-volume dictionaries, A Standard Bible Dictionary (M. W. Jacobus), and the single-volume Hastings\' dictionary. Both of these in tendency stand between Cheyne\'s Encyclopedia Biblica and this dictionary, Hastings facing rather toward Cheyne, and Jacobus toward this present work.<P>2. Bibliography:<P>The John Crerar Library list of encyclopedias forms an excellent guide to the literature of general encyclopedias within its scope, which includes chiefly technology and physical and social sciences, but includes among its reference books very admirably chosen first-reference dictionaries to language, history, fine arts, and even philosophy and religion.<P>Kroeger, Alice B. Guide to the Study and Use of Reference Books, 2nd edition, Boston,1908,is an admirable introduction. Its select lists and bibliographical references supplemented by the John Crerar and other reference library lists will give complete orientation.<P>Following is a list of previous dictionaries:<P>BIBLICAL DICTIONARIES<P>Ayre, J. Treasury of Bible Knowledge. London, 1866.<P>Barnum, Samuel W. A Comprehensive Dictionary of the Bible. New York: Appleton, 1867.<P>Barr, John. A Complete Index and Concise Dictionary of the Holy Bible. New York: Methodist Book Concern, 1852.<P>Bastow, J. A. Biblical Dictionary. London,1848,3 volumes; condensed edition, London, 1859; 4th edition, 1877.<P>Beck, J. C. Vollstand. bibl. Worterbuch. Basel,1770,2 volumes.<P>Besser, H. Bibl. Worterbuch. Gotha, 1866.<P>Bible Cyclopaedia, The. London: Parker, 1841.<P>Bost, J. A. Dictionnaire de la Bible. Paris, 1865.<P>Bourazan, F. A. Sacred Dictionary. London: Nisbet, 1890.<P>Brown, John. A Dictionary of the Holy Bible. Edinburgh,1768,4th edition; London: Murray, 1797; American edition, from the 12th Edinburgh edition, New York: Harper, 1846.<P>Calmet, A. Dict. historique, critique, chronologique, geographique et litteral de la Bible. Paris, 1719.<P>Calmet, Augustine. Dictionary of the Holy Bible. 5th edition, revised and enlarged, 5 volumes, London: Holdsworth, 1829; new edition, London: Bohn, 1847; abridged by Buckley, new edition, London: Routledge, 1862.<P>Cassell\'s Bible Dictionary. Illustrated with nearly 600 engravings; London and New York, 2 volumes: Cassell, 1866; new edition, 1869.<P>Cheyne, T. K. and Black, J. S. Encyclopedia Biblica. London, 1899-1903, 4 volumes.<P>Conder, F. R. and C. R. A Handbook to the Bible. London: Longmans, 1879; 2nd edition,1880,New York: Randolph, no date (1880).<P>Dalmasius, J. A. Dictionarium manuale biblicum. Aug. Vind.,1776,2 volumes.<P>Davis, J. D. Dictionary of the Bible. Philadelphia, 1898; new edition, 1903.<P>Eadie, John. A Biblical Cyclopaedia. London: Rel. Tr. Soc., 1848; 14th edition, London: Griffin, 1873.<P>Easton, M. G. Illustrated Bible Dictionary. London: Nelson; New York: Methodist Book Concern, 1893.<P>Fairbairn, Patrick. The Imperial Bible Dictionary. London: Blackie,1866,2 volumes.<P>Farrar, John. A Biblical and Theological Dictionary. London: Mason, 1852; new edition, London: Wesl. Conf. Off., 1889.<P>Faussett, A. R. The Englishman\'s Bible Encyclopedia. London: Hodder, 1878. Republished with title. Bible Cyclopaedia, Critical and Expository. New York: Funk, 1891.<P>Gardner, J. Christian Encyclopedia. Edinburgh, no date<P>Gebhardt, G. L. Biblisches Worterb. Lemgo, 1793-96, 3 volumes.<P>Goodhue, W. and Taylor, W. C. Pictorial Dictionary of the Holy Bible. London,1843,2 volumes.<P>Granbery, John C. Bible Dictionary. Nashville: So. Meth. Pub. Soc., 1883.<P>Green, S. Biblical and Theol. Dictionary. London,1840,1860.<P>Guthe, H. Kurzes Bibelworterbuch. 1903.<P>Hagen. Lexicon biblicum. Paris, 1905-, 4 volumes (Roman Catholic).<P>Hamburger. Realencyklopadie fur Bibel und Talmud. New edition 1896-97; 2 volumes and 4 supplementary volumes (Jewish point of view).<P>Hamburger, J. Biblisch-talmudisches Worterbuch. Strelitz, 1866.<P>Hastings. Dictionary of the Bible. Edinburgh and New York, 1898-1902, 4 volumes and supplementary vol, 1904. 1-vol edition, 1909.<P>Hastings, James, and others. Dictionary of Christ and the Gospels. New York: Scribner; Edinburgh: Clark, 1906-8, 2 volumes.<P>Haupt, C. G. Bibl. Real-Encyklopadie. Quedlinb., 1820-27, 3 volumes.<P>Hezel, W. F. Biblisches Real-Lexikon. Leipzig, 1783-85, 3 volumes.<P>Hoffmann, A. C. Allgem. Volks-Bibellexikon. Leipzig, 1842.<P>Hunter, R. Concise Bible Dict. London: Cassell, 1894.<P>Inglis, James. Bible Text Cyclopaedia. London: Houlston, 1861; new edition, Rel. Tr. Soc.,1865,Philadelphia: Lippincott, 1877.<P>Jacobus, M. W. A Standard Bible Dictionary. New York: Funk, 1909.<P>Jones, William. The Biblical Cyclopaedia; or Dictionary of the Holy Scriptures. London: Wightman, 1840; new edition, Tegg, 1847; revised, 1873.<P>Kitto, John. Cyclopaedia of Biblical Literature. 3rd ed., edition Alexander, Edinburgh, 1862-65, 3 volumes (best edition of Kitto), and after.<P>Krehl. Neutestamentl. Handworterbuch. Gottingen, 1857.<P>Lawson, J. P. Bible Cyclopaedia. London,1849,3 volumes.<P>Leun, F. G. Bibl. Encyklopadie. Gotha, 1793-98, 4 volumes.<P>Macbean, A. Dictionary of the Bible. London, 1779.<P>Macpherson, John. The Universal Bible Dictionary. London: Hodder, 1892.<P>Malcom, Howard. New Bible Dictionary. Boston: Gould; New York: Sheldon, 1852.<P>Malcom, H. Dictionary of the Bible. London, 1854.<P>Oetinger, F. C. Biblisches Worterb. Stuttgart, 1849.<P>Oliver, P. Scripture Lexicon. Birmingham, 1784; London, 1843.<P>Otho, J. H. Lex. Rabbinico-philologicum. Geneva, 1675.<P>Rand, W. W. A Dictionary of the Holy Bible. New York: Am. Tr. Soc., no date (1859); rev. edition, 1886.<P>Ravanel, P. Bibliotheca Sacra. Geneva, 1660.<P>Rawson, A. L. The Bible Handbook, for Sunday Schools. 4th edition, New York: Thompson, 1870.<P>Rechenbergius, A. Hierolexicon reale collectum. Leipzig und Frankfort,1714,2 volumes.<P>Rice, Edwin W. People\'s Dictionary of the Bible. Philadelphia: Am. S. S. U., 1893.<P>Riehm and Bathgen. Handworterbuch des biblischen Altertums. Bielefeld, 1893-94, 2 volumes.<P>Roberts, Francis. Clavis Bibliorum. 1675.<P>Robinson, E. Dictionary of the Bible. New York: Worthington, 1879.<P>Schaff, Philip. A Dictionary of the Bible. Philadelphia: Am. S. S. U., 1880; 5th edition, 1890.<P>Schenkel. Bibel Lexikon. 1869-75, 5 volumes.<P>Schneider, M. C. F. Worterb. ub. d. Bibel. Leipzig, 1795-1817, 4 volumes.<P>Simon, Richard. Grand dictionnaire de la Bible. Lyons, 1693.<P>Smith, W. Dictionary of the Bible. London, 1860-63, 3 volumes; 2nd edition, Smith and Fuller, 1893.<P>Smith, W. Dictionary of the Bible. Boston, no date, 4 volumes.<P>Smith, W. Bible Dictionary. Acme edition, New York: Alden, 1885.<P>Vigouroux. Dictionnaire de la Bible contenant tous les noms de personnes, de lieux...mentionnes dans les s. Ecritures. Paris, 1895-.<P>Vollbeding, J. C. Bibl. Worterb. Berlin, 1800-1805, 3 volumes.<P>Watson, R. Biblical and Theol. Dictionary. London, 1831; New York, also Nashville.<P>Wahl, C. A. Bibl. Handworterb. Leipzig,1828,2 volumes.<P>Walbrecht, C. L. Biblisch. Worterbuch. Gottingen, 1837.<P>Westcott, A., and Watt, J. Concise Bible Dictionary. London: Isbister, 1893.<P>Wilson, T. Complete Christian Dictionary. London, 1661.<P>Winer, G. B. Biblisches Realworterb. 3rd edition, 1847-48, 2 volumes (still useful).<P>Zeller, H. Biblisches Worterb. Stuttgart, 1855-58, 2 volumes.<P>Other recent one-volume dictionaries are: Angus (1907), Bevis (1900); Gamble (1906), Ewing (1910), Hyamson (1907), Piercy (1908).<P>3. General Religious Encyclopedias:<P>Next in importance for Bible students to the Bible dictionaries are the general dictionaries of religious knowledge. Many of the more recent of these, such as the Hauck edition of RE, the new Sch-Herz, Jewish Encyclopedia, the Catholic Encyclopedia, and in general all the larger and some of the smaller recent ones have articles of real importance for Bible study, often better than some of the specific Bible dictionaries.<P>GENERAL THEOLOGICAL DICTIONARIES<P>Abbott, Lyman. A Dictionary of Religious Knowledge. New York: Harper, 1875.<P>Addis, William E. A Catholic Dictionary. New York: Cath. Pub. Soc. Co., 1884; 4th edition, revised, London: Paul, 1893.<P>Aschbach. Kirchenlexikon. n. p. 1846-51, 4 volumes.<P>Benham, William. Dictionary of Religion. London and New York: Cassell, 1887.<P>Buchberger. Kirchliches Handlexikon. Munchen, 1907 (short but comprehensive).<P>Buck, Charles. A Theological Dictionary. Enlarged by Dr. Henderson. London: Tegg, 1847; American edition, revised and enlarged by George Bush; Philadelphia: Desliver, no date<P>Ceccaroni, A. Dizionaro ecclesiastico illustrato. Milano.<P>Dwight, H. O., Tupper, H. O., Jr. and Bliss, E. M. The Encyclopedia of Missions. New York, 1904.<P>Eadie, J. The Ecclesiastical Encyclopedia. London: Griffin, 1847; new edition, 1875.<P>Eden, Robert. The Churchman\'s Theological Dictionary. 2nd edition, London: Parker, 1846; new edition, 1859.<P>Encyclopedia of Religious Knowledge, The; or, Dictionary of the Bible. Rev. edition, Philadelphia: Claxton, 1870.<P>Farrar, John. An Ecclesiastical Dictionary. London: Mason,1853,revised, 1871.<P>Gardner, James. The Christian Encyclopedia. London: Groombridge, 1854; new edition, 1858.<P>Glaire, J. B. Dictionnaire universel des sciences ecclesiastiques. Paris,1868,2 volumes.<P>Herbermann, Pace, Pellen, Shahan and Wynne. Catholic Encyclopedia. New York, 1906-, 15 volumes.<P>Herzog. Realencyclopadie fur protestantische Theologie u. Kirche. 1853-68, 21 volumes; 3rd ed., edition Hauck, 1896-1908, 21 volumes, translation New York, 1908-(best of all the ecclesiastical dictionaries).<P>Herzog, J. J. A Protestant, Theological, and Ecclesiastical Encyclopedia. Vols I and II. Philadelphia: Lindsay, 1858-60.<P>Holtzmann and Zopffel. Lexikon fur Theologie und Kirchenwesen. 2nd edition, Brunswick, 1888 (Prot).<P>Jackson, Samuel Macauley. Concise Dictionary of Religious Knowledge and Gazetteer. New York: Christian Lit. Co.,1890,1891; 3rd edition, New York: Maynard, 1893.<P>Jackson, S. M. The New Schaff-Herzog. New York: Funk,1908,sq. (good and modern).<P>Jewish Encyclopedia. New York, 1901-6, 12 volumes (most scholarly).<P>Lichtenberger, F. Dict. des sci. eccl. Paris, 1877-82, 15 volumes (French Protestant).<P>McClintock, John and Strong, James. Cyclopaedia of Biblical, Theological, and Ecclesiastical Literature. 10 volumes. New York: Earper, 1867-81. With supplements in 2 volumes, 1890.<P>Marsden, J. B. A Dictionary of Christian Churches and Sects. London: Bentley, 1857.<P>Migne. Encycl. theologique. Paris, 1844-75 (over 100 special lexicons).<P>Moroni. Dizionario di erudizione storico-ecclesiastica. Venice, 1840-79, 103 volumes, and Index, 6 volumes.<P>Among the older ones the huge encyclopedia of Migne, which is a classified series of alphabetical dictionaries, and the Moroni, with its 109 volumes, are still of great usefulness to the scholar on out-of-the-way topics, not so much for Biblical topics but at least for Biblical related matters.<P>Perthes. Handlexikon fur evangelische Theol. Gotha, 1890-1901, 3 volumes.<P>Robinson, John. Theological, Biblical and Ecclesiastical Dictionary. London: Whittaker, 1815; 4th edition, 1835.<P>Schaff, Philip and Jackson, Samuel Macauley. A Religious Encyclopedia. New York: Christian Lit. Co., 1882; 3rd edition, New York: Funk, 1891. Together with an Encyclopedia of Living Divines, etc.<P>Schaffer. Handlexikon der kath. Theologie. Ratisbon, 1881-91, 3 volumes.<P>Schiele. Die Religion in Geschichte und Gegenwart. Tubingen, 1909-, 5 volumes.<P>Shipley, Orby. A Glossary of Ecclesiastical Forms. London: Rivingtons, 1871.<P>Staunton, William. An Ecclesiastical Dictionary, New York: Prot. Ep. S. S. U., 1861.<P>Vacant and Mangenot. Dictionnaire de theologie catholique. Paris, 1903-.<P>Wetzer and Welte. Kirchenlexicon. Freiburg, 1847-60; 2nd edition, 1880-91, 13 volumes, and index, 1903 (Roman Catholic scientific best).<P>4. Dictionaries of Comparative Religion:<P>The monumental dictionary in this class superseding all others is Hastings\' Encyclopedia of Religion and Ethics, but Forlong has served a useful purpose and some of the special dictionaries like Roscher are quite in the same class with Hastings.<P>COMPARATIVE RELIGION<P>Balfour, E. Cyclopaedia of India, and of East and South Asia. 3rd edition, London,1885,3 volumes.<P>Beale, Th. W. Oriental Biographical Dictionary. Calcutta, 1881; London, 1894.<P>Brewer, E. C. Dictionary of Phrase and Fable. London, 1905.<P>Encyclopedia of Islam. London: Luzac.<P>Forlong, J. G. R. Faiths of Man; a Cyclopaedia of Religions. London,1906,3 volumes.<P>Hastings, James. Encyclopedia of Religion and Ethics. Edinburgh, Clark; New York, Scribner, 1908-.<P>Hazlitt, W. C. Faiths and Folklore; a Dictionary of National Beliefs. London, 1905.<P>Hughes, T. P. Dictionary of Islam. London, 1885.<P>5. Denominational Dictionaries:<P>The admirable Jewish and Catholic encyclopedias mentioned above, like the Methodist M\'Clintock and Strong, belong rather to general than denominational encyclopedias, but the Catholic dictionaries of Addis and of Thien are denominational in the same sense as those of the Episcopal, Lutheran, etc., churches, mentioned below, among which perhaps the best executed example is the Lutheran Encyclopedia of Jacobs.<P>DICTIONARIES OF DENOMINATIONS<P>Addis, W. E. A Catholic Dictionary, 3rd edition, New York, 1884.<P>Benton, A. A. The Church Cyclopaedia. Philadelphia, 1884.<P>Burgess, G. A. Free Baptist Cyclopaedia. Chicago: Free Bapt. Cyclop. Co., 1889.<P>Cathcart, Wm. The Baptist Encyclopedia. Philadelphia,1881,2 volumes.<P>Catholic Encyclopedia. New York, 1907 and following. See General Religious Encyclopedias.<P>Hook, Walter F. A Church Dictionary. Philadelphia: Butler, 1853; 7th edition, Tibbals, 1875.<P>Jacobs, H. E. and Haas, J. A. W. The Lutheran Cyclopedia. New York, 1905.<P>Jewish Encyclopedia. See General Theological Encyclopedias.<P>Nevin, A. Encyclopedia of the Presbyterian Church in the United States of America. Philadelphia, 1884.<P>Simpson, M. Cyclopaedia of Methodism. Philadelphia, 1878.<P>Thein, J. Ecclesiastical Dictionary. New York, 1900 (Roman Catholic).<P>SPECIAL DICTIONARIES: ANCIENT AND MEDIAEVAL HISTORY<P>Blunt, J. H. Dictionary of Sects, Heresies, etc. London, 1892.<P>Blunt, J. H. Dictionary of Doctrinal and Historical Theology. Philadelphia, 1870.<P>Brewer, E. C. A Dictionary of Miracles. Philadelphia, 1884.<P>Brodrick, M. Concise Dictionary of Egyptian Archaeol. London, 1902.<P>Cabrol. Dictionnaire d\'archeologie chretienne et de liturgie. Paris, 1907-.<P>Chevalier, Ul. Repertoire des sources hist. du moyen-age. Bio-bibliog. Paris, 1905-7.<p>———Repertoire des sources historiques du moyen-age. Topo-bibliog. Montbeliard, 1894-1903, 2 volumes.<P>Fabricius, J. A. Bibliotheca latina mediae et infimae aetatis. Patavii,1754,6 volumes in 3.<P>Julian, J. edition A Dictionary of Hymnology. New York, 1892.<P>Kraus. Real-Encyklopadie der christlichen Alterthumer. Freiburg i. Br., 1882-86, 2 volumes.<P>Lee, F. G. A Glossary of Liturgical and Ecclesiastical Terms. London, 1877.<P>Martigny. Dictionnaire des antiquites chretiennes. 2nd edition, Paris, 1877.<P>Pauly. Realencyk. der klass. Altertumswissenschaft. Stuttgart, 1842-66, 6 volumes; edition Wissowa, 1894 and later.<P>Roscher, W. H. Lexikon der griechischen und romischen Mythologie. Leipzig, 1884-1902, 5 volumes.<P>Smith, Wm. Dictionary of Greek and Roman Biography and Mythology. Boston,1849,3 volumes.<P>Smith, Wm. Dictionary of Greek and Roman Geography. Boston, 1854-57, 2 volumes.<P>Smith, Sir William, Wayte, William, and Marindin, G. E. Dictionary of Greek and Roman Antiquities. 3rd edition, enlarged London: Murray; Boston: Little, 1890-91, 2 volumes.<P>Smith, W. and Cheetham, A Dictionary of Christian Antiquities. Boston, 1875-1880, 2 volumes.<P>Smith, W. and Wace, H. A Dictionary of Christian Biography. Boston, 1877-87, 4 volumes; abridged edition by Wace and Piercy, 1911.<P>Stadler and Helm. Heiligenlexikon. 1858-82, 5 volumes.<P>Wolcott, Mackenzie E. C. Sacred Archaeology. London: Reeve, 1868.<P>6. Universal Encyclopedias:<P>What has been said of general religious encyclopedias applies almost equally to Biblical articles in the good general encyclopedias. Among these the Encyclopedia Britannica, of which a new edition appeared in 1911, is easily first, and has maintained through its many editions a high standard. The previous edition was edited by Professor Robertson Smith, who gave a peculiarly high quality of scholarship to its Biblical articles, while at the same time rather tingeing them with extreme views. Among the British encyclopedias, Chambers\' is still kept up to a high standard. The recent American editions include the New International, the Nelson, and the Americana, the former, perhaps, contributing most on Bible matters. The annual supplement to the International gives a useful resume of the progress of Biblical archaeology during each year.<P>UNIVERSAL ENCYCLOPAEDIAS<P>America and England<P>Adams, Charles Kendall. Universal Cyclopaedia and Atlas. New York: Appleton,1905,12 volumes.<P>American Cyclopaedia. New York, 1858-63, 16 volumes; new edition, 1873-76 ("Appleton\'s encyclopedia").<P>Chambers, Ephraim. Cyclopaedia. London, 1728.<P>Chambers\' Encyclopedia. London, 1860-68, 10 volumes; new edition, 1901.<P>Colby, Frank Moore. Nelson\'s Encyclopedia. (circa 1905-6), 12 volumes.<P>Encyclopedia Americana. New York: The Americana Co. (circa 1903-4), 16 volumes.<P>Encyclopedia Britannica. 1771; 9th edition, 1875-89, 29 volumes and Index, sup., 11 volumes, Index and atlas, 1902-3; 11th edition, Cambridge, England, 1910-11, 28 volumes.<P>Gilman, D. C. New International Encyclopedia. New York: Dodd, 1907 (circa 1902-7), 20 volumes.<P>Hunter. Encyclopaedic Dictionary. London, New York, 1879-88, 7 volumes.<P>Johnson\'s New Universal Encyc. New York, 1874-78, 4 volumes; new edition, 1893-95, 8 volumes.<P>Knight. English Cyclopedia. London, 1854-73, 27 volumes, and 4 supplementary volumes.<P>New International Year Book. New York: Dodd, 1908-.<P>Rees. New Encyclopedia. London, 1802-20. 45 volumes.<P>Schem. Deutsch-amerikanisches Konversations-Lex. New York, 1870-74.<P>Smedley (Coleridge?). Encyclopedia Metropolitana. 1818-45, 30 volumes (classed with some alphabetical sections).<P>France<P>Bayle. Dict. historique et critique. Rotterdam, 1695-97 (very widely circulated).<P>Berthelot, Derenbourg and others. La grande encyclopedie. See below.<P>Corneille, Thomas. (Dict.) Paris, 1694.<P>Dictionnaire de la conversation et de la lecture. 1851-58, 16 volumes.<P>Diderot and D\'Alembert. Encyclopedic. Paris, 1751-52, 28 volumes; 5 sup. volumes, Amsterdam, 1776-77; 2 volumes Index, Paris, 1780. (Also Voltaire, Rousseau, etc. This is in the history of dictionary encyclopedias "the encyclopedia" par excellence and epoch-making in the history of "free thought." Many editions; 1st edition, 30,000 copies.)<P>Encyclopedie des gens du monde. 1833-45, 22 volumes.<P>Encyclopedie du XIXe siecle. 1837-59, 75 volumes; 3rd edition, 1867-72. Continues as Annuaire encyc.<P>Encyclopedie moderne. 1846-51; new edition, 1856-72, 30 volumes, 12 sup. volumes, atlas, 2 volumes.<P>Furetiere. (Dict.) Rotterdam, 1690.<P>Grande encyclopedic. Paris: Lamirault, 1885-1903, 31 volumes (known as Lamirault\'s).<P>Larousse. Diet. univ., 1865-90; 17 volumes; new edition, 1895.<p>———. Dict. complet illustre. 129th edition, 1903.<P>Moerin. Grand dict. historique. Lyons, 1674.<P>Nouveau Larousse illustre. Paris, 1898-1904, 8 volumes.<P>Panckoucke and Agasse. Encyclopedie methodique. Paris, 1782-1832, 166 volumes, text, 51 volumes, illus. (classed -alphabetic method like Migne).<P>Germany<P>Allgemeine Realencyklopadie fur das katholische Deutschland. 1846-49, 13 volumes; 4th edition, 1880-90.<P>Brockhaas. Konversationslexikon. 14th edition, 1901 (B. and Meyer are the standard German encyclopedias).<P>Ersch and Gruber. Allgemeine encyklopadie. 1813-90, 99 plus 43 plus 25 volumes (scholarly and exhaustive; many articles are complete treatises).<P>Herder. Konversationslexikon. Freiburg, 1853-57, 5 volumes; 3rd edition, 1901-8, 8 volumes (Roman Catholic; high grade).<P>Hubner. Reales-, Staats-, Zeitungs-und Konversations-Lexikon; 31st edition, Leipzig, 1824-28.<P>Jablonski. Lexikon...Leipzig, 1721.<P>Koster and Roos. (Encyc.) Frankfort, 1778-1804, 23 volumes (stops at "Kinol").<P>Krunitz (and others). Oekonomisch-technolog. Encykl. Berlin, 1773-1858, 242 volumes.<P>Ludewig, Y. J. von. Grosses, vollstandiges, Universal-Lexikon. Leipzig, 1731-54, 68 volumes ("Zedler," which was publisher\'s name; most admirable and still useful; on account of the vast number of topics it often serves when all other sources fail).<P>Meyer. Konversations-lexikon. Leipzig, 1840-52, 37 volumes; 6th edition,1902,20 volumes; 7th edition, abridged,1907,6 volumes (Meyer and Brockhaus are the standard German encyclopedias).<P>Pierer. Universallexikon. 7th edition, 1888-93, 12 volumes.<P>Spamer. Illustriertes Konversationslexikon. 1869-79, 8 volumes, supplementary volumes, 1879-82; 2nd edition, 1884-91.<P>Zedler. Universal-Lexikon. See Ludewig above.<P>Italy<P>Berri. Enciclopedia popolare economica. Milan, 1871. Coronelli. Biblioteca universale. Venice,1701,7 volumes (incomplete).<P>Lessona and Valle. Dizionario universale. Milan, 1874-83.<P>Nuova encic. popolare italiana. Turin, 1841-51, 14 volumes; 6th edition, 1875-89, 25 volumes, sup., 1889-99.<P>Piccola enciclopedia Hoepli. Milan, 1891.<P>Netherlands<P>De algemeene Nederlandsche Encyclopedic. Zutphen, 1865-68, 15 volumes.<P>Lobel. (Encyc.) Amsterdam, 1796-1810 ("first enc according to modern ideas").<P>Mollerup. Nordisk Konversationsleksikon. 3rd edition, Copenhagen, 1883-94.<P>Nieuwenhuis Woordenboek. Leyden, 1851-68.<P>Sijthoff. Woordenboek voor Kennis en Kunst. Leyden, 1891.<P>Winkler Prins. Geillustreerde Encyclopedie. Amsterdam,1905,sq. 3rd edition<P>Russia and Poland<P>Meijer. Konversationsleksikon. 1889-94.<P>Brockhaus and Efron. Entciklopedicheskij Slovai. Petersburg, 1890-1902, 35 volumes.<P>Jushakow. Boljsaja Enciklopedija. Petersburg, 1899.<P>Sikoroski, Warsaw, 1890.<P>Orgelbrand. Encjklopedya Powszechna. Warsaw, 1859-68, 28 volumes.<P>Scandinavia<P>Blangstrup. Store Illustererede Konversationsleksikon. Copenhagen, 1891-1901, 12 volumes.<P>Johnsen, Norsk Haandbog. 1879-88.<P>Nordisk Familjsbok; Konversationslexikon. Stockholm, 1876-99, 20 volumes.<P>Salmonsen. Store Illustrerede Konversationsleksikon. Kjobenhavn, 1893-1907, 18 volumes.<P>Spain and Portugal<P>Diccionario Popular Hist. Geogr. Mytholog. Biograph. Lisbon, 1876-90, 16 volumes.<P>Enciclopedia Universal Illustrada Europeo-Americana. Barcelona, 1907-(Catholic).<P>Costa. Diccionario Universal Portuguez.<P>Lemos. Enciclopedia Portugueza Illustrada. 254 numbers to 1903.<P>Mellados. Enciclopedia moderna. Madrid, 1848-51, 34 volumes; 3 volumes of charts.<P>Montaner y Simon. Diccionario Encic Hispano-Americano. Barcelona, 1887-99, 25 volumes.<P>Other<P>Arabian Encyc. Discontinued when it reached the 9th vol, Beirut, 1876-87.<P>Enciclop. Romana. Herrmannstadt, 1896-1903, 3 volumes (Rumanian).<P>Kober. Slovnik Nancny. Prague, 1860-87, 12 volumes.<P>Otto. Ottuv Slovnik Nancny. Prague, 1888-1901, 17 volumes.<P>Pallas Nagy Lexikona. Budapest, 1893-97, 16 volumes; sup. 1900.<P>7. Dictionaries of Philosophy:<P>The dictionaries of philosophy often bear on Bible study almost as much as the religious dictionaries. Baldwin\'s Dictionary of Philosophy and Psychology, which is the most comprehensive work, is also very full in its bibliographical reference, and has in volumes III and IV a colossal bibliography of philosophy continued and kept up to date in the Psychological Index. The dictionary of Eisler is on the historical principle and of very great importance in interpreting the doctrines of Biblical theology.<P>DICTIONARIES OF PHILOSOPHY<P>Baldwin, J. M. Dictionary of Philosophy and Psychology, New York, 1901 and following.<P>Eisler, R. Philosophisches Worterbuch. Berlin,1904,2 volumes; new edition, 3 volumes.<P>Frank. Dictionnaire des sciences philosophiques. 3rd edition, 1885.<P>8. Dictionaries of Art and Music:<P>The dictionaries of architecture often treat of Egyptian, Babylonian, and sometimes Palestinian matters. The dictionaries of painting, engraving, music, etc., have less direct matter but are important and necessary in view of the fact that so large a part of the best work is on Biblical themes.<P>ART<P>Architectural Publication Society. Dictionary of Architecture. London, 1852-92, 6 volumes.<P>Bryan, Michael. Bryan\'s Dictionary of Painters and Engravers. New edition London: Bell, 1903-5, 5 volumes.<P>Champlin, John Denison, Jr. Cyclopedia of Painters and Painting. New York: Scribner, 1892 (circa 1885-87), 4 volumes.<P>Clement, Mrs. Clara Erskine Handbook of Christian Symbols.<P>Gwilt, Joseph. Encyclopedia of Architecture. New edition London: Longmans, 1888.<P>James, Ralph N. Painters and Their Works. London, 1896.<P>Muller, Hermann Alexander. Allgemeines Kunstlerlexicon. 3rd edition Frankfurt a. M., 1895-1901, 5 volumes.<P>Nagler, G. K. Neues allgemeines Kunstlerlexikon. 2. Aufl. Linz., 1904-7, volumes 1-10.<P>Seubert. Allgemeines Kunstlerlex. Frankfurt,1879,3 volumes.<P>Sturgis, Russell. Dictionary of Architecture and Building. New York: Macmillan,1901,3 volumes.<P>Thieme, Ulrich, and Becker, Felix. Allgemeines Lexikon der bildenden Kunstler. Leipzig, 1907.<P>Viollet-le-Duc, Eugene Emmanuel. Dictionnaire raisonne de l\'architecture. Paris,1868,10 volumes.<P>MUSIC<P>Baker, Theodore. Biographical Dictionary of Musicians. New York: Schirmer, 1900.<P>Champlin, John Denison, Jr. Cyclopedia of Music and Musicians. New York: Scribner, 1893.<P>Eitner, R. Biog-bibliog. Lexikon d. Musiker. Leipzig, 1900-4, 10 volumes.<P>Fetis, Frantsois Joseph. Biographie universelle des musiciens. 2nd edition Paris, 1860-66, 8 volumes; 2nd sup. 1875-81.<P>Grove, George. Dictionary of Music. London: 1878-89, 4 volumes and supplements, 2nd edition by J. A. Fuller Maitland, 1905.<P>Kornmuller. Lexikon der kirchlichen Tonkunst. 2nd edition Ratisbon, 1891-95, 2 volumes.<P>Mendel and Reissmann. Musikalisches Konversations-lexikon. Berlin, 1870-83, 12 volumes and supplements.<P>Riemann, Hugo. Musik-Lexikon. 4th edition, 1894.<p>———. Dictionary of Music. London (1899).<P>Many of these bear occasionally or indirectly on Biblical topics.<P>9. Dictionaries of Social Science:<P>SOCIAL SCIENCES<P>Birkmeyer. Encykl. der Rechtswissenschaft. Berlin, 1901.<P>Bliss, William Dwight Porter. New Encyclopedia of Social Reform. New York: Funk, 1908.<P>Bluntschli. Deutsches Staatsworterbuch. 1857-70, 2 volumes; new edition, 1869-74, 3 volumes.<P>Bruder. Staats-Lexikon of the Gorres Society. Freiburg i. Br., 1889-97, 5 volumes; 4th ed., edition Bachem, 1908-(Roman Catholic).<P>Buisson, F. Dictionnaire de pedagogie. Paris,1882,4 volumes.<P>Conrad, J. Handworterbuch der Staatswissenschaften. Jena, 1898 sq. 3rd edition to Vol XVIII (1911).<P>Conrad, Elster, Lexis and Loening. Handworterbuch der Staatswissenschaften. 1889-98, 6 volumes; 2 sup. volumes.<P>Cyclopaedia of Temperance and Prohibition. New York: Funk, 1891.<P>Elster. Worterbuch der Volkswirtschaft,1808,2 volumes; 2nd edition, 1907-.<P>Fay and Chailley. Nouveau dict. d\'economie politique. Paris: 1891-92, 2 volumes.<P>Holtzendorff, F. von. Encyk. der Rechtswissenschaft. 6th edition, 1903-.<P>Lalor, J. J. Cyclopaedia of Political Science. New York, 1889-90, 3 volumes.<P>Palgrave, R. H. I. Dictionary of Political Economy. London, 1894-96, 3 volumes.<P>Reichesberg. Handworterbuch der schweizer. Volkswirtschaft. 1901.<P>Rotteck and Welcker. Staatslex. Altona, 1835-44, 15 volumes; 3rd edition, 1856-66, 14 volumes.<P>Schmid, K. A. Encyclopadie d. Erziehungswesens. Gotha.<P>Sonnenschein, W. S. Cyclopaedia of Education, arr. and edition by A. W. Fletcher, Syracuse, 1899.<P>Wagener, H. Staats-und Gesellschafts-Lex. Berlin, 1859-68, 26 volumes.<P>10. Dictionaries of Geography:<P>The modern gazetteers are indispensable for identifications.<P>MODERN GAZETTEERS<P>Chisholm, George Goudie. Longmans\' Gazetteer of the World. London, 1902.<P>Hunter, W. W. Imperial Gazetteer of India. London,1881,9 volumes.<P>Lippincott\'s New Gazetteer. Philadelphia: Lippincott, 1906.<P>Ritter\'s geographisch-statistisches Lexikon. 9. umgearb. Aufl. Leipzig, 1905-6. 2 volumes.<P>Vivien de Saint Martin, Louis. Nouveau dictionnaire de geographie universelle. Paris, 1879-95, 7 volumes.<P>11. Biographical Dictionaries:<P>The great modern biographical dictionaries, although of little use for Scripture names, are of much value to the Biblical student for the writings on Biblical subjects, and in the case of ancient biography, of much value for contemporary persons in other lands.<P>MODERN BIOGRAPHY<P>Aa, Anton Jacobus van der. Biographisch Woorden-boek der Nederlander. Haarlem, 1876-78, 21 volumes.<P>Academie royale de Belgique. Biographie nationale. Bruxelles. 1866-1907, volumes 1-19.<P>Allgemeine deutsche Biographie. Leipzig: 1875-1906, 52 volumes.<P>Allgemeine deutsche Biographie. Leipzig: Duncker, 1875-1900, 45 volumes.<P>Allibone, S. A. A Critical Dictionary of English Literature. Philadelphia, 1870-72, 3 volumes; 1891, 2 volumes.<P>Appleton\'s Cyclopaedia of American Biography, edition by J. G. Wilson. New York: Appleton, 1888-1900, 7 volumes.<P>Biografiskt Lexikon ofver namnkunnige svenske Man. Stockholm,1874,23 volumes.<P>Biographisches Jahrbuch und deutscher Nekrolog. Berlin, 1897-1906, 9 volumes.<P>Bricka, Carl Frederik. Dansk biografisk Lexikon. 1887-1905, 19 volumes.<P>Century Cyclopedia of Names, edition by B. E. Smith. New York: Century Co. (circa 1894).<P>Dictionary of National Biography, edition by Leslie Stephen. London: Smith; New York: Macmillan, 1885-1900, 63 volumes.<P>Feller, F. X. de. Biographie universelle ou dictionnaire historique. Paris, 1847-50, 8 volumes in 4.<P>Giles, Herbert Allen. A Chinese Biographical Dictionary. London: Quaritch, 1898.<P>Glasius, B. Godeleerd Nederland. 1851-56, 3 volumes.<P>Hoefor, Ferdinand. Nouvelle biographie universelle. Paris: Didot, 1852-66, 46 volumes.<P>Hofberg, Herman. Svenskt biografiskt Handlexikon. Stockholm,1906,volumes 1-2.<P>Joecher, C. G. Allgemeines Gelehrten-Lexikon. Leipzig, 1750-51.<P>Lamb\'s Biographical Dictionary of the United States. Boston, 1900-1903, 7 volumes.<P>Michaud, Joseph Frantsois. Biographie universelle. Paris, 1842-65, 45 volumes.<P>National Cyclopaedia of American Biography. New York: White, 1892-1906, 13 volumes.<P>Schaff and Jackson. Encyclopedia of Living Divines and Christian Workers. New York, 1887.<P>Vapereau, L. G. Dictionnaire universel des litterateurs. Paris, 1876.<P>Vapereau. Dictionnaire des contemporains. Paris, 1858; 6th edition, 1893; supplements, 1895.<p>———. Dictionnaire des litterateurs. 1876; 2nd edition, 1884.<P>Wurzbach, C. von. Biographisches Lexikon Oesterreichs. 1856-91, 60 volumes.<p>———. Biographisches Lexikon des Kaiserthums Oesterreichs. Wien: Zamarski, 1856-91, 60 volumes.<P>12. Dictionaries of Language:<P>The lexicons of the Biblical languages and versions are treated under the head of the respective languages. The chief dictionaries in English are the great Murray and the encyclopaedic Century. The best one-vol dictionaries are perhaps the Standard and the last edition of Webster.<P>DICTIONARIES OF LANGUAGE<P>Brown, F., Driver, S. R., Briggs, C. A. A Hebrew and English Lexicon of the Old Testament. Boston, 1906.<P>Thayer, J. H. A Greek-English Lexicon of the New Testament. New York, 1887; corrected edition, 1889.<P>Century-Dictionary, an Encyclopedic Lexicon. New York: Century Co. (circa 1889-1901), 6 volumes.<P>Murray, James Augustus Henry. New English Dictionary on Historical Principles. Oxford: Clarendon Press, 1888-.<P>Standard Dictionary of the English Language. New York: Funk.<P>Stormonth\'s Dictionary of the English Language. New York: Scribner, 1899.<P>Webster, Noah. International Dictionary of the English Language. Springfield (Mass.), 1891 (circa 1864-90); new edition, 1909.<P>Worcester, Joseph Emerson. Dictionary of the English Language. New edition, enlarged Philadelphia: Lippincott, 1891.<P>The article, "Dictionary" in the new Encyclopedia Britannica (11th edition) (11th edition) covers the whole matter of dictionaries of language with extraordinary fullness.``147';

isbe[2693]='Didrachma`di-drak\'-ma: Two drachmas.` <a href="./study/isbe/search.html?string=DRACHMA,+DRAM">DRACHMA, DRAM</a>`1';
isbe[2694]='Didymus`did\'-i-mus (Didumos, i.e. "twin"): The surname of <a href="./study/isbe/search.html?string=THOMAS">THOMAS</a> (which see).``1';
isbe[2695]='Die`(muth, gawa\'; apothnesko, teleutao): "To die," etc., is of very frequent occurrence, and in the Old Testament is generally the translation of muth, meaning perhaps originally, "to be stretched out" or "prostrate." "To die," should be the consequence of eating the forbidden fruit (<a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a>; compare <a onClick="return mV(\'Gen\',20,7);">Ge 20:7</a>; <a onClick="return mV(\'2Ki\',1,4);">2Ki 1:4</a>, <a onClick="return mV(\'2Ki\',1,6);">6</a>). "Die" is commonly used of natural death (<a onClick="return mV(\'Gen\',5,8);">Ge 5:8</a>; <a onClick="return mV(\'Gen\',25,8);">25:8</a>). It is used also of violent death (<a onClick="return mV(\'Gen\',26,9);">Ge 26:9</a>, <a onClick="return mV(\'Gen\',26,11);">11</a>; <a onClick="return mV(\'Exd\',21,20);">Ex 21:20</a>); punitive (<a onClick="return mV(\'Exd\',19,12);">Ex 19:12</a>; <a onClick="return mV(\'Exd\',21,12);">21:12</a>, <a onClick="return mV(\'Exd\',21,14);">14</a>; <a onClick="return mV(\'Exd\',28,43);">28:43</a>; <a onClick="return mV(\'Num\',4,15);">Nu 4:15</a>; <a onClick="return mV(\'Eze\',3,1);">Eze 3:1:8</a>ff); as the result of willfulness or indifference (<a onClick="return mV(\'Pro\',10,21);">Pr 10:21</a>; <a onClick="return mV(\'Pro\',15,10);">15:10</a>; <a onClick="return mV(\'Pro\',19,16);">19:16</a>). To die "the death of the righteous" is something to be desired (<a onClick="return mV(\'Num\',23,10);">Nu 23:10</a>).<P>In the New Testament the word for "to die," etc., is generally apothnesko, "to die off or away," used of dying in all forms: of natural death (<a onClick="return mV(\'Mat\',22,24);">Mt 22:24</a>); of violent death (<a onClick="return mV(\'Jhn\',11,50);">Joh 11:50</a>, <a onClick="return mV(\'Jhn\',11,51);">51</a>; <a onClick="return mV(\'Jhn\',19,7);">19:7</a>; <a onClick="return mV(\'Act\',25,11);">Ac 25:11</a>); of the death of Christ (<a onClick="return mV(\'Jhn\',12,33);">Joh 12:33</a>); of death as the consequence of sin (<a onClick="return mV(\'Jhn\',8,21);">Joh 8:21</a>, <a onClick="return mV(\'Jhn\',8,24);">24</a>; <a onClick="return mV(\'Rom\',8,13);">Ro 8:13</a>); teleutao, "to end (life)," also occurs several times (<a onClick="return mV(\'Mat\',15,4);">Mt 15:4</a>); thnesko, "to die," occurs once (<a onClick="return mV(\'Jhn\',11,21);">Joh 11:21</a>), and apollumi, "to destroy" (<a onClick="return mV(\'Jhn\',18,14);">Joh 18:14</a>); in <a onClick="return mV(\'Act\',25,16);">Ac 25:16</a> (Textus Receptus) we have eis apoleian, "to destruction."<P>Figurative Use:<P>The figurative use of "to die" is not frequent, if indeed it ever occurs. In <a onClick="return mV(\'1Sa\',25,37);">1Sa 25:37</a> it may be equivalent to "faint," "His heart died within him, and he became as a stone," but this may be meant literally. In <a onClick="return mV(\'Amo\',2,2);">Am 2:2</a> it is said that Moab "shall die," i. e. perish as a nation. Paul describes the condition of the apostles of Christ as "dying, and behold, we live" (<a onClick="return mV(\'2Cr\',6,9);">2Co 6:9</a>), and says, "I die daily" (<a onClick="return mV(\'1Cr\',15,31);">1Co 15:31</a>), but the references may be to exposure to death. When in <a onClick="return mV(\'Rom\',7,9);">Ro 7:9</a> he says, "When the commandment came...I died," he may mean that it rendered him liable to death. In <a onClick="return mV(\'Rom\',6,2);">Ro 6:2</a> we have "we who died to sin," i.e. in Christ, and in our acceptance of His death as representing ours; similarly we read in <a onClick="return mV(\'2Cr\',5,14);">2Co 5:14</a>, "One died for all, therefore all died" (Revised Version (British and American)), i.e. representatively, and in <a onClick="return mV(\'Col\',2,20);">Col 2:20</a> "if ye died with Christ"; <a onClick="return mV(\'Col\',3,3);">3:3</a>, "for ye died," the Revised Version (British and American) (in Christ). Compare <a onClick="return mV(\'2Ti\',2,11);">2Ti 2:11</a>; <a onClick="return mV(\'1Pe\',2,24);">1Pe 2:24</a>. Of the changes in the Revised Version (British and American) may be mentioned "abode" for "died" (<a onClick="return mV(\'Gen\',25,18);">Ge 25:18</a>, margin "or settled, Hebrew fell"); "he that is to die" for "worthy of death" (<a onClick="return mV(\'Deu\',17,6);">De 17:6</a>); "died" for "are dead" (<a onClick="return mV(\'Jhn\',6,49);">Joh 6:49</a>, <a onClick="return mV(\'Jhn\',6,58);">58</a>, and the American Standard Revised Version <a onClick="return mV(\'Jhn\',8,52);">Joh 8:52</a>, <a onClick="return mV(\'Jhn\',8,53);">53</a>); "though he die" for "were dead" (<a onClick="return mV(\'Jhn\',11,25);">Joh 11:25</a>); "many died" for "were dead" (<a onClick="return mV(\'Rom\',5,15);">Ro 5:15</a>); "died for nought" for "in vain" (<a onClick="return mV(\'Gal\',2,21);">Ga 2:21</a>); "when his end was nigh" for "died" (<a onClick="return mV(\'Hbr\',11,22);">Heb 11:22</a>). Of special importance are the changes from "be, are, were, dead" in <a onClick="return mV(\'Rom\',6,2);">Ro 6:2</a>, <a onClick="return mV(\'Rom\',6,7);">7</a>, <a onClick="return mV(\'Rom\',6,8);">8</a>; <a onClick="return mV(\'2Cr\',5,14);">2Co 5:14</a>; <a onClick="return mV(\'Col\',2,20);">Col 2:20</a>; <a onClick="return mV(\'Col\',3,3);">3:3</a>; <a onClick="return mV(\'2Ti\',2,11);">2Ti 2:11</a>, and "having died" for "being dead" in <a onClick="return mV(\'1Pe\',2,24);">1Pe 2:24</a>, as bringing out the truth that in the sight of God all men died in Christ.` <a href="./study/isbe/search.html?string=DEATH">DEATH</a>`185';
isbe[2696]='Diet`di\'-et (\'aruchah, "prescribed"): A daily allowance or portion of food, as that given by King Evil-merodach to Jehoiachin, king of Judah (<a onClick="return mV(\'Jer\',52,34);">Jer 52:34</a> the King James Version; compare <a onClick="return mV(\'2Ki\',25,30);">2Ki 25:30</a>).``1';
isbe[2697]='Dig`(qur, "to dig", chathar; diorusso, "to dig through"): "I have digged (dug) and drunk strange waters" (<a onClick="return mV(\'2Ki\',19,24);">2Ki 19:24</a>). In his campaigns on foreign soil, where the enemy had stopped up the watersprings, Sennacherib would at once dig fresh wells for his armies. "They dig through houses" (<a onClick="return mV(\'Job\',24,16);">Job 24:16</a>; <a onClick="return mV(\'Mat\',6,19);">Mt 6:19</a>, <a onClick="return mV(\'Mat\',6,20);">20</a> margin). Walls of eastern houses are often made of mud or clay, and frequently have no windows; and as the threshold of a Syrian house is sacred, the thief breaks in through the wall (see Trumbull, The Threshold Covenant).``91';
isbe[2698]='Dignities; Dignity`dig\'-ni-tiz, dig\'-ni-ti (Hebrew marom, se\'eth, gedhullah): Rank or position, not nobility or austerity of personal character or bearing, is denoted by this word in its Old Testament occurrences (<a onClick="return mV(\'Gen\',49,3);">Ge 49:3</a>; <a onClick="return mV(\'Est\',6,3);">Es 6:3</a>; <a onClick="return mV(\'Ecc\',10,6);">Ec 10:6</a>; <a onClick="return mV(\'Hab\',1,7);">Hab 1:7</a>). In <a onClick="return mV(\'2Pe\',2,10);">2Pe 2:10</a>; <a onClick="return mV(\'Jud\',1,8);">Jude 1:8</a>, "dignities" (doxai) are angels, lofty spiritual beings, possible objects of blasphemy; compare the context in both passages.``1';
isbe[2699]='Dike`di\'-ke (dike, "justice"): The avenging justice of God personified as a goddess (<a onClick="return mV(\'Act\',28,4);">Ac 28:4</a>).` <a href="./study/isbe/search.html?string=JUSTICE">JUSTICE</a>`1';
isbe[2700]='Diklah`dik\'la (diklah "place of palms"): One of the "sons" of Joktan (<a onClick="return mV(\'Gen\',10,27);">Gen 10:27</a>; <a onClick="return mV(\'1Ch\',1,21);">1Ch 1:21</a>). Perhaps a south-Arabian tribal or place-name connected with the palm-bearing district.``1';
