isbe[2667]='Determine`de-tur\'-min:<P>(1) "To resolve," "decide." This is the primary meaning of the word and it is also the one that is the most common. In the New Testament the Greek word krino, is translated "determine," and it has the above meaning (<a onClick="return mV(\'Act\',20,16);">Ac 20:16</a>; <a onClick="return mV(\'Act\',25,25);">25:25</a>; <a onClick="return mV(\'1Cr\',2,2);">1Co 2:2</a>). The word occurs frequently in the Old Testament with this meaning (see <a onClick="return mV(\'Exd\',21,22);">Ex 21:22</a>; <a onClick="return mV(\'1Sa\',20,7,9,33);">1Sa 20:7, 9, 33</a>).<P>(2) "To decree," "ordain," "mark out." The Greek word that is rendered "determine" with this meaning is horizo.<P>The Hebrew term charats is translated "determine" with the above meaning; as "his days are determined" (<a onClick="return mV(\'Job\',14,5);">Job 14:5</a>); "a destruction is determined" (<a onClick="return mV(\'Isa\',10,22);">Isa 10:22</a>); "desolations are determined" (<a onClick="return mV(\'Dan\',9,26);">Da 9:26</a>). The Hebrew term mishpaT, which means "judgment" or "sentence," is translated "determination" in <a onClick="return mV(\'Zep\',3,8);">Ze 3:8</a>.` <a href="./study/isbe/search.html?string=DETERMINATE">DETERMINATE</a>`62';
isbe[2668]='Detestable, Things`de-tes\'-ta-b\'-l, (shiqquts; sheqets, synonymous with to\'ebhah, "abomination," "abominable thing"): The translation of shiqqutsim in <a onClick="return mV(\'Jer\',16,18);">Jer 16:18</a>; <a onClick="return mV(\'Eze\',5,11);">Eze 5:11</a>; <a onClick="return mV(\'Eze\',7,20);">7:20</a>; <a onClick="return mV(\'Eze\',11,18,21);">11:18, 21</a>; <a onClick="return mV(\'Eze\',37,23);">37:23</a>; a term always applied to idol-worship or to objects connected with idolatry; often also translated "abomination," as in <a onClick="return mV(\'1Ki\',11,5,7);">1Ki 11:5, 7</a> (bis); <a onClick="return mV(\'Jer\',4,1);">Jer 4:1</a>; <a onClick="return mV(\'Eze\',20,7,8,30);">Eze 20:7-8, 30</a>. Sheqets, translated "abomination," is applied in the Scriptures to that which is ceremonially unclean (<a onClick="return mV(\'Lev\',7,21);">Le 7:21</a>), creatures forbidden as food, as water animals without fins or scales in <a onClick="return mV(\'Lev\',11,\'10-12\');">Le 11:10-12</a>, birds of prey and the like (verse <a onClick="return mV(\'Lev\',11,18);">18</a>), winged creeping things (verses <a onClick="return mV(\'Lev\',11,20,23);">20, 23</a>), creeping vermin (verses <a onClick="return mV(\'Lev\',11,41);">41</a>f). Compare also <a onClick="return mV(\'Isa\',66,17);">Isa 66:17</a>. By partaking of the food of the animals in question one makes himself detestable (<a onClick="return mV(\'Lev\',11,43);">Le 11:43</a>; <a onClick="return mV(\'Lev\',20,25);">20:25</a>). Similarly the idolatrous appurtenances are to be held in detestation; nothing of the kind should be appropriated for private use (<a onClick="return mV(\'Deu\',7,26);">De 7:26</a>).` <a href="./study/isbe/search.html?string=ABOMINATION">ABOMINATION</a>`115';
isbe[2669]='Deuel`du\'-el, de-u\'-el de\'u\'el, ("knowledge of God"): A Gadite, the father of Eliasaph, the representative of the tribe of Gad in the census-taking (<a onClick="return mV(\'Num\',1,14);">Nu 1:14</a>), in making the offering of the tribe at the dedication of the altar (<a onClick="return mV(\'Num\',7,42,47);">Nu 7:42, 47</a>), and as leader of the host of the tribe of the children of Gad in the wilderness (<a onClick="return mV(\'Num\',10,20);">Nu 10:20</a>). Called Reuel in <a onClick="return mV(\'Num\',2,14);">Nu 2:14</a>, daleth (d) being confused with resh (r).``1';
isbe[2670]='Deutero-Canonical, Books`du-ter-o-ka-non\'-i-kal: A term sometimes used to designate certain books, which by the Council of Trent were included in the Old Testament, but which the Protestant churches designated as apocryphal (see <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>), and also certain books of the New Testament which for a long time were not accepted by the whole church as Scripture. Webster says the term pertains to "a second Canon or ecclesiastical writing of inferior authority," and the history of these books shows that they were all at times regarded by a part of the church as being inferior to the others and some of them are so regarded today. This second Canon includes Tobit, Judith, Wisdom, Ecclusiasticus, 2Esdras, 1Maccabees and 2Maccabees of the Old Testament, and Hebrews, James, 2 Peter, 2 John, 3 John, Jude, and Revelation of the New Testament.<P>1. The Old Testament Books:<P>The Old Testament books under consideration were not in the Hebrew Canon and they were originally designated as apocryphal. The Septuagint contained many of the apocrphyal books, and among these were most of those which we have designated deutero-canonical. The Septuagint was perhaps the Greek Bible of New Testament times and it continued to be the Old Testament of the early church, and hence, these books were widely distributed. It seems, however, that they did not continue to hold their place along with the other books, for Athanasius, bishop of Alexandria, in his Festal Epistle in 367 gave a list of the books of the Bible which were to be read, and at the close of this list he said: "There are also other books besides these, not canonized, yet set by the Fathers to be read to those who have just come up and who wish to be informed as to the word of godliness: Wisdom, Sirach, Esther, Judith, Tobit, the so-called Teaching of the Apes, and the Shepherd of Hermas." Jerome also made a distinction between the apocryphal books and the others. In his Preface, after enumerating the books contained in the Hebrew Canon, he adds: "This prologue I write as a preface to the books to be translated by us from the Hebrew into Latin, that we may know that all the books which are not of this number are apocrphyal; therefore Wisdom, which is commonly ascribed to Solomon as its author, and the book of Jesus the son of Sirach, Judith, Tobit and the Shepher are not in the Canon." Rufinus made the same distinction as did Jerome. He declared that "these books are not canonical, but have been called by our forefathers ecclesiastical." Augustine included these books in his list which he published in 397. He begins the list thus: "The entire canon of Scripture is comprised in these books." Then follows a list of the books which includes Tobit, Judith, 1Maccabees, 2Maccabees, 2Esdras, Wisdom and Ecclesiasticus, and it closes with these words: "In these 44 books is comprised all the authority of the Old Testament." Inasmuch as these books were regarded by the church at large as ecclesiastical and helpful, and Augustine had given them canonical sanction, they rapidly gained in favor and most of them are found in the great manuscripts.<P>2. The New Testament Books:<P>It is not probable that there was any general council of the church in those early centuries that set apart the various books of the New Testament and canonized them as Scripture for the whole church. There was no single historical event which brought together the New Testament books which were everywhere to be regarded as Scripture. These books did not make the same progress in the various provinces and churches. A careful study of conditions reveals the fact that there was no uniform New Testament canon in the church during at least the first 3 centuries. The Ethiopic church, for example, had 35 books in its New Testament, while the Syrian church had only 22 books.<P>From an early date the churches were practically agreed on those books which are sometimes designated as the protocanonical, and which Eusebius designated as the homologoumena. They differed, however, in regard to the 7 disputed books which form a part of the so-called deutero-canon, and which Eusebius designated as the antilegomena. They also differed in regard to other ecclesiastical writings, for there was no fixed line between canonical and non-canonical books. While there was perhaps no council of the church that had passed on the books and declared them canonical, it is undoubtedly true that before the close of the 2nd century all the books that are in our New Testament, with the exception of those under consideration, had become recognized as Scripture in all orthodox churches.<P>The history of these seven books reveals the fact that although some of them were early used by the Fathers, they afterward fell into disfavor. That is especially true of Hebrews and Revelation. Generally speaking, it can be said that at the close of the 2nd century the 7 books under consideration had failed to receive any such general recognition as had the rest; however, all, with perhaps the exception of 2 Peter, had been used by some of the Fathers. He was freely attested by Clement of Rome and Justin Martyr; James by Hermas and probably by Clement of Rome; 2 John, 3 John and Jude by the Muratorian Fragment; Revelation by Hermas and Justin Martyr who names John as its author.<P>See <a href="./study/isbe/search.html?string=CANON+OF+THE+NEW+TESTAMENT">CANON OF THE NEW TESTAMENT</a>.<P>Jerome, who prepared the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) in the closing years of the 4th century, accepted all 7 of the doubtful books, yet he held that 2 John and 3 John were written by the Presbyter, and he intimated that 2 Peter and Jude were still rejected by some, and he said the Latins did not receive He among the canonical Scriptures, neither did the Greek churches receive Augustine, who was one of the great leaders during the last part of the 4th century and the first part of the 5th, accepted without question the 7 disputed books. These books had gradually gained in favor and the position of Jerome and Augustine practically settled their canonicity for the orthodox churches. The Council of Carthage, held in 397, adopted the catalogue of Augustine. This catalogue contained all the disputed books both of the New Testament and the Old Testament.<P>Since the Reformation.<P>The Canon of Augustine became the Canon of the majority of the churches and the Old Testament books which he accepted were added to the Vulgate, but there were some who still held to the Canon of Jerome. The awakening of the Reformation inevitably led to a reinvestigation of the Canon, since the Bible was made the source of authority, and some of the disputed books of the New Testament were again questioned by the Reformers. The position given the Bible by the Reformers led the Roman church to reaffirm its sanction and definitely to fix the books that should be accepted. Accordingly the Council of Trent, which convened in 1546, made the Canon of Augustine, which included the 7 apocphyal books of the Old Testament, and the 7 disputed books of the New Testament, the Canon of the church, and it pronounced a curse upon those who did not receive these books. The Protestants at first followed the example of Rome and adopted these books which had long had the sanction of usage as their Bible. Gradually, however, the questioned books of the Old Testament were separated from the others. That was true in Coverdale\'s translation, and in Matthew\'s Bible they were not only separated from the others but they were prefaced with the words, "the volume of the book called Hagiographa." In Cranmer\'s Bible, Hagiographa was changed into Apocrypha, and this passed through the succeeding edition into the King James Version.` <a href="./study/isbe/search.html?string=CANON+OF+THE+OLD+TESTAMENT">CANON OF THE OLD TESTAMENT</a>`62';
isbe[2671]='Deuteronomy`du-ter-on\'-o-mi:<p>1. Name<p>2. What Deuteronomy Is<p>3. Analysis<p>4. Ruling Ideas<p>5. Unity<p>6. Authorship<p>7. Deuteronomy Spoken Twice<p>8. Deuteronomy\'s Influence in Israel\'s History<p>9. The Critical Theory<p>LITERATURE<hr /><p>1. Name:<p>In Hebrew \'elleh ha-debharim, "these are the words"; in Greek, Deuteronomion, "second law"; whence the Latin deuteronomii, and the English Deuteronomy. The Greek title is due to a mistranslation by the Septuagint of the clause in <a onClick="return mV(\'Deu\',17,18);">De 17:18</a> rendered, "and he shall write for himself this repetition of the law." The Hebrew really means "and he shall write out for himself a copy of this law." However, the error on which the English title rests is not serious, as Deuteronomy is in a very true sense a repetition of the law.<p>2. What Deuteronomy Is:<p>Deuteronomy is the last of the five books of the Pentateuch, or "five-fifths of the Law." It possesses an individuality and impressiveness of its own. In Exodus—Numbers Yahweh is represented as speaking unto Moses, whereas in Deuteronomy, Moses is represented as speaking at Yahweh\'s command to Israel (<a onClick="return mV(\'Deu\',1,\'1-4\');">De 1:1-4</a>; <a onClick="return mV(\'Deu\',5,1);">5:1</a>; <a onClick="return mV(\'Deu\',29,1);">29:1</a>). It is a hortatory recapitulation of various addresses delivered at various times and places in the desert wanderings—a sort of homily on the constitution, the essence or gist of Moses\' instructions to Israel during the forty years of their desert experience. It is "a Book of Reviews"; a translation of Israel\'s redemptive history into living principles; not so much a history as a commentary. There is much of retrospect in it, but its main outlook is forward. The rabbins speak of it as "the Book of Reproofs." It is the text of all prophecy; a manual of evangelical oratory; possessing "all the warmth of a Bernard, the flaming zeal of a Savonarola, and the tender, gracious sympathy of a Francis of Assisi." The author\'s interest is entirely moral. His one supreme purpose is to arouse Israel\'s loyalty to Yahweh and to His revealed law. Taken as a whole the book is an exposition of the great commandment, "Thou shalt love Yahweh thy God with all thy heart, and with all thy soul, and with all thy might." It was from Deuteronomy that Jesus summarized the whole of the Old Covenant in a single sentence (<a onClick="return mV(\'Mat\',22,37);">Mt 22:37</a>; compare <a onClick="return mV(\'Deu\',6,5);">De 6:5</a>), and from it He drew His weapons with which to vanquish the tempter (<a onClick="return mV(\'Mat\',4,4,7,10);">Mt 4:4, 7, 10</a>; compare <a onClick="return mV(\'Deu\',8,3);">De 8:3</a>; <a onClick="return mV(\'Deu\',6,16);">6:16</a>; <a onClick="return mV(\'Deu\',6,13);">Deu 6:13</a>).<p>3. Analysis:<p>Deuteronomy is composed of three discourses, followed by three short appendices:<p>(1) <span class="noTag">De 1:1-4:43</span>, historical; a review of God\'s dealings with Israel, specifying in great detail where and when delivered (<a onClick="return mV(\'Deu\',1,\'1-5\');">De 1:1-5</a>), recounting in broad oratorical outlines the chief events in the nation\'s experience from Horeb to Moab (<span class="noTag">De 1:6-3:29</span>), on which the author bases an earnest appeal to the people to be faithful and obedient, and in particular to keep clear of all possible idolatry (<a onClick="return mV(\'Deu\',4,\'1-40\');">De 4:1-40</a>). Appended to this first discourse is a brief note (<a onClick="return mV(\'Deu\',4,\'41-43\');">De 4:41-43</a>) concerning Moses\' appointment of three cities of refuge on the east side of the Jordan.<p>(2) <span class="noTag">De 4:44-26:19</span>, hortatory and legal; introduced by a superscription (<a onClick="return mV(\'Deu\',4,\'44-49\');">De 4:44-49</a>), and consisting of a resume of Israel\'s moral and civil statutes, testimonies and judgments. Analyzed in greater detail, this second discourse is composed of two main sections:<p>(a) chapters 5-11, an extended exposition of the Ten Commandments on which theocracy was based;<p>(b) chapters 12-26, a code of special statutes concerning worship, purity, tithes, the three annual feasts, the administration of justice, kings, priests, prophets, war, and the private and social life of the people. The spirit of this discourse is most ethical and religious. The tone is that of a father no less than that of a legislator. A spirit of humanity pervades the entire discourse. Holiness is its ideal.<p>(3) <span class="noTag">De 27:1-31:30</span>, predictive and minatory; the subject of this third discourse being "the blessings of obedience and the curses of disobedience." This section begins with directions to inscribe these laws on plastered stones to be set up on Mt. Ebal (<a onClick="return mV(\'Deu\',27,\'1-10\');">De 27:1-10</a>), to be ratified by an antiphonal ritual of blessings and cursings from the two adjacent mountains, Gerizim and Ebal (<a onClick="return mV(\'Deu\',27,\'11-26\');">De 27:11-26</a>). These are followed by solemn warnings against disobedience (<a onClick="return mV(\'Deu\',28,\'1-\');">De 28:1</a> - <a onClick="return mV(\'Deu\',29,1);">29:1</a>), and fresh exhortations to accept the terms of the new covenant made in Moab, and to choose between life and death (<a onClick="return mV(\'Deu\',29,\'2-\');">De 29:2</a> - <a onClick="return mV(\'Deu\',30,\'1-20\');">30:20</a>). Moses\' farewell charge to Israel and his formal commission of Joshua close the discourse (<a onClick="return mV(\'Deu\',31,\'1-\');">De 31</a>). The section is filled with predictions, which were woefully verified in Israel\'s later history. The three appendices, spoken of above, close the book:<p>(a) Moses\' Song (<a onClick="return mV(\'Deu\',32,\'1-\');">De 32</a>), which the great Lawgiver taught the people (the Law was given to the priests, <a onClick="return mV(\'Deu\',31,\'24-27\');">De 31:24-27</a>);<p>(b) Moses\' Blessing (<a onClick="return mV(\'Deu\',33,\'1-\');">De 33</a>), which forecast the future for the various tribes (Simeon only being omitted);<p>(c) A brief account of Moses\' death and burial (<a onClick="return mV(\'Deu\',34,\'1-\');">De 34</a>) with a noble panegyric on him as the greatest prophet Israel ever had. Thus closes this majestic and marvelously interesting and practical book. Its keyword is "possess"; its central thought is "Yahweh has chosen Israel, let Israel choose Yahweh."<p>4. Ruling Ideas:<p>The great central thought of Deuteronomy is the unique relation which Yahweh as a unique God sustains to Israel as a unique people. "Hear O Israel; Yahweh our God is one Yahweh." The monotheism of Deuteronomy is very explicit. Following from this, as a necessary corollary almost, is the other great teaching of the book, the unity of the sanctuary. The motto of the book might be said to be, "One God, one sanctuary."<p>(1) Yahweh, a Unique God.<p>Yahweh is the only God, "There is none else besides him" (<a onClick="return mV(\'Deu\',4,35,39);">De 4:35, 39</a>; <a onClick="return mV(\'Deu\',6,4);">6:4</a>; <a onClick="return mV(\'Deu\',32,39);">32:39</a>), "He is God of gods, and Lord of lords" (<a onClick="return mV(\'Deu\',10,17);">De 10:17</a>), "the living God" (<a onClick="return mV(\'Deu\',5,26);">De 5:26</a>), "the faithful God, who keepeth covenant and lovingkindness with them that love him and keep his commandments" (<a onClick="return mV(\'Deu\',7,9);">7:9</a>), who abominates graven images and every species of idolatry (<a onClick="return mV(\'Deu\',7,25,26);">De 7:25-26</a>; <a onClick="return mV(\'Deu\',12,31);">12:31</a>; <a onClick="return mV(\'Deu\',13,14);">13:14</a>; <a onClick="return mV(\'Deu\',18,12);">18:12</a>; <a onClick="return mV(\'Deu\',20,18);">20:18</a>; <a onClick="return mV(\'Deu\',27,15);">27:15</a>), to whom belong the heavens and the earth (<a onClick="return mV(\'Deu\',10,14);">De 10:14</a>), who rules over all the nations (<a onClick="return mV(\'Deu\',7,19);">De 7:19</a>), whose relation to Israel is near and personal (<a onClick="return mV(\'Deu\',28,58);">De 28:58</a>), even that of a Father (<a onClick="return mV(\'Deu\',32,6);">De 32:6</a>), whose being is spiritual (<a onClick="return mV(\'Deu\',4,12,15);">De 4:12, 15</a>), and whose name is "Rock" (<a onClick="return mV(\'Deu\',32,4,15,18,30,31);">De 32:4, 15, 18, 30-31</a>). Being such a God, He is jealous of all rivals (<a onClick="return mV(\'Deu\',7,4);">De 7:4</a>; <a onClick="return mV(\'Deu\',29,\'24-26\');">29:24-26</a>; <a onClick="return mV(\'Deu\',31,16,17);">31:16-17</a>), and hence, all temptations to idolatry must be utterly removed from the land, the Canaanites must be completely exterminated and all their altars, pillars, Asherim and images destroyed (<a onClick="return mV(\'Deu\',7,\'1-5\',16);">De 7:1-5, 16</a>; <a onClick="return mV(\'Deu\',20,\'16-18\');">20:16-18</a>; <a onClick="return mV(\'Deu\',12,2,3);">12:2-3</a>).<p>(2) Israel, a Unique People.<p>The old Israel had become unique through the covenant which Yahweh made with them at Horeb, creating out of them "a kingdom of priests, and a holy nation" (<a onClick="return mV(\'Exd\',19,6);">Ex 19:6</a>). The new Israel who had been born in the desert were to inherit the blessings vouchsafed to their fathers, through the covenant just now being made in Moab (<a onClick="return mV(\'Deu\',26,\'16-19\');">De 26:16-19</a>; <a onClick="return mV(\'Deu\',27,9);">27:9</a>; <a onClick="return mV(\'Deu\',29,1);">29:1</a>; <a onClick="return mV(\'Deu\',5,2,3);">5:2-3</a>). By means of it they became the heirs of all the promises given unto their fathers the patriarchs (<a onClick="return mV(\'Deu\',4,31);">De 4:31</a>; <a onClick="return mV(\'Deu\',7,12);">7:12</a>; <a onClick="return mV(\'Deu\',8,18);">8:18</a>; <a onClick="return mV(\'Deu\',29,13);">29:13</a>); they too became holy and peculiar, and especially beloved of Yahweh (<a onClick="return mV(\'Deu\',7,6);">De 7:6</a>; <a onClick="return mV(\'Deu\',14,2,21);">14:2, 21</a>; <a onClick="return mV(\'Deu\',26,18,19);">26:18, 19</a>; <a onClick="return mV(\'Deu\',28,9);">28:9</a>; <a onClick="return mV(\'Deu\',4,37);">4:37</a>), disciplined, indeed, but for their own good (<a onClick="return mV(\'Deu\',8,2,3,5,16);">De 8:2-3, 5, 16</a>), to be established as a people, as Yahweh\'s peculiar lot and inheritance (<a onClick="return mV(\'Deu\',32,6,9);">De 32:6, 9</a>; <a onClick="return mV(\'Deu\',4,7);">4:7</a>).<p>(3) The Relation between Yahweh and Israel a Unique Relation.<p>Other nations feared their deities; Israel was expected not only to fear Yahweh but to love Him and cleave to Him (<a onClick="return mV(\'Deu\',4,10);">De 4:10</a>; <a onClick="return mV(\'Deu\',5,29);">5:29</a>; <a onClick="return mV(\'Deu\',6,5);">6:5</a>; <a onClick="return mV(\'Deu\',10,12,20);">10:12, 20</a>; <a onClick="return mV(\'Deu\',11,1,13,22);">11:1, 13, 22</a>; <a onClick="return mV(\'Deu\',13,3,4);">13:3-4</a>; <a onClick="return mV(\'Deu\',17,19);">17:19</a>; <a onClick="return mV(\'Deu\',19,9);">19:9</a>; <a onClick="return mV(\'Deu\',28,58);">28:58</a>; <a onClick="return mV(\'Deu\',30,6,16,20);">30:6, 16, 20</a>; <a onClick="return mV(\'Deu\',31,12,13);">31:12-13</a>). The highest privileges are theirs because they are partakers of the covenant blessings; all others are strangers and foreigners, except they be admitted into Israel by special permission (<a onClick="return mV(\'Deu\',23,\'1-8\');">De 23:1-8</a>).<p>5. Unity:<p>The essential unity of the great kernel of Deuteronomy (<span class="noTag">De 5-26</span>) is recognized and freely allowed by nearly everyone (e. g. Kautzsch, Kuenen, Dillmann, Driver). Some would even defend the unity of the whole of <span class="noTag">De 1-26</span> (Knobel, Graf, Kosters, Colenso, Kleinert). No other book of the Old Testament, unless it be the prophecies of Ezekiel, bears such unmistakable signs of unity in aim, language and thought. "The literary style of Deuteronomy," says Driver, "is very marked and individual; in his command of a chaste, yet warm and persuasive eloquence, the author of Deuteronomy stands unique among the writers of the OT" (Deuteronomy, lxxvii, lxxxviii). Many striking expressions characterize the style of this wonderful book of oratory: e. g. "cause to inherit"; "Hear O Israel"; the oft-repeated root, meaning in the Qal verb-species "learn," and in the Piel verb-species "teach"; "be willing"; "so shalt thou exterminate the evil from thy midst"; "as at this day"; "that it may be well with thee"; "the land whither thou goest in to possess it"; "with all thy heart and with all thy soul"; and many others, all of which occur frequently in Deuteronomy and rarely elsewhere in the Old Testament, thus binding, so far as style can, the different sections of the book into one solid unit. Barring various titles and editorial additions (<a onClick="return mV(\'Deu\',1,\'1-5\');">De 1:1-5</a>; <a onClick="return mV(\'Deu\',4,\'44-49\');">4:44-49</a>; <a onClick="return mV(\'Deu\',29,1);">29:1</a>; <a onClick="return mV(\'Deu\',33,1,7,9,22);">33:1, 7, 9, 22</a>; <a onClick="return mV(\'Deu\',34,1);">34:1</a>) and a few archaeological notes such as <a onClick="return mV(\'Deu\',2,\'10-12\',\'20-23\');">De 2:10-12, 20-23</a>; <a onClick="return mV(\'Deu\',3,9,11,14);">3:9, 11, 14</a>; <a onClick="return mV(\'Deu\',10,\'6-9\');">10:6-9</a>, and of course the last chapter, which gives an account of Moses\' death, there is every reason necessary for supposing that the book is a unit. Few writings in the entire field of literature have so clear a unity of purpose or so uniform a style of address.<p>6. Authorship:<p>There is one passage bearing upon the authorship of Deuteronomy wherein it is stated most explicitly that Moses wrote "this law." It reads, "And Moses wrote this law, and delivered it unto the priests the sons of Levi....And it came to pass, when Moses had made an end of writing the words of this law in a book, until they were finished (i.e. to the end), that Moses commanded the Levites, that bare the ark of the covenant of Yahweh, saying, Take this book of the law, and put it by the side of the ark of the covenant of Yahweh your God, that it may be there for a witness against thee" (<a onClick="return mV(\'Deu\',31,9,\'24-27\');">De 31:9, 24-27</a>). This passage is of more than traditional value, and should not be ignored as is so often done (e. g. by Ryle, article "Deuteronomy," HDB). It is not enough to say that Moses was the great fountain-head of Hebrew law, that he gave oral but not written statutes, or, that Moses was only the traditional source of these statutes. For it is distinctly and emphatically stated that "Moses wrote this law." And it is further declared (<a onClick="return mV(\'Deu\',31,22);">De 31:22</a>) that "Moses wrote this song," contained in <a onClick="return mV(\'Deu\',32,\'1-\');">De 32</a>. Now, these statements are either true, or they are false. There is no escape. The authorship of no other book in the Old Testament is so explicitly emphasized. The present writer believes that Moses actually wrote the great body of Deuteronomy, and for the following general reasons:<p>(1) Deuteronomy as a Whole Is Eminently Appropriate to What We Know of Moses\' Times.<p>It closes most fittingly the formative period of Israel\'s history. The historical situation from first to last is that of Moses. The references to foreign neighbors—Egypt, Canaan, Amalek, Ammon, Moab, Edom—are in every case to those who flourished in Moses\' own times. As a law book its teaching is based upon the Ten Commandments. If Moses gave the Ten Commandments, then surely he may have written the Book of Deuteronomy also. Besides, the Code of Hammurabi, which antedates Moses by at least 700 years, makes it possible certainly that Moses also left laws in codified or written form.<p>(2) Deuteronomy Is Represented as Emanating from Moses.<p>The language is language put into Moses\' mouth. Nearly forty times his name occurs, and in the majority of instances as the authoritative author of the subject-matter. The first person is used predominatingly throughout: "I commanded Joshua at that time" (<a onClick="return mV(\'Deu\',3,21);">De 3:21</a>); and "I charged your judges at that time" (<a onClick="return mV(\'Deu\',1,16);">1:16</a>); "And I commanded you at that time" (<a onClick="return mV(\'Deu\',1,18);">De 1:18</a>); "I have led you forty years in the wilderness" (<a onClick="return mV(\'Deu\',29,5);">De 29:5</a>). "The language surely purports to come from Moses; and if it was not actually used by him, it is a most remarkable case of impersonation, if not of literary forgery, for the writer represents himself as reproducing, not what Moses might have said, but the exact words of Moses" (Zerbe, The Antiquity of Hebrew Writing and Lit., 1911, 261).<p>(3) Deuteronomy Is a Military Law Book, a Code of Conquest, a Book of Exhortation.<p>It was intended primarily neither for Israel in the desert nor for Israel settled in Canaan, but for Israel on the borderland, eager for conquest. It is expressly stated that Moses taught Israel these statutes and judgments in order that they should obey them in the land which they were about to enter (<a onClick="return mV(\'Deu\',4,5,14);">De 4:5, 14</a>; <a onClick="return mV(\'Deu\',5,31);">5:31</a>). They must expel the aborigines (<a onClick="return mV(\'Deu\',7,1);">De 7:1</a>; <a onClick="return mV(\'Deu\',9,\'1-3\');">9:1-3</a>; <a onClick="return mV(\'Deu\',20,17);">20:17</a>; <a onClick="return mV(\'Deu\',31,3);">31:3</a>), but in their warfare they must observe certain laws in keeping with theocracy (<a onClick="return mV(\'Deu\',20,\'1-20\');">De 20:1-20</a>; <a onClick="return mV(\'Deu\',23,\'9-14\');">23:9-14</a>; <a onClick="return mV(\'Deu\',21,\'10-14\');">21:10-14</a>; <a onClick="return mV(\'Deu\',31,6,7);">31:6-7</a>), and, when they have finally dispossessed their enemies, they must settle down to agricultural life and live no longer as nomads but as citizens of a civilized land (<a onClick="return mV(\'Deu\',19,14);">De 19:14</a>; <a onClick="return mV(\'Deu\',22,\'8-10\');">22:8-10</a>; <a onClick="return mV(\'Deu\',24,\'19-21\');">24:19-21</a>). All these laws are regulations which should become binding in the future only (compare Kittel, History Of the Hebrews, I, 32). Coupled with them are prophetic exhortations which seem to be genuine, and to have had their birth in Moses\' soul. Indeed the great outstanding feature of Deuteronomy is its parenetic or hortatory character. Its exhortations have not only a military ring as though written on the eve of battle, but again and again warn Israel against allowing themselves to be conquered in religion through the seductions of idolatry. The book in short is the message of one who is interested in Israel\'s political and religious future. There is a paternal vein running throughout it which marks it with a genuine Mosaic, not a merely fictitious or artificial, stamp. It is these general features, so characteristic of the entire book, which compel one to believe in its Mosaic authorship.<p>7. Deuteronomy Spoken Twice:<p>Certain literary features exist in Deuteronomy which lead the present writer to think that the bulk of the book was spoken twice; once, to the first generation between Horeb and Kadesh-barnea in the 2nd year of the Exodus wanderings, and a second time to the new generation, in the plains of Moab in the 40th year. Several considerations point in this direction:<p>(1) The Names of the Widely Separated Geographical Places Mentioned in the Title (<a onClick="return mV(\'Deu\',1,1,2);">De 1:1-2</a>).<p>"These are the words which Moses spake unto all Israel beyond the Jordan in the wilderness, in the Arabah over against Suph, between Paran, and Tophel, and Laban, and Hazeroth, and Di-zahab"; to which is added, "It is eleven days\' journey from Horeb by the way of Mount Seir unto Kadesh-barnea." If these statements have any relevancy whatever to the contents of the book which they introduce, they point to a wide area, from Horeb to Moab, as the historico-geographical background of the book. In other words, Deuteronomy, in part at least, seems to have been spoken first on the way between Horeb and Kadesh-barnea, and later again when Israel were encamped on the plains of Moab. And, indeed, what would be more natural than for Moses when marching northward from Horeb expecting to enter Canaan from the south, to exhort the Israel of that day in terms of <span class="noTag">De 5-26</span>? Being baffled, however, by the adverse report of the spies and the faithlessness of the people, and being forced to wait and wander for 38 years, what would be more natural than for Moses in Moab, when about to resign his position as leader, to repeat the exhortations of <span class="noTag">De 5-26</span>, adapting them to the needs of the new desert-trained generation and prefacing the whole by a historical introduction such as that found in <span class="noTag">De 1-4</span>?<p>(2) The Double Allusion to the Cities of Refuge (<a onClick="return mV(\'Deu\',4,\'41-43\');">De 4:41-43</a>; <a onClick="return mV(\'Deu\',19,\'1-13\');">19:1-13</a>).<p>On the supposition that <span class="noTag">De 5-26</span> were spoken first between Horeb and Kadesh-barnea, in the 2nd year of the Exodus, it could not be expected that in this section the names of the three cities chosen east of the Jordan should be given, and in fact they are not (<a onClick="return mV(\'Deu\',19,\'1-13\');">De 19:1-13</a>); the territory of Sihon and Og had not yet been conquered and the cities of refuge, accordingly, had not yet been designated (compare <a onClick="return mV(\'Num\',35,2);">Nu 35:2:14</a>). But in <a onClick="return mV(\'Deu\',4,\'41-43\');">De 4:41-43</a>, on the contrary, which forms a part of the historical introduction, which ex hypothesi was delivered just at the end of the 39 years\' wanderings, after Sihon and Og had been subdued and their territory divided, the three cities of refuge east of the Jordan are actually named, just as might be expected.<p>(3) Section <a onClick="return mV(\'Deu\',4,\'44-49\');">De 4:44-49</a>.<p>The section <a onClick="return mV(\'Deu\',4,\'44-49\');">De 4:44-49</a>, which, in its original form, very probably introduced chapters 5-26 before these chapters were adapted to the new situation in Moab.<p>(4) The Phrase "Began Moses to Declare This Law" (<a onClick="return mV(\'Deu\',1,5);">De 1:5</a>).<p>The phrase "began Moses to declare this law" (<a onClick="return mV(\'Deu\',1,5);">De 1:5</a>), suggesting that the great lawgiver found it necessary to expound what he had delivered at some previous time. The Hebrew word translated "to declare" is found elsewhere in the Old Testament only in <a onClick="return mV(\'Deu\',27,8);">De 27:8</a> and in <a onClick="return mV(\'Hab\',2,2);">Hab 2:2</a>, and signifies "to make plain."<p>(5) The Author\'s Evident Attempt to Identify the New Generation in Moab with the Patriarchs.<p>"Yahweh made not this covenant with our fathers, but with us, even us, who are all of us here alive this day," i.e. with us who have survived the desert discipline (<a onClick="return mV(\'Deu\',5,3);">De 5:3</a>). In view of these facts, we conclude that the book in its present form (barring the exceptions above mentioned) is the product of the whole 39 years of desert experience from Horeb on, adapted, however, to meet the exigencies of the Israelites as they stood between the victories already won on the east of the Jordan and those anticipated on the west. The impression given throughout is that the aged lawgiver\'s work is done, and that a new era in the people\'s history is about to begin.<p>8. Deuteronomy\'s Influence in Israel\'s History:<p>The influence of Deuteronomy began to be felt from the very beginning of Israel\'s career in Canaan. Though the references to Deuteronomy in Joshua, Judges, Samuel and Kings are comparatively few, yet they are sufficient to show that not only the principles of Deuteronomy were known and observed but that they were known in written form as codified statutes. For example, when Jericho was taken, the city and its spoil were "devoted" (<a onClick="return mV(\'Jos\',6,17,18);">Jos 6:17-18</a>) in keeping with <a onClick="return mV(\'Deu\',13,15);">De 13:15</a>ff (compare <a onClick="return mV(\'Jos\',10,40);">Jos 10:40</a>; <a onClick="return mV(\'Jos\',11,12,15);">11:12, 15</a> with <a onClick="return mV(\'Deu\',7,2);">De 7:2</a>; <a onClick="return mV(\'Deu\',20,16,17);">20:16-17</a>). Achan trespassed and he and his household were stoned, and afterward burned with fire (<a onClick="return mV(\'Jos\',7,25);">Jos 7:25</a>; compare <a onClick="return mV(\'Deu\',13,10);">De 13:10</a>; <a onClick="return mV(\'Deu\',17,5);">17:5</a>). The fact that his sons and his daughters were put to death with him seems at first sight to contradict <a onClick="return mV(\'Deu\',24,16);">De 24:16</a>, but there is no proof that they suffered for their father\'s sin (see <a href="./study/isbe/search.html?string=ACHAN">ACHAN</a>; <a href="./study/isbe/search.html?string=ACHOR">ACHOR</a>); besides the Hebrews recognized the unity of the household, even that of Rahab the harlot (<a onClick="return mV(\'Jos\',6,17);">Jos 6:17</a>). Again when Ai was taken, "only the cattle and the spoil" did Israel take for a prey unto themselves (<a onClick="return mV(\'Jos\',8,27);">Jos 8:27</a>), in keeping with <a onClick="return mV(\'Deu\',20,14);">De 20:14</a>; also, the body of the king of Ai was taken down before nightfall from the tree on which he had been hanged (<a onClick="return mV(\'Jos\',8,29);">Jos 8:29</a>), which was in keeping with <a onClick="return mV(\'Deu\',21,23);">De 21:23</a> (compare <a onClick="return mV(\'Jos\',10,26,27);">Jos 10:26-27</a>). As in warfare, so in worship. For instance, Joshua built an altar on Mt. Ebal (<a onClick="return mV(\'Jos\',8,30,31);">Jos 8:30-31</a>), "as Moses the servant of Yahweh commanded" (<a onClick="return mV(\'Deu\',27,\'4-6\');">De 27:4-6</a>), and he wrote on them a copy of the law (<a onClick="return mV(\'Jos\',8,32);">Jos 8:32</a>), as Moses had also enjoined (<a onClick="return mV(\'Deu\',27,3,8);">De 27:3, 8</a>). Moreover, the elders and officers and judges stood on either side of the ark of the covenant between Ebal and Gerizim (<a onClick="return mV(\'Jos\',8,33);">Jos 8:33</a>), as directed in <a onClick="return mV(\'Deu\',11,29);">De 11:29</a>; <a onClick="return mV(\'Deu\',27,12,13);">27:12-13</a>, and Joshua read to all the congregation of Israel all the words of the law, the blessings and the cursings (<a onClick="return mV(\'Jos\',8,34,35);">Jos 8:34-35</a>), in strict accord with <a onClick="return mV(\'Deu\',31,11,12);">De 31:11-12</a>.<p>But the passage of paramount importance is the story of the two and a half tribes who, on their return to their home on the east side of the Jordan, erected a memorial at the Jordan, and, when accused by their fellow-tribesmen of plurality of sanctuary, emphatically disavowed it (<a onClick="return mV(\'Jos\',22,29);">Jos 22:29</a>; compare <a onClick="return mV(\'Deu\',12,5);">De 12:5</a>). Obviously, therefore, Deuteronomy was known in the days of Joshua. A very few instances in the history of the Judges point in the same direction: e. g. the utter destruction of Zephath (<a onClick="return mV(\'Jdg\',1,17);">Jud 1:17</a>; compare <a onClick="return mV(\'Deu\',7,2);">De 7:2</a>; <a onClick="return mV(\'Deu\',20,16);">20:16</a>f); Gideon\'s elimination of the fearful and faint-hearted from his army (<a onClick="return mV(\'Jdg\',7,\'1-7\');">Jud 7:1-7</a>; compare <a onClick="return mV(\'Deu\',20,\'1-9\');">De 20:1-9</a>); the author\'s studied concern to justify Gideon and Manoah for sacrificing at altars other than at Shiloh on the ground that they acted in obedience to Yahweh\'s direct commands (<a onClick="return mV(\'Jdg\',6,\'25-27\');">Jud 6:25-27</a>; <a onClick="return mV(\'Jdg\',13,16);">13:16</a>); especially the case of Micah, who congratulated himself that Yahweh would do him good seeing he had a Levite for a priest, is clear evidence that Deuteronomy was known in the days of the Judges (<a onClick="return mV(\'Jdg\',17,13);">Jud 17:13</a>; compare <a onClick="return mV(\'Deu\',10,8);">De 10:8</a>; <a onClick="return mV(\'Deu\',18,\'1-8\');">18:1-8</a>; <a onClick="return mV(\'Deu\',33,\'8-11\');">33:8-11</a>). In <a onClick="return mV(\'1Sa\',1,\'1-9\',21,24);">1Sa 1:1-9, 21, 24</a> the pious Elkanah is pictured as going yearly to worship Yahweh at Shiloh, the central sanctuary at that time. After the destruction of Shiloh, when the ark of the covenant had been captured by the Philistines, Samuel indeed sacrificed at Mizpah, Ramah and Bethlehem (<a onClick="return mV(\'1Sa\',7,\'7-9\',17);">1Sa 7:7-9, 17</a>; <a onClick="return mV(\'1Sa\',16,5);">16:5</a>), but in doing so he only took advantage of the elasticity of the Deuteronomic law: "When...he giveth you rest from all your enemies round about, so that ye dwell in safety; then it shall come to pass that to the place which Yahweh your God shall choose, to cause his name to dwell there, thither shall ye bring all that I command you: your burnt-offerings, and your sacrifices" (<a onClick="return mV(\'Deu\',12,10,11);">De 12:10-11</a>). It was not until Solomon\'s time that Israel\'s enemies were all subdued, and even then Solomon did not observe strictly the teachings of Deuteronomy; "His wives turned away his heart," so that he did not faithfully keep Yahweh\'s "covenant" and "statutes" (<a onClick="return mV(\'1Ki\',11,3,11);">1Ki 11:3, 11</a>). Political disruption followed, and religion necessarily suffered. Yet Jehoiada the priest gave the youthful Joash "the crown" and "the testimony" (<a onClick="return mV(\'2Ki\',11,12);">2Ki 11:12</a>; compare <a onClick="return mV(\'Deu\',17,18);">De 17:18</a>). King Amaziah did not slay the children of the murderers who slew his father, in conscious obedience apparently to the law of Deuteronomy (<a onClick="return mV(\'2Ki\',14,6);">2Ki 14:6</a>; compare <a onClick="return mV(\'Deu\',24,16);">De 24:16</a>). Later on, Hezekiah, the cultured king of Judah, reformed the cult of his day by removing the high places, breaking down the pillars, cutting down the Asherahs, and even breaking in pieces the brazen serpent which Moses had made (<a onClick="return mV(\'2Ki\',18,4,22);">2Ki 18:4, 22</a>). Hezekiah\'s reforms were unquestionably carried through under the influence of Deuteronomy.<p>It is equally certain that the prophets of the 8th century were not ignorant of this book. For example, Hosea complains of Israel\'s sacrificing upon the tops of the mountains and burning incense upon the hills, and warns Judah not to follow Israel\'s example in coming up to worship at Gilgal and Beth-aven (<a onClick="return mV(\'Hsa\',4,13,15);">Ho 4:13, 15</a>). He also alludes to striving with priests (<a onClick="return mV(\'Hsa\',4,4);">Ho 4:4</a>; compare <a onClick="return mV(\'Deu\',17,12);">De 17:12</a>), removing landmarks (<a onClick="return mV(\'Hsa\',5,10);">Ho 5:10</a>; compare <a onClick="return mV(\'Deu\',19,14);">De 19:14</a>), returning to Egypt (<a onClick="return mV(\'Hsa\',8,13);">Ho 8:13</a>; <a onClick="return mV(\'Hsa\',9,3);">9:3</a>; compare <a onClick="return mV(\'Deu\',28,68);">De 28:68</a>), and of Yahweh\'s tender dealing with Ephraim (<a onClick="return mV(\'Hsa\',11,3);">Ho 11:3</a>; compare <a onClick="return mV(\'Deu\',1,31);">De 1:31</a>; <a onClick="return mV(\'Deu\',32,10);">32:10</a>). The courage of Amos, the shepherd-prophet of Tekoa, can best be explained, also, on the basis of a written law such as that of Deuteronomy with which he and his hearers were already more or less familiar (<a onClick="return mV(\'Amo\',3,2);">Am 3:2</a>; compare <a onClick="return mV(\'Deu\',7,6);">De 7:6</a>; <a onClick="return mV(\'Deu\',4,7,8);">4:7-8</a>). He condemns Israel\'s inhumanity and adultery in the name of religion, and complains of their retaining overnight pledges wrested from the poor, which was distinctly forbidden in Deuteronomy (<a onClick="return mV(\'Amo\',2,\'6-8\');">Am 2:6-8</a>; compare <a onClick="return mV(\'Deu\',24,\'12-15\');">De 24:12-15</a>; <a onClick="return mV(\'Deu\',23,17);">23:17</a>). Likewise, in the prophecies of Isaiah there are conscious reflections of Deuteronomy\'s thought and teaching. Zion is constantly pictured as the center of the nation\'s religion and as Yahweh\'s secure dwellingplace (<a onClick="return mV(\'Isa\',2,\'2-4\');">Isa 2:2-4</a>; <a onClick="return mV(\'Isa\',8,18);">8:18</a>; <a onClick="return mV(\'Isa\',28,16);">28:16</a>; <a onClick="return mV(\'Isa\',29,1,2);">29:1-2</a>; compare <a onClick="return mV(\'Mic\',4,\'1-4\');">Mic 4:1-4</a>). In short, no one of the four great prophets of the 8th century BC—Isaiah, Micah, Amos, Hosea—ever recognized "high places" as legitimate centers of worship.<p>9. The Critical Theory:<p>Over against the Biblical view, certain modern critics since De Wette (1805) advocate a late origin of Deuteronomy, claiming that it was first published in 621 BC, when Hilkiah found "the book of the law" in the temple in the 18th year of King Josiah (<a onClick="return mV(\'2Ki\',22,8);">2Ki 22:8</a>ff). The kernel of Deuteronomy and "the book of the law" discovered by Hilkiah are said to be identical. Thus, Dr. G. A. Smith claims that "a code like the Book of Deuteronomy was not brought forth at a stroke, but was the expression of the gradual results of the age-long working of the Spirit of the Living God in the hearts of His people" (Jerusalem, II, 115). According to Dr. Driver, "Deuteronomy may be described as the prophetic reformulation and adaptation to new needs, of an older legislation." It is probable that there was a tradition, if not a written record, of a final legislative address delivered by Moses in the steppes of Moab: the plan followed by the author would rest upon a more obvious motive, if he thus worked upon a traditional basis. But be that as it may, the bulk of the laws contained in Deuteronomy is undoubtedly far more ancient than the author himself.<p>...." What is essentially new in Deuteronomy is not the matter, but the form....The new element in Deuteronomy is thus not the laws, but their parenetic setting" (Deuteronomy, lxi, lvi). This refined presentation of the matter would not be so very objectionable, were Drs. Smith and Driver\'s theory not linked up with certain other claims and allegations to the effect that Moses in the 15th century BC could not possibly have promulgated such a lofty monotheism, that in theological teaching "the author of Deuteronomy is the spiritual heir of Hosea," that there are discrepancies between it and other parts of the Pentateuch, that in the early history of Israel down to the 8th century plurality of sanctuaries was legally permissible, that there are no traces of the influence of the principal teachings of a written Deuteronomy discoverable in Hebrew literature until the time of Jeremiah, and that the book as we possess it was originally composed as a program of reform, not by Moses but in the name of Moses as a forgery or pseudepigraph. For example, F. H. Woods says, "Although not a necessary result of accepting the later date, the majority of critics believe this book of the law to have been the result of a pious fraud promulgated by Hilkiah and Shaphan with the retention of deceiving Josiah into the belief that the reforms which they desired were the express command of God revealed to Moses" (HDB, II, 368). Some are unwilling to go so far. But in any case, it is claimed that the law book discovered and published by Hilkiah, which brought about the reformation by Josiah in 621 BC, was no other than some portion of the Book of Deuteronomy, and of Deuteronomy alone. But there are several considerations which are opposed to this theory:<p>(1) Deuteronomy emphasizes centralization of worship at one sanctuary (<a onClick="return mV(\'Deu\',12,5);">12:5</a>); Josiah\'s reformation was directed rather against idolatry in general (<a onClick="return mV(\'2Ki\',23,4);">2Ki 23:4</a>ff).<p>(2) In <a onClick="return mV(\'Deu\',18,\'6-8\');">De 18:6-8</a>, a Levite coming from the country to Jerusalem was allowed to minister and share in the priestly perquisites; but in <a onClick="return mV(\'2Ki\',23,9);">2Ki 23:9</a>, "the priests of the high places came not up to the altar of Yahweh in Jerusalem, but they did eat unleavened bread among their brethren." And according to the critical theory, "Levites" and "priests" are interchangeable terms.<p>(3) The following passages in Exodus might almost equally with Deuteronomy account for Josiah\'s reformation: <a onClick="return mV(\'Exd\',20,3);">Ex 20:3</a>; <a onClick="return mV(\'Exd\',22,18,20);">22:18, 20</a>; <a onClick="return mV(\'Exd\',23,13,14,32,33);">23:13-14, 32-33</a>; <a onClick="return mV(\'Exd\',34,\'13-17\');">34:13-17</a>.<p>(4) The law book discovered by Hilkiah was recognized at once as an ancient code which the fathers had disobeyed (<a onClick="return mV(\'2Ki\',22,13);">2Ki 22:13</a>). Were they all deceived? Even Jeremiah (compare <a onClick="return mV(\'Jer\',11,3,4);">Jer 11:3-4</a>)? "There were many persons in Judah who had powerful motives for exposing this forgery if it was one" (Raven, Old Testament Introduction, 112).<p>(5) One wonders why so many archaic and, in Josiah\'s time, apparently obsolete laws should have been incorporated in a code whose expre (<a onClick="return mV(\'Deu\',7,18,22);">De 7:18, 22</a>), and to blot out Amalek (<a onClick="return mV(\'Deu\',25,\'17-19\');">De 25:17-19</a>), the last remnants of whom were completely destroyed in Hezekiah\'s time (<a onClick="return mV(\'1Ch\',4,\'41-43\');">1Ch 4:41-43</a>). Especially is this true of the score and more of laws peculiar to Deuteronomy, concerning building battlements on the roofs of houses (<a onClick="return mV(\'Deu\',22,8);">De 22:8</a>), robbing birds\' nests (<a onClick="return mV(\'Deu\',22,6,7);">De 22:6-7</a>), the sexes exchanging garments (<a onClick="return mV(\'Deu\',22,5);">De 22:5</a>), going out to war (<a onClick="return mV(\'Deu\',20,1);">De 20:1</a>ff), etc.<p>(6) Especially remarkable is it that if Deuteronomy were written, as alleged, shortly before the reign of Josiah, there should be no anachronisms in it betraying a post-Mosaic origin. There are no allusions to the schism between Judah and Israel, no hint of Assyrian oppression through the exaction of tribute, nor any threats of Israel\'s exile either to Assyria or Babylonia, but rather to Egypt (<a onClick="return mV(\'Deu\',28,68);">De 28:68</a>). "Jerusalem" is never mentioned. From a literary point of view, it is psychologically and historically well-nigh impossible for a writer to conceal all traces of his age and circumstances. On the other hand, no Egyptologist has ever discovered any anachronisms in Deuteronomy touching Egyptian matters. From first to last the author depicts the actual situation of the times of Moses. It is consequently hard to believe, as is alleged, that a later writer is studying to give "an imaginative revivification of the past."<p>(7) The chief argument in favor of Deuteronomy\'s late origin is its alleged teaching concerning the unity of the sanctuary. Wellhausen lays special emphasis upon this point. Prior to Josiah\'s reformation, it is claimed, plurality of sanctuaries was allowed. But in opposition to this, it is possible to point victoriously to Hezekiah\'s reformation (<a onClick="return mV(\'2Ki\',18,4,22);">2Ki 18:4, 22</a>), as a movement in the direction of unity; and especially to <a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a>, which is so frequently misinterpreted as allowing a multiplicity of sanctuaries. This classical passage when correctly interpreted allows only that altars shall be erected in every place where Yahweh records His name, "which presumably during the wanderings and the time of the judges would mean wherever the Tabernacle was" (Mackay, Introduction to Old Testament, 110). This interpretation of this passage is confirmed and made practically certain, indeed, by the command in <a onClick="return mV(\'Exd\',23,\'14-19\');">Ex 23:14-19</a> that Israel shall repair three times each year to the house of Yahweh and there present their offering. On the other hand, Deuteronomy\'s emphasis upon unity of sanctuary is often exaggerated. The Book of Deuteronomy requires unity only after Israel\'s enemies are all overcome (<a onClick="return mV(\'Deu\',12,10,11);">De 12:10-11</a>). "When" Yahweh giveth them rest, "then" they shall repair for worship to the place which "God shall choose." As Davidson remarks: "It is not a law that is to come into effect on their entry into Canaan; it is to be observed from the time that Yahweh shall have given them rest from all their enemies round about; that is, from the times of David, or more particularly, Solomon; for only when the temple was built did that place become known which Yahweh had chosen to place His name there" (Old Testament Theology, 361). Besides, it should not be forgotten that in Deuteronomy itself the command is given to build an altar in Mt. Ebal (<a onClick="return mV(\'Deu\',27,\'5-7\');">De 27:5-7</a>). As a matter of fact, the unity of sanctuary follows as a necessary consequence of monotheism; and if Moses taught monotheism, he probably also enjoined unity of worship. If, on the other hand, monotheism was first evolved by the prophets of the 8th century, then, of course, unity of sanctuary was of 8th-century origin also.<p>(8) Another argument advanced in favor of the later origin of Deuteronomy is the contradiction between the laws of Deuteronomy and those of Lev-Nu concerning the priests and Levites. In <a onClick="return mV(\'Num\',16,10,35,40);">Nu 16:10, 35, 40</a>, a sharp distinction is drawn, it is alleged, between the priests and common Levites, whereas in <a onClick="return mV(\'Deu\',18,\'1-8\');">De 18:1-8</a>, all priests are Levites and all Levites are priests. But as a matter of fact, the passage in Deuteronomy does not invest a Levite with priestly but with Levitical functions (compare <a onClick="return mV(\'Deu\',18,7);">De 18:7</a>). "The point insisted upon is that all Levites shall receive full recognition at the sanctuary and be accorded their prerogatives. It goes without saying that if the Levite be a priest he shall serve and fare like his brethren the priests; if he be not a priest, he shall enjoy the privileges that belong to his brethren who are Levites, but not priests" (J. D. Davis, article "Deuteronomy," in Smith, Dictionary of the Bible, 117). The Book of Deuteronomy teaches not that all the tribe, but only the tribe of Levi may exercise priestly functions, thus restricting the exercise of priestly prerogatives to one and only one tribe. This was in perfect harmony with Lev-Nu and also in keeping with the style of popular discourse.<p>(9) Recently Professor Ed. Naville, the Egyptologist, has propounded a theory of the origin of "the Book of the Law" discovered by Hilkiah, which is not without some value. On the analogy of the Egyptian custom of burying texts of portions of "the Book of the Dead" at the foot of statues of gods and within foundations of temple walls, as at Hermopolis, he concludes that Solomon, when he constructed the Temple, probably deposited this "Book of the Law" in the foundations, and that when Josiah\'s workmen were about their tasks of repairing the edifice, the long-forgotten document came to light and was given to Hilkiah the priest. Hilkiah, however, upon examination of the document found it difficult to read, and so, calling for Shaphan the scribe, who was more expert in deciphering antique letters than himself, he gave the sacred roll to him, and he in turn read it to both Hilkiah and the king. The manuscript may indeed have been written in cuneiform. Thus, according to Naville, "the Book of the Law," which he identifies with Deuteronomy, must be pushed back as far as the age of Solomon at the very latest. Geden shares a similar view as to its date: "some time during the prosperous period of David and the United Monarchy" (Intro to the Hebrew Bible,1909,330).<p>But why not ascribe the book to the traditional author? Surely there can be no philosophical objection to doing so, in view of the now-known Code of Hammurabi, which antedates Moses by so many hundreds of years! No other age accounts so well for its origin as that of the great lawgiver who claims to have written the bulk of it. And the history of the disintegration of the book only shows to what extremes a false method may lead; for example, Steuernagel separates the "Thou" and "Ye" sections from each other and assigns them to different authors of late date: Kennett, on the other hand, assigns the earliest strata to the period of the Exile (Jour. of Theol. Studies, 1904), On the whole, no theory is so satisfactory as that which, in keeping with <a onClick="return mV(\'Deu\',31,22,24);">De 31:22, 24</a>, ascribes to Moses the great bulk of the book. See also <a href="./study/isbe/search.html?string=CRITICISM">CRITICISM</a>; <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>.<p>LITERATURE.<p>On the conservative side: James Orr, The Problem of the Old Testament, The Bross Prize, 1906; article "Deuteronomy," Illustrated Bible Dict., 1908; James Robertson, The Early Religion of Israel, 1892; article "Deuteronomy," The Temple Bible Dict., 1910; John D. Davis, article "Deuteronomy," Davis\' Dict. of the Bible, 1911; John H. Raven, Old Testament Intro, 1906; A. S. Geden, Introduction to the Hebrew Bible, 1909; W. Moller, Are the Critics Right? 1903; R. B. Girdlestone, The Student\'s Deuteronomy, 1899; Hugh Pope, The Date of the Composition of Deuteronomy, 1911; A. S. Zerbe, The Antiquity of Hebrew Writing and Lit., 1911; Ed. Naville, The Discovery of the Book of the Law under King Josiah, 1911; E. C. Bissell, The Pentateuch: Its Origin and Structure, 1885; G. L. Robinson, The Expositor, "The Genesis of Deuteronomy," October and November,1898,February, March, May, 1899; W. H. Green, Moses and the Prophets, 1891; The Higher Criticism of the Pentateuch, 1895; A. M. Mackay, The Churchman\'s Introduction to the Old Testament, 1901; J. W. Beardslee, Outlines of an Introduction to the Old Testament, 1903; G. Vos, The Mosaic Origin of the Pentateuchal Codes, 1886.<p>On the other side: S. R. Driver, A Crit. and Exeg. Commentary on Deuteronomy, 1895; The Hexateuch, by J. Estlin Carpenter and G. Harford-Battersby, I, II, 1900; G. A. Smith, Jerusalem, II, 1908; W. Robertson Smith, The Old Testament in the Jewish Church, 1895; A. Kuenen, The Hexateuch, 1886; H. E. Ryle, article "Deuteronomy," HDB, 1898; G. F. Moore, article "Deuteronomy," Encyclopedia Bibl., 1899; J. A. Paterson, article "Deuteronomy," Encyclopedia Brit, VIII, 1910.<p>In German: De Wette, Dissert. crit-exeget., 1805; Kleinert, Das De u. d. Deuteronomiker, 1872; Wellhausen, Die Comp. des Hexateuch. u. d. hist. Bucher des Altes Testament, 1889; Gesch. Israels, 1895; Steuernagel, Der Rahmen des Deuteronomy, 1894; Entsteh. des dt. Gesetzes, 1896.``152';
isbe[2672]='Device`de-vis\':"A scheme," "invention," "plot." In the Old Testament it stands for six Hebrew words, of which the most common is machashebheth (from chashabh, "to think," "contrive"). In the New Testament it occurs only twice, once for Greek enthumesis (<a onClick="return mV(\'Act\',17,29);">Ac 17:29</a>), and once for noema (<a onClick="return mV(\'2Cr\',2,11);">2Co 2:11</a>). Sometimes the word means simply that which is planned or invented, without any evil implication, as in <a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a>; <a onClick="return mV(\'Act\',17,29);">Ac 17:29</a> (of artistic work or invention), and <a onClick="return mV(\'Ecc\',9,10);">Ec 9:10</a> (in the general sense of reasoning or contriving). But more frequently it is used in an evil sense, of a wicked purpose or plot, "Let us devise devices against Jeremiah" (<a onClick="return mV(\'Jer\',18,18);">Jer 18:18</a>); "For we are not ignorant of his (i.e. Satan\'s) devices" (<a onClick="return mV(\'2Cr\',2,11);">2Co 2:11</a>), etc.``49';isbe[2673]='Devil`dev\'-\'-l.` <a href="./study/isbe/search.html?string=DEMON">DEMON</a>; <a href="./study/isbe/search.html?string=SATAN">SATAN</a>`1';

isbe[2675]='Devotion; Devotions`de-vo\'-shun, (sebasmata): For the King James Version "your devotions" (<a onClick="return mV(\'Act\',17,23);">Ac 17:23</a>), the Revised Version (British and American) has "the objects of your worship," which is probably the intended meaning of the King James Version. the Revised Version (British and American) reads "devotion" for the King James Version "prayer" in <a onClick="return mV(\'Job\',15,4);">Job 15:4</a> (the Revised Version, margin "meditation," Hebrew siach).``1';
isbe[2676]='Devout`de-vout\' (eulabes, eusebes, sebomai, "pious," "dutiful," "reverential"): The word is peculiar to Luke. Applied to Simeon (<a onClick="return mV(\'Luk\',2,25);">Lu 2:25</a>), Cornelius (<a onClick="return mV(\'Act\',10,2);">Ac 10:2</a>, <a onClick="return mV(\'Act\',10,7);">7</a>), Ananias (<a onClick="return mV(\'Act\',22,12);">Ac 22:12</a>). "Devout proselytes" (<a onClick="return mV(\'Act\',13,43);">Ac 13:43</a>, the King James Version "religious proselytes"), with possible reference to the proselytes of righteousness as distinguished from the proselytes of the gate (see <a href="./study/isbe/search.html?string=PROSELYTE">PROSELYTE</a>). "Devout women of honorable estate" (<a onClick="return mV(\'Act\',13,50);">Ac 13:50</a>), proselytes to Judaism and wives of the men in high position among the heathen (see Josephus, BJ, II, xx, 2). "Devout Greeks" (<a onClick="return mV(\'Act\',17,4);">Ac 17:4</a>), probably, though not necessarily, proselytes of the gate, heathen by birth, who attended the synagogue services and worshipped God. "Devout persons" (<a onClick="return mV(\'Act\',17,17);">Ac 17:17</a>), proselytes of the gate.``91';
isbe[2677]='Dew`du (Tal; drosos).<P>1. Formation of Dew:<P>Two things are necessary for the formation of dew, moisture and cold. In moist countries there is less dew because the change in temperature between day and night is too small. In the deserts where the change in temperature between day and night is sometimes as much as 40 degrees F., there is seldom dew because of lack of moisture in the atmosphere. Palestine is fortunate in being near the sea, so that there is always a large percentage of water vapor in the air. The skies are clear, and hence, there is rapid radiation beginning immediately after sunset, which cools the land and the air until the moisture is condensed and settles on cool objects. Air at a low temperature is not capable of holding as much water vapor in suspension as warm air. The ice pitcher furnishes an example of the formation of dew. Just as the drops of water form on the cool pitcher, so dew forms on rocks, grass and trees.<P>2. Value of Dew in Palestine:<P>In Palestine it does not rain from April to October, and were it not for the dew in summer all vegetation would perish. Dew and rain are equally important. If there is no rain the winter grass and harvests fail; if no dew, the late crops dry up and there is no fruit. Failure of either of these gifts of Nature would cause great want and hardship, but the failure of both would cause famine and death. Even on the edge of the great Syrian desert in Anti-Lebanon, beyond Jordan and in Sinai, a considerable vegetation of a certain kind flourishes in the summer, although there is not a drop of rain for six months. The dews are so heavy that the plants and trees are literally soaked with water at night, and they absorb sufficient moisture to more than supply the loss due to evaporation in the day. It is more surprising to one who has not seen it before to find a flourishing vineyard practically in the desert itself. Some of the small animals of the desert, such as the jerboa, seem to have no water supply except the dew. The dew forms most heavily on good conductors of heat, such as metals and stones, because they radiate their heat faster and cool the air around them. The wetting of Gideon\'s fleece (<a onClick="return mV(\'Jdg\',6,38);">Jud 6:38</a>) is an indication of the amount of dew formed, and the same phenomenon might be observed any clear night in summer in Palestine<P>3. Importance to Israel:<P>Dew was a present necessity to the people of Israel as it is today to the people of the same lands, so Yahweh says, "I will be as the dew unto Israel" (<a onClick="return mV(\'Hsa\',14,5);">Ho 14:5</a>). Dew and rain are of equal importance and are spoken of together in <a onClick="return mV(\'1Ki\',17,1);">1Ki 17:1</a>. It was especially valued by the children of Israel in the desert, for it supplied the manna for their sustenance (<a onClick="return mV(\'Exd\',16,13);">Ex 16:13</a>; <a onClick="return mV(\'Num\',11,9);">Nu 11:9</a>).<P>4. Symbol of Blessing:<P>Isaac in blessing Jacob asked that the "dew of heaven" (<a onClick="return mV(\'Gen\',27,28);">Ge 27:28</a>) may be granted to him; that these things which make for fertility and prosperity may be his portion. "The remnant of Jacob shall be in the midst of many peoples as dew from Yahweh" (<a onClick="return mV(\'Mic\',5,7);">Mic 5:7</a>), as a means of blessing to the nations. "Blessed of Yahweh for...dew" (<a onClick="return mV(\'Deu\',33,13);">De 33:13</a>).<P>5. Symbol of Refreshment:<P>Dew is the means of refreshing and reinvigorating all vegetation. Many Scripture references carry out this idea. The Song of Moses says, "My speech shall distill as the dew" (<a onClick="return mV(\'Deu\',32,2);">De 32:2</a>). "A cloud of dew" (<a onClick="return mV(\'Isa\',18,4);">Isa 18:4</a>) refreshes the harvesters. "My head is filled with dew" (<a onClick="return mV(\'Sgs\',5,2);">So 5:2</a>). "Like the dew of Hermon" (<a onClick="return mV(\'Psa\',133,3);">Ps 133:3</a>). "Thou hast the dew of thy youth" (<a onClick="return mV(\'Psa\',110,3);">Ps 110:3</a>). "Thy dew is as the dew of herbs" (<a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a>). Job said of the time of his prosperity, "The dew lieth all night upon my branch" (<a onClick="return mV(\'Job\',29,19);">Job 29:19</a>).<P>Other figures use dew as the symbol of stealth, of that which comes up unawares (<a onClick="return mV(\'2Sa\',17,12);">2Sa 17:12</a>), and of inconstancy (<a onClick="return mV(\'Hsa\',6,4);">Ho 6:4</a>; <a onClick="return mV(\'Hsa\',13,3);">13:3</a>). God\'s knowledge covers the whole realm of the phenomena of Nature which are mysteries to man (<a onClick="return mV(\'Job\',38,28);">Job 38:28</a>; <a onClick="return mV(\'Pro\',3,20);">Pr 3:20</a>).``85';
isbe[2678]='Di-Zahab`di\'-za-hab, diz\'-a-hab di-za-habh; Septuagint Katachrusea, (literally, "abounding in gold"):<P>The name occurs in a list apparently intended to fix definitely the situation of the camp of Israel in the plains of Moab (<a onClick="return mV(\'Deu\',1,1);">De 1:1</a>). No place in the region has been found with a name suggesting this; and there is no other clue to its identification. Some names in the list are like those of stations earlier in the wanderings. Thinking that one of these may be intended Burckhardt suggested Mina edh-Dhahab, a boat harbor between Ras Mohammad and \'Aqaba. Cheyne gets over the difficulty by accepting a suggestion of Sayee that Di-zahab corresponds to Me-zahab (<a onClick="return mV(\'Gen\',36,39);">Ge 36:39</a>); this latter he then transforms into Mitzraim, and identifies it with the North Arabian Mucri (Encyclopedia Biblica, under the word). The changes, however, seem greater than can be justified.``54';
isbe[2679]='Diadem`di\'-a-dem: There are seven Bible references to the diadem, four in the Old Testament and three in the New Testament. The Hebrew words do not mark any clear distinctions.<P>(1) tsaniph, tsanoph, tsaniphah (all from tsanaph, primarily "to wrap," "dress," "roll") mean a headdress in the nature of a turban or piece of cloth wrapped or twisted about the head. The word is also rendered "hood," "mitre." <a onClick="return mV(\'Job\',29,14);">Job 29:14</a>: "My justice was as a robe and a diadem" (RVm, "turban"); <a onClick="return mV(\'Isa\',62,3);">Isa 62:3</a>: "a royal diadem in the hand of thy God."<P>(2) tsephirah, means "a crown," "diadem," i.e. something round about the head; <a onClick="return mV(\'Isa\',28,5);">Isa 28:5</a> "a diadem of beauty, unto the residue of his people."<P>(3) mitsnepheth, means an official turban or tiara of priest or king, translated also "mitre." <a onClick="return mV(\'Eze\',21,26);">Eze 21:26</a>: "Remove the mitre, and take off the crown."<P>(4) diadema, the Greek word in the New Testament for "diadem," means "something bound about the head." Found 3 times, all in <a onClick="return mV(\'Rev\',12,3);">Re 12:3</a>: "a great red dragon...and upon his heads seven diadems" (the King James Version "crowns"); <a onClick="return mV(\'Rev\',13,1);">Re 13:1</a>: "a beast...and on his horns ten diadems"; <a onClick="return mV(\'Rev\',19,11,12);">19:11-12</a>: "a white horse...and upon his head are many diadems."` <a href="./study/isbe/search.html?string=CROWN">CROWN</a>`142';
isbe[2680]='Dial of Ahaz`di\'-al, a\'-haz:<P>1. Hezekiah\'s Sickness and the Sign<P>2. The Sign a Real Miracle<P>3. The "Dial" a Staircase<P>4. Time of Day of the Miracle<P>5. Hezekiah\'s Choice of the Sign<P>6. Meaning of the Sign<P>7. The Fifteen "Songs of Degrees"<hr /><P>1. Hezekiah\'s Sickness and the Sign:<P>One of the most striking instances recorded in Holy Scripture of the interruption, or rather reversal, of the working of a natural law is the going back of the shadow on the dial of Ahaz at the time of Hezekiah\'s recovery from his illness. The record of the incident is as follows. Isaiah was sent to Hezekiah in his sickness, to say:<P>"Thus saith Yahweh, the God of David thy father, I have heard thy prayer, I have seen thy tears: behold, I will heal thee; on the third day thou shalt go up unto the house of Yahweh....And Hezekiah said unto Isaiah, What shall be the sign that Yahweh will heal me, and that I shall go up unto the house of Yahweh the third day? And Isaiah said, This shall be the sign unto thee from Yahweh, that Yahweh will do the thing that he hath spoken: shall the shadow go forward ten steps, or go back ten steps? And Hezekiah answered, It is a light thing for the shadow to decline ten steps: nay, but let the shadow return backward ten steps. And Isaiah the prophet cried unto Yahweh; and he brought the shadow ten steps backward, by which it had gone down on the dial of Ahaz" (<a onClick="return mV(\'2Ki\',20,\'5-11\');">2Ki 20:5-11</a>). And in <a onClick="return mV(\'Isa\',38,8);">Isa 38:8</a>, it is said, "Behold, I will cause the shadow on the steps, which is gone down on the dial of Ahaz with the sun, to return backward ten steps. So the sun returned ten steps on the dial whereon it was gone down."<P>2. The Sign a Real Miracle:<P>The first and essential point to be noted is that this was no ordinary astronomical phenomenon, nor was it the result of ordinary astronomical laws then unknown. It was peculiar to that particular place, and to that particular time; otherwise we should not read of "the ambassadors of the princes of Babylon, who sent...to inquire of the wonder that was done in the land" (<a onClick="return mV(\'2Ch\',32,31);">2Ch 32:31</a>). It is impossible, therefore, to accept the suggestion that the dial of Ahaz may have been improperly constructed, so as to produce a reversal of the motion of the shadow at certain times. For such a maladjustment would have occasioned the repetition of the phenomenon every time the sun returned to the same position with respect to the dial. The narrative, in fact, informs us that the occurrence was not due to any natural law, known or unknown, since Hezekiah was given the choice and exercised it of his own free will, as to whether a shadow should move in a particular direction or in the opposite. But there are no alternative results in the working of a natural law. "If a state of things is repeated in every detail, it must lead to exactly the same consequences." The same natural law cannot indifferently produce one result, or its opposite. The movement of the shadow on the dial of Ahaz was, therefore, a miracle in the strict sense of the term. It cannot be explained by the working of any astronomical law, known or unknown. We have no information as to the astronomical conditions at the time; we can only inquire into the setting of the miracle.<P>3. The "Dial" a Staircase:<P>It is unfortunate that one important word in the narrative has been rendered in both the King James Version and the Revised Version (British and American) by a term which describes a recognized astronomical instrument. The word "dial" (ma\'aloth) is usually translated "degrees," "steps," or "stairs," and indeed is thus rendered in the same verse. There is no evidence that the structure referred to had been designed to serve as a dial or was anything other than a staircase, "the staircase of Ahaz." It was probably connected with that "covered way for the sabbath that they had built in the house, and the king\'s entry without," which Ahaz turned "round the house of Yahweh, because of the king of Assyria" (<a onClick="return mV(\'2Ki\',16,18);">2Ki 16:18</a> the Revised Version, margin). This staircase, called after Ahaz because the alteration was due to him, may have been substituted for David\'s "causeway that goeth up," which was "westward, by the gate of Shallecheth" (<a onClick="return mV(\'1Ch\',26,16);">1Ch 26:16</a>), or more probably for Solomon\'s "ascent by which he went up unto the house of Yahweh" which so impressed the queen of Sheba (<a onClick="return mV(\'2Ch\',9,4);">2Ch 9:4</a>).<P>4. Time of Day of the Miracle:<P>At certain times of the day the shadow of some object fell upon this staircase, and we learn from both 2 Kings and Isaiah that this shadow had already gone down ten steps, while from Isaiah we learn in addition that the sun also was going down. The miracle therefore took place in the afternoon, when the sun moves on its downward course, and when all shadows are thrown in an easterly direction. We are not told what was the object that cast the shadow, but it must have stood to the west of the staircase, and the top of the staircase must have passed into the shadow first, and the foot of the staircase have remained longest in the light. The royal palace is understood to have been placed southeast of the Temple, and it is therefore probable that it was some part of the Temple buildings that had cast its shadow down the stairway in full view of the dying king, as he lay in his chamber. If the afternoon were well advanced the sun would be moving rapidly in altitude, and but little in azimuth; or, in other words, the shadow would be advancing down the steps at its quickest rate, but be moving only slowly toward the left of those who were mounting them. It may well have been the case, therefore, that the time had come when the priests from Ophel, and the officials and courtiers from the palace, were going up the ascent into the house of the Lord to be present at the evening sacrifice; passing from the bright sunshine at the foot of the stairs into the shadow that had already fallen upon the upper steps. The sun would be going straight down behind the buildings and the steps already in shadow would sink into deeper shadow, not to emerge again into the light until a new day\'s sun had arisen upon the earth.<P>5. Hezekiah\'s Choice of the Sign:<P>We can therefore understand the nature of the choice of the sign that was offered by the prophet to the dying king. Would he choose that ten more steps should be straight- way engulfed in the shadow, or that ten steps already shadowed should be brought back into the light? Either might serve as a sign that he should arise on the third day and go up in renewed life to the house of the Lord; but the one sign would be in accordance with the natural progress of events, and the other would be directly opposed to it. It would be a light thing, as Hezekiah said, for the shadow to go forward ten steps; a bank of cloud rising behind the Temple would effect that change. But no disposition of cloud could bring the shadow back from that part of the staircase which had already passed into it, and restore it to the sunshine. The first change was, in human estimation, easily possible, "a light thing"; the second change seemed impossible. Hezekiah chose the seemingly impossible, and the Lord gave the sign and answered his prayer. We need not ask Whether the king showed more or less faith in choosing the "impossible" rather than the "possible" sign. His father Ahaz had shown his want of faith by refusing to put the Lord to the test, by refusing to ask a sign, whether in the heaven above or in the earth beneath. The faith of Hezekiah was shown in asking a sign, which was at once in the heaven above and in the earth beneath, in accepting the choice offered to him, and so putting the Lord to the test. And the sign chosen was most fitting, Hezekiah lay dying, whether of plague or of cancer we do not know, but his disease was mortal and beyond cure; he was already entering into the shadow of death. The word of the Lord was sure to him; on "the third day" he would rise and go up in new life to the house of God.<P>6. Meaning of the Sign:<P>But what of the sign? Should the shadow of death swallow him up; should his life be swiftly cut off in darkness, and be hidden until a new day should dawn, and the light of a new life, a life of resurrection, arise? (Compare <a onClick="return mV(\'Jhn\',11,24);">Joh 11:24</a>.) Or should the shadow be drawn back swiftly, and new years be added to his life before death could come upon him? Swift death was in the natural progress of events; restoration to health was of the impossible. He chose the restoration to health, and the Lord answered his faith and his prayer.<P>We are not able to go further into particulars. The first temple, the royal palace, and the staircase of Ahaz were all destroyed in the destruction of Jerusalem by Nebuchadnezzar, and we have no means of ascertaining the exact position of the staircase with respect to Temple or palace, or the number of the steps that it contained, or the time of the day, or the season of the year when the sign was given. It is possible that if we knew any or all of these, a yet greater significance, both spiritual and astronomical, might attach to the narrative.<P>7. The Fifteen "Songs of Degrees":<P>Fifteen years were added to the life of Hezekiah. In the restoration of the second temple by Herod fifteen steps led from the Court of the Women to the Court of Israel, and on these steps the Levites during the Feast of Tabernacles were accustomed to stand in order to sing the fifteen "songs of degrees" (<span class="noTag">Pss 120-134</span>). At the head of these same steps in the gateway, lepers who had been cleansed from their disease presented themselves to the priests. It has been suggested that Hezekiah himself was the compiler of these fifteen "songs of the steps," in thankfulness for his fifteen years of added life. Five of them are ascribed to David or as written for Solomon, but the remaining ten bear no author\'s name. Their subjects are, however, most appropriate to the great crises and desires of Hezekiah\'s life. His great Passover, to which all the tribes were invited, and so many Israelites came; the blasphemy of Rabshakeh and of Sennacherib\'s threatening letter; the danger of the Assyrian invasion and the deliverance from it; Hezekiah\'s sickness unto death and his miraculous restoration to health; and the fact that at that time he would seem to have had no son to follow him on the throne—all these subjects seem to find fitting expression in the fifteen Psalms of the Steps.``119';
