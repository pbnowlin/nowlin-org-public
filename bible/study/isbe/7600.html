isbe[7642]='Sanhedrin`san\'-he-drin (canhedhrin, the Talmudic transcription of the Greek sunedrion):<P>1. Name:<P>The Sanhedrin was, at and before the time of Christ, the name for the highest Jewish tribunal, of 71 members, in Jerusalem, and also for the lower tribunals, of 23 members, of which Jerusalem had two (Tosephta\' Chaghighah 11 9; Sanhedrin 1 6; 11 2). It is derived from sun, "together," and hedra, "seat." In Greek and Roman literature the senates of Sparta, Carthage, and even Rome, are so called (compare Pausan. iii.11, 2; Polyb. iii.22; Dion Cassius xl.49). In Josephus we meet with the word for the first time in connection with the governor Gabinius (57-55 BC), who divided the whole of Palestine into 5 sunedria (Ant., XIV, v, 4), or sunodoi (B J, I, viii, 5); and with the term sunedrion for the high council in Jerusalem first in Ant, XIV, ix, 3-5, in connection with Herod, who, when a youth, had to appear before the sunedrion at Jerusalem to answer for his doings in Galilee. But before that date the word appears in the Septuagint version of Proverbs (circa 130 BC), especially in 22:10; 31:23, as an equivalent for the Mishnaic beth-din = "judgment chamber."<P>In the New Testament the word sometimes, especially when used in the plural (<a onClick="return mV(\'Mat\',10,17);">Mt 10:17</a>; <a onClick="return mV(\'Mar\',13,9);">Mr 13:9</a>; compare Sanhedrin 1 5), means simply "court of justice," i.e. any judicatory (<a onClick="return mV(\'Mat\',5,22);">Mt 5:22</a>). But in most cases it is used to designate the supreme Jewish Court of Justice in Jerusalem, in which the process against our Lord was carried on, and before which the apostles (especially Peter and John, Stephen, and Paul) had to justify themselves (<a onClick="return mV(\'Mat\',26,59);">Mt 26:59</a>; <a onClick="return mV(\'Mar\',14,55);">Mr 14:55</a>; <a onClick="return mV(\'Mar\',15,1);">15:1</a>; <a onClick="return mV(\'Luk\',22,66);">Lu 22:66</a>; <a onClick="return mV(\'Jhn\',11,47);">Joh 11:47</a>; <a onClick="return mV(\'Act\',4,15);">Ac 4:15</a>; <a onClick="return mV(\'Act\',5,21);">5:21</a>ff; <a onClick="return mV(\'Act\',6,12);">6:12</a>ff; <a onClick="return mV(\'Act\',22,30);">22:30</a>; <a onClick="return mV(\'Act\',23,1);">23:1</A>ff; <a onClick="return mV(\'Act\',24,20);">24:20</a>). Sometimes presbuterion (<a onClick="return mV(\'Luk\',22,66);">Lu 22:66</a>; <a onClick="return mV(\'Act\',22,5);">Ac 22:5</a>) and gerousia (<a onClick="return mV(\'Act\',5,21);">Ac 5:21</a>) are substituted for sunedrion.<P>See <a href="./study/isbe/search.html?string=SENATE">SENATE</a>.<P>In the Jewish tradition-literature the term "Sanhedrin" alternates with kenishta\', "meeting-place" (Meghillath Ta\'-anith 10, compiled in the 1st century AD), and beth-din, "court of justice" (Sanhedrin 11 2,4). As, according to Jewish tradition, there were two kinds of sunedria, namely, the supreme sunedrion in Jerusalem of 71 members, and lesser sunedria of 23 members, which were appointed by the supreme one, we find often the term canhedhrin gedholah, "the great Sanhedrin," or beth-din ha-gadhol, "the great court of justice" (Middoth 5 4; Sanhedrin 1 6), or canhedhrin gedholah ha-yoshebheth be-lishekhath hagazith, "the great Sanhedrin which sits in the hall of hewn stone."<P>2. Origin and History:<P>There is lack of positive historical information as to the origin of the Sanhedrin. According to Jewish tradition (compare Sanhedrin 16) it was constituted by Moses (<a onClick="return mV(\'Num\',11,\'16-24\');">Nu 11:16-24</a>) and was reorganized by Ezra immediately after the return from exile (compare the Targum to <a onClick="return mV(\'Sgs\',6,1);">So 6:1</a>). But there is no historical evidence to show that previous to the Greek period there existed an organized aristocratic governing tribunal among the Jews. Its beginning is to be placed at the period in which Asia was convulsed by Alexander the Great and his successors.<P>The Hellenistic kings conceded a great amount of internal freedom to municipal communities, and Palestine was then practically under home rule, and was governed by an aristocratic council of Elders (1Macc 12:6; 2Macc 1:10; 4:44; 11:27; 3Macc 1:8; compare Josephus, Ant, XII, iii, 4; XIII, v, 8; Meghillath Ta\'anith 10), the head of which was the hereditary high priest. The court was called Gerousia, which in Greek always signifies an aristocratic body (see Westermann in Pauly\'s RE, III, 49). Subsequently this developed into the Sanhedrin.<P>During the Roman period (except for about 10 years at the time of Gabinius, who applied to Judea the Roman system of government; compare Marquardt, Romische Staatsverwaltung, I, 501), the Sanhedrin\'s influence was most powerful, the internal government of the country being practically in its hands (Ant., XX, x), and it was religiously recognized even among the Diaspora (compare <a onClick="return mV(\'Act\',9,2);">Ac 9:2</a>; <a onClick="return mV(\'Act\',22,5);">22:5</a>; <a onClick="return mV(\'Act\',26,12);">26:12</a>). According to Schurer (HJP, div II, volume 1, 171; GJV4, 236) the civil authority of the Sanhedrin, from the time of Archelaus, Herod the Great\'s son, was probably restricted to Judea proper, and for that reason, he thinks, it had no judicial authority over our Lord so long as He remained in Galilee (but see G.A. Smith, Jerusalem, I, 416).<P>The Sanhedrin was abolished after the destruction of Jerusalem (70 AD). The beth-din (court of judgment) in Jabneh (68-80), in Usah (80-116), in Shafran (140-63), in Sepphoris (163-93), in Tiberias (193-220), though regarded in the Talmud (compare Ro\'sh ha-shanah 31a) as having been the direct continuation of the Sanhedrin, had an essentially different character; it was merely an assembly of scribes, whose decisions had only a theoretical importance (compare Sotah 9 11).<P>3. Constitution:<P>The Great Sanhedrin in Jerusalem was formed (<a onClick="return mV(\'Mat\',26,3,17,59);">Mt 26:3,17,59</a>; <a onClick="return mV(\'Mar\',14,53);">Mr 14:53</a>; <a onClick="return mV(\'Mar\',15,1);">15:1</a>; <a onClick="return mV(\'Luk\',22,66);">Lu 22:66</a>; <a onClick="return mV(\'Act\',4,5);">Ac 4:5</a>f; <a onClick="return mV(\'Act\',5,21);">5:21</a>; <a onClick="return mV(\'Act\',22,30);">22:30</a>) of high priests (i.e. the acting high priest, those who had been high priests, and members of the privileged families from which the high priests were taken), elders (tribal and family heads of the people and priesthood), and scribes (i.e. legal assessors), Pharisees and Sadducees alike (compare <a onClick="return mV(\'Act\',4,1);">Ac 4:1</a>ff; <a onClick="return mV(\'Act\',5,17,34);">5:17,34</a>; <a onClick="return mV(\'Act\',23,6);">23:6</a>). In <a onClick="return mV(\'Mar\',15,43);">Mr 15:43</a>; <a onClick="return mV(\'Luk\',23,50);">Lu 23:50</a>, Joseph of Arimathea is called bouleutes, "councillor," i.e. member of the Sanhedrin.<P>According to Josephus and the New Testament, the acting high priest was as such always head and president (<a onClick="return mV(\'Mat\',26,3,17);">Mt 26:3,17</a>; <a onClick="return mV(\'Act\',5,17);">Ac 5:17</a>ff; <a onClick="return mV(\'Act\',7,1);">7:1</a>; <a onClick="return mV(\'Act\',9,1);">9:1</a>f; <a onClick="return mV(\'Act\',22,5);">22:5</a>; <a onClick="return mV(\'Act\',23,2);">23:2</a>; <a onClick="return mV(\'Act\',24,1);">24:1</a>; Ant, IV, viii, 17; XX, x). Caiaphas is president at the trial of our Lord, and at Paul\'s trial Ananias is president. On the other hand, according to the Talmud (especially Haghighah 2 2), the Sanhedrin is represented as a juridical tribunal of scribes, in which one scribe acted as nasi\', "prince," i.e. president, and another as \'abh-beth-din, father of the judgment-chamber, i.e. vice-president. So far, it has not been found possible to reconcile these conflicting descriptions (see "Literature," below).<P>Sanhedrin 4 3 mentions the cophere-ha-dayanim, "notaries," one of whom registered the reasons for acquittal, and the other the reasons for condemnation. In the New Testament we read of huperetai, "constables" (<a onClick="return mV(\'Mat\',5,25);">Mt 5:25</a>) and of the "servants of the high priest" (<a onClick="return mV(\'Mat\',26,51);">Mt 26:51</a>; <a onClick="return mV(\'Mar\',14,47);">Mr 14:47</a>; <a onClick="return mV(\'Jhn\',18,10);">Joh 18:10</a>), whom Josephus describes as "enlisted from the rudest and most restless characters" (Ant., XX, viii, 8; ix, 2). Josephus speaks of the "public whip," Matthew mentions "tormentors" (18:34), Luke speaks of "spies" (20:20).<P>The whole history of post-exilic Judaism circles round the high priests, and the priestly aristocracy always played the leading part in the Sanhedrin (compare Sanhedrin 4 2). But the more the Pharisees grew in importance, the more were they represented in the Sanhedrin. In the time of Salome they were so powerful that "the queen ruled only in name, but the Pharisees in reality" (Ant., XIII, xvi, 2). So in the time of Christ, the Sanhedrin was formally led by the Sadducean high priests, but practically ruled by the Pharisees (Ant., XVIII, i, 4).<P>4. Jurisdiction:<P>In the time of Christ the Great Sanhedrin at Jerusalem enjoyed a very high measure of independence. It exercised not only civil jurisdiction, according to Jewish law, but also, in some degree, criminal. It had administrative authority and could order arrests by its own officers of justice (<a onClick="return mV(\'Mat\',26,47);">Mt 26:47</a>; <a onClick="return mV(\'Mar\',14,43);">Mr 14:43</a>; <a onClick="return mV(\'Act\',4,3);">Ac 4:3</a>; <a onClick="return mV(\'Act\',5,17);">5:17</a>f; <a onClick="return mV(\'Act\',9,2);">9:2</a>; compare Sanhedrin 1 5). It was empowered to judge cases which did not involve capital punishment, which latter required the confirmation of the Roman procurator (<a onClick="return mV(\'Jhn\',18,31);">Joh 18:31</a>; compare the Jerusalem Sanhedrin 1 1; 7 2 (p. 24); Josephus, Ant, XX, ix, 1). But, as a rule, the procurator arranged his judgment in accordance with the demands of the Sanhedrin.<P>For one offense the Sanhedrin could put to death, on their own authority, even a Roman citizen, namely, in the case of a Gentile passing the fence which divided the inner court of the Temple from that of the Gentiles (BJ, VI, ii, 4; Middoth 11 3; compare <a onClick="return mV(\'Act\',21,28);">Ac 21:28</a>). The only case of capital punishment in connection with the Sanhedrin in the New Testament is that of our Lord. The stoning of Stephen (<a onClick="return mV(\'Act\',7,54);">Ac 7:54</a>) was probably the illegal act of an enraged multitude.<P>5. Place and Time of Meeting:<P>The Talmudic tradition names "the hall of hewn stone," which, according to Middoth 5 4, was on the south side of the great court, as the seat of the Great Sanhedrin (Pe\'-ah 2 6; \'Edhuyoth 7 4, et al.). But the last sittings of the Sanhedrin were held in the city outside the Temple area (Sanhedrin 41a; Shabbath 15a; Ro\'sh ha-shanah 31a; Abhodhah zarah 8c). Josephus also mentions the place where the bouleutai, "the councilors," met as the boule, outside the Temple (BJ, V, iv, 2), and most probably he refers to these last sittings.<P>According to the Tosephta\' Sanhedrin 7 1, the Sanhedrin held its sittings from the time of the offering of the daily morning sacrifice till that of the evening sacrifice. There were no sittings on Sabbaths or feast days.<P>6. Procedure:<P>The members of the Sanhedrin were arranged in a semicircle, so that they could see each other (Sanhedrin 4 3; Tosephta\' 8 1). The two notaries stood before them, whose duty it was to record the votes (see 3, above). The prisoner had to appear in humble attitude and dressed it, mourning (Ant., XIV, ix, 4). A sentence of capital punishment could not be passed on the day of the trial. The decision of the judges had to be examined on the following day (Sanhedrin 4 1), except in the case of a person who misled the people, who could be tried and condemned the same day or in the night (Tosephta\' Sanhedrin 10). Because of this, cases which involved capital punishment were not tried on a Friday or on any day before a feast. A herald preceded the condemned one as he was led to the place of execution, and cried out: "N. the son of N. has been found guilty of death, etc. If anyone knows anything to clear him, let him come forward and declare it" (Sanhedrin 6 1). Near the place of execution the condemned man was asked to confess his guilt in order that he might partake in the world to come (ibid.; compare <a onClick="return mV(\'Luk\',23,\'41-43\');">Lu 23:41-43</a>).<P>LITERATURE.<P>Our knowledge about the Sanhedrin is based on three sources: the New Testament, Josephus, and the Jewish tradition-literature (especially Mishna, Sanhedrin and Makkoth, best edition, Strack, with German translation, Schriften des Institutum Judaicum in Berlin, N. 38, Leipzig, 1910).<P>See the article, <a href="./study/isbe/search.html?string=TALMUD">TALMUD</a>.<P>Consult the following histories of the Jewish people: Ewald, Herzfeld, Gratz, but especially Schurer\'s excellent HJP, much more fully in GJV4; also G. A. Smith, Jerusalem. Special treatises on Sanhedrin: D. Hoffmann, Der oberste Gerichtsh of in der Stadt des Heiligtums, Berlin,1878,where the author tries to defend the Jewish traditional view as to the antiquity of the Sanhedrin; J. Reifmann, Sanhedrin (in Hebrews), Berditschew, 1888; A. Kuenen, On the Composition of the Sanhedrin, in Dutch, translated into German by Budde, Gesammelte Abhandlungen, etc., 49-81, Freiburg, 1894; Jelski, Die innere Einrichtung des grossen Synedrions zu Jerusalem, Breslau,1894,who tries to reconcile the Talmudical statements about the composition of the Sanhedrin with those of Josephus and the New Testament (especially in connection with the question of president) by showing that in the Mishna (except Chaghighah 11 2) nasi\' always stands for the political president, the high priest, and \'abh-beth-din for the scribal head of the Sanhedrin, and not for the vice-president; A. Buchler, Das Synedrium in Jerusalem und das grosse Beth-din in der Quaderkammer des jerusalemischen Tempels, Vienna,1902,a very interesting but not convincing work, where the author, in order to reconcile the two different sets of sources, tries to prove that the great Sanhedrin of the Talmud is not identical with the Sanhedrin of Josephus and the New Testament, but that there were two Sanhedrins in Jerusalem, the one of the New Testament and Josephus being a political one, the other a religious one. He also thinks that Christ was seized, not by the Sanhedrin, but by the temple authorities.<P>See also W. Bacher\'s article in HDB (excellent for sifting the Talmudic sources); Dr. Lauterbach\'s article in the Jewish Encyclopedia (accepts fully Biichler\'s view); H. Strack\'s article in Sch-Herz (concise and exact).``98';
isbe[7643]='Sansannah`san-san\'-a (cancannah; [Sansanna], or Sethennak): One of the uttermost cities in the Negeb of Judah (<a onClick="return mV(\'Jos\',15,31);">Jos 15:31</a>), identical with Hazar-susah (<a onClick="return mV(\'Jos\',19,5);">Jos 19:5</a>), one of the cities of Simeon, and almost certainly the same as Hazar-susim (<a onClick="return mV(\'1Ch\',4,31);">1Ch 4:31</a>). It cannot be said to have been identified with any certainty, though Simsim, "a good-sized village with well and pool, surrounded by gardens and having a grove of olives to the north," has been suggested (PEF, III,260,Sh XX).``1';
isbe[7644]='Saph`saf (caph; Codex Vaticanus Saph; Codex Alexandrinus Sephe): A Philistine, one of the four champions of the race of Rapha ("giant") who was slain by Sibbecai, one of David\'s heroes (<a onClick="return mV(\'2Sa\',21,18);">2Sa 21:18</a>; <a onClick="return mV(\'1Ch\',20,4);">1Ch 20:4</a>). It is supposed by some that he was the son of the giant Goliath, but this is not proved. In <a onClick="return mV(\'1Ch\',20,4);">1Ch 20:4</a>, the same person is called "Sippai."``1';
isbe[7645]='Saphat`sa\'-fat:<P>(1) A and Fritzsche, Saphat; omitted in Codex Vaticanus (and Swete); Babylonian margin Asaph: The eponym of a family which returned with Zerubbabel (1Esdras 5:9) = "Shephatiah" in <a onClick="return mV(\'Ezr\',2,4);">Ezr 2:4</a>; <a onClick="return mV(\'Neh\',7,9);">Ne 7:9</a>.<P>(2) Codex Alexandrinus Saphat; Codex Vaticanus, Swete, and Fritzsche, Saphag; the King James Version Sabat: One of the families of "the sons of the servants of Solomon" who returned with Zerubbabel (1Esdras 5:34); wanting in the parallel <a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>; <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>.``1';
isbe[7646]='Saphatias`saf-a-ti\'-as (Saphatias, Codex Vaticanus Sophotias; omitted in Codex Alexandrinus): Name of a family of returning exiles (1Esdras 8:34) = "Shephatiah" in <a onClick="return mV(\'Ezr\',8,8);">Ezr 8:8</a>. If Saphatias (1Esdras 8:34) = Saphat (1Esdras 5:9), as would appear, then part of the family went up with Zerubbabel and part with Ezra.``1';
isbe[7647]='Sapheth`sa\'-feth: the King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=SAPHUTHI">SAPHUTHI</a> (which see).``1';

isbe[7649]='Saphuthi`saf\'-u-thi, sa-fu\'-thi (Codex Alexandrinus and Fritzsche, Saphuthi, Codex Vaticanus (and Swete), Saphuei; the King James Version Sapheth): Name of one of the families of "the sons of the servants of Solomon" (1Esdras 5:33) = "Shephatiah" in <a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>; <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>.``1';

isbe[7652]='Sarabias`sar-a-bi\'-as (Sarabias): One of the Levites who taught and expounded the Law for Ezra (1Esdras 9:48) = "Sherebiah" in <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>, probably identical with the "Asebebias" in 1Esdras 8:47 (<a onClick="return mV(\'Ezr\',8,18);">Ezr 8:18</a>).``1';
isbe[7653]='Sarah; Sarai`sa\'-ra, sa\'-ri:<P>(1) In <a onClick="return mV(\'Gen\',17,15);">Ge 17:15</a> the woman who up to that time has been known as Sarai (Saray; Sara) receives by divine command the name Sarah (Sarah; Sarra). (This last form in Greek preserves the ancient doubling of the r, lost in the Hebrew and the English forms.)<P>The former name appears to be derived from the same root as Israel, if, indeed, <a onClick="return mV(\'Gen\',32,28);">Ge 32:28</a> is intended as an etymology of Israel. "She that strives," a contentious person, is a name that might be given to a child at birth (compare <a onClick="return mV(\'Hsa\',12,3,4);">Ho 12:3,4</a>, of Jacob), or later when the child\'s character developed; in <a onClick="return mV(\'Gen\',16,6);">Ge 16:6</a> and <a onClick="return mV(\'Gen\',21,10);">21:10</a> a contentious character appears. Yet comparison with the history of her husband\'s name (see <a href="./study/isbe/search.html?string=ABRAHAM">ABRAHAM</a>) warns us not to operate solely upon the basis of the Hebrew language. Sarai was the name this woman brought with her from Mesopotamia. On the other hand there can be little doubt that the name Sarah, which she received when her son was promised, means "princess," for it is the feminine form of the extremely common title sar, used by the Semites to designate a ruler of greater or lesser rank. In the verse following the one where this name is conferred, it is declared of Sarah that "kings of peoples shall be of her" (<a onClick="return mV(\'Gen\',17,16);">Ge 17:16</a>).<P>We are introduced to Sarai in <a onClick="return mV(\'Gen\',11,29);">Ge 11:29</a>. She is here mentioned as the wife that Abraham "took," while still in Ur of the Chaldees, that is, while among his kindred. It is immediately added that "Sarai was barren; she had no child." By this simple remark in the overture of his narrative, the writer sounds the motif that is to be developed in all the sequel. When the migration to Haran occurs, Sarai is named along with Abram and Lot as accompanying Terah. It has been held that the author (or authors) of <a onClick="return mV(\'Gen\',11,\'1-\');">Genesis 11</a> knew nothing of the relationship announced in <a onClick="return mV(\'Gen\',20,12);">20:12</A>. But there can be no proof of such ignorance, even on the assumption of diversity of authorship in the two passages.<P>Sarai\'s career as described in <a onClick="return mV(\'Gen\',11,\'1-\');">Genesis 11</a> was not dependent on her being the daughter of Terah. Terah had other descendants who did not accompany him. Her movements were determined by her being Abram\'s wife. It appears, however, that she was a daughter of Terah by a different mother from the mother of Abram. The language of <a onClick="return mV(\'Gen\',20,12);">20:12</A> would indeed admit of her being Abram\'s niece, but the fact that there was but 10 years\' difference between his age and hers (<a onClick="return mV(\'Gen\',17,17);">Ge 17:17</a>) renders this hypothesis less probable. Marriage with half-sisters seems to have been not uncommon in antiquity (even in the Old Testament compare <a onClick="return mV(\'2Sa\',13,13);">2Sa 13:13</a>).<P>This double relationship suggested to Abraham the expedient that he twice used when he lacked faith in God to protect his life and in cowardice sought his own safety at the price of his wife\'s honor. The first of these occasions was in the earlier period of their wanderings (<a onClick="return mV(\'Gen\',12,\'1-\');">Genesis 12</a>). From Canaan they went down into Egypt. Sarai, though above 60 years of age according to the chronology of the sacred historian, made the impression on the Egyptians by her beauty that Abraham had anticipated, and the result was her transfer to the royal palace. But this was in direct contravention of the purpose of God for His own kingdom. The earthly majesty of Pharaoh had to bow before the divine majesty, which plagued him and secured the stranger\'s exodus, thus foreshadowing those later plagues and that later exodus when Abraham\'s and Sarah\'s seed "spoiled the Egyptians."<P>We meet Sarah next in the narrative of the birth of Ishmael and of Isaac. Though 14 years separated the two births, they are closely associated in the story because of their logical continuity. Sarah\'s barrenness persisted. She was now far past middle life, even on a patriarchal scale of longevity, and there appeared no hope of her ever bearing that child who should inherit the promise of God. She therefore adopts the expedient of being "builded by" her personal slave, Hagar the Egyptian (see <a onClick="return mV(\'Gen\',16,2);">Ge 16:2</a> margin). That is, according to contemporary law and custom as witnessed by the Code of Hammurabi (see <a href="./study/isbe/search.html?string=ABRAHAM">ABRAHAM, iv, 2</a>), a son born of this woman would be the freeborn son and heir of Abraham and Sarah.<P>Such was in fact the position of Ishmael later. But the insolence of the maid aroused the vindictive jealousy of the mistress and led to a painful scene of unjustified expulsion. Hagar, however, returned at God\'s behest, humbled herself before Sarah, and bore Ishmael in his own father\'s house. Here he remained the sole and rightful heir, until the miracle of Isaac\'s birth disappointed all human expectations and resulted in the ultimate expulsion of Hagar and her son.<P>The change of name from Sarai to Sarah when Isaac was promised has already been noted. Sarah\'s laughter of incredulity when she hears the promise is of course associated with the origin of the name of Isaac, but it serves also to emphasize the miraculous character of his birth, coming as it does after his parents are both so "well stricken in age" as to make parenthood seem an absurdity.<P>Before the birth of this child of promise, however, Sarah is again exposed, through the cowardice of her husband, to dishonor and ruin. Abimelech, king of Gerar, desiring to be allied by marriage with a man of Abraham\'s power, sends for Sarah, whom he knows only as Abraham\'s sister, and for the second time she takes her place in the harem of a prince. But the divine promise is not to be thwarted, even by persistent human weakness and sin. In a dream God reveals to Abimelech the true state of the case, and Sarah is restored to her husband with an indemnity. Thereupon the long-delayed son is born, the jealous mother secures the expulsion of Hagar and Ishmael, and her career comes to a close at the age of 127, at Hebroni long time her home. The grief and devotion of Abraham are broadly displayed in <a onClick="return mV(\'Gen\',23,\'1-\');">Genesis 23</a>, in which he seeks and obtains a burying-place for his wife. She is thus the first to be interred in that cave of the field of Machpelah, which was to be the common resting-place of the fathers and mothers of the future Israel.<P>The character of Sarah is of mingled light and shade. On the one hand we have seen that lapse from faith which resulted in the birth of Ishmael, and that lack of self-control and charity which resulted in a quarrel with Abraham, an act of injustice to Hagar, and the disinheriting of Ishmael. Yet on the other hand we see in Sarah, as the New Testament writers point out (<a onClick="return mV(\'Hbr\',11,11);">Heb 11:11</a>; <a onClick="return mV(\'1Pe\',3,6);">1Pe 3:6</a>), one who through a long life of companionship with Abraham shared his hope in God, his faith in the promises, and his power to become God\'s agent for achieving what was humanly impossible. In fact, to Sarah is ascribed a sort of spiritual maternity, correlative with Abraham\'s position as "father of the faithful"; for all women are declared to be the (spiritual) daughters of Sarah, who like her are adorned in "the hidden man of the heart," and who are "doers of good" and "fearers of no terror" (1 Peter loc. cit., literally rendered). That in spite of her outbreak about Hagar and Ishmael she was in general "in subjection to her husband" and of "a meek and quiet spirit," appears from her husband\'s genuine grief at her decease, and still more clearly from her son\'s prolonged mourning for her (<a onClick="return mV(\'Gen\',24,67);">Ge 24:67</a>; compare <a onClick="return mV(\'Gen\',17,17);">Ge 17:17</a>, <a onClick="return mV(\'Gen\',17,23);">23:1</a> with <a onClick="return mV(\'Gen\',25,20);">Ge 25:20</a>). And He who maketh even the wrath of man to praise Him used even Sarah\'s jealous anger to accomplish His purpose that "the son of the freewoman," Isaac, "born through promise," should alone inherit that promise (<a onClick="return mV(\'Gal\',4,\'22-31\');">Ga 4:22-31</a>).<P>Apart from the three New Testament passages already cited, Sarah is alluded to only in <a onClick="return mV(\'Isa\',51,2);">Isa 51:2</a> ("Sarah that bare you," as the mother of the nation), in <a onClick="return mV(\'Rom\',4,19);">Ro 4:19</a> ("the deadness of Sarah\'s womb"), and in <a onClick="return mV(\'Rom\',9,9);">Ro 9:9</a>, where God\'s promise in <a onClick="return mV(\'Gen\',18,10);">Ge 18:10</a> is quoted. Yet her existence and her history are of course presupposed wherever allusion is made to the stories of Abraham and of Isaac.<P>To many modern critics Sarah supplies, by her name, a welcome argument in support of the mythical view of Abraham. She has been held to be the local numen to whom the cave near Hebron was sacred; or the deity whose consort was worshipped in Arabia under the title Dusares, i.e. Husband-of-Sarah; or, the female associate of Sin the moon-god, worshipped at Haran. On these views the student will do well to consult Baethgen, Beitrage, 94, 157, and, for the most recent point of view, Gressmann\'s article, "Sage und Geschichte in den Patriarchenerzahlungen," ZATW, 1910, and Eerdmans, Alttestamentliche Studien, II, 13.<P>(2) The daughter of Raguel, and wife of Tobias (Tobit 3:7,17, etc.).`<a href="./study/isbe/search.html?string=TOBIT,+BOOK+OF">TOBIT, BOOK OF</a>`15';
isbe[7654]='Saraias`sa-ra\'-yas, sa-ri\'-as (Saraias; Latin, Sareus):<P>(1) = Seraiah, the high priest in the reign of Zedekiah (1Esdras 5:5, compare <a onClick="return mV(\'1Ch\',6,14);">1Ch 6:14</a>).<P>(2) Sareus the father of Ezra (2Esdras 1:1) = "Seraiah" in <a onClick="return mV(\'Ezr\',7,1);">Ezr 7:1</a>, sometimes identified with Saraias under (1). He is probably identical with the "Azaraias" of 1Esdras 8:1.<P>(3) the King James Version = the Revised Version (British and American) "Azaraias" (1Esdras 8:1).``1';

isbe[7656]='Saraph`sa\'-raf, sa\'-raf (saraph, "noble one"; compare saraph, "burn" "shine"): A descendant of Judah through Shelah (<a onClick="return mV(\'1Ch\',4,22);">1Ch 4:22</a>).``1';

isbe[7660]='Sardis`sar\'-dis (Sardeis): Sardis is of special interest to the student of Herodotus and Xenophon, for there Artaphernes, the brother of Darius, lived, and from there Xerxes invaded Greece and Cyrus marched against his brother Artaxerxes; it is also of interest to the student of early Christian history as the home of one of the Seven Churches of Revelation (<a onClick="return mV(\'Rev\',1,11);">1:11</A>; <a onClick="return mV(\'Rev\',3,1);">3:1</a>ff). It was moreover one of the oldest and most important cities of Asia Minor, and until 549 BC, the capital of the kingdom of Lydia. It stood on the northern slope of Mt. Tmolus; its acropolis occupied one of the spurs of the mountain. At the base flowed the river Pactolus which served as a moat, rendering the city practically impregnable. Through the failure to watch, however, the acropolis had been successfully scaled in 549 BC by a Median soldier, and in 218 by a Cretan (compare <a onClick="return mV(\'Rev\',3,2,3);">Re 3:2,3</a>). Because of its strength during the Persian period, the satraps here made their homes. However, the city was burned by the Ionians in 501 BC, but it was quickly rebuilt and regained its importance. In 334 BC it surrendered to Alexander the Great who gave it independence, but its period of independence was brief, for 12 years later in 322 BC it was taken by Antigonus. In 301 BC, it fell into the possession of the Seleucidan kings who made it the residence of their governor. It became free again in 190 BC, when it formed a part of the empire of Pergamos, and later of the Roman province of Asia. In 17 AD, when it was destroyed by an earthquake, the Roman emperor Tiberius remitted the taxes of the people and rebuilt the city, and in his honor the citizens of that and of neighboring towns erected a large monument, but Sardis never recovered its former importance (compare <a onClick="return mV(\'Rev\',3,12);">Re 3:12</a>). Again in 295 AD, after the Roman province of Asia was broken up, Sardis became the capital of Lydia, and during the early Christian age it was the home of a bishop. The city continued to flourish until 1402, when it was so completely destroyed by Tamerlane that it was never rebuilt. Among the ruins there now stands a small village called Sert, a corruption of its ancient name. The ruins may be reached by rail from Smyrna, on the way to Philadelphia.<P>The ancient city was noted for its fruits and wool, and for its temple of the goddess Cybele, whose worship resembled that of Diana of Ephesus. Its wealth was also partly due to the gold which was found in the sand of the river Pactolus, and it was here that gold and silver coins were first struck. During the Roman period its coins formed a beautiful series, and are found in abundance by the peasants who till the surrounding fields. The ruins of the buildings which stood at the base of the hill have now been nearly buried by the dirt washed down from above. The hill upon which the acropolis stood measures 950 ft. high: the triple walls still surround it. The more imposing of the ruins are on the lower slope of the hill, and among them the temple of Cybele is the most interesting, yet only two of its many stone columns are still standing. Equally imposing is the necropolis of the city, which is at a distance of two hours\' ride from Sert, south of the Gygaean lake. The modern name of the necropolis is Bin Tepe or Thousand Mounds, because of the large group of great mounds in which the kings and nobles were buried. Many of the mounds were long ago excavated and plundered.<P>We quote the following from the Missionary Herald (Boston, Massachusetts, August,1911,pp. 361-62):<P>Dr. C. C. Tracy, of Marsovan, has made a visit to ancient Sardis and observed the work of his countryman, Professor Butler, of Princeton University, who is uncovering the ruins of that famous city of the past. Already rich "finds" have been made; among them portions of a temple of Artemis, indicating a building of the same stupendous character as those at Ephesus and Baalbec, and a necropolis from whose tombs were unearthed three thousand relics, including utensils, ornaments of gold and precious stones, mirrors, etc. What chiefly impressed Dr. Tracy was the significance of those "Seven Churches of Asia," of which Sardis held one. "When I think of the myriads of various nationality and advanced civilization for whose evangelization these churches were responsible, the messages to the Christian communities occupying the splendid strategic centers fill me with awe. While established amid the splendors of civilization, they were set as candlesticks in the midst of gross spiritual darkness. Did they fulfill their mission?"<P>One of Dr. Butler\'s recoveries is the marble throne of the Bishop of Sardis; looking upon it the message to Sardis recurs to mind. A fact of current history quickened the visitor\'s appreciation of the word to "the angel" of that church. "Yonder among the mountains overhanging Sardis there is a robber gang led by the notorious Chakirjali. He rules in the mountains; no government force can take him. Again and again he swoops down like an eagle out of the sky, in one quarter of the region or another. From time immemorial these mountains have been the haunts of robbers; very likely it was so when Revelation was written, \'I will come upon thee as a thief.\' In each case the message was addressed to \'the angel of the church.\' Over every church in the world there is a spirit hovering, as it were—a spirit representing that church and by whose name it can be addressed. The messages are as vital as they were at the first. \'He that hath an ear, let him hear what the Spirit saith unto the churches.\'"``7';

isbe[7664]='Sarepta`sa-rep\'-ta (Sarepta): The name in <a onClick="return mV(\'Luk\',4,26);">Lu 4:26</a> the King James Version, following the Greek, of the Phoenician town to which Elijah was sent in the time of the great famine, in order to save the lives of a widow and her son (<a onClick="return mV(\'1Ki\',17,9,10);">1Ki 17:9,10</a>). The Revised Version (British and American) adopts the form of the name based upon the Hebrew, and as found in the Old Testament: <a href="./study/isbe/search.html?string=ZAREPHATH">ZAREPHATH</a> (which see).``1';
isbe[7665]='Sargon`sar\'-gon (722-705 BC): The name of this ruler is written cargon, in the Old Testament, Shar-ukin in the cuneiform inscriptions, Arna, in the Septuagint, and Arkeanos, in the Ptolemaic Canon. Sargon is mentioned but once by name in the Old Testament (<a onClick="return mV(\'Isa\',20,1);">Isa 20:1</a>), when he sent his Tartan (turtannu) against Ashdod, but he is referred to in <a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a> as "the king of Assyria" who carried Israel into captivity.<P>Shalmaneser V had laid siege to Samaria and besieged it three years. But shortly before or very soon after its capitulation, Sargon, perhaps being responsible for the king\'s death, overthrew the dynasty, and in his annals credited himself with the capture of the city and the deportation of its inhabitants. Whether he assumed the name of the famous ancient founder of the Accad dynasty is not known.<P>Sargon at the beginning of his reign was confronted with a serious situation in Babylon. Merodach-baladan of Kaldu, who paid tribute to previous rulers, on the change of dynasty had himself proclaimed king, New Year\'s Day, 721 BC. At Dur-ilu, Sargon fought with the forces of Merodachbalddan and his ally Khumbanigash of Elam, but although he claimed a victory the result was apparently indecisive. Rebellions followed in other parts of the kingdom.<P>In 720 BC Ilu-bi\'di (or Yau-bi\'di), king of Hamath, formed a coalition against Sargon with Hanno of Gaza, Sib\'u of Egypt, and with the cities Arpad, Simirra, Damascus and Samaria. He claims that Sib\'u fled, and that he captured and flayed Ilu-bi\'di, burned Qarqar, and carried Hanno captive to Assyria. After destroying Rapihu, he carried away 9,033 inhabitants to Assyria.<P>In the following year Ararat was invaded and the Hittite Carchemish fell before his armies. The territory of Rusas, king of Ararat, as well as a part of Melitene became Assyrian provinces.<P>In 710 BC Sargon directed his attention to Merodachbaladan, who no longer enjoyed the support of Elam, and whose rule over Babylon had not been popular with his subjects. He was driven out from Babylon and also from his former capital Bit-Yakin, and Sargon had himself crowned as the shakkanak of Babylon.<P>In 706 BC the new city called Dur-Sharrukin was dedicated as his residence. A year later he was murdered. It was during his reign that the height of Assyrian ascendancy had been reached.``24';
isbe[7666]='Sarid`sa\'-rid (saridh; Codex Vaticanus Esedekgola, Seddouk; Codex Alexandrinus Sarthid, Sarid): A place on the southern border of Zebulun to the west of Chisloth-tabor (<a onClick="return mV(\'Jos\',19,10,12);">Jos 19:10,12</a>). It is mentioned but not identified in Eusebius, Onomasticon. Probably we should read "Sadid," and in that case may with Conder locate it at Tell Shaddu, an artificial mound with some modern ruins and good springs, which stands on the plain, about 5 miles west of Iksal.``1';
isbe[7667]='Saron`sa\'-ron, (Saron): the King James Version; Greek form of Sharon (<a onClick="return mV(\'Act\',9,35);">Ac 9:35</a>).``1';
isbe[7668]='Sarothie`sa-ro\'-thi-e (Codex Alexandrinus Sarothie; Codex Vaticanus and Swete, Sarothei): Name of a family of "the sons of the servants of Solomon" who returned with Zerubbabel (1Esdras 5:34); it is wanting in the parallel lists in <a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>; <a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>.``1';
isbe[7669]='Sarsechim`sar\'-se-kim, sar-se-kim (sarckhim): A prince of Nebuchadnezzar, present at the taking of Jerusalem by Nebuchadnezzar in the 11th year of Zedekiah (<a onClick="return mV(\'Jer\',39,3);">Jer 39:3</a>). The versions with their various readings—"Nabousachar" "Nabousarach," "Sarsacheim"—point to a corrupt text. The best emendation is the reading "Nebhoshazibhon" (= Nabusezib-anni, "Nebo delivers me"); this is based on the reading in <a onClick="return mV(\'Jer\',39,13);">Jer 39:13</a>.``1';
isbe[7670]='Saruch`sa\'-ruk (Sarouch, Serouch): the King James Version; Greek form of Serug (thus, <a onClick="return mV(\'Luk\',3,35);">Lu 3:35</a> the Revised Version (British and American)).``1';
isbe[7671]='Satan`sa\'-tan (satan), "adversary," from the verb satan, "to lie in wait" (as adversary); Satan, Satanas, "adversary," diabolos, "Devil," "adversary" or "accuser," kategor (altogether unclassical and unGreek) (used once in <a onClick="return mV(\'Rev\',12,10);">Re 12:10</a>), "accuser"):<P><b>I. DEFINITION</b><P><b>II. SCRIPTURAL FACTS CONCERNING SATAN</b><P class="in15">1. Names of Satan<P class="in15">2. Character of Satan<P class="in15">3. Works of Satan<P class="in15">4. History of Satan<P><b>III. GENERAL CONSIDERATIONS</b><P class="in15">1. Scripture Doctrine of Satan Not Systematized<P class="in15">2. Satan and God<P class="in15">3. Satan Essentially Limited<P class="in15">4. Conclusions<P><b>LITERATURE</b><hr /><P>I. Definition.<P>A created but superhuman, personal, evil, world-power, represented in Scripture as the adversary both of God and men.<P>II. Scriptural Facts concerning Satan.<P>1. Names of Satan:<P>The most important of these are the Hebrew and Greek equivalents noticed above. These words are used in the general sense justified by their etymological significance. It is applied even to Yahweh Himself (<a onClick="return mV(\'Num\',22,22,32);">Nu 22:22,32</a>; compare <a onClick="return mV(\'1Sa\',29,4);">1Sa 29:4</a>; <a onClick="return mV(\'2Sa\',19,22);">2Sa 19:22</a>; <a onClick="return mV(\'Psa\',109,6);">Ps 109:6</a>, etc.). The word "Satan" is used 24 times in the Old Testament. In Job (<a onClick="return mV(\'Job\',1,6);">1:6</a>f) and Zec (<a onClick="return mV(\'Zec\',3,1);">3:1</a>f) it has the prefixed definite article. In all cases but one when the article is omitted it is used in a general sense. This one exception is <a onClick="return mV(\'1Ch\',21,1);">1Ch 21:1</a> (compare <a onClick="return mV(\'2Sa\',24,1);">2Sa 24:1</a>), where the word is generally conceded to be used as a proper name. This meaning is fixed in New Testament times. We are thus enabled to note in the term "Satan" (and Devil) the growth of a word from a general term to an appellation and later to a proper name. All the other names of Satan save only these two are descriptive titles. In addition to these two principal names a number of others deserve specific enumeration. Tempter (<a onClick="return mV(\'Mat\',4,5);">Mt 4:5</a>; <a onClick="return mV(\'1Th\',3,5);">1Th 3:5</a>); Beelzebub (<a onClick="return mV(\'Mat\',12,24);">Mt 12:24</a>); Enemy (<a onClick="return mV(\'Mat\',13,39);">Mt 13:39</a>); Evil One (<a onClick="return mV(\'Mat\',13,19,38);">Mt 13:19,38</a>; <a onClick="return mV(\'1Jo\',2,13,14);">1Joh 2:13,14</a>; <a onClick="return mV(\'1Jo\',3,12);">3:12</a>, and particularly <a onClick="return mV(\'1Jo\',5,18);">1Joh 5:18</a>); Belial (<a onClick="return mV(\'2Cr\',6,15);">2Co 6:15</a>); Adversary (antidikos), (<a onClick="return mV(\'1Pe\',5,8);">1Pe 5:8</a>); Deceiver (literally "the one who deceives") (<a onClick="return mV(\'Rev\',12,9);">Re 12:9</a>); Dragon (Great) (<a onClick="return mV(\'Rev\',12,3);">Re 12:3</a>); Father of Lies (<a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>); Murderer (<a onClick="return mV(\'Jhn\',8,44);">Joh 8:44</a>); Sinner (<a onClick="return mV(\'1Jo\',3,8);">1Joh 3:8</a>)—these are isolated references occurring from 1 to 3 times each. In the vast majority of passages (70 out of 83) either Satan or Devil is used.<P>2. Character of Satan:<P>Satan is consistently represented in the New Testament as the enemy both of God and man. The popular notion is that Satan is the enemy of man and active in misleading and cursing humanity because of his intense hatred and opposition to God. <a onClick="return mV(\'Mat\',13,39);">Mt 13:39</a> would seem to point in this direction, but if one were to venture an opinion in a region where there are not enough facts to warrant a conviction, it would be that the general tenor of Scripture indicates quite the contrary, namely, that Satan\'s jealousy and hatred of men has led him into antagonism to God and, consequently, to goodness. The fundamental moral description of Satan is given by our Lord when He describes Satan as the "evil one" (<a onClick="return mV(\'Mat\',13,19,38);">Mt 13:19,38</a>; compare Isaiah\'s description of Yahweh as the "Holy One," <a onClick="return mV(\'Isa\',1,4);">Isa 1:4</a> and often); that is, the one whose nature and will are given to evil. Moral evil is his controlling attribute. It is evident that this description could not be applied to Satan as originally created. Ethical evil cannot be concreated. It is the creation of each free will for itself. We are not told in definite terms how Satan became the evil one, but certainly it could be by no other process than a fall, whereby, in the mystery of free personality, an evil will takes the place of a good one.<P>3. Works of Satan:<P>The world-wide and age-long works of Satan are to be traced to one predominant motive. He hates both God and man and does all that in him lies to defeat God\'s plan of grace and to establish and maintain a kingdom of evil, in the seduction and ruin of mankind. The balance and sanity of the Bible is nowhere more strikingly exhibited than in its treatment of the work of Satan. Not only is the Bible entirely free from the extravagances of popular Satanology, which is full of absurd stories concerning the appearances, tricks, and transformations of Satan among men, but it exhibits a dependable accuracy and consistency, of statement which is most reassuring. Almost nothing is said concerning Satanic agency other than wicked men who mislead other men. In the controversy with His opponents concerning exorcism (<a onClick="return mV(\'Mar\',3,22);">Mr 3:22</a>f and parallel\'s) our Lord rebuts their slanderous assertion that He is in league with Satan by the simple proposition that Satan does not work against himself. But in so saying He does far more than refute this slander. He definitely aligns the Bible against the popular idea that a man may make a definite and conscious personal alliance with Satan for any purpose whatever. The agent of Satan is always a victim. Also the hint contained in this discussion that Satan has a kingdom, together with a few other not very definite allusions, are all that we have to go upon in this direction. Nor are we taught anywhere that Satan is able to any extent to introduce disorder into the physical universe or directly operate in the lives of men. It is true that in <a onClick="return mV(\'Luk\',13,16);">Lu 13:16</a> our Lord speaks of the woman who was bowed over as one "whom Satan has bound, lo, these eighteen years," and that in <a onClick="return mV(\'2Cr\',12,7);">2Co 12:7</a> Paul speaks of his infirmity as a "messenger of Satan sent to buffet him." Paul also speaks (<a onClick="return mV(\'1Th\',2,18);">1Th 2:18</a>) of Satan\'s hindering him from visiting the church at Thessalonica. A careful study of these related passages (together with the prologue of Job) will reveal the fact that Satan\'s direct agency in the physical world is very limited. Satan may be said to be implicated in all the disasters and woes of human life, in so far as they are more or less directly contingent upon sin (see particularly <a onClick="return mV(\'Hbr\',2,14);">Heb 2:14</a>) On the contrary, it is perfectly evident that Satan\'s power consists principally in his ability to deceive. It is interesting and characteristic that according to the Bible Satan is fundamentally a liar and his kingdom is a kingdom founded upon lies and deceit. The doctrine of Satan therefore corresponds in every important particular to the general Biblical emphasis upon truth. "The truth shall make you free" (<a onClick="return mV(\'Jhn\',8,32);">Joh 8:32</a>)—this is the way of deliverance from the power of Satan.<P>Now it would seem that to make Satan pre-eminently the deceiver would make man an innocent victim and thus relax the moral issue. But according to the Bible man is particeps criminis in the process of his own deception. He is deceived only because he ceases to love the truth and comes first to love and then to believe a lie (<a onClick="return mV(\'2Cr\',1,10);">2Co 1:10</a>). This really goes to the very bottom of the problem of temptation. Men are not tempted by evil, per se, but by a good which can be obtained only at the cost of doing wrong. The whole power of sin, at least in its beginnings, consists in the sway of the fundamental falsehood that any good is really attainable by wrongdoing. Since temptation consists in this attack upon the moral sense, man is constitutionally guarded against deceit, and is morally culpable in allowing himself to be deceived. The temptation of our Lord Himself throws the clearest possible light upon the methods ascribed to Satan and The temptation was addressed to Christ\'s consciousness of divine sonship; it was a deceitful attack emphasizing the good, minimizing or covering up the evil; indeed, twisting evil into good. It was a deliberate, malignant attempt to obscure the truth and induce to evil through the acceptance of falsehood. The attack broke against a loyalty to truth which made self-deceit, and consequently deceit from without, impossible. The lie was punctured by the truth and the temptation lost its power (see <a href="./study/isbe/search.html?string=TEMPTATION+OF+CHRIST">TEMPTATION OF CHRIST</a>). This incident reveals one of the methods of Satan—by immediate suggestion as in the case of Judas (<a onClick="return mV(\'Luk\',22,3);">Lu 22:3</a>; <a onClick="return mV(\'Jhn\',13,2,27);">Joh 13:2,27</a>). Sometimes, however, and, perhaps, most frequently, Satan\'s devices (<a onClick="return mV(\'2Cr\',2,11);">2Co 2:11</a>) include human agents. Those who are given over to evil and who persuade others to evil are children and servants of Satan (See <a onClick="return mV(\'Mat\',16,23);">Mt 16:23</a>; <a onClick="return mV(\'Mar\',8,33);">Mr 8:33</a>; <a onClick="return mV(\'Luk\',4,8);">Lu 4:8</a>; <a onClick="return mV(\'Jhn\',6,70);">Joh 6:70</a>; <a onClick="return mV(\'Jhn\',8,44);">8:44</a>; <a onClick="return mV(\'Act\',13,10);">Ac 13:10</a>; <a onClick="return mV(\'1Jo\',3,8);">1Joh 3:8</a>). Satan also works through persons and institutions supposed to be on the side of right but really evil. Here the same ever-present and active falseness and deceit are exhibited. When he is called "the god of this world" (<a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>) it would seem to be intimated that he has the power to clothe himself in apparently divine attributes. He also makes himself an angel of light by presenting advocates of falsehood in the guise of apostles of truth (<a onClick="return mV(\'2Cr\',11,13,15);">2Co 11:13,15</a>; <a onClick="return mV(\'1Jo\',4,1);">1Joh 4:1</a>; <a onClick="return mV(\'2Th\',2,9);">2Th 2:9</a>; <a onClick="return mV(\'Rev\',12,9);">Re 12:9</a>; <a onClick="return mV(\'Rev\',19,20);">19:20</a>). In the combination of passages here brought together, it is clearly indicated that Satan is the instigator and fomenter of that spirit of lawlessness which exhibits itself as hatred both of truth and right, and which has operated so widely and so disastrously in human life.<P>4. History of Satan:<P>The history of Satan, including that phase of it which remains to be realized, can be set forth only along the most general lines. He belongs to the angelic order of beings. He is by nature one of the sons of Elohim (<a onClick="return mV(\'Job\',1,6);">Job 1:6</a>). He has fallen, and by virtue of his personal forcefulness has become the leader of the anarchic forces of wickedness. As a free being he has merged his life in evil and has become altogether and hopelessly evil. As a being of high intelligence he has gained great power and has exercised a wide sway over other beings. As a created being the utmost range of his power lies within the compass of that which is permitted. It is, therefore, hedged in by the providential government of God and essentially limited. The Biblical emphasis upon the element of falsehood in the career of Satan might be taken to imply that his kingdom may be less in extent than appears. At any rate, it is confined to the cosmic sphere and to a limited portion of time. It is also doomed. In the closely related passages <a onClick="return mV(\'2Pe\',2,4);">2Pe 2:4</a> and <a onClick="return mV(\'Jud\',1,6);">Jude 1:6</a> it is affirmed that God cast the angels, when they sinned, down to Tartarus and committed them to pits of darkness, to be reserved unto judgment. This both refers to the constant divine control of these insurgent forces and also points to their final and utter destruction. The putting of Satan in bonds is evidently both constant and progressive. The essential limitation of the empire of evil and its ultimate overthrow are foreshadowed in the Book of Job (chapters <a onClick="return mV(\'Job\',38,\'1-\');">38-41</a>), where Yahweh\'s power extends even to the symbolized spirit of evil.<P>According to synoptic tradition, our Lord in the crisis of temptation immediately following the baptism (<a onClick="return mV(\'Mat\',4,\'1-\');">Mt 4</a> and parallel) met and for the time conquered Satan as His own personal adversary. This preliminary contest did not close the matter, but was the earnest of a complete victory. According to Luke (<a onClick="return mV(\'Luk\',10,18);">10:18</a>), when the Seventy returned from their mission flushed with victory over the powers of evil, Jesus said: \'I saw Satan fall (not "fallen"; see Plummer, "Luke," ICC, in the place cited.) as lightning from heaven.\' In every triumph over the powers of evil Christ beheld in vision the downfall of Satan. In connection with the coming of the Hellenists who wished to see Him, Jesus asserted (<a onClick="return mV(\'Jhn\',12,31);">Joh 12:31</a>), "Now is the judgment of this world: now shall the prince of this world be cast out." In view of His approaching passion He says again (<a onClick="return mV(\'Jhn\',14,30);">Joh 14:30</a>), "The prince of the world cometh: and he hath nothing in me." Once again in connection with the promised advent of the Spirit, Jesus asserted (<a onClick="return mV(\'Jhn\',16,11);">Joh 16:11</a>) that the Spirit would convict the world of judgment, "because the prince of this world hath been judged." In Hebrews (<a onClick="return mV(\'Hbr\',2,14,15);">2:14,15</A>) it is said that Christ took upon Himself human nature in order "that through death he might bring to nought him that had the power of death, that is, the Devil." In <a onClick="return mV(\'1Jo\',3,8);">1Joh 3:8</a> it is said, "To this end was the Son of God manifested, that he might destroy the works of the Devil." In <a onClick="return mV(\'Rev\',12,9);">Re 12:9</a> it is asserted, in connection with Christ\'s ascension, that Satan was cast down to the earth and his angels with him. According to the passage immediately following (<a onClick="return mV(\'Rev\',12,10,11,12);">12:10-12</a>), this casting down was not complete or final in the sense of extinguishing his activities altogether, but it involves the potential and certain triumph of God and His saints and the equally certain defeat of Satan. In <a onClick="return mV(\'1Jo\',2,13);">1Joh 2:13</a> the young men are addressed as those who "have overcome the evil one." In <a onClick="return mV(\'Rev\',20,\'1-\');">Re 20</a> the field of the future is covered in the assertion that Satan is "bound a thousand years"; then loosed "for a little time," and then finally "cast into the lake of fire."<P>A comparison of these passages will convince the careful student that while we cannot construct a definite chronological program for the career of Satan, we are clear in the chief points. He is limited, judged, condemned, imprisoned, reserved for judgment from the beginning. The outcome is certain though the process may be tedious and slow. The victory of Christ is the defeat of Satan; first, for Himself as Leader and Saviour of men (<a onClick="return mV(\'Jhn\',14,30);">Joh 14:30</a>); then, for believers (<a onClick="return mV(\'Luk\',22,31);">Lu 22:31</a>; <a onClick="return mV(\'Act\',26,18);">Ac 26:18</a>; <a onClick="return mV(\'Rom\',16,20);">Ro 16:20</a>; <a onClick="return mV(\'Jam\',4,7);">Jas 4:7</a>; <a onClick="return mV(\'1Jo\',2,13);">1Joh 2:13</a>; <a onClick="return mV(\'1Jo\',5,4,18);">5:4,18</a>); and, finally, for the whole world (<a onClick="return mV(\'Rev\',20,10);">Re 20:10</a>). The work of Christ has already destroyed the empire of Satan.<P>III. General Considerations.<P>There are, no doubt, serious difficulties in the way of accepting the doctrine of a personal, superhuman, evil power as Satan is described to be. It is doubtful, however, whether these diffificulties may not be due, at least in part, to a misunderstanding of the doctrine and certain of its implications. In addition, it must be acknowledged, that whatever difficulties there may be in the teaching, they are exaggerated and, at the same time, not fairly met by the vague and irrational skepticism which denies without investigation. There are difficulties involved in any view of the world. To say the least, some problems are met by the view of a superhuman, evil world-power. In this section certain general considerations are urged with a view to lessening difficulties keenly felt by some minds. Necessarily, certain items gathered in the foregoing section are here emphasized again.<P>1. Scripture Doctrine of Satan Not Systematized:<P>The Scriptural doctrine of Satan is nowhere systematically developed. For materials in this field we are shut up to scattered and incidental references. These passages, which even in the aggregate are not numerous, tell us what we need to know concerning the nature, history, kingdom and works of Satan, but offer scant satisfaction to the merely speculative temper. The comparative lack of development in this field is due partly to the fact that the Biblical writers are primarily interested in God, and only secondarily in the powers of darkness; and partly to the fact that in the Bible doctrine waits upon fact. Hence, the malign and sinister figure of the Adversary is gradually outlined against the light of God\'s holiness as progressively revealed in the providential world-process which centers in Christ. It is a significant fact that the statements concerning Satan become numerous and definite only in the New Testament. The daylight of the Christian revelation was necessary in order to uncover the lurking foe, dimly disclosed but by no means fully known in the earlier revelation. The disclosure of Satan is, in form at least, historical, not dogmatic.<P>2. Satan and God:<P>In the second place, the relationship of Satan to God, already emphasized, must be kept constantly in mind. The doctrine of Satan merges in the general doctrine concerning angels (see <a href="./study/isbe/search.html?string=ANGEL">ANGEL</a>). It has often been pointed out that the personal characteristics of angels are very little insisted upon. They are known chiefly by their functions: merged, on the one hand, in their own offices, and, on the other, in the activities of God Himself.<P>In the Old Testament Satan is not represented as a fallen and malignant spirit, but as a servant of Yahweh, performing a divine function and having his place in the heavenly train. In the parallel accounts of David\'s numbering of Israel (<a onClick="return mV(\'1Sa\',24,1);">1Sa 24:1</a>; <a onClick="return mV(\'1Ch\',21,1);">1Ch 21:1</a>) the tempting of David is attributed both to Yahweh and Satan. The reason for this is either that \'the temptation of men is also a part of his providence,\' or that in the interval between the documents the personality of the tempter has more clearly emerged. In this case the account in Chronicles would nearly approximate the New Testament teaching. In the Book of Job (<a onClick="return mV(\'Job\',1,6);">1:6</a>), however, Satan is among the Sons of God and his assaults upon Job are divinely permitted. In Zec (<a onClick="return mV(\'Zec\',3,1,2);">3:1,2</a>) Satan is also a servant of Yahweh. In both these passages there is the hint of opposition between Yahweh and Satan. In the former instance Satan assails unsuccessfully the character of one whom Yahweh honors; while in the latter Yahweh explicitly rebukes Satan for his attitude toward Israel (see G. A. Smith, BTP, II, 316f). The unveiling of Satan as a rebellious world-power is reserved for the New Testament, and with this fuller teaching the symbolic treatment of temptation in Genesis is to be connected. There is a sound pedagogical reason, from the viewpoint of revelation, for this earlier withholding of the whole truth concerning Satan. In the early stages of religious thinking it would seem to be difficult, if not impossible, to hold the sovereignty of God without attributing to His agency those evils in the world which are more or less directly connected with judgment and punishment (compare <a onClick="return mV(\'Isa\',45,7);">Isa 45:7</a>; <a onClick="return mV(\'Amo\',3,6);">Am 3:6</a>). The Old Testament sufficiently emphasizes man\'s responsibility for his own evil deeds, but super-human evil is brought upon him from above. "When willful souls have to be misled, the spirit who does so, as in Ahab\'s case, comes from above" (G. A. Smith, op. cit., 317). The progressive revelation of God\'s character and purpose, which more and more imperatively demands that the origin of moral evil, and consequently natural evil, must be traced to the created will in opposition to the divine will, leads to the ultimate declaration that Satan is a morally fallen being to whose conquest the Divine Power in history is pledged. There is, also, the distinct possibility that in the significant transition from the Satan of the Old Testament to that of the New Testament we have the outlines of a biography and an indication of the way by which the angels fell.<P>3. Satan Essentially Limited:<P>A third general consideration, based upon data given in the earlier section, should be urged in the same connection. In the New Testament delineation of Satan, his limitations are clearly set forth. He is superhuman, but not in any sense divine. His activities are cosmic, but not universal or transcendent. He is a created being. His power is definitely circumscribed. He is doomed to final destruction as a world-power. His entire career is that of a secondary and dependent being who is permitted a certain limited scope of power—a time-lease of activity (<a onClick="return mV(\'Luk\',4,6);">Lu 4:6</a>).<P>4. Conclusions:<P>These three general considerations have been grouped in this way because they dispose of three objections which are current against the doctrine of Satan.<P>(1) The first is, that it is mythological in origin. That it is not dogmatic is a priori evidence against this hypothesis. Mythology is primitive dogma. There is no evidence of a theodicy or philosophy of evil in the Biblical treatment of Satan. Moreover, while the Scriptural doctrine is unsystematic in form, it is rigidly limited in scope and everywhere essentially consistent. Even in the Apocalypse, where naturally more scope is allowed to the imagination, the same essential ideas appear. The doctrine of Satan corresponds, item for item, to the intellectual saneness and ethical earnestness of the Biblical world-view as a whole. It is, therefore, not mythological. The restraint of chastened imagination, not the extravagance of mythological fancy, is in evidence throughout the entire Biblical treatment of the subject. Even the use of terms current in mythology (as perhaps <a onClick="return mV(\'Gen\',3,1,13,14);">Ge 3:1,13,14</a>; <a onClick="return mV(\'Rev\',12,\'7-9\');">Re 12:7-9</a>; compare <a onClick="return mV(\'1Pe\',5,8);">1Pe 5:8</a>) does not imply more than a literary clothing of Satan in attributes commonly ascribed to malignant and disorderly forces.<P>(2) The second objection is that the doctrine is due to the influence of Persian dualism (see <a href="./study/isbe/search.html?string=PERSIAN+RELIGION">PERSIAN RELIGION</a>; <a href="./study/isbe/search.html?string=ZOROASTRIANISM">ZOROASTRIANISM</a>). The answer to this is plain, on the basis of facts already adduced. The Biblical doctrine of Satan is not dualistic. Satan\'s empire had a beginning, it will have a definite and permanent end. Satan is God\'s great enemy in the cosmic sphere, but he is God\'s creation, exists by divine will, and his power is relatively no more commensurate with God\'s than that of men. Satan awaits his doom. Weiss says (concerning the New Testament representation of conflict between God and the powers of evil): "There lies in this no Manichaean dualism,...but only the deepest experience of the work of redemption as the definite destruction of the power from which all sin in the world of men proceeds" (Biblical Theology New Testament, English tanslations of the Bible, II, 272; compare G.A. Smith, op. cit., II, 318).<P>(3) The third objection is practically the same as the second, but addressed directly to the doctrine itself, apart from the question of its origin, namely, that it destroys the unity of God. The answer to this also is a simple negative. To some minds the reality of created wills is dualistic and therefore untenable. But a true doctrine of unity makes room for other wills than God\'s—namely of those beings upon whom God has bestowed freedom. Herein stands the doctrine of sin and Satan. The doctrine of Satan no more militates against the unity of God than the idea, so necessary to morality and religion alike, of other created wills set in opposition to God\'s. Just as the conception of Satan merges, in one direction, in the general doctrine of angels, so, in the other, it blends with the broad and difficult subject of evil (compare "Satan," HDB, IV, 412a).<P>LITERATURE.<P>All standard works on Biblical Theology, as well as Dictionaries, etc., treat with more or less thoroughness the doctrine of Satan. The German theologians of the more evangelical type, such as Weiss, Lange, Martensen (Danish), Dorner, while exhibiting a tendency toward excessive speculation, discern the deeper aspects of the doctrine. Of monographs known to the writer none are to be recommended without qualification. It is a subject on which the Bible is its own best interpreter.``169';
isbe[7672]='Satan, Depths of`(ta bathea tou Satana): Found in <a onClick="return mV(\'Rev\',2,24);">Re 2:24</a>, and has reference to false teaching at Thyatira. It is a question (that perhaps may not be decided) whether tou Satana, "of Satan," represents the claim of the false teachers, or is thrown in by the Lord. Did those false teachers claim to know "the depths" of Satan? Or was it that they claimed to know "the depths" of Deity, and the Lord said it was rather "the depths of Satan"? In either case the antithesis to "depths of Satan" is "depths of God," as referred to in <a onClick="return mV(\'Rom\',11,33);">Ro 11:33</a>; <a onClick="return mV(\'1Cr\',2,10);">1Co 2:10</a>.``61';
isbe[7673]='Satan, Synagogue of`The expression occurs neither in the Hebrew nor in the Greek of the Old Testament, nor in Apocrypha. Three passages in the Old Testament and one in Apocrypha suggest the idea conveyed in the expression. In <a onClick="return mV(\'Num\',14,27,35);">Nu 14:27,35</a>, Yahweh expresses His wrath against "the evil congregation" Septuagint sunagoge ponera) which He threatens to consume in the wilderness. In <a onClick="return mV(\'Psa\',21,16);">Ps 21 (22):16</a>, we find, "A company of evil doers (the Septuagint sunagoge ponereuomenon) have enclosed me." In Sirach 16:6, we read, "In the congregation of sinners (the Septuagint sunagoge hamartolon) shall a fire be kindled."<P>Only in the New Testament occurs the phrase "synagogue of Satan," and here only twice (<a onClick="return mV(\'Rev\',2,9);">Re 2:9</a>; <a onClick="return mV(\'Rev\',3,9);">3:9</a>). Three observations are evident as to who constituted "the synagogue of Satan" in Smyrna and Philadelphia.<P>(1) They claimed to be Jews, i.e. they were descendants of Abraham, and so laid claim to the blessings promised by Yahweh to him and his seed.<P>(2) But they are not regarded by John as real Jews, i.e. they are not the genuine Israel of God (the same conclusion as Paul reached in <a onClick="return mV(\'Rom\',2,28);">Ro 2:28</a>).<P>(3) They are persecutors of the Christians in Smyrna.<P>The Lord "knows their blasphemy," their sharp denunciations of Christ and Christians. They claim to be the true people of God, but really they are "the synagogue of Satan." The gen. Satana, is probably the possessive gen. These Jewish persecutors, instead of being God\'s people, are the "assembly of Satan," i.e. Satan\'s people.<P>In Polycarp, Mar. xvii.2 (circa 155 AD) the Jews of Smyrna were still persecutors of Christians and were conspicuous in demanding and planning the martyrdom of Polycarp the bishop of Smyrna, the same city in which the revelator calls persecuting Jews "the assembly of Satan."<P>In the 2nd century, in an inscription (CIJ, 3148) describing the classes of population in Smyrna, we find the expression hoi pote Ioudaioi, which Mommsen thinks means "Jews who had abandoned their religion," but which Ramsay says "probably means those who formerly were the nation of the Jews, but have lost the legal standing of a separate people."<P>LITERATURE.<P>Ramsay, The Seven Churches of Asia, chapter xii; Swete, The Apocalypse of John,31,32; Polycarp, Mar. xiiiff.17,2; Mommsen, Historische Zeitschrift, XXXVII, 417.``194';
