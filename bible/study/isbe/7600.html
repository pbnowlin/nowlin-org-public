isbe[7631]='Sanabassar; Sanabassarus`san-a-bas\'-ar, san-a-bas\'-a-rus (in 1Esdras 2:12,15), (in 1Esdras 6:18,10; a name appearing in many variations, Codex Alexandrinus always reading Sanabassaros; Codex Vaticanus Sanamassaro, in 1Esdras 2:12(11) (the Revised Version margin, Samanassar), Samanassarou, in 1Esdras 2:15(14), but Sabanassaro, in 1Esdras 6:18 (17) (Revised Version margin) and Sanabassaros, in 1Esdras 6:20 (19)): He was "governor of Judea" under Cyrus, conveyed the holy vessels of the temple from Babylon to Jerusalem and "laid the foundations of the house of the Lord" for the first time since its destruction (1Esdras 2:12,15; 6:18-20) = "<a href="./study/isbe/search.html?string=SHESHBAZZAR">SHESHBAZZAR</a> (which see) the prince of Judah" (<a onClick="return mV(\'Ezr\',1,8);">Ezr 1:8</a>).<P>Some identify him with Zerubbabel as the King James Version margin in 1Esdras 6:18: "Z., which is also Sanabassar the ruler." This view appears to be favored by the order of the words here, where, in case of two persons, one might expect "Sanabassar the ruler" to come first. Zerubbabel appears as "governor of Judea" also in 1Esdras 6:27-29. <a onClick="return mV(\'Ezr\',3,10);">Ezr 3:10</a> speaks of the foundation of the temple under Zerubbabel and <a onClick="return mV(\'Ezr\',5,16);">5:16</a> as under Sheshbazzar. There is further the analogy of 1Esdras 5:40, where Nehemias and Attharias refer to the same person. Against this identification: Zerubbabel is not styled ruler or governor either in Nehemiah or Ezra, but in <a onClick="return mV(\'Hag\',1,14);">Hag 1:14</a>; <a onClick="return mV(\'Hag\',2,2,21);">2:2,21</a> he is pechah or governor of Judah; no explanation is given of the double name, as in the case of e.g. Daniel, Belteshazzar; the language of <a onClick="return mV(\'Ezr\',5,14);">Ezr 5:14</a>f seems to refer to work commenced under a different person than Zerubbabel. Nor is there any reason against supposing a first return under Sheshbazzar (Sanabassar) and a foundation of the temple previous to the time of Zerubbabel—an undertaking into which the Jews did not enter heartily, perhaps because Sanabassar may have been a foreigner (though it is uncertain whether he was a Babylonian, a Persian, or a Jew). A later proposal is to identify Sanabassar with Shenazzar, the uncle of Zerubbabel in <a onClick="return mV(\'1Ch\',3,18);">1Ch 3:18</a>. But either of these identifications must remain doubtful.`<a href="./study/isbe/search.html?string=SHENAZZAR">SHENAZZAR</a>; <a href="./study/isbe/search.html?string=ZERUBBABEL">ZERUBBABEL</a>`5';
isbe[7632]='Sanasib`san\'-a-sib (Fritzsche, Sanasib, but Codex Vaticanus and Swete, Sanabeis; Codex Alexandrinus Anaseib): Found only in 1Esdras 5:24, where the sons of Jeddu, the son of Jesus, are a priestly family returning "among the sons of Sanasib." The name is not found in the parallel <a onClick="return mV(\'Ezr\',2,36);">Ezr 2:36</a>; <a onClick="return mV(\'Neh\',7,39);">Ne 7:39</a>, and is perhaps preserved in the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) "Eliasib."``1';
isbe[7633]='Sanballat`san-bal\'-at (canebhallaT; Greek and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) Sanaballat; Peshitta, Samballat): Sanballat the Horonite was, if the appellation which follows his name indicates his origin, a Moabite of Horonaim, a city of Moab mentioned in <a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>; <a onClick="return mV(\'Jer\',48,2,5,34);">Jer 48:2,5,34</a>; Josephus, Ant, XIII, xxiii; XIV, ii. He is named along with Tobiah, the Ammonite slave (<a onClick="return mV(\'Neh\',4,1);">Ne 4:1</a>), and Geshem the Arabian (<a onClick="return mV(\'Neh\',6,1);">Ne 6:1</a>) as the leading opponent of the Jews at the time when Nehemiah undertook to rebuild the walls of Jerusalem (<a onClick="return mV(\'Neh\',2,10);">Ne 2:10</a>; <a onClick="return mV(\'Neh\',4,1);">4:1</a>; <a onClick="return mV(\'Neh\',6,1);">6:1</a>). He was related by marriage to the son of Eliashib, the high priest at the time of the annulment of the mixed marriages forbidden by the Law (<a onClick="return mV(\'Neh\',13,28);">Ne 13:28</a>).<P>Renewed interest has been awakened in Sanballat from the fact that he is mentioned in the papyri I and II of Sachau (Die aramaischen Papyrusurkunden aus Elephantine, Berlin,1908,and in his later work, Aramaische Papyrus und Ostraka, Leipzig, 1911; compare Staerk\'s convenient edition in Lietzmanns Kleine Texte, <span class="noTag">Number 32</span>, 1908) as having been the governor (pachath) of Samaria some time before the 17th year of Darius (Nothus), i.e. 408-407 BC, when Bagohi was governor of Judah. His two sons, Delaiah and Shelemiah, received a letter from Jedoniah and his companions the priests who were in Yeb (Elephantine) in Upper Egypt. This letter contained information concerning the state of affairs in the Jewish colony of Yeb, especially concerning the destruction of the temple or synagogue (agora) which had been erected at that place.<P>The address of this letter reads as follows: "To our lord Bagohi, the governor of Judea, his servants Jedoniah and his companions, the priests in the fortress of Yeb (Elephantine). May the God of Heaven inquire much at every time after the peace of our lord and put thee in favor before Darius the king," etc. The conclusion of the letter reads thus: "Now, thy servants, Jedoniah and his companions and the Jews, all citizens of Yeb, say thus: If it seems good to our lord, mayest thou think on the rebuilding of that temple (the agora which had been destroyed by the Egyptians). Since it has not been permitted us to rebuild it, do thou look on the receivers of thy benefactions and favors here in Egypt. Let a letter with regard to the rebuilding of the temple of the God Jaho in the fortress of Yeb, as it was formerly built, be sent from thee. In thy name will they offer the meal offerings, the incense, and the burnt offerings upon the altar of the God Jaho; and we shall always pray for thee, we and our wives and our children and all the Jews found here, until the temple has been rebuilt. And it will be to thee a meritorious work (tsedhaqah) in the sight of Jaho, the God of Heaven, greater than the meritorious work of a man who offers to him a burnt offering and a sacrifice of a value equal to the value of 1,000 talents of silver. And as to the gold (probably that which was sent by the Jews to Bagohi as a baksheesh) we have sent word and given knowledge. Also, we have in our name communicated in a letter all (these) matters unto Delaiah and Shelemiah, the sons of Sanballat, governor of Samaria. Also, from all that has been done to us, Arsham (the satrap of Egypt) has learned nothing.<P>The 20th of Marcheshvan in the 17th year of Darius the king." Sanballat is the Babylonian Sin-uballit, "may Sin give him life," a name occurring a number of times in the contract tablets from the time of Nebuchadnezzar, Nabonidus, and Darius Hystaspis. (See Tallquist, Neubabylonisches Namenbuch, 183.)``196';
isbe[7634]='Sanctification`sank-ti-fi-ka\'-shun:<P>Etymology<P><b>I. THE FORMAL SENSE</b><P class="in15">1. In the Old Testament<P class="in15">2. In the New Testament<P><b>II. THE ETHICAL SENSE</b><P class="in15">1. Transformation of Formal to Ethical Idea<P class="in15">2. Our Relation to God as Personal: New Testament Idea<P class="in15">3. Sanctification as God\'s Gift<P class="in15">4. Questions of Time and Method<P class="in15">5. An Element in All Christian Life<P class="in15">6. Follows from Fellowship with God<P class="in15">7. Is It Instantaneous and Entire?<P class="in15">8. Sanctification as Man\'s Task<P><b>LITERATURE</b><hr /><P>Etymology:<P>The root is found in the Old Testament in the Hebrew verb qadhash, in the New Testament in the Greek verb hagoazo. The noun "sanctification" (hagiasmos) does not occur in the Old Testament and is found but 10 times in the New Testament, but the roots noted above appear in a group of important words which are of very frequent occurrence. These words are "holy," "hallow," "hallowed," "holiness," "consecrate," "saint," "sanctify," "sanctification." It must be borne in mind that these words are all translations of the same root, and that therefore no one of them can be treated adequately without reference to the others. All have undergone a certain development. Broadly stated, this has been from the formal, or ritual, to the ethical, and these different meanings must be carefully distinguished.<P>I. The Formal Sense.<P>By sanctification is ordinarily meant that hallowing of the Christian believer by which he is freed from sin and enabled to realize the will of God in his life. This is not, however, the first or common meaning in the Scriptures. To sanctify means commonly to make holy, that is, to separate from the world and consecrate to God.<P>1. In the Old Testament:<P>To understand this primary meaning we must go back to the word "holy" in the Old Testament. That is holy which belongs to Yahweh. There is nothing implied here as to moral character. It may refer to days and seasons, to places, to objects used for worship, or to persons. Exactly the same usage is shown with the word "sanctify." To sanctify anything is to declare it as belonging to God. "Sanctify unto me all the first-born...it is mine" (<a onClick="return mV(\'Exd\',13,2);">Ex 13:2</a>; compare <a onClick="return mV(\'Num\',3,13);">Nu 3:13</a>; <a onClick="return mV(\'Num\',8,17);">8:17</a>). It applies thus to all that is connected with worship, to the Levites (<a onClick="return mV(\'Num\',3,12);">Nu 3:12</a>), the priests and the tent of meeting (<a onClick="return mV(\'Exd\',29,44);">Ex 29:44</a>), the altar and all that touches it (<a onClick="return mV(\'Exd\',29,36);">Ex 29:36</a>f), and the offering (<a onClick="return mV(\'Exd\',29,27);">Ex 29:27</a>; compare 2Ma 2:18; Ecclesiasticus 7:31). The feast and holy days are to be sanctified, that is, set apart from ordinary business as belonging to Yahweh (the Sabbath, <a onClick="return mV(\'Neh\',13,\'19-22\');">Ne 13:19-22</a>; a fast, <a onClick="return mV(\'Joe\',1,14);">Joe 1:14</a>). So the nation as a whole is sanctified when Yahweh acknowledges it and receives it as His own, "a kingdom of priests, and a holy nation" (<a onClick="return mV(\'Exd\',19,5,6);">Ex 19:5,6</a>). A man may thus sanctify his house or his field (<a onClick="return mV(\'Lev\',27,14,16);">Le 27:14,16</a>), but not the firstling of the flock, for this is already Yahweh\'s (<a onClick="return mV(\'Lev\',27,26);">Le 27:26</a>).<P>It is this formal usage without moral implication that explains such a passage as <a onClick="return mV(\'Gen\',38,21);">Ge 38:21</a>. The word translated "prostitute" here is from the same root qadhash, meaning literally, as elsewhere, the sanctified or consecrated one (qedheshah; see margin and compare <a onClick="return mV(\'Deu\',23,18);">De 23:18</a>; <a onClick="return mV(\'1Ki\',14,24);">1Ki 14:24</a>; <a onClick="return mV(\'Hsa\',4,14);">Ho 4:14</a>). It is the hierodule, the familiar figure of the old pagan temple, the sacred slave consecrated to the temple and the deity for immoral purposes. The practice is protested against in Israel (<a onClick="return mV(\'Deu\',23,17);">De 23:17</a>f), but the use of the term illustrates clearly the absence of anything essentially ethical in its primary meaning (compare also <a onClick="return mV(\'2Ki\',10,20);">2Ki 10:20</a>, "And Jehu said, Sanctify a solemn assembly for Baal. And they proclaimed it"; compare <a onClick="return mV(\'Joe\',1,14);">Joe 1:14</a>).<P>Very suggestive is the transitive use of the word in the phrase, "to sanctify Yahweh." To understand this we must note the use of the word "holy" as applied to Yahweh in the Old Testament. Its meaning is not primarily ethical. Yahweh\'s holiness is His supremacy, His sovereignty, His glory, His essential being as God. To say the Holy One is simply to say God. Yahweh\'s holiness is seen in His might, His manifested glory; it is that before which peoples tremble, which makes the nations dread (<a onClick="return mV(\'Exd\',15,\'11-18\');">Ex 15:11-18</a>; compare <a onClick="return mV(\'1Sa\',6,20);">1Sa 6:20</a>; <a onClick="return mV(\'Psa\',68,35);">Ps 68:35</a>; <a onClick="return mV(\'Psa\',89,7);">89:7</a>; <a onClick="return mV(\'Psa\',99,2,3);">99:2,3</a>). Significant is the way in which "jealous" and "holy" are almost identified (<a onClick="return mV(\'Jos\',24,19);">Jos 24:19</a>; <a onClick="return mV(\'Eze\',38,23);">Eze 38:23</a>). It is God asserting His supremacy, His unique claim. To sanctify Yahweh, therefore, to make Him holy, is to assert or acknowledge or bring forth His being as God, His supreme power and glory, His sovereign claim. Ezekiel brings this out most clearly. Yahweh has been profaned in the eyes of the nations through Israel\'s defeat and captivity. True, it was because of Israel\'s sins, but the nations thought it was because of Yahweh\'s weakness. The ethical is not wanting in these passages. The people are to be separated from their sins and given a new heart (<a onClick="return mV(\'Eze\',36,25,26,33);">Eze 36:25,26,33</a>). But the word "sanctify" is not used for this. It is applied to Yahweh, and it means the assertion of Yahweh\'s power in Israel\'s triumph and the conquest of her foes (<a onClick="return mV(\'Eze\',20,41);">Eze 20:41</a>; <a onClick="return mV(\'Eze\',28,25);">28:25</a>; <a onClick="return mV(\'Eze\',36,23);">36:23</a>; <a onClick="return mV(\'Eze\',38,16);">38:16</a>; <a onClick="return mV(\'Eze\',39,27);">39:27</a>). The sanctification of Yahweh is thus the assertion of His being and power as God, just as the sanctification of a person or object is the assertion of Yahweh\'s right and claim in the same.<P>The story of the waters of Meribah illustrates the same meaning. Moses\' failure to sanctify Yahweh is his failure to declare Yahweh\'s glory and power in the miracle of the waters (<a onClick="return mV(\'Num\',20,12,13);">Nu 20:12,13</a>; <a onClick="return mV(\'Num\',27,14);">27:14</a>; <a onClick="return mV(\'Deu\',32,51);">De 32:51</a>). The story of Nadab and Abihu points the same way. Here "I will be sanctified" is the same as "I will be glorified" (<a onClick="return mV(\'Lev\',10,\'1-3\');">Le 10:1-3</a>). Not essentially different is the usage in <a onClick="return mV(\'Isa\',5,16);">Isa 5:16</a>: "Yahweh of hosts is exalted in justice, and God the Holy One is sanctified in righteousness." Holiness again is the exaltedness of God, His supremacy, which is seen here in the judgment (justice, righteousness) meted out to the disobedient people (compare the recurrent refrain of <a onClick="return mV(\'Isa\',5,25);">Isa 5:25</a>; <a onClick="return mV(\'Isa\',9,12,17,21);">9:12,17,21</a>; <a onClick="return mV(\'Isa\',10,4);">10:4</a>; see <a href="./study/isbe/search.html?string=JUSTICE">JUSTICE</A>). <a onClick="return mV(\'Isa\',8,13);">Isa 8:13</a>; <a onClick="return mV(\'Isa\',29,23);">29:23</a> suggest the same idea by the way in which they relate "sanctify" to fear and awe. One New Testament passage brings us the same meaning (<a onClick="return mV(\'1Pe\',3,15);">1Pe 3:15</a>): "Sanctify in your hearts Christ as Lord," that is, exalt Him as supreme.<P>2. In the New Testament:<P>In a few New Testament passages the Old Testament ritual sense reappears, as when Jesus speaks of the temple sanctifying the gold, and the altar the gift (<a onClick="return mV(\'Mat\',23,17,19);">Mt 23:17,19</a>; compare also <a onClick="return mV(\'Hbr\',9,13);">Heb 9:13</a>; <a onClick="return mV(\'1Ti\',4,5);">1Ti 4:5</a>). The prevailing meaning is that which we found in the Old Testament. To sanctify is to consecrate or set apart. We may first take the few passages in the Fourth Gospel. As applied to Jesus in <a onClick="return mV(\'Jhn\',10,36);">Joh 10:36</a>; <a onClick="return mV(\'Jhn\',17,19);">17:19</a>, sanctify cannot mean to make holy in the ethical sense. As the whole context shows, it means to consecrate for His mission in the world. The reference to the disciples, "that they themselves also may be sanctified in truth," has both meanings: that they may be set apart, (for Jesus sends them, as the Father sends Him), and that they may be made holy in truth.<P>This same meaning of consecration, or separation, appears when we study the word saint, which is the same as "sanctified one." Aside from its use in the Psalms, the word is found mainly in the New Testament. Outside the Gospels, where the term "disciples" is used, it is the common word to designate the followers of Jesus, occurring some 56 times. By "saint" is not meant the morally perfect, but the one who belongs to Christ, just as the sanctified priest or offering belonged to Yahweh. Thus Paul can salute the disciples at Corinth as saints and a little later rebuke them as carnal and babes, as those among whom are jealousy and strife, who walk after the manner of men (<a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>; <a onClick="return mV(\'1Cr\',3,\'1-3\');">3:1-3</a>). In the same way the phrase "the sanctified" or "those that are sanctified" is used to designate the believers. By "the inheritance among all them that are sanctified" is meant the heritage of the Christian believer (<a onClick="return mV(\'Act\',20,32);">Ac 20:32</a>; <a onClick="return mV(\'Act\',26,18);">26:18</a>; compare <a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>; <a onClick="return mV(\'1Cr\',6,11);">6:11</a>; <a onClick="return mV(\'Eph\',1,18);">Eph 1:18</a>; <a onClick="return mV(\'Col\',1,12);">Col 1:12</a>). This is the meaning in Hebrews, which speaks of the believer as being sanctified by the blood of Christ. In 10:29 the writer speaks of one who has fallen away, who "hath counted the blood of the covenant wherewith he was sanctified an unholy thing." Evidently it is not the inner and personal holiness of this apostate that is referred to, especially in view of the tense, but that he had been separated unto God by this sacrificial blood and had then counted the holy offering a common thing. The contrast is between sacred and common, not between moral perfection and sin (compare <a onClick="return mV(\'Hbr\',10,10);">10:10</a>; <a onClick="return mV(\'Hbr\',13,12);">13:12</A>). The formal meaning appears again in <a onClick="return mV(\'1Cr\',7,\'12-14\');">1Co 7:12-14</a>, where the unbelieving husband is said to be sanctified by the wife, and vice versa. It is not moral character that is meant here, but a certain separation from the profane and unclean and a certain relation to God. This is made plain by the reference to the children: "Else were your children unclean; but now are they holy." The formal sense is less certain in other instances where we have the thought of sanctification in or by the Holy Spirit or in Christ; as in <a onClick="return mV(\'Rom\',15,16);">Ro 15:16</a>, "being sanctified by the Holy Spirit"; <a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>, to "them that are sanctified in Christ Jesus"; <a onClick="return mV(\'1Pe\',1,2);">1Pe 1:2</a>, "in sanctification of the Spirit." Paul\'s doctrine of the Spirit as the new life in us seems to enter in here, and yet the reference to 1 Corinthians suggests that the primary meaning is still that of setting apart, the relating to God.<P>II. The Ethical Sense.<P>We have been considering so far what has been called the formal meaning of the word; but the chief interest of Christian thought lies in the ethical idea, sanctification considered as the active deed or process by which the life is made holy.<P>1. Transformation of Formal to Ethical Idea:<P>Our first question is, How does the idea of belonging to God become the idea of transformation of life and character? The change is, indeed, nothing less than a part of the whole movement for which the entire Scriptures stand as a monument. The ethical is not wanting at the beginning, but the supremacy of the moral and spiritual over against the formal, the ritual, the ceremonial, the national, is the clear direction in which the movement as a whole tends. Now the pivot of this movement is the conception of God. As the thought of God grows more ethical, more spiritual, it molds and changes all other conceptions. Thus what it means to belong to God (holiness, sanctification) depends upon the nature of the God to whom man belongs. The hierodules of Corinth are women of shame because of the nature of the goddess to whose temple they belong. The prophets caught a vision of Yahweh, not jealous for His prerogative, not craving the honor of punctilious and proper ceremonial, but with a gracious love for His people and a passion for righteousness. Their great message is: This now is Yahweh; hear what it means to belong to such a God and to serve Him. "What unto me is the multitude of your sacrifices?...Wash you, make you clean;...seek justice, relieve the oppressed" (<a onClick="return mV(\'Isa\',1,11,16,17);">Isa 1:11,16,17</a>). "When Israel was a child, then I loved him....I desire goodness, and not sacrifice; and the knowledge of God more than bunt-offerings" (<a onClick="return mV(\'Hsa\',11,1);">Ho 11:1</a>; <a onClick="return mV(\'Hsa\',6,6);">6:6</a>).<P>In this way the formal idea that we have been considering becomes charged with moral meaning. To belong to God, to be His servant, His son, is no mere external matter. Jesus\' teaching as to sonship is in point here. The word "sanctification" does not occur in the Synoptic Gospels at all, but "sonship" with the Jews expressed this same relation of belonging. For them it meant a certain obedience on the one hand, a privilege on the other. Jesus declares that belonging to God means likeness to Him, sonship is sharing His spirit of loving good will (<a onClick="return mV(\'Mat\',5,\'43-48\');">Mt 5:43-48</a>). Brother and sister for Jesus are those who do God\'s will (<a onClick="return mV(\'Mar\',3,35);">Mr 3:35</a>). Paul takes up the same thought, but joins it definitely to the words "saint" and "sanctify." The religious means the ethical, those "that are sanctified" are "called to be saints" (<a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>). The significant latter phrase is the same as in <a onClick="return mV(\'Rom\',1,1);">Ro 1:1</a>, "Paul...called to be an apostle." In this light we read <a onClick="return mV(\'Eph\',4,1);">Eph 4:1</a>, "Walk worthily of the calling wherewith ye were called." Compare <a onClick="return mV(\'1Th\',2,12);">1Th 2:12</a>; <a onClick="return mV(\'Phl\',1,27);">Php 1:27</a>. And the end of this calling is that we are "foreordained to be conformed to the image of his Son" (<a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>). We must not limit ourselves to the words "saint" or "sanctify" to get this teaching with Paul. It is his constant and compelling moral appeal: You belong to Christ; live with Him, live unto Him (<a onClick="return mV(\'Col\',3,\'1-4\');">Col 3:1-4</a>; <a onClick="return mV(\'1Th\',5,10);">1Th 5:10</a>). It is no formal belonging, no external surrender. It is the yielding of the life in its passions and purposes, in its deepest affections and highest powers, to be ruled by a new spirit (<a onClick="return mV(\'Eph\',4,13,20,23,24,32);">Eph 4:13,20,23,24,32</a>; compare <a onClick="return mV(\'Rom\',12,1);">Ro 12:1</a>).<P>2. Our Relation to God as Personal: New Testament Idea:<P>But we do not get the full meaning of this thought of sanctification as consecration, or belonging, until we grasp the New Testament thought of our relation to God as personal. The danger has always been that this consecration should be thought of in a negative or passive way. Now the Christian\'s surrender is not to an outer authority but to an inner, living fellowship. The sanctified life is thus a life of personal fellowship lived out with the Father in the spirit of Christ in loving trust and obedient service. This positive and vital meaning of sanctification dominates Paul\'s thought. He speaks of living unto God, of living to the Lord, and most expressively of all, of being alive unto God (<a onClick="return mV(\'Rom\',14,8);">Ro 14:8</a>; compare <a onClick="return mV(\'Rom\',6,13);">Ro 6:13</a>; <a onClick="return mV(\'Gal\',2,19);">Ga 2:19</a>). So completely is his life filled by this fellowship that he can say, "It is no longer I that live, but Christ liveth in me" (<a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>). But there is no quietism here. It is a very rich and active life, this life of fellowship to which we are surrendered. It is a life of sonship in trust and love, with the spirit that enables us to say "Abba, Father" (<a onClick="return mV(\'Rom\',8,15);">Ro 8:15</a>; <a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>). It is a life of unconquerable kindness and good will (<a onClick="return mV(\'Mat\',5,\'43-48\');">Mt 5:43-48</a>). It is a life of "faith working through love" (<a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>), it is having the mind of Christ (<a onClick="return mV(\'Phl\',2,5);">Php 2:5</a>). The sanctified life, then, is the life so fully surrendered to fellowship with Christ day by day that inner spirit and outward expression are ruled by His spirit.<P>3. Sanctification as God\'s Gift:<P>We come now to that aspect which is central for Christian interest, sanctification as the making holy of life, not by our act, but by God\'s deed and by God\'s gift. If holiness represents the state of heart and life in conformity with God\'s will, then sanctification is the deed or process by which that state is wrought. And this deed we are to consider now as the work of God. Jesus prays that the Father may sanctify His disciples in truth (<a onClick="return mV(\'Jhn\',17,17);">Joh 17:17</a>). So Paul prays for the Thessalonians (<a onClick="return mV(\'1Th\',5,23);">1Th 5:23</a>), and declares that Christ is to sanctify His church (compare <a onClick="return mV(\'Rom\',6,22);">Ro 6:22</a>; <a onClick="return mV(\'2Th\',2,13);">2Th 2:13</a>; <a onClick="return mV(\'2Ti\',2,21);">2Ti 2:21</a>; <a onClick="return mV(\'1Pe\',1,2);">1Pe 1:2</a>). Here sanctification means to make clean or holy in the ethical sense, though the idea of consecration is not necessarily lacking. But aside from special passages, we must take into account the whole New Testament teaching, according to which every part of the Christian life is the gift of God and wrought by His Spirit. "It is God that worketh in you both to will and to work" (<a onClick="return mV(\'Phl\',2,13);">Php 2:13</a>; compare <a onClick="return mV(\'Rom\',8,\'2-4\',9,14,\'16-26\');">Ro 8:2-4,9,14,16-26</a>; <a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>f). Significant is the use of the words "creature" ("creation," see margin) and "workmanship" with Paul (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>; <a onClick="return mV(\'Gal\',6,15);">Ga 6:15</a>; <a onClick="return mV(\'Eph\',2,10);">Eph 2:10</a>; <a onClick="return mV(\'Eph\',4,24);">4:24</a>). The new life is God\'s second work of creation.<P>4. Questions of Time and Method:<P>When we ask, however, when and how this work is wrought, there is no such clear answer. What we have is on the one hand uncompromising ideal and demand, and on the other absolute confidence in God. By adding to these two the evident fact that the Christian believers seen in the New Testament are far from the attainment of such Christian perfection, some writers have assumed to have the foundation here for the doctrine that the state of complete holiness of life is a special experience in the Christian life wrought in a definite moment of time. It is well to realize that no New Testament passages give a specific answer to these questions of time and method, and that our conclusions must be drawn from the general teaching of the New Testament as to the Christian life.<P>5. An Element in All Christian Life:<P>First, it must be noted that in the New Testament view sanctification in the ethical sense is an essential element and inevitable result of all Christian life and experience. Looked at from the religious point of view, it follows from the doctrine of regeneration. Regeneration is the implanting of a new life in man. So far as that is a new life from God it is ipso facto holy. The doctrine of the Holy Spirit teaches the same (see <a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>). There is no Christian life from the very beginning that is not the work of the Spirit. "No man can (even) say, Jesus is Lord, but in the...Spirit" (<a onClick="return mV(\'1Cr\',12,3);">1Co 12:3</a>). But this Spirit is the Holy Spirit, whether with Paul we say Spirit of Christ or Spirit of God (<a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>). His presence, therefore, in so far forth means holiness of life. From the ethical standpoint the same thing is constantly declared. Jesus builds here upon the prophets: no religion without righteousness; clean hands, pure hearts, deeds of mercy are not mere conditions of worship, but joined to humble hearts are themselves the worship that God desires (<a onClick="return mV(\'Amo\',5,\'21-25\');">Am 5:21-25</a>; <a onClick="return mV(\'Mic\',6,\'6-8\');">Mic 6:6-8</a>). Jesus deepened the conception, but did not, change it, and Paul was true to this succession. "If any man hath not the Spirit of Christ, he is none of his. And if Christ is in you,...the spirit is life because of righteousness" (<a onClick="return mV(\'Rom\',8,9,10);">Ro 8:9,10</a>). There is nothing in Paul\'s teaching to suggest that sanctification is the special event of a unique experience, or that there are two kinds or qualities of sanctification. All Christian living meant for him clean, pure, right living, and that was sanctification. The simple, practical way in which he attacks the bane of sexual impurity in his pagan congregations shows this. "This is the will of God, even your sanctification, that ye abstain from fornication; that each one of you know how to possess himself of his own vessel in sanctification and honor. For God called us not for uncleanness, but in sanctification" (<a onClick="return mV(\'1Th\',4,3,4,7);">1Th 4:3,4,7</a>). The strength of Paul\'s teaching, indeed, lies here in this combination of moral earnestness with absolute dependence upon God.<P>6. Follows from Fellowship with God:<P>The second general conclusion that we draw from the New Testament teaching as to the Christian life is this: the sanctification which is a part of all Christian living follows from the very nature of that life as fellowship with God. Fundamental here is the fact that the Christian life is personal, that nothing belongs in it which cannot be stated in personal terms. It is a life with God in which He graciously gives Himself to us, and which we live out with Him and with our brothers in the spirit of Christ, which is His Spirit. The two great facts as to this fellowship are, that it is God\'s gift, and that its fruit is holiness. First, it is God\'s gift. What God gives us is nothing less than Himself. The gift is not primarily forgiveness, nor victory over sin, nor peace of soul, nor hope of heaven. It is fellowship with Him, which includes all of these and without which none of these can be. Secondly, the fruit of this fellowship is holiness. The real hallowing of our life can come in no other way. For Christian holiness is personal, not something formal or ritual, and its source and power can be nothing lower than the personal. Such is the fellowship into which God graciously lifts the believer. Whatever its mystical aspects, that fellowship is not magical or sacramental. It is ethical through and through. Its condition on our side is ethical. For Christian faith is the moral surrender of our life to Him in whom truth and right come to us with authority to command. The meaning of that surrender is ethical; it is opening the life to definite moral realities and powers, to love, meekness, gentleness, humility, reverence, purity, the passion for righteousness, to that which words cannot analyze but which we know as the Spirit of Christ. Such a fellowship is the supreme moral force for the molding of life. An intimate human fellowship is an analogue of this, and we know with what power it works on life and character. It cannot, however, set forth either the intimacy or the power of this supreme and final relation where our Friend is not another but is our real self. So much we know: this fellowship means a new spirit in us, a renewed and daily renewing life.<P>It is noteworthy that Paul has no hard-and-fast forms for this life. The reality was too rich and great, and his example should teach us caution in the insistence upon theological forms which may serve to compress the truth instead of expressing it. Here are some of his expressions for this life in us: to "have the mind of Christ" (<a onClick="return mV(\'1Cr\',2,16);">1Co 2:16</a>; <a onClick="return mV(\'Phl\',2,5);">Php 2:5</a>), "the Spirit of Christ" (<a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>), "Christ is in you" (<a onClick="return mV(\'Rom\',8,10);">Ro 8:10</a>), "the spirit which is from God" (<a onClick="return mV(\'1Cr\',2,12);">1Co 2:12</a>), "the Spirit of God" (<a onClick="return mV(\'1Cr\',3,16);">1Co 3:16</a>), "the Holy Spirit" (<a onClick="return mV(\'1Cr\',6,19);">1Co 6:19</a>), "the Spirit of the Lord" (<a onClick="return mV(\'2Cr\',3,17);">2Co 3:17</a>), "the Lord the Spirit" (<a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>). But in all this one fact stands out, this life is personal, a new spirit in us, and that spirit is one that we have in personal fellowship with God; it is His Spirit. Especially significant is the way in which Paul relates this new life to Christ. We have already noted that Paul uses indifferently "Spirit of God" and "Spirit of Christ," and that in the same passage (<a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>). Paul\'s great contribution to the doctrine of the Holy Spirit lies here. As he states it in <a onClick="return mV(\'2Cr\',3,17);">2Co 3:17</a>: "Now the Lord is the Spirit." With that the whole conception of the Spirit gains moral content and personal character. The Spirit is personal, not some thing, nor some strange and magical power. The Spirit is ethical; there is a definite moral quality which is expressed when we say Christ. He has the Spirit who has the qualities of Christ. Thus the presence of the Spirit is not evidenced in the unusual, the miraculous, the ecstatic utterance of the enthusiast, or some strange deed of power, but in the workaday qualities of kindness, goodness, love, loyalty, patience, self-restraint (<a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a>f). With this identification of the Spirit and the Christ in mind, we can better understand the passages in which Paul brings out the relation of Christ to the sanctification of the believer. He is the goal (<a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>). We are to grow up in Him (<a onClick="return mV(\'Eph\',4,15);">Eph 4:15</a>). He is to be formed in us (<a onClick="return mV(\'Gal\',4,19);">Ga 4:19</a>). We are to behold Him and be changed into His image (<a onClick="return mV(\'2Cr\',3,17);">2Co 3:17</a>f). This deepens into Paul\'s thought of the mystical relation with Christ. The Christian dies to sin with Him that he may live with Him a new life. Christ is now his real life. He dwells in Christ, Christ dwells in him. He has Christ\'s thoughts, His mind. See <a onClick="return mV(\'Rom\',6,\'3-11\');">Ro 6:3-11</a>; <a onClick="return mV(\'Rom\',8,9,10);">8:9,10</a>; <a onClick="return mV(\'1Cr\',2,16);">1Co 2:16</a>; <a onClick="return mV(\'1Cr\',15,22);">15:22</a>; <a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>.<P>This vital and positive conception of the sanctification of the believer must be asserted against some popular interpretations. The symbols of fire and water, as suggesting cleansing, have sometimes been made the basis for a whole superstructure of doctrine. (For the former, note <a onClick="return mV(\'Isa\',6,6);">Isa 6:6</a>f; <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>; <a onClick="return mV(\'Act\',2,3);">Ac 2:3</a>; for the latter, <a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Act\',22,16);">22:16</a>; <a onClick="return mV(\'1Cr\',6,11);">1Co 6:11</a>; <a onClick="return mV(\'Eph\',5,26);">Eph 5:26</a>; <a onClick="return mV(\'Tts\',3,5);">Tit 3:5</a>; <a onClick="return mV(\'Hbr\',10,22);">Heb 10:22</a>; <a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>; <a onClick="return mV(\'Rev\',7,14);">7:14</a>.) There is a two-fold danger here, from which these writers have not escaped. The symbols suggest cleansing, and their over-emphasis has meant first a negative and narrow idea of sanctification as primarily separation from sin or defilement. This is a falling back to certain Old Testament levels. Secondly, these material symbols have been literalized, and the result has been a sort of mechanical or magical conception of the work of the Spirit. But the soul is not a substance for mechanical action, however sublimated. It is personal life that is to be hallowed, thought, affections, motives, desires, will, and only a personal agent through personal fellowship can work this end.<P>7. Is It Instantaneous and Entire?:<P>The clear recognition of the personal and vital character of sanctification will help us with another problem. If the holy life be God\'s requirement and at the same time His deed, why should not this sanctification be instantaneous and entire? And does not Paul imply this, not merely in his demands but in his prayer for the Thessalonians, that God may establish their hearts in holiness, that He may sanctify them wholly and preserve spirit and soul and body entire, without blame at the coming of our Lord Jesus Christ (<a onClick="return mV(\'1Th\',3,13);">1Th 3:13</a>; <a onClick="return mV(\'1Th\',5,23);">5:23</a>)?<P>In answer to this we must first discriminate between the ideal and the empirical with Paul. Like John (<a onClick="return mV(\'1Jo\',1,6);">1Joh 1:6</a>; <a onClick="return mV(\'1Jo\',3,9);">3:9</a>), Paul insists that the life of Christ and the life of sin cannot go on together, and he knows no qualified obedience, no graduated standard. He brings the highest Christian demand to the poorest of his pagan converts. Nor have we any finer proof of his faith than this uncompromising idealism. On the other hand, how could he ask less than this? God cannot require less than the highest, but it is another question how the ideal is to be achieved. In the realm of the ideal it is always either...or. In the realm of life there is another category. The question is not simply, Is this man sinner or saint? It is rather, What is he becoming? This matter of becoming is the really vital issue. Is this man turned the right way with all his power? Is his life wholly open to the divine fellowship? Not the degree of achievement, but the right attitude toward the ideal, is decisive. Paul does not stop to resolve paradoxes, but practically he reckons with this idea. Side by side with his prayer for the Thessalonians are his admonitions to growth and progress (<a onClick="return mV(\'1Th\',3,12);">1Th 3:12</a>; <a onClick="return mV(\'1Th\',5,14);">5:14</a>). Neither the absolute demand or the promise of grace gives us the right to conclude how the consummation shall take place.<P>8. Sanctification as Man\'s Task:<P>That conclusion we can reach only as we go back again to the fundamental principle of the personal character of the Christian life and the relation thus given between the ethical and the religious. All Christian life is gift and task alike. "Work out your own salvation...for it is God who worketh in you" (<a onClick="return mV(\'Phl\',2,12);">Php 2:12</a>f). All is from God; we can only live what God gives. But there is a converse to this: only as we live it out can God give to us the life. This appears in Paul\'s teaching as to sanctification. It is not only God\'s gift, but our task. "This is the will of God, even your sanctification" (<a onClick="return mV(\'1Th\',4,3);">1Th 4:3</a>). "Having therefore these promises...let us cleanse ourselves from all defilement of flesh and spirit, perfecting holiness (hagiosune) in the fear of God" (<a onClick="return mV(\'2Cr\',7,1);">2Co 7:1</a>). Significant is Paul\'s use of the word "walk." We are to "walk in newness of life," "by (or in) the Spirit," "in love," and "in Christ Jesus the Lord" (<a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>; <a onClick="return mV(\'Gal\',5,16);">Ga 5:16</a>; <a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>; <a onClick="return mV(\'Col\',2,6);">Col 2:6</a>). The gift in each case becomes the task, and indeed becomes real and effective only in this activity. It is only as we walk by the Spirit that this becomes powerful in overcoming the lusts of the flesh (<a onClick="return mV(\'Gal\',5,16);">Ga 5:16</a>; compare <a onClick="return mV(\'Gal\',5,25);">Ga 5:25</a>). But the ethical is the task that ends only with life. If God gives only as we live, then He cannot give all at once. Sanctification is then the matter of a life and not of a moment. The life may be consecrated in a moment, the right relation to God assumed and the man stand in saving fellowship with Him. The life is thus made holy in principle. But the real making holy is co-extensive with the whole life of man. It is nothing less than the constant in-forming of the life of the inner spirit and outer deed with the Spirit of Christ until we, "speaking truth in love, may grow up in all things into him, who is the head" (<a onClick="return mV(\'Eph\',4,15);">Eph 4:15</a>). (Read also <a onClick="return mV(\'Rom\',6,\'1-\');">Ro 6</a>; that the Christian is dead to sin is not some fixed static fact, but is true only as he refuses the lower and yields his members to a higher obedience. Note that in <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a> Paul in the same verse declares "ye are unleavened," and then exhorts "Purge out the old leaven, that ye may be a new lump"; compare also <a onClick="return mV(\'1Th\',5,\'5-10\');">1Th 5:5-10</a>.)<P>We may sum up as follows: The word "sanctify" is used with two broad meanings:<P>(1) The first is to devote, to consecrate to God, to recognize as holy, that is, as belonging to God. This is the regular Old Testament usage and is most common in the New Testament. The prophets showed that this belonging to Yahweh demanded righteousness. The New Testament deepens this into a whole-hearted surrender to the fellowship of God and to the rule of His Spirit.<P>(2) Though the word itself appears in but few passages with this sense, the New Testament is full of the thought of the making holy of the Christian\'s life by the Spirit of God in that fellowship into which God lifts us by His grace and in which He gives Himself to us. This sanctifying, or hallowing, is not mechanical or magical. It is wrought out by God\'s Spirit in a daily fellowship to which man gives himself in aspiration and trust and obedience, receiving with open heart, living out in obedient life. It is not negative, the mere separation from sin, but the progressive hallowing of a life that grows constantly in capacity, as in character, into the stature of full manhood as it is in Christ. And from this its very nature it is not momentary, but the deed and the privilege of a whole life.<P>See also <a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a> and the following article.<P>LITERATURE.<P>The popular and special works are usually too undiscriminating and unhistorical to be of value for the Biblical study. An exception is Beet, Holiness Symbolic and Real. Full Biblical material in Cremer, Biblical Theol. Lexicon, but treated from special points of view. See Systematic Theologies, Old Testament Theologies (compare especially Smend), and New Testament Theologies (compare especially Holtzmann).<P>Harris Franklin Rall<hr /><P><b>WESLEYAN DOCTRINE</b><P>1. Doctrine Stated<P>2. Objections Answered<P>3. Required for the Highest Success of the Preacher<P>4. Hymnology<P>5. Its Glorious Results<P>6. Wesley\'s Personal Testimony<hr /><P>1. Doctrine Stated:<P>Christian perfection, through entire sanctification, by faith, here and now, was one of the doctrines by which John Wesley gave great offense to his clerical brethren in the Anglican church. From the beginning of his work in 1739, till 1760, he was formulating this doctrine. At the last date there suddenly arose a large number of witnesses among his followers. Many of these he questioned with Baconian skill, the result being a confirmation of his theories on various points.<P>In public address he used the terms "Christian Perfection," "Perfect Love," and "Holiness," as synonymous, though there are differences between them when examined critically. With Paul he taught that all regenerate persons are saints, i.e. holy ones, as the word "saint," from Latin sanctus, through the Norman-Fr, signifies (<a onClick="return mV(\'1Cr\',1,2);">1Co 1:2</a>; <a onClick="return mV(\'2Cr\',1,1);">2Co 1:1</a>). His theory is that in the normal Christian the principle of holiness, beginning with the new birth, gradually expands and strengthens as the believer grows in grace and in the knowledge of the truth, till, by a final, all-surrendering act of faith in Christ, it reaches an instantaneous completion through the act of the Holy Spirit, the sanctifier: <a onClick="return mV(\'2Cr\',7,1);">2Co 7:1</a> "perfecting holiness," etc.; <a onClick="return mV(\'Eph\',4,13);">Eph 4:13</a>, the King James Version "Till we all come...unto a perfect man," etc. Thus sanctification is gradual, but entire sanctification is instantaneous (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a>, "our old man was crucified," etc., a sudden death; <a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>, "I have been crucified with Christ; and it is no longer I that live"). In <a onClick="return mV(\'1Th\',5,23);">1Th 5:23</a>, the word "sanctify" is a Greek aorist tense, signifying an act and not a process, as also in <a onClick="return mV(\'Jhn\',17,19);">Joh 17:19</a>, "that they...may be sanctified in truth," or truly. (See Meyer\'s note.) Many Christians experience this change on their deathbeds. If death suddenly ends the life of a growing Christian before he is wholly sanctified, the Holy Spirit perfects the work. Wesley\'s advice to the preachers of this evangelical perfection was to draw and not to drive, and never to quote any threatenings of God\'s word against God\'s children. The declaration, "Without sanctification no man shall see the Lord" (<a onClick="return mV(\'Hbr\',12,14);">Heb 12:14</a>), does not apply to the saints, "the holy ones."<P>Wesley\'s perfection of love is not perfection of degree, but of kind. Pure love is perfect love. The gradual growth toward perfect purity of love is beautifully expressed in Monod\'s hymn,<P>"O the bitter shame and sorrow!"<P>The first response to the Saviour\'s call is,<P>"All of self, and none of Thee."<P>But after a view of Christ on the cross. the answer is faintly,<P>"Some of self, and some of Thee."<P>Then, after a period of growing love, the cry is,<P>"Less of self, and more of Thee."<P>After another period, the final cry is,<P>"None of self, and all of Thee!"<P>an aspiration for pure love, without any selfishness.<P>The attainment of this grace is certified by the total cessation of all Servile fear (<a onClick="return mV(\'1Jo\',4,18);">1Joh 4:18</a>). Wesley added to this the witness of the Spirit, for which his only proof-text is <a onClick="return mV(\'1Cr\',2,12);">1Co 2:12</a>.<P>2. Objections Answered:<P>(1) Paul, in <a onClick="return mV(\'Phl\',3,12);">Php 3:12</a>, declares that he is not "made perfect":<P>(a) in <a onClick="return mV(\'Phl\',3,15);">3:15</A>, he declares that he is perfect;<P>(b) "made perfect" is a term, borrowed from the ancient games, signifying a finished course. This is one of the meanings of teleioo, as seen also in <a onClick="return mV(\'Luk\',13,32);">Lu 13:32</a> margin, "The third day I end my course." Paul no more disclaims spiritual perfection in these words than does Christ before "the third day." Paul claims in <a onClick="return mV(\'Phl\',3,15);">Php 3:15</a>, by the use of an adjective, that he is perfect. In <a onClick="return mV(\'Phl\',3,12);">3:12</A> Paul claims that he is not perfect as a victor, because the race is not ended. In <a onClick="return mV(\'Phl\',3,15);">3:15</A> he claims that he is perfect as a racer.<P>(2) Paul says (<a onClick="return mV(\'1Cr\',15,31);">1Co 15:31</a>), "I die daily." This does not refer to death to sin, as some say that it does, but to his daily danger of being killed for preaching Christ, as in <a onClick="return mV(\'Rom\',8,36);">Ro 8:36</a>, "we are killed all the day long."<P>(3) <a onClick="return mV(\'1Jo\',1,8);">1Joh 1:8</a>: "If we say that we have no sin," etc.<P>(a) If this includes Christians, it contradicts John himself in the very next verse, and in <a onClick="return mV(\'1Jo\',3,9);">3:9</a>, sin," "Whosoever is begotten of God doeth no sin" <a onClick="return mV(\'Jhn\',8,36);">Joh 8:36</a>, "If...the Son shall make you free," etc., and in all those texts in the New Testament declaring sins forgiven.<P>(b) Bishop Westcott says that the expression, "to have sin," is distinguished from "to sin," as the sinful principle is distinguished from the sinful act in itself. It includes the idea of personal guilt. Westcott asserts that John refers to the Gnostics, who taught that moral evil exists only in matter, and never touches spirit, which is always holy; and, therefore, though guilty of all manner of vice, their spirits had no need of atonement, because they were untouched by sin, which existed only in their bodies, as it does in all matter. When told that this made the body of Christ sinful, they denied the reality of His body, saying that it was only a phantom. Hence, in the very first verse of this Epistle, John writes evidently against the Gnostic error, quoting three of the five senses to prove the reality of Christ\'s humanity. (By all means, see "The Epistles of John," Cambridge Bible for Schools, etc., 17-21.)<P>3. Required for the Highest Success of the Preacher:<P>The relation of this doctrine to the Methodist Episcopal church in the United States is seen in the following questions, which have been affirmatively answered in public by all its preachers on their admission to the Conferences: "Are you going on to perfection?"; "Do you expect to be made perfect in love in this life?"; "Are you earnestly striving after it?" The hymns of the Wesleys, still universally sung, are filled with this doctrine, in which occur such expressions as:<P>4. Hymnology:<P>"Take away our bent to sinning," ....<P>"Let us find that second rest," ....<P>"Make and keep me pure within," ....<p>"\'Tis done! Thou dost this moment save,<P>With full salvation bless." ....<P>5. Its Glorious Results:<P>To the preaching of Christian perfection Wesley ascribed the success of his work in the conversion, religious training and intellectual education of the masses of Great Britain. It furnished him a multitude of consecrated workers, many of them lay preachers, who labored in nearly every hamlet, and who carried the gospel into all the British colonies, including America. It is declared by secular historians that this great evangelical movement, in which the doctrine of entire sanctification was so prominent, saved England from a disastrous revolution, like that which drenched France with the blood of its royal family and its nobility, in the last decade of the 18th century. It is certain that the great Christian and humanitarian work of William Booth, originally a Methodist, was inspired by this doctrine which he constantly preached. This enabled his followers in the early years of the Salvation Army to endure the persecutions which befell them at that time.<P>6. Wesley\'s Personal Testimony:<P>On March 6, 1760, Wesley enters in his Journal the following testimony of one Elizabeth Longmore: "\'I felt my soul was all love. I was so stayed on God as I never felt before, and knew that I loved Him with all my heart....And the witness that God had saved me from all my sins grew clearer every hour....I have never since found my heart wander from God.\' Now this is what I always did, and do now, mean by perfection. And this I believe many have attained, on the same evidence that I believe many are justified."<P>We have Wesley\'s only recorded testimony to his own justification in these words (May 24, 1738): "I felt my heart strangely warmed...and an assurance was given me that He had taken away my sins," etc.``165';
isbe[7635]='Sanctity, Legislation of`sank\'-ti-ti, lej-is-la\'-shun.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[7636]='Sanctuary`sank\'-tu-a-ri, sank\'-tu-a-ri (miqdash, miqqedhash, qodhesh, "holy place"; hagion):<P>1. Nature of Article<P>2. The Graf-Wellhausen Hypothesis<P class="in15">The Three Stages<P>3. Difficulties of the Theory<P class="in15">(1) Slaughter Not Necessarily Sacrificial<P class="in15">(2) Sacrifice and Theophany<P class="in15">(3) Alleged Plurality of Sanctuaries<P class="in15">(4) The Altar of God\'s House<P class="in15">(5) Local Altars in Deuteronomy<P>4. The Alternative View<P class="in15">(1) Lay Sacrifice<P class="in15">(2) Three Pilgrimage Festivals<P>5. The Elephantine Papyri<P class="in15">The Elephantine Temple<P>LITERATURE<hr /><P>1. Nature of Article:<P>The present article is designed to supplement the articles on <a href="./study/isbe/search.html?string=ALTAR">ALTAR</a>; <a href="./study/isbe/search.html?string=HIGH+PLACE">HIGH PLACE</A>; <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>; <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; <a href="./study/isbe/search.html?string=TEMPLE,+A1">TEMPLE</a>, by giving an outline of certain rival views of the course of law and history as regards the place of worship. The subject has a special importance because it was made the turning-point of Wellhausen\'s discussion of the development of Israel\'s literature, history and religion. He himself writes: "I differ from Graf chiefly in this, that I always go back to the centralization of the cult, and deduce from it the particular divergences. My whole position is contained in my first chapter" (Prolegomena, 368). For the purposes of this discussion it is necessary to use the symbols J, E, D, H, and the Priestly Code (P), which are explained in the article <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>.<P>It is said that there are three distinct stages of law and history.<P>2. The Graf-Wellhausen Hypothesis:<P>The Three Stages:<P>(1) In the first stage all slaughter of domestic animals for food purposes was sacrificial, and every layman could sacrifice locally at an altar of earth or unhewn stones. The law of JE is contained in <a onClick="return mV(\'Exd\',20,\'24-26\');">Ex 20:24-26</a>, providing for the making of an altar of earth or stones, and emphasis is laid on the words "in every place ("in all the place" is grammatically an equally possible rendering) where I record my name I will come unto thee and I will bless thee." This, it is claimed, permits a plurality of sanctuaries. Illustrations are provided by the history. The patriarchs move about the country freely and build altars at various places. Later sacrifices or altars are mentioned in connection with Jethro (<a onClick="return mV(\'Exd\',18,12);">Ex 18:12</a>), Moses (<a onClick="return mV(\'Exd\',17,15);">Ex 17:15</a>, etc.), Joshua (<a onClick="return mV(\'Jos\',8,30);">Jos 8:30</a>), Gideon (<a onClick="return mV(\'Jdg\',6,26);">Jud 6:26</a> etc.), Manoah (<a onClick="return mV(\'Jdg\',13,19);">Jud 13:19</a>), Samuel (<a onClick="return mV(\'1Sa\',7,17);">1Sa 7:17</a>, etc.), Elijah (<a onClick="return mV(\'1Ki\',18,32);">1Ki 18:32</a>), to take but a few instances. Perhaps the most instructive case is that of Saul after the battle of Michmash. Observing that the people were eating meat with blood, he caused a large stone to be rolled to him, and we are expressly told that this was the first altar that he built to the Lord (<a onClick="return mV(\'1Sa\',14,35);">1Sa 14:35</a>). While some of these examples might be accounted for by theophanies or other special circumstances, they are too numerous when taken together for such an explanation to suffice. In many instances they represent the conduct of the most authoritative and religious leaders of the age, e.g. Samuel, and it must be presumed that such men knew and acted upon the Law of their own day. Hence, the history and the Law of <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a> are in unison in permitting a multiplicity of sanctuaries. Wellhausen adds: "Altars as a rule are not built by the patriarchs according to their own private judgment wheresoever they please; on the contrary, a theophany calls attention to, or, at least afterward, confirms, the holiness of the place" (op. cit., 31).<P>(2) The second stage is presented by Deuteronomy in the Law and Josiah\'s reformation in the history. Undoubtedly, <a onClick="return mV(\'Deu\',12,\'1-\');">De 12</a> permits local non-sacrificial slaughter for the purposes of food, and enjoins the destruction of heathen places of worship, insisting with great vehemence on the central sanctuary. The narrative of Josiah\'s reformation in <a onClick="return mV(\'2Ki\',23,\'1-\');">2Ki 23</a> tallies with these principles.<P>(3) The third great body of law (the Priestly Code, P) does not deal with the question (save in one passage, <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17</a>). In Deuteronomy "the unity of the cult is commanded; in the Priestly Code it is presupposed....What follows from this forms the question before us. To my thinking, this: that the Priestly Code rests upon the result which is only the aim of Deuteronomy" (Prolegomena, 35). Accordingly, it is later than the latter book and dates from about the time of Ezra. As to <a onClick="return mV(\'Lev\',17,\'1-9\');">Le 17:1-9</a>, this belongs to H (the Law of Holiness, <a onClick="return mV(\'Lev\',17,\'1-\');">Le 17:1-26:46</a>), an older collection of laws than the Priestly Code (P), and is taken up in the latter. Its intention was "to secure the exclusive legitimation of the one lawful place of sacrifice....Plainly the common man did not quite understand the newly drawn and previously quite unknown distinction between the religious and the profane act" (Prolegomena, 50). Accordingly, this legislator strove to meet the difficulty by the new enactment.<P>See <a href="./study/isbe/search.html?string=CRITICISM">CRITICISM</a> (The Graf-Wellhausen Hypothesis).<P>3. Difficulties of the Theory:<P>(1) Slaughter Not Necessarily Sacrificial<P>The general substratum afforded by the documentary theory falls within the scope of the article <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>. The present discussion is limited to the legal and historical outline traced above. The view that all slaughter of domestic animals was sacrificial till the time of Josiah is rebutted by the evidence of the early books. The following examples should be noted: in <a onClick="return mV(\'Gen\',18,7);">Ge 18:7</a> a calf is slain without any trace of a sacrifice, and in <a onClick="return mV(\'Gen\',27,\'9-14\');">27:9-14</a> (Jacob\'s substitute for venison) no altar or religious rite can fairly be postulated. In <a onClick="return mV(\'1Sa\',28,24);">1Sa 28:24</a> the slaughter is performed by a woman, so that here again sacrifice is out of the question. If Gideon performed a sacrifice when he "made ready a kid" (<a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>) or when he killed an animal for the broth of which the narrative speaks, the animals in question must have been sacrificed twice over, once when they were killed and again when the food was consumed by flames. Special importance attaches to <a onClick="return mV(\'Exd\',22,1);">Ex 22:1(Hebrew 21:37)</a>, for there the JE legislation itself speaks of slaughter by cattle thieves as a natural and probable occurrence, and it can surely not have regarded this as a sacrificial act. Other instances are to be found in <a onClick="return mV(\'Gen\',43,16);">Ge 43:16</a>; <a onClick="return mV(\'1Sa\',25,11);">1Sa 25:11</a>; <a onClick="return mV(\'1Ki\',19,21);">1Ki 19:21</a>. In <a onClick="return mV(\'1Sa\',8,13);">1Sa 8:13</a> the word translated "cooks" means literally, "women slaughterers." All these instances are prior to the date assigned to Deuteronomy. With respect to <a onClick="return mV(\'Lev\',17,\'1-7\');">Le 17:1-7</a> also, theory is unworkable. At any time in King Josiah\'s reign or after, it would have been utterly impossible to limit all slaughter of animals for the whole race wherever resident to one single spot. This part of theory therefore breaks down.<P>(2) Sacrifice and Theophany<P>The view that the altars were erected at places that were peculiarly holy, or at any rate were subsequently sanctified by a theophany, is also untenable. In the Patriarchal age we may refer to <a onClick="return mV(\'Gen\',4,26);">Ge 4:26</a>, where the calling on God implies sacrifice but not theophanies, Abram at Beth-el (<a onClick="return mV(\'Gen\',12,8);">12:8</a>) and Mamre (<a onClick="return mV(\'Gen\',13,18);">13:18</A>), and Jacob\'s sacrifices (<a onClick="return mV(\'Gen\',31,54);">31:54</a>; <a onClick="return mV(\'Gen\',33,20);">33:20</a>). Compare later Samuel\'s altar at Ramah, Adonijah\'s sacrifice at En-rogel (<a onClick="return mV(\'1Ki\',1,\'1-\');">1Ki 1</a>), Naaman\'s earth (<a onClick="return mV(\'2Ki\',5,\'1-\');">2Ki 5</a>), David\'s clan\'s sacrifice (<a onClick="return mV(\'1Sa\',20,6,29);">1Sa 20:6,29</a>). It is impossible to postulate theophanies for the sacrifices of every clan in the country, and it becomes necessary to translate <a onClick="return mV(\'Exd\',20,24);">Ex 20:24</a> "in all the place" (see supra 2, (1)) and to understand "the place" as the territory of Israel.<P>(3) Alleged Plurality of Sanctuaries<P>The hypothesis of a multiplicity of sanctuaries in JE and the history also leaves out of view many most important facts. The truth is that the word "sanctuary" is ambiguous and misleading. A plurality of altars of earth or stone is not a plurality of sanctuaries. The early legislation knows a "house of Yahweh" in addition to the primitive altars (<a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>; <a onClick="return mV(\'Exd\',34,26);">34:26</a>; compare the parts of <a onClick="return mV(\'Jos\',9,23,27);">Jos 9:23,27</a> assigned to J). No eyewitness could mistake a house for an altar, or vice versa.<P>(4) The Altar of God\'s House<P>Moreover a curious little bit of evidence shows that the "house" had quite a different kind of altar. In <a onClick="return mV(\'1Ki\',1,50);">1Ki 1:50</a>f; <a onClick="return mV(\'1Ki\',2,28);">2:28</a>ff, we hear of the horns of the altar (compare <a onClick="return mV(\'Amo\',3,14);">Am 3:14</a>). Neither earth nor unhewn stones (as required by the Law of <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a>) could provide such horns, and the historical instances of the altars of the patriarchs, religious leaders, etc., to which reference has been made, show that they had no horns. Accordingly, we are thrown back on the description of the great altar of burnt offering in <a onClick="return mV(\'Exd\',27,\'1-\');">Ex 27</a> and must assume that an altar of this type was to be found before the ark before Solomon built his Temple. Thus the altar of the House of God was quite different from the customary lay altar, and when we read of "mine altar" as a refuge in <a onClick="return mV(\'Exd\',21,14);">Ex 21:14</a>, we must refer it to the former, as is shown by the passages just cited. In addition to the early legislation and the historical passages cited as recognizing a House of God with a horned altar, we see such a house in Shiloh where Eli and his sons of the house of Aaron (<a onClick="return mV(\'1Sa\',2,27);">1Sa 2:27</a>) ministered. Thus the data of both JE and the history show us a House of God with a horned altar side by side with the multiplicity of stone or earthen altars, but give us no hint of a plurality of legitimate houses or shrines or sanctuaries.<P>(5) Local Altars in Deuteronomy<P>Deuteronomy also recognizes a number of local altars in <a onClick="return mV(\'Deu\',16,21);">16:21</a> (see ICC, at the place) and so does Later Deuteronomistic editors in <a onClick="return mV(\'Jos\',8,30);">Jos 8:30</a>ff. There is no place for any of these passages ia the Wellhausen theory; but again we find one house side by side with many lay altars.<P>4. The Alternative View:<P>(1) Lay Sacrifice<P>The alternative view seeks to account for the whole of the facts noted above. In bald outline it is as follows: In pre-Mosaic times customary sacrifices had been freely offered by laymen at altars of earth or stone which were not "sanctuaries," but places that could be used for the nonce and then abandoned. Slaughter, as shown by the instances cited, was not necessarily sacrificial. Moses did not forbid or discourage the custom he found. On the contrary, he regulated it in <a onClick="return mV(\'Exd\',20,\'24-26\');">Ex 20:24-26</a>; <a onClick="return mV(\'Deu\',16,21);">De 16:21</a>f to prevent possible abuses. But he also superimposed two other kinds of sacrifice—certain new offerings to be brought by individuals to the religious capital and the national offerings of <a onClick="return mV(\'Num\',28,\'1-\');">Nu 28</a>; <a onClick="return mV(\'Num\',29,\'1-\');">29</a> and other passages. If the Priestly Code (P) assumes the religious capital as axiomatic, the reason is that this portion of the Law consists of teaching entrusted to the priests, embracing the procedure to be followed in these two classes of offerings, and does not refer at all to the procedure at customary lay sacrifices, which was regulated by immemorial custom. Deuteronomy thunders not against the lay altars—which are never even mentioned in this connection—but against the Canaanite high places. <a onClick="return mV(\'Deu\',12,1);">Deuteronomy 12</a> contemplates only the new individual offerings. The permission of lay slaughter for food was due to the fact that the infidelity of the Israelites in the wilderness (<a onClick="return mV(\'Lev\',17,\'5-7\');">Le 17:5-7</a>) had led to the universal prohibition of lay slaughter for the period of the wanderings only, though it appears to be continued by Deuteronomy for those who lived near the House of God (see <a onClick="return mV(\'Deu\',12,21);">De 12:21</a>, limited to the case "if the place...be too far from thee").<P>(2) Three Pilgrimage Festivals.<P>The JE legislation itself recognizes the three pilgrimage festivals of the House of God (<a onClick="return mV(\'Exd\',34,22);">Ex 34:22</a>f). One of these festivals is called "the feast of weeks, even of the bikkurim (a kind of first-fruits) of wheat harvest," and as <a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a> and <a onClick="return mV(\'Exd\',34,26);">34:26</a> require these bikkurim to be brought to the House of God and not to a lay altar, it follows that the pilgrimages are as firmly established here as in Deuteronomy. Thus we find a House (with a horned altar) served by priests and lay altars of earth or stone side by side in law and history till the exile swept them all away, and by breaking the continuity of tradition and practice paved the way for a new and artificial interpretation of the Law that was far removed from the intent of the lawgiver.<P>5. The Elephantine Papyri:<P>The Elephantine Temple.<P>Papyri have recently been found at Elephantine which show us a Jewish community in Egypt which in 405 BC possessed a local temple. On the Wellhausen hypothesis it is usual to assume that the Priestly Code (P) and Deuteronomy were still unknown and not recognized as authoritative in this community at that date, although the Deuteronomic law of the central sanctuary goes back at least to 621. It is difficult to understand how a law that had been recognized as divine by Jeremiah and others could still have been unknown or destitute of authority. On the alternative view this phenomenon will have been the result of an interpretation of the Law to suit the needs of an age some 800 years subsequent to the death of Moses in circumstances he never contemplated. The Pentateuch apparently permits sacrifice only in the land of Israel: in the altered circumstances the choice lay between interpreting the Law in this way or abandoning public worship altogether; for the synagogue with its non-sacrificial form of public worship had not yet been invented. All old legislations have to be construed in this way to meet changing circumstances, and this example contains nothing exceptional or surprising.<P>LITERATURE<P>J. Wellhausen, Prolegomena to the History of Israel, chapter i, for the critical hypothesis; H. M. Wiener, EPC, chapter vi, PS passim for the alternative view; POT, 173ff.``193';
isbe[7637]='Sand`(chol; ammos; a variant of the more usual psammos; compare amathos, psamathos): Sand is principally produced by the grinding action of waves. This is accompanied by chemical solution, with the result that the more soluble constituents of the rock diminish in amount or disappear and the sands tend to become more or less purely silicious, silica or quartz being a common constituent of rocks and very Insoluble. The rocks of Palestine are so largely composed of limestone that the shore and dune sands are unusually calcareous, containing from 10 to 20 per cent of calcium carbonate. This is subject to solution and redeposition as a cement between the sand grains, binding them together to form the porous sandstone of the seashore, which is easily worked and is much used in building.<P>See Rock, III, (2).<P>Figurative:<P>(1) Used most often as a symbol of countless multitude; especially of the children of Israel (<a onClick="return mV(\'Gen\',22,17);">Ge 22:17</a>; <a onClick="return mV(\'Gen\',32,12);">32:12</a>; <a onClick="return mV(\'2Sa\',17,11);">2Sa 17:11</a>; <a onClick="return mV(\'1Ki\',4,20);">1Ki 4:20</a>; <a onClick="return mV(\'Isa\',10,22);">Isa 10:22</a>; <a onClick="return mV(\'Isa\',48,19);">48:19</a>; <a onClick="return mV(\'Jer\',33,22);">Jer 33:22</a>; <a onClick="return mV(\'Hsa\',1,10);">Ho 1:10</a>; <a onClick="return mV(\'Rom\',9,27);">Ro 9:27</a>; <a onClick="return mV(\'Hbr\',11,12);">Heb 11:12</a>); also of the enemies of Israel (<a onClick="return mV(\'Jos\',11,4);">Jos 11:4</a>; <a onClick="return mV(\'Jdg\',7,12);">Jud 7:12</a>; <a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>; compare <a onClick="return mV(\'Rev\',20,8);">Re 20:8</a>). Joseph laid up gram as the sand of the sea (<a onClick="return mV(\'Gen\',41,49);">Ge 41:49</a>); God gave Solomon wisdom and understanding and largeness of heart as the sand that is on the seashore (<a onClick="return mV(\'1Ki\',4,29);">1Ki 4:29</a>); Job says "I shall multiply my days as the sand" (<a onClick="return mV(\'Job\',29,18);">Job 29:18</a>); the multitude of quails provided for the Israelites in the desert is compared to the sand (<a onClick="return mV(\'Psa\',78,27);">Ps 78:27</a>); the Psalmist says of the thoughts of God, "They are more in number than the sand" (<a onClick="return mV(\'Psa\',139,18);">Ps 139:18</a>); Jeremiah, speaking of the desolation of Jerusalem, says that the number of widows is as the sand (<a onClick="return mV(\'Jer\',15,8);">Jer 15:8</a>).<P>(2) Sand is also a symbol of weight (<a onClick="return mV(\'Job\',6,3);">Job 6:3</a>; <a onClick="return mV(\'Pro\',27,3);">Pr 27:3</a>), and<P>(3) of instability (<a onClick="return mV(\'Mat\',7,26);">Mt 7:26</a>).<P>It is a question what is meant by "the hidden treasures of the sand" in <a onClick="return mV(\'Deu\',33,19);">De 33:19</a>.``37';
