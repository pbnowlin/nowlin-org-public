isbe[7675]='Sathrabuzanes`sath-ra-bu\'-za-nez, sath-ra-bu-za\'-nez (Sathrabouzanes): In 1Esdras 6:3,7,27 = "Shethar-bozenai" in <a onClick="return mV(\'Ezr\',5,3,6);">Ezr 5:3,6</a>; <a onClick="return mV(\'Ezr\',6,6,13);">6:6,13</a>.``1';
isbe[7676]='Satisfaction`sat-is-fak\'-shun: Occurs twice in the King James Version (<a onClick="return mV(\'Num\',35,31,32);">Nu 35:31,32</a>) as a rendering of the Hebrew kopher (the Revised Version (British and American) "ransom"). It means a price paid as compensation for a life, and the passage cited is a prohibition against accepting such, in case of murder, or for the return of the manslayer. Such compensation was permitted in ancient justice among many peoples. Compare poine, which Liddell and Scott define as "properly quit-money for blood spilt, the fine paid by the slayer to the kinsman of the slain, as a ransom from all consequences." The same custom prevailed among Teutonic peoples, as seen in the German Wergeld and Old English wergild. The Hebrew lairs of the Old Testament permit it only in the case of a man or woman gored to death by an ox (<a onClick="return mV(\'Exd\',21,\'30-32\');">Ex 21:30-32</a>).``44';
isbe[7677]='Satraps`sa\'-traps, sat\'-raps (\'achashdarpenim, <a onClick="return mV(\'Ezr\',8,36);">Ezr 8:36</a>; <a onClick="return mV(\'Est\',3,12);">Es 3:12</a>; <a onClick="return mV(\'Est\',8,9);">8:9</a>; <a onClick="return mV(\'Est\',9,3);">9:3</a>, the King James Version "lieutenants"; <a onClick="return mV(\'Dan\',3,2,3,27);">Da 3:2,3,27</a>; <a onClick="return mV(\'Dan\',6,1);">6:1</a>ff, the King James Version "princes"): The viceroys or vassal rulers to whom was entrusted the government of the provinces in the Persian empire. The word answers to the Old Persian khshathrapavan, "protectors of the realm."``1';
isbe[7678]='Satyr`sat\'-er, sa\'-ter (sa\'ir, literally "he-goat"; sa\'ir, "hairy" (<a onClick="return mV(\'Gen\',27,11);">Ge 27:11</a>, of Esau), and Arabic sha\'r, "hair"; plural se\'irim): For se\'irim in <a onClick="return mV(\'Lev\',17,7);">Le 17:7</a> and <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>, the King James Version has "devils," the Revised Version (British and American) "he-goats," the English Revised Version margin "satyrs," the Septuagint has tois mataiois, "vain things." For se\'irim in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>, the King James Version and the English Revised Version have "satyrs," the English Revised Version margin "he-goats," the American Standard Revised Version "wild goats," Septuagint daimonia, "demons." For sa\'ir in <a onClick="return mV(\'Isa\',34,14);">Isa 34:14</a>, the King James Version and the English Revised Version have "satyr," the English Revised Version margin "he-goat," the American Standard Revised Version "wild goat." Septuagint has heteros pros ton heteron, "one to another," referring to daimonia, which here stands for ciyim, "wild beasts of the desert."<P>The text of the American Standard Revised Version in these passages is as follows: <a onClick="return mV(\'Lev\',17,7);">Le 17:7</a>, "And they shall no more sacrifice their sacrifices unto the he-goats, after which they play the harlot"; <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>, "And he (Jeroboam) appointed him priests for the high places, and for the he-goats, and for the calves which he had made"; <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>f (of Babylon), "But wild beasts of the desert (tsiyim) shall lie there; and their houses shall be full of doleful creatures (\'ochim); and ostriches (benoth ya\'anah) shall dwell there, and wild goats (se\'irim) shall dance there And wolves (\'iyim) shall cry in their castles, and jackals (tannim) in the pleasant palaces"; <a onClick="return mV(\'Isa\',34,11,13,14,15);">Isa 34:11,13,14,15</a> (of Edom), "But the pelican (qa\'ath) and the porcupine (kippodh) shall possess it; and the owl (yanshoph) and the raven (\'orebh) shall dwell therein:...and it shall be a habitation of jackals (tannim), a court for ostriches (benoth ya\'anah). And the wild beasts of the desert (tsiyim) shall meet with the wolves (\'iyim), and the wild goat (sa\'ir) shall cry to his fellow; yea, the night monster (lilith) shall settle there...There shall the dart-snake (qippoz) make her nest...there shall the kites (dayyoth) be gathered, every one with her mate."<P>The question is whether sa\'ir and se\'irim in these passages stand for real or for fabulous animals. In <a onClick="return mV(\'Lev\',17,7);">Le 17:7</a> and <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>, it is clear that they are objects of worship, but that still leaves open the question of their nature, though it may to many minds make "devils" or "demons" or "satyrs" seem preferable to "he-goats." In <a onClick="return mV(\'Isa\',13,20);">Isa 13:20</a> we read, "neither shall the Arabian pitch tent there; neither shall shepherds make their flocks to lie down there." This may very likely have influenced the American Committee of Revisers to use "wild goat" in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a> and <a onClick="return mV(\'Isa\',34,14);">34:14</a> instead of the "he-goat" of the other passages. In the American Standard Revised Version, no fabulous creatures (except perhaps "night-monster") are mentioned here, but the Septuagint employs daimonia, "demons" in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a> for se\'irim and in <a onClick="return mV(\'Isa\',34,14);">34:14</A> for tsiyim; onokentauroi, from "centaur," in <a onClick="return mV(\'Isa\',13,22);">Isa 13:22</a> and <a onClick="return mV(\'Isa\',34,14);">34:14</A> for \'iyim, and again in <a onClick="return mV(\'Isa\',34,14);">34:14</a> for lilith; seirenes, "sirens," in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a> for benoth ya\'anah, and in <a onClick="return mV(\'Isa\',34,13);">34:13</A> for tannim. We must bear in mind the uncertainty regarding the identity of tsiyim, \'iyim, \'ochim and tannim, as well as of some of the other names, and we must recall the tales that are hung about the name lilith (the King James Version "screech owl," the King James Version margin and the Revised Version (British and American) "night-monster," the Revised Version margin "Lilith"). While sa\'ir is almost alone among these words in having ordinarily a well-understood meaning, i.e. "he-goat," there is good reason for considering that here it is used in an exceptional sense. The translation "satyr" has certainly much to be said for it.`<a href="./study/isbe/search.html?string=GOAT">GOAT</a>; <a href="./study/isbe/search.html?string=JACKAL">JACKAL</a>`37';
isbe[7679]='Saul`sol (sha\'ul; Saoul):<P>(1) The first king of Israel.<P><b>I. EARLY HISTORY</b><P class="in15">1. Name and Meaning<P class="in15">2. Genealogy<P class="in15">3. Home and Station<P class="in15">4. Sources for Life<P class="in15">5. Election as King<P class="in15">6. Reasons for It<P><b>II. REIGN AND FALL</b><P class="in15">1. His First Action<P class="in15">2. Army Reorganized<P class="in15">3. Battle of Michmash<P class="in15">4. Defeats the Amalekites<P class="in15">5. Deposition Pronounced<P class="in15">6. David Introduced to Saul<P class="in15">7. Two Accounts<P class="in15">8. Saul\'s Envy of David<P class="in15">9. Attempts to Get Rid of David<P class="in15">10. David Spares Saul<P class="in15">11. Saul\'s Divided Energies<P class="in15">12. Consults a Necromancer<P class="in15">13. Battle of Gilboa<P class="in15">14. Double Accounts<P class="in15">15. Saul\'s Posterity<P><b>III. CHARACTER</b><P class="in15">1. Book of Chronicles<P class="in15">2. Saul\'s Failings<P class="in15">3. His Virtue<P class="in15">4. David\'s Elegy<hr /><P>I. Early History.<P>1. Name and Meaning:<P>The name Saul is usually regarded as simply the passive participle of the verb "to ask," and so meaning "asked" (compare <a onClick="return mV(\'1Sa\',8,4);">1Sa 8:4</a>ff), but the gentilic adjective sha\'uli (<a onClick="return mV(\'Num\',26,13);">Nu 26:13</a>) would point to its having also an intensive connotation, "the one asked importunately," or perhaps, "the one asking insistently," "the beggar."<P>2. Genealogy:<P>Saul was the son of Kish, a Benjamite. His genealogical tree is given in <a onClick="return mV(\'1Sa\',9,1);">1Sa 9:1</a> (compare Septuagint 10:21). In <a onClick="return mV(\'1Sa\',9,1);">1Sa 9:1</a> his grandfather is Abiel, but in <a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a>; <a onClick="return mV(\'1Ch\',9,39);">9:39</a>, Ner, who appears as his paternal uncle in <a onClick="return mV(\'1Sa\',14,50,51);">1Sa 14:50,51</a>.<P>The last verse contains a very curious scribal error, a yodh having slipped out of one word in it into another. It states that both Abner and Ner were sons of Abiel. These apparent inconsistencies are to be explained by the fact that in Hebrew, as in Arabic, "son" is often used in the sense of grandson. Also, with the facility of divorce then prevalent, by "brother" and "sister" we must in most cases understand half-brother and half-sister. Moreover, Saul\'s mother might have been the wife at different times of Kish and of his brother Ner (compare <a onClick="return mV(\'1Sa\',20,30);">1Sa 20:30</a>). This was quite common, and in some cases compulsory (<a onClick="return mV(\'Deu\',25,\'5-9\');">De 25:5-9</a>).<P>3. Home and Station:<P>Saul\'s home was at <a href="./study/isbe/search.html?string=GIBEAH">GIBEAH</a> (which see), which is also called Gibeah of Saul, i.e. Saul\'s Hill (<a onClick="return mV(\'1Sa\',11,4);">1Sa 11:4</a>; compare also <a onClick="return mV(\'1Sa\',10,5);">1Sa 10:5</a>, God\'s Hill, or simply The Hill, <a onClick="return mV(\'1Sa\',10,10);">1Sa 10:10</a>; <a onClick="return mV(\'Hsa\',5,8);">Ho 5:8</a>, etc.), or the Hill of Benjamin or of the Benjamites (<a onClick="return mV(\'1Sa\',13,15);">1Sa 13:15</a>; <a onClick="return mV(\'2Sa\',23,29);">2Sa 23:29</a>). It is usually identified with Tell el-Ful, but perhaps its site is marked rather by some ruins near but beneath that eminence. The tribe of Benjamin was the fighting tribe of Israel, and Kish seems to have been one of its most important members. Saul\'s remarks in depreciation (<a onClick="return mV(\'1Sa\',9,21);">1Sa 9:21</a>) are not to be taken literally.<P>4. Sources for Life:<P>The circumstances of Saul\'s career are too well known to require recapitulation. It will be sufficient to refer to some of the recognized difficulties of the narrative. These difficulties arise from the fact that we appear to have two distinct biographies of Saul in the present Books of Samuel. This may well be the case as it is the practice of the Semitic historian to set down more than one tradition of each event, without attempting to work these up into one consistent account. We shall call the duplicated narratives A and B, without postulating that either is a continuous whole.<P>See <a href="./study/isbe/search.html?string=SAMUEL,+BOOKS OF">SAMUEL, BOOKS OF</a>.<P>5. Election as King:<P>According to A, Saul was anointed king of Israel at Ramah by the prophet Samuel acting upon an inspiration from Yahweh, not only without consulting anyone, but in the strictest secrecy (<a onClick="return mV(\'1Sa\',9,\'1-\;);">1Sa 9:1</a>-<a onClick="return mV(\'1Sa\',10,\'1-16\');">10:16</a>). According to B, the sheiks of the tribes demanded a king. Samuel in vain tried to dissuade them. They would not listen, and a king was chosen by lot at Mizpah. The lot fell upon Saul, and Samuel immediately demitted office (<a onClick="return mV(\'1Sa\',8,\'1-\');">1Sa 8</a>; <a onClick="return mV(\'1Sa\',10,\'17-27\');">10:17-27</a>, omitting the last clause; and chapter <a onClick="return mV(\'1Sa\',12,\'1-\');">12</A>).<P>6. Reasons for It:<P>There are three distinct reasons given in the text for the abolition of theocracy and institution of an elective or hereditary monarchy: first, the incapacity of Samuel\'s sons (<a onClick="return mV(\'1Sa\',8,1);">1Sa 8:1</a>); second, an invasion of the Ammonites (<a onClick="return mV(\'1Sa\',12,12);">1Sa 12:12</a>); and third, the Philistines (<a onClick="return mV(\'1Sa\',9,16);">1Sa 9:16</a>). These three motives are not mutually exclusive. The Philistines formed the standing menace to the national existence, which would have necessitated the creation of a monarchy sooner or later. The other two were temporary circumstances, one of which aggravated the situation, while the other showed the hopelessness of expecting any improvement in it in the near future.<P>II. Reign and Fall.<P>1. His First Action:<P>The election of Saul at Mizpah was conducted in the presence of the chieftains of the clans; it is not to be supposed that the whole nation was present. As soon as it was over, the electors went home, and Saul also returned to his father\'s farm and, like Cincinnatus, once more followed the plow. "Within about a month," however (<a onClick="return mV(\'1Sa\',10,27);">1Sa 10:27</a> the Septuagint, for Massoretic Text "But he held his peace"), the summons came. A message from the citizens of <a href="./study/isbe/search.html?string=JABESH-GILEAD">JABESH-GILEAD</a> (which see) was sent round the tribes appealing for help against the Ammonites under Nahash. They, of course, knew nothing about what had taken place at Mizpah, and it was only by chance that their messengers arrived at Gibeah when they did. Saul rose to the occasion, and immediately after he was acclaimed king by the whole body of the people (<a onClick="return mV(\'1Sa\',11,\'1-\');">1Sa 11</a>). This double election, first by the chiefs and then by the people, is quite a regular proceeding.<P>2. Army Reorganized:<P>This first success encouraged Saul to enter upon what was to be the mission of his life, namely, the throwing off of the Philistine suzerainty. From the first he had had the boldest spirits upon his side (<a onClick="return mV(\'1Sa\',10,26);">1Sa 10:26</a>, the Septuagint, the Revised Version margin); he was now able to form a standing army of 3,000 men, under the command of himself and his son <a href="./study/isbe/search.html?string=JONATHAN">JONATHAN</a> (which see). The Philistines, the last remnant of the Minoan race, had the advantage of the possession of iron weapons. It was, in fact, they who introduced iron into Palestine from Crete—the Israelites knowing only bronze, and having even been deprived of weapons of the softer metals. They seem to have armed themselves—with the exception of the king and his son—with mattocks and plowshares (<a onClick="return mV(\'1Sa\',13,19);">1Sa 13:19</a>).<P>3. Battle of Michmash:<P>The first encounter was the attack upon the Philistine post at Michmash (<a onClick="return mV(\'1Sa\',13,\'1-\');">1Sa 13</a>; <a onClick="return mV(\'1Sa\',14,\'1-\');">14</a>). The text of the narrative is uncertain, but the following outline is clear. On hearing that the Hebrews had revolted (<a onClick="return mV(\'1Sa\',13,3);">1Sa 13:3</a>, the Septuagint), the Philistines gathered in great force, including 3,000 chariots (<a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>, the Septuagint; the Massoretic Text has 30,000) at Michmash. In dismay, Saul\'s troops deserted (<a onClick="return mV(\'1Sa\',13,6);">1Sa 13:6</a>f), until he was left with only 600 (<a onClick="return mV(\'1Sa\',14,2);">1Sa 14:2</a>). In spite of this, Jonathan precipitated hostilities by a reckless attack upon one of the outposts. This was so successful that the whole Philistine army was seized with panic, and the onset of Saul and the desertion of their Hebrew slaves completed their discomfiture. Saul followed up his victory by making predatory excursions on every side (<a onClick="return mV(\'1Sa\',14,47);">1Sa 14:47</a>).<P>4. Defeats the Amalekites:<P>Saul\'s next expedition was against the Amalekites under Agag, who were likewise completely defeated. The fight was carried out with all the remorselessness common to tribal warfare. Warning was sent to the friendly Kenites to withdraw out of danger; then the hostile tribe was slaughtered to a man, their chief alone being spared for the time being. Even the women and children were not taken as slaves, but were all killed (<a onClick="return mV(\'1Sa\',15,\'1-\');">1Sa 15</a>).<P>5. Deposition Pronounced:<P>It is not clear what was the precise attitude of Samuel toward Saul. As the undoubted head of theocracy he naturally objected to his powers being curtailed by the loss of the civil power (<a onClick="return mV(\'1Sa\',8,6);">1Sa 8:6</a>). Even after the elections of Saul, Samuel claimed to be the ecclesiastical head of the state. He seems to have objected to Saul\'s offering the sacrifice before battle (<a onClick="return mV(\'1Sa\',13,10);">1Sa 13:10</a>), and to have considered him merely as his lieutenant (<a onClick="return mV(\'1Sa\',15,3);">1Sa 15:3</a>) who could be dismissed for disobedience (<a onClick="return mV(\'1Sa\',15,14);">1Sa 15:14</a>). Here again there seem to be two distinct accounts in the traditional text, which we may again call A and B. In A, Saul is rejected because he does not wait long enough for Samuel at Gilgal (<a onClick="return mV(\'1Sa\',13,8);">1Sa 13:8</a>; compare <a onClick="return mV(\'1Sa\',10,8);">1Sa 10:8</a>). "Seven days," of course, means eight, or even more, in short, until Samuel should come, whenever that might be. The expression might almost be omitted in translating. In B Saul is rejected because he did not carry out Samuel\'s orders (<a onClick="return mV(\'1Sa\',15,3);">1Sa 15:3</a>) to the letter. The two narratives are not mutually exclusive. The second offense was an aggravation of the first, and after it Samuel did not see Saul again (<a onClick="return mV(\'1Sa\',15,35);">1Sa 15:35</a>).<P>6. David Introduced to Saul:<P>He had good reason for not doing so. He had anointed a rival head of the state in opposition to Saul, an act of treason which, if discovered, would have cost him his head (compare <a onClick="return mV(\'2Ki\',9,6,10);">2Ki 9:6,10</a>). Saul did not at once accept his deposition, but he lost heart. One cannot but admire him, deserted by Samuel, and convinced that he was playing a losing game, and yet continuing in office. To drive away his melancholy, his servants introduced to him a musician who played until his spirits revived (<a onClick="return mV(\'1Sa\',16,14);">1Sa 16:14</a>; compare <a onClick="return mV(\'2Ki\',3,15);">2Ki 3:15</a>).<P>7. Two Accounts:<P>By a strange coincidence (compare I,5,above) the minstrel was the very person whom Samuel had secretly anointed to supplant Saul. According to what looks like another account, however, it was his encounter with Goliath which led to the introduction of David to Saul (<a onClick="return mV(\'1Sa\',17,1);">1Sa 17:1</a>; see <a href="./study/isbe/search.html?string=DAVID">DAVID</a>). In spite of all that has been said to the contrary, the two narratives are not incompatible, since we are not told the order of the events nor over how many years these events were spread. The theory of duplicate narratives rests upon the assumption that all statements made by the dramatis personae in the Bible are to be taken at their face value. If <a onClick="return mV(\'1Sa\',16,1);">1 Samuel 16</a> and <a onClick="return mV(\'1Sa\',17,\'1-\');">17</a> had formed part of a play of Shakespeare, they would have been considered a fine example of his genius. Treatises would have been written to explain why Saul did not recognize David, and why Abner denied all knowledge of him. Septuagint, however, omits <a onClick="return mV(\'1Sa\',17,\'12-31\',41,50,55);">1Sa 17:12-31,41,50,55</a>-<a onClick="return mV(\'1Sa\',18,\'1-5\');">18:1-5</a>.<P>8. Saul\'s Envy of David:<P>Whether Saul actually discovered that David had been anointed by Samuel or not, he soon saw in him his rival and inevitable successor, and he would hardly have been human if he had not felt envious of him. His dislike of David had two motives. The first was jealousy, because the women preferred the military genius of David to his own (<a onClick="return mV(\'1Sa\',18,7);">1Sa 18:7</a>f). His consequent attempt upon the life of David (<a onClick="return mV(\'1Sa\',18,\'8-11\');">1Sa 18:8-11</a>) is omitted in the Septuagint. Not least was the love of his own daughter for David (<a onClick="return mV(\'1Sa\',18,20);">1Sa 18:20</a>; in <a onClick="return mV(\'1Sa\',18,28);">1Sa 18:28</a> read with Septuagint "all Israel"). The second cause was his natural objection to see his son Jonathan supplanted in his rights to the throne, an objection which was aggravated by the devotion of that son to his own rival (<a onClick="return mV(\'1Sa\',20,30);">1Sa 20:30</a>).<P>See also <a href="./study/isbe/search.html?string=DAVID">DAVID</a>; <a href="./study/isbe/search.html?string=JONATHAN">JONATHAN</a>.<P>9. Attempts to Get Rid of David:<P>Saul could not believe that David could remain loyal to him (<a onClick="return mV(\'1Sa\',24,9);">1Sa 24:9</a>); at the first favorable opportunity he would turn upon him, hurl him from the throne, and exterminate his whole house. In these circumstances, it was his first interest to get rid of him. His first attempt to do so (omitting with Septuagint <a onClick="return mV(\'1Sa\',18,\'8-11\');">1Sa 18:8b-11</a>) was to encourage him to make raids on the Philistines in the hope that these might kill him (<a onClick="return mV(\'1Sa\',18,21);">1Sa 18:21</a>); his next, assassination by one of his servants (<a onClick="return mV(\'1Sa\',19,1);">1Sa 19:1</a>), and then by his own hand (<a onClick="return mV(\'1Sa\',19,9);">1Sa 19:9</a>f). When David was compelled to fly, the quarrel turned to civil war. The superstitious fear of hurting the chosen of Yahweh had given place to blind rage. Those who sheltered the fugitive, even priests, were slaughtered (<a onClick="return mV(\'1Sa\',22,17);">1Sa 22:17</a>). From one spot to another David was hunted, as he says, like a partridge (<a onClick="return mV(\'1Sa\',26,20);">1Sa 26:20</a>).<P>10. David Spares Saul:<P>It is generally maintained that here also we have duplicate accounts; for example, that there are two accounts of David taking refuge with Achish, king of Gath, and two of his sparing Saul\'s life. The latter are contained in <a onClick="return mV(\'1Sa\',24,\'1-\');">1 Samuel 24</a> and <a onClick="return mV(\'1Sa\',26,\'1-\');">26</a>, but the points of resemblance are slight. Three thousand (<a onClick="return mV(\'1Sa\',24,2);">24:2</a>; <a onClick="return mV(\'1Sa\',26,2);">26:2</A>) was the number of Saul\'s picked men (compare <a onClick="return mV(\'1Sa\',13,2);">13:2</a>). David uses the simile of "a flea" in <a onClick="return mV(\'1Sa\',24,14);">24:14</a>, but in <a onClick="return mV(\'1Sa\',26,20);">26:20</A> for "a flea" Septuagint has "my soul," which is no doubt original. The few other expressions would occur naturally in any narrative with the same contents.<P>11. Saul\'s Divided Energies:<P>Obviously Saul\'s divided energies could not hold out long; he could not put down the imaginary rebellion within, and at the same time keep at bay the foreign foe. No sooner had he got the fugitive within his grasp than he was called away by an inroad of the Philistines (<a onClick="return mV(\'1Sa\',23,27);">1Sa 23:27</a>f); but after his life had been twice spared, he seemed to realize at last that the latter were the real enemy, and he threw his whole strength into one desperate effort for existence.<P>12. Consults a Necromancer:<P>Saul himself saw that his case was desperate, and that in fact the game was up. As a forlorn hope he determined to seek occult advice. He could no longer use the official means of divination (<a onClick="return mV(\'1Sa\',28,6);">1Sa 28:6</a>), and was obliged to have recourse to a necromancer, one of a class whom he himself had taken means to suppress (<a onClick="return mV(\'1Sa\',28,3);">1Sa 28:3</a>). The result of the seance confirmed his worst fears and filled his soul with despair (<a onClick="return mV(\'1Sa\',28,7);">1Sa 28:7</a>).<P>13. Battle of Gilboa:<P>It says much for Saul that, hopeless as he was, he engaged in one last forlorn struggle with the enemy. The Philistines had gathered in great force at Shunem. Saul drew up his army on the opposing hill of Gilboa. Between the two forces lay a valley (compare <a onClick="return mV(\'1Sa\',14,4);">1Sa 14:4</a>). The result was what had been foreseen. The Israelites, no doubt greatly reduced in numbers (contrast <a onClick="return mV(\'1Sa\',11,8);">1Sa 11:8</a>), were completely defeated, and Saul and his sons slain. Their armor was placed in the temple of Ashtaroth, and their bodies hung on the wall of Bethshan, but Saul\'s head was set in the temple of Dagon (<a onClick="return mV(\'1Ch\',10,10);">1Ch 10:10</a>). The citizens of Jabesh-gilead, out of ancient gratitude, rescued the bodies and, in un-Semitic wise, burned them and buried the bones.<P>14. Double Accounts:<P>Once more we have, according to most present-day critics, duplicate accounts of the death of Saul. According to one, which we may name A, he fell, like Ajax whom he much resembles, upon his own sword, after being desperately wounded by the archers (<a onClick="return mV(\'1Sa\',31,4);">1Sa 31:4</a>). According to the second (<a onClick="return mV(\'2Sa\',1,2);">2Sa 1:2</a>), an Amalekite, who had been by accident a witness of the battle, dispatched Saul at his own request to save him from the enemy. But B is simply the continuation of A, and tells us how David received the news of the battle. The Amalekite\'s story is, of course, a fabrication with a view to a reward. Similar claims for the reward of assassination are common (<a onClick="return mV(\'2Sa\',4,9);">2Sa 4:9</a>).<P>15. Saul\'s Posterity:<P>With Saul the first Israelite dynasty began and ended. The names of his sons are given in <a onClick="return mV(\'1Sa\',14,49);">1Sa 14:49</a> as Jonathan, Ishvi and Malchishua. Ishvi or Ishyo (Septuagint) is Eshbaal, called in <a onClick="return mV(\'2Sa\',2,8);">2Sa 2:8</a> ISH-BOSHETH (which see). <a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a> adds Abinadab. Jonathan left a long line of descendants famous, like himself, as archers (<a onClick="return mV(\'1Ch\',8,34);">1Ch 8:34</a>). The rest of Saul\'s posterity apparently died out. Malchishua and Abinadab were slain at Gilboa (<a onClick="return mV(\'1Sa\',31,6);">1Sa 31:6</a>; <a onClick="return mV(\'1Ch\',10,2);">1Ch 10:2</a>), and Ish-bosheth was assassinated shortly after (<a onClick="return mV(\'2Sa\',4,2);">2Sa 4:2</a>). Saul had also two natural sons by Rizpah who were put to death by David in accordance with a superstitious custom, as also were the five sons of Saul\'s daughter Merab (<a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a>, not Michal; compare <a onClick="return mV(\'1Sa\',18,19);">1Sa 18:19</a>). Saurs other daughter Michal apparently had no children. Saul had, it seems, other wives, who were taken into the harem of David in accordance with the practice of the times (<a onClick="return mV(\'2Sa\',12,8);">2Sa 12:8</a>), but of them and their descendants we know nothing.<P>III. Character.<p>1. Book of Chronicles:<P>Saul\'s life and character are disposed of in a somewhat summary fashion by the Chronicler (<a onClick="return mV(\'1Ch\',10,\'1-\');">1Ch 10</a>, especially <a onClick="return mV(\'1Ch\',10,13,14);">1Ch 10:13,14</a>). Saul was rejected because he was disloyal to Yahweh, especially in consulting a necromancer. The major premise of this conclusion, however, is the ancient dictum, "Misfortune presupposes sin." From a wider point of view, Saul cannot be dismissed in so cavalier a manner.<P>2. Saul\'s Failings:<P>Like everyone else, Saul had his virtues and his failings. His chief weakness seems to have been want of decision of character. He was easily swayed by events and by people. The praises of David (<a onClick="return mV(\'1Sa\',18,7);">1Sa 18:7</a>f) at once set his jealousy on fire. His persecution of David was largely due to the instigation of mischievous courtiers (<a onClick="return mV(\'1Sa\',24,9);">1Sa 24:9</a>). Upon remonstrance his repentance was as deep as it was short-lived (<a onClick="return mV(\'1Sa\',24,16);">1Sa 24:16</a>; <a onClick="return mV(\'1Sa\',26,21);">26:21</a>). His impulsiveness was such that he did not know where to stop. His interdict (<a onClick="return mV(\'1Sa\',14,24);">1Sa 14:24</a>) was quite as uncalled for as his religious zeal (<a onClick="return mV(\'1Sa\',15,9);">1Sa 15:9</a>) was out of place. He was always at one extreme. His hatred of David was only equal to his affection for him at first (<a onClick="return mV(\'1Sa\',18,2);">1Sa 18:2</a>). His pusillanimity led him to commit crimes which his own judgment would have forbidden (<a onClick="return mV(\'1Sa\',22,17);">1Sa 22:17</a>). Like most beaten persons, he became suspicious of everyone (<a onClick="return mV(\'1Sa\',22,7);">1Sa 22:7</a>f), and, like those who are easily led, he soon found his evil genius (<a onClick="return mV(\'1Sa\',22,9,18,22);">1Sa 22:9,18,22</a>). Saul\'s inability to act alone appears from the fact that he never engaged in single combat, so far as we know. Before he could act at all his fury or his pity had to be roused to boiling-point (<a onClick="return mV(\'1Sa\',11,6);">1Sa 11:6</a>). His mind was peculiarly subject to external influences, so that he was now respectable man of the world, now a prophet (<a onClick="return mV(\'1Sa\',10,11);">1Sa 10:11</a>; <a onClick="return mV(\'1Sa\',19,24);">19:24</a>).<P>3. His Virtues:<P>On the other hand, Saul possessed many high qualities. His dread of office (<a onClick="return mV(\'1Sa\',10,22);">1Sa 10:22</a>) was only equaled by the coolness with which he accepted it (<a onClick="return mV(\'1Sa\',11,5);">1Sa 11:5</a>). To the first call to action he responded with promptitude (<a onClick="return mV(\'1Sa\',11,6);">1Sa 11:6</a>). His timely aid excited the lasting gratitude of the citizens of Jabesh-gilead (<a onClick="return mV(\'1Sa\',31,11);">1Sa 31:11</a>) If we remember that Saul was openly disowned by Samuel (<a onClick="return mV(\'1Sa\',15,30);">1Sa 15:30</a>), and believed himself cast off by Yahweh, we cannot but admire the way in which he fought on to the last. Moreover, the fact that he retained not only his own sons, but a sufficient body of fighting men to engage a large army of Philistines, shows that there must have been something in him to excite confidence and loyalty.<P>4. David\'s Elegy:<P>There is, however, no question as to the honorable and noble qualities of Saul. The chief were his prowess in war and his generosity in peace. They have been set down by the man who knew him best in what are among the most authentic verses in the Bible (<a onClick="return mV(\'2Sa\',1,19);">2Sa 1:19</a>).<P>(2) Saul of Tarsus. See <a href="./study/isbe/search.html?string=PAUL">PAUL</a>``189';
isbe[7680]='Savaran`sav\'-a-ran: the King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=AVARAN">AVARAN</a> (which see).``1';
isbe[7681]='Save`sav: In the sense "except," the word came into English through the French (sauf) and is fairly common (38 times, in addition to "saving," the King James Version <a onClick="return mV(\'Ecc\',5,11);">Ec 5:11</a>; <a onClick="return mV(\'Amo\',9,8);">Am 9:8</a>; <a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>; <a onClick="return mV(\'Luk\',4,27);">Lu 4:27</a>; <a onClick="return mV(\'Rev\',2,17);">Re 2:17</a>). It represents no particular Hebrew or Greek terms but is employed wherever it seems useful. It is still in good (slightly archaic) use, and the Revised Version (British and American) has few modifications (<a onClick="return mV(\'Deu\',15,4);">De 15:4</a> the King James Version; <a onClick="return mV(\'Psa\',18,31);">Ps 18:31</a>, etc.), but the English Revised Version has dropped "saving" in <a onClick="return mV(\'Luk\',4,27);">Lu 4:27</a> and <a onClick="return mV(\'Rev\',2,17);">Re 2:17</a> and the American Standard Revised Version also in <a onClick="return mV(\'Ecc\',5,11);">Ec 5:11</a>; <a onClick="return mV(\'Amo\',9,8);">Am 9:8</a>, retaining it only in <a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>.``1';
isbe[7682]='Savias`sa-vi\'-as (Saouia): In 1Esdras 8:2, for Uzzi, an ancestor of Ezra, in <a onClick="return mV(\'Ezr\',7,4);">Ezr 7:4</a>.``1';
isbe[7683]='Saviour`sav\'-yer:<P>(1) While that "God is the deliverer of his people" is the concept on which, virtually, the whole Old Testament is based (see <a href="./study/isbe/search.html?string=SALVATION">SALVATION</a>), yet the Hebrews seem never to have felt the need of a title for God that would sum up this aspect of His relation to man. Nearest to our word "Saviour" is a participial form (moshia\') from the verb yasha\' (Qal not used; "save" in Hiphil), but even this participle is not frequently applied to God (some 13 times of which 7 are in <a onClick="return mV(\'Isa\',43,\'1-\');">Isa 43:1-63:19</a>).<P>(2) In the New Testament, however, the case is different, and Soter, is used in as technical a way as is our "Saviour." But the distribution of the 24 occurrences of the word is significant, for two-thirds of them are found in the later books of the New Testament—10 in the Pastorals, 5 in 2 Peter, and one each in John, 1 John, and Jude—while the other instances are <a onClick="return mV(\'Luk\',1,47);">Lu 1:47</a>; <a onClick="return mV(\'Luk\',2,11);">2:11</a>; <a onClick="return mV(\'Act\',5,31);">Ac 5:31</a>; <a onClick="return mV(\'Act\',13,23);">13:23</a>; <a onClick="return mV(\'Eph\',5,23);">Eph 5:23</a>; <a onClick="return mV(\'Phl\',3,20);">Php 3:20</a>. And there are no occurrences in Matthew, Mark, or the earlier Pauline Epistles. The data are clear enough. As might be expected, the fact that the Old Testament used no technical word for Saviour meant that neither did the earliest Christianity use any such word. Doubtless for our Lord "Messiah" was felt to convey the meaning. But in Greek-speaking Christianity, "Christ," the translation of Messiah, soon became treated as a proper name, and a new word was needed.<P>(3) Soter expressed the exact meaning and had already been set apart in the language of the day as a religious term, having become one of the most popular divine titles in use. Indeed, it was felt to be a most inappropriate word to apply to a human being. Cicero, for instance, arraigns Verres for using it: "Soter...How much does this imply? So much that it cannot be expressed in one word in Latin" (Verr. ii.2, 63, 154). So the adoption of Soter by Christianity was most natural, the word seemed ready-made.<P>(4) That the New Testament writers derived the word from its contemporary use is shown, besides, by its occurrence in combination with such terms as "manifestation" (epiphaneia, <a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>; <a onClick="return mV(\'Tts\',2,13);">Tit 2:13</a>), "love toward man" (philanthropia, <a onClick="return mV(\'Tts\',3,4);">Tit 3:4</a>), "captain" (archegos, <a onClick="return mV(\'Act\',5,31);">Ac 5:31</a>; compare <a onClick="return mV(\'Hbr\',2,10);">Heb 2:10</a>), etc. These terms are found in the Greek sources many times in exactly the same combinations with Sorer.<P>(5) In the New Testament Soter is uniformly reserved for Christ, except in <a onClick="return mV(\'Luk\',1,47);">Lu 1:47</a>; <a onClick="return mV(\'Jud\',1,25);">Jude 1:25</a>, and the Pastorals. In <a onClick="return mV(\'1Ti\',1,1);">1Ti 1:1</a>; <a onClick="return mV(\'1Ti\',2,3);">2:3</a>; <a onClick="return mV(\'1Ti\',4,10);">4:10</a> it is applied only to the Father, in <a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>, (only) it is applied to Christ, while in Titus there seems to be a deliberate alternation: of the Father in <a onClick="return mV(\'Tts\',1,3);">1:3</A>; <a onClick="return mV(\'Tts\',2,10);">2:10</a>; <a onClick="return mV(\'Tts\',3,4);">3:4</A>; of Christ in <a onClick="return mV(\'Tts\',1,4);">1:4</A>; <a onClick="return mV(\'Tts\',2,13);">2:13</A>; <a onClick="return mV(\'Tts\',3,6);">3:6</A>.<P>LITERATURE.<P>P. Wendland, "Soter" Zeitschrift fur neutestamentliche Wissenschaft, V, 335-353, 1904; J. Weiss, "Heiland," in RGG, II, 1910; H. Lietzmann, Der Weltheiland, 1909. Much detailed information is available in various parts of Deissmann, Light from the Ancient East, 1910.``48';
isbe[7684]='Savor`sa\'-ver (reach; osme;<P>(1) The primary meaning of the word is "taste," "flavor" (from Latin sapor, "taste"). So in <a onClick="return mV(\'Mat\',5,13);">Mt 5:13</a>; <a onClick="return mV(\'Luk\',14,34);">Lu 14:34</a>, "if the salt have lost its savor" (moranthe, "become tasteless," "insipid," so as to lose its characteristic preserving virtue).<P>(2) But generally it has the meaning of "smell," "odor":<P>(a) once of evil odor: "Its stench shall come up, and its ill savor shall come up" (<a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a>);<P>(b) elsewhere in the sense of pleasant smell. In the Old Testament, with the exception of <a onClick="return mV(\'Exd\',5,21);">Ex 5:21</a> and the King James Version <a onClick="return mV(\'Sgs\',1,3);">So 1:3</a> (the Revised Version (British and American) "fragrance"), it is always accompanied by the adjective "sweet." It stands for the smell of sacrifices and oblations, in agreement with the ancient anthropomorphic idea that God smells and is pleased with the fragrance of sacrifices (e.g. "Yahweh smelled the sweet savor," <a onClick="return mV(\'Gen\',8,21);">Ge 8:21</a>; "to make a sweet savor unto Yahweh," <a onClick="return mV(\'Num\',15,3);">Nu 15:3</a>; and frequently).<P>In the New Testament, "savor" in the sense of smell is used metaphorically:<P>(a) once the metaphor is borrowed from the incense which attends the victor\'s triumphal procession; God is said to make manifest through His apostles "the savor of his knowledge in every place" as He "leadeth" them "in triumph in Christ" (<a onClick="return mV(\'2Cr\',2,14);">2Co 2:14</a>; see <a href="./study/isbe/search.html?string=TRIUMPH">TRIUMPH</a>.<P>(b) Elsewhere the metaphor is borrowed from the fragrant smell of the sacrifices. The apostles "are a sweet savor of Christ unto God" (<a onClick="return mV(\'2Cr\',2,15);">2Co 2:15</a>), i.e. they are, as it were, a sweet odor for God to smell, an odor which is pleasing to God, even though its effect upon men varies (to some it is a "savor from death unto death," i.e. such as is emitted by death and itself causes death; to others it is "a savor from life unto life," <a onClick="return mV(\'2Cr\',2,16);">2Co 2:16</a>). By the same sacrificial metaphor, Christ\'s offering of Himself to God is said to be "for a sweet smelling savor" (<a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a> the King James Version, the Revised Version (British and American) "for an odor of a sweet smell"; the same phrase is used in <a onClick="return mV(\'Phl\',4,18);">Php 4:18</a> of acts of kindness to Paul, which were "a sacrifice acceptable, well-pleasing to God").<P>(3) Once it is used in the figurative sense of reputation: "Ye have made our savor to be abhorred (literally, "our smell to stink") in the eyes of Pharaoh" (<a onClick="return mV(\'Exd\',5,21);">Ex 5:21</a>). Compare the English phrase, "to be in bad odor."<P>The verb "to savor" means:<P>(1) intransitively, to taste or smell of, to partake of the quality of something, as in the Preface of the King James Version, "to savour more of curiosity than wisdome," or<P>(2) transitively, to perceive by the taste or smell, to discern: "thou savourest not the things that be of God" (the King James Version <a onClick="return mV(\'Mat\',16,23);">Mt 16:23</a>; <a onClick="return mV(\'Mar\',8,33);">Mr 8:33</a>, the Revised Version (British and American) "mindest"; phroneis; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) sapis). The adjective "savory" occurs only in <a onClick="return mV(\'Gen\',27,4,7,9,14,17,31);">Ge 27:4,7,9,14,17,31</a> ("savory food") and the Revised Version (British and American) <a onClick="return mV(\'Isa\',30,24);">Isa 30:24</a> (margin "salted").``49';

isbe[7687]='Sayest`sa\'-est: "Thou sayest" (<a onClick="return mV(\'Mat\',27,11);">Mt 27:11</a>; <a onClick="return mV(\'Mar\',15,2);">Mr 15:2</a>; <a onClick="return mV(\'Luk\',22,70);">Lu 22:70</a>, "Ye say"; <a onClick="return mV(\'Jhn\',18,37);">Joh 18:37</a>), i.e. rightly; "Thou hast said" (<a onClick="return mV(\'Mat\',26,25,64);">Mt 26:25,64</a>), = "Yes"; a rabbinical idiom never found in the Old Testament. <a onClick="return mV(\'Mar\',14,62);">Mr 14:62</a> renders by "I am." All these passages WHm punctuate interrogatively (compare Kethubhoth, f. 103 b).``1';

isbe[7692]='Scab, Scabbed`skab, skab\'-ed, skabd (yallepheth, micpachath, cappachath, verb sippach; semasia, leichen): These are generic terms for any skin disease in which there are patches of hard crusts on the surface. The commonest of these are the forms now named eczema, herpes and, perhaps, psoriasis, all of which are common in Bible lands. Milder cases in which the disease was localized and in small patches (the semasia of the Septuagint) did not render the bearer unclean, and they were to be distinguished by the priest (<a onClick="return mV(\'Lev\',13,2,6);">Le 13:2,6</a>) from the more virulent and spreading eruptions which (<a onClick="return mV(\'Lev\',13,7);">Le 13:7</a>) were regarded as causes of ceremonial uncleanness. These severer forms are the leichen of Septuagint mentioned in <a onClick="return mV(\'Lev\',21,20);">Le 21:20</a>, which disqualified any son of Aaron from serving as a priest, and when affecting an animal rendered it unfit to be offered as a burnt offering (<a onClick="return mV(\'Lev\',22,22);">Le 22:22</a>). Hippocrates speaks of these cases as obstinate and persistent, and Galen believed that they might degenerate into leprosy; hence, the terms in which Aeschylus speaks of it (Choephori 281). Celsus, however, recognized that leichen was a papular eruption, not a true scab. The name yallepheth seems to have been given to it on account of the firmness of attachment of the scabs, while the term micpachath refers to its tendency to spread and cover the surface. A cognate word in <a onClick="return mV(\'Eze\',13,18);">Eze 13:18</a> is the name of a large Tallith or prayer veil used by the false prophetesses in Israel (translated "kerchief"). Scabs were especially disfiguring on the head, and this infliction was threatened as a punishment on the daughters of Zion for their wanton haughtiness (<a onClick="return mV(\'Isa\',3,17);">Isa 3:17</a>). In Middle English, "scab" is used for itch or mange, and as a term of opprobrium, as in Greene, Bacon and Bungay,35,1591.``107';

isbe[7694]='Scaffold`skaf\'-old (kiyyor): The English word is used once of Solomon\'s "brazen scaffold" on which he knelt at the dedication of the temple (<a onClick="return mV(\'2Ch\',6,13);">2Ch 6:13</a>).``1';
isbe[7695]='Scale`skal.`<a href="./study/isbe/search.html?string=SIEGE">SIEGE</a>; <a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[7696]='Scales`skalz<P>(1) qasqeseth "fish-scales";<P>(2) meghinnah, maghen, "scales of the crocodile";<P>(3) lepis, with verb lepizo "scale away" (Tobit 3:17; 11:13)):<P>(1) The first Hebrew word qasqeseth means the imbricated scales of fish, which together with the dorsal fin were a distinguishing mark of all fish allowed as food to the Israelite (<a onClick="return mV(\'Lev\',11,9);">Le 11:9</a>ff; <a onClick="return mV(\'Deu\',14,9);">De 14:9</a>f). In the figurative sense the word is used of a coat of mail (<a onClick="return mV(\'1Sa\',17,5,38);">1Sa 17:5,38</a>).<P>(2) Meghinnah from maghen, literally, "a buckler" or "small shield" (<a onClick="return mV(\'2Ch\',23,9);">2Ch 23:9</a>; <a onClick="return mV(\'Jer\',46,3);">Jer 46:3</a>), is used in the description of the crocodile (see <a href="./study/isbe/search.html?string=LEVIATHAN">LEVIATHAN</a>) for the horny scales or scutes imbedded in the skin, not imbricated upon it (<a onClick="return mV(\'Job\',41,15);">Job 41:15 (Hebrew verse 7)</a>).<P>(3) The Greek lepis, which in classical language has a much wider range of meaning than the above Hebrew words ("rind," "husk," "shell," "fish-scale," "scale of snake," "flake of metal and of snow," etc.), is found in the New Testament description of Paul\'s recovery from temporary blindness, "And straightway there fell from his eyes as it were scales, and he received his sight" (<a onClick="return mV(\'Act\',9,18);">Ac 9:18</a>).<P>There is nothing in the words of the sacred text which compels us to think of literal scales. (In Tobit, however, a literal flaking-off of foreign substance is meant.) We have here rather a description of the sensation which terminated the three days\' period of blindness which the apostle suffered after his meeting with the risen Lord on the road to Damascus. The apostle himself does not use this expression in his own graphic description of the same experience: "In that very hour I looked upon him" (<a onClick="return mV(\'Act\',22,13);">Ac 22:13</a>). The phrase has, however, come into English, for we speak of "scales falling from one\'s eyes" when we mean a sudden illumination or remembrance or a dissipation of harassing doubt.<P>In <a onClick="return mV(\'Isa\',40,12);">Isa 40:12</a>; the Revised Version (British and American) <a onClick="return mV(\'Pro\',16,11);">Pr 16:11</a> for peles, in the sense of "instrument for weighing."`<a href="./study/isbe/search.html?string=BALANCE">BALANCE</a>`106';
isbe[7697]='Scall`skol (netheq; thrausma): This only occurs in <a onClick="return mV(\'Lev\',13,\'1-\');">Leviticus 13</a> and <a onClick="return mV(\'Lev\',13,\'1-\');">14</a> where it is used 14 times to describe bald or scaly patches of eruption on the skin. Such patches are generally the result of the action of parasitic organisms. The common form known now as scalled head is produced by a microscopic plant, Achorion schoenleinii. In Old and Middle English, scall was used for scabbiness of the head (Chaucer and Spenser). See also Skeat, Concise Etymol. Dict. of English Language.``1';
