f God (<a onClick="return mV(\'2Ch\',34,9);">2Ch 34:9</a>). These people, left without their religious guides, mingling with the heathen who had brought their gods and, presumably, their priests with them, were apt to be turned from the purity of their faith. A further importation of pagan settlers took place under Esar-haddon and Osnappar (<a onClick="return mV(\'Ezr\',4,9,10);">Ezr 4:9,10</a>). The latter is to be identified with Assur-bani-pal. What the proportions of the different elements in the population were, there is now no means of knowing. That there was some intermarriage is probable; but having regard to racial exclusiveness, we may suppose that it was not common. When the Jews deny to them any relation to Israel, and call them Cuthaeans, as if they were the descendants purely of the heathen settlers, the facts just mentioned should be borne in mind.<P>After the Assyrian conquest we are told that the people suffered from lions (<a onClick="return mV(\'2Ki\',17,25);">2Ki 17:25</a>). Josephus (Ant., IX, xiv, 3) says "a plague seized upon them." In accordance with the ideas of the time, the strangers thought this due to the anger of the tutelary deity of the land, because they worshipped other gods in his territory, while neglecting him. Ignorant of his special ritual ("manner"), they petitioned the Assyrian king, who sent one (Josephus says "some") of the priests who had been carried away to teach them "how they should fear the Lord." How much is implied in this "fearing of the Lord" is not clear. They continued at the same time to serve their own gods. There is nothing to show that the Israelites among them fell into their idolatries. The interest of these in the temple at Jerusalem, the use of which they may now have shared with the Jews, is proved by <a onClick="return mV(\'2Ch\',34,9);">2Ch 34:9</a>. In another place we are told that four score men "from Shechem, from Shiloh, and from Samaria," evidently Israelites, were going up with their offerings to the house of the Lord (<a onClick="return mV(\'Jer\',41,5);">Jer 41:5</a>). Once the people of the country are called Samaritans (<a onClick="return mV(\'2Ki\',17,29);">2Ki 17:29</a>). Elsewhere this name has a purely religious significance.<P>Of the history of Samaria under Assyrian and Babylonian rulers we know nothing. It reappears at the return of the Jews under Persian auspices. The Jews refused the proffered assistance of the Samaritans in rebuilding the temple and the walls of Jerusalem (<a onClick="return mV(\'Ezr\',4,1,3);">Ezr 4:1,3</a>). Highly offended, the latter sought to frustrate the purpose of the Jews (<a onClick="return mV(\'Ezr\',4,4);">Ezr 4:4</a>ff; <a onClick="return mV(\'Neh\',4,7);">Ne 4:7</a>; 1Esd 2:16). That the Samaritans were accustomed to worship in Jerusalem is perhaps implied by one phrase in the letter sent to the Persian king: "The Jews that came up from thee are come to us unto Jerus" (<a onClick="return mV(\'Ezr\',4,12);">Ezr 4:12</a>). Perhaps also they may be referred to in <a onClick="return mV(\'Ezr\',6,21);">Ezr 6:21</a>. Idolatry is not alleged against the "adversaries." We can hardly err if we ascribe the refusal in some degree to the old antagonism between the north and the south, between Ephraim and Judah. Whatever the cause, it led to a wider estrangement and a deeper bitterness. For the history of the people and their temple on Gerizim, see <a href="./study/isbe/search.html?string=SAMARITANS">SAMARITANS</a>.<P>Samaria, with Palestine, fell to Alexander after the battle of Issus. Antiochus the Great gave it to Ptolemy Epiphanes, as the dowry of his daughter Cleopatra (Josephus, Ant, XII, iv, 1). John Hyrcanus reduced and desolated the country (Josephus, BJ, I, ii, 6f). After varying fortunes Samaria became part of the kingdom of Herod, at whose death it was given to Archelaus (Josephus, Ant, XVII, xi, 4; BJ, II, vi, 3). When Archelaus was banished it was joined to the Roman province of Syria (Josephus, Ant, XVII, xiii, 5; BJ, II, viii, 1).<P>Samaria is a country beautifully diversified with mountain and hill, valley and plain. The olive grows plentifully, and other fruit trees abound. There is much excellent soil, and fine crops of barley and wheat are reaped annually. The vine also is largely cultivated on the hill slopes. Remains of ancient forests are found in parts. As Josephus said, it is not naturally watered by many rivers, but derives its chief moisture from rain water, of which there is no lack (BJ, III, iii, 4). He speaks also of the excellent grass, by reason of which the cows yield more milk than those in any other place.<P>There is a good road connecting Nablus with Jaffa; and by a road not quite so good, it is now possible to drive a carriage from Jerusalem to Nazareth, passing through Samaria.`<a href="./study/isbe/search.html?string=SAMARITANS">SAMARITANS</a>`54';
isbe[7612]='Samaritan Pentateuch`sa-mar\'-i-tan.`<a href="./study/isbe/search.html?string=PENTATEUCH,+THE+SAMARITAN">PENTATEUCH, THE SAMARITAN</a>`1';
isbe[7613]='Samaritans`sa-mar\'-i-tanz (shomeronim; Samareitai, New Testament; (singular), Samarites): The name "Samaritans" in <a onClick="return mV(\'2Ki\',17,29);">2Ki 17:29</a> clearly applies to the Israelite inhabitants of the Northern Kingdom. In subsequent history it denotes a people of mixed origin, composed of the peoples brought by the conqueror from Babylon and elsewhere to take the places of the expatriated Israelites and those who were left in the land (722 BC). Sargon claims to have carried away only 27,290 of the inhabitants (KIB, II, 55). Doubtless these were, as in the case of Judah, the chief men, men of wealth and influence, including all the priests, the humbler classes being left to till the land, tend the vineyards, etc. Hezekiah, who came to the throne of Judah probably in 715 BC, could still appeal to the tribes Ephraim, Manasseh, Issachar, Asher and Zebulun (<a onClick="return mV(\'2Ch\',30,5,10,11,18);">2Ch 30:5,10,11,18</a>); and the presence of these tribesmen is implied in the narrative of Josiah\'s reformation (<a onClick="return mV(\'2Ch\',34,6);">2Ch 34:6</a>f). Although the number of the colonists was increased by Esar-haddon and Osnappar (Assur-bani-pal, <a onClick="return mV(\'Ezr\',4,2,9);">Ezr 4:2,9</a>f), the population, it is reasonable to suppose, continued prevailingly Israelite; otherwise their religion would not so easily have won the leading place. The colonists thought it necessary for their own safety to acknowledge Yahweh, in whose land they dwelt, as one among the gods to be feared (<a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a>). In the intermixture that followed "their own gods" seem to have fallen on evil days; and when the Samaritans asked permission to share in building the temple under Zerubbabel, they claimed, apparently with a good conscience, to serve God and to sacrifice to Him as the Jews did (<a onClick="return mV(\'Ezr\',4,1);">Ezr 4:1</a>f). Whatever justification there was for this claim, their proffered friendship was turned to deadly hostility by the blunt refusal of their request. The old enmity between north and south no doubt intensified the quarrel, and the antagonism of Jew and Samaritan, in its bitterness, was destined to pass into a proverb. The Samaritans set themselves, with great temporary success, to frustrate the work in which they were not permitted to share (<a onClick="return mV(\'Ezr\',4,4);">Ezr 4:4</a>ff; <a onClick="return mV(\'Neh\',4,7);">Ne 4:7</a>; etc.).<P>From the strict administration of the Law in Jerusalem malcontents found their way to the freer atmosphere of Samaria. Among these renegades was Manasseh, brother of the high priest, who had married a daughter of Sanballat, the Persian governor of Samaria. According to Josephus, Sanballat, with the sanction of Alexander the Great, built a temple for the Samaritans on Mt. Gerizim, of which Manasseh became high priest (Ant., XI, vii, 2; viii, 2ff). Josephus, however, places Manasseh a century too late. He was a contemporary of Ezra and Nehemiah (<a onClick="return mV(\'Neh\',13,28);">Ne 13:28</a>).<P>When it suited their purpose the Samaritans claimed relationship with the Jews, asserting that their roll of the Pentateuch was the only authentic copy (see <a href="./study/isbe/search.html?string=PENTATEUCH,+THE SAMARITAN">PENTATEUCH, THE SAMARITAN</a>); they were equally ready to deny all connection in times of stress, and even to dedicate their temple to a heathen deity (Josephus, Ant, XII, v, 5). In 128 BC, John Hyrcanus destroyed the temple (XIII, ix, 1). In the time of Christ the Samaritans were ruled by procurators under the Roman governor of Syria. Lapse of years brought no lessening of the hatred between Jews and Samaritans (Ant., XX, vi, 1). To avoid insult and injury at the hands of the latter, Jews from Galilee were accustomed to reach the feasts at Jerusalem by way of Peraea. "Thou art a Samaritan, and hast a demon" was an expression of opprobrium (<a onClick="return mV(\'Jhn\',8,48);">Joh 8:48</a>). Although Jesus forbade the Twelve to go into any city of the Samaritans (<a onClick="return mV(\'Mat\',10,5);">Mt 10:5</a>), the parable of the Good Samaritan shows that His love overleaped the boundaries of national hatred (<a onClick="return mV(\'Luk\',10,30);">Lu 10:30</a>; compare <a onClick="return mV(\'Luk\',17,16);">Lu 17:16</a>; <a onClick="return mV(\'Jhn\',4,9);">Joh 4:9</a>).<P>During the Jewish war Cerealis treated the Samaritans with great severity. On one occasion (67 AD) he slaughtered 11,600 on Mt. Gerizim. For some centuries they were found in considerable numbers throughout the empire, east and west, with their synagogues. They were noted as "bankers" money-changers, For their anti-Christian attitude and conduct Justinian inflicted terrible vengeance on them. From this the race seems never to have recovered. Gradually-dwindling, they now form a small community in Nablus of not more than 200 souls. Their great treasure is their ancient copy of the Law.<P>LITERATURE.<P>The best account of the Samaritans is Mills, Nablus and the Modern Samaritans (Murray, London); compare Montgomery, The Samaritans (1907). A good recent description by J. E. H. Thomson, D. D., of the Passover celebrated annually on Mt. Gerizim will be found in PEFS,1902,82ff.`<a href="./study/isbe/search.html?string=SAMARIA">SAMARIA</a>`54';
isbe[7614]='Samatus`sam\'-a-tus (Samatos): One of the sons of Ezora who put away their "strange wives" (1Esdras 9:34). It is difficult to say which, if any, name it represents in parallel <a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>ff, where no "sons of Ezora" are inserted between "sons of Bani" and "sons of Nebo": probably Shallurn (<a onClick="return mV(\'Ezr\',10,42);">10:42</a>), but possibly Shemariah (<a onClick="return mV(\'Ezr\',10,41);">10:41</a>).``1';
isbe[7615]='Samech`sam\'-ek (camekh): The 15th letter of the Hebrew alphabet; transliterated in this Encyclopedia as "c". It came to be used for the number 60.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[7616]='Sameius`sa-me\'-yus: the King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=SAMEUS">SAMEUS</a> (which see).``1';
isbe[7617]='Samellius`sa-mel\'-i-us (Codex Vaticanus Samellios; Codex Alexandrinus Sebellios, al Semellios; the King James Version Semellius): "Samellius the scribe," one of those who wrote a letter of protest to Artaxerxes against the building of Jerusalem by the returned exiles (1Esdras 2:16,17,25,30) = "Shimshai" in <a onClick="return mV(\'Ezr\',4,8);">Ezr 4:8</a>.``1';
isbe[7618]='Sameus`sa-me\'-us (Codex Alexandrinus and Fritzsche, Samaios; Codex Vaticanus Thamaios; the King James Version Sameius): One of the sons of Emmer who put away their "strange wives" (1Esdras 9:21) = "Shemaiah" (the Revised Version margin "Maaseiah") of the sons of Harim in <a onClick="return mV(\'Ezr\',10,21);">Ezr 10:21</a>.``1';
isbe[7619]='Samgar-Nebo`sam-gar-ne\'-bo (camgar nebho, a Babylonian name): An officer of Nebuchadnezzar, king of Babylon, who, according to the Massoretic Text of <a onClick="return mV(\'Jer\',39,3);">Jer 39:3</a>, took his seat with other nobles in the middle gate of Jerusalem after the Chaldean army had taken the city. Schrader (COT, ii, 109) holds that the name is a Hebraized form of the Assyrian Sumgirnabu ("be gracious, Nebo"), but Giesebrecht (Comm., 211) conjectures for Samgar a corruption of Sar-mag (Sar-magh), equivalent to Rab-mag (rab-magh), which implies virtual dittography. The number of variant readings exhibited by the Septuagint seems to confirm the belief that the text is corrupt. Nebo (nabu) is there joined with the following Sarsechim to agree with Nebushazban of <a onClick="return mV(\'Jer\',39,13);">Jer 39:13</a>. If the name Samgar-nebo is correct, the first Nergal-sharezer "should perhaps be dropped; we would then read: "Samgar-nebo the Sarsechim, Nebushazban the Rab-saris (compare <a onClick="return mV(\'Jer\',39,13);">39:13</a>) and Nergal-sharezer the Rab-mag" (Sayce).`<a href="./study/isbe/search.html?string=RAB-MAG">RAB-MAG</a>; <a href="./study/isbe/search.html?string=RAB+SARIS">RAB-SARIS</a>`197';
isbe[7620]='Sami`sa\'-mi: the King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=SABI">SABI</a> (which see).``1';
isbe[7621]='Samis`sa\'-mis: the King James Version = the Revised Version (British and American) <a href="./study/isbe/search.html?string=SOMEIS">SOMEIS</a> (which see).``1';
isbe[7622]='Samlah`sam\'-la (samlah; Salama): One of the kings of Edom, of the city of Masrekah. He reigned before the Israelites had kings (<a onClick="return mV(\'Gen\',36,36,37);">Ge 36:36,37</a>; <a onClick="return mV(\'1Ch\',1,47,48);">1Ch 1:47,48</a>). The fact that the city is mentioned in connection with the name of the king suggests that Edom was a confederacy at this time and the chief city was the metropolis of the whole country.``1';
isbe[7623]='Sammus`sam\'-us (Codex Alexandrinus Sammous; Codex Vaticanus Sammou): One of those who stood on Ezra\'s right hand as he expounded the Law (1Esdras 9:43) = "Shema" in <a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>.``1';
isbe[7624]='Samos`sa\'-mos (Samos, "height," "mountain" (see Strabo 346, 457)): One of the most famous of the Ionian islands, third in size among the group which includes Lesbos, <a href="./study/isbe/search.html?string=CHIOS">CHIOS</A> (which see) and <a href="./study/isbe/search.html?string=COS">Cos</a> (which see). It is situated at the mouth of the Bay of Ephesus, between the cities of <a href="./study/isbe/search.html?string=EPHESUS">EPHESUS</a> and <a href="./study/isbe/search.html?string=MILETUS">MILETUS</a> (which see), and separated from the mainland of Ionia by the narrow strait where the Greeks met and conquered the Persian fleet in the battle of Mycale, 479 BC (Herodotus ix.100ff). The surface of the island is very rugged and mountainous, Mt. Kerki (modern name) rising to a height of 4,700 ft., and it was due to this that the island received its name (see above).<P>See also <a href="./study/isbe/search.html?string=SAMOTHRACE">SAMOTHRACE</a>.<P>Samos was renowned in antiquity as one of the noted centers of Ionjan luxury, and reached its zenith of prosperity under the rule of the famous tyrant Polycrates (533-522 BC), who made himself master of the Aegean Sea. He carried on trade with Egypt, and his intercourse with that country, his friendship with Amasis, the famous "ring" story and the revolting manner of the death of Polycrates arere all told in one of the most interesting stories of Herodotus (Herod. iii.39ff).<P>In 84 BC, the island was joined to the province of Asia, and in 17 BC it became a civitas libera, through the favor of Augustus (Dio Cass. liv.9; Pliny, NH, v.37). Both Marcus Agrippa and Herod visited the island; and according to Josephus (Ant., XVI, ii, 2; BJ, I, xxi, 11) "bestowed a great many benefits" on it. In the Apocrypha, Samos is mentioned among the places to which Lucius, consul of the Romans, wrote, asking their good will toward the Jews (1Macc 15:23).<P>In the New Testament, Paul touched here, after passing <a href="./study/isbe/search.html?string=CHIOS">CHIOS</a> (which see), on his return from his third missionary journey (<a onClick="return mV(\'Act\',20,15);">Ac 20:15</a>). In Textus Receptus of the New Testament, we find in this passage kai meinantes en Trogullio ("and having remained in Trogyllium"). This reading is wanting in the oldest manuscripts, and may be a sort of gloss, or explanation; due to the technical use of paraballein, "to touch land" (compare Josephus, Ant, XVIII, vi, 4), and not necessarily "to make a landing." Trogyllium lay on the mainland opposite Samos, at the end of the ridge of Mycale. Still there is no particular reason why this reading should be supported, especially as it is not found in the earliest of authorities. Soden\'s 1913 text, however, retains the reading in brackets.<P>LITERATURE.<P>Tozer, Islands of the Aegean (1890). Herodotus and Pausanias have rather full accounts of Samos, and Encyclopedia Brit (11th edition) gives a good bibliography of works both ancient and modern.``89';
isbe[7625]='Samothrace`sam\'-o-thras (Samothrake, "the Thracian Samos"; the King James Version Samothracia, sam-o-thra\'sha; the island was formerly Dardania; for change of name see Pausanias vii.4,3; Strabo x.457, and for a full discussion Conze, Hauser and Benndorf, Neue Untersuchungen auf South, 1880): An island in the Aegean Sea, south of Thrace opposite the mouth of the Hebrus River, and northwest of Troas. The island is mountainous, as the name indicates (see <a href="./study/isbe/search.html?string=SAMOS">SAMOS</a>), and towers above Imbros when viewed from the Trojan coast. The summit is about a mile high. It is mentioned in the Iliad (xiii.12) as the seat of Poseidon and referred to by Virgil Aeneid vii.208.<P>The island was always famous for sanctity, and the seat of a cult of the Cabeiri, which Herodotus (ii.51) says was derived from the Pelasgian inhabitants (see also Aristophanes, Pax 277). The mysteries connected with the worship of these gods later rivaled the famous mysteries of Eleusis, and both Philip of Macedon and Olympias his wife were initiated here (Plut. Alex. 3).<P>Probably because of its sacred character the island did not figure to any extent in history, but in the expedition of Xerxes in 480 BC, one ship at least of the Samothracian contingent is mentioned as conspicuous in the battle of Salamis.<P>The famous "Victory of Samothrace" (now in the Louvre) was set up here by Demetrius Poliorcetes circa 300 BC, and was discovered in 1863. Since that time (1873-75), the Austrian government carried on extensive excavations (see Conze, Hauser and Benndorf, op. cit.).<P>In the New Testament the island is mentioned in <a onClick="return mV(\'Act\',16,11);">Ac 16:11</a>. From Troas, Paul made a straight run to Samothrace, and the next day sailed to <a href="./study/isbe/search.html?string=NEAPOLIS">NEAPOLIS</a> (which see) on the Thracian coast, the port of <a href="./study/isbe/search.html?string=PHILIPPI">PHILIPPI</a> (which see). At the northern end of Samothrace was a town where the ship could anchor for the night, and on the return journey (<a onClick="return mV(\'Act\',20,6);">Ac 20:6</a>) a landing may have been made, but no details are given. Pliny characterizes the island as being most difficult for anchorage, but because of the hazards of sailing by night, the ancient navigators always anchored somewhere if possible.`<a href="./study/isbe/search.html?string=SAMOS">SAMOS</a>`89';
isbe[7626]='Sampsames`samp\'-sa-mez (Sampsames): A place mentioned in 1Macc 15:23, usually identified with Samsun, on the coast of the Black Sea. The Vulgate, with the Revised Version margin, has "Lampsacus."``1';
isbe[7627]='Samson`sam\'-sun (shimshon.<P>1. Name:<P>Derived probably from shemesh, "sun" with the diminutive ending -on, meaning "little sun" or "sunny," or perhaps "sun-man"; Sampson; Latin and English, Samson): His home was near Bethshemesh, which means "house of the sun." Compare the similar formation shimshay (<a onClick="return mV(\'Ezr\',4,8,9,17,23);">Ezr 4:8,9,17,23</a>).<P>2. Character:<P>Samson was a judge, perhaps the last before Samuel. He was a Nazirite of the tribe of Dan (<a onClick="return mV(\'Jdg\',13,5);">Jud 13:5</a>); a man of prodigious strength, a giant and a gymnast—the Hebrew Hercules, a strange champion for Yahweh! He intensely hated the Philistines who had oppressed Israel some 40 years (<a onClick="return mV(\'Jdg\',13,1);">Jud 13:1</a>), and was willing to fight them alone. He seems to have been actuated by little less than personal vengeance, yet in the New Testament he is named among the heroes of faith (<a onClick="return mV(\'Hbr\',11,32);">Heb 11:32</a>), and was in no ordinary sense an Old Testament worthy. He was good-natured, sarcastic, full of humor, and fought with his wits as well as with his fists. Milton has graphically portrayed his character in his dramatic poem Samson Agonistes (1671), on which Handel built his oratorio, Samson (1743).<P>3. Story of His Life:<P>The story of Samson\'s life is unique among the biographies of the Old Testament. It is related in <a onClick="return mV(\'Jdg\',13,\'1-\');">Judges 13-16</a>. Like Isaac, Samuel and John the Baptist, he was a child of prayer (<a onClick="return mV(\'Jdg\',13,8,12);">13:8,12</a>). To Manoah\'s wife the angel of Yahweh appeared twice (<a onClick="return mV(\'Jdg\',13,3,9);">13:3,9</a>), directing that the child which should be born to them should be a Nazirite from the womb, and that he would "begin to save Israel out of the hand of the Philistines" (<a onClick="return mV(\'Jdg\',13,5,7,14);">13:5,7,14</a>). The spirit of Yahweh first began to move him in Mahaneh-dan, between Zorah and Eshtaol (<a onClick="return mV(\'Jdg\',13,25);">13:25</a>). On his arriving at manhood, five remarkable circumstances are recorded of him.<P>(1) His marriage with a Philistine woman of Timnah (<a onClick="return mV(\'Jdg\',14,\'1-\');">Judges 14</a>). His parents objected to the alliance (<a onClick="return mV(\'Jdg\',14,3);">Jud 14:3</a>), but Samson\'s motive in marrying her was that he "sought an occasion against the Philistines." At the wedding feast Samson propounded to his guests a riddle, wagering that if they guessed its answer he would give them 30 changes of raiment. Dr. Moore felicitously renders the text of the riddle thus:<P class="in15">\'Out of the eater came something to eat,<br>And out of the strong came something sweet\' (<a onClick="return mV(\'Jdg\',14,14);">Jud 14:14</a>).<P>The Philistines threatened the life of his bride, and she in turn wrung from Samson the answer; whereupon he retorted (in Dr. Moore\'s version):<P class="in15">\'If with my heifer ye did not plow,<br>Ye had not found out my riddle, I trow\' (<a onClick="return mV(\'Jdg\',14,18);">Jud 14:18</a>).<P>Accordingly, in revenge, Samson went down to Ashkelon, slew some 30 men, and paid his debt; he even went home without his wife, and her father to save her from shame gave her to Samson\'s "best man" (<a onClick="return mV(\'Jdg\',14,20);">Jud 14:20</a>). It has been suggested by W. R. Smith (Kinship and Marriage in Early Arabia, 70-76) that Samson did not from the first intend to take his bride to his home, his marriage being what is known among the Arabs as a tsadiqat, or gift marriage, by which is meant that the husband becomes a part of the wife\'s tribe. This assumes that the social relations of the Hebrews at that time were matriarchate, the wife remaining with her family, of which custom there are other traces in the Old Testament, the husband merely visiting the wife from time to time. But this is not so obvious in Samson\'s case in view of his pique (<a onClick="return mV(\'Jdg\',14,19);">Jud 14:19</a>), and especially in view of his parents\' objection to his marrying outside of Israel (<a onClick="return mV(\'Jdg\',14,3);">Jud 14:3</a>). Not knowing that his bride had been given by her father to his friend, Samson went down to Timnah to visit her, with a kid; when he discovered, however, that he had been taken advantage of, he went out and caught 300 jackals, and putting firebrands between every two tails, he burned up the grain fields and olive yards of the Philistines. The Philistines, however, showed they could play with fire, too, and burned his wife and her father. Thereupon, Samson smote the Philistines in revenge, "hip and thigh" (<a onClick="return mV(\'Jdg\',15,\'1-8\');">Jud 15:1-8</a>).<P>(2) When he escaped to Etam, an almost vertical rock cliff in Judah (by some identified with \'Araq Ismain) not far from Zorah, Samson\'s home, the Philistines invaded Judah, encamped at Lehi above Etam, and demanded the surrender of their arch-enemy. The men of Judah were willing to hand Samson over to the Philistines, and accordingly went down to the cliff Etam, bound Samson and brought him up where the Philistines were encamped (<a onClick="return mV(\'Jdg\',15,\'9-13\');">Jud 15:9-13</a>). When Samson came to Lehi the Philistines shouted as they met him, whereupon the spirit of Yahweh came mightily upon him, so that he broke loose from the two new ropes with which the 3,000 men of Judah had bound him, and seizing a fresh jawbone of an ass he smote with it 1,000 men of the Philistines, boasting as he did so in pun-like poetry, \'With the jawbone of an ass, m-ass upon m-ass\'; or, as Dr. Moore translates the passage, \'With the bone of an ass, I ass-ailed my ass-ailants\' (<a onClick="return mV(\'Jdg\',15,16);">Jud 15:16</a>). At the same time, Samson reverently gave Yahweh the glory of his victory (<a onClick="return mV(\'Jdg\',15,18);">Jud 15:18</a>). Samson being thirsty, Yahweh provided water for him at a place called En-hakkore, or "Partridge Spring," or "the Spring of the Caller"—another name for partridge (<a onClick="return mV(\'Jdg\',15,\'17-19\');">Jud 15:17-19</a>).<P>(3) Samson next went down to Gaza, to the very stronghold of the Philistines, their chief city. There he saw a harlot, and, his passions not being under control, he went in unto her. It was soon noised about that Samson, the Hebrew giant, was in the city. Accordingly, the Philistines laid wait for him. But Samson arose at midnight and laid hold of the doors of the gate and their two posts, and carried them a full quarter of a mile up to the top of the mountain that looketh toward Hebron (<a onClick="return mV(\'Jdg\',16,\'1-3\');">Jud 16:1-3</a>).<P>(4) From Gaza Samson betook himself to the valley of Sorek where he fell in love with another Philistine woman, named Delilah, through whose machinations he lost his spiritual power. The Philistine lords bribed her with a very large sum to deliver him into their hands. Three times Samson deceived her as to the secret of his strength, but at last he explains that he is a Nazirite, and that his hair, which has never been shorn, is the secret of his wonderful power. J. G. Frazer (Golden Bough, III, 390ff) has shown that the belief that some mysterious power resides in the hair is still widespread among savage peoples, e.g. the Fiji Islanders. Thus, Samson fell. By disclosing to Delilah this secret, he broke his covenant vow, and the Spirit of God departed from him (<a onClick="return mV(\'Jdg\',16,\'4-20\');">Jud 16:4-20</a>). The Philistines laid hold on him, put out his eyes, brought him down to Gaza, bound him with fetters, and forced him to grind in the prison house. Grinding was women\'s work! It is at this point that Milton catches the picture and writes,<P class="in15">"Eyeless in Gaza, at the mill with slaves."<P>Howbeit, the hair of his head began to grow again; but his eyes did not! (<a onClick="return mV(\'Jdg\',16,21,22);">Jud 16:21,22</a>).<P>(5) The final incident recorded of Samson is in connection with a great sacrificial feast which the Philistine lords gave in honor of Dagon, their god. In their joyous celebration they sang in rustic rhythm:<P class="in15">\'Our god has given us into our hand<br>The foe of our land,<br>Whom even our most powerful band<br>Was never able to withstand\' (<a onClick="return mV(\'Jdg\',16,24);">Jud 16:24</a>).<P>This song was accompanied probably, as Mr. Macalister suggests, by hand-clapping (Gezer, 129). When they became still more merry, they called for Samson to play the buffoon, and by his pranks to entertain the assembled multitude. The house of Dagon was full of people; about 3,000 were upon the roof beholding as Samson made sport. With the new growth of his hair his strength had returned to him. The dismantled giant longed to be avenged on his adversaries for at least one of his two eyes (<a onClick="return mV(\'Jdg\',16,28);">Jud 16:28</a>). He prayed, and Yahweh heard his prayer. Guided by his attendant, he took hold of the wooden posts of the two middle pillars upon which the portico of the house rested, and slipping them off their pedestals, the house fell upon the lords and upon all the people that were therein. "So the dead that he slew at his death were more than they that he slew in his life" (<a onClick="return mV(\'Jdg\',16,29,30);">Jud 16:29,30</a>). His kinsmen came and carried him up and buried him near his boyhood home, between Zorah and Eshtaol, in the family burying-ground of his father. "And he judged Israel twenty years" (<a onClick="return mV(\'Jdg\',16,31);">Jud 16:31</a>).<P>4. Historical Value:<P>The story of Samson is a faithful mirror of his times: "Every man did that which was right in his own eyes" (<a onClick="return mV(\'Jdg\',17,6);">Jud 17:6</a>; <a onClick="return mV(\'Jdg\',21,25);">21:25</a>). There was no king in those days, i.e. no central government. Each tribe was separately occupied driving out their individual enemies. For 40 years the Philistines had oppressed Samson\'s tribal compatriots. Their suzerainty was also recognized by Judah (<a onClick="return mV(\'Jdg\',14,4);">Jud 14:4</a>; <a onClick="return mV(\'Jdg\',15,11);">15:11</a>). Samson was the hero of his tribe. The general historicity of his story cannot be impeached on the mere ground of improbability. His deeds were those which would most naturally be expected from a giant, filled with a sense of justice. He received the local popularity which a man of extraordinary prowess would naturally be given. All peoples glory in their heroes. The theory that the record in <a onClick="return mV(\'Jdg\',13,\'1-\');">Judges 13-16</a> is based upon some "solar myth" is now generally abandoned. That there are incidents in his career which are difficult to explain, is freely granted. For example, that he killed a lion (<a onClick="return mV(\'Jdg\',14,6);">14:6</a>) is not without a parallel; David and Benaiah did the same (<a onClick="return mV(\'1Sa\',17,\'34-36\');">1Sa 17:34-36</a>; <a onClick="return mV(\'2Sa\',23,20);">2Sa 23:20</a>). God always inspires a man in the line of his natural endowments. That God miraculously supplied his thirst (<a onClick="return mV(\'Jdg\',15,19);">Jud 15:19</a>) is no more marvelous than what God did for Hagar in the wilderness (<a onClick="return mV(\'Gen\',21,19);">Ge 21:19</a>). That Samson carried off the doors of the gate of Gaza and their two posts, bar and all, must not confound us till we know more definitely their size and the distance from Gaza of the hill to which he carried them. The fact that he pulled down the roof on which there were 3,000 men and women is not at all impossible, as Mr. Macalister has shown. If we suppose that there was an immense portico to the temple of Dagon, as is quite possible, which was supported by two main pillars of wood resting on bases of stone, like the cedar pillars of Solomon\'s house (<a onClick="return mV(\'1Ki\',7,2);">1Ki 7:2</a>), all that Samson, therefore, necessarily did, was to push the wooden beams so that their feet would slide over the stone base on which they rested, and the whole portico would collapse. Moreover, it is not said that the whole of the 3,000 on the roof were destroyed (<a onClick="return mV(\'Jdg\',16,30);">Jud 16:30</a>). Many of those in the temple proper probably perished in the number (R. A. S. Macalister, Bible Side-Lights from the Mound of Gezer,1906,127-38).<P>5. Religious Value:<P>Not a few important and suggestive lessons are deducible from the hero\'s life:<P>(1) Samson was the object of parental solicitude from even before his birth. One of the most suggestive and beautiful prayers in the Old Testament is that of Manoah for guidance in the training of his yet unborn child (<a onClick="return mV(\'Jdg\',13,8);">Jud 13:8</a>). Whatever our estimate of his personality is, Samson was closely linked to the covenant.<P>(2) He was endowed with the Spirit of Yahweh—the spirit of personal patriotism, the spirit of vengeance upon a foe of 40 years\' standing (<a onClick="return mV(\'Jdg\',13,1,25);">Jud 13:1,25</a>; <a onClick="return mV(\'Jdg\',14,6);">14:6:19</a>; <a onClick="return mV(\'Jdg\',15,14);">15:14</a>).<P>(3) He also prayed, and Yahweh answered him, though in judgment (<a onClick="return mV(\'Jdg\',16,30);">Jud 16:30</a>). But he was prodigal of his strength. Samson had spiritual power and performed feats which an ordinary man would hardly perform. But he was unconscious of his high vocation. In a moment of weakness he yielded to Delilah and divulged the secret of his strength. He was careless of his personal endowment. He did not realize that physical endowments no less than spiritual are gifts from God, and that to retain them we must be obedient.<P>(4) He was passionate and therefore weak. The animal of his nature was never curbed, but rather ran unchained and free. He was given to sudden fury. Samson was a wild, self-willed man. Passion ruled. He could not resist the blandishments of women. In short, he was an overgrown schoolboy, without self-mastery.<P>(5) He accordingly wrought no permanent deliverance for Israel; he lacked the spirit of cooperation. He undertook a task far too great for even a giant single-handed. Yet, it must be allowed that Samson paved the way for Saul and David. He began the deliverance of Israel from the Philistines. He must, therefore, be judged according to his times. In his days there was unrestrained individual independence on every side, each one doing as he pleased. Samson differed from his contemporaries in that he was a hero of faith (<a onClick="return mV(\'Hbr\',11,32);">Heb 11:32</a>). He was a Nazirite, and therefore dedicated to God. He was given to revenge, yet he was ready to sacrifice himself in order that his own and his people\'s enemies might be overthrown. He was willing to lay down his own life for the sake of his fellow-tribesmen—not to save his enemies, however, but to kill them. (Compare <a onClick="return mV(\'Mat\',5,43);">Mt 5:43</a>f; <a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>.)<P>LITERATURE.<P>(1) Comma. on Judges, notably those by G. F. Moore, ICC, 1895; Budde, Kurzer Handkommentar, 1897; Nowack, Handkommentar, 1900; E. L. Curtis, The Bible for Home and School, 1913; Bachmann, 1868; Keil, 1862; Farrar in Ellicott\'s Commentaries; Watson, Expositor\'s Bible. (2) Articles on "Samson" in the various Bible Dictionaries and Encyclopedias; in particular those by Budde, HDB; C. W. Emmet, in 1-vol HDB; S. A. Cook, New Encyclopedia Brit; Davis, Dict. of the Bible.``152';
isbe[7628]='Samuel`sam\'-u-el (shemu\'el; Samouel): The word "Samuel" signifies "name of God," or "his name is El" (God). Other interpretations of the name that have been offered are almost certainly mistaken. The play upon the name in <a onClick="return mV(\'1Sa\',1,20);">1Sa 1:20</a> is not intended of course to be an explanation of its meaning, but is similar to the play upon the name Moses in <a onClick="return mV(\'Exd\',2,10);">Ex 2:10</a> and frequently elsewhere in similar instances. Thus, by the addition of a few letters shemu\'el becomes sha\'ul me\'el, "asked of God," and recalls to the mother of Samuel the circumstances of the divine gift to her of a son. Outside of 1st Samuel the name of the great judge and prophet is found in <a onClick="return mV(\'Jer\',15,1);">Jer 15:1</a>; <a onClick="return mV(\'Psa\',99,6);">Ps 99:6</a> and in 1 and 2 Chronicles. The reference in Jeremiah seems intended to convey the same impression that is given by the narrative of 1 Samuel, that in some sense Samuel had come to be regarded as a second Moses, upon whom the mantle of the latter had fallen, and who had been once again the deliverer and guide of the people at a great national crisis.<P>1. Sources and Character of the History:<P>The narrative of the events of the life of Samuel appears to be derived from more than one source (see <a href="./study/isbe/search.html?string=SAMUEL,+BOOKS+OF">SAMUEL, BOOKS OF</A>). The narrator had before him and made use of biographies and traditions, which he combined into a single consecutive history. The completed picture of the prophet\'s position and character which is thus presented is on the whole harmonious and consistent, and gives a very high impression of his piety and loyalty to Yahweh, and of the wide influence for good which he exerted. There are divergences apparent in detail and standpoint between the sources or traditions, some of which may probably be due merely to misunderstanding of the true nature of the events recorded, or to the failure of the modern reader rightly to appreciate the exact circumstances and time. The greater part of the narrative of the life of Samuel, however, appears to have a single origin.<P>2. Life:<P>In the portion of the general history of Israel contained in 1 Samuel are narrated the circumstances of the future prophet\'s birth (chapter <a onClick="return mV(\'1Sa\',1,\'1-\');">1</a>); of his childhood and of the custom of his parents to make annual visits to the sanctuary at Shiloh (<a onClick="return mV(\'1Sa\',2,11,\'18-21\',26);">2:11,18-21,26</a>); of his vision, and the universal recognition of him as a prophet enjoying the special favor of Yahweh (<a onClick="return mV(\'1Sa\',3,\'1-\');">3</a>-<a onClick="return mV(\'1Sa\',4,1);">4:1</a>). The narrative is then interrupted to describe the conflicts with the Philistines, the fate of Eli and his sons, and the capture of the ark of God. It is only after the return of the ark, and apparently at the close of the 20 years during which it was retained at Kiriath-jearim, that Samuel again comes forward publicly, exhorting the people to repentance and promising them deliverance from the Philistines. A summary narrative is then given of the summoning of a national council at Mizpah, at which Samuel "judged the children of Israel," and offered sacrifice to the Lord, and of Yahweh\'s response in a great thunderstorm, which led to the defeat and panic-stricken flight of the Philistines. Then follows the narrative of the erection of a commemorative stone or pillar, Eben-ezer, "the stone of help," and the recovery of the Israelite cities which the Philistines had captured (<a onClick="return mV(\'1Sa\',7,\'5-14\');">7:5-14</a>). The narrator adds that the Philistines came no more within the border of Israel all the days of Samuel (<a onClick="return mV(\'1Sa\',7,13);">7:13</a>); perhaps with an intentional reference to the troubles and disasters of which this people was the cause in the time of Saul. A brief general statement is appended of Samuel\'s practice as a judge of going on annual circuit through the land, and of his home at Ramah (<a onClick="return mV(\'1Sa\',7,\'17-17\');">7:15-17</a>).<P>No indication is given of the length of time occupied by these events. At their close, however, Samuel was an old man, and his sons who had been appointed judges in his place or to help him in his office proved themselves unworthy (<a onClick="return mV(\'1Sa\',8,\'1-3\');">1Sa 8:1-3</a>). The elders of the people therefore came to Samuel demanding the appointment of a king who should be his successor, and should judge in his stead. The request was regarded by the prophet as an act of disloyalty to Yahweh, but his protest was overruled by divine direction, and at Samuel\'s bidding the people dispersed (<a onClick="return mV(\'1Sa\',8,\'4-22\');">1Sa 8:4-22</a>).<P>At this point the course of the narrative is again interrupted to describe the family and origin of Saul, his personal appearance, and the search for the lost asses of his father (<a onClick="return mV(\'1Sa\',9,\'1-5\');">1Sa 9:1-5</a>); his meeting with Samuel in a city in the land of Zuph, in or on the border of the territory of Benjamin (Zuph is the name of an ancestor of Elkanah, the father of Samuel, in <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>), a meeting of which Samuel had received divine pre-intimation (<a onClick="return mV(\'1Sa\',9,15);">1Sa 9:15</a>f); the honorable place given to Saul at the feast; his anointing by Samuel as ruler of Israel, together with the announcement of three "signs," which should be to Saul assurances of the reality of his appointment and destiny; the spirit of prophecy which took possession of the future king, whereby is explained a proverbial saying which classed Saul among the prophets; and his silence with regard to what had passed between himself and Samuel on the subject of the kingdom (<a onClick="return mV(\'1Sa\',9,\'6-\');">1Sa 9:6</a>-<a onClick="return mV(\'1Sa\',10,\'1-16\');">10:16</a>).<P>It is usually, and probably rightly, believed that the narrative of these last incidents is derived from a different source from that of the preceding chapters. Slight differences of inconsistency or disagreement lie on the surface. Samuel\'s home is not at Ramah, but a nameless city in the land of Zuph, where he is priest of the high place, with a local but, as far as the narrative goes, not a national influence or reputation; and it is anticipated that he will require the customary present at the hands of his visitors (<a onClick="return mV(\'1Sa\',9,\'6-8\');">1Sa 9:6-8</a>). He is described, moreover, not as a judge, nor does he discharge judicial functions, but expressly as a "seer," a name said to be an earlier title equivalent to the later "prophet" (<a onClick="return mV(\'1Sa\',9,9,11,19);">1Sa 9:9,11,19</a>). Apart, however, from the apparently different position which Samuel occupies, the tone and style of the narrative is altogether distinct from that of the preceding chapters. It suggests, both in its form and in the religious conceptions which are assumed or implied, an older and less elaborated tradition than that which has found expression in the greater part of the book; and it seems to regard events as it were from a more primitive standpoint than the highly religious and monotheistic view of the later accounts. Its value as a witness to history is not impaired, but perhaps rather enhanced by its separate and independent position. The writer or compiler of 1 Samuel has inserted it as a whole in his completed narrative at the point which he judged most suitable. To the same source should possibly be assigned the announcement of Saul\'s rejection in <a onClick="return mV(\'1Sa\',13,\'8-15\');">13:8-15a</a>.<P>The course of the narrative is resumed at <a onClick="return mV(\'1Sa\',10,17);">1Sa 10:17</a>ff, where, in a second national assembly at Mizpah, Saul is selected by lot and accepted by the people as king (10:17-24); after which the people dispersed, and Saul returned to his home at Gibeah (<a onClick="return mV(\'1Sa\',10,25,26,27);">10:25-27</a>). At a solemn assembly at Gilgal, at which the kingship is again formally conferred upon Saul, Samuel delivered a farewell address to his fellow-countrymen. A thunderstorm terrified the people; they were reassured, however, by Samuel with promises of the protection and favor of Yahweh, if they continued to fear and serve Him (<a onClick="return mV(\'1Sa\',11,\'14-\');">11:14</a>-<a onClick="return mV(\'1Sa\',12,\'1-25\');">12:25</a>). Later the rejection of Saul for disobedience and presumption is announced by Samuel (<a onClick="return mV(\'1Sa\',13,\'8-15\');">13:8-15a</a>). The commission to destroy Amalek is delivered to Saul by Samuel; and the rejection of the king is again pronounced because of his failure to carry out the command. Agag is then slain by Samuel with his own hand; and, the latter having returned to his home at Ramah, the narrator adds that he remained there in seclusion until the day of his death, "mourning" for Saul, but refusing to meet him again (<a onClick="return mV(\'1Sa\',15,\'1-\');">1 Samuel 15</a>). Finally the death and burial of Samuel at Ramah, together with the lamentation of the people for him, are briefly recorded in <a onClick="return mV(\'1Sa\',25,\'1-\');">1Sa 25:1</a>, and referred to again in <a onClick="return mV(\'1Sa\',28,3);">28:3</a>.<P>Two incidents of Samuel\'s life remain, in which he is brought into relation with the future king David. No indication of date or circumstance is given except that the first incident apparently follows immediately upon the second and final rejection of Saul as recorded in <a onClick="return mV(\'1Sa\',15,\'1-\');">1 Samuel 15</a>. In <a onClick="return mV(\'1Sa\',16,\'1-13\');">16:1-13</a> is narrated the commission of Samuel to anoint a successor to Saul, and his fulfillment of the commission by the choice of David the son of Jesse, the Bethlehemite. And, in a later chapter (<a onClick="return mV(\'1Sa\',19,\'18-24\');">19:18-24</a>), a second occasion is named on which the compelling spirit of prophecy came upon Saul, and again the proverbial saying, "Is Saul also among the prophets?" is quoted (<a onClick="return mV(\'1Sa\',19,24);">19:24</a>; compare <a onClick="return mV(\'1Sa\',10,11,12);">10:11,12</A>), and is apparently regarded as taking its origin from this event.<P>The anointing of David by Samuel is a natural sequel to his anointing of Saul, when the latter has been rejected and his authority and rights as king have ceased. There is nothing to determine absolutely whether the narrative is derived from the same source as the greater part of the preceding history. Slight differences of style and the apparent presuppositions of the writer have led most scholars to the conclusion that it has a distinct and separate origin. If so, the compiler of the Books of Samuel drew upon a third source for his narrative of the life of the seer, a source which there is no reason to regard as other than equally authentic and reliable. With the second incident related in <a onClick="return mV(\'1Sa\',19,\'18-24\');">1Sa 19:18-24</a>, the case is different. It is hardly probable that so striking a proverb was suggested and passed into currency independently on two distinct occasions. It seems evident that here two independent sources or authorities were used, which gave hardly reconcilable accounts of the origin of a well-known saying, in one of which it has been mistakenly attributed to a similar but not identical occurrence in the life of Saul. In the final composition of the book both accounts were then inserted, without notice being taken of the inconsistency which was apparent between them.<P>Yet later in the history Samuel is represented as appearing to Saul in a vision at Endor on the eve of his death (<a onClick="return mV(\'1Sa\',28,\'11-20\');">1Sa 28:11-20</a>). The witch also sees the prophet and is stricken with fear. He is described as in appearance an old man "covered with a robe" (<a onClick="return mV(\'1Sa\',28,14);">1Sa 28:14</a>). In characteristically grave and measured tones he repeats the sentence of death against the king for his disobedience to Yahweh, and announces its execution on the morrow; Saul\'s sons also will die with him (<a onClick="return mV(\'1Sa\',28,19);">1Sa 28:19</a>), and the whole nation will be involved in the penalty and suffering, as they all had a part in the sin.<P>The high place which Samuel occupies in the thought of the writers and in the tradition and esteem of the people is manifest throughout the history. The different sources from which the narrative is derived are at one in this, although perhaps not to an equal degree. He is the last and greatest of the judges, the first of the prophets, and inaugurates under divine direction the Israelite kingdom and the Davidic line.<P>3. Character and Influence of Samuel:<P>It is not without reason, therefore, that he has been regarded as in dignity and importance occupying the position of a second Moses in relation to the people. In his exhortations and warnings the Deuteronomic discourses of Moses are reflected and repeated. He delivers the nation from the hand of the Philistines, as Moses from Pharaoh and the Egyptians, and opens up for them a new national era of progress and order under the rule of the kings whom they have desired. Thus, like Moses, he closes the old order, and establishes the people with brighter prospects upon more assured foundations of national prosperity and greatness. In nobility of character and utterance also, and in fidelity to Yahweh, Samuel is not unworthy to be placed by the side of the older lawgiver. The record of his life is not marred by any act or word which would appear unworthy of his office or prerogative. And the few references to him in the later literature (<a onClick="return mV(\'Psa\',99,6);">Ps 99:6</a>; <a onClick="return mV(\'Jer\',15,1);">Jer 15:1</a>; <a onClick="return mV(\'1Ch\',6,28);">1Ch 6:28</a>; <a onClick="return mV(\'1Ch\',9,22);">9:22</a>; <a onClick="return mV(\'1Ch\',11,3);">11:3</a>; <a onClick="return mV(\'1Ch\',26,28);">26:28</a>; <a onClick="return mV(\'1Ch\',29,29);">29:29</a>; <a onClick="return mV(\'2Ch\',35,18);">2Ch 35:18</a>) show how high was the estimation in which his name and memory were held by his fellow-countrymen in subsequent ages.<P>LITERATURE.<P>The literature is given in the article, <a href="./study/isbe/search.html?string=SAMUEL,+BOOKS+OF">SAMUEL, BOOKS OF</a> (which see).``65';
isbe[7629]='Samuel, Books of`<b>I. PLACE OF THE BOOKS OF SAMUEL IN THE HEBREW CANON</b><P><b>II. CONTENTS OF THE BOOKS AND PERIOD OF TIME COVERED BY THE HISTORY</b><P><b>III. SUMMARY AND ANALYSIS</b><P class="in15">1. Life of Samuel (1 Samuel 1-15)<P class="in15">2. Reign and Death of Saul (1 Samuel 16-2 Samuel 1)<P class="in15">3. Reign of David (2 Samuel 2-20)<P class="in30">(1) David\'s Seven and a Half Years\' Reign over Judah in Hebron (2 Samuel 2:1-5:3).<P class="in30">(2) Reign of David in Jerusalem over United Israel (2 Samuel 5:4-20:26).<P class="in15">4. Appendix (2 Samuel 21-24)<P><b>IV. SOURCES OF THE HISTORY</b><p class="in15">Two Main and Independent Sources<P><b>V. CHARACTER AND DATE OF THE SOURCES</b><P><b>VI. GREEK VERSIONS OF THE BOOKS OF SAMUEL</b><P><b>VII. ETHICAL AND RELIGIOUS TEACHING</b><P><b>LITERATURE</b><hr /><P>I. Place of the Books of Samuel in the Hebrew Canon.<P>In the Hebrew Canon and enumeration of the sacred books of the Old Testament, the two Books of Samuel were reckoned as one, and formed the third division of the Earlier Prophets (nebhi\'im ri\'shonim). The one book bore the title "Samuel" (shemu\'el), not because Samuel was believed to be the author, but because his life and acts formed the main theme of the book, or at least of its earlier part. Nor was the Book of Samuel separated by any real division in subject-matter or continuity of style from the Book of Kings, which in the original formed a single book, not two as in the English and other modern versions. The history was carried forward without interruption; and the record of the life of David, begun in Samuel, was completed in Kings. This continuity in the narrative of Israelite history was made more prominent in the Septuagint, where the four books were comprised under one title and were known as the four "Books of the Kingdoms" (bibloi basileion). This name was probably due to the translators or scholars of Alexandria. The division into four books, but not the Greek title, was then adopted in the Latin translation, where, however, the influence of Jerome secured the restoration of the Hebrew names, 1 and 2 Samuel, and 1 and 2 Kings (Regum). Jerome\'s example was universally followed, and the fourfold division with the Hebrew titles found a place in all subsequent versions of the Old Testament Scriptures. Ultimately, the distinction of Samuel and Kings each into two books was received also into printed editions of the Hebrew Bible. This was done for the first time in the editio princeps of the Rabbinic Bible, printed at Venice in 1516-17 AD.<P>II. Contents of the Books and Period of Time Covered by the History.<P>The narrative of the two Books of Samuel covers a period of about a hundred years, from the close of the unsettled era of the Judges to the establishment and consolidation of the kingdom under David. It is therefore a record of the changes, national and constitutional, which accompanied this growth and development of the national life, at the close of which the Israelites found themselves a united people under the rule of a king to whom all owed allegiance, controlled and guided by more or less definitely established institutions and laws. This may be described as the general purpose and main theme of the books, to trace the advance of the people under divine guidance to a state of settled prosperity and union in the promised land, and to give prominence to theocratic rule which was the essential condition of Israel\'s life as the people of God under all the changing forms of early government. The narrative therefore centers itself around the lives of the three men, Samuel, Saul and David, who were chiefly instrumental in the establishment of the monarchy, and to whom it was due more than to any others that Israel emerged from the depressed and disunited state in which the tribes had remained during the period of the rule of the Judges, and came into possession of a combined and effective national life. If the formal separation therefore into two books be disregarded, the history of Israel as it is narrated in "Samuel" is most naturally divided into three parts, which are followed by an appendix recording words and incidents which for some reason had not found a place in the general narrative:<P>A. The life and rule of Samuel (<span class="noTag">1Sa 1-15) (death <a onClick="return mV(\'1Sa\',25,1);">1Sa 25:1</A>).<P>B. The life, reign and death of Saul (1Sa 16-2Sa 1).<P>C. The reign and acts of David to the suppression of the two rebellions of Absalom and Sheba (2Sa 2-20).<P>D. Appendix; other incidents in the reign of David, the names of his chief warriors and his Songs or Psalm of Praise (2Sa 21-24).<P>III. Summary and Analysis.</span><P>To present a brief and clear analysis of these Books of Samuel is not altogether easy. For as in the Pentateuch and the earlier historical Books of Joshua and Judges, repetitions and apparently duplicate accounts of the same event are found, which interfere with the chronological development of the narrative. Even the main divisions, as stated above, to a certain extent overlap.<P>1. Life of Samuel (<a onClick="return mV(\'1Sa\',1,\'1-\');">1 Samuel 1-15</a>):<P>(1) Visit of Hannah to Shiloh, and promise of the birth of a son (<a onClick="return mV(\'1Sa\',1,\'1-19\');">1Sa 1:1-19</a>); birth and weaning of Samuel, and presentation to Eli at Shiloh (<a onClick="return mV(\'1Sa\',1,\'19-28\');">1Sa 1:19-28</a>). (2) Hannah\'s song or prayer (<a onClick="return mV(\'1Sa\',2,\'1-10\');">1Sa 2:1-10</a>); ministry of Samuel to Eli the priest (<a onClick="return mV(\'1Sa\',2,11,\'18-21\',26);">1Sa 2:11,18-21,26</a>); the evil practices of the sons of Eli and warning to Eli of the consequences to his house (<a onClick="return mV(\'1Sa\',2,\'12-17\',\'22-25\',\'27-36\');">1Sa 2:12-17,22-25,27-36</a>).<P>(3) Samuel\'s vision at the sanctuary and his induction to the prophetic office (<a onClick="return mV(\'1Sa\',3,\'1-\');">1Sa 3:1</a>-<a onClick="return mV(\'1Sa\',4,1);">4:1</a>).<P>(4) Defeat of the Israelites by the Philistines, capture of the ark of God, death of the two sons of Eli and of Eli himself (<a onClick="return mV(\'1Sa\',4,\'1-\');">1Sa 4</a>).<P>(5) Discomfiture of Dagon before the ark of God at Ashdod; return of the ark to Beth-shemesh, with expiatory offerings of golden tumors and golden mice; its twenty years\' sojourn at Kiriath-jearim (<a onClick="return mV(\'1Sa\',5,\'1-\');">1Sa 5:1-7:4</a>).<P>(6) Assembly of Israel under Samuel at Mizpah, and victory over the Philistines (<a onClick="return mV(\'1Sa\',7,\'5-14\');">1Sa 7:5-14</a>); Samuel established as judge over all Israel (<a onClick="return mV(\'1Sa\',7,\'15-17\');">1Sa 7:15-17</a>).<P>(7) Samuel\'s sons appointed to be judges and the consequent demand of the people for a king; Samuel\'s warning concerning the character of the king for whom they asked (<a onClick="return mV(\'1Sa\',8,\'1-\');">1Sa 8</a>).<P>(8) Saul\'s search for, the lost asses of his father and meeting with Samuel (<a onClick="return mV(\'1Sa\',9,\'1-\');">1Sa 9</a>).<P>(9) Saul is anointed by Samuel to be ruler over the people of Israel, and receives the gift of prophecy (<a onClick="return mV(\'1Sa\',10,\'1-16\');">1Sa 10:1-16</a>); second assembly of the people under Samuel at Mizpah, and election of Saul to be king (<a onClick="return mV(\'1Sa\',10,\'17-27\');">1Sa 10:17-27</a>).<P>(10) Victory of Saul over the Ammonites and deliverance of Jabesh-gilead (<a onClick="return mV(\'1Sa\',11,\'1-13\');">1Sa 11:1-13</a>); Saul made king in Gilgal (<a onClick="return mV(\'1Sa\',11,14,15);">1Sa 11:14,15</a>).<P>(11) Samuel\'s address to the people in Gilgal, defending his own life and action, and exhorting them to fear and serve the Lord (<a onClick="return mV(\'1Sa\',12,\'1-\');">1Sa 12</a>).<P>(12) Saul at Gilgal offers the burnt offering in Samuel\'s absence; gathering of the Philistines to battie at Michmash; the Israelites\' lack of weapons of iron (<a onClick="return mV(\'1Sa\',13,\'1-\');">1Sa 13</a>).<P>(13) Jonathan\'s surprise of the Philistine army, and their sudden panic (<a onClick="return mV(\'1Sa\',14,\'1-23\');">1Sa 14:1-23</a>); Saul\'s vow, unwittingly broken by Jonathan, whom the people deliver from the fatal consequences (<a onClick="return mV(\'1Sa\',14,\'24-45\');">1Sa 14:24-45</a>); victories of Saul over his enemies on every side (<a onClick="return mV(\'1Sa\',14,\'46-52\');">1Sa 14:46-52</a>).<P>(14) War against Amalek, and Saul\'s disobedience to the divine command to exterminate the Amaleldtes (<a onClick="return mV(\'1Sa\',15,\'1-\');">1Sa 15</a>).<P>2. Reign and Death of Saul (<span class="noTag">1 Samuel 16-2 Samuel 1</span>):<P>(1) Anointing of David as Saul\'s successor (<a onClick="return mV(\'1Sa\',16,\'1-13\');">1Sa 16:1-13</a>); his summons to the court of Saul to act as minstrel before the king (<a onClick="return mV(\'1Sa\',16,\'14-23\');">1Sa 16:14-23</a>).<P>(2) David and Goliath (<a onClick="return mV(\'1Sa\',17,\'1-\');">1Sa 17</a>).<P>(3) The love of David and Jonathan (<a onClick="return mV(\'1Sa\',18,\'1-4\');">1Sa 18:1-4</a>); the former\'s advancement and fame, the jealousy of Saul, and his attempt to kill David (<a onClick="return mV(\'1Sa\',18,\'5-16\',29,30);">1Sa 18:5-16,29,30</a>); David\'s marriage to the daughter of Saul (<a onClick="return mV(\'1Sa\',18,\'17-28\');">1Sa 18:17-28</a>).<P>(4) Saul\'s renewed jealousy of David and second attempt to kill him (<a onClick="return mV(\'1Sa\',19,\'1-17\');">1Sa 19:1-17</a>); David\'s escape to Ramah, whither the king followed (<a onClick="return mV(\'1Sa\',19,\'18-24\');">1Sa 19:18-24</a>).<P>(5) Jonathan\'s warning to David of his father\'s resolve and their parting (<a onClick="return mV(\'1Sa\',20,\'1-\');">1Sa 20</a>).<P>(6) David at Nob (<a onClick="return mV(\'1Sa\',21,\'1-9\');">1Sa 21:1-9</a>); and with Achish of Gath (<a onClick="return mV(\'1Sa\',21,\'10-15\');">1Sa 21:10-15</a>).<P>(7) David\'s band of outlaws at Adullam (<a onClick="return mV(\'1Sa\',22,1,2);">1Sa 22:1,2</a>); his provision for the safety of his father and mother in Moab (<a onClick="return mV(\'1Sa\',22,\'3-5\');">1Sa 22:3-5</a>); vengeance of Saul on those who had helped David (<a onClick="return mV(\'1Sa\',22,\'6-23\');">1Sa 22:6-23</a>).<P>(8) Repeated attempts of Saul to take David (<a onClick="return mV(\'1Sa\',23,\'1-\');">1Sa 23</a>; <a onClick="return mV(\'1Sa\',24,\'1-\');">24</a>).<P>(9) Death of Samuel (<a onClick="return mV(\'1Sa\',25,1);">1Sa 25:1</a>); Abigail becomes David\'s wife, after the death of her husband Nabal (<a onClick="return mV(\'1Sa\',25,\'2-44\');">1Sa 25:2-44</a>).<P>(10) Saul\'s further pursuit of David (<a onClick="return mV(\'1Sa\',26,\'1-\');">1Sa 26</a>).<P>(11) David\'s sojourn with Achish of Gath (<a onClick="return mV(\'1Sa\',27,\'1-\');">1Sa 27:1</a>-<a onClick="return mV(\'1Sa\',28,1,2);">28:2</a>; <a onClick="return mV(\'1Sa\',29,\'1-\');">29</a>); Saul and the witch of Endor (<a onClick="return mV(\'1Sa\',28,\'3-25\');">1Sa 28:3-25</a>).<P>(12) David\'s pursuit of the Amalekites who had raided Ziklag, and victory (<a onClick="return mV(\'1Sa\',30,\'1-\');">1Sa 30</a>).<P>(13) Battle between the Philistines and Israel in Mt. Gilboa and death of Saul (<a onClick="return mV(\'1Sa\',31,\'1-\');">1Sa 31</a>).<P>(14) News of Saul\'s death brought to David at Ziklag (<a onClick="return mV(\'2Sa\',1,\'1-16\');">2Sa 1:1-16</a>); David\'s lamentation over Saul and Jonathan (<a onClick="return mV(\'2Sa\',1,\'17-27\');">2Sa 1:17-27</a>).<P>3. Reign of David (<a onClick="return mV(\'2Sa\',2,\'1-\');">2 Samuel 2-20</a>):<P>(1) David\'s Seven and a Half Years\' Reign over Judah in Hebron (<a onClick="return mV(\'2Sa\',2,\'1-\');">2 Samuel 2:1-5:3</a>).<P>(a) Consecration of David as king in Hebron (<a onClick="return mV(\'2Sa\',2,\'1-4\');">2Sa 2:1-4</a> a); message to the men of Jabesh-gilead (<a onClick="return mV(\'2Sa\',2,\'4-7\');">2Sa 2:4-7</a>); Ish-bosheth made king over Northern Israel (<a onClick="return mV(\'2Sa\',2,\'8-11\');">2Sa 2:8-11</a>); defeat of Abner and death of Asahel (<a onClick="return mV(\'2Sa\',2,\'12-32\');">2Sa 2:12-32</a>).<P>(b) Increase of the fame and prosperity of David, and the names of his sons (<a onClick="return mV(\'2Sa\',3,\'1-5\');">2Sa 3:1-5</a>); Abner\'s submission to David, and treacherous murder of the former by Joab (<a onClick="return mV(\'2Sa\',3,\'6-39\');">2Sa 3:6-39</a>).<P>(c) Murder of Ish-bosheth and David\'s vengeance upon his murderers (<a onClick="return mV(\'2Sa\',4,\'1-3\',\'5-12\');">2Sa 4:1-3,5-12</a>); notice of the escape of Mephibosheth, when Saul and Jonathan were slain at Jezreel (<a onClick="return mV(\'2Sa\',4,4);">2Sa 4:4</a>).<P>(d) David accepted as king over all Israel (<a onClick="return mV(\'2Sa\',5,\'1-3\');">2Sa 5:1-3</a>).<P>(2) Reign of David in Jerusalem over United Israel (<a onClick="return mV(\'2Sa\',5,4);">2 Samuel 5:4-20:26</a>).<P>(a) Taking of Jerusalem and victories over the Philistines (<a onClick="return mV(\'2Sa\',5,\'4-25\');">2Sa 5:4-25</a>).<P>(b) Return of the ark to the city of David (<a onClick="return mV(\'2Sa\',6,1);">2Sa 6</a>).<P>(c) David\'s purpose to build a temple for the Lord (<a onClick="return mV(\'2Sa\',7,\'1-3\');">2Sa 7:1-3</a>); the divine answer by the prophet Nathan, and the king\'s prayer (<a onClick="return mV(\'2Sa\',7,\'4-29\');">2Sa 7:4-29</a>).<P>(d) Victories over the Philistines, Syrians, and other peoples (<a onClick="return mV(\'2Sa\',8,\'1-\');">2Sa 8</a>).<P>(e) David\'s reception of Mephibosheth (<a onClick="return mV(\'2Sa\',9,1);">2Sa 9</a>).<P>(f) Defeat of the Ammonites and Syrians by the men of Israel under the command of Joab (<a onClick="return mV(\'2Sa\',10,\'1-\');">2Sa 10:1</a>-<a onClick="return mV(\'1Sa\',11,1);">11:1</a>).<P>(g) David and Uriah, the latter\'s death in battle, and David\'s marriage with Bath-sheba (<a onClick="return mV(\'2Sa\',11,\'2-27\');">2Sa 11:2-27</a>).<P>(h) Nathan\'s parable and David\'s conviction of sin (<a onClick="return mV(\'2Sa\',12,\'1-15\');">2Sa 12:1-15</a>); the king\'s grief and intercession for his sick son (<a onClick="return mV(\'2Sa\',12,\'15-25\');">2Sa 12:15-25</a>); siege and capture of Rabbah, the Ammonite capital (<a onClick="return mV(\'2Sa\',12,\'26-31\');">2Sa 12:26-31</a>).<P>(i) Amnon and Tamar (<a onClick="return mV(\'2Sa\',13,\'1-22\');">2Sa 13:1-22</a>); Absalom\'s revenge and murder of Amnon (<a onClick="return mV(\'2Sa\',13,\'23-36\');">2Sa 13:23-36</a>); flight of Absalom (<a onClick="return mV(\'2Sa\',13,\'37-39\');">2Sa 13:37-39</a>).<P>(j) Return of Absalom to Jerusalem (<a onClick="return mV(\'2Sa\',14,\'1-24\');">2Sa 14:1-24</a>); his beauty, and reconciliation with the king (<a onClick="return mV(\'2Sa\',14,\'25-33\');">2Sa 14:25-33</a>).<P>(k) Absalom\'s method of ingratiating himself with the people (<a onClick="return mV(\'2Sa\',15,\'1-6\');">2Sa 15:1-6</a>); his revolt and the flight of the king from Jerusalem (<a onClick="return mV(\'2Sa\',15,\'7-31\');">2Sa 15:7-31</a>); meeting with Hushai (<a onClick="return mV(\'2Sa\',15,\'32-37\');">2Sa 15:32-37</a>); Absalom in Jerusalem (<a onClick="return mV(\'2Sa\',15,37);">2Sa 15:37</a>).<P>(l) David\'s\' meeting with Ziba (<a onClick="return mV(\'2Sa\',16,\'1-4\');">2Sa 16:1-4</a>), and Shimei (<a onClick="return mV(\'2Sa\',16,\'5-14\');">2Sa 16:5-14</a>); counsel of Ahitophel and Hushai (<a onClick="return mV(\'2Sa\',16,15);">2Sa 16:15-17:14</a>); the news carried to David (<a onClick="return mV(\'2Sa\',17,\'15-22\');">2Sa 17:15-22</a>); death of Ahitophel (<a onClick="return mV(\'2Sa\',17,23);">2Sa 17:23</a>).<P>(m) David at Mahanaim (<a onClick="return mV(\'2Sa\',17,\'24-29\');">2Sa 17:24-29</a>).<P>(n) The revolt subdued, death of Absalom, and reception by David of the tidings (<a onClick="return mV(\'2Sa\',18,\'1-\');">2Sa 18:1</a>-<a onClick="return mV(\'2Sa\',19,\'1-8\');">19:8</a>).<P>(o) Return of the king to Jerusalem, and meetings with Shimei, Mephibosheth, and Barzillai the Gileadite (<a onClick="return mV(\'2Sa\',19,\'8-43\');">2Sa 19:8-43</a>).<P>(p) Revolt of Sheba the Benjamite, and its suppression by Joab with the death of Amasa (<a onClick="return mV(\'2Sa\',20,1);">2Sa 20:1,2</a>,<a onClick="return mV(\'2Sa\',20,\'4-22\');">4-22</a>); the king\'s treatment of the concubines left at Jerusalem (<a onClick="return mV(\'2Sa\',20,3);">2Sa 20:3</a>); the names of his officers (<a onClick="return mV(\'2Sa\',20,\'23-26\');">2Sa 20:23-26</a>).<P>4. Appendix (<a onClick="return mV(\'2Sa\',21,\'1-\');">2 Samuel 21-24</a>):<P>(1) Seven male descendants of Saul put to death at the instance of the Gibeonites (<a onClick="return mV(\'2Sa\',21,\'1-14\');">2Sa 21:1-14</a>); incidents of wars with the Philistines (<a onClick="return mV(\'2Sa\',21,\'15-22\');">2Sa 21:15-22</a>).<P>(2) David\'s song of thanksgiving and praise (<a onClick="return mV(\'2Sa\',22,\'1-\');">2Sa 22</a>).<P>(3) The "last words" of David (<a onClick="return mV(\'2Sa\',23,\'1-7\');">2Sa 23:1-7</a>); names and exploits of David\'s "mighty men" (<a onClick="return mV(\'2Sa\',23,\'8-39\');">2Sa 23:8-39</a>).<P>(4) The king\'s numbering of the people, the resulting plague, and the dedication of the threshing-floor of Araunah the Jebusite (<a onClick="return mV(\'2Sa\',24,\'1-\');">2Sa 24</a>).<P>IV. Sources of the History.<P>The natural inference from the character and contents of the Books of Samuel, as thus reviewed, is that the writer has made use of authorities, "sources" or "documents," from which he has compiled a narrative of the events which it was his desire to place on record. The same characteristics are noticeable here which are found in parts of the Pentateuch and of the Books of Joshua and Judges, that in some instances duplicate or parallel accounts are given of one and the same event, which seems to be regarded from different points of view and is narrated in a style which is more or less divergent from that of the companion record. Examples of this so-called duplication are more frequent in the earlier parts of the books than in the later. There are presented, for instance, two accounts of Saul\'s election as king, and an act of disobedience is twice followed, apparently quite independently, by the sentence of rejection. Independent also and hardly consistent narratives are given of David\'s introduction to Saul (<a onClick="return mV(\'1Sa\',16,\'14-23\');">1Sa 16:14-23</a>; <a onClick="return mV(\'1Sa\',17,31,55);">17:31ff, 55</a>); and the two accounts of the manner of the king\'s death can be imperfectly reconciled only on the hypothesis that the young Amalekite told a false tale to David in order to magnify his own part in the matter. In these and other instances little or no attempt seems to be made to harmonize conflicting accounts, or to reconcile apparent discrepancies. In good faith the writer set down the records as he found them, making extracts or quotations from his authorities on the several events as they occurred, and thus building up his own history on the basis of the freest possible use of the materials and language of those who had preceded him. However alien such a method of composition may appear to modern thought and usage in the West, it is characteristic of all early oriental writing. It would be almost impossible to find in any Eastern literature a work of any length or importance which was not thus silently indebted to its predecessors, had incorporated their utterances, and had itself in turn suffered interpolation at the hands of later editors and transcribers. Accordingly, early Hebrew historical literature also, while unique in its spirit, conformed in its methods to the practice of the age and country in which it was composed. It would have been strange if it had been otherwise.<P>Two Main and Independent Sources:<P>Apart from the appendix and minor additions, of which Hannah\'s song or psalm in <a onClick="return mV(\'1Sa\',2,1);">1 Samuel 2</a> is one, the main portion of the book is derived from two independent sources, which themselves in all probability formed part of a larger whole, a more or less consecutive history or histories of Israel. These sources may, however, have been, as others think, rather of a biographical nature, presenting and enforcing the teaching of the acts and experience of the great leaders and rulers of the nation. The parallelism and duplication of the narrative is perhaps most evident in the history of Saul. The broad lines of distinction between the two may be defined without much difficulty or uncertainty. The greater part of the first eight chapters of 1 Samuel is in all probability derived from the later of these two sources, to which is to be assigned more or less completely <a onClick="return mV(\'1Sa\',10,\'1-\');">1 Samuel 10-12:15</a>; <a onClick="return mV(\'1Sa\',17,\'1-\');">17-19</a>; <a onClick="return mV(\'1Sa\',21,\'1-\');">21-25</a>; <a onClick="return mV(\'1Sa\',28,\'1-\');">28</a> and <a onClick="return mV(\'2Sa\',1,\'1-\');">2Sa 1-7</a>. The earlier source has contributed <a onClick="return mV(\'1Sa\',9,\'1-\');">1Sa 9</a> with parts of <a onClick="return mV(\'1Sa\',10,\'1-\');">1 Samuel 10</a>; <a onClick="return mV(\'1Sa\',11,\'1-\');">11</a>; <a onClick="return mV(\'1Sa\',13,\'1-\');">13</a>; <a onClick="return mV(\'1Sa\',14,\'1-\');">14</a>; <a onClick="return mV(\'1Sa\',16,\'1-\');">16</a>; <a onClick="return mV(\'1Sa\',20,\'1-\');">20</a> and considerable portions of <a onClick="return mV(\'1Sa\',22,\'1-\');">1 Samuel 22</a>; <a onClick="return mV(\'1Sa\',23,\'1-\');">23</a>; <a onClick="return mV(\'1Sa\',26,\'1-\');">26-27</a>; <a onClick="return mV(\'1Sa\',29,\'1-\');">29-31</a>; <a onClick="return mV(\'2Sa\',1,\'1-\');">2Sa 1</a> (in part); <a onClick="return mV(\'2Sa\',2,\'1-\');">2-6</a>; <a onClick="return mV(\'2Sa\',9,\'1-\');">9-20</a>. Some details have probably been derived from other sources, and additions made by the editor or editors. This general determination of sources rests upon a difference of standpoint and religious conception, and upon slighter varieties of style which are neither so pronounced nor so readily distinguished as in the books of the Pentateuch. It is reasonable also to bear in mind that a close and exact division or line of demarcation in every detail is not to be expected.<P>V. Character and Date of the Sources.<P>Attempts which have been made to determine the date of these two sources, or to identify them with one or other of the principal authorities from which the historical narratives of the Pentateuch are derived, have not been convincing. In the judgment of some, however, the later of the two sources should be regarded as a continuation of the narrative or document known as E, and the earlier be assigned to J. The style of the latter has much in common with the style of J, and is clear, vigorous and poetical; the religious conceptions also that are embodied and taught are of a simple and early type. The later writing has been supposed to give indications of the influence of the prophetic teaching of the 8th century. The indications, however, are not sufficiently decisive to enable a final judgment to be formed. If it is borne in mind that J and E represent rather schools of teaching and thought than individual writers, the characteristics of the two sources of the Books of Samuel would not be out of harmony with the view that from these two schools respectively were derived the materials out of which the history was compiled. The "sources" would then, according to the usual view, belong to the 9th and 8th centuries before the Christian era; and to a period not more than a century or a century and a half later should be assigned the final compilation and completion of the book as it is contained in the Hebrew Canon of Scripture.<P>VI. Greek Versions of the Books of Samuel.<P>For an exact estimate and understanding of the history and text of the Books of Samuel count must further be taken of the Greek version or versions. In the Septuagint there is great divergence from the Hebrew Massoretic text, and it is probable that in the course of transmission the Greek has been exposed to corruption to a very considerable extent. At least two recensions of the Greek text are in existence, represented by the Vatican and Alexandrian manuscripts respectively, of which the latter is nearer to the Hebrew original, and has apparently been conformed to it at a later period with a view to removing discrepancies; and this process has naturally impaired its value as a witness to the primary shape of the Greek text itself. There are therefore three existing types of the text of Samuel; the Massoretic Hebrew and Codex Vaticanus and Codex Alexandrinus in the Greek. The original form of the Septuagint, if it could be recovered, would represent a text anterior to the Massoretic recension, differing from, but not necessarily superior to, the latter. For the restoration of the Greek text, the Old Latin, where it is available, affords valuable help. It is evident then that in any given instance the agreement of these three types or recensions of the text is the strongest possible witness to the originality and authenticity of a reading; but that the weight attaching to the testimony of A will not in general, on account of the history of its text, be equivalent to that of either of the other two.<P>VII. Ethical and Religious Teaching.<P>The religious teaching and thought of the two Books of Samuel it is not difficult to summarize. The books are in form a historical record of events; but they are at the same time and more particularly a history conceived with a definite purpose, and made to subserve a definite moral and religious aim. It is not a narrative of events solely, or the preservation of historical detail, that the writer has in view, but rather to elucidate and enforce from Israel\'s experience the significance of the divine and moral government of the nation. The duty of king and people alike is to obey Yahweh, to render strict and willing deference to His commands, and on this path of obedience alone will national independence and prosperity be secured. With the strongest emphasis, and with uncompromising severity, sin even in the highest places is condemned; and an ideal of righteousness is set forth in language and with an earnestness which recalls the exhortations of Deuteronomy. Thus the same is true of the Books of Samuel as is manifest in the preceding books of the canonical Old Testament: they are composed with a didactic aim. The experience of the past is made to afford lessons of warning and encouragement for the present. To the writer or writers—the history of the development and upbuilding of the Israelite kingdom is pregnant with a deeper meaning than lies on the surface, and this meaning he endeavors to make plain to his readers through the record. The issues of the events and the events themselves are under the guidance and control of Yahweh, who always condemns and punishes wrong, but approves and rewards righteousness. Thus the narrative is history utilized to convey moral truth. And its value is to be estimated, not primarily as recording the great deeds of the past, but as conveying ethical teaching; that by means of the history with all its glamor and interest the people may be recalled to a sense of their high duty toward God, and be warned of the inevitable consequences of disobedience to Him.<P>LITERATURE.<P>Upon all points of introduction, criticism and interpretation, the commentaries afford abundant and satisfactory guidance. The principal English commentaries. are by H. P. Smith in ICC, Edinburgh,1899,and S. R. Driver, Notes on the Hebrew Text of the Books of Samuel, 2nd edition, Oxford, 1913; A. R. S. Kennedy, "Samuel," New Century Bible, New York, Frowde, 1905; in German by R. Budde,1902,W. Nowack,1902,A. Klostermann, 1887. See also the articles "Samuel" in HDB, Encyclopedia Biblica and Jewish Encyclopedia.``65';
isbe[7630]='Sanaas`san\'-a-as (Codex Alexandrinus and Fritzsche, Sanaas; Codex Vaticanus Sama; the King James Version, Annaas): The sons of Sanaas returned in large numbers with Zerubbabel (1Esdras 5:23) = "Senaah" in <a onClick="return mV(\'Ezr\',2,35);">Ezr 2:35</a>; <a onClick="return mV(\'Neh\',7,38);">Ne 7:38</a>. The numbers vary in each case (Esdras, 3,330 or 3,301; Ezra, 3,630; Nehemiah, 3,930).``1';
