isbe = [];

isbe[7601]='Salt, Pillar of``<a href="./study/isbe/search.html?string=LOT">LOT</a>; <a href="./study/isbe/search.html?string=SALT">SALT</a>; <a href="./study/isbe/search.html?string=SIDDIM">SIDDIM</a>; <a href="./study/isbe/search.html?string=SLIME">SLIME</a>`1';
isbe[7602]='Salt, Valley of`(ge\' ha-melach): The scene of battles, firstly, between David or his lieutenant Abishai and the Edomites (<a onClick="return mV(\'2Sa\',8,13);">2Sa 8:13</a>; <a onClick="return mV(\'1Ch\',18,12);">1Ch 18:12</a>; <a onClick="return mV(\'Psa\',60,1);">Ps 60, title</a>), and later between Amaziah and these same foes (<a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>; <a onClick="return mV(\'2Ch\',25,11);">2Ch 25:11</a>). It is tempting to connect this "Valley of Salt" with es Sebkhah, the marshy, salt-impregnated plain which extends from the southern end of the Dead Sea to the foot of the cliffs, but in its present condition it is an almost impossible place for a battle of any sort. The ground is so soft and spongy that a wide detour around the edges has to be made by those wishing to get from one side to the other. It is, too, highly probable that in earlier times the whole of this low-lying area was covered by the waters of the Dead Sea. It is far more natural to identify ge\' ha-melach with the Wady el-Milch ("Valley of Salt"), one of the three valleys which unite at Beersheba to form the Wady ec-Ceba\'. These valleys, el-Milch and ec-Ceba, together make a natural frontier to Canaan.``117';
isbe[7603]='Salt-Wort`solt\'-wurt (malluach, a word connected with melach, "salt," translated halimos; the King James Version, mallows): The halimos of the Greeks is the sea orache, Atriplex halimus, a silvery whitish shrub which flourishes upon the shores of the Dead Sea alongside the rutm (see <a href="./study/isbe/search.html?string=JUNIPER">JUNIPER</a>). Its leaves are oval and somewhat like those of an olive. They have a sour flavor and would never be eaten when better food was obtainable (<a onClick="return mV(\'Job\',30,4);">Job 30:4</a>). The translation "mallows" is due to the apparent similarity of the Hebrew malluach to the Greek malache, which is the Latin malva and English "mallow." Certain species of malva known in Arabic, as khubbazeh, are very commonly eaten by the poor of Palestine.``117';
isbe[7604]='Salu`sa\'-lu (calu\'; Septuagint: Codex Vaticanus Salmon; Codex Alexandrinus Salo; the King James Version has "Salom" in 1Macc 2:26): A prince and the head of a house of the tribe of Simeon and the father of Zimri who was slain by Phinehas along with the Midianite woman whom he had brought to the camp of Israel (<a onClick="return mV(\'Num\',25,14);">Nu 25:14</a>; 1Macc 2:26).``1';
isbe[7605]='Salum`sa\'-lum (Saloum):<P>(1) The head of one of the families of porters (1Esdras 5:28; omitted in Codex Vaticanus) = "Shallum" in <a onClick="return mV(\'Ezr\',2,42);">Ezr 2:42</a>; <a onClick="return mV(\'Ezr\',10,24);">10:24</a>; <a onClick="return mV(\'Neh\',7,45);">Ne 7:45</a> = "Sallumus" in 1Esdras 9:25.<P>(2) 1Esdras 8:1 King James Version = the Revised Version (British and American) "Salem."``1';
isbe[7606]='Salutation`sal-u-ta\'-shun (aspasmos): A greeting which might be given in person, orally (<a onClick="return mV(\'Luk\',1,29,41,44);">Lu 1:29,41,44</a>), or in writing, usually at the close of a letter (<a onClick="return mV(\'1Cr\',16,21);">1Co 16:21</a>; <a onClick="return mV(\'Col\',4,18);">Col 4:18</a>; <a onClick="return mV(\'2Th\',3,17);">2Th 3:17</a>; compare use of chairein, "greeting," "joy" in <a onClick="return mV(\'Jam\',1,1);">Jas 1:1</a>). The Pharisaic Jews loved salutations in public places (<a onClick="return mV(\'Mat\',23,7);">Mt 23:7</a>; <a onClick="return mV(\'Mar\',12,38);">Mr 12:38</a>, the King James Version "greeting," the Revised Version (British and American) "salutation"; <a onClick="return mV(\'Luk\',11,43);">Lu 11:43</a>; <a onClick="return mV(\'Luk\',20,46);">20:46</a>). Often these salutations were very elaborate, involving much time in prostrations, embracings, etc. When Jesus therefore sent out the Seventy, He forbade salutation by the way (<a onClick="return mV(\'Luk\',10,4);">Lu 10:4</a>), though He ordinarily encouraged proper civilities of this sort (<a onClick="return mV(\'Mat\',5,47);">Mt 5:47</a>; <a onClick="return mV(\'Mat\',10,12);">10:12</a>).``137';
isbe[7607]='Salvation`sal-va\'-shun:<P><b>I. IN THE OLD TESTAMENT</b><P class="in15">1. General<P class="in15">2. Individualism<P class="in15">3. Faith<P class="in15">4. Moral Law<P class="in15">5. Sacrifices<P class="in15">6. Ritual Law<P><b>II. INTERMEDIATE LITERATURE</b><P class="in15">1. General<P class="in15">2. The Law<P><b>III. THE TEACHING OF CHRIST</b><P class="in15">1. The Baptist<P class="in15">2. Kingdom of God<P class="in15">3. Present and Future<P class="in15">4. Individualism<P class="in15">5. Moral Progress<P class="in15">6. Forgiveness<P class="in15">7. Person of Christ<P class="in15">8. Notes<P><b>IV. PAUL</b><P class="in15">1. General<P class="in15">2. Moral Progress<P class="in15">3. The Spirit<P class="in15">4. Mystical Union<P class="in15">5. Forgiveness<P class="in15">6. Atonement<P class="in15">7. Summary<P class="in15">8. Notes<P><b>V. THE REST OF THE NEW TESTAMENT: SUMMARY</b><P class="in15">1. John<P class="in15">2. Hebrews<P class="in15">3. Peter<P class="in15">4. Summary<P><b>LITERATURE</b><hr /><P>In English Versions of the Bible the words "salvation" "save," are not technical theological terms, but denote simply "deliverance," in almost any sense the latter word can have. In systematic theology, however, "salvation" denotes the whole process by which man is delivered from all that would prevent his attaining to the highest good that God has prepared for him. Or, by a transferred sense, "salvation" denotes the actual enjoyment of that good. So, while these technical senses are often associated with the Greek or Hebrew words translated "save," etc., yet they are still more often used in connection with other words or represented only by the general sense of a passage. And so a collection of the original terms for "save," etc., is of value only for the student doing minute detailed work, while it is the purpose of the present article to present a general view of the Biblical doctrine of salvation.<P>I. In the Old Testament<P>1. General:<P>(1) As long as revelation had not raised the veil that separates this life from the next, the Israelite thought of his highest good as long life in a prosperous Palestine, as described most typically in <a onClick="return mV(\'Deu\',28,\'1-14\');">De 28:1-14</a>. But a definite religious idea was present also, for the "land of milk and honey," even under angelic protection, was worthless without access to God (<a onClick="return mV(\'Exd\',33,\'1-4\');">Ex 33:1-4</a>), to know whom gives happiness (<a onClick="return mV(\'Isa\',11,9);">Isa 11:9</a>; <a onClick="return mV(\'Hab\',2,14);">Hab 2:14</a>; <a onClick="return mV(\'Jer\',31,34);">Jer 31:34</a>). Such a concept is normal for most of the Old Testament, but there are several significant enlargements of it. That Israel should receive God\'s characteristic of righteousness is a part of the ideal (<a onClick="return mV(\'Isa\',1,26);">Isa 1:26</a>; <a onClick="return mV(\'Isa\',4,3,4);">4:3,4</a>; <a onClick="return mV(\'Isa\',32,\'1-8\');">32:1-8</a>; <a onClick="return mV(\'Isa\',33,24);">33:24</a>; <a onClick="return mV(\'Jer\',31,33,34);">Jer 31:33,34</a>; <a onClick="return mV(\'Eze\',36,25,26);">Eze 36:25,26</a>; <a onClick="return mV(\'Zec\',8,\'1-\');">Zec 8</a>; <a onClick="return mV(\'Dan\',9,24);">Da 9:24</a>; <a onClick="return mV(\'Psa\',51,\'10-12\');">Ps 51:10-12</a>). Good was found in the extension of Israel\'s good to the surrounding nations (<a onClick="return mV(\'Mic\',4,\'1-4\');">Mic 4:1-4</a>; <a onClick="return mV(\'Isa\',2,\'2-4\');">Isa 2:2-4</a>; <a onClick="return mV(\'Isa\',45,5,6);">45:5,6</a>; <a onClick="return mV(\'Zec\',2,11);">Zec 2:11</a>; <a onClick="return mV(\'Zec\',8,22,23);">8:22,23</a>; <a onClick="return mV(\'Isa\',60,\'1-\');">Isa 60</a>; <a onClick="return mV(\'Isa\',66,\'19-21\');">66:19-21</a>; <a onClick="return mV(\'Zec\',14,16,17);">Zec 14:16,17</a>, etc.), even to the extension of the legitimate sacrificial worship to the soil of Egypt (<a onClick="return mV(\'Isa\',19,\'19-22\');">Isa 19:19-22</a>). Palestine was insufficient for the enjoyment of God\'s gifts, and a new heaven and a new earth were to be received (<a onClick="return mV(\'Isa\',65,17);">Isa 65:17</a>; <a onClick="return mV(\'Isa\',66,22);">66:22</a>), and a share in the glories was not to be denied even to the dead (<a onClick="return mV(\'Isa\',26,19);">Isa 26:19</a>; <a onClick="return mV(\'Dan\',12,2);">Da 12:2</a>). And, among the people so glorified, God would dwell in person (<a onClick="return mV(\'Isa\',60,19,20);">Isa 60:19,20</a>; <a onClick="return mV(\'Zec\',2,\'10-12\');">Zec 2:10-12</a>).<P>(2) Salvation, then, means deliverance from all that interferes with the enjoyment of these blessings. So it takes countless forms—deliverance from natural plagues, from internal dissensions, from external enemies, or from the subjugation of conquerors (the exile, particularly). As far as enemies constitute the threatening danger, the prayer for deliverance is often based on their evil character (<a onClick="return mV(\'Psa\',101,\'1-\');">Ps 101</a>, etc.). But for the individual all these evils are summed up in the word "death," which was thought to terminate all relation to God and all possibility of enjoying His blessings (<a onClick="return mV(\'Psa\',115,17);">Ps 115:17</a>; <a onClick="return mV(\'Isa\',38,18);">Isa 38:18</a>, etc.). And so "death" became established as the antinomy to "salvation," and in this sense the word has persisted, although the equation "loss of salvation = physical death" has long been transcended. But death and its attendant evils are worked by God\'s wrath, and so it is from this wrath that salvation is sought (<a onClick="return mV(\'Jos\',7,26);">Jos 7:26</a>, etc.). And thus, naturally, salvation is from everything that raises that wrath, above all from sin (<a onClick="return mV(\'Eze\',36,25,26);">Eze 36:25,26</a>, etc.).<P>2. Individualism:<P>(1) At first the "unit of salvation" was the nation (less prominently the family), i.e. a man though righteous could lose salvation through the faults of others. A father could bring a curse on his children (<a onClick="return mV(\'2Sa\',21,\'1-14\');">2Sa 21:1-14</a>), a king on his subjects (<a onClick="return mV(\'2Sa\',24,1);">2Sa 24</a>), or an unknown sinner could bring guilt on an entire community (<a onClick="return mV(\'Deu\',21,\'1-9\');">De 21:1-9</a>). (On the other hand, ten righteous would have saved Sodom (<a onClick="return mV(\'Gen\',18,32);">Ge 18:32</a>).) And the principle of personal responsibility was grasped but slowly. It is enunciated partly in <a onClick="return mV(\'Deu\',24,16);">De 24:16</a> (compare <a onClick="return mV(\'Jer\',31,29,30);">Jer 31:29,30</a>), definitely in <a onClick="return mV(\'Eze\',14,\'12-20\');">Eze 14:12-20</a>; <a onClick="return mV(\'Eze\',18,\'1-\');">18</a>; <a onClick="return mV(\'Eze\',33,\'1-20\');">33:1-20</a>, and fairly consistently in the Psalms. But even Ezekiel still held that five-and-twenty could defile the whole nation (<a onClick="return mV(\'Eze\',8,16);">8:16</A>), and he had not the premises for resolving the problem—that temporal disasters need not mean the loss of salvation.<P>(2) But even when it was realized that a man lost salvation through his own fault, the converse did not follow. Salvation came, not by the man\'s mere merit, but because the man belonged to a nation peculiarly chosen by God. God had made a covenant with Israel and His fidelity insured salvation: the salvation comes from God because of His promise or (in other words) because of His name. Indeed, the great failing of the people was to trust too blindly to this promise, an attitude denounced continually by the prophets throughout (from, say, <span class="noTag">Amos 3:2 to Matthew 3:9</span>). And yet even the prophets admit a real truth in the attitude, for, despite Israel\'s sins, eventual salvation is certain. <a onClick="return mV(\'Eze\',20,\'1-\');">Ezekiel 20</a> states this baldly: there has been nothing good in Israel and there is nothing good in her at the prophet\'s own day, but, notwithstanding, God will give her restoration (compare <a onClick="return mV(\'Isa\',8,17,18);">Isa 8:17,18</a>; <a onClick="return mV(\'Jer\',32,\'6-15\');">Jer 32:6-15</a>, etc.).<P>3. Faith:<P>Hence, of the human conditions, whole-hearted trust in God is the most important. (Belief in God is, of course, never argued in the Bible.) Inconsistent with such trust are, for instance, seeking aid from other nations (<a onClick="return mV(\'Isa\',30,\'1-5\');">Isa 30:1-5</a>), putting reliance in human skill (<a onClick="return mV(\'2Ch\',16,12);">2Ch 16:12</a>), or forsaking Palestine through fear (<a onClick="return mV(\'Jer\',42,\'1-\');">Jer 42</a>). In <a onClick="return mV(\'Isa\',26,20);">Isa 26:20</a> entire passivity is demanded, and in <a onClick="return mV(\'2Ki\',13,19);">2Ki 13:19</a> lukewarmness in executing an apparently meaningless command is rebuked.<P>4. Moral Law:<P>(1) Next in importance is the attainment of a moral standard, expressed normally in the various codes of the Law. But fulfillment of the letter of the commandment was by no means all that was required. For instance, the Law permitted the selling of a debtor into slavery (<a onClick="return mV(\'Deu\',15,12);">De 15:12</a>), but the reckless use of the creditor\'s right is sharply condemned (<a onClick="return mV(\'Neh\',5,\'1-13\');">Ne 5:1-13</a>). The prophets are never weary of giving short formulas that will exclude such supralegalism and reduce conduct to a pure motive: "Hate the evil, and love the good, and establish justice in the gate" (<a onClick="return mV(\'Amo\',5,15);">Am 5:15</a>); "To do justly, and to love kindness, and to walk humbly with thy God" (<a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>). And the chief emphasis on the Law as written is found in the later books, especially <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a> (compare <a onClick="return mV(\'Psa\',147,20);">Ps 147:20</a>).<P>(2) Certain breaches of the Law had no pardon, but were visited with death at once, even despite repentance and confession (<a onClick="return mV(\'Jos\',7,\'1-\');">Jos 7</a>). But for the most part it is promised that repentance will remove the guilt of the sin if the sin be forsaken (<a onClick="return mV(\'Eze\',18,\'1-\');">Eze 18</a>) or, in the case of a sin that would not be repeated, if contrition be felt (<a onClick="return mV(\'2Sa\',12,\'1-\');">2Sa 12</a>). Suffering played a part in salvation by bringing knowledge of sin to the conscience, the exile being the most important example (<a onClick="return mV(\'Eze\',36,31);">Eze 36:31</a>). But almost always it is assumed that the possibility of keeping the Law is in man\'s own power, <a onClick="return mV(\'Deu\',30,\'11-14\');">De 30:11-14</a> stating this explicitly, while the Wisdom Books equate virtue with learning. Consequently, an immense advance was made when man felt the need of God\'s help to keep the Law, the need of the inscription of the Laws on the heart (<a onClick="return mV(\'Jer\',31,\'31-34\');">Jer 31:31-34</a>). So an outlook was opened to a future in which God would make the nation righteous (see references in 1, above).<P>5. Sacrifices:<P>(1) The acceptance of repentance as expiating past sins was an act of God\'s mercy. And so His mercy instituted other and additional means of expiation, most notably that of the sacrifices. But a theology of sacrifice is conspicuously absent from the whole Old Testament, for <a onClick="return mV(\'Lev\',17,11);">Le 17:11</a> is too incidental and too obscure to be any exception. The Christian (or very late Jewish) interpretations of the ritual laws lack all solidity of exegetical foundation, despite their one-time prevalence. Nor is the study of origins of much help for the meaning attached to the rites by the Jews in historic times. General ideas of offering, of self-denial, of propitiation of wrath, and of entering into communion with God assuredly existed. But in the advanced stages of the religion there is no evidence that sacrifices were thought to produce their effect because of any of these things, but solely because God had commanded the sacrifices.<P>(2) Most sins required a sacrifice as part of the act of repentance, although in case of injury done the neighbor, only after reparation had been made. It is not quite true that for conscious sins no sacrifices were appointed, for in <a onClick="return mV(\'Lev\',5,1);">Le 5:1</a>; <a onClick="return mV(\'Lev\',6,\'1-3\');">6:1-3</a>, sins are included that could not be committed through mere negligence. And so such rules as <a onClick="return mV(\'Num\',15,30,31);">Nu 15:30,31</a> must not be construed too rigorously.<P>(3) Sacrifices as means of salvation are taught chiefly by Ezekiel, while at the rebuilding of the temple (Haggai, Zechariah) and the depression that followed (Malachi), they were much in the foreground, but the pre-exilic prophets have little to say about their positive value (<a onClick="return mV(\'Jer\',7,22);">Jer 7:22</a> is the nadir). Indeed, in preexilic times the danger was the exaltation of sacrifice at the expense of morality, especially with the peace offering, which could be turned into a drunken revel (<a onClick="return mV(\'Amo\',5,\'21-24\');">Am 5:21-24</a>; <a onClick="return mV(\'Isa\',22,13);">Isa 22:13</a>; compare <a onClick="return mV(\'Pro\',7,14);">Pr 7:14</a>). Attempts were made to "strengthen" the sacrifices to Yahweh by the use of ethnic rites (<a onClick="return mV(\'Hsa\',4,14);">Ho 4:14</a>; <a onClick="return mV(\'Isa\',65,\'1-5\');">Isa 65:1-5</a>), even with the extreme of human sacrifice (<a onClick="return mV(\'Jer\',7,31);">Jer 7:31</a>; <a onClick="return mV(\'Eze\',20,26);">Eze 20:26</a>). But insistence on the strict centralization of worship and increasing emphasis laid on the sin and trespass offerings did away with the worst of the abuses. And many of the Psalms, especially <a onClick="return mV(\'Psa\',66,\'1-\');">Ps 66</a> and <a onClick="return mV(\'Psa\',118,\'1-\');">Ps 118</a>, give beautiful evidence of the devotion that could be nourished by the sacrificial rites.<P>6. Ritual Law:<P>Of the other means of salvation the ritual law (not always sharply distinguishable from the moral law) bulks rather large in the legislation, but is not prominent in the prophets. Requisite to salvation was the abstention from certain acts, articles of food, etc., such abstinence seeming to lie at the background of the term "holiness." But a ritual breach was often a matter of moral duty (burying the dead, etc.), and, for such breaches, ritual means of purification are provided and the matter dropped. Evidently such things lay rather on the circumference of the religion, even to Ezekiel, with his anxious zeal against the least defilement. The highest ritual point is touched by <a onClick="return mV(\'Zec\',14,20,21);">Zec 14:20,21</a>, where all of Jerusalem is so holy that not a pot would be unfit to use in the temple (compare <a onClick="return mV(\'Jer\',31,\'38-40\');">Jer 31:38-40</a>). Yet, even with this perfect holiness, sacrifices would still have a place as a means by which the holiness could be increased. Indeed, this more "positive" view of sacrifices was doubtless present from the first.<P>II. Intermediate Literature.<P>1. General:<P>(1) The great change, compared with the earlier period, is that the idea of God had become more transcendent. But this did not necessarily mean an increase in religious value, for there was a corresponding tendency to take God out of relation to the world by an intellectualizing process. This, when combined with the persistence of the older concept of salvation in this life only, resulted in an emptying of the religious instinct and in indifferentism. This tendency is well represented in Ecclesiastes, more acutely in Sirach, and in New Testament times it dominated the thought of the Sadducees. On the other hand the expansion of the idea of salvation to correspond with the higher conception of God broke through the limitations of this life and created the new literary form of apocalyptics, represented in the Old Testament especially by <a onClick="return mV(\'Zec\',9,\'1-\');">Zechariah 9-14</a>; <a onClick="return mV(\'Isa\',24,\'1-\');">Isaiah 24-27</a>, and above all by Daniel. And in the intermediate literature all shades of thought between the two extremes are represented. But too much emphasis can hardly be laid on the fact that this intermediate teaching is in many regards simply faithful to the Old Testament. Almost anything that can be found in the Old Testament—with the important exception of the note of joyousness of Deuteronomy, etc.—can be found again here.<P>(2) Of the conceptions of the highest good the lowest is the Epicureanism of Sirach. The highest is probably that of 2Esdras 7:91-98 Revised Version: "To behold the face of him whom in their lifetime they served" the last touch of materialism being eliminated. Indeed, real materialism is notably absent in the period, even Enoch 10:17-19 being less exuberant than the fancies of such early Christian writers as Papias. Individualism is generally taken for granted, but that the opposite opinion was by no means dormant, even at a late period, is shown by <a onClick="return mV(\'Mat\',3,9);">Mt 3:9</a>. The idea of a special privilege of Israel, however, of course pervades all the literature, Sibylline Oracles 5 and Jubilees being the most exclusive books and the Testament of the Twelve Patriarchs, the most broad-hearted. In place of national privilege, though, is sometimes found the still less edifying feature of party privilege (Ps Sol; Enoch 94-105), the most offensive case being the assertion of Enoch 90:6-9 that the (inactive) Israel will be saved by the exertions of the "little lamb" Pharisees, before whom every knee shall bow in the Messianic kingdom.<P>2. The Law:<P>(1) The conceptions of the moral demands for salvation at times reach a very high level, especially in the Testament of the Twelve Patriarchs (making every allowance for Christian interpolations). "The spirit of love worketh together with the law of God in long-suffering unto the salvation of men" (Test. Gad 4:7) is hardly unworthy of Paul, and even Jubilees can say, "Let each love his brother in mercy and justice, and let none wish the other evil" (Jub 36:8). But the great tendency is to view God\'s law merely as a series of written statutes, making no demands except those gained from a rigid construing of the letter. In <a onClick="return mV(\'Luk\',10,29);">Lu 10:29</a>, "Who is my neighbor?" is a real question—if he is not my neighbor I need not love him! So duties not literally commanded were settled by utilitarian motives, as outside the domain of religion, and the unhealthy phenomenon of works of supererogation made its appearance (<a onClick="return mV(\'Luk\',17,10);">Lu 17:10</a>). The writer of Wisdom can feel smugly assured of salvation, because idolatry had been abstained from (Wisd 15:4; contrast Paul\'s polemic in <a onClick="return mV(\'Rom\',2,\'1-\');">Ro 2</a>). And discussions about "greatest commandments" caused character in its relation to religion to be forgotten.<P>(2) As God\'s commands were viewed as statutes the distinction between the moral and the ritual was lost, and the ritual law attained enormous and familiar proportions. The beautiful story of Judith is designed chiefly to teach abstinence from ritually unclean food. And the most extreme case is in Jubilees 6:34-38—all of Israel\'s woes come from keeping the feasts by the actual moon instead of by a correct (theoretical) moon (!).<P>(3) Where self-complacency ceased and a strong moral sense was present, despair makes its appearance with extraordinary frequency. The period is the period of penitential prayers, with an undercurrent of doubt as to how far mercy can be expected (So of Three Children verses 3-22; Pr Man; Bar 3:1-8, etc.). "What profit is it unto us, if there be promised us an immortal time, whereas we have done the works that bring death?" (2Esdras 7:119 the Revised Version (British and American)). The vast majority of men are lost (2Esdras 9:16) and must be forgotten (2Esdras 8:55), and Ezra can trust for his own salvation only by a special revelation (<a onClick="return mV(\'Ezr\',7,77);">7:77</A> the Revised Version (British and American)). So, evidently, Paul\'s pre-Christian experience was no unique occurrence.<P>(4) Important for the New Testament background is the extreme lack of prominence of the sacrifices. They are never given a theological interpretation (except in Philo, where they cease to be sacrifices). Indeed, in Sirach 35 they are explicitly said to be devotions for the righteous only, apparently prized only as an inheritance from the past and "because of the commandment" (Sirach 35:5; yet compare <span class="noTag">38:11</span>). When the temple was destroyed and the sacrifices ceased, Judaism went on its way almost unaffected, showing that the sacrifices meant nothing essential to the people. And, even in earlier times, the Essenes rejected sacrifices altogether, without losing thereby their recognition as Jews.<P>III. The Teaching of Christ.<P>1. The Baptist:<P>The Baptist proclaimed authoritatively the near advent of the kingdom of God, preceded by a Messianic judgment that would bring fire for the wicked and the Holy Spirit for the righteous. Simple but incisive moral teaching and warning against trusting in national privileges, with baptism as an outward token of repentance, were to prepare men to face this judgment securely. But we have no data to determine how much farther (if any) the Baptist conceived his teaching to lead.<P>2. Kingdom of God:<P>It was in the full heat of this eschatological revival that the Baptist had fanned, that Christ began to teach, and He also began with the eschatological phrase, "The kingdom of God is at hand." Consequently, His teaching must have been taken at once in an eschatological sense, and it is rather futile to attempt to limit such implications to passages where modern eschatological phrases are used unambiguously. "The kingdom of God is at hand" had the inseparable connotation "Judgment is at hand," and in this context, "Repent ye" (<a onClick="return mV(\'Mar\',1,15);">Mr 1:15</a>) must mean "lest ye be judged." Hence, our Lord\'s teaching about salvation had primarily a future content: positively, admission into the kingdom of God, and negatively, deliverance from the preceding judgment. So the kingdom of God is the "highest good" of Christ\'s teaching but, with His usual reserve, He has little to say about its externals. Man\'s nature is to be perfectly adapted to his spiritual environment (see <a href="./study/isbe/search.html?string=RESURRECTION">RESURRECTION</a>), and man is to be with Christ (<a onClick="return mV(\'Luk\',22,30);">Lu 22:30</a>) and the patriarchs (<a onClick="return mV(\'Mat\',8,11);">Mt 8:11</a>). But otherwise—and again as usual—the current descriptions are used without comment, even when they rest on rather materialistic imagery (<a onClick="return mV(\'Luk\',22,16,30);">Lu 22:16,30</a>). Whatever the kingdom is, however, its meaning is most certainly not exhausted by a mere reformation of the present order of material things.<P>3. Present and Future:<P>But the fate of man at judgment depends on what man is before judgment, so that the practical problem is salvation from the conditions that will bring judgment; i.e. present and future salvation are inseparably connected, and any attempt to make rigid distinctions between the two results in logomachies. Occasionally even Christ speaks of the kingdom of God as present, in the sense that citizens of the future kingdom are living already on this earth (<a onClick="return mV(\'Mat\',11,11);">Mt 11:11</a>; <a onClick="return mV(\'Luk\',17,21);">Lu 17:21</a>(?); the meaning of the latter verse is very dubious). Such men are "saved" already (<a onClick="return mV(\'Luk\',19,9);">Lu 19:9</a>; <a onClick="return mV(\'Luk\',7,50);">7:50</a>(?)), i.e. such men were delivered from the bad moral condition that was so extended that Satan could be said to hold sway over the world (<a onClick="return mV(\'Luk\',10,18);">Lu 10:18</a>; <a onClick="return mV(\'Luk\',11,21);">11:21</a>).<P>4. Individualism:<P>That the individual was the unit in this deliverance needs no emphasis: Still, the divine privilege of the Jews was a reality and Christ\'s normal work was limited to them (<a onClick="return mV(\'Mat\',10,5);">Mt 10:5</a>; <a onClick="return mV(\'Mat\',15,26);">15:26</a>, etc.). He admitted even that the position of the Jewish religious leaders rested on a real basis (<a onClick="return mV(\'Mat\',23,3);">Mt 23:3</a>). But the "good tidings" were so framed that their extension to all men would have been inevitable, even had there not been an explicit command of Christ in this regard. On the other hand, while the message involved in every case strict individual choice, yet the individual who accepted it entered into social relations with the others who had so chosen. So salvation involved admission to a community of service (<a onClick="return mV(\'Mar\',9,35);">Mr 9:35</a>, etc.). And in the latter part of Christ\'s ministry, He withdrew from the bulk of His disciples to devote Himself to the training of an inner circle of Twelve, an act explicable only on the assumption that these were to be the leaders of the others after He was taken away. Such passages as <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>; <a onClick="return mV(\'Mat\',18,17);">18:17</a> merely corroborate this.<P>5. Moral Progress:<P>Of the conditions for the individual, the primary (belief in God being taken for granted) was a correct moral ideal. Exclusion from salvation came from the Pharisaic casuistry which had invented limits to righteousness. <a onClick="return mV(\'Exd\',20,13);">Ex 20:13</a> had never contemplated permitting angry thoughts if actual murder was avoided, and so on. In contrast is set the idea of character, of the single eye (<a onClick="return mV(\'Mat\',6,22);">Mt 6:22</a>), of the pure heart (<a onClick="return mV(\'Mat\',5,8);">Mt 5:8</a>). Only so can the spiritual house be built on a rock foundation. But the mere ideal is not enough; persistent effort toward it and a certain amount of progress are demanded imperatively. Only those who have learned to forgive can ask for forgiveness (<a onClick="return mV(\'Mat\',6,12);">Mt 6:12</a>; <a onClick="return mV(\'Mat\',18,35);">18:35</a>). They who omit natural works of mercy have no share in the kingdom (<a onClick="return mV(\'Mat\',25,\'31-46\');">Mt 25:31-46</a>), for even idle words will be taken into account (<a onClick="return mV(\'Mat\',12,36);">Mt 12:36</a>), and the most precious possession that interferes with moral progress is to be sacrificed ruthlessly (<a onClick="return mV(\'Mat\',18,8,9);">Mt 18:8,9</a>, etc.). Men are known by their fruits (<a onClick="return mV(\'Mat\',7,20);">Mt 7:20</a>); it is he that doeth the will of the Father that shall enter into the kingdom (<a onClick="return mV(\'Mat\',7,21);">Mt 7:21</a>), and the final ideal—which is likewise the goal—is becoming a son of the Father in moral likeness (<a onClick="return mV(\'Mat\',5,45);">Mt 5:45</a>). That this progress is due to God\'s aid is so intimately a part of Christ\'s teaching on the entire dependence of the soul on God that it receives little explicit mention, but Christ refers even His own miracles to the Father\'s power (<a onClick="return mV(\'Luk\',11,20);">Lu 11:20</a>).<P>6. Forgiveness:<P>Moral effort, through God\'s aid, is an indispensable condition for salvation. But complete success in the moral struggle is not at all a condition, in the sense that moral perfection is required. For Christ\'s disciples, to whom the kingdom is promised (<a onClick="return mV(\'Luk\',12,32);">Lu 12:32</a>), the palsied man who receives remission of sins (<a onClick="return mV(\'Mar\',2,5);">Mr 2:5</a>), Zaccheus who is said to have received salvation (<a onClick="return mV(\'Luk\',19,9);">Lu 19:9</a>), were far from being models of sinlessness. The element in the character that Christ teaches as making up for the lack of moral perfection is becoming "as a little child" (compare <a onClick="return mV(\'Mar\',10,15);">Mr 10:15</a>). Now the point here is not credulousness (for belief is not under discussion), nor is it meekness (for children are notoriously not meek). And it most certainly is not the pure passivity of the newly born infant, for it is gratuitous to assume that only such infants were meant even in <a onClick="return mV(\'Luk\',18,15);">Lu 18:15</a>, while in <a onClick="return mV(\'Mat\',18,2);">Mt 18:2</a> (where the child comes in answer to a call) this interpretation is excluded. Now, in the wider teaching of Christ the meaning is made clear enough. Salvation is for the poor in spirit, for those who hunger and thirst after righteousness, for the prodigal knowing his wretchedness. It is for the penitent publican, while the self-satisfied Pharisee is rejected. A sense of need and a desire that God will give are the characteristics. A child does not argue that it has earned its father\'s benefits but looks to him in a feeling of dependence, with a readiness to do his bidding. So it is the soul that desires all of righteousness, strives toward it, knows that it falls short, and trusts in its Father for the rest, that is the savable soul.<P>7. Person of Christ:<P>Christ speaks of the pardon of the publican (<a onClick="return mV(\'Luk\',18,9);">Lu 18:9</a>) and of the prodigal welcomed by the Father (<a onClick="return mV(\'Luk\',15,20);">Lu 15:20</a>), both without intermediary. And it is perhaps not necessary to assume that all of those finding the strait gate (<a onClick="return mV(\'Mat\',7,14);">Mt 7:14</a>) were explicitly among Christ\'s disciples. But would Christ have admitted that anyone who had come to know Him and refused to obey Him would have been saved? To ask this question is to answer it in the negative (<a onClick="return mV(\'Mar\',9,40);">Mr 9:40</a> is irrelevant). Real knowledge of the Father is possible only through the unique knowledge of the Son (<a onClick="return mV(\'Luk\',10,21,22);">Lu 10:21,22</a>), and lack of faith in the Son forfeits all blessings (<a onClick="return mV(\'Mar\',6,5,6);">Mr 6:5,6</a>; <a onClick="return mV(\'Mar\',9,23);">9:23</a>). Faith in Him brings instant forgiveness of sins (<a onClick="return mV(\'Mar\',2,5);">Mr 2:5</a>), and love directed to Him is an indisputable sign that forgiveness has taken place (<a onClick="return mV(\'Luk\',7,47);">Lu 7:47</a>). But Christ thought of Himself as Messiah and, if the term "Messiah" is not to be emptied of its meaning, this made Him judge of the world (such verses as <a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a> are hardly needed for direct evidence). And, since for Christ\'s consciousness an earthly judgeship is unthinkable, a transcendental judgeship is the sole alternative, corroborated by the use of the title Son of Man. But passage from simple humanity to the transcendental glory of the Son-of-Man Messiah involved a change hardly expressible except by death and resurrection. And the expectation of death was in Christ\'s mind from the first, as is seen by <a onClick="return mV(\'Mar\',2,18,19);">Mr 2:18,19</a> (even without <a onClick="return mV(\'Mar\',2,20);">2:20</a>). That He could have viewed His death as void of significance for human salvation is simply inconceivable, and the ascription of <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a> to Pauline influence is in defiance of the facts. Nor is it credible that Christ conceived that in the interval between His death and His Parousia He would be out of relation to His own. To Him the unseen world was in the closest relation to the visible world, and His passage into glory would strengthen, not weaken, His power. So there is a complete justification of <a onClick="return mV(\'Mar\',14,\'22-25\');">Mr 14:22-25</a>: to Christ His death had a significance that could be paralleled only by the death of the Covenant victim in <a onClick="return mV(\'Exd\',24,\'6-8\');">Ex 24:6-8</a>, for by it an entirely new relation was established between God and man.<P>8. Notes:<P>(1) Salvation from physical evil was a very real part, however subordinate, of Christ\'s teaching (<a onClick="return mV(\'Mar\',1,34);">Mr 1:34</a>, etc.).<P>(2) Ascetic practices as a necessary element in salvation can hardly claim Christ\'s authority.<P>It is too often forgotten that the Twelve were not Christ\'s only disciples. Certainly not all of the hundred and twenty of <a onClick="return mV(\'Act\',1,15);">Ac 1:15</a> (compare <a onClick="return mV(\'Act\',1,21);">1:21</a>), nor of the five hundred of <a onClick="return mV(\'1Cr\',15,6);">1Co 15:6</a>, were converted after the Passion. And they all certainly could not have left their homes to travel with Christ. So the demands made in the special case of the Twelve (still less in such an extremely special case as <a onClick="return mV(\'Mar\',10,21);">Mr 10:21</a>) in no way represent Christ\'s normal practice, whatever readiness for self-sacrifice may have been asked of all. So the representations of Christ as ruthlessly exacting all from everyone are quite unwarranted by the facts. And it is well to remember that it is <a onClick="return mV(\'Mat\',11,19);">Mt 11:19</a> that contains the term of reproach that His adversaries gave Him.<P>IV. Paul.<P>Instead of laying primal stress on Paul\'s peculiar contributions to soteriology, it will be preferable to start from such Pauline passages as simply continue the explicit teaching of Christ. For it is largely due to the common reversal of this method that the present acute "Jesus-Paulus" controversy exists.<P>1. General:<P>That Paul expected the near advent of the kingdom of God with a judgment preceding, and that salvation meant to him primarily deliverance from this judgment, need not be argued. And, accordingly, emphasis is thrown sometimes on the future deliverance and sometimes on the present conditions for the deliverance (contrast <a onClick="return mV(\'Rom\',5,9);">Ro 5:9</a> and <a onClick="return mV(\'Rom\',8,24);">8:24</A>), but the practical problem is the latter. More explicitly than in Christ\'s recorded teaching the nature and the blessings of the kingdom are described (see <a href="./study/isbe/search.html?string=KINGDOM+OF+GOD">KINGDOM OF GOD</a>), but the additional matter is without particular religious import. A certain privilege of the Jews appears (<a onClick="return mV(\'Rom\',3,\'1-8\');">Ro 3:1-8</a>; <a onClick="return mV(\'Rom\',9,11);">9-11</a>), but the practical content of the privilege seems to be eschatological only (<a onClick="return mV(\'Rom\',11,26);">Ro 11:26</a>). Individual conversion is of course taken for granted, but the life after that becomes highly corporate.<P>See <a href="./study/isbe/search.html?string=CHURCH">CHURCH</a>.<P>2. Moral Progress:<P>(1) The moral ideal is distinctly that of character. Paul, indeed, is frequently obliged to give directions as to details, but the detailed directions are referred constantly to the underlying principle, <a onClick="return mV(\'Rom\',14,\'1-\');">Ro 14</a> or <a onClick="return mV(\'1Cr\',8,\'1-\');">1Co 8</a> being excellent examples of this, while "love is the fulfillment of the law" (<a onClick="return mV(\'Rom\',13,10);">Ro 13:10</a>) is the summary.<P>(2) Persistent moral effort is indispensable, and the new life absolutely must bring forth fruit to God (<a onClick="return mV(\'Rom\',6,4);">Ro 6:4</a>; <a onClick="return mV(\'Rom\',13,12);">13:12</a>; <a onClick="return mV(\'Gal\',5,24);">Ga 5:24</a>; <a onClick="return mV(\'Col\',3,5);">Col 3:5</a>; <a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>; <a onClick="return mV(\'Eph\',4,17,\'22-32\');">4:17,22-32</a>; <a onClick="return mV(\'Tts\',2,\'11-14\');">Tit 2:11-14</a>). Only by good conduct can one please God (<a onClick="return mV(\'1Th\',4,1);">1Th 4:1</a>), and the works of even Christians are to be subjected to a searching test (<a onClick="return mV(\'1Cr\',3,13);">1Co 3:13</a>; <a onClick="return mV(\'1Cr\',4,5);">4:5</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>) in a judgment not to be faced without the most earnest striving (<a onClick="return mV(\'1Cr\',10,12);">1Co 10:12</a>; <a onClick="return mV(\'Phl\',2,12);">Php 2:12</a>), not even by Paul himself (<a onClick="return mV(\'1Cr\',9,27);">1Co 9:27</a>; <a onClick="return mV(\'Phl\',3,\'12-14\');">Php 3:12-14</a>). And the possibility of condemnation because of a lack of moral attainment must not be permitted to leave the mind (<a onClick="return mV(\'1Cr\',3,17);">1Co 3:17</a>; <a onClick="return mV(\'Gal\',5,21);">Ga 5:21</a>; compare <a onClick="return mV(\'Rom\',8,12,13);">Ro 8:12,13</a>; <a onClick="return mV(\'Rom\',11,20);">11:20</a>; <a onClick="return mV(\'1Cr\',10,12);">1Co 10:12</a>; <a onClick="return mV(\'Gal\',6,\'7-9\');">Ga 6:7-9</a>). Consequently, growth in actual righteousness is as vital in Paul\'s soteriology as it is in that teaching of Christ: Christians have "put off the old man with his doings" (<a onClick="return mV(\'Col\',3,9);">Col 3:9</a>).<P>3. The Spirit:<P>That this growth is God\'s work is, however, a point where Paul has expanded Christ\'s quiet assumption rather elaborately. In particular, what Christ had made the source of His own supernatural power—the Holy Spirit—is specified as the source of the power of the Christian\'s ordinary life, as well as of the more special endowments (see <a href="./study/isbe/search.html?string=SPIRITUAL+GIFTS">SPIRITUAL GIFTS</a>). In the Spirit the Christian has received the blessing promised to Abraham (<a onClick="return mV(\'Gal\',3,14);">Ga 3:14</a>); by it the deeds of the body can be put to death and all virtues flow into the soul (<a onClick="return mV(\'Gal\',5,\'16-26\');">Ga 5:16-26</a>), if a man walks according to it (<a onClick="return mV(\'1Cr\',6,19,20);">1Co 6:19,20</a>; <a onClick="return mV(\'1Th\',4,8);">1Th 4:8</a>). The palmary passage is <a onClick="return mV(\'Rom\',7,\'1-\');">Romans 7</a>-<a onClick="return mV(\'Rom\',8,\'1-\');">8</a>. In <a onClick="return mV(\'Rom\',7,\'1-\');">Romans 7</a> Paul looks back with a shudder on his pre-Christian helplessness (it is naturally the extreme of exegetical perversity to argue that he dreaded not the sin itself but only God\'s penalty on sin). But the Spirit gives strength to put to death the deeds of the body (<a onClick="return mV(\'Rom\',8,13);">8:13</a>), to disregard the things of the flesh (<a onClick="return mV(\'Rom\',8,5);">8:5</A>), and to fulfill the ordinance of the Law (<a onClick="return mV(\'Rom\',8,4);">8:4</a>). Such moral power is the test of Christianity: as many as are led by the Spirit of God, these are the sons of God (<a onClick="return mV(\'Rom\',8,14);">8:14</A>).<P>4. Mystical Union:<P>This doctrine of the Spirit is simply that what Christ did on earth would be carried on with increased intensity after the Passion. That this work could be thought of out of relation to Christ, or that Christ Himself could have so thought of it (see above, III, 7) is incredible. So the exalted Christ appears as the source of moral and spiritual power (Paul speaks even more of Christ\'s resurrection than of the Passion), the two sources (Christ and the Spirit) being very closely combined in <a onClick="return mV(\'2Cr\',3,17);">2Co 3:17</a>; <a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>; <a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>. Our old man has been crucified, so putting an end to the bondage of sin, and we can prevent sin from reigning in our mortal bodies, for our burial into Christ\'s death was to enable us to walk in newness of life (<a onClick="return mV(\'Rom\',6,\'2-14\');">Ro 6:2-14</a>). The resurrection is a source of power, and through Christ\'s strength all things can be done (<a onClick="return mV(\'Phl\',4,13,20);">Php 4:13,20</a>). Christ is the real center of the believer\'s personality (<a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>); the man has become a new creature (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>; compare <a onClick="return mV(\'Col\',2,20);">Col 2:20</a>; <a onClick="return mV(\'Col\',3,3);">3:3</a>); we were joined to another that we might bring forth fruit to God (<a onClick="return mV(\'Rom\',7,4);">Ro 7:4</a>). And by contact with the glory of the Lord we are transformed into the same image (<a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>), the end being conformation to the image of the Son (<a onClick="return mV(\'Rom\',8,30);">Ro 8:30</a>).<P>5. Forgiveness:<P>(1) This growth in actual holiness, then, is fundamental with Paul: "If any man hath not the Spirit of Christ, he is none of his" (<a onClick="return mV(\'Rom\',8,9);">Ro 8:9</a>). And the acquisition of strength through union with Christ is vitally connected with the remission of sins. In <a onClick="return mV(\'Rom\',7,\'1-6\');">Ro 7:1-6</a> (compare <a onClick="return mV(\'Col\',2,11,12);">Col 2:11,12</a>), the mystical union with Christ makes His death ours (compare <a onClick="return mV(\'Col\',3,3);">Col 3:3</a>) and so removes us from the Law (compare <a onClick="return mV(\'Rom\',10,4);">Ro 10:4</a>; <a onClick="return mV(\'1Cr\',15,56);">1Co 15:56</a>), which has no relation to the dead. And by the life-giving power of this union the strength of sin is broken (<a onClick="return mV(\'Rom\',6,6);">Ro 6:6</a>).<P>(2) The condition in man that makes forgiveness possible Paul calls "faith"—a very complicated term. Its chief use, however, is in opposition to "works" (most clearly in <a onClick="return mV(\'Rom\',9,\'30-\');">Ro 9:30</A>-<a onClick="return mV(\'Rom\',10,13);">10:13</a>). The Jews\' "pursuit after righteousness"—the attempt to wring salvation from God as wages earned—was vain (<a onClick="return mV(\'Rom\',10,13);">Ro 10:13</a>), and in contrast is the appeal to God, the conscious relinquishment of all claim (<a onClick="return mV(\'Rom\',4,5);">Ro 4:5</a>). The soul looks trustingly for salvation to its Father, precisely the attitude of the "children" in the teaching of Christ. But no more than in the teaching of Christ is faith a purely passive virtue, for man must be "obedient" to it (<a onClick="return mV(\'Rom\',1,5);">Ro 1:5</a>; <a onClick="return mV(\'Rom\',10,16);">10:16</a>; <a onClick="return mV(\'1Th\',2,13);">1Th 2:13</a>). And for the necessary presence of love in faith compare <a onClick="return mV(\'1Cr\',13,2);">1Co 13:2</a>; <a onClick="return mV(\'Gal\',5,6);">Ga 5:6</a>; <a onClick="return mV(\'Eph\',3,17);">Eph 3:17</a>.<P>6. Atonement:<P>Because of faith—specifically, faith in Christ (except <a onClick="return mV(\'Rom\',4,\'1-\');">Ro 4</a>; <a onClick="return mV(\'Gal\',3,6);">Ga 3:6</a>)—God does not visit the penalties of sins on believers, but treats them as if they were righteous (<a onClick="return mV(\'Rom\',5,1);">Ro 5:1</a>, etc.). But this is not because of a quality in the believer or in the faith, but because of an act that preceded any act of Christian faith, the death of Christ (not the cross, specifically, for Paul does not argue from the cross in all of Roman). Through this death God\'s mercy could be extended safely, while before this the exercise of that mercy had proved disastrous (<a onClick="return mV(\'Rom\',3,25,26);">Ro 3:25,26</a>). And this death was a sacrifice (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>, etc.). And it is certain that Paul conceived of this sacrifice as existing quite independently of its effect on any human being. But he has given us no data for a really complete sacrificial doctrine, a statement sufficiently proved by the hopeless variance of the interpretations that have been propounded. And that Paul ever constructed a theory of the operation of sacrifices must be doubted. There is none in the contemporary Jewish literature, there is none in the Old Testament, and there is none in the rest of the New Testament, not even in Hebrews. Apparently the rites were so familiar that sacrificial terminology was ready to hand and was used without particular reflection and without attempting to give it precise theological content. This is borne out by the ease with which in <a onClick="return mV(\'Rom\',3,24,25);">Ro 3:24,25</a> Paul passes from a ransom (redemption) illustration to a (quite discordant) propitation illustration. For further discussion see <a href="./study/isbe/search.html?string=ATONEMENT">ATONEMENT</a>; <a href="./study/isbe/search.html?string=JUSTIFICATION">JUSTIFICATION</a>. Here it is enough make a juridical theory constructed from Pauline implications and illustrations central in Christianity is to do exactly what Paul did not do.<P>7. Summary:<P>Summing up, there is a double line of thought in Paul: the remission of penalties through the atoning death of Christ and the destruction of the power of sin through strength flowing from Christ, the human element in both cases being faith. The question of the order of the steps is futile, for "to have faith," "to be in Christ," and "to have the Spirit" are convertible terms, i.e. in doctrinal phraseology, the beginnings of sanctification are simultaneous with justification. Attempts to unify the two lines of thought into a single theory cannot claim purely Biblical support. The "ethical" theory, which in its best form makes God\'s pardon depend on the fact that the sinner will be made holy (at least in the next world), introduces the fewest extraneous elements, but it says something that Paul does not say. On the other hand one may feel that considering Paul as a whole—to say nothing of the rest of the New Testament—the pure justification doctrine has bulked a little too large in our dogmatics. God\'s pardon for sin is an immensely important matter, but still more important is the new power of holiness.<P>8. Notes:<P>(1) Baptism presents another obstacle to a strict unifying of Pauline theology. A very much stronger sacramentarianism is admitted in Paul today than would have been accepted a generation ago, and such passages as <a onClick="return mV(\'Rom\',6,\'1-7\');">Ro 6:1-7</a>; <a onClick="return mV(\'Gal\',3,27);">Ga 3:27</a>; <a onClick="return mV(\'Col\',2,12);">Col 2:12</a> make it certain that he regarded baptism as conferring very real spiritual powers. But that he made a mechanical distinction between the blessings given then and those given at some other time must be doubted.<P>(2) Salvation from the flesh (<a onClick="return mV(\'Rom\',7,24);">Ro 7:24</a>) involves no metaphysical dualism, as "flesh" is the whole of the lower nature from which the power to holiness saves a man (<a onClick="return mV(\'Rom\',8,13);">Ro 8:13</a>). Indeed, the body itself is an object of salvation (<a onClick="return mV(\'Rom\',8,11);">Ro 8:11</a>; and see <a href="./study/isbe/search.html?string=RESURRECTION">RESURRECTION</a>).<P>(3) Quite in the background lies the idea of salvation from physical evil (<a onClick="return mV(\'2Cr\',1,10);">2Co 1:10</a>, etc.). Such evils are real evils (<a onClick="return mV(\'1Cr\',11,30);">1Co 11:30</a>), but in God\'s hands they may become pure blessings (<a onClick="return mV(\'Rom\',5,3);">Ro 5:3</a>; <a onClick="return mV(\'2Cr\',12,7);">2Co 12:7</a>).<P>(4) Salvation from sin after conversion is due to God\'s judging the man in terms of the acquired supernatural nature (<a onClick="return mV(\'Rom\',8,14);">Ro 8:14</a>, etc.). Yet certain sins may destroy the union with Christ altogether (<a onClick="return mV(\'1Cr\',3,17);">1Co 3:17</a>, etc.), while others bring God\'s chastening judgment (<a onClick="return mV(\'1Cr\',11,\'30-32\');">1Co 11:30-32</a>). Or proper chastisement may be inflicted by Paul himself (<a onClick="return mV(\'1Cr\',5,\'1-5\');">1Co 5:1-5</a>; <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>) or by the congregation (<a onClick="return mV(\'Gal\',6,1);">Ga 6:1</a>; <a onClick="return mV(\'2Th\',3,\'10-15\');">2Th 3:10-15</a>; <a onClick="return mV(\'2Cr\',2,6);">2Co 2:6</a>).<P>V. Rest of New Testament: Summary.<P>1. John:<P>(1) John had the task of presenting Christ to Gentiles, who were as unfamiliar with the technical meaning of such phrases as "kingdom of God" or "Son of Man" as is the world today, and to Gentiles who had instead a series of concepts unknown in Palestine. So a "translation of spiritual values" became necessary if the gospel were to make an immediate appeal, a translation accomplished so successfully that the Fourth Gospel has always been the most popular. The Synoptists, especially the extremely literal Mark, imperatively demand a historical commentary, while John has successfully avoided this necessity.<P>(2) The "kingdom of God," as a phrase (<a onClick="return mV(\'Jhn\',3,3,5);">3:3,5</A>; compare <a onClick="return mV(\'Jhn\',18,36);">18:36</a>), is replaced by "eternal life." This life is given in this world to the one who accepts Christ\'s teaching (<a onClick="return mV(\'Jhn\',5,24);">5:24</a>; <a onClick="return mV(\'Jhn\',6,47);">6:47</A>), but its full realization will be in the "many mansions" of the Father\'s house (<a onClick="return mV(\'Jhn\',14,2);">14:2</a>), where the believer will be with Christ (<a onClick="return mV(\'Jhn\',17,24);">17:24</a>). A judgment of all men will precede the establishment of this glorified state (<a onClick="return mV(\'Jhn\',5,28,29);">5:28,29</a>), but the believer may face the judgment with equanimity (<a onClick="return mV(\'Jhn\',5,24);">5:24</A>). So the believer is delivered from a state of things so bad as expressible as a world under Satan\'s rule (<a onClick="return mV(\'Jhn\',12,31);">12:31</A>; <a onClick="return mV(\'Jhn\',14,30);">14:30</A>; <a onClick="return mV(\'Jhn\',16,11);">16:11</A>), a world in darkness (<a onClick="return mV(\'Jhn\',3,19);">3:19</A>), in ignorance of God (<a onClick="return mV(\'Jhn\',17,25);">17:25</a>), and in sin (<a onClick="return mV(\'Jhn\',8,21);">8:21</a>), all expressible in the one word "death" (<a onClick="return mV(\'Jhn\',5,24);">5:24</A>).<P>(3) The Jews had real privilege in the reception of Christ\'s message (<a onClick="return mV(\'Jhn\',1,11);">1:11</a>; <a onClick="return mV(\'Jhn\',4,22);">4:22</a>, etc.), but the extension of the good tidings to all men was inevitable (<a onClick="return mV(\'Jhn\',12,23,32);">12:23,32</a>, etc.). Belief in Christ is wholly a personal matter, but the believers enter a community of service (<a onClick="return mV(\'Jhn\',13,14);">13:14</a>), with the unity of the Father and Son as their ideal (<a onClick="return mV(\'Jhn\',17,21);">17:21</A>).<P>(4) The nature of the moral ideal, reduced to the single word "love" (<a onClick="return mV(\'Jhn\',13,34);">13:34</A>; <a onClick="return mV(\'Jhn\',15,12);">15:12</A>), is assumed as known and identified with "Christ\'s words" (<a onClick="return mV(\'Jhn\',5,24);">5:24</A>; <a onClick="return mV(\'Jhn\',6,63);">6:63</A>, etc.), and the necessity of progress toward it as sharply pointed as in the Synoptists. The sinner is the servant of sin (<a onClick="return mV(\'Jhn\',8,34);">8:34</A>), a total change of character is needed (<a onClick="return mV(\'Jhn\',3,6);">3:6</A>), and the blessing is only on him who does Christ\'s commandments (<a onClick="return mV(\'Jhn\',13,17);">13:17</A>). This "doing" is the proof of love toward Christ (<a onClick="return mV(\'Jhn\',14,15,21);">14:15,21</a>); only by bearing fruit and more fruit can discipleship be maintained (<a onClick="return mV(\'Jhn\',15,\'1-6\');">15:1-6</a>; compare <a onClick="return mV(\'Jhn\',14,24);">14:24</A>), and, indeed, by bearing fruit men actually become Christ\'s disciples (<a onClick="return mV(\'Jhn\',15,8);">15:8</a>, Gr). The knowledge of Christ and of God that is eternal life (<a onClick="return mV(\'Jhn\',17,13);">17:3</a>) comes only through moral effort (<a onClick="return mV(\'Jhn\',7,17);">7:17</a>). In John the contrasts are colored so vividly that it would almost appear as if perfection were demanded. But he does not present even the apostles as models of sanctity (<a onClick="return mV(\'Jhn\',13,38);">13:38</a>; <a onClick="return mV(\'Jhn\',16,32);">16:32</a>), and self-righteousness is condemned without compromise; the crowning sin is to say, "We see" (<a onClick="return mV(\'Jhn\',9,41);">9:41</a>). It is the Son who frees from sin (<a onClick="return mV(\'Jhn\',8,36);">8:36</a>), delivers from darkness (<a onClick="return mV(\'Jhn\',8,12);">8:12</A>; <a onClick="return mV(\'Jhn\',12,46);">12:46</a>), and gives eternal life (<a onClick="return mV(\'Jhn\',11,25,26);">11:25,26</a>; compare <a onClick="return mV(\'Jhn\',3,16);">3:16</A>; <a onClick="return mV(\'Jhn\',5,24);">5:24</a>; <a onClick="return mV(\'Jhn\',6,47);">6:47</A>). This emphasis on the divine side of the process is probably the reason for the omission of the terms "repent," "repentance," from the Gospel in favor of "faith" (<a onClick="return mV(\'Jhn\',6,29);">6:29</a>, especially), but this "faith" involves in turn human effort, for, without "abiding," faith is useless (<a onClick="return mV(\'Jhn\',8,30,31);">8:30,31</a>).<P>(5) An advance on the Synoptists is found in the number of times Christ speaks of His death (<a onClick="return mV(\'Jhn\',3,14,15);">3:14,15</a>; <a onClick="return mV(\'Jhn\',10,11,15);">10:11,15</a>; <a onClick="return mV(\'Jhn\',12,24,32);">12:24,32</a>; <a onClick="return mV(\'Jhn\',17,19);">17:19</a>) and in the greater emphasis laid on it, but no more than in the Synoptists is there any explanation of how the Atonement became effectual. A real advance consists in the prospect of Christ\'s work after His death, when, through the Paraclete (<a onClick="return mV(\'Jhn\',7,38,39);">7:38,39</a>; <a onClick="return mV(\'Jhn\',14,16);">14:16</a>ff), a hitherto unknown spiritual power would become available for the world. And spiritual power is due not only to a union of will with Christ but to mystical union with Him (<a onClick="return mV(\'Jhn\',15,\'1-9\');">15:1-9</a>). See above, III,7,for the relation of these thoughts to the synoptic teaching.<P>2. Hebrews:<P>(1) The emphasis of Hebrews is of course on the sacrificial work of Christ, but the Epistle makes practically no contribution to theology of sacrifice. The argument is this: The Old Testament sacrifices certainly had an efficacy; Christ\'s sacrifice fulfilled their types perfectly, therefore it had a perfect efficacy (<a onClick="return mV(\'Hbr\',9,13,14);">Heb 9:13,14</a>). This must have been a tremendously potent argument for He\'s own purpose, but it is of very little help to the modern theologian. (2) More than in Paul is emphasized the human training of Christ for His high-priestly work. Since He laid hold of the seed of Abraham (<a onClick="return mV(\'Hbr\',2,16);">Heb 2:16</a>), He learned by experience all that man had to suffer (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>; <a onClick="return mV(\'Hbr\',4,15);">4:15</a>; <a onClick="return mV(\'Hbr\',5,8);">5:8</a>, etc.). In He the essence of the sacrifice lies not in the death but in what we call the ascension—the presentation of the blood in the heavenly tabernacle (<a onClick="return mV(\'Hbr\',9,\'11-14\');">Heb 9:11-14</a>; see the commentaries). That the death was specifically on the cross (<a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a> only) belonged to the stage of training and had no special significance in the sacrificial scheme. Christ\'s intercession for us in heaven receives more emphasis than in the rest of the New Testament (<a onClick="return mV(\'Hbr\',7,25);">Heb 7:25</a>).<P>3. Peter:<P>The one other distinct contribution to New Testament soteriology is made in 1 Peter\'s evaluation of the vicarious suffering of the "Servant" of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>. What Christ did through His sufferings we may do in some degree through our sufferings; as His pains helped not only living mankind, but even departed sinners, so we may face persecution more happily with the thought that our pains are benefiting other men (<a onClick="return mV(\'1Pe\',3,\'16-20\');">1Pe 3:16-20</a>). It is hardly possible that Peter thought of this comparison as conveying an exhaustive description of the Atonement (compare <a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>), but that the comparison should be made at all is significant.<P>4. Summary:<P>(1) Salvation is both a present and a future matter for us. The full realization of all that God has in store will not be ours until the end of human history (if, indeed, there will not be opened infinite possibilities of eternal growth), but the enjoyment of these blessings depends on conditions fulfilled in us and by us now. But a foretaste of the blessings of forgiveness of sins and growth in holiness is given on this earth. The pardon depends on the fact of God\'s mercy through the death of Christ—a fact for religious experience but probably incapable of expression as a complete philosophical dogma. But strength comes from God through the glorified Christ (or through the Spirit), this vital union with God being a Christian fundamental. These two lines are in large degree independent, and the selection of the proportions profitable to a given soul is the task of the pastor.<P>(2) That human effort is an essential in salvation is not to be denied in the face of all the New Testament evidence, especially Paul taken as a whole. And yet no one with the faintest conception of what religion means would think of coming before God to claim merit. Here the purely intellectual discussions of the subiect and its psychological course in the soul run in different channels, and "anti-synergistic" arguments are really based on attempts to petrify psychology experience into terms of pure dogma.<P>(3) Still more true is this of attempts to describe mathematically the steps in salvation—the ordo salutis of the older dogmatics—for this differs with different souls. In particular, New Testament data are lacking for the development of the individual born of Christian parents in a Christian country.<P>(4) Further, the social side of salvation is an essentially Christian doctrine and cannot be detached from the corporate life of the Christian church. Salvation from temporal evils is equally, if secondarily, Christian. Nationalism in salvation is at present much in the background. But it is as true today as it was in ancient Israel that the sins of a nation tend to harm the souls of even those who have not participated actively in those sins.<P>LITERATURE.<P>The literature of salvation is virtually the literature of theology (see under separate articles, <a href="./study/isbe/search.html?string=ATONEMENT">ATONEMENT</a>; <a href="./study/isbe/search.html?string=JUSTIFICATION">JUSTIFICATION</a>; <a href="./study/isbe/search.html?string=SANCTIFICATION">SANCTIFICATION</A>; <a href="./study/isbe/search.html?string=PERSON+OF+CHRIST">PERSON OF CHRIST</a>; <a href="./study/isbe/search.html?string=JOHANNINE+THEOLOGY">JOHANNINE THEOLOGY</a>; <a href="./study/isbe/search.html?string=PAULINE+THEOLOGY">PAULINE THEOLOGY</a>, etc.), but a few recent works may be mentioned. Indispensable are the works of Stevens, The Christian Doctrine of Salvation and The Pauline Theology. Garvie\'s Romans in the "New Century" series should be used as a supplement to any other commentary on Romans. The juridical theory has as its best defense in English Denney\'s The Death of Christ. The ethical theory is best presented in the works of DuBose, The Gospel in the Gospels, The Gospel according to Paul, and High-Priesthood and Sacrifice (Sanday\'s The Expositor reviews of the two former, reprinted in The Life of Christ in Recent Research, should be read in any case).``48';

isbe[7609]='Samaias`sa-ma\'-yas (Samaias):<P>(1) One of the "captains over thousands" prominent at the Passover of Josiah (1Esdras 1:9) = "Shemaiah" in <a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>.<P>(2) One of the heads of families of the sons of Adonikam who returned with Ezra (1Esdras 8:39) = "Shemaiah" in <a onClick="return mV(\'Ezr\',8,13);">Ezr 8:13</a>.<P>(3) One of the "men of understanding" whom Ezra commissioned to obtain from Loddeus, the captain, men to execute the priest\'s office (1Esdras 8:44) = "Shemaiah" in <a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a> (the King James Version Mamaias).<P>(4) the King James Version = the Revised Version (British and American) "Shemaiah the great," a kinsman of Tobit and father of Ananias and Jonathan (Tobit 5:13).``5';
isbe[7610]='Samaria, City of`sa-ma\'-ri-a, (shomeron; Samareia, Semeron, and other forms):<P>(1) Shechem was the first capital of the Northern Kingdom (<a onClick="return mV(\'1Ki\',12,25);">1Ki 12:25</a>). Jeroboam seems later to have removed the royal residence to Tirzah (<a onClick="return mV(\'1Ki\',14,17);">1Ki 14:17</a>). After the brief reigns of Elah and Zimri came that of Omri, who reigned 6 years in Tirzah, then he purchased the hill of Samaria and built a city there, which was thenceforward the metropolis of the kingdom of Israel (<a onClick="return mV(\'1Ki\',16,24);">1Ki 16:24</a>). Here the hill and the city are said to have been named after Shemer, the original owner of the land. There is nothing intrinsically improbable in this. It might naturally be derived from shamar, and the name in the sense of "outlook" would fitly apply to a city in such a commanding position. The residence, it was also the burying-place, of the kings of Israel (<a onClick="return mV(\'1Ki\',16,28);">1Ki 16:28</a>; <a onClick="return mV(\'1Ki\',22,37);">22:37</a>; <a onClick="return mV(\'2Ki\',10,35);">2Ki 10:35</a>; <a onClick="return mV(\'2Ki\',13,9,13);">13:9,13</a>; <a onClick="return mV(\'2Ki\',14,16);">14:16</a>).<P>Toward the western edge of the Ephraimite uplands there is a broad fertile hollow called Wady esh-Sha\'ir, "valley of barley." From the midst of it rises an oblong hill to a height of over 300 ft., with a level top. The sides are steep, especially to the Samaria. The greatest length is from east to west. The surrounding mountains on three sides are much higher, and are well clad with olives and vineyards. To the west the hills are lower, and from the crest a wide view is obtained over the Plain of Sharon, with the yellow ribbon of sand that marks the coast line, and the white foam on the tumbling billows; while away beyond stretch the blue waters of the Mediterranean. On the eastern end of the hill, surrounded by olive and cactus, is the modern village of Sebastiyeh, under which a low neck of land connects the hill with the eastern slopes. The position is one of great charm and beauty; and in days of ancient warfare it was one of remarkable strength. While it was overlooked from three sides, the battlements crowning the steep slopes were too far off to be reached by missiles from the only artillery known in those times—the sling and the catapult. For besiegers to attempt an assault at arms was only to court disaster. The methods adopted by her enemies show that they relied on famine to do their work for them (<a onClick="return mV(\'2Ki\',6,24);">2Ki 6:24</a>f; etc.). Omri displayed excellent taste and good judgment in the choice he made.<P>The city wall can be traced in almost its entire length. Recent excavations conducted by American archaeologists have uncovered the foundations of Omri\'s palace, with remains of the work of Ahab and of Herod (probably here was Ahab\'s ivory palace), on the western end of the hill, while on the western slope the gigantic gateway, flanked by massive towers, has been exposed to view.<P>Under the influence of Jezebel, Samaria naturally became a center of idolatrous worship. Ahab "reared up an altar for Baal in the house of Baal, which he had built in Samaria. And Ahab made the Asherah" (<a onClick="return mV(\'1Ki\',16,32);">1Ki 16:32</a>f). Jehoram his son put away the pillar of Baal (<a onClick="return mV(\'2Ki\',3,2);">2Ki 3:2</a>), and within the temple Jehu made an end at once of the instruments of idolatry and of the priests (<a onClick="return mV(\'2Ki\',10,19);">2Ki 10:19</a>f). There are many prophetic references to the enormities practiced here, and to their inevitable consequences (<a onClick="return mV(\'Isa\',8,4);">Isa 8:4</a>; <a onClick="return mV(\'Isa\',9,9);">9:9</a>; <a onClick="return mV(\'Isa\',10,9);">10:9</a>; <a onClick="return mV(\'Isa\',28,1);">28:1</a>ff; <a onClick="return mV(\'Isa\',36,19);">36:19</a>; <a onClick="return mV(\'Jer\',23,13);">Jer 23:13</a>; <a onClick="return mV(\'Eze\',23,4);">Eze 23:4</a>; <a onClick="return mV(\'Hsa\',7,1);">Ho 7:1</a>; <a onClick="return mV(\'Hsa\',13,16);">13:16</a>; <a onClick="return mV(\'Amo\',3,12);">Am 3:12</a>; <a onClick="return mV(\'Mic\',1,6);">Mic 1:6</a>, etc.).<P>Under pressure of Damascus Omri conceded to the Syrians the right to "make streets in Samaria" (<a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>).<P>Ben-hadad II besieged the city, but suffered ignominious defeat (<a onClick="return mV(\'1Ki\',20,\'1-21\');">1Ki 20:1-21</a>; Josephus, Ant, VIII, xiv, 1f). Persistent attempts by the Syrians to reach the city in the time of Jehoram were frustrated by Elisha (<a onClick="return mV(\'2Ki\',6,8);">2Ki 6:8</a>; Josephus, Ant, IX, iv, 3). At length, however, Ben-hadad again invested the city, and the besieged were reduced to dire straits, in which, urged by famine, scenes of awful horror were enacted (<a onClick="return mV(\'2Ki\',6,24);">2Ki 6:24</a>). A mysterious panic seized the Syrians. Their deserted camp was discovered by despairing lepers who carried the good news to the famished citizens of the plenty to be found there. Probably in the throat of the great western gateway occurred the crush in which the incredulous captain was trampled to death (<a onClick="return mV(\'1Ki\',7,\'1-\');">1 Kings 7</a>; Josephus, Ant, IX, iv, 5).<P>Here the 70 sons of Ahab were slain by Jehu in the general destruction of the house of Ahab (<a onClick="return mV(\'2Ki\',10,1);">2Ki 10:1</a>). In Samaria, the Chronicler tells us, Ahaziah in vain hid from Jehu (<a onClick="return mV(\'2Ch\',22,9);">2Ch 22:9</a>; compare <a onClick="return mV(\'2Ki\',9,27);">2Ki 9:27</a>). Pekah brought hither much spoil from Jerusalem and many captives, whom, at the instance of the prophet Oded, he released (<a onClick="return mV(\'2Ch\',28,\'1-\');">2Ch 28</a>). The siege of Samaria was begun by Shalmaneser in the 7th year of Hoshea, and the city was finally taken by Sargon II at the end of 3 years, 722 BC (<a onClick="return mV(\'2Ki\',17,5);">2Ki 17:5</a>f; <a onClick="return mV(\'2Ki\',18,9);">18:9</a>f; Ant, IX, xiv, 1). This marked the downfall of the Northern Kingdom, the people being transported by the conqueror. That this was not done in a thoroughgoing way is evident from the fact recorded in the inscriptions that two years later the country had to be subdued again. Colonists were brought from other parts to take the places of the exiles (<a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a>; <a onClick="return mV(\'Ezr\',4,10);">Ezr 4:10</a>). Alexander the Great took the city in 331 BC, killed many of the inhabitants, and settled others in Shechem, replacing them with a colony of Syro-Macedonians. He gave the adjoining country to the Jews (Apion, II, 4). The city suffered at the hands of Ptolemy Lagi and Demetrius Poliorcetes, but it was still a place of strength (Josephus, Ant, XIII, x, 2) when John Hyrcanus came against it in 120 BC. It was taken after a year\'s siege, and the victor tried to destroy the city utterly. His turning of the water into trenches to undermine the foundations could only refer to the suburbs under the hill. From the only two sources, \'Ain Harun and \'Ain Kefr Rima, to the east of the town, the water could not rise to the hill. The "many fountains of water" which Benjamin of Tudela says he saw on the top, from which water enough could be got to fill the trenches, are certainly not to be seen today; and they have left no trace behind them. The city was rebuilt by Pompey and, having again fallen under misfortune, was restored by Gabinius (Josephus, Ant, XIV, iv, 4; v, 3; BJ, I, vii, 7; viii, 4). To Herod it owed the chief splendor of its later days. He extended, strengthened and adorned it on a scale of great magnificence, calling it Sebaste (= Augusta) in honor of the emperor, a name which survives in the modern Sebastiyeh. A temple also was dedicated to Caesar. Its site is probably marked by the impressive flight of steps, with the pedestal on which stood the gigantic statue of Augustus, which recent excavations have revealed. The statue, somewhat mutilated, is also to be seen. Another of Herod\'s temples west of the present village was cleared out by the same explorers. The remains of the great double-columned street, which ran round the upper terrace of the hill, bear further testimony to the splendor of this great builder\'s work (Josephus, Ant, XV, vii, 3; viii, 5; BJ, I, xxi, 2). It was here that Herod killed perhaps the only human being whom he ever really loved, his wife Mariamne. Here also his sons perished by his hand (Josephus, Ant, XV, vii, 5-7; XVI, iii, 1-3; xi, 7).<P>It is commonly thought that this city was the scene of Philip\'s preaching and the events that followed recorded in <a onClick="return mV(\'Act\',8,\'1-\');">Ac 8</a>, but the absence of the definite article in <a onClick="return mV(\'Act\',8,5);">8:5</a> makes this doubtful. A Roman colony was settled here by Septimius Severus. From that time little is known of the history of the city; nor do we know to what the final castastrophe was due. It became the seat of a bishopric and was represented in the councils of Nicea, Constantinople and Chalcedon. Its bishop attended the Synod of Jerusalem in 536 AD.<P>The Church of John, a Crusading structure beside the modern village, is now a Moslem mosque. It is the traditional burying-place of John the Baptist\'s body.<P>(2) he Samareia: A town mentioned in 1Macc 5:66 as on the route followed by Judas from the district of Hebron to the land of the Philistines. The name is probably a clerical error. The margin reads Marisa, and probably the place intended is Mareshah, the site of which is at Tell Sandachannah, about a mile south of Belt Jibrin.``54';
isbe[7611]='Samaria, Country of`(shomeron; he Samareitis chora): The name of the city was transferred to the country of which it was the capital, so that Samaria became synonymous with the Northern Kingdom (<a onClick="return mV(\'1Ki\',13,32);">1Ki 13:32</a>; <a onClick="return mV(\'Jer\',31,5);">Jer 31:5</a>, etc.). The extent of territory covered by this appellation varied greatly at different periods. At first it included the land held by Israel east of the Jordan, Galilee and Mt. Ephraim, with the northern part of Benjamin. It was shorn of the eastern portion by the conquest of Tiglath-pileser (<a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>). Judah probably soon absorbed the territory of Dan in the Samaria. In New Testament times Samaria had shrunk to still smaller dimensions. Then the country west of the Jordan was divided into three portions: Judea in the south, Galilee in the north, and Samaria in the middle. The boundaries are given in general terms by Josephus (BJ, III, iii,1,4, 5). The southern edge of the Plain of Esdraelon and the lands of Scythopolis, the city of the Decapolis west of the Jordan, formed the northern boundary. It reached south as far as the toparchy of Acrabatta (modern \'Aqrabeh), while on the border between Samaria and Judea lay the villages of Annath and Borceos, the modern Khirbet \'Aina and Berqit, about 15 miles south of Nablus. The Jordan of course formed the eastern boundary. On the west the coast plain as far as Acre belonged to Judea. The country thus indicated was much more open to approach than the high plateau of Judah with its steep rocky edges and difficult passes. The road from the north indeed was comparatively easy of defense, following pretty closely the line of the watershed. But the gradual descent of the land to the west with long, wide valleys, offered inviting avenues from the plain. The great trade routes, that to the fords of Jordan and the east, passing through the cleft in the mountains at Shechem, and those connecting Egypt with the north and the northeast, traversed Samarian territory, and brought her into constant intercourse with surrounding peoples. The influence of the heathen religions to which she was thus exposed made a swift impression upon her, leading to the corruptions of faith and life that heralded her doom (<a onClick="return mV(\'Jer\',23,13);">Jer 23:13</a>; <a onClick="return mV(\'Hsa\',7,1);">Ho 7:1</a>, etc.). The Assyrians came as the scourge of God (<a onClick="return mV(\'2Ki\',17,\'5-23\');">2Ki 17:5-23</a>). Their attack centered on the capital. Shalmaneser began the siege, and after three years the city fell to Sargon II, his successor. With the fall of Samaria the kingdom came to an end. Following the usual Assyrian policy, great numbers of the inhabitants were deported from the conquered country, and their places taken by men brought from "Babylon, and from Cuthah, and from Avva, and from Hamath and Sepharvaim," cities which had already bowed to the Assyrian power (<a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a>).<P>It appears from the Assyrian inscriptions that the number carried away was 27,290. The number afterward deported from Judah was 200,000, and then the poorest of the land were left to be vinedressers and husbandmen (<a onClick="return mV(\'2Ki\',25,12);">2Ki 25:12</a>). It is evident that a similar policy must have been followed in Samaria, as 27,290 could certainly not include the whole population of the cities and the country. But it would include the higher classes, and especially the priests from whom the victors would have most to fear. The population therefore after the conquest contained a large proportion of Israelites. It was no doubt among these that Josiah exercised his reforming energy (<a onClick="return mV(\'2Ki\',23,19);">2Ki 23:19</a>f; <a onClick="return mV(\'2Ch\',34,6);">2Ch 34:6</a>f). Here also must have been that "remnant of Israel," Manasseh and Ephraim, who contributed for the repair of the house o
