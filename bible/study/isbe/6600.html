0 ft. above, from which Elijah\'s servant had full view of the sea (<a onClick="return mV(\'1Ki\',18,42,43);">1Ki 18:42,43</a>). Elijah must have run before Ahab no less than 15 miles, from the nearest point on Carmel (<a onClick="return mV(\'1Ki\',18,46);">1Ki 18:46</a>) to Jezreel, and the journey of the Shunammite woman to find Elisha (<a onClick="return mV(\'2Ki\',4,25);">2Ki 4:25</a>) was equally long. The vineyard of Naboth in Jezreel (<a onClick="return mV(\'1Ki\',21,1);">1Ki 21:1</a>) was perhaps on the east of the city (now Zer\'in), where rock-cut wine presses exist. In the account of the ascension of Elijah, the expression "went down to Bethel" (<a onClick="return mV(\'2Ki\',2,2);">2Ki 2:2</a>) is difficult, if he went "from Gilgal" (<a onClick="return mV(\'2Ki\',2,1);">2Ki 2:1</a>). The town intended might be Jiljilia, on a high hill 7 miles north of Bethel. The Septuagint, however, reads "they came."<P>(3) Places Connected with Elisha.<P>The home of Elisha was at Abel-meholah (<a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a>) in the Jordan valley (<a onClick="return mV(\'Jdg\',7,22);">Jud 7:22</a>), probably at \'Ain Chelweh, 10 miles south of Beth-shan. If we suppose that Ophel (<a onClick="return mV(\'2Ki\',5,24);">2Ki 5:24</a> the Revised Version margin), where he lived, was the present \'Afuleh, it is not only easy to understand that he would often "pass by" Shunem (which lay between Ophel and Abel-meholah), but also how Naaman might have gone from the palace of Jezreel to Ophel, and thence to the Jordan and back again to Ophel (<a onClick="return mV(\'2Ki\',5,6,14,24);">2Ki 5:6,14,24</a>), in the course of a single day in his chariot. The road down the valley of Jezreel was easy, and up it Jehu afterward drove furiously, coming from Ramoth in Gilead, and visible afar off from the wall of Jezreel (<a onClick="return mV(\'2Ki\',9,20);">2Ki 9:20</a>). The \'top of the ascents\' (<a onClick="return mV(\'2Ki\',9,13);">2Ki 9:13</a>), at Ramoth, refers no doubt to the high hill on which this city (now Reimun) stood as a strong fortress on the border between Israel and the Syrians. The flight of Ahaziah of Judah, from Jezreel was apparently north by Gur (Qara), 4 miles west of Ibleam (Yebla), on the road to "the garden house" (Beit Jenn), and thence by Megiddo (Mujedda\') down the Jordan valley to Jerusalem (<a onClick="return mV(\'2Ki\',9,27,28);">2Ki 9:27,28</a>). Of the rebellion of Moab (<a onClick="return mV(\'2Ki\',1,1);">2Ki 1:1</a>; <a onClick="return mV(\'2Ki\',3,4);">3:4</a>) it is enough to point out here that King Mesha\'s account on the Moabite Stone agrees with the Old Testament, even in the minute detail that "men of Gad dwelt in Ataroth from of old" (compare <a onClick="return mV(\'Num\',32,34);">Nu 32:34</a>), though it lay in the lot of Reuben.<P>6. Post-exilic Historical Books:<P>The topographical notices in the books written after the captivity require but short notice. The Benjamites built up Lod (Ludd), Ono (Kerr \'Ana) and Aijalon (Yalo), which were in the lot of Dan (<a onClick="return mV(\'1Ch\',8,12);">1Ch 8:12</a>; <a onClick="return mV(\'Neh\',11,35);">Ne 11:35</a>), and it is worthy of note that Lod (Lydda) is not to be regarded as a new town simply because not mentioned in the earlier books; for Lod is mentioned (number 64) with Ono in the lists of Thothmes III, a century before the Hebrew conquest of Palestine The author of Chronicles had access to information not to be found elsewhere in the Old Testament. His list of Rehoboam\'s fortresses (<a onClick="return mV(\'2Ch\',11,\'6-10\');">2Ch 11:6-10</a>) includes 14 towns, most of which were on the frontiers of the diminished kingdom of Judah, some being noticed (such as Shoco and Adoraim) in the list of Shishak\'s conquests. He speaks of the "valley of Zephathah" (<a onClick="return mV(\'2Ch\',14,10);">2Ch 14:10</a>), now Wady Cafieh, which is otherwise unnoticed, and places it correctly at Mareshah (Mer\'ash) on the edge of the Philistine plain. He is equally clear about the topography in describing the attack on Jehoshaphat by the Ammonites, Moabites and Edomites. They camped at En-gedi (\'Ain Jidi), and marched west toward Tekoa (Tequ\'a); and the thanksgiving assembly, after the Hebrew victory, was in the valley of Beracah (<a onClick="return mV(\'2Ch\',20,1,20,26);">2Ch 20:1,20,26</a>), which retains its name as Breikut, 4 miles west of Tekoa.``28';
isbe[6669]='Palestine, 3`IV. Palestine in the Poetic Books of the Old Testament.<P>1. Book of Job:<P>In Job the scene is distinctively Edomite. Uz (<a onClick="return mV(\'Job\',1,1);">Job 1:1</a>; compare <a onClick="return mV(\'Gen\',22,21);">Ge 22:21</a> the English Revised Version; <a onClick="return mV(\'Jer\',25,20);">Jer 25:20</a>; <a onClick="return mV(\'Lam\',4,21);">La 4:21</a>) and Buz (<a onClick="return mV(\'Job\',32,2);">Job 32:2</a>; compare <a onClick="return mV(\'Gen\',22,21);">Ge 22:21</a>) are the Assyrian Chazu and Bazu reached by Esarhaddon in 673 BC south of Edom. Tema and Sheba (<a onClick="return mV(\'Job\',6,19);">Job 6:19</a>) are noticed yet earlier, by Tiglath-pileser III, and Sargon, who conquered the Thamudites and Nabateans. We have also the conjunction of snowy mountains and ice (<a onClick="return mV(\'Job\',6,16);">Job 6:16</a>) with notice of the desert and the \'Arabah valley (<a onClick="return mV(\'Job\',24,5);">24:5</a>), which could hardly apply to any region except Edom. Again, we have a nomad population dwelling close to a city (<a onClick="return mV(\'Job\',29,\'4-7\');">29:4-7</A>)—perhaps Petra, or Ma\'an in Edom. There were mines, not only in the Sinaitic desert, but at Punon in Northern Edom (compare <a onClick="return mV(\'Job\',28,\'2-11\');">28:2-11</A>). The white broom (<a onClick="return mV(\'Job\',30,4);">30:4</a>) is distinctive of the deserts of Moab and Edom. The wild donkey and the ostrich (<a onClick="return mV(\'Job\',39,5,13);">39:5,13</a>) are now known only in the desert east of Edom; while the stork (<a onClick="return mV(\'Job\',39,13);">39:13</A> the Revised Version margin) could have been found only in the \'Arabah, or in the Jordan valley. The wild ox (<a onClick="return mV(\'Job\',39,9);">39:9</A> the Revised Version (British and American)), or Boa primi-genius, is now extinct Septuagint "unicorn," <a onClick="return mV(\'Num\',23,22);">Nu 23:22</a>; <a onClick="return mV(\'Deu\',33,17);">De 33:17</a>), though its bones occur in Lebanon caves. It was hunted about 1130 BC in Syria by Tiglath-pileser I (compare <a onClick="return mV(\'Psa\',29,6);">Ps 29:6</a>), and is mentioned as late as the time of Isaiah (<a onClick="return mV(\'Isa\',34,7);">34:7</a>) in connection with Edom; its Hebrew name (re\'em) is the Assyrian rimu, attached to a representation of the beast. As regards the crocodile ("leviathan," <a onClick="return mV(\'Job\',41,1);">Job 41:1</a>), it was evidently well known to the writer, who refers to its strong, musky smell (<a onClick="return mV(\'Job\',41,31);">Job 41:31</a>), and it existed not only in Egypt but in Palestine, and is still found in the Crocodile River, north of Caesarea in Sharon. Behemoth (<a onClick="return mV(\'Job\',40,15);">Job 40:15</a>), though commonly supposed to be the hippopotamus, is more probably the elephant (on account of its long tail, its trunk, and its habit of feeding in mountains, <a onClick="return mV(\'Job\',40,17,20,24);">Job 40:17,20,24</a>); and the elephant was known to the Assyrians in the 9th century BC, and was found wild in herds on the Euphrates in the 16th century BC. The physical allusions in Job seem clearly, as a rule, to point to Edom, as do the geographical names; and though Christian tradition in the 4th century AD (St. Silvia, 47) placed Uz in Bashan, the Septuagint defines it as lying "on the boundary of Edom and Arabia." None of these allusions serves to fix dates, nor do the peculiarities of the language, though they suggest Aramaic and Arabic influences. The mention of Babylonians (<a onClick="return mV(\'Job\',1,17);">Job 1:17</a>) (Kasdim) as raiders may, however, point to about 600 BC, since they could not have reached Edom except from the north, and did not appear in Palestine between the time of Amraphel (who only reached Kadesh-barnea), and of Nebuchadnezzar. It is at least clear (<a onClick="return mV(\'Job\',24,\'1-12\');">Job 24:1-12</a>) that this great poem was written in a time of general anarchy, and of Arab lawlessness.<P>2. Book of Psalms:<P>In the Psalms there are many allusions to the natural phenomena of Palestine, but there is very little detailed topography. "The mountain of Bashan" (<a onClick="return mV(\'Psa\',68,15);">Ps 68:15</a>) rises east of the plateau to 5,700 ft. above sea-level; but Zalmon (<a onClick="return mV(\'Psa\',68,14);">Ps 68:14</a>) is an unknown mountain (compare Zalmon, <a onClick="return mV(\'Jdg\',9,48);">Jud 9:48</a>). This psalm might well refer to David\'s conquest of Damascus (<a onClick="return mV(\'2Sa\',8,6);">2Sa 8:6</a>), as <a onClick="return mV(\'Psa\',72,\'1-\');">Ps 72</a> refers to the time of Solomon, being the last in the original collection of "prayers of David". In <a onClick="return mV(\'Psa\',83,6,7,8);">Ps 83 (verses 6-8)</a> we find a confederacy of Edom, Ishmael, Moab and the Hagarenes (or "wanderers" east of Palestine; compare <a onClick="return mV(\'1Ch\',5,\'18-22\');">1Ch 5:18-22</a>) with Gebal (in Lebanon), Ammon, Amalek, and Tyre, all in alliance with Assyria—a condition which first existed in 732 BC, when Tiglath-pileser III conquered Damascus. The reference to the "northern" ("hidden") tribes points to this date (<a onClick="return mV(\'Psa\',83,3);">Ps 83:3</a>), since this conqueror made captives also in Galilee (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>; <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>; <a onClick="return mV(\'Isa\',9,1);">Isa 9:1</a>).<P>3. Book of Proverbs:<P>In Proverbs the allusions are more peaceful, but not geographical. They refer to agriculture (<a onClick="return mV(\'Pro\',3,10);">3:10</a>; <a onClick="return mV(\'Pro\',11,26);">11:26</a>; <a onClick="return mV(\'Pro\',12,11);">12:11</A>; <a onClick="return mV(\'Pro\',25,13);">25:13</a>), to trade (<a onClick="return mV(\'Pro\',7,16);">7:16</a>; <a onClick="return mV(\'Pro\',31,14,24);">31:14,24</a>) and to flocks (<a onClick="return mV(\'Pro\',27,\'23-27\');">27:23-27</A>). The most remarkable passage (<a onClick="return mV(\'Pro\',26,8);">26:8</a>) reads literally, "As he that packs a stone into the stone-heap, so is he that giveth honor to a fool." Jerome said that this referred to a superstitious custom; and the erection of stone heaps at graves, or round a pillar (<a onClick="return mV(\'Gen\',31,45,46);">Ge 31:45,46</a>), is a widely spread and very ancient custom (still preserved by Arabs), each stone being the memorial of a visitor to the spot, who thus honors either a local ghost or demon, or a dead man—a rite which was foolish in the eyes of a Hebrew of the age in which this verse was written (see Expository Times, VIII, 399, 524).<P>4. So of Songs:<P>The geography of Canticles is specially important to a right understanding of this bridal ode of the Syrian princess who was Solomon\'s first bride. It is not confined, as some critics say it is, to the north, but includes the whole of Palestine and Syria. The writer names Kedar in north Arabia (<a onClick="return mV(\'Sgs\',1,5);">So 1:5</a>) and Egypt, whence horses came in Solomon\'s time (<a onClick="return mV(\'Sgs\',1,9);">So 1:9</a>; <a onClick="return mV(\'1Ki\',10,28,29);">1Ki 10:28,29</a>). He knows the henna (the King James Version "camphire") and the vineyards of En-gedi (<a onClick="return mV(\'Sgs\',1,14);">So 1:14</a>), where vineyards still existed in the 12th century AD. He speaks of the "rose" of Sharon (<a onClick="return mV(\'Sgs\',2,1);">So 2:1</a>), as well as of Lebanon, with Shenir (Assyrian Saniru) and Hermon (<a onClick="return mV(\'Sgs\',4,8);">So 4:8</a>) above Damascus (<a onClick="return mV(\'Sgs\',7,4);">So 7:4</a>). He notices the pastoral slopes of Gilead. (<a onClick="return mV(\'Sgs\',6,5);">So 6:5</a>), and the brown pool, full of small fish, in the brook below Heshbon (<a onClick="return mV(\'Sgs\',7,4);">So 7:4</a>), in Moab. The locks of the "peaceful one" (<a onClick="return mV(\'Sgs\',6,13);">So 6:13</a>, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) pacifica) are like the thick copses of Carmel; \'the king is caught in the tangles\' (<a onClick="return mV(\'Sgs\',7,5);">So 7:5</a>). See <a href="./study/isbe/search.html?string=GALLERY">GALLERY</a>. She is "beautiful as Tirzah (in Samaria), comely as Jerusalem, terrible to look at" (<a onClick="return mV(\'Sgs\',6,4);">So 6:4</a> the King James Version). She is a garden and a "paradise" ("orchard") of spices in Lebanon, some of which spices (calamus, cinnamon, frankincense and myrrh) have come from far lands (<a onClick="return mV(\'Sgs\',4,\'12-15\');">So 4:12-15</a>). Solomon\'s vineyard—another emblem of the bride—(<a onClick="return mV(\'Sgs\',1,6);">So 1:6</a>; <a onClick="return mV(\'Sgs\',8,11);">8:11</a>) was in Baal-hamon, which some suppose to be Baal-hermon, still famous for its vineyards. He comes to fetch her from the wilderness (<a onClick="return mV(\'Sgs\',3,6);">So 3:6</a>); and the dust raised by his followers is like that of the whirlwind pillars which stalk over the dry plains of Bashan in summer. The single word "paradise" (<a onClick="return mV(\'Sgs\',4,13);">So 4:13</a> margin) is hardly evidence enough to establish late date, since—though used in Persian—its etymology and origin are unknown. The word for "nuts" (Hebrew \'eghoz) is also not Persian (<a onClick="return mV(\'Sgs\',6,11);">So 6:11</a>), for the Arabic word jauz, is Semitic, and means a "pair," applying to the walnut which abounds in Shechem. The "rose of Sharon" (<a onClick="return mV(\'Sgs\',2,1);">So 2:1</a>), according to the Targum, was the white "narcisus; and the Hebrew word occurs also in Assyrian (chabacillatu), as noted by Delitzsch (quoting WAI, V, 32, <span class="noTag">number 4</span>), referring to a white bulbous plant. Sharon in spring is covered still with wild narcissi, Arabic buceil (compare <a onClick="return mV(\'Isa\',35,1,2);">Isa 35:1,2</a>). There is perhaps no period when such a poem is more likely to have been written than in the time of Solomon, when Israel "dwelt safely, every man under his vine and under his fig-tree" (<a onClick="return mV(\'1Ki\',4,25);">1Ki 4:25</a>); when the roe and the fallow deer (<a onClick="return mV(\'Sgs\',2,17);">So 2:17</a>; <a onClick="return mV(\'1Ki\',4,23);">1Ki 4:23</a>) abounded; and when merchants (<a onClick="return mV(\'Sgs\',3,6);">So 3:6</a>) brought "powders" from afar; when also the dominion included Damascus and Southern Lebanon, as well as Western Palestine with Gilead and Moab.<P>See also <a href="./study/isbe/search.html?string=SONG+OF+SONGS">SONG OF SONGS</a>.<P>V. Palestine in the Prophets.<P>1. Isaiah:<P>Isaiah (<a onClick="return mV(\'Isa\',1,8);">1:8</a>) likens Zion, when the Assyrian armies were holding Samaria, Moab and Philistia, to "a booth in a vineyard, a lodge in a garden of cucumbers." He refers no doubt to a "tower" (<a onClick="return mV(\'Mat\',21,33);">Mt 21:33</a>), or platform, such as is to be found beside the rock-cut wine press in the deserted vineyards of Palestine; and such as is still built, for the watchman to stand on, in vineyards and vegetable gardens.<P>The chief topographical question (<a onClick="return mV(\'Isa\',10,\'28-32\');">Isa 10:28-32</a>) refers to the Assyrian advance from the north, when the outposts covered the march through Samaria (whether in 732, 722,or 702 BC) to Philistia. They extended on the left wing to Ai (Chayan), Michmash (Mukhmas), and Geba, south of the Michmash valley (Jeba\'), leading to the flight of the villagers, from Ramah (er-Ram) and the region of Gibeah—which included Ramah, with Geba (<a onClick="return mV(\'1Sa\',22,6);">1Sa 22:6</a>) and Migron (<a onClick="return mV(\'1Sa\',14,2);">1Sa 14:2</a>) or the precipice. They were alarmed also at Gallim (Beit Jala), and Anathoth (\'Anata), near Jerusalem; yet the advance ceased at Nob (compare <a onClick="return mV(\'Neh\',11,32);">Ne 11:32</a>) where, as before noted, the first glimpse of Zion would be caught if Nob was at or near Mizpah (Tell en Nacbeh), on the main north road leading west of Ramah.<P>Another passage refers to the towns of Moab (<a onClick="return mV(\'Isa\',15,\'1-6\');">Isa 15:1-6</a>), and to Nimrim (Tell Nimrin) and Zoar (Tell esh Shaghur) in the valley of Shittim. The ascent of Luhith (<a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>) is the present Tal\'at el Cheith, on the southern slope of Nebo (Jebel Neba). The curious term "a heifer of three years old" (compare <a onClick="return mV(\'Jer\',48,34);">Jer 48:34</a> margin) is taken from Septuagint, but might better be rendered "a round place with a group of three" (see <a href="./study/isbe/search.html?string=EGLATH-SHELISHIYAH">EGLATH-SHELISHIYAH</a>). It is noticed with the "high places" of Moab (<a onClick="return mV(\'Isa\',15,2);">Isa 15:2</a>; <a onClick="return mV(\'Jer\',48,35);">Jer 48:35</a>), and probably refers to one of those large and ancient stone circles, surrounding a central group of three rude pillars, which still remain in Moab (SEP, I, 187, 203, 233) near Nobo and Zoar. Sibmah—probably Sumieh, 2 miles southwest of Heshbon (Chesban)—is said to have had vines reaching to Jazer (Sa\'aur, 6 miles to the north); and rock-cut wine presses still remain at Sibmah (<a onClick="return mV(\'Isa\',16,8);">Isa 16:8</a>; <a onClick="return mV(\'Jer\',48,32);">Jer 48:32</a>). The Bozrah mentioned with Edom (<a onClick="return mV(\'Isa\',34,6);">Isa 34:6</a>; <a onClick="return mV(\'Isa\',63,1);">63:1</a>; <a onClick="return mV(\'Jer\',49,13,22);">Jer 49:13,22</a>; <a onClick="return mV(\'Mic\',2,12);">Mic 2:12</a>) is probably Buceirah, near the southern border of Moab. In the last-cited passage there is a play on the words batsrah ("fortress") and botscah for "sheepfold."<P>2. Jeremiah:<P>In <a onClick="return mV(\'Jer\',1,1);">Jer 1:1</a>, Anathoth (\'Anata) is mentioned as a priests\' city (compare <a onClick="return mV(\'1Ki\',2,26);">1Ki 2:26</a>). The "place" or shrine of Shiloh was deserted (<a onClick="return mV(\'Jer\',7,12);">Jer 7:12</a>), but the town seems still to have been inhabited (<a onClick="return mV(\'Jer\',41,5);">Jer 41:5</a>). The "pit" at Mizpah (<a onClick="return mV(\'Jer\',41,\'6-9\');">Jer 41:6-9</a>) may have been the great rock reservoir south of Tell en-Nacbeh. The Moabite towns noticed (<a onClick="return mV(\'Jer\',48,\'1-5\',\'20-24\',\'31-45\');">Jer 48:1-5,20-24,31-45</a>; <a onClick="return mV(\'Jer\',49,3);">49:3</a>) with Rabbah (\'Amman) have been mentioned as occurring in the parallel passages of Isaiah. The numerous petty kings in Edom, Moab, Philistia, Phoenicia, and Arabia (<a onClick="return mV(\'Jer\',25,\'20-24\');">Jer 25:20-24</a>) recall those named in Assyrian lists of the same age. <a onClick="return mV(\'Lam\',4,3);">La 4:3</a> recalls <a onClick="return mV(\'Job\',39,14);">Job 39:14</a> in attributing to the ostrich want of care for her young, because she endeavors (like other birds) to escape, and thus draws away the hunter from the nest. This verse should not be regarded as showing that the author knew that whales were mammals, since the word "sea-monsters" (the King James Version) is more correctly rendered "jackals" (Revised Version) or "wild beasts."<P>3. Ezekiel:<P>In Ezekiel (chapter <a onClick="return mV(\'Eze\',27,\'1-\');">27</a>), Tyre appears as a city with a very widespread trade extending from Asia Minor to Arabia and Egypt, and from Assyria to the isles (or "coasts") of the Mediterranean. The "oaks of Bashan" (<a onClick="return mV(\'Eze\',27,\'1-\');">27:6; <a onClick="return mV(\'Isa\',2,13);">Isa 2:13</a>; <a onClick="return mV(\'Zec\',11,2);">Zec 11:2</a>) are still found in the southwest of that region near Gilead. Judah and Israel then provided wheat, honey, oil and balm for export as in the time of Jacob. Damascus sent white wool and the wine of Helbon (Chelbon), 13 miles north, where fine vineyards still exist. The northern border described (<a onClick="return mV(\'Eze\',47,\'15-18\');">47:15-18</A>) is the same that marked that of the dominions of David, running along the Eleutherus River toward Zedad (Cudud). It is described also in <a onClick="return mV(\'Num\',34,\'8-11\');">Nu 34:8-11</a> as passing Riblah (Riblah) and including Ain (el \'Ain), a village on the western slopes of the Anti-Lebanon, east of Riblah. In this passage (as in <a onClick="return mV(\'Eze\',47,18);">Eze 47:18</a>) the Hauran (or Bashan plain) is excluded from the land of Israel, the border following the Jordan valley, which seems to point to a date earlier than the time when the Havvoth-jair (<a onClick="return mV(\'Num\',32,41);">Nu 32:41</a>; <a onClick="return mV(\'Deu\',3,14);">De 3:14</a>; <a onClick="return mV(\'Jos\',13,30);">Jos 13:30</a>; <a onClick="return mV(\'Jdg\',10,4);">Jud 10:4</a>; <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>; <a onClick="return mV(\'1Ch\',2,23);">1Ch 2:23</a>), in Gilead and Bashan were conquered or built—possibly after the death of Joshua. The southern border of the land is described by Ezekiel (<a onClick="return mV(\'Eze\',47,19);">47:19</a>) as reaching from Kadesh (-barnea)—probably Petra—to Tamar, which seems to be Tamrah, 6 miles northeast of Gaza.<P>4. Minor Prophets:<P>In the Minor Prophets there are fewer topographical notices. Hosea (<a onClick="return mV(\'Hsa\',12,11);">12:11</a>) speaks of the altars of Gilead and Gilgal as being "as heaps in the furrows of the fields." He perhaps alludes to the large dolmen fields of this region, which still characterize the country east of the Jordan. He also perhaps speaks of human sacrifice at Bethel (<a onClick="return mV(\'Hsa\',13,2);">13:2</A>). In Joel (<a onClick="return mV(\'Joe\',1,12);">1:12</a>) the apple tree (Hebrew tappuach, Arabic tuffach) is noticed (compare <a onClick="return mV(\'Sgs\',2,3,5);">So 2:3,5</a>; <a onClick="return mV(\'Sgs\',8,5);">8:5</a>), and there seems to be no reason to doubt that the apple was cultivated, since el Muqaddasi mentions "excellent apples" at Jerusalem in the 10th century AD, though it is not now common in Palestine. The sycamore fig (<a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>), which was common in the plains and in the shephelah (<a onClick="return mV(\'1Ki\',10,27);">1Ki 10:27</a>), grew also near Jericho (<a onClick="return mV(\'Luk\',19,4);">Lu 19:4</a>), where it is still to be found. In Mic (<a onClick="return mV(\'Mic\',1,\'10-15\');">1:10-15</a>), a passage which appears to refer to Hezekiah\'s reconquest of the shephelah towns and attack on Gaza before 702 BC (<a onClick="return mV(\'2Ki\',18,8);">2Ki 18:8</a>; <a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a>) gives a list of places and a play on the name of each. They include Gath (Tell es Cafi), Saphir (es Safir), Lachish (Tell el-Chesy), Achzib (\'Ain Kezbeh), and Mareshah (Mer\'ash): "the glory of Israel shall come even unto Adullam" (\'Aid-el-ma) perhaps refers to Hezekiah himself (<a onClick="return mV(\'Mic\',1,15);">Mic 1:15</a>). After the captivity Philistia (<a onClick="return mV(\'Zec\',9,5);">Zec 9:5</a>) was still independent. See <a href="./study/isbe/search.html?string=PHILISTINES">PHILISTINES</a>. The meaning of the "mourning of Hadadrimmon in the Valley of Megiddon" (<a onClick="return mV(\'Zec\',12,11);">Zec 12:11</a>) is disputed. Jerome (see Reland, Palestine Illustr., II, 891) says that the former of these names referred to a town near Jezreel (Maximianopolis, now Rummaneh, on the western side of the plain of Esdraelon), but the mourning "for an only son" was probably a rite of the Syrian god called Hadad, or otherwise Rimmon, like the mourning for Tammuz (<a onClick="return mV(\'Eze\',8,14);">Eze 8:14</a>).<P>VI. Palestine in the Apocrypha.<P>1. Book of Judith:<P>The Book of Judith is regarded by Renan (Evangiles, 1877, 29) as a Haggadha\' (legend), written in Hebrew in 74 AD. It is remarkable, however, that its geographical allusions are very correct. Judith was apparently of the tribe of Manasseh (8:2,3); and her husband, who bore this name, was buried between Dothaim (Tell Dothan) and Balamon (in Wady Belameh), east of Dothan. Her home at Bethulia was thus probably at Mithilieh, on a high hill (6:11,12), 5 miles southeast of Dothan (SWP, II, 156), in the territory of Manasseh. The requirements of the narrative are well met; for this village is supplied only by wells (7:13,10), though there are springs at the foot of the hill to the south (7:7,12), while there is a good view over the valley to the north (10:10), and over the plain of Esdraelon to Nazareth and Tabor. Other mountains surround the village (15:3). The camp of the invaders reached from Dothart to Belmaim (Balamon) from west to east, and their rear was at Cyamon (Tell Qeimun), at the foot of Carmel. The Babylonians were allied with tribes from Carmel, Gilead and Galilee on the north with the Samaritans, and with others from Betane (probably Beth-anoth, now Belt \'Ainun, north of Hebron), Chellus (Klalach—the later Elusa—8 miles southwest of Beersheba), and Kades (\'Ain Qadis) on the way to Egypt. Among Samaritan towns south of Shechem, Ekrebel (\'Aqrabeh) and Chusi (Kuzah) are mentioned, with "the brook Mochmur" (Wady el Chumr) rising north of Ekrebel and running east into the Jordan.<P>2. Book of Wisdom:<P>The philosophical Book of Wisdom has no references to Palestine; and in Ecclesiasticus the only allusions are to the palm of En-gaddi (24:14), where palms still exist, and to the "rose plant in Jericho" (24:14; compare 39:13; 50:8); the description of the rose as "growing by the brook in the field" suggests the rhododendron (Tristram, NHB, 477), which flourishes near the Jordan and grows to great size beside the brooks of Gilead.<P>3. 1 Maccabees:<P>Judas Maccabeus.—The first Book of Maccabees is a valuable history going down to 135 BC, and its geographical allusions are sometimes important. Modin, the home of Judas-Maccabaeus (1Macc 2:15), where his brother Simon erected seven monuments visible from the sea (1Macc 9:19; 13:25-30), was above the plain in which Cedron (Qatrah, 5 miles east of Jamnia) stood (1Macc 15:40,41; 16:4,9), and is clearly the present village el Midieh on the low hills with a sea view, 17 miles from Jerusalem and 6 miles east of Lydda, near which latter Eusebius (Onom under the word "Modeim") places Modin. The first victory of Judas (1Macc 3:24) was won at Beth-horon, and the second at Emmaus (\'Amwas) by the Valley of Aijalon—the scenes of Joshua\'s victories also.<P>The Greeks next attempted to reach Jerusalem from the south and were again defeated at Beth-zur (1Macc 4:29), now Beit-cur, on the watershed, 15 miles south of Jerusalem, where the road runs through a pass. Judas next (after cleansing the temple in 165 BC) marched south of the Dead Sea, attacking the Edomites at Arabattine (perhaps Akrabbim) and penetrating to the Moab plateau as far north as Jazar (1Macc 5:3-8). On his return to Judea the heathen of Gilead and Bashan rose against the Israelites of Tubias (1Macc 5:13) or Tobit (Taiyibeh), and the Phoenicians against the Galilean Hebrews who were, for a time, withdrawn to Jerusalem until the Hasmoneans won complete independence (1Macc 11:7,59). In the regions of Northern Gilead and Southern Bashan (1Macc 5:26,36,37) Judas conquered Bosor (Bucr), Alema (Kerr el-ma), Caphon (Khisfin), Maged (perhaps el Mejd, north of \'Amman), and Carnaim (Ashteroth-karnaim), now Tell Ashterah. The notice of a "brook" at the last-named place (1Macc 5:42) is an interesting touch, as a fine stream runs south from the west side of the town. In 162 BC Judas was defeated at Bathzacharias (1Macc 6:32), now Beit Skaria 9 miles south of Jerusalem, but the cause was saved by a revolt in Antioch; and in the next year he defeated Nicanor near Caphar-salama (perhaps Selmeh, near Joppa), and slew him at Adasah (\'Adaseh), 8 miles southeast of Beth-horon (1Macc 7:31,40,45). The fatal battle in which Judas was killed (1Macc 9:5,15) was fought also near Beth-horon. He camped at Eleasa (Il\'asa), close by, and defeated the Greeks on his right, driving them to Mt. Azotus (or Beth-zetho, according to Josephus (Ant., XII, xi, 2)), apparently near Bir-ez-Zeit, 4 miles northwest of Bethel; but the Greeks on his left surrounded him during this rash pursuit.<P>On the death of Judas, Bacchides occupied Judea and fortified the frontier towns (1Macc 9:50,51) on all sides. Simon and Jonathan were driven to the marshes near the Jordan, but in 159 BC the Greeks made peace with Jonathan who returned to Michmash (1Macc 9:73) and 7 years later to Jerns (1Macc 10:1,7). Three districts on the southern border of Samaria were then added to Judea (1Macc 10:30; 11:34), namely Lydda, Apherema (or Ephraim) now Taiyibeh, and Ramathem (er-Ram); and Jonathan defeated the Greeks in Philistia (1Macc 10:69; 11:6). Simon was "captain" from the "Ladder of Tyre" (Ras en Naqurah), or the pass north of Accho, to the borders of Egypt (1Macc 11:59); and the Greeks in Upper Galilee were again defeated by Jonathan, who advanced from Gennesaret to the plateau of Hazor (Chazzur), and pursued them even to Kedesh Naphtali (Qedes), northward (1Macc 11:63,73). He was victorious even to the borders of Hamath, and the Eleutherus River (Nahr el Kebir), north of Tripoils, and defeated the Arabs, called Zabadeans (probably at Zebdany in Anti-Lebanon), on his way to Damascus (1Macc 12:25,30,32). He fortified Adida (Chadditheh) in the shephelah (1Macc 12:38), west of Jerusalem, where Simon awaited the Greek usurper Tryphon (1Macc 13:13,20), who attempted to reach Jerusalem by a long detour to the south near Adoraim (Dura), but failed on account of the snow in the mountains. After the treacherous capture of Jonathan at Accho, and his death in Gilead (1Macc 12:48; 13:23), Simon became the ruler of all Palestine to Gaza (1Macc 13:43), fortifying Joppa, Gezer and Ashdod (1Macc 14:34) in 140 BC. Five years later he won a final victory at Cedron (Qatrah), near Jamnia (Yebnah), but was murdered at Dok (1Macc 16:15), near Jericho, which site was a small fort at \'Ain Duk, a spring north of the city.<P>4. 2Maccabees:<P>The Second Book of Maccabees presents a contrast to the first in which, as we have seen, the geography is easily understood. Thus the site of Caspis with its lake (2Macc 12:13,16) is doubtful. It seems to be placed in Idumaea, and Charax may be the fortress of Kerak in Moab (2Macc 12:17). Ephron, west of Ashteroth-karnaim (2Macc 12:26,27), is unknown; and Beth-shean is called by its later name Scythopolis (2Macc 12:29), as in the Septuagint (<a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a>) and in Josephus (Ant., XII, viii, 5; vi, 1). A curious passage (1Macc 13:4-6) seems to refer to the Persian burial towers (still used by Parsees), one of which appears to have existed at Berea (Aleppo), though this was not a Greek custom.<P>See <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>.<P>VII. Palestine in the New Testament.<P>1. Synoptic Gospels:<P>We are told that our Lord was born in "Bethlehem of Judea"; and theory of Neubauer, adopted by Gratz, that Bethlehem of Zebulun (<a onClick="return mV(\'Jos\',19,15);">Jos 19:15</a>)—which was the present Beit-Lachm, 7 miles northwest of Nazareth—is to be understood, is based on a mistake. The Jews expected the Messiah to appear in the home of David (<a onClick="return mV(\'Mic\',5,2);">Mic 5:2</a>); and the Northern Bethlehem was not called "of Nazareth," as asserted by Rix (Tent and Testament, 258); this was a conjectural reading by Neubauer (Geog. du Talmud, 189), but the Talmud (Talm Jerusalem, Meghillah 1 1) calls the place Bethlechem-ceridh (or "of balm"), no doubt from the storax bush (Styrax officinalis) or stacte (<a onClick="return mV(\'Exd\',30,34);">Ex 30:34</a>), the Arabic \'abhar, which still abounds in the oak wood close by.<P>(1) Galilean Scenery.<P>The greater part of the life of Jesus was spent at Nazareth in Zebulun, and the ministry at Capernaum in Naphtali (compare <a onClick="return mV(\'Mat\',4,\'13-15\');">Mt 4:13-15</a>; <a onClick="return mV(\'Isa\',9,1);">Isa 9:1</a>), with yearly visits to Jerusalem. The Gospel narratives and the symbolism of the parables constantly recall the characteristic features of Galilean scenery and nature, as they remain unchanged today. The "city set on a hill" (<a onClick="return mV(\'Mat\',5,14);">Mt 5:14</a>) may be seen in any part of Palestine; the lilies of the field grow in all its plains; the "foxes have holes" and the sparrows are still eaten; the vineyard with its tower; the good plowland, amid stony and thorny places, are all still found throughout the Holy Land. But the deep lake surrounded by precipitous cliffs and subject to sudden storms, with its shoals of fish and its naked fishers; the cast nets and drag nets and small heavy boats of the Sea of Galilee, are more distinctive of the Gospels, since the lake is but briefly noticed in the Old Testament.<P>(2) Nazareth.<P>Nazareth was a little village in a hill plateau north of the plain of Esdraelon, and l, 000 ft. above it. The name (Hebrew natsarah) may mean "verdant," and it had a fine spring, but it is connected (<a onClick="return mV(\'Mat\',2,23);">Mt 2:23</a>) in the Gospels with the prophecy of the "branch" (netser, <a onClick="return mV(\'Isa\',11,1);">Isa 11:1</a>) of the house of David. Its population was Hebrew, for it possessed a synagogue (<a onClick="return mV(\'Luk\',4,16);">Lu 4:16</a>). The "brow of the hill whereon their city was built" (<a onClick="return mV(\'Luk\',4,29);">Lu 4:29</a>) is traditionally the "hill of the leap" (Jebel Qafsi), 2 miles to the south—a cliff overlooking the plain. Nazareth was not on any great highway; and so obscure was this village that it is unnoticed in the Old Testament, or by Josephus, while even a Galilean (<a onClick="return mV(\'Jhn\',1,46);">Joh 1:46</a>) could hardly believe that a prophet could come thence. Jerome (Onomasticon, under the word) calls it a "village"; but today it is a town with 4,000 Christians and 2,000 Moslems, the former taking their Arabic name (Nacarah) from the home of their Master.<P>(3) Capernaum.<P>Capernaum (<a onClick="return mV(\'Mat\',4,13);">Mt 4:13</a>; <a onClick="return mV(\'Mat\',9,1);">9:1</a>) lay on the shore of the Sea of Galilee, apparently (<a onClick="return mV(\'Mar\',14,34);">Mr 14:34</a>; <a onClick="return mV(\'Jhn\',6,17);">Joh 6:17</a>) in the little plain of Gennesaret, which stretches for 3 miles on the northwest side of the lake, and which has a breadth of 2 miles. It may have stood on a low cliff (though this is rendered doubtful by the Sinaiticus manuscript rendering of <a onClick="return mV(\'Mat\',11,23);">Mt 11:23</a>—"Shalt thou be exalted unto heaven?"), and it was a military station where taxes were levied (<a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>), and possessed a synagogue (<a onClick="return mV(\'Mar\',1,21);">Mr 1:21</a>; <a onClick="return mV(\'Luk\',4,33);">Lu 4:33</a>; <a onClick="return mV(\'Jhn\',6,59);">Joh 6:59</a>). Christian tradition, since the 4th century AD, has placed the site at Tell Chum, where ruins of a synagogue (probably, however, not older than the 2nd century AD) exist; but this site is not in the plain of Gennesaret, and is more probably Kephar \'Achim (Babylonian Talmud, Menachoth 85a). Jewish tradition (Midrash, Qoheleth, vii.20) connects Capernaum with minim or "heretics"—that is to say Christians—whose name may yet linger at \'Ain Minyeh at the north end of the plain of Gennesaret. Josephus states (BJ, III, x, 8) that the spring of Capernaum watered this plain, and contained the catfish (coracinus) which is still found in \'Ain el Mudawwerah ("the round spring"), which is the principal source of water in the Gennesaret oasis.<P>(4) Chorazin.<P>The site of Chorazin (Kerazeh) has never been lost. The ruined village lies about 2 1/4 miles north of Tell Chum and possesses a synagogue of similar character. Bethsaida ("the house of fishing") is once said to have been in Galilee (<a onClick="return mV(\'Jhn\',12,21);">Joh 12:21</a>), and Reland (Palestine Illustr., II, 553-55) thought that there were two towns of the name. It is certain that the other notices refer to Bethsaida, called Julias by Herod Philip, which Josephus (Ant., XVIII, ii, 1; iv, 6; BJ, III, x, 7) and Pliny (NH, v.15) place east of the Jordan, near the place where it enters the Sea of Galilee. The site may be at the ruin edition Dikkeh ("the platform"), now 2 miles north of the lake, but probably nearer of old, as the river deposit has increased southward. There are remains of a synagogue here also. The two miracles of feeding the 5,000 and the 4,000 are both described as occurring\' east of the Jordan, the former (<a onClick="return mV(\'Luk\',9,10);">Lu 9:10</a>) in the desert (of Golan) "belonging to the city called Bethsaida" (the King James Version). The words (<a onClick="return mV(\'Mar\',6,45);">Mr 6:45</a> the King James Version), "to go to the other side before unto Bethsaida," may be rendered without any straining of grammar, "to go to the side opposite to Bethsaida." For the disciples are not said to have reached that city; but, after a voyage of at least 3 or 4 miles (<a onClick="return mV(\'Jhn\',6,17,19);">Joh 6:17,19</a>), they arrived near Capernaum, and landed in Gennesaret (<a onClick="return mV(\'Mar\',6,53);">Mr 6:53</a>), about 5 miles southwest of the Jordan.<P>(5) Country of the Gerasenes.<P>The place where the swine rushed down a steep place into the lake (<a onClick="return mV(\'Mat\',8,32);">Mt 8:32</a>; <a onClick="return mV(\'Mar\',5,1);">Mr 5:1</a>; <a onClick="return mV(\'Luk\',8,26);">Lu 8:26</a>) was in the country of the Gerasenes (see Codex Vaticanus MS), probably at Qersa on the eastern shore opposite Tiberias, where there is a steep slope to the water. It should be noted that this was in Decapolis (<a onClick="return mV(\'Mar\',5,20);">Mr 5:20</a>), a region of "ten cities" which lay (except Scythopolis) in Southwest Bashan, where a large number of early Greek inscriptions have been found, some of which (e.g. Vogue-Waddington, numbers 2412, 2413) are as old as the 1st century AD. There was evidently a Greek population in this region in the time of our Lord; and this accounts for the feeding of swine, otherwise distinctive of "a far country" (<a onClick="return mV(\'Luk\',15,13,15);">Lu 15:13,15</a>); for, while no Hebrew would have tended the unclean beast in Palestine, the Greeks were swine-herds from the time at least of Homer.<P>(6) Magadan-Magdala.<P>The site of Magadan-Magdala (Mejdel) was on the west shore at the southwest end of the Gennesaret plain (<a onClick="return mV(\'Mat\',15,39);">Mt 15:39</a>). In <a onClick="return mV(\'Mar\',8,10);">Mr 8:10</a> we find Dalmanutha instead. Magdala was the Hebrew mighdol ("tower"), and Dalmanutha may be regarded as the Aramaic equivalent (De\'almanutha) meaning "the place of high buildings"; so that there is no necessary discrepancy between the two accounts. From this place Jesus again departed by ship to "the other side," and reached Bethsaida (<a onClick="return mV(\'Mat\',16,5);">Mt 16:5</a>; <a onClick="return mV(\'Mar\',8,13,22);">Mr 8:13,22</a>), traveling thence up the Jordan valley to Caesarea Philippi (<a onClick="return mV(\'Mat\',16,13);">Mt 16:13</a>; <a onClick="return mV(\'Mar\',8,27);">Mr 8:27</a>), or Banias, at the Jordan springs. There can be little doubt that the "high mountain apart" (<a onClick="return mV(\'Mat\',17,1);">Mt 17:1</a>) was Hermon. The very name signifies "separate," applying to its solitary dome; and the sudden formation of cloud on the summit seems to explain the allusion in <a onClick="return mV(\'Luk\',9,34);">Lu 9:34</a>.<P>(7) Other Allusions in the Synoptic Gospels.<P>Other allusions in the Synoptic Gospels, referring to natural history and customs, include the notice of domestic fowls (<a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>; <a onClick="return mV(\'Mat\',26,34);">26:34</a>), which are never mentioned in the Old Testament. They came from Persia, and were introduced probably after 400 BC. The use of manure (<a onClick="return mV(\'Luk\',13,8);">Lu 13:8</a>) is also unnoticed in the Old Testament, but is mentioned in the Mishna (Shebi\'ith, ii.2), as is the custom of annually whitening sepulchers (<a onClick="return mV(\'Mat\',23,27);">Mt 23:27</a>; Sheqalim, i.1). The removal of a roof (<a onClick="return mV(\'Mar\',2,4);">Mr 2:4</a>; compare <a onClick="return mV(\'Luk\',5,19);">Lu 5:19</a>) at Capernaum was not difficult, if it resembled those of modern Galilean mud houses, though the Third Gospel speaks of "tiles" which are not now used. Finally, the presence of shepherds with their flocks (<a onClick="return mV(\'Luk\',2,8);">Lu 2:8</a>) is not an indication of the season of the nativity, since they remain with them "in the field" at all times of the year; and the "manger" (<a onClick="return mV(\'Luk\',2,7);">Lu 2:7</a>) may have been (as tradition affirmed even in the 2nd century AD) in a cave like those which have been found in ruins north and south of Hebron (SWP, III, 349, 369) and elsewhere in Palestine<P>2. Fourth Gospel:<P>(1) The topography of the Fourth Gospel is important as indicating the writer\'s personal knowledge of Palestine; for he mentions several places not otherwise noticed in the New Testament. Beth-abarah (<a onClick="return mV(\'Jhn\',1,28);">Joh 1:28</a>, the Revised Version (British and American) "Bethany"; <a onClick="return mV(\'Jhn\',10,40);">10:40</A>), or "the house of the crossing," was "beyond the Jordan." Origen rejected the reading "Bethania," instead of Beth-abarah, common in his time, and still found in the three oldest uncial manuscripts in the 4th and 5th centuries AD. The place was a day\'s journey from Cana (compare <a onClick="return mV(\'Jhn\',1,29,35,43);">Joh 1:29,35,43</a>; <a onClick="return mV(\'Jhn\',2,1);">2:1</a>), which may have been at \'Ain Qana, a mile north of Nazareth. It was two or three days\' distance from Bethany near Jerusalem (<a onClick="return mV(\'Jhn\',10,40);">Joh 10:40</a>; <a onClick="return mV(\'Jhn\',11,3,6,17);">11:3,6,17</a>), and would thus lie in the upper part of the Jordan valley where, in 1874, the surveyors found a ford well known by the name \'Abarah, north of Beisan, in the required situation. John, we are told, baptized in "all the region round about the Jordan" (<a onClick="return mV(\'Mat\',3,5);">Mt 3:5</a>), including the waters of "AEnon near to Salim" (<a onClick="return mV(\'Jhn\',3,23);">Joh 3:23</a>). There is only one stream which answers to this description, namely that of Wady Far\'ah, northeast of Shechem, on the boundary of Judea and Samaria, where there is "much water." AEnon would be \'Ainun, 4 miles north, and Salim is Salim, 4 miles south of this perennial affluent of the Jordan.<P>(2) The site of Sychar (Samaritan: Iskar, Arabic: \'Askar) near Jacob\'s well (<a onClick="return mV(\'Jhn\',4,5,6);">Joh 4:5,6</a>) lay west of Salim, and just within the Samaritan border. The present village is only half a mile north of the well. Like the preceding sites, it is noticed only in the Fourth Gospel, as is Bethesda, while this Gospel also gives additional indications as to the position of Calvary. The town of Ephraim, "near to the wilderness" (<a onClick="return mV(\'Jhn\',11,54);">Joh 11:54</a>), is noticed earlier (<a onClick="return mV(\'2Sa\',13,23);">2Sa 13:23</a>; compare Ephraim, <a onClick="return mV(\'2Ch\',13,19);">2Ch 13:19</a> margin), and appears to be the same as Apherema (1Macc 11:34), and as Ophrah of Benjamin (<a onClick="return mV(\'Jos\',18,23);">Jos 18:23</a>; <a onClick="return mV(\'1Sa\',13,17);">1Sa 13:17</a>). Eusebius (Onom under the word) places it 20 Roman miles north of Jerusalem, where the village Taiyibeh looks down on the desert of Judah.<P>3. Book of Acts:<P>In the Book of Acts the only new site, unnoticed before, is that of Antipatris (<a onClick="return mV(\'Act\',23,31);">23:31</a>). This stood at the head of the stream (Me-jarkon) which runs thence to the sea north of Joppa, and it was thus the half-way station between Jerusalem and the seaside capital at Caesarea. The site is now called Ras el \'Ain ("head of the spring"), and a castle, built in the 12th century, stands above the waters. The old Roman road runs close by (SWP, II, 258). Caesarea was a new town, founded by Herod the Great about 20 BC (SWP, II, 13-29). It was even larger than Jerusalem, and had an artificial harbor. Thence we may leave Palestine with Paul in 60 AD. The reader must judge whether this study of the country does not serve to vindicate the sincerity and authenticity of Bible narratives in the Old Testament and the New Testament alike.<P>LITERATURE<P>Though the literature connected with Palestine is enormous, and constantly increasing, the number of really original and scientific sources of knowledge is (as in other cases) not large. Besides the Bible, and Josephus, the Mishna contains a great deal of valuable information as to the cultivation and civilization of Palestine about the 1st and 2nd centuries AD. The following 20 works are of primary importance. The Onomasticon of Eusebius and Jerome shows intimate acquaintance with Palestine in the 4th century AD, though the identification of Bible sites is as often wrong as right. The rabbinical geography is discussed by A. Neubauer (La geographie du Talmud, 1868), and the scattered notices by Greek and Roman writers were collected by H. Reland (Palaestina ex monumentis veteribus illustrata, 2 volumes, 1714). The first really scientific account of the country is that of Dr. E. Robinson (Biblical Researches,1838,and Later Biblical Researches, 1852; in 3 volumes, 1856). The Survey of Western Palestine (7 volumes, 1883) includes the present writer\'s account of the natural features, topography and surface remains of all ages, written while in command (1872-1878) of the 1-inch trigonometric survey. The Survey of Eastern Palestine (1 vol, 1889) gives his account of Moab and Southern Gilead, as surveyed in 1881-1882. The natural history is to be studied in the same series, and in Canon Tristram\'s Natural History of the Bible, 1868. The geology is best given by L. Lartet (Essai sur la geologie de la Palestine) and in Professor Hull\'s Memoir on the Geol. and Geog. of Arabia Petrea, etc., 1886. The Archaeological Researches of M. Clermont-Ganneau (2 volumes, 1896) include his discoveries of Gezer and Adullam. Much information is scattered through the PEFQ, (1864-1910) and in ZDPV. G. Schumacher\'s Across the Jordan, 1885, Pella, 1888, and Northern \'Ajlun,1890,give detailed information for Northeast Palestine; and Lachish, by Professor Flinders Petrie, is the memoir of the excavations which he began at Tell el-Chesy (identified in 1874 by the present writer), the full account being in A Mound of Many Cities by F.J. Bliss, 1894. Other excavations, at Gath, etc., are described in Excavations in Palestine (1898-1900), by F.J. Bliss, R.A.S. Macalister, and Professor Wunsch; while the memoir of his excavations at Gezer (2 volumes) has recently been published by Professor Macalister. For those who have not access to these original sources, The Historical Geography of the Holy Land by Professor G.A. Smith,1894,and the essay (300 pp.) by Professor D.F. Buhl (Geographie des alten Palastina, 1896) will be found useful. The best guide book to Palestine is still that of Baedeker, written by Dr. A. Socin and published in 18765, 1912. This author had personal acquaintance with the principal routes of the country. Only standard works of reference have been herein mentioned, to which French, German, American, and British explorers and scholars have alike contributed.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`28';
isbe[6670]='Pallu, Palluites`pal\'-u, pal\'-u-its (pallu\', "distinguished"): A son of Reuben (<a onClick="return mV(\'Gen\',46,9);">Ge 46:9</a> ("Phallu"); <a onClick="return mV(\'Exd\',6,14);">Ex 6:14</a>; <a onClick="return mV(\'Num\',26,5,8);">Nu 26:5,8</a>; <a onClick="return mV(\'1Ch\',5,3);">1Ch 5:3</a>). Perhaps Peleth of <a onClick="return mV(\'Num\',16,1);">Nu 16:1</a> is the same. Palluites, the patronymic, occurs in <a onClick="return mV(\'Num\',26,5);">Nu 26:5</a>.``1';
isbe[6671]='Palm (of the Hand)`pam (kaph): The Hebrew word which is used in a variety of senses (see <a href="./study/isbe/search.html?string=HAND">HAND</a>; <a href="./study/isbe/search.html?string=PAW">PAW</a>) is usually translated "hand" in English Versions of the Bible, but the translation "palm" is found in 5 passages of the Old Testament, in 3 of which the Hebrew text adds the word yadh ("hand," <a onClick="return mV(\'1Sa\',5,4);">1Sa 5:4</a>; <a onClick="return mV(\'2Ki\',9,35);">2Ki 9:35</a>; <a onClick="return mV(\'Dan\',10,10);">Da 10:10</a>). It would properly mean the "hollow hand" (root kaphaph, "to bend," "to curve"), which receives or grasps things. It is therefore used in reference to filling the priest\'s hands with sacrificial portions (<a onClick="return mV(\'Lev\',14,15,26);">Le 14:15,26</a>). The palms of the hands of Dagon are mentioned as cut off, when the idol was found mutilated in the presence of the ark of Yahweh (<a onClick="return mV(\'1Sa\',5,4);">1Sa 5:4</a>), from which may be inferred that this idol probably was represented with hands spread out in blessing, as we find in numerous Babylonian representations of divinities.<P>In a beautiful metaphor God answers the repentant people of Jerusalem, who thought Yahweh had forgotten and forsaken them: "Behold, I have graven thee upon the palms of my hands" (<a onClick="return mV(\'Isa\',49,16);">Isa 49:16</a>; see also Ecclesiasticus 18:3). Daniel is touched upon the palms of his hands to wake him from sleep (<a onClick="return mV(\'Dan\',10,10);">Da 10:10</a>).<P>In the New Testament we find the phrase, "to smite with the palms of the hands," as a translation of the Greek verb rhapizo (<a onClick="return mV(\'Mat\',26,67);">Mt 26:67</a>; see also <a onClick="return mV(\'Mat\',5,39);">5:39</a> and Septuagint <a onClick="return mV(\'Hsa\',11,4);">Ho 11:4</a>; 1Esdras 4:30), and, derived from the same verb, rhapisma, a blow of the palm on the cheek, etc. (<a onClick="return mV(\'Mar\',14,65);">Mr 14:65</a>; <a onClick="return mV(\'Jhn\',18,22);">Joh 18:22</a>; <a onClick="return mV(\'Jhn\',19,3);">19:3</a>, where, however, in English Versions of the Bible the word "palm" has not been given). The marginal translation "to smite or strike with rods" (<a onClick="return mV(\'Mat\',26,67);">Mt 26:67</a>; <a onClick="return mV(\'Jhn\',18,22);">Joh 18:22</a>; <a onClick="return mV(\'Jhn\',19,3);">19:3</a>) and "strokes of rods" (<a onClick="return mV(\'Mar\',14,65);">Mr 14:65</a> margin) does not seem to be applicable to the Greek text of the Old Testament and New Testament, while it is a frequent meaning of the words in classical language. It would therefore be better to eliminate these marginal additions.``106';
isbe[6672]='Palm Tree`pam\'-tre (tamar, same as the Aramaic and Ethiopic, but in Arabic = "date"; phoinix (<a onClick="return mV(\'Exd\',15,27);">Ex 15:27</a>; <a onClick="return mV(\'Lev\',23,40);">Le 23:40</a>; <a onClick="return mV(\'Num\',33,9);">Nu 33:9</a>; <a onClick="return mV(\'Deu\',34,3);">De 34:3</a>; <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',3,13);">3:13</a>; <a onClick="return mV(\'2Ch\',28,15);">2Ch 28:15</a>; <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>; <a onClick="return mV(\'Psa\',92,12);">Ps 92:12</a>; <a onClick="return mV(\'Sgs\',7,7);">So 7:7</a>f; <a onClick="return mV(\'Joe\',1,12);">Joe 1:12</a>); tomer, Deborah "dwelt under the palm-tree" (<a onClick="return mV(\'Jdg\',4,5);">Jud 4:5</a>); "They are like a palm-tree (margin "pillar"), of turned work" (<a onClick="return mV(\'Jer\',10,5);">Jer 10:5</a>); timorah (only in the plural), the palm tree as an architectural feature (<a onClick="return mV(\'1Ki\',6,29,32,35);">1Ki 6:29,32,35</a>; <a onClick="return mV(\'1Ki\',7,36);">7:36</a>; <a onClick="return mV(\'2Ch\',3,5);">2Ch 3:5</a>; <a onClick="return mV(\'Eze\',40,16);">Eze 40:16</a>); Greek only Ecclesiasticus 50:12; <a onClick="return mV(\'Jhn\',12,13);">Joh 12:13</a>; <a onClick="return mV(\'Rev\',7,9);">Re 7:9</a>):<P>1. Palm Trees:<P>The palm, Phoenix dactylifera (Natural Order Palmeae), Arabic nakhl, is a tree which from the earliest times has been associated with the Semitic peoples. In Arabia the very existence of man depends largely upon its presence, and many authorities consider this to have been its original habitat. It is only natural that such a tree should have been sacred both there and in Assyria in the earliest ages. In Palestine the palm leaf appears as an ornament upon pottery as far back as 1800 BC (compare PEF, Gezer Mere., II, 172). In Egypt the tall palm stem forms a constant feature in early architecture, and among the Hebrews it was extensively used as a decoration of the temple (<a onClick="return mV(\'1Ki\',6,29,32,35);">1Ki 6:29,32,35</a>; <a onClick="return mV(\'1Ki\',7,36);">7:36</a>; <a onClick="return mV(\'2Ch\',3,5);">2Ch 3:5</a>). It is a symbol of beauty (<a onClick="return mV(\'Sgs\',7,7);">So 7:7</a>) and of the righteous man:<P class="in15">"The righteous shall flourish like the palm-tree:<br>He shall grow like a cedar in Lebanon.<br>They are planted in the house of Yahweh;<br>They shall flourish in the courts of our God.<br>They shall still bring forth fruit in old age;<br>They shall be full of sap and green"<br>(<a onClick="return mV(\'Psa\',92,\'12-14\');">Ps 92:12-14</a>).<P>The palm tree or branch is used extensively on Jewish coinage and most noticeably appears as a symbol of the land upon the celebrated Judea Capta coins of Vespasian. A couple of centuries or so later it forms a prominent architectural feature in the ornamentation of the Galilean synagogues, e.g. at Tell Chum (Capernaum). The method of artificial fertilization of the pistillate (female) flowers by means of the staminate (male) flowers appears to have been known in the earliest historic times. Winged figures are depicted on some of the early Assyrian sculptures shaking a bunch of the male flowers over the female for the same purpose as the people of modern Gaza ascend the tall trunks of the fruit-bearing palms and tie among the female flowers a bunch of the pollen-bearing male flowers.<P>2. Their Ancient Abundance in Palestine:<P>In Palestine today the palm is much neglected; there are few groves except along the coast, e.g. at the bay of Akka, Jaffa and Gaza; solitary palms occur all over the land in the courtyards of mosques (compare <a onClick="return mV(\'Psa\',92,13);">Ps 92:13</a>) and houses even in the mountains. Once palms flourished upon the Mount of Olives (<a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>), and Jericho was long known as the "city of palm-trees" (<a onClick="return mV(\'Deu\',34,3);">De 34:3</a>; <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',3,13);">3:13</a>; <a onClick="return mV(\'2Ch\',28,15);">2Ch 28:15</a>; Josephus BJ, IV, viii, 2-3), but today the only palms are scarce and small; under its name Hazazon-tamar (<a onClick="return mV(\'2Ch\',20,2);">2Ch 20:2</a>), En-gedi would appear to have been as much a place of palms in ancient days as we know it was in later history. A city, too, called Tamar ("date palm") appears to have been somewhere near the southwestern corner of the Dead Sea (<a onClick="return mV(\'Eze\',47,19);">Eze 47:19</a>; <a onClick="return mV(\'Eze\',48,28);">48:28</a>). Today the numerous salt-encrusted stumps of wild palm trees washed up all along the shores of the Dead Sea witness to the existence of these trees within recent times in some of the deep valleys around.<P>3. Palm Branches:<P>Branches of palms have been symbolically associated with several different ideas. A palm branch is used in <a onClick="return mV(\'Isa\',9,14);">Isa 9:14</a>; <a onClick="return mV(\'Isa\',19,15);">19:15</a> to signify he "head," the highest of the people, as contrasted with the rush, the "tail," or humblest of the people. Palm branches appear from early times to have been associated with rejoicing. On the first day of the Feast of Tabernacles the Hebrews were commanded to take branches of palms, with other trees, and rejoice before God (<a onClick="return mV(\'Lev\',23,40);">Le 23:40</a>; compare <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>; 2Macc 10:7). The palm branch still forms the chief feature of the lulabh carried daily by every pious Jew to the synagogue, during the feast. Later it was connected with the idea of triumph and victory. Simon Maccabeus entered the Akra at Jerusalem after its capture, "with thanksgiving, and branches of palm trees, and with harps, and cymbals, and with viols, and hymns, and songs: because there was destroyed a great enemy out of Israel" (1Macc 13:51 the King James Version; compare 2Macc 10:7). The same idea comes out in the use of palm branches by the multitudes who escorted Jesus to Jerusalem (<a onClick="return mV(\'Jhn\',12,13);">Joh 12:13</a>) and also in the vision of the "great multitude, which no man could number...standing before the...Lamb, arrayed in white robes, and palms in their hands" (<a onClick="return mV(\'Rev\',7,9);">Re 7:9</a>). Today palms are carried in every Moslem funeral procession and are laid on the new-made grave.`<a href="./study/isbe/search.html?string=TAMAR">TAMAR</a>`117';
isbe[6673]='Palmer-Worm`pam\'-er-wurm (gazam; Septuagint kampe (<a onClick="return mV(\'Amo\',4,9);">Am 4:9</a>; <a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a>; <a onClick="return mV(\'Joe\',2,25);">2:25</a>)): "Palmer-worm" means "caterpillar," but the insect meant is probably a kind of locust.`<a href="./study/isbe/search.html?string=INSECTS">INSECTS</a>; <a href="./study/isbe/search.html?string=LOCUST">LOCUST</a>`1';
isbe[6674]='Palsy; Paralysis`pol\'-zi, pa-ral\'-i-sis (paralusis): The English word "palsy" is derived from the Old French paralesie, which in Middle English was shortened into palesie, the form in which it appears in Wycliff\'s version. In the 16th century it appears as "palsy," the form used in the King James Version. This, however, is seldom used at the present day, the Latinized Greek form "paralysis" being more frequently employed, both in modern literature and in colloquial English "Sick of the palsy" is the translation either of the adjective paralutikos or of the participle of the verb paraluomai. The disease is one characterized by extreme loss of the power of motion dependent on some affection either of the motor centers of the brain or of the spinal cord. It is always serious, usually intractable, and generally sudden in onset (1Macc 9:55f). Miraculous cures by our Lord are related in general terms, as in <a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>; <a onClick="return mV(\'Act\',8,7);">Ac 8:7</a>. Aeneas (<a onClick="return mV(\'Act\',9,33);">Ac 9:33</a>) was probably a paralytic eight years bedridden. Though the Lord addressed the paralytic let down through the roof (<a onClick="return mV(\'Mat\',9,6);">Mt 9:6</a>; <a onClick="return mV(\'Mar\',2,3);">Mr 2:3</a>; <a onClick="return mV(\'Luk\',5,18);">Lu 5:18</a>) as "son," it was not necessarily a proof that he was young, and though He prefaces the cure by declaring the forgiveness of sin, we need not infer that the disease was the result of an evil life, although it may have been. Bennett conjectures that the centurion\'s palsied servant grievously tormented was suffering from progressive paralysis with respiratory spasms (see <a href="./study/isbe/search.html?string=PAIN">PAIN</a>). The substantive paralusis is only once used in the Septuagint in <a onClick="return mV(\'Eze\',21,10);">Eze 21:10</a>, but here it refers to the loosing of the sword, not to the disease.``107';
isbe[6675]='Palti`pal\'-ti (palti, "Yah delivers"):<P>(1) One of the "searchers" of Canaan sent by Moses (<a onClick="return mV(\'Num\',13,9);">Nu 13:9</a>), representing Benjamin in the expedition (<a onClick="return mV(\'Num\',13,9);">13:9</A>).<P>(2) The man to whom Saul gave Michal, David\'s wife, after the estrangement (<a onClick="return mV(\'1Sa\',25,44);">1Sa 25:44</a>). He is "the captain of the people" of 2Esdras 5:16 ("Phaltiel," margin "Psaltiel"). In <a onClick="return mV(\'2Sa\',3,15);">2Sa 3:15</a>, he is named "Phaltiel" (the King James Version), "Paltiel" (the Revised Version), and is there mentioned in connection with David\'s recovery of Michal.``1';
isbe[6676]='Paltiel`pal\'-ti-el (palti\'el, "God\'s deliverance"):<P>(1) A prince of Isaachar (<a onClick="return mV(\'Num\',34,26);">Nu 34:26</a>).<P>(2) Same as <a href="./study/isbe/search.html?string=PALTI,+(2)">PALTI, (2)</a> (which see).``1';
isbe[6677]='Paltite`pal\'-tit (palti (as Palti); The Septuagint has: Codex Vaticanus Kelothei; Codex Alexandrinus Phellonei): The description occurs but once in this form and is then applied to Helez, one of David\';s 30 valiant men (<a onClick="return mV(\'2Sa\',23,26);">2Sa 23:26</a>). Helez\' name, however, occurs in <a onClick="return mV(\'1Ch\',11,27);">1Ch 11:27</a> and <a onClick="return mV(\'1Ch\',27,10);">27:10</a> as the "Pelonite." Doubtless there is some confusion of words. The word may be given as a patronymic of Palti, or it may designate a native of the village of Beth-pelet mentioned in <a onClick="return mV(\'Jos\',15,27);">Jos 15:27</a> and <a onClick="return mV(\'Neh\',11,26);">Ne 11:26</a> as being in Lower Judah. Helez, however, is described as "of the children of Ephraim" in <a onClick="return mV(\'1Ch\',27,10);">1Ch 27:10</a>.``1';
isbe[6678]='Pamphylia`pam-fil\'-i-a (Pamphulia): A country lying along the southern coast of Asia Minor, bounded on the north by Pisidia, on the east by Isauria, on the south by the Mediterranean Sea, and on the west by Lycia (<a onClick="return mV(\'Act\',2,10);">Ac 2:10</a>; <a onClick="return mV(\'Act\',27,5);">27:5</a>).<P>1. Physical Features:<P>In the earliest time, Pamphylia was but a narrow strip of low-lying land between the base of the mountains and the sea, scarcely more than 20 miles long and half as wide. A high and imposing range of the Taurus Mountains practically surrounds it upon three sides, and, jutting out into the sea, isolates it from the rest of Asia Minor. Its two rivers, the Cestrus and the Cataractes, are said by ancient writers to have been navigable for several miles inland, but now the greater part of their water is diverted to the fields for irrigating purposes, and the general surface of the country has been constantly changed by the many rapid mountain streams. The level fertile coast land is therefore well watered, and the moist air, which is excessively hot and enervating, has always been laden with fever. Several roads leading from the coast up the steep mountain to the interior existed in ancient times; one of them, called the Kimax or the Ladder, with its broad stair-like steps 2,000 ft. high, may still be seen. Beyond the steps is the high land which was once called "Pisidia," but which the Romans, in 70 AD, made a part of Pamphylia.<P>2. Importance:<P>Pamphylia, unless in pre-historic times, was never an independent kingdom; it was subject successively to Lydia, Persia, Macedonia, Pergamos and Rome. Because of its comparatively isolated position, civilization there was less developed than in the neighboring countries, and the Asiatic influence was at most times stronger than the Greek As early as the 5th century BC a Greek colony settled there, but the Greek language which was spoken in some of its cities soon became corrupt; the Greek inscriptions, appearing upon the coins of that age, were written in a peculiar character, and before the time of Alexander the Great, Greek ceased to be spoken. Perga then became an important city and the center of the Asiatic religion, of which the Artemis of Perga, locally known as Leto, was the goddess. Coins were struck also in that city. Somewhat later the Greek city of Attalia, which was rounded by Attalus III Philadelphus (159-138 BC), rose to importance, and until recent years has been the chief port of entry on the southern coast of Asia Minor. About the beginning of our era, Side became the chief city, and issued a long and beautiful series of coins, possibly to facilitate trade with the pirates who found there a favorable market for their booty. Pamphylia is mentioned as one of the recipients of the "letters" of 1Macc 15:23.<P>3. Introduction of Christianity:<P>Christianity was first introduced to Pamphylia by Paul and Barnabas (<a onClick="return mV(\'Act\',13,13);">Ac 13:13</a>; <a onClick="return mV(\'Act\',14,24);">14:24</a>), but because their stay in the country was brief, or because of the difficulty of communication with the neighboring countries, or because of the Asiatic character of the population, it was slow in being established.`<a href="./study/isbe/search.html?string=ATTALIA">ATTALIA</a>; <a href="./study/isbe/search.html?string=PERGA">PERGA</a>; <a href="./study/isbe/search.html?string=SIDE">SIDE</a>`7';
isbe[6679]='Pan`Name of a utensil used in the preparation or the serving of food, and representing several words in the original. Passing over the use of the word in connections like <a onClick="return mV(\'1Ch\',9,31);">1Ch 9:31</a>, "things baked in pans," where the Hebrew word chabhittim refers, not to the pan itself, but to the cakes baked in the flat pan or griddle which was called machabhath (see below), and the "firepans" (machtah) (<a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a>; <a onClick="return mV(\'1Ki\',7,50);">1Ki 7:50</a>, etc.) which seem to have been used to carry burning coals, we note the following words:<P>(1) machabhath, "pan" the King James Version, "baking-pan" the Revised Version (British and American), a dish of uncertain shape and size which was used in the preparation of the minchah or vegetable offering. See <a onClick="return mV(\'Lev\',2,5);">Le 2:5</a>; <a onClick="return mV(\'Lev\',6,21);">6:21</a>; <a onClick="return mV(\'Lev\',7,9);">7:9</a>; <a onClick="return mV(\'1Ch\',23,29);">1Ch 23:29</a>. On the basis of <a onClick="return mV(\'Eze\',4,3);">Eze 4:3</a> it might be assumed that the pan was rectangular in shape and of good size.<P>(2) kiyyor, rendered "pan" in <a onClick="return mV(\'1Sa\',2,14);">1Sa 2:14</a>. The same word is used in the phrase, "pan of fire" the Revised Version (British and American), "hearth of fire" the King James Version (<a onClick="return mV(\'Zec\',12,6);">Zec 12:6</a>); and it is also translated "laver" in the descriptions of the furnishing of tabernacle and temple (<a onClick="return mV(\'Exd\',30,18);">Ex 30:18</a>; <a onClick="return mV(\'1Ki\',7,30);">1Ki 7:30</a>, etc.). As it held water and was used for boiling meat and the like, it must have been a kind of pot or kettle.<P>(3) masreth, (<a onClick="return mV(\'2Sa\',15,9);">2Sa 15:9</a>). The connection gives no clue as to shape or size except that it must have been small enough to serve food in, and of the proper shape to hold a substance which could be poured out. Some authorities suggest a connection with the root se\'or, "leaven," and think that this pan was like the kneading-trough in shape.<P>(4) sir, rendered "pan" in <a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a> the King James Version, "pot" the Revised Version (British and American).<P>See <a href="./study/isbe/search.html?string=POT">POT</A>.<P>(5) parur, "pan" in <a onClick="return mV(\'Num\',11,8);">Nu 11:8</a> the King James Version, "pot" the Revised Version (British and American).<P>See <a href="./study/isbe/search.html?string=POT">POT</A>.<P>(6) celachah (<a onClick="return mV(\'2Ch\',35,13);">2Ch 35:13</a>). Some kind of dish or pot. Slightly different forms of the same root are rendered "cruse" (<a onClick="return mV(\'2Ki\',2,20);">2Ki 2:20</a> (tselochith), "dish" (<a onClick="return mV(\'2Ki\',21,13);">2Ki 21:13</a> (tsallachath); and also in the Revised Version (British and American) in <a onClick="return mV(\'Pro\',19,24);">Pr 19:24</a>; <a onClick="return mV(\'Pro\',26,15);">26:15</a>, instead of the probably incorrect "bosom" of the King James Version.<P>(7) lebes translated "pan" in 1Esdras 1:12 the King James Version (the Revised Version (British and American) "cauldron").<P>(8) teganon, 2Macc 7:3,5, with the verb teganizo, 7:5, is the usual Greek word for "frying-pan," but here a large sheet of metal must be meant (compare 4 Macc 8:13; 12:10,20).<P>LITERATURE.<P>Whitehouse, Primer of Hebrew Antiquities,76,77; Benzinger, Hebraische Archaologie,70,71; Nowack, Hebraische Archdologie, I, 144.``13';
isbe[6680]='Pannag`pan\'-ag (pannagh; kasia; <a onClick="return mV(\'Eze\',27,17);">Eze 27:17</a> margin, "Perhaps a kind of confection"): One of the articles of commerce of Judah and Israel. The kasia of the Septuagint is said to be a shrub similar to the laurel. Nothing is known of the nature of pannag. Cheyne (EB, 3555) thinks the Heb letters have got misplaced and should be gephen, "vine," and he would join to it the debhash, "honey," which follows in the verse, giving a translation "grape honey," the ordinary dibbs of Palestine—an extremely likely article of commerce.`<a href="./study/isbe/search.html?string=HONEY">HONEY</a>`1';
isbe[6681]='Panoply`pan\'-o-pli: 1Macc 13:29 the Revised Version margin.`<a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>`1';
isbe[6682]='Pap`(shadh, shodh, "breast" (<a onClick="return mV(\'Eze\',23,21);">Eze 23:21</a>); mastos, "the breast" (<a onClick="return mV(\'Luk\',11,27);">Lu 11:27</a>; <a onClick="return mV(\'Luk\',23,29);">23:29</a>; <a onClick="return mV(\'Rev\',1,13);">Re 1:13</a>)): The English word, which goes back to Middle English "pappe" (see Skeat, Concise Etymological Dictionary of the English Language, 327) and is now obsolete, has been replaced in the Revised Version (British and American) by "breast." The Hebrew word signifies the "female breast"; the Greek word has a wider signification, including the male chest.``1';
isbe[6683]='Paper`pa\'-per.`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>; <a href="./study/isbe/search.html?string=PAPYRUS">PAPYRUS</a>; <a href="./study/isbe/search.html?string=REED">REED</a>; <a href="./study/isbe/search.html?string=WRITING">WRITING</a>`1';
isbe[6684]='Paper Reeds`redz: In <a onClick="return mV(\'Isa\',19,7);">Isa 19:7</a> the King James Version (the Revised Version (British and American) "meadows").``1';
isbe[6685]='Paphos`pa\'-fos:<P>1. Site:<P>The name of two towns, Old (Palaia Paphos, or Palaipaphos) and New Paphos Nea Paphos), situated at the southwestern extremity of Cyprus. Considerable confusion is caused by the use of the single name Paphos in ancient writers to denote now one, now the other, of these cities. That referred to in <a onClick="return mV(\'Act\',13,6,13);">Ac 13:6,13</a> is strictly called New Paphos (modern Baffa), and lay on the coast about a mile south of the modern Ktima and some 10 miles northwest of the old city. The latter (modern Kouklia) is situated on an eminence more than a mile from the sea, on the left bank of the Diarrizo, probably the ancient Bocarus.<P>2. History of Old Paphos:<P>It was founded by Cinyras, the father of Adonis, or, according to another legend, by Aerias, and formed the capital of the most important kingdom in Cyprus except that of Salamis. Its territory embraced a considerable portion of Western Cyprus, extending northward to that of Soli, southward to that of Curium and eastward to the range of Troodus. Among its last kings was Nicocles, who ruled shortly after the death of Alexander the Great. In 310 BC Nicocreon of Salamis, who had been set over the whole of Cyprus by Ptolemy I of Egypt, was forced to put an end to his life at Paphos for plotting with Antigonus (Diodorus xx. 21, who wrongly gives the name as Nicocles; see Athenische Mitteilungen, XXII, 203ff), and from that time Paphos remained under Egyptian rule until the Roman annexation of Cyprus in 58 BC. The growth of New Paphos brought with it the decline of the old city, which was also ruined by successive earthquakes. Yet its temple still retained much of its old fame, and in 69 AD Titus, the future emperor of Rome, turned aside on his journey to Jerusalem, which he was to capture in the following year, to visit the sacred shrine and to inquire of the priests into the fortune which awaited him (Tacitus History ii.2-4; Suetonius Titus 5).<P>3. History of New Paphos:<P>New Paphos, originally the seaport of the old town, was founded, according to tradition, by Agapenor of Arcadia (Iliad ii.609; Pausan. viii.5, 2). Its possession of a good harbor secured its prosperity, and it had several rich temples. According to Dio Cassius (liv.23) it was restored by Augustus in 15 BC after a destructive earthquake and received the name Augusta (Greek Sebaste). Under the Roman Empire it was the administrative capital of the island and the seat of the governor. The extant remains all date from this period and include those of public buildings, private houses, city walls and the moles of the harbor.<P>4. The Temple and Cult:<P>But the chief glory of Paphos and the source of its fame was the local cult, of which the kings and their descendants remained hereditary priests down to the Roman seizure of Cyprus. The goddess, identified with the Greek Aphrodite, who was said to have risen from the sea at Paphos, was in reality a Nature-goddess, closely resembling the Babylonian Ishtar and the Phoenician Astarte, a native deity of Asia Minor and the Aegean Islands. Her cult can be traced back at Paphos to Homeric times (Odyssey viii.362) and was repeatedly celebrated by Greek and Latin poets (Aeschylus Suppl. 555; Aristoph. Lys. 833; Virgil Aen. i.415; Horace Odes i.19 and 30; iii.26; Statius Silvae i.2,101,etc.). The goddess was represented, not by a statue in human form, but by a white conical stone (Max. Tyr. viii.8; Tacitus History ii.3; Servius Ad Aen. i.724), of which models were on sale for the benefit of pilgrims (Athenaeus xv.18); her worship was sensuous in character and she is referred to by Athanasius as the deification of lust (Contra Genres 9). Excavation has brought to light at Old Paphos a complex of buildings belonging to Roman times and consisting of an open court with chambers or colonnades on three sides and an entrance on the east only, the whole forming a quadrilateral enclosure with sides about 210 ft. long. In this court may have stood the altar, or altars, of incense (Homer speaks of a single altar, Virgil of "a hundred altars warm with Sabean frankincense"); no blood might be shed thereon, and although it stood in the open it was "wet by no rain" (Tacitus, loc. cit.; Pliny, NH, ii.210). On the south side are the ruins of another building, possibly an earlier temple, now almost destroyed save for the western wall (Journal of Hellenic Studies, IX, 193-224). But the fact that no remains or inscriptions have been found here earlier than the Roman occupation of Cyprus militates against the view that the sanctuary stood at this spot from prehistoric times. Its site may be sought at Xylino, a short distance to the north of Kouklia (D.G. Hogarth, Times, August 5, 1910), or possibly on the plateau of Rhantidi, some 3 miles southeast of the village, where numerous inscriptions in the old Cyprian syllabic script were found in the summer of 1910 (M. Ohnefalsch-Richter, Times, July 29, 1910).<P>5. The Apostles\' Visit:<P>After visiting Salamis and passing through the whole island, about 100 miles in length, Barnabas, Paul and Mark reached Paphos, the residence of the Roman proconsul, Sergius Paulus (for the title see <a href="./study/isbe/search.html?string=CYPRUS">CYPRUS</a>). Here too they would doubtless begin by preaching in the synagogue, but the governor—who is probably the same Paulus whose name appears as proconsul in an inscription of Soli (D.G. Hogarth, Devia Cypria, 114)—hearing of their mission, sent for them and questioned them on the subject of their preaching. A Jew named Bar-Jesus or Elymas, who, as a Magian or soothsayer, "was with the proconsul," presumably as a member of his suite, used all his powers of persuasion to prevent his patron from giving his adherence to the new faith, and was met by Paul (it is at this point that the name is first introduced) with a scathing denunciation and a sentence of temporary loss of sight. The blindness which at once fell on him produced a deep impression on the mind of the proconsul, who professed his faith in the apostolic teaching. From Paphos, Paul and his companions sailed in a northwesterly direction to Perga in Pamphylia (<a onClick="return mV(\'Act\',13,\'6-13\');">Ac 13:6-13</a>).<P>Paul did not revisit Paphos, but we may feel confident that Barnabas and Mark would return there on their 2nd missionary journey (<a onClick="return mV(\'Act\',15,39);">Ac 15:39</a>). Of the later history of the Paphian church we know little. Tychicus, Paul\'s companion, is said to have been marryred there, and Jerome tells us that Hilarion sought in the neighborhood of the decayed and almost deserted town the quiet and retirement which he craved (Vita Hilar. 42). The Acta Barnabae speak of a certain Rhodon, who was attached to the temple service at Old Paphos, as having accepted the Christian faith.<P>LITERATURE.<P>Besides the works already referred to, see Journal of Hellenic Studies, IX, 175-92 (citation of passages from ancient authors relating to Old Paphos, together with a list of medieval and modern authorities), 225-271 (inscriptions and tombs), and the bibliography appended to article <a href="./study/isbe/search.html?string=CYPRUS">CYPRUS</a>.``176';
