r-shaped Sea of Galilee, and the Dead Sea. These changes all occurred long ages before the appearance of man. The beds upheaved include: (1) the Nubian Sandstone (of the Greensand period), which was sheared along the line of the Jordan fault east of the river, and which only appears on the western slopes of Hermon, Gilead, and Moab; (2) the limestones of the Cretaceous age, including the hard dolomite, and softer beds full of characteristic fossils; (3) the soft Eocene limestone, which appears chiefly on the western spurs and in the foothills, the angle of upheaval being less steep than that of the older main formation. On the shores of the Mediterranean a yet later sandy limestone forms the low cliffs of Sharon.<P>See <a href="./study/isbe/search.html?string=GEOLOGY+OF+PALESTINE">GEOLOGY OF PALESTINE</a>.<P>4. Fauna and Flora:<P>As regards fauna, flora and cultivation, it is sufficient here to say that they are still practically the same as described throughout the Bible. The lion and the wild bull (Bos primigenius) were exterminated within historic times, but have left their bones in the Jordan gravels, and in caves. The bear has gradually retreated to Hermon and Lebanon. The buffalo has been introduced since the Moslem conquest. Among trees the apple has fallen out of cultivation since the Middle Ages, and the cactus has been introduced; but Palestine is still a land of grain, wine and oil, and famous for its fruits. Its trees, shrubs and plants are those noticed in the Bible. Its woods have been thinned in Lower Galilee and Northern Sharon, but on the other hand the copse has often grown over the site of former vineyards and villages, and there is no reason to think that any general desiccation has occurred within the last 40 centuries, such as would affect the rainfall.<P>5. Climate:<P>The climate of Palestine is similar to that of other Mediterranean lands, such as Cyprus, Sicily or Southern Italy; and, in spite of the fevers of mosquito districts in the plains, it is much better than that of the Delta in Egypt, or of Mesopotamia. The summer heat is oppressive only for a few days at a time, when (espescially in May) the dry wind—deficient in ozone—blows from the eastern desert. For most of the season a moisture-laden sea breeze, rising about 10 AM, blows till the evening, and fertilizes all the western slopes of the mountains. In the bare deserts the difference between 90ø F. by day and 40ø F. by night gives a refreshing cold. With the east wind the temperature rises to 105ø F., and the nights are oppressive. In the Jordan valley, in autumn, the shade temperature reaches 120ø F. In this season mists cover the mountains and swell the grapes. In winter the snow sometimes lies for several days on the watershed ridge and on the Edomite mountains, but in summer even Hermon is sometimes quite snowless at 9,000 ft. above the sea. There is perhaps no country in which such a range of climate can be found, from the Alpine to the tropical, and none in which the range of fauna and flora is consequently so large, from the European to the African.<P>6. Rainfall:<P>The rainfall of Palestine is between 20 and 30 inches annually, and the rainy season is the same as in other Mediterranean countries. The "former rains" begin with the thunderstorms of November, and the "latter rains" cease with April showers. From December to February—except in years of drought—the rains are heavy. In most years the supply is quite sufficient for purposes of cultivation. The plowing begins in autumn, and the corn is rarely spoiled by storms in summer. The fruits ripen in autumn and suffer only from the occasional appearance of locust swarms. There appears to be no reason to suppose that climate or rainfall have undergone any change since the times of the Bible; and a consideration of Bible allusions confirms this view.<P>7. Drought and Famine:<P>Thus, the occurrence of drought, and of consequent famine, is mentioned in the Old Testament as occasional in all times (<a onClick="return mV(\'Gen\',12,10);">Ge 12:10</a>; <a onClick="return mV(\'Gen\',26,2);">26:2</a>; <a onClick="return mV(\'Gen\',41,50);">41:50</a>; <a onClick="return mV(\'Lev\',26,20);">Le 26:20</a>; <a onClick="return mV(\'2Sa\',21,1);">2Sa 21:1</a>; <a onClick="return mV(\'1Ki\',8,35);">1Ki 8:35</a>; <a onClick="return mV(\'Isa\',5,6);">Isa 5:6</a>; <a onClick="return mV(\'Jer\',14,1);">Jer 14:1</a>; <a onClick="return mV(\'Joe\',1,\'10-12\');">Joe 1:10-12</a>; <a onClick="return mV(\'Hag\',1,11);">Hag 1:11</a>; <a onClick="return mV(\'Zec\',14,17);">Zec 14:17</a>), and droughts are also noticed in the Mishna (Ta\'anith, i. 4-7) as occurring in autumn, and even lasting throughout the rainy season till spring. Good rains were a blessing from God, and drought was a sign of His displeasure, in Hebrew belief (<a onClick="return mV(\'Deu\',11,14);">De 11:14</a>; <a onClick="return mV(\'Jer\',5,24);">Jer 5:24</a>; <a onClick="return mV(\'Joe\',2,23);">Joe 2:23</a>). A thunderstorm in harvest time (May) was most unusual (<a onClick="return mV(\'1Sa\',12,17,18);">1Sa 12:17,18</a>), yet such a storm does still occur as a very exceptional phenomenon. By "snow in harvest" (<a onClick="return mV(\'Pro\',25,13);">Pr 25:13</a>) we are not to understand a snowstorm, for it is likened to a "faithful messenger," and the reference is to the use of snow for cooling wine, which is still usual at Damascus. The notice of fever on the shores of the Sea of Galilee (<a onClick="return mV(\'Mat\',8,14);">Mt 8:14</a>) shows that this region was as unhealthy as it still is in summer. The decay of irrigation in Sharon may have rendered the plain more malarious than of old, but the identity of the Palestinian flora with that of the Bible indicates that the climate, generally speaking, is unchanged.<P>II. Palestine in the Pentateuch.<P>1. Places Visited by Abraham:<P>The Book of Genesis is full of allusions to sites sacred to the memory of the Hebrew patriarchs. In the time of Abraham the population consisted of tribes, mainly Semitic, who came originally from Babylonia, including Canaanites ("lowlanders") between Sidon and Gaza, and in the Jordan valley, and Amorites ("highlanders") in the mountains (<a onClick="return mV(\'Gen\',10,\'15-19\');">Ge 10:15-19</a>; <a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>). Their language was akin to Hebrew, and it is only in Egypt that we read of an interpreter being needed (<a onClick="return mV(\'Gen\',42,23);">Ge 42:23</a>), while excavated remains of seal-cylinders, and other objects, show that the civilization of Palestine was similar to that of Babylonia.<P>(1) Shechem.<P>The first place noticed is the shrine or "station" (maqom) of Shechem, with the Elon Moreh, the Septuagint "high oak"), where Jacob afterward buried the idols of his wives, and where Joshua set up a stone by the "holy place" (<a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; <a onClick="return mV(\'Gen\',35,4);">35:4</a>; <a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>). Samaritan tradition showed the site near Balata ("the oak") at the foot of Mt. Gerizim. The "Canaanite was then in the land" (in Abraham\'s time), but was exterminated (<a onClick="return mV(\'Gen\',34,25);">Ge 34:25</a>) by Jacob\'s sons. From Shechem Abraham journeyed southward and raised an altar between Bethel (Beitin) and Hal (Chayan), east of the town of Luz, the name of which still survives hard-by at the spring of Lozeh (<a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>; <a onClick="return mV(\'Gen\',13,3);">13:3</a>; <a onClick="return mV(\'Gen\',28,11,19);">28:11,19</a>; <a onClick="return mV(\'Gen\',35,2);">35:2</a>).<P>(2) The Negeb.<P>But, on his return from Egypt with large flocks (<a onClick="return mV(\'Gen\',12,16);">Ge 12:16</a>), he settled in the pastoral region, between Beersheba and the western Kadesh (<a onClick="return mV(\'Gen\',13,1);">Ge 13:1</a>; <a onClick="return mV(\'Gen\',20,1);">20:1</a>), called in Hebrew the neghebh, "dry" country, on the edge of the cultivated lands. From east of Bethel there is a fine view of the lower Jordan valley, and here Lot "lifted up his eyes" (<a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a>), and chose the rich grass lands of that valley for his flocks. The "cities of the Plain" (kikkar) were clearly in this valley, and Sodom must have been near the river, since Lot\'s journey to Zoar (<a onClick="return mV(\'Gen\',19,22);">Ge 19:22</a>) occupied only an hour or two (<a onClick="return mV(\'Gen\',19,15,23);">Ge 19:15,23</a>) through the plain to the foot of the Moab mountains. These cities are not said to have been visible from near Hebron; but, from the hilltop east of the city, Abraham could have seen "the smoke of the land" (<a onClick="return mV(\'Gen\',19,28);">Ge 19:28</a>) rising up. The first land owned by him was the garden of Mamre (<a onClick="return mV(\'Gen\',13,18);">Ge 13:18</a>; <a onClick="return mV(\'Gen\',18,1);">18:1</a>; <a onClick="return mV(\'Gen\',23,19);">23:19</a>), with the cave-tomb which tradition still points out under the floor of the Hebron mosque. His tent was spread under the "oaks of Mamre" (<a onClick="return mV(\'Gen\',18,1);">Ge 18:1</a>), where his mysterious guests rested "under the tree" (<a onClick="return mV(\'Gen\',18,8);">Ge 18:8</a>). One aged oak still survives in the flat ground west of the city, but this tree is very uncommon in the mountains of Judah. In all these incidental touches we have evidence of the exact knowledge of Palestine which distinguishes the story of the patriarchs.<P>(3) Campaign of Amraphel.<P>Palestine appears to have been an outlying province of the empire of. Hammurabi, king of Babylon in Abraham\'s time; and the campaign of Amraphel resembled those of later Assyrian overlords exacting tribute of petty kings. The route (<a onClick="return mV(\'Gen\',14,\'5-8\');">Ge 14:5-8</a>) lay through Bashan, Gilead and Moab to Kadesh (probably at Petra), and the return through the desert of Judah to the plains of Jericho. Thus Hebron was not attacked (see <a onClick="return mV(\'Gen\',14,13);">Ge 14:13</a>), and the pursuit by Abraham and his Amorite allies led up the Jordan valley to Dan, and thence north of Damascus (<a onClick="return mV(\'Gen\',14,15);">Ge 14:15</a>). The Salem whose king blessed Abraham on his return was thought by the Samaritans, and by Jerome, to be the city near the Jordan valley afterward visited by Jacob (<a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>; <a onClick="return mV(\'Gen\',33,18);">33:18</a>).<P>See <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>.<P>(4) Gerar.<P>Abraham returned to the southern plains, and "sojourned in Gerar" (<a onClick="return mV(\'Gen\',20,1);">Ge 20:1</a>), now Umm Jerrar, 7 miles south of Gaza. The wells which he dug in this valley (<a onClick="return mV(\'Gen\',26,15);">Ge 26:15</a>) were no doubt shallow excavations like those from which the Arabs still obtain the water flowing under the surface in the same vicinity (SWP, III, 390), though that at Beersheba (<a onClick="return mV(\'Gen\',21,\'25-32\');">Ge 21:25-32</a>), to which Isaac added another (<a onClick="return mV(\'Gen\',26,\'23-25\');">Ge 26:23-25</a>), may have been more permanent. Three masonry wells now exist at Bir es Seba\', but the masonry is modern. The planting of a "tamarisk" at this place (<a onClick="return mV(\'Gen\',21,33);">Ge 21:33</a>) is an interesting touch, since the tree is distinctive of the dry lowlands. From Beersheba Abraham journeyed to "the land of Moriah" Septuagint "the high land") to sacrifice Isaac (<a onClick="return mV(\'Gen\',22,2);">Ge 22:2</a>); and the mountain, according to Hebrew tradition (<a onClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a>), was at Jerusalem, but according to the Samaritans was Gerizim near the Elon Moreh—a summit which could certainly have been seen "afar off" (<a onClick="return mV(\'2Ch\',3,4);">2Ch 3:4</a>) on "the third day."<P>2. Places Visited by Isaac:<P>Isaac, living in the same pastoral wilderness, at the western Kadesh (<a onClick="return mV(\'Gen\',25,11);">Ge 25:11</a>) and at Gerar (<a onClick="return mV(\'Gen\',26,2);">Ge 26:2</a>), suffered like his father in a year of drought, and had similar difficulties with the Philistines. At Gerar he sowed grain (<a onClick="return mV(\'Gen\',26,12);">Ge 26:12</a>), and the vicinity is still capable of such cultivation. Thence he retreated southeast to Rehoboth (Rucheibeh), north of Kadesh, where ancient wells like those at Beersheba still exist (<a onClick="return mV(\'Gen\',26,22);">Ge 26:22</a>). To Beersheba he finally returned (<a onClick="return mV(\'Gen\',26,23);">Ge 26:23</a>).<P>3. Places Visited by Jacob:<P>When Jacob fled to Haran from Beersheba (<a onClick="return mV(\'Gen\',28,10);">Ge 28:10</a>) he slept at the "place" (or shrine) consecrated by Abraham\'s altar near Bethel, and like any modern Arab visitor to a shrine—erected a memorial stone (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>), which he renewed twenty years later (<a onClick="return mV(\'Gen\',35,14);">Ge 35:14</a>) when God appeared to him "again" (<a onClick="return mV(\'Gen\',35,9);">Ge 35:9</a>).<P>(1) Haran to Succoth.<P>His return journey from Haran to Gilead raises an interesting question. The distance is about 350 miles from Haran to the Galeed or "witness heap" (<a onClick="return mV(\'Gen\',31,48);">Ge 31:48</a>) at Mizpah—probably Suf in North Gilead. This distance Laban is said to have covered in 7 days (<a onClick="return mV(\'Gen\',31,23);">Ge 31:23</a>), which would be possible for a force mounted on riding camels. But the news of Jacob\'s flight reached Laban on the 3rd day (<a onClick="return mV(\'Gen\',31,22);">Ge 31:22</a>), and some time would elapse before he could gather his "brethren." Jacob with his flocks and herds must have needed 3 weeks for the journey. It is remarkable that the vicinity of Mizpah still presents ancient monuments like the "pillar" (<a onClick="return mV(\'Gen\',31,45);">Ge 31:45</a>) round which the "memorial cairn" (yeghar-sahadhutha) was formed. From this place Jacob journeyed to Mahanaim (probably Machmah), south of the Jabbok river—a place which afterward became the capital of South Gilead (<a onClick="return mV(\'Gen\',32,1);">Ge 32:1</a>f; <a onClick="return mV(\'1Ki\',4,14);">1Ki 4:14</a>); but, on hearing of the advance of Esau from Edom, he retreated across the river (<a onClick="return mV(\'Gen\',32,22);">Ge 32:22</a>) and then reached Succoth (<a onClick="return mV(\'Gen\',33,17);">Ge 33:17</a>), believed to be Tell Der\'ala, north of the stream.<P>(2) From the Jordan to Hebron.<P>Crossing the Jordan by one of several fords in this vicinity, Jacob approached Shechem by the perennial stream of Wady Far\'ah, and camped at Shalem (Salim) on the east side of the fertile plain which stretches thence to Shechem, and here he bought land of the Hivites (<a onClick="return mV(\'Gen\',33,\'18-20\');">Ge 33:18-20</a>). We are not told that he dug a well, but the necessity for digging one in a region full of springs can only be explained by Hivite jealousy of water rights, and the well still exists east of Shechem (compare <a onClick="return mV(\'Jhn\',4,5);">Joh 4:5</a>f), not far from the Elon Moreh where were buried the teraphim (<a onClick="return mV(\'Gen\',35,4);">Ge 35:4</a>) or "spirits" (Assyrian, tarpu) from Haran (<a onClick="return mV(\'Gen\',31,30);">Ge 31:30</a>) under the oak of Abraham. These no doubt were small images, such as are so often unearthed in Palestine. The further progress of Jacob led by Bethel and Bethlehem to Hebron (<a onClick="return mV(\'Gen\',35,6,19,27);">Ge 35:6,19,27</a>), but some of his elder sons seem to have remained at Shechem. Thus, Joseph was sent later from Hebron (<a onClick="return mV(\'Gen\',37,14);">Ge 37:14</a>) to visit his brethren there, but found them at Dothan.<P>(3) Dothan.<P>Dothan (<a onClick="return mV(\'Gen\',37,17);">Ge 37:17</a>) lay in a plain on the main trade route from Egypt to Damascus, which crossed the low watershed at this point and led down the valley to Jezreel and over Jordan to Bashan. The "well of the pit" (SWP, II, 169) is still shown at Tell Dothan, and the Ishmaelites, from Midian and Gilead, chose this easy caravan route (<a onClick="return mV(\'Gen\',37,25,28);">Ge 37:25,28</a>) for camels laden with the Gilead balm and spices. The plain was fitted for feeding Jacob\'s flocks. The products of Palestine then included also honey, pistachio nuts, and almonds (<a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>); and a few centuries later we find notice in a text of Thothmes III of honey and balsam, with oil, wine, wheat, spelt, barley and fruits, as rations of the Egyptian troops in Canaan (Brugsch, Hist Egypt, I, 332).<P>4. Mentioned in Connection with Judah:<P>The episode of Judah and Tamar is connected with a region in the Shephelah, or low hills of Judea. Adullam (\'Aid-el-ma), Chezib (\'Ain Kezbeh), and Timnath (Tibneh) are not far apart (<a onClick="return mV(\'Gen\',38,1,5,12);">Ge 38:1,5,12</a>), the latter being in a pastoral valley where Judah met his "sheep shearers." Tamar sat at "the entrance of Enaim" (compare <a onClick="return mV(\'Gen\',38,14,22);">Ge 38:14,22</a> the English Revised Version) or Enam (<a onClick="return mV(\'Jos\',15,34);">Jos 15:34</a>), perhaps at Kefr \'Ana, 6 miles northwest of Timnath. She was mistaken for a qedheshah, or votary (sacred prostitute) of Ashtoreth (<a onClick="return mV(\'Gen\',38,15,21);">Ge 38:15,21</a>), and we know from Hammurabi\'s laws that such votaries were already recognized. The mention of Judah\'s signet and staff (<a onClick="return mV(\'Gen\',38,18);">Ge 38:18</a>) also reminds us of Babylonian customs as described by Herodotus (i.195), and signet-cylinders of Babylonian style, and of early date, have been unearthed in Palestine at Gezer and elsewhere (compare the "Babylonian garment," <a onClick="return mV(\'Jos\',7,21);">Jos 7:21</a>).<P>5. Review of the Geography of Genesis:<P>Generally speaking, the geography of Genesis presents no difficulties, and shows an intimate knowledge of the country, while the allusions to natural products and to customs are in accord with the results of scientific discovery. Only one difficulty needs notice, where Atad (<a onClick="return mV(\'Gen\',50,10);">Ge 50:10</a>) on the way from Egypt to Hebron is described as "beyond the Jordan." In this case the Assyrian language perhaps helps us, for in that tongue Yaur-danu means "the great river," and the reference may be to the Nile itself, which is called Yaur in Hebrew (ye\'or) and Assyrian alike.<P>6. Exodus and Leviticus:<P>Exodus is concerned with Egypt and the Sinaitic desert, though it may be observed that its simple agricultural laws (<a onClick="return mV(\'Exd\',21,\'1-\');">Exodus 21-23</a>), which so often recall those of Hammurabi, would have been needed at once on the conquest of Gilead and Bashan, before crossing the Jordan. In <a onClick="return mV(\'Lev\',11,\'1-\');">Leviticus 11</a> we have a list of animals most of which belong to the desert—as for instance the "coney" or hyrax (<a onClick="return mV(\'Lev\',11,5);">Le 11:5</a>; <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>; <a onClick="return mV(\'Pro\',30,26);">Pr 30:26</a>), but others—such as the swine (<a onClick="return mV(\'Lev\',11,7);">Le 11:7</a>), the stork and the heron (<a onClick="return mV(\'Lev\',11,19);">Le 11:19</a>)—to the \'Arabah and the Jordan valley, while the hoopoe (the King James Version "lapwing," <a onClick="return mV(\'Lev\',11,19);">Le 11:19</a>) lives in Gilead and in Western Palestine. In <a onClick="return mV(\'Deu\',14,\'1-\');">Deuteronomy 14</a> the fallow deer and the roe (<a onClick="return mV(\'Deu\',14,5);">14:5</a>) are now inhabitants of Tabor and Gilead, but the "wild goat" (ibex), "wild ox" (buball), "pygarg" (addax) and "chamois" (wild sheep), are found in the \'Arabah and in the deserts.<P>7. Numbers:<P>In Numbers, the conquest of Eastern Palestine is described, and most of the towns mentioned are known (<a onClick="return mV(\'Num\',21,\'18-33\');">21:18-33<a onClick="return mV(\'Deu\',14,\'1-\');">); the notice of vineyards in Moab (<a onClick="return mV(\'Num\',21,22);">21:22</A>) agrees with the discovery of ancient rock-cut wine presses near Heshbon (SEP, I, 221). The view of Israel, in camp at Shittim by Balaam (<a onClick="return mV(\'Num\',22,41);">22:41</A>), standing on the top of Pisgah or Mt. Nebo, has been shown to be possible by the discovery of Jebel Neba, where also rude dolmens recalling Balak\'s altars have been found (SEP, I, 202). The plateau of Moab <a onClick="return mV(\'Num\',32,3);">(32:3</A>) is described as a "land for cattle," and still supports Arab flocks. The camps in which Israel left their cattle, women and children during the wars, for 6 months, stretched (<a onClick="return mV(\'Num\',33,49);">33:49</A>) from Beth-jeshimoth (Suweimeh), near the northeastern corner of the Dead Sea over Abel-shittim ("the acacia meadow"—a name it still bears) in a plain watered by several brooks, and having good herbage in spring.<P>8. Deuteronomy:<P>(1) Physical Allusions.<P>The description of the "good land" in Deuteronomy (<a onClick="return mV(\'Deu\',8,7);">8:7</a>) applies in some details with special force to Mt. Gilead, which possesses more perennial streams than Western Palestine throughout—"a land of brooks of water, of fountains and springs, flowing forth in valleys and hills"; a land also "of wheat and barley, and vines and fig-trees and pomegranates, a land of olive-trees and honey" is found in Gilead and Bashan. Palestine itself is not a mining country, but the words (<a onClick="return mV(\'Deu\',8,9);">8:9</A>), "a land whose stones are iron, and out of whose hills thou mayest dig copper," may be explained by the facts that iron mines existed near Beirut in the 10th century AD, and copper mines at Punon north of Petra in the 4th century AD, as described by Jerome (Onomasticon, under the word "Phinon"). In Deuteronomy also (<a onClick="return mV(\'Deu\',11,9);">11:29</A>; compare <a onClick="return mV(\'Deu\',27,4);">27:4</A>; <a onClick="return mV(\'Jos\',8,30);">Jos 8:30</a>) Ebal and Gerizim are first noticed, as beside the "oaks of Moreh." Ebal the mountain of curses (3,077 ft. above sea-level) and Gerizim the mountain of blessings (2,850 ft.) are the two highest tops in Samaria, and Shechem lies in a rich valley between them. The first sacred center of Israel was thus established at the place where Abraham built his first altar and Jacob dug his well, where Joseph was buried and where Joshua recognized a holy place at the foot of Gerizim (<a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>). The last chapters of Deuteronomy record the famous Pisgah view from Mt. Nebo (<a onClick="return mV(\'Deu\',34,1,2,3);">34:1-3</A>), which answers in all respects to that from Jebel Neba, except as to Dan, and the utmost (or "western") sea, neither of which is visible. Here we should probably read "toward" rather than "to," and there is no other hill above the plains of Shittim whence a better view can be obtained of the Jordan valley, from Zoar to Jericho, of the watershed mountains as far north as Gilboa and Tabor, and of the slopes of Gilead.<P>(2) Archaeology.<P>But besides these physical allusions, the progress of exploration serves to illustrate the archaeology of Deuteronomy. Israel was commanded (<a onClick="return mV(\'Deu\',12,3);">12:3</A>) to overthrow the Canaanite altars, to break the standing stones which were emblems of superstition, to burn the \'asherah poles (or artificial trees), and to hew down the graven images. That these commands were obeyed is clear. The rude altars and standing stones are now found only in Moab, and in remote parts of Gilead, Bashan, and Galilee, not reached by the power of reforming kings of Judah. The \'asherah poles have disappeared, the images are found, only deep under the surface. The carved tablets which remain at Damascus, and in Phoenicia and Syria, representing the gods of Canaan or of the Hittites, have no counterpart in the Holy Land. Again when we read of ancient "landmarks" (<a onClick="return mV(\'Deu\',19,14);">De 19:14</a>; <a onClick="return mV(\'Pro\',22,28);">Pr 22:28</a>; <a onClick="return mV(\'Pro\',23,10);">23:10</a>), we are not to understand a mere boundary stone, but rather one of those monuments common in Babylonia—as early at least as the 12th century BC—on which the boundaries of a field are minutely described, the history of its grant by the king detailed, and a curse (compare <a onClick="return mV(\'Deu\',27,17);">De 27:17</a>) pronounced against the man who should dare to remove the stone.<P>See illustration under <a href="./study/isbe/search.html?string=NEBUCHADNEZZAR">NEBUCHADNEZZAR</a>.``28';
isbe[6668]='Palestine, 2`III. Palestine in the Historic Books of the Old Testament.<P>1. Book of Joshua:<P>Joshua is the great geographical book of the Old Testament; and the large majority of the 600 names of places, rivers and mountains in Palestine mentioned in the Bible are to be found in this book.<P>(1) Topographical Accuracy.<P>About half of this total of names were known, or were fixed by Dr. Robinson, between 1838 and 1852, and about 150 new sites were discovered (1872-1878, 1881-1882) in consequence of the 1-in. trigonometrical survey of the country, and were identified by the present writer during this period; a few interesting sites have been added by M. Clermont-Ganneau (Adullam and Gezer), by A. Henderson (Kiriathjearim), by W.F. Birch (Zoar at Tell esh Shaghur), and by others. Thus more than three-quarters of the sites have been fixed with more or less certainty, most of them preserving their ancient names. It is impossible to study this topography without seeing that the Bible writers had personal knowledge of the country; and it is incredible that a Hebrew priest, writing in Babylonia, could have possessed that intimate acquaintance with all parts of the land which is manifest in the geographical chapters of Joshua. The towns are enumerated in due order by districts; the tribal boundaries follow natural lines—valleys and mountain ridges—and the character of various regions is correctly indicated. Nor can we suppose that this topography refers to conditions subsequent to the return from captivity, for these were quite different. Simeon had ceased to inhabit the south by the time of David (<a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a>), and the lot of Dan was colonized by men of Benjamin after the captivity (<a onClick="return mV(\'1Ch\',8,12,13);">1Ch 8:12,13</a>; <a onClick="return mV(\'Neh\',11,34,35);">Ne 11:34,35</a>). Tirzah is mentioned (<a onClick="return mV(\'Jos\',12,24);">Jos 12:24</a>) in Samaria, whereas the future capital of Omri is not. Ai is said to have been made "a heap forever" (<a onClick="return mV(\'Jos\',8,28);">Jos 8:28</a>), but was inhabited apparently in Isaiah\'s time (<a onClick="return mV(\'Isa\',10,28);">Isa 10:28</a> = Aiath) and certainly after the captivity (<a onClick="return mV(\'Ezr\',2,28);">Ezr 2:28</a>; <a onClick="return mV(\'Neh\',7,32);">Ne 7:32</a>; <a onClick="return mV(\'Neh\',11,31);">11:31</a> = Aija). At latest, the topography seems to be that of Solomon\'s age, though it is remarkable that very few places in Samaria are noticed in the Book of Joshua.<P>(2) The Passage of the Jordan.<P>Israel crossed Jordan at the lowest ford east of Jericho. The river was in flood, swollen by the melting snows of Hermon (<a onClick="return mV(\'Jos\',3,15);">Jos 3:15</a>); the stoppage occurred 20 miles farther up at Adam (ed-Damieh), the chalky cliffs at a narrow place being probably undermined and falling in, thus damming the stream. A Moslem writer asserts that a similar stoppage occurred in the 13th century AD, near the same point. (See <a href="./study/isbe/search.html?string=JORDAN">JORDAN</a>.) The first camp was established at Gilgal (Jilgulieh), 3 miles east of Jericho, and a "circle" of 12 stones was erected. Jericho was not at the medieval site (er Richa) south of Gilgal, or at the Herodian site farther west, but at the great spring \'Ain es Sultan, close to the mountains to which the spies escaped (<a onClick="return mV(\'Jos\',2,16);">Jos 2:16</a>). The great mounds were found by Sir C. Warren to consist of sun-dried bricks, and further excavations (see Mitteil. der deutschen Orient-Gesell., December, 1909, No. 41) have revealed little but the remains of houses of various dates.<P>(3) Joshua\'s First Campaign.<P>The first city in the mountains attacked by Israel was Ai, near Chayan, 2 miles southeast of Bethel. It has a deep valley to the north, as described (<a onClick="return mV(\'Jos\',8,22);">Jos 8:22</a>). The fall of Ai and Bethel (<a onClick="return mV(\'Jos\',8,17);">Jos 8:17</a>) seems to have resulted in the peaceful occupation of the region between Gibeon and Shechem (<a onClick="return mV(\'Jos\',8,\'30-\');">Jos 8:30</a>-<a onClick="return mV(\'Jos\',9,\'1-27\');">9:27</a>); but while the Hivites submitted the Amorites of Jerusalem and of the South attacked Gibeon (el Jib) and were driven down the steep pass of Beth-horon (Beit \'Aur) to the plains (<a onClick="return mV(\'Jos\',10,\'1-11\');">Jos 10:1-11</a>). Joshua\'s great raid, after this victory, proceeded through the plain to Makkedah, now called el Mughar, from the "cave" (compare <a onClick="return mV(\'Jos\',10,17);">Jos 10:17</a>), and by Libnah to Lachish (Tell el Chesy), whence he went up to Hebron, and "turned" south to Debir (edh Dhaheriyeh), thus subduing the shephelah of Judah and the southern mountains, though the capital at Jerusalem was not taken. It is now very generally admitted that the six letters of the Amorite king of Jerusalem included in Tell el-Amarna Letters may refer to this war. The \'Abiri or Chabiri are therein noticed as a fierce people from Seir, who "destroyed all the rulers," and who attacked Ajalon, Lachish, Ashkelon, Keilah (on the main road to Hebron) and other places.<P>See <a href="./study/isbe/search.html?string=EXODUS,+THE">EXODUS, THE</a>.<P>(4) The Second Campaign.<P>The second campaign (<a onClick="return mV(\'Jos\',11,\'1-14\');">Jos 11:1-14</a>) was against the nations of Galilee; and the Hebrew victory was gained at "the waters of Merom" (<a onClick="return mV(\'Jos\',11,5);">Jos 11:5</a>). There is no sound reason for placing these at the Chuleh lake; and the swampy Jordan valley was a very unlikely field of battle for the Canaanite chariots (<a onClick="return mV(\'Jos\',11,6);">Jos 11:6</a>). The kings noticed are those of Madon (Madin), Shimron (Semmunieh), Dor (possibly Tell Thorah), "on the west," and of Hazor (Chazzur), all in Lower Galilee. The pursuit was along the coast toward Sidon (<a onClick="return mV(\'Jos\',11,8);">Jos 11:8</a>); and Merom may be identical with Shimron-meron (<a onClick="return mV(\'Jos\',12,20);">Jos 12:20</a>), now Semmunieh, in which case the "waters" were those of the perennial stream in Wady el Melek, 3 miles to the north, which flow west to join the lower part of the Kishon. Shimron-meron was one of the 31 royal cities of Palestine west of the Jordan (<a onClick="return mV(\'Jos\',12,\'9-24\');">Jos 12:9-24</a>).<P>The regions left unconquered by Joshua (<a onClick="return mV(\'Jos\',13,\'2-6\');">13:2-6</a>) were those afterward conquered by David and Solomon, including the Philistine plains, and the Sidonian coast from Mearah (el Mogheiriyeh) northward to Aphek (Afqa) in Lebanon, on the border of the Amorite country which lay south of the "land of the Hittites" (<a onClick="return mV(\'Jos\',1,4);">Jos 1:4</a>). Southern Lebanon, from Gebal (Jubeil) and the "entering into Hamath" (the Eleutherus Valley) on the west, to Baal-gad (probably at \'Ain Judeideh on the northwestern slope of Hermon) was also included in the "land" by David (<a onClick="return mV(\'2Sa\',8,\'6-10\');">2Sa 8:6-10</a>). But the whole of Eastern Palestine (<a onClick="return mV(\'Jos\',13,\'7-32\');">Jos 13:7-32</a>), and of Western Palestine, except the shore plains, was allotted to the 12 tribes. Judah and Joseph (Ephraim and Manasseh), being the strongest, appear to have occupied the mountains and the shephelah, as far north as Lower Galilee, before the final allotment.<P>Thus, the lot of Simeon was within that inherited by Judah (<a onClick="return mV(\'Jos\',19,1);">Jos 19:1</a>), and that of Dan seems to have been partly taken from Ephraim, since Joseph\'s lot originally reached to Gezer (<a onClick="return mV(\'Jos\',16,3);">Jos 16:3</a>); but Benjamin appears to have received its portion early (compare <a onClick="return mV(\'Jos\',15,\'5-11\');">Jos 15:5-11</a>; <a onClick="return mV(\'Jos\',16,1,2);">16:1,2</a>; <a onClick="return mV(\'Jos\',18,\'11-28\');">18:11-28</a>). This lot was larger than that of Ephraim, and Benjamin was not then the "smallest of the tribes of Israel" (<a onClick="return mV(\'1Sa\',9,21);">1Sa 9:21</a>), since the destruction of the tribe did not occur till after the death of Joshua and Eleazar (<a onClick="return mV(\'Jdg\',20,28);">Jud 20:28</a>).<P>The twelve tribes were distributed in various regions which may here briefly be described. Reuben held the Moab plateau to the Arnon (Wady Mojub) on the south, and to the "river of Gad" (Wady Na\'aur) on the north, thus including part of the Jordan valley close to the Dead Sea. Gad held all the west of Gilead, being separated from the Ammonites by the upper course of the Jabbok. All the rest of the Jordan valley east of the river was included in this lot. Manasseh held Bashan, but the conquest was not completed till later. Simeon had the neghebh plateau south of Beersheba. Judah occupied the mountains south of Jerusalem, with the shephelah to their west, and claimed Philistia south of Ekron. Benjamin had the Jericho plains and the mountains between Jerusalem and Bethel. The border ran south of Jerusalem to Rachel\'s tomb (<a onClick="return mV(\'1Sa\',10,2);">1Sa 10:2</a>), and thence west to Kiriath-jearim (\'Erma) and Ekron. Dan occupied the lower hills west of Benjamin and Ephraim, and claimed the plain from Ekron to Rakkon (Tell er Raqqeit) north of Joppa. Manasseh had a large region, corresponding to Samaria, and including Carmel, Sharon and half the Jordan valley, with the mountains north of Shechem; but this tribe occupied only the hills, and was unable to drive the Cannanites out of the plains (<a onClick="return mV(\'Jos\',17,11,16);">Jos 17:11,16</a>) Ephraim also complained of the smallness of its lot (<a onClick="return mV(\'Jos\',17,15);">Jos 17:15</a>), which lay in rugged mountains between Bethel and Shechem, including however, the grain plateau east of the latter city. Issachar held the plains of Esdraelon and Dothan, with the Jordan valley to the east, but soon became subject to the Canaanites. Zebulun had the hills of Lower Galilee, and the coast from Carmel to Accho. Naphtali owned the mountains of Upper Galilee, and the rich plateau between Tabor and the Sea of Galilee. Asher had the low hills west of Naphtali, and the narrow shore plains from Accho to Tyre. Thus each tribe possessed a proportion of mountain land fit for cultivation of figs, olives and vines, and of arable land fit for corn. The areas allotted appear to correspond to the density of population that the various regions were fitted to support.<P>The Levitical cities were fixed in the various tribes as centers for the teaching of Israel (<a onClick="return mV(\'Deu\',33,10);">De 33:10</a>), but a Levite was not obliged to live in such a city, and was expected to go with his course annually to the sacred center, before they retreated to Jerusalem on the disruption of the kingdom (<a onClick="return mV(\'2Ch\',11,14);">2Ch 11:14</a>). The 48 cities (<a onClick="return mV(\'Jos\',21,\'13-42\');">Jos 21:13-42</a>) include 13 in Judah and Benjamin for the priests, among which Beth-shemesh (<a onClick="return mV(\'1Sa\',6,13,15);">1Sa 6:13,15</a>) and Anathoth (<a onClick="return mV(\'1Ki\',2,26);">1Ki 2:26</a>) are early noticed as Levitical. The other tribes had 3 or 4 such cities each, divided among Kohathites (10), Gershonites (13), and Merarites (12). The six Cities of Refuge were included in the total, and were placed 3 each side of the Jordan in the south, in the center, and in the north, namely Hebron, Shechem and Kedesh on the west, and Bezer (unknown), Ramoth (Reimun) and Golan (probably Sachem el Jaulan) east of the river. Another less perfect list of these cities, with 4 omissions and 11 minor differences, mostly clerical, is given in <a onClick="return mV(\'1Ch\',6,\'57-81\');">1Ch 6:57-81</a>. Each of these cities had "suburbs," or open spaces, extending (<a onClick="return mV(\'Num\',35,4);">Nu 35:4</a>) about a quarter-mile beyond the wall, while the fields, to about half a mile distant, also belonged to the Levites (<a onClick="return mV(\'Lev\',25,34);">Le 25:34</a>).<P>2. Book of Judges:<P>(1) Early Wars.<P>In Judges, the stories of the heroes who successively arose to save Israel from the heathen carry us to every part of the country. "After the death of Joshua" (<a onClick="return mV(\'Jdg\',1,1);">Jud 1:1</a>) the Canaanites appear to have recovered power, and to have rebuilt some of the cities which he had ruined. Judah fought the Perizzites ("villagers") at Berek (Berqah) in the lower hills west of Jerusalem, and even set fire to that city. Caleb attacked Debir (<a onClick="return mV(\'Jdg\',1,\'12-15\');">Jdg 1:12-15</a>), which is described (compare <a onClick="return mV(\'Jos\',15,\'15-19\');">Jos 15:15-19</a>) as lying in a "dry" (the King James Version "south") region, yet with springs not far away. The actual site (edh Dhaheriyeh) is a village with ancient tombs 12 miles southwest of Hebron; it has no springs, but about 7 miles to the northeast there is a perennial stream with "upper and lower springs." As regards the Philistine cities (<a onClick="return mV(\'Jdg\',1,18);">Jud 1:18</a>), the Septuagint reading seems preferable; for the Greek says that Judah "did not take Gaza" nor Ashkelon nor Ekron, which agrees with the failure in conquering the "valley" (<a onClick="return mV(\'Jdg\',1,19);">Jud 1:19</a>) due to the Canaanites having "chariots of iron." The Canaanite chariots are often mentioned about this time in the Tell el-Amarna Letters and Egyptian accounts speak of their being plated with metals. Manasseh, Ephraim, Zebulun, Asher and Naphtali, were equally powerless against cities in the plains (<a onClick="return mV(\'Jdg\',1,\'27-33\');">Jud 1:27-33</a>); and Israel began to mingle with the Canaanites, while the tribe of Dan seems never to have really occupied its allotted region, and remained encamped in the borders of Judah till some, at least, of its warriors found a new home under Hermon (<a onClick="return mV(\'Jdg\',1,34);">Jud 1:34</a>; <a onClick="return mV(\'Jdg\',18,\'1-30\');">18:1-30</a>) in the time of Jonathan, the grandson of Moses.<P>(2) Defeat of Sisera.<P>The oppression of Israel by Jabin II of Hazor, in Lower Galilee, appears to have occurred in the time of Rameses II, who, in his 8th year, conquered Shalem (Salim, north of Taanach), Anem (\'Anin), Dapur (Deburieh, at the foot of Tabor), with Bethanath (\'Ainitha) in Upper Galilee (Brugsch, History of Egypt, II, 64). Sisera may have been an Egyptian resident at the court of Jabin (<a onClick="return mV(\'Jdg\',4,2);">Jud 4:2</a>); his defeat occurred near the foot of Tabor (<a onClick="return mV(\'Jdg\',4,14);">Jud 4:14</a>) to which he advanced east from Harosheth (el Charathiyeh) on the edge of the sea plain. His host "perished at Endor" (<a onClick="return mV(\'Psa\',83,9);">Ps 83:9</a>) and in the swampy Kishon (<a onClick="return mV(\'Jdg\',5,21);">Jud 5:21</a>). The site of the Kedesh in "the plain of swamps" (<a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>) to which he fled is doubtful. Perhaps Kedesh of Issachar (<a onClick="return mV(\'1Ch\',6,72);">1Ch 6:72</a>) is intended at Tell Qadeis, 3 miles north of Taanach, for the plain is here swampy in parts. The Canaanite league of petty kings fought from Taanach to Megiddo (<a onClick="return mV(\'Jdg\',5,19);">Jud 5:19</a>), but the old identification of the latter city with the Roman town of Legio (Lejjun) was a mere guess which does not fit with Egyptian accounts placing Megiddo near the Jordan. The large site at Mugedd\'a, in the Valley of Jezreel seems to be more suitable for all the Old Testament as well as for the Egyptian accounts (SWP, II, 90-99).<P>(3) Gideon\'s Victory.<P>The subsequent oppression by Midianites and others would seem to have coincided with the troubles which occurred in the 5th, year of Minepthah (see <a href="./study/isbe/search.html?string=EXODUS,+THE">EXODUS, THE</a>). Gideon\'s home (<a onClick="return mV(\'Jdg\',6,11);">Jud 6:11</a>) at Ophrah, in Manasseh, is placed by Samaritan tradition at Fer\'ata, 6 miles west of Shechem, but his victory was won in the Valley of Jezreel (<a onClick="return mV(\'Jdg\',7,\'1-22\');">Jud 7:1-22</a>); the sites of Beth-shittah (Shatta) and Abel-meholah (\'Ain Chelweh) show how Midian fled down this valley and south along the Jordan plain, crossing the river near Succoth (Tell Der\'ala) and ascending the slopes of Gilead to Jogbehah (Jubeichah) and Nobah (<a onClick="return mV(\'Jdg\',8,\'4-11\');">Jud 8:4-11</a>). But Oreb ("the raven") and Zeeb ("the wolf") perished at "the raven\'s rock" and "the wolf\'s hollow" (compare <a onClick="return mV(\'Jdg\',7,25);">Jud 7:25</a>), west of the Jordan. It is remarkable (as pointed out by the present author in 1874) that, 3 miles north of Jericho, a sharp peak is now called "the raven\'s nest," and a ravine 4 miles farther north is named "the wolf\'s hollows." These sites are rather farther south than might be expected, unless the two chiefs were separated from the fugitives, who followed Zebah and Zalmunna to Gilead. In this episode "Mt. Gilead" (<a onClick="return mV(\'Jdg\',7,3);">Jud 7:3</a>) seems to be a clerical error for "Mt. Gilboa," unless the name survives in corrupt form at \'Ain Jalud ("Goliath\'s spring"), which is a large pool, usually supposed to be the spring of Harod (<a onClick="return mV(\'Jdg\',7,1);">Jud 7:1</a>), where Gideon camped, east of Jezreel.<P>The story of Abimelech takes us back to Shechem. He was made king by the "oak of the pillar" (<a onClick="return mV(\'Jdg\',9,6);">Jud 9:6</a>), which was no doubt Abraham\'s oak already noticed; it seems also to be called \'the enchanter\'s oak\' (<a onClick="return mV(\'Jdg\',9,37);">Jud 9:37</a>), probably from some superstition connected with the burial of the Teraphim under it by Jacob. The place called Beer, to which Jotham fled from Abimelech (<a onClick="return mV(\'Jdg\',9,21);">Jud 9:21</a>), may have been Beeroth (Bireh) in the lot of Benjamin. Thebez, the town taken by the latter (<a onClick="return mV(\'Jdg\',9,50);">Jud 9:50</a>), and where he met his death, is now the village Tubas, 10 miles northeast of Shechem.<P>The Ammonite oppression of Israel in Gilead occurred about 300 years after the Hebrew conquest (<a onClick="return mV(\'Jdg\',11,26);">Jud 11:26</a>), and Jephthah the deliverer returned to Mizpah (<a onClick="return mV(\'Jdg\',11,29);">Jud 11:29</a>), which was probably the present village Cuf (already noticed), from his exile in the "land of Tob" (<a onClick="return mV(\'Jdg\',11,3,6);">Jud 11:3,6</a>). This may have been near Taiyibeh, 9 miles south of Gadara, in the extreme north of Gilead—a place notable for its ancient dolmens and rude stone monuments, such as occur also at Mizpah. Jephthah\'s dispute with the men of Ephraim (<a onClick="return mV(\'Jdg\',12,1);">Jud 12:1</a>) indicates the northern position of Mizpah. Aroer (<a onClick="return mV(\'Jdg\',11,33);">Jud 11:33</a>) is unknown, but lay near Rabbath-ammon (<a onClick="return mV(\'Jos\',13,25);">Jos 13:25</a>; <a onClick="return mV(\'2Sa\',24,5);">2Sa 24:5</a>); it is to be distinguished from Aroer (\'Ar\'air) in the Arnon ravine, mentioned in <a onClick="return mV(\'Jdg\',11,26);">Jud 11:26</a>.<P>The scene of Samson\'s exploits lies in the shephelah of Judah on the borders of Philistia. His home at Zorah (Sur\'ah) was on the hills north of the Valley of Sorek, and looked down on "the camp of Dan" (<a onClick="return mV(\'Jdg\',13,25);">Jud 13:25</a> margin), which had been pitched in that valley near Beth-shemesh. Eshtaol (Eshu\'a) was less than 2 miles east of Zorah on the same ridge. Timnath (<a onClick="return mV(\'Jdg\',14,1);">Jud 14:1</a>) was only 2 miles west of Beth-shemesh, at the present ruin Tibneh. The region was one of vineyards (<a onClick="return mV(\'Jdg\',14,5);">Jud 14:5</a>), and the name Sorek (Surik) still survives at a ruin 2 miles west of Zorah. Sorek signified a "choice vine," and a rock-cut wine press exists at the site (SWP, III, 126). These 5 places, all close together, were also close to the Philistine grain lands (<a onClick="return mV(\'Jdg\',15,5);">Jud 15:5</a>) in a region of vines and olives. Samson\'s place of refuge in the "cleft of the rock of Etam" (see <a onClick="return mV(\'Jdg\',15,8);">Jud 15:8</a>) was probably at Beit \'ATab, only 5 miles east of Zorah, but rising with a high knoll above the southern precipices of the gorge which opens into the Valley of Sorek. In this knoll, under the village, is a rock passage now called "the well of refuge" (Bur el Chasutah), which may have been the "cleft" into which Samson "went down." Lehi (<a onClick="return mV(\'Jdg\',15,9);">Jud 15:9</a>) was apparently in the valley beneath, and the name ("the jaw") may refer to the narrow mouth of the gorge whence, after conference with the Philistines, the men of Judah "went down" (<a onClick="return mV(\'Jdg\',15,11);">Jud 15:11</a>) to the "cleft of the rock of Etam" (SWP, III, 83, 137), which was a passage 250 ft. long leading down, under the town, to the spring. All of Samson\'s story is connected with this one valley (for Delilah also lived in the "Valley of Sorek," <a onClick="return mV(\'Jdg\',16,4);">Jud 16:4</a>) except his visit to Gaza, where he carried the gates to the \'hill facing Hebron\' (<a onClick="return mV(\'Jdg\',16,3);">Jud 16:3</a>), traditionally shown (SWP, III, 255) at the great mound on the east side of this town where he died, and where his tomb is (wrongly) shown. Another tomb, close to Zorah, represents a more correct tradition (<a onClick="return mV(\'Jdg\',16,31);">16:31</A>), but the legends of Samson at this village are of modern Christian origin.<P>The appendix to Judges includes two stories concerning Levites who both lived in the time of the 2nd generation after the Hob conquest (<a onClick="return mV(\'Jdg\',18,30);">18:30</A>; <a onClick="return mV(\'Jdg\',20,28);">20:28</A>), and who both "sojourned" in Bethlehem of Judah (<a onClick="return mV(\'Jdg\',17,8);">17:8</A>; <a onClick="return mV(\'Jdg\',19,2);">19:2</A>), though their proper city was one in Mt. Ephraim, In the first case Jonathan, the grandson of Moses, founded a family of idolatrous priests, setting up Micah\'s image at Dan (Tell el Qadi) beside the sources of the Jordan, where ancient dolmen altars still exist. This image may have been the cause why Jeroboam afterward established a calf-temple at the same place. It is said to have stood there till the "captivity of the ark" (St. Petersburg MS, <a onClick="return mV(\'Jdg\',18,30);">Jud 18:30</a>), "all the time that the house of God was in Shiloh" (<a onClick="return mV(\'Jdg\',18,31);">Jud 18:31</a>). From this narrative we learn that the tribe of Dan did not settle in its appointed lot (<a onClick="return mV(\'Jdg\',18,1);">Jud 18:1</a>), but pitched in the "camp of Dan," west of Kiriath-jearim (<a onClick="return mV(\'Jdg\',18,12);">Jud 18:12</a>). This agrees with the former mention of the site (<a onClick="return mV(\'Jdg\',13,25);">Jud 13:25</a>) as being near Zorah; and the open valley near Beth-shemesh is visible, through the gorges of Lehi, from the site of Kiriath-jearim at \'Erma.<P>(4) Appendix: The Defeat of Benjamin.<P>In the 2nd episode we trace the journey of the Levite from Bethlehem past Jerusalem to Gibeah (Jeba\'), east of Ramah (er-Ram), a distance which could easily be traversed in an afternoon (compare <a onClick="return mV(\'Jdg\',19,\'8-14\');">Jud 19:8-14</a>). Gibeah was no doubt selected as a halting-place by the Levite, because it was a Levitical city. The story of the great crime of the men of Gibeah was well known to Hosea (<a onClick="return mV(\'Jdg\',9,9);">Jud 9:9</a>). Israel gathered against them at Mizpah (Tell en Nacbeh) on the watershed, 3 miles to the northwest, and the ark was brought by Phinehas to Bethel (compare <a onClick="return mV(\'Jdg\',20,1,31);">Jud 20:1,31</a>; <a onClick="return mV(\'Jdg\',18,26,27);">18:26,27</a>), 3 miles northeast of Mizpah. The defeat of Benjamin occurred where the road to Gibeah leaves the main north road to Bethel (<a onClick="return mV(\'Jdg\',18,31);">Jud 18:31</a>), west of Ramah. The survivors fled to the rock Rimmon (Rummon), 3 1/2 miles east of Bethel, on the edge of the "wilderness" which stretches from this rugged hill toward the Jordan valley. The position of Shiloh, 9 miles north of this rock, is very accurately described (<a onClick="return mV(\'Jdg\',21,19);">Jud 21:19</a>) as being north of Bethel (Beitin), and east of the main road, thence to Shechem which passes Lebonah (Lubban), a village 3 miles northwest of Seilun or Shiloh. The "vineyards," in which the maidens of Shiloh used to dance (<a onClick="return mV(\'Jdg\',21,20);">Jud 21:20</a>) at the Feast of Tabernacles, lay no doubt where vineyards still exist in the little plain south of this site. It is clear that the writer of these two narratives had an acquaintance with Palestinian topography as exact as that shown throughout Jgs. Nor (if the reading "captivity of the ark" be correct) is there any reason to suppose that they were written after 722 BC.<P>3. Book of Ruth:<P>The Book of Ruth gives us a vivid picture of Hebrew life "when the judges ruled" (<a onClick="return mV(\'Rth\',1,1);">1:1</A> the King James Version), about a century before the birth of David. Laws as old as Hammurabi\'s age allowed the widow the choice of remaining with the husband\'s family, or of quitting his house (compare <a onClick="return mV(\'Rth\',1,8);">1:8</a>). The beating out of gleanings (<a onClick="return mV(\'Rth\',2,17);">2:17</a>) by women is still a custom which accounts for the rock mortars found so often scooped out on the hillside. The villager still sleeps, as a guard, beside the heap of winnowed grain in the threshing-floor (<a onClick="return mV(\'Rth\',3,7);">3:7</A>); the head-veil, still worn, could well have been used to carry six measures of barley (<a onClick="return mV(\'Rth\',3,15);">3:15</A>). The courteous salutation of his reapers by Boaz (<a onClick="return mV(\'Rth\',2,4);">2:4</A>) recalls the common Arabic greeting (Allah ma\'kum), "God be with you." But the thin wine (<a onClick="return mV(\'Rth\',2,4);">2:14</A>) is no longer drunk by Moslem peasants, who only "dip" their bread in oil.<P>4. Books of Samuel:<P>(1) Samuel.<P>The two Books of Samuel present an equally valuable picture of life, and an equally real topography throughout. Samuel\'s father—a pious Levite (<a onClick="return mV(\'1Ch\',6,27);">1Ch 6:27</a>)—descended from Zuph who had lived at Ephratah (Bethlehem; compare <a onClick="return mV(\'1Sa\',9,4,5);">1Sa 9:4,5</a>), had his house at Ramah (<a onClick="return mV(\'1Sa\',1,19);">1Sa 1:19</a>) close to Gibeah, and this town (er-Ram) was Samuel\'s home also (<a onClick="return mV(\'1Sa\',7,17);">1Sa 7:17</a>; <a onClick="return mV(\'1Sa\',25,1);">25:1</a>). The family is described as \'Ramathites, Zuphites of Mt. Ephraim\' (<a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>), but the term "Mt. Ephraim" was not confined to the lot of Ephraim, since it included Bethel and Ramah, in the land of Benjamin (<a onClick="return mV(\'Jdg\',4,5);">Jud 4:5</a>). As a Levite, Elkanah obeyed the law of making annual visits to the central shrine, though this does not seem to have been generally observed in an age when "every man did that which was right in his own eyes" (<a onClick="return mV(\'Jdg\',21,25);">Jud 21:25</a>). The central shrine had been removed by Joshua from Shechem to the remote site of Shiloh (<a onClick="return mV(\'Jos\',22,9);">Jos 22:9</a>), perhaps for greater security, and here the tabernacle (<a onClick="return mV(\'Jos\',22,19);">Jos 22:19</a>) was pitched (compare <a onClick="return mV(\'1Sa\',2,22);">1Sa 2:22</a>) and remained for 4 centuries till the death of Eli. The great defeat of Israel, when the ark was captured by the Philistines, took place not far from Mizpah (<a onClick="return mV(\'1Sa\',4,1);">1Sa 4:1</a>), within an easy day\'s journey from Shiloh (compare <a onClick="return mV(\'1Sa\',4,12);">1Sa 4:12</a>). Ekron, whence it was sent back (<a onClick="return mV(\'1Sa\',6,16);">1Sa 6:16</a>), was only 12 miles from Beth-shemesh (\'Ainshems), where the ark rested on a "great stone" (Septuagint, <a onClick="return mV(\'1Sa\',6,18);">1Sa 6:18</a>); and Beth-shemesh was only 4 miles west of Kiriath-jearim (<a onClick="return mV(\'1Sa\',6,21);">1Sa 6:21</a>), which was in the mountains, so that its inhabitants "came down" from "the hill" (<a onClick="return mV(\'1Sa\',6,21);">1Sa 6:21</a>; <a onClick="return mV(\'1Sa\',7,1);">7:1</a>) to fetch the ark, which abode there for 20 years, till the beginning of Saul\'s reign (<a onClick="return mV(\'1Sa\',14,18);">1Sa 14:18</a>), when, after the war, it may have been restored to the tabernacle at Nob, to which place the latter was probably removed after Eli\'s death, when Shiloh was deserted. The exact site of Nob is not known, but probably (compare <a onClick="return mV(\'Isa\',10,32);">Isa 10:32</a>) it was close to Mizpah, whence the first glimpse of Jerusalem is caught, and thus near Gibeon, where it was laid up after the massacre of the priests (<a onClick="return mV(\'1Sa\',21,1);">1Sa 21:1</a>; <a onClick="return mV(\'1Sa\',22,9,18);">22:9,18</a>; <a onClick="return mV(\'2Ch\',1,3);">2Ch 1:3</a>), when the ark was again taken to Kiriath-jearim (<a onClick="return mV(\'2Sa\',6,2);">2Sa 6:2</a>). Mizpah (Tell en-Nacbeh) was the gathering-place of Israel under Samuel; and the "stone of help" (Eben-ezer) was erected, after his victory over the Philistines, "between Mizpah and Shen" (<a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a>)—the latter place (see Septuagint) being probably the same as Jeshanah (\'Ain Sinai), 6 miles north of Mizpah which Samuel visited yearly as a judge (<a onClick="return mV(\'1Sa\',7,16);">1Sa 7:16</a>).<P>(2) Saul\'s Search.<P>The journey of Saul, who, "seeking asses found a kingdom," presents a topography which has often been misunderstood. He started (<a onClick="return mV(\'1Sa\',9,4);">1Sa 9:4</a>) from Gibeah (Jeba\') and went first to the land of Shalisha through Mt. Ephraim. Baal-shalisha (<a onClick="return mV(\'2Ki\',4,42);">2Ki 4:42</a>) appears to have been the present Kefr Thilth, 18 miles north of Lydda and 24 miles northwest from Gibeah. Saul then searched the land of Shalim—probably that of Shual (<a onClick="return mV(\'1Sa\',13,17);">1Sa 13:17</a>), northeast of Gibeah. Finally he went south beyond the border of Benjamin (<a onClick="return mV(\'1Sa\',10,2);">1Sa 10:2</a>) to a city in the "land of Zuph," which seems probably to have been Bethlehem, whence (as above remarked) Samuel\'s family—descendants of Zuph—came originally. If so, it is remarkable that Saul and David were anointed in the same city, one which Samuel visited later (<a onClick="return mV(\'1Sa\',16,1,2);">1Sa 16:1,2</a>) to sacrifice, just as he did when meeting Saul (<a onClick="return mV(\'1Sa\',9,12);">1Sa 9:12</a>), who was probably known to him, since Gibeah and Ramah were only 2 miles apart. Saul\'s journey home thus naturally lay on the road past Rachel\'s tomb near Bethlehem, and along the Bethel road (<a onClick="return mV(\'1Sa\',10,2,3);">1Sa 10:2,3</a>) to his home at Gibeah (<a onClick="return mV(\'1Sa\',10,5,10);">1Sa 10:5,10</a>). It is impossible to suppose that Samuel met him at Ramah—a common mistake which creates great confusion in the topography.<P>(3) Saul\'s Coronation and First Campaign.<P>Saul concealed the fact of his anointing (<a onClick="return mV(\'1Sa\',10,16);">1Sa 10:16</a>) till the lot fell upon him at Mizpah. This public choice by lot has been thought (Wellhausen, History of Israel, 1885, 252) to indicate a double narrative, but to a Hebrew there would not appear to be any discrepancy, since "The lot is cast into the lap; but the whole disposing thereof is of Yahweh" (<a onClick="return mV(\'Pro\',16,33);">Pr 16:33</a>). Even at Mizpah he was not fully accepted till his triumph over the Ammonites, when the kingdom was "renewed" at Gilgal (<a onClick="return mV(\'1Sa\',11,14);">1Sa 11:14</a>). This campaign raises an interesting question of geography. Only 7 days\' respite was allowed to the men of Jabesh in Gilead (<a onClick="return mV(\'1Sa\',11,3);">1Sa 11:3</a>), during which news was sent to Saul at Gibeah, and messengers dispatched "throughout the borders of Israel" (<a onClick="return mV(\'1Sa\',11,7);">1Sa 11:7</a>), while the hosts gathered at Bezek, and reached Jabesh on the 7th or 8th day (<a onClick="return mV(\'1Sa\',11,\'8-10\');">1Sa 11:8-10</a>) at dawn. Bezek appears to be a different place from that west of Jerusalem (<a onClick="return mV(\'Jdg\',1,4);">Jud 1:4</a>) and to have been in the middle of Palestine at Ibzik, 14 miles north of Shechem, and 25 miles west of Jabesh, which probably lay in Wady Yabis in Gilead. The farthest distances for the messengers would not have exceeded 80 miles; and, allowing a day for the news to reach Saul and another for the march from Bezek to Jabesh, there would have been just time for the gathering of Israel at this fairly central meeting-place.<P>The scene of the victory over the Philistines at Michmash is equally real. They had a \'post\' in Geba (or Gibeah, <a onClick="return mV(\'1Sa\',13,3);">1Sa 13:3</a>), or a governor (compare the Septuagint), whom Jonathan slew. They came up to Michmash (Mukhmas) to attack Jonathan\'s force which held Gibeah, on the southern side of the Michmash valley, hard by. The northern cliff of the great gorge was called Bozez ("shining") in contrast to the southern one (in shadow) which was named Seneh or "thorn" (<a onClick="return mV(\'1Sa\',14,4);">1Sa 14:4</a>). Josephus (BJ, V, ii, 2) says that Gibeah of Saul was by "the valley of thorns," and the ravine, flanked by the two precipitous cliffs east of Michmash, is still called Wady es SuweiniT, or "the valley of little thorn trees." Jonathan climbed the steep slope that leads to a small flat top (<a onClick="return mV(\'1Sa\',14,14);">1Sa 14:14</a> the King James Version), and surprised the Philistine \'post.\' The pursuit was by Bethel to the Valley of Aijalon, down the steep Beth-boron pass (<a onClick="return mV(\'1Sa\',14,23,31);">1Sa 14:23,31</a>); but it should be noted that there was no "wood" (<a onClick="return mV(\'1Sa\',14,25,26);">1Sa 14:25,26</a>) on this bare hilly ridge, and the word (compare <a onClick="return mV(\'Sgs\',5,1);">So 5:1</a>) evidently means "honeycomb." It is also possible that the altar raised by Saul, for fulfillment of the Law (<a onClick="return mV(\'Gen\',9,4);">Ge 9:4</a>; <a onClick="return mV(\'Exd\',20,25);">Ex 20:25</a>), was at Nob where the central shrine was then established.<P>(4) David\'s Early Life.<P>David fed his flocks in the wilderness below Bethlehem, where many a silent and dreadful "Valley of Shadows" (compare <a onClick="return mV(\'Psa\',23,4);">Ps 23:4</a>) might make the stoutest heart fail. The lion crept up from the Jordan valley, and (on another occasion) the bear came down from the rugged mountains above (<a onClick="return mV(\'1Sa\',17,34);">1Sa 17:34</a>). No bears are now known south of Hermon, but the numerous references (<a onClick="return mV(\'2Ki\',2,24);">2Ki 2:24</a>; <a onClick="return mV(\'Isa\',59,11);">Isa 59:11</a>; <a onClick="return mV(\'Hsa\',13,8);">Ho 13:8</a>; <a onClick="return mV(\'Pro\',17,12);">Pr 17:12</a>; <a onClick="return mV(\'Pro\',28,15);">28:15</a>) show that they must have been exterminated, like the lion, in comparatively late times. The victory over Goliath, described in the chapter containing this allusion, occurred in the Valley of Elah near Shochoth (Shuweikeh); and this broad valley (Wady es SunT) ran into the Philistine plain at the probable site of Gath (Tell es Cafi) to which the pursuit led (<a onClick="return mV(\'1Sa\',17,1,2,52);">1Sa 17:1,2,52</a>). The watercourse still presents "smooth stones" (<a onClick="return mV(\'1Sa\',17,40);">1Sa 17:40</a>) fit for the sling, which is still used by Arab shepherds; and the valley still has in it fine "terebinths" such as those from which it took its name Elah. The bronze armor of the giant (<a onClick="return mV(\'1Sa\',17,5,6);">1Sa 17:5,6</a>) indicates an early stage of culture, which is not contradicted by the mention of an iron spearhead (<a onClick="return mV(\'1Sa\',17,7);">1Sa 17:7</a>), since iron is found to have been in use in Palestine long before David\'s time. The curious note (<a onClick="return mV(\'1Sa\',17,54);">1Sa 17:54</a>) as to the head of Goliath being taken "to Jerusalem" is also capable of explanation. Jerusalem was not conquered till at least 10 years later, but it was a general practice (as late as the 7th century BC in Assyria) to preserve the heads of dead foes by salting them, as was probably done in another case (<a onClick="return mV(\'2Ki\',10,7);">2Ki 10:7</a>) when the heads of Ahab\'s sons were sent from Samaria to Jezreel to be exposed at the gate.<P>David\'s outlaw life began when he took refuge with Samuel at the "settlements" (Naioth) near Ramah, where the company of prophets lived. He easily met Jonathan near Gibeah, which was only 2 miles east; and the "stone of departure" ("Ezel," <a onClick="return mV(\'1Sa\',20,19);">1Sa 20:19</a>) may have marked the Levitical boundary of that town. Nob also (<a onClick="return mV(\'1Sa\',20,1);">1Sa 20:1</a>) was, as we have seen, not far off, but Gath (<a onClick="return mV(\'1Sa\',20,10);">1Sa 20:10</a>) was beyond the Hebrew boundary. Thence David retreated up the Valley of Elah to Adullam (\'Aid-el-ma), which stood on a hill west of this valley near the great turn (southward) of its upper course. An inhabited cave still exists here (compare <a onClick="return mV(\'1Sa\',22,1);">1Sa 22:1</a>), and the site meets every requirement (SWP, III, 311, 347, 361-67). Keilah (<a onClick="return mV(\'1Sa\',23,1);">1Sa 23:1</a>) is represented by the village Kila, on the east side of the same valley, 3 miles farther up; and Hereth (<a onClick="return mV(\'1Sa\',22,5);">1Sa 22:5</a>) was also near, but "in Judah" (<a onClick="return mV(\'1Sa\',23,3);">1Sa 23:3</a>), at the village Kharas on a wooded spur 7 miles northwest of Hebron. Thence David went "down" (<a onClick="return mV(\'1Sa\',23,4);">1Sa 23:4</a>) to Keilah 2 miles away to the west. As there was no safety for the outlaws, either in Philistia or in Judah, they had to retreat to the wilderness of Ziph (Tell ez Zif), 4 miles southeast of Hebron. The word "wood" (choresh) may more probably be a proper name, represented by the ruin of Khoreisa, rather more than a mile south of Ziph, while the hill Hachilah (<a onClick="return mV(\'1Sa\',23,19);">1Sa 23:19</a>) might be the long spur, over the Jeshimon or desert of Judah, 6 miles east of Ziph, now called el Kola. Maon (M\'ain) lay on the edge of the same desert still farther south, about 8 miles from Hebron. En-gedi (<a onClick="return mV(\'1Sa\',23,29);">1Sa 23:29</a>; <a onClick="return mV(\'1Sa\',24,1,2);">24:1,2</a>) was on the precipices by the Dead Sea. The "wild goats" (ibex) still exist here in large droves, and the caves of this desert are still used as folds for sheep in spring (<a onClick="return mV(\'1Sa\',24,3);">1Sa 24:3</a>). The villagers south of Hebron are indeed remarkable for their large flocks which—by agreement with the nomads—are sent to pasture in the Jeshimon, like those of Nabal, the rich man of Carmel (Kurmul), a mile north of Maon (<a onClick="return mV(\'1Sa\',25,2);">1Sa 25:2</a>), who refused the customary present to David\'s band which had protected his shepherds "in the fields" (<a onClick="return mV(\'1Sa\',25,15);">1Sa 25:15</a>) or pastures of the wilderness. In summer David would naturally return to the higher ridge of Hachilah (<a onClick="return mV(\'1Sa\',26,1);">1Sa 26:1</a>) on the south side of which there is a precipitous gorge (impassable save by a long detour), across which he talked to Saul (<a onClick="return mV(\'1Sa\',26,13);">1Sa 26:13</a>), likening himself (<a onClick="return mV(\'1Sa\',26,20);">1Sa 26:20</a>) to the desert "partridge" still found in this region.<P>(5) The Defeat and Death of Saul.<P>The site of Ziklag is doubtful, but it evidently lay in the desert south of Beersheba (<a onClick="return mV(\'Jos\',15,31);">Jos 15:31</a>; <a onClick="return mV(\'Jos\',19,5);">19:5</a>; <a onClick="return mV(\'1Ch\',4,30);">1Ch 4:30</a>; <a onClick="return mV(\'1Sa\',27,\'6-12\');">1Sa 27:6-12</a>), far from Gath, so that King Achish did not know whether David had raided the south of Judah, or the tribes toward Shur. Saul\'s power in the mountains was irresistible; and it was for this reason perhaps that his fatal battle with the Philistines occurred far north in the plain near Jezreel. They camped (<a onClick="return mV(\'1Sa\',28,4);">1Sa 28:4</a>) by the fine spring of Shunem (Sulem), and Saul on Gilboa to the south. The visit to Endor (Andur) was thus a perilous adventure, as Saul must have stolen by night round the Philistine host to visit this place north of Shunem. He returned to the spur of Gilboa on which Jezreel stands (<a onClick="return mV(\'1Sa\',29,1);">1Sa 29:1</a>), and the spring noticed is a copious supply north of the village Zer\'in. Beth-shan (<a onClick="return mV(\'1Sa\',31,12);">1Sa 31:12</a>) was at the mouth of the valley of Jezreel at Besian, and here the bodies of Saul and his sons were burned by the men of Jabesh-gilead; but, as the bones were preserved (<a onClick="return mV(\'1Sa\',31,13);">1Sa 31:13</a>; <a onClick="return mV(\'2Sa\',21,13);">2Sa 21:13</a>), it is possible that the corpses were cremated in pottery jars afterward buried under the tree. Excavations in Palestine and in Babylonia show that this was an early practice, not only in the case of infants (as at Gezcr, and Taanach), but also of grown men. See <a href="./study/isbe/search.html?string=PALESTINE+EXPLORATION">PALESTINE EXPLORATION</a>. The list of cities to which David sent presents at the time of Saul\'s death (<a onClick="return mV(\'1Sa\',30,\'26-31\');">1Sa 30:26-31</a>) includes those near Ziklag and as far north as Hebron, thus referring to "all the places where David himself and his men were wont to haunt."<P>(6) Wellhausen\'s Theory of a Double Narrative.<P>The study of David\'s wanderings, it may be noted, and of the climatic conditions in the Jeshimon desert, does not serve to confirm Wellhausen\'s theory of a double narrative, based on the secret unction and public choice of Saul, on the double visit to Hachilah, and on the fact that the gloomy king had forgotten the name of David\'s father. The history is not a "pious make-up" without "a word of truth" (Wellhausen, Hist Israel, 248-49); and David, as a "youth" of twenty years, may yet have been called a "man of war"; while "transparent artifice" (p. 251) will hardly be recognized by the reader of this genuine chronicle. Nor was there any "Aphek in Sharon" (p. 260), and David did not "amuse himself by going first toward the north" from Gibeah (p. 267); his visit to Ramah does not appear to be a "worthless anachronistic anecdote" (p. 271); and no one who has lived in the terrible Jeshimon could regard the meeting at Hachilah as a "jest" (p. 265). Nor did the hill ("the dusky top") "take its name from the circumstance," but Wellhausen probably means the Sela\'-ha-machleqoth ("cliff of slippings" or of "slippings away"), now Wady Malaqeh near Maon (compare <a onClick="return mV(\'1Sa\',23,19,24,28);">1Sa 23:19,24,28</a>), which lay farther south than Ziph.<P>(7) Early Years of David\'s Reign.<P>David, till the 8th year of his reign, was king of Judah only. The first battle with Saul\'s son occurred at Gibeon (<a onClick="return mV(\'2Sa\',2,13);">2Sa 2:13</a>), where the "pool" was no doubt the cave of the great spring at el Jib; the pursuit was by the \'desert Gibeon road\' (<a onClick="return mV(\'2Sa\',2,24);">2Sa 2:24</a>) toward the Jordan valley. Gibeon itself was not in a desert, but in a fertile region. Abner then deserted to David, but was murdered at the "well of Sirah" (\'Ain Sarah) on the road a mile north of David\'s capital at Hebron. Nothing more is said about the Philistines till David had captured Jerusalem, when they advanced on the new capital by the valley of Rephaim (<a onClick="return mV(\'2Sa\',5,22);">2Sa 5:22</a>), which apparently ran from south of Jerusalem to join the valley of Elah. If David was then at Adullam ("the hold," <a onClick="return mV(\'2Sa\',5,17);">2Sa 5:17</a> the King James Version; compare <a onClick="return mV(\'1Sa\',22,5);">1Sa 22:5</a>), it is easy to understand how he cut off the Philistine retreat (<a onClick="return mV(\'2Sa\',5,23);">2Sa 5:23</a>), and thus conquered all the hill country to Gezer (<a onClick="return mV(\'2Sa\',5,25);">2Sa 5:25</a>). After this the ark was finally brought from Baale-judah (Kiriath-jearim) to Jerusalem (<a onClick="return mV(\'2Sa\',6,2);">2Sa 6:2</a>), and further wars were beyond the limits of Western Palestine, in Moab (<a onClick="return mV(\'2Sa\',8,2);">2Sa 8:2</a>) and in Syria (<a onClick="return mV(\'2Sa\',8,\'3-12\');">2Sa 8:3-12</a>); but for "Syrians" (<a onClick="return mV(\'2Sa\',8,13);">2Sa 8:13</a>) the more correct reading appears to be Edomites (<a onClick="return mV(\'1Ch\',18,12);">1Ch 18:12</a>), and the "Valley of Salt" was probably south of the Dead Sea. Another war with the Syrians, aided by Arameans from east of the Euphrates, occurred east of the Jordan (<a onClick="return mV(\'2Sa\',10,\'16-18\');">2Sa 10:16-18</a>), and was followed by the siege of Rabbath-ammon (\'Amman), east of Gilead, where we have notice of the "city of waters" (<a onClick="return mV(\'2Sa\',12,27);">2Sa 12:27</a>), or lower town by the stream, contrasted, it seems, with the citadel which was on the northern hill.<P>(8) Hebrew Letter-writing.<P>In this connection we find the first notice of a "letter" (<a onClick="return mV(\'2Sa\',11,14);">2Sa 11:14</a>) as written by David to Joab. Writing is of course noticed as early as the time of Moses when—as we now know—the Canaanites wrote letters on clay tablets in cuneiform script. These, however, were penned by special scribes; and such a scribe is mentioned early (<a onClick="return mV(\'Jdg\',8,14);">Jud 8:14</a>). David himself may have employed a professional writer (compare <a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>), while Uriah, who carried his own fate in the letter, was probably unable to read. Even in Isaiah\'s time the art was not general (<a onClick="return mV(\'Isa\',29,12);">Isa 29:12</a>), though Hebrew kings could apparently write and read (<a onClick="return mV(\'Deu\',17,18);">De 17:18</a>; <a onClick="return mV(\'2Ki\',19,14);">2Ki 19:14</a>); to the present day the accomplishment is not general in the East, even in the upper class. It should be noted that the first evidence of the use of an alphabet is found in the early alphabetic Psalms, and the oldest dated alphabetic text yet known is later than 900 BC. The script used in the time of Moses may have been cuneiform, which was still employed at Gezer for traders\' tablets in 649 BC. The alphabet may have come into use first among Hebrews, through Phoenician influence in the time of David; and so far no script except this and the cuneiform has been unearthed in Palestine, unless it is to be recognized in signs of the Hittite syllabary at Lachish and Gezer. Another interesting point, as regards Hebrew civilization in David\'s time, is the first mention of "mules" (<a onClick="return mV(\'2Sa\',13,29);">2Sa 13:29</a>; <a onClick="return mV(\'2Sa\',18,9);">18:9</a>; <a onClick="return mV(\'1Ki\',1,33,38);">1Ki 1:33,38</a>), which are unnoticed in the Pentateuch. They are represented as pack animals on an Assyrian bas-relief; but, had they been known to Moses, they would probably have been condemned as unclean. The sons of David fled on mules from Baal-hazor (Tell \'Acur) "beside Ephraim" (now probably Taiyibeh), north of Bethel, where Absalom murdered Amnon.<P>(9) The Later Years of David\'s Reign.<P>On the rebellion of Absalom David retreated to Mahanaim, apparently by the road north of the Mount of Olives, if the Targum of Jonathan (<a onClick="return mV(\'2Sa\',16,5);">2Sa 16:5</a>) is correct in placing Bahurim at Almon (\'Almit), northeast of Jerusalem. It is not clear where the "wood of Ephraim," in which Absalom perished, may have been, but it was beyond Jordan in Gilead (<a onClick="return mV(\'2Sa\',17,22);">2Sa 17:22</a>; <a onClick="return mV(\'2Sa\',18,6);">18:6</a>); and oak woods are more common there than in Western Palestine. The latest revolt, after Absalom\'s death, was in the extreme north at Abel (Abil), in Upper Galilee (<a onClick="return mV(\'2Sa\',20,14);">2Sa 20:14</a>), after which Joab\'s journey is the last incident to be studied in the Books of Samuel. For census purposes he went east of the Jordan to Aroer (perhaps the city on the Arnon), to the "river of Gad" (Wady Na\'aur) near Jazer, and through Gilead. Tahtim-hodshi (<a onClick="return mV(\'2Sa\',24,6);">2Sa 24:6</a>) is believed (on the authority of three Greek manuscripts) to be a corruption of "the Hittites at Kadesh" (Qades), the great city on the Orontes (see <a href="./study/isbe/search.html?string=HITTITES">HITTITES</a>), which lay on the northern boundary of David\'s dominions, south of the kingdom of Hamath. Thence Joab returned to Zidon and Tyre, and after visiting all Judah to Beersheba reached Jerusalem again within 10 months. The acquisition of the temple-site then closes the book.<P>5. Books of Kings:<P>(1) Solomon\'s Provinces.<P>The Books of Kings contain also some interesting questions of geography. Solomon\'s twelve provinces appear to answer very closely to the lots of the twelve tribes described in Josh. They included (<a onClick="return mV(\'1Ki\',4,\'7-19\');">1Ki 4:7-19</a>) the following:<P>(a) Ephraim,<P>(b) Dan,<P>(c) Southern Judah (see <a onClick="return mV(\'Jos\',12,17);">Jos 12:17</a>),<P>(d) Manasseh,<P>(e) Issachar,<P>(f) Northern Gilead and Bashan,<P>(g) Southern Gilead,<P>(h) Naphtali,<P>(i) Asher,<P>(j) part of Isaachar and probably Zebulun (the text is doubtful, for the order of <a onClick="return mV(\'1Ki\',4,17);">1Ki 4:17</a> differs in the Septuagint),<P>(k) Benjamin,<P>(1) Reuben.<P>The Septuagint renders the last clause (<a onClick="return mV(\'1Ki\',4,19);">4:19</a>), "and one Naseph (i.e. "officer"\') in the land of Judah"—probably superior to the other twelve. Solomon\'s dominions included Philistia and Southern Syria, and stretched along the trade route by Tadmor (Palmyra) to Tiphsah on the Euphrates (<a onClick="return mV(\'1Ki\',4,21,24);">4:21,24</A>; compare <a onClick="return mV(\'1Ki\',9,18);">9:18</a> = Tamar; <a onClick="return mV(\'2Ch\',8,4);">2Ch 8:4</a> = Tadmot). Another Tiphsah (now Tafsach) lay 6 miles southwest of Shechem (<a onClick="return mV(\'2Ki\',15,16);">2Ki 15:16</a>). Gezer was presented to Solomon\'s wife by the Pharaoh (<a onClick="return mV(\'1Ki\',9,16);">1Ki 9:16</a>).<P>(2) Geography of the Northern Kingdom.<P>Jeroboam was an Ephraimite (<a onClick="return mV(\'1Ki\',11,26);">1Ki 11:26</a>) from Zereda, probably Curdah, 2 miles northwest of Bethel, but the Septuagint reads "Sarira," which might be Carra, 1 1/2 miles east of Shiloh. After the revolt of the ten tribes, "Shishak king of Egypt" (<a onClick="return mV(\'1Ki\',11,40);">1Ki 11:40</a>; <a onClick="return mV(\'1Ki\',14,25);">14:25</a>) sacked Jerusalem. His own record, though much damaged, shows that he not only invaded the mountains near Jerusalem, but that he even conquered part of Galilee. The border between Israel and Judah lay south of Bethel, where Jeroboam\'s calf-temple was erected (<a onClick="return mV(\'1Ki\',12,29);">1Ki 12:29</a>), Ramah (er-Ram) being a frontier town with Geba and Mizpah (<a onClick="return mV(\'1Ki\',15,17,22);">1Ki 15:17,22</a>); but after the Syrian raid into Galilee (<a onClick="return mV(\'1Ki\',15,20);">1Ki 15:20</a>), the capital of Israel was fixed at Tirzah (<a onClick="return mV(\'1Ki\',15,21);">1Ki 15:21</a>), a place celebrated for its beauty (<a onClick="return mV(\'Sgs\',6,4);">So 6:4</a>), and perhaps to be placed at Teiacir, about 11 miles northeast of Shechem, in romantic scenery above the Jordan valley. Omri reigned here also for six years (<a onClick="return mV(\'1Ki\',16,23);">1Ki 16:23</a>) before he built Samaria, which remained the capital till 722 BC. Samaria appears to have been a city at least as large as Jerusalem, a strong site 5 miles northwest of Shechem, commanding the trade route to its west. It resisted the Assyrians for 3 years, and when it fell Sargon took away 27,290 captives. Excavations at the site will, it may be hoped, yield results of value not as yet published: See next article [<A href="./study/isbe/search.html?string=PALESTINE,+3">Palestine, 3</a>].<P>The wanderings of Elijah extended from Zarephath (Curafend), south of Sidon, to Sinai. The position of the Brook Cherith (<a onClick="return mV(\'1Ki\',17,3);">1Ki 17:3</a>) where—according to one reading—"the Arabs brought him bread and flesh" (<a onClick="return mV(\'1Ki\',17,6);">1Ki 17:6</a>) is not known. The site of this great contest with the prophets of the Tyrian Baal is supposed to be at el Machraqah ("the place of burning") at the southeastern end of the Carmel ridge. Some early king of Israel perhaps, or one of the judges (compare <a onClick="return mV(\'Deu\',33,19);">De 33:19</a>), had built an altar to Yahweh above the Kishon (<a onClick="return mV(\'1Ki\',18,20,40);">1Ki 18:20,40</a>) at Carmel; but, as the water (<a onClick="return mV(\'1Ki\',18,33);">1Ki 18:33</a>) probably came from the river, it is doubtful whether this altar was on the "top of Carmel," 1,50
