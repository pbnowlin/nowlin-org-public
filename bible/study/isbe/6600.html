isbe[6665]='Palestine Exploration, 2A`III. Era of Scientific Excavation.<P>1. Southern Palestine:<P>(1) Tell el-Chesy.<P>(Palestine Exploration Fund).—Exploration must always continue, but excavation is a vast advance. The modern era in Palestinian study begins with Petrie at <a href="./study/isbe/search.html?string=LACHISH">LACHISH</a> (which see) in 1890. Though Renan was actually the first man to put a spade into the soil (1860), yet his results were practically confined to Phoenicia. From Renan\'s time to 1890 there had been no digging whatever, except some narrow but thorough work in Jerusalem, and a slight tickling of the ground at Jericho and at the so-called Tombs of the Kings. Nothing was more providential than this delay in beginning extensive excavations in Palestine, such as had been previously so profitably conducted in Egypt and elsewhere. The results could not have been interpreted even two years earlier, and even when these excavations were commenced, the only man living who could have understood what he found was the man who had been selected to do the work. Nearly two centuries before, a traveler in Palestine (Th. Shaw) had suggested the possibility of certain mounds ("tells") being artificial (compare <a onClick="return mV(\'Jos\',8,28);">Jos 8:28</a>; <a onClick="return mV(\'Jer\',30,18);">Jer 30:18</a>); but not even Robinson or Guerin had suspected that these were the cenotaphs of buried cities, but had believed them to be mere natural hills. The greatest hour in the history of exploration in Palestine, and perhaps in any land, was that in which on a day in April,1890,W.M. Flinders Petrie climbed up the side of Tell el-Chesy, situated on the edge of the Philistine plain, circa 30 miles southwest of Jerusalem, and 17 miles northeast from Gaza, and by examining its strata, which had been exposed by the stream cutting down its side, determined before sunset the fact, from pieces of pottery he had seen, that the site marked a city covering 1,000 years of history, the limits of occupation being probably 1500 BC to 500 BC. This ability to date the several occupations of a site without any inscription to assist him was due to the chronological scale of styles of pottery which he had originated earlier and worked out positively for the Greek epochs at Naukratis a year or two before, and for the epochs preceding 1100 BC at Illahun in the Fayyum only a month or two before. The potsherds were fortunately very numerous at Tell el-Chesy, and by the end of his six weeks\' work he could date approximately some eight successive occupations of the city, each of these being mutually exclusive in certain important forms of pottery in common use. Given the surface date, depth of accumulation and rate of deposit as shown at Lachish, and a pretty sure estimate of the history of other sites was available. Not only was this pottery scale so brilliantly confirmed and elaborated at Tell el-Chesy that all excavators since have been able accurately to date the last settlement on a mound almost by walking over it; but by observations of the methods of stone dressing he was able to rectify many former guesses as to the age of buildings and to establish some valuable architectural signs of age. He proved that some of the walls at this site were built by "the same school of masons which built the Temple of Solomon," and also that the Ionic volute, which the Greeks borrowed from the Asiatics, went back in Palestine at least to the 10th century BC, while on one pilaster he found the architectural motif of the "ram\'s horn" (compare <a onClick="return mV(\'Psa\',118,27);">Ps 118:27</a>). He also concluded, contrary to former belief, that this mound marked the site of Lachish (<a onClick="return mV(\'Jos\',10,31);">Jos 10:31</a>; <a onClick="return mV(\'2Ki\',18,14);">2Ki 18:14</a>), as by a careful examination he found that no other ruins near could fill the known historic conditions of that city, and the inscription found by the next excavator and all more recent research make this conclusion practically sure. Lachish was a great fortress of the ancient world. The Egyptian Pharaohs often mention it, and it is represented in a picture on an Assyrian monument under which is written, "Sennacherib...receives the spoil of Lachish" (see <a onClick="return mV(\'2Ki\',18,14);">2Ki 18:14</a>). It was strategically a strong position, the natural hill rising some 60 ft. above the valley and the fortification which Sennacherib probably attacked being over 10 ft. thick. The debris lay from 50-70 ft. deep on top of the hill. Petrie fixed the directions of the various walls, and settled the approximate dates of each city and of the imported pottery found in several of these. One of the most unexpected things was an iron knife dug up from a stratum indicating a period not far from the time when Israel must have entered Canaan, this being the earliest remnant of iron weapons ever found up to-this date (compare <a onClick="return mV(\'Jos\',17,16);">Jos 17:16</a>).<P>The next two years of scientific digging (1891-1892), admirably conducted by Dr. F.G. Bliss on this site, wholly confirmed Petrie\'s general inductions, though the limits of each occupation were more exactly fixed and the beginning of the oldest city was pushed back to 1700 BC. The work was conducted under the usual dangers, not only from the Bedouin, but from excessive heat (104 degrees in the shade), from malaria which at one time prostrated 8 of the 9 members of the staff, scarcity of water, which had to be carried 6 miles, and from the sirocco (see my report, PEFS, XXI, 160-70 and Petrie\'s and Bliss\'s journal, XXI, 219-46; XXIII, 192,etc.). He excavated thoroughly one-third of the entire hill, moving nearly a million cubic feet of debris. He found that the wall of the oldest city was nearly 30 ft. thick, that of the next city 17 ft. thick, while the latest wall was thin and weak. The oldest city covered a space 1,300 ft. square, the latest one only about 200 ft. square. The oldest pottery had a richer color and higher polish than the later, and this art was indigenous, for at this level no Phoenician or Mycenaean styles were found. The late pre-Israelitish period (1550-800 BC) shows such importations and also local Cypriote imitations. In the "Jewish" period (800-300 BC) this influence is lost and the new styles are coarse and ungraceful, such degeneration not being connected with the entrance of Israel into Canaan, as many have supposed, but with a later period, most probably with the desolation which followed the exile of the ten tribes (Bliss and Petrie). In the pre-Israelite cities were found mighty towers, fine bronze implements, such as battle-axes, spearheads, bracelets, pins, needles, etc., a wine and treacle press, one very large building "beautifully symmetrical," a smelting furnace, and finally an inscribed tablet from Zimrida, known previously from the Tell el-Amarna Letters to have been governor of Lachish, circa 1400 BC. Many Jewish pit ovens were found in the later ruins and large quantities of pottery, some containing potters\' marks and others with inscriptions. Clay figures of Astarte, the goddess of fertility, were found in the various layers, one of these being of the unique Cypriote type, with large earrings, and many Egyptian figures, symbols and animal forms.<P>See also <a href="./study/isbe/search.html?string=LACHISH">LACHISH</a>.<P>(2) Excavations in Jerusalem.<P>During 1894: 1894-1897, notwithstanding the previously good work done in Jerusalem (see above) and the peculiar embarrassments connected with the attempt to dig in a richly populated town, Dr. Bliss, assisted by an expert architect, succeeded in adding considerably to the sum of knowledge. He excavated over a large area, not only positively confirming former inductions, but discovering the remains of the wall of the empress Eudocia (450 AD), and under this the line of wall which Titus had destroyed, and at a deeper level the wall which surrounded the city in the Herodian age, and deeper yet that which must probably be dated to Hezekiah, and below this a construction "exquisitely dressed, with pointed masonry," which must be either the remains of a wall of Solomon or some other preexilic fortification not later than the 8th century. He found gates and in ancient times paved streets and manholes leading to ancient sewer systems, and many articles of interest, but especially settled disputed questions concerning important walls and the levels of the ancient hills, thus fixing the exact topography of the ancient city. H. G. Mitchell and others have also carefully examined certain lines of wall, identifying Nehemiah\'s Dung Gate, etc., and making a new surveyor certain parts of underground Jerusalem, the results of the entire work being a modification of tradition in a few particulars, but corroborative in most. The important springs and reservoirs, valleys and hills of the ancient Jerusalem have been certainly identified. It is now settled that modern Jerusalem "still sits virtually upon her ancient seat and at much the same slope," though not so large as the Jerusalem of the kings of Judah which certainly extended over the Southwestern Hill. Mt. Zion, contrary to tradition which located it on the Southwestern Hill where the citadel stands, probably lay on the Eastern Hill above the Virgin\'s Spring (Gihon). On this Eastern Hill at Ophel lay the Temple, and south of the Temple on the same hill "above Gihon" lay the old Jebusite stronghold (David\'s City). The ancient altar of burnt offering was almost surely at es-Sakhra. The evidence has not been conclusive as to the line of the second wall, so that the site of Golgotha and the Holy Sepulchre cannot certainly be determined (see George Adam Smith\'s exhaustive work, Jerusalem, 2 volumes, 1907; Sir Charles Wilson, Golgotha and the Holy Sepulchre, 1906; and compare Selah Merrill, Ancient Jerusalem, 1908; C.R. Conder, City of Jerusalem, 1909; P.H. Vincent, Underground Jerusalem, 1911).<P>(3) Excavations in the Shephelah. (Palestine Exploration Fund).—During 1898-1900 important work was done by Bliss and Macalister at 4 sites on the border land between Philistia and Judea, while five other small mounds were tunneled, but without important results. The four chief sites were Tell Zakariya, lying about midway between Jerusalem and Tell el-Chesy; Tell ec Cafi, 5 miles W. of Tell Zakariya, and Tell Sandachannah, about 10 miles south; while Tell ej-Judeideh lay between Tell Zakariya and Tell Sandachannah. As Tell ej-Judeideh was only half-excavated and merely confirmed other results, not being remarkable except for the large quantity of jar inscriptions found (37), we omit further mention of it.<P>(a) Tell Zakariya:<P>From this height, 1,214 ft. above the sea, almost all Philistia could be seen. A pre-Israelitish town was found under some 20 ft. of debris, containing pre-Israelitish, Jewish and Seleucidan pottery. Many vaulted cisterns, partly hewn from the rock, were found in the lowest level. In later levels Jewish pit ovens were found and inscribed jar-handles with winged Egyptian symbols, implements of bronze, iron, bone and stone, and Egyptian images of Bes and the Horus eye, etc., besides a strange bronze figure of a woman with a fish\'s tail which seems to represent Atargatis of Ashkelon. The ancient rampart was strengthened, perhaps in Rehoboam\'s time, and towers were added in the Seleucidan era. Only half of this site was excavated.<P>(b) Tell es-Safi:<P>The camp was pitched near here in the Vale of Elah. From a depth of 21 ft. to the rock, was found the characteristic pre-Israelitish pottery and much imported pottery of the Mycenaean type. A high place was also found here, containing bones of camels, sheep, cows, etc., and several monoliths of soft limestone in situ, and near by a jar-burial. In an ancient rubbish heap many fragments of the goddess of fertility were found. Many old Egyptian and later Greek relics were also found, and four Babylonian seals and the usual pottery from Jewish and later periods. With strong probability this site was identified as Gath.<P>(c) Tell Sandachannah:<P>This was situated circa 1,100 ft. above sea-level. The town covered about 6 acres and was protected by an inner and outer wall and occasional towers. The strongest wall averaged 30 ft. thick. The work done here "was unique in the history of Palestinian excavation" (Bliss). At Tell el-Chesy only one-third of each stratum was excavated; at Tell Zakariya only one-half; at Jerusalem the work was confined to the enclosures of the temple, a few city walls and a few churches, pools, streets, etc., but at Tell Sandachannah "we recovered almost an entire town, probably the ancient Mareshah (<a onClick="return mV(\'Jos\',15,44);">Jos 15:44</a>), with its inner and outer walls, its gates, streets, lanes, open places, houses, reservoirs, etc." (Bliss). Nearly 400 vessels absolutely intact and unbroken were found. It was a Seleucidan town of the 3rd and 2nd century BC, with no pre-Israelitish remains. The town was built with thin brick, like blocks of soft limestone, set with wide joints and laid in mud with occasionally larger, harder stones chisel-picked. The town was roughly divided into blocks of streets, some of the streets being paved. The houses were lighted from the street and an open court. Very few rooms were perfectly rectangular, while many were of awkward shape. Many closets were found and pit ovens and vaulted cisterns, reached by staircases, as also portions of the old drainage system. The cisterns had plastered floors, and sometimes two heavy coats of plaster on the walls; the houses occasionally had vaulted roofs but usually the ordinary roof of today, made of boards and rushes covered with clay. No religious building was found and no trace of a colonnade, except perhaps a few fragments of ornament. An enormous columbarium was uncovered (1906 niches). No less than 328 Greek inscriptions were found on the handles of imported wine jars. Under the Seleucidan town was a Jewish town built of rubble, the pottery of the usual kind including stamped jar-handles. An Astarte was found in the Jewish or Greek stratum, as also various animal forms. The Astarte was very curious, about 11 inches high, hollow, wearing a long cloak, but with breasts, body and part of right leg bare, having for headdress a closely fitting sunbonnet with a circular serrated top ornament in front and with seven stars in relief. A most striking find dating from about the 2nd century AD was that of 16 little human figures bound in fetters of lead, iron, etc., undoubtedly representing "revenge dolls" through which the owners hoped to work magic on enemies, and 49 fragments of magical tablets inscribed in Greek on white limestone, with exorcisms, incantations and imprecations. It ought to be added that the four towns as a whole supplement each other, and positively confirm former results. No royal stamps were found at Tell el-Chesy, but 77 were found in these 4 sites, in connection with 2- or 4-winged symbols (Egyptian scarabaeus or winged sundisk). Writing-materials (styli) were found in all strata, their use being "continuous from the earliest times into the Seleucidan period" (Bliss). From the four towns the evolution of the lamp could be traced from the pre-Israelite, through the Jewish to the Greek period. Some 150 of the labyrinthine rock-cut caves of the district were also examined, some of which must be pre-Christian, as in one of these a million cubic feet of material had been excavated, yet so long ago that all signs of the rubbish had been washed away.<P>(4) Painted "Tombs of Marissa."<P>In 1902, John P. Peters and Hermann Thiersch discovered at Belt Jibrin (adjoining Tell Sandachannah) an example of sepulchral art totally different from any other ever found in Palestine. It was a tomb containing several chambers built by a Sidonian, the walls being brilliantly painted, showing a bull, panther, serpent, ibex, crocodile with ibis (?) on its back, hunter on horseback, etc., with dated inscriptions, the earliest being 196 BC (see John P. Peters, Painted Tombs in Necropolis of Marissa, 1905). The writer (April 18, 1913) found another tomb here of similar character, decorated with grapes, birds, two cocks (life size), etc. Perhaps most conspicuous was a wreath of beautiful flowers with a cross in its center. Nothing shows the interrelations of that age more than this Phoenician colony, living in Palestine, using the Greek language but employing Egyptian and Libyan characteristics freely in their funeral article<P>2. Northern Palestine:<P>(1) Tell Ta\'annek.<P>(Austrian Government and Vienna Academy).—During short seasons of three years (1902-4) Professor Ernst Sellin of Vienna made a rapid examination of this town (the Biblical Taanach), situated in the plain of Esdraelon in Northern Palestine, on the ancient road between Egypt and Babylon. Over 100 laborers were employed and digging was carried on simultaneously at several different points on the mound, the record being kept in an unusually systematic way and the official reports being minute and exhaustive. Only a general statement of results can be given, with an indication of the directions in which the "findings" were peculiar. The absence of Phoenician and Mycenaean influence upon the pottery in the earliest levels (100-1600 BC) is just as marked as at other sites, the kind of pottery and the presence of Semitic matstsebhoth (see <a href="./study/isbe/search.html?string=IMAGES">IMAGES</a>) in the Jewish periods are just as in previous sites, and the development in mason work and in pottery is identically the same in this first city to be excavated in Northern Palestine as in Southern Palestine. "The buildings and antiques might be interchanged bodily without any serious confusion of the archaeological history of Palestine....Civilization over all Western Palestine is thus shown to have had the same course of development, whether we study it north or south" (Macalister). This is by far the most important result of this excavation, showing that, notwithstanding divergences in many directions, an equivalent civilization, proving a unity in the dominating race, can be seen over all parts of Palestine so far examined. Iron is introduced at the same time (circa 1000 BC), and even the toys and pottery decorations are similar, and this continues through all the periods, including the Jewish. Yet foreign intercourse is common, and the idols, even from the earliest period, "show religious syncretism" (Sellin). From almost the oldest layer comes a curious seal cylinder containing both Egyptian and Babylonian features. On one pre-Israelite tablet are pictures of Hadad and Baal. The Astarte cult is not quite as prominent here as in Southern Palestine. No figures of the goddess come from the earliest strata, but from 1600 BC to circa 900-800 BC they are common; after this they cease. The ordinary type of Astarte found in Babylonia and Cyprus as well as in Palestine—with crown, necklace, girdle, anklets, and hands clasped on breasts—is found most frequently; but from the 12th to the 9th century other forms appear representing her as naked, with hips abnormally enlarged, to show her power of fecundity. One figure is of a peculiarly foreign type, wearing excessively large earrings, and this is in close connection with one of the most unique discoveries ever made in Palestine—a hollow terra cotta Canaanite or Israelite (<a onClick="return mV(\'2Ki\',16,10);">2Ki 16:10</a>) altar (800-600 BC), having no bottom but with holes in its walls which admitted air and insured draft when fire was kindled below; in its ornamentation showing a mixture of Babylonian and Egyptian motives, having on its right side winged animals with human heads by the side of which is a man (or boy) struggling with a serpent the jaws of which are widely distended in anger; at its top two ram\'s (?) horns, and between them a sacrificial bowl in which to receive the "drink offering"; on its front a tree (of life), and on each side of it a rampant ibex. A bronze serpent was found near this altar, as also. near the high place at Gezer. Continuous evidence of the gruesome practice of foundation sacrifices, mostly of little children, but in one case of an adult, was found between the 13th and 9th centuries BC, after which they seem to cease. In one house the skeletons of a lady and five children were found, the former with her rings and necklace of gold, five pearls, two scarabs, etc. Many jar-burials of new-born infants, 16 in one place, were found, and, close to this deposit, a rock-hewn altar with a jar of yellow incense (?). Egyptian and Babylonian images were found of different eras and curious little human-looking amulets (as were also found at Lachish) in which the parental parts are prominent, which Sellin and Bliss believe to be "teraphim" (<a onClick="return mV(\'Gen\',31,19,34);">Ge 31:19,34</a>; but see Driver, Modern Research, 57, etc.), such as Rachel, being pregnant, took with her to protect her on the hard journey from Haran to Palestine (Macalister).<P>The high place, with one or more steps leading up to it, suggesting "elevation, isolation and mystery" (Vincent), is represented here as in so many other Palestinian ruins, and the evidence shows that it continued long after the entrance of Israel into Canaan. When Israel entered Palestine, no break occurred in the civilization, the art development continuing at about the same level; so probably the two races were at about the same culture-level, or else the Hebrew occupation of the land was very gradual. In the 8th century there seems to be an indication of the entrance of a different race, which doubtless is due to the Assyrian exile. A most interesting discovery was that of the dozen cuneiform tablets found in a terra cotta chest or jar (compare <a onClick="return mV(\'Jer\',32,14);">Jer 32:14</a>) from the pre-Israelite city.<P>These few letters cannot accurately be called "the first library found in Palestine"; but they do prove that libraries were there, since the personal and comparatively unimportant character of some of these notes and their easy and flowing style prove that legal, business and literary documents must have existed. These show that letter-writing was used not only in great questions of state between foreign countries, but in local matters between little contiguous towns, and that while Palestine at this period (circa 1400 BC) was politically dependent on Egypt, yet Babylonia had maintained its old literary supremacy. One of these letters mentions "the finger of Ashirat," this deity recalling the \'asherah or sacred post of the Old Testament (see <a href="./study/isbe/search.html?string=IMAGES">IMAGES</a>); another note is written by Ahi-Yawi, a name which corresponds to Hebrew Ahijah ("Yah is Brother"), thus indicating that the form of the Divine name was then known in Canaan, though its meaning (i.e. the essential name; compare <a onClick="return mV(\'Exd\',6,3);">Ex 6:3</a>; <a onClick="return mV(\'Exd\',34,6);">34:6</a>; <a onClick="return mV(\'Neh\',1,9);">Ne 1:9</a>; <a onClick="return mV(\'Jer\',44,26);">Jer 44:26</a>), may not have been known. Ahi-Yawi invokes upon Ishtar-washur the blessing of the "Lord of the Gods."<P>On the same level with these letters were found two subterranean cells with a rock-hewn chamber in front and a rock-hewn altar above, and even the ancient drain which is supposed to have conveyed the blood from the altar into the "chamber of the dead" below. It may be added that Dr. Sellin thinks the condition of the various walls of the city is entirely harmonious with the Bible accounts of its history (<a onClick="return mV(\'Jos\',12,21);">Jos 12:21</a>; <a onClick="return mV(\'Jos\',17,11);">17:11</a>; <a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a>; <a onClick="return mV(\'Jdg\',5,\'19-21\');">5:19-21</a>; <a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a>; <a onClick="return mV(\'1Ki\',9,15);">9:15</a>; <a onClick="return mV(\'1Ch\',7,29);">1Ch 7:29</a>). So far as the ruins testify, there was no settled city life between circa 600 BC and 900 AD, i.e. it became a desolation about the time of the Babylonian captivity. An Arab castle dates from about the 10th century AD.<P>(2) Tell el-Mutesellim.<P>(Megiddo, <a onClick="return mV(\'Jos\',12,21);">Jos 12:21</a>; <a onClick="return mV(\'Jdg\',5,19);">Jud 5:19</a>; <a onClick="return mV(\'2Ki\',9,27);">2Ki 9:27</a>).—This great commercial and military center of Northern Palestine was opened to the world in 1903-1905 by Dr. Schumacher and his efficient staff, the diggings being conducted under the auspices of His Majesty the Kaiser and the German Palestine Society. The mound, about 5 miles northwest from Ta\'anach, stood prominently 120 ft. above the plain, the ruins being on a plateau 1,020 X 750 ft. in area. An average of 70 diggers were employed for the entire time. The debris was over 33 ft. deep, covering some eight mutually excluding populations. The surrounding wall, 30 X 35 ft. thick, conformed itself to the contour of the town. The excavations reached the virgin rock only at one point; but the oldest stratum uncovered showed a people living in houses, having fire, cooking food and making sacrifices; the next city marked an advance, but the third city, proved by its Egyptian remains to go back as far as the 20th century BC, showed a splendid and in some directions a surprising civilization, building magnificent city gates (57 X 36 ft.), large houses and tombs with vaulted roofs, and adorning their persons with fine scarabs of white and green steatite and other jewelry of stone and bronze. It was very rich in colored pottery and little objects such as tools, seals, terra cotta figures and animals, including a bridled horse, and some worked iron is also said to have been found. In one pile of bodies were two children wearing beautiful bronze anklets. The city lying above this begins as early as the 15th century BC, as is proved by a scarab of Thothmes III and by other signs, although the scarabs, while Egyptian in form, are often foreign in design and execution. Anubis, Bes, Horus and other Egyptian figures appear, also 32 scarabs in one pot, much jewelry, including gold ornaments, and some very long, sharp bronze knives. One tomb contained 42 vessels, and one skeleton held 4 gold-mounted scarabs in its hand. One remarkable fragment of pottery contained a colored picture of pre-Israelite warriors with great black beards, carrying shields (?). A most interesting discovery was that of the little copper (bronze?) tripods supporting lamps, on one of which is the figure of a flute-player, being strikingly similar to pictures of Delphic oracles and to representations lately found in Crete (MNDPV, 1906, 46). This city was destroyed by a fearful conflagration, and is separated from the next by a heavy stratum of cinders and ashes. The fifth city is remarkable for a splendid palace with walls of stone from 3-5 ft. thick. This city, which probably begins as early as Solomon\'s time, shows the best masonry. An oval, highly polished seal of jasper on which is engraved a Hebrew name in script closely resembling the Moabite Stone, suggests a date for the city, and casts an unexpected light upon the Hebrew culture of Palestine in the days of the monarchy. The seal is equal to the best Egyptian or Assyrian work, clearly and beautifully engraved, and showing a climax of article In the center is the Lion (of Judah), mouth wide open, tail erect, body tense. Upon the seal is carved: "To Shema, servant of Jeroboam." This name may possibly not refer to either of the Biblical kings (10th or 8th century BC), but the stratum favors this dating. The seal was evidently owned by some Hebrew noble at a prosperous period when some Jeroboam was in power, and so everything is in favor of this being a relic from the court of one of these kings, probably the latter (Kautzsch, M u. N, 1904, 81). We have here, in any case, one of the oldest Hebrew inscriptions known, and one of the most elegant ever engraved (see MNDPV, 1906, 33). After seeing it the Sultan took it from the museum into his own private collection. A second seal of lapis lazuli, which Schumacher and Kautzsch date from about the 7th century BC, also contains in Old Hebrew the name "Asaph" (compare M u. N,1906, 334; MNDPV, 1904, 147). There are several other remarkable works of art, as e.g. a woman playing the tambourine, wearing an Egyptian headdress; several other figures of women besides several Astartes, and especially a series of six terra cotta heads, one with a prominent Semitic nose, another with Egyptian characteristics, another quite un-Egyp, with regular features, vivacious eyes, curls falling to her shoulders and garlanded with flowers.<P>The sixth stratum might well be called the temple-city, for here were found the ruins of a sanctuary built of massive blocks in which remained much of the ceremonial furniture—sacrificial dishes, a beautiful basalt pot with three feet, a plate having a handle in the form of a flower, etc. Seemingly connected with the former town, three religious stones were found covered by a fourth, and one with a pyramidal top; so here several monoliths were found which would naturally be thought of as religious monuments—though, since they have been touched with tools, this is perhaps doubtful (<a onClick="return mV(\'Exd\',20,25);">Ex 20:25</a>). One incense altar, carved out of gray stone, is so beautiful as to be worthy of a modern Greek cathedral. The upper dish rests on a support of carved ornamental leaves painted red, yellow and cobalt blue, in exquisite taste, the colors still as fresh as when first applied. A blacksmith\'s shop was found in this stratum, containing many tools, including iron plowshares, larger than the bronze ones in the 3rd and 4th layers. Allegorical figures were found, which may possibly belong to the former town, representing a man before an altar with his hands raised in adoration, seemingly to a scorpion, above which are a 6-pointed star, crescent moon, etc. Another most wonderful seal of white hard stone is engraved with three lines of symbols, in the first a vulture chasing a rabbit; in the second a conventional palm tree, with winged creatures on each side; in the third a lion springing on an ibex (?) under the crescent moon. Near by was found a cylinder of black jasper, containing hieroglyphs, and much crushed pottery. The 7th city, which was previous to the Greek or Roman eras, shows only a complex of destroyed buildings. After this the place remains unoccupied till the 11th century AD, when a poor Arab tower was erected, evidently to protect the passing caravans.<P>These excavations were specially important in proving the archaeological richness of Palestine and the elegance of the native works of article They were reported with an unexampled minuteness—various drawings of an original design showing the exact place and altitude where every little fragment was found.<P>(3) Tell Chum.<P>(Capernaum), etc.—In April and May,1905,the German Oriental Society excavated a Hebrew synagogue of the Roman era at Tell Chum. It was 78 ft. long by 59 ft. wide, was built of beautiful white limestone, almost equal to marble, and was in every way more magnificent than any other yet found in Palestine, that in Chorazin being the next finest. Its roof was gable-shaped and it was surprisingly ornamented with fine carvings representing animals, birds, fruits, flowers, etc., though in some cases these ornamentations had been intentionally mutilated. In January, 1907, Macalister and Masterman proved that Khan Minyeh was not the ancient Capernaum, as it contained no pottery older than Arab time, thus showing Tell Chum to be the ancient site, so that the synagogue just excavated may be the one referred to in <a onClick="return mV(\'Luk\',7,5);">Lu 7:5</a>. At Samieh, 6 hours north of Jerusalem, two important Canaanite cemeteries were discovered by the fellahin in 1906, consisting of circular or oval tomb chambers, with roofs roughly dome-shaped, as at Gezer (see below). A large quantity of pottery and bronze objects, much of excellent quality, was found (Harvard Theological Review, I, 70-96; Masterman, Studies in Galilee; Henson, Researches in Palestine).<P>3. Eastern Palestine:<P>Jericho<P>(German Oriental Society).—During 1908-9, Dr. E. Sellin, assisted by a specialist in pottery, (Watzinger) and a professional architect (Langenegger), with the help of over 200 workmen, opened to view this famous Biblical city (<a onClick="return mV(\'Jos\',6,\'1-24\');">Jos 6:1-24</a>). Jericho was most strategically situated at the eastern gateway of Palestine, with an unlimited water-supply in the \'Ain es-Sultan, having complete control of the great commercial highway across the Jordan and possessing natural provisions in its palm forest (Smith, HGHL). It was also set prominently on a hill rising some 40 ft. above the plain. The excavations proved that from the earliest historic time these natural advantages had been increased by every possible artifice known to ancient engineers, until it had become a veritable Gibraltar. The oldest city, which was in the form of an irregular ellipse, somewhat egg-shaped, with the point at the southwest, was first surrounded with a rampart following the contour of the hill, a rampart so powerful that it commands the admiration of all military experts who have examined it.<P>The walls even in their ruins are some 28 ft. high. They were built in three sections:<P>(a) a substratum of clay, gravel and small stones, making a deposit upon the rock about 3 or 4 ft. deep, somewhat analogous to modern concrete;<P>(b) a rubble wall, 6 to 8 ft. thick, of large stones laid up to a height of 16 ft. upon this conglomerate, the lowest layers of the stone being enormously large;<P>(c) upon all this a brick wall over 6 ft. thick, still remaining, in places, 8 ft. high. Not even Megiddo, famous as a military center throughout all the ancient world, shows such workmanship (compare <a onClick="return mV(\'Jos\',2,1);">Jos 2:1</a>; <a onClick="return mV(\'Num\',13,28);">Nu 13:28</a>).<P>"These were masters in stone work and masonry" (The Builder); "Taken as a whole it may justly be regarded as a triumph of engineering skill which a modern builder, under the same conditions, could scarcely excel" (Langenegger); "It is as well done as a brilliant military engineer with the same materials and tools could do today" (Vincent). All the centuries were not able to produce a natural crevice in this fortification. At the north, which was the chief point of danger, and perhaps along other sections also, a second wall was built about 100 ft. inside the first, and almost as strong, while still another defense ("the citadel"), with 265 ft. of frontage, was protected not only by another mighty wall but by a well-constructed glacis. The old pre-Israelite culture in Jericho was exactly similar to that seen in the southern and northern cities, and the idolatry also. In its natural elements Canaanite civilization was probably superior to that of the Hebrews, but the repugnant and ever-present polytheism and fear of magic led naturally to brutal and impure manifestations. It cannot be doubted that, at least in some cases, the infants buried in jars under the floors represent foundation sacrifices. Some of the pottery is of great excellence, comparing favorably with almost the best examples from Egypt; a number of decorative figures of animals in relief are specially fine; the bronze utensils are also good; especially notable are the 22 writing-tablets, all ready to be used but not inscribed. Somewhere near the 15th century the old fortifications were seriously damaged, but equally powerful ones replaced them. The German experts all believed that a break in the city\'s history was clearly shown about the time when, according to the pottery, Israel ought to have captured the city, and it was confidently said that the distinctively Canaanite pottery ceased completely and permanently at this point; but further research has shown that at least a portion of the old town had a practically continuous existence (so <a onClick="return mV(\'Jos\',16,7);">Jos 16:7</a>; <a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',3,13);">3:13</a>; <a onClick="return mV(\'2Sa\',10,5);">2Sa 10:5</a>). No complete Israelite house was preserved, but the Israelite quarter was located close to the spring and no little furniture of the usual kind was found, including dishes, pots, grainmills, lamps, etc., many iron instruments and terra cotta heads of men and animals. The pottery is quite unlike the old Canaanite, being closely allied to the Greek-Phoenician ware of Cyprus. It is noticeable that, as in other Palestinian towns, in the Jewish era, little Babylonian influence is discernible; the Aegean and Egyptian influence is not as marked as in the cities dug up near the Mediterranean coast. One large edifice (60 by 80 ft.) is so like the dwellings of the 7th century BC at Sendjirli that "they seem to have been copied from Syrian plans" (Vincent). Absolutely unique was the series of 12 Rhodian jar-handles stamped in Aramaic, "To Yahweh" (Yah, Yahu). Vincent has suggested that as during the monarchy (7th to 6th century) "To the King" meant probably "For His Majesty\'s Service," so in post-exilic time the Divine name meant "For the Temple" (Rev. biblique). After the exile the city had about 3 centuries of prosperity; but disappears permanently in the Maccabean era (MNDPV, 1907; MDOG, 1908-9; PEFS, 1910; Rev. biblique, 1907-9).``26';
isbe[6666]='Palestine Exploration, 2B`4. Central Palestine:<P>(1) Jerusalem.<P>See above, III, 1, (2).<P>(2) Samaria.<P>(Harvard Expedition).—Although the ancient capital of the Northern Kingdom, yet Samaria was centrally located, being 20 miles from the Mediterranean coast and only about 30 miles north of Jerusalem. Ancient Samaria was very famous in Israel for its frivolity and wealth, special mention being made of its ointments, instruments of music, luxurious couches, and its "ivory palace" (<a onClick="return mV(\'Amo\',6,\'4-6\');">Am 6:4-6</a>; <a onClick="return mV(\'1Ki\',16,24);">1Ki 16:24</a>). Its history is known so fully that the chronological sequences of the ruins can be determined easily. The citadel and town originated with Omri, circa 900 BC (<a onClick="return mV(\'1Ki\',16,24);">1Ki 16:24</a>); the Temple of Baal and palace were constructions of Ahab (<a onClick="return mV(\'1Ki\',16,32);">1Ki 16:32</a>; <a onClick="return mV(\'1Ki\',22,39);">22:39</a>); it continued prosperous down to the Assyrian exile, 722 BC (<a onClick="return mV(\'1Ki\',22,\'1-\');">1Ki 22</a> to <a onClick="return mV(\'2Ki\',17,\'1-\');">2Ki 17</a>); Sargon and Esarhaddon established a Babylonian colony and presumably forrifled the town (720-670 BC); Alexander the Great captured it in 331 BC, and established there a Syrio-Maccabean colony; it was destroyed by John Hyrcanus in 109 BC, but rebuilt by Pompey in 60 BC, and again by Herod (30-1 BC). All of these periods are identified in the excavations, Herod\'s work being easily recognized, and Josephus\' description of the town being found correct; the Greek work is equally well defined, so that the lower layers of masonry which contained the characteristic Jewish pottery, and which in every part of the ruin lay immediately under the Babylonian and Greek buildings, must necessarily be Hebrew, the relative order of underlying structures thus being "beyond dispute" (Reisner). During 1908-9 George A. Reisner with a staff of specialists, including David G. Lyon of the Harvard Semitic Museum, G. Schumacher, and an expert architect, undertook systematically and thoroughly to excavate this large detached "tell" lying 350 ft. above the valley and 1,450 ft. above sea-level, its location as the only possible strategic stronghold proving it to be the ancient Samaria. This was a "gigantic enterprise" because of the large village of 800 population (Sebastiyeh), and the valuable crops which covered the hill. Some $65,000 were spent during the two seasons, and the work finally ceased before the site was fully excavated. The following statement is an abridgment, in so far as possible in their words, of the official reports of Drs. Reisner and Lyon to the Harvard Theological Review: An average of 285 diggers were employed the first season and from 230-260 the second. Hundreds of Arabian lamps, etc., were found close to the surface, and then nothing more until the Roman ruins. Many fine Roman columns still remained upright, upon the surface of the hill. The road of columns leading to the Forum and ornamental gate (oriented unlike the older gates), the great outer wall "20 stadii in circuit" (Jos), the hippodrome, etc., were all found with inscriptions or coins and pottery of the early Roman Empire. Even the old Roman chariot road leading into the Forum was identified. Adjoining the Forum and connected with it by a wide doorway was a basilica, consisting of a large open stone-paved court surrounded by a colonnade with mosaic floor. An inscription in Greek on an architrave in the courtyard dates this to 12-15 AD. The plan of the Herodian temple consisted of a stairway, a portico, a vestibule and a cella with a corridor on each side. The staircase was about 80 ft. wide, composed of 17 steps beautifully constructed, the steps being quite modern in style, each tread overlapping the next lower by several inches. The roof was arched and the walls very massive and covered with a heavy coat of plaster still retaining traces of color. A few Greek graffiti were found near here, and 150 "Rhodian" stamped amphora handles and many fragments of Latin inscriptions. A complete inscription on a large stele proved to be a dedication from some Pannonian soldiers (probably 2nd or 3rd century AD) to "Jupiter Optimus Maximus." Near this was found a torso of heroic size carved in white marble, which is much finer than any ever before discovered in Palestine, the work "bringing to mind the Vatican Augustus" (Vincent), though not equal to it. Close to the statue was a Roman altar (presumably Herodian) circa 13 by 7 ft., rising in six courses of stone to a height of 6 ft. Beneath the Roman city was a Seleucid town (circa 300-108 BC), with its fortifications, gateway, temples, streets, and great public buildings and a complex of private houses, in connection with which was a large bath house, with mosaic floor, hot and cold baths, water closet, etc., which was heated by a furnace. Underneseath the Greek walls, which were connected with the well-known red-figured Greek ware of circa 400 BC, were brick structures and very thick fortress walls built in receding courses of small stones in the Babylonian style. In the filling of the construction trench of this Babylonian wall were found Israelite potsherds and a Hebrew seal with seemingly Babylonian peculiarities, and one fragment of a cuneiform tablet. Below these Babylonian constructions "there is a series of massive walls beautifully built of large limestone blocks founded on rock and forming a part of one great building, which can be no other than the Jewish palace." It consisted of "great open courts surrounded by small rooms, comparable in plan and even in size with the Babylonian palaces and is certainly royal in size and architecture." Its massive outlines which for the first time reveal to the modern world the masonry of an Israelite palace show that unexpected material resources and technical skill were at the command of the kings of Israel. An even greater discovery was made when on the palace hill was found an alabaster vase inscribed with the cartouche of Osorkon II of Egypt (874-853 BC), Ahab\'s contemporary; and at the same level, about 75 fragments of pottery, not jar-handles but ostraca, inscribed with records or memorials in ancient Hebrew. The script is Phoenician, and according to such experts as Lyon and Driver, practically identical with that of the Siloam Inscription (circa 700 BC) and Moabite Stone (circa 850 BC). "The inscriptions are written in ink with a reed pen in an easy flowing hand and show a pleasing contrast to the stiff forms of Phoenician inscriptions cut in stone. The graceful curves give evidence of a skill which comes only with long practice" (Lyon). The ink is well preserved, the writing is distinct, the words are divided by dots or strokes, and with two exceptions all the ostraca are dated, the reigning king probably being Ahab. The following samples represent the ordinary memoranda: "In the 11th year. From \'Abi\'ezer. For \'Asa, \'Akhemelek (and) Ba\'ala. From \'Elnathan (?)....In 9th yr. From Yasat. For \'Abino\'am. A jar of old wine....In 11th yr. For Badyo. The vineyard of the Tell." Baal and El form a part of several of the proper names, as also the Hebrew Divine name, the latter occurring naturally not in its full form, YHWH, but as ordinarily in compounds YW (Lyon, Harvard Theol. Rev., 1911, 136-43; compare Driver, PEFS, 1911, 79-83). In a list of 30 proper names all but three have Biblical equivalents. "They are the earliest specimens of Hebrew writing which have been found, and in amount they exceed by far all known ancient Hebrew inscriptions; moreover, they are the first Palestinian records of this nature to be found" (see especially Lyon, op. cit., I, 70-96; II, 102-13; III, 136-38; IV, 136-43; Reisner, ib, III, 248-63; also Theol. Literaturblatt, 1911, III, 4; Driver, as above; MNOP, 1911, 23-27; Rev. Bibique, VI, 435-45).<P>(3) \'Ain Shems<P>(Beth-shemesh, <a onClick="return mV(\'1Sa\',6,\'1-21\');">1Sa 6:1-21</a>; <a onClick="return mV(\'2Ki\',14,11);">2Ki 14:11</a>).—In a short but important campaign, during 1911-12, in which from 36 to 167 workmen were employed, Dr. D. Mackenzie uncovered a massive double gate and primitive walls 12-15 ft. high, with mighty bastions, and found in later deposits Egyptian images, Syrian Astartes, imported Aegean vases and a remarkable series of inscribed royal jar-handles "dating from the Israelite monarchy" (Vincent), as also what seemed to be an ancient Semitic tomb with fatsade entrance. The proved Cretan relations here are especially important. The town was suddenly destroyed, probably in the era of Sennacherib (PEFS, 1911, LXIX, 172; 1912, XII, 145).<P>(4) Gezer<P>(Palestine Exploration Fund).—Tell ej-Jezer occupies a conspicuous position, over 250 ft. above the plain, and 750 ft. above the sea, on a ridge of hills some 20 miles northwest of Jerusalem, overlooking the plain toward Jaffa, which <span class="noTag">is</span> 17 miles distant. It is in plain sight of the two chief trade caravan roads of Southern Palestine which it controlled. The ancient Gezer was well known from many references to it on the Egyptian records, the names of several governors of Gezer being given in letters dating from circa 1400 BC and Menephtah (circa 1200 BC) calling himself "Binder of Gezer," etc. The discovery of the boundary stones of Gezer (see above) positively identified it. It was thoroughly excavated by R.A. Stewart Macalister in 1902-5, 1907-9, during which time 10,000 photographs were made of objects found. No explorations have been so long continued on one spot or have brought more unique discoveries or thrown more light upon the development of Palestinian culture and religion, and none have been reported as fully (Excavations of Gezer,1912,3 volumes; History of Civilization in Palestine, 1912). Ten periods-are recognized as being distinctly marked in the history of the mound—which broadly speaking represents the development in all parts of Pal:<P>(a) pre-Semitic period (circa 3000-2500 BC), to the entrance of the first Semites;<P>(b) first Semitic city (circa 2500-1800 BC), to the end of the XIIth Egyptian Dynasty;<P>(c) second Semitic city (circa 1800-1400 BC), to the end of the XVIIIth Egyptian Dynasty;<P>(d) third Semitic city (circa 1400-1000 BC), to the beginning of the Hebrew monarchy;<P>(e) fourth Semitic city (circa 1000-550 BC), to the destruction of the monarchy and the Babylonian exile;<P>(f) Persian and Hellenistic period (550-100 BC), to the beginning of the Roman dominion;<P>(g) Roman (100 BC-350 AD);<P>(h) Byzantine (350-600 AD);<P>(i) and (j) early and modern Arabian (350 AD to the present).<P>The last four periods have left few important memorials and may be omitted from review.<P>(a) The aboriginal non-Semitic inhabitants of Gezer were troglodytes (compare <a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a>) living in the caves which honeycomb this district (compare ZDPV, 1909, VI, 12), modifying these only slightly for home purposes. They were a small race 5 ft. 4 inches to 5 ft. 7 in. in height, slender in form, with rather broad heads and thick skulls, who hunted, kept domestic animals (cows, sheep, goats); had fire and cooked food; possessed no metals; made by hand a porous and gritty soft-baked pottery which they decorated with red lines; and were capable of a rude art—the oldest in Palestine—in which drawings of various animals are given. They prized certain bars of stone (possibly phallic); they probably offered sacrifices; they certainly cremated their dead, depositing with the ashes a few food vessels. The crematory found was 31 ft. long by 24 wide, and in it the bodies were burned whole, without regard to orientation. Many cup marks in the rocks suggest possible religious rites; in close connection with these markings were certain remains, including bones of swine (compare <a onClick="return mV(\'Lev\',11,7);">Le 11:7</a>).<P>(b) The Semites who displaced this population were more advanced in civilization, having bronze tools and potter\'s wheels, with finer and more varied pottery; they were a heavier race, being 5 ft. 7 inches to 5 ft. 11 inches tall, larger-boned, thicker-skulled, and with longer faces. They did not burn but buried their dead carelessly upon the floor of the natural caves. The grave deposits are the same as before; occasionally some beads are found with the body. The former race had surrounded their settlement with a wall 6 ft. high and 8 ft. thick, mostly earth, though faced with selected stones; but this race built a wall of hammered stones, though irregularly cut and laid, the wall being 10 ft. thick, and one gateway being 42 ft. wide, flanked by two towers. While huts were always the common residences (as in later eras), yet some buildings of stone were erected toward the close of this period and one large palace was found, built of stone and having a row of columns down the center, and containing a complex of rooms, including one rectangular hall, 40 ft. long by 25 ft. wide. Most remarkable of all were their works of engineering. They hewed enormous constructions, square, rectangular and circular, out of the soft chalk and limestone rocks, one of which contained 60 chambers, one chamber being 400 by 80 ft. The supreme work, however, was a tunnel which was made circa 2000 BC, passing out of use circa 1450-1250 BC, and which shows the power of these early Palestinians. It was 200-250 ft. long and consisted of a roadway cut through the hill of rock some 47 1/2 ft. to an imposing archway 23 ft. high and 12 ft. 10 inches broad, which led to a long sloping passage of equal dimensions, with the arch having a vaulted roof and the sides well plumb. This led into a bed of much harder rock, where dimensions were reduced and the workmanship was poorer, but ultimately reached, about 130 ft. below the present surface of the ground, an enormous living spring of such depth that the excavators could not empty it of the soft mud with which it was filled. A well-cut but well-worn and battered stone staircase, over 12 ft. broad, connected the spring with the upper section of the tunnel 94 ft. above. Beyond the spring was a natural cave 80 by 25 ft. Dr. Macalister asks, "Did a Canaanite governor plan and Canaanite workmen execute this vast work? How did the ancient engineers discover the spring?" No one can answer; but certainly the tunnel was designed to bring the entrance of the water passage within the courtyard protected by the palace walls.<P>Another great reservoir, 57 by 46 ft., at another part of the city was quarried in the rock to a depth of 29 1/2 ft., and below this another one of equal depth but not so large, and narrowing toward the bottom. These were covered with two coats of cement and surrounded by a wall; they would hold 60,000 gals.<P>(c) The second Semitic city, built on the ruins of the first, was smaller, but more luxurious. There were fewer buildings but larger rooms. The potter\'s wheel was worked by the foot. Pottery becomes much finer, the styles and decoration reaching a climax of grace and refinement. Foreign trade begins in this period and almost or quite reaches its culmination. The Hyksos scarabs found here prove that under their rule (XVIth and XVIIth Dynastles) there was close intercourse with Palestine, and the multitudes of Egyptian articles show that this was also true before and after the Hyksos. The Cretan and the Aegean trade, especially through Cyprus, introduced new art ideas which soon brought local attempts at imitation. Scribes\' implements for writing in wax and clay begin here and are found in all strata hereafter.<P>While the pottery is elaborately painted, it is but little molded. The older "combed" ornament practically disappears, while burnished ornament reaches high-water mark. Animal figures are common, the eyes often being elaborately modeled and stuck on; but it is infantile article. Burials still occur in natural caves, but also in those hewn artificially; the bodies are carelessly deposited on the floor without coffins, generally in a crouching position, and stones are laid around and over them without system. Drink offerings always and food offerings generally are placed with the dead. Scarabs are found with the skeletons, and ornaments of bronze and silver, occasionally gold and beads, and sometimes weapons. Lamps also begin to be deposited, but in small numbers.<P>(d) During this period Menephtah "spoiled Gezer," and Israel established itself in Canaan. The excavations have given no hint of Menephtah\'s raid, unless it be found in an ivory pectoral bearing his cartouche. About 1400 BC a great wall, 4 ft. thick, was built of large and well-shaped stones and protected later by particularly fine towers, perhaps, as Macalister suggests, by the Pharaoh who captured Gezer and gave it as a dowry to his daughter, wife of King Solomon. A curious fact, which seemingly illustrates <a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>, is the large increase of the town shortly after the Hebrew invasion. "The houses are smaller and more crowded and the sacred area of the high place is built over." "There is no indication of an exclusively Israelite population around the city outside" (Macalister, v. Driver, Modern Research, 69). That land was taken for building purposes from the old sacred enclosure, and that new ideas in building plans and more heavily fortified buildings were now introduced have been thought to suggest the entrance among the ancient population of another element with different ideas. The finest palace of this period with very thick walls (3-9 ft.) carefully laid out at right angles, and certainly built near "the time of the Hebrew invasion," was perhaps the residence of Horam (<a onClick="return mV(\'Jos\',10,33);">Jos 10:33</a>). At this period seals begin (10 being found here, as against 28 in the next period, and 31 in the Hellenistic) and also iron tools; the use of the carpenter\'s compass is proved, the bow drill was probably in use, bronze and iron nails appear (wrought iron being fairly common from circa 1000 BC); a cooking-pot of bronze was found, and spoons of shell and bronze; modern methods of making buttons and button holes are finest from this period, pottery buttons being introduced in the next city. One incidental Bible reference to the alliance between Gezer and Lachish (<a onClick="return mV(\'Jos\',10,33);">Jos 10:33</a>) finds unexpected illustration from the fact that a kind of pottery peculiar to Lachish, not having been found in any other of the Southern Palestinian towns, was found at Gezer. The pottery here in general shows the same method of construction as in the 3rd stratum, but the decoration and shapes deteriorate, while there is practically no molding. It shows much the same foreign influence as before, the styles being affected from Egypt, Crete, the Aegean, and especially Cyprus. From this period come 218 scarabs, 68 from the period previous and 93 from the period following. Ornamental colored specimens of imported Egyptian glass also occur, clear glass not being found till the next period. Little intercourse is proved with Babylon at this era: as against 16 Babylonian cylinders found in the previous period, only 4 were found in this and 15 in the next period. There is no marked change in the method of disposing of the dead, but the food vessels are of smaller size and are placed in the graves in great numbers, most of these being broken either through the use of poor vessels because of economy or with the idea of liberating the spirit of the object that it might serve the deceased in the spirit world. Lamps are common now in every tomb but there is a marked decrease in the quantity and value of ornamental objects. Religious emblems occur but rarely. The worship of Astarte (see <a href="./study/isbe/search.html?string=ASHTORETH">ASHTORETH</a>), the female consort of Baal, is most popular at this era, terra cotta figures and plaques of this goddess being found in many types and in large numbers. It is suggestive that these grow notably less in the next stratum. It is also notable that primitive idols are certainly often intentionally ugly (Vincent). So to this day Arabs ward off the evil eye.<P>(e) This period, during which almost the entire prophetic literature was produced, is of peculiar interest. Gezer at this time as at every other period was in general appearance like a modern Arab village, a huge mass of crooked, narrow, airless streets, shut inside a thick wall, with no trace of sanitary conveniences, with huge cisterns in which dead men could lie undetected for centuries, and with no sewers. Even in the Maccabean time the only sewer found ran, not into a cesspool, but into the ground, close to the governor\'s palace. The mortality was excessively high, few old men being found in the cemeteries, while curvature of the spine, syphilis, brain disease, and especially broken, unset bones were common. Tweezers, pins and needles, kohl bottles, mirrors, combs, perfume boxes, scrapers (for baths) were common in this stratum and in all that follow it, while we have also here silver earrings, bracelets and other beautiful ornaments with the first sign of clear glass objects; tools also of many kinds of stone, bronze and iron, an iron hoe just like the modern one, and the first known pulley of bronze. The multitude of Hebrew weights found here have thrown much new light on the weight-standards of Palestine (see especially Macalister, Gezer, II, 287-92; E. J. Pilcher, PEFS, 1912; A. R. S. Kennedy, Expository Times, XXIV).<P>The pottery was poor in quality, clumsy and coarse in shape and ornament, except as it was imported, the local Aegean imitations being unworthy. Combed ornament was not common, and the burnished as a rule was limited to random scratches. Multiple lamps became common, and a large variety of styles in small jugs was introduced. The motives of the last period survive, but in a degenerate form. The bird friezes so characteristic of the 3rd Semitic period disappear. The scarab stamp goes out of use, but the impressions of other seals "now become fairly common as potter\'s marks." These consist either of simple devices (stars, pentacles, etc.) or of names in Old Hebrew script. These Hebrew-inscribed stamps were found at many sites and consist of two classes, (i) those containing personal names, such as Azariah, Haggai, Menahem, Shebaniah, etc., (ii) those which are confined to four names, often repeated—Hebron, Socoh, Ziph, Mamshith—in connection with a reference to the king, e.g. "For (or Of) the king of Hebron." These latter date, according to Dr. Macalister\'s final judgment, from the Persian period. He still thinks they represent the names of various potters or potters\' guilds in Palestine (compare <a onClick="return mV(\'1Ch\',2,\'1-\');">1Ch 2</a>; <a onClick="return mV(\'1Ch\',4,\'1-\');">4</a>; <a onClick="return mV(\'1Ch\',5,\'1-\');">5</a>, and see especially Bible Side-Lights from Gezer, 150, etc.), but others suppose these names to represent the local measures of capacity, which differed in these various districts; others that these represented different tax-districts where wine jars would be used and bought. At any rate, we certainly have here the work of the king\'s potters referred to in <a onClick="return mV(\'1Ch\',4,23);">1Ch 4:23</a>. Another very curious Hebrew tablet inscription is the so-called Zodiacal Tablet, on which the signs of the Zodiac are figured with certain other symbols which were at first supposed to express some esoteric magical or religious meaning, but which seem only to represent the ancient agricultural year with the proper months indicated for sowing and reaping—being the same as the modern seasons and crops except that flax was cultivated in ancient times. An even more important literary memorial from this period consists of two cuneiform tablets written about three-quarters of a century after the Ten Tribes had been carried to Assyria and foreign colonies had been thrown into Israelite territory. This collapse of the Northern Kingdom was not marked by any local catastrophe, so far as the ruins indicate, any more than the collapse of the Canaanite kingdom when Israel entered Palestine; but soon afterward we find an Assyrian colony settled in Gezer "using the Assyrian language and letters...and carrying on business with Assyrian methods." In one tablet (649 BC), which is a bill of sale for certain property, containing description of the same, appeared the name of the buyer, seals of seller and signature of 12 witnesses, one of whom is the Egyptian governor of the new town, another an Assyrian noble whose name precedes that of the governor, and still another a Western Asiatic, the others being Assyrian. It is a Hebrew "Nethaniah," who the next year, as the other tablet shows, sells his field, his seal bearing upon it a lunar stellar emblem. Notwithstanding the acknowledged literary work of high quality produced in Palestine during this period, no other hint of this is found clear down to the Greek period except in one neo-Babylonian tablet.<P>The burials in this period were much as previously, except that the caves were smaller and toward the end of the period shelves around the walls received the bodies. In one Semitic tomb as many as 150 vessels were found. Quite the most astonishing discovery at this level was that of several tombs which scholars generally agree to be "Philistine." They were not native Canaanite, but certainly Aegean intruders with relations with Crete and Cyprus, such as we would expect the Philistines to have (see <a href="./study/isbe/search.html?string=PHILISTINES">PHILISTINES</a>). The tombs were oblong or rectangular, covered with large horizontal slabs, each tomb containing but a single body, stretched out with the head to the east or west. One tomb was that of a girl of 18 with articles of alabaster and silver about her, and wearing a Cretan silver mouth plate; another was a man of 40 with agate seal of Assyrian design, a two-handled glass vessel, etc.; another was a woman surrounded by handsome ornaments of bronze, lead, silver and gold, with a basalt scarab between her knees. The richest tomb was that of a girl whose head had been severed from the body; with her was a hemispherical bowl, ornamented with rosette and lotus pattern, and a horde of beautiful things. The iron in these tombs was noticeable (compare <a onClick="return mV(\'1Sa\',17,7);">1Sa 17:7</a>), and in one tomb were found two ingots of gold, one of these being of the same weight almost to a fraction as that of Achan (<a onClick="return mV(\'Jos\',7,21);">Jos 7:21</a>). The most impressive discovery was the high place. This began as early as 2500-2000 BC, and grew by the addition of monoliths and surrounding buildings up to this era. The eight huge uncut pillars which were found standing in a row, with two others fallen (yet compare Benzinger, Hebrew Archaeology, 320), show us the actual appearance of this ancient worshipping-place so famous in the Bible (<a onClick="return mV(\'Deu\',16,22);">De 16:22</a>; <a onClick="return mV(\'2Ki\',17,9,17);">2Ki 17:9,11</a>; <a onClick="return mV(\'2Ki\',23,8);">23:8</a>). The top of one of these monoliths had been worn smooth by kisses; another was an importation, being possibly, as has been suggested, a captured "Aril"; another stone, near by, had a large cavity in its top, nearly 3 ft. long and 2 ft. broad and 1 ft. 2 inches deep, which is differently interpreted as being the block upon which the \'asherah, so often mentioned in connection with the matstsebhoth, may have been erected, or as an altar, or perhaps a layer for ritual ablutions. Inside the sacred enclosure was found a small bronze cobra (<a onClick="return mV(\'2Ki\',18,4);">2Ki 18:4</a>), and also the entrance to an ancient cave, where probably oracles were given, the excavators finding that this cave was connected with another by a small, secret passage—through which presumably the message was delivered. In the stratum underlying the high place was a cemetery of infants buried in large jars. "That the sacrificed infants were the firstborn, devoted in the temple, is indicated by the fact that none were over a week old" (Macalister). In all the Semitic strata bones of children were also found in corners of the houses, the deposits being identical with infant burials in the high place; and examination showed that these were not stillborn children. At least some of the burials under the house thresholds and under the foundation of walls carry with them the mute proofs of this most gruesome practice. In one place the skeleton of an old woman was found in a corner where a hole had been left just large enough for this purpose. A youth of about 18 had been cut in two at the waist and only the upper part of his body deposited. Before the coming into Palestine of the Israelites, a lamp began to be placed under the walls and foundations, probably symbolically to take the place of human sacrifice. A lamp and bowl deposit under the threshold, etc., begins in the 3rd Semitic period, but is rare till the middle of that period. In the 4th Semitic period it is common, though not universal; in the Hellenic it almost disappears. Macalister suspects that these bowls held blood or grape juice. In one striking case a bronze figure was found in place of a body. Baskets full of phalli were carried away from the high place. Various types of the Astarte were found at Gezer. When we see the strength and popularity of this religion against which the prophets contended in Canaan, "we are amazed at the survival of this world-religion," and we now see "why Ezra and Nehemiah were forced to raise the \'fence of the law\' against this heathenism, which did in fact overthrow all other Semitic religions" (George Adam Smith. PEFS, 1906, 288).<P>(f) During the Maccabean epoch the people of Gezer built reservoirs (one having a capacity of 4,000,000 gallons) used well-paved rooms, favored complex house plans with pillars, the courtyard becoming less important as compared with the rooms, though domestic fowls were now for the first time introduced. The architectural decorations have all been annihilated (as elsewhere in Pal) except a few molded stones and an Ionic volute from a palace, supposed to be that of Simon Maccabeus because of the references in Josephus and because of a scribbled imprecation found in the courtyard: "May fire overtake (?) Simon\'s palace." This is the only inscription from all these post-exilic centuries, to which so much of the beautiful Bible literature is ascribed, except one grotesque animal figure on which is scrawled a name which looks a little like "Antiochus." Only a few scraps of Greek bowls, some Rhodian jar-handles, a few bronze and iron arrow heads, a few animal figures and a fragment of an Astarte, of doubtful chronology, remain from these four centuries. The potsherds prove that foreign imports continued and that the local potters followed classic models and did excellent work. The ware was always burnt hard; combed ornament and burnishing were out of style; molded ornament was usually confined to the rope design; painted decorations were rare; potter\'s marks were generally in Greek, though some were in Hebrew, the letters being of late form, and no names appearing similar to those found in Scripture. The tombs were well cut square chambers, with shafts hewn in the rock for the bodies, usually nine to each tomb, which were run into them head foremost. The doorways were well cut, the covers almost always being movable flat slabs, though in one case a swinging stone door was found—circular rolling stones or the "false doors" so often found in the Jerusalem tombs being unknown here. Little shrines were erected above the forecourt or vestibule. When the body decayed, the bones in tombs having these kukhin, shafts, were collected into ossuaries, the inscriptions on these ossuaries showing clearly the transition from Old Hebrew to the square character. After the Maccabean time the town was deserted, though a small Christian community lived here in the 4th century AD.<P>LITERATURE.<P>Most Important Recent Monographs:<P>Publications of Palestine Exploration Fund, especially Survey of Western Palestine (9 volumes, 1884); survey of Eastern Palestine (2 Volumes, 1889); "Palestinian Pilgrim\'s Text Society\'s Library" (13 vols) and the books of W.M. Flinders Petrie, F.J. Bliss and R.A.S. Macalister; also Bliss, Development of Palestine Exploration (1906), and Macalister, Bible Side-Lights from the Mound of Gezer (1906); Ernst Sellin, Tell Ta\'annek (1904); Eine Nachlese auf dem Tell Ta\'annek (1905); C. Steuernagel, Tell el-Mutesellim (1908); Mommert, Topog. des alten Jerusalem (1902-7); H. Guthe, Bibelatlas (1911).<P>Most Important Periodicals:<P>PEFS; ZDPV; Mitteilungen Und Nachrichten des deutschen Palastina-Vereins; Palastina-Jahrbuch (MNDPV); Revue Biblique.<P>Most Important General Works:<P>L.B. Paton, Early History of Syria and Palestine (1902); Cuinet, Syrie, Liban et Palestine (1896-1900); H.V. Hilprecht, Explorations in Bible Lands during the 19th Century. (1903); P.H. Vincent, Canaan, d\'apres l\'exploration recente (1907); G.A. Smith, Jerusalem (1908); S. R. Driver, Modern Research as Illustrating the Bible (1909).`<a href="./study/isbe/search.html?string=GEZER">GEZER</a>`26';
isbe[6667]='Palestine, 1`pal\'-es-tin (pelesheth; Phulistieim, Allophuloi; the King James Version <a onClick="return mV(\'Joe\',3,4);">Joe 3:4</a> (the Revised Version (British and American) "Philistia"), "Palestina"; the King James Version <a onClick="return mV(\'Exd\',15,14);">Ex 15:14</a>; <a onClick="return mV(\'Isa\',14,29,31);">Isa 14:29,31</a>; compare <a onClick="return mV(\'Psa\',60,8);">Ps 60:8</a>; <a onClick="return mV(\'Psa\',83,7);">83:7</a>; <a onClick="return mV(\'Psa\',87,4);">87:4</a>; <a onClick="return mV(\'Psa\',108,9);">108:9</a>):<P><b>I. PHYSICAL CONDITIONS</b><P class="in15">1. General Geographical Features<P class="in15">2. Water-Supply<P class="in15">3. Geological Conditions<P class="in15">4. Fauna and Flora<P class="in15">5. Climate<P class="in15">6. Rainfall<P class="in15">7. Drought and Famine<P><b>II. PALESTINE IN THE PENTATEUCH</b><P class="in15">1. Places Visited by Abraham<P class="in15">2. Places Visited by Isaac<P class="in15">3. Places Visited by Jacob<P class="in15">4. Mentioned in Connection with Judah<P class="in15">5. Review of Geography of Genesis<P class="in15">6. Exodus and Leviticus<P class="in15">7. Numbers<P class="in15">8. Deuteronomy<P><b>III. PALESTINE IN THE HISTORIC BOOKS OF THE OLD TESTAMENT</b><P class="in15">1. Book of Joshua<P class="in15">2. Book of Judges<P class="in15">3. Book of Ruth<P class="in15">4. Books of Samuel<P class="in15">5. Books of Kings<P class="in15">6. Post-exilic Historical Books<P><b>IV. PALESTINE IN THE POETIC BOOKS OF THE OLD TESTAMENT</b><P class="in15">1. Book of Job<P class="in15">2. Book of Psalms<P class="in15">3. Book of Proverbs<P class="in15">4. So of Songs<P><b>V. PALESTINE IN THE PROPHETS</b><P class="in15">1. Isaiah<P class="in15">2. Jeremiah<P class="in15">3. Ezekiel<P class="in15">4. Minor Prophets<P><b>VI. PALESTINE IN THE APOCRYPHA</b><P class="in15">1. Book of Judith<P class="in15">2. Book of Wisdom<P class="in15">3. 1Maccabees<P class="in15">4. 2Maccabees<P><b>VII. PALESTINE IN THE NEW TESTAMENT</b><P class="in15">1. Synoptic Gospels<P class="in15">2. Fourth Gospel<P class="in15">3. Book of Acts<P><b>LITERATURE</b><hr /><P>The word properly means "Philistia," but appears to be first used in the extended sense, as meaning all the "Land of Israel" or "Holy Land" (<a onClick="return mV(\'Zec\',2,12);">Zec 2:12</a>), by Philo and by Ovid and later Roman authors (Reland, Palestine Illustr., I, 38-42).<P>I. Physical Conditions.<P>The Bible in general may be said to breathe air of Palestine; and it is here intended to show how important for sound criticism is the consideration of its geography, and of the numerous incidental allusions to the natural features, fauna, flora, cultivation, and climate of the land in which most of the Bible books were written. With the later history and topography of Palestine, after 70 AD, we are not here concerned, but a short account of its present physical and geological conditions is needed for our purpose.<P>1. General Geographical Features:<P>Palestine west of the Jordan, between Dan and Beersheba, has an area of about 6,000 square miles, the length from Hermon southward being nearly 150 miles, and the width gradually increasing from 20 miles on the north to 60 miles on the south. It is thus about the size of Wales, and the height of the Palestinian mountains is about the same as that of the Welsh. East of the Jordan an area of about 4,000 square miles was included in the land of Israel. The general geographical features are familiar to all.<P>(1) The land is divided by the deep chasm of the Jordan valley—an ancient geological fault continuing in the Dead Sea, where its depth (at the bottom of the lake) <span class="noTag">is</span> 2,600 ft. below the Mediterranean.<P>(2) West of the valley the mountain ridge, which is a continuation of Lebanon, has very steep slopes on the east and long spurs on the west, on which side the foothills (Hebrew shephelah or "lowland") form a distinct district, widening gradually southward, while between this region and the sea the plains of Sharon and Philistia stretch to the sandhills and low cliffs of a harborless coast.<P>(3) In Upper Galilee, on the north, the mountain ridge rises to 4,000 ft. above the Mediterranean. Lower Galilee, to the south, includes rounded hills less than 1,000 ft. above the sea, and the triangular plain of Esdraelon drained by the River Kishon between the Gilboa watershed on the east and the long spur of Carmel on the west.<P>(4) In Samaria the mountains are extremely rugged, but a small plain near Dothan adjoins that of Esdraelon, and another stretches east of Shechem, 2,500 ft. above the level of the Jordan valley. In Judea the main ridge rises toward Hebron and then sinks to the level of the Beersheba plains about 1,000 ft. above the sea. The desert of Judah forms a plateau (500 ft. above sea-level), between this ridge and the Dead Sea, and is throughout barren and waterless; but the mountains—which average about 3,000 ft. above the sea—are full of good springs and suitable for the cultivation of the vine, fig and olive. The richest lands are found in the shephelah region—especially in Judea—and in the corn plains of Esdraelon, Sharon, and Philistia.<P>(5) East of the Jordan the plateau of Bashan (averaging 1,500 ft. above the sea) is also a fine corn country. South of this, Gilead presents a mountain region rising to 3,600 ft. above sea-level at Jebel Osha\', and sloping gently on the east to the desert. The steep western slopes are watered by the Jabbok River, and by many perennial brooks. In North Gilead especially the wooded hills present some of the most picturesque scenery of the Holy Land. South of Gilead, the Moab plateau (about 2,700 ft. above sea-level) is now a desert, but is fitted for raising grain, and, in places, for vines. A lower shelf or plateau (about 500 to 1,000 ft. above sea-level) intervenes between the main plateau and the Dead Sea cliffs, and answers to the Desert of Judah west of the lake.<P>2. Water-Supply:<P>The water-supply of Palestine is abundant, except in the desert regions above noticed, which include only a small part of its area. The Jordan runs into the Dead Sea, which has no outlet and which maintains its level solely by evaporation, being consequently very salt; the surface is nearly 1,300 ft. below the Mediterranean, whereas the Sea of Galilee (680 ft. below sea-level) is sweet and full of fish. The Jordan is fed, not only by the snows of Hermon, but by many affluent streams from both sides. There are several streams also in Sharon, including the Crocodile River under Carmel. In the mountains, where the hard dolomite limestone is on the surface, perennial springs are numerous. In the lower hills, where this limestone is covered by a softer chalky stone, the supply depends on wells and cisterns. In the Beersheba plains the water, running under the surface, is reached by scooping shallow pits—especially those near Gerar, to be noticed later.<P>3. Geological Conditions:<P>The fertility and cultivation of any country depends mainly on its geological conditions. These are comparatively simple in Palestine, and have undergone no change since the age when man first appeared, or since the days of the Hebrew patriarchs. The country was first upheaved from the ocean in the Eocene age; and, in the subsequent Miocene age, the great crack in the earth\'s surface occurred, which formed a narrow gulf stretching from that of the \'Aqabah on the south almost to the foot of Hermon. Further upheaval, accompanied by volcanic outbreaks which covered the plateaus of Golan, Bashan, and Lower Galilee with lava, cut off the Jordan valley from the Red Sea, and formed a long lake, the bottom of which continued to sink on the south to its present level during the Pleiocene and Pluvial periods, after which—its peculiar fauna having developed meanwhile—the lake gradually dried up, till it was represented only, as it now is, by the swampy Chuleh, the pea
