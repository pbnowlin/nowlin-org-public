isbe = [];

isbe[6601]='Orphan`or\'-fan: This word occurs once only in the Old Testament (<a onClick="return mV(\'Lam\',5,3);">La 5:3</a>, where it stands for yathom, elsewhere rendered "fatherless," and in the Septuagint always orphanos); in the Apocrypha it occurs 3 times (2Esdras 2:20; Tobit 1:8; 2Macc 8:28). There is no clear case where it means the loss of both parents. The Scriptures devote considerable attention to the widow and orphan, and the idea is that the child is fatherless. It is not found in the King James Version of the New Testament; but the Greek word orphanos occurs twice, <a onClick="return mV(\'Jhn\',14,18);">Joh 14:18</a> (the King James Version "comfortless," the Revised Version (British and American) "desolate," margin "orphans") and <a onClick="return mV(\'Jam\',1,27);">Jas 1:27</a> ("fatherless").`<a href="./study/isbe/search.html?string=FATHERLESS">FATHERLESS</a>`49';
isbe[6602]='Orthosia`or-tho-si\'-a (Orthosias; the King James Version Orthosias): The city to which Tryphon fled when he escaped from Dora, where he was besieged by Antiochus Sidetes (1Macc 15:37). According to Pliny (NH, v.17) it lay south of the river Eleutherus, and north of the city of Tripolis. The Peutinger Tables place it 12 Roman miles north of Tripolis and 30 miles south of Antaradus on the Phoenician coast. Porter would place it on the southern bank of Nahr el-Barid.``1';
isbe[6603]='Osaias`o-za\'-yas, o-sa\'-yas (Osaias; Codex Vaticanus omits): In 1Esdras 8:48 a corruption of Jeshaiah (compare <a onClick="return mV(\'Ezr\',8,19);">Ezr 8:19</a>).``1';
isbe[6604]='Osea`o-ze\'-a, o-se\'-a: In 2Esdras 13:40 equals <a href="./study/isbe/search.html?string=HOSHEA">HOSHEA</a>, king of Israel (which see).``1';
isbe[6605]='Oseas`o-ze\'-as, o-se\'-as: "Osee" in 2Esdras 1:39; the prophet Hosea.``1';
isbe[6606]='Osee`o\'-ze, o\'-se (Hosee): the King James Version in <a onClick="return mV(\'Rom\',9,25);">Ro 9:25</a>; the prophet Hosea (thus the Revised Version (British and American)).``1';
isbe[6607]='Oshea`o-she\'-a, o\'-she-a (the Revised Version (British and American) "Hoshea" (<a onClick="return mV(\'Num\',13,8,16);">Nu 13:8,16</a>)): The original name of Joshua, the son of Nun, changed by Moses (<a onClick="return mV(\'Num\',13,16);">Nu 13:16</a>) from Hoshea (hoshea\', "help") to Joshua (yehoshua\', "help of Yahweh").`<a href="./study/isbe/search.html?string=JOSHUA">JOSHUA</a>`1';
isbe[6608]='Osnappar`os-nap\'-ar (<a onClick="return mV(\'Ezr\',4,10);">Ezr 4:10</a>).`<a href="./study/isbe/search.html?string=ASHURBANIPAL">ASHURBANIPAL</a>`1';
isbe[6609]='Ospray`os\'-pra (\'ozniyah; haliaetos; Latin Pandion haliaetus): A large hawk preferring a diet of fish. The word is found in the list of abominations only. See <a onClick="return mV(\'Lev\',11,13);">Le 11:13</a>; <a onClick="return mV(\'Deu\',14,12);">De 14:12</a>. The osprey was quite similar in appearance to some of the smaller eagles, and by some it is thought that the short-toed eagle is intended. But the eagle and the gier-eagle had been specified, and on account of the osprey plunging into water for food and having feet bare to the lower leg-joint and plumage of brighter and more distinctive marking, it seems very probable that it was recognized as a distinctive species, and so named separately. Moreover, the osprey was not numerous as were other hawks and eagles. It was a bird that lived almost wholly on fish, and these were not plentiful in the waters of Palestine. This would tend to make it a marked bird, so no doubt the translation is correct as it stands, as any hawk that lived on fish would have been barred as an article of diet (see Tristram, Natural History of the Bible, 182; also Studers, Birds of North America, p. 16).``167';
isbe[6610]='Ossifrage`os\'-i-fraj (perec; gups; Let Ossifraga): The great bearded vulture known as the lammer-geier (<a onClick="return mV(\'Lev\',11,13);">Le 11:13</a>; <a onClick="return mV(\'Deu\',14,12);">De 14:12</a> the King James Version, the Revised Version (British and American) "gier-eagle"). The Hebrew name perec means "to break." Let oasis, "bone," and frangere, "to break," indicate the most noticeable habit of the bird. It is the largest of the vulture family, being 3 1/2 ft. in length and 10 in sweep. It has a white head, black beard on the chin, and the part of the eye commonly called the "white" in most animals, which is visible in but few birds, in this family is pronounced and of a deep angry red, thus giving the bird a formidable appearance. The back is grayish black, the feathers finely penciled, the shaft being white, the median line tawny. The under parts are tawny white and the feet and talons powerful. It differs from the vulture in that it is not a consistent carrion feeder, but prefers to take prey of the size captured by some of the largest eagles. It took its name from the fact that after smaller vultures and eagles had stripped a carcass to the last shred of muscle, the lammergeier then carried the skeleton aloft and dropped it repeatedly until the marrow from the broken bones could be eaten. It is also very fond of tortoise, the meat of which it secures in the same manner. As this bird frequents Southern Europe, it is thought to be the one that mistook the bald head of Aeschylus, the poet, for a stone and let fall on it the tortoise that caused his death. This bird also attacks living prey of the size of lambs, kids and hares. It is not numerous and does not flock, but pairs live in deep gorges and rocky crevices. It builds an enormous nest, deposits one pinkish or yellowish egg, and the young is black. It requires two years to develop the red eyes, finely penciled plumage and white head of the adult bird. It was included among the abominations because of its diet of carrion.``167';
isbe[6611]='Ostraca`os\'-tra-ka: The word ostracon ("potsherd," Hebrew cheres) occurs in <a onClick="return mV(\'Job\',2,8);">Job 2:8</a> (Septuagint), kai elaben ostrakon, "and he took him a potsherd." Earthen vessels were in universal use in antiquity (they are twice mentioned in the New Testament: skeue ostrakina (<a onClick="return mV(\'2Cr\',4,7);">2Co 4:7</a>; <a onClick="return mV(\'2Ti\',2,20);">2Ti 2:20</a>)), and the broken fragments of them, which could be picked up almost anywhere, were made to serve various purposes. Upon the smoothest of these pieces of unglazed pottery the poorest might write in ink his memoranda, receipts, letters or texts.<P>1. Hebrew Ostraca:<P>A fortunate discovery at Samaria (1910), made among the ruins of Ahab\'s palace, has brought to light 75 Hebrew ostraca inscribed with ink, in the Phoenician character, with accounts and memoranda relating to private matters and dating probably from the time of Ahab. Their historical contribution, aside from the mention of many names of persons and places, is slender, but for ancient Hebrew writing and to a less extent for Hebrew words and forms they are of value, while the fact that in them we possess documents actually penned in Israel in the 9th century BC gives them extraordinary interest. The nature of ostraca tends to their preservation under conditions which would quickly destroy parchment, skin or papyrus, and this discovery in Palestine encourages the hope of further and more significant finds.<P>2. Greek Ostraca:<P>Greek ostraca in large quantities have been found in Egypt, preserving documents of many kinds, chiefly tax receipts. The texts of some 2,000 of these have been published, principally by Wilcken (Griechische Ostraka, 2 volumes, 1899), and serve to illustrate in unexpected ways the everyday Greek speech of the common people of Egypt through the Ptolemaic, Roman and Byzantine periods. Like the papyri, they help to throw light on New Testament syntax and lexicography, as well as on ancient life in general.<P>3. New Testament Ostraca:<P>It is said that Cleanthes the Stoic, being too poor to buy papyrus, used to write on ostraca, but no remains of classical literature have been found on the ostraca thus far discovered. In some instances, however, Christian literary texts are preserved upon ostraca. Some years ago Bouriant bought in Upper Egypt 20 ostraca, probably of the 7th century, inscribed with the Greek text of parts of the Gospels. The ostraca are of different sizes, and preserve among others one long continuous passage (<a onClick="return mV(\'Luk\',22,\'40-71\');">Lu 22:40-71</a>), which runs over 10 of the pieces. The ostraca contain from 2 to 9 verses each, and cover <a onClick="return mV(\'Mat\',27,31,32);">Mt 27:31,32</a>; <a onClick="return mV(\'Mar\',5,40,41);">Mr 5:40,41</a> (<a onClick="return mV(\'Mar\',9,3);">9:3</a>); <a onClick="return mV(\'Mar\',9,17,18,22);">9:17,18,22</a>; <a onClick="return mV(\'Mar\',15,21);">15:21</a>; <a onClick="return mV(\'Luk\',12,\'13-16\');">Lu 12:13-16</a>; <a onClick="return mV(\'Luk\',22,\'40-71\');">22:40-71</a>; <a onClick="return mV(\'Jhn\',1,\'1-9\');">Joh 1:1-9</a>; <a onClick="return mV(\'Jhn\',1,\'14-17\');">1:14-17</a>; <a onClick="return mV(\'Jhn\',18,\'19-25\');">18:19-25</a>; <a onClick="return mV(\'Jhn\',19,\'15-17\');">19:15-17</a>. The texts are in 3 different hands, and attest the interest of the poor in the gospel in the century of the Arab conquest. Another late ostracon has a rough drawing labeled "St. Peter the evangelist," perhaps in allusion to the Gospel of Peter.<P>4. Coptic Ostraca:<P>Coptic ostraca, too, are numerous, especially from the Byzantine period, and of even more interest for Christian history than the Greek. A Sa\'idic ostracon preserves the pericope on the woman taken in adultery (<a onClick="return mV(\'Jhn\',7,\'53-\');">Joh 7:53</a>-<a onClick="return mV(\'Jhn\',8,\'1-11\');">8:11</a>), which is otherwise unattested in the Sa\'idic New Testament. A Christian hymn to Mary, akin to the canticles of Luke, and some Christian letters have been found. The work of W.E. Crum on the Coptic ostraca is of especial importance. See, further, Deissmann, Light from the Ancient East, 1910; Lyon, Harvard Theol. Review, January, 1911.``67';
isbe[6612]='Ostrich`os\'-trich (ya\'anah; strouthos; Latin Struthio camelus): The largest bird now living. The Hebrew words ya\'anah, which means "greediness," and bath ha-ya\'anah, "daughter of greediness," are made to refer to the indiscriminate diet of the ostrich, to which bird they apply; and again to the owl, with no applicability. The owl at times has a struggle to swallow whole prey it has taken, but the mere fact that it is a night hunter forever shuts it from the class of greedy and promiscuous feeders. The bodies of owls are proverbially lean like eagles. Neither did the owl frequent several places where older versions of Jeremiah and Isaiah place it; so the translations are now correctly rendered "ostrich." These birds came into the Bible because of their desert life, the companions they lived among there, and because of their night cries that were guttural, terrifying groans, like the roaring of lions. The birds were brought into many pictures of desolation, because people dreaded their fearful voices. They horned on the trackless deserts that were dreaded by travelers, and when they came feeding on the fringe of the wilderness, they fell into company with vulture, eagle, lion, jackal and adder, and joined their voices with the night hawks and owls. For these reasons no birds were more suitable for drawing strong comparisons from.<P>1. Physical Peculiarities:<P>They attained a height ranging from 6 to 8 ft., and weighed from 200 to 300 lbs. The head was small with large eyes having powerful vision, and protected by lashes. The neck was long, covered with down, and the windpipe showed, while large bites could be seen to slide down the gullet. The legs were bare, long, and the muscles like steel from the long distances covered in desert travel. The foot was much like the cloven hoof of a beast. The inner toe was 7 inches long, with a clawlike hoof, the outer, smaller with no claw. With its length and strength of leg and the weight of foot it could strike a blow that saved it from attack by beasts smaller than a leopard. The wings were small, the muscles soft and flabby. They would not bear the weight of the bird, but the habit of lifting and beating them proved that this assisted in attaining speed in running (compare Xen. Anab. i.5,2, 3). The body was covered with soft flexible feathers, the wings and tail growing long plumes, for which the bird has been pursued since the beginning of time. These exquisite feathers were first used to decorate the headdress and shields of desert chieftains, then as decorations for royalty, and later for hat and hair ornaments. The badge of the Prince of Wales is three white ostrich plumes. The females are smaller, the colors gray and white, the males a glossy black, the wing and tail plumes white. The ostrich has three physical peculiarities that stagger scientists. It has eyelashes, developed no doubt to protect the eyes from the dust and sand of desert life. On the wings are two plumeless shafts like large porcupine quills. These may be used in resisting attack. It also has a bladder like a mammal, that collects uric acid, the rarest organ ever developed in a feathered creature.<P>2. Eggs and Care of Young:<P>These birds homed on the deserts of Arabia and at the lower end of the great Salt Sea. Here the ostrich left her eggs on the earth and warmed them in the sand. That they were not hard baked was due to the fact that they were covered for protection during the day and brooded through the cooler nights. The eggs average 3 lbs. weight. They have been used for food in the haunts of the ostrich since the records of history began, and their stout shells for drinking-vessels. It is the custom of natives on finding a nest to take a long stick and draw out an egg. If incubation has advanced enough to spoil the eggs for use, the nest is carefully covered and left; if fresh, they are eaten, one egg being sufficient for a small family. No doubt these were the eggs to which Job referred as being tasteless without salt (<a onClick="return mV(\'Job\',6,6);">Job 6:6</a>). The number of eggs in the nest was due to the fact that the birds were polygamous, one male leading from 2 to 7 females, all of which deposited their eggs in a common nest. When several females wanted to use the nest at the same time, the first one to reach it deposited her egg in it, and the others on the sand close beside. This accounts for the careless habits of the ostrich as to her young. In this communal nest, containing from 2 to 3 dozen eggs, it is impossible for the mother bird to know which of the young is hers. So all of them united in laying the eggs and allowing the father to look after the nest and the young. The bird first appears among the abominations in <a onClick="return mV(\'Lev\',11,16);">Le 11:16</a> the Revised Version (British and American) the King James Version "owl"; <a onClick="return mV(\'Deu\',14,16);">De 14:16</a>, the Revised Version (British and American) "little owl," the King James Version "owl." This must have referred to the toughness of grown specimens, since there was nothing offensive in the bird\'s diet to taint its flesh and the young tender ones were delicious meat. In his agony, Job felt so much an outcast that he cried:<P class="in15">"I am a brother to jackals,<P class="in15">And a companion to ostriches" (<a onClick="return mV(\'Job\',30,29);">Job 30:29</a>).<P>Again he records that the Almighty discoursed to him about the ostrich in the following manner:<P class="in15">"The wings of the ostrich wave proudly;<P class="in15">But are they the pinions and plumage of love?" etc.<P>(<a onClick="return mV(\'Job\',39,\'13-18\');">Job 39:13-18</a>).<P>3. Old Testament References:<P>The ostrich history previously given explains all this passage save the last two verses, the first of which is a reference to the fact that the Arabs thought that the ostrich was a stupid bird, because, when it had traveled to the point of exhaustion, it hid its head and thought its body safe, and because some of its eggs were found outside the nest. The second was due to a well-known fact that, given a straight course, the ostrich could outrun a horse. The birds could attain and keep up a speed of 60 miles an hour for the greater part of half a day and even longer, hence, it was possible to capture them only by a system of relay riders (Xenophon, op. cit.) When Isaiah predicted the fall of Babylon, he used these words: "But wild beasts of the desert shall lie there; and their houses shall be full of doleful creatures; and ostriches shall dwell there, and wild goats shall dance there" (<a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>). Because this was to be the destruction of a great city, located on the Euphrates River and built by the fertility and prosperity of the country surrounding it, and the ruins those of homes, the bird indicated by every natural condition would be the owl. The wild goats clambering over the ruins would be natural companions and the sneaking wolves—but not the big bird of daytime travel, desert habitation, accustomed to constant pursuit for its plumage. Exactly the same argument applies to the next reference by the same writer (<a onClick="return mV(\'Isa\',34,13);">Isa 34:13</a>). "And the wild beasts of the desert shall meet with the wolves, and the wild goat shall cry to his fellow; yea, the night monster shall settle there, and shall find her a place of rest" (<a onClick="return mV(\'Isa\',34,14);">Isa 34:14</a>). "The beasts of the field shall honor me, the jackals and the ostriches; because I give waters in the wilderness, and rivers in the desert, to give drink to my people, my chosen" (<a onClick="return mV(\'Isa\',43,20);">Isa 43:20</a>). Here we find the ostrich in its natural location, surrounded by creatures that were its daily companions. The next reference also places the bird at home and in customary company: "Therefore the wild beasts of the desert with the wolves shall dwelI there, and the ostriches (the King James Version "owls") shall dwell therein: and it shall be no more inhabited forever; neither shall it be dwelt in from generation to generation" (<a onClick="return mV(\'Jer\',50,39);">Jer 50:39</a>).<P class="in15">"Even the jackals draw out the breast, they give suck to their young ones:<P class="in15">The daughter of my people is become cruel, like the ostriches in the wilderness" (<a onClick="return mV(\'Lam\',4,3);">La 4:3</a>).<P>This reference is made to the supposed cruelty of the ostrich in not raising its young.``167';
isbe[6613]='Othni`oth\'-ni (\'othni, meaning unknown): A son of Shemaiah, a Korahite Levite (<a onClick="return mV(\'1Ch\',26,7);">1Ch 26:7</a>).``1';
isbe[6614]='Othniel`oth\'-ni-el (\'othni\'el): A hero in Israel, son of Kenaz, Caleb\'s younger brother. He conquered Kiriath-sepher, later known as Debir, in the territory of Judah in the days of Joshua, and was given the daughter of Caleb, Achsah, to wife as a reward (<a onClick="return mV(\'Jos\',15,17);">Jos 15:17</a>, parallel found in <a onClick="return mV(\'Jdg\',1,13);">Jud 1:13</a>). He later smote Cushan-rishathaim, king of Mesopotamia, whom the children of Israel had served 8 years, and thus not only saved the Israelites, but by reviving national sentiment among them (compare Ant, V, iv, 3), and reestablishing government, became the first of those hero-rulers known as "judges." The effects of his victory lasted an entire generation (40 years, <a onClick="return mV(\'Jdg\',3,\'9-11\');">Jud 3:9-11</a>). He had a son named Hathath (<a onClick="return mV(\'1Ch\',4,13);">1Ch 4:13</a>) and probably another named Meonothai (compare recensio Luciana of Septuagint, at the place). In the days of David we find a family bearing the name of Othniel, from which came Heldai the Metophathite, captain of the twelfth month (<a onClick="return mV(\'1Ch\',27,15);">1Ch 27:15</a>).``81';
isbe[6615]='Othonias`oth-o-ni\'-as (Othonias): One of those who had taken "strange wives" (1Esdras 9:28) equals "Mattaniah" of <a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>.``1';
isbe[6616]='Ouches`ouch\'-ez, -iz (mishbetsoth (<a onClick="return mV(\'Exd\',28,11,13,14,25);">Ex 28:11,13,14,25</a>; <a onClick="return mV(\'Exd\',39,6,13,16,18);">39:6,13,16,18</a>) the American Standard Revised Version "settings," but in <a onClick="return mV(\'Exd\',39,13);">Ex 39:13</a>, "inclosings"): The secondary meaning of this now archaic word is the gold or silver setting of a precious stone. In Exodus, where it occurs 8 times, it is clear that the gold settings of the engraved stones forming the breast-plate of the high priest are intended; the onyx stones forming the fibula or brooch for holding together the two sides of the breast-plate being said to be "enclosed in ouches (settings) of gold" (<a onClick="return mV(\'Exd\',39,6);">Ex 39:6</a>). Not only were these two onyx or beryl stones so set, but the 12 stones forming the front of the breast-plate were "inclosed in gold in their settings" (<a onClick="return mV(\'Exd\',28,20);">Ex 28:20</a>). The same word occurs in <a onClick="return mV(\'Psa\',45,13);">Ps 45:13</a>, where the king\'s daughter is said to have her clothing "in-wrought with gold," i.e. embroidered with gold thread or wire. <a onClick="return mV(\'Exd\',39,3);">Ex 39:3</a> tells us how this wire was produced. From this fact it may be inferred that the settings of the breast-plate were not solid pieces of gold, but were formed of woven wire wreathed round the stones, in a sort of filigree.`<a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`17';
isbe[6617]='Outcast`out\'-kast: Represents some form of dachah, or nadhach, both meaning "thrust out." In <a onClick="return mV(\'Jer\',30,17);">Jer 30:17</a> "outcast" means "thrust out of society," "degraded person"; elsewhere it means "exile" (<a onClick="return mV(\'Psa\',147,2);">Ps 147:2</a>; <a onClick="return mV(\'Isa\',16,3);">Isa 16:3</a>f; <a onClick="return mV(\'Jer\',49,36);">Jer 49:36</a>).``1';
isbe[6618]='Outer`out\'-er: This adjective is used 12 times by Ezekiel of the outside court of the temple. In Matthew we find it 3 times (<a onClick="return mV(\'Eze\',8,12);">8:12</A>; <a onClick="return mV(\'Eze\',22,13);">22:13</A>; <a onClick="return mV(\'Eze\',25,30);">25:30</A>) in "outer darkness" (to skotos to exoteron), which typifies the utter darkness of the doom of the lost.``1';
isbe[6619]='Outgoing`out\'-go-ing: In <a onClick="return mV(\'Psa\',65,8);">Ps 65:8</a>, "Thou makest the outgoings of the morning and evening to rejoice," the Hebrew is motsa\'. The word (from yatsa\', "to go forth") refers to the "going forth" of the sun, and so means "east" (as in <a onClick="return mV(\'Psa\',75,6);">Ps 75:6</a>). The connection of motsa\' with "evening" is therefore zeugmatic, but the meaning is clear and there are extra-Biblical parallels (compare "the two Orients"). In <a onClick="return mV(\'Jos\',17,18);">Jos 17:18</a>, the King James Version uses "outgoings" for the Hebrew totsa\'oth (also from yatsa\'), where the meaning is "extremity" (the Revised Version (British and American) "goings out," as in <a onClick="return mV(\'Num\',34,5);">Nu 34:5</a>, etc.). "Outwent" occurs in the margin of <a onClick="return mV(\'Mar\',6,33);">Mr 6:33</a>.``48';
isbe[6620]='Outlandish`out-land\'-ish (<a onClick="return mV(\'Neh\',13,26);">Ne 13:26</a>, the King James Version "Him did outlandish women cause to sin") "Outlandish" in modern English is colloquial only and with the sense "utterly extraordinary," but the King James Version uses it in the literal meaning "out of the land," "foreign," the English Revised Version "strange women," the American Standard Revised Version "foreign women," Hebrew nokhri, "foreign."``1';
isbe[6621]='Outrage; Outrageous`out\'-raj, out-ra\'-jus: The noun (from the French outre plus age, "that which goes beyond") only in the heading to <a onClick="return mV(\'Psa\',10,\'1-\');">Ps 10</a> the King James Version; the adjective in <a onClick="return mV(\'Pro\',27,4);">Pr 27:4</a>, the King James Version and the English Revised Version, for sheteph, "flood." "Anger is overwhelming" (American Standard Revised Version), is much better.``1';
isbe[6622]='Outroads`out\'-rodz (exodeuo, "to go forth," "to make a military expedition"; the King James Version and the Revised Version (British and American) in 1Macc 15:41, "horsemen...that they might make outroads upon the ways of Judah"; 1Esdras 4:23, the Revised Version (British and American) "goeth forth to make outroads"): "Outroads" is obsolete, but its opposite, "inroads," is still good English.``1';
isbe[6623]='Outward Man`out\'-werd, (exo, "outside," "without," "out of doors"): The body, subject to decay and death, in distinction from the inner man, the imperishable spiritual life which "is renewed day by day" (<a onClick="return mV(\'2Cr\',4,16);">2Co 4:16</a>); also the body as the object of worldly thought and pride in external dress and adornment (<a onClick="return mV(\'1Pe\',3,3);">1Pe 3:3</a>).`<a href="./study/isbe/search.html?string=MAN,+NATURAL">MAN, NATURAL</a>; <a href="./study/isbe/search.html?string=MAN">MAN</a>`1';
isbe[6624]='Oven`uv\'-\'-n.`<a href="./study/isbe/search.html?string=BREAD">BREAD</a>; <a href="./study/isbe/search.html?string=FURNACE">FURNACE</a>`1';
isbe[6625]='Overcharge`o-ver-charj\':<a onClick="return mV(\'Luk\',21,34);">Lu 21:34</a>, "lest haply your hearts be overcharged with drunkenness" (baruno, "burden," here with the force "be occupied with"); <a onClick="return mV(\'2Cr\',2,5);">2Co 2:5</a>, the King James Version "that I may not overcharge you" (epibareo, "overload"), the Revised Version (British and American) "that I press not too heavily."`<a href="./study/isbe/search.html?string=CHARGES">CHARGES</a>`1';
isbe[6626]='Overpass`o-ver-pas\':A special translation of the very common verb \'abhar, "to pass over," found in English Versions of the Bible of <a onClick="return mV(\'Psa\',57,1);">Ps 57:1</a> and <a onClick="return mV(\'Isa\',26,20);">Isa 26:20</a> in the sense "to pass by," and in <a onClick="return mV(\'Jer\',5,28);">Jer 5:28</a> with the meaning "to overflow."``1';
isbe[6627]='Overplus`o\'-ver-plus: <a onClick="return mV(\'Lev\',25,27);">Le 25:27</a>, for \'adhaph, "excess."``1';
isbe[6628]='Overseer`o-ver-se\'-er, or -ser\':One who overlooks, inspects; in the Old Testament from natsach (<a onClick="return mV(\'2Ch\',2,18);">2Ch 2:18</a>; in <a onClick="return mV(\'2Ch\',34,13);">2Ch 34:13</a> the Revised Version (British and American) changes to "set forward"), and paqadh (<a onClick="return mV(\'Gen\',39,4,5);">Ge 39:4,5</a>; <a onClick="return mV(\'2Ch\',34,12,17);">2Ch 34:12,17</a>; the Revised Version (British and American) has this word for the King James Version "officers" in <a onClick="return mV(\'Gen\',41,34);">Ge 41:34</a>, and for "rulers" in <a onClick="return mV(\'1Ch\',26,32);">1Ch 26:32</a>); in the New Testament once for episkopos, in <a onClick="return mV(\'Act\',20,28);">Ac 20:28</a>, where the Revised Version (British and American) has "bishops" (margin "overseers"; compare <a onClick="return mV(\'1Pe\',5,2);">1Pe 5:2</a>).`<a href="./study/isbe/search.html?string=BISHOP">BISHOP</a>`1';
isbe[6629]='Owl`oul (bath ha-ya\'anah; Latin Ulula): The name of every nocturnal bird of prey of the Natural Order Striges. These birds range from the great horned owl of 2 feet in length, through many subdivisions to the little screech-owl of 5 inches. All are characterized by very large heads, many have ear tufts, all have large eyes surrounded by a disk of tiny, stiff, radiating feathers. The remainder of the plumage has no aftershaft. So these birds make the softest flight of any creature traveling on wing. A volume could be written on the eye of the owl, perhaps its most wonderful feature being in the power of the bird to enlarge the iris if it wishes more distinct vision. There is material for another on the prominent and peculiar auditory parts. With almost all owls the feet are so arranged that two toes can be turned forward and two back, thus reinforcing the grip of the bird by an extra toe and giving it unusual strength of foot. All are night-hunters, taking prey to be found at that time, of size according to the strength. The owl was very numerous in the caves, ruined temples and cities, and even in the fertile valleys of Palestine. It is given place in the Bible because it was considered unfit for food and because people dreaded the cries of every branch of the numerous family. It appeared often, as most birds, in the early versions of the Bible; later translators seem to feel that it was used in several places where the ostrich really was intended (see <a href="./study/isbe/search.html?string=OSTRICH">OSTRICH</a>). It would appear to a natural historian that the right bird could be selected by the location, where the text is confusing. The ostrich had a voice that was even more terrifying, when raised in the night, than that of the owl. But it was a bird of the desert, of wide range and traveled only by day. This would confine its habitat to the desert and the greenery where it joined fertile land, but would not bring it in very close touch with civilization. The owl is a bird of ruins, that lay mostly in the heart of rich farming lands, where prosperous cities had been built and then destroyed by enemies. Near these locations the ostrich would be pursued for its plumage, and its nesting conditions did not prevail. The location was strictly the owl\'s chosen haunt, and it had the voice to fit all the requirements of the text. In the lists of abominations, the original Hebrew yanshuph, derived from a root meaning twilight, is translated "great owl" (see <a onClick="return mV(\'Lev\',11,17);">Le 11:17</a> and <a onClick="return mV(\'Deu\',14,16);">De 14:16</a>). It is probable that this was a bird about 2 ft. in length, called the eagle-owl. In the same lists the word koc (nuktikorax) refers to ruins, and the bird indicated is specified as the "little owl," that is, smaller than the great owl—about the size of our barn owl. This bird is referred to as the "mother of ruins," and the translations that place it in deserted temples and cities are beyond all doubt correct. Qippoz (echinos) occurs once (<a onClick="return mV(\'Isa\',34,15);">Isa 34:15</a>), and is translated "great owl" in former versions; lately (in the American Standard Revised Version) it is changed to "dart-snake" (the English Revised Version "arrowsnake"). In this same description lilith (onokentauros), "a specter of night," was formerly screech-owl, now it reads "night monster," which is more confusing and less suggestive. The owls in the lists of abominations (<a onClick="return mV(\'Lev\',11,17,18);">Le 11:17,18</a>; <a onClick="return mV(\'Deu\',14,16);">De 14:16</a>) are the little owl, the great owl and the horned owl. The only other owl of all those that produced such impressions of desolation in the Books of Isaiah, Jeremiah, Job, and Micah is referred to in <a onClick="return mV(\'Psa\',102,6);">Ps 102:6</a>:<P class="in15">"I am like a pelican of the wilderness;<br>I am become as an owl of the waste places."<P>Here it would appear that the bird habitual to the wilderness and the waste places, that certainly would be desert, would be the ostrich—while in any quotation referring to ruins, the owl would be the bird indicated by natural conditions.``167';
isbe[6630]='Owl, Great`(yanshuph; Septuagint ibis, or eibis): A member of the Palestine species of the family Strigidae. The great owl mentioned in the Bible was no doubt their largest specimen of the family, a bird fully 2 ft. in length, full feathered, with unusually large head and long ear tufts. It was a formidable and noble-appearing bird, with resounding voice. It was abundant among the ruins of temples, the tombs of Carmel, the caves of Gennesaret, and among the ruined cities of Southern Judah. It is included in the abomination lists of <a onClick="return mV(\'Lev\',11,17);">Le 11:17</a> and <a onClick="return mV(\'Deu\',14,16);">De 14:16</a>.`<a href="./study/isbe/search.html?string=OWL">OWL</a>`167';
isbe[6631]='Owl, Little`(koc; nuktikorax; Latin Athene meridionalis): A night bird of prey distinguished by a round head, and extremely large eyes. The little owl is left in the Revised Version (British and American) only in the lists of abominations (see <a onClick="return mV(\'Lev\',11,17);">Le 11:17</a>; <a onClick="return mV(\'Deu\',14,16);">De 14:16</a>).`<a href="./study/isbe/search.html?string=OWL">OWL</a>`1';
isbe[6632]='Owl, Screech``<a href="./study/isbe/search.html?string=NIGHT-MONSTER">NIGHT-MONSTER</a>`1';
isbe[6633]='Owner`on\'-er.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[6634]='Ox (1)``<a href="./study/isbe/search.html?string=ANTELOPE">ANTELOPE</a>; <a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>; <a href="./study/isbe/search.html?string=WILD+OX">WILD OX</a>`1';
isbe[6635]='Ox (2)`oks (Ox): One of the ancestors of Judith (Judith 8:1). The name is not Hebrew. Perhaps the Itala Ozi and the Syriac Uz point to the Hebrew Uzzi.``1';
isbe[6636]='Ox-Goad`oks\'-god.`<a href="./study/isbe/search.html?string=GOAD">GOAD</a>`1';
isbe[6637]='Ozem`o\'-zem (\'otsem, meaning unknown):<P>(1) The 6th son of David (<a onClick="return mV(\'1Ch\',2,15);">1Ch 2:15</a>). Septuagint (Asom) and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) suggest that the name should be pointed \'atsom.<P>(2) A "son" of Jerahmeel (<a onClick="return mV(\'1Ch\',2,25);">1Ch 2:25</a>).``1';
isbe[6638]='Ozias`o-zi\'-as:<P>(1) (Ozeias, Ozias, Codex Vaticanus a b): The son of Micah, a Simeonite, one of the 3 rulers of Bethulia in the days of Judith (Judith 6:15,16; 7:23; 8:9ff; 10:6).<P>(2) (Ozeias, Codex Vaticanus and Swete; the King James Version has Ezias (1Esdras 8:2), following Codex Alexandrinus Ezias): An ancestor of Ezra (1Esdras 8:2; 2Esdras 1:2) equals "Uzzi" of <a onClick="return mV(\'Ezr\',7,4);">Ezr 7:4</a>; <a onClick="return mV(\'1Ch\',6,51);">1Ch 6:51</a>.<P>(3) Head of a family of temple-servants who returned with Zerubbabel (1Esdras 5:31) equals "Uzza" of <a onClick="return mV(\'Ezr\',2,49);">Ezr 2:49</a>; <a onClick="return mV(\'Neh\',7,51);">Ne 7:51</a>.<P>(4) Greek form of <a href="./study/isbe/search.html?string=UZZIAH">UZZIAH</a> (which see) in <a onClick="return mV(\'Mat\',1,8,9);">Mt 1:8,9</a> the King James Version. A king of Judah.``5';
isbe[6639]='Oziel`o\'-zi-el (Ozeiel): An ancestor of Judith (Judith 8:1); another form of the Old Testament name "Uzziel."``1';
isbe[6640]='Ozni`oz\'-ni (\'ozni, "my hearing," or "my ear"): A "son" of Gad (<a onClick="return mV(\'Num\',26,16);">Nu 26:16</a>) equals "Ezbon" of <a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a> (compare <a onClick="return mV(\'1Ch\',7,7);">1Ch 7:7</a>).``1';
isbe[6641]='Oznites`oz\'-nits (with the article ha\'ozni (collective), "the Oznites"): Of the clan of Ozni (<a onClick="return mV(\'Num\',26,16);">Nu 26:16</a>).`<a href="./study/isbe/search.html?string=OZNI">OZNI</a>`1';
isbe[6642]='Ozora`o-zo\'-ra.`<a href="./study/isbe/search.html?string=EZORA">EZORA</a>`1';
isbe[6643]='Paarai`pa\'-a-ri (pa\'aray, "devotee of Peor"): One of David\';s 37 valiant men (<a onClick="return mV(\'2Sa\',23,35);">2Sa 23:35</a>). Doubtless the "Naarai" of <a onClick="return mV(\'1Ch\',11,37);">1Ch 11:37</a>.``1';
isbe[6644]='Pacatiana`pa-ka-ti-a\'-na, pak-a-ti\'-a-na (Pakatiane): About 295 AD, when the province of Asia was broken up, two new provinces were formed, Phrygia Prima (Pacatiana), of which Laodicea was "the chiefest city" (subscription to 1Ti the King James Version), and Phrygia Secunda (Salutaris).`<a href="./study/isbe/search.html?string=PHRYGIA">PHRYGIA</a>`1';
isbe[6645]='Pace`pas (tsa\'adh): A step in <a onClick="return mV(\'2Sa\',6,13);">2Sa 6:13</a>, hence, about one yard.``1';
isbe[6646]='Pachon`pa\'-kon (Pachon): The name of a month mentioned in 3Macc 6:38.``1';
isbe[6647]='Paddan`pad\'-an (<a onClick="return mV(\'Gen\',48,7);">Ge 48:7</a>; the King James Version Padan, padan).`<a href="./study/isbe/search.html?string=PADDAN+ARAM+">PADDAN ARAM </a>`1';
isbe[6648]='Paddan-Aram`pad\'-an-a\'-ram or p.-ar\'-am (paddan \'aram; Septuagint Mesopotamia tes Surias; the King James Version Padan-aram): In <a onClick="return mV(\'Gen\',48,7);">Ge 48:7</a>, Paddan stands alone, but as the Septuagint, Sam, and Peshitta read "Aram" also, it must in this verse have dropped out of the Massoretic Text. In the time of Abraham, padanu occurs on the Babylonian contract-tablets as a land measure, to which we may compare the Arabic feddan or "ox-gang." In the Assyrian syllabaries it is the equivalent of iklu, "a field," so that Paddan-aram would mean "the field of Aram," and with this we may compare <a onClick="return mV(\'Hsa\',12,12);">Ho 12:12 (Hebrew 12:13)</a> and the use of the Hebrew sadheh in connection with Moab and Edom (<a onClick="return mV(\'Jdg\',5,4);">Jud 5:4</a>; <a onClick="return mV(\'Rth\',1,6);">Ru 1:6</a>).<P>Furthermore, \'padanu and harranu are given as synonyms with the meaning of "road."<P>Paddan-aram occurs only in the Priestly Code (P), but it corresponds to the "Haran" of the older documents. The versions agree in translating both as Mesopotamia, and identify with the home of the patriarchs and the scene of Jacob\'s exile the district of Haran to the east of the Upper Euphrates valley. More in harmony with the length of Jacob\'s flight, as indicated by the time given (<a onClick="return mV(\'Gen\',31,22,23);">Ge 31:22,23</a>), is Harran-el-\'Awamid, an ancient site 10 miles to the east of Damascus, which satisfies all the demands of history.`<a href="./study/isbe/search.html?string=ARAM">ARAM</a>`23';
isbe[6649]='Paddle`pad\'-\'-l (yathedh): <a onClick="return mV(\'Deu\',23,13);">De 23:13 (Hebrew 14)</a>, the Revised Version margin "shovel."``1';
isbe[6650]='Padon`pa\'-don (padhon, "redemption"): One of the Nethinim (see <a href="./study/isbe/search.html?string=UPPERCASE">NETHINIM</A>) who returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,44);">Ezr 2:44</a>; <a onClick="return mV(\'Neh\',7,47);">Ne 7:47</a>); the "Phaleas" of 1Esdras 5:29 (margin "Padon").``1';
isbe[6651]='Pagiel`pa\'-gi-el, pa\'-ji-el, pa-gi\'-el (pagh\'i\'el, "God\'s intervention"): Son of Ocran, of the tribe of Asher, among those enrolled by Moses at the numbering of Israel (<a onClick="return mV(\'Num\',1,13);">Nu 1:13</a>; <a onClick="return mV(\'Num\',2,27);">2:27</a>). When the tabernacle was set up, the heads of the families of Israel "brought their offerings" in rotation, and Pagiel, as prince of his tribe, came on the 11th day (<a onClick="return mV(\'Num\',7,72);">Nu 7:72</a>). <a onClick="return mV(\'Num\',7,\'72-77\');">Nu 7:72-77</a> describes his offering. In the journeyings of Israel he was "over the host of the tribe of the children of Asher" (<a onClick="return mV(\'Num\',10,26);">Nu 10:26</a>), and possibly standard-bearer (compare <a onClick="return mV(\'Num\',10,14,22,25);">Nu 10:14,22,25</a>).``186';
isbe[6652]='Pahath-Moab`pa\'-hath-mo\'-ab (pachath mo\'abh, "sheik of Moab"; in 1Esdras 5:11; 8:31, "Phaath Moab"): A Jewish clan probably named after an ancestor of the above title. Part of the clan returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,6);">Ezr 2:6</a>; compare <a onClick="return mV(\'Neh\',7,11);">Ne 7:11</a>) under two family names, Jeshua and Joab; and a part came back with Ezra (<a onClick="return mV(\'Ezr\',8,4);">Ezr 8:4</a>). Hashub, a "son of Pahath-moab," is named among the repairers of both the wall and the "tower of the furnaces" at Jerusalem (<a onClick="return mV(\'Neh\',3,11);">Ne 3:11</a>). It is the name of one of the signatories "sealing" the "sure covenant" of <a onClick="return mV(\'Neh\',9,38);">Ne 9:38</a> (<a onClick="return mV(\'Neh\',10,14);">Ne 10:14</a>). Some of the sons of this name had taken "strange wives" (<a onClick="return mV(\'Ezr\',10,30);">Ezr 10:30</a>)``186';
isbe[6653]='Pai`pa\'-i (pa\'i; Phogor): The royal city of Hadad or Hadar, king of Edom (<a onClick="return mV(\'1Ch\',1,50);">1Ch 1:50</a>). The name is given as "Pau" (pa\'u) in <a onClick="return mV(\'Gen\',36,39);">Ge 36:39</a>. There is no indication of its position. It is not identified.``1';
isbe[6654]='Pain`pan (chul, chil, chebhel, chalah, chalchalah, ka\'-ebh, ke\'ebh, metsar, makh\'obh, \'amal, tsir; basanizo, ponos, odin): These words signifying various forms of bodily or mental suffering are generally translated "pain"; 28 out of the 34 passages in which the word is used are in the poetical or prophetical books and refer to conditions of mental disquiet or dismay due to the punishment of personal or national sin. There is only one instance where the word is used as a historic record of personal physical pain: the case of the wife of Phinehas (<a onClick="return mV(\'1Sa\',4,19);">1Sa 4:19</a>), but the same word tsir is used figuratively in <a onClick="return mV(\'Isa\',13,8);">Isa 13:8</a>; <a onClick="return mV(\'Isa\',21,3);">21:3</a>; <a onClick="return mV(\'Dan\',10,16);">Da 10:16</a>, and translated "pangs" or "sorrows." In other passages where we have the same comparison of consternation in the presence of God\'s judgments to the pangs of childbirth, the word used is chebhel, as in <a onClick="return mV(\'Isa\',66,7);">Isa 66:7</a>; <a onClick="return mV(\'Jer\',13,21);">Jer 13:21</a>; <a onClick="return mV(\'Jer\',22,23);">22:23</a>; <a onClick="return mV(\'Jer\',49,24);">49:24</a>. In some of these and similar passages several synonyms are used in the one verse to intensify the impression, and are translated "pain," "pangs," and "sorrows," as in <a onClick="return mV(\'Isa\',13,8);">Isa 13:8</a>.<P>The word most commonly used by the prophets is some form of chul or chil, sometimes with the addition "as of a woman in travail," as in <a onClick="return mV(\'Psa\',48,6);">Ps 48:6</a>; <a onClick="return mV(\'Isa\',26,18);">Isa 26:18</a>; <a onClick="return mV(\'Jer\',6,24);">Jer 6:24</a>; <a onClick="return mV(\'Jer\',22,23);">22:23</a>; <a onClick="return mV(\'Mic\',4,10);">Mic 4:10</a>. This pain is referred to the heart (<a onClick="return mV(\'Psa\',55,4);">Ps 55:4</a>) or to the head (<a onClick="return mV(\'Jer\',30,23);">Jer 30:23</a>; compare <a onClick="return mV(\'Jer\',30,5,6);">Jer 30:5,6</a>). In <a onClick="return mV(\'Eze\',30,4);">Eze 30:4</a>, it is the penal affliction of Ethiopia, and in <a onClick="return mV(\'Eze\',30,16);">30:16</A>, the King James Version "Sin (Tanis) shall have great pain" (the Revised Version (British and American) "anguish"); in <a onClick="return mV(\'Isa\',23,5);">Isa 23:5</a> Egypt is sorely pained at the news of the fall of Tyre. Before the invading host of locusts the people are much pained (<a onClick="return mV(\'Joe\',2,6);">Joe 2:6</a> the King James Version). Pain in the sense of toil and trouble in <a onClick="return mV(\'Jer\',12,13);">Jer 12:13</a> is the translation of chalah a word more frequently rendered grieving or sickness, as in <a onClick="return mV(\'1Ki\',14,1);">1Ki 14:1</a>; <a onClick="return mV(\'Pro\',23,35);">Pr 23:35</a>; <a onClick="return mV(\'Sgs\',2,5);">So 2:5</a>; <a onClick="return mV(\'Jer\',5,3);">Jer 5:3</a>. The reduplicated form chalchalah is especially used of a twisting pain usually referred to the loins (<a onClick="return mV(\'Isa\',21,3);">Isa 21:3</a>; <a onClick="return mV(\'Eze\',30,4,9);">Eze 30:4,9</a>; <a onClick="return mV(\'Nah\',2,10);">Na 2:10</a>).<P>Pain in the original meaning of the word (as it has come down to us through the Old French from the Latin poena) as a penalty inflicted for personal sin is expressed by the words ka\'ebh or ke\'abh in <a onClick="return mV(\'Job\',14,22);">Job 14:22</a>; <a onClick="return mV(\'Job\',15,20);">15:20</a>, and in the questioning complaint of the prophet (<a onClick="return mV(\'Jer\',15,18);">Jer 15:18</a>). As a judgment on personal sin pain is also expressed by makh\'obh in <a onClick="return mV(\'Job\',33,19);">Job 33:19</a>; <a onClick="return mV(\'Jer\',51,8);">Jer 51:8</a>, but this word is used in the sense of afflictions in <a onClick="return mV(\'Isa\',53,3);">Isa 53:3</a> in the expression "man of sorrows." The Psalmist (<a onClick="return mV(\'Psa\',25,18);">Ps 25:18</a>) praying for deliverance from the afflictions which weighed heavily on him in turn uses the word \'amal, and this word which primarily means "toil" or "labor," as in <a onClick="return mV(\'Ecc\',1,3);">Ec 1:3</a>, or "travail" as in <a onClick="return mV(\'Isa\',53,11);">Isa 53:11</a>, is translated "painful" in <a onClick="return mV(\'Psa\',73,16);">Ps 73:16</a>, as expressing Asaph\'s disquiet due to his misunderstanding of the ways of Providence. The "pains of hell" (<a onClick="return mV(\'Psa\',116,3);">Ps 116:3</a> the King James Version), which got hold of the Psalmist in his sickness, is the rendering of the word metsar; the same word is translated "distress" in <a onClick="return mV(\'Psa\',118,5);">Ps 118:5</a>. Most of these words have a primary physical meaning of twisting, rubbing or constricting.<P>In the New Testament, odin is translated "pain" (of death, the Revised Version (British and American) "pang") in <a onClick="return mV(\'Act\',2,24);">Ac 2:24</a>. This word is used to express any severe pain, such as that of travail, or (as in Aeschylus, Choephori, 211) the pain of intense apprehension. The verb from this, odunomai, is used by the Rich Man in the parable to describe his torment (the Revised Version (British and American) "anguish") (<a onClick="return mV(\'Luk\',16,24);">Lu 16:24</a>). The related verb sunodino is used in <a onClick="return mV(\'Rom\',8,22);">Ro 8:22</a> and is translated "travailing in pain together." In much the same sense, the word is used by Euripides (Helena, 727).<P>In <a onClick="return mV(\'Rev\',12,2);">Re 12:2</a> the woman clothed with the sun (basanizomene) was in pain to be delivered; the verb (basanizo) which means "to torture" is used both in <a onClick="return mV(\'Mat\',8,6);">Mt 8:6</a> in the account of the grievously tormented centurion\'s servant, and in the description of the laboring of the apostles\' boat on the stormy Sea of Galilee (<a onClick="return mV(\'Mat\',14,24);">Mt 14:24</a>). The former of these seems to have been a case of spinal meningitis. This verb occurs in Thucydides vii.86 (viii.92), where it means "being put to torture." In the two passages in Revelation where pain is mentioned the word is ponos, the pain which affected those on whom the fifth vial was poured (<a onClick="return mV(\'Rev\',16,10);">16:10</A>), and in the description of the City of God where there is no more pain (<a onClick="return mV(\'Rev\',21,4);">21:4</A>). The primary meaning of this word seems to be "toil," as in Iliad xxi.525, but it is used by Hippocrates to express disease (Aphorisma iv.44).``107';
isbe[6655]='Painfulness`pan\'-fool-nes (mochthos): In the summary of his missionary labors in <a onClick="return mV(\'2Cr\',11,27);">2Co 11:27</a> the King James Version, Paul uses this word. The Revised Version (British and American) renders it "travail," which probably now expresses its meaning more closely, as in modern usage "painfulness" is usually restricted to the condition of actual soreness or suffering, although we still use "painstaking" in the sense of careful labor. The Greek word is used for toil or excessive anxiety, as in Euripides (Medea, 126), where it refers to that care for her children which she had lost in her madness. Tyndale uses "painfulness" in <a onClick="return mV(\'1Jo\',4,18);">1Joh 4:18</a> as the translation of kolasis, which the King James Version renders "torment" and the Revised Version (British and American) "punishment."``107';
isbe[6656]='Paint`pant (from Old French peinctre, frequentative of peindre, Latin pingo, "to paint"):<P>(1) From Hebrew verb mashach, "to smear," "to anoint," "to paint," describing the painting of interiors with vermilion, perhaps resembling lacquer: "ceiled with cedar, and painted with vermilion" (<a onClick="return mV(\'Jer\',22,14);">Jer 22:14</a>). The shields of the Ninevite soldiers were red, presumably painted (<a onClick="return mV(\'Nah\',2,3);">Na 2:3</a>).<P>(2) From noun pukh, "paint," "antimon," "stibium," "black mineral powder" used as a cosmetic, to lend artificial size and fancied beauty to the eye, always spoken of as a meretricious device, indicating light or unworthy character. Jezebel "painted her eyes, and attired her head" (<a onClick="return mV(\'2Ki\',9,30);">2Ki 9:30</a>, literally, "put pukh into her eyes"). To the harlot city Jerusalem, Jeremiah (<a onClick="return mV(\'Jer\',4,30);">4:30</a>) says, "deckest thee..., enlargest thine eyes with paint" (pukh). the King James Version renders "rentest thy face," as if the stain were a cut, or the enlarging done by violence.<P>(3) From verb kachal, "to smear," "to paint." Ezekiel says to Oholah-Oholibah (Judah-Israel), "didst wash thyself, paint (kachal) thine eyes," as the adulteress prepares herself for her paramour (<a onClick="return mV(\'Eze\',23,40);">Eze 23:40</a>). The antimony, in an extremely fine powder (Arabic kuchl, from kachal), is placed in the eye by means of a very fine rod, bodkin, or probe, drawn between the edges of the eyelids. This distends the eye, and also increases its apparent size, the effect being increased by a line of stain drawn from the corner, and by a similar line prolonging the eyebrow.`<a href="./study/isbe/search.html?string=EYEPAINT">EYEPAINT</a>; <a href="./study/isbe/search.html?string=COLOR">COLOR</a>`31';
isbe[6657]='Painting`pan\'-ting.`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`1';
isbe[6658]='Pair`par: The margin of <a onClick="return mV(\'Sgs\',4,2);">So 4:2</a> (but not of the parallel <a onClick="return mV(\'Sgs\',6,6);">6:6</A>) reads, "which are all of them in pairs," while the text has, "whereof every one hath twins." The Hebrew math\'imoth, is from the root, ta\'am, "to be double," and is perhaps susceptible of either meaning. But the description is of sheep, and the margin gives no comprehensible figure, while the text points to the exceedingly sleek and healthy appearance. "Pairs" seems to result from confusing the figure with the thing figured—the teeth, where each upper is paired with the corresponding lower.``1';
isbe[6659]='Palace`pal\'-as: In Hebrew chiefly \'armon, in the Revised Version (British and American) text translated "castle" in <a onClick="return mV(\'1Ki\',16,18);">1Ki 16:18</a>; <a onClick="return mV(\'2Ki\',15,25);">2Ki 15:25</a>; birah, hekhal, the same word often rendered "temple"; in Greek aule, in the Revised Version (British and American) translated "court" (<a onClick="return mV(\'Mat\',26,3,18,69);">Mt 26:3,18,69</a>; <a onClick="return mV(\'Mar\',14,54,66);">Mr 14:54,66</a>; <a onClick="return mV(\'Luk\',11,21);">Lu 11:21</a>; <a onClick="return mV(\'Jhn\',18,15);">Joh 18:15</a>). On the other hand, "palace" takes the place in the Revised Version (British and American) of the King James Version "common hall" or "judgment hall" (praitorion, <a onClick="return mV(\'Mat\',27,27);">Mt 27:27</a>; <a onClick="return mV(\'Jhn\',18,28,33);">Joh 18:28,33</a>; <a onClick="return mV(\'Jhn\',19,9);">19:9</a>; <a onClick="return mV(\'Act\',23,35);">Ac 23:35</a>). See <a href="./study/isbe/search.html?string=JUDGMENT+HALL">JUDGMENT HALL</a>. A description of Solomon\'s palace is given in <a onClick="return mV(\'1Ki\',7,\'1-12\');">1Ki 7:1-12</a> (see <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>). Archaeology has brought to light the remains of great palaces in Egypt, Babylonia, Assyria (Sargon, Sennacherib, Assurbanipal, etc.), Susa, etc.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`132';

isbe[6661]='Palal`pa\'-lal (palal, "judge"): Son of Uzai, and one of the repairers of the wall (<a onClick="return mV(\'Neh\',3,25);">Ne 3:25</a>).``1';
isbe[6662]='Palanquin`pal-an-ken\': In <a onClick="return mV(\'Sgs\',3,9);">So 3:9</a> occurs \'appiryon, a word that has no Semitic cognates and is of dubious meaning. In form, however, it resembles the Sanskrit paryanka, and still more closely the Greek phoreion, both of which mean "litter bed." Hence, the Revised Version (British and American) "palanquin" (ultimately derived from paryanka). The margin "car of state" and the King James Version "chariot" are mere guesses.``1';
isbe[6663]='Palestina`pal-es-ti\'-na (pelesheth): <a onClick="return mV(\'Exd\',15,14);">Ex 15:14</a>; <a onClick="return mV(\'Isa\',14,29,31);">Isa 14:29,31</a> the King James Version; changed in the Revised Version (British and American) to <a href="./study/isbe/search.html?string=PHILISTIA">PHILISTIA</a> (which see).``1';
isbe[6664]='Palestine Exploration, 1`(As of 1915)<P>Preliminary Consideration<P><b>I. ERA OF PREPARATION</b><P class="in15">1. Outside of Palestine<P class="in15">2. In Palestine<P class="in30">(1) Early Christian Period<P class="in30">(2) Period of Cursory Observation<P class="in30">(3) Beginning of Scientific Observation<P><b>II. ERA OF SCIENTIFIC EXPLORATION</b><P class="in15">1. Period of Individual Enterprise<P class="in30">(1) First Trained Explorers<P class="in30">(2) The Climax of Individual Exploration<P class="in15">2. Scientific Cooperative Surface Exploration<P class="in15">3. Most Recent Results in Surface Exploration<P><b>III. ERA OF SCIENTIFIC EXCAVATION</b><P class="in15">1. Southern Palestine<P class="in30">(1) Tell el-Chesy<P class="in30">(2) Excavations in Jerusalem<P class="in30">(3) Excavations in the Shephelah<P class="in30">(4) Painted "Tombs of Marissa"<P class="in15">2. Northern Palestine<P class="in30">(1) Tell Ta\'annek<P class="in30">(2) Tell el-Mutesellim<P class="in30">(3) Tell Chum<P class="in15">3. Eastern Palestine<P class="in30">Jericho<P class="in15">4. Central Palestine<P class="in30">(1) Jerusalem<P class="in30">(2) Samaria<P class="in30">(3) \'Ain Shems<P class="in30">(4) Gezer<P><b>LITERATURE</b><hr /><P>Preliminary Consideration:<P>Previous to the last century, almost the entire stock of knowledge concerning ancient Palestine, including its races, laws, languages, history and manners, was obtained from Josephus and the Bible, with a few brief additional references given by Greek and Roman authors; knowledge concerning modern Palestine was limited to the reports of chance travelers. The change has been due largely to the compelling interest taken in sacred history and the "Holy Oracles." This smallest country in the world has aroused the spirit of exploration as no other country has or could. It has largely stimulated many of the investigations carried on in other lands.<P>I. Era of Preparation.<P>1. Outside of Palestine:<P>Much direct information concerning ancient Palestine, absolutely essential to the success of modern exploration in that land, has come through discoveries in other countries; but due in many cases to Biblical influence. All the most important Hebrew and Greek manuscripts and versions of the Bible and most of the Jewish Talmud and apocryphal and Wisdom books were found outside of Palestine. The pictures of its population, cities, fortresses and armies give a color and perspective to its ancient history far more vivid than can be found on any of its own contemporary monuments. The records of Thothmes III (15th century BC) describing the capture of Megiddo in the plain of Esdraelon with its vast stores of "chariots wrought with gold," bronze armor, silver and ebony statues, ivory and ebony furniture, etc., and of his further capture of 118 other Canaanite towns, many of which are well known from the Bible, and from which he takes an enormous tribute of war materials, golden ornaments and golden dishes, "too many to be weighed," find no parallel in any indigenous record—such records even if written having been doomed to perish because of the soil, climate and character of the rocks west of the Jordan. So circa 1400 BC, the Tell el-Amarna Letters (discovered in 1887) mention by name many Biblical cities, and give much direct information concerning the political and social conditions at that period, with at least 6 letters from the governor of Jerusalem, who writes to the Pharaoh news that the Egyptian fleet has left the coast, that all the neighboring cities have been lost to Egypt, and that Jerusalem will be lost unless help can be had quickly against the invasion of the Khabiri. The literature of the XIXth Dynasty contains many Hebrew names with much information concerning Goshen, Pithom, Canaan, etc., while in one huge stele of Menephtah the Israelites are mentioned by name. Later Egyptian Pharaohs give almost equally important knowledge concerning Palestine, while the Assyrian texts are even more direct. The black obelisk of Shalmancser II (9th century) catalogues and pictures the tribute received from Jehu; almost every king of the 8th century tells something of his relations with the rulers of Jerusalem or Damascus, throwing immense light on local politics, and the later Bah records give vividly the conditions previous to and during the exile, while the edict of Cyrus gives the very decree by virtue of which the Jews could return to their native land. Later discoveries, like the Code of Hammurabi at Susa (1901), the Sendjirli and other Aramaic texts from Northern Syria (1890, 1908), and the Elephantine papyri, some of which are addressed to the "sons of Sanballat" and describe a temple in Egypt erected to Yahu (Yahweh) in the 5th century BC, may not give direct information concerning Palestine, but are important to present explorers because of the light thrown upon the laws of Palestine in patriarchal times; upon the thought and language of a neighboring Semitic community at the time of the Monarchy; upon the religious ritual and festivals of Nehemiah\'s day, and upon the general wealth and culture of the Jews of the 5th century; opening up also for the first time the intimate relations which existed between Jerusalem and Samaria and the Jews of the Dispersion. So the vast amounts of Greek papyri found recently in the Fayyum not only have preserved the "Logia" and "Lost Gospels" and fragments of Scripture texts, early Christian Egyptian ritual, etc., but have given to scholars for the first time contemporaneous examples of the colloquial language which the Jews of Palestine were using in the 1st century AD, and in which they wrote the "memoirs" of the apostles and the Gospels of Jesus.<P>2. In Palestine:<P>(1) Early Christian Period.<P>At this time, during the first three or four centuries the ancient sites and holy places were identified, giving some valuable information as to the topographical memories of the earlier church. By far the most valuable of these carefully prepared summaries of ancient Bible places, with their modern sites, and the distances between them, was the Onomasticon of Eusebius, as it was enlarged by Jerome, which attempted seriously the identification of some 300 holy places, most of these being vitally important for the modern student of the Bible. While some of these identifications were "curiously incorrect" (Bliss) and the distances even at the best only approximate, yet few satisfactory additions were made to the list for 1,500 years; and it was certainly a splendid contribution to Palestinian topography, for the list as a whole has been confirmed by the scientific conclusions of recent investigators.<P>(2) Period of Cursory Observation.<P>The earliest traveler who has left a record of his journey into Palestine was Sinuhit, who, perhaps a century after Abraham, mentions a number of places known to us from the Bible and describes Canaan as a "land of figs and vines,...where wine was more plentiful than Water,...honey and oil in abundance...all kinds of fruit upon its trees, barley and spelt in the fields, and cattle beyond number"; each day his table is laden with "bread, wine, cooked flesh and roasted fowl...wild game from the hills and milk in every sort of cooked dish" (Breasted, Ancient Records, I, 496). A few other Egyptian visitors (1300-1000 BC) add little to our knowledge. The report of the Hebrew spies (<a onClick="return mV(\'Num\',13,\'1-\');">Nu 13</a>) records important observations, although they can only humorously be called "genuine explorers" (Bliss), and Joshua\'s list of cities and tribes, although their boundaries are carefully described (<a onClick="return mV(\'Jos\',13,\'1-\');">Joshua 13-21</a>), are naturally excluded from this review.<P>The record of early Christian travel begins with the Bordeaux Pilgrim (332 AD), and during the next two centuries scores of others write out their observations in the Holy Land, but for 1,000 years there is scarcely a single visitor who looks at the country except through the eyes of the monks. A woman traveler of the 4th century reports some interesting facts about the early ritual of the Jerusalem church and the catechumen teaching, and surprises us by locating Pithom correctly (although the site was totally forgotten and only recovered in 1883), and the Epitome of Eucherius (5th century) gives a clear description of the holy places in Jerusalem; but almost the only other significant sign that anyone at this era ever made serious observations of value comes from the very large, fine mosaic of the 5th century recently discovered at Madeba, which gives a good impression of ancient Jerusalem with its buildings, and a careful bird\'s-eye view of the surrounding country (see below II, 3). By the middle of the 6th century the old "Holy Places" were covered by churches, while new ones were manufactured or discovered in dreams, and relics of martyrs\' bones began to engross so much attention that no time was left in which to make any ordinary geographical or natural-history observations. A little local color and a few facts in regard to the plan of early churches and the persecution of Christians by Moslems constitute almost the sum total of valus to be gathered from the multitude of pilgrims between the 6th and 12th centuries. In the 12th century John of Wurzburg gives a few geographical notes of value; Theoderich notices certain inscriptions and tombs, describes accurately the churches and hospitals he visits, with their pictures and decorations, and outlines intelligently the boundaries of Judea and the salient features of the mountains encompassing Jerusalem; the Abbot Daniel notices the wild beasts in the Jordan forests and the customs at church feasts, and his account is important because of the light it throws on conditions in Palestine just after its conquest by the Crusaders, while in the 13th century Burchard of Mt. Zion makes the earliest known medieval map of Palestine, mentions over 100 Scripture sites, and shows unexpected interest in the plant and animal life of the country—but this practically exhausts the valuable information from Christian sources in these centuries. The Moslem pilgrims and writers from the 9th to the 15th centuries show far more regard to geographical realities than the Christians. It is a Moslem, Istakhri, who in the 10th century makes the first effort at a systematic geography of Palestine, and in the 10th and 13th centuries, respectively, Muqaddasi, after 20 years of preparation, and Yaqut, in a "vast work," publish observations concerning climate, native customs, geographical divisions, etc., which are yet valuable, while Nacir-i-Qhusran, in the 11th century, also gave important information concerning Palestinian botany, gave dimensions of buildings and gates, and even noticed to some extent the ancient arches and ruins—though in all these there are pitiful inaccuracies of observation and induction. One of the best Moslem writers thinks the water of Lake Tiberias is not fit to drink because the city sewerage has ceased to flow into it, and Christian writers from the 7th century down to modern times continually mention the Jor and Dan as two fountains from which the Jordan rises, and continually report the most absurd stories about the Dead Sea and about its supernatural saltness never noticing the salt mountain near by and the other simple causes explaining this phenomenon.<P>See <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</a>.<P>In the 14th century Marino Sanuto gave a "most complete monograph" (Ritter) of Palestinian geography, his maps being really valuable, though, according to modern standards, quite inaccurate. The Jew, Estoai ben Moses ha-Phorhi, in this same century advanced beyond all Christian writers in a work of "real scientific knowledge" (Bliss), in which he correctly identified Megiddo and other ancient sites, though the value of his work was not recognized for 400 years. The great name of the 15th century is that of the Dominican, Father Felix Fabri, who in his large book, Wanderings in the Holy Land, was the first to notice monuments and ruins to which no Biblical traditions were attached (Bliss), and who, within a decade of the discovery of America, described most vividly the dangers and miseries of the sea voyages of that era, and in most modern fashion narrated his adventures among the Saracens; yet notwithstanding the literary value of the book and his better method of arranging his materials, Fabri actually explained the saltness of the Dead Sea as due to the sweat which flowed from the skin of the earth! In the 16th century travelers showed more interest in native customs, but the false traditional identification of sites was scarcely questioned; the route of travel was always the same, as it was absolutely impossible to get east of the Jordan, and even a short trip away from the caravan was dangerous.<P>(3) Beginning of Scientific Observation.<P>In the 17th century Michal Nau, for 30 years a missionary in Palestine, De la Roque and Hallifix showed a truly scientific veracity of observation and an increasing accuracy in the recording and verification of their notes, and Maundrell advanced beyond all his predecessors in noticing the antiquities on the seacoast, north of Beirut; but all of these, though possessing fine qualities as explorers, were forced to travel hastily and limit their study to a very narrow field.<P>II. Era of Scientific Exploration.<P>1. Period of Individual Enterprise:<P>(1) First Trained Explorers.<P>True scientific exploration opened with the 18th century, as men began to think of this as itself an important life-work and not merely as a short episode in a life devoted to more serious pursuits. Th. Shaw (1722) carefully fitted himself as a specialist in natural history and physical geography, and scientifically reported a number of new facts, e.g. conditions and results of evaporation, etc., in the Dead Sea. Bishop Pococke (1738) had been well trained, was free from the bondage of tradition, and did for the antiquities of Palestine what Maundrell had done for those of Syria, making a large number of successful identifications of sites and contributing much to the general knowledge of Palestine. Volney (1783) was a brilliant literary man, in full sympathy with the scientific spirit, who popularized results and made a considerable number of original researches, especially in the Lebanon. Seetzen (1800-1807) and Burckhardt (1810-1812) are called by Bliss "veritable pioneers in the exploration of the ruins of Eastern and Southern Palestine." The former opened Caesarea Philippi to light, visited a large unexplored district and made important observations in almost every field of knowledge, zoology, meteorology, archaeology; the latter, having become an Arab in looks and language, was able to go into many places where no European had ventured, one of his chief triumphs being the discovery of Petra and the scientific location of Mt. Sinai.<P>(2) The Climax of Individual Exploration.<P>The climax of the era of scientific observation, unassisted by learned societies, was reached by the American clergyman and teacher, Edward Robinson. He spent parts of two years in Palestine (1838 and 1852) and in 1856 published 3 volumes of Biblical Researches. He strictly employed the scientific method, and showed such rare insight that scarcely one of his conclusions has been found incorrect. His knowledge was as extensive as minute, and although he gave, in all, only five months of steady labor to the specific task of exploration, yet in that time he "reconstructed the map of Palestine" (Bliss), and his conclusions henceforth "formed the ground work of modern research" (Conder). He studied Jerusalem, being the first to show that the ancient fragment of an arch (now "Robinson\'s") had been part of the bridge connecting the temple with Mt. Zion, and was the first to trace with accuracy the windings of the tunnel leading from the Virgin\'s Fount to the Pool of Siloam. All Judea, Galilee and Samaria were very well covered by him. He was the first to notice that the ruined building at Tell Chum was a synagogue; from the top of one hill he recognized seven Biblical sites which had been lost for at least 1,500 years; he identified correctly at least 160 new sites, almost all being Biblical places. Robinson\'s results were phenomenal in number and variety, yet necessarily these have been constantly improved upon or added to in each generation since, for no man can cover the entire field or be a specialist in every department. W.M. Thomson in his Thomson, The Land and the Book (new edition, 1910) and G.E. Post, Flora of Syria, Palestine, and Sinai (1896), gave a needed popular resume of the manners, customs and folklore of the people, as these illustrated the Bible, and many books and articles since have added to this material.<P>In 1848 the United States sent an expedition under Lieutenant Lynch to the Dead Sea, which ascertained the exact width, depth, currents, temperature, etc., and many parties since have added to this knowledge (see e.g. <a href="./study/isbe/search.html?string=DEAD+SEA">DEAD SEA</A>; and also PEFS, 1911, XII, 7). From 1854 to 1862 De Vogue thoroughly examined the monuments of Central Syria and remained the sole authority on this section down to the American Archaeological Expedition of 1899. Tabler (1845-63) scientifically described Jerusalem and its environs, and the districts lying between Jaffa and the Jordan, and between Jerusalem and Bethel. Guerin who studied Palestine during periods covering 23 years (1852-75), though limited by lack of funds, covered topographically, with a minuteness never before attempted, almost the whole of Judea, Samaria and Galilee, gathering also many new records of monuments and inscriptions, the record of which was invaluable because many of these had been completely destroyed before the arrival of the next scientific party. A most sensational discovery was that of F. Klein in 1868, when he found at Dibon the huge basalt tablet set up by Mesha, king of Moab (9th century BC), on which in a language closely resembling the Hebrew, he gave honor to his god Chemosh by describing his successful revolt against a successor of Omri, the latter being mentioned by name with many well-known Biblical places. In style, thought and language this inscription greatly resembles the early Old Testament records.<P>2. Scientific Cooperative Surface Exploration:<P>With the foundation of the Palestine Exploration Fund (1865) the work of exploration took on an entirely new phase, since in this case, not a single individual, but a large company of specialists entered the work, having behind them sufficient funds for adequate investigation in each necessary line of research, and with the British War Office furnishing its expert Royal Engineers to assist the enterprise. Under the auspices of this society during the next 15 years Jerusalem was explored as never before, and all Western Palestine was topographically surveyed (see below); a geological survey (1883-1884) of Sinai, Wady \'Arabah and the Dead Sea, and later of Mt. Seir (1885) was accomplished under Professor Edward Hull; the natural history of the country was treated with great thoroughness by several specialists; Palmer and Drake in the dress of Syrian natives, without servants, risked the dangerous journey through the Desert of the Tih in order to locate so far as possible the route of the Exodus; Clermont-Ganneau, who had previously made the discovery of the Jewish placard from the Temple, forbidding strangers to enter the sacred enclosure, added greatly to archaeological knowledge by gathering and deciphering many ancient inscriptions, uncovering buried cemeteries, rock-cut tombs and other monuments. He also laid down important criteria for the age of stone masonry (yet see PEFS, 1897, LXI); identified various sites including Adullam, found the "stone of Bethphage," "Zoheleth," etc., and made innumerable plans of churches, mosques, tombs, etc., and did an incredible amount of other important work. Capt., afterward Col., C.R. Conder did an equally important work, and as the head of the archaeological party could finally report 10,000 place-names as having been gathered, and 172 new Bible sites successfully identified, while the boundaries of the tribes had been practially settled and many vitally important Bible locations for the first time fixed. The excavations in Jerusalem under the same auspices had meanwhile been carried out as planned. After an introductory examination by Sir Charles Wilson, including some little excavating, Sir Charles Warren (1867-1870) and, later, Col. Conder (1872-1875) made thorough excavations over a large area, sinking shafts and following ancient walls to a depth of 80-150 ft. They uncovered the Temple-area from its countless tons of debris and traced its approximate outline; examined underground rock chambers; opened ancient streets; discovered many thousand specimens of pottery, glass, tools, etc., from Jewish to Byzantine periods; found the pier in the Tyropoeon Valley, where Robinson\'s arch had rested, and also parts of the ancient bridge; traced the line of several important ancient walls, locating gates and towers, and fixed the date of one wall certainly as of the 8th century BC, and probably of the age of Solomon (G.A. Smith), thus accomplishing an epoch-making work upon which all more recent explorers have safely rested—as Maudslay (1875), in his masterly discovery and examination of the Great Scarp, and Guthe (1881), who made fine additional discoveries at Ophel, as well as Warren and Conder in their work afterward (1884), when they published plans of the whole city with its streets churches, mosques, etc., 25 inches to the mile, which in that direction remains a basis for all later work.<P>See <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>.<P>Perhaps, however, the greatest work of all done by this society was the Topographical Survey (1881-1886), accomplished for Judea and Samaria by Col. Conder, and for Galilee by Lord Kitchener, resulting in a great map of Western Palestine in 26 sheets, on a scale of an inch to the mile (with several abridged additions), showing all previous identifications of ancient places. These maps, with the seven magnificent volumes of memoirs, etc., giving the other scientific work done by the various parties, marked such an epoch-making advance in knowledge that it has been called "the most important contribution to illustrate the Bible since its translation into the vulgar tongue."<P>In addition to the above the Palestine Exploration Fund established a Quarterly Statement and Society of Biblical Archaeology from which subscribers could keep in touch with the latest Biblical results, and published large quantities of translations of ancient texts and travels and of books reporting discoveries as these were made. Altogether more advance was made during these 15 years from 1865-1880 than in the 15 centuries before.<P>3. Most Recent Results in Surface Exploration:<P>The next ten years (1880-90) did not furnish as much new material from Palestine exploration, but in 1880 the Siloam Inscription (compare <a onClick="return mV(\'2Ki\',20,20);">2Ki 20:20</a>; <a onClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>) was accidentally found in Jerusalem, showing the accuracy with which the engineers of Hezekiah\'s day could, at least occasionally, cut long tunnels through the rock (see also Clermont-Ganneau, Archaeological Researches, 313); and in 1881-1885 Conder and Schumacher attempted their difficult task of making a scientific topographical map of Eastern Palestine. In 1881 H. Clay Trumbull rediscovered and properly described Kadesh-barnea, settling authoritatively its location and thus making it possible to fix previously obscure places mentioned in the account of the Exodus wanderings. Since 1890 continued investigations in small districts not adequately described previously have taken place, new additions to the zoological, botanical, geological and meteorological knowledge of Palestine have been frequent; studies of irrigation and the water-supply have been made, as well as investigations into the customs, proverbs, folklore, etc., of the Arabs; many districts east of the Jordan and through Petra down into Sinai have yielded important results, and many discoveries of surface tombs, ossuaries, mosaics, seals and manuscripts have been made in many parts of Palestine. This has been done perhaps chiefly by the Palestine Exploration Fund, but much by individuals and some by the newly organized excavation societies (see below). The most surprising discoveries made by this method of surface exploration (a method which can never become completely obsolete) have been the finding at different times of the four Boundary Stones of Gezer (1874, 1881, 1889) by Clermont-Ganneau, and, in 1896, of the very large mosaic at Madeba by Father Cleopas, librarian of the Greek Patriarch.<P>The latter proved to be part of the pavement of a 6th-century basilica and is a "veritable map of Palestine," showing its chief cities, the boundaries of the tribes, and especially the city of Jerusalem with its walls, gates, chief buildings, including the Church of the Holy Sepulchre, and chief streets, notably one long straight street intersecting the city and lined with colonnades. As Madeba lies near the foot of Mt. Nebo, it is thought the artist may have intended to represent ideally a modern (6th-cent.) vision of Moses. George Adam Smith (HGHL, 7th edition, 1901); Jerusalem (2 volumes, 1910), and E. Huntington, Palestine and Its Transformation (1911), have given fine studies illustrating the supreme importance of accurate topographical knowledge in order to understand correctly the Bible narratives and the social life and politics of the Hebrews.``26';
