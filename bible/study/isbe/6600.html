isbe[6686]='Papyrus`pa-pi\'-rus (Cyperus papyrus; bublos, biblos, whence biblion, a roll, ta biblia, "the Books" = the Bible):<P>1. Papyrus Paper<P>2. Egyptian Papyri<P>3. Aramaic Papyri<P>4. Greek Papyri<P>5. Their Discovery.<P>6. Classical Papyri<P>7. Septuagint Papyri<P>8. New Testament Papyri<P>9. Theological Papyri<P>10. Documentary Papyri<P>11. Contribution to New Testament Study<P>12. Chief Collections<P>13. Coptic, Arabic and Other Papyri<hr /><P>A marsh or water plant, abundant in Egypt in ancient times, serving many purposes in antiquity. The papyrus tuft was the emblem of the Northern Kingdom in Egypt. Like the lotus, it suggested one of the favorite capitals of Egyptian architecture. Ropes, sandals, and mats were made from its fibers (see Odyssey xxi.391; Herod. ii.37, 69), and bundles of the long, light stalks were bound together into light boats (<a onClick="return mV(\'Isa\',18,2);">Isa 18:2</a>; Breasted, History of the Egyptians, 91).<P>1. Papyrus Paper:<P>Most importantly, from it was made the tough and inexpensive paper which was used from very ancient times in Egypt and which became the common writing-material of the ancient world. The white cellular pith of the long triangular papyrus stalk was stripped of its bark or rind and sliced into thin strips. Two layers of these strips were laid at right angles to each other, pasted together (Pliny says with the aid of Nile water), dried and smoothed. The sheets thus formed were pasted one to another to form a roll of any length desired. The process and the product are described by Pliny the EIder (NH, xiii.11-13).<P>2. Egyptian Papyri:<P>Egyptian papyrus rolls are in existence dating from the 27th century BC, and no doubt the manufacture of papyrus had been practiced for centuries before. The Egyptian rolls were sometimes of great length and were often beautifully decorated with colored vignettes (Book of the Dead). Egyptian documents of great historical value have been preserved on these fragile rolls. The Papyrus Ebers of the 16th century BC sums up the medical lore of the Egyptians of the time of Amenhotep I. The Papyrus Harris, 133 ft. long, in 117 columns, dates from the middle of the 12th century BC and records the benefactions and achievements of Ramses III. For the XIXth, XXth and XXIst dynasties, indeed, papyri are relatively numerous, and their contribution important for Egyptian history, life and religion. By the year 1000 BC, papyrus had doubtless come to be used for writing far beyond the limits of Egypt. The Wenamon Papyrus (11th century) relates that 500 rolls of papyrus were among the gifts sent from the Delta to the Prince of Biblus, but except in the rarest instances papyri have escaped destruction only in Upper Egypt, where climatic conditions especially favored their preservation.<P>3. Aramaic Papyri:<P>In very recent years (1898, 1904, 1907) several Aramaic papyri have been found on the Island of Elephantine, just below the First Cataract, dating from 494 to 400 BC. They show that between 470 and 408 BC a flourishing colony of Jews existed there, doing business under Persian sway, and worshipping their god Yahu, not in a synagogue, but in a temple, in which they offered meal offerings, incense and burnt offerings. In 408, the Egyptians had destroyed their temple at Yeb, and the Jews appealed for redress to the Persian governor. It is well known that some Jews had taken refuge in Egypt in 586 BC, taking the prophet Jeremiah with them, and with some such band of refugees the Yeb colony may have originated, although it may have been much older (compare <a onClick="return mV(\'Jer\',44,1,15);">Jer 44:1,15</a>; Biblical World, XXIX, 1907, 305ff; XXXI, 448ff; chief publications by Euting, Sayce and Cowley, and especially Sachau, Drei aramdische Papyrusurkunden aus Elephantine, 2nd edition, 1908; Aramaische Papyrus und Ostraka, 1911).<P>4. Greek Papyri:<P>With Alexander\'s conquest of Egypt (332 BC), and the subsequent Ptolemaic dynasty, Greeks came more than ever before into Egypt, and from Greek centers like Alexandria and Arsinoe in the Faytum the Greek language began to spread. Through the Ptolemaic (323-30 BC), Roman (30 BC-292/93 AD), and Byzantine periods (292/93-640 AD), that is, from the death of Alexander to the Arab conquest, Greek was much used in Upper and Lower Egypt, and Greek papyri from these times are now abundant. The 300 Aphrodito Greek and Coptic papyri published by Bell and Crum (1910) date from 698-722 AD, and show how Greek persisted in the Arab period.<P>5. Their Discovery:<P>The first important discovery of Greek papyri made in modern times was among the ruins of Herculaneum, near Naples, where in 1752 in the ruins of the house of a philosopher which had been destroyed and buried by volcanic ashes from Vesuvius (79 AD) a whole library of papyrus rolls was found, quite charred by the heat. With the utmost pains many of these have been unrolled and deciphered, and the first part of them was published in 1793. They consist almost wholly of works of Epicurean philosophy. In 1778 the first discovery of Greek papyri in Egypt was made. In that year some Arabs found 40 or 50 papyrus rolls in an earthen pot, probably in the Faytum, where Philadelphus settled his Greek veterans. One was purchased by a dealer and found its way into the hands of Cardinal Stefano Borgia; the others were destroyed as of no worth. The Borgia Papyrus was published 10 years later. It was a document of little value, recording the forced labor of certain peasants upon the Nile embankment of a given year.<P>In 1820 another body of papyri was found by natives, buried, it was said, in an earthen pot, on the site of the Serapeum at Memphis, just above Cairo. These came for the most part from the 2nd century BC. They fell into various hands, and are now in the museums of London, Paris, Leyden, Rome and Dresden. With them the stream of papyri began to flow steadily into the British and Continental museums. In 1821 an Englishman, Mr. W.J. Bankes, bought an Elephantine roll of the xxivth book of the Iliad, the first Greek literary papyrus to be derived from Egypt. The efforts of Mr. Harris and others in 1847-1850 brought to England considerable parts of lost orations of Hyperides, new papyri of the 17th book of the Iliad, and parts of Iliad ii, iii, ix. In 1855 Mariette purchased a fragment of Alcman for the Louvre, and in 1856 Mr. Stobart obtained the funeral oration of Hyperides.<P>The present period of papyrus recovery dates from 1877, when an immense mass of Greek and other papyri, for the most part documentary, not literary, was found in the Fayum, on the site of the ancient Arsinoe. The bulk of this collection passed into the hands of Archduke Rainer at Vienna, minor portions of it being secured by the museums of Paris, London, Oxford and Berlin. These belong largely to the Byzantine period. Another great find was made in 1892 in the Faytum; most of these went to Berlin some few to the British Museum, Vienna and Geneva. These were mostly of the Roman period.<P>It will be seen that most of these discoveries were the work of natives, digging about indiscriminately in the hope of finding antiquities to sell to tourists or dealers. By this time, however, the Egypt Exploration Fund had begun its operations in Egypt, and Professor Flinders Petrie was at work there. Digging among Ptolemaic tombs at Gurob in 1889-90, Professor Petrie found many mummies, or mummy-casings, adorned with breast-pieces and sandals made of papyri pasted together. The separation of these was naturally a tedious and delicate task, and the papyri when extricated were often badly damaged or mutilated; but the Petrie papyri, as they were called, were hailed by scholars as the most important found up to that time, for they came for the most part from the 3rd century BC. Startling acquisitions were made about this time by representatives of the British Museum and the Louvre. The British Museum secured papyri of the lost work of Aristotle on the Constitution of Athens, the lost Mimes of Herodas, a fragment of an oration of Hyperides, and extensive literary papyri of works already extant; while the Louvre secured the larger part of the Oration against Athenogenes, the masterpiece of Hyperides. In 1894 Bernard P. Grenfell, of Oxford, appeared in Egypt, working with Professor Petrie in his excavations, and securing papyri with Mr. Hogarth for England. In that year Pettie and Grenfell obtained from native dealers papyrus rolls, one more than 40 ft. in length, preserving revenue laws of Ptolemy Philadelphus, dated in 259-258 BC. These were published in 1896 by Mr. Grenfell, the first of many important works in this field from his pen.<P>With Arthur S. Hunt, of Oxford, Mr. Grenfell excavated in 1896-1897, at Behnesa, the Roman Oxyrhynchus, and unearthed the greatest mass of Greek papyri of the Roman period thus far found. In 9 large quarto volumes, aggregating 3,000 pages, only a beginning has been made of publishing these Oxyrhynchus texts, which number thousands and are in many cases of great importance. The story of papyrus digging in Egypt since the great find of 1896-1897 is largely the record of the work of Grenfell and Hunt. At Tebtunis, in the Faytum; in 1900, they found a great mass of Ptolemaic papyri, comparable in importance with their great discovery at Oxyrhynchus. One of the most productive sources of papyri at Tebtunis was the crocodile cemetery, in which many mummies of the sacred crocodiles were found rolled in papyrus. Important Ptolemaic texts were found in 1902 at Hibeh, and a later visit to Oxyrhynchus in 1903 produced results almost as astonishing and quite as valuable as those of the first excavations there. The work of Rubensohn at Abusir in 1908 has exceptional interest, as it developed the first considerable body of Alexandrian papyri that has been found. The soil and climate of Alexandria are destructive to papyri, and only to the fact that these had in ancient times been carried off into the interior as rubbish is their preservation due. Hogarth, Jouguet, Wilcken and other Continental scholars have excavated in Egypt for papyri with varying degrees of success. The papyri are found in graves a few feet below the surface, in house ruins over which sand has drifted, or occasionally in earthen pots buried in the ground. Despite government efforts to stop indiscriminate native digging, papyri in considerable quantities have continued to find their way into the hands of native dealers, and thence into English, Continental, and even American collections.<P>6. Classical Papyri:<P>Thus far upward of 650 literary papyri, great and small, of works other than Biblical have been published. The fact that about one-third of these are Homeric attests the great popularity enjoyed by the Homeric poems in Greek-Roman times. These are now so abundant and extensive as to make an important contribution to the Homeric text. Rather less than one-third preserve works of other ancient writers which were already known to us through later copies, medieval or modern. Among these are works of Plato, Demosthenes, Isocrates, Thucydides, Euripides, Sophocles, Aeschines, Herodotus and others. Rather more than one-third preserve works, or fragments of works, which have been either quite unknown or, oftener, regarded as lost. Such are portions of Alcman and Sappho, fragments of the comedies of Menander and the iambi of Callimachus, Mimes of Herodas, poems of Bacchylides, parts of the lost Antiope and Hypsipyle of Euripides, Aristotle On the Constitution of Athens, the Persac of Timotheus (in a papyrus of the 4th century BC, probably the oldest Greek book in the world), and six orations, one of them complete, of Hyperides. In 1906 Grenfell and Hunt discovered at Oxyrhynchus the unique papyrus of the lost Paeans of Pindar, in 380 fragments, besides the Hellenica of Theopompus (or Cratippus?), whose works were believed to have perished.<P>7. Septuagint Papyri:<P>Of the Greek Old Testament (Septuagint) more than 20 papyri have been discovered. Perhaps the most important of these is the Berlin Genesis (3rd or 4th century) (1) in a cursive hand, purchased at Akhmim in 1906. Other papyri preserving parts of Genesis among the Amherst<P>(2), British Museum<P>(3), and Oxyrhynehus<P>(4), papyri date from the 3rd or 4th century. A Bodleian papyrus leaf<P>(5) (7th or 8th century) preserves <a onClick="return mV(\'Sgs\',1,\'6-9\');">So 1:6-9</a>. An Amherst papyrus<P>(6) (7th century) contains <a onClick="return mV(\'Job\',1,21);">Job 1:21f; <a onClick="return mV(\'Job\',2,3);">2:3</a>. There are several papyri of parts of the Psalms. An Amherst papyrus<P>(7) (5th or 6th century) has <a onClick="return mV(\'Psa\',5,\'6-12\');">Ps 5:6-12</a>. Brit. Mus. 37 (Fragmenta Londinensia, 6th or 7th century)<P>(8), of thirty leaves, contains <a onClick="return mV(\'Psa\',10,\'2-\');">Ps 10:2-18:6</a> and <a onClick="return mV(\'Psa\',20,\'14-\');">20:14-34:6</a>. This was purchased in 1836 and is one of the longest of Biblical papyri. Brit. Mus. 230<P>(9) (3rd century) preserves <a onClick="return mV(\'Psa\',12,\'7-\');">Ps 12:7-15:4</a>. A Berlin papyrus<P>(10) contains <a onClick="return mV(\'Psa\',40,\'26-\');">Ps 40:26</A>-<a onClick="return mV(\'Psa\',41,\'1-4\');">41:4</a>. Oxyrhynchus papyrus 845<P>(11) (4th or 5th century) contains parts of <a onClick="return mV(\'Psa\',68,\'1-\');">Psalms 68</a>; <a onClick="return mV(\'Psa\',70,\'1-\');">70</a>. Another Amherst papyrus<P>(12) (7th century) shows parts of <a onClick="return mV(\'Psa\',108,\'1-\');">Psalms 108</a>; <a onClick="return mV(\'Psa\',118,\'1-\');">118</a>; <a onClick="return mV(\'Psa\',135,\'1-\');">135</a>; <a onClick="return mV(\'Psa\',138,\'1-\');">138-140</A>. There is also a papyrus at Leipzig<P>(13) which contains part of the Psalms. Of the Prophets the chief papyrus is the Heidelberg codex<P>(14) (7th century), which contains <a onClick="return mV(\'Zec\',4,6);">Zec 4:6</a> through <a onClick="return mV(\'Mal\',4,5);">Mal 4:5</a>. Oxyrhynchus 846<P>(15) (6th century) contains <a onClick="return mV(\'Amo\',2,1);">Am 2</a>. A gainer papyrus<P>(16) (3rd century) preserves <a onClick="return mV(\'Isa\',38,\'3-5\',\'13-16\');">Isa 38:3-5,13-16</a>, and a Bodleian<P>(17) (3rd century) shows <a onClick="return mV(\'Eze\',5,\'12-\');">Eze 5:12</a>-<a onClick="return mV(\'Eze\',6,1,2,3);">6:3</a>. The Rylands papyri include <a onClick="return mV(\'Deu\',2,\'1-\');">De 2</a>; <a onClick="return mV(\'Deu\',3,\'1-\');">3</a><P>(18) (4th century); <a onClick="return mV(\'Job\',1,\'1-\');">Job 1</a>; <a onClick="return mV(\'Job\',5,\'1-\');">5</a>; <a onClick="return mV(\'Job\',6,\'1-\');">6</a><P>(19) (6th or 7th century); <a onClick="return mV(\'Psa\',90,\'1-\');">Ps 90</a><P>(20) (5th or 6th century). Recent Oxyrhynchus volumes supply parts of <a onClick="return mV(\'Exd\',21,\'1-\');">Ex 21</a>; <a onClick="return mV(\'Exd\',22,\'1-\');">22</a>; <a onClick="return mV(\'Exd\',40,\'1-\');">40</a><P>(21; 22) (3rd century, O.P. 1074, 1075); and of <a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a><P>(23) (3rd century, O.P. 1166), and <a onClick="return mV(\'Gen\',31,\'1-\');">Ge 31</a><P>(24) (4th century, O.P. 1167). The great antiquity of some of these documents gives especial interest to their readings.<P>8. New Testament Papyri:<P>Twenty-three papyri containing parts of the Greek New Testament have thus far been published, nearly half of them coming from Oxyrhynchus (O.P. 2, 208, 209, 402, 657, 1008, 1009, 1078, 1079, 1170, 1171). The pieces range in date from the 3rd to the 6th century. Their locations, dates and contents are:<P>1. Philadelphia, Pa. 3rd or 4th century <a onClick="return mV(\'Mat\',1:\'1-9\',12,13,\'14-20\');">Mt 1:1-9,12,13,14-20</a> (O.P. 2).<P>2. Florence. 5th or 6th century <a onClick="return mV(\'Jhn\',12,\'12-15\');">Joh 12:12-15</a>.<P>3. Vienna. 6th century <a onClick="return mV(\'Luk\',7,\'36-45\');">Lu 7:36-45</a>; <a onClick="return mV(\'Luk\',10,\'38-42\');">10:38-42</a>.<P>4. Paris. 4th century <a onClick="return mV(\'Luk\',1,\'74-80\');">Lu 1:74-80</a>; <a onClick="return mV(\'Luk\',5,\'3-8\');">5:3-8</a>; <a onClick="return mV(\'Luk\',5,30);">5:30-6:4</a>.<P>5. London. 3rd or 4th century <a onClick="return mV(\'Jhn\',1,\'23-31\');">Joh 1:23-31</a>, <a onClick="return mV(\'Jhn\',1,\'33-41\');">33-41</a>; <a onClick="return mV(\'Jhn\',20,\'11-17\');">20:11-17</a>, <a onClick="return mV(\'Jhn\',20,\'19-25\');">19-25</a> (O.P. 208).<P>6. Strassburg. ? century <a onClick="return mV(\'Jhn\',11,45);">Joh 11:45</a>.<P>7. Kiew. ? century <a onClick="return mV(\'Luk\',4,1,2);">Lu 4:1,2</a>.<P>8. Berlin. 4th century <a onClick="return mV(\'Act\',4,\'31-37\');">Ac 4:31-37</a>; <a onClick="return mV(\'Act\',5,\'2-9\');">5:2-9</a>; <a onClick="return mV(\'Act\',6,\'1-6\');">6:1-6</a>, <a onClick="return mV(\'Act\',6,\'8-15\');">8-15</a>.<P>9. Cambridge, Mass. 4th or 5th century <a onClick="return mV(\'1Jo\',4,\'11-13\',15,17);">1Joh 4:11-13,15,17</a> (O.P 402).<P>10. Cambridge, Mass. 4th century <a onClick="return mV(\'Rom\',1,\'1-7\');">Ro 1:1-7</a> (O.P. 209).<P>11. Petersburg. 5th century <a onClick="return mV(\'1Cr\',1,\'17-20\');">1Co 1:17-20</a>; <a onClick="return mV(\'1Cr\',6,13,18);">6:13,18</a>; <a onClick="return mV(\'1Cr\',7,3,4,\'10-14\');">7:3,4,10-14</a>. 12. Didlington Hall. 3rd or 4th century <a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a>.<P>13. London. 4th century <a onClick="return mV(\'Hbr\',2,14);">Heb 2:14-5:5</a>; <a onClick="return mV(\'Hbr\',10,8);">10:8-11:13</a>; <a onClick="return mV(\'Hbr\',11,28);">11:28-12:17</a> (O.P. 657). This is the most considerable papyrus of the New Testament, and doubly important because Codex Vaticanus breaks off with <a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a>.<P>14. Sinai. 5th century <a onClick="return mV(\'1Cr\',1,\'25-27\');">1Co 1:25-27</a>; <a onClick="return mV(\'1Cr\',2,\'6-8\');">2:6-8</a>; <a onClick="return mV(\'1Cr\',3,\'8-10\',20);">3:8-10,20</a>.<P>15. Oxford. 4th century <a onClick="return mV(\'1Cr\',7,\'18-\');">1Co 7:18</A>-<a onClick="return mV(\'1Cr\',8,\'1-4\');">8:4</a> (O.P. 1008). <a onClick="return mV(\'Phl\',3,\'9-17\');">Php 3:9-17</a>; <a onClick="return mV(\'Phl\',4,\'2-8\');">4:2-8</a> (O.P. 1009).<P>16. Manchester (Rylands). 6th or 7th century <a onClick="return mV(\'Rom\',12,\'3-8\');">Ro 12:3-8</a>.<P>17. Manchester (Rylands). 3rd century <a onClick="return mV(\'Tts\',1,\'11-15\');">Tit 1:11-15</a>; <a onClick="return mV(\'Tts\',2,\'3-8\');">2:3-8</a>.<P>18. Oxford. 4th century <a onClick="return mV(\'Hbr\',9,\'12-19\');">Heb 9:12-19</a> (O.P. 1078).<P>19. Oxford. 3rd or 4th century <a onClick="return mV(\'Rev\',1,\'4-7\');">Re 1:4-7</a> (O.P. 1079).<P>20. Oxford. 5th century <a onClick="return mV(\'Mat\',10,32);">Mt 10:32-11:5</a> (O.P. 1170).<P>21. Oxford. 3rd century <a onClick="return mV(\'Jam\',2,\'19-\');">Jas 2:19</a>-<a onClick="return mV(\'Jam\',3,1,2,\'4-9\');">3:2, 4-9</a> (O.P. 1171).<P>22. Florence. 7th century <a onClick="return mV(\'Mat\',25,\'12-15\');">Mt 25:12-15</a>, <a onClick="return mV(\'Mat\',25,\'20-23\');">20-23</a>.<P>23. Florence. ? century <a onClick="return mV(\'Jhn\',3,\'14-18\',31,32);">Joh 3:14-18,31,32</a>.<P>Berlin Pap. 13,269 (7th century) is a liturgical paraphrase of <a onClick="return mV(\'Luk\',2,\'8-14\');">Lu 2:8-14</a>.<P>Further details as to <a onClick="return mV(\'Num\',1,\'1-14\');">numbers 1-14</a> may be found in Gregory, Textkritik, 1084-92, and for <span class="noTag">numbers 1-23</span> in Kenyon, Handbook to Text. Crit. 2, or Milligan, New Testament Documents, 249-54.<P>9. Theological Papyri:<P>Among other theological papyri, the Oxyrhynchus Sayings of Jesus (O.P. 1,654), dating from the 2nd and 3rd centuries, are probably the most widely known (see <a href="./study/isbe/search.html?string=LOGIA">LOGIA</a>). Other Oxyrhynchus pieces preserve parts of the Apocalypse of Baruch (chapters 12-14; 4th or 5th century; O.P. 403); the Gospel according to the Hebrews (? in its later form, if at all; 3rd century; O.P. 655); the Acts of John (4th century; O.P. 850, compare 851); the Shepherd of Hermas (3rd or 4th century; O.P. 404); Irenaeus, Adv. Haer., iii.9 (3rd century; O.P. 405). Other small fragments of the Shepherd and Ignatius are among the Amherst and Berlin papyri. Early Christian hymns, prayers and letters of interest have also been found.<P>10. Documentary Papyri:<P>We have spoken thus far only of literary papyri, classical and theological. The overwhelming jority of the papyri found have of course been documentary—private letters, accounts, wills, receipts, contracts, leases, deeds, complaints, petitions, notices, invitations, etc. The value of these contemporary and original documents for the illumination of ancient life can hardly be overestimated. The life of Upper Egypt in Ptolemaic and Roman times is now probably better known to us than that of any other period of history down to recent times. Many papyrus collections have no literary papyri at all, but are rich in documents. Each year brings more of these to light and new volumes of them into print. All this vast and growing body of material contributes to our knowledge of Ptolemaic and imperial times, often in the most intimate ways. Among the most important of these documentary papyri from Ptolemaic times are the revenue laws of Ptolemy Philadelphus (259 BC) and the decrees of Ptolemy Euergetes II, 47 in number (118 BC, 140-139 BC). Very recently (1910) a Hamburg papyrus has supplied the Constitutio Antoniniana, by which Roman citizenship was conferred upon the peregrini of the empire. The private documents in ways even more important illustrate the life of the common people under Ptolemaic and Roman rule.<P>11. Contribution to New Testament Study:<P>It is not necessary to point out the value of all this for Biblical and especially New Testament study. The papyri have already made a valuable contribution to textual materials of both Old Testament and New Testament. For other early Christian literature their testimony has been of surprising interest (the Oxyrhynchus Logia and Gospel fragments). The discovery of a series of uncial manuscripts running through six centuries back of the Codex Vaticanus bridges the gap between what were our earliest uncials and the hand of the inscriptions, and puts us in a better position than ever before to fix the dates of uncial manuscripts. Minuscule or cursire hands, too, so common in New Testament manuscripts of the 10th and later centuries, appear in a new light when it is seen that such writing was not a late invention arising out of the uncial, but had existed side by side with it from at least the 4th century BC, as the ordinary, as distinguished from the literary, or book, hand. See <a href="./study/isbe/search.html?string=WRITING">WRITING</a>. The lexical contribution of these documentary papyri, too, is already considerable, and is likely to be very great. Like the New Testament writings, they reflect the common as distinguished from the literary language of the times, and words which had appeared exceptional or unknown in Greek literature are now shown to have been in common use. The problems of New Testament syntax are similarly illuminated. Specific historical notices sometimes light up dark points in the New Testament, as in a British Museum decree of Gaius Vibius Maximus, prefect of Egypt (104 AD), ordering all who are out of their districts to return to their own homes in view of the approaching census (compare <a onClick="return mV(\'Luk\',2,\'1-5\');">Lu 2:1-5</a>). Most important of all is the contribution of the papyri to a sympathetic knowledge of ancient life. They constitute a veritable gallery of New Testament characters. A strong light is sometimes thrown upon the social evils of the time, of which Paul and Juvenal wrote so sternly. The child, the prodigal, the thief, the host with his invitations, the steward with his accounts, the thrifty householder, the soldier on service receiving his viaticum, or retired as a veteran upon his farm, the Jewish money-lender, the husbandman, and the publican, besides people in every domestic relation, we meet at first hand in the papyri which they themselves in many cases have written. The worth of this for the historical interpretation of the New Testament is very great.<P>12. Chief Collections:<P>The principal collections of Greek papyri with their editors are Schow, Herculaneurn Papyri; Peyron, Turin Papyri; Leemans, Leyden Papyri; Wessely, Rainer and Paris Papyri; Kenyon and Bell, British Museum Papyri; Mahaffy and Smyly, Pettie Papyri; Grenfell and Hunt, Oxyrhynchus, Amherst and Hibeh Papyri (with Hogarth), Faytum Papyri, and (with Smyly and Goodspeed) Tebtunis Papyri; Hunt, Rylands Papyri; Nicole, Geneva Papyri; Krebs, Wilcken, Viereck, Schubart and others, Berlin Papyri; Meyer, Hamburg and Giessen Papyri; Deissmann, Heidelberg Papyri; Vitelli and Comparetti, Florence Papyri; Mitteis, Leipzig Papyri; Preisigke, Strassburg Papyri; Reinach, Paris Papyri; Jouguet and Lesquier, Lille Papyri; Rubensohn, Elephantine Papyri; Maspero, Cairo Papyri; Goodspeed, Cairo and Chicago Papyri. The Munich papyri have been described by Wilcken. Milligan\'s Greek Papyri, Kenyon\'s Paleography of Greek Papyri, and Deissmann\'s Light from the Ancient East are useful introductions to the general subject. Mayser has prepared a Grammatik der Ptolemaischen Papyri.<P>13. Coptic, Arabic, and Other Papyri:<P>Coptic, Arabic, Hebrew, and Demotic papyri are numerous; even Latin papyri are found. The Coptic have already made important contributions to early Christian literature. A considerable Coptic fragment of the Acts of Paul, and a Coptic (Akhmimic) codex of 1 Clement, almost complete, have recently been published by Carl Schmidt. Another much mutilated papyrus of 1 Clement, with James, complete, is at Strassburg. A Coptic text of Proverbs has been brought to Berlin from the same source which supplied the Clement codex (the White Convent, near Akhmim); indeed, Biblical papyri in Coptic are fairly numerous, and patristic literature is being rapidly enriched by such discoveries of Coptic papyri, e.g. the Deuteronomy, Jonah; Acts papyrus, 1912 (compare the Sahidic New Testament, Oxford, 1911).<P>Arabic papyri first began to appear from Egypt in 1825, when three Arabic pieces were brought to Paris and published by Silvestre de Sacy. Two others, from the 7th century, were published by him in 1827. It was not until the great papyrus finds of 1877-1878, however, that any considerable number of Arabic papyri found their way into Europe. The chief collections thus far formed are at Vienna (Rainer Collection), Berlin and Cairo. Becker has published the Schott-Reinhardt Arabic papyri at Heidelberg, and Karabacek has worked upon those at Vienna. They belong of course to the period after the Arabic conquest, 640 AD.``67';

isbe[6688]='Parable`par\'-a-b\'-l:<P>1. Name<P>2. Historical Data<P>3. Christ\'s Use of Parables.<P>4. Purpose of Christ in Using Parables<P>5. Interpretation of the Parables<P>6. Doctrinal Value of the Parables<hr /><P>1. Name:<P>Etymologically the word "parable" (paraballo) signifies a placing of two or more objects together, usually for the purpose of a comparison. In this widest sense of the term there is practically no difference between parable and simile (see Thayer, Dictionary of New Testament Greek, under the word). This is also what substantially some of Christ\'s parables amount to, which consist of only one comparison and in a single verse (compare <a onClick="return mV(\'Mat\',13,33);">Mt 13:33</a>, <a onClick="return mV(\'Mat\',13,\'44-46\');">44-46</a>). In the more usual and technical sense of the word, "parable" ordinarily signifies an imaginary story, yet one that in its details could have actually transpired, the purpose of the story being to illustrate and inculcate some higher spiritual truth. These features differentiate it from other and similar figurative narratives as also from actual history. The similarity between the last-mentioned and a parable is sometimes so small that exegetes have differed in the interpretation of certain pericopes. A characteristic example of this uncertainty is the story of Dives and Lazarus in <a onClick="return mV(\'Luk\',16,\'19-31\');">Lu 16:19-31</a>. The problem is of a serious nature, as those who regard this as actual history are compelled to interpret each and every statement, including too the close proximity of heaven and hell and the possibility of speaking from one place to the other, while those who regard it as a parable can restrict their interpretation to the features that constitute the substance of the story. It differs again from the fable, in so far as the latter is a story that could not actually have occurred (e.g. <a onClick="return mV(\'Jdg\',9,8);">Jud 9:8</a>ff; <a onClick="return mV(\'2Ki\',14,9);">2Ki 14:9</a>; <a onClick="return mV(\'Eze\',17,2);">Eze 17:2</a>f). The parable is often described as an extended metaphor. The etymological features of the word, as well as the relation of parables to other and kindred devices of style, are discussed more fully by Ed. Koenig, in HDB, III, 660ff.<P>2. Histotical Data:<P>Although Christ employed the parable as a means of inculcating His message more extensively and more effectively than any other teacher, He did not invent the parable. It was His custom in general to take over from the religious and linguistic world of thought in His own day the materials that He employed to convey the higher and deeper truths of His gospels, giving them a world of meaning they had never before possessed. Thus, e.g. every petition of the Lord\'s Prayer can be duplicated in the Jewish liturgies of the times, yet on Christ\'s lips these petitions have a significance they never had or could have for the Jews. The term "Word" for the second person in the Godhead is an adaptation from the Logos-idea in contemporaneous religious thought, though not specifically of Philo\'s. Baptism, regeneration, and kindred expressions of fundamental thoughts in the Christian system, are terms not absolutely new (compare Deutsch, article "Talmud" Literary Remains) The parable was employed both in the Old Testament and in contemporaneous Jewish literature (compare e.g. <a onClick="return mV(\'2Sa\',12,\'1-4\');">2Sa 12:1-4</a>; <a onClick="return mV(\'Isa\',5,\'1-6\');">Isa 5:1-6</a>; <a onClick="return mV(\'Isa\',28,\'24-28\');">28:24-28</a>, and for details see Koenig\'s article, loc. cit.). Jewish and other non-Biblical parables are discussed and illustrated by examples in Trench\'s Notes on the Parables of our Lord, introductory essay, chapter iv: "On Other Parables besides Those in the Scriptures."<P>3. Christ\'s Use of Parables:<P>The one and only teacher of parables in the New Testament is Christ Himself. The Epistles, although they often employ rhetorical allegories and similes, make absolutely no use of the parable, so common in Christ\'s pedagogical methods. The distribution of these in the Canonical Gospels is unequal, and they are strictly confined to the three Synoptic Gospels. Mark again has only one peculiar to this book, namely, the Seed Growing in Secret (<a onClick="return mV(\'Mar\',4,26);">Mr 4:26</a>), and he gives only three others that are found also in Matthew and Luke, namely the Sower, the Mustard Seed, and the Wicked Husbandman, so that the bulk of the parables are found in the First and the Third Gospels. Two are common to Matthew and Luke, namely the Leaven (<a onClick="return mV(\'Mat\',13,33);">Mt 13:33</a>; <a onClick="return mV(\'Luk\',13,21);">Lu 13:21</a>) and the Lost Sheep (<a onClick="return mV(\'Mat\',18,12);">Mt 18:12</a>; <a onClick="return mV(\'Luk\',15,3);">Lu 15:3</a>). Of the remaining parables, 18 are found only in Luke and 10 only in Mt. Luke\'s 18 include some of the finest, namely, the Two Debtors, the Good Samaritan, the Friend at Midnight, the Rich Fool, the Watchful Servants, the Barren Fig Tree, the Chief Seats, the Great Supper, the Rash Builder, the Rash King, the Lost Coin, the Lost Son, the Unrighteous Steward, the Rich Man and Lazarus, the Unprofitable Servants, the Unrighteous Judge, the Pharisee and Publican, and the Pounds. The 10 peculiar to Matthew are the Tares, the Hidden Treasure, the Pearl of Great Price, the Draw Net, the Unmerciful Servant, the Laborers in the Vineyard, the Two Sons, the Marriage of the King\'s Son, the Ten Virgins, and the Talents. There is some uncertainty as to the exact number of parables we have from Christ, as the Marriage of the King\'s Son is sometimes regarded as a different recension of the Great Supper, and the Talents of the Pounds. Other numberings are suggested by Trench, Julicher and others.<P>4. Purpose of Christ in Using Parables:<P>It is evident from such passages as <a onClick="return mV(\'Mat\',13,10);">Mt 13:10</a>ff (compare <a onClick="return mV(\'Mar\',4,10);">Mr 4:10</a>; <a onClick="return mV(\'Luk\',8,9);">Lu 8:9</a>) that Christ did not in the beginning of His career employ the parable as a method of teaching, but introduced it later. This took place evidently during the 2nd year of His public ministry, and is closely connected with the changes which about that time He made in His attitude toward the people in general. It evidently was Christ\'s purpose at the outset to win over, if possible, the nation as a whole to His cause and to the gospel; when it appeared that the leaders and the great bulk of the people would not accept Him for what He wanted to be and clung tenaciously to their carnal Messianic ideas and ideals, Christ ceased largely to appeal to the masses, and, by confining His instructions chiefly to His disciples and special friends, saw the necessity of organizing an ecclesiola in ecclesia, which was eventually to develop into the world-conquering church. One part of this general withdrawal of Christ from a proclamation of His gospel to the whole nation was this change in His method of teaching and the adoption of the parable. On that subject He leaves no doubt, according to <a onClick="return mV(\'Mat\',13,11);">Mt 13:11</a>ff; <a onClick="return mV(\'Mar\',4,12);">Mr 4:12</a>; <a onClick="return mV(\'Luk\',8,10);">Lu 8:10</a>. The purpose of the parable is both to reveal and to conceal the truth. It was to serve the first purpose in the case of the disciples, the second in the case of the uncleserving Jews. Psychologically this difference, notwithstanding the acknowledged inferiority in the training and education of the disciples, especially as compared with the scribes and lawyers, is not hard to understand. A simple-minded Christian, who has some understanding of the truth, can readily understand figurative illustrations of this truth, which would be absolute enigmas even to an educated Hindu or Chinaman. The theological problem involved is more difficult. Yet it is evident that we are not dealing with those who have committed the sin against the Holy Ghost, for whom there is no possibility of a return to grace, according to <a onClick="return mV(\'Hbr\',6,\'4-10\');">Heb 6:4-10</a>; <a onClick="return mV(\'Hbr\',10,26);">10:26</a> (compare <a onClick="return mV(\'Mat\',12,31,32);">Mt 12:31,32</a>; <a onClick="return mV(\'Mar\',3,\'28-30\');">Mr 3:28-30</a>), and who accordingly could no longer be influenced by an appeal of the gospel, and we have rather before us those from whom Christ has determined to withdraw the offer of redemption—whether temporarily or definitely and finally, remaining an open question—according to His policy of not casting pearls before the swine. The proper sense of these passages can be ascertained only when we remember that in <a onClick="return mV(\'Mar\',4,12);">Mr 4:12</a> and <a onClick="return mV(\'Luk\',8,10);">Lu 8:10</a>, the hina, need not express purpose, but that this particle is used here to express mere result only, as is clear too from the passage in <a onClick="return mV(\'Mat\',13,13);">Mt 13:13</a>, where the hoti, is found. The word is to be withheld from these people, so that this preaching would not bring about the ordinary results of conversion and forgiveness of sins. Hence, Christ now adopts a method of teaching that will hide the truth from all those who have not yet been imbued by it, and this new method is that of the parable.<P>5. Interpretation of the Parables:<P>The principles for the interpretation of the parables, which are all intended primarily and in the first place for the disciples, are furnished by the nature of the parable itself and by Christ\'s own method of interpreting some of them. The first and foremost thing to be discovered is the scope or the particular spiritual truth which the parable is intended to convey. Just what this scope is may be stated in so many words, as is done, e.g., by the introductory words to that of the Pharisee and the Publican. Again the scope may be learned from the occasion of the parable, as the question of Peter in <a onClick="return mV(\'Mat\',18,21);">Mt 18:21</a> gives the scope of the following parable, and the real purpose of the Prodigal Son parable in <a onClick="return mV(\'Luk\',15,11);">Lu 15:11</a>ff is not the story of this young man himself, but is set over against the murmuring of the Pharisees because Christ received publicans and sinners, in 15::1 and 2, to exemplify the all-forgiving love of the Father. Not the Son but the Father is in the foreground in this parable, which fact is also the connecting link between the two parts. Sometimes the scope can be learned only from an examination of the details of the parable itself and then may be all the more uncertain.<P>A second principle of the interpretation of the parables is that a sharp distinction must be made between what the older interpreters called the body (corpus) and the soul (anima) of the story; or, to use other expressions, between the shell or bark (cortex) and the marrow (medulla). Whatever serves only the purpose of the story is the "ornamentation" of the parable, and does not belong to the substance. The former does not call for interpretation or higher spiritual lesson; the latter does. This distinction between those parts of the parable that are intended to convey spiritual meanings and those which are to be ignored in the interpretation is based on Christ\'s own interpretation of the so-called parabolae perfectae. Christ Himself, in <a onClick="return mV(\'Mat\',13,18);">Mt 13:18</a>ff, interprets the parable of the Sower, yet a number of data, such as the fact that there are four, and not more or fewer kinds of land, and others, are discarded in this explanation as without meaning. Again in His interpretation of the Tares among the Wheat in <a onClick="return mV(\'Mat\',13,36);">Mt 13:36</a>ff, a number of details of the original parable are discarded as meaningless.<P>Just which details are significant and which are meaningless in a parable is often hard, sometimes impossible to determine, as the history of their exegesis amply shows. In general it can be laid down as a rule, that those features which illustrate the scope of the parable belong to its substance, and those which do not, belong to the ornamentation. But even with this rule there remain many exegetical cruces or difficulties. Certain, too, it is that not all of the details are capable of interpretation. Some are added of a nature that indeed illustrate the story as a story, but, from the standpoint of Christian morals, are more than objectionable. The Unjust Steward in using his authority to make the bills of the debtors of his master smaller may be a model, in the shrewd use of this world\'s goods for his purpose, that the Christian may follow in making use of his goods for his purposes, but the action of the steward itself is incapable of defense. Again, the man who finds in somebody else\'s property a pearl of great price but conceals this fact from the owner of the land and quietly buys this ground may serve as an example to show how much the kingdom of God is worth, but from an ethical standpoint his action cannot be sanctioned. In general, the parable, like all other forms of figurative expression, has a meaning only as far as the tertium comparationis goes, that is, the third thing which is common to the two things compared. But all this still leaves a large debatable ground in many parables. In the Laborers in the Vineyard does the "penny" mean anything, or is it an ornament? The history of the debate on this subject is long. In the Prodigal Son do all the details of his sufferings, such as eating the husks intended for swine, have a spiritual meaning?<P>6. Doctrinal Value of the Parables:<P>The interpreters of former generations laid down the rule, theologia parabolica non eat argumentativa, i.e. the parables, very rich in mission thoughts, do not furnish a basis for doctrinal argument. Like all figurative expressions and forms of thought, the parables too contain elements of doubt as far as their interpretation is concerned. They illustrate truth but they do not prove or demonstrate truth. Omnia aimilia claudicunt, "all comparisons limp," is applicable here also. No point of doctrine can be established on figurative passages of Scripture, as then all elements of doubt would not be eliminated, this doubt being based on the nature of language itself. The argumentative or doctrinal value of parables is found in this, that they may, in accordance with the analogy of Scripture, illustrate truth already clearly expressed elsewhere. Compare especially Trench, introductory essay, in Notes on the Parables of our Lord, chapter iii., 30-43; and Terry, Biblical Hermeneutics, Part II, chapter vi: "Interpretation of Parables," 188-213, in which work a full bibliography is given. Compare also the article "Parabel" in Hauck-Herzog, Realencyklopadie fur protestantische Theologie und Kirche.``159';
isbe[6689]='Paraclete`par\'-a-klet:<P>1. Where Used:<P>This word occurs 5 times in the New Testament, all in the writings of John. Four instances are in the Gospel and one in the First Epistle. In the Gospel the in the Epistle, <a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a>. "Paraclete" is simply the Greek word transferred into English. The translation of the word in English Versions of the Bible is "Comforter" in the Gospel, and "Advocate" in the Epistle. The Greek word is parakletos, froth the verb parakaleo. The word for "Paraclete" is passive in form, and etymologically signifies "called to one\'s side." The active form of the word is parakletor, not found in the New Testament but found in Septuagint in <a onClick="return mV(\'Job\',16,2);">Job 16:2</a> in the plural, and means "comforters," in the saying of Job regarding the "miserable comforters" who came to him in his distress.<P>2. General Meaning:<P>In general the word signifies:<P>(1) a legal advocate, or counsel for defense,<P>(2) an intercessor,<P>(3) a helper, generally.<P>The first, or technical, judicial meaning is that which predominates in classical usage, corresponding to our word "advocate," "counsel," or "attorney." The corresponding Latin word is advocatus, "advocate," the word applied to Christ in English Versions of the Bible in the translation of the Greek word parakletos, in <a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a>. There is some question whether the translation "Comforter" in the passages of John\'s Gospel in the King James Version and the Revised Version (British and American) is warranted by the meaning of the word. It is certain that the meaning "comforter" is not the primary signification, as we have seen. It is very probably, however, a secondary meaning of the word, and some of its cognates clearly convey the idea of comfort in certain connections, both in Septuagint and in the New Testament (<a onClick="return mV(\'Gen\',37,35);">Ge 37:35</a>; <a onClick="return mV(\'Zec\',1,13);">Zec 1:13</a>; <a onClick="return mV(\'Mat\',5,4);">Mt 5:4</a>; <a onClick="return mV(\'2Cr\',1,3,4);">2Co 1:3,4</a>). In the passage in 2 Corinthians the word in one form or another is used 5 times and in each means "comfort." In none of these instances, however, do we find the noun "Paraclete," which we are now considering.<P>3. In the Talmud and Targums:<P>Among Jewish writers the word "Paraclete" came to have a number of meanings. A good deed was called a paraclete or advocate, and a transgression was an accuser. Repentance and good works were called paracletes: "The works of benevolence and mercy done by the people of Israel in this world become agents of peace and intercessors (paracletes) between them and their Father in heaven." The sin offering is a paraclete; the paraclete created by each good deed is called an angel (Jewish Encyclopedia, IX, 514-15, article "Paraclete").<P>4. As Employed by Philo:<P>Philo employs the word in several instances. Usually he does not use it in the legal, technical sense. Joseph is represented as bestowing forgiveness on his brethren who had wronged him and declaring that they needed "no one else as paraclete," or intercessor (De Joseph c. 40). In his Life of Moses, iii.14, is a remarkable passage which indicates Philo\'s spiritualizing methods of interpreting Scripture as well as reflects his philosophic tendency. At the close of a somewhat elaborate account of the emblematic significance of the vestments of the high priest and their jeweled decorations, his words are: "The twelve stones arranged on the breast in four rows of three stones each, namely, the logeum, being also an emblem of that reason which holds together and regulates the universe. For it was indispensable (anagkaion) that the man who was consecrated to the Father of the world should have, as a paraclete, his son, the being most perfect in all virtue, to procure the forgiveness of sins, and a supply of unlimited blessings." This is rather a striking verbal or formal parallel to the statement in <a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a> where Christ is our Advocate with the Father, although of course Philo\'s conceptions of the Divine "reason" and "son" are by no means the Christian conceptions.<P>5. The Best Translation:<P>If now we raise the question what is the best translation of the term "Paraclete" in the New Testament, we have a choice of several words. Let us glance at them in order. The translation "Comforter" contains an element of the meaning of the word as employed in the Gospels, and harmonizes with the usage in connection with its cognates, but it is too narrow in meaning to be an adequate translation. Dr. J. Hastings in an otherwise excellent article on the Paraclete in HDB says the Paraclete was not sent to comfort the disciples, since prior to His actual coming and after Christ\'s promise the disciples\' sorrow was turned into joy. Dr. Hastings thinks the Paraclete was sent to cure the unbelief or half-belief of the disciples. But this conceives the idea of comfort in too limited a way. No doubt in the mind of Jesus the comforting aspect, of the Spirit\'s work applied to all their future sorrows and trials, and not merely to comfort for their personal loss in the going of Christ to the Father. Nevertheless there was more in the work of the Paraclete than comfort in sorrow. "Intercessor" comes nearer the root idea of the term and contains an essential part of the meaning. "Advocate" is a closely related word, and is also suggestive of the work of the Spirit. Perhaps there is no English word broad enough to cover all the significance of the word "Paraclete" except the word "Helper." The Spirit helps the disciples in all the above-indicated ways. Of course the objection to this translation is that it is too indefinite. The specific Christian conception is lost in the comprehensiveness of the term. Our conclusion, therefore, is that the term "Paraclete" itself would perhaps be the best designation of the Spirit in the passage in John\'s Gospel. It would thus become a proper name for the Spirit and the various elements of meaning would come to be associated with the words which are found in the context of the Gospel.<P>Christianity introduced many new ideas into the world for which current terms were inadequate media of expression. In some cases it is best to adopt the Christian term itself, in our translations, and let the word slowly acquire its own proper significance in our thought and life. If, however, instead of translating we simply transfer the word "Paraclete" as a designation of the Holy Spirit in the Gospel passages, we would need then to translate it in the passage in the Epistle where it refers to Christ. But this would offer no serious difficulty. For fortunately in the Epistle the word may very clearly be translated "Advocate" or "Intercessor."<P>6. Christ\'s Use of the Word:<P>We look next at the contents of the word as employed by Jesus in reference to the Holy Spirit. In <a onClick="return mV(\'Jhn\',14,16);">Joh 14:16</a> the Paraclete is promised as one who is to take the place of Jesus. It is declared elsewhere by Jesus that it is expedient that He go away, for unless He go away the Paraclete will not come (<a onClick="return mV(\'Jhn\',16,7);">Joh 16:7</a>). Is the Paraclete, then, the successor or the substitute for Christ as He is sometimes called? The answer is that He is both and neither. He is the successor of Christ historically, but not in the sense that Christ ceases to act in the church. He is the substitute for Christ\'s physical presence, but only in order that He may make vital and actual Christ\'s spiritual presence. As we have seen, the Paraclete moves only in the range of truths conveyed in and through Christ as the historical manifestation of God. A "Kingdom of the Spirit," therefore, is impossible in the Christian sense, save as the historical Jesus is made the basis of the Spirit\'s action in history. The promise of Jesus in <a onClick="return mV(\'Jhn\',14,18);">14:18</A>, "I come unto," is parallel and equivalent in meaning with the preceding promise of the Paraclete. The following are given as the specific forms of activity of the Holy Spirit:<P>(1) to show them the things of Christ,<P>(2) to teach them things to come,<P>(3) to teach them all things,<P>(4) to quicken their memories for past teaching,<P>(5) to bear witness to Christ,<P>(6) to dwell in believers,<P>(7) other things shown in the context such as "greater works" than those of Christ (see <a onClick="return mV(\'Jhn\',14,16,17);">Joh 14:16,17</a>),<P>(8) to convict of sin, of righteousness and judgment.<P>It is possible to range the shades of meaning outlined above under these various forms of the Spirit\'s activity. As Comforter His work would come under (1), (2), (3) and (6); as Advocate and Intercessor under (6), (7), (8); as Helper and Teacher under (1), (2), (3), (4), (5), (6), (7), (8).<P>The manner of the sending of the Paraclete is of interest. In <a onClick="return mV(\'Jhn\',14,16);">Joh 14:16</a> the Paraclete comes in answer to Christ\'s prayer. The Father will give the Spirit whom the world cannot receive. In <a onClick="return mV(\'Jhn\',14,26);">Joh 14:26</a> the Father will send the Spirit in Christ\'s name. Yet in <a onClick="return mV(\'Jhn\',15,26);">15:26</A> Christ says, "I will send (him) unto you from the Father, even the Spirit of truth," and in <a onClick="return mV(\'Jhn\',16,7);">16:7</A>, "If I go, I will send him unto you."<P>See <a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>.<P>7. As Applied to Christ:<P>It remains to notice the passage in <a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a> where the term "Paraclete" is applied to Christ: "If any man sin, we have an Advocate with the Father, Jesus Christ the righteous"; 2:2 reads: "and he is the propitiation for our sins; and not for ours only, but also for the whole world." Here the meaning is quite clear and specific. Jesus Christ the righteous is represented as our Advocate or Intercessor with the Father. His righteousness is set over against our sin. Here the Paraclete, Christ, is He who, on the basis of His propitiatory offering for the sins of men, intercedes for them with God and thus averts from them the penal consequences of their transgressions. The sense in which Paraclete is here applied to Christ is found nowhere in the passages we have cited from the Gospel. The Holy Spirit as Paraclete is Intercessor or Advocate, but not in the sense here indicated. The Spirit as Paraclete convicts the world of sin, of righteousness and judgment. Jesus Christ as Paraclete vindicates believers before God.<P>LITERATURE.<P>Grimm-Thayer, Gr-Eng. Lexicon of the New Testament; Cremer, Biblico-Theol. Lexicon; HDB, article "Paraclete"; DCG, article "Paraclete"; EB, article "Paraclete"; Jewish Encyclopedia, article "Paraclete"; Hare, Mission of the Comforter; Pearson, On the Creed; Taylor, Sayings of the Jewish Fathers; various comms., Westcott, Godet and others.`<a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>`127';
isbe[6690]='Paradise`par\'-a-dis (pardec; paradeisos):<P>1. Origin and Meaning:<P>A word probably of Persian origin meaning a royal park. See <a href="./study/isbe/search.html?string=GARDEN">GARDEN</a>. The word occurs in the Hebrew Scriptures but 3 times: <a onClick="return mV(\'Sgs\',4,13);">So 4:13</a>, where it is translated "an orchard"; <a onClick="return mV(\'Neh\',2,8);">Ne 2:8</a>, where it is translated "a forest" (the Revised Version margin "park"); <a onClick="return mV(\'Ecc\',2,5);">Ec 2:5</a>, where it is in the plural number (the King James Version "orchards," the Revised Version (British and American) "parks"). But it was early introduced into the Greek language, being made specially familiar by Xenophon upon his return from the expedition of Cyrus the Younger to Babylonia (see Anab. i.2, section 7; 4, section 9; Cyrop. i.3, section 14). In Septuagint the word is of frequent use in translating other terms of kindred significance. The Garden of Eden became "the paradise of pleasure or luxury" (<a onClick="return mV(\'Gen\',2,15);">Ge 2:15</a>; <a onClick="return mV(\'Gen\',3,23);">3:23</a>; <a onClick="return mV(\'Joe\',2,3);">Joe 2:3</a>). The valley of the Jordan became \'the paradise of God\' (<a onClick="return mV(\'Gen\',13,10);">Ge 13:10</a>). In <a onClick="return mV(\'Eze\',31,8,9);">Eze 31:8,9</a>, according to Septuagint, there is no tree in the \'paradise of God\' equal to that which in the prophet\'s vision symbolizes the glory of Assyria. The figures in the first 9 verses of this chapter may well have been suggested by what the prophet had himself seen of parks in the Persian empire.<P>2. Use in Jewish Literatare:<P>In the apocryphal and pseudepigraphical literature the word is extensively used in a spiritual and symbolia sense, signalizing the place of happiness to be inherited by the righteous in contrast to Gehenna, the place of punishment to which the wicked were to be assigned. In the later Jewish literature "Sheol" is represented as a place where preliminary rewards and punishments are bestowed previous to the final judgment (see <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD +">ESCHATOLOGY OF THE OLD TESTAMENT</a>; and compare 2Esdras 2:19; 8:52). But the representations in this literature are often vague and conflicting, some holding that there were 4 divisions in Sheol, one for those who were marryred for righteousness\' sake, one for sinners who on earth had paid the penalty for their sins, one for the just who had not suffered martyrdom, and one for sinners who had not been punished on earth (En 102:15). But among the Alexandrian Jews the view prevailed that the separation of the righteous from the wicked took place immediately after death (see The <span class="noTag">Wisdom of Solomon 3:14</span>; <span class="noTag">4:10</span>; <span class="noTag">5:5,17</a>; Josephus, Ant, XVIII, i, 3; B J, II, viii, 14). This would seem to be the idea underlying the use of the word in the New Testament where it occurs only 3 times, and then in a sense remarkably free from sensuous suggestions.<P>3. Used by Christ:<P>Christ uses the word but once (<a onClick="return mV(\'Luk\',23,43);">Lu 23:43</a>), when He said to the penitent thief, "Today shalt thou be with me in Paradise" (see <a href="./study/isbe/search.html?string=ABRAHAM\'S+BOSOM">ABRAHAM\'S BOSOM</a> (compare <a href="./study/isbe/search.html?string=HADES">HADES</a>)). This was no time to choose words with dialectical precision. The consolation needed by the penitent thief suffering from thirst and agony and shame was such as was symbolized by the popular conception of paradise, which, as held by the Essenes, consisted of "habitations beyond the ocean, in a region that is neither oppressed with storms of rain, or snow, or with intense heat, but that this place is such as is refreshed by the gentle breathin of a west wind, that is perpetually blowing from the ocean" (Josephus, BJ, II, viii, 11).<P>See <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>.<P>4. Other Forms and Uses:<P>Nowhere in His public teaching did Christ use the word "Paradise." He does indeed, when speaking in parables, employ the figure of the marriage supper, and of new wine, and elsewhere of Abraham\'s bosom, and of houses not made by hands, eternal in the heavens; but all these references are in striking contrast to the prevailing sensuous representations of the times (see 2Esdras 2:19; 8:52), and such as have been introduced into Mohammedan literature. Likewise Paul (<a onClick="return mV(\'2Cr\',12,4);">2Co 12:4</a>) speaks of having been "caught up into Paradise" where he "heard unspeakable words, which it is not lawful for a man to utter." See <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>. But in <a onClick="return mV(\'2Cr\',12,2);">2Co 12:2</a> this is referred to more vaguely as "the third heaven." In <a onClick="return mV(\'Rev\',2,7);">Re 2:7</a> it is said to the members of the church at Ephesus who should overcome, "I (will) give to eat of the tree of life, which is in the Paradise of God," where the Eden of <a onClick="return mV(\'Gen\',2,8);">Ge 2:8</a> is made the symbol of the abode of the righteous, more fully described without the words in the last chapter of the book. The reticence of the sacred writers respecting this subject is in striking contrast to the profuseness and crudity both of rabbinical writers before Christ and of apocryphal writers and Christian commentators at a later time. "Where the true Gospels are most reticent, the mythical are most exuberant" (Perowne). This is especially noticeable in the Gospel of Nicodemus, the Acta Philippi, the writings of Tertullian (De Idol. c. 13; De Anim. c. 55; Tertullian\'s treatise De Paradiso is lost), Clement of Alexandria (Frag. 51), and John of Damascus (De Orthod. Fid., ii, 11). In modern literature the conception of Paradise is effectually sublimated and spiritualized in Faber\'s familiar hymn:<P class="in15">"O Paradise, O Paradise,<br>I greatly long to see<br>The special place my dearest Lord<br>Is destining for me;<br>Where loyal hearts and true<br>Stand ever in the light,<br>All rapture thro\' and thro\',<br>In God\'s most holy sight."<P>LITERATURE.<P>The articles in the great Dicts., especially Herzog, RE; HDB; Alger, Critical History of the Doctrine of a Future Life; Schodde, Book of Enoch; Lightfoot, Hor. Heb. on <a onClick="return mV(\'Luk\',23,43);">Lu 23:43</a>; Salmond, The Christian Doctrine of Immortality, 346ff. For a good account of Jewish and patristic speculation on Paradise, see Professor Plumptre\'s article in Smith\'s D.B, II, 704ff.``198';
isbe[6691]='Parah`pa\'-ra, par\'-a (ha-parah; Codex Vaticanus Phara; Codex Alexandrinus Aphar): A city named as in the territory of Benjamin between Avvim and Ophrah (<a onClick="return mV(\'Jos\',18,23);">Jos 18:23</a>). It may with some confidence be identified with Farah on Wady Farah, which runs into Wady Suweinit, about 3 miles northeast of \'Anata.``1';
isbe[6692]='Paralysis, Paralytic`pa-ral\'-i-sis, par-alit\'-ik.`<a href="./study/isbe/search.html?string=PALSY">PALSY</a>`1';
isbe[6693]='Paramour`par\'-a-moor (pilleghesh, "a concubine," masculine or feminine): A term applied in <a onClick="return mV(\'Eze\',23,20);">Eze 23:20</a> to the male lover, but elsewhere translated "concubine."``1';
isbe[6694]='Paran, El-Paran`pa\'-ran, (pa\'ran, \'el-pa\'ran; Pharan):<P>(1) El-paran (<a onClick="return mV(\'Gen\',14,6);">Ge 14:6</a>) was the point farthest south reached by the kings. Septuagint renders \'el by terebinthos, and reads, "unto the terebinth of Paran." The evidence is slender, but it is not unreasonable to suppose that this is the place elsewhere (<a onClick="return mV(\'Deu\',2,8);">De 2:8</a>; <a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>, etc.) called Elath or Eloth (\'el with feminine termination), a seaport town which gave its name to the Aelanitic Gulf (modern Gulf of \'Aqaba), not far from the wilderness of Paran (2).<P>(2) Many places named in the narrative of the wanderings lay within the Wilderness of Paran (<a onClick="return mV(\'Num\',10,12);">Nu 10:12</a>; <a onClick="return mV(\'Num\',13,21);">13:21</a>; <a onClick="return mV(\'Num\',27,14);">27:14</a>; compare <a onClick="return mV(\'Num\',13,3,16);">13:3,16</a>, etc.). It is identified with the high limestone plateau of Ettih, stretching from the southwest of the Dead Sea to Sinai along the west side of the Arabah. This wilderness offered hospitality to Ishmael when driven from his father\'s tent (<a onClick="return mV(\'Gen\',21,21);">Ge 21:21</a>). Hither also came David when bereaved of Samuel\'s protection (<a onClick="return mV(\'1Sa\',25,1);">1Sa 25:1</a>).<P>(3) Mount Paran (<a onClick="return mV(\'Deu\',33,2);">De 33:2</a>; <a onClick="return mV(\'Hab\',3,3);">Hab 3:3</a>) may be either Jebel Maqrah, 29 miles south of \'Ain Kadis (Kadesh-barnea), and 130 miles north of Sinai (Palmer, Desert of the Exodus, 510); or the higher and more imposing range of mountains west of the Gulf of \'Aqaba. This is the more probable if El-paran is rightly identified with Elath.<P>(4) Some place named Paran would seem to be referred to in <a onClick="return mV(\'Deu\',1,1);">De 1:1</a>; but no trace of such a city has yet been found. Paran in <a onClick="return mV(\'1Ki\',11,18);">1Ki 11:18</a> doubtless refers to the district west of the Arabah.``54';
isbe[6695]='Parbar`par\'-bar (parbar (<a onClick="return mV(\'1Ch\',26,18);">1Ch 26:18</a>), and parwarim, translated "precincts" (the King James Version "suburbs" in <a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>); Septuagint pharoureim): In <a onClick="return mV(\'1Ch\',26,18);">1Ch 26:18</a> reference is made to the position of the gatekeepers, "for Parbar westward, four at the causeway, and two at Parbar." The word is supposed to be of Persian origin, connected with Parwar, meaning "possessing light," and hence, the meaning has been suggested of "colonnade" or "portico," some place open to the light. In the plural form (<a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>) the situation of the house of "Nathan-melech" is described, and the translation, "in the colonnades," should, if the above origin is accepted, be more correct than English Versions of the Bible. It is difficult to understand the occurrence of a Persian word at this time, and it has been suggested (EB, col 3585) that the word is a description of the office of Nathan-melech, ba-parwarim being a misreading for ba-peradhim, meaning "who was over the mules."``117';
isbe[6696]='Parcel`par\'-sel: Properly "a little part," in Elizabethan English being used in almost any sense. In the King James Version of <a onClick="return mV(\'Gen\',33,19);">Ge 33:19</a>; <a onClick="return mV(\'Jos\',24,32);">Jos 24:32</a>; <a onClick="return mV(\'Rth\',4,3);">Ru 4:3</a>; <a onClick="return mV(\'1Ch\',11,13,14);">1Ch 11:13,14</a> it is the translation of chelqah; <a onClick="return mV(\'Jhn\',4,5);">Joh 4:5</a> of chorion—both the Greek and Hebrew words meaning a "piece of land." the Revised Version (British and American) writes "plot" in <a onClick="return mV(\'1Ch\',11,13,14);">1Ch 11:13,14</a>, but if the change was needed at all, it should have been made throughout.``1';
isbe[6697]='Parched`parcht: Four different root words have been translated "parched" in English Versions of the Bible:<P>(1) qalah, "roasted." This word is applied to corn or pulse. It is a common practice in Palestine and Syria to roast the nearly ripe wheat for eating as a delicacy. A handful of heads of fully developed grain, with the stalks still attached, are gathered and bound together and then, holding the bunch by the lower ends of the stalks, the heads are toasted over a fire of straw or thorn bush. By the time most of the sheaths are blackened the grain is toasted, and, after rubbing off the husks between the hands, is ready to eat (<a onClick="return mV(\'Lev\',2,14);">Le 2:14</a>). A form of pulse is toasted in the same way and is more sought after than the grain. In the larger towns and cities, venders go about the streets selling bunches of toasted chick-peas. The Bible references, however, are probably to another form of roasted grain. The threshed wheat or pulse is roasted over a fire on an iron pan or on a fiat stone, being kept in constant motion with a stirrer until the operation is finished. The grain thus prepared is a marketable article. Parched grain is not now so commonly met with as the pulse, which either roasted or unroasted is called chommoc (from Arabic "to roast" or "parch"). Parched pulse is eaten not only plain, but is often made into confection by coating the seeds with sugar. In Bible times parched wheat or pulse was a common food, even taking the place of bread (<a onClick="return mV(\'Lev\',23,14);">Le 23:14</a>; <a onClick="return mV(\'Jos\',5,11);">Jos 5:11</a>; <a onClick="return mV(\'Rth\',2,14);">Ru 2:14</a>). It was a useful food supply for armies, as it required no further cooking (<a onClick="return mV(\'1Sa\',17,17);">1Sa 17:17</a>). It was frequently included in gifts or hostages (<a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>; <a onClick="return mV(\'2Sa\',17,28);">2Sa 17:28</a>).<P>(2) charer, "burned" or "parched" (compare Arabic chariq, "burned"), is used in the sense of dried up or arid in <a onClick="return mV(\'Jer\',17,6);">Jer 17:6</a>.<P>(3) tsicheh, is used in <a onClick="return mV(\'Isa\',5,13);">Isa 5:13</a>, the King James Version "dried up" the Revised Version (British and American) "parched" tsechichah in <a onClick="return mV(\'Psa\',68,6);">Ps 68:6</a>, the King James Version "dry," the Revised Version (British and American) "parched."<P>(4) sharabh, rendered "parched" in the King James Version, is "glowing" in the Revised Version (British and American). The word implies the peculiar wavy effect of the air above parched ground, usually accompanied by mirages (compare Arabic serdb, "mirage") (<a onClick="return mV(\'Isa\',35,7);">Isa 35:7</a>; <a onClick="return mV(\'Isa\',49,10);">49:10</a>). In predicting a happy future for Zion the prophet could have chosen no greater contrast than that the hot glowing sands which produce illusive water effects should be changed into real pools.`<a href="./study/isbe/search.html?string=MIRAGE">MIRAGE</a>`133';
isbe[6698]='Parched Corn (Grain)`parcht.`<a href="./study/isbe/search.html?string=FOOD">FOOD</a>`1';
isbe[6699]='Parchment`parch\'-ment (membrana (<a onClick="return mV(\'2Ti\',4,13);">2Ti 4:13</a>)): The word "parchment "which occurs only once (<a onClick="return mV(\'2Ti\',4,13);">2Ti 4:13</a>), is derived from Latin pergamena (Greek Pergamene), i.e. pertaining to Pergamum, the name of an ancient city in Asia Minor where, it is believed, parchment was first used. Parchment is made from the skins of sheep, goats or young calves. The hair and fleshy portions of the skin are removed as in tanning by first soaking in lime and then dehairing, scraping and washing. The skin is then stretched on a frame and treated with powdered chalk, or other absorptive agent, to remove the fatty substances, and is then dried. It is finally given a smooth surface by rubbing with powdered pumice. Parchment was extensively used at the time of the early Christians for scrolls, legal documents, etc., having replaced papyrus for that purpose. It was no doubt used at even a much earlier time. The roll mentioned in <a onClick="return mV(\'Jer\',36,\'1-\');">Jer 36</a> may have been of parchment. Scrolls were later replaced by codices of the same material. After the arabs introduced paper, parchment was still used for centuries for the book bindings. Diplomas printed on "sheepskins," still issued by many universities, represent the survival of an ancient use of parchment.`<a href="./study/isbe/search.html?string=PARCHMENTS">PARCHMENTS</a>`133';
isbe[6700]='Parchments`parch\'-ments (membranai, "membranes," "parchments," "vellum"): The skins, chiefly of sheep, lambs, goats and calves, prepared so as to be used for writing on (<a onClick="return mV(\'2Ti\',4,13);">2Ti 4:13</a>).<P>In Greek and Roman times parchment was much employed as a writing material. "At Rome, in the 1st century BC, and the 1st and 2d centuries AD, there is evidence of the use of vellum, but only for notebooks and for rough drafts or inferior copies of literary works....A fragment of a vellum MS, which may belong to this period, is preserved in British Museum Add. manuscript 34,473, consisting of two leaves of Demosthenes, De Fals. Leg., in a small hand, which pears to be of the 2nd cent." (F. G. Kenyon in HDB, IV, 947).<P>Paul directs Timothy that, when he comes from Ephesus to Rome, he is to bring "the books, especially the parchments." These, as well as the "cloak," which is also mentioned, had evidently been "left at Troas with Carpus." What were these parchments? They are distinguished from "the books," which were probably a few choice volumes or rolls, some portions of the Scriptures of the Old Testament, some volumes of the Law of Moses or of the Prophets or of the Psalms. Among "the books" there might also be Jewish exegetical works, or heathen writings, with which, as is made evident by references in his Epistles, Paul was well acquainted.<P>The parchments were different from these, and were perhaps notebooks, in which the apostle had, from time to time, written what he had observed and wished to preserve as specially worthy of remembrance, facts which he had gathered in his study of the Old Testament or of other books. These notes may have been the result of many years\' reading and study, and he wished Timothy to bring them to him.<P>Various conjectures have been made in regard to the contents of "the parchments." It has been suggested by Kenyon (HDB, III, 673) that they contained the Old Testament in Greek; by Farrar, that the parchments were a diploma of Paul\'s Roman citizenship; by Bull, that they were his commonplace books; by Latham, that the parchments were a copy of the Grundschrift of the Gospels, a volume containing the all-important narrative of the Saviour\'s life and cross and resurrection. Workman (Persecution in the Early Church, 39) writes: "By tas membranas I understand the proofs of his citizenship."<P>Whatever their contents may have been, they were of such value that Paul wished to have them with him in his prison at Rome, so that, if life were spared for even a few weeks or months, the books and parchments might be at hand for reference. Perhaps in the fact that the books and the parchments and the cloak had been left at Troas with Carpus, there may be a hint that his final arrest by the Roman authorities took place at that city, and that was the suddenness of his arrest that caused him to be unable to carry his books and parchments and the cloak with him. "The police had not even allowed him time to find his overcoat or necessary documents" (Workman, op. cit., 39; see p. 1886, 14).<P>Be this as it may, he desired to have them now. His well-disciplined mind, even in the near prospect of death by public execution, could find the most joyous labor in the work of the gospel, wherever his influence reached, and could also find relaxation among "the books, especially the parchments."``155';
