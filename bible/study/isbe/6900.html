</a>), having encroached from their plains into the Shephelah (or low hills) of Judah, at the foot of the mountains. Delilah was a Philistine woman, living in the valley of Sorek, close to Samson\'s home. In the last year of Eli (<a onClick="return mV(\'1Sa\',4,1);">1Sa 4:1</a>) we find the Philistines attacking the mountains near Mizpeh, where they captured the ark. Samuel drove them back and placed his monument of victory between Mizpeh and Jeshanah (Shen; see the Septuagint; <a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a>) on the mountain ridge of Benjamin. He even regained towns in the Shephelah as far as Ekron and Gath (<a onClick="return mV(\'1Sa\',7,14);">1Sa 7:14</a>); but at the opening of Saul\'s reign (<a onClick="return mV(\'1Sa\',10,5);">1Sa 10:5</a>) the Philistines had a "garrison" at Gibeah—or a chief named Hasib according to Septuagint. They raided from this center (<a onClick="return mV(\'1Sa\',13,\'17-23\');">1Sa 13:17-23</a>) in all directions, and prevented the Hebrews from arming themselves, till Jonathan drove them from Michmash (<a onClick="return mV(\'1Sa\',14,\'1-47\');">1Sa 14:1-47</a>). David\'s victory (<a onClick="return mV(\'1Sa\',17,2);">1Sa 17:2</a>) was won in the Valley of Elah east of Gath, and the pursuit (<a onClick="return mV(\'1Sa\',17,52);">1Sa 17:52</a>) was as far as Ekron. We here read that the Philistine champion wore armor of bronze (<a onClick="return mV(\'1Sa\',17,\'4-7\');">1Sa 17:4-7</a>), his spear head being of iron. They still invaded the Shephelah after this defeat, robbing the threshing-floors of Keilah (<a onClick="return mV(\'1Sa\',23,1);">1Sa 23:1</a>) near Adullam at the foot of the Hebron Mountains (see <a onClick="return mV(\'1Sa\',23,27);">1Sa 23:27</a>; <a onClick="return mV(\'1Sa\',24,1);">24:1</a>). David\'s band of outlaws gradually increasing from 400 to 600 men (<a onClick="return mV(\'1Sa\',22,2);">1Sa 22:2</a>; <a onClick="return mV(\'1Sa\',27,2);">27:2</a>), being driven from the Hebrew lands, accompanied him to Gath, which is usually placed at Tell es-Safi, at the point where the Valley of Elah enters the Philistine plain. It appears that Achish, king of Gath, then ruled as far south as Ziklag (<a onClick="return mV(\'Jos\',15,31);">Jos 15:31</a>; <a onClick="return mV(\'1Sa\',27,6);">1Sa 27:6</a>) in the Beersheba plains; but he was not aware of the direction of David\'s raids at this distance. Achish supposed David to be committed to his cause (<a onClick="return mV(\'1Sa\',27,12);">1Sa 27:12</a>), but the Philistine lords suspected him and his Hebrew followers (<a onClick="return mV(\'1Sa\',29,3);">1Sa 29:3</a>) when going up to Jezreel.<P>6. History Continued to Time of Ahaz:<P>After they had killed Saul, we hear no more of them till the 8th year of David, when, after taking Jerusalem, he apparently went down to Adullam (<a onClick="return mV(\'2Sa\',5,17);">2Sa 5:17</a>) and fell upon them in their rear as they advanced on his capital. He then destroyed their supremacy (<a onClick="return mV(\'2Sa\',8,1);">2Sa 8:1</a>) as far as Gezer (<a onClick="return mV(\'1Ch\',20,4);">1Ch 20:4</a>), and the whole of Philistia was subject to Solomon (<a onClick="return mV(\'1Ki\',4,21);">1Ki 4:21</a>), though not long after his death they seem to have held the town of Gibbethon (<a onClick="return mV(\'1Ki\',15,27);">1Ki 15:27</a>; <a onClick="return mV(\'1Ki\',16,15);">16:15</a>) in the hills of Dan. Hezekiah smote the Philistines as far as Gaza (<a onClick="return mV(\'2Ki\',18,8);">2Ki 18:8</a>) before 702 BC, in which year (according to the Taylor cylinder) Sennacherib made Hezekiah deliver up Padii, king of Ekron, who had been carried prisoner to Jerusalem. The accounts in Chronicles refer to David\'s taking Gath (<a onClick="return mV(\'1Ch\',18,1);">1Ch 18:1</a>), which was recovered later, and again taken by Uzziah (<a onClick="return mV(\'2Ch\',26,6);">2Ch 26:6</a>). The Philistines sent gifts to Jehoshaphat (<a onClick="return mV(\'2Ch\',17,11);">2Ch 17:11</a>), but invaded the Shephelah (<a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a>) in the time of Ahaz.<P>7. Later Notices:<P>In this age the "lords" of the 5 cities of Philistia are called "kings," both in the Bible and on Assyrian monuments. Isaiah (<a onClick="return mV(\'Isa\',2,6);">2:6</a>) speaks of Philistine superstitions, Ezekiel (<a onClick="return mV(\'Eze\',25,15,16);">25:15,16</a>) connects them with the Cherethim on the seacoast. They still held Gath in the time of Amos (<a onClick="return mV(\'Amo\',6,2);">6:2</a>), and Gaza, Ashdod and Ekron in that of Zephaniah (<a onClick="return mV(\'Zep\',2,5);">2:5</a>), who again mentions the Cherethim with Philistines, as inhabitants of Canaan or the "lowlands." The last notice (<a onClick="return mV(\'Zec\',9,6);">Zec 9:6</a>) still speaks of kings in Ashkelon, Gaza, Ekron and Ashdod at a time when the Ionians had become known in Judah (<a onClick="return mV(\'Zec\',9,13);">Zec 9:13</a>); but the Philistines are unnoticed by Ezra or Nehemiah, unless we suppose that the "speech of Ashdod" (<a onClick="return mV(\'Neh\',13,24);">Ne 13:24</a>) was their old dialect, which appears—like the language of the Canaanites in general in earlier times—to have resembled that of the Babylonians and Assyrians, and to have thus differed—though Semitic—from the Hebrews.<P>Their further history is embraced in that of the various cities to which reference can be made under the articles pertaining to them.<P>II. Monumental Notices.<P>1. Palestinian Excavations:<P>These are of great importance, because they confirm the Old Testament statements from a time at least as early as that of Moses, and down to 670 BC. Recent excavations at Gezer show the early presence of two races at this Philistine city, one being Semitic, the other probably Egyptian Scarabs as old as the XIIth Dynasty were found, and in the 15th century BC Gezer was held by Amenophis III. At Lachish also seals of this king and his queen have been found, with a cuneiform letter to Zimridi, who was ruler of the city under the same Pharaoh. At Gaza a temple was built by Amenophis II. The names of places in Philistia noticed yet earlier by Thothmes III are all Semitic, including Joppa, Saphir, Gerar, Gezer, etc. In the Tell el-Amarna Letters we have also (about 1480 BC) letters from chiefs subject to Amenophis III at Joppa, Ashkelon, Gezer, Lachish and Keilah which show us a Semitic population, not only by the language of these letters, but also by the names of the writers. In the case of Ashkelon especially the Semitic rulers are found to have worshipped Dagon; and, though the name "Philistine" does not occur, the race was clearly the same found by the Assyrians in 800 BC in the land of Palastan beside the Great Sea. These names include Yamir-Dagdn ("Dagon sees"), Dagantakala ("Dagon is a protection") and Yadaya (the "grateful") at Ashkelon; Bua ("asked for"), son of the woman Gulata, at Joppa; Yabnilu ("God made"), at Lachish, with Zimridi—a name found also in Sabean Arabic; while, at Gezer, Yapa\'a represents the Biblical Japhia (<a onClick="return mV(\'Jos\',10,3);">Jos 10:3</a>), and Milkilu ("Moloch is king") the Hebrew Malchiel. Others might be added of the same character, but these examples are enough to show that, in the time of Moses and Joshua, the population of Philistia was the same that is noticed in the Old Testament as early as Abraham\'s age.<P>2. Egyptian Monuments:<P>When therefore scholars speak of the Philistines as being non-Semitic—and probably Aryan—invaders of the country, arriving about 1200 BC, they appear not only to contradict the Bible, but also to contradict the monumental evidence of the earlier existence of Semitic Dagon- worshippers at Ashkelon. In this later age Rameses III was attacked, in Egypt, by certain northern tribes who came by sea, and also by land, wasting first the country of the Hittites and Amorites. Among them were the Danau, who were probably Greek Danai. They were exterminated in the Delta, and in the subsequent advance of Rameses III to the Euphrates. On a colored picture they are represented as fair people; and two of the tribes were called Purstau and Takarri, whom Chabas supposed to be Pelasgi (since "l" and "r" are not distinguished in Egyptian) and Teucrians. These two tribes wear the same peculiar headdress. Brugsch supposed the former to be Philistines (Geog., I, 10), but afterward called them Purosata (Hist Egypt, II, 148). The inscriptions accompanying the picture on the temple walls say that they came from the north, and "their home was in the land of the Purstau, the Takarri," etc. There is thus no reason at all to suppose that they were Philistines, nor did they ever settle in Philistia.<P>3. Assyrian Texts:<P>The Assyrian texts agree with those already mentioned in making the inhabitants of Philistia Semitic. Rimmon-nirari, about 800 BC, was the first Assyrian conqueror in Palastau ("by the great sea"). In 734 and 727 BC, Tiglath-pileser attacked the Pilisti, and mentions a king of Ashkelon named Mitinti ("my gift"), and his son Rukufti whose name resembles that of the Kenite called Rechab in the Old Testament. The name of the king of Gaza was Chanun, or "merciful." In 711 BC Sargon took Ashdod, and speaks of its king Azuri, whose name recalls the Amorite Aziru, and of Achimiti ("a brother is sent"), and the usurper Yamanu ("stedfast"), who fled before him. Sennacherib, in 702 BC, gives the names of cities in Philistia (including Eltekeh and Beneberak near Joppa) which are Semitic. He notices Sidqa (Zadok) of Ashkelon, and also Sarludari ("the Lord be praised"), son of Rukubti in the same city, with Mitinti of Ashdod, and Padii ("redeeming") of Ekron, while Cil-b\'el ("Baal is a protection") was king of Gaza. In 679 BC Esarhaddon speaks of Silli-b\'el ("Baal is my protection") of Gaza, with Mitinti of Ashkelon, Ika-samsu ("the sun-god is manifest") of Ekron, and Abi-milki of Ashdod, who bore the ancient Philistine name Abimelech. In 670 BC, when Assur-bani-pal set up many tributary kings in Egypt, we find again the name Sarludari applied to a ruler of Pelusium, who may have been a Philistine. It is thus abundantly clear that the monumental notices all agree with the Old Testament as to the names and nationality of the Philistines, and as to their worship of Baal and Dagon; the conjecture that they were Aryan foreigners, arriving in 1200 BC, is not based on any statement of the monuments, but merely rests on a guess which Brugsch subsequently abandoned. It resembles many other supposed discrepancies between Biblical and contemporary records due to the mistakes of modern commentators.<P>III. The Cretan Theory.<P>1. Cherethim and Kretes:<P>This strange theory, which is apparently of Byzantine origin, would make the Philistines come from Crete. It still finds supporters, though it does not rest on any Biblical or monumental evidence. The Cherethim (<a onClick="return mV(\'Eze\',25,16);">Eze 25:16</a>; <a onClick="return mV(\'Zep\',2,5);">Ze 2:5</a>) were a Semitic people named with the Philistines in Canaan. The Septuagint renders the word with Kretes or Kretoi; and, about 1770 AD, Michaelis (Spicil., I, 292-308) argued that this meant "Cretans," and that the Philistines therefore came from Caphtor, which must be Crete. The passages, however, refer to Philistia and not to any island, and the Septuagint translators, as we have seen, placed Caphtor in Cappadocia. The Cherethi—in the singular—is mentioned (<a onClick="return mV(\'1Sa\',30,14);">1Sa 30:14</a>) as a people of Philistia (<a onClick="return mV(\'1Sa\',30,16);">1Sa 30:16</a>), near Ziklag, and their name probably survives at the present town called Keratiyeh in the Philistine plain.<P>Yet, many theories are founded on this old idea about the Cherethites. Some suppose that Tacitus confused the Jews with the Philistines as having come from Crete; but what he actually says (History v.11) is that "the Jews ran away from Crete," and "the inhabitants are named Idaci (from Mount Ida), which, with a barbarous augment, becomes the name of the Judaei." This absurd derivation shows at least that Tacitus did not mean the Philistines. Stephen of Byzantium said that the god Marna at Gaza was like the Cretan Jove. Probably he had seen the huge statue of a seated Jove found near Gaza, and now at Constantinople, but this is late Greek work, and the name Marna ("our lord") is Semitic. Stephen also thought that Minois—the port of Gaza—was named from the Cretan Minos, but it is an Arabic word Mineh, for "harbor," still applying to the same place.<P>2. Caphtor and Keft:<P>No critical student is likely to prefer these later speculations to our present monumental information, even without reference to the contradiction of the Bible. Yet these blunders have given rise to the supposition that Caphtor is to be identified with a region known to the Egyptians as Keft, with inhabitants called Kefau. The latter are represented in a tomb of the XVIIIth Dynasty near Thebes. They are youths of brown color, with long black hair, and the same type is found in a Cypriote figure. They are connected with islanders of the "green sea," who may have lived in Arvad or in Cyprus; but there is no evidence in any written statement that they were Cretans, though a figure at Knossos in Crete somewhat resembles them. There are many indications that this figure—painted on the wall of the later palace—is not older than about 500 BC, and the Sidonians had colonies in Crete, where also pottery is found just like that marked by a Phoenician inscription in Cyprus. The Kefau youths bring vases as presents, and these—in all their details—are exactly the same as those represented in another picture of the time of Thothrues III, the bearers in this case being Harri from Northern Syria, represented with black beards and Semitic features. Moreover, on the bilingual inscription called the Decree of Canopus (238 BC), the Keft region is said to be "Phoenicia," and the Greek translator naturally knew what was meant by his Egyptian colleague. Keft in fact is a Semitic word for "palm," occurring in Hebrew (<a onClick="return mV(\'Isa\',9,14);">Isa 9:14</a>; <a onClick="return mV(\'Isa\',19,15);">19:15</a>), and thus applicable to the "palm"-land, Phoenicia. Thus, even if Keft were related to Caphtor, the evidence would place the Philistine home on the Phoenician shores, and not in Crete. There is indeed no evidence that any European race settled near the coasts of Palestine before about 680 BC, when Esarhaddon speaks of Greek kings in Cyprus. The Cretan theory of Michaelis was a literary conjecture, which has been disproved by the results of exploration in Asia.<P>IV. David\'s Guards.<P>1. The "Cherethi" and the "Pelethi" Not Mercenaries:<P>Another strange theory, equally old, represents David as being surrounded with foreign mercenaries—Philistines and Carians—as Rameses II employed mercenaries called Shairtanau from Asia Minor. The suggestion that the Cherethites were of this race is scarcely worth notice, since the Hebrew letter kaph (k) is never represented by "sh" in Egyptian David\'s band of Hebrew exiles, 400 in number, followed him to Gath where 200 Gittites joined him (<a onClick="return mV(\'2Sa\',15,18);">2Sa 15:18</a>). In later times his army consisted of "the Cherethi" (kerethi, in the singular) and "the Pelethi" (pelethi), commanded by the Hebrew leader Benaiah, son of Jehoiada (<a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a>; <a onClick="return mV(\'2Sa\',15,18);">15:18</a>; <a onClick="return mV(\'2Sa\',20,7);">20:7</a>; <a onClick="return mV(\'1Ki\',1,38,44);">1Ki 1:38,44</a>), together with the Gittites under Ittai of Gath. These guards are never said to have been Philistines, but "the Cherethi" is supposed to mean one of the Cherethim tribe, and "the Pelethi" to be another name for the Philistine. As regards the Gittites, the fact that they came from Gath does not prove that they were Philistines, any more than was David himself because he came back from this city. David calls Ittai an "enemy" and an "exile," but it is probable that he was the same hero, so named (<a onClick="return mV(\'2Sa\',23,29);">2Sa 23:29</a>), who was the son of Ribai from Gibeah of Benjamin. He had himself not long joined David, being no doubt in exile at Gath, and his tribe at first opposed David, taking the side of their tribesman Saul. Even when Ittai\'s men joined the Cherethi and Pelethi against Absalom, they were naturally suspected; for David still had enemies (<a onClick="return mV(\'2Sa\',15,\'5-13\');">2Sa 15:5-13</a>) among Benjamites of Saul\'s house. It is also surely impossible to suppose that David would have left the ark in charge of a Phili; and Obed-edom the Gittite (<a onClick="return mV(\'2Sa\',6,10);">2Sa 6:10</a>) was a Levite, according to a later account (<a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18</a>), bearing a Hebrew name, meaning perhaps "servant of men," or "humble worshipper." It seems equally unlikely that, in later times, a pious priest like Jehoiada (<a onClick="return mV(\'2Ki\',11,4);">2Ki 11:4</a>) would have admitted foreign mercenaries into the temple. In this passage they are called kari, as also in <a onClick="return mV(\'2Sa\',20,23);">2Sa 20:23</a>, where the Septuagint has Cherethi. The suggestion of Wellhausen that they were Carians does not seem probable, as Carians had not even reached Egypt before about 600 BC.<P>2. Meaning of These Terms:<P>The real explanation of these various words for soldiers seems simple; and David—being a very popular king—is not likely to have needed foreign mercenaries; while the Philistines, whom he had so repeatedly smitten, were very unlikely to have formed trusty guards. The word "Cherethi" (kerethi) means a "smiter" or a "destroyer," and "Pelethi" (pelethi) means "a swift one" or "pursuer." In the time of Joash the temple-guards are called kari (<a onClick="return mV(\'2Ki\',11,4,19);">2Ki 11:4,19</a>, Carites), which the Septuagint treats as either singular or plural, and ratsim or "runners" (see <a onClick="return mV(\'1Sa\',22,17);">1Sa 22:17</a>; <a onClick="return mV(\'1Ki\',14,27,28);">1Ki 14:27,28</a>; <a onClick="return mV(\'2Ki\',10,25);">2Ki 10:25</a>), these two bodies perhaps answering to the Cherethi and Pelethi of David\'s time; for kari means "stabber." The term ratsim, or "runners," is however of general application, since Jehu also had troops so called (<a onClick="return mV(\'2Ki\',10,25);">2Ki 10:25</a>). Evidently we have here two classes of troops—as among the Romans—the heavier regiment of "destroyers," or "stabbers," being armed with swords, daggers or spears; while the "swift ones" or "runners" pursued the defeated foe. Thus, in Egypt we find, yet earlier, the ax-man supported by the bow-man in regular regiments; and in Assyria the spear-man with heavy shields defending the bow-man. We have also a picture of the time of Tiglath-pileser II representing an Assyrian soldier on a camel. The Pelethi or "pursuers" may have been "runners" on foot, but perhaps more probably mounted on camels, or on horses like the later Assyrians; for in the time of Solomon (<a onClick="return mV(\'1Ki\',4,28);">1Ki 4:28</a>) horses and riding camels were in use—the former for chariots. It is clear that David\'s band, leaving the vicinity of Jezreel (<a onClick="return mV(\'1Sa\',29,1);">1Sa 29:1</a>; <a onClick="return mV(\'1Sa\',30,1);">30:1</a>), could not have reached Ziklag "on the third day" (a distance of 120 miles) on foot; so that the camel corps must have existed even before the death of Saul.<P>3. Native Hebrews:<P>These considerations seem to make it evident that David\'s guards were native Hebrews, who had been with him as exiles and outlaws at Adullam and Gath, and that the Cherethi or "destroyer" only accidentally had a title like that of the Philistine tribe of "destroyers" or Cherethim, who were not Cretans, it would seem, any more than the "stabbers" were Carians.<P>4. Review:<P>The general result of our inquiry is, that all monumental notices of the Philistines agree with the Old Testament statements, which make them to be a Semitic people who had already migrated to Philistia by the time of Abraham, while the supposed discrepancies are caused by the mistakes made by a commentator of the 18th century, and by archaeologists of later times.<P>LITERATURE<P>Paton, Early History of Syria and Palestine; Smith, HGHL; Budge, History of Egypt; Breasted, History of Egypt; Rawlinson, Ancient Monarchies; Herodotus with most histories of Egypt, Babylon, and Assyria for the period from the 13th century BC to the time of Alexander.``28';

isbe[6907]='Philistines, Sea of the`(<a onClick="return mV(\'Exd\',23,31);">Ex 23:31</a>).`<a href="./study/isbe/search.html?string=MEDITERRANEAN+SEA">MEDITERRANEAN SEA</a>`1';
isbe[6908]='Philo, Judaeus`fi-\'lo, joo-de\'-us:<P>1. His Life<P>2. Importance of the Period<P>3. The Task of Philo<P>4. Changes and New Problems<P>5. Three Subjects of Inquiry<P class="in15">(1) The Conception of God<P class="in15">(2) God\'s Relation to the World<P class="in15">(3) Doctrine of Man<P>6. Philo\'s Works<P>LITERATURE<hr /><P>1. His Life:<P>Born probably in the first decade of Augustus Caesar, who became emperor in 27 BC. He died possibly in the last years of Claudius (41-54 AD), more likely in the early years of Nero (54-65 AD). We have no exact information about either date. He was a native of Alexandria, Egypt. His relatives were wealthy and prominent, probably sacerdotal, Jews. He received the best Jewish education, and was trained also in Gentile learning—grammar, rhetoric, philosophy, geometry, poetry, music. Enjoying ample means, he was enabled to devote his career to scholarship. The Alexandrian Jews wielded great influence in the contemporary Roman empire, and the prominence of Philo\'s family is attested by the fact that his brother, Alexander Lysimachus, was Alabarch of Alexandria. The single date in Philo\'s life which we know accurately is connected with their leadership. In the winter of 39-40 AD, he was spokesman of the deputation sent to Rome to protest against imposition of emperor-worship upon fellow-citizens of his faith. The mission failed, Philo, with his two colleagues, meeting rebuff, even insult. It was little likely that Caligula would heed grievances which included specifically dissent from worship of himself. Philo records his distaste for political activity, and, so far as we know, the Roman incident excepted, he devoted himself principally to letters. As a young man probably, he had undertaken a journey to Jerusalem, almost in the nature of a pilgrimage to the ancient shrine of his religion. He paid a second visit to Rome possibly after 50 AD, at all events, in the reign of Claudius. For the rest, our knowledge of his life is scanty and, sometimes, legendary.<P>2. Importance of the Period:<P>The period covered by his career coincides with one of the most momentous epochs in history. For it witnesses, not only the foundation of the Roman imperial system, but also the beginning of the end of ancient classical civilization in its dominant ideas, and the plantation of Christianity. Preeminently an era of transition, it was marked by significant displacements in culture, the effects of which continue to sway mankind even yet. Minor phenomena aside, three principal movements characterized the time: the Pagan reaction, or reversion to forms of religion that had sufficed the peoples of the Roman empire hitherto—this manifested itself strongly with Augustus, and entered its decline perhaps with the death of Plutarch (circa 120 AD); the appearance of Christianity; and what is known as Syncretism, or interfusion between the conceptions of different races, especially in religion, philosophy and morals—a circumstance which affected the fortunes of Christianity deeply, found its chief exponent in Philo, and maintained itself for several centuries in theosophical systems of the Gnostics and neo-Platonists. Thus, to understand Philo, and to realize his importance, it is essential to remember the internal spirit of his age. The "universalism" of the Roman empire has been so named because, within the political framework, various peoples and divergent civilizations commingled and came eventually to share something of a common spirit, even of a common language. Philo\'s prominence as a figure in the world of thought, and as an authority for the general culture of New Testament times, is out of all proportion to the fragmentary information available about his external career. Contemporary currents, subtle as they were, perplexing as they still remain, met and fused in his person. Hence, his value as an index to the temperament of the period cannot well be overrated.<P>3. The Task of Philo:<P>A Jew by nature and nurture, an oriental mystic by accident of residence, a Greek humanist by higher education and professional study, an ally of the Roman governing classes, familiar with their intellectual perspective, Philo is at once rich in suggestion and blurred in outline. Moreover, he addressed himself to two tasks, difficult to weld into a flawless unity. On the one hand, he wrote for educated men in Greek-Roman society, attempting to explain, often to justify, his racial religion before them. The ancient state religion having fallen upon inanition, he enjoyed unusual opportunity to point the merits of the Jewish faith as the "desire of all nations," the panacea of which the need was everywhere felt. On the other hand, he had to confront his orthodox coreligionists, with their separatist traditions and their contempt for paganism in all its works. He tried to persuade them that, after all, Greek thought was not inimical to their cherished doctrines, but, on the contrary, involved similar, almost identical, principles. He thus represented an eclectic standpoint, one in which Greek philosophy blended with historical and dogmatic deductions from the Jewish Scriptures. The result was Philo\'s peculiar type of theosophy—we cannot call it a system. Taking the Old Testament for text, he applied the "allegorical" method, with curious consequences. He taught that the Scriptures contain two meanings: a "lower" meaning, obvious in the literal statements of the text; and a "higher," or hidden meaning, perceptible to the "initiate" alone. In this way he found it possible to reconcile Greek intellectualism with Jewish belief. Greek thought exhibits the "hidden" meaning; it turns out to be the elucidation of the "allegory" which runs through the Old Testament like a vein of gold. Moses, and the rest, are not merely historical figures, the subjects of such and such vicissitudes, but representative types of reason, righteousness, the virtues, and so forth. The tendency to fusion of this kind was no new thing. It is traceable for some three centuries before Philo, who may be said to complete the process. It had been familiar to the rabbis, and to the Hellenistic philosophers, particularly the Stoics, who applied this method to the Greek poetical myths. Philo reduces it to an expert art, and uses it as an instrument to dissipate all difficulties. He believed himself to be thoroughly true to the Old Testament. But, thanks to his method, he rendered it malleable, and could thus adjust its interpretation to what he considered to be the intellectual necessities of his generation. Nay more, he felt that, when at his best in this process, he became a vehicle of Divine possession. He says, "Through the influence of divine inspiration I have become excited profoundly...then I have been conscious of a richness of interpretation, an enjoyment of light, a most penetrating sight, a most manifest energy in all that was to be done." Again "I am irradiated with the light of wisdom," and, "all intellect is a divine inspiration." Little wonder, then, that we have a strange mixture of philosophy and religion, of rationalism and piety, of clear Greek intellectualism with hazy oriental mysticism. Hence, too, the philosophy of Philo is subordinate to his explanation of the Scriptures, and compromise, rather than logical thinking, marks his leading positions.<P>4. Changes and New Problems:<P>After the death of Cicero (43 BC) a change, long preparing, asserted itself in ancient thought. Mixture of national, or racial, characteristics was consummated, and thoughtful men, irrespective of race-origin, became persons to each other. A reorganization of standards of ethical judgment was thus rendered inevitable, and Judaism came to interfuse more freely with Greek philosophy as one consequence. While it is true that "reason" preserved its traditional supremacy as the means to solve all problems, the nature of the chief quest underwent transformation. The old association of man with Nature gave way to a dualism or opposition between the world-order and another existence lying behind it as its originator or sustainer. The system of Nature having disappointed expectation, thinkers asked how they could escape it, and assure themselves of definite relations with the Divine Being. They sought the desiderated connection within their own souls, but as a distant ideal. This was the problem that confronted Philo, who attacked it from the Jewish side. Now Judaism, like Greek thought, had also experienced a change of heart. Yahweh had been the subject of an idealizing process, and tended, like the Stoic deity, to lose specific relation with the world and man. Accordingly, a new religious question was bringing the philosophy and the faith into closer contact. Could they join forces? Philo\'s consequent embarrassment rooted, not simply in this fresh problem, but in the difficulties inseparable from the adjustment of his available methods and materials. For, while the Jewish Messiah had passed over into the Greek Logos, the two systems preserved their separation in no small measure, Philo being the most conspicuous mediator. He was familiar with the mystic, transcendent concept of Deity extracted, thanks to long misinterpretation, from Plato\'s cosmogonic dialogue, Timaeus. Here God was elevated above the world. His conception of the presence, or immanence, of the Deity in the world came from the Stoics. The Jewish religion gave him the doctrine of a righteous (pure) Deity, whose moral inwardness made relations with men possible. Moreover, contemporary angelology and demonology enabled him to devise a scheme whereby the pure Deity could be linked with the gross world, notwithstanding its ineradicable evil. Little wonder, then, that he compassed an amalgamation only, and this in consonance with theosophical drift of the age. Nevertheless, he counteracted the deistic tendencies of rabbinical speculation by reference to Hellenistic pantheism, and, at the same time, counteracted this pantheism by the inward moralism of his national faith. The logical symmetry of the Greek mind was reinforced by Hebraic religious intuition. The consequence was a ferment rather than a system, but a ferment that cast up the clamant problem in unmistakable fashion. The crux was this: Man must surmount his own fragmentary experience and rise to an absolute Being; but, its absoluteness notwithstanding, this Being must be brought into direct contact with the finite. Philo was unable to reconcile the two demands, because he could not rise above them; but the effort after reconciliation controls all his thought. As a result, he concentrated upon three main subjects of inquiry:<P>(1) the conception of God;<P>(2) the manner of God\'s relation to the world;<P>(3) human nature.<P>5. Three Subjects of Inquiry:<P>(1) The Conception of God:<P>Philo\'s doctrine of God, like that of the neo-Platonic school, which he heralded, is thoroughly dualistic. No doubt, it is determined largely by certain human analogies. For example, God\'s existence is necessary for the control of the world, just in the same way as man\'s mind must exist to furnish the principle of all human action; and, as matter is not self-determined, a principle, analogous to mind, is demanded, to be its first cause. Further, as the permanent soul remains unchanged throughout the vicissitudes of a human life, so, behind the ceaseless play of phenomena, there must reside a self-existent Being. Nevertheless, the human analogy never extends to God in His actual Being. No human traits can attach to the Deity. Language may indicate such parallelism, nay the Scriptures are full of instances, but we must view them as concessions to mortal weakness. These accommodations eliminated, it becomes evident that man can never know God positively. Any adjective used to describe Him can do no more than point the contrast between His relationless Being and the dependence of finite things. That God is, Philo is fully persuaded; what He is, no man can ever tell. He is one and immutable, simple and immeasurable and eternal, just as man is not. "For he is unchangeable, requiring nothing else at all, so that all things belong to Him, but He, speaking strictly, belongs to nothing." This doctrine of the transcendence of Deity was an essential postulate of Philonic thought. For, seeing that He expels all the imperfections of the world, God is precisely in that condition of Being for which the whole creation then yearned. In a word, the dualism, so far from being a bar to salvation, was rather a condition without which the problem of salvation could neither be stated nor solved. Men stood in necessary relation to this Being, but, as yet, He stood in no relation whatever to them. Yet, men must return to God, but He abides so remote, in the realm of pure contemplation and completion, that He cannot approach them. Philo\'s familiarity with logical Greek thought debarred him from surmounting the difficulty after the manner of Jewish religion. An otiose reference to "God\'s choice," as distinct from His nature, could not suffice a mind trained in Hellenic methods. The question therefore was, How could mediation be effected?<P>(2) God\'s Relation to the World.<P>At this point Philo\'s thought assumes a phase of great interest to readers of the New Testament. God, being above created things, is incomprehensible and immaterial. Accordingly, He cannot be connected with the world directly. Therefore He created it and sustains it by intermediate powers. These agencies were suggested to Philo by the Platonic Ideas. But he personalized them more or less and, as a characteristic addition, included them in the Logos. He substituted the term "Logos" for the Platonic term "Idea" on the basis of the Scripture phrase, "Word of God." The conception was influenced further by his Hellenistic psychological notion, that a word is a "shadow" of a deed. Accordingly, the Logos is the "shadow of God"—God being the "deed" whereby the "shadow" is cast. As a direct issue, the Logos presents two aspects. On the one side it is internal and indwelling; on the other, it is external and mediating. The scope of this distinction is indicated very well by the epithets which Philo applies to each aspect respectively. The internal Logos is the "Firstborn," the "Second God," the "Mediator" the "Ransom," the "Image of God" "Member of the Trinity," "High Priest." The external Logos "abides in man," is the "Prophet," "Shepherd," "Ambassador," "Artist," "EIder," "Interpreter," "Shadow of God." The former represents Philo\'s conception of the unity of the Logos with God, the latter his provision for the manifestation of the Logos in created things. He thus tries to preserve the transcendence of God equally with His immanence. No doubt, in previous times, the mysteriousness of the Divine nature had impressed itself upon men with at least as much force as now. But with one of two consequences. Either the particular finites and the Deity were mixed in inextricable confusion, as by oriental pantheism, or God was banished from the world, as by the extreme developments within Greek dualism. Philo attempted to combine the two tendencies, and was able consequently to face the obvious contradiction between the idea of an absolute Being and the cloudy conception of a multiplicity of phenomena in which this Being ought to be present somehow, despite transcendence. He demands a God who, in His exaltation, shall be a worthy Deity; this is the Jew in him. But he also demands a definite relation between this God and His creation; this is the Greek and, in part, the Oriental, in him. Thanks to the former, he could not be satisfied with mere naturalism; thanks to the latter, no fable or picture could suffice. A real mediator was required, who would link the world and its heart\'s desire. But Philo could not surmount one difficulty peculiar to contemporary thought. He was unable to connect God directly with creation and preserve His purity unsullied. Hence, the obscurity which surrounds his conception of the Logos, likewise his vacillation with respect to its personality. So we find the different intellectual forces which he inherited playing upon him—now one, now another. Sometimes the Platonic theory of Ideas dominates him; sometimes he leans to Stoicism, with its immanent world-reason; and here he even seems to foreshadow the doctrine of the Trinity; again, the ramifications of rabbinical lore cause him to bestow upon the Logos a priestly function or an atoning office. No single aspect achieves supremacy, although on the whole mystical Platonism may be said to predominate. Thus, "The world of Ideas has its place in the Divine Logos, just as the plan of a city is in, the soul of the master-builder." Accordingly, God\'s thought may take its place in the world by being impressed upon things; yet, on account of its subjective nature, it must be apprehended subjectively, that is, by one who is capable of entering this sphere. The Logos thus seems to exist entirely in the same realm as Deity; thus, it can mediate between Him and creation only if an element proper to Deity be discernible in mundane things. In other words, the Logos mediates between God and the world, but partakes of the Divine nature only. This, in any case, is the inner logic of Philo\'s view. It accounts for creation, but has no power to persuade man to overpass the limitations placed upon him by his bodily prison. Thus the question of the personality of the Logos is never cleared. In so far as Philo needs Logos to connect God with the world, he inclines to a doctrine of personality. In so far as he makes it the principle of all activities within the world, he inclines away from personality. In short, we have a "world-soul." And, as a consequence, there is an inherent tendency to reduce all finite being to illusion. Indeed, one might term the Logos a reply in some sort to Aristotle\'s question—which of the Platonic Ideas could connect the other Ideas with sensible things? Salvation is conceived as wrought out, not by a person, but by an abstract essence flowing from Deity, an essence that found due expression rather in the cosmic order than in a person. While, therefore, Philo thinks in a cultural perspective akin to that characteristic of the author of the Fourth Gospel, two vast differences sway his doctrine. On the one hand, it is speculative, not ethically personal. On the other hand, it fails completely to determine the nature of his mediator in itself, vacillating in a manner which shows how vague and fluid the conception really was.<P>(3) Doctrine of Man.<P>This appears further in the doctrine of man. Following current interpretations of Plato, Philo makes man partake in the rational nature of God, but denies that he embodies the highest species of reason. That is, the ideal man and the man known to us in common experience are distinguished. The former is rational as God is. The latter is partly rational, partly irrational. The body vitiates the original angelic purity of the soul and, similarly, reason is alloyed. And yet, although the higher nature becomes more and more debased as the years lapse, a seed of Divinity is present, ready to burst forth. Thus man must crush the flesh and its desires. At this point we note the effect of the Stoic ideal of imperturbability. When he has attained this apathy, man can enjoy the life of contemplation. This, in its turn, culminates in ecstasy, when the human soul attains sudden and momentary union with the Divine. For a "fair moment" man escapes the thralldom of sense. Yet the doctrine remains intellectual even here. He "who escapes from his own mind flies to the mind of the universe, confessing that all the things of the human mind are vain and unreal, and attributing everything to God." Philo\'s anthropology therefore ends in contempt for this life, which is in no wise worth while, and in a counsel of perfection available only for a select elite. Accordingly, the conclusion of the whole matter is, that he never saw how the divine and the human can be united, although he stated the factors of the problem with great clearness, and felt profoundly the urgency of a solution. His gospel was for the children of culture. He saw the eternal in the temporal, and hoped that good might lurk in evil. But he never understood that "love for a Divine Person" might be so diffused throughout a human soul as to render evil and unreality the means to the attainment of good and to the revelation of truth. The salvation he contemplated was from self, not in self. Hence, as he asserts himself, harmony with God "is an incomprehensible mystery to the multitude, and is to be imparted to the instructed only." Nor is this wonderful. For a God who is the reasonable "form" of the world; a "matter" which begins as an indistinguishable mass and ends as a "second principle"; and objects of sense rendered apparent by the operation of many curious intermediate forces, ranging from "angel-words" to the human soul, constitute a combination beyond the reach of any save the "initiate." More practicable is Philo\'s conception of the moral life—as a warfare of the soul against passion, pleasure and sensuality. Yet, even this contest is hopeless unless it be waged with the equipment of the "philosopher athlete." Escape from the "prison-house" of flesh would seem to be consequent only upon profound knowledge.<P>6. Philo\'s Works:<P>The probability is that Philo\'s works were written previous to his Roman embassy. They show how he tried to apply Greek philosophical conceptions to Jewish beliefs, history, and usages exclusively. The voluminous remains which have come down to us appear to belong to three commentaries on the Pentateuch and the Mosaic Law. In all likelihood, they are portions of Philo\'s popular presentation, written for the instruction and information of educated Hellenistic circles rather than for the trained "initiate." The treatises most important for Philo\'s religio-philosophical views are as follows: On the Creation of the World; On the Allegories of the Sacred Laws; On the Unchangeableness of God; On the Confusion of Languages; On the Migration of Abraham; On the Meeting for the Sake of Receiving Instruction; On the Life of the Wise Man Made Perfect by Instruction; The Unwritten Law; Abraham; On Special Laws; On Rewards and Punishments; That Every Man Who Is Virtuous Is Also Free; Concerning the World; and the Fragments. Some 8 works attributed to Philo are in dispute. Most conspicuous of these is Concerning the Contemplative Life, with its ascetic view of morality, and its description of the ideal community of the Therapeutae.<P>LITERATURE.<P>E. Schurer, A History of the Jewish People in the Time of Jesus Christ, Division II, Volume III, pp. 321f (Edinburgh, 1886); E. Schurer, "Philo" in EB; James Drummond, Philo Judaeus, or, The Jewish-Alexandrian Philosophy in Its Development and Completion (2 volumes, London, 1888); R. M. Wenley, Socrates and Christ: a Study in the Philosophy of Religion, chapters vii, viii (Edinburgh, 1889); H. Ewald, The History of Israel, VII, 194f (London, 1885); A. Haursrath, A History of New Testament Times, division II, volume I, chapters iv through vi (London, 1885); H. Graetz, History of the Jews from the Earliest Times to the Present Day, II, 183f; 206f (London, 1891); E. Caird, The Evolution of Theology in the Greek Philosophers, II, lectures xx-xxi, xxvii (Glasgow, 1904); article "Philo" in Jewish Encyclopedia; Ernest F. Scott, The Fourth Gospel, Its Purpose and Theology, 54f; 145f (2nd edition, Edinburgh, 1908); F.C. Conybeare, Philo: About the Contemplative Life (Oxford, 1895). An English translation has been made by C.D. Yonge in the Bohn Library (London, G. Bell and Sons). The text cited usually is that of T. Mangey. The best modern text is that of Cohn and Wendland.``190';
isbe[6909]='Philologus`fi-lol\'-o-gus (Philologos, "fond of learning," "learned"): The name of a Roman Christian to whom Paul sent greetings (<a onClick="return mV(\'Rom\',16,15);">Ro 16:15</a>). His name is coupled with that of Julia, who was probably his wife or sister. Philologus and those united with him in this salutation formed by themselves one of the "house churches" or groups in the Christian community. The name is found in inscriptions connected with the imperial household, with reference to one of which Bishop Lightfoot has the following note: "It has been supposed that the name Philologus was given by the master to the freedman mentioned in this inscription, as being appropriate to his office (Friedlander I, 89, 160)....If so, some light is thrown on the probable occupation of the Philologus of Paul" (Phil, 177, note 1).``78';
