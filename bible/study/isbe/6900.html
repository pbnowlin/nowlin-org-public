isbe[6911]='Philosophy`fi-los\'-o-fi (philosophia):<P>1. Definition and Scope<P class="in15">(1) Intuitive Philosophy Is Universal<P class="in15">(2) Speculative Philosophy Belongs Mainly to Western Thought<P>2. Greek Philosophy<P>3. Philosophy in Old Testament and Judaism<P>(1) Of Nature<P>(2) Of History<P class="in15">(3) Post-exilic<P class="in15">(4) Alexandrian<P>4. Philosophy in the New Testament<P class="in15">(1) The Teaching of Jesus Christ<P class="in15">(2) Apostolic Teaching<P class="in15">(3) Attitude of New Testament Writers toward Philosophy<P>LITERATURE<hr /><P>1. Definition and Scope: Only found in <a onClick="return mV(\'Col\',2,8);">Col 2:8</a>; literally, the love and pursuit of wisdom and knowledge. In its technical sense, the term is now used for the conscious endeavor of thought, by speculative process, to interpret the whole of human experience, as a consistent and systematic unity, which would be the ultimate truth of all that may be known. The term is also used, in a wider sense, of all interpretations of experience, or parts of experience, however obtained, whether by revelation, intuition or unconscious speculation. No hard-and-fast line can be drawn between the two kinds of philosophy. Some of the ruling conceptions of speculation, such as God, spirit, order, causation, true and false, good and evil, were not discovered by reason, but given in experience.<P>(1) Intuitive Philosophy Is Universal.<P>The human mind has always and everywhere furnished itself with some kind of explanation of the universe. From the lowest animism and fetishism up to the higher religions, ideas are found which served men as explanations of those features of experience which attracted their attention. They were often regarded as given by vision, intuition or some other method of revelation. In the higher religions, the mind reflected upon these ideas, and elaborated them into systems of thought that bear some resemblance to the speculative theories of western thought. In China, both Confucianism and Taoism developed theories of human life and destiny that bear some resemblance to Stoicism. The religions of Assyria and Babylonia enshrined in their legends theories of the world and of man and his institutions. In India, men\'s belief in the Nature-gods gradually developed into pantheistic Brahmanism, which reduced the multiplicity of experience into one ultimate being, Brahma. But the desire for moral salvation and the sense of pain and evil produced a reaction, and led to the pessimistic and nihilistic philosophy of Buddhism. In Persia, the moral consciousness awoke earlier, and the attempt to systematize the multiplicity of polytheism issued in the dualistic philosophy of later Zoroastrianism. The whole realm of being was divided into two kingdoms, created and ruled by two lords: Ahura Mazda, the creator of light and life, law, order and goodness, and Anro Mainyus, the author of darkness, evil and death. Each was surrounded by a court of spiritual beings kindred to himself, his messengers and agents in the world (see <a href="./study/isbe/search.html?string=PERSIAN+RELIGION+(ANCIENT)">PERSIAN RELIGION (ANCIENT)</a>). Of all these religious philosophies, only those of Assyria and Babylonia, and of Persia, are likely to have come into any contact with Biblical thought. The former have some affinity with the accounts of creation and the flood in Genesis; and the influence of the latter may be traced in the dualism and angelology and demonology of later Judaism, and again in the Gnostic systems that grew up in the Christian church, and through both channels it was perpetuated, as a dualistic influence, in the lower strata of Christian thought down through the Middle Ages.<P>(2) Speculative Philosophy Belongs Mainly to Western Thought.<P>It arose in Greece about the beginning of the 6th century BC. It began with the problem of the general nature of being, or ontology. But it was soon forced to consider the conditions of knowing anything at all, or to epistemology. These two studies constitute metaphysics, a term often used as synonymous with philosophy in the stricter sense. Speculation about ideal truth again led to inquiries as to the ultimate nature of the kindred ideas of the good (ethics) and the beautiful (aesthetics). And as these ideas were related to society as well as to the individual, the Greeks developed theories of the ideal organization of society on the basis of the true, the good and the beautiful, or politics and pedagogics. The only branch of speculation to which the Greeks made no appreciable contribution was the philosophy of religion, which is a modern development.<P>The progress of philosophy in history divides itself naturally into three main periods: (a) ancient, from the 6th century BC to the 3rd century AD, when it is almost exclusively Greek, with some practical adaptations of Greek thought by Roman writers; (b) medieval, from the 3rd to the 16th century, where some of the ruling conceptions of Greek thought were utilized for the systematization of Christian dogma, but speculation was mainly confined within the limits of ecclesiastical orthodoxy; there were, however, some independent Arabian and Jewish speculations; (c) modern, from the 16th century to the present time, in which thought becomes free again to speculate upon all the problems presented by experience, though it only realized its liberty fully in the hands of Locke, Hume and Kant.<P>2. Greek Philosophy:<P>Greek philosophy was the only speculative system that could have had any influence upon Biblical thought. Its main development was contemporaneous with the later Old Testament writers, but the two peoples were in every way so remote one another that no interchange of ideas was probable.<P>During the last two centuries BC, Greek thought spread so widely that it came to dominate the cultured thought of the world into which Christianity entered, and it would have been strange if no trace of its influence were found in the New Testament. In the first stage of its development, from Thales to Socrates, it was concerned almost entirely with attempts to explain the nature of reality by reducing the phenomenal world into some one of its elements. Socrates changed its center of gravity, and definitely raised the problems of morality and knowledge to the position of first importance. His principles were developed by Plato into a complex and many-sided system which, more than any other, has influenced all subsequent thought. He united ultimate reality and the highest good into one supreme principle or idea which he called the Good, and also God. It was the essence, archetype and origin of all wisdom, goodness and beauty. It communicated itself as intermediary archerypal ideas to produce all individual things. So that the formative principles of all existence were moral and spiritual. But it had to make all things out of preexisting matter, which is essentially evil, and which therefore was refractory and hostile to the Good. That is why it did not make a perfect world. Plato\'s system was therefore rent by an irreconcilable dualism of mind and body, spirit and matter, good and evil. And his mediating ideas could not bridge the gulf, because they belonged only to the side of the ideal. Aristotle was Plato\'s disciple, and he started from Plato\'s idealistic presuppositions, but endeavored to transcend his dualism. He thus applied himself to a closer and more accurate study of actual experience, and added much to the knowledge of the physical world. He organized and classified the methods and contents of knowledge and created the science of logic, which in the Christian Middle Ages became the chief instrument of the great systematic theologians of the church. He tried to bring Plato\'s ideas "down from heaven," and to represent them as the creative and formative principles within the world, which he conceived as a system of development, rising by spiritual gradations from the lower to the higher forms, and culminating in God, who is the uncaused cause of all things. But underneath all the forms still remained matter as an antithetical element, and Aristotle rather concealed than solved the dualism of Plato.<P>Meanwhile, the moral principles of Socrates were being developed with a more directly ethical interest, by the Cyrenaics and Epicureans, into a system of Hedonism, and, by the Cynics and Stoics, into a doctrine of intuitive right and duty, resting inconsistently upon a pantheistic and materialistic view of the universe. But the spiritual and ethical elements in Stoicism became only second to Platonism in the preparation of the Greek world for Christianity. During the last two and a half centuries BC, Greek philosophy showed signs of rapid decline. On the one hand, Pyrrho and his school propounded a thoroughgoing skepticism which denied the possibility of all knowledge whatsoever. On the other hand, the older schools, no longer served by creative minds, tended to merge their ideas into a common eclecticism which its teachers reduced into an empty and formal dogmatism. The most fruitful and fateful product of Greek thought in this period was its amalgamation with Jewish and oriental ideas in the great cosmopolitan centers of the Greek world. There are evidences that this process was going on in the cities of Asia, Syria and Egypt, but the only extensive account of it remaining is found in the works of Philo, the Jewish philosopher of Alexandria (see <a href="./study/isbe/search.html?string=PHILO,+JUDAEUS">PHILO, JUDAEUS</a>). He tried to graft Plato\'s idealism upon Hebrew monotheism.<P>He starts with Plato\'s two principles, pure being or God, and preexisting matter. In his endeavor to bridge the gulf between them, he interposed between God and the world the powers of God, goodness and justice; and to gather these into a final unity, he created his conception of the Loges of God. In the formation of this conception, he merged together the Platonic idea of the good, the Stoic world-reason, and a number of Jewish ideas, the glory, the word, the name, of God, the heavenly man and the great high priest, and personified the whole as the one mediator between God and the world. Christian thought laid hold of this idea, and employed it as its master-category for the interpretation of the person of Christ.<P>See <a href="./study/isbe/search.html?string=LOGOS">LOGOS</a>.<P>3. Philosophy in Old Testament and Judaism:<P>There is no speculative philosophy in the Old Testament nor any certain trace of its influence. Its writers and actors never set themselves to pursue knowledge in the abstract and for its own sake. They always wrought for moral purposes. But moral activity proceeds on the intellectual presuppositions and interpretations of the experiences within which it acts. Hence, we find in the Old Testament accounts of the origin and course of nature, a philosophy of history and its institutions, and interpretations of men\'s moral and religious experiences. They all center in God, issue from His sovereign will, and express the realization of His purpose of righteousness in the world.<P>See <a href="./study/isbe/search.html?string=GOD">GOD</a>.<P>(1) Of Nature:<P>All nature originated in God\'s creative act (<a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a>) or word (<a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>). In later literature the whole course and order of Nature, its beauty and bounty, as well as its wonders and terrors, are represented as the acts of God\'s will (<a onClick="return mV(\'Isa\',40,\'1-\');">Isa 40</a>; <a onClick="return mV(\'Isa\',41,\'1-\');">41</a>; <a onClick="return mV(\'Isa\',42,\'1-\');">42</a>; <a onClick="return mV(\'Isa\',43,\'1-\');">43</a>; <a onClick="return mV(\'Isa\',44,\'1-\');">44</a>; <a onClick="return mV(\'Isa\',45,\'1-\');">45</a>; <a onClick="return mV(\'Psa\',8,\'1-\');">Ps 8</A>; <a onClick="return mV(\'Psa\',19,\'1-\');">19; <a onClick="return mV(\'Psa\',29,1);">29</a>; <a onClick="return mV(\'Psa\',50,1);">50</a>; <a onClick="return mV(\'Psa\',65,1);">65</a>; <a onClick="return mV(\'Psa\',68,1);">68</a>; <a onClick="return mV(\'Psa\',104,1);">104</a>, etc.). But His action in Nature is always subordinated to His moral ends.<P>(2) Of History:<P>Similarly, the course and events of the history of Israel and her neighbors are the acts of Yahweh\'s will (<a onClick="return mV(\'Amo\',1,\'1-\');">Am 1</a>; <a onClick="return mV(\'Amo\',2,\'1-\');">2</a>; <a onClick="return mV(\'Isa\',41,2);">Isa 41:2</a>; <a onClick="return mV(\'Isa\',43,3);">43:3</a>; <a onClick="return mV(\'Isa\',45,9,10,14);">45:9,10,14</a>) In the historical Books of Samuel and Kings, and still more of Chronicles, all the events of history are represented as the acts of God\'s moral government. In a more general way, the whole of history is set forth as a series of covenants that God, of His free grace, made with man (see <a href="./study/isbe/search.html?string=COVENANT">COVENANT</a>). The Noachic covenant fixed the order of Nature. The covenant with Abraham, Isaac and Jacob accounted for the origin and choice of Israel. The covenants with Moses and Aaron established the Law and the priesthood, and that with David, the kingship. And the hope of the future lies in the new covenant (<a onClick="return mV(\'Jer\',31,\'31-35\');">Jer 31:31-35</a>). God\'s covenants were all acts of His sovereign and gracious will.<P>(3) Post-exilic:<P>In post-exilic times, new experiences, and perhaps new intellectual influences, drove the Jews to probe deeper into the problem of existence. They adhered to the cardinal principle of He thought, that God\'s sovereign will, working out His purpose of righteousness, was the first cause of all things (see <a href="./study/isbe/search.html?string=RIGHTEOUSNESS">RIGHTEOUSNESS</a>). But they found it difficult to coordinate this belief with their other ideas, in two ways. Ethical monotheism tended to become an abstract deism which removed God altogether out of the world. And the catastrophes that befell the nation, in the exile and after, raised the problem of suffering and evil over against God\'s goodness and righteousness. Therefore in the Wisdom literature we find some conscious speculation on these subjects.<P>See <a href="./study/isbe/search.html?string=WISDOM">WISDOM</a>.<P>(a) The Book of Job discusses the problem of evil, and repudiates the idea that life and history are the process of God\'s rewards and punishments.<P>(b) Ecclesiastes comes to the conclusion that all phenomenal experience is vanity. Yet its ultimate philosophy is not pessimistic, for it finds an abiding reality and hope in the fear of God and in the moral life (<a onClick="return mV(\'Ecc\',12,13,14);">12:13,14</A>). The same type of thought appears in Ecclesiasticus. Both books have been attributed to the circle of the Sadducees. Some would find in them traces of the influence of Epicureanism.<P>(c) In Proverbs a more optimistic side prevails. Wisdom is gathered up into a conception or personification which is at once God\'s friend, His agent in creation, His vicegerent in the world, and man\'s instructress and guide (chapter <a onClick="return mV(\'Pro\',8,\'1-\');">8</a>).<P>(d) The teaching of the Pharisees especially reveals the tendency to dualism or deism in later Judaism; they interposed between God and the world various agents of mediation, the law, the word, the name, the glory of God and a host of angels, good and bad. They also fostered a new hope of the future, under the double form of the Messianic kingdom, and of resurrection and immortality. How far these tendencies were due to the influence of Persian dualism cannot here be considered.<P>(e) Essenism represents another effort to get from the world to God by a crude kind of mysticism and asceticism, combined with an extensive angelology.<P>(4) Alexandrian:<P>Among the Hellenistic Jews in Alexandria, Aristobulus, the authors of The Wisdom of Solomon and 4 Maccabees, and preeminently Philo, all deal with the two chief problems of Judaism, dualism and evil. But they approach them under the direct influence of Greek thought. The Hebrew idea of wisdom was merged into the Greek conception of the Logos, and so it becomes the mediator of God\'s thought and activity in the world.<P>4. Philosophy in the New Testament:<P>Philosophy appears in the New Testament as intuitive, speculative and eclectic.<P>(1) The Teaching of Jesus Christ:<P>Jesus Christ came to fulfill the law and the prophets, and, out of His filial consciousness of God, He propounded answers to the practical demands of His time. His doctrine of God the Father was a philosophy of Nature and life which transcended all dualism. In the kingdom of heaven, the good would ultimately prevail over the evil. The law of love expressed the ideal of conduct for man as individual, and in his relation to society and to God, the supreme and ultimate reality. This teaching was given in the form of revelation, without any trace of speculation.<P>(2) Apostolic Teaching:<P>The apostolic writings built upon the teaching and person of Jesus Christ. Their ruling ideas are the doctrines which He taught and embodied. In Paul and John, they are realized as mystical experiences which are expressed in doctrines of universal love. But we may also discover in the apostolic writings at least three strands of speculative philosophy.<P>(a) Paul employed arguments from natural theology, similar to those of the Stoics (<a onClick="return mV(\'Act\',14,\'15-17\');">Ac 14:15-17</a>; <a onClick="return mV(\'Act\',17,\'22-31\');">17:22-31</a>; <a onClick="return mV(\'Rom\',1,19);">Ro 1:19</a>), which involved the principles of the cosmological and teleological arguments.<P>(b) John employs the Philonic term "Logos" to interpret the person of Christ in His universal relation to God, man and the world; and the main elements of Philo\'s scheme are clearly present in his doctrine, though here it is no abstract conception standing between God and man, but a living person uniting both (<a onClick="return mV(\'Jhn\',1,\'1-18\');">Joh 1:1-18</a>). Although the term "Logos" is not mentioned, in this sense, in Paul or Hebrews, the Philonic conception has been employed by both writers (<a onClick="return mV(\'Rom\',5,8);">Ro 5:8</a>; <a onClick="return mV(\'Rom\',8,29);">8:29</a>; <a onClick="return mV(\'1Cr\',15,24,25);">1Co 15:24,25</a>; <a onClick="return mV(\'2Cr\',5,18,19);">2Co 5:18,19</a>; <a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>; <a onClick="return mV(\'Col\',1,\'15-17\');">Col 1:15-17</a>; <a onClick="return mV(\'Col\',2,9,10);">2:9,10</a>; <a onClick="return mV(\'Hbr\',1,\'1-3\',5,6);">Heb 1:1-3,5,6</a>). Paul also expresses his conception of Christ as the manifestation of God under the category of wisdom (<a onClick="return mV(\'1Cr\',1,20);">1Co 1:20</a>; <a onClick="return mV(\'1Cr\',2,7);">2:7</a>; <a onClick="return mV(\'Eph\',1,8);">Eph 1:8</a>; <a onClick="return mV(\'Col\',2,3);">Col 2:3</a>).<P>(c) Both in Paul and He appear original speculations designed to interpret individual experience and human history as they culminate in Christ. Paul\'s interpretation consists of a series of parallel antitheses, flesh and spirit, sin and righteousness, law and grace, works and faith, Adam and Christ. But the author of He adopts the Platonic view that the world of history and phenomena is but the shadow or suggestion of the spiritual and eternal reality which lies behind it, and which partially expresses itself through it.<P>(3) Attitude of New Testament Writers toward Philosophy:<P>In the one place in which the term philosophy appears in the New Testament (<a onClick="return mV(\'Col\',2,8);">Col 2:8</a>), it seems to mean "subtle dialectics and profitless speculation...combined with a mystic cosmogony and angelology" (Lightfoot, at the place), the first beginnings of Gnosticism in the Christian church. Paul warns his readers against it, as he also does the Corinthians against the "wisdom" of the Greeks (<a onClick="return mV(\'1Cr\',1,19);">1Co 1:19</a>ff; <a onClick="return mV(\'1Cr\',2,5,6);">2:5,6</a>). A similar tendency may be in view in the warning to Timothy against false doctrines (<a onClick="return mV(\'1Ti\',1,4);">1Ti 1:4</a>; <a onClick="return mV(\'1Ti\',4,3);">4:3</a>; <a onClick="return mV(\'2Ti\',1,14,16;">2Ti 1:14,16</a>). But with the true spirit of philosophy, as the pursuit of truth, and the endeavor to express more fully and clearly the nature of reality, the spirit and work of the New Testament writers were in complete accord.<P>LITERATURE.<P>Introductions to philosophy by Kulpe, Paulsen, Hoffding, Watson and Mackenzie. Histories of Greek philosophy by Ritter and Preller, Burnet, and Zeller, and of general philosophy by Erdmann, Ueberweg, Windelband and Rogers; E. Caird, The Evolution of Theology in the Greek Philosophies; Hists of the Jews by Schurer, Graetz and Kent; Old Testament Theologies by Schultz and Davidson; New Testament Theologies by Beyschlag and Weinel; Philo\'s works and treatises thereon by Dahne, Gfrorer and Drummond; Harnack, What Is Christianity? Bigg, The Christian Platonists of Alexandria; Lightfoot, Colossians.``145';
isbe[6912]='Phinees`fin\'-e-es (Phinees; Codex Vaticanus (Swete), Pheinees (1Esdras 8:2)):<P>(1) Phinehas, son of Eleazar, son of Aaron (1Esdras 5:5; 8:2,29; 2Esdras 1:2; 1Macc 2:26; Sirach 45:23).<P>(2) The father of Achias and son of Hell (Eli), a descendant of (1), and one of Ezra\'s progenitors (2Esdras 1:2); but this link is not found in Ezra\'s genealogy (1Esdras 8:1f), nor in <a onClick="return mV(\'Ezr\',7,1);">Ezr 7:1</a>ff; <a onClick="return mV(\'1Ch\',6,\'1-\');">1Ch 6</a>, and its insertion in 2Esdras 1:2 is a mistake, since Ezra\'s descent was from Eleazar, while this Phinees (Phinehas) was a descendant of Ithamar, the youngest son of Aaron.<P>(3) A Levite, the father of Eleazar (1Esdras 8:63) equals "Phinehas" of <a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>. But it is just possible that the well-known Eleazar (1) is referred to here, and so not another and different Phinees.<P>(4) The King James Version equals the Revised Version (British and American) "Phinoe" (1Esdras 5:31).``5';
isbe[6913]='Phinehas`fin\'-e-as, -az, fin\'-e-has, -haz (pinechac, "mouth of brass"):<P>(1) Son of Eleazar and grandson of Aaron (<a onClick="return mV(\'Exd\',6,25);">Ex 6:25</a>; compare <a onClick="return mV(\'1Ch\',6,4);">1Ch 6:4</a>; <a onClick="return mV(\'Ezr\',7,5);">Ezr 7:5</a>, where he is seen to be an ancestor of Ezra). He took a leading part in cleansing Israel from whoredom at Shittim. He there punished the brazen licentiousness of Zimri, prince of Sirecon, by slaying both him and the Midianite woman he had brought into camp (<a onClick="return mV(\'Num\',25,\'6-18\');">Nu 25:6-18</a>). This incident is referred to in <a onClick="return mV(\'Psa\',106,30,31);">Ps 106:30,31</a> (compare 1Macc 2:26,54; Sirach 45:23,24). As priest he accompanied the expedition sent by Moses against Midjan (<a onClick="return mV(\'Num\',31,6);">Nu 31:6</a>). He was chief of the Korahite Levites (<a onClick="return mV(\'1Ch\',9,20);">1Ch 9:20</a>), and succeeded his father as high priest. While he was in that office the civil war with Benjamin occurred, and it was he who delivered the oracle\'s decision to fight Benjamin (<a onClick="return mV(\'Jdg\',20,28);">Jud 20:28</a>). His faithful services secured to his house the succession of the priesthood (<a onClick="return mV(\'Num\',25,\'11-13\');">Nu 25:11-13</a>). He was sent as ambassador to inquire into the reported idolatry of Reuben, Gad and part of Manasseh (<a onClick="return mV(\'Jos\',22,13,30,31,32);">Jos 22:13ff, 30-32</a>). According to Septuagint he was buried with his father in Ephraim on the hill Gibeah Phinehas (see <a onClick="return mV(\'Jos\',24,33);">Jos 24:33</a>). His character was marked with strong moral indignation and fine integrity.<P>(2) The younger son of Eli (<a onClick="return mV(\'1Sa\',1,3);">1Sa 1:3</a>; 2Esdras 1:2, "Phinees").<P>(3) Father of a priest named Eleazar (<a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>; compare <a onClick="return mV(\'Ezr\',8,2);">Ezr 8:2</a>; 1Esdras 8:63, "Phinees").`<a href="./study/isbe/search.html?string=HOPHNI+AND+PHINEHAS">HOPHNI AND PHINEHAS</a>`186';
isbe[6914]='Phinoe`fin\'-o-e (Phinoe; the King James Version Phinees): Name of one of the families of temple-servants who went up from Babylon with Zerubbabel (1Esdras 5:31) equals "Paseah" of <a onClick="return mV(\'Ezr\',2,49);">Ezr 2:49</a>; <a onClick="return mV(\'Neh\',7,51);">Ne 7:51</a>.``1';
isbe[6915]='Phlegon`fle\'-gon, fleg\'-on (Phlegan): The name of a Roman Christian to whom Paul sent greetings (<a onClick="return mV(\'Rom\',16,14);">Ro 16:14</a>). Of him nothing is known.``1';
isbe[6916]='Phoebe`fe\'-be (Phoibe; the King James Version Phebe): Described by Paul as (1) "our sister," (2) "who is a servant of the church that is at Cenchrea," (3) "a helper of many, and of mine own self" (<a onClick="return mV(\'Rom\',16,1,2);">Ro 16:1,2</a>).<P>(1) "Our (Christian) sister": Paul calls the believing husband and wife "the brother or the sister" (<a onClick="return mV(\'1Cr\',7,15);">1Co 7:15</a>), and also asks, "Have we no right to lead about a wife that is a sister?" (<a onClick="return mV(\'1Cr\',9,5);">1Co 9:5</a> margin). The church was a family.<P>(2) The Greek word translated "servant" is diakonos. "Servant" is vague, and "deaconess" is too technical. In the later church there was an order of deaconesses for special work among women, owing to the peculiar circumstances of oriental life, but we have no reason to believe there was such an order at this early period. If Phoebe had voluntarily devoted herself "to minister unto the saints" by means of charity and hospitality, she would be called diakonos.<P>(3) The Greek word prostatis translated "helper" is better "patroness." The masculine is "the title of a citizen in Athens who took charge of the interests of clients and persons without civic rights" (Denney). Many of the early Christian communities had the appearance of clients under a patron, and probably the community of Cenchrea met in the house of Phoebe. She also devoted her influence and means to the assistance of "brethren" landing at that port. Paul was among those whom she benefited. Gifford thinks some special occasion is meant, and that Paul refers to this in <a onClick="return mV(\'Act\',18,18);">Ac 18:18</a>. The vow "seems to point to a deliverance from danger or sickness" in which Phoebe may have attended on him.<P>It is generally assumed that this letter was taken to Rome by Phoebe, these verses introducing her to the Christian community. In commending her, Paul asks that the Roman Christians "receive her in the Lord," i.e. give her a Christian welcome, and that they "assist her in whatsoever matter she may have need" of them (<a onClick="return mV(\'Rom\',16,1,2);">Ro 16:1,2</a>).``78';
isbe[6917]='Phoenice`fe-ni\'-se (Phoinix).`<a href="./study/isbe/search.html?string=PHOENIX">PHOENIX</a>`1';
isbe[6918]='Phoenicia; Phoenicians`fe-nish\'-i-a, fe-nish\'-anz:<P>1. The Land<P>2. The Colonies<P>3. The People<P>4. Arts and Manufactures<P>5. Commerce and Trade<P>6. Language and Culture<P>7. Religion<P>8. History<P>LITERATURE<hr /><P>1. The Land:<P>The term "Phoenicia" is Greek (Phoinike, "land of dates, or palm trees," from phoinix, "the date-palm"). It occurs in the Bible only in Acts (<a onClick="return mV(\'Act\',11,19);">11:19</A>; <a onClick="return mV(\'Act\',15,3);">15:3</A>; <a onClick="return mV(\'Act\',21,2);">21:2</A>), the land being generally designated as the "coast" or "borders of Tyre and Sidon" (<a onClick="return mV(\'Mat\',15,21);">Mt 15:21</a>; <a onClick="return mV(\'Mar\',7,24,31);">Mr 7:24,31</a>; <a onClick="return mV(\'Luk\',6,17);">Lu 6:17</a>). In the Old Testament we find it included in the land belonging to the Canaanites or to Sidon (<a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>; <a onClick="return mV(\'Gen\',49,13);">49:13</a>; <a onClick="return mV(\'Jos\',11,8);">Jos 11:8</a>; <a onClick="return mV(\'1Ki\',17,9);">1Ki 17:9</a>). The limits of Phoenicia were indefinite also. It is sometimes used by classic writers as including the coast line from Mt. Cassius on the north to Gaza or beyond on the south, a distance of some 380 miles, or about 400 miles if we include the sweep of indentations and bays and the outstretching of the promontories. But in the stricter sense, it did not extend beyond Gabala (modern Jebleh) on the north, and Mt. Carmel on the south, or some 150 miles. The name was probably first applied to the region opposite Cyprus, from Gabala to Aradus and Marathus, where the date-palm was observed, and then, as it was found in still greater abundance farther south, it was applied to that region also. The palm tree is common on the coins of both Aradus and Tyre, and it still grows on the coast, though not in great abundance. The width of the land also was indefinite, not extending inland beyond the crest of the two ranges of mountains, the Bargylus (Nusairi Mountains) and the Lebanon, which run parallel to the coast and leave but little space between them and the sea for the greater portion of their length. It is doubtful whether the Phoenicians occupied the mountain tracts, but they must have dominated them on the western slopes, since they derived from them timber for their ships and temples. The width of the country probably did not exceed 25 or 30 miles at the most, and in many places it was much less, a very small territory, in fact, but one that played a distinguished role in ancient times.<P>There are few harbors on the whole coast, none in the modern sense, since what few bays and inlets there are afford but slight shelter to modern ships, but those of the ancients found sufficient protection in a number of places, especially by means of artificial harbors, and the facility with which they could be drawn out upon the sandy beach in winter when navigation was suspended. The promontories are few and do not project far into the sea, such as Theu-prosopon south of Tripolis, Ras Beirut and the broad projection south of Tyre including Ras el-\'Abyadh and Ras en-Naqura and Ras el-Musheirifeh (see <a href="./study/isbe/search.html?string=LADDER+OF+TYRE">LADDER OF TYRE</a>). The promontory of Carmel is rather more marked than the others, and forms quite an extensive bay, which extends to Acre. The promontory rises to a height of 500 ft. or more near the sea and to more than double that elevation in its course to the southeast.<P>Mt. Lebanon, which forms the background of Phoenicia for about 100 miles, is a most striking feature of the landscape. It rises to a height of 10,200 ft. in the highest point, east of Tripolis, and to 8,500 in Jebel Sunnin, east of Beirut, and the average elevation is from 5,000 to 6,000 ft. It is rent by deep gorges where the numerous streams have cut their way to the sea, furnishing most varied and picturesque scenery. It was originally heavily wooded with cedar, oak, and pine trees, which are still found in considerable numbers, but by far the larger part of the mountain has been denuded of forests, and the slopes have been extensively terraced for the cultivation of vines and fruit trees and the mulberry for silk culture. The plains along the coast are not extensive, but generally very fertile and bear abundant crops of wheat, barley and other cereals, where not given to the culture of the mulberry, orange, lemon, fig, apricot and other small fruits. In its greatest extent Phoenicia included the broad plain of Sharon and that of Acre, between Carmel and that city, and a portion of the region watered by the Kishon, but the plains of Phoenicia, strictly speaking, are much more restricted. They are: the plain of Tyre, long but narrow, extending from Ras el-\'Abyadh to Sarepta; the plain of Sidon extending from Sarepta to the Bostrenus (Nahr el-\'Auly); the plain of Beirut (Berytus) between the extensive sand dunes along the shore and the rocky cape on the west and the foot of Lebanon, 10 or 12 miles long but only one or two wide, containing one of the largest olive groves in Syria; the very small plain of Tripolis, including that city and its port; and, the most extensive of all, the plain of Marathus, extending from Arka to Aradus or even beyond, including the river Eleutherus (Nahr el-Kebir). These plains furnished only a portion of the food needed by the inhabitants who were more or less dependent on their neighbors for it (<a onClick="return mV(\'1Ki\',5,11);">1Ki 5:11</a>; <a onClick="return mV(\'Act\',12,20);">Ac 12:20</a>).<P>The rivers of Phoenicia are comparatively short and small; the Litany rises in the Buka\', between Lebanon and Anti-Lebanon, and finds its way in a deep and narrow gorge between Lebanon and Mt. Hermon to the south, and finally turns westward and reaches the sea a few miles north of Tyre, where it is called the Kasimiyeh. About 12 miles north of Beirut is the Dog River (Lycus), a very short stream but noted for the famous pass at its mouth, where Egyptian Assyrian and Babylonian kings engraved their monuments; and a few miles south of Jebail (Gebal) is the Adonis (Nahr Ibrahim), which comes down from \'Afqa (Apheca equals Aphek, <a onClick="return mV(\'Jos\',13,4);">Jos 13:4</a>), noted for the rites of Venus and Adonis (see <a href="./study/isbe/search.html?string=TAMMUZ">TAMMUZ</a>); and the Eleutherus, already mentioned, which runs through the valley between Bargylus and Lebanon and provides the pass between these two mountains into the interior. The other rivers are very short, but furnish a perennial water-supply to the coast dwellers.<P>The products of the land, as well as the climate, are very varied on account of the difference in elevation of the tracts suitable to culture, ranging in temperature from the semi-tropical to Alpine. How far the ancients cultivated the mountain sides we do not know, but they certainly profited largely by the forests of cedar and pine, especially the former, which was the most valuable for shipbuilding and architectural purposes, and was highly prized, not only by the Phoenicians, but by Egyptians, Assyrians and Babylonians, who transported it to their own countries for buildings. The mineral products are few, and the Phoenicians depended on their colonies and other lands for what they needed of these.<P>2. The Colonies:<P>The narrowness of the land and the difficulty of expansion on account of the lofty mountain ranges and the hostility of the tribes of the interior led the Phoenicians to turn seaward for an outlet to their increasing population. We have only one instance of their attempt to colonize the Hinterland, and that ended in disaster (<a onClick="return mV(\'Jdg\',18,\'1-\');">Jud 18</a>). Hiram, king of Tyre, was not pleased with Solomon\'s gift of 20 cities in Galilee, probably not desiring to assume responsibility for their defense. The people early became mariners, and the dominion of the sea was more inviting to them, and they found room for expansion in the islands and on the coast of the Mediterranean, where they established colonies far and wide. Their first over-sea possessions were in Cyprus, the coasts of which they occupied in the 2nd millennium BC, probably about 1500. On the southern coast they planted various colonies, such as Citium (Larnaca), Amathus, Curium and Paphos, and on the eastern, Salamis, Ammachosta and Soli, and, in the interior, Idalium and Golgi, besides other less important settlements. The evidences of the Phoenician occupation of Cyprus are numerous. The southern portion of Asia Minor also attracted them at an early date, especially the rich plains of Cilicia, and Tarsus became the most important of their colonies there. Its coins bear Phoenician types and legends, among which Baal is conspicuous. Other points along the coast were occupied, and the island of Rhodes as well as certain ports on the south coast of Crete, and most of the islands of the Aegean. Their presence in Attica is vouched for by inscriptions, and legend connects Thebes with them in the person of Cadmus, the reputed son of Agenor, king of Phoenicia. But it is doubtful whether they really colonized the mainland of Greece. They were more attracted by the lands farther to the west.<P>The greatest of their colonies was in Africa. They occupied Utica first, probably in the 12th century BC, and others in the same region until in the 9th century. Great Carthage was founded, which was destined to become the richest and most powerful of all and the dreaded rival of Rome. All are familiar with the story of Elisa, or Dido, the reputed Tyrian queen who led her followers to the place and founded the city. The story is perhaps legendary, but that Carthage was a colony of Tyre there is no reason to doubt. Other colonists occupied portions of Sicily, such as Motya, Erix, Soli and Panormus (Palermo). They also crossed over to Sardinia and the Balearic Isles, and planted colonies on the south coast of Spain and the northwestern coast of Africa, within and beyond the straits of Gibraltar. Of their settlements in Spain Gades (Cades) and Tartessus were the most noted, the latter being probably the Tarshish of Scripture (<a onClick="return mV(\'1Ki\',10,22);">1Ki 10:22</a>). Malaca (Malaga) and Abdera, within the straits, were likewise important settlements, and there were others of less note.<P>The colonial enterprise of the Phoenicians was remarkable for the age, and was only surpassed in ancient times by the Greeks who came later, the former being the pioneers. The energy and daring of the Phoenicians in pushing out into unknown seas, with the imperfect means at their disposal, is evidence of the enterprise of this people. Their chief object, however, was trade. Their colonies were mostly factories for the exchange of their manufactured articles for the products of the lands they visited. They cared little about building up new states or for extending their civilization and molding barbarous tribes and imparting to them their culture. In this they were far surpassed by the Greeks whose colonies profoundly modified the peoples and lands with which they came in contact.<P>3. The People:<P>The Phoenicians were the same as the Canaanites, under which name they are known in the Old Testament, as well as Sidonians (<a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>; <a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>). They were of Semitic stock, if we may judge by their language and characteristics. It is true that in <a onClick="return mV(\'Gen\',10,6);">Ge 10:6</a> Canaan is called a son of Ham, but it is also true that the language of Canaan is identified with Hebrew (<a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a>). If the early Phoenicians spoke a different tongue, they entirely lost it before their contact with the Hebrews. Their writings and all the references to them in ancient authorities show that their language was purely Semitic. As to their origin and the time of their migration to the Syrian coast, it is more difficult to determine. Herodotus (i.2; vii.89) says that they lived at first on the Erythraean Sea, which is identified with the Persian Gulf, and modern authorities have not found evidence to refute the statement. It is quite certain that they were not the aborigines of the country, and must have come in with some of the various migrations from the East, which we know, from Egyptian and Babylonian monuments, occurred in the 3rd, perhaps in the 4th, millennium BC. Semites are found in Syria as early as the IVth Egyptian Dynasty, about 3000 BC, and we may fairly conjecture that the Canaanites were in possession of the seacoast as early as 2500 BC. It is possible that they were among the Hyksos invaders of Egypt (Paton, Syria and Palestine, 67).<P>That the Phoenicians took to the sea at a very early date and became the most skillful mariners of the ancient world is certain. Their enterprise in this direction is attested by classic writers, and the references to it in the Old Testament are numerous. This was coupled with great industry and skill in the manufacture of the various articles which furnished the materials of their extended commerce. They exhibited a boldness and audacity in braving the perils of the sea in their little ships, which, for the age, demands our admiration. They were the first who dared to push out of sight of land in their voyages and sail beyond the Pillars of Hercules into the ocean. But in their commercial dealings they were often unscrupulous, and their greed of gain often led them to take unfair advantage of the barbarous races with whom they came in contact. The purchase of the land on which the citadel of Carthage was built may illustrate the opinion of the ancients regarding them, but we ought to remember that trickery and deceit are charged against them by their enemies, who alone have handed down accounts of them. The Hebrew prophets speak of their pride and vanity (<a onClick="return mV(\'Eze\',28,17);">Eze 28:17</a>), and violence (<a onClick="return mV(\'Eze\',28,16);">Eze 28:16</a>), and Amos hints at a traffic in captives taken in war, but whether of Hebrews or not is not clear (<a onClick="return mV(\'Amo\',1,9);">Am 1:9</a>). Slaves were among the articles of merchandise in which they traded (<a onClick="return mV(\'Eze\',27,13);">Eze 27:13</a>; <a onClick="return mV(\'Joe\',3,6);">Joe 3:6</a>), but this could hardly be charged against them as a great sin when slavery was universal. The chief reason for their being denounced by the prophets was their corrupt practices in worship and the baleful influence of the Baal and Astarte cult introduced by them into Israel through Ahab\'s marriage with Jezebel (<a onClick="return mV(\'1Ki\',16,\'31-33\');">1Ki 16:31-33</a>). This evil influence was felt even after the captivity when the rites of the Phoenician Tammuz were practiced in Jerusalem (<a onClick="return mV(\'Eze\',8,14);">Eze 8:14</a>). But the earlier relations of the Phoenicians with Israel in the days of David and Solomon were friendly and mutually beneficial. On the whole the judgment of history assigns to this people a high position for their enterprise and skill in carrying on their trade, and in being the pioneers of civilization in many of the Mediterranean lands, especially by their introduction of alphabetical writing, which was by far the most valuable of all their contributions to the culture of the ancient world.<P>4. Arts and Manufactures:<P>(1) Textile Fabrics:<P>The Phoenicians were celebrated for their textile fabrics of silk, wool, linen and cotton. The materials of the last three were obtained from Syria and Egypt, but the silk came from the Far East through Persia. The dyeing of these fabrics was by a process invented by the Phoenicians, and the luster and permanence of color were unequaled by the ancients and made the Tyrian purple famous throughout the world. The finer qualities of it were so precious that only the very wealthy, or kings and princes, could obtain it, and it became at last a synonym of royalty. This dye was obtained from the shell-fish which was abundant in the Mediterranean, especially along the Phoenician coast, species of the Murex and the Buccinum. The mode of manufacture is not definitely known and was probably kept a secret by the Phoenicians. At least they had a monopoly of the business.<P>(2) Glass:<P>Glass was another well-known product of the country, and although not invented by the Phoeniclans as formerly supposed, it was made in large quantities and exported to all countries about the sea.<P>See <a href="./study/isbe/search.html?string=GLASS">GLASS</a>.<P>(3) Pottery:<P>Pottery was also an article of manufacture and export, and some of the examples of their work found in Cyprus show considerable skill in the art of decoration as well as making. In this, however, they were far surpassed by the Greeks.<P>(4) Bronze:<P>Bronze was a specialty of the Phoenicians, and they were for centuries the leading producers, since they controlled the sources of supply of the copper and tin used in its manufacture. The remains of their bronze manufactures are numerous, such as arms for offense and defense, knives, toilet articles, axes, sickles, cups, paterae, and various other household utensils. Articles for artistic purposes are not of high value, although the pillars named Jachin and Boaz, the molten sea, the bases, layers and other articles cast by Hiram of Tyre for the temple of Solomon must have exhibited considerable artistic merit. Their bronze was of good quality and was tempered so as to serve well for edged tools. The composition was about 9 parts copper to 1 part of tin. They seem also to have made iron (<a onClick="return mV(\'2Ch\',2,14);">2Ch 2:14</a>), and some specimens have come down to us, but we cannot judge from their scarcity as to the extent of their manufactures in this metal, since most of the articles have perished by corrosion.<P>Aesthetic art among the Phoenicians was of low grade, as it was among the Semites generally, and where we find some works of moderate merit they undoubtedly manifest the influence of Greek art, such as those found in Cyprus by General Di Cesnola and others. In Phoenicia proper very little of artistic value has come to light that can be ascribed to native artists. In sculpture the style is stiff and conventional, much of it exceedingly rude, and lacks expression. The animal forms are generally grotesque, often absurd, reminding one of children\'s attempts at plastic article The anthropoid sarcophagi discovered at Sidon were modeled after the Egyptian and the magnificent ones, of different design, from the same place, now in the Museum of Constantinople, were certainly the work of Greek artists of the age of Alexander the Great.<P>The architecture of the Phoenicians was characterized by massiveness, rather than elegance. The substructures of some of their temples and castles are cyclopean, like those of the temple at Jerusalem (<a onClick="return mV(\'1Ki\',7,10);">1Ki 7:10</a>), and other examples are found at Sidon, Gebal, Marathus and other places in Phoenicia itself. Their work seems lacking in symmetry and grace, showing a want of aesthetic taste.<P>5. Commerce and Trade:<P>Trade was the very life of Phoenicia. The contracted limits of the land forbade any extensive agriculture, and the people were forced to get their living by other means. They applied themselves to industrial arts, and this led them to seek the means for distributing their wares. Trade was essential to them, and they sought outlets for it by sea and land. Their position was especially favorable for commerce. In the very center of the ancient world, with the great rich and populous nations of antiquity at their back and on either side, they faced the young, vigorous and growing nations of the West, and they served them all as carriers and producers. Their caravans threaded all the well-beaten routes of the East, the deserts of Arabia and the mountain defiles of Armenia and Asia Minor, and their ships pushed boldly out to sea and explored the Mediterranean and the Euxine and did not hesitate to brave the unknown dangers of the Atlantic and perhaps even penetrated to the Baltic, emulating the mariners of a later day in their zeal for discovery and search for new avenues of trade. Could we find a detailed account of their voyages and discoveries, it would be a most interesting document, but we have little except what others have written about them, which, however, gives us a pretty fair idea of the extent of their commercial enterprise. The prophet Ezekiel has given us a remarkable catalogue of the wares of Tyre and of the countries with which she traded (<a onClick="return mV(\'Eze\',27,1);">Eze 27</a>). There we have mention of nearly all the regions of Western Asia, Egypt, Greece and the islands, and Spain, indicated by the names of races, tribes and countries. The materials of their traffic include the most important known to the ancient world, the products of agriculture, such as wool, linen, oil, balm, spices, frankincense, wine, corn, etc.; of metals, such as gold, silver, copper (brass), tin, iron, lead, etc.; precious stones and the articles of manufacture, the "multitude of handiworks," which they were so skillful in producing. They traded in animals also, horses, mules, lambs, rams and goats, and, what is less to their credit, in the persons of men (<a onClick="return mV(\'Eze\',27,13);">Eze 27:13</a>). The range of their trade was much wider than is indicated by Ezekiel. We know they reached the Scilly Isles in Britain, and probably the Baltic, whither they went for amber, though this might have been brought overland to the Adriatic and received into their ships there. They passed along the western coast of Africa as far as Cape Non, and perhaps farther, for Herodotus tells us that Pharaohnecoh dispatched a crew of Phoenician sailors to circumnavigate Africa, which they accomplished in 3 years.<P>We know that they had a fleet in the Red Sea sailing from Elath or Ezion-geber (<a onClick="return mV(\'1Ki\',9,26,27);">1Ki 9:26,27</a>), and it is quite possible that they were allowed by some of the kings of Egypt to avail themselves of ports on the other branch of the Red Sea. They must have visited the eastern shore of Africa and perhaps struck across the Indian Ocean, after skirting the coast of Arabia, and thus carried on trade with India. The Ophir mentioned in connection with these voyages has not been definitely located, but was perhaps in Southern Arabia, though possibly in Southeast Africa.<P>See <a href="./study/isbe/search.html?string=GOLD">GOLD</a>.<P>The ships in which the Phoenicians made these voyages were small as compared with the great vessels of the present day, but the largest known in their age, as we may infer from the long voyages they made. Their superiority is testified to by classical writers. In the famous expedition of Xerxes to Greece the Phoenician ships excelled all others in speed, and the king chose one of them when he embarked upon the sea (Herodotus vii.100). These ships were impelled both by sails and oars, as we know from illustrations upon the coins.<P>See <a href="./study/isbe/search.html?string=COINS">COINS</a>.<P>6. Language and Culture:<P>The ancients attributed the invention of the alphabet to the Phoenicians. This is now regarded as doubtful, and there are no reliable data for determining what people first analyzed speech to its ultimate elements, but to the Phoenicians belongs the merit of bringing the invention to the knowledge of the western world. It is quite certain that the alphabets of Western Asia and those of Europe were derived from the Phoenician characters. This is what we should have expected from their wide commercial relations. The alphabetic writing was in fact one of their exports and was by far, the most important of them all. The world owes a great debt to this people for this invaluable aid to literature, science and culture.<P>See <a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>.<P>The Phoenician alphabet comprises 22 letters and is deficient in signs to indicate vowels, which were left to be supplied by the reader. This defect is common to the Semitic alphabets, but was soon remedied when the Greeks adopted the Phoenician. Some of the letters have to serve for two sounds, such as the signs for "s" and "sh", for "p" and "ph", for "t" and "th"; besides, there is a redundant sign for the sound of "s". Also the sounds of "y" and "w" are unrepresented. The origin of the letters is probably to be found in the hieroglyphic signs for words and syllables used by the Egyptians and others, since the similarity of some of them to these signs is evident, but in some cases it is more likely that the Phoenicians adopted hieroglyphics of their own. Thus the first letter, \'aleph, which means "ox," was evidently derived from the picture of an ox\'s head and then reduced to a conventional form.<P>The Phoenician alphabet and language were common to the Canaanitish tribes and the Hebrews, as we know from the many inscriptions found in Western Asia. The Moabite Stone testifies to their use east of the Jordan, and the Siloam Inscription likewise for Israel, and the same characters have been found in Northern Syria. This would be natural, for people of these regions had become largely Semitic by the 9th century BC, when we suppose that the Phoenician alphabet was in general use.<P>It is strange that the Phoenicians, who had an alphabet so early, and made it so widely known to the world, made so little use of it for literature. The remains of their language are very scanty, mostly inscriptions, and these generally very brief. The longest ones in Phoenician proper are those from Sidon, the most famous of which is that of Esmunazer, king of Sidon, comprising 298 words. Some few others, pertaining to the same dynasty, have been discovered in tombs and on the walls of the temple of Asmun, and show the Phoenician character and style in its best form. Only two works of any length are known to us by translation or references in Greek authors. The first is the Phoenician History of Sanchoniathon, of Beirut, which Philo of Byblus claims to have translated from the Phoenician original. This, however, is doubted, and both the author and the history are suspected to be mythical. The other work is genuine; the short account of the voyage of a Carthaginian king beyond the Pillars of Hercules, called the Periplus of Hanno, is not without merit as a narrative, and indicates that the Carthaginian branch of the Phoenician race, at least, may have had a literature of some value, but it is unfortunately lost. We cannot suppose, however, that it was very extensive or very important, as more of it would then have been preserved. The conclusion is natural that the Phoenicians were so absorbed in commercial enterprise and the pursuit of wealth that they neglected the nobler uses of the invaluable instrument of culture they had found in alphabetic writing.<P>7. Religion:<P>A very prominent role was assigned to religion in the life of the Phoenicians. As a Semitic people, such a characteristic was but natural and they seem to have possessed it in large measure. Their religious ideas are important on account of the influence they had on the Hebrews, which is so apparent in the Old Testament. The worship of the Canaanitish Baal and Ashtoreth, or Astarte, led the Israelites astray and produced most disastrous results.<P>There can be little doubt that the chief deities of the Phoenicians, as well as the forms of their cult, were derived from Babylonia, brought with them probably when they migrated to the west, but afterward modified by contact with Egypt and Greece. Some regard the earliest conception of the deity among the Semites to have been monotheism, and we find traces of this in the attributes ascribed by the Phoenicians to their chief god. He is Baal, "lord" or "master"; Baal-samin, "lord of heaven"; Eliun, "supreme," etc. These terms imply either one God or one who is supreme among the gods and their ruler. But this belief was changed before the Phoenicians came into contact with the Hebrews, and polytheism took its place, though their gods were less numerous than among most polytheistic races. One of the most corrupting tendencies we notice was the ascription of sexual characteristics to the chief deities of their pantheon, such as Baal and Ashtoreth, which led to licentious rites of the most abominable character.<P>Baal ba\'al; the Phoenician Baal was the chief deity and was universally worshipped, being usually designated by the locality in each place: Baal of Tyre or Baal-Tsur, Baal-Sidon, Baal-Tars (Tarsus), Baal-bek, etc. He was regarded as the god of the generative principle in Nature, and his statues were sometimes flanked by bulls. He was identified with Zeus, and he appears on the coins under the Greek type of Zeus, seated on a throne, holding an eagle in the outstretched right hand and a scepter in the left. Sometimes his head is encircled with rays showing him to be the sun-god.<P>Ashtoreth (Phoenician \'ashtoreth) was the great Nature-goddess, the Magna Mater, queen of heaven (<a onClick="return mV(\'Jer\',7,18);">Jer 7:18</a>), and as Baal was the solar deity, so she was often represented under the lunar aspect, Ashteroth-karnaim, "Ashteroth of the two horns" (<a onClick="return mV(\'Gen\',14,5);">Ge 14:5</a>). Sometimes she is represented holding the dove, the symbol of fecundity, of which she was the goddess. She was commonly identified with Aphrodite or Venus. She, like Baal, had temples everywhere, and kings were sometimes her high priests, and her worship was too often accompanied with orgies of the most corrupt kind, as at Apheca.<P>See <a href="./study/isbe/search.html?string=ASHTORETH">ASHTORETH</a>; <a href="./study/isbe/search.html?string=TAMMUZ">TAMMUZ</a>.<P>Among the other gods we may mention: El, or Il (\'el originally the designation of the supreme God, but afterward a subordinate deity who became the special divinity of Byblus (Gebal), and was regarded by the Greeks as the same as Kronos. Melqarth (melqarth, "king of the city") originally was the same as Baal, representing one aspect of that god, but later a separate deity, the patron god of Tyre whose head appears on many of its coins, as well as his symbol, the club, since he was identified with Hercules. Herodotus describes his temple at Tyre to which he attributes great antiquity, 2,300 years before his time. Dagon (daghon) seems to have been the tutelary deity of Aradus, his head appearing on the early autonomous coins of that city. He seems to have been regarded as the god of agriculture by the Phoenicians, rather than of fishing as generally supposed. Adonis (\'adhon, "lord") was regarded as the son of Cinyras, a mythic king of Gebal and the husband of Ashtoreth. The myth of his death by the wild boar led to the peculiar rites celebrating it, instituted by the women of Gebal at Apheca and on the river named after him (see <a href="./study/isbe/search.html?string=TAMMUZ">TAMMUZ</a>). Esmun (\'esmun) one of the sons of Siddik, the father of the Cabiri, was especially honored at Sidon and Beirut. At Sidon a great temple was built in his honor, the ruins of which have been recently explored and various inscriptions found dedicating it to him. His name signifies "the eighth," i.e. the eighth son of Siddik, the others being the Cabiri, or Great Ones, who were regarded as presiding over ships and navigation, and as such were worshipped in many places, although their special seat was Beirut. Although they were called "Great" they are represented as dwarfs, and an image of one of them was placed on the prow, or stern, of each Phoenician war galley. The goddess Tanith (tanith) occupied a lofty place in the pantheon, since in inscriptions she takes the precedence over Baal when the two names occur together. She was especially honored at Carthage and to her most exalted names are given, such as "the parent of all"; "the highest of the gods"; "the mistress of the elements," etc. Besides some other gods of less note originally worshipped by the Phoenicians, they introduced some foreign deities into their pantheon. Thus Poseidon appears frequently on the coins of Beirut and became its patron deity in Roman times; Isis and her temple at Gebal are likewise represented on its coins, the Dioscuri or their symbols on those of Tripolis and Beirut, etc. The corrupt nature of the Phoenician worship has been referred to. It was also cruel, the custom of human sacrifices being common and carried to an extent unheard of among other peoples, such as the horrible sacrifice of 200 noble youths at Carthage when besieged by Agathocles. The sacrifice was by burning, the victim being placed in the arms of the statue of the god, heated for the purpose. In Phoenicia this god was Melqarth, or Molech, and the custom is denounced in the Old Testament (<a onClick="return mV(\'Lev\',20,\'2-5\');">Le 20:2-5</a>), but other gods were also honored in this way. The religious feeling of the Phoenicians was undoubtedly deep, but sadly corrupt and depraved.<P>8. History:<P>The political history of Phoenicia is that of the towns and cities belonging to it. The country as a whole had no centralized government, but the chief towns exercised a sort of hegemony, at times, over some of the lesser ones. This was especially the case with Sidon and Tyre, but every city had its king and its local government. The land is never referred to in ancient documents, but the people are designated by their cities. Thus, we find in <a onClick="return mV(\'Gen\',10,17);">Ge 10:17</a>f the mention of Sidon, the Arvadite, the Arkite, etc., and, in <a onClick="return mV(\'Jos\',13,4);">Jos 13:4</a>, the Gebalites and the Sidonians in connection with the land of the Canaanites. In the same way the inscriptions of Egypt, Babylonia and Assyria refer to the people of the different cities, but not to the land as a political unit, which it never was.<P>The cities first come into notice in the period of the Egyptian domination, beginning in the 16th century BC under Thothmes III. This king subdued most of the Phoenician cities, or received their submission, in his numerous campaigns to Syria, and the Egyptian rule continued with more or less interruption until the decline of Egypt under the XXth Dynasty, or about 300 years. During this time Arvad seems to have exercised the hegemony in the north, and Sidon in the south, with Gebal controlling the middle region. The Tell el-Amarna Letters reveal many facts concerning the condition of things while the Egyptian power was declining in the latter part of the XVIIIth Dynasty, especially in the reign of Amenhotep IV (Ikhnaton). The rise of the Amorite and Hittite power in the north threatened these cities, which were under Egyptian governors, and they called upon their suzerain for aid, which was not given, and they fell, one after another, into the hands of the enemy. Rameses II restored Egyptian rule, but his successors of the XXth Dynasty could not maintain it, and the invasion of tribes from the west and north, called the Peleset, or Philistines, by land and sea, though repelled by Rameses III, continued to increase until the Egyptian domination was broken, and the coast towns resumed their independence about the middle of the 12th century BC. Sidon came to the front as the chief city of Phoenicia, and it is referred to by Joshua as "Great Sidon" (<a onClick="return mV(\'Jos\',11,8);">Jos 11:8</a>). Homer also mentions Sidon frequently, but makes no reference to Tyre. The latter city was certainly in existence in his day, but had not come to the front as the leading city in the mind of the Greeks. Yet it was a fortified city in the time of Joshua (<a onClick="return mV(\'Jos\',19,29);">19:29</a>), and the king of Tyre is among the correspondents mentioned in the Tell el-Amarna Letters. It seems to have taken precedence of Sidon when the latter was attacked by the Philistines of Askelon, and the inhabitants were compelled to flee for safety to Tyre. At all events Tyre exercised the hegemony in Phoenicia by the time David came to the throne, and had probably obtained it a century or two before, and held it until Phoenicia became subject to Assyria in the 9th century BC. Asshur-nazir-pal first came into contact with Phoenicia, which submitted to tribute, between 877 and 860 BC, and this subjection continued until the downfall of Assyria in the latter part of the 7th century BC. The subjection was nominal only for more than a century, the cities retaining their kings and managing their own affairs with no interference from the Assyrians as long as they paid the tribute. But with the advent of Tiglath-pileser in Syria, about 740 BC, conditions changed, and the Phoenician towns were subjected to severe treatment, and some of the dynasties were driven from their cities and Assyrian governors appointed in their places. Their oppression caused revolts, and Elulaeus of Tyre united Sidon and the cities to the south in a league to resist the encroachments of Tiglath-pileser and his successor Shalmaneser IV, whom he successfully resisted, although the Assyrian gained over to his side Sidon, Acre, and some other towns and had the assistance of their fleets to make an attack upon the island city. The attack failed completely, and Shalmaneser left Elulaeus to his independence, which he maintained for a quarter of a century, regaining control of the towns that had fallen away and also of Cyprus. Sargon (722-705 BC) let Phoenicia alone, but Sennacherib (705-681) determined to punish the king of Tyre and prepared an army of 200,000 men for the war with Phoenicia. Elulaeus was afraid and fled to Cyprus, but his towns dared to resist and Sennacherib had to reduce them one after another, but did not succeed in taking Tyre itself. He set over the conquered territory a certain Tubaal, probably a Phoenician who paid him tribute. He also took tribute from Gebal and Aradus, which indicates that all of Phoenicia was subject to him, as these two cities probably controlled all that was not under Tyre. In the reign of Esarhaddon (681-668) Sidon revolted under Abd-Melkarth, who was caught and beheaded, the city sacked, and the inhabitants either killed or carried into captivity, and it was re-peopled by captives from the East. At a later date (672), when Esarhaddon was preparing to invade Egypt, Baal, the vassal king of Tyre, revolted and refused to aid him, but afterward submitted either to Esarhaddon or to his son Ashurbanipal and assisted the latter in his invasion of Egypt, 668 BC. Four years later, however, we find the Assyrian king besieging Tyre and punishing Baal by making him give his daughter to be a member of the Assyrian\'s harem. Baal himself was left on his throne. The same fate was the lot of the king of Aradus, and Accho (Acre) was also punished.<P>The frequent rebellions of the Phoenician towns show their love of independence and a sturdy resistance to oppression. They became freed from the yoke of Assyria probably about 630 BC, when the Medes attacked Nineveh and the Scythic hordes overran all Western Asia. The Phoenician cities were fortitled and did not suffer very much from the barbarian invasion, and, as Assyria was broken, they resumed their independence. In the struggle which followed between Egypt and Babylon for the mastery of Syria, Phoenicia fell, for a time, under the sway of Egypt, but was not oppressed, and her towns prospered, and it was in this period that Tyre attained great wealth and renown as reflected in the Book of Ezekiel. When Nebuchadnezzar laid siege to it, a resistance of 13 years showed its strength and resources, and although the town on the mainland was destroyed, it is doubtful whether the king of Babylon took the island city, but it must have submitted to pay tribute (585 BC). Phoenicia remained subject to Babylon until that empire fell into the hands of the Persians (538), and then accepted the yoke of the latter in the days of Cambyses, if not earlier, but the Persian king does not seem to have used force to gain the adherence of the Phoenicians. He needed their fleets to assist in the attack upon Egypt and secured them without difficulty. They aided him in the conquest of Egypt, but when he asked them to proceed against Carthage they refused, and he had to desist. The navy of Phoenicia was too necessary for him to run any risk of alienating it.<P>This navy was the strongest sea power of the Persians in all their coming wars with Greece. Without its assistance Darius and his successors could with difficulty have invaded that country or held in subjection the western coasts of Asia Minor. Phoenicia remained faithful to her Persian rulers about 150 years, but when the general revolt of the western satraps occurred in 362 BC, Phoenicia seems to have favored them, but no open rebellion broke out until 351, when Sidon, under her king Tabnit II (Tennes), boldly declared her independence and induced most of the Phoenician cities to do the same. The Persian garrisons were massacred or driven out. Ochus, the king of Persia, marched with an army of 300,000 infantry and 30,000 horse to punish the rebels, and Tabnit, in cowardly alarm, betrayed Sidon into his hands, but the citizens set fire to the city and destroyed themselves rather than fall into the hands of Ochus, who, as treacherous as Tabnit, slew the traitor (see <a href="./study/isbe/search.html?string=SIDON">SIDON</a>). The other cities then submitted, and Phoenicia remained subject to Persia until the time of Alexander the Great. When this conqueror invaded the dominions of Persia and had defeated Darius at Issus, 333 BC, he demanded the submission of the Phoenician towns, and all yielded save Tyre. Alexander was obliged to lay siege to it, which cost him 7 months of the severest labor, such was the valor and skill of the Tyrians. The capture of Tyre is reckoned as one of the greatest exploits of this mighty conqueror who stained his record by his cruel treatment of the brave defenders. He massacred the male prisoners and sold the remainder of the inhabitants, to the number of 30,000, into slavery (see <a href="./study/isbe/search.html?string=TYRE">TYRE</a>). After the death of Alexander the Phoenician cities were subject to the Ptolemies of Egypt and the Seleucids of Syria, the latter finally obtaining control of all by the victory of Antiochus III over Scopas in 198 BC. From this time on Phoenicia formed a part of the Seleucid kingdom until it passed, together with Syria and Palestine, into the hands of the Romans. Its cities became the home of many Greeks and its language became largely Greek, as inscriptions and coins testify. The Romans had also much to do in modifying the character of the people, and some towns, Berytus, especially, became largely Roman. Phoenicia can hardly be said to have had a separate existence after the Greek invasion.<P>LITERATURE.<P>Rawlinson, History of Phoenicia; Kenrick, Phoenicia; Movers, Phonizier; Breasted, History of Egypt, and Ancient Records; Budge, History of Egypt; Rawlinson, Ancient Monarchies; Rogers, Babylonia and Assyria; Bevan, House of Seleucus; Tell el-Amarna Letters; Perrot and Chipiez, Art in Phoenicia.``138';
isbe[6919]='Phoenix`fe\'-niks (Phoinix; the King James Version Phenice): A harbor in Crete (<a onClick="return mV(\'Act\',27,12);">Ac 27:12</a>). The Alexandrian corn ship carrying Paul and the author of Acts, after it left Myra in Lycia, was prevented by adverse winds from holding a straight course to Italy, and sailed under the lee of Crete, off the promontory of Salmone (kata Salmonen). The ship was then able to make her way along the south shore of Crete to a harbor called Fair Havens (Kaloi Limenes), near a city Lasea (Lasaia). Thence, in spite of Paul\'s advice to winter in Fair Havens, it was decided to sail to Phoenix (eis Phoinika, limena tes Kretes) bleponta kata liba kai kata choron, a description which has been translated in two ways:<P>(1) "looking toward the southwest wind and toward the northwest wind, i.e. looking southwest and northwest";<P>(2) "looking down the southwest wind and down the northwest wind, i.e. looking northeast and southeast" On the way thither, they were struck by a wind from the northeast, called Euraquilo, and ran before it under the lee of an island, called Cauda or Clauda (Kauda (Codex Sinaiticus (corrected) and Codex Vaticanus and the Old Latin) or Klauda (Codex Sinaiticus and Codex Alexandrinus, etc.)) in <a onClick="return mV(\'Act\',27,\'7-17\');">Ac 27:7-17</a>. It will be convenient to discuss those places together. The following account is based on Smith\'s elaborate study in his Voyage and Shipwreck of Paul, which has been followed by all later writers.<P>The ship, when it left Myra was obviously making for Italy (Puteoli or Ostia) by the shortest route, round Cape Malea, but off Cnidus it encountered a northwest wind and had to sail for shelter under the lee of Crete. Salmone, now called Cape Sidero, was the promontory which forms the northeast corner of the island. Thence along the south shore of Crete, as far as Cape Matala, a sailing ship is sheltered by the mountains from the violence of the northwest wind; west of Cape Matala, where the coast turns toward the northwest, there is no such shelter. Fair Havens must therefore be looked for to the east of Cape Matala, and there is a harbor, lying 6 miles east of Cape Matala, which is called Fair Havens by the modern Greek inhabitants of the island. There is no doubt that this is the harbor in which the Alexandrian ship took shelter. It is sheltered only from the north and northwest winds.<P>The ruins of a city which has been identified with Lasea have been found 5 miles east from Fair Havens, and 12 miles south of the important city of Gortyna. It has been suggested that Paul\'s desire to winter at Fair Havens (<a onClick="return mV(\'Act\',27,10);">Ac 27:10</a>) may have been due to its proximity to Gortyna, and the opportunity which the latter city afforded for missionary work. There were many Jews in Gortyna.<P>See <a href="./study/isbe/search.html?string=CRETE">CRETE</a>.<P>From Fair Havens, against the advice of Paul, it was decided to sail to Phoenix, there to pass the winter. While the ship was on its way thither, it was struck by a violent northeast wind from the mountains, called Euraquilo, and carried under the lee of an islet called Cauda or Clauda. When this happened, the ship was evidently crossing the Bay of Messariah, and from this point a northeast wind must have carried her under the lee of an island now called Gaudho in Greek and Gozzo in Italian, situated about 23 miles southwest of the center of the Gulf of Messariah. The modern name of the island shows that Cauda (Caudas in the Notitiae Episcopatuum), and not Clauda is the true ancient form.<P>The writer of Acts never saw Phoenix, which must have been a good harbor, as the nautical experts decided to winter there (<a onClick="return mV(\'Act\',27,11);">Ac 27:11</a>). Now the only safe harbor on the south coast of Crete in which a ship large enough to carry a cargo of corn and 268 souls could moor is the harbor beside Loutro, a village on the south coast of Crete, directly north of Cauda. All the ancient authorities agree in placing Phoenix in this neighborhood. The harbor at Loutro affords shelter from all winds, and its identification with Phoenix seems certain. But a serious difficulty arises on this view. The words describing the harbor of Phoenix ordinarily mean "looking toward the southwest and the northwest," but the harbor beside Loutro looks eastward. This led Bishop Wordsworth to identify Phoenix with an open roadstead on the western side of the isthmus on which Loutro stands. But this roadstead is not a suitable place for wintering in, and it is better either to take the words to mean, in sailor\'s language, "looking down the southwest and northwest winds"—a description which exactly fits the harbor at Loutro—or to assume that the reporter of the discussion referred to in <a onClick="return mV(\'Act\',27,\'10-12\');">Ac 27:10-12</a> or the writer of Acts made a mistake in describing a place which he had never seen. An inscription belonging to the reign of Trajan found at Loutro shows that Egyptian corn ships were wont to lie up there for the winter.``20';
isbe[6920]='Phoros`fo\'-ros (Phoros; Codex Vaticanus (Swete) Phares (1Esdras 8:30, where the King James Version Pharez)): Name of one of the families, part of whom went up from the exile with Zerubbabel (1Esdras 5:9) and part with Ezra (<a onClick="return mV(\'Ezr\',8,30);">8:30</a> the Revised Version (British and American)) equals "Parosh" of <a onClick="return mV(\'Ezr\',2,3);">Ezr 2:3</a>; <a onClick="return mV(\'Ezr\',8,3);">8:3</a>, and some members of which had taken "strange wives" (1Esdras 9:26).``1';
isbe[6921]='Phrurai`fru\'-ri, fru\'-ra-i (Phrourai; also in Codex Sinaiticus and Codex Alexandrinus as Phrouraia and Phrourim; the King James Version Phurim): In Additions to Esther 11:1, "the epistle of Phrurai" means the preceding Book of Esther.`<a href="./study/isbe/search.html?string=PURIM">PURIM</a>`1';
isbe[6922]='Phrygia`frij\'-i-a (Phrugia): A large ancient country of Central Asia Minor, very mountainous and with table-lands reaching 4,000 ft. in height. Its name is derived from Phryges, a tribe from Thrace, which in early times invaded the country and drove out or absorbed the earlier Asiatic inhabitants, among whom were the Hittites. Thus, the Phrygians borrowed much of oriental civilization, especially of art and mythology which they transferred to Europe. To define the boundaries of Phrygia would be exceedingly difficult, for as in the case of other Asia Minor countries, they were always vague and they shifted with nearly every age. The entire country abounds with ruins of former cities and with almost countless rock-hewn tombs, some of which are of very great antiquity. Among the most interesting of the rock sculptures are the beautiful tombs of the kings bearing the names Midas and Gordius, with which classical tradition has made us familiar. It seems that at one period the country may have extended to the Hellespont, even including Troy, but later the Phrygians were driven toward the interior. In Roman times, however, when Paul journeyed there, the country was divided into two parts, one of which was known as Galatian Phrygia, and the other as Asian Phrygia, because it was a part of the Roman province of Asia, but the line between them was never sharply drawn. The Asian Phrygia was the larger of the two divisions, including the greater part of the older country; Galatian Phrygia was small, extending along the Pisidian Mountains, but among its important cities were Antioch, Iconium and Apollonia. About 295 AD, when the province of Asia was no longer kept together, its different parts were known as Phrygia Prima and Phrygia Secunda. That part of Asia Minor is now ruled by a Turkish wall or governor whose residence is in Konia, the ancient Iconium. The population consists not only of Turks, but of Greeks, Armenians, Jews, Kurds and many small tribes of uncertain ancestry, and of peculiar customs and religious practices. The people live mostly in small villages which are scattered throughout the picturesque country. Sheep and goat raising are the leading industries; brigandage is common. According to <a onClick="return mV(\'Act\',2,10);">Ac 2:10</a>, Jews from Phrygia went to Jerusalem, and in <a onClick="return mV(\'Act\',18,23);">Ac 18:23</a> we learn that many of them were influential and perhaps fanatical. According to <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>, Paul traversed the country while on his way from Lystra to Iconium and Antioch in Galatian Phrygia. Twice he entered Phrygia in Asia, but on his 2nd journey he was forbidden to preach there. Christianity was introduced into Phrygia by Paul and Barnabas, as we learn from <a onClick="return mV(\'Act\',13,4);">Ac 13:4</a>; <a onClick="return mV(\'Act\',16,\'1-6\');">16:1-6</a>; <a onClick="return mV(\'Act\',18,23);">18:23</a>, yet it did not spread there rapidly. Churches were later founded, perhaps by Timothy or by John, at Colosse, Laodicea and Hierapolis.``7';
