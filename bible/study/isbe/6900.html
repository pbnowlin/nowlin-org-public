isbe[6901]='Philippi`fi-lip\'-i (Philippoi, ethnic Philippesios, <a onClick="return mV(\'Phl\',4,15);">Php 4:15</a>):<P>1. Position and Name:<P>A city of Macedonia, situated in 41ø 5\' North latitude and 24ø 16\' East longitude. It lay on the Egnatian Road, 33 Roman miles from Amphipolis and 21 from Acontisma, in a plain bounded on the east and north by the mountains which lie between the rivers Zygactes and Nestus, on the west by Mt. Pangaeus, on the south by the ridge called in antiquity Symbolum, over which ran the road connecting the city with its seaport, <a href="./study/isbe/search.html?string=NEAPOLIS">NEAPOLIS</a> (which see), 9 miles distant. This plain, a considerable part of which is marshy in modern, as in ancient, times, is connected with the basin of the Strymon by the valley of the Angites (Herodotus vii.113), which also bore the names Gangas or Gangites (Appian, Bell. Civ. iv.106), the modern Anghista. The ancient name. of Philippi was Crenides (Strabo vii.331; Diodorus xvi.3, 8; Appian, Bell. Civ. iv.105; Stephanus Byz. under the word), so called after the springs which feed the river and the marsh; but it was refounded by Philip II of Macedon, the father of Alexander the Great, and received his name.<P>2. History:<P>Appian (Bell. Civ. iv.105) and Harpocration say that Crenides was afterward called Daton, and that this name was changed to Philippi, but this statement is open to question, since Daton, which became proverbial among the Greeks for good fortune, possessed, as Strabo tells us (vii. 331 fr. 36), "admirably fertile territory, a lake, rivers, dockyards and productive gold mines," whereas Philippi lies, as we have seen, some 9 miles inland. Many modern authorities, therefore, have placed Daton on the coast at or near the site of Neapolis. On the whole, it seems best to adopt the view of Heuzey (Mission archeologique,35,62ff) that Daton was not originally a city, but the whole district which lay immediately to the east of Mt. Pangaeus, including the Philippian plain and the seacoast about Neapolis. On the site of the old foundation of Crenides, from which the Greek settlers had perhaps been driven out by the Thracians about a century previously, the Thasians in 360 BC founded their colony of Daton with the aid of the exiled Athenian statesman Callistratus, in order to exploit the wealth, both agricultural and mineral, of the neighborhood. To Philip, who ascended the Macedonian throne in 359 BC, the possession of this spot seemed of the utmost importance. Not only is the plain itself well watered and of extraordinary fertility, but a strongly-fortified post planted here would secure the natural land-route from Europe to Asia and protect the eastern frontier of Macedonia against Thracian inroads. Above all, the mines of the district might meet his most pressing need, that of an abundant supply of gold. The site was therefore seized in 358 BC, the city was enlarged, strongly fortitled, and renamed, the Thasian settlers either driven out or reinforced, and the mines, worked with characteristic energy, produced over 1,000 talents a year (Diodorus xvi.8) and enabled Philip to issue a gold currency which in the West soon superseded the Persian darics (G.F. Hill, Historical Greek Coins, 80ff). The revenue thus obtained was of inestimable value to Philip, who not only used it for the development of the Macedonian army, but also proved himself a master of the art of bribery. His remark is well known that no fortress was impregnable to whose walls an ass laden with gold could be driven. Of the history of Philippi during the next 3 centuries we know practically nothing. Together with the rest of Macedonia, it passed into the Roman hands after the battle of Pydna (168 BC), and fell in the first of the four regions into which the country was then divided (Livy xlv.29). In 146 the whole of Macedonia was formed into a single Roman province. But the mines seem to have been almost, if not quite, exhausted by this time, and Strabo (vii. 331 fr. 41) speaks of Philippi as having sunk by the time of Caesar to a "small settlement" (katoikia mikra). In the autumn of 42 BC it witnessed the death-struggle of the Roman republic. Brutus and Cassius, the leaders of the band of conspirators who had assassinated Julius Caesar, were faced by Octavian, who 15 years later became the Emperor Augustus, and Antony. In the first engagement the army of Brutus defeated that of Octavian, while Antony\'s forces were victorious over those of Cassius, who in despair put an end to his life. Three weeks later the second and decisive conflict took place. Brutus was compelled by his impatient soldiery to give battle, his troops were routed and he himself fell on his own sword. Soon afterward Philippi was made a Roman colony with the title Colonia Iulia Philippensis. After the battle of Actium (31 BC) the colony was reinforced, largely by Italian partisans of Antony who were dispossessed in order to afford allotments for Octavian\'s veterans (Dio Cassius li.4), and its name was changed to Colonia Augusta Iulia (Victrix) Philippensium: It received the much-coveted iusItalicum (Digest L. 15,8,8), which involved numerous privileges, the chief of which was the immunity of its territory from taxation.<P>3. Paul\'s First Visit:<P>In the course of his second missionary journey Paul set sail from Troas, accompanied by Silas (who bears his full name Silvanus in <a onClick="return mV(\'2Cr\',1,19);">2Co 1:19</a>; <a onClick="return mV(\'1Th\',1,1);">1Th 1:1</a>; <a onClick="return mV(\'2Th\',1,1);">2Th 1:1</a>), Timothy and Luke, and on the following day reached Neapolis (<a onClick="return mV(\'Act\',16,11);">Ac 16:11</a>). Thence he journeyed by road to Philippi, first crossing the pass some 1,600 ft. high which leads over the mountain ridge called Symbolum and afterward traversing the Philipplan plain. Of his experiences there we have in <a onClick="return mV(\'Act\',16,\'12-40\');">Ac 16:12-40</a> a singularly full and graphic account. On the Sabbath, presumably the first Sabbath after their arrival, the apostle and his companions went out to the bank of the Angites, and there spoke to the women, some of them Jews, others proselytes, who had come together for purposes of worship.<P>One of these was named Lydia, a Greek proselyte from Thyatira, a city of Lydia in Asia Minor, to the church of which was addressed the message recorded in <a onClick="return mV(\'Rev\',2,\'18-29\');">Re 2:18-29</a>. She is described as a "seller of purple" (<a onClick="return mV(\'Act\',16,14);">Ac 16:14</a>), that is, of woolen fabrics dyed purple, for the manufacture of which her native town was famous. Whether she was the agent in Philippi of some firm in Thyatira or whether she was carrying on her trade independently, we cannot say; her name suggests the possibility that she was a freedwoman, while from the fact that we hear of her household and her house (<a onClick="return mV(\'Act\',16,15);">Ac 16:15</a>; compare <a onClick="return mV(\'Act\',16,40);">16:40</A>), though no mention is made of her husband, it has been conjectured that she was a widow of some property. She accepted the apostolic message and was baptized with her household (<a onClick="return mV(\'Act\',16,15);">Ac 16:15</a>), and insisted that Paul and his companions should accept her hospitality during the rest of their stay in the city.<P>See further <a href="./study/isbe/search.html?string=LYDIA">LYDIA</a>.<P>All seemed to be going well when opposition arose from an unexpected quarter. There was in the town a girl, in all probability a slave, who was reputed to have the power of oracular utterance. Herodotus tells us (vii. III) of an oracle of Dionysus situated among the Thracian tribe of the Satrae, probably not far from Philippi; but there is no reason to connect the soothsaying of this girl with that worship. In any case, her masters reaped a rich harvest from the fee charged for consulting her. Paul, troubled by her repeatedly following him and those with him crying, "These men are bondservants of the Most High God, who proclaim unto you a way of salvation" (<a onClick="return mV(\'Act\',16,17);">Ac 16:17</a> margin), turned and commanded the spirit in Christ\'s name to come out of her. The immediate restoration of the girl to a sane and normal condition convinced her masters that all prospect of further gain was gone, and they therefore seized Paul and Silas and dragged them into the forum before the magistrates, probably the duumviri who stood at the head of the colony. They accused the apostles of creating disturbance in the city and of advocating customs, the reception and practice of which were illegal for Roman citizens. The rabble of the market-place joined in the attack (<a onClick="return mV(\'Act\',16,22);">Ac 16:22</a>), whereupon the magistrates, accepting without question the accusers\' statement that Paul and Silas were Jews (<a onClick="return mV(\'Act\',16,20);">Ac 16:20</a>) and forgetting or ignoring the possibility of their possessing Roman citizenship, ordered them to be scourged by the attendant lictors and afterward to be imprisoned. In the prison they were treated with the utmost rigor; they were confined in the innermost ward, and their feet put in the stocks. About midnight, as they were engaged in praying and singing hymns, while the other prisoners were listening to them, the building was shaken by a severe earthquake which threw open the prison doors. The jailer, who was on the point of taking his own life, reassured by Paul regarding the safety of the prisoners, brought Paul and Silas into his house where he tended their wounds, set food before them, and, after hearing the gospel, was baptized together with his whole household (<a onClick="return mV(\'Act\',16,\'23-34\');">Ac 16:23-34</a>).<P>On the morrow the magistrates, thinking that by dismissing from the town those who had been the cause of the previous day\'s disturbance they could best secure themselves against any repetition of the disorder, sent the lictors to the jailer with orders to release them. Paul refused to accept a dismissal of this kind. As Roman citizens, he and Silas were legally exempt from scourging, which was regarded as a degradation (<a onClick="return mV(\'1Th\',2,2);">1Th 2:2</a>), and the wrong was aggravated by the publicity of the punishment, the absence of a proper trial and the imprisonment which followed (<a onClick="return mV(\'Act\',16,37);">Ac 16:37</a>). Doubtless Paul had declared his citizenship when the scourging was inflicted, but in the confusion and excitement of the moment his protest had been unheard or unheeded. Now, however, it produced a deep impression on the magistrates, who came in person to ask Paul and Silas to leave the city. They, after visiting their hostess and encouraging the converts to remain firm in their new faith, set out by the Egnatian Road for Thessalonica (<a onClick="return mV(\'Act\',16,\'38-40\');">Ac 16:38-40</a>). How long they had stayed in Philippi we are not told, but the fact that the foundations of a strong and flourishing church had been laid and the phrase "for many days" (<a onClick="return mV(\'Act\',16,18);">Ac 16:18</a>) lead us to believe that the time must have been a longer one than appears at first sight. Ramsay (St. Paul the Traveler, 226) thinks that Paul left Troas in October, 50 AD, and stayed at Philippi until nearly the end of the year; but this chronology cannot be regarded as certain.<P>Several points in the narrative of these incidents call for fuller consideration.<P>(1) We may notice, first, the very small part played by Jews and Judaism at Philippi.<P>There was no synagogue here, as at Salamis in Cyprus (<a onClick="return mV(\'Act\',13,5);">Ac 13:5</a>), Antioch in Pisidia (<a onClick="return mV(\'Act\',13,14,43);">Ac 13:14,43</a>), Iconium (<a onClick="return mV(\'Act\',14,1);">Ac 14:1</a>), Ephesus (<a onClick="return mV(\'Act\',18,19,26);">Ac 18:19,26</a>; <a onClick="return mV(\'Act\',19,8);">19:8</a>), Thessalonica (<a onClick="return mV(\'Act\',17,1);">Ac 17:1</a>), Berea (<a onClick="return mV(\'Act\',17,10);">Ac 17:10</a>), Athens (<a onClick="return mV(\'Act\',17,17);">Ac 17:17</a>) and Corinth (<a onClick="return mV(\'Act\',18,4);">Ac 18:4</a>). The number of resident Jews was small, their meetings for prayer took place on the river\'s bank, the worshippers were mostly or wholly women (<a onClick="return mV(\'Act\',16,13);">Ac 16:13</a>), and among them some, perhaps a majority, were proselytes. Of Jewish converts we hear nothing, nor is there any word of Jews as either inciting or joining the mob which dragged Paul and Silas before the magistrates. Further, the whole tone of the epistle. to this church seems to prove that here at least the apostolic teaching was not in danger of being undermined by Judaizers. True, there is one passage (<a onClick="return mV(\'Phl\',3,\'2-7\');">Php 3:2-7</a>) in which Paul denounces "the concision," those who had "confidence in the flesh"; but it seems "that in this warning he was thinking of Rome more than of Philippi; and that his indignation was aroused rather by the vexatious antagonism which there thwarted him in his daily work, than by any actual errors already undermining the faith of his distant converts" (Lightfoot).<P>(2) Even more striking is the prominence of the Roman element in the narrative. We are here not in a Greek or Jewish city, but in one of those Roman colonies which Aulus Gellius describes as "miniatures and pictures of the Roman people" (Noctes Atticae, xvi.13).<P>In the center of the city is the forum (agora, <a onClick="return mV(\'Act\',16,19);">Ac 16:19</a>), and the general term "magistrates" (archontes, English Versions of the Bible, "rulers," <a onClick="return mV(\'Act\',16,19);">Ac 16:19</a>) is exchanged for the specific title of praetors (stratagoi, English Versions of the Bible "magistrates," <a onClick="return mV(\'Act\',16,20,22,35,36,38);">Ac 16:20,22,35,36,38</a>); these officers are attended by lictors (rhabdouchoi, English Versions "sergeants," <a onClick="return mV(\'Act\',16,35,38);">Ac 16:35,38</a>) who bear the fasces with which they scourged Paul and Silas (rhabdizo, <a onClick="return mV(\'Act\',16,22);">Ac 16:22</a>). The charge is that of disturbing public order and introducing customs opposed to Roman law (<a onClick="return mV(\'Act\',16,20,21);">Ac 16:20,21</a>), and Paul\'s appeal to his Roman civitas (<a onClick="return mV(\'Act\',16,37);">Ac 16:37</a>) at once inspired the magistrates with fear for the consequences of their action and made them conciliatory and apologetic (<a onClick="return mV(\'Act\',16,38,39);">Ac 16:38,39</a>). The title of praetor borne by these officials has caused some difficulty. The supreme magistrates of Roman colonies, two in number, were called duoviri or duumviri (iuri dicundo), and that this title was in use at Philippi is proved by three inscriptions (Orelli, Number 3746; Heuzey, Mission archeologique, 15, 127). The most probable explanation of the discrepancy is that these magistrates assumed the title Of praetor, or that it was commonly applied to them, as was certainly the case in some parts of the Roman world (Cicero De lege agraria ii.34; Horace Sat. i.5, 34; Orelli, Number 3785).<P>(3) Ramsay (St. Paul the Traveler, 200ff) has brought forward the attractive suggestion that Luke was himself a Philippian, and that he was the "man of Macedonia" who appeared to Paul at Troas with the invitation to enter Macedonia (<a onClick="return mV(\'Act\',16,9);">Ac 16:9</a>).<P>In any case, the change from the 3rd to the 1st person in <a onClick="return mV(\'Act\',16,10);">Ac 16:10</a> marks the point at which Luke joined the apostle, and the same criterion leads to the conclusion that Luke remained at Philippi between Paul\'s first and his third visit to the city (see below). Ramsay\'s hypothesis would explain (a) the fullness and vividness of the narrative of <a onClick="return mV(\'Act\',16,\'11-40\');">Ac 16:11-40</a>; (b) the emphasis laid on the importance of Philippi (<a onClick="return mV(\'Act\',16,12);">16:12</A>); and (c) the fact that Paul recognized as a Macedonian the man whom he saw in his vision, although there was nothing either in the language, features or dress of Macedonians to mark them out from other Greeks. Yet Luke was clearly not a householder at Philippi (<a onClick="return mV(\'Act\',16,15);">Ac 16:15</a>), and early tradition refers to him as an Antiochene (see, however, Ramsay, in the work quoted 389f).<P>(4) Much discussion has centered round the description of Philippi given in <a onClick="return mV(\'Act\',16,12);">Ac 16:12</a>. The reading of Codices Sinaiticus, Alexandrinus, Ephraemi, etc., followed by Westcott and Hort, The New Testament in Greek, the Revised Version (British and American), etc., is: hetis estin prote tes meridos Makedonias polis kolonia. But it is doubtful whether Makedonias is to be taken with the word which precedes or with that which follows, and further the sense derived from the phrase is unsatisfactory. For prote must mean either<P>(1) first in political importance and rank, or<P>(2) the first which the apostle reached. But the capital of the province was Thessalonica, and if tes meridos be taken to refer to the easternmost of the 4 districts into which Macedonia had been divided in 168 BC (though there is no evidence that that division survived at this time), Amphipolis was its capital and was apparently still its most important city, though destined to be outstripped by Philippi somewhat later. Nor is the other rendering of prote (adopted, e.g. by Lightfoot) more natural.<P>It supposes that Luke reckoned Neapolis as belonging to Thrace, and the boundary of Macedonia as lying between Philippi and its seaport; moreover, the remark is singularly pointless; the use of estin rather than en is against this view, nor is prote found in this sense without any qualifying phrase. Lastly, the tes in its present position is unnatural; in Codex Vaticanus it is placed after, instead of before, meridos, while D (the Bezan reviser) reads kephale tes Makedonias. Of the emendations which have been suggested, we may notice three:<P>(a) for meridos Hort has suggested Pieridos, "a chief city of Pierian Macedonia";<P>(b) for prote tes we may read protes, "which belongs to the first region of Macedonia";<P>(c) meridos may be regarded as a later insertion and struck out of the text, in which case the whole phrase will mean, "which is a city of Macedonia of first rank" (though not necessarily the first city).<P>4. Paul\'s Later Visits:<P>Paul and Silas, then, probably accompanied by Timothy (who, however, is not expressly mentioned in Acts between <a onClick="return mV(\'Act\',16,1);">16:1</A> and <a onClick="return mV(\'Act\',17,14);">17:14</a>), left Philippi for Thessalonica, but Luke apparently remained behind, for the "we" of <a onClick="return mV(\'Act\',16,\'10-17\');">Ac 16:10-17</a> does not appear again until <a onClick="return mV(\'Act\',20,5);">20:5</A>, when Paul is once more leaving Philippi on his last journey to Jerusalem. The presence of the evangelist during the intervening 5 years may have had much to do with the strength of the Philippian church and its stealfastness in persecution (<a onClick="return mV(\'2Cr\',8,2);">2Co 8:2</a>; <a onClick="return mV(\'Phl\',1,29,30);">Php 1:29,30</a>). Paul himself did not revisit the city until, in the course of his third missionary journey, he returned to Macedonia, preceded by Timothy and Erastus, after a stay of over 2 years at Ephesus (<a onClick="return mV(\'Act\',19,22);">Ac 19:22</a>; <a onClick="return mV(\'Act\',20,1);">20:1</a>). We are not definitely told that he visited Philippi on this occasion, but of the fact there can be little doubt, and it was probably there that he awaited the coming of Titus (<a onClick="return mV(\'2Cr\',2,13);">2Co 2:13</a>; <a onClick="return mV(\'2Cr\',7,5,6);">7:5,6</a>) and wrote his 2nd Epistle to the Corinthians (<a onClick="return mV(\'2Cr\',8,1);">2Co 8:1</a>ff; <a onClick="return mV(\'2Cr\',9,2,3,4);">9:2-4</a>). After spending 3 months in Greece, whence he intended to return by sea to Syria, he was led by a plot against his life to change his plans and return through Macedonia (<a onClick="return mV(\'Act\',20,3);">Ac 20:3</a>). The last place at which he stopped before crossing to Asia was Philippi, where he spent the days of unleavened bread, and from (the seaport of) which he sailed in company with Luke to Troas where seven of his companions were awaiting him (<a onClick="return mV(\'Act\',20,\'4-6\');">Ac 20:4-6</a>). It seems likely that Paul paid at least one further visit to Philippi in the interval between his first and second imprisonments. That he hoped to do so, he himself tells us (<a onClick="return mV(\'Phl\',2,24);">Php 2:24</a>), and the journey to Macedonia mentioned in <a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a> would probably include a visit to Philippi, while if, as many authorities hold, <a onClick="return mV(\'2Ti\',4,13);">2Ti 4:13</a> refers to a later stay at Troas, it may well be connected with a further and final tour in Macedonia. But the intercourse between the apostle and this church of his founding was not limited to these rare visits. During Paul\'s first stay at Thessalonica he had received gifts of money on two occasions from the Philippian Christians (<a onClick="return mV(\'Phl\',4,16);">Php 4:16</a>), and their kindness had been repeated after he left Macedonia for Greece (<a onClick="return mV(\'2Cr\',11,9);">2Co 11:9</a>; <a onClick="return mV(\'Phl\',4,15);">Php 4:15</a>). Again, during his first imprisonment at Rome the Philippians sent a gift by the hand of one of their number, Epaphroditus (<a onClick="return mV(\'Phl\',2,25);">Php 2:25</a>; <a onClick="return mV(\'Phl\',4,10,\14-19\');">4:10,14-19</a>), who remained for some time with the apostle, and finally, after a serious illness which nearly proved fatal (<a onClick="return mV(\'Phl\',2,27);">Php 2:27</a>), returned home bearing the letter of thanks which has survived, addressed to the Philippian converts by Paul and Timothy (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>). The latter intended to visit the church shortly afterward in order to bring back to the imprisoned apostle an account of its welfare (<a onClick="return mV(\'Phl\',2,19,23);">Php 2:19,23</a>), but we do not know whether this plan was actually carried out or not. We cannot, however, doubt that other letters passed between Paul and this church besides the one which is extant, though the only reference to them is a disputed passage of Polycarp\'s Epistle to the Philippians (iii.2), where he speaks of "letters" (epistolai) as written to them by Paul (but see Lightfoot\'s note on <a onClick="return mV(\'Phl\',3,1);">Php 3:1</a>).<P>5. Later History of the Church:<P>After the death of Paul we hear but little of the church or of the town of Philippi. Early in the 2nd century Ignatius, bishop of Antioch, was condemned as a Christian and was taken to Rome to be thrown to the wild beasts. After passing through Philadelphia, Smyrna and Troas, he reached Philippi. The Christians there showed him every mark of affection and respect, and after his departure wrote a letter of sympathy to the Antiochene church and another to Polycarp, bishop of Smyrna, requesting him to send them copies of any letters of Ignatius which he possessed. This request Polycarp fulfilled, and at the same time sent a letter to the Philippians full of encouragement, advice and warning. From it we judge that the condition of the church as a whole was satisfactory, though a certain presbyter, Valens, and his wife are severely censured for their avarice which belied their Christian profession. We have a few records of bishops of Philippi, whose names are appended to the decisions of the councils held at Sardica (344 AD), Ephesus (431) and Chalcedon (451), and the see appears to have outlived the city itself and to have lasted down to modern times (Le Quien, Oriens Christ., II, 70; Neale, Holy Eastern Church, I, 92). Of the destruction of Philippi no account has come down to us. The name was perpetuated in that of the Turkish hamlet Felibedjik, but the site is now uninhabited, the nearest village being that of Raktcha among the hills immediately to the north of the ancient acropolis. This latter and the plain around are covered with ruins, but no systematic excavation has yet been undertaken. Of the extant remains the most striking are portions of the Hellenic and Hellenistic fortification, the scanty vestiges of theater, the ruin known among the Turks as Derekler, "the columns," which perhaps represents the ancient thermae, traces of a temple of Silvanus with numerous rock-cut reliefs and inscriptions, and the remains of a triumphal arch (Kiemer).<P>LITERATURE.<P>The fullest account of the site and antiquities is that of Heuzey and Daumet, Mission archeologique de Macedoine, chapters i through v and Plan A; Leake, Travels in Northern Greece, III, 214-25; Cousinery, Voyage dana la Macedoine, II, 1ff; Perrot, "Daton. Neapolis. Les ruines de Philippos," in Revue archeologique, 1860; and Hackett, in Bible Union Quarterly,1860,may also be consulted. For the Latin inscriptions see Corpus Inscriptionum Latinarum, III, 1, numbers 633-707; III, Suppl., numbers 7337-7358; for coins, B.V. Head, Historia Numorum, 192; Catalogue of Coins in the British Museum: Macedonia, etc., 96. For the history of the Philippian church and the narrative of <a onClick="return mV(\'Act\',16,\'12-40\');">Ac 16:12-40</a> see Lightfoot, Paul\'s Epistle to the Philippians, 47-65; Ramsay, Paul the Traveler and the Roman Citizen, 202-26; Conybeare and Howson, Life and Epistles of Paul, chapter ix; Farrar, Life and Work of Paul, chapter xxv; and the standard commentaries on the Acts—especially Blass, Acta Apostolorum—and on Philippians.``176';
isbe[6902]='Philippians, the Epistle to the`fi-lip\'-i-anz<P><b>I. PAUL AND THE CHURCH AT PHILIPPI</b><P><b>II. CHARACTERISTICS OF THE CHURCH AT PHILIPPI</b><P><b>III. CHARACTERISTICS OF THE EPISTLE</b><P class="in15">1. A Letter<P class="in15">2. A Letter of Love<P class="in15">3. A Letter of Joy<P class="in15">4. Importance Theologically<P><p>IV. GENUINENESS OF THE EPISTLE</b><P><b>V. PLACE, DATE AND OCCASION OF WRITING</b><P><b>VI. CONTENTS OF THE EPISTLE</b><P><b>LITERATURE</b><hr /><P>I. Paul and the Church at Philippi.<P>Paul was on his second missionary journey in the year 52 AD. He felt that he was strangely thwarted in many of his plans. He had had a most distressing illness in Galatia. The Spirit would not permit him to preach in Asia, and when he essayed to enter Bithynia the Spirit again would not suffer it. Baffled and perplexed, the apostle with his two companions, Silas and Timothy, went on to the seacoast and stopped in Troas. Here at last his leading became clear. A vision of a man from Macedonia convinced him that it was the will of God that he should preach in the western continent of Europe. The way was opened at once. The winds were favorable. In two days he came to Neapolis. At once he took the broad paved way of the Via Egnatia up to the mountain pass and down on the other side to Philippi, a journey of some 8 miles. There was no synagogue at Philippi, but a little company of Jews gathered for Sabbath worship at "a place of prayer" (proseuche, <a onClick="return mV(\'Act\',16,13);">Ac 16:13</a>), about a mile to the west of the city gate on the shore of the river Gangites (see <a href="./study/isbe/search.html?string=PROSEUCHA">PROSEUCHA</a>). Paul and his companions talked to the women gathered there, and Lydia was converted. Later, a maid with the spirit of divination was exorcised. Paul and Silas were scourged and thrown into prison, an earthquake set them free, the jailer became a believer, the magistrates repented their treatment of men who were Roman citizens and besought them to leave the city (<a onClick="return mV(\'Act\',16,\'6-40\');">Ac 16:6-40</a>). Paul had had his first experience of a Roman scourging and of lying in the stocks of a Roman prison here at Philippi, yet he went on his way rejoicing, for a company of disciples had been formed, and he had won the devotion of loyal and loving hearts for himself and his Master (see <a href="./study/isbe/search.html?string=PHILIPPI">PHILIPPI</a>). That was worth all the persecution and the pain. The Christians at Philippi seem to have been Paul\'s favorites among all his converts. He never lost any opportunity of visiting them and refreshing his spirit with their presence in the after-years. Six years later he was resident in Ephesus, and having sent Titus to Corinth with a letter to the Corinthians and being in doubt as to the spirit in which it would be received, he appointed a meeting with Titus in Macedonia, and probably spent the anxious days of his waiting at Philippi. If he met Titus there, he may have written 2 Corinthians in that city (<a onClick="return mV(\'2Cr\',2,13);">2Co 2:13</a>; <a onClick="return mV(\'2Cr\',7,6);">7:6</a>). Paul returned to Ephesus, and after the riot in that city he went over again into Macedonia and made his third visit to Philippi. He probably promised the Philippians at this time that he would return to Philippi to celebrate the Easter week with his beloved converts there. He went on into Greece, but in 3 months he was back again, at the festival of the resurrection in the year 58 AD (<a onClick="return mV(\'Act\',20,2,6);">Ac 20:2,6</a>). We read in <a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a> that Paul visited Macedonia after the Roman imprisonment. He enjoyed himself among the Philippians. They were Christians after his own heart. He thanks God for their fellowship from the first day until now (<a onClick="return mV(\'Phl\',1,5);">Php 1:5</a>). He declares that they are his beloved who have always obeyed, not in his presence only, but much more in his absence (<a onClick="return mV(\'Phl\',2,12);">Php 2:12</a>). With fond repetition he addresses them as his brethren, beloved and longed for, his joy and crown, his beloved (<a onClick="return mV(\'Phl\',4,1);">Php 4:1</a>). This was Paul\'s favorite church, and we can gather from the epistle good reason for this fact.<P>II. Characteristics of the Church at Philippi.<P>(1) It seems to be the least Jewish of all the Pauline churches. There were few Jews in Philippi. No Hebrew names are found in the list of converts in this church mentioned in the New Testament. The Jewish opponents of Paul seem never to have established themselves in this community.<P>(2) Women seem to be unusually prominent in the history of this church, and this is consistent with what we know concerning the position accorded to woman in Macedonian society. Lydia brings her whole family with her into the church. She must have been a very influential woman, and her own fervor and devotion and generosity and hospitality seem to have been contagious and to have become characteristic of the whole Christian community. Euodia and Syntyche are mentioned in the epistle, two women who were fellow-laborers with Paul in the gospel, for both of whom he has great respect, of both of whom he is sure that their names are written in the book of life, but who seem to have differed with each other in some matter of opinion. Paul exhorts them to be of the same mind in the Lord (<a onClick="return mV(\'Phl\',4,2);">Php 4:2</a>). The prominence of women in the congregation at Philippi or the dominance of Lydia\'s influence among them may account for the fact that they seem to have been more mindful of Paul\'s comfort than any of his other converts were. They raised money for Paul\'s support and forwarded it to him again and again. They were anxious that he should have all that was needful. They were willing to give of their time and their means to that end. There seem to have been no theological differences in their company. That may testify to the fact that the most of them were women.<P>(3) There were splendid men in the church membership too. Some of them were Macedonians and some of them were Roman veterans.<P>Hausrath declares that the Macedonians represented the "noblest and soundest part of the ancient world....Here was none of the shuffling and the indecision of the Asiatics, none of the irritable vanity and the uncertain levity of the Greek communities....They were men of sterner mold than could be fouund in Asia Minor or languorous Syria. The material was harder to work in, and offered more stubborn resistance; but the work, once done, endured. A new Macedonian phalanx was formed here, a phalanx of Pauline Christians....Manliness, loyalty, firmness, their characteristics in general history, are equally their characteristics in the history of the Christian church....They were always true to Paul, always obedient, always helpful" (Time of the Apostles, III, 203-4).<P>Paul rejoiced in them. They were spirits congenial with his own. The Roman veterans had been trained in the Roman wars to hardness and discipline and loyalty. They were Roman citizens and proud of the fact. In the epistle Paul exhorts them to behave as citizens worthy of the gospel of Christ (<a onClick="return mV(\'Phl\',1,27);">Php 1:27</a>), and he reminds them that though they were proud of their Roman citizenship, as was he, they all had become members of a heavenly commonwealth, citizenship in which was a much greater boon than even the jus Italicum had been. In <a onClick="return mV(\'Phl\',3,20);">Php 3:20</a> Paul states the fact again, "Our citizenship is in heaven"; and he goes on to remind them that their King is seated there upon the throne and that He is coming again to establish a glorious empire, for He has power to subject all things unto Himself.<P>It is to these old soldiers and athletes that Paul addresses his military and gymnastic figures of speech. He informs them that the whole praetorian guard had heard of the gospel through his imprisonment at Rome (<a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>). He sends them greeting from the saints that are in Caesar\'s household (<a onClick="return mV(\'Phl\',4,22);">Php 4:22</a>). He prays that he may hear of them that they stand fast like an immovable phalanx, with one soul striving athletically for the faith of the gospel (<a onClick="return mV(\'Phl\',1,27);">Php 1:27</a>). He knows that they will be fearless and brave, in nothing affrighted by the adversaries (<a onClick="return mV(\'Phl\',1,28);">Php 1:28</a>). He speaks of his own experience as a wrestling-match, a conflict or contest (<a onClick="return mV(\'Phl\',1,30);">Php 1:30</a>). He joys in the sacrifice and service of their faith (<a onClick="return mV(\'Phl\',2,17);">Php 2:17</a>). He calls Epaphroditus not only his fellow-worker but his fellow-soldier (<a onClick="return mV(\'Phl\',2,25);">Php 2:25</a>). He likens the Christian life to a race in which he presses on toward the goal unto the prize (<a onClick="return mV(\'Phl\',3,14);">Php 3:14</a>). He asks the Philippians to keep even, soldierly step with him in the Christian walk (<a onClick="return mV(\'Phl\',3,16);">Php 3:16</a>). These metaphors have their appeal to an athletic and military race, and they bear their testimony to the high regard which Paul had for this type of Christianity and for those in whose lives it was displayed. We do not know the names of many of these men, for only Clement and Epaphroditus are mentioned here; but we gather much concerning their spirit from this epistle, and we are as sure as Paul himself that their names are all written in the book of life (<a onClick="return mV(\'Phl\',4,3);">Php 4:3</a>).<P>(4) If the constituent elements of the church at Philippi fairly represented the various elements of the population of the city, they must have been cosmopolitan in character. Philippi was an old Macedonian city which had been turned into a Roman colony. It was both Greek and Roman in its characteristics. Christianity had been introduced here by two Jews, who were Roman citizens, and a Jewish son of a Gentile father. In the account given of the rounding of the church in <a onClick="return mV(\'Act\',16,\'1-\');">Ac 16</a> three converts are mentioned, and one is a Jewish proselyte from Asia, one a native Greek, and one a Roman official. The later converts doubtless represented the same diversity of nationality and the same differences in social position. Yet, apart from those two good women, Euodia and Syntyche, they were all of one mind in the Lord. It is a remarkable proof of the fact that in Christ all racial and social conditions may be brought into harmony and made to live together in peace. (5) They were a very liberal people. They gave themselves to the Lord and to Paul (<a onClick="return mV(\'2Cr\',8,5);">2Co 8:5</a>), and whenever they could help Paul or further the work of the gospel they gave gladly and willingly and up to the limit of their resources; and then they hypothecated their credit and gave beyond their power (<a onClick="return mV(\'2Cr\',8,3);">2Co 8:3</a>). Even Paul was astonished at their giving. He declares that they gave out of much affliction and deep poverty, that they abounded in their bounty, and that they were rich only in their liberality (<a onClick="return mV(\'2Cr\',8,2);">2Co 8:2</a>).<P>Surely these are unusual encomiums. The Philippians must have been a very unusual people. If the depth of one\'s consecration and the reality of one\'s religion are to be measured by the extent to which they affect the disposition of one\'s material possessions, if one measure of Christian love is to be found in Christian giving, then the Philippians may well stand supreme among the saints in the Pauline churches. Paul seems to have loved them most. He loved them enough to allow them to contribute toward his support. Elsewhere he refused any help of this sort, and stedfastly adhered to his plan of self-support while he was preaching the gospel. He made the single exception in the case of the Philippians. He must have been sure of their affection and of their confidence. Four times they gave Paul pecuniary aid. Twice they sent him their contributions just after he had left them and gone on to Thessalonica (<a onClick="return mV(\'Phl\',4,15,16);">Php 4:15,16</a>). When Paul had proceeded to Corinth and was in want during his ministry there his heart was gladdened by the visitation of brethren from Philippi, who supplied the measure of his want (<a onClick="return mV(\'2Cr\',11,8,9);">2Co 11:8,9</a>). It was not a first enthusiasm, forgotten as soon as the engaging personality of the apostle was removed from their sight. It was not merely a personal attachment that prompted their gifts. They gave to their own dear apostle, but only that he might minister to others as he had ministered to them. He was their living link with the work in the mission field.<P>Eleven years passed by, and the Philippians heard that Paul was in prison at Rome and again in need of their help. Eleven years are enough to make quite radical changes in a church membership, but there seems to have been no change in the loyalty or the liberality of the Philippian church in that time. The Philippians hastened to send Epaphroditus to Rome with their contributions and their greetings. It was like a bouquet of fresh flowers in the prison cell. Paul writes this epistle to thank them that their thought for him had blossomed afresh at the first opportunity they had had (<a onClick="return mV(\'Phl\',4,10);">Php 4:10</a>). No wonder that Paul loved them and was proud of them and made their earnestness and sincerity and affection the standard of comparison with the love of others (<a onClick="return mV(\'2Cr\',8,8);">2Co 8:8</a>).<P>III. Characteristics of the Epistle.<P>1. A Letter:<P>It is a letter. It is not a treatise, as Romana, Hebrews, and 1 John are. It is not an encyclical full of general observations and exhortations capable of application at any time and anywhere, as the Epistle to the Ephesians and the Epistle of James and the Epistles of Peter are. It is a simple letter to personal friends. It has no theological discussions and no rigid outline and no formal development. It rambles along just as any real letter would with personal news and personal feelings and outbursts of personal affection between tried friends. It is the most spontaneous and unaffected of the Pauline Epistles. It is more epistolary than any of the others addressed to the churches.<P>2. A Letter of Love:<P>It is a letter of love. All of the other epistles have mixed feelings manifest in them. Sometimes a feeling of grief and of indignation is dominant, as in 2 Corinthians. Sometimes the uppermost desire of Paul in his writing seems to be the establishment of the truth against the assault of its foes, as in Galatians and Romans. Always more or less fault is suggested in the recipients of the warnings and the exhortations Paul feels compelled to write to them. In Philippi alone there is no fault to be found. The only suggestion of such a thing is in the reference to the difference of opinion between Euodia and Syntyche, and while Paul thinks this ought to be harmonized, he does not seem to consider it any very serious menace to the peace of the church. Aside from this Paul has nothing but praise for his beloved brethren and prayer that their love may abound yet more and more in knowledge and all discernment (<a onClick="return mV(\'Phl\',1,9);">Php 1:9</a>). He is full of thankfulness upon all his remembrance of them (<a onClick="return mV(\'Phl\',1,3);">Php 1:3</a>). He rejoices in the privilege of being offered upon the sacrifice and service of their faith (<a onClick="return mV(\'Phl\',2,17);">Php 2:17</a>). The church at Philippi may not have been conspicuous in charisms as the church at Corinth was, but it had the fruits of the Spirit in rich measure. Paul seems to think that it needed only to rejoice in its spiritual possessions and to grow in grace and in the mind of Christ. His heart is full of gratitude and love as he writes. He rejoices as he thinks of them. His peace and his hope are triumphant over present affliction and the prospect of persecution and death. If this is his last will and testament to his beloved church, as Holtzmann calls it, he has nothing to bequeath them but his unqualified benediction. Having loved them from the first, he loves them to the end.<P>3. A Letter of Joy:<P>It is a letter of joy. It was Bengel who said, Summa epistolae: gaudeo, gaudete, "The sum of the epistle is, I rejoice; rejoice ye." Paul was a man whose spirits were undaunted in any circumstances. He might be scourged in one city and stoned in another and imprisoned in a third and left for dead in a fourth, but as long as he retained consciousness and as soon as he regained conscioushess he rejoiced. Nothing could dampen his ardor. Nothing could disturb his peace. In Philippi he had been scourged and cast into the inner prison and his feet had been made fast in the stocks, but at midnight he and Silas were singing hymns of praise to God. He is in prison now in Rome, but he is still rejoicing. Some men would have been discouraged in such circumstances. Wherever Paul had gone his preaching had been despised, and he had been persecuted. The Jews had slandered him and harassed him, and so many of his converts had proved to be fickle and false. The years had gone by and the breach between him and his brethren had widened rather than lessened, and at last they had succeeded in getting him into prison and keeping him there for years. Prison life is never pleasant, and it was far less so in that ancient day than it is now.<P>Paul was such an ardent spirit. It was more difficult for him to be confined than it would be for a more indolent man; He was a world-missionary, a restless cosmopolite ranging up and down through the continents with the message of the Christ. It was like putting an eagle into a cage to put him into prison. Many eagles mope and die in imprisonment. Paul was not moping. He was writing this Epistle to the Philippians and saying to them, "The things which happened unto me have fallen out rather unto the progress of the gospel...therein I rejoice, yea, and will rejoice" (<a onClick="return mV(\'Phl\',1,12,18);">Php 1:12,18</a>). His enemies were free to do and to say hat they pleased, and they were making the most of the opportunity. He could no longer thwart or hinder them. Some men would have broken out into loud lamentations and complaints. Some men would have worried about the conditions and would have become nervous about the outcome of the cause. The faith of even John the Baptist failed in prison. He could not believe that things were going right if he were not there to attend to them. Paul\'s faith never wavered. His hope never waned. His joy was inexhaustible and perennial. He was never anxious. Did he hear the sentry\'s step pacing up and down the corridor before his prison door? It reminded him of the peace of God which passeth all understanding, guarding his heart and his thoughts in Christ Jesus (<a onClick="return mV(\'Phl\',4,7);">Php 4:7</a>), standing sentry there night and day. The keynote of this epistle is "Rejoice in the Lord always: again I will say, Rejoice" (<a onClick="return mV(\'Phl\',4,4);">Php 4:4</a>).<P>Paul is old and worn and in prison, but some 20 times in the course of this short letter to the Philippians he uses the words, joy, rejoice, peace, content, and thanksgiving. It is a letter full of love and full of joy.<P>4. Importance Theologically:<P>It is of great importance theologically. It is one of the paradoxes to which we become almost accustomed in Paul\'s writings that this simplest of his letters, most epistolary and most personal throughout should yet contain the fullest and most important putting of theology of the incarnation and exaltation that came from his pen. He has only a practical end in view. He is exhorting the Philippians to humility, and he says to them, Have the mind which was in Christ who emptied himself and then was exalted (<a onClick="return mV(\'Phl\',2,\'5-11\');">Php 2:5-11</a>). It is the most theological passage in the epistle. It is one of the most doctrinally important in the New Testament. It is Paul\'s final contribution to the solution of the great mystery of the coming of the Saviour and the economy of salvation. It is his last word, at any length, on this subject. He states plainly the fact of the kenosis, the morale of the redemption, the certainty of the exaltation, and the sure hope of the universal adoration in the end. The most vital truths of Christology are here clearly stated and definitely formulated for all time. Jesus was a real man, not grasping at any of the attributes of Deity which would be inconsistent with real and true humanity, but in whole-hearted surrender of sacrifice submitting to all the disabilities and limitations necessary to the incarnate conditions. He was equal with God, but He emptied Himself of the omnipotence and the omniscience and the omnipresence of His pre-incarnate state, and was found in form as a man, a genuine man obedient to God in all His life. He always maintained that attitude toward God which we ought to maintain and which we can maintain in our humanity, in which He was on an equality with us. We ought to have the mind which was in Christ. He humbled Himself and became obedient. He was obedient through life and obedient unto death, yea, even unto the death of the cross. It is a great passage, setting forth profoundest truths in the tersest manner. It is the crowning revelation concerning Jesus in the Pauline Epistles. It represents Paul\'s most mature thought upon this theme.<P>See <a href="./study/isbe/search.html?string=KENOSIS">KENOSIS</a>.<P>IV. Genuineness of the Epistle.<P>The genuineness of the epistle is very generally admitted today. It was in the Canon of Marcion. Its name occurs in the list on the Muratorian Fragment. It is found in both the Peshitta and the Old Latin versions. It is mentioned by Polycarp and quoted in the letter of the churches of Lyons and Vienne, in the Epistle of Diognetus, and in the writings of Irenaeus and Clement of Alexandria. Baur made a determined attack upon its authenticity. He declared that it was not doctrinal and polemical like the other Pauline Epistles, but that it was full of shallow imitations of these. He said it had no apparent motive and no connected argument and no depth of thought. He questioned some of the historical data and suspected Gnostic influence in certain passages. Bleek said of Baur\'s arguments that they were partly derived from a perverted interpretation of certain passages in the epistle; they partly rested upon arbitrary istorical presuppositions; and some of them were really so weak that it was hard to believe that he could have attached any importance to them himself. It is not surprising that few critics have been found willing to follow Baur\'s leadership at this point. Biederman, Kneucker, Hinsch, Hitzig, Hoekstra, and Holsten may be mentioned among them. The genuineness of the epistle has been defended by Weizsacker, Weiss, Pfleiderer, Julicher, Klopper, Schenkel, Reuss, Hilgenfeld, Harnack, Holtzmann, Mangold, Lipsius, Renan, Godet, Zahn, Davidson, Lightfoot, Farrar, McGiffert, and practically all of the English writers on the subject. Weizsacker says that the reasons for attributing the epistle to the apostle Paul are "overwhelming." McGiffert declares: "It is simply inconceivable that anyone else would or could have produced in his name a letter in which no doctrinal or ecclesiastical motive can be discovered, and in which the personal element so largely predominates and the character of the man and the apostle is revealed with so great vividness and fidelity. The epistle deserves to rank alongside of Galatians, Corinthians, and Romans as an undoubted product of Paul\'s pen, and as a coordinate standard by which to test the genuineness of other and less certain writings" (The Apostolic Age, 393). This is the practically unanimous conclusion of modern scholarship.<P>V. Place, Date, and Occasion of Writing.<P>This is one of the prison epistles (see <a href="./study/isbe/search.html?string=PHILEMON">PHILEMON</a>). Paul makes frequent reference to his bonds (<a onClick="return mV(\'Phl\',1,7,13,14,17);">Php 1:7,13,14,17</a>). He was for 2 years a prisoner in Caesarea (<a onClick="return mV(\'Act\',24,27);">Ac 24:27</a>). Paulus and others have thought that the epistle was written during this imprisonment; but the references to the praetorian guard and the members of Caesar\'s household have led most critics to conclude that the Roman imprisonment was the one to which the epistle refers. Philemon, Colossians and Ephesians were also written during the Roman imprisonment, and these three form a group by themselves. Philippians is evidently separated from them by some interval. Was it written earlier or later than they? Bleek, Lightfoot, Sanday, Herr, Beet and others think that the Epistle to the Philippians was written first. We prefer, however, to agree with Zahn, Ramsay, Findlay, Shaw, Vincent, Julicher, Holtzmann, Weiss, Godet, and others, who argue for the writing of Php toward the close of the Roman imprisonment.<P>Their reasons are as follows:<P>(1) We know that some considerable time must have elapsed after Paul\'s arrival at Rome before he could have written this epistle; for the news of his arrival had been carried to Philippi and a contribution to his needs had been raised among his friends there, and Epaphroditus had carried it to Rome. In Rome, Epaphroditus had become seriously sick and the news of this sickness had been carried back to Philippi and the Philippians had sent back a message of sympathy to him. At least four trios between Rome and philippi are thus indicated, and there are intervals of greater or less length between them. The distance between the two cities was some 700 miles. Communication was easy by the Appian Way and Trajan\'s Way to Brundusium and across the narrow straits there to the Egnatian Way, which led directly to Philippi. There were many making the trip at all times, but the journey would occupy a month at least, and the four journeys suggested in the epistle were not in direct succession.<P>(2) Paul says that through him Christ had become known throughout the whole praetorian guard (<a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>). It must have taken some time for this to become possible.<P>(3) The conditions outside the prison, where Christ was being preached, by some in a spirit of love, and by others in a spirit of faction, cannot be located in the earliest months of Paul\'s sojourn in Rome (<a onClick="return mV(\'Phl\',1,\'15-17\');">Php 1:15-17</a>). They must belong to a time when Christianity had developed in the city and parties had been formed in the church.<P>(4) Luke was well known at Philippi. Yet he sends no salutation to the Philippians in this epistle. He would surely have done so if he had been with Paul at the time of its writing. He was with the apostle when he wrote to the Colossians, and so was Demas (<a onClick="return mV(\'Col\',4,14);">Col 4:14</a>). In this epistle Paul promises to send Timothy to Philippi, and says, "I have no man likeminded, who will care truly for your state" (<a onClick="return mV(\'Phl\',2,20);">Php 2:20</a>). This must mean that Aristarchus, Demas and Luke were all gone. They had all been with him when he wrote the other epistles<P>(5) His condition as a prisoner seems to have changed for the worse. He had enjoyed comparative liberty for the first 2 years of his imprisonment at Rome, living in his own hired house and accessible to all his friends. He had now been removed, possibly to the guardroom of the praetorian cohort. Here he was in more rigorous confinement, in want and alone.<P>(6) Paul writes as if he thought that his case would be decided soon (<a onClick="return mV(\'Phl\',2,23,24);">Php 2:23,24</a>). He seems to be facing his final trial. He is not sure of its outcome. He may die a martyr\'s death, but he expects to be acquitted and then to be at liberty to do further missionary work. This was not his immediate expectation when he wrote the other epistles., and therefore they would seem to be earlier than this.<P>(7) The epistle is addressed to all the saints in Philippi, with the bishops and deacons (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>). These official titles do not occur in any earlier epistles, but they are found in the Pastoral Epistles, which were written still later. Therefore they link the Epistle to the Philippians with the later rather than the earlier epistles<P>From these indications we conclude that this is the last of Paul\'s Epistles to the churches. Hilgenfeld calls this the swan song of the great apostle. In it Paul has written his last exhortations and warnings, his last hopes and prayers for his converts to the Christian faith. Its date must be somewhere toward the close of the Roman imprisonment, in the year 63 or 64 AD. Epaphroditus had brought the contribution of the Philippians to Paul in Rome. He had plunged into the work there in rather reckless fashion, risking his life and contracting a malarial fever or some other serious sickness; but his life had been spared in answer to the prayers of Paul and his friends. Now Paul sends him back to Philippi, though he knows that he will be very lonely without him; and he sends with him this letter of acknowledgment of their gift, filled with commendation and encouragement, gratitude and love.<P>VI. Contents of the Epistle.<P>The epistle is not capable of any logical analysis. Its succession of thought may be represented as follows:<P>(1) Address (<a onClick="return mV(\'Phl\',1,1,2);">Php 1:1,2</a>).<P>(2) Thanksgiving and prayer (<a onClick="return mV(\'Phl\',1,\'3-11\');">Php 1:3-11</a>): Paul is thankful for their fellowship and confident of their perfection. He longs for them and prays that their love may be wise to discriminate among the most excellent things and that they may be able to choose the very best, until they are filled with the fruits of righteousness, which are through Jesus Christ, unto the glory and the praise of God.<P>(3) Information concerning his own experience (<a onClick="return mV(\'Phl\',1,\'12-30\');">Php 1:12-30</a>):<P>(a) His evangelism (<a onClick="return mV(\'Phl\',1,\'12-14\');">Php 1:12-14</a>): Everything had turned out well. Paul is in prison, but he has been indefatigable in his evangelism. He has been chained to a soldier, but that has given him many an opportunity for personal and private and prolonged conversation. When the people have gathered to hear, the guard has listened perforce; and when the crowd was gone, more than once the soldier has seemed curious and interested and they have talked on about the Christ. Paul has told his experience over and over to these men, and his story has been carried through the whole camp.<P>(b) His tolerance (<a onClick="return mV(\'Phl\',1,\'15-18\');">Php 1:15-18</a>): Not only has the gospel found unexpected furtherance inside the prison walls, but through the whole city the brethren have been emboldened by Paul\'s success to preach Christ, some through faction and envy and strife, and some through love. Paul rejoices that Christ is preached, whether by his enemies or by his friends. He would much prefer to have the gospel presented as he himself preached it, but he was great-souled and broadminded enough to tolerate differences of opinion and method among brethren in Christ. "In every way, whether in pretense or in truth, Christ is proclaimed; and therein I rejoice, yea, and will rejoice" (<a onClick="return mV(\'Phl\',1,18);">Php 1:18</a>). This is one of the noblest utterances of one of the greatest of men. Paul is sorry that everybody does not see things just exactly as he does, but he rejoices if they glorify Christ and would not put the least hindrance in their way.<P>(c) His readiness for life or death (<a onClick="return mV(\'Phl\',1,\'19-26\');">Php 1:19-26</a>): Paul says, Give me liberty or give me death; it will be Christ either way. To live is to work for Christ; to die is to be with Christ. "To me to live is Christ, and to die is gain." Here is Paul\'s soliloquy in the face of possible martyrdom or further missionary labors.<P>We are reminded of Hamlet\'s soliloquy in Shakespeare. "To be or not to be"—that is the question with both Hamlet and Paul. Hamlet weighs evils against evils and chooses the lesser evils in sheer cowardice in the end. Paul weighs blessings against blessings, the blessings of life for Christ and the blessings of death with Christ, and chooses the lesser blessings in pure unselfishness in the end. They both choose life, but the motives of their choice are radically different; and Paul lives with rejoicing while Hamlet lives in despair and in shame. The aged apostle would rather die than live, but he would rather live than die before his work was done.<P>(d) His example (<a onClick="return mV(\'Phl\',1,\'27-30\');">Php 1:27-30</a>): Paul was a Roman citizen and so were they. He tried to live worthy of his citizenship and so must they. He had a still higher ambition, that he and they might live as citizens worthy of the gospel of Christ. He fought as a good soldier. He stood fast in the faith. He was in nothing affrighted by the adversaries. Let them follow his example. They were engaged in the same conflict. To them it had been granted to believe and to suffer in the behalf of Christ. Their faith was not of themselves; it was the gift of God. Their suffering was not self-chosen; it too was a gift of God. (4) Exhortation to follow the example of Christ (<a onClick="return mV(\'Phl\',2,\'1-18\');">Php 2:1-18</a>): Let the Philippians have the mind and spirit of Jesus, and Paul will rejoice to pour out his life as a libation upon the sacrifice and service of their faith. (5) Reasons for sending Timothy, and Epaphroditus to them (<a onClick="return mV(\'Phl\',2,\'19-30\');">Php 2:19-30</a>). (6) Paul\'s example (<a onClick="return mV(\'Phl\',3,\'1-21\');">Php 3:1-21</a>):<P>(a) In the repudiation of all confidence in the flesh (<a onClick="return mV(\'Phl\',3,\'1-7\');">Php 3:1-7</a>): There are certain dogs and evil workers who belong to the old Jewish persuasion who glory in the flesh. Paul does not. He glories in Christ Jesus and has no confidence in the flesh. He has much reason to be proud of his past, for he would rank high on his record among them. He was of the stock of Israel, the prince with God. He belonged to the race of those who wrestled with God and got the victory. He was of the tribe of Benjamin, the only one of the patriarchs born in the Chosen Land. The first king of Israel had been chosen from this tribe. It alone had been faithful to the house of David at the time of the Great Schism. It held the place of honor in the militant host of the Israelites (<a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a>; <a onClick="return mV(\'Hsa\',5,8);">Ho 5:8</a>). It was a matter of pride to belong to this singly faithful and signally honored tribe. He was a Hebrew of Hebrews, and he belonged to that sect among the Hebrews that was notorious for its scrupulous observance of all the religious ritual, for its patriotism and zeal, for its piety. and devotion. Among these Pharisees he was conspicuous for his enthusiasm. He was the chosen instrument of the Sanhedrin to persecute and annihilate the Christian church. No one could find fault with his legal righteousness. He claimed to be blameless as judged by their standard. That was his record. Who has any better one, in pedigree or in piety? All of these things Paul counts but loss for Christ.<P>(b) In the maintenance and pursuit of spiritual perfection (<a onClick="return mV(\'Phl\',3,\'8-16\');">Php 3:8-16</a>): The word "perfect" is used twice in this paragraph. We read: "Not that I have already obtained, or am already made perfect: but I press on." Many of the authorities quote these words as indicative of Paul\'s humility in disclaiming any present perfection of character while he avows his purpose to strive on toward perfection as long as he lives. Such an interpretation is wholly aside from Paul\'s thought. He is not talking about perfection in patience and peace and devotion and character. That perfection he claims for himself and for the Philippians in this paragraph toward the close: "Let us therefore, as many as are perfect, be thus minded." The perfection of which he speaks earlier is the perfection possible in the resurrection life of the saints in bliss. He has not attained unto the resurrection from the dead and is not perfect with the perfection of heaven. That is the goal of his endeavor. He presses on to that mark. In the meantime he maintains that perfection of consecration and of faith that results in present Christian perfection of character and which is the only guaranty of that perfection to be revealed to those who attain unto the resurrection from the dead.<P>(c) In heavenly citizenship (<a onClick="return mV(\'Phl\',3,\'17-21\');">Php 3:17-21</a>): Paul walks with his mind on heavenly things. There are those who mind earthly things. They are enemies of the cross, but he has sworn eternal allegiance to the cross. Their end is perdition, while his end is sure salvation. Their god is the belly, while his goal is the perfection of the spirit. Their glory is in their shame, while his glory is in Christ alone. "Brethren, be ye imitators together of me, and mark them that so walk even as ye have us for an ensample." Then "The Lord...shall fashion anew the body of our humiliation," the body of our earthly pilgrimage, the body that so often fails the racer to the goal and cannot keep up with the desire of his spirit, and will conform it "to the body of his glory," the perfect body of those who have attained to the resurrection of the dead. It is not "our vile body" that is to be changed. That gives a false sense in modern English. The body is not vile, and the Bible nowhere says that it is. It was Manichean or neo-Platonic heresy that matter was evil and the body vile. Plotinus blushed that he had a body; Jesus never did. The Christian will honor the body as the temple of the Holy Spirit. It was the vehicle of the incarnation, and he honors it for that. Yet the body prepared for Jesus was the body of His humiliation. It bound Him to the earth. It wearied when He was most anxious to work. It failed Him when He most needed strength. Paul says that our bodies are like the body of Jesus of Nazareth now, and they shall be like the body of our risen Lord in due time.<P>(7) A series of short exhortations (<a onClick="return mV(\'Phl\',4,\'1-9\');">Php 4:1-9</a>): This series ends with the command, "The things which ye both learned and received and heard and saw in me, these things do: and the God of peace shall be with you." All these exhortations, then, are based upon his own conduct and experience and example. They had seen the embodiment of these things in him. They were to be imitators of him in their obedience to them. Therefore as we read them we have side-lights thrown upon the character of the apostle who had taught and preached and practiced these things.<P>What do they tell us concerning the apostle Paul?<P>(a) His stedfastness and his love for his friends (<a onClick="return mV(\'Phl\',4,1);">Php 4:1</a>): He had a genius for friendship. He bound his friends to him with cords of steel. They were ready to sacrifice anything for him. The reason for that was that he sacrificed everything for them, and that he had such an overflowing love for them that his love begot love in them. They could depend upon him.<P>(b) His sympathy with all good men and all good women and his desire that they live in peace (<a onClick="return mV(\'Phl\',4,2,3);">Php 4:2,3</a>): The true yokefellow mentioned here cannot be identified now. He has been variously named by the critics, as Epaphroditus, Barnabas, Luke, Silas, Timothy, Peter, and Christ. There may be a proper name in the phrase, either Genisius or Syzygus. We are wholly ignorant as to whom Paul meant.<P>(c) His constant rejoicing in the Lord (<a onClick="return mV(\'Phl\',4,4);">Php 4:4</a>).<P>(d) His sweet reasonableness ("moderation," the King James Version, the Revised Version (British and American) "forbearance," <a onClick="return mV(\'Phl\',4,5);">Php 4:5</a>).: So Matthew Arnold translates the Greek noun here. Tyndale called it courtesy. It is a combination of forbearance and graciousness, of modesty and courtesy, of consideration and esteem such as was characteristic of Christ. Paul had it. There was a sweet reasonableness about him that made his personality a most winning and attractive one.<P>(e) His freedom from anxiety (<a onClick="return mV(\'Phl\',4,6,7);">Php 4:6,7</a>): Paul\'s fearless confidence was born on the one hand from his assurance that the Lord was near, and on the other from his faith in prayer. It passed all understanding how Paul was kept from all anxiety. It was the power of prayer that did it. It was the peace of God that did it. It was the Lord at hand who did it.<P>(f) His habitual high thinking (<a onClick="return mV(\'Phl\',4,8);">Php 4:8</a>): All that was worthy in the ideals of the Greek philosophers Paul made the staple of his thought. He delighted in things true and honorable and just and pure and lovely and of good report. He knew that virtue was in these things and that all praise belonged to them. He had learned that while his mind was filled with these things he lived in serenity and peace. (8) Thanks for their gift (<a onClick="return mV(\'Phl\',4,\'10-20\');">Php 4:10-20</a>).<P>(9) Salutations (<a onClick="return mV(\'Phl\',4,21,22);">Php 4:21,22</a>).<P>(10) Benediction (<a onClick="return mV(\'Phl\',4,23);">Php 4:23</a>).<P>This is not a theological epistle and therefore it is not an especially Christological one. Yet we count the name of Christ 42 times in this short letter, and the pronouns referring to Him are many more. Paul cannot write anything without writing about Christ. He ends: "The grace of the Lord Jesus Christ be with your spirit." The spirit of Christ and the grace of Christ are in the entire epistle.<P>LITERATURE:<P>Works on Introduction: Zahn, Weiss, Julicher, Salmon, Dods, Bacon, Bennett and Adeney; McClymont, The New Testament and Its Writers; Farrar, The Messages of the Books; Fraser, Synoptical Lectures on Books of the Holy Scripture; Godet, Studies on the Epistles Works on the Pauline Epistles: Findlay, Shaw. Commentaries: Lightfoot, Vincent, Weiss, Beet, Ellicott, Haupt, Moule. Devotional studies: Moule, Meyer, Jowett, Noble.``73';
isbe[6903]='Philistia`fi-lis\'-ti-a: The country is referred to under various designations in the Old Testament: namely, pelesheth (Philistia) (<a onClick="return mV(\'Psa\',60,8);">Ps 60:8 (Hebrew 10)</a>; <a onClick="return mV(\'Psa\',87,4);">87:4</a>), \'erets pelishtim, "land of the Philistines" (<a onClick="return mV(\'Gen\',21,32,34);">Ge 21:32,34</a>), geloth hapelishtim; Septuagint ge ton Phulistieim, "the regions of the Philistines" (<a onClick="return mV(\'Jos\',13,2);">Jos 13:2</a>). The Egyptian monuments have Puirsatha, Pulsath (Budge), Peleset (Breasted) and Purasati (HGHL), according to the different voweling of the radicals; the Assyrian form is Palastu or Pilistu, which corresponds very closely to the Egyptian and the Hebrew. The extent of the land is indicated in <a onClick="return mV(\'Jos\',13,2);">Jos 13:2</a> as being from the Shihor, or Brook of Egypt (Revised Version), to the border of Ekron, northward. The eastern border was along the Judean foothills on the line of Beth-shemesh (<a onClick="return mV(\'1Sa\',6,9);">1Sa 6:9</a>) with the sea on the west. It was a very small country, from 25 to 30 miles in length and with an average width of about half the length, but it was fertile, being an extension of the plain of Sharon, except that along the coast high sand dunes encroached upon the cultivated tract. It contained many towns and villages, the most important being the five so often mentioned in Scripture: Gaza, Ashdod, Ashkelon, Gath and Ekron. The population must have been large for the territory, which enabled them to contend successfully with the Israelites, notwithstanding the superiority of position in the hills to the advantage of the latter.``138';
isbe[6904]='Philistim`fi-lis\'-tim, fil\'-is-tim (pelishtim (<a onClick="return mV(\'Gen\',10,14);">Ge 10:14</a>, the King James Version)).`<a href="./study/isbe/search.html?string=PHILISTINES">PHILISTINES</a>`1';
isbe[6905]='Philistines`fi-lis\'-tinz, fil\'-is-tinz, fil\'-is-tinz (pelishtim; Phulistieim, allophuloi):<P><b>I. OLD TESTAMENT NOTICES</b><P class="in15">1. Race and Origin<P class="in15">2. Religion<P class="in15">3. Individual Philistines Mentioned<P class="in15">4. Title of Ruler and Circumcision<P class="in15">5. History in the Old Testament to Death of Saul<P class="in15">6. History Continued to Time of Ahaz<P class="in15">7. Later Notices<P><b>II. MONUMENTAL NOTICES</b><P class="in15">1. Palestinian Excavations<P class="in15">2. Egyptian Monuments<P class="in15">3. Assyrian Texts<P><b>III. THE CRETAN THEORY</b><P class="in15">1. Cherethim and Kretes<P class="in15">2. Caphtor and Keft<P><b>IV. DAVID\'S GUARDS</b><P class="in15">1. The "Cherethi" and the "Pelethi" Not Mercenaries<P class="in15">2. Meaning of These Terms<P class="in15">3. Native Hebrews<P class="in15">4. Review<P><b>LITERATURE</b><hr /><P>I. Old Testament Notices.<P>1. Race and Origin:<P>The Philistines were an uncircumcised people inhabiting the shore plain between Gezer and Gaza in southwestern Palestine (see <a href="./study/isbe/search.html?string=PHILISTIA">PHILISTIA</a>). The name Palestine itself (Hebrew pelesheth) refers to their country. The word means "migrants," and they came from another country. They are noticed 286 times in the Old Testament, and their country 8 times. The question of their race and origin is of great importance as affecting the genuine character and reliability of the Bible notices. In <a onClick="return mV(\'Gen\',10,14);">Ge 10:14</a> (<a onClick="return mV(\'1Ch\',1,12);">1Ch 1:12</a>) they are reckoned with other tribes in Mizraim (Egypt) as descendants of Ham, and as cousins of the old inhabitants of Babylonia (<a onClick="return mV(\'Gen\',10,6);">Ge 10:6</a>). They are said to be a branch of the Casluhim—an unknown people—or, according to Septuagint, of the Casmanim, which would mean "shavers of the head"—a custom of the Phoenicians (forbidden to Hebrews as a rule), as known from a picture of the time of Thothmes III in the 16th century BC. They are also connected with the Caphtorim or people of Caphtor, whence indeed they are said to have come (<a onClick="return mV(\'Jer\',47,4);">Jer 47:4</a>; <a onClick="return mV(\'Amo\',9,7);">Am 9:7</a>). Caphtor was a "shoreland," but its position is doubtful (see <a onClick="return mV(\'Deu\',2,23);">De 2:23</a>); the Caphtorim found an earlier race of Avim living in "enclosures" near Gaza, and destroyed them. In the Septuagint of this passage (and in <a onClick="return mV(\'Amo\',9,7);">Am 9:7</a>) Cappadocia stands for Caphtor (Kaphtor), and other versions have the same reading. Cappadocia was known to the Assyrians as kat-pat-uka (probably an Akkadian term—"land of the Kati"), and the Kati were a people living in Cilicia and Cappadocia, which region had a Semitic population side by side with Mengels (see <a href="./study/isbe/search.html?string=HITTITES">HITTITES</a>) at least as early as the time of Moses. It is very likely therefore that this reading is correct.<P>2. Religion:<P>According to the Old Testament and monuments alike, the Philistines were a Semitic people, and they worshipped two Babylonian gods, Dagon (<a onClick="return mV(\'1Sa\',5,2);">1Sa 5:2</a>) and Ashtaroth (<a onClick="return mV(\'1Sa\',31,10);">1Sa 31:10</a>), both of whom were adored very early in Babylonia, both, however, having names of Akkadian and not of Semitic origin. In Semitic speech Dagon meant "grain," and was so understood in the time of Philo of Gebal, a Greek-Phoenician writer who attributes the art of grain-growing to this deity. But the original name was Da-gan, and in Akkadian da is "the upper part of a man," and gan (Turkish qaan) probably means "a large fish." The new man deity was well known to the Assyrians, and is represented in connection with Sennacherib\'s worship of Ea, the sea-god, when he embarked on the Persian Gulf. Thus Dagon was probably a title of Ea ("the water spirit"), called by Berosus Oannes (u-ha-na, "lord of the fish"), and said to have issued from this same gulf. We consequently read that when the statue of Dagon at Ashdod fell (<a onClick="return mV(\'1Sa\',5,4);">1Sa 5:4</a>), its head and hands were broken off, and only "the great fish" was left. In 1874 the present writer found a seal near Ashdod representing a bearded god (as in Babylonia) with a fish tail (see <a href="./study/isbe/search.html?string=DAGON">DAGON</a>). As to Ashtoreth, who was adored in Philistia itself, her name is derived from the Akkadian Ishtar ("light maker"), a name for the moon-goddess and—later—for the planet Venus.<P>See <a href="./study/isbe/search.html?string=ASHTORETH">ASHTORETH</a>.<P>3. Individual Philistines Mentioned:<P>The Philistines had reached Gerar by the time of Abraham, and it was only in the age of the Hyksos rulers of the Delta that Canaanite tribes could be described as akin, not only to Babylonians, but also to certain tribes in Egypt, a circumstance which favors the antiquity of the ethnic chapter, <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>. We have 9 Philistine names in the Old Testament, all of which seem to be Semitic, including Abimelech—"Moloch is my father"—(<a onClick="return mV(\'Gen\',20,\'2-18\');">Ge 20:2-18</a>; <a onClick="return mV(\'Gen\',21,\'22-32\');">21:22-32</a>; <a onClick="return mV(\'Gen\',26,\'8-11\');">26:8-11</a>) at Gerar, southeasat of Gaza, Ahuzzath ("possession," <a onClick="return mV(\'Gen\',26,26);">Ge 26:26</a>), and Phicol (of doubtful meaning), with Delilah ("delicate," <a onClick="return mV(\'Jdg\',16,4);">Jud 16:4</a>), Goliath (probably the Babylonian galu, "great"), and Saph (<a onClick="return mV(\'2Sa\',21,18);">2Sa 21:18</a>), perhaps meaning "increase." These two brothers were sons of Raphah ("the tall"); but Ishbi-benob (<a onClick="return mV(\'2Sa\',21,16);">2Sa 21:16</a>), another of the family, perhaps only means "the dweller in Nob" (Beit Nuba, north of Gezer). The king of Gath in David\'s time was Achish ("the gift" in Bah), who (<a onClick="return mV(\'1Sa\',27,2);">1Sa 27:2</a>) was the son of Maoch, "the oppressor." According to Septuagint, Jonathan killed a Philistine named Nasib (<a onClick="return mV(\'1Sa\',13,3,4);">1Sa 13:3,4</a>, where the King James Version reads "a garrison"). If this is correct the name (meaning "a pillar") would also be Semitic.<P>4. Title of Ruler and Circumcision:<P>Besides these personal names, and those of the cities of Philistia which are all Semitic, we have the title given to Philistine lords, ceren, which Septuagint renders "satrap" and "ruler," and which probably comes from a Semitic root meaning "to command." It constantly applies to the rulers of Gaza, Ashdod, Ashkelon, Gath and Ekron, the 5 chief cities of Philistia. The fact that the Philistines were uncircumcised does not prove that they were not a Semitic people. Herodotus (ii.104) says that the Phoenicians acknowledged that they took this custom from the Egyptians, and the Arabs according to this passage were still uncircumcised, nor is it known that this was a custom of the Babylonians and Assyrians. The Septuagint translators of the Pentateuch always render the name Phulistieim, and this also is found in 8 passages of Joshua and Judges, but in the later books the name is translated as meaning "strangers" throughout, because they were not the first inhabitants of Philistia.<P>5. History in the Old Testament until Death of Saul:<P>The Philistines conquered the "downs" (geliloth, <a onClick="return mV(\'Joe\',3,4);">Joe 3:4</a>) near the seacoast, and were so powerful at the time of the Hebrew conquest that none of their great towns were taken (<a onClick="return mV(\'Jos\',13,3);">Jos 13:3</a>; <a onClick="return mV(\'Jdg\',3,3);">Jud 3:3</a>). By the time of Samson (about 1158 BC) they appear as oppressors of Israel for 40 years (<a onClick="return mV(\'Jdg\',13,1);">Jud 13:1</a>; <a onClick="return mV(\'Jdg\',15,20);">15:20
