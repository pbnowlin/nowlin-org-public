isbe[6926]='Phygelus; Phygellus`fi-je\'-lus, fi-jel\'-us (Phugellos; Tischendorf and Westcott and Hort, The New Testament in Greek, with others, read Phugelos, Phygellus or Phygelus (<a onClick="return mV(\'2Ti\',1,15);">2Ti 1:15</a>); the King James Version): One of the Christians who deserted Paul at the time of his 2nd imprisonment at Rome. Paul mentions him, along with Hermogenes, as being among those "that are in Asia," who turned away from him then. What is meant may be that Phygelus and Hermogenes, along with other native Christians from proconsular Asia, were in Rome when he was brought before the emperor\'s tribunal the second time, and that they had not merely taken no measures to stand by and support him, but that they had deserted him.<P>The meaning, however, may be that the turning away of Phygelus and Hermogenes from Paul took place, not in Rome, but in Asia itself.<P>The times during and immediately following the Neronic persecution were more dreadful than can easily be conceived, and the temptation was strong to forsake the Christian name, and to do so in a wholesale fashion. A great community like the Christian church in Ephesus or in Rome felt the terrible pressure of those times, when for a mere word—a word, however, denying the Lord who bought them—men were at once set free from persecution, from the loss of property or of home, and from death. 1 Peter records how the aftermath of the Neronic persecution had extended far indeed from Rome, where it had originated. Peter asks the Christians not to give way under "the fiery trial" which is trying them (<a onClick="return mV(\'1Pe\',4,12);">1Pe 4:12</a>), and those whom he thus addresses were the members of the church throughout Pontus, Galatia, Cappadocia, Asia and Bithynia (<a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>). The epistles to the seven churches in Asia in the Apocalypse also show how sorely persecution had raged throughout that province.<P>But in addition to the temptation to deny Christ\'s name and to go back to heathenism or to Judaism, there was also another which pressed upon some of the churches, the temptation to repudiate the authority of Paul. Many passages in the New Testament show how the name of Paul was sometimes very lightly esteemed, and how his authority was repudiated, e.g. by persons in Corinth, and in the churches of Galatia.<P>What is said here is, that among the Christians of proconsular Asia, i.e. of Ephesus and the churches in the valley of the Cayster, there was a widespread defection from that loyalty to Paul which was to be expected from those who owed to him all that they possessed of the knowledge of Christ\'s salvation. "All that are in Asia turned away from me; of whom are Phygelus and Hermogenes." On the whole, all the necessary conditions of these words are satisfied by a reference to Rome and to Paul\'s environment there, and perhaps this is the more probable meaning.`<a href="./study/isbe/search.html?string=HERMOGENES">HERMOGENES</a>; <a href="./study/isbe/search.html?string=PERSECUTION">PERSECUTION</a>`155';
isbe[6927]='Phylactery`fi-lak\'-ter-i (phulakterion, "guard"):<P>1. Bible References:<P>This word is found only in <a onClick="return mV(\'Mat\',23,5);">Mt 23:5</a> in our Lord\'s denunciation of the Pharisees, who, in order that their works might "be seen of men," and in their zeal for the forms of religion, "make broad their phylacteries and enlarge the borders of their garments." The corresponding word in the Old Testament, Totaphoth (Kennedy in HDB suggests pointing as the segholate feminine singular, Totepheth), is fonnd in three passages (<a onClick="return mV(\'Exd\',13,16);">Ex 13:16</a>; <a onClick="return mV(\'Deu\',6,8);">De 6:8</a>; <a onClick="return mV(\'Deu\',11,18);">11:18</a>), where it is translated "frontlets." This rendering, however, is not at all certain, and may have been read into the text from its later interpretation. In <a onClick="return mV(\'Exd\',13,9);">Ex 13:9</a> the corresponding word to the Totaphoth of <a onClick="return mV(\'Exd\',13,16);">13:16</A> is zikkaron, "memorial" or "reminder"; and in the parallel clauses of both verses the corresponding word is \'oth, "a sign" upon the hand, also used for the "sign" which Yahweh appointed for Cain (<a onClick="return mV(\'Gen\',4,15);">Ge 4:15</a>). It may be rendered then as a mark or ornament or jewel, and used figuratively of Yahweh\'s Law as an ornament or jewel to the forehead of the Israelite, a reference to the charm or amulet worn by the pagan. The word used in the Talmud for the phylactery is tephillah, "prayer," or "prayer-band" (plural tephillin), indicating its use theoretically as a reminder of the Law, although practically it might be esteemed as an automatic and ever-present charm against evil: an aid within toward the keeping of the Law, a guard without against the approach of evil; a degradation of an Old Testament figurative and idealistic phrase to the materialistic and superstitious practices of the pagans.<P>2. Description:<P>The phylactery was a leather box, cube-shaped, closed with an attached flap and bound to the person by a leather band. There were two kinds:<P>(1) one to be bound to the inner side of the left arm, and near the elbow, so that with the bending of the arm it would rest over the heart, the knot fastening it to the arm being in the form of the Hebrew letter yodh (y), and the end of the string, or band, finally wound around the middle finger of the hand, "a sign upon thy hand" (<a onClick="return mV(\'Deu\',6,8);">De 6:8</a>). This box had one compartment containing one or all of the four passages given above. The writer in his youth found one of these in a comparatively remote locality, evidently lost by a Jewish peddler, which contained only the 2nd text (<a onClick="return mV(\'Exd\',13,\'11-16\');">Ex 13:11-16</a>) in unpointed Hebrew.<P>(2) Another was to be bound in the center of the forehead, "between thine eyes" (<a onClick="return mV(\'Deu\',6,8);">De 6:8</a>), the knot of the band being in the form of the Hebrew letter daleth (d), with the Hebrew letter shin (sh) upon each end of the box, which was divided into four compartments with one of the four passages in each.<P>These two Hebrew letters, with the yodh (y) of the arm-phylactery (see (1) above), formed the divine name shadday, "Almighty." Quite elaborate ceremonial accompanied the "laying" on of the phylacteries, that of the arm being bound on first, and that of the head next, quotations from Scripture or Talmud being repeated at each stage of the binding. They were to be worn by every male over 13 years old at the time of morning prayer, except on Sabbaths and festal days, such days being in themselves sufficient reminders of "the commandment, the statutes, and the ordinances" of Yahweh (<a onClick="return mV(\'Deu\',6,1);">De 6:1</a>).<P>3. Interpretation of Old Testament Passages:<P>The passages on which the wearing of the phylacteries is based are as follows: "It (i.e. the feast of unleavened bread) shall be for a sign unto thee upon thy hand, and for a memorial between thine eyes, that the law of Yahweh may be in thy mouth" (<a onClick="return mV(\'Exd\',13,9);">Ex 13:9</a>); "And it (i.e. sacrifice of the firstborn) shall be for a sign upon thy hand, and for frontlets between thine eyes" (<a onClick="return mV(\'Exd\',13,16);">Ex 13:16</a>); "thou shalt bind them (i.e. the words of Yahweh) for a sign upon thy hand, and they shall be for frontlets between thine eyes" (<a onClick="return mV(\'Deu\',6,8);">De 6:8</a>); "therefore shall ye lay up these my words in your heart and in your soul; and ye shall bind them for a sign upon your hand, and they shall be for frontlets between your eyes" (<a onClick="return mV(\'Deu\',11,18);">De 11:18</a>). It is evident that the words in Exodus are beyond all question used figuratively; a careful reading of the verses in Deuteronomy in close relation to their contexts, in which are other figures of speech not to be taken literally, is sufficient proof of their purely figurative intention also. Only the formalism of later ages could distort these figures into the gross and materialistic practice of the phylactery. Just when this practice began cannot accurately be determined. While the Talmud attempts to trace it back to the primitive, even Mosaic, times, it probably did not long antedate the birth of Christ. In conservative Jewish circles it has been maintained through the centuries, and at present is faithfully followed by orthodox Judaism. Every male, who at the age of 13 becomes a "son of the Law" (bar mitswah), must wear the phylactery and perform the accompanying ceremonial.<P>In the New Testament passage (<a onClick="return mV(\'Mat\',23,5);">Mt 23:5</a>) our Lord rebukes the Pharisees, who make more pronounced the un-Scriptural formalism and the crude literalism of the phylacteries by making them obtrusively large, as they also seek notoriety for their religiosity by the enlarged fringes, or "borders."<P>LITERATURE.<P>The various commentaries on Exodus and Deuteronomy: tractate Tephillin; the comprehensive article by A. R. S. Kennedy in HDB; articles in Encyclopedia Biblica and Jewish Encyclopedia.`<a href="./study/isbe/search.html?string=FRINGES">FRINGES</a>; <a href="./study/isbe/search.html?string=FRONTLETS">FRONTLETS</a>; <a href="./study/isbe/search.html?string=PHARISEES">PHARISEES</a>`109';
isbe[6928]='Phylarch`fi\'-lark (phularches): Given in the King James Version of 2Macc 8:32 as a proper name "Philarches," but in the Revised Version (British and American) "the phylarch of Timotheus\'s forces"; "probably the captain of an irregular auxiliary force" (Revised Version margin), rather than a cavalry officer.``1';
isbe[6929]='Phylarches`fi-lar\'-kez (the King James Version Philarches).`<a href="./study/isbe/search.html?string=PHYLARCH">PHYLARCH</a>`1';
isbe[6930]='Physician`fi-zish\'-an (rophi; iatros): To the pious Jew at all times God was the healer (<a onClick="return mV(\'Deu\',32,39);">De 32:39</a>): "It was neither herb nor mollifying plaister that cured them, but thy word, O Lord, which healeth all things" (<span class="noTag">The Wisdom of Solomon 16:12</span>). The first physicians mentioned in Scripture are those of Egypt. Long before the sojourn of the Hebrews in that land, Egypt had a priestly class of physicians (snu) and a god of healing (Imchtp). From the ancient medical papyri which have been preserved, the largest of which is the Papyrus Ebers, we know that the medical knowledge of these physicians was purely empirical, largely magical and wholly unscientific. In spite of their ample opportunities they knew next to nothing of human anatomy, their descriptions of diseases are hopelessly crude, and three-fourths of the hundreds of prescriptions in the papyri are wholly inert. Even their art of embalming was so imperfect that few of their mummies would have remained in any other climate than that of Egypt. Physicians of this kind who were Joseph\'s servants embalmed Jacob (<a onClick="return mV(\'Gen\',50,2);">Ge 50:2</a>) and Joseph (<a onClick="return mV(\'Gen\',50,26);">Ge 50:26</a>). It was not until the foundation of the School of Alexandria, which was purely Greek, that Egypt became a place of medical education and research.<P>There is no evidence that at any time the priests of Israel were reputed to be the possessors of medical knowledge or tradition. In the ceremonial law they had explicit instructions as to the isolation of those suffering from skin eruptions, so that they might recognize certain obstinate and infectious forms which caused ceremonial uncleanness, but with this duty as sanitary police their function ended and they used no means to cure these diseases. There is, as far as I know, no record or tradition of a priest-physician in Bible times. The records of cure by the prophets, especially Elisha, are mostly recorded as miracles, not as cures by treatment. The salt which cured the noxious water at Jericho and the meal by which the poisonous gourds were rendered innoxious, like the manipulation of the Shunammite\'s son, can scarcely be regarded as adequate remedies. There is an implied reference to a healer of wounds in <a onClick="return mV(\'Exd\',21,19);">Ex 21:19</a>, as also in <a onClick="return mV(\'Isa\',3,7);">Isa 3:7</a>, and it is recorded in Pesachim, iv.9 that there was in existence in the time of the monarchy a book of cures, cepher rephu\'oth, supposed to have been written by Solomon, but withdrawn from public use by Hezekiah. The first specific mention of Hebrew physicians is <a onClick="return mV(\'2Ch\',16,12);">2Ch 16:12</a>, but Asa is obviously regarded by the Chronicler as reprehensible in trusting to their skill. In <a onClick="return mV(\'2Ki\',8,29);">2Ki 8:29</a> Joram, king of Israel, is said to have gone to Jezreel to be healed. Not far from this, across the Jordan, was Gilead, which possibly may also have been a place resorted to by those needing medical treatment, as indicated by Jeremiah\'s query: "Is there no balm in Gilead? is there no physician there?" (<a onClick="return mV(\'Jer\',8,22);">Jer 8:22</a>). Job, irritated by the platitudes of his friends, calls them physicians of no value (<a onClick="return mV(\'Job\',13,4);">13:4</A>).<P>In the New Testament our Lord\'s saying, "They that are whole have no need of a physician," etc., shows that there were physicians in Galilee (<a onClick="return mV(\'Mat\',9,12);">Mt 9:12</a>; <a onClick="return mV(\'Mar\',2,17);">Mr 2:17</a>; <a onClick="return mV(\'Luk\',5,31);">Lu 5:31</a>), and in Nazareth He quotes what seems to have been a proverb: "Physician, heal thyself" (<a onClick="return mV(\'Luk\',4,23);">Lu 4:23</a>). There were physicians in Galilee who received fees from the woman of Caesarca Philippi who had the issue of blood (<a onClick="return mV(\'Mar\',5,26);">Mr 5:26</a>; <a onClick="return mV(\'Luk\',8,43);">Lu 8:43</a>). Of her there is a curious story told in Eusebius (VII, 18).<P>There are several Talmudic references to physicians; in Sheqalim ii 1, it is said that there was a physician at the temple to attend to the priests. A physician was appointed in every city (Gittin 12b) who was required to have a license from the local authorities (Babha\' Bathra\' 21a). The familiar passage in Ecclesiasticus 38:1-15 the Revised Version (British and American) in praise of the physician gives him but limited credit for his skill: "There is a time when in their very hands is the issue for good," and later, "He that sinneth before his Maker, Let him fall into the hands of the physician."<P>Luke, called "the beloved physician" in <a onClick="return mV(\'Col\',4,14);">Col 4:14</a>, is said by Eusebius to have been a native of Antioch and a physician by profession. According to Origen he was the unnamed "brother whose praise in the gospel is spread through all the churches" (<a onClick="return mV(\'2Cr\',8,18);">2Co 8:18</a>). There are evidences of his professional studies in the language of his writings, though of this probably more has been made by Hobart and others than it really merits. Had we not known of his profession it is doubtful whether it could have been conjectured from his choice of words. Sir W. Ramsay calls attention to the two words used of the healings at Melita in <a onClick="return mV(\'Act\',28,\'8-10\');">Ac 28:8-10</a>: for the cure of Publius\' father the word used is iasato, but for the healing of those who came later it is etherapeuonto, which he renders "received medical treatment." From this he infers that Luke helped Paul with these (Ramsay, Luke the Physician, 1908).``107';
isbe[6931]='Pi-Beseth`pi-be\'-seth (pi-be\'seth; (pi-bheceth; Septuagint Bubastos; Egyptian Pi-Basht, "the house of Basht," the cat-headed goddess; the Egyptian form is usually Ha-Basht; it is doubtful if the form Pi-Basht has yet been found): A city of ancient Egypt. The only occurrence of the name of this place in the Old Testament is in <a onClick="return mV(\'Eze\',30,17);">Eze 30:17</a>; where it is coupled with Aven, i.e. On (Heliopolis).<P>1. Location:<P>Pi-beseth was on the western bank of the Pelusiac branch of the Nile, about 40 miles north of Memphis, about 15 miles northeast of On. Herodotus found the city of Bubastis very beautiful in his day. The annual festival of the goddess, Basht, was celebrated here with revolting license, similar to that of the festival of Syyid el-Bedawer now kept in Tanta.<P>2. Exploration:<P>Pi-beseth was explored by Professor Naville under the Egyptian Exploration Society in 1887-90. There were uncovered ruins of Egypt from the IVth Dynasty of the Old Empire, from the Middle Empire, an important Hyksos settlement, and ruins from the New Empire down to the end, and even from Roman times. The most unique discovery at Pi-beseth, one of the most unique in all Egypt, is the cemetery of cats. These cats, the animal sacred to Basht, were mummified at other places in Egypt, but at Pibeseth they were burned and the ashes and bones gathered and buried in great pits lined with brick or hardened clay. Bones of the ichneumon were also found mixed with those of the cats in these pits (Egypt Exploration Fund Report, 1891).``93';
isbe[6932]='Pi-Hahiroth`pi-ha-hi\'-roth (pi-ha-chiroth (<a onClick="return mV(\'Exd\',14,\'2-9\');">Ex 14:2-9</a>; <a onClick="return mV(\'Num\',33,\'7-8\');">Nu 33:7-8</a>)):<P>1. Meaning of Name:<P>Nothing is known of the meaning of the name. Pi-Hahiroth Some attempts toward an Egyptian etymology for it have been made, but without much success. Since the meaning of the name is unknown and no description of the place or its use is given, it is impossible to determine anything concerning the character of Pi-Hahiroth, whether a city, a sanctuary, a fortress, or some natural feature of the landscape.<P>2. Location:<P>Neither Pi-Hahiroth nor any other place mentioned with it can be exactly located. A recent discovery of manuscripts in Egypt furnishes a mention of this place, but affords very little assistance in locating it, nothing comparable to the account in the Bible itself. If any one of the places mentioned in connection with the crossing of the Red Sea could be located approximately, all the others could, also, be similarly located by the description given in the account in Exodus. The route beyond the Sea has been made out with almost positive certainty. A journey along the way is so convincing that hardly anything can shake the conviction which it produces. This identification of the route of the exodus beyond the Sea requires the place of the crossing to be within 3 days\' journey of Marah, which puts it somewhere near the modern Suez. It may be anywhere within 10 miles of that point. This approximately locates all the other places mentioned in connection with the crossing: Migdol must be Ras \'Ataqah, or some other high point in the mountains of the western deserts, where might be placed a watchtower. Pi-Hahiroth is between this point and the Sea and Baal-zephon near the opposite eastern shore. This puts Pi-Hahiroth at some point along the old shore line of the Sea within 10 miles of the site of modern Suez.``93';
isbe[6933]='Picture`pik\'-tur: This word (in the plural) is found 3 times in the King James Version, namely, <a onClick="return mV(\'Num\',33,52);">Nu 33:52</a>; <a onClick="return mV(\'Isa\',2,16);">Isa 2:16</a>; <a onClick="return mV(\'Pro\',25,11);">Pr 25:11</a>. In Numbers and Proverbs "pictures" represents the Hebrew word maskith, "showpiece" "figure." The context in Numbers suggests that the "pictures" or "carved figures" (the Revised Version (British and American) "figured stones") which the Israelites were to destroy were symbols of Canaanite worship and therefore foreign to the religion of Yahweh. In Proverbs for the King James Version "pictures of silver," the English Revised Version has "baskets (the American Standard Revised Version "network") of silver," but a more probable translation is "carvings of silver." "Pictures" stands for a slightly different word (but from the same root) in Isaiah, namely, sekhuyoth; the Revised Version (British and American) renders "imagery" (the Revised Version margin "watchtowers"). The prophet probably alludes to carved figures (of gods in animal or human shapes) on the prows of vessels.``103';
isbe[6934]='Piece`pes: In the King James Version the word (singular and plural) represents a large number of different Hebrew words, many of which have more or less the same significance, e.g. piece of meat or flesh (<a onClick="return mV(\'Gen\',15,10);">Ge 15:10</a>; <a onClick="return mV(\'2Sa\',6,19);">2Sa 6:19</a>; <a onClick="return mV(\'Eze\',24,4);">Eze 24:4</a>); of bread or cake (<a onClick="return mV(\'1Sa\',2,36);">1Sa 2:36</a>; <a onClick="return mV(\'1Sa\',30,12);">30:12</a>; <a onClick="return mV(\'Jer\',37,21);">Jer 37:21</a>); of ground or land (<a onClick="return mV(\'2Sa\',23,11);">2Sa 23:11</a>); of wall (<a onClick="return mV(\'Neh\',3,11,19);">Ne 3:11,19</a>); of an ear (<a onClick="return mV(\'Amo\',3,12);">Am 3:12</a>); of cloth or garment (<a onClick="return mV(\'1Ki\',11,30);">1Ki 11:30</a>); of millstone (<a onClick="return mV(\'Jdg\',9,53);">Jud 9:53</a>). It is used frequently in paraphrastic renderings of various Hebrew verbs: "break," "tear," "cut," etc., in pieces (<a onClick="return mV(\'Gen\',44,28);">Ge 44:28</a>, etc.).<P>In the New Testament "piece" renders epiblema, "piece" or "patch of cloth" (<a onClick="return mV(\'Mat\',9,16);">Mt 9:16</a>; <a onClick="return mV(\'Mar\',2,21);">Mr 2:21</a>; <a onClick="return mV(\'Luk\',5,36);">Lu 5:36</a>). It is also found in paraphrastic renderings—broken in pieces (<a onClick="return mV(\'Mar\',5,4);">Mr 5:4</a>), pulled in pieces (<a onClick="return mV(\'Act\',23,10);">Ac 23:10</a>).``103';
isbe[6935]='Piece of Gold`The word "pieces" is supplied in <a onClick="return mV(\'2Ki\',5,5);">2Ki 5:5</a> (story of Naaman), "6,000 pieces of gold," where the Revised Version margin more correctly suggests "shekels" (compare <a onClick="return mV(\'1Ki\',10,16);">1Ki 10:16</a>).`<a href="./study/isbe/search.html?string=MONEY">MONEY</a>`1';
isbe[6936]='Piece of Money`Two words are thus rendered in the King James Version (qesitah; stater). the Revised Version (British and American) gives only the first this rendering (<a onClick="return mV(\'Job\',42,11);">Job 42:11</a>). It is supposed to be from Arabic qassaT, "to divide equally by weight," and hence, something weighed; a piece of silver weighed for money, and perhaps stamped with its weight. The stater is the well-known Greek weight and coin (<a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a> the King James Version, margin, "stater," the Revised Version (British and American) "shekel"). In gold it was equal to about a guinea or five dollars, but in silver only to about 66 cents (in 1915).``1';
isbe[6937]='Piece of Silver`Two words are thus rendered in the Old Testament (ratstse-khaceph, and qesitah) and two in the New Testament argurion, and drachme). The first expression means pieces of silver broken off from bars or larger pieces (<a onClick="return mV(\'Psa\',68,30);">Ps 68:30</a>). The second is used for money in <a onClick="return mV(\'Jos\',24,32);">Jos 24:32</a>, and is so rendered in the Revised Version (British and American). The pieces were not coins, but perhaps bore a stamp. See <a href="./study/isbe/search.html?string=MONEY">MONEY</a>. In other passages of the Old Testament where pieces of silver are mentioned, the Hebrew has simply a numeral joined with keteph, "silver," as in the account of the selling of Joseph (<a onClick="return mV(\'Gen\',37,28);">Ge 37:28</a>). In <a onClick="return mV(\'Isa\',7,23);">Isa 7:23</a> the word silverlings means small pieces of silver, and they were no doubt shekels. In the New Testament the Greek arguria (<a onClick="return mV(\'Mat\',26,15);">Mt 26:15</a>; <a onClick="return mV(\'Mat\',27,\'3-9\');">27:3-9</a>), is translated as pieces of silver, but probably means shekels. In <a onClick="return mV(\'Act\',19,19);">Ac 19:19</a> the same word occurs, but in this case the reference is probably to the denarius or drachma (compare <a onClick="return mV(\'Luk\',15,8);">Lu 15:8</a>f). Thus, the 30 pieces of Matthew would be equal to about 4 British pounds or $20 (in 1915), and the 50,000 of Acts to about 2,000 British pounds or $10,000 (in 1915).``138';
isbe[6938]='Piety`pi\'-e-ti: Only in <a onClick="return mV(\'1Ti\',5,4);">1Ti 5:4</a>: "Let them learn first to show piety toward their own family," where "let them show piety" represents a single Greek verb (eusebeo), in its only other occurrence (<a onClick="return mV(\'Act\',17,23);">Ac 17:23</a>) being rendered "worship." In Elizabethan English "piety" (like the Latin pietas) could be used of devotion to one\'s parents (as still in the phrase "filial piety"), as well as of devotion to God. Hence, there is no explicit statement here that filial devotion is one form of divine worship.``1';
isbe[6939]='Pigeon`pij\'-un (yonah; peristera; Latin pipire): A bird of the family Columbidae. See <a href="./study/isbe/search.html?string=DOVE">DOVE</a>. The Hebrew yonah seems to be translated either pigeon or dove, yet almost every reference made to these birds proves that there were distinct branches of the family recognized, and one or the other or both are designated. On the other hand, some of the translations read doves, where the remainder of the text makes it very clear that pigeons were the birds intended, The Latin pipire means "to cheep," and refers to the unusually clamorous young in the nest. The old birds coo, moan and wail as doves. The birds are almost 12 inches long, have full, plump bodies that are delicious food, and beautifully marked and shaded plumage. They feed principally on grain, seeds, small buds and fruit. Beyond question wild pigeons were the first birds domesticated and taught to home with man. They appeared in a state of such complete domestication, that they flew free, yet homed and bred in places provided by man at the time of the very first attempts at keeping records of history. At the time the earliest Biblical accounts were written, pigeons were so domesticated that in all known countries of the East they were reckoned when an estimate was made of a man\'s wealth.<P>The rich provided large and expensive cotes of molded pottery for their birds, each section big enough for the home of one pair of birds, the regular rows of openings resembling lattice work, so that Isaiah refers to them as "windows" (<a onClick="return mV(\'Isa\',60,8);">Isa 60:8</a>). Septuagint reads sun nossois, literally, "with young" or "fledglings" (see below). The middle classes modeled cotes of oven-baked clay, and the very poor cut holes in the walls, over the doors, and allowed the birds to enter and live with the family.<P>In wild estate, rock and wood pigeons swarmed in countless numbers through rocky caves and caverns and over the plains of Gennesaret, the forests of Gilead and the woody slopes of Carmel. They remained throughout the season, breeding at all times. The doves were migratory, and were kept in confinement only as caged pets or to be held for sale for sacrifice. For these purposes, it appears that the dove was slightly preferred. When only one bird was to be used, a dove is always specified; where two, almost in every case the dove is mentioned first. Where one or the other will suffice, the dove seems to have been given preference. This may have been because it required greater effort to procure a dove, and so it was considered a greater sacrifice. Everyone having a home of any sort had pigeons they could use, or they could be taken wild at any time. The dove is first mentioned in <a onClick="return mV(\'Gen\',15,9);">Ge 15:9</a>: "And he said unto him, Take me a heifer three years old, and a she-goat three years old, and a ram three years old, and a turtle-dove, and a young pigeon."<P>It will be observed that the dove is mentioned first, and it is specified that the pigeon was to be young. It is probable that the people protected their domesticated pigeons by using the wild for sacrifice, whenever possible. Young birds could be taken from a nest at almost any time. The old birds, among the wild, were shy creatures and far more difficult to capture in nets or snares than doves that came close to cities and villages to live, and exhibited much less fear of man than the wild pigeons. The next reference is in <a onClick="return mV(\'Lev\',5,7);">Le 5:7</a>: "And if his means suffice not for a lamb, then he shall bring his trespass-offering for that wherein he hath sinned, two turtle-doves, or two young pigeons, unto Yahweh; one for a sin-offering, and the other for a burnt-offering." Here two birds of each kind were to be offered, if the person making the sacrifice could not afford a lamb. Again in <a onClick="return mV(\'Lev\',12,6);">Le 12:6</a>: "And when the days of her purifying are fulfilled, for a son, or for a daughter, she shall bring a lamb a year old for a burnt-offering, and a young pigeon, or a turtledove, for a sin offering, unto the door of the tent of meeting, unto the priest." Here is a rare instance where the text or the translators place the pigeon first.<P>"And on the eighth day he shall bring two turtle-doves, or two young pigeons, to the priest, to the door of the tent of meeting" (<a onClick="return mV(\'Num\',6,10);">Nu 6:10</a>). In <a onClick="return mV(\'Sgs\',2,14);">So 2:14</a>:<P class="in15">"O my dove, that art in the clefts of the rock,<br>In the covert of the steep place,<br>Let me see thy countenance,<br>Let me hear thy voice;<br>For sweet is thy voice, and thy countenance is comely."<p>Here the text reads "dove," but the description of the location and the implication of the text prove the bird to have been a rock pigeon—a tender, loving thing, yet shy and timid, that peeps with eyes of bright concern over the rocks of its chosen home, down at the intruder. <a onClick="return mV(\'Isa\',60,8);">Isa 60:8</a>: "Who are these that fly as a cloud, and as the doves to their windows?" Here is another place where the wrong bird is used. Doves were wild and migratory. They had no "windows." But the tile pots massed in one diamond-shaped cote appeared at a little distance, like latticed windows. This should read "pigeons" instead of "doves." For the same reason see <a onClick="return mV(\'Jer\',48,28);">Jer 48:28</a>: "O ye inhabitants of Moab, leave the cities and dwell in the rock; and be like the dove that maketh her nest over the mouth of the abyss." Again the bird intended is the rock pigeon. <a onClick="return mV(\'Luk\',2,24);">Lu 2:24</a>: "A sacrifice according to that which is said in the law of the Lord, A pair of turtledoves, or two young pigeons." This describes the sacrifice offered in the temple by Mary following the birth of Jesus.``167';
isbe[6940]='Pilate, Acts of``<a href="./study/isbe/search.html?string=PILATE">PILATE</a>; <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>`1';
isbe[6941]='Pilate; Pontius`pi\'-lat, pi\'-lat, pon\'-shi-us (Pontios Peilatos):<P>1. Name and Office<P>2. Pilate\'s Procuratorship<P>3. Pilate and Jesus Christ<P>4. Pilate in Tradition and Legend<P>5. Character of Pilate<P>LITERATURE<hr /><P>1. Name and Office:<P>The nomen Pontius indicates the stock from which Pilate was descended. It was one of the most famous of Samnite names; it was a Pontius who inflicted on a Roman army the disgrace of the Caudine Forks. The name is often met with in Roman history after the Samnites were conquered and absorbed. Lucius Pontius Aquila was a friend of Cicero and one of the assassins of Julius Caesar. The cognomen Pilatus indicates the familia, or branch of the gens Pontius, to which Pilate belonged. It has been derived from pileus, the cap worn by freedmen; this is improbable, as Pilate was of equestrian rank. It has also been derived from pilum, a spear. Probably the name was one that had descended to Pilate from his ancestors, and had long lost its meaning. The praenomen is nowhere mentioned. Pilate was 5th procurator of Judea. The province of Judea had formerly been the kingdom of Archclaus, and was formed when he was deposed (6 AD) Speaking roughly, it took in the southern half of Palestine, including Samaria. Being an imperial province (i.e. under the direct control of the emperor), it was governed by a procurator (see <a href="./study/isbe/search.html?string=PROCURATOR">PROCURATOR</a>; <a href="./study/isbe/search.html?string=PROVINCE">PROVINCE</a>). The procurator was the personal servant of the emperor, directly responsible to him, and was primarily concerned with finance. But the powers of procurators varied according to the appointment of the emperor. Pilate was a procurator cum porestate, i.e. he possessed civil, military, and criminal jurisdiction. The procurator of Judea was in some way subordinate to the legate of Syria, but the exact character of the subordination is not known. As a rule a procurator must be of equestrian rank and a man of certain military experience. Under his rule, the Jews were allowed as much self-government as was consistent with the maintenance of imperial authority. The Sanhedrin was allowed to exercise judicial functions, but if they desired to inflict the penalty of death, the sentence had to be confirmed by the procurator.<P>2. Pilate\'s Procuratorship:<P>We have no certain knowledge of Pilate except in connection with his time of rule in Judea. We know nothing of his birth, his origin, or his earlier years. Tacitus, when speaking of the cruel punishments inflicted by Nero upon the Christians, tells us that Christ, from whom the name "Christian" was derived, was put to death when Tiberius was emperor by the procurator Pontius Pilate (Annals xv.44). Apart from this reference and what is told us in the New Testament, all our knowledge of him is derived from two Jewish writers, Josephus the historian and Philo of Alexandria.<P>Pilate was procurator of Judea, in succession to Gratus, and he held office for 10 years. Josephus tells (Ant., XVIII, iv, 2) that he ruled for 10 years; that he was removed from office by Vitellius, the legate of Syria, and traveled in haste to Rome to defend himself before Tiberius against certain complaints. Before he reached Rome the emperor had passed away. Josephus adds that Vitellius came in the year 36 AD to Judea to be present at Jerusalem at the time of the Passover. It has been assumed by most authorities (so HDB and EB) that Pilate had departed before this visit of Vitellius. They accordingly date the procuratorship of Pilate as lasting from 26 to 36 AD. As against this view, yon Dobschutx points out (RE under the word "Pilate") that by this reckoning Pilate must have taken at least a year to get to Rome; for Tiberius died on March. 16, 37 AD. Such delay is inconceivable in view of the circumstances; hence, von Dobschutz rightly dates the period of his procuratorship 27-37 AD. The procurator of Judea had no easy task, nor did Pilate make the task easier by his actions. He was not careful to conciliate the religious prejudices of the Jews, and at times this attitude of his led to violent collisions between ruler and ruled.<P>On one occasion, when the soldiers under his command came to Jerusalem, he caused them to bring with them their ensigns, upon which were the usual images of the emperor. The ensigns were brought in privily by night, put their presence was soon discovered. Immediately multitudes of excited Jews hastened to Caesarea to petition him for the removal of the obnoxious ensigns. For five days he refused to hear them, but on the sixth he took his place on the judgment seat, and when the Jews were admitted he had them surrounded with soldiers and threatened them with instant death unless they ceased to trouble him with the matter. The Jews thereupon flung themselves on the ground and bared their necks, declaring that they preferred death to the violation of their laws. Pilate, unwilling to slay so many, yielded the point and removed the ensigns (Josephus, Ant, XVIII, iii, 1; BJ, II, ix,2,3).<P>At another time he used the sacred treasure of the temple, called corban (qorban), to pay for bringing water into Jerusalem by an aqueduct. A crowd came together and clamored against him; but he had caused soldiers dressed as civilians to mingle with the multitude, and at a given signal they fell upon the rioters and beat them so severely with staves that the riot was quelled (Josephus, Ant, XVIII, iii, 2; BJ, II, ix, 4).<P>Philo tells us (Legatio ad Caium, xxxviii) that on other occasion he dedicated some gilt shields in the palace of Herod in honor of the emperor. On these shields there was no representation of any forbidden thing, but simply an inscription of the name of the donor and of him in whose honor they were set up. The Jews petitioned him to have them removed; when he refused, they appealed to Tiberius, who sent an order that they should be removed to Caesarea.<P>Of the incident, mentioned in <a onClick="return mV(\'Luk\',13,1);">Lu 13:1</a>, of the Galileans whose blood Pilate mingled with their sacrifices, nothing further is known.<P>Josephus (Ant., XVIII, iv,1,2) gives an account of the incident which led to Pilate\'s downfall. A religious pretender arose in Samaria who promised the Samaritans that if they would assemble at Mt. Gerizim, he would show them the sacred vessels which Moses had hidden there. A great multitude assembled in readiness to ascend the mountain, but before they could accomplish their aim they were attacked by Pilate\'s cavalry, and many of them were slain. The Samaritans thereupon sent an embassy to Vitellius, the legate of Syria, to accuse Pilate of the murder of those who had been slain. Vitellius, who desired to stand well with the Jews, deposed Pilate from office, appointed Marcellus in his place, and ordered Pilate to go to Rome and answer the charges made against him before the emperor. Pilate set out for Rome, but, before he could reach it, Tiberius had died; and it is probable that, in the confusion which followed, Pilate escaped the inquisition with which he was threatened. From this point onward history knows nothing more of Pilate.<P>3. Pilate and Jesus Christ:<P>The shortest and simplest account of Pilate\'s dealings with Jesus Christ is given in the Gospel of Mark. There we are told that Jesus was delivered to Pilate; that Pilate asked Him if He was the king of the Jews, receiving an affirmative answer; that, to Pilate\'s surprise, Jesus answered nothing to the accusations of the chief priests; that Pilate tried to release Jesus according to an ancient custom; that the multitude, in spite of the protest of Pilate, demanded the release of Barabbas, and cried out that Jesus should be crucified; that Pilate scourged Jesus and delivered Him to be crucified; and that Jesus, when He had been scourged and mocked, was led away to be crucified. Mark tells further how Joseph of Arimathea begged of Pilate the body of Jesus. Pilate was surprised that Jesus died so quickly, and questioned the centurion about it. Pilate\'s surprise and question are peculiar to Mark. Being satisfied on this point, Pilate granted the body to Joseph. Matthew adds the dream and message of Pilate\'s wife (<a onClick="return mV(\'Mat\',27,19);">27:19</a>); it also tells how Pilate washed his hands before the people, disclaiming responsibility for the death of Jesus, and how the people accepted the responsibility (<a onClick="return mV(\'Mat\',27,24);">27:24</a>f); also how Pilate granted a guard for the tomb (<a onClick="return mV(\'Mat\',27,\'62-66\');">27:62-66</A>). Luke alone narrates the sending of Jesus to Herod (<a onClick="return mV(\'Luk\',27,\'6-12\');">23:6-12</A>), and reports Pilate\'s three times repeated asseveration that he found no fault in Jesus (<a onClick="return mV(\'Luk\',23,4,14,22);">23:4,14,22</a>). John gives by far the fullest narrative, which forms a framework into which the more fragmentary accounts of the Synoptics can be fitted with perfect ease. Some critics, holding that Mark alone is trustworthy, dismiss the additional incidents given in Matthew and Luke as apologetic amplifications; and many dismiss the narrative of John as wholly unworthy of credence. Such theories are based on preconceived opinions as to the date, authorship and reliability of the various Gospels. The reader who holds all the Gospels to be, in the main, authentic and trustworthy narratives will have no difficulty in perceiving that all four narratives, when taken together, present a story consistent in all its details and free from all difficulty. See <a href="./study/isbe/search.html?string=GOSPELS">GOSPELS</a>. It should be noted that John evidently had special opportunities of obtaining exacter knowledge than that possessed by the others, as he was present at every stage of the trial; and that his narrative makes clear what is obscure in the accounts of the Synoptics.<P>The parts may be fitted together thus: Jesus is brought to Pilate (<a onClick="return mV(\'Mat\',27,2);">Mt 27:2</a>; <a onClick="return mV(\'Mar\',15,1);">Mr 15:1</a>; <a onClick="return mV(\'Luk\',23,1);">Lu 23:1</a>; <a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>). Pilate asks for a specific accusation (<a onClick="return mV(\'Jhn\',18,\'29-32\');">Joh 18:29-32</a>). Pilate enters the praetorium, questions Jesus about His alleged kingship, and receives the answer that He rules over the kingdom of truth, and over the hearts of men who acknowledge the truth. Pilate asks: "What is truth?" (reported briefly in <a onClick="return mV(\'Mat\',27,11);">Mt 27:11</a>; <a onClick="return mV(\'Mar\',15,2);">Mr 15:2</a>; <a onClick="return mV(\'Luk\',23,3);">Lu 23:3</a>, and with more detail <a onClick="return mV(\'Jhn\',18,\'33-38\');">Joh 18:33-38</a>). Pilate brings Him forth (this is the only detail that needs to be supplied in order to make the harmony complete, and in itself it is probable enough), and many accusations are made against Him, to which, to Pilate\'s surprise, He makes no reply (<a onClick="return mV(\'Mat\',27,\'12-14\');">Mt 27:12-14</a>; <a onClick="return mV(\'Mar\',15,\'3-5\');">Mr 15:3-5</a>). Pilate affirms His innocence, but the charges are repeated (<a onClick="return mV(\'Luk\',23,4);">Lu 23:4</a>f). Pilate sends Him to Herod, who in mockery clothes Him in shining raiment, and sends Him back (<a onClick="return mV(\'Luk\',23,\'6-12\');">Lu 23:6-12</a>). Pilate declares that neither Herod or himself can find any fault in Him, and offers to scourge Him and let Him go (<a onClick="return mV(\'Luk\',23,\'13-16\');">Lu 23:13-16</a>; <a onClick="return mV(\'Jhn\',18,38);">Joh 18:38</a>). Pilate offers to release Jesus in accordance with an ancient custom (<a onClick="return mV(\'Mat\',27,\'15-18\');">Mt 27:15-18</a>; <a onClick="return mV(\'Mar\',15,\'6-10\');">Mr 15:6-10</a>; <a onClick="return mV(\'Jhn\',18,39);">Joh 18:39</a>). Pilate\'s wife sends him a message warning him not to harm Jesus because she has suffered many things in a dream because of Him (<a onClick="return mV(\'Mat\',27,19);">Mt 27:19</a>). The people, persuaded thereto by the chief priests and elders, choose Barabbas, and, in spite of the repeated protests of Pilate, demand that Jesus shall be crucified (<a onClick="return mV(\'Mat\',27,\'20-23\');">Mt 27:20-23</a>; <a onClick="return mV(\'Mar\',15,\'11-14\');">Mr 15:11-14</a>; <a onClick="return mV(\'Luk\',23,\'18-23\');">Lu 23:18-23</a>; <a onClick="return mV(\'Jhn\',18,40);">Joh 18:40</a>). Pilate washes his hands before the people, and they take the guilt of the deed upon themselves and their children (<a onClick="return mV(\'Mat\',27,24);">Mt 27:24</a>f). Pilate releases Barabbas and orders Jesus to be scourged (<a onClick="return mV(\'Mat\',27,26);">Mt 27:26</a>; <a onClick="return mV(\'Mar\',15,15);">Mr 15:15</a>; <a onClick="return mV(\'Luk\',23,24);">Lu 23:24</a>f). Jesus is scourged and mocked, buffered and spit upon (<a onClick="return mV(\'Mat\',27,\'27-31\');">Mt 27:27-31</a>; <a onClick="return mV(\'Mar\',15,\'16-20\');">Mr 15:16-20</a>; <a onClick="return mV(\'Jhn\',19,\'1-3\');">Joh 19:1-3</a>). Pilate again declares the innocence of Jesus, brings Him out, and says: "Behold the man!" The chief priests and officers cry out: "Crucify him!" They accuse Him of making Himself the Son of God. Pilate, becoming more afraid at this saying, once more interviews the prisoner in the praetorium. He again tries to release Him, but is accused of treachery to the emperor. Overborne by this, Pilate sits on the judgment seat (see <a href="./study/isbe/search.html?string=GABBATHA">GABBATHA</a>), and says: "Behold your King!" Again the cry goes up: "Away with him, crucify him!" Pilate says: "Shall I crucify your King?" The chief priests answered with a final renunciation of all that God had given them, saying: "We have no king but Caesar" (<a onClick="return mV(\'Jhn\',19,\'4-15\');">Joh 19:4-15</a>). Pilate sentences Jesus and gives Him up to be crucified, and He is led away (<a onClick="return mV(\'Mat\',27,31);">Mt 27:31</a>; <a onClick="return mV(\'Mar\',15,20);">Mr 15:20</a>; <a onClick="return mV(\'Luk\',23,26);">Lu 23:26</a>; <a onClick="return mV(\'Jhn\',19,16);">Joh 19:16</a>). Pilate writes a title for the cross, and refuses to alter it (<a onClick="return mV(\'Jhn\',19,\'19-22\');">Joh 19:19-22</a>). The Jews ask of Pilate that the legs of the three who were crucified might be broken (<a onClick="return mV(\'Jhn\',19,31);">Joh 19:31</a>). Joseph of Arimathea begs the body of Jesus from Pilate (<a onClick="return mV(\'Mat\',27,57,58);">Mt 27:57,58</a>; <a onClick="return mV(\'Mar\',15,42);">Mr 15:42</a>f; <a onClick="return mV(\'Luk\',23,\'50-52\');">Lu 23:50-52</a>; <a onClick="return mV(\'Jhn\',19,38);">Joh 19:38</a>). Pilate is surprised that Jesus has died so soon, and questions the centurion (<a onClick="return mV(\'Mar\',15,44);">Mr 15:44</a>). He gives up to Joseph the body of Jesus (<a onClick="return mV(\'Mat\',27,58);">Mt 27:58</a>; <a onClick="return mV(\'Mar\',15,45);">Mr 15:45</a>; <a onClick="return mV(\'Jhn\',19,38);">Joh 19:38</a>). The chief priests and the Pharisees obtain permission from Pilate to take precautions against any theft of the body of Jesus (<a onClick="return mV(\'Mat\',27,\'62-66\');">Mt 27:62-66</a>).<P>Pilate is mentioned three times in Acts: in a speech of Peter (<a onClick="return mV(\'Act\',3,13);">3:13</a>), in a thanksgiving of the church (<a onClick="return mV(\'Act\',4,27);">4:27</A>), and in a speech of Paul (<a onClick="return mV(\'Act\',13,28);">13:28</a>). He is also mentioned in 1 Timothy (<a onClick="return mV(\'1Ti\',6,13);">6:13</a>) as the one before whom Christ Jesus witnessed the good confession.<P>4. Pilate in Tradition and Legend:<P>Eusebius, who lived in the 4th centuries, tells us (Historia Ecclesiastica, II) on the authority of certain Greek historians that Pilate fell into such calamities that he committed suicide. Various apocryphal writings have come down to us, written from the 3rd to the 5th centuries, with others of a later date, in which legendary details are given about Pilate. In all these a favorable view is taken of his character; hence, the Coptic church came to believe that he became a Christian, and enrolled him among the number of its saints. His wife, to whom tradition gives the name of Claudia Procula, or Procla, is said to have been a Jewish proselyte at the time of the death of Jesus, and afterward to have become a Christian. Her name is honored along with Pilate\'s in the Coptic church, and in the calendar of saints honored by the Greek church her name is found against the date October 27.<P>We find not unkindly references to Pilate in the recently discovered fragment of the Gospel of Peter, which was composed in the 2nd century. In the so-called Gospel of Nicodemus, which belongs to the 4th or 5th century, we find in the first part, called the Acts of Pilate, a long account of the trial of Jesus. It tells how the standards in the hall of judgment bowed down before Jesus, in spite of the efforts of the standard-bearers, and others who attempted it, to hold them erect. It tells also how many of those who had been healed by Jesus bore testimony to Him at the trial (see <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>). There has also come down to us, in various forms (e.g. in the Acts of Peter and Paul), a letter, supposed to be the report of Pilate to Tiberius, narrating the proceedings of the trial, and speaking of Jesus in the highest terms of praise. Eusebius, when he mentions this letter, avers that Tiberius, on perusing it, was incensed against the Jews who had sought the death of Jesus (Historia Ecclesiastica, II, 2). Elsewhere (Historia Ecclesiastica, IX, 5) he recounts that under Maximin forged Acts of Pilate, containing blasphemies against Christ, were circulated with consent of the emperor. None of these, if they ever existed, have come down to us. In the Paradosis Pilati we read that Caesar, being angry with Pilate for what he had done, brought him to Rome as a prisoner, and examined him. When the Christ was named, all the gods in the senate-chamber fell down and were broken. Caesar ordered war to be made on the Jews, and Pilate, after praying to Jesus, was beheaded. The head was taken away by an angel, and Procla, seeing this, died of joy. Another narrative, of late date, recounts that Pilate, at his trial, wore the seamless robe of Jesus; for this reason Caesar, though filled with anger, could not so much as say a harsh word to Pilate; but when the robe was taken off, he condemned Pilate to death. On hearing this, Pilate committed suicide. The body was sunk in the Tiber, but such storms were raised by demons on account of this that it was taken up and sunk in the Rhone at Vienne. The same trouble recurred there, and the body was finally buried in the territory of Losania (Lausanne). Tradition connects Mt. Pilatus with his name, although it is probable that the derivation is from pileatus, i.e. the mountain with a cloud-cap.<P>5. Character of Pilate:<P>Philo (Legatio ad Caium, xxxviii) speaks of Pilate in terms of the severest condemnation. According to him, Pilate was a man of a very inflexible disposition, and very merciless as well as obstinate. Philo calls him a man of most ferocious passions, and speaks of his corruption, his acts of insolence, his rapine, his habit of insulting people, his cruelty, his continual murders of people untried and uncondemned, and his never-ending and most grievous inhumanity. This is very highly colored and probably much exaggerated; certainly the instances given do not bear out this description of the man. Much of what he says of Pilate is in direct opposition to what we learn of him in the Gospels. There he appears to us as a man who, in spite of many undoubted faults, tries hard to conduct the trial with fairness. Pilate had the ethics of his class, and obviously tried to act up to the standard which he had formed. There was in him, however, no deep moral basis of character, as is shown by the utter skepticism of his question, "What is truth?" When he found that the doing of strict justice threatened to endanger his position, he reluctantly and with a great deal of shame gave way to the demands of the Jews. He sent Jesus to the cross, but not before he had exhausted every expedient for saving Him, except the simple and straightforward one of dismissing the case. He had the haughtiness of the dominant race, and a profound contempt for the people over which he ruled. This contempt, as we have seen, continually brought him into trouble. He felt deeply humiliated at having to give way to those whom he utterly despised, and, in the manner of a small mind, revenged himself on them by calling Christ their king, and by refusing to alter the mocking inscription on the cross. It is certain that Pilate, in condemning Jesus, acted, and knew that he acted against his conscience. He knew what was right, but for selfish and cowardly reasons refused to do it. He was faced by a great moral emergency, and he failed. We rest on the judgment of our Lord, that he was guilty, but not so guilty as the leaders of the chosen people.<P>LITERATURE.<P>The Gospels; Philo, Legatio ad Caium; Josephus, Josephus, Antiquities and BJ; the Annals of Tacitus; Eusebius, HE; Walker, Apocryphal Gospels, Acts, and Revelations in the "Ante-Nicene Christian Library," and for the Gospel according to Peter, volume IX of the same series err, New Testament Apocryphal Writings ("Temple Bible Series"), gives the text of the Gospel of Nicodemus and the Gospel of Peter.<P>There is a great mass of literature on the subject, but there is no English monograph on Pontius Pilate. In German there is G.A. Muller, Pontius Pilatus der funfe Prokurator von Judaa (Stuttgart, 1888). See also the various articles on Pilate in books of reference on the New Testament, notably RE (von Dobschiitz), HDB (G. T. Purves), DCG (A. Souter), and Encyclopedia Biblica (W. J. Woodhouse). For the name of-Pilate see the articles on "Pontius Pilatus et les Pontii" by Ollivier in Review Biblical, volume V. For the Apocryphal Gospels see article on "Gospel of Nicodemus" in HDB, also article "Apocryphal Gospels," in the supplementary volume of HDB; Orr, New Testament Apocryphal Writings; Zahn, Geschichte des New Testament Kanons; Harnack, Altchristliche Litteraturgeschichte. For the trial of Jesus see Lives of Christ by Keim, Edersheim, Stalker, Andrews and others; Taylor Innes, Trial of Jesus Christ, a Legal Monograph, 1899; and for the historical background, Schurer, HJP.``195';
isbe[6942]='Pildash`pil\'-dash (pildash, "steely"): Nephew of Abram (<a onClick="return mV(\'Gen\',22,22);">Ge 22:22</a>).``1';
isbe[6943]='Pile`pil (medhurah, from dur, "heap up"): <a onClick="return mV(\'Isa\',30,33);">Isa 30:33</a>, "The pile thereof is fire and much wood"; <a onClick="return mV(\'Eze\',24,9,10);">Eze 24:9,10</a>, "I also will make the pile great. Heap on the wood, make the fire hot." <a onClick="return mV(\'Isa\',30,33);">Isa 30:33</a> may be paraphrased, \'the pyre thereof is of much wood, burning fiercely.\'`<a href="./study/isbe/search.html?string=TOPHETH">TOPHETH</a>`1';
isbe[6944]='Pileha`pil\'-e-ha, pi\'-le-ha.`<a href="./study/isbe/search.html?string=PILHA">PILHA</a>`1';
isbe[6945]='Pilgrim; Pilgrimage`pil\'-grim, pil\'-grimaj: "Pilgrim" in English Versions of the Bible for parepidemos (<a onClick="return mV(\'Hbr\',11,13);">Heb 11:13</a>; <a onClick="return mV(\'1Pe\',2,11);">1Pe 2:11</a>). "Pilgrimage" for maghor (<a onClick="return mV(\'Gen\',47,9);">Ge 47:9</a> (the Revised Version margin "sojournings"); <a onClick="return mV(\'Psa\',119,54);">Ps 119:54</a>; and (the King James Version) <a onClick="return mV(\'Exd\',6,4);">Ex 6:4</a> (the Revised Version (British and American) "sojournings")). Both the Hebrew (see <a href="./study/isbe/search.html?string=GER">GER</a>) and Greek words contain the idea of foreign residence, but it is the residence and not travel that is implied. Consequently "pilgrim" is a poor translation, and "sojourner," "sojourning" should have been used throughout. In the New Testament passages heaven is thought of as the contrasted permanent dwelling-place, while the Old Testament usages seem to be without a contrast definitely in mind.``1';
isbe[6946]='Pilha`pil\'-ha (pilcha\', "ploughman" (plowman); the King James Version Pileha): One of those who signed Nehemiah\'s covenant (<a onClick="return mV(\'Neh\',10,24);">Ne 10:24</a>)``1';
isbe[6947]='Pill``<a href="./study/isbe/search.html?string=PEEL">PEEL</a>`1';
isbe[6948]='Pillar`pil\'-ar (matstsebhah, \'ammudh; stulos): In a good many cases the Revised Version (British and American) substitutes "pillars" for the King James Version "images" (matstsebhoth, <a onClick="return mV(\'Exd\',34,13);">Ex 34:13</a>; <a onClick="return mV(\'Deu\',7,5);">De 7:5</a>; <a onClick="return mV(\'1Ki\',14,23);">1Ki 14:23</a>, etc.). In <a onClick="return mV(\'Gen\',19,26);">Ge 19:26</a>, where "pillar of salt" is given, the word is netsibh; in <a onClick="return mV(\'1Sa\',2,8);">1Sa 2:8</a> it is matsuq; while in most other single uses the Revised Version margin gives variant renderings, as in <a onClick="return mV(\'Jdg\',9,6);">Jud 9:6</a> (mutstsabh), the Revised Version margin "garrison"; in <a onClick="return mV(\'1Ki\',10,12);">1Ki 10:12</a> (mic\'adh), the Revised Version margin "\'a railing,\' Hebrew \'a prop\'"; in <a onClick="return mV(\'2Ki\',18,16);">2Ki 18:16</a> (\'omenoth), the Revised Version margin "doorposts." The matstsebhoth were (1) memorial pillars, as in the "pillars" of Jacob at Bethel (<a onClick="return mV(\'Gen\',28,18,22);">Ge 28:18,22</a>; compare <a onClick="return mV(\'Gen\',31,13);">Ge 31:13</a>; <a onClick="return mV(\'Gen\',35,14);">35:14</a>), in covenant with Laban (<a onClick="return mV(\'Gen\',31,45);">Ge 31:45</a>), at Rachel\'s grave (<a onClick="return mV(\'Gen\',35,20);">Ge 35:20</a>); Absalom\'s pillar (<a onClick="return mV(\'2Sa\',18,18);">2Sa 18:18</a>). Such pillars were legitimate (theory of a fetishistic character is not grounded); it is predicted in <a onClick="return mV(\'Isa\',19,19);">Isa 19:19</a> that such a pillar would be set up to Yahweh at the border of Egypt. (2) Idolatrous pillars, in Canaanitish and other heathen worships. These were to be ruthlessly broken down (the King James Version "images," see above; <a onClick="return mV(\'Exd\',23,24);">Ex 23:24</a>; <a onClick="return mV(\'Exd\',34,13);">34:13</a>; <a onClick="return mV(\'Deu\',7,5);">De 7:5</a>, etc.; compare <a onClick="return mV(\'Lev\',26,1);">Le 26:1</a>). See <a href="./study/isbe/search.html?string=IMAGES">IMAGES</a>. The other word, \'ammudh, is used of the pillar of cloud and fire (see below); of the pillars of the tabernacle and temple (see under the word); of the two pillars <a href="./study/isbe/search.html?string=JACHIN+AND+BOAZ">JACHIN AND BOAZ</a> (which see); poetically of the "pillars" of heaven, of earth (<a onClick="return mV(\'Job\',9,6);">Job 9:6</a>; <a onClick="return mV(\'Job\',26,11);">26:11</a>; <a onClick="return mV(\'Psa\',75,3);">Ps 75:3</a>; <a onClick="return mV(\'Psa\',99,7);">99:7</a>), etc. In the few instances of the word in the New Testament, the use is figurative. James, Cephas and John were reputed to be pillars" of the church at Jerusalem (<a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>); the church is "the pillar and ground of the truth" (<a onClick="return mV(\'1Ti\',3,15);">1Ti 3:15</a>); he that overcomes is made "a pillar" in the temple of God (<a onClick="return mV(\'Rev\',3,12);">Re 3:12</a>); a strong angel had feet "as pillars of fire" (<a onClick="return mV(\'Rev\',10,1);">Re 10:1</a>).<P>Pillar of Cloud and Fire:<P>The visible manifestation of the divine presence in the journeyings of Israel at the time of the Exodus. Yahweh, it is narrated, went before the people "by day in a pillar of cloud, to lead them the way, and by night in a pillar of fire, to give them light ..... The pillar of cloud by day, and the pillar of fire by night, departed not from before the people" (<a onClick="return mV(\'Exd\',13,21,22);">Ex 13:21,22</a>; compare <a onClick="return mV(\'Exd\',14,19,24);">Ex 14:19,24</a>; <a onClick="return mV(\'Num\',14,14);">Nu 14:14</a>). When the congregation was at rest, the cloud abode over the tabernacle (<a onClick="return mV(\'Exd\',40,36);">Ex 40:36</a>; <a onClick="return mV(\'Num\',9,17);">Nu 9:17</a>; <a onClick="return mV(\'Num\',14,14);">14:14</a>). When Yahweh wished to communicate His will to Moses, the pillar descended to the door of the Tent of Meeting (<a onClick="return mV(\'Exd\',33,\'9-11\');">Ex 33:9-11</a>; <a onClick="return mV(\'Num\',12,5);">Nu 12:5</a>; <a onClick="return mV(\'Deu\',31,15);">De 31:15</a>). These descriptions are not to be rationalistically explained; what is depicted is a true theophany. Criticism has sought to establish discrepancies between the allusions to the cloud in the JE and the P parts of the narrative, but these are not made out without straining; e.g. it is not the case that JE alone represents Yahweh as speaking with Moses in the cloud at the door of the tabernacle. The same representation is found in <a onClick="return mV(\'Exd\',29,42,43);">Ex 29:42,43</a>, ascribed to Pillar. An acute discussion of the alleged discrepancies may be seen in H.M. Wiener, Essays in Pentateuchal Criticism, 82ff.``132';

isbe[6954]='Piltai`pil\'-ti, pil-ta\'-i (piltay, probably "Yahweh delivers"): One of the priests, described as "the chiefs of the fathers," in the days of Joiakim (<a onClick="return mV(\'Neh\',12,17);">Ne 12:17</a>).``1';
isbe[6955]='Pin`(yathedh, from yathadh, "to drive in a peg"(?)): A cylindrical piece of wood or metal (e.g. brass, <a onClick="return mV(\'Exd\',27,19);">Ex 27:19</a>) such as that used by weavers in beating up the woof in the loom (<a onClick="return mV(\'Jdg\',16,14);">Jud 16:14</a>, where Delilah fastened Samson\'s hair with the "pin"); or as a peg for hanging (<a onClick="return mV(\'Eze\',15,3);">Eze 15:3</a>; compare <a onClick="return mV(\'Isa\',22,23);">Isa 22:23</a>f; <a onClick="return mV(\'Ezr\',9,8);">Ezr 9:8</a>); or as a tent-pin, such as those used in the tabernacle (<a onClick="return mV(\'Exd\',27,19);">Ex 27:19</a>; <a onClick="return mV(\'Exd\',35,18);">35:18</a>; <a onClick="return mV(\'Exd\',38,20,31);">38:20,31</a>; <a onClick="return mV(\'Exd\',39,40);">39:40</a>; <a onClick="return mV(\'Num\',3,37);">Nu 3:37</a>; <a onClick="return mV(\'Num\',4,32);">4:32</a>; <a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>, where the King James Version translates "nail," the Revised Version (British and American) "tent-pin"; compare <a onClick="return mV(\'Jdg\',5,26);">Jud 5:26</a>, where Hebrew has the same word, English Versions of the Bible "nail"). The tent-pin, like that of today, was probably sharpened at one end (<a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>) and so shaped at the other as to permit the attaching of the cords so frequently mentioned in the same connection (<a onClick="return mV(\'Exd\',35,18);">Ex 35:18</a>; <a onClick="return mV(\'Exd\',39,40);">39:40</a>; <a onClick="return mV(\'Num\',3,37);">Nu 3:37</a>; <a onClick="return mV(\'Num\',4,32);">4:32</a>; compare <a onClick="return mV(\'Isa\',33,20);">Isa 33:20</a>). From the acts of driving in the tent-pin (Taqa\') and pulling it out (nasa\') are derived the technical Hebrew terms for pitching a tent and for breaking camp.`<a href="./study/isbe/search.html?string=CRISPING+PINS">CRISPING PINS</a>; <a href="./study/isbe/search.html?string=STAKE">STAKE</a>`81';
isbe[6956]='Pine`pin.`<a href="./study/isbe/search.html?string=PINING+SICKNESS">PINING SICKNESS</a>`1';
isbe[6957]='Pine Tree`pin tre: (1) \'ets shemen, translated the Revised Version (British and American) "wild olive," the King James Version "pine" (<a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>); the Revised Version (British and American) "oil-tree," m "oleaster" (<a onClick="return mV(\'Isa\',41,19);">Isa 41:19</a>); "olive-wood" (<a onClick="return mV(\'1Ki\',6,23);">1Ki 6:23</a>,<a onClick="return mV(\'1Ki\',6,\'31-33\');">31-33</a>). See <a href="./study/isbe/search.html?string=OIL+TREE">OIL TREE</a>. (2) tidhhar (<a onClick="return mV(\'Isa\',41,19);">Isa 41:19</a>, margin "plane"; <a onClick="return mV(\'Isa\',60,13);">Isa 60:13</a>); peuke, "fir." Lagarde, from similarity of tidhhar to the Syriac deddar, usually the "elm," considers this the best translation. Symmachus also translated tidhhar (<a onClick="return mV(\'Isa\',41,19);">Isa 41:19</a>) by ptelea, the "elm." The elm, Ulmus campestris, is rare in Palestine and the Lebanon, though it is found today N. of Aleppo. Post (HDB, III, 592-93) considers that<P>(1) should be translated as "pine," which he describes as a "fat wood tree"; it is perhaps as probably a correct translation for<P>(2), but great uncertainty remains.<P>Two species of pine are plentiful in the Lebanon and flourish in most parts of Palestine when given a chance. These are the stone pine, Pinus pinea, and the Aleppo pine, P. halepensis; all the highlands looking toward the sea are suited to their growth.``117';
isbe[6958]='Pining Sickness`pin\'-ing, sik\'-nes: In the account of the epileptic boy in <a onClick="return mV(\'Mar\',9,18);">Mr 9:18</a> it is said that "he pineth away." The verb used here (xeraino) means "to dry up," and is the same which is used of the withering of plants, but seldom used in this metaphorical sense. The English word is from the Anglo-Saxon pinjan and is often found in the Elizabethan literature, occurring 13 times in Shakespeare. In the Old Testament it is found in <a onClick="return mV(\'Lev\',26,39);">Le 26:39</a> (bis) and in <a onClick="return mV(\'Eze\',24,23);">Eze 24:23</a> and <a onClick="return mV(\'Eze\',33,10);">33:10</A>. In the Revised Version (British and American) it replaces "consume" in <a onClick="return mV(\'Eze\',4,17);">Eze 4:17</a>. In all these passages it is the rendering of the Hebrew maqaq, and means expressly being wasted on account of sin. In <a onClick="return mV(\'Lev\',26,16);">Le 26:16</a> "pine away" is used in the Revised Version (British and American) to replace "cause sorrow of heart," and is the translation of the Hebrew dubh; and in <a onClick="return mV(\'Deu\',28,65);">De 28:65</a> "sorrow of mind" is also replaced in the Revised Version (British and American) by "pining of soul," the word so rendered being de\'abhon, which in these two passages is expressive of homesickness. In <a onClick="return mV(\'Isa\',24,16);">Isa 24:16</a> the reduplicated exclamation, "my leanness," of the King James Version is changed into "I pine away," the word being razi. The starving people in <a onClick="return mV(\'Lam\',4,9);">La 4:9</a> are said to pine away, the word so translated being zubh. All these Hebrew words have a general meaning of to dry or to waste or wear away, or to be exhausted by morbid discharges.<P>Pining sickness in <a onClick="return mV(\'Isa\',38,12);">Isa 38:12</a> the King James Version is a mistranslation, the word so rendered, dallah, meaning here the thrum by which the web is tied to the loom. The figure in the verse is that Hezekiah\'s life is being removed from the earth by his sickness as the web is removed from the loom by having the thrums cut, and being then rolled up. Both the King James Version margin and the Revised Version margin have the correct reading, "from the thrum." Septuagint has erithou eggizouses ektemein, and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) dum adhuc ordirer, succidit me. The other reading is due to another interpretation of the word which in a few passages, as <a onClick="return mV(\'Jer\',52,15);">Jer 52:15</a>, like its root dal, means something small, poor, and decaying or weak, such as the lean kine of Pharaoh\'s dream (<a onClick="return mV(\'Gen\',41,19);">Ge 41:19</a>).``107';
isbe[6959]='Pinion`pin\'-yun (\'ebher, \'ebhrah): the Revised Version (British and American) has translated these Hebrew words uniformly by "pinion," where the King James Version uses either "wing" or "feathers," with which words they stand in parallelism in all passages. The shorter Hebrew word is found only once, in Yahweh\'s parable to Ezekiel: "A great eagle with great wings and long pinions (the King James Version "longwinged"), full of feathers, which had divers colors, came unto Lebanon, and took the top of the cedar" (<a onClick="return mV(\'Eze\',17,3);">Eze 17:3</a>). The feminine form (\'ebhrah) is used of the wings of the dove (<a onClick="return mV(\'Psa\',68,13);">Ps 68:13</a>), of the ostrich (<a onClick="return mV(\'Job\',39,13);">Job 39:13</a>) and of the eagle (<a onClick="return mV(\'Deu\',32,11);">De 32:11</a>). Once (<a onClick="return mV(\'Psa\',91,4);">Ps 91:4</a>) it stands in a figurative expression for the protective care of Yahweh, which is bestowed on those that trust in Him.``106';
isbe[6960]='Pinnacle`pin\'-a-k\'-l (pterugion (<a onClick="return mV(\'Mat\',4,5);">Mt 4:5</a>; <a onClick="return mV(\'Luk\',4,9);">Lu 4:9</a>, the Revised Version margin "wing")) "The pinnacle of the temple" is named as the place to which the devil took Jesus, and there tempted Him to cast Himself down. It is not known what precise elevated spot is meant, whether a part of the roof of the temple itself, or some high point in the adjacent buildings overlooking the deep ravine. It was more probably the latter.``1';
isbe[6961]='Pinon`pi\'-non (pinon, "darkness"): One of the "chiefs of Edom" (<a onClick="return mV(\'Gen\',36,41);">Ge 36:41</a>; <a onClick="return mV(\'1Ch\',1,52);">1Ch 1:52</a>).``1';
isbe[6962]='Pipe`pip.`<a href="./study/isbe/search.html?string=CANDLESTICK">CANDLESTICK</a>; <a href="./study/isbe/search.html?string=LAMP">LAMP</a>; <a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[6963]='Pira`pi\'-ra (hoi ek Peirds (1Esdras 5:19)): Thought to be a repetition of <a href="./study/isbe/search.html?string=CAPHIRA">CAPHIRA</a> (which see) earlier in the verse.``1';
isbe[6964]='Piram`pi\'-ram (pir\'am, "indomitable"): King of Jarmuth, one of the five Amorite kings who leagued themselves against Joshua\'s invasion (<a onClick="return mV(\'Jos\',10,3);">Jos 10:3</a>).``1';
isbe[6965]='Pirathon; Pirathonite`pir\'-a-thon, pir\'-a-thon-it (pir\'athon, pir\'athoni; Codex Vaticanus Pharathom; Codex Alexandrinus Phraathom, Pharathuneites): The home of Abdon the son of Hillel the Pirathonite (<a onClick="return mV(\'Jdg\',12,13);">Jud 12:13</a> the King James Version), where also he was buried, "in the land of Ephraim in the mount of the Amalekites." The latter name may have clung to a district which at some former time had been held by the Amalekites. From this town also came Benaiah, one of David\'s chief captains (<a onClick="return mV(\'2Sa\',23,30);">2Sa 23:30</a>; <a onClick="return mV(\'1Ch\',11,31);">1Ch 11:31</a>; <a onClick="return mV(\'1Ch\',27,14);">27:14</a>). It is probably to be identified with Fer\'ata, about 6 miles southwest of Nablus. A possible rival is Fir\'on, 15 miles west of Nablus. G.A. Smith suggests a position at the head of Wady Far\'ah (HGHL, 355). Moore thinks it may have been in Benjamin, Abdon being a Benjamite family (<a onClick="return mV(\'1Ch\',8,23,30);">1Ch 8:23,30</a>; <a onClick="return mV(\'1Ch\',9,36);">9:36</a>). It is just possible that the place may be identical with Pharathon, one of the towns fortified by Bacchides (1Macc 9:50).``54';
isbe[6966]='Pisgah`piz\'-ga (ha-picgah; Phasga, to lelaxeumenon, he laxeute): This name, which has always the definite article, appears only in combination either with ro\'sh, "head," "top," or \'ashdoth, not translated in the King James Version save in <a onClick="return mV(\'Deu\',4,49);">De 4:49</a>, where it is rendered "springs" the Revised Version (British and American) uniformly "slopes," the Revised Version margin "springs."<P>Pisgah is identified with Nebo in <a onClick="return mV(\'Deu\',34,1);">De 34:1</a>; compare <a onClick="return mV(\'Deu\',3,27);">3:27</a>. "The top of Pisgah, which looketh down upon the desert" marks a stage in the march of the host of Israel (<a onClick="return mV(\'Num\',21,20);">Nu 21:20</a>). Hither Balak brought Balaam to the field of Zophim (<a onClick="return mV(\'Num\',23,14);">Nu 23:14</a>). Here Moses obtained his view of the Promised Land, and died. See <a href="./study/isbe/search.html?string=NEBO">NEBO</a>. Many scholars (e.g. Buhl, GAP, 122; Gray, "Numbers," ICC, 291) take Pisgah as the name applying to the mountain range in which the Moab plateau terminates to the west, the "top" or "head" of Pisgah being the point in which the ridge running out westward from the main mass culminates. The summit commands a wide view, and looks down upon the desert. The identification is made surer by the name Tal\'at es-Sufa found here, which seems to correspond with the field of Zophim.<p>\'Ashdoth is the construct plural of \'ashedhah (singular form not found), from \'eshedh, "foundation," "bottom," "lower part" (slope); compare Assyrian ishdu, "foundation." Some would, derive it from Aramaic \'ashadh, "to pour," whence "fall" or "slope" (OHL, under the word). Ashdoth-pisgah overlooked the Dead Sea from the east (<a onClick="return mV(\'Deu\',3,17);">De 3:17</a>; <a onClick="return mV(\'Deu\',4,49);">4:49</a>; <a onClick="return mV(\'Jos\',12,3);">Jos 12:3</a>; <a onClick="return mV(\'Jos\',13,20);">13:20</a>). There can be no reasonable doubt that Ashdoth-pisgah signifies the steep slopes of the mountain descending into the contiguous valleys.<P>It is worthy of note that Septuagint does not uniformly render Pisgah by a proper name, but sometimes by a derivative of laxeuo, "to hew" or "to dress stone" (<a onClick="return mV(\'Num\',21,20);">Nu 21:20</a>; <a onClick="return mV(\'Num\',23,14);">23:14</a>; <a onClick="return mV(\'Deu\',3,27);">De 3:27</a>; <a onClick="return mV(\'Deu\',4,49);">4:49</a>). Jerome (Onomasticon, under the word Asedoth) gives abscisum as the Latin equivalent of Fasga. He derives Pisgah from pacagh, which, in new Hebrew, means "to split," "to cut off." This suggests a mountain the steep sides of which give it the appearance of having been "cut out." This description applies perfectly to Jebel Neba as viewed from the Dead Sea.``54';
isbe[6967]='Pishon; Pison`pi\'-shon pi\'-son (pishon; the King James Version): A river of <a href="./study/isbe/search.html?string=EDEN">EDEN</a> (which see), said to compass the whole land of Havilah where there is gold, bdellium and onyx stone (<a onClick="return mV(\'Gen\',2,11);">Ge 2:11</a>), most probably identified with the Karun River which comes down from the mountains of Media and formerly emptied into the Persian Gulf.``1';
isbe[6968]='Pisidia`pi-sid\'-i-a (ten Pisidian (<a onClick="return mV(\'Act\',14,24);">Ac 14:24</a>); in <a onClick="return mV(\'Act\',13,14);">Ac 13:14</a>, Codices Sinaitica, Alexandrinus, Vaticanus, Ephraemi give Antiocheian ten Pisidian, "the Pisidian Antioch," the other manuscripts, Antiocheian tes Pisidias, "Antioch of Pisidia." The former, but not the latter, reading correctly describes the condition of affairs at the time when Paul traveled in the country; see below):<P>1. Situation and History:<P>Pisidia, as a strict geographical term, was the name given to the huge block of mountain country stretching northward from the Taurus range where the latter overlooked the Pamphylian coast land, to the valleys which connected Apamea with Antioch, and Antioch with Iconium. It was bounded by Lycia on the west, by the Phrygian country on the north, and by Isauria on the east; but there is no natural boundary between Pisidia and Isauria, and the frontier was never strictly drawn. The name is used in its geographical sense in the Anabasis of Xenophon, who informs us that the Pisidians were independent of the king of Persia at the end of the 5th century BC. Alexander the Great had difficulty in reducing the Pisidian cities, and throughout ancient history we find the Pisidian mountains described as the home of a turbulent and warlike people, given to robbery and pillage. The task of subjugating them was entrusted by the Romans to the Galatian king Amyntas, and, at his death in 25 BC, Pisidia passed with the rest of his possessions into the Roman province Galatia. Augustus now took seriously in hand the pacification of Pisidia and the Isaurian mountains on the east Five military colonies were founded in Pisidia and the eastern mountains—Cremna, Comama, Olbasa, Parlais and Lystra—and all were connected by military roads with the main garrison city Antioch, which lay in Galatian Phrygia, near the northern border of Pisidia. An inscription discovered in 1912 shows that Quirinius, who is mentioned in <a onClick="return mV(\'Luk\',2,2);">Lu 2:2</a> as governor of Syria in the year of Christ\'s birth, was an honorary magistrate of the colony of Antioch; his connection with Antioch dates from his campaign against the Homonades—who had resisted and killed Amyntas—about 8 BC (see Ramsay in The Expositor, November, 1912, 385ff, 406). The military system set up in Pisidia was based on that of Antioch, and from this fact, and from its proximity to Pisidia, Antioch derived its title "the Pisidian," which served to distinguish it from the other cities called Antioch. It is by a mistake arising from confusion with a later political arrangement that Antioch is designated "of Pisidia" in the majority of the manuscripts.<P>Pisidia remained part of the province Galatia till 74 AD, when the greater (southern) part of it was assigned to the new double province Lycia-Pamphylia, and the cities in this portion of Pisidia now ranked as Pamphylian. The northern part of Pisidia continued to belong to Galatia, until, in the time of Diocletian, the southern part of the province Galatia (including the cities of Antioch and Iconium), with parts of Lycaonia and Asia, were formed Into a province called Pisidia, with Antioch as capital. Antioch was now for the first time correctly described as a city "of Pisidia," although there is reason to believe that the term "Pisidia" had already been extended northward in popular usage to include part at least of the Phrygian region of Galatia. This perhaps explains the reading "Antioch of Pisidia" in the Codex Bezae, whose readings usually reflect the conditions of the 2nd century of our era in Asia Minor. This use of the term was of course political and administrative; Antioch continued to be a city of Phrygia in the ethnical sense and a recently discovered inscription proves that the Phrygian language was spoken in the neighborhood of Antioch as late as the 3rd century of our era (see also Calder in Journal of Roman Studies, 1912, 84).<P>2. Paul in Pisidia:<P>Paul crossed Pisidia on the journey from Perga to Antioch referred to in <a onClick="return mV(\'Act\',13,14);">Ac 13:14</a>, and again on the return journey, <a onClick="return mV(\'Act\',14,24);">Ac 14:24</a>. Of those journeys no details are recorded in Acts, but it has been suggested by Conybeare and Howson that the "perils of rivers" and "perils of robbers" mentioned by Paul in <a onClick="return mV(\'2Cr\',11,26);">2Co 11:26</a> refer to his journeys across Pisidia, and Ramsay has pointed out in confirmation of this view that a considerable number of Pisidian inscriptions refer to the armed policemen and soldiers who kept the peace in this region, while others refer to a conflict with robbers, or to an escape from drowning in a river (The Church in the Roman Empire, 23f; compare Journal of Roman Studies,1912, 82f). Adada, a city off Paul\'s route from Perga to Antioch, is called by the Turks Kara Baulo; "Baulo" is the Turkish pronunciation of "Paulos," and the name is doubtless reminiscent of an early tradition connecting the city with Paul. Pisidia had remained unaffected by Hellenic civilization, and the Roman occupation at the time of Paul was purely military. It is therefore unlikely that Paul preached in Pisidia. Except on the extreme northwest, none of the Christian inscriptions of Pisidia—in glaring contrast with those of Phrygia—date before the legal recognition of Christianity under Constantine.<P>LITERATURE.<P>Murray, Handbook of Asia Minor, 150ff; Ramsay, The Church in the Roman Empire, 18ff; Lanckoronski, Stadte Pamphyliens und Pisidiens; Sterrett, Epigraphical Journey and Wolfe Expedition. A few inscriptions containing Pisidian names with native inflections have been published by Ramsay in Revue des universites du midi,1895, 353ff.``20';
