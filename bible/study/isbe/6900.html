isbe[6969]='Pison`pi\'-son.`<a href="./study/isbe/search.html?string=PISHON">PISHON</a>`1';
isbe[6970]='Pispa`pis\'-pa (picpa\', "dipersion," the King James Version Pispah): A son of Jether, an Asherite (<a onClick="return mV(\'1Ch\',7,38);">1Ch 7:38</a>).``1';
isbe[6971]='Pit`The word translates different Hebrew words of which the most important are:<P>(1) bor, "pit" or "cistern," made by digging, (<a onClick="return mV(\'Gen\',37,20);">Ge 37:20</a>); hence, "dungeon" (<a onClick="return mV(\'Jer\',38,6);">Jer 38:6</a>, margin "pit");<P>(2) be\'er, "pit" or "well" made by digging (<a onClick="return mV(\'Gen\',21,25);">Ge 21:25</a>);<P>(3) she\'ol, generally rendered "hell" in the King James Version (see <a href="./study/isbe/search.html?string=HELL">HELL</a>);<P>(4) shachath, a pit in the ground to catch wild animals. (1), (2) and (4) above are used metaphorically of the pit of the "grave" or of "sheol" (<a onClick="return mV(\'Psa\',28,1);">Ps 28:1</a>; <a onClick="return mV(\'Psa\',30,3);">30:3</a>; <a onClick="return mV(\'Job\',33,24);">Job 33:24</a>). the King James Version sometimes incorrectly renders (4) by "corruption."<P>(5) pachath, "pit," literally (<a onClick="return mV(\'2Sa\',17,9);">2Sa 17:9</a>), and figuratively (<a onClick="return mV(\'Jer\',48,43);">Jer 48:43</a>).<P>In the New Testament "pit" renders bothunos (<a onClick="return mV(\'Mat\',15,14);">Mt 15:14</a>), which means any kind of hole in the ground. In the corresponding passage Luke (<a onClick="return mV(\'Luk\',14,15);">14:5</a> the King James Version) has phrear, "well," the same as (2) above. For "bottomless pit" (<a onClick="return mV(\'Rev\',9,1);">Re 9:1</a>, the King James Version, etc.).`<a href="./study/isbe/search.html?string=ABYSS">ABYSS</a>`103';
isbe[6972]='Pitch`pich: The translation of the noun kopher, and the verb kaphar, in <a onClick="return mV(\'Gen\',6,14);">Ge 6:14</a> and of the noun zepheth, in <a onClick="return mV(\'Exd\',2,3);">Ex 2:3</a>; <a onClick="return mV(\'Isa\',34,9);">Isa 34:9</a>. In <a onClick="return mV(\'Gen\',6,14);">Ge 6:14</a> the words are the ordinary forms for "covering," "cover," so that the translation "pitch" is largely guesswork, aided by the Septuagint, which reads asphaltos, "bitumen," here, and by the fact that pitch is a usual "covering" for vessels. The meaning of zepheth, however, is fixed by the obvious Dead Sea imagery of <a onClick="return mV(\'Isa\',34,\'9-15\');">Isa 34:9-15</a>—the streams and land of Edom are to become burning bitumen, like the sites of Sodom and Gomorrah. In <a onClick="return mV(\'Exd\',2,3);">Ex 2:3</a> zepheth is combined with chemar, which also means bitumen (<a onClick="return mV(\'Gen\',14,10);">Ge 14:10</a>; see <a href="./study/isbe/search.html?string=SLIME">SLIME</a>), and the distinction between the words (different consistencies of the same substance?) is not clear.``48';
isbe[6973]='Pitcher`pich\'-er (kadh; keramion): The word is found chiefly in the Old Testament in the story of Rebekah in <a onClick="return mV(\'Gen\',24,13);">Ge 24:13</a>ff; but Gideon\'s men also had their lamps in pitchers (<a onClick="return mV(\'Jdg\',7,16,19);">Jud 7:16,19</a>). Ecclesiastes speaks of the pitcher broken at the fountain (<a onClick="return mV(\'Ecc\',12,6);">12:6</a>). The single use in the New Testament is in <a onClick="return mV(\'Mar\',14,13);">Mr 14:13</a> parallel <a onClick="return mV(\'Luk\',22,10);">Lu 22:10</a>. The pitcher was an earthenware vessel (compare <a onClick="return mV(\'Lam\',4,2);">La 4:2</a>, nebhel), with one or two handles, used for carrying water, and commonly borne upon the head or shoulder (compare <a onClick="return mV(\'Gen\',24,1);">Ge 24</a>).``1';
isbe[6974]='Pithom`pi\'-thom (pithom; Peitho (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>)):<P>1. Meaning of Name:<P>Champollion (Gesenius, Lexicon, under the word) considered this name to mean "a narrow place" in Coptic, but it is generally explained to be the Egyptian Pa-tum, or "city of the setting sun." It was one of the cities built by the Hebrews (see <a href="./study/isbe/search.html?string=RAAMSES">RAAMSES</a>), and according to Wessel was the Thoum of the Antonine Itinerary.<P>Brugsch (History of Egypt,1879,II, 343) says that it was identical with "Heracleopolis Parva, the capital of the Sethroitic nome in the age of the Greeks and Romans...half-way on the great road from Pelusium to Tanis (Zoan), and this indication given on the authority of the itineraries furnishes the sole means of fixing its position." This is, however, disputed. Tum was worshipped at Thebes, at Zoan, and probably at Bubastis, while Heliopolis (Brugsch, Geogr., I, 254) was also called Pa-tum.<P>There were apparently several places of the name; and Herodotus (ii.158) says that the Canal of Darius began a little above Bubastis, "near the Arabian city Patournos," and reached the Red Sea.<P>2. Situation:<P>(1) Dr. Naville\'s Theory.<P>In 1885 Dr. E. Naville discovered a Roman milestone of Maximian and Severus, proving that the site of Heroopolis was at Tell el Machutah ("the walled mound") in Wady Tumeilat. The modern name he gives as Tell el Maskhutah, which was not that heard by the present writer in 1882. This identification had long been supposed probable. Excavations at the site laid bare strong walls and texts showing the worship of Tum. None was found to be older than the time of Rameses II—who, however, is well known to have defaced older inscriptions, and to have substituted his own name for that of earlier builders. A statue of later date, bearing the title "Recorder of Pithom," was also found at this same site. Dr. Naville concluded that this city must be the Old Testament Pithom, and the region round it Succoth—the Egyptian T-k-u (but see <a href="./study/isbe/search.html?string=SUCCOTH">SUCCOTH</a>). Brugsch, on the other hand, says that the old name of Heropolis was Qes (see <a href="./study/isbe/search.html?string=GOSHEN">GOSHEN</a>), which recalls the identification of the Septuagint (<a onClick="return mV(\'Gen\',46,28);">Ge 46:28</a>); and elsewhere (following Lepsius) he regards the same site as being "the Pa-Khetam of Rameses II" (see <a href="./study/isbe/search.html?string=ETHAM">ETHAM</a>), which Lepsius believed to be the Old Testament Rameses (see <a href="./study/isbe/search.html?string=RAAMSES">RAAMSES</a>) mentioned with Pithom (Brugsch, Geogr., I,302,262). Silvia in 385 AD was shown the site of Pithom near Heroopolis, but farther east, and she distinguishes the two; but in her time, though Heroopolis was a village, the site of Pithom was probably conjectural. In the time of Minepthah, son of Rameses II (Brugsch, History, II, 128), we have a report that certain nomads from Aduma (or Edom) passed through "the Khetam (or fort) of Minepthah-Hotephima, which is situated in T-k-u, to the lakes (or canals) of the city Pi-tum of Minepthah-Hotephima, which are situated in the land of T-k-u, in order to feed themselves and to feed their herds."<P>(2) Patoumos of Herodotus.<P>These places seem to have been on the eastern border of Egypt, but may have been close to the Bitter Lakes or farther north (see <a href="./study/isbe/search.html?string=SUCCOTH">SUCCOTH</a>), whereas Tell el Machutah is about 12 miles west of Ism\'ailieh, and of Lake Timsah. The definition of the Pithom thus noticed as being that of Minepthah suggests that there was more than one place so called, and the Patoumos of Herodotus seems to have been about 30 miles farther west (near Zagazig and Bubastis) than the site of Heropolis, which the Septuagint indentifies with Goshen and not with Pithom. The latter is not noticed as on the route of the Exodus, and is not identified in the Old Testament with Succoth. In the present state of our knowledge of Egyptian topography, the popular impression that the Exodus must have happened in the time of Minepthah, because Pithom was at Heropolis and was not built till the time of Rameses II, must be regarded as very hazardous. See <a href="./study/isbe/search.html?string=EXODUS">EXODUS</a>. The Patoumos of Herodotus may well have been the site, and may still be discovered near the head of Wady Tumeildt or near Bubastis.``28';
isbe[6975]='Pithon`pi\'-thon (pithon): A grandson of Meribbaal, or Mephibosheth (<a onClick="return mV(\'1Ch\',8,35);">1Ch 8:35</a>; <a onClick="return mV(\'1Ch\',9,41);">9:41</a>).``1';
isbe[6976]='Pitiful`pit\'-i-fool: As found in Scripture, means "full of pity"; it is expressed by rachamani, from rachamim (plural of racham), "bowels," "compassion" (<a onClick="return mV(\'Lam\',4,10);">La 4:10</a> the King James Version, its only occurrence in the Old Testament), "The hands of the pitiful women have sodden their own children." In <a onClick="return mV(\'Jam\',5,11);">Jas 5:11</a>, we have the beautiful saying, The Lord is very pitiful (the Revised Version (British and American) "full of pity") and of tender mercy," where "very pitiful" is the translation of polusplagchnos, literally, "of many bowels," a word which does not occur elsewhere; it might be translated "large-hearted" or "tender-hearted." In Ecclesiasticus 2:11, we have "The Lord, is...very, pitiful" (oiktirmon); eusplagchnos, well-hearted," "compassionate," "full of pity," occurs in <a onClick="return mV(\'1Pe\',3,8);">1Pe 3:8</a>, "Love as brethren, be pitiful, be courteous," the Revised Version (British and American) "loving as brethren, tenderhearted, humble-minded." The word is found in The Prayer of Manasseh 7; Testament of the Twelve Patriarchs, Zeb 8 2.``185';
isbe[6977]='Pity`pit\'-i (chamal, chuc; eleeo): "Pity," probably contracted from "piety," is tender feeling for others in misery or distress. It is allied to <a href="./study/isbe/search.html?string=COMPASSION">compassion</a> (which see), but differs in respect of the object that causes the distress (or feeling). The feeling of pity is excited chiefly by the weakness, miserable or degraded condition of the object; compassion by his uncontrollable and inevitable misfortunes: "We pity a man of weak understanding who exposes his weakness; we compassionate the man who is reduced to a state of beggary and want" (Crabb, English Synonyms). Pity often becomes allied to contempt; "a pity" is something to be regretted. See <a href="./study/isbe/search.html?string=PITIFUL">PITIFUL</a>. In the Old Testament "pity" is closely akin to "mercy." It is most frequently the translation of chamal, "to pity," "to spare," e.g. in Nathan\'s parable of the poor man\'s one lamb, it is said that the rich man was worthy to die because he had "no pity" (<a onClick="return mV(\'2Sa\',12,6);">2Sa 12:6</a>).<P>In <a onClick="return mV(\'Jer\',13,14);">Jer 13:14</a> we have, "I will not pity nor spare, nor have mercy," the Revised Version (British and American) "compassion"; compare <a onClick="return mV(\'Jer\',21,7);">21:7</a>; <a onClick="return mV(\'Lam\',2,2);">La 2:2</a>; <a onClick="return mV(\'Eze\',5,11);">Eze 5:11</a>; <a onClick="return mV(\'Eze\',7,4);">7:4</a>, in all of which passages "pity" stands in a negative connection; we have it positively attributed to God in <a onClick="return mV(\'Eze\',36,21);">Eze 36:21</a>, "I had pity for mine holy name," the Revised Version (British and American) "regard"; <a onClick="return mV(\'Joe\',2,18);">Joe 2:18</a>; chuc, probably meaning, primarily, "to cover," "protect," hence, to pity, to spare, is translated "pity" (<a onClick="return mV(\'Deu\',7,16);">De 7:16</a>; <a onClick="return mV(\'Deu\',13,8);">13:8</a>; <a onClick="return mV(\'Eze\',16,5);">Eze 16:5</a>, etc., all negative; <a onClick="return mV(\'Jon\',4,10);">Jon 4:10</a>, positive: "Thou hast had pity on the gourd (the Revised Version (British and American) "regard for") and should not I spare (the Revised Version (British and American) "have regard for," chuc) Nineveh," etc.); chanan, "to incline, toward," "be gracious," "pity," is thrice rendered "pity" (<a onClick="return mV(\'Job\',19,21);">Job 19:21</a>, "Have pity upon me, have pity upon me"; <a onClick="return mV(\'Pro\',19,17);">Pr 19:17</a>; <a onClick="return mV(\'Pro\',28,8);">28:8</a>, "he that hath pity upon the poor"); racham, "to feel warm," "to love," twice (<a onClick="return mV(\'Psa\',103,13);">Ps 103:13</a>, "like as a father pitieth his children"; <a onClick="return mV(\'Isa\',13,18);">Isa 13:18</a>, "no pity"); once in plural rachamim (<a onClick="return mV(\'Amo\',1,11);">Am 1:11</a>); other words once so translated are chemlah, "pity" (<a onClick="return mV(\'Isa\',63,9);">Isa 63:9</a>); checedh, "loving-kindness" (<a onClick="return mV(\'Job\',6,14);">Job 6:14</a>, the Revised Version (British and American) "kindness"); machmal, "object of pity" (<a onClick="return mV(\'Eze\',24,21);">Eze 24:21</a>); nudh," to move," "bemoan" (<a onClick="return mV(\'Psa\',69,20);">Ps 69:20</a>). In the New Testament "pity" occurs once only as the translation of eleeo, "to be kind," "tender" (<a onClick="return mV(\'Mat\',18,33);">Mt 18:33</a>, the Revised Version (British and American) "mercy"). In 2Macc 3:21 we have (the King James Version and the Revised Version (British and American)) "pitied" in the obsolete sense of exciting pity, "Then it would have pitied (eleein) a man to see the multitude," etc.<P>The Revised Version (British and American) has "pity" for "mercy" (<a onClick="return mV(\'Pro\',14,21);">Pr 14:21</a>); "have pity on" for "spare" (<a onClick="return mV(\'Psa\',72,13);">Ps 72:13</a>); for "favour" (<a onClick="return mV(\'Psa\',109,12);">Ps 109:12</a>; <a onClick="return mV(\'Psa\',102,13,14);">102:13,14</a>), "Have pity upon her dust."`<a href="./study/isbe/search.html?string=MERCY">MERCY</a>; <a href="./study/isbe/search.html?string=COMPASSION">COMPASSION</a>`185';
isbe[6978]='Place`plas: Normally for maqom, Old Testament, and topos, New Testament, but in the King James Version "place" represents a great number of Hebrew and Greek words, often used with no difference in force (e.g. <a onClick="return mV(\'2Ch\',35,10,15);">2Ch 35:10,15</a>). the Revised Version (British and American) has made few changes, but occasionally has attempted to specialize the meaning (<a onClick="return mV(\'Gen\',40,13);">Ge 40:13</a>; <a onClick="return mV(\'Job\',37,8);">Job 37:8</a>; <a onClick="return mV(\'Act\',8,32);">Ac 8:32</a>; <a onClick="return mV(\'Jam\',3,11);">Jas 3:11</a>, etc.).``1';
isbe[6979]='Place, Broad; High``<a href="./study/isbe/search.html?string=CITY">CITY</a>; <a href="./study/isbe/search.html?string=HIGH+PLACE">HIGH PLACE</a>; <a href="./study/isbe/search.html?string=OPEN+PLACE">OPEN PLACE</a>`1';
isbe[6980]='Plague`plag (negha\', makkah, maggephah; mastix, plege): This word which occurs more than 120 times is applied, like pestilence, to such sudden outbursts of disease as are regarded in the light of divine visitations. It is used in the description of leprosy about 60 times in <a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a> and <a onClick="return mV(\'Lev\',14,\'1-\');">14</a>, as well as in <a onClick="return mV(\'Deu\',24,8);">De 24:8</a>. In the poetical, prophetic and eschatological books it occurs about 20 times in the general sense of a punitive disaster. The Gospel references (<a onClick="return mV(\'Mar\',3,10);">Mr 3:10</a>; <a onClick="return mV(\'Mar\',5,29,34);">5:29,34</a>; <a onClick="return mV(\'Luk\',7,21);">Lu 7:21</a>) use the word as a synonym for disease.<P>The specific disease now named "plague" has been from the earliest historic times a frequent visitant to Palestine and Egypt. Indeed in the southeast between Gaza and Bubastis it has occurred so frequently that it may almost be regarded as endemic. The suddenness of its attack, the shortness of its incubation period and the rapidity of its course give it the characters which of old have been associated with manifestations of divine anger. In the early days of an epidemic it is no infrequent occurrence that 60 per cent of those attacked die within three days. I have seen a case in which death took place ten hours after the first symptoms. In the filthy and insanitary houses of eastern towns, the disease spreads rapidly. In a recent epidemic in one village of 534 inhabitants 311 died within 21 days, and I once crossed the track of a party of pilgrims to Mecca of whom two-thirds died of plague on the road. Even with modern sanitary activity, it is very difficult to root it out, as our recent experiences in Hong Kong and India have shown.<P>Of the Biblical outbreaks that were not improbably bubonic plague, the first recorded is the slaughter of the firstborn in Egypt—the 10th plague. We have too little information to identify it (<a onClick="return mV(\'Exd\',11,1);">Ex 11:1</a>). The Philistines, however, used the same name, negha\', for the Egyptian plagues (<a onClick="return mV(\'1Sa\',4,8);">1Sa 4:8</a>) as is used in Exodus. The next outbreak was at Kibroth-hataavah (<a onClick="return mV(\'Num\',11,33);">Nu 11:33</a>). This was synchronous with the phenomenal flight of quails, and if these were, as is probable, driven by the wind from the plague-stricken Serbonian region, they were equally probably the carriers of the infection. Experience in both India and China has shown that animals of very diverse kinds can carry germs of the disease. A third visitation fell on the spies who brought back an evil report (<a onClick="return mV(\'Num\',14,37);">Nu 14:37</a>). A fourth destroyed those who murmured at the destruction of Korah and his fellow-rebels (<a onClick="return mV(\'Num\',16,47);">Nu 16:47</a>). These may have been recrudescences of the infection brought by the quails. The fifth outbreak was that which followed the gross religious and moral defection at, Baal-peor (<a onClick="return mV(\'Num\',25,8,9,18);">Nu 25:8,9,18</a>; <a onClick="return mV(\'Num\',26,1);">26:1</a>; <a onClick="return mV(\'Num\',31,16);">31:16</a>; <a onClick="return mV(\'Jos\',22,17);">Jos 22:17</a>; <a onClick="return mV(\'Psa\',106,29,30);">Ps 106:29,30</a>). Here the disease was probably conveyed by the Moabites.<P>A later epidemic, which was probably of bubonic plague, was that which avenged the capture of the ark (<a onClick="return mV(\'1Sa\',5,6);">1Sa 5:6</a>). We read of the tumors which were probably the glandular enlargements characteristic of this disease; also that at the time there was a plague of rats (<a onClick="return mV(\'1Sa\',6,5);">1Sa 6:5</a>)—"mice," in our version, but the word is also used as the name of the rat. The cattle seem to have carried the plague to Beth-shemesh, as has been observed in more than one place in China (<a onClick="return mV(\'1Sa\',6,19);">1Sa 6:19</a>). Concerning the three days\' pestilence that followed David\'s census (<a onClick="return mV(\'2Sa\',24,15);">2Sa 24:15</a>; <a onClick="return mV(\'1Ch\',21,12);">1Ch 21:12</a>), see Josephus, Ant, VII, xiii, 3. The destruction of the army of Sennacherib may have been a sudden outbreak of plague (<a onClick="return mV(\'2Ki\',19,35);">2Ki 19:35</a>; <a onClick="return mV(\'Isa\',37,36);">Isa 37:36</a>). It is perhaps worthy of note that in Herodotus\' account of the destruction of this army (ii.141) he refers to the incursion of swarms of mice.<P>One of the latest prophetic mentions of plague is <a onClick="return mV(\'Hsa\',13,14);">Ho 13:14</a>, where the plague (debher, Septuagint dike) of death and the destruction (qatabh, Septuagint kentron) of the grave are mentioned. From this passage Paul quotes his apostrophe at the end of <a onClick="return mV(\'1Cr\',15,55);">1Co 15:55</a>, but the apostle correlates the sting (kentron) with death, and changes the dike into nikos.``107';
isbe[6981]='Plagues of Egypt`plagz (niphle\'oth, "wonders "from pala\', "to be separate," i.e. in a class by themselves; also called negheph, "plague," from naghaph, "to smite" (<a onClick="return mV(\'Exd\',9,14);">Ex 9:14</a>), and negha\', "a stroke," from nagha\', "to touch" (<a onClick="return mV(\'Exd\',11,1);">Ex 11:1</a>; compare <a onClick="return mV(\'Jos\',24,10);">Jos 24:10</a>)):<P><b>INTRODUCTION</b><P><b>I. NATURAL PHENOMENA</b><P class="in15">1. Water Turned to Blood<P class="in15">2. The Plague of Frogs<P class="in15">3. The Plague of Lice<P class="in15">4. The Plague of Flies<P class="in15">5. The Plague of Murrain<P class="in15">6. The Plague of Boils<P class="in15">7. The Plague of Hail<P class="in15">8. The Plague of Locusts<P class="in15">9. The Plague of Darkness<P class="in15">10. Death of the Firstborn<P><b>II. MIRACULOUS USE OF THE PHENOMENA</b><P class="in15">1. Intensification<P class="in15">2. Prediction<P class="in15">3. Discrimination<P class="in15">4. Orderliness and Increasing Severity<P class="in15">5. Arrangement to Accomplish Divine Moral Purpose<P><b>III. DIVINE MORAL PURPOSE</b><P class="in15">1. Discrediting of the gods of Egypt<P class="in15">2. Pharaoh Made to Know that Yahweh Is Lord<P class="in15">3. Revelation of God as Saviour<P class="in15">4. Exhibition of the Divine Use of Evil<P><b>LITERATURE</b><hr /><P>Introduction:<P>The Hebrew words are so used as to give the name "plagues" to all the "wonders" God did against Pharaoh. Thus, it appears that the language in the account in Exodus puts forward the wondrous character of these dealings of Yahweh with Pharaoh. The account of the plagues is found in <a onClick="return mV(\'Exd\',7,\'8-\');">Ex 7:8-12:31</a>; <a onClick="return mV(\'Psa\',78,\'42-51\');">Ps 78:42-51</a>; <a onClick="return mV(\'Psa\',105,\'27-36\');">105:27-36</a>. These poetical accounts of the plagues have a devotional purpose and do not give a full historical narrative. <a onClick="return mV(\'Psa\',78,\'1-\');">Ps 78</a> omits plagues 4, 6, 9; <a onClick="return mV(\'Psa\',105,\'1-\');">Ps 105</a> omits plagues 5 and 6. Both psalms change the order of the plagues. Account of the preparation which led up to the plagues is found in the narrative of the burning bush (see <a href="./study/isbe/search.html?string=BUSH,+BURNING">BUSH, BURNING</a>), the meeting of Aaron with Moses, the gathering together of the elders of Israel for instruction and the preliminary wonders before Pharaoh (<a onClick="return mV(\'Exd\',3,\'1-\');">Ex 3</a>; <a onClick="return mV(\'Exd\',4,\'1-\');">4</a>). This preparation contemplated two things important to be kept in view in considering the plague, namely, that the consummation of plagues was contemplated from the beginning (<a onClick="return mV(\'Exd\',4,22,23);">Ex 4:22,23</a>), and that the skepticism of Israel concerning Moses authority and power was likewise anticipated (<a onClick="return mV(\'Exd\',4,1);">Ex 4:1</a>). It was thus manifestly not an age of miracles when the Israelites were expecting such "wonders" and ready to receive anything marvelous as a divine interposition. This skepticism of Israel is a valuable asset for the credibility of the account of the "wonders." The immediate occasion of the plagues was the refusal of Pharaoh to let the people have liberty for sacrifice, together with the consequent hardening of Pharaoh\'s heart. No indication of any localizing of the plagues is given except in <a onClick="return mV(\'Psa\',78,12,43);">Ps 78:12,43</a>, where the "field of Zoan" is mentioned as the scene of the contest between Yahweh and the Egyptians. But this is poetry, and the "field of Zoan" means simply the territory of the great capital Zoan. This expression might be localized in the Delta or it might extend to the whole of Egypt. Discussion of the plagues has brought out various classifications of them, some of which are philosophical, as that of Philo, others fanciful, as that of Origen. Arrangements of the order of the plagues for the purpose of moralizing are entirely useless for historical consideration of the plagues. The only order of any real value is the order of Nature, i.e. the order in which the plagues occurred, which will be found to be the order of the natural phenomena which were the embodiment of the plagues.<P>Much elaborate effort has been made to derive from the description of the plagues evidence for different documents in the narrative. It is pointed out that Moses (E) declared to Pharaoh that he would smite the waters (<a onClick="return mV(\'Exd\',7,17);">Ex 7:17</a>), and then the account, as it proceeds, tells us that Aaron smote the waters (<a onClick="return mV(\'Exd\',7,19,20);">Ex 7:19,20</a>). But this is quite in accord with the preceding statement (<a onClick="return mV(\'Exd\',4,16);">Ex 4:16</a>) that Aaron was to be the spokesman. Moses was to deal with God, Aaron with Pharaoh. Again it is noticed that some of the plagues are ascribed to the immediate agency of Yahweh, some are represented as coming through the mediation of Moses, and still others through the mediation of Moses and Aaron. Certainly this may be an exact statement of facts, and, if the facts were just so, the record of the facts affords no evidence of different documents.<P>An examination of the account of the plagues as it stands will bring them before us in a most graphic and connected story.<P>I. The Natural Phenomena.<P>All the "wonders" represented anywhere in Scripture as done by the power of God are intimately associated with natural phenomena, and necessarily so. Human beings have no other way of perceiving external events than through those senses which only deal with natural phenomena. Accordingly, all theophanies and miraculous doings are embodied in natural events.<P>The presence of Yahweh with the sacrifice by Abraham was manifested by the passing of a "smoking furnace and a burning lamp" between the pieces of the offerings (<a onClick="return mV(\'Gen\',15,17);">Ge 15:17</a> the King James Version). The majesty and power of God at Sinai were manifested in the "cloud" and the "brightness," the "voice" and the "sound of a trumpet" (<a onClick="return mV(\'Hbr\',12,19);">Heb 12:19</a>). The Holy Spirit descended "as a dove" (<a onClick="return mV(\'Mat\',3,16);">Mt 3:16</a>). The Deity of Jesus was attested on the mountain by a "voice" (<a onClick="return mV(\'Mat\',17,5);">Mt 17:5</a>). Jesus Himself was "God...manifest in the flesh" (<a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a> the King James Version). He was "found in fashion as a man\' (<a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>). And all the miracles of Jesus were coupled with sensible phenomena: He spoke to the sea and it was calm; He touched the leper and he was clean; He called to Lazarus and he came forth.<P>Yet in all these natural events, the miraculous working of God was as clearly seen as the natural phenomena. It is thus to be expected that the "wonders" of God in the land of Pharaoh should also be associated with natural events as well as manifest miraculous elements. The "blood" in the river, the "frogs" hopping about on the land, the "lice," the "flies," the "murrain," the "boils," the "hail," the "locusts," the "darkness," and the "pestilence" are all named as natural phenomena. Long familiarity with the land of Egypt has made it perfectly plain to many intelligent people, also, that nearly, if not quite, all the plagues of Egypt are still in that land as natural phenomena, and occur, when they do occur, very exactly in the order in which we find them recorded in the narrative in Exodus. But natural events in the plagues as in other "wonders" of God embodied miraculous doings.<P>1. Water Turned to Blood:<P>The first of the plagues (dam, from \'adham, "to be red" (<a onClick="return mV(\'Exd\',7,\'19-25\');">Ex 7:19-25</a>)) was brought about by the smiting of the water with the rod in the hand of Aaron, and it consisted in the defilement of the water so that it became as "blood." The waters were polluted and the fish died. Even the water in vessels which had been taken from the river became corrupt. The people were forced to get water only from wells in which the river water was filtered through the sand. There are two Egyptian seasons when, at times, the water resembles blood. At the full Nile the water is sometimes of a reddish color, but at that season the water is quite potable and the fish do not die. But a similar phenomenon is witnessed sometimes at the time of the lowest Nile just before the rise begins. Then also the water sometimes becomes defiled and very red, so polluted that the fish die (Bib. Sacra,1905,409). This latter time is evidently the time of the first plague. It would be some time in the month of May. The dreadful severity of the plague constituted the "wonder" in this first plague. The startling character of the plague is apparent when it is remembered that Egypt is the product of the Nile, the very soil being all brought down by it, and its irrigation being constantly dependent upon it. Because of this it became one of the earliest and greatest of the gods (Breasted, Development of Religion and Thought in Egypt, 3-47; "Hymn to the Nile," Records of the Past, New Series, III, 46-54). The magicians imitated this plague with their enchantments. Their success may have been by means of sleight of hand or other devices of magic, as may be seen in the East today, with claim of supernatural aid, and as used in western lands for entertainment, as mere cleverness. Or it may be, as has been suggested, that they counted upon the continuance of the plague for at least a time, and so took advantage of the materials the "wonder" had provided.<P>2. The Plague of Frogs:<P>Frogs (tsphardeim, probably "marsh-leapers" (<a onClick="return mV(\'Exd\',8,\'1-15\');">Ex 8:1-15</a>)) are very abundant just after the high Nile when the waters begin to recede. Spawn in the mud is hatched by the sun, and the marshes are filled with myriads of these creatures. The frog was the hieroglyph for myriads. The frogs usually remain in the marshes, but in this case they came forth to the horror and disgust of the people. "Frogs in the houses, frogs in the beds, frogs baked with the food in the ovens, frogs in the kneading troughs worked up with the flour; frogs with their monotonous croak, frogs with their cold slimy skins, everywhere—from morning to night, from night to morning—frogs." The frog was also associated with Divinity, was the symbol of Heqt, a form of Hathor, and seems also at times to have been worshipped as divinity. This plague created such horror that thus early Pharaoh came to an agreement (<a onClick="return mV(\'Exd\',8,\'8-10\');">Ex 8:8-10</a>). A time was set for the disappearance of the frogs that he might know that "there is none like unto Yahweh our God," but when the frogs were dead, Pharaoh hardened his heart (<a onClick="return mV(\'Exd\',8,15);">Ex 8:15</a>). In this plague "the magicians did in like manner with their enchantments" (<a onClick="return mV(\'Exd\',8,7);">Ex 8:7</a>). Frogs were plentiful, and it would not seem to be difficult to claim to have produced some of them.<P>3. The Plague of Lice:<P>It is impossible to determine what particular troublesome insect pest of Egypt is meant by the 3rd plague, whether body-lice or mosquitoes or sandflies or ticks or fleas (kinnim, "gnats" (<a onClick="return mV(\'Exd\',8,16);">Ex 8:16</a>)). Those who have experience of these pests in Egypt are quite ready to accept any of them as adequate for the plague. Lice seem rather to be ruled out, unless different kinds of lice were sent, as there is no one kind that torments both man and beast. All the other insect pests appear in incredible numbers out of the "dust" when the pools have dried up after the receding of the waters. The assertion that the account of this plague is not complete, because it is not recorded that Pharaoh asked its removal or that Moses secured it, is amazing. Perhaps Pharaoh did not, in fact, ask its removal. There seems also at this time some difficulty in Moses having access to Pharaoh after this plague (<a onClick="return mV(\'Exd\',8,20);">Ex 8:20</a>). Perhaps the plague was not removed at all. The Egyptians are disposed to think it was not! Certainly that season of the year spent in Egypt, not in a dahabiyeh on the Nile, but in a native village, will furnish very satisfying evidence that stinging and biting insects are a very real plague in Egypt yet. The magicians failed with their enchantments and acknowledged that divine power was at work, and seem to have acknowledged that Yahweh was supreme (<a onClick="return mV(\'Exd\',8,19);">Ex 8:19</a>), but Pharaoh would not heed them.<P>4. The Plague of Flies:<P>As the seasons pass on, after the recession of the waters, the flies (\'arobh, "swarms," probably of flies (<a onClick="return mV(\'Exd\',8,\'20-32\');">Ex 8:20-32</a>)) become more and more numerous until they are almost a plague every year. The increased severity of this plague, and the providential interference to separate between Israel and the Egyptians, drove Pharaoh and his people to such desperation that Pharaoh gave a half-promise of liberty for Israel to sacrifice "in the land." This called out the statement that they would sacrifice the "abomination of the Egyptians." This may have referred to the sacrifice of sheep, which were always held in more or less detestation by Egyptians, or it may have had reference to the sacrifice of heifers, the cow being the animal sacred to the goddess Hathor. The new element of separation between the Israelites and the Egyptians introduced into this plague was another step toward establishing the claims of Yahweh to be the God of all the earth and to have taken Israel under His especial care.<P>5. The Plague of Murrain:<P>In addition to the separation established between Israel and the Egyptians, a definite time is now set for the coming of the 5th plague. It is to be noticed also that diseases of cattle (debher, "destruction" (<a onClick="return mV(\'Exd\',9,\'1-7\');">Ex 9:1-7</a>)) and of men follow quickly after the plague of insects. This is in exact accord with the order of Nature as now thoroughly understood through the discovered relation of mosquitoes and flies to the spread of diseases. Rinderpest is still prevalent at times in Egypt, so that beef becomes very scarce in market and is sometimes almost impossible to obtain. It is a fact, also, that the prevalence eft cattle plague, the presence of boils among men (see 6, below) and the appearance of bubonic plague are found to be closely associated together and in this order. The mention of camels as affected by this plague is interesting. It is doubtful if any clear indication of the presence of the camel in Egypt so early as this has yet been found among the monuments of Egypt. There is in the Louvre museum one small antiquity which seems to me to be intended for the camel. But Professor Maspero does not agree that it is so. It would seem likely that the Hyksos, who were Bedouin princes, princes of the desert, would have introduced the beasts of the desert into Egypt. If they did so, that may have been sufficient reason that the Egyptians would not picture it, as the Hyksos and all that was theirs were hated in Egypt.<P>6. The Plague of Boils:<P>In the plague of boils (shechin, and \'abha\'bu\'oth, "boils" (<a onClick="return mV(\'Exd\',9,\'8-17\');">Ex 9:8-17</a>)) ashes were used, probably in the same way and to the same end as the clay was used in opening the eyes of the blind man (<a onClick="return mV(\'Jhn\',9,6);">Joh 9:6</a>), i.e. to attract attention and to fasten the mind of the observer upon what the Lord was doing. This plague in the order of its coming, immediately after the murrain, and in the description given of it and in the significant warning of the "pestilence" yet to come (<a onClick="return mV(\'Exd\',9,15);">Ex 9:15</a>), appears most likely to have been pestis minor, the milder form of bubonic plague. Virulent rinder-pest among cattle in the East is regarded as the precursor of plague among men and is believed to be of the same nature. It may well be, as has been thought by some, that the great aversion of the ancient Egyptians to the contamination of the soil by decaying animals was from the danger thereby of starting an epidemic of plague among men (Dr. Merrins, Biblical Sacra, 1908, 422-23).<P>7. The Plague of Hail:<P>Hail (baradh, "hail" (<a onClick="return mV(\'Exd\',9,\'18-35\');">Ex 9:18-35</a>)) is rare in Egypt, but is not unknown. The writer has himself seen a very little, and has known of one instance when a considerable quantity of hail as large as small marbles fell. Lightning, also, is not as frequent in Egypt as in many semi-tropical countries, yet great electric storms sometimes occur. This plague is quite accurately dated in the seasons of the year (<a onClick="return mV(\'Exd\',9,31,32);">Ex 9:31,32</a>). As the first plague was just before the rising of the Nile, so this one is evidently about 9 months later, when the new crops after the inundation were beginning to mature, January-February. This plague also marks another great step forward in the revelation of Yahweh to Israel and to the Egyptians. First only His power was shown, then His wisdom in the timing of the plagues, and now His mercy appears in the warning to all godly-disposed Egyptians to save themselves, their herds and their servants by keeping all indoors (<a onClick="return mV(\'Exd\',9,\'19-21\');">Ex 9:19-21</a>). Pharaoh also now distinctly acknowledged Yahweh (<a onClick="return mV(\'Exd\',9,27);">Ex 9:27</a>).<P>The plague of locusts (\'arbeh, "locust" (<a onClick="return mV(\'Exd\',10,\'1-20\');">Ex 10:1-20</a>)) was threatened, and so frightened were the servants of Pharaoh that they persuaded him to try to make some agreement with Moses, but the attempt of Pharaoh still to limit in some way the going of Israel thwarted the plan (<a onClick="return mV(\'Exd\',10,\'7-10\');">Ex 10:7-10</a>).<P>8. The Plague of Locusts:<P>Then devouring swarms of locusts came up over the land from the eastern desert between the Nile and the Red Sea. They devoured every green thing left by the hail. The desperate situation created by the locusts soon brought Pharaoh again to acknowledgment of Yahweh (<a onClick="return mV(\'Exd\',10,16);">Ex 10:16</a>). This was the greatest profession of repentance yet manifested by Pharaoh, but he soon showed that it was deceitful, and again he would not let the people go. When the wind had swept the locusts away, he hardened his heart once more.<P>9. The Plague of Darkness:<P>The progress of the seasons has been quite marked from the first plague, just before the rising of the waters, on through the year until now the khamsin period (choshekh, "darkness" from any cause (<a onClick="return mV(\'Exd\',10,\'21-29\');">Ex 10:21-29</a>)) has come. When this dreadful scourge comes with its hot sand-laden breath, more impenetrable than a London fog, it is in very truth a "darkness which may be felt." The dreadful horror of this monster from the desert can hardly be exaggerated. Once again Pharaoh said "Go," but this time he wished to retain the flocks and herds, a hostage for the return of the people (<a onClick="return mV(\'Exd\',10,24);">Ex 10:24</a>). Upon Moses\' refusal to accept this condition, he threatened his life. Why had he not done so ere this? Why, indeed, did he let this man Moses come and go with such freedom, defying him and his people in the very palace? Probably Moses\' former career in Egypt explains this. If, as is most probable, he had grown up at court with this Merenptah, and had been known as "the son of Pharaoh\'s daughter," heir to the throne and successor to Rameses II, instead of Merenptah, then this refugee had undoubtedly many friends still in Egypt who would make his death a danger to the reigning Pharaoh.<P>10. Death of the Firstborn:<P>No intimation is given of the exact character of the death inflicted on the firstborn (bekhor, "firstborn," "chief" or "best"; compare <a onClick="return mV(\'Job\',18,13);">Job 18:13</a>; <a onClick="return mV(\'Isa\',14,30);">Isa 14:30</a> (<a onClick="return mV(\'Exd\',11,\'1-\');">Ex 11</A>-<a onClick="return mV(\'Exd\',12,\'1-36\');">12:36</a>)) by the angel of the Lord, or its appearance. But it is already foretold as the "pestilence" (<a onClick="return mV(\'Exd\',9,15);">Ex 9:15</a>). The pestis major or virulent bubonic plague corresponds most nearly in its natural phenomena to this plague. It culminates in a sudden and overwhelming virulence, takes the strongest and best, and then subsides with startling suddenness.<P>Thus, it appears that probably all the plagues were based upon natural phenomena which still exist in Egypt in the same order, and, when they do occur, find place somewhere during the course of one year.<P>II. Miraculous Use of the Phenomena.<P>The miraculous elements in the plagues are no less distinctly manifest than the natural phenomena themselves.<P>1. Intensification:<P>There was an intensification of the effect of the various plagues so much beyond all precedent as to impress everyone as being a special divine manifestation, and it was so. There was national horror of the blood-like water, disgust at the frogs, intolerable torture by the stinging insects and flies, utter ruin of the farmers in the loss of the cattle, the beating down of the crops by the hail, and the devouring of every green thing by the locusts, the sufferings and dread of the inhabitants by reason of the boils, the frightful electric storm, the suffocating darkness and, finally, the crushing disaster of the death of the firstborn. All these calamities may be found in Egypt to the present day, but never any of them, not to say all of them, in such overwhelming severity. That all of them should come in one year and all with such devastation was plainly a divine arrangement. Merely natural events do not arrange themselves so systematically. In this systematic severity were seen miracles of power.<P>2. Prediction:<P>The prediction of the plagues and the fulfillment of the prediction at the exact time to a day, sometimes to an hour (as the cessation of the thunder and lightning): There was first a general prediction (<a onClick="return mV(\'Exd\',3,19,20);">Ex 3:19,20</a>; <a onClick="return mV(\'Exd\',7,3);">7:3</a>; <a onClick="return mV(\'Exd\',9,14,15);">9:14,15</a>) and an indication as the plagues went on that the climax would be pestilence (<a onClick="return mV(\'Exd\',9,15);">Ex 9:15</a>). Then several of the plagues were specifically announced and a time was set for them; e.g. the flies (<a onClick="return mV(\'Exd\',8,23);">Ex 8:23</a>), the murrain (<a onClick="return mV(\'Exd\',9,5);">Ex 9:5</a>), the hail (<a onClick="return mV(\'Exd\',9,18);">Ex 9:18</a>), the locusts (<a onClick="return mV(\'Exd\',10,4);">Ex 10:4</a>), the death of the firstborn (<a onClick="return mV(\'Exd\',11,4);">Ex 11:4</a>). In some cases a time for the removal of the plague was also specified: e.g. the frogs (<a onClick="return mV(\'Exd\',8,10);">Ex 8:10</a>), the thunder and lightning (<a onClick="return mV(\'Exd\',9,29);">Ex 9:29</a>). In every instance these predictions were exactly fulfilled. In some instances careful foresight might seem to supply in part this ability to predict. Perhaps it was by means of such foresight that the magicians "did so with their enchantments" for the first two plagues. The plague being in existence, foresight might safely predict that it would continue for a little time at least, so that, if the magicians sought for bloody water or called for frogs, they would seem to be successful. But the evidence which Yahweh produced went beyond them, and, at the third plague, they were unable to do anything. These things postulate, on the part of Moses and Aaron, knowledge far beyond human ken. Not only magicians could not do so with their enchantments, but modern science and discoveries are no more able so to predict events. Even meteorological phenomena are only predicted within the limits of reasonable foresight. Such wonders as the plagues of Egypt can in no wise be explained as merely natural. The prediction was a miracle of knowledge.<P>3. Discrimination:<P>The discrimination shown in the visitation by the plagues presents another miraculous element more significant and important than either the miracles of power or the miracles of knowledge. God put a difference between the Egyptians and the Israelites, beginning with the plague of flies and continuing, apparently, without exception, until the end. Such miracles of moral purpose admit of no possible explanation but the exercise of a holy will. Merely natural events make no such regular, systematic discriminations.<P>4. Orderliness and Increasing Severity:<P>The orderliness and gradually increasing severity of the plagues with such arrangement as brought "judgment upon the gods of Egypt," vindicating Yahweh as Ruler over all, and educating the people to know Yahweh as Lord of all the earth, present an aspect of events distinctly non-natural. Such method reveals also a divine mind at work.<P>5. Arrangement to Accomplish Divine Moral Purpose:<P>Last of all and most important of all, the plagues were so arranged as to accomplish in particular a great divine moral purpose in the revelation of God to the Israelites, to the Egyptians and to all the world. This is the distinctive mark of every real miracle. And this leads us directly to the consideration of the most important aspect of the plagues.<P>III. Divine Moral Purpose.<P>1. Discrediting of the gods of Egypt:<P>This discrediting of the gods of Egypt is marked at every step of the progress of the plagues, and the accumulated effect of the repeated discrediting of the gods must have had, and, indeed, had, a great influence upon the Egyptians. The plagues did \'execute judgment against the gods of Egypt\' (<a onClick="return mV(\'Exd\',12,12);">Ex 12:12</a>), and the people and princes brought great pressure to bear upon Pharaoh to let the people go (<a onClick="return mV(\'Exd\',10,7);">Ex 10:7</a>). The magicians who claimed to represent the gods of Egypt were defeated, Pharaoh himself, who was accounted divine, was humbled, the great god, the Nile, was polluted, frogs defiled the temples and, at last, the sun, the greatest god of Egypt, was blotted out in darkness.<P>2. Pharaoh Made to Know that Yahweh Is Lord:<P>Pharaoh was made to know that Yahweh is Lord, and acknowledged it (<a onClick="return mV(\'Exd\',9,27);">Ex 9:27</a>; <a onClick="return mV(\'Exd\',10,16);">10:16</a>). To this end the issue was clearly drawn. Pharaoh challenged the right of Yahweh to command him (<a onClick="return mV(\'Exd\',5,2);">Ex 5:2</a>), and God required him then to "stand" to the trial until the evidence could be fully presented, in accordance with the fundamental principle that he who makes a charge is bound to stand to it until either he acknowledges its utter falsity or affords opportunity for full presentation of evidence. So we see God made Pharaoh to "stand" (<a onClick="return mV(\'Exd\',9,16);">Ex 9:16</a>) (while the Bible, which speaks in the concrete language of life, calls it the hardening of Pharaoh\'s heart) until the case was tried out (compare Lamb, Miracle of Science, 126-49).<P>3. Revelation of God as Saviour:<P>A more blessed and gracious moral purpose of the plagues was the revelation of God as the Saviour of the world. This began in the revelation at the burning bush, where God, in fire, appeared in the bush, yet the bush was not consumed, but saved. This revelation, thus given to the people, was further evidenced by the separation between Israel and the Egyptians; was made known even to the Egyptians by the warning before the plague of hail, that those Egyptians who had been impressed with the power of God might also learn that He is a God that will save those who give heed unto Him; and, at last, reached its startling climax when the angel of the Lord passed over the blood-marked door the night of the death of the firstborn and the institution of the Passover.<P>4. Exhibition of the Divine Use of Evil:<P>Last of all, the plagues had a great moral purpose in that they embodied the divine use of evil in the experience of men in this world. As the experience of Job illustrates the use of evil in the life of the righteous, so the plagues of Egypt illustrate the same great problem of evil in the lot of the wicked. In the one case, as in the other, the wonders of God are so arranged as "to justify the ways of God to men."<P>The minutely accurate knowledge of life in Egypt displayed by this narrative in the Book of Exodus is inconceivable in an age of so little and difficult intercommunication between nations, except by actual residence of the author in Egypt. This has an important bearing upon the time of the composition of this narrative, and so upon the question of its author.<P>LITERATURE.<P>The literature of this subject is almost endless. It will suffice to refer the reader to all the general comms., and the special commentaries on Exodus, for discussion of doctrinal and critical questions. Two admirable recent discussions of the plagues, in English, are Lamb, Miracle of Science, and Merrins, "The Plagues of Egypt," in Bibliotheca Sacra,1908,July and October.``93';
isbe[6982]='Plain`plan<P>(1) kikkar, "circle" "talent," or "round loaf";<P>(2) mishor, from yashar, "to be level"; compare Arabic maisur, "that which is easy";<P>(3) biqah; compare Arabic baq\'at, "a plot of ground" or "a wet meadow";<P>(4) \'arabhah;<P>(5) shephelah;<P>(6) topos pedinos (<a onClick="return mV(\'Luk\',6,17);">Lu 6:17</a>);<P>(7) \'elon; compare elah, and \'allon "oak" (<a onClick="return mV(\'Gen\',35,4,8);">Ge 35:4,8</a>, etc.); also \'elah, "Elah" (<a onClick="return mV(\'1Sa\',17,2);">1Sa 17:2</a>);<P>(8) \'abhel):<P>See <a href="./study/isbe/search.html?string=NATURAL+FEATURES">NATURAL FEATURES</a>.<P>(1) Kikkar, when meaning "plain" usually refers to the alluvial plain about Jericho near the north end of the Dead Sea: "Plain (the Revised Version margin "circle") of the Jordan" (<a onClick="return mV(\'Gen\',13,10,11);">Ge 13:10,11</a>; <a onClick="return mV(\'1Ki\',7,46);">1Ki 7:46</a>; <a onClick="return mV(\'2Ch\',4,17);">2Ch 4:17</a>); "Plain of the valley of Jericho" (<a onClick="return mV(\'Deu\',34,3);">De 34:3</a>); "cities of the Plain" (<a onClick="return mV(\'Gen\',13,12);">Ge 13:12</a>; <a onClick="return mV(\'Gen\',19,29);">19:29</a>); "all the Plain" (<a onClick="return mV(\'Gen\',19,17,25);">Ge 19:17,25</a>); "by the way of the Plain" (<a onClick="return mV(\'2Sa\',18,23);">2Sa 18:23</a>); but "the plain round about Jerusalem" (<a onClick="return mV(\'Neh\',12,28);">Ne 12:28</a>).<P>See <a href="./study/isbe/search.html?string=CICCAR">CICCAR</a>; <a href="./study/isbe/search.html?string=CIRCLE">CIRCLE</a>.<P>(2) Mishor, English Versions of the Bible "plain," the Revised Version margin usually "table-land," clearly refers in most places to the highlands of Gilead and Moab, east of the Jordan and the Dead Sea; e.g. <a onClick="return mV(\'Jos\',13,9);">Jos 13:9</a>, "the plain (the Revised Version margin "table-land") of Medeba."<P>(3) Biq\'ah is more often translated "<a href="./study/isbe/search.html?string=VALLEY">valley</a>" (which see).<P>(4) \'Arabhah is in the Revised Version (British and American) often translated "the Arabah," denoting the whole Jordan-Dead-Sea-Arabah depression equals Arabic Ghaur (Ghor). In <a onClick="return mV(\'Deu\',11,30);">De 11:30</a>, the King James Version has "<a href="./study/isbe/search.html?string=CHAMPAIGN">champaign</a>" (which see). The "plains of Moab" (<a onClick="return mV(\'Num\',22,1);">Nu 22:1</a>; <a onClick="return mV(\'Num\',26,3,13);">26:3,13</a>; <a onClick="return mV(\'Num\',31,12);">31:12</a>; <a onClick="return mV(\'Num\',33,48,49,50);">33:48,49,50</a>; <a onClick="return mV(\'Num\',35,1);">35:1</a>; <a onClick="return mV(\'Num\',36,13);">36:13</a>; <a onClick="return mV(\'Deu\',34,1,8);">De 34:1,8</a>; <a onClick="return mV(\'Jos\',13,32);">Jos 13:32</a>) and "plains of Jericho" (<a onClick="return mV(\'Jos\',4,13);">Jos 4:13</a>; <a onClick="return mV(\'Jos\',5,10);">5:10</a>; <a onClick="return mV(\'2Ki\',25,5);">2Ki 25:5</a>; <a onClick="return mV(\'Jer\',39,5);">Jer 39:5</a>; <a onClick="return mV(\'Jer\',52,8);">52:8</a>) are the low plain or ghaur north of the Dead Sea. \'Arabhah is here equivalent to kikkar (see above). Note the distinction between mishor used of the highlands, and kikkar and \'arabhah used of the ghaur.<P>See <a href="./study/isbe/search.html?string=ARABAH">ARABAH</a>.<P>(5) Shephelah is by the Revised Version (British and American) throughout translated "<a href="./study/isbe/search.html?string=LOWLAND">lowland</a>" (which see), and includes the western slopes of the Judean hills and the maritime plain.<P>(6) Topos pedinos occurs only in <a onClick="return mV(\'Luk\',6,17);">Lu 6:17</a>.<P>(7) \'Elon is translated "plain" in the King James Version: "plain of Moreh" (<a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; <a onClick="return mV(\'Deu\',11,30);">De 11:30</a>); "plain (or plains) of Mamre" (<a onClick="return mV(\'Gen\',13,18);">Ge 13:18</a>; <a onClick="return mV(\'Gen\',14,13);">14:13</a>; <a onClick="return mV(\'Gen\',18,1);">18:1</a>); "plain of Zaanaim" (<a onClick="return mV(\'Jdg\',4,11);">Jud 4:11</a>); "plain of the pillar" (<a onClick="return mV(\'Jdg\',9,6);">Jud 9:6</a>); "plain of Meonenim" (<a onClick="return mV(\'Jdg\',9,37);">Jud 9:37</a>); "plain of Tabor" (<a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a>). the Revised Version (British and American) has throughout "oak," the Revised Version margin "terebinth"; compare "oak" (<a onClick="return mV(\'Gen\',35,4,8);">Ge 35:4,8</a>, etc.) and "vale of Elah" (<a onClick="return mV(\'1Sa\',17,2,19);">1Sa 17:2,19</a>; <a onClick="return mV(\'1Sa\',21,9);">21:9</a>).<P>(8) [\'Abhel keramim] (<a onClick="return mV(\'Jdg\',11,33);">Jud 11:33</a>) is in the King James Version "the plain of the vineyards," the Revised Version (British and American) "Abel-cheramim," the Revised Version margin "the meadow of vineyards." Elsewhere in English Versions of the Bible \'abhel is "Abel" or "Abel."<P>See <a href="./study/isbe/search.html?string=ABEL-CHERAMIM">ABEL-CHERAMIM</a>; <a href="./study/isbe/search.html?string=MEADOW">MEADOW</a>.``37';
isbe[6983]='Plain of Moab`In <a onClick="return mV(\'Deu\',1,1);">De 1:1</a>; <a onClick="return mV(\'Deu\',2,8);">2:8</a>, "plain" is translated in the Revised Version (British and American) "Arabah," and explained, "the deep valley running north and south of the Dead Sea." It was here that Moses delivered his last addresses. Ususally the word is plural (\'arebhoth), the "plains" or steppes of Moab (<a onClick="return mV(\'Num\',22,1);">Nu 22:1</a>, etc.; <a onClick="return mV(\'Deu\',34,1,8);">De 34:1,8</a>). An interesting description is given in an article on "The Steppes of Moab" by Professor G. B. Gray in The Expositor, January, 1905.`<a href="./study/isbe/search.html?string=MOAB">MOAB</a>`1';
isbe[6984]='Plain of the Pillar` (\'elon mutstsbh; Codex Vaticanus reads pros te balano te heurete tes staseos tes en Sikimois; Codex Alexandrinus omits te heurete, and the second tes): With the Revised Version margin we must read "terebinth of the pillar," the place where the men of Shechem and Beth-millo made Abimelech king (<a onClick="return mV(\'Jdg\',9,6);">Jud 9:6</a>). This was one of the sacred trees of which there seem to have been several near Shechem. "The pillar" may possibly have been the great stone which Joshua set up "under the oak that was by the sanctuary of Yahweh" (<a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>).`<a href="./study/isbe/search.html?string=MEONENIM,+OAK+OF">MEONENIM, OAK OF</a>`54';
isbe[6985]='Plain of the Vineyards``<a href="./study/isbe/search.html?string=ABEL-CHERAMIM">ABEL-CHERAMIM</a>`1';
isbe[6986]='Plain, Cities of the``<a href="./study/isbe/search.html?string=CITIES+OF+THE+PLAIN">CITIES OF THE PLAIN</a>`1';
isbe[6987]='Plain; Plainly`plan, plan\'-li: In <a onClick="return mV(\'Gen\',25,27);">Ge 25:27</a>, the King James Version "plain" represents tam. If a contrast between the vocations of Jacob and Esau is meant, the Revised Version (British and American) ("quiet," margin "harmless") may be right. But elsewhere (<a onClick="return mV(\'Job\',1,1);">Job 1:1</a>; <a onClick="return mV(\'Psa\',37,37);">Ps 37:37</a>, etc.) the word means "perfect," and so probably here; the failings of the great patriarch did not detract from the general estimate of him (<a onClick="return mV(\'Mat\',8,11);">Mt 8:11</a>). In <a onClick="return mV(\'Ezr\',4,18);">Ezr 4:18</a> "translated" (Revised Version margin) is better than "plainly read."``1';
isbe[6988]='Plaister`plas\'-ter.`<a href="./study/isbe/search.html?string=PLASTER">PLASTER</a>`1';
isbe[6989]='Plaiting`plat\'-ing, plat\'-ing (from the Old French, pleit, which is from the Latin plicatum, "fold"): An interweaving, a braiding, a knot; an elaborate gathering of the hair into knots; emploke, "outward adorning of plaiting the hair" (<a onClick="return mV(\'1Pe\',3,3);">1Pe 3:3</a>). Compare "platted" (crown of thorns) (<a onClick="return mV(\'Mat\',27,29);">Mt 27:29</a> parallel <a onClick="return mV(\'Mar\',15,17);">Mr 15:17</a>; <a onClick="return mV(\'Jhn\',19,2);">Joh 19:2</a>).`<a href="./study/isbe/search.html?string=BRAIDED,+BRAIDING">BRAIDED, BRAIDING</a>`1';
isbe[6990]='Plane`plan (<a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>).`<a href="./study/isbe/search.html?string=TOOLS">TOOLS</a>`1';
isbe[6991]='Plane Tree`plan\'-tre (\'armon; platanos (<a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a>), elate ("pine" or "fir") (<a onClick="return mV(\'Eze\',31,8);">Eze 31:8</a>); the King James Version chestnut): \'Armon is supposed to be derived from the root aram, meaning "to be bare" or "naked"; this is considered a suitable term for the plane, which sheds its bark annually. The chestnut of the King James Version is not an indigenous tree, but the plane (Planus orientalis) is one of the finest trees in Palestine, flourishing especially by water courses (compare Ecclesiasticus 24:14).``1';
isbe[6992]='Planets`plan\'-ets (mazzaloth).`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`1';
isbe[6993]='Plank`plank: Thick beams or pieces of wood, for which several Hebrew words are used. The Revised Version (British and American) changes "planks" (of fir) into "boards" in <a onClick="return mV(\'1Ki\',6,15);">1Ki 6:15</a>, and in a few instances substitutes "planks" where the King James Version has "boards" (<a onClick="return mV(\'Exd\',27,8);">Ex 27:8</a>; <a onClick="return mV(\'Exd\',38,7);">38:7</a>, the altar; <a onClick="return mV(\'Eze\',27,5);">Eze 27:5</a>). So in the New Testament in <a onClick="return mV(\'Act\',27,44);">Ac 27:44</a>, for sanis.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[6994]='Plant, Plants``<a href="./study/isbe/search.html?string=BOTANY">BOTANY</a>`1';
isbe[6995]='Plaster (1)`plas\'-ter (sidh): In Egypt, now as in ancient times, the buildings are plastered inside and out. The poor quality of the stone commonly used makes this necessary if a smooth attractive surface is desired. Among the poorer classes, clay mixed with straw is used. In Palestine and Syria, where there is a rainy season, the coating on the outside walls, if made of clay, must be frequently renewed. In Egypt burnt gypsum, and in Palestine and Syria burnt limestone (lime) are the commonest materials for making mortar. For the first coat of plastering the lime is mixed with "fat" red sand or with the ash from the bathhouse fires, and the finishing coat is composed of white sand and slaked lime with or without chopped flax straw. The plaster on some of the ancient Egyptian ruins seems to indicate that milk or some similar substance was added to the mortar to give a better surface.<P>The ancients preferred plastered surfaces for decorating, and even the finest granite was covered with stucco on which to paint or carve the decorations (<a onClick="return mV(\'Deu\',27,2);">De 27:2</a>; <a onClick="return mV(\'Dan\',5,5);">Da 5:5</a>). Columns were often first stuccoed and then painted.<P>The Arabic word for mortar is Tin, which really means "clay." The Hebrew sidh, literally, "to boil up," refers to the boiling of the water with which the lime is slaked, because of the heat generated during the slaking process. In <a onClick="return mV(\'Dan\',5,5);">Da 5:5</a> occurs gir, i.e. "burned in a kiln," which might mean either lime or gypsum. In <a onClick="return mV(\'Lev\',14,42);">Le 14:42</a> occurs Tuach, "to smear."``133';
isbe[6996]='Plaster (2)`plas\'-ter (marach): Only used in <a onClick="return mV(\'Isa\',38,21);">Isa 38:21</a> of the application of the cake of figs to the boil from which Hezekiah suffered. In Papyrus Ebers, figs are used as the ingredient in a plaster (xxxv, lxxix, lxxxiii). Dioscorides also recommends figs with other substances as a poultice in some skin diseases.``1';
isbe[6997]='Plastering`plas\'-ter-ing.`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`1';
isbe[6998]='Plate`plat: A term seemingly not used in the Bible for a dish as it is so commonly used at present, but always for a tablet or sheet of metal.<P>(1) tsits (<a onClick="return mV(\'Exd\',28,36);">Ex 28:36</a>; <a onClick="return mV(\'Exd\',39,30);">39:30</a>; <a onClick="return mV(\'Lev\',8,9);">Le 8:9</a>), a plate of gold on the front of the mitre of the high priest. The name seems to have been given because of the radiance of the object.<P>(2) pach (<a onClick="return mV(\'Exd\',39,3);">Ex 39:3</a>; <a onClick="return mV(\'Num\',16,38);">Nu 16:38</a>), of plates or sheets of metal produced by hammering.<P>(3) luach, used for tablets or tables of stone (<a onClick="return mV(\'Exd\',24,12);">Ex 24:12</a>, etc.), but in <a onClick="return mV(\'1Ki\',7,36);">1Ki 7:36</a> for the metal plates on the bases of the lavers in the temple. The word ceren, is rendered "plate" in <a onClick="return mV(\'1Ki\',7,30);">1Ki 7:30</a> the King James Version, manifestly incorrectly, the Revised Version (British and American) "axle."``13';
isbe[6999]='Platter`plat\'-er:<P>(1) qe\'arah, "a deep dish" (<a onClick="return mV(\'Num\',7,13,84,85);">Nu 7:13f; 84,85</a>). In the King James Version and the English Revised Version "charger," the American Standard Revised Version "platter" (compare <a onClick="return mV(\'Exd\',25,29);">Ex 25:29</a>; <a onClick="return mV(\'Exd\',37,16);">37:16</a>); the Septuagint trublion, and in the New Testament rendered "dish" (<a onClick="return mV(\'Mat\',26,23);">Mt 26:23</a>; <a onClick="return mV(\'Mar\',14,20);">Mr 14:20</a>). In <a onClick="return mV(\'Ezr\',1,9);">Ezr 1:9</a>, the American Standard Revised Version aghartal, rendered "platter," the King James Version and the English Revised Version "chargers"; probably a deep dish or basin used in sacrificial slaughter.<P>(2) paropsis, originally a side dish, for relishes, entrees, but of dishes for food, in general, especially meats, fish, etc., used with poterion, "cup" or "drinking vessel" (<a onClick="return mV(\'Mat\',23,25);">Mt 23:25</a>f); also pinax, originally a large wooden dish or plate (<a onClick="return mV(\'Luk\',11,39);">Lu 11:39</a>); rendered "charger" in <a onClick="return mV(\'Mat\',14,8,11);">Mt 14:8,11</a> the King James Version, and <a onClick="return mV(\'Mar\',6,25,28);">Mr 6:25,28</a> the King James Version and the English Revised Version.``137';
