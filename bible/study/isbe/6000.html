f the kingdom (<a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>). It is on earth that He administers it. The phrase, "having received the kingdom," cannot by any dexterity of exegesis be made to denote the end of time or the end of the Millennium, or of His receiving it at the end of the world; it is then He delivers it up to God, even the Father (<a onClick="return mV(\'1Co\',15,\24-28\');">1Co 15:24-28</a>).<P>The order and sequence of events as traced by the Lord disclose the same fact made prominent in the parable of the Wheat and Tares, namely, that during the whole period between His ascension and His return there is no place for a Millennium of world-wide righteousness and prosperity. But Scripture warrants the belief that such blessedness is surely to fill the earth, and if so, it must be realized after Christ\'s second coming.<P>II. Teaching of the Apostles.<P>1. Expectation of the Advent:<P>There is no unmistakable evidence that the apostles expected a thousand years of prosperity and peace during Christ\'s absence in heaven. In <a onClick="return mV(\'Act\',1,11);">Ac 1:11</a> we read that the heavenly visitants said to the apostles, "Ye men of Galilee, why stand ye looking into heaven?" This attitude of the men of Galilee became the permanent attitude of the primitive church. It was that of the uplifted gaze. Paul\'s exultant words respecting the Thessalonians might well be applied to all believers of that ancient time, that they "turned unto God from idols, to serve a living and true God, and to wait for his Son from heaven" (<a onClick="return mV(\'1Th\',1,9,10);">1Th 1:9,10</a>). It is the prominent theme of the New Testament epistles. In the New Testament it is mentioned 318 times. One verse in every thirty, we are told, is occupied with it. It is found shining with a glad hope in the first letters Paul wrote, those to the Thessalonians. It is found in the last he wrote, the second to Timothy, gleaming with the bright anticipation of the crown he was to receive at the Redeemer\'s appearing. James quickens the flagging courage, and reanimates the drooping spirits of believers with this trumpet peal: "Be ye also patient; establish your hearts: for the coming of the Lord is at hand" (<a onClick="return mV(\'Jam\',5,8);">5:8</a>). Peter exhorts to all holy conversation and godliness by the like motive: "Looking for and hastening the coming of the day of God" (<a onClick="return mV(\'2Pe\',3,12);">2Pe 3:12</a> margin). Amid the deepening gloom and the gathering storms of the last days, <a onClick="return mV(\'Jud\',1,14);">Jude 1:14</a> cheers us with the words of Enoch, the seventh from Adam, \'Behold, the Lord cometh with ten thousand of his saints, to execute judgment upon...the ungodly.\' John closes the Canon with the majestic words, "Behold, he cometh with the clouds," "Behold, I come quickly." These men, speaking by the Spirit of the living God, know there can be no reign of universal righteousness, no deliverance of groaning creation, no redemption of the body, no binding of Satan, and no Millennium while the tares grow side by side with the wheat; while the ungodly world flings its defiant shout after the retiring nobleman, "We will not have this man to reign over us"; and while Satan, that strong, fierce spirit, loose in this age, deceives, leads captive, devours and ruins as he lists. Therefore the passionate longing and the assurance of nearing deliverance at the coming of Christ fill so large a place in the faith and the life of the primitive disciples.<P>2. Possibility of Survival—Its Implications:<P>In <a onClick="return mV(\'1Th\',4,17);">1Th 4:17</a> Paul speaks of himself and others who may survive till the Lord\'s coming: "Then we that are alive, that are left, shall together with them be caught up in the clouds, to meet the Lord in the air" (compare <a onClick="return mV(\'1Cr\',15,51,52);">1Co 15:51,52</a>).<P>This implies fairly that the apostle did not know that long ages would elapse between his own day and Christ\'s advent. There was to his mind the possibility of His coming in his lifetime; in fact, he seems to have an expectation that he would not pass through the gates of death at all, that he would live to see the Lord in His glorious return, for the day and the hour of the advent is absolutely concealed even from inspired men. The inference is perfectly legitimate that Paul and his fellow-disciples did not anticipate that a thousand years should intervene between them and the coming.<P>3. Prophecy of the "Man of Sin":<P>Furthermore, the Thessalonians had fallen into a serious mistake (<a onClick="return mV(\'2Th\',2,\'1-2\');">2Th 2:1-2</a>). By a false spirit, or by a forged epistle as from Paul, they were led to believe that "the day of the Lord is now present" (English Revised Version), <a onClick="return mV(\'2Th\',2,2);">2Th 2:2</a>. The apostle sets them right about this solemn matter. He assures them that some things must precede that day, namely, "the falling away," or apostasy, and the appearing of a powerful adversary, whom he calls "the Man of Sin," and describes as "the Son of Perdition." Neither the one nor the other of these two, the apostasy and the Man of Sin, was then present. But the road was fast getting ready for them. There was the "mystery of lawlessness" already at work at the time, and although a certain restraint held it in check, nevertheless when the check was removed it would at once precipitate the apostasy, and it would issue in the advent of the Man of Sin, and he should be brought to nought by the personal coming of Jesus Christ. This appears to be the import of the passage.<P>Here was the appropriate place to settle forever for these saints and for all others the question of a long period to intervene before the Saviour\'s advent. How easy and natural it would have been for Paul to write, "Brethren, there is to be first a time of universal blessedness for the world, the Millennium, and after that there will be an apostasy and the revelation of the Man of Sin whom Christ will destroy by the brightness of His coming." But Paul intimated nothing of the sort. Instead, he distinctly says that the mystery of lawlessness is already working, that it will issue in "the falling away," and then shall appear the great adversary, the Lawless One, who shall meet his doom by the advent of Christ. The mystery of lawlessness, however, is held in restraint, we are told. May it not be possible that the check shall be taken off, then the Millennium succeed, and after that the apostasy and the Son of Perdition? No, for its removal is immediately followed by the coming of the great foe, the Antichrist. For this foe has both an apocalypse and a parousia like Christ Himself. Hence, the lifting of the restraint is sudden, by no means a prolonged process.<P>4. No Room for Millennium:<P>The apostle speaks of the commencement, progress, and close of a certain period. It had commenced when he wrote. Its close is at the coming of Christ. What intervenes? The continuance of the evil secretly at work in the body of professing Christians, and its progress from the incipient state to the maturity of daring wickedness which will be exhibited in the Man of Sin. This condition of things fills up the whole period, if we accept Paul\'s teaching as that of inspired truth. There appears to be no place for a Millennium within the limits which the apostle here sets. The only escape from this conclusion, as it seems to us, is, to deny that the coming of Christ is His actual, personal second coming. But the two words, epiphaneia and parousia, which elsewhere are used separately to denote His advent, are here employed to give "graphic vividness" and certainty to the event, and hence, they peremptorily forbid a figurative interpretation. The conclusion seems unavoidable that there can be no Millennium on this side of the advent of Christ.<P>5. Harmony of Christ and Apostles:<P>Our Lord\'s Olivet prophecy (<a onClick="return mV(\'Mat\',24,\'1-\');">Mt 24</a>; <a onClick="return mV(\'Mat\',25,\'1-\');">25</a>; <a onClick="return mV(\'Mar\',13,\'1-\');">Mr 13</a>; <a onClick="return mV(\'Luk\',21,\'1-\');">Lu 21</a>) accords fully with the teaching of the apostles on the subject. In that discourse He foretells wars, commotions among the nations, Jerusalem\'s capture and the destruction of the temple, Israel\'s exile, Christians persecuted while bearing their testimony throughout the world, cosmic convulsions, unparalleled tribulation and sufferings which terminate only with His advent. From the day this great prophecy was spoken down to the hour of His actual coming He offers no hope of a Millennium. He opens no place for a thousand years of blessedness for the earth.<P>These are some of the grounds on which Biblical students known as Premillennialists rest their belief touching the coming of the Lord and the Millennial reign.<P>LITERATURE.<P>Premillenarian: H. Bonar, The Coming of the Kingdom of the Lord Jesus; Wood, The Last Things; Guinness, The Approaching End of the Age; Seiss, The Last Times; Gordon, Ecce Venit; Premillennial Essays; Peters, The Theocratic Kingdom; West, The Thousand Years in Both Testaments; Trotter, Plain Papers on Prophetic Subjects; Brookes, Maranatha; Andrews, Christianity and Antichristianity; Kellogg, Predition and Fulfillment.``123';
isbe[6058]='Millet`mil\'-et, mil\'-it (dochan; kegchros): One of the ingredients of the prophet\'s bread (<a onClick="return mV(\'Eze\',4,9);">Eze 4:9</a>). The Arabic equivalent is dukhn, the common millet, Panicum miliaceum, an annual grass 3 or 4 ft. high with a much-branched nodding panicle. Its seeds arc as small as mustard seeds and are used largely for feeding small birds, but are sometimes ground to flour and mixed with other cereals for making bread. The Italian millet, setaria Italica, known as Bengal grass, is also called in Arabic dukhn, and has a similar seed. A somewhat similar grain, much more widely cultivated as a summer crop, is the Indian millet—also called "Egyptian maize"—the Sorghum annuum. This is known as dhurah in Arabic, and the seed as dhurah beida, "white dourra." It is a very important crop, as it, like the common millet, grows and matures without any rain. It is an important breadstuff among the poor.<P>Both the common millet and the dourra were cultivated in Egypt in very ancient times; the Hebrew dochan was certainly the first, but may include all three varieties.``117';
isbe[6059]='Millo`mil\'-o. (millo generally interpreted to mean a "filling," e.g. a solid tower or an earth embankment; in <a onClick="return mV(\'Jdg\',9,6,20);">Jud 9:6,20</a>; <a onClick="return mV(\'2Ki\',12,20);">2Ki 12:20</a>, we get beth millo\', translated in English Versions of the Bible "House of Millo," which Winckler thinks may have been the original Jebusite temple-shrine of Jerusalem (see <a href="./study/isbe/search.html?string=BETH-MILLO">BETH-MILLO</A>); Septuagint reads Bethmaalon, also Maalon and oikos Maallon):<P>1. Old Testament References<P>It is generally supposed that "The Millo" was some kind of fortress or other defense, but many speculations have been made regarding its position. In <a onClick="return mV(\'2Sa\',5,9);">2Sa 5:9</a>, we read that David built round about from the Millo and inward, or (in the Septuagint, Septuagint) "he fortified it, the city, round about from the Millo and his house" (compare <a onClick="return mV(\'1Ch\',11,8);">1Ch 11:8</a>). In connection with Solomon\'s strengthening of the fortifications, there are several references to Millo. In <a onClick="return mV(\'1Ki\',9,15);">1Ki 9:15</a>, Solomon raised a levy "to build the house of Yahweh, and his own house, and Millo, and the wall of Jerusalem," etc.; in <a onClick="return mV(\'1Ki\',9,24);">9:24</a>, "Pharaoh\'s daughter came up out of the city of David unto her house which Solomon had built for her: then did he build Millo"; in <a onClick="return mV(\'1Ki\',11,27);">1Ki 11:27</a>, Solomon "built Millo, and repaired the breach of the city of David his father." At a later time Hezekiah "took courage, and built up all the wall that was broken down, and raised it up to the towers, and the other wall without, and strengthened Millo in the city of David" (<a onClick="return mV(\'2Ch\',32,5);">2Ch 32:5</a>; <a onClick="return mV(\'2Ki\',12,20);">2Ki 12:20</a>); Joash was slain by his servants "at the house of Millo, on the way that goeth down to Silla," but possibly this may have been in Shechem (compare <a onClick="return mV(\'Jdg\',9,6);">Jud 9:6</a>).<P>2. Identical with the Akra Site:<P>The mention of the site in the days of David and the reference to it in connection with the city of David (<a onClick="return mV(\'1Ki\',11,27);">1Ki 11:27</a>) point to some part of the southeastern hill south of the temple. It is suggestive that Millo is in Septuagint always translated by "Akra." It seems to the present writer very probable that it was a fortress crowning the hill on which at a later time stood the Syrian Akra, which hill, if we are to believe Josephus (BJ, V, iv, 1, etc.), was cut down because its commanding situation dominated the temple. This hill cannot have been the site of Zion afterward known as "David\'s Burg" (City of David), because the tombs of the Judean kings were within its walls, and that alone would have made the complete leveling of the site impossible, but whereas the Jebusite fortress was probably not far from Gihon, this fortified summit may have been, as Watson suggests for the Akra, as far north as where the present Al Aqsa mosque is situated. In David\'s time it may have been an isolated and detached fort guarding the north approach, but if it was originally a Jebusite high place (Winckler) partly of sun-dried brick like similar constructions in Babylonia, the account of its being leveled would be much more credible. The importance of this site in the days of Solomon is fully explicable if this was the citadel guarding the newly built temple and royal palaces.<P>Dr. G.A. Smith is inclined to think that Millo may have been a fortress "off the south end of Ophel, to retain and protect the old pool," and Vincent suggests that the site of Millo is that now occupied by the great causeway connecting the western and eastern hills along which runs the Tariq bab es silsileh.``117';

isbe[6062]='Mincing`min\'-sing (Taphaph): "Taking short steps," "walking trippingly." Only in <a onClick="return mV(\'Isa\',3,16);">Isa 3:16</a>, "walking and mincing as they go, and making a tinkling (a jingling of the metal anklets) with their feet." Compare OHL.``1';
isbe[6063]='Mind`mind (nous, dianoia, sunesis):<P>1. No Precision in the Terms Used:<P>We look in vain in the Old Testament and New Testament for anything like scientific precision in the employment of terms which are meant to indicate mental operations.<P>In the Old Testament lebh is made to stand for the various manifestations of our intellectual and emotional nature. We are often misled by the different renderings in the different versions, both early and late.<P>Sometimes nephesh or "soul" is rendered by "mind" (<a onClick="return mV(\'Deu\',18,6);">De 18:6</a> the King James Version, "desire of his soul" or "mind"); sometimes ruah or "spirit" (<a onClick="return mV(\'Gen\',26,35);">Ge 26:35</a>, "grief of mind," ruah). Here Luther renders the term Herzeleid ("grief of heart"), and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) animum. Sometimes lebh is used, as in <a onClick="return mV(\'Isa\',46,8);">Isa 46:8</a>, "bring it to mind" (literally, "heart"), or in <a onClick="return mV(\'Psa\',31,12);">Ps 31:12</a>, "I am forgotten as a dead man out of mind" (literally, "heart"), as in Septuagint, kardia, and in Vulgate, a corde, Luther, im Herzen, new Dutch translated, uit de gedachtenis (i.e. "memory").<P>In the Apocrypha this precision is equally lacking. Thus we read in The <span class="noTag">Wisdom of Solomon 9:15</span>, "For the corruptible body (soma) presseth down the soul (psuche) and the earthly tabernacle weigheth down the mind (nous) that museth upon many things." But these distinctions are alien to the letter and spirit of revelation, a product of the Greek and not of the Hebrew mind.<P>In the New Testament the words nous and dianoia are used, but not with any precision of meaning.<P>Here too several terms are rendered by the same word. Thus the Hebrew ruach is rendered by nous in <a onClick="return mV(\'1Cr\',2,16);">1Co 2:16</a> ("mind of the Lord," with reference to <a onClick="return mV(\'Isa\',40,13);">Isa 40:13</a>, where "ruach YHWH (spirit of Yahweh)" occurs). Nous evidently means here the organ of spiritual perception—a word borrowed from the Septuagint, where it is sometimes made to stand for lebh (<a onClick="return mV(\'Job\',7,17);">Job 7:17</a>; <a onClick="return mV(\'Isa\',41,22);">Isa 41:22</a>); sometimes for ruah (<a onClick="return mV(\'Isa\',40,13);">Isa 40:13</a>). In <a onClick="return mV(\'Luk\',24,45);">Lu 24:45</a>—the solitary text, where nous occurs in the Gospels—it is rendered "understanding" in the King James Version, "mind" in the Revised Version (British and American).<P>2. Ethical Sense:<P>For a true solution we must turn to the Epistles of Paul, where the word frequently occurs in an ethical sense—sometimes in connection with (sinful) flesh as in <a onClick="return mV(\'Col\',2,18);">Col 2:18</a>, "puffed up by his fleshly mind," sometimes in direct contrast to it, as in <a onClick="return mV(\'Rom\',7,25);">Ro 7:25</a>, \'with my mind I serve the law of God; with the flesh the law of sin.\' In <a onClick="return mV(\'Tts\',1,15);">Tit 1:15</a> it is brought into parallelism with conscience ("Their mind and their conscience are defiled"). Phrases like "a reprobate mind," "corrupted in mind" occur elsewhere (<a onClick="return mV(\'Rom\',1,28);">Ro 1:28</a>; <a onClick="return mV(\'1Ti\',6,5);">1Ti 6:5</a>). From this state of "reprobation" and "corruption" man must be saved. Hence, the necessity of complete transformation and renewal of the inner man (<a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>), "transformed by the renewing of your mind (nous)."<P>3. Dianoia and Nous:<P>Another word, with possibly a deeper meaning, is sometimes employed, namely, dianoia, which literally means "meditation," "reflection." It is found as synonymous with nous in a good sense, as e.g. in <a onClick="return mV(\'1Jo\',5,20);">1Joh 5:20</a> (He "hath given us an understanding, that we know him that is true"). Evidently the sense here is the same as in <a onClick="return mV(\'Rom\',12,2);">Ro 12:2</a>, a renovated mind capable of knowing Christ. It may also bear a bad sense, as in <a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>, where the Gentiles are represented as having "a darkened understanding," or in parallelism with sarx: "the desires of the flesh and of the mind" (<a onClick="return mV(\'Eph\',2,3);">Eph 2:3</a>), and with nous: \'walking in vanity of mind (nous) and a darkened understanding (dianoia)\' in <a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>. At times also "heart" and "mind" are joined to indicate human depravity (<a onClick="return mV(\'Luk\',1,51);">Lu 1:51</a> "He hath scattered the proud in the imagination (dianoia) of their heart"). It is interesting also to know that the Great Commandment is rendered in <a onClick="return mV(\'Mat\',22,37);">Mt 22:37</a>—"Thou shall love the Lord thy God with all thy heart, and with all thy soul (psuche), and with all thy understanding (dianoia) (English Versions of the Bible, "mind")"—though Mark has two renderings in one of which dianoia occurs, and in the other sunesis (<a onClick="return mV(\'Mar\',12,30,33);">Mark 12:30,33</a>), though possibly without any psychological refinement of meaning, for the term sunesis occurs elsewhere in conjunction with pneumatikos ("spiritual understanding," <a onClick="return mV(\'Col\',1,9);">Col 1:9</a>). It also stands alone in the sense of an "understanding enlightened from above" (<a onClick="return mV(\'2Ti\',2,7);">2Ti 2:7</a> King James Version: "The Lord give thee understanding (sunesis) in all things"). The history of these terms is interesting, but not of great theological significance.<P>4. The Great Commandment:<P>It seems to us that Godet\'s interpretation of the Great Commandment in <a onClick="return mV(\'Luk\',10,27);">Lu 10:27</a> is somewhat far-fetched. He considers the heart as "the central focus from which all rays of the moral life go forth, and that in their three principal directions: the powers of feeling, or the affections, nephesh (\'soul\') in the sense of feeling; the active powers, the impulsive aspirations, the might (\'with all thy might\'), the will; and in the intellectual powers, analytical or contemplative, dianoia (\'with all thy mind\'). The difference between the heart, which resembles the trunk and the three branches, feeling, will, understanding, is emphatically marked in the Alexandrian variation, by the substitution of the preposition en (\'in\') for ek (\'with,\' \'from\') in the three last members. Moral life proceeds from the heart and manifests itself without, in the three forms of activity. The impulse God-ward proceeds from the heart, and is realized in the life through the will, which consecrates itself actively to the accomplishment of His will; and through the mind, which pursues the track of His thought in all His works" (Godet, Commentary on the Gospel of Luke, II, 38,39).``113';
isbe[6064]='Mine; Mining`min, min\'-ing: In <a onClick="return mV(\'Job\',28,\'1-11\');">Job 28:1-11</a> we have the only Biblical reference to mines. The writer very likely derived his information either from personal observation or from a description by an eyewitness, of the mining operations of Sinai (see <a href="./study/isbe/search.html?string=METALS">METALS</a>). No traces of ancient mines have yet been found in Palestine and Syria. What metals were taken out came from the superficial strata. The mines of Upper Egypt have already been mentioned. Burton and other travelers in Northern Arabia and the Red Sea country have found there evidences of ancient mining operations.<P>The usual Egyptian method of mining was to follow the vein from the surface as far as it was practicable with tools corresponding to our pick and hoe, hammer and chisel. The shafts frequently extended into the ground a distance of 180 to 200 ft. The rock when too hard to be dug out was first cracked by having fires built on it. The metal-bearing stone was carried in baskets to the surface, where the crushing and separating took place. The mining operations were performed by an army of slaves who were kept at their work day and night, driven with the lash until they died, when their places were taken by others.`<a href="./study/isbe/search.html?string=METALS">METALS</a>; <a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`133';
isbe[6065]='Minerals`min\'-er-alz.`<a href="./study/isbe/search.html?string=METALS">METALS</a>; <a href="./study/isbe/search.html?string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[6066]='Mingled People; (Mixed Multitude)`min\'-g\'-ld pe\'-pl:<P>(1) "Mixed multitude" occurs in <a onClick="return mV(\'Num\',11,4);">Nu 11:4</a> as a translation of asaphcuph, "collection," "rabble." The same phrase in <a onClick="return mV(\'Exd\',12,38);">Ex 12:38</a>; <a onClick="return mV(\'Neh\',13,3);">Ne 13:3</a> is the rendition of erebh. "Mingled people" is used also to translate \'erebh, and is found in <a onClick="return mV(\'Jer\',25,20,24);">Jer 25:20,24</a>; <a onClick="return mV(\'Jer\',50,37);">50:37</a>; <a onClick="return mV(\'Eze\',30,5);">Eze 30:5</a>, and in <a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a> the Revised Version (British and American) (the King James Version "Arabia"; compare the American Revised Version margin). In the last case both revised versions have followed the pointing of the Massoretic Text, and this pointing alone distinguishes "mingled people" (\'erebh) from "Arabia" (\'arabh); in the unvocalized text both words are equally \'-r-b. Now "the traffic of the merchants, and of all the kings of the mingled people, and of the governors of the country" is very awkward, and the correction into "Arabia," as in the Massoretic Text (and English Versions of the Bible) of the parallel <a onClick="return mV(\'2Ch\',9,14);">2Ch 9:14</a>, is indicated. Probably the same change should be made in <a onClick="return mV(\'Eze\',30,5);">Eze 30:5</a>, reading "Ethiopia, and Put, and Lud, and Arabia, and Cub." A similar textual confusion seems to be responsible for either "and all the kings of Arabia" or "and all the kings of the mingled people" in <a onClick="return mV(\'Jer\',25,24);">Jer 25:24</a>. On all these verses see the commentaries.<P>(2) In <a onClick="return mV(\'Jer\',25,20);">Jer 25:20</a>; <a onClick="return mV(\'Jer\',50,37);">50:37</a>, "mingled people" is a term of contempt for the hybrid blood of certain of Israel\'s enemies. Something of this same contempt may be contained in <a onClick="return mV(\'Exd\',12,38);">Ex 12:38</a>, where a multitude of non-Israelite camp-followers are mentioned as accompanying the children of Israel in the exodus, and in <a onClick="return mV(\'Num\',11,4);">Nu 11:4</a> it is this motley body that seduced Israel to sin. But who they were, why they wished or were permitted to join in the exodus, and what eventually became of them or of their descendants is a very perplexing puzzle. In <a onClick="return mV(\'Neh\',13,3);">Ne 13:3</a>, the "mixed multitude" consists of the inhabitants of Palestine whom the Jews found there after the return from the exile (see <a href="./study/isbe/search.html?string=SAMARIA">SAMARIA</A>). In accord with the command of <a onClick="return mV(\'Deu\',23,\'3-5\');">De 23:3-5</a>, the Jews withdrew from all religious intercourse whatever had been established with these.<P>NOTE.—The Hebrew noun for "mingled people" may or may not be connected with the verb translated "mingle" in <a onClick="return mV(\'Ezr\',9,2);">Ezr 9:2</a>; <a onClick="return mV(\'Psa\',106,35);">Ps 106:35</a>; <a onClick="return mV(\'Dan\',2,43);">Da 2:43</a>. On this see the lexicons.``48';
isbe[6067]='Miniamin`min\'-ya-min, mi-ni\'-a-min (minydmin):<P>(1) A Levite who assisted Kore, the son of Imnah, in the distribution of the freewill offerings (<a onClick="return mV(\'2Ch\',31,15);">2Ch 31:15</a>).<P>(2) A priestly family of the time of the high priest Joiakim (<a onClick="return mV(\'Neh\',12,17);">Ne 12:17</a>), probably equals <a href="./study/isbe/search.html?string=MIJAMIN">MIJAMIN (2)</a>.<P>(3) A priestly participant in the ceremony of the dedication of the wall (<a onClick="return mV(\'Neh\',12,41);">Ne 12:41</a>).``1';
isbe[6068]='Minish`min\'-ash (the King James Version and the English Revised Version <a onClick="return mV(\'Exd\',15,19);">Ex 15:19</a>; <a onClick="return mV(\'Psa\',107,39);">Ps 107:39</a>; the English Revised Version <a onClick="return mV(\'Isa\',19,6);">Isa 19:6</a>; <a onClick="return mV(\'Hsa\',8,10);">Ho 8:10</a>): The verb "mannish," "make small," is now obsolete, being replaced by its derivative "diminish" (compare the American Standard Revised Version in all verses above).``1';
isbe[6069]='Ministry`min\'-is-tri:<P><b>I. THE WORD "MINISTRY"</b><P class="in15">Use of the Word in This Article<P><b>II. TWO KINDS OF MINISTRY</b><P class="in15">1. The Prophet Ministry<P class="in30">(1) Apostles<P class="in30">(2) Prophets<P class="in30">(3) Teachers<P class="in15">2. The Local Ministry<P class="in30">Origin<P><b>III. THREEFOLD CONGREGATIONAL MINISTRY</b><P class="in15">1. Insistence on Organization<P class="in30">(1) Aid Given in Selecting a Bishop<P class="in30">(2) Bishops and Presbyters<P class="in15">2. Multiplication of Orders: Growth of a Hierarchy<P><b>IV. SYNODS</b><P><b>LITERATURE</b><hr /><P>I. The Word "Ministry."<P>The common New Testament term for the ministry is diakonia, and along with it we find diakonos, "minister," ho diakonon), "he who ministers," and diakonein, "to minister." All these words have a very extensive application within the New Testament and are by no means restricted to denote service within the Christian church; even when so restricted the words are used in a great variety of meanings: e.g.<P>(1) discipleship in general (<a onClick="return mV(\'Jhn\',12,26);">Joh 12:26</a>);<P>(2) service rendered to the church because of the "gifts" bestowed (<a onClick="return mV(\'Rom\',12,7);">Ro 12:7</a>; <a onClick="return mV(\'1Cr\',12,5);">1Co 12:5</a>), and hence, all kinds of service (<a onClick="return mV(\'Act\',6,2);">Ac 6:2</a>; <a onClick="return mV(\'Mat\',20,26);">Mt 20:26</a>);<P>(3) specifically the "ministry of the Word" (<a onClick="return mV(\'Eph\',4,12);">Eph 4:12</a>), and most frequently the "apostleship" (<a onClick="return mV(\'Act\',1,17);">Ac 1:17</a>; <a onClick="return mV(\'Act\',20,24);">20:24</a>; <a onClick="return mV(\'Act\',21,19);">21:19</a>; <a onClick="return mV(\'Rom\',11,13);">Ro 11:13</a>, etc.);<P>(4) such services as feeding the poor (<a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>; <a onClick="return mV(\'Act\',11,29);">11:29</a>; <a onClick="return mV(\'Act\',12,25);">12:25</a>), or organizing and providing the great collection for the poor saints at Jerusalem (<a onClick="return mV(\'Rom\',15,25);">Ro 15:25</a>; <a onClick="return mV(\'2Cr\',8,4,19);">2Co 8:4,19</a>, etc.);<P>(5) such services as those rendered by Stephanas (<a onClick="return mV(\'1Cr\',16,15);">1Co 16:15</a>), by Archippus (<a onClick="return mV(\'Col\',4,17);">Col 4:17</a>), by Tychicus (<a onClick="return mV(\'Eph\',6,21);">Eph 6:21</a>; <a onClick="return mV(\'Col\',4,7);">Col 4:7</a>), etc.<P>Use of the Word in This Article:<P>In this article the word has to do with the guidance and government of a united community, fellowship, or brotherhood of men and women whose inward bond of union was the sense of fellowship with Jesus their Risen Lord. In all ages of Christianity the call to become the follower of Jesus, while it is the deepest of all personal things and comes to each one singly, never comes solitarily. The devout soul must share his experiences with those like-minded, and the fellowship thus formed must be able to take outward shape, which cannot fail to render necessary some sort of rule and guidance. The very thought of the church with articulate expression of a common faith, administration of the sacraments, meetings and their right conduct, aid given to the spiritual and bodily needs of their fellow-members, implies a ministry or executive of some kind. To endeavor to explain what was the character of the ministry of the Christian church in the earliest centuries of its existence and how it came into being is the aim of this article.<P>II. Two Kinds of Ministry.<P>The earliest fact we have about the organization of the Christian church is given in <a onClick="return mV(\'Act\',6,\'1-\');">Ac 6</a>, where we are told that "seven" men were appointed to what is called a "ministry of tables" (diakonein trapezais), which is distinguished from the "ministry of the word" (diakonia tou logou). This distinction between two different kinds of "ministry" which appears at the very beginning is seen to exist all through the apostolic church and beyond it into the sub-apostolic. It can be traced in the Epistles of Paul and in other parts of the New Testament. It is seen in the Didache, in the Pastor of Hermas, in the Epistles of Barnabas, in the Apology of Justin Martyr, in the writings of Irenaeus and elsewhere. (For a full list of authorities, compare Harnack, Texte u. Untersuchungen, II, ii, 111ff.) The one ministry differs from the other in function, and the distinction depends on a conception to be afterward examined—that of "gifts." The common name, in apostolic and sub-apostolic literature, for the members of the one kind of ministry is "those who speak the Word of God" (lalountes ton logon tou Theou). Modern writers have called it the charismatic, but perhaps the better term is the prophetic ministry; while to the other class belong all the names which are given to denote office-bearers in the local churches. The two existed side by side. The great practical distinction between them was that the members of the former were in no sense office-bearers in any one Christian community; they were not elected or appointed to any office; they were not set apart for duties by any ecclesiastical ceremony. The "Word" came to them and they were compelled by inward impulsion to speak the message given them to deliver. Some were wanderers; others confined themselves to their own community. They were responsible to no ecclesiastical authority. Churches were encouraged to test them and their message; for the "gift" of discerning whether a so-called prophet spoke a truly Divine message was always presupposed to be within the local church. But once accepted they took a higher place than the office-bearers, they presided at the Lord\'s Supper, and their judgment in cases of discipline could overbear ordinary ecclesiastical rules. The contest of Cyprian with the "confessors" at Carthage was the last stage of the long struggle which arose in the 2nd century between the two ministries. Out of the other kind of ministry came, by ordinary development, all the various kinds of ecclesiastical organization which now exist. Its members were office-bearers in the strictest sense of the word; they were selected to do ecclesiastical work in a given community, they were set apart for it in a special way, and they were responsible to the church for its due performance.<P>But it is important to remember that while the two kinds of ministries are thoroughly distinct from each other, the same individuals might belong to both kinds. The "prophetic gift" might fall on anyone, private member or office-bearer alike. Office-holding did not prevent the "gift." Polycarp, office-bearer at Smyrna, was a prophet; so was Ignatius of Antioch, and many others. The "gift" of speaking the Word of God was a personal and not an official source of enlightenment.<P>1. The Prophetic Ministry:<P>In the prophetic ministry we find a threefold division—apostles, prophets and teachers. Some would add a fourth, evangelists, i.e. men like the apostles in all respects save in having seen the. Lord in the flesh. The distinction may hold good for the apostolic period, though that appears to be very doubtful; it disappears utterly in the sub-apostolic; evangelist and apostle seem to be one class. This triple division may be traced through early Christian literature from 1 Corinthians down to the Clementine Homilies, which can scarcely be earlier than 200 AD. It is hardly possible to define each class in any mechanical fashion; speaking generally, the first were the missionary pioneers whose message was chiefly to the unconverted, while to the second and third classes belonged exhortation and instruction within the Christian communities.<P>(1) Apostles.<P>In the New Testament and in the other literature of the early church the word "apostle" is used in a narrower and in a wider sense, and it is the more extensive use of the word which denotes the first division of the prophetic ministry. The Lord selected the Twelve, "whom also he named apostles" (<a onClick="return mV(\'Mar\',3,14);">Mr 3:14</a>, the Revised Version margin), to be trained by personal fellowship with Him and by apprentice mission work among the villages of Galilee for that proclamation of His gospel which was to be their future life-work. Two things strictly personal and excluding every thought of successors separated the "Eleven" from all other men: long personal fellowship with Jesus in the inner circle of His followers, and their selection by Himself while still in the flesh. They were the "Apostles" in the narrow sense of the word. But the name was given to many others. Matthias, who had enjoyed personal intercourse with Jesus both before and after the resurrection, was called by the disciple company, confirmed by decision of the lot, to the same \'service and sending forth\' (diakonia kai apostole) (<a onClick="return mV(\'Act\',1,25);">Ac 1:25</a>). Paul was called by the Lord Himself, but in vision and inward experience, and took rank with those before mentioned (<a onClick="return mV(\'Rom\',1,1);">Ro 1:1</a>ff; <a onClick="return mV(\'Gal\',2,\'7-9\');">Ga 2:7-9</a>). Others, called apostles, are mentioned by name in the New Testament. Barnabas is not only an apostle but is recognized to have rank equal to the "Eleven" (<a onClick="return mV(\'Act\',14,14);">Ac 14:14</a>; <a onClick="return mV(\'Gal\',2,\'7-9\');">Ga 2:7-9</a>). The correct rendering of the text (<a onClick="return mV(\'Rom\',16,7);">Ro 16:7</a>) declares that Andronicus and Junias were apostles who had known Christ before Paul became a believer. Chrysostom, who thinks that Junias or Junia was a woman, does not believe that her sex hindered her from being an apostle. Silas or Silvanus and Timothy, on the most natural interpretation of the passage, are called apostles by Paul in <a onClick="return mV(\'1Th\',1,1,6);">1Th 1:1,6</a>. The title can hardly be denied to Apollos (<a onClick="return mV(\'1Cr\',4,6,9);">1Co 4:6,9</a>). Paul praises men, whom he calls "the apostles of the churches," and declares them to be "the glory of Christ" (<a onClick="return mV(\'2Cr\',8,23);">2Co 8:23</a> margin). One of them, Epaphroditus, is mentioned by name—"your apostle," says Paul writing to the Christians of Philippi (<a onClick="return mV(\'Phl\',2,25);">Php 2:25</a> margin); and there must have been many others. "Apostles" are distinguished from the "Twelve" by Paul in the rapid summary he gives of the appearances of Jesus after the resurrection (<a onClick="return mV(\'1Cr\',15,5,7);">1Co 15:5,7</a>). Besides those true apostles the New Testament mentions others who are called "false apostles" (<a onClick="return mV(\'2Cr\',11,13);">2Co 11:13</a>), and the church of Ephesus is praised for using its "gift" of discrimination to reject men who "call themselves apostles, and they are not" (<a onClick="return mV(\'Rev\',2,2);">Re 2:2</a>). This wider use of the word has descended to the present day; "apostles" or "holy apostles" is still the name for missionaries and missioners in some parts of the Greek church. The double use of the word to denote the "Twelve" or the "Eleven" is seen in the sub-apostolic age in the Didache, which recognizes the narrower use of the word in its title ("The Teaching of the Twelve Apostles"), and in the text portrays the itinerant missionaries to whom the name in its widest use belonged.<P>Those "apostles," to whatever class they belonged, had one distinguishing characteristic: they had chosen as their life-work to be the missionary pioneers of the gospel of the Kingdom of Christ. They were all engaged in aggressive work, and were distinguished from others not so much by what they were as by what they did. They were wanderers with no fixed place of residence. The requirements of their work might make them abide for long periods in some center (as did Paul at Corinth and at Ephesus, or some of the "Eleven" at Jerusalem), but they had no permanent home life. As the earlier decades passed, their numbers increased rather than diminished. They are brought vividly before us in such writings as the Didache. They were to be highly honored, but as severely tested. They were not expected to remain longer than three days within a Christian community, nor to fare softly when there (Didache ii.4-6). The vindication of their call was what they were able to accomplish, and to this Paul, the greatest of them, appeals over and over again.<P>(2) Prophets.<P>Prophets had been the religious guides of Israel of old, and the spirit of prophecy had never entirely died out. John the Baptist (<a onClick="return mV(\'Mat\',11,9);">Mt 11:9</a>), Simeon (<a onClick="return mV(\'Luk\',2,25,26);">Lu 2:25,26</a>), and Anna (<a onClick="return mV(\'Luk\',2,36);">Lu 2:36</a>) had the gift in the days of Christ. It was natural for the Samaritan woman to believe that the stranger who spoke to her by the well was a prophet (<a onClick="return mV(\'Jhn\',4,19);">Joh 4:19</a>). The reappearance of prophecy in its old strength was looked on as a sign of the nearness of the coming of the Messiah. Jesus Himself had promised to send prophets among His followers (<a onClick="return mV(\'Mat\',10,41);">Mt 10:41</a>; <a onClick="return mV(\'Mat\',23,34);">23:34</a>; <a onClick="return mV(\'Luk\',11,49);">Lu 11:49</a>). The promise was fulfilled. Christian prophets appeared within the church from its beginning. Nor were they confined to communities of Jewish Christians; prophecy appeared spontaneously wherever Christianity spread. We are told of prophets in the churches of Jerusalem and Caesarea where the membership was almost purely Jewish; at Antioch where Jews and Gentiles united to make one congregation; and everywhere throughout the Gentile churches—in Rome, Corinth, Thessalonica and in the Galatian churches (<a onClick="return mV(\'Act\',11,27);">Ac 11:27</a>; <a onClick="return mV(\'Act\',15,32);">15:32</a>; <a onClick="return mV(\'Act\',21,9,10);">21:9,10</a>; <a onClick="return mV(\'Rom\',12,6,7);">Ro 12:6,7</a>; <a onClick="return mV(\'1Cr\',14,32,36,37);">1Co 14:32,36,37</a>; <a onClick="return mV(\'1Th\',5,20);">1Th 5:20</a>; <a onClick="return mV(\'Gal\',3,\'3-5\');">Ga 3:3-5</a>). Prophets are mentioned by name—Agabus (<a onClick="return mV(\'Act\',11,28);">Ac 11:28</a>; <a onClick="return mV(\'Act\',21,10);">21:10</a>), Symeon and others at Antioch (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>), Judas and Silas in Jerusalem (<a onClick="return mV(\'Act\',15,32);">Ac 15:32</a>). Nor was the "gift" confined to men; women prophesied—the four daughters of Philip among others (<a onClick="return mV(\'Act\',21,9);">Ac 21:9</a>). From the earliest times down to the close of the 2nd century and later, an uninterrupted stream of prophets and prophetesses appeared in the Christian churches. The statements of New Testament writers, and especially of Paul, imply that prophets abounded in the earliest churches. Paul, for example, expected the prophetic gift to appear in every Christian community. He recognized that they had a regular place in the meeting for public worship (<a onClick="return mV(\'1Cr\',14,\'1-\');">1Co 14</a>); he desired that every member in the Corinthian church should possess the "gift" and cultivate it (<a onClick="return mV(\'1Cr\',14,1,5,39);">1Co 14:1,5,39</a>); he exhorted the brethren at Thessalonica to \'cherish prophesyings\' (<a onClick="return mV(\'1Th\',5,20);">1Th 5:20</a>), and those in Rome to make full use of prophecy (<a onClick="return mV(\'Rom\',12,6);">Ro 12:6</a>). If he criticized somewhat severely the conduct of the "prophets" in the Corinthian church, it was to teach them how to make full use of their "gift" for the right edifying of the brethren.<P>Prophecy was founded on revelation; the prophets were men especially "gifted" with spiritual intuition and magnetic speech. Sometimes their "gift" took the form of ecstasy, but by no means always; Paul implies that prophets have a real command of and can control their utterances. Sometimes their message came to them in visions, such as we find in the Apocalypse and in Hermas; but this was not a necessary means. The prophets spoke as they were moved, and the Spirit worked on them in various ways.<P>The influence of those prophets seems to have increased rather than diminished during the earlier decades of the 2nd century. While the duty of the apostle was to the unbelievers, Jewish or heathen, the sphere of the activity of the prophet was within the Christian congregation. It was his business to edify the brethren. Prophets had a recognized place in the meeting for the public worship of the congregation; if one happened to be present at the dispensation of the Lord\'s Supper, he presided to the exclusion of the office-bearers, and his prayers were expected to be extempore (Didache x.7); he had special powers when matters of discipline were discussed, as is plain from a great variety of evidence from Hermas down to Tertullian. From Paul\'s statements it seems that the largest number of the prophets he speaks of were members of the communities within which they used their "gift" of prophecy; but many of the more eminent prophets traveled from community to community edifying each. When such wandering prophets, with their wives and families, dwelt for a time in any Christian society, preaching and exhorting, it was deemed to be the duty of that society to support them, and regulations were made for such support. According to the Didache (chapter xiii): "Every true prophet who shall settle among you is worthy of his support ..... Every first-fruit then of the products of the winepress and threshing-floor, of oxen and of sheep, thou shalt take and give to the prophets ..... In like manner also when thou openest a jar of wine or oil, take the first of it and give it to the prophets; and of money and clothing and every possession take the first as may seem right to thee, and give according to the commandment." Only, the receivers were to be true prophets. Each congregation had to exercise the "gift" of discrimination and sift the true from the false; for "false" prophets confronted the true in early Christianity as well as in the old Judaism.<P>(3) Teachers.<P>While the third class of the prophetic ministry, the teachers, is found joined to the other two both in the New Testament and in sub-apostolic literature, and while Paul assigns a definite place for their services in the meeting for edification (<a onClick="return mV(\'1Cr\',14,26);">1Co 14:26</a>), we hear less about them and their work. They seem, however, to have lingered much longer in active service in the early church than did the apostles and the prophets.<P>2. The Local Ministry:<P>As has been said, the first notice we have of organization within a local church is in <a onClick="return mV(\'Act\',6,\'1-\');">Ac 6</a>, where at the suggestion of the apostles seven men were selected to administer the charity of the congregation.<P>The conception that "the Seven" were a special order of office-bearers, deacons, is a comparatively late suggestion. These men are nowhere called deacons; the official designation is "The Seven." It may be that the appointment of those men was only a temporary expedient, but it is more probable that "the Seven" of <a onClick="return mV(\'Act\',6,\'1-\');">Ac 6</a> are the elders of <a onClick="return mV(\'Act\',11,\'1-\');">Ac 11</a>; for we find those "elders" performing the duties which "the Seven" were appointed to fulfil. If so, we have in <a onClick="return mV(\'Act\',6,\'1-\');">Ac 6</a> the narrative of the beginnings of local organization as a whole. When we turn to the expansion of Christian communities outside Jerusalem, we have no such distinct picture of beginnings; but as all the churches in Palestine evidently regarded the society in Jerusalem as the mother church, it is likely that their organization was the same. Acts tells us that Paul and Barnabas left behind them at Derbe, Lystra and Iconium societies of brethren with "elders" at their head. The word used suggests an election by popular vote and was probably the same as had been used in the selection of the "Seven" men.<P>When we examine the records of the distinctively Pauline churches, there is not much direct evidence for the origins of the ministry there, but a great deal about the existence of some kind of rule and rulers. For one thing, we can see that these churches had and were encouraged to have feelings of independence and of self-government; a great deal is said about the possession of "gifts" which imply the presence and power of the Spirit of Jesus within the community itself. We find names applied to men who, if not actually office-bearers, are at least leaders and perform the functions of office-bearers—proistamenoi, poimenes, episkopoi, diakonoi—and where special designations are lacking a distinction is always drawn between those who obey and those who are to be obeyed. In all cases those leaders or ministers are mentioned in the plural.<P>It may be said generally that about the close of the 1st century every Christian community was ruled by a body of men who are sometimes called presbyters (elders), sometimes but more rarely bishops (overseers), and whom modern church historians are inclined to call presbyter-bishops. Associated with them, but whether members of the same court or forming a court of their own it is impossible to say, were a number of assistant rulers called deacons. See <a href="./study/isbe/search.html?string=BISHOP">BISHOP</A>; <a href="./study/isbe/search.html?string=CHURCH+GOVERNMENT">CHURCH GOVERNMENT</a>; <a href="./study/isbe/search.html?string=DEACON">DEACON</a>; <a href="./study/isbe/search.html?string=ELDER">ELDER</a>. The court of elders had no president or permanent chairman. There was a two-fold not a threefold ministry. During the 3rd century, rising into notice by way of geographical distribution rather than in definite chronological order, this twofold congregational ministry became threefold in the sense that one man was placed at the head of each community with the title of pastor or bishop (the titles are interchangeable as late as the 4th century at least). In the early centuries those local churches, thus organized, while they never lacked the sense that they all belonged to one body, were independent self-governing communities preserving relations to each other, not by any political organization embracing them all, but by fraternal fellowship through visits of deputies, interchange of letters, and in some indefinite way giving and receiving assistance in the selection and setting apart of pastors.<P>Origin.<P>The question arises, How did this organization come into being? We may dismiss, to begin with, the idea once generally accepted among the Reformed churches, that the Christian society simply took over and made use of the synagogue system of organization (Vitringa, De synagoga vetere). The points common to both reveal a superficial resemblance, but no more. The distinctive differences are great. When we add to them the decisive statement of Epiphanius (Haeresis, xxx. 18), that the Jewish Christians (Judaizing) organized their communities with archons and an archisynagogos like the Jewish synagogues of the Dispersion and unlike the Christian churches, all the evidence makes it impossible to believe that the earliest Christian organization was simply taken over from the Jewish. On the other hand, there is little evidence that the apostles (the Twelve and Paul) received a special commission from our Lord, to appoint and ordain the office-bearers of the earliest Christian communities, so exclusive that there could be no legitimate organization without this apostolic authority and background. We find, on the contrary, the church in Rome exercising all the disciplinary functions of a congregation without this apostolic ecclesiastical rule supposed to be essential. Even in the mother-church in Jerusalem, the congregational meeting exercised rule over the apostles themselves, for we find apostles summoned before it and examined on their conduct (<a onClick="return mV(\'Act\',11,\'1-4\');">Ac 11:1-4</a>). The whole question demands the recognition of several facts:<P>(1) Evidence abounds to show that the local churches during the apostolic and sub-apostolic age were self-governing communities and that the real background of the ministry was not apostolic authority but the congregational meeting. Its representative character and its authority are seen in the apostolic and sub-apostolic literature from Paul to Cyprian.<P>(2) The uniquely Christian correlation of the three conceptions of leadership, service and "gifts"; leadership depended on service, and service was possible by the possession and recognition of special "gifts" which were the evidence of the presence and power of the Spirit of Jesus within the community. These "gifts" gave the church a Divine authority to exercise rule and oversight apart from any special apostolic direction.<P>(3) The general evidence existing to show that there was a gradual growth of the principle of association from looser to more compact forms of organization (Gayford, article "Church" in HDB; also Harnack, The Expositor, 1887, January to June, 322-24), must not be forgotten; only one must remember that in young communities the growth is rapid.<P>(4) We must also bear in mind that the first Christians were well acquainted with various kinds of social organization which entered into their daily life and which could not fail to suggest how they might organize their new societies.<P>Examples occur readily:<P>(a) Every Jewish village community was ruled by its "seven wise men," and it is probable that the appointment of the "Seven" in the primitive Jewish church was suggested by familiarity with this example of social polity.<P>(b) It was and is an almost universal oriental usage that the "next of kin" to the founder was recognized, after the founder\'s death, to be the head of the new religious community founded, and this usage accounts for the selection of James, the eldest male surviving relative of our Lord, to be the recognized and honored head of the church in Jerusalem. James has been called the first bishop; but when we read in Eusebius (Historia Ecclesiastica, III, 11, 1, 2; 32, 4; IV, 22, 4; III, 20, 1-8) how his successors were chosen, the term seems inappropriate. A succession in the male line of the kindred of Jesus, where the selection to office is mainly in the hands of a family council, and where two (James and Zoker) can rule together, has small analogy to episcopal rule.<P>(c) The relation of "patron" to "client," which in one form or other had spread throughout the civilized world, is suggested by a series of kindred words used to denote rulers in local churches. We find proistamenoi, prostatis, prostates, proestos, in various writers, and the last was used as late as the middle of the 2nd century to denote ministry in the Roman church (<a onClick="return mV(\'Rom\',12,8);">Ro 12:8</a>; <a onClick="return mV(\'Rom\',16,2);">16:2</a>; <a onClick="return mV(\'1Th\',5,12);">1Th 5:12</a>; Hermas, Pastor. Vis. 2, 4; Justin, Apol, i.65).<P>(d) The Roman empire was honeycombed with "gilds," some recognized by law, most of them without legal recognition and liable to suppression. These confraternities were of very varied character—trades unions, burial clubs, etc., but a large proportion were for the purpose of practicing special religious rites.<P>The Jewish synagogues of the Dispersion seemed to have been enrolled among those confraternities, and certainly appeared to their heathen neighbors to be one kind of such private associations for the practice of a religion which had been legalized. Many scholars have insisted that the Gentile Christian churches simply copied the organization of such confraternities (Renan, Les Apotres; Heinrici, Zeitschrift f. wissensch. Theol., 1876-77); Hatch, Organization of the Early Christian Churches). There must have been some external resemblances. Pliny believed that the Christian churches of Bithynia were illicit confraternities (Ep. 96; compare Lucian, Peregrinus Proteus). They had, in common with the churches, a democratic constitution; they shared a "common meal" at stated times; they made a monthly collection; they were ruled by a committee of office-bearers; and they exercised a certain amount of discipline over their members. Multitudes of Christians must have been members of such confraternites, and many continued to be so after accepting Christianity (Cyprian, Ep., lxvii. 6).<P>But while the Christian churches may have learned much about the general principles of associated life from all those varied forms of social organization, it cannot be said that they copied any one of them. The primitive Christian societies organized themselves independently in virtue of the new moral and social life implanted within them; and though they may have come to it by various paths, they all in the end arrived at one common form—a society ruled by a body of office-bearers who possessed the "gifts" of government and of subordinate service embodied in the offices of presbyter and deacon.<P>III. Threefold Congregational Ministry.<P>During the 2nd century the ministry was subject to a change. The ruling body of office-bearers in every congregation received a permanent president, who was called the pastor or bishop, the latter term being the commoner. The change came gradually. It provoked no strong opposition. By the beginning of the 3rd century it was everywhere accepted.<P>When we seek to trace the causes why the college of elders received a president, who became the center of all the ecclesiastical life in the local church and the one potent office-bearer, we are reduced to conjecture. This only can be said with confidence, that the change began in the east and gradually spread to the west, and that there are hints of a gradual evolution (Lindsay, The Church and the Ministry in the Early Centuries,180,183-85). Scholars have brought forward many reasons for the change; the need for an undivided leadership in times of danger from external persecution or from the introduction of Gnostic speculations which disturbed the faith of the members; the convenience of being represented to other local churches by one man who could charge himself with the administration of the external affairs of the congregation; the need of one man to preside at the solemn and crowning act of worship, the administration of the Lord\'s Supper; the sense of congregational unity implied in the possession of one leader—each or all are probable ways in which the churches were influenced in making this change in their ministry.<P>This threefold congregational ministry is best seen in the Epistles of Ignatius of Antioch. They portray a Christian community having at its head a bishop, a presbyterium or session of elders, and a body of deacons. These form the ministry or office-bearers of the congregation to whom obedience is due. Nothing is to be done without the consent of the bishop, neither love-feast, nor sacrament, nor anything congregational. The ruling body is a court where the bishop sits as chairman surrounded by his council or session of elders; and the one is helpless without the other, for if the bishop be the lyre, the elders are the chords, and both are needed to produce melody. Ignatius compares the bishop to Jesus, and the elders to the apostles who surrounded Him. There is no trace of sacerdotalism, apostolic succession, one-man government, diocesan rule in those letters of Ignatius; and what they portray is unlike any form of diocesan episcopacy.<P>1. Insistence on Organization:<P>It is interesting to remark how all throughout the 3rd century and later every body of Christians, even if consisting of fewer than twelve families, is instructed to organize itself into a church under a ministry of office-bearers, consisting of a bishop or pastor, at least two elders and at least three deacons. Should the bishop be illiterate—for character more than erudition determined his choice—the congregation was told to elect a reader, and provision was made for a ministry of women. It was possible to obey such instructions, because the ministry of the early church received no stipends. The ministry were office-bearers, to whom ecclesiastical obedience was due in virtue of their call and election and their being set apart by prayer, and perhaps by laying on of hands, for sacred office; but they were at the same time merchants, artisans, or engaged in other secular callings, and supported themselves. Buildings, set apart for public worship, did not exist until the very close of the 2nd century, and then only in a few populous centers in towns which had felt persecution but slightly. The only property which a church possessed, besides its copies of the Scriptures, its congregational records and perhaps a place of burial, were the offerings which were presented by members of the congregation, mostly in kind, after the Eucharist; and these offerings were distributed to the poor of the congregation. If office-bearers received a share, it was only on account of their poverty and because they were on the roll of widows, orphans and helpless poor.<P>This threefold congregational ministry has been called by some scholars "monarchical episcopacy," a title as high-sounding as it is misleading. The kingdom over which those so-called monarchs presided might and often did consist of less than twelve families, and their rule was fenced in with many restrictions. We can collect from the Epistles of Ignatius what were the powers and what the limitations (Epistle to Polycarp) of the bishop. He administered the finances of the church; he was president of the court of Elders; he had the right to call and presumably to preside over the court of discipline; and he had the regulation of the sacraments in his hands. On the other hand, it is very doubtful whether he, or even he in conjunction with the elders, could excommunicate; that appears to have remained in the hands of the congregational meeting. The bishop might convoke the congregational meeting for the purpose, but it belonged to the meeting and not to the bishop to appoint delegates and messengers to other churches; and the meeting had the power to order the bishop to go on such a mission.<P>(1) Aid Given in Selecting a Bishop.<P>From what has been said it is plain that the selection of a bishop became one of the most important acts a congregation was called upon to perform. Accordingly, provision was made for its assistance. It is declared in the Apostolic Canons that if a congregation contains fewer than twelve men competent to vote at the election of a bishop, neighboring, "well-established" churches are to be written to in order that three men may be sent to assist the congregation in selecting their pastor (Sources of the Apostolic Canons, 7, 8). This is evidently the origin of what afterward became the custom and later a law, that the consecration of a bishop required the presence of three neighboring bishops—a rule which has given occasion to the saying that "all Christendom becomes Presbyterian on a consecration day." This custom and rule, which in its beginnings was simply practical assistance given to a weak by stronger congregations, came to bear the meaning that the bishop thus consecrated was an office-bearer in the church universal as well as the pastor of a particular congregation. It is also more than probable that this practice of seeking assistance in an emergency is the germ out of which grew the Synod—the earliest recorded synods being congregational meetings assisted in times of difficulty by advice of experienced persons from other churches.<P>(2) Bishops and Presbyters.<P>When a small group of villagers had been won to Christianity through the efforts of the Christian congregation in a neighboring town, they commonly were disinclined to separate from it, and came from their villages into town to join in the public worship. "On the day called Sunday," says Justin Martyr, "all who live in the city and in the country gather together into one place" (Ap., i.67). The earliest collections of canons show that the bishop was able in time of absence or sickness to delegate his duties to elders or even to deacons; and this enabled him, when occasion for it arose, to be, through his office-bearers, the pastor of several congregations. We can see the same process at work more clearly in large towns where the number of Christians had become very large. The bishop was always held to be the head of the Christian community, however large, in one place. He was the pastor; he baptized; he presided at the Holy Supper; he admitted catechumens to the full communion of the brotherhood. By the middle of the 3rd century the work in most large towns was more than one man could do. No record exists of the number of members belonging to the Roman church at this time, but some idea of its size may be obtained from the fact that it had more than 1,500 persons on its poor-roll; and before the close of the century the Roman Christians worshipped in over 40 separate places of meeting. It is obvious that one man could not perform the whole pastoral duties for such a multitude, and that most of the pastoral work must have been delegated to the elders or presbyters. The unity of the pastorate was for long strictly preserved by the custom that the bishop consecrated the communion elements in one church, and these were carried round to the other congregations. The bishop was thus the pastor in every congregation; the elders and deacons belonged to the whole Christian community; they served all the congregations and were not attached to one distinctively. In Alexandria, on the other hand, something like a parochial system gathered round the bishop, for individual presbyters were set over the separate congregations within the city. But always and without exception the original pastoral status of the bishop was preserved by the fact that one portion of the pastoral duties was invariably left in his hands—the rite of confirmation whereby catechumens were admitted to full communion.<P>II. Multiplication of Orders: Growth of a Hierarchy:<P>The middle of the 3rd century witnessed two changes in the ministry of the church. One was a multiplication of orders and the other the growth of a hierarchy; and while many causes went to produce these changes it can hardly be doubted that they were at least partly due to the imitation of pagan religious organization. Although we find the distinction between those who are to be obeyed and those who are to obey clearly laid down in the Epistles of Paul, we do not find a common term in general use to denote the former class until the beginning of the 3rd century. In the west the word was ordo, and in the east clerus, from which come our "orders" and "clergy." Ordo was the designation for the municipality in towns or for the committee which presided over a confraternity; and clerus denoted rank or class. The introduction of ministerial stipends and the implication that a paid ministry was expected to give its whole time to the service of the church made the distinction between clergy and laity more emphatic. When we investigate the matter, it is evident that the fact that the clergy are paid complicates the question; for the earliest lists are evidently those who are entitled to share in the funds of the church, and widows and orphans figure as members of the ordo or clerus. Setting this disturbing element aside we find that the earliest division of the ministry in the 3rd century is into bishops, presbyters and deacons (all congregational); but bishops and presbyters are sometimes said to form the special ordo ecclesiasticus. The earliest addition to those three orders is the reader, and there follows soon the sub-deacon. Then come such persons as exorcists, acolyths, singers, door-keepers and even grave-diggers; and to such the name "minor orders" is given. All are included within the clergy, all receive a proportionate share of the revenues of the congregational funds. The presence of bishops, presbyters and deacons needs no explanation. Readers, as we have seen, were needed at first to assist illiterate bishops or pastors; their retention and the insertion of exorcists have been plausibly accounted for by the idea that they represented the absorption of the old prophetic ministry. But in instituting the other minor orders the Christian church evidently copied the pagan temple usages where persons who performed corresponding services were included among the temple ministry and had due share of the temple revenues. In the institution of a graded hierarchy including metropolitans and patriarchs, the churches probably followed the example of the great pagan organization called forth by the imperial cult of the Divi and Divae (Lindsay, The Church and the Ministry, 335ff). As Mommsen remarks, "The conquering Christian church took its hierarchic weapons from the arsenal of the enemy."<P>IV. Synods:<P>Synods to begin with were essentially democratic assemblies. They were, in their primitive form, congregational meetings assisted in times of emergency by delegates (not necessarily bishops) from "well-established churches," and they grew to be the instrument by which churches grouped round one center became united into one compact organization. The times were not democratic, and gradually the presence of the laity and even of presbyters and deacons and their combined assent to the decisions of the assembly became more and more a matter of form and gradually ceased altogether. The synods consisted exclusively of bishops and became councils for registering their decisions; and this implied that each local church was fully and completely represented by its pastor or bishop, who had become very much of an autocrat, responsible, not to his congregation nor even to a synod, but to God alone. Before the end of the 3rd century and onward, synods or councils had become a regular part of the organization of the whole church, and the membership was confined to the bishops of the several churches included within the group. It was natural that such assemblies should meet in the provincial capitals, for the roads converged to the cities which were the seats of the Roman provincial administration. A synod required a chairman, and various usages obtained about the natural chairman. At first the oldest bishop present was placed in the chair, and this continued long to be the practice in several parts of the empire. Gradually it became the habit to put into the chair the bishop of the town in which the council met, and this grew to a prescriptive right. It was then that the bishops of the towns which were the meeting-places of synods came to be called metropolitans. The title was for long one of courtesy only and did not carry with it any ecclesiastical rank and authority. But by the middle of the 4th century the metropolitans had acquired the right to summon the synods and even to exercise some authority over the bishops of the bounds, especially in the matter of election and consecration. When Christianity was thoroughly established as the religion of the empire, the more important bishops secured for themselves the civil precedence and privileges which had belonged to the higher priests of the abandoned Imperial Cult, and the higher ranks of the Christian ministry came into the possession of a lordship strangely at variance with their earlier position of service.<P>LITERATURE.<P>C. Vitringa, De synagoge vetere libra tres, Leucopetrae (Weissenfels), 1726; Bingham, Antiquities of the Christian Church, 1708-32; Bannermann, The Scripture Doctrine of the Church; Hort, The Christian Ecclesia; Lightfoot, Commentary on the Epistle to the Philippians (dissertation on the ministry); Hatch, The Organization of the Early Christian Church, and articles on "Orders" in Smith\'s Dictionary of Christian Antiquities; Harnack, The Expositor for January to June,1887,and Entstehung u. Entwicklung der Kirchenverfassung...in d. zwei ersten Jahrhunderten (1910) (English translation, The Constitution and Law of the Church); Lindsay, The Church and the Ministry in the Early Centuries; Schmiedel, article "Ministry" in EB; Gayford, article "Church" in HDB.``99';
isbe[6070]='Minni`min\'-i (minni): A kingdom mentioned in <a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a>, along with Ararat and Ashkenaz, as assailants of Babylon. It is identified with the Minnai of the Assyrian inscriptions, in close relation with, or part of, Armenia.``1';
isbe[6071]='Minnith`min\'-ith (minnith; Codex Vaticanus achris Arnon; Codex Alexandrinus eis Semoeith): After Jephthah defeated the Ammonites, he is said to have smitten them from Aroer "until thou come to Minnith" (<a onClick="return mV(\'Jdg\',11,33);">Jud 11:33</a>). Eusebius, Onomasticon mentions a place called Maanith, 4 Roman miles from Heshbon, on the road to Philadelphia (\'Amman), and locates Abelcheramim, which is mentioned with Minnith, 7 miles from Philadelphia, without indicating the direction. Some travelers have spoken of a Menjah, 7 miles east of Heshbon, but of this place Tristram (Land of Moab, 140) could find no trace. The same place appears to be mentioned in <a onClick="return mV(\'Eze\',27,17);">Eze 27:17</a> as supplying wheat, which figures in the trade between Judah and Tyre. There are really no reliable data on which to suggest an identification, while there are grave reasons to suspect the integrity of the text.``54';
isbe[6072]='Minstrel`min\'-strel.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[6073]='Mint`mint (heduosmon): Mentioned (<a onClick="return mV(\'Mat\',23,23);">Mt 23:23</a>; <a onClick="return mV(\'Luk\',11,42);">Lu 11:42</a>) as one of the small things which were tithed. The cultivated variety (Mentha piperita), "peppermint," was doubtless primarily intended, but the wild Mentha silvestris or horsemint, which flourishes all over the mountains of Palestine, is probably included.``1';
isbe[6074]='Miphkad; Gate of`mif\'-kad, (sha\'ar ha-miphqadh; the Revised Version (British and American) "Hammiphkad" (<a onClick="return mV(\'Neh\',3,31);">Ne 3:31</a>)): A gate in, or near, the north end of the east wall of Jerusalem, rebuilt under Nehemiah. Its exact position is uncertain.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`1';
isbe[6075]='Miracle`mar\'-a-k\'-l:<P><b>I. THE NATURE OF MIRACLES</b><P class="in15">1. General Idea<P class="in15">2. Biblical Terms Employed<P><b>II. MIRACLE IN THE NEW TESTAMENT</b><P class="in15">1. Miracles in Gospel History<P class="in15">2. Special Testimony of Luke<P class="in15">3. Trustworthiness of Evidence in Gospels and Acts<P><b>III. MIRACLE AND LAWS OF NATURE</b><P class="in15">1. Projudgment of Negative Criticism<P class="in15">2. Sir George Stokes Quoted<P class="in15">3. Effects on Nature of New Agencies<P class="in15">4. Agreement with Biblical Idea and Terms<P class="in15">5. J.S. Mill on Miracle<P class="in15">6. Miracle as Connected with Command<P><b>IV. EVIDENTIAL VALUE OF MIRACLE</b><P class="in15">1. Miracles as Proofs of Revelation<P class="in15">2. Miracles of Christ in This Relation<P class="in15">3. Miracles Part of Revelation<P><b>V. MIRACLES IN THE OLD TESTAMENT</b><P class="in15">1. Analogy with New Testament Miracles<P class="in15">2. The Mosaic Miracles<P class="in15">3. Subsequent Miracles<P class="in15">4. Prophecy as Miracle<P><b>VI. ECCLESIASTICAL MIRACLES</b><P class="in15">1. Probability of Such Miracles<P class="in15">2. Pascal Quoted<P><b>VII. MIRACLE IN WORKS OR GRACE</b><P><b>LITERATURE</b>.<hr /><P>I. Nature of Miracle.<P>1. General Idea:<P>"Miracle" is the general term for the wonderful phenomena which accompanied the Jewish and Christian revelation, especially at critical moments, and which are alleged to have been continued, under certain conditions, in the history of the Christian church. The miracle proper is a work of God (<a onClick="return mV(\'Exd\',7,3);">Ex 7:3</a>ff; <a onClick="return mV(\'Deu\',4,34,35);">De 4:34,35</a>, etc.; <a onClick="return mV(\'Jhn\',3,2);">Joh 3:2</a>; <a onClick="return mV(\'Jhn\',9,32,33);">9:32,33</a>; <a onClick="return mV(\'Jhn\',10,38);">10:38</a>; <a onClick="return mV(\'Act\',10,38);">Ac 10:38</a>, etc.); but as supernatural acts miracles are recognized as possible to evil agencies (<a onClick="return mV(\'Mat\',24,24);">Mt 24:24</a>; <a onClick="return mV(\'2Th\',2,9);">2Th 2:9</a>; <a onClick="return mV(\'Rev\',13,14);">Re 13:14</a>; <a onClick="return mV(\'Rev\',16,14);">16:14</a>, etc.).<P>2. Biblical Terms Employed:<P>The Biblical idea of miracle as an extraordinary work of God, generally though not invariably ("providential" miracles—see below, II, 6), transcending the ordinary powers of Nature, wrought in connection with the ends of revelation, is illustrated by the terms used to describe miracles in the Old Testament and New Testament. One class of terms brings out the unusual, exceptional, and striking character of the works, as pele\', niphla\'oth (<a onClick="return mV(\'Exd\',3,20);">Ex 3:20</a>; <a onClick="return mV(\'Exd\',15,11);">15:11</a>, etc.), teras, literally, "a portent" (in plural <a onClick="return mV(\'Mat\',24,24);">Mt 24:24</a>; <a onClick="return mV(\'Act\',2,22,43);">Ac 2:22,43</a>, etc.); another lays stress on the power displayed in them, as gebhurah, dunamis (in plural "mighty works," the Revised Version margin "powers," <a onClick="return mV(\'Mat\',11,20,21,23);">Mt 11:20,21,23</a>; <a onClick="return mV(\'Mat\',13,54);">13:54</a>; <a onClick="return mV(\'Mat\',14,2);">14:2</a>; <a onClick="return mV(\'2Cr\',12,12);">2Co 12:12</a>, etc.); a third gives prominence to their teleological significance—their character as "signs," as \'oth (plural the Revised Version (British and American) "signs," <a onClick="return mV(\'Num\',14,22);">Nu 14:22</a>; <a onClick="return mV(\'Deu\',11,3);">De 11:3</a>, etc.), semeion (plural the Revised Version (British and American) "signs," <a onClick="return mV(\'Jhn\',2,11,23);">Joh 2:11,23</a>, and frequently; <a onClick="return mV(\'Act\',4,16,22);">Ac 4:16,22</a>; <a onClick="return mV(\'Act\',6,8);">6:8</a>; <a onClick="return mV(\'Rev\',13,14);">Re 13:14</a>, etc.). Another Old Testament word for "wonder" or "miracle" is mopheth (<a onClick="return mV(\'Exd\',7,9);">Ex
