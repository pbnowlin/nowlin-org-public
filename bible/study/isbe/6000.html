isbe = [];

isbe[6001]='Mete`met (madhadh): "To measure," either with a utensil of dry measure, as in <a onClick="return mV(\'Exd\',16,18);">Ex 16:18</a>, or to measure with a line or measure of length, as in <a onClick="return mV(\'Psa\',60,6);">Ps 60:6</a>; <a onClick="return mV(\'Psa\',108,7);">108:7</a>; <a onClick="return mV(\'Isa\',40,12);">Isa 40:12</a>. In <a onClick="return mV(\'Isa\',18,2,7);">Isa 18:2,7</a> it is the rendering of qaw qaw, literally, "line-line" i.e. measuring line, referring to the Ethiopians as a nation that measured off other peoples for destruction and trod them down, as in the Revised Version (British and American). It is regarded by some as signifying strength, being cognate with the Arabic kawi, "strong." For mete of <a onClick="return mV(\'Mat\',7,2);">Mt 7:2</a> and parallel passages in <a onClick="return mV(\'Mar\',4,24);">Mr 4:24</a>; <a onClick="return mV(\'Luk\',6,38);">Lu 6:38</a>`<a href="./study/isbe/search.html?string=MEASURE">MEASURE</a>`138';
isbe[6002]='Meterus`me-te\'-rus.`<a href="./study/isbe/search.html?string=BAITERUS">BAITERUS</a>`1';
isbe[6003]='Meteyard`met\'-yard (middah, "a measure," <a onClick="return mV(\'Lev\',19,35);">Le 19:35</a>): Has this meaning in the King James Version and the Revised Version (British and American), but in the American Standard Revised Version, "measures of length."``1';
isbe[6004]='Metheg-Ammah`me-theg-am\'-a, meth-eg-am\'-a (mathegh ha-\'ammah, "bridle of the metropolis"; Septuagint ten aphorismenen): It is probable that the place-name Metheg-Ammah in <a onClick="return mV(\'2Sa\',8,1);">2Sa 8:1</a> the King James Version should be rendered as in the Revised Version (British and American), "the bridle of the mother city," i.e. Gath, since we find in the parallel passage in <a onClick="return mV(\'1Ch\',18,1);">1Ch 18:1</a> gath ubhenotheha, "Gath and her daughters," i.e. daughter towns. The Septuagint has an entirely different reading: "and David took the tribute out of the hand of the Philistines," showing that they had a different text from what we now have in the Hebrew. The text is evidently corrupt. If a place is intended its site is unknown, but it must have been in the Philistine plain and in the vicinity of Gath.``138';
isbe[6005]='Methusael`me-thu\'-sa-el.`<a href="./study/isbe/search.html?string=METHUSHAEL">METHUSHAEL</a>`1';
isbe[6006]='Methuselah`me-thu\'-se-la, me-thu\'-se-la (methushelach, "man of the javelin"): A descendant of Seth, the son of Enoch, and father of Lamech (<a onClick="return mV(\'Gen\',5,21);">Ge 5:21</a>ff; <a onClick="return mV(\'1Ch\',1,3);">1Ch 1:3</a>; <a onClick="return mV(\'Luk\',3,37);">Lu 3:37</a>). Methuselah is said to have lived 969 years; he is therefore the oldest of the patriarchs and the oldest man. It is doubtful whether these long years do not include the duration of a family or clan.``1';
isbe[6007]='Methushael`me-thu\'-sha-el (methusha\'el): A descendant of Cain, and father of Lamech in the Cainite genealogy (<a onClick="return mV(\'Gen\',4,18);">Ge 4:18</a>). The meaning of the name is doubtful. Dillmann suggested "suppliant or man of God."``1';
isbe[6008]='Meunim`me-u\'-nim (the King James Version Mehunim).`<a href="./study/isbe/search.html?string=MAON">MAON</a>`1';
isbe[6009]='Meuzal`me-u\'-zal (me\'uzal, or me\'uzal): A word which occurs only in the King James Version margin of <a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a>. The rendering in the King James Version text is "going to and fro," in the Revised Version (British and American) text "with yarn," but in Revised Version, margin, in agreement with BDB and most modern authorities, Meuzal is regarded as a proper noun with a prefixed preposition, and is rendered "from Uzal."`<a href="./study/isbe/search.html?string=UZAL">UZAL</a>`1';
isbe[6010]='Mezarim`mez\'-a-rim (NORTH).`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[6011]='Mezobaite`me-zo\'-ba-it (ha-metsbhayah): The designation of Jaasiel, one of David\'s heroes (<a onClick="return mV(\'1Ch\',11,47);">1Ch 11:47</a>).``1';
isbe[6012]='Miamin`mi\'-a-min.`<a href="./study/isbe/search.html?string=MIJAMIN">MIJAMIN</a>; <a href="./study/isbe/search.html?string=MINIAMIN">MINIAMIN</a>`1';
isbe[6013]='Mibhar`mib\'-har (mibhchar, "choice"(?)): According to <a onClick="return mV(\'1Ch\',11,38);">1Ch 11:38</a>, the name of one of David\'s heroes. No such name, however, occurs in the parallel passage (<a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a>). A comparison of the two records makes it probable that mibhchar is a corruption of mitstsbhah = "from Zobah," which completes the designation of the former name, Nathan of Zobah. The concluding words of the verse, Ben-Hagri = "the son of Hagri," will then appear as a misreading of Bani ha-gadhi = "Bani, the Gadite," thus bringing the two records into accord.``1';
isbe[6014]='Mibsam`mib\'-sam (mibhsam, "perfume"(?)):<P>(1) A son of Ishmael (<a onClick="return mV(\'Gen\',25,13);">Ge 25:13</a>; <a onClick="return mV(\'1Ch\',1,29);">1Ch 1:29</a>).<P>(2) A Simeonite (<a onClick="return mV(\'1Ch\',4,25);">1Ch 4:25</a>).``1';
isbe[6015]='Mibzar`mib\'-zar (mibhtsar, "a fortress"): An Edomite chief, the King James Version "duke" (<a onClick="return mV(\'Gen\',36,42);">Ge 36:42</a>; <a onClick="return mV(\'1Ch\',1,53);">1Ch 1:53</a>). According to Eusebius, Mibzar is connected with Mibsara, a considerable village subject to Petra and still existing in his time. Compare Holzinger and Skinner in respective commentaries on Genesis.``1';
isbe[6016]='Mica`mi\'-ka (mikha\'): A variant of the name Micah, and probably like it a contracted form of <a href="./study/isbe/search.html?string=MICAIAH">MICAIAH</a> (which see). In the King James Version it is sometimes spelled "Micha."<P>(1) A son of Merib-baal or Mephibosheth (<a onClick="return mV(\'2Sa\',9,12);">2Sa 9:12</a>, the King James Version "Micha"). In <a onClick="return mV(\'1Ch\',8,34);">1Ch 8:34</a>, he is called "Micah."<P>(2) The son of Zichri (<a onClick="return mV(\'1Ch\',9,15);">1Ch 9:15</a>). In <a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a> (the King James Version "Micha"), he is designated "the son of Zabdi," and in <a onClick="return mV(\'Neh\',12,35);">Ne 12:35</a>, his name appears as "Micaiah (the King James Version "Michaiah"), the son of Zaccur."<P>(3) One of the signatories of the Covenant (<a onClick="return mV(\'Neh\',10,11);">Ne 10:11</a>, the King James Version "Micha").``95';
isbe[6017]='Micah (1)`MICAH (1)<P>mi\'-ka (mikhah, contracted from mikhayahu, "who is like Yah?"; Codex Vaticanus, Meichaias; Codex Alexandrinus, Micha; sometimes in the King James Version spelled Michah):<P>(1) The chief character of an episode given as an appendix to the Book of Judges (<a onClick="return mV(\'Jdg\',17,\'1-\');">Jud 17</a>; <a onClick="return mV(\'Jdg\',18,\'1-\');">18</a>). Micah, a dweller in Mt. Ephraim, was the founder and owner of a small private sanctuary with accessories for worship (<a onClick="return mV(\'Jdg\',17,\'1-5\');">17:1-5</a>), for which he hired as priest a Judean Levite (<a onClick="return mV(\'Jdg\',17,\'7-13\');">17:7-13</A>). Five men sent in quest of new territory by the Danites, who had failed to secure a settlement upon their own tribal allotment, visited Micah\'s shrine, and obtained from his priest an oracle favoring their quest (<a onClick="return mV(\'Jdg\',18,\'1-6\');">Jud 18:1-6</a>). They then went on until they reached the town of Laish in the extreme north, and deeming it suitable for the purpose, they returned to report to their fellow-tribesmen. These at once dispatched thither 600 armed men, accompanied by their families (<a onClick="return mV(\'Jdg\',18,\'7-12\');">Jud 18:7-12</a>). Passing Micah\'s abode, they appropriated his idols and his priest, and when their owner pursued, he was insulted and threatened (<a onClick="return mV(\'Jdg\',18,\'13-26\');">Jud 18:13-26</a>). They took Laish, destroyed it with its inhabitants and rebuilt it under the name of Dan. There they established the stolen images, and appointed Micah\'s Levite, Jonathan, a grandson of Moses (the King James Version "Manasseh"), priest of the new sanctuary, which was long famous in Israel (<a onClick="return mV(\'Jdg\',18,\'27-31\');">Jud 18:27-31</a>).<P>The purpose of the narrative is evidently to set forth the origin of the Danite shrine and priesthood. A few peculiarities in the story have led some critics—e.g., Moore, "Judges," in ICC and "Judges" in SBOT; Budde, Richter—to regard it as composite. Wellhausen, however, considers that the peculiarities are editorial and have been introduced for the purpose of smoothing or explaining the ancient record. Most authorities are agreed that the story is nearly contemporary with the events which it narrates, and that it is of the highest value for the study of the history of Israelite worship.<P>See also <a href="./study/isbe/search.html?string=JUDGES">JUDGES</a>; <a href="./study/isbe/search.html?string=DAN">DAN</a>; <a href="./study/isbe/search.html?string=PRIESTHOOD">PRIESTHOOD</a>.<P>(2) A Reubenite, whose descendant Beerah was carried into exile by Tiglath-pileser (<a onClick="return mV(\'1Ch\',5,5);">1Ch 5:5</a>).<P>(3) A son of Merib-baal (<a onClick="return mV(\'1Ch\',8,34);">1Ch 8:34</a>f; <a onClick="return mV(\'1Ch\',9,40);">9:40</a>f).<P>(4) A Kohathite Levite (<a onClick="return mV(\'1Ch\',23,20);">1Ch 23:20</a>; <a onClick="return mV(\'1Ch\',24,24);">24:24</a>f).<P>(5) The father of Abdon, one of Josiah\'s messengers to the prophetess Huldah (<a onClick="return mV(\'2Ch\',34,20);">2Ch 34:20</a>). In the parallel passage (<a onClick="return mV(\'2Ki\',22,12);">2Ki 22:12</a>), the reading is "Achbor the son of Micaiah," the King James Version "Michaiah."<P>(6) A Simeonite mentioned in the Book of Judith (Judith 6:15).<P>(7) The prophet, called, in <a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a> (Hebrew), "Micaiah the Morashtite." See special article [<A href="./study/isbe/search.html?string=MICAH+(2)">Micah (2)</a>].<P>(8) The son of Imlah.`<a href="./study/isbe/search.html?string=MICAIAH">MICAIAH</a>; <a href="./study/isbe/search.html?string=MICA">MICA</a>`95';
isbe[6018]='Micah (2)`(mikhah; Meichaias; an abbreviation for Micaiah (<a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a>), and this again of the longer form of the word in <a onClick="return mV(\'2Ch\',17,7);">2Ch 17:7</a>; compare <a onClick="return mV(\'1Ki\',22,8);">1Ki 22:8</a>):<P>1. Name and Person:<P>The name signifies "who is like Yah?"; compare Michael, equal to "who is like El?" (i.e. God). As this name occurs not infrequently, he is called the "Morashtite," i.e. born in Moresheth. He calls his native city, in <a onClick="return mV(\'Mic\',1,14);">Mic 1:14</a>, Moresheth-gath, because it was situated near the Philistine city of Gath. According to Jerome and Eusebius, this place was situated not far eastward from Eleutheropolis. The prophet is not to be confounded with Micah ben Imla, in <a onClick="return mV(\'1Ki\',22,8);">1Ki 22:8</a>, an older prophet of the Northern Kingdom.<P>2. Time of Micah:<P>According to <a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a>, Micah lived and prophesied in the reign of Hezekiah; according to <a onClick="return mV(\'Mic\',1,1);">Mic 1:1</a>, he labored also under Jotham and Ahaz. This superscription has, it must be said, great similarity to <a onClick="return mV(\'Isa\',1,1);">Isa 1:1</a> and is probably of a later date. Yet the contents of his first discourse confirm the fact that he prophesied, not only before the destruction of Samaria, but also before the reformation of Hezekiah (compare <a onClick="return mV(\'Mic\',1,5);">Mic 1:5</a>). Accordingly, <a onClick="return mV(\'Mic\',1,\'1-\');">Micah 1</a> is probably a discourse spoken already under Ahaz, and <a onClick="return mV(\'Mic\',2,\'1-\');">Micah 2-5</a> under Hezekiah. No mention is any longer made of Samaria in chapters 2 to 5. This city has already been destroyed; at any rate, is being besieged. Accordingly, these discourses were pronounced after the year 722 BC, but earlier than 701 BC, as the reformation of Hezekiah had not yet been entirely completed. It is impossible to date exactly these discourses, for this reason, that all the separate sentences and addresses were afterward united into one well-edited collection, probably by Micah himself. The attacks that have been made by different critics on the authenticity of <a onClick="return mV(\'Mic\',4,1);">Micah 4</a> and <a onClick="return mV(\'Mic\',5,1);">5</A> have but a poor foundation. It is a more difficult task to explain the dismal picture of the conditions of affairs as described in <a onClick="return mV(\'Mic\',6,\'1-\');">Micah 6</a> and <a onClick="return mV(\'Mic\',7,\'1-\');">7</A> as originating in the reign of Hezekiah. For this reason, scholars have thought of ascribing them to the reigns of Jotham and Ahaz. But better reasons speak for placing them in the degenerate reign of Manasseh. There is no reason for claiming that Micah no longer prophesied in the times of this king. It is true that a number of critics declare that Micah did not write these chapters, especially the so-called psalm in <a onClick="return mV(\'Mic\',7,\'7-20\');">7:7-20</A>, which, it is claimed, clearly presupposes the destruction of Jerusalem (<a onClick="return mV(\'Mic\',7,11);">7:11</A>)! But it is a fact that Micah did really and distinctly predict this destruction and the exile that followed this event in <a onClick="return mV(\'Mic\',3,12);">3:12</A>; and accordingly he could in this concluding hymn very easily have looked even beyond this period.<P>Micah is, then, a younger contemporary of Isaiah, and, like the latter, he prophesied in Judah, perhaps also in Jerusalem. To the writings of this great prophet his book bears a close resemblance both in form and in contents, although he did not, as was the case with Isaiah, come into personal contact with the kings and make his influence felt in political affairs.<P>3. Relation to Isaiah:<P>The statement in <a onClick="return mV(\'Mic\',4,1);">Mic 4:1</a>ff is found almost literally in <a onClick="return mV(\'Isa\',2,2);">Isa 2:2</a>ff. Opinions differ as to who is to be credited with the original, Isaiah or Micah. In the latter, the passage seems to suit better into the connection, while in <a onClick="return mV(\'Isa\',2,\'1-\');">Isa 2</a> it begins the discourse abruptly, as though the prophet had taken it from some other source. However, <a onClick="return mV(\'Mic\',4,4);">Mic 4:4</a>f is certainly a sentence added by Micah, who, accordingly, was not the first to formulate the prophecy itself. It is possible that both prophets took it from some older prophet. But it is also conceivable that Isaiah is the author. In this case, he placed this sentence at the head of his briefer utterances when he composed his larger group of addresses in <a onClick="return mV(\'Mic\',2,\'1-\');">Micah 2-4</a>, for the purpose of expressing the high purposes which God has in mind in His judgments.<P>4. Contents of the Prophecies:<P>Micah combats in his discourses, as does Isaiah, the heathenish abuses which had found their way into the cult, not only in Samaria, but also in Judah and Jerusalem, and which the reformation of Hezekiah could counteract only in part and not at all permanently (compare <a onClick="return mV(\'Mic\',1,\'5-7\');">Mic 1:5-7</a>; <a onClick="return mV(\'Mic\',5,\'11-13\');">5:11-13</a>; <a onClick="return mV(\'Mic\',6,7,16);">6:7,16</a>). Further, he rebukes them for the social injustice, of which particularly the powerful and the great in the land were guilty (<a onClick="return mV(\'Mic\',2,1);">Mic 2:1</a>ff; <a onClick="return mV(\'Mic\',3,2,10);">3:2f,10f</a>); and the dishonesty and unfaithfulness in business and in conduct in general (compare <a onClick="return mV(\'Mic\',6,10);">Mic 6:10</a>ff; <a onClick="return mV(\'Mic\',7,2);">7:2</a>ff). At all times Micah, in doing this, was compelled to defend himself against false prophets, who slighted these charges as of little importance, and threatened and antagonized the prophet in his announcements of impending evil (compare <a onClick="return mV(\'Mic\',2,5,11);">2:5ff, 11ff</a>). In pronounced opposition to these babblers and their predictions of good things, Micah announces the judgment through the enemies that are approaching, and he even goes beyond Isaiah in the open declaration that Jerusalem and the temple are to be destroyed (<a onClick="return mV(\'Mic\',3,12);">Mic 3:12</a>; <a onClick="return mV(\'Mic\',4,10);">4:10</a>; <a onClick="return mV(\'Mic\',5,1);">5:1</a>). The first-mentioned passage is also confirmed by the event reported in <a onClick="return mV(\'Jer\',26,17);">Jer 26:17</a>ff. The passage <a onClick="return mV(\'Mic\',4,10);">Mic 4:10</a>, where in a surprising way Babylon is mentioned as the place of the exile, is for this reason regarded as unauthentic by the critics, but not justly. Micah predicts also the deliverance from Babylon and the reestablishment of Israel in Jerusalem, and declares that this is to take place through a King who shall come forth from the deepest humiliation of the house of David and shall be born in Bethlehem, and who, like David, originally a simple shepherd boy, shall later become the shepherd of the people, and shall make his people happy in peace and prosperity. Against this King the last great onslaught of the Gentiles will avail nothing (<a onClick="return mV(\'Mic\',4,11,12,13);">4:11-13</a>; <a onClick="return mV(\'Mic\',5,4);">5:4</a>ff). As a matter of course, he will purify the country of all heathen abuses (<a onClick="return mV(\'Mic\',5,9);">5:9</A>ff). In the description of this ruler, Micah again agrees with Isaiah, but without taking the details from that prophet.<P>5. Form of the Prophecies:<P>The form of the prophecies of Micah, notwithstanding their close connection with those of his great contemporary, has nevertheless its unique features. There is a pronounced formal similarity between <a onClick="return mV(\'Mic\',1,10);">Mic 1:10</a>ff and <a onClick="return mV(\'Isa\',10,28);">Isa 10:28</a>ff. Still more than is the case in Isaiah, Micah makes use of the names of certain places. Witty references, which we can understand only in part, are not lacking in this connection; e.g. Lachish, the "city of horses," is made the object of a play on words. (Recently in the ruins of this city a large wall has been unearthed.) The style of Micah is vigorous and vivid. He loved antitheses. It is a peculiarity of his style that he indulges in dramatic interruptions and answers; e.g. <a onClick="return mV(\'Mic\',2,5,12);">2:5,12</a>; <a onClick="return mV(\'Mic\',3,1);">3:1</a>; <a onClick="return mV(\'Mic\',6,6,7,8);">6:6-8</A>; <a onClick="return mV(\'Mic\',7,14);">7:14</a>f. He also loves historical references; as e.g. <a onClick="return mV(\'Mic\',1,13,15);">1:13,15</a>; <a onClick="return mV(\'Mic\',5,5);">5:5</a>; <a onClick="return mV(\'Mic\',6,4,6,16);">6:4f; 6,16</A>; <a onClick="return mV(\'Mic\',7,20);">7:20</A>. He makes frequent use of the image of the shepherd, <a onClick="return mV(\'Mic\',2,12);">2:12</A>; <a onClick="return mV(\'Mic\',3,2);">3:2</A>f; <a onClick="return mV(\'Mic\',4,6);">4:6</A>; <a onClick="return mV(\'Mic\',5,3);">5:3</A>ff; <a onClick="return mV(\'Mic\',7,14);">7:14</A>. The fact that these peculiarities appear in all parts of his little book is an argument in favor of its being from one author. He is superior to Isaiah in his tendency to idyllic details, and especially in a deeper personal sympathy, which generally finds expression in an elegiac strain. His lyrical style readily takes the form of a prayer or of a psalm (compare <a onClick="return mV(\'Mic\',7,\'1-\');">Mic 7</a>).<P>LITERATURE.<P>C. P. Caspari; Ueber Micha den Morasthiten, 1851; T.K. Cheyne, Micah with Notes and Introduction, 1882; V. Ryssel, Untersuchungen uber Textoeatalt und Echtheit des Buches Micha, 1887. See the commentaries on the 12 minor prophets by Hitzig, Ewald, C. F. Keil, P. Kleinert, W. Nowack, C. v. Orelli, K. Marti; Paul Haupt, The Book of Micah, 1910; Pusey, The Minor Prophets, 1860.``131';
isbe[6019]='Micaiah`mi-ka\'-ya, mi-ki\'-a (mikhayahu, "who is like Yah?"; Meichaias): A frequently occurring Old Testament name occasionally contracted to <a href="./study/isbe/search.html?string=MICA">MICA</a> or <a href="./study/isbe/search.html?string=MICAH">MICAH</a> (which see). In the King James Version it is usually spelled "Michaiah."<P>(1) The mother of Abijah (<a onClick="return mV(\'2Ch\',13,2);">2Ch 13:2</a>, the King James Version "Michaiah"). The parallel passage (<a onClick="return mV(\'1Ki\',15,2);">1Ki 15:2</a>; compare <a onClick="return mV(\'2Ch\',11,20);">2Ch 11:20</a>) indicates that Michaiah here is a corruption of <a href="./study/isbe/search.html?string=MAACAH">MAACAH</a> (which see) (so the Septuagint).<P>(2) The father of Achbor (<a onClick="return mV(\'2Ki\',22,12);">2Ki 22:12</a>, the King James Version "Michaiah").<P>See <a href="./study/isbe/search.html?string=MICAH">MICAH, (5)</a>.<P>(3) A prince of Judah sent by Jehoshaphat to teach in the cities of Judah (<a onClick="return mV(\'2Ch\',17,7);">2Ch 17:7</a>, the King James Version "Michaiah").<P>(4) The son of Zaccur, a priestly processionist at the derivation of the wall (<a onClick="return mV(\'Neh\',12,35);">Ne 12:35</a>, the King James Version, "Michaiah").<P>(5) A priestly processionist at the dedication of the wall (<a onClick="return mV(\'Neh\',12,41);">Ne 12:41</a>; wanting in the Septuagint (Septuagint)).<P>(6) The canonical prophet.<P>See MICAH, (7), and special article [<a href="./study/isbe/search.html?string=MICAH+(2)">MICAH (2)</A>].<P>(7) The son of Imlah, the chief character of an important episode near the end of the reign of Ahab (<a onClick="return mV(\'1Ki\',22,\'4-28\');">1Ki 22:4-28</a> parallel <a onClick="return mV(\'2Ch\',18,\'3-27\');">2Ch 18:3-27</a>). In the Hebrew, his name appears once in the contracted form "Micah" (<a onClick="return mV(\'2Ch\',18,14);">2Ch 18:14</a>). Ahab had suggested to his victor, Jehoshaphat, king of Judah, that they should undertake a joint campaign against Ramoth-gilead. Jehoshaphat politely acquiesced, but asked that the mind of Yahweh should first be ascertained. Ahab forthwith summoned the official prophets to the number of 400, into the royal presence. Obsequious to their master, they, both by oracular utterance and by the symbolic action of their leader, Zedekiah, the son of Chenaanah, gave the king a favorable answer. Their ready chorus of assent seems to have made Jehoshaphat suspicious, for he pleaded that further guidance be sought. Micaiah, for whom Ahab, then, with evident reluctance, sent, at first simply repeated the favorable response of the 400; but adjured by the king to speak the whole truth, he dropped his ironical tone, and in sad earnest described a vision of disaster. Ahab endeavored to lessen the effect of this oracle by pettishly complaining that Micaiah was always to him a prophet of evil. The latter thereupon related an impressive vision of the heavenly court, whence he had seen a lying spirit dispatched by Yahweh to the prophets in order to bring about Ahab\'s delusion and downfall. In answer to a rude challenge from Zedekiah, who acted as spokesman for the 400, Micaiah confidently appealed to the issue for proof of the truth of his prediction, and was promptly commuted to prison by the king.<P>The narrative is exceedingly vivid and of the utmost interest to students of Issraelite prophecy. Several of its details have given rise to discussion, and the questions: How far were the prophet\'s visions objective? How far did he admit the inspiration of his opponents? Is the Divine action described consistent with the holy character of Yahweh? have occasioned difficulty to many. But their difficulty arises largely either because of their Christian viewpoint, or because of their hard and mechanical theory of prophetic inspiration. Micaiah\'s position was a delicate one. Foreboding or foreseeing disaster, he did his best to avert it. This he could do only by weaning the king from the influence of the 400 time-serving prophets. He sought to gain his end; first, by an ironical acquiescence in their favorable answer; then, by a short oracle forecasting disaster especially to Ahab; and, these means having failed, by discrediting in the most solemn manner the courtly prophets opposed to him. Thus regarded, his vision contains no admission of their equal inspiration; rather is it an emphatic declaration that these men were uttering falsehood in Yahweh\'s name, thereby endangering their country\'s safety and their king\'s life. Their obsequious time-service made them fit forerunners of the false prophets denounced by Jeremiah (<a onClick="return mV(\'Jer\',23,\'9-40\');">Jer 23:9-40</a>) and by Ezekiel (<a onClick="return mV(\'Eze\',13,\'1-15\');">Eze 13:1-15</a>). The frank anthropomorphism of the vision need be no stumbling-block if allowed to drop into its proper place as the literary device of a prophet intensely conscious of his own inspiration and as whole-heartedly patriotic as those opposed to him.<P>The record ends very abruptly, giving no account of Micaiah\'s vindication when at length the course of events brought about the fulfillment of his prediction. The closing words, "Hear, ye peoples, all of you" (<a onClick="return mV(\'1Ki\',22,28);">1Ki 22:28</a> parallel <a onClick="return mV(\'2Ch\',18,27);">2Ch 18:27</a>), a quotation of <a onClick="return mV(\'Mic\',1,2);">Mic 1:2</a>, are an evident interpolation by some late scribe who confused the son of Imlah with the contemporary of Isaiah.<P>For fuller treatment see EB, HDB, and commentaries on Kings and Chronicles.``95';
isbe[6020]='Mice`mis.`<a href="./study/isbe/search.html?string=MOUSE">MOUSE</a>`1';
isbe[6021]='Micha; Michah`mi\'-ka, mi\'-ka.`<a href="./study/isbe/search.html?string=MICA">MICA</a>; <a href="./study/isbe/search.html?string=MICAH">MICAH</a>`1';
isbe[6022]='Michael`mi\'-ka-el, mi\'-kel (mikha\'el, "who is like God?" Michael):<P>(1) The father of Sethur the Asherite spy (<a onClick="return mV(\'Num\',13,13);">Nu 13:13</a>).<P>(2) (3) Two Gadites (<a onClick="return mV(\'1Ch\',5,13,14);">1Ch 5:13,14</a>).<P>(4) A name in the genealogy of Asaph (<a onClick="return mV(\'1Ch\',6,40);">1Ch 6:40 (Hebrew 25)</a>).<P>(5) A son of Izrahiah of Issachar (<a onClick="return mV(\'1Ch\',7,3);">1Ch 7:3</a>).<P>(6) A Benjamite (<a onClick="return mV(\'1Ch\',8,16);">1Ch 8:16</a>).<P>(7) A Manassite who ceded to David at Ziklag (<a onClick="return mV(\'1Ch\',12,20);">1Ch 12:20</a>).<P>(8) The father of Omri of Issachar (<a onClick="return mV(\'1Ch\',27,18);">1Ch 27:18</a>).<P>(9) A son of King Jehoshaphat (<a onClick="return mV(\'2Ch\',21,2);">2Ch 21:2</a>).<P>(10) The father of Zebediah, an exile who returned with Ezra (<a onClick="return mV(\'Ezr\',8,8);">Ezr 8:8</a> parallel 1Es 8:34).<P>(11) "The archangel" (<a onClick="return mV(\'Jud\',1,9);">Jude 1:9</a>). Probably also the unnamed archangel of <a onClick="return mV(\'1Th\',4,16);">1Th 4:16</a> is Michael. In the Old Testament he is mentioned by name only in Daniel. He is "one of the chief princes" (<a onClick="return mV(\'Dan\',10,13);">Da 10:13</a>), the "prince" of Israel (<a onClick="return mV(\'Dan\',10,21);">Da 10:21</a>), "the great prince" (<a onClick="return mV(\'Dan\',12,1);">Da 12:1</a>); perhaps also "the prince of the host" (<a onClick="return mV(\'Dan\',8,11);">Da 8:11</a>). In all these passages Michael appears as the heavenly patron and champion of Israel; as the watchful guardian of the people of God against all foes earthly or devilish. In the uncanonical apocalyptic writings, however, Jewish angelology is further developed. In them Michael frequently appears and excretes functions similar to those which are ascribed to him in Daniel. He is the first of the "four presences that stand before God"—Michael, Gabriel, Raphael and Uriel or Phanuel (En 9:1; 40:9). In other apocryphal books and even elsewhere in En, the number of archangels is given as 7 (En 20:1-7; Tobit 12:15; compare also <a onClick="return mV(\'Rev\',8,2);">Re 8:2</a>). Among the many characterizations of Michael the following may be noted: He is "the merciful and long-suffering" (En 40:9; 68:2,3), "the mediator and intercessor" (Ascension of Isaiah, Latin version 9:23; Testament of the Twelve Patriarchs, <span class="noTag">Levi 5</span>; <a onClick="return mV(\'Dan\',6,\'1-\');">Da 6</a>). It is he who opposed the Devil in a dispute concerning Moses\' body (<a onClick="return mV(\'Jud\',1,9);">Jude 1:9</a>). This passage, according to most modern authorities, is derived from the apocryphal Assumption of Moses (see Charles\' edition, 105-10). It is Michael also who leads the angelic armies in the war in heaven against "the old serpent, he that is called the Devil and Satan" (<a onClick="return mV(\'Rev\',12,7);">Re 12:7</a>). According to Charles, the supplanting of the "child" by the archangel is an indication of the Jewish origin of this part of the book.<P>The earlier Protestant scholars usually identified Michael with the preincarnate Christ, finding support for their view, not only in the juxtaposition of the "child" and the archangel in <a onClick="return mV(\'Rev\',12,\'1-\');">Re 12</a>, but also in the attributes ascribed to him in Daniel (for a full discussion see Hengstenberg, Offenbarung, I, 611-22, and an interesting survey in English by Dr. Douglas in Fairbairn\'s BD).``95';
isbe[6023]='Michah`mi\'-ka.`<a href="./study/isbe/search.html?string=MICAH">MICAH</a>`1';
isbe[6024]='Michaiah`mi-ka\'-ya, mi-ki\'-a.`<a href="./study/isbe/search.html?string=MICAIAH">MICAIAH</a>`1';
isbe[6025]='Michal`mi\'-kal (mikhal, contracted from mikha\'el, "<a href="./study/isbe/search.html?string=MICHAEL">Michael</a>" (which see); Melchol): Saul\'s younger daughter (<a onClick="return mV(\'1Sa\',14,49);">1Sa 14:49</a>), who, falling in love with David after his victory over Goliath (<a onClick="return mV(\'1Sa\',18,20);">1Sa 18:20</a>), was at last, on the payment of double the dowry asked, married to him (<a onClick="return mV(\'1Sa\',18,27);">1Sa 18:27</a>). Her love was soon put to the test. When Saul in his jealousy sent for David, she was quick to discern her husband\'s danger, connived at his escape, and not only outwitted and delayed the messengers, but afterward also soothed her father\'s jealous wrath (<a onClick="return mV(\'1Sa\',19,\'11-17\');">1Sa 19:11-17</a>). When David was outlawed and exiled, she was married to Palti or Paltiel, the son of Laish of Gallim (<a onClick="return mV(\'1Sa\',25,44);">1Sa 25:44</a>), but was, despite Palti\'s sorrowful protest, forcibly restored to David on his return as king (<a onClick="return mV(\'2Sa\',3,\'14-16\');">2Sa 3:14-16</a>). The next scene in which she figures indicates that her love had cooled and had even turned to disdain, for after David\'s enthusiastic joy and ecstatic dancing before the newly restored Ark of the Covenant, she received him with bitter and scornful mockery (<a onClick="return mV(\'2Sa\',6,20);">2Sa 6:20</a>), and the record closes with the fact that she remained all her life childless (<a onClick="return mV(\'2Sa\',6,23);">2Sa 6:23</a>; compare <a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a> where Michal is an obvious mistake for Merab). Michal was evidently a woman of unusual strength of mind and decision of character. She manifested her love in an age when it was almost an unheard-of thing for a woman to take the initiative in such a matter. For the sake of the man whom she loved too she braved her father\'s wrath and risked her own life. Even her later mockery of David affords proof of her courage, and almost suggests the inference that she had resented being treated as a chattel and thrown from one husband to another. The modern reader can scarce withhold from her, if not admiration, at least a slight tribute of sympathy.``95';
isbe[6026]='Micheas; Michaeas`mi-ke\'-as: In 2Esdras 1:39 equals the prophet <a href="./study/isbe/search.html?string=MICAH+(2)">Micah</A>.``1';
isbe[6027]='Michmas`mik\'-mas (mikhmac; Codex Vaticanus Machmas; Codex Alexandrinus Chammas): The form of the name "Michmash" found in <a onClick="return mV(\'Ezr\',2,27);">Ezr 2:27</a>; <a onClick="return mV(\'Neh\',7,31);">Ne 7:31</a>. In 1Esdras 5:21 it appears as <a href="./study/isbe/search.html?string=MACALON">MACALON</a> (which see).``1';
isbe[6028]='Michmash`mik\'-mash (mikhmash; Machmas): A town in the territory of Benjamin, apparently not of sufficient importance to secure mention in the list of cities given in <a onClick="return mV(\'Jos\',18,21);">Jos 18:21</a>ff. It first appears as occupied by Saul with 2,000 men, when Jonathan, advancing from Gibeah, smote the Philistine garrison in Geba (<a onClick="return mV(\'1Sa\',13,2);">1Sa 13:2</a>). To avenge this injury, the Philistines came up in force and pitched in Michmash (<a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>). Saul and Jonathan with 600 men held Geba, which had been taken from the Philistine garrison (<a onClick="return mV(\'1Sa\',13,16);">1Sa 13:16</a>). It will assist in making clear the narrative if, at this point, the natural features of the place are described.<P>Michmash is represented by the modern Mukhmas, about 7 miles north of Jerusalem. From the main road which runs close to the watershed, a valley sloping eastward sinks swiftly into the great gorge of Wady es-Suweinit. The village of Mukhmas stands to the north of the gorge, about 4 miles east of the carriage road. The ancient path from Ai southward passes to the west of the village, goes down into the valley by a steep and difficult track, and crosses the gorge by the pass, a narrow defile, with lofty, precipitous crags on either side—the only place where a crossing is practicable. To the south of the gorge is Geba, which had been occupied by the Philistines, doubtless to command the pass. Their camp was probably pitched in a position east of Mukhmas, where the ground slopes gradually northward from the edge of the gorge. The place is described by Josephus as "upon a precipice with three peaks, ending in a small, but sharp and long extremity, while there was a rock that surrounded them like bulwarks to prevent the attack of the enemy" (Ant., VI, vi, 2). Conder confirms this description, speaking of it as "a high hill bounded by the precipices of Wady es-Suweinit on the south, rising in three flat but narrow mounds, and communicating with the hill of Mukhmas, which is much lower, by a long and narrow ridge." The Philistines purposed to guard the pass against approach from the south. On the other hand they were not eager to risk an encounter with the badly armed Israelites in a position where superior numbers would be of little advantage. It was while the armies lay thus facing each other across the gorge that Jonathan and his armor-bearer performed their intrepid feat (<a onClick="return mV(\'1Sa\',14,1);">1Sa 14:1</a>).<P>See <a href="./study/isbe/search.html?string=BOZEZ">BOZEZ</a>; <a href="./study/isbe/search.html?string=SENEH">SENEH</a>.<P>It will be noted that the Philistines brought their chariots to Michmash (<a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>). In his ideal picture of the Assyrian advance on Jerusalem, Isaiah makes the invader lay up his baggage at Michmash so that he might go lightly through the pass (<a onClick="return mV(\'Isa\',10,28);">Isa 10:28</a>). A company of the men of Michmash (see <a href="./study/isbe/search.html?string=MICHMAS">MICHMAS</a>) returned with Zerubbabel from exile (<a onClick="return mV(\'Ezr\',2,27);">Ezr 2:27</a>; <a onClick="return mV(\'Neh\',7,31);">Ne 7:31</a>). Michmash produced excellent barley. According to the Mishna, "to bring barley to Michmash" was equivalent to our English "to carry coal to Newcastle." Michmash was the seat of government under Jonathan Maccabeus (1Macc 9:73).<P>The modern village is stone-built. There are rock-cut tombs to the north. Cisterns supply the water. There are foundations of old buildings, large stones, and a vaulted cistern.``54';
isbe[6029]='Michmethah`mik\'-me-tha (ha-mikhmethah; Codex Vaticanus Hikasmon; Codex Alexandrinus Machthoth): A place named in defining the territory of Ephraim and Manasseh (<a onClick="return mV(\'Jos\',16,6);">Jos 16:6</a>; <a onClick="return mV(\'Jos\',17,7);">17:7</a>). It is said to lie "before," i.e. to the east of Shechem. In the name itself, the meaning of which is obscure, there is nothing to guide us. The presence of the article, however ("the Michmethah"), suggests that it may not be a proper name, but an appellative, applying to some feature of the landscape. Condor suggests the plain of Makhneh, which lies to the east of Nablus (Shechem), in which there may possibly be an echo of the ancient name.``1';
isbe[6030]='Michri`mik\'-ri (mikhri): A Benjamite dweller in Jerusalem (<a onClick="return mV(\'1Ch\',9,8);">1Ch 9:8</a>).``1';
isbe[6031]='Michtam`mik\'-tam.`<a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`1';
isbe[6032]='Micron`mig\'-ron (mighron; Magon):<P>(1) A place in the uttermost part of Geba—which read here instead of Gibeah—marked by a pomegranate tree, where Saul and his 600 men encamped over against the Philistines, who were in Michmash (<a onClick="return mV(\'1Sa\',14,2);">1Sa 14:2</a>). Josephus describes the distress of Saul and his company as they sat on a high hill (bounos hupselos) viewing the widespread desolation wrought by the enemy. There is, however, nothing to guide us as to the exact spot. Many suppose that the text is corrupt; but no emendation suggested yields any satisfactory result. The place was certainly south of Michmash.<P>(2) (Codex Vaticanus Magedo; Codex Alexandrinus Mageddo): The Migron of <a onClick="return mV(\'Isa\',10,28);">Isa 10:28</a> is mentioned between Aiath (Ai) and Michmash. If the places are there named in consecutive order, this Migron must be sought to the north of Michmash. It may with some confidence be located at Makrun, a ruined site to the north of the road leading from Michmash to Ai.<P>There is nothing extraordinary in two places having the same name pretty close to each other. The two Beth-horons, although distinguished as upper and lower, are a case in point. So also are the two Bethsaidas. There is therefore no need to try to identify the two with one another, as some (e.g. Robertson Smith in Journal of Philology, XIII, 62ff) have attempted to do with no success.``54';
isbe[6033]='Midday`mid\'-da (machatsith ha-yom, tsohorayim; hemera mese): The Hebrew machatsith ha-yom (<a onClick="return mV(\'Neh\',8,3);">Ne 8:3</a>) and the Greek hemeras meses (<a onClick="return mV(\'Act\',26,13);">Ac 26:13</a>) are strictly the middle of the day, but the Hebrew tshorayim is a dual form from tsohar, meaning "light," hence, light or brightness, i.e. the brightest part of the day (<a onClick="return mV(\'1Ki\',18,29);">1Ki 18:29</a>).`<a href="./study/isbe/search.html?string=NOON">NOON</a>`1';
isbe[6034]='Middin`mid\'-in (middin; in GB, Ainon, "springs"): One of the six cities in the wilderness of Judah (<a onClick="return mV(\'Jos\',15,61);">Jos 15:61</a>). There are not many possible sites. The Hebrew name may possibly survive in Khirbet Mird, a very conspicuous site with many ancient cisterns overlooking the plateau el Bukea\', above which it towers to a height of 1,000 ft.; it is the Mons Mardes of early Christian pilgrims; the existing remains are Byzantine. It is a site of great natural strength and was clearly once a place of some importance. The Greek reading Ainon, "place of springs," suggests the neighborhood of the extensive oasis of \'Ain Feshkhah at the northwest corner of the Dead Sea where there are at Kh. Kumram remains of buildings and a rock-cut aqueduct. See PEF, III, 210, 212, Sh XVIII.``117';
isbe[6035]='Middle Wall``<a href="./study/isbe/search.html?string=PARTITION">PARTITION</a>`1';
isbe[6036]='Midian; Midianites`mid\'-i-an, mid\'-i-an-its (midhyan, midhyanim; Madiam, Madienaioi):<P>1. The Seed of Abraham to the Time of the Judges:<P>Midian was a son of Abraham by his concubine Keturah. To him were born 5 sons, Ephah, Epher, Hanoch, Abida and Eldaah (<a onClick="return mV(\'Gen\',25,2,4);">Ge 25:2,4</a>; <a onClick="return mV(\'1Ch\',1,32);">1Ch 1:32</a>f). Bearing gifts from Abraham, he and his brothers, each with his own household, moved off from Isaac into "the east country" (<a onClick="return mV(\'Gen\',25,6);">Ge 25:6</a>). The first recorded incident in the history of the tribe is a defeat suffered "in the field of Moab" at the hands of Hadad, king of Edom. Of this nothing beyond the fact is known (<a onClick="return mV(\'Gen\',36,35);">Ge 36:35</a>; <a onClick="return mV(\'1Ch\',1,46);">1Ch 1:46</a>). The Midianites next appear as merchantmen traveling from Gilead to Egypt, with "spicery and balm and myrrh," with no prejudice against a turn of slave-dealing (<a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>). Moses, on fleeing from Egypt, found refuge in the land of Midian, and became son-in-law of Jethro, the priest of Midian (<a onClick="return mV(\'Exd\',2,15,21);">Ex 2:15,21</a>). In Midian Moses received his commission to Israel in Egypt (<a onClick="return mV(\'Exd\',4,19);">Ex 4:19</a>). A Midianite, familiar with the desert, acted as guide ("instead of eyes") to the children of Israel in their wilderness wanderings (<a onClick="return mV(\'Num\',10,29);">Nu 10:29</a>). The friendly relations between Israel and Midian, which seem to have prevailed at first, had been ruptured, and we find the elders of Midian acting with those of Moab in calling Balaam to curse Israel (<a onClick="return mV(\'Num\',22,\'4-7\');">Nu 22:4-7</a>). Because of the grievous sin into which they had seduced Israel on the shrewd advice of Balaam, a war of vengeance was made against the Midianites in which five of their chiefs perished; the males were ruthlessly slain, and Balaam also was put to death (<a onClick="return mV(\'Num\',25,15,17);">Nu 25:15,17</a>; <a onClick="return mV(\'Num\',31,2);">31:2</a>). We next hear of Midian as oppressing Israel for 7 years. Along with the Amalekites and the children of the East they swarmed across the Jordan, and their multitudinous beasts swept up the produce of the earth. Overwhelming disaster befell this horde at the onset of Gideon\'s chosen men. In the battle and pursuit "there fell a hundred and twenty thousand men that drew sword"; their kings, Zebah and Zalmunna, and their princes, Oreb and Zeeb, sharing the common fate (<a onClick="return mV(\'Jdg\',6,\'1-\');">Jud 6</a>; <a onClick="return mV(\'Jdg\',7,\'1-\');">7</a>; <a onClick="return mV(\'Jdg\',8,\'1-\');">8</a>). Echoes of this glorious victory—"the day of Midian"—are heard in later literature (<a onClick="return mV(\'Psa\',83,9);">Ps 83:9</a>; <a onClick="return mV(\'Isa\',9,4);">Isa 9:4</a>; <a onClick="return mV(\'Isa\',10,26);">10:26</a>; <a onClick="return mV(\'Hab\',3,7);">Hab 3:7</a>).<P>2. The Kenite Branch:<P>The Kenites appear to have been a branch of the Midianites. Jethro could hardly have attained the dignity of the priesthood in Midian had he been of alien blood (<a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>). See <a href="./study/isbe/search.html?string=KENITES">KENITES</A>. Again, the tribesmen are named indifferently Ishmaelites and Midianites (<a onClick="return mV(\'Gen\',37,25,28,36);">Ge 37:25,28,36</a>; <a onClick="return mV(\'Jdg\',8,22,24);">Jud 8:22,24</a>). They must therefore have stood in close relations with the descendants of Hagar\'s son.<P>3. Modern Arabs:<P>The representations of Midian in Scripture are consistent with what we know of the immemorial ways of Arabian tribes, now engaged in pastoral pursuits, again as carriers of merchandise, and yet again as freebooters. Such tribes often roam through wide circles. They appear not to have practiced circumcision (<a onClick="return mV(\'Exd\',4,25);">Ex 4:25</a>), which is now practically universal among the Arabs. The men wore golden ornaments, as do the modern nomads (<a onClick="return mV(\'Jdg\',8,24);">Jud 8:24</a>).<P>4. Historical References:<P>The name of "Midian" is not found in Egyptian or Assyrian documents. Delitzsch (Wo lag das Paradies? 304) suggests that Ephah (<a onClick="return mV(\'Gen\',25,4);">Ge 25:4</a>) may be identical with Chayapa of the cuneiform inscriptions. If this is correct the references point to the existence of this Midianite tribe in the north of el-Chijaz in the times of Tiglath-pileser and Sargon (745-705 BC). Isaiah speaks of Midian and Ephah apparently as separate tribes, whose dromedaries bear gold and frankincense to Zion (<a onClick="return mV(\'Isa\',60,2);">60:6</A>); but he gives no hint of the districts they occupied. The tribe of Ghifar, found in the neighborhood of Medina in Mohammed\'s day, Knobel would identify with Epher, another of Midian\'s sons.<P>5. Territory:<P>No boundaries can now be assigned to "the land of Midian." It included territory on the west as well as on the east of the Gulf of \'Aqaba (<a onClick="return mV(\'Exd\',4,19);">Ex 4:19</a>). It lay between Edom and Paran (<a onClick="return mV(\'1Ki\',11,18);">1Ki 11:18</a>). In the time of the Judges their district seems to have extended northward to the east of Gilead (<a onClick="return mV(\'Jdg\',8,10);">8:10</a>).<P>A trace of the ancient name is found in that of Madyah, a place mentioned by the Arabic geographers, with a plentiful supply of water, now called Maghair Sho\'aib. It lies east of the Gulf of \'Aqaba, some miles from the coast, almost opposite the point of the Sinaitic peninsula. The name Sho\'aib, given by Mohammed to Jethro, may here be due to ancient Midianite tradition.``54';
isbe[6037]='Midianitish, Woman`mid\'-i-an-it-ish, (ha-midhyanith, "the Midianitess"): The designation given to the daughter of Zur, Cozbi, whom Zimri the son of Salu brought into the camp of Israel (<a onClick="return mV(\'Num\',25,\'6-18\');">Nu 25:6-18</a>). Both were of noble parentage (<a onClick="return mV(\'Num\',25,14,15);">Nu 25:14,15</a>). The majority of the people strongly resented this act of profanation (<a onClick="return mV(\'Num\',25,6);">Nu 25:6</a>). A pestilence was raging in the camp, and Phinehas, the son of Eleazar, in an outburst of zeal pursued the two delinquents and slew them by a spear-thrust through their bodies (<a onClick="return mV(\'Num\',25,8);">Nu 25:8</a>). He obtained as a reward the immediate staying of the plague and the promise of perpetual priesthood to his family (<a onClick="return mV(\'Num\',25,8,13);">Nu 25:8,13</a>).``95';
isbe[6038]='Midnight`mid\'-nit (chatsoth laylah, "middle of the night" (<a onClick="return mV(\'Exd\',11,4);">Ex 11:4</a>; <a onClick="return mV(\'Job\',34,20);">Job 34:20</a>; <a onClick="return mV(\'Psa\',119,62);">Ps 119:62</a>), chatsi ha-laylah, "the half of the night" (<a onClick="return mV(\'Exd\',12,29);">Ex 12:29</a>; <a onClick="return mV(\'Jdg\',16,3);">Jud 16:3</a>; <a onClick="return mV(\'Rth\',3,8);">Ru 3:8</a>), tokh ha-laylah, "the division of the night" and hence, the middle point (<a onClick="return mV(\'1Ki\',3,20);">1Ki 3:20</a>); meses nuktos (<a onClick="return mV(\'Mat\',25,6);">Mt 25:6</a>), or meson tes nuktos, "the middle of the night" (<a onClick="return mV(\'Act\',27,27);">Ac 27:27</a>), mesonuktios, "midnight"; Westcott and Hort, The New Testament in Greek, mesonuktion (<a onClick="return mV(\'Act\',16,25);">Ac 16:25</a>, etc.)): In the period before the exile midnight does not seem to have been very accurately determined. The division of the night was into three watches, the middle one of which included midnight. In New Testament times the four-watch division was used where midnight must have been more or less accurately determined.`<a href="./study/isbe/search.html?string=TIME">TIME</a>; <a href="./study/isbe/search.html?string=WATCH">WATCH</a>`138';
isbe[6039]='Midrash`mid\'-rash (midhrash): The Hebrew word corresponding to the King James Version "story" and the Revised Version (British and American) "commentary" in <a onClick="return mV(\'2Ch\',13,22);">2Ch 13:22</a>; <a onClick="return mV(\'2Ch\',24,27);">24:27</a>. A midrash is properly a story developed for purposes of edification.`<a href="./study/isbe/search.html?string=COMMENTARY">COMMENTARY</a>`1';
isbe[6040]='Midwife`mid\'-wif (meyalledheth): Those who in patriarchal times attended mothers at childbirth are so named in <a onClick="return mV(\'Gen\',35,17);">Ge 35:17</a>; <a onClick="return mV(\'Gen\',38,28);">38:28</a>; <a onClick="return mV(\'Exd\',1,\'15-22\');">Ex 1:15-22</a>. Such attendants were probably then (<a onClick="return mV(\'1Sa\',4,20);">1Sa 4:20</a>), as they usually are now, the older female relatives and friends of the mother. The duties which they had to perform are enumerated in <a onClick="return mV(\'Eze\',16,4);">Eze 16:4</a>: division of the cord, washing the infant in water, salting with salt and swathing in swaddling clothes. During the Egyptian bondage there were two midwives who attended the Hebrew women; from their names, they were probably Hebrews, certainly they were not Egyptians. From this passage it appears that they used a certain double-round form of birthstool called \'obhnayim, concerning which there are several rabbinical comments. It probably was like the kuru elwiladeh, or "birth-seat," still used by the Egyptian fellahin. I have not found any record of its use among the Palestinian fellahin. There is a curious passage in the Talmud (Cotah 2 b) in which it is said that the two midwives had different duties, Shiphrah being the one who dressed the infant, Puah, the one who whispered to it. One Jewish commentator on this supposes that Puah used artificial respiration by blowing into the child\'s mouth. The midwives must have had considerable skill, as a case like that of Tamar required some amount of operative manipulation.<P>The English word means originally the woman who is "with the mother" (compare "the women that stood by," in <a onClick="return mV(\'1Sa\',4,20);">1Sa 4:20</a>), but very early became applied to those who gave skilled assistance, as in Raynold\'s Birth of Mankind, 1565.``107';
isbe[6041]='Migdal-Eder`mig-dal-e-der.`<a href="./study/isbe/search.html?string=EDER">EDER</a>`1';
isbe[6042]='Migdal-El`mig\'-dal-el (mighdal-\'el; Codex Vaticanus Megalaareim; Codex Alexandrinus Magdalieoram): The name, which means "tower of God," occurs between Iron and Horem in the list of the fenced cities of Naphtali (<a onClick="return mV(\'Jos\',19,38);">Jos 19:38</a>). Eusebius, Onomasticon places it 9 miles from Dora (Tanturah), on the way to Ptolemais, which points to Athlit. But this is far from the territory of Naphtali. It is probably to be identified with either Khirbet Mejdel, 3 miles north of Qedes, or Mejdel Islim, 5 miles farther to the northwest.``1';
isbe[6043]='Migdal-Gad`mig\'-dal-gad (mighdalgadh, "tower of Gad"): One of a group of 16 cities of Judah situated in the "lowland" (<a onClick="return mV(\'Jos\',15,37);">Jos 15:37</a>). Of these, only Lachish, Eglon, Beth-dagon and Naamah have been identified with any certainty. This would indicate a site in the Philistine plain, and the modern flourishing town of Mejdel, 2 1/2 miles northeast of Ashkelon, appears to be a possible identification. It is the most important town in the district which is named after it Nahiet el-Mejdel. It must, however, be admitted that it is difficult to see how Judah could have held a site so close to the great Philistine strongholds. It is very probable that Mejdel ("tower") is the tower mentioned in Josephus, BJ, III, ii, 3, as close to Ashkelon, and it or Migdalgad (or both if they are the same sites) may be identical with the Magtal of the Tell el-Amarna Letters (Petrie, Hist. Egypt, II, 329). For Mejdel see Palestine Exploration Fund, II, 410, Sh XVI.``117';
isbe[6044]='Migdol`mig\'-dol, mig\'-dol (mighdol; Magdolon): This name ("the tower") is applied to two places on the east frontier of Egypt.<P>1. <a onClick="return mV(\'Exd\',14,2);">Exodus 14:2</a>; <a onClick="return mV(\'Num\',33,7);">Numbers 33:7</a>:<P>In <a onClick="return mV(\'Exd\',14,2);">Ex 14:2</a>; <a onClick="return mV(\'Num\',33,7);">Nu 33:7</a>, the Hebrew camp, on the march from Etham after they had "turned" (apparently to the south), is defined as \'facing Pi-hahiroth, between Migdol and the sea, over against Baal-zephon.\' It is thus to be sought (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS</A>) west of the Bitter Lakes, and may have been a watchtower on the spur of Jebel \'Ataqah. Israel was supposed to be "entangled in the land," and shut in in the "wilderness," between this range and the Bitter Lakes, then forming the head of the Red Sea. The exact site is unknown. In about 385 AD, Silvia, traveling from Clysma (Suez), was shown the sites above mentioned on her way to Heroopolis, but none of these names now survive.<P>2. <a onClick="return mV(\'Jer\',44,1);">Jeremiah 44:1</a>; <a onClick="return mV(\'Jer\',46,14);">46:14</a>:<P>In <a onClick="return mV(\'Jer\',44,1);">Jer 44:1</a>; <a onClick="return mV(\'Jer\',46,14);">46:14</a>, a Migdol is noticed with Memphis, and with Tahpanhes Septuagint "Taphnas"), this latter being supposed to be the Daphnai of Greek writers, now Tell Defeneh, west of Qantarah. The same place is probably intended in <a onClick="return mV(\'Eze\',29,10);">Eze 29:10</a>; <a onClick="return mV(\'Eze\',30,6);">30:6</a> (compare <a onClick="return mV(\'Eze\',30,\'15-18\');">30:15-18</a>), the borders of Egypt being defined as reaching "from Migdol to Syene" (see the Revised Version margin), as understood by the Septuagint translators. The Antonine Itinerary places Migdol 12 miles south of Pelusium, and the site appears to have been at or near Tell es Samut, the Egyptian name, according to Brugsch (Hist, II, 351), being Samut. This Migdol was thus apparently a "watchtower" on the main road along the coast from Palestine, which is called (<a onClick="return mV(\'Exd\',13,17);">Ex 13:17</a>) "the way of the land of the Philistines," entering Egypt near Daphnai.<P>These Sites Not Identical.<P>We are specially told that this was not the route taken at the exodus, and this Migdol cannot therefore be the same as (1), though Brugsch, in consequence of a theory as to the exodus which has not been accepted by other scholars, has confused the two sites, as apparently does the Antonine Itinerary when placing Pithom on the same route leading to Zoan. Brugsch (Geography, III, 19) supposes the Egyptian town name Pa-Ma\'kal (with the determinative for "wall" added) to stand for Migdol, but the prefix "Pa-" ("city") seems to show that this word is purely native, and not Semitic, to say nothing of philological objections. This town may, however, have lain in the required direction, according to a scribe\'s report of the time of Seti II (or about 1230 BC).<P>As much confusion has been created by quoting this report as illustrative of the exodus, the actual words according to Brugsch\'s translation may be given (History, II, 132): "I set out from the hall of the royal palace on the 9th day of Epiphi, in the evening, after the two servants. I arrived at the fortress Thuku (T-k-u) on the 10th of Epiphi. I was informed that the men had resolved to take their way toward the south. On the 12th I reached Khetam. There I was informed that grooms who had come from the neighborhood (of the "sedge city") reported that the fugitives had already passed the rampart (Anbu or "wall"), to the north of the Ma\'ktal of King Seti Minepthah." As to the position of this "wall," see <a href="./study/isbe/search.html?string=SHUR">SHUR</a>.``28';
isbe[6045]='Mijamin`mij\'-a-min (miyamin; the King James Version Miamin):<P>(1) One of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>). He is also called Maelus (1Esdras 9:26).<P>(2) The one to whom fell the lot for the 6th priestly course (<a onClick="return mV(\'1Ch\',24,9);">1Ch 24:9</a>). His family returned with Zerubbabel and Joshua (<a onClick="return mV(\'Neh\',12,5);">Ne 12:5</a>).<P>(3) A signatory of the Covenant (<a onClick="return mV(\'Neh\',10,7);">Ne 10:7</a>).``1';
isbe[6046]='Mikloth`mik\'-loth, mik\'-loth (miqloth):<P>(1) A Benjamite, son of Jeiel (<a onClick="return mV(\'1Ch\',8,32);">1Ch 8:32</a>; <a onClick="return mV(\'1Ch\',9,37,38);">9:37,38</a>). A comparison of the two passages shows that the name Mikloth has been dropped at the end of <a onClick="return mV(\'1Ch\',8,31);">1Ch 8:31</a>.<P>(2) An officer designated "the ruler," appointed in the priestly course for the 2nd month (<a onClick="return mV(\'1Ch\',27,4);">1Ch 27:4</a>).``1';
isbe[6047]='Mikneiah`mik-ne\'-ya, mik-ni\'-a (miqneydhu): A Levite doorkeeper (<a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18</a>).``1';
isbe[6048]='Milalai`mil-a-la\'-i, mil\'-a-li (milalay): A Levite musician (<a onClick="return mV(\'Neh\',12,36);">Ne 12:36</a>).``1';
isbe[6049]='Milcah`mil\'-ka (milkah; Melcha):<P>(1) Daughter of Haran, wife of Nahor, and grandmother of Rebekah (<a onClick="return mV(\'Gen\',11,29);">Ge 11:29</a>; <a onClick="return mV(\'Gen\',22,\'20-23\');">22:20-23</a>; <a onClick="return mV(\'Gen\',24,15,24,47);">24:15,24,47</a>).<P>(2) Daughter of Zelophehad (<a onClick="return mV(\'Num\',26,33);">Nu 26:33</a>; <a onClick="return mV(\'Num\',27,1);">27:1</a>; <a onClick="return mV(\'Num\',36,11);">36:11</a>; <a onClick="return mV(\'Jos\',17,3);">Jos 17:3</a>). Many recent authorities are of opinion that Milcah is an abbreviation of Bethmilcah, and is a geographical rather than a personal name.``1';
isbe[6050]='Milcom`mil\'-kom, mil\'-kom.`<a href="./study/isbe/search.html?string=MOLECH">MOLECH</a>`1';
isbe[6051]='Mildew`mil\'-du (yeraqon; Septuagint usually ikteros, literally, "jaundice"): In the 5 passages where it occurs it is associated with shiddaphon, "blasting" (<a onClick="return mV(\'Deu\',28,22);">De 28:22</a>; <a onClick="return mV(\'1Ki\',8,37);">1Ki 8:37</a>; <a onClick="return mV(\'2Ch\',6,28);">2Ch 6:28</a>; <a onClick="return mV(\'Amo\',4,9);">Am 4:9</a>; <a onClick="return mV(\'Hag\',2,17);">Hag 2:17</a>). In <a onClick="return mV(\'Jer\',30,6);">Jer 30:6</a>, the same word is translated "paleness," the yellow color of one with abdominal disease. The root-meaning is "greenish yellow"; compare the Arabic yarqan, meaning both "jaundice" and "blight." Mildrew or "rust" in grain is due to a special fungus, Puccinia graminis, whose life is divided between the barberry and cereals. Many other varieties of fungi which flourish upon other plants are also designated "mildew."`<a href="./study/isbe/search.html?string=BLASTING">BLASTING</a>`117';
isbe[6052]='Mile`mil (milion, Latin mille passus, milia passuum): A thousand paces, equal to 1,618 English yards. (<a onClick="return mV(\'Mat\',5,41);">Mt 5:41</a>).`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[6053]='Miletus`mi-le\'-tus (Miletos): A famous early Ionian Greek city on the coast of Caria, near the mouth of the Meander River, which, according to <a onClick="return mV(\'Act\',20,\'15-\');">Ac 20:15</A>-<a onClick="return mV(\'Act\',21,1);">21:1</a>, and <a onClick="return mV(\'2Ti\',4,20);">2Ti 4:20</a> (the King James Version "Miletum"), Paul twice visited. In the earliest times it was a prominent trading post, and it is said that 75 colonies were founded by its merchants. Among them were Abydos, Cyzicus and Sinope. In 494 BC, the city was taken by the Persians; it was recovered by Alexander the Great, but after his time it rapidly declined, yet it continued to exist until long after the Christian era. In the history of early Christianity it plays but a little part. The Meander brings down a considerable amount of sediment which it has deposited at its mouth, naturally altering the coast line. The gulf into which the river flows has thus been nearly filled with the deposit. In the ancient gulf stood a little island called Lade; the island now appears as a mound in the marshy malarial plain, and Palatia, the modern village which stands on the site of Miletus, <span class="noTag">is</span> 6 miles from the coast. Without taking into account the great changes in the coast line it would be difficult to understand <a onClick="return mV(\'Act\',20,\'15-21\');">Ac 20:15-21</a>, for in the days of Paul, Ephesus could be reached from Miletus by land only by making a long detour about the head of the gulf. To go directly from one of these cities to the other, one would have been obliged to cross the gulf by boat and then continue by land. This is what Paul\'s messenger probably did. The direct journey may now be made by land. Miletus has been so ruined that its plan can no longer be made out. Practically the only remaining object of unusual interest is theater, the largest in Asia Minor, which was not built in a hollow of the hillside, as most ancient theaters were, but in the open field.``7';
isbe[6054]='Milk`milk (chalabh; gala; Latin lac (2Esdras 2:19; 8:10)): The fluid secreted by the mammary glands of female mammals for the nourishment of their young. The word is used in the Bible of that of human beings (<a onClick="return mV(\'Isa\',28,9);">Isa 28:9</a>) as well as of that of the lower animals (<a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>). As a food it ranked next in importance to bread (Ecclesiasticus 39:26). Palestine is frequently described as a land "flowing with milk and honey" (<a onClick="return mV(\'Exd\',3,8,17);">Ex 3:8,17</a>; <a onClick="return mV(\'Num\',13,27);">Nu 13:27</a>; <a onClick="return mV(\'Deu\',6,3);">De 6:3</a>; <a onClick="return mV(\'Jos\',5,6);">Jos 5:6</a>; <a onClick="return mV(\'Jer\',11,5);">Jer 11:5</a>; <a onClick="return mV(\'Eze\',20,6,15);">Eze 20:6,15</a>). Milk was among the first things set before the weary traveler (<a onClick="return mV(\'Gen\',18,8);">Ge 18:8</a>). In fact, it was considered a luxury (<a onClick="return mV(\'Jdg\',5,25);">Jud 5:25</a>; <a onClick="return mV(\'Sgs\',5,1);">So 5:1</a>). The people used the milk of kine and also that of sheep (<a onClick="return mV(\'Deu\',32,14);">De 32:14</a>), and especially that of goats (<a onClick="return mV(\'Pro\',27,27);">Pr 27:27</a>). It was received in pails (\'atinim, <a onClick="return mV(\'Job\',21,24);">Job 21:24</a>), and kept in leather bottles (no\'dh, <a onClick="return mV(\'Jdg\',4,19);">Jud 4:19</a>), where it turned sour quickly in the warm climate of Palestine before being poured out thickly like a melting substance (nathakh; compare <a onClick="return mV(\'Job\',10,10);">Job 10:10</a>). Cheese of various kinds was made from it (gebhinah and charitse he-chalabh, literally, "cuts of milk"); or the curds (chem\'ah) were eaten with bread, and possibly also made into butter by churning (<a onClick="return mV(\'Pro\',30,33);">Pr 30:33</a>). See <a href="./study/isbe/search.html?string=FOOD">FOOD, II</a>. It is possible that milk was used for seething other substances; at least the Israelites were strictly forbidden to seethe a kid in its mother\'s milk (<a onClick="return mV(\'Exd\',23,19);">Ex 23:19</a>; <a onClick="return mV(\'Exd\',34,26);">34:26</a>; <a onClick="return mV(\'Deu\',14,21);">De 14:21</a>), and by a very general interpretation of these passages Jews have come to abstain from the use of mixtures of meat and milk of all kinds.<P>Figuratively the word is used<P>(1) of abundance (<a onClick="return mV(\'Gen\',49,12);">Ge 49:12</a>);<P>(2) of a loved one\'s charms (<a onClick="return mV(\'Sgs\',4,11);">So 4:11</a>);<P>(3) of blessings (<a onClick="return mV(\'Isa\',55,1);">Isa 55:1</a>; <a onClick="return mV(\'Joe\',3,18);">Joe 3:18</a>);<P>(4) of the (spiritual) food of immature people (<a onClick="return mV(\'1Cr\',3,2);">1Co 3:2</a>; <a onClick="return mV(\'Hbr\',5,12,13);">Heb 5:12,13</a>);<P>(5) of purity (<a onClick="return mV(\'1Pe\',2,2);">1Pe 2:2</a>).``81';
isbe[6055]='Mill; Millstone`mil, mil\'-ston (recheh; mulos, mulon): The two most primitive methods of grinding grain were<P>(1) by pounding it in a mortar, and<P>(2) by rubbing it between two stones.<P>In <a onClick="return mV(\'Num\',11,8);">Nu 11:8</a> both methods are mentioned as used for rendering the manna more fit for cooking. Numerous examples of both mill and mortar have been found in ancient excavations. Bliss and Macalister in their excavations at Gezer and other places have found specimens of what is called the saddle-quern or mill, which consists of two stones. The "nether" stone, always made of hard lava or basalt from the district of the Hauran, was a large heavy slab varying in length from 1 1/2 ft. to 2 3/4 ft., and in width from 10 inches to 1 1/3 ft. Its upper surface was hollowed out slightly, which made it look a little like a saddle and may have suggested the name of "riding millstone" applied by the Hebrews to the upper stone which rested on it (<a onClick="return mV(\'Jdg\',9,53);">Jud 9:53</a>). The "upper stone" or "rider" was much smaller, 4 inches to 8 in. long and 2 3/4 inches to 6 inches wide, and of varying shapes. This could be seized with the two hands and rubbed back and forth over the nether stone much the same as clothes are scrubbed on a wash-board. Such a stone could be used as a weapon (<a onClick="return mV(\'Jdg\',9,53);">Jud 9:53</a>; <a onClick="return mV(\'2Sa\',11,21);">2Sa 11:21</a>), or given as a pledge (<a onClick="return mV(\'Deu\',24,6);">De 24:6</a>).<P>Macalister goes so far as to say that "the rotary handquern in the form used in modern Palestine and in remote European regions, such as the Hebrides, is quite unknown throughout the whole history, even down to the time of Christ" (Excavations at Gezer). The same writer, however, describes some mills belonging to the 3rd and 4th Sere periods which are much like the present rotary quern, except smaller (4 inches to 6 inches in diameter), and with no provision for a turning handle. Schumacher describes these as paint grinders. The only perforated upper millstones found in the excavations at Gezer belong to the early Arabic period.<P>If the above assertions are substantiated then we must alter somewhat the familiar picture of the two women at the mill (<a onClick="return mV(\'Mat\',24,41);">Mt 24:41</a>), commonly illustrated by photographs of the mills still used in modern Palestine These latter consist of two stone discs each 18 inches to 20 inches in diameter, usually made of Hauran basalt. The upper one is perforated in the center to allow it to rotate on a wooden peg fixed in the nether stone, and near the circumference of the upper stone is fixed a wooden handle for turning it. The grain to be ground is fed into the central hole on the upper stone and gradually works down between the stones. As the grain is reduced to flour, it flies out from between the stones on to a cloth or skin placed underneath the mill. To make the flour fine it is reground and sifted. Larger stones 4 ft. to 5 ft. in diameter, working on the principle of the handmill, are still used for grinding sesame seed. These are turned by asses or mules. Another form of mill, which is possibly referred to in <a onClick="return mV(\'Mat\',18,6);">Mt 18:6</a>; <a onClick="return mV(\'Mar\',9,42);">Mr 9:42</a>; <a onClick="return mV(\'Rev\',18,21,22);">Re 18:21,22</a>, consisted of a conical nether stone on which "rode" a second stone like a hollowed-out capstan. The upper stone was probably turned with handspikes in much the same way as an old-fashioned ship\'s capstan was turned. The material to be ground was fed into the upper cone which formed the hopper and from which it was delivered to the grinding surfaces between the "rider" and the nether stone. This form of mill must have been known in late Biblical times, because many examples of the upper stone dating from the Greek-Roman period have been found. One may be seen in the museum of the Syrian Protestant College at Beirut. Another large one lies among the ruins at Petra, etc. In <a onClick="return mV(\'Mat\',18,6);">Mt 18:6</a>; <a onClick="return mV(\'Mar\',9,42);">Mr 9:42</a>, the mill is described as a mulos onikos, literally, a mill turned by an ass, hence, a great millstone. It is not at all unlikely that the writers have confused the meaning of onos (chamor), a term commonly applied to the upper millstone of a handmill, thinking it referred instead to the animal which turned the mill. This explanation would make Christ\'s words of condemnation more applicable. The upper millstone of a handmill would be more than sufficient to sink the condemned, and the punishment would be more easily carried out. A few years from now handmills will have disappeared from the Syrian households, for the more modern gristmills turned by water or other motor power are rapidly replacing them.<P>See <a href="./study/isbe/search.html?string=CRAFTS">CRAFTS, II, 8</a>.<P>Figuratively:<P>(1) Of firmness and undaunted courage (<a onClick="return mV(\'Job\',41,24);">Job 41:24</a>). "The heart of hot-blooded animals is liable to sudden contractions and expansions, producing rapid alternations of sensations; not so the heart of the great saurians" (Canon Cook, at the place).<P>(2) To "grind the face of the poor" (<a onClick="return mV(\'Isa\',3,15);">Isa 3:15</a>) is cruelly to oppress and afflict them.<P>(3) The ceasing of the sound of the millstone was a sign of desolation (<a onClick="return mV(\'Jer\',25,10);">Jer 25:10</a>; <a onClick="return mV(\'Rev\',18,22);">Re 18:22</a>).``133';
isbe[6056]='Millennium, Postmillennial View``<a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>`1';
isbe[6057]='Millennium, Premillennial View`mi-len\'-i-um<P><b>Divergent Views—Scope of Article</b><p><b>I. THE TEACHING OF JESUS</b><P class="in15">The Millennium Not before the Advent<P class="in30">(1) Parable of the Wheat and Tares<P class="in30">(2) Parable of the Pounds<P><b>II. TEACHING OF THE APOSTLES</b><P class="in15">1. Expectation of the Advent<P class="in15">2. Possibility of Survival—Its Implications<P class="in15">3. Prophecy of "Man of Sin"<P class="in15">4. No Room for Millennium<P class="in15">5. Harmony of Christ and Apostles<P><b>LITERATURE</b><hr /><P>Divergent Views—Scope of Article:<P>The great majority of evangelical Christians believe that the kingdom of God shall have universal sway over the earth, and that righteousness and peace and the knowledge of the Lord shall everywhere prevail. This happy time is commonly called the Millennium, or the thousand years\' reign. Divergent views are entertained as to how it is to be brought about. Many honest and faithful men hold that it will be introduced by the agencies now at work, mainly by the preaching of the gospel of Christ and the extension of the church over the world. An increasing number of men equally honest teach that the Millennium will be established by the visible advent of the Lord Jesus Christ. The aim of this brief article is to set forth some of the Scriptural grounds on which this latter view rests. No reference will be made to objections, to counter-objections and interpretations; the single point, namely, that the Millennium succeeds the second coming of Jesus Christ, that it does not precede it, will be rigidly adhered to. Those who hold this view believe that neither Christ nor His apostles taught, on fair principles of interpretation, that the Millennium must come before His advent.<P>I. The Teaching of Jesus.<P>The Lord Jesus said nothing about world-wide conversion in His instructions to His disciples touching their mission (<a onClick="return mV(\'Mat\',28,19,20);">Mt 28:19,20</a>; <a onClick="return mV(\'Mar\',16,15);">Mr 16:15</a>; <a onClick="return mV(\'Luk\',24,\'46-48\');">Lu 24:46-48</a>; <a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>).<P>The Millennium Not before the Advent:<P>They were to be His witnesses and carry His message to the race, but He does not promise the race will receive their testimony, or that men will generally accept His salvation. On the contrary, He explicitly forewarns them that they shall be hated of all men, that sufferings and persecutions shall be their lot, but if they are faithful to the end their reward will be glorious. But world-wide evangelism does not mean world-wide conversion. The universal offer of salvation does not pledge its universal acceptance. In His instructions and predictions the Lord does not let fall a hint that their world-wide mission will result in world-wide conversion, or that thereby the longed-for Millennium will be ushered in. But there is a time to come when the knowledge of the Lord shall cover the earth as the waters the sea, when teaching shall no longer be needed, for all shall know Him from the least to the greatest. Our dispensation, accordingly, cannot be the last, for the effects stated in that are not contemplated in the instructions and the results of this. To the direct revelation of Christ on the subject we now turn. In two parables He explicitly announces the general character and the consummation of the gospel age, and these we are briefly to examine.<P>(1) Parable of the Wheat and Tares (<a onClick="return mV(\'Mat\',13,\'24-30\');">Matthew 13:24-30</a>,<a onClick="return mV(\'Mat\',13,\'36-43\');">36-43</a>).<P>Happily we are not left to discover the meaning and scope of this parable. We enjoy the immense advantage of having our Lord\'s own interpretation of it. Out of His Divine explanation certain most important facts emerge:<P>(a) The parable covers the whole period between the first and second advents of the Saviour. The Sower is Christ Himself. He began the good work; He opened the new era.<P>(b) The field is the world. Christ\'s work is no longer confined to a single nation or people as once; it contemplates the entire race.<P>(c) His people, the redeemed, begotten by His word and Spirit, are the good seed. Through them the gospel of His grace is to be propagated throughout the whole world.<P>(d) The devil is also a sower. He is the foul counterfeiter of God \'s work. He sowed the tares, the sons of the evil one.<P>(e) The tares are not wicked men in general, but a particular class of wicked brought into close and contaminating association with the children of God. "Within the territory of the visible church the tares are deposited" (Dr. David Brown). It is the corruption of Christendom that is meant, a gigantic fact to which we cannot shut our eyes.<P>(f) The mischief, once done, cannot be corrected. "Let both grow together until the harvest." Christendom once corrupted remains so to the end.<P>(g) The harvest is the consummation of the age. This is the culmination of our age; it terminates with the advent and judgment of the Son of God. He will send forth His angels who will "gather out of his kingdom all things that cause stumbling, and them that do iniquity, and shall cast them into the furnace of fire ..... Then shall the righteous shine forth as the sun in the kingdom of their Father."<P>Here, then, we have the beginning, progress and consummation of our age. Christ Himself introduced it, and it was distinguished for its purity and its excellence. But the glorious system of truth was soon marred by the cunning craftiness of Satan. No after-vigilance or earnestness on the part of the servants could repair the fatal damage. They were forbidden to attempt the removal of the tares, for by so doing they would endanger the good grain, so intermixed had the two become! The expulsion of the tares is left for angels\' hands in the day of the harvest. This is our Lord\'s picture of our age: a Zizanian field wherein good and bad, children of God and children of the evil one, live side by side down to the harvest which is the end. In spite of all efforts to correct and reform, the corruption of Christendom remains, nay, grows apace. To expel the vast crop of false doctrine, false professors, false teachers, is now as it has been for centuries an impossibility. Christ\'s solemn words hold down to the final consummation, "Let both grow together until the harvest." In such conditions a millennium of universal righteousness and knowledge of the Lord seems impossible until the separation takes place at the harvest.<P>(2) Parable of the Pounds (<a onClick="return mV(\'Luk\',19,\'11-27\');">Luke 19:11-27</a>).<P>Jesus was on His last journey to Jerusalem, and near the city. The multitude was eager, expectant. They supposed the Kingdom of God was immediately to appear. The parable was spoken to correct this mistake and to reveal certain vital features of it. "A certain nobleman went into a far country, to receive for himself a kingdom, and to return." There is little difficulty in grasping the main teaching of this suggestive narrative. The nobleman is the Lord Jesus Christ Himself; the far country is heaven; the kingdom He goes to receive is the Messianic kingdom, for the victorious establishment of which all God\'s people long and pray. The servants are those who sustain responsible relation to the Lord because of the trust committed to them. The rebellious citizens are those who refuse subjection to His will and defy His authority. His return is His second coming. The parable spans the whole period between His ascension and His advent. It measures across our entire age. It tells of Christ\'s going away, it describes the conduct of His servants and of the citizens during His absence; it foretells His return and the reckoning that is to follow. Mark the words, "And it came to pass, when he was come back again, having received the kingdom." It is in heaven He receives the investiture o
