 onClick="return mV(\'Rev\',2,14,15,24);">Re 2:14-15, 24</a>, the King James Version "doctrine"). In some places the meaning is ambiguous as between (a) and (b) and in <a onClick="return mV(\'Mat\',7,28);">Mt 7:28</a>; <a onClick="return mV(\'Mar\',1,22);">Mr 1:22</a>; <a onClick="return mV(\'Act\',13,12);">Ac 13:12</a>, the manner, rather than the act or matter of teaching is denoted, namely, with authority and power.<P>2. Christ\'s Teaching Informal:<P>The meaning of these words in the New Testament varied as the church developed the content of its experience into a system of thought, and came to regard such a system as an integral part of saving faith (compare the development of the meaning of the term "faith"):<P>(1) The doctrines of the Pharisees were a fairly compact and definite body of teaching, a fixed tradition handed down from one generation of teachers to another (<a onClick="return mV(\'Mat\',16,12);">Mt 16:12</a>, the King James Version "doctrine"; compare <a onClick="return mV(\'Mat\',15,9);">Mt 15:9</a>; <a onClick="return mV(\'Mar\',7,7);">Mr 7:7</a>).<P>(2) In contrast with the Pharisaic system, the teaching of Jesus was unconventional and occasional, discursive and unsystematic; it derived its power from His personality, character and works, more than from His words, so that His contemporaries were astonished at it and recognized it as a new teaching (<a onClick="return mV(\'Mat\',7,28);">Mt 7:28</a>; <a onClick="return mV(\'Mat\',22,33);">22:33</a>; <a onClick="return mV(\'Mar\',1,22,27);">Mr 1:22, 27</a>; <a onClick="return mV(\'Luk\',4,32);">Lu 4:32</a>). So we find it in the Synoptic Gospels, and the more systematic form given to it in the Johannine discourses is undoubtedly the work of the evangelist, who wrote rather to interpret Christ than to record His ipsissima verba (<a onClick="return mV(\'Jhn\',20,31);">Joh 20:31</a>).<P>3. Apostolic Doctrines:<P>The earliest teaching of the apostles consisted essentially of three propositions:<P>(a) that Jesus was the Christ (<a onClick="return mV(\'Act\',3,18);">Ac 3:18</a>);<P>(b) that He was risen from the dead (<a onClick="return mV(\'Act\',1,22);">Ac 1:22</a>; <a onClick="return mV(\'Act\',2,24,32);">2:24, 32</a>); and<P>(c) that salvation was by faith in His name (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Act\',3,16);">3:16</a>).<p>While proclaiming these truths, it was necessary to coordinate them with Hebrew faith, as based upon Old Testament revelation.<P>The method of the earliest reconstruction may be gathered from the speeches of Peter and Stephen (<a onClick="return mV(\'Act\',2,\'14-36\');">Ac 2:14-36</a>; <a onClick="return mV(\'Act\',5,\'29-32\');">5:29-32</a>; <a onClick="return mV(\'Act\',7,\'2-53\');">7:2-53</a>). A more thorough reconstruction of the coordination of the Christian facts, not only with Hebrew history, but with universal history, and with a view of the world as a whole, was undertaken by Paul. Both types of doctrine are found in his speeches in Acts, the former type in that delivered at Antioch (<a onClick="return mV(\'Act\',13,\'16-41\');">Ac 13:16-41</a>), and the latter in the speeches delivered at Lystra (<a onClick="return mV(\'Act\',14,\'15-17\');">Ac 14:15-17</a>) and at Athens (<a onClick="return mV(\'Act\',17,\'22-31\');">Ac 17:22-31</a>). The ideas given in outline in these speeches are more fully developed into a doctrinal system, with its center removed from the resurrection to the death of Christ, in the epistles, especially in Galatians, Romans, Ephesians, Philippians and Colossians. But as yet it is the theological system of one teacher, and there is no sign of any attempt to impose it by authority on the church as a whole. As a matter of fact the Pauline system never was generally accepted by the church. Compare James and the Apostolic Fathers.<P>4. Beginnings of Dogma:<P>In the Pastoral and General Epistles a new state of things appears. The repeated emphasis on "sound" or "healthy doctrine" (<a onClick="return mV(\'1Ti\',1,10);">1Ti 1:10</a>; <a onClick="return mV(\'1Ti\',6,3);">6:3</a>; <a onClick="return mV(\'2Ti\',1,13);">2Ti 1:13</a>; <a onClick="return mV(\'2Ti\',4,3);">4:3</a>; <a onClick="return mV(\'Tts\',1,9);">Tit 1:9</a>; <a onClick="return mV(\'Tts\',2,1);">2:1</a>), "good doctrine" (<a onClick="return mV(\'1Ti\',4,6);">1Ti 4:6</a>) implies that a body of teaching had now emerged which was generally accepted, and which should serve as a standard of orthodoxy. The faith has become a body of truth "once for all delivered unto the saints" (<a onClick="return mV(\'Jud\',1,3);">Jude 1:3</a>). The content of this "sound doctrine" is nowhere formally given, but it is a probable inference that it corresponded very nearly to the Roman formula that became known as the Apostles\' Creed.`<a href="./study/isbe/search.html?string=DOGMA">DOGMA</a>`145';
isbe[2761]='Docus`do\'-kus`<a href="./study/isbe/search.html?string=DOK">DOK</a>`1';
isbe[2762]='Dodai`do\'-di, do\'-da-i (<a onClick="return mV(\'1Ch\',27,4);">1Ch 27:4</a>).`<a href="./study/isbe/search.html?string=DODO">DODO</a>`1';
isbe[2763]='Dodanim`do\'-da-nim (dodhanim, "leaders"): In <a onClick="return mV(\'Gen\',10,4);">Ge 10:4</a>, the son of Javan, the son of Japheth. This would place the Dodanim among the Ioninns. The parallel passage <a onClick="return mV(\'1Ch\',1,7);">1Ch 1:7</a>, with the Septuagint and Samaritan Pentateuch, has, however, "Rodanim," which is probably the true reading. This identifies the people with the Rhodians (compare on <a onClick="return mV(\'Eze\',27,15);">Eze 27:15</a> under <a href="./study/isbe/search.html?string=DEDAN">DEDAN</a>).``1';
isbe[2764]='Dodavahu`do-dav\'-a-hu (dodhawahu, "loved of God"; the King James Version Dodavah): Father of Eliezer of Mareshah, a prophet in the days of Jehoshaphat (<a onClick="return mV(\'2Ch\',20,37);">2Ch 20:37</a>).``1';
isbe[2765]='Dodo; Dodai`do\'-do, (dodho, dodhay, "beloved"):<P>(1) The grandfather of Tola of the tribe of Issachar, one of the judges (<a onClick="return mV(\'Jdg\',10,1);">Jud 10:1</a>).<P>(2) "The Ahohite," father of Eleazar, one of David\'s heroes, and (<a onClick="return mV(\'2Sa\',23,9);">2Sa 23:9</a>; <a onClick="return mV(\'1Ch\',11,12);">1Ch 11:12</a>) himself the commander of one of the divisions of the army (<a onClick="return mV(\'1Ch\',27,4);">1Ch 27:4</a>).<P>(3) The Bethlehemite, father of Elhanan, one of David\'s mighty men (<a onClick="return mV(\'2Sa\',23,24);">2Sa 23:24</a>; <a onClick="return mV(\'1Ch\',11,26);">1Ch 11:26</a>).``1';
isbe[2766]='Doe`do.`<a href="./study/isbe/search.html?string=DEER">DEER</a>`1';
isbe[2767]='Doeg`do\'-eg (do\'-egh "anxious," "cared for"): "The Edomite," a servant of Saul, who watched David\'s intercourse with the priest Ahimelech, then denounced the priest to the king, and later executed his command to slay the priests at Nob. The position he held is described as that of "the mightiest" of Samuel\'s herdsmen (<a onClick="return mV(\'1Sa\',21,7);">1Sa 21:7</a> margin). Septuagint reads: "tending the mules." Rabbinical legends speak of him as the greatest scholar of his time. The traditional title of <a onClick="return mV(\'Psa\',52,1">Ps 52</a> associates the composition of that Psalms with the events that led to the slaying of the priests (<a onClick="return mV(\'1Sa\',21,7);">1Sa 21:7</a>; <a onClick="return mV(\'1Sa\',22,9,18,22);">22:9, 18, 22</a>).``81';
isbe[2768]='Dog`kelebh; (compare Arabic kelb, "dog"); kuon; (and diminutive kunarion): References to the dog, both in the Old Testament and in the New Testament, are usually of a contemptuous character. A dog, and especially a dead dog, is used as a figure of insignificance. Goliath says to David (<a onClick="return mV(\'1Sa\',17,43);">1Sa 17:43</a>):" Am I a dog, that thou comest to me with staves?" David says to Saul (<a onClick="return mV(\'1Sa\',24,14);">1Sa 24:14</a>): "After whom dost thou pursue? after a dead dog, after a flea." Mephibosheth says to David (<a onClick="return mV(\'2Sa\',9,8);">2Sa 9:8</a>): "What is thy servant, that thou shouldest look upon such a dead dog as I am?" The same figure is found in the words of Hazael to Elisha (<a onClick="return mV(\'2Ki\',8,13);">2Ki 8:13</a>). The meaning, which is obscure in the King James Version, is brought out well in the Revised Version: "But what is thy servant, who is but a dog, that he should do this great thing?" The characteristically oriental interrogative form of these expressions should be noted.<P>Other passages express by inference the low esteem in which dogs are held. Nothing worse could happen to a person than that his body should be devoured by dogs (<a onClick="return mV(\'1Ki\',14,11);">1Ki 14:11</a>; <a onClick="return mV(\'1Ki\',16,4);">16:4</a>; <a onClick="return mV(\'1Ki\',21,19,23);">21:19, 23</a>, etc.). <a onClick="return mV(\'Job\',30,1);">Job 30:1</a> says of the youth who deride him that he disdained to set their fathers with the dogs of his flock. In <a onClick="return mV(\'Phl\',3,2);">Php 3:2</a> and <a onClick="return mV(\'Rev\',22,15);">Re 22:15</a>, dogs are coupled with evil-workers, sorcerers, etc. In <a onClick="return mV(\'Mat\',7,6);">Mt 7:6</a> we read: "Give not that which is holy unto the dogs, neither cast your pearls before the swine." <a onClick="return mV(\'Job\',30,1);">Job 30:1</a> (cited above) refers to the use of dogs to guard flocks; and the comparison of inefficient watchmen with dumb dogs (<a onClick="return mV(\'Isa\',56,10);">Isa 56:10</a>) implies that at least some dogs are useful. In the apocryphal Book of Tob, Tobias\' dog is his companion on his travels (Tobit 5:16; 11:4; on this see Expository Times, XI, 258; HDB, IV, 989; Geiger, Civilization of E. Iranians, I, 85ff).<P>There is further the reference to the greyhound (<a onClick="return mV(\'Pro\',30,31);">Pr 30:31</a> English Versions) as one of the four things which are "stately in their going." But the rendering, "greyhound," rests solely upon inference, and is contrary to the Septuagint and Vulgate, which have respectively alektor and gallus, i.e. "cock," the King James Version margin "horse." The Hebrew has zarzir mothnayim, which the King James Version margin renders "girt in the loins." the Revised Version, margin has "warhorse," Hebrew "well girt (or, well knit) in the loins." In support of the meaning, "girt," for zarzir, there is the word zer, which, with zarzir, is assigned to the obsolete root zarar and the Arabic zirr, "button," from zarr, "to button", "to compress." Further, to render zarzir by "cock" logically requires a change in the text, for mothnayim, "loins," becomes superlative and inappropriate (see Encyclopedia Biblica, under the word "Cock"). On the other hand, the Arabic zarzur is a starling (compare Arabic zarzar, "to utter cries," said of birds; carcar, "to cry out"; carcar, "cockroach," or "cricket"). Also, according to Encyclopedia Biblica (s. v. "Cock"), "the Talmudic zarzir...means some bird (a kind of raven)." If the text stands, there appears to be no better rendering than "girt in the loins," which might fairly be taken to refer to a war horse or to a greyhound. The Persian greyhound would in that case be understood, a hairy race, which, according to the Royal Natural History, is less fleet than the English breed and is used in chasing gazelles and in hunting the wild ass, and which according to Doughty (Arabia Deseria) is kept by the Bedouin. "These dogs are said to be sometimes girdled by their owners to prevent them from over-eating and becoming fat" (L. Fletcher, British Museum (Natural History)).<P>Domestic dogs have probably been derived from various species of wolves and jackals. In this connection, it is noteworthy that the dogs of certain regions greatly resemble the wolves of those regions. The pariah dogs of Syria and Palestine resemble the jackals, especially in color and in the tail, differing in their greater size and in the shape of muzzle and ears. It is fair to assume that they are much the same as existed in Bible times. They are in general meek and harmless creatures, and are valuable as scavengers, but disturb the night with their barking. Each quarter of the city has its own pack of dogs, which vigorously resents any invasion of its territory. A dog which for any reason finds itself in foreign territory gets home as quickly as possible, and is lucky if it does not have to run the gauntlet of a pack of vicious foes. The pariah dog is sometimes brought up to be a sheep dog, but the best shepherd dogs are great wolfish creatures, which are usually obtained from Kurdistan.``37';
isbe[2769]='Dogma`dog\'-ma (dogma, from dokeo, "that which seems," "an opinion," particularly the opinion of a philosopher):<P>1. As Law and Ordinance:<P>In the decadent period of Greek philosophy, the opinion, or ipse dixit, of the master of a philosophical school came to be quoted as authoritative truth; also, the opinion of a sovereign imposed as law upon his subjects: a decree or ordinance of the civil authority. The word never appears in English Versions of the Bible, although it is used 5 times in the Greek New Testament, but with the one exception of <a onClick="return mV(\'Act\',16,4);">Ac 16:4</a>, in a sense widely different from that which ecclesiastical usage has given to it from the 2nd century downward. "Dogma" is used in the New Testament,<P>(1) of Roman laws: "a decree (Greek dogma) from Caesar Augustus" (<a onClick="return mV(\'Luk\',2,1);">Lu 2:1</a>); "the decrees of Caesar" (<a onClick="return mV(\'Act\',17,7);">Ac 17:7</a>) = the whole body of Roman law;<P>(2) of ordinances of religious law: "the law of commandments contained in ordinances" (<a onClick="return mV(\'Eph\',2,15);">Eph 2:15</a>); "the bond written in ordinances" (<a onClick="return mV(\'Col\',2,14);">Col 2:14</a>) = the Mosaic ordinances as expressing the moral law which condemned the sinner, and whose enmity Christ abolished by His death. It is a significant revelation of the spirit of Greek theology that all the Greek commentators understood by ordinances in these two places, the gospel as a body of dogmas which had removed the commandment or bond that was against us (see Lightfoot, Colossians, at the place);<P>(3) of the decrees of the Council of Jerusalem (<a onClick="return mV(\'Act\',15,20);">Ac 15:20</a>), which Paul and his companions delivered to the Gentile churches (<a onClick="return mV(\'Act\',16,4);">Ac 16:4</a>). Here we have one element that entered into the later ecclesiastical meaning of the word. These dogmas were decisions on religious matters, imposed by a more or less authoritative council of the church as a condition of admission to its membership.<P>2. As Formulated Teaching:<P>There is however one important difference. These decrees relate to moral and ceremonial matters, but from the 2nd century downward, dogma means especially a theological doctrine. In Greek theology "doctrine" and "dogma" meant the same thing. Each had its origin in the opinion of some great teacher; each rested upon revelation and claimed its authority; each meant an exposition of a particular truth of the gospel, and of the whole Christian truth, which the church adopted as the only right exposition. Each word might be used for the teaching of a philosopher, or of a heretic, although for the latter, "heresy" became the regular term. On the one side stood the doctrines or dogmas of the majority or the "Catholic" church, and on the other side, those of the heretics. So long as the "Catholic" ideal of orthodoxy and uniformity of belief held the field, there was no room for the distinction now made between "doctrine," as a scientific and systematic expression of the truth of the Christian religion, and "dogma," as those truths "authoritatively ratified as expressing the belief of the church." This distinction could only arise when men began to think that various expressions of Christian truth could coexist in the church, and is therefore quite modern and even recent. Dogma in this sense denotes the ancient conception of theology as an authoritative system of orthodoxy, and doctrine, the modern conception, outside the dogmatic churches, where theology is regarded as a scientific exposition of truth.<P>LITERATURE.<P>Harnack, History of Dogma, I, chapter i; Drummond, Studies in Christian Doctrine, 1-7.``145';
isbe[2770]='Dok`dok (Dok, Dagon): A small fortress, "little stronghold" near Jericho (1Macc 16:15), built by Ptolemy, son of Abubus, where he entertained and murdered his father-in-law Simon Maccabeus and his two sons. Josephus (Ant., XIII, viii, 1; BJ, I, ii, 3) calls the place Dagon and places it above Jericho. The name persists in Ain Duk with its copious springs of excellent water about 4 miles Northwest of Jericho. Some ancient foundations in the neighborhood are possibly those of Ptolemy\'s fortress, but more probably of a Templars\' station which is known to have stood there as late as the end of the 13th century. For its importance in earlier Jewish history, see Smith, HGHL, 250, 251.``79';
isbe[2771]='Doleful`dol\'-fool (\'oach, "howling"): The "doleful creatures" referred to in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a> are probably "jackals," although some have suggested "leopard," or "hyena." The older English Versions of the Bible gives "great owls." The word rendered "doleful lamentation" in <a onClick="return mV(\'Mic\',2,4);">Mic 2:4</a> (niheyah) is simply a form of the word ordinarily translated "wailing" (nehi). Compare the King James Version margin.``1';
isbe[2772]='Dolphin`dol\'-fin.`<a href="./study/isbe/search.html?string=BADGER">BADGER</a>`1';
isbe[2773]='Dominion`do-min\'-yun: In <a onClick="return mV(\'Eph\',1,21);">Eph 1:21</a>; <a onClick="return mV(\'Col\',1,16);">Col 1:16</a> the word so translated (kuriotes) appears to denote a rank or order of angels. The same word is probably to be so interpreted in <a onClick="return mV(\'Jud\',1,8);">Jude 1:8</a> (the King James Version and the Revised Version (British and American) "dominion"), and in <a onClick="return mV(\'2Pe\',2,10);">2Pe 2:10</a> (the King James Version "government," the Revised Version (British and American) "dominion").`<a href="./study/isbe/search.html?string=ANGEL">ANGEL</a>`1';
isbe[2774]='Doom`doom: Occurs only once in the King James Version (2Esdras 7:43), "The day of doom shall be the end of this time" (the Revised Version (British and American) "the day of judgment"); but the Revised Version (British and American) gives it as the rendering of tsephirah, in <a onClick="return mV(\'Eze\',7,7,10);">Eze 7:7, 10</a> (the King James Version "the morning," the Revised Version, margin "the turn" or "the crowning time"; but the meaning is not yet quite certain); and in <a onClick="return mV(\'1Cr\',4,9);">1Co 4:9</a> (epithanatios, "as men doomed to death," the King James Version "appointed (originally "approved") unto death"). Our word "doom" is connected with the word "deem," and signifies either the act of judging or (far more often) the sentence itself or the condition resulting therefrom (compare "Deemster" of Isle of Man and Jersey). Generally, but not always, an unfavorable judgment is implied. Compare Dryden, Coronation of Charles II, i, 127: "Two kingdoms wait your doom, and, as you choose, This must receive a crown, or that must lose."``134';
isbe[2775]='Door`dor: Most commonly the rendering of Hebrew pethach, "doorway," deleth, "door" proper (the two distinguished in <a onClick="return mV(\'Gen\',19,6);">Ge 19:6</a>), or of Greek thura, which represents both meanings. The door proper was usually of wood, frequently sheeted with metal, sometimes of one slab of stone, as shown in excavations in the Hauran. It turned on pivots (the "hinges" of <a onClick="return mV(\'Pro\',26,14);">Pr 26:14</a>) working in sockets above and below, and was provided with a bolt (<a onClick="return mV(\'2Sa\',13,17);">2Sa 13:17</a>) or with lock and key (<a onClick="return mV(\'Jdg\',3,23);">Jud 3:23</a>). The doorway was enclosed by the stone threshold (<a onClick="return mV(\'1Ki\',14,17);">1Ki 14:17</a>), the two doorposts on either side, and the lintel above (<a onClick="return mV(\'Exd\',12,7);">Ex 12:7</a>). Doors were frequently two-leaved, and folding ones are mentioned in connection with the temple (<a onClick="return mV(\'1Ki\',6,34);">1Ki 6:34</a>). Where "door" is used in connectio with city gates (<a onClick="return mV(\'Neh\',3,1);">Ne 3:1</a>ff) it refers to the door proper which swings on its hinges as distinguished from the whole structure. The custom of fastening to the doorposts small cases containing a parchment inscribed with the words of <a onClick="return mV(\'Deu\',6,\'4-9\');">De 6:4-9</a>; <a onClick="return mV(\'Deu\',11,\'13-21\');">11:13-21</a> had its origin in the command there given. See also <a href="./study/isbe/search.html?string=GATE">GATE</a>; <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>.<P>Figurative:<P>(1) Christ is "the door" into the gospel ministry (<a onClick="return mV(\'Jhn\',10,1,2,7);">Joh 10:1-2, 7</a>); ministers must receive their authority from Him, and exercise it in His spirit.<P>(2) \'Through faith in Him also both shepherds and sheep enter into the kingdom of God (<a onClick="return mV(\'Jhn\',10,9);">Joh 10:9</a>), and find all their spiritual needs supplied.\'<P>(3) The figure in <a onClick="return mV(\'Rev\',3,20);">Re 3:20</a> is expressive of Christ\'s patient, persistent and affectionate appeal to men.<P>(4) Elsewhere also of opportunity (<a onClick="return mV(\'Mat\',25,10);">Mt 25:10</a>; <a onClick="return mV(\'Act\',14,27);">Ac 14:27</a>; <a onClick="return mV(\'1Cr\',16,9);">1Co 16:9</a>; <a onClick="return mV(\'2Cr\',2,12);">2Co 2:12</a>; <a onClick="return mV(\'Rev\',3,8);">Re 3:8</a>).<P>(5) Of freedom and power (<a onClick="return mV(\'Col\',4,3);">Col 4:3</a>).`<a href="./study/isbe/search.html?string=ACHOR">ACHOR</a>; <a href="./study/isbe/search.html?string=SHEPHERD">SHEPHERD</a>`44';
isbe[2776]='Doorkeeper`dor\'-kep-er (sho\'er): The gates of an oriental city and of the temple courts so closely resembled the door of a house that the same Hebrew word was used for doorkeeper and gatekeeper. It is often translated by the less definite word "porter". In the preexilic writings (<a onClick="return mV(\'2Sa\',18,26);">2Sa 18:26</a>; <a onClick="return mV(\'2Ki\',7,10,11);">2Ki 7:10-11</a>) reference is made to porters at the gates of the cities Mahanaim and Samaria. In these early writings there is also mention of a small number of "keepers of the threshold" of the temple, whose duties included the gathering of money from the people for temple purposes, and the care of the sacred vessels (<a onClick="return mV(\'2Ki\',12,9);">2Ki 12:9</a>; <a onClick="return mV(\'2Ki\',22,4);">22:4</a>; <a onClick="return mV(\'2Ki\',23,4);">23:4</a>). They held an honorable position (<a onClick="return mV(\'2Ki\',25,18);">2Ki 25:18</a>), and occupied chambers in the temple (<a onClick="return mV(\'Jer\',35,4);">Jer 35:4</a>). The same term is used to describe officers in the household of the king of Persia (<a onClick="return mV(\'Est\',2,21);">Es 2:21</a>; <a onClick="return mV(\'Est\',6,2);">6:2</a>).<P>Differing from these "keepers of the threshold" in some respects are the doorkeepers or porters mentioned in Chronicles, Ezra, and Nehemiah. These formed a numerous sacred order (<a onClick="return mV(\'1Ch\',9,22);">1Ch 9:22</a>; <a onClick="return mV(\'1Ch\',23,5);">23:5</a>) from the time of David. Their duties and the words describing them in two passages, "keepers of the thresholds" (<a onClick="return mV(\'1Ch\',9,19);">1Ch 9:19</a>) and "porters of the thresholds" (<a onClick="return mV(\'2Ch\',23,4);">2Ch 23:4</a>), connect them in some measure with the "keeper of the threshold" referred to above. They guarded the gates of the house of Yahweh (<a onClick="return mV(\'1Ch\',9,23);">1Ch 9:23</a>), closing and opening them at the proper times (<a onClick="return mV(\'1Ch\',9,27);">1Ch 9:27</a>) and preventing the unclean from entering the sacred enclosure (<a onClick="return mV(\'2Ch\',23,19);">2Ch 23:19</a>); they had charge of the sacred vessels and of the free-will offerings (<a onClick="return mV(\'2Ch\',31,14);">2Ch 31:14</a>), and dwelt in the chambers about the temple (<a onClick="return mV(\'1Ch\',9,27);">1Ch 9:27</a>). They were Levites, and came in from the Levitical villages every seventh day for service in their turn (<a onClick="return mV(\'1Ch\',9,25);">1Ch 9:25</a>). Their office was honorable, ranking with the singers, after the priests and Levites (<a onClick="return mV(\'Ezr\',2,42);">Ezr 2:42</a>; <a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18</a>).<P>In <a onClick="return mV(\'Psa\',84,10);">Ps 84:10</a>, "I had rather be a doorkeeper in the house of my God," the word is not used in its technical sense. the Revised Version, margin gives "stand (the King James Version margin "sit") at the threshold," to an eastern mind a situation of deep humility (compare title of the Ps and <a onClick="return mV(\'1Ch\',9,19);">1Ch 9:19</a>).<P>In the New Testament the order of temple doorkeepers is not referred to. But a doorkeeper (thuroros) is mentioned in connection with a private house (<a onClick="return mV(\'Mar\',13,34);">Mr 13:34</a>), with the high priest\'s house (<a onClick="return mV(\'Jhn\',18,16,17);">Joh 18:16-17</a>), and with sheep-folds (<a onClick="return mV(\'Jhn\',10,3);">Joh 10:3</a>), a maid serving as doorkeeper in some cases (<a onClick="return mV(\'Act\',12,13);">Ac 12:13</a>).``76';
isbe[2777]='Doorpost`dor\'-post.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[2778]='Dophkah`dof\'-ka (dophqah, "drover"): A desert camp of the Israelites, the first after leaving the wilderness of Sin (<a onClick="return mV(\'Num\',33,12,13);">Nu 33:12-13</a>).`<a href="./study/isbe/search.html?string=WANDERINGS+OF+ISRAEL">WANDERINGS OF ISRAEL</a>`1';
isbe[2779]='Dor; Dora`dor, do\'-ra (do\'r, dor, "habitation," "circle"; Dor; Josephus, Dora; modern Tanturah): A town of the coast of Palestine, south of Carmel (Apion, II, 10; Vita, 8), about 8 miles north of Caesarea. It was occupied in the earliest times by the Canaanites and probably belonged to Phoenicia, tradition saying that it was a Sidonian colony. It furnished an abundance of the shell-fish so valuable for the manufacture of the Tyrian purple, and this would have led the Phoenicians to occupy the site. In the 12th century BC, the region was occupied by the northern people who raided the whole Syrian coast and Egypt. They were driven back by the Egyptians, but renewed the attack, and the weakness of Egypt in the middle of the century enabled them to settle in the coast region south of Carmel; a tribe of them occupied Dor, and others the territory to the limits of the desert of Sinai, and became the Philistine people so well known by their contests with the Hebrews. Naphoth-dor, "the heights of Dor," may be the slopes of Carmel inland from Tanturah. Dor fell within the territory assigned to Manasseh (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>; compare Ant, V, i, 22). It was the seat of a king who possessed other towns on the heights back of the coast. He was one of the allies of Jabin of Hazor in the conflict with Joshua (<a onClick="return mV(\'Jos\',11,2);">Jos 11:2</a>) and was conquered by him (<a onClick="return mV(\'Jos\',12,23);">Jos 12:23</a>), but Dor was not occupied by the Israelites (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>; <a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a>).<P>The inhabitants of Dor were at enmity with the Phoenician towns and it would seem that the Sidonians seized it to obtain its rich supplies of shell-fish, and this probably caused the war of retaliation waged by the Philistines, under the lead of Ashkelon, against Sidon in the middle of the 11th century. Sidon was besieged by land, and the inhabitants were compelled to flee to Tyre. Dor seems to have been occupied by Solomon since he placed one of his purveyors in the town (<a onClick="return mV(\'1Ki\',4,11);">1Ki 4:11</a>), and Tiglath-pileser III reduced it and set a governor over it (Rawl., Phoenician., 84). Here Tryphon was besieged by Antiochus, but escaped to Apamea (1Macc 15:11,13,15; Ant, XIII, vii, 2). It was made free by Pompey, and joined to the province of Syria (XIV, iv, 4). The youths of the place set up a statue of Tiberius in the Jewish synagogue, an outrage that was reported to Publius Petronius by Agrippa, and reparation was made (XIX, vi, 3). It does not seem to have been of much importance in later times, though the fortifications still remaining on the ruined site, from the period of the Middle Ages, show that it was then occupied. It is now only a miserable village nestled in the ruins.``138';
isbe[2780]='Dorcas`dor\'-kas (Dorkas, the Greek equivalent of Aramaic tabitha, "a gazelle"): The name was borne by a Christian woman of Joppa. She is called a disciple (mathetria: <a onClick="return mV(\'Act\',9,36);">Ac 9:36</a>, the only place in the New Testament where the feminine form is used). She seems to have had some means and also to have been a leader in the Christian community. Dorcas was beloved for the manner in which she used her position and means, for she "was full of good works, and almsdeeds which she did." Among her charities was the clothing of the poor with garments she herself made (<a onClick="return mV(\'Act\',9,39);">Ac 9:39</a>), and by following her example, numerous "Dorcas societies" in the Christian church perpetuate her memory. There is a local memorial in the "Tabitha School" in Jaffa devoted to the care and education of poor girls.<P>Her restoration to life by Peter is recorded. At the time of her death Peter was in Lydda where he had healed Aeneas. Being sent for, he went to Joppa, and, by the exercise of the supernatural powers granted to him, "he presented her alive" to the mourning community. In consequence of this miracle "many believed on the Lord" (<a onClick="return mV(\'Act\',9,42);">Ac 9:42</a>).``78';
isbe[2781]='Dorymenes`do-rim\'-e-nez (Dorumenes): Father of Ptolemy Macron (1Macc 3:38; 2Macc 4:45); probably the same man who fought against Antiochus the Great (Polyb. v.61).``1';
isbe[2782]='Dositheus`do-sith\'-e-us (Dositheos):<P>(1) A captain of Judas Maccabeus (2Macc 12:19-25); along with Sosipater he captured Timotheus after the battle of Carnion, but granted him his life and freedom on the representation that "he had in his power the parents of many of them and the brethren of some," who, if they put him to death, should "be disregarded."<P>(2) A soldier in the army of Judas Maccabeus (2Macc 12:35); he made a special attack upon Gorgias, governor of Idumaea, the opposing general, and would have taken the "accursed man" prisoner but for the interference of a Thracian horseman.<P>(3) A Jew, son of Drimylus (3Macc 1:3) who rescued Ptolemy Philopator from a plot of Theodotus. He afterward proved an apostate from Judaism.<P>(4) A Levite priest who "in the 4th year of the reign of Ptolemy and Cleopatra" carried the translation of the Book of Esther to Alexandria (<span class="noTag"Additions to Esther 11:1</span>).``79';
isbe[2783]='Dotaea`do-te\'-a (the King James Version, incorrectly, Judea; Dotaia): Another form of the name <a href="./study/isbe/search.html?string=DOTHAN">DOTHAN</a> (which see).``1';
isbe[2784]='Dote`dot: "To dote" means either "to be weakminded" or "to be foolishly fond." In the latter sense it is employed in <a onClick="return mV(\'Eze\',23,5);">Eze 23:5</a>ff; in the former, in <a onClick="return mV(\'Jer\',50,36);">Jer 50:36</a> the King James Version (the Revised Version (British and American) "shall become fools"); the King James Version <span class="noTag">Sirach 25:2</a> (the Revised Version (British and American) "lacking understanding"), and the King James Version <a onClick="return mV(\'1Ti\',6,4);">1Ti 6:4</a> (the Revised Version, margin "to be sick"; the King James Version margin "a fool").``1';
isbe[2785]='Dothaim`do\'-tha-im: Mentioned in Judith 4:6 and frequently in connection with the invasion of Holofernes. See next article <a href="./study/isbe/search.html?string=DOTHAN">DOTHAN</a>.``1';
isbe[2786]='Dothan`do\'-than (dothayin, dothan, "two wells," "double feast"; Dothaeim): A place to the north of Shechem whither Jacob\'s sons went for pasture for the flocks; where Joseph who followed them was sold to the Ishmaelites, after having been imprisoned in a "pit" (<a onClick="return mV(\'Gen\',37,17);">Ge 37:17</a>ff). Here in later days the eyes of Elisha\'s servant were opened to see the mountain "full of horses and chariots of fire," guarding his master from the encircling Syrians (<a onClick="return mV(\'2Ki\',6,13);">2Ki 6:13</a>ff). This is certainly to be identified with Tell Dothan, which lies on the east of the ancient road leading from Gilead across Esdraelon to the seacoast, and thence to Egypt. It is about 5 miles to the southwest of Jenin. There are some traces of old buildings, two cisterns—Dothayin or Dothayin = "two cisterns" or "pits"-and one copious spring. Excellent pasture is found in the surrounding plain, and on the adjoining slopes.``54';
isbe[2787]='Double`dub\'-\'-l (shanah, "to repeat," as in counting; kaphal, "to fold over," or "double," as a cloth): A word used quite frequently in the Old Testament. Jacob ordered his sons to take double money in their hands, i.e. twice the necessary amount (<a onClick="return mV(\'Gen\',43,12,15);">Ge 43:12, 15</a>). If a thief be caught with a living animal he was to restore double (<a onClick="return mV(\'Exd\',22,4);">Ex 22:4</a>); if property be stolen out of the house of one to whom it is entrusted he was to restore double (<a onClick="return mV(\'Exd\',22,7,9);">Ex 22:7, 9</a>). The firstborn was to receive a double portion of the inheritance (<a onClick="return mV(\'Deu\',21,17);">De 21:17</a>). Likewise also by a beautiful symbol Elisha asked for a double portion of Elijah\'s spirit to fall upon him (<a onClick="return mV(\'2Ki\',2,9);">2Ki 2:9</a>). Degrees of punishment or sufferings were also expressed by the idea of a doubling (<a onClick="return mV(\'Isa\',61,7);">Isa 61:7</a>; <a onClick="return mV(\'Jer\',16,18);">Jer 16:18</a>; <a onClick="return mV(\'Jer\',17,18);">17:18</a>; <a onClick="return mV(\'Zec\',9,12);">Zec 9:12</a>).<P>The use of the second Hebrew form in <a onClick="return mV(\'Job\',11,6);">Job 11:6</a> and <a onClick="return mV(\'Job\',41,13);">Job 41:13</a> seems quite confusing in its translation. the King James Version translates it simply "double," but the Revised Version (British and American) gives it its expanded and derived meaning, "manifold in understanding," and "who shall come within his jaws," respectively, "manifold" in the first instance meaning multiplied, and "jaws" doubtless meaning the double row of teeth. The classic phrases in the New Testament are those used by James to represent instability and a wavering disposition, dipsuchos, literally, "doubleminded" (<a onClick="return mV(\'Jam\',1,8);">Jas 1:8</a>; <a onClick="return mV(\'Jam\',4,8);">4:8</a>).``25';
isbe[2788]='Doubt`dout: This word, found only a score of times in the Bible, translates nevertheless about half as many different Hebrew and Greek originals with a corresponding variety of meanings.<P>In <a onClick="return mV(\'Gen\',37,33);">Ge 37:33</a> "without doubt" is to be taken in the common sense of "certainly"; in <a onClick="return mV(\'Job\',12,2);">Job 12:2</a> in the sarcastic sense of "indeed!" In <a onClick="return mV(\'Dan\',5,12,16);">Da 5:12, 16</a>, it is used as a difficult problem or mystery to be explained, and these are the only cases of its employment in the Old Testament.<P>In the New Testament it is about equally used to translate diaporeo, and diakrino, and their cognates. The first means "to be without resource," "utterly at a loss," "nonplussed"; and the second, "to judge diversely." For the first, see <a onClick="return mV(\'Jhn\',13,22);">Joh 13:22</a>; <a onClick="return mV(\'Act\',2,12);">Ac 2:12</a> the King James Version; <a onClick="return mV(\'Act\',5,24);">Ac 5:24</a> the King James Version; <a onClick="return mV(\'Act\',10,17);">Ac 10:17</a> the King James Version; <a onClick="return mV(\'Act\',25,20);">Ac 25:20</a> the King James Version; and <a onClick="return mV(\'Gal\',4,20);">Ga 4:20</a> the King James Version. For the second see <a onClick="return mV(\'Mat\',21,21);">Mt 21:21</a>; <a onClick="return mV(\'Mar\',11,23);">Mr 11:23</a>; <a onClick="return mV(\'Act\',10,20);">Ac 10:20</a>; <a onClick="return mV(\'Rom\',14,23);">Ro 14:23</a>. The last-named is deserving of particular attention. "He that doubteth is condemned (the King James Version "damned") if he eat," means that in a case of uncertainty as to one\'s Christian liberty, it were better to err on the side of restraint. In <a onClick="return mV(\'Luk\',12,29);">Lu 12:29</a> "to be of doubtful mind" (meteorizo, literally, "to suspend"; see Thayer, under the word), means "to be driven by gusts," or "to fluctuate in mid-air."<P>Here, as in <a onClick="return mV(\'Mat\',14,31);">Mt 14:31</a>, "doubt" does not indicate a lack of faith, but rather "a state of qualified faith": its weakness, but not its absence.<P>In <a onClick="return mV(\'Jhn\',10,24);">Joh 10:24</a> "doubt" translates airo psuchen, which literally means "to lift up the soul" or "to keep one in suspense"; so the Revised Version (British and American).`<a href="./study/isbe/search.html?string=DISPUTATION">DISPUTATION</a>`69';
isbe[2789]='Dough`do`<a href="./study/isbe/search.html?string=BREAD">BREAD</a>`1';
isbe[2790]='Dove`duv (tor, yonah; peristera; Latin Zenaedura carolinensis): A bird of the family Columbidae. Doves and pigeons are so closely related as to be spoken and written of as synonymous, yet there is a distinction recognized from the beginning of time. It was especially marked in Palestine, because doves migrated, but pigeons remained in their chosen haunts all the year. Yet doves were the wild birds and were only confined singly or in pairs as caged pets, or in order to be available for sacrifice. Pigeons, without question, were the first domesticated birds, the record of their conquest by man extending if anything further back than ducks, geese and swans. These two were the best known and the most loved of all the myriads of birds of Palestine. Doves were given preference because they remained wild and were more elusive. The thing that escapes us is usually a little more attractive than the thing we have. Their loving natures had been noted, their sleek beautiful plumage, their plump bodies. They were the most precious of anything offered for sacrifice. Their use is always specified in preference to pigeons if only one bird was used; if both, the dove is frequently mentioned first. Because of their docility when caged, their use in sacrifice, and the religious superstition concerning them, they were allowed to nest unmolested and, according to species, flocked all over Palestine. The turtle-dove nested in gardens and vineyards, and was almost as tame as the pigeons. The palm turtle-dove took its name from its love of homing in palm trees, and sought these afield, and in cities, even building near the temple in Jerusalem. It also selected thorn and other trees. It has a small body, about ten inches in length, covered with bright chestnut-colored feathers, the neck dappled with dark, lustrous feathers. The rock dove swarmed over, through, and among the cliffs of mountains and the fissures of caves and ravines. The collared turtle-dove was the largest of the species. It remained permanently and homed in the forests of Tabor and Gilead, around the Dead Sea, and along the Jordan valley. This bird was darker than the others and took its name from a clearly outlined collar of dark feathers encircling the neck, and was especially sought for caged pets on account of its size and beauty.<P>In all, the dove is mentioned about fifty times in the Bible. Many of these references are concerning its use in sacrifice and need not all be mentioned. The others are quoted and explained from a scientific standpoint and in accordance with the characteristics and habits of the birds. The first reference to the dove occurs in <a onClick="return mV(\'Gen\',8,\'8-12\');">Ge 8:8-12</a>, in the history of the flood; then follows its specified use in sacrifice; note of its migratory habits is made, and then in poetry, prophecy, comparison, simile and song, it appears over and over throughout the Bible.<P>In <a onClick="return mV(\'Gen\',8,\'8-12\');">Ge 8:8-12</a>, we read, "And he sent forth a dove from him, to see if the waters were abated." Noah first sent out a raven, because it was a strong, aggressive bird and would return to its mate. But the raven only flew over the water and returned to perch on the ark. This was not satisfactory, so Noah in looking for a bird better suited to his purpose, bethought him of the most loving and tender bird he knew—the dove. It not only would return to the ark, but would enter and go to the cage of its mate, and if it found green food it would regurgitate a portion for her or its young, or if not nesting he could tell by its droppings if greenery had been eaten and so decide if the waters were going down. And this is precisely what happened. The dove came back, and the watching Noah saw it feed its mate little green olive leaves, for the dove never carries food in the beak, but swallows and then regurgitates it to mate and young. This first reference to birds was made on account of the loving, tender characteristics of the species; the next, because they were the most loved by the people, and therefore chosen as most suitable to offer as sacrifice (<a onClick="return mV(\'Gen\',15,9);">Ge 15:9</a>). In <a onClick="return mV(\'Lev\',1,14);">Le 1:14</a>f; doves are mentioned as sacrifice: "And the priest shall bring it unto the altar, and wring off its head, and burn it on the altar; and the blood thereof shall be drained out on the side of the altar." In <a onClick="return mV(\'Lev\',5,7);">Le 5:7</a> the proper preparation of the sacrifice is prescribed. For method of handling sacrifice see <a onClick="return mV(\'Lev\',5,8,9,10);">5:8, 9, 10</a>. In <a onClick="return mV(\'Lev\',12,6);">Le 12:6</a> the law for a sacrifice for a mother is given, and <a onClick="return mV(\'Lev\',12,8);">12:8</a> of same chapter provides that if she be too poor to offer a lamb, doves or pigeons will suffice. In <a onClick="return mV(\'Lev\',14,\'4-8\');">Le 14:4-8</a> the reference for the sacrifice of a leper is merely to "birds," because it is understood that they are pigeons and doves, and it contains the specification that if the victim is too poor to afford so elaborate a sacrifice, a smaller one will suffice. The birds are named in <a onClick="return mV(\'Lev\',14,22);">14:22</a>: "Two turtle-doves, or two young pigeons, such as he is able to get; and the one shall be a sin-offering, and the other a burnt-offering" (compare <a onClick="return mV(\'Lev\',15,14,29);">Le 15:14, 29</a>; <a onClick="return mV(\'Num\',6,10);">Nu 6:10</a>). When David prayed for the destruction of the treacherous, he used the dove in comparison, and because he says he would "lodge in the wilderness" he indicates that he was thinking of the palm turtle. "And I said, Oh that I had wings like a dove! Then would I fly away, and be at rest" (<a onClick="return mV(\'Psa\',55,6);">Ps 55:6</a>). In chanting a song of triumph, David used an exquisite thought. "When ye lie among the sheepfolds, It is as the wings of a dove covered with silver, And her pinions with yellow gold" (<a onClick="return mV(\'Psa\',68,13);">Ps 68:13</a>). He referred to the rock dove because the metallic luster on its neck would gleam like gold in sunshine, and the soft grayish-white feathers beneath the wings as he would see the bird above him in flight would appear silver-like. By this quotation David meant that in times of peace, when men slept contentedly at home among their folds, their life was as rich with love and as free in peace as the silver wing of the dove that had the gold feathers and was unmolested among the inaccessible caves and cliffs. In <a onClick="return mV(\'Psa\',74,19);">Ps 74:19</a> the term "turtle-dove" is used to indicate people whom the Almighty is implored to protect: "Oh deliver not the soul of thy turtle-dove unto the wild beast: forget not the life of thy poor for ever."<P>Solomon uses the dove repeatedly in comparison or as a term of endearment. In <a onClick="return mV(\'Sgs\',1,15);">So 1:15</a>; <a onClick="return mV(\'Sgs\',4,1);">4:1</a>; <a onClick="return mV(\'Sgs\',5,12);">5:12</a>, he compares the eyes of his bride full, tender, beautiful, with those of a dove. In <a onClick="return mV(\'Sgs\',2,12);">So 2:12</a> he uses the voice of the dove as an indication of spring. In <a onClick="return mV(\'Sgs\',2,14);">So 2:14</a> he addresses the bride as a rock dove, In <a onClick="return mV(\'Sgs\',5,2);">So 5:2</a> is another term of endearment, this time used in the dream of the bride (compare <a onClick="return mV(\'Sgs\',6,9);">So 6:9</a>). <a onClick="return mV(\'Isa\',38,14);">Isa 38:14</a> has reference to the wailing, mournful dove note from which the commonest species take the name "mourning dove." The reference in <a onClick="return mV(\'Isa\',60,8);">Isa 60:8</a> proves that the prophet was not so good an observer, or so correct in his natural history as David, who may have learned from the open. As a boy, David guarded the flocks of his father and watched the creatures around him. When exulting over the glory of the church in the numerous accessions of Gentiles, Isaiah cried, "Who are these that fly as a cloud, and as the doves to their windows?" This proves that he confounded pigeons and doves. Doves were wild, mostly migratory, and had no "windows." But the clay cotes of pigeons molded in squares so that one large cote sheltered many pairs in separate homes had the appearance of latticed windows and were used as a basis in estimating a man\'s wealth. This reference should be changed to read, "and as pigeons to their windows." In <a onClick="return mV(\'Jer\',8,7);">Jer 8:7</a> the fact is pointed out that doves were migratory; and in <a onClick="return mV(\'Jer\',48,28);">Jer 48:28</a> people are advised to go live in solitary places and be peaceable, loving and faithful, like the rock doves. See also <a onClick="return mV(\'Eze\',7,16);">Eze 7:16</a>: "But those of them that escape shall escape, and shall be on the mountains like doves of the valleys, all of them moaning, every one in his iniquity." This merely means that people should be driven to hide among the caves and valleys where the rock doves lived, and that the sound of their mourning would resemble the cry of the birds. It does not mean, however, that the doves were mourning, for when doves coo and moan and to our ears grow most pitiful in their cries, they are the happiest in the mating season. The veneration cherished for doves in these days is inborn, and no bird is so loved and protected as the dove—hence, it is unusually secure and happy and its mournful cry is the product of our imagination only. The dove is the happiest of birds. <a onClick="return mV(\'Hsa\',7,11);">Ho 7:11</a> and <a onClick="return mV(\'Hsa\',11,11);">Ho 11:11</a> each compares people with doves; the first, because the birds at times appear foolishly trusting; the second, because, while no bird is more confiding, none is more easily frightened. "And Ephraim is like a silly dove, without understanding: they call unto Egypt, they go to Assyria" (<a onClick="return mV(\'Hsa\',7,11);">Ho 7:11</a>). "They shall come trembling as a bird out of Egypt, and as a dove out of the land of Assyria; and I will make them to dwell in their houses, saith Yahweh" (<a onClick="return mV(\'Hsa\',11,11);">Ho 11:11</a>). The reference in <a onClick="return mV(\'Nah\',2,7);">Na 2:7</a> is to the voice of the birds.<P>New Testament references will be found in a description of the baptism of Jesus (<a onClick="return mV(\'Mat\',3,16);">Mt 3:16</a>). People are admonished to be "harmless as doves" (<a onClick="return mV(\'Mat\',10,16);">Mt 10:16</a>). "And Jesus entered into the temple of God, and cast out all them that sold and bought in the temple, and overthrew the tables of the money-changers, and the seats of them that sold the doves" (<a onClick="return mV(\'Mat\',21,12);">Mt 21:12</a>). This proves that these birds were a common article of commerce, probably the most used for caged pets, and those customarily employed for sacrifice.<P>Dove\'s Dung (chari yonim, Kethibh for dibhyonim): <a onClick="return mV(\'2Ki\',6,25);">2Ki 6:25</a>: "And there was a great famine in Samaria: and, behold, they besieged it, until an ass\'s head was sold for fourscore pieces of silver, and the fourth part of a kab of dove\'s dung for five pieces of silver." This seems so repulsive that some commentators have tried to prove the name applied to the edible root of a plant, but the history of sieges records other cases where matter quite as offensive was used to sustain life. The text is probably correct as it stands.``167';
isbe[2791]='Dowry`dou\'-ri: In all Hebrew marriages, the dowry held an important place. The dowry sealed the betrothal. It took several forms. The bridegroom presented gifts to the bride. There was the mohar, "dowry" as distinguished from matttan, "gifts to the members of the family" (compare <a onClick="return mV(\'Gen\',24,22,53);">Ge 24:22, 53</a>; <a onClick="return mV(\'Gen\',34,12);">Ge 34:12</a>). The price paid to the father or brothers of the bride was probably a survival of the early custom of purchasing wives (<a onClick="return mV(\'Gen\',34,12);">Ge 34:12</a>; <a onClick="return mV(\'Exd\',22,17);">Ex 22:17</a>; <a onClick="return mV(\'1Sa\',18,25);">1Sa 18:25</a>; compare <a onClick="return mV(\'Rth\',4,10);">Ru 4:10</a>; <a onClick="return mV(\'Hsa\',3,2);">Ho 3:2</a>). There was frequently much negotiation and bargaining as to size of dowry (<a onClick="return mV(\'Gen\',34,12);">Ge 34:12</a>). The dowry would generally be according to the wealth and standing of the bride (compare <a onClick="return mV(\'1Sa\',18,23);">1Sa 18:23</a>). It might consist of money, jewelry or other valuable effects; sometimes, of service rendered, as in the case of Jacob (<a onClick="return mV(\'Gen\',29,18);">Ge 29:18</a>); deeds of valor might be accepted in place of dowry (<a onClick="return mV(\'Jos\',15,16);">Jos 15:16</a>; <a onClick="return mV(\'1Sa\',18,25);">1Sa 18:25</a>; <a onClick="return mV(\'Jdg\',1,12);">Jud 1:12</a>). Occasionally a bride received a dowry from her father; sometimes in the shape of land (<a onClick="return mV(\'Jdg\',1,15);">Jud 1:15</a>), and of cities (<a onClick="return mV(\'1Ki\',9,16);">1Ki 9:16</a>). In later Jewish history a written marriage contract definitely arranged for the nature and size of the dowry.``137';
isbe[2792]='Doxology`dok-sol\'-o-ji (doxologia, "a praising," "giving glory"): A hymn or liturgical formula expressive of praise to God, as the Gloria in Excelsis (an expansion of <a onClick="return mV(\'Luk\',2,14);">Lu 2:14</a>), sometimes called the Greater Doxology, and the Gloria Patri ("Glory be to the Father, and to the Son, and to the Holy Ghost, world without end, Amen") also known as the Lesser Doxology.<P>The clause, "as it was in the beginning, is now, and ever shall be," was probably added to the original simple formula to emphasize the church\'s dissent from the Arian conception of Christ.<P>The term is applied in particular to the concluding paragraph of the Lord\'s Prayer (<a onClick="return mV(\'Mat\',6,13);">Mt 6:13</a> margin, "For thine is the kingdom," etc.; compare <a onClick="return mV(\'1Ch\',29,11);">1Ch 29:11</a>, and see <a href="./study/isbe/search.html?string=LORD\'S+PRAYER">LORD\'S PRAYER</a>).<P>To the same general class belong <a onClick="return mV(\'Psa\',41,13);">Ps 41:13</a>; <a onClick="return mV(\'Psa\',72,18);">72:18</a>f; <a onClick="return mV(\'Psa\',89,52);">89:52</a>; <a onClick="return mV(\'Rom\',16,27);">Ro 16:27</a>; <a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>; <a onClick="return mV(\'1Ti\',1,17);">1Ti 1:17</a>; <a onClick="return mV(\'Jud\',1,25);">Jude 1:25</a>; <a onClick="return mV(\'Rev\',5,13);">Re 5:13</a>f; <a onClick="return mV(\'Rev\',19,1,2,3);">19:1-3</a>, and the modern stanza beginning "Praise God, from whom all blessings flow."``91';
isbe[2793]='Drachma; Dram`drak\'-ma, (drachme): The word is used in the Septuagint as the rendering of beqa\', "half-shekel," which must refer to the light standard for the shekel, as its weight was about 62 grains. In the New Testament the word occurs only in <a onClick="return mV(\'Luk\',15,8,9);">Lu 15:8-9</a>, where it is rendered "a piece of silver" (margin "drachma"). It was commonly taken as equivalent to the Roman denarius, though not strictly so.``1';
isbe[2794]='Dragon`drag\'-un (tannin, plural tannim, tannoth; drakon):<P>Tannin and the plural tanninim occur 14 times, and in English Versions of the Bible are variously rendered "dragon," "whale," "serpent" or "sea-monster"; but <a onClick="return mV(\'Lam\',4,3);">La 4:3</a>, the King James Version "sea-monster," the King James Version margin"sea calves," the Revised Version (British and American) "jackals." Tannim occurs 12 times, and is rendered "dragons," the Revised Version (British and American) "jackals," except in <a onClick="return mV(\'Eze\',29,3);">Eze 29:3</a>, where the King James Version has "dragon" (the American Standard Revised Version "monster"), and in <a onClick="return mV(\'Eze\',32,2);">Eze 32:2</a>, where the King James Version has "whale" and the English Revised Version and the King James Version margin"dragon" (the American Standard Revised Version "monster"). Tannoth occurs once, in <a onClick="return mV(\'Mal\',1,3);">Mal 1:3</a>, where it is rendered "dragons," the Revised Version (British and American) "jackals." Drakon occurs 12 times in <a onClick="return mV(\'Rev\',12,\'1-\');">Re 12</a>; <a onClick="return mV(\'Rev\',13,\'1-\');">13</a>; <a onClick="return mV(\'Rev\',16,\'1-\');">16</a>; and <a onClick="return mV(\'Rev\',20,\'1-\');">20</a>, where it is uniformly rendered "dragon." (Compare Arabic tinnin, the constellation, Draco.) Tannoth (Septuagint domata, "dwellings") is a feminine plural form as if from tannah, but it suits the context to give it the same meaning as tannim.<P>In <a onClick="return mV(\'Exd\',7,9,10,12);">Ex 7:9-10, 12</a>, tannin is used of the serpents which were produced from Aaron\'s rod and the rods of the Egyptian magicians, whereas in <a onClick="return mV(\'Exd\',4,3);">Ex 4:3</a> and <a onClick="return mV(\'Exd\',7,15);">7:15</a>, for the serpent produced from Aaron\'s rod, we find nachash, the ordinary word for serpent. In two passages we find "whale," the Revised Version (British and American) "sea-monster"; <a onClick="return mV(\'Gen\',1,21);">Ge 1:21</a>: "And God created the great sea-monsters, and every living creature that moveth"; <a onClick="return mV(\'Job\',7,12);">Job 7:12</a>: "Am I a sea, or a sea-monster, that thou settest a watch over me?" Other passages (the English Revised Version and the King James Version) are <a onClick="return mV(\'Deu\',32,33);">De 32:33</a>: "Their wine is the poison of dragons (the American Standard Revised Version "serpents"), and the cruel venom of asps"; <a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a>: "And I went out by night by the valley gate, even toward the dragon\'s (the American Standard Revised Version "jackal\'s") well" (the King James Version "dragon well"); <a onClick="return mV(\'Psa\',91,13);">Ps 91:13</a>: "Thou shalt tread upon the lion and adder: the young lion and the serpent (the King James Version "dragon") shalt thou trample under foot"; <a onClick="return mV(\'Psa\',148,7);">Ps 148:7</a>: "Praise Yahweh from the earth, ye sea-monsters (the King James Version "dragons"), and all deeps"; <a onClick="return mV(\'Jer\',51,34);">Jer 51:34</a>: "Nebuchadrezzar the king of Babylon hath devoured me,....like a monster" (the King James Version "dragon"). Here also two tannim passages; <a onClick="return mV(\'Eze\',29,3);">Eze 29:3</a>: "Thus saith the Lord Yahweh: Behold, I am against thee, Pharaoh king of Egypt, the great monster (the King James Version "dragon") that lieth in the midst of his rivers, that hath said, My river is mine own, and I have made it for myself"; and <a onClick="return mV(\'Eze\',32,2);">Eze 32:2</a>: "Son of man, take up a lamentation over Pharaoh king of Egypt, and say unto him, Thou wast likened unto a young lion of the nations: yet art thou as a monster (the English Revised Version "dragon," the King James Version "whale") in the seas; and thou didst break forth with thy rivers and troubledst the waters with thy feet, and fouledst their rivers." The foregoing passages offer no especial difficulties in the interpretation of the word tannin. All may fairly be understood to refer to a serpent or sea-monster or some imaginary creature, without invoking any ancient myths for their elucidation. The same may be said of the passages in Revelation. A dragon is taken as the personification of Satan, as of Pharaoh in the passages in Ezekiel. It is of course true that ancient myths may more or less distantly underlie some of these dragon and serpent references, and such myths may be demonstrated to throw additional light in certain cases, but at least the passages in question are intelligible without recourse to the myths. This however is not equally true of all the tannin passages. In <a onClick="return mV(\'Psa\',74,12);">Ps 74:12</a> we read: "Yet God is my King of old, working salvation in the midst of the earth. Thou didst divide the sea by thy strength: thou brakest the heads of the sea-monsters (the King James Version "dragons") in the waters." Compare <a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a>; <a onClick="return mV(\'Isa\',51,9);">51:9</a> f.<P>The three passages just cited seem to denote each some particular act, and are referred by Canon Cheyne (Encyclopedia Biblica, under the word "Dragon") to the old Babylonian myth of the conflict of Marduk and Tiamat in the Assyrian creation-legend (thus Gunkel, etc.). Indeed he refers to that myth not only these passages, but also <a onClick="return mV(\'Jer\',5,24);">Jer 5:24</a>; <a onClick="return mV(\'Eze\',29,\'3-6\');">Eze 29:3-6</a>; <a onClick="return mV(\'Eze\',32,\'2-8\');">32:2-8</a> and <a onClick="return mV(\'Job\',7,12);">Job 7:12</a>, which have been cited above. In translating the last two passages, Canon Cheyne uses the definite article, "the dragon," instead of "a" as in the Revised Version (British and American), which makes a great difference in the meaning. In <a onClick="return mV(\'Psa\',87,4);">Ps 87:4</a>, it is clear that Rahab is a country, i.e. Egypt. <a onClick="return mV(\'Isa\',30,7);">Isa 30:7</a> is to the same point. In <a onClick="return mV(\'Isa\',51,9,10);">Isa 51:9-10</a>, "that didst cut Rahab in pieces" and "that didst pierce the monster" (the King James Version "dragon"), are two coordinate expressions of one idea, which is apparently the defeat of the Egyptians, as appears in the reference to the passage of the Red Sea. In <a onClick="return mV(\'Isa\',27,1);">Isa 27:1</a>, "leviathan the swift serpent" and "leviathan the crooked serpent" and "the monster (the King James Version and the English Revised Version "dragon") that is in the sea" have been identified with Babylon, Persia and Egypt (Encyclopedia Biblica, under the word "Dragon," 4). It is more probable that the first two expressions are coordinate, and amount to "leviathan the swift and crooked serpent," and that the verse may therefore refer to Babylonia and Egypt. <a onClick="return mV(\'Psa\',74,\'12-15\');">Ps 74:12-15</a> is more in line with the idea of the article in EB, but it is nevertheless susceptible of an explanation similar to that of the other two passages.<P>Tannim, "dragons" (the Revised Version (British and American) "jackals") occurs in <a onClick="return mV(\'Job\',30,29);">Job 30:29</a>; <a onClick="return mV(\'Psa\',44,19);">Ps 44:19</a>; <a onClick="return mV(\'Isa\',13,22);">Isa 13:22</a>; <a onClick="return mV(\'Isa\',34,13);">34:13</a>; <a onClick="return mV(\'Isa\',35,7);">35:7</a>; <a onClick="return mV(\'Isa\',43,20);">43:20</a>; <a onClick="return mV(\'Jer\',9,11);">Jer 9:11</a>; <a onClick="return mV(\'Jer\',10,22);">10:22</a>; <a onClick="return mV(\'Jer\',14,6);">14:6</a>; <a onClick="return mV(\'Jer\',49,33);">49:33</a>; <a onClick="return mV(\'Jer\',51,37);">51:37</a>; tannoth, "dragons" (the Revised Version (British and American) "jackals") is found in <a onClick="return mV(\'Mal\',1,3);">Mal 1:3</a>. In all these passages, "jackal" suits the context better than "dragon," "sea-monster" or "serpent." An exception to the rendering of "dragon" or "serpent" or "sea-monster" for tannin is found in <a onClick="return mV(\'Lam\',4,3);">La 4:3</a>: "Even the jackals draw out the breast, they give suck to their young ones." The King James Version has "seamonster," the King James Version margin"sea calves." A mammal is indicated, and the Revised Version (British and American) apparently assumes that tannin is an error for tannim. Two other exceptions are in <a onClick="return mV(\'Eze\',29,3);">Eze 29:3</a> and <a onClick="return mV(\'Eze\',32,2);">Eze 32:2</a>, where English Versions of the Bible renders tannim by "dragon," since in these two passages "jackal" obviously will not suit.<P>On the constellational dragons or snakes, see <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY, sec. II, 1-5</a>.`<a href="./study/isbe/search.html?string=JACKAL">JACKAL</a>`37';

isbe[2800]='Draught`draft (aphedron; <a onClick="return mV(\'Mat\',15,17);">Mt 15:17</a>; <a onClick="return mV(\'Mar\',7,19);">Mr 7:19</a>): "Closet," "sink" or "privy" (Rheims), literally, "place for sitting apart" (compare <a onClick="return mV(\'2Ki\',10,27);">2Ki 10:27</a>, "draught-house," and Mishna "water-house"). According to the Mishna, Jehu turned the temple of Baal in Samaria into public latrines, "waterhouses." Mark adds here (<a onClick="return mV(\'Mar\',7,19);">Mr 7:19</a>) that by this saying Jesus cleansed all articles of food, i.e., declared them to be clean.``1';
