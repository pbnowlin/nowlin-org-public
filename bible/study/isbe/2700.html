isbe = [];

isbe[2701]='Dilean`dil\'-e-an (dil\'an, "cucumber"): A town in the Shephelah of Judah named with Migdal-gad and Mizpeh (<a onClick="return mV(\'Jos\',15,38);">Jos 15:38</a>, the English Revised Version "Dilan"), which lay probably on the north of Lachish and Eglon. It has not been identified.``1';
isbe[2702]='Diligence; Diligent; Diligently`dil\'-i-jens, dil\'-i-jent-li: This word is used in various senses in our English Bibles.<P>1. In the Old Testament:<P>In <a onClick="return mV(\'Ezr\',5,8);">Ezr 5:8</a>, "with diligence" means "with care"; in <a onClick="return mV(\'Ezr\',6,12);">Ezr 6:12</a>; <a onClick="return mV(\'Ezr\',7,17);">7:17</a>, "with speed," "speedily"; in <a onClick="return mV(\'Pro\',4,23);">Pr 4:23</a> "watchfulness"; in <a onClick="return mV(\'Deu\',4,9);">De 4:9</a>; <a onClick="return mV(\'Deu\',6,17);">6:17</a>; <a onClick="return mV(\'Deu\',19,18);">19:18</a>; <a onClick="return mV(\'Psa\',77,6);">Ps 77:6</a>; <a onClick="return mV(\'Pro\',27,23);">Pr 27:23</a>; <a onClick="return mV(\'Isa\',55,2);">Isa 55:2</a>; <a onClick="return mV(\'Mic\',7,3);">Mic 7:3</a>, "with care," "scrupulously," "earnestly." Sometimes it means "early" "with haste" (<a onClick="return mV(\'Job\',8,5);">Job 8:5</a>; <a onClick="return mV(\'Pro\',8,17);">Pr 8:17</a>). It may mean "industrious," "exacting" (<a onClick="return mV(\'Pro\',10,4);">Pr 10:4</a>; <a onClick="return mV(\'Pro\',12,27);">12:27</a>; <a onClick="return mV(\'Pro\',22,29);">22:29</a>).<P>2. In the New Testament:<P>The American revisers have rendered "diligence" for various words in the King James Version, e. g. for "business" in <a onClick="return mV(\'Rom\',12,11);">Ro 12:11</a>; "giving diligence" for "endeavoring" (<a onClick="return mV(\'Eph\',4,3);">Eph 4:3</a>); "give diligence" for "study" (<a onClick="return mV(\'2Ti\',2,15);">2Ti 2:15</a>,), for "labor" (<a onClick="return mV(\'Hbr\',4,11);">Heb 4:11</a>); "diligently" for "carefully" (<a onClick="return mV(\'Phl\',2,28);">Php 2:28</a>; <a onClick="return mV(\'Hbr\',12,17);">Heb 12:17</a>); "be diligent in" for "meditate upon" (<a onClick="return mV(\'1Ti\',4,15);">1Ti 4:15</a>). It is well also to remember that the Old English meaning of diligence is "with love," from diligo, "to love."``64';
isbe[2703]='Dill``<a href="./study/isbe/search.html?string=ANISE">ANISE</a>`1';
isbe[2704]='Diminish`di-min\'-ish: the Revised Version (British and American) has retained nearly all passages of the King James Version where "to diminish" is used. Some of these uses have become obsolete: <a onClick="return mV(\'Deu\',4,2);">De 4:2</a>, "neither shall ye diminish from it." "Diminish" generally means "to reduce," "to lessen." In this sense it is employed in <a onClick="return mV(\'Eze\',5,11);">Eze 5:11</a> from the Hebrew gara\', literally, "to shear." The picture of shearing the beard, expressing degradation and loss of manhood, may underlie this passage.``1';
isbe[2705]='Dimnah`dim\'-na (dimnah, "dung"; Damna): A city of the Merarite Levites in the territory of Zebulun (<a onClick="return mV(\'Jos\',21,35);">Jos 21:35</a>). The name is probably a clerical error for Rimmon.``1';
isbe[2706]='Dimon; Dimonah`di\'-mon, di-mo\'-na.`<a href="./study/isbe/search.html?string=DIBON">DIBON</a>`1';
isbe[2707]='Dinah`di\'-na (dinah, "justice"): The daughter of Jacob and Leah, whose violation by Shechem, son of Hamor, caused her brothers, especially Simeon and Levi, to slay the inhabitants of Shechem, although they had induced the Shechemites to believe, if they would submit to circumcision, Shechem, the most honored of all the house of his father, would be permitted to have the maiden to whom his soul clave for wife (<a onClick="return mV(\'Gen\',34,\'1-31\');">Ge 34:1-31</a>). The political elements of the story (compare <a onClick="return mV(\'Gen\',34,\'21-23\',30);">Ge 34:21-23, 30</a>) suggest a tribal rather than a personal significance for the narrative.``81';
isbe[2708]='Dinaites`di\'-na-its (dinaye\'): A people mentioned in <a onClick="return mV(\'Ezr\',4,9);">Ezr 4:9</a>, as settled in the city of Samaria by Osnappar (Assurbanipal). The identification is uncertain.``1';
isbe[2709]='Dinhabah`din\'-ha-ba, din-ha\'-ba (dinhabhah): The royal city of Bela, son of Beor; king of Edom (<a onClick="return mV(\'Gen\',36,32);">Ge 36:32</a>; <a onClick="return mV(\'1Ch\',1,43);">1Ch 1:43</a>). There may be a resemblance in the name of Hodbat et-Teneib, about 8 miles east of Heshbon; but this is in the land of Moab, and probably much too far to the North. No satisfactory identification has been proposed.``1';
isbe[2710]='Dinner`din\'-er (ariston; <a onClick="return mV(\'Mat\',22,4);">Mt 22:4</a>; <a onClick="return mV(\'Luk\',11,38);">Lu 11:38</a> (the Revised Version, margin "breakfast"); <a onClick="return mV(\'Luk\',14,12);">Lu 14:12</a>; compare <a onClick="return mV(\'Rth\',2,14);">Ru 2:14</a>; <a onClick="return mV(\'Jhn\',21,13);">Joh 21:13</a>): In oriental as in classical lands it was customary, in ancient times, as now, to have but two meals in the day, and the evidence, including that of Josephus, goes to show that the second or evening meal was the principal one. The "morning morsel," as the is Talmud calls it, was in no sense a "meal." The peasant or artisan, before beginning work, might "break (his) fast" (<a onClick="return mV(\'Jhn\',21,12,15);">Joh 21:12, 15</a>) by taking a bit of barley bread with some simple relish, but to "eat (a full meal) in the morning" was a reproach (<a onClick="return mV(\'Ecc\',10,16);">Ec 10:16</a>). The full meal was not to be taken until a little before or after sunset, when the laborers had come in from their work (<a onClick="return mV(\'Luk\',17,7);">Lu 17:7</a>; compare the "supper time" of <a onClick="return mV(\'Luk\',14,17);">Lu 14:17</a>). The noon meal, taken at an hour when climatic conditions called for rest from exertion (the ariston of the Greeks, rendered "dinner" in English Versions of the Bible, <a onClick="return mV(\'Mat\',22,4);">Mt 22:4</a>; <a onClick="return mV(\'Luk\',11,38);">Lu 11:38</a>, the Revised Version, margin "breakfast"), was generally very simple, of bread soaked in light wine with a handful of parched corn (<a onClick="return mV(\'Rth\',2,14);">Ru 2:14</a>), or of "pottage and bread broken into a bowl" (Bel and the Dragon 33), or of bread and broiled fish (<a onClick="return mV(\'Jhn\',21,13);">Joh 21:13</a>). Many, when on journey especially, content with one meal a day, taken after sunset. In general, eating at other times casual and informal; evening is the time for the formal meal, or feast.`<a href="./study/isbe/search.html?string=MEALS">MEALS</a>`47';
isbe[2711]='Dionysia`di-o-nish\'-i-a (Dionusia, "festivals of Dionysus" (Bacchus)): The rural (vintage) Dionysia were celebrated in the month of Poseideon (19th day), which is roughly our December. The celebration consisted of feasts, processions, songs and (sometimes) scenic performances. The Ascolia formed one of the most prominent features. After sacrificing a goat to the god, they filled the wine-skin with wine, made it slippery on the outside with oil, and then tried to hop on it with one leg. Whoever fell down furnished great sport for the spectators, but if anyone succeeded in maintaining an upright position to the end, he was declared victor. The demarch conducted the festival, the expenses of which were paid by the deme. The Lenea were celebrated on the 12th of Gamelion (January) in Athens, and later in Ionia in Asia Minor. At this festival also the new wine was tasted. A procession was formed and they marched through the city, indulging in all sorts of jesting and buffoonery, to attend the pantomimic performances.<P>The Anthesteria (Flower-Feast) came in the month of Anthesterion (February), when the first flowers appeared. This festival resembled somewhat our Christmas. On the first day (11th of the month) the wine-cask was opened; on the second was the feast of pitchers. Wine was drunk, and contests in trumpet-playing were held. At the drinking contest everybody was permitted to make as much merriment as he pleased. There was also a mystic marriage of the king archon\'s wife to Dionysus (compare the marriage of the Doges of Venice to the sea). On the third day they offered pots filled with vegetables to Hermes, Conductor of the Dead. This day was sacred to the gods of the nether world and to the spirits of the departed (All Souls\' Day); and the people celebrated Persephone\'s resurrection and reunion with the god.<P>The Greater, or City Dionysia, were held in Elaphebolion (March) as a spring festival. This is the most important of all the Dionysia (for us), since practically all the great tragedies of Aeschylus, Sophocles and Euripides were performed in conjunction with this festival. All the demes took part. They accompanied the ancient image of Dionysus Eleutherios (from Eleutherae in Boeotia, one of the first places in which the worship of the god was established in Greece), as it was carried in solemn procession from the Lenaeon (the original center of his cult in Athens) to a small temple in the Ceramicus in the northwestern part of the city, while choruses of men and boys sang the dithurambos (the ancient hymn to Dionysus). Crowned with the vine and dressed in unusual costumes, they greeted the god with loud shouts of joy.<P>The festival was revived with great pomp by the Pisistratidae. In theater of Dionysus all the people beheld an imposing rehearsal of their great achievements. Even the poorest and humblest were given an opportunity to see and hear the contests between the professional rhapsodists, who recited Homer, between choruses specially trained to sing the dithyrambs, and between poets, whose great dramatic productions were presented for the first time. The state set aside a special fund for the purchase of tickets for those who were too poor to buy for themselves. Comedies, tragedies and satyr dramas were presented after elaborate preparation and at a great expenditure of money. The prize, a bronze tripod, was erected with an appropriate inscription on the Street of Tripods. The awarding of prizes to the victors concluded the festival.<P>The quinquennial festival at Brauron in Attica was also celebrated with extraordinary license and merriment. The city of Athens sent delegates regularly to attend the festival.<P>There were also Dionysiac clubs in Athens at the time of the Peloponnesian War. These had peculiar doctrines and observances. They had their foundation in Orphic mysticism. The members refrained from eating the flesh of animals. They possessed holy scriptures and had peculiar propitiatory rites. The Dionysiac religious observance continued as a state cult down to 366 AD.`<a href="./study/isbe/search.html?string=BACCHUS">BACCHUS</a>`71';
isbe[2712]='Dionysius`di-o-nish\'-i-us (Dionusios, surnamed "the Areopagite"): One of the few Athenians converted by Paul (<a onClick="return mV(\'Act\',17,34);">Ac 17:34</a>). We know nothing further about him (see <a href="./study/isbe/search.html?string=AREOPAGUS">AREOPAGUS</A>). According to one account he was the first bishop of the church at Athens; according to another he suffered martyrdom in that city under Domitian. We are even told that he migrated to Rome and was sent to Paris, where he was beheaded on Montmartre (Mount of the Martyr). The patron saint of France is Denys; compare the French "Denys d\'Halicarnasse" (Dionysius of Halicarnassus). The mystical writings which were circulated in the Middle Ages and are still extant, are pronounced by the best authorities to be forgeries, and date from a period not earlier than the 5th century.``71';
isbe[2713]='Dionysus, (Bacchus)`di-o-ni\'-sus (Dionusos): The youngest of the Greek gods. In Homer he is not associated with the vine. In later Greek legend he is represented as coming from India, as traversing Asia in a triumphal march, accompanied by woodland beings, with pointed ears, snub noses and goat-tails. These creatures were called satyrs. The vine was cultivated among European-Aryans first in Thrace, and here Dionysus is said to have established his worship first in Europe. Then the cult of Dionysus passed down through the Balkan peninsula to Thebes; and in the localized form of the myth the deity was born here—son of Zeus and Semele.<p class="in15">"Offspring of Zeus on high<br>..........................<br>Thou that carest for all<br>Who on Bacchus in Italy call<br>And in Deo\'s sheltered plain<br>Of Eleusis lord dost reign,<br>Whither worshippers repair!<br>O Bacchus that dwellest in Thebes,<br>On whose broad and fertile glebes<br>Fierce warriors from the dragon\'s teeth rose,<br>Where Ismenus softly flows,<br>The city that Semele bare!" —Sophocles, Antigone. <p>Among all the Greek deities none appealed more vividly to the imagination than Dionysus. Greek tragedy is a form of worship, the ritual cult of the god of wine, who makes the initiate wise and the ungodly mad. Dionysus speaks most strongly to the sense and to the spirit at the same time. There is nothing monotonous in the Dionysiac legend; it is replete with both joy and sorrow—in some aspects it is a "passion" in others a triumph. All the passion plays of the world (even the Oberammergau Schauspiel) are in the ancient spirit. One Dionysus after another has been substituted, but from the first there has been a desire on the part of the devotee to realize his god vividly with thrilling nearness, to partake of his joys and sorrows and triumphs in his manifold adventures. In the early myths Dionysus was one of the lesser gods; he is mentioned only twice in the Iliad and twice in the Odyssey; but he is always represented as being more nearly akin to man than the great august deities of Olympus.<P>He is a man-god, or god-man. To the inhabitants of the vine-clad slopes of Attica, to which his cult had been brought from Phrygia through Thracian Boeotia, he was particularly dear. At their vintage feasts last year\'s cask of wine was opened; and when the new year brought life again to the vines, the bountiful god was greeted with songs of joyful praise. The burial of the wine in the dark tomb of the jars through the winter, and the opening of these jars at the spring festival symbolized the great awakening of man himself, the resurrection of the god\'s worshippers to a fuller and more joyous life. The vine was not the only manifestation of the god—oil and wheat were also his; he was the god of ecstasy, the giver of physical joy and excitement, the god of life, the god of certain laws of Nature, germination and extinction, the external coming into being and the dying away of all things that are, fructification in its widest aspect whether in the bursting of the seed-grain that lies intreasured in the earth, or in the generation of living creatures. Hence, the prominence given to the phallus in the solemn processions in honor of the god.<P>Nicanor (2Macc 14:33) and Antiochus Epiphanes (2Macc 6:7) thought that the cult of Dionysus would not be objectionable to the Jews. Ptolemy Philopator branded the Jews with an ivy-leaf (3Macc 2:29), which was sacred to Dionysus.`<a href="./study/isbe/search.html?string=BACCHUS">BACCHUS</a>`71';
isbe[2714]='Dioscorinthius`di-os-ko-rin\'-thi-us: A certain (unidentified) month (2Macc 11:21).`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>; <a href="./study/isbe/search.html?string=TIME">TIME</a>`1';
isbe[2715]='Dioscuri`di-os\'-ku-ri (Dioscouroi; in <a onClick="return mV(\'Act\',28,11);">Ac 28:11</a>, the King James Version Castor and Pollux, the Revised Version (British and American) the <span class="noTag">TWIN BROTHERS</span>; in margin, "Dioscuri"): The sign of the ship on which Paul sailed from Melita to Syracuse and Rhegium. The Dioscuri (i.e. sons of Zeus), Castor and Pollux, are the two chief stars in the constellation of the Twins. Some 4,000 years BC they served as pointers to mark the beginning of the new year by setting together with the first new moon of springtime. The constellation of the Twins was supposed to be especially favorable to sailors, hence, ships were often placed under the protection of the twin gods.``119';
isbe[2716]='Diotrephes`di-ot\'-re-fez (Diotrephes): A person mentioned in <a onClick="return mV(\'3Jo\',1,9,10);">3Joh 1:9-10</a> as contentiously resisting the writer\'s authority and forbidding others from exercising the Christian hospitality which he himself refused to show.<P>The words "who loveth to have the preeminence, among them" may indicate that he was a church official, abusing his position, chief stars in the constellation of the Twins. Some 4,000 years BC they served as pointers to mark the beginning of the new year by setting together with the first new moon of springtime. The constellation of the Twins was supposed to be especially favorable to sailors, hence, ships were often placed under the protection of the twin gods.``1';
isbe[2717]='Dip`Priests when offering a sin offering were required to dip a finger into the blood of the sacrificed bullock and "to sprinkle of the blood seven times before Yahweh" (compare <a onClick="return mV(\'Lev\',4,6);">Le 4:6</a>, et al.). See also the law referring to the cleansing of infected houses (<a onClick="return mV(\'Lev\',14,51);">Le 14:51</a>) and the cleansing of a leper (<a onClick="return mV(\'Lev\',14,16);">Le 14:16</a>). In all such cases "to dip" is "to moisten," "to besprinkle," "to dip in," the Hebrew Tabhal, or the Greek bapto. See also <a href="./study/isbe/search.html?string=ASHER">ASHER</a>. In <a onClick="return mV(\'Psa\',68,23);">Ps 68:23</a> "dipping" is not translated from the Hebrew, but merely employed for a better understanding of the passage: "Thou mayest crush them, dipping thy foot in blood" (the King James Version "that thy foot may be dipped in the blood"). <a onClick="return mV(\'Rev\',19,13);">Re 19:13</a> is a very doubtful passage. the King James Version reads: "a vesture dipped in blood" (from bapto, "to dip"); the Revised Version (British and American) following another reading (either rhaino, or rhantizo, both "to sprinkle"), translates "a garment sprinkled with blood." the Revised Version, margin gives "dipped in."`<a href="./study/isbe/search.html?string=SOP">SOP</a>`16';
isbe[2718]='Diphath`di\'-fath (diphath): A son of Gomer, son of Japheth, son of Noah (<a onClick="return mV(\'1Ch\',1,6);">1Ch 1:6</a>), called <a href="./study/isbe/search.html?string=RIPHATH">RIPHATH</a> (which see) in the corresponding genealogy in <a onClick="return mV(\'Gen\',10,3);">Ge 10:3</a>.``1';
isbe[2719]='Disallow`dis-a-lou\': "To disallow" as used in the Scriptures means either "to oppose," "not permit" (Hebrew no\', <a onClick="return mV(\'Num\',30,5,8,11);">Nu 30:5, 8, 11</a>), or "to reject" (Greek apodokimazo, literally, "to consider useless," <a onClick="return mV(\'1Pe\',2,4,7);">1Pe 2:4, 7</a> the King James Version, the Revised Version (British and American) "rejected").``1';
isbe[2720]='Disannul`dis-a-nul\'`<a href="./study/isbe/search.html?string=ANNUL">ANNUL</a>`1';
isbe[2721]='Disappoint`dis-a-point\':"To disappoint" may be used transitively or intransitively. In the former case it naturally has a more forceful meaning. Therefore the Revised Version (British and American) changes the translation of the King James Version wherever "disappoint" is used with an object: <a onClick="return mV(\'Job\',5,12);">Job 5:12</a>, "frustrateth"; <a onClick="return mV(\'Psa\',17,13);">Ps 17:13</a>, "confront him," the Revised Version, margin "forestall"; Judith 16:6, "brought them to nought"; but the Revised Version (British and American) retains "disappoint" where the person wh disappoints is not expressed. Compare <a onClick="return mV(\'Pro\',15,22);">Pr 15:22</a>.``1';
isbe[2722]='Discern`di-zurn\':Five Hebrew words are thus translated: bin, yadha\', nakhar, ra\'ah and shama\'. It may simply mean "observe" (bin), "I discerned among the youths" (<a onClick="return mV(\'Pro\',7,7);">Pr 7:7</a>); or discriminating knowlege, "A wise man\'s heart discerneth time and judgment" (<a onClick="return mV(\'Ecc\',8,5);">Ec 8:5</a>, yadha\'); "He discerned him not, because his hands," etc. (<a onClick="return mV(\'Gen\',27,23);">Ge 27:23</a>, nakhar); "Then shall ye return and discern between the righteous and the wicked" (<a onClick="return mV(\'Mal\',3,18);">Mal 3:18</a>, ra\'ah); "So is my lord the king to discern good," etc. (<a onClick="return mV(\'2Sa\',14,17);">2Sa 14:17</a>, shama\'). In the New Testament the words anakrino, diakrino and dokimazo are thus translated, expressing close and distinct acquaintance with or a critical knowledge of things. Used in <a onClick="return mV(\'1Cr\',2,14);">1Co 2:14</a> the King James Version of "the things of the spirit of God"; in <a onClick="return mV(\'1Cr\',11,29);">1Co 11:29</a> of "the (Lord\'s) body" in the sacrament; in <a onClick="return mV(\'Mat\',16,3);">Mt 16:3</a> of "the face of the heaven"; in <a onClick="return mV(\'Hbr\',5,14);">Heb 5:14</a> of a clear knowledge of good and evil as the prerogative of a full-grown man.`<a href="./study/isbe/search.html?string=DISCERNINGS+OF+SPIRITS">DISCERNINGS OF SPIRITS</a>`42';
isbe[2723]='Discernings of Spirits`di-zurn\'-inz, (diakriseis pneumaton, "judicial estimation," "through judgment or separation"): Occurs in <a onClick="return mV(\'1Cr\',12,10);">1Co 12:10</a> as being one of the gifts of the Spirit. The Greek word occurs in <a onClick="return mV(\'Hbr\',5,14);">Heb 5:14</a>; and <a onClick="return mV(\'Rom\',14,1);">Ro 14:1</a>: "But him that is weak in faith receive ye, yet not for decision of scruples." This translation scarcely expresses the meaning, which Thayer has freely rendered, "not for the purpose of passing judgment on opinions, as to which one is to be preferred as the more correct." Taking these three passages together it is evident that the Greek term which is rendered "discerning" means a distinguishing or discriminating between things that are under consideration; hence, the one who possessed the gift of "discernings of spirits" was able to make distinction between the one who spoke by the Spirit of God and the one who was moved by a false spirit. This gift seems to have been exercised chiefly upon those who assumed the role of teachers, and it was especially important in those days, because there were many false teachers abroad (see <a onClick="return mV(\'2Jo\',1,7);">2Joh 1:7</a>; <a onClick="return mV(\'Act\',20,29,30);">Ac 20:29-30</a>).`<a href="./study/isbe/search.html?string=SPIRITUAL+GIFTS">SPIRITUAL GIFTS</a>`62';
isbe[2724]='Disciple`di-si\'-p\'-l:<P>(1) Usually a substantive (mathetes, "a learner," from manthano, "to learn"; Latin discipulus, "a scholar"): The word is found in the Bible only in the Gospels and Acts. But it is good Greek, in use from Herodotus down, and always means the pupil of someone, in contrast to the master or teacher (didaskalos). See <a onClick="return mV(\'Mat\',10,24);">Mt 10:24</a>; <a onClick="return mV(\'Luk\',6,40);">Lu 6:40</a>. In all cases it implies that the person not only accepts the views of the teacher, but that he is also in practice an adherent. The word has several applications. In the widest sense it refers to those who accept the teachings of anyone, not only in belief but in life. Thus the disciples of John the Baptist (<a onClick="return mV(\'Mat\',9,14);">Mt 9:14</a>; <a onClick="return mV(\'Luk\',7,18);">Lu 7:18</a>; <a onClick="return mV(\'Jhn\',3,25);">Joh 3:25</a>); also of the Pharisees (<a onClick="return mV(\'Mat\',22,16);">Mt 22:16</a>; <a onClick="return mV(\'Mar\',2,18);">Mr 2:18</a>; <a onClick="return mV(\'Luk\',5,33);">Lu 5:33</a>); of Moses (<a onClick="return mV(\'Jhn\',9,28);">Joh 9:28</a>). But its most common use is to designate the adherents of Jesus. (a) In the widest sense (<a onClick="return mV(\'Mat\',10,42);">Mt 10:42</a>; <a onClick="return mV(\'Luk\',6,17);">Lu 6:17</a>; <a onClick="return mV(\'Jhn\',6,66);">Joh 6:66</a>, and often). It is the only name for Christ\'s followers in the Gospels. But (b) especially the Twelve Apostles, even when they are called simply the disciples (<a onClick="return mV(\'Mat\',10,1);">Mt 10:1</a>; <a onClick="return mV(\'Mat\',11,1);">11:1</a>; <a onClick="return mV(\'Mat\',12,1);">12:1</a>, et al.). In the Acts, after the death and ascension of Jesus, disciples are those who confess Him as the Messiah, Christians (<a onClick="return mV(\'Act\',6,1,2,7);">Ac 6:1-2, 7</a>; <a onClick="return mV(\'Act\',9,36);">9:36</a> (feminine, mathetria); <a onClick="return mV(\'Act\',11,26);">Ac 11:26</a>, "The disciples were called Christians"). Even half-instructed believers who had been baptized only with the baptism of John are disciples (<a onClick="return mV(\'Act\',19,\'1-4\');">Ac 19:1-4</a>).<P>(2) We have also the verb, matheteuo, "Jesus\' disciple" (literally, "was discipled to Jesus," <a onClick="return mV(\'Mat\',27,57);">Mt 27:57</a>); "Make disciples of all the nations" (the King James Version "teach," <a onClick="return mV(\'Mat\',28,19);">Mt 28:19</a>); "had made many disciples" (the King James Version "taught many," <a onClick="return mV(\'Act\',14,21);">Ac 14:21</a>); "every scribe who hath been made a disciple to the kingdom of heaven" (the King James Version "instructed," <a onClick="return mV(\'Mat\',13,52);">Mt 13:52</a>). The disciple of Christ today may be described in the words of Farrar, as "one who believes His doctrines, rests upon His sacrifice, imbibes His spirit, and imitates His example."<P>The Old Testament has neither the term nor the exact idea, though there is a difference between teacher and scholar among David\'s singers (<a onClick="return mV(\'1Ch\',25,8);">1Ch 25:8</a>), and among the prophetic guilds the distinction between the rank and file and the leader (<a onClick="return mV(\'1Sa\',19,20);">1Sa 19:20</a>; <a onClick="return mV(\'2Ki\',6,5);">2Ki 6:5</a>).``177';
isbe[2725]='Discipline`dis\'-i-plin (mucar): In the King James Version only in <a onClick="return mV(\'Job\',36,10);">Job 36:10</a>, where it refers to moral discipline, the strenuous cultivation of the righteous life; the Revised Version (British and American) "instruction." the Revised Version (British and American) in <a onClick="return mV(\'2Ti\',1,7);">2Ti 1:7</a> has "discipline" for a Greek word (sophronismos) meaning "sobering"; in <a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a> margin, for Greek paideia, "instruction." In classic Greek paideia means "education," mental culture. Through the influence of the Septuagint, which translates the Hebrew mucar by paideia, the meaning of "chastisement" accompanies paideia in the New Testament. Compare <a onClick="return mV(\'Hbr\',12,5,7,8,11);">Heb 12:5, 7-8, 11</a>. For ecclesiastical discipline see <a href="./study/isbe/search.html?string=CHURCH">CHURCH</a>.`<a href="./study/isbe/search.html?string=CHASTISEMENT">CHASTISEMENT</a>`1';
isbe[2726]='Discomfit; Discomfiture`dis-kum\'-fit, dis-kum\'-fi-tur (hum, mehumah): These words are now obsolete or at least obsolescent and are confined in Biblical literature wholly to the Old Testament. The meaning in general is "to annoy," "harass," "confuse," "rout" and "destroy." The most common usage is that based upon the root meaning, "to trouble" or "annoy," sometimes to the point of destruction (<a onClick="return mV(\'Jos\',10,10);">Jos 10:10</a>; <a onClick="return mV(\'Jdg\',4,15);">Jud 4:15</a>; <a onClick="return mV(\'1Sa\',7,10);">1Sa 7:10</a>; <a onClick="return mV(\'2Sa\',22,15);">2Sa 22:15</a>).<P>The King James Version errs in the translation in <a onClick="return mV(\'Isa\',31,8);">Isa 31:8</a>, where the meaning is obviously "to become subject to task work" or "to place a burden upon one." There seems also to be an unwarranted use of the word in <a onClick="return mV(\'Num\',14,45);">Nu 14:45</a>, where it means rather "to bruise" or "strike." The purest use is perhaps in <a onClick="return mV(\'1Sa\',14,20);">1Sa 14:20</a>, where the statement is made that "every man\'s sword was against his fellow, and there was a very great discomfiture."``25';
isbe[2727]='Discourse`dis-kors\':In the Revised Version (British and American) of <a onClick="return mV(\'Act\',20,7,9);">Ac 20:7, 9</a>, the translation of Greek dialegomai (the King James Version "preach"), elsewhere rendered, according to the implications of the context, "reason" or "dispute," as <a onClick="return mV(\'Act\',17,2);">Ac 17:2</a>; <a onClick="return mV(\'Act\',19,9);">19:9</a> (the King James Version "disputing," the Revised Version (British and American) "reasoning"); <a onClick="return mV(\'Jud\',1,9);">Jude 1:9</a>``1';
isbe[2728]='Discover`dis-kuv\'-er: In modern usage the word "discover" signifies "to get first sight or knowledge of," "to ascertain," or "to explore." Such usage appears in <a onClick="return mV(\'1Sa\',22,6);">1Sa 22:6</a> of the discovery of David\'s hiding-place, where the Hebrew uses yadha\'. In the King James Version the word "discover" often occurs in a sense now archaic or even obsolete. (Note in the cases cited below the Hebrew word is galah, except <a onClick="return mV(\'Jer\',13,26);">Jer 13:26</a> (chashaph, "to make bare") and <a onClick="return mV(\'Hab\',3,13);">Hab 3:13</a> (\'arar, "to make naked").)<P>(1) "To exhibit," "uncover" (or "betray"), in which examples the English Revised Version also reads with the King James Version "discover"; the American Standard Revised Version "uncover" (<a onClick="return mV(\'Exd\',20,26);">Ex 20:26</a>; <a onClick="return mV(\'Job\',12,22);">Job 12:22</a>; <a onClick="return mV(\'Isa\',57,8);">Isa 57:8</a> ("discovered thyself" the King James Version and the English Revised Version); <a onClick="return mV(\'Jer\',13,26);">Jer 13:26</a>; <a onClick="return mV(\'Lam\',2,14);">La 2:14</a>; <a onClick="return mV(\'Hsa\',7,1);">Ho 7:1</a>; <a onClick="return mV(\'Nah\',3,5);">Na 3:5</a>).<P>(2) "To cause to be no longer a covering," "to lay bare" (<a onClick="return mV(\'2Sa\',22,16);">2Sa 22:16</a> the King James Version).<P>(3) "To bring to light," "disclose" (<a onClick="return mV(\'1Sa\',14,8,11);">1Sa 14:8, 11</a> (the English Revised Version with the King James Version "discover")).<P>(4) "To unmask" or "reveal oneself" (<a onClick="return mV(\'Pro\',18,2);">Pr 18:2</a> the King James Version).<P>(5) "To take away the covering of" (<a onClick="return mV(\'Isa\',22,8);">Isa 22:8</a> the King James Version).<P>(6) "To lay bare" (<a onClick="return mV(\'Hab\',3,13);">Hab 3:13</a>). In <a onClick="return mV(\'Psa\',29,9);">Ps 29:9</a>, the King James Version reads: "The voice of the Lord.... discovereth the forests," where the Revised Version (British and American) reads, "strippeth the forests bare," i.e. "strippeth the forests of their leaves" (Perowne, The Psalms, I, 248); "strippeth bare the forests" (Briggs, Psalms, I,251,253).<P>In the New Testament (the King James Version), the word "discover" occurs as a translation of the Greek anaphanantes in <a onClick="return mV(\'Act\',21,3);">Ac 21:3</a>, and for katenooun in <a onClick="return mV(\'Act\',27,39);">Ac 27:39</a>, where the Revised Version (British and American) reads in the first instance "had come in sight of," and in the latter case "perceived."``164';
isbe[2729]='Discrepancies, Biblical`dis-krep\'-an-siz, bib\'-li-kal:<P>1. Definition:<P>By this term should be understood substantial disagreements in the statements of Biblical writers. Such disagreements might subsist between the, statements of different writers or between the several statements of a single writer. Contradictions of Biblical views from extra-Biblical sources as history, natural science, philosophy, do not fall within the scope of our subject.<P>2. Criticism versus Doctrine of Inerrancy:<P>Observant Bible readers in every age have noted, with various degrees of insight, that the Scriptures exhibit manifold interior differences and contrasts. Differences of literary form and method have ever seemed, except to those who maintained a mechanical theory of inspiration, wholly natural and fitting. Moreover, that there was progress in the Biblical revelation, especially that the New Testament of Jesus Christ signifies a vastly richer revelation of God than the Old Testament, has been universally recognized. In fulfilling the law and the prophets Christ put a marked distance between Himself and them, yet He certainly affirmed rather than denied them. The Christian church has ever held to the essential unity of the Divine library of the Holy Scriptures. Moreover, the evangelical churches have recognized the Bible as "the only and sufficient rule of both faith and practice." Indeed, in the generation following the Reformation, the strictest and most literal theory of inspiration and inerrancy found general acceptance. Over against such a body of presuppositions, criticism, some generations later, began to allege certain errors and discrepancies in the Bible. Of course the orthodox sought to repel all these claims; for they felt that the Bible, whatever the appearances might seem to indicate, must be free from error, else it could not be the word of God. So there came with criticism a long period of sturdy defense of the strictest doctrine of Biblical inerrancy. Criticism, however, kept on its way. It has forced the church to find a deeper and surer ground of confidence in the authority of the Bible as the witness to God\'s self-revelation to man. In our day the church has for the most part overcome the notion that the certainty of the saving grace of God in Christ stands or falls with the absolute inerrancy of each several statement contained in the Bible. Still there remains, and doubtless ever must remain, a need of a clear understanding of the issue involved in the allegation—along with other "human limitations"—of Biblical discrepancies.<P>3. Synopsis of the Argument:<P>Alleged discrepancies pertain<P class="in15">(1) to statements of specific, concrete facts, and<P class="in15">(2) to the utterance of principles and doctrines. Under the first head fall disagreements respecting numbers, dates, the form and order of historical events, records of spoken words, geography, natural history, etc. Under the second head fall disagreements respecting moral and religious truths, the "superhistorical" realities and values.<p>Our inquiry resolves itself into three parts:<P class="in15">(1) to determine whether there be discrepancies, of either or both sorts, in the Bible;<P class="in15">(2) to obtain at least a general understanding of the conditions and causes that may have given rise to the discrepancies, real or apparent;<P class="in15">(3) to determine their significance for faith.<P>4. Alleged Discrepancies Pertaining to Facts:<P>As to the first point, it should be observed that apparent inconsistencies may not be real ones; as so often in the past, so again it may come about that the discovery of further data may resolve many an apparent contradiction. On the other hand, the affirmation a priori that there can be and are no real discrepancies in the Bible is not only an outrage upon the human understanding, but it stands also in contradiction to the spirit of freedom that is of faith. Besides, it should not be overlooked that the discoveries of modern historical and archaeological research, which have tended to confirm so many Biblical statements, seem just as surely to reveal error in others.<P>In any event we must bow to reality, and we may do this with fearless confidence in "the God of things as they are." But are there real discrepancies in the Bible? It is no part of the present plan to attempt the impossible and at all events useless task of exhibiting definite statistics of all the alleged discrepancies, or even of all the principal ones. Passing by the childish folly that would find a "discrepancy" in mere rhetorical antitheses, such as that in <a onClick="return mV(\'Pro\',26,4,5);">Pr 26:4-5</a> ("Answer not a fool," and "Answer a fool according to his folly"), or instances of merely formal contrariety of expression, where the things intended are manifestly congruous (e. g. <a onClick="return mV(\'Mat\',12,30);">Mt 12:30</a>; <a onClick="return mV(\'Luk\',11,23);">Lu 11:23</a> contrasted with <a onClick="return mV(\'Mar\',9,40);">Mr 9:40</a>; <a onClick="return mV(\'Luk\',9,50);">Lu 9:50</a>: "He that is not with me is against me," "He that is not against us is for us"), it will serve our purpose to notice a few representative examples of real or apparent discrepancy.<P>The chronologies of Kings and Chronicles are inconsistent (compare <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+OLD+TESTAMENT">CHRONOLOGY OF THE OLD TESTAMENT</A>). The genealogies in <a onClick="return mV(\'Gen\',46,\'1-\');">Ge 46</a>; <a onClick="return mV(\'Num\',26,\'1-\');">Nu 26</a>; <a onClick="return mV(\'1Ch\',2,7);">1Ch 2:7</a> show considerable variations. The two lists of exiles who returned with Zerubbabel (<a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a>; <a onClick="return mV(\'Neh\',7,6);">Ne 7:6</a>ff) show many discrepancies, including a marked difference in the enumeration. The accounts of the creation in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> and <a onClick="return mV(\'Gen\',2,\'1-\');">2</a> (compare <a href="./study/isbe/search.html?string=CREATION">CREATION</a>)—to take an example dependent upon the results of modern criticism—are mutually independent and in important particulars diverse. But the center of interest in our inquiry is the gospel history. Since Tatian and his Diatessaron in the 2nd century, the variations and contrasts in the Gospels have not only been noted and felt, but many have striven to "harmonize" them. After all, however, there remain some irreducible differences. The Gospels, generally speaking, do not give us ipsissima verba of Jesus; in reporting His discourses they show many variations. In so far as the essential meaning is the same in all, no one speaks of discrepancies; but where the variation clearly involves a difference of meaning (e. g. <a onClick="return mV(\'Mat\',12,39,40);">Mt 12:39-40</a> and <a onClick="return mV(\'Luk\',11,29,30);">Lu 11:29-30</a>), one may say that at least a technical discrepancy exists. In recording sayings or events the evangelists manifestly do not always observe the same chronological order; Luke, e. g. records in wholly different connections sayings which Matthew includes as parts of the Sermon on the Mount (e. g. the Lord\'s Prayer, <a onClick="return mV(\'Mat\',6,9);">Mt 6:9</a>ff; <a onClick="return mV(\'Luk\',11,\'1-4\');">Lu 11:1-4</a>; compare <a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>; <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+NEW+TESTAMENT">CHRONOLOGY OF THE NEW TESTAMENT</a>). We have two distinct genealogies of Jesus (<a onClick="return mV(\'Mat\',1,\'1-16\');">Mt 1:1-16</a>; <a onClick="return mV(\'Luk\',3,23);">Lu 3:23</a>ff; compare <a href="./study/isbe/search.html?string=GENEALOGY">GENEALOGY</a>). We may even note that Pilate\'s superscription over the cross of Jesus is given in four distinct forms. Here, however, the discrepancy is not real except in the most technical sense, and is worth mentioning only to show that the evangelists\' interest does not lie in a mere objective accuracy. That a perfect agreement as to the significance of an event exists where there are undeniable discrepancies in external details may be illustrated by the two accounts of the healing of the centurion\'s servant (<a onClick="return mV(\'Mat\',8,5);">Mt 8:5</a>ff; <a onClick="return mV(\'Luk\',7,1);">Lu 7:1</a>ff). Of enormously greater interest are the various accounts of the appearances of the risen Christ. If a complete certainty as to the form and order of these events is necessary to faith, the case is not a happy one, for the harmonists have been unable to render a perfect account of these matters (compare <a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>; <a href="./study/isbe/search.html?string=RESURRECTION">RESURRECTION</a>). Turning from the Gospels to apostolic history, we meet some real problems, e. g. how to relate Paul\'s autobiographical notes in <a onClick="return mV(\'Gal\',1,\'1-\');">Ga 1</a> with the accounts in Acts.<P>5. Alleged Discrepancies Pertaining to Doctrine:<P>The discrepancies thus far noted pertain to historical matters, and not one of them involves the contradiction of a fact in which faith is interested. But are there also real or apparent discrepancies in matters of doctrine? Many scholars maintain, for instance, that the ideal of the prophets and that of the priestly class stand in a relative (not absolute) opposition to each other (compare, e. g. <a onClick="return mV(\'Isa\',1,11);">Isa 1:11</a>; <a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a> with the ritualism of Leviticus and Deuteronomy). Or, to turn to the New Testament, some would assert—among them Luther—that James stands in opposition to Paul in respect to faith and works (compare <a onClick="return mV(\'Jam\',2,17);">Jas 2:17</a>ff in contrast with <a onClick="return mV(\'Gal\',2,16);">Ga 2:16</a> and many other passages in Paul). But particular interest attaches to the problem of Christ\'s attitude toward the Old Testament law. His "but I say unto you" (<a onClick="return mV(\'Mat\',5,22);">Mt 5:22</a> and passim) has been interpreted by many as a distinct contradiction of the Old Testament. Another question of acute interest is the agreement of the Johannine picture of Jesus with that of the Synoptists.<P>It can scarcely require proof that some of these alleged discrepancies are not such at all. For example, Jesus\' attitude toward the Old Testament was one of profound reverence and affirmation. He was perfectly conscious that the Old Testament law represented a stage in the Divine education of mankind. His "but I say unto you" was not a denying of the degree of advancement represented by the Old Testament law, but a carrying out of the principle of the law to its full expression (compare <a href="./study/isbe/search.html?string=LAW">LAW</a>; <a href="./study/isbe/search.html?string=FULFIL">FULFILMENT</A>). Of course, the Divine education of Israel did not mean the mere inculcation of the truth in a fallow and hitherto unoccupied soil. There was much superstition and error to be overcome. If then one should insist that the errors, which revelation was destined to overcome, still manifest themselves here and there in the Old Testament, it may be replied that at all events the one grand tendency of Divine revelation is unmistakably clear. An idea is not "Scriptural" simply by virtue of its having been incidentally expressed by a Biblical writer, but because it essentially and inseparably belongs to the organic whole of the Biblical testimony. In the case of James versus Paul the antithesis is one of emphasis, not of contradiction of a first principle. And as for the variations in the gospel history, these do not deserve to be called real discrepancies so long as the Gospels unite in giving one harmonious picture and testimony concerning the personal life and the work and teaching of Jesus. Even from this point of view, John, though so much more theological, preaches the same Christ as the Synoptists.<P>6. Causes of Discrepancies:<P>As to the conditions under which discrepancies may arise, it may suffice, first, to call attention to the general law that God in revealing Himself to men and in moving men by His Spirit to speak or write, never lifts them out of the normal relations of human intelligence, so far as matters of history or science are concerned. It is their witness to Himself and His will which is the result of revelation and inspiration. Their references to history and Nature are not therefore in any sense super-human; accordingly they have no direct authority for faith (compare <a href="./study/isbe/search.html?string=REVELATION">REVELATION</a>; <a href="./study/isbe/search.html?string=INSPIRATION">INSPIRATION</a>). On this basis the divergences of human traditions or documents as exhibited in different genealogies, chronologies and the like are natural in the best sense and wholly fitting. As for the rest, errors of copyists have played a part.<P>7. Their Significance for Faith:<P>Faith, however, has no interest in explaining away the human limitations in God\'s chosen witnesses. It is God\'s way to place the heavenly "treasure in earthen vessels" (<a onClick="return mV(\'2Cr\',4,7);">2Co 4:7</a>). It seems that God has purposely led the church to see, through the necessity of recognizing the human limitations of the Bible, just where her faith is grounded. God has made Himself known through His Son. The Scriptures of the New Testament, and of the Old Testament in preparation for Him, give us a clear and sufficient testimony to the Christ of God. The clearness and persuasive power of that testimony make all questions of verbal and other formal agreement essentially irrelevant. The certainty that God has spoken unto us in His Son and that we have this knowledge through the Scripture testimony lifts us above all anxious concern for the possible errors of the witnesses in matters evidently nonessential.<P>LITERATURE.<P>Besides the literature noted under <a href="./study/isbe/search.html?string=REVELATION">REVELATION</a> and <a href="./study/isbe/search.html?string=INSPIRATION">INSPIRATION</a>, see J. W. Haley, An Examination of the Alleged Discrepancies of the Bible, Andover, 1873; M. S. Terry, Biblical Hermeneutics, New York, 1883; Kahler, Zur Bibelf rage, Leipzig, 1907.``134';
isbe[2730]='Discus`dis\'-kus (diskos, "the summons of the discus," 2Macc 4:14 margin, "to the game of the discus," the King James Version "the game of discus"): The discus was a round stone slab or metal plate of considerable weight (a kind of quoit), the contest of throwing which to the greatest distance was one of the exercises in the Greek gymnasia, being included in the pentathlon. It was introduced into Jerusalem by Jason the high priest in the time of Antiochus Epiphanes, 175-164 BC, in the Palaestra he had formed there in imitation of the Greek games. His conduct led to his being described in 2Macc 4:13,14 as that "ungodly man" through whom even the priests forsook their duties to play at the discus. A statue of a discobolos (discus-thrower) is in the British Museum. From discus we have the words "disc," "dish," "desk."`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>`185';
isbe[2731]='Disease; Diseases`di-zez\', di-zez\'-iz (chalah, choli; nosos): Palestine, from its position and physical conditions, ought to be a healthy country. That it is not so depends on the unsanitary conditions in which the people live and the absence of any attempts to check the introduction or development of zymotic diseases. The number of marshes or pools is fairly small, and the use of active measures to destroy the larvae of mosquitos might easily diminish or abolish the malarial fevers which now prevail all over the country.<P>The freeing of Ismailieh and Port Said from these pests is an object-lesson in sanitation. When one examines the conditions of life in towns and villages all over the country, the evidences of the ravages of these fevers and their sequelae appear on every hand as they affect all ages from infancy to middle age, and one meets but few individuals of extreme old age. The absence of any adequate system of drainage and the pollution of the water supplies are also factors of great importance in preserving this unhealthiness.<P>In ancient times it was regarded as healthier than Egypt, as it well might be, hence, the diseases of Egypt are referred to as being worse than those of Palestine (<a onClick="return mV(\'Deu\',7,15);">De 7:15</a>; <a onClick="return mV(\'Deu\',28,60);">28:60</a>; <a onClick="return mV(\'Amo\',4,10);">Am 4:10</a>). The sanitary regulations and restrictions of the Priestly Code would doubtless have raised the standard of public health, but it is unlikely that these were ever observed over any large area. The types of disease which are referred to in the Bible are those that still prevail. Fevers of several kinds, dysentery, leprosy, intestinal worms, plague, nervous diseases such as paralysis and epilepsy, insanity, ophthalmia and skin diseases are among the commonest and will be described under their several names. Methods of treatment are described under <a href="./study/isbe/search.html?string=MEDICINE">MEDICINE</a>; <a href="./study/isbe/search.html?string=PHYSICIAN">PHYSICIAN</a>. The word "disease" or "diseases" in the King James Version is changed to "sickness" in the Revised Version (British and American) in <a onClick="return mV(\'2Ki\',1,2);">2Ki 1:2</a>; <a onClick="return mV(\'2Ki\',8,8);">8:8</a>; <a onClick="return mV(\'Mat\',9,35);">Mt 9:35</a>, and left out in <a onClick="return mV(\'Jhn\',5,4);">Joh 5:4</a>; while in <a onClick="return mV(\'Mat\',8,17);">Mt 8:17</a> "sicknesses" is replaced by "diseases." the Revised Version (British and American) also changes "infirmity" in <a onClick="return mV(\'Luk\',7,21);">Lu 7:21</a> to "diseases," and in <a onClick="return mV(\'Psa\',38,7);">Ps 38:7</a> "a loathsome disease" is changed to "burning."``107';
isbe[2732]='Diseases of the Eye``<a href="./study/isbe/search.html?string=EYES+DISEASES+OF+THE">EYES, DISEASES OF THE</a>`1';
isbe[2733]='Dish`The rendering in English Versions of the Bible in some connections of three Hebrew and one Greek word. The qe\'arah of <a onClick="return mV(\'Exd\',25,29);">Ex 25:29</a>; <a onClick="return mV(\'Exd\',37,16);">37:16</a>; <a onClick="return mV(\'Num\',4,7);">Nu 4:7</a> was apparently a kind of salver, in this case of gold, for holding the loaves of the "presence bread." The same word represents the silver "platters" (<a onClick="return mV(\'Num\',7,13);">Nu 7:13</a>ff) brought by the princes as a dedication gift. The cephel of <a onClick="return mV(\'Jdg\',5,25);">Jud 5:25</a> was a large bowl, so translated in <a onClick="return mV(\'Jdg\',6,38);">Jud 6:38</a>. "Lordly dish" is literally, "bowl of (fit for) nobles." The tsallachath of <a onClick="return mV(\'2Ki\',21,13);">2Ki 21:13</a>; <a onClick="return mV(\'Pro\',19,24);">Pr 19:24</a>; <a onClick="return mV(\'Pro\',26,15);">26:15</a> (last two the King James Version "bosom" after the Septuagint) refers probably to the wide, deep dish in which the principal part of the meal was served. Of somewhat similar form may have been the trublion (Septuagint for qe\'arah) mentioned in connection with the Passover meal (<a onClick="return mV(\'Mat\',26,23);">Mt 26:23</a>; <a onClick="return mV(\'Mar\',14,20);">Mr 14:20</a>).``44';
isbe[2734]='Dishan; Dishon`di\'-shan, di\'-shon (dishan, dishon, "antelope," "pygarg"): A Horite clan, mentioned as the youngest "son" and elsewhere as the "grandson" of Seir. The form Dishon occurs several times in the list of Horite clans, together with many other totem names (<a onClick="return mV(\'Gen\',36,\'1-\');">Ge 36</a> passim; <a onClick="return mV(\'1Ch\',1,38,41);">1Ch 1:38, 41</a>). See Gray, HPN, 89.``1';
isbe[2735]='Dishonesty`dis-on\'-es-ti: Only in <a onClick="return mV(\'2Cr\',4,2);">2Co 4:2</a>, the King James Version rendering of Greek aischune; the King James Version elsewhere and the Revised Version (British and American) uniformly, "shame."``1';
isbe[2736]='Disobedience; Disobedient`dis-o-be\'-di-ens, (marah; apeitheo, parakouo): The word used chiefly in the New Testament has the general meaning of a lack of regard for authority or rulership. The stronger meaning of actual stubbornness or violence is perhaps conveyed in the Old Testament (<a onClick="return mV(\'1Ki\',13,26);">1Ki 13:26</a>; <a onClick="return mV(\'Neh\',9,26);">Ne 9:26</a>; compare <a onClick="return mV(\'1Ki\',13,21);">1Ki 13:21</a>).<P>In the New Testament there seem to be two rather clearly defined uses of the word, one objective and practical, the other ethical and psychological. The first refers more to conduct, the second to belief and one\'s mental attitude toward the object of disobedience. To the first belong such passages as refer to the overt act of disobedience to one\'s parents (<a onClick="return mV(\'Rom\',1,30);">Ro 1:30</a>; <a onClick="return mV(\'2Ti\',3,2);">2Ti 3:2</a>). Illustrating this more fully, the translation according to the King James Version of <a onClick="return mV(\'1Ti\',1,9);">1Ti 1:9</a> is given as "unruly" in the Revised Version (British and American). By far the greater emphasis, however, is placed upon the distinctly ethical quality in which disobedience is really an attitude of the mind and finds its essence in a heart of unbelief and unfaithfulness (<a onClick="return mV(\'1Pe\',2,7,8);">1Pe 2:7-8</a>; <a onClick="return mV(\'Eph\',2,2);">Eph 2:2</a>; <a onClick="return mV(\'Eph\',5,6);">5:6</a>; <a onClick="return mV(\'Col\',3,6);">Col 3:6</a>). In the latter three references "children (sons) of disobedience" are mentioned, as if one should become the very offspring of such an unhappy and unholy state of mind. The classic phrase of New Testament literature (<a onClick="return mV(\'Act\',26,19);">Ac 26:19</a>) contains both the practical and the ethical aspects. Paul\'s convictions were changed by the vision and his conduct was made to conform immediately to it.``25';
isbe[2737]='Disorderly`dis-or\'-der-li (ataktos): The word is found four times in the Epistles to the Thess (<a onClick="return mV(\'1Th\',5,14);">1Th 5:14</a>; <a onClick="return mV(\'2Th\',3,6,7,11);">2Th 3:6-7, 11</a>), "Withdraw yourselves from every brother that walketh disorderly."; "We behaved not ourselves disorderly."; "We hear of some that walk among you disorderly." The word is a military term and has reference to the soldier who does not keep the ranks (inordinatus, Liv). Then it refers to people who refuse to obey the civil laws, and thus it gets its meaning, "disorderly." It points to members in the early church, who, by their lives, became a reproach to the gospel of Christ (compare <a onClick="return mV(\'1Th\',4,11,12);">1Th 4:11-12</a>).``42';
isbe[2738]='Dispatch`dis-pach\': Occurs Tobit 7:8 in the sense of dispatch of business, "Let this business be dispatched" (the Revised Version (British and American) "finished"); 2Macc 12:18, "before he had dispatched anything" (the Revised Version (British and American) "without accomplishing"); The <span class="noTag">Wisdom of Solomon 11:19 (20)</span> in the sense of finishing, destroying, "dispatch them at once" (the Revised Version (British and American) "consume"); 2Macc 9:4 "dispatch the journey" (katanuein), which may mean "finish it quickly" Revised Version (British and American) spells "despatch."``1';
isbe[2739]='Dispensation`dis-pen-sa\'-shun: The Greek word (oikonomia) so translated signifies primarily, a stewardship, the management or disposition of affairs entrusted to one. Thus <a onClick="return mV(\'1Cr\',9,17);">1Co 9:17</a>, the King James Version "A dispensation of the gospel is committed unto me," the Revised Version (British and American) "I have stewardship entrusted to me." The idea is similar in <a onClick="return mV(\'Eph\',3,2);">Eph 3:2</a> parallel <a onClick="return mV(\'Col\',1,25);">Col 1:25</a> (the Revised Version, margin "stewardship"). In <a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a> God\'s own working is spoken of as "dispensation."``1';
isbe[2740]='Dispersion of Nations``<a href="./study/isbe/search.html?string=BABEL">BABEL</a>; <a href="./study/isbe/search.html?string=DISPERSION">DISPERSION</a>; <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>`1';
isbe[2741]='Dispersion, The`dis-pur\'-shun, (diaspora):<P>1. Golah and Dispersion<P>2. Purpose of Dispersion<P>3. Causes of Dispersion<P>4. Extent of Dispersion<P>5. The Eastern Dispersion<P>6. The Egyptian Dispersion<P>7. Testimony of Aramaic Papyri<P>8. Jewish Temple at Syene<P>9. Theories of the Syene Settlement<P>10. Importance of the Discovery<P>11. A New Chapter of Old Testament History<P>12. Alexandrian Judaism<P>13. The Jews and Hellenism<P>14. The Septuagint<P>15. Early Evidence of a Jewish Community<P>16. The Dispersion in Syria<P>17. In Arabia<P>18. In Asia Minor<P>19. Among Greeks Proper<P>20. The Roman Dispersion<P>21. Jews and Pompey<P>22. Jews and the First Caesars<P>23. Influence of Jews in the Early Roman Empire<P>24. Jews in Italy, Gaul, Spain and North Africa.<P>25. The Numbers of the Dispersion<P>26. Jewish Proselytism<P>27. Internal Organization<P>28. Unity of the Jewish People<P>29. Dispersion Influenced by Greek Thought<P>30. The Dispersion a Preparation for the Advent of Christ<P>31. The Dispersion an Auxiliary to the Spread of the Gospel<hr /><P>1. Golah and Dispersion:<P>The Dispersion is the comprehensive designation applied to Jews living outside of Palestine and maintaining their religious observances and customs among the Gentiles. They were known as the Golah (Aramaic Galutha\'), the captivity—an expression describing them in relation to their own land; and the Diaspora, the Dispersion, an expression describing them in relation to the nations among whom they were scattered. On a notable occasion Jesus said, "Ye shall seek me, and shall not find me: and where I am, ye cannot come. The Jews therefore said among themselves, Whither will this man go that we shall not find him? Will he go unto the Dispersion among the Greeks, and teach the Greeks?" (<a onClick="return mV(\'Jhn\',7,34,35);">Joh 7:34-35</a>).<P>2. Purpose of Dispersion:<P>In 2Maccabees certain priests of Jerusalem are represented as praying to God: "Gather together our Dispersion, set at liberty them that are in bondage among the heathen" (2Macc 1:27; compare 2Esdras 2:7; <a onClick="return mV(\'Jam\',1,1);">Jas 1:1</a>; <a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>). The thought of such a Dispersion as a punishment for the disobedience of the people finds frequent expression in the Prophets: Hosea (<a onClick="return mV(\'Hsa\',9,3);">Ho 9:3</a>), Jeremiah (<a onClick="return mV(\'Jer\',8,3);">Jer 8:3</a>; <a onClick="return mV(\'Jer\',16,15);">16:15</a>, etc.), Ezekiel (<a onClick="return mV(\'Eze\',4,13);">Eze 4:13</a>), and Zechariah (<a onClick="return mV(\'Zec\',10,9);">Zec 10:9</a>). And it appears also in the Deuteronomic Law (<a onClick="return mV(\'Deu\',28,25);">De 28:25</a>; <a onClick="return mV(\'Deu\',30,1);">30:1</a>). That the Dispersion of the Jews was for the benefit of the Gentiles is a conception to which expression is given in utterances of psalmists and prophets (<a onClick="return mV(\'Psa\',67,\'1-\');">Ps 67</a>; <a onClick="return mV(\'Mic\',5,7);">Mic 5:7</a>, etc.). It is found also in the Apocrypha Baruch, a work belonging to the 1st century AD: "I will scatter this people among the Gentiles, that they may do good to the Gentiles" (<span class="noTag">1:7</span>).<P>3. Causes of Dispersion:<P>The causes of the Dispersion most obvious to the student of Old Testament history were the Assyrian and Babylonian captivities, when the king of Assyria carried Israel away into his own land and placed them in Halah, and in Habor by the river of Gozan, and in the cities of the Medes (<a onClick="return mV(\'2Ki\',17,5);">2Ki 17:5</a>ff); and when in the reign of Nebuchadrezzar, king of Babylon, Judah was carried away into Babylonia (<a onClick="return mV(\'2Ki\',24,14);">2Ki 24:14</a>). See <a href="./study/isbe/search.html?string=CAPTIVITY">CAPTIVITY</a>. But there were other captivities which helped to scatter the children of Abraham. Ptolemy I of Egypt (322-285 BC) by his expeditions to Palestine and his capture of Jerusalem added largely to the Jewish population of Alexandria. Antiochus the Great of Syria (223-187 BC) removed from the Jewish communities in Mesopotamia and Babylon 2,000 families and settled them in Phrygia and Lydia (Josephus, Ant, XII, iii, 4). Pompey after his capture of Jerusalem in 63 BC carried off hundreds of Jews to Rome, where they were sold as slaves, but, afterward, many of them obtained their freedom and civic rights.<P>4. Extent of Dispersion:<P>There was, besides, a voluntary emigration of Jewish settlers for purposes of trade and commerce into the neighboring countries, and especially into the chief cities of the civilized world. The successors of Alexander, and their successors in turn, encouraged immigration into their territories and the mingling of nationalities. They needed colonists for the settlements and cities which they established, and with the offer of citizenship and facilities for trade and commerce they attracted many of the Jewish people.<P>"In this way," says Philo, "Jerus became the capital, not only of Judea, but of many other lands, on account of the colonies which it sent out from time to time into the bordering districts of Egypt, Phoenicia, Syria, Coele-Syria, and into the more distant regions of Pamphylia, Cilicia, the greater part of Asia Minor as far as Bithynia, and the remotest corners of Pontus. And in like manner into Europe: into Thessaly, and Boeotia, and Macedonia, and Aetolia, and Attica and Argos, and Corinth, and into the most fertile and fairest parts of the Peloponnesus. And not only is the continent full of Jewish colonists, but also the most important islands, such as Euboea, Cyprus, and Crete. I say nothing of the countries beyond the Euphrates. All of them except a very small portion, and Babylon, and all the satrapies which contain fruitful land, have Jewish inhabitants" (Philo, Leg ad Caium, 36).<P>About the middle of the 2nd century BC the Sibylline Oracles could say of the Jewish people: "Every land and every sea is full of thee" (<span class="noTag">3:271</span>). About the same period the Roman Senate, being anxious to extend protection to the Jews, had a circular letter written in their favor to the kings of Egypt, Syria, Pergamum, Cappadocia and Parthia, and to a great number of provinces, cities and islands of the Mediterranean, where presumably there was a larger or smaller number of Jews (1Macc 15:15ff). It is no surprise, therefore, to read that for the Feast of Pentecost at Jerusalem, there were present after the ascension of Jesus: "Parthians and Medes and Elamites, and the dwellers in Mesopotamia, in Judea and Cappadocia, in Pontus and Asia, in Phrygia and Pamphylia, in Egypt and the parts of Libya about Cyrene, and sojourners from Rome, both Jews and proselytes, Cretans and Arabians" (<a onClick="return mV(\'Act\',2,\'9-12\');">Ac 2:9-12</a>).<P>5. The Eastern Dispersion:<P>The Eastern Dispersion, caused by the Assyrian and Babylonian captivities, seems to have increased and multiplied, and to have enjoyed a considerable measure of liberty, and of prosperity. When the return from the captivity took place Under Zerubbabel, it was only a small proportion of the exiles who sought a home again in the land of their fathers. Nor did the numbers who accompanied Ezra from Babylon greatly diminish the exiles who remained behind. In the time of Christ, Josephus could speak of the Jews in Babylenia by "innumerable myriads" (Ant., XI, v, 2). He also tells us of the 2,000 Jewish families whom Antiochus transferred from Babylon and Mesopotamia to Phrygia and Syria. Of the peculiarities of the Jews as a people living apart and observing their own customs and arousing the ill-will of the neighbors, we have a glimpse in the Persian period in the Book of Esther (<a onClick="return mV(\'Est\',3,8);">3:8</a>). Babylonia remained a focus of eastern Judaism for centuries, and from the discussions in rabbinical schools there were elaborated the Talmud of Jerusalem in the 5th century of our era, and the Talmud of Babylon a century later. The two chief centers of Mesopotamian Judaism were Nehardea, a town on the Euphrates, and Nisibis on the Mygdonius; an affluent of the Chaboras, which were also centers of Syrian Christianity.<P>6. The Egyptian Dispersion:<P>The Egyptian Dispersion is of special interest and importance, and recent discoveries have thrown unexpected light upon it. As far back as the days of Sheshenq, the founder of the 22nd Dynasty, the Shishak of <a onClick="return mV(\'1Ki\',14,25);">1Ki 14:25</a>f; <a onClick="return mV(\'2Ch\',12,2);">2Ch 12:2</a>f; who invaded Palestine in the 10th century BC, and engraved on the south wall of the great Temple of Karnak the names of many districts and cities he had captured, prisoners of war and hostages may have been carried off to Egypt by the conqueror. At a later time Jewish mercenaries are said to have fought in the expedition of Psammetichus II against Ethiopia, to which expedition belong the famous inscriptions of Abu Simbel (594-589 BC). So we learn from the well-known Letter of Aristeas. But the clearest and best-known example of a settlement of Jews in Egypt is that connected with the prophet Jeremiah. When Gedaliah, the governor of Judea, after the destruction of Jerusalem in 586 BC, had been treacherously murdered, the depressed and dispirited remnant under Johnnan, the son of Kareah, resolved to take flight into Egypt, against the counsel of Jeremiah. A host of fugitives, including Jeremiah and his friend Baruch, accordingly set out thither, and settled at Migdol and Tahpanhes and Noph (Memphis), and in the country of Pathros in upper Egypt (<a onClick="return mV(\'Jer\',43,\'1-\');">Jer 43</a> <a onClick="return mV(\'Jer\',44,\'1-\');">44</a>). It was in Egypt with those fugitives that Jeremiah ended his life. Many of the fugitives were taken prisoners by Nebuchadrezzar on one of his latest expeditions to the west, and were transported to Babylon (Josephus, Ant, X, ix, 7; compare <a onClick="return mV(\'Jer\',43,8);">Jer 43:8</a>f).<P>7. Testimony of Aramaic Papyri:<P>Of this colony of Jews it is natural to see a strong confirmation in the recent discovery of Aramaic papyri at Assouan, the Syene of the ancients. The papyri were the contents of a deed box of a member of a Jewish colony in upper Egypt, and the deeds refer to house property in which Jews are concerned. Here then at Assouan, about 470 BC is a colony of Jews who have acquired houses and other property, and have become bankers and money lenders, within a century of the death of Jeremiah. In the papyri there is evidence of the existence of a tribunal of the Hebrews, a court where cases could be decided, as fully recognized by law as any of the other courts, Egyptian or Persian, for Egypt, "the basest of kingdoms," was then subject to a Persian suzerain. Most significant of all, Yahweh is acknowledged as the God of the Jews, and the existence of a chapel and even of an altar of sacrifice is beyond all doubt. Evidently these Jews in Egypt did not consider that an altar of Yahweh could not stand anywhere else than at Jerusalem, or that outside Jerusalem the worship of the synagogue was the only worship of the God of their fathers. These facts are rendered still more striking when we regard them as a fulfillment of Isaiah\'s prophecy: "In that day there shall be five cities in the land of Egypt that speak the language of Canaan, and swear to Yahweh of hosts; one shall be called the city of destruction. In that day there shall be an altar to Yahweh in the midst of the land of Egypt, and a pillar at the border thereof to Yahweh" (<a onClick="return mV(\'Isa\',19,18,19);">Isa 19:18-19</a>). These papyri give information similar to that which the clay tablets discovered at Nippur give regarding the house of Murashu Sons (see <a href="./study/isbe/search.html?string=CAPTIVITY">CAPTIVITY</a>) about the same time—the time when Ezra was setting out from Babylon to restore at Jerusalem the worship of the temple which Zerubbabel had rebuilt. It was just about a century from the time that Jeremiah had gone down to Egypt that we have the first of these deeds, and it was the grandfathers, or great-grandfathers, of the persons concerned whom he had accompanied thither so much against his will.<P>8. Jewish Temple at Syene:<P>These papyri were discovered in 1904, and a year or two later, additional papyri were discovered in a mound which stands on the site of the ancient Elephantine or Yeb, an island in the Nile, on the frontier also. One of these papyri contains a petition from the Jewish colony in Elephantine addressed to Bagohi (called Bagoas by Josephus, Ant, XI, vii, 7), the Persian governor of Judah, about 408 BC. They ask for assistance to enable them to rebuild the temple of Yahweh in Elephantine, which had been destroyed at the instigation of the priests of the rain-headed Egyptian god Khnub, who had a temple in the fortress of Yeb or Elephantine. This Jewish temple had been erected to Yahweh at least 125 years before and had been spared by Cambyses in 525 BC when he destroyed all the temples erected to the gods of Egypt. The destruction of the temple at Yeb occurred in the 14th year of Darius, 411 BC. It contained an altar for burnt sacrifice, and there were gold and silver vessels in which the blood of sacrifice was collected. The head of the college of priests presenting this petition is Jedoniah, a name found in an abbreviated form in Jadon (<a onClick="return mV(\'Neh\',3,7);">Ne 3:7</a>).<P>9. Theories of the Syene Settlement:<P>An attempt has been made to show that the bearers of these Hebrew names were descended from the captivity of the Northern Kingdom. It is suggested that they had come into Egypt with the Persian army under Cambyses from their adopted homes in Assyria and the cities of the Medes and had obtained possessions on the southern frontier of Egypt. Names believed to point to the Northern Kingdom, like Hosea and Menahem, occur very frequently, but this is too narrow a foundation for such a theory, and the Israelite origin of the Syene colonists is not established (JQR (1907), 441ff). There is more to be said in favor of the view that they were the descendants of a Jewish military colony. That Jewish mercenaries fought in the campaigns of the Pharaohs we have already seen. And that Elephantine was an important garrison town on the frontier is also certain. Josephus (Ant., XIV, vi, 2) mentions a Jewish military colony holding a post at Pelusium in the century before Christ, and this might be a similar garrison stationed at the opposite extremity of the land in the 5th century. Such a garrison would attract Jews engaged in business and in the occupations of civil life, and so a distinct Jewish community would be formed. It has even been suggested that the tidings of the destruction of the temple at Jerusalem furnished the motive to these Egyptian Jews to build the temple and rear the altar of burnt offering which the heathen priests of Khnub had destroyed.<P>10. Importance of the Discovery:<P>While the petition to the religious authorities at Jerusalem indicates that the priests of Elephantine regarded their temple as dependent upon the temple at Jerusalem, it is significant. that they were also, as is shown in their letter, in communication with Delaiah and Shelemiah the sons of Sanballat, the governor of Samaria. That this was Nehemiah\'s enemy (<a onClick="return mV(\'Neh\',4,1);">Ne 4:1</a>; <a onClick="return mV(\'Neh\',6,1);">6:1</a>, etc.) is impossible, for he lived nearly a century earlier. But the association with descendants of his, themselves Samaritans, gives a schismatical appearance to the position of the Elephantine temple. The existence of this temple with its priesthood, its altar of sacrifice, and its offerings, from 500 years BC, is an important fact in the history of the Dispersion. It was meant to keep those Jewish exiles true to the religion of their fathers and in religious fellowship with their brethren in Palestine. For a like purpose the Temple of Onias at Leontopolis was erected in the early years of the Maccabean struggle. Onias had to flee from Jerusalem with a number of priests and Levites, and for the aid he rendered to Ptolemy Philometor, the king of Egypt, he received a gift of land upon which he built a temple like to the Temple at Jerusalem. Professor Flinders Petrie believes he has discovered this temple of Onias IV at Tel el-Yehudiyeh (Hyksos and Israelite Cities, 31). The discovery confirms the account given of the temple by Josephus, who is our only authority for its erection (Ant., XIII, iii, 2; XIV, viii, 2).<P>11. A New Chapter of Old Testament History:<P>The Elephantine-Syene papyri have added a new and valuable chapter to Old Testament history. We know now of a Jewish temple in Egypt which certainly reaches 400 years further into antiquity than the temple of Onias IV at Leontopolis, and we obtain important information as to the relations of its priesthood with the leaders of the Jerusalem Jews and the Samaritans. We know now from unbiased authorities that the Jewish settlements in the Valley of the Nile are much older than has hitherto been believed. We have valuable confirmation not only of the notices in the Book of Jeremiah, but also of the statements in the later Hellenistic literature. Moreover, it is now shown that the skepticism which has prevailed in some quarters as to the very existence of any considerable Egyptian Dispersion before the time of Alexander the Great is unwarranted (Peters, Die judische Gemeinde von Elephantine-Syene, 50f; Schurer, GJV4, III, 19f).<P>12. Alexandrian Judaism:<P>What exactly were the fortunes of this Jewish community at a later time, no record has yet been found to tell. Possibly it decayed in course of time, for Herodotus who visited Egypt about 450 BC makes no mention of it and found no Jews in sufficient numbers to attract his attention. It was undoubtedly with the founding of Alexandria in 332 BC that the flourishing period of Judaism in Egypt commenced. Alexander the Great had hastened from the field of victory at Issus 333 BC, through Syria by way of Tyre, the siege of which occupied him some months, showing clemency to the inhabitants of Jerusalem and severity to the recalcitrant inhabitants of Gaza till by its eastern gate he entered Egypt and took possession of the land of the Pharaohs. The Jews appear to have been friendly to Macedonian conquest, and in Alexander\'s new city they received the rights of citizenship and two quarters all to themselves. That they were restricted to their own quarters does not appear, and in the time of Philo, at the commencement of the Christian era, they had synagogues and places of prayer in all parts of the city. Alexander died in 323 BC but the favor which he had accorded to the Jews was continued by the Ptolemies who succeeded to his Egyptian empire. The first Ptolemy, Lagi or Soter (322-285 BC), increased the Jewish population of Alexandria by raids into Palestine on which he brought back a large number of captives, both Jews and Samaritans. Other Jews, hearing of his liberality and of the prosperity of their coreligionists, were attracted to Egypt and settled in Alexandria of their own accord (Josephus, Ant, XII, i, 1). Under their own ethnarch they enjoyed great prosperity and had full religious liberty. The principal synagogue of the city was on a scale of great magnificence. In the reign of Ptolemy Philometor (182-146 BC) they were allowed to set up the temple at Leontopolis, as we have already noticed. In the time of Philo the Jewish colony in Egypt was considered to number a million.<P>13. The Jews and Hellenism:<P>It was in Alexandria that the Jews first came so powerfully under the influence of Hellenism, and here that the peculiar Greco-Jewish philosophy sprang up of which Philo was the most notable representative. The same soil was eminently favorable to early Christianity which had from the end of the 2nd century onward its greatest teachers and their learned catechetical school. See <a href="./study/isbe/search.html?string=ALEXANDRIA">ALEXANDRIA</a>.<P>14. The Septuagint:<P>The great monument of Hellenistic Judaism, which had its chief seat in Alexandria, is the Septuagint translation of the Old Testament, which became such a powerful praeparatio evangelica, and was the Bible of the Apostles and the first Christians, even of the Lord Jesus Christ Himself. It is ascribed in the Letter of Aristeas to the interest of Ptolemy II Philadelphus (285-247 BC) in a proposal to secure a copy of the Jewish Law in an accessible translation for the famous Royal Library. It is more likely that as familiarity with their Hebrew tongue diminished in their new surroundings, the need of an intelligible version of the Law to begin with was felt, and Jewish hands were set to work to produce it. In course of time the rest followed, but from the tradition of its being the work of 70 or 72 translators it is known as the Septuagint. See <a href="./study/isbe/search.html?string=SEPTUAGINT">SEPTUAGINT</a>.<P>15. Early Evidence of a Jewish Community:<P>The question has been raised whether too much has not been made of a Jewish community in Alexandria so early, and it has been asserted that we can scarcely speak of a Jewish Dispersion anywhere before the Maccabean period in the second half of the 2nd century BC. The evidence as we have seen points to the existence of Jewish communities continuously from the days of Jeremiah. Papyri prove the presence of Jews in Egypt, not only in the towns but in country districts from a comparatively early period. A remarkable inscription has recently come to light showing that at Schedia, some 20 miles from Alexandria, there existed a Jewish community which had built a synagogue and dedicated it to the honor of Ptolemy III Euergetes (247-222 BC) and his queen Berenice. If such a community was organized in the little town of Schedia at that date, we can well believe the cosmopolitan city of Alexandria to have had a considerable Jewish community at a still earlier date.<P>16. Dispersion in Syria:<P>When we turn to Syria, we find large numbers of Jews, notwithstanding the hatred of Greeks and Syrians. Josephus (BJ, VII, iii, 3) says that it is the country which has the largest percentage of Jewish inhabitants, and Antioch among the towns of Syria had the preeminence. In Damascus, which seems to have had a Jewish quarter or Jewish bazaars in the days of Ahab (<a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a> and Burney\'s note at the place), the Jewish population was numbered by thousands. From Galilee and Gilead and the region of the Hauran, Judas Maccabeus and his brother Jonathan brought bodies of Jews, who were settlers among a pagan population, for safety to Judea (1Macc 5).<P>17. In Arabia:<P>Even in Arabia Judaism had considerable footing. Edward Glaser, who prosecuted valuable archaeological researches in Arabia (see Hilprecht, Recent Researches in Bible Lands, 131ff), professes to have found Himyaritic inscriptions of the 4th and 5th centuries of our era which are monotheistic and therefore Jewish, but there is still uncertainty as to this. In the beginning of the 6th century a Jewish king actually reigned in Arabia, and because of his persecution of the Christians he was attacked and overthrown by the Christian king of Abyssinia.<P>18. In Asia Minor:<P>Of the widespread distribution of the Dispersion in Asia Minor there is abundant testimony, not only in the texts of the apostles, but in classical and early Christian literature and in the epigraphic literature which has been accumulating for the last 30 years. At Pergamum, in Lydia, in Karia, at Magnesia, at Tralles, at Miletum, in Cappadocia, Bithynia, and Pontus, considerable Jewish communities existed at the beginning of the Christian era. At Smyrna the Jews played a prominent part in the death of Polycarp 155 AD, b
