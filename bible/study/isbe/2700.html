eing especially zealous in heaping up fagots upon the fire that consumed the martyr. In his Cities and Bishoprics of Phrygia Sir William Ramsay mentions numerous indications found on inscriptions of Jewish settlers, and his chapter on "The Jews in Phrygia" focuses the results of his inquiries (op. cit., 667ff; compare 649ff). He has also made it extremely probable that long before Paul\'s day there was a strong body of Jews in Tarsus of Cilicia, and he holds that a Jewish colony was settled there as early as 171 BC. "The Seleucid kings," he says, like the Ptolemies, "used the Jews as an element of the colonies which they founded to strengthen their hold on Phrygia and other countries." But it is difficult to trace out the profound influence they exerted in the development of their country from the fact that they adopted to such an extent Greek and Roman names and manners, and were thus almost indistinguishable. At Laodicea and Hierapolis there have been found many evidences of their presence: for example, at the latter place an inscription on a gravestone tells how the deceased Publius Aelius Glycon mortified a sum of money to provide for the decoration of his tomb every year at the Feast of Unleavened Bread.<P>19. Among Greeks Proper:<P>The Dispersion among the Greeks proper had attained to considerable dimensions in the time of Christ. Philo, as noticed above, mentions Thessaly, Boeotia, Macedonia, Aetolia, Attica, Argos, Corinth and the fairest and most fertile parts of the Peloponnesus as having Jewish inhabitants. Inscriptions recovered from Delphi and elsewhere relating to the manumission of slaves in the 2nd century BC contain the names of Jews (Deissmann, Light from the Ancient East, 325f). In Sparta and Sicyon, Jews lived in the days of the Maccabees (1Macc 15:23). At Philippi we know from <a onClick="return mV(\'Act\',16,16);">Ac 16:16</a> there was a proseuche, or place of of prayer, and at Thessalonica, Berea, Athens, Corinth there were synagogues in Paul\'s time. On the islands of the Greek archipelago and the Mediterranean there were Jews. Cyprus, the home of Barnabas, had a large Jewish population; and Euboea and Crete are named by Philo as Jewish centers. Rhodes has the distinction of having produced two opponents of Judaism in the first half of the 1st century BC. Clearchus of Soli, a disciple of Aristotle, introduces in one of his dialogues a Jew from Coele-Syria, Hellenic not in speech only but in mind, representing him as having come in his travels to Asia Minor and there conversed with Aristotle. Such an experience may have been rare so early; the incident may not be fact, but fiction; yet such as it is it tells a tale of the spread of Judaism.<P>20. The Roman Dispersion:<P>The relations of Rome with the Jewish people lend special interest to the Dispersion there. Jews do not appear to have been settled in Rome before the Maccabean period. There is a certain pathos in the appeal made to the Roman state by Judas Maccabeus, amid the difficulties that were gathering round his position, for "a league of amity and confederacy" with the Roman people (1Macc 8:17-32). His brother and successor, Jonathan, followed this up later (1Macc 12:1-4,16). And in 140 BC Simon sent a delegation which concluded a treaty, offensive and defensive, with Rome, which was duly intimated by the Senate to their allies in various countries, especially of the East. During the stay of the mission at Rome its members seem to have made attempts at religious propagandism, and the praetor Hispalus compelled them to return to their homes for attempting to corrupt Roman morals by introducing the worship of Jupiter Sabazius which is no doubt the Roman interpretation of the Lord of Hosts (Yahweh Sabaoth). But ere long in Rome, as in Alexandria, they formed a colony by themselves, occupying Trastevere, the Transtiberine portion of the city, together with an island in the Tiber. Their prosperity grew with their numbers. When Cicero in 59 BC was defending Flaccus he speaks of gold being sent out of Italy, and all the provinces, to Jerusalem, and there was present among his listeners a large body of Jews interested in the case.<P>21. Jews and Pompey:<P>When Pompey had captured Jerusalem in 63 BC, he brought back with him to Rome a number of Jewish captives. They were sold as slaves, but many of them received their freedom and rights to citizenship. When Julius Caesar, who was a great patron and protector of the Jews, was assassinated, they wept over him for nights on end.<P>22. Jews and the First Caesars:<P>Augustus protected and encouraged them. Tiberius, however, adopted repressive measures toward them, and 4,000 Jews were deported by him to Sardinia while others were driven out of the city. With the downfall of Sejanus, the unworthy favorite of Tiberius, this repressive policy was reversed and they were allowed to return to Rome. Claudius again devised measures against them (circa 50 AD), and they were banished from the city. They had, however, so multiplied and they had attained such influence that it was impossible to get rid of them altogether.<P>23. Influence of Jews in the Early Roman Empire:<P>Their customs and religious observances brought down upon them the scorn of Juvenal and others, while Empire their faith and worship had attractions for the thoughtful and the superstitious.<P>"The Jews from the time of the first Caesar," says Sir Samuel Dill, "have worked their way into every class of society. A Jewish prince had inspired Caligula with an oriental ideal of monarchy. There were adherents of Judaism in the household of the great freedmen of Claudius, and their growing influence and turbulence compelled that emperor to expel the race from his capital. The worldly, pleasure-loving Poppea had, perhaps, yielded to the mysterious charms of the religion of Moses. But it was under the Flavians, who had such close associations with Judea, that Jewish influences made themselves most felt. And in the reign of Domitian, two members of the imperial house, along with many others, suffered for following the Jewish mode of life" (Roman Society from Nero to Marcus Aurelius, 84).<P>In recent excavations, which have laid bare much of subterranean Rome, many Jewish tombs have been examined and have yielded much additional knowledge of the conditions of Jewish life in the capital of the Caesars. Probably Jews gracing Pompey\'s triumph after his Syrian campaign, 61 BC, made the first Roman catacombs similar to those on Jewish hillsides and especially round Jerusalem; and in these Jewish catacombs pagans and Christians were never laid.<P>24. Jews in Italy, Gaul, Spain and North Africa:<P>In Italy, apart from Roman and Southern Italy, where they were widely spread, the number of Jews at the beginning of our era was not large. In Southern Gaul they were numerous and in Spain they were numerous and powerful. In North Africa there were Jewish communities in many centers, and Cyrene was the home of a large and flourishing Jewish population.<P>25. The Numbers of the Dispersion:<P>It is not easy to form a trustworthy estimate of the Jewish population of the world in the times of Christ. Harnack reckons up four or four and a half millions (Expansion of Christianity, I, 10) within the Roman Empire. The Judaism of the Dispersion would at least be several times more numerous than the Judaism of Palestine.<P>26. Jewish Proselytism:<P>The question has been discussed how far the Jews of the Dispersion recruited their ranks by proselytism. That they should maintain a propaganda on behalf of their ancestral faith would only be in keeping with the character of their religion as a religion of revelation. Although they had to live within "the hedge of the Law" to protect them against the corruptions and idolatries of the Gentiles, there was nevertheless at the heart of Judaism a missionary purpose, as we see from the universalism of the Psalms and the Prophets. Judaism was burdened with a message which concerned all men, to the effect that there was one God, holy and spiritual, Creator of heaven and earth, who had committed to the family of Abraham in trust for the world His Law. To witness for the Living God, and to proclaim His Law, was the chief element of the Jewish propaganda in the Roman empire, and their system of proselytism enabled them to gain adherents in numbers. In this the Old Testament Scriptures and the observance of the Sabbath were important factors, and enabled them to win the adherence of intelligent and educated people.<P>27. Internal Organization: That the Jews of the Dispersion had an internal organization with courts of their own, having considerable jurisdiction, not only in spiritual but in civil affairs, there is no doubt. This would only be in accordance with the analogy of their constitution as seen in the New Testament, and of their commercial organization in many lands to this day.<P>28. Unity of the Jewish People:<P>In all the lands of their Dispersion the Jews never lost touch with the land of their fathers, or Jerusalem, the city of the Great King. The bond of unity was maintained by the pilgrimages they made from all the countries where they were scattered to their three great national feasts; by the payment of the half-shekel toward the services of the Temple as long as it stood; and by their voluntary submission, so long as they had a national polity, to the decrees of the great Sanhedrin.<P>29. Dispersion Influenced by Greek Thought:<P>That Judaism was influenced in its Dispersion by contact of the larger world of life and thought in which the Jews had their place outside of Palestine we can see by the example of Alexandria. It was there that it felt most powerfully the penetrating and pervasive influence of Greek thought, and the large apocryphal and apocalyptic literature which sprang up there is one of the most notable results. "The Alexandrian Jew was in reality both a Jew and a Greek; he held the faith of Yahweh and sincerely worshipped the God of his fathers, but he spoke the Greek language, had received a Greek education, and had contracted many Greek ideas and habits. Still those in his position were Jews first, and Greeks afterward, and on all \'The fundamentals\' were in thorough sympathy with their Palestinian brethren" (Fairweather, From the Exile to the Advent, 109f).<P>30. The Dispersion a Preparation for the Advent of Christ:<P>The Jewish people thus widely distributed over the Roman world with their monotheism, with their Scriptures, and with their Messianic hopes, did much to prepare the way for the advent of the Redeemer who was to be the fulfillment of Jewish expectation and hope. It was due to the strange and unique influence of Judaism and to the circulation of the glowing visions of Israel\'s prophets among the nations, that there was so widespread an expectation, mentioned by Tacitus, by Suetonius and by Josephus, that from Judea would arise a Ruler whose dominion would be over all. It is now believed that Virgil\'s conception of the Better Age which was to be inaugurated by the birth of a child was derived from Isaiah\'s prophecies. And not only did the Jewish Dispersion thus prepare the way for the world\'s Redeemer in the fullness of the time, but when He had come and suffered and died and risen and ascended, it furnished a valuable auxiliary to the proclamation of the gospel. Wherever the apostles and the first preachers traveled with the good news, they found Jewish communities to whom they offered first the great salvation.<P>31. The Dispersion an Auxiliary to the Spread of the Gospel:<P>The synagogue services lent themselves most effectively to the ministry of Paul and his colleagues, and it was to the synagogue that they first repaired in every city they visited. Even to this day this preservation of "the dispersed of Israel" is one of the marvels of the Divine government of the world, proving the truth of the word of God by one of the earliest prophets: "I will sift the house of Israel among all the nations, like as grain is sifted in a sieve, yet shall not the least kernel fall upon the earth" (<a onClick="return mV(\'Amo\',9,9);">Am 9:9</a>).<P>LITERATURE.<P>Schurer, GJV4, III, 1ff; Harnack, Expansion of Christianity, I, 1-40; Fairweather, Background of the Gospel and From the Exile to the Advent; Jewish Encyclopedia, article "Diaspora"; Sayce and Cowley, Aramaic Papyri Discovered at Assuan; Oestcrley and Box, Religion and Worship of the Synagogue.``128';
isbe[2742]='Disposition`(dis-po-zish\'-un diatagai): Only in <a onClick="return mV(\'Act\',7,53);">Ac 7:53</a>, "received the law by the disposition of angels," where it bears the meaning of "administration"; the Revised Version (British and American) "as it was ordained by angels."``1';
isbe[2743]='Disputation`dis-pu-ta\'-shun: In <a onClick="return mV(\'Act\',15,2);">Ac 15:2</a>, the Revised Version (British and American) reads "questioning" for the King James Version "disputation" (Greek suzetesis). In <a onClick="return mV(\'Rom\',14,1);">Ro 14:1</a>, the King James Version "doubtful disputations" becomes in the Revised Version (British and American) "decision of scruples" (Greek diakriseis dialogismon, literally, "discussions of doubts"). The Greek in neither case implies what the word "dispute" has come to mean in modern English, but rather "to discuss" or "argue."``1';
isbe[2744]='Distaff`dis\'-taf (pelekh): This word occurs once in <a onClick="return mV(\'Pro\',31,19);">Pr 31:19</a>; "spindle" is found in the same passage. In the Revised Version (British and American) the meanings of the two words have been exchanged.`<a href="./study/isbe/search.html?string=SPINNING">SPINNING</a>`1';
isbe[2745]='Distil`dis-til\':Only found twice in the English Bible (<a onClick="return mV(\'Deu\',32,2);">De 32:2</a>; <a onClick="return mV(\'Job\',36,27);">Job 36:27</a>), in both cases in its original meaning of "to fall in drops," as dew or rain (derived through French from Latin de, "down," stillo, "to drop"). It does not occur in its later technical sense, for the process we call distilllation was not known in ancient times.``1';
isbe[2746]='Distinctly`dis-tinkt\'-li: Only <a onClick="return mV(\'Neh\',8,8);">Ne 8:8</a>, "They read in the book, in the law of God, distinctly." Probably the better rendering is the Revised Version, margin "with an interpretation," i.e. translating into Aramaic. The Hebrew word is a participle of the verb parash = "to make distinct." The corresponding Aramaic word occurs in <a onClick="return mV(\'Ezr\',4,18);">Ezr 4:18</a> = "plainly" the King James Version and the Revised Version (British and American), better "translated" the Revised Version, margin.``1';
isbe[2747]='Ditch`dich: The word is used indiscriminately in the King James Version to represent at least three different ideas: a conduit or trench (<a onClick="return mV(\'2Ki\',3,16);">2Ki 3:16</a>); a reservoir or cistern; or simply a pit or hole in the ground. In the Revised Version (British and American) this distinction is observed more carefully. Compare <a onClick="return mV(\'Job\',9,31);">Job 9:31</a>; <a onClick="return mV(\'Psa\',7,15);">Ps 7:15</a> ("pit"), and <a onClick="return mV(\'Isa\',22,11);">Isa 22:11</a> ("reservoir"), the former meaning a pit or any similar place of destruction or corruption; the latter a reservoir or cistern of water. The New Testament usage (<a onClick="return mV(\'Mat\',15,14);">Mt 15:14</a> the King James Version) corresponds somewhat with the former. See also <a onClick="return mV(\'2Ki\',3,16);">2Ki 3:16</a> ("trenches").``1';
isbe[2748]='Divers; Diverse; Diversities`di\'-verz, di-vurs\', di-vur\'-si-tiz: "Divers" meaning "various," "different in kind," is now obsolete and used only as a synonym of "several," i.e. more than one. The distinction between "divers" and "diverse" in the King James Version seems to be that the former is the wider term, the latter being restricted to the meaning of "different in kind," while "divers" is also used to express difference of number. the Revised Version (British and American) retains "diverse" in all instances but changes "divers" nearly everywhere, except where it has the meaning "several." Compare <a onClick="return mV(\'Mat\',24,7);">Mt 24:7</a>; <a onClick="return mV(\'Luk\',21,11);">Lu 21:11</a>; <a onClick="return mV(\'Hbr\',9,10);">Heb 9:10</a>, and others. It is hard to understand why the Revised Version (British and American) retains "divers" as a translation of poikilos, in <a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a> <a onClick="return mV(\'Mar\',1,34);">Mr 1:34</a>, et al., because poikilos certainly cannot have the meaning "several" but "different in kind," and the idea expressed in these passages is not that some of the people had several diseases but that different people had different kinds of diseases. The same is true in <a onClick="return mV(\'Hbr\',13,9);">Heb 13:9</a> where "divers" does not refer to number but to various kinds of teaching. <a onClick="return mV(\'Hbr\',2,4);">Heb 2:4</a> and <a onClick="return mV(\'Jam\',1,2);">Jas 1:2</a> rightly change the reading of the King James Version "divers" to "manifold."<P>In other passages the Revised Version (British and American) changes "divers" to "diverse," and thus renders the idea of the original text "different in kind." Compare <a onClick="return mV(\'Deu\',25,13);">De 25:13</a>f; <a onClick="return mV(\'Pro\',20,10,23);">Pr 20:10, 23</a>. Other passages are changed the better to render the original text: <a onClick="return mV(\'Deu\',22,9);">De 22:9</a>, "two kinds of seed"; <a onClick="return mV(\'Jdg\',5,30);">Jud 5:30</a>, "dyed"; <a onClick="return mV(\'2Ch\',30,11);">2Ch 30:11</a>, "certain men"; <a onClick="return mV(\'Mar\',8,3);">Mr 8:3</a> and <a onClick="return mV(\'Act\',19,9);">Ac 19:9</a>, "some." the King James Version reads. in all these passages "divers." the Revised Version (British and American) changes the King James Version <a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a> "at sundry times and in divers manners," an expression often found in Old English, to "by divers portions and in divers manners."<P>"Diversities" is found twice as translation of diairesis, literally, "distribution" (<a onClick="return mV(\'1Cr\',12,4);">1Co 12:4</a>ff), but the Revised Version (British and American) changes the King James Version, <a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>, "diversities" to "divers kinds," as translation of gene, "kinds."``16';
isbe[2749]='Dives`di\'-vez`<a href="./study/isbe/search.html?string=LAZARUS">LAZARUS</a>`1';
isbe[2750]='Divide`di-vid\':It is difficult to decide whether ragha\' (<a onClick="return mV(\'Job\',26,12);">Job 26:12</a>; <a onClick="return mV(\'Isa\',51,15);">Isa 51:15</a>; <a onClick="return mV(\'Jer\',31,35);">Jer 31:35</a>) should be rendered "to stir up" or "to still." The Hebrew has both meanings. Some render "He causes the sea to tremble." the Revised Version (British and American) reads "to stir" in text and "to still" in margin, while the King James Version has "to divide" in all three cases. <a onClick="return mV(\'2Ch\',35,13);">2Ch 35:13</a>, "carried them quickly" (the King James Version "divided them speedily"). Since cholaq, may mean either "to distribute" or "to be smooth," <a onClick="return mV(\'Hsa\',10,2);">Ho 10:2</a> reads "their heart is divided" in the text, but offers "smooth" in margin (the King James Version "divided"). The Greek orthotomeo, means "to cut straight," hence, the more literal translation of <a onClick="return mV(\'2Ti\',2,15);">2Ti 2:15</a>, "handling aright the word of truth" (note "holding a straight course in the way of truth" or "rightly dividing the word of truth"; the King James Version "rightly dividing").``16';
isbe[2751]='Divination`div-i-na\'-shun:<P>1. Definition<P>2. Kinds of Divination<P>3. Fundamental Assumption in Divination<P>4. Legitimate and Illegitimate Divination<P>5. The Bible and Divination<P>6. Modes of Divination Mentioned in the Bible:<P class="in15">Those Approved and Those Condemned<P>7. Terms Used in the Old Testament in Connection with Divination<P>8. Divination and Prophecy<P>LITERATURE<hr /><P>1. Definition:<P>Divination is the act of obtaining secret knowledge, especially that which relates to the future, by means within the reach almost exclusively of special classes of men.<P>2. Kinds of Divination:<P>Of this there are two main species:<P class="in15">(1) artificial,<P class="in15">(2) inspirational, or, as it was called in ancient times (Cicero, Lord Bacon, etc.), natural divination.<P>Artificial divination depends on the skill of the agent in reading and in interpreting certain signs called omens. See <a href="./study/isbe/search.html?string=AUGURY">AUGURY</a>. In inspirational or natural divination the agent is professedly under the immediate influence of some spirit or god who enables the diviner to see the future, etc., and to utter oracles embodying what he sees. Among the Romans artificial divination prevailed almost exclusively, the other having vogue largely among the Greeks, a proof surely of the more spiritual trend of the Greek mind. Yet that great Roman, Cicero, in his memorable treatise on Divination, says he agrees with those who take cognizance of these two distinct kinds of divination. As examples of inspirational divination he instances men dreaming or in a state of ecstasy (De Divinatione, i. 18). But though Cicero arranges diviners according to their pretentions, he does not believe in any superhuman communication. Thus he explains dreams on psychological principles much as modern psychologists would (op. cit. ii.63ff). As a matter of fact Cicero was an atheist, or at least an agnostic.<P>The Latin word divinatio was confined almost exclusively to divination by outward signs, though its etymology (deus, "god") suggests that it denoted originally the other kind—that due to the inspiration of superhuman beings. Chrysippus (died at Athens 207 BC), though himself a Greek philosopher, defines the word in a way which would have commanded the approval of nearly every Roman, including Cicero himself who gives it. "Divination," Cicero makes him say (op. cit. ii.63), is "a power in man which foresees and explains those signs which the gods throw in his way." The Greeks were, on the other hand, a more imaginative and emotional people, and with them inspirational divination held much the larger place. The Greek (mantis) bears a close resemblance to the Old Testament prophet, for both claimed to be inspired from without and to be superhumanly informed. The Greek term for divination (he) mantike (= he mantike techne) has reference to the work of the mantis, and it hardly ever means divination of the lower sort—that by means of signs.<P>3. Fundamental Assumption in Divination:<P>Underlying all methods of divination there lay the belief that certain superhuman spiritual beings (gods, spirits) possess the secret knowledge desired by men, and that, on certain conditions, they are willing to impart it.<P>(1) The word "divination" itself, from deus, "god," or divus, "pertaining to god," carries with it the notion that the information obtained came from deity. Similarly the Greek mantike implies that the message comes to the mantis from gods or spirits by way of inspiration.<P>(2) Astrology, or astromancy, is but one form of divination and it rests upon the ultimate belief that the heavenly bodies are deities controlling the destinies of men and revealing the future to those who have eyes to see. According to the Weltanschauung or conception of the universe advocated by Hugo Winckler, Alfred Jeremias (see The Old Testament in the Light of the East) and others, terrestrial events are but shadows of the celestial realities (compare Plato\'s doctrine of ideas). These latter represented the mind of the gods (see <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY secs. 1, 2</a>).<P>(3) On hepatoscopy, or divining from the liver, see below, 6, (2), (c).<P>(4) It can be proved that among the ancient peoples (Babylonians, Egyptians, Greeks, Romans, etc.) the view prevailed that not only oracles but also omens of all kinds are given to men by the gods and express the minds of these gods.<P>4. Legitimate and Illegitimate Divination:<P>Among the ancient Babylonians, Egyptians, Greeks and Romans the diviner stood in the service of the state and was officially consulted before wars and other great enterprises were undertaken. But among these and other ancient peoples certain classes of diviners were prohibited by the government from exercising their calling, probably because they were supposed to be in league with tile gods of other and hostile nations. The gods of a people were in the beliefs of the time the protectors of their people and therefore the foes of the foes of their proteges. It is on this account that witchcraft has been so largely condemned and punished (see <a href="./study/isbe/search.html?string=WITCHCRAFT">WITCHCRAFT</a>). Necromancy is uniformly forbidden in the Old Testament (see <a onClick="return mV(\'Lev\',19,31);">Le 19:31</a>; <a onClick="return mV(\'Deu\',18,11);">De 18:11</a>; <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>; <a onClick="return mV(\'Isa\',19,3);">19:3</a>), probably on account of its connection with ancestor worship. But among other ancient peoples it was allowed and largely practiced. Note that the Hebrew words translated (<a onClick="return mV(\'Deu\',18,11);">De 18:11</a>) "consulter with a familiar spirit" and "wizards" denote alike such persons as seek oracles from the spirits of the dead (see the present writer\'s Magic, Divination, and Demonology among the Hebrews, 85ff). The early Fathers believed that in the divination of heathenism we have the work of Satan who wished to discredit the true religion by producing phenomena among pagan races very similar to the prophetical marvels of the chosen people. This of course rests on a view of the Old Testament prophet which makes him a "predicter" and little if anything more. See <a href="./study/isbe/search.html?string=PROPHECY">PROPHECY</a>.<P>5. The Bible and Divination:<P>The attitude of the Bible toward divination is on the whole distinctly hostile and is fairly represented by <a onClick="return mV(\'Deu\',18,10);">De 18:10</a>f; where the prophet of Yahweh is contrasted with diviners of all kinds as the only authorized medium of supernatural revelation. Yet note the following:<P>(1) Balaam (<span class="noTag">Nu 22-24</span>) was a heathen diviner whose words of blessing and of cursing were believed to have magical force, and when his services are enlisted in the cause of Yahwism, so that, instead of cursing he blessed Israel, there is not a syllable of disapproval in the narrative.<P>(2) In <a onClick="return mV(\'Isa\',3,2);">Isa 3:2</a> diviners are ranked with judges, warriors and prophets as pillars of the state. They are associated with prophets and seers in <a onClick="return mV(\'Jer\',27,9);">Jer 27:9</a>; <a onClick="return mV(\'Jer\',29,8);">29:8</a>; <a onClick="return mV(\'Eze\',22,28);">Eze 22:28</a> (compare <a onClick="return mV(\'Eze\',13,\6-9\');">13:6-9<a onClick="return mV(\'Eze\',22,28);">; <a onClick="return mV(\'Eze\',12,24);">12:24</a>). It is true that the prophets and diviners mentioned in these passages use utter falsehoods, saying peace where there is none; all the same the men called prophets and diviners are classed together as similar functionaries.<P>Pure Yahwism in its very basal principle is and must ever have been antagonistic to divination of every kind, though inspirational divination has resemblances to prophetism and even affinities with it. Why then does the Bible appear to speak with two voices, generally prohibiting but at times countenancing various forms of divination? In the actual religion of the Old Testament we have a syncretism in which, though Yahwism forms the substructure, there are constituents from the religions of the native aborigines and the nations around. The underlying thought in all forms of divination is that by employing certain means men are able to obtain knowledge otherwise beyond their reach. The religion of Israel made Yahweh the source of that knowledge and the prophet the medium through which it came to men. We have an analogous example of syncretism resulting in the union of opposite elements in ancient Zarathustraism (Zoroastrianism) which, though in its central principle inconsistent with divination by omens, yet took on from the native Turanian cults of Persia certain forms of divination, especially that by lot (see Lenormant, La Divination, 22ff). Nor should it be forgotten that the Bible is a library and not a book, and where so many writers, living at widely separated times, have been at work it is natural to look for diversity of teaching, though no one can deny that in fundamental matters Bible authors are wonderfully consistent.<P>6. Modes of Divination Mentioned in the Bible:<P>For modes of divination in vogue among the ancient Babylonians, Egyptians, Greeks, Romans, etc., see the relevant works and dictionary articles. The species of divination spoken of in the Bible may be arranged under two heads: (1) those apparently sanctioned, and (2) those condemned in the Bible.<P>Those Approved and Those Condemned:<P>(1) Methods of Divination Tacitly or Expressly Sanctioned in the Bible.<P>(a) The following are instances of inspirational divination:<P>(i) The case of Balaam has already been cited. He was a Moabite and therefore a heathen soothsayer. His word of blessing or of curse is so potent that whether he blesses or curses his word secures its own realization. So far is his vocation from being censured that it is actually called into the service of Yahweh (see <span class="noTag">Nu 22-24</span>).<P>(ii) To dreams the Bible assigns an important place as a legitimate means of revealing the future. Such dreams are of two kinds:<P>(aa) Involuntary or such as come unsought. Even these are regarded as sent for guidance in human affairs. The bulk of the dreams spoken of in the Bible belong to this class: see <a onClick="return mV(\'Gen\',20,3,6);">Ge 20:3, 6</a> (Abimelech); <a onClick="return mV(\'Gen\',28,2);">28:2</a>f; <a onClick="return mV(\'Gen\',21,\'10-14\');">31:10-14</a> (Jacob); <a onClick="return mV(\'Gen\',37,\'5-9\');">37:5-9</a> (Joseph; see <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>, sec. II, 6); <a onClick="return mV(\'Gen\',40,\'5-21\');">40:5-21</a> (Pharaoh\'s butler and baker); <a onClick="return mV(\'Gen\',41,\'1-35\');">41:1-35</a> (Pharaoh); <a onClick="return mV(\'Jdg\',7,\'9-14\');">Jud 7:9-14</a> (Gideon and an unnamed man); <a onClick="return mV(\'Dan\',1,17);">Da 1:17</a> (Daniel had understanding of dreams); <a onClick="return mV(\'Dan\',2,\'1-49\');">Da 2:1-49</a> (Nebuchadnezzar\'s dream and its interpretation by Daniel); <a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>; <a onClick="return mV(\'Mat\',2,13,19);">2:13f, 19f</a> (Joseph, husband of Mary the virgin); <a onClick="return mV(\'Mat\',27,19);">27:19</a>; see also <a onClick="return mV(\'Jer\',23,25);">Jer 23:25</a>ff, where the lawfulness of prophetic dreams is assumed (compare <a onClick="return mV(\'Jer\',23,32);">23:32</a>, where "lying dreams" imply genuine ones). In the document usually ascribed by modern critics to the Elohist (E), dreams bulk largely as the above examples serve to show. Among the Babylonians belief in the significance of dreams gave rise to a science (oneiromancy) so elaborate that only special interpreters called seers (singular, baru) were considered able to explain them (see Lenormant, op. cit.,143,for examples).<P>(bb) The other species of dreams consists of such as are induced by what is called "incubation," i.e. by sleeping in a sacred place where the god of the place is believed to reveal his secrets to the sleeper. Herodotus (iv.172) says that the Nasamonians, an Egyptian tribe, used to practice divination by sleeping in the graves of their ancestors. The dreams which then came to them were understood to be revelations of their deified ancestors. See Herod. i.181 for another instance of incubation in Nineveh. We have a reference to this custom in <a onClick="return mV(\'Isa\',65,4);">Isa 65:4</a> ("that sit among the graves"), where Yahweh enters into judgment with the Jews for their sin in yielding to this superstition. Solomon\'s dream (<a onClick="return mV(\'1Ki\',3,\'5-15\');">1Ki 3:5-15</a>) came to him at the high place of Gibeon. See also <a href="./study/isbe/search.html?string=DREAM;+DREAMER">DREAM, DREAMER</a>.<P>(b) But the Bible appears in some places to give its approval to some kinds of artificial or (as it may be called) ominal divination.<P>(i) Sortliege or divination by lot. The use of the lot as a means of ascertaining the will of Deity is referred to at least without expressed censure, and, as the present writer thinks, with tacit approval, in many parts of the Bible. It was by lot that Aaron decided which of the two goats was to be for Yahweh and which for Azazel (<a onClick="return mV(\'Lev\',16,\'7-10\');">Le 16:7-10</a>). It was by lot that the land of Canaan was divided after the conquest (<a onClick="return mV(\'Num\',26,56);">Nu 26:56</a>ff; <a onClick="return mV(\'Jos\',18,\'1-\');">Jos 18</a>; <a onClick="return mV(\'Jos\',19,\'1-\');">19</a>). For other Biblical instances see <a onClick="return mV(\'Jos\',7,14);">Jos 7:14</a> (Achan found out by lot); <a onClick="return mV(\'1Ch\',6,54);">1Ch 6:54</a>ff; <a onClick="return mV(\'1Ch\',24,5);">24:5</a>ff; <a onClick="return mV(\'1Ch\',25,8);">25:8</a>f; <a onClick="return mV(\'1Ch\',26,13);">26:13</a>f; <a onClick="return mV(\'Est\',3,7);">Es 3:7</a> ("They cast Pur, that is, the lot"; see Century Bible in the place cited.); <a onClick="return mV(\'Neh\',10,34);">Ne 10:34</a>; <a onClick="return mV(\'Neh\',11,1);">11:1</a>; <a onClick="return mV(\'Jon\',1,7);">Jon 1:7</a> ("The lot fell upon Jonah"); <a onClick="return mV(\'Mat\',27,35);">Mt 27:35</a>; <a onClick="return mV(\'Act\',1,26);">Ac 1:26</a>. In the <a href="./study/isbe/search.html?string=URIM+AND+THUMMIM">URIM AND THUMMIM</a> (which see), as explained by modern scholars, the same principle is applied, for these two words, though etymologically still obscure, stand for two objects (pebbles?), one denoting yes or its equivalent, and the other number Whichever the high priest took from his ephod was believed to be the answer to the question asked. In all cases it is taken for granted that the lot cast was an expression and indication of the Divine will. See <a href="./study/isbe/search.html?string=AUGURY">AUGURY, IV, 3</a>.<P>(ii) Hydromancy, or divination by water. In <a onClick="return mV(\'Gen\',44,5);">Ge 44:5</a> Joseph is represented as practicing this kind of divination and not a word of disapproval is expressed. See <a href="./study/isbe/search.html?string=AUGURY">AUGURY</a>, IV, 2.<P>(iii) We read in the Old Testament of other signs or omens which are implicitly approved of, thus <a onClick="return mV(\'Jdg\',6,\'36-40\');">Jud 6:36-40</a> (Gideon\'s fleece); <a onClick="return mV(\'1Sa\',14,\'8-13\');">1Sa 14:8-13</a> (Jonathan decides whether or not he is to attack the Philistines by the words which he may happen to hear them speak).<P>(2) Modes of Divination Condemned.<P>The following methods of divination are explicitly or implicitly condemned in the Old Testament:<P>(a) Astromancy (= Astrology). See <a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>.<P>(b) Rhabdomancy, or the use of the divining rod, referred to apparently in <a onClick="return mV(\'Hsa\',4,12);">Ho 4:12</a> (which may be paraphrased: "My people ask counsel of a bit of wood, and the rod made thereof answers their questions"); <a onClick="return mV(\'Eze\',8,17);">Eze 8:17</a> ("They put a rod (EV "the branch") to their nose").<P>(c) By an examination of the liver of animals; see <a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>. This mode of divining, hepatoscopy, as it is has been called, was very widespread among the Babylonians, Greeks, Romans, etc., of the ancient world, and it is still in vogue in Borneo, Burma and Uganda. We have no evidence that it was practiced among the Israelites, for in the above passage it is the king of Babylon (Nebuchadnezzar) who is said to have "looked in the liver."<P>Opinions differ as to how the state of the liver could act as an omen. Jastrow says the liver was considered to be the seat of life, and that where the liver of the animal sacrificed (generally a sheep) was accepted, it took on the character of the deity to whom it was offered. The soul of the animal as seen in the liver became then a reflector of the soul of the god (see EB, XX, 102f). On the other hand, Alfred Jeremias says that in the view of the ancient Babylonians the lines and forms of the sheep\'s liver were regarded as reflecting the universe and its history (The Old Testament in the Light of the Ancient East, I, 61). Neither of these explanations is made probable by its advocates.<P>(d) By teraphim (compare <a href="./study/isbe/search.html?string=TERAPHIM">TERAPHIM</a>); see <a onClick="return mV(\'1Sa\',15,23);">1Sa 15:23</a>; <a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>; <a onClick="return mV(\'Zec\',10,2);">Zec 10:2</a>.<P>(e) Necromancy, or consulting the dead; see <a onClick="return mV(\'Lev\',19,31);">Le 19:31</a>; <a onClick="return mV(\'Lev\',20,6);">20:6</a>; <a onClick="return mV(\'Deu\',18,11);">De 18:11</a>; <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>; <a onClick="return mV(\'Isa\',19,3);">19:3</a>; see above.<P>(f) Divination through the sacrifice of children by burning (see <a onClick="return mV(\'Deu\',18,10);">De 18:10</a>). The context makes it almost certain that the words translated "that maketh his son or his daughter to pass through the fire" (EV; but read and render "that burns his son or his daughter in the fire") refer to a mode of obtaining an oracle (compare <a onClick="return mV(\'2Ki\',3,27);">2Ki 3:27</a>). The Phoenicians and Carthaginians sacrificed their children to Kronos in times of grave national danger or calamity (Porphyry Apud Euseb. Praep. Ev. iv.64,4; Diod. Sic. xx.14).<P>7. Terms Used in the Old Testament in Connection with Divination:<P>These are examined in detail in T. Witton Davies\' Magic, Divination, and Demonology among the Hebrews and Their Neighbors. See also the article "Divination" in Encyclopedia Biblica by the same writer. The following brief notes must suffice here.<P>(1) kecem, generally rendered "divination," is a general term for divination of all kinds. In <a onClick="return mV(\'Eze\',21,21);">Eze 21:21 (Hebrew 26)</a> it stands for divination by arrows while in <a onClick="return mV(\'1Sa\',28,8);">1Sa 28:8</a> it is used of divination through the medium of an \'obh ("familiar spirit"). On the derivation of the word see EB, article "Magic," section 3.<P>(2) me\'onen, probably from a Semitic root (compare Arabic \'anna) which denotes to emit a hoarse nasal sound such as was customary in reciting the prescribed formula (see <a href="./study/isbe/search.html?string=CHARM">CHARM</a>). For "oak of the me\'onim" see <a href="./study/isbe/search.html?string=AUGUR\'S OAK">AUGUR\'S OAK</a>. Some say the word means one who divines from the clouds, deriving from \'anan, "a cloud," though nothing in the context suggests this sense, and the same remark applies to the meaning "one who smites with the evil eye," making the term a denominative from \'ayin, "eye." The usual rendering in the King James Version is plural "observers of times" and in the Revised Version (British and American) "them that practice augury" (<a onClick="return mV(\'Deu\',18,10,14);">Dt. 18:10,14</A>).<P>(3) The verb nichesh, of which lichesh, is but a variant, is probably a denominative from nachash, "a serpent" (l and n interchange in Hebrew), denoting "to hiss," "to whisper" (like a serpent), then "to utter divinatory formulas." As it is used for so many kinds of divination, W. R. Smith concludes that it came to be a general term for divine. The participle of this verb is translated "enchanter" in <a onClick="return mV(\'Deu\',18,10);">De 18:10</a>, the cognate verb, "to use enchantments" in <a onClick="return mV(\'Lev\',19,26);">Le 19:26</a>; <a onClick="return mV(\'2Ki\',21,6);">2Ki 21:6</a>; <a onClick="return mV(\'2Ch\',33,6);">2Ch 33:6</a>, and the corresponding noun "enchantment" in <a onClick="return mV(\'Num\',23,23);">Nu 23:23</a>; <a onClick="return mV(\'Num\',24,1);">24:1</a>.<P>(4) gazerin, literally, "cutters," i.e. such as kill (in Arab, the cognate verb = "to slaughter") for the purpose of examining the liver or entrails as omens. Perhaps the etymology implies "sacrifice," animals being sacrificed as an appeal to deity. The word occurs only in Daniel (<a onClick="return mV(\'Dan\',2,27);">2:27</a>; <a onClick="return mV(\'1Ch\',4,7);">4:7 (4); <a onClick="return mV(\'Dan\',5,7,11);">5:7, 11</a>), and is translated "soothsayers." Some think they were "astrologers," the etymology in that case referring to the dividing of the heavens with a view, by casting the horoscope, to forecasting the future.<P>(5) \'ashshaph (the King James Version "astrologer," the Revised Version (British and American) "enchanter"), occurs only in Daniel in the Hebrew (<a onClick="return mV(\'Dan\',1,20);">1:20</a>; <a onClick="return mV(\'Dan\',2,2);">2:2</a>) and in the Aramaic (<a onClick="return mV(\'Dan\',2,10);">2:10</a>; <a onClick="return mV(\'Dan\',4,4);">4:4 (7)</a>, etc.) parts of the book. The term is probably taken from the Babylonian and denotes a magician and especially an exorcist rather than a diviner.<P>(6) kasda\'im, the same word as the Greek (Chaldaioi) (English Verisons, "Chaldeans"), denotes in Daniel (<a onClick="return mV(\'Dan\',1,4);">1:4</a>, etc.) where alone it occurs, not the people so designated but a class of astrologers. This usage (common in classical writers) arose after the fall of the Babylonian empire, when the only Chaldeans known were astrologers and soothsayers. See further, <a href="./study/isbe/search.html?string=MAGIC">MAGIC</a>. For "spirit of divination" (<a onClick="return mV(\'Act\',16,16);">Ac 16:16</a>) see <a href="./study/isbe/search.html?string=PYTHON">PYTHON</a>; <a href="./study/isbe/search.html?string=PHILIPPI">PHILIPPI</a>.<P>8. Divination and Prophecy:<P>Inspirational divination and Old Testament prophecy have much in common. Both imply the following conditions:<P>(1) the primitive instinct that, craves for secret knowledge, especially that relating to the future;<P>(2) the belief that such knowledge is possessed by certain spiritual beings who are willing on certain terms to impart it;<P>(3) such secret knowledge is imparted generally to special classes of men (rarely women) called diviners or (Bab) seers and prophets.<P>Many anthropologists (Tylor, Frazer, etc.) and Old Testament scholars (Wellhausen, W. Robertson Smith, etc.) consider prophecy to be but an outgrowth and higher form of divination. The older theologians almost to a man, and a goodly number of moderns, take precisely the opposite view, that divination is a corruption of prophecy. Probably neither view is strictly true. Sometimes in human life we find evidences of progress from lower to higher. Sometimes the process is the very reverse. It is important to take notice of the differences as well as the resemblances between the diviner and the prophet.<P>(1) The Old Testament prophet believes in a personal God whose spokesman he considers himself to be. When he spoke or wrote it was because he was, at least professedly, inspired and informed by Yahweh. "Thus says Yahweh," was the usual formula with which he introduced his oracles. The Greek and Roman mantis, on the other hand, worked himself up to the necessary ecstatic state by music, drugs (intoxicants, etc.), sacrificial smoke and the like. Sometimes it has been thought a sufficient means of divination to swallow the vital portions of birds and beasts of omen. It was believed that by eating the hearts of crows, or moles, or of hawks, men took into their bodies the presaging soul of the creature (Frazer, Golden Bough<sup>2</sup>, II, 355).<P>(2) The mantis practiced his art as a remunerative occupation, charging high fees and refusing in most cases to ply his calling without adequate remuneration. The local oracle shrines (Delphi, Clavis, etc.) were worked for personal and political ends. The Old Testament prophet, on the other hand, claimed to speak as he was bidden by his God. It was with him a matter of conviction as to what lives men ought to live, what state of heart they should cultivate. So far from furthering his own material interests, as he could by saying what kings and other dignitaries wished to hear, he boldly denounced the sins of the time, even when, as often, he had to condemn the conduct of kings and the policy of governments. Look, for example, at Isaiah\'s fearless condemnation of the conduct of Ahaz in summoning the aid of Assyria (<a onClick="return mV(\'Isa\',7,\'1-\');">Isa 7</a>ff), and at the scathing words with which Jeremiah censured the doings of the nation\'s leaders in his day (<a onClick="return mV(\'Jer\',9,26);">Jer 9:26</a>, etc.), though both these noble prophets suffered severely for their courage, especially Jeremiah, who stands out as perhaps the finest recorded example of what, in the face of formidable opposition, the religious teacher ought ever to be. Of Micaiah ben Iralab, King Ahab of Israel said, "I hate him; for he doth not prophesy good concerning me, but evil." What reward did this prophet have for his fidelity to his conscience and his God? Imprisonment (<a onClick="return mV(\'1Ki\',22,\'1-35\');">1Ki 22:1-35</a>). Had he pleased the king by predicting a happy, prosperous future that was never to be, he would have been clothed in gorgeous robes and lodged in a very palace.<P>LITERATURE.<P>In addition to the references above and the full bibliography prefixed to the present writer\'s book named above (Magic, etc.), note the following: Bouche-Leclercq, Histoire de la divination dans l\'antiquite; E. B. Tylor, Primitive Culture 3, I, 78-81; 117-33; II, 155; J. G. Frazer, Golden Bough 2, I, 346; II, 355; III, 342, et passim, and the articles in the principal Bible dictionaries.``33';

isbe[2755]='Division`di-vizh\'-un: Used in English Versions of the Bible in the following senses:<P>(1) A separate body of people<P>(a) of the tribal divisions of Israel (<a onClick="return mV(\'Jos\',11,23);">Jos 11:23</a>; <a onClick="return mV(\'Jos\',12,7);">12:7</a>; <a onClick="return mV(\'Jos\',18,10);">18:10</a>);<P>(b) of sections of a tribe, "the divisions of Reuben" (<a onClick="return mV(\'Jdg\',5,15,16);">Jud 5:15-16</a> the King James Version; but the Revised Version (British and American) rightly substitutes "the watercourses of Reuben"; in <a onClick="return mV(\'Job\',20,17);">Job 20:17</a> the same word is rendered "rivers");<P>(c) of the (late) organization of priests and Levites into classes or families who ministered in the temple in rotation; translated "courses" generally in the King James Version, and always in the Revised Version (British and American) (<a onClick="return mV(\'1Ch\',24,1);">1Ch 24:1</a>; <a onClick="return mV(\'1Ch\',26,1,12,19);">26:1, 12, 19</a>; <a onClick="return mV(\'Neh\',11,36);">Ne 11:36</a>; compare <a onClick="return mV(\'2Ch\',35,5);">2Ch 35:5</a>). Much prominence is given by the Chronicler to the 24 classes of priests, singers, and doorkeepers, who served in turns in the temple (compare <a onClick="return mV(\'Luk\',1,5,8);">Lu 1:5, 8</a>).<p>(2) Separation, distinction: "I will put a division [Revise Version margin "sign of deliverance"] between my people and thy people" (<a onClick="return mV(\'Exd\',8,23);">Ex 8:23</a>). The Hebrew wordk here is peduth = "ransom," "redemption" (cf. <a onClick="return mV(\'Psa\',111,9);">Ps 111:9</a>), but the reading is doubtful. American Version and Revised Version follow Septuigent, Syriac and Vulgate, which render "set a distinction," perhaps on the basis of a different reading from that of our Hebrew text.<P>(3) In the New Testament, dissension, disunion, schism (<a onClick="return mV(\'Luk\',12,51);">Lu 12:51</a>; <a onClick="return mV(\'Rom\',16,17);">Ro 16:17</a>; <a onClick="return mV(\'1Cr\',3,3);">1Co 3:3</a> the King James Version, omitted the Revised Version (British and American); <a onClick="return mV(\'1Cr\',1,10);">1Co 1:10</a>; <a onClick="return mV(\'1Cr\',11,18);">11:18</a>; <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>).``49';

isbe[2757]='Divorce in the New Testament`(to apostasiou): The Scripture doctrine of divorce is very simple. It is contained in <a onClick="return mV(\'Mat\',19,\'3-12\');">Mt 19:3-12</a>.<P>We are not called upon to treat of divorce in the Mosaic legislation (<a onClick="return mV(\'Deu\',24,\'1-4\');">De 24:1-4</a>). That was passed upon by Jesus in the above discussion and by Him ruled out of existence in His system of religion. After Jesus had spoken as above, the Mosaic permission of divorce became a dead letter. There could not be practice under it among His disciples. So such Old Testament divorce is now a mere matter of antiquarian curiosity.<P>It may be of interest in passing to note that the drift of the Mosaic legislation was restrictive of a freedom of divorce that had been practiced before its enactment. It put in legal proceedings to bar the personal will of one of the parties. It recognized marriage as a social institution which should not be disrupted without reference to the rights of society in it. In this restrictive character "the law is become our tutor to bring us unto Christ" (<a onClick="return mV(\'Gal\',3,24);">Ga 3:24</a>). But here, as in numerous other instances, Christ went behind the enactments to primitive original principles whose recognition would make the law of none effect, because no practice was to be permitted under it. Thus the Old Testament is disposed of.<P>Of course what Jesus said will dominate the New. In fact, Jesus is the only author in the New Testament who has treated of divorce. It has been thought that Paul had the subject in hand. But we shall find on examination, further along, that he did not. We need then look nowhere but to <a onClick="return mV(\'Mat\',19,\'1-\');">Mt 19</a> for the Scripture doctrine of divorce.<P>True, we have other reports of what Jesus said (<a onClick="return mV(\'Mar\',10,\'2-12\');">Mr 10:2-12</a>; <a onClick="return mV(\'Luk\',16,18);">Lu 16:18</a>). But in <a onClick="return mV(\'Mat\',19,\'1-\');">Mt 19</a> we have the fullest report, containing everything that is reported elsewhere and one or two important observations that the other writers have not included. Luke has only one verse where Matthew has ten. Luke\'s verse is in no necessary connection with context. It seems to be a mere memorandum among others of the spiritual or ethical teachings of Christ. Luke however caught the gist of the whole teaching about divorce in recording the prohibition to put away one wife and marry another. The records in <a onClick="return mV(\'Mat\',19,\'1-\');">Mt 19</a> and <a onClick="return mV(\'Mar\',10,\'1-\');">Mr 10</a> cover one and the same occasion. But there is nothing in Mark that is not in Matthew; and the latter contains nearly a third more of text than the former. There is nothing, however, essential in Matthew that is not in Mark, save the clause "except for fornication." That exception will be treated further along. We seem to be justified then in saying that the total doctrine of the Scripture pertaining to divorce is contained in <a onClick="return mV(\'Mat\',19,\'1-\');">Mt 19</a>.<P>Attention must be called to the fact that, in the Sermon on the Mount (<a onClick="return mV(\'Mat\',5,\'27-32\');">Mt 5:27-32</a>), Jesus treated of divorce, and that in every essential particular it agrees with the elaboration in <a onClick="return mV(\'Mat\',19,\'1-\');">Mt 19</a>. Jesus there as plainly as in the argument with the Pharisees put Moses\' permission of divorce under ban; as plainly there declared the putting away of one partner to marry another person to be adultery. This may also be noticed, that the exception to the absolute prohibition is in the text of the Sermon on the Mount.<P>We have then a summary of the New Testament doctrine of divorce stated by Christ Himself as follows: "Whosoever shall put away his wife, except for fornication, and shall marry another, committeth adultery" (<a onClick="return mV(\'Mat\',19,9);">Mt 19:9</a>). This puts Him in line with the ideal of the monogamic, indissoluble family which pervades the whole of the Old Testament.<P>1. The Family:<P>It may be well here to treat of the exception which Christ made in His rule to the indissolubility of marriage. It is very widely maintained in the Christian church that there should be no divorce for any cause whatever. This position is in plain contradiction to Christ\'s teaching in <a onClick="return mV(\'Mat\',15,\'1-\');">Mt 15</a> and <a onClick="return mV(\'Mat\',19,\'1-\');">Mt 19</a>. One of the grounds adduced for this denial of divorce in case a partner is guilty of adultery is that Luke and Mark do not record the exception. It is a difficult matter to invade the psychology of writers who lived nearly two thousand years ago and tell why they did not include something in their text which someone else did in his. Neither Luke nor Mark were personal disciples of the Lord. They wrote second hand. Matthew was a personal disciple of Christ and has twice recorded the exception. It will be a new position in regard to judgment on human evidence when we put the silence of absentees in rank above the twice expressed report of one in all probability present—one known to be a close personal attendant.<P>This may be said: Matthew\'s record stands in ancient manuscript authority, Greek and also the Versions. And on this point let it be noted that the testimony of the manuscripts was up before the English and American Revisers, and they have deliberately reaffirmed the text of 1611 and given us the exception in Christ\'s rule in each place (<a onClick="return mV(\'Mat\',5,32);">Mt 5:32</a>; <a onClick="return mV(\'Mat\',19,9);">19:9</a>). This makes the matter as nearly res adjudicata as can be done by human wisdom.<P>Let us consider the rationality of the exception. That feature has had scant attention from theologians and publicists, yet it will bear the closest scrutiny. In fact it is a key to much that is explanatory of the basic principle of the family. To begin with, the exception is not on its face an after-thought of some transcriber, but was called out by the very terms of the question of the Pharisees: "Is it lawful for a man to put away his wife for every cause?" This plainly called for a specification from Jesus of exceptions which he would allow to the rule against divorce. It is fortunate that the Pharisees asked the question in the form they did, for that put on Jesus the necessity of enumerating such exceptions as he would allow. He mentioned one, and but one in reply. That puts the matter of exceptions under the rule in logic: Expressio unius-exclusio alterius. All other pretenses for divorce were deliberately swept aside by Christ—a fact that should be remembered when other causes are sought to be foisted in alongside this one allowed by Christ. The question may come up, Whose insight is likely to be truest?<P>Why, then, will reason stand by this exception? Because adultery is per se destructive of monogamic family life. Whoever, married, is guilty of adultery has taken another person into family relation. Children may be born to that relation—are born to it. Not to allow divorce in such case is to force an innocent party in marriage to live in a polygamous state. There is the issue stated so plainly that "the wayfaring man need not err therein," and "he who runs may read," and "he who reads may run." It is the hand of an unerring Master that has made fornication a ground for divorce from the bond of matrimony and limited divorce to that single cause. Whichever way we depart from strict practice under the Savior\'s direction we land in polygamy. The society that allows by its statutes divorce for any other cause than the one that breaks the monogamic bond, is simply acting in aid of polygamy, consecutive if not contemporaneous.<P>Advocates of the freedom of divorce speak of the above view as "the ecclesiastical." That is an attempt to use the argument ad invidiam. The church of Christ held and holds its views, not because ecclesiastics taught it, but because Christ taught it, and that in His teaching we have a statement out from the righteousness, wisdom, insight and rationality of the all-wise God.<P>2. Paul:<P>Paul is the only other New Testament author besides Christ who has been supposed to treat of divorce. But a careful examination of Paul\'s writing will disclose the fact that he has nowhere discussed the question—for what cause or causes a man might put away his wife, or a woman her husband, with liberty of marriage to another person. If Paul has treated of divorce at all it is in <a onClick="return mV(\'1Cr\',7,\'1-\');">1Co 7</a>. But even a careless reading of that chapter will disclose the fact that Paul is not discussing the question for what causes marriage might be disrupted, but the question of manners and morals in the relation. Paul has not modified Christ in any respect. It has been supposed that in <a onClick="return mV(\'1Cr\',7,15);">7:15</a> Paul has allowed divorce to a believing partner who has been deserted by one unbelieving, and so he has been sometimes understood as adding desertion to the exception Christ made as cause for divorce.<P>But Paul has not said in that verse or anywhere else that a Christian partner deserted by a heathen may be married to someone else. All he said is: "If the unbelieving departeth, let him depart: the brother or the sister is not under bondage (dedoulotai) in such cases: but God hath called us in peace." To say that a deserted partner "hath not been enslaved" is not to say that he or she may be remarried. What is meant is easily inferred from the spirit that dominates the whole chapter, and that is that everyone shall accept the situation in which God has called him just as he is. "Be quiet" is a direction that hovers over every situation. If you are married, so remain. If unmarried, so remain. If an unbelieving partner deserts, let him or her desert. So remain. "God hath called us in peace." Nothing can be more beautiful in the morals of the marriage relation than the direction given by Paul in this chapter for the conduct of all parties in marriage in all trials.<P>Many reasons might be given why Paul could not have given liberty of remarriage, besides the one that he did not in his text; but attention should be called to the fact that such an assumption of authority in divorce would soon have brought him into conflict with the Roman government. Paul\'s claim that he was a Roman citizen was of some value to himself. Would not some Roman citizen have claimed to scrutinize pretty closely Paul\'s right to issue a decree of divorce against him because he had "departed" from a wife who had become a Christian? There would be two sides to such divorces. Would not Paul, careful, shrewd, politic as he was, have known that, and have avoided an open rupture with a government that did not tolerate much interference with its laws? That neither Paul nor anyone else ever put such construction upon his language, is evidenced by the fact that there is no record in history of a single case where it was attempted for 400 years after Paul was in his grave, and the Roman Empire had for a century been Christian. Then we wait 400 years more before we find the suggestion repeated. That no use was ever made of such construction of Paul in the whole era of the adjustment of Christianity with heathenism is good evidence that it was never there to begin with. So we shall pass Paul as having in no respect modified the doctrine of divorce laid down by Christ in <a onClick="return mV(\'Mat\',19,\'1-\');">Mt 19</a>.<P>3. Remedies for Marriage Ills:<P>In all civilized countries the machinery of legislation and law can always be open for removal or relief of troubles in marriage without proceeding to its annulment. If a father is cruel to his children, we do not abolish the parental relation, but punish the father for his cruelty. If he deserts his children, we need not assist him to rear other children whom he can desert in turn, but we can punish him for his desertion. What can be done by law in case of parent and child can be done in case of husband and wife. By putting in absolute divorce (frequently for guilty and innocent alike) we invite the very evils we seek to cure. We make it the interest of a dissatisfied party to create a situation that a court will regard as intolerable, and so he or she may go free. Then by affording an easy way out of the troubles of married life we are inviting carelessness about entering marriage. We say by divorce statutes to a young woman: "If your husband deserts you, you may have another. If he is cruel, you may have another. If he fails to support you, you may have another. If he is drunken, you may have another. If he is incompatible or makes you unhappy, you may have another"—and yet others beyond these. When an easy road is thus made out of marriage, will there be proper caution about entering into marriage? By just as much as a crevice for relief of the miseries of married life is opened by divorce, by so much the flood gates are opened into those miseries. The more solemnly society is impressed that the door of marriage does not swing outward as well as inward the more of happiness and blessing will it find in the institution.`<a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>`22';
isbe[2758]='Divorce in the Old Testament`di-vors\':<P>1. Subordinate Position of Woman:<P>Woman, among the Hebrews, as among most nations of antiquity, occupied a subordinate position. Though the Hebrew wife and mother was treated with more consideration than her sister in other lands, even in other Semitic countries, her position nevertheless was one of inferiority and subjection. The marriage relation from the standpoint of Hebrew legislation was looked upon very largely as a business affair, a mere question of property. A wife, nevertheless, was, indeed, in most homes in Israel, the husband\'s "most valued possession." And yet while this is true, the husband was unconditionally and unreservedly the head of the family in all domestic relations. His rights and prerogatives were manifest on every side. Nowhere is this more evident than in the matter of divorce. According to the laws of Moses a husband, under certain circumstances, might divorce his wife; on the other hand, if at all possible, it was certainly very difficult for a wife to put away her husband. Unfortunately a double standard of morality in matters pertaining to the sexes is, at least, as old as Moses (see <span class="noTag">Ex 7-11</span>).<P>2. Law of Divorce: <a onClick="return mV(\'Deu\',24,\'1-4\');">Deuteronomy 24:1-4</a>:<P>The Old Testament law concerning divorce, apparently quite clear, is recorded most fully in <a onClick="return mV(\'Deu\',24,1);">De 24:1</a>ff. A perusal of the commentaries will, nevertheless, convince anyone that there are difficulties of interpretation. The careful reader will notice that the renderings of the King James Version and the Revised Version (British and American) differ materially. the King James Version reads in the second part of <a onClick="return mV(\'Deu\',24,1);">De 24:1</a>: "then let him write a bill," etc., the Revised Version (British and American) has "that he shall write," etc., while the Hebrew original has neither "then" nor "that," but the simple conjunction "and." There is certainly no command in the words of Moses, but, on the other hand, a clear purpose to render the proceeding more difficult in the case of the husband. Moses\' aim was "to regulate and thus to mitigate an evil which he could not extirpate." The evident purpose was, as far as possible, to favor the wife, and to protect her against an unceremonious expulsion from her home and children.<P>3. Marriage a Legal Contract:<P>As already suggested, marriage among the Hebrews, as among most Orientals, was more a legal contract than the result of love or affection. It would be, however, a great mistake to assume that deep love was not often present, for at all times the domestic relations of the Hebrew married couple have compared most favorably with those of any other people, ancient or modern. In its last analysis it was, nevertheless, a business transaction. The husband or his family had, as a rule, to pay a certain dowry to the parents or guardians of the betrothed before the marriage was consummated. A wife thus acquired could easily be regarded as a piece of property, which, without great difficulty, could be disposed of in case the husband, for any reason, were disposed to rid himself of an uncongenial companion and willing to forfeit the mohar which he had paid for his wife. The advantage was always with the husband, and yet a wife was not utterly helpless, for she, too, though practically without legal rights, could make herself so intolerably burdensome and hateful in the home that almost any husband would gladly avail himself of his prerogatives and write her a bill of divorcement. Thus, though a wife could not divorce her husband, she could force him to divorce her.<P>4. Divorce Applicable Only to Wives:<P>The following words of Professor Israel Abrahams, Cambridge, England, before "the Divorce Commission" (London, November 21, 1910), are to the point: "In all such cases where the wife was concerned as the moving party she could only demand that her husband should divorce her. The divorce was always from first to last, in Jewish law, the husband\'s act." The common term used in the Bible for divorce is shilluach \'ishshah, "the sending away of a wife" (<a onClick="return mV(\'Deu\',22,19,29);">De 22:19, 29</a>). We never read of "the sending away of a husband." The feminine participle, gerushah, "the woman thrust out," is the term applied to a divorced woman. The masculine form is not found.<P>5. Process and Exceptions:<P>The Mosaic law apparently, on the side of the husband, made it as difficult as possible for him to secure a divorce. No man could unceremoniously and capriciously dismiss his wife without the semblance of a trial. In case one became dissatisfied with his wife,<P>(1) he had to write her a <span class="noTag">BILL OF DIVORCEMENT</span> (which see below) drawn up by some constituted legal authority and in due legal form. In the very nature of the case, such a tribunal would use moral suasion to induce an adjustment; and, failing in this, would see to it that the law in the case, whatever it might be, would be upheld.<P>(2) Such a bill or decree must be placed in the hand of the divorced wife.<P>(3) She must be forced to leave the premises of her former husband.<p>Divorce was denied two classes of husbands:<P>(1) The man who had falsely accused his wife of antenuptial infidelity (<a onClick="return mV(\'Deu\',22,13);">De 22:13</a>ff), and<P>(2) a person who had seduced a virgin (<a onClick="return mV(\'Deu\',22,28);">De 22:28</a>f). In addition, a heavy penalty had to be paid to the father of such damsels.<P>It is probable that a divorced wife who had not contracted a second marriage or had been guilty of adultery might be reunited to her husband. But in case she had married the second time she was forever barred from returning to her first husband, even if the second husband had divorced her or had died (<a onClick="return mV(\'Deu\',24,3);">De 24:3</a>f). Such a law would serve as an obstacle to hasty divorces. Divorces from the earliest times were common among the Hebrews. All rabbis agree that a separation, though not desirable, was quite lawful. The only source of dispute among them was as to what constituted a valid reason or just cause.<P>6. Grounds of Divorce (Doubtful Meaning of <a onClick="return mV(\'Deu\',24,1);">Deuteronomy 24:1</a>):<P>The language in <a onClick="return mV(\'Deu\',24,1);">De 24:1</a>ff has always been in dispute. The Hebrew words, \'erwath dabhar, on which a correct interpretation depends, are not easy of solution, though many exegetes, influenced possibly by some preconceived notion, pass over them quite flippantly. The phrase troubled the Jewish rabbis of olden times, as it does Jewish and Christian commentators and translators in our day. the King James Version renders the two words, "some uncleanness," and in the margin, "matter of nakedness." The latter, though a literal translation of the Hebrew, is quite unintelligible. the Revised Version (British and American) and the American Standard Revised Version both have: "some unseemly thing." Professor Driver translates the same words "some indecency." The German the Revised Version (British and American) (Kautzsch) has "etwas Widerwartiges" ("something repulsive"). We know of no modern version which makes \'erwath dabhar the equivalent of fornication or adultery. And, indeed, in the very nature of the case, we are forced to make the words apply to a minor fault or crime, for, by the Mosaic law, the penalty for adultery was death (<a onClick="return mV(\'Deu\',22,20);">De 22:20</a>ff). It is, however, a question whether the extreme penalty was ever enforced. It is well known that at, and some time before, the time of our Saviour, there were two schools among the Jewish rabbis, that of Shammai and that of Hillel. Shammai and his followers maintained that \'erwath dabhar signified nothing less than unchastity or adultery, and argued that only this crime justified a man in divorcing his wife. Hillel and his disciples went to the other extreme. They placed great stress upon the words, "if she find no favor in his eyes" immediately preceding \'erwath dabhar (<a onClick="return mV(\'Deu\',24,1);">De 24:1</a>), and contended that divorce should be granted for the flimsiest reason: such as the spoiling of a dish either by burning or careless seasoning. Some of the rabbis boldly taught that a man had a perfect right to dismiss his wife, if he found another woman whom he liked better, or who was more beautiful (Mishnah, gittin, 14 10). Here are some other specifications taken from the same book: "The following women may be divorced: She who violates the Law of Moses, e. g. causes her husband to eat food which has not been tithed...She who vows, but does not keep her vows...She who goes out on the street with her hair loose, or spins in the street, or converses (flirts) with any man, or is a noisy woman. What is a noisy woman? It is one who speaks in her own house so loud that the neighbors may hear her." It would be easy to extend the list, for the Mishna and rabbinic writings are full of such laws.<P>From what has been said, it is clear that adultery was not the only valid reason for divorce. Besides, the word adultery had a peculiar significance in Jewish law, which recognized polygamy and concubinage as legitimate. Thus a Hebrew might have two or more wives or concubines, and might have intercourse with a slave or bondwoman, even if married, without being guilty of the crime of adultery (<a onClick="return mV(\'Lev\',19,20);">Le 19:20</a>), for adultery, according to Jewish law, was possible only when a man dishonored the "free wife" of a Hebrew (<a onClick="return mV(\'Lev\',20,10);">Le 20:10</a>ff).<P>Divorcement, Bill of:<P>This expression, found in <a onClick="return mV(\'Deu\',24,1,3);">De 24:1, 3</a>; <a onClick="return mV(\'Isa\',50,1);">Isa 50:1</a>; <a onClick="return mV(\'Jer\',3,8);">Jer 3:8</a> is the translation of the Hebrew cepher kerithuth. The two words, literally rendered, signify a document or book of cutting off, i.e. a certificate of divorce given by a husband to a wife, so as to afford her the opportunity or privilege of marrying another man. The Hebrew term is rendered by the Septuagint biblion apostasion. This is also found in the New Testament (<a onClick="return mV(\'Mar\',10,4);">Mr 10:4</a>). <a onClick="return mV(\'Mat\',5,31);">Mt 5:31</a> has "writing of divorcement" in English Versions of the Bible, but <a onClick="return mV(\'Mat\',19,7);">Mt 19:7</a> the King James Version has "writing," while the Revised Version (British and American) and the American Standard Revised Version have "bill." The certificate of divorce is called geT, plural gittin, in the Talmud. There is an entire chapter devoted to the subjects in the Mishna It is not positively known when the custom of writing bills of divorcement commenced, but there are references to such documents in the earliest Hebrew legislation. The fact that Joseph had in mind the putting away of his espoused wife, Mary, without the formality of a bill or at least of a public procedure proves that a decree was not regarded as absolutely necessary (<a onClick="return mV(\'Mat\',1,19);">Mt 1:19</a>). The following was the usual form of a decree:<P>On the ____ day of the week ____ in the month ____ in the year ____ from the beginning of the world, according to the common computation in the province of ____ I ____ the son of ____ by whatever name I may be known, of the town of ____ with entire consent of mind, and without any constraint, have divorced, dismissed and expelled thee ____ daughter of____by whatever name thou art called, of the town who hast been my wife hitherto; But now I have dismissed thee ____ the daughter of ____ by whatever name thou art called, of the town of ____ so as to be free at thy own disposal, to marry whomsoever thou pleasest, without hindrance from anyone, from this day for ever. Thou art therefore free for anyone (who would marry thee). Let this be thy bill of divorce from me, a writing of separation and expulsion, according to the law of Moses and Israel. ____, the son of ____, witness<P>Spiritual Application.<P>The Hebrew prophets regarded Yahweh not only as the father and king of the chosen people, and thus entitled to perfect obedience and loyalty on their part, but they conceived of Him as a husband married to Israel. Isaiah, speaking to his nation, says: "For thy Maker is thy husband; Yahweh of hosts is his name" (<a onClick="return mV(\'Isa\',54,5);">54:5</a>). Jeremiah too makes use of similar language in the following: "Return, O backsliding children, saith Yahweh; for I am a husband unto you" (<a onClick="return mV(\'Jer\',3,14);">3:14</a>). It is perfectly natural that New Testament writers should have regarded Christ\'s relation to His church under the same figure. Paul in 2 Corinthians says: "I am jealous over you with a godly jealousy: for I espoused you to one husband, that I might present you as a pure virgin to Christ" (<a onClick="return mV(\'2Cr\',11,2);">11:2</a>); see also <a onClick="return mV(\'Mat\',9,15);">Mt 9:15</a>; <a onClick="return mV(\'Jhn\',3,29);">Joh 3:29</a>; <a onClick="return mV(\'Rev\',19,7);">Re 19:7</a>. Any unfaithfulness or sin on the part of Israel was regarded as spiritual adultery, which necessarily broke off the spiritual ties, and divorced the nation from God (<a onClick="return mV(\'Isa\',1,21);">Isa 1:21</a>; <a onClick="return mV(\'Eze\',16,22);">Eze 16:22</a>; <a onClick="return mV(\'Rev\',2,22);">Re 2:22</a>). See also <a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>.<P>LITERATURE.<P>Amram, Jewish Law of Divorce according to the Bible and Talmud, London, 1897; Abrahams, Jewish Life in the Middle Ages, London, 1896; Mackie, Bible Manners and Customs, London, 1898; The Mishna, Translated into English, De Sola and Raphall, London, 1843; Benzinger, Hebraische Archdalogie, Freiburg, 1894; Nowack, Lehrbuch der hebraischen Archdologie, 1894.``34';
isbe[2759]='Doctor`dok\'-ter: (In <a onClick="return mV(\'Luk\',2,46);">Lu 2:46</a> didaskalos) "doctor" is equivalent to "teacher," which latter is the translation of the Revised Version (British and American). So in <a onClick="return mV(\'Luk\',5,17);">Lu 5:17</a>; <a onClick="return mV(\'Act\',5,34);">Ac 5:34</a>, the King James Version and the Revised Version (British and American) "doctors," "doctor," of the law (nomodidaskalos).`<a href="./study/isbe/search.html?string=EDUCATION">EDUCATION</a>; <a href="./study/isbe/search.html?string=RABBI">RABBI</a>; <a href="./study/isbe/search.html?string=SCRIBES">SCRIBES</a>`1';
isbe[2760]='Doctrine`dok\'-trin: Latin doctrina, from doceo, "to teach," denotes both the act of teaching and that which is taught; now used exclusively in the latter sense.<P>1. Meaning of Terms:<P>(1) In the Old Testament for<P>(a) leqach "what is received," hence, "the matter taught" (<a onClick="return mV(\'Deu\',32,2);">De 32:2</a>; <a onClick="return mV(\'Job\',11,4);">Job 11:4</a>; <a onClick="return mV(\'Pro\',4,2);">Pr 4:2</a>; <a onClick="return mV(\'Isa\',29,24);">Isa 29:24</a>, the American Standard Revised Version "instruction");<P>(b) she-mu\'ah, "what is heard" (<a onClick="return mV(\'Isa\',28,9);">Isa 28:9</a>, the Revised Version (British and American) "message," the Revised Version, margin "report");<P>(c) mucar, "discipline" (<a onClick="return mV(\'Jer\',10,8);">Jet 10:8</a> margin), "The stock is a doctrine" (the Revised Version British and American) "instruction" of vanities, i. e. "The discipline of unreal gods is wood (is like themselves, destitute of true moral force" (BDB)).<P>(2) In the New Testament for<P>(i) didaskalia = <P>(a) "the act of teaching" (<a onClick="return mV(\'1Ti\',4,13,16);">1Ti 4:13, 16</a>; <a onClick="return mV(\'1Ti\',5,17);">5:17</a>; <a onClick="return mV(\'2Ti\',3,10,16);">2Ti 3:10, 16</a>), all in the Revised Version (British and American) "teaching";<P>(b) "what is taught" (<a onClick="return mV(\'Mat\',15,9);">Mt 15:9</a>; <a onClick="return mV(\'2Ti\',4,3);">2Ti 4:3</a>). In some passages the meaning is ambiguous as between (a) and (b).<P>(ii) didache, always translated "teaching" in the Revised Version (British and American), except in <a onClick="return mV(\'Rom\',16,17);">Ro 16:17</a>, where "doctrine" is retained in the text and "teaching" inserted in the margin = <P>(a) the act of teaching (<a onClick="return mV(\'Mar\',4,2);">Mr 4:2</a>; <a onClick="return mV(\'Act\',2,42);">Ac 2:42</a>, the King James Version "doctrine");<P>(b) what is taught (<a onClick="return mV(\'Jhn\',7,16,17);">Joh 7:16-17</a>; <a
