isbe[8355]='Spiritual`spir\'-it-u-al (pneumatikos, "spiritual," from pneuma, "spirit"): Endowed with the attributes of spirit. Any being made in the image of God who is a Spirit (<a onClick="return mV(\'Jhn\',4,24);">Joh 4:24</a>.), and thus having the nature of spirit, is a spiritual being.<P>(1) Spiritual hosts of wickedness (<a onClick="return mV(\'Eph\',6,12);">Eph 6:12</a>), in distinction from beings clothed in "flesh and blood"—the devil and his angels. This use of the word has reference to nature, essence, and not to character or moral quality. God, angels, man, devil, demons are in essence spiritual. The groundwork and faculties of their rational and moral being are the same. This limited use of the word in the New Testament has its adverb equivalent in <a onClick="return mV(\'Rev\',11,8);">Re 11:8</a>, "which (the great and wicked city) spiritually is called Sodom." As the comprehensive term moral includes immoral, so spiritual includes unspiritual and all that pertains to spirit.<P>(2) With the above exception, "spiritual" in the New Testament signifies moral, not physical antithesis: an essence springing from the Spirit of God and imparted to the spirit of man. Hence, spiritual in this sense always presupposes the infusion of the Holy Spirit to quicken, and inform. It is opposed<P>(a) to sarkikos, "fleshly" (<a onClick="return mV(\'1Cr\',3,1);">1Co 3:1</a>), men of the flesh and not of the spirit;<P>(b) to psuchikos, "natural," man in whom the pneuma, "spirit," is over-ridden, because of the Fall, by psuche, the principle of the animal life, "soul"; hence, the unrenewed man, unspiritual, alienated from the life of God (<a onClick="return mV(\'1Cr\',2,14);">1Co 2:14</a>; <a onClick="return mV(\'2Pe\',2,12);">2Pe 2:12</a>; <a onClick="return mV(\'Jud\',1,10);">Jude 1:10</a>). See <a href="./study/isbe/search.html?string=MAN,+NATURAL">MAN, NATURAL</a>;<P>(c) to natural, meaning physical, ".... sown a natural body;...raised a spiritual body" (<a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>).<P>(3) In the New Testament and general use "spiritual" thus indicates man regenerated, indwelt, enlightened, endued, empowered, guided by the Holy Spirit; conformed to the will of God, having the mind of Christ, living in and led by the Spirit. The spiritual man is a new creation born from above (<a onClick="return mV(\'Rom\',8,6);">Ro 8:6</a>; <a onClick="return mV(\'1Cr\',2,15);">1Co 2:15</a>; <a onClick="return mV(\'1Cr\',3,1);">3:1</a>; <a onClick="return mV(\'1Cr\',14,37);">14:37</a>; <a onClick="return mV(\'Col\',1,9);">Col 1:9</a>; <a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>).<P>(4) Ecclesiastically used of things sacred or religious, as spiritual authority, spiritual assembly, spiritual office.`<a href="./study/isbe/search.html?string=SPIRIT">SPIRIT</a>`139';
isbe[8356]='Spiritual Blessing`(eulogia pneumatike): Any blessing administered in the realm of the spiritual life; specifically the blessing of the Spirit in introducing the believer into "the heavenly places in Christ" (<a onClick="return mV(\'Eph\',1,3);">Eph 1:3</a>); a term expressing the fullness of blessing in God\'s gift of eternal life in Jesus Christ.``1';
isbe[8357]='Spiritual Body`(soma pneumatikon, "body spiritual"): The resurrection-body, a body fitted to the capacities and wants of the spirit in the celestial world; an organism conformed to the spiritual life at the resurrection (see <a onClick="return mV(\'1Cr\',15,44);">1Co 15:44</a>).`<a href="./study/isbe/search.html?string=BODY,+SPIRITUAL">BODY, SPIRITUAL</a>`1';
isbe[8358]='Spiritual Drink`(pneumatikon poma): Having a spiritual significance, as referring to the water that flowed miraculously from the smitten rock (<a onClick="return mV(\'1Cr\',10,4);">1Co 10:4</a>; <a onClick="return mV(\'Num\',20,11);">Nu 20:11</a>). Symbolic also of nourishment for the thirsty soul in the sacramental cup and the outpoured blood (life) of Christ.`<a href="./study/isbe/search.html?string=ROCK">ROCK</a>; <a href="./study/isbe/search.html?string=SPIRITUAL+ROCK">SPIRITUAL ROCK</a>`1';
isbe[8359]='Spiritual Gifts`(charismata):<P>1. Gifts Connected with the Ministry of the Word<P class="in15">(1) Apostleship<P class="in15">(2) Prophecy<P class="in15">(3) Discernings of spirits<P class="in15">(4) Teaching<P class="in15">(5) The Word of Knowledge<P class="in15">(6) The Word of Wisdom<P class="in15">(7) Kinds of Tongues<P class="in15">(8) Interpretation of Tongues<P>2. Gifts Connected with the Ministry of Practical Service<P class="in15">(1) Workings of Miracles<P class="in15">(2) Gifts of Healings<P class="in15">(3) Ruling, Governments<P class="in15">(4) Helps<P>LITERATURE<hr /><P>The word charisma, with a single exception (<a onClick="return mV(\'1Pe\',4,10);">1Pe 4:10</a>), occurs in the New Testament only in the Pauline Epistles, and in the plural form is employed in a technical sense to denote extraordinary gifts of the Spirit bestowed upon Christians to equip them for the service of the church. Various lists of the charismata are given (<a onClick="return mV(\'Rom\',12,\'6-8\');">Ro 12:6-8</a>; <a onClick="return mV(\'1Cr\',12,\'4-11\',\'28-30\');">1Co 12:4-11,28-30</a>; compare <a onClick="return mV(\'Eph\',4,\'7-12\');">Eph 4:7-12</a>), none of which, it is evident, are exhaustive. Some of the gifts enumerated cannot be said to belong in any peculiar sense to the distinctive category. "Faith" (<a onClick="return mV(\'1Cr\',12,9);">1Co 12:9</a>), for example, is the essential condition of all Christian life; though there were, no doubt, those who were endowed with faith beyond their fellows. "Giving" and "mercy" (<a onClick="return mV(\'Rom\',12,8);">Ro 12:8</a>) are among the ordinary graces of the Christian character; though some would possess them more than others. "Ministry" (<a onClick="return mV(\'Rom\',12,7);">Ro 12:7</a>), again, i.e. service, was the function to which every Christian was called and the purpose to which every one of the special gifts was to be devoted (<a onClick="return mV(\'Eph\',4,12);">Eph 4:12</a>). The term is applied to any spiritual benefit, as the confirmation of Christians in the faith by Paul (<a onClick="return mV(\'Rom\',1,11);">Ro 1:11</a>). And as the general function of ministry appears from the first in two great forms as a ministry of word and deed (<a onClick="return mV(\'Act\',6,\'1-4\');">Ac 6:1-4</a>; <a onClick="return mV(\'1Cr\',1,17);">1Co 1:17</a>), so the peculiar charismatic gifts which Paul mentions fall into two great classes—those which qualify their possessors for a ministry of the word, and those which prepare them to render services of a practical nature.<P>1. Gifts Connected with the Ministry of the Word:<P>(1) Apostleship<P>(<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>f; compare <a onClick="return mV(\'Eph\',4,11);">Eph 4:11</a>).—The name "apostle" is used in the New Testament in a narrower and a wider sense. It was the peculiar title and privilege of the Twelve (<a onClick="return mV(\'Mat\',10,2);">Mt 10:2</a>; <a onClick="return mV(\'Luk\',6,13);">Lu 6:13</a>; <a onClick="return mV(\'Act\',1,25);">Ac 1:25</a>f), but was claimed by Paul on special grounds (<a onClick="return mV(\'Rom\',1,1);">Ro 1:1</a>; <a onClick="return mV(\'1Cr\',9,1);">1Co 9:1</a>, etc.); it was probably conceded to James the Lord\'s brother (<a onClick="return mV(\'1Cr\',15,7);">1Co 15:7</a>; <a onClick="return mV(\'Gal\',1,19);">Ga 1:19</a>), and in a freer use of the term is applied to Barnabas (<a onClick="return mV(\'Act\',14,4,14);">Ac 14:4,14</a>; compare <a onClick="return mV(\'1Cr\',9,5,6);">1Co 9:5,6</a>), Andronicus and Junias (<a onClick="return mV(\'Rom\',16,7);">Ro 16:7</a>). From the Didache (xi.4ff) we learn that the ministry of apostles was continued in the church into the sub-apostolic age (see <a href="./study/isbe/search.html?string=LITERATURE,+SUB-APOSTOLIC">LITERATURE, SUB-APOSTOLIC</A>). The special gift and function of apostleship, taken in the widest sense, was to proclaim the word of the gospel (<a onClick="return mV(\'Act\',6,2);">Ac 6:2</a>; <a onClick="return mV(\'1Cr\',1,17);">1Co 1:17</a>, etc.), and in particular to proclaim it to the world outside of the church, whether Jewish or Gentile (<a onClick="return mV(\'Gal\',2,7,8);">Ga 2:7,8</a>).<P>See <a href="./study/isbe/search.html?string=APOSTLE">APOSTLE</a>.<P>(2) Prophecy<P>(<a onClick="return mV(\'Rom\',12,6);">Ro 12:6</a>; <a onClick="return mV(\'1Cr\',12,10,28,29);">1Co 12:10,28,29</a>), under which may be included exhortation (<a onClick="return mV(\'Rom\',12,8);">Ro 12:8</a>; compare <a onClick="return mV(\'1Cr\',14,3);">1Co 14:3</a>). The gift of prophecy was bestowed at Pentecost upon the church as a whole (<a onClick="return mV(\'Act\',2,16);">Ac 2:16</a>), but in particular measure upon certain individuals who were distinctively known as prophets. Only a few of the Christian prophets are directly referred to—Judas and Silas (<a onClick="return mV(\'Act\',15,32);">Ac 15:32</a>), the prophets at Antioch (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>), Agabus and the prophets from Jerusalem (<a onClick="return mV(\'Act\',11,27);">Ac 11:27</a>f), the four daughters of Philip the evangelist (<a onClick="return mV(\'Act\',11,9);">Ac 11:9</a>). But 1 Corinthians shows that there were several of them in the Corinthian church; and probably they were to be found in every Christian community. Some of them moved about from church to church (<a onClick="return mV(\'Act\',11,27);">Ac 11:27</a>f; <a onClick="return mV(\'Act\',21,10);">21:10</a>); and in the Didache we find that even at the celebration of the Eucharist the itinerant prophet still takes precedence of the local ministry of bishops and deacons (Didache x.7).<P>It is evident that the functions of the prophet must sometimes have crossed those of the apostle, and so we find Paul himself described as a prophet long after he had been called to the apostleship (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>). And yet there was a fundamental distinction. While the apostle, as we have seen, was one "sent forth" to the unbelieving world, the prophet was a minister to the believing church (<a onClick="return mV(\'1Cr\',14,4,22);">1Co 14:4,22</a>). Ordinarily his message was one of "edification, and exhortation, and consolation" (<a onClick="return mV(\'1Cr\',14,3);">1Co 14:3</a>). Occasionally he was empowered to make an authoritative announcement of the divine will in a particular case (<a onClick="return mV(\'Act\',13,1);">Ac 13:1</a>). In rare instances we find him uttering a prediction of a future event (<a onClick="return mV(\'Act\',11,28);">Ac 11:28</a>; <a onClick="return mV(\'Act\',21,10);">21:10</a>f).<P>(3) Discernings of Spirits<P>With prophecy must be associated the discernings of spirits (<a onClick="return mV(\'1Cr\',12,10);">1Co 12:10</a>; <a onClick="return mV(\'1Cr\',14,29);">14:29</a>; <a onClick="return mV(\'1Th\',5,20);">1Th 5:20</a>f; compare <a onClick="return mV(\'1Jo\',4,1);">1Joh 4:1</a>). The one was a gift for the speaker, the other for those who listened to his words. The prophet claimed to be the medium of divine revelations (<a onClick="return mV(\'1Cr\',14,30);">1Co 14:30</a>); and by the spiritual discernment of his hearers the truth of his claim was to be judged (<a onClick="return mV(\'1Cr\',14,29);">1Co 14:29</a>). There were false prophets as well as genuine prophets, spirits of error as well as spirits of truth (<a onClick="return mV(\'1Jo\',4,\'1-6\');">1Joh 4:1-6</a>; compare <a onClick="return mV(\'2Th\',2,2);">2Th 2:2</a>; Didache xi). And while prophesyings were never to be despised, the utterances of the prophets were to be "proved" (<a onClick="return mV(\'1Th\',5,20);">1Th 5:20</a>f), and that in them which came from the Spirit of God spiritually judged (<a onClick="return mV(\'1Cr\',2,14);">1Co 2:14</a>), and so discriminated from anything that might be inspired by evil spirits.<P>See <a href="./study/isbe/search.html?string=DISCERNINGS+OF+SPIRITS">DISCERNINGS OF SPIRITS</A>.<P>(4) Teaching<P>(<a onClick="return mV(\'Rom\',12,7);">Ro 12:7</a>; <a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>f).—As distinguished from the prophet, who had the gift of uttering fresh truths that came to him by way of vision and revelation, the teacher was one who explained and applied established Christian doctrine—the rudiments and first principles of the oracles of God (<a onClick="return mV(\'Hbr\',5,12);">Heb 5:12</a>).<P>(5) The Word of Knowledge<P>Possibly the word of knowledge (gnosis).<P>(6) The Word of Wisdom<P>The word of wisdom (sophia) (<a onClick="return mV(\'1Cr\',12,8);">1Co 12:8</a>) are to be distinguished, the first as the utterance of a prophetic and ecstatic intuition, the second as the product of study and reflective thought; and so are to be related respectively to the functions of the prophet and the teacher.<P>See <a href="./study/isbe/search.html?string=TEACH,+TEACHER,+TEACHING">TEACHER, TEACHING</A>.<P>(7) Kinds of Tongues<P>(<a onClick="return mV(\'1Cr\',12,10,28,30);">1Co 12:10,28,30</a>).—What Paul means by this he explains fully in <a onClick="return mV(\'1Cr\',14,\'1-\');">1 Corinthians 14</a>. The gift was not a faculty of speaking in unknown foreign languages, for the tongues (glossai) are differentiated from the "voices" or languages (phonai) by which men of one nation are distinguished from those of another (<a onClick="return mV(\'1Cr\',14,10,11);">14:10,11</A>). And when the apostle says that the speaker in an unknown tongue addressed himself to God and not to men (<a onClick="return mV(\'1Cr\',14,2,14);">14:2,14</A>) and was not understood by those who heard him (<a onClick="return mV(\'1Cr\',14,2);">14:2</A>), that he edified himself (<a onClick="return mV(\'1Cr\',14,4);">14:4</A>) and yet lost the power of conscious thought while praying with the spirit (<a onClick="return mV(\'1Cr\',14,14);">14:14</A>f), it would appear that the "tongues" must have been of the nature of devout ejaculations and broken and disjointed words, uttered almost unconsciously under the stress of high ecstatic feeling.<P>(8) Interpretation of Tongues<P>Parallel to this gift was that of the interpretation of tongues (<a onClick="return mV(\'1Cr\',12,10,30);">1Co 12:10,30</a>). If the gift of tongues had been a power of speaking unknown foreign languages, the interpretation of tongues would necessarily have meant the faculty of interpreting a language unknown to the interpreter; for translation from a familiar language could hardly be described as a charisma. But the principle of economy makes it improbable that the edification of the church was accomplished in this round-about way by means of a double miracle—a miracle of foreign speech followed by a miracle of interpretation. If, on the other hand, the gift of tongues was such as has been described, the gift of interpretation would consist in turning what seemed a meaningless utterance into words easy to be understood (<a onClick="return mV(\'1Cr\',12,9);">1Co 12:9</a>). The interpretation might be given by the speaker in tongues himself (<a onClick="return mV(\'1Cr\',12,5,13);">1Co 12:5,13</a>) after his mood of ecstasy was over, as he translated his exalted experiences and broken cries into plain intelligible language. Or, if he lacked the power of self-interpretation, the task might be undertaken by another possessed of this special gift (<a onClick="return mV(\'1Cr\',12,27,28);">1Co 12:27,28</a>). The ability of a critic gifted with sympathy and insight to interpret the meaning of a picture or a piece of music, as the genius who produced it might be quite unable to do (e.g. Ruskin and Turner), will help us to understand how the ecstatic half-conscious utterances of one who had the gift of tongues might be put into clear and edifying form by another who had the gift of interpretation.<P>See <a href="./study/isbe/search.html?string=TONGUES,+GIFT+OF">TONGUES, GIFT OF</A>.<P>2. Gifts Connected with the Ministry of Practical Service:<P>(1) Workings of Miracles<P>(<a onClick="return mV(\'1Cr\',12,10,28,29);">1Co 12:10,28,29</a>).—The word used for miracles in this chapter (dunameis, literally, "powers") is employed in Acts (<a onClick="return mV(\'Act\',8,7,13);">8:7,13</A>; <a onClick="return mV(\'Act\',19,11,12);">19:11,12</A>) so as to cover those cases of exorcism and the cure of disease which in Paul\'s list are placed under the separate category of "gifts of healing." As distinguished from the ordinary healing gift, which might be possessed by persons not otherwise remarkable, the "powers" point to a higher faculty more properly to be described as miraculous, and bestowed only upon certain leading men in the church. In <a onClick="return mV(\'2Cr\',12,12);">2Co 12:12</a> Paul speaks of the "powers" he wrought in Corinth as among "the signs of an apostle." In <a onClick="return mV(\'Hbr\',2,4);">Heb 2:4</a> the writer mentions the "manifold powers" of the apostolic circle as part of the divine confirmation of their testimony. In <a onClick="return mV(\'Rom\',15,18);">Ro 15:18</a>ff Paul refers to his miraculous gifts as an instrument which Christ used for the furtherance of the gospel and the bringing of the Gentiles to obedience. The working of "powers," accordingly, was a gift which linked itself to the ministry of the word in respect of its bearing upon the truth of the gospel and the mission of the apostle to declare it. And yet, like the wider and lower gift of healing, it must be regarded primarily as a gift of practical beneficence, and only secondarily as a means of confirming the truth and authenticating its messenger by way of a sign. The Book of Acts gives several examples of "powers" that are different from ordinary healings. The raising of Dorcas (<a onClick="return mV(\'Act\',9,36);">9:36</A>ff) and of Eutychus (<a onClick="return mV(\'Rom\',20,9);">20:9</A>ff) clearly belong to this higher class, and also, perhaps, such remarkable cures as those of the life-long cripple at the Temple gate (<a onClick="return mV(\'Act\',3,1);">3:1</A>ff) and Aeneas of Lydda (<a onClick="return mV(\'Act\',9,32);">9:32</A>ff).<P>(2) Gifts of Healings<P>(<a onClick="return mV(\'1Cr\',12,9,28,30);">1Co 12:9,28,30</a>).<P>See <a href="./study/isbe/search.html?string=HEALING,+GIFTS+OF">HEALING, GIFTS OF</A>.<P>(3) Ruling, Governments<P>(<a onClick="return mV(\'Rom\',12,8);">Ro 12:8</a>, <a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>).—These were gifts of wise counsel and direction in the practical affairs of the church, such as by and by came to be formally entrusted to presbyters or bishops. When Paul wrote to the Corinthians, the ministry of office had not yet supplanted the ministry of inspiration, and Christian communities were guided and governed by those of their members whose wisdom in counsel proved that God through His Spirit had bestowed upon them the gift of ruling.<P>(4) Helps<P>(<a onClick="return mV(\'1Cr\',12,28);">1Co 12:28</a>).—This has sometimes been understood to denote the lowliest Christian function of all in Paul\'s list, the function of those who have no pronounced gifts of their own and can only employ themselves in services of a subordinate kind. But the usage of the Greek word (antilempsis) in the papyri as well as the Septuagint points to succor rendered to the weak by the strong; and this is confirmed for the New Testament when the same Greek word in its verbal form (antilambano) is used in <a onClick="return mV(\'Act\',20,35);">Ac 20:35</a>, when Paul exhorts the elders of the Ephesian church to follow his example in helping the weak. Thus, as the gift of government foreshadowed the official powers of the presbyter or bishop, the gift of helps appears to furnish the germ of the gracious office of the deacon—the "minister" par excellence, as the name diakonos denotes—which we find in existence at a later date in Philippi and Ephesus (<a onClick="return mV(\'Phl\',1,1);">Php 1:1</a>; <a onClick="return mV(\'1Ti\',3,\'1-13\');">1Ti 3:1-13</a>), and which was probably created, on the analogy of the diakonia of the Seven in Jerusalem (<a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>), as a ministry, in the first place, to the poor.<P>See, further, <a href="./study/isbe/search.html?string=HELPS">HELPS</A>.<P>LITERATURE. Hort, Christian Ecclesia, Lect X; Neander, Hist of the Planting of the Christian Church, I, 131ff; Weizsacker, Apostolic Age, II, 255-75; Lindsay, Church and Ministry, passim; EB, IV, article "Spiritual Gifts"; ERE, III, article "Charismata"; PRE, VI, article "Geistesgaben."``94';
isbe[8360]='Spiritual House`(oikos pneumatikos, "house spiritual"): A body of Christians (a church), as pervaded by the Spirit and power of God (<a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>); a term applicable to God\'s house: "house of prayer," the temple (<a onClick="return mV(\'Mat\',21,13);">Mt 21:13</a>); to heaven: "my Father\'s house" (<a onClick="return mV(\'Jhn\',14,2);">Joh 14:2</a>); to the tabernacle: "Moses...faithful in all his house" (<a onClick="return mV(\'Hbr\',3,2);">Heb 3:2</a>); to saints: as "the household of God" (<a onClick="return mV(\'Eph\',2,19);">Eph 2:19</a>), and "the temple of the Holy Spirit" (<a onClick="return mV(\'1Cr\',6,19);">1Co 6:19</a>); hence, any "habitation of God in the spirit" (<a onClick="return mV(\'Eph\',2,22);">Eph 2:22</a>) in which His glory dwells and His power and grace are manifest.``1';
isbe[8361]='Spiritual Man`(ho pneumatikos): In distinction from the natural, the unrenewed man (<a onClick="return mV(\'1Cr\',2,15);">1Co 2:15</a>); man in whom the Holy Spirit dwells and rules. This divine indwelling insures mental illumination: "He that is spiritual discerneth (AVm) (or interpreteth) all things"; moral renewal: "a new creature" (<a onClick="return mV(\'2Cr\',5,17);">2Co 5:17</a>); "a new man" (<a onClick="return mV(\'Eph\',4,24);">Eph 4:24</a>); spiritual enduement: "Ye shall receive power" (<a onClick="return mV(\'Act\',1,8);">Ac 1:8</a>).`<a href="./study/isbe/search.html?string=SPIRITUAL">SPIRITUAL</a>; <a href="./study/isbe/search.html?string=SPIRITUALITY">SPIRITUALITY</a>; <a href="./study/isbe/search.html?string=MAN">MAN</a>`1';
isbe[8362]='Spiritual Meat`(broma pneumatikon, "food spiritual"): Nourishment for the soul, referring specifically (<a onClick="return mV(\'1Cr\',10,3);">1Co 10:3</a>) to the manna by which the children of Israel were miraculously fed and which was made by Paul prophetically equivalent to the broken bread of the Christian sacrament symbolizing the body of Christ. Hence,<P>(1) Christ Himself as the food of the soul: "I am the bread of life" (<a onClick="return mV(\'Jhn\',6,\'48-58\');">Joh 6:48-58</a>);<P>(2) anything that nourishes the spiritual life:<P>(a) obedience to the will of God: "My meat is to do the will of him that sent me" (<a onClick="return mV(\'Jhn\',4,\'32-34\');">Joh 4:32-34</a>);<P>(b) the truths of God in the Scriptures: "Word of righteousness" = "strong meat" (<a onClick="return mV(\'Hbr\',5,\'12-14\');">Heb 5:12-14</a>); "word of God" (<a onClick="return mV(\'Mat\',4,4);">Mt 4:4</a>);<P>(c) the things of the Spirit (<a onClick="return mV(\'1Cr\',3,\'1-2\');">1Co 3:1-2</a>; compare <a onClick="return mV(\'1Cr\',2,\'1-\');">1Co 2</a>).``139';
isbe[8363]='Spiritual Rock`(pneumatike petra): Having a spiritual significance: supernatural, manifesting the power of the Divine Spirit; allegorically applied to Christ as fulfilling the type in the smitten rock in the desert, from which water miraculously burst forth to nourish the Israelites. A tradition current among the Jews affirms that this rock followed the people in their journeyings and gave forth a living stream for their supply. Paul made this ever-flowing rock a beautiful and accurate symbol of Christ: "The rock was Christ" (<a onClick="return mV(\'1Cr\',10,4);">1Co 10:4</a>).<P>Without the characterizing word "spiritual," this figurative term, with the same significance, is common to the Scriptures; applied<P>(1) to Yahweh, God: "Rock of his salvation," "their rock is not as our Rock" (<a onClick="return mV(\'Deu\',32,15,31);">De 32:15,31</a>); "Yahweh is my rock" (<a onClick="return mV(\'Psa\',18,2);">Ps 18:2</a>; compare <a onClick="return mV(\'Isa\',26,4);">Isa 26:4</a>; <a onClick="return mV(\'Isa\',32,2);">32:2</a>; <a onClick="return mV(\'1Sa\',2,2);">1Sa 2:2</a>; <a onClick="return mV(\'2Sa\',22,2);">2Sa 22:2</a>);<P>(2) to the foundation-stone of Christian confession and testimony (<a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>; compare <a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>; <a onClick="return mV(\'1Cr\',3,11);">1Co 3:11</a>; <a onClick="return mV(\'1Pe\',2,\'6-8\');">1Pe 2:6-8</a>), and thus to Christ Himself;<P>(3) in Christian hymnology to Jesus crucified and spear-pierced: "Rock of ages, cleft for me."``139';
isbe[8364]='Spiritual Sacrifice`pneumatikai thusiai): A figure taken from the victim slain and offered on the altar, as e.g. the paschal lamb; thus signifying the complete and acceptable offering of the self-dedicated spirit. As the temple, priesthood and God Himself are spiritual, so is the sacrifice of the consecrated believer (<a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>); compare "living sacrifice" (<a onClick="return mV(\'Rom\',12,1);">Ro 12:1</a>); "sacrifice of praise" (<a onClick="return mV(\'Hbr\',13,15,16);">Heb 13:15,16</a>). Any self-dedicating act of the inner man; the devout, renewed, consecrated spirit, e.g. Christian benevolence (<a onClick="return mV(\'Phl\',4,18);">Php 4:18</a>); "to do good and to communicate" (<a onClick="return mV(\'Hbr\',13,16);">Heb 13:16</a>); "mercy" and "knowledge of God," instead of material and outward sacrifice (<a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>). This is defined and beautifully illustrated in the classic verse on this theme, "The sacrifices of God are a broken spirit," etc. (<a onClick="return mV(\'Psa\',51,17);">Ps 51:17</a>).``139';
isbe[8365]='Spiritual Songs`(odai pneumatikai): ode, English "ode," is the general, and generic word for "song," of which "psalms and hymns" are specific varieties (<a onClick="return mV(\'Eph\',5,19);">Eph 5:19</a>; <a onClick="return mV(\'Col\',3,16);">Col 3:16</a>). It includes all lyric poetry, but is limited by the word "spiritual" to songs inspired by the Holy Spirit and employed in the joyful and devotional expression of the spiritual life. While songs, like psalms and hymns, were used in public worship and praise, they were more intended for, and suited to, personal and private and social use; as, e.g. in family worship, at meals, in the agapai ("love-feasts"), in meetings for prayer and religious intercourse from house to house. The passages above cited give apostolic authority for the use of other than the Old Testament psalms in public praise, and rebuke the narrowness and unbelief that would forever limit the operations of the Holy Spirit and the hymnology of the church to the narrow compass of the Davidic era and the Davidic school of poetry and song.<P>The "new song" of <a onClick="return mV(\'Rev\',5,9);">Re 5:9</a>; <a onClick="return mV(\'Rev\',14,3);">14:3</a>, and "the song of Moses and of the Lamb" (<a onClick="return mV(\'Rev\',15,3);">15:3</A>), indicate that spiritual songs are to be perpetuated in the eternal melodies of the redeemed.``139';
isbe[8366]='Spiritual Things`(ta pneumatika): Things proceeding from the Holy Spirit and pertaining to man\'s spiritual life, worship, service. Contrasted in <a onClick="return mV(\'1Cr\',9,11);">1Co 9:11</a> and in <a onClick="return mV(\'Rom\',15,27);">Ro 15:27</a> with ta sarkika, things fleshly, physical, which have to do with man\'s sensuous, corporeal nature, such as food, raiment, money. By "spiritual things" Paul signifies the benefits accompanying salvation, the gifts of the Spirit—faith, hope, love, justification, sanctification, peace—all the fruits and blessings and aids of the regenerate life.<P>Ecclesiastically:<P>Things pertaining to spiritual office, the ministry of the Word, or the service of the sanctuary.``139';
isbe[8367]='Spirituality`spir-it-u-al\'-i-ti: The state of being spiritual in the higher use of the word. It is purely a religious term and signifies the state of a soul vitalized by the Divine Spirit and made alive unto God. It covers the entire range of man\'s faculties: intellect, feeling, will—all the attributes of personality.<P>1. Intellect:<P>The intellectual can be divorced from the spiritual, but the spiritual can never be divorced from the intellectual. If a man is spiritual, his intellect is touched with the divine life and comes under the power of the divine baptism. One word describes this mental quickening and illumination—"vision." "The pure in heart shall see God." Paul affirms (<a onClick="return mV(\'1Cr\',2,12,13);">1Co 2:12,13</a>) that the Spirit of God operates directly on the mental faculties, adjusting reason and intellect to the divine reason, and enabling man to think God\'s thoughts and discern His purposes, nature and will. The common use of the word "spirituality" limits it mistakenly to religious experience, narrowly interpreted, but as spirituality brings the intellect into harmony with the divine reason in every realm of mental action, it may be as manifest in science, art, philosophy, commerce and law as in religion.<P>2. Affections:<P>The feelings and emotions are fertile soil for the spiritual life. Love is the beginning and end of true religion. Spirituality in the realm of the affections is that state of soul in which the heart with its holiest love is centered on God as revealed in Christ. The specific and supreme work of the Holy Spirit is to shed abroad God\'s love in the heart (<a onClick="return mV(\'Rom\',5,5);">Ro 5:5</a>). Spirituality sets the affections on things above and brings the entire emotional nature under the regulating and redeeming sway of the Holy Spirit.<P>3. Will:<P>A spiritually-minded man is one whose will is set on God as well as his intellect and affections. In every fiber of his moral being, and in all the activities of his soul, he is under the guidance and dominion of the Holy Spirit. The affections present motives, the intellect estimates their worthiness, the will decides upon the course of action. When this trinity of mental operation—necessary to normal manhood—is under the sway of the Divine Spirit, man possesses spirituality, a state in which all the faculties of the soul are voluntarily and joyfully under the dominion and guidance of Christ\'s indwelling Spirit. When intellect, heart and will focus their energies reverently and affectionately upon Him, love—a passionate, ever-present, everdominant love—is the result. This is the triune sphere of the Holy Spirit\'s indwelling and activity, and the character of such a God-centered and Spirit-filled life is described by the exalted word "spirituality."``139';
isbe[8368]='Spiritually`spir\'-it-u-al-i (pneumatikos): As in <a onClick="return mV(\'1Cr\',2,14);">1Co 2:14</a>, "spiritually judged," i.e. by means of the spirit renewed and enlightened by the spirit of God; having the mind of the Spirit is to be spiritually-minded (compare the King James Version and the Revised Version (British and American) <a onClick="return mV(\'Rom\',8,6);">Ro 8:6</a>).<P>Allegorically used also (<a onClick="return mV(\'Rev\',11,8);">Re 11:8</a>) to characterize, in a bad sense, the qualities of the spiritual (i.e. the spirit\'s) life: "which spiritually is called Sodom."`<a href="./study/isbe/search.html?string=SPIRITUAL">SPIRITUAL</a>`1';
isbe[8369]='Spit; Spittle`spit, spit\'-l (yaraq, roq; (em)ptuo): Spitting in a person\'s face indicated gross contempt (<a onClick="return mV(\'Num\',12,14);">Nu 12:14</a>; <a onClick="return mV(\'Deu\',25,9);">De 25:9</a>; <a onClick="return mV(\'Job\',30,10);">Job 30:10</a>; <a onClick="return mV(\'Isa\',50,6);">Isa 50:6</a>; <a onClick="return mV(\'Mat\',26,67);">Mt 26:67</a>; <a onClick="return mV(\'Mat\',27,30);">27:30</a>, etc.); when performed by an unclean person it produced defilement (<a onClick="return mV(\'Lev\',15,8);">Le 15:8</a>) which necessitated washing the clothes and a bath. When David allowed his spittle (rir) to run down over his beard, it was his purpose to behave like a lunatic (<a onClick="return mV(\'1Sa\',21,13);">1Sa 21:13</a>). "Till I swallow down my spittle" (<a onClick="return mV(\'Job\',7,19);">Job 7:19</a>) has the same import as the English "in the twinkling of an eye" (<a onClick="return mV(\'1Cr\',15,52);">1Co 15:52</a>). Spittle was used by our Lord in restoring sight and speech (<a onClick="return mV(\'Mar\',7,33);">Mr 7:33</a>; <a onClick="return mV(\'Jhn\',9,6);">Joh 9:6</a>) as signifying His will to cure. It was a widespread belief that spittle, accompanied with magical formulas, possessed medicinal qualities. "Oil" possessed a similar virtue. (<a onClick="return mV(\'Mar\',6,13);">Mr 6:13</a>; <a onClick="return mV(\'Jam\',5,14);">Jas 5:14</a>).``103';
isbe[8370]='Spoil`spoil.`<a href="./study/isbe/search.html?string=BOOTY">BOOTY</a>; <a href="./study/isbe/search.html?string=WAR">WAR</a>`1';
isbe[8371]='Spoiler`spoil\'-er (ha-shodhedh, "the spoiler"): A favorite expression of the prophet Jeremiah by which he describes generally the enemies that invade and devastate a country—with special reference to enemies that invade Judah (<a onClick="return mV(\'Jer\',12,12);">Jer 12:12</a>; <a onClick="return mV(\'Jer\',15,8);">15:8</a>); to enemies who devastate Moab (<a onClick="return mV(\'Jer\',48,8,18);">48:8,18</a>); to enemies from the north who are to assail Babylon (<a onClick="return mV(\'Jer\',51,48);">51:48</a>), and in one case (<a onClick="return mV(\'Jer\',6,26);">6:26</A>) to Nebuchadrezzar making an irresistible advance upon Jerusalem. the American Standard Revised Version uniformly renders "destroyer."``1';
isbe[8372]='Spoke`spok (<a onClick="return mV(\'1Ki\',7,33);">1Ki 7:33</a>).`<a href="./study/isbe/search.html?string=SEA,+THE+MOLTEN">SEA, THE MOLTEN</a>`1';
isbe[8373]='Sponge`spunj (spoggos): The word "sponge," the King James Version "spunge," occurs only in the accounts of our Lord\'s crucifixion in <a onClick="return mV(\'Mat\',27,48);">Mt 27:48</a>; <a onClick="return mV(\'Mar\',15,36);">Mr 15:36</a>; <a onClick="return mV(\'Jhn\',19,29);">Joh 19:29</a>. Sponges have been known from the earliest periods. They are mentioned by Homer, Aeschylus, Aristophanes and other ancient writers. The sponge fisheries of the Eastern Mediterranean are still among the most important in the world. Sponges are animals of a very simple organization, fixed to rocks or other objects in the sea or in fresh water. The marketable sponge consists of a mass of soft interlacing fibers which constituted the skeleton of the living animal. The sponge fishers of the Levant dive from boats, with or without diving apparatus, and tear the sponges from the rocks with their hands. The sponges are allowed to die and rot in the air and are then thoroughly washed until nothing but the skeleton remains. Sponges which have calcareous or silicious skeletons are unfit for use.``37';
isbe[8374]='Spoon`spoon (kaph; Septuagint thuiske, except in <a onClick="return mV(\'Jer\',52,18);">Jer 52:18</a>, where it is kreagra, literally, "fork"): A hollow vessel, a censer; a small vessel in which incense was to be burnt, as is seen from the account given in <a onClick="return mV(\'Num\',7,\'1-\');">Nu 7</a> of the oblations of the princes of the tribes after the setting-up of the tabernacle. Beginning with <a onClick="return mV(\'Num\',7,14);">7:14</A>, we meet at every succeeding 6th verse the statement, "one golden spoon of ten shekels, full of incense," till at <a onClick="return mV(\'Num\',7,86);">7:86</a> the summary statement is made, "the twelve golden spoons, full of incense."``1';
isbe[8375]='Sports`sports.`<a href="./study/isbe/search.html?string=GAMES">GAMES</a>`1';
isbe[8376]='Spot; Spotted`spot, spot\'-ed (mum; spilos): The Hebrew word is used to denote a blemish which mars the perfection of the face, as in <a onClick="return mV(\'Sgs\',4,7);">So 4:7</a>; <a onClick="return mV(\'Job\',11,15);">Job 11:15</a>. It is translated "blemish" in <a onClick="return mV(\'Lev\',24,19);">Le 24:19</a>f; where it means an injury the result of violence, and is rendered "blot" in <a onClick="return mV(\'Pro\',9,7);">Pr 9:7</a>, where it signifies "shame" or "disgrace." The "spotted" cattle of <a onClick="return mV(\'Gen\',30,\'32-39\');">Ge 30:32-39</a> are animals of variegated color (Tala\'; compare <a onClick="return mV(\'Eze\',16,16);">Eze 16:16</a>, "decked with divers colors"; <a onClick="return mV(\'Jos\',9,5);">Jos 9:5</a>, "patched"). For chabharburah in <a onClick="return mV(\'Jer\',13,23);">Jer 13:23</a>, see <a href="./study/isbe/search.html?string=LEOPARD">LEOPARD</A>. Spilos is used in the figurative sense of a stain of sin in <a onClick="return mV(\'2Pe\',3,14);">2Pe 3:14</a>, and similarly along with rhutis ("a wrinkle") in <a onClick="return mV(\'Eph\',5,27);">Eph 5:27</a>. The "garment spotted (verb, spiloomai) by the flesh" of <a onClick="return mV(\'Jud\',1,23);">Jude 1:23</a> is, as Calvin has para-phrased it, anything that in any way savors of sin or temptation. The "spots" of <a onClick="return mV(\'Jud\',1,12);">Jude 1:12</a> the King James Version are spilades, "hidden (sunken) rocks" which are betrayed by the surf beating over them (as in Homer Od. iii.298), and are so rendered in the Revised Version (British and American). "Spot" in <a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a> is referred to under <a href="./study/isbe/search.html?string=FRECKLED+SPOT">FRECKLED SPOT</A>; <a href="./study/isbe/search.html?string=LEPROSY">LEPROSY</A>; <a href="./study/isbe/search.html?string=TETTER">TETTER</A>.<P>"Without spot" in <a onClick="return mV(\'Num\',19,2);">Nu 19:2</a>, etc., is tamim, a usual word for "perfect" (so the Revised Version margin); aspilos (the negative form of spilos) occurs in <a onClick="return mV(\'1Ti\',6,14);">1Ti 6:14</a>; <a onClick="return mV(\'1Pe\',1,19);">1Pe 1:19</a>; <a onClick="return mV(\'2Pe\',3,14);">2Pe 3:14</a>, with <a onClick="return mV(\'Jam\',1,27);">Jas 1:27</a> ("unspotted"). For the King James Version <a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a> see <a href="./study/isbe/search.html?string=BLEMISH">BLEMISH</A>.``107';
isbe[8377]='Spouse`spouz (kallah, "bride," "daughter-in-law"): the Revised Version (British and American) gives "bride" for the King James Version "spouse" in <a onClick="return mV(\'Sgs\',4,8);">So 4:8</a>ff, and "brides" for "spouses" in <a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>f (margin "daughters-in-law").`<a href="./study/isbe/search.html?string=ESPOUSAL">ESPOUSAL</a>; <a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>; <a href="./study/isbe/search.html?string=RELATIONSHIPS,+FAMILY">RELATIONSHIPS, FAMILY</a>`1';
isbe[8378]='Spread; Spreading`spred, spred\'-ing: Alone, or in phrases like "spread abroad," "spread forth," etc., "spread" represents very many Hebrew terms, principally paras; in the New Testament the act of spreading is stronnumi, where in <a onClick="return mV(\'Mat\',21,8);">Mt 21:8</a> b the King James Version has "<a href="./study/isbe/search.html?string=STRAWED">strawed</a>" (which see); compound in <a onClick="return mV(\'Luk\',19,36);">Lu 19:36</a>. For "spread abroad" in <a onClick="return mV(\'Mar\',1,28);">Mr 1:28</a>; <a onClick="return mV(\'1Th\',1,8);">1Th 1:8</a> (exerchomai), the Revised Version (British and American) has "went out" and "gone forth"; conversely, the Revised Version (British and American) has "spread abroad" for the King James Version "break forth" (<a onClick="return mV(\'Isa\',54,3);">Isa 54:3</a>,), and "published" (diaphero, <a onClick="return mV(\'Act\',13,49);">Ac 13:49</a>), and for "commonly reported" (diaphemizo, <a onClick="return mV(\'Mat\',28,15);">Mt 28:15</a>).``1';
isbe[8379]='Spring``<a href="./study/isbe/search.html?string=FOUNTAIN">FOUNTAIN</a>; <a href="./study/isbe/search.html?string=WELL">WELL</a>`1';
isbe[8380]='Sprinkle; Sprinkling`sprin\'-k\'-l, sprin\'-kling (zaraq, nazah; rhantizein): The first word means "to toss" or "scatter abundantly," e.g. in handfuls, as dust on the head (<a onClick="return mV(\'Job\',2,12);">Job 2:12</a>) or blood from a bowl (<a onClick="return mV(\'Exd\',9,8);">Ex 9:8</a>). The other Hebrew word is used of sprinkling with the finger (<a onClick="return mV(\'Lev\',14,7);">Le 14:7</a>; <a onClick="return mV(\'Lev\',16,14);">16:14</a>, etc.). In the account of Jezebel\'s death the word is used in its literal meaning of "spurt" (<a onClick="return mV(\'2Ki\',9,33);">2Ki 9:33</a>).<P>Sprinkling (blood, water, oil) formed an important—if not the essential—part of the act of sacrifice. A consideration of the chief passages in the Old Testament will reveal the prominence and the significance of sprinkling as a feature of the sacrificial act. The significance of the sprinkling of blood is seen in the account of the establishment of the covenant between Yahweh and Israel (<a onClick="return mV(\'Exd\',24,\'6-8\');">Ex 24:6-8</a>). Half the blood was sprinkled on the altar as representing the Deity, while the remainder was put into a basin and then sprinkled on the people. This ceremony is a survival in a modified form of the communal meal in which the tribal god and his worshippers sat together and participated in the same food, and in this way came to possess the same life. The two-fold sprinkling of blood resulted in the establishment of an inviolable bond (<a onClick="return mV(\'Num\',18,17);">Nu 18:17</a>; <a onClick="return mV(\'2Ki\',16,15);">2Ki 16:15</a>). In the account of the consecration of Aaron and his sons (<a onClick="return mV(\'Exd\',29,16,20,21);">Ex 29:16,20,21</a>) the blood of the ram of the burnt offering was sprinkled on the altar, while the blood of the ram of consecration was put on the altar and sprinkled on Aaron and his sons and on their garments. Water of purifying was sprinkled on the Levites at their ordination (<a onClick="return mV(\'Num\',8,7);">Nu 8:7</a>). Leviticus gives detailed information in regard to sacrificial sprinkling. In the case of burnt offering the blood was sprinkled round about upon the altar (<a onClick="return mV(\'Lev\',1,5,11);">Le 1:5,11</a>). The same practice obtained in the case of peace offerings, whether ox, lamb or goat (<a onClick="return mV(\'Lev\',3,2,8,13);">Le 3:2,8,13</a>). When a sin offering for sins inadvertently committed was made, the priest dipped his fingers in the blood and sprinkled it seven times before Yahweh, before the veil of the Holy Place (<a onClick="return mV(\'Lev\',4,6);">Le 4:6</a>). Elsewhere (<a onClick="return mV(\'Lev\',16,11,15);">Le 16:11,15</a>) we read that Aaron took the blood of the sin offering and sprinkled it with his finger upon the mercy-seat, eastward, 7 times (see also <a onClick="return mV(\'Num\',19,4);">Nu 19:4</a>). Sprinkling constituted part of the process of purification. But it is obvious that the sprinkling, even in this case, was a religious act, and not part of the actual physical cleaning. A simple kind of sprinkler was made by fastening a bunch of hyssop to a cedar rod by a piece of scarlet thread or wool and then the patient was besprinkled 7 times (<a onClick="return mV(\'Lev\',14,7);">Le 14:7</a>), while oil was sprinkled with the finger, also 7 times, before Yahweh (<a onClick="return mV(\'Lev\',14,16);">Le 14:16</a>; see also <a onClick="return mV(\'Exd\',12,22);">Ex 12:22</a>; <a onClick="return mV(\'Num\',19,18);">Nu 19:18</a>; <a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a>). The house in which the leper lived was disinfected in the same thorough manner (<a onClick="return mV(\'Lev\',14,51);">Le 14:51</a>).<P>In the case of persons who had contracted uncleanness through contact with a corpse, sprinkling with the "water of separation" was part of the process of cleansing. The water of separation consisted of the ashes of a red heifer (slain for the purpose) mixed with running water (<a onClick="return mV(\'Num\',19,\'1-\');">Nu 19</a>). A sprinkler was used as in the case of the leper (<a onClick="return mV(\'Num\',19,18);">Nu 19:18</a>). The final sprinkling—on the 7th day—was followed by a bath (<a onClick="return mV(\'Num\',19,19);">Nu 19:19</a>). The "tent" in which the corpse lay, together with all the contents, were thoroughly disinfected.<P>See <a href="./study/isbe/search.html?string=HEIFER,+RED">HEIFER, RED</A>.<P>According to Exodus (<a onClick="return mV(\'Exd\',9,8,10;">9:8,10</a>) the plague of "boils and blains" was caused through the sprinkling of ashes ("soot" the Revised Version margin) in the air toward heaven, which settled on man and beast and produced the eruption. The narrative gives no clue in reference to the connection between the ashes and the eruption, but the religious character of the act is obvious. By means of it, the assistance of the Deity was invoked. According to primitive thought, there was no necessary connection between the religious act and the consummation devoutly wished for. The purpose of the religious observance was to influence, or bring pressure to bear upon, the Deity so that He might exert Himself on behalf of the worshipper. It is evident that sprinkling as part of the act of worship was believed to be religiously effectual. It was not symbolical nor morally significant. It was a religious act. It is not denied that in some passages sprinkling is symbolical. According to Ezekiel (<a onClick="return mV(\'Eze\',36,25);">36:25</a>) the restored community will experience moral and spiritual renewal. There will be a "new heart" and a "new spirit." The sprinkling with clean water is the outward symbol of the inward lustration. In <a onClick="return mV(\'Isa\',63,3);">Isa 63:3</a> the sacrificial allusion is obvious. The conqueror who strides triumphantly from Bozrah is "besprinkled" with the life-blood (or juice) of his victims. In <a onClick="return mV(\'Isa\',52,15);">Isa 52:15</a> "sprinkle" is a doubtful rendering. There is no apparent connection between bodily disfigurement and national purification. the Revised Version margin renders "startle" (literally, "cause to spring"). The exalted dignity of the "martyr" will excite the wonder of kings and peoples.<P>In <a onClick="return mV(\'1Pe\',1,2);">1Pe 1:2</a>, "sprinkling of the blood of Jesus Christ" is used figuratively of its cleansing efficacy (compare <a onClick="return mV(\'Hbr\',9,13,14);">Heb 9:13,14</a>; <a onClick="return mV(\'Hbr\',10,22);">10:22</a>).``103';

isbe[8383]='Stachys`sta\'-kis (Stachus): The name of a Roman Christian to whom Paul sent greetings. The name is Greek and uncommon; it has been found in inscriptions connected with the imperial household. Paul designates him "my beloved" (<a onClick="return mV(\'Rom\',16,9);">Ro 16:9</a>).``1';
isbe[8384]='Stack`stak: <a onClick="return mV(\'Exd\',22,6);">Ex 22:6</a> the King James Version, the Revised Version (British and American) "shocks" (of grain).``1';
isbe[8385]='Stacte`stak\'-te (nataph, "drops" (<a onClick="return mV(\'Job\',36,27);">Job 36:27</a>); stakte, meaning "oozing out in drops"): One of the ingredients of the holy ointment (<a onClick="return mV(\'Exd\',30,34);">Ex 30:34</a>; Ecclesiasticus 24:15, margin "opobalsamum," the King James Version "storax"). The marginal reading is a concession to Jewish tradition, but see <a href="./study/isbe/search.html?string=SPICE">SPICE, (1)</a>. Dioscorides describes two kinds of stacte, one of pure myrrh and one of storax and a fat mixed. See <a href="./study/isbe/search.html?string=MYRRH">MYRRH</A>. This nataph must have been either myrrh "in drops," as it is collected, or some other fragrant gum, similarly collected, such, for example, as gum tragacanth.``1';
isbe[8386]='Staff`staf: Many Hebrew terms are represented by this word. The "staves" of the ark translate the word badh, literally, "a part," hence, branch, bar, etc. (<a onClick="return mV(\'Exd\',25,13,14,15,27,28);">Ex 25:13,14,15,27,28</a>, etc.). Other words, as matteh, maqqel, shebhet, used of the staff in the hand, the shepherd\'s staff, figuratively, "staff of bread" (matteh, <a onClick="return mV(\'Eze\',4,16);">Eze 4:16</a>; <a onClick="return mV(\'Eze\',5,16);">5:16</a>; <a onClick="return mV(\'Eze\',14,13);">14:13</a>), as indispensable for support of life, are dealt with under <a href="./study/isbe/search.html?string=ROD">ROD</a> (which see). The New Testament word is rhabdos (<a onClick="return mV(\'Mat\',10,10);">Mt 10:10</a> parallel <a onClick="return mV(\'Luk\',9,3);">Lu 9:3</a>; <a onClick="return mV(\'Hbr\',11,21);">Heb 11:21</a>).`<a href="./study/isbe/search.html?string=SCEPTRE">SCEPTRE</a>`1';
isbe[8387]='Stair`star.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[8388]='Stake`stak: <a onClick="return mV(\'Isa\',33,20);">Isa 33:20</a>; <a onClick="return mV(\'Isa\',54,2);">54:2</a> for yathedh, "tent-pin," or, perhaps, "tent-pole" (<a onClick="return mV(\'Exd\',27,19);">Ex 27:19</a>; <a onClick="return mV(\'Jdg\',4,21);">Jud 4:21</a>, etc.). The King James Version Sirach 43:19, "The hoar frost,...being congealed, lieth on the top of sharp stakes," is of course meaningless. the Revised Version (British and American) "When it is congealed, it is as points of thorns" renders the Greek very exactly, but the Hebrew would indicate for the original meaning "forms frost-flowers of sapphire."``1';
isbe[8389]='Stalk`stok: In <a onClick="return mV(\'Gen\',41,5,22);">Ge 41:5,22</a> is for qaneh, "cane"; in <a onClick="return mV(\'Jos\',2,6);">Jos 2:6</a> for ets, "wood." In <a onClick="return mV(\'Hsa\',8,7);">Ho 8:7</a>, the Revised Version margin has "stalk" for qamah, "that which stands." The Revised Version\'s "standing grain" is due to this meaning of qamah in <a onClick="return mV(\'Exd\',22,6);">Ex 22:6</a>, etc., but this translation spoils the figure. The meaning is, "They sow the wind, a worthless sowing, for such seed produces no stalk, it yields no grain."``1';
isbe[8390]='Stall`stol<P>(1) marbeq, literally, "a place for tying up" (<a onClick="return mV(\'Amo\',6,4);">Am 6:4</a>; <a onClick="return mV(\'Mal\',4,2);">Mal 4:2</a>),<P>(2) \'abhac, "to give fodder" (<a onClick="return mV(\'Pro\',15,17);">Pr 15:17</a>),<P>(3) \'urvah, "to pluck and feed" (<a onClick="return mV(\'1Ki\',4,26);">1Ki 4:26</a>; <a onClick="return mV(\'2Ch\',9,25);">2Ch 9:25</a>; <a onClick="return mV(\'2Ch\',32,28);">32:28</a>),<P>(4) repheth, "a resting place" (<a onClick="return mV(\'Hab\',3,17);">Hab 3:17</a>);<P>(5) phatne, "a manger" or "crib" (<a onClick="return mV(\'Luk\',13,15);">Lu 13:15</a>; compare \'ebhuc, translated "crib" in <a onClick="return mV(\'Isa\',1,3);">Isa 1:3</a>; <a onClick="return mV(\'Pro\',14,4);">Pr 14:4</a>)): During the season when cattle are not being used they are allowed to roam in the fields. Otherwise they are tied in rooms in the winter time, or under shelters made of green boughs in the summer, and all their food brought to them. Horses and cattle alike are haltered and the chains fastened through holes made in stones projecting from the walls. No stanchions and no separating partitions between animals are used. The horses are usually hobbled as well.``133';
isbe[8391]='Stammerer`stam\'-er-er: <a onClick="return mV(\'Isa\',32,4);">Isa 32:4</a>, \'illegh, "inarticulate speaking." In <a onClick="return mV(\'Isa\',28,11);">Isa 28:11</a>; <a onClick="return mV(\'Isa\',33,19);">33:19</a>, l\'g (pointing uncertain) is rendered "strange" by the Revised Version (British and American), with "stammering" in the King James Version, the Revised Version margin. Probably the word means both, as primitive people always think that their own language alone is clearly pronounced. Or the word may mean "mocking."``1';

isbe[8395]='Star in the East``<a href="./study/isbe/search.html?string=STAR+OF+THE+MAGI">STAR OF THE MAGI</a>; <a href="./study/isbe/search.html?string=MAGI">MAGI</a>`1';
isbe[8396]='Star of Bethlehem``<a href="./study/isbe/search.html?string=STAR+OF+THE+MAGI">STAR OF THE MAGI</a>`1';
isbe[8397]='Star of the Magi`1. The Magi<P>2. Herod\'s Enquiry<P>3. Two Facts concerning the Star<P>4. The Wisdom of the Magi Not Astrological<P>5. The Prophecy of Balaam<P>6. The Star Not a Conjunction of Planets<P>7. The Star Not Nova Cassiopeiae<P>8. The Legend of the Well<P>9. Lesson of the Narrative<hr /><P>1. The Magi:<P>The birth of our Lord was announced in a supernatural manner not only to Jews by the angelic message to the shepherds, but also to Gentiles, for "Wise-men from the east came to Jerusalem, saying, Where is he that is born King of the Jews? for we saw his star in the east, and are come to worship him" (<a onClick="return mV(\'Mat\',2,1,2);">Mt 2:1,2</a>). The word which has been rendered "wise men" in the King James Version and the English Revised Version (the American Standard Revised Version "Wise-men") is "Magi." These, according to Herodotus, were originally a tribe of the Medes (Herodotus i.101) and from their supposed skill in divination the term was applied to the learned and priestly caste among the followers of Zoroaster; they were thus in principle worshippers of one only God, and rejecters of polytheism and idolatry. The simple creed and high morality, which Zoroastrianism in its purest form professed, were well adapted to prepare its faithful disciples to receive a further revelation, and we may reasonably believe that the wise men who had been thus guided to worship the new-born king of the Jews had been faithful to the light afforded to them, for "in every nation he that feareth him (God), and worketh righteousness, is acceptable to him" (<a onClick="return mV(\'Act\',10,35);">Ac 10:35</a>).<P>See <a href="./study/isbe/search.html?string=MAGI">MAGI</A>.<P>2. Herod\'s Enquiry:<P>The gospel tells us that the arrival of the Magi at Jerusalem threw Herod the king and all the city into great excitement, and Herod at once called a council of all the chief priests and scribes of the people that he might learn from them where the Messiah should be born. In reply they quoted to him the prophecy of Micah which had indicated Bethlehem as the destined site. "Then Herod privily called the Wise-men, and learned of them exactly what time the star appeared. And he sent them to Bethlehem, and said, Go and search out exactly concerning the young child; and when ye have found him, bring me word, that I also may come and worship him. And they, having heard the king, went their way; and lo, the star, which they saw in the east, went before them, till it came and stood over where the young child was. And when they saw the star, they rejoiced with exceeding great joy" (<a onClick="return mV(\'Mat\',2,\'7-10\');">Mt 2:7-10</a>). So much, and no more, are we told of the star of the Magi, and the story is as significant in its omissions as in that which it tells us.<P>3. Two Facts concerning the Star:<P>What sort of a star it Was that led the wise men; how they learned from it that the King of the Jews was born; how it went before them; how it stood over where the young Child was, we do not know. We are indeed told but two facts concerning it: first, that its appearance in some way or other did inform the wise men, not of the birth of a king of the Jews, but of the King of the Jews for whose coming, not Israel only, but more or less consciously the whole civilized world was waiting; next, that, when they had come to Judea in consequence of this information, the star pointed out to them the actual spot where the new-born King was to be found. It went before them till it came and stood over where the young Child was. It may also be inferred from <a onClick="return mV(\'Mat\',2,10);">Mt 2:10</a> that in some way or other the wise men had for a time lost sight of the star, so that the two facts mentioned refer to two separate appearances. The first appearance induced the Magi to leave the East and set out for Judea; the second pointed out to them the place at Bethlehem where the object of their search was to be found. Nothing is told us respecting the star except its work as a guide.<P>There can be no doubt that the Magi took their journey in obedience to direct revelation from God, and since we are told that God warned them in a dream not to return to Herod, so that they departed to their own country another way, it is but reasonable to suppose that their outward journey had been directed in a similar manner.<P>4. The Wisdom of the Magi Not Astrological:<P>It has been conjectured that as the Magians were credited with a great skill in astrology they may have been able to forecast the birth of our Lord by the rules of their art. But this conjecture must be peremptorily rejected. It ascribes to the pseudo-science of astrology a reality to which it has no claim, for it is inconceivable that the planetary configurations can really foretell the birth of princes. Even if it were admitted that such could be the case, no such event could be taken as indicating the One Birth for which the world was waiting, unless some direct and explicit revelation from God had been received to that effect. For that Birth was necessarily unique, and science can deal only with repeated events. No astronomical research is now, or was at any time, competent in itself to supply the indication needed; it was not in virtue of any natural learning that the wise men understood the meaning of the star. And if a mere astronomical research was helpless to supply any such power of prediction, still more emphatically must the claim of "occult knowledge" be disallowed. So far as occult knowledge has had any basis in fact at all, it has been simply a euphemistic way of describing the frauds, impostures and crimes by which debased heathen priesthoods and "medicine men" have imposed upon the gross superstition of their followers. The very suggestion that, by means like these, God\'s purpose would be made known shows that those who suggest it have not entirely shaken off the influence of heathenism.<P>5. The Prophecy of Balaam:<P>The suggestion has often been made that the prophecy of Balaam, "There shall come forth a star out of Jacob, and a scepter shall rise out of Israel" (<a onClick="return mV(\'Num\',24,17);">Nu 24:17</a>), may have been preserved in the East and have furnished the clue upon which the Magi acted. It is a pleasing thought that these devout Gentiles had thus preserved and meditated upon the prophecy given through one who may well have been of an allied order to themselves; but that prophecy can surely not have been sufficient in itself, and some much more direct intimation must have been vouch-safed to them; though the prophecy may have aided their faith and have dictated the form in which they announced their mission to King Herod and the Jews.<P>6. The Star Not a Conjunction of Planets:<P>We are not told how the Magi learned the meaning of the star, neither are we told what kind of a star it was. Some three centuries ago the ingenious and devout Kepler supposed that he could identify the star with a conjunction of the planets Jupiter and Saturn in the constellation Pisces, the two planets being so close as to seem a single star. This conjunction took place in the month of May, 7 BC, not very long before the birth of our Lord is supposed to have taken place. But the late Professor Pritchard has shown (Nature and Revelation, 243-55), first, that a similar and closer conjunction occurred 59 years earlier, and should therefore have brought a Magian deputation to Judea then. Next, that the two planets never approached each other nearer than twice the diameter of the moon, so that they would have appeared, not as one star, but as two, and thirdly, if the planets had seemed to stand over Bethlehem as the wise men left Jerusalem, they would assuredly not have appeared to do so when they arrived at the little city. Ingenious as the suggestion was, it may be dismissed as unworthy of serious consideration.<P>7. The Star Not Nova Cassiopeiae:<P>Another suggestion has received at times a very wide popularity. In the year 1572 a wonderful new star appeared in the constellation Cassiopeia. At its brightest it outshone Venus and was visible in the daylight, and though it gradually declined in splendor it was not lost to sight until after 16 months. There have been other instances of outbursts of short-lived bright stars, and in the annals of the years 1265 and 952 some brief notices have been found which may have referred to objects of this class, but more probably described comets. The guess was then hazarded that these three events might all refer to the same object; that the star in Cassiopeia might be a "variable" star, bursting into brilliancy about every 350 years or so; that it was the star that announced the birth of our Lord, and that it would reappear about the end of the 19th century to announce His second coming. This rumor was widely spread, and from time to time ignorant people have noticed the planet Venus which shines with extraordinary brilliancy when in particular parts of her orbit, and have imagined, especially when she has been thus seen as a morning star in the east, that she was none other than the star of Bethlehem at its predicted return. There is no reason to suppose that the star of 1572 had ever appeared before that date or will ever appear again; but in any case we are perfectly sure that it could not have been the star of Bethlehem, for Cassiopeia is a northern constellation, and the wise men in their journey from Jerusalem to Bethlehem had Cassiopeia and all her stars behind their back.<P>The statement that the star "went before" the Magi gives the impression that it was some supernatural light like the shekhinah, "glory," resting upon the tabernacle, or the pillar of fire which led the children of Israel through the wilderness. But this view raises the questions as to the form in which it first appeared to the wise men, when they were still in the East, and how they came to call it a star, when they must have recognized how un-starlike it was. On the other hand, if what they saw when in the East was really a star, it seems most difficult to understand how it can have appeared to go before them and to stand over the place where the young Child lay.<P>8. The Legend of the Well:<P>Yet there is a legend still current in Palestine which may possibly explain how an actual star may have fulfilled this part, and there is a well at Bethlehem that is still shown to pilgrims as the means whereby the wise men "saw the star" the second time. It is said that when they had reached Bethlehem, apparently nearly at mid-day, one of them went to the well of the inn in order to draw water. Looking down into the well he saw the star reflected from the surface of the water and knew that it must be directly overhead. Its re-observation under such unusual circumstances would be a sufficient assurance to the Magi that they had reached the right place, and inquiry in the inn would soon inform them of the visit of the shepherds, and of the angelic message which had told them where to find the babe \'born in the city of David, the Saviour, which is Christ the Lord.\'<P>If we may accept this legend we may take the star as having been what astronomers know as a "new" or "temporary" star, like that of 1572. When the Magi first saw it, and in consequence set out upon their journey, it may have been an evening star and thus, being seen only in the west shortly after sunset, it would appear, evening after evening, to point them their way to Judea. As they journeyed thither it probably faded as temporary stars in general quickly do. At the same time it would have drawn nearer and nearer to the sun, until it was lost in its rays by the time they reached Jerusalem, when they would seem to have lost sight of it altogether. Having thus lost it, they would naturally not expect to see it again until it had drawn away from the sun on the other side, and been detected as a morning star in the east before sunrise; they would not expect to discover it in the daytime.<P>In the ordinary way, the planet Venus is, after the two "great lights," the brightest object in the heavens, but temporary stars are on record that have even exceeded Venus in brightness. The difficulty of seeing the planet Venus in full sunshine does not lie in her want of brightness, but in picking up and holding steadily so minute a point of light in the broad expanse of the gleaming sky. This difficulty, which would be even greater in the case of a star, would be lessened by looking down the well, as the shaft would narrow the field of view down to a small area, and would direct the observer\'s gaze straight to the star. There may also have been, at the very time of observation, a temporary revival of the brightness of the star as has been recorded in the case of one or two objects of the same class. The legend, whether well founded or not, seems to have some astronomical verisimilitude, and at any rate suggests a mode in which an actual star could have seemed to stand over the place where the young Child lay. It would also explain what seems to have been implied in the narrative, how it happened that the Magi alone, and not the Jews in general, perceived the star at its second appearance.<P>9. Lesson of the Narrative:<P>Yet it seems safer to conclude that the narrative has been purposely left—astronomically—too incomplete for any astronomical conclusion to be drawn from it. One verse more, and that a short one, could have answered all our inquiries, could have told us whether the star was a conjunction of the planets, a comet, or a temporary star; or whether it was a supernatural light like the pillar of fire in the wilderness. But that verse has not been given. The score of additional words which could have cleared up the matter have been withheld, and there can be no doubt as to the reason. The star, whatever its physical nature, was of no importance except as a guide to the birthplace of the infant Jesus. The reticence of the gospel narrative on all points, except those directly relating to our Lord Himself, enforces the truth that the Scriptures were not written to instruct us in astronomy, or in any of the physical sciences, but that we might have life eternal (<a onClick="return mV(\'Jhn\',17,3);">Joh 17:3</a>).``119';
