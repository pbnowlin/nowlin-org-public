 the 13 occur nowhere else, it is also true that more than 500 other names also occur only in these three books, and that the total names in these, to say nothing of the "P" portions elsewhere, outnumber the names in the other books about three to one. Other things being equal, three mentions of any common name ought to be found in these books to one in the others. Of all names applied to more than four persons the usual proportion in these books by count is four, to one elsewhere.<P>(g) Pedigree of Ahimaaz (<a onClick="return mV(\'1Ch\',6,\'50-53\');">1Ch 6:50-53</a>). Parallel with <a onClick="return mV(\'1Ch\',6,\'4-8\');">1Ch 6:4-8</a>.<P>(h) Dwelling-places of Levi.<P>(6) The six remaining tribes.<P>(a) Issachar (<a onClick="return mV(\'1Ch\',7,\'1-5\');">1Ch 7:1-5</a>).<P><a onClick="return mV(\'1Ch\',7,1);">1 Chronicles 7:1</a> derived from <a onClick="return mV(\'Gen\',46,13);">Ge 46:13</a>; <a onClick="return mV(\'Num\',26,23,24);">Nu 26:23-24</a>. The rest peculiar to Chronicles. Closes with a record of fighting men, instead of the usual statement of dwelling-places.<P>(b) Benjamin (<a onClick="return mV(\'1Ch\',7,\'6-13\');">1Ch 7:6-13</a>).<P>A very difficult section. It is considered a Zebulunite genealogy which has been Benjaminized, because<P>(1) there is a Benjamite list elsewhere;<P>(2) Benjamin is out of place here, while in 13 out of 17 tribal lists Zebulun comes at this point, and in this list has no other place;<p>(3) the numbers of Benjamin\'s sons differ from other Benjamite genealogies;<P>(4) the names of Bela\'s and Becher\'s sons are different here;<P>(5) many names are not Benjamite;<P>(6) Tarshish, in this list, is a sea-coast name appropriate to Zebulun, but not Benjamin. But (1) it is called Benjamite; (2) doublets are not unknown in Chronicles; (3) Dan is also neglected; (4) many Benjamite names are found; (5) both the Zebulunite material and the Benjamite material elsewhere is too scanty for safe conclusions.<P>(c) Dan, <a onClick="return mV(\'1Ch\',7,12);">1Ch 7:12</a>, from <a onClick="return mV(\'Gen\',46,23);">Ge 46:23</a>.<P>Aher ("another") is a copyist\'s error or substitute for Dan.<P>(d) Naphtali, <a onClick="return mV(\'1Ch\',7,13);">1Ch 7:13</a>, from <a onClick="return mV(\'Gen\',46,24);">Ge 46:24</a> (transcriptional changes).<P>(e) Manasseh, East and West (<a onClick="return mV(\'1Ch\',7,\'14-19\');">1Ch 7:14-19</a>).<P>The text of <a onClick="return mV(\'1Ch\',7,14,15);">1Ch 7:14-15</a> very corrupt. No other notice is found of the sons in <a onClick="return mV(\'1Ch\',7,16,17);">1Ch 7:16-17</a>: Peresh, Sheresh, Ulam, Rakere, Bedan.<P>(f) Ephraim to Joshua (<a onClick="return mV(\'1Ch\',7,\'20-29\');">1Ch 7:20-29</a>).<P>Contains an interesting personal note in the mourning of Ephraim over his sons Ezer and Elead, and the subsequent birth of Beriah. Interpreted to mean that the clans Ezer and Elead met with disaster, on which the clan Beriah became prominent.<P>(g) The seats of Joseph\'s sons (<a onClick="return mV(\'1Ch\',7,28,29);">1Ch 7:28-29</a>).<P>Hard to say why this has been placed here.<P>(h) Asher (<a onClick="return mV(\'1Ch\',7,\'30-40\');">1Ch 7:30-40</a>).<P>The earliest names derived from <a onClick="return mV(\'Gen\',46,17);">Ge 46:17</a>. Gray considers the others ancient.<P>(i) Benjamin (<a onClick="return mV(\'1Ch\',8,\'1-40\');">1Ch 8:1-40</a>).<P>(i) Sons of Benjamin. After <a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a>, with variations. See (6) (b).<P>(ii) Descendants of Ehud (<a onClick="return mV(\'1Ch\',8,\'6-28\');">1Ch 8:6-28</a>). Text very corrupt, obscure.<P>(iii) The house of Saul (<a onClick="return mV(\'1Ch\',8,\'29-38\');">1Ch 8:29-38</a>); repeated (<a onClick="return mV(\'1Ch\',9,\'35-44\');">1Ch 9:35-44</a>).<P>In this passage two exceptions to the usual treatment of Baal compounds. Ishbaal and Meribbaal here are Ishbosheth and Mephibosheth in S.<P>(7) The inhabitants of Jerusalem (<a onClick="return mV(\'1Ch\',9,\'1-34\');">1Ch 9:1-34</a>).<P>With variations in <a onClick="return mV(\'Neh\',11,\'1-13\');">Ne 11:1-13</a>. This passage has been thought an interpolation, but it is the Chronicler\'s custom to give dwelling-places. Perhaps this and Nehemiah are two independent abridgments of the same document. This probably describes post-exilic conditions. <a onClick="return mV(\'1Ch\',9,1);">1Ch 9:1</a> and <a onClick="return mV(\'1Ch\',9,2);">2</a> here, and <a onClick="return mV(\'Neh\',11,\'1-11\');">Ne 11</a> seem conclusive on this point. Four classes of returning exiles:<P>(a) The children of Judah, Benjamin, Ephraim, Manasseh.<P>Constituting "the laity," "Israel."<P>(b) The priests.<P>Agreeing with Nehemiah, but abridged.<P>(c) The Levites. Paralleling Nehemiah, but not exactly.<P>(d) Nethinim or porters. Fuller than Nehemiah, and different.<P>(8) The house of Saul (<a onClick="return mV(\'1Ch\',9,\'35-44\');">1Ch 9:35-44</a>, repeating <a onClick="return mV(\'1Ch\',9,\'29-38\');">9:29-38</A>).<P>(22) David\'s Knights (<a onClick="return mV(\'1Ch\',11,\'10-47\');">1 Chronicles 11:10-47</A>).<P>Discussed under (19). Adds to the list, Adina, son of Shiza, Reubenite; Hanan, son of Maacah, Joshaphat the Mithnite, Uzziah the Ashterathite, Shama and Jeiel the sons of Hotham the Aroerite, Jediael the son of Shimri, and Joah his brother, the Tizite, Eliel the Mahavite, and Jeribai and Joshaviah, the sons of Elnaam, and Ithmah the Moabite, Eliel, and Obed, and Jaasieh the Mezobaite.<P>(23) David\'s Recruits at Ziklag (<span class="noTag">1 Chronicles 12-22</span>).<P>Found only here. Contains 23 names from Benjamin (some may be Judahite); 11 from Gad; 8 from Manasseh; nothing to show that the names are not old.<P>(24) David\'s Musicians and Porters at the Bringing of the Ark (<a onClick="return mV(\'1Ch\',5,\'16-24\');">1 Chronicles 15:16-24</A>).<P>Also <a onClick="return mV(\'1Ch\',16,5,6,\'37-43\');">1Ch 16:5-6, 37-43</a>. Each division of the Levites represented by a chief musician.<P>(25) David\'s Organization of the Kingdom (<span class="noTag">1 Chronicles 23-27</span>).<P>I. The Levites (<a onClick="return mV(\'1Ch\',23,\'1-\');">1 Chronicles 23</a>).<P>(1) The family of Gershon (<a onClick="return mV(\'1Ch\',23,\'7-11\');">1Ch 23:7-11</a>); 9 houses.<P>(2) The family of Kohath (<a onClick="return mV(\'1Ch\',23,\'12-20\');">1Ch 23:12-20</a>); 11 houses.<P>(3) The family of Merari (<a onClick="return mV(\'1Ch\',23,\'21-23\');">1Ch 23:21-23</a>); 4 houses.<P>II. The Priests (<a onClick="return mV(\'1Ch\',24,\'1-\');">1 Chronicles 24</A>).<P>24 divisions; 16 divided among descendants of Eleazar, headed by Zadok; 8 among those of Ithamar, headed by Ahimelech (perhaps an error for Abiathar); but perhaps Ahimelech\'s. Abiathar, son of Ahimelech, was acting for his father.<P>(1) Eleazar\'s courses: Jehoiarib, Harim, Malchijah, Hakkoz, Joshua, Eliashib, Huppah, Bilgah, Hezer, Aphses, Pethahiah, Jehezekel, Jachin, Gamul, Delaiah, Maaziah.<P>(2) Ithamar: Jedaiah, Seorim, Mijamin, Abijah, Shecaniah, Jachim, Joshebeab, Immer.<P>Josephus gives the same names of courses (Ant., VII, xiv, 7; Vita, 1). Several are mentioned in Apocrypha, Talmud, and the New Testament. Jehoiarib, Jedaiah, Harim, Malchijah, Mijarain, Abijah, Shecaniah, Bilgah, Maaziah, are found in one or both of Nehemiah\'s lists.<P>(3) Supplementary list of Levites (<a onClick="return mV(\'1Ch\',24,\'20-31\');">1Ch 24:20-31</A>).<P>Repeats the Levitical families in <a onClick="return mV(\'1Ch\',23,\'6-23\');">1Ch 23:6-23</a>, omitting the Gershonites, adding to the Kohathites and Merarites.<P>III. The Singers (<a onClick="return mV(\'1Ch\',25,\'1-\');">1 Chronicles 25</a>).<P>(1) Their families, classified under the three great groups, descendants of Asaph, Jeduthun (Ethan), Heman.<P>A curious problem is suggested by the fact that the names in verse <a onClick="return mV(\'1Ch\',25,4);">4</a>, beginning with Hanani, with a few very slight changes, read: "Hanan (\'Have mercy\')-iah (\'O Yahweh\'); Hanani (\'Have mercy\'); Eli-athah (\'Thou art my God\'); Giddalti (\'I have magnified\') (and) Romamti (\'exalted\')(thy) Ezer (\'help\'); Josh-bekashah (\'In the seat of hardness\'); Mallothi (\'I spake of it\'); Hothir (\'Gave still\'); Mahazioth (\'Visions\')." How, or why, this came among these names, cannot be said.<P>(2) The 24 courses of 12 singers each, of which courses nos. 1,3,5,7 fell to Asaph; nos. 2,4,8,10,12,14 fell to Jeduthun; nos. 6,9,11,13,15-24 fell to Heman.<P>IV. Gatekeepers and Other Officers (<a onClick="return mV(\'1Ch\',26,\'1-\');">1 Chronicles 26</a>).<P>(1) Genealogies and stations of the gatekeepers (<a onClick="return mV(\'1Ch\',26,\'1-19\');">1Ch 26:1-19</a>).<P>(2) Those in charge of the temple treasury (<a onClick="return mV(\'1Ch\',26,\'20-28\');">1Ch 26:20-28</a>).<P>(3) Those in charge of the "outward business."<P>Subordinate magistrates, tax-collectors, etc.<P>V. The Army, and David\'s Officers (<a onClick="return mV(\'1Ch\',27,\'1-\');">1 Chronicles 27</a>).<P>(1) The army (<a onClick="return mV(\'1Ch\',27,\'1-15\');">1Ch 27:1-15</a>).<P>12 officers, each commanding 24,000 men, and in charge for one month; chosen from David\'s knights.<P>(2) The tribal princes (<a onClick="return mV(\'1Ch\',27,\'16-24\');">1Ch 27:16-24</a>).<P>After the fashion of <a onClick="return mV(\'Num\',12,\'1-\');">Nu 12-15</a>. Gad and Asher are omitted. The 12 are made up by including the Levites and the Aaronites.<P>(3) The king\'s twelve stewards (<a onClick="return mV(\'1Ch\',27,\'25-31\');">1Ch 27:25-31</a>).<P>(4) The king\'s court officers (<a onClick="return mV(\'1Ch\',27,\'32-34\');">1Ch 27:32-34</a>).<P>Counselor and scribe: Jonathan, the king\'s uncle, otherwise unknown; tutor: Jehiel; counselor: Ahithophel; "the king\'s friend" (closest confidant?): Hushai. Possibly two priests are next included: Jehoiada the son of Benaiah, and Abiathar, high priest of the Ithamar branch. But perhaps it should read, "Benaiah, the son of Jehoiada." If two priests are intended, it seems strange that Zadok is not one. The list ends with the commander-in-chief, Joab.<P>This elaborate organization in every part and branch of the kingdom is looked upon as the Chronicler\'s glowing Utopian dream of what must have been, underrating the organizing power of the great soldier and statesman.<P>(26) <a onClick="return mV(\'Ezr\',2,\'1-63\');">Ezra 2:1-63</a>.—The Exiles Who Returned with Zerubbabel.<P>Paralleled in <a onClick="return mV(\'Neh\',7,\'6-73\');">Ne 7:6-73</a>. 9 "Jah," 4 "El" names in 107.<P>(1) The Leaders (<a onClick="return mV(\'Ezr\',2,2);">Ezra 2:2</a>).<P>(2) Numbers, according to Families (<a onClick="return mV(\'Ezr\',2,\'3-19\');">Ezra 2:3-19</a>).<P>18 of Ezra\'s numbers differ from Nehemiah\'s.<P>(3) Numbers according to Localities (<a onClick="return mV(\'Ezr\',2,\'20-35\');">Ezra 2:20-35</a>).<P>10 towns probably Judahite, 7 Benjamite.<P>(4) The Priests (<a onClick="return mV(\'Ezr\',2,39,42);">Ezra 2:39, 42</a>).<P>Only 4 families, representing 3 Davidic courses.<P>(5) The Levites (<a onClick="return mV(\'Ezr\',2,43,44);">Ezra 2:43-44</a>).<P>Among the singers, only Asaphites.<P>(6) The Porters (<a onClick="return mV(\'Ezr\',2,45);">Ezra 2:45</a>).<P>3 old names, 3 new ones.<P>(7) The "Nethinim" (Temple-Slaves) (<a onClick="return mV(\'Ezr\',2,\'46-56\');">Ezra 2:46-56</a>).<P>(8) The Children of Solomon\'s Servants (Slaves) (<a onClick="return mV(\'Ezr\',2,\'57-59\');">Ezra 2:57-59</a>).<P>(9) Those Who Could Not Prove Their Descent.<P>(a) General population.<P>Three families, children of Delaiah, Tobiah, Nekoda.<P>(b) Priestly families.<P>Hobaiah, Hakkoz, Barzillai. Hakkoz, the seventh of the Davidic courses, perhaps succeeded later in establishing their right (<a onClick="return mV(\'Neh\',3,21);">Ne 3:21</a>).<P>(27) <a onClick="return mV(\'Ezr\',6,\'1-5\');">Ezra 6:1-5</a>.—Ezra\'s Genealogy.<P>An ascending genealogy: Ezra, son of Seraiah, son of Azariah, son of Hilkiah, son of Shallum, son of Zadok, son of Ahitub, son of Amaraiah, son of Azariah, son of Meraioth, son of Zerahiah, son of Uzzi, son of Bukki, son of Abishua, son of Phinehas, son of Eleazar, son of Aaron; 16 links. Follows <a onClick="return mV(\'1Ch\',6,\'7-10\');">1Ch 6:7-10</a> down to Zadok, then omits 7 to Shallum, besides the 7 omitted in Chronicles.<P>(28) <a onClick="return mV(\'Ezr\',8,\'1-20\');">Ezra 8:1-20</a>.—Numbers and Leaders of Those Who Returned with Zerubbabel.<P>Numbers much smaller than in Zerubbabel\'s list (<a onClick="return mV(\'Ezr\',2,\'1-14\');">Ezr 2:1-14</a>). Perhaps 3 new families, Shecaniah, Shelomith, Joah; 7 more leaders. A much smaller proportion of Levites; among them a "man of discretion," perhaps a name, "Ishsecel," of the sons of Mahli, therefore a Merarite, with other Merarites, 39 in all.<P>(29) <a onClick="return mV(\'Ezr\',10,\'18-44\');">Ezra 10:18-44</a>.—Jews Who Had Married Foreign Women.<P>(1) The Priests (<a onClick="return mV(\'Ezr\',10,\'18-22\');">Ezra 10:18-22</a>).<P>Seventeen in all; members of the high priest\'s family, and of the Davidic courses of Immer and Harim, besides the family of Pashhur.<P>(2) The Levites (<a onClick="return mV(\'Ezr\',10,23);">Ezra 10:23</a>); 6 in All.<P>(3) Singers and Porters (<a onClick="return mV(\'Ezr\',10,24);">Ezra 10:24</a>); 4 in All.<P>(4) "Israel," "the Laity" (<a onClick="return mV(\'Ezr\',10,\'25-43\');">Ezra 10:25-43</a>).<P>Sixteen families represented; 86 persons. Out of a total of 163 names, 39 yah compounds, 19 \'el compounds, 8 prefixed.<P>(30) <a onClick="return mV(\'Neh\',3,\'1-12\');">Nehemiah 3:1-12</a>.—The Leaders in the Repair of the Wall.<P>Thirty-eight leaders; in 30 instances the father\'s name also given. As far as mentioned, all from Judah and Jerusalem.<P>(31) <a onClick="return mV(\'Neh\',7,\'7-63\');">Nehemiah 7:7-63</a>.—Those Who Returned with Zerubbabel.<P>Follows <a onClick="return mV(\'Ezr\',2,\'1-63\');">Ezr 2:1-63</a>, with transcriptional variations in names and numbers.<P>(32) <a onClick="return mV(\'Neh\',8,\'4-7\');">Nehemiah 8:4-7</a>.—Levites and Others Who Assisted Ezra in Proclaiming the Law.<P>(33) <a onClick="return mV(\'Neh\',10,\'1-27\');">Nehemiah 10:1-27</a>.—The Sealers of the Covenant.<P>Twenty-two priests, 17 Levites, 20 heads of families already mentioned, 24 individuals.<P>(34) <a onClick="return mV(\'Neh\',11,\'3-36\');">Nehemiah 11:3-36</a>.—Chief Dwellers in Jerusalem and Vicinity.<P>Parallels in <a onClick="return mV(\'1Ch\',9,\'9-22\');">1Ch 9:9-22</a>. Some omissions and variations; 5 priestly courses given, Joiarib, course no. 1</a>; Jedaiah, no. 2</a>; Jachin, no. 23</a>; Malchijah, no. 5</a>; Immer, no. 6</a>. 24 "Jah," 6 "El" names out of 82.<P>(35) <a onClick="return mV(\'Neh\',12,\'1-8\');">Nehemiah 12:1-8</a> —Priests and Levites Who Went Up with Zerubbabel.<P>Compare with priests\' lists in <a onClick="return mV(\'Neh\',10,\'2-8\');">Ne 10:2-8</a> (33), and with priests under Joiakim (<a onClick="return mV(\'Neh\',12,\'12-21\');">Ne 12:12-21</a> [36]). They are names of families. See <a onClick="return mV(\'Neh\',12,12);">Ne 12:12</a>.<P>(36) <a onClick="return mV(\'Neh\',12,10,11);">Nehemiah 12:10-11</a>.—High Priests from Jeshua to Jaddua.<P>(1) Jeshua, 538 to 520 BC.<P>(2) Joiakim.<P>(3) Eliashib, 446 till after 433.<P>(4) Joiada, about 420.<P>(5) Jonathan, Johanan, 405 to 362.<P>(6) Jaddua, to 323.<P>This list bears upon the date of Ezra-Nehemiah. Jaddua was high priest when Alexander visited Jerusalem, 335 BC. If the Darius of verse <a onClick="return mV(\'Neh\',12,22);">22</a> is Darius Nothus (425 to 405 BC), and Jaddua, a young boy, is mentioned as the heir to the high-priesthood, this passage was written before 400. If Jaddua\'s actual high-priesthood is meant, and Darius Codomannus (336 to 330 BC) is the Darius here, the date may be about 330. The enumeration of families here is assigned to the time of Joiakim, before 405, and the latest recorded events to the time of the high priest before Jaddua (<a onClick="return mV(\'Neh\',12,23);">Ne 12:23</a>; <a onClick="return mV(\'Neh\',13,28);">13:28</a>), hence, before 362. The hypothesis of an addition by some scribe after 350 is possible, but not necessary.<P>(37) <a onClick="return mV(\'Neh\',12,\'12-21\');">Nehemiah 12:12-21</a>.—Heads of Priestly Families.<P>(38) <a onClick="return mV(\'Neh\',12,\'22-26\');">Nehemiah 12:22-26</a>.—Levites and Porters under High Priest Johanan.<P>(39) <a onClick="return mV(\'Neh\',12,\'31-42\');">Nehemiah 12:31-42</a>.—Princes and Priests at Dedication of the Wall.<P>(40) <a onClick="return mV(\'Mat\',1,\'1-17\');">Matthew 1:1-17</a>.—<a href="study/isbe/search.html?string=GENEALOGY+OF+JESUS+CHRIST,+THE">The Genealogy of Jesus Christ</a>.<P>(See separate article).<P>(41) <a onClick="return mV(\'Luk\',3,\'23-38\');">Luke 3:23-38</a>.—<a href="study/isbe/search.html?string=GENEALOGY+OF+JESUS+CHRIST,+THE">The Genealogy of Jesus</A>.<P>(See separate article).<P>LITERATURE.<P>Commentaries in the place cited., especially on Genesis, Exodus, Numbers, Chronicles, Ezra-Nehemiah, especially C. F. Keil, Bible Comm., 1872; E. Bertheau, in Kurzgef. exeget. Handb. zum Altes Testament, 1873; Bible ("Speaker\'s") Commentary (Browne, Genesis; Clark, Exodus; Espin, Numbers; Rawlinson, Chronicles, etc.); W. B. Barnes, Cambridge Bible, Chronicles; R. Kittel, Die Bucher der Chronicles; Driver, Westminster Comm., Genesis; ICC (Gray, Nu; Moore, Jgs; Curtis, Chronicles, etc.); Pulpit Comm.; W. R. Harvey-Jellie, Chronicles in Century Bible; S. Oettli, Kgf. Kom., 1889; O. Zoeckler, Lange\'s Comm., etc.<P>Encyclopedia arts., especially HDB, E. L. Curtis, "Genealogies"; SBD, A. C. Hervey, "Genealogies"; EB, S. A. Cook, "Genealogies"; EB, 11th edition, S. A. Cook, "Genealogies"; other encyclopedia arts., under specific books, tribes, names, genealogies.<P>General works: Gray, Studies in Hebrew Proper Names; Hommel, The Ancient Hebrew Tradition; A.C. Hervey, The Genealogies of our Lord; Sprenger, Das Leben u. d. Lehre d. Mohammad; W.R. Smith, Kinship and Marriage in Early Arabia; J. Wellhausen, De Gentibus et Familiis Judaeis; J. Wellhausen, Prolegomena, 1883 (ET), 177-277; McLennan, Studies in Ancient History.<P>Magazine articles: H.W. Hogg, "Genealogy of Benjamin," JQR, XI, 1899, 96-133, 329-44; M. Berlin, "Notes on Genealogies of Levi, <span class="noTag">1Ch 23-26</span>," Jewish Quarterly Review, XII, 1900, 291-98; M. Berlin, "Gershonite and Merarite Genealogies," JQR, XII, 1901, 291ff; H. W. Hogg, "Ephraimite Genealogy," JQR, XIII, 1900-1901, 147-54; J. Marquart, "Genealogies of Benjamin," JQR, XIV, 1902, 343-51; J. W. Rothstein, Die Genealogie das Konigs Jojachin und seiner Nachkommen in geschichtlicher Beleuchtung, Berlin: Reuther u. Reichold, 1902; R.S. Macalister, "The Royal Potters, <span class="noTag">1Ch 4:23</span>," The Expositor Times, XVI, 1905, 379ff; R. S. Macalister, "The Craftsmen Guild of the Tribe of Judah," PEFS, 1905, 243-53, 328-42; C. C. Torrey, "The Greek versions of Chronicles, Ezra, and Nehemiah," Proceedings of the Society of Biblical Archaeology, XXV. 1903, 139ff, and many others.``31';
isbe[3732]='General; Generally`jen\'-er-al, jen\'-er-al-i (kullah; paneguris):<P>(1) General is the translation of sar, "master," "head," "chief"; used once in the King James Version in the sense of commander-in-chief, "the general of the king\'s army" (<a onClick="return mV(\'1Ch\',27,34);">1Ch 27:34</a>), usually in this connection translated "captain," the Revised Version (British and American) "the captain of the king\'s host."<P>(2) As an adjective "general assembly" is the translation of paneguris (whence we have panegyric), "an assembly or convocation of the whole people to celebrate any public festival or solemnity, as the public games or sacrifices, hence, a high festival, public convocation, joyful assembly" (Robinson); the word occurs in the New Testament only in <a onClick="return mV(\'Hbr\',12,23);">Heb 12:23</a>, "to the general assembly and church of the firstborn; paneguris is Septuagint for mo\'edh (<a onClick="return mV(\'Eze\',46,11);">Eze 46:11</a>; <a onClick="return mV(\'Hsa\',2,11);">Ho 2:11</a>), "solemn assembly" and for \'atsarah (<a onClick="return mV(\'Amo\',5,21);">Am 5:21</a>), with the same meaning. The Greek words translated "and to an innumerable company of angels, to the general assembly and church of the firstborn" (the King James Version) have been variously arranged and translated; Robinson gives "and to countless throngs (even) the joyful assembly of angels, i.e. as hymning the praises of God around His throne"; compare <a onClick="return mV(\'Rev\',5,11);">Re 5:11</a>f; <a onClick="return mV(\'Psa\',148,2);">Ps 148:2</a>; <a onClick="return mV(\'Dan\',7,10);">Da 7:10</a>). From both Hebrew and Greek analogies, this is probably correct; similarly, Alford, Delitzsch and others have "festival assembly"; Weymouth translated "to countless hosts of angels, to the great festal gathering and church of the first-born."<P>(3) Generally, adverb, occurs in <a onClick="return mV(\'Jer\',48,38);">Jer 48:38</a> the King James Version as the translation of kullah (Pual of kalah), "the whole of it," "There shall be lamentation generally (universally) upon all the housetops of Moab," the Revised Version (British and American) "everywhere"; in <a onClick="return mV(\'2Sa\',17,11);">2Sa 17:11</a>, \'acaph, "to be gathered," is translated "to be generally gathered," the Revised Version (British and American) "gathered together."<P>In Apocrypha we have "general" in the sense of "common," "universal" (Additions to Esther 15:10 margin, koinos; 2Macc 3:18, pandemon); "in general" (2Esdras 8:15, "man in general"; Ecclesiasticus 18:1, "all things in general," koinos, the Revised Version (British and American) "in common").``185';
isbe[3733]='Generation`jen-er-a\'-shun (Latin generatio, from genero, "beget"):<P>(1) The translation<P class="in15">(a) of dor, "circle," "generation," hence, "age," "period," "cycle": "many generations" (<a onClick="return mV(\'Deu\',32,7);">De 32:7</a>);<P class="in15">(b) the people of any particular period or those born about the same time: "Righteous before me in this generation" (<a onClick="return mV(\'Gen\',7,1);">Ge 7:1</a>); "four generations" (<a onClick="return mV(\'Job\',42,16);">Job 42:16</a>);<P class="in15">(c) the people of a particular class or sort, with some implied reference to hereditary quality; the wicked (<a onClick="return mV(\'Deu\',32,5);">De 32:5</a>; <a onClick="return mV(\'Pro\',30,11);">Pr 30:11</a>); the righteous (<a onClick="return mV(\'Psa\',14,5);">Ps 14:5</a>; <a onClick="return mV(\'Psa\',112,2);">112:2</a>).<P>(2) toledhoth, "births," hence<P class="in15">(a) an account of a man and his descendants: "The book of the generations of Adam" (<a onClick="return mV(\'Gen\',5,1);">Ge 5:1</a>);<P class="in15">(b) successive families: "The families of the sons of Noah, after their generations" (<a onClick="return mV(\'Gen\',10,32);">Ge 10:32</a>);<P class="in15">(c) genealogical divisions: "The children of Reuben...their generations, by their families" (<a onClick="return mV(\'Num\',1,20);">Nu 1:20</a>);<P class="in15">(d) figurative, of the origin and early history of created things: "The generations of the heavens and of the earth" (<a onClick="return mV(\'Gen\',2,4);">Ge 2:4</a>).<P>(3) genea, "a begetting," "birth," "nativity," therefore<P class="in15">(a) the successive members of a genealogy: "All the generations from Abraham unto David" (<a onClick="return mV(\'Mat\',1,17);">Mt 1:17</a>);<P class="in15">(b) a race, or class, distinguished by common characteristics, always (in the New Testament) bad: "Faithless and perverse generation" (<a onClick="return mV(\'Mat\',17,17);">Mt 17:17</a>);<P class="in15">(c) the people of a period: "This generation shall not pass away" (<a onClick="return mV(\'Luk\',21,32);">Lu 21:32</a>);<P class="in15">(d) an age (the average lifetime, 33 years): "Hid for (Greek "from the") ages and (from the) generations" (<a onClick="return mV(\'Col\',1,26);">Col 1:26</a>). The term is also by a figurative transference of thought applied to duration in eternity: "Unto all generations for ever and ever" (<a onClick="return mV(\'Eph\',3,21);">Eph 3:21</a>) (Greek "all the generations of the age of the ages").<P>(4) genesis, "source," "origin": "The book of the generation of Jesus Christ" (<a onClick="return mV(\'Mat\',1,1);">Mt 1:1</a>; the American Revised Version, margin "The genealogy of Jesus Christ").<P>(5) gennema, "offspring," "progeny"; figurative: "O generation of vipers" (<a onClick="return mV(\'Luk\',3,7);">Lu 3:7</a> the King James Version).<P>(6) genos, "stock," "race," in this case spiritual: "But ye are a chosen generation" (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>; the American Standard Revised Version "an elect race").``31';
isbe[3734]='Genesis, 1-2`jen\'-e-sis:<P><b>I. GENERAL DATA</b><P>1. The Name<P>2. Survey of Contents<P>3. Connection with Succeeding Books<P><b>II. COMPOSITION OF GENESIS IN GENERAL</b><P>1. Unity of the Biblical Text<P class="in15">(1) The Toledhoth<P class="in15">(2) Further Indication of Unity<P>2. Rejection of the Documentary Theory<P class="in15">(1) In General<p class="in30">(a) Statement of Theory<p class="in30">(b) Reasons Assigned for Divisions<p class="in30">(c) Examination of the Documentary Theory<p class="in60">(i) Style and Peculiarities of Language<p class="in60">(ii) Alleged Connection of Matter<p class="in60">(iii) The Biblico-Theological Data<p class="in60">(iv) Duplicates<p class="in60">(v) Manner in Which the Sources Are Worked Together<p class="in60">(vi) Criticism Carried to Extremes<P class="in15">(2) In View of the Names for God<p class="in30">(a) Error of Hypothesis in Principle<p class="in30">(b) False Basis of Hypothesis<p class="in30">(c) Improbability That Distinction of Divine Names Is without Significance<p class="in30">(d) Real Purpose in Use of Names for God<p class="in60">(i) Decreasing Use of Yahweh<p class="in60">(ii) Reference to Approach of Man to God, and Departure from Him<p class="in60">(iii) Other Reasons<p class="in60">(iv) Systematic Use in History of Abraham<p class="in30">(e) Scantiness of the Materials for Proof<p class="in30">(f) Self-Disintegration of the Critical Position<p class="in30">(g) Different Uses in the Septuagint<P><b>III. STRUCTURE OF THE INDIVIDUAL PERICOPES</b><P>1. The Structure of the Prooemium (<a onClick="return mV(\'Gen\',1,\'1-\');">Genesis 1</a>-<a onClick="return mV(\'Gen\',1,\'1-3\');">2:3</a>)<P>2. Structure of the 10 Toledhoth<P><b>IV. THE HISTORICAL CHARACTER</b><P>1. History of the Patriarchs (<a onClick="return mV(\'Gen\',12,\'1-\');">Genesis 12-50</a>)<P class="in15">(1) Unfounded Attacks on the History<p class="in30">(a) From General Dogmatic Principles<p class="in30">(b) From Distance of Time<p class="in30">(c) From Biblical Data<p class="in30">(d) From Comparison with Religion of Arabia<P class="in15">(2) Unsatisfactory Attempts at Explaining the Patriarchal Age<p class="in30">(a) Explanation Based on High Places<p class="in30">(b) The Dating Back of Later Events to Earlier Times<p class="in30">(c) The Patriarchs as heroes eponymi<p class="in30">(d) Different Explanations Combined<P class="in15">(3) Positive Reasons for the Historical Character of Genesis<p class="in30">Individuality of Patriarchs, etc.<P>2. The Primitive History of <a onClick="return mV(\'Gen\',1,\'1-\');">Genesis 1-11</a><p class="in15">(1) Prominence of the Religious Element<P class="in15">(2) Carefulness as Regards Divergent Results of Scientific Research<P class="in15">(3) Frequent Confirmation of the Bible by Science<P class="in15">(4) Superiority of the Bible over Pagan Mythologies Babylonian and Biblical Stories<P><b>V. ORIGIN AND AUTHORSHIP OF GENESIS</b><P>1. Connection with Mosaic Times<P>2. Examination of Counter-Arguments<P class="in15">(1) Possibility of Later Additions<P class="in15">(2) "Prophecy after the Event" Idea<P class="in15">(3) Special Passages Alleged to Indicate Later Date<p class="in30">Examination of These<P><b>VI. SIGNIFICANCE</b><P>1. Lays Foundation for the Whole of Revelation—Creation, Fall, Man in Image of God, Sin, etc.<P>2. Preparation for Redemption—Promises and Covenants<P><b>LITERATURE</b><hr /><P>I. General Data.<P>1. The Name:<P>The first book of Moses is named by the Jews from the first word, namely, bere\'shith, i.e. "in the beginning" (compare the Bresith of Origen]). In the Septuagint it is called Genesis, because it recounts the beginnings of the world and of mankind. This name has passed over into the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) (Liber Genesis). As a matter of fact the name is based only on the beginning of the book.<P>2. Survey of Contents:<P>The book reports to us the story of the creation of the world and of the first human beings (<a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>); of paradise and the fall (<a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a>f); of mankind down to the Deluge (<a onClick="return mV(\'Gen\',4,\'1-\');">Ge 4</a>f; compare <a onClick="return mV(\'Gen\',4,\'1-\');">Ge 4</a>, Cain and Abel); of the Deluge itself (<a onClick="return mV(\'Gen\',6,\'1-\');">Ge 6-9</a>); of mankind down to the age of the Patriarchs (<a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10:1</a>-<a onClick="return mV(\'Gen\',11,\'1-26\');">11:26</a>; compare <a onClick="return mV(\'Gen\',11,1);">11:1</a>ff, the building of the tower of Babel); of Abraham and his house (<a onClick="return mV(\'Gen\',11,\'27-\');">Ge 11:27-25:18</a>); of Isaac and his house (<a onClick="return mV(\'Gen\',25,\'19-\');">Ge 25:19-37:2</a>); of Jacob and of Joseph (<a onClick="return mV(\'Gen\',37,\'2-\');">Ge 37:2-50:26</a>). In other words, the Book of Genesis treats of the history of the kingdom of God on earth from the time of the creation of the world down to the beginning of Israel\'s sojourn in Egypt and to the death of Joseph; and it treats of these subjects in such a way that it narrates in the 1st part (<a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1:1-11:26</a>) the history of mankind; and in the 2nd part (<a onClick="return mV(\'Gen\',11,\'27-\');">Ge 11:27-50:26</a>) the history of families; and this latter part is at the same time the beginning of the history of the chosen people, which history itself begins with <a onClick="return mV(\'Exd\',1,\'1-\');">Ex 1</a>. Though the introduction, <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1-11</a>, with its universal character, includes all mankind in the promise given at the beginning of the history of Abraham (<a onClick="return mV(\'Gen\',12,\'1-3\');">12:1-3</a>), it is from the outset distinctly declared that God, even if He did originally set apart one man and his family (<a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12-50</a>), and after that a single nation (<a onClick="return mV(\'Exd\',1,\'1-\');">Ex 1</a>), nevertheless intends that this particularistic development of the plan of salvation is eventually to include all mankind. The manner in which salvation is developed historically is particularistic, but its purposes are universal.<P>3. Connection with Succeeding Books:<P>By the statements just made it has already been indicated in what close connection Genesis stands with the subsequent books of the sacred Scriptures. The history of the chosen people, which begins with <a onClick="return mV(\'Exd\',1,\'1-\');">Ex 1</a>ff, at the very outset and with a clear purpose, refers back to the history as found in Genesis (compare <a onClick="return mV(\'Exd\',1,\'1-6\',8);">Ex 1:1-6, 8</a> with <a onClick="return mV(\'Gen\',46,27);">Ge 46:27</a>; <a onClick="return mV(\'Gen\',50,24);">50:24</a>ff; and see <a href="study/isbe/search.html?string=EXODUS,+THE+BOOK+OF+,1">EXODUS, I, 3</a>), although hundreds of years had clasped between these events; which years are ignored, because they were in their details of no importance for the religious history of the people of God. But to Abraham in <a onClick="return mV(\'Gen\',12,\'1-3\');">Ge 12:1-3</a> the promise had been given, not only that he was to be the father of a mighty nation that would recognize him as their founder, and the earliest history of which is reported in Exodus and the following books of the Pentateuch, but also that the Holy Land had been promised him. In this respect, the Book of Joshua, which gives the story of the capture of this land, is also a continuation of the historical development begun in Genesis. The blessing of God pronounced over Abraham, however, continued to be efficacious also in the later times among the people who had descended from him. In this way Genesis is an introduction to all of the books of the Old Testament that follow it, which in any way have to do with the fate of this people, and originated in its midst as the result of the special relation between God and this people. But in so far as this blessing of God was to extend to all the nations of the earth (<a onClick="return mV(\'Gen\',12,3);">Ge 12:3</a>), the promises given can be entirely fulfilled only in Christ, and can expand only in the work and success of Christian missions and in the blessings that are found within Christianity. Accordingly, this book treats first of beginnings and origins, in which, as in a kernel, the entire development of the kingdom of God down to its consummation is contained (compare VI below).<P>II. Composition of Genesis in General.<P>1. Unity of the Biblical Text:<P>(1) The Toledhoth.<P>The fact that Genesis is characterized by a far-reaching and uniform scheme has, at least in outline, been already indicated (see I, 2 and 3). This impression is confirmed when we examine matters a little more closely and study the plan and structure of the book. After the grand introitus, which reports the creation of the world (<a onClick="return mV(\'Gen\',1,\'1-\');">1:1</a>-<a onClick="return mV(\'Gen\',2,\'1-3\');">2:3</a>) there follows in the form of 10 pericopes the historical unfolding of that which God has created, which pericopes properly in each case bear the name toledhoth, or "generations." For this word never signifies creation or generation as an act, but always the history of what has already been created or begotten, the history of generations; so that for this reason, <a onClick="return mV(\'Gen\',2,4);">2:4a</a>, where mention is made of the toledhoth of heaven and of earth, cannot possibly be a superscription that has found its way here from <a onClick="return mV(\'Gen\',1,1);">1:1</a>. It is here, as it is in all cases, the superscription to what follows, and it admirably leads over from the history of creation of the heavens and the earth in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> to the continuation of this subject in the next chapter. The claim of the critics, that the redactor had at this place taken only the superscription from his source P (the priestly narrator, to whom <a onClick="return mV(\'Gen\',1,\'1-\');">1:1</a>-<a onClick="return mV(\'Gen\',2,\'1-3\');">2:3</a> is ascribed), but that the section of P to which this superscription originally belonged had been suppressed, is all the more monstrous a supposition as <a onClick="return mV(\'Gen\',2,4);">2:4a</a> throughout suits what follows.<P>Only on the ground of this correct explanation of the term toledhoth can the fact be finally and fully explained, that the toledhoth of Terah contain also the history of Abraham and of Lot; the toledhoth of Isaac contain the history of Jacob and Esau; the toledhoth of Jacob contain the history of Joseph and his brethren. The ten toledhoth are the following: I, <a onClick="return mV(\'Gen\',2,\'4-\');">Ge 2:4-4:26</a>, the toledhoth of the heavens and the earth; II, <a onClick="return mV(\'Gen\',5,\'1-\');">5:1</a>-<a onClick="return mV(\'Gen\',6,\'1-8\');">6:8</a>, the toledhoth of Adam; III, <a onClick="return mV(\'Gen\',6,\'9-\');">6:9-9:29</a>, the toledhoth of Noah; IV, <a onClick="return mV(\'Gen\',10,\'1-\');">10:1</A>-<a onClick="return mV(\'Gen\',11,\'1-9\');">11:9</a>, the toledhoth of the sons of Noah; V, <a onClick="return mV(\'Gen\',11,\'10-16\');">11:10-26</a>, the toledhoth of the sons of Shem; VI, <a onClick="return mV(\'Gen\',11,\'27-\');">11:27-25:11</A>, the toledhoth of Terah; VII, <a onClick="return mV(\'Gen\',25,\'12-18\');">25:12-18</a>, the toledhoth of Ishmael; VIII, <a onClick="return mV(\'Gen\',25,\'19-\');">25:19-35:29</A>, the toledhoth of Isaac; IX, <a onClick="return mV(\'Gen\',36,\'1-\');">36:1</A>-<a onClick="return mV(\'Gen\',37,1);">37:1</a>, the toledhoth of Esau (the fact that <a onClick="return mV(\'Gen\',36,9);">36:9</A>, in addition to the instance in verse <a onClick="return mV(\'Gen\',36,1);">1</a>, contains the word toledhoth a second time, is of no importance whatever for our discussion at this stage, as the entire chapter under any circumstances treats in some way of the history of the generations of Esau; see III, <span class="noTag">2:9</span>); X, <a onClick="return mV(\'Gen\',37,\'2-\');">37:2-50:26</a>, the toledhoth of Jacob. In each instance this superscription covers everything that follows down to the next superscription.<P>The no. 10</span> is here evidently not an accidental matter. In the articles <a href="study/isbe/search.html?string=EXODUS">EXODUS</a>, <a href="study/isbe/search.html?string=LEVITICUS">LEVITICUS</a>, <a href="study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT</a>, also in <a href="study/isbe/search.html?string=EZEKIEL">EZEKIEL</A>, it has been shown what role the typical nos. 4, 7, 10 and 12 play in the structure of the whole books and of the individual pericopes. (In the New Testament we meet with the same phenomenon, particularly in the Apocalypse of John; but compare also in Matthew\'s Gospel the 3 X 14 generations in <a onClick="return mV(\'Mat\',1,1);">Mt 1:1</a>ff, the 7 parables in <a onClick="return mV(\'Mat\',13,1);">13:1</a>ff, the 7 woes in <a onClick="return mV(\'Mat\',23,13);">23:13</a>ff.) In the same way the entire Book of Leviticus naturally falls into 10 pericopes (compare <a href="study/isbe/search.html?string=LEVITICUS,+1">LEVITICUS, II,2,1</A>), and <a onClick="return mV(\'Lev\',19,\'1-\');">Le 19</a> contains 10 groups, each of 4 (possibly also of 5) commandments; compare possibly also <a onClick="return mV(\'Lev\',18,\'6-18\');">18:6-18</A>; <a onClick="return mV(\'Lev\',20,\'9-18\');">20:9-18</a>; see <a href="study/isbe/search.html?string=LEVITICUS,+1">LEVITICUS, II,2,21,VI.</a><p>Further, the no. 10, with a greater or less degree of certainty, can be regarded as the basis for the construction of the pericopes: <a onClick="return mV(\'Exd\',1,\'8-\');">Ex 1:8-7:7</a>; <a onClick="return mV(\'Exd\',7,\'8-\');">7:8-13:16</a> (10 plagues); <a onClick="return mV(\'Exd\',13,\'17-\');">13:17-18:27</a> (see <a href="study/isbe/search.html?string=EXODUS,+THE+BOOK+OF,+2">EXODUS, II, 2:1-3</a>); the Decalogue (<a onClick="return mV(\'Exd\',20,1);">20:1</a>ff); the first Book of the Covenant (<a onClick="return mV(\'Exd\',21,\'1-\');">21:1-23:13</span>; <a onClick="return mV(\'Exd\',23,\'14-19\');">23:14-19</A>), and the whole pericope <a onClick="return mV(\'Exd\',19,\'1-\');">19:1-24:18a</a>, as also <a onClick="return mV(\'Exd\',32,\'1-\');">32:1-35:3</a> (see <a href="study/isbe/search.html?string=EXODUS,+THE+BOOK+OF,+2">EXODUS, II, 2, 4, 6</A>). In the Book of Genesis itself compare further the 10 members from Shem to Abraham (<a onClick="return mV(\'Gen\',11,\'11-26\');">11:11-26</a>), as also the pericopes <a onClick="return mV(\'Gen\',25,\'19-\');">25:19-35:29</a>; <a onClick="return mV(\'Gen\',37,\'2-\');">37:2-50:26</a> (see III, 2, 8, 10 below), and the 10 nations in <a onClick="return mV(\'Gen\',15,19);">Ge 15:19</a>ff. And just as in the cases cited, in almost every instance, there is to be found a further division into 5 X 2 or 2 X 5 (compare, e.g. the two tables of the Decalogue); thus, too, in the Book of Genesis in each case, 5 of the 10 pericopes are more closely combined, since I-V (toledhoth of Shem inclusive) stand in a more distant, and VI-X (treating of the toledhoth of Terah, or the history of Abraham) in a closer connection with the kingdom of God; and in so far, too, as the first series of toledhoth bring into the foreground more facts and events, but the second series more individuals and persons. Possibly in this case, we can further unite 2 toledhoth; at any rate I and II (the primitive age), III and IV (Noah and his sons), VII and VIII (Ishmael and Isaac), IX and X (Esau and Jacob) can be thus grouped.<P>(2) Further Indication of Unity.<P>In addition to the systematic scheme so transparent in the entire Biblical text of the Book of Genesis, irrespective of any division into literary sources, it is to be noticed further, that in exactly the same way the history of those generations that were rejected from any connection with the kingdom of God is narrated before the history of those that remained in the kingdom of God and continued its development. Cain\'s history (<a onClick="return mV(\'Gen\',4,17);">4:17</a>ff) in Jahwist (Jahwist) stands before the history of Seth (<a onClick="return mV(\'Gen\',4,25);">4:25</A>f J; <a onClick="return mV(\'Gen\',5,3);">5:3</A>ff P); Japheth\'s and Ham\'s genealogy (<a onClick="return mV(\'Gen\',10,1);">10:1</a>ff P; <a onClick="return mV(\'Gen\',10,8);">10:8</a>ff P and J) before that of Shem (<a onClick="return mV(\'Gen\',10,21);">10:21</a>ff J and P), although Ham was the youngest of the three sons of Noah (<a onClick="return mV(\'Gen\',9,24);">9:24</A>); the further history of Lot (<a onClick="return mV(\'Gen\',19,29);">19:29</A>ff P and J) and of Ishmael\'s genealogy (<a onClick="return mV(\'Gen\',25,12);">25:12</a>ff P and J) before that of Isaac (<a onClick="return mV(\'Gen\',25,19);">25:19</a>ff P and J and E); Esau\'s descendants (<a onClick="return mV(\'Gen\',36,1);">36:1</a>ff R and P) before the toledhoth of Jacob (<a onClick="return mV(\'Gen\',37,2);">37:2</a>ff P and J and E).<P>In favor of the unity of the Biblical text we can also mention the fact that the Book of Genesis as a whole, irrespective of all sources, and in view of the history that begins with <a onClick="return mV(\'Exd\',1,\'1-\');">Ex 1</a>ff, has a unique character, so that e.g. the intimate communion with God, of the kind which is reported in the beginning of this Book of Genesis (compare, e.g. <a onClick="return mV(\'Gen\',3,8);">3:8</a>; <a onClick="return mV(\'Gen\',7,16);">7:16</a>; <a onClick="return mV(\'Gen\',11,5);">11:5</a> J; <a onClick="return mV(\'Gen\',17,1,22);">17:1, 22</a>; <a onClick="return mV(\'Gen\',35,9,13</a>);">35:9,13</a> P; <a onClick="return mV(\'Gen\',18,1);">18:1</a>ff; <a onClick="return mV(\'Gen\',32,31);">32:31</a> J), afterward ceases; and that in Exodus, on the other hand, many more miracles are reported than in the Book of Genesis (see <a href="study/isbe/search.html?string=EXODUS,+THE+BOOK+OF,+3-4">EXODUS, III, 2</A>); that Genesis contains rather the history of mankind and of families, while Exodus contains that of the nation (see I, 2 above); that it is only in Exodus that the law is given, while in the history of the period of the patriarchs we find only promises of the Divine grace; that all the different sources ignore the time that elapses between the close of Genesis and the beginning of Exodus; and further, that nowhere else is found anything like the number of references to the names of persons or things as are contained in Genesis (compare, e.g. <a onClick="return mV(\'Gen\',2,23);">2:23</a>; <a onClick="return mV(\'Gen\',3,20);">3:20</a>; <a onClick="return mV(\'Gen\',4,1,25);">4:1, 25</a>, etc., in J; <a onClick="return mV(\'Gen\',17,5,15,\'17-20\');">17:5, 15, 17-20</a>, etc., in P; <a onClick="return mV(\'Gen\',21,9,17,31);">21:9, 17, 31</a>, etc., in E; <a onClick="return mV(\'Gen\',21,6);">21:6</a>; <a onClick="return mV(\'Gen\',27,36);">27:36</a>, etc., in J and E; <a onClick="return mV(\'Gen\',28,19);">28:19</a>, etc., in R; <a onClick="return mV(\'Gen\',49,8,16,19);">49:8,16,19</a>, etc., in the blessing of Jacob); that the changing of the names of Abram and Sarai to Abraham and Sarah from <a onClick="return mV(\'Gen\',17,5,15);">Ge 17:5, 15</a> goes on through all the sources, while before this it is not found in any source. Finally, we would draw attention to the psychologically finely drawn portraits of Biblical persons in Genesis. The fact that the personal pronoun hu\' and the noun na\'ar are used of both masculine and feminine genders is characteristic of Genesis in common with all the books of the Pentateuch, without any difference in this regard being found in the different documents, which fact, as all those cited by us in no. 1 above, militates against the division of this book into different sources. Let us now examine more closely the reason assigned for the division into different sources.<P>2. Rejection of the Documentary Theory:<P>(1) In General.<P>(a) Statement of Theory:<P>Old Testament scholars of the most divergent tendencies are almost unanimous in dividing the Biblical text of Genesis into the sources the Priestly Code (P), Jahwist and Elohist, namely Priestly Codex, Jahwist, and Elohist. To P are attributed the following greater and connected parts: <a onClick="return mV(\'Gen\',1,\'1-\');">1:1</a>-<a onClick="return mV(\'Gen\',2,\'1-5\');">2:4a; 5</a>; a part of the story of the Deluge in chapters <a onClick="return mV(\'Gen\',6,\'1-\');">6-9</a>; <a onClick="return mV(\'Gen\',11,10);">11:10</a>ff; <a onClick="return mV(\'Gen\',11,17,\'23-\');">17</A>; <a onClick="return mV(\'Gen\',23,\'1-\');">23</A>; <a onClick="return mV(\'Gen\',25,12);">25:12</A>ff; <a onClick="return mV(\'Gen\',35,22);">35:22</a>bff; the most of <a onClick="return mV(\'Gen\',36,\'1-\');">36</A>. As examples of the parts assigned to J we mention <a onClick="return mV(\'Gen\',4,\'4-\');">2:4b-4:26</a>; the rest of the story of the Deluge in chapters <a onClick="return mV(\'Gen\',6,\'1-\');">6-9</a>; <a onClick="return mV(\'Gen\',11,1);">11:1</a>ff; <a onClick="return mV(\'Gen\',12,\'1-\');">12</a>f; <a onClick="return mV(\'Gen\',16,\'1-\');">16</a>; <a onClick="return mV(\'Gen\',18,\'1-\');">18</a>f; with the exception of a few verses, which are ascribed to P; chapter <a onClick="return mV(\'Gen\',24,\'1-\');">24</a> and others. Connected parts belonging to the Elohist (E) are claimed to begin with chapters <a onClick="return mV(\'Gen\',20,\'1-\');">20</a> and <a onClick="return mV(\'Gen\',21,\'1-\');">21</a> (with the exception of a number of verses which are attributed to P or J or R), and it is thought that, beginning with chapter <a onClick="return mV(\'Gen\',22,\'1-\');">22</a>, E is frequently found in the history of Jacob and of Joseph (<a onClick="return mV(\'Gen\',22,\'19-\');">25:19-50:26</a>), in part, however, interwoven with J (details will be found under III, in each case under 2). This documentary theory has hitherto been antagonized only by a few individuals, such as Klostermann, Lepsius, Eerdmans, Orr, Wiener, and the author of the present article.<P>(b) Reasons Assigned for Divisions:<P>As is well known, theory of separation of certain books of the Old Testament into different sources began originally with the Book of Genesis. The use made of the two names of God, namely Yahweh (Yahweh) and Elohim, caused Astruc to conclude that two principal sources had been used in the composition of the book, although other data were also used in vindication of theory; and since the days of Ilgen the conviction gained ground that there was a second Elohist (now called E), in contradistinction to the first (now called the Priestly Code (P), to whom, e.g., <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> is ascribed). This second Elohist, it was claimed, also made use of the name Elohim, as did the first, but in other respects he shows greater similarity to the Jahwist. These sources were eventually traced through the entire Pentateuch and into later books, and for this reason are discussed in detail in the article <a href="study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>. In this article we must confine ourselves to the Book of Genesis, and limit the discussion to some leading points. In addition to the names for God (see under 2), it is claimed that certain contradictions and duplicate accounts of the same matters compel us to accept different sources. Among these duplicates are found, e.g., <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1:1-2:4</a> a the Priestly Code (P), and <a onClick="return mV(\'Gen\',2,\'4-\');">2:4b</a>ff J, containing two stories of creation; <a onClick="return mV(\'Gen\',12,9);">Ge 12:9</a>ff J; <a onClick="return mV(\'Gen\',20,1);">20:1</a>ff E; <a onClick="return mV(\'Gen\',26,1);">26:1</a>ff J; with the narrative of how Sarah and Rebekah, the wives of the two patriarchs, were endangered; chapters <a onClick="return mV(\'Gen\',15,\'1-\');">15</a> J and <a onClick="return mV(\'Gen\',17,\'1-\');">17</a> the Priestly Code (P), with a double account of how God concluded His covenant with Abraham; <a onClick="return mV(\'Gen\',21,22);">21:22</a>ff E and <a onClick="return mV(\'Gen\',26,12);">26:12</a>ff J, the stories of Abimelech; chapters <a onClick="return mV(\'Gen\',16,\'1-\');">16</a> J and <a onClick="return mV(\'Gen\',21,\'1-\');">21</a> E, the Hagar episodes; <a onClick="return mV(\'Gen\',28,10);">28:10</a>ff J and E and <a onClick="return mV(\'Gen\',35,1);">35:1</a>ff E and the Priestly Code (P), the narratives concerning Bethel, and in the history of Joseph the mention made of the Midianites E, and of the Ishmaelites J, who took Joseph to Egypt (<a onClick="return mV(\'Gen\',37,25);">37:25</A>ff; <a onClick="return mV(\'Gen\',39,1);">39:1</A>); the intervention of Reuben E, or Judah J, for Joseph, etc. In addition a peculiar style, as also distinct theological views, is claimed for each of these sources. Thus there found in P a great deal of statistical and systematic material, as in <a onClick="return mV(\'Gen\',5,1);">5:1</a>ff; <a onClick="return mV(\'Gen\',11,10);">11:10</a>ff; <a onClick="return mV(\'Gen\',25,12);">25:12</a>ff; <a onClick="return mV(\'Gen\',36,6);">36:6</a>ff (the genealogies of Adam, Shem, Ishmael, Esau); P is said to show a certain preference for fixed schemes and for repetitions in his narratives. He rejects all sacrifices earlier than the Mosaic period, because according to this source the Lord did not reveal himself as Yahweh previous to <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff. Again, it is claimed that the Elohist (E) describes God as speaking to men from heaven, or through a dream, and through an angel, while according to J Yahweh is said to have conversed with mankind personally. In regard to the peculiarities of language used by the different sources, it is impossible in this place to enumerate the different expressions, and we must refer for this subject to the different Introductions to the Old Testament, and to the commentaries and other literature. A few examples are to be found under (c) below, in connection with the discussion of the critical hypothesis. Finally, as another reason for the division of Genesis into different sources, it is claimed that the different parts of the sources, when taken together, can be united into a smooth and connected story. The documents, it is said, have in many cases been taken over word for word and have been united and interwoven in an entirely external manner, so that it is still possible to separate them and often to do this even down to parts of a sentence or to the very words.<P>(c) Examination of the Documentary Theory:<P>(i) Style and Peculiarities of Language:<P>It is self-evident that certain expressions will be repeated in historical, in legal, and in other sections similar in content; but this is not enough to prove that there have been different sources. Whenever J brings genealogies or accounts that are no less systematic than those of P (compare <a onClick="return mV(\'Gen\',4,17);">Ge 4:17</a>ff; <a onClick="return mV(\'Gen\',10,8);">10:8</a>ff; <a onClick="return mV(\'Gen\',22,\'20-24\');">22:20-24</a>); or accounts and repetitions occur in the story of the Deluge (<a onClick="return mV(\'Gen\',7,2,7);">Ge 7:2, 7</a>; <a onClick="return mV(\'Gen\',7,4,12,17);">7:4, 12, 17</a>; <a onClick="return mV(\'Gen\',8,6);">8:6</a>; <a onClick="return mV(\'Gen\',7,4);">7:4</a>; <a onClick="return mV(\'Gen\',8,8,10,12);">8:8, 10, 12</a>), this is not enough to make the division into sources plausible. In reference to the linguistic peculiarities, it must be noted that the data cited to prove this point seldom agree. Thus, e.g. the verb bara\', "create," in <a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a> is used to prove that this was written by the Priestly Code (P), but the word is found also in <a onClick="return mV(\'Gen\',6,7);">6:7</a> in J. The same is the case with the word rekhush, "possession," which in <a onClick="return mV(\'Gen\',12,5);">12:5</a>; <a onClick="return mV(\'Gen\',13,6);">13:6</a>; <a onClick="return mV(\'Gen\',36,7);">36:7</A> is regarded as characteristic of the Priestly Code (P), but in <a onClick="return mV(\'Gen\',14,11,16,21);">14:11f; 16, 21</A> is found in an unknown source, and in <a onClick="return mV(\'Gen\',15,4);">15:14</a> in J. In <a onClick="return mV(\'Gen\',12,5);">12:5</a>; <a onClick="return mV(\'Gen\',13,12);">13:12a</a>; <a onClick="return mV(\'Gen\',16,3);">16:3</a>; <a onClick="return mV(\'Gen\',17,8);">17:8</a> it is said that \'erets kena\'an, "land of Canaan," is a proof that this was written by P; but in chapters <a onClick="return mV(\'Gen\',42,\'1-\');">42</a>; <a onClick="return mV(\'Gen\',42,\'1-\');">44</a>f; <a onClick="return mV(\'Gen\',47,\'1-\');">47</a>; <a onClick="return mV(\'Gen\',50,\'1-\');">50</a> we find this expression in Jahwist and Elohist, in <a onClick="return mV(\'Num\',32,32);">Nu 32:32</a> in J (R); compare also <a onClick="return mV(\'Num\',33,40);">Nu 33:40</a> (PR) where <a onClick="return mV(\'Num\',21,\'1-3\');">Nu 21:1-3</a> (JE) is quoted; shiphchah, "maid servant," is claimed as a characteristic word of J in contrast to E (compare <a onClick="return mV(\'Gen\',16,1);">16:1</A>ff); but in <a onClick="return mV(\'Gen\',16,3);">16:3</a>; <a onClick="return mV(\'Gen\',29,24,29);">29:24, 29</a> we find this word not only in P but in <a onClick="return mV(\'Gen\',20,14);">20:14</A>; <a onClick="return mV(\'Gen\',30,4,7,18);">30:4,7,18</a>; in E Min, "kind," is counted among the marks of P (compare e.g. <a onClick="return mV(\'Gen\',1,11);">1:11</A>ff), but in <a onClick="return mV(\'Deu\',14,13,14,18);">De 14:13-14, 18</a> we find it in Deuteronomy; rather remarkably, too, in the latest find on the Deluge made by Hilprecht and by him ascribed to 2100 BC. Compare on this subject my book, Wider den Bann der Quellenscheidung, and Orr, POT, chapter vii, section vi, and chapter x, section i; perhaps, too, the Concordance of Mandelkern under the different words. Even in the cases when the characteristic peculiarities claimed for the sources are correct, if the problem before us consisted only in the discovery of special words and expressions in the different sources, then by an analogous process, we could dissect and sever almost any modern work of literature. Particularly as far as the pieces are concerned, which are assigned to the Priestly Code (P), it must be stated that <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> and <a onClick="return mV(\'Gen\',23,\'1-\');">23</a> are, as far as style and language are concerned, different throughout. <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> is entirely unique in the entire Old Testament. <a onClick="return mV(\'Gen\',23,\'1-\');">Ge 23</a> has been copied directly from life, which is pictured with exceptional fidelity, and for this reason cannot be claimed for any special source. The fact that the story of the introduction of circumcision in <a onClick="return mV(\'Gen\',17,\'1-\');">Ge 17</a> in many particulars shows similarities to the terminology of the law is entirely natural: The same is true when the chronological accounts refer one date to another and when they show a certain typical character, as is, e.g., the case also in the chronological parts of any modern history of Israel. On the other hand, the method of P in its narratives, both in matter and in form, becomes similar to that of Jahwist and Elohist, just as soon as we have to deal with larger sections; compare <a onClick="return mV(\'Gen\',28,1);">Ge 28:1</a>ff; <a onClick="return mV(\'Gen\',35,9);">35:9</a>ff; <a onClick="return mV(\'Gen\',47,5);">47:5</a>ff, and all the more in Exodus and Numbers.<P>Against the claim that P had an independent existence, we must mention the fact of the unevenness of the narratives, which, by the side of the fuller accounts in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>; <a onClick="return mV(\'Gen\',17,\'1-\');">17</a> and <a onClick="return mV(\'Gen\',23,\'1-\');">23</a>, of the genealogies and the story of the Deluge, would, according to the critics, have reported only a few disrupted notices about the patriarchs; compare for this in the story of Abraham, <a onClick="return mV(\'Gen\',11,27,31);">11:27,31</a>f; <a onClick="return mV(\'Gen\',12,4);">12:4b</a>f; <a onClick="return mV(\'Gen\',13,6,11,12);">13:6a, 11b, 12a</a>; <a onClick="return mV(\'Gen\',16,1,3,15);">16:1a, 3, 15</a>f; <a onClick="return mV(\'Gen\',19,29);">19:29</A>; <a onClick="return mV(\'Gen\',21,1,\'2-5\');">21:1b, 2b-5</A>; <a onClick="return mV(\'Gen\',25,\'7-11\');">25:7-11a</a>; and in its later parts P would become still more incomprehensible on the assumption of the critics (see III below). No author could have written thus; at any rate he would not have been used by anybody, nor would there have been such care evinced in preserving his writings.<P>(i) Alleged Connection of Matter:<P>The claim that the different sources, as they have been separated by critics, constitute a compact and connected whole is absolutely the work of imagination, and is in conflict with the facts in almost every instance. This hypothesis cannot be consistently applied, even in the case of the characteristic examples cited to prove the correctness of the documentary theory, such as the story of the Deluge (see III, 2, in each case under (2)).<P>(ii) The Biblico-Theological Data:<P>The different Biblical and theological data, which are said to be characteristic in proof of the separation into sources, are also misleading. Thus God in J communes with mankind only in the beginning (<a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a>f; <a onClick="return mV(\'Gen\',7,16);">7:16</A>ff; <a onClick="return mV(\'Gen\',11,5);">11:5</a>; <a onClick="return mV(\'Gen\',18,\'1-\');">18</A>f), but not afterward. In the beginning He does this also, according to the Priestly Code (P), whose conception of God, it is generally claimed, was entirely transcendental (compare <a onClick="return mV(\'Gen\',17,1,22);">Ge 17:1, 22</a>; <a onClick="return mV(\'Gen\',35,9,13);">35:9, 13</a>). The mediatorship of the Angel of Yahweh is found not only in E, (<a onClick="return mV(\'Gen\',21,17);">Ge 21:17</a>, \'Elohim), but also in J (<a onClick="return mV(\'Gen\',16,7,9,10,11);">Ge 16:7, 9-11</a>). In <a onClick="return mV(\'Gen\',22,11);">22:11</a> in E, the angel of Yahweh (not of the \'Elohim) calls from heaven; theophanies in the night or during sleep are found also in J (compare <a onClick="return mV(\'Gen\',15,12);">Ge 15:12</a>ff; <a onClick="return mV(\'Gen\',26,24);">26:24</A>; <a onClick="return mV(\'Gen\',28,\13-16\');">28:13-16</a>; <a onClick="return mV(\'Gen\',32,27);">32:27</a>). In the case of the Priestly Code (P), the cult theory, according to which it is claimed that this source does not mention any sacrifices before <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff, is untenable. If it is a fact that theocracy, as it were, really began only in <a onClick="return mV(\'Exd\',6,\'1-\');">Ex 6</a>, then it would be impossible that P would contain anything of the cults before <a onClick="return mV(\'Exd\',6,\'1-\');">Ex 6</a>; but we have in P the introduction of the circumcision in <a onClick="return mV(\'Gen\',17,\'1-\');">Ge 17</a>; of the Sabbath in <a onClick="return mV(\'Gen\',2,1);">2:1</a>ff; and the prohibition against eating blood in <a onClick="return mV(\'Gen\',9,1);">9:1</a>ff; and in addition the drink offerings mentioned in <a onClick="return mV(\'Gen\',35,14);">35:14</a>, which verse stands between <a onClick="return mV(\'Gen\',35,13);">35:13</a> and <a onClick="return mV(\'Gen\',35,15);">15</a>, and, ascribed to the Priestly Code (P), is only in the interests of this theory attributed to the redactor. If then theory here outlined is not tenable as far as P is concerned, it would, on the other hand, be all the more remarkable that in the story of the Deluge the distinction between the clean and the unclean (<a onClick="return mV(\'Gen\',7,2,8);">7:2ff. 8</A>) is found in J, as also the savor of the sacrifice, with the term reach ha-nichoach, which occurs so often in P (compare <a onClick="return mV(\'Gen\',8,21);">Ge 8:21</a> with <a onClick="return mV(\'Num\',15,3,7,10,13,24);">Nu 15:3, 7, 10, 13f; 24</a>; <a onClick="return mV(\'Gen\',18,17);">18:17</a>); that the sacrifices are mentioned in <a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>ff, and the no. 7 in connection with the animals and days in <a onClick="return mV(\'Gen\',7,4);">7:4</a>; <a onClick="return mV(\'Gen\',8,8,10,12);">8:8,10,12</a> (compare in the Priestly Code (P), e.g. <a onClick="return mV(\'Lev\',8,33);">Le 8:33</a>; <a onClick="return mV(\'Lev\',13,5,21,26,31,33,50,54);">13:5f;21,26f,31,33,50,54</a>; <a onClick="return mV(\'Gen\',14,8,38);">14:8f; 38 f</A>; <a onClick="return mV(\'Gen\',14,7,51);">14:7,51</A>; <a onClick="return mV(\'Gen\',16,14);">16:14</a>f; <a onClick="return mV(\'Num\',28,11);">Nu 28:11</a>; <a onClick="return mV(\'Num\',29,8);">29:8</a>, etc.); further, that the emphasis is laid on the 40 days in <a onClick="return mV(\'Gen\',7,4,12,17);">Ge 7:4, 12, 17</a>; <a onClick="return mV(\'Gen\',8,6);">8:6</a> (compare in the Priestly Code (P), <a onClick="return mV(\'Exd\',24,\'1-8\');">Ex 24:1-8</a>; <a onClick="return mV(\'Lev\',12,\'2-4\');">Le 12:2-4</a>; <a onClick="return mV(\'Num\',13,25);">Nu 13:25</a>; <a onClick="return mV(\'Num\',14,34);">14:34</a>), all of which are ascribed, not as we should expect, to the Levitical the Priestly Code (P), but to the prophetical J. The document the Priestly Code (P), which, according to a large number of critics, was written during the Exile (see e.g. <a href="study/isbe/search.html?string=LEVITICUS,+2">LEVITICUS, III,1</A>, or <a href="study/isbe/search.html?string=EZEKIEL">EZEKIEL, sec. II, 2</A>) in a most surprising manner, instead of giving prominence to the person of the high priest, would then have declared that kings were to be the greatest blessings to come to the seed of Abraham (<a onClick="return mV(\'Gen\',17,6,16);">Ge 17:6, 16</a>); and while, on the critical assumption, we should have the right to expect the author to favor particularistic tendencies, he, by bringing in the history of all mankind in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1-11</a>, and in the extension of circumcision to strangers (<a onClick="return mV(\'Gen\',17,12,23);">17:12, 23</A>), would have displayed a phenomenal universality. The strongest counter-argument against all such minor and incorrect data of a Biblical and a theological character will always be found in the uniform religious and ethical spirit and world of thought that pervade all these sources, as also in the unity in the accounts of the different patriarchs, who are pictured in such a masterly, psychological and consistent manner, and who could never be the result of an accidental working together and interweaving of different and independent sources (see III below).<P>(iii) Duplicates:<P>In regard to what is to be thought of the different duplicates and contradictions, see below under III, 2, in each case under (2).<P>(iv) Manner in Which the Sources Are Worked Together:<P>But it is also impossible that these sources could have been worked together in the manner in which the critics claim that this was done. The more arbitrarily and carelessly the redactors are thought to have gone to work in many places in removing contradictions, the more incomprehensible it becomes that they at other places report faithfully such contradictions and permit these to stand side by side, or, rather, have placed them thus. And even if they are thought not to have smoothed over the difficulties anywhere, and out of reverence for their sources, not to have omitted or changed any of these reports, we certainly would have a right to think that even if they would have perchance placed side by side narratives with such enormous contradictions as there are claimed to be, e.g. in the story of the Deluge in P and J, they certainly would not have woven these together. If, notwithstanding, they still did this without harmonizing them, why are we asked to believe that at other places they omitted matters of the greatest importance (see III, 2, 3)? Further, J and E would have worked their materials together so closely at different places that a separation between the two would be an impossibility, something that is acknowledged as a fact by many Old Testament students; yet, notwithstanding, the contradictions, e.g. in the history of Joseph, have been allowed to stand side by side in consecutive verses, or have even intentionally been placed thus (compare, e.g. <a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>ff). Then, too, it is in the nature of things unthinkable that three originally independent sources for the history of Israel should have constituted separate currents down to the period after Moses, and that they could yet be dovetailed, often sentence by sentence, in the manner claimed by the critics. In conclusion, the entire hypothesis suffers shipwreck through those passages which combine the peculiarities of the different sources, as e.g. in <a onClick="return mV(\'Gen\',20,18);">Ge 20:18</a>, which on the one hand constitutes the necessary conclusion to the preceding story from E (compare <a onClick="return mV(\'Gen\',20,17);">20:17</A>), and on the other hand contains the name Yahweh; or in <a onClick="return mV(\'Gen\',22,14);">22:14</A>ff, which contains the real purpose of the story of the sacrificing of Isaac from E, but throughout also shows the characteristic marks of J; or in <a onClick="return mV(\'Gen\',39,1);">39:1</A>, where the so-called private person into whose house Joseph has been brought, according to J, is more exactly described as the chief of the body-guard, as this is done by E, in <a onClick="return mV(\'Gen\',40,2,4);">40:2, 4</a>. And when the critics in this passage appeal to the help of the redactor (editor), this is evidently only an ill-concealed example of a "begging of the question." In chapter <a onClick="return mV(\'Gen\',34,\'1-\');">34</a>, and especially in chapter <a onClick="return mV(\'Gen\',14,\'1-\');">14</a>, we have a considerable number of larger sections that contain the characteristics of two or even all three sources, and which accordingly furnish ample evidence for protesting against the whole documentary theory.<P>(v) Criticism Carried to Extremes:<P>All the difficulties that have been mentioned grow into enormous proportions when we take into consideration the following facts: To operate with the three sources J, E and P seems to be rather an easy process; but if we accept the principles that underlie this separation into sources, it is an impossibility to limit ourselves to these three sources, as a goodly number of Old Testament scholars would like to do, as Strack, Kittel, Oettli, Dillmann, Driver. The stories of the danger that attended the wives of the Patriarchs, as these are found in <a onClick="return mV(\'Gen\',12,9);">Ge 12:9</a>ff and in <a onClick="return mV(\'Gen\',26,1);">26:1</a>ff, are ascribed to J, and the story as found in <a onClick="return mV(\'Gen\',20,1);">Ge 20:1</a>ff to E. But evidently two sources are not enough in these cases, seeing that similar stories are always regarded as a proof that there have been different authors. Accordingly, we must claim three authors, unless it should turn out that these three stories have an altogether different signification, in which case they report three actual occurrences and may have been reported by one and the same author. The same use is made of the laughter in connection with the name Isaac in <a onClick="return mV(\'Gen\',17,17);">Ge 17:17</a>; <a onClick="return mV(\'Gen\',18,12);">18:12</a>; <a onClick="return mV(\'Gen\',21,6);">21:6</a>, namely, to substantiate the claim for three sources, P and J and E. But since <a onClick="return mV(\'Gen\',21,9);">21:9</A> E; <a onClick="return mV(\'Gen\',26,8);">26:8</a> J also contain references to this, and as in <a onClick="return mV(\'Gen\',21,6);">21:6</a> JE, in addition to the passage cited above, there is also a second reference of this kind, then, in consistency, the critics would be compelled to accept six sources instead of three (Sievers accepts at least 5, Gunkel 4); or all of these references point to one and the same author who took pleasure in repeating such references. As a consequence, in some critical circles scholars have reached the conclusion that there are also such further sources as J1 and Later additions to J, as also E1 and Later additions to E (compare Budde, Baudissin, Cornill, Holzinger, Kautzsch, Kuenen, Sellin). But Sievers has already discovered five subordinate sources of J, six of the Priestly Code (P), and three of E, making a total of fourteen independent sources that he thinks can yet be separated accurately (not taking into consideration some remnants of J, E and P that can no longer be distinguished from others). Gunkel believes that the narratives in Genesis were originally independent and separate stories, which can to a great extent yet be distinguished in their original form. But if J and E and P from this standpoint are no longer authors but are themselves, in fact, reduced to the rank of collectors and editors, then it is absurd to speak any more of distinct linguistic peculiarities, or of certain theological ideas, or of intentional uses made of certain names of God in J and E and the Priestly Code (P), not to say anything of the connection between these sources, except perhaps in rare cases. Here the foundations of the documentary theory have been undermined by the critics themselves, without Sievers or Gunkel or the other less radical scholars intending to do such a thing. The manner in which these sources are said to have been worked together naturally becomes meaningless in view of such hypotheses. The modern methods of dividing between the sources, if consistently applied, will end in splitting the Biblical text into atoms; and this result, toward which the development of Old Testament criticism is inevitably leading, will some day cause a sane reaction; for through these methods scholars have deprived themselves of the possibility of explaining the blessed influence which these Scriptures, so accidentally compiled according to their view, have achieved through thousands of years. The success of the Bible text, regarded merely from a historical point of view, becomes for the critic a riddle that defies all solutions, even if all dogmatical considerations are ignored.<P>(2) Rejection of Documentary Theory In View of the Names for God.<P>(a) Error of Hypothesis in Principle:<P>The names of God, Yahweh and Elohim, constituted for Astruc the starting-point for the division of Genesis into different sources (see (1) above). Two chief sources, based on the two names for God, could perhaps as a theory and in themselves be regarded as acceptable. If we add that in <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff, in the Priestly Code (P), we are told that God had not revealed Himself before the days of Moses by the name of Yahweh, but only as "God Almighty," it seems to be the correct thing to separate the text, which reports concerning the times before Moses and which in parts contains the name Yahweh, into two sources, one with Yahweh and the other with Elohim. But just as soon as we conclude that the use made of the two names of God proves that there were three and not two sources, as is done from <a onClick="return mV(\'Gen\',20,\'1-\');">Ge 20</a> on, the conclusive ground for the division falls away. The second Elohist (E), whom Ilgen was the first to propose (see (1) above), in principle and a priori discredits the whole hypothesis. This new source from the very outset covers all the passages that cannot be ascribed to the Yahweh or the Elohist portions; whatever portions contain the name Elohim, as P does, and which nevertheless are prophetical in character after the manner of J, and accordingly cannot be made to fit in either the Jahwistic or the Elohistic source, seek a refuge in this third source. Even before we have done as much as look at the text, we can say that according to this method everything can be proved. And when critics go so far as to divide J and E and P into many subparts, it becomes all the more impossible to make the names for God a basis for this division into sources. Consistently we could perhaps in this case separate a Yahweh source, an Elohim source, a ha-\'Elohim source, an \'El Shadday source, an \'Adhonay source, a Mal\'akh Yahweh source, a Mal\'akh \'Elohim source, etc., but unfortunately these characteristics of the sources come into conflict in a thousand cases with the others that are claimed to prove that there are different sources in the Book of Genesis.<P>(b) False Basis of Hypothesis:<P>But the basis of the whole hypothesis itself, namely, <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff P; is falsely regarded as such. If Yahweh had really been unknown before the days of Moses, as <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff P is claimed to prove, how could J then, in so important and decisive a point in the history of the religious development of Israel, have told such an entirely different story? Or if, on the other hand, Yahweh was already known before the time of Moses, as we must conclude according to J, how was it possible for P all at once to invent a new view? This is all the more incredible since it is this author and none other who already makes use of the word Yahweh in the composition of the name of the mother of Moses, namely Jochebed (compare <a onClick="return mV(\'Exd\',6,20);">Ex 6:20</a> and <a onClick="return mV(\'Num\',26,59);">Nu 26:59</a>). In addition, we do not find at all in <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff that God had before this revealed Himself as \'Elohim, but as \'El Shadday, so that this would be a reason for claiming not an \'Elohim but an \'El Shadday source for P on the basis of this passage (compare <a onClick="return mV(\'Gen\',17,1);">17:1</a>; <a onClick="return mV(\'Gen\',28,3);">28:3</a>; <a onClick="return mV(\'Gen\',35,11);">35:11</A>; <a onClick="return mV(\'Gen\',48,3);">48:3</a> P—<a onClick="return mV(\'Gen\',43,14);">43:14</A> E! compare also <a onClick="return mV(\'Gen\',49,25);">49:25</A> in the blessing of Jacob). Finally, it is not at all possible to separate <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff P from that which immediately precedes, which is taken from JE and employs the name Yahweh; for according to the text of P we do not know who Moses and who Aaron really were, and yet these two are in <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff regarded as well-known persons. The new revelation of God in <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff (P) by the side of <a onClick="return mV(\'Gen\',3,1);">3:1</a>ff (JE and E) is also entirely defensible and rests on a good foundation; for Moses after the failure of <a onClick="return mV(\'Exd\',5,\'1-\');">Ex 5</a> needed such a renewed encouragement (see <a href="study/isbe/search.html?string=EXODUS,+THE+BOOK+OF,+2">EXODUS, sec. II,2,1</a>). If this is the case, then the revelation of the name of Yahweh in <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a>ff cannot mean that that name had before this not been known at all, but means that it had only been relatively unknown, i.e. that in the fullest and most perfect sense God became known only as Yahweh, while before this He had revealed His character only from certain sides, but especially as to His Almighty Power.<P>(c) Improbability That Distinction of Divine Names Is without Significance:<P>In view of the importance which among oriental nations is assigned to names, it is absolutely unthinkable that the two names Yahweh and Elohim had originally been used without any reference to their different meanings. The almost total omission of the name Yahweh in later times or the substitution of the name Elohim for it in <span class="noTag">Psalms 42-83</SPAN> is doubtless based in part on the reluctance which gradually arose in Israel to use the name at all; but this cannot be shown as probable for older times, in which it is claimed that E was written. In the case of P the rule, according to which the name Elohim is said to have been used for the pre-Mosaic period, and the reason for the omission of Yahweh would have been an entirely different one. Then, too, it would be entirely inexplicable why J should have avoided the use of the name Elohim. The word Elohim is connected with a root that signifies "to fear," and characterizes God from the side of His power, as this is, e.g., seen at once in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>. Yahweh is splendidly interpreted in <a onClick="return mV(\'Exd\',3,14);">Ex 3:14</a>ff; and the word is connected with the archaic form hawah for hayah, "to be," and the word characterizes God as the being who at all times continues to be the God of the Covenant, and who, according to <a onClick="return mV(\'Gen\',2,\'4-\');">Ge 2:4</a>-<a onClick="return mV(\'Gen\',3,\'1-24\');">3:24</a>, can manifestly be none other than the Creator of the universe in <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1:1</a>-<a onClick="return mV(\'Gen\',2,\'1-3\');">2:3</a>, even if from <a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12</a> on He, for the time being, enters into a special relation to Abraham, his family and his people, and by the use of the combined names Yahweh-Elohim is declared to be identical with the God who created the world, as e.g. this is also d
