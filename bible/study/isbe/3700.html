one in the section <a onClick="return mV(\'Exd\',7,\'8-\');">Ex 7:8-13:16</a>, where, in the 10 plagues, Yahweh\'s omnipotent power is revealed (compare <a href="study/isbe/search.html?string=EXODUS,+THE+BOOK+OF,+2">EXODUS, II,2,2</a>); and in <a onClick="return mV(\'Exd\',9,30);">9:30</a> it is charged against-Pharaoh and his courtiers, that they did not yet fear Yahweh-Elohim, i.e. the God of the Covenant, who at the same time is the God of the universe (compare also <a onClick="return mV(\'1Ki\',18,21,37,39);">1Ki 18:21, 37, 39</a>; <a onClick="return mV(\'Jon\',4,6);">Jon 4:6</a>).<P>(d) Real Purpose in Use of Names for God:<P>But now it is further possible to show clearly, in connection with a number of passages, that the different names for God are in Genesis selected with a perfect consciousness of the difference in their meanings, and that accordingly the choice of these names does not justify the division of the book into various sources.<P>(i) Decreasing Use of Yahweh:<P>The fact that the toledhoth of Terah, of Isaac, and of Jacob begin with the name Yahweh but end without this name. In the history of Abraham are to be noted the following passages: <a onClick="return mV(\'Gen\',12,1,4,7,17);">Ge 12:1,4,7,8,17</a>; <a onClick="return mV(\'Gen\',13,4,10,13,14,18);">13:4,10,13,14,18</a>; <a onClick="return mV(\'Gen\',14,22);">14:22</a>; <a onClick="return mV(\'Gen\',15,1,2,8);">15:1-2, 8</a>; <a onClick="return mV(\'Gen\',16,2,5,6,7,9,10,11,13);">16:2, 5-7, 9, 10-11, 13</a>; <a onClick="return mV(\'Gen\',17,1);">17:1</a>; in the history of Isaac: <a onClick="return mV(\'Gen\',25,21,22,23);">25:21,22,23</A>; <a onClick="return mV(\'Gen\',26,2,12,22,24,25,28,29);">26:2,12,22,24,25,28,29</a>; and in the toledhoth of Jacob <a onClick="return mV(\'Gen\',38,7,10);">38:7,10</A>; <a onClick="return mV(\'Gen\',39,2,3,5);">39:2,3,5</a>. In these passages the beginnings are regularly made with the name Yahweh, although with decreasing frequency before the name Elohim is used, and notwithstanding that in all these sections certain selections from P and E must also be considered in addition to J. Beginning with <a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12</a>, in which the story of the selection of Abraham is narrated, we accordingly find emphasized, at the commencement of the history of each patriarch, this fact that it is Yahweh, the God of the Covenant, who is determining these things. Beginning with <a onClick="return mV(\'Gen\',40,\'1-\');">Ge 40</a> and down to about <a onClick="return mV(\'Exd\',2,\'1-\');">Ex 2</a> we find the opposite to be the case, although J is strongly represented in this section, and we no longer find the name Yahweh (except in one passage in the blessing of Jacob, which passage has been taken from another source, and hence is of no value for the distinction of the sources J, E and P; this is the remarkable passage <a onClick="return mV(\'Gen\',49,18);">Ge 49:18</a>). In the same way the story of Abraham (<a onClick="return mV(\'Gen\',25,\'1-11\');">Ge 25:1-11</a>) closes without mention being made of the name of Yahweh, which name is otherwise found in all of these histories, except in <a onClick="return mV(\'Gen\',23,\'1-\');">Ge 23</a> (see below). The toledhoth of Isaac, too, use the name Yahweh for the last time in <a onClick="return mV(\'Gen\',32,10);">32:10</a>; and from this passage down to <a onClick="return mV(\'Gen\',37,2);">Ge 37:2</a> the name is not found. It is accordingly clear that in the history of the patriarchs there is a gradual decrease in the number of times in which the name Yahweh occurs, and in each case the decrease is more marked; and this is most noticeable and clearest in the history of Joseph, manifestly in order to make all the more prominent the fact that the revelation of God, beginning with <a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a>ff, is that of Yahweh. These facts alone make the division of this text into three sources J, E and P impossible.<P>(ii) Selection of the Names of God wtih Reference to the Approach of Man to God, and Departure from Him:<P>The fact, further, that the approach of an individual to God or his departure from God could find its expression in the different uses made of the names of God is seen in the following. In connection with Ishmael and Lot the name Yahweh can be used only so long as these men stood in connection with the kingdom of God through their relation to Abraham (compare <a onClick="return mV(\'Gen\',16,7,9,10,11,13);">Ge 16:7,9,10,11,13</a> and <a onClick="return mV(\'Gen\',13,10);">13:10</A>; <a onClick="return mV(\'Gen\',19,13,16);">19:13f; 16</A>), but only the name Elohim can be used as soon as they sever this connection (compare <a onClick="return mV(\'Gen\',21,12,17,19,20);">Ge 21:12,17,19,20</a> and <a onClick="return mV(\'Gen\',19,29);">19:29</A>). On the other hand, [\'Elohim] is used in the beginning of the history of the Gentile Abimelech (<a onClick="return mV(\'Gen\',20,3,6,11,13,17);">Ge 20:3, 6, 11, 13, 17</a>; <a onClick="return mV(\'Gen\',21,22);">21:22</a>f); while afterward, when he has come into closer relations to the patriarchs, the name Yahweh is substituted (<a onClick="return mV(\'Gen\',26,28,29);">Ge 26:28-29</a>). A similar progress is found in separate narratives of the patriarchs themselves, since in <a onClick="return mV(\'Gen\',22,1);">Ge 22:1</a>ff and chapter <a onClick="return mV(\'Gen\',28,\'1-\');">28</a> the knowledge of Elohim is changed into that of Yahweh (compare <a onClick="return mV(\'Gen\',22,1,3,9);">22:1,3,9</A> with <a onClick="return mV(\'Gen\',22,11,14,15,16);">22:11,14,15,16</A>, and <a onClick="return mV(\'Gen\',28,12);">28:12</A> with <a onClick="return mV(\'Gen\',28,13,16);">28:13,16</A>).<P>(iii) Other Reasons:<p>[\'Elohim] can, further, in many cases be explained on the basis of an implied or expressed contrast, generally over against men (compare <a onClick="return mV(\'Gen\',22,8,12);">Ge 22:8, 12</a>; in the second of these two passages the fear of God is placed in contrast to godlessness); <a onClick="return mV(\'Gen\',30,2);">Ge 30:2</a>; <a onClick="return mV(\'Gen\',31,50);">31:50</a>; <a onClick="return mV(\'Gen\',32,2);">32:2</a>f; compare with <a onClick="return mV(\'Gen\',32,4,8);">32:4 and 8</a>; <a onClick="return mV(\'Gen\',32,29);">32:29</a>; <a onClick="return mV(\'Gen\',35,5);">35:5</a>; or on the basis of an accommodation to the standpoint of the person addressed, as in <a onClick="return mV(\'Gen\',3,\'1-5\');">3:1-5</a> (serpent); <a onClick="return mV(\'Gen\',20,3,6,11,13,17);">20:3,6,11,13,17</a>; <a onClick="return mV(\'Gen\',23,6);">23:6</a>; <a onClick="return mV(\'Gen\',39,9);">39:9</a> (Gentiles); or on the basis of grammar, as in <a onClick="return mV(\'Gen\',23,6);">23:6</A>; <a onClick="return mV(\'Gen\',32,3);">32:3</a>; <a onClick="return mV(\'Gen\',28,17,22);">28:17,22</a>; because the composition with the proper name Yahweh could never express the indefinite article (a prince of God, a camp of God, a Bethel or house of prayer); or finally in consequence of the connection with earlier passages (compare<a onClick="return mV(\'Gen\',5,1);"> 5:1</A>ff with chapter <a onClick="return mV(\'Gen\',1,\'1-\');">1</a>; <a onClick="return mV(\'Gen\',21,2.4);">21:2,4</a>; <a onClick="return mV(\'Gen\',28,3);">28:3</a>ff; <a onClick="return mV(\'Gen\',35,9);">35:9</a>ff with chapter <a onClick="return mV(\'Gen\',17,\'1-\');">17</a>). A comparison of these passages shows that, of course, different reasons may have induced the author to select the name Elohim, e.g. <a onClick="return mV(\'Gen\',23,6);">23:6</a>; <a onClick="return mV(\'Gen\',28,12);">28:12</a>; <a onClick="return mV(\'Gen\',32,12);">32:12</a>.<P>(iv) Systematic Use in History of Abraham:<P>That the names for God are systematically used is finally attested by the fact that in the history of Abraham, after the extensive use of the name Yahweh in its beginning (see above), this name is afterward found combined with a large number of other and different names; so that in each case it is Yahweh of whom all further accounts speak, and yet the name of Yahweh is explained, supplemented and made clear for the consciousness of believers by the new appellations, while the full revelation of His being indeed begins only in <a onClick="return mV(\'Exd\',3,\'1-\');">Ex 3</a> and <a onClick="return mV(\'Exd\',6,1);">6:1</a>ff, at which place the different rays of His character that appeared in earlier times are combined in one brilliant light. The facts in the case are the following. In the story of Abraham, with which an epoch of fundamental importance in the history of revelation begins, we find Yahweh alone in <a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12</a>f. With the exception of chapter <a onClick="return mV(\'Gen\',23,\'1-\');">23</A>, where a characteristic appellation of God is not found, and <a onClick="return mV(\'Gen\',25,\'1-11\');">25:1-11</a>, where we can claim a decadence in the conception of the Divinity (concerning <a onClick="return mV(\'Gen\',23,6);">23:6</A>; <a onClick="return mV(\'Gen\',25,11);">25:11</a>; see above, the name of Yahweh is retained in all of these stories, as these have been marked out (III,2,6); but beginning with chapter <a onClick="return mV(\'Gen\',14,\'1-\');">14</a> they do not at all use any longer only one name for God. We here cite only those passages where, in each ease, for the first time a new name for God is added, namely, <a onClick="return mV(\'Gen\',14,18);">14:18</a>, \'El \'Elyon; <a onClick="return mV(\'Gen\',14,19);">14:19</a>, Creator of heaven and of earth; <a onClick="return mV(\'Gen\',15,2);">15:2</A>, \'Adhonay; <a onClick="return mV(\'Gen\',16,7);">16:7</A>, the Angel of Yahweh; <a onClick="return mV(\'Gen\',16,13);">16:13</A>, the God that seeth; <a onClick="return mV(\'Gen\',17,1);">17:1</A>, \'El Shadday; <a onClick="return mV(\'Gen\',17,3);">17:3</a>, \'Elohim; <a onClick="return mV(\'Gen\',17,18);">17:18</a>, ha-\'Elohim; chapters <a onClick="return mV(\'Gen\',18,\'1-\');">18</a>f; special relation to the three men (compare <a onClick="return mV(\'Gen\',18,2);">18:2</a> and <a onClick="return mV(\'Gen\',19,1);">19:1</a>); <a onClick="return mV(\'Gen\',18,25);">18:25</a>, the Judge of the whole earth; <a onClick="return mV(\'Gen\',20,13);">20:13</a>, \'Elohim constructed as a plural; <a onClick="return mV(\'Gen\',21,17);">21:17</a>, the Angel of God; <a onClick="return mV(\'Gen\',24,3);">24:3</A>, the God of heaven and the God of the earth; <a onClick="return mV(\'Gen\',24,12);">24:12</a>, the God of Abraham.<P>(e) Scantiness of the Materials for Proof:<P>If we add, finally, that to prove the hypothesis we are limited to the meager materials found in <a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a> through <a onClick="return mV(\'Exd\',6,1);">Ex 6:1</a> if; that in this comparatively small number of chapters <span class="noTag">Genesis 40 to Exodus 2</span> cannot be utilized in this discussion (see above under (d); that all those passages, in which J and E are inseparably united must be ignored in this discussion; that all other passages in which J and E are often and rapidly interchanged from the very outset are suspiciously akin to begging the question; that <a onClick="return mV(\'Gen\',20,18);">Ge 20:18</a>, which with its "Yahweh" is ascribed to R, is absolutely needed as the conclusion of the preceding Elohim story; that in <a onClick="return mV(\'Gen\',21,33);">21:33</A> with its "Yahweh" (Yahweh) in the Jahwist (Jahwist), on the other hand, the opening Elohim story from E, which is necessary for an explanation of the dwelling of Abraham in the south country, precedes; that the angel of Yahweh (<a onClick="return mV(\'Gen\',22,11);">22:11</a>) is found in E; that <a onClick="return mV(\'Gen\',2,\'4-\');">2:4</a>-<a onClick="return mV(\'Gen\',3,\'1-24\');">3:24</a> from J has besides Yahweh the name Elohim, and in <a onClick="return mV(\'Gen\',3,\'1-5\');">3:1b-5</a> only Elohim (see above); that in <a onClick="return mV(\'Gen\',17,1);">17:1</a>; <a onClick="return mV(\'Gen\',21,1);">21:1</a> P Yahweh is found; that <a onClick="return mV(\'Gen\',5,29);">5:29</a>, which is ascribed to J, is surrounded by portions of the Priestly Code (P), and contains the name Yahweh, and would be a torso, but in connection with chapter <a onClick="return mV(\'Gen\',5,\'1-\');">5</a> the Priestly Code (P), in reality is in its proper place, as is the intervening remark (<a onClick="return mV(\'Gen\',5,24);">5:24</a> P); that, on the other hand, in <a onClick="return mV(\'Gen\',4,25);">4:25</a>; <a onClick="return mV(\'Gen\',6,2,4);">6:2,4</a>; <a onClick="return mV(\'Gen\',7,9);">7:9</a>; <a onClick="return mV(\'Gen\',9,27);">9:27</a>; <a onClick="return mV(\'Gen\',39,9);">39:9</a> Elohim is found—in view of all these facts it is impossible to see how a greater confusion than this could result from the hypothesis of a division of the sources on the basis of the use made of the names of God. And then, too, it is from the very outset an impossibility, that in the Book of Genesis alone such an arbitrary selection of the names for God should have been made and nowhere else.<P>(f) Self-Disintegration of the Critical Position:<P>The modern critics, leaving out of consideration entirely their further dissection of the text, themselves destroy the foundation upon which this hypothesis was originally constructed, when Sievers demands for <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> (from P) an original Yahweh Elohim in the place of the Elohim now found there; and when others in <a onClick="return mV(\'Gen\',18,\'1-\');">Ge 18</a>f J claim an original Elohim; and when in <a onClick="return mV(\'Gen\',17,\'1-\');">17:1-21:1</a> the name Yahweh is said to have been intentionally selected by P.<P>(g) Different Uses in the Septuagint:<P>Naturally it is not possible to discuss all the pertinent passages at this place. Even if, in many cases, it is doubtful what the reasons were for the selection of the names for God, and even if these reasons cannot be determined with our present helps, we must probably, nevertheless, not forget that the Septuagint in its translation of Genesis in 49 passages, according to Eerdman\'s reckoning, and still more according to Wiener\'s, departs from the use of the names for God from the Hebrew original. Accordingly, then, a division of Genesis into different sources on the basis of the different names for God cannot be carried out, and the argument from this use, instead of proving the documentary theory, has been utilized against it.``122';
isbe[3735]='Genesis, 3`III. The Structure of the Individual Pericopes.<P>In this division of the article, there is always to be found (under 1) a consideration of the unity of the Biblical text and (under 2) the rejection of the customary division into different sources.<P>The conviction of the unity of the text of Genesis and of the impossibility of dividing it according to different sources is strongly confirmed and strengthened by the examination of the different pericopes. Here, too, we find the division on the basis of the typical Nos. 4,7,10,12. It is true that in certain cases we should be able to divide in a different way; but at times the intention of the author to divide according to these numbers practically compels acceptance on our part, so that it would be almost impossible to ignore this matter without detriment, especially since we were compelled to accept the same fact in connection with the articles <a href="study/isbe/search.html?string=EXODUS,+THE+BOOK+OF">EXODUS (II)</a>; <a href="study/isbe/search.html?string=LEVITICUS,+1">LEVITICUS (II, 2)</a>; <a href="study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT (I,2,1)</a>, and aIso <a href="study/isbe/search.html?string=EZEKIEL">EZEKIEL (I,2,2)</a>. But more important than these numbers, concerning the importance or unimportance of which there could possibly be some controversy, are the fundamental religious and ethical ideas which run through and control the larger pericopes of the [toledhoth] of Terah, Isaac and Jacob in such a way that it is impossible to regard this as merely the work of a redactor, and we are compelled to consider the book as the product of a single writer.<P>1. The Structure of the Proœmium (<a onClick="return mV(\'Gen\',1,\'1-\');">Genesis 1</A>-<a onClick="return mV(\'Gen\',2,1,2,3);">2:3</a>):<P>The structure of the proœmium (<a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1:1</a>-<a onClick="return mV(\'Gen\',2,1,2,3);">2:3</a>) is generally ascribed to P. Following the introduction (<a onClick="return mV(\'Gen\',1,1,2);">Ge 1:1-2</a>; creation of chaos), we have the creation of the seven days with the Sabbath as a conclusion. The first and the second three days correspond to each other (1st day, the light; 4th day, the lights; 2nd day, the air and water by the separation of the waters above and the waters below; 5th day, the animals of the air and of the water; 3rd day, the dry land and the vegetation; 6th day, the land animals and man; compare also in this connection that there are two works on each day). We find Exodus also divided according to the number seven (see <a href="study/isbe/search.html?string=EXODUS">EXODUS, II, 1</A>; compare also <a onClick="return mV(\'Exd\',24,\'18-\');">Ex 24:18b through 31:18</a>; see <a href="study/isbe/search.html?string=EXODUS">EXODUS, II,2,5</A>, where we have also the sevenfold reference to the Sabbath idea in Exodus, and that, too, repeatedly at the close of different sections, just as we find this here in Genesis); and in Leviticus compare chapters <a onClick="return mV(\'Lev\',23,\'1-\');">23</a>; <a onClick="return mV(\'Lev\',25,\'1-\');">25</A>; <a onClick="return mV(\'Lev\',27,\'1-\');">27</A>; see <a href="study/isbe/search.html?string=LEVITICUS">LEVITICUS, II,2,2</a>; the VIII, IX, and appendix; and in <a onClick="return mV(\'Gen\',4,17);">Ge 4:17</a>ff J; <a onClick="return mV(\'Gen\',5,\'1-24\');">5:1-24</a> P; <a onClick="return mV(\'Gen\',6,\'9-\');">6:9-9:29</a>; <a onClick="return mV(\'Gen\',36,\'1-\');">36:1</a>-<a onClick="return mV(\'Gen\',37,1);">37:1</a> (see under 2, 1,2,3,9).<P>2. Structure of the Ten Toledhoth:<P>The ten toledhoth are found in <span class="noTag">Ge 2:4-50:26</span>.<P>1. The Toledhoth of the Heavens and the Earth (<a onClick="return mV(\'Gen\',2,\'4-\');">Genesis 2:4-4:26</a>):<P>(1) The Biblical Text.<P>(a) <a onClick="return mV(\'Gen\',2,\'4-25\');">Ge 2:4-25</a>, Paradise and the first human beings;<P>(b) <a onClick="return mV(\'Gen\',3,\'1-24\');">3:1-24</a>, the Fall;<P>(c) <a onClick="return mV(\'Gen\',4,\'1-16\');">4:1-16</A>, Cain and Abel;<P>(d) <a onClick="return mV(\'Gen\',4,\'17-26\');">4:17-26</A>, the Cainites, in seven members (see under 1 above) and Seth. The no. 4 appears also in <a onClick="return mV(\'Gen\',5,\'1-\');">5:1</a>-<a onClick="return mV(\'Gen\',6,\'1-8\');">6:8</A> (see under 2); <a onClick="return mV(\'Gen\',10,\'1-\');">10:1</a>-<a onClick="return mV(\'Gen\',11,\'1-19\');">11:9</A> (see under 4); and especially <span class="noTag">11:27-25:11</A> (under 6). Evidently (a) and (b), (c) and (d) are still more closely connected.<P>(2) Rejection of the Division into Sources (<a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1:1</a>-<a onClick="return mV(\'Gen\',2,\'1-4\');">2:4a</a> P and <a onClick="return mV(\'Gen\',2,\'4-\');">2:4b through 4:26</a> J).<P>Ch <a onClick="return mV(\'Gen\',2,\'1-\');">2</a> does not contain a new account of creation with a different order in the works of creation. This section speaks of animals and plants, not for their own sakes, but only on account of their connection with man. The creation of the woman is only a further development of <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a>. While formerly the critics divided this section into <a onClick="return mV(\'Gen\',2,\'4-\');">2:4-4:26</a> J, they now cut it up into J1 and j2 (see under II, 2,1 (c) (because, they say, the tree of life is mentioned only in <a onClick="return mV(\'Gen\',2,9);">2:9</a> and <a onClick="return mV(\'Gen\',3,23);">3:23</A>, while in <a onClick="return mV(\'Gen\',2,17);">2:17</a> and <a onClick="return mV(\'Gen\',3,3);">3:3</A>ff the Divine command is restricted to the tree of knowledge of good and evil. But it is impossible to see why there should be a contradiction here, and just as little can we see why the two trees standing in the midst of the garden should not both have had their significance (compare <a onClick="return mV(\'Gen\',2,9);">2:9</A>; <a onClick="return mV(\'Gen\',3,3);">3:3</A>). It is further asserted that a division of J is demanded by the fact that the one part of J knows of the Fall (<a onClick="return mV(\'Gen\',6,9);">6:9</A>ff), and the other does not know of such a break in the development of mankind (<a onClick="return mV(\'Gen\',4,17);">4:17</a>ff). But the civilization attained by the Cainites could certainly have passed over also to the Sethites (see also <a onClick="return mV(\'Gen\',6,2);">6:2</a>); and through Noah and his sons have been continued after the Deluge. Then, too, the fact that Cain built a city (<a onClick="return mV(\'Gen\',4,17);">4:17</A>), and the fact that he became a fugitive and a wanderer (<a onClick="return mV(\'Gen\',4,12);">4:12</A>), are not mutually exclusive; just as the beginnings made with agriculture (<a onClick="return mV(\'Gen\',4,2);">4:12</A>) are perfectly consistent with the second fact.<P>2. The Toledhoth of Adam (<a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5:1</A>-<a onClick="return mV(\'Gen\',6,\'1-8\');">6:8</a>):<P>(1) The Biblical Text.<P>(a) <a onClick="return mV(\'Gen\',5,\'1-24\');">Ge 5:1-24</a>, seven generations from Adam to Lamech (see under 1, and <a onClick="return mV(\'Jud\',1,14);">Jude 1:14</a>);<P>(b) <a onClick="return mV(\'Gen\',5,\'25-32\');">Ge 5:25-32</a>, four generations from the oldest of men, Methuselah, down to the sons of Noah;<P>(c) <a onClick="return mV(\'Gen\',6,\'1-4\');">6:1-4</a>, intermingling of the sons of God and the sons of men; (d) <a onClick="return mV(\'Gen\',6,\5-8\');">6:5-8</a>, corruption of all mankind. Evidently at this place (a) and (b), (c) and (d) correspond with each other.<P>(2) Rejection of the Division into Sources (<a onClick="return mV(\'Gen\',5,\'1-\');">Genesis 5</a> P with the Exception of <a onClick="return mV(\'Gen\',5,29);">5:29</A> [see II,2,2 (e)]; <a onClick="return mV(\'Gen\',5,29);">5:29</A>; <a onClick="return mV(\'Gen\',6,\'1-8\');">6:1-8</a> J).<P><a onClick="return mV(\'Gen\',6,7);">Genesis 6:7</a> J presupposes chapter <a onClick="return mV(\'Gen\',1,\'1-\');">1</a> P; as, on the other hand, the fact that the generations that, according to chapter <a onClick="return mV(\'Gen\',5,\'1-\');">5</A> the Priestly Code (P), had in the meanwhile been born, die, presupposes the advent of sin, concerning which only J had reported in chapter <a onClick="return mV(\'Gen\',3,\'1-\');">3</a>. In the case of the Priestly Code (P), however, in <a onClick="return mV(\'Gen\',1,31);">1:31</A> it is said that everything was very good.<P>3. The Toledhoth of Noah (<a onClick="return mV(\'Gen\',6,\'9-\');">Genesis 6:9-9:29</a>):<P>(1) The Biblical Text.<P>Seven sections (see 1 above) viz:<P>(a) <a onClick="return mV(\'Gen\',6,\'9-22\');">Ge 6:9-22</a>, the building of the ark;<P>(b) <a onClick="return mV(\'Gen\',7,\'1-9\');">7:1-9</a>, entering the ark;<P>(c) <a onClick="return mV(\'Gen\',7,\'10-24\');">7:10-24</A>, the increase of the Flood;<P>(d) <a onClick="return mV(\'Gen\',8,\'1-14\');">8:1-14</a>, the decrease of the Flood;<P>(e) <a onClick="return mV(\'Gen\',8,\'15-19\');">8:15-19, leaving the ark;<P>(f) <a onClick="return mV(\'Gen\',8,\'22-\');">8:22</A>-<a onClick="return mV(\'Gen\',2,\'1-9\');">9:17</A>, declaration of a covenant relation between God and Noah;<P>(g) <a onClick="return mV(\'Gen\',9,\'18-29\');">9:18-29</A>, transfer of the Divine blessing upon Shem.<P>(2) Rejection of the Division into Sources (<a onClick="return mV(\'Gen\',7,\'1-5\',\'7-10\',12,16,17,22);">Genesis 7:1-5, 7-10, 12, 16b, 17,2 f</A>; <a onClick="return mV(\'Gen\',8,2,3,\'6-13\',20-21-22);">8:2b, 3a, 6-12,13b, 20-22</A>; <a onClick="return mV(\'Gen\',9,\'20-27\');">9:20-27</A> J, the Rest from P).<P>In all the sources are found the ideas that the Deluge was the punishment of God for sin; further, the deliverance of the righteous Noah and his wife and three sons Shem, Ham and Japheth and their wives; the deliverance of the different kinds of animals; the announcement of the covenant relations between God and mankind after the Deluge; the designation of the Deluge with the term mabbul and of the ark with tebhah. In the Babylonian account, which without a doubt stands in some connection with the Biblical, are found certain measurements of the ark, which in the Bible are only in the Priestly Code (P), as also the story of the sending out of the birds when the flood was decreasing, and of the sacrifices of those who had been delivered, which in the Bible are said to be found only in J; and these facts are a very powerful argument against the division into sources. Further, the Priestly Code (P), in case the critics were right, would have contained nothing of the thanks of Noah for his deliverance, although he was a pious man; and in the case of J we should not be informed what kind of an ark it was into which Noah was directed to go (<a onClick="return mV(\'Gen\',7,\'1-\');">Ge 7:1</a>); nor how he can already in <a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a> build an altar, as he has not yet gone out of the ark; and, further, how the determination of Yahweh, that He would not again curse the earth but would bless it, can be a comfort to him, since only P has reported concerning the blessing (<a onClick="return mV(\'Gen\',9,1);">9:1</a>ff). Even if the distinction is not always clearly made between clean and unclean animals, and different numbers are found in the case of each (<a onClick="return mV(\'Gen\',6,19);">6:19</A>f; <a onClick="return mV(\'Gen\',7,\'14-16\');">7:14-16</a> the Priestly Code (P), over against <a onClick="return mV(\'Gen\',7,2);">7:2</A>f in J), yet this is to be regarded merely as a lack of exactness or, perhaps better, rather as a summary method of procedure. The difficulties are not even made any easier through the separation into sources, since in <a onClick="return mV(\'Gen\',7,8);">7:8</A>f in J both numbers and the distinction between the two kinds of animals are used indiscriminately. Here, too, in J we find the name Elohim used. The next contradiction that is claimed, namely that the Deluge according to J lasted only 61 days, and is arranged in 40 days (<a onClick="return mV(\'Gen\',7,4,12,17);">7:4,12,17</A>; <a onClick="return mV(\'Gen\',8,6);">8:6</A>) plus 3 X 7 = 21 days (<a onClick="return mV(\'Gen\',8,8,10,12);">8:8,10,12</a>), while in P it continues for 1 year and 11 days (<a onClick="return mV(\'Gen\',7,11,24);">7:11,24</A>; <a onClick="return mV(\'Gen\',8,3,4,5,14);">8:3-5,14</A>), is really a self-inflicted agony of the critics. The report of the Bible on the subject is perfectly clear. The rain descends for 40 days (<a onClick="return mV(\'Gen\',7,12);">7:12</A> J); but as in addition also the fountains of the deep are broken up (<a onClick="return mV(\'Gen\',7,11);">7:11</A> P), we find in this fact a reason for believing that they increased still more (<a onClick="return mV(\'Gen\',7,24);">7:24</A> P and <a onClick="return mV(\'Gen\',7,17);">7:17</A> J). The 40 days in <a onClick="return mV(\'Gen\',8,6);">8:6</A> J cannot at all be identified with those mentioned in <a onClick="return mV(\'Gen\',7,17);">7:17</A>; for if this were the case the raven would have been sent out at a time when the waters had reached their highest stage, and even according to J the Deluge covered the entire world. In general see above, II,2,1 (c).<P>4. The Toledhoth of the Sons of Noah (<a onClick="return mV(\'Gen\',10,\'1-\');">Genesis 10:1</a>-<a onClick="return mV(\'Gen\',11,\'1-9\');">11:9</a>):<P>(1) The Biblical Text.<P>(a) <a onClick="return mV(\'Gen\',10,\'2-5\');">Ge 10:2-5</a>, the Japhethites;<P>(b) <a onClick="return mV(\'Gen\',10,\'6-20\');">10:6-20</A>, the Hamites;<P>(c) <a onClick="return mV(\'Gen\',10,\'21-32\');">10:21-32</A>, the Shemites;<P>(d) <a onClick="return mV(\'Gen\',11,\'1-9\');">11:1-9</a>, the Babylonian confusion of tongues. Evidently (a) to (c) is to be regarded as in contrast to (d) (compare also <a onClick="return mV(\'Gen\',11,1.9);">11:1,9</a> J in addition to <a onClick="return mV(\'Gen\',10,32);">10:32</a> P).<P>(2) Rejection of the Division into Sources (<a onClick="return mV(\'Gen\',10,\'1-7\',20,22,31);">Genesis 10:1-7, 20, 22f, 31f</a> the Priestly Code (P), the Rest Belonging to J).<P>The distribution of <a onClick="return mV(\'Gen\',10,\'1-\');">Genesis 10</a> between P and J is actually ridiculous, since in this case J does not speak of Japheth at all, and the genealogy of the Hamites would connect directly with the Priestly Code (P), a phenomenon which must have been repeated in <a onClick="return mV(\'Gen\',10,24);">10:24</a>ff. The Jewish Midrash, in addition, and possibly correctly, counts 70 peoples (compare <a onClick="return mV(\'Gen\',46,27);">46:27</A>; <a onClick="return mV(\'Exd\',1,5);">Ex 1:5</a>; <a onClick="return mV(\'Num\',11,16,25);">Nu 11:16, 25</a>; <a onClick="return mV(\'Luk\',10,1);">Lu 10:1</a>).<P>5. The Toledhoth of Shem (<a onClick="return mV(\'Gen\',11,\'10-26\');">Genesis 11:10-26</a>):<P>10 generations (see under II, 1).<P>6. The Toledhoth of Terah (<a onClick="return mV(\'Gen\',11,\'1-\');">Ge 11:27-25:11</a>):<P>(1) The Biblical Text.<P>After the introduction (<a onClick="return mV(\'Gen\',11,\'27-32\');">Ge 11:27-32</a>), theme of the history of Abraham is given in <a onClick="return mV(\'Gen\',12,\'1-4\');">Ge 12:1-4</a> a (<a onClick="return mV(\'Gen\',12,1);">12:1</a>, the promise of the holy land; <a onClick="return mV(\'Gen\',12,2);">12:2</a>, promise of many descendants; <a onClick="return mV(\'Gen\',12,3);">12:3</A>, announcement of the double influence of Abraham on the world; <a onClick="return mV(\'Gen\',12,4);">12:4a</a>, the obedience of Abraham\'s faith in his trust upon the Divine promise). In contrast to the first three thoughts which characterize God\'s relation to Abraham, the fourth is placed, which emphasizes. Abraham\'s relation to God (see under (d)). But both thoughts give complete expression to the intimate communion between God and Abraham. On the basis of these representations, which run through the entire story and thus contribute materially to its unification, this section can also be divided, as one of these after the other comes into the foreground. These four parts (<a onClick="return mV(\'Gen\',12,\'4-\');">12:4b through 14:24</a>; <a onClick="return mV(\'Gen\',15,\'1-\');">15:1-18:15</a>; <a onClick="return mV(\'Gen\',18,\'16-\');">18:16-21:34</a>; <a onClick="return mV(\'Gen\',22,\'1-\');">22:1-25:11</a>) can each be divided again into four subdivisions, a scheme of division that is found also in <a onClick="return mV(\'Exd\',35,\'4-\');">Ex 35:4-40:38</a>; <a onClick="return mV(\'Lev\',11,\'1-\');">Le 11-15</a>; <a onClick="return mV(\'Lev\',16,\'1-\');">16</a> (compare <a href="study/isbe/search.html?string=EXODUS">EXODUS, II,2,7</a>; <a href="study/isbe/search.html?string=LEVITICUS">LEVITICUS, II,2,2, III and IV</a>; <a href="study/isbe/search.html?string=DAY+OF+ATONEMENT">DAY OF ATONEMENT, I,2,1</a>), and is suggested by <a onClick="return mV(\'Deu\',12,\'1-\');">De 12-26</a> (compare also my book, Wider den Bann der Quellenscheidung, the results of the investigation of which work are there reproduced without entering upon the details of the argument).<P>(a) <a onClick="return mV(\'Gen\',12,\'4-\');">Ge 12:4 through 14:24</a>, in which the reference to the promised land is placed in the foreground; see <a onClick="return mV(\'Gen\',12,1);">12:1</A>, and the passages and statements in parentheses in the following: (i) <a onClick="return mV(\'Gen\',12,\'4-8\');">12:4b-8</A>, Abraham\'s journey to Canaan (<a onClick="return mV(\'Gen\',12,5);">12:5</a> the Priestly Code (P), <a onClick="return mV(\'Gen\',12,6,7,8);">6,7,8</a> J); (ii) <a onClick="return mV(\'Gen\',12,\'9-\');">12:9</a>-<a onClick="return mV(\'Gen\',13,\'1-4\');">13:4</a>, descent to Egypt from Canaan, and return (<a onClick="return mV(\'Gen\',12,9,10);">12:9,10</a>; <a onClick="return mV(\'Gen\',13,\'1-4\');">13:1-4</a> J); <a onClick="return mV(\'Gen\',13,\'5-18\');">13:5-18</a>, separation from Lot (<a onClick="return mV(\'Gen\',13,6);">13:6</a> the Priestly Code (P), <a onClick="return mV(\'Gen\',13,7,9);">7,9</a> J, <a onClick="return mV(\'Gen\',13,12);">12a</a> the Priestly Code (P), <a onClick="return mV(\'Gen\',13,14,17,18);">14f; 17,18</A> J); chapter <a onClick="return mV(\'Gen\',14,\'1-\');">14</a>, expedition against Chedorlaomer, etc. (Abraham is blessed by the priest-king of the country, and receives as homage from the products of the country bread and wine (<a onClick="return mV(\'Gen\',14,18);">14:18</a>f), while he in return gives tithes (<a onClick="return mV(\'Gen\',14,20);">14:20</a>)). The division of this section (<a onClick="return mV(\'Gen\',12,\'12-\');">12:4b through 14:24</A>) is to be based on the similarity of the closing verses (<a onClick="return mV(\'Gen\',12,8);">12:8</a>; <a onClick="return mV(\'Gen\',13,4);">13:4</a>; <a onClick="return mV(\'Gen\',13,18);">13:18</a>).<P>(b) <a onClick="return mV(\'Gen\',15,\'1-\');">Ge 15:1-18:15</a>, unfolding of the promise of descendants for Abraham by this announcement that he is to have a son of his own; compare <a onClick="return mV(\'Gen\',12,2);">12:2</a> and what is placed in parentheses in the following: chapter <a onClick="return mV(\'Gen\',15,\'1-\');">15</a>, Yahweh\'s covenant with Abraham (<a onClick="return mV(\'Gen\',15,2,3);">15:2,3</a> JE, <a onClick="return mV(\'Gen\',15,4);">4</a> J, <a onClick="return mV(\'Gen\',15,5);">5</a> E, <a onClick="return mV(\'Gen\',15,13,14,16,18);">13,14,16,18</a> J). The promise is not fulfilled through Eliezer, but only through an actual son (<a onClick="return mV(\'Gen\',15,3,4);">15:3,4</a>); <a onClick="return mV(\'Gen\',16,\'1-16\');">16:1-16</a>, Hagar gives birth to Ishmael as the son of Abraham. Hagar\'s son, too, namely Ishmael, is not the genuine heir, notwithstanding the connection between <a onClick="return mV(\'Gen\',16,10);">16:10</a> and <a onClick="return mV(\'Gen\',12,2);">12:2</a> (compare <a onClick="return mV(\'Gen\',17,\'18-20\');">17:18-20</a> P); chapter <a onClick="return mV(\'Gen\',17,\'1-\');">17</a> the Priestly Code (P), promise of the birth of Isaac given to Abraham (<a onClick="return mV(\'Gen\',17,\'2-17\',19,21);">17:2-17,19,21</a>); <a onClick="return mV(\'Gen\',18,\'1-15\');">18:1-15</a>, Sarah also hears that Isaac is promised (<a onClick="return mV(\'Gen\',18,10,\'12-15\');">18:10,12-15</a>).<P>(c) <a onClick="return mV(\'Gen\',18,\'16-\');">Ge 18:16-21:34</a>, the double influence of Abraham on the world; compare <a onClick="return mV(\'Gen\',12,3);">12:3</a> and what is in parentheses in the following: <a onClick="return mV(\'Gen\',18,\'16-\');">18:16</a>-<a onClick="return mV(\'Gen\',19,\'1-38\');">19:38</a>, the pericope dealing with Sodom; (i) <a onClick="return mV(\'Gen\',18,\'16-33\');">18:16-33</a>, Abraham\'s petition for the deliverance of Sodom; (ii) <a onClick="return mV(\'Gen\',19,\'1-11\');">19:1-11</a>, the sin of the Sodomites, while Lot shows some of the characteristics of Abraham; (iii) <a onClick="return mV(\'Gen\',19,\'12-28\');">19:12-28</a>, story of the destruction, in connection with which Lot receives the benefit of his relation to Abraham (<a onClick="return mV(\'Gen\',19,16,19,21,22);">19:16,19,21,22</a>); (iv) Lot ceases to be a part of this history after this destruction; <a onClick="return mV(\'Gen\',20,\'1-18\');">20:1-18</a>, Abraham with Abimelech (<a onClick="return mV(\'Gen\',20,6,9);">20:6,9</a> E, <a onClick="return mV(\'Gen\',20,18);">18</a> R, punishment; <a onClick="return mV(\'Gen\',20,7,17);">20:7,17</a>, intercession); <a onClick="return mV(\'Gen\',21,\'1-21\');">21:1-21</a>, Ishmael ceases to be part of this history (<a onClick="return mV(\'Gen\',21,13,18,20);">21:13,18,20</a> E); <a onClick="return mV(\'Gen\',21,\'22-34\');">21:22-34</a>, Abraham\'s agreement with Abimelech (the latter seeks Abraham\'s friendship and fears his enmity, <a onClick="return mV(\'Gen\',21,22,23);">21:22,23</a> E).<P>(d) <a onClick="return mV(\'Gen\',22,\'1-\');">Ge 22:1-25:11</a>ff, Abraham\'s faith at its culminating point; compare <a onClick="return mV(\'Gen\',12,4);">12:4a</A> and what is in parentheses in the following: (i) <a onClick="return mV(\'Gen\',22,\'1-19\');">22:1-19</A>, the sacrifice of Isaac (<a onClick="return mV(\'Gen\',22,2,12);">22:2,12</A> E, <a onClick="return mV(\'Gen\',22,16,18);">16,18</A> R); (ii) chapter <a onClick="return mV(\'Gen\',23,\'1-\');">23</A>, purchase of the place to bury the dead, which act was the result of his faith in the promised land; (iii) chapter <a onClick="return mV(\'Gen\',24,\'1-\');">24</A> is introduced by <a onClick="return mV(\'Gen\',22,\'20-24\');">22:20-24</A>, which has no independent character. With the twelve descendants of Nahor compare the twelve sons of Jacob, the twelve of Ishmael (<a onClick="return mV(\'Gen\',25,12);">25:12</A>ff; <a onClick="return mV(\'Gen\',17,20);">17:20</A>), and on the no. 12 see <a onClick="return mV(\'Exd\',24,18);">Ex 24:18-30:10</a>, under <a href="study/isbe/search.html?string=EXODUS">EXODUS, II,2,5</a>; <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-7</a> under <a href="study/isbe/search.html?string=LEVITICUS">LEVITICUS, II,2,2, i</A>, and under <a href="study/isbe/search.html?string=EZEKIEL">EZEKIEL, I,2,2</a>. Ch <a onClick="return mV(\'Gen\',24,\'1-\');">24</A> itself contains the story of how a wife was secured for Isaac from among his relatives (the faith in the success of this plan is transmitted from Abraham to his servant); (iv) <a onClick="return mV(\'Gen\',25,\'1-11\');">25:1-11</A>, the sons of the concubine of Abraham (J and R) cease to be a part of this history; transfer of the entire inheritance to the son of promise (Jahwist); burial in the ground bought for this purpose (P) (all of these concluding acts stand in close connection with Abraham\'s faith). In reference to the force of the names of God in connecting <a onClick="return mV(\'Gen\',11,\'27-\');">Ge 11:27-25:11</a>, see above under II,2,2 (d).<P>(2) Rejection of the Division into Sources (<a onClick="return mV(\'Gen\',11,27,31);">Genesis 11:27, 31</a>f; <a onClick="return mV(\'Gen\',2,4,5);">2:4b, 5</a>; <a onClick="return mV(\'Gen\',13,6,11,12);">13:6a, 11b, 12a</a>; <a onClick="return mV(\'Gen\',11,16,1,3,15,17);">16:1a, 3,15f; 17</a>; <a onClick="return mV(\'Gen\',19,29);">19:29</a>; <a onClick="return mV(\'Gen\',11,21,1,\'2-5\');">21:1b, 2b-5</a>; <a onClick="return mV(\'Gen\',23,\'1-\');">23</a>; <a onClick="return mV(\'Gen\',25,\'7-11\');">25:7-11a</a> P; <a onClick="return mV(\'Gen\',14,\'1-\');">14</A> from an unknown source; <a onClick="return mV(\'Gen\',15,6);">15:6</a>; <a onClick="return mV(\'Gen\',20,\'1-17\');">20:1-17</a>; <a onClick="return mV(\'Gen\',21,\'8-32\');">21:8-32</a>; <a onClick="return mV(\'Gen\',22,\'1-13\',19);">22:1-13,19</a> E; <a onClick="return mV(\'Gen\',15\'1-3\');">15:1-3</a>; <a onClick="return mV(\'Gen\',21,6);">21:6</a> JE; <a onClick="return mV(\'Gen\',20,18);">20:18</a>; <a onClick="return mV(\'Gen\',22,\'14-18\');">22:14-18</a>; <a onClick="return mV(\'Gen\',25,6);">25:6</a> R; all else belongs to J).<P>Through the passages ascribed to P breaks are caused in the text of J in <a onClick="return mV(\'Gen\',11,28);">Ge 11:28</a>f; <a onClick="return mV(\'Gen\',12,4);">12:4a</a> (Lot); in chapter <a onClick="return mV(\'Gen\',16,\'1-\');">16</a>, where the conclusion is lacking; in <a onClick="return mV(\'Gen\',18,1);">18:1</a> (the reference of the pronoun); in <a onClick="return mV(\'Gen\',24,67);">24:67</a> (Sarah\'s death); in <a onClick="return mV(\'Gen\',251);">25:1</a>ff (no mention of Abraham\'s death). On the other hand P presupposes the text of J in <a onClick="return mV(\'Gen\',11,31);">11:31</a>f; <a onClick="return mV(\'Gen\',12,4);">12:4b</a>; <a onClick="return mV(\'Gen\',6,1);">16:1b</a>; <a onClick="return mV(\'Gen\',19,29);">19:29</a>. In the case of E we need mention only the abrupt break in <a onClick="return mV(\'Gen\',20,1);">20:1</a>; and, finally, the text of the Priestly Code (P), leaving out of consideration the larger sections (chapters <a onClick="return mV(\'Gen\',17,\'1-\');">17 and <a onClick="return mV(\'Gen\',23,\'1-\');">23</a>), is entirely too meager to constitute an independent document.<P>We will here discuss also the so-called duplicates (see under II,2,1, a and c). The different stories concerning the danger in which the wives of Abraham and Isaac were involved in <a onClick="return mV(\'Gen\',12,9);">Ge 12:9</a>ff J; <a onClick="return mV(\'Gen\',20,1);">20:1</a>ff E; <a onClick="return mV(\'Gen\',26,1);">26:1</a>ff J directly presuppose each other. Thus, in <a onClick="return mV(\'Gen\',20,13);">20:13</a> the Elohist (E), Abraham regards it as a fact that such situations are often to be met with, and consequently the possibility of an occurrence of such an event could not have appeared so remarkable to an Oriental as it does to a modern critic; chapter <a onClick="return mV(\'Gen\',26,1);">26:1</a> suggests the story in <a onClick="return mV(\'Gen\',12,9);">12:9</a>ff. The words used here also show that the three stories in question did not originate independently of each other (compare <a onClick="return mV(\'Gen\',26,7);">26:7</a>; <a onClick="return mV(\'Gen\',20,5);">20:5</a>; <a onClick="return mV(\'Gen\',12,\'1-\');">12:19-26:7</a>; <a onClick="return mV(\'Gen\',20,11);">20:11</a>; <a onClick="return mV(\'Gen\',12,\'12-\');">12:12-26:10</a>; <a onClick="return mV(\'Gen\',20,9);">20:9</a>; <a onClick="return mV(\'Gen\',12,\'1-\');">12:18-26:3</a>; <a onClick="return mV(\'Gen\',20,1);">20:1</a>; <a onClick="return mV(\'Gen\',12,10);">12:10</a> (gur); see under II,2,1, c). The two Ishmael pericopes (chapters <a onClick="return mV(\'Gen\',16,\'1-\');">16</a> J and P and <a onClick="return mV(\'Gen\',21,\'1-\');">21</a> E) differ from each other throughout, and, accordingly, are surely not duplicates. The two stories of the conclusion of a covenant in chapters <a onClick="return mV(\'Gen\',15,\'1-\');">15</a> J and <a onClick="return mV(\'Gen\',17,\'1-\');">17</a> P are both justified, especially since in <a onClick="return mV(\'Gen\',17,5);">17:7</a> the author speaks of an "establishment" of the covenant which already existed since chapter <a onClick="return mV(\'Gen\',15,\'1-\');">15</a>. <a onClick="return mV(\'Gen\',17,\'1-\');">Ge 17</a> P and <a onClick="return mV(\'Gen\',18,1);">18:1</a>ff J are certainly intended to be pendants, so that it is impossible to ascribe them to different authors; compare the analogous beginning of theophanies of Yahweh in <a onClick="return mV(\'Gen\',17,1);">17:1</a> and <a onClick="return mV(\'Gen\',18,1);">18:1</a> (even the pronoun referring to Abraham in <a onClick="return mV(\'Gen\',18,1);">18:1</a> J, unless taken in connection with chapter <a onClick="return mV(\'Gen\',17,\'1-\');">17</a> the Priestly Code (P), is without any context), also the laughing of Abraham and of Sarah (<a onClick="return mV(\'Gen\',17,17);">17:17</a>; <a onClick="return mV(\'Gen\',18,12);">18:12</a>f; see under II,2,1 (c)), the prominence given to their age (<a onClick="return mV(\'Gen\',17,17);">17:17</a>; <a onClick="return mV(\'Gen\',18,11);">18:11</a>f), and the designation of the time in <a onClick="return mV(\'Gen\',17,11);">17:11</a>; <a onClick="return mV(\'Gen\',18,10,14);">18:10,14</a>.<P>Nor can we quote in favor of a division into sources the passage <a onClick="return mV(\'Gen\',21,14);">Ge 21:14</a>f E, on the ground that Ishmael is described here as being so small that he could be laid upon the shoulder of his mother and then be thrown by her under a shrub, while according to the Biblical text he must have been 15 years of age (<a onClick="return mV(\'Gen\',16,16);">16:16</a>; <a onClick="return mV(\'Gen\',21,5);">21:5</a> P). For the original does not say that he was carried on her shoulders; and in <a onClick="return mV(\'Mat\',15,30);">Mt 15:30</a> it is even said of adults that they were thrown down. On the other hand, also according to E, Ishmael could not have been so small a child, for in <a onClick="return mV(\'Gen\',21,18);">Ge 21:18b</a> he is led by the hand, and according to <a onClick="return mV(\'Gen\',21,9);">21:9</a> he already mocks Isaac, evidently because the latter was the heir of the promise.<P>Sarah\'s age, too, according to <a onClick="return mV(\'Gen\',20,\'1-\');">Ge 20</a> E, does not speak in favor of a division into sources. That she was still a beautiful woman is not claimed here. Evidently Abimelech was anxious only for a closer connection with the powerful Abraham (compare <a onClick="return mV(\'Gen\',21,23,27);">21:23,27</a>). Then, too, all the sources ascribe an advanced age to Sarah (compare <a onClick="return mV(\'Gen\',21,6);">21:6</a> J and E; <a onClick="return mV(\'Gen\',18,12);">18:12</a>f J; <a onClick="return mV(\'Gen\',17,17);">17:17</a> P).<P>7. The Toledhoth of Ishmael (<a onClick="return mV(\'Gen\',25,\'12-18\');">Genesis 25:12-18</a>):<P>Twelve princes descended from Ishmael (see under 6 (d)).<P>8. The Toledhoth of Isaac (<a onClick="return mV(\'Gen\',25,19);">Genesis 25:19-35:29</a>):<P>The correct conception of the fundamental thought can be gained at once in the beginning of this section (<a onClick="return mV(\'Gen\',25,22);">Ge 25:22</a>f): Yahweh\'s oracle to Rebekah, that the older of the twins, with whom she was pregnant, should serve the younger; also in <a onClick="return mV(\'Rom\',9,10);">Ro 9:10</a>ff with reference to <a onClick="return mV(\'Mal\',1,2);">Mal 1:2</a>f; and finally, the constant reference made to Esau in addition to Jacob until the former ceases to be a factor in this history in <a onClick="return mV(\'Gen\',36,\'1-\');">Ge 36</a>. Accordingly in the end everything is made dependent on the one hand on Jacob\'s election, notwithstanding his wrongdoings, on the other hand, on Esau\'s rejection notwithstanding his being the firstborn, or in other words, upon the perfectly free grace of God; and all the different sources alike share in this fundamental thought. But in dividing between the different parts of this section, we must particularly draw attention to this, that in all of these parts both thoughts in some way or other find their expression.<P>(1) The Biblical Text.<P>Containing 10 parts (see under II, 1), namely<P>(a) <a onClick="return mV(\'Gen\',25,\'19-26\');">Ge 25:19-26</a>, the birth of Esau and Jacob;<P>(b) <a onClick="return mV(\'Gen\',25,\'27-34\');">25:27-34</a>, Esau despises and loses his birthright;<P>(c) <a onClick="return mV(\'Gen\',26,\'1-35\');">26:1-35</a>, Isaac receives the blessing of Abraham, which afterward is transmitted to Jacob, while Esau, through his marriage with heathen women, prepares the way for his rejection (<a onClick="return mV(\'Gen\',26,34);">26:34</a>f);<P>(d) <a onClick="return mV(\'Gen\',27,\'1-40\');">27:1-40</a>, Jacob steals the blessing of the firstborn;<P>(e) <a onClick="return mV(\'Gen\',27,\'41-45\');">27:41-45</A>, Jacob\'s flight out of fear of Esau\'s vengeance;<P>(f) <a onClick="return mV(\'Gen\',27,\'46-\');">27:46</A>-<a onClick="return mV(\'Gen\',28,\'1-9\');">28:9</A>, Jacob is sent abroad out of fear of his brother\'s bad example;<P>(g) <a onClick="return mV(\'Gen\',28,\'10-\');">28:10-32:33</A>, Jacob in a strange land and his fear of Esau, which is overcome in his contest of prayer in Peniel on his return: <a onClick="return mV(\'Gen\',28,\'10-22\');">28:10-22</A>, the ladder reaching to heaven in Bethel when he went abroad; <a onClick="return mV(\'Gen\',29,\'1-\');">29:1-30:43</A>, twenty years with Laban (see <a onClick="return mV(\'Gen\',31,38);">31:38</A>); <a onClick="return mV(\'Gen\',31,\'1-54\');">31:1-54</A>, Jacob\'s departure from Mesopotamia; <a onClick="return mV(\'Gen\',31,\'1-33\');">32:1-33</A>, his return home;<P>(h) chapter <a onClick="return mV(\'Gen\',33,\'1-\');">33</A>, reconciliation with Esau, who returns to Seir (verse <a onClick="return mV(\'Gen\',33,16);">16</A>; compare <a onClick="return mV(\'Gen\',32,4;">32:4</A>), while Jacob becomes the owner of property in the Holy Land (<a onClick="return mV(\'Gen\',33,19);">33:19</A>f);<P>(i) <a onClick="return mV(\'Gen\',34,\'1-\');">34:1</A>-<a onClick="return mV(\'Gen\',35,\'1-22\');">35:22</A>, Jacob remains in this land, notwithstanding the slaughter made by his sons Simeon and Levi (compare <a onClick="return mV(\'Gen\',34,30);">34:30</A>; <a onClick="return mV(\'Gen\',35,5);">35:5</A>); the new appearance of God in Bethel, with a repetition of the story of the changing of Jacob\'s name, with which the story of Jacob\'s youth is closed, and which presupposes the episode at Bethel (compare <a onClick="return mV(\'Gen\',35,1,6,\'9-15\');">35:1,6b, 9-15</A> with <a onClick="return mV(\'Gen\',28,10);">28:10</A>ff), and which is not in contradiction with the first change in the name of Jacob in chapter <a onClick="return mV(\'Gen\',33,\'1-\');">32</A> (compare the twofold naming of Peter in <a onClick="return mV(\'Jhn\',1,43);">Joh 1:43</a> and <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a>). Esau is yet mentioned in <a onClick="return mV(\'Gen\',35,1,7);">Ge 35:1, 7</a>, where there is a reference made to Jacob\'s flight before him;<P>(j) <a onClick="return mV(\'Gen\',35,\'23-29\');">35:23-29</a>, Jacob\'s 12 sons as the bearers of the promise; while Esau is mentioned only as participating in Isaac\'s burial, but inwardly he has no longer any part in the history of the kingdom of God, as is seen from chapter <a onClick="return mV(\'Gen\',36,\'1-\');">36</a>, and in <a onClick="return mV(\'Gen\',32,4);">32:4</a>; <a onClick="return mV(\'Gen\',36,16);">33:16</a> is already hinted at. In this section, too, evidently there are groups, each of two parts belonging together, namely (a) and (b) describing the earliest youth; (c) and (d) in which Isaac plays a prominent part; (e) and (f) both of which do not exclude but supplement each other in assigning the motives for Jacob\'s flight; (g) and (h) Jacob\'s flight and reconciliation; (i) and (j) Jacob both according to family and dwelling-place as the recognized heir of the promise.<P>(2) Rejection of the Division into Sources.<P>As <a onClick="return mV(\'Gen\',25,29);">Ge 25:29</a>f; <a onClick="return mV(\'Gen\',25,26);">26b</a>; <a onClick="return mV(\'Gen\',26,34);">26:34</a>f; <a onClick="return mV(\'Gen\',27,\'1-\');">27:46</a>-<a onClick="return mV(\'Gen\',28,\'1-9\');">28:9</a>; <a onClick="return mV(\'Gen\',29,24,29);">29:24,29</a>; <a onClick="return mV(\'Gen\',31,18);">31:18</a>; <a onClick="return mV(\'Gen\',35,6,\'9-12\',15);">35:6a, 9-12,15</a>; <a onClick="return mV(\'Gen\',35,\'22-29\');">35:22b-29</a>; <a onClick="return mV(\'Gen\',36,\'6-30\',\'40-43\');">36:6-30,40-43</a> are ascribed to the Priestly Code (P), it is clear that these are in part such ridiculously small extracts, that we should be justified in attributing them to a sensible author. The whole sojourn in Mesopotamia is ignored in the Priestly Code (P), according to the critics, except the brief notices in <a onClick="return mV(\'Gen\',29,24,29);">29:24,29</a>; <a onClick="return mV(\'Gen\',33,18);">33:18</a>. Further, the parts of the rest of the text cannot in many cases be dispensed with; as, e.g. we do not know in <a onClick="return mV(\'Gen\',25,26);">25:26b</a> who was born; nor in <a onClick="return mV(\'Gen\',26,34);">26:34</a>f who Esau was; nor in <a onClick="return mV(\'Gen\',27,46);">27:46</a> who Jacob was; nor in <a onClick="return mV(\'Gen\',29,24);">29:24</a> who Laban was; nor in <a onClick="return mV(\'Gen\',29,24,29);">29:24,29</a> in what connection and for what purposes Leah and Rachel are mentioned. P makes no mention of any promise given to Isaac, which is, however, presupposed in <a onClick="return mV(\'Gen\',35,12);">35:12</a> and later in <a onClick="return mV(\'Exd\',2,24);">Ex 2:24</a>. In <a onClick="return mV(\'Gen\',28,1);">Ge 28:1</a>ff P is most closely connected with J (compare <a onClick="return mV(\'Gen\',12,1,2,3);">12:1-3</a>, the blessing of Abraham, and chapter <a onClick="return mV(\'Gen\',\'1-\');">24</a>). It is, further, impossible to separate the sources E and J in chapter <a onClick="return mV(\'Gen\',28,\'1-\');">28</a> (ladder reaching to heaven); compare <a onClick="return mV(\'Gen\',28,\'10-12\',17,\'20-22\');">28:10-12,17f; 20-22</a> E; <a onClick="return mV(\'Gen\',28,\'13-16\');">28:13-16</a> J; <a onClick="return mV(\'Gen\',28,19);">28:19</a>, and the name of God in <a onClick="return mV(\'Gen\',28,21);">28:21</a> R, and this proposed division actually becomes absurd in chapters <a onClick="return mV(\'Gen\',29,\'1-\');">29</a>f in the story of the birth of Jacob\'s children, which are said to be divided between the sources J and E.<P>9. The Toledhoth of Esau (<a onClick="return mV(\'Gen\',36,\'1-\');">Genesis 36:1</a>-<a onClick="return mV(\'Gen\',37,1);">37:1</a>):<P>In 7 divisions (see under 1), namely<P>(a) <a onClick="return mV(\'Gen\',36,\'1-5\');">Ge 36:1-5</a> R, Esau\'s family; the different names for Esau\'s wives, as compared with <a onClick="return mV(\'Gen\',26,34);">26:34</a>f; <a onClick="return mV(\'Gen\',28,\'7-9\');">28:7-9</a> the Priestly Code (P), are doubtless based on the fact that oriental women are apt to change their names when they marry; and the fact that these names are without further remark mentioned by the side of the others is rather an argument against the division into sources than for it;<P>(b) <a onClick="return mV(\'Gen\',36,\'6-8\');">36:6-8</a>, Esau\'s change of abode to Seir, which, according to <a onClick="return mV(\'Gen\',32,4);">32:4</a>; <a onClick="return mV(\'Gen\',33,14,16);">33:14,16</a>, already took place before Jacob\'s return. Only in case that Esau (<a onClick="return mV(\'Gen\',35,29);">35:29</a>) would have afterward remained for a longer period in Canaan, could we think of a new separation in this connection. It is more probable that at this place all those data which were of importance in connection with this separation are once more given without any reference to their difference in point of time;<P>(c) <a onClick="return mV(\'Gen\',36,\'9-14\');">36:9-14</a>, Esau as the founder of the Edomites (in <a onClick="return mV(\'Gen\',36,9);">36:9</a> the word [toledhoth] is repeated from verse <a onClick="return mV(\'Gen\',36,1);">1</a>, while the narrative of the descendants of Esau begins only at this later passage in so far as these were from Seir; compare <a onClick="return mV(\'Gen\',36,9);">36:9</a> with <a onClick="return mV(\'Gen\',36,5);">36:5</a>, and above, under II, 1);<P>(d) <a onClick="return mV(\'Gen\',36,\'15-19\');">36:15-19</a>, the leading line of the sons of Esau;<P>(e) <a onClick="return mV(\'Gen\',36,\'20-30\');">36:20-30</a>, genealogy of the original inhabitants of the country, mentioned because of their connection with Esau (compare <a onClick="return mV(\'Gen\',36,25);">36:25</a> with <a onClick="return mV(\'Gen\',36,2);">36:2</a>);<P>(f) <a onClick="return mV(\'Gen\',36,\'31-39\');">36:31-39</a>, the elective kingdoms of Edom;<P>(g) <a onClick="return mV(\'Gen\',36,\'40-43\');">36:40-43</a>, the Edomites\' chief line of descent, arranged according to localities. We have here accordingly geographical accounts, and not historical or genealogical, as in <a onClick="return mV(\'Gen\',36,15,20);">36:15ff, 20ff</a> (30); compare also <a onClick="return mV(\'Gen\',36,40,43);">36:40,43</a>, for which reason we find also names of women.<P>10. The Toledhoth of Jacob (<a onClick="return mV(\'Gen\',37,\'2-\');">Genesis 37:2-50:26</a>):<P>(1) The Biblical Text.<P>The key to the history of Joseph is found in its conclusion, namely, in <a onClick="return mV(\'Gen\',50,\'14-21\');">Ge 50:14-21</a>, in the confession of Joseph, in the light of his past, namely, that God has ended all things well; and in <a onClick="return mV(\'Gen\',50,22);">50:22</a>ff, in his confidence in the fulfillment of the Divine promise in the lives of those God has chosen; compare also <a onClick="return mV(\'Psa\',105,16);">Ps 105:16</a>ff. According to the two viewpoints in <a onClick="return mV(\'Gen\',50,\'14-26\');">Ge 50:14-26</a>, and without any reference to the sources, this whole pericope (<a onClick="return mV(\'Gen\',37,\'2-\');">37:2-50:15</a>) is divided into two halves, each of five subdivisions, or a total of ten (see under II, 1). In the exact demonstration of this, not only the contents themselves, but also regard for the different names for God will often render good service, which names, with good effect, are found at the close and in harmony with the fundamental thought of the entire section, namely,<P>(a) <a onClick="return mV(\'Gen\',27,\'2-\');">37:2-39:6a</a>, Joseph enters Potiphar\'s house (4 pieces, see under 6,1,namely <a onClick="return mV(\'Gen\',37,\'2-11\');">37:2-11</a>, the hatred of the brethren, <a onClick="return mV(\'Gen\',37,\'12-36\');">37:12-36</a>, selling Joseph, <a onClick="return mV(\'Gen\',38,1);">38:1</a>ff, the Yahweh-displeasing conduct in the house of Judah, compare <a onClick="return mV(\'Gen\',38,7,10);">38:7,10</a>; <a onClick="return mV(\'Gen\',39,\'1-6\');">39:1-6</a>, Yahweh\'s pleasure in Joseph, in contrast to;<P>(b) <a onClick="return mV(\'Gen\',39,\'6-23\');">39:6b-23</a>, Joseph is cast into prison, but Yahweh was with him (<a onClick="return mV(\'Gen\',39,21.23);">39:21,23</a>);<P>(c) <a onClick="return mV(\'Gen\',40,\'1-\');">40:1</a>-<a onClick="return mV(\'Gen\',41,\'1-52\');">41:52</a>, the exaltation of Joseph, which at the end especially is shown by the naming of Ephraim and Manasseh as caused by God, but which for the present passes by the history of his family (4 pieces, namely, <a onClick="return mV(\'Gen\',40,1);">40:1</a>, interpretation of the dreams of the royal officials, <a onClick="return mV(\'Gen\',41,\'1-36\');">41:1-36</a>, interpretation of the two dreams of Pharaoh, <a onClick="return mV(\'Gen\',41,\'37-46\');">41:37-46a</a>, the exaltation of Joseph, <a onClick="return mV(\'Gen\',41,\'46-52\');">41:46b-52</a>, Joseph\'s activity for the good of the country);<P>(d) <a onClick="return mV(\'Gen\',41,\'55-\');">41:55-46:7</a>, Joseph becomes a blessing to his family; compare the promise of God to Jacob in Beersheba to be with him in Egypt in <a onClick="return mV(\'Gen\',46,2);">46:2</a>ff with <a onClick="return mV(\'Gen\',45,\'6-9\');">45:6-9</a> (in four pieces, namely, <a onClick="return mV(\'Gen\',41,\'53-57\');">41:53-57</a>, the general famine, <a onClick="return mV(\'Gen\',42,\'1-38\');">42:1-38</a>, the first journey of the brothers of Joseph, <a onClick="return mV(\'Gen\',43,\'14-\');">43:14</a>-<a onClick="return mV(\'Gen\',44,\'1-\');">44:34</a>, the second journey (in four subdivisions,<P>(i) <a onClick="return mV(\'Gen\',43,\'1-14\');">43:1-14</a>, the departure,<P>(ii) <a onClick="return mV(\'Gen\',43,\'14-34\');">43:14-34</a>, the reception by Joseph,<P>(iii) <a onClick="return mV(\'Gen\',44,\'1-7\');">44:1-7</a>, final trial of the brethren,<P>(iv) <a onClick="return mV(\'Gen\',44,\'18-34\');">44:18-34</a>, the intercession of Judah); <a onClick="return mV(\'Gen\',45,\'1-\');">45:1</a>-<a onClick="return mV(\'Gen\',46,\'1-7\');">46:7</a>, Joseph makes himself known and persuades Jacob to come to Egypt);<P>(e) <a onClick="return mV(\'Gen\',46,\'8-\');">46:8</A>-<a onClick="return mV(\'Gen\',47,\'1-26\');">47:26</a>, Joseph continues to be a blessing to his family and to Egypt (in 4 subdivisions, of which the 4th is placed in contrast to the first 3 exactly as this is done in <a onClick="return mV(\'Gen\',10,\'1-\');">10:1</a>-<a onClick="return mV(\'Gen\',11,\'1-9\');">11:9</a> and <a onClick="return mV(\'Gen\',11,\'27-\');">11:27-25:11</a>, namely, (<a onClick="return mV(\'Gen\',46,\'8-27\');">46:8-27</a>, list of the descendants of Jacob, <a onClick="return mV(\'Gen\',46,\'28-34\');">46:28-34</a>, meeting with Joseph, <a onClick="return mV(\'Gen\',47,\'1-12\');">47:1-12</a>, Jacob in the presence of Pharaoh, <a onClick="return mV(\'Gen\',47,\'13-26\');">47:13-26</a>, the Egyptians who have sold themselves and their possessions to Pharaoh laud Joseph as the preserver of their lives). From this point on the attention is now drawn to the future:<P>(f) <a onClick="return mV(\'Gen\',47,\'27-31\');">47:27-31</a>, Jacob causes Joseph to take an oath that he will have him buried in Canaan (compare <a onClick="return mV(\'Gen\',47,30);">47:30</a> J with chapter <a onClick="return mV(\'Gen\',23,\'1-\');">23</a> P); in (e) and (f) there is also lacking a designation for God;<P>(g) chapter <a onClick="return mV(\'Gen\',48,\'1-\');">48</a>, Jacob adopts and blesses Ephraim and Manasseh (compare also the emphasis placed on the providential guidance of God in <a onClick="return mV(\'Gen\',48,8,11,15);">48:8f; 11,15f;</a> especially <a onClick="return mV(\'Gen\',48,16);">48:16</a> and <a onClick="return mV(\'Gen\',48,20);">20</a>ff);<P>(h) <a onClick="return mV(\'Gen\',49,\'1-27\');">49:1-27</a>, Jacob blesses his 12 sons and prophesies their future fate (here, <a onClick="return mV(\'Gen\',49,18);">49:18</a>, appears the name of Yahweh, which had disappeared since chapter <a onClick="return mV(\'Gen\',40,\'1-\');">40</a>; see under II,2,2 (d), and other designations for God, <a onClick="return mV(\'Gen\',49,24);">49:24</a>f);<P>(i) <a onClick="return mV(\'Gen\',49,\'28-33\');">49:28-33</a>, Jacob\'s death after he had again expressed the wish, in the presence of all his sons, that he should be buried in Canaan;<P>(j) <a onClick="return mV(\'Gen\',50,\'1-13\');">50:1-13</a>, the body of Jacob is taken to Canaan. In these 10 pericopes again we can easily find groups of two each, namely, (a) and (b), Joseph\'s humiliation (sold, prison); (c) and (d), Joseph becomes a blessing to Egypt and to his family; (g) and (h), blessing of the, grandchildren and the sons of Jacob;<P>(i) and (j), Jacob s death and burial; here too the name of God is lacking as in (e) and (f).<P>(2) Rejection of the Division into Sources.<P>Here, too, the separation of P from the rest of the text as a distinct source is untenable, since in the section from <a onClick="return mV(\'Gen\',37,\'2-\');">Ge 37:2-46:34</a>, after <a onClick="return mV(\'Gen\',37,2);">37:2</a>, only the following fragments are attributed to this source, namely, <a onClick="return mV(\'Gen\',41,46);">41:46a</a>; <a onClick="return mV(\'Gen\',46,6);">46:6</a>f (according to some also to <a onClick="return mV(\'Gen\',46,27);">46:27</a>). In the same way P abruptly sets in at <a onClick="return mV(\'Gen\',47,5,27);">47:5,27b</a>; <a onClick="return mV(\'Gen\',49,28);">49:28b</a>. Further, <a onClick="return mV(\'Gen\',48,3);">48:3</A>ff knows nothing of Ephraim or Manasseh, of whom P reports nothing, so that <a onClick="return mV(\'Gen\',50,13);">50:13</a>f are the only verses that could naturally connect with the preceding statements of P. In <a onClick="return mV(\'Gen\',47,5);">47:5</a>ff P reports entirely in the manner of ordinary narratives, and there is no sign of any systematic arrangement. But the separation between J and E cannot be carried out either. In the first place, when these two sources are actually separated by the critics, innumerable omissions in the story arise, which we cannot at this place catalogue. The contradictions which are claimed to exist here are the products of the critics\' imagination. It is claimed that according to J it is Judah who plays a prominent role, while according to E it is Reuben; but in <a onClick="return mV(\'Gen\',37,21);">37:21</a> Reuben is mentioned by J, and the role played by Judah in chapter <a onClick="return mV(\'Gen\',38,\'1-\');">38</a> J is anything but creditable. Why cannot both of these brethren have played a prominent role, as this was also the case with Simeon (<a onClick="return mV(\'Gen\',42,24,36);">42:24,36</a>; <a onClick="return mV(\'Gen\',43,14);">43:14</a>) and Benjamin (<a onClick="return mV(\'Gen\',42,13,20,32,36,38);">42:13,20,32ff, 36,38</a>; <a onClick="return mV(\'Gen\',43,3);">43:3</a>ff; <a onClick="return mV(\'Gen\',44,\'1-\');">44</a>; <a onClick="return mV(\'Gen\',45,14);">45:14</a>)? Just as little are the Midianites in <a onClick="return mV(\'Gen\',37,28,36);">37:28,36</a> E and the Ishmaelites of <a onClick="return mV(\'Gen\',37,25,27,28);">37:25,27,28</a>; <a onClick="return mV(\'Gen\',39,1);">39:1</a> J mutually exclusive or contradictory, since the Midianites in the Gideon story, too, in <a onClick="return mV(\'Jdg\',7,\'1-\');">Jud 7</a>f; <a onClick="return mV(\'Jdg\',8,24);">8:24</a> are called Ishmaelites (compare in the German the name Prager for traveling musicians, whether they are from Prague or not). In J it is further claimed that Joseph\'s master was a private gentleman (<a onClick="return mV(\'Gen\',39,1);">Ge 39:1</a>), while in E he was the captain of the bodyguard (<a onClick="return mV(\'Gen\',40,3);">Ge 40:3</a>f). But in this instance the documentary theory can operate only when it calls in the assistance of R in <a onClick="return mV(\'Gen\',39,1);">Ge 39:1</a>. The fact that in chapter <a onClick="return mV(\'Gen\',39,1);">39:1</a> the name of the nationality is added to that of the office, is explained on the ground of the contrast to the Ishmaelites who sold Joseph. Finally, it is claimed to have been caused by the combination of the different sources in such a way that Benjamin in <a onClick="return mV(\'Gen\',43,8,29);">43:8,29</a>; <a onClick="return mV(\'Gen\',44,30,31,33);">44:30,31,33</a> J is described as a boy, but in <a onClick="return mV(\'Gen\',46,21);">46:21</a>, R or the Priestly Code (P), as the father of ten children. But evidently the author of chapter <a onClick="return mV(\'Gen\',46,\'1-\');">46</a> has in view the number 70 (compare verse <a onClick="return mV(\'Gen\',46,27);">27</a>; see <a onClick="return mV(\'Exd\',1,5);">Ex 1:5</a>; <a onClick="return mV(\'Num\',11,16,25);">Nu 11:16, 25</a>; <a onClick="return mV(\'Luk\',10,1);">Lu 10:1</a>; <a onClick="return mV(\'Exd\',15,27);">Ex 15:27</a>; <a onClick="return mV(\'Jdg\',12,13);">Jud 12:13</a>; and in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a> above, under 4,2); and for this reason, e.g. in <a onClick="return mV(\'Gen\',46,17);">Ge 46:17</a>, he mentions only one grand-daughter of Jacob; and for this he mentions all of the descendants of Jacob, even those who were born later in Egypt, but who already, as it were, had come to Egypt in the loins of their fathers, according to the view of the author. It certainly would be remarkable if no more grandchildren had been born to Jacob in Egypt, since <a onClick="return mV(\'Num\',26,\'1-\');">Nu 26</a> does not mention a single son of any of the sons of Jacob later than those reported in <a onClick="return mV(\'Gen\',46,\'1-\');">Ge 46</a>. In <a onClick="return mV(\'Gen\',46,27);">46:27</a> Joseph\'s sons, too, who were born in Egypt, are included in the list, entirely in harmony with <a onClick="return mV(\'Deu\',10,22);">De 10:22</a>. For such an arrangement and adjustment of a genealogy compare the 3 X 14 generations in <a onClick="return mV(\'Mat\',1,\'1-\');">Mt 1</a>. From this point of view no conclusions, as far as the documentary theory is concerned, can be drawn from the ten sons of Benjamin.``122';
isbe[3736]='Genesis, 4`IV. The Historical Character.<P>1. History of the Patriarchs: (<a onClick="return mV(\'Gen\',12,\'1-\');">Genesis 12-50</a>):<P>(1) Unfounded Attacks upon the History.<P>(a) From General Dogmatic Principles:<P>In order to disprove the historical character of the patriarchs, the critics are accustomed to operate largely with general dogmatic principles, such as this, that no nation knows who its original founder was. In answer to this it can be said that the history of Israel is and was from the beginning to the end unique, and cannot be judged by the average principles of historiography. But it is then claimed that Abraham\'s entire life appears to be only one continuous trial of faith, which was centered on the one promise of the true heir, but that this is in reality a psychological impossibility. Over against this claim we can in reply cite contrary facts from the history of several thousands of years; and that, too, in the experience of those very men who were most prominent in religious development, such as Paul and Luther.<P>(b) From Distance of Time:<P>Secondly, critics emphasize the long period of time that elapsed between these events themselves and their first records, especially if these records can be accredited to so late a period as the 9th or the 8th century BC. In consequence of this, it is claimed that much of the contents of Genesis is myth or fable; and Gunkel even resolves the whole book into a set of unconnected little myths and fables. Over against this claim we can again appeal to the universal feeling in this matter. I do not think that it can be made plausible, that in any race fables and myths came in the course of time more and more to be accepted as actual facts, so that perchance we should now be willing to accept as historical truths the stories of the Nibelungenlied or Red Riding Hood. But this, according to the critics, must have been the case in Israel. Prophets accepted the story of the destruction of the two cities in the Jordan valley, as recorded in <a onClick="return mV(\'Gen\',19,\'1-\');">Ge 19</a>, as correct (compare <a onClick="return mV(\'Amo\',4,11);">Am 4:11</a>; <a onClick="return mV(\'Isa\',1,9);">Isa 1:9</a>; <a onClick="return mV(\'Isa\',3,9);">3:9</a>; <a onClick="return mV(\'Hsa\',11,8);">Ho 11:8</a>); also Abraham as a historical person (<a onClick="return mV(\'Isa\',29,22);">Isa 29:22</a>; <a onClick="return mV(\'Isa\',41,8);">41:8</a>; <a onClick="return mV(\'Isa\',51,1);">51:1</a>; <a onClick="return mV(\'Mic\',7,20);">Mic 7:20</a>; <a onClick="return mV(\'Jer\',33,26);">Jer 33:26</a>; <a onClick="return mV(\'Eze\',33,24);">Eze 33:24</a>; and possibly <a onClick="return mV(\'Mal\',2,15);">Mal 2:15</a>); then Isaac (<a onClick="return mV(\'Amo\',7,9,16);">Am 7:9, 16</a>; <a onClick="return mV(\'Jer\',33,26);">Jer 33:26</a>); also Jacob (<a onClick="return mV(\'Hsa\',12,3);">Ho 12:3</a>ff; <a onClick="return mV(\'Amo\',9,8);">Am 9:8</a>; <a onClick="return mV(\'Jer\',33,26);">Jer 33:26</a>); also Joseph (<a onClick="return mV(\'Amo\',5,6,15);">Am 5:6, 15</a>); and these prophets evidently thought that these events and persons were regarded as historical by the people in general. In the New Testament we can cite, for Abraham, <a onClick="return mV(\'Mat\',3,9);">Mt 3:9</a>; <a onClick="return mV(\'Gal\',3,\'1-\');">Ga 3</a>; <a onClick="return mV(\'Gal\',4,21);">4:21</a>ff; <a onClick="return mV(\'Rom\',4,9);">Ro 4:9</a>ff; <a onClick="return mV(\'Rom\',9,7);">9:7</a>ff; <a onClick="return mV(\'Hbr\',7,1);">Heb 7:1</a>ff; <a onClick="return mV(\'Hbr\',11,8);">11:8</a>ff; <a onClick="return mV(\'Jam\',2,21);">Jas 2:21</a>ff, and especially the words of Jesus in <a onClick="return mV(\'Mat\',8,11);">Mt 8:11</a>; <a onClick="return mV(\'Luk\',16,22);">Lu 16:22</a>ff; <a onClick="return mV(\'Jhn\',8,52);">Joh 8:52</a>ff; finally in <a onClick="return mV(\'Mat\',22,31);">Mt 22:31</a>f; the whole argument for the resurrection of the dead is without a foundation if the patriarchs are not historical personages. Over against this, there was no period in the history of Israel in which it can be shown that these stories of Genesis Were regarded only as myths. If these events were actual occurrences, then those things which the patriarchs experienced were so unique that these experiences were not forgotten for a long time. Then, too, we can also refer to the strength of the memory of those nations that were not accustomed to have written records of their history.<P>(c) From Biblical Data:<P>Finally, the attempt has been made to discover in the Bible itself a pre-Mosaic stage in its ideas of man concerning God, which is claimed to contradict the higher development of Divine ideas in the patriarchs, for which purpose the critics appeal to <a onClick="return mV(\'Eze\',23,3,8);">Eze 23:3, 8</a>; <a onClick="return mV(\'Eze\',20,7);">20:7</a>ff; <a onClick="return mV(\'Jos\',24,14);">Jos 24:14</a>ff. But at these places it is evident that the idolatry of the people is pictured as apostasy. And when in <a onClick="return mV(\'Exd\',6,2);">Ex 6:2</a>ff the name of Yahweh is as a matter of fact represented as something new, it is nevertheless a fact that in these very passages the revelation given is connected with the history of the patriarchs. The same is true of <a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a>ff. The whole hypothesis that the religion before the days of Moses was polytheistic has not been derived from the Bible, but is interpreted into it, and ends in doing violence to the facts there recorded (compare my book, Die Entwicklung der alttestamentlichen Gottesidee in vorexilischer Zeit).<P>(d) From Comparison with Religion of Arabia:<P>The critics further compare the pre-Mosaic religion of Israel with the low grade of religion in Arabia in the 5th century after Christ; but in order to do this, they must isolate Israel entirely, since all the surrounding nations at the time of the Tell el-Amarna Letters had attained to an altogether different and higher stage of religious development and civilization.<P>(2) Unsatisfactory Attempts at Explaining the Patriarchal Age.<P>(a) Explanation Based on High Places:<P>In denying the historical character of the account of the patriarchs in Genesis, the critics are forced to contrive some scheme in explanation of the existence of these stories, but in doing this they make some bad breaks. Thus, e.g., they say that the Israelites when they entered Canaan found there the high places of the heathen peoples; and since if they wanted to make use of these in the service of Yahweh they must first declare them legitimate places of worship, this was done by inventing the history of the patriarchs, who long before this are said to have already consecrated all these places to the Yahweh worship. But how is it possible on this supposition to explain the story of Joseph, which transpired in Egypt? Then, too, the reasons for the origin of the other stories of the patriarchs would be enshrouded in a remarkable mystery and would be of very inferior character. Again, it is nowhere declared in the passages of Genesis that here come into consideration that they are reporting the beginnings of a permanent cult when they give an account of how God appeared to the patriarchs or when they erected altars in His honor. And, finally, while it is indeed true that the cult localities of the patriarchs are in part identical with those of later times (compare Bethel, Beersheba)—and this is from the outset probable, because certain places, such as hills, trees, water, etc., as it were, of themselves were suitable for purposes of the cult—yet such an identification of earlier and later localities does not cover all cases. And can we imagine that a prophetical method of writing history would have had any occasion in this manner to declare the worship of calves in Bethel a legitimate service?<P>(b) The Dating Back of Later Events to Earlier Times:<P>But we are further told that the pre-prophetic condition of affairs in Israel was in general dated back into the primitive period, and this was done in such a way that the character of Abraham was regarded as reproducing ideal Israel, and the character of Jacob the empirical Israel in the past; something that certainly is from the outset an odd speculation of too much learning! If this explanation is correct, what shall we then do with Isaac and Joseph? And why is the whole story of the condition of civilization pictured in Genesis so entirely different from that of later times? And is Abraham really a perfect ideal? Is he not rather, notwithstanding his mighty faith, a human being of flesh and blood, who can even doubt (<a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a>f; <a onClick="return mV(\'Gen\',17,17);">17:17</a>); who can make use of sinful means to realize the promise (<a onClick="return mV(\'Gen\',16,\'1-\');">Ge 16</a>, Hagar); who tells a falsehood, although for the best of purposes, namely, to protect his wife (<a onClick="return mV(\'Gen\',12,9);">Ge 12:9</a>), and for this reason must accept the rebuke of the heathen Abimelech (<a onClick="return mV(\'Gen\',20,9);">Ge 20:9</a>f)? In addition, Abraham is married to his half-sister (<a onClick="return mV(\'Gen\',20,12);">Ge 20:12</a>), which, according to <a onClick="return mV(\'Deu\',27,22);">De 27:22</a>; <a onClick="return mV(\'Lev\',18,9,11);">Le 18:9, 11</a>; <a onClick="return mV(\'Lev\',20,17);">20:17</a>, is forbidden with the penalty of death for the transgressor. In the same way Jacob, according to <a onClick="return mV(\'Gen\',29,\'1-\');">Ge 29</a>f; has two sisters as wives, which is also declared by <a onClick="return mV(\'Lev\',18,18);">Le 18:18</a> to be a crime.<P>(c) The Patriarchs as heroes eponymi:<P>In the third place, it is said that the people have in the persons of the patriarchs made for themselves eponymous heroes. But why did they make so many at one time? In addition, Abraham cannot possibly be regard
