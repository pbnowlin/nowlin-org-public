isbe[3788]='Giddalti`gi-dal\'-ti (giddalti, "I magnify (God)"): A son of Heman (<a onClick="return mV(\'1Ch\',25,4,29);">1Ch 25:4, 29</a>), one of David\'s musicians.``1';
isbe[3789]='Giddel`gid\'-el (giddel, "very great," "stout"):<P>(1) The name of the head of a family of Nethinim (<a onClick="return mV(\'Ezr\',2,47);">Ezr 2:47</a> = <a onClick="return mV(\'Neh\',7,49);">Ne 7:49</a> = 1Esdras 5:30 (here as Cathua)).<P>(2) The name of the head of a family of Solomon\'s servants (<a onClick="return mV(\'Ezr\',2,56);">Ezr 2:56</a> = <a onClick="return mV(\'Neh\',7,58);">Ne 7:58</a> = 1Esdras 5:33 (here Isdael)).``1';
isbe[3790]='Gideon`gid\'-e-un (gidh\'on, "cutter down," "feller" or "hewer"):<P>1. His Family and Home:<P>Also named Jerubbaal (<a onClick="return mV(\'Jdg\',6,32);">Jud 6:32</a>) and Jerubbesheth (<a onClick="return mV(\'2Sa\',11,21);">2Sa 11:21</a>), youngest son of Joash, of the clan of Abiezer in the tribe of Manasseh. His home was at Ophrah, and his family an obscure one. He became the chief leader of Manasseh and the fifth recorded judge of Israel. The record of his life is found in <a onClick="return mV(\'Jdg\',6,\'1-\');">Jud 6-8</a>.<P>Joash was an idolater, and sacrifices to Baal were common among the entire clan. Gideon seems to have held this worship in contempt, and to have pondered deeply the causes of Israel\'s reverses and the injuries wrought upon his own family by the hand of the Midianites.<P>2. The Midianite Oppression:<P>The Midianites under Zebah and Zalmunna, their two greatest chiefs, accompanied by other wild tribes of the eastern desert, had gradually encroached on the territory of Israel in Central Palestine. They came first as marauders and pillagers at the time of the harvests, but later they forcibly took possession of lands, and thus inflicted permanent injury and loss, especially upon Manasseh and Ephraim. The conflicts became so numerous, the appropriation of land so flagrant, that the matter of sustenance became a serious problem (<a onClick="return mV(\'Jdg\',6,4);">Jud 6:4</a>). The multitude of these desert hordes and the cruelty of their depredation rendered defense difficult, and, lacking in the split of national unity, the Israelites were driven to dens, caves and rocky strongholds for safety (<a onClick="return mV(\'Jdg\',6,2);">Jud 6:2</a>). After seven years of such invasion and suffering Gideon comes upon the scene.<P>3. The Call of Gideon:<P>It is probable that Gideon had already distinguished himself in resistance to the Midianites (<a onClick="return mV(\'Jdg\',6,12);">Jud 6:12</a>), but he now receives Divine commission to assume the leadership. Having taken his own little harvest to a secret place for threshing, that it might escape the greed of the Midianites, he is surprised while at work by a visit from the Lord in the form of an angel. However this scene (<a onClick="return mV(\'Jdg\',6,11);">Jud 6:11</a>) and its miraculous incidents may be interpreted, there can be no question of the divineness of Gideon\'s call or that the voice which spoke to him was the voice of God. Neither the brooding over the death of his brothers at Tabor (<a onClick="return mV(\'Jdg\',8,18);">Jud 8:18</a>) nor the patriotic impulses dwelling within him can account for his assumption of leadership. Nor did he become leader at the demand of the people. He evidently had scarcely thought of himself as his country\'s deliverer. The call not only came to him as a surprise, but found him distrustful both of himself (<a onClick="return mV(\'Jdg\',6,15);">Jud 6:15</a>) and of his people (<a onClick="return mV(\'Jdg\',6,13);">Jud 6:13</a>). It found him too without inclination for the task, and only his conviction that the command was of God persuaded him to assume leadership. This gives the note of accuracy to the essential facts of the story. Gideon\'s demand for a sign (<a onClick="return mV(\'Jdg\',6,17);">Jud 6:17</a>) being answered, the food offered the messenger having been consumed by fire at the touch of his staff, Gideon acknowledged the Divine commission of his visitor, and at the place of visitation built an altar to Yahweh (<a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>).<P>4. His First Commission:<P>The call and first commission of Gideon are closely joined. He is at once commanded to destroy the altars of Baal set up by his father at Ophrah, to build an altar to Yahweh at the same place and thereon to offer one of his father\'s bullocks as a sacrifice (<a onClick="return mV(\'Jdg\',6,25);">Jud 6:25</a>f). There is no reason to look on this as a second version of Gideon\'s call. It is rather the beginning of instruction, and is deeply significant of the accuracy of the story, in that it follows the line of all revelation to God\'s prophets and reformers to begin their work at home. Taking ten men, under the cover of darkness, Gideon does as commanded (<a onClick="return mV(\'Jdg\',6,27);">Jud 6:27</a>). The morning revealed his work and visited upon him the wrath of the people of Ophrah. They demand of Joash that he put his son to death. The answer of Joash is an ironical but valid defense of Gideon. Why should the people plead for Baal? A god should be able to plead his own cause (<a onClick="return mV(\'Jdg\',6,28);">Jud 6:28</a>). This defense gained for Gideon the name Jerubbaal (yerubba\'al, i.e. yarebh bo ha-ba\'al, "Let Baal plead," <a onClick="return mV(\'Jdg\',6,32);">Jud 6:32</a> the King James Version).<P>The time intervening between this home scene and the actual campaign against the Midianites cannot definitely be named. It is probable that it took months for Gideon even to rally the people of his own clan. The fact is that all the subsequent events of the story are somewhat confused by what looks like a double narrative in which there are apparent but not vital differences. Without ignoring this fact it is still possible to get a connected account of what actually transpired.<P>5. Gideon\'s Army:<P>When the allied invaders were in camp on the plain of Jezreel, we find Gideon, having recruited the Abiezrites and sent messengers to the various tribes of Israel (<a onClick="return mV(\'Jdg\',6,34);">Jud 6:34</a>f), pitching his camp near the Midianites. The location of the various camps of Gideon is difficult, as is the method of the recruiting of the tribes. For instance, <a onClick="return mV(\'Jdg\',6,35);">Jud 6:35</a> seems to be in direct contradiction to <a onClick="return mV(\'Jdg\',7,23);">7:23</A>, and both are considered of doubtful origin. There was evidently, however, a preliminary encampment at the place of rallying. While waiting here, Gideon further tested his commission by the dry and wet fleece (<a onClick="return mV(\'Jdg\',6,37);">6:37</A>ff) and, convinced of God\'s purpose to save Israel by his leadership, he moves his camp to the southeast edge of the plain of Jezreel nearby the spring of Harod. From his point of vantage here he could look down on the tents of Midian. The account of the reduction of his large army from 32,000 to 300 (<a onClick="return mV(\'Jdg\',7,2);">7:2</A>ff) is generally accepted as belonging to a later tradition, Neither of the tests, however, is unnatural, and the first was not unusual. According to the account, Gideon at the Lord\'s command first excused all the fearful. This left him with 10,000 men. This number was reduced to 300 by a test of their method of drinking. This test can easily be seen to evidence the eagerness and courage of men for battle (Jos).<P>6. The Midianites\' Discomfiture and Flight:<P>Having thus reduced the army and having the assurance that the Lord would deliver to him and his little band the forces of Midian, Gideon, with a servant, went by night to the edge of the camp of his enemy, and there heard the telling and interpretation of a dream which greatly encouraged him and led him to strike an immediate blow (<a onClick="return mV(\'Jdg\',7,9);">Jud 7:9</a>). Again we find a conflict of statement between <a onClick="return mV(\'Jdg\',7,20);">Jud 7:20</a> and <a onClick="return mV(\'Jdg\',7,22);">7:22</A>, but the conflict is as to detail only. Dividing his men into three equal bands, Gideon arranges that with trumpets, and lights concealed in pitchers, and with the cry, "The sword of Yahweh and of Gideon!" they shall descend and charge the Midianites simultaneously from three sides. This stratagem for concealing his numbers and for terrifying the enemy succeeds, and the Midianites and their allies flee in disorder toward the Jordan (<a onClick="return mV(\'Jdg\',7,18);">7:18</A>ff). The rout was complete, and the victory was intensified by the fact that in the darkness the enemy turned their swords against one another. Admitting that we have two narratives (compare <a onClick="return mV(\'Jdg\',7,24);">7:24</A>; <a onClick="return mV(\'Jdg\',8,3);">8:3</A> with <a onClick="return mV(\'Jdg\',8,4);">8:4</A>ff) and that there is some difference between them in the details of the attack and the progress of the conflict, there is no need for confusion in the main line of events. One part of the fleeing enemy evidently crossed the Jordan at Succoth, being led by Zebah and Zalmunna. The superior force followed the river farther south, toward the ford of Bethbarah.<P>7. Death of Oreb and Zeeb<P>Gideon sent messengers to the men of Ephraim (<a onClick="return mV(\'Jdg\',7,24);">7:24</a>), probably before the first attack, asking them to intercept the Midianites, should they attempt to escape by the fords in their territory. This they did, defeating the enemy at Beth-barah and slaying the princes Oreb and Zeeb ("the Raven" and "the Wolf"). As proof of their victory and valor they brought the heads of the princes to Gideon and accused him of having discounted their bravery by not calling them earlier into the fight. But Gideon was a master of diplomacy, as well as of strategy, and won the friendship of Ephraim by magnifying their accomplishment in comparison with his own (<a onClick="return mV(\'Jdg\',8,1);">8:1</a>ff).<P>Gideon now pursues Zebah and Zalmunna on the east side of the river. The people on that side are still in great fear of the Midianites and refuse even to feed his army. At Succoth they say to him, "Are the hands of Zebah and Zalmunna now in thy hand, that we should give bread unto thine army?" (<a onClick="return mV(\'Jdg\',8,6);">Jud 8:6</a>). At Penuel he meets with the same refusal (<a onClick="return mV(\'Jdg\',8,8);">Jud 8:8</a>). Promising to deal with Succoth and Penuel as they deserve when he is through with his present task, Gideon pushes on with his half-famished but courageous men, overtakes the Midianites, defeats them, captures Zebah and Zalmunna, and, returning, punishes, according to his promise, both Succoth and Penuel (<a onClick="return mV(\'Jdg\',8,7,9,13);">Jud 8:7, 9, 13</a>).<P>8. Death of Zebah and Zalmunna:<P>Thus was the power of the Midianites and the desert hordes broken in Canaan and a forty years\' peace came to Israel. But the two Kings of Midian must now meet their fate as defeated warriors. They had led their forces at Tabor when the brothers of Gideon perished. So Gideon commands his young son Jether to slay them as though they were not worthy of death at a warrior\'s hand (<a onClick="return mV(\'Jdg\',8,20);">Jud 8:20</a>). The youth fearing the task, Gideon himself put them to death (<a onClick="return mV(\'Jdg\',8,21);">Jud 8:21</a>).<P>9. Gideon\'s Ephod:<P>The people clamored to make Gideon king. He refused, being moved possibly by a desire to maintain theocracy. To this end he asks only the jewelry taken as spoil in the battles (<a onClick="return mV(\'Jdg\',8,24);">Jud 8:24</a>), and with it makes an ephod, probably an image of Yahweh, and places it in a house of the Lord at Ophrah. By this act it was later thought that Gideon contributed to a future idolatry of Israel. The narrative properly closes with <a onClick="return mV(\'Jdg\',8,28);">Jud 8:28</a>.<P>10. His Death:<P>The remaining verses containing the account of Gideon\'s family and death (<a onClick="return mV(\'Jdg\',8,30);">Jud 8:30</a>) and the record of events immediately subsequent to Gideon\'s death (<a onClick="return mV(\'Jdg\',8,33);">Jud 8:33</a>) come from other sources than the original narrators.``158';
isbe[3791]='Gideoni`gid-e-o\'-ni (gidh\'oni): The father of Abidan who was prince of Benjamin, mentioned only in connection with the son (<a onClick="return mV(\'Num\',1,11);">Nu 1:11</a>; <a onClick="return mV(\'Num\',2,22);">2:22</a>; <a onClick="return mV(\'Num\',7,60,65);">7:60, 65</a>; <a onClick="return mV(\'Num\',10,24);">10:24</a>).``1';
isbe[3792]='Gidom`gi\'-dom (gidh\'om): The limit eastward, from Gibeah toward the wilderness, of the pursuit of Benjamin by Israel (<a onClick="return mV(\'Jdg\',20,45);">Jud 20:45</a>). No name suggesting this has yet been recovered. It is not mentioned elsewhere.``1';
isbe[3793]='Gier-Eagle`jer\'-e-g\'-l (racham; kuknos, in Leviticus, porphurion, in Deuteronomy): The name applied to one of the commonest of the vultures, and not an eagle at all. The word is derived from a Hebrew root, meaning "to love," and was applied to the birds because mated pairs seldom separated. These were smaller birds and inferior to the largest members of the family. They nested on a solid base, lived in pairs, and not only flocked over carrion as larger species permitted, but also ate the vilest offal of all sorts, for which reason they were protected by a death penalty by one of the Pharaohs. Because of this the birds became so frequent and daring around camps, among tent-dwellers, and in cities, that they were commonly called "Pharaoh\'s chickens." They are mentioned in the Bible in the lists of abominations found in <a onClick="return mV(\'Lev\',11,13);">Le 11:13</a> and <a onClick="return mV(\'Deu\',14,12);">De 14:12</a> (the King James Version "ossifrage"); <a onClick="return mV(\'Deu\',14,17);">De 14:17</a> the King James Version (the Revised Version (British and American) "vulture").``167';
isbe[3794]='Gift`gift (mattanah, minchah, shochadh; doron, dorea, chairisma): In <a onClick="return mV(\'Gen\',25,6);">Ge 25:6</a>; <a onClick="return mV(\'Exd\',28,38);">Ex 28:38</a>; <a onClick="return mV(\'Num\',18,6,7,29);">Nu 18:6-7, 29</a>; <a onClick="return mV(\'Eze\',20,26);">Eze 20:26</a>, etc., mattanah, "a gift," is so rendered; minchah, an offering or present, used especially of the "meat offerings," is translated "gift" (<a onClick="return mV(\'2Sa\',8,2,6);">2Sa 8:2, 6</a> the King James Version; <a onClick="return mV(\'2Ch\',26,8);">2Ch 26:8</a>), in which passages "tribute" is meant, as the Revised Version (British and American); 32:23; <a onClick="return mV(\'Psa\',45,12);">Ps 45:12</a>. A few other words occur singly, e.g. \'eshkar, "a reward" (<a onClick="return mV(\'Psa\',72,10);">Ps 72:10</a>); mas\'eth, "lifting up" (<a onClick="return mV(\'Est\',2,18);">Es 2:18</a>); nathun is translated "gifts" (<a onClick="return mV(\'Num\',8,19);">Nu 8:19</a>; the Revised Version, margin "Hebrew nethunim, given"); nedheh, nadhan, "impure gifts" (<a onClick="return mV(\'Eze\',16,33);">Eze 16:33</a>); nisse\'th, "a thing lifted up" (<a onClick="return mV(\'2Sa\',19,42);">2Sa 19:42</a>); shochadh means "a bribe" (<a onClick="return mV(\'Exd\',23,8);">Ex 23:8</a>; <a onClick="return mV(\'Deu\',16,19);">De 16:19</a>; <a onClick="return mV(\'2Ch\',19,7);">2Ch 19:7</a>; <a onClick="return mV(\'Pro\',6,35);">Pr 6:35</a>; <a onClick="return mV(\'Pro\',17,8,23);">17:8, 23</a>; <a onClick="return mV(\'Isa\',1,23);">Isa 1:23</a>; <a onClick="return mV(\'Eze\',22,12);">Eze 22:12</a>); in each instance the American Standard Revised Version has "bribe" except <a onClick="return mV(\'Pro\',6,35);">Pr 6:35</a>, "gifts"; teramah, "a present" (<a onClick="return mV(\'Pro\',29,4);">Pr 29:4</a>), may also mean a bribe, the King James Version "he that receiveth gifts," the Revised Version (British and American) "he that exacteth gifts," margin "imposeth tribute, Hebrew a man of offerings."<P>In the New Testament doron, "a present," "gift" (from didomi, "to give"), is translated "gift" (<a onClick="return mV(\'Mat\',2,11);">Mt 2:11</a>; <a onClick="return mV(\'Mat\',5,23,24);">5:23-24</a> bis; <a onClick="return mV(\'Mar\',7,11);">Mr 7:11</a> the King James Version; <a onClick="return mV(\'Hbr\',5,1);">Heb 5:1</a>; <a onClick="return mV(\'Rev\',11,10);">Re 11:10</a>, etc., referring chiefly to gifts or offerings to God); dorea, "a free gift" (<a onClick="return mV(\'Jhn\',4,10);">Joh 4:10</a>; <a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Rom\',5,15,17);">Ro 5:15, 17</a>; <a onClick="return mV(\'2Cr\',9,15);">2Co 9:15</a>; <a onClick="return mV(\'Hbr\',6,4);">Heb 6:4</a>, etc., referring to the gifts of God); dorema, "a free gift" (<a onClick="return mV(\'Rom\',5,16);">Ro 5:16</a>; <a onClick="return mV(\'Jam\',1,17);">Jas 1:17</a>, the English Revised Version "boon"); dosis, "giving" (<a onClick="return mV(\'Jam\',1,17);">Jas 1:17</a>, "every good gift," the Revised Version, margin "giving"); charisma, "grace," "favor," a benefit or good conferred, is also used of Divine gifts and favors, especially of the supernatural gifts imparted by the Holy Spirit (charismata) enumerated in <a onClick="return mV(\'Rom\',12,\'1-\');">Ro 12</a>; <a onClick="return mV(\'1Cr\',12,\'1-\');">1Co 12</a>; the word occurs translated "gift, gifts" (<a onClick="return mV(\'Rom\',1,11);">Ro 1:11</a>), "some spiritual gift" (<a onClick="return mV(\'Rom\',5,15,16);">Ro 5:15-16</a>, "free gift"; <a onClick="return mV(\'Rom\',6,23);">Ro 6:23</a>, "The gift of God is eternal life," the Revised Version (British and American) "free gift"; <a onClick="return mV(\'Rom\',11,29);">11:29</a>; <a onClick="return mV(\'1Cr\',1,7);">1Co 1:7</a>; <a onClick="return mV(\'1Cr\',7,7);">7:7</a>; <a onClick="return mV(\'2Cr\',1,11);">2Co 1:11</a>; <a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>; <a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>; <a onClick="return mV(\'1Pe\',4,10);">1Pe 4:10</a>); charis, "grace," "favor" (<a onClick="return mV(\'2Cr\',8,4);">2Co 8:4</a>, the Revised Version (British and American) "grace"); merismos, "distribution," "parting" (<a onClick="return mV(\'Hbr\',2,4);">Heb 2:4</a>, the Revised Version, margin "distributions"); anathema, "a thing devoted to God," is once (<a onClick="return mV(\'Luk\',21,5);">Lu 21:5</a>) used of "the goodly gifts" (the Revised Version (British and American) "offerings") which adorned the Temple at Jerusalem.<P>In the Revised Version (British and American) "gift" is substituted in the text of <a onClick="return mV(\'Gen\',33,11);">Ge 33:11</a> for blessing, margin Hebrew "blessing"; "boasteth himself of his gifts falsely" (<a onClick="return mV(\'Pro\',25,14);">Pr 25:14</a>) for "boasteth himself of a false gift," margin Hebrew "in a gift of falsehood"; "a parting gift" for "presents" (<a onClick="return mV(\'Mic\',1,14);">Mic 1:14</a>); "Given to God" for "a gift" (<a onClick="return mV(\'Mar\',7,11);">Mr 7:11</a>).``185';

isbe[3798]='Gihon (1)`gi\'-hon (gichon; Geon): One of the four rivers of Eden (<a onClick="return mV(\'Gen\',2,13);">Ge 2:13</a>). It is said to compass the Whole land of Cush (Ethiopia), probably a province east of the Tigris. The Gihon is thought by Sayce to be the Kerkha, coming down from Luristan through the province known in the cuneiform texts as Kassi, probably the Cush of the Bible.<P>See <a href="study/isbe/search.html?string=EDEN">EDEN</A>.<P>Used figuratively of wisdom in Sirach 24:27, "as Gihon (the King James Version Geon) in the days of vintage."``1';
isbe[3799]='Gihon (2)`(gichon, gichon (in 1 K), from root gayach "to burst forth"):<P>(1) See preceding article [<a href="./study/isbe/search.html?string=GIHON+(1)">Gihon (1)</a>].<P>(2) The Nile in <a onClick="return mV(\'Jer\',2,18);">Jer 2:18</a> Septuagint (Geon); in Hebrew shichor (see <a href="study/isbe/search.html?string=SHIHOR">SHIHOR</a>).<P>(3) A spring in Jerusalem, evidently sacred, and, for that reason, selected as the scene of Solomon\'s coronation (<a onClick="return mV(\'1Ki\',1,38);">1Ki 1:38</a>). It is without doubt the spring known to the Moslems as \'Ain Umm edition deraj ("the spring of the steps") and to the Christians as \'Ain Sitti Miriam ("the spring of the lady Mary"), or commonly as the "Virgin\'s Fount." It is the one true spring of Jerusalem, the original source of attraction to the site of the early settlers; it is situated in the Kidron valley on the east side of "Ophel," and due south of the temple area. See <a href="study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>. The water in the present day is brackish and impregnated with sewage. The spring is intermittent in character, "bursting up" at intervals: this feature may account for the name Gihon and for its sacred characters. In New Testament times it was, as it is today, credited with healing virtues. See <a href="study/isbe/search.html?string=BETHESDA">BETHESDA</a>. Its position is clearly defined in the Old Testament. Manasseh "built an outer wall to the city of David, on the west side of Gihon, in the valley" (= Nahal, i.e. the Kidron; <a onClick="return mV(\'2Ch\',33,14);">2Ch 33:14</a>). From Gihon Hezekiah made his aqueduct (<a onClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>), now the Siloam tunnel.<P>See <a href="study/isbe/search.html?string=SILOAM">SILOAM</a>.<P>The spring is approached by a steep descent down 30 steps, the water rising deep underground; the condition is due to the vast accumulation of rubbish—the result of the many destructions of the city—which now fills the valley bed. Originally the water ran down the open valley. The water rises from a long deep crack in the rock, partly under the lowest of the steps and to a lesser extent in the mouth of a small cave, 11 1/2 ft. long by 5 ft. wide, into which all the water pours. The village women of Siloam obtain the water at the mouth of the cave, but when the supply is scanty they actually go under the lowest step—where there is a kind of chamber—and fill their vessels there. At the farther end of this cave is the opening leading into the aqueduct down which the water flows to emerge after many windings at the pool of Siloam. The first part of this aqueduct is older than the time of Hezekiah and led originally to the perpendicular shaft, connected with "Warren\'s tunnel" described elsewhere (see <a href="study/isbe/search.html?string=SILOAM">SILOAM</a>; <a href="study/isbe/search.html?string=ZION">ZION</a>).<P>The preeminent position of importance which Gihon held in the eyes of the earlier inhabitants of Jerusalem is shown by the extraordinary number of passages, rock cuttings, walls and aqueducts which exist all about the spring. Walls have been made at different periods to bank up the waters and direct them into the channels provided for them. Of aqueducts, besides the "Siloam aqueduct," two others have been formed. One running from the source at a considerable lower level than that of Hezekiah was followed by the present writer (see PEFS, 1902, 35-38) for 176 ft. It was very winding, following apparently the west side of the Kidron valley. It was a well-cemented channel, about 1 1/2 ft. wide and on an average of 4 1/2 ft. high, roofed in with well-cut stones. There are no certain indications of age, but in the writer\'s opinion it is a much later construction than Hezekiah\'s aqueduct, though the rock-cut part near the source may be older. It was discovered by the Siloam fellahin, because, through a fault in the dam, all the water of the "Virgin\'s Fount" was disappearing down this channel. A third aqueduct has recently been discovered running off at a higher level than the other two. It is a channel deeply cut in the rock with curious trough-like stones all along its floor. It appears to be made for water, but one branch of it actually slopes upward toward its end. The pottery, which is early Hebrew, shows that it is very ancient. The whole accumulated debris around the source is full of pre-Israelite and early Israelite pottery.``117';
isbe[3800]='Gilalai`gil\'-a-li, gi-la\'-li (gilalay): A musician in the procession at the dedication of the wall, son of a priest (<a onClick="return mV(\'Neh\',12,36);">Ne 12:36</a>).``1';
