<script type="text/javascript">
isbe = [];
isbe[3701]='Gazites`gaz\'-its:<P>Inhabitants of Gaza, who were Philistines when the Israelites came into contact with them (<a onClick="return mV(\'Jos\',13,3);">Jos 13:3</a>; <a onClick="return mV(\'Jdg\',16,2);">Jud 16:2</a>), but there was an older stratum of population which occupied the place before the invasion of the Philistines, probably of Amorite stock.``1';
isbe[3702]='Gazzam`gaz\'-am (gazzam, "devouring"):<P>Head of a family of Nethinim who returned from exile (<a onClick="return mV(\'Ezr\',2,48);">Ezr 2:48</a>; <a onClick="return mV(\'Neh\',7,51);">Ne 7:51</a>; 1Esdras 5:31, "Gazera").``1';
isbe[3703]='Ge-Harashim`ge-ha-ra\'-shim (ge\'charashim): In <a onClick="return mV(\'1Ch\',4,14);">1Ch 4:14</a>, the King James Version renders "valley of Charashim." In <a onClick="return mV(\'Neh\',11,35);">Ne 11:35</a>, English Versions of the Bible renders "valley of craftsmen"; here it is named with Lod and Ono. Something of the name perhaps survives in Khirbet Hirsa, east of Lydda.``1';
isbe[3704]='Geba`ge\'-ba (gebha\', "hill"):<P>(1) A town on the northeast boundary of the territory of Benjamin (<a onClick="return mV(\'Jos\',18,24);">Jos 18:24</a>), given to the Levites (<a onClick="return mV(\'Jos\',21,17);">Jos 21:17</a>; <a onClick="return mV(\'1Ch\',6,60);">1Ch 6:60</a>). It stood on the northern frontier of the kingdom of Judah, Geba and Beersheba marking respectively the northern and southern limits (<a onClick="return mV(\'2Ki\',23,8);">2Ki 23:8</a>). In <a onClick="return mV(\'2Sa\',5,25);">2Sa 5:25</a> "Geba" should be altered to "Gibeon," which stands in the corresponding passage, <a onClick="return mV(\'1Ch\',14,16);">1Ch 14:16</a>. In <a onClick="return mV(\'Jdg\',20,10,33);">Jud 20:10, 33</a>; <a onClick="return mV(\'1Sa\',13,3,16);">1Sa 13:3, 16</a>, the Hebrew reads "Geba," the translation "Gibeah" being due to confusion of the two names. From <a onClick="return mV(\'1Sa\',14,5);">1Sa 14:5</a> we gather that Geba stood to the south of the great gorge, Wady Suweinit, commanding the pass at Michmash. This was the scene of Jonathan\'s daring enterprise against the Philistines, when, accompanied by his armor-bearer, he accomplished an apparently impossible feat, climbing the rocky steeps of the gorge to the north and putting the enemy to flight. There can be no doubt that the modern village of Jeba\' occupies the ancient site. It stands to the south of Wady Suweinit, looking toward Michmash—modern Mukhmas—with Seneh, the crag on the southern lip of the gorge, in front of it. The distance from Jerusalem is about 6 miles. It was fortified by Asa with materials that his enemy Baasha had used to fortify Ramah against him (<a onClick="return mV(\'1Ki\',15,22);">1Ki 15:22</a>). It is named by Isaiah in his description of the terrifying march of the Assyrians upon Jerusalem from the north (<a onClick="return mV(\'1Ki\',10,28);">10:28</a>ff). It appears among the cities which were reoccupied by Israel after the Exile (<a onClick="return mV(\'Ezr\',2,26);">Ezr 2:26</a>; <a onClick="return mV(\'Neh\',11,31);">Ne 11:31</a>).<P>(2) (Gaibai): Between a fortress so named and Scythopolis (Beisan), Holofernes pitched his camp (Judith 3:10). On the high road that runs through Jenin, and down the Vale of Jezreel to Beisan, about 2 miles to the south of Sanur, stands the village of Jeba\', with which this fortress may be identified.``54';
isbe[3705]='Gebal`ge\'-bal (gebhal, "border"; Bublos, and Biblos; Byblus, modern Jebeil):<P>(1) An ancient Phoenician city, situated on a bluff of the foothills of Lebanon, overlooking the Mediterranean. It was one of the principal seaports of Phoenicia, and had a small but good harbor for small ships. It lies in lat. 34 degrees 8\', nearly, and about 4 miles north of the river Adonis (Nahr Ibrahim). It was regarded as a holy city by the ancients. Philo mentions the tradition that it was founded by Kronos, and was sacred to the worship of Beltis and, later, of Adonis, whose rites were celebrated yearly at the river of the same name and at its source in the mountain, at Apheca (see <a href="study/isbe/search.html?string=TAMMUZ">TAMMUZ</a>). Gebal was the center of quite an extensive district, extending from the Eleutherus on the north to the Tamyras on the south, a distance of 60 or 70 miles along the coast. It is mentioned by Joshua (<a onClick="return mV(\'Jos\',13,5);">13:5</a>) as the land of the <a href="./study/isbe/search.html?string=GEBALITES">Gebalites</a> (which see) (the King James Version "Giblites"), and the Gebalites are also mentioned in <a onClick="return mV(\'1Ki\',5,18);">1Ki 5:18 (Hebrew 32)</a> as aiding in the construction of Solomon\'s temple. The "elders" and the "wise men" of Gebal are among the workmen employed on Tyrian ships (<a onClick="return mV(\'Eze\',27,9);">Eze 27:9</a> the American Revised Version, margin). The earliest mention of Gebal found in history is in the Tell el-Amarna Letters, which were composed in the first half of the 14th century BC. It had become, in connection with all Phoenicia, a dependency of Egypt in the days of Thothmes III and was under Egyptian governors, but, in the reign of Amenhotep IV (Ikhnaton), the Hittites and Amorites from the north and Khabiri from the south attacked the territory of Gebal, and its governor wrote letters to Amenhotep, calling for help. There are over 60 of these, describing the desperate condition of the city and of its governor, Ribaddi, who was expelled and took refuge in Beirut, but afterward regained his capital only to be besieged and lose all his dependencies, and finally to fall into the hands of the enemy. Gebal afterward became independent, as is shown by the records of Ramses IX (1442-1423 BC) and of Ramses XII, for its king retained the emissaries of the former 17 years in captivity, and treated a trusted agent of the latter with scant civility. Its king at this time was Zakkar-Baal, and kings of Gebal are mentioned in the Assyrian records, one paying tribute to Ashurnazir-pal (circa 887 BC) and another to Sennacherib (705-680). The latter king was Uru-melek, and kings of Gebal are mentioned in connection with other Phoenician cities under Persian rule. The city submitted to Alexander the Great without opposition, and furnished a fleet to aid him in the siege of Tyre (332). Strabo refers to it as a town of note in the days of Pompey (xvi.2,17), and it is frequently mentioned in Phoenician (CIS, 1) and Assyrian inscriptions in the forms Gubal and Gubli (COT, I, 174).<P>(2) (gebhal; Gobolitis): A district southeast of the Dead Sea, which is referred to in <a onClick="return mV(\'Psa\',83,7);">Ps 83:7 (Hebrew 8)</a> in connection with Moab, Ammon, Amalek and others, as making a covenant together against Israel (compare 1Macc 5). Robinson (BR, II, 154) found the name Jebal still applied to this region, and Josephus (Ant., II, i, 2) speaks of a Gebalitis as forming part of Idumaea. It is a hilly region, as the modern name signifies, and includes the towns of Shobek and Tolfieh.``138';
isbe[3706]='Gebalites`ge\'-bal-its (ha-gibhlim): Inhabitants of <a href="study/isbe/search.html?string=GEBAL">GEBAL</a> (which see). According to the present text of <a onClick="return mV(\'Jos\',13,5);">Jos 13:5</a>, "the land of the Gebalites" was given to Israel as part of its future territory. But it was never occupied by the Israelites. Septuagint, however, has a very different reading, indicating an early corruption of the text. Perhaps with many modern scholars it is better to read "to the borders of the Gebalites."<P>In <a onClick="return mV(\'1Ki\',5,18);">1Ki 5:18</a> the King James Version translates this word "stone-squarers," the King James Version margin gives "Giblites," and the Revised Version (British and American) "Gebalites," as workmen who, with the men of Solomon and of Hiram, fashioned the stones for the temple. Here also the text is doubtful, and some by a slight change would read: "and made a border for them" (i.e. for the stones). In <a onClick="return mV(\'Eze\',27,9);">Eze 27:9</a> the men of Gebal are described as the "calkers" of the ships of Tyre and Sidon.``76';
isbe[3707]='Geber`ge\'-ber (gebher, "man," "strong one"):<P>(1) According to <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a> the King James Version the father of one of the 12 officers who provided food for Solomon and his household (but here the Revised Version (British and American) "Ben-geber"). His district lay to the northeast of Jordan.<P>(2) Another, and the last in the list of Solomon\'s commissariat officers (<a onClick="return mV(\'1Ki\',4,19);">1Ki 4:19</a>). His district was also east of the Jordan, but probably to the south of that named in connection with the official of <a onClick="return mV(\'1Ki\',4,13);">4:13</A> (the Revised Version (British and American) "Ben-geber"). According to the rendering of English Versions of the Bible, he is said to have been "the only officer that was in the land." Unless the text, which presents some difficulties, is corrupt, as some suppose, it probably means that this large region was assigned to one official because less able than the others to furnish the required supplies.``44';
isbe[3708]='Gebim`ge\'-bim (gebhim, "trenches"): A place named only in <a onClick="return mV(\'Isa\',10,31);">Isa 10:31</a>. Some would place it at Jebia, identifying it with the Geba of Eusebius, 5 Roman miles from Gophna (modern Jifneh), on the way to Shechem. Its place, however, in the order of names, after Anathoth, seems to point to some position south of that village, to the northeast of Jerusalem.``1';
isbe[3709]='Gecko`gek\'-o (the Revised Version (British and American) for \'anaqah, only in <a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>; Septuagint mugale, "shrew mouse" or "field mouse"; the King James Version ferret): Probably a shrew or a field mouse.`<a href="./study/isbe/search.html?string=FERRET">FERRET</a>; <a href="./study/isbe/search.html?string=LIZARD">LIZARD</a>; <a href="./study/isbe/search.html?string=SPIDER">SPIDER</a>`1';
isbe[3710]='Gedaliah`ged-a-li\'-a (gedhalyah; except in <a onClick="return mV(\'1Ch\',25,3,);">1Ch 25:3, 9</a> and <a onClick="return mV(\'Jer\',38,1);">Jer 38:1</a>, where it is gedhalyahu, "Yah(u) is great"):<P>(1) Gedaliah, the son of Ahikam (the friend and protector of Jeremiah) and grandson of Shaphan (the scribe in the reign of Josiah) (<a onClick="return mV(\'2Ki\',25,\'22-25\');">2Ki 25:22-25</a>; <a onClick="return mV(\'Jer\',39,14);">Jer 39:14</a>; <a onClick="return mV(\'Jer\',40,\'5-16\');">40:5-16</a>; <a onClick="return mV(\'Jer\',41,\'1-18\');">41:1-18</a>).<P>1. His Appointment as Governor in Judah:<P>After the destruction of Jerusalem and the carrying away captive of the Jews to Babylon (586 BC), Gedaliah was appointed by Nebuchadnezzar governor over the poor Jews who had been left in the land to be vinedressers and husbandmen (<a onClick="return mV(\'2Ki\',25,12,22);">2Ki 25:12, 22</a>). To his charge were committed also some royal princesses (<a onClick="return mV(\'Jer\',43,6);">Jer 43:6</a>) and courtiers (<a onClick="return mV(\'Jer\',41,16);">Jer 41:16</a>) who had been allowed to remain as unlikely to cause any trouble. Gedaliah fixed his residence at Mizpah, a few miles northwest of Jerusalem. Here he was joined by Jeremiah (<a onClick="return mV(\'Jer\',40,6);">40:6</a>).<P>2. His Conciliatory Spirit and Wise Rule:<P>The Jewish soldiers who had escaped capture, having heard that the Chaldeans had departed, and that Gedaliah, one of their own nation, had been appointed governor in Judah, came with Ishmael, Johanan and other officers at their head, to Gedaliah at Mizpah (<a onClick="return mV(\'2Ki\',25,23,24);">2Ki 25:23-24</a>; <a onClick="return mV(\'Jer\',40,\'7-10\');">Jer 40:7-10</a>). The governor assured them that they need have no fear of vengeance from their conquerors, and promised them on oath protection and security, if they would remain and cultivate the land and become the peaceful subjects of the king of Babylon. This assurance led to a general gathering around Gedaliah of refugees from all the neighboring countries (<a onClick="return mV(\'Jer\',40,11,12);">Jer 40:11-12</a>). For two months (some think longer) Gedaliah\'s beneficent and wise rule did much to consolidate affairs in Judah and to inspire the feeble remnant of his countrymen with heart and hope.<P>3. His Treacherous Assassination:<P>But evil spirits were at work against him. Baalis, king of Ammon, had determined upon his life (<a onClick="return mV(\'Jer\',40,\'13-16\');">Jer 40:13-16</a>). The peaceful and popular rule which was being established by the good governor stood in the way of the accomplishment of any plan of conquest he entertained. Baalis found a ready instrument for his murderous design in Ishmael who, as one of royal birth and in the counsels of the king (<a onClick="return mV(\'Jer\',41,1);">Jer 41:1</a>), was doubtless jealous of the man who had been chosen governor in preference to himself. Gedaliah was informed by Johanan and the other captains of the plot to assassinate him, and Johanan at a private interview expressed to him a strong desire to go himself and slay Ishmael secretly, declaring that the safety of the Jews depended upon the life of the governor. But Gedaliah refused to allow Johanan to anticipate his enemy, believing, in the generosity of his heart, that Ishmael was not capable of such an act of treachery. He soon found, however, that his confidence had been sadly misplaced. Ishmael, with ten of his companions, came on a visit to him to Mizpah, and after they had been hospitably entertained they fell upon their good host and murdered him, along with all the Jewish and the Chaldean soldiers whom he had with him for order and protection (<a onClick="return mV(\'2Ki\',25,25);">2Ki 25:25</a>; <a onClick="return mV(\'Jer\',41,\'1-3\');">Jer 41:1-3</a>). They then cast the bodies of their victims into the cistern which Asa had made (<a onClick="return mV(\'Jer\',41,9);">Jer 41:9</a>). Ishmael was pursued and overtaken by Johanan, but he succeeded in effecting his escape to the Ammonites (<a onClick="return mV(\'Jer\',41,\'11-15\');">Jer 41:11-15</a>). Then Johanan and the other captains, afraid lest the Chaldeans should avenge upon them the murder of the governor (<a onClick="return mV(\'Jer\',41,\'16-18\');">Jer 41:16-18</a>), and against the earnest entreaties of Jeremiah (chapter <a onClick="return mV(\'Jer\',42,\'1-\');">42</a>), fled to Egypt, taking the prophet and the Jewish remnant with them (<a onClick="return mV(\'Jer\',43,5,6,7);">43:5-7</a>). In memory of the date of Gedaliah\'s assassination the Jews kept a fast (which is still retained in the Jewish calendar) on the 3rd day of the 7th month, Tishri (<a onClick="return mV(\'Zec\',7,5);">Zec 7:5</a>; <a onClick="return mV(\'Zec\',8,19);">8:19</a>).<P>4. His Noble Character:<P>The narratives reveal Gedaliah in a very attractive light, as one who possessed the confidence alike of his own people and their conquerors; a man of rare wisdom and tact, and of upright, transparent character, whose kindly nature and generous disposition would not allow him to think evil of a brother; a man altogether worthy of the esteem in which he was held by succeeding generations of his fellow-countrymen.<P>(2) (gedhalyahu): Son of Jeduthun, and instrumental leader of the 2nd of the 24 choirs in the Levitical orchestra (<a onClick="return mV(\'1Ch\',25,3,9);">1Ch 25:3, 9</a>).<P>(3) A priest of the "sons of Jeshua," in the time of Ezra, who had married a foreign woman (<a onClick="return mV(\'Ezr\',10,18);">Ezr 10:18</a>).<P>(4) (gedhalyahu): Son of Pashhur (who beat Jeremiah and put him in the stocks, <a onClick="return mV(\'Jer\',20,\'1-6\');">Jer 20:1-6</a>), and one of the chiefs of Jerusalem who, with the sanction of the king, Zedekiah, took Jeremiah and let him down with cords into a cistern where he sank in the mud (<a onClick="return mV(\'Jer\',38,1,4,5,6);">38:1,4-6</A>).<P>(5) Grandfather of Zephaniah the prophet, and grandson of Hezekiah, probably the king (<a onClick="return mV(\'Zep\',1,1);">Ze 1:1</a>).``32';
isbe[3711]='Geddur`ged\'-ur (Geddour): Head of a family of temple-servants (1Esdras 5:30), corresponding to Gahar of <a onClick="return mV(\'Ezr\',2,47);">Ezr 2:47</a> and <a onClick="return mV(\'Neh\',7,49);">Ne 7:49</a>.``1';
isbe[3712]='Gedeon`ged\'-e-on (<a onClick="return mV(\'Hbr\',11,32);">Heb 11:32</a> the King James Version).`<a href="./study/isbe/search.html?string=GIDEON">GIDEON</a>`1';
isbe[3713]='Geder`ge\'-der (gedher): A royal city of the Canaanites taken by Joshua along with Lachish, Eglon, Gezer, Debir and Hormah (<a onClick="return mV(\'Jos\',12,13);">Jos 12:13</a>f). It may be the city called "Beth-gader" in <a onClick="return mV(\'1Ch\',2,51);">1Ch 2:51</a>, and the birthplace of Baal-hanan, who had charge of David\'s olives and sycamores (<a onClick="return mV(\'1Ch\',27,28);">27:28</a>); unidentified.``1';
isbe[3714]='Gederah; Gederathite`ge-de\'-ra, ge-de\'-ra-thit (ha-gedherah, "the enclosed place"): A town in the Shephelah of Judah, named with Socoh, Azekah, Shaaraim and Adithaim (<a onClick="return mV(\'Jos\',15,36);">Jos 15:36</a>). In <a onClick="return mV(\'1Ch\',4,23);">1Ch 4:23</a> the Revised Version (British and American) reads, "the inhabitants of Netaim and Gederah," for the King James Version, "those that dwelt among plants and hedges." It is probably represented by Khirbet Jadireh, about 3 miles southwest of Gezer. "Gederathite," applied to Jozabad (<a onClick="return mV(\'1Ch\',12,4);">1Ch 12:4</a>), probably meant an inhabitant of this place.``1';
isbe[3715]='Gederite`ge\'-der-it, ge-de\'-rit (gedheri): Inhabitant of <a href="study/isbe/search.html?string=GEDER">GEDER</a>, which see (<a onClick="return mV(\'1Ch\',27,28);">1Ch 27:28</a>).``1';
isbe[3716]='Gederoth`ged\'-e-roth, ge-de\'-roth (gedheroth): A town in the Shephelah of Judah, named with Kithlish, Beth-dagon, Naamah and Makkedah (<a onClick="return mV(\'Jos\',15,41);">Jos 15:41</a>). It is mentioned along with Bethshemesh and Aijalon as taken by the Philistines in the reign of Ahaz (<a onClick="return mV(\'2Ch\',28,18);">2Ch 28:18</a>). It possibly corresponds with the "Kidron" of 1Macc 15:39,41; 16:9. Eusebius, Onomasticon places a very large village named Gedrom 10 Roman miles from Lydda on the road to Eleutheropolis. This points to Katrah, southeast of Yebnah.``1';
isbe[3717]='Gederothaim`ged-e-ro-tha\'-im (gedherathayim, "place of enclosures"): Stands as the 15th in a list which professes to give only the names of 14 cities in the Judean Shephelah (<a onClick="return mV(\'Jos\',15,36);">Jos 15:36</a>). the King James Version margin suggests that we might read "or" for "and" after Gederah, but this is impossible. Septuagint reads, "and its cattle shelters." Probably, however, the name has arisen by dittography from the preceding <a href="study/isbe/search.html?string=GEDERAH">GEDERAH</A> (which see).``1';
isbe[3718]='Gedor`ge\'-dor (gedhor; Codex Vaticanus, Geddor, Codex Alexandrinus, Gedor):<P>(1) A town in the mountains of Judah, named with Halhul and Beth-zur (<a onClick="return mV(\'Jos\',15,58);">Jos 15:58</a>). It seems to be referred to by Eusebius as Gadeira (Onomasticon, under the word), which he identifies with Gaidora (Jerome calls it Gadora), a village in the borders of Jerusalem, near the terebinth. It is probably represented today by Khirbet Jedur, about 7 miles north of Hebron (PEF, III, 313, Sh XXI).<P>(2) Among the Benjamites who joined David at Ziklag were the sons of Jeroham of Gedor (<a onClick="return mV(\'1Ch\',12,7);">1Ch 12:7</a>). No trace of this name is found in the territory of Benjamin. It may be identical with (1).<P>(3) The Simeonites are said to have gone to the entering in of Gedor in search of pasture for their flocks. They smote and expelled the Meunim, "and dwelt in their stead" (<a onClick="return mV(\'1Ch\',4,39);">1Ch 4:39</a>). Here the Septuagint reads Gerar, and this is probably correct.<P>(4) A family in Judah (<a onClick="return mV(\'1Ch\',4,4);">1Ch 4:4</a>).<P>(5) An ancestor of Saul (<a onClick="return mV(\'1Ch\',8,31);">1Ch 8:31</a>).``54';
isbe[3719]='Gehazi`ge-ha\'-zi (gechazi, except in <a onClick="return mV(\'2Ki\',4,31);">2Ki 4:31</a>; <a onClick="return mV(\'2Ki\',5,25);">5:25</a>; <a onClick="return mV(\'2Ki\',8,4,5);">8:4-5</a>, where it is gechazi, perhaps "valley of vision"): The confidential servant of Elisha. Various words are used to denote his relation to his master. He is generally called Elisha\'s "boy" (na\'ar), servant or personal attendant; he calls himself (<a onClick="return mV(\'1Ki\',5,25);">5:25</a>) his master\'s servant or slave (\'ebhedh), and if the reference be to him in <a onClick="return mV(\'1Ki\',4,43);">4:43</A> the Revised Version, margin, he receives the designation "minister" (meshareth), or chief servant of Elisha.<P>1. His Ready Service:<P>Mention is made of him on three different occasions. He is first brought under notice in the story of the wealthy Shunammite (<a onClick="return mV(\'2Ki\',4,\'8-37\');">2Ki 4:8-37</a>) who provided in her house special accommodation for Elisha, which suited his simple tastes, and of which he availed himself as often as he passed that way. By command of his master, Gehazi called the Shunammite, that she might be rewarded by the prophet for her liberal hospitality. Failing to elicit from the lady a desire for any particular favor, and being himself at a loss to know how to repay her kindness, Elisha consulted with his servant, whose quick perception enabled him to indicate to his master the gift that would satisfy the great woman\'s heart. When on the death of her child the Shunammite sought out the man of God at Carmel, and in the intensity of her grief laid hold of the prophet\'s feet, "Gehazi came near to thrust her away" (<a onClick="return mV(\'2Ki\',4,27);">2Ki 4:27</a>)—perhaps not so much from want of sympathy with the woman as from a desire to protect his master from what he considered a rude importunity. Then Elisha, who had discovered of himself (<a onClick="return mV(\'2Ki\',4,27);">2Ki 4:27</a>), from what the woman had said (<a onClick="return mV(\'2Ki\',4,28);">2Ki 4:28</a>), the cause of her sorrow, directed Gehazi, as a preliminary measure, to go at once to Shunem and lay his staff upon the face of the dead child. Gehazi did so, but the child was "not awaked."<P>In this narrative Gehazi appears in a favorable light, as a willing, efficient servant, jealous of his master\'s honor; a man of quick observation, whose advice was worth asking in practical affairs.<P>2. His Grievous Sin:<P>Gehazi, however, reveals himself in a different character in connection with the healing of Naaman (<a onClick="return mV(\'2Ki\',5,\'20-27\');">2Ki 5:20-27</a>). As soon as the Syrian general had taken his departure with his retinue from the house of Elisha, the covetous spirit of Gehazi, which had been awakened by the sight of the costly presents the prophet had refused, was no longer able to restrain itself. Running after Naaman, Gehazi begged in the prophet\'s name a talent of silver (400 pounds = $2,000) and two changes of raiment, alleging, as a specious reason for Elisha\'s change of mind, the arrival at his master\'s house of two poor scholars of the prophet, who would require help and maintenance. Naaman, glad to have the opportunity he desired of showing his gratitude to Elisha, urged Gehazi to take two talents and sent two servants with him to carry the money and the garments. When they came to the hill in the neighborhood of the prophet\'s house, Gehazi dismissed the men and concealed the treasure. Thereafter, with a bold front, as if he had been attending to his ordinary duties, he appeared before his master who at once inquired, "Whence, Gehazi?" (Hebrew). On receiving the ready answer that he had not been anywhere, Elisha, who felt sure that the suspicion he entertained regarding his beloved servant, his very "heart" (<a onClick="return mV(\'2Ki\',5,26);">2Ki 5:26</a>), was well grounded, sternly rebuked him for the dishonor he had brought upon God\'s cause, and called down upon him and his family forever the loathsome disease of the man whose treasures he had obtained by his shameful lie. "And he went out from his presence a leper as white as snow."<P>By this narrative confidence in Gehazi is somewhat unexpectedly and rudely shaken. The active, zealous servant stands confessed a liar and a thief. Gehazi\'s sin branched out in different directions. By his falsehood he deceived Naaman and misrepresented Elisha; he not only told a lie, but told a lie about another man, and that man his master and friend. Further, he brought true religion into disrepute; for it was not a time (<a onClick="return mV(\'2Ki\',5,26);">2Ki 5:26</a>) for a servant of God to allow any commercial idea to be associated with the prophet\'s work in the mind of the Syrian general to whom God\'s power had been so strikingly manifested and when many for worldly gain pretended to be prophets. But while Gehazi\'s sin had ats various ramifications, its one root was covetousness, "the love of money (which) is a root of all kinds of evil" (<a onClick="return mV(\'1Ti\',6,10);">1Ti 6:10</a>).<P>3. His Probable Repentance:<P>Once more Gehazi is mentioned (<a onClick="return mV(\'2Ki\',8,\'1-6\');">2Ki 8:1-6</a>) as having been summoned, leper though he was, by King Jehoram to give him an account of all the great things Elisha had done. And when he came to the story of the restoration of the Shunammite\'s child to life, the woman herself appeared before the king along with her son, craving to be reinstated in her house and land of which she had been dispossessed during her seven years\' absence from her native country in a time of famine. Gehazi testified to the identity of both mother and son, with the result that the king at once ordered the restoration not only of all her former possessions, but also of all the profits her land had yielded during her sojourn in Philistia.<P>The appearance and conduct of Gehazi on this occasion give some ground for the hope that he had repented of his sin and could now be trusted to speak the truth; and the pleasure he seemed to take in rehearsing the wonderful deeds of a master who, though kind and indulgent to a stranger, was hard upon him, may even warrant the belief that in his earlier days there was some good thing in him toward his master\'s God. If also, as has been indicated above, the word used in <a onClick="return mV(\'2Ki\',4,43);">2Ki 4:43</a> (meshareth) applies to him—the same as is applied to Elisha (<a onClick="return mV(\'1Ki\',19,21);">1Ki 19:21</a>)—we may be the more readily inclined to see in the history of Gehazi how one besetting sin may prevent a man from taking his natural place in the succession of God\'s prophets. Let us hope, however, that though Gehazi became a "lost leader," "just for a handful of silver," he was yet saved by a true repentance from becoming a lost soul.``32';
isbe[3720]='Gehenna`ga-hen\'-a (geenna (see Grimm-Thayer, under the word)): Gehenna is a transliteration from the Aramaic form of the Hebrew ge-hinnom, "valley of Hinnom." This latter form, however, is rare in the Old Testament, the prevailing name being "the valley of the son of Hinnom." Septuagint usually translates; where it transliterates the form is different from Gehenna and varies. In the New Testament the correct form is Gee\'nna with the accent on the penult, not Ge\'enna. There is no reason to assume that Hinnom is other than a plain patronymic, although it has been proposed to find in it the corruption of the name of an idol (EB, II, 2071). In the New Testament (King James Version margin) Gehenna occurs in <a onClick="return mV(\'Mat\',5,22,29,30);">Mt 5:22, 29-30</a>; <a onClick="return mV(\'Mat\',10,28);">10:28</a>; <a onClick="return mV(\'Mat\',18,9);">18:9</a>; <a onClick="return mV(\'Mat\',23,15,33);">23:15, 33</a>; <a onClick="return mV(\'Mar\',9,43,45,47);">Mr 9:43, 45, 47</a>; <a onClick="return mV(\'Luk\',12,5);">Lu 12:5</a>; <a onClick="return mV(\'Jam\',3,6);">Jas 3:6</a>. In all of these it designates the place of eternal punishment of the wicked, generally in connection with the final judgment. It is associated with fire as the source of torment. Both body and soul are cast into it. This is not to be explained on the principle that the New Testament speaks metaphorically of the state after death in terms of the body; it presupposes the resurrection. In the King James Version and the Revised Version (British and American) Gehenna is rendered by "hell" (see <a href="study/isbe/search.html?string=ESCHATOLOGY+OF+THE+NEW+TESTAMENT">ESCHATOLOGY OF THE NEW TESTAMENT</a>). That "the valley of Hinnom" became the technical designation for the place of final punishment was due to two causes. In the first place the valley had been the seat of the idolatrous worship of Molech, to whom children were immolated by fire (<a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>; <a onClick="return mV(\'2Ch\',33,6);">33:6</a>). Secondly, on account of these practices the place was defiled by King Josiah (<a onClick="return mV(\'2Ki\',23,10);">2Ki 23:10</a>), and became in consequence associated in prophecy with the judgment to be visited upon the people (<a onClick="return mV(\'Jer\',7,32);">Jer 7:32</a>). The fact, also, that the city\'s offal was collected there may have helped to render the name synonymous with extreme defilement. Topographically the identification of the valley of Hinnom is still uncertain. It has been in turn identified with the depression on the western and southern side of Jerusalem, with the middle valley, and with the valley to the E. Compare EB, II, 2071; DCG, I, 636; RE3, VI.``182';
isbe[3721]='Geliloth`ge-li\'-loth (geliloth): This word is used for "districts" or "circuits" perhaps indicating the different parts subject to the several lords of the Philistines (<a onClick="return mV(\'Jos\',13,2);">Jos 13:2</a>, the King James Version "borders," the Revised Version (British and American) "regions"); for the quarter of the Jordan valley where the eastern tribes built the altar of Ed (<a onClick="return mV(\'Jos\',22,10);">Jos 22:10</a>f; the King James Version "border of," the Revised Version (British and American) "region about," Jordan); and apparently, for the whole of Philistia (<a onClick="return mV(\'Joe\',3,4);">Joe 3:4</a>, the King James Version "coasts of Palestine," the Revised Version (British and American) "regions of Philistia"). But in <a onClick="return mV(\'Jos\',18,17);">Jos 18:17</a>, it is clearly used as a place-name. Geliloth lay on the boundary between Judah and Benjamin which passed En-shemesh (probably \'Ain el-Chod, about 2 miles east of Jerusalem), "and went out to Geliloth, which is over against the ascent of Adummim." From this point it "went down" toward the plain. The place cannot therefore be identified with Gilgal in the Jordan valley. Some point on the road leading from Jericho to Tal\'at ed-Dumm, about 6 miles from Jerusalem, was probably intended, but no identification is possible.``54';
isbe[3722]='Gem`jem (<a onClick="return mV(\'Pro\',26,8);">Pr 26:8</a>, the English Revised Version "a bag of gems,").`<a href="./study/isbe/search.html?string=STONES+PRECIOUS">STONES, PRECIOUS</a>`1';
isbe[3723]='Gemalli`ge-mal\'-i (gemalli, "camel owner"): Father of the spy Ammiel from the tribe of Dan (<a onClick="return mV(\'Num\',13,12);">Nu 13:12</a>), who was one of those sent by Moses to spy out the land of Canaan.``1';

isbe[3725]='Gemariah`gem-a-ri\'-a (gemaryahu, gemaryah, "Yahweh hath accomplished"):<P>(1) Son of Shaphan the scribe, one of the princes, from whose chamber Baruch read Jeremiah\'s prophecies to the people. He, with others, sought to stay Jehoiakim from burning the roll (<a onClick="return mV(\'Jer\',36,10,11,12,25);">Jer 36:10-11, 12, 25</a>).<P>(2) Son of Hilkiah, one of Zedekiah\'s ambassadors to Babylon, by whom Jeremiah sent his letter to the captives (<a onClick="return mV(\'Jer\',29,3);">Jer 29:3</a>).``1';
isbe[3726]='Gematria`ge-ma\'-tri-a.`<a href="./study/isbe/search.html?string=NUMBERS">NUMBERS</a>; <a href="./study/isbe/search.html?string=GAMES">GAMES</a>`1';
isbe[3727]='Gender`jen\'-der (yaladh, \'abhar; gennao): "Gender" is an abbreviation of "engender." In <a onClick="return mV(\'Job\',38,29);">Job 38:29</a> yaladh (common for "to bear," "to bring forth") is translated "gender" (after Wycliff), the Revised Version (British and American) "The hoary frost of heaven, who hath gendered it?" margin "given it birth." In <a onClick="return mV(\'Job\',21,10);">21:10</a> we have \'abhar (either the Piel of \'abhar, "to pass over," etc., or of a separate word meaning "to bear," "to be fruitful"), translated "gendereth," "Their bull gendereth, and faileth not"; in <a onClick="return mV(\'Lev\',19,19);">Le 19:19</a>, rabha\', "to lie down with," is used of cattle gendering. In <a onClick="return mV(\'Gal\',4,24);">Ga 4:24</a> the King James Version we have "Mount Sinai, which gendereth (gennoa, "to beget") to bondage," the Revised Version (British and American) "bearing children unto bondage" (like Hagar, Abraham\'s bondwoman), and in <a onClick="return mV(\'2Ti\',2,23);">2Ti 2:23</a>, which "gender strifes," i.e. beget them.``185';
isbe[3728]='Genealogy of Jesus Christ, The`<p><b>I. INTRODUCTION</b><P class="in15">1. The Problems Involved<P class="in15">2. Nature and Importance of the Issue<P><b>II. THE GENEALOGIES SEPARATELY</b><P class="in15">1. Peculiarities of Matthew\'s Genealogy<P class="in15">2. Explanation of the Foregoing<P class="in15">3. Peculiarities of Luke\'s Genealogy<P class="in15">4. Explanation of the Foregoing<P><b>III. THE GENEALOGIES COMPARED</b><P class="in15">1. Divergences<P class="in15">2. Correspondence<P><b>IV. THE GENEALOGIES AND THE VIRGIN BIRTH</b><P class="in15">1. Text of <a onClick="return mV(\'Mat\',1,16);">Matthew 1:16</a><P class="in15">2. General Conclusions<P><b>LITERATURE</b><hr /><P>I. Introduction.<P>1. The Problems Involved:<P>The genealogy of Jesus as contained in the First and Third Gospels presents three special problems which lie somewhat part from general questions of New Testament criticism:<P>(1) the construction and purpose of each list taken separately;<P>(2) the relation of the two lists, in their coincidences and variations, to each other;<P>(3) the relationship of both lists to the statement concerning the virgin birth of our Lord with which they are directly connected. These questions necessarily involve the conclusion to be arrived at concerning the trustworthiness of the list of names as forming an actual historical connection between Jesus and His ancestors according to the flesh.<P>2. Nature and Importance of the Issue:<P>Before these problems are dealt with, it would be well to consider the kind and degree of importance to be attached to the question at issue. As we see it, the only vital point at stake is the balance, sanity and good judgment of the evangelists.<P>(1) That Jesus had a line of ancestors by His human birth may be taken for granted. The tradition, universal from the earliest times among believers and granted even by the bitterest opponents, that He was connected with the line of David, may also readily be accepted. The exact line through which that connection is traced is, on general principles, of secondary importance. The fact is that, while natural sonship to David on the part of the Messiah was of vital importance to many Jewish inquirers, it failed of any very enthusiastic endorsement on the part of Jesus Himself (see the truly remarkable interview recorded in <a onClick="return mV(\'Mar\',12,\'35-37\');">Mr 12:35-37</a>). The expressions of Paul in this connection will be referred to later; at this point it is sufficient to say that physical kinship to David cannot be insisted upon as the only justification for his words.<P>(2) If, then, the purpose of the evangelists in having recourse to these lists is worth while, the question of their correctness need not even be raised. Unless some vital issue is involved, the supposition of a special inspiration to go behind lists currently accepted is gratuitous. No such issue seems to be presented here. The Davidic kinship of Jesus, in any sense essential to His Messiahship, is independent of the lists which are used to justify it. This is preliminary to the actual discussion and need not prevent us from giving all due credit to lists which could not have been carelessly compiled nor lightly used.<P>II. The Genealogies Separately.<P>1. Peculiarities of Matthew\'s Genealogy:<P>(1) The construction and incorporation of Joseph\'s genealogical tree is, in the light of all the facts, the primary consideration.<P>(2) The artificial division into three groups of fourteen generations each. The apparent defect in this arrangement as it actually stands (the third group lacks one member) is probably traceable to a defect of the Septuagint version of <a onClick="return mV(\'1Ch\',3,11);">1Ch 3:11</a>, which is reproduced in the Greek gospel (see Zahn, Introduction to the New Testament, English translation, 564, note 4). This arrangement into groups is the more striking because it makes 14 generations from the captivity to Joseph, where Luke makes 20 or 21, and because the first group of 14 is formed by the omission of three names. It is perfectly clear, therefore, that this artificial grouping is essential to the purpose of the evangelist.<P>(3) The insertion of the names of brothers, thus following the historical lists and broadening the genealogy by including collateral lines.<P>(4) The insertion of the names of women—a practice not only foreign but abhorrent to ordinary usage. This peculiarity is the more marked when we notice that these names introduce what would be considered serious blots in the family history of the Davidic house (see <a onClick="return mV(\'Mat\',1,5,7);">Mt 1:5, 7</a>).<P>(5) The principle upon which the division into periods is constructed:<P>(a) from Abraham to David,<P>(b) from David to the Captivity,<P>(c) from the Captivity to Jesus. Attention has repeatedly been called to the fact that this gives a definite historical movement to the genealogy. It involves the origin, the rise to power, the decay and downfall of the house of David (see Allen, ICC, "Matthew," 2; compare Zahn, N T, English translation, I, 535).<P>2. Explanation of the Foregoing:<P>Of the many theories which have been constructed to explain the foregoing six peculiarities of the genealogy of Matthew, altogether the most satisfactory is that of Professor Zahn. His contention is that the list was framed not to prove the natural connection of Jesus with the house of David—a fact which no one doubted—but to defend the one vital point where attack had been made, namely, the legitimacy of Jesus\' connection with David. No one seems to have questioned that Jesus was born of Mary and was closely connected with the royal house. The question was whether He was of legitimate birth. It was charged—and the slander which was very early in origin and circumstantial in character obtained an extraordinary hold upon the hostile Jewish mind—that Jesus was the illegitimate offspring of Mary. The Gospel of Matthew meets that slander by giving a bird\'s-eye view of the movement of the history from Abraham to the Messiah in the form of a genealogy of Joseph, who in the light of all the facts concerning the origin of Jesus marries Mary and gives her the protection of his stainless name and royal lineage. The extraordinary boldness and brilliancy of this apologetic method ought not to be overlooked. The formal charge that Jesus is son of Mary, not of Joseph, is admitted—the slander involved is refuted by bringing Joseph forward as a witness for Mary. Nothing could have been more natural for a man fearless in the confidence of truth; nothing could have been more impossible for one insecure in his hold upon the facts. So far as the genealogy is concerned, just the moment we realize that the purpose is not to prove the natural sonship of Jesus to David, but to epitomize the history, all hesitancy and apprehension concerning the historicity of the successive names disappear. The continuity of blood relationship through these successive generations becomes of no essential importance. Zahn\'s explanation (the argument in full should be read by every student), simple in itself, explains all the facts, as a key fits a complicated lock. It explains the choice of a genealogy as a method of epitomizing history and that genealogy Joseph\'s, the artificial grouping at the expense of changing the traditional lists, the inclusion of the names of brothers and of women.<P>3. Peculiarities of Luke\'s Genealogy:<P>(1) The choice of Joseph\'s genealogical tree on the part of one who is so deeply interested in Mary.<P>(2) The reversal of order in going back from Joseph to his ancestors. Godet emphasizes the fact that, in the nature of the case, a genealogy follows the order of succession, each new individual being added to the roll of his family. Luke\'s method indicates that his genealogy has been constructed for a special purpose.<P>(3) The carrying of the line back of the history of the covenant, which begins with Abraham, to Adam, who represents the race in general. This fact, together with another, that the line of Joseph is traced to David through Nathan who was not David\'s heir, proves that Luke was not concerned with establishing the Davidic standing of Jesus.<P>(4) The placing of the genealogy, not at the beginning of the Gospel, but at the beginning of the ministry, between the baptism and the temptation.<P>(5) The omission of the article before the name of Joseph.<P>4. Explanation of the Foregoing:<P>(1) In his comment upon the fourth peculiarity enumerated above, namely, the placing of the genealogy at the beginning of the ministry, Godet (Gospel of Luke, American edition, 126) has this to say: "In crossing the threshold of this new era, the sacred historian casts a general glance over the period which thus reaches its close, and sums it up in this document, which might be called the mortuary register of the earlier humanity." In other words, in connecting the genealogy directly with the ministry, Luke exhibits the fact that his interest in it is historical rather than antiquarian or, so to say, genealogical. As Matthew summarizes the history of the covenant people from the days of Abraham by means of the genealogical register, modified so as to make it graphic by its uniformity, so Luke has written the story of the humanity Jesus, as the Second Adam, came to save, by the register of names summarizing its entire course in the world.<P>It has recently been commented upon that genealogical lists such as those of Genesis and the New Testament are not infrequently used to convey ideas not strictly germane to the matter of descent or the cognate notion of chronology. For example, the statements as to the longevity of the patriarchs are of historical interest only—they are not and could never have been of value for chronological purposes (see Warfield, "Antiquity and Unity of Human Race," Princeton Review, February, 1911).<P>(2) In commenting upon the order which Luke adopts, Godet (who has thrown more light upon this portion of the Gospel than anyone else) says: "The ascending form of genealogy can only be that of a private instrument, drawn up from the public document with a view to the particular individual whose name serves as the starting-point of the whole list" (127).<P>(3) From the fact that the name of Joseph is introduced without an article Godet draws three conclusions:<P>(a) that this name belongs rather to the sentence introduced by Luke;<P>(b) that the genealogical document which he consulted began with the name of Heli;<P>(c) and consequently, that this piece was not originally the genealogy of Jesus or of Joseph, but of Heli (ibid., 128).<P>(4)<P>(a) The importance of these considerations is twofold. In the first place it indicates that Luke is bringing together two separate documents, one of which contained a statement of the foster-fatherhood of Joseph, while the other contained the genealogy of Heli, between whom and Joseph there existed a relationship which made Luke desirous of connecting them.<P>(b) In addition, the absence of the article serves to call attention to something exceptional in the relationship of Joseph to the rest of this ancestral line which is brought into connection with his name. To this point we shall recur later. We have an explanation for all the suggested problems except one, and that one, in a sense, the most difficult of all, namely, the choice of Joseph\'s genealogy.<P>III. The Genealogies Compared.<P>1. Divergences:<P>In order, however, to discuss this question intelligently, we must enter upon the second stage of our inquiry—as to the relationship between the two lists.<P>(1) The most notable fact here is of course the wideness of the divergence together with the contrasted and unintelligible fact of minute correspondence. Between Abraham and David the two lists agree. Between David and Joseph there is evident correspondence in two (see <a onClick="return mV(\'Mat\',1,12);">Mt 1:12</a>; <a onClick="return mV(\'Luk\',3,27);">Lu 3:27</a>), and possible correspondence in four names (that is, if Abiud (<a onClick="return mV(\'Mat\',1,13);">Mt 1:13</a>)) and Judah (<a onClick="return mV(\'Luk\',3,30);">Lu 3:30</a>) are the same). This initial and greatest difficulty is of material assistance to us because it makes one conclusion certain beyond peradventure. The two lists are not divergent attempts to perform the same task. Whatever difficulties may remain, this difficulty is eliminated at the outset. It is impossible that among a people given to genealogies two lists purporting to give the ancestry of a man in the same line could diverge so widely. There is, therefore, a difference between these lists which includes the purpose for which they were compiled and the meaning which they were intended to convey.<P>2. Correspondence:<P>(2) Two of the most striking points in the lists as they stand may be brought into connection and made to explain each other. The two lists coincide in the names of Zerubbabel and Shealtiel—they differ as to the name of Joseph\'s father, who is Jacob according to Matthew and Heli according to Luke. As to the second of these two important items this much is clear. Either these two lists are in violent contradiction, or else Joseph was in some sense son of both Jacob and Heli. Now, in connection with this seeming impossibility, turn to the other item. The names of Shealtiel and Zerubbabel belong to the captivity. Their being common to both lists is easily explained by the fact that during that troubled period a number of collateral family branches might be narrowed down to one or two common representatives (see Zahn, op. cit., 535). In the New Testament genealogies Zerubbabel is the son of Shealtiel—according to <a onClick="return mV(\'1Ch\',3,19);">1Ch 3:19</a> he is the nephew of Shealtiel and the son of Pedaiah. He is, therefore, at one and the same time heir and, legally, son of two men and would appear as such on two collateral lists.<P>Shealtiel himself appears in Matthew (<a onClick="return mV(\'Mat\',1,12);">1:12</a>) as the son of Jechoniah and in Luke (<a onClick="return mV(\'Luk\',3,27);">3:27</a>) as the son of Neri. In <a onClick="return mV(\'1Ch\',3,17);">1Ch 3:17</a> he appears as son of Jechoniah. The name of Neri is peculiar to Luke, so that we cannot check his use of it and discover the actual parentage of Shealtiel. His appearance in two lists with a double reference of parentage is not surprising in view of what we have already seen. Besides this, a reasonable explanation at once appears. In <a onClick="return mV(\'Jer\',36,30);">Jer 36:30</a> it is asserted that Jehoiakim should have "none to sit upon the throne of David," and of his son (Jehoiachin, Jechoniah, Coniah) it is said (<a onClick="return mV(\'Jer\',22,30);">Jer 22:30</a>), "Write ye this man childless," etc. It has been rightly pointed out (see HDB, II 557) that this means simply legal proscription, not actual childlessness. It suggests, however, that it might be thought necessary to provide in the genealogy an heir not of their blood for the two disgraced and proscribed members of the royal house, In view of these facts the contradictory references as to Joseph\'s parentage present no difficulty.<P>Joseph may easily have been and undoubtedly was, legally, son and heir of both Jacob and Heli. Godet\'s objection to this is based upon the supposition that Heli and Jacob were brothers, which leaves the divergence beyond these two names unexplained. It is evident, however, that the kinship between Jacob and Heli might have been more distant than this supposition calls for.<P>(3) When we come to explain how it happened that Joseph was connected with both these lines and that Matthew chose one list and Luke the other we are necessarily shut up to conjecture. There is one supposition, however, which is worthy of very careful consideration because it solves so many and such difficult problems. The authorities have been divided as to whether Luke\'s genealogy is Joseph\'s, as appears, or Mary\'s. Godet makes a strong showing for the latter, and, after all has been said per contra, some of his representations remain unshaken (compare Godet and Plummer sub loc.). Most of the difficulties are removed at one stroke, and the known facts harmonized, by the simple supposition that Luke has given us the meeting-point of the lineage both of Joseph and Mary who are akin. This explains the apparent choice of Joseph\'s list; the peculiar position of his name in that list; the reversal of the order; the coincidences and discrepancies with reference to Matthew\'s; the early tradition of Mary\'s Davidic origin; the strange reference in the Talmud (Chaghigha\' 77 4) to Mary as the daughter of Heli; the visit of Mary with Joseph to Bethlehem at the time of the registration; the traditional discrepancy of ages between Joseph and Mary, such that (apparently) Joseph disappears from the scene before Jesus reaches maturity. Against this nothing of real weight can be urged (the kinship with Elisabeth is not such: see Edersheim, LTJM, I, 149) except that it is too simple and too felicitous. Its simplicity and felicitous adjustment to the whole complex situation is precisely its recommendation. And there we may let the matter rest.<P>IV. The Genealogies and the Virgin Birth.<P>We have now to deal with the relationship of the genealogies to the virgin-birth statement which forms the vital center of the infancy narratives and to the general question of the Davidic origin of Jesus.<P>See <a href="study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>.<P>1. Text of <a onClick="return mV(\'Mat\',1,16);">Matthew 1:16</a>:<P>The first part of this question may be most directly approached by a brief consideration of the text of <a onClick="return mV(\'Mat\',1,16);">Mt 1:16</a>. The text upon which the Revised Version (British and American) is based reads: "And Jacob begat Joseph the husband of Mary, of whom was born Jesus, who is called Christ." Beside this there are two readings, one contained in the so-called Ferrar group of manuscripts, and the other in the Sinaitic which, differing among themselves, unite in ascribing the parentage of Jesus to Joseph. This has been seized upon by negative critics (see for list and discussion Machen, Princeton Review, January, 1906, 63; compare Bacon, HDB, article "Genealogy of Jesus Christ," Am. Jour. Theol., January, 1911, who long ago gave in his advocacy to the supposition that the evangelists could easily reconcile the supernatural birth with the actual paternity of Joseph) to support the idea of a primitive Christian tradition that Joseph was the father of Jesus. Of this contention Zahn leaves nothing, and concludes his argument with this statement: "The hope of finding indications in old manuscripts and versions that the authors of lost Gospels or brief writings which may have been worked over in our Matthew and Luke regarded Joseph as the physical father of Jesus, should at last be dismissed. An author who knew how to make even the dry material of a genealogy to its least detail contribute to the purpose of his thought concerning the slandered miracle of the Messiah\'s birth, cannot at the same time have taken over statements from a genealogy of Joseph or Jesus used by him which directly contradicted his conception of this fact. Any text of Matthew which contained such statements would be condemned in advance as one altered against the author\'s interest" (op. cit., 567). It is interesting to note that Allen (ICC, "Matthew," 8), starting from the extreme position that the Sinaitic form of statement, of all extant texts, most nearly represents the original, reaches the same conclusion as Zahn, that Matthew\'s Gospel from the beginning taught the virgin birth.<P>2. General Conclusions:<P>(1) It is clear, therefore, from the general trend as well as from specific statements of both Gospels, that the genealogies and the birth-narratives were not floating traditions which accidentally touched and coalesced in mid-stream, but that they were intended to weld inseparably the two beliefs that Jesus was miraculously conceived and that He was the heir of David. This could be done only on the basis of Joseph\'s genealogy, for whatever the lineage of Mary, Joseph was the head of the family, and the Davidic connection of Jesus could only be established by acknowledgment of Him as legal son by Joseph. Upon this basis rests the common belief of the apostolic age (see Zahn, ibid., 567, note references), and in accordance with it all statements (such as those of Paul, <a onClick="return mV(\'Rom\',1,3);">Ro 1:3</a>; <a onClick="return mV(\'2Ti\',2,8);">2Ti 2:8</a>) must be interpreted.<P>(2) For it must be remembered that, back of the problem of reconciling the virgin birth and the Davidic origin of Jesus, lay the far deeper problem—to harmonize the incarnation and the Davidic origin. This problem had been presented in shadow and intimation by Jesus Himself in the question: "David himself calleth him Lord; and whence is he his Son?" It is further to be noticed that in the annunciation (<a onClick="return mV(\'Luk\',1,32);">Lu 1:32</a>) the promised One is called at once Son of God and Son of David, and that He is the Son of God by virtue of His conception by the Spirit—leaving it evident that He is Son of David by virtue of His birth of Mary. With this should be compared the statement of Paul (<a onClick="return mV(\'Rom\',1,3,4);">Ro 1:3-4</a>): He who was God\'s Son was "born of the seed of David according to the flesh, and declared to be the Son of God with power, according to the spirit of holiness, by the resurrection from the dead." This is at least most suggestive (see Orr, Virgin Birth of Christ, 119, with note, p. 121), for it indicates that as Paul and Luke were in very close sympathy as to the person of our Lord, so they are in equally close sympathy as to the mystery of His origin. The unanimity of conviction on the part of the early church as to the Davidic origin of Jesus is closely paralleled by its equally firm conviction as to His supernatural derivation. The meeting-point of these two beliefs and the resolution of the mystery of their relationship is in the genealogies in which two widely diverging lines of human ancestry, representing the whole process of history, converge at the point where the new creation from heaven is introduced.<P>LITERATURE.<P>The literature on this subject is very copious. The works referred to in the text will serve to introduce the reader to more extensive investigations. The whole situation is well summarized by Plummer (ICC, "Luke," sub loc.).``169';
isbe[3729]='Genealogy, 1-7`je-na-al\'-o-ji, jen-a-al\'-o-ji:<P>1. Definition<P>2. Biblical References<P>3. Importance of Genealogies<P>4. Their Historical Value<P>5. Principles of Interpretation<P>6. Principles of Compilation<P>7. Sources<P>8. Principal Genealogies and Lists<P>LITERATURE<hr /><P>1. Definition:<P>The Old Testament translates (once, <a onClick="return mV(\'Neh\',7,5);">Ne 7:5</a>) the noun yachas; cepher ha-yachas, "book of the genealogy"; also translates a denominate verb in Hithpael, yachas, "sprout" "grow" (compare family "tree"); hithyaches, "genealogy"; the idea is conveyed in other phrases, as cepher toledhoth, "book of the generations," or simply toledhoth, "generations." In the New Testament it transliterates genealogia, "account of descent," <a onClick="return mV(\'1Ti\',1,4);">1Ti 1:4</a>; <a onClick="return mV(\'Tts\',3,9);">Tit 3:9</a>. In <a onClick="return mV(\'Mat\',1,1);">Mt 1:1</a>, biblos geneseos, "book of the generation" of Jesus Christ, is rendered in the American Revised Version, margin "the genealogy of Jesus Christ"; a family register, or register of families, as <a onClick="return mV(\'1Ch\',4,33);">1Ch 4:33</a>, etc.; the tracing backward or forward of the line of ancestry of individual, family, tribe, or nation; pedigree. In Timothy and Titus refers probably to the Gnostic (or similar) lists of successive emanations from Deity in the development of created existence.<P>2. Biblical References:<P>According to the Old Testament, the genealogical interest dates back to the beginnings of sacred history. It appears in the early genealogical tables of <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>; <a onClick="return mV(\'Gen\',10,\'1-\');">10</a>; <a onClick="return mV(\'Gen\',46,\'1-\');">46</a>, etc.; in <a onClick="return mV(\'Exd\',6,\'14-27\');">Ex 6:14-27</a>, where the sons of Reuben, Simeon and especially Levi, are given; in <a onClick="return mV(\'Num\',1,2);">Nu 1:2</a>; <a onClick="return mV(\'Num\',26,\'2-51\');">26:2-51</a>, where the poll of fighting men is made on genealogical principles; in <a onClick="return mV(\'Num\',2,2);">Nu 2:2</a>, where the positions on the march and in camp are determined by tribes and families; in David\'s division of priests and Levites into courses and companies (<a onClick="return mV(\'1Ch\',6,\'1-\');">1Ch 6-9</a>); is referred to in the account of Jeroboam\'s reign (<a onClick="return mV(\'2Ch\',12,15);">2Ch 12:15</a> margin, "the words of Iddo, after the manner of genealogies"); is made prominent in Hezekiah\'s reforms when he reckoned the whole nation by genealogies (<a onClick="return mV(\'1Ch\',4,41);">1Ch 4:41</a>; <a onClick="return mV(\'2Ch\',31,\'16-19\');">2Ch 31:16-19</a>); is seen in Jotham\'s reign when the Reubenites and Gadites are reckoned genealogically (<a onClick="return mV(\'1Ch\',5,17);">1Ch 5:17</a>). Zerubbabel took a census, and settled the returning exiles according to their genealogies (<a onClick="return mV(\'1Ch\',3,\'19-24\');">1Ch 3:19-24</a>; <a onClick="return mV(\'1Ch\',9,\'1-\');">1Ch 9</a>; <a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a>; <a onClick="return mV(\'Neh\',7,\'1-\');">Ne 7</a>; <a onClick="return mV(\'Neh\',11,\'1-\');">11</a>; <a onClick="return mV(\'Neh\',12,\'1-\');">12</a>). With the rigid exclusion of all foreign intermixtures by the leaders of the Restoration (<a onClick="return mV(\'Ezr\',10,\'1-\');">Ezr 10</a>; <a onClick="return mV(\'Neh\',10,30);">Ne 10:30</a>; <a onClick="return mV(\'Neh\',13,\'23-31\');">13:23-31</a>), the genealogical interest naturally deepened until it reached its climax, perhaps in the time of Christ and up to the destruction of Jerusalem. Josephus, in the opening of his Life, states that his own pedigree was registered in the public records. Many families in Christ\'s time clearly possessed such lists (<a onClick="return mV(\'Luk\',1,5);">Lu 1:5</a>, etc.). The affirmed, reiterated and unquestioned Davidic descent of Christ in the New Testament, with His explicit genealogies (<a onClick="return mV(\'Mat\',1,\'1-17\');">Mt 1:1-17</a>; <a onClick="return mV(\'Luk\',3,\'23-38\');">Lu 3:23-38</a>); Paul\'s statement of his own descent; Barnabas\' Levitical descent, are cases in point. Davididae, descendants of David, are found as late as the Roman period. There is a tradition that Herod I destroyed the genealogical lists at Jerusalem to strengthen his own seat, but more probably they persisted until the destruction of Jerusalem.<P>3. Importance of Genealogies:<P>Genealogical accuracy, always of interest both to primitive and more highly civilized peoples, was made especially important by the facts that the land was promised to the descendants of Abraham, Isaac, Jacob, that the priesthood was exclusively hereditary, that the royal succession of Judah lay in the Davidic house, that the division and occupation of the land was according to tribes, families and fathers\' houses; and for the Davididae, at least, that the Messiah was to be of the house of David. The exile and return, which fixed indelibly in the Jewish mind the ideas of monotheism, and of the selection and sacred mission of Israel, also fixed and deepened the genealogical idea, prominently so in the various assignments by families, and in the rejection in various ways of those who could not prove their genealogies. But it seems extreme to date, as with many modern critics, its real cultivation from this time. In the importance attached to genealogies the Hebrew resembles many other ancient literatures, notably the Egyptian, Greek, and Arabic, but also including Romans, Kelts, Saxons, the earliest history naturally being drawn upon genealogical as well as on annalic lines. A modern tendency to overestimate the likeness and underestimate the unlikeness of the Scripture to its undoubtedly cognate literatures finds in the voluminous artificial genealogical material, which grew up in Arabia after the time of the caliph Omar, an almost exact analogue to the genealogical interest at the time of the return. This, however, is on the assumption of the late date of most of the genealogical material in the older New Testament books, and rests in turn on the assumption that the progress of religious thought and life in Israel was essentially the same as in all other countries; an evolutionary development, practically, if not theoretically, purely naturalistic in its genesis and progress.<P>4. Their Historical Value:<P>The direct historical value of the Scripture genealogies is variously estimated. The critically reconstructive school finds them chiefly in the late (priestly) strata of the early books, and dates Chronicles-Ezra-Nehemiah (our fullest sources) about 300 BC, holding it to be a priestly reconstruction of the national history wrought with great freedom by the "Chronicler." Upon this hypothesis the chief value of the genealogies is as a mirror of the mind and ideas of their authors or recorders, a treasury of reflections on the geographical, ethnological and genealogical status as believed in at their time, and a study of the effect of naive and exaggerated patriotism dealing with the supposed facts of national life, or else, in the extreme instance, a highly interesting example of bold and inventive juggling with facts by men with a theory, in this particular case a priestly one, as with the "Chronicler." To more conservative scholars who accept the Old Testament at its face value, the genealogies are a rich mine of historical, personal and ethnographic, as well as religious, information, whose working, however, is much hindered by the inevitable corruption of the text, and by our lack of correlative explanatory information. Much interesting illustrative matter may be looked for from such archaeological explorations as those at Gezer and elsewhere under the Palestine Exploration Society, the names on the pottery throwing light on the name-lists in Chronicles, and the similar discoveries on the supposed site of Ahab\'s palace in Samaria, which also illustrate the conflict between Baal and Yahweh worship by the proportion of the proper names compounded by "Baal" or "Jah" (see Macalister, Bible Sidelights from Gezer, 150ff; PEF, 1905, 243, 328; Harvard Theological Review, 1911). In spite of all such illustrative data, however, the genealogies must necessarily continue to present many insoluble problems. A great desideratum is a careful and systematic study of the whole question by some modern conservative scholar endowed with the patience and insight of the late Lord A.C. Hervey, and equipped with the fruits of the latest discoveries. While much curious and suggestive information may be derived from an intensive study of the names and relationships in the genealogies (although here the student needs to watch his theories), their greatest present value lies in the picture they present of the large-hearted cosmopolitanism, or international brotherliness, in the older ones, notably <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>, recognizing so clearly that God hath made of one all nations to dwell on the earth; and, as they progress, in the successive selection and narrowing as their lines converge upon the Messiah.<P>5. Principles of Interpretation:<P>In the evaluation and interpretation of the genealogies, certain facts and principles must be held in mind.<P>(1) Lists of names necessarily suffer more in transmission than other literature, since there is almost no connectional suggestion as to their real form. Divergences in different versions, or in different stages, of the same genealogy are therefore to be looked for, with many tangles hard to unravel, and it is precisely at this point that analytic and constructive criticism needs to proceed most modestly and restrain any possible tendency unduly to theorize.<P>(2) Frequently in the Scriptural lists names of nations, countries, cities, districts or clans are found mingled with the names of individuals. This is natural, either as the personification of the clan or nation under the name of its chief, or chief progenitor, or as the designation of the individual clan, family or nation, from its location, so common among many nations. Many of the cases where this occurs are so obvious that the rule may not be unsafe to consider all names as probably standing for individuals where the larger geographical or other reference is not unmistakably clear. This is undoubtedly the intent and understanding of those who transmitted and received them.<P>(3) It is not necessary to assume that the ancestors of various tribes or families are eponymous, even though otherwise unknown. The Scriptural explanation of the formation of tribes by the expansion and division of families is not improbable, and is entitled to a certain presumption of correctness. Furthermore, it is extremely difficult to establish a stopping-point for the application of the eponymous theory; under its spell the sons of Jacob disappear, and Jacob, Isaac and even Abraham become questionable.<P>(4) The present quite popular similar assumption that personal details in the genealogy stand for details of tribal history, as, for instance, the taking of a concubine means rather an alliance with, or absorption of, an inferior tribe or clan, is a fascinating and far-reaching generalization, but it lacks confirmation, and would make of the Scripture an allegorical enigma in which historical personages and events, personified peoples or countries, and imaginary ancestors are mingled in inextricable confusion.<P>(5) Scriptural genealogies are often given a regular number of generations by omitting various intermediate steps. The genealogies of Jesus, for instance, cover 42 generations, in 3 subdivisions of 14 each. Other instances are found in the Old Testament, where the regularity or symmetry is clearly intentional. Instance Jacob\'s 70 descendants, and the 70 nations of <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>. This has in modern eyes an artificial look, but by no means necessarily involves violence done to the facts under the genealogist\'s purview, and is readily and creditably accounted for by his conceptions and purposes. The theory that in some cases the requisite number has been built up by the insertion of imaginary names (see Curtis, ICC, "Chronicles," 135) has another aspect, and does not seem necessary to account for the facts, or to have sufficient facts to sustain it. See <a onClick="return mV(\'Gen\',21,5);">21:5</A>, (6) below. It involves a view of the mental and moral equipment and point of view of the Chronicler in particular, which would not seem to leave him many shreds of either historical, or "religious" value, and which a sounder criticism will surely very materially modify.<P>(6) Much perplexity and confusion is avoided by remembering that other modes of entrance into the family, clan, tribe or nation obtained than that by birth: capture, adoption, the substitution of one clan for another just become extinct, marriage. Hence, "son of," "father of," "begat," have broader technical meanings, indicating adoptive or official connection or "descent," as well as actual consanguinity, nearer or remote, "son" also meaning "grandson," "great-grandson," etc. Instance Caleb, the son of Jephunneh, of the tribe of Judah, styled (<a onClick="return mV(\'1Ch\',2,18);">1Ch 2:18</a>) a descendant of Hezron and son of Hur, but also, in token of his original descent, called the Kenizzite or "son of Kenaz" (<a onClick="return mV(\'Jos\',15,17);">Jos 15:17</a>), etc. Similarly, where in an earlier genealogy a clan or individual is assigned to a certain tribe, and in a later to another, it has been "grafted in." But while these methods of accretion clearly obtained, the nations freely absorbing neighboring or surrounding peoples, families, or persons, families likewise absorbing individuals, as in American Indian, and many other tribes; yet, as in them, the descent and connection by birth constituted the main line, and in any given case has the presumption unless clear facts to the contrary exist.<P>(7) The repetition of the same name in the same genealogy, as in that of the high priests (<a onClick="return mV(\'1Ch\',6,\'1-15\');">1Ch 6:1-15</a>), rouses "suspicion" in some minds, but unnecessarily. It is very natural, and not uncommon, to find grandfathers and grandsons, especially among the Hebrews, receiving the same name (<a onClick="return mV(\'Luk\',1,59);">Lu 1:59</a>). This would be especially to be expected in a hereditary caste or office like the priesthood.<P>(8) The existence of the same name in different genealogies is not uncommon, and neither implies nor should cause confusion.<P>(9) The omission of one or many links in the succession, often clearly caused by the desire for symmetry, is frequent where the cause is unknown, the writers being careful only to indicate the connection more or less generally, without feeling bound to follow every step. Tribes were divided into families, and families into fathers\' houses; tribe, family and fathers\' house regularly constituting links in a formal genealogy, while between them and the person to be identified any or all links may be omitted. In similar fashion, there is an absence of any care to keep the successive generations absolutely distinct in a formal fashion, son and grandson being designated as alike "son" of the same ancestor. <a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a>, for instance, contains grandsons as well as sons of Benjamin, Bela, Becher, Ashbel, Gera, Nanman, Ehi, etc. This would be especially true where the son as well as the father became founder of a house. Some confusion is occasionally caused by the lack of rigid attention to precise terminology, a characteristic of the Hebrew mind. Strictly the tribe, shebhet (in the Priestly Code (P), matteh), is the larger subdivision, then the clan, mishpachah, "family," and then the "house" or "fathers\' house," bayith, or beth \'abh, beth \'abhoth; but sometimes a "fathers\' house" is a tribe (<a onClick="return mV(\'Num\',17,6);">Nu 17:6</a>), or a clan (<a onClick="return mV(\'1Ch\',24,6);">1Ch 24:6</a>). In this connection it is to be remembered again that sequence of generations often has to do with families rather than with individuals, and represents the succession to the inheritance or headship, rather than the actual relationship of father and son.<P>(10) Genealogies are of two forms, the descending, as <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>: "The sons of Japheth: Gomer," etc.; "The sons of Gomer: Ashkenaz," etc.; and the ascending, <a onClick="return mV(\'Ezr\',7,1);">Ezr 7:1</a>ff: "Ezra, the son of Seraiah, the son of Azariah, the son of Hilkiah," etc. The descending are the usual.<P>(11) Feminine names are occasionally found, where there is anything remarkable about them, as Sarai and Milcah (<a onClick="return mV(\'Gen\',11,29);">Ge 11:29</a>), Rebekah (<a onClick="return mV(\'Gen\',22,23);">Ge 22:23</a>), etc.; or where any right or property is transmitted through them, as the daughters of Zelophehad, who claimed and were accorded "a possession among the brethren of (their) father" (<a onClick="return mV(\'Num\',26,33);">Nu 26:33</a>; <a onClick="return mV(\'Num\',27,\'1-11\');">27:1-11</a>), etc. In such cases as Azubah and Ephrath, successive wives of Caleb (<a onClick="return mV(\'1Ch\',2,\'18-20\');">1Ch 2:18-20</a>), many modern critics find tribal history enshrined in this case, "Caleb" or "dog" tribe having removed from Azubah, "deserted" to Ephrathah, Bethlehem, in Northern Judah. But the principle is not, and cannot be, carried out consistently.<P>(12) The state of the text is such, especially in Chronicles, that it is not easy, or rather not possible, to construct a complete genealogical table after the modern form. Names and words have dropped out, and other names have been changed, so that the connection is often difficult and sometimes impossible to trace. The different genealogies also represent different stages in the history and, at many places, cannot with any knowledge now at our command be completely adjusted to each other, just as geographical notices at different periods must necessarily be inconsistent.<P>(13) In the present state of our knowledge, and of the text, and also considering the large and vague chronological methods of the Hebrews, the genealogies can give us comparatively little chronological assistance. The uncertainty as to the actual length of a generation, and the custom of frequently omitting links in the descent, increases the difficulty; so that unless they possess special marks of completeness, or have outstanding historical relationships which determine or corroborate them, or several parallel genealogies confirm each other, they must be used with great caution. Their interest is historical, biographical, successional or hereditary, rather than chronological.<P>6. Principles of Compilation:<P>The principal genealogical material of the Old Testament is found in <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>; <a onClick="return mV(\'Gen\',10,\'1-\');">10</a>; <a onClick="return mV(\'Gen\',11,\'1-\');">11</a>; <a onClick="return mV(\'Gen\',22,\'1-\');">22</a>; <a onClick="return mV(\'Gen\',25,\'1-\');">25</a>; <a onClick="return mV(\'Gen\',29,\'1-\');">29</a>; <a onClick="return mV(\'Gen\',30,\'1-\');">30</a>; <a onClick="return mV(\'Gen\',35,\'1-\');">35</a>; <a onClick="return mV(\'Gen\',36,\'1-\');">36</a>; <a onClick="return mV(\'Gen\',46,\'1-\');">46</a>; <a onClick="return mV(\'Exd\',6,\'1-\');">Ex 6</a>; <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1</a>; <a onClick="return mV(\'Num\',2,\'1-\');">2</a>; <a onClick="return mV(\'Num\',7,\'1-\');">7</a>; <a onClick="return mV(\'Num\',10,\'1-\');">10</a>; <a onClick="return mV(\'Num\',13,\'1-\');">13</a>; <a onClick="return mV(\'Num\',26,\'1-\');">26</a>; <a onClick="return mV(\'Num\',34,\'1-\');">34</a>; scattered notices in Joshua, Ruth, 1 Samuel; <a onClick="return mV(\'2Sa\',3,\'1-\');">2Sa 3</a>; <a onClick="return mV(\'2Sa\',5,\'1-\');">5</a>; <a onClick="return mV(\'2Sa\',23,\'1-\');">23</a>; <a onClick="return mV(\'1Ki\',4,\'1-\');">1Ki 4</a>; <a onClick="return mV(\'1Ch\',1,\'1-\');">1Ch 1-9</a>; <a onClick="return mV(\'1Ch\',11,\'1-\');">11</a>; <a onClick="return mV(\'1Ch\',12,\'1-\');">12</a>; <a onClick="return mV(\'1Ch\',15,\'1-\');">15</a>; <a onClick="return mV(\'1Ch\',23,\'1-\');">23-27</a>; <a onClick="return mV(\'2Ch\',23,\'1-\');">2Ch 23</a>; <a onClick="return mV(\'2Ch\',29,\'1-\');">29</a>; <a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a>; <a onClick="return mV(\'Ezr\',7,\'1-\');">7</a>; <a onClick="return mV(\'Ezr\',10,\'1-\');">10</a>; <a onClick="return mV(\'Neh\',3,\'1-\');">Ne 3</a>; <a onClick="return mV(\'Neh\',7,\'1-\');">7</a>; <a onClick="return mV(\'Neh\',10,\'1-\');">10</a>; <a onClick="return mV(\'Neh\',11,\'1-\');">11</a>; <a onClick="return mV(\'Neh\',12,\'1-\');">12</a>. The genealogies of our Lord (<a onClick="return mV(\'Mat\',1,\'1-17\');">Mt 1:1-17</a>; <a onClick="return mV(\'Luk\',3,\'23-38\');">Lu 3:23-38</a>) are the only New Testament material. The Old Testament and New Testament genealogies bring the record down from the creation to the birth of Christ. After tracing the descent from Adam to Jacob, incidentally (<a onClick="return mV(\'Gen\',10,\')-\';">Ge 10</a>) giving the pedigree of the various nations within their purview, the Hebrew genealogists give the pedigree of the twelve tribes. As was to be expected, those tribes, which in the developing history assumed greater prominence, received the chief attention. Dan is carried down but 1 generation, and credited with but 1 descendant; Zebulun 1 generation, 3 sons; Naphtali 1 generation, 4 sons; Issachar 4 generations, 15 descendants; Manasseh 4 generations, 39 descendants; Asher 7 generations, 40 descendants; Reuben 8 (?) generations, 22 descendants; Gad 10 generations, 28 descendants; E
