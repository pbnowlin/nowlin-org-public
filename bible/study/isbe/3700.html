isbe[3759]='Gerson`gur\'-sun (Gerson; 1Esdras 8:29): Called Gershom in <a onClick="return mV(\'Ezr\',8,2);">Ezr 8:2</a>.``1';
isbe[3760]='Geruth Chimham`ge\'-rooth kim\'-ham (geruth kimham): If the reading geruth is correct, a "lodging-place" or "khan" on the highway to Egypt, may be meant (<a onClick="return mV(\'Jer\',41,17);">Jer 41:17</a>). It may have been built by Chimham son of Barzillai; or it may have been named from him as owner of the land on which it stood. But probably with Josephus we should read gidhroth, "hurdles" or "sheep pens" (Ant., X, ix, 5).``1';
isbe[3761]='Gerzites`gur\'-zits (<a onClick="return mV(\'1Sa\',27,8);">1Sa 27:8</a> King James Version margin).`<a href="./study/isbe/search.html?string=GIRZITES">GIRZITES</a>`1';
isbe[3762]='Geshan`ge\'-shan (geshan, "firm," "strong"): A descendant of Judah through Caleb (<a onClick="return mV(\'1Ch\',2,47);">1Ch 2:47</a>). The King James Version has "Gesham," but not in the original 1611 edition.``1';
isbe[3763]='Geshem`ge\'-shem (geshem, gashmu; Gesam, "rain storm"): An Arabian, probably chief of an Arabian tribe that had either settled in Southern Palestine during the exile in Babylon, or had been settled in or near Samaria by Sargon (<a onClick="return mV(\'Neh\',2,19);">Ne 2:19</a>; <a onClick="return mV(\'Neh\',6,1,2,6);">6:1-2, 6</a>). He was a confederate of Sanballat and Tobiah, and strenuously opposed the building of the wall under Nehemiah. He with the others mocked at the first efforts to build the wall, and afterward repeatedly sought to entice Nehemiah to the plains of Ono. The name also occurs in the form Gashmu, perhaps an Assyrian form of the same name Geshem.``146';
isbe[3764]='Geshur`ge\'-shur (geshur, "bridge"): An Aramean kingdom (<a onClick="return mV(\'2Sa\',15,8);">2Sa 15:8</a>) of no great size which lay probably to the south of Maacah, and formed with it the western boundary of the land of Bashan (<a onClick="return mV(\'Deu\',3,14);">De 3:14</a>; <a onClick="return mV(\'Jos\',12,5);">Jos 12:5</a>; <a onClick="return mV(\'Jos\',13,11);">13:11</a>). The territory of these two probably corresponded roughly with modern Jaulan. It may not have reached quite to the Jordan on the west; in which case the Geshurites literally dwelt "in the midst" of Israel (<a onClick="return mV(\'Jos\',13,13);">Jos 13:13</a>), since they were not expatriated by the half-tribe of Manasseh, and they retained their independence. David married Maacah, daughter of Talmai, king of Geshur, who became the mother of Absalom and Tamar (<a onClick="return mV(\'2Sa\',3,3);">2Sa 3:3</a>). To Talmai Absalom fled for safety after the murder of Amnon (<a onClick="return mV(\'2Sa\',13,37);">2Sa 13:37</a>f), and thence Joab brought him back to Jerusalem (<a onClick="return mV(\'2Sa\',14,23);">2Sa 14:23</a>). The Geshurites and Aram are said to have taken the cities of Jair—i.e. Havvoth-jair—which lay in the land of Gilead (<a onClick="return mV(\'1Ch\',2,23);">1Ch 2:23</a>). It is possible that "Geshurites" should be read, with Vulgate, Syriac, etc., instead of "Ashurites" in <a onClick="return mV(\'2Sa\',2,9);">2Sa 2:9</a>. The only difficulty is that Geshur was an independent kingdom, and there is nothing to show how it was brought under the sway of the son of Saul. In the catalogue of land still to be possessed in <a onClick="return mV(\'Jos\',13,2);">Jos 13:2</a>, the King James Version reads "Geshuri," the Revised Version (British and American) "the Geshurites," referring evidently to a district bordering on the Philistines. Both the King James Version and the Revised Version (British and American) render the same word by "Geshurites" in <a onClick="return mV(\'1Sa\',27,8);">1Sa 27:8</a>, where apparently the same territory is indicated as invaded by David. In neither passage is the text above suspicion; in <a onClick="return mV(\'1Sa\',27,8);">1Sa 27:8</a> Septuagint\'s Codex Vaticanus omits the name. No satisfactory explanation has been suggested.``54';
isbe[3765]='Geshurites`gesh\'-u-rits, ge-shoo\'-rits (geshuri).`<a href="./study/isbe/search.html?string=GESHUR">GESHUR</a>`1';
isbe[3766]='Gesture`jes\'-tur, jes\'-tur: The Oriental is rich in gestures by which feelings are expressed and force added to words. Of this we have abundant illustration in the Bible. Almost every available part of the body was employed in gesture. In salutations the whole body was bowed, sometimes to the ground (<a onClick="return mV(\'Gen\',18,2);">Ge 18:2</a>; <a onClick="return mV(\'Gen\',19,1);">19:1</a>; <a onClick="return mV(\'Gen\',33,7);">33:7</a>; <a onClick="return mV(\'Gen\',42,6);">42:6</a>; <a onClick="return mV(\'Gen\',33,3);">33:3</a>), falling on the face to the ground and bowing to the ground, 3 times (<a onClick="return mV(\'1Sa\',20,41);">1Sa 20:41</a>; <a onClick="return mV(\'Gen\',23,7);">Ge 23:7</a>; <a onClick="return mV(\'2Sa\',9,8);">2Sa 9:8</a>; <a onClick="return mV(\'2Sa\',18,21);">18:21</a>; <a onClick="return mV(\'1Ki\',2,19);">1Ki 2:19</a>); it was common also to embrace and kiss (<a onClick="return mV(\'Exd\',18,7);">Ex 18:7</a>), etc., weeping for joy. Esau "fell on (Jacob\'s) neck, and kissed him: and they wept" (<a onClick="return mV(\'Gen\',33,4);">Ge 33:4</a>); compare Joseph and his brethren (<a onClick="return mV(\'Gen\',45,14,15);">Ge 45:14-15</a>); David and Jonathan (<a onClick="return mV(\'1Sa\',20,41);">1Sa 20:41</a>), and the father of the prodigal (<a onClick="return mV(\'Luk\',15,20);">Lu 15:20</a>). We have the kiss also in the story of Judas with his Master (<a onClick="return mV(\'Mat\',26,49);">Mt 26:49</a>). Bowing the knee was also in Egypt an act of homage to a superior (<a onClick="return mV(\'Gen\',41,43);">Ge 41:43</a>); bowing the knee and bowing down were common in prayer and worship (<a onClick="return mV(\'1Ki\',19,18);">1Ki 19:18</a>; <a onClick="return mV(\'2Ch\',6,13);">2Ch 6:13</a>; <a onClick="return mV(\'Ezr\',9,5);">Ezr 9:5</a>; <a onClick="return mV(\'Isa\',45,23);">Isa 45:23</a>); in prayer the head and whole body were also bowed (<a onClick="return mV(\'Gen\',24,26);">Ge 24:26</a>; <a onClick="return mV(\'2Ki\',5,18);">2Ki 5:18</a>; <a onClick="return mV(\'2Ch\',29,28);">2Ch 29:28</a>f). The rabbins decreed that in prayer "in bowing down, the back must be bent so low that every vertebra becomes conspicuous," and endless questions arose as to what it was lawful to do during prayer (Edersheim). We read also of prayer offered standing (<a onClick="return mV(\'1Sa\',1,26);">1Sa 1:26</a>; <a onClick="return mV(\'1Ki\',8,22);">1Ki 8:22</a>; <a onClick="return mV(\'Mat\',6,5);">Mt 6:5</a>; <a onClick="return mV(\'Mar\',11,25);">Mr 11:25</a>), lifting up and spreading forth the hands (<a onClick="return mV(\'1Ki\',8,22);">1Ki 8:22</a>; <a onClick="return mV(\'2Ch\',6,13);">2Ch 6:13</a>; <a onClick="return mV(\'Ezr\',9,5);">Ezr 9:5</a>; <a onClick="return mV(\'Neh\',8,6);">Ne 8:6</a>; <a onClick="return mV(\'1Ti\',2,8);">1Ti 2:8</a>); "lifting up the hands" was synonymous with prayer (<a onClick="return mV(\'Psa\',77,2);">Ps 77:2</a>; <a onClick="return mV(\'Psa\',141,2);">141:2</a>; <a onClick="return mV(\'Lam\',2,19);">La 2:19</a>; <a onClick="return mV(\'1Ti\',2,8);">1Ti 2:8</a>); falling on the knees in pleading (<a onClick="return mV(\'1Ki\',1,13);">1Ki 1:13</a>). Reverence for the aged was expressed by rising up in their presence (<a onClick="return mV(\'Lev\',19,32);">Le 19:32</a>,"Thou shalt rise up before the hoary head"; <a onClick="return mV(\'Lam\',5,12);">Lam 5:12</a>). The hand was also laid on the mouth in token of respect (<a onClick="return mV(\'Job\',29,9);">Job 29:9</a>); in token of blessing the right hand was placed on the head (<a onClick="return mV(\'Gen\',48,14);">Ge 48:14</a>; compare <a onClick="return mV(\'Gen\',49,26);">Ge 49:26</a>; <a onClick="return mV(\'Pro\',10,6);">Pr 10:6</a>). The hands were laid on the head of the animal to be sacrificed; on the scapegoat and sin offering as denoting the transference of sin; on the burnt offering, perhaps as representing the offerer (<a onClick="return mV(\'Lev\',1,4);">Le 1:4</a>; <a onClick="return mV(\'Lev\',16,21);">16:21</a>). The hands were lifted up in blessing (<a onClick="return mV(\'Lev\',9,22);">Le 9:22</a>), in solemn swearing (<a onClick="return mV(\'Gen\',14,22);">Ge 14:22</a>; <a onClick="return mV(\'Exd\',6,8);">Ex 6:8</a>; <a onClick="return mV(\'Deu\',32,40);">De 32:40</a>), in defiance and threatening (<a onClick="return mV(\'2Sa\',20,21);">2Sa 20:21</a>); extended in pleading (<a onClick="return mV(\'Isa\',65,2);">Isa 65:2</a>). Giving the hand or joining hands as a pledge of friendship and fidelity (<a onClick="return mV(\'2Ki\',10,15);">2Ki 10:15</a>; <a onClick="return mV(\'Pro\',11,21);">Pr 11:21</a>) was the origin of the widespread custom of "shaking hands"; "striking hands" signified the clenching of a bargain or agreement (<a onClick="return mV(\'Pro\',6,1);">Pr 6:1</a> the Revised Version British and American)); as a solemn pledge the hand was placed under the thigh of the person to whom it was given (<a onClick="return mV(\'Gen\',24,2);">Ge 24:2</a>; <a onClick="return mV(\'Gen\',47,29);">47:29</a>); plucking the hand out of the bosom was a sign of action (<a onClick="return mV(\'Psa\',74,11);">Ps 74:11</a>); clapping the hands, of rejoicing (<a onClick="return mV(\'2Ki\',11,12);">2Ki 11:12</a>; <a onClick="return mV(\'Psa\',47,1);">Ps 47:1</a>; <a onClick="return mV(\'Psa\',98,8);">98:8</a>; <a onClick="return mV(\'Isa\',55,12);">Isa 55:12</a>), also of ridicule, contempt and rejoicing over one (<a onClick="return mV(\'Job\',27,23);">Job 27:23</a>; <a onClick="return mV(\'Lam\',2,15);">La 2:15</a>; <a onClick="return mV(\'Nah\',3,19);">Na 3:19</a>). We read of "beckoning with the hand" (<a onClick="return mV(\'Luk\',5,7);">Lu 5:7</a>; <a onClick="return mV(\'Jhn\',13,24);">Joh 13:24</a>), preliminary to speaking (<a onClick="return mV(\'Act\',12,17);">Ac 12:17</a>; <a onClick="return mV(\'Act\',13,16);">13:16</a>; <a onClick="return mV(\'Act\',19,33);">19:33</a>; <a onClick="return mV(\'Act\',21,40);">21:40</a>; <a onClick="return mV(\'Act\',26,1);">26:1</a>, he "stretched forth his hand"); drooping of the hands indicated failure, weakness or distress (<a onClick="return mV(\'Hbr\',12,12);">Heb 12:12</a>; compare <a onClick="return mV(\'Isa\',35,3);">Isa 35:3</a>; Ecclesiasticus 25:23); washing the hands (publicly) was a declaration of innocence, "of freedom from complicity" (<a onClick="return mV(\'Deu\',21,6,7);">De 21:6-7</a>; <a onClick="return mV(\'Mat\',27,24);">Mt 27:24</a>).<P>The head lifted up was a sign of arrogance or pride (<a onClick="return mV(\'Psa\',83,2);">Ps 83:2</a>); of exaltation, or recovery from trouble, etc. (<a onClick="return mV(\'Jdg\',8,28);">Jud 8:28</a>; <a onClick="return mV(\'Psa\',27,6);">Ps 27:6</a>; <a onClick="return mV(\'Psa\',110,7);">110:7</a>; <a onClick="return mV(\'Zec\',1,21);">Zec 1:21</a>); to cover the head was a symbol of grief or mourning (<a onClick="return mV(\'2Sa\',15,30);">2Sa 15:30</a>; <a onClick="return mV(\'Est\',6,12);">Es 6:12</a>; <a onClick="return mV(\'Jer\',14,3);">Jer 14:3</a>), also putting the hand on the head (<a onClick="return mV(\'2Sa\',13,19);">2Sa 13:19</a>; <a onClick="return mV(\'Jer\',2,37);">Jer 2:37</a>), or ashes, dust or earth (<a onClick="return mV(\'Jos\',7,6);">Jos 7:6</a>; <a onClick="return mV(\'1Sa\',4,12);">1Sa 4:12</a>; <a onClick="return mV(\'2Sa\',12,\'1-\');">2Sa 12</a>; <a onClick="return mV(\'2Sa\',13,19);">13:19</a>; <a onClick="return mV(\'Est\',4,1);">Es 4:1</a>); wagging (or shaking) the head expressed contempt or malicious enjoyment (<a onClick="return mV(\'Job\',16,4);">Job 16:4</a>; <a onClick="return mV(\'Psa\',64,8);">Ps 64:8</a>; <a onClick="return mV(\'Jer\',18,16);">Jer 18:16</a>; <a onClick="return mV(\'Lam\',2,15);">La 2:15</a>; with "hissing," compare <a onClick="return mV(\'Mat\',27,39);">Mt 27:39</a>; <a onClick="return mV(\'Mar\',15,29);">Mr 15:29</a>; compare <a onClick="return mV(\'Psa\',22,7);">Ps 22:7</a>; <a onClick="return mV(\'Psa\',44,14);">44:14</a>; <a onClick="return mV(\'Psa\',109,25);">109:25</a>; <a onClick="return mV(\'Jer\',48,27);">Jer 48:27</a>).<P>Uncovering the feet was a sign of grief (<a onClick="return mV(\'2Sa\',15,30);">2Sa 15:30</a>; <a onClick="return mV(\'Isa\',20,2,4);">Isa 20:2, 4</a>); lifting up the heel against one was a symbol of opposition (<a onClick="return mV(\'Psa\',41,9);">Ps 41:9</a>; <a onClick="return mV(\'Jhn\',13,18);">Joh 13:18</a>); shaking the dust from the feet, of freeing from responsibility and of complete rejection (<a onClick="return mV(\'Mat\',10,14);">Mt 10:14</a>; <a onClick="return mV(\'Act\',13,51);">Ac 13:51</a>; at Corinth Paul "shook out his raiment," <a onClick="return mV(\'Act\',18,6);">Ac 18:6</a>); strong joyous feeling found (as elsewhere) expression in dancing (<a onClick="return mV(\'Jdg\',11,34);">Jud 11:34</a>; <a onClick="return mV(\'Jdg\',21,21);">21:21</a>; <a onClick="return mV(\'1Sa\',18,6);">1Sa 18:6</a>; <a onClick="return mV(\'Jer\',31,4,13);">Jer 31:4, 13</a>), before Yahweh (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>; <a onClick="return mV(\'2Sa\',6,14,16);">2Sa 6:14, 16</a>).<P>Shooting out the lip was an expression of contempt (<a onClick="return mV(\'Psa\',22,7);">Ps 22:7</a>); to incline the ear signified attention (<a onClick="return mV(\'Psa\',45,10);">Ps 45:10</a>); rending the garments expressed the sense of horror (as in the presence of disaster, blasphemy, etc.) (<a onClick="return mV(\'Num\',14,6);">Nu 14:6</a>; <a onClick="return mV(\'Jos\',7,6);">Jos 7:6</a>; <a onClick="return mV(\'1Sa\',4,12);">1Sa 4:12</a>; <a onClick="return mV(\'2Sa\',1,2);">2Sa 1:2</a>; <a onClick="return mV(\'2Sa\',13,19);">13:19</a>; <a onClick="return mV(\'2Sa\',15,32);">15:32</a>; <a onClick="return mV(\'Mat\',26,65);">Mt 26:65</a>; <a onClick="return mV(\'Act\',14,14);">Ac 14:14</a>); the smile indicated favor and gave confidence (<a onClick="return mV(\'Job\',29,24);">Job 29:24</a>); lifting up the eyelids was a sign of pride (<a onClick="return mV(\'Pro\',30,13);">Pr 30:13</a>); Isaiah speaks also of the "outstretched necks and wanton eyes" of the haughty daughters of Zion, "walking and mincing as they go, and making a tinkling with their feet" (<a onClick="return mV(\'Isa\',3,16);">Isa 3:16</a>). The perverse man "winketh with his eyes...speaketh with his feet.... maketh signs with his fingers" (<a onClick="return mV(\'Pro\',6,13);">Pr 6:13</a>).<P>It is interesting to note the gestures ascribed in the Gospels to Jesus. The expression of His eyes is often referred to; we read how He "lifted up his eyes on his disciples" before pronouncing the Beatitudes, indicating a loving regard for them (<a onClick="return mV(\'Luk\',6,20);">Lu 6:20</a>); how He "looked upon" the young ruler and "loved him," and, with another expressive "look" (round about)—a sad look—said, "How hardly shall they that have riches enter into the kingdom of God" (<a onClick="return mV(\'Mar\',10,21,23);">Mr 10:21, 23</a>); how He "looked up to heaven" before He blessed and brake the loaves (<a onClick="return mV(\'Mat\',14,19);">Mt 14:19</a>; <a onClick="return mV(\'Mar\',6,41);">Mr 6:41</a>; <a onClick="return mV(\'Luk\',9,16);">Lu 9:16</a>); also before healing (<a onClick="return mV(\'Mar\',7,34);">Mr 7:34</a>); how He "looked round" on His adversaries in the synagogue (<a onClick="return mV(\'Luk\',6,10);">Lu 6:10</a>), "with anger, being grieved at the hardening of their heart" (<a onClick="return mV(\'Mar\',3,5);">Mr 3:5</a>); how He "turned and looked upon Peter" so that he remembered his boasting and fall, and went out and wept bitterly (<a onClick="return mV(\'Luk\',22,61);">Lu 22:61</a>); we read also how He took a little child into His arms and held him up as an example to His disciples (<a onClick="return mV(\'Mar\',9,36);">Mr 9:36</a>), and how He "took (little children) in his arms, and blessed them, laying his hands upon them" (<a onClick="return mV(\'Mar\',10,16);">Mr 10:16</a>); how He "stooped down, and with his finger wrote on the ground" when the woman accused of adultery was brought to Him, then "lifted up himself" and spake, again "stooped down, and with his finger wrote on the ground," till the woman\'s accusers had departed one by one, condemned and ashamed, when He again "lifted up himself" and sent the woman away (<a onClick="return mV(\'Jhn\',8,6);">Joh 8:6</a>); how on His way to the tomb of Lazarus, He was agitated, the King James Version and the Revised Version (British and American) "was troubled," margin "troubled himself." Meyer has "shuddered." Some translation "shook himself" (<a onClick="return mV(\'Jhn\',11,33);">Joh 11:33</a>).`<a href="./study/isbe/search.html?string=ATTITUDES">ATTITUDES</a>`185';
isbe[3767]='Get; Getting`A great many Hebrew words are in the Old Testament translated "get," "got," etc. The word "get" has two meanings: (1) with the idea of movement, "to go," etc.; (2) with that of acquisition, "to gain," "obtain," etc.<P>(1) In the first sense the most frequent words are bo\', "to come, or go in" (<a onClick="return mV(\'Gen\',45,17);">Ge 45:17</a>; <a onClick="return mV(\'1Sa\',22,5);">1Sa 22:5</a>, etc.); yalakh "to go on" (<a onClick="return mV(\'Gen\',12,1);">Ge 12:1</a>; <a onClick="return mV(\'Gen\',22,2);">22:2</a>; <a onClick="return mV(\'Exd\',5,4);">Ex 5:4</a>; <a onClick="return mV(\'Jer\',5,5);">Jer 5:5</a>, etc.); yaradh, "to go down" (<a onClick="return mV(\'Gen\',42,2);">Ge 42:2</a>; <a onClick="return mV(\'Joe\',3,13);">Joe 3:13</a>); \'alah, "to go up" (<a onClick="return mV(\'Gen\',44,17);">Ge 44:17</a>; <a onClick="return mV(\'Isa\',40,9);">Isa 40:9</a>; <a onClick="return mV(\'Jer\',49,31);">Jer 49:31</a>, etc.). Other words are nudh, "to move off" (<a onClick="return mV(\'Jer\',49,30);">Jer 49:30</a> the King James Version; <a onClick="return mV(\'Dan\',4,14);">Da 4:14</a>); nasa\', "to remove" (<a onClick="return mV(\'Num\',14,25);">Nu 14:25</a>); yatsa\', "to go out" (<a onClick="return mV(\'Gen\',19,14);">Ge 19:14</a>; <a onClick="return mV(\'Gen\',31,13);">31:13</a>; <a onClick="return mV(\'Exd\',11,8);">Ex 11:8</a>).<P>(2) In the sense of acquisition, the words most frequently translated "get," etc., are \'asah, "to do," "to make" (<a onClick="return mV(\'Gen\',12,5);">Ge 12:5</a>; <a onClick="return mV(\'Gen\',31,1);">31:1</a>; <a onClick="return mV(\'Deu\',8,17,18);">De 8:17-18</a>); qanah, "to get," "obtain" (<a onClick="return mV(\'Gen\',4,1);">Ge 4:1</a>; <a onClick="return mV(\'Pro\',4,5,7);">Pr 4:5, 7</a>; <a onClick="return mV(\'Ecc\',2,7);">Ec 2:7</a> the King James Version, the Revised Version (British and American) "bought"; <a onClick="return mV(\'Jer\',13,1);">Jer 13:1</a>, the Revised Version (British and American) "buy"); matsa\' "to find" (<a onClick="return mV(\'Num\',31,50);">Nu 31:50</a>; <a onClick="return mV(\'2Sa\',20,6);">2Sa 20:6</a>); rakhash, "to acquire," "gain" (<a onClick="return mV(\'Gen\',31,18);">Ge 31:18</a>; <a onClick="return mV(\'Gen\',36,6);">36:6</a> the King James Version, the Revised Version (British and American) "gathered"; <a onClick="return mV(\'Gen\',46,6);">Ge 46:6</a>).<P>Getting is the translation of po\'al (<a onClick="return mV(\'Pro\',21,6);">Pr 21:6</a>), of qinyan "obtaining" (<a onClick="return mV(\'Gen\',31,18);">Ge 31:18</a>; <a onClick="return mV(\'Pro\',4,7);">Pr 4:7</a>, the English Revised Version text and the American Standard Revised Version margin "all thou hast gotten"). In the New Testament "get" in the first sense is the translation of exerchomai, "to go out or forth" (<a onClick="return mV(\'Luk\',13,31);">Lu 13:31</a>; <a onClick="return mV(\'Act\',7,3);">Ac 7:3</a>; <a onClick="return mV(\'Act\',22,18);">22:18</a>); of exeimi, "to go out or forth" (<a onClick="return mV(\'Act\',27,43);">Ac 27:43</a>); of katabaino, "to go down" (<a onClick="return mV(\'Act\',10,20);">Ac 10:20</a>); hupago, "to go away or under," "Get...behind" (<a onClick="return mV(\'Mat\',16,23);">Mt 16:23</a>; <a onClick="return mV(\'Luk\',4,8);">Lu 4:8</a> the King James Version, "Get...hence"; <a onClick="return mV(\'Mat\',4,10);">Mt 4:10</a>). The only separate word translated "get" in the second sense is heurisko, "to begin to find" (usually translated "find") (<a onClick="return mV(\'Luk\',9,12);">Lu 9:12</a> the King James Version, "that they may go...and get victuals").<P>For "get" the Revised Version (British and American) has "mount" (<a onClick="return mV(\'Deu\',28,43);">De 28:43</a>), "buy" (<a onClick="return mV(\'Pro\',17,16);">Pr 17:16</a>; <a onClick="return mV(\'Jer\',13,1);">Jer 13:1</a>; <a onClick="return mV(\'Jer\',19,1);">19:1</a>); for "get you down" (<a onClick="return mV(\'Joe\',3,13);">Joe 3:13</a>), "tread ye," margin "get you down"; "get" for "possess" (<a onClick="return mV(\'Luk\',18,12);">Lu 18:12</a>); "get them away" for "gather themselves together" (<a onClick="return mV(\'Psa\',104,22);">Ps 104:22</a>); "get us" for "apply" (<a onClick="return mV(\'Psa\',90,12);">Ps 90:12</a>); "let us get grain" for "therefore we take up corn for them," and for "that we might buy corn" (<a onClick="return mV(\'Neh\',5,2,3);">Ne 5:2-3</a>); "get you no" for "provide neither" (<a onClick="return mV(\'Mat\',10,9);">Mt 10:9</a>); "getteth prudence" for "is prudent," margin "dealeth prudently" (<a onClick="return mV(\'Pro\',15,5);">Pr 15:5</a>); "getteth" for "coveteth" (<a onClick="return mV(\'Hab\',2,9);">Hab 2:9</a>).``185';
isbe[3768]='Gether`ge\'-ther (gether): In <a onClick="return mV(\'Gen\',10,23);">Ge 10:23</a> named as one of the 4 sons of Aramaic In <a onClick="return mV(\'1Ch\',1,17);">1Ch 1:17</a> mentioned simply among the sons of Shem.``1';
isbe[3769]='Gethsemane`geth-sem\'-a-ne (Gethsemanei (for other spellings and accents see Thayer, under the word); probably from the Aramaic gath shemanim, "oil press"): Mentioned (<a onClick="return mV(\'Mat\',26,36);">Mt 26:36</a>; <a onClick="return mV(\'Mar\',14,32);">Mr 14:32</a>) as a place (chorion), margin "enclosed piece of ground," to which Jesus and the disciples retired after the last supper; in <a onClick="return mV(\'Jhn\',18,1);">Joh 18:1</a> it is described as a "garden" (kepos), while Luke (<a onClick="return mV(\'Luk\',22,40);">22:40</A>) simply says "place" (topos). From <a onClick="return mV(\'Jhn\',18,1);">Joh 18:1</a> it is evident that it was across the Kidron, and from <a onClick="return mV(\'Luk\',22,39);">Lu 22:39</a>, that it was on the Mount of Olives. Very possibly (<a onClick="return mV(\'Luk\',21,37);">Lu 21:37</a>; <a onClick="return mV(\'Luk\',22,39);">22:39</a>) it was a spot where Jesus habitually lodged when visiting Jerusalem. The owner—whom conjecture suggests as Mary the mother of Mark—must have given Jesus and His disciples special right of entry to the spot.<P>Tradition, dating from the 4th century, has fixed on a place some 50 yds. east of the bridge across the Kidron as the site. In this walled-in enclosure once of greater extent, now primly laid out with garden beds, by the owners—the Franciscans—are eight old olive trees supposed to date from the time of our Lord. They are certainly old, they appeared venerable to the traveler Maundrell more than two centuries ago, but that they go back to the time claimed is impossible, for Josephus states (BJ, VI, i, 1) that Titus cut down all the trees in the neighborhood of Jerusalem at the time of the siege. Some 100 yards farther north is the "Grotto of the Agony," a cave or cistern supposed to be the spot "about a stone\'s cast" to which our Lord retired (<a onClick="return mV(\'Luk\',22,41);">Lu 22:41</a>). The Greeks have a rival garden in the neighborhood, and a little higher up the hill is a large Russian church. The traditional site may be somewhere near the correct one, though one would think too near the public road for retirement, but the contours of the hill slopes must have so much changed their forms in the troubled times of the first and second centuries, and the loose stone walls of such enclosures are of so temporary a character, that it is impossible that the site is exact. Sentiment, repelled by the artificiality of the modern garden, tempts the visitor to look for a more suitable and less artificial spot farther up the valley. There is today a secluded olive grove with a ruined modern olive press amid the trees a half-mile or so farther up the Kidron Valley, which must far more resemble the original Gethsemane than the orthodox site.``117';
isbe[3770]='Geuel`gu\'-el, ge-u\'-el (ge\'u\'el, "majesty of God"): The spy from the tribe of Gad (<a onClick="return mV(\'Num\',13,15);">Nu 13:15</a>), sent by Moses to spy out the land of Canaan.``1';
isbe[3771]='Gezer`ge\'-zer (gezer): A city of great military importance in ancient times, the site of which has recently been thoroughly explored. The excavations at this spot are the most thorough and extensive of any in Palestine, and have not only done much to confirm the history of the place, as known from Biblical and other sources, but have also thrown a flood of light upon the general history, civilization and religion of Palestine in pre-Israelite and Israelite times.<P>1. The Discovery and Position of the Site:<P>The long-lost site of Gezer was discovered by M. Clermont-Ganneau in 1873, and his suggestion that the modern name for the place, Tell Jezer (or Tell el Jezereh) was a survival of the ancient name was confirmed by his further discovery of three bilingual inscriptions, in Hebrew and Greek, cut on surfaces of rock by a certain Alkios, apparently once the governor of the city; in one of them occurred the expression "the boundary of Gezer."<P>The natural features and the position of Tell Jezer abundantly explain the extreme importance of Gezer in ancient times. The buried remains crown a narrow hill, running from northwest to southeast, about 1,700 ft. long by 300 to 500 ft. broad. The approach is steep on every side, and in early times, before the accumulation around the sides of the rubbish of some millenniums, must have been much more so. The hill stands, like an outpost, projecting into the great plain, and is connected with the low hills behind it, part of the Shephelah, with but a narrow neck. At the foot of the hill runs a great high road from Egypt to Syria; to the north lies the Vale of Aijalon, across which runs the modern carriage road to Jerusalem, and up which ran the great high road, by the Beth-horons, to the platenu north of Jerusalem; to the south lies the Vale of Sorek, where stood Bethshemesh, and along which went a great highway from the country of the Philistines to the hill country of Judah. Today the Jerus-Jaffa railway, after sweeping some miles away in the plain round the whole western and southern sides of the site, passes along this open vale to plunge into the narrow defile—the Wady Isma\'in, which it follows to Jerusalem. From the summit of the Tell, a vast expanse of country is visible between the long blue line of the Mediterranean to the west, and the abrupt and lofty mountains of Judah to the east. That it has been all through history the scene of military contest is fully understood when its strategic position is appreciated; no military leader even today, if holding the highlands of Palestine against invasion, could afford to neglect such an outpost.<P>2. History of Gezer:<P>Although the excavation of the site shows that it was occupied by a high civilization and a considerable population at an extremely early period, the first historical mention is in the list of the Palestinian cities captured by Tahutmes III (XVIIIth Dynasty, about 1500 BC). From this time it was probably under Egyptian governors (the Egyptian remains at all periods are considerable), but from the Tell el-Amarna Letters, a century or so later, we learn that Egyptian influence was then on the wane. Three of these famous clay tablets are dated from Gezer itself and are written in the name of the governor Yapachi; he was then hard pressed by the Khabiri, and he appealed for help in vain to Egypt. In other letters belonging to this series, there are references to this city. In one, a certain freebooter named Lapaya makes excuses that he had broken into the city. He "has been slandered. Is it an offense that he has entered Gazri and levied the people?" (no. CCXL, Petrie\'s translation).<P>In the well-known "Song of Triumph" of Merenptah, who is considered by many to be the Pharaoh of the Exodus, occurs the expression "Gezer is taken." (In connection with this it is interesting to notice that an ivory pectoral with the cartouche of Meren-ptah was unearthed at Gezer.)<P>In the time of Joshua\'s invasion a certain "king of Gezer" named Horam (horam, but in Septuagint Ailam, or Elam) came to the assistance of Lachish against the Israelites, but was slain (<a onClick="return mV(\'Jos\',10,33);">Jos 10:33</a>). Gezer was taken, but the Canaanites were not driven out, but remained in servitude (<a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>; <a onClick="return mV(\'Jdg\',1,29);">Jud 1:29</a>). The city became one of the towns on the southern border of Ephraim (<a onClick="return mV(\'Jos\',16,3);">Jos 16:3</a>), but was assigned to the Kohath clan of the Levites (<a onClick="return mV(\'Jos\',21,21);">Jos 21:21</a>). In <a onClick="return mV(\'2Sa\',5,25);">2Sa 5:25</a> (the King James Version "Gazer") we read that David chased the Philistines after their defeat in the valley of Rephaim "from Geba until thou come to Gezer," showing that this was on the frontier of the Philistine territory; and in <a onClick="return mV(\'1Ch\',20,4);">1Ch 20:4</a> it states, "There arose war at Gezer with the Philistines; then Sibbecai the Hushathite slew Sippai, of the sons of the giant; and they were subdued." In the corresponding account in <a onClick="return mV(\'2Sa\',21,18);">2Sa 21:18</a> the scene of this event is said to be Gob, which is probably a copyist\'s error—g-w-b for g-z-r. According to Josephus (Ant., VIII, vi, 1), at the commencement of Solomon\'s reign Gezer was in the hands of the Philistines, which may explain <a onClick="return mV(\'1Ki\',9,16);">1Ki 9:16</a>, where it is stated that a certain Pharaoh, whose daughter Solomon married, captured and burnt Gezer and gave the site to his daughter. Solomon rebuilt it (<a onClick="return mV(\'1Ki\',9,17);">9:17</A>). There are no further references to Gezer during the later Jewish monarchy, but there are several during the Maccabean period. Judas pursued Gorgias to "Gazara and into the plains of Idumaea and Azotis and Jamnia" (1Macc 4:15); Bacchides, after his defeat by Jonathan, "fortified also the city of Bethsura, and Gazara, and the tower, and put forces in them and provision of victuals" (1Macc 9:52 the King James Version); a little later Simon "camped against Gazara and besieged it round about; he made also an engine of war, and set it by, the city and battered a certain tower, and took it" (1Macc 13:43 the King James Version), after which he purified it (1Macc 13:47,48). From Josephus (Ant., XIII, viii, 2) we gather that Antiochus had taken Gezer from the Jews.<P>The governor, Alkios, who made the bilingual inscriptions, may come in about this time or a little later; the rock inscriptions, of which half a dozen are now known, give no information regarding their date.<P>In the period of the Crusades this site, under the name "Mount Gisart," was a crusading fort and gave its name to a family. Here King Baldwin IV gained a victory over Saladin in 1177, and in 1191 the latter monarch camped here while conducting some fruitless negotiations with King Richard Coeur de Lion. In 1495 a skirmish occurred here between the governor of Jerusalem and certain turbulent Bedouin. The history of Gezer, as known, is thus one of battles and sieges extending over at least 3,000 years; from the archaeological remains we may infer that its history was similar for at least 1,000 years earlier.<P>3. History of the Excavations:<P>In 1904 the Palestine Exploration Fund of England obtained a "permit" for the excavation of Tell Jezer. The whole site was the private property of certain Europeans, whose agent, living much of the time on the Tell itself, was himself deeply interested in the excavations, so that unusually favorable conditions obtained for the work. Mr. (now Professor) R. A. Stewart Macalister, M.A., was sent out, and for 3 years (1904-7) he instituted an examination of the hidden remains in the mound, after a manner, till then, unexampled in Palestine exploration. His ambition was to turn over every cubic foot of soil down to the original rock, so that nothing of importance could be overlooked. As at the expiration of the original "permit" much remained unexplored, application was made to the authorities for a second one, and, at the end of 1907, Mr. Macalister embarked on a further 2 years of digging. Altogether he worked for the greater part of 5 years, except for necessary interruptions of the work due to unfavorable weather. Some two-thirds of the total accumulated debris on the mound was ransacked, and besides this, many hundreds of tombs, caves and other antiquarian remains in the neighborhood were thoroughly explored.<P>4. Chief Results of the Explorations:<P>It was found that the original bare rock surface of the hill was crowned with buried remains, in some parts 20 and 30 ft. deep, made up of the debris of all the cities which had stood on the site during three or four thousand years; on the part excavated there were no remains so late as the commencement of the Christian era, the Gezer of that time, and the crusading fort, being built on a neighboring site. The earliest inhabitants were Troglodytes living in the many caves which riddled the hill surface; they were apparently a non-Sem race, and there was some evidence that they at least knew of cremation. These, or a race soon after—the earliest Semites—enclosed the hilltop with high earth rampart faced with rough stones—the earliest "walls" going back at least before 3000 BC. At an early period—probably about 3000 BC—a race with a relatively high civilization fortified the whole hilltop with a powerful and remarkably well-built wall, 14 ft. thick, with narrow towers of short projection at intervals of 90 ft. At a point on the south side of this was unearthed a very remarkable, massive, brick gateway (all the other walls and buildings are of stone), with towers on each side still standing to the height of 16 ft., but evidently once much higher. This gate showed a strong Egyptian influence at work long before the first historic reference (XVIIIth Dynasty), for both gateway and wall to which it belonged had been ruined at an early date, the former indeed, after its destruction, was overlaid by the buildings of a city, which from its datable objects—scarabs, etc.—must have belonged to the time of Amenhotep III, i.e. as early as 1500 BC.<P>The later wall, built, we may conclude, soon after the ruin of the former, and therefore about 1500 BC, was also a powerful construction and must have existed considerably over a thousand years, down, indeed, till 100 BC at least, when Gezer disappears from history as a fortitled site. These walls enclosed a larger area than either of the previous ones; they show signs of destruction and repairs, and Mr. Macalister is of the opinion that some of the extensive repairs—in one place a gap of 150 ft.—and the 28 inserted towers are the work of Solomon (<a onClick="return mV(\'1Ki\',9,17);">1Ki 9:17</a>). This wall must have existed in use through all we know of Gezer from Bible sources. When, from the ruined remains, we reconstruct in imagination these mighty ramparts, we need not wonder that the\' Hebrews, fresh from long wanderings in the wilderness, found it no easy task to capture cities so fortified as was this (<a onClick="return mV(\'Num\',13,28);">Nu 13:28</a>; <a onClick="return mV(\'Deu\',1,28);">De 1:28</a>).<P>The foundations of a powerful building, which were found inserted in a gap in the southern walls, turned out conclusively to be the palace of Simon Maccabeus—who captured the city (1Macc 13:43)—a graffito being found upon one of its stones running thus:<p class="in15">Pa´mpra(s) Simo´nos katepa´ge(?) p(u´r) basi´leion<P>which seems to mean,<p class="in15">"Pamphras, may he bring down (fire) on the palace of Simon."<P>Within the city walls the foundations of some seven or eight cities of various successive periods were found, superimposed one above the other. The city\'s best days appear to have been shortly before the time of Joshua; the next, perhaps, at the time of the Judges. With the period to which we should probably assign the arrival of the Hebrews, there is a great increase in the population, the hitherto inviolate environs of the "temple" being encroached upon by private dwellings: an interesting commentary on <a onClick="return mV(\'Jos\',16,10);">Jos 16:10</a>.<P>The great "High Place" which was uncovered is one of unique interest, and its discovery has thrown a flood of light upon the religion of the early Canaanites, that religion—"the worship of Baal and Ashteroth"—which was the great rival of the purer religion of Israel. This [Ba\'al] temple, or bamoth, consisted of a row of 8 matstsebhoth or rude stone pillars ranging in height from 5 ft. 5 inches to 10 ft. 9 inches (see <a href="study/isbe/search.html?string=HIGH+PLACE">HIGH PLACE</A>; <a href="study/isbe/search.html?string=PILLAR">PILLAR</A>), together with a curious trough which may have been a socket for the \'Asherah (see <a href="study/isbe/search.html?string=ASHERAH">ASHERAH</A>), or some kind of altar. The area around these pillars had a kind of rough floor of consolidated earth under which were found a number of large jars containing infant bones, considered to be the remains of infant sacrifice. In close proximity to this "temple" was a double cave, the construction of which strongly suggested that it had been arranged for the giving of oracles. This high place had been used for very many centuries; the matstsebhoth were not all of one period but had gradually been increased from one to seven, and an eighth of a more definitely sculptured form—as a simulacrum priapi—had been added some time later. In the accumulated rubbish around these pillars were found enormous numbers of small stone phallic images, together with pottery plaques of Astarte, made with rude exaggeration of the sexual organs.<P>See <a href="study/isbe/search.html?string=BAAL">BAAL</a>; <a href="study/isbe/search.html?string=ASHTAROTH">ASHTAROTH</A>.<P>Another monument of great interest—and high antiquity—was the great rock-cut tunnel. It is about 23 ft. high, and 13 ft. wide, and descends by 80 steps, 94 1/2 ft. through the solid rock, to a cave in which there is a spring. It is very similar to the great tunnel known as "Warren\'s tunnel and shaft" which was clearly constructed by the early Jebusites to reach from within the city\'s walls to the fountain of Gihon (see <a href="study/isbe/search.html?string=SILOAM">SILOAM</a>; <a href="study/isbe/search.html?string=ZION">ZION</a>). This Gezer tunnel must date at least to 2000 BC; it is evident from the nature of the accumulated debris which blocked its mouth that it was actually abandoned about 1400 BC. Its antiquity is confirmed by the fact that it was evidently excavated with flint knives.<P>At a much later period in history, in that of the Maccabees, the water supply of the city, in time of siege, at any rate, was largely dependent on an enormous open cistern which Mr. Macalister cleared of earth and found capable of containing 2,000,000 gallons of water. Among the smaller "finds" which throw light upon the Bible history may be mentioned two much broken, cuneiform tablets, both referring to land contracts, which, from the names of the eponyms, can be dated to 651 and 649 BC respectively. They therefore belong to the time of the last, and one of the greatest, of the Assyrian monarchs, Ahurbanipal, the "noble Osnappar" of <a onClick="return mV(\'Ezr\',4,10);">Ezr 4:10</a>, and they show that he was not only a great conqueror, but that in Palestine he had an organized government and that legal civil business was transacted in the language of Assyria.<P>The illumination of Old Testament history which the excavations of Gezer have afforded can here be only hinted at, but references to it will occur in many of the articles in other parts of this Encyclopedia.<P>LITERATURE.<P>In Bible Side-Lights from the Mound of Gezer Professor R. A. S. Macalister has described in a poplar form with illustrations some of his most remarkable discoveries; while in the Memoirs of the Excavations at Gezer (1912), published by the Palestine Exploration Fund, Professor Macalister deals with the subject exhaustively.``117';
isbe[3772]='Gezrites`gez\'-rits.`<a href="./study/isbe/search.html?string=GIRZITES">GIRZITES</a>`1';
isbe[3773]='Ghost`gost (nephesh; pneuma):"Ghost," the middle-English word for "breath," "spirit," appears in the King James Version as the translation of nephesh ("breath," "the breath of life," animal soul or spirit, the vital principle, hence, "life"), in two places of the Old Testament, namely, <a onClick="return mV(\'Job\',11,20);">Job 11:20</a>, "the giving up of the ghost" (so the Revised Version (British and American)), and <a onClick="return mV(\'Jer\',15,9);">Jer 15:9</a>, "She hath given up the ghost"; gawa\', "to gasp out, "expire" (die), is also several times so translated (<a onClick="return mV(\'Gen\',25,8,17);">Ge 25:8, 17</a>; <a onClick="return mV(\'Gen\',35,29);">35:29</a>; <a onClick="return mV(\'Gen\',49,33);">49:33</a>; <a onClick="return mV(\'Job\',3,11);">Job 3:11</a>; <a onClick="return mV(\'Job\',10,18);">10:18</a>; <a onClick="return mV(\'Job\',13,19);">13:19</a>; <a onClick="return mV(\'Job\',14,10);">14:10</a>; <a onClick="return mV(\'Lam\',1,19);">La 1:19</a>). In Apocrypha (Tobit 14:11) psuche is translated in the same way as nephesh in the Old Testament, and in 2Macc 3:31, en eschate pnoe is rendered "give up the ghost," the Revised Version (British and American) "quite at the last gasp."<P>In the New Testament "to give up the ghost" is the translation of ekpneo, "to breathe out" (<a onClick="return mV(\'Mar\',15,37,39);">Mr 15:37, 39</a>; <a onClick="return mV(\'Luk\',23,46);">Lu 23:46</a>; so the Revised Version (British and American)); of ekpsucho, "to breathe out," "expire" (<a onClick="return mV(\'Act\',5,5,10);">Ac 5:5, 10</a>; <a onClick="return mV(\'Act\',12,23);">12:23</a>); in <a onClick="return mV(\'Mat\',27,50);">Mt 27:50</a>, apheken to pneuma, and in <a onClick="return mV(\'Jhn\',19,30);">Joh 19:30</a>, paredoken to pneuma, are rendered respectively, "yielded" and "gave up the ghost," the Revised Version (British and American) "yielded up his spirit," "gave up his spirit."<P>"The Holy Ghost" is also frequent in the King James Version; in the American Standard Revised Version it is invariably changed to "Holy Spirit," in the English Revised Version sometimes only, chiefly in the Gospels.`<a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>; <a href="./study/isbe/search.html?string=SPIRIT">SPIRIT</a>`185';
isbe[3774]='Ghost, Holy``<a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>`1';
isbe[3775]='Giah`gi\'-a (giach): An unidentified place on the route followed by Abner in his flight, pursued by Joab (<a onClick="return mV(\'2Sa\',2,24);">2Sa 2:24</a>). Septuagint renders Gai, corresponding to the Hebrew ge, "valley." The form giach may be due to corruption of the text.``1';
isbe[3776]='Giants`ji\'-ants The word appears in the King James Version as the translation of the Hebrew words nephilim (<a onClick="return mV(\'Gen\',6,4);">Ge 6:4</a>; <a onClick="return mV(\'Num\',13,33);">Nu 13:33</a>); repha\'im (<a onClick="return mV(\'Deu\',2,11,20);">De 2:11, 20</a>; <a onClick="return mV(\'Deu\',3,11,13);">3:11, 13</a>; <a onClick="return mV(\'Jos\',12,4);">Jos 12:4</a>, etc.); rapha\' (<a onClick="return mV(\'1Ch\',20,4,6,8);">1Ch 20:4, 6, 8</a>), or raphah (<a onClick="return mV(\'2Sa\',21,16,18,20,22);">2Sa 21:16, 18, 20, 22</a>); in one instance of gibbor, literally, "mighty one" (<a onClick="return mV(\'Job\',16,14);">Job 16:14</a>).<P>In the first two cases the Revised Version (British and American) changes "giants" into the Hebrew words "Nephilim," nephilim, and "Rephaim," repha\'im, respectively (see these words). The "Nephilim of <a onClick="return mV(\'Gen\',6,4);">Ge 6:4</a> are not to be confounded with the "mighty men" subsequently described as the offspring of the unlawful marriages, of "the sons of God" and "the daughters of men." It is told that they overspread the earth prior to these unhallowed unions. That the word, whatever its etymology, bears the sense of men of immense stature is evident from the later passages; <a onClick="return mV(\'Num\',13,33);">Nu 13:33</a>. The same is true of the "Rephaim," as shown by the instance of Og (<a onClick="return mV(\'Deu\',3,11);">De 3:11</a>; <a onClick="return mV(\'Jos\',12,4);">Jos 12:4</a>). There is no doubt about the meaning of the word in the ease of the giants mentioned in <a onClick="return mV(\'2Sa\',21,\'1-\');">2Sa 21</a> and <a onClick="return mV(\'1Ch\',20,\'1-\');">1Ch 20</a>.`<a href="./study/isbe/search.html?string=ANTEDILUVIANS">ANTEDILUVIANS</a>`132';
isbe[3777]='Giants, Valley of the``<a href="./study/isbe/search.html?string=REPHAIM,+VALE+OF">REPHAIM, VALE OF</a>`1';
isbe[3778]='Gibbar`gib\'-ar (gibbar, "hero"): In <a onClick="return mV(\'Ezr\',2,20);">Ezr 2:20</a> the "children of Gibbar" are mentioned among those who returned with Zerubbabel. The parallel passage (<a onClick="return mV(\'Neh\',7,25);">Ne 7:25</a>) has "children of Gibeon."``1';
isbe[3779]='Gibbethon`gib\'-e-thon (gibbethon): A city in the territory of Dan in the plain named with Eltekeh and Baalath (<a onClick="return mV(\'Jos\',19,44);">Jos 19:44</a>), and assigned to the Kohathite Levites (<a onClick="return mV(\'Jos\',21,23);">Jos 21:23</a>). Later we find it in the hands of the Philistines; and it was while besieging the city that Nadab was slain by Baasha (<a onClick="return mV(\'1Ki\',15,27);">1Ki 15:27</a>). After 25 years Omri, the general of Baasha, was here made king of the army when news reached them of Zimri s regicide (<a onClick="return mV(\'1Ki\',16,15);">1Ki 16:15</a>). It may possibly be identified with Kibbiah, which lies about 16 miles southeast of Jaffa; but no certain identification is possible.``54';
isbe[3780]='Gibea`gib\'-e-a (gibh\'a\', "hill"): A grandson of Caleb (<a onClick="return mV(\'1Ch\',2,49);">1Ch 2:49</a>). His father was Sheva, whose mother was Maacah, Caleb\'s concubine (<a onClick="return mV(\'1Ch\',2,48);">1Ch 2:48</a>).``1';
isbe[3781]='Gibeah`gib\'-e-a (gibh\'ah, "hill"): The Hebrew word denotes generally an eminence or hill, in distinction from har, which is used for mountain, or mountain range. It occurs, however, in two instances, as a place-name. Under <a href="study/isbe/search.html?string=GEBA">GEBA</a> (which see) we have seen that Geba, Gibeah, and Gibeon are liable to be confused. This arises from their resemblance in form and meaning.<P>(1) An unidentified city in the territory of Judah (<a onClick="return mV(\'Jos\',15,57);">Jos 15:57</a>). It is named in the group containing Carmel, Ziph and Kain; it is therefore probably to be sought to the southeast of Hebron. It may be one of the two villages mentioned by Eusebius, Onomasticon (s.v. "Gabathon"), Gabaa and Gabatha; in the east of the Daroma. It is probably identical with Gibeah mentioned in <a onClick="return mV(\'2Ch\',13,2);">2Ch 13:2</a>.<P>(2) A city described as belonging to Benjamin (<a onClick="return mV(\'Jos\',18,28);">Jos 18:28</a>; <a onClick="return mV(\'Jdg\',19,14);">Jud 19:14</a>) Gibeah of Benjamin (<a onClick="return mV(\'1Sa\',13,2,15);">1Sa 13:2, 15</a>; <a onClick="return mV(\'1Sa\',14,16);">14:16</a>), Gibeah of the children of Benjamin (<a onClick="return mV(\'2Sa\',23,29);">2Sa 23:29</a>), Gibeah of Saul (<a onClick="return mV(\'1Sa\',11,4);">1Sa 11:4</a>; <a onClick="return mV(\'Isa\',10,29);">Isa 10:29</a>), and possibly, also, Gibeah of God (<a onClick="return mV(\'1Sa\',10,5);">1Sa 10:5</a> margin); see <a href="study/isbe/search.html?string=GIBEATH">GIBEATH, 4</a>.<P>1. History:<P>The narrative in which it first appears is one of extraordinary and tragic interest, casting priceless light on the conditions prevailing in those days when "there was no king in Israel" (<a onClick="return mV(\'Jdg\',19,\'1-\');">Jud 19</a>). A Levite sojourning on the farther side of Mt. Ephraim was deserted by his concubine who returned to her father\'s house in Beth-lehem-judah. Thither he went to persuade her to return. Hospitably entertained by her father, he tarried till the afternoon of the fifth day. The evening was nigh when they came over against Jebus—Jerusalem—but, rejecting his servant\'s suggestion that they should lodge in this "city of a stranger"—i.e. the Jebusite—the Levite pressed on, and when they were near to Gibeah the sun set. They entered the city and sat down in the street. The laws of hospitality today do not compel the entertainment of strangers who arrive after sunset. But it may have been through disregard of all law that they were left unbefriended. An old man from Mt. Ephraim took pity on them, invited them to his house, and made himself responsible for their necessities. Then follows the horrible story of outrage upon the Levite\'s concubine; the way in which he made known his wrongs to Israel; and the terrible revenge exacted from the Benjamites, who would not give up to justice the miscreants of Gibeah.<P>Gibeah was the home of Saul, the first king of Israel, and thither he returned after his election at Mizpah (<a onClick="return mV(\'1Sa\',10,26);">1Sa 10:26</a>). From Gibeah he summoned Israel to assemble for the relief of Jabesh-gilead, which was threatened by Nahash the Ammonite (<a onClick="return mV(\'1Sa\',11,4);">1Sa 11:4</a>). In the wars of Saul with the Philistines, Gibeah seems to have played a conspicuous part (<a onClick="return mV(\'1Sa\',13,15);">1Sa 13:15</a>). Here were exposed the bodies of the seven sons of Saul, slain by David\'s orders, to appease the Gibeonites, furnishing the occasion for Rizpah\'s pathetic vigil (<a onClick="return mV(\'2Sa\',21,1);">2Sa 21:1</a>). Gibeah is mentioned in the description of the Assyrian advance on Jerusalem (<a onClick="return mV(\'Isa\',10,29);">Isa 10:29</a>).<P>2. Identification:<P>The site now generally accepted as that of Gibeah is on Teleil el-Ful, an artificial mound about 4 miles north of Jerusalem, a short distance east of the high road to Shechem. A little way north of Teleil el-Ful, the high road bifurcates, one branch turning eastward to Jeba\', i.e. Geba (which should be read instead of "Gibeah" in <a onClick="return mV(\'Jdg\',20,31);">Jud 20:31</a>); the other continuing northward to Bethel. Not far from the parting of the ways, on the road to Jeba\' lies erRam, corresponding to Ramah (<a onClick="return mV(\'Jdg\',19,13);">Jud 19:13</a>). At Gibeah, about 30 furlongs from Jerusalem, Titus encamped for the night on his advance against the city from the north Teleil el-Ful quite satisfactorily suits all the data here indicated.<P>The words in <a onClick="return mV(\'Jdg\',20,33);">Jud 20:33</a> rendered by the King James Version "the meadows of Gibeah," the Revised Version (British and American) "Maareh-geba"—simply transliterating—and the Revised Version, margin "the meadow of Geba" (or Gibeah), by a slight emendation of the text, read "from the west of Gibeah," which is certainly correct.``54';
isbe[3782]='Gibeath (1)`gib\'e-ath (gibh\'ath): This is the status constructus of the foregoing (Gibeah). It is found in several compound place-names.<P>(1) Gibeath-ha-araloth (gibh\'ath ha\'araloth). English Versions of the Bible tanslations literally, "hill of the foreskins"; but the margins suggest the proper name. Here the Israelites were circumcised after the passage of the Jordan (<a onClick="return mV(\'Jos\',5,3);">Jos 5:3</a>). The place was therefore between that river and Jericho.<P>(2) Gibeath Phinehas (gibh\'ath pinechac), the burial place of Eleazar the son of Aaron in Mt. Ephraim (<a onClick="return mV(\'Jos\',24,33);">Jos 24:33</a> the King James Version "a hill that pertained to Phinehas," the Revised Version (British and American) "the hill of Phinehas," the Revised Version, margin "Gibeah of Phinehas"). Conder would identify it with \'Awertah in the plain of Makhneh, not far from Nablus, where "the Samaritans show the tombs of Phinehas and Eleazar, Abishuah and Ithamar" (Tent Work, 41f). The "tomb of Eleazar" <span class="noTag">is</span> 18 ft. long, plastered all over and shaded by a splendid terebinth." Guerin places it at Jibia, 3 miles north of Qaryat el-\'Anab (Judee, III, 37f; Samarie, 106ff). There is no certainty.<P>(3) Gibeath hammoreh (gibh\'ath hamoreh), a hill on the north side of the valley from the camp of Gideon, beside. which lay the Midianites (<a onClick="return mV(\'Jdg\',7,1);">Jud 7:1</a>, English Versions of the Bible "the hill of Moreh"; the Hebrew is literally, "hill of the teacher"). It is probably identical with Jebel Duchy, which rises on the north of the Vale of Jezreel. Moore (Judges, 200) mistakenly calls the mountain Nabi Dachi. This is, of course, the name of the "prophet" whose shrine crowns the hill.<P>See <a href="study/isbe/search.html?string=MOREH,+HILL+OF">MOREH</a>.<P>(4) Gibeath ha-Elohim (gibh\'ath ha-\'elohim), the place where Saul, after leaving Samuel, met the company of prophets, and prophesied with them (<a onClick="return mV(\'1Sa\',10,5,10);">1Sa 10:5, 10</a>). It is defined as the place "where is the garrison (or pillar) of the Philistines." This may be intended to distinguish it from <a href="study/isbe/search.html?string=GIBEAH">GIBEAH (2)</a>, with which it is often identified. In this case it may be represented by the modern Ramallah, about 10 miles north of Jerusalem.<P>See also <a href="study/isbe/search.html?string=TABOR">TABOR</a>.<P>(5) Gibeath ha-Hachilah (<a onClick="return mV(\'1Sa\',23,19);">1Sa 23:19</a>; <a onClick="return mV(\'1Sa\',26,1);">26:1</a>) is identical with <a href="study/isbe/search.html?string=HACHILAH">HACHILAH</a> (which see).<P>(6) Gibeath Ammah (<a onClick="return mV(\'2Sa\',2,24);">2Sa 2:24</a>) is identical with <a href="study/isbe/search.html?string=AMMAH">AMMAH</a> (which see).<P>(7) Gibeath Gareb (<a onClick="return mV(\'Jer\',31,39);">Jer 31:39</a>) is identical with <a href="study/isbe/search.html?string=GAREB">GAREB</a> (which see).``54';
isbe[3783]='Gibeath (2)`(<a onClick="return mV(\'Jos\',18,28);">Jos 18:28</a>).`<a href="./study/isbe/search.html?string=GIBEAH">GIBEAH</a>`1';
isbe[3784]='Gibeathite`gib\'-e-ath-it.`<a href="./study/isbe/search.html?string=SHEMAAH">SHEMAAH</a>`1';
isbe[3785]='Gibeon`gib\'-e-un (gibh\'on): One of the royal cities of the Hivites (<a onClick="return mV(\'Jos\',9,7);">Jos 9:7</a>). It was a greater city than Ai; and its inhabitants were reputed mighty men (<a onClick="return mV(\'Jos\',10,2);">Jos 10:2</a>). It fell within the territory allotted to Benjamin (<a onClick="return mV(\'Jos\',18,25);">Jos 18:25</a>), and was one of the cities given to the Levites (<a onClick="return mV(\'Jos\',21,17);">Jos 21:17</a>).<P>1. The Gibeonites:<P>By a stratagem the Gibeonites secured for themselves and their allies in Chephirah, Beeroth and Kirjath-jearim immunity from attack by the Israelites. Terrified by the fate of Jericho and Ai, a company disguised as ambassadors from a far country, their garments and shoes worn, and their provisions moldy as from the length of their journey, went to Joshua at Gilgal, and persuaded him and the princes of Israel to make a covenant with them. Three days later the deception was discovered and the wrath of the congregation of Israel aroused. In virtue of the covenant their lives were secured; but for their duplicity Joshua cursed them, and condemned them to be bondsmen, "hewers of wood and drawers of water for the house of my God" (<a onClick="return mV(\'Jos\',9,23);">Jos 9:23</a>), "for the congregation and for the altar of the Lord" (<a onClick="return mV(\'Jos\',9,27);">Jos 9:27</a> the King James Version). This points to their employment in the sanctuary; and possibly may shed some light on the massacre of the Gibeonites by Saul (<a onClick="return mV(\'2Sa\',21,1);">2Sa 21:1</a>f). The rest of the Canaanites resented the defection of the Hivites which so greatly weakened the forces for defense, and, headed by Adoni-zedek of Jerusalem, they assembled to wreak vengeance on Gibeon. The threatened city appealed to Joshua, who made a swift night march, fell suddenly upon the confederates, routed them, and "chased them by the way of the ascent of Beth-horon, and smote them to Azekah, and unto Makkedah" (<a onClick="return mV(\'Jos\',10,1);">Jos 10:1</a>).<P>A three years\' famine in the days of David was attributed to God\'s anger at the unexpiated crime of Saul in slaying the Gibeonites. He did this "in his zeal for...Israel and Judah," who may have fretted at the inconvenience of having the Gibeonites among them. The latter believed that Saul\'s desire was to destroy them utterly. When David tried to arrange matters with them they stood upon their ancient rights, claiming life for life. They would take no rights blood money: they demanded blood from the family of the slayer of their people. This demand David could not resist, and handed over to them seven sons of Saul (<a onClick="return mV(\'2Sa\',21,1);">2Sa 21:1</a>).<P>2. The Champions:<P>The army of Ishbosheth under Abner, and that of David under Joab, met at the pool of Gibeon. An attempt to settle the quarrel, by means of 12 champions on either side, failed, as each man slew his fellow, and the 24 perished side by side. A "sore battle" ensued in which Abner was beaten; he was pursued by the fleet-footed Asahel, brother of Joab, whom he slew.<P>See <a href="study/isbe/search.html?string=HELKATH-HAZZURIM">HELKATH-HAZZURIM</a>.<P>Possibly we should read "Gibeon" instead of "Geba" in <a onClick="return mV(\'2Sa\',5,25);">2Sa 5:25</a>, as in the parallel passage, <a onClick="return mV(\'1Ch\',14,16);">1Ch 14:16</a> (HDB, under the word) From Baal-perazim David was to make a circuit and fall upon the Philistines who were encamped in the plan of Rephaim west of Jerusalem. Perhaps, however, we should read "Gibeah" in both places. Cheyne (EB, under the word) thinks the hill town of Baal-perazim may be intended.<P>3. Murder of Amasa:<P>When, after the death of Absalom and the suppression of his rebellion, Bichri raised the standard of revolt, Amasa was sent to call out the men of Judah against him. Tarrying longer than the time appointed, there was danger lest Bichri might have opportunity to strengthen his position; so David dispatched Abishai and the troops that were with him to attack Bichri at once. Joab went with this expedition. Obviously he could never be content with a second place. The force of Amasa was met at "the great stone of Gibeon." There Joab treacherously slew that unsuspecting general, and, himself assuming command, stamped out the rebellion with his accustomed thoroughness (<a onClick="return mV(\'2Sa\',20,4);">2Sa 20:4</a>)." The great stone" appears to have been well known, and may have possessed some religious character.<P>4. The Sanctuary:<P>Gibeon was the seat of an ancient sanctuary, called in <a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a> "the great high place." Here, according to <a onClick="return mV(\'2Ch\',1,3);">2Ch 1:3</a>, was the tabernacle made in the wilderness—but see <a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a>. It was the scene of Solomon\'s great sacrifice after which he slept in the sanctuary and dreamed his famous dream (<a onClick="return mV(\'1Ki\',3,4);">1Ki 3:4</a>; <a onClick="return mV(\'1Ki\',9,2);">9:2</a>; <a onClick="return mV(\'2Ch\',1,3,13);">2Ch 1:3, 13</a>, etc.).<P>By "the great waters that are in Gibeon" Johanan overtook Ishmael the son of Nethaniah, and freed the captives he had taken from Mizpah (<a onClick="return mV(\'Jer\',41,11);">Jer 41:11</a>). Among those who returned with Zerubbabel were 95 "children of Gibeon" (<a onClick="return mV(\'Neh\',7,25);">Ne 7:25</a>; compare <a onClick="return mV(\'Neh\',3,7);">Ne 3:7</a>). At Gibeon Cestius Gallus ancamped when marching against Jerusalem from Antipatris (BJ, II, xix, 1).<P>5. Identification and Description:<P>The ancient city is represented by the modern village el-Jib. It is fully 5 miles northwest of Jerusalem, and about a mile north of Neby Samwil on a double knoll, with terraced slopes, but rocky and precipitous to the east. The village stands amid striking remains of antiquity. About a hundred paces from the village to the east is a large reservoir with a spring. Lower down, among the olives, are the remains of another and larger reservoir, which collected the overflow from the first. This is probably the "pool" of <a onClick="return mV(\'2Sa\',2,13);">2Sa 2:13</a>, and "the great waters" of <a onClick="return mV(\'Jer\',41,12);">Jer 41:12</a>. El-Jib stands in the midst of a rich upland plain not far south of the great pass which goes down by way of the Beth-horons into the vale of Aijalon.``54';
isbe[3786]='Gibeonites`gib\'-e-un-its. Inhabitants of <a href="study/isbe/search.html?string=GIBEON">GIBEON</a> (which see).``1';
