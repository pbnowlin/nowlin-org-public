phraim 14 (?) generations, 25 descendants. Levi, perhaps first as the priestly tribe, Judah next as the royal, Benjamin as most closely associated with the others, and all three as the survivors of the exile (although representatives of other tribes shared in the return) are treated with the greatest fullness.<P>7. Sources:<P>Chronicles furnishes us the largest amount of genealogical information, where coincident with the older genealogies, clearly deriving its data from them. Its extra-canonical sources are a matter of considerable difference among critics, many holding that the books cited by the Chronicler as his sources ("The Book of the Kings of Israel and Judah," "The Book of the Kings of Judah and Israel," "The History of Samuel the Seer," "The History of Nathan the Prophet," etc., to the number of perhaps 16) are our canonical books, with the addition of a "Midrashic History of Israel," from which he quotes the most freely. But the citations are made with such fullness, vividness, and particularity of reference, that it is hard to believe that he did not have before him extensive extra-canonical documents. This is the impression he clearly seeks to convey. Torrey (AJSL, XXV, 195) considers that he cites this array of authority purely "out of his head," for impressiveness\' sake, a theory which leaves the Chronicler no historical value whatever. It is extremely likely that he had before him also oral and written sources that he has not cited, records, private or public lists, pedigrees, etc., freely using them for his later lists and descents. For the post-exilic names and lists, Ezra-Nehemiah also furnish us much material. In this article no attempt is made at an exhaustive treatment, the aim being rather by a number of characteristic examples to give an idea of the quality, methods and problems of the Bible genealogies.``31';
isbe[3730]='Genealogy, 8 Part 1`<p>8. Principal Genealogies and Lists:<p>In the early genealogies the particular strata to which each has been assigned by reconstructive critics is here indicated by J, the Priestly Code (P), etc. The signs "= "or ":" following individual names indicate sonship.<p>(1) <a onClick="return mV(\'Gen\',4,\'16-24\');">Genesis 4:16-24</a>.—The Cainites (Assigned to P).<p>Seven generations to Jabal, Jubal and Tubal-cain, explaining the hereditary origin of certain occupations (supposed by many to be a shorter version of chapter <a onClick="return mV(\'Gen\',5,\'1-\');">5</a>).<p>(2) <a onClick="return mV(\'Gen\',4,25,26);">Genesis 4:25-26</a>.—The Sethites (Assigned to J).<p>(3) <a onClick="return mV(\'Gen\',5,\'1-32\');">Genesis 5:1-32</a>.—The Book of the Generations of Adam (Assigned to the Priestly Code (P), Except <a onClick="return mV(\'Gen\',5,29);">5:29</A> J).<p>Brings the genealogy down to Noah, and gives the chronology to the Flood. The numbers in the Hebrew Massoretic Text, the Samaritan Hebrew, and the Septuagint differ, Massoretic Text aggregating 1,656 years, Samaritan 1,307 years, and Septuagint 2,242 years. Some scholars hold this list to be framed upon that of the ten Babylonian kings given in Berosus, ending with Xisuthrus, the Babylonian Noah. An original primitive tradition, from which both lists are derived, the Hebrew being the nearer, is not impossible. Both the "Cainite" list in <a onClick="return mV(\'Gen\',4,\'1-\');">Ge 4</a> and this "Sethite" list end with three brothers.<p>(4) <a onClick="return mV(\'Gen\',10,\'1-32\');">Genesis 10:1-32</a>.—The Generations of the Sons of Noah.<p>"The Table of Nations" (assigned to the Priestly Code (P), <a onClick="return mV(\'Gen\',10,\'1-7\');">10:1-7</A>; J, <a onClick="return mV(\'Gen\',10,\'8-19\');">10:8-19</A>; the Priestly Code (P), <a onClick="return mV(\'Gen\',10,20);">10:20</A>; J, <a onClick="return mV(\'Gen\',10,21);">10:21</a>; the Priestly Code (P), <a onClick="return mV(\'Gen\',10,22);">10:22</A>; J, <a onClick="return mV(\'Gen\',10,\'24-30\');">10:24-30</a>; the Priestly Code (P), <a onClick="return mV(\'Gen\',10,31,32);">10:31,32</a>). Found in abridged form in <a onClick="return mV(\'1Ch\',1,\'5-24\');">1Ch 1:5-24</a>.<p>I. Japheth = Gomer, Magog, Badai, Javan, Tubal, Meshech, Tiras.<p>1. Gomer = Ashkenaz, Riphath (<a onClick="return mV(\'1Ch\',1,6);">1Ch 1:6</a>, Diphath), Togarmah.<p>2. Javan = Elisha, Tarshish, Kittim, Dodanim (Rodanim, <a onClick="return mV(\'1Ch\',17,\'1-\');">1Ch 17</a>, is probably correct, a "d", having been substituted by a copyist for "r").<p>II. Ham = Cush, Mizraim, Put, Canaan.<p>1. Cush = Seba, Havilah, Sibtah, Raamah, Sabteca (Nimrod).<p>2. Mizraim = Ludim, Anamim, Lehabim, Naphtuhim, Pathrusim, Casluhim (whence the Philis), Caphtorim.<p>3. Canaan = Zidon (Chronicles, Sidon), Heth; the Jebusite, Amorite, Girgashite, Hivite, Arkite, Sinite, Arvadite, Zemarite, Hittite.<p>4. Raamah (son of Cush) = Sheba, Dedan. <p>III. Elam = Asshur, Arpachshad, Lud, Aramaic<p>1. Aram = Uz, Hul, Gether, Mash (Chronicles, Meshech).<p>2. Arpachshad = Shelah = Eber = Peleg, Joktan.<p>3. Joktan (son of Eber) = Almodad, Sheleph, Hazarmaveth, Jerah, Hadoram, Uzal, Diklah, Obal, Abimael, Sheba, Ophir, Havilah, Jobab.<p>4. Peleg (son of Eber) = Reu = Serug = Nahor = Terah = Abraham.<p>Nearly all these names are of peoples, cities or districts. That Noah, Shem, Ham, Japheth, Nahor, Terah, Abraham, Nimrod, and probably Peleg, Reu, Serug, represent actual persons the general tenor of the narrative and the general teaching of Scripture clearly indicate, although many critics consider these also as purely eponymous. The others can mostly be more or less clearly identified ethnographically or geographically. This table represents the nations known to the writer, and in general, although not in all particulars, expresses the ethnographical relationships as far as they are now known to modern research. It follows a partly ethnological, partly geographical scheme, the descendants of Japheth in general representing the Aryan stock settled in Asia Minor, Media, Armenia, Greece, and the islands of the Mediterranean; those of Ham representing the Hamitic races in Ethiopia, Egypt, in Southwest Arabia, and Southern Babylonia. Many modern writers hold that in making "Nimrod" the son of "Cush," the Scripture writer has confused "Cush," the son of Ham, with another "Gush," the Cassei, living near Elam, since the later Babylonians and Assyrians were clearly Semitic in language and racial characteristics. Nevertheless the Scripture statement is accordant with early traditions of a Hamitic settlement of the country (Oannes the fish-god coming out of the Red Sea, etc.), and perhaps also with the fact that the earliest language of Babylonia was non-Sem. The sons of Canaan represent the nations and peoples found by the Hebrews in Palestine, the Phoenicians and the Canaanites. Heth is the great Hittite nation, by language and racial type strikingly non-Sem. Among the sons of Shem, Eber is by many considered eponymous or imaginary, but the hypothesis is not necessary. Most Assyriologists deny the connection of Elam with Shem, the later Elamites being non-Sem; the inscriptions, however, show that the earlier inhabitants up to 2300 BC were Semitic. Lud must be the Lydians of Asia Minor, whose manners and older names resemble the Semitic. Asia Minor presents a mixture of races as manifold as does Palestine. The sons of Joktan are tribes in Western and Southern Arabia. Havilah is given both as a son of Cush, Hamite, and of Joktan, Semite, perhaps because the district was occupied by a mixed race. It would seem, however, that "begat" or "son of" often represents geographical as well as ethnological relations. And where the classification of the Scripture writer does not accord with the present deliverances of archaeology, it must be remembered that at this distance conclusions drawn from ethnology, philology and archaeology, considering the present incomplete state of these sciences, the kaleidoscopic shifting of races, dynasties and tongues through long periods, and our scanty information, are liable to so many sources of error that dogmatism is precarious. The ancient world possessed a much larger amount of international knowledge than was, until recently, supposed. A writer of 300 BC had a closer range and could have had sources of information much more complete than we possess. On the assumption of the Mosaic authorship, that broad, statesmanlike mind, learned in all the knowledge of the Egyptians, and, clearly, profoundly influenced by Babylonian law and literature, may be credited with considerable breadth of vision and many sources of information. Aside from the question of inspiration, this Table of Nations; for breadth of scope, for inclusiveness (though not touching peoples outside of the life of its writer), for genial broadmindedness, is one of the most remarkable documents in any literature.<p>(5) <a onClick="return mV(\'Gen\',11,\'10-27\');">Genesis 11:10-27</a>.—The Generations of Shem (assigned to P).<p>From Shem to Abraham. The list is also chronological, but the versions differ, Massoretic Text making 290 years, from Shem to Abraham, Samaritan Hebrew, 940, and Septuagint 1,070. Septuagint inserts Cainan, 130 years, otherwise agreeing with the Samaritan to the birth of Abraham. Arpachshad may be rendered "the territory of Chesed," i.e. of the Chasdim, Chaldeans. Eber therefore is descended from Arpachshad, Abraham, his descendant, coming from Ur-Chasdim.<p>(6) <a onClick="return mV(\'Gen\',11,\'23-26\');">Genesis 11:23-26</a>; <a onClick="return mV(\'Gen\',22,\'20-24\');">22:20-24</a>.—The Children of Nahor (<a onClick="return mV(\'Gen\',11,\'23-26\');">11:23-26</a> P; <a onClick="return mV(\'Gen\',22,\'20-24\');">22:20-24</a> J).<p>Uz, Buz, Kemuel, etc. These descendants of Abraham\'s brother probably represent Aramean tribes chiefly east or northeast of Canaan. Aram may be the ancestor of the Syrians of Damascus. Uz and Buz probably belong to Arabia Petrea, mentioned in <a onClick="return mV(\'Jer\',25,23);">Jer 25:23</a> with the Arabian tribes Dedan and Thema. Chesed in this list probably stands, not for the Chaldeans of Babylonia, but for a related tribe of Northern Syria. In <a onClick="return mV(\'Gen\',10,23);">Ge 10:23</a> (assigned to P) Uz is the son of Aram, and in <a onClick="return mV(\'Gen\',10,22);">10:22</A> Aram is a son of Shem. On the purely tribal hypothesis, this is either a contradiction, or the later statements represent other tribal relationships or subdivisions. Probably other individuals or tribes are indicated. Chronicles does not have this list, it being a side stream.<p>(7) <a onClick="return mV(\'Gen\',16,15);">Genesis 16:15</a>; <a onClick="return mV(\'Gen\',21,\'1-3\');">21:1-3</a>; <a onClick="return mV(\'Gen\',25,\'1-\');">25</a> (also <a onClick="return mV(\'1Ch\',1,\'28-33\');">1Ch 1:28-33</a>).—The Sons of Abraham by Sarah, Hagar, Keturah (<a onClick="return mV(\'Gen\',16,15);">Ge 16:15</a> assigned to P; <a onClick="return mV(\'Gen\',21,\'1-3\');">21:1-3</a> to J, the Priestly Code (P), J, P; <a onClick="return mV(\'Gen\',25,\'1-6\');">Ge 25:1-6</a> J; <a onClick="return mV(\'Gen\',25,\'7-11\');">25:7-11</a> P; <a onClick="return mV(\'Gen\',25,11);">25:11b</a> J; <a onClick="return mV(\'Gen\',25,\'12-17\');">25:12-17</a> P; <a onClick="return mV(\'Gen\',25,18);">25:18</a> J; <a onClick="return mV(\'Gen\',25,\'19-20\');">25:19,20</a> P; <a onClick="return mV(\'Gen\',25,\'21-26\');">25:21-26a</a> J; <a onClick="return mV(\'Gen\',25,26);">25:26b</a> P; <a onClick="return mV(\'Gen\',25,\'27-34\');">25:27-34</a> J).<p>The descendants of Abraham through Hagar and Ishmael represent the Ishmaelite tribes of Arabia living north and northwest of the Joktanidae, who chiefly peopled Arabia. Twelve princes are named, possibly all sons of Ishmael, perhaps some of them grandsons. The number has seemed "suspicious" as balancing too exactly the twelve tribes of Israel. But twelve is an approved Semitic number, determining not necessarily the sons born, but the "sons" mentioned. The Arabians generally were frequently given the name Ishmaelites, perhaps because of the greater prominence and closer contact of these northern tribes with the Hebrews. The sons of Keturah seem to have been chiefly Arabian tribes, whose locations are unknown. Midian, of the sons of Keturah, is the well-known and powerful tribe in the Arabian desert near the Aelanitic Gulf, bordered by Edom on the northwest. Sheba and Dedan are also mentioned as Cushites (<a onClick="return mV(\'Gen\',10,7);">Ge 10:7</a>). Very likely the tribes extensively intermarried, and could claim descent from both; or were adopted into one or the other family. Sheba was in southwestern Arabia. Dedan lived near Edom, where the caravan routes to various parts of Arabia converged. Asshurim are of course not Assyrians, but an Arabian tribe, mentioned by the side of Egypt in Minaean inscriptions. While the two sons of Isaac are to be accepted as real persons, their typical character is also unmistakable, the history of the two nations, Israel and Edom, being prefigured in their relations.<p>(8) <a onClick="return mV(\'Gen\',29,\'31-\');">Genesis 29:31</a>-<a onClick="return mV(\'Gen\',30,\'1-24\');">30:24</a>; <a onClick="return mV(\'Gen\',35,\'16-26\');">35:16-26</a>. The Children of Jacob (<a onClick="return mV(\'Gen\',29,\'31-35\');">29:31-35</a> Assigned to P; <a onClick="return mV(\'Gen\',30,\'1-3\');">30:1-3a</a> JE; <a onClick="return mV(\'Gen\',30,4);">30:4a</a> P; <a onClick="return mV(\'Gen\',30,\'4-24\');">30:4b-24</a> JE; <a onClick="return mV(\'Gen\',35,\'16-22\');">35:16-22</a> JE; <a onClick="return mV(\'Gen\',35,\'23-26\');">35:23-26</a> P).<p>The account of the parentage, birth and naming of the founders of the twelve tribes; by Leah: Reuben, Simeon, Levi, Judah, Issachar, Zebulun (daughter Dinah); by Bilhah: Dan, Naphtali; by Zilpah: Gad, Asher; by Rachel: Joseph, Benjamin. Much modern criticism agrees that these names are purely those of tribes, some of them perhaps derived from persons or places impossible now to trace, but mostly eponymous. Accordingly, these chapters are to be translated as follows. An Arab tribe, Jacob, wanders in Canaan, quarrels with Edom, migrates to Haran, forms alliances with the Aramean clans Rachel, Bilhah, Leah, Zilpah. Rachel and Jacob constitute a new tribe, Joseph. The federation takes the name Jacob. The other allied clans divide into sub-clans, or new clans join them, until Leah has six "sons," Reuben, Simeon, etc.; Zilpah, two; Bilhah, two. Zilpah and Bilhah are "concubines" because inferior members of the federation, or else have a left-handed connection with it. The formation of the new tribe Benjamin broke up the old tribe Rachel, which (who) accordingly "died." Although such are the original facts imbedded in the documents, they are now set in a framework of personal narrative, and were understood as narrative by the first hearers and readers. The history thus constituted is necessarily "an enigma which it is very hard to solve" (Bennett, Genesis, 284), and with almost as many answers as students. For critical purposes it presents a rich field for exploration, analysis and conjecture, but its edificatory value is chiefly found in reading the narratives as personal: a serious and reverent religious romance founded on facts or legends, whose real value lies in the sidelights it throws on national character and ethical principles, expressed in a naive, vivid, lifelike story, full of suggestion and teaching. This present article, however, proceeds on the Scripture representation of these details and incidents as personal.<p>The explanations of the names illustrate the Hebrew fondness for assonances, paronomasia, coming from a time when much importance was attached to words and sounds, but need not be considered mere popular etymologies, the Hebrew individual mother being fully capable of them. Neither do they necessarily represent the original etymology, or reason for the name, but may give the pregnant suggestion occurring to the maternal or other imagination.<p>Leah, "wild cow," is supposed by many to be so called from the "totem" of the "Leah" tribe. Reuben (re\'ubhen), original meaning unknown, unless Leah\'s emotional explanation explains the name, rather than is explained by it: ra\'ah be\'onyi, "hath looked upon my affliction." Superficially it might be re\'u ben, "See, a son," as in the American Revised Version, margin. Others see in the second statement: "My husband will love me," still another etymology, ye\'ehdbhani, "will love me." The lover of assonances can find more than one. The tribe is not prominent after Deborah\'s time. Simeon, considered by some an animal (totem) name, the Arabic sim\'u, cross between hyena and wolf, suggests to the mother (or is suggested by that) its likeness to shama\', "hear": "Yahweh hath heard." It is not much known after the Conquest. Levi, "adhesion, associate": thought by many a gentilic adjective from Leah, the Leah tribe par excellence; the name is adjectival in form. Leah connects it with yillaweh, "He will join," \'Now will my husband be joined unto me.\' A similar allusion is found in <a onClick="return mV(\'Num\',18,2,4);">Nu 18:2, 4</a>, there applied to the "joining" of the tribe to Aaron. Judah is associated with the verb hadhah, "praise": "Now will I praise Yahweh." Jacob makes the same suggestion in <a onClick="return mV(\'Gen\',49,8);">Ge 49:8</a>; no other plausible suggestion of the origin of the name can be made. The etymology and origin of Bilhah are unknown. Dan is associated with danah, "judge": "God hath judged"; no other etymology can be found. Naphtali is derived from niphtal, "wrestle": "I have wrestled," the only discoverable etymology. Zilpah, zilpah, perhaps is "dropping," "drop." Gad, gadh, "fortunate," according to Leah. Gad was the well-known Syrian god of "fortune"; but there is no necessary connection here. Asher, from \'ashar, "happy," \'ashsher, "call happy"; so Leah; no connection with Asshur, Assyrian god. Issachar, from sakhar, "hire," "man of hire": "God hath given me mine hire," also because Leah had "hired" Jacob with her son\'s mandrakes; a similar allusion in <a onClick="return mV(\'Gen\',49,\'1-\');">Ge 49</a>, "a servant under taskwork." Wellhausen would read \'ish-sakhar, "man of (some deity, unknown)." Zebulun, from zebhul, "habitation, dwelling": Leah gives two explanations, the first assigned by critics to Elohist (E) (probably), connecting the name with a root found in Zebediah, Zabdi, etc., "endow": "God hath endowed me with a good dowry"; the second with zabhal, "dwell": "Now will my husband dwell with me." Dinah, like Dan, is from dan, "judge." Supposed by some to be an old tribe of Israel, in some way associated with Dan, possibly a twin division. Rachel is "ewe," hence identified with a "ewe" tribe. Joseph has a twofold suggestion: the first (assigned to E) from acaph, "take away": "God hath taken away my reproach"; the second (assigned to J) from yacaph, "add": "Yahweh will add to me another son." None of these three cases of double explanation would so far exhaust Hebrew maternal imagination as to require the hypothesis of two documents, even though in the last "God" is used in the first suggestion and "Yahweh" in the second. Benjamin is called by Rachel Benoni, "the son of my sorrow," which is supposed to be an old tribal name, perhaps related to Onan, a clan of Judah, or the Benjamite city, Ono, and possibly to the Egyptian On. Benjamin, Jacob\'s name for him, "son of the right hand," i.e. of happiness, is understood as "son of the south," because originally the southern section of the Joseph tribe. The attempts to trace these names to tribal origins, local allusions, cognate languages, customs and religions have engaged much research and ingenuity, with results exceedingly diverse.<p>(9) <a onClick="return mV(\'Gen\',36,\'1-\');">Genesis 36</a>. The Generations of Esau (P).<p>I. The Descent of the Edomite Chiefs and Clans from Esau through His Three Wives, the Hittite or Canaanite Adah, the Ishmaelite Basemath, and the Horite Oholibamah (<a onClick="return mV(\'Gen\',36,\'1-19\');">Genesis 36:1-19</a>).<p>The wives\' names here differ from the other statements: In <a onClick="return mV(\'Gen\',26,34);">Ge 26:34</a> and <a onClick="return mV(\'Gen\',28,9);">28:9</a>:<p>1. Judith, daughter of Beeri the Hittite.<p>2. Bashemath, daughter of Elan, the Hittite.<p>3. Mahalath, daughter of Ishmael, sister of Nebaioth.<p>In <a onClick="return mV(\'Gen\',36,\'1-\');">Ge 36</a>:<p>1. Oholibamah, daughter of Anah, daughter of Zibeon, the Hivite.<p>2. Adah, daughter of Elon the Hittite.<p>3. Bashemath, daughter of Ishmael, sister of Nebaioth. <p>It is not necessary to resort to the hypothesis of different traditions. Bashemath and Adah are clearly identical, Esau perhaps having changed the name; as are Mahalath and the Ishmaelite Basemath, a transcriber\'s error being probably responsible for the change. As to Judith and Oholibamah, Anah is probably a man, identical with Beeri (<a onClick="return mV(\'Gen\',36,24);">Ge 36:24</a>), the son of Zibeon. Both "Hivite" and "Hittite" are apparently errors for "Horite," the difference being in only one consonant. Or "Hittite" may be used as the larger term embracing "Horite." "Edom" (<a onClick="return mV(\'Gen\',36,1,8,19);">Ge 36:1, 8, 19</a>) is a personal name; in <a onClick="return mV(\'Gen\',36,9,43);">Ge 36:9, 43</a> (Hebrew the American Revised Version, margin) it is national, indicating that to the writer Esau was a person, not an eponym. Nowhere are personal characteristics more vividly and unmistakably portrayed than in the accounts of Jacob and Esau. In these Esauite names are but two compounds of "El" (\'el), none of "Jah" (yah).<p>II. The Aboriginal Leaders or Clans in Edom, Partly Subdued by, Partly Allied with, the Esauites (<a onClick="return mV(\'Gen\',36,\'20-30\');">Genesis 36:20-30</a>). <p>These are descendants of "Seir the Horite" in seven branches, and in sub-clans. "Seir" looks like an eponym or a personification of the country, as no personal details have been preserved. Among these names are no "El" (\'el) or "Jah" (yah) compounds, although they are clearly cognate with the Hebrew. Several close similarities to names in Judah are found, especially the Hezronite. Many animal names, "Aiah," "bird of prey," "Aran," "wild goat," etc.<p>III. Eight Edomite "Kings" before the Hebrew Monarchy (<a onClick="return mV(\'Gen\',36,\'31-39\');">Genesis 36:31-39</a>).<p>One \'el compound, "Mehitabel," one ba\'al compound. It is to be noted that the "crown" was not hereditary and that the "capital" shifted; the office was elective, or fell into the hands of the local chief who could win it.<p>IV. A List of Esauite Clan Chiefs; "Dukes" (English Revised), "Chiefs" (American Standard Revised Version); "Sheiks" (<a onClick="return mV(\'Gen\',36,\'40-43\');">Genesis 36:40-43</a>).<p>Apparently arranged territorially rather than tribally. The names seem used here as either clans or places and should perhaps be read: "the chief of Teman," etc. The original ancestor may have given his name to the clan or district, or obtained it from the district or town.<p>In general this genealogy of Esau shows the same symmetry and balance which rouses suspicion in some minds: excluding Amalek, the son of the concubine, the tribes number twelve. Amalek and his descendants clearly separated from the other Edomites early and are found historically about Kadesh-barnea, and later roaming from the border of Egypt to North Central Arabia.<p>(10) <a onClick="return mV(\'Gen\',46,\'8-27\');">Genesis 46:8-27</a>.<p>(In different form, <a onClick="return mV(\'Num\',26,\'1-51\');">Nu 26:1-51</a>, and much expanded in parts of <a onClick="return mV(\'1Ch\',2,\'1-\');">1Ch 2-8</a>; compare <a onClick="return mV(\'Exd\',6,\'14-16\');">Ex 6:14-16</a>). Jacob\'s posterity at the descent into Egypt (considered a late addition to P).<p>A Characteristic Genealogy.<p>It includes the ideal number of 70 persons, obtained by adding to the 66 mentioned in <a onClick="return mV(\'Gen\',46,26);">Ge 46:26</a>, Jacob, Joseph, Ephraim and Manasseh, the two latter born in Egypt. Septuagint, followed by Stephen (<a onClick="return mV(\'Act\',7,14);">Ac 7:14</a>), reckons 75, adding to <a onClick="return mV(\'Gen\',46,20);">Ge 46:20</a> the names of three grandsons and two great-grandsons of Joseph, obtained from <a onClick="return mV(\'Num\',26,29,35);">Nu 26:29, 35</a>ff. Some may have been omitted to secure the ideal number so fascinating to the Hebrew mind. It is to be noted that Leah\'s male descendants are double those of Zilpah, and Rachel\'s double those of Bilhah, showing the ideal (but not the fictitious) character of the list. The design, also, seems to be to include those descendants of Jacob from whom permanent divisions sprang, even though, like Manasseh and Ephraim and probably Hezron and Hamul, born after the migration, but before Jacob\'s death. A comparison with the partial parallels also illustrates the corruption of the text, and the difficulty of uniformity in lists of names. The full list follows:<p>1. Jacob.<p>2. Leah\'s descendants.<p class="in15">A. Reuben = Hanoch, Pallu, Hezron, Carmi.<p class="in15">B. Simeon = Jemuel, Jamin, Ohad, Jachin, Zohar, Shaul.<p class="in15">C. Leui = Gershon, Kohath, Merari.<p class="in15">D. Judah = Er, Onan, Shelah, Perez, Zerah; Perez, Hezron, Hamul.<p class="in15">E. Issachar = Tolah, Puvah, Iob, Shimron.<p class="in15">F. Zebulun = Sered, Elon, Jahleel.<p class="in15">G. Dinah, daughter.<p>3. Zilpah\'s descendants, 16.<p class="in15">A. Gad = Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, Areli.<p class="in15">B. Asher = Imnah, Ishvah, Ishvi, Beriah, Serah (daughter); Beriah = Heber, Malchiel.<p>4. Rachel\'s descendants, 14.<p class="in15">A. Joseph = Manasseh, Ephraim.<p class="in15">B. Benjamin = Bela, Becher, Ashbel, Gera, Naaman, Ehi, Rash, Muppim, Huppin, Ard.<p>5. Bilhah\' s descendants, 7.<p class="in15">A. Dan = Hushim.<p class="in15">B. Naphtali = Jahzeel, Guni, Jezer, Shillem.<p>The list differs in many respects from those in Numbers and Chronicles, and presents some chronological and other problems. Without entering upon an exhaustive study, a number of names may be touched on.<p>Carmi, (2A), like the other names in i, might be a gentilic, "the Carmite," like "the Amorite," etc., especially if these names are those of clans, as they are in Numbers, instead of persons, as the Genesis narrative states. A town, "Bethhaccherem," is mentioned in <a onClick="return mV(\'Jer\',6,1);">Jer 6:1</a>. But "the vine-dresser" is also a good rendering.<p>Hezron (2A). Another Hezron is given as a descendant of Judah. This duplication of names is possible in clans; see instances below, but more likely in persons.<p>Jemuel (2B). Nemuel in <a onClick="return mV(\'Num\',26,12);">Nu 26:12</a>; <a onClick="return mV(\'1Ch\',4,24);">1Ch 4:24</a>, an easy error in transcription, yodh, and nun, being easily confused. In Numbers, Nemuel is also a Reubenite name.<p>Jamin (or Jachin) (2B) is Jarib in Chronicles.<p>Ohad (2B). Not in Numbers or Chronicles.<p>Zohar (2B) is Zerah in Numbers and Chronicles.<p>Gershon (2C). In <a onClick="return mV(\'1Ch\',6,16);">1Ch 6:16</a> Gershom; identified by some with Gershom, son of Moses, on theory that the priestly family of Gershom originally traced its descent to Moses, but its later members were reckoned, not as priests, but as Levites, thus becoming identified with Levi; precarious; its principal foundation being similarity of name and tribe.<p>Hezron and Hamul (2D) rouse chronological or exegetical difficulties. Pharez (<a onClick="return mV(\'Gen\',33,\'1-\');">Ge 33</a>) could not have been old enough at the migration to have two sons; but very possibly <a onClick="return mV(\'Gen\',38,\'1-\');">Ge 38</a> is introduced episodically, not chronologically, and therefore its events may have occurred before those of <a onClick="return mV(\'Gen\',37,\'1-\');">Ge 37</a>. Jacob was 130 years old at the descent, making Judah not 42 but 62, and Pharez old enough for sons. And, as suggested above, the writer may have done with Hezron and Hamul as with Ephraim and Manasseh—included them constructively, they having been born in Egypt, but before Jacob\'s death, belonging therefore to the generation of the migration and so reckoned, especially as they rounded permanent tribal divisions.<p>Puvah (2E). Puah in <a onClick="return mV(\'1Ch\',7,1);">1Ch 7:1</a>. In <a onClick="return mV(\'Jdg\',10,1);">Jud 10:1</a>, centuries later, Puah is father of Tola, an illustration of the descent of fathers\' names.<p>Iob (2E) is Jashub (Numbers, Chronicles), the latter probably correct. Septuagint has it here. A copyist, no doubt, omitted the "shin," "sh."<p>Dinah (2G) is thought by some to be a later insertion, on account of the "awkward Hebrew," "with Dinah." Dinah and Serah as unmarried, and no doubt because of other distinguishing facts, now unknown, are the only women descendants mentioned; married women would not be. On the clan theory of the names, the "Dinah" clan must have disappeared in Egypt, not being found in Numbers.<p>Ziphion (3A). Zephon in Numbers, perhaps giving its name to the Gadite city of Zaphon (<a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a>).<p>Ezbon (3A). Ozni (<a onClick="return mV(\'Num\',26,16);">Nu 26:16</a>). Possibly Ozni, on Ezbon\'s death, took his place, founding a tribal family, like Hezron and Hamul in Judah. Copyist\'s error unlikely.<p>Arodi (3A). In <a onClick="return mV(\'Num\',26,17);">Nu 26:17</a> Arod.<p>Ishvah (3B). Omitted in Numbers; perhaps died childless, or his descendants did not constitute a tribal family.<p>Beriah (3B). Also an Ephraimite (<a onClick="return mV(\'1Ch\',7,23);">1Ch 7:23</a>); a Benjaminite (<a onClick="return mV(\'1Ch\',8,13,16);">8:13,16</a>); a Levite (<a onClick="return mV(\'1Ch\',23,10,11);">23:10,11</a>). The repetition of the name indicates individuals rather than clans; but both the Asherite and Benjamite were heads of families.<p>Serah (3B), serach, "abundance," not the same name as that of Abraham\'s wife, sarah, "princess."<p>Heber (3B), chebher; in <a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>, a clan of Judah; <a onClick="return mV(\'1Ch\',8,17);">8:17</a>, of Benjamin. Not the same name as Eber, \'ebher (<a onClick="return mV(\'1Ch\',5,13);">5:13</a>; <a onClick="return mV(\'1Ch\',8,22);">8:22</a>; and <a onClick="return mV(\'Gen\',10,21);">Ge 10:21</a>).<p>The Sons of Benjamin.<p>The three lists, Genesis, Numbers, Chronicles, represent marked divergences, illustrating the corruption of perhaps all three texts. This list illustrates the genealogical method of counting all descendants as sons, though of different generations. It gives Benjamin ten "sons." <a onClick="return mV(\'Num\',26,\'38-40\');">Nu 26:38-40</a> gives five sons, Naaman and Ard being sons of Bela. The Septuagint of our passage gives only three sons, Bela, Becher, Ashbel. <a onClick="return mV(\'1Ch\',7,6);">1Ch 7:6</a> gives three sons, Bela, Becher, Jediael (Ashbel), and Shuppim and Huppim are Bela\'s grandsons. Becher is omitted in <a onClick="return mV(\'1Ch\',8,1);">8:1</a>, probably through a copyist\'s error, who took bekher we-\'ashbel, for "Becher and Ashbel," bekhoro \'ashbel, "his first-born, Ashbel." Jediael, both by older and newer scholars, is usually, but not with absolute certainty, identified with Ashbel. He may be a later chief. Another explanation is that <a onClick="return mV(\'1Ch\',7,6);">7:6</a> is part of a Zebulunite genealogy which has been transformed into a Benjamite list, Jediael being a remaining Zebulunite "pebble."<p>Naaman (4B) perhaps appears, by a transcriber\'s error in <a onClick="return mV(\'1Ch\',8,2);">1Ch 8:2</a>, as Nochach, Nochach for Na\'aman. If Nohah is not Naaman, and not (Keil) Shephupham, or a chief who succeeded him, he may have been one who was born after the migration and not needed to make up the seventy.<p>Gera (4B) in similar fashion may appear in <a onClick="return mV(\'1Ch\',8,2);">1Ch 8:2</a> as Rapha. If not, Rapha also may be one born after the migration, and did not found a family.<p>Ehi (4B) is Ahiram (<a onClick="return mV(\'Num\',26,38);">Nu 26:38</a>); Aharah (<a onClick="return mV(\'1Ch\',8,1);">1Ch 8:1</a>). Ehi probably arises from some copyist omitting the "ram."<p>Rosh (4B) is not in Numbers or Chronicles. He founded no family.<p>Muppim (4B) troubled the scribes greatly. In <a onClick="return mV(\'Num\',26,39);">Nu 26:39</a> he is Shephupham, though as compounded in his family name it is Shupham. In <a onClick="return mV(\'1Ch\',7,12);">1Ch 7:12</a> he is Shuppim, and it is not made clear whether he is a son, or other descendant, of Benjamin. He is apparently called, with Huppim, a son of Ir (Iri), son of Bela. In <a onClick="return mV(\'1Ch\',8,8);">8:8</a> he is catalogued as a son of Bela, as Shephuphan. In old Hebrew mem ("m") and shin ("sh") closely resemble each other. As the "sh" also appears in the gentilic names, it is probably the correct form. The corrupt state of the Chronicler\'s text especially is apparent, and also the fact that "son" may refer to any male descendant.<p>Huppim (4B) in <a onClick="return mV(\'Num\',26,39);">Nu 26:39</a> is Hupham; in <a onClick="return mV(\'1Ch\',8,5);">1Ch 8:5</a> is Huram.<p>Ard (4B) in <a onClick="return mV(\'1Ch\',8,3);">1Ch 8:3</a> is a son of Bela, Addar, the copyist having transposed "d", and "r", or mistaken one for the other. In Septuagint at <a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a> Ard is son of Gera, son of Bela.<p>Hushim (5A), the same in <a onClick="return mV(\'1Ch\',7,12);">1Ch 7:12</a>, is Shuham (<a onClick="return mV(\'Num\',26,42);">Nu 26:42</a>), by transposition of consonants. Another Hushim is a Benjaminite, son of Aher, but Aher may possibly be a corruption of the numeral "one," it being the Chronicler\'s frequent habit to add numerals. But see under <span class="noTag">Da 21:6</a>, (3), p. 1194.<p>Jahzeel (5B) is Jahziel in <a onClick="return mV(\'1Ch\',7,13);">1Ch 7:13</a>.<p>Guni (5B) in <a onClick="return mV(\'1Ch\',5,15);">1Ch 5:15</a> is also a Gadite name.<p>Shillem (5B), in <a onClick="return mV(\'1Ch\',7,13);">1Ch 7:13</a>, Shallum, the commoner form.<p>(11) <a onClick="return mV(\'Exd\',6,\'14-25\');">Exodus 6:14-25</a> (Assigned to P).—Partial List of Heads of Fathers\' Houses of Reuben, Simeon and Levi.<p>Reuben and Simeon are as in Genesis. Levi follows:<p>1. Gershon = Libni, Shimei.<p>2. Kohath.<p>A. Amram married Jochebed = Aaron, Moses; Aaron married Elisheba, daughter of Amminadab, sister of Nahshon = Nadab, Abihu, Eleazar, Ithamar; Eleazar married daughter of Putiel = Phinehas.<p>B. Izhar = Korah, Nepheg, Zichri; Korah, Assir, Elkanah, Abiasaph.<p>C. Hebron.<p>D. Uzziel = Mishael, Elzaphan, Sithri.<p>3. Merari = Mahli, Mushi.<p>The interest of the list is partly chronological, but chiefly to illustrate the genealogical place of Aaron and Moses. It probably exhibits the genealogical practice of omitting links, Amaram the father of Moses apparently being several links from Amram the son of Kohath. By Moses\' time the Amramites numbered some 2,000 males (<a onClick="return mV(\'Num\',3,27);">Nu 3:27</a>, etc.). Jochebed (2A) is an instance of Yah in compounds before the Exodus. Putiel (2A) has been considered a partly Egyptian name, Puti or Poti, "devoted to" -El (\'el); but probably Hebrew, "afflicted by God." Hebron is often identified with the city. It is also found in <a onClick="return mV(\'1Ch\',2,42,43);">1Ch 2:42-43</a>, as Judahite.<p>(12) <a onClick="return mV(\'Num\',1,\'5-54\');">Numbers 1:5-54</a>; <a onClick="return mV(\'Num\',2,\'3-29\');">2:3-29</a>; <a onClick="return mV(\'Num\',7,12);">7:12</a>ff; <a onClick="return mV(\'Num\',10,4);">10:4</a>ff.—The Heads of Houses Representing and Leading the Tribes (Assigned to P).<p>I. Reuben: Elizur, Son of Shedeur.<p>II. Simeon: Shelumiel, Son of Zurishaddai.<p>Shelumiel found in Judith.<p>III. Judah: Nahshon, Son of Amminadab.<p>Both found also in <a onClick="return mV(\'Exd\',6,23);">Ex 6:23</a>; <a onClick="return mV(\'Rth\',4,\'9-22\');">Ru 4:9-22</a>; <a onClick="return mV(\'1Ch\',2,\'10-12\');">1Ch 2:10-12</a>: <a onClick="return mV(\'Mat\',1,4);">Mt 1:4</a>; <a onClick="return mV(\'Luk\',3,32);">Lu 3:32</a> (genealogies of Christ).<p>IV. Issachar: Nethanel, Son of Zuar.<p>Nethanel, name of nine persons in Chronicles, Nehemiah, Ezra, same as Nathaniel.<p>V. Zebulun: Eliab, Son of Helon.<p>Other Eliabs, <a onClick="return mV(\'Num\',16,1);">Nu 16:1</a> (Reubenite); <a onClick="return mV(\'1Sa\',16,6);">1Sa 16:6</a> (Jesse\'s son, Judah).<p>VI. Joseph: Ephraim: Elishama, Son of Ammihud.<p>Other Elishamas: <a onClick="return mV(\'2Sa\',5,16);">2Sa 5:16</a> (son of David); <a onClick="return mV(\'Jer\',36,12);">Jer 36:12</a>; <a onClick="return mV(\'2Ch\',17,8);">2Ch 17:8</a>. Ammihuds: <a onClick="return mV(\'2Sa\',13,37);">2Sa 13:37</a> m; <a onClick="return mV(\'Num\',34,20,28);">Nu 34:20, 28</a>; <a onClick="return mV(\'1Ch\',9,4);">1Ch 9:4</a> (Judahite).<p>VII. Joseph: Manasseh: Gamaliel, Son of Pedahzur. New Testament Gamaliel.<p>VIII. Benjamin: Abidan, Son of Gideoni.<p>IX. Dan: Ahiezer, Son of Ammishaddai.<p>Another, <a onClick="return mV(\'1Ch\',12,3);">1Ch 12:3</a> (Benjamite).<p>X. Asher: Pagiel, Son of Ochran.<p>XI. Gad: Eliasaph, Son of Deuel.<p>Another, <a onClick="return mV(\'Num\',3,24);">Nu 3:24</a> (Levite).<p>XII. Naphtali: Ahira, Son of Enan.<p>Seven of these names, Amminadab, Ammihud, Abidan, Ahirah, Ahiezer, Eliab, Elishama, are concededly early. The 5 compounded in Shaddai or Zur are said to be of a type found only in P; 9 of the 24 are compounded in \'el, said to be a characteristic of late names. The \'El is postfixed more times, 5, than it is prefixed, 4; also a characteristic of late names. The proportion of compound names is also greater than in the older names; for these and similar reasons (Gray, ICC, "Numbers," 6; HPN, 191-211; The Expositor T, September,1897,173-90) it is concluded that though several of the names are, and more may be, early, the list is late. But see Ancient Hebrew Tradition, 74, 83ff, 85ff, 320. The contention rests largely on the late date of the Priestly Code (P) and of Chronicles. But while fashions in names changed in Hebrew life as elsewhere, in view of the persistence of things oriental, the dating of any particular names is somewhat precarious. They may be anticipations or late survivals of classes of names principally prevalent at the later or earlier date. Two of the names, otherwise unknown, have come to us through Ruth, and indicate a source now unknown to us, from which all the names could have been drawn. The fondness for names in \'el very likely indicates not a late date but an early one. \'El is the Divine name appearing in personal names previous to Moses, succeeded by Jah from Moses and Joshua on. The recurrence of \'el in the time of Ezra and later probably indicates the renewed interest in antiquity as well as the at once wider and narrower outlook brought about by the exile and return. Numerous south Arabian compounds both with the "ilu," "ili" (\'el), affixed and prefixed, occur in monuments about 1000 BC (AHT, 81ff).<p>(13) <a onClick="return mV(\'Num\',3,\'1-37\');">Numbers 3:1-37</a>.—The Family of Aaron, with the "Princes" of Levi.<p>Adds nothing to list in <a onClick="return mV(\'Exd\',16,\'16-25\');">Ex 16:16-25</a> except the Levite "princes."<p>I. Gershonites: Eliasaph, Son of Lael.<p>Also a Benjaminite Eliasaph (<a onClick="return mV(\'Num\',1,14);">Nu 1:14</a>).<p>II. Kohathites: Elizaphan, Son of Uzziel.<p>A Zebulunite Elizaphan (<a onClick="return mV(\'Num\',34,25);">Nu 34:25</a>). Five other Uzziels, Benjamite, Levite, Simeonite.<p>III. Merarites: Zuriel, Son of Abihail.<p>A Gadite Abihail (<a onClick="return mV(\'1Ch\',5,14);">1Ch 5:14</a>); also father of Queen Esther; also two women: wife of Abishur (<a onClick="return mV(\'1Ch\',2,29);">1Ch 2:29</a>); wife of Rehoboam (<a onClick="return mV(\'2Ch\',11,18);">2Ch 11:18</a>). Four \'el suffixes, two prefixes.<p>(14) <a onClick="return mV(\'Num\',13,\'4-16\');">Numbers 13:4-16</a>.—The Twelve Spies (P).<p>I. Reuben: Shammua, Son of Jaccur.<p>Other Shammuas (<a onClick="return mV(\'2Sa\',5,14);">2Sa 5:14</a>; <a onClick="return mV(\'1Ch\',14,4);">1Ch 14:4</a> (David\'s son); <a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a>, Levite; <a onClick="return mV(\'Neh\',12,18);">12:18</a>, priest). Seven other Zaccurs, Simeonites and Levites.<p>II. Simeon: Shaphat, Son of Hori.<p>Four other Shaphats, one Gadite, one Judahite; Elisha\'s father. Hori looks like the national name of the Horites; perhaps Hori or an ancestor had been adopted, through marriage or otherwise.<p>III. Judah: Caleb, Son of Jephunneh, the Kenizzite (<a onClick="return mV(\'Num\',32,12);">Numbers 32:12</a>; <a onClick="return mV(\'Jos\',14,6,14);">Joshua 14:6, 14</a>).<p>Another Caleb, Chelubai, son of Hezron, brother of Jerahmeel (<a onClick="return mV(\'1Ch\',2,9);">1Ch 2:9</a>). Either as an individual, or as a clan, Caleb seems to be originally of the pre-Israelitish stock in Canaan, absorbed into the tribe of Judah. Perhaps Jephunneh the Kenizzite married a woman of Caleb\'s (brother of Jerahmeel) household, and to their firstborn was given the name of Caleb, he becoming head of the house and prince of Judah. Another Jephunneh, an Asherite (<a onClick="return mV(\'1Ch\',7,38);">1Ch 7:38</a>).<p>IV. Issachar: Igal, Son of Joseph.<p>Other Igals: <a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a> (one of David\'s heroes); <a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>. Note the name of another tribe given to a man of Issachar—Joseph (<a onClick="return mV(\'Num\',13,7);">Nu 13:7</a>).<p>V. Ephraim: Hoshea, Son of Nun;<p>Hoshea, Joshua\'s early name. Others: <a onClick="return mV(\'1Ch\',27,20);">1Ch 27:20</a>; King Hoshea, <a onClick="return mV(\'2Ki\',15,30);">2Ki 15:30</a>; <a onClick="return mV(\'Neh\',10,23);">Ne 10:23</a>; Hebrew name of prophet Hosea.<p>VI. Benjamin: Palti, Son of Raphu. See 16 IV.<p>VII. Zebulun: Gaddiel, Son of Sodi.<p>VIII. Joseph-Manasseh: Gaddi, Son of Susi.<p>A Gaddi is in 1Macc 2:2.<p>IX. Dan: Ammiel, Son of Gemali.<p>Another Ammiel (<a onClick="return mV(\'2Sa\',9,4);">2Sa 9:4</a>).<p>X. Asher: Sethur, Son of Michael.<p>Nine other Michaels, Gadite, Levite, Issacharite, Benjamite, Manassite, Judahite.<p>XI. Naphtali: Nahbi, Son of Vophsi.<p>XII. Gad: Geuel, Son of Machi.<p>Four names in \'el. Nine ending with i; unusual number. The antiquity of the list cannot be readily questioned.<p>(15) <a onClick="return mV(\'Num\',26,\'5-62\');">Numbers 26:5-62</a> (P).—The Heads of Houses at the Second Census.<p>Related to <a onClick="return mV(\'Num\',1,\'1-\');">Nu 1</a> and <a onClick="return mV(\'Num\',2,\'1-\');">2</A>, and closely follows <a onClick="return mV(\'Gen\',46,\'1-\');">Ge 46</a>. The divergences in individual names have been noted under (10). This list adds to<p>I. Reuben:<p class="in15">1. Eliab, son of Pallu (also <a onClick="return mV(\'Num\',16,1,12;)">Nu 16:1, 12</a>).<p class="in15">2. Dathan, Abiram, Nemuel, sons of Eliab.<p>II. Manasseh:<p class="in15">1. Machir; also <a onClick="return mV(\'Gen\',50,23);">Ge 50:23</a>.<p class="in15">2. Gilead, son of Machir.<p class="in15">3. Iezer (abbreviation for Abiezer), Helek (not in Chronicles), Asriel, Shechem, Shemida, sons of Gilead.<p class="in15">4. Zelophehad, son of Hepher.<p class="in15">5. Mahlah, Noah, Hoglah, Milcah, Tirzah, daughters of Zelophehad.<p>III. Ephraim:<p class="in15">1. Shuthelah; also <a onClick="return mV(\'1Ch\',7,21);">1Ch 7:21</a>.<p class="in15">2. Becher.<p class="in15">3. Tahan (Tahath, <a onClick="return mV(\'1Ch\',7,20);">1Ch 7:20</a>).<p class="in15">4. Eran (Elead, <a onClick="return mV(\'1Ch\',7,21);">1Ch 7:21</a>).<p>The names of Manasseh\'s grandsons and great-grandsons are puzzling. Gilead is the district except in <a onClick="return mV(\'Jdg\',11,1,);">Jud 11:1-2</a>, where it is the father of Jephthah. Shechem sounds like the Ephraimite town. Hepher reminds of Gath-Hepher. In <a onClick="return mV(\'Jos\',17,1,2);">Jos 17:1-2</a> the six sons of Gilead are described as sons of Manasseh; loosely, it is probable; they are to be understood as descendants. Perhaps the references may be summarized: The family of Machir, the son of Manasseh, conquered Gilead, and took its name therefrom, either as a family or in the person of a son, Gilead, whose six sons founded clans named from or giving names to certain towns or districts.<p>The daughters of Zelophehad are noted for the interesting case at law they presented, claiming and receiving the inheritance of their father, which by Gray, ICC, "Numbers," is considered not historical but a fictitious instance, for the purpose of raising the question, these daughters being clans, and not persons.<p>Among the sons of Ephraim, Becher has perhaps been misplaced from verse <a onClick="return mV(\'1Ch\',7,38);">38</a>, and possibly displaces Bered (<a onClick="return mV(\'1Ch\',7,20);">1Ch 7:20</a>) between Shuthelah and Tahath. It is not found here in the Septuagint. It is possible that an alliance between the Becherites and the Ephraimites caused one portion of the former to be counted with Ephraim and another with Benjamin; or that at different times the clan was allied with the two different tribes. An error in transcription is more probable. Another Shuthelah is found later in the line (<a onClick="return mV(\'1Ch\',7,21);">1Ch 7:21</a>).<p>(16) <a onClick="return mV(\'Num\',34,\'16-28\');">Numbers 34:16-28</a>.—Tribal Representatives in the Allotment.<p>Reuben, Gad, half-Manasseh, omitted because their allotments had already been assigned east of Jordan; Levi, because receiving none. Changing to the order in (10):<p>I. Reuben: None.<p>II. Simeon: Shemuel, Son of Ammihud.<p>Shemuel is Hebrew of Samuel. Another Shemuel is of Issachar, <a onClick="return mV(\'1Ch\',7,2);">1Ch 7:2</a>. Samuel the prophet, a Levite.<p>III. Judah: Caleb, Son of Jephunneh.<p>IV. Issachar: Paltiel, Son of Azzan.<p>Another Paltiel, otherwise Palti, David\'s wife Michal\'s temporary husband (<a onClick="return mV(\'2Sa\',3,15);">2Sa 3:15</a>). Another Benjamite spy (<a onClick="return mV(\'Num\',13,9);">Nu 13:9</a>).<p>V. Zebulun: Elizaphan, Son of Parnach.<p>Another Elizaphan, Kohathite Levite (<a onClick="return mV(\'Exd\',6,18,22);">Ex 6:18, 22</a>).<p>VI. Gad: None.<p>VII. Asher: Ahihud, Son of Shelomi.<p>Another Ahihud, Benjamite (<a onClick="return mV(\'1Ch\',8,7);">1Ch 8:7</a>).<p>VIII. Joseph-Ephraim: Kemuel, Son of Shiftan.<p>Another Kemuel, son of Nahor, an Aramean chief (<a onClick="return mV(\'Gen\',22,21);">Ge 22:21</a>); also Levite of David\'s time (<a onClick="return mV(\'1Ch\',27,17);">1Ch 27:17</a>).<p>IX. Joseph-Manasseh: Hanniel, Son of Ephod.<p>Hanniel, also an Asherite (<a onClick="return mV(\'1Ch\',7,39);">1Ch 7:39</a>).<p>X. Benjamin: Elidad, Son of Chislon.<p>XI. Dan: Bukki, Son of Jogli.<p>Bukki, abbreviation of Bukkiah; another, in high-priestly line of Phinehas (<a onClick="return mV(\'1Ch\',6,5,51);">1Ch 6:5, 51</a>).<p>XII. Naphtali: Pedahel, Son of Ammihud.<p>A Simeonite Ammihud above.<p>Seven "El" names, only one "Jah."<p>(17) <a onClick="return mV(\'Rth\',4,20);">Ru 4:20</a>.—The Ancestry of David (Perez: Hezron: Ram: Amminadab: Nahshon: Salmon (Salmah): Boaz: Obed: Jesse: David).<p>Contained unchanged in <a onClick="return mV(\'1Ch\',2,\'9-15\');">1Ch 2:9-15</a>; also <a onClick="return mV(\'Mat\',1,\'1-6\');">Mt 1:1-6</a>; also <a onClick="return mV(\'Luk\',3,32);">Lu 3:32</a>. Some links have been omitted between Obed and Jesse. Salmon might be traced to the ancestor of the Bethlehemite (<a onClick="return mV(\'1Ch\',2,51,54);">1Ch 2:51, 54</a>), who is, however, of Caleb\'s line, not Ram\'s; but the lines may mingle.<p>(18) <a onClick="return mV(\'2Sa\',3,\'2-5\');">2Sa 3:2-5</a>; <a onClick="return mV(\'2Sa\',5,14,15);">5:14-15</a>. David\'s children (also in <a onClick="return mV(\'1Ch\',3,\'1-9\');">1Ch 3:1-9</a>; <a onClick="return mV(\'1Ch\',14,\'4-7\');">14:4-7</a>).<p>I. Born in Hebron: Amnon, Chileab, Absalom, Adonijah, Shephatiah, Ithream.<p>II. Born in Jerusalem: Shammua, Shobab, Nathan, Solomon, Ibhar, Elishua, Nepheg, Japhia, Elishama, Eliada, Eliphelet.<p>Four names in \'el, all prefixed. Two in "Jah." Chileab is Daniel in <a onClick="return mV(\'1Ch\',3,1);">1Ch 3:1</a>; uncertain which is right, but probably Daniel is a corruption. Chronicles adds Nogah to the Jerusalem sons, probably developed in transcription. <a onClick="return mV(\'1Ch\',3,\'6-8\');">1Ch 3:6-8</a> has two Eliphelets; <a onClick="return mV(\'1Ch\',14,5);">14:5</a> has Elpalet in place of the first; more probable. This gives David 6 sons in Hebron, and, if both Nogah and Elpalet be correct, 12 in Jerusalem. Eliada is Beeliada in <a onClick="return mV(\'1Ch\',14,7);">14:7</a>, perhaps the original form, a relic of the time before the Hebrews turned against the use of Baal, "lord," as applied to Yahweh; in which case Baaliada, "Lord knows," was changed to Eliada, "God knows." <a onClick="return mV(\'1Ch\',3,6);">3:6</a> reads Elishama for Elishua. Japhia is also the name of a king of Lachish in Joshua\'s time (<a onClick="return mV(\'Jos\',10,\'3-7\');">Jos 10:3-7</a>).<p>(19) <a onClick="return mV(\'2Sa\',23,\'1-\');">2 Samuel 23</a> (also <a onClick="return mV(\'1Ch\',11,\'11-41\');">1 Chronicles 11:11-41</a>).—David\'s Knights.<p>1. Josheb-bashebeth, the Tahchemonite.<p>In Chronicles it is Jashobeam, and should read Ishbaal, the writer\'s religious horror of Baal leading him to substitute the consonants of bosheth, "shame," as in Mephibosheth, Ishbosheth. Septuagint has Iesebada (Codex Vaticanus), Iessebadal, Isbaam (Codex Alexandrinus), in Chronicles, and Iebosthe (Codex Vaticanus), Iebosthai (Codex Alexandrinus) here. In Chronicles he is a Hachmonite, probably correct. "Adino the Heznite" is probably a corruption for "He wielded his spear" (Chronicles).<p>2. Eleazar, Son of Dodai, the Ahohite.<p>Dodo in Chronicles; 8 other Eleazars in the Old Testament. Another Dodo is father of Elhanan.<p>3. Shammah, Son of Agee, a Hararite.<p>Omitted by Chronicles. Three other Shammahs, one of them a knight of David. "Harari" may be "mountaineer," or "inhabitant of the village Harar."<p>4. Abishai, Son of Zeruiah, Brother of Joab.<p>Abshai (<a onClick="return mV(\'1Ch\',18,12);">1Ch 18:12</a> margin). Zeruiah perhaps David\'s half-sister (<a onClick="return mV(\'2Sa\',17,25);">2Sa 17:25</a>). Father never mentioned.<p>5. Benaiah, Son of Jehoaida of Kabzeel.<p>Eleven other Old Testament Benaiahs, one of them also a knight. This Benaiah succeeded Joab as commander-in-chief, 4 other Jehoiadas, one Benaiah\'s grandson, high in David\'s counsel, unless a scribe has inverted the order in <a onClick="return mV(\'1Ch\',27,34);">1Ch 27:34</a>, which should then read Benaiah, son of Jehoiada.<p>6. Asahel, Brother of Joab.<p>Three other Asahels.<p>7. Elhanan, Son of Dodo of Bethlehem.<p>Another Elhanan, slayer of the brother of Goliath (<a onClick="return mV(\'2Sa\',21,19);">2Sa 21:19</a>; <a onClick="return mV(\'1Ch\',20,5);">1Ch 20:5</a>). Perhaps the same.<p>8. Shammah the Harodite.<p>Chronicles, Shammoth. From Harod, near Gideon\'s well (<a onClick="return mV(\'Jdg\',7,1);">Jud 7:1</a>).<p>9. Elika the Harodite.<p>10. Helez the Paltite.<p>Paltite perhaps local or family name from Pelet, or Palti.<p>11. Ira, Son of Ikkesh the Tekoite.<p>Two others, one a knight. Tekoah, Judaite town, home of Amos, etc.<p>12. Abiezer the Anathothite.<p>One other, a Manassite (<a onClick="return mV(\'Jos\',17,2);">Jos 17:2</a>). Anathoth an hour northeast of Jerusalem, Jeremiah\'s town.<p>13. Mebunnai the Hushathite.<p>Should read, with Chronicles, Sibbecai.<p>14. Zalmon the Ahohite.<p>Zalmon, also name of mountain (<a onClick="return mV(\'Jdg\',9,48);">Jud 9:48</a>). Descendant of Ahoah, Benjamite of Bela\'s line. See <a onClick="return mV(\'1Ch\',8,14);">1Ch 8:14</a>.<p>15. Maharai the Netophathite.<p>From Netophah, town.<p>16. Heleb, Son of Baanah.<p><a onClick="return mV(\'1Ch\',11,30);">1Ch 11:30</a>, Heled. Three other Bannahs.<p>17. Ittai, Son of Ribai of Gibeah of the Children of Benjamin.<p><a onClick="return mV(\'1Ch\',11,31);">1Ch 11:31</a>, Ithai. An Ittai of Gath also followed David.<p>18. Benaiah a Pirathonite.<p>Pirathon, Amalekite town in Ephraimite territory.<p>19. Hiddai of the Brooks of Gnash.<p>Chronicles, Hurai ("d" for "r"). Ga\'ash, a Wady in Ephraim.<p>20. Abi-albon the Arbathite.<p>Chronicles, Abiel, perhaps corrupted from Abi-Baal; from Beth-arabah, Judah or Benjamin.<p>21. Azmaveth the Barhumite.<p>Three others, and a Judaite town, of the same name. Baharumite; Chronicles, Barhumite, a Benjamite town.<p>22. Eliahba the Shaalbonite.<p>Shaalbon, a Danite town.<p>23. The Sons of Jashen (better, Hashem).<p>Chronicles, "the sons of Hashem the Gizonite." "Sons of" looks like a scribal error, or interpolation, perhaps a repetition of "bni" in "Shaalboni" above.<p>24. Jonathan, Son of Shammah the Hararite.<p>Chronicles adds, "the son of Shagee the Hararite." Shagee should perhaps be Agee (<a onClick="return mV(\'2Sa\',23,11);">2Sa 23:11</a>); but Septuagint indicates Shammah here; both Samuel and Chronicles should read "J., son of Shammah the Ararite."<p>25. Ahiam, Son of Sharar the Ararite.<p>Chronicles, Sacar the Hararite. Sacar is supported by Septuagint.<p>26. Eliphelet, Son of Ahasvai, the Son of the Maacathite.<p>Chronicles has "Eliphal, son of Ur," and adds "Hepher the Mecherathite." Both texts are corrupt. Chronicles should perhaps read, "Eliphelet the son of..., the Maacathite, Eliam," etc.<p>27. Eliham, Son of Ahithophel the Gilonite.<p>Eliham, possibly father of Bathsheba. Ahithophel, David\'s counselor. Gilonite, native of Giloh.<p>27a. Ahijah the Pelonite (in Chronicles but Not Samuel).<p>Seven other Ahijahs. Pelonite uncertain, probably a corruption; perhaps inserted by a scribe who could not decipher his "copy," and means "such and such a one," as in <a onClick="return mV(\'1Sa\',21,2);">1Sa 21:2</a>.<p>28. Hezro (Hezrai) the Carmelite.<p>A scribe confused the Hebrew letters, waw ("w") and yod ("y"). Carmel, near Hebron.<p>29. Paarai the Arbite.<p>Chronicles, "Naarai, son of Esbai." Uncertain. Arb, a town of Judah.<p>30. Igal, Son of Nathan of Zobah.<p>Chronicles, Joel, brother of Nathan. Igal less common than Joel, hence, more likely to be corrupted; 2 other Igals; 12 other Joels; 5 other Nathans.<p>30a. Mibhar, Son of Hagri (Chronicles, not Samuel).<p>Text uncertain as between this and 31.<p>31. Bani the Gadite (Omitted in Chronicles).<p>Possibly the Gerarite.<p>32. Zelek the Ammonite.<p>Ammon east of Jordan and upper Jabbok.<p>33. Naharai the Beerothite, Armor-bearer to Joab, Son of Zeruiah.<p>Beeroth, Benjamite town.<p>34. Ira the Ithrite.<p>Ithrites, a family of Kiriath-jearim, Judah.<p>35. Gareb the Ithrite.<p>Gareb also a Hill West of Jerusalem.<p>36. Uriah the Hittite.<p>Bathsheba\'s husband; 3 others. From some Hittite town surrounded by Israel at the Conquest.<p>37. Zabad, Son of Ahlai (Perhaps Dropped out of Samuel), Chronicles.<p>Chronicles adds 13 others. The filling of vacancies makes the number 37 instead of 30. Two names, perhaps, in ba\'al, 5 in yah, 7 in \'el. As far as guessable, 5 from Judah, 3 from Benjamin, 2 from Ephraim, 1 from Dan, 1 from Issachar, 1 Ammonite, 1 Hittite, 2 (or 4) Hararites, 2 Harodites, 2 Ithrites.<p>(20) <a onClick="return mV(\'1Ki\',4,\'1-19\');">1 Kings 4:1-19</a>.—Solomon\'s "Princes" and Commissaries.<p>Eleven princes, 12 officers. No mention of their tribal connections; assigned only partly by tribal bounds. 7 yah names, 1 \'el; 5 of the officers are prefixed ben as if their own names had dropped out.<p>(21) <span class="noTag">1 Chronicles 1-9</span>.—Genealogies, with Geographical and Historical Notices.<p>By far the largest body of genealogical material, illustrating most fully the problems and difficulties. The estimate of its value depends on the estimate of the Chronicler\'s date, purpose, equipment, ethical and mental qualities. He uses freely all previous Old Testament matter, and must have had in hand family or tribal songs, traditions; genealogical registers, as mentioned in <a onClick="return mV(\'Ezr\',2,\'61-69\');">Ezr 2:61-69</a>; <a onClick="return mV(\'Neh\',7,\'63-65\');">Ne 7:63-65</a>; local traditions; official genealogies, such as "the genealogies reckoned in the days of Jotham king of Judah, and...Jeroboam king of Israel" (<a onClick="return mV(\'1Ch\',5,17);">1Ch 5:17</a>); prophetic, historical and other matter now lost, "the words of Shemaiah...after the manner of genealogies" (<a onClick="return mV(\'2Ch\',12,15);">2Ch 12:15</a>), and elsewhere. The results of David\'s census seem to have been in his hands (<a onClick="return mV(\'1Ch\',27,24);">1Ch 27:24</a>).Curtis (ICC, "Chronicles," 528) suggests that his purpose was partly to provide genealogies for contemporary families, implying an accommodating insertion of names "after the manner of genealogies" today. Two main purposes, however, seem clear: the first historical, to give the historical and personal basis and setting to elucidate the Chronicler\'s main thesis, that national prosperity depended upon, and national character was measured by, fidelity to the law of God, especially as it centered upon the worship and services of Yahweh\'s house. To do this it was necessary to trace the descent of the prominent characters, families, tribes. Hence, the space given to Judah, Levi, Benjamin, the main line of fidelity, the survival of the fittest. The other purpose was to conserve purity of blood in the restored nation, to include all who were entitled and to exclude all who were not. We may also credit him with such regard for his material that he preserved it all (with certain comprehensible exceptions), even though extremely fragmentary here and there. His materials are of many degrees of age. It is thought by some that the antiquity is indicated by the last stage in the descent, the genealogy of Sheshun, e.g. ending with Hezekiah\'s time; Heman\'s and Asaph\'s (<a onClick="return mV(\'1Ch\',6,\'1-\');">1Ch 6</a>; <a onClick="return mV(\'1Ch\',33,\'1-\');">33</a>) in David\'s. Name-study and historico-literary criticism seeks still other marks of relative age. The text has suffered much, as lists of names will, from scribal errors. Details of his method will be pointed out in the following analysis. As in this whole article, space forbids exhaustive treatment of the endless textual, critical, historical questions arising. A few illustrative cases only are given. ``31';
isbe[3731]='Genealogy, 8 Part 2`I. Primeval Genealogies (<a onClick="return mV(\'1Ch\',1,\'1-54\');">1 Chronicles 1:1-54</a>).<P>To show Israel\'s place among the nations; follows Genesis closely, omitting only the Cainites; boldly, skillfully compressed, as if the omitted facts were well known.<P class="in15">(1) The ten antediluvian Patriarchs, and Noah\'s three sons (<a onClick="return mV(\'1Ch\',1,\'1-4\');">1Ch 1:1-4</a>).<P class="in30">Follows <a onClick="return mV(\'Gen\',4,5);">Ge 4:5</a>, giving only the names.<P class="in15">(2) Japheth\'s descendants (<a onClick="return mV(\'1Ch\',1,\'5-7\');">1Ch 1:5-7</a>) (<a onClick="return mV(\'Gen\',10,\'2-4\');">Ge 10:2-4</a> unchanged).<P class="in15">(3) The Hamites (<a onClick="return mV(\'1Ch\',1,\'8-16\');">1Ch 1:8-16</a>) (<a onClick="return mV(\'Gen\',10,\'6-8\'.\'13-18\');">Ge 10:6-8, 13-18a</a> unchanged).<P class="in15">(4) The Semites (<a onClick="return mV(\'1Ch\',1,\'17-23\');">1Ch 1:17-23</a>) (<a onClick="return mV(\'Gen\',10,\'22-29\');">Ge 10:22-29</a>; only scribal changes).<P class="in15">(5) Abram\'s descent (<a onClick="return mV(\'1Ch\',1,\'24-27\');">1Ch 1:24-27</a>) (<a onClick="return mV(\'Gen\',11,\'10-26\');">Ge 11:10-26</a> abridged, giving only the Patriarchs).<P class="in15">(6) The sons of Abraham, Keturah, Isaac (<a onClick="return mV(\'1Ch\',1,\'28-34\');">1Ch 1:28-34</a>).<P class="in15"><a onClick="return mV(\'Gen\',25,\'1-4\',\'13-16\',25,26);">Ge 25:1-4, 13-16, 25-26</a>; <a onClick="return mV(\'Gen\',32,28);">32:28</a>. Reverses the order of Ishmael\'s and Keturah\'s descendants.<P class="in15">(7) Sons of Esau (<a onClick="return mV(\'1Ch\',1,\'35-52\');">1Ch 1:35-52</a>) (<a onClick="return mV(\'Gen\',36,\'4-10\');">Ge 36:4-10</a>).<P class="in15">(8) Kings and sheikhs of Edom (<a onClick="return mV(\'1Ch\',1,43,54);">1Ch 1:43, 54</a>) (<a onClick="return mV(\'Gen\',36,\'31-43\');">Ge 36:31-43</a>). Scribal changes.<P>II. Descendants of Jacob (<span class="noTag">1 Chronicles 2-9</span>).<P>The tribes arranged chiefly geographically. Judah, as the royal line, is given 100 verses, Levi, as the priestly, 81 verses, Benjamin 50, the other ten 56, Dan and Zebulun neglected. His purpose practically confines him to the first three; and these were also the best preserved.<P>(1) Sons of Israel.<P>Follows substantially the order in <a onClick="return mV(\'Gen\',35,\'1-\');">Ge 35</a>. Dan is placed before Rachel\'s sons. 17 different orders of the tribes in Bible lists.<P>(2) Genealogies of Judah (<a onClick="return mV(\'1Ch\',2,3);">1Ch 2:3-4:23</a>).<P>(a) Descent of Jesse\'s sons from Judah (<a onClick="return mV(\'1Ch\',2,\'3-17\');">1Ch 2:3-17</a>).<P>Largely gleaned from the historical books. The sons of Zerah (<a onClick="return mV(\'1Ch\',2,\'6-8\');">1Ch 2:6-8</a>) are not found elsewhere. Chelubai is Caleb. Only 7 sons of Jesse are mentioned. Abishai, Joab, Asahel are always designated by their mother\'s name, Zeruiah.<P>(b) Genealogy of Bezalel (<a onClick="return mV(\'1Ch\',2,\'18-20\');">1Ch 2:18-20</a>).<P>The artificer of the tabernacle, hence, greatly interests the Chronicler.<P>(c) Other descendants of Hezron (<a onClick="return mV(\'1Ch\',2,\'21-24\');">1Ch 2:21-24</a>).<P>(d) The Jerahmeelites (<a onClick="return mV(\'1Ch\',2,\'25-41\');">1Ch 2:25-41</a>).<P>Concededly a very old list of this important clan not found elsewhere. Sheshan (<a onClick="return mV(\'1Ch\',2,35);">1Ch 2:35</a>), who married his daughter to Jarha, an Egyptian servant, illustrates the introduction of a foreigner into the nation and tribe.<P>(e) The Calebites (<a onClick="return mV(\'1Ch\',2,\'41-55\');">1Ch 2:41-55</a>).<P>Not elsewhere. The names are largely geographical. A subdivision of the Hezronites. Not Caleb the son of Jephunneh.<P>(f) David\'s descendants (<a onClick="return mV(\'1Ch\',3,\'1-24\');">1Ch 3:1-24</a>).<P>Gives first the sons and their birthplaces, then the kings to Jeconiah and Zedekiah, then the Davidic line from Jeconiah to Zerubbabel, then the grandsons of Zerubbabel and the descendants of Shecaniah. Two other lists of David\'s sons (<a onClick="return mV(\'2Sa\',5,\'14-16\');">2Sa 5:14-16</a>; <a onClick="return mV(\'1Ch\',14,\'4-17\');">1Ch 14:4-17</a>). Eliphelet and Nogah here are thought to have developed in transcription, with some other changes. Johanan\'s name (son of Josiah) is given among the kings, though he never reigned. Zedekiah is called son (instead of brother) of Jehoiachin, perhaps a scribal error. "Jah" names extremely numerous. Names of Zerubbabel\'s sons are highly symbolic: Meshullam, "Recompensed"; Hananiah, "Jah is gracious"; Shelomith, "Peace"; Hashubah, "Consideration"; Ohel, "Tent," i.e. "Dwelling of Yahweh"; Berechiah, "Jah blesses"; Hasadiah, "Jah is kind"; Jushab-hesed, "Loving-kindness returns"; characteristic of the Exile.<P><a onClick="return mV(\'1Ch\',3,\'19-24\');">1 Chronicles 3:19-24</a>, beginning with Zerubbabel\'s descendants, are obscure, and a battleground of criticism on account of their bearing on the date of Chronicles. There are three possible interpretations:<P>(1) Following the Hebrew, Zerubbabel\'s descendants stop with Pelatiah and Jeshaiah, his grandsons. Then follow three unclassified sets of "sons." No connection is shown between Jeshaiah and these. Then follows Shecaniah\'s line with four generations. There are several other instances of unrelated names thus being thrown in. This gives two generations after Zerubbabel.<P>(2) Still following the Hebrew, assume that Shecaniah after Obadiah is in Zerubbabel\'s line. This gives six generations after Zerubbabel.<P>(3) Following Septuagint, Syriac, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) (but the two latter are of very small critical weight), read in verse <a onClick="return mV(\'1Ch\',3,21);">21</A>, "Rephaiah his son, Arnan his son," etc.—a very possible change: eleven generations after Zerubbabel.<P>According to (3), Chronicles was written at least 253 years (allowing 23 years to a generation; more probable than 30 or 40) after Zerubbabel (515), hence, after 262 BC; (2) makes it after 373; (1) makes it 459, during Ezra\'s life. The book\'s last recorded event is Cyrus\' decree (538), which indicates the earliest date. The New Testament casts no light here, none of these names appearing in the genealogies in Matthew or Luke. If Septuagint is correct, Keil suggests that it is a later insertion, a critical device too frequently used to nullify inconvenient facts. The passage itself justifies the statement that "there is no shadow of proof that the families enumerated in <a onClick="return mV(\'1Ch\',3,21);">1Ch 3:21</a>, latter part, were descendants of Hananiah the son of Zerubbabel." Against this, and the other indications, the admittedly faulty Septuagint furnishes an insufficient basis for so far-reaching a conclusion.<P>(g) Fragmentary genealogies of families of Judah (<a onClick="return mV(\'1Ch\',4,\'1-23\');">1Ch 4:1-23</a>).<P>Contains<P>(1) "sons" of Judah, four or five successive generations;<P>(2) sons of Shobal and Hur;<P>(3) sons of Chelub;<P>(4) sons of Caleb, son of Jephunneh;<P>(5) sons of Jehaleel;<P>(6) sons of Ezra (of course, not the priest-scribe of the return);<P>(7) sons of "Bethiah the daughter of Pharaoh whom Mered took";<P>(8) sons of Shimon;<P>(9) sons of Ishi;<P>(10) sons of Shelah.<P>It is hard to trace the law of association here; which fact has its bearing on the discussion under (f) above. Chelub may be another Caleb. <a onClick="return mV(\'1Ch\',4,\'9-11\');">1Ch 4:9-11</a> give an interesting name-study, where Jabez by prayer transforms into prosperity the omen of his sorrowful name: "Because I bare him with sorrow," a characteristic note. <a onClick="return mV(\'1Ch\',4,\'21-23\');">1Ch 4:21-23</a> speak of the linenworkers and potters. Similar, even identical, names have been found on pot-handles-in Southern Palestine.<p>(3) Genealogy of Simeon (<a onClick="return mV(\'1Ch\',4,\'24-43\');">4:24-43</A>).<P>(a) Simeon\'s sons. Genealogy of Shimei. After <a onClick="return mV(\'Gen\',46,10);">Ge 46:10</a>; <a onClick="return mV(\'Exd\',6,15);">Ex 6:15</a>; <a onClick="return mV(\'Num\',26,\'12-14\');">Nu 26:12-14</a>.<P>(b) Dwelling-places of Simeon. After <a onClick="return mV(\'Jos\',19,\'2-8\');">Jos 19:2-8</a>.<P>(c) Princes and conquests (<a onClick="return mV(\'1Ch\',4,\'34-43\');">1Ch 4:34-43</a>).<P>Source unknown, but considered old. Gray, however, thinks the names of late formation. Meshobab, Jamlech, Joshah, Amaziah, Joel, Jehu, Josibiah, Seraiah, Asiel, Elioenai, Jaakobah, Jeshohaiah, Asaiah, Adiel, Jesimiel, Benaiah, Ziza, Shiphi, Allon, Jedaiah, Shimri, Shemaiah, Ishi, Pelatiah, Neariah, Rephaiah, Uzziel; many undoubtedly old ones; 11 in yah, 5 in \'el. Eliothal sounds post-exilic. The section mentions several exploits of Simeon.<P>(4) East-Jordanic tribes (<a onClick="return mV(\'1Ch\',5,\'1-24\');">1Ch 5:1-24</a>).<P>As in Simeon above, the usual order, deviated from in instances, is<P>(1) Introductory: Sons and immediate descendants;<P>(2) Territory;<P>(3) Princes or Chiefs;<P>(4) Incidents.<P>(a) Reuben (<a onClick="return mV(\'1Ch\',5,\'1-10\');">1Ch 5:1-10</a>).<P>Partly follows Genesis, Numbers; but only as to first generation. Very fragmentary and connections obscure.<P>(b) Gad (<a onClick="return mV(\'1Ch\',5,\'11-17\');">1Ch 5:11-17</a>).<P>First generation omitted. Chronicler draws from genealogies "in the days of" Jotham and Jeroboam.<P>(c) Half-Manasseh (<a onClick="return mV(\'1Ch\',5,23,24);">1Ch 5:23-24</a>).<P>The whole tribe is treated of (<a onClick="return mV(\'1Ch\',7,14);">1Ch 7:14</a>). Here only the seats and heads of houses.<P>(5) Levi (<a onClick="return mV(\'1Ch\',6,\'1-81\');">1Ch 6:1-81</a>).<P>Illustrates more fully the Chronicler\'s attitude and methods.<P>(a) High priests from Levi to Jehozadak (the Exile) (<a onClick="return mV(\'1Ch\',6,\'1-15\');">1Ch 6:1-15</a>).<P>(i) Levi\'s sons: Gershon, Kohath, Merari (<a onClick="return mV(\'Gen\',46,11);">Ge 46:11</a>; <a onClick="return mV(\'Exd\',6,16);">Ex 6:16</a>).<P>(ii) Kohath\'s sons: Amram, Izhar, Hebron, Uzziel (<a onClick="return mV(\'Exd\',6,18);">Ex 6:18</a>).<P>(iii) Amram\'s "sons": Aaron, Moses, Miriam (<a onClick="return mV(\'Exd\',6,20,23);">Ex 6:20, 23</a> (except Miriam); <a onClick="return mV(\'Num\',26,59);">Nu 26:59</a>f).<P>(iv) High priests from Eleazar. Also (partly) Ezra (<a onClick="return mV(\'1Ch\',7,\'1-5\');">7:1-5</a>):<P>1. Eleazar<P>2. Phinehas<P>3. Abishua<P>4. Bukki<P>5. Uzzi<P>6. Zerahiah<P>7. Meraioth<P>8. Amariah<P>9. Ahitub<P>10. Zadok<P>11. Ahimaaz<P>12. Azariah<P>13. Johnnan<P>14. Azariah<P>15. Amariah<P>16. Ahitub<P>17. Zadok<P>18. Shallum<P>19. Hilkiah<P>20. Azariah<P>21. Seraiah<P>22. Jehozadak<P>Noteworthy omissions: Eli\'s house, Eli, Phinehas, Ahitub, Ahimelech, Abiathar, because set aside for Zadok\'s in Solomon\'s time; Bukki to Zadok being their contemporaries; but the list also omits Amariah in the reign of Jehoshaphat (perhaps), Jehoiada, Joash\'s "power behind the throne," Urijah in Ahaz\' day, Azariah in Hezekiah\'s. It has been thought that this was done in the interests of a chronological scheme of the Chronicler, making 23 generations of 40 years from the Exodus to the Captivity, or 920 years. The Hebrew generation, however, was as likely to be 30 as 40 years, and as a matter of fact was nearer 20. The apparent number of generations from Aaron to the Captivity, adding the data from the historical books, <span class="noTag">is</span> 29, making a generation about 24 years. The reasons for the omission here, as for many others, are not apparent. Outside of Chronicles and Ezra we know nothing of Abishua, Bukki, Uzzi, Zerahiah, Meraioth, the first Amaziah, Johanan, Amariah, Ahitub, Zadok 2, Shallum, Azariah 3. The list touches historical notices in Aaron, Eleazar, Phinehas, Zadok, Ahimaaz, Azariah 2, contemporary of Solomon, perhaps Amariah, contemporary of Jehoshaphat, Azariah, contemporary of Uzziah, Hilkiah, contemporary of Joshua, Seraiah slain by the Chaldeans, and Jehozadak. The recurrence of similar names in close succession is characteristically Jewish (but compare names of popes and kings). It is seen in the list beginning with Jehozadak: Joshua, Joiakim, Eliashib, Joiada, Jonathan, Jaddua, Onias, Simon, Eleazar, Manasseh, Onias, Simon, Onias, Joshua. Also about Christ\'s time: Eleazar, Jesus, Annas, Ismael, Eleazar, Simon, Joseph, Jonathan, Theophilus, Simon, although these latter do not succeed in a genealogical line.<P>(b) The three Levitical clans (<a onClick="return mV(\'1Ch\',6,\'16-19\');">1Ch 6:16-19</a>). After <a onClick="return mV(\'Exd\',6,\'17-19\');">Ex 6:17-19</a>; <a onClick="return mV(\'Num\',3,\'17-20\');">Nu 3:17-20</a>.<P>(c) Lineal descendants of Gershom: seven, <a onClick="return mV(\'1Ch\',6,20,21);">1Ch 6:20-21</a>; thirteen, <a onClick="return mV(\'1Ch\',6,\'39-43\');">1Ch 6:39-43</a>. See also <a onClick="return mV(\'1Ch\',23,7);">1Ch 23:7</a>.<P>The two lists (<a onClick="return mV(\'1Ch\',6,20,21);">1Ch 6:20-21</a> and <a onClick="return mV(\'1Ch\',6,\'39-43\');">6:39-43</a>) are clearly the same:<P>Gershom Gershom<P>Libni Jahath<P>Zimmah Zimmah<P>Joah Ethan<P>Iddo Adaiah<P>Zerah Zerah<P>Jeatherai Ethni<P>Malchiah<P>Baaseiah<P>Michael<P>Shimea<P>Berachiah<P>Asaph<P>Jahath, Zimmah, Zerah are in both. By slight changes Joah, yow\'ah, is Ethan, \'ethan; Iddo, \'idow, is \'idaiah, Adaiah; Jeatherai, is Ethni. Shimei may have dropped from one and Libni from the other. Jahath and Shimei have been transposed. In <a onClick="return mV(\'1Ch\',23,7);">1Ch 23:7</a> Libni is Ladan.<P>(d) Pedigrees of Samuel (<a onClick="return mV(\'1Ch\',6,27,28,33,34,35);">1Ch 6:27-28, 33-35</a>). See also <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>; <a onClick="return mV(\'1Sa\',8,2);">8:2</a>.<P>We have three pedigrees of Samuel, all suffering in transcription:<P>(1) <a onClick="return mV(\'1Ch\',6,\'22-24\',28);">1Ch 6:22-24, 28</a><P>(2) <a onClick="return mV(\'1Ch\',6,\'33-38\');">1Ch 6:33-38</a><P>(3) <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>; <a onClick="return mV(\'1Sa\',8,2);">8:2</a><P>Kohath Kohath<P>Amminadab Izhar<P>Korah Korah<P>Assir, Elkanah,<P>Ebiasaph Ebiasaph<P>Assir Assir<P>Tahath Tahath<P>Uriel Zephaniah<P>Uzziah Azariah<P>Shaul Joel<P>Elkanah Elkanah<P>Amasai Amasai<P>Ahimoth Mahath<p>Elkanah Elkanah<P>Zophai Zuph Zuph<P>Nahath Thoah Thohu<P>Eliab Eliel Elihu<P>Jeroham Jeroham Jeroham<P>Elkanah Elkanah Elkanah<P>Samuel Samuel Samuel<P>Joe (Vashni) and Joel Joel<P>Abijah<P>Heman<P>The text is obscure. Septuagint reads (<a onClick="return mV(\'1Ch\',6,26);">1Ch 6:26</a>), "Elkanah his (Ahimoth\'s) son, Zophai his son." It has Izhar in (1) for Amminadab, as has Hebrew in <a onClick="return mV(\'Exd\',6,18,21);">Ex 6:18, 21</a>. Uriel for Zephaniah is unexplainable. Uzziah and Azariah are exchangeable. The other variations are transcriptional. Joel has dropped out of the first list, and the following words, now in <a onClick="return mV(\'1Sa\',8,2);">1Sa 8:2</a>, and the Syriac here: "and the second," v-sh-n, have been read "Vashni." <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a> calls Zuph an Ephraimite. The Chronicler\'s claiming him (and Samuel) seems to some another instance of Levitical bias and acquisitiveness. The genealogy is also found "clearly artificial," Zuph being a territory, and Toah, Tohu, Nahath, a family. But "Ephraimite" is either merely local, the family having been assigned residence there (<a onClick="return mV(\'Jos\',21,5);">Jos 21:5</a>; <a onClick="return mV(\'1Ch\',6,66);">1Ch 6:66</a>), or (Hengstenberg, Ewald) because, being thus assigned, it has been incorporated into the tribe. Hannah\'s vow to devote him to Yahweh is said (Curtis, Moore, ICC in the place cited.) to show that he was no Levite, in which case no vow was necessary. But Elkanah\'s Ephraimite citizenship may have obscured in Hannah\'s mind the Levitical descent. In the disorganized times of the Judges an Ephraimite woman may well have been ignorant of, or indifferent to, the Levitical regulation, She, or the author of <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>, must also have forgotten that every male that openeth the womb from any tribe is equally God\'s property. A mother\'s vow to devote her firstborn son to Yahweh, beyond recall or redemption, and to seal his consecration by the significant symbol of the unshaved head, is not hard to imagine in either a Levite or an Ephramite, and equally "unnecessary" in either case. Heman, ending the pedigree (2), was David\'s contemporary.<P>(e) Pedigree of Asaiah the Merarite (<a onClick="return mV(\'1Ch\',6,29,30);">1Ch 6:29-30</a>).<P>Merari: Mahli: Libni; Shimei: Uzzah: Shimea: Haggiah: Asaiah. Hard to adjust or place. Libni and Shimei are elsewhere Gershonites, but the same name is frequently found in different tribes or clans. Information below Mahli is entirely wanting.<P>(f) Descent of David\'s three singers, Heman, Asaph, Ethan (<a onClick="return mV(\'1Ch\',6,\'33-47\');">1Ch 6:33-47</a>).<P>(i) Heman has been given under (d); 20 links.<P>(ii) Asaph: Getshorn: Jahath: Shimei: Zimmah: Ethan: Adaiah: Zerah: Ethni (Jeatherai): Malchijah: Baaseiah: Michael: Shimea: Berechiah: Asaph; 15 links.<P>(iii) Ethan: Merari: Mushi: Mahli: Shemet: Bani: Amzi: Hilkiah: Amaziah: Hashabiah: Malluch: Abdi: Kishi: Ethan; 12 links.<P>Hardly anywhere is the Chronicler\'s good faith more questioned than in these lists. Finding in his day the three guilds of singers claiming descent from David\'s three, and through these from Levi, he fits them out with pedigrees, borrowing names from <a onClick="return mV(\'1Ch\',6,\'16-20\');">1Ch 6:16-20</a>, and filling out with his favorite names, or those of his own invention, or from current lists. To make Asaph contemporary with David, he adds Malchijah, Maaseiah, Michael, Shimei, Berechiah. He helps out Ethan with Bani, Amzi, Hilkiah, Amaziah, Hashabiah, Malluch, Abdi, Kishi. The names added are very frequent in Chronicles and Ezra, not frequent in older writings. Aside from the general objection to this thoroughgoing discredit of Chronicles, and theory of religious development in Israel on which it is based, it may be said:<P>(1) The Chronicler\'s failure to give his three families nearly the same number of links is suspicious, but if he took an old list, as it came to him, it is natural.<P>(2) The fact that these added names occur many more times in Chronicles, Ezra, Nehemiah indicates simply that Levitical names occur frequently in a writer and among a people whose interests are Levitical. No one would look among the Roundheads for either classical or aristocratic names.<P>(3) In no tribe would such names be more likely to recur, naturally or purposely, than in the Levitical.<P>(4) The Chronicler has inserted among his new names 6 in yah and only 1 in \'el, and that far down the list.<P>(5) Of the "added" names Malchijah occurs in <a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a>; Masseiah, in <a onClick="return mV(\'Jer\',29,21,25);">29:21,25</A>; <a onClick="return mV(\'Jer\',35,4);">35:4</a>, in every case priestly or Levitical. Michael occurs in <a onClick="return mV(\'Num\',13,13);">Nu 13:13</a>. Berechiah is the name of the prophet Zechariah\'s father. Hilkiah is the name of Joshua\'s high priest. Amaziah reigned 800 BC. Bani is mentioned in <a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a> (though this is thought to be copied from Chronicles). Shimea is concededly early. Of the 13 "added names" 8 are found elsewhere. Of the others, Amzi, Abdi, Kishi (Kish, Kushaiah) have an early look. Malluch might be late. If Hashabiah is late the author has scattered it well through the history, 1 several generations before David, 3 in David\'s time, 1 in Josiah\'s, 1 in Ezra\'s, 3 in Nehemiah\'s, in every case a Levite.<P>(7) While these "added" names occur more times in Chronicles, Ezra, Nehemiah, than elsewhere, and 5 of
