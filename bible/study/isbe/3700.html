ed as such a hero as Jacob or Israel is, and in exceptional cases also Isaac and Joseph (<a onClick="return mV(\'Amo\',7,9,16);">Am 7:9, 16</a>; <a onClick="return mV(\'Amo\',5,6,15);">5:6, 15</a>). It is not correct to place genealogies like those in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10:1</a>ff; <a onClick="return mV(\'Gen\',25,1);">25:1</a>ff, <a onClick="return mV(\'Gen\',25,13);">13</a>ff on a level with the stories concerning the patriarchs. In the latter case we are dealing with individualities of pronounced character, who in the experiences of their lives represent great fundamental principles and laws in the kingdom of God—Abraham, the principle of the grace of God, to which faith on the part of man is the counterpart; Jacob, the principle of Divine election; Joseph, that of the providential guidance of life; while Isaac, it is true, when he becomes prominent in the history, evinces no independent character, but merely follows in the footsteps of Abraham (compare <a onClick="return mV(\'Gen\',26,1,3,15,18,24);">26:1ff, 3ff, 15, 18, 24ff</a>), but is in this very imitative life pictured in an excellent way.<P>(d) Different Explanations Combined:<P>If we combine two or more of these different and unsatisfactory attempts at an explanation of the history of the patriarchs, we must become all the more distrustful, because the outcome of this combination is such an inharmonious scheme.<P>(3) Positive Reasons for the Historical Character of Genesis.<P>The individuality of the patriarchs as well as their significance in the entire development of the history of the kingdom of God, and their different missions individually; further, the truthful portraiture of their method of living, which had not yet reached the stage of permanent settlement; and, finally, the fact that the prophets, the New Testament and above all Jesus Himself regard their historical character as something self-evident (see (1b) above), make the conviction a certainty, that we must insist upon their being historical personages; especially, too, because the attacks on this view (see (1) above), as also the efforts to explain these narratives on other grounds (see (2) above), must be pronounced to be failures. To this we must add the following: If Moses were the founder of the religion of Israel, it would scarcely have been possible that a theory would have been invented and have found acceptance that robs Moses of this honor by the invention of the story of the patriarchs. Rather the opposite would be the case. Besides, this older revelation of God is absolutely necessary in order to make Moses\' work and success intelligible and possible. For he himself expressly declares that his work is based on the promises of God given to the fathers. Through this connection with the older revelation it was possible for Moses to win the attention and the confidence of the people (compare <a onClick="return mV(\'Exd\',2,24);">Ex 2:24</a>; <a onClick="return mV(\'Exd\',3,6,13);">3:6, 13</a>ff; <a onClick="return mV(\'Exd\',4,5);">4:5</a>; <a onClick="return mV(\'Exd\',6,3,8);">6:3,8</a>; <a onClick="return mV(\'Exd\',15,2);">15:2</a>; <a onClick="return mV(\'Exd\',32,13);">32:13</a>f; <a onClick="return mV(\'Exd\',33,1);">33:1</a>; compare also my book, Die Entwicklung der alttestamentlichen Gottesidee in vorexilischer Zeit, 117ff; and Strack, Genesis, 93ff).<P>Individuality of Patriarchs:<P>In so far as the history of the patriarchs contains miracles, they are in perfect harmony with the entire character of sacred history (compare <a href="study/isbe/search.html?string=EXODUS">EXODUS, III, 2</a>); and as far as the number of miracles is concerned, there are in fact fewer reported in the days of the patriarchs than in the times of Moses.. On the view that the history of the patriarchs, which is earlier than the period of Moses, was an invention and not history, the opposite condition of affairs could be expected. Leaving out of consideration the unsatisfactory instances cited under V, 2, below, there is to be found also in the Book of Genesis absolutely no reference to indicate events of a later period, which would throw a doubt on the historical character of what is here reported. In every direction (e.g. in connection with theophanies and the cult worship), there is a noticeable progress to be seen in going from Genesis to Exodus, a fact which again is an important argument for the historical reliability of the contents of both books. Finally, we add the following. Ch <a onClick="return mV(\'Gen\',14,\'1-\');">14</a> (the Chedorlaomer and the Melchizedek episodes) has through recent archaeological researches been brilliantly confirmed as far as the names are concerned, as also in reference to the political conditions of the times, the general historical situation and the chronology. In the same way the religious conditions of Egypt, as described in <a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12</a>, and in the entire history of Joseph, are so faithfully pictured that it is absolutely impossible to regard these accounts as the work of imagination. These accounts must be the outcome, on the part of the author, of a personal knowledge of these things and conditions, as they are absolutely correct, even to the details of the coloring.<P>2. The Primitive History of <a onClick="return mV(\'Gen\',1,\'1-\');">Genesis 1-11</a>:<P>(1) Prominence of the Religious Element.<P>In the primitive history as recorded in the opening chapters of Genesis we must yet emphasize, more than is done elsewhere, that the chief interest for the Christian is found in the religious and moral teachings of this account; and that these teachings remain unshaken, even when chronological, historical, archaeological, physical, geographical or philological sciences would tempt us to reach negative conclusions. It is a wise thing, from the outset, not to be too timid in this direction, and to concede considerable liberty in this matter, when we remember that it is not the purpose of the Bible to give us scientific knowledge in scientific forms, but to furnish us with religious and ethical thoughts in a language which a childlike mind, that is open to Divine things, can understand.<P>(2) Carefulness as Regards Divergent Results of Scientific Research.<P>On the other hand, it is right over against the so-called "results" of these different sciences to be very critical and skeptical, since in very many cases science retracts today what with a flourish of trumpets it declared yesterday to be a "sure" result of investigations; e.g. as far as the chronology is concerned, the natural and the historical sciences often base their computations on purely arbitrary figures, or on those which are constructed entirely upon conclusions of analogy, and are far from conclusive, if perchance the history of the earth or of mankind has not at all times developed at the same pace, i.e. has moved upward and downward, as e.g. a child in its earlier years will always learn more rapidly than at any later period of its life.<P>(3) Frequent Confirmation of the Bible by Science.<P>But finally the Holy Scriptures, the statements of which at this period are often regarded slightingly by theologians, are regarded much more highly by men of science. This is done, e.g., by such scientists as Reinke and K.E. von Baer, who declare that Moses, because of his story of the creation, was a man of unsurpassed and unsurpassable scientific thought; or when many geological facts point to such an event as the Deluge in the history of the earth. The history of languages, as a whole and in its details, also furnishes many proofs for the correctness of <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>, and that chapter has further been confirmed in a most surprising manner by many other discoveries (compare the existence of Babel at a period earlier than Nineveh, and the colonizing of Assur by Babel). Then facts like the following can be explained only on the presupposition that the reports in Genesis are correct, as when a Dutchman in the 17th century built an ark after the measurements given in Genesis and found the vessel in every particular adapted to its purposes; and when today we again hear specialists who declare that the modern ocean sailing vessel is being more and more constructed according to the relative proportions of the ark.<P>(4) Superiority of the Bible over Heathen Mythologies.<P>Finally, the similarity of the Biblical and the Babylonian accounts of the creation and the Deluge, as these have been discovered by learned research (and we confine ourselves to these two most important reports)—although this similarity has been misinterpreted and declared to be hostile to the historical reliability and the originality of <a onClick="return mV(\'Gen\',1,\'1-\');">Ge 1</a> and <a onClick="return mV(\'Gen\',6,\'1-\');">Ge 6-9</a>—does not prove what critics claim that it does. Even if we acknowledge that the contents of these stories were extant in Babylon long before the days of Moses, and that these facts have been drawn from this source by Israel, there yet can be no question that the value of these accounts, the fact that they are saturated with a monotheistic and ethical spirit, is found only in Israel and has been breathed into them only by Israel. For the inner value of a story does not depend upon its antiquity, but upon its spirit. But even this conception of the matter, which is shared by most theologians, cannot satisfy us. When we remember how Babylonian mythology is honeycombed by the grossest superstition and heathenism, and that our ethical feelings are often offended by it in the most terrible manner, it is really not possible to see how such a system could have had any attraction for Israel after the Spirit, and how a man who thought as a prophet could have taken over such stories. If Israel has been a pathfinder in the sphere of religion, as is acknowledged on all hands, why do the critics always talk of their borrowing from others? And then, since similar stories are found also among other nations, and as the natural sciences are anything but a unit in hostility to the Biblical narratives, all these factors can find a satisfactory explanation only on the supposition that there existed an original or primitive revelation, and that in Israel this revelation was transmitted in its greater purity, while among the other nations it was emptied of its contents or was perverted. In this way the universality of these stories can be explained, as also the inferiority in character of similar stories among the other nations.<P>Babylonian and Biblical Stories<P>The particularly close connection that exists between the Babylonian and the Biblical versions of these stories is in perfect harmony with the fact that it was from Babylon that the dispersion of mankind set in. The purity of the Biblical tradition is further attested by the fact that it reports the actual history of all mankind (see under I, 2), while the mythologies of other nations are restricted nationally and locally, i.e. the beginnings of the history of the individual nations and the beginnings of the history of mankind are identical, and the earliest history is always reported as taking place in the native land of the people reporting it. The fact that in earlier times there prevailed in Babylon too a purer knowledge of God, which, however, steadily degenerated, is proved by many data, and especially by the recently discovered fragment of a Deluge story, according to which the God who destroyed the world by the Flood and the God who delivered the one family is the same God, which is in perfect agreement with the Bible, but is in contradiction to the later Babylonian story. That in earlier times a purer conception of God prevailed, seems to be confirmed also by the experiences of the missionaries. Evolutionism, i.e. the development of a higher conception of God out of a lower, is nothing but an unproved theory, which at every step is contrary to actual facts. Compare also my book, Die Entwicklung der Gottesidee in vorexilischer Zeit, 129ff, and Schmidt, Die babylonische Religion: Gedanken uber ihre Entwicklung, a dissertation in which the fact that religion naturally degenerates is proved also as far as the Greeks, the Egyptians, the East Indians and the Chinese are concerned.<P>V: Origin and Authorship of Genesis.<P>1. Connection with Mosaic Times:<P>That the Book of Genesis stands in some kind of literary connection with the succeeding books of the Pentateuch is generally acknowledged. But if this is the case, then the question as to the origin and the time of the composition of this whole body of books can be decided only if we take them all into consideration. In this article we have only to consider those facts which are found in Genesis for the solution of this problem. It is self-evident that the conclusion we have reached with reference to the literary unity of the book is of great importance for this question (see under II and III above). The historical character of the book, as demonstrated under IV above, also speaks emphatically for this claim that the literary composition of the book must have taken place when the memory of these events was still trustworthy, and the impression and experiences were still fresh and had not yet faded. Such individualistic and vivid pictures of historical personages as are reported by Genesis, such a faithful adherence to the accounts of the civilization in the different countries and districts and at different times, such detailed accounts of foreign customs, conditions and historical events, could scarcely. have been possible, if the Mosaic age with its powerful new impressions, the period of the Judges, with its characteristic apostasy, or even the division of Israel into two kingdoms, with its dire effects on the external union of the people, had all passed by before these accounts were actually written down. On the other hand, the highly developed prophetic conception of these events, and the skillful plan of the book demand that the author must have been a religious and ethical personality of the first rank. And as, finally, it is scarcely credible that Moses would have failed to provide for a systematic report of the great past of the people, for which account, before this and as long as only family histories were involved, there was no need felt, and as the subsequent books of the Pentateuch, which are acknowledged in a literary way to be connected with Genesis, in many of their parts expressly declare that Moses was their author (compare <a href="study/isbe/search.html?string=EXODUS">EXODUS, IV</a>), the Mosaic authorship of this book is as good as proved. This is not to deny that older sources and documents were used in the composition of the book, such as perhaps the genealogical tables or the events recorded in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>, possibly, too, some referring to the history of the times before the Deluge and before Abraham. This is probable; but as all the parts of the book have been worked together into a literary unity (see under II and III above), and as such sources are not expressly mentioned, it is a hopeless task to try to describe these different sources in detail or even to separate them as independent documents, after the manner refuted under II and III above, as a theory and in its particulars. And for the age of Genesis, we can refer to the fact that the personal pronoun here is still used for both genders, masculine and feminine, which is true also of the word na\'ar ("youth"), a peculiarity which is shared also by the other books of the Pentateuch almost throughout.<P>2. Examination of Counter-Arguments:<P>(1) Possibility of Later Additions.<P>In itself it would be possible that from time to time some explanatory and interpreting additions could have been made to the original text, in case we find indications of a later period in some statements of the book. But that in this case these additions could not have been made by any unauthorized persons, but only officially, should, in the case of a book like Genesis, be regarded as self-evident. But in our times this fact must be emphasized all the more, as in our days the most radical ideas obtain in reference to the way in which sacred books were used in former times. And then it must be said that we cannot prove as an absolute certainty that there is a single passage in Genesis that originated in the post-Mosaic period.<P>(2) "Prophecy after the Event" Idea.<P>It is self-evident also that the fulfillment of a prophecy is not an evidence of a "prophecy after the event" (vaticinium post evenrum), altogether independently of the fact that in this case <a onClick="return mV(\'Gen\',12,\'1-3\');">Ge 12:1-3</a>, which is still in process of fulfillment, could not have been written down even today (compare on this matter, perhaps, Noah\'s prophecy (<a onClick="return mV(\'Gen\',9,25);">9:25</A>ff); or the prediction of the career of Esau (<a onClick="return mV(\'Gen\',25,23);">25:23</a>; <a onClick="return mV(\'Gen\',27,40);">27:40</a>); or of Ishmael (<a onClick="return mV(\'Gen\',16,10);">16:10</A>ff; <a onClick="return mV(\'Gen\',21,18);">21:18</a>); or Jacob\'s blessing (<a onClick="return mV(\'Gen\',49,\'1-\');">Ge 49</a>)). The last-mentioned case cannot in any way be interpreted as the product of a later time; compare the curse of Levi in <a onClick="return mV(\'Gen\',49,\'5-8\');">49:5-8</a> as compared with the honor bestowed on this tribe already in the Mosaic period (<a onClick="return mV(\'Exd\',32,\'26-29\');">Ex 32:26-29</a>; <a onClick="return mV(\'Deu\',33,\'8-11\');">De 33:8-11</a>), and in the time of the Judges (<a onClick="return mV(\'Jdg\',17,\'7-13\');">Jud 17:7-13</a>; <a onClick="return mV(\'1Sa\',2,27);">1Sa 2:27</a>f). Zebulun, too, according to <a onClick="return mV(\'Gen\',49,13);">Ge 49:13</a> is regarded as being settled on the coast, which is not in agreement with historical reality (compare <a onClick="return mV(\'Jos\',19,\'10-16\',27);">Jos 19:10-16, 27</a>). In the same way the curse on Simeon in <a onClick="return mV(\'Gen\',49,\'5-7\');">Ge 49:5-7</a>, which declared that his tribe should be distributed among Israel, was not fulfilled in the time when the people entered Canaan (compare <a onClick="return mV(\'Jos\',19,1);">Jos 19:1</a> and <a onClick="return mV(\'2Ch\',34,6);">2Ch 34:6</a>). In <a onClick="return mV(\'Gen\',49,10);">Ge 49:10</a> "Shiloh" cannot refer to the coming of the tabernacle to Shiloh (compare <a onClick="return mV(\'Jos\',18,1);">Jos 18:1</a>); for Shiloh is, on the other hand, to be interpreted personally and Messianically. As long as Shiloh was of any importance (compare <a onClick="return mV(\'1Sa\',1,\'1-\');">1Sa 1</a>ff), Judah was not in the possession of the scepter; but when this scepter did come into the control of Judah, Shiloh had long since ceased to be of any significance (compare my book, Die messianische Erwartung der vorexilischen Propheten, 360f).<P>(3) Special Passages Alleged to Indicate Later Date (<a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; <a onClick="return mV(\'Gen\',13,7);">13:7</a>; <a onClick="return mV(\'Gen\',22,2);">22:2</a>; <a onClick="return mV(\'Gen\',36,31);">36:31</a>ff; <a onClick="return mV(\'Gen\',13,18);">13:18</a>; <a onClick="return mV(\'Gen\',23,2);">23:2</a>; <a onClick="return mV(\'Gen\',14,14);">14:14</a>).<P>In <a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>; <a onClick="return mV(\'Gen\',13,7);">13:7</a>, it is claimed that it is presupposed that at the time of the author there were no longer any Canaanites in the country, so that these verses belong to a much later period than that of Moses. But on this supposition these verses would be altogether superfluous and therefore unintelligible additions. For that in the time of Abraham the Canaanites had not yet been expelled by Israel, was a self-evident matter for every Israelite. As a matter of fact, the statements in both verses can easily be interpreted. Abraham leaves his native country to go into a strange land. When he comes to Canaan, he finds it inhabited by the Canaanites (compare <a onClick="return mV(\'Gen\',10,6,15);">10:6,15</a>; <a onClick="return mV(\'Gen\',9,25);">9:25</a>ff). This could have made his faith to fail him. God, accordingly, repeats His promise at this very moment and does so with greater exactness (compare <a onClick="return mV(\'Gen\',13,7);">13:7</a> with <a onClick="return mV(\'Gen\',13,1);">13:1</a>), and Abraham shows that God can trust his faith (<a onClick="return mV(\'Gen\',13,7);">13:7</a>f). The question whether the Canaanites no longer existed at the time the book was written, has nothing at all to do with the meaning of these verses. The same is true of <a onClick="return mV(\'Gen\',13,7);">13:7</a>, on account of the presence of the Canaanites and of the Perizzites, which latter tribe had probably come in the meanwhile and is not yet mentioned in <a onClick="return mV(\'Gen\',10,\'1-\');">Ge 10</a>, but is mentioned in <a onClick="return mV(\'Gen\',15,20);">15:20</A>, and which makes the separation of Abraham and Lot only all the more necessary.<P>That in <a onClick="return mV(\'Gen\',22,2);">Ge 22:2</a> the land of Moriah is mentioned is claimed by the critics to be a proof that this passage was written after the times of David and even of Solomon, because according to <a onClick="return mV(\'2Ch\',3,1);">2Ch 3:1</a> the temple stood on Mt. Moriah. But as in this latter passage one particular mountain is called Moriah, but in Abraham\'s time a whole country was so called, it is scarcely possible that <a onClick="return mV(\'Gen\',22,2);">Ge 22:2</a> could have been written at so late a period.<P>Usually, too, the list of 8 Edomite kings, who ruled before there was a king of Israel, according to <a onClick="return mV(\'Gen\',36,31);">Ge 36:31</a>ff, is cited as a proof that this part was written only after the establishment of the kingdom in Israel, although the time down to the age of Saul would be entirely too long for only eight kings, as already in the Mosaic period there were kings in Edom (<a onClick="return mV(\'Num\',20,14);">Nu 20:14</a>). Then, too, we find in the days of Solomon a hereditary kingdom in Edom (<a onClick="return mV(\'1Ki\',11,14);">1Ki 11:14</a>), while in <a onClick="return mV(\'Gen\',36,31);">Ge 36:31</a>ff we have to deal with an elective kingdom. Also it would be impossible to understand why this list of kings is carried down only so far and no farther, namely down to the time when there were kings in Israel. This statement can properly be interpreted only in the light of <a onClick="return mV(\'Gen\',17,6,16);">17:6,16</A>, where the promise is given to Abraham that kings should be found among his descendants (compare also <a onClick="return mV(\'Gen\',17,20);">17:20</a> with <a onClick="return mV(\'Gen\',25,16);">25:16</a>); and in the light of chapter <a onClick="return mV(\'Gen\',14,\'-\');">14</a>, where Abraham is explicitly brought into connection with kings in a number of ways (with the four kings of the East, whom he conquers; with the five kings of the Jordan valley, whom he assists; with the King\'s Vale (<a onClick="return mV(\'Gen\',14,17);">14:17</a>), which prepared the way for the Melchizedek episode; and with this Priest-King himself, who blesses him and to whom he gives tithes (<a onClick="return mV(\'Gen\',14,18);">14:18</a>ff); with the king of Sodom, whom he rebukes (<a onClick="return mV(\'Gen\',14,21);">14:21</a>ff)). Accordingly, the statement in <a onClick="return mV(\'Gen\',36,31);">36:31</a> is not merely a dry historical notice, but is a reference to the blessing of God, which is realized in Israel at a much later time than in the kindred tribe of Esau, and which puts the faith of Israel to a new test. As the death of the last Edomite king is not mentioned (compare <a onClick="return mV(\'Gen\',36,39);">36:39</a> in contrast to the preceding passage and to <a onClick="return mV(\'1Ch\',1,50);">1Ch 1:50</a>f), but as detailed family data are given, we are doubtless dealing here with living contemporaries of Moses, in whose time already the Edomites possessed a kingdom (<a onClick="return mV(\'Num\',20,14);">Nu 20:14</a>; <a onClick="return mV(\'Jdg\',11,17);">Jud 11:17</a>), just as this was the case with Amalek (<a onClick="return mV(\'Num\',24,7);">Nu 24:7</a>), with Moab (<a onClick="return mV(\'Num\',21,26);">Nu 21:26</a>; <a onClick="return mV(\'Num\',22,4);">22:4</a>) and Midian (<a onClick="return mV(\'Num\',31,8);">Nu 31:8</a>). And why would a later writer have mentioned neither Selah (Petra), so important in later times (compare <a onClick="return mV(\'Isa\',16,1);">Isa 16:1</a>; <a onClick="return mV(\'Jdg\',1,36);">Jud 1:36</a>; <a onClick="return mV(\'2Ki\',14,7);">2Ki 14:7</a>), nor Ezion-Geber (<a onClick="return mV(\'1Ki\',9,26);">1Ki 9:26</a>; <a onClick="return mV(\'2Ch\',8,17);">2Ch 8:17</a>f), among the places given in <a onClick="return mV(\'Gen\',36,40);">Ge 36:40</a>ff? In Moses\' time, however, the last-mentioned place was only prairie (<a onClick="return mV(\'Num\',33,35);">Nu 33:35</a>f).<P>Just as little is it an argument against the Mosaic times that Hebron is mentioned in <a onClick="return mV(\'Gen\',13,18);">Ge 13:18</a>; <a onClick="return mV(\'Gen\',23,2);">23:2</a>, which city, according to <a onClick="return mV(\'Jos\',14,15);">Jos 14:15</a>; <a onClick="return mV(\'Jos\',15,13);">15:13</a>, is called Kiriath-arba, a name which Genesis also is acquainted with (compare <a onClick="return mV(\'Gen\',23,2);">23:2</a>), and which in its signification of "city of Arba" points to an originally proper name. Hebron is the older name, which was resumed at a later period, after it had in the meanwhile been supplanted by the Canaanitic name, just as the name of Salem, which occurs already in the Tell el-Amarna Letters, for a period of time gave way to the name of Jebus, but was afterward resumed. That Hebron was an old city and that it existed at a period earlier than the Arba mentioned in <a onClick="return mV(\'Jos\',14,15);">Jos 14:15</a>; <a onClick="return mV(\'Jos\',15,13);">15:13</a>, and from whom its later name was derived, can be concluded from <a onClick="return mV(\'Num\',13,22);">Nu 13:22</a>.<P>Further, the mention of Dan in <a onClick="return mV(\'Gen\',14,14);">14:14</a> does not necessarily favor the view that this chapter did not originate until after <a onClick="return mV(\'Jos\',19,47);">Jos 19:47</a>. <a onClick="return mV(\'Jdg\',18,29);">Jud 18:29</a>, where Leshem or Laish is changed into Dan (<a onClick="return mV(\'2Sa\',24,6);">2Sa 24:6</a>; compare <a onClick="return mV(\'Gen\',24,2);">24:2</a> and <a onClick="return mV(\'Gen\',24,15);">24:15</a>), does make the existence of another Dan probable. Since in <a onClick="return mV(\'Gen\',14,2,3,7,17);">Ge 14:2-3, 7, 17</a> so many ancient names are mentioned, and as the author is most fully informed as to the conditions of the political complexion of the old nations of that time (<a onClick="return mV(\'Gen\',14,5,6,7);">14:5-7</a>), it would be incomprehensible if he should not have made use of the ancient names Laish and Leshem. However, if this Dan was really meant, we should at most have to deal with a revision, such as that pointed out above. Some other less important arguments against the origin of Genesis from the Mosaic times we can here ignore. The most important argument for the Mosaic origin of the book, in addition to those mentioned under 1, will now be discussed.<P>VI. Significance.<P>1. Lays Foundation for the Whole of Revelation:<P>In the history of the creation the most important feature for us is the fact that the world was created out of nothing (compare <a onClick="return mV(\'Gen\',1,1);">Ge 1:1</a> and the word bara\'), which guarantees the absoluteness of God and His perfect control of the entire material world; further, the creation of man, as the crown of all creation, for which all things previously created prepare, and who is to rule over them, but who—most important of all—is created after the image of God in Genesis (<a onClick="return mV(\'Gen\',1,26);">1:26</a>f), and whose body has been created by the hand of God and his soul breathed into him by God (<a onClick="return mV(\'Gen\',2,7);">2:7</a>). On this fact, too, in the end, is founded the possibility of man\'s redemption even after the Fall (<a onClick="return mV(\'Gen\',5,1,3);">5:1,3</a>; compare <a onClick="return mV(\'Col\',3,9);">Col 3:9</a>; <a onClick="return mV(\'Eph\',4,24);">Eph 4:24</a>), as also the possibility of the incarnation of Jesus Christ, who also is the image of God (<a onClick="return mV(\'Col\',1,15);">Col 1:15</a>; <a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>). Then, too, another all-important factor for us is the unity of the human race, for thereby is made possible and can be understood the fact that all men have become subject to sin and all can be the recipients of grace (<a onClick="return mV(\'Rom\',5,12);">Ro 5:12</a>ff; <a onClick="return mV(\'1Cr\',15,22);">1Co 15:22</a>f; <a onClick="return mV(\'1Cr\',15,45);">45</a>f). Also the need of redemption is brought out strongly in the Book of Genesis. Compare in connection with the Fall, the pains that shall attend the birth of a child, the cursing of the land, death (<a onClick="return mV(\'1Cr\',3,15);">3:15</a>ff), which finds its first victim in Abel, and the monotonous and emphatic repetition of the formula, "and he died," in <a onClick="return mV(\'Gen\',5,\'1-\');">Ge 5</a>, as characterizing the dismal fate of mankind, and which finds its expression in the rapid decrease of the length of life in the genealogies and in the ages of the patriarchs (<a onClick="return mV(\'1Cr\',5,1);">5:1</a>ff; <a onClick="return mV(\'1Cr\',11,10);">11:10</a>ff; <a onClick="return mV(\'1Cr\',25,7);">25:7</a>; <a onClick="return mV(\'1Cr\',35,28);">35:28</a>; <a onClick="return mV(\'1Cr\',47,28);">47:28</a>; <a onClick="return mV(\'1Cr\',50,26);">50:26</a>; <a onClick="return mV(\'Psa\',90,10);">Ps 90:10</a>), and in the irresistible and increasing power of death. By the side of this, sin at once assumes its most horrible form (<a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a>, doubt, pride, fear, boldness of Eve and Adam), and is propagated and increases; compare the murder and the despair of Cain (<a onClick="return mV(\'Gen\',4,1);">Ge 4:1</a>), which is still surpassed by the defiant blasphemy of Lamech (<a onClick="return mV(\'Gen\',4,23);">4:23</a>f); and in the same way, death, which is coming more and more rapidly (see above), is a proof for this, that sin is being more and more intimately interwoven with the human race. Compare further, the corruption of the whole earth, which brings with it as a consequence the judgment of the Deluge (<a onClick="return mV(\'Gen\',6,5);">6:5</a>ff), after the period of grace extending over 120 years had fruitlessly passed by; the lack of reverence on the part of Ham (<a onClick="return mV(\'Gen\',9,22);">9:22</a>); the arrogance in connection with the building of the tower of Babel (<a onClick="return mV(\'Gen\',11,1);">11:1</a>ff); the Sodomitic sin in <a onClick="return mV(\'Gen\',18,\'16-\');">18:16</a>-<a onClick="return mV(\'Gen\',19,\'1-15\');">19:15</a>; the daughters of Lot (<a onClick="return mV(\'Gen\',19,30);">19:30</a>ff). Still worse is it, that the elect also are not without blame. On Abraham, see IV,1,2b; then concerning Noah (<a onClick="return mV(\'Gen\',9,21);">9:21</a>) and Lot\'s fearful drunkenness (<a onClick="return mV(\'Gen\',19,32);">19:32</a>ff); Isaac\'s and Rebekah\'s preference for Esau or Jacob (<a onClick="return mV(\'Gen\',25,28);">25:28</a>); Jacob\'s deceptions of various kinds, his preference for Joseph (<a onClick="return mV(\'Gen\',37,3);">37:3</a>); the horrible deeds of Simeon and Levi (<a onClick="return mV(\'Gen\',34,25);">34:25</a>ff; <a onClick="return mV(\'Gen\',49,5);">49:5</a>ff); Reuben\'s incest (<a onClick="return mV(\'Gen\',35,22);">35:22</a>; <a onClick="return mV(\'Gen\',49,3);">49:3</a>f); the cruelty of the brethren of Joseph toward him and his father (chapter <a onClick="return mV(\'Gen\',37,\'1-\');">37</a>); finally, Joseph\'s pride and his reporting his brethren (<a onClick="return mV(\'Gen\',37,2,5);">37:2,5</a>ff). In short, wherever we look, we see in Genesis already a proof for the truth of <a onClick="return mV(\'Rom\',3,23);">Ro 3:23</a>, "All have sinned, and fall short of the glory of God."<P>2. Preparation for Redemption:<P>By the side of this need of salvation there is to be found also the longing for salvation; compare the name of Noah (<a onClick="return mV(\'Gen\',5,29);">Ge 5:29</a>), and the word of blessing from the lips of Jacob (<a onClick="return mV(\'Gen\',49,18);">Ge 49:18</a>); and, further, the fact that Abraham reaches out after the promised heir in <a onClick="return mV(\'Gen\',15,\'1-\');">Ge 15-18</a>, and his desire for the possession of the land (<a onClick="return mV(\'Gen\',12,\'1-\');">12-14</a>; <a onClick="return mV(\'Gen\',23,\'1-\');">23</a>; <a onClick="return mV(\'Gen\',28,20);">28:20</a>ff; <a onClick="return mV(\'Gen\',33,19);">33:19</a>f); and especially from <a onClick="return mV(\'Gen\',47,27);">47:27</a> on. And in harmony with this need and this longing for redemption we find above all other things the saving and the promising grace of God. He does not cause the bodily death to follow immediately upon the Fall in <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a> (although the beginning of the spiritual death sets in at once with the separation from God); He provides for mankind by Himself making garments for them out of skins (<a onClick="return mV(\'Gen\',3,21);">3:21</A>); even the expulsion from Paradise is not merely a punishment; God fears that man might live forever if he should eat from the tree of life (<a onClick="return mV(\'Gen\',3,22);">3:22</a>ff). He sets enmity between the human race and the seed of the serpent, so that at least the possibility of a moral contest yet exists; He strengthens the good in Cain (<a onClick="return mV(\'Gen\',4,7);">4:7</a>); He removes the pious Enoch (<a onClick="return mV(\'Gen\',5,24);">5:24</A>); He saves Noah and his family and makes a covenant with him (<a onClick="return mV(\'Gen\',8,21);">8:21</a>ff); He gives His promise to Abraham (<a onClick="return mV(\'Gen\',12,1,2,3);">12:1-3</a>) and makes a covenant with him (chapters <a onClick="return mV(\'Gen\',15,\'1-\');">15</a>; <a onClick="return mV(\'Gen\',17,\'1-\');">17</a>); He delivers Lot (<a onClick="return mV(\'Gen\',19,13);">19:13</a>ff); He is willing even to preserve Sodom at Abraham\'s prayer, if there are as many as 10 just men in the city (<a onClick="return mV(\'Gen\',18,32);">18:32</a>); He bestows a blessing on Ishmael also (<a onClick="return mV(\'Gen\',16,10);">16:10</a>ff; <a onClick="return mV(\'Gen\',17,20);">17:20</a>; <a onClick="return mV(\'Gen\',21,13);">21:13</a>ff), and permits Isaac to bless Esau (<a onClick="return mV(\'Gen\',27,39);">27:39</a>ff); but above all He is with Isaac, Jacob and Joseph. It is indeed true that the thought runs through Genesis that not all men are capable of receiving His grace, and that not all are drawn to the Father. Cain\'s sacrifice is not acceptable before God, as was Abel\'s; the Cainites with their advance in civilization (<a onClick="return mV(\'Gen\',4,17);">4:17</a>ff), to whom Lamech also belonged, are different from Seth (<a onClick="return mV(\'Gen\',4,26);">4:26</a>; <a onClick="return mV(\'Gen\',5,1);">5:1</a>ff), who continues the line of the elect. Finally, the godly, too, permit themselves to be deceived (<a onClick="return mV(\'Gen\',6,1);">6:1</a>ff), and Noah stands alone in his piety. After that Ham is cursed in his youngest son, Canaan (<a onClick="return mV(\'Gen\',9,22);">9:22</a>; compare <a onClick="return mV(\'Gen\',10,6);">10:6</a>); but Shem is blessed to such a degree that his blessing is to extend to Japheth also; cf, further, the elimination from sacred history of Lot (<a onClick="return mV(\'Gen\',19,29);">19:29</a>ff); of Ishmael (<a onClick="return mV(\'Gen\',25,12);">25:12</a>ff), and of Esau (<a onClick="return mV(\'Gen\',36,1);">36:1</a>ff); of Sodom and Gomorrah (chapter <a onClick="return mV(\'Gen\',19,\'1-\');">19</a>); then the choice of Jacob in preference to Esau (<a onClick="return mV(\'Gen\',25,\'19-\');">25:19-37:1</a>); the preference of Ephraim over Manasseh (<a onClick="return mV(\'Gen\',48,17);">48:17</a>ff); the transmission of the Messianic promises to Judah (<a onClick="return mV(\'Gen\',49,10);">49:10</a>; compare my book, Messianische Erwartung, 360f), so that at the close of Genesis we find already the hope of a personal Messiah expressed, in whom also the word (<a onClick="return mV(\'Gen\',3,15);">3:15</a>) that was originally spoken to all mankind is to be entirely fulfilled, and in whom also the blessing given to Abraham shall find its significance and realization for the benefit of all mankind (<a onClick="return mV(\'Gen\',12,3);">12:3</a>, and see above,1, 2 and 3). But in the history of Abraham this fact also becomes clear, that in the end this was all grace on the part of God, and faith on the part of man; and because both grace and faith are in Genesis placed and emphasized at the very beginning of the history of mankind, and before the giving of the law (<a onClick="return mV(\'Exd\',19,\'1-\');">Ex 19</a>); then this grace and faith cannot be abrogated through the latter or made ineffective. Not by works but by faith is man saved (compare <a onClick="return mV(\'Gal\',3,2);">Ga 3:2</a>; <a onClick="return mV(\'Rom\',4,\'1-\');">Ro 4</a>; <a onClick="return mV(\'Hbr\',11,8);">Heb 11:8</a>ff; <a onClick="return mV(\'Jam\',2,21);">Jas 2:21</a>ff). But the guidance of individuals and of His people by God, the ways which He took with His elect, become clear and intelligible ultimately in the history of Joseph; and all and everything must in the end serve the good of those who are His.<P>LITERATURE.<P>Against the separation into documents we mention, of older works: Havernick, Specielle Einleitung in den Pent; Hengstenberg, Beitrage zur Einleitung, II, III; Keil, Einleitung in das Altes Testament, and his Commentary on Genesis; Ewald, Die Komposition der Genesis. Of later works: Orr, Problem of the Old Testament; Eerdmans, Die Komposition der Genesis; Moller, Wider den Bann der Quellenscheidung. Against the evolutionary theory: Orr, Problem of the Old Testament; Wiener, Wiener, Essays in Pentateuchal Criticism and Wiener, Origin of the Pentateuch; Green, Unity of Book of Genesis; Moller, Die Entwicklung der alttestamentlichen Gottesidee in vorexilischer Zeit (here also further lit.). On modern archaeological researches: Orr, Problem of the Old Testament; Jeremias, Das Altes Testament im Lichte des alten Orients; Urquhart, Die neueren Entdeckungen und die Bibel (to be used with caution; the work is reliable in the facts but not careful in its conclusions and in its account of Old Testament criticism). Further, compare the histories of Israel by Kohler, Konig, Kittel, Oettli, Klostermann, Stade, Wellhausen: the Commentaries on Genesis by Keil, Delitzsch, Dillmann, Lange, Strack, Gunkel, Holzinger; the Introductions to the Old Testament by Kuenen, Strack, Baudissin, Konig, Cornill, Driver; the Biblical Theologies by Marti, Smend, Budde, Schulz, Oehler. Finally compare Sievers, Metrische Studien, II: "Die hebraische Genesis."``122';
isbe[3737]='Gennaeus; Genneus`ge-ne\'-us, ge-ne\'-us (Gennaios): Father of Apollonius, one of the Syrian generals who troubled the Jews while Lysias was governor for Antiochus Eupator (2Macc 12:2). The description is added to distinguish the Apollonius here mentioned from several others of the same name. See <a href="study/isbe/search.html?string=APOLLONIUS">APOLLONIUS</a>. There is no need with Luther to take the name simply as an adjective "des edlen Apollonius." The name occurs elsewhere as a proper name.``1';
isbe[3738]='Gennesaret, Lake of`ge-nes\'-a-ret`<a href="./study/isbe/search.html?string=GALILEE+SEA+OF">GALILEE, SEA OF</a>`1';
isbe[3739]='Gennesaret, Land of`ge-nes\'-a-ret he ge Gennesaret):<P>1. The Name:<P>The first syllable of the name Gennesaret is evidently the Hebrew gan, "garden"; while the second may be a proper name. Possibly, however, the name may represent the Hebrew ganne sarim, "princely gardens." It is applied to a district on the northwest shore of the Sea of Galilee (<a onClick="return mV(\'Mat\',14,34);">Mt 14:34</a>; <a onClick="return mV(\'Mar\',6,53);">Mr 6:53</a>), now known as el-Ghuweir, "little Ghor." It curves round from el-Mejdel in the south, to \'Ain et-Tineh, or Khan Minyeh, in the north, a distance of over 3 miles, with an average breadth from the sea to the foot of the mountains of about a mile. The soil is deep, rich loam, of amazing fertility. In the south it is watered by the stream from Wady el-Chamam, the gorge that opens to the west of el-Mejdel.<P>2. Water:<P>The middle portion is supplied from \'Ain el-Madawwerah, a copious fountain near the western edge of the plain, round which a wall has been built, to raise the level of the water; and from the perennial stream, Wady er-Rubadiyeh, which drives a mill before starting on its work of irrigation. Farther North, Wady el-\'Amud brings down much water in the rainy season. The water from \'Ain et-Tabgha was brought round the promontory at \'Ain et-Tineh by a conduit cut in the rock. It was used to drive certain mills, and also to refresh the neighboring land. This seems to be the fountain called "Capharnaum" by Josephus (BJ, III, x, 8). This writer extols the productiveness of the plain. He says the "soil is so fruitful that all sorts of trees can grow upon it."<P>3. Fertility:<P>The walnut, the palm, the olive and the fig, which usually require diverse conditions, flourish together here. "One may call this place the ambition of nature;...it is a happy contention of the seasons, as if each of them claimed this country; for it not only nourishes different sorts of autumnal fruit beyond men\'s expectation, but preserves them a great while." He says that it supplies grapes and figs through ten months of the year, and other fruits as they ripen together throughout the year (same place). The fruits of Gennesaret had such high repute among the rabbis that they were not allowed in Jerusalem at the time of the feasts, lest any might be tempted to come merely for their enjoyment (Neubauer, Geog. du Talmud, 45f).<P>Centuries of neglect made a sad change in the plain. It was largely overgrown with thorn-bushes, and it yielded one of the finest crops of thistles in the country. Cultivation was confined to the southwest part; and the rest furnished grazing ground for a tribe of nomads. Recently the German Catholics made extensive purchases, including the village of el-Mejdel. Considerable portions have also passed into the hands of Jews. The land is almost entirely cleared, and it rewards the toil of the husbandman with all its ancient generosity.``54';
isbe[3740]='Gentiles`jen\'-tilz (goy, plural goyim; ethnos, "people," "nation"): Goy (or Goi) is rendered "Gentiles" in the King James Version in some 30 passages, but much more frequently "heathen," and oftener still, "nation," which latter is the usual rendering in the Revised Version (British and American), but it, is commonly used for a non-Israelitish people, and thus corresponds to the meaning of Gentiles." It occurs, however, in passages referring to the Israelites, as in <a onClick="return mV(\'Gen\',12,2);">Ge 12:2</a>; <a onClick="return mV(\'Deu\',32,28);">De 32:28</a>; <a onClick="return mV(\'Jos\',3,17);">Jos 3:17</a>; <a onClick="return mV(\'Jos\',4,1);">4:1</a>; <a onClick="return mV(\'Jos\',10,13);">10:13</a>; <a onClick="return mV(\'2Sa\',7,23);">2Sa 7:23</a>; <a onClick="return mV(\'Isa\',1,4);">Isa 1:4</a>; <a onClick="return mV(\'Zep\',2,9);">Ze 2:9</a>, but the word (\'am) is the term commonly used for the people of God. In the New Testament ethnos is the word corresponding to goy in the Old Testament and is rendered "Gentiles" by both VSS, while (laos) is the word which corresponds to \'am. The King James Version also renders Hellenes, "Gentiles" in six passages (<a onClick="return mV(\'Jhn\',7,35);">Joh 7:35</a>; <a onClick="return mV(\'Rom\',2,9,10);">Ro 2:9-10</a>; <a onClick="return mV(\'Rom\',3,9);">3:9</a>; <a onClick="return mV(\'1Cr\',10,32);">1Co 10:32</a>; <a onClick="return mV(\'1Cr\',12,13);">12:13</a>), but the Revised Version (British and American) renders "Greeks."<P>The Gentiles were far less sharply differentiated from the Israelites in Old Testament than in New Testament times. Under Old Testament regulations they were simply non-Israelites, not from the stock of Abraham, but they were not hated or despised for that reason, and were to be treated almost on a plane of equality, except certain tribes in Canaan with regard to whom there were special regulations of non-intercourse. The Gentile stranger enjoyed the hospitality of the Israelite who was commanded to love him (<a onClick="return mV(\'Deu\',10,19);">De 10:19</a>), to sympathize with him, "For ye know the heart of the stranger, seeing ye were strangers in the land of Egypt" (<a onClick="return mV(\'Exd\',23,9);">Ex 23:9</a> the King James Version). The Kenites were treated almost as brethren, especially the children of Rechab (<a onClick="return mV(\'Jdg\',1,16);">Jud 1:16</a>; <a onClick="return mV(\'Jdg\',5,24);">5:24</a>; <a onClick="return mV(\'Jer\',35,\'1-\');">Jer 35</a>). Uriah the Hittite was a trusted warrior of David (<a onClick="return mV(\'2Sa\',11,\'1-\');">2Sa 11</a>); Ittai the Gittite was captain of David\'s guard (<a onClick="return mV(\'2Sa\',18,2);">2Sa 18:2</a>); Araunah the Jebusite was a respected resident of Jerusalem. The Gentiles had the right of asylum in the cities of refuge, the same as the Israelites (<a onClick="return mV(\'Num\',35,15);">Nu 35:15</a>). They might even possess Israelite slaves (<a onClick="return mV(\'Lev\',25,47);">Le 25:47</a>), and a Gentile servant must not be defrauded of his wage (<a onClick="return mV(\'Deu\',24,15);">De 24:15</a>). They could inherit in Israel even as late as the exile (<a onClick="return mV(\'Eze\',47,22,23);">Eze 47:22-23</a>). They were allowed to offer sacrifices in the temple at Jerusalem, as is distinctly affirmed by Josephus (BJ, II, xvii, 2-4; Ant, XI, viii, 5; XIII, viii, 2; XVI, ii, 1; XVIII, v, 3; CAp, II, 5), and it is implied in the Levitical law (<a onClick="return mV(\'Lev\',22,25);">Le 22:25</a>). Prayers and sacrifices were to be offered for Gentile rulers (<a onClick="return mV(\'Jer\',29,7);">Jer 29:7</a>; Baruch 1:10,11; <a onClick="return mV(\'Ezr\',6,10);">Ezr 6:10</a>; 1Macc 7:33; Josephus, BJ, II, x, 4). Gifts might be received from them (2Macc 5:16; Josephus, Ant, XIII, iii, 4; XVI, vi, 4; BJ, V, xiii, 6; CAp, II, 5). But as we approach the Christian era the attitude of the Jews toward the Gentiles changes, until we find, in New Testament times, the most extreme aversion, scorn and hatred. They were regarded as unclean, with whom it was unlawful to have any friendly intercourse. They were the enemies of God and His people, to whom the knowledge of God was denied unless they became proselytes, and even then they could not, as in ancient times, be admitted to full fellowship. Jews were forbidden to counsel them, and if they asked about Divine things they were to be cursed. All children born of mixed marriages were bastards. That is what caused the Jews to be so hated by Greeks and Romans, as we have abundant evidence in the writings of Cicero, Seneca and Tacitus. Something of this is reflected in the New Testament (<a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>; <a onClick="return mV(\'Act\',10,28);">Ac 10:28</a>; <a onClick="return mV(\'Act\',11,3);">11:3</a>).<P>If we inquire what the reason of this change was we shall find it in the conditions of the exiled Jews, who suffered the bitterest treatment at the hands of their Gentile captors and who, after their return and establishment in Judea, were in constant conflict with neighboring tribes and especially with the Greek rulers of Syria. The fierce persecution of Antiochus IV, who attempted to blot out their religion and Hellenize the Jews, and the desperate struggle for independence, created in them a burning patriotism and zeal for their faith which culminated in the rigid exclusiveness we see in later times.``138';

isbe[3743]='Gentleness`jen\'-t\'-l-nes (\'anah; epieikeia, chrestotes): In <a onClick="return mV(\'2Sa\',22,36);">2Sa 22:36</a> \'anah, "to bend low," "to condescend," is translated "gentleness," "Thy gentleness hath made me great," the Revised Version, margin "or condescension"; so also <a onClick="return mV(\'Psa\',18,35);">Ps 18:35</a>, where the word is \'anwah "humility," "gentleness," or "condescension." In the New Testament epieikeia ("fairness," "moderation," in <a onClick="return mV(\'Act\',24,4);">Ac 24:4</a> translated "clemency") is in <a onClick="return mV(\'2Cr\',10,1);">2Co 10:1</a> translated "gentleness," "the meekness and gentleness of Christ" (2Macc 2:22 "favour," the Revised Version (British and American) "forbearance"); chrestotes, "kindness," "usefulness," is translated "gentleness" in <a onClick="return mV(\'Gal\',5,22);">Ga 5:22</a> the King James Version, the Revised Version (British and American) "kindness"; chrestos is the word translated "kind" (to the unthankful and evil, <a onClick="return mV(\'Luk\',6,35);">Lu 6:35</a>), and chrestotes seems to carry in it a similar idea of active kindness.<P>Gentle occurs in the Old Testament only in the Revised Version (British and American) of <a onClick="return mV(\'Jer\',11,19);">Jer 11:19</a>, "I was like a gentle lamb" (kebhes). In the New Testament it is the translation of epios, "mild," "gentle" (<a onClick="return mV(\'1Th\',2,7);">1Th 2:7</a>; <a onClick="return mV(\'2Ti\',2,24);">2Ti 2:24</a>), and of epieikes, "fitting" "proper," etc. (<a onClick="return mV(\'1Ti\',3,3);">1Ti 3:3</a> the Revised Version (British and American); <a onClick="return mV(\'Tts\',3,2);">Tit 3:2</a>; <a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>; <a onClick="return mV(\'1Pe\',2,18);">1Pe 2:18</a>); also, with article, <a onClick="return mV(\'Phl\',4,5);">Php 4:5</a> (the King James Version "moderation," the Revised Version (British and American) "forbearance"). In 2Macc 15:12 Onias is said (the King James Version) to be "gentle (praos) in condition," the Revised Version (British and American) "in manner."``185';
isbe[3744]='Genubath`ge-nu\'-bath (genubhath, "theft"): Son of Hadad, the fugitive Edomite prince, born and brought up at the court of Egypt, whither Hadad had fled when David conquered Edom (<a onClick="return mV(\'1Ki\',11,20);">1Ki 11:20</a>). His mother was a sister of Tahpenes, queen of the Pharaoh who ruled Egypt at that time, and who belonged to the notoriously weak and uninfluential 21st dynasty.``1';
isbe[3745]='Geography`je-og\'-ra-fi.`<a href="./study/isbe/search.html?string=PALESTINE">PALESTINE</a>; <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>; <a href="./study/isbe/search.html?string=WORLD">WORLD</a>`1';
isbe[3746]='Geology of Palestine`je-ol\'-o-ji, The geology of Palestine cannot be discussed intelligently without taking into consideration the surrounding regions. The accompanying map shows, with considerable freedom, the distribution of the superficial strata of Syria, Palestine and Sinai, with parts of Asia Minor, Arabia and Egypt. (Data for this map were obtained from the "Geological Map of Egypt" (1:1,000,000) and from the "Carte geologique internationale de l\'Europe" (1:1,500,000).) It will be noted that Crystalline, or Archean, rocks (A) occupy extensive areas in Asia Minor, and that they are found in the south in Sinai, Western Arabia, and Eastern and Southern Egypt. Relatively small areas of Paleozoic rocks (P) adjoin the Crystalline rocks in Sinai and Arabia and east of Caesarea in Asia Minor. A notable area of Paleozoic occurs southeast of the Dead Sea. This is also adjacent to Crystalline rocks, which could not be indicated on the map on account of their slight superficial extent. Bordering either the Crystalline or the Paleozoic rocks in Egypt, Sinai and Arabia are large areas of Nubian Sandstone (N). The Nubian Sandstone in turn is generally bounded by Upper Cretaceous limestone (C), and the last by Tertiary deposits (T). The Quaternary, or Recent, deposits (R) and also the Eruptive rocks (E) sustain no constant relations to any particular ones of the other formations. The Quaternary follows the great rivers and the seacoasts. The Eruptive rocks usually overlie the others. They occupy extensive areas in Asia Minor, Syria and Arabia.<P>If we concentrate our attention upon the Crystalline, Cretaceous, and Tertiary, which are the most extensive formations, we find that the Crystalline rocks are abundant in the south and in the north, that the Cretaceous are most widely spread in Palestine and Southern Syria, and the Tertiary in Northern Syria and Egypt. We may believe that the Crystalline areas of the north and south have been land since the end of the Archean age, and that what are now Syria, Palestine and most of Egypt remained sea for a long time afterward. The Paleozoic areas were lifted above the sea and added to the northern and southern land areas during or at the end of the Paleozoic era. The regions in which we find Nubian Sandstone or Upper Cretaceous limestone became land by the end of the Mesozoic era. Finally the Tertiary areas were lifted out of the sea. During the Quaternary period the Nile and the rivers of Mesopotamia have added large areas to the land surface.<P>1. Crystalline Rocks (A):<P>The Crystalline rocks consist mainly of granite and crystalline schists, frequently interrupted with dikes of porphyry, diorite and other eruptives. It will be seen by the map that the Crystalline rocks are nowhere adjacent to the Mediterranean, but that they touch the Nile at Acwan, where the river in pouring over these rocks makes the First Cataract, or rather did before the construction of the great dam. Granite quarried at Acwan could be loaded on boats and conveyed to any city on the shores of the Mediterranean, and it is the granite of Acwan of which are composed not only many of the monuments of Egypt, but also the pillars which adorned many temples in Syria and Palestine.<P>2. Paleozoic Rocks (P):<P>The Paleozoic rocks of Sinai and Arabia are of Carboniferous age, but do not include any beds of coal. Those east of Caesarea are Devonian. Those southeast of the Dead Sea are the oldest of all, being of Cambrian age.<P>3. Triassic and Jurassic Rocks (J):<P>Several formations which are well developed in the British Islands, are not found in Palestine, but a small Triassic area is found near the Gulf of Alexandretta, while Jurassic strata are found in the region of Hermon and in Lebanon and Anti-Lebanon. The small scale of the accompanying map makes it impossible to represent accurately the extent of these rocks.<P>4. Nubian Sandstone (N):<P>This name was given by Russegger, who in the middle of the 19th century followed and studied this formation from the Sudan to Syria. Wherever the Nubian Sandstone is found in contact with the Upper Cretaceous limestone it underlies the latter conformably. In Lebanon, Anti-Lebanon and Hermon (but not farther south) it is conformably underlaid by Jurassic limestone. It follows, therefore, that its upper strata (the only ones found in the north) must be of Lower or Middle Cretaceous age. In the south, however, the Jurassic limestone is entirely absent. In Western Sinai the Nubian Sandstone rests conformably on Carboniferous limestone, and by the Dead Sea on Cambrian limestone, while at Petra and at many other places it rests unconformably on Crystalline rocks. While the consideration of the age of the Nubian Sandstone presents no difficulty in Lebanon, Anti-Lebanon and Hermon, it is a very different matter in Western Sinai, and by the Dead Sea. Sandstone is generally supposed to be formed more rapidly than most other rocks. It is, therefore, rather staggering to try to conceive of even the 2,000 ft. of sandstone at the southeast end of the Dead Sea as having been in process of formation from the Cambrian to the Cretaceous. The Nubian Sandstone is commonly brown or reddish, but in places shows great variety of color. The temples and tombs of Petra were all carved in this rock. It is in places very friable, and in others compact and hard. The sands of the Arabian deserts have been in the main derived from it, being carried by the prevailing west winds. Where it is covered by a sheet of eruptive rock (charrah), it is protected from erosion, with the result that the land to the east is not converted into a sandy desert (Hogarth, Penetration of Arabia). It frequently includes strata of clay and shale and thin seams of coal or lignite, and must have been deposited in seas which were at the time relatively shallow.<P>5. Upper Cretaceous Limestone (C):<P>This is the principal rock of Palestine, Lebanon, and Anti-Lebanon. Many of its strata are very fossiliferous, and no doubt exists as to its age. It furnishes the best of building stone and is a source of lime. The soils formed from it are fertile, and the mountain sides have been terraced by the patient labor of centuries.<P>6. Tertiary Rocks (T):<P>A notable Tertiary fossil is the Nummulite, which occurs in abundance in the rock of the pyramids of Gizeh and in other places. Relatively small masses of Tertiary strata (not shown on the map) are found on the coast at the mouths of the principal streams of Lebanon, showing that while the mass of Lebanon had risen from the sea by the beginning of the Tertiary, the elevation was not complete. The principal river courses had, however, already been formed, and the streams were already carrying into the sea the scourings of the rocks of early Lebanon, which were being laid down to form these Tertiary strata.<P>7. Quaternary and Recent Strata (R):<P>These consist mainly of the superficial deposits of the Nile, the Euphrates and other large streams. At various points along the coast of Syria and Palestine are extensive sand dunes. Frequently under the loose sand, or exposed, is found a sandstone which instead of being entirely siliceous, like most sandstones, is partly calcareous, containing from 15 to 25 per cent of calcium-carbonate. This is probably an aeolian formation, i.e. consolidated under the influence of the atmosphere, and not formed under the sea, like most stratified rocks. It is easily worked and is much used for building.<P>8. Palestine:<P>It may be gathered from the foregoing statements that the rocks of Palestine are mainly Cretaceous. The Jurassic limestone, which in Lebanon and Anti-Lebanon underlies the Nubian Sandstone, is absent in Palestine, but, at least in Eastern Palestine, as in Lebanon, we find the Upper Cretaceous limestone to be underlaid by the Nubian Sandstone. A striking feature of the geology of Palestine is the Jordan valley fault. At some time, probably at the beginning of the Tertiary period, when Lebanon, Anti-Lebanon, and the Judean hills were being lifted out of the sea, the earth\'s crust was rent for at least several hundred miles along a line nearly north and south, or more exactly from a little west of south to a little east of north. This line runs through the Gulf of \'Aqabah, the Wadi-\'Arabah, the Dead Sea, the Jordan valley, the Sea of Tiberias, the Chuleh, and the valley between Hermon and Anti-Lebanon on the one hand and Lebanon on the other. The resulting disturbance of the strata is most evident in the region of the Dead Sea. There is no evidence that the two walls of the fissure separated from one another, but the east wall slipped up and the west wall down for perhaps 2,000 ft, so that on the east shore of the Dead Sea and in the valleys entering the Jordan, Dead Sea, and \'Arabah from the east, the Nubian Sandstone is exposed, underlying the Upper Cretaceous limestone, while on the west side, even down to the level of the Dead Sea, 1,290 ft. below the Mediterranean, the Nubian Sandstone is nowhere visible, although it may be presumed to exist there also below the upper limestone. (See the accompanying ideal section, after Lartet, through Judea, the Dead Sea and Moab.) The great fault and the subsidiary faults which accompany it occasioned the outpourings of igneous rock which are abundant along the line of the fault. The numerous hot springs (e.g. Tiberins, Wadi-Yarmuk, Wadi-Zarqa-Ma\'in (Callirrhoe), Wadi-ul-Chisa) may be due to subterranean streams of water coming in contact with deeply buried and still heated masses of igneous rock.``37';
isbe[3747]='Geon`ge\'-on.`<a href="./study/isbe/search.html?string=GIHON">GIHON</a>`1';
isbe[3748]='Gephyrun`ge-fi\'-run (Gephuroun): In 2Macc 12:13, referring to the capture by Judas of a stronghold east of Jordan, the Revised Version (British and American) reads, "And he also fell upon a certain city Gephyrun,...it was named Gaspin." There appears to be some confusion in the text. There is nothing to indicate the relation between the two names. the King James Version renders, "He went also about to make a bridge." The name of the city in Josephus (Ant., XII, viii, 5) is <a href="study/isbe/search.html?string=EPHRON">EPHRON</a> (which see).``1';
isbe[3749]='Gera`ge\'-ra (gera\', "grain"): A family name of the tribe of Benjamin, hence, not necessarily a separate individual in (3) and (4) below:<P>(1) A son of Benjamin (<a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a>).<P>(2) According to <a onClick="return mV(\'1Ch\',8,3,5,7);">1Ch 8:3, 5, 7</a>, son of Bela and grandson of Benjamin. The name is repeated (<a onClick="return mV(\'1Ch\',8,5);">8:5</a>) in the list of Bela\'s sons.<P>(3) Father, or ancestor, of the judge Ehud (<a onClick="return mV(\'Jdg\',3,15);">Jud 3:15</a>).<P>(4) Father, or ancestor, of Shimei, the Benjamite, who cursed David when he fled from Absalom (<a onClick="return mV(\'2Sa\',16,5);">2Sa 16:5</a>; <a onClick="return mV(\'2Sa\',19,16,18);">19:16, 18</a>; <a onClick="return mV(\'1Ki\',2,8);">1Ki 2:8</a>).``1';
isbe[3750]='Gerah`ge\'-ra (gerah, "grain" or "kernel"): A weight, the 20th part of a shekel (<a onClick="return mV(\'Exd\',30,13);">Ex 30:13</a>; <a onClick="return mV(\'Lev\',27,25);">Le 27:25</a>; <a onClick="return mV(\'Num\',3,47);">Nu 3:47</a>; <a onClick="return mV(\'Num\',18,16);">18:16</a>; <a onClick="return mV(\'Eze\',45,12);">Eze 45:12</a>).`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[3751]='Gerar`ge\'-rar (gerar, "circle," "region"; Gerara): A town in the Philistine plain south of Gaza (<a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>), where both Abraham and Isaac\'sojourned for a time, and where they came into contact with Abimelech, king of Gerar (<a onClick="return mV(\'Gen\',20,\'1-\');">Ge 20</a> and <a onClick="return mV(\'Gen\',20,\'1-\');">26</A>, passim). The place has not been fully identified, but the site is probably in one of the branches of Wady Sheri\'a, at a place called Um Jerrar, near the coast southwest of Gaza and 9 miles from it (SWP, III, 389-90). The site answers fairly well to the statements of Eusebius and Jerome, Eusebius, Onomasticon, that it was 25 (Roman) miles south of Eleutheropolis (Beit Jibrin). It is actually 30 English miles, but distances were not very accurately determined in early times. Gerar was known in the first 5 centuries AD, when it was the seat of a bishopric, and its bishop, Marcian, attended the Council of Chalcedon 451 AD, It was also the seat of a monastery.<P>The statements in Genesis indicate that Gerar belonged to the Philistines, and we are led to infer that Abimelech was king of that people, but it is quite certain that they did not occupy this region until after the time of Abraham, in fact only a short time before the Exodus. It is probable, however, that the writer of Genesis would refer to the country as it was known in his day. The town certainly existed in the Philistine period, for it is mentioned in connection with Asa, who defeated the Ethiopian host under Zerar and pursued them in their flight unto Gerar (<a onClick="return mV(\'2Ch\',14,13);">2Ch 14:13</a>). Besides the locality of Um Jerrar, another place in the vicinity known as Jurf el-Jerrar has been thought by some to be the site of Gerar. Jerrar in Arabic means "jars," and it is doubtful whether it represents the Hebrew Gerar. Jurf means usually "steep declivity," or "precipice," and at the place mentioned many fragments of pottery were found, but this does not necessarily indicate the site of an ancient town. The site of Gerar is discussed in Thomson\'s LB, I, 196-99 (ed. 1882); Robinson\'s BR, II, 43-44; PEFS, 1871, 84; 1875, 162-64; 1881, 38.``138';
isbe[3752]='Gerasa; Gerasenes`ger\'-a-sa, ger\'-a-senz (Gerasa; Gerasenon):<P>1. Country of the Gerasenes:<P>The town itself is not named in Scripture, and is referred to only in the expression, "country of the Gerasenes" (<a onClick="return mV(\'Mar\',5,1);">Mr 5:1</a>; <a onClick="return mV(\'Luk\',8,26,37);">Lu 8:26, 37</a>; see Westcott and Hort, The New Testament in Greek, Appendix, 11). This describes the district in which Christ met and healed the demoniac from the tombs, where also took place the destruction of the swine. It was on the eastern shore of the Sea of Galilee, and must have been a locality where the steep edges of the Bashan plateau drop close upon the brink of the lake. This condition is fulfilled only by the district immediately south of Wady Semak, north of Qal \'at el-Chucn. Here the slopes descend swiftly almost into the sea, and animals, once started on the downward run, could not avoid plunging into the depths. Many ancient tombs are to be seen in the face of the hills. Gerasa itself is probably represented by the ruins of Kurseh on the south side of Wady Semak, just where it opens on the seashore. The ruins of the town are not considerable; but there are remains of a strong wall which must have surrounded the place. Traces of ancient buildings in the vicinity show that there must have been a fairly numerous population in the district.<P>2. History:<P>The great and splendid city in the Decapolis is first mentioned as taken after a siege by Alexander Janneus, 85 BC (BJ, I, iv, 8). Josephus names it as marking the eastern limit of Peraea (BJ, III, iii, 3). He calls the inhabitants Syrians, when, at the beginning of the Jewish revolt, the district round Gerasa was laid waste. The Syrians made reprisals, and took many prisoners. With these, however, the Gerasenes dealt mercifully, letting such as wished go free, and escorting them to the border (BJ, II, xviii, 1, 5). Lucius Annius, at the instance of Vespasian, sacked and burned the city, with much slaughter (BJ, IV, ix, 1). From this disaster it appears soon to have recovered, and the period of its greatest prosperity lay, probably, in the 2nd and 3nd centuries of our era. It became the seat of a bishopric, and one of its bishops attended the Council of Chalcedon. Reland (Pal, II, 806) notes certain extant coins of Gerasa, from which it is clear that in the 2nd century it was a center of the worship of Artemis. It was besieged by Baldwin II, in 1121 AD. Mention is made of the strength of the site and the mighty masonry of its walls. William of Tyre calls the city Jarras, and places it 16 miles east of Jordan (Hist, xii, 16). The distance is about 19 miles from the river. It was conquered by the Moslems in the time of Omar (Guy le Strange, Palestine under the Moslems, 462). The sultan of Damascus is said to have fortified it; but there is nothing to show that the Moslems occupied it for any length of time.<P>3. Description:<P>Modern Jerash lies on both banks of Wady Jerash, about 6 miles from its confluence with Wady ez-Zerqa (the Jabbok). It is almost 20 miles from Amman (Philadelphia), and 22 from Fahil (Pella). The ruins are wide and imposing and are better preserved than any others on the east of Jordan. They include several splendid temples, theaters, basilica, palaces and baths, with hippodrome and naumachia. The triumphal arch to the south of the city is almost entire. Two paved streets with double colonnades cut through the city at right angles, four massive pedestals still marking the point of intersection. An excellent account of the ruins is given in Thomson\'s LB, III, 558ff.<P>There is nothing above ground of older date than the 2nd and 3rd centuries of our era; but there is no reason to doubt that the Greek city of Gerasa stood on the same site. The presence of a copious spring of sweet water makes it probable that the site has been occupied from olden time; but no trace remains of any ancient city. Some would identify the place with <a href="study/isbe/search.html?string=RAMOTH-GILEAD">RAMOTH-GILEAD</a>, which see.<P>The site is now occupied by a colony of Circassians, and there is reason to fear that, unless something is done to preserve them, many valuable remains of antiquity will perish.``54';
isbe[3753]='Gergesenes`gur\'-ge-senz, gur-ge-senz\':A false reading of "Gadarenes" retained in the King James Version of <a onClick="return mV(\'Mat\',8,28);">Mt 8:28</a>.`<a href="./study/isbe/search.html?string=GADARA">GADARA</a>`1';
isbe[3754]='Gerizim, Mount`ger\'-i-zim, ge-ri\'-zim (har gerizzim):<P>1. Scriptural References:<P>Named in the directions for the reading of the law (<a onClick="return mV(\'Deu\',11,29);">De 11:29</a>), and in the account of that great ceremony (<a onClick="return mV(\'Deu\',27,12);">De 27:12</a>; <a onClick="return mV(\'Jos\',8,33);">Jos 8:33</a>f). Mts. Ebal and Gerizim stood over against each other, and on their sides the peoples were placed, half upon one and half upon the other, while in the vale which separates the mountains stood the ark, with the Levites. Those who stood on Gerizim responded to the blessings, those on Mt. Ebal to the cursings, as these were spoken "with a loud voice" by the Levites. From a spur of Mt. Gerizim Jotham spoke his taunting parable to the men of Shechem (<a onClick="return mV(\'Jdg\',9,7);">Jud 9:7</a>). The name appears no more in canonical Scripture. In consequence of the dispute which arose over the marriage of Manasseh, who belonged to the high-priestly family, with a daughter of Sanballat the Horonite (<a onClick="return mV(\'Neh\',13,28);">Ne 13:28</a>), a temple was built on Gerizim as a rival to that in Jerusalem (circa 432 BC). This was the beginning of the schism which lasts to the present day (Ant., XI, viii,2,4). See <a href="study/isbe/search.html?string=SAMARITANS">SAMARITANS</A>. The temple was destroyed by John Hyrcanus circa 110 BC (Ant., XIII, ix, 1; BJ, I, ii, 6).<P>2. Description:<P>Mt. Gerizim, the modern Jebel et-Tur, stands on the south, Mt. Ebal on the north, of the narrow pass which cuts through the mountain range, opening a way from the sea to the Jordan. In the throat of this pass to the west, on the south of the vale, and close to the foot of Gerizim, lies the town of Nablus, the ancient Shechem. Here copious fountains rise, filling the valley with beauty and fruitfulness. The sides of the mountain are steep and rocky on east and north; on the west the ascent is more gradual, and here, by means of a system of terraces carried almost to the summit, it is cultivated with great care and success. Its height <span class="noTag">is</span> 2,849 ft. above the level of the sea, 228 ft. lower than its northern companion.<P>3. Samaritan Traditions:<P>Abraham came through the pass and camped near Gerizim at the oak of Moreh (<a onClick="return mV(\'Gen\',12,6);">Ge 12:6</a>). According to Samaritan tradition it was on this mountain that he prepared to sacrifice Isaac, and at Salem, not far distant, he met Melchizedek (<a onClick="return mV(\'Gen\',14,17);">Ge 14:17</a>). The scene of Jacob\'s dream is placed at Khirbet Lauzeh on the summit (<a onClick="return mV(\'Gen\',28,11);">Ge 28:11</a>f). In a little hollow west of the ridge, the Samaritans annually celebrate the Passover in accordance with the directions of the Pentateuch. This is done in the open air, their temple having long since disappeared.<P>4. Antiquities:<P>The most important remains on the mountain today are those of Justinian\'s fortress, built in 533 AD, to protect the church which had been erected in 475 AD. Near the center of the plateau is a bare piece of rock, on which, tradition says, the altar stood in the Samaritan temple. A cup-like hollow in it may have been used for libations. In the western wall of el-Qal\'ah, Justinian\'s castle, there are 12 stones under which, it is said, are the stones which Israel took from the bed of the Jordan (<a onClick="return mV(\'Jos\',4,20);">Jos 4:20</a>).<P>Gerizim was certainly "this mountain" pointed to by the woman of Samaria in her conversation with Jesus (<a onClick="return mV(\'Jhn\',4,20);">Joh 4:20</a>f); the cliffs of the mountain almost overhanging the Well of Jacob.<P>For the reason why Gerizim was chosen for the blessing and Ebal for the cursing we are left to conjecture. The directions were fixed by one looking to the east, not, as with us, looking to the north. For one standing in the valley, therefore, Gerizim was on the right hand, "the side of good fortune" (Driver, Deuteronomy on <span class="noTag">11:28</span>).<P>Onom places Ebal and Gerizim much nearer the Jordan valley. This was doubtless to meet the difficulty raised by the long distance from Ai to Shechem. But their nearness to the "oaks of Moreh" (<a onClick="return mV(\'Deu\',11,30);">De 11:30</a>) points to this locality, and this is confirmed by Josephus, who speaks of Shechem, the metropolis of the Samaritans, as "a city situated at Mt. Gerizim" (Ant., XI, viii, 6).<P>Andronicus, appointed governor of Gerizim by Antiochus Epiphanes, is mentioned in 2Macc 5:23 (the King James Version "Garizim").``54';
isbe[3755]='Geron`ge\'-run (Geron): Not much seems to be gained by translating with the Revised Version, margin "Geron, an Athenian," for "an old man of Athens" in 2Macc 6:1.``1';
isbe[3756]='Gerrenians`ge-re\'-ni-anz (heos ton Gerrenon): The name indicates the southern limit of the territory assigned by Antiochus Eupator to the government of Judas Maccabeus when he "left Hegemonides governor from Ptolemais even unto the Gerrenians" (2Macc 13:24, the King James Version "Gerrhenians"). It is not easy to say exactly who the Gerrenians were. They were wrongly associated by Grotius with the town Gerrha, and are with more probability connected with the ancient city of Gerar, southeast of Gaza. One manuscript reads Gerarenon, which could easily be corrupted into Gerrenon, and would place the government of Hegemonides between Ptolemais and Gerar.``79';
isbe[3757]='Gershom`gur\'-shom (gereshom, from garash, "to cast out"; explained, however, in <a onClick="return mV(\'Exd\',2,22);">Ex 2:22</a> and <a onClick="return mV(\'Exd\',18,3);">18:3</A> as from gur, "For he said, I have been a sojourner in a foreign land"):<P>(1) Firstborn son of Moses and Zipporah. The only details of his life contained in the Pentateuch are the account of his circumcision (<a onClick="return mV(\'Exd\',4,25);">Ex 4:25</a>), and his remaining under the care of Jethro, while Moses was in Egypt leading the Exodus. His descendants were numbered among the tribes of Levi (<a onClick="return mV(\'1Ch\',23,14);">1Ch 23:14</a>). One of them apparently was the Jonathan who officiated as priest of the idolatrous sanctuary at Dan, and whose descendants held the office until the captivity. The Massoretic Text inserts a suspended nun, "n," in the name of Moses (mosheh), causing it to be lead Manasseh, for the purpose, according to tradition, of disguising the name out of respect for the revered Lawgiver. Another descendant described as a "son" was Shebuel, a ruler over the treasuries of David.<P>(2) A son of Levi, so called in <a onClick="return mV(\'1Ch\',6,16,17,20,43,62,71);">1Ch 6:16-17, 20, 43, 62, 71 (Hebrew 1,2,5,28,47,56)</a>; <a onClick="return mV(\'1Ch\',15,7);">15:7</a>; elsewhere <a href="study/isbe/search.html?string=GERSHON">GERSHON</A> (which see).<P>(3) A descendant of Phinehas, the head of a father\'s house, who journeyed with Ezra from Babylon to Jerusalem in the reign of Artaxerxes (<a onClick="return mV(\'Ezr\',8,2);">Ezr 8:2</a>).``80';
isbe[3758]='Gershon; Gershonites`gur\'-shon, gur\'-shon-its (gereshon, written also gereshom): Firstborn of the 3 sons of Levi (<a onClick="return mV(\'Exd\',6,16);">Ex 6:16</a>; <a onClick="return mV(\'Num\',3,17);">Nu 3:17</a>; <a onClick="return mV(\'1Ch\',6,1,16);">1Ch 6:1, 16</a>; <a onClick="return mV(\'1Ch\',23,6);">23:6</a>). He had two sons, Libni, also known as Ladan (<a onClick="return mV(\'1Ch\',23,7);">1Ch 23:7</a>; <a onClick="return mV(\'1Ch\',26,21);">26:21</a>), and Shimei (<a onClick="return mV(\'Exd\',6,17);">Ex 6:17</a>; <a onClick="return mV(\'Num\',3,18);">Nu 3:18</a>; <a onClick="return mV(\'1Ch\',6,17,20);">1Ch 6:17, 20</a>), and consequently two groups of descendants, enumerated in the census taken in the Wilderness of Sinai (<a onClick="return mV(\'Num\',3,21);">Nu 3:21</a>) and that in the Plains of Moab (<a onClick="return mV(\'Num\',26,57);">Nu 26:57</a>). In the distribution of functions among the Levites, the Gershonites were charged with the carrying of the curtains, coverings, screens, hangings, cords and instruments of the tabernacle and the tent of meeting on the journeys in the wilderness, under the supervision of Ithamar the son of Aaron. Their function was thus more exalted than that of the Merarites, who carried the boards, and less so than that of the Kohathites, who carried the most holy utensils and symbols. The Gershonites were given two wagons with four oxen—half as many as the Merarites, according to their service (<a onClick="return mV(\'Num\',7,7);">Nu 7:7</a>). Thirteen cities were assigned to the Gershonites in Northern Palestine by Eleazar and Joshua (<a onClick="return mV(\'Jos\',21,6,\'27-33\');">Jos 21:6, 27-33</a> = <a onClick="return mV(\'1Ch\',6,62,\'71-76\');">1Ch 6:62,71-76</a>).<P>Among the Gershonites who achieved distinction in later Biblical times was the family of Asaph, the singers from the time of David to the days of the Second Temple (<a onClick="return mV(\'1Ch\',6,\'31-47\');">1Ch 6:31-47</a>; <a onClick="return mV(\'1Ch\',25,\'1-7\');">25:1-7</a>; <a onClick="return mV(\'1Ch\',15,7,17,19);">15:7, 17, 19</a>; <a onClick="return mV(\'1Ch\',16,5,7);">16:5, 7</a>; <a onClick="return mV(\'2Ch\',25,15);">2Ch 25:15</a>; <a onClick="return mV(\'Ezr\',2,41);">Ezr 2:41</a>; <a onClick="return mV(\'Ezr\',3,10);">3:10</a>; <a onClick="return mV(\'Neh\',11,17,22);">Ne 11:17, 22</a>; <a onClick="return mV(\'Neh\',12,35);">12:35</a>; <a onClick="return mV(\'1Ch\',9,15);">1Ch 9:15</a>). Other Gershonites named are the heads of the fathers\' houses in the days of David in connection with the dividing of the Levites into courses (<a onClick="return mV(\'1Ch\',23,\'7-11\');">1Ch 23:7-11</a>); the superintendents of the treasuries of the house of the Lord of the same time (<a onClick="return mV(\'1Ch\',26,21,22);">1Ch 26:21-22</a>; <a onClick="return mV(\'1Ch\',29,8);">29:8</a>); and, finally, Gershonites are mentioned among those who cleansed the house of the Lord in the days of Hezekiah (<a onClick="return mV(\'2Ch\',29,12,13);">2Ch 29:12-13</a>).``80';
