isbe[4501]='Husks`husks (keratia, i.e. "little horns," <a onClick="return mV(\'Luk\',15,16);">Lu 15:16</a>): These are the pods of the carob tree (Revised Version, margin), also called the locust tree (Ceratonia siliqua). This tree flourishes all over Palestine, especially on the western mountain slopes toward the sea; by the Arabs it is called kharrub. It is dioecious, has dense, dark, evergreen foliage, glossy leaves and long, curved pods, like small horns (hence, the name). These pods which are from 4 to 9 inches in length, have a leathery case containing a pulpy substance in which the beans are imbedded; this pulp is of a pleasant, sweetish flavor and has a characteristic odor, and is much loved by children. The pods are sold in the markets, both as cattle food and for the poor, who extract by boiling them a sweetish substance like molasses. The tradition that the "locusts" of <a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>; <a onClick="return mV(\'Mar\',1,6);">Mr 1:6</a> were carob pods is preserved in the name given to them, "St. John\'s bread," but it has little to be said for it.``117';
isbe[4502]='Huz`huz (<a onClick="return mV(\'Gen\',22,21);">Ge 22:21</a> the King James Version).`<a href="./study/isbe/search.html?string=UZ">UZ</a>`1';
isbe[4503]='Huzzab`huz\'-ab (hutstsabh, only in <a onClick="return mV(\'Nah\',2,7);">Na 2:7</a> the King James Version and the Revised Version margin): Its meaning is doubtful. According to Gesenius, it is a verb, Hoph. of tsabhabh, "flow," hence, to be rendered with preceding verse, "The palace is dissolved and made to flow down." Wordsworth made it Pual of natsabh, "fix": "The palace is dissolved, though established." Septuagint renders with the next word, he hupostasis apokaluphthe, "The foundation (or treasure) is uncovered." the King James Version, the Revised Version margin and the American Standard Revised Version text make it Hoph. of natsabh, "fix," hence, "It is decreed." Perhaps more probably, with the King James Version and the Revised Version (British and American) text and the American Revised Version margin, it is a name, or noun with the article (or the corruption of such a word), referring either to the Assyrian queen, or personifying Nineveh. No such queen is now known, but Assyriology may throw light. The "name" interpretation accords best with the general trend of the passage, which describes the discomfiture of a royal personage. BDB calls it "perhaps textual error." The Massoretic vocalization may be at fault.``31';
isbe[4504]='Hyacinth`hi\'-a-sinth (huakinthos): the Revised Version (British and American) uses this word in <a onClick="return mV(\'Rev\',9,17);">Re 9:17</a> for the King James Version "jacinth," with reference, not to stone, but to dark-purple color. In <a onClick="return mV(\'Rev\',21,20);">Re 21:20</a>, where stone is meant, the Revised Version (British and American) translations "sapphire."``1';
isbe[4505]='Hyades`hi\'-a-dez.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`1';
isbe[4506]='Hydaspes`hi-das\'-pez (Hudaspes): A river mentioned in Judith 1:6 in connection with the Euphrates and Tigris, but otherwise unknown. It is possible there may be a confusion with the Hydaspes of India. Some have conjectured an identity with the Choaspes.``1';
isbe[4507]='Hyena`hi-e\'-na (tsabhua\' (<a onClick="return mV(\'Jer\',12,9);">Jer 12:9</a>); Septuagint huaine (<a onClick="return mV(\'Jer\',12,9);">Jer 12:9</a>; Ecclesiasticus 13:18); compare Arabic dab\' or dabu\', "hyaena"; compare tsebho\'im, Zeboim (<a onClick="return mV(\'1Sa\',13,18);">1Sa 13:18</a>; <a onClick="return mV(\'Neh\',11,34);">Ne 11:34</a>); also compare tsibh\'on, Zibeon (<a onClick="return mV(\'Gen\',36,2,14,20);">Ge 36:2, 14, 20</a>; <a onClick="return mV(\'1Ch\',1,38);">1Ch 1:38</a>); but not tsebhoyim, Zeboiim (<a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>; <a onClick="return mV(\'Gen\',14,2);">14:2</a>, etc.)): English Versions of the Bible does not contain the word "hyena," except in Ecclesiasticus 13:18, "What peace is there between the hyena and the dog? and what; peace between the rich man and the poor?" In <a onClick="return mV(\'Jer\',12,9);">Jer 12:9</a>, where the Hebrew has ha-\'ayit tsabhua\' (the Revised Version (British and American) "a speckled bird of prey"), Septuagint has spelaion huaines, "a hyena\'s den," as if from a Hebrew original having me\'arah, "cave," instead of ha-\'ayit, "bird." The root tsabha\' may mean "to seize as prey" (compare Arabic seb\', "lion" or "rapacious animal"), or "to dip" or "to dye" (compare Arabic cabagh, "to dye"), hence, the two translations of tsabhua\' as "hyena" and as "speckled" (Vulgate versicolor).<P>The hyena of Palestine is the striped hyena (Hyaena striata) which ranges from India to North Africa. The striped, the spotted, and the brown hyenas constitute a distinct family of the order of Carnivora, having certain peculiarities of dentition and having four toes on each foot, instead of four behind and five in front, as in most of the order. The hyena is a nocturnal animal, rarely seen though fairly abundant, powerful but cowardly, a feeder on carrion and addicted to grave-robbing. The last habit in particular has won it the abhorrence of the natives of the countries which it inhabits. In the passage cited in Ecclus, it is to be noted that it is to the hyena that the rich man is compared. The jaws and teeth of the hyena are exceedingly strong and fitted for crushing bones which have resisted the efforts of dogs and jackals. Its dens are in desolate places and are littered with fragments of skeletons. "Is my heritage unto me as a speckled bird of prey?" (<a onClick="return mV(\'Jer\',12,9);">Jer 12:9</a>) becomes a more striking passage if the Septuagint is followed, "Is my heritage unto me as a hyena\'s den?"<P>Shaqq-ud-Diba\', "Cleft of the hyenas," is the name of a valley north of Wadi-ul-Qelt, and Wadi-Abu-Diba\' (of similar meaning) is the name of an affluent of Wadi-ul-Qelt. Either of these, or possibly Wadi-ul-Qelt itself, may be the valley of Zeboim (valley of hyenas) of <a onClick="return mV(\'1Sa\',13,18);">1Sa 13:18</a>.<P>The name of Zibeon the Horite (<a onClick="return mV(\'Gen\',36,2);">Ge 36:2</a>, etc.) is more doubtfully connected with "hyena."``37';
isbe[4508]='Hymenaeus`hi-men-e\'-us (Humenaios, so named from Hymen, the god of marriage, <a onClick="return mV(\'1Ti\',1,20);">1Ti 1:20</a>; <a onClick="return mV(\'2Ti\',2,17);">2Ti 2:17</a>): A heretical teacher in Ephesus, an opponent of the apostle Paul, who in the former reference associates him with Alexander (see <a href="study/isbe/search.html?string=ALEXANDER">ALEXANDER</A>), and in the latter, with Philetus (see <a href="study/isbe/search.html?string=PHILETUS">PHILETUS</A>).<P>1. His Career:<P>It is worthy of notice that in both passages where these persons are mentioned, the name of Hymeneus occurs first, showing, perhaps, that he was the leader. In the passage in 1Ti Hymeneus is included in the "some" who had put away faith and a good conscience and who had made shipwreck concerning faith. The apostle adds that he had delivered Hymeneus and Alexander unto Satan, that they might learn not to blaspheme.<P>2. His Denial of the Resurrection:<P>In the passage in 2 Timothy, Hymeneus and Philetus are included among persons whose profane and vain babblings will increase unto more ungodliness, and whose word "will eat as doth a gangrene." The apostle declares that Hymeneus and Philetus rection are of the number of such people as those just described, and he adds that those two persons "concerning the truth have erred, saying that the resurrection is past already, and overthrow the faith of some." Then, for the guidance of Timothy, he goes on to say the seal upon the foundation of God is, "The Lord knoweth them that are his: and, Let every one that nameth the name of the Lord depart from unrighteousness." The inference intended is, that though Hymeneus and Philetus had named the name of Christ, they did not depart from iniquity. There is no doubt in regard to the identity of this Hymeneus with the person of the same name in 1 Tim. Accordingly, the facts mentioned in the two epistles must be placed together, namely, that though he had made a Christian profession by naming the name of Christ, yet he had not departed from iniquity, but by his profane teaching he proceeded unto more ungodliness, and that he had put away faith and a good conscience and had made shipwreck of faith.<P>The error, therefore, of Hymeneus and his two companions would amount to this: They taught that "the resurrection is past already," that there shall be no bodily resurrection at all, but that all that resurrection means is that the soul awakes from sin. This awakening from sin had already taken place with themselves, so they held, and therefore there could be no day in the future when the dead shall hear the voice of the Son of God and shall come forth from the grave (<a onClick="return mV(\'Jhn\',5,28);">Joh 5:28</a>).<P>3. Incipient Gnosticism:<P>This teaching of Hymeneus had been so far successful: it had "overthrown the faith of some" (<a onClick="return mV(\'2Ti\',2,18);">2Ti 2:18</a>). It is impossible to define exactly the full nature of this heresy, but what Paul says regarding it makes evident that it was a form of incipient Gnosticism. This spiritualizing of the resurrection sprang from the idea of the necessarily evil nature of all material substance. This idea immediately led to the conclusion of the essentially evil nature of the human body, and that if man is to rise to his true nature, he must rid himself of the thralldom, not of sin, but of the body. This contempt for the body led to the denial of the resurrection in its literal sense; and all that Christ had taught on the subject was explained only, in an allegorical sense, of the resurrection of the soul from sin.<P>4. Overthrows Faith:<P>Teaching of this kind is described by Paul as having effects similar to the "eating" caused by a gangrene. It is deadly; it overthrows Christian faith. If not destroyed, it would corrupt the community, for if there is no literal resurrection of the dead, then, as Paul shows in <a onClick="return mV(\'1Cr\',15,\'1-\');">1Co 15</a>, Christ is not raised; and if the literal resurrection of Christ is denied, Christian believers are yet in their sins, and the Christian religion is false.<P>5. Delivered unto Satan:<P>The way in which the apostle dealt with these teachers, Hymeneus and his companions, was not merely in the renewed assertion of the truth which they denied, but also by passing sentence upon these teachers—"whom I delivered unto Satan, that they might be taught not to blaspheme." In regard to the meaning of this sentence much difficulty of interpretation exists. Some understand it to mean simple excommunication from the church. But this seems quite inadequate to exhaust the meaning of the words employed by Paul. Others take it to signify the infliction of some bodily suffering or disease. This also is quite insufficient as an explanation. It seems that a person who was delivered unto Satan was cut off from all Christian privileges, he was "put away" from the body of Christian believers, and handed over to "the Satan," the Evil One in his most distinct personality (<a onClick="return mV(\'1Cr\',5,2,5,13);">1Co 5:2, 5, 13</a>). Compare the cases of Ananias and Sapphira (<a onClick="return mV(\'Act\',5,\'1-\');">Ac 5</a>), and of Elymas (<a onClick="return mV(\'Act\',13,11);">Ac 13:11</a>).<P>It is important that the purpose of this terrible sentence should not be overlooked. The intention of the punishment was distinctly remedial. Both in the case of Hymenacus and Alexander, and in that of the person dealt with in <a onClick="return mV(\'1Cr\',5,\'1-\');">1Co 5</a>, the intention was the attaining of an ultimate good. In 1Co it is "for the destruction of the flesh, that the spirit may be saved in the day of the Lord Jesus." Similarly, Hymeneus and Alexander are delivered unto Satan, not for their final perdition, but that they may be taught, through this terrible discipline—for such is the signification of the word which is translated "taught"—not to blaspheme. The purpose of this discipline, that they might learn not to blaspheme, shows the dreadful length of impiety and of railing at Christian truth to which Hymeneus had gone.<P>6. The "Perverse Things" at Ephesus:<P>In the history of Hymeneus and his companions, and in their bold and anti-Christian teaching which had overthrown the faith of some, we cannot fail to see the fulfillment of what Paul had said many years previously, in his farewell address to the elders of the church in Ephesus: "I know that after my departing grievous wolves shall enter in among you, not sparing the flock; and from among your own selves shall men arise, speaking perverse things, to draw away the disciples after them" (<a onClick="return mV(\'Act\',20,29);">Ac 20:29</a>f). It was in the Ephesian church that Hymeneus and Alexander and Philetus had arisen. The gangrene-like nature of their teaching has already been described.``155';
isbe[4509]='Hymn`him (humnos): In <a onClick="return mV(\'Col\',3,16);">Col 3:16</a>; <a onClick="return mV(\'Eph\',5,19);">Eph 5:19</a> Paul bids his readers sing "psalms and hymns and spiritual songs." Gregory of Nyssa (4th century) distinguishes these as follows: the Psalms were accompanied by instruments, the hymns were mainly vocal, and the song, ode, was a general term comprehending both. This distinction might suggest that the psalm belonged especially to the public worship of the church, while the hymn was the production, more or less spontaneous, of the individual member. The inference is, however, inconsistent with <a onClick="return mV(\'1Cr\',14,26);">1Co 14:26</a>, and it is probable that in the apostolic age, at least, the terms were used indiscriminately. Of Christian psalms or hymns we have examples in the New Testament. <a onClick="return mV(\'Luk\',1,\'1-\');">Lu 1</a> and <a onClick="return mV(\'Luk\',2,\'1-\');">2</a> contain such hymns in the songs of Mary, Zacharias and Simeon. The Apocalypse is studded with hymns or odes, many of them quite general in character, and probably borrowed or adapted from Jewish books of praise. In the Epistles of Paul, especially the later ones, fragments of hymns seem to be quoted. Lightfoot detects one in <a onClick="return mV(\'Eph\',5,14);">Eph 5:14</a>, and others readily suggest themselves.<P>It is probable that the hymn mentioned as having been sung by Jesus and the disciples after the Passover (<a onClick="return mV(\'Mat\',26,30);">Mt 26:30</a>; <a onClick="return mV(\'Mar\',14,26);">Mr 14:26</a>) was the second part of the Hallel, i.e. <a onClick="return mV(\'Psa\',115,\'1-\');">Psalms 115-118</a>, and the hymns of Paul and Silas were most likely also taken from the Psalter. But the practice of interpolating and altering Jewish non-canonical books, like the Psalter of Solomon and the recently discovered Odes of Solomon, shows that the early Christians adopted for devotional purposes the rich store of sacred poetry possessed by their nation. For the music to which these psalms, etc., were sung, see <a href="study/isbe/search.html?string=MUSIC">MUSIC</A>; <a href="study/isbe/search.html?string=SONG">SONG</A>.``120';
isbe[4510]='Hypocrisy; Hyprocrite`hi-pok\'-ri-si, hip\'-o-krit (choneph, chaneph; hupokrisis, hupokrites):<P>(1) "Hypocrisy" occurs only once in the Old Testament as the translation of choneph (<a onClick="return mV(\'Isa\',32,6);">Isa 32:6</a>, the Revised Version (British and American) "profaneness"); chaneph, from which it is derived, means properly "to cover," "to hide," or "becloud," hence, to pollute, to be polluted or defiled, to make profane, to seduce; as a substantive it is translated "hypocrite" (<a onClick="return mV(\'Job\',8,13);">Job 8:13</a>; <a onClick="return mV(\'Job\',13,16);">13:16</a>; <a onClick="return mV(\'Job\',15,34);">15:34</a>; <a onClick="return mV(\'Job\',17,8);">17:8</a>; <a onClick="return mV(\'Job\',20,5);">20:5</a>; <a onClick="return mV(\'Job\',27,8);">27:8</a>; <a onClick="return mV(\'Job\',34,30);">34:30</a>; <a onClick="return mV(\'Job\',36,13);">36:13</a>, in all which instances the Revised Version (British and American) has "godless man," "godless men," "godless"; <a onClick="return mV(\'Pro\',11,9);">Pr 11:9</a>, the Revised Version (British and American) "the godless man"; <a onClick="return mV(\'Isa\',9,17);">Isa 9:17</a>, the Revised Version (British and American) "profane"; <a onClick="return mV(\'Isa\',33,14);">Isa 33:14</a>, the Revised Version (British and American) "the godless ones"); it is rendered "hypocritical," in <a onClick="return mV(\'Psa\',35,16);">Ps 35:16</a>; <a onClick="return mV(\'Isa\',10,6);">Isa 10:6</a>, the Revised Version (British and American) "profane."<P>(2) "Hypocrisy," "hypocrite" are frequent in the New Testament, chiefly in Christ\'s discourses in the Gospels. The word hupokrisis (primarily, "an answer," "response") meant generally, in classical Greek, stageplaying, acting, the histrionic art; hence, it came to mean acting a part in life, etc. We find hupokrisis in this sense in 2Macc 6:25, the Revised Version (British and American) "dissimulation," and hupokrinomai, "to pretend," "to feign," etc. Ecclesiasticus 1:29; 32:15; 33:2, translated "hypocrite"; 2Macc 5:25, "pretending peace," the Revised Version (British and American) "playing the man of peace"; 6:21, the Revised Version (British and American) "to make as if." Hupokrites (literally, "an actor") is the Septuagint for chaneph (<a onClick="return mV(\'Job\',34,30);">Job 34:30</a>; <a onClick="return mV(\'Job\',36,13);">36:13</a>), equivalent to bad, wicked, godless, which is perhaps included in some of our Lord\'s uses of the words, e.g. <a onClick="return mV(\'Mat\',23,27);">Mt 23:27</a>f; "full of hypocrisy and iniquity" (compare <a onClick="return mV(\'Mat\',23,29);">23:29</a>f; <a onClick="return mV(\'Mat\',24,51);">24:51</a>); but, in general, the meaning is acting a part, false, deceptive and deceived, formally and outwardly religious and good, but inwardly insincere and unrighteous; the hypocrite may come to deceive himself as well as others, but "the hypocrite\'s hope shall perish" (<a onClick="return mV(\'Job\',8,13);">Job 8:13</a> the King James Version). On no class did our Lord pronounce such severe condemnation as on the hypocrites of His day.<P>"Hypocrisy" (hupokrisis) occurs in <a onClick="return mV(\'Mat\',23,28);">Mt 23:28</a>; <a onClick="return mV(\'Mar\',12,15);">Mr 12:15</a>; <a onClick="return mV(\'Luk\',12,1);">Lu 12:1</a>; <a onClick="return mV(\'1Ti\',4,2);">1Ti 4:2</a>; <a onClick="return mV(\'1Pe\',2,1);">1Pe 2:1</a> (in <a onClick="return mV(\'Gal\',2,13);">Ga 2:13</a> it is rendered "dissimulation"); "hypocrite" (hupokrites), <a onClick="return mV(\'Mat\',6,2,5,16);">Mt 6:2, 5, 16</a>; <a onClick="return mV(\'Mat\',7,5);">7:5</a>; <a onClick="return mV(\'Mat\',15,7);">15:7</a>; <a onClick="return mV(\'Mat\',22,18);">22:18</a>; <a onClick="return mV(\'Mat\',23,13,15,23,25,29);">23:13, 15, 23, 25ff, 29</a>; <a onClick="return mV(\'Mat\',24,51);">24:51</a>; <a onClick="return mV(\'Mar\',7,6);">Mr 7:6</a>; <a onClick="return mV(\'Luk\',12,56);">Lu 12:56</a>; <a onClick="return mV(\'Luk\',13,15);">13:15</a>; in <a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>, anupokritos is "without hypocrisy," so the Revised Version (British and American), <a onClick="return mV(\'Rom\',12,9);">Ro 12:9</a> ("unfeigned," <a onClick="return mV(\'2Cr\',6,6);">2Co 6:6</a>; <a onClick="return mV(\'1Ti\',1,5);">1Ti 1:5</a>; <a onClick="return mV(\'2Ti\',1,5);">2Ti 1:5</a>; <a onClick="return mV(\'1Pe\',1,22);">1Pe 1:22</a>).``185';
isbe[4511]='Hyrcanus`her-ka\'-nus (Hurkanos): "Son of Tobias, a man of great dignity," who had a large sum of money deposited in the Temple of Jerusalem when Heliodorus was sent to confiscate it in 187 BC (2Macc 3:11ff). Opinions differ as to the identity of this Hyrcanus. with the grandson of Tobias whose birth and history are related at considerable length by Josephus (Ant., XII, iv, 6ff), or with another of the same name mentioned in Ant, XIII, viii, 4.`<a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>; <a href="./study/isbe/search.html?string=MACCABAEUS;+MACCABEES">MACCABAEUS</a>`1';
isbe[4512]='Hyssop`his\'-up (\'ezobh; hussspos, <a onClick="return mV(\'Exd\',12,22);">Ex 12:22</a>; <a onClick="return mV(\'Lev\',14,4,6,49);">Le 14:4, 6, 49</a>ff; <a onClick="return mV(\'Num\',19,6,18);">Nu 19:6, 18</a>; <a onClick="return mV(\'1Ki\',4,33);">1Ki 4:33</a>; <a onClick="return mV(\'Psa\',51,7);">Ps 51:7</a>; <a onClick="return mV(\'Jhn\',19,29);">Joh 19:29</a>; <a onClick="return mV(\'Hbr\',9,19);">Heb 9:19</a>): A plant used for ritual cleansing purposes; a humble plant springing out of the wall (<a onClick="return mV(\'1Ki\',4,33);">1Ki 4:33</a>), the extreme contrast to the cedar.<P>The common hyssop (Hyssopus officinalis) of the Natural Order Labiatae, an aromatic plant with stomatic properties, cannot be the hyssop of the Bible as it is unknown in Palestine, but allied aromatic plants of the same Natural Order have by Maimonides (Neg. xiv.6) and other Jewish writers been identified with it. Probably hyssop is identical with the Arabic zat\'ar, a name applied to a group of aromatic plants of the genus marjoram and thyme. They would any of them furnish a bunch suitable for sprinkling, and they have the important recommendation that they grow everywhere, being found even in the desert. Post thinks of all varieties the Origanum maru, a special variety of marjoram which favors terrace walls and rocks, is the most probable.<P>The proposal (Royle, Jour. Royal Asiatic Soc., VII, 193-213) to identify the caper (Capparis spinosa) with hyssop, which has been popularized by the works of Tristram, has not much to recommend it. It is true that the caper is very commonly seen growing out of walls all over Palestine (<a onClick="return mV(\'1Ki\',4,33);">1Ki 4:33</a>), but in no other respect is it suitable to the requirements of the Biblical references. The supposed similarity between the Arabic \'acaf ("caper") and the Hebrew \'ezobh is fanciful; the caper with its stiff, prickly stems and smooth, flat leaves would not furnish a bunch for sprinkling as serviceable as many species of zat\'ar. It has been specially urged that the hyssop suits the conditions of <a onClick="return mV(\'Jhn\',19,29);">Joh 19:29</a>, it being maintained that a stem of caper would make a good object on which to raise the "sponge full of vinegar" to the Saviour\'s face, the equivalent of the "reed" of <a onClick="return mV(\'Mat\',27,48);">Mt 27:48</a>; <a onClick="return mV(\'Mar\',15,36);">Mr 15:36</a>. For such a purpose the flexible, prickly stems of the hyssop would be most unsuitable; indeed, it would be no easy matter to find one of sufficient length. It is necessary to suppose either that a bunch of hyssop accompanied the sponge with the vinegar upon the reed, or, as has been proposed by several writers (for references see article "Hyssop," EB), that hussopo is a corruption of husso, "javelin," and that the passage should read "They put a sponge full of vinegar upon a javelin."``117';
isbe[4513]='I Will Be``<a href="./study/isbe/search.html?string=GOD,+NAMES+OF">GOD, NAMES OF</a>`1';

isbe[4516]='Iacubus`i-ak\'-u-bus (\'Iakoubos 1Esdras 9:48): "Akkub" in <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>.``1';
isbe[4517]='Iadinus`i-ad\'-i-nus (Iadeinos; 1Esdras 9:48, the King James Version Adinus): Same as Jamin of <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>.``1';
isbe[4518]='Ibhar`ib\'-har (yibhchar, "He (God) chooses"; in Codex Sinaiticus, Codex Vaticanus, Ebear, in Chronicles, Codex Vaticanus, Baar; Codex Alexandrinus, Iebaar): One of David\'s sons, born at Jerusalem; son of a wife and not of a concubine (<a onClick="return mV(\'1Ch\',3,6);">1Ch 3:6</a>; <a onClick="return mV(\'2Sa\',5,15);">2Sa 5:15</a>); otherwise unknown. His name in all three lists follows Solomon\'s.\' In the Peshitta, "Juchabar."``1';
isbe[4519]='Ibis`i\'-bis. In <a onClick="return mV(\'Isa\',34,11);">Isa 34:11</a>, yanshoph, which is rendered "owl," apparently indicates the sacred ibis (Ibis religiosa). The Septuagint gives eibis and Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) ibis; the Revised Version, margin "bittern."`<a href="./study/isbe/search.html?string=OWL">OWL</a>`1';
isbe[4520]='Ibleam`ib\'-le-am (yibhle\'am); A town in the territory of Issachar which was assigned to Manasseh (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>). This tribe, however, failed to expel the inhabitants, so the Canaanites continued to dwell in that land (<a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a>). It was on the route by which Ahaziah fled from Jehu. He was overtaken and mortally wounded "at the ascent of Gur, which is by Ibleam" (<a onClick="return mV(\'2Ki\',9,27);">2Ki 9:27</a>). The name appears as Bileam in <a onClick="return mV(\'1Ch\',6,70);">1Ch 6:70</a>; and it probably corresponds to Belmen of Jth. It is now represented by the ruin of Bel\'ameh on the west of the valley through which the road to the south runs, about half a mile from Jenin. In <a onClick="return mV(\'2Ki\',15,10);">2Ki 15:10</a>, where it is said that Zechariah the son of Jeroboam was slain by Shallum "before the people," this last phrase, which is awkward in the Hebrew, should be amended to read "in Bileam." Possibly "Gath-rimmon" in <a onClick="return mV(\'Jos\',21,25);">Jos 21:25</a> is a clerical error for "Ibleam."``54';
isbe[4521]='Ibneiah`ib-ne\'-ya (yibhneyah, "Yah buildeth up"): A Benjamite, son of Jeroham (<a onClick="return mV(\'1Ch\',9,8);">1Ch 9:8</a>).``1';
isbe[4522]='Ibnijah`ib-ni\'-ja (yibniyah or yibhneyah, "Yah buildeth up"): A Benjamite, father of Reuel (<a onClick="return mV(\'1Ch\',9,8);">1Ch 9:8</a>)``1';
isbe[4523]='Ibri`ib\'-ri (ibhri, "a Hebrew"): A Merarite Levitt, son of Jaaziah (<a onClick="return mV(\'1Ch\',24,27);">1Ch 24:27</a>).``1';
isbe[4524]='Ibsam`ib\'-sam (yibhsam, "fragrant," the King James Version Jibsam): Descendant of Issachar, family of Tolah (<a onClick="return mV(\'1Ch\',7,2);">1Ch 7:2</a>).``1';
isbe[4525]='Ibzan`ib\'-zan (ibhtsan): The 10th judge of Israel. His city is given as Bethlehem (whether of Judah or Zebulun is not stated). He judged Israel 7 years, and when he died he was buried in his native place. The only personal details given about him in the Biblical narrative are that he had 30 sons and a like number of daughters. He sent all of his sons "abroad" for wives and brought husbands from "abroad" for all his daughters. The exact meaning of ha-chuts, "abroad," is mere matter of speculation, but the great social importance of the man and, possibly, alliances among tribes, are suggested in the brief narrative (<a onClick="return mV(\'Jdg\',12,\'8-10\');">Jud 12:8-10</a>). Jewish tradition identifies Ibzan with Boaz of Bethlehem-Judah (Talmud, Babha\', Bathra\', 91a).``80';
isbe[4526]='Ice`is (qerach): Ice is almost unknown in Palestine and Syria except on the highest mountains. At moderate heights of less than 4,000 ft. a little ice may form during the night in winter, but the warm rays of the sun melt it the next day. A great quantity of snow is packed away in caves in the mountains during the winter, and is thus preserved for use in the summer months. The word is found in the Bible in three places where it describes God\'s power. "Out of whose womb came the ice? And the...frost" (<a onClick="return mV(\'Job\',38,29);">Job 38:29</a>); "By the breath of God ice is given" (<a onClick="return mV(\'Job\',37,10);">Job 37:10</a>); "He casteth forth his ice like morsels" (<a onClick="return mV(\'Psa\',147,17);">Ps 147:17</a>).<P>Figurative: Untrue friends are compared to streams "which are black by reason of the ice" (<a onClick="return mV(\'Job\',6,16);">Job 6:16</a>).``85';
isbe[4527]='Ichabod`ik\'-a-bod, i\'-ka-bod (i-kha-bhodh, "inglorious"; Codex Vaticanus, ouai barchaboth; Codex Alexandrinus, ouai chaboth, Atimos): Son of Phinehas, Eli\'s son, slain at the battle of Aphek when the ark was taken. Ichabod was born after his father\'s death. His mother gave him this name on her death-bed to indicate that the "glory (had) departed from Israel" (<a onClick="return mV(\'1Sa\',4,19);">1Sa 4:19</a>). He was thus important as a symbol, though little is recorded of him as an individual. His nephew Ahijah was one of those who tarried with Saul and the six hundred at Gibeah just before Jonathan\'s brave attack upon the Philistines (<a onClick="return mV(\'1Sa\',14,2);">1Sa 14:2</a>f).``186';
isbe[4528]='Iconium`i-ko\'-ni-um (Ikonion, also Eikonion, on inscriptions): Iconium was visited by Paul on his first and on his second missionary journey (<a onClick="return mV(\'Act\',13,51);">Ac 13:51</a>ff; <a onClick="return mV(\'Act\',16,3);">16:2</a>), and if the "South Galatian theory" be correct, probably also on his third journey. His sufferings there are referred to in <a onClick="return mV(\'2Ti\',3,11);">2Ti 3:11</a>.<P>1. Topographical Position:<P>The topographical position of Iconium is clearly indicated in Acts, and the evidence of Acts has been confirmed by recent research. Was Iconium in Phrygia or in Lycaonia, and in what sense can it be said to have belonged to one ethnical division or the other? The majority of our ancient authorities (e.g. Cicero, Strabo, Pliny), writing from the point of view of Roman provincial administration, give Iconium to Lycaonia, of which geography makes it the natural capital. But Xenophon, who marched with Cyrus\' expedition through Phrygia into Lycaonia, calls Iconium the last city of Phrygia. The writer of <a onClick="return mV(\'Act\',14,6);">Ac 14:6</a> makes the same statement when he represents Paul and Barnabas as fleeing from Iconium to the cities of Lycaonia—implying that the border of Phrygia and Lycaonia passed between Iconium and Lystra, 18 miles to the south. Other ancient authorities who knew the local conditions well speak of Iconium as Phrygian until far into the Roman imperial period. At the neighboring city of Lystra (<a onClick="return mV(\'Act\',14,11);">Ac 14:11</a>), the natives used the "speech of Lycaonia." Two inscriptions in the Phrygian language found at Iconium in 1910 prove that the Phrygian language was in use there for 2 centuries after Paul\'s visits, and afford confirmation of the interesting topographical detail in Acts (see Jour. Hell. Stud.,1911,189).<P>2. In Apostolic Period:<P>In the apostolic period, Iconium was one of the chief cities in the southern part of the Roman province Galatia, and it probably belonged to the "Phrygian region" mentioned in <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>. The emperor Claudius conferred on it the title Claudiconium, which appears on coins of the city and on inscriptions, and was formerly taken as a proof that Claudius raised the city to the rank of a Roman colonia. It was Hadrian who raised the city to colonial rank; this is proved by its new title, Colonia Aelia Hadriana Iconiensium, and by a recently discovered inscription, which belongs to the reign of Hadrian, and which mentions the first duumvir who was appointed in the new colonia. Iconium was still a Hellenic city, but with a strong pro-Roman bias (as proved by its title "Claudian") when Paul visited it.<P>3. Later History:<P>About 295 AD, an enlarged province, Pisidia, was formed, with Antioch as capital, and Iconium as a "sort of secondary metropolis." The Byzantine arrangement, familiar to us in the Notitiae Episcopatuum, under which Iconium was the capital of a province Lycaonia, dates from about 372 AD. Iconium, the modern Konia, has always been the main trading center of the Lycaonian Plain. Trade attracted Jews to the ancient Phrygio-Hellenic city (<a onClick="return mV(\'Act\',14,1);">Ac 14:1</a>), as it attracts Greeks and Armenians to the modern Turkish town.<P>4. Thekla:<P>Paul\'s experiences at Iconium form part of theme of the semi-historical legend of Thekla, on which see Professor Ramsay\'s Church in the Roman Empire, 380ff.<P>LITERATURE.<P>Ramsay Historical Commentary on Paul\'s Epistle to the Galatians, 214ff; Cities of Paul, 317ff. To the literature referred to in the notes to the latter book (pp. 448ff) add Ath. Mitth.,1905, 324ff; Revue de Philologie,1912, 48ff; Journal Hellenic Studies,1911, 188ff.``20';
isbe[4529]='Idalah`id\'-a-la, i-da\'-la (yidh\'alah): A town in the territory of Zebulun, named with Shimron and Beth-lehem (<a onClick="return mV(\'Jos\',19,15);">Jos 19:15</a>). The Talmud identifies it with Churyeh (Talm Jerusalem on Megh., I, 1). This, Conder thinks, may be represented by the modern Khirbet el-Chuwara to the south of Beit Lachm.``1';
isbe[4530]='Idbash`id\'-bash (yidhbash, "honeysweet"(?)): A man of Judah, one of the sons of the father of Etam (<a onClick="return mV(\'1Ch\',4,3);">1Ch 4:3</a>; Septuagint "sons of Etam").``1';
isbe[4531]='Iddo`id\'-o:<P>(1) (\'iddo (? \'adhadh, "to be strong"), "hap," "happy" (?),<a onClick="return mV(\'Ezr\',8,17);">Ezr 8:17</a>): The "chief at the place Casiphia," who provided Ezra with Levites and Nethinim, the head of the Levitical body or school, said to be one of the Nethinim or temple slaves, but perhaps an "and" has slipped out, and it should read: "his brethren and the Nethinim." 1Esdras 8:45,46 has "Loddeus (the King James Version "Saddeus"), the captain who was in the place of the treasury," keceph meaning silver. Septuagint has "in the place of the silver (en argurio tou topou)...to his brethren and to the treasurers."<P>(2) (yiddo, "beloved," or "loving," <a onClick="return mV(\'1Ch\',27,21);">1Ch 27:21</a>): Son of Zechariah, and captain of the half-tribe of Manasseh in Gilead, under David.<P>(3) (yiddo, "beloved," or "loving," <a onClick="return mV(\'Ezr\',10,43);">Ezr 10:43</a>): One of those who had taken foreign wives. Another reading is Jaddai, the King James Version "Jadau." In 1Esdras 9:35 "Edos" (the King James Version "Edes").<P>(4) (\'iddo\', "timely," <a onClick="return mV(\'1Ki\',4,14);">1Ki 4:14</a>): Father of Abinadab, Solomon\'s commissary in Mahanaim in Gilead.<P>(5) (yiddo, "beloved," or "loving," <a onClick="return mV(\'1Ch\',6,21);">1Ch 6:21</a>): A Gershomite Levite, son of Joah, called Adaiah in verse 41; ancestor of Asaph.<P>(6) (ye\'do (Kethibh ye\'di), or \'iddo, "decked," "adorned"): Seer (chozeh) and prophet (nabhi), the Chronicler\'s "source" for the reign of Solomon (<a onClick="return mV(\'2Ch\',9,29);">2Ch 9:29</a>): "The visions of Iddo the seer concerning Jeroboam the son of Nebat"; and for the reign of Rehoboam (<a onClick="return mV(\'2Ch\',12,15);">2Ch 12:15</a>): "The histories of Iddo (\'iddo) the seer, after the manner of (or, "in reckoning") genealogies"; and for the reign of Abijah (<a onClick="return mV(\'2Ch\',13,22);">2Ch 13:22</a>): "The commentary (midhrash) of the prophet Iddo" (\'iddo). He may have been the prophet who denounced Jeroboam (<a onClick="return mV(\'1Ki\',13,\'1-\');">1Ki 13</a>), who is called by Josephus and Jerome Jadon, or Jaddo. Jerome makes Iddo and Oded the same.<P>(7) (\'iddo, "timely," <a onClick="return mV(\'Zec\',1,1);">Zec 1:1</a>): Grandfather (father, according to Ezra) of the prophet, Zechariah. See also <a onClick="return mV(\'Zec\',1,7);">Zec 1:7</a>; <a onClick="return mV(\'Ezr\',5,1);">Ezr 5:1</a>; <a onClick="return mV(\'Ezr\',6,14);">6:14</a> (\'iddo\'). In 1Esdras 6:1, "Addo."<P>(8) (\'iddo\', "decked," "adorned," <a onClick="return mV(\'Neh\',12,4,16);">Ne 12:4, 16</a>): A priest who went up with Zerubbabel (<a onClick="return mV(\'Neh\',12,4);">12:4</a>); one of the priestly clans which went up (<a onClick="return mV(\'Neh\',12,16);">12:16</a>); perhaps same as (7).``31';
isbe[4532]='Idle; Idleness`i\'-d\'-l, i\'-d\'-l-nes: Both words, adjective and noun, render different Hebrew words (from \'atsel, "to be lazy," raphah, "to relax," and shaqaT, "to be quiet"). According to the Yahwistic narrative Pharaoh\'s retort to the complaints of the Israelites was a charge of indolence (<a onClick="return mV(\'Exd\',5,8,17);">Ex 5:8, 17</a>). It was a favorite thought of Hebrew wisdom—practical philosophy of life—that indolence inevitably led to poverty and want (<a onClick="return mV(\'Pro\',19,15);">Pr 19:15</a>; <a onClick="return mV(\'Ecc\',10,18);">Ec 10:18</a>). The "virtuous woman" was one who would not eat the "bread of idleness" (<a onClick="return mV(\'Pro\',31,27);">Pr 31:27</a>). In <a onClick="return mV(\'Eze\',16,49);">Eze 16:49</a> for the King James Version "abundance of idleness," the Revised Version (British and American) has "prosperous ease." In the New Testament "idle" generally renders the Greek word argos, literally, "inactive," "useless" (<a onClick="return mV(\'Mat\',20,3,6);">Mt 20:3, 6</a>). In <a onClick="return mV(\'Luk\',24,11);">Lu 24:11</a> "idle talk" corresponds to one Greek word which means "empty gossip" or "nonsensical talk."``103';
isbe[4533]='Idolatry`i-dol\'-a-tri (teraphim, "household idols," "idolatry"; eidololatreia): There is ever in the human mind a craving for visible forms to express religious conceptions, and this tendency does not disappear with the acceptance, or even with the constant recognition, of pure spiritual truths (see <a href="study/isbe/search.html?string=IMAGES">IMAGES</A>). Idolatry originally meant the worship of idols, or the worship of false gods by means of idols, but came to mean among the Old Testament Hebrews any worship of false gods, whether by images or otherwise, and finally the worship of Yahweh through visible symbols (<a onClick="return mV(\'Hsa\',8,5,6);">Ho 8:5-6</a>; <a onClick="return mV(\'Hsa\',10,5);">10:5</a>); and ultimately in the New Testament idolatry came to mean, not only the giving to any creature or human creation the honor or devotion which belonged to God alone, but the giving to any human desire a precedence over God\'s will (<a onClick="return mV(\'1Cr\',10,14);">1Co 10:14</a>; <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>; <a onClick="return mV(\'Col\',3,5);">Col 3:5</a>; <a onClick="return mV(\'1Pe\',4,3);">1Pe 4:3</a>). The neighboring gods of Phoenicia, Canaan, Moab—Baal, Melkart, Astarte, Chemosh, Moloch, etc.—were particularly attractive to Jerusalem, while the old Semitic calf-worship seriously affected the state religion of the Northern Kingdom (see <a href="study/isbe/search.html?string=GOLDEN+CALF">GOLDEN CALF</a>). As early as the Assyrian and Babylonian periods (8th and 7th centuries BC), various deities from the Tigris and Euphrates had intruded themselves—the worship of Tammuz becoming a little later the most popular and seductive of all (<a onClick="return mV(\'Eze\',8,14);">Eze 8:14</a>)—while the worship of the sun, moon, stars and signs of the Zodiac became so intensely fascinating that these were introduced even into the temple itself (<a onClick="return mV(\'2Ki\',17,16);">2Ki 17:16</a>; <a onClick="return mV(\'2Ki\',21,\'3-7\');">21:3-7</a>; <a onClick="return mV(\'2Ki\',23,4,12);">23:4, 12</a>; <a onClick="return mV(\'Jer\',19,13);">Jer 19:13</a>; <a onClick="return mV(\'Eze\',8,16);">Eze 8:16</a>; <a onClick="return mV(\'Amo\',5,26);">Am 5:26</a>).<P>The special enticements to idolatry as offered by these various cults were found in their deification of natural forces and their appeal to primitive human desires, especially the sexual; also through associations produced by intermarriage and through the appeal to patriotism, when the help of some cruel deity was sought in time of war. Baal and Astarte worship, which was especially attractive, was closely associated with fornication and drunkenness (<a onClick="return mV(\'Amo\',2,7,8);">Am 2:7-8</a>; compare <a onClick="return mV(\'1Ki\',14,23);">1Ki 14:23</a>f), and also appealed greatly to magic and soothsaying (e.g. <a onClick="return mV(\'Isa\',2,6);">Isa 2:6</a>; <a onClick="return mV(\'Isa\',3,2);">3:2</a>; <a onClick="return mV(\'Isa\',8,19);">8:19</a>).<P>Sacrifices to the idols were offered by fire (<a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>); libations were poured out (<a onClick="return mV(\'Isa\',57,6);">Isa 57:6</a>; <a onClick="return mV(\'Jer\',7,18);">Jer 7:18</a>); the first-fruits of the earth and tithes were presented (<a onClick="return mV(\'Hsa\',2,8);">Ho 2:8</a>); tables of food were set before them (<a onClick="return mV(\'Isa\',65,11);">Isa 65:11</a>); the worshippers kissed the idols or threw them kisses (<a onClick="return mV(\'1Ki\',19,18);">1Ki 19:18</a>; <a onClick="return mV(\'Hsa\',13,2);">Ho 13:2</a>; <a onClick="return mV(\'Job\',31,27);">Job 31:27</a>); stretched out their hands in adoration (<a onClick="return mV(\'Isa\',44,20);">Isa 44:20</a>); knelt or prostrated themselves before them and sometimes danced about the altar, gashing themselves with knives (<a onClick="return mV(\'1Ki\',18,26,28);">1Ki 18:26, 28</a>; for a fuller summary see EB).<P>Even earlier than the Babylonian exile the Hebrew prophets taught that Yahweh was not only superior to all other gods, but reigned alone as God, other deities being nonentities (<a onClick="return mV(\'Lev\',19,4);">Le 19:4</a>; <a onClick="return mV(\'Isa\',2,8,18,20);">Isa 2:8, 18, 20</a>; <a onClick="return mV(\'Isa\',19,1,3);">19:1, 3</a>; <a onClick="return mV(\'Isa\',31,7);">31:7</a>; <a onClick="return mV(\'Isa\',44,\'9-20\');">44:9-20</a>). The severe satire of this period proves that the former fear of living demons supposed to inhabit the idols had disappeared. These prophets also taught that the temple, ark and sacrifices were not essential to true spiritual worship (e.g. <a onClick="return mV(\'Jer\',3,16);">Jer 3:16</a>; <a onClick="return mV(\'Amo\',5,\'21-25\');">Am 5:21-25</a>). These prophecies produced a strong reaction against the previously popular idol-worship, though later indications of this worship are not infrequent (<a onClick="return mV(\'Eze\',14,\'1-8\');">Eze 14:1-8</a>; <a onClick="return mV(\'Isa\',42,17);">Isa 42:17</a>). The Maccabean epoch placed national heroism plainly on the side of the one God, Yahweh; and although Greek and Egyptian idols were worshipped in Gaza and Ascalon and other half-heathen communities clear down to the 5th or 6th century of the Christian era, yet in orthodox centers like Jerusalem these were despised and repudiated utterly from the 2nd century BC onward.<P>LITERATURE.<P>Wm. Wake, A Discourse concerning the Nature of Idolatry, 1688; W.R. Smith, Lectures on the Religion of the Semites; E.B. Tylor, Primitive Culture; J.G. Frazer, Golden Bough (3 vols); L.R. Farnell, Evolution of Religion, 1905; Baudissin, Studien zur semitischen Religionsgeschichte; Beathgen, Der Gott Israels u. die Gotter der Heiden, 1888.`<a href="./study/isbe/search.html?string=GOLDEN+CALF">GOLDEN CALF</a>; <a href="./study/isbe/search.html?string=GODS">GODS</a>; <a href="./study/isbe/search.html?string=IMAGES">IMAGES</a>; <a href="./study/isbe/search.html?string=TERAPHIM">TERAPHIM</a>`26';
isbe[4534]='Iduel`id\'-u-el (Idouelos): 1Esdras 8:43, English versions, margin "<a href="study/isbe/search.html?string=ARIEL">ARIEL</a>" (which see).``1';
isbe[4535]='Idumaea; Idumaeans`id-u-me\'-a, id-u-me\'-anz.`<a href="./study/isbe/search.html?string=EDOM;+EDOMITES">EDOM</a>`1';
isbe[4536]='Ieddias`yed-i\'-as, i-ed-i\'-as, the King James Version Eddias (Ieddias): One who agreed to put away his foreign wife (1Esdras 9:26); called also "Jezeias."``1';
isbe[4537]='Iezer; Iezerites`i-e\'-zer, i-e\'-zer-its (\'i\'ezer, <a onClick="return mV(\'Num\',26,30);">Nu 26:30</a>): Contracted from <a href="study/isbe/search.html?string=ABIEZER">ABIEZER</A> (<a onClick="return mV(\'Jos\',17,2);">Jos 17:2</a>, etc.) (which see).``1';
isbe[4538]='Igal`i\'-gal (yigh\'al, "he (God) redeems"; Septuagint variously Igal, Gaal, Ieol):<P>(1) One of the twelve spies sent by Moses from the wilderness of Paran; son of Joseph, tribe of Issachar (<a onClick="return mV(\'Num\',13,7);">Nu 13:7</a>).<P>(2) One of David\'s heroes, son of Nathan of Zobah (<a onClick="return mV(\'2Sa\',23,36);">2Sa 23:36</a>). In <a onClick="return mV(\'1Ch\',11,38);">1Ch 11:38</a> he is "Joe (yo\'el), the brother of Nathan."<P>(3) Son of Shemaiah of the royal house of David, descendant of Zerubbabel (<a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>, the King James Version "Igeal").``1';
isbe[4539]='Igdaliah`ig-da-li\'-a (yighdalyahu, "Yah is great"): Ancestor of certain persons who had a "chamber" in the temple in Jeremiah\'s time (<a onClick="return mV(\'Jer\',35,4);">Jer 35:4</a>).``1';
isbe[4540]='Igeal`i\'-ge-al, i\'-je-al (yigh\'al, "he (i.e. God) redeems"): A remote descendant of David (<a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>, the Revised Version (British and American) "Igal").``1';
isbe[4541]='Ignorance`ig\'-no-rans (sheghaghah; agnoia): "Ignorance" is the translation of sheghaghah, "wandering," "going astray" (<a onClick="return mV(\'Lev\',4,2);">Le 4:2</a>, etc., "if a soul sin through ignorance," the Revised Version (British and American) "unwittingly," margin "through error"; <a onClick="return mV(\'Lev\',5,15);">Le 5:15</a>; <a onClick="return mV(\'Num\',15,24);">Nu 15:24</a>ff; compare <a onClick="return mV(\'Num\',35,11);">35:11</a>; <a onClick="return mV(\'Jos\',20,3);">Jos 20:3</a>ff; <a onClick="return mV(\'Ecc\',5,6);">Ec 5:6</a>; <a onClick="return mV(\'Ecc\',10,5);">10:5</a>, "an error"). In the Law sheghaghah means "innocent error," such as had to be taken with consideration in judgment (see passages referred to). "Ignorance" is also expressed by the negative lo\' with yadha\', "to know" (<a onClick="return mV(\'Isa\',56,10);">Isa 56:10</a>; <a onClick="return mV(\'Isa\',63,16);">63:16</a>; <a onClick="return mV(\'Psa\',73,22);">Ps 73:22</a>); also by bi-bheli da\'ath, literally, "in want of knowledge" (<a onClick="return mV(\'Deu\',19,4);">De 19:4</a>; compare <a onClick="return mV(\'Deu\',4,12);">De 4:12</a>; <a onClick="return mV(\'Jos\',20,5);">Jos 20:5</a>, translated "unawares," "unwittingly").<P>In the New Testament the words are agnoia, "absence of knowledge" (<a onClick="return mV(\'Act\',3,17);">Ac 3:17</a>; <a onClick="return mV(\'Act\',17,30);">17:30</a>; <a onClick="return mV(\'Eph\',4,18);">Eph 4:18</a>; <a onClick="return mV(\'1Pe\',1,14);">1Pe 1:14</a>); agneoma, "error" (<a onClick="return mV(\'Hbr\',9,7);">Heb 9:7</a>, the Revised Version margin "Greek: ignorances"); agnosia, "ignorance" (<a onClick="return mV(\'1Pe\',2,15);">1Pe 2:15</a>), "no knowledge" (<a onClick="return mV(\'1Cr\',15,34);">1Co 15:34</a> the Revised Version (British and American)); agnoeo, "to be without knowledge," "ignorant" (<a onClick="return mV(\'Rom\',1,13);">Ro 1:13</a>; <a onClick="return mV(\'Rom\',10,3);">10:3</a>; <a onClick="return mV(\'Rom\',11,25);">11:25</a>, etc.), "not knowing" (<a onClick="return mV(\'Rom\',2,4);">Ro 2:4</a>, etc.), "understood not" (<a onClick="return mV(\'Mar\',9,32);">Mr 9:32</a>, etc.), "ignorantly" (<a onClick="return mV(\'Act\',17,23);">Ac 17:23</a>, the Revised Version (British and American) "in ignorance"; <a onClick="return mV(\'1Ti\',1,13);">1Ti 1:13</a>); idiotes, translated "ignorant" (<a onClick="return mV(\'Act\',4,13);">Ac 4:13</a>), "unlearned" (<a onClick="return mV(\'1Cr\',14,16);">1Co 14:16</a>, the Revised Version margin "him that is without gifts," and so in <a onClick="return mV(\'1Cr\',14,23,24);">1Co 14:23-24</a>), "rude" (<a onClick="return mV(\'2Cr\',11,6);">2Co 11:6</a>); agrammatos, once only in connection with idiotes (<a onClick="return mV(\'Act\',4,13);">Ac 4:13</a>, "unlearned and ignorant men"); agrammatos corresponds to modern "illiterate" (compare <a onClick="return mV(\'Jhn\',7,15);">Joh 7:15</a>; <a onClick="return mV(\'Act\',26,24);">Ac 26:24</a>); idiotes originally denoted "the private man" as distinguished from those with a knowledge of affairs, and took on the idea of contempt and scorn. In Philo it denoted the whole congregation of Israel as distinguished from the priests (De Vita Mosis, III 29). With Paul (<a onClick="return mV(\'1Cr\',14,16,23,24);">1Co 14:16, 23-24</a>) it seems to denote "plain believers as distinguished from those with special spiritual gifts." In <a onClick="return mV(\'Act\',4,13);">Ac 4:13</a> it may refer to the want of Jewish learning; certainly it does not mean ignorant in the modern sense.<P>Paul in <a onClick="return mV(\'Rom\',1,18,23);">Ro 1:18, 32</a> attributes the pre-Christian ignorance of God to "the ungodliness and unrighteousness of men, who hinder the truth in unrighteousness" (but the margin has, with the King James Version, "hold the truth, compare <a onClick="return mV(\'1Cr\',7,30);">1Co 7:30</a>, Gr"); many, however (Alford, De Wette, Meyer and others), translation "hold back the truth." A willful ignorance is also referred to in <a onClick="return mV(\'Eph\',4,17);">Eph 4:17</a>f; <a onClick="return mV(\'2Pe\',3,5);">2Pe 3:5</a>. But there is also a less blameworthy ignorance. Paul at Athens spoke of "times of ignorance" which God had "overlooked" (<a onClick="return mV(\'Act\',17,30);">Ac 17:30</a>); Paul says of himself that he "obtained mercy, because (he) did it (against Christ) ignorantly in unbelief" (<a onClick="return mV(\'1Ti\',1,13);">1Ti 1:13</a>); Peter said to the Jews (<a onClick="return mV(\'Act\',3,17);">Ac 3:17</a>) that they and their rulers rejected Christ "in ignorance" (compare <a onClick="return mV(\'1Cr\',2,8);">1Co 2:8</a>); and Jesus Himself prayed for those who crucified Him: "Father, forgive them; for they know not what they do"; (<a onClick="return mV(\'Luk\',23,34);">Lu 23:34</a>); in <a onClick="return mV(\'Hbr\',5,2);">Heb 5:2</a> the necessary qualification of a high priest is that he "can bear gently with the ignorant and erring"—those who sin in ignorance or go astray (compare <a onClick="return mV(\'Hbr\',9,7);">9:7</a>, "blood, which he offereth for himself, and for the errors of the people," margin "(Greek: ignorances"). Growing light, however, brings with it increasing responsibility, and the "ignorance" that may be "overlooked" at one stage of the history of men and nations may be blameworthy and even criminal at another.``185';
isbe[4542]='Iim`i\'-im (\'iyim): Same as <a href="study/isbe/search.html?string=IYIM">IYIM</a> (which see).``1';
isbe[4543]='Ije-Abarim`i-je-ab\'-a-rim.`<a href="./study/isbe/search.html?string=IYE+ABARIM">IYE-ABARIM</a>`1';
isbe[4544]='Ijon`i\'-jon (\'iyon; Septuagint in Kings has Ain, or Nain; in Chronicles Ion; Aion): A town in the territory of Naphtali, first mentioned in connection with the invasion of Ben-hadad, in the reign of Baasha. It was captured along with Dan and Abel-beth-maacah (<a onClick="return mV(\'1Ki\',15,20);">1Ki 15:20</a>; <a onClick="return mV(\'2Ch\',16,4);">2Ch 16:4</a>). It shared with these cities a similar fate at the hands of Tiglath-pileser in the reign of Pekah (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). The name survives in that of Merj A\'yun, "meadow of springs," a rich, oval-shaped plain to the northwest of Tell el Qady, where the Litany turns sharply westward to the sea. The ancient city may be represented by Tell Dibbin, an important site to the north of the plain.``54';
isbe[4545]='Ikkesh`ik\'-esh (\'iqqesh, "crooked"): A Tekoite, father of Ira, one of David\'s "thirty" (<a onClick="return mV(\'2Sa\',23,26);">2Sa 23:26</a>; <a onClick="return mV(\'1Ch\',11,28);">1Ch 11:28</a>; <a onClick="return mV(\'1Ch\',27,9);">27:9</a>).``1';
isbe[4546]='Ilai`i\'-la-i, i\'-li (\'ilay): A mighty man of David (<a onClick="return mV(\'1Ch\',11,29);">1Ch 11:29</a>); called Zalmon in <a onClick="return mV(\'2Sa\',23,28);">2Sa 23:28</a>.``1';
isbe[4547]='Iliadun`i-li\'-a-dun, il\'-i-ad-un (Eliadoun, 1Esdras 5:58; the King James Version Eleadun): Possibly corresponding to Henadad in <a onClick="return mV(\'Ezr\',3,9);">Ezr 3:9</a>.``1';
isbe[4548]='Ill; Ill-Favored`il, il-fa\'-verd.`<a href="./study/isbe/search.html?string=EVIL+FAVOREDNESS">EVIL-FAVOREDNESS</a>`1';
isbe[4549]='Illumination`i-lu-mi-na\'-shun: <a onClick="return mV(\'Hbr\',10,32);">Heb 10:32</a> the King James Version, only, "the former days, in which, after ye were illuminated (the Revised Version (British and American) "enlightened"), ye endured a great fight of afflictions." The verb is photizo, rendered in <a onClick="return mV(\'Hbr\',6,4);">6:4</A> by "enlightened" and in both passages (and not elsewhere in the New Testament) being used to describe complete conversion. The verb, indeed, is used in such a technical way that Syriac versions render by "baptized," and it is not perhaps impossible that the author of He had baptism definitely in mind. (In the early church baptism is frequently described as "illumination," e.g. Justin, Apol., i.61.) But this probably would go too far; the most that can be said is that he means the state of mind of a full Christian and not that of a catechumen (compare also Baruch 4:2 the King James Version; Sirach 25:11).``48';
isbe[4550]='Illustrious, the`i-lus\'-tri-us (thaumastos): A title of rank and merit attached to the name of Bartacus, the father of Apame (1Esdras 4:29, the King James Version "the admirable). Instead of "the illustrious" we should possibly read "colonel" (Ant., XI, iii, 5; EB, under the word).`<a href="./study/isbe/search.html?string=BARTACUS">BARTACUS</a>; <a href="./study/isbe/search.html?string=APAME">APAME</a>`1';
isbe[4551]='Illyricum`i-lir\'-i-kum (Illurikon): A province of the Roman Empire, lying east and northeast of the Adriatic Sea. In his Epistle to the Romans Paul emphasizes the extent of his missionary activities in the assertion that "from Jerusalem, and round about even unto Illyricum, I have fully preached the gospel of Christ" (<a onClick="return mV(\'Rom\',15,19);">15:19</A>). An examination of this statement involves three questions: What is the force of the preposition "even unto" (mechri)? What meaning is borne by the word Illyricum? and, At what period of his missionary career did Paul reach the limit here spoken of?<P>1. Force of "even unto":<P>In Greek, as in English, the preposition "unto" may either be exclusive or inclusive. In other words, Paul may mean that he has preached throughout Macedonia as far as the Illyrian frontier, or his words may involve a journey within Illyricum itself, extending perhaps to Dyrrhachium (mod. Durazzo) on the Adriatic seaboard, which, though belonging politically to Macedonia, lay in "Greek, Illyria." But since no word is said in the Acts of any extension of Paul\'s travels beyond the confines of Macedonia, and since the phrase, "I have fully preached," precludes a reference to a hurried or cursory tour in Illyricum, we should probably take the word "unto" in its exclusive sense, and understand that Paul claims to have evangelized Macedonia as far as the frontier of Illyricum.<P>2. Meaning of "Illyricum":<P>What, then, does the word "Illyricum" denote? It is sometimes used, like the Greek terms Illyris and Illyria, to signify a vast area lying between the Danube on the north and Macedonia and Thrace on the south, extending from the Adriatic and the Alps to the Black Sea, and inhabited by a number of warlike and semi-civilized tribes known to the Greeks under the general title of Illyrians (Appian, Illyr. 1; Suetonius, Tiberius, 16); it thus comprised the provinces of Illyricum (in the narrower sense), Pannonia and Moesia, which for certain financial and military purposes formed a single administrative area, together with a strip of coast land between Dalmatia and Epirus and, at a later date, Dacia. Appian (Illyr. 6) even extends the term to include Raetia and Noricum, but in this he appears to be in error. But Illyricum has also a narrower and more precise meaning, denoting a single Roman province, which varied in extent with the advance of the Roman conquest but was finally organized in 10 AD by the emperor Augustus. At first it bore the name superior provincia Illyricum or simply Illyricum; later it came to be known as Dalmatia (Tac. Annals, iv.5; Josephus, BJ, II, xvi; Dio Cassius, xlix.36, etc.). In accordance with Paul\'s habitual usage of such terms, together with the fact that he employs a Greek form which is a transliteration of the Latin Illyricum but does not occur in any other extant Greek writer, and the fact that he is here writing to the church at Rome, we may conclude that in <a onClick="return mV(\'Rom\',15,19);">Ro 15:19</a> Illyricum bears its more restricted meaning.<P>3. Relation to Rome:<P>The Romans waged two Illyrian wars: in 229-228 BC and in 219 BC, but no province was formed until 167, when, after the fall of the Macedonian power, Illyria received its provincial constitution (Livy, xlv.26). At this time it extended from the Drilo (modern Drin) to Dalmatia, which was gradually subjugated by Roman arms. In 59 BC Julius Caesar received as his province Illyricum and Gaul, and later Octavian and his generals, Asinius Pollio and Statilius Taurus, waged war there with such success that in 27 BC, at the partition of the provinces between Augustus and the Senate, Illyricum was regarded as wholly pacified and was assigned to the latter. Renewed disturbances led, however, to its transference to the emperor in 11 BC. Two years later the province was extended to the Danube, but in 9 AD, at the close of the 2nd Pannonian War, it was divided into two separate provinces, Pannonia and Illyricum (Dalmatia). The latter remained an imperial province, administered by a consular legatus Augusti pro praetore residing at Salonae (modern Spalato), and two legions were stationed there, at Delminium and at Burnum. One of these was removed by Nero, the other by Vespasian, and thenceforward the province was garrisoned only by auxiliary troops. It fell into three judicial circuits (conventus), that of Scardona comprising Liburnia, the northern portion of the province, while those of Salonae and Narona made up the district of Dalmatia in the narrower sense. The land was rugged and mountainous, and civilization progressed but slowly; the Romans, however, organized 5 Roman colonies within the province and a considerable number of municipia.<P>4. Paul\'s Relation to Illyricum:<P>The extension of Paul\'s preaching to the Illyrian frontier must be assigned to his 3rd missionary journey, i.e. to his 2nd visit to Macedonia. His movements during the 1st visit (<a onClick="return mV(\'Act\',16,\'12-\');">Ac 16:12</a>-<a onClick="return mV(\'Hbr\',17,\'1-15\');">17:15</a>) are too fully recorded to admit of our attributing it to that period, but the account in <a onClick="return mV(\'Act\',20,2);">Ac 20:2</a> of his second tour is not only very brief, but the words, "when he had gone through those parts," suggest an extensive tour through the province, occupying, according to Ramsay, the summer and autumn of 56 AD.<P>LITERATURE.<P>A. M. Poinsignon, Quid praecipue apud Romanos adusque Diocletiani tempora Illyricum fuerit (Paris, 1846); Zippe, Die romische Herrschaft in Illyrien bis auf Augustus (Leipzig, 1877); H. Cons, La province romaine de Dalmatie (Paris, 1882); T. Mommsen, CIL, III, pp. 279ff; T. Mommsen et J. Marquardt, Manuel des antiquites romaines (Fr. T), IX, 171ff.`<a href="./study/isbe/search.html?string=DALMATIA">DALMATIA</a>`176';
isbe[4552]='Image`im\'-aj (tselem; eikon): Its usage falls under 3 main heads.<P>(1) "Image" as object of idolatrous worship (translations about a dozen words, including maccekhah, "molten image" (<a onClick="return mV(\'Deu\',9,12);">De 9:12</a>, etc.); matstsebhah, in the King James Version translated "image" or "pillar," in the Revised Version (British and American) always "pillar" (<a onClick="return mV(\'Exd\',23,24);">Ex 23:24</a>, etc.); pecel, "graven image" (<a onClick="return mV(\'Exd\',20,4);">Ex 20:4</a>, etc.); tselem, "image" (<a onClick="return mV(\'2Ki\',11,18);">2Ki 11:18</a>, etc.); eikon, "image" (e.g. <a onClick="return mV(\'Rev\',14,9);">Re 14:9</a>));<P>(2) of man as made in the image of God; (3) of Christ as the image of God. Here we are concerned with the last two usages. For "image" in connection with idolatrous practices, see <a href="study/isbe/search.html?string=IDOLATRY">IDOLATRY</A>; <a href="study/isbe/search.html?string=IMAGES">IMAGES</A>; <a href="study/isbe/search.html?string=PILLAR">PILLAR</a>; <a href="study/isbe/search.html?string=TERAPHIM">TERAPHIM</A>, etc.<P>I. Man as Made in the Divine Image.<P>1. In the Old Testament:<P>To define man\'s fundamental relation to God, the priestly writer in Genesis uses two words: "image" (tselem) and "likeness" (demuth); once employing both together (<a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>; compare <a onClick="return mV(\'Gen\',5,3);">Ge 5:3</a>), but elsewhere one without the other, "image" only in <a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a>; <a onClick="return mV(\'Gen\',9,6);">9:6</a>, and "likeness" only in <a onClick="return mV(\'Gen\',5,1);">5:1</A>. The priestly writer alone in the Old Testament uses this expression to describe the nature of man, though the general meaning of the passage <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>f is echoed in <a onClick="return mV(\'Psa\',8,\'5-8\');">Ps 8:5-8</a>, and the term itself reappears in Apocrypha (Sirach 17:3; The <span class="noTag">Wisdom of Solomon 2:23</span>) and in the New Testament (see below).<P>The idea is important in relation to the Biblical doctrine of man, and has figured prominently in theological discussion. The following are some of the questions that arise:<P>(1) Is there any distinction to be understood between "image" and "likeness"? Most of the Fathers, and some later theologians, attempt to distinguish between them.<P>(a) Some have referred "image" to man\'s bodily form, and "likeness" to his spiritual nature (Justin Martyr, Irenaeus).<P>(b) Others, especially the Alexandrian Fathers, understood by the "image" the mental and moral endowments native to man, and by the "likeness" the Divine perfections which man can only gradually acquire by free development and moral conflict (Clement of Alexandria and Origen), or which is conferred on man as a gift of grace.<P>(c) This became the basis of the later Roman Catholic distinction between the natural gifts of rationality and freedom (= the image), and the supernatural endowments of grace which God bestowed on man after He had created him (the likeness = donum superadditum). The former remained after the Fall, though in an enfeebled state; the latter was lost through sin, but restored by Christ. The early Protestants rejected this distinction, maintaining that supernatural righteousness was part of the true nature and idea of man, i.e. was included in the "image," and not merely externally superadded. Whatever truth these distinctions may or may not contain theologically, they cannot be exegetically inferred from <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>, where (as is now generally admitted) no real difference is intended.<P>We have here simply a "duplication of synonyms" (Driver) for the sake of emphasis. The two terms are elsewhere used interchangeably.<P>(2) What, then, is to be understood by the Divine image? Various answers have been given.<P>(a) Some of the Fathers (influenced by Philo) supposed that the "image" here = the Logos (called "the image of the invisible God" in <a onClick="return mV(\'Col\',1,15);">Col 1:15</a>), on the pattern of whom man was created. But to read the Logos doctrine into the creation narrative is to ignore the historic order of doctrinal development. (b) That it connotes physical resemblance to God (see (1), (a) above; so in the main Skinner, ICC, in the place cited.). It may be admitted that there is a secondary reference to the Divine dignity of the human body; but this does not touch the essence of the matter, inasmuch as God is not represented as having physical form.<P>(c) That it consists of dominion over the creatures (Socinian view; so also Gregory of Nyssa, Chrysostom, etc.). This would involve an unwarranted narrowing of the idea. It is true that such "dominion" is closely associated with the image in <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a> (compare <a onClick="return mV(\'Psa\',8,\'6-8\');">Ps 8:6-8</a>). But the "image of God" must denote primarily man\'s relation to his Creator, rather than his relation to the creation. Man\'s lordship over Nature is not identical with the image, but is an effect of it.<P>(d) It is best to take the term as referring to the whole dignity of man, in virtue of his fundamental affinity to God. It implies the possession by man of a free, self-conscious, rational and moral personality, like unto that of God—a nature capable of distinguishing right and wrong, of choosing the right and rejecting the wrong, and of ascending to the heights of spiritual attainment and communion with God. This involves a separation of man from the beast, and his supremacy as the culmination of the creative process.<P>(3) Does the term imply man\'s original perfection, lost through sin? The old Protestant divines maintained that the first man, before the Fall, possessed original righteousness, not only in germ but in developed form, and that this Divine image was destroyed by the Fall. Exegetically considered, this is certainly not taught by the priestly writer, who makes no mention of the Fall, assumes that the image was transmitted from father to son (compare <a onClick="return mV(\'Gen\',5,1);">Ge 5:1</a> with <a onClick="return mV(\'Gen\',5,3);">5:3</A>), and naively speaks of post-diluvian men as created in the image of God (<a onClick="return mV(\'Gen\',9,6);">Ge 9:6</a>; compare <a onClick="return mV(\'1Cr\',11,7);">1Co 11:7</a>; <a onClick="return mV(\'Jam\',3,9);">Jas 3:9</a>). Theologically considered, the idea of the perfect holiness of primitive man is based on an abstract conception of God\'s work in creation, which precludes the idea of development, ignores the progressive method of the Divine government and the essential place of effort and growth in human character. It is more in harmony with modern conceptions<P>(a) to regard man as originally endowed with the power of right choice, rather than with a complete character given from the first; and<P>(b) to think of the Divine image (though seriously defaced) as continuing even in the sinful state, as man\'s inalienable capacity for goodness and his true destination. If the Divine image in man is a self-conscious, rational and ethical personality, it cannot be a merely accidental or transitory attribute, but is an essential constituent of his being.<P>2. In the New Testament:<P>Two features may be distinguished in the New Testament doctrine of the Divine image in man:<P>(1) man\'s first creation in Adam,<P>(2) his second or new creation in Christ.<P>As to (1), the doctrine of the Old Testament is assumed in the New Testament. Paul makes a special application of it to the question of the relation of husband and wife, which is a relation of subordination on the part of the wife, based on the fact that man alone was created immediately after the Divine image (<a onClick="return mV(\'1Cr\',11,7);">1Co 11:7</a>). Thus Paul, for the special purpose of his argument, confines the meaning of the image to man\'s lordly authority, though to infer that he regards this as exhausting its significance would be quite unwarranted. Man\'s affinity to God is implied, though the term "image" is not used, in Paul\'s sermon to the Athenians (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>f; man the "offspring" of God). See also <a onClick="return mV(\'Jam\',3,9);">Jas 3:9</a> (it is wrong to curse men, for they are "made after the likeness of God").<P>(2) More characteristic of the New Testament is the doctrine of the new creation.<P>(a) The redeemed man is said to be in the image of God (the Father). He is "renewed unto knowledge after the image of him that created him" (<a onClick="return mV(\'Col\',3,10);">Col 3:10</a>), i.e. of God the Creator, not here of Christ or the Logos (as some) (compare <a onClick="return mV(\'Eph\',4,24);">Eph 4:24</a>, "after God"). Though there is here an evident reference to <a onClick="return mV(\'Gen\',1,26);">Ge 1:26</a>f; this does not imply that the new creation in Christ is identical with the original creation, but only that the two are analogous. To Paul, the spiritual man in Christ is on a higher level than the natural ("psychical") man as found in Adam (compare especially <a onClick="return mV(\'1Cr\',15,\'44-49\');">1Co 15:44-49</a>), in whom the Divine image consisted (as we have seen) in potential goodness, rather than in full perfection. Redemption is infinitely more than the restoration of man\'s primitive state.<P>(b) The Christian is further said to be gradually transformed into the image of the Son of God. This progressive metamorphosis involves not only moral and spiritual likeness to Christ, but also ultimately the Christian\'s future glory, including the glorified body, the "passing through a gradual assimilation of mind and character to an ultimate assimilation of His doxa, the absorption of the splendor of His presence" (Sanday and Headlam, Romans, 218; see <a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>; <a onClick="return mV(\'1Cr\',15,49);">1Co 15:49</a>; <a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>; and compare <a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>; <a onClick="return mV(\'1Jo\',3,2);">1Joh 3:2</a>).<P>II. Christ the Image of God.<P>In 3 important passages in English Versions of the Bible, the term "image" defines the relation of Christ to God the Father; twice in Paul: "the light of the gospel of the glory of Christ, who is the image of God" (<a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>); "who is the image of the invisible God, the firstborn of all creation" (<a onClick="return mV(\'Col\',1,15);">Col 1:15</a>); and once in He: "who being the effulgence of his glory, and the very image of his substance" (<a onClick="return mV(\'Col\',1,3);">Col 1:3</a>). These statements, taken in their contexts, register the highest reach of the Christology of the Epistles.<P>1. The Terms:<P>In the two Pauline passages, the word used is eikon, which was generally the Septuagint rendering of tselem (Vulgate: imago); it is derived from eiko, eoika, "to be like," "resemble," and means that which resembles an object and represents it, as a copy represents the original. In <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a> the word used is charakter, which is found here only in the New Testament, and is translated in Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) figura, the King James Version "express image," the Revised Version (British and American) "very image," the Revised Version, margin "impress." It is derived from charasso, "to engrave," and has passed through the following meanings:<P>(1) an engraving instrument (active sense);<P>(2) the engraved stamp or mark on the instrument (passive sense);<P>(3) the impress made by the instrument on wax or other object;<P>(4) hence, generally, the exact image or expression of any person or thing as corresponding to the original, the distinguishing feature, or traits by which a person or thing is known (hence, English words "character," "characteristic"). The word conveys practically the same meaning as eikon; but Westcott distinguishes them by saying that the latter "gives a complete representation, under conditions of earth, of that which it figures," while charakter "conveys representative traits only" (Westcott on <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a>).<P>2. Meaning as Applied to Christ:<P>The idea here expressed is closely akin to that of the Logos doctrine in John (<a onClick="return mV(\'Jhn\',1,\'1-18\');">1:1-18</A>). Like the Logos, the Image in Paul and in Hebrews is the Son of God, and is the agent of creation as well as the medium of revelation. "What a word (logos) is to the ear, namely a revelation of what is within, an image is to the eye; and thus in the expression there is only a translation, as it were, of the same fact from one sense to another" (Dorner, System of Ch. D., English translation, III, 178). As Image, Christ is the visible representation and manifestation of the invisible God, the objective expression of the Divine nature, the face of God turned as it were toward the world, the exact likeness of the Father in all things except being the Father. Thus we receive "the light of the knowledge of the glory of God in the face of Jesus Christ" (<a onClick="return mV(\'2Cr\',4,6);">2Co 4:6</a>). He is the facsimile of God.<P>3. To What State Does It Refer?:<P>Is Christ described as the Image of God in His preincarnate, His incarnate, or else His exalted state? It is best to say that different passages refer to different states, but that if we take the whole trend of New Testament teaching, Christ is seen to be essentially, and in every state, the Image of God.<P>(a) In <a onClick="return mV(\'Hbr\',1,3);">Heb 1:3</a> the reference seems to be to the eternal, preincarnate Son, who is inherently and essentially the expression of the Divine substance. So Paul declares that He subsisted originally in the form of God (en morphe theou huparchon, <a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>).<P>(b) In <a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a>; <a onClick="return mV(\'Jhn\',12,45);">12:45</a>; <a onClick="return mV(\'Jhn\',14,9);">14:9</a>, though the term image is not used, we have the idea of the historical Jesus as a perfect revelation of the character and glory of God.<P>(c) In the two Pauline passages (<a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>; <a onClick="return mV(\'Col\',1,15);">Col 1:15</a>), the reference is probably to the glorified, exalted Christ; not to His pre-existent Divine nature, nor to His temporal manifestation, but to His "whole Person, in the divine-human state of His present heavenly existence" (Meyer). These passages in their cumulative impressions convey the idea that the Image is an inalienable property of His personality, not to be limited to any stage of His existence.<P>4. Theological Implications:<P>Does this involve identity of essence of Father and Son, as in the Homoousion formula of the Nicene Creed? Not necessarily, for man also bears the image of God, even in his sinful state (see I above), a fact which the Arians sought to turn to their advantage. Yet in the light of the context, we must affirm of Christ an absolutely unique kinship with God. In the Col passage, not only are vast cosmic and redemptive functions assigned to Him, but there is said to dwell in Him "all the fullness of the Godhead bodily" (<a onClick="return mV(\'Col\',1,19);">1:19</A>; <a onClick="return mV(\'Col\',2,9);">2:9</A>). In He not only is the Son the final revelation of God to men, the upholder of the universe, and the very image of the Divine nature, but also the effulgence (apaugasma) of God\'s glory, and therefore of one nature with Him as the ray is of one essence with the sun (<a onClick="return mV(\'Col\',1,1,2,3);">1:1-3</A>). The superiority of the Son is thus not merely one of function but of nature. On the other hand, the figure of the "image" certainly guards against any Sabellian identification of Father and Son, as if they were but modes of the one Person; for we cannot identify the pattern with its copy, nor speak of anyone as an image of himself. And, finally, we must not overlook the affinity of the Logos with man; both are the image of God, though the former in a unique sense. The Logos is at once the prototype of humanity within the Godhead, and the immanent Divine principle within humanity.<P>5. Relation to Pre-Christian Thought:<P>Both in Paul and in He we have an echo of the Jewish doctrine of Wisdom, and of Philo\'s doctrine of the Logos. In the Alexandrine Book of Wisdom, written probably under Stoic influence, Divine Wisdom is pictorially represented as "an effulgence (apaugasma) from everlasting light, and an unspotted mirror of the working of God, and an image (eikon) of His goodness" (7 26). Philo repeatedly calls the Logos or Divine world-principle the image (eikon, charakter) of God, and also describes it as an effulgence of God. But this use of current Alexandrian terminology and the superficial resemblance of ideas are no proof of conscious borrowing on the part of the apostles. There is this fundamental distinction, that Philo\'s Logos is not a self-conscious personality, still less a historical individual, but an allegorical hypostatizing of an abstract idea; whereas in Paul and He, as in John, the Divine archetype is actually realized in a historical person, Jesus Christ, the Son and Revealer of God.``49';

isbe[4554]='Imagery`im\'-aj-ri (maskith, "carved figure"): Only in <a onClick="return mV(\'Eze\',8,12);">Eze 8:12</a>, "every man in his chambers of imagery," i.e. dark chambers on whose walls were pictures in relief representing all kinds of reptiles and vermin, worshipped by elders of Israel. Some maintain that the cult was of foreign origin, either Egyptian (Bertholet, Commentary on Ezekiel), or Babylonian (Redpath, Westminster Commentary on Ezekiel); others that it was the revival of ancient superstitions of a totemistic kind which had survived in obscure circles in Israel (W.R. Smith, Lectures on the Religion of the Semites, revised edition, 357). The word here rendered "imagery" is elsewhere in the King James Version translated "image" (of stone) (<a onClick="return mV(\'Lev\',26,1);">Le 26:1</a>, the Revised Version (British and American) "figured stone"), "pictures" (<a onClick="return mV(\'Num\',33,52);">Nu 33:52</a>, the Revised Version (British and American) "figured stones"; <a onClick="return mV(\'Pro\',25,11);">Pr 25:11</a>, the Revised Version (British and American) "network"); twice it means imagination, conceit, i.e. a mental picture (<a onClick="return mV(\'Psa\',73,20);">Ps 73:20</a>; <a onClick="return mV(\'Pro\',18,11);">Pr 18:11</a>). "Imagery" occurs once in Apocrypha (Sirach 38:27 the King James Version, eis homoiosai zographian, the Revised Version (British and American) "to preserve likeness in his portraiture").``49';
