ev, though highly figurative, indicate a condition of great blessedness (<a onClick="return mV(\'Rev\',7,\'9-17\');">Re 7:9-17</a>).<P>(3) The Resurrection.<P>The fullness of the blessedness of immortality implies the resurrection. The resurrection is a cardinal article of Christ\'s teaching (<a onClick="return mV(\'Mat\',22,\'29-32\');">Mt 22:29-32</a>; <a onClick="return mV(\'Jhn\',5,\'25-29\');">Joh 5:25-29</a>; <a onClick="return mV(\'Jhn\',11,\'23-26\');">11:23-26</a>). He Himself is the Lord of life, and life-giver in the resurrection (<a onClick="return mV(\'Jhn\',5,21,25,26);">Joh 5:21, 25-26</a>; <a onClick="return mV(\'Jhn\',11,25);">11:25</a>, "I am the resurrection, and the life"). The resurrection of believers is secured by His own resurrection. Jesus died; He rose again (see <a href="study/isbe/search.html?string=RESURRECTION">RESURRECTION</A>). His resurrection carries with it the certainty of the resurrection of all His people. This is the great theme of <a onClick="return mV(\'1Cr\',15,\'1-\');">1Co 15</a>. As Christ lives, they shall live also (<a onClick="return mV(\'Jhn\',14,19);">Joh 14:19</a>). The believers who are alive at His Parousia shall be changed (<a onClick="return mV(\'1Cr\',15,51);">1Co 15:51</a>; <a onClick="return mV(\'1Th\',4,17);">1Th 4:17</a>); those who are dead shall be raised first of all (<a onClick="return mV(\'1Th\',4,16);">1Th 4:16</a>). The resurrection body shall be a body like to Christ\'s own (<a onClick="return mV(\'Phl\',3,21);">Php 3:21</a>)—incorruptible, glorious, powerful, spiritual, immortal (<a onClick="return mV(\'1Cr\',15,42,53);">1Co 15:42ff, 53f</a>). This is not to be confused with sameness of material particles (<a onClick="return mV(\'1Cr\',15,37);">1Co 15:37</a>f), yet there is the connection of a vital bond between the old body and the new. This is the hope of the believer, without which his redemption would not be complete.<P>(4) The Wicked Also Raised.<P>The wicked also are raised, not, however, to glory, but for judgment (<a onClick="return mV(\'Jhn\',5,29);">Joh 5:29</a>; <a onClick="return mV(\'Act\',24,15);">Ac 24:15</a>; <a onClick="return mV(\'Rev\',20,\'12-15\');">Re 20:12-15</a>). The same truth is implied in all passages on the last judgment. Excluded from the blessedness of the righteous, their state is described by both Jesus and His apostles as one of uttermost tribulation and anguish (e.g. <a onClick="return mV(\'Mat\',25,46);">Mt 25:46</a>; <a onClick="return mV(\'Mar\',9,\'43-50\');">Mr 9:43-50</a>; <a onClick="return mV(\'Rom\',2,8);">Ro 2:8</a>f). This is not "immortality" or "life," though the continued existence of the soul is implied in it (see <a href="study/isbe/search.html?string=PUNISHMENT,+EVERLASTING">PUNISHMENT, EVERLASTING</a>; <a href="study/isbe/search.html?string=HELL">HELL</A>; <a href="study/isbe/search.html?string=RETRIBUTION">RETRIBUTION</a>).<P>(5) Eternal Life.<P>The condition of the blessed in their state of immortality is one of unspeakable felicity of both soul and body forever. There are, indeed, degrees of glory—this is carefully and consistently taught (<a onClick="return mV(\'Mat\',25,14);">Mt 25:14</a>; <a onClick="return mV(\'Luk\',19,12);">Lu 19:12</a>; <a onClick="return mV(\'1Cr\',3,\'10-15\');">1Co 3:10-15</a>; <a onClick="return mV(\'1Cr\',15,41);">15:41</a>; <a onClick="return mV(\'Phl\',3,\'10-14\');">Php 3:10-14</a>; <a onClick="return mV(\'2Ti\',4,7);">2Ti 4:7</a>; <a onClick="return mV(\'1Jo\',2,28);">1Joh 2:28</a>)—but the condition as a whole is one of perfect satisfaction, holiness and blessedness (compare <a onClick="return mV(\'Mat\',13,43);">Mt 13:43</a>; <a onClick="return mV(\'Mat\',25,34);">25:34</a>; <a onClick="return mV(\'Rom\',2,7,10);">Ro 2:7, 10</a>; <a onClick="return mV(\'Rom\',12,3);">Ro 12:3</a>ff, etc.). The blessedness of this eternal state includes such elements as the following:<P>(1) restoration to God\'s image and likeness to Christ (<a onClick="return mV(\'1Cr\',15,49);">1Co 15:49</a>; <a onClick="return mV(\'2Cr\',3,18);">2Co 3:18</a>; <a onClick="return mV(\'Eph\',4,24);">Eph 4:24</a>; <a onClick="return mV(\'Col\',3,10);">Col 3:10</a>; <a onClick="return mV(\'1Jo\',3,2);">1Joh 3:2</a>);<P>(2) perfect holiness in the possession of God\'s Spirit (<a onClick="return mV(\'2Cr\',7,1);">2Co 7:1</a>; <a onClick="return mV(\'Phl\',1,6);">Php 1:6</a>; <a onClick="return mV(\'Rev\',21,27);">Re 21:27</a>; <a onClick="return mV(\'Rev\',22,4,11);">22:4, 11</a>);<P>(3) the unveiled vision of God\'s glory (<a onClick="return mV(\'Rev\',22,4);">Re 22:4</a>; compare <a onClick="return mV(\'Psa\',17,15);">Ps 17:15</a>);<P>(4) freedom from all sorrow, pain and death (<a onClick="return mV(\'Rev\',21,3);">Re 21:3</a>f);<P>(5) power of unwearied service (<a onClick="return mV(\'Rev\',22,3);">Re 22:3</a>).<P>2. Contrasts:<P>The contrast between the Biblical view of immortality and that of heathenism and of the schools will now be obvious. It is not mere future existence; not a bare, abstract immortality of the soul; it is the result of redemption and of renewal by God\'s spirit; it embraces the whole personality, soul and body; it is not shared by the unholy; it includes the perfection of rational, moral and spiritual blessedness, in an environment suitable to such glorified existence. As such it is the supreme prize after which every believer is called to strive (<a onClick="return mV(\'Phl\',3,13);">Php 3:13</a>f).<P>LITERATURE.<P>Ingersoll Lectures on Immortality, by Professor William James, Professor Osler, etc.; Salmond, Christian Doctrine of Immortality; Orr, Christian View of God and the World, Lects iv, v, with App. to v; works specified in the article on <a href="study/isbe/search.html?string=ESCHATOLOGY">ESCHATOLOGY</a>.``132';
isbe[4564]='Immutability; Immutable`i-mu-ta-bil\'-i-ti, i-mu\'-ta-b\'-l (ametathetos): Occurs in <a onClick="return mV(\'Hbr\',6,17,18);">Heb 6:17-18</a> of the unchangeableness of the Divine counsel. It is the perfection of Yahweh that He changes not in character, will, purpose, aim (<a onClick="return mV(\'Mal\',3,6);">Mal 3:6</a>; so of Christ, <a onClick="return mV(\'Hbr\',13,8);">Heb 13:8</a>).`<a href="./study/isbe/search.html?string=FAITHFULNESS">FAITHFULNESS</a>; <a href="./study/isbe/search.html?string=UNCHANGEABLE">UNCHANGEABLE</a>`1';
isbe[4565]='Imna`im\'-na (yimna\'): A descendant of Asher (<a onClick="return mV(\'1Ch\',7,35);">1Ch 7:35</a>).``1';
isbe[4566]='Imnah`im\'-na (yimnah):<P>(1) Eldest son of Asher (<a onClick="return mV(\'Gen\',46,17);">Ge 46:17</a>, the King James Version "Jimnah"; <a onClick="return mV(\'Num\',26,44);">Nu 26:44</a>, the King James Version "Jimna"; <a onClick="return mV(\'1Ch\',7,30);">1Ch 7:30</a>).<P>(2) A Levite of Hezekiah\'s time (<a onClick="return mV(\'2Ch\',31,14);">2Ch 31:14</a>).``1';
isbe[4567]='Imnites`im\'-nits (yimni): Descendants of <a href="study/isbe/search.html?string=IMNAH">IMNAH</a> (q.v. (1)) (<a onClick="return mV(\'Num\',26,44);">Nu 26:44</a>, the King James Version "Jimnites").``1';
isbe[4568]='Impart`im-part\' (metadidomi, "to share"): "They...imparted (the King James Version "added") nothing to me" (<a onClick="return mV(\'Gal\',2,6);">Ga 2:6</a>); that is, did not propose any correction or addition to my teaching. "That I may impart unto you some spiritual gift" (<a onClick="return mV(\'Rom\',1,11);">Ro 1:11</a>) expresses the apostle\'s hope that the Roman believers may increase in faith and love through his teaching and influence.<P>"To impart unto you...our own souls" (<a onClick="return mV(\'1Th\',2,8);">1Th 2:8</a>) meant to spend their utmost strength and to expose their lives in their service.``1';
isbe[4569]='Impediment`im-ped\'-i-ment: Found in <a onClick="return mV(\'Mar\',7,32);">Mr 7:32</a>, "had an impediment in his speech," as a translation of mogilalos, comparative of mogos, "toil" and lalos, "speech," i.e. one who speaks with difficulty. In the Septuagint the word is used as a translation of \'illem, "dumb" (<a onClick="return mV(\'Isa\',35,6);">Isa 35:6</a>)``1';
isbe[4570]='Implead`im-pled\' (<a onClick="return mV(\'Act\',19,38);">Ac 19:38</a> the King James Version, "Let them impIead one another"): "Implead" means "to sue at law," hence, the Revised Version (British and American) "Let them accuse one another." Court days are kept, let them prosecute the suit in court and not settle matters in riot. egkalein, means "to call in," "to call to account."``1';
isbe[4571]='Importable`im-por\'-ta-b\'l (dusbastaktos): An obsolete word, meaning "unbearable" (Latin: im, "not," portabilis, "bearable") found in Pr Man, "Thine angry threatening (the Revised Version (British and American) "the anger of thy threatening") toward sinners is importable"; compare Rheims version, <a onClick="return mV(\'Mat\',23,4);">Mt 23:4</a>, "heavy burdens and importable"; Chaucer ("Clerk\'s Tale" C.T.), "For it were importable though they wolde."``1';
isbe[4572]='Importunity`im-por-tu\'-ni-ti: Occurs only in <a onClick="return mV(\'Luk\',11,8);">Lu 11:8</a>, where it is the rendering of anaideia (Westcott-Hort, anaidia). This Greek word implies an element of impudent insistence rising to the point of shamelessness which the English word "importunity" fails to express, thus weakening the argument of the parable, which is that if by shameless insistence a favor may be won, even from one unwilling and ungracious, still more surely will God answer the earnest prayer of His people. God\'s willingness to give exceeds our ability to ask. The parable teaches by way of contrast, not by parallel.``51';
isbe[4573]='Imposition of Hands`im-po-zish\'-un.`<a href="./study/isbe/search.html?string=HANDS,+IMPOSITION+OF">HANDS, IMPOSITION OF</a>`1';
isbe[4574]='Impossible`im-pos\'-i-b\'-l (verb adunateo; adjective adunatos): "To be impossible" is the translation of adunateo, "to be powerless," "impotent" (<a onClick="return mV(\'Mat\',17,20);">Mt 17:20</a>; <a onClick="return mV(\'Luk\',1,37);">Lu 1:37</a>, the Revised Version (British and American) "void of power") adunatos, "powerless," etc., is translated "impossible" <a onClick="return mV(\'Mat\',19,26);">Mt 19:26</a>; <a onClick="return mV(\'Mar\',10,27);">Mr 10:27</a>; <a onClick="return mV(\'Luk\',18,27);">Lu 18:27</a>; <a onClick="return mV(\'Hbr\',6,4,18);">Heb 6:4, 18</a>; <a onClick="return mV(\'Hbr\',11,6);">11:6</a>; "impossible" in <a onClick="return mV(\'Hbr\',6,4);">Heb 6:4</a> is in the Revised Version (British and American) transferred to <a onClick="return mV(\'Hbr\',6,6);">6:6</a>); anendektos, "not to be received" or "accepted," is also translated "impossible" (<a onClick="return mV(\'Luk\',17,1);">Lu 17:1</a>). In several of these passages it is affirmed that "nothing is impossible with God," but, of course, this means nothing that is consistent with the Divine nature, e.g. (as <a onClick="return mV(\'Hbr\',6,18);">Heb 6:18</a>) it is not possible for God to lie. So, when it is said that nothing is impossible to faith, the same limitation applies and also that of the mind or will of God for us. But much more is possible to a strong faith than a weak faith realizes, or even believes.``185';
isbe[4575]='Impotent`im\'-po-tent (astheneo, adunatos): The verb signifies "to be without strength," and derivatives of it are used in <a onClick="return mV(\'Jhn\',5,3,7);">Joh 5:3, 7</a> the King James Version and <a onClick="return mV(\'Act\',4,9);">Ac 4:9</a> to characterize the paralyzed man at Bethesda and the cripple at the Temple gate. For the same condition of the Lystra lame man the word adunatos is used, which is synonymous. In these cases it is the weakness of disease. In this sense the word is used by Shakespeare (Love\'s Labor Lost, V, ii, 864; Hamlet, I, ii, 29). The impotent folk referred to in the Epistle of Jeremy (Baruch 6:28) were those weak and feeble from age and want; compare "impotent and snail-paced beggary" (Richard III, IV, iii, 53).``107';
isbe[4576]='Imprisonment`im-priz\'-\'-n-ment.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>; <a href="./study/isbe/search.html?string=PRISON;+PRISONER">PRISON</a>`1';

isbe[4578]='Imputation`im-pu-ta\'-shun:<P><b>I. MEANING AND USE OF THE TERM</b><P><b>II. THE THREEFOLD USE OF THE TERM IN THEOLOGY</b><P class="in15">Original Sin, Atonement, Justification<P><b>III. THE SCRIPTURAL BASIS OF THESE DOCTRINES</b><P class="in15">1. Imputation of Adam\'s Sin to His Posterity<P class="in15">2. Imputation of the Sins of His People to Christ<P class="in15">3. Imputation of the Righteousness of Christ to His People<P><b>LITERATURE</b><hr /><P>I. Meaning and Use of the Term.<P>The word "imputation," according to the Scriptural usage, denotes an attributing of something to a person, or a charging of one with anything, or a setting of something to one\'s account. This takes place sometimes in a judicial manner, so that the thing imputed becomes a ground of reward or punishment. The word is used in the King James Version a number of times to translate the Hebrew verb chashabh and the Greek verb logizomai. These words, both of which occur frequently in Scripture, and which in a number of instances mean simply "to think," express the above idea. That this is the case is clear also from the other English words used in the King James Version to translate these Hebrew and Greek words, as, for example, "to count," "to reckon," "to esteem." Thus chashabh is translated in the King James Version by the verb "to impute" (<a onClick="return mV(\'Lev\',7,18);">Le 7:18</a>; <a onClick="return mV(\'Lev\',17,4);">17:4</a>; <a onClick="return mV(\'2Sa\',19,19);">2Sa 19:19</a>); by the verb "to reckon" (<a onClick="return mV(\'2Sa\',4,2);">2Sa 4:2</a>); by "to count" as something (<a onClick="return mV(\'Lev\',25,31);">Le 25:31</a> English versions). The verb in <a onClick="return mV(\'1Sa\',22,15);">1Sa 22:15</a> is sim. Similarly, logizomai is translated by the verb "to impute" (<a onClick="return mV(\'Rom\',4,6,8,11,22,23,24);">Ro 4:6, 8, 11, 22-24</a>; <a onClick="return mV(\'2Cr\',5,19);">2Co 5:19</a>; <a onClick="return mV(\'Jam\',2,23);">Jas 2:23</a>); by the verb "to count" (<a onClick="return mV(\'Rom\',2,26);">Ro 2:26</a>; <a onClick="return mV(\'Rom\',4,3,5);">4:3, 5</a>); "to account" (<a onClick="return mV(\'Gal\',3,6);">Ga 3:6</a>); and by the verb "to reckon" (<a onClick="return mV(\'Rom\',4,4,9,10);">Ro 4:4, 9-10</a>). In the Revised Version (British and American) the word used to render logizomai is the verb "to reckon."<P>These synonyms of the verb "to impute" bring out the idea of reckoning or charging to one\'s account. It makes no difference, so far as the meaning of imputation is concerned, who it is that imputes, whether man (<a onClick="return mV(\'1Sa\',22,15);">1Sa 22:15</a>) or God (<a onClick="return mV(\'Psa\',32,2);">Ps 32:2</a>); it makes no difference what is imputed, whether a good deed for reward (<a onClick="return mV(\'Psa\',106,30);">Ps 106:30</a>f) or a bad deed for punishment (<a onClick="return mV(\'Lev\',17,4);">Le 17:4</a>); and it makes no difference whether that which is imputed is something which is personally one\'s own prior to the imputation, as in the case above cited, where his own good deed was imputed to Phinehas (<a onClick="return mV(\'Psa\',106,30);">Ps 106:30</a>f), or something which is not personally one\'s own prior to the imputation, as where Paul asks that a debt not personally his own be charged to him (<a onClick="return mV(\'Phm\',1,18);">Phm 1:18</a>). In all these cases the act of imputation is simply the charging of one with something. It denotes just what we mean by our ordinary use of the term. It does not change the inward state or character of the person to whom something is imputed. When, for example, we say that we impute bad motives to anyone, we do not mean that we make such a one bad; and just so in the Scripture the phrase "to impute iniquity" does not mean to make one personally bad, but simply to lay iniquity to his charge. Hence, when God is said "to impute sin" to anyone, the meaning is that God accounts such a one to be a sinner, and consequently guilty and liable to punishment. Similarly, the non-imputation of sin means simply not to lay it to one\'s charge as a ground of punishment (<a onClick="return mV(\'Psa\',32,2);">Ps 32:2</a>). In the same manner, when God is said "to impute righteousness" to a person, the meaning is that He judicially accounts such a one to be righteous and entitled to all the rewards of a righteous person (<a onClick="return mV(\'Rom\',4,6,11);">Ro 4:6, 11</a>).<P>II. The Threefold Use of the Term in Theology.<P>Original Sin, Atonement, Justification:<P>Three acts of imputation are given special prominence in the Scripture, and are implicated in the Scriptural doctrines of Original Sin, Atonement and Justification, though not usually expressed by the words chashabh and logizomai. Because, however, of its "forensic" or "judicial" meaning, and possibly through its use in the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) to translate logizomai in <a onClick="return mV(\'Rom\',4,8);">Ro 4:8</a>, the term "imputation" has been used in theology in a threefold sense to denote the judicial acts of God by which the guilt of Adam\'s sin is imputed to his posterity; by which the sins of Christ\'s people are imputed to Him; and by which the righteousness of Christ is imputed to His people. The act of imputation is precisely the same in each case. It is not meant that Adam\'s sin was personally the sin of his descendants, but that it was set to their account, so that they share its guilt and penalty. It is not meant that Christ shares personally in the sins of men, but that the guilt of his people\'s sin was set to his account, so that He bore its penalty. It is not meant that Christ\'s people are made personally holy or inwardly righteous by the imputation of His righteousness to them, but that His righteousness is set to their account, so that they are entitled to all the rewards of that perfect righteousness.<P>These doctrines have had a place in theology of the Christian church from the earliest Christian centuries, though the doctrine of the imputation of the righteousness of Christ was first fully and clearly stated at the time of and following the Reformation. The first two of these doctrines have been the possession of the entire Christian church, while the third one of them is affirmed by both the Reformed and Lutheran branches of Protestantism.<P>III. The Scriptural Basis of These Doctrines.<P>These three doctrines have a basis in the Scripture, and underlie the Scripture doctrines of Original Sin, Atonement, and Justification.<P>1. Imputation of Adam\'s Sin to His Posterity:<P>The doctrine of the imputation of Adam\'s sin to his posterity is implied in the account of the Fall in <a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a> and <a onClick="return mV(\'Gen\',3,\'1-\');">3</A>, taken in connection with the subsequent history of the human race as recorded in Genesis and in the rest of the Old Testament. Many ancient and modern interpreters regard this narrative as an allegorical, mythical or symbolical representation in historical form, either of a psychological fact, i.e. of something which takes place in every individual, or of certain general truths concerning sin. By some exegetes, following Kant, it has been held to depict an advance of the race in culture or ethical knowledge (Reuss; against which view compare Budde, Clemen); by others it has been regarded as a symbolical representation of certain truths concerning sin (Oehler, Schultz); by others it has been regarded as historical (Delitzsch). This latter view is the one which accords with the narrative itself. It is evidently intended as historical by its author, and is so regarded by the New Testament writers. It is, moreover, introduced to explain, not an advance of the race, but the entrance of sin into the world, and the connection of certain penal evils with sin. It does this by showing how these evils came upon Adam as a punishment for his disobedience, and the subsequent history shows that his posterity were subjected to the same evils. It is true that the threat of punishment to Adam in case of disobedience was made to him alone, and that the penalties threatened are said to have come only upon him and Eve (<a onClick="return mV(\'Gen\',3,\'16-19\');">Ge 3:16-19</a>). Nevertheless, it is clear from the account of the subsequent history of the race that it actually shared in the punishments inflicted upon Adam, and that this was in consequence of his sin. This implies that in <a onClick="return mV(\'Gen\',2,16);">Ge 2:16</a>f are contained the terms of a covenant in which Adam acted as the representative of the race. If, therefore, the race shares in the penalty of Adam\'s sin, it must also share in his guilt or the judicial obligation to suffer punishment. And this is precisely what theology of the entire Christian church has meant by saying that the guilt of Adam\'s sin was imputed to his posterity. This is in accordance with God\'s method of dealing with men in other recorded instances (<a onClick="return mV(\'Gen\',19,15);">Ge 19:15</a>; <a onClick="return mV(\'Exd\',20,5);">Ex 20:5</a>; <a onClick="return mV(\'Deu\',1,37);">De 1:37</a>; <a onClick="return mV(\'Deu\',3,26);">3:26</a>); and the assertion of the principle of personal responsibility by Ezekiel and Jeremiah against an abuse of the principle of representative responsibility implies a recognition of the latter (<a onClick="return mV(\'Eze\',18,2,4);">Eze 18:2, 4</a>; <a onClick="return mV(\'Eze\',33,12);">33:12</a>; <a onClick="return mV(\'Jer\',31,29);">Jer 31:29</a>).<P>The universality of sin and death is not brought into connection with the Fall of Adam by the other Old Testament writers. This is done, however, by Paul. In <a onClick="return mV(\'1Cr\',15,21);">1Co 15:21</a>f; Paul says that the death of all men has its cause in the man Adam in the same way in which the resurrection from the dead has its cause in the man Christ. The death of all men, accordingly, is not brought about by their personal sins, but has come upon all through the disobedience of Adam. Upon what ground this takes place, Paul states in the passage <a onClick="return mV(\'Rom\',5,\'12-21\');">Ro 5:12-21</a>. He introduces the subject of Adam\'s relation to the race to illustrate his doctrine of the justification of sinners on the ground of a righteousness which is not personally their own. In order to do this he takes the truth, well known to his readers, that all men are under condemnation on account of Adam\'s sin. The comparison is between Adam and Christ, and the specific point of the comparison is imputed sin and imputed righteousness. Hence, in <a onClick="return mV(\'Rom\',5,12);">5:12</a> Paul does not mean simply to affirm that as Adam sinned and consequently died, so men sin and die. Nor can he mean to say that just as God established a precedent in Adam\'s case that death should follow sin, so He acts upon this precedent in the case of all men because all sin, the real ground of the reign of death being the fact that all sin, and the formal ground being this precedent (B. Weiss); nor that the real ground is this precedent and the subordinate ground the fact that all sin (Hunefeld). Neither can Paul intend to say that all men are subject to death because they derive a corrupt nature from Adam (Fritzsche); nor that men are condemned to die because all have sinned (Pfleiderer). Paul\'s purpose is to illustrate his doctrine of the way in which men are delivered from sin and death by the way in which they are brought into condemnation. The main thought of the passage is that, just as men are condemned on account of the imputation to them of the guilt of Adam\'s sin, so they are justified on account of the imputation to them of the righteousness of Christ. Paul says that it was by one man that sin and death entered into the world, and it was by one man that death passed to all men, because all were implicated in the guilt of that one man\'s Sin (<a onClick="return mV(\'Rom\',5,12);">5:12</A>). In proof of this the apostle cites the fact that death as a punishment was reigning during a period in which the only possible judicial ground of this fact must have been the imputation of the guilt of that one man\'s sin (<a onClick="return mV(\'Rom\',5,13,14);">5:13,14</A>). Hence, there is a precise parallel between Adam and Christ. Just as men are condemned on account of Adam\'s disobedience, so they are justified on account of the obedience of Christ (<a onClick="return mV(\'Rom\',5,18,19);">5:18,19</a>). The thought of the passage is imputed sin and imputed righteousness as the ground of condemnation and of justification respectively.<P>2. Imputation of the Sins of His People to Christ:<P>That our sins are imputed to Christ is not expressly stated in the Scripture, but is implied in those passages which affirm that Christ "bore our sins," and that our iniquities were "laid upon him" by Yahweh. To bear inquity or sin, though it may sometimes mean to bear it away or remove it, is an expression often applied in Scripture to persons charged with guilt and subjected to the punishment of their own sin (<a onClick="return mV(\'Lev\',5,17);">Le 5:17</a>; <a onClick="return mV(\'Lev\',7,18);">7:18</a>; <a onClick="return mV(\'Lev\',19,8);">19:8</a>; <a onClick="return mV(\'Lev\',22,9);">22:9</a>). That the Hebrew verb nasa\' has this meaning is also indicated by its being interchanged with the verb cabhal, which means "to bear as a burden" and is used to denote the bearing of the punishment of sin (<a onClick="return mV(\'Isa\',53,11);">Isa 53:11</a>). In the Old Testament sacrificial system, which according to the New Testament is typical of the sacrifice of Christ, the imposition of hands on the head of the victim signified the substitution of it for the offender and the transfer of his guilt to it. This idea is brought out clearly in the case of the two goats on the great Day of Atonement (<a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>). When, therefore, the Servant of Yahweh in <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> is said "to bear iniquity" (<a onClick="return mV(\'Isa\',53,11);">53:11</A>), or that "the chastisement of our peace was upon him" (<a onClick="return mV(\'Isa\',53,5);">53:5</A>), or that "Yahweh hath laid (literally, "caused to fall") on him the iniquity of us all" (<a onClick="return mV(\'Isa\',53,6);">53:6</a>), the idea expressed is that Christ bore the punishment of our sin vicariously, its guilt having been imputed to Him. The thought of the prophecy is, as Delitzsch says, that of vicarious punishment, which implies the idea of the imputation of the guilt of our sins to Christ.<P>The same idea underlies these expressions when they occur in the New Testament. When Peter wishes to hold up Christ as an example of patience in suffering, he takes up the thought of Isaiah, and adduces the fact that Christ "his own self bare our sins in his body upon the tree". (<a onClick="return mV(\'1Pe\',2,24);">1Pe 2:24</a>). The context indicates that Peter had the prophecy of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> in mind, so that his meaning is, not that Christ carried our sins even up to the cross, but that in His death on the cross Christ bore the punishment of our sin, its guilt having been imputed to Him. The same thought is expressed by the writer of the Epistle to the Hebrews, where the contrast between the first and second advents of Christ is made to hinge upon the fact that in the first He came to be sacrificed as a sin-bearer, burdened with the guilt of the sin of others, whereas in His second coming He will appear without this burden of imputed or vicarious guilt (<a onClick="return mV(\'Hbr\',9,28);">Heb 9:28</a>). Paul also gives expression to the same thought when he says that Christ was "made. to be sin on our behalf" (<a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>), and that He became "a curse for us" (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>). In the former passage the idea of substitution, although not expressed by the preposition huper which indicates that Christ\'s work was for our benefit, is nevertheless clearly implied in the thought that Christ, whose sinlessness is emphasized in the ver, is made sin, and that we sinners become righteous in Him. Paul means that Christ was made to bear the penalty of our sin and that its guilt was imputed to Him in precisely the same way in which we sinners become the righteousness of God in Him, i.e. by the imputation of His righteousness to us. The same thought is expressed in <a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>, where the statement that Christ was made a curse for us means that He was made to endure the curse or penalty of the broken law. In all these passages the underlying thought is that the guilt of our sin was imputed to Christ.<P>3. Imputation of the Righteousness of Christ to His People:<P>The righteousness upon the ground of which God justifies the ungodly is, according to Paul, witnessed to in the Old Testament (<a onClick="return mV(\'Rom\',3,21);">Ro 3:21</a>). In order to obtain the blessedness which comes from a right relation to God, the pardon or non-imputation of sin is necessary, and this takes place through the "covering" of sin (<a onClick="return mV(\'Psa\',32,1,2);">Ps 32:1-2</a>). The nature of this covering by the vicarious bearing of the penalty of sin is made clear in <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>. It is, moreover, the teaching of the Old Testament that the righteousness which God demands is not to be found among men (<a onClick="return mV(\'Psa\',130,3);">Ps 130:3</a>; <a onClick="return mV(\'Psa\',143,2);">143:2</a>; <a onClick="return mV(\'Isa\',64,6);">Isa 64:6</a>). Accordingly, the prophets speak of a righteousness which is not from man\'s works, but which is said to be in Yahweh or to come from Him to His people (<a onClick="return mV(\'Isa\',32,16);">Isa 32:16</a>f; <a onClick="return mV(\'Isa\',45,23);">45:23</a>ff; <a onClick="return mV(\'Isa\',54,17);">54:17</A>; <a onClick="return mV(\'Isa\',58,8);">58:8</A>; <a onClick="return mV(\'Isa\',61,3);">61:3</A>; <a onClick="return mV(\'Jer\',51,10);">Jer 51:10</a>; <a onClick="return mV(\'Hsa\',10,12);">Ho 10:12</a>). This idea finds its clearest expression in connection with the work of the Messiah in <a onClick="return mV(\'Jer\',33,16);">Jer 33:16</a>, where Jerusalem is called "Yahweh our righteousness" because of the coming of the Messianic king, and in <a onClick="return mV(\'Jer\',23,6);">Jer 23:6</a> where the same name is given to the Messiah to express His significance for Israel. Although the idea of the imputation of righteousness is not explicitly asserted in these passages, the idea is not merely that the righteousness spoken of is recognized by Yahweh (Cremer), but that it comes from Him, so that Yahweh, through the work of the Messiah, is the source of His people\'s righteousness.<P>This idea is taken up by Paul, who makes explicit the way in which this righteousness comes to sinners, and who puts the idea of imputed righteousness at the basis of his doctrine of Justification. By the righteousness of Christ Paul means Christ\'s legal status, or the merit acquired by all that He did in satisfying the demands of God\'s law, including what has been called His active and passive obedience. Notwithstanding the fact that most of the modern expositors of Paul\'s doctrine have denied that he teaches the imputation of Christ\'s obedience, this doctrine has a basis in the apostle\'s teaching. Justification leads to life and final glorification (<a onClick="return mV(\'Rom\',5,18);">Ro 5:18</a>; <a onClick="return mV(\'Rom\',8,30);">8:30</a>); and Paul always conceives the obtaining of life as dependent on the fulfillment of the law. If, therefore, Christ secures life for us, it can only be in accordance with this principle. Accordingly, the apostle emphasizes the element of obedience in the death of Christ, and places this act of obedience at the basis of the sinner\'s justification (<a onClick="return mV(\'Rom\',5,18);">Ro 5:18</a>). He also represents the obedience of the cross as the culminating point of a life of obedience on Christ\'s part (<a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>). Moreover, Paul affirms that our redemption from all the demands of the law is secured by the fact that Christ was born under law (<a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>). This cannot be restricted to the fact that Christ was under the curse of the law, for He was born under law and the result of this is that we are free from all of its demands. This doctrine is also implied in the apostle\'s teaching that Justification is absolutely gracious, taken in connection with the fact that it leads to a complete salvation.<P>The importance in Paul\'s thought of the doctrine of the imputation of the righteousness of Christ to the believer can be seen from the fact that the question how righteousness was to be obtained occupied a central place in his religious consciousness, both before and after his conversion. The apostle\'s conversion by the appearance of the risen Christ determined his conception of the true way of obtaining righteousness, since the resurrection of Christ meant for Paul the condemnation of his entire past search for righteousness by works of the law.<P>That the imputation of the righteousness of Christ to the believer does lie at the basis of Paul\'s doctrine of Justification can be further seen from the fact that Justification is absolutely free and unmerited so far as the sinner is concerned (<a onClick="return mV(\'Rom\',3,24);">Ro 3:24</a>; <a onClick="return mV(\'Rom\',5,15);">5:15</a>; <a onClick="return mV(\'Gal\',5,4);">Ga 5:4</a>; <a onClick="return mV(\'Tts\',3,7);">Tit 3:7</a>); its object being one who is ungodly (<a onClick="return mV(\'Rom\',4,5);">Ro 4:5</a>); so that it is not by works (<a onClick="return mV(\'Rom\',3,20,28);">Ro 3:20, 28</a>; <a onClick="return mV(\'Gal\',2,16);">Ga 2:16</a>; <a onClick="return mV(\'Gal\',3,11);">3:11</a>; <a onClick="return mV(\'Gal\',5,4);">5:4</a>; <a onClick="return mV(\'Phl\',3,9);">Php 3:9</a>); and yet that it is not a mere pardon of sin, but is a strictly "forensic" or judicial judgment, freeing the sinner from all the claims of the law, and granting him the right to eternal life. This last truth is plain because God\'s retributive righteousness lies at the basis of Paul\'s doctrine of Justification (<a onClick="return mV(\'Rom\',2,\'1-\');">Ro 2</a>); is manifested in it (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>f); because Christ\'s expiatory work is its ground (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>); and because our redemption from the curse of the law rests upon Christ\'s having borne it for us, and our redemption from all the demands of the law depends upon their fulfillment by Christ (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>; <a onClick="return mV(\'Gal\',4,4);">4:4</a>). Hence, the gracious character of Justification, according to Paul, does not consist in its being merely a gracious pardon without any judicial basis (Ritschl); or in God\'s acceptance of a subjective righteousness produced by Him in the sinner (Tobac); or in the acceptance of faith instead of a perfect righteousness (Cremer). The gracious character of Justification consists for Paul in the fact that the righteousness on the ground of which God justifies the ungodly is a righteousness which is graciously provided by God, and which Paul contrasts with his own righteousness which comes from law works (<a onClick="return mV(\'Phl\',3,9);">Php 3:9</a>). The sinner, therefore, is pardoned and accepted as a righteous person, not on account of anything in himself, but only on account of what Christ has done for him, which means that the merits of Christ\'s suffering and obedience are imputed to the sinner as the ground of his justification.<P>This truth is explicitly affirmed by Paul, who speaks of God\'s imputing righteousness without works, and of righteousness being imputed (<a onClick="return mV(\'Rom\',4,6,11);">Ro 4:6, 11</a>). The idea of the imputation of righteousness here is made clear by the context. The one who is declared righteous is said to be "ungodly" (<a onClick="return mV(\'Rom\',4,5);">Ro 4:5</a>). Hence, he is righteous only by God\'s imputation of righteousness to him. This is also clear from the contrast between imputation according to grace and according to debt (<a onClick="return mV(\'Rom\',4,4);">Ro 4:4</a>). He who seeks righteousness by works would be justified as a reward for his works, in antithesis to which, imputation according to grace would be the charging one with a righteousness which he does not possess. Accordingly, at the basis of Justification there is a reckoning to the sinner of an objective righteousness. This same idea is also implied and asserted by Paul in the parallel which he draws between Adam and Christ (<a onClick="return mV(\'Rom\',5,18);">Ro 5:18</a>f). The apostle says that just as men are condemned on account of a sin not their own, so they are justified on account of a righteousness which is not their own. The idea of imputed sin and imputed righteousness, as was said, is the precise point of the parallelism between condemnation in Adam and justification in Christ. This is also the idea which underlies the apostle\'s contrast of the Old and New Covenants (<a onClick="return mV(\'2Cr\',3,9);">2Co 3:9</a>). The New Covenant is described as a "ministry of righteousness," and contrasted with the Old Covenant which is described as a "ministry of condemnation." If, therefore, this last expression does not denote a subjective condition of men under the old dispensation, but their relation to God as objects of His condemnation, righteousness must denote the opposite of this relation to the law, and must depend on God\'s judicial acquittal. The same truth is expressed by Paul more concretely by saying that Christ has been "made unto us righteousness from God" (<a onClick="return mV(\'1Cr\',1,30);">1Co 1:30</a>). Here the concrete mode of expression is chosen because Paul speaks also of Christ being our sanctification and redemption, so that an expression had to be chosen which would cover all of these ideas. One of the clearest statements concerning this objective righteousness is <a onClick="return mV(\'Phl\',3,9);">Php 3:9</a>. The apostle here affirms that the righteousness which the believer in Christ obtains is directly opposite to his own righteousness. This latter comes from works of the law, whereas the former comes from God and through faith in Christ. It is, therefore, objective to man, comes to him from God, is connected with the work of Christ, and is mediated by faith in Christ.<P>The idea clearly stated in this last passage of a righteousness which is objective to the sinner and which comes to him from God, i.e. the idea of a new legal standing given to the believer by God, explains the meaning, in most cases, of the Pauline phrase "righteousness of God." This phrase is used by Paul 9 times: <a onClick="return mV(\'Rom\',1,17);">Ro 1:17</a>; <a onClick="return mV(\'Rom\',3,5,21,25);">3:5, 21f; 25f</a>; <a onClick="return mV(\'Rom\',10,3);">10:3</a> (twice); <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>. It denotes the Divine attribute of righteousness in <a onClick="return mV(\'Rom\',3,5,25);">Ro 3:5, 25</a>f. The customary exegesis was to regard the other instances as denoting the righteousness of a sinner which comes to him from God, in accordance with <a onClick="return mV(\'Phl\',3,9);">Php 3:9</a>. More recently Haering, following Kolbing in general, has interpreted all these instances as denoting God\'s justifying action. But this interpretation is most strained in <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>, where we are said to "become the righteousness of God," and in <a onClick="return mV(\'Rom\',10,\'3-6\');">Ro 10:3-6</a>, where the righteousness of God is identified with the righteousness which comes from faith, this latter being contrasted with man\'s own inward righteousness. That a righteousness of man which he receives from God is here referred to, is confirmed by the fact that the reason given for the error of the Jews in seeking a righteousness from law works is the fact that the work of Christ has made an end of this method of obtaining righteousness (<a onClick="return mV(\'Rom\',10,4);">Ro 10:4</a>). This righteousness, therefore, is one of which man is the possessor. The phrase, however, cannot mean a righteousness which is valid in God\'s sight (Luther), although this thought is elsewhere expressed by Paul (<a onClick="return mV(\'Rom\',3,20);">Ro 3:20</a>; <a onClick="return mV(\'Gal\',3,11);">Ga 3:11</a>). It means a righteousness which comes from God and of which He is the author. This is not, however, by making man inwardly righteous, since all the above passages show the purely objective character of this righteousness. It is the righteousness of <a onClick="return mV(\'Phl\',3,9);">Php 3:9</a>; the righteousness which God imputes to the believer in Christ. Thus we "become the righteousness of God" in precisely the same sense in which Christ was "made to be sin" (<a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>). Since Christ was made sin by having the guilt. of our sin imputed to Him so that He bore its penalty, Paul must mean that we "become the righteousness of God" in this same objective sense through the imputation to us of the righteousness of Christ. In the same way, in <a onClick="return mV(\'Rom\',10,3);">Ro 10:3</a>, the contrast between God\'s righteousness and the Jew\'s righteousness by works of the law shows that in each case righteousness denotes a legal status which comes from God by imputation. It is this same imputed righteousness which makes the gospel the power of God unto salvation (<a onClick="return mV(\'Rom\',1,17);">Ro 1:17</a>), which has been revealed by the law and the prophets, which is received by faith in Christ by whose expiatory death God\'s retributive righteousness has been made manifest (<a onClick="return mV(\'Rom\',3,21,22,25,26);">Ro 3:21-22, 25-26</a>), and which is represented by Peter as the object of Christian faith (<a onClick="return mV(\'2Pe\',1,1);">2Pe 1:1</a>).<P>In two passages Paul affirms that Abraham believed God and "it was imputed to him for righteousness" (<a onClick="return mV(\'Rom\',4,3);">Ro 4:3</a> the King James Version; <a onClick="return mV(\'Gal\',3,6);">Ga 3:6</a>). The old Arminian theologians, and some modern exegetes (H. Cremer) assert that Paul means that Abraham\'s faith was accepted by God instead of a perfect righteousness as the meritorious ground of his justification. This, however, cannot be the apostle\'s meaning. It is diametrically opposed to the context where Paul introduces the case of Abraham for the very purpose of proving that he was justified without any merit on his part; it is opposed to Paul\'s idea of the nature of faith which involves the renunciation of all claim to merit, and is a simple resting on Christ from whom all its saving efficacy is derived; and this interpretation is also opposed to Paul\'s doctrine of the absolutely gracious character of Justification. The apostle in these passages wishes to illustrate from the case of Abraham the gracious character of Justification, and quotes the untechnical language of <a onClick="return mV(\'Gen\',15,6);">Ge 15:6</a>. His meaning is simply that Abraham was justified as a believer in God, and not as one who sought righteousness by works.<P>LITERATURE.<P>Besides the Comm., see works on Old Testament Theology by Dillmann, Davidson, Oehler, Schultz; and on New Testament Theology by H. Holtzmann, B. Weiss, Schmidt; also Chemnitz, De Vocabulo Imputationis, Loc. Theol., 1594, II, 326ff; J. Martin, The Imputation of Adam\'s Sin,1834, 20-46; Clemen, Die Christliche Lehre yon der Sande, I, 1897, 151-79; Dietzsch, Adam und Christus, 1871; Hunefeld, <span class="noTag">Ro 5:12-21</span>, 1895; Crawford, The Doctrine of the Holy Scripture Respecting the Atonements,1876, 33-45, 188-90. Compare also the appropriate sections in the Works on the Scripture doctrine of Justification, and especially on Paul\'s doctrine of Justification, e.g. Owen, Justification, 1st American edition, 185-310; Ritschl, Die Christliche Lehre yon der Rechtfertigung und VersShnung, II2, 1882, 303-31; Bohl, Von der Rechtfertigung durch den Glauben,1890,115-23; Nosgen, Schriftbeweis fur die evangel. Rechfertigungslehre,1901,147-96; Pfleiderer, Die Paulinische Rechtfertigung, ZWT (Hilgenfeld herausg.),1872, 161-200; Paulinism, English translation, I, 171-86; with which compare Pfleiderer\'s later view of Paul\'s teachings, 2nd edition,1890, 178-89; G. Schwarz, Justitia Imputata? 1891; H. Cremer, Paulinische Rechtfertigungslehre,1900, 329-49; Tobac, Le problame de la justification dans Saint Paul, 1908, 206-25. On Paul\'s doctrine of the righteousness of God, of the many monographs the following may be mentioned: Fricke, Der Paulinische Grundbegriff der erortert auf Grund v. Rom. III, 21-26, 1888; Kolbing, Studien zur Paulinische Theologie, TSK, 1895, 7-51; Haring bei Paulus, 1896.`<a href="./study/isbe/search.html?string=SIN">SIN</a>; <a href="./study/isbe/search.html?string=ATONEMENT">ATONEMENT</a>; <a href="./study/isbe/search.html?string=JUSTIFICATION">JUSTIFICATION</a>`72';
isbe[4579]='Imrah`im\'-ra (yimrah): A descendant of Asher (<a onClick="return mV(\'1Ch\',7,36);">1Ch 7:36</a>).``1';
isbe[4580]='Imri`im\'-ri (\'imri):<P>(1) A Judahite (<a onClick="return mV(\'1Ch\',9,4);">1Ch 9:4</a>).<P>(2) Father of Zaccur who helped to rebuild the walls of Jerusalem under Nehemiah (<a onClick="return mV(\'Neh\',3,2);">Ne 3:2</a>).``1';
isbe[4581]='In`A principal thing to notice about this preposition, which in the King James Version represents about 16 Hebrew and as many Greek words and prepositions, is that, in hundreds of cases (especially in the Old Testament, but frequently also in the New Testament) in the Revised Version (British and American) the rendering is changed to more exact forms ("to," "unto," "by," "upon," "at," "with," "among," "for," "throughout," etc.; compare e.g. <a onClick="return mV(\'Gen\',6,16);">Ge 6:16</a>; <a onClick="return mV(\'Gen\',13,8);">13:8</a>; <a onClick="return mV(\'Gen\',17,7,9,12);">17:7, 9, 12</a>; <a onClick="return mV(\'Gen\',18,1);">18:1</a>; <a onClick="return mV(\'Exd\',8,17);">Ex 8:17</a>; <a onClick="return mV(\'Lev\',1,9);">Le 1:9</a>, etc.); while, nearly as often, "in" is substituted for divergent forms of the King James Version (e.g. <a onClick="return mV(\'Gen\',2,14);">Ge 2:14</a>; <a onClick="return mV(\'Gen\',17,11);">17:11</a>; <a onClick="return mV(\'Gen\',31,54);">31:54</a>; <a onClick="return mV(\'Gen\',40,7);">40:7</a>; <a onClick="return mV(\'Gen\',49,17);">49:17</a>; <a onClick="return mV(\'Exd\',8,14,24);">Ex 8:14, 24</a>; <a onClick="return mV(\'Lev\',3,17);">Le 3:17</a>; <a onClick="return mV(\'Lev\',4,2);">4:2</a>, etc.). The chief Greek preposition en, is frequently adhered to as "in" in the Revised Version (British and American) where the King James Version has other forms ("with," "among," etc.; compare "in" for "with" in John\'s baptism, <a onClick="return mV(\'Mat\',3,11);">Mt 3:11</a>, and parallel; "in the tombs" for "among the tombs," <a onClick="return mV(\'Mar\',5,3);">Mr 5:3</a>). In <a onClick="return mV(\'2Th\',2,2);">2Th 2:2</a>, "shaken in mind" in the King James Version is more correctly rendered in the Revised Version (British and American) "shaken from (apo) your mind." There are numerous such instructive changes.``132';
isbe[4582]='In the Lord`(en Kurio): A favorite Pauline expression, denoting that intimate union and fellowship of the Christian with the Lord Jesus Christ which supplies the basis of all Christian relations and conduct, and the distinctive element in which the Christian life has its specific character. Compare the synonymous Pauline phrases, "in Christ," "in Christ Jesus," and the Johannine expressions, "being in Christ," "abiding in Christ." "In the Lord" denotes:<p class="in15"><p>(1) the motive, quality, or character of a Christian duty or virtue, as based on union with Christ, e.g. "Free to be married to whom she will; only in the Lord" (<a onClick="return mV(\'1Cr\',7,39);">1Co 7:39</a>), i.e. provided the marriage be consistent with the Christian life. Compare <a onClick="return mV(\'1Cr\',15,58);">1Co 15:58</a>; <a onClick="return mV(\'Phl\',3,1);">Php 3:1</a>; <a onClick="return mV(\'Phl\',4,1,2,4,10);">4:1-2, 4, 10</a>; <a onClick="return mV(\'Eph\',6,1,10);">Eph 6:1, 10</a>; <a onClick="return mV(\'Col\',3,18);">Col 3:18</a>, etc.;<p>(2) the ground of Christian unity, fellowship, and brotherly salutation, e.g. <a onClick="return mV(\'Rom\',16,2,8,22);">Ro 16:2, 8, 22</a>; <a onClick="return mV(\'1Cr\',16,19);">1Co 16:19</a>; <a onClick="return mV(\'Col\',4,7);">Col 4:7</a>;<p>(3) it is often practically synonymous with "Christian" (noun or adjective), "as Christians" or "as a Christian," e.g. "Salute them of the household of Narcissus, that are in the Lord," i.e. that are Christians (<a onClick="return mV(\'Rom\',16,11);">Ro 16:11</a>); "I...the prisoner in the Lord," i.e. the Christian prisoner (<a onClick="return mV(\'Eph\',4,1);">Eph 4:1</a>); compare <a onClick="return mV(\'Rom\',16,13);">Ro 16:13</a>; <a onClick="return mV(\'1Cr\',9,1,2);">1Co 9:1-2</a>; <a onClick="return mV(\'Eph\',6,21);">Eph 6:21</a> ("faithful minister in the Lord" = faithful Christian minister); <a onClick="return mV(\'Col\',4,17);">Col 4:17</a> (see Grimm-Thayer, Lex. of New Testament, en, I, 6).``49';

isbe[4585]='Incense`in\'-sens (qetorah; in <a onClick="return mV(\'Jer\',44,21);">Jer 44:21</a>, qitter; in <a onClick="return mV(\'Mal\',1,11);">Mal 1:11</a>, qatar, "In every place incense shall be offered unto my name"; the word lebhonah, translated "incense" in several passages in Isaiah and Jeremiah in the King James Version, is properly "frankincense," and is so rendered in the Revised Version (British and American)): The offering of incense, or burning of aromatic substances, is common in the religious ceremonies of nearly all nations (Egyptians, Babylonians, Assyrians, Phoenicians, etc.), and it is natural to find it holding a prominent place in the tabernacle and temple-worship of Israel. The newer critical theory that incense was a late importation into the religion of Israel, and that the altar of incense described in <a onClick="return mV(\'Exd\',30,1);">Ex 30:1</a>ff is a post-exilian invention, rests on presuppositions which are not here admitted, and is in contradiction to the express notices of the altar of incense in <a onClick="return mV(\'1Ki\',6,20,22);">1Ki 6:20, 22</a>; <a onClick="return mV(\'1Ki\',7,48);">7:48</a>; <a onClick="return mV(\'1Ki\',9,25);">9:25</a>; compare <a onClick="return mV(\'2Ch\',4,19);">2Ch 4:19</a> (see discussion of the subject by Delitzsch in Luthardt\'s Zeitschrift, 1880, 113ff). In the denunciation of Eli in <a onClick="return mV(\'1Sa\',2,27);">1Sa 2:27</a>ff, the burning of incense is mentioned as one of the functions of the priesthood (<a onClick="return mV(\'1Sa\',2,28);">2:28</A>). The "smoke" that filled the temple in Isaiah\'s vision (<a onClick="return mV(\'Isa\',6,4);">Isa 6:4</a>) may be presumed to be the smoke of incense. The word ketorah itself properly denotes. "smoke." For the altar of incense see the article on that subject, and <a href="study/isbe/search.html?string=TABERNACLE,+A">TABERNACLE</a> and <a href="study/isbe/search.html?string=TEMPLE,+A1">TEMPLE</a>. The incense used in the tabernacle service—called "sweet incense" (ketoreth ha-cammim, <a onClick="return mV(\'Exd\',25,6);">Ex 25:6</a>, etc.)—was compounded according to a definite prescription of the perfumes, stacte, onycha, galbanum and pure frankincense (<a onClick="return mV(\'Exd\',30,34);">Ex 30:34</a>f), and incense not so compounded was rejected as "strange incense" (ketorah zarah, <a onClick="return mV(\'Exd\',30,9);">Ex 30:9</a>). In the offering of incense, burning coals from the altar of burnt offering were borne in a censer and put upon the altar of incense (the "golden altar" before the oracle), then the fragrant incense was sprinkled on the fire (compare <a onClick="return mV(\'Luk\',1,9);">Lu 1:9</a>f). Ample details of the rabbinical rules about incense may be seen in the article "Incense," in DB.<P>Figuratively, incense was symbolical of ascending prayer. The multitude were praying while Zacharias offered incense (<a onClick="return mV(\'Luk\',1,10);">Lu 1:10</a>, thumiama), and in <a onClick="return mV(\'Rev\',5,8);">Re 5:8</a>; <a onClick="return mV(\'Rev\',8,3);">8:3</a>f; the incense in the heavenly temple is connected and even identified (<a onClick="return mV(\'Rev\',5,8);">5:8</A>) with "the prayers of the saints."`<a href="./study/isbe/search.html?string=CENSER">CENSER</a>`132';
isbe[4586]='Incest`in\'-sest.`<a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>`1';
isbe[4587]='Incontinency`in-kon\'-ti-nen-si (akrasia, "without control"): In <a onClick="return mV(\'1Cr\',7,5);">1Co 7:5</a>, it evidently refers to lack of control in a particular matter, and signifies unchastity. In <a onClick="return mV(\'Mat\',23,25);">Mt 23:25</a>, the Greek word is translated in both the King James Version and the American Standard Revised Version by "excess."``1';
isbe[4588]='Incorruption`in-ko-rup\'-shun (aphtharsia): Occurs in <a onClick="return mV(\'1Cr\',15,42,50,53,54);">1Co 15:42, 50, 53-54</a>, of the resurrection body, and is twice used in the Revised Version (British and American) for the King James Version "immortality" (<a onClick="return mV(\'Rom\',2,7);">Ro 2:7</a>; <a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a> margin).`<a href="./study/isbe/search.html?string=IMMORTALITY">IMMORTALITY</a>`1';
isbe[4589]='Increase`in\'-kres, (noun), in-kres\' (verb): Employed in the English Bible both as verb and as noun, and in both cases to represent a number of different words in the original. As a verb it is used in the ordinary sense of the term. As a noun it is usually used of plant life, or of the herds and flocks, to denote the fruitage or the offspring; more rarely of money, to denote the interest. As examples of the different terms translated by this word, students who read Hebrew or Greek may compare <a onClick="return mV(\'Deu\',7,22);">De 7:22</a>; <a onClick="return mV(\'Pro\',16,21);">Pr 16:21</a>; <a onClick="return mV(\'Job\',10,16);">Job 10:16</a> the King James Version; <a onClick="return mV(\'Job\',12,23);">Job 12:23</a>; <a onClick="return mV(\'Num\',18,30);">Nu 18:30</a>; <a onClick="return mV(\'Deu\',7,13);">De 7:13</a>; <a onClick="return mV(\'Eze\',22,12);">Eze 22:12</a> in the Old Testament, and <a onClick="return mV(\'Jhn\',3,30);">Joh 3:30</a>; <a onClick="return mV(\'1Cr\',3,6);">1Co 3:6</a>; <a onClick="return mV(\'Col\',2,19);">Col 2:19</a>; <a onClick="return mV(\'Eph\',4,16);">Eph 4:16</a> in the New Testament.``121';
isbe[4590]='India`in\'-di-a (hoddu: he Indike): The name occurs in canonical Scripture only in <a onClick="return mV(\'Est\',1,1);">Es 1:1</a>; <a onClick="return mV(\'Est\',8,9);">8:9</a>, of the country which marked the eastern boundary of the territory of Ahasuerus. The Hebrew word comes from the name of the Indus, Hondu, and denotes, not the peninsula of Hindustan, but the country drained by that great river. This is the meaning also in 1Esdras 3:2; Additions to <span class="noTag">Esther 3:2; 16:1</a>. Many have thought that this country is intended by Havilah in <a onClick="return mV(\'Gen\',2,11);">Ge 2:11</a> and that the Indus is the Pishon. The drivers of the elephants (1Macc 6:37) were doubtless natives of this land. The name in 1Macc 8:9 is certainly an error. India never formed part of the dominions of Antiochus the Great. It may possibly be a clerical error for "Ionia," as Media is possibly a mistake for Mysia. If the Israelites in early times had no direct relations with India, many characteristic Indian products seem to have found their way into Palestinian markets by way of the Arabian and Syrian trade routes, or by means of the Red Sea fleets (<a onClick="return mV(\'1Ki\',10,11,15);">1Ki 10:11, 15</a>; <a onClick="return mV(\'Eze\',27,15);">Eze 27:15</a>ff, etc.). Among these may be noted "horns of ivory and ebony," "cassia and calamus," almug (sandalwood), apes and peacocks.``54';
isbe[4591]='Indignities`in-dig\'-ni-tiz.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[4592]='Indite`in-dit\':the King James Version <a onClick="return mV(\'Psa\',45,1);">Ps 45:1</a>, "My heart is inditing a good matter"; the Revised Version (British and American) "My heart overfloweth with a goodly matter," is in harmony with rachash, "to bubble up"; compare Septuagint exereuxato, "to pour out." "Indite" in English is becoming obsolete. It may mean "to dictate," "to invite," "to compose." In the latter meaning it is used in the above passage.``1';

isbe[4596]='Infidel`in\'-fi-del (apistos, "unbelieving," "incredulous"): the King James Version has this word twice: "What part hath he that believeth with an infidel?" (<a onClick="return mV(\'2Cr\',6,15);">2Co 6:15</a>); "If any provide not for his own,...is worse than an infidel" (<a onClick="return mV(\'1Ti\',5,8);">1Ti 5:8</a>). In both passages the English Revised Version and the American Standard Revised Version have "unbeliever" in harmony with numerous other instances of the use of the Greek apistos. The word nowhere corresponds to the modern conception of an infidel, one who denies the existence of God, or repudiates the Christian faith; but always signifies one who has not become a believer in Christ. It was formerly so used in English, and some of the older versions have it in other passages, besides these two. It is not found in the Old Testament, but "infidelity" (incredulity) occurs in 2Esdras 7:44 (114).``21';
isbe[4597]='Infinite; Infinitude`in\'-fin-it, in-fin\'-i-tud:<P>1. Scripture Use:<P>The word "infinite" occurs 3 times only in the text of the King James Version (<a onClick="return mV(\'Job\',22,5);">Job 22:5</a>; <a onClick="return mV(\'Psa\',147,5);">Ps 147:5</a>; <a onClick="return mV(\'Nah\',3,9);">Na 3:9</a>) and once in margin (<a onClick="return mV(\'Nah\',2,9);">Na 2:9</a>). In <a onClick="return mV(\'Psa\',147,5);">Ps 147:5</a>, "His understanding is infinite" it represents the Hebrew \'en micpar, "no number"; in the other passages the Hebrew \'en qets (<a onClick="return mV(\'Job\',22,5);">Job 22:5</a>, of iniquities) and \'en qetseh (<a onClick="return mV(\'Nah\',3,9);">Na 3:9</a>, of strength of Ethiopia and Egypt; the King James Version margin <a onClick="return mV(\'Nah\',2,9);">2:9</A>, of "spoil"), meaning "no end." the Revised Version (British and American), therefore, renders in <a onClick="return mV(\'Job\',22,5);">Job 22:5</a>, "Neither is there any end to thine iniquities," and drops the marginal reference in <a onClick="return mV(\'Nah\',2,9);">Na 2:9</a>.<P>2. Application to God:<P><a onClick="return mV(\'Psa\',147,5);">Ps 147:5</a> is thus the only passage in which the term is directly applied to God. It there correctly conveys the idea of absence of all limitation. There is nothing beyond the compass of God\'s understanding; or, positively, His understanding embraces everything there is to know. Past, present and future; all things possible and actual; the inmost thoughts and purposes of man, as well as his outward actions, lie bare to God\'s knowledge (<a onClick="return mV(\'Hbr\',4,13);">Heb 4:13</a>; see <a href="study/isbe/search.html?string=OMNISCIENCE">OMNISCIENCE</A>).<P>3. Infinity Universally Implied:<P>While, however, the term is not found, the truth that God is infinite, not only in His understanding, but in His being and all His perfections, natural and moral, is one that pervades all Scripture. It could not be otherwise, if God was unoriginated, exalted above all limits of time, space and creaturehood, and dependent only on Himself. The Biblical writers, certainly, are far from thinking in metaphysical categories, or using such terms as "self-existence," "absoluteness," "unconditioned" yet the ideas for which these terms stand were all of them attributed in their conceptions to God. They did not, e.g. conceive of God as having been born, or as having a beginning, as the Babylonian and Greek gods had, but thought of Him as the ever-existing One (<a onClick="return mV(\'Psa\',90,1,2);">Ps 90:1-2</a>), and free Creator and Disposer of all that exists. This means that God has self-existence, and for the same reason that He is not bound by His own creation. He must be thought of as raised above all creaturely limits, that is, as infinite.<P>4. Anthropomorphisms:<P>The anthropomorphisms of the Bible, indeed, are often exceedingly naive, as when Yahweh is said to "go down" to see what is being done (<a onClick="return mV(\'Gen\',11,5,7);">Ge 11:5, 7</a>; <a onClick="return mV(\'Gen\',18,21);">18:21</a>), or to "repent" of His actions (<a onClick="return mV(\'Gen\',6,6);">Ge 6:6</a>); but these representations stand in contexts which show that the authors knew God to be unlimited in time, space, knowledge and power (compare <a onClick="return mV(\'Gen\',6,7);">Ge 6:7</a>, God, Creator of all; <a onClick="return mV(\'Gen\',11,8,9);">11:8,9</a>, universal Ruler; <a onClick="return mV(\'Gen\',18:25,7);">18:25</A>, universal Judge; <a onClick="return mV(\'Num\',23,19);">Nu 23:19</a>, incapable of repentance, etc.). Like anthropomorphisms are found in Deuteronomy and the Prophets, where it is not doubted that the higher conceptions existed. In this infinity of God is implied His unsearchableness (<a onClick="return mV(\'Job\',11,7);">Job 11:7</a>; <a onClick="return mV(\'Psa\',145,3);">Ps 145:3</a>; <a onClick="return mV(\'Rom\',11,33);">Ro 11:33</a>); conversely, the latter attribute implies His infinity.<P>5. Infinity a Perfection Not a Quantity:<P>This infinitude of God is displayed in all His attributes—in His <a href="./study/isbe/search.html?string=ETERNITY">eternity</A>, <a href="./study/isbe/search.html?string=OMNIPRESENCE">omnipresence</A>, <a href="./study/isbe/search.html?string=OMNISCIENCE">omniscience</a>, <a href="./study/isbe/search.html?string=OMNIPOTENCE">omnipotence</A>, etc.—on which see the separate articles. As regards the proper conception of infinity, one has chiefly to guard against figuring it under too quantitative an aspect. Quantitative boundlessness is the natural symbol we employ to represent infinity, yet reflection will convince us that it is inadequate as applied to a spiritual magnitude. Infinitude in power, e.g. is not an infinite quantity of power, but the potentiality in God of accomplishing without limit everything that is possible to power. It is a perfection, not a quantity. Still more is this apparent in moral attributes like love, righteousness, truth, holiness. These attributes are not quantities (a quantity can never be truly infinite), but perfections; the infinity is qualitative, consisting in the absence of all defect or limitation in degree, not in amount.<P>6. Errors Based on Quantitative Conceptions:<P>The recollection of the fact now stated will free the mind from most of the perplexities that have been raised by metaphysical writers as to the abstract possibility of the co-existence of infinite attributes in God (thus e.g. Mansel); the reconcilability of God\'s infinity with His Personality, or with the existence of a finite world; the power of the human mind to conceive infinity, etc. How, it is asked, can the idea of infinity get into our finite minds? It might as well be asked how the mind can take in the idea of the sun\'s distance of some 90 million miles from the earth, when the skull that holds the brain is only a few cubic inches in capacity. The idea of a mile is not a mile big, nor is the idea of infinity too large to be thought of by the mind of man. The essence of the power of thought is its capacity for the universal, and it cannot rest till it has apprehended the most universal idea of all the infinite.``132';
isbe[4598]='Infirmity`in-fur\'-mi-ti (dawah, chalah, machalah; astheneia): This word is used either in the singular or plural (the latter only in the New Testament) and with somewhat varying signification.<P>(1) As sickness or bodily disease (<a onClick="return mV(\'Jhn\',5,5);">Joh 5:5</a>; <a onClick="return mV(\'Mat\',8,17);">Mt 8:17</a>; <a onClick="return mV(\'Luk\',5,15);">Lu 5:15</a>; <a onClick="return mV(\'Luk\',8,2);">8:2</a>; <a onClick="return mV(\'1Ti\',5,23);">1Ti 5:23</a>). In the last instance the affections seem to have been dyspeptic, the discomfort of which might be relieved by alcohol, although the disease would not be cured thereby. It is probable that this condition of body produced a certain slackness in Timothy\'s work against which Paul several times cautions him. In <a onClick="return mV(\'Luk\',7,21);">Lu 7:21</a> the Revised Version (British and American) has "diseases," which is a better rendering of the Greek noson, used here, than the King James Version "infirmities."<P>(2) Imperfections or weaknesses of body (<a onClick="return mV(\'Rom\',6,19);">Ro 6:19</a>; <a onClick="return mV(\'2Cr\',11,30);">2Co 11:30</a> the King James Version; <a onClick="return mV(\'2Cr\',12,5,9,10);">2Co 12:5, 9-10</a> the King James Version; <a onClick="return mV(\'Gal\',4,13);">Ga 4:13</a>).<P>(3) Moral or spiritual weaknesses and defects (<a onClick="return mV(\'Psa\',77,10);">Ps 77:10</a>; <a onClick="return mV(\'Rom\',8,26);">Ro 8:26</a>; <a onClick="return mV(\'Rom\',15,1);">15:1</a>; <a onClick="return mV(\'Hbr\',4,15);">Heb 4:15</a>; <a onClick="return mV(\'Hbr\',5,2);">5:2</a>; <a onClick="return mV(\'Hbr\',7,28);">7:28</a>). In this sense it is often used by the classic English writers, as in Milton\'s "the last infirmity of noble minds"; compare Caesar, IV, iii, 86. The infirmity which a man of resolution can keep under by his will (<a onClick="return mV(\'Pro\',18,14);">Pr 18:14</a>) may be either moral or physical. In <a onClick="return mV(\'Luk\',13,11);">Lu 13:11</a> the woman\'s physical infirmity is ascribed to the influence of an evil spirit.``107';
isbe[4599]='Inflame; Enflame`in-flam\', en-flam\' (dalaq): "To inflame" in the meaning "to excite passion" is found in <a onClick="return mV(\'Isa\',5,11);">Isa 5:11</a>, "till wine inflame them." In some the King James Version passages (e.g. <a onClick="return mV(\'Isa\',57,5);">Isa 57:5</a>) we find "enflaming" with the same meaning; compare the King James Version Susanna verse 8 and Sirach 28:10 the King James Version (the Revised Version (British and American) "inflame").``1';
isbe[4600]='Inflammation`in-fla-ma\'-shun (dalleqeth; rhigos): Only in <a onClick="return mV(\'Deu\',28,22);">De 28:22</a>, was considered by Jewish writers as "burning fever," by Septuagint as a form of ague. Both this and typhoid fever are now, and probably were, among the commonest of the diseases of Palestine. See <a href="study/isbe/search.html?string=FEVER">FEVER</A>. In <a onClick="return mV(\'Lev\',13,28);">Le 13:28</a> the King James Version has "inflammation" as the rendering of tsarebheth, which Septuagint reads charakter, and for which the proper English equivalent is "scar," as in the Revised Version (British and American).``1';
