isbe[4555]='Images`im\'-aj-iz (tselem; eikon):<P>1. Definition<P>2. Origin<P>3. Historical Beginnings and Early Developments<P>4. Bible References and Palestinian Customs<P>5. Most Important Technical Terms<P class="in15">(1) Matstsebhah ("pillar")<P class="in15">(2) \'Asherah ("grove")<P class="in15">(3) Chamman ("sun-image")<P>6. Obscure Bible References<P class="in15">(1) Golden Calf<P class="in30">Jeroboam\'s Calves<P class="in15">(2) Brazen Serpent<P class="in15">(3) Teraphim<P class="in15">(4) Image of Jealousy<P class="in15">(5) Chambers of Imagery<P class="in15">(6) \'Ephod<P>LITERATURE<hr /><P>1. Definition:<P>Images, as used here, are visible representations of supposedly supernatural or divine beings or powers. They may be<P>(1) themselves objects of worship,<P>(2) pictures, embodiments or dwelling-places (temple, ark, pillar, priests) of deities worshipped,<P>(3) empowered instruments (amulets, charms, etc.) of object or objects worshipped,<P>(4) pictures or symbols of deities reverenced though not worshipped.<P>These images may be shapeless blocks, or symmetrically carved figures, or objects of Nature, such as animals, sun, moon, stars, etc. These visible objects may sometimes be considered, especially by the uninstructed, as deities, while by others in the small community they are thought of as instruments or symbolizations of deity. Even when they are thought of as deities, this does not exclude a sense and apprehension of a spiritual godhead, since visible corporeal beings may have invisible souls and spiritual attributes, and even the stars may be thought of as "seats of celestial spirits." An idol is usually considered as either the deity itself or his permanent tenement; a fetish is an object which has been given a magical or divine power, either because of its having been the temporary home of the deity, or because it has been formed or handled or otherwise spiritually influenced by such deity. The idol is generally communal, the fetish private; the idol is protective, the fetish is usually not for the common good. (See Jevons, Idea of Cod in Early Religions, 1910.) Relics and symbolic figures do not become "images" in the objectionable sense until reverence changes to worship. Until comparatively recent times, the Hebrews seem to have offered no religious objection to "artistic" images, as is proved not only from the description of Solomon\'s temple, but also from the discoveries of the highly decorated temple of Yahweh at Syene dating from the 6th century BC, and from ruins of synagogues dating from the pre-Christian and early Christian periods (PEF, January, 1908; The Expositor, December, 1907; Expository Times, January and February, 1908). The Second Commandment was not an attack upon artists and sculptors but upon idolaters. Decoration by means of graven figures was not in ancient times condemned, though, as Josephus shows, by the time of the Seleucids all plastic art was regarded with suspicion. The brazen serpent was probably destroyed in Hezekiah\'s time because it had ceased to be an ancient artistic relic and had become an object of worship (see below). So the destruction of the ark and altar and temple, which for so long a time had been the means of holy worship, became at last a prophetic hope (<a onClick="return mV(\'Isa\',6,7);">Isa 6:7</a>; <a onClick="return mV(\'Jer\',3,6);">Jer 3:6</a>; <a onClick="return mV(\'Amo\',5,25);">Am 5:25</a>; <a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>; compare <a onClick="return mV(\'Zec\',14,20);">Zec 14:20</a>). While the temple is not naturally thought of as an "image," it was as truly so as any Bethel. An idol was the temple in miniature—a dwelling-place of the god. When an image became the object of worship or a means by which a false god was worshipped, it became antagonistic to the First and Second Commandments respectively.<P>2. Origin:<P>The learned author of the article on "Image Worship" in the Encyclopedia Biblica (11th edition) disposes too easily of this question when he suggests that image-worship is "a continuance by adults of their childish games with dolls...Idolatrous cults repose largely on make-believe."<P>Compare the similar statement made from a very different standpoint by the author of Great Is Diana of the Ephesians, or the Original of Idolatry (1695): "All Superstitions are to the People but like several sports to children, which varying in their several seasons yield them pretty entertainment," etc.<P>No universal institution or custom is founded wholly on superstition. If it does not answer to some real human need, and "if its foundations are not laid broad and deep in the nature of things, it must perish" (J.G. Fraser, Psyche\'s Task, 1909, 103; compare Salomon Reinach, Revue des etudes grecques, 1906, 324). Image-worship is too widespread and too natural to humanity, as is proved in modern centuries as well as in the cruder earlier times, to have its basis and source in any mere external and accidental circumstances. All modern research tends to corroborate our belief that this is psychological rather than ecclesiastical in its origin. It is not imposed externally; it comes from within, and naturally accompanies the organic unfoldment of the human animal in his struggle toward self-expression. This is now generally acknowledged to be true of religious feeling and instinct (see especially Rudolf Eueken, Christianity and the New Idealism, 1909, chapter i; I. King, The Development of Religion, 1910); it ought to be counted equally true of religious expression. Neither can the origin of image-worship or even of magical rites be fully explained, as Fraser thinks, by the ordinary laws of association. These associations only become significant because the devoted worshipper already has a body of beliefs and generalizations which make him attentive to the associations which seem to him religiously or magically important. (Jastrow, Aspects of Rel. Belief and Practice in Babylonia and Assyria; compare James H. Leuba, Psychological Origin and Nature of Religion, 1909; Study of Religions, 1911). So animism must be regarded as a philosophy rather than as an original religious faith, since it is based on an "explanation of phenomena rather than an attitude of mind toward the cause of these phenomena" (EB, 11th edition, article "Animism," and compare Hoffding, Philosophy of Religion,1906,138). In whatever ways the various image-worshipping cults arose historically—whether from a primitive demonology or from the apotheosis of natural objects, or from symbolism, or a false connection of cause with effect—in any case it had some human need behind it and human nature beneath it. The presence of the image testifies to faith in the supernatural being represented by the image and to a desire to keep the object of worship near. Prayer is easier when the worshipper can see his god or some sacred thing the god has honored (compare M. L\'abbe E. Van Drival, De l\'origine et des sources de l\'idolatrie, Paris, 1860).<P>3. Historical Beginnings and Early Development:<P>The first man was not born with a totem-pole in his fist, nor did the earliest historic men possess images. They lacked temples and altars and ephods and idols, as they lacked the fire-stick and potter\'s wheel. Religion, which showed itself so strong in the next stage of human life, must have had very firm beginnings in the prehistoric period; but what were its external expressions we do not yet certainly know, except in the methods of burying and caring for the dead. It seems probable that primitive historic man saw in everything that moved an active soul, and that he saw in every extraordinary thing in earth or heaven the expression of a supernatural power. Yet reflective thinking began earlier than Tylor and all the older scientific anthropologists supposed. Those earlier investigators were without extended chronological data, and although ingenuity was exercised in systematizing the beliefs and customs of modern savages, it was necessarily impossible always to determine in this way which were the most primitive cults. Excavations in Babylonia, Egypt and elsewhere have enabled us for the first time to trace with some chronological certainty the religious expressions of earliest historic man. That primitive man was so stupid that he could not tell the difference between men and things, and that therefore totemism or fetishism or a low form of animism was necessarily the first expression of religious thought is a theory which can no longer be held very buoyantly in the face of the new and striking knowledge, material and religious, which is now seen to be incorporated in some of the most ancient myths of mankind. (See e.g. Winekler, Die jungsten Kampfe wider den Panbabylonismus, 1907; Jeremias, The Old Testament in the Light of the Ancient East, 2 volumes, 1911.) The pan-Bab theory, which makes so much use of these texts, is not certain, but the facts upon which theory depends are clear. It is a suggestive fact that among the earliest known deities or symbols of deities mentioned in the most ancient inscriptions are to be found the sun, moon, stars and other great forces of Nature. Out of these conceptions and the mystery of life—which seems to have affected early mankind even more powerfully than ourselves—sprang the earliest known religious language, the myth, which antedated by eons our oldest written texts, since some of these myths appear fully formed in the oldest texts. Rough figures of these solar and stellar deities are found from very early times in Babylonia. So in the earliest Egyptian texts the sun appears as divine and the moon as "the bull among the stars," and rough figures of the gods were carved in human or animal form, or these are represented pictorially by diadems or horns or ostrich feathers, as far back as the IInd Dynasty, while even earlier than this stakes and pillars and heaps of stones are sacred. (See further, HDB, 5th vol, 176ff; Erman, A Handbook of Egyptian Rel.; Steindorf, Rel. of the Ancient Egyptians, 1905.) These rude and unshaped objects do not testify, as was once supposed, to a lower form of religious development than when sculptured images are found. The shapeless fetish, which not long ago was generally accepted as the earliest form of image, really represents a more advanced stage and higher form of religious expression than the worship of a beautifully or horribly carved image. It has been generally conceded since the days of Robertson Smith that it takes at least as much imagination and reflection to see an expression of deity in imageless matter as in the carved forms. Rude objects untouched by human hand, even in the most highly developed worships, have been most prized. The earliest images were probably natural objects which, because of their peculiar shapes or functions, were thought of either as divine or as made sacred by the touch of deity. Multiplied copies of these objects would naturally be made when worshippers increased or migrations occurred. While images may have been used in the most early cults, yet the highest development of image-worship has occurred among the most civilized peoples. Both deities and idols are less numerous in the early than in the later days of a religion. This is true in India, Assyria, Babylonia, and Egypt, as all experts now agree. Idols are not found among uncivilized peoples, such as the Bushmen, Fuegians, Eskimos, etc. (See e.g. Allen Menzies, History of Rel., 1895.) Images of the gods presuppose a power of discrimination that could only be the result of reflection. The earliest idols known among the Semites were rude stone pillars or unshapen blocks. These, as the fetish, were probably adored, not for themselves, but for the spirit that was supposed to be in them or to have touched them. Deities and idols are multiplied easily, not only by philological, geographical and social causes, but through intertribal and international associations. One thing absolutely proved by recent excavations has been the extent to which the representations of local deities have been modified by the symbolic art of surrounding nations. Babylonia, for example, was influenced by the Syro-Hittite religious art at least as much as by that of Egypt (William Hayes Ward, Cylinders and Other Ancient Oriental Seals, 1909; Clay, Amurru, 1910). Even in adjacent localities the same deity varied greatly in its pictorial representation. See <a href="study/isbe/search.html?string=PALESTINE+EXPLORATION,+1">PALESTINE EXPLORATION</a>, and Revue biblique, XIV, 315-48. With the possible exception of one reign in Egypt, during which Ikhnaton refused to allow any deities to be worshipped except the sun discovered and himself, idolatry outside of the Hebrew kingdom was never made a crime against the state until the days of Constantine. Theodosius (392 AD) not only placed sacrifices and divination among the capital crimes, but placed a penalty upon anyone who entered a heathen temple.<P>4. Bible References and Palestinian Customs:<P>The dignity of the image in common thought in Bible times may be seen from the fact that man is said to have been made in God\'s image (tselem; compare <a onClick="return mV(\'1Sa\',6,5);">1Sa 6:5</a>; <a onClick="return mV(\'Num\',33,52);">Nu 33:52</a>), and Christ is said to be "the image of the invisible God" (eikon; compare <a onClick="return mV(\'Col\',1,15);">Col 1:15</a> with <a onClick="return mV(\'Rom\',1,23);">Ro 1:23</a>). The heathen thought of the sun and stars and idols as being images of the gods, but the Hebrews, though Yahweh\'s temple was imageless, thought of normal humanity as in some true sense possessing a sacred resemblance to Deity, though early Christians taught that only Christ was the Father s "image" in unique and absolute perfection. See <a href="study/isbe/search.html?string=IMAGE">IMAGE</A>. The ordinary words for "image" by a slight change came to mean vermin, carrion, false gods, no gods, carcasses, dung, etc. Heathen gods were undoubtedly accounted real beings by the early Hebrews, and the images of these enemies of Yahweh were doubtless looked upon as possessing an evil associated (?) power. In the earlier Old Testament era, images, idols, and false gods are synonymous; but as early as the 8th century BC Hebrew prophets begin to reach the lofty conception that heathen gods are non-existent, or at least practically so, when compared with the ever-living Yahweh, while the idols are "worthless things" or "non-entities" (<a onClick="return mV(\'Isa\',2,8,18,20);">Isa 2:8, 18, 20</a>; <a onClick="return mV(\'Isa\',10,10,11);">10:10-11</a>; <a onClick="return mV(\'Isa\',19,1);">19:1</a>; <a onClick="return mV(\'Isa\',31,7);">31:7</a>; compare <a onClick="return mV(\'Jer\',14,14);">Jer 14:14</a>; <a onClick="return mV(\'Eze\',30,13);">Eze 30:13</a>; note the satiric term \'elilim, as contrasted with the powerful \'elohim). The many ordinary terms used by the Hebrews for an idol or image mean "copy," simulacrum, "likeness," "representation." These are often, however, so compounded as technically to express a particular form, as "graven" or "carved" image (e.g. <a onClick="return mV(\'Exd\',20,4);">Ex 20:4</a>; <a onClick="return mV(\'2Ch\',33,7);">2Ch 33:7</a>) of wood or stone, i.e. one cut into shape by a tool; "molten image" (e.g. <a onClick="return mV(\'Exd\',32,4);">Ex 32:4</a>; <a onClick="return mV(\'Lev\',19,4);">Le 19:4</a>), i.e. one cast out of melted metal (standing image) (<a onClick="return mV(\'Lev\',26,1);">Le 26:1</a> the King James Version, and see below), etc. However, a few of the Old Testament terms and modes of worship are unusual, or have a more difficult technical meaning, or have been given a new interest by new discoveries, and such deserve a more extended notice.<P>5. Most Important Technical Terms:<P>(1) Matstsebhah ("pillar"):<P>matstsebhah: These were upright stone pillars, often mentioned in the Old Testament, sometimes as abodes (Bethels) or symbols of deity—especially as used by the heathen—but also as votive offerings, memorial and grave stones (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>; <a onClick="return mV(\'Gen\',31,45);">31:45</a>; <a onClick="return mV(\'Gen\',35,14,20);">35:14, 20</a>; <a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>; <a onClick="return mV(\'1Sa\',7,12);">1Sa 7:12</a>). The reverence for these stones is closely connected with that found among all Semitic peoples for obelisks (<a onClick="return mV(\'Gen\',33,20);">Ge 33:20</a>; <a onClick="return mV(\'Gen\',35,7);">35:7</a>), cairns (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>; <a onClick="return mV(\'Jos\',4,6);">Jos 4:6</a>), and circles (<a onClick="return mV(\'Jos\',4,3,5,20);">Jos 4:3, 5, 20</a>). Rough stone pillars from time immemorial were used in Semitic worship (Kittel, Hist of the Hebrews, II, 84). They were thought of primitively as dwelling-places of deity, and the stones and the spots where they stood were therefore accounted sacred. From very early times the mystery of life pressed itself upon human attention, and these stones were viewed as phallic images. These images were at first rough and undifferentiated, but became later well defined as male organs. At Tell Zakariyah the end of one is sculptured to represent a human face. Some sort of phallicism underlies all early Semitic religion, the form of which is determined by the attention paid to the date palm, to the breeding of flocks, to astrology, and to social life. This phallicism did not always represent coarse thought, but sometimes a very profound spiritual conception; compare <a href="study/isbe/search.html?string=GOLDEN+CALF">GOLDEN CALF</a>, and note Wiedemann\'s statement, in HDB, V, 180 that in Egypt the gods Hu, "Taste," and Sa, "Perception," were created from the blood of the sun-god\'s phallus. These images of fertility and reproduction were naturally connected in Canaan with the worship of the Baals or "lords" of each locality, upon whose favor as possessor of the land fertility depended. They were also naturally associated with the cult of Astarte, the female counterpart of all the Baals (see <a href="study/isbe/search.html?string=ASTARTE">ASTARTE</a>). In the Old Testament the Baalim and Asherim are almost invariably classed together, although the latter were wooden posts dedicated to a particular goddess, while "Baal" was merely a title which could be given to any male Semitic deity, and sometimes even to his female associate. The matstsebhoth were set up in a "high place" (which see), attracting reverence because of its "elevation, isolation and mystery" (Vincent). Originally these pillars were not considered as idols, but were naturally erected to Yahweh (<a onClick="return mV(\'Gen\',28,18);">Ge 28:18</a>; <a onClick="return mV(\'Gen\',31,45);">31:45</a>; <a onClick="return mV(\'Gen\',35,14);">35:14</a>; <a onClick="return mV(\'Exd\',24,4);">Ex 24:4</a>), and even Isaiah (<a onClick="return mV(\'Isa\',19,19);">19:19</a>) and Hosea (<a onClick="return mV(\'Hsa\',3,4);">3:4</a>) approve them, though pillars dedicated to idols must of course be destroyed (<a onClick="return mV(\'Exd\',23,24);">Ex 23:24</a>; <a onClick="return mV(\'Exd\',34,13);">34:13</a>; <a onClick="return mV(\'Jer\',43,13);">Jer 43:13</a>; <a onClick="return mV(\'Eze\',26,11);">Eze 26:11</a>). Only in late times or by very far-sighted law-givers were the matstsebhoth erected to Yahweh condemned; but after the centralization of the Yahweh-worship in Jerusalem, these pillars were condemned, even when set up in the name of Yahweh, and the older places of worship with their indiscriminate rituals and necessary heathen affiliations were also wisely discarded (<a onClick="return mV(\'Lev\',26,1);">Le 26:1</a>; <a onClick="return mV(\'Deu\',16,22);">De 16:22</a>; see also <a href="study/isbe/search.html?string=GOLDEN+CALF">GOLDEN CALF</a> <a onClick="return mV(\'Jer\',7,18);">Jer 7:18</a>; <a onClick="return mV(\'Jer\',44,17,19);">44:17, 19</a>; but see).<P>(2) \'Asherah ("grove"):<p>\'asherah: Perhaps a goddess (see <a href="study/isbe/search.html?string=ASHERAH">ASHERAH</a>), but as ordinarily used in the Old Testament, a sacred tree or stump of a tree planted in the earth (<a onClick="return mV(\'Deu\',16,21);">De 16:21</a>) or a pole made of wood and set up near the altar (<a onClick="return mV(\'Jdg\',6,26);">Jud 6:26</a>; <a onClick="return mV(\'1Ki\',16,33);">1Ki 16:33</a>; <a onClick="return mV(\'Isa\',17,8);">Isa 17:8</a>).<P>It has been supposed that these were primarily symbols of a goddess Asherah or Ashtoreth (Kuenen, Baethgen), and they were certainly in primitive thought connected with the tree cult and the sacred groves so universally honored by the Semites (see especially W.R. Smith, Religion of the Semites, 169, 437; Stade, Geschichte, 160ff; Fraser, Golden Bough, II, 56-117; John O\'Neill, Night of the Gods, II, 57); but the tree of life is closely connected in texts and pictures with the human organ of generation, and there can be no doubt that there is a phallic meaning connected with this sacred stake or pole, as with the matstsebhoth described above. See references in HDB under "Asherah," and compare Transactions of the Victoria Institute, XXXIX, 234; Winckler, Keilinschriftliches Textbuch zum AT. As these wooden posts from earliest times represented the ideas of fertility and were connected with the mystery of life, they naturally became the signs and symbols in many lands of the local gods and goddesses of fertility.<P>Astarte was by far the most popular deity of ancient Palestine. See <a href="study/isbe/search.html?string=ASHTORETH">ASHTORETH</a>. The figures of Astarte from the 12th to the 9th century BC, as found at Gezer, have large hips, disclosing an exaggerated idea of fecundity. In close connection with the Astarte sanctuaries in Palestine were found numberless bodies of little children, none over a week old, undoubtedly representing the sacrifice of the firstborn by these Canaanites (R.A.S. Macalister, Excavation of Gezer, 3 vols). These Asherim were erected at the most sacred Hebrew sanctuaries, at Samaria (<a onClick="return mV(\'2Ki\',13,6);">2Ki 13:6</a>), Bethel (<a onClick="return mV(\'2Ki\',23,15);">2Ki 23:15</a>), and even in the Temple of Jerusalem (<a onClick="return mV(\'2Ki\',23,6);">2Ki 23:6</a>). The crowning act of King Josiah\'s reformation was to break down these images (<a onClick="return mV(\'2Ki\',23,14);">2Ki 23:14</a>). As the astrological symbol of Baal was the sun, Astarte is often thought of as the moon-goddess, but her symbol was really Venus. She was, however, sometimes called "Queen of Heaven" (<a onClick="return mV(\'Jer\',7,18);">Jer 7:18</a>; <a onClick="return mV(\'Jer\',44,17,19);">44:17, 19</a>; but see Zeitschrift fur alttestamentliche Wissenschaft, VI, 123-30).<P>(3) Chamman ("sun-image"):<P>chamman, the King James Version "images," "idols"; the Revised Version (British and American) "sun-images" (<a onClick="return mV(\'Lev\',26,30);">Le 26:30</a>; <a onClick="return mV(\'2Ch\',14,5);">2Ch 14:5</a>; <a onClick="return mV(\'2Ch\',34,4,7);">34:4, 7</a>; <a onClick="return mV(\'Isa\',17,8);">Isa 17:8</a>; <a onClick="return mV(\'Isa\',27,9);">27:9</a>; <a onClick="return mV(\'Eze\',6,4,6);">Eze 6:4, 6</a>): This worship may originally have come from Babylonia, but the reverence of the sun under the name Baal-hamman had long been common in Palestine before Joshua and the Israelites entered the country. These sun-images were probably obelisks or pillars connected with the worship of some local Baal. The chariot and horses of the sun, mentioned (<a onClick="return mV(\'2Ki\',23,11);">2Ki 23:11</a>) as having an honored place at the western entrance of the Jerusalem Temple, represented not a local but a foreign cult. In Babylonian temples, sacrifices were made to the sun-chariot, which seems to have had a special significance in time of war (Pinches, HDB, IV, 629; see also <a href="study/isbe/search.html?string=CHARIOTS+OF+THE+SUN">CHARIOTS OF THE SUN</a>).<P>6. Obscure Bible References:<P>(1) Golden Calf and Jeroboam\'s Calves:<P>See <a href="study/isbe/search.html?string=GOLDEN+CALF">GOLDEN CALF</a>.<P>(2) Brazen Serpent:<P>Brazen Serpent (<a onClick="return mV(\'Num\',21,\'4-9\');">Nu 21:4-9</a>; <a onClick="return mV(\'2Ki\',4,\'1-\');">2Ki 4</a>).—The serpent, because of its strange, lightning-like power of poisonous attack, its power to shed its skin, and to paralyze its prey, has been the most universally revered of all creatures. Living serpents were kept in Babylonian temples. So the cobra was the guardian of royalty in Egypt, symbolizing the kingly power of life and death. In mythology, the serpent was not always considered a bad demon, enemy of the Creator, but often appears as the emblem of wisdom, especially in connection with health-giving and life-giving gods, such as Ea, savior of mankind from the flood, and special "god of the physicians" in Babylon; Thoth, the god of wisdom in Egypt, who healed the eye of Horus and brought Osiris to life again; Apollo, the embodiment of physical perfection, and his son, Aeseulapius, most famous giver of physical and moral health and curer of disease among the Greeks. Among the Hebrews also a seal (1500-1000 BC) shows a worshipper before a horned serpent raised on a pole (Wm. Hayes Ward). In Phoenician mythology the serpent is also connected with wisdom and long life, and it is found on the oldest Hebrew seals and on late Jewish talismans (Revue biblique internationale, July,1908,382-94); at Gezer, in Palestine, a small "brazen serpent" (a cobra) was found in the "cave of oracles," and in early Christian art Jesus the Lord of Life is often represented standing triumphantly upon the serpent or holding it in His fist. In the Hebrew narrative found in <a onClick="return mV(\'Num\',21,\'1-\');">Nu 21</a>, the serpent evidently appears as a well-known symbol representing the Divine ability to cure disease, being erected before the eyes of the Israelites to encourage faith and stop the plague. It was not a totem, for the totem belongs to a single family and is never set up for the veneration of other families (Ramsay, Cities of Paul, 39). Hezekiah destroyed it because it was receiving idolatrous worship (<a onClick="return mV(\'2Ki\',18,4);">2Ki 18:4</a>), though there is no hint that such worship was ever a part of the official temple cult (Benzinger); for if this had been done, the earlier prophets could hardly have remained silent. The above explanation seems preferable to the one formerly offered that the serpent was merely a copy of the disease-bearer, as the images offered by the Philistines were copies of the ulcers that plagued them (<a onClick="return mV(\'1Sa\',6,4);">1Sa 6:4</a>).<P>See further <a href="study/isbe/search.html?string=NEHUSHTAN">NEHUSHTAN</A>.<P>(3) Teraphim:<P>Teraphim (teraphim).—These are usually considered household gods, but this does not necessarily include the idea that they were images of ancestors, though this is not improbable (Nowack, Hebrew Archaeology, II, 23; HDB, II, 190); that they were images of Yahweh is a baseless supposition (see Kautzsch, HDB, V, 643). Sometimes they appear in the house (<a onClick="return mV(\'1Sa\',19,13,16);">1Sa 19:13, 16</a>); sometimes in sanctuaries (<a onClick="return mV(\'Jdg\',17,5);">Jud 17:5</a>; <a onClick="return mV(\'Jdg\',18,14);">18:14</a>); sometimes as carried by travelers and armies (<a onClick="return mV(\'Gen\',31,30);">Ge 31:30</a>; <a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>). They are never directly spoken of as objects of worship (yet compare <a onClick="return mV(\'Gen\',31,30);">Ge 31:30</a>), but are mentioned in connection with wizardry (<a onClick="return mV(\'2Ki\',23,24);">2Ki 23:24</a>), and as a means of divination (<a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>; <a onClick="return mV(\'Zec\',10,2);">Zec 10:2</a>), perhaps not necessarily inconsistent with Yahweh-worship (<a onClick="return mV(\'Hsa\',3,4);">Ho 3:4</a>). They were sometimes small and could be easily hidden (<a onClick="return mV(\'Gen\',31,34);">Ge 31:34</a>); at other times larger and in some way resembling a human being (<a onClick="return mV(\'1Sa\',19,13);">1Sa 19:13</a>). Jewish commentators thought the teraphim were in early times mummified human heads which were represented in later centuries by rude images (Moore, Crit. and Exeg. Commentary on Jgs, 1895, 382; see especially Chwolsohn, Die Ssabier u. der Ssabismus, II, 19, 150). Customs of divination by means of such heads were not unknown. In Israel the teraphim were sometimes certainly used in consulting Yahweh (<a onClick="return mV(\'Jdg\',17,5);">Jud 17:5</a>; <a onClick="return mV(\'Jdg\',18,14);">18:14</a>), though their use was later officially condemned (<a onClick="return mV(\'2Ki\',23,24);">2Ki 23:24</a>). The teraphim in the home doubtless correspond in use to the <a href="study/isbe/search.html?string=EPHOD">EPHOD</a> (which see) in the sanctuary, and therefore these are frequently connected. Certain small rude images have lately been uncovered in Palestine by Bliss, at Tell el-Hesy, and by Sellin, at Tell Ta\'annuk, which are supposed to be teraphim.<P>(4) Image of Jealousy:<P>Image of jealousy (cemel).—It is not certain what this statue was which was set up by the door of the inner gate of the Jerusalem temple (<a onClick="return mV(\'Eze\',8,3);">Eze 8:3</a>). It was no doubt some idol, perhaps the image of the Asherah (<a onClick="return mV(\'2Ki\',21,7);">2Ki 21:7</a>; <a onClick="return mV(\'2Ki\',23,6);">23:6</a>), which certainly had previously been set up in the temple and may have been there again in this day of apostasy. "Jealousy" is not the name of the idol, but it was probably called "image of jealousy" because in a peculiar manner this particular image seems to have been drawing the people from the worship of Yahweh and therefore provoking Him to jealousy.<P>(5) Chambers of Imagery:<P>Chambers of imagery (chadhre maskitho).—Does Ezekiel mean that in his heart every man in his chambers of imagery was an idol-worshipper, or does this refer to actual wall decorations in the Jerusalem Temple (<a onClick="return mV(\'Eze\',8,11,12);">Eze 8:11-12</a>)? Most expositors take it literally. W.R. Smith has been followed almost if not quite universally in his supposition that a debased form of vermin-worship is described in the "creeping things and abominable beasts" (<a onClick="return mV(\'Eze\',8,10);">Eze 8:10</a>). But while this low and ignorant worship was an ancient cult, it had been banished for centuries from respectable heathen worship, and it seems inconceivable that these Israelites who were of the highest class could have fallen to these depths, or if they had done so that the Tammuz and sun-worship should have been considered so much worse (<a onClick="return mV(\'Eze\',8,13,14);">Eze 8:13-14</a>). To the writer it seems more probable that the references are to Egyptian or Greek mysteries which would be described by a Hebrew just as Ezekiel describes this secret chamber. It is now known that the Greek mysteries experienced a revival at exactly this era, and it was probably this revival which was making itself felt in Jerusalem, for Greek influence was at this time greatly affecting Palestine (see Duruy, Hist of Greece, II, 126-80, 374; Cobern, Commentary on Ezekiel and Daniel, 80-83, 280-82; and separate articles, <a href="study/isbe/search.html?string=CHAMBERS+OF+IMAGERY">CHAMBERS OF IMAGERY</a>; <a href="study/isbe/search.html?string=IMAGERY">IMAGERY</a>).<P>(6) Ephod:<P>Ephod (\'ephodh).—There is no doubt that this was the name of a vestment or ritual loin cloth of linen worn by common priests and temple servants and on special occasions by the king (<a onClick="return mV(\'1Sa\',2,18);">1Sa 2:18</a>; <a onClick="return mV(\'1Sa\',22,18);">22:18</a>; <a onClick="return mV(\'2Sa\',6,14);">2Sa 6:14</a>). The ephod of the high priest was an ornamental waist coat on the front of which was fastened the holy breastplate containing the pocket in which were the Urim and Thummim (<a onClick="return mV(\'Exd\',28,6,30);">Ex 28:6, 30</a>; <a onClick="return mV(\'Exd\',29,5);">29:5</a>; <a onClick="return mV(\'Exd\',39,\'2-5\');">39:2-5</a>; <a onClick="return mV(\'Lev\',8,28);">Le 8:28</a>).<P>There are several passages, however, which have convinced many scholars that another ephod is mentioned which must be an image of Yahweh (see <a href="study/isbe/search.html?string=EPHOD">EPHOD</a>). The chief passages relied upon are <a onClick="return mV(\'Jdg\',8,26,27);">Jud 8:26-27</a>, where Gideon made an ephod with 1,700 shekels of gold and "set" this in Ophrah, where it became an object of worship. So in <a onClick="return mV(\'Jdg\',17,4);">Jud 17:4</a>; <a onClick="return mV(\'Jdg\',18,\'14-20\');">18:14-20</a>, <a onClick="return mV(\'1Sa\',23,6,9);">1Sa 23:6, 9</a>; <a onClick="return mV(\'1Sa\',30,7);">30:7</a>, etc. Micah provides an ephod as well as an image and pillar for his sanctuary; in <a onClick="return mV(\'1Sa\',21,9);">1Sa 21:9</a> the sword of Goliath is preserved behind the ephod; while in various places the will of Yahweh is ascertained, not by putting on the ephod, but by "bringing it near" and "bearing" and "carrying" it (<a onClick="return mV(\'1Sa\',23,6,9);">1Sa 23:6, 9</a>; <a onClick="return mV(\'1Sa\',30,7);">30:7</a>, etc.). On the basis of these passages Kautzsch (HDB, V, 641) concludes most inconsistently that the ephod appears "exclusively as an image of Yahweh." Driver, after an examination of each text, concludes that just in one passage (<a onClick="return mV(\'Jdg\',8,27);">Jud 8:27</a>) the term "ephod" is certainly used of the gold casing of an image, and that therefore it may also have this meaning in other passages (HDB, I, 725). It does not seem quite certain, however, that a ceremonial vestment heavily ornamented with gold might not have been "set" or "erected" in a holy place where later it might become an object of worship. If this had been an idolatrous image, would Hosea have deplored its loss (<a onClick="return mV(\'Hsa\',3,4);">Ho 3:4</a>), and would its use not have been forbidden in some Bible passage?<P>Kautzsch\'s view that the ephod meant primarily the garment used to clothe Divine image, which afterward gave its name to the image itself, is a guess unsustained by the Scriptures quoted or, I think, by any archaeological parallel. We conclude that there is no certain proof that this was an image of Yahweh, though was used ritualistically in receiving the oracles of Yahweh (compare Kuenen, Religion of Israel, I, 100; Kittel, Hist of the Hebrews, II, 42; Konig, Die Hauptprobleme, 59-63).<P>LITERATURE.<P>See especially W.R. Smith, Religion of the Semites; E. B. Tylor, Primitive Culture; J. G. Frazer, Golden Bough (3 vols); Baethgen, Beitrage zur sem. Rel.-Gesch.; Kittel, Hist of the Hebrews; Nowack, Hebrew Arch., II; Baudissin, Studien z. sem. Rel.-Gesch. For recent excavations, L.P.H. Vincent, Canaan d\'apres l\'expl. recente, 1907; R.A.S. Macalister, The Excavation of Gezer (1912); William Hayes Ward, Cylinders and Other Ancient Oriental Seals, 1909.`<a href="./study/isbe/search.html?string=IDOLATRY">IDOLATRY</a>; <a href="./study/isbe/search.html?string=CALF,+GOLDEN">CALF, GOLDEN</a>`26';
isbe[4556]='Imagination`i-maj-i-na\'-shun (yetser, sheriruth; dianoia): "Imagination" is the translation of yetser, properly "a shaping," hence, "a thought" (<a onClick="return mV(\'Gen\',6,5);">Ge 6:5</a>; <a onClick="return mV(\'Gen\',8,21);">8:21</a>; <a onClick="return mV(\'Deu\',31,21);">De 31:21</a>; <a onClick="return mV(\'1Ch\',28,9);">1Ch 28:9</a>; <a onClick="return mV(\'1Ch\',29,18);">29:18</a>). In <a onClick="return mV(\'Isa\',26,3);">Isa 26:3</a> yetser is translated "mind" (King James Version margin "thought" or "imagination"), "whose mind is stayed on thee" (the Revised Version margin "or imagination"); in <a onClick="return mV(\'Psa\',103,14);">Ps 103:14</a> it is "frame"; of sheriruth, "obstinacy," "stubbornness" (<a onClick="return mV(\'Deu\',29,19);">De 29:19</a>; <a onClick="return mV(\'Jer\',3,17);">Jer 3:17</a>; <a onClick="return mV(\'Jer\',7,24);">7:24</a>; <a onClick="return mV(\'Jer\',9,14);">9:14</a>; <a onClick="return mV(\'Jer\',11,8);">11:8</a>; <a onClick="return mV(\'Jer\',13,10);">13:10</a>; <a onClick="return mV(\'Jer\',16,12);">16:12</a>; <a onClick="return mV(\'Jer\',18,12);">18:12</a>; <a onClick="return mV(\'Jer\',23,17);">23:17</a>); in <a onClick="return mV(\'Psa\',81,12);">Ps 81:12</a> the King James Version it is, "lust," margin "hardness or imaginations"; 3 times of machashebheth, "thought" or "purpose" in the King James Version (<a onClick="return mV(\'Pro\',6,18);">Pr 6:18</a>; <a onClick="return mV(\'Lam\',3,60,61);">La 3:60-61</a>); once of dianoia, "mind," "understanding" (<a onClick="return mV(\'Luk\',1,51);">Lu 1:51</a>); of logismos, "reasoning" (<a onClick="return mV(\'2Cr\',10,5);">2Co 10:5</a>); and of dialogismos, "reasoning through" (<a onClick="return mV(\'Rom\',1,21);">Ro 1:21</a> the King James Version).<P>The Revised Version (British and American) gives "stubbornness" in each instance where sheriruth is in the King James Version translated "imagination"; in <a onClick="return mV(\'Pro\',6,18);">Pr 6:18</a> the American Standard Revised Version has "purposes"; the Revised Version (British and American) has "devices" (<a onClick="return mV(\'Lam\',3,60,61);">La 3:60-61</a>) and "reasonings" (<a onClick="return mV(\'Rom\',1,21);">Ro 1:21</a>), "imagination" for "conceit" (<a onClick="return mV(\'Pro\',18,11);">Pr 18:11</a>), and (English Revised Version) for "device" (<a onClick="return mV(\'Lam\',3,62);">La 3:62</a>).<P>"Imagination" is frequent in Apocrypha, e.g. <span class="noTag">Ecclesiasticus 22:18 (dianoema); 37:3 (enthumema, "wicked imagination"); 40:2</span> (dialogismos, the Revised Version (British and American) "expectation").``185';
isbe[4557]='Imagine`i-maj\'-in (chashabh; meletao): The word most frequently translated "to imagine" in the Old Testament, only in the King James Version and the English Revised Version, not in the American Standard Revised Version, is chashabh, "to bind," "combine," "think" (<a onClick="return mV(\'Job\',6,26);">Job 6:26</a>; <a onClick="return mV(\'Psa\',10,2);">Ps 10:2</a>; <a onClick="return mV(\'Psa\',21,11);">21:11</a>; <a onClick="return mV(\'Psa\',140,2);">140:2</a>; <a onClick="return mV(\'Hsa\',7,15);">Ho 7:15</a>; <a onClick="return mV(\'Nah\',1,9,11);">Na 1:9, 11</a>; <a onClick="return mV(\'Zec\',7,10);">Zec 7:10</a>; <a onClick="return mV(\'Zec\',8,17);">8:17</a>); we have also haghah in the King James Version and the English Revised Version, but not in the American Standard Revised Version, "to meditate," "mutter," "speak" (<a onClick="return mV(\'Psa\',2,1);">Ps 2:1</a>; <a onClick="return mV(\'Psa\',38,12);">38:12</a>); zamam, "to devise" (<a onClick="return mV(\'Gen\',11,6);">Ge 11:6</a> the King James Version); charash, "to grave," "devise" (<a onClick="return mV(\'Pro\',12,20);">Pr 12:20</a> the King James Version); hathath, "to break in upon," to "attack unjustly" (<a onClick="return mV(\'Psa\',62,3);">Ps 62:3</a> the King James Version); meletao, "to meditate" (<a onClick="return mV(\'Act\',4,25);">Ac 4:25</a>).``185';
isbe[4558]='Imalcue`i-mal-ku\'-e (Imalkoue; the King James Version Simalcue): An Arabian prince to whom Alexander Balas entrusted the upbringing of his young son Antiochus. Tryphon, who had formerly been on the side of Alexander, persuaded Imalcue to set up the young Antiochus (Antiochus VI) against Demetrius, who had incurred the enmity of his men of war (1Macc 11:39,40). Antiochus confirmed Jonathan in the high-priesthood and appointed him to be one of the king\'s friends (<span class="noTag">11:57</span>). In Josephus (Ant., XIII, v, 1) the name is given as Malchus.``79';
isbe[4559]='Imla; Imlah`im\'-la (yimlah, "fullness"?): Father of the prophet Micaiah (<a onClick="return mV(\'1Ki\',22,8,9);">1Ki 22:8-9</a>; <a onClick="return mV(\'2Ch\',18,7,8);">2Ch 18:7-8</a>).``1';
isbe[4560]='Immaculate Conception, the`i-mak\'-u-lat kon-sep\'-shun:<P>1. Definition:<P>The historic designation of the Roman Catholic dogma promulgated by Pope Pius IX on December 8,1854, in the Papal Bull entitled "Ineffabilis Deus." The term is often incorrectly applied, even by those whose intelligence should make such an error impossible, to the <a href="study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a> of Christ (which see).<P>2. Statement of the Dogma:<P>The central affirmation of this proclamation, which was read in Peter\'s in the presence of over two hundred bishops, is expressed in the following words: It is proclaimed "by the authority of our Lord Jesus Christ and the blessed Apostles Peter and Paul and in our own authority, that the doctrine which holds the blessed Virgin Mary to have been, from the first instant of her conception, by a singular grace and privilege of Almighty God, in view of the merits of Christ Jesus the Saviour of Mankind, preserved free from all stain of original sin, was revealed by God, and is, therefore, to be firmly and constantly believed by all the faithful" (see Schaff, A History of the Creeds of Christendom, II, 211, 212).<P>3. Objections to the Dogma:<P>(1) Drawn from Specifically Protestant Principles.<P>Objections to the dogma are mainly two:<P>(a) the claim to authority upon which the proclamation rests. There is every reason to believe that one of the major motives to the entire transaction was the wish, on the part of Pius and his advisers, to make an unmistakable assertion of absolute doctrinal authority by the Roman pontiff. To Protestants of all shades of opinion there would be unbearable offense in the wording of the decree, even if assent could be given to the doctrine itself. The whole vital issue of the Reformation is involved in the use by an ecclesiastic of the words "in our own authority" in addition to the words "by the authority of our Lord Jesus Christ and the blessed Apostles Peter and Paul."<P>(b) The tendency to Mariolatry in the entire movement. As we shall see, the ascription of Divine honors to Mary is avoided in the public statement of the dogma and in the defense of it by Roman Catholic writers, but one has but to survey the course of discussion leading up to the publication of 1854, and subsequent to it, to discover a growing tendency to lift Mary out of the realm of human beings and to endow her with Divine attributes and functions. An extended discussion of Mariolatry lies beyond the range of this article (see <a href="study/isbe/search.html?string=MARY">MARY</A>); it is only necessary to point out the obvious connections (see Roman Catholic Dictionary and church histories, sub loc.).<P>(2) Drawn from Roman Catholic Principles.<P>It is far from the truth to suppose that there are no objections to this modern dogma save those which are specifically Protestant. From the viewpoint of the devout Roman Catholic, and for the sake of the prestige of the papacy, this particular dogma seems to have been unfortunately chosen.<P>(a) It Has No Basis in Scripture.<P>The only attempt made to provide a Scriptural argument is by using a vague and unsatisfactory parallel between Mary and Eve before the Fall, to be found in the writings of certain church Fathers who did not hold the papal dogma but unconsciously provided a slender and most insecure basis for it (see infra). Most Roman Catholic writers are intelligent enough to admit that theory of inspired tradition alone can be appealed to in support of the idea. The ordinary and only tenable argument is that the ecclesiastical promulgation and acceptance of the doctrine prove its apostolic origin (see Catholic Dictionary, sub loc.).<P>(b) It Weakens the Authority of the Church.<P>It would almost seem as if the doctrines of ecclesiastical authority and particularly of papal infallibility had, in this unfortunate proclamation, reached a reductio ad obsurdum for the comfort of their foes. Notice with care the historical standing of this dogma:<P>(i) The acknowledged absence of all positive evidence for apostolic origin and primitive authority (see Catholic Dictionary ut supra).<P>(ii) The abundant positive evidence that the principal Fathers of the early church did not believe in the sinlessness of Mary (see list of names and references given by H.C. Sheldon, History of the Christian Church, sub loc.).<P>(iii) The uncertain and equivocal testimony per contra drawn from the early Fathers. They are practically confined to the following: Ephrem Syrus (Carmina, Hymn 27, strophe 8), where he says "Truly it is Thou and Thy mother only who are fair altogether. For in Thee there is no stain and in Thy mother no spot"; Augustine (De Natura et Gratia, cap. 26), "Two were made simple, innocent, perfectly like each other, Mary and Eve," etc. To these may be added the words of Irenaeus: "The knot of Eve\'s disobedience was untied by Mary\'s obedience" (Catholic Dictionary, 422). In regard to these three passages it may reasonably be contended that even if these statements necessarily implied the Immaculate Conception of Mary, which they certainly do not, they would still have to be estimated against the many weighty statements which may be brought forward on the other side.<P>(iv) The prolonged controversy over the doctrine. From the earliest time when the idea of Mary\'s miraculous freedom from sin appears, up to the Old Catholic agreement of 1874, devout and faithful Roman Catholics have protested against the addition of this unscriptural dogma to the faith of the church. Bonaventura (Locus Theol., VII, 1) says: "All the saints who have made mention of this matter, with one mouth have asserted that the blessed Virgin was conceived in original sin." With the statement of the Old Catholic agreement we may safely sum up the ecclesiastical situation, even from the viewpoint of those who hold to the doctrinal validity of tradition. Art. X reads: "We reject the New Roman doctrine of the Immaculate Conception of the Blessed Virgin Mary, as being contrary to the tradition of the first 13 centuries, according to which Christ alone is conceived without sin."<P>(3) Drawn from General Considerations of Christian Doctrine.<P>The most serious objections to this offensive and gratuitous dogma are not at all specifically Protestant but, rather, broadly Christian. It is necessary at this point to assure ourselves that we understand (as many Protestants evidently do not) just what is meant by the doctrine as a doctrine. According to the accepted Roman Catholic explanation, Mary, at the supposed stage of her conception when the soul was actually infused into the body waiting for it, received the special grace of God whereby she was delivered from all stain of original sin. The point which Protestants need especially to note is that, according to Roman Catholic ideas, this gracious act of God was performed on the basis of the foreseen merits of Christ\'s sacrifice. This tones down the offensiveness of the doctrine in that it does not per se imply the equality of Mary with Christ, but rather the contrary, in so far as the grace bestowed upon her was gained by anticipation from Him. Roman Catholic writers naturally emphasize this fact in recommending the doctrine to Protestant minds. None the less the offense remains. The "Immaculate Conception" necessarily implies the "immaculate life," and on the same basis of supernatural grace, else would the special miracle have occurred in vain and the fall of Adam been repeated in Mary. Hence, a full account of the doctrine would be that Mary was completely and miraculously redeemed at her conception and completely and miraculously kept from sin throughout her whole life. Apart from all questions as to the rightful place of Mary in Christian thought, this idea involves utter doctrinal confusion. It means that Mary never became a true human being and never lived a true human life. Redemption by a miraculous process begun at conception and carried on throughout the life is an utter impossibility, for the Holy Spirit does not work impersonally, and miraculous holiness which is holiness of a purely Divine character, without a free, cooperating human factor, is no human holiness at all. This dogma reads Mary out of the human family, reduces her to an image and makes her life a phantasm. Moreover, the parallels which are adduced in its support are not true parallels at all.<P>Our Lord\'s sinlessness was not mechanically guaranteed by His miraculous conception (see <a href="study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</A>) but was His own achievement through the Holy Spirit granted to Him and personally appropriated. The Hallowing of Children at the Font (see Catholic Dictionary, 470a), the sanctifying of those "separated from the womb" (<a onClick="return mV(\'Gal\',1,15);">Ga 1:15</a>) to God\'s service, does not imply the miraculous guarantee of artificial sinlessness, but such a gracious influence as enables the subject freely cooperating to obtain victory over sin as a controlling principle. Actual sin and need of forgiveness is not pretermitted by such special grace.<P>We can only say, in conclusion, that every reason, which usually operates in a Christian mind to insure rejection of a false teaching, ought to preclude the possibility of accepting this peculiar dogma which is Scripturally baseless, historically unjustified and doctrinally unsound.<P>LITERATURE.<P>The best simple and reasonably fair-minded discussion of this dogma from the Roman Catholic viewpoint is to be found in the Catholic Dictionary already mentioned, where wide references will be found. For the Protestant view consult any authoritative church history, especially that of Professor H.C. Sheldon where copious references to Patristic literature will be found.``169';
isbe[4561]='Immanuel`i-man\'-u-el (\'immanu\'el): The name occurs but 3 times, twice in the Old Testament (<a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a>; <a onClick="return mV(\'Isa\',8,8);">8:8</a>), and once in the New Testament (<a onClick="return mV(\'Mat\',1,23);">Mt 1:23</a>). It is a Hebrew word signifying "God is with us." The form "Emmanuel" appears in Septuagint (Emmanouel).<P>1. Isaiah Rebukes Ahaz:<P>In 735 BC Ahaz was king of Judah. The kingdom of Israel was already tributary to Assyria (<a onClick="return mV(\'2Ki\',15,19,20);">2Ki 15:19-20</a>). Pekah, king of Israel, a bold and ambitious usurper, and Rezin, king of Syria, formed an alliance, the dual object of which was, first, to organize a resistance against Assyria, and second, to force Ahaz to cooperate in their designs against the common tyrant. In the event of Ahaz\' refusal, they planned to depose him, and to set the son of Tabeel, a choice of their own, upon the throne of David. To this end they waged war against Judah, advancing as far as Jerusalem itself, but without complete success (<a onClick="return mV(\'Isa\',7,1);">Isa 7:1</a>). Ahaz, a weak king, and now panic-stricken, determined to invoke the aid of Tiglath-pileser, king of Assyria (<a onClick="return mV(\'2Ki\',16,7);">2Ki 16:7</a>). This he actually did at a later stage in the war (<a onClick="return mV(\'2Ki\',6,9);">2Ki 6:9</a>; <a onClick="return mV(\'2Ki\',15,29);">15:29</a>). Such a course would involve the loss of national independence and the payment of a heavy tribute. At this period of crisis, Isaiah, gathering his disciples around him (<a onClick="return mV(\'Isa\',8,16);">Isa 8:16</a>), is told to deliver a message to the king. Ahaz, though making a show of resistance against the coalition, is in reality neither depending upon the help of Yahweh nor upon the courage of his people. Isaiah, in an effort to calm his fears and prevent the fatal alliance with Assyria, offers him a sign. This method is specially characteristic of this prophet. Fearing to commit himself to the policy of Divine dependence, but with a pretense at religious scruples, "Neither will I tempt Yahweh," the king refuses (<a onClick="return mV(\'Isa\',7,12);">Isa 7:12</a>). The prophet then chides him bitterly for his lack of faith, which, he says, not only wearies men, but God also (<a onClick="return mV(\'Isa\',7,13);">Isa 7:13</a>).<P>2. The Sign of "Immanuel":<P>He then proceeds to give him a sign from God Himself, the sign of "Immanuel" (<a onClick="return mV(\'Isa\',7,14);">Isa 7:14</a>). The interpretation of this sign is not clear, even apart from its New Testament application to Christ. The Hebrew word translated "virgin" in English Versions of the Bible means, more correctly, "bride," in the Old English sense of one who is about to become a wife, or is still a young wife. <a onClick="return mV(\'Psa\',68,25);">Ps 68:25</a> English Versions of the Bible gives "damsels."<P>Isaiah predicts that a young bride shall conceive and bear a son. The miracle of virgin-conception, therefore, is not implied. The use of the definite article before "virgin" (ha-\'almah) does not of itself indicate that the prophet had any particular young woman in his mind, as the Hebrew idiom often uses the definite article indefinitely. The fact that two other children of the prophet, like Hosea\'s, bore prophetic and mysterious names, invites the conjecture that the bride referred to was his own wife. The hypothesis of some critics that a woman of the harem of Ahaz became the mother of Hezekiah, and that he was the Immanuel of the prophet\'s thought is not feasible. Hezekiah was at least 9 years of age when the prophecy was given (<a onClick="return mV(\'2Ki\',16,2);">2Ki 16:2</a>).<P>Immanuel, in the prophetic economy, evidently stands on the same level with Shear-jashub (<a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>) as the embodiment of a great idea, to which Isaiah again appeals in <a onClick="return mV(\'Isa\',8,8);">Isa 8:8</a> (see <a href="study/isbe/search.html?string=ISAIAH,+1-7">ISAIAH, VII</a>).<P>3. Was It a Promise or a Threat?:<P>The question as to whether the sign given to Ahaz was favorable or not presents many difficulties. Was it a promise of good or a threat of judgment? It is evident that the prophet had first intended an omen of deliverance and blessing (<a onClick="return mV(\'Isa\',7,4,7);">Isa 7:4, 7</a>). Did the king\'s lack of faith alter the nature of the sign? <a onClick="return mV(\'Isa\',7,9);">Isa 7:9</a>, "If ye will not believe," etc., implies that it might have done so. The omission of <a onClick="return mV(\'Isa\',7,16);">7:16</A>, and especially the words "whose two kings thou abhorrest," greatly simplifies this theory, as "the land," singular, would more naturally refer to Judah than to Syria and Ephraim collectively. The omen would then become an easily interpreted threat, referring to the overthrow of Judah rather than that of her enemies. Immanuel should eat curdled milk and honey (<a onClick="return mV(\'Isa\',7,15);">7:15</a>), devastation reducing the land from an agricultural to a pastoral one. The obscure nature of the passage as it stands suggests strongly that it has suffered from interpolation. The contrary theory that the sign was a promise and not a prediction of disaster, has much to commend it, though it necessitates greater freedom with the text. The name "Immanuel" implies the faith of the young mother of the child in the early deliverance of her country, and a rebuke to the lack of that quality in Ahaz. It is certain also that Isaiah looked for the destruction of Syria and Ephraim, and that, subsequent to the Assyrian invasion, salvation should come to Judah through the remnant that had been faithful (<a onClick="return mV(\'Isa\',11,11);">11:11</A>). The fact that the prophet later gave the name of Maher-shalal-hash-baz to his new-born son, a name of good omen to his country, further strengthens this position. The omission of <a onClick="return mV(\'Isa\',7,15,17);">7:15,17</a> would make the sign a prophecy of the failure of the coalition. It is plain, whichever theory be accepted, that something must be eliminated from the passage to insure a consistent reading.<P>4. Its Relation to the Messianic Hope:<P>The question now presents itself as to what was the relation of Immanuel to the Messianic prophecies. Should the emphasis be laid upon "a virgin," the son, or the name itself? For traditional interpretation the sign lay in the virgin birth, but the uncertainty of implied virginity in the Hebrew noun makes this interpretation improbable. The identification of the young mother as Zion personified, and of the "son" as the future generation, is suggested by Whitehouse and other scholars. But there is no evidence that the term \'almah was used at that time for personification. The third alternative makes Immanuel a Messiah in the wider use of the term, as anticipated by Isaiah and his contemporaries. There can be little doubt but that there existed in Judah the Messianic hope of a national saviour (<a onClick="return mV(\'2Sa\',7,12);">2Sa 7:12</a>). Isaiah is expecting the arrival of one whose character and work shall entitle him to the great names of <a onClick="return mV(\'Isa\',9,6);">9:6</A>. In him should dwell all the fullness of God. He was to be "of the stem of Jesse," the bringer of the Golden Age. The house of David is now beset by enemies, and its reigning representative is weak in faith. The prophet therefore announces the immediate coming of the deliverer. If he had intended the virgin-conception of Christ in the distant future, the sign of "Immanuel" would have possessed no immediate significance, nor would it have been an omen to Ahaz. With regard to the Messianic idea, <a onClick="return mV(\'Mic\',5,3);">Mic 5:3</a> ("until the time that she who travaileth hath brought forth") is of importance as indicating the prevalent thought of the time. Recent evidence shows that even in Babylonia and Egypt there existed expectations of a divinely born and wonderful saviour. To this popular tradition the prophet probably appealed, his hearers being easily able to appreciate the force of oracular language that is to us obscure. There is much to confirm the view, therefore, that the prophecy is Messianic.<P>5. The Virgin Birth:<P>The use of the word as it relates to the virgin birth of Christ and the incarnation cannot be dealt with here (see <a href="study/isbe/search.html?string=PERSON+OF+CHRIST,+1-3">PERSON OF CHRIST</A>). These facts, however, may be noted. The Septuagint (which has parthenos, "virgin") and the Alexandrian Jews interpreted the passage as referring to the virgin birth and the Messianic ministry. This interpretation does not seem to have been sufficiently prominent to explain the rise of the idea of miraculous virgin conception and the large place it has occupied in Christological thought.`<a href="./study/isbe/search.html?string=VIRGIN+BIRTH">VIRGIN BIRTH</a>`52';
isbe[4562]='Immer`im\'-er (\'immer):<P>(1) A priest of David\'s time (<a onClick="return mV(\'1Ch\',24,14);">1Ch 24:14</a>), whose descendants are mentioned in <a onClick="return mV(\'Ezr\',2,37);">Ezr 2:37</a>; <a onClick="return mV(\'Ezr\',10,20);">10:20</a>; <a onClick="return mV(\'Neh\',3,29);">Ne 3:29</a>; <a onClick="return mV(\'Neh\',7,40);">7:40</a>; <a onClick="return mV(\'Neh\',11,13);">11:13</a>.<P>(2) A priest of Jeremiah\'s time (<a onClick="return mV(\'Jer\',20,1);">Jer 20:1</a>).<P>(3) A place in Babylonia (<a onClick="return mV(\'Ezr\',2,59);">Ezr 2:59</a>; <a onClick="return mV(\'Neh\',7,61);">Ne 7:61</a>).``1';
isbe[4563]='Immortal; Immortality`i-mor\'-tal, im-or-tal\'-i-ti (athanasia, <a onClick="return mV(\'1Cr\',15,53);">1Co 15:53</a>; <a onClick="return mV(\'1Ti\',6,16);">1Ti 6:16</a>, aphtharsia, literally, "incorruption," <a onClick="return mV(\'Rom\',2,7);">Ro 2:7</a>; <a onClick="return mV(\'1Cr\',15,\'1-\');">1Co 15</a>; <a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>, aphthartos, literally, "incorruptible," <a onClick="return mV(\'Rom\',1,23);">Ro 1:23</a>; <a onClick="return mV(\'1Cr\',15,52);">1Co 15:52</a>; <a onClick="return mV(\'1Ti\',1,17);">1Ti 1:17</a>):<P><b>1. Preliminary—Need of Definition and Distinction</b><P><b>2. Biblical Conception</b><P><b>I. THE NATURAL BELIEF</b><P class="in15">1. Its Origin<P class="in15">2. Philosophical Arguments<P class="in45">(1) The Soul Spiritual<p class="in60">Soul not Inherently Indestructible<P class="in45">(2) Capacities of Human Nature<P class="in45">(3) The Moral Argument<P><b>II. THE BIBLICAL DOCTRINE—THE OLD TESTAMENT</b><P class="in15">1. Starting-Point—Man\'s Relation to God<P class="in30">Man\'s Nature<P class="in15">2. Sin and Death<P class="in15">3. Grace and Redemption—The True Immortality<P class="in30">Deliverance from Sheol<P class="in15">4. Later Jewish Thought<P><b>III. THE CHRISTIAN HOPE</b><P class="in15">1. Immortality through Christ<P class="in30">(1) Survival of the Soul<P class="in30">(2) Union with Christ in Unseen World<P class="in30">(3) The Resurrection<P class="in30">(4) The Wicked Also Raised<P class="in30">(5) Eternal Life<P class="in15">2. Contrasts<P><b>LITERATURE</b><hr /><P>1. Preliminary—Need of Definition and Distinction:<P>In hardly any subject is it more necessary to be careful in the definition of terms and clear distinction of ideas, especially where the Biblical doctrine is concerned, than in this of "immortality." By "immortality" is frequently meant simply the survival of the soul, or spiritual part of man, after bodily death. It is the assertion of the fact that death does not end all. The soul survives. This is commonly what is meant when we speak of "a future life," "a future state," "a hereafter." Not, however, to dwell on the fact that many peoples have no clear conception of an immaterial "soul" in the modern sense (the Egyptians, e.g. distinguished several parts, the Ka, the Ba, etc., which survived death; often the surviving self is simply a ghostly resemblance of the earthly self, nourished with food, offerings, etc.), there is the more serious consideration that the state into which the surviving part is supposed to enter at death is anything but a state which can be described as "life," or worthy to be dignified with the name "immortality." It is state peculiar to "death" (see <a href="study/isbe/search.html?string=DEATH">DEATH</a>); in most cases, shadowy, inert, feeble, dependent, joyless; a state to be dreaded and shrunk from, not one to be hoped for. If, on the other hand, as in the hope of immortality among the nobler heathen, it is conceived of, as for some, a state of happiness—the clog of the body being shaken off—this yields the idea, which has passed into so much of our modern thinking, of an "immortality of the soul," of an imperishableness of the spiritual part, sometimes supposed to extend backward as well as forward; an inherent indestructibility.<P>2. Biblical Conception:<P>It will be seen as we advance, that the Biblical view is different from all of these. The soul, indeed, survives the body; but this disembodied state is never viewed as one of complete "life." For the Bible "immortality" is not merely the survival of the soul, the passing into "Sheol" or "Hades." This is not, in itself considered, "life" or happiness. The "immortality" the Bible contemplates is an immortality of the whole person—body and soul together. It implies, therefore, deliverance from the state of death. It is not a condition simply of future existence, however prolonged, but a state of blessedness, due to redemption and the possession of the "eternal life" in the soul; it includes resurrection and perfected life in both soul and body. The subject must now be considered more particularly in its different aspects.<P>I. The Natural Belief.<P>1. Its Origin:<P>In some sort the belief in the survival of the spirit or self at death is a practically universal phenomenon. To what is it traceable? A favorite hypothesis with anthropologists is that it has its origin in dreams or visions suggesting the continued existence of the dead (compare H. Spencer, Eccles. Instit., chapters i, xiv). Before, however, a dream can suggest the survival of the soul, there must be the idea of the soul, and of this there seems a simpler explanation in the consciousness which even the savage possesses of something within him that thinks, feels and wills, in distinction from his bodily organs. At death this thinking, feeling something disappears, while the body remains. What more natural than to suppose that it persists in some other state apart from the body? (Compare Max Muller, Anthrop. Religion, 281.) Dreams, etc., may help this conviction, but need not create it. It is only as we assume such a deeper root for the belief that we can account for its universality and persistence. Even this, however, while an instinctive presumption, can hardly be called a proof of survival after death, and it does not yield an idea of "immortality" in any worthy sense. It is at most, as already said, a ghostly reduplication of the earthly life that is thus far reached.<P>2. Philosophical Arguments:<P>(1) The Soul Spiritual.<P>The more philosophical arguments that are adduced for the soul\'s immortality. (or survival) are not all of equal weight. The argument based on the metaphysical essence of the soul (see Plato\'s Phaedo) is not in these days felt to be satisfying. On the other hand, it can be maintained against the materialist on irrefragable grounds that the soul, or thinking spirit, in man is immaterial in Nature, and, where this is granted, there is, or can be, no proof that death, or physical dissolution, destroys this conscious spirit. The presumption is powerfully the other way. Cicero of old argued that death need not even be the suspension of its powers (compare Tusc. Disp. i.20); Butler reasons the matter from analogy (Anal., I, chapter i); modern scientists like J.S. Mill (Three Essays, 201) and Professor Huxley (Life and Letters, I, 217ff; compare William James, Ingersoll Lecture) concede that immortality cannot be disproved. The denial one hears from various sides more frequently than formerly is therefore not warranted. Still possibility is not certainty, and there is nothing as yet to show that even if the soul survives death, its new state of existence has in it anything desirable.<P>Soul not Inherently Indestructible<P>It was hinted that one use which the Greeks made of the metaphysical argument was to prove the indestructibility of the soul—its immortality in the sense of having no beginning and no end. This is not the Christian doctrine. The soul has no such inherent indestructibility. It is dependent on God, as everything else is, for its continued existence. Did He withdraw His sustaining power, it would cease to exist. That it does continue to exist is not doubted, but this must be argued on other grounds.<P>(2) Capacities of Human Nature.<P>A much more apprehensible argument for immortality—more strictly, of a future state of existence—is drawn from the rich capacities and possibilities of human nature, for which the earthly life affords so brief and inadequate a sphere of exercise. It is the characteristic of spirit that it has in it an element of infinitude, and aspires to the infinite. The best the world can give can never satisfy it. It has in it the possibility of endless progress, and ever higher satisfaction. It was this consideration which led Kant, with all his theoretical skepticism, to give immortality a place among his "doctrinal beliefs" (see his Critique of Pure Reason, Bohn\'s translation, 590-91), and moved J.S. Mill to speak of it as the only hope which gave adequate scope to the human faculties and feelings, "the loftier aspirations being no longer kept down by a sense of the insignificance of human life by the disastrous feeling of \'not worth while\'" (Three Essays, 249). Yet when these arguments are calmly weighed, they amount to no more than a proof that man is constituted for immortality; they do not afford a guarantee that this destiny might not be forfeited, or if they yield such a guarantee for the good, they hardly do so for the wicked. The belief, in their case, must depend on other considerations.<P>(3) The Moral Argument.<P>It is, as Kant also felt, when we enter the moral sphere that immortality, or the continued existence of the soul, becomes a practical certainty to the earnest mind. With moral personality is bound up the idea of moral law and moral responsibility; this, in turn, necessitates the thought of the world as a moral system, and of God as moral Ruler. The world, as we know it, is certainly a scene of moral administration—of probation, of discipline, of reward and penalty—but as obviously a scene of incomplete moral administration. The tangled condition of things in this life can satisfy no one\'s sense of justice. Goodness is left to suffer; wickedness outwardly triumphs. The evil-doer\'s own conscience proclaims him answerable, and points to future judgment. There is need for a final rectification of what is wrong here. But while a future state seems thus called for, this does not of itself secure eternal existence for the wicked, nor would such existence be "immortality" in the positive sense. In view of the mystery of sin, the lamp of reason grows dim. For further light we must look to revelation. II. The Biblical Doctrine—the Old Testament.<P>1. Starting-Point—Man\'s Relation to God:<P>The Biblical view of immortality starts from man\'s relation to God. Man, as made in the image of God (<a onClick="return mV(\'Gen\',1,27);">Ge 1:27</a>), is fitted for the knowledge of God, for fellowship with Him. This implies that man is more than an animal; that he has a life which transcends time. In it already lies the pledge of immortality if man is obedient.<P>Man\'s Nature.<P>With this corresponds the account given of man\'s creation and original state. Man is a being composed of body and soul; both are integral parts of his personality. He was created for life, not for mortality. The warning, "In the day that thou eatest thereof thou shalt surely die" (<a onClick="return mV(\'Gen\',2,17);">Ge 2:17</a>), implies that if man continued obedient he would live. But this is not an immortality of the soul only. It is a life in the body (compare <a onClick="return mV(\'Gen\',3,22);">Ge 3:22</a>). Its type is such cases as Enoch and Elijah (<a onClick="return mV(\'Gen\',5,24);">Ge 5:24</a>; <a onClick="return mV(\'2Ki\',2,11,12);">2Ki 2:11-12</a>; compare <a onClick="return mV(\'Psa\',49,15);">Ps 49:15</a>; <a onClick="return mV(\'Psa\',73,24);">73:24</a>).<P>2. Sin and Death:<P>The frustration of this original destiny of man comes through sin. Sin entails death (see <a href="study/isbe/search.html?string=DEATH">DEATH</A>). Death in its physical aspect is a separation of soul and body—a breaking up of the unity of man\'s personality. In one sense, therefore, it is the destruction of the immortality which was man\'s original destiny. It does not, however, imply the extinction of the soul. That survives, but not in a state that can be called "life." It passes into Sheol—the sad, gloomy abode of the dead, in which there is no joy, activity, knowledge of the affairs of earth, or (in the view of Nature) remembrance of God, or praise of His goodness (on this subject, and the Hebrew belief in the future state generally, see <a href="study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</A>; <a href="study/isbe/search.html?string=DEATH">DEATH</a>; <a href="study/isbe/search.html?string=SHEOL">SHEOL</a>). This is not future "life"—not "immortality."<P>It is the part of grace and redemption to restore immortality in the true sense. Had the world been left to develop in sin, no further hope could have come to it. The picture of Sheol would have become ever darker as the idea of retribution grew stronger; it could never become brighter.<P>3. Grace and Redemption—the True Immortality:<P>But God\'s grace intervened: "Deliver him from going down to the pit, I have found a ransom" (<a onClick="return mV(\'Job\',33,24);">Job 33:24</a>). God\'s mercy breaks in on the hopelessness of man\'s lot. He gives to man His promises; makes His covenant with man; admits man to His fellowship (<a onClick="return mV(\'Gen\',3,15);">Ge 3:15</a>; <a onClick="return mV(\'Gen\',4,4);">4:4</a>; <a onClick="return mV(\'Gen\',5,24);">5:24</a>; <a onClick="return mV(\'Gen\',6,8,9);">6:8-9</a>; <a onClick="return mV(\'Gen\',12,\'1-3\');">12:1-3</a>; <a onClick="return mV(\'Gen\',15,\'1-\');">15</a>, etc.). In this fellowship the soul was raised again to its true life even on earth. But this held in it also a hope for the future. The promises placed in the forefront as tokens of God\'s favors were indeed predominatingly temporal—promises for this life—but within these (the kernel within the shell) was the supreme possession of God Himself (<a onClick="return mV(\'Psa\',4,6);">Ps 4:6</a>f; <a onClick="return mV(\'Psa\',16,2);">16:2</a>). This held in it the hope of redemption and the principle of every good.<P>Deliverance from Sheol.<P>Here we reach the core of the Old Testament hope of immortality. Such fellowship as the believer had with God could not be lost, even in Sheol; beyond that was deliverance from Sheol. In their highest moments it was this hope that sustained patriarchs, psalmists, prophets, in their outlook on the future. Doubt might cloud their minds; there might be seasons of darkness and even despair; but it was impossible in moments of strong faith to believe that God would ever really desert them. The eternal God was their dwelling-place; them were everlasting arms (<a onClick="return mV(\'Deu\',33,27);">De 33:27</a>; compare <a onClick="return mV(\'Psa\',90,1);">Ps 90:1</a>). Their hope of immortality, therefore, was, in principle, the hope not merely of an "immortality of the soul," but likewise of resurrection—of complete deliverance from Sheol. Thus it is clearly in the impassioned outburst of Job (<a onClick="return mV(\'Job\',19,\'25-27\');">19:25-27</a>; compare <a onClick="return mV(\'Job\',14,13);">14:13</a>ff), and in many of the psalms. The hope always clothes itself in the form of complete deliverance from Sheol. Thus in <a onClick="return mV(\'Psa\',17,14);">Ps 17:14</a>f; the wicked have their portion "in this life," but, "As for me, I shall behold thy face in righteousness; I shall be satisfied, when I awake, with thy likeness" (the American Standard Revised Version "with beholding thy form"); and in <a onClick="return mV(\'Psa\',49,14);">Ps 49:14</a>f; the wicked are "appointed as a flock for Sheol," but "God will redeem my soul from the power of Sheol; for he will receive me" (same expression as that regarding Enoch, <a onClick="return mV(\'Gen\',5,24);">Ge 5:24</a>; compare <a onClick="return mV(\'Psa\',73,24);">Ps 73:24</a>). It will be remembered that when Jesus expounded the declaration, "I am the God of Abraham," etc., it was as a pledge of resurrection (<a onClick="return mV(\'Mat\',22,31);">Mt 22:31</a>f). The idea comes to final expression in the declaration in Daniel of a resurrection of the just and unjust (<a onClick="return mV(\'Dan\',12,2);">12:2</a>). For further development and illustration see <a href="study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>.<P>4. Later Jewish Thought:<P>Later Jewish thought carried out these ideas of the Old Testament to further issues. A blessed future for the righteous was now accepted, and was definitely connected with the idea of resurrection. The wicked remained in Sheol, now conceived of as a place of retribution. The Gentiles, too, shared this doom.<P>See <a href="study/isbe/search.html?string=ESCHATOLOGY">ESCHATOLOGY</A>.<P>III. The Christian Hope.<P>1. Immortality through Christ:<P>In full consonance with what is revealed in part in the Old Testament is the hope of immortality discovered in the New Testament. The ring of this joyful hope is heard in every part of the apostolic writings. "Blessed be the God and Father of our Lord Jesus Christ," says Peter, "who according to his great mercy begat us again unto a living hope by the resurrection of Jesus Christ from the dead, unto an inheritance incorruptible, and undefiled, and that fadeth not away, reserved in heaven for you" (<a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>f). Paul declares, "Our Saviour Christ Jesus, who...brought life and immortality (incorruption) to light through the gospel" (<a onClick="return mV(\'2Ti\',1,10);">2Ti 1:10</a>). In <a onClick="return mV(\'Rom\',2,7);">Ro 2:7</a> he had spoken of those who "by patience in well-doing seek for glory and honor and incorruption, eternal life." This immortality, it is seen, is part of the eternal life bestowed through Jesus on believers. It is guaranteed by Christ\'s own resurrection and life in glory. The nature of this hope of the gospel may now be further analyzed.<P>(1) Survival of the Soul.<P>The soul survives the body. A future state for both righteous and wicked is plainly declared by Jesus Himself. "He that believeth on me," He said to Martha, "though he die, yet shall he live; and whosoever liveth and believeth on me shall never die" (<a onClick="return mV(\'Jhn\',11,25);">Joh 11:25</a>f). To His disciples He said, "If I go and prepare a place for you, I come again, and will receive you unto myself; that where I am, there ye may be also" (<a onClick="return mV(\'Jhn\',14,3);">Joh 14:3</a>). Compare His words to the penitent thief: "To-day shalt thou be with me in Paradise" (<a onClick="return mV(\'Luk\',23,43);">Lu 23:43</a>). The survival of both righteous and wicked is implied in the parable of the Rich Man and Lazarus (<a onClick="return mV(\'Luk\',16,\'19-31\');">Lu 16:19-31</a>). So in many other places (e.g. <a onClick="return mV(\'Mat\',5,29);">Mt 5:29</a>f; <a onClick="return mV(\'Mat\',10,28);">10:28</A>; <a onClick="return mV(\'Mat\',11,\'21-24\');">11:21-24</A>; <a onClick="return mV(\'Mat\',12,41);">12:41</a>, etc.). The same is the teaching of the epistles. The doctrine of a future judgment depends on and presupposes this truth (<a onClick="return mV(\'Rom\',2,\'5-11\');">Ro 2:5-11</a>; <a onClick="return mV(\'2Cr\',5,10);">2Co 5:10</a>, etc.).<P>(2) Union with Christ in Unseen World.<P>Death for the redeemed, though a result of sin, does not destroy the soul\'s relation to God and to Christ. The eternal life implanted in the soul in time blossoms in its fruition into the life and blessedness of eternity (<a onClick="return mV(\'Rom\',8,10);">Ro 8:10</a>f; <a onClick="return mV(\'Phl\',1,21);">Php 1:21</a>; <a onClick="return mV(\'Col\',1,27);">Col 1:27</a>). The soul is, indeed, in an incomplete state till the resurrection. It "waits for our adoption, to wit, the redemption of our body" (<a onClick="return mV(\'Rom\',8,23);">Ro 8:23</a>). But its state, though incomplete, is still a happy one. Hades has lost its gloom, and is for it a "Paradise" (<a onClick="return mV(\'Luk\',23,43);">Lu 23:43</a>). It dwells in a chamber of the Father\'s house (<a onClick="return mV(\'Jhn\',14,2);">Joh 14:2</a>f; <a onClick="return mV(\'Jhn\',17,24);">17:24</A>). It is to be, even in the unclothed state ("absent from the body"), "at home with the Lord" (<a onClick="return mV(\'2Cr\',5,8);">2Co 5:8</a>). It is for it an object of desire to be "with Christ" in that state after death (<a onClick="return mV(\'Phl\',1,21);">Php 1:21</a>). The pictures in R
