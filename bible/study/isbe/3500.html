isbe[3501]='Folly`fol\'-i.`<a href="./study/isbe/search.html?string=FOOL">FOOL</a>`1';
isbe[3502]='Food`food:<P><b>I. VEGETABLE FOODS</b><P class="in15">1. Primitive Habits<P class="in15">2. Cereals<P class="in15">3. Leguminous Plants<P class="in15">4. Food of Trees<P><b>II. ANIMAL FOOD</b><P><b>LITERATURE</B><hr /><P>In a previous article (see <a href="./study/isbe/search.html?string=BREAD">BREAD</a>) it has been shown that in the Bible "bread" usually stands for food in general and how this came to be so. In a complementary article on <a href="./study/isbe/search.html?string=MEALS">MEALS</a> the methods of preparing and serving food will be dealt with. This article is devoted specifically to the foodstuffs of the Orient, more especially to articles of food in use among the Hebrews in Bible times. These are divisible into two main classes.<P>I. Vegetable Foods.<P>1. Primitive Habits:<P>Orientals in general are vegetarians, rather than flesh eaters. There is some reason to believe that primitive man was a vegetarian (see <a onClick="return mV(\'Gen\',2,16);">Ge 2:16</a>; <a onClick="return mV(\'Gen\',3,2,6);">3:2, 6</a>). It would seem, indeed, from a comparison of <a onClick="return mV(\'Gen\',1,29);">Ge 1:29</a>f with <a onClick="return mV(\'Gen\',9,3);">9:3</a>f that Divine permission to eat the flesh of animals was first given to Noah after the Deluge, and then only on condition of drawing off the blood in a prescribed way (compare the kosher (kasher) meat of the Jews of today).<P>2. Cereals:<P>The chief place among the foodstuffs of Orientals must be accorded to the cereals, included in the American Standard Revised Version under the generic term "grain," in the King James Version and the English Revised Version "corn." The two most important of these in the nearer East are wheat (chittah) and barley (se\'orim). The most primitive way of using the wheat as food was to pluck the (<a onClick="return mV(\'Lev\',23,14);">Le 23:14</a>; <a onClick="return mV(\'2Ki\',4,42);">2Ki 4:42</a>), remove the husks by rubbing in the hands (<a onClick="return mV(\'Deu\',23,25);">De 23:25</a>; <a onClick="return mV(\'Mat\',12,1);">Mt 12:1</a>), and eat the grains raw. A common practice in all lands and periods, observed by the fellaheen of Syria today, has been to parch or roast the ears and eat the grain not ground. This is the parched corn (the American Standard Revised Version "\'grain") so often mentioned in the Old Testament, which with bread and vinegar (sour wine) constituted the meal of the reapers to which Boaz invited Ruth (<a onClick="return mV(\'Rth\',2,14);">Ru 2:14</a>).<P>Later it became customary to grind the wheat into flour (kemach), and, by bolting it with a fine sieve, to obtain the "fine flour" (coleth) of our English Versions of the Bible, which, of course, was then made into "<a href="./study/isbe/search.html?string=BREAD">bread</a>" (which see), either without leaven (matstsah) or with (lechem chamets <a onClick="return mV(\'Lev\',7,13);">Le 7:13</a>).<P>Meal, both of wheat and of barley, was prepared in very early times by means of the primitive rubbing-stones, which excavations at Lachish, Gezer and elsewhere show survived the introduction of the hand-mill (see <a href="./study/isbe/search.html?string=MILL">MILL</a>; Compare PEFS, 1902, 326). Barley (se\'orim) has always furnished the principal food of the poorer classes, and, like wheat, has been made into bread (<a onClick="return mV(\'Jdg\',7,13);">Jud 7:13</a>; <a onClick="return mV(\'Jhn\',6,9,13);">Joh 6:9, 13</a>). Less frequently millet (<a onClick="return mV(\'Eze\',4,9);">Eze 4:9</a>) and spelt (kuccemeth; see <a href="./study/isbe/search.html?string=FITCHES">FITCHES</a>) were so used. (For details of baking, bread-making, etc., see <a href="./study/isbe/search.html?string=BREAD">BREAD. III, 1,2,3.</a>)<P>3. Leguminous Plants:<P>Vegetable foods of the pulse family (leguminosae) are represented in the Old Testament chiefly by lentils and beans. The pulse of <a onClick="return mV(\'Dan\',1,12);">Da 1:12</a> (zero\'im) denotes edible "herbs" in general (Revised Version margin, compare <a onClick="return mV(\'Isa\',61,11);">Isa 61:11</a>, "things that are sown"). The lentils (\'adhashim) were and are considered very toothsome and nutritious. It was of "red lentils" that Jacob brewed his fateful pottage (<a onClick="return mV(\'Gen\',25,29,34);">Ge 25:29, 34</a>), a stew, probably, in which the lentils were flavored with onions and other ingredients, as we find it done in Syria today. Lentils, beans, cereals, etc., were sometimes ground and mixed and made into bread (<a onClick="return mV(\'Eze\',4,9);">Eze 4:9</a>). I found them at Gaza roasted also, and eaten with oil and salt, like parched corn.<P>The children of Israel, when in the wilderness, are said to have looked back wistfully on the "cucumbers...melons...leeks...onions, and the garlic" of Egypt (<a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>). All these things we find later were grown in Palestine. In addition, at least four varieties of the bean, the chickpea, various species of chickory and endive, the bitter herbs of the Passover ritual (<a onClick="return mV(\'Exd\',12,8);">Ex 12:8</a>), mustard (<a onClick="return mV(\'Mat\',13,31);">Mt 13:31</a>) and many other things available for food, are mentioned in the Mishna, our richest source of information on this subject. Cucumbers (qishshu\'im) were then, as now, much used. The oriental variety is much less fibrous and more succulent. and digestible than ours, and supplies the thirsty traveler often with a fine substitute for water where water is scarce or bad. The poor in such cities as Cairo, Beirut and Damascus live largely on bread and cucumbers or melons. The cucumbers are eaten raw, with or without salt, between meals, but also often stuffed and cooked and eaten at meal time. Onions (betsalim), garlic (shummim) and leeks (chatsir) are still much used in Palestine as in Egypt. They are usually eaten raw with bread, though also used for flavoring in cooking, and, like cucumbers, pickled and eaten as a relish with meat (ZDPV, IX, 14). Men in utter extremity sometimes "plucked saltwort" (malluah) and ate the leaves, either raw or boiled, and made "the roots of the broom" their food (<a onClick="return mV(\'Job\',30,4);">Job 30:4</a>).<P>4. Food of Trees:<P>In <a onClick="return mV(\'Lev\',19,23);">Le 19:23</a>f it is implied that, when Israel came into the land to possess it, they should "plant all manner of trees for food." They doubtless found such trees in the goodly land in abundance, but in the natural course of things needed to plant more. Many olive trees remain fruitful to extreme old age, as for example those shown the tourist in the garden of Gethsemane, but many more require replanting. Then the olive after planting requires ten or fifteen years to fruit, and trees of a quicker growth, like the fig, are planted beside them and depended on for fruit in the meantime. It is significant that Jotham in his parable makes the olive the first choice of the trees to be their king (<a onClick="return mV(\'Jdg\',9,9);">Jud 9:9</a>), and the olive tree to respond, "Should I leave my fatness, which God and man honor in me, and go to wave to and fro over the trees?" (American Revised Version margin). The berries of the olive (zayith) were doubtless eaten, then as now, though nowhere in Scripture is it expressly so stated. The chief use of the berries, now as ever, is in furnishing "<a href="./study/isbe/search.html?string=OIL">oil</a>" (which see), but they are eaten in the fresh state, as also after being soaked in brine, by rich and poor alike, and are shipped in great quantities. Olive trees are still more or less abundant in Palestine, especially around Bethlehem and Hebron, on the borders of the rich plains of Esdraelon, Phoenicia, Sharon and Philistia, in the vale of Shechem, the plain of Moreh, and in the trans-Jordanic regions of Gilead and Bashan. They are esteemed as among the best possessions of the towns, and the culture of them is being revived around Jerusalem, in the Jordan valley and elsewhere throughout the land. They are beautiful to behold in all stages of their growth, but especially in spring. Then they bear an amazing wealth of blossoms, which in the breeze fall in showers like snowflakes, a fact that gives point to Job\'s words, "He shall cast off his flower as the olive-tree" (<a onClick="return mV(\'Job\',15,33);">Job 15:33</a>). The mode of gathering the fruit is still about what it was in ancient times (compare <a onClick="return mV(\'Exd\',27,20);">Ex 27:20</a>).<P>Next in rank to the olive, according to Jotham\'s order, though first as an article of food, is the fig (in the Old Testament te\'enah, in the New Testament suke), whose "sweetness" is praised in the parable (<a onClick="return mV(\'Jdg\',9,11);">Jud 9:11</a>). It is the principal shade and fruit tree of Palestine, growing in all parts, in many spontaneously, and is the emblem of peace and prosperity (<a onClick="return mV(\'Deu\',8,8);">De 8:8</a>; <a onClick="return mV(\'Jdg\',9,10);">Jud 9:10</a>; <a onClick="return mV(\'1Ki\',4,25);">1Ki 4:25</a>; <a onClick="return mV(\'Mic\',4,4);">Mic 4:4</a>; <a onClick="return mV(\'Zec\',3,10);">Zec 3:10</a>; 1Macc 14:12). The best fig and olive orchards are carefully plowed, first in the spring when the buds are swelling, sometimes again when the second crop is sprouting, and again after the first rains in the autumn. The "first-ripe fig" (bikkurah, <a onClick="return mV(\'Isa\',28,4);">Isa 28:4</a>; <a onClick="return mV(\'Jer\',24,2);">Jer 24:2</a>), i.e. the early fig which grows on last year\'s wood, was and is esteemed as a great delicacy, and is often eaten while it is young and green. The late fig (te\'enim) is the kind dried in the sun and put up in quantities for use out of season. Among the Greeks and the Romans, as well as among the Hebrews, dried figs were most extensively used. When pressed in a mold they formed the "cakes of figs" (debhelah) mentioned in the Old Testament (<a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>; <a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a>), doubtless about such as are found today in Syria and Smyrna, put up for home use and for shipment. It was such a fig-cake that was presented as a poultice (the King James Version "plaster") for Hezekiah\'s boil (<a onClick="return mV(\'Isa\',38,21);">Isa 38:21</a>; compare <a onClick="return mV(\'2Ki\',20,7);">2Ki 20:7</a>). As the fruit-buds of the fig appear before the leaves, a tree full of leaves and without fruit would be counted "barren" (<a onClick="return mV(\'Mar\',11,12);">Mr 11:12</a>f; compare <a onClick="return mV(\'Isa\',28,4);">Isa 28:4</a>; <a onClick="return mV(\'Jer\',24,2);">Jer 24:2</a>; <a onClick="return mV(\'Hsa\',9,10);">Ho 9:10</a>; <a onClick="return mV(\'Nah\',3,12);">Na 3:12</a>; <a onClick="return mV(\'Mat\',21,19);">Mt 21:19</a>; <a onClick="return mV(\'Luk\',13,7);">Lu 13:7</a>).<P>Grapes (\'anabhim), often called "the fruit of the vine" (<a onClick="return mV(\'Mat\',26,29);">Mt 26:29</a>), have always been a much-prized article of food in the Orient. They are closely associated in the Bible with the fig (compare "every man under his vine and under his fig-tree," <a onClick="return mV(\'1Ki\',4,25);">1Ki 4:25</a>). Like the olive, the fig, and the date-palm, grapes are indigenous to Syria, the soil and climate being most favorable to their growth and perfection. Southern Palestine especially yields a rich abundance of choice grapes, somewhat as in patriarchal times (<a onClick="return mV(\'Gen\',49,11,12);">Ge 49:11-12</a>). J. T. Haddad, a native Syrian, for many years in the employment of the Turkish government, tells of a variety in the famous valley of Eshcol near Hebron, a bunch from which has been known to weigh twenty-eight pounds (compare <a onClick="return mV(\'Num\',13,23);">Nu 13:23</a>). Of the grapevine there is nothing wasted; the young leaves are used as a green vegetable, and the old are fed to sheep and goats. The branches cut off in pruning, as well as the dead trunk, are used to make charcoal, or for firewood. The failure of such a fruit was naturally regarded as a judgment from Yahweh (<a onClick="return mV(\'Psa\',105,33);">Ps 105:33</a>; <a onClick="return mV(\'Jer\',5,17);">Jer 5:17</a>; <a onClick="return mV(\'Hsa\',2,12);">Ho 2:12</a>; <a onClick="return mV(\'Joe\',1,7);">Joe 1:7</a>). Grapes, like figs, were both enjoyed in their natural state, and by exposure to the sun dried into raisins (tsimmuqim), the "dried grapes" of <a onClick="return mV(\'Num\',6,3);">Nu 6:3</a>. In this form they were especially well suited to the use of travelers and soldiers (<a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>; <a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a>). The meaning of the word rendered "raisin-cake," the American Standard Revised Version "a cake of raisins" (<a onClick="return mV(\'2Sa\',6,19);">2Sa 6:19</a> and elsewhere), is uncertain. In Bible times the bulk of the grape product of the land went to the making of <a href="./study/isbe/search.html?string=WINE">wine</a> (which see). Some doubt if the Hebrews knew grape-syrup, but the fact that the Aramaic dibs, corresponding to Hebrew debhash, is used to denote both the natural and artificial honey (grape-syrup), seems to indicate that they knew the latter (compare <a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>; <a onClick="return mV(\'Eze\',27,17);">Eze 27:17</a>; and see <a href="./study/isbe/search.html?string=HONEY">HONEY</a>).<P>Less prominent was the fruit of the mulberry figtree (or sycomore) (shiqmah), of the date-palm (tamar), the dates of which, according to the Mishna, were both eaten as they came from the tree, and dried in clusters and pressed into cakes for transport; the pomegranate (tappuach), the "apple" of the King James Version (see <a href="./study/isbe/search.html?string=APPLE;+APPLE-TREE">APPLE</a>), or quinch, according to others; the husks (<a onClick="return mV(\'Luk\',15,16);">Lu 15:16</a>), i.e. the pods of the carob tree keration), are treated elsewhere. Certain nuts were favorite articles of food—pistachio nuts (botnim), almonds (sheqedhim) and walnuts (\'eghoz); and certain spices and vegetables were much used for seasoning: <a href="./study/isbe/search.html?string=CUMMIN">cummin</a> (kammon), <a href="./study/isbe/search.html?string=ANISE;+DILL">anise, dill</a> (the King James Version) qetsach), <a href="./study/isbe/search.html?string=MINT">mint</a> (heduosmon) and <a href="./study/isbe/search.html?string=MUSTARD">mustard</a> (sinapi), which see. <a href="./study/isbe/search.html?string=SALT">Salt</a> (melach), of course, played an important part, then as now, in the cooking and in the life of the Orientals. To "eat the salt" of a person was synonymous with eating his bread (<a onClick="return mV(\'Ezr\',4,14);">Ezr 4:14</a>), and a "<a href="./study/isbe/search.html?string=SALT,+COVENANT+OF">covenant of salt</a>" was held inviolable (<a onClick="return mV(\'Num\',18,19);">Nu 18:19</a>; <a onClick="return mV(\'2Ch\',13,5);">2Ch 13:5</a>).<P>II. Animal Food.<P>Anciently, even more than now in the East, flesh food was much less used than among western peoples. In the first place, in Israel and among other Semitic peoples, it was confined by law to the use of such animals and birds as were regarded as "clean" (see <a href="./study/isbe/search.html?string=CLEAN">CLEAN</a>; <a href="./study/isbe/search.html?string=UNCLEANNESS">UNCLEANNESS</a>), or speaking according to the categories of <a onClick="return mV(\'Lev\',11,2,3);">Le 11:2-3</a>; <a onClick="return mV(\'Deu\',14,\'4-20\');">De 14:4-20</a>, domestic animals and game (see Driver on <a onClick="return mV(\'Deu\',14,\'4-20\');">De 14:4-20</a>). Then the poverty of the peasantry from time immemorial has tended to limit the use of meat to special occasions, such as family festivals (chaggim), the entertainment of an honored guest (<a onClick="return mV(\'Gen\',18,7);">Ge 18:7</a>; <a onClick="return mV(\'2Sa\',12,4);">2Sa 12:4</a>), and the sacrificial meal at the local sanctuary.<P>The goat (\'ez, etc.), especially the "kid of the goats" (<a onClick="return mV(\'Lev\',4,23,28);">Le 4:23, 28</a> the King James Version), was more prized for food by the ancient Hebrews than by modern Orientals, by whom goats are kept chiefly for their milk—most of which they supply (compare <a onClick="return mV(\'Pro\',27,27);">Pr 27:27</a>). For this reason they are still among the most valued possessions of rich and poor (compare <a onClick="return mV(\'Gen\',30,33);">Ge 30:33</a>; <a onClick="return mV(\'Gen\',32,14);">32:14</a> with <a onClick="return mV(\'1Sa\',25,2);">1Sa 25:2</a>). A kid, as less valuable than a lamb, was naturally the readier victim when meat was required (compare <a onClick="return mV(\'Luk\',15,29);">Lu 15:29</a>).<P>The sheep of Palestine, as of Egypt, are mainly of the fat-tailed species (Ovis aries), the tail of which was forbidden as ordinary food and had to be offered with certain other portions of the fat (<a onClick="return mV(\'Exd\',29,22);">Ex 29:22</a>; <a onClick="return mV(\'Lev\',3,9);">Le 3:9</a>). To kill a lamb in honor of a gue st is one of the highest acts of Bedouin hospitality. As a rule only the lambs are killed for meat, and they only in honor of some guest or festive occasion (compare <a onClick="return mV(\'1Sa\',25,18);">1Sa 25:18</a>; <a onClick="return mV(\'1Ki\',1,19);">1Ki 1:19</a>). Likewise the "calves of the herd" supplied the daintiest food of the kind, though the flesh of the neat cattle, male and female, was eaten. The "fatted calf" of <a onClick="return mV(\'Luk\',15,23);">Lu 15:23</a> will be recalled, as also the "fatlings" and the "stalled" (stall-fed) ox of the Old Testament (<a onClick="return mV(\'Pro\',15,17);">Pr 15:17</a>). Asharp contrast suggestive of the growth of luxury in Israel is seen by a comparison of <a onClick="return mV(\'2Sa\',17,28);">2Sa 17:28</a>f with <a onClick="return mV(\'1Ki\',4,22);">1Ki 4:22</a>f. The food furnished David and his hardy followers at Mahanaim was "wheat, and barley, and meal, and parched grain, and beans, and lentils, and parched pulse, and honey, and butter, and sheep, and cheese of the herd," while the daily provision for Solomon\'s table was "thirty measures of fine flour, and threescore measures of meal, ten fat oxen, and twenty oxen out of the pastures, and a hundred sheep, besides harts, and gazelles, and roebucks, and fatted fowl." Nehemiah\'s daily portion is given as "one ox and six choice sheep" (<a onClick="return mV(\'Neh\',5,18);">Ne 5:18</a>).<P>Milk of large and small animals was a staple article of food (<a onClick="return mV(\'Deu\',32,14);">De 32:14</a>; <a onClick="return mV(\'Pro\',27,27);">Pr 27:27</a>). It was usually kept in skins, as among the Syrian peasants it is today (<a onClick="return mV(\'Jdg\',4,19);">Jud 4:19</a>). We find a generic term often used (chem\'ah) which covers also cream, clabber and cheese (<a onClick="return mV(\'Pro\',30,33);">Pr 30:33</a>). The proper designation of cheese is gebhinah (<a onClick="return mV(\'Job\',10,10);">Job 10:10</a>), but chalabh also is used both for ordinary milk and for a cheese made directly from sweet milk (compare <a onClick="return mV(\'1Sa\',17,18);">1Sa 17:18</a>, charitse hechalabh, and our "cottage cheese").<P>See <a href="./study/isbe/search.html?string=MILK">MILK</a>.<P>Honey (debhash, nopheth ha-tsuphim), so often mentioned with milk, is ordinary bees\' honey (see <a href="./study/isbe/search.html?string=HONEY">HONEY</a>). The expression "honey" in the combination debhash wechalabh, for which Palestine was praised, most likely means debhash temarim, i.e. "date-juice." It was much prized and relished (<a onClick="return mV(\'Psa\',19,10);">Ps 19:10</a>; <a onClick="return mV(\'Pro\',16,24);">Pr 16:24</a>), and seems to have been a favorite food for children (<a onClick="return mV(\'Isa\',7,15);">Isa 7:15</a>).<P>Of game seven species are mentioned (<a onClick="return mV(\'Deu\',14,5);">De 14:5</a>). The gazelle and the hart were the typical animals of the chase, much prized for their flesh (<a onClick="return mV(\'Deu\',12,15);">De 12:15</a>), and doubtless supplied the venison of Esau\'s "savory meat" (<a onClick="return mV(\'Gen\',25,28);">Ge 25:28</a>; <a onClick="return mV(\'Gen\',27,4);">27:4</a>).<P>Of fish as food little is said in the Old Testament (see <a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>; <a onClick="return mV(\'Jer\',16,16);">Jer 16:16</a>; <a onClick="return mV(\'Eze\',47,10);">Eze 47:10</a>; <a onClick="return mV(\'Ecc\',9,12);">Ec 9:12</a>). No particular species is named, although thirty-six species are said to be found in the waters of the Jordan valley alone. But we may be sure that the fish which the Hebrews enjoyed in Egypt "for nought" (<a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>) had their successors in Canaan (Kennedy). Trade in cured fish was carried on by Tyrian merchants with Jerusalem in Nehemiah\'s day (<a onClick="return mV(\'Neh\',13,16);">Ne 13:16</a>), and there must have been a fish market at or near the fish gate (<a onClick="return mV(\'Neh\',3,3);">Ne 3:3</a>). The Sea of Galilee in later times was the center of a great fish industry, as is made clear by the Gospels and by Josephus In the market of Tiberias today fresh fish are sold in great quantities, and a thriving trade in salt fish is carried on. The "small fishes" of our Lord\'s two great miracles of feeding were doubtless of this kind, as at all times they have been a favorite form of provision for a journey in hot countries.<P>As to the exact price of food in ancient times little is known. From <a onClick="return mV(\'2Ki\',7,1,16);">2Ki 7:1, 16</a> we learn that one ce\'ah of fine flour, and two of barley, sold for a shekel (compare <a onClick="return mV(\'Mat\',10,29);">Mt 10:29</a>). For birds allowed as food see <a onClick="return mV(\'Deu\',14,11);">De 14:11</a> and articles on <a href="./study/isbe/search.html?string=CLEAN">CLEAN</a>; <a href="./study/isbe/search.html?string=UNCLEANNESS">UNCLEANNESS</a>.<P>Pigeons and turtle doves find a place in the ritual of various sacrifices, and so are to be reckoned as "clean" for ordinary uses as well. The species of domestic fowl found there today seem to have been introduced during the Persian period (compare 2Esdras 1:30; <a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>; <a onClick="return mV(\'Mat\',26,34);">26:34</a>, etc.). It is thought that the fatted fowl of Solomon\'s table (<a onClick="return mV(\'1Ki\',4,23);">1Ki 4:23</a>) were geese (see Mish). Fatted goose is a favorite food with Jews today, as it was with the ancient Egyptians.<P>Of game birds used for food (see <a onClick="return mV(\'Neh\',5,18);">Ne 5:18</a>) the partridge and the quail are prominent, and the humble sparrow comes in for his share of mention (<a onClick="return mV(\'Mat\',10,29);">Mt 10:29</a>; <a onClick="return mV(\'Luk\',12,6);">Lu 12:6</a>). Then, as now, the eggs of domestic fowls and of all "clean" birds were favorite articles of food (<a onClick="return mV(\'Deu\',22,6);">De 22:6</a>; <a onClick="return mV(\'Isa\',10,14);">Isa 10:14</a>; <a onClick="return mV(\'Luk\',11,12);">Lu 11:12</a>).<P>Edible insects (<a onClick="return mV(\'Lev\',11,22);">Le 11:22</a>f) are usually classed with animal foods. In general they are of the locust family (see <a href="./study/isbe/search.html?string=LOCUST">LOCUST</a>). They formed part of the food of John the Baptist (<a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>, etc.), were regarded by the Assyrians as delicacies, and are a favorite food of the Arabs today. They are prepared and served in various ways, the one most common being to remove the head, legs and wings, to drop it in meal, and then fry it in oil or butter. It then tastes a little like fried frogs\' legs. In the diet of the Baptist, locusts were associated with wild honey (see <a href="./study/isbe/search.html?string=HONEY">HONEY</a>).<P>As to condiments (see separate articles on <a href="./study/isbe/search.html?string=SALT">SALT</a>; <a href="./study/isbe/search.html?string=CORIANDER">CORIANDER</a>, etc.) it needs only to be said here that the caperberry (<a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a> margin) was eaten before meals as an appetizer and, strictly speaking, was not a condiment. Mustard was valued for the leaves, not for the seed (<a onClick="return mV(\'Mat\',13,31);">Mt 13:31</a>). Pepper, though not mentioned in Scripture, is mentioned margin the Mishna as among the condiments. Before it came into use, spicy seeds like cummin, the coriander, etc., played a more important role than since.<P>The abhorrence of the Hebrews for all food prepared or handled by the heathen (see <a href="./study/isbe/search.html?string=ABOMINATION">ABOMINATION</a>) is to be attributed primarily to the intimate association in early times between flesh food and sacrifices to the gods. This finds conspicuous illustration in the case of Daniel (<a onClick="return mV(\'Dan\',1,8);">Da 1:8</a>), Judas Maccabeus (2Macc 5:27), Josephus (Vita, III), and their compatriots (see also <a onClick="return mV(\'Act\',15,20,29);">Ac 15:20, 29</a>; <a onClick="return mV(\'1Cr\',8,\'1-10\');">1Co 8:1-10</a>; <a onClick="return mV(\'1Cr\',10,19,28);">10:19, 28</a>). As to sources of food supply and traffic in food stuffs, for primitive usages see <a onClick="return mV(\'Gen\',18,7);">Ge 18:7</a>; <a onClick="return mV(\'Gen\',27,9);">27:9</a>; <a onClick="return mV(\'1Ki\',21,2);">1Ki 21:2</a>. As to articles and customs of commerce adopted when men became dwellers in cities, see <a onClick="return mV(\'Jer\',37,21);">Jer 37:21</a>, where bakers were numerous enough in Jerusalem to give their name to a street or bazaar, where doubtless, as today, they baked and sold bread to the public (compare Mishna, passim). Extensive trade in "victuals" in Nehemiah\'s day is attested by <a onClick="return mV(\'Neh\',13,15);">Ne 13:15</a>f; and by specific mention of the "fish gate" (<a onClick="return mV(\'Neh\',3,3);">3:3</a>) and the "sheep gate" (<a onClick="return mV(\'Neh\',3,1);">3:1</a>), so named evidently because of their nearby markets. In John\'s Gospel (<a onClick="return mV(\'Jhn\',4,8);">Joh 4:8</a>; <a onClick="return mV(\'Jhn\',13,29);">13:29</a>) we have incidental evidence that the disciples were accustomed to buy food as they journeyed through the land. In Jerusalem, cheese was clearly to be bought in the cheesemakers\' valley (Tyropoeon), oil of the oil merchants (<a onClick="return mV(\'Mat\',25,9);">Mt 25:9</a>), and so on; and Corinth, we may be sure, was not the only city of Paul\'s day that had a provision market ("shambles," <a onClick="return mV(\'1Cr\',10,25);">1Co 10:25</a> the Revised Version (British and American)).<P>LITERATURE.<P>Mishna B.M. i. 1,2 and passim; Josephus, Vita and BJ; Robinson\'s Researches, II, 416, etc.; and Biblical Dictionaries, articles on "Food," etc.``47';
isbe[3503]='Fool; Folly`fool nabhal, \'ewil, kecil, cakhal and forms; aphron, aphrosune, moros):<P>I. In the Old Testament.<P>1. General:<P>Taking the words generally, apart from the Wisdom literature, we find nabhal frequently translated "fool" and nebhalah, "folly"; nabhal, however, denotes a wicked person, an evil character, "shamelessly immoral," equivalent to "a son of Belial" (Cheyne), rather than a merely "foolish" person, and nebhalah, "wickedness," "shameless impropriety," rather than simple folly. We have almost a definition of nabhal in <a onClick="return mV(\'Isa\',32,6);">Isa 32:6</a>: "For the fool will speak folly, and his heart will work iniquity, to practice profaneness, and to utter error against Yahweh, to make empty the soul of the hungry, and to cause the drink of the thirsty to fail." Abigail described her husband, Nabhal, as "a son of Belial" (the Revised Version (British and American) "worthless fellow"), "for as his name is, so is he" (<a onClick="return mV(\'1Sa\',25,25);">1Sa 25:25</a>), and what we read of him bears out this character. Other occurrences of the words support the above meaning; they are generally associated with some form of wickedness, frequently with base and unnatural lewdness (<a onClick="return mV(\'Gen\',34,7);">Ge 34:7</a>; <a onClick="return mV(\'Deu\',22,21);">De 22:21</a>; <a onClick="return mV(\'Jos\',7,15);">Jos 7:15</a>; <a onClick="return mV(\'Jdg\',19,23,24);">Jud 19:23-24</a>; <a onClick="return mV(\'Jdg\',20,6,10);">20:6, 10</a>; <a onClick="return mV(\'2Sa\',13,12);">2Sa 13:12</a>). When in <a onClick="return mV(\'Psa\',14,1);">Ps 14:1</a>; <a onClick="return mV(\'Psa\',53,1);">53:1</a> it is said, "The fool hath said in his heart, There is no God," it is followed by the statement, "They are corrupt, they have done abominable works," showing that more than "folly" is implied. In <a onClick="return mV(\'Isa\',32,5,6);">Isa 32:5-6</a> the King James Version nabhal is translated "vile person" and nebhalah "villany," the Revised Version (British and American) "fool" and "folly," <a onClick="return mV(\'Jer\',29,23);">Jer 29:23</a>; halal, implying loud boasting is in the King James Version translated "foolish," but it means, rather, "arrogant," which the Revised Version (British and American) adopts (<a onClick="return mV(\'Psa\',5,5);">Ps 5:5</a>; <a onClick="return mV(\'Psa\',73,3);">73:3</a>; <a onClick="return mV(\'Psa\',75,4);">75:4</a>, margin "fools"); cakhal, "a fool," also occurs (<a onClick="return mV(\'Gen\',31,28);">Ge 31:28</a>; <a onClick="return mV(\'1Sa\',13,13);">1Sa 13:13</a>, etc.) for which word see (4) below; also ya\'al "to be empty," "to be or become foolish" (<a onClick="return mV(\'Num\',12,11);">Nu 12:11</a>; <a onClick="return mV(\'Isa\',19,13);">Isa 19:13</a>; <a onClick="return mV(\'Jer\',5,4);">Jer 5:4</a>; <a onClick="return mV(\'Jer\',50,36);">50:36</a>).<P>2. The Wisdom Literature:<P>In the Chokhmah or Wisdom literature, which, within the Bible, is contained in Job, Proverbs (especially), Ecclesiastes, Canticles, some Psalms and certain portions of the prophetic writings, "fool" and "folly" are frequent and distinctive words. Their significance is best seen in contrast with "Wisdom." This was the outcome of careful observation and long pondering on actual life in the light of religion and the Divine revelation. Wisdom had its seat in God and was imparted to those who "feared" Him ("The fear of Yahweh is the beginning (chief part) of knowledge" <a onClick="return mV(\'Pro\',1,7);">Pr 1:7</a>). Such wisdom was the essence of life, and to be without it was to walk in the way of death and destruction. The fool was he who was thoughtless, careless, conceited, self-sufficient, indifferent to God and His Will, or who might even oppose and scoff at religion and wise instruction. See <a href="./study/isbe/search.html?string=WISDOM">WISDOM</a>. Various words are used to designate "the fool" and his "folly."<P>(1) nabhal (<a onClick="return mV(\'Job\',2,10);">Job 2:10</a>; <a onClick="return mV(\'Job\',30,8);">30:8</a>; <a onClick="return mV(\'Psa\',53,1);">Ps 53:1</a>; <a onClick="return mV(\'Pro\',17,\'7-21\');">Pr 17:7-21</a>); nebhalah (<a onClick="return mV(\'Job\',42,8);">Job 42:8</a>; <a onClick="return mV(\'Isa\',9,17);">Isa 9:17</a>) (see above).<P>(2) \'ewil, one of the commonest, the idea conveyed by which is that of one who is hasty, impatient, self-sufficient (<a onClick="return mV(\'Pro\',12,15);">Pr 12:15</a>; <a onClick="return mV(\'Pro\',15,5);">15:5</a>; <a onClick="return mV(\'Pro\',16,22);">16:22</a>); despising advice and instruction (<a onClick="return mV(\'Pro\',1,7);">Pr 1:7</a>; <a onClick="return mV(\'Pro\',14,9);">14:9</a>; <a onClick="return mV(\'Pro\',24,7);">24:7</a>); ready to speak and act without thinking (<a onClick="return mV(\'Pro\',10,14);">Pr 10:14</a>; <a onClick="return mV(\'Pro\',12,16);">12:16</a>; <a onClick="return mV(\'Pro\',20,3);">20:3</a>); quick to get angry, quarrel and cause strife (<a onClick="return mV(\'Pro\',11,29);">Pr 11:29</a>; <a onClick="return mV(\'Pro\',14,17);">14:17</a> \'iwweleth; <a onClick="return mV(\'Pro\',29,9);">29:9</A>); unrestrained in his anger (<a onClick="return mV(\'Job\',5,2);">Job 5:2</a>; <a onClick="return mV(\'Pro\',17,12);">Pr 17:12</a>); silly, stupid even with brute stupidity (<a onClick="return mV(\'Pro\',7,22);">Pr 7:22</a>; <a onClick="return mV(\'Pro\',26,11);">26:11</a>; <a onClick="return mV(\'Pro\',27,22);">27:22</a>; compare <a onClick="return mV(\'Isa\',19,11);">Isa 19:11</a>; <a onClick="return mV(\'Jer\',4,22);">Jer 4:22</a>); he is associated with "transgression" (<a onClick="return mV(\'Psa\',107,17);">Ps 107:17</a>; <a onClick="return mV(\'Pro\',13,15);">Pr 13:15</a>; <a onClick="return mV(\'Pro\',17,18,19);">17:18-19</a>), with "sin" (<a onClick="return mV(\'Pro\',24,9);">Pr 24:9</a>), with the "scoffer" (same place);\' iwweleth, "foolishness" occurs (<a onClick="return mV(\'Psa\',38,5);">Ps 38:5</a>; <a onClick="return mV(\'Psa\',69,5);">69:5</a>; <a onClick="return mV(\'Pro\',13,16);">Pr 13:16</a>; "folly," Ps <a onClick="return mV(\'Pro\',14,8,24,29);">14:8,24,29</A>, etc.).<P>(3) kecil is the word most frequent in Proverbs. It is probably from a root meaning "thickness," "sluggishness," suggesting a slow, self-confident person, but it is used with a wide reference.<P>Self-confidence appears (<a onClick="return mV(\'Pro\',14,16);">Pr 14:16</a>; <a onClick="return mV(\'Pro\',28,26);">28:26</a>); ignorance (<a onClick="return mV(\'Ecc\',2,14);">Ec 2:14</a>); hate of instruction (<a onClick="return mV(\'Pro\',1,22);">Pr 1:22</a>; <a onClick="return mV(\'Pro\',18,2);">18:2</a>); thoughtlessness (<a onClick="return mV(\'Pro\',10,23);">Pr 10:23</a>; <a onClick="return mV(\'Pro\',17,24);">17:24</a>); self-exposure (<a onClick="return mV(\'Pro\',14,33);">Pr 14:33</a>; <a onClick="return mV(\'Pro\',15,2);">15:2</a>; <a onClick="return mV(\'Pro\',18,7);">18:7</a>; <a onClick="return mV(\'Pro\',29,11);">29:11</a>; <a onClick="return mV(\'Ecc\',5,1);">Ec 5:1</a>; <a onClick="return mV(\'Ecc\',10,12);">10:12</a>); anger and contention (<a onClick="return mV(\'Pro\',18,6);">Pr 18:6</a>; <a onClick="return mV(\'Pro\',19,1);">19:1</a>; <a onClick="return mV(\'Ecc\',7,9);">Ec 7:9</a>); rage (<a onClick="return mV(\'Pro\',14,16);">Pr 14:16</a>; <a onClick="return mV(\'Pro\',17,12);">17:12</a>); indolence and improvidence (<a onClick="return mV(\'Ecc\',4,5);">Ec 4:5</a>; <a onClick="return mV(\'Pro\',21,20);">Pr 21:20</a>); silly merriment (<a onClick="return mV(\'Ecc\',7,4,5,6);">Ec 7:4-6</a>); brutishness (<a onClick="return mV(\'Pro\',26,11);">Pr 26:11</a>; compare <a onClick="return mV(\'Psa\',49,10);">Ps 49:10</a>; <a onClick="return mV(\'Psa\',92,6);">92:6</a>); it is associated with slander (<a onClick="return mV(\'Pro\',10,18);">Pr 10:18</a>), with evil (<a onClick="return mV(\'Pro\',13,19);">Pr 13:19</a>).<P>(4) cakhal, cekhel, cikhluth, also occur. These are probably from a root meaning "to be stopped up" (Cheyne), and are generally taken as denoting thickheadedness; but they are used in a stronger sense than mere foolishness (compare <a onClick="return mV(\'1Sa\',26,21);">1Sa 26:21</a>; <a onClick="return mV(\'2Sa\',24,10);">2Sa 24:10</a>, etc.). These words do not occur in Proverbs, but in <a onClick="return mV(\'Ecc\',2,12);">Ec 2:12</a>; <a onClick="return mV(\'Ecc\',7,25);">7:25</a>; cikhluth is associated with "madness" ("Wickedness is folly, and...foolishness is madness").<P>(5) pethi, "simple," is only once translated "foolish" (<a onClick="return mV(\'Pro\',9,6);">Pr 9:6</a> the King James Version).<P>(6) ba\'ar, \'brutish," is translated "foolish" (<a onClick="return mV(\'Psa\',73,22);">Ps 73:22</a> the King James Version, the Revised Version (British and American) "brutish").<P>(7) taphel, "insipid," "untempered," is translated "foolish" (<a onClick="return mV(\'Lam\',2,14);">La 2:14</a>); tiphlah, "insipidity" (<a onClick="return mV(\'Job\',1,22);">Job 1:22</a>, "foolishly," the English Revised Version, "with foolishness"; <a onClick="return mV(\'Job\',24,12);">Job 24:12</a>, "folly"; <a onClick="return mV(\'Jer\',23,13);">Jer 23:13</a>, "folly," the King James Version margin "unsavoury, or, an absurd thing").<P>(8) toholah (<a onClick="return mV(\'Job\',4,18);">Job 4:18</a>: "Behold, he putteth no trust in his servants; and his angels he chargeth with folly" (Delitzsch, "imperfection," others, "error"), the King James Version margin "nor in his angels in whom he put light").<P>II. In the Apocrypha.<P>In the continuation of the Wisdom literature in The Wisdom of Solomon and Ecclus, "fool" frequently occurs with a signification similar to that in Proverbs; in The Wisdom of Solomon we have aphron (12:24; 15:5, etc.), in Ecclesiasticus, moros (18:18; 19:11, etc.; 20:13; 21:16, etc.).<P>III. In the New Testament.<P>In the New Testament we have various words translated "fool," "foolish," "folly," etc., in the ordinary acceptation of these terms; aphron, "mindless," "witless" (<a onClick="return mV(\'Luk\',11,40);">Lu 11:40</a>; <a onClick="return mV(\'Luk\',12,20);">12:20</a>; <a onClick="return mV(\'1Cr\',15,36);">1Co 15:36</a>); aphrosune, "want of mind or wisdom" (<a onClick="return mV(\'2Cr\',11,1);">2Co 11:1</a>; <a onClick="return mV(\'Mar\',7,22);">Mr 7:22</a>); anoia, "want of understanding" (<a onClick="return mV(\'2Ti\',3,9);">2Ti 3:9</a>); moraino, "to make dull," "foolish" (<a onClick="return mV(\'Rom\',1,22);">Ro 1:22</a>; <a onClick="return mV(\'1Cr\',1,20);">1Co 1:20</a>); moros, "dull," "stupid" (<a onClick="return mV(\'Mat\',7,26);">Mt 7:26</a>; <a onClick="return mV(\'Mat\',23,17);">23:17</a>; <a onClick="return mV(\'Mat\',25,2);">25:2</a>; <a onClick="return mV(\'1Cr\',1,25,27);">1Co 1:25, 27</a>); moria, "foolishness" (<a onClick="return mV(\'1Cr\',1,18);">1Co 1:18</a> etc.); morologia, "foolish talk" (<a onClick="return mV(\'Eph\',5,4);">Eph 5:4</a>).<P>In <a onClick="return mV(\'Mat\',5,22);">Mt 5:22</a> our Lord says: "Whosoever shall say (to his brother), Thou fool (more), shall be in danger of the hell of fire (the Gehenna of fire)." Two explanations of this word are possible:<P>(1) that it is not the vocative of the Greek moros—a word which was applied by Jesus Himself to the Pharisees (<a onClick="return mV(\'Mat\',23,17,19);">Mt 23:17, 19</a>), but represents the Hebrew morah, "rebel" applied in <a onClick="return mV(\'Num\',20,10);">Nu 20:10</a> by Moses to the people, "ye rebels" (for which he was believed to be excluded from the promised land; compare <a onClick="return mV(\'Num\',20,12);">Nu 20:12</a>; hence, we have in the Revised Version, margin "or moreh, a Hebrew expression of condemnation"); or<P>(2) that, as our Lord spake in the Aramaic it is the Greek translation of a word representing the Hebrew nabhal, "vile, or worthless fellow," atheist, etc. (<a onClick="return mV(\'Psa\',14,1);">Ps 14:1</a>; <a onClick="return mV(\'Psa\',53,1);">53:1</a>).``185';
isbe[3504]='Foolery`fool\'-er-i:<P>The plural "fooleries" occurs Ecclesiasticus 22:13 King James Version: "Talk not much with a fool...and thou shalt never be defiled with his fooleries." The Greek word is entinagmos, "a striking or throwing in," "an attack," from entinasso, "to strike into," "cast at," etc. (1Macc 2:36; 2Macc 4:41; 11:11). the Revised Version (British and American) renders "Thou shalt not be defiled in his onslaught," margin "defiled: in his onslaught turn." The meaning is most probably "with what he throws out," i.e. his foolish or vile speeches, as if it were slaver.``1';
isbe[3505]='Foot`foot (reghel, qarcol (only twice in parallel passages: <a onClick="return mV(\'2Sa\',22,37);">2Sa 22:37</a> = <a onClick="return mV(\'Psa\',18,36);">Ps 18:36</a>, where it probably means ankle); pous): The dusty roads of Palestine and other eastern lands make a much greater care of the feet necessary than we are accustomed to bestow upon them. The absence of socks or stockings, the use of sandals and low shoes rather than boots and, to an even greater degree, the frequent habit of walking barefoot make it necessary to wash the feet repeatedly every day. This is always done when entering the house, especially the better upper rooms which are usually carpeted. It is a common dictate of good manners to perform this duty to a visitor, either personally or through a servant; at least water for washing has to be presented (<a onClick="return mV(\'Gen\',18,4);">Ge 18:4</a>; <a onClick="return mV(\'Luk\',7,44);">Lu 7:44</a>). This has therefore become almost synonymous with the bestowal of hospitality (<a onClick="return mV(\'1Ti\',5,10);">1Ti 5:10</a>). At an early date this service was considered one of the lowest tasks of servants (<a onClick="return mV(\'1Sa\',25,41);">1Sa 25:41</a>), probably because the youngest and least trained servants were charged with the task, or because of the idea of defilement connected with the foot. It was, for the same reason, if rendered voluntarily, a service which betokened complete devotion. Jesus taught the greatest lesson of humility by performing this humble service to His disciples (<a onClick="return mV(\'Jhn\',13,\'4-15\');">Joh 13:4-15</a>). The undoing of the latchets or leather thongs of the sandals (<a onClick="return mV(\'Mar\',1,7);">Mr 1:7</a>; <a onClick="return mV(\'Luk\',3,16);">Lu 3:16</a>; <a onClick="return mV(\'Jhn\',1,27);">Joh 1:27</a>) seems to refer to the same menial duty.<P>Often the feet and shoes were dusted on the highway, as is being done in the Orient to this day, but if it were done in an ostentatious manner in the presence of a person or a community who had refused hospitality to a stranger, it was understood in the same sense in which the cutting in two of the tablecloth was considered in the days of knighthood: it meant rejection and separation (<a onClick="return mV(\'Mat\',10,14);">Mt 10:14</a>; <a onClick="return mV(\'Act\',13,51);">Ac 13:51</a>).<P>The roads of the desert were not only dusty but rough, and the wanderer was almost sure to ruin his ill-made shoes and wound his weary feet. A special providence of God protected the children of Israel from this experience during the long journey through the wilderness. "Thy raiment waxed not old upon thee, neither did thy foot swell, these forty years" (<a onClick="return mV(\'Deu\',8,4);">De 8:4</a>; <a onClick="return mV(\'Deu\',29,5);">29:5</a>).<P>In the house shoes and sandals were never worn; even the most delicate would put on shoes only when going out (<a onClick="return mV(\'Deu\',28,56);">De 28:56</a>). The shoes were left outside of the house or in a vestibule. This was especially done in the house of God and at the time of prayer, for whenever or wherever that might be, the law was: "Put off thy shoes from off thy feet, for the place whereon thou standest is holy ground" (<a onClick="return mV(\'Exd\',3,5);">Ex 3:5</a>; <a onClick="return mV(\'Jos\',5,15);">Jos 5:15</a>; <a onClick="return mV(\'Act\',7,33);">Ac 7:33</a>). This custom still prevails among the Moslems of our day. Probably it was the idea of defilement through contact with the common ground which gave rise to its moral application by the Preacher, "Keep thy foot when thou goest to the house of God" (<a onClick="return mV(\'Ecc\',5,1);">Ec 5:1 (Hebrew 4:17)</a>).<P>Nakedness of the feet in public, especially among the wealthier classes, who used to wear shoes or sandals, was a token of mourning (<a onClick="return mV(\'Eze\',24,17);">Eze 24:17</a> and probably also <a onClick="return mV(\'Jer\',2,25);">Jer 2:25</a> and <a onClick="return mV(\'Isa\',20,\'2-4\');">Isa 20:2-4</a>). A peculiar ceremony is referred to in <a onClick="return mV(\'Deu\',25,9,10);">De 25:9-10</a>, whereby a brother-in-law, who refused to perform his duty under the Levirate law, was publicly put to shame. "And his name shall be called in Israel, The house of him that hath his shoe loosed." See also <a onClick="return mV(\'Rth\',4,7,8);">Ru 4:7-8</a>.<P>Numerous are the phrases in which the word "foot" or "feet" is used in Biblical language. "To cover the feet" (<a onClick="return mV(\'1Sa\',24,3);">1Sa 24:3</a>) is synonymous with obeying a call of Nature. "To speak with the feet" is expressive of the eloquence of abusive and obscene gesticulation among oriental people, where hands, eyes and feet are able to express much without the use of words (<a onClick="return mV(\'Pro\',6,13);">Pr 6:13</a>). "To sit at the feet," means to occupy the place of a learner (<a onClick="return mV(\'Deu\',33,3);">De 33:3</a>; <a onClick="return mV(\'Luk\',10,39);">Lu 10:39</a>; <a onClick="return mV(\'Act\',22,3);">Ac 22:3</a>). Vanquished enemies had to submit to being trodden upon by the conqueror (a ceremony often represented on Egyptian monuments; <a onClick="return mV(\'Jos\',10,24);">Jos 10:24</a>; <a onClick="return mV(\'Psa\',8,6);">Ps 8:6</a>; <a onClick="return mV(\'Psa\',110,1);">110:1</a>; compare <a onClick="return mV(\'Isa\',49,23);">Isa 49:23</a>). James warns against an undue humiliation of those who join us in the service of God, even though they be poor or mean-looking, by bidding them to take a lowly place at the feet of the richer members of the congregation (<a onClick="return mV(\'Jam\',2,3);">Jas 2:3</a>). We read of dying Jacob that "he gathered up his feet into the bed," for he had evidently used his bed as a couch, on which he had been seated while delivering his charge to his several sons (<a onClick="return mV(\'Gen\',49,33);">Ge 49:33</a>). "Foot" or "feet" is sometimes used euphemistically for the genitals (<a onClick="return mV(\'Deu\',28,57);">De 28:57</a>; <a onClick="return mV(\'Eze\',16,25);">Eze 16:25</a>). In <a onClick="return mV(\'Deu\',11,10);">De 11:10</a> an interesting reference is made to some Egyptian mode of irrigating the fields, \'the watering with the foot,\' which mode would be unnecessary in the promised land of Canaan which "drinketh water of the rain of heaven." It is, however, uncertain whether this refers to the water-wheels worked by a treadmill arrangement or whether reference is made to the many tributary channels, which, according to representations on the Egyptian monuments, intersected the gardens and fields and which could be stopped or opened by placing or removing a piece of sod at the mouth of the channel. This was usually done with the foot. Frequently we find references to the foot in expressions connected with journeyings and pilgrimages, which formed so large a part in the experiences of Israel, e.g. <a onClick="return mV(\'Psa\',91,12);">Ps 91:12</a>, "lest thou dash thy foot against a stone"; <a onClick="return mV(\'Psa\',94,18);">94:18</A>, "My foot slippeth"; <a onClick="return mV(\'Psa\',121,3);">121:3</A>, "He will not suffer thy foot to be moved," and many more. Often the reference is to the "walk," i.e. the moral conduct of life (<a onClick="return mV(\'Psa\',73,2);">Ps 73:2</a>; <a onClick="return mV(\'Job\',23,11);">Job 23:11</a>; <a onClick="return mV(\'Job\',31,5);">31:5</a>).<P>Figurative: In the metaphorical language of <a onClick="return mV(\'Isa\',52,7);">Isa 52:7</a> "the feet" are synonymous with "the coming."``106';
isbe[3506]='Footman`foot\'-man`<a href="./study/isbe/search.html?string=WAR;+WARFARE">WAR</a>`1';
isbe[3507]='Footstool`foot\'-stool (kebhes; hupopodion, "trodden on"): The 15 Scripture references to this term may be classified as literal or figurative. Of the former are the two passages: <a onClick="return mV(\'2Ch\',9,18);">2Ch 9:18</a> and <a onClick="return mV(\'Jam\',2,3);">Jas 2:3</a>. In these the footstool was a sort of step or support for the feet placed before the throne or any pretentious seat.<P>Of figurative uses, there are the following groups:<P>(1) Of the earth: <a onClick="return mV(\'Isa\',66,1);">Isa 66:1</a>; <a onClick="return mV(\'Mat\',5,35);">Mt 5:35</a>; <a onClick="return mV(\'Act\',7,49);">Ac 7:49</a>.<P>(2) Of the ark: <a onClick="return mV(\'1Ch\',28,2);">1Ch 28:2</a>.<P>(3) Of the Temple: <a onClick="return mV(\'Psa\',99,5);">Ps 99:5</a>; <a onClick="return mV(\'Psa\',132,7);">132:7</a>; <a onClick="return mV(\'Lam\',2,1);">La 2:1</a>; compare <a onClick="return mV(\'Isa\',60,13);">Isa 60:13</a>.<P>(4) Of heathen enemies subdued by the Messianic King: <a onClick="return mV(\'Psa\',110,1);">Ps 110:1</a>; <a onClick="return mV(\'Mat\',22,44);">Mt 22:44</a> the King James Version; <a onClick="return mV(\'Mar\',12,36);">Mr 12:36</a>; <a onClick="return mV(\'Luk\',20,43);">Lu 20:43</a>; <a onClick="return mV(\'Act\',2,35);">Ac 2:35</a>; <a onClick="return mV(\'Hbr\',1,13);">Heb 1:13</a>; <a onClick="return mV(\'Hbr\',10,13);">10:13</a>.<P>Thus the uses of this term are mainly metaphorical and symbolic of subjection, either to God as universal Lord or to God\'s Son as King by redemptive right. Compare <a onClick="return mV(\'1Cr\',15,\'25-27\');">1Co 15:25-27</a>, in which all things, including death, are represented as subject to Christ and placed beneath His feet.``41';
isbe[3508]='For`for (ki (conjunction), le, from \'el (preposition), and various other words. In the New Testament also the words are various, chiefly gar, kai gar, hoti (conjunctions); anti apo eis dia (accusative), epi (dative and accusative), peri (genitive), pros (genitive and accusative), huper (genitive) (prepositions)): the English Revised Version and the American Standard Revised Version give in many cases more literal or more accurate renderings than those in the King James Version.<P>In the New Testament the most important preps. from a doctrinal point of view are anti, "face to face," "over against," "instead," "on behalf of," peri, "around," "about," "concerning," huper, "over," "on behalf of." The first has been claimed as stating the substitutionary nature of Christ\'s sacrifice as contrasted with huper and peri, more frequently used of it. But, although anti in the New Testament often means "instead of," "answering to," it does not necessarily imply substitution. On the other hand, in classical Greek huper is sometimes used in that sense (see Trench, Synonyms). "Here as always the root idea of the preposition, the root idea of the case, and the context must all be considered" (Robertson, Grammar, 124). Anti is found in this connection only in <a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>, and <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>. In <a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>; <a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>, we have peri, also in <a onClick="return mV(\'Hbr\',10,6,8,18,26);">Heb 10:6, 8, 18, 26</a>; <a onClick="return mV(\'1Pe\',3,18);">1Pe 3:18</a>; <a onClick="return mV(\'1Jo\',2,2);">1Joh 2:2</a>; <a onClick="return mV(\'1Jo\',4,10);">4:10</a>. <a onClick="return mV(\'Luk\',22,19);">Lu 22:19-20</a> has huper, which is the word commonly used by Paul, as in <a onClick="return mV(\'Rom\',5,6,8);">Ro 5:6, 8</a>; <a onClick="return mV(\'Rom\',8,32);">8:32</a>; <a onClick="return mV(\'Rom\',14,15);">14:15</a>; <a onClick="return mV(\'1Cr\',15,3);">1Co 15:3</a>, etc., also by John in his Gospel, <a onClick="return mV(\'Jhn\',6,51);">6:51</a>; <a onClick="return mV(\'Jhn\',10,11);">10:11</a>, etc., and <a onClick="return mV(\'1Jo\',3,16);">1Joh 3:16</a>; also <a onClick="return mV(\'Hbr\',2,9);">Heb 2:9</a>; <a onClick="return mV(\'Hbr\',10,12);">10:12</a>; <a onClick="return mV(\'1Pe\',2,21);">1Pe 2:21</a>; <a onClick="return mV(\'1Pe\',3,18);">3:18</a>; <a onClick="return mV(\'1Pe\',4,1);">4:1</a>; in <a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a> it is peri.``185';
isbe[3509]='Foray`for\'-a (<a onClick="return mV(\'2Sa\',3,22);">2Sa 3:22</a>).`<a href="./study/isbe/search.html?string=WAR; WARFARE">WAR</a>`1';
isbe[3510]='Forbear`for-bar\' (chadhal; anechomai): In the Old Testament chadhal, "to leave off," is the word most frequently translated "forbear" (<a onClick="return mV(\'Exd\',23,5);">Ex 23:5</a>, etc.); damam, "to be silent," chasakh, "to keep back," mashakh, "to draw or stretch out," occur once each; the Revised Version (British and American) renders <a onClick="return mV(\'Eze\',24,17);">Eze 24:17</a> (damam), "Sigh, but not aloud," margin "Hebrew be silent,"; <a onClick="return mV(\'Pro\',24,11);">Pr 24:11</a> (chasakh), "See that thou hold back," margin "or forbear thou not to deliver," the King James Version "if thou forbear to deliver"; <a onClick="return mV(\'Neh\',9,30);">Ne 9:30</a> (mashakh), "bear" instead of "forbear"; \'aph literally, "breathing," the "nose," hence, from violent breathing, "anger" (\'erekh, "long," understood), and kul "to hold," are translated "forbearing" (<a onClick="return mV(\'Pro\',25,15);">Pr 25:15</a>; <a onClick="return mV(\'Jer\',20,9);">Jer 20:9</a>, respectively).<P>In the New Testament we have anechomai, "to hold self back or up," "with longsuffering, forbearing one another" (<a onClick="return mV(\'Eph\',4,2);">Eph 4:2</a>; <a onClick="return mV(\'Col\',3,13);">Col 3:13</a>); aniemi "to send back," the King James Version and the Revised Version (British and American) "forbear threatening\' (<a onClick="return mV(\'Eph\',6,9);">Eph 6:9</a>); pheidomai, "to spare," "but I forbear" (<a onClick="return mV(\'2Cr\',12,6);">2Co 12:6</a>); meergazesthai, "not to work," "to forbear working" (<a onClick="return mV(\'1Cr\',9,6);">1Co 9:6</a>); stego, "to cover," "conceal": "when I could no longer forbear" (<a onClick="return mV(\'1Th\',3,1,5);">1Th 3:1, 5</a>).``185';
isbe[3511]='Forbearance`for-bar\'-ans (anoche):<P>"Forbearance" (anoche, "a holding back") is ascribed to God (<a onClick="return mV(\'Rom\',2,4);">Ro 2:4</a>, "the riches of his goodness and forbearance and longsuffering"; <a onClick="return mV(\'Rom\',3,25);">3:25</a> the Revised Version (British and American), "the passing over of the sins done aforetime, in the forbearance of God," the King James Version "remission" (margin "passing over") of sins, that are past, through the forbearance of God"); in <a onClick="return mV(\'Phl\',4,5);">Php 4:5</a>, to epieikes is translated by the Revised Version (British and American) "forbearance," margin "gentleness"; it is a Christian grace in likeness to God. "Forbearing" (The King James Version, margin) is substituted by the Revised Version (British and American) for "patient" (anexikakos, "holding up under evil") in <a onClick="return mV(\'2Ti\',2,24);">2Ti 2:24</a>.``185';
isbe[3512]='Forbid`for-bid\' (kala; koluo):<P>Occurs very seldom in the Old Testament except as the rendering of chalilah (see below); it is once the translation of kala\', "to restrain" (<a onClick="return mV(\'Num\',11,28);">Nu 11:28</a>, "Joshua...said My lord Moses forbid them"); twice of tsawah, "to command" (<a onClick="return mV(\'Deu\',2,37);">De 2:37</a>, "and wheresoever Yahweh our God forbade us"; <a onClick="return mV(\'Deu\',4,23);">De 4:23</a>, "Yahweh thy God hath forbidden thee," literally, "commanded"); once of lo\', "not," the Revised Version (British and American) "commanded not to be done" (<a onClick="return mV(\'Lev\',5,17);">Le 5:17</a>). In the phrases, "Yahweh forbid" (<a onClick="return mV(\'1Sa\',24,6);">1Sa 24:6</a>; <a onClick="return mV(\'1Sa\',26,11);">26:11</a>; <a onClick="return mV(\'1Ki\',21,13);">1Ki 21:13</a>), "God forbid" (<a onClick="return mV(\'Gen\',44,7);">Ge 44:7</a>; <a onClick="return mV(\'Jos\',22,29);">Jos 22:29</a>; <a onClick="return mV(\'Jos\',24,16);">24:16</a>; <a onClick="return mV(\'1Sa\',12,23);">1Sa 12:23</a>; <a onClick="return mV(\'Job\',27,5);">Job 27:5</a>, etc.), "My God forbid it me" (<a onClick="return mV(\'1Ch\',11,19);">1Ch 11:19</a>), the word is chalilah, denoting profanation, or abhorrence (rendered, <a onClick="return mV(\'Gen\',18,25);">Ge 18:25</a> the King James Version, "that be far from thee"); the English Revised Version leaves the expressions unchanged; the American Standard Revised Version substitutes "far be it from me," "thee," etc., except in <a onClick="return mV(\'1Sa\',14,45);">1Sa 14:45</a>; <a onClick="return mV(\'1Sa\',20,2);">20:2</a>, where it is, "Far from it."<P>In the New Testament koluo, "to cut short," "restrain" is the word commonly translated "forbid" (<a onClick="return mV(\'Mat\',19,14);">Mt 19:14</a>, "forbid them not," etc.); in <a onClick="return mV(\'Luk\',6,29);">Lu 6:29</a>, the Revised Version (British and American) has "withhold not"; diakoluo, with a similar meaning, occurs in <a onClick="return mV(\'Mat\',3,14);">Mt 3:14</a>, "John forbade him," the Revised Version (British and American) "would have hindered him"; akolutos, "uncut off" (<a onClick="return mV(\'Act\',28,31);">Ac 28:31</a>), is translated "none forbidding him." The phrase "God forbid" (me genoito, "let it not be," <a onClick="return mV(\'Luk\',20,16);">Lu 20:16</a>; <a onClick="return mV(\'Rom\',3,4);">Ro 3:4</a>, etc.) is retained by the Revised Version (British and American), with margin "Be it not so," except in <a onClick="return mV(\'Gal\',6,14);">Ga 6:14</a>, where the text has "Far be it from me"; me genoito is one of the renderings of chalilah in Septuagint. "God forbid" also appears in Apocrypha (1Macc 2:21, the Revised Version (British and American) "Heaven forbid," margin, Greek "may he be propitious," 1Macc 9:10, the Revised Version (British and American) "Let it not be").``185';
isbe[3513]='Forces`for\'-sis (chayil):<P>(1) The word is used as a military term, equivalent to army, in <a onClick="return mV(\'2Ki\',25,23,26);">2Ki 25:23, 26</a> (where the King James Version reads "armies"); <a onClick="return mV(\'2Ch\',17,2);">2Ch 17:2</a>; <a onClick="return mV(\'Jer\',40,7);">Jer 40:7</a>, etc.<P>(2) In <a onClick="return mV(\'Isa\',60,5,11);">Isa 60:5, 11</a>, it is rendered in the Revised Version (British and American) by "wealth," and in Ob verse <a onClick="return mV(\'Oba\',1,11);">11</a>, by "substance."<P>Two other Hebrew words are also translated "forces" in the King James Version, ma\'amatstsim (<a onClick="return mV(\'Job\',36,19);">Job 36:19</a>), and ma\'oz (<a onClick="return mV(\'Dan\',11,38);">Da 11:38</a>), the latter being rendered in the Revised Version (British and American) "fortresses."`<a href="./study/isbe/search.html?string=ARMY">ARMY</a>`1';
isbe[3514]='Ford`ford (ma\'abhar (<a onClick="return mV(\'Gen\',32,22);">Ge 32:22</a>; "pass" (of Michmash), <a onClick="return mV(\'1Sa\',13,23);">1Sa 13:23</a>; "stroke" (the Revised Version, margin "passing"), <a onClick="return mV(\'Isa\',30,32);">Isa 30:32</a>); ma\'barah (<a onClick="return mV(\'Jos\',2,7);">Jos 2:7</a>; <a onClick="return mV(\'Jdg\',3,28);">Jud 3:28</a>; <a onClick="return mV(\'Jdg\',12,5,6);">12:5-6</a>; <a onClick="return mV(\'Isa\',16,2);">Isa 16:2</a> "pass" (of Michmash), <a onClick="return mV(\'1Sa\',14,4);">1Sa 14:4</a>; "passages" (the Revised Version, margin "fords"), <a onClick="return mV(\'Jer\',51,32);">Jer 51:32</a>); \'abharah (<a onClick="return mV(\'2Sa\',15,28);">2Sa 15:28</a>; <a onClick="return mV(\'2Sa\',17,16);">17:16</a>; "ferry-boat" (the Revised Version, margin "convoy"), <a onClick="return mV(\'2Sa\',19,18);">2Sa 19:18</a>); from \'abhar, "to pass over"; compare Arabic \'abar, "to pass over" and ma\'bar, "a ford"):<P>In the journeyings of the children of Israel, in addition to the miraculous passages of the Red Sea and the Jordan, they had other streams to pass over, especially the Zered (Chisa\') and the Arnon (Maujib) (<a onClick="return mV(\'Num\',21,12,13);">Nu 21:12-13</a>; <a onClick="return mV(\'Deu\',2,24);">De 2:24</a>). The Jabbok (Zarqa) is frequently referred to, particularly in connection with Jacob (<a onClick="return mV(\'Gen\',32,22);">Ge 32:22</a>). The most frequent references are to the Jordan which, in time of flood, was impassable (<a onClick="return mV(\'Jos\',3,15);">Jos 3:15</a>).<P>The lower Jordan is about 100 ft. wide, and from 5 to 12 ft. deep, so that in the absence of bridges, the places where it was possible to ford were of great importance. The passage of the Jordan is referred to in connection with Jacob (<a onClick="return mV(\'Gen\',32,10);">Ge 32:10</a>), Gideon (<a onClick="return mV(\'Jdg\',8,4);">Jud 8:4</a>), the children of Ammon (<a onClick="return mV(\'Jdg\',10,9);">Jud 10:9</a>), Abner and his men (<a onClick="return mV(\'2Sa\',2,29);">2Sa 2:29</a>), David (<a onClick="return mV(\'2Sa\',10,17);">2Sa 10:17</a>; <a onClick="return mV(\'2Sa\',17,22);">17:22</a>), Absalom (<a onClick="return mV(\'2Sa\',17,24);">2Sa 17:24</a>), and others. Jesus undoubtedly crossed the Jordan, and John is thought to have baptized at the ford of the Jordan near Jericho. The fords of the Jordan are specifically mentioned in <a onClick="return mV(\'Jos\',2,7);">Jos 2:7</a> in connection with the pursuit of the spies who were hidden in Rahab\'s house, and in <a onClick="return mV(\'2Sa\',15,28);">2Sa 15:28</a>; <a onClick="return mV(\'2Sa\',17,16);">17:16</a> in connection with the flight of David. In the last two passages we have abharah, the same word which, in the account of David\'s return (<a onClick="return mV(\'2Sa\',19,18);">2Sa 19:18</a>), is rendered "ferry-boat" (the Revised Version, margin "convoy").`<a href="./study/isbe/search.html?string=JORDAN">JORDAN</a>`37';
isbe[3515]='Forecast`for-kast\';(vb.) (chashabh):<P>To forecast is both to plan or scheme beforehand and to consider or see beforehand. It is in the first sense that it is used in <a onClick="return mV(\'Dan\',11,24,25);">Da 11:24-25</a> (the King James Version) as the translation of chashabh, "to think," "meditate," "devise," "plot," "He shall forecast his devices (The King James Version, margin "Hebrew think his thoughts") against the strongholds"; "They shall forecast devices against him," the Revised Version (British and American) "devise his devices"; compare <a onClick="return mV(\'Nah\',1,9);">Na 1:9</a>, "What do ye devise against Yahweh?" In the second sense, the word occurs in The <span class="noTag">Wisdom of Solomon 17:11</span> the Revised Version (British and American), "Wickedness...always forecasteth the worst lot" (proeilephen), margin "Most authorities read hath added" (proseilephen).``185';
isbe[3516]='Forefather`for\'-fa-ther:<P>(1) \'abh ri\'shon, "first father," "chief father," hence, "early ancestor": "turned back to the iniquities of their forefathers" (<a onClick="return mV(\'Jer\',11,10);">Jer 11:10</a>).<P>(2) progonos, "born before," "ancestor": "whom I serve from my forefathers" (<a onClick="return mV(\'2Ti\',1,3);">2Ti 1:3</a>). It is translated "parents" (including grandparents) in <a onClick="return mV(\'1Ti\',5,4);">1Ti 5:4</a>: "and to requite their parents."``1';
isbe[3517]='Forefront`for\'-frunt (panim):<P>For "forefront," "front" is now generally used, since "back-front" has gone out of use. "Forefront" is the translation of panim, "face" (<a onClick="return mV(\'2Ki\',16,14);">2Ki 16:14</a>; <a onClick="return mV(\'Eze\',40,19);">Eze 40:19</a>; <a onClick="return mV(\'Eze\',47,1);">47:1</a>); of mul panim, "over against the face" (<a onClick="return mV(\'Exd\',26,9);">Ex 26:9</a>; <a onClick="return mV(\'Lev\',8,9);">Le 8:9</a>, "And he put the mitre upon his head; also upon the mitre even upon his forefront, did he put the golden plate"; for "upon his forefront" the Revised Version (British and American) has "in front; <a onClick="return mV(\'2Sa\',11,15);">2Sa 11:15</a>, "in the forefront of the hottest battle"); of ro\'sh, "head" (<a onClick="return mV(\'2Ch\',20,27);">2Ch 20:27</a>); of shen, "tooth" (<a onClick="return mV(\'1Sa\',14,5);">1Sa 14:5</a>, "The forefront (The King James Version, margin "Hebrew tooth") of the one was situated northward over against Michmash," the Revised Version (British and American) "The one crag rose up on the north in front of Michmash"); in 1Macc 4:57 margin it is the translation of prosopon, "face": "They decked the forefront of the temple with crowns of gold."<P>The Revised Version (British and American) has "forefront" for "face" (<a onClick="return mV(\'Eze\',40,15);">Eze 40:15</a>), "in the forefront of" for "over against" (<a onClick="return mV(\'Jos\',22,11);">Jos 22:11</a>).``185';
isbe[3518]='Forego`for-go\'.`<a href="./study/isbe/search.html?string=FORGO">FORGO</a>`1';
isbe[3519]='Forehead`for\'-ed (metsach; metopon):<P>(1) In a literal sense the word is used frequently in the Scriptures. Aaron and after him every high priest was to wear on the forehead the golden frontlet having the engraved motto, "Holy to Yahweh" (<a onClick="return mV(\'Exd\',28,36,38);">Ex 28:36, 38</a>). The condition of the forehead was an important criterion in the diagnosis of leprosy by the priest (<a onClick="return mV(\'Lev\',13,42,43);">Le 13:42-43</a>; <a onClick="return mV(\'2Ch\',26,20);">2Ch 26:20</a>). It was in the forehead that brave young David smote Goliath with the stone from his sling (<a onClick="return mV(\'1Sa\',17,49);">1Sa 17:49</a>). The faulty translation of the King James Version in <a onClick="return mV(\'Eze\',16,12);">Eze 16:12</a> has been corrected in the Revised Version (British and American), reference being had in the passage to a nose-ring, not to an ornament of the forehead. While the cutting or tattooing of the body was strictly forbidden to the Israelite on account of the heathen associations of the custom (<a onClick="return mV(\'Lev\',19,28);">Le 19:28</a>), we find frequent mention made of markings on the forehead, which were especially used to designate slaves (see Philo, De Monarchia, I) or devotees of a godhead (Lucian, De Syria Dea, 59). In 3Macc 2:29 we read that Ptolemy IV Philopator branded some Jews with the sign of an ivy leaf, marking them as devotees of Bacchus-Dionysos. Possibly we may compare herewith the translation of <a onClick="return mV(\'Isa\',44,5);">Isa 44:5</a> (Revised Version margin): "And another shall write on his hand, Unto Yahweh" (or Yahweh\'s slave). Very clear is the passage <a onClick="return mV(\'Eze\',9,4,6);">Eze 9:4, 6</a> (and perhaps <a onClick="return mV(\'Job\',31,35);">Job 31:35</a>), where the word used for "mark" is taw, the name of the last letter of the Hebrew alphabet which in its earliest form has the shape of an upright plus sign (Baal Lebanon Inscr; 11th century BC) or of a lying (St Andrew\'s) cross X (Moabite Inscr, 9th century BC), the simplest sign in the old Israelite alphabet, and at the same time the character which in the Greek alphabet represents the X, the initial of Christ. In the New Testament we find a clear echo of the above-mentioned Old Testament passage, the marking of the foreheads of the righteous (<a onClick="return mV(\'Rev\',7,3);">Re 7:3</a>; <a onClick="return mV(\'Rev\',9,4);">9:4</a>; <a onClick="return mV(\'Rev\',14,1);">14:1</a>; <a onClick="return mV(\'Rev\',22,4);">22:4</a>). The godless followers of the beast are marked on the (right) hand and on the forehead (<a onClick="return mV(\'Rev\',13,16);">Re 13:16</a>; <a onClick="return mV(\'Rev\',14,9);">14:9</a>; <a onClick="return mV(\'Rev\',20,4);">20:4</a>), and the apocalyptic woman dressed in scarlet and purple has her name written on her forehead (<a onClick="return mV(\'Rev\',17,5);">Re 17:5</a>).<P>(2) In a metaphorical sense the expression, "a harlot\'s forehead," is used (<a onClick="return mV(\'Jer\',3,3);">Jer 3:3</a>) to describe the shameless apostasy and faithlessness of Israel. Ezekiel speaks of the stiff-necked obstinacy and the persistent unwillingness of Israel to hear the message of Yahweh: "All the house of Israel are of a hard forehead and of a stiff heart" (<a onClick="return mV(\'Jer\',3,7);">Jer 3:7</a>), and God makes his prophet\'s "forehead hard...as an adamant harder than flint," whereby an unflinching loyalty to God and a complete disregard of opposition is meant (<a onClick="return mV(\'Jer\',3,8,9);">Jer 3:8-9</a>). Compare the phrase: "to harden the face," under the word <a href="./study/isbe/search.html?string=FACE">FACE</a>.``106';
isbe[3520]='Foreign Divinities`for\'-in di-vin\'-i-tiz (<a onClick="return mV(\'Act\',17,18);">Ac 17:18</a> margin).`<a href="./study/isbe/search.html?string=GOD,+STRANGE">GOD, STRANGE</a>`1';
isbe[3521]='Foreigner`for\'-in-er" The translation of nokhri, "unknown," "foreign," frequently rendered "stranger" (<a onClick="return mV(\'Deu\',15,3);">De 15:3</a>; <a onClick="return mV(\'Oba\',1,11);">Ob 1:11</a>); of toshabh, "a settler," "an alien resident" (<a onClick="return mV(\'Exd\',12,45);">Ex 12:45</a>; the Revised Version (British and American) "sojourner"; compare <a onClick="return mV(\'Lev\',25,47);">Le 25:47</a>; <a onClick="return mV(\'Psa\',39,12);">Ps 39:12</a>); of paroikos, "dwelling near," "sojourner" (<a onClick="return mV(\'Eph\',2,19);">Eph 2:19</a>, the Revised Version (British and American) sojourners").<P>Revised Version has "foreigner" for "stranger" (<a onClick="return mV(\'Deu\',17,15);">De 17:15</a>; <a onClick="return mV(\'Deu\',23,20);">23:20</a>; <a onClick="return mV(\'Deu\',29,22);">29:22</a>; <a onClick="return mV(\'Rth\',2,10);">Ru 2:10</a>; <a onClick="return mV(\'2Sa\',15,19);">2Sa 15:19</a>), for "alien" (<a onClick="return mV(\'Deu\',14,21);">De 14:21</a>); "the hand of a foreigner" for "a stranger\'s hand" (<a onClick="return mV(\'Lev\',22,25);">Le 22:25</a>).`<a href="./study/isbe/search.html?string=ALIEN">ALIEN</a>; <a href="./study/isbe/search.html?string=STRANGER+AND+SOJOURNER">STRANGER AND SOJOURNER</a>`1';
isbe[3522]='Foreknow; Foreknowledge`for-no\', for-nol\'-ej:<P>1. Meaning of the Term<P>2. Foreknowledge as Prescience<P>3. Foreknowledge Based on Foreordination<P>4. Foreknowledge as Equivalent to Foreordination<P>LITERATURE<HR /><P>1. Meaning of the Term:<P>The word "foreknowledge" has two meanings. It is a term used in theology to denote the prescience or foresight of God, that is, His knowledge of the entire course of events which are future from the human point of view; and it is also used in the King James Version and the Revised Version (British and American) to translate the Greek words proginoskein and prognosis in the New Testament, in which instances the word "fore-knowledge" approaches closely the idea of fore-ordination.<P>2. Fore-knowledge as Prescience:<P>In the sense of prescience foreknowledge is an aspect of God\'s omniscience (see <a href="./study/isbe/search.html?string=OMNISCIENCE">OMNISCIENCE</a>). God\'s knowledge, according to the Scripture, is perfect, that is, it is omniscience. It is true that the Scripture makes use of anthropomorphic forms of expression as regards the way in which God obtains knowledge (<a onClick="return mV(\'Gen\',3,8);">Ge 3:8</a>), and sometimes even represents Him as if He did not know certain things (<a onClick="return mV(\'Gen\',11,5);">Ge 11:5</a>; <a onClick="return mV(\'Gen\',18,21);">18:21</a>); nevertheless the constant representation of the Scripture is that God knows everything. This perfect knowledge of God, moreover, is not merely a knowledge which is practically unlimited for all religious purposes, but is omniscience in the strictest sense of the term. In the historical books of the Old Testament the omniscience of God is a constant underlying presupposition when it is said that God watches men\'s actions, knows their acts and words, and discloses to them the future; while in the Psalms, Prophets and Wisdom literature, this Divine attribute becomes an object of reflection, and finds doctrinal expression. It cannot, however, be said that this attribute of God appears only late in the history of special revelation; it is a characteristic of the Biblical idea of God from the very first, and it is only its didactic expression which comes out with especial clearness in the later books. God\'s knowledge, then, is represented as perfect. Since He is free from all limits of space, His omniscience is frequently connected with His omnipresence. This is the thought which underlies the anthropomorphic expressions where God is represented as seeing, beholding and having eyes. God\'s eyes go to and fro throughout the whole earth (<a onClick="return mV(\'2Ch\',16,9);">2Ch 16:9</a>), and are every place beholding the evil and the good (<a onClick="return mV(\'Pro\',15,3);">Pr 15:3</a>). Even Sheol is naked and open to God\'s sight (<a onClick="return mV(\'Pro\',15,11);">Pr 15:11</a>; <a onClick="return mV(\'Job\',26,6);">Job 26:6</a>). The night and darkness are light to Him, and darkness and light for God are both alike (<a onClick="return mV(\'Psa\',139,12);">Ps 139:12</a>). All animals and fowls are His, and so are known by Him (<a onClick="return mV(\'Psa\',50,11);">Ps 50:11</a>), and as their Creator God knows all the hosts of the heavenly bodies (<a onClick="return mV(\'Psa\',147,4);">Ps 147:4</a>; <a onClick="return mV(\'Isa\',40,26);">Isa 40:26</a>). He knows also the heart of man and its thoughts (<a onClick="return mV(\'1Sa\',16,7);">1Sa 16:7</a>; <a onClick="return mV(\'1Ki\',8,39);">1Ki 8:39</a>; <a onClick="return mV(\'Psa\',7,9);">Ps 7:9 (Hebrew 10)</a>; <a onClick="return mV(\'Psa\',94,11);">Ps 94:11</a>; <a onClick="return mV(\'Psa\',139,2);">139:2</a>; <a onClick="return mV(\'Jer\',11,20);">Jer 11:20</a>; <a onClick="return mV(\'Jer\',17,9,10);">17:9-10</a>; <a onClick="return mV(\'Jer\',20,12);">20:12</a>; <a onClick="return mV(\'Eze\',11,5);">Eze 11:5</a>). Furthermore, God knows man entirely in all his ways (<a onClick="return mV(\'Psa\',139,\'1-5\');">Ps 139:1-5</a>; <a onClick="return mV(\'Pro\',5,21);">Pr 5:21</a>). He looks from heaven and sees all men (<a onClick="return mV(\'Psa\',11,4);">Ps 11:4</a>; <a onClick="return mV(\'Psa\',14,2);">14:2</a>; <a onClick="return mV(\'Psa\',33,13,14,15);">33:13-15</a>). Evil and sin are also known to God (<a onClick="return mV(\'Gen\',3,11);">Ge 3:11</a>; <a onClick="return mV(\'Gen\',6,5,9,13);">6:5, 9, 13</a>; <a onClick="return mV(\'2Sa\',7,20);">2Sa 7:20</a>; <a onClick="return mV(\'Psa\',69,5);">Ps 69:5 (Hebrew 6)</a>; <a onClick="return mV(\'Jer\',16,17);">Jer 16:17</a>; <a onClick="return mV(\'Jer\',18,23);">18:23</a>). In a word, God knows with absolute accuracy all about man (<a onClick="return mV(\'Job\',11,11);">Job 11:11</a>; <a onClick="return mV(\'Job\',34,21);">34:21</a>; <a onClick="return mV(\'Psa\',33,15);">Ps 33:15</a>; <a onClick="return mV(\'Pro\',5,21);">Pr 5:21</a>; <a onClick="return mV(\'Hsa\',5,3);">Ho 5:3</a>; <a onClick="return mV(\'Jer\',11,20);">Jer 11:20</a>; <a onClick="return mV(\'Jer\',12,3);">12:3</a>; <a onClick="return mV(\'Jer\',17,9);">17:9</a>f; <a onClick="return mV(\'Jer\',18,23);">18:23</A>). This perfect knowledge finds its classic expression in <a onClick="return mV(\'Psa\',139,\'1-\');">Ps 139</a>.<P>God is also, according to the Old Testament, free from all limitations of time, so that His consciousness is not in the midst of the stream of the succeeding moments of time, as is the case with the human consciousness. God is not only without beginning or end of days, but with Him a thousand years are as one day. Hence, God knows in one eternal intuition that which for the human consciousness is past, present and future. In a strict sense, therefore, there can be no foreknowledge or prescience with God, and the distinction in God\'s knowledge made by theologians, as knowledge of reminiscence, vision and prescience, is after all an anthropomorphism. Nevertheless this is the only way in which we can conceive of the Divine omniscience in its relation to time, and consequently the Scripture represents the matter as if God\'s knowledge of future events were a foreknowledge or prescience, and God is represented as knowing the past, present and future.<P>It is God\'s knowledge of events which from the human point of view are future that constitutes His foreknowledge in the sense of prescience. God is represented as having a knowledge of the entire course of events before they take place. Such a knowledge belongs to the Scriptural idea of God from the very outset of special revelation. He knows beforehand what Abraham will do, and what will happen to him; He knows beforehand that Pharaoh\'s heart will be hardened, and that Moses will deliver Israel (<a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a>ff; <a onClick="return mV(\'Exd\',3,19);">Ex 3:19</a>; <a onClick="return mV(\'Exd\',7,4);">7:4</a>; <a onClick="return mV(\'Exd\',11,1);">11:1</a>ff). The entire history of the patriarchal period of revelation exhibits plainly the foreknowledge of God in this sense. In prophecy this aspect of the Divine knowledge is made the subject of explicit assertion, and its religious significance is brought out. Nothing future is hidden from Yahweh (<a onClick="return mV(\'Isa\',41,22);">Isa 41:22</a>; <a onClick="return mV(\'Isa\',42,9);">42:9</a>; <a onClick="return mV(\'Isa\',43,\'9-13\');">43:9-13</a>; <a onClick="return mV(\'Isa\',44,\'6-8\');">44:6-8</a>; <a onClick="return mV(\'Isa\',46,10);">46:10</a>; <a onClick="return mV(\'Dan\',2,22);">Da 2:22</a>; <a onClick="return mV(\'Amo\',3,7);">Am 3:7</a>), and this foreknowledge embraces the entire course of man\'s life (<a onClick="return mV(\'Psa\',31,15);">Ps 31:15 (Hebrew 16)</a>; <a onClick="return mV(\'Psa\',39,5);">Ps 39:5 (Hebrew 6)</a>; <a onClick="return mV(\'Psa\',139,\'4-6\',16);">Ps 139:4-6, 16</a>; <a onClick="return mV(\'Job\',14,5);">Job 14:5</a>). These passages from Isaiah show that it is from the occurrence of events in accordance with Yahweh\'s prediction that the Prophet will prove his foreknowledge; and that in contrast with the worshippers of idols which are taken by surprise, Israel is warned of the future by the omniscient Yahweh.<P>In the New Testament likewise, God\'s omniscience is explicitly affirmed. Jesus taught that God knows the hidden secrets of man\'s heart (<a onClick="return mV(\'Luk\',16,15);">Lu 16:15</a>); and this is also the teaching of the apostles (<a onClick="return mV(\'Act\',1,24);">Ac 1:24</a>; <a onClick="return mV(\'Act\',15,8);">15:8</a>; <a onClick="return mV(\'1Cr\',2,10);">1Co 2:10</a>; <a onClick="return mV(\'1Cr\',3,20);">3:20</a>; <a onClick="return mV(\'1Th\',2,4);">1Th 2:4</a>; <a onClick="return mV(\'Rev\',2,23);">Re 2:23</a>). In a word, according to the author of the Epistle to the He, everything is open to God, so that He is literally omniscient (<a onClick="return mV(\'Hbr\',4,13);">Heb 4:13</a>). And as in the Old Testament, so also in the New Testament, foreknowledge in the sense of prescience is ascribed to God. Jesus asserts a foreknowledge by God of that which is hidden from the Son (<a onClick="return mV(\'Mar\',13,32);">Mr 13:32</a>), and James asserts that all God\'s works are foreknown by Him (<a onClick="return mV(\'Act\',15,18);">Ac 15:18</a>). Moreover, the many references in the New Testament to the fulfillment of prophecy all imply that the New Testament writers ascribed foreknowledge, in this sense of foresight, to God.<P>Denials of the Divine foreknowledge, in this sense of prescience, have been occasioned, not by exegetical considerations, but by the supposed conflict of this truth with human freedom. It was supposed that in order to be free, an event must be uncertain and contingent as regards the fact of its futurition, and that too in the most absolute sense, that is, from the Divine as well as the human point of view. Hence, the Socinians and some Arminians denied the foreknowledge of God. It was supposed either that God voluntarily determines
