not to foresee the free volitions of man, or else that since God\'s omniscience is simply the knowledge of all that is knowable, it does not embrace the free acts of man which are by their nature uncertain and so unknowable. And upon this view of freedom, this denial of God\'s foreknowledge was logically necessary. If the certainty of events with respect to the fact of their futurition is inconsistent with freedom, then human freedom does conflict with God\'s foreknowledge, since God cannot know future events as certainly future unless they actually are so. Since, therefore, the Divine foreknowledge is quite as inconsistent with this view of freedom as is the Divine foreordination, the view of those who regard God as a mere onlooker on the course of future events which are supposed to be entirely independent of His purpose and control, does not help matters in the least. If God foreknows future events as certain, then they must be certain, and if so, then the certainty of their actually occurring must depend either upon God\'s decree and providential control, or else upon a fate independent of God. It was to escape these supposed difficulties that the doctrine known as scientia media was propounded. It was supposed that God has a knowledge of events as conditionally future, that is, events neither merely possible nor certainly future, but suspended upon conditions undetermined by God. But this hypothesis is of no help and is not true. Besides being contrary to the Scripture in its idea that many events lie outside the decree of God, and that God must wait upon man in His government of the world, there is really no such class of events as this theory asserts. If God foreknows that the conditions on which they are suspended will be fulfilled, then these events belong to the class of events which are certainly future; whereas if God does not know whether or not the conditions will be fulfilled by man, then His foreknowledge is denied, and these events in question belong to the class of those merely possible. Nor do the Scripture passages to which appeal is made, such as <a onClick="return mV(\'Gen\',11,6);">Ge 11:6</a>; <a onClick="return mV(\'Exd\',3,19);">Ex 3:19</a>; <a onClick="return mV(\'Deu\',7,3,4);">De 7:3-4</a>; <a onClick="return mV(\'1Sa\',23,\'10-13\');">1Sa 23:10-13</a>; <a onClick="return mV(\'2Sa\',12,8);">2Sa 12:8</a>, etc., afford a basis for this doctrine. The Scripture of course recognizes that God has put all things in relations of mutual dependence, and speaks of what can or cannot happen under such and such conditions; but none of these passages assert or imply that the events are suspended upon conditions which are either unknown or undetermined by God.<P>3. Foreknowledge Based on Foreordination:<P>God\'s foreknowledge, according to the Scripture teaching, is based upon His plan or eternal purpose, which embraces everything that comes to pass. God is never represented as a mere onlooker seeing the future course of events, but having no part in it. That God has such a plan is the teaching of the entire Scripture. It is implied in the Old Testament conception of God as an Omnipotent Person governing all things in accordance with His will. This idea is involved in the names of God in the patriarchal revelation, \'El, \'Elohim, \'El Shadday, and in the prophetic name Yahweh of Hosts. This latter name teaches not only God\'s infinite power and glory, but also makes Him known as interposing in accordance with His sovereign will and purpose in the affairs of this world, and as having also the spiritual powers of the heavenly world at His disposal for the execution of His eternal purpose. Hence, this idea of God comes to signify the omnipotent Ruler of the universe (<a onClick="return mV(\'Psa\',24,10);">Ps 24:10</a>; <a onClick="return mV(\'Isa\',6,3);">Isa 6:3</a>; <a onClick="return mV(\'Isa\',51,5);">51:5</a>; <a onClick="return mV(\'Isa\',54,5);">54:5</a>; <a onClick="return mV(\'Jer\',10,16);">Jer 10:16</a>; <a onClick="return mV(\'Amo\',9,5);">Am 9:5</a>; compare Oehler, Theol. of the Old Testament, English translation, II, 280).<P>Not only in this conception of God as omnipotent and sovereign Ruler is the thought of His eternal plan evolved; it is explicitly asserted throughout the whole Old Testament. The purpose of God as determining human history in the Book of Genesis lies clearly upon the surface of the narrative, as, for example, in the history of Abraham and of Joseph. And where there is no abstract statement of this truth, it is evident that the writer regards every event as but the unfolding of the purpose of God. In the Psalms, Prophets, and Wisdom literature, this truth finds explicit and reiterated assertion. Yahweh has an eternal purpose (<a onClick="return mV(\'Psa\',33,11);">Ps 33:11</a>), and this purpose will certainly come to pass (<a onClick="return mV(\'Isa\',14,27);">Isa 14:27</a>; <a onClick="return mV(\'Isa\',43,13);">43:13</a>). This purpose includes all events and renders certain their occurrence (<a onClick="return mV(\'Isa\',14,24);">Isa 14:24</a>; <a onClick="return mV(\'Isa\',40,10);">40:10</a>; <a onClick="return mV(\'Isa\',46,9,10);">46:9-10</a>; <a onClick="return mV(\'Zec\',1,6);">Zec 1:6</a>). In the Wisdom literature the ethical character of this plan is dwelt upon, as well as its all-embracing character, and the certainty of its fulfillment (<a onClick="return mV(\'Pro\',16,4,33);">Pr 16:4, 33</a>; <a onClick="return mV(\'Pro\',19,21);">19:21</a>; <a onClick="return mV(\'Pro\',20,24);">20:24</a>; <a onClick="return mV(\'Job\',28,23);">Job 28:23</a>). The providential control wherewith Yahweh executes this plan includes the heart of man (<a onClick="return mV(\'Pro\',21,1);">Pr 21:1</a>).<P>The New Testament likewise regards all history as but the unfolding of God\'s eternal purpose (<a onClick="return mV(\'Act\',4,28);">Ac 4:28</a>), which includes man\'s salvation (<a onClick="return mV(\'Eph\',1,4,5);">Eph 1:4-5</a>; <a onClick="return mV(\'2Ti\',1,9);">2Ti 1:9</a>), the provision of Christ as Saviour (<a onClick="return mV(\'1Pe\',1,20);">1Pe 1:20</a>), and the good works of the Christian (<a onClick="return mV(\'Eph\',2,10);">Eph 2:10</a>).<P>See <a href="./study/isbe/search.html?string=PREDESTINATION">PREDESTINATION</a>.<P>Now while the writers of the Old Testament and the New Testament do not write in an abstract or philosophical manner nor enter into metaphysical explanations of the relation between God\'s foreknowledge and foreordination, it is perfectly evident that they had a clear conception upon this subject. Although anthropomorphisms are used in regard to the manner in which God knows, He is never conceived as if He obtained His knowledge of the future as a mere onlooker gazing down the course of events in time. The idea that the omnipotent Creator and sovereign Ruler of the universe should govern the world and form His plan as contingent and dependent upon a mere foresight of events outside His purpose and control is not only contrary to the entire Scriptural idea of God\'s sovereignty and omnipotence, but is also contrary to the Scriptural idea of God\'s foreknowledge which is always conceived as dependent upon His sovereign purpose. According to the Scriptural conception, God foreknows because He has foreordained all things, and because in His providence He will certainly bring all to pass. His foreknowledge is not a dependent one which must wait upon events, but is simply the knowledge which God has of His own eternal purpose. Dillmann has called this "a productive foreknowledge" (Handbuch d. attest. Theol., 251). This is not exactly correct. The Old Testament does not conceive God\'s foreknowledge as "producing" or causing events. But when Dillmann says that in the Old Testament there is no hint of an "idle foreknowledge" on God\'s part, he is giving expression to the truth that in the Old Testament God\'s foreknowledge is based upon His foreordination and providential control of all things. The Divine foreknowledge, therefore, depends upon the Divine purpose which has determined the world plan (<a onClick="return mV(\'Amo\',3,7);">Am 3:7</a>), and all its details (<a onClick="return mV(\'Job\',28,26,27);">Job 28:26-27</a>). Before man is born God knows him and chooses him for his work (<a onClick="return mV(\'Jer\',1,5);">Jer 1:5</a>; <a onClick="return mV(\'Job\',23,13,14);">Job 23:13-14</a>), and God\'s thorough knowledge of man in <a onClick="return mV(\'Psa\',139,\'1-\');">Ps 139</a> is made to rest upon the fact that God has determined man\'s lot beforehand (<a onClick="return mV(\'Psa\',139,\'14-16\');">Ps 139:14-16</a>).<P>The same thing is true of the New Testament teaching on this subject. The Divine foreknowledge is simply God\'s knowledge of His own eternal purpose. This is especially clear in those cases where God\'s eternal purpose of redemption through Christ is represented as a mystery which is known by God and which can be known by man only when it pleases God to reveal it (<a onClick="return mV(\'Eph\',1,9);">Eph 1:9</a>; <a onClick="return mV(\'Eph\',3,4,9);">3:4, 9</a>).<P>4. Foreknowledge as Equivalent to Foreordination:<P>While, therefore, the foreknowledge of God in the sense of prescience is asserted in the New Testament, this is not the meaning of the term when used to translate the Greek words proginoskein and prognosis. These words which are translated in the King James Version and the Revised Version (British and American) by the word "foreknowledge," and once by the word "foreordain" (<a onClick="return mV(\'1Pe\',1,20);">1Pe 1:20</a> the King James Version), mean much more than mere intellectual foresight or prescience. Both the verb and the noun approach the idea of foreordination and are closely connected with that idea in the passages where these words occur. Thus, in Peter\'s speeches in Acts the predestination which finds expression in <a onClick="return mV(\'1Pe\',4,18);">1Pe 4:18</a> is practically identified with the term prognosis in <a onClick="return mV(\'1Pe\',2,23);">2:23</a>. Everything which happened to Jesus took place in accordance with "the determinate counsel and foreknowledge of God," so that nothing happened except that which God had foreordained. In this verse the term foreknowledge is an expansion of the idea of God\'s "counsel" or plan, regarding it as an intelligent prearrangement, the idea of foreknowledge being assimilated to that of foreordination. The same idea is found in <a onClick="return mV(\'1Pe\',1,20);">1Pe 1:20</a>. Here the apostle speaks of Christ as a lamb "foreordained" by God before the foundation of the world. The Greek verb proegnosmenou, meaning literally, "foreknown" (as in the Revised Version (British and American)) is translated "foreordained" in the King James Version. It is evidently God\'s foreordination of Jesus as Saviour which Peter has in mind. Also in <a onClick="return mV(\'1Pe\',1,2);">1Pe 1:2</a> those to whom the apostle is writing are characterized as "elect according to the foreknowledge (prognosis) of God," where the election is based on the "foreknowledge." By the prognosis or foreknowledge, however, far more is meant than prescience. It has the idea of a purpose which determines the course of the Divine procedure. If it meant simply prevision of faith or love or any quality in the objects of the election, Peter would not only flatly contradict Paul (<a onClick="return mV(\'Rom\',9,11);">Ro 9:11</a>; <a onClick="return mV(\'Eph\',1,3,4);">Eph 1:3-4</a>; <a onClick="return mV(\'2Ti\',1,9);">2Ti 1:9</a>); but also such a rendering would conflict with the context of this passage, because the objects of election are chosen "unto obedience and sprinkling of the blood of...Christ," so that their new obedience and relation to Christ are determined by their election by God, which election springs from a "foreknowledge" which therefore cannot mean a mere prescience.<P>In view of the fact that there was a classical use of the simple verb ginoskein in the sense of "resolve," and more especially of the fact that this word is used in the New Testament to denote an affectionate or loving regard or approbation in accordance with a common use of the Hebrew yadha\' (<a onClick="return mV(\'Mat\',7,23);">Mt 7:23</a>; <a onClick="return mV(\'1Cr\',8,3);">1Co 8:3</a>; <a onClick="return mV(\'Gal\',4,9);">Ga 4:9</a>; <a onClick="return mV(\'2Ti\',2,19);">2Ti 2:19</a>), there is nothing arbitrary in giving it this sense when compounded with the preposition pro when the context clearly demands it, as it does in the above passage (compare Johnstone, Commentary on Peter in the place cited.: per contra Meyer on passages in Acts and Romans). The word prognosis is, however, discriminated from "predestination." It is that loving regard in God from which the Divine election springs, which election Peter evidently regarded as sovereign, since sanctification is only a confirmation of it (<a onClick="return mV(\'2Pe\',1,10);">2Pe 1:10</a>), and stumbling and disobedience are referred to \'appointment to unbelief\' (<a onClick="return mV(\'1Pe\',2,8);">1Pe 2:8</a>). Here, then, we have a pregnant use of foreknowledge in which it is assimilated to the idea of purpose, and denotes a sovereign and loving regard.<P>The word prognosis is also found in this sense in the writings of Paul, in cases where it is manifestly impossible to regard it as a mere intellectual foresight, not only because of Paul\'s doctrine that election is absolutely sovereign (<a onClick="return mV(\'Eph\',1,3,4);">Eph 1:3-4</a>; <a onClick="return mV(\'Rom\',9,11);">Ro 9:11</a>; <a onClick="return mV(\'2Ti\',1,9);">2Ti 1:9</a>), but also because of the contexts in which the term occurs.<P>In <a onClick="return mV(\'Rom\',8,29,30);">Ro 8:29-30</a> the word "foreknow" occurs in immediate connection with God\'s predestination of the objects of salvation. Those whom God foreknew, He also did predestinate to be conformed to the image of His son. Now the foreknowledge in this case cannot mean a mere prescience or foresight of faith (Meyer, Godet) or love (Weiss) in the subjects of salvation, which faith or love is supposed to determine the Divine predestination. This would not only contradict Paul\'s view of the absolutely sovereign and gracious character of election, but is diametrically opposed to the context of this passage. These verses form a part of the encouragement which Paul offers his readers for their troubles, including their own inward weakness. The apostle tells them that they may be sure that all things work together for good to them that love God; and these are defined as being those whom God has called in accordance with His purpose. Their love to God is evidently their love as Christians, and is the result of a calling which itself follows from an eternal purpose, so that their Christian love is simply the means by which they may know that they have been the subjects of this calll. They have not come within the sphere of God\'s love by their own choice, but have been "called" into this relationship by God, and that in accordance with an eternal purpose on His part.<P>What follows, therefore, must have as its motive simply to unfold and ground this assurance of salvation by tracing it all back to the "foreknowledge" of God. To regard this foreknowledge as contingent upon anything in man would thus be in flat contradiction with the entire context of the passage as well as its motive. The word "foreknowledge" here evidently has the pregnant sense which we found it to have in Peter. Hence, those whom God predestinates, calls, justifies and glorifies are just those whom He has looked upon with His sovereign love. To assign any other meaning to "foreknowledge" here would be out of accord with the usage of the term elsewhere in the New Testament when it is put in connection with predestination, and would contradict the purpose for which Paul introduces the passage, that is, to assure his readers that their ultimate salvation depends, not on their weakness, but on God\'s sovereign love and grace and power.<P>It is equally impossible to give the word prognosis any other sense in the other passage where Paul uses it. In <a onClick="return mV(\'Rom\',11,2);">Ro 11:2</a>, speaking of the Jews, Paul says that "God did not cast off his people which he foreknew." It is quite impossible to regard this as meaning that God had a foresight or mere prevision of some quality in Israel which determined His choice of them, not only because it is the teaching of the entire Scripture that God\'s choice of Israel was sovereign and gracious, and not only because of the actual history of Israel, but also because of the context. Paul says that it would be absurd to suppose that God had cast off His people because He foreknew them, His foreknowledge of them being adduced as a ground for His not casting them off. Hence, the argument would have no force if anything in Israel, foreseen by God, were supposed to ground an assurance that He had not cast them off, because the context is full of the hardness of heart and unbelief of Israel. The foreknowledge here has evidently the same sense as in the former passage.<P>Foreknowledge, therefore, in the New Testament is more than mere prescience. It is practically identical with the Divine decree in two instances, and in the other places where the term occurs it denotes the sovereign loving regard out of which springs God\'s predestination or election of men to salvation.<P>See <a href="./study/isbe/search.html?string=OMNISCIENCE">OMNISCIENCE</a>; <a href="./study/isbe/search.html?string=PREDESTINATION">PREDESTINATION</A>.<P>LITERATURE.<P>Besides the Commentaries on the appropriate passages, especially those on Isaiah, see Dillmann, Handbuch d. alttest. Theol., 249-52; H. Schultz, Alttest. Theol., 417, 421; H Cremer, Die christliche Lehre volume den Eigenschaften Gottes, Beltrage zur Forderung christl. Theol., I, 93-101; Stewart, article "Foreknowledge," HDB, II, 51-53. Considerable Biblical as well as historical material will be found in works on systematic theology, such as Bohl, Dogmatik, 54-59; Bavinck, Gereformeerde Dogmatik2 I, 182-95. For a history of the discussion of the problem of foreknowledge and freedom see J. Muller, Die christl. Lehre volume der Sunde, III,2,2.<P>See also literature under <a href="./study/isbe/search.html?string=OMNISCIENCE">OMNISCIENCE</A>.<P>On the relation of foreknowledge and foreordination, and the meaning of prognosis, see K. Muller, Die gottliche Zuvorsehung und Erwahlung, 37f; 81f; Pfleiderer, Paulinismus2, 268f; Urchristentum, 289; Gcnnrich, Studien zur Paulinischen Heilsordnung, S. K.,1898,377f; and on the meaning of proginoskein in <span class="noTag">Ro 8:29</SPAN> see especially pp. 382-95; also Cremer, Bibl.-theol. Worterb., 263-65; Beyschlag, Neutest. Theol., II, 109; B. Weiss, Bio. Theol. of New Testament, English translation, I, 205f; II, 6; H. Holtzmann, Lehrbuch d. neutest. Theol., II, 165f; B.B. Warfield, article "Predestination," HDB, IV, 52-57. See also discussions of the meaning of proginoskein in the Commentaries on 1 Peter and Romans, especially Fritzsche on <span class="noTag">Ro 8:29</SPAN>, and Johnstone on <span class="noTag">1Pe 1:2</SPAN>.`<a href="./study/isbe/search.html?string=PREDESTINATION">PREDESTINATION</a>`72';
isbe[3523]='Foreordain; Forordination`for-or-dan\', for-or-di-na\'-shun:<P>The word "foreordain" is uniformly used in the Revised Version (British and American) to render the Greek proorizo, in the passages where this verb occurs (<a onClick="return mV(\'Act\',4,28);">Ac 4:28</a>; <a onClick="return mV(\'Rom\',8,29,30);">Ro 8:29-30</a>; <a onClick="return mV(\'1Cr\',2,7);">1Co 2:7</a>; <a onClick="return mV(\'Eph\',1,\'5-11\');">Eph 1:5-11</a>). In the passages in Romans and Ephesians it takes the place of the King James Version word "predestinate," a return to the usage of the older English versions The word has simply the sense of determining beforehand. It is thus kindred in meaning with a number of other New Testament words expressing the idea of Divine purpose, as "foreknow" (in pregnant sense, <a onClick="return mV(\'Act\',2,23);">Ac 2:23</a>; <a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>, etc.); "determine" (<a onClick="return mV(\'Act\',17,26);">Ac 17:26</a>); "appoint" (<a onClick="return mV(\'1Pe\',2,8);">1Pe 2:8</a>). Foreordination, in the widest sense, is coextensive with the sphere of God\'s universal providence, being but another name for that Divine plan, purpose or counsel which embraces all things, great and small (<a onClick="return mV(\'Mat\',10,29,30);">Mt 10:29-30</a>), that happen in Nature, or fall out in human life. Man\'s free actions are not regarded in Scripture as excluded from it (<a onClick="return mV(\'Act\',2,28);">Ac 2:28</a>). Foreordination, at the same time, is not to be conceived of as in any way overriding, or doing violence to, human freedom. Man acts freely, as Nature acts necessarily, but it is God who appoints the time, place and circumstances of the free act, permits its happening, and overrules it and its issues for the furthering of His own wise and holy ends. See <a href="./study/isbe/search.html?string=PROVIDENCE">PROVIDENCE</a>. Foreordination in the sphere of grace has respect to the choice, calling and blessing of those who, through faith, are made partakers of eternal life (<a onClick="return mV(\'Rom\',8,29,30);">Ro 8:29-30</a>; <a onClick="return mV(\'Eph\',1,5);">Eph 1:5, 11</a>). In this, its soteriological aspect, the subject is considered in special articles.`<a href="./study/isbe/search.html?string=CHOOSE">CHOOSE</a>; <a href="./study/isbe/search.html?string=ELECTION">ELECTION</a>; <a href="./study/isbe/search.html?string=PREDESTINATION">PREDESTINATION</a>`132';
isbe[3524]='Forepart`for\'-part: The translation of panim, "face" (<a onClick="return mV(\'Exd\',28,27);">Ex 28:27</a>; <a onClick="return mV(\'Exd\',39,20);">39:20</a>; <a onClick="return mV(\'1Ki\',6,20);">1Ki 6:20</a>, the Revised Version (British and American) "within"; <a onClick="return mV(\'Eze\',42,7);">Eze 42:7</a>, the Revised Version (British and American) "before"), and of prora, the forward part of a ship, the prow (<a onClick="return mV(\'Act\',27,41);">Ac 27:41</a>, "the forepart stuck fast," the Revised Version (British and American) "the foreship struck").<P>ARV has "its forepart into" for "with his face towards" (<a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a> margin "with its forepart"); "in the forepart thereof" for "before it" (<a onClick="return mV(\'Exd\',28,25);">Ex 28:25</a>; <a onClick="return mV(\'Exd\',39,18);">39:18</a>).``1';
isbe[3525]='Forerunner`for-run\'-er (prodromos):<P>This word occurs but once in the Bible: "Whither as a forerunner Jesus entered for us" (<a onClick="return mV(\'Hbr\',6,20);">Heb 6:20</a>). The word signifies one who comes in advance to a place where the rest are to follow, or one who is sent on before as a scout to take observations. In this sense Christ is our forerunner for He has gone into heaven to prepare a place for His people into which He will eventually lead them. The idea of a forerunner is peculiar to the Christian dispensation. The Old Testament Levitical economy knew nothing of such. The high priest was a representative, not a forerunner: where he led, namely, into the Holy of Holies, the people could not follow. He was not the pioneer of the people; Christ is. Christ goes nowhere but where His people may follow. He is the file-leader (compare <a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>, "the author...of faith"). He goeth before His people to prepare the way for them, to open the gates of heaven by His atoning blood and priestly intercession. The believer is led into full fellowship with God through Jesus Christ.`<a href="./study/isbe/search.html?string=JOHN+THE+BAPTIST">JOHN THE BAPTIST</a>; <a href="./study/isbe/search.html?string=RUNNER">RUNNER</a>`53';
isbe[3526]='Foresail`for\'sal, for\'-s\'-l (<a onClick="return mV(\'Act\',27,40);">Ac 27:40</a>).`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[3527]='Foreship`for\'-ship (<a onClick="return mV(\'Act\',27,30);">Ac 27:30</a>).`<a href="./study/isbe/search.html?string=FOREPART">FOREPART</a>; <a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[3528]='Foreskin`for\'-skin (\'orlah; akrobustia, often euphemistically translated "uncircumcision"):<P>(1) In the literal sense the word is frequently mentioned owing to the rite of circumcision in vogue in Israel since the days of Abraham (<a onClick="return mV(\'Gen\',17,\'9-14\');">Ge 17:9-14</a>) and among several other peoples of antiquity and modern times. The act of circumcision is represented in the temple of Khonsu, a medical deity, at Karnak. Among the Jews of antiquity circumcision had to be performed by means of a flint or stone knife (<a onClick="return mV(\'Exd\',4,25);">Ex 4:25</a>; <a onClick="return mV(\'Jos\',5,2,3);">Jos 5:2-3</a>) on the eighth day after birth (<a onClick="return mV(\'Gen\',17,12);">Ge 17:12</a>; <a onClick="return mV(\'Gen\',21,4);">21:4</a>; <a onClick="return mV(\'Lev\',12,3);">Le 12:3</a>; <a onClick="return mV(\'Luk\',2,21);">Lu 2:21</a>; <a onClick="return mV(\'Phl\',3,5);">Php 3:5</a>), even if this day was the Sabbath (<a onClick="return mV(\'Jhn\',7,23);">Joh 7:23</a>).<P>Very early we find the practice one of which the descendants of Abraham became proud (<a onClick="return mV(\'Gen\',34,14);">Ge 34:14</a>), so that we see the uncircumcised despised and scorned (<a onClick="return mV(\'1Sa\',17,26);">1Sa 17:26</a>), and in the time of oppression under King Antiochus Epiphanes many Israelites suffered martyrdom rather than give up the distinctive sign of their people (1Macc 1:48,60,61; 2Macc 6:10). Among the Arabs and all Mohammedans the custom of circumcision prevails from pre-Islamic times, for it is nowhere ordered in the Koran, and the appellation "uncircumcised" ghalaf)is considered the greatest possible insult.<P>A peculiar martial custom is mentioned in <a onClick="return mV(\'1Sa\',18,25,27);">1Sa 18:25, 27</a> (compare <a onClick="return mV(\'2Sa\',3,14);">2Sa 3:14</a>), where Saul is represented as asking "a hundred foreskins of the Philistines" as a dowry from David for the hand of Michal. This does not seem to have been an exceptional booty in war, especially if it meant that no very careful operation was expected to be performed, but the act became practically equivalent to extermination. We find in Egyptian history at the time of Ramses III, that an invasion into Egypt had been made by several Libyan tribes (see Diimichen, Histor. Inschr., I, plates I-VI, and II, plates 47ff). The Egyptian army sent against the invaders defeated them and returned with a large number of karnatha which is a transcription into hieroglyphics of the Semitic word, qarenoth, the word being used euphemistically as is proven by the accompanying determinative sign of a phallus. See Chabas, Etudes sur l\'antiquite historique d\'apres lee sources egyptienne, etc., 234; Bondi, Hebr.-Phoen. Lehnworte im Egyptischen, Leipzig,1886,72-74. <P>(2) Metaphorically the word is used in a variety of ways:<p>(a) In the sense of "unlawful," "forbidden as food," "taboo." The fruit of newly planted trees was not to be eaten (<a onClick="return mV(\'Lev\',19,\'23-25\');">Le 19:23-25</a>).<p>(b) In the sense of "obstinacy," "opposition to God\'s law." The rite of circumcision meant submission under the law. While an outward form could not be identical with an inward attitude toward God, the use of the word "circumcision" was soon extended to that of purity and obedience of the heart (<a onClick="return mV(\'Deu\',10,16);">De 10:16</a>; <a onClick="return mV(\'Deu\',30,6);">30:6</a>; <a onClick="return mV(\'Col\',2,11);">Col 2:11</a>, where this circumcision is called a "circumcision not made with hands,...the circumcision of Christ"). The uselessness of outward circumcision, which does not include obedience and purity, is shown by Paul (<a onClick="return mV(\'Rom\',2,25);">Ro 2:25</a>; <a onClick="return mV(\'1Cr\',7,18);">1Co 7:18</a>; compare <a onClick="return mV(\'Act\',7,51);">Ac 7:51</a>).<p>(c) In the sense of "Gentiles," "non-Israelites" (<a onClick="return mV(\'Gal\',2,7);">Ga 2:7</a>; <a onClick="return mV(\'Eph\',2,11);">Eph 2:11</a>; <a onClick="return mV(\'Col\',3,11);">Col 3:11</a>).`<a href="./study/isbe/search.html?string=CIRCUMCISION">CIRCUMCISION</a>; <a href="./study/isbe/search.html?string=CONCISION">CONCISION</a>`106';
isbe[3529]='Forest`for\'-est:<P>(1) choresh (compare proper name Harosheth), <a onClick="return mV(\'2Ch\',27,4);">2Ch 27:4</a>. In <a onClick="return mV(\'1Sa\',23,15);">1Sa 23:15</a>ff translated "wood"; in <a onClick="return mV(\'Isa\',17,9);">Isa 17:9</a>, "wood"; in <a onClick="return mV(\'Eze\',31,3);">Eze 31:3</a>, "forest-like shade." Applied to any thick growth of vegetation but not necessarily so extensive as (3).<P>(2) pardec: <a onClick="return mV(\'Neh\',2,8);">Ne 2:8</a>, margin "park"; <a onClick="return mV(\'Ecc\',2,5);">Ec 2:5</a>, the King James Version "orchards," the Revised Version (British and American) "parks"; <a onClick="return mV(\'Sgs\',4,13);">So 4:13</a>, English Versions of the Bible "orchard," the Revised Version, margin "paradise." A word of Persian origin signifying probably an enclosure.<P>See <a href="./study/isbe/search.html?string=PARADISE">PARADISE</a>.<P>(3) ya\'ar from root meaning "rugged"; compare Arabic wa\'ar, "a rugged, stony region." It is sometimes rendered "forest" and sometimes (but less often in the Revised Version (British and American)) "wood." It is used of certain definite wooded tracts: "the forest in Arabia" (<a onClick="return mV(\'Isa\',21,13);">Isa 21:13</a>, margin "thickets"); "the forest of Carmel" (<a onClick="return mV(\'2Ki\',19,23);">2Ki 19:23</a> the King James Version, the Revised Version (British and American) "of his fruitful field"); "the forest of Hereth" (<a onClick="return mV(\'1Sa\',22,5);">1Sa 22:5</a>); "the forest of Lebanon" (<a onClick="return mV(\'1Ki\',7,2);">1Ki 7:2</a>f; <a onClick="return mV(\'1Ki\',10,21);">10:17-21</A>; <a onClick="return mV(\'2Ch\',9,\'16-20\');">2Ch 9:16-20</a>); "the forest of Ephraim," east of the Jordan (<a onClick="return mV(\'2Sa\',18,6,8,17);">2Sa 18:6, 8, 17</a>). The word ya\'ar appears also in well-known Kiriath-jearim, "the city of forests," and Mt. Jearim (<a onClick="return mV(\'Jos\',15,10);">Jos 15:10</a>). Among numerous other references the following may be cited: <a onClick="return mV(\'Deu\',19,5);">De 19:5</a>; <a onClick="return mV(\'Jos\',17,15,18);">Jos 17:15, 18</a>; <a onClick="return mV(\'1Ch\',16,33);">1Ch 16:33</a>; <a onClick="return mV(\'2Ki\',2,24);">2Ki 2:24</a>; <a onClick="return mV(\'Psa\',80,13);">Ps 80:13</a>; <a onClick="return mV(\'Psa\',83,14);">83:14</a>; <a onClick="return mV(\'Psa\',96,12);">96:12</a>; <a onClick="return mV(\'Psa\',132,6);">132:6</a>; <a onClick="return mV(\'Ecc\',2,6);">Ec 2:6</a>; <a onClick="return mV(\'Sgs\',2,3);">So 2:3</a>; <a onClick="return mV(\'1Sa\',7,2);">1Sa 7:2</a>; <a onClick="return mV(\'1Sa\',14,25,26);">14:25-26</a>; <a onClick="return mV(\'Jer\',4,29);">Jer 4:29</a>; <a onClick="return mV(\'Jer\',46,23);">46:23</a>; <a onClick="return mV(\'Eze\',34,29);">Eze 34:29</a>; <a onClick="return mV(\'Mic\',3,12);">Mic 3:12</a>; <a onClick="return mV(\'Mic\',7,14);">7:14</a>.<P>(4) cebhakh, from root meaning "to interweave." A "thicket" (<a onClick="return mV(\'Gen\',22,13);">Ge 22:13</a>; <a onClick="return mV(\'Jer\',4,7);">Jer 4:7</a>); "thicket of trees" (<a onClick="return mV(\'Psa\',74,5);">Ps 74:5</a>); "thickets of the forest" (<a onClick="return mV(\'Isa\',9,18);">Isa 9:18</a>; <a onClick="return mV(\'Isa\',10,34);">10:34</a>).<P>(5) \'adbhim, "thicket" (<a onClick="return mV(\'Jer\',4,29);">Jer 4:29</a>).<P>From many references it is evident that Palestine had in Old Testament times much more extensive forests and woodlands than today.`<a href="./study/isbe/search.html?string=BOTANY">BOTANY</a>`117';
isbe[3530]='Forest of Ephraim``<a href="./study/isbe/search.html?string=EPHRAIM">EPHRAIM</a>`1';
isbe[3531]='Foretell; Foretold`for-tel\', for-told\':The King James Version occurrences of these words in the New Testament represent as many Greek terms, and are in each case rendered differently in Revised Version:<P>(1) <a onClick="return mV(\'Mar\',13,23);">Mr 13:23</a> (proeipon), the Revised Version (British and American) "told beforehand";<P>(2) <a onClick="return mV(\'Act\',3,24);">Ac 3:24</a> (prokataggello), the Revised Version (British and American) simply "told";<P>(3) <a onClick="return mV(\'2Cr\',13,2);">2Co 13:2</a> (prolego), the Revised Version (British and American) "said beforehand," margin "plainly"; compare <a onClick="return mV(\'1Th\',3,4);">1Th 3:4</a>.<P>The foretelling of future events is claimed in the Old Testament as a prerogative of Yahweh (<a onClick="return mV(\'Isa\',41,22,23);">Isa 41:22-23</a>; <a onClick="return mV(\'Isa\',42,9);">42:9</a>, etc.; compare <a onClick="return mV(\'Deu\',18,22);">De 18:22</a>).`<a href="./study/isbe/search.html?string=PROPHECY">PROPHECY</a>`1';
isbe[3532]='Forfeit`for\'-fit (charam):<P>"Forfeit" (from forisfacere, "to act beyond") implies loss through transgression or non-observance of some law or rule. The word occurs only once as the translation of charam, "to shut in," frequently to devote or consecrate a person or thing to God beyond redemption (compare <a onClick="return mV(\'Lev\',27,28,29);">Le 27:28-29</a>; <a onClick="return mV(\'Mic\',4,13);">Mic 4:13</a>; <a onClick="return mV(\'Ezr\',10,8);">Ezr 10:8</a>, "That whosoever came not within three days,...all his substance should be forfeited, and himself separated from the assembly of the captivity," King James Version margin, the American Revised Version, margin and the Revised Version (British and American) "devoted"; compare 1Esdras 9:4, "Their cattle should be seized to the use of the temple" (anieroo, "to consecrate," "devote"); <span class="noTag">6:32</a>, "all his goods seized for the king" (ta huparchonia autou einai (eis) basilika)).<P>The Revised Version (British and American) has "forfeited" (qadhesh, "consecrated,\'; "devoted") for "defiled" (<a onClick="return mV(\'Deu\',22,9);">De 22:9</a>), margin "Hebrew consecrated"; "forfeit his life" for "lose his own soul" (psuche) (<a onClick="return mV(\'Mat\',16,26);">Mt 16:26</a>; <a onClick="return mV(\'Mar\',8,36);">Mr 8:36</a>); "lose or forfeit his own self" for "lose himself or be cast away" (<a onClick="return mV(\'Luk\',9,25);">Lu 9:25</a>, heauton de apolesas e zemiotheis; zemioo is the Septuagint for \'anash, "to be mulcted," or "fined," <a onClick="return mV(\'Exd\',21,22);">Ex 21:22</a>; <a onClick="return mV(\'Deu\',22,19);">De 22:19</a>; <a onClick="return mV(\'Pro\',17,26);">Pr 17:26</a>; <a onClick="return mV(\'Pro\',19,19);">19:19</a>; <a onClick="return mV(\'Pro\',21,11);">21:11</a>; <a onClick="return mV(\'Pro\',22,3);">22:3</a>); Weymouth renders <a onClick="return mV(\'Luk\',9,25);">Lu 9:25</a>, "to have lost or forfeited his own self" (or "had to pay his own self—his own existence—as a fine"); in the other instances of zemioo (<a onClick="return mV(\'1Cr\',3,15);">1Co 3:15</a>; <a onClick="return mV(\'Phl\',3,8);">Php 3:8</a>), the King James Version and the Revised Version (British and American) render "suffer loss," "suffered...loss"; <a onClick="return mV(\'2Cr\',7,9);">2Co 7:9</a> the King James Version, "receive damage."``185';
isbe[3533]='Forge; Forger`forj, for\'-jer (Taphal):<P>"Forgers of lies" occurs in Job\'s reply to his comforters (<a onClick="return mV(\'Job\',13,4);">13:4</a>; compare <a onClick="return mV(\'Job\',14,17);">14:17</a>); the word is the translation of Taphal, "to patch," "lay on," "besmear," hence, to impute, overcharge, etc.; in <a onClick="return mV(\'Psa\',119,69);">Ps 119:69</a>, "forged" occurs with a similar meaning: "The proud have forged a lie against me" (compare Sirach 51:2). "Forger," in the sense of "one who forges, makes, anything," is the Revised Version (British and American) rendering of latas "to smite," or "hammer," in <a onClick="return mV(\'Gen\',4,22);">Ge 4:22</a> King James Version: "Tubal-cain, an instructor of every artificer in brass and iron," the Revised Version (British and American) "the forger of every cutting instrument of brass and iron," margin "an instructor of every artificer of copper and iron."``185';
isbe[3534]='Forget; Forgetful`for-get\', for-get\'-ful (shakhach; epilanthanomai):<P>"Forget" is to fail to hold in mind, and the forgetfulness may be either innocent or blameworthy. In the Old Testament the word is most frequently used as translation of shakhach in a blameworthy sense: to forget the covenant, the law, Yahweh their God (<a onClick="return mV(\'Deu\',4,9,23,31);">De 4:9, 23, 31</a>; <a onClick="return mV(\'Deu\',6,12);">6:12</a>; <a onClick="return mV(\'Jdg\',3,7);">Jud 3:7</a>; <a onClick="return mV(\'1Sa\',12,9);">1Sa 12:9</a>; <a onClick="return mV(\'Psa\',44,20);">Ps 44:20</a>, etc.). In an innocent or neutral, sometimes good, sense it is used in <a onClick="return mV(\'Gen\',27,45);">Ge 27:45</a>; <a onClick="return mV(\'Deu\',24,19);">De 24:19</a>; <a onClick="return mV(\'Job\',9,27);">Job 9:27</a>; <a onClick="return mV(\'Job\',11,16);">11:16</a>; <a onClick="return mV(\'Job\',24,20);">24:20</a>; <a onClick="return mV(\'Psa\',102,4);">Ps 102:4</a>, etc. It is also used of God forgetting or not seeming to care (<a onClick="return mV(\'Psa\',9,12);">Ps 9:12</a>; <a onClick="return mV(\'Psa\',10,11,12);">10:11-12</a>; <a onClick="return mV(\'Psa\',13,1);">13:1</a>; <a onClick="return mV(\'Psa\',42,9);">42:9</a>; <a onClick="return mV(\'Psa\',77,9);">77:9</a>; <a onClick="return mV(\'Isa\',49,15);">Isa 49:15</a>, etc.). To "forget" sometimes means to forsake (<a onClick="return mV(\'Psa\',45,10);">Ps 45:10</a>; <a onClick="return mV(\'Psa\',74,19);">74:19</a>, etc.).<P>In the New Testament epilanthanomai is used of simple forgetting (<a onClick="return mV(\'Mat\',16,5);">Mt 16:5</a>; <a onClick="return mV(\'Mar\',8,14);">Mr 8:14</a>, etc.; in <a onClick="return mV(\'Luk\',12,6);">Lu 12:6</a> the sense of care is implied); <a onClick="return mV(\'Phl\',3,13);">Php 3:13</a>, "forgetting the things which are behind," has the force of leaving behind. "Forgetful" in <a onClick="return mV(\'Jam\',1,25);">Jas 1:25</a> is epilesmone, the Revised Version (British and American) "a hearer that forgetteth." "Forgetfulness" <a onClick="return mV(\'Psa\',88,12);">Ps 88:12</a>, "the land of forgetfulness," is a synonym for Sheol, where all forget and are forgotten. the Revised Version (British and American) has "forget not" for "be ignorant of" (<a onClick="return mV(\'2Pe\',3,8);">2Pe 3:8</a>; similarly <a onClick="return mV(\'2Pe\',3,5);">2Pe 3:5</a>).``185';
isbe[3535]='Forgiveness`for-giv\'-nes (kaphar, nasa\', calach; apoluein charizesthai, aphesis paresis):<P>1. Etymology<P>2. Pagan and Jewish Ideas<P>3. The Teaching of Christ<P>4. Conditions of Forgiveness<P>5. The Offended Party<P>6. Divine and Human Forgiveness<P>7. Forgiveness and Justification<P>8. Old Testament Teaching<P>9. Limitations of Forgiveness<P>10. Christ\'s Power to Forgive Sins<P>11. The Need of an Atonement<P>12. The New Testament Doctrine of Atonement<hr /><P>1. Etymology:<P>Of the seven words, three Hebrew and four Greek, which are used to express the idea of forgiveness, the last two occur in this sense only once each. Apoluein (<a onClick="return mV(\'Luk\',6,37);">Lu 6:37</a>) is used because of the analogy of sin to debt, and denotes the release from it. It has the meaning "forgiveness" in 2Macc 12:45 also, in which passage the word for sin is expressed. In <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a> Paul uses paresis instead of the usual aphesis. The former means "putting aside," "disregarding," "pretermission"; the latter, "putting away" completely and unreservedly (Trench, Synonyms of the New Testament, section xxxiii). It does not mean forgiveness in the complete sense, and in the King James Version is incorrectly translated "remission." Nor does it mean that God had temporarily suspended punishment which at some later date He might inflict (Sanday on <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>). It was apparent that God had treated sins as though He had forgiven them, though in fact such an attitude on the part of God was without such a foundation as was later supplied by an adequate atonement, and so the apostle avoids saying that God forgave them. This passing over of sins had the tendency of destroying man\'s conception of God\'s righteousness, and in order to avert this Christ was set forth as a propitiation and God\'s disregard of sin (paresis) became a real forgiveness (aphesis); compare <a onClick="return mV(\'Act\',14,16);">Ac 14:16</a>; <a onClick="return mV(\'Act\',17,30);">17:30</a>. Charizesthai is not found outside of the writings of Luke and Paul, and in the sense "to forgive sins" is peculiarly Pauline (<a onClick="return mV(\'2Cr\',2,7);">2Co 2:7</a>; <a onClick="return mV(\'2Cr\',12,13);">12:13</a>; <a onClick="return mV(\'Eph\',3,2);">Eph 3:2</a>; <a onClick="return mV(\'Col\',2,13);">Col 2:13</a>; <a onClick="return mV(\'Col\',3,13);">3:13</a>). It expresses, as no other of these words does, his conception of the graciousness of God\'s pardon. Kaphar (<a onClick="return mV(\'Deu\',21,8);">De 21:8</a>; <a onClick="return mV(\'Psa\',78,38);">Ps 78:38</a>; <a onClick="return mV(\'Jer\',18,23);">Jer 18:23</a>) and calah (<a onClick="return mV(\'Num\',30,5,8,12);">Nu 30:5, 8, 12</a>; <a onClick="return mV(\'1Ki\',8,30,34,36,39,50);">1Ki 8:30,34,36,39,50</a>, etc.) are used only of Divine forgiveness, while nasa\' is used in this sense (<a onClick="return mV(\'Exd\',32,32);">Ex 32:32</a>; <a onClick="return mV(\'Num\',14,19);">Nu 14:19</a>; <a onClick="return mV(\'Jos\',24,19);">Jos 24:19</a>; <a onClick="return mV(\'Psa\',25,18);">Ps 25:18</a>; <a onClick="return mV(\'Psa\',32,1,5);">32:1, 5</a>; <a onClick="return mV(\'Psa\',99,8);">99:8</a>; <a onClick="return mV(\'Isa\',2,9);">Isa 2:9</a>), and also of human forgiveness (<a onClick="return mV(\'Gen\',50,17);">Ge 50:17</a>; <a onClick="return mV(\'Exd\',10,17);">Ex 10:17</a>; <a onClick="return mV(\'1Sa\',25,28);">1Sa 25:28</a>). Remission (<a onClick="return mV(\'Mat\',26,28);">Mt 26:28</a>; <a onClick="return mV(\'Mar\',1,4);">Mr 1:4</a>; <a onClick="return mV(\'Luk\',1,77);">Lu 1:77</a>; <a onClick="return mV(\'Luk\',24,47);">24:47</a>; <a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Act\',10,43);">10:43</a>; <a onClick="return mV(\'Hbr\',9,22);">Heb 9:22</a>; <a onClick="return mV(\'Hbr\',10,18);">10:18</a>) and blotting out (<a onClick="return mV(\'Psa\',51,1,9);">Ps 51:1, 9</a>; <a onClick="return mV(\'Isa\',43,25);">Isa 43:25</a>; <a onClick="return mV(\'Jer\',18,23);">Jer 18:23</a>; <a onClick="return mV(\'Act\',3,19);">Ac 3:19</a>) are synonyms of forgiveness, and to understand it fully such words as save, justify, reconcile and atonement should also be considered.<P>2. Pagan and Jewish Ideas:<P>Forgiveness was not a pagan virtue. The large-souled man might disregard offenses in cases where he considered them beneath his notice, but to forgive was weak-spirited (F. W. Robertson on <a onClick="return mV(\'1Cr\',4,12);">1Co 4:12</a>). Even in the Old Testament, man\'s forgiveness of his fellow-man is infrequently mentioned. In every case the one asking forgiveness is in a position of subserviency, and is petitioning for that to which he has no just right (<a onClick="return mV(\'Gen\',50,17);">Ge 50:17</a>; <a onClick="return mV(\'Exd\',10,17);">Ex 10:17</a>; <a onClick="return mV(\'1Sa\',15,25);">1Sa 15:25</a>; <a onClick="return mV(\'1Sa\',25,28);">25:28</a>). The Imprecatory Psalms attest the fact that forgiveness of enemies was not esteemed as a virtue by Israel. They could appeal to the law which enjoined upon them to seek neither the peace nor the prosperity of their avowed enemies (<a onClick="return mV(\'Deu\',23,6);">De 23:6</a>; compare <a onClick="return mV(\'Ezr\',9,12);">Ezr 9:12</a>). Jesus gave the popular summing-up of the law and not its exact words when he said, "Ye have heard that it was said...hate thine enemy" (<a onClick="return mV(\'Mat\',5,43);">Mt 5:43</a>), and this certainly does represent their attitude and their understanding of the teaching of the Scriptures.<P>3. The Teaching of Christ:<P>Christ taught that forgiveness is a duty. No limit can be set to the extent of forgiveness (<a onClick="return mV(\'Luk\',17,4);">Lu 17:4</a>) and it must be granted without reserve. Jesus will not admit that there is any wrong so gross nor so often repeated that it is beyond forgiveness. To Him an unforgiving spirit is one of the most heinous of sins (Bruce, Parabolic Teaching, 376ff). This is the offense which God will not forgive (<a onClick="return mV(\'Mat\',18,34,35);">Mt 18:34-35</a>). It is the very essence of the unpardonable sin (<a onClick="return mV(\'Mar\',3,\'22-30\');">Mr 3:22-30</a>).<P>It was the one blemish of the elder son which marred an otherwise irreproachable life (<a onClick="return mV(\'Luk\',15,\'28-30\');">Lu 15:28-30</a>). This natural, pagan spirit of implacability Jesus sought to displace by a generous, forgiving spirit. It is so far the essence of His teaching that in popular language "a Christian spirit" is not inappropriately understood to be synonymous with a forgiving disposition. His answer to Peter that one should forgive not merely seven times in a day, but seventy times seven (<a onClick="return mV(\'Mat\',18,21,22);">Mt 18:21-22</a>), not only shows that He thought of no limit to one\'s forgiveness, but that the principle could not be reduced to a definite formula.<P>4. Conditions of Forgiveness:<P>Jesus recognized that there are conditions to be fulfilled before forgiveness can be granted. Forgiveness is part of a mutual relationship; the other part is the repentance of the offender. God does not forgive without repentance, nor is it required of man. The effect of forgiveness is to restore to its former state the relationship which was broken by sin. Such a restoration requires the cooperation of both parties. There must be both a granting and an acceptance of the forgiveness. Sincere, deep-felt sorrow for the wrong which works repentance (<a onClick="return mV(\'2Cr\',7,10);">2Co 7:10</a>) is the condition of mind which insures the acceptance of the forgiveness. Hence, Jesus commands forgiveness when the offender turns again, saying, "I repent" (<a onClick="return mV(\'Luk\',17,3,4);">Lu 17:3-4</a>). It was this state of mind which led the father joyfully to welcome the Prodigal before he even gave utterance to his newly formed purpose (<a onClick="return mV(\'Luk\',15,21);">Lu 15:21</a>).<P>5. The Offended Party:<P>It is not to be supposed, however, that failure to repent upon the part of the offender releases the offended from all obligation to extend forgiveness. Without the repentance of the one who has wronged him he can have a forgiving state of mind. This Jesus requires, as is implied by, "if ye forgive not every one his brother from your hearts" (<a onClick="return mV(\'Mat\',18,35);">Mt 18:35</a>). It is also implied by the past tense in the Lord\'s Prayer: "as we also have forgiven our debtors" (<a onClick="return mV(\'Mat\',6,12);">Mt 6:12</a>). It is this forgiving spirit which conditions God\'s forgiveness of our sins (<a onClick="return mV(\'Mar\',11,25);">Mr 11:25</a>; <a onClick="return mV(\'Mat\',6,14,15);">Mt 6:14-15</a>). In such a case the unforgiving spirit is essentially unrepentance (<a onClick="return mV(\'Mat\',18,\'23-35\');">Mt 18:23-35</a>). "Of all acts, is not, for a man, repentance the most Divine?"<P>The offended is to go even farther and is to seek to bring the wrongdoer to repentance. This is the purpose of the rebuking commanded in <a onClick="return mV(\'Luk\',17,3);">Lu 17:3</a>. More explicitly Jesus says, "If thy brother sin against thee, go, show him his fault between thee and him alone" (<a onClick="return mV(\'Mat\',18,\'15-17\');">Mt 18:15-17</a>). He is to carry his pursuit to the point of making every reasonable effort to win the wrongdoer, and only when he has exhausted every effort may he abandon it. The object is the gaining of his brother. Only when this is evidently unattainable is all effort to cease.<P>The power of binding and loosing, which means forbidding and allowing, was granted to Peter (<a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>) and to the Christian community (<a onClick="return mV(\'Mat\',18,18);">Mt 18:18</a>; <a onClick="return mV(\'Jhn\',20,23);">Joh 20:23</a>). It clearly implies the possession of the power to forgive sins. In the case of Peter\'s power it was exercised when he used the keys of the kingdom of heaven (<a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>). This consisted in the proclamation of the gospel and especially of the conditions upon which men might enter into relationship with God (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Act\',10,34);">10:34</a>). It was not limited to Peter only, but was shared by the other apostles (<a onClick="return mV(\'Mat\',16,19);">Mt 16:19</a>; <a onClick="return mV(\'Mat\',18,18);">18:18</a>). Christ left no fixed rules the observance or non-observance of which would determine whether one is or is not in the kingdom of God. He gave to His disciples principles, and in the application of these principles to the problems of life there had to be the exercise of discriminating judgment. The exercise of this judgment was left to the Christian community (<a onClick="return mV(\'2Cr\',2,10);">2Co 2:10</a>).<P>It is limited by the principles which are the basis of the kingdom, but within these principles the voice of the community is supreme. The forgiveness here implied is not the pronouncing of absolution for the sins of individuals, but the determination of courses of conduct and worship which will be acceptable. In doing this its decisions will be ratified in heaven (Westcott on <a onClick="return mV(\'Jhn\',20,23);">Joh 20:23</a>).<P>That there is a close analogy between human and Divine forgiveness is clearly implied (<a onClick="return mV(\'Mat\',5,23,24);">Mt 5:23-24</a>; <a onClick="return mV(\'Mat\',6,12);">6:12</a>; <a onClick="return mV(\'Mar\',11,25);">Mr 11:25</a>; <a onClick="return mV(\'Luk\',6,37);">Lu 6:37</a>; <a onClick="return mV(\'Col\',1,14);">Col 1:14</a>; <a onClick="return mV(\'Col\',3,13);">3:13</a>). God"s forgiveness is conditional upon man\'s forgiveness of the wrongs done him, not because God forgives grudgingly but because forgiveness alone indicates that disposition of mind which will humbly accept the Divine pardon.<P>6. Divine and Human Forgiveness:<P>Repentance is a necessary ingredient of the fully developed forgiveness. There is no essential difference between the human and the Divine pardon, though the latter is necessarily more complete. It results in the complete removal of all estrangement and alienation between God and man. It restores completely the relationship which existed prior to the sin. The total removal of the sin as a result of the Divine forgiveness is variously expressed in the Scriptures: "Thou hast cast all my sins behind thy back" (<a onClick="return mV(\'Isa\',38,17);">Isa 38:17</a>); "Thou wilt cast all their sins into the depths of the sea" (<a onClick="return mV(\'Mic\',7,19);">Mic 7:19</a>); "I will forgive their iniquity, and their sin will I remember no more" (<a onClick="return mV(\'Jer\',31,34);">Jer 31:34</a>); "I, even I, am he that blotteth out thy transgressions" (<a onClick="return mV(\'Isa\',43,25);">Isa 43:25</a>); "As far as the east is from the west, so far hath he removed our transgressions from us" (<a onClick="return mV(\'Psa\',103,12);">Ps 103:12</a>). Ideally this same result is attained in human forgiveness, but actually the memory of the sin remains with both parties as a barrier between them, and even when there is a complete restoration of amity the former state of alienation cannot entirely be removed from memory. When God forgives, however, He restores man to the condition of former favor. Release from punishment is involved, though Divine forgiveness is more than this. In most cases the consequences, which in some instances are spoken of as punishment, are not removed, but they lose all penal character and become disciplinary. Nor does the forgiveness remove from human mind the consciousness of sin and the guilt which that involved, but it does remove the mistrust which was the ground of the alienation. Mistrust is changed into trust, and this produces peace of mind (<a onClick="return mV(\'Psa\',32,\'5-7\');">Ps 32:5-7</a>; <a onClick="return mV(\'Rom\',5,1);">Ro 5:1</a>); consciousness of the Divine love and mercy (<a onClick="return mV(\'Psa\',103,2);">Ps 103:2</a>); removes fear of punishment (<a onClick="return mV(\'2Sa\',12,13);">2Sa 12:13</a>); and awakens love to God.<P>7. Forgiveness and Justification:<P>Paul rarely uses the term "forgiveness," but in its place prefers justification. They are to his understanding practically synonymous (Stevens, Theology of the New Testament, 418). He preferred the latter, however, because it was better fitted to express the idea of secure, present and permanent acceptance in the sight of God. It connoted both a complete and a permanent state of grace. In popular thought forgiveness is not so comprehensive, but in the Biblical sense it means no less than this. It removes all of the guilt and cause of alienation from the past; it assures a state of grace for the present; and promises Divine mercy and aid for the future. Its fullness cannot adequately be conveyed by any one term or formula. Divine, like human, forgiveness is always contingent upon the fulfillment of conditions. It must be preceded by repentance and a firmly fixed intention not to repeat the offense. In addition to this, one was required to conform to certain legal or formal acts before the assurance of pardon was his. These acts were expressive of the sinner\'s state of mind. They consisted of certain acts of sacrifice in the pre-Christian times and of baptism during the ministry of John the Baptist (<a onClick="return mV(\'Mar\',1,4);">Mr 1:4</a>; <a onClick="return mV(\'Luk\',3,3);">Lu 3:3</a>) and under Christ (<a onClick="return mV(\'Act\',2,38);">Ac 2:38</a>; <a onClick="return mV(\'Act\',22,16);">22:16</a>). These acts are never regarded as in any sense a quid pro quo in return for which the benefit of forgiveness is granted. It is an act of pure grace on God\'s part, and these acts are required as expressions of the man\'s attitude toward God. The state of mind required in order to obtain the gift of forgiveness is that to which the Prodigal Son came (<a onClick="return mV(\'Luk\',15,\'17-19\');">Lu 15:17-19</a>), and that of the sinner who went to his house justified rather than the Pharisee (<a onClick="return mV(\'Luk\',18,\'9-14\');">18:9-14</a>), because he realized that forgiveness was to him an act of pure favor. There was real and actual forgiveness of sins in the Old Testament times as well as since Christ. Certain passages have been construed to teach that the Law provided only for a passing over or rolling back of sins, and that there was not then an actual forgiveness.<P>8. Old Testament Teaching:<P>The sacrifices prescribed by the Law were not adequate atonements, so that there was constant necessity of yearly remembrance of sin (<a onClick="return mV(\'Hbr\',10,3);">Heb 10:3</a>; compare <a onClick="return mV(\'Lev\',16,21);">Le 16:21</a>). The atonement of Christ is, however, of permanent adequacy, and became retroactive in the sense that it unified in Christ the Divine arrangement for saving mankind in all ages (<a onClick="return mV(\'Hbr\',11,40);">Heb 11:40</a>). "The passing over of the sins done aforetime" (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>) does not imply a partial or apparent forgiveness, but means that they were forgiven, though seemingly without adequate recognition on the part of God of their heinous character. In view of God\'s righteous character men might naturally have expected punishment, but instead the offenders were spared (compare <a onClick="return mV(\'Act\',14,16);">Ac 14:16</a>; <a onClick="return mV(\'Act\',17,30);">17:30</a>). No expression in the Old Testament suggests any inadequacy of the forgiveness extended to Israel, but on the other hand many passages may be quoted to show how rich and full it was deemed to be (<a onClick="return mV(\'Psa\',103,\'1-\');">Ps 103</a>; <a onClick="return mV(\'Mic\',7,19);">Mic 7:19</a>; <a onClick="return mV(\'Isa\',38,17);">Isa 38:17</a>, <a onClick="return mV(\'Jer\',31,34);">Jer 31:34</a>).<P>9. Limitations of Forgiveness:<P>Two passages seem to limit God\'s forgiveness. They are Christ\'s discussion of the unpardonable sin (<a onClick="return mV(\'Mat\',12,31,32);">Mt 12:31-32</a>; <a onClick="return mV(\'Mar\',3,\'28-30\');">Mr 3:28-30</a>; <a onClick="return mV(\'Luk\',12,10);">Lu 12:10</a>), and the one which mentions the sin unto death (<a onClick="return mV(\'1Jo\',5,16);">1Joh 5:16</a>; compare <a onClick="return mV(\'Hbr\',6,\'4-6\');">Heb 6:4-6</a>). In the former passage there is mentioned a sin which has no forgiveness, and in the latter, one on behalf of which the apostle cannot enjoin prayer that it be forgiven, though he does not prohibit it. In both cases the sin is excluded from the customary forgiveness which is extended to sins of all other classes.<P>The act of the Pharisees which led Jesus to speak of the unpardonable sin was the attributing of a good deed wrought by Him through the Spirit of God (<a onClick="return mV(\'Mat\',12,28);">Mt 12:28</a>) to Beelzebub. No one could do such a thing unless his moral nature was completely warped. To such a person the fundamental distinctions between good and evil were obliterated. No ordinary appeal could reach him, for to him good seemed evil and evil seemed good. The possibility of winning him back is practically gone; hence, he is beyond the hope of forgiveness, not because God has set an arbitrary line of sinfulness, beyond which His grace of forgiveness will not reach, but because the man has put himself beyond the possibility of attaining to that state of mind which is the essential condition of Divine forgiveness. It is practically certain that John did not have any particular sinful act in mind when he spoke of the sin which is unto death.<P>See <a href="./study/isbe/search.html?string=BLASPHEMY">BLASPHEMY</a>.<P>There is no possible way of determining what specific sin, if any, he refers to. Probably the same principle applies in this case as in that of the unpardonable sin. God\'s forgiveness is limited solely by the condition that man must accept it in the proper spirit.<P>There are some passages which seem to imply that forgiveness was the principal Messianic task. This is suggested by the name given to the Messiah during His earthly career (<a onClick="return mV(\'Mat\',1,21);">Mt 1:21</a>), and by the fact that He was the Saviour. The remission of sins was the preparation for the advent of the Messiah (<a onClick="return mV(\'Luk\',1,77);">Lu 1:77</a>), and repentance and remission of sins were the prerequisites to a state of preparation for the kingdom.<P>10. Christ\'s Power to Forgive Sins:<P>It is not surprising, therefore, that we find Jesus laying claim to the power to forgive sins. This provoked a bitter controversy with the Jews, for it was axiomatic with them that no one could forgive sins but God only (<a onClick="return mV(\'Mar\',2,7);">Mr 2:7</a>; <a onClick="return mV(\'Luk\',5,21);">Lu 5:21</a>; <a onClick="return mV(\'Luk\',7,49);">7:49</a>). This Jesus did not question, but He would have them infer from His power to forgive sins that He was the possessor of Divine power. Jesus asserted His possession of this power on two occasions only, though it has been sfficiently inferred from <a onClick="return mV(\'Jhn\',5,14);">Joh 5:14</a>; <a onClick="return mV(\'Jhn\',8,11);">8:11</a> that He was accustomed to pronounce absolution upon all of those He healed. On one of these occasions He not merely asserted that He possessed the power, but demonstrated it by showing Himself to be the possessor of the Divine gift of healing. The impostor might claim some such intangible power as the authority to forgive sins, but he would never assert the possession of such easily disproved power as the ability to heal the sick. But Jesus claimed both, and based His claim to be the possessor of the former on the demonstration that He possessed the latter. God would not support an impostor, hence, his aid in healing the paralytic proved that Jesus could forgive sins. The multitude accepted this logic and "glorified God, who had given such authority unto men" (<a onClick="return mV(\'Mat\',9,\'2-9\');">Mt 9:2-9</a>; <a onClick="return mV(\'Mar\',2,\'3-12\');">Mr 2:3-12</a>; <a onClick="return mV(\'Luk\',5,\'18-26\');">Lu 5:18-26</a>).<P>On the other occasion when His possession of this power was under discussion (<a onClick="return mV(\'Luk\',7,\'36-50\');">Lu 7:36-50</a>), He offered no other proof than the forgiven woman\'s deep gratitude and love. One expression that He uses, however, has raised some discussion as to the relative order in time of her love and forgiveness (<a onClick="return mV(\'Luk\',7,47);">Lu 7:47</a>). Did she love because she was forgiven, or vice versa? Manifestly the forgiveness precedes the love, in spite of the fact that <a onClick="return mV(\'Luk\',7,47);">Lu 7:47</a> seems to assert the opposite, for this is the bearing of the parable of the Two Debtors (<a onClick="return mV(\'Luk\',7,41,42,43);">7:41-43</a>), and the latter part of <a onClick="return mV(\'Luk\',7,47);">7:47</a> has the same implication. It is clear that she had previously repented and had been accepted, and the anointing of Jesus was an outpouring of her gratitude.<P>The phrase of <a onClick="return mV(\'Luk\',7,47);">7:47</a>, "for she loved much," is proof of the greatness of her sin rather than a reason why she was forgiven. In both cases where Jesus forgave sins, He did so because the state of mind of the person forgiven showed worthiness of the blessing. To this as a condition of forgiveness there is no exception. Christ\'s prayer on the cross (<a onClick="return mV(\'Luk\',23,34);">Lu 23:34</a>) would not avail to secure the pardon of His murderers without their repentance.<P>11. The Need of an Atonement:<P>Though forgiveness is on God\'s part an act of pure grace prompted by His love and mercy, and though He forgives freely all those who comply with the condition of repentance and abandonment of sin, yet this does not dispense with the necessity of an atonement. The parable of the Prodigal Son was spoken to teach the freedom of God\'s forgiveness and acceptance of returning sinners, and the duty of men to assume the same attitude toward them. This much it teaches, but it fails to set forth entirely God\'s attitude toward sin. With reference to the sinner God is love and mercy, but with reference to sin He is righteous, and this element of God\'s nature is no less essential to Him than His love, and must be considered in any effort to set forth completely the doctrine of God\'s forgiveness of sinners. The atonement of Christ and the many atonements of the Law were manifestations of this phase of God\'s nature.<P>12. The New Testament Doctrine of Atonement:<P>The idea of an atonement is fundamental in the teachings of the New Testament (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>; <a onClick="return mV(\'2Cr\',5,\'18-21\');">2Co 5:18-21</a>; <a onClick="return mV(\'Col\',1,21);">Col 1:21</a>). It is very clearly implied in such terms as reconciliation and propitiation, and is no less present in pardon, remission and forgiveness. The doctrine of the atonement is not developed by Jesus, but it is strongly hinted at and is unmistakably implied in the language of <a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>; <a onClick="return mV(\'Mat\',26,28);">26:28</a>; <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>; <a onClick="return mV(\'Luk\',24,46,47);">Lu 24:46-47</a>. John the Baptist\'s salute, "Behold, the Lamb of God, that taketh away the sin of the world!" (<a onClick="return mV(\'Jhn\',1,29);">Joh 1:29</a>), also implies it. In the writings of the apostles it is repeatedly and clearly affirmed that our forgiveness and reconciliation to God is based upon the death of Christ. "In none other is there salvation" (<a onClick="return mV(\'Act\',4,12);">Ac 4:12</a>); through Him is the redemption (<a onClick="return mV(\'Rom\',3,24);">Ro 3:24</a>); God set Him forth to be a propitiation (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>); through Him "we have now received the reconciliation" (<a onClick="return mV(\'Rom\',5,11);">Ro 5:11</a>); "God was in Christ reconciling the world unto himself" (<a onClick="return mV(\'2Cr\',5,19);">2Co 5:19</a>); "Him who knew no sin he made to be sin on our behalf" (<a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a>); and "Christ redeemed us from the curse of the law, having become a curse for us" (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>). Such citations might be greatly multiplied. That which was so perfectly accomplished by the offering of Christ was in an analagous though imperfect way accomplished by the sacrifices required by the Law. It had "a shadow of the good things to come" (<a onClick="return mV(\'Hbr\',10,1);">Heb 10:1</a>).<P>The unvarying effect of sin is to produce an estrangement between the injurer and the wronged. The nature of God is such and the relationship between Him and man is of such a character that sin brings about an alienation between them. It is this presupposition of an estrangement between them which renders the atonement necessary before forgiveness can be extended to man. This estrangement must be removed, and the alienation be transformed into a reconciliation. In what then does the alienation consist?<P>The sin of man produces a changed attitude toward each other on the part of both God and man. God holds no personal pique against man because of his sin. The New Testament language is very carefully chosen to avoid any statement which would seem to convey such a conception. Yet God\'s holy righteousness is such that He cannot be indifferent to sin. His wrath must rest upon the disobedient (<a onClick="return mV(\'Jhn\',3,36);">Joh 3:36</a>; <a onClick="return mV(\'Rom\',1,18);">Ro 1:18</a>). It is not merely impersonal. It is not enough to say He hates the sin. Man\'s unrighteousness has not merely alienated him from God, but God also from him. The word "enemies" (echthroi) of <a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a> is passive, and means the object of God\'s enmity (Sunday, at the place). It was because of this fact that God set forth Christ to be a propitiation to show His righteousness because of the passing over of sins done aforetime (<a onClick="return mV(\'Rom\',3,25,26);">Ro 3:25-26</a>).<P>God\'s passing over, without inflicting punishment, the sins of pre-Christian times had placed in jeopardy His righteousness; had exposed Him to the implication that He could tolerate sin. God could not be true to Himself while He tolerated such an imputation, and so instead of visiting punishment upon all who sinned—which would have been one way of showing His righteousness—He set forth Christ to death ("in his blood"), and in this way placed Himself beyond the imputation of unrighteousness while it enabled Him to show mercy to sinners. The effect of sin upon man was to estrange him from God, to lead him farther and farther away from his Maker. Each successive sin produced a greater barrier between the two. Now the atonement was designed to remove the cause of this estrangement and restore the former relationship between God and man.<P>This too, it has been observed, is the purpose of forgiveness, so that the atonement finds its completion in forgiveness. It should be noted that the reconciliation originates with God and not with man (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>; <a onClick="return mV(\'2Cr\',5,19);">2Co 5:19</a>). God woos man before the latter seeks God. The effect of the atonement on man is to reconcile him, attract him, to God. It shows him God\'s love for man, and the forgiveness, in that it removes sin completely, takes away the estranging factor between them and so wins man back to God. "We love, because he first loved us." At the same time the atonement is such a complete expression of both the love and the righteousness of God that, while on the one hand it exhibits his yearning for man, on the other it shows that He is not tolerant toward sin. In the atonement of Christ, therefore, is the meeting-place and the reconcilement of God\'s holy horror of sin and the free bestowal of forgiveness upon penitent believers.``124';
isbe[3536]='Forgo`for-go\' (from for, negative, and go):<P>Occurs in Ecclesiasticus 7:19, as translation of astocheo, which means "to miss the mark," "turn or swerve from." "Forgo not a wise and good wife (the King James Version "woman"); for her grace is above gold," meaning "Turn not away from her"; in Ecclesiasticus 8:9, the word is rendered "miss not"; compare <a onClick="return mV(\'1Ti\',1,6);">1Ti 1:6</a>; <a onClick="return mV(\'1Ti\',6,21);">6:21</a>; <a onClick="return mV(\'2Ti\',2,18);">2Ti 2:18</a>.``1';
isbe[3537]='Fork`fork (shelosh qilleshon):<P>This compound word, meaning strictly "three points" or "three prongs," is found only once (<a onClick="return mV(\'1Sa\',13,21);">1Sa 13:21</a>), and doubtless there refers to the agricultural tool now known as the pitchfork. It might, however, also be a weapon.``1';
isbe[3538]='Form`form (yatsar, to\'ar; morphe):<P>(1) To form is "to fashion," "create," "produce." In the Old Testament it is for the most part the translation of yatsar, "to form," "to fashion" (<a onClick="return mV(\'Gen\',2,7);">Ge 2:7</a>, etc., "Yahweh God formed man of the dust of the ground," etc.); also of chul and chil, "to be twisted" "turned round" "to bring forth (in pain)" (compare <a onClick="return mV(\'Isa\',13,8);">Isa 13:8</a>; <a onClick="return mV(\'Mic\',4,10);">Mic 4:10</a>; <a onClick="return mV(\'Deu\',32,18);">De 32:18</a> the King James Version, "God that formed thee"; <a onClick="return mV(\'Job\',26,13);">Job 26:13</a> the King James Version; <a onClick="return mV(\'Psa\',90,2);">Ps 90:2</a>, "or ever thou hadst formed the earth" etc.; <a onClick="return mV(\'Pro\',26,10);">Pr 26:10</a> the King James Version). In the New Testament we have morphoo, "to form" (<a onClick="return mV(\'Gal\',4,19);">Ga 4:19</a>, "until Christ be formed in you"); plasso, "to form," "to mold" (<a onClick="return mV(\'Rom\',9,20);">Ro 9:20</a>, "him that formed it"; <a onClick="return mV(\'1Ti\',2,13);">1Ti 2:13</a>, "Adam was first formed"; 2Macc 7:23, "the Creator...who formed the generation of man," the Revised Version (British and American) "fashioned"; 7:22, "that formed the members (diarrhuthmizo)," the Revised Version (British and American) "brought into order").<P>(2) Form (noun) is used for<P>(a) appearance, mar\'eh, "sight," "appearance" (<a onClick="return mV(\'Job\',4,16);">Job 4:16</a>, "I could not discern the form thereof" the Revised Version (British and American) "appearance" with "form" for "image" (temunah) in next sentence); tselem, Aramaic "image" (<a onClick="return mV(\'Dan\',3,19);">Da 3:19</a>, "The form of his visage was changed"); rew, "form," "likeness" (<a onClick="return mV(\'Dan\',2,31);">Da 2:31</a>; <a onClick="return mV(\'Dan\',3,25);">3:25</a>, the Revised Version (British and American) "aspect"); to\'ar, "visage," "form" (<a onClick="return mV(\'1Sa\',28,14);">1Sa 28:14</a>, "What form is he of?");<P>(b) the fixed or characteristic form of anything, tabhnith, "model," "form" (<a onClick="return mV(\'Eze\',8,3);">Eze 8:3</a>; <a onClick="return mV(\'Eze\',10,8);">10:8</a>, "the form of a hand"; <a onClick="return mV(\'Eze\',8,10);">Eze 8:10</a>, "every form of creeping things"); morphe, characteristic form as distinguished from schema, changing fashion (<a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>, "in the form of God"; <a onClick="return mV(\'Phl\',2,7);">Php 2:7</a>, "the form of a servant"; less distinctly <a onClick="return mV(\'Mar\',16,12);">Mr 16:12</a>, "in another form");<P>(c) shape, model, pattern, mold, tsurah, "shape," from tsur, "to cut or carve" (<a onClick="return mV(\'Eze\',43,11);">Eze 43:11</a>, ter, "the form of the house," etc.); mishpat, "rule" (<a onClick="return mV(\'2Ch\',4,7);">2Ch 4:7</a> the King James Version); tupos, "type," "impress" (<a onClick="return mV(\'Rom\',6,17);">Ro 6:17</a>, the Revised Version, margin "pattern"); hupotuposis, "outline," pattern (<a onClick="return mV(\'2Ti\',1,13);">2Ti 1:13</a>, the Revised Version (British and American) "pattern"); morphosis, "form," "appearance" (<a onClick="return mV(\'Rom\',2,20);">Ro 2:20</a>, "the form of knowledge");<P>(d) orderly arrangement, giving shape or form (<a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>; <a onClick="return mV(\'Jer\',4,23);">Jer 4:23</a>, the earth was "without form," tohu, the Revised Version (British and American) "waste"; The <span class="noTag">Wisdom of Solomon 11:17</span>, amorphos); "form of speech" (<a onClick="return mV(\'2Sa\',14,20);">2Sa 14:20</a>, aspect, panim, "face," the Revised Version (British and American) "to change the face of the matter"); as giving comeliness or beauty, to\'ar (<a onClick="return mV(\'Isa\',52,14);">Isa 52:14</a>; <a onClick="return mV(\'Isa\',53,2);">53:2</a>, "He hath no form nor comeliness"; compare <a onClick="return mV(\'Gen\',29,17);">Ge 29:17</a>; <a onClick="return mV(\'Gen\',39,6);">39:6</a>, etc.; The <span class="noTag">Wisdom of Solomon 15:5</span>, "desiring the form (eidos) of a dead image," the Revised Version (British and American) "the breathless form");<P>(e) Show, without substance, morphosis, "form" (<a onClick="return mV(\'2Ti\',3,5);">2Ti 3:5</a>, "holding a form of godliness").<P>ARV has "didst form" for "hast possessed" (<a onClick="return mV(\'Psa\',139,13);">Ps 139:13</a>, so the English Revised Version, margin; both have "formed" for "made" (<a onClick="return mV(\'Psa\',104,26);">Ps 104:26</a>), the American Standard Revised Version for "framed" twice (<a onClick="return mV(\'Isa\',29,16);">Isa 29:16</a>); both for "formed thee," "gave birth" (<a onClick="return mV(\'Deu\',32,18);">De 32:18</a>); "pierced" (<a onClick="return mV(\'Job\',26,13);">Job 26:13</a>); "woundeth" (<a onClick="return mV(\'Pro\',26,10);">Pr 26:10</a>); "fastened" (<a onClick="return mV(\'Isa\',44,10);">Isa 44:10</a>); for "are formed from" (<a onClick="return mV(\'Job\',26,5);">Job 26:5</a>), "tremble"; for "their form" (<a onClick="return mV(\'2Ch\',4,7);">2Ch 4:7</a>), "the ordinance concerning them"; "form" for "similitude" (<a onClick="return mV(\'Num\',12,8);">Nu 12:8</a>; <a onClick="return mV(\'Deu\',4,12);">De 4:12, 15</a>); for "size" (<a onClick="return mV(\'1Ki\',6,25);">1Ki 6:25</a>; <a onClick="return mV(\'1Ki\',7,37);">7:37</a>); for "shape" (<a onClick="return mV(\'Luk\',3,22);">Lu 3:22</a>; <a onClick="return mV(\'Jhn\',5,37);">Joh 5:37</a>); "in the form" for "similitude" (<a onClick="return mV(\'Deu\',4,16);">De 4:16</a>); for "or the like" (<a onClick="return mV(\'Deu\',4,23,25);">De 4:23, 25</a>); the American Standard Revised Version "(beholding) thy form" for "thy likeness" (<a onClick="return mV(\'Psa\',17,15);">Ps 17:15</a>, the English Revised Version, margin); "every form" for "all appearance" (<a onClick="return mV(\'1Th\',5,22);">1Th 5:22</a>; so the English Revised Version, margin "appearance").``185';
isbe[3539]='Former`for\'-mer:<P>The word in the sense of "maker," "framer," occurs only in <a onClick="return mV(\'Jer\',51,19);">Jer 51:19</a>, "He is the former (from yatsar, "to form") of all things." The adjective, in the sense of preceding in the order of time, is commonly in Hob the translation of ri\'shon, "first," "foremost" (<a onClick="return mV(\'Gen\',40,13);">Ge 40:13</a>; <a onClick="return mV(\'Num\',21,26);">Nu 21:26</a>; <a onClick="return mV(\'Deu\',24,4);">De 24:4</a>, etc.); in Greek of proteros (<a onClick="return mV(\'Eph\',4,22);">Eph 4:22</a>; <a onClick="return mV(\'Hbr\',10,32);">Heb 10:32</a>; <a onClick="return mV(\'1Pe\',1,14);">1Pe 1:14</a>); and in two cases (<a onClick="return mV(\'Act\',1,1);">Ac 1:1</a>; <a onClick="return mV(\'Rev\',21,4);">Re 21:4</a>) of protos, where the Revised Version (British and American) has (in Acts in the margin) "the first." As denoting place or position the word occurs in the Old Testament in <a onClick="return mV(\'Zec\',14,8);">Zec 14:8</a>, "the former sea" as translation of qadhmoni, "in front," where the Revised Version (British and American) has "eastern," i.e. the Dead Sea, in contrast with the Mediterranean, or western sea (compare <a onClick="return mV(\'Eze\',47,18);">Eze 47:18</a>; <a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a>). For "former iniquities" (<a onClick="return mV(\'Psa\',79,8);">Ps 79:8</a>) the Revised Version (British and American) has simply "the iniquities"; Other changes may be seen in <a onClick="return mV(\'Num\',6,12);">Nu 6:12</a>; <a onClick="return mV(\'Isa\',65,7);">Isa 65:7</a>; <a onClick="return mV(\'Eze\',36,11);">Eze 36:11</a>; <a onClick="return mV(\'Mic\',4,8);">Mic 4:8</a>; <a onClick="return mV(\'Hag\',2,3);">Hag 2:3</a>.``185';

isbe[3542]='Forth`forth: "Forth," adverb (from "for"), signifies movement<P>(1) forward,<P>(2) out of,<P>(3) beyond a certain boundary.<P>In a few instances in the Old Testament it is the translation of the preposition \'al, properly "above," "upon" (<a onClick="return mV(\'2Ki\',11,15);">2Ki 11:15</a>; <a onClick="return mV(\'2Ch\',23,14);">2Ch 23:14</a>; <a onClick="return mV(\'Amo\',7,17);">Am 7:17</a> the King James Version), and of chuts, "without" (<a onClick="return mV(\'Gen\',39,13);">Ge 39:13</a>; <a onClick="return mV(\'Jdg\',19,25);">Jud 19:25</a>). "Forth" is often used as an expletive of various verbs, as "break (forth)," "bring (forth)," "call (forth)," etc. In the Gospel of John it is the translation of exo, "without," as "Lazarus, come forth" (<a onClick="return mV(\'Jhn\',11,43);">11:43</a>; so <a onClick="return mV(\'Jhn\',15,6);">15:6</a>; <a onClick="return mV(\'Jhn\',19,4);">19:4</a> the King James Version, etc.; also <a onClick="return mV(\'Act\',5,34);">Ac 5:34</a>; <a onClick="return mV(\'Act\',9,40);">9:40</a>). "Stand forth" in <a onClick="return mV(\'Mar\',3,3);">Mr 3:3</a> is the translation of egeire eis to meson, margin "Arise into the midst." the Revised Version (British and American) has a great many changes, frequently substituting "out," "away," "abroad," etc.; "forth from" for "out of" (<a onClick="return mV(\'Job\',41,21);">Job 41:21</a>; <a onClick="return mV(\'Isa\',45,23);">Isa 45:23</a>); "spread forth" for "stretched out" (<a onClick="return mV(\'Psa\',44,20);">Ps 44:20</a>; <a onClick="return mV(\'Psa\',88,9);">88:9</a>; <a onClick="return mV(\'Psa\',136,6);">136:6</a>), etc. In <a onClick="return mV(\'Col\',1,6);">Col 1:6</a>, for "bringeth forth fruit" the Revised Version (British and American) reads "bearing fruit."``185';
