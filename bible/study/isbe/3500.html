isbe[3543]='Fortification; Fort; Fortified Cities; Fortress`for-ti-fi-ka\'-shun (including):<P><b>I. IN RECENT EXCAVATIONS</b><P class="in15">1. Excavation of Tells<P class="in15">2. Sites<P class="in15">3. Primitive Character<P class="in15">4. Walls<P class="in15">5. Towers<P class="in15">6. Acropolis or Castle<P class="in15">7. Masonry<P class="in15">8. Gates<P class="in15">9. Water Supply<P><b>II. IN BIBLICAL HISTORY</b><P class="in15">1. Before the Monarchy<P class="in15">2. In the Period of the Monarchy<P class="in15">3. In the Period of the Return<P><b>III. IN THE PSALMS AND THE PROPHETS</b><P class="in15">1. The Psalms<P class="in15">2. The Prophets<P><b>IV. IN THE NEW TESTAMENT</b><P class="in15">1. In Paul\'s Epistles<P class="in15">2. In the Acts of the Apostles<P class="in15">3. In the Gospel History<P><b>LITERATURE</b><hr /><P>Has a number of words representing its various elements and aspects:<P>(1) mibhtsar, is the term generally rendered "fenced" or "defenced city." In both the King James Version and the Revised Version (British and American) of Isaiah and Jeremiah we find for the most part the more formal "defenced city." It is found by itself (<a onClick="return mV(\'Isa\',17,3);">Isa 17:3</a>); with \'ir, "city" (<a onClick="return mV(\'1Sa\',6,18);">1Sa 6:18</a>; <a onClick="return mV(\'2Ki\',3,19);">2Ki 3:19</a>; plural \'are mibhtsar, "fenced (the American Standard Revised Version "fortified") cities," <a onClick="return mV(\'Num\',32,17);">Nu 32:17</a>); with tsor, "Tyre" (<a onClick="return mV(\'Jos\',19,29);">Jos 19:29</a>; <a onClick="return mV(\'2Sa\',24,7);">2Sa 24:7</a>, where it is rendered "stronghold").<P>(2) misgabh, "high fort" (<a onClick="return mV(\'Isa\',25,12);">Isa 25:12</a>; <a onClick="return mV(\'Jer\',48,1);">Jer 48:1</a> the Revised Version, margin; <a onClick="return mV(\'Psa\',9,9);">Ps 9:9</a>, and many other places in the Pss).<P>(3) ma\'oz, "fortress," "stronghold" (<a onClick="return mV(\'Jdg\',6,26);">Jud 6:26</a>; <a onClick="return mV(\'Psa\',31,2);">Ps 31:2</a>; <a onClick="return mV(\'Dan\',11,39);">Da 11:39</a>).<P>(4) metsudhah, "fort" the King James Version, "stronghold" the Revised Version (British and American) (<a onClick="return mV(\'2Sa\',5,9,17);">2Sa 5:9, 17</a>).<P>(5) metsurah, "fort" (<a onClick="return mV(\'Isa\',29,3);">Isa 29:3</a> the King James Version; plural the Revised Version (British and American) "siege works").<P>(6) mutstsabh (<a onClick="return mV(\'Isa\',29,3);">Isa 29:3</a>, "fort" the English Revised Version, "mount" the King James Version, "posted troops" the American Standard Revised Version).<P>(7) dayeq, "fort" (for the siege of a city, the wall of circumvallation cast up by the besiegers, <a onClick="return mV(\'2Ki\',25,1);">2Ki 25:1</a>; <a onClick="return mV(\'Jer\',52,4);">Jer 52:4</a>; <a onClick="return mV(\'Eze\',4,2);">Eze 4:2</a>; <a onClick="return mV(\'Eze\',17,17);">17:17</a>; <a onClick="return mV(\'Eze\',21,22);">21:22</a>; <a onClick="return mV(\'Eze\',26,8);">26:8</a>).<P>(8) matsor, "fortress" (<a onClick="return mV(\'Jer\',10,17);">Jer 10:17</a> margin, wall of circumvallation: <a onClick="return mV(\'Hab\',2,1);">Hab 2:1</a>, "tower" the King James Version, "fortress" the Revised Version, margin; <a onClick="return mV(\'Zec\',9,3);">Zec 9:3</a>).<P>(9) birah, "palace" the King James Version, "castle" the Revised Version (British and American) (<a onClick="return mV(\'Neh\',2,8);">Ne 2:8</a>; <a onClick="return mV(\'Neh\',7,2);">7:2</a>). Birah Grecized is baris, which has the double meaning of "palace" and "fortress." Nehemiah\'s "castle" figures largely in the Books of Maccabees and in Josephus, and is the Castle of Antonia of the Acts of the Apostles.<P>(10) ochuroma (<a onClick="return mV(\'2Cr\',10,4);">2Co 10:4</a>, its only occurrence in the New Testament though it is the chief equivalent of mibhtsar in the Septuagint). In this connection it is to be noted that chomah, is Hebrew for "wall," Greek teichos; chel or cheyl, is Hebrew for the "ditch," or "rampart," or "bastion" of a fortress; mighdal, "tower"; pinnah plural pinnoth, "corner towers."<P>Fortified Places:<P>From the very beginning of their history as a nation the Israelites were acquainted with fortified cities. The report of cities "great and fortified up to heaven," inhabited by the sons of Anak, by Amalekites, Hittites, Jebusites, Amorites and Canaanites, struck terror into the hearts of the Israelites in the wilderness, and called forth murmurings from them on their way to Canaan (<a onClick="return mV(\'Num\',13,28);">Nu 13:28</a>; <a onClick="return mV(\'Deu\',1,28);">De 1:28</a>). Not that these cities were at all of the extent or population of modern cities, or of Nineveh, Babylon and Memphis of old. But to a people who were as yet little better than a horde of fugitives accustomed to the simple camp life of the wilderness and unacquainted with appliances for siege and assault, the prospect of scaling the walls and conquering the inhabitants was appalling. The cities of the Canaanites were already old when Joshua led the Israelites to the conquest of the land. Not a little of their history has become known to us, and the character of their defensive works has been disclosed by Palestinian excavation in recent years.<P>I. In Recent Excavations.<P>1. Excavation of Tells:<P>It has been largely to the tells, or mounds of buried cities, chiefly in the southwest of the land, that exploration has been directed. The Palestine Exploration Fund, drawing its resources from Great Britain and also from America, was the first, and has all along been the foremost, in the work of excavation. Through the labors of Professor Flinders Petrie at Tell el-Hesy; of Dr. F. J. Bliss, and Professor Stewart Macalister at Tell Zakariyah, Tell ec-Safi, Tell ej-Judeideh, Tell Sandahannah, and more recently of Professor Macalister at Gezer, the Fund has added largely to our knowledge of the fenced cities of Canaan. The work of Sir Charles Warren, Sir Charles W. Wilson, Colonel Conder and other explorers at Jerusalem under the same auspices has been of great value for illustrating the defensive works of a later time. Germany and Austria have not been behind. The excavation, first, of Tell Ta\'anek in the Plain of Esdraelon, and, at the present time (1911), of Jericho by Professor E. Sellin, formerly of Vienna, now of Rostock; and of Tell el-Mutesellim, the ancient Megiddo, by Gottlieb Schumacher, has yielded results of the highest importance. Since 1908 an American expedition from Harvard University, first under Schumacher and now under Dr. Reisner, who had previously excavated at the Pyramids and other places in Egypt, has explored with remarkable results the site of the capital of the Northern Kingdom, Samaria. Excavations have also been conducted by the German Orient Committee at Sinjerli which have thrown a flood of light upon the archaeology of Northern Syria and especially upon the wonderful Hittite people. The memoirs and reports of these excavations have furnished abundance of material for tracing the evolution and understanding the anatomy of the tell. They usefully supplement the Scripture narratives, and confirm them in many particulars.<P>2. Sites:<P>These cities of the primitive inhabitants of Canaan occupied sites easily capable of defense. They were built either upon a projecting spur of a mountain ridge, like Gezer, Megiddo, Tell ec-Safi (believed to be the ancient Gath) and primitive Jerusalem, or upon an isolated eminence in the plain like Tell el-Hesy (Lachish) or Taanach. Compared with modern cities the area was small—in the case of Gezer about a quarter of a mile square, Lachish 15 acres, Megiddo and Taanach 12 to 13 acres. A sufficient water supply within easy reach was an essential feature. Speaking of Gezer, Professor Macalister says: "Water, the first necessity of life, was in abundance. The three primitive modes of livelihood—hunting, pasturing, and agriculture—could be practiced here better than in many places. Further, for defense—another prime necessity in early days—the hill is admirably fitted. It is steep and not easy to climb; and being fairly high it commands a wide prospect, so that the approach of enemies can be seen and prepared for" (Bible Side-Lights from Gezer, 25,26).<P>3. Primitive Character:<P>Their history goes back in most cases to a very remote antiquity. "It cannot have been much later than 3000 BC," says Professor Macalister regarding Gezer, "when a primitive race of men first realized that the bare rocky hill (as it then was) would be a suitable dwelling-place. This tribe was a cave-dwelling race" (as above; and PEFS, 1904, 311ff). The primitive race had occupied the hill perhaps five hundred years when the Canaanites drove them out, as they in turn were driven out by the Israelites. But the nature of their original habitations, the earliest relics of their social life, and what can be gathered of their religious rites all bear witness to a remote antiquity. From the mound of Tell el-Hesy, now almost certainly identified with the site of Lachish, eleven cities, one above the other have been disinterred, the eleventh or highest having nine cities between itself and the first Amorite buildings reared upon the original bluff. This lowest city is believed to go back some 2000 years BC, Professor Flinders Petrie having dated the successive cities by means of the pottery found in the strata of the mound. One of the eleven cities, possibly the fourth from the bottom, was that of Lachish, which fell a prey to Joshua (<a onClick="return mV(\'Jos\',10,32);">Jos 10:32</a>), the walls of which, built of crude brick and 10-12 ft. in thickness, are a witness to its character as a fenced city (Bliss, A Mound of Many Cities, chapter iv).<P>4. Walls:<P>While the site of the Canaanite city was chosen for its natural strength, the first settlers soon felt the need of some fortification. At Sinjerli the excavators have been able to trace the general growth of the site from a group of shepherds\' huts into a walled town. The earliest fortification attempted was a rampart of earth following the natural contour of the hill (PEFS, 1903, 113). Within some such enclosing wall, houses were built and the inhabitants lived and pursued their avocations safely. The primitive earthbank in the case of Gezer was in course of time replaced first by an inner and then by an outer wall in succession. The outer wall when it was added to strengthen the inner was the chel, rendered in the English version "bulwark" (<a onClick="return mV(\'Isa\',26,1);">Isa 26:1</a>) or "rampart" (<a onClick="return mV(\'Nah\',3,8);">Na 3:8</a>, where the waters of the Nile served the same purpose). Professor Macalister estimates that the inner wall of Gezer had fallen into disuse and ruin by about 1450 BC and that it was the outer that saw the conquest of Canaan by the Israelites. "Even in its present ruined form," says Professor Macalister, "the outer city wall is an imposing structure. In places it still stands to a height of from 10 to 14 ft., and these can hardly be regarded as being much more than the underground foundations. The outer face of the city wall, towering above the hill on which the city was built, may well have seemed impregnable to the messengers of Moses" (Bible Side-Lights, 142). The walls of a later time, as we learn from Assyrian representations, were provided with battlements, very often crenellated, and "thy pinnacles of rubies" (<a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>, the Revised Version (British and American), the Revised Version, margin "windows") may refer to them. For the purpose of strengthening the walls, especially at the least defensible points, revetments or facings of stone or kiln-burnt bricks were sometimes added. Even these again would be rendered less assailable by a trench (chel) serving to cut off a fortress from adjacent level or sloping ground, as may still be seen outside the north wall of Jerusalem, and many parts ofthe walls of Constantinople.<P>5. Towers:<P>Towers were sometimes built at the corners or at points on the wall where attack was to be apprehended (<a onClick="return mV(\'Zep\',1,16);">Ze 1:16</a>; <a onClick="return mV(\'2Ch\',14,7);">2Ch 14:7</a>). Such towers have been disclosed on the crest of the hill at Tell Zakariyah. At Gezer 30 towers were found round the outer wall. On the walls of Sinjerli there rose no fewer than 800 towers (Garstang, Land of the Hittites, 273). On the evidence of the excavations at this ancient Hittite site we gather that the cities about the time of the entrance of the Israelites into Canaan "were already surrounded by masoned walls, supported by numerous external towers, and entered through gateways barred by a pair of double doors and guarded by wing towers on either hand" (Land of the Hittites, 367). For illustrations, see <a href="./study/isbe/search.html?string=CITY">CITY</a>.<P>6. Acropolis or Castle:<P>Every one of these ancient cities had an inner fortress which would be an internal means of protection, and the last refuge of the defenders in extremity. At Tell Zakariyah the acropolis wall has been traced, and its shape has been found to be conditioned by the contours of the hill on which it stood. In an old Hittite settlement a fortress has been found rectangular in shape and supported by an outer and lower wall at a distance of 12 to 30 yds. (Land of the Hittites, 162). There is evidence that the mound or bluff originally occupied remained the fortress or acropolis of the city when it spread out over a larger area, and this seems to have been the case for some time at least with the Jebusite fort taken by David and made the capital of the kingdom. At Sinjerli, while there was a wall surrounding the whole township, there was an outer as well as an inner defensive wall to the citadel. Upon this citadel were found palaces from which the Assyrian king, Tiglath-pileser I, copied the plan of a Hittite palace, called in Assyrian Hilani.<P>7. Masonry:<P>The excavations enable us to see the progress of the art of fortification from very primitive beginnings. Crude brick and rough stone-work were the materials of the earliest walls. They are usually found of uncoursed masonry in which the large stones are undressed field boulders. The facings of stone and the joints in walls were often packed with pebbles or with limestone chippings, the stones themselves being more or less roughly trimmed and dressed to shape by a hammer. Corner-stones are found in the towers showing marks of the chisel, but it is not till well on in the Hebrew period that stones are found with bosses and marginal drafting. At Zakariyah the walls of the acropolis were of rubble laid in mud, mixed with straw without lime, and they contained some well-worked stones, irregularly intermingled with field stones of various sizes. At a later time mortar was used to cover the walls and give greater strength and support. But the clay used for the purpose was apt to crack unless it was given consistency by treading with the feet and mixing with water. Thus we read of a wall daubed with untempered mortar (<a onClick="return mV(\'Eze\',13,\'10-16\');">Eze 13:10-16</a>; <a onClick="return mV(\'Eze\',22,28);">22:28</a>; compare <a onClick="return mV(\'Nah\',3,14);">Na 3:14</a>). In the masonry of the Hittite fortress (see (6) above) the masonry of the inner wall is rough, dry stonewalling, while the outer is built of stones roughly pentagonal in shape, irregular in size, fitted to one another and laid without mortar, somewhat like the Cyclopean walls of the earliest periods of Greek history.<P>See <a href="./study/isbe/search.html?string=GEZER">GEZER</a>.<P>8. Gates:<P>The gates of the fenced cities of Canaan may not have had the social importance which the city gate came to possess in later times, but they were an important element in the defensive works of a city. They were as few as possible, so as to give only the necessary ingress and egress. The gate of Jericho was shut and secured at nightfall (<a onClick="return mV(\'Jos\',2,5);">Jos 2:5</a>). The gate of Gaza had two leaves which were not hinged to the two gate-posts, but turned on pins moving in sockets in the sill and lintel, the bar stretching between the two posts and let into them to secure the gate (<a onClick="return mV(\'Jdg\',16,3);">Jud 16:3</a>, with Moore\'s notes). The hundred gates of Babylon, according to Herodotus, were all of brass (i.179); and Yahweh promises to Cyrus to break in pieces the doors of brass and to cut in sunder the bars of iron (<a onClick="return mV(\'Isa\',45,2);">Isa 45:2</a>). That the bars were sometimes of wood is clear from what is said of the bars of Nineveh (<a onClick="return mV(\'Hab\',3,13);">Hab 3:13</a>). To protect the gate it was supplied with towers. Uzziah built towers in Jerusalem at the corner gate and at the valley gate, and fortilled them (<a onClick="return mV(\'2Ch\',26,9);">2Ch 26:9</a>). In the inner wall of Gezer, to which reference has been made, a gate of very remarkable structure has been found. The wall is of stone, but the gateway consists of a passage between two solid towers of brick. The passage <span class="noTag">is</span> 9 ft. wide and 42 ft. long, roughly paved with stones. Stone slabs on each side of the passageway bear traces of fire, and the absence of any wooden barrier may be due to a conflagration at the capture of the city. The towers remain standing and rise to a total height of about 16 ft. In later times watchmen were set on the tower over the gate to descry the approach of friend or foe or messenger (<a onClick="return mV(\'2Sa\',18,24);">2Sa 18:24</a>ff), and the tower had chambers in it which might be occupied by visitors or by a guard. For the more general purposes see <a href="./study/isbe/search.html?string=GATE">GATE</a>.<P>9. Water Supply:<P>One of the essential requisites of the primitive Canaanite fortress was a supply of water. At Gezer a copious spring within easy reach was available. Tell el-Hesy commands the only springs in that region (A Mound of Many Cities, 16). It is a strong point in favor of the modern theory of the ridge of Ophel being the site of Zion or David\'s town that the Virgin\'s Fountain, the only perennial spring in the whole circuit of Jerusalem, was close to it, and would have been an inducement to the Jebusites to build their fortress there. In the sites that have been excavated, cisterns, sometimes vaulted over and with steps down into them, have been constantly found. Traces have also been observed of concealed passages or tunnels by which access has been obtained to the nearest spring. Some such explanation has been given of the "gutter" (<a onClick="return mV(\'2Sa\',5,8);">2Sa 5:8</a> the King James Version, "watercourse" the Revised Version (British and American)), by which Joab obtained access to the fortress of Jebus and enabled David to capture it (<a onClick="return mV(\'1Ch\',11,6);">1Ch 11:6</a>; compare Vincent, Canaan d\'apres l\'exploration recente, 26). During an investment of a fortified city by an enemy, it was a point in strategy for the inhabitants to secure the fountain and to divert or conceal the stream flowing from it so that the besiegers might be left without a water supply (<a onClick="return mV(\'2Ki\',3,19,25);">2Ki 3:19, 25</a>; <a onClick="return mV(\'2Ch\',32,3);">2Ch 32:3</a>; compare also <a onClick="return mV(\'2Sa\',12,26,27);">2Sa 12:26-27</a>, Century Bible, Kennedy\'s note).<P>II. In Biblical History.<P>1. Before the Monarchy:<P>On the passage of the Jordan the Israelites found in Jericho a walled city of great strength barring their progress. The excavations recently made have disclosed the common features of Canaanite fortresses—an outer wall, surrounding the entire area, 6 1/2 ft. thick, a citadel and protecting walls of hardly less substantial workmanship. Nearby also is the essential spring to furnish the water supply. Within the citadel were found the walls and rooms of Canaanite houses, and in many cases remains of infants buried in jars under the clay floors (Driver, Modern Research as Illustrating the Bible, 91ff). These examples of "foundation sacrifices" with which the excavations at Gezer have made us familiar give point to the account of the resettlement of the city in the days of Ahab, when Hiel the Bethelite rebuilt Jericho, laying the foundation thereof with the loss of Abiram, his firstborn, and setting up the gates thereof with the loss of his youngest son Segub (<a onClick="return mV(\'1Ki\',16,34);">1Ki 16:34</a>).<P>See <a href="./study/isbe/search.html?string=CORNER-STONE">CORNER-STONE</a>; <a href="./study/isbe/search.html?string=CANAAN">CANAAN</a>.<P>In the Book of Judges we read of the strong tower, or citadel, of Thebez, into which the inhabitants had crowded and to which Abimelech was setting fire when a woman upon the wall hurled a millstone upon him and broke his skull (<a onClick="return mV(\'Jdg\',9,51);">Jud 9:51</a>). It does not appear that at this period the Israelites were in possession of the strongholds of the land, for when the Philistines overran the country, they had no fortresses to flee to, but "did hide themselves in caves, and in thickets, and in rocks, and in coverts, and in pits" (<a onClick="return mV(\'1Sa\',13,6);">1Sa 13:6</a>).<P>2. In the Period of the Monarchy:<P>When David captured the Jebusite fortress (<a onClick="return mV(\'2Sa\',5,6);">2Sa 5:6</a>) and transferred his capital from Hebron to Jerusalem, a new era of independence and even of conquest began. The natural strength of David\'s town, with such fortification as had been added, made it impregnable to any Philistine or Syrian foe, and one of the strongest fortresses in Western Asia.<P>Although Solomon was a man of peace, he included among the great buildings which he executed fortresses and works of defense. He built the wall of Jerusalem round about. He built Millo (called Akra ("citadel") in the Septuagint), and closed the breaches of the city of David, so that there might be no vulnerable point found in the defenses of the city (<a onClick="return mV(\'1Ki\',9,15);">1Ki 9:15</a>). This fortification is represented in Septuagint, which has here an addition to the Massoretic Text, as securing the complete subjection of the original inhabitants who remained. Solomon also built Hazor to watch Damascus, Megiddo to guard the plain of Jezreel, and Gezer overlooking the maritime plain, his work being one of refortification rather than of building from the foundation. He fortified also Beth-horon, Upper and Nether, to block the way against Philistine invasion. The store cities, and cities to accommodate his chariots and horses, were also part of his military system (<a onClick="return mV(\'1Ki\',9,18);">1Ki 9:18</a>).<P>The disruption of the kingdoms, and the jealousy and hostility that followed between Judah and Israel, necessitated fresh undertakings of fortification, on the part of both kingdoms. Rehoboam dwelt in Jerusalem, and built cities for defense in Judah. He fortified the strongholds and provisioned them and stored arms within them in case of siege (<a onClick="return mV(\'2Ch\',11,5);">2Ch 11:5</a>). One of Jeroboam\'s first acts on ascending the throne was to build the two fortresses, Shechem to guard Mr. Ephraim, and Penuel to protect Gilead (<a onClick="return mV(\'1Ki\',12,25);">1Ki 12:25</a>). Baasha later pushed his frontier within a few miles of Jerusalem, fortifying Ramah to overawe Asa in his very capital. The long war which lasted through the reigns of Jeroboam, Nadab, Baasha and Elah, kings of Israel, was largely a war of sieges, one of them, that of Gibbethon, having apparently lasted 27 years (<a onClick="return mV(\'1Ki\',15,27);">1Ki 15:27</a>, compared with <a onClick="return mV(\'1Ki\',16,15);">1Ki 16:15</a>).<P>With Omri there arose in Israel a powerful ruler whose name is mentioned with respect in the Assyrian monuments, which designate the kingdom of Israel Mat Bit Khumri, "the land of the house of Omri." He was the builder of Samaria which remained the capital of the Northern Kingdom till its fall in 722 BC. In excavations but recently carried on by the archaeological expedition of Harvard University, the walls of Omri\'s palace and fortress were laid bare, giving an impression of the great strength of the place.<P>While Solomon built the wall of Jerusalem, we read that Uzziah built towers at the corner gate, and at the valley gate, and at the turning of the wall, and fortified them (<a onClick="return mV(\'2Ch\',26,9);">2Ch 26:9</a>). Jotham his son, continued his father\'s labors in the further fortification of the city (<a onClick="return mV(\'2Ch\',27,3,4);">2Ch 27:3-4</a>). Hezekiah had good reason to add still further to the strength of the city, seeing that he had to bear the brunt of Sennacherib\'s expedition to the west. Sennacherib boasts that of Hezekiah\'s fortified towns, he captured 46, with innumerable fortresses besides (Schrader, Schrader, The Cuneiform Inscriptions and the Old Testament, I, 286), but he cannot tell that Jerusalem was among them, for it came through the ordeal unscathed. In the reign of Manasseh Jerusalem was captured and the king himself carried away to Nineveh, but on his repentance he was restored to the throne and set himself to strengthen the fortifications of the city (<a onClick="return mV(\'2Ch\',33,14);">2Ch 33:14</a>). The city was unable, however, to hold out against Nebuchadrezzar and his captains; for it was taken in 597 BC, and King Jehoiachin and the flower of the population were deported to Babylon. After a siege of two years it was again taken in 586 BC, and temple and city were destroyed, and the walls razed to the ground.<P>3. In the Period of the Return:<P>The patriotic labor of Nehemiah in the rebuilding of the wall of Jerusalem belongs properly to the history of the city (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</A>). In the Maccabean struggle, the Akra (1Macc 1:33; 3:45, etc.), the citadel, was long held by a Syrian garrison, and was in the end delivered up to the high priest by Demetrius (1Macc 10:32). Notable also still later was the castle of Antonia (<a onClick="return mV(\'Act\',22,24);">Ac 22:24</a>) on the site of the earlier castle of Nehemiah\'s day (<a onClick="return mV(\'Neh\',2,8);">Ne 2:8</a>; <a onClick="return mV(\'Neh\',7,2);">7:2</a>).<P>III. In the Psalms and the Prophets.<P>1. The Psalms<P>Under the image of a fortress, or mountain fastness, inaccessible to any common foot, where there is perfect safety from enemies and persecutors, the Psalmist delights to express his confidence in God. Yahweh, in virtue of His righteous judgments, is a high tower to the downtrodden, a place of refuge and security (misgabh) to those who are in trouble (<a onClick="return mV(\'Psa\',9,9);">Ps 9:9</a>). When he exults in the strength of God who has given him deliverance, he multiplies words to utter his confidence: "I love Thee, O Yahweh, my strength. Yahweh is my rock, and my fortress (metsudhah),...my God...my high tower (misgabh)" (<a onClick="return mV(\'Psa\',18,1,2);">Ps 18:1-2</a>). Thirteen times in the Psalms we find this word: <a onClick="return mV(\'Psa\',9,9);">Ps 9:9</a>; <a onClick="return mV(\'Psa\',18,2);">18:2</a>; <a onClick="return mV(\'Psa\',46,7,11);">46:7, 11</a>; <a onClick="return mV(\'Psa\',59,9,16,17);">59:9, 16-17</a> (where the King James Version translates "defence" and the Revised Version (British and American) "high tower"), etc. Elsewhere metsudhah is employed (<a onClick="return mV(\'Psa\',31,2);">Ps 31:2</a>; literally, "house of fortresses"; <a onClick="return mV(\'Psa\',91,2);">Ps 91:2</a>; <a onClick="return mV(\'Psa\',144,2);">144:2</a>). If we were at liberty to accept such psalms as <a onClick="return mV(\'Psa\',18,\'1-\');">18</a> and <a onClick="return mV(\'Psa\',59,\'1-\');">59</a> as Davidic, the appropriateness of them to the circumstances of the Shepherd King when persecuted by Saul, taking refuge in the cave of Adullam and enduring the perils and anxieties of an outlaw\'s life, would at once be apparent.<P>2. The Prophets:<P>Although Jeremiah has been called the weeping prophet, yet for the fearless fulfillment of his commission to a gainsaying people, God made him "a fortified city (\'ir mibhtsar), and an iron pillar, and brazen walls" (<a onClick="return mV(\'Jer\',1,18);">Jer 1:18</a>; compare <a onClick="return mV(\'Jer\',6,27);">Jer 6:27</a>; <a onClick="return mV(\'Jer\',15,20);">15:20</a>). Hosea in the Northern Kingdom predicted the destruction of its "fortresses" (mibhtsar) by the invading Assyrians (<a onClick="return mV(\'Hos\',10,14);">10:14</a>; compare <a onClick="return mV(\'Hos\',8,14);">8:14</a>). The prophets in proclaiming God\'s message to their day addressed themselves not only to Israel and Judah, but also to those great world-powers with which the Hebrew people had relations. In the oracles of the prophets to the nations—to Egypt, Babylon, Assyria, Syria, Edom, and others—we obtain glimpses of great and fortified cities like No-amon (Thebes), Babylon, Nineveh, Damascus, whose natural defenses and added fortifications did not save them from capture and destruction. And the teaching of the prophets for the comfort of Israel and Judah is that Yahweh was a better defense to them than the great rivers of Assyria and Egypt were to those nations. When Nineveh was at the height of her pride, fierceness and worldly glory, Nahum asks her: "Art thou better than No-amon (Thebes of Egypt), that was situate among the rivers, that had the waters round about her; whose rampart (chel) was the sea (the Nile), and her wall (chomah) was of the sea?" (<a onClick="return mV(\'Nah\',3,8);">Na 3:8</a>). Of Nineveh itself we know that it was protected, not only by walls and fortresses of great strength, but also by canals and streams drawn round the city. Yet Nahum declares in his sublime apostrophe: "All thy fortresses shall be like figtrees with the first-ripe figs: if they be shaken, they fall into the mouth of the eater" (<a onClick="return mV(\'Nah\',3,12);">Na 3:12</a>). Babylon had walls whose strength and height, as described by Herodotus and other historians, were fabulous. Its great monarch Nebuchadrezzar was in his day the greatest ruler of the East, and Sir Henry Layard has told that scarcely a brick unearthed in the mounds of the great Babylonian plain was without his name. Yet when the day of reckoning came, the wall, said to be mountain-high, and 80 ft. thick, with its moat so broad that an arrow could not be shot over it, and all its elaborate works of defense, were as if they had not been; it surrendered to Cyrus without a blow being struck. It is in the visions of the prophets, in the universal peace which is to accompany the restoration of Israel, that we hear of "them that are at rest, that dwell securely, all of them dwelling without walls, and having neither bars nor gates" (<a onClick="return mV(\'Eze\',38,11);">Eze 38:11</a>). "In that day shall this song be sung in the land of Judah: We have a strong city; salvation will he appoint for walls and bulwarks" (chel) (<a onClick="return mV(\'Isa\',26,1);">Isa 26:1</a>). "Violence shall no more be heard in thy land, desolation nor destruction within thy borders; but thou shalt call thy walls Salvation, and thy gates Praise" (<a onClick="return mV(\'Isa\',60,18);">Isa 60:18</a>). Building of fenced cities, with riding upon horses and military preparation, was a note of the false prophet, who urged alliances with foreign powers such as Assyria and Egypt, anal relied too much upon the material resources of the nation. The true prophet realized that the strength of the nation lay in God and urged the people to put their trust in Him (<a onClick="return mV(\'Hsa\',8,14);">Ho 8:14</a>). "Jerusalem," says Zechariah in the days of the Return, "shall be inhabited as villages without walls, by reason of the multitude of men and cattle therein. For I, saith Yahweh, will be unto her a wall of fire round about, and I will be the glory in the midst of her" (<a onClick="return mV(\'Zec\',2,4,5);">2:4,5</a>; compare <a onClick="return mV(\'Zec\',8,4,5);">8:4,5</a>).<P>IV. In the New Testament.<P>1. In Paul\'s Epistles:<P>In a well-known passage (<a onClick="return mV(\'2Cr\',10,\'3-5\');">2Co 10:3-5</a>), Paul, as he often does, draws upon his knowledge of Roman methods of warfare, and introduces for the enforcement of great spiritual lessons the pulling down of "strong-holds" as the ultimate object of every campaign. The word employed (ochuromata) is the Greek equivalent of the Hebrew word commonly rendered "fortress" (mibhtsar). "The \'strongholds\' are the rock forts, such as those which once bristled along the coast of his native Cilicia and of which he must often have heard when his father told him how they were \'pulled down\' by the Romans in their wars against the pirates. Those \'high things that exalt themselves\'—those high eminences of the pride of Nature—occupied in force by hostile troops—had been a familiar experience in many wars throughout Asia Minor, while one of the grandest of all was the Acropolis that towered over Corinth" (Dean Howson, The Metaphors of Paul, 34f).<P>2. In the Acts of the Apostles:<P>From the stairs of the Castle of Antonia, Paul, by leave of Claudius Lysias, the commandant of the garrison at Jerusalem, in whose charge he was, addressed the excited crowd and told the story of his conversion. Antonia was the quarters, then, as it was in the time of our Lord, of the Roman garrison, which occupied the Jewish capital (<a onClick="return mV(\'Act\',21,37);">Ac 21:37</a>; <a onClick="return mV(\'Jhn\',18,28);">Joh 18:28</a>); and the same site is to this day covered with a Turkish barracks.<P>3. In the Gospel History:<P>Although it is not mentioned by name, the gloomy fortress of Macherus on the east of the Dead Sea is believed to have been the scene of the imprisonment and murder of John the Baptist. The description of it given by Josephus (BJ, VII, vi, 1) shows it to have been a place of immense strength. "It was quite necessary that that fortress should be demolished lest it might draw away many into rebellion because of its strength; for the nature of the place was very capable of affording sure hope of safety to those who held it, and delay and fear to those who attacked it. For what was defended by a fort was itself a rocky hill, rising to a very great height, which circumstance alone made it very difficult to capture it. It was also so contrived by Nature that it could not easily be approached; for it is entrenched by ravines on all sides, so deep that the eye cannot reach their bottoms, nor are they easy to cross over, and it is quite impossible to fill them up with earth." Macherus, like the Herodium, Jotapata, Masada, figured largely in the tragic scenes of the Jewish War so graphically described by Josephus<P>LITERATURE.<P>Bliss and Macalister, Excavations in Palestine; Bliss, A Mound of Many Cities; Macalister, Bible Side-Lights from Mound of Gezer; PEFS for 1903-6, referring to Gezer; Driver, Modern Research as Illustrating the Bible; Vincent, Canaan d\'apres l\'exploration recente; Billerbeck, Der Festungsbau im alten Orient.``128';
isbe[3544]='Fortunatus`for-tu-na\'-tus (Phortounatos):<P>A Roman proper name turned into Gr; same as Latin adjective fortunatus, meaning "blest," or "fortunate." Found only once in the Bible (<a onClick="return mV(\'1Cr\',16,17);">1Co 16:17</a>). Fortunatus, with Stephanas and Achaicus, was an amabassador of the Corinthian church, whose presence at Ephesus refreshed the spirit of the apostle Paul.``1';
isbe[3545]='Fortune`for\'-tun (Gad): A god of Good Luck, possibly the Hyades.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`1';
isbe[3546]='Forty`for\'-ti (\'arba\'im; tessarakonta).`<a href="./study/isbe/search.html?string=FOUR">FOUR</a>; <a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[3547]='Forum`fo\'-rum:<P>the King James Version Appii Forum (<a onClick="return mV(\'Act\',28,15);">Ac 28:15</a>), is in the Revised Version (British and American) Market of Appius (see <a href="./study/isbe/search.html?string=APPII+FORUM">APPII FORUM</a>).``1';
isbe[3548]='Forward; Forwardness`for\'-werd for\'-werd-nes (hale\'ah, naca\'; spoudaios):<P>As an adverb "forward" has the meaning of "onward" in space or time, or in the movement of affairs. As an adjective it has the sense of "readiness," "willingness," etc. The adverb only is found in the Old Testament. It is the translation of hale\'ah, "distance," "onward"; in space (<a onClick="return mV(\'Num\',32,19);">Nu 32:19</a>; <a onClick="return mV(\'1Sa\',10,3);">1Sa 10:3</a>); in time (<a onClick="return mV(\'Eze\',39,22);">Eze 39:22</a>, "from that day and forward"; <a onClick="return mV(\'Eze\',43,27);">Eze 43:27</a>); once of halakh, "to go on" (<a onClick="return mV(\'Gen\',26,13);">Ge 26:13</a>, "went forward," the King James Version margin, Hebrew "went going," the Revised Version (British and American) "grew more and more"); twice of ma\'al, "above," "upward" (<a onClick="return mV(\'1Sa\',16,13);">1Sa 16:13</a>; <a onClick="return mV(\'1Sa\',30,25);">30:25</a>, "from that day forward"); once of ya\'al, "to cause to go up," "advance" (<a onClick="return mV(\'Job\',30,13);">Job 30:13</a>, "They set forward (advance or help on) my calamity"); twice of lephanim, "to the front" (<a onClick="return mV(\'Jer\',7,24);">Jer 7:24</a>; <a onClick="return mV(\'Eze\',10,22);">Eze 10:22</a>, "They went every one straight forward," literally, "on the side of their face"); once of qedhem, "before" (<a onClick="return mV(\'Job\',23,8);">Job 23:8</a>, "Behold, I go forward, but he is not there"); once with nakhah, "to smite" (<a onClick="return mV(\'2Ki\',3,24);">2Ki 3:24</a>); frequently in Numbers, and once in Exodus, of naca\', "to lift up," "remove," "journey" (<a onClick="return mV(\'Exd\',14,15);">Ex 14:15</a>, "Speak unto the children of Israel, that they go forward"; <a onClick="return mV(\'Num\',1,51);">Nu 1:51</a>, "when the tabernacle setteth forward"; <a onClick="return mV(\'Num\',2,24);">Nu 2:24</a> the King James Version, "They shall go forward," etc.); it is also the translation of natsach (Piel), "to be over," "to take the lead," "to superintend" (<a onClick="return mV(\'1Ch\',23,4);">1Ch 23:4</a>, "to set forward (to carry onward, to advance) the work of the house of the Lord," the King James Version margin and text of the Revised Version (British and American) "to oversee"; <a onClick="return mV(\'2Ch\',34,12);">2Ch 34:12</a>, "to set it forward," the Revised Version (British and American) retains, margin, "to preside over it"; <a onClick="return mV(\'Ezr\',3,8);">Ezr 3:8</a> margin, "set forward the work"). This word means also "to lead" in music, to precent; hence, in the title of many psalms, la-menatseach, "For the chief musician." Proerchomai, "to go forward," etc., is translated "went forward" (<a onClick="return mV(\'Mar\',14,35);">Mr 14:35</a>); propempo, "to send forward" (<a onClick="return mV(\'3Jo\',1,6);">3Joh 1:6</a>, "bring forward," the Revised Version (British and American) "set forward"); proballo, "to throw or put forward" (<a onClick="return mV(\'Act\',19,33);">Ac 19:33</a>, "putting him forward"); as adjective it is the translation of thelo, "to wish," "will" (<a onClick="return mV(\'2Cr\',8,10);">2Co 8:10</a>, "to be forward a year ago"; the King James Version margin (Greek) "willing," the Revised Version (British and American) "to will"); of spoudaios, "speedy," "earnest" (<a onClick="return mV(\'2Cr\',8,17);">2Co 8:17</a>, "being more forward," the Revised Version (British and American) "very earnest"); of spoudazo, "to make haste," "to be earnest" (<a onClick="return mV(\'Gal\',2,10);">Ga 2:10</a>, "which I also was forward to do," the Revised Version (British and American) "zealous to do").<P>"Forward" occurs several times in Apocrypha, e.g. 1Esdras 1:27, "The Lord is with me hasting me forward" (epispeudo); 2Esdras 3:6, "before ever the earth came forward" (adventaret), meaning, perhaps, before it was ready for planting.<P>Forwardness is the translation of spoude, "speed," "zeal," etc. (<a onClick="return mV(\'2Cr\',8,8);">2Co 8:8</a>, the Revised Version (British and American) "earnestness"); of prothumia "readiness of mind" (<a onClick="return mV(\'2Cr\',9,2);">2Co 9:2</a>, "the forwardness of your mind," the Revised Version (British and American) "your readiness"; The <span class="noTag">Wisdom of Solomon 14:17</span>, "that by their forwardness (spoude) they might flatter," the Revised Version (British and American) "zeal").<P>For "forward" the Revised Version (British and American) has "forth" (<a onClick="return mV(\'Num\',2,24);">Nu 2:24</a>; compare <a onClick="return mV(\'1Cr\',16,11);">1Co 16:11</a>); for "go forward" (<a onClick="return mV(\'Num\',10,5);">Nu 10:5</a>), "take their journey"; for "set forward" (<a onClick="return mV(\'Num\',21,10);">Nu 21:10</a>; <a onClick="return mV(\'Num\',22,1);">22:1</a>), "journeyed"; "forward" for "ready" (<a onClick="return mV(\'Deu\',1,41);">De 1:41</a>), for "forth" (<a onClick="return mV(\'Pro\',25,6);">Pr 25:6</a>), for "farther" (<a onClick="return mV(\'Mat\',26,39);">Mt 26:39</a>); "put forward" for "appointed" (<a onClick="return mV(\'Act\',1,23);">Ac 1:23</a>): "set forward according to" for "took" (<a onClick="return mV(\'Num\',10,12);">Nu 10:12</a>); "set forward" for "went" (<a onClick="return mV(\'Num\',10,14,34);">Nu 10:14, 34</a>), for "departed" (<a onClick="return mV(\'Num\',10,33);">Nu 10:33</a>); "set me forward" for "bring me" (<a onClick="return mV(\'1Cr\',16,6);">1Co 16:6</a>).``185';
isbe[3549]='Foul`foul (raphas; akdthartos):<P>The verb "to foul" (defile) occurs as the translation of raphas, "to trample" or "muddle" (streams) (<a onClick="return mV(\'Eze\',32,2);">Eze 32:2</a>; <a onClick="return mV(\'Eze\',34,18);">34:18</a>); of chalmar, "to burn," "to be red" (<a onClick="return mV(\'Job\',16,16);">Job 16:16</a>, "My face is foul with weeping," the American Standard Revised Version and the English Revised Version, margin "red"); of mirpas, "a treading" (<a onClick="return mV(\'Eze\',34,19);">Eze 34:19</a>). The adjective is the translation of akathartos, "unclean," "impure," "wicked" (<a onClick="return mV(\'Mar\',9,25);">Mr 9:25</a>; <a onClick="return mV(\'Rev\',18,2);">Re 18:2</a>, "foul spirit," the Revised Version (British and American) "unclean"), and of cheimon, "winter," "stormy or foul weather" (<a onClick="return mV(\'Mat\',16,3);">Mt 16:3</a>). the Revised Version (British and American) has "The rivers shall become foul" (<a onClick="return mV(\'Isa\',19,6);">Isa 19:6</a>) instead of the King James Version "They shall turn the rivers far away," the English Revised Version "The rivers shall stink."``185';
isbe[3550]='Foundation`foun-da\'-shun:<P>In Hebrew the words for "foundation" are mostly derivatives from yacadh, "to found," and in Greek two words are used: one, katabole, of "foundation of the world" (<a onClick="return mV(\'Mar\',13,35);">Mr 13:35</a>; <a onClick="return mV(\'Mar\',15,34);">15:34</a>; <a onClick="return mV(\'Luk\',11,50);">Lu 11:50</a>; <a onClick="return mV(\'Jhn\',17,24);">Joh 17:24</a>, etc.); the other, themelios, of the foundation of a building (<a onClick="return mV(\'Luk\',6,48,49);">Lu 6:48-49</a>; <a onClick="return mV(\'Luk\',14,29);">14:29</a>; <a onClick="return mV(\'Act\',16,26);">Ac 16:26</a>, etc.), in which sense it is also used metaphorically in various connections (Christ the foundation of the church, <a onClick="return mV(\'1Cr\',3,11);">1Co 3:11</a>; or the apostles and prophets the foundation, with Christ as corner-stone, <a onClick="return mV(\'Eph\',2,20);">Eph 2:20</a>; the foundation of repentance, <a onClick="return mV(\'Hbr\',6,1);">Heb 6:1</a>, etc.). In <a onClick="return mV(\'Psa\',11,3);">Ps 11:3</a>, "if the foundations be destroyed," the Hebrew word is shath. In <a onClick="return mV(\'Jer\',50,15);">Jer 50:15</a>, the Revised Version (British and American) reads "bulwarks" for "foundations"; conversely in <a onClick="return mV(\'Psa\',89,14);">Ps 89:14</a>; <a onClick="return mV(\'Psa\',97,2);">97:2</a>, for the King James Version "habitation," the Revised Version (British and American) reads "foundation," and in <a onClick="return mV(\'Isa\',6,4);">Isa 6:4</a> for the King James Version "posts," reads "foundations."``132';
isbe[3551]='Founder`foun\'-der (from tsaraph): A worker in molten metal (<a onClick="return mV(\'Jdg\',17,4);">Jud 17:4</a>, etc.).<P>The word in the King James Version in <a onClick="return mV(\'Jer\',10,9,14);">Jer 10:9, 14</a>; <a onClick="return mV(\'Jer\',51,17);">51:17</a> is rendered in the Revised Version (British and American) "goldsmith," and in <a onClick="return mV(\'Jer\',6,29);">6:29</a> by a paraphrase, "They go on refining."`<a href="./study/isbe/search.html?string=REFINER">REFINER</a>; <a href="./study/isbe/search.html?string=GOLDSMITH">GOLDSMITH</a>`1';
isbe[3552]='Fountain`foun\'-tin, foun\'-tan:<P>In a country where no rain falls for half of the year, springs sume an importance unknown in more favored lands. In both eastern and western Palestine and even in Lebanon there are many villages which depend entirely upon reservoirs or cisterns of rain water. Others are situated along the courses of the few perennial streams. But wherever a spring exists it is very apt to be the nucleus of a village. It may furnish sufficient water to be used in irrigation, in which case the gardens surrounding the village become an oasis in the midst of the parched land. Or there may be a tiny stream which barely suffices for drinking water, about which the village women and girls sit and talk waiting their turns to fill their jars, sometimes until far in the night. The water of the village fountain is often conveyed by a covered conduit for some distance from the source to a convenient spot in the village where an arch is built up, under which the water gushes out. See <a href="./study/isbe/search.html?string=CISTERN">CISTERN</a>; <a href="./study/isbe/search.html?string=SPRING">SPRING</a>; <a href="./study/isbe/search.html?string=WELL">WELL</a>; <a href="./study/isbe/search.html?string=EN-">EN-</a>, and place-names compounded with <a href="./study/isbe/search.html?string=EN-">EN-</a>.<P>Figurative:<P>(1) of God (<a onClick="return mV(\'Psa\',36,9);">Ps 36:9</a>; <a onClick="return mV(\'Jer\',2,13);">Jer 2:13</a>; <a onClick="return mV(\'Jer\',17,13);">17:13</a>);<P>(2) of Divine pardon and purification, with an obvious Messianic reference (<a onClick="return mV(\'Zec\',13,1);">Zec 13:1</a>);<P>(3) of wisdom and godliness (<a onClick="return mV(\'Pro\',13,14);">Pr 13:14</a>; <a onClick="return mV(\'Pro\',14,27);">14:27</a>);<P>(4) of wives (<a onClick="return mV(\'Pro\',5,18);">Pr 5:18</a>);<P>(5) of children (<a onClick="return mV(\'Deu\',33,28);">De 33:28</a>; compare <a onClick="return mV(\'Psa\',68,26);">Ps 68:26</a>; <a onClick="return mV(\'Pro\',5,16);">Pr 5:16</a>);<P>(6) of prosperity (<a onClick="return mV(\'Psa\',107,35);">Ps 107:35</a>; <a onClick="return mV(\'Psa\',114,8);">114:8</a>; <a onClick="return mV(\'Hsa\',13,15);">Ho 13:15</a>);<P>(7) of the heart (<a onClick="return mV(\'Ecc\',12,6);">Ec 12:6</a>; see <a href="./study/isbe/search.html?string=CISTERN">CISTERN</a>);<P>(8) of life everlasting (<a onClick="return mV(\'Rev\',7,17);">Re 7:17</a>; <a onClick="return mV(\'Rev\',21,6);">21:6</a>).``37';
isbe[3553]='Fountain Gate``<a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>`1';
isbe[3554]='Four`for (\'arba\'; tessares): "Four" (cardinal number) was a sacred and complete number with the Hebrews, as well as with several other peoples. It occurs very frequently in the Old Testament and the New Testament.<P>(1) It indicates completeness. We have the four rivers of Paradise (<a onClick="return mV(\'Gen\',2,10);">Ge 2:10</a>); the four winds of heaven (<a onClick="return mV(\'Eze\',37,9);">Eze 37:9</a>; <a onClick="return mV(\'Dan\',7,2);">Da 7:2</a>; <a onClick="return mV(\'Dan\',8,8);">8:8</a>; <a onClick="return mV(\'Dan\',11,4);">11:4</a>; <a onClick="return mV(\'Zec\',6,5);">Zec 6:5</a>, the Revised Version, margin "spirits"; 2Esdras 13:5); "the four winds" (<a onClick="return mV(\'Mat\',24,31);">Mt 24:31</a>; <a onClick="return mV(\'Mar\',13,27);">Mr 13:27</a>); "the four corners of the earth" (<a onClick="return mV(\'Isa\',11,12);">Isa 11:12</a>; <a onClick="return mV(\'Rev\',7,1);">Re 7:1</a>; <a onClick="return mV(\'Rev\',20,8);">20:8</a>, the King James Version "quarters"); "the four corners of the house" (<a onClick="return mV(\'Job\',1,19);">Job 1:19</a>); Jephthah\'s daughter was bewailed four days a year (<a onClick="return mV(\'Jdg\',11,40);">Jud 11:40</a>); "four cities" are several times mentioned in Joshua in the allotment of inheritances (<a onClick="return mV(\'Jos\',19,7);">19:7</a>; <a onClick="return mV(\'Jos\',21,18);">21:18</a>, etc.); Nehemiah\'s enemies sent to him "four times" (<a onClick="return mV(\'Neh\',6,4);">Ne 6:4</a>); "four kinds" (the Revised Version, margin "families" of destroyers were threatened, <a onClick="return mV(\'Jer\',15,3);">Jer 15:3</a>); Yahweh\'s "four sore judgments" (<a onClick="return mV(\'Eze\',14,21);">Eze 14:21</a>); "four generations" were seen by Job (<a onClick="return mV(\'Job\',42,16);">Job 42:16</a>).<P>(2) "Four" is frequent in prophetic visions: Daniel saw "four...beasts" arise, representing four kings (<a onClick="return mV(\'Dan\',7,3,17);">Dan 7:3,17</a>); "four notable horns" (<a onClick="return mV(\'Dan\',8,8,22);">Dan 8:8, 22</a>; compare 2Esdras 11:39); "four gates" (2Esdras 3:19; four wings, <span class="noTag">12:2</a> the King James Version); "four horns" were seen by Zechariah, as the powers that had scattered Israel, and "four smiths" (Revised Version) as powers that would cast the four horns down (<a onClick="return mV(\'Zec\',1,\'18-21\');">Zec 1:18-21</a>); "four chariots and...horses" represented the "four spirits," the King James Version and the Revised Version, margin (better than "winds"), that went "forth from standing before the Lord of all the earth" (<a onClick="return mV(\'Zec\',6,\'1-5\');">Zech 6:1-5</a>); in the visions of Ezekiel, "four living creatures," each with four faces, four wings, etc., were the bearers of the throne of God (<a onClick="return mV(\'Eze\',1,5);">Eze 1:5</a>f; <a onClick="return mV(\'Eze\',1,23);">23</a>); so, in the visions of John there were "four living creatures" before and around the throne (<a onClick="return mV(\'Rev\',4,6);">Re 4:6</a>; <a onClick="return mV(\'Rev\',5,6,8,14);">5:6, 8, 14</a>; <a onClick="return mV(\'Rev\',6,1);">6:1</a>; <a onClick="return mV(\'Rev\',15,7);">15:7</a>; <a onClick="return mV(\'Rev\',19,4);">19:4</a>); John saw "four angels" of destruction loosed for their work (<a onClick="return mV(\'Rev\',9,14);">Re 9:14</a>).<P>(3) "Four" occurs frequently in the measurements of the sacred buildings, etc.<P class="in15">(a) of the tabernacle (<a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>; <a onClick="return mV(\'Exd\',26,\'1-\');">26</a>; <a onClick="return mV(\'Exd\',27,\'1-\');">27</a>; <a onClick="return mV(\'Exd\',28,17);">28:17</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36</a>, etc.);<P class="in15">(b) of Solomon\'s temple (<a onClick="return mV(\'1Ki\',7,2);">1Ki 7:2</a>; <a onClick="return mV(\'1Ch\',9,24);">1Ch 9:24</a>);<P class="in15">(c) of Ezekiel\'s temple (<a onClick="return mV(\'Eze\',40,41);">Eze 40:41</a>; <a onClick="return mV(\'Eze\',41,5);">41:5</a>; <a onClick="return mV(\'Eze\',42,20);">42:20</a>; <a onClick="return mV(\'Eze\',43,14);">43:14</a>).<P>(4) "Four" is used as an alternative with "three" (<a onClick="return mV(\'Pro\',30,15,18,21,24,29);">Pr 30:15, 18, 21, 24, 29</a>); we have "three or four" (2Esdras 16:29,31); "the third and...the fourth generation" (<a onClick="return mV(\'Exd\',20,5);">Ex 20:5</a>; <a onClick="return mV(\'Exd\',34,7);">34:7</a>; <a onClick="return mV(\'Num\',14,18);">Nu 14:18</a>; <a onClick="return mV(\'Deu\',5,9);">De 5:9</a>).<P>(5) Ten times four, or forty is also a special and sacred number, e.g. forty years did Israel eat manna (<a onClick="return mV(\'Exd\',16,35);">Ex 16:35</a>); forty years in the wilderness (<a onClick="return mV(\'Num\',14,33);">Nu 14:33</a>; <a onClick="return mV(\'Num\',32,13);">32:13</a>); "the land had rest forty years" (<a onClick="return mV(\'Jdg\',3,11);">Jud 3:11</a>; <a onClick="return mV(\'Jdg\',5,31);">5:31</a>); Israel was delivered unto the hands of the Philistines for forty years (<a onClick="return mV(\'Jdg\',13,1);">Jud 13:1</a>); Eli judged Israel forty years (<a onClick="return mV(\'1Sa\',4,18);">1Sa 4:18</a>); Moses was forty years old when he visited his brethren (<a onClick="return mV(\'Act\',7,23);">Ac 7:23</a>); the flood continued for "forty days and forty nights" (<a onClick="return mV(\'Gen\',7,4);">Ge 7:4</a>); Moses was in the Mount "forty days and forty nights" (<a onClick="return mV(\'Exd\',24,18);">Ex 24:18</a>; <a onClick="return mV(\'Exd\',34,28);">34:28</a>; <a onClick="return mV(\'Deu\',9,9);">De 9:9</a>); Jesus fasted in the desert forty days and nights (<a onClick="return mV(\'Mat\',4,2);">Mt 4:2</a>); He remained with His disciples forty days after His resurrection (<a onClick="return mV(\'Act\',1,3);">Ac 1:3</a>).<P>(6) Fourscore is also frequent (shemonim) (<a onClick="return mV(\'Exd\',7,7);">Ex 7:7</a>; <a onClick="return mV(\'Jdg\',3,30);">Jud 3:30</a>; <a onClick="return mV(\'Jer\',41,5);">Jer 41:5</a>, etc.; ogdoekonta, <a onClick="return mV(\'Luk\',2,37);">Lu 2:37</a>; <a onClick="return mV(\'Luk\',16,7);">16:7</a>).<P>(7) Four hundred represents a large number, e.g. the years of the oppression in Egypt (<a onClick="return mV(\'Gen\',15,13);">Ge 15:13</a>); Esau\'s company (<a onClick="return mV(\'Gen\',33,1);">Ge 33:1</a>); the men with David (<a onClick="return mV(\'1Sa\',22,2);">1Sa 22:2</a>; <a onClick="return mV(\'1Sa\',25,13);">25:13</a>; <a onClick="return mV(\'1Sa\',30,10,17);">30:10, 17</a>); the prophets of Baal "four hundred and fifty," of Asherah, "four hundred" (<a onClick="return mV(\'1Ki\',18,19,22);">1Ki 18:19, 22</a>); the prophets of Israel (<a onClick="return mV(\'1Ki\',22,6);">1Ki 22:6</a>). Four thousand represents a larger number, e.g. the musicians and porters of Solomon\'s temple (<a onClick="return mV(\'1Ch\',23,5);">1Ch 23:5</a>); the stalls for horses in Solomon\'s stables (<a onClick="return mV(\'2Ch\',9,25);">2Ch 9:25</a>); the Assassins who made insurrection under an Egyptian (<a onClick="return mV(\'Act\',21,38);">Ac 21:38</a>); Christ fed "four thousand men, besides women and children" (<a onClick="return mV(\'Mat\',15,38);">Mt 15:38</a>). Four hundred thousand represents a very large number, e.g. the congregation of Israel that gathered at Mizpah, "four hundred thousand footmen that drew sword" (<a onClick="return mV(\'Jdg\',20,2,17);">Jud 20:2, 17</a>); Abijah\'s army (<a onClick="return mV(\'2Ch\',13,3);">2Ch 13:3</a>; Jeroboam\'s, twice that number).<P>(8) The fourth part also frequently occurs (<a onClick="return mV(\'Exd\',29,40);">Ex 29:40</a>; <a onClick="return mV(\'Lev\',23,13);">Le 23:13</a>; <a onClick="return mV(\'Num\',23,10);">Nu 23:10</a>; <a onClick="return mV(\'Rev\',6,8);">Re 6:8</a>, etc.).``185';
isbe[3555]='Four Hundred``<a href="./study/isbe/search.html?string=FOUR">FOUR</a>`1';
isbe[3556]='Four Thousand``<a href="./study/isbe/search.html?string=FOUR">FOUR</a>`1';
isbe[3557]='Fourfold`for-fold:<P>Occurs but twice in English Versions: <a onClick="return mV(\'2Sa\',12,6);">2Sa 12:6</a>, "He shall restore the lamb fourfold"; and <a onClick="return mV(\'Luk\',19,8);">Lu 19:8</a> the King James Version, "If I have wrongfully exacted ought...I restore fourfold." From this statement of Zaccheus we are to understand that fourfold the amount of that which was stolen was the restoration the law required of a thief. This was the extreme penalty the law imposed. In some cases double the amount was to be restored (<a onClick="return mV(\'Exd\',22,4,7);">Ex 22:4, 7</a>); in others, a fifth of its value was added to the thing restored (<a onClick="return mV(\'Lev\',6,5);">Le 6:5</a>); still again, an amount equal to that taken was to be restored (<a onClick="return mV(\'1Sa\',12,3);">1Sa 12:3</a>).``1';
isbe[3558]='Fourscore`for\'-skor.`<a href="./study/isbe/search.html?string=FOUR">FOUR</a>; <a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[3559]='Foursquare`for\'-skwar (rabha\'; tetragonos):<P>"Foursquare," meaning equal in length and breadth, not round, is the translation of rabha\' (from obsolete rebha\', "four"); it occurs in the description of the altar of burnt offering (<a onClick="return mV(\'Exd\',27,1);">Ex 27:1</a>; <a onClick="return mV(\'Exd\',38,1);">38:1</a>); of the altar of incense (<a onClick="return mV(\'Exd\',30,2);">Ex 30:2</a>; <a onClick="return mV(\'Exd\',37,25);">37:25</a>); of the breastplate of the high priest (<a onClick="return mV(\'Exd\',28,16);">Ex 28:16</a>; <a onClick="return mV(\'Exd\',39,9);">39:9</a>); of the panels of the gravings upon the mouth of the brazen or molten sea in Solomon\'s temple (<a onClick="return mV(\'1Ki\',7,31);">1Ki 7:31</a>); of the inner court of Ezekiel\'s temple (<a onClick="return mV(\'Eze\',40,47);">Eze 40:47</a>); of "the holy oblation" of the city of Ezekiel\'s vision (<a onClick="return mV(\'Eze\',48,20);">Eze 48:20</a>, rebhi\'i, "fourth"); of the new Jerusalem of John\'s vision (<a onClick="return mV(\'Rev\',21,16);">Re 21:16</a>, tetragonos), and conveys the idea of perfect symmetry. In the King James Version marginof <a onClick="return mV(\'1Ki\',6,31);">1Ki 6:31</a>, we have "five-square," square being formerly used for equal-sided, as it still is in "three-square file."``185';
isbe[3560]='Fourteen`for\'-ten.`<a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[3561]='Fourth Part``<a href="./study/isbe/search.html?string=FOUR">FOUR</a>`1';
isbe[3562]='Fowl`foul (\'oph; peteinon): The word is now generally restricted to the larger, especially the edible birds, but formerly it denoted all flying creatures; in <a onClick="return mV(\'Lev\',11,20);">Le 11:20</a> the King James Version we have even, "all fowls that creep, going upon all four," <a onClick="return mV(\'Lev\',11,21);">Le 11:21</a>, "every flying creeping thing that goeth upon all four."<P>1. Old Testament Terms and References:<P>The word most frequently translated "fowl" is \'oph from \'uph, "to cover," hence, wing; it is used collectively for birds and fowl in general (<a onClick="return mV(\'Gen\',1,20);">Ge 1:20</a>, etc.; <a onClick="return mV(\'Gen\',2,19,20);">2:19,20</a>, etc.); \'ayit (from \'ut, "to rush") means a ravenous beasts; or bird of prey, used collectively of ravenous birds (<a onClick="return mV(\'Gen\',15,11);">Ge 15:11</a> the King James Version; <a onClick="return mV(\'Isa\',18,6);">Isa 18:6</a> the King James Version "fowls"; <a onClick="return mV(\'Job\',28,7);">Job 28:7</a>, "a path which no fowl knoweth," the Revised Version (British and American) "no bird of prey"); in <a onClick="return mV(\'Isa\',46,11);">Isa 46:11</a> it is used as a symbol of a conqueror (compare <a onClick="return mV(\'Jer\',12,9);">Jer 12:9</a>, "bird," "birds of prey"; <a onClick="return mV(\'Eze\',39,4);">Eze 39:4</a>, "ravenous birds"); tsippor, Aramaic tsippar (from tsaphar, "to twitter or chirp"), "a chirper," denotes a small bird or sparrow (<a onClick="return mV(\'Deu\',4,17);">De 4:17</a> the King James Version; <a onClick="return mV(\'Neh\',5,18);">Ne 5:18</a>; <a onClick="return mV(\'Dan\',4,14);">Da 4:14</a>); to give the carcasses of men to the fowls (birds) of the air was an image of destruction (<a onClick="return mV(\'Deu\',28,26);">De 28:26</a> the King James Version; <a onClick="return mV(\'1Sa\',17,44,46);">1Sa 17:44, 46</a>; <a onClick="return mV(\'Psa\',79,2);">Ps 79:2</a>; <a onClick="return mV(\'Jer\',7,33);">Jer 7:33</a>, etc.); barburim, rendered (<a onClick="return mV(\'1Ki\',4,23);">1Ki 4:23</a>) "fatted fowl" (among the provisions for Solomon\'s table for one day), is probably a mimetic word, like Greek barbaros, Latin murmuro, English babble, perhaps denoting geese from their cackle (Gesenius, from barar, "to cleanse," referring to their white plumage; but other derivations and renderings are given). They might have been ducks or swans. They could have been guineas or pigeons. The young of the ostrich was delicious food, and no doubt when Solomon\'s ships brought peafowl they also brought word that they were a delicacy for a king\'s table. The domestic fowl was not common so early in Palestine, but it may have been brought by Solomon with other imports from the East; in New Testament times chickens were common; ba\'al kanaph, "owner of a wing," is used for a bird of any kind in <a onClick="return mV(\'Pro\',1,17);">Pr 1:17</a>. "In vain is the net spread in the sight of any bird," the King James Version margin Hebrew, "in the eyes of everything that hath a wing."<P>2. In the Levitical Law:<P>In the Levitical law fowls (birds) were distinguished as clean and unclean (<a onClick="return mV(\'Lev\',11,13);">Le 11:13</a>; <a onClick="return mV(\'Deu\',14,\'11-20\');">De 14:11-20</a>; compare <a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>); the first were allowed to be eaten because they fed on grains, seeds, and vegetables; the second were forbidden because they fed on flesh and carrion.<P>3. New Testament References and Illustrative Uses:<P>In the New Testament the common word for "fowl" is peteinon, "winged fowl." "The fowls of the air" (the Revised Version (British and American) "the birds of the heaven") are pointed to by our Lord as examples of the providential care of God (<a onClick="return mV(\'Mat\',6,26);">Mt 6:26</a>; <a onClick="return mV(\'Luk\',12,24);">Lu 12:24</a>); in another connection the "sparrows" (strouthion) sold cheap, probably for food, are so employed (<a onClick="return mV(\'Mat\',10,29);">Mt 10:29</a>, "Are not two sparrows sold for a penny?" <a onClick="return mV(\'Luk\',12,6);">Lu 12:6</a>, "five...for two pence"); their quickly picking up seeds from the ground is made to illustrate the influences which render "the word" powerless (<a onClick="return mV(\'Mat\',13,4);">Mt 13:4</a>); their being sheltered in the branches, the growth of the kingdom (<a onClick="return mV(\'Mat\',13,32);">Mt 13:32</a>, peteinon); the hen\'s (ornis) sheltering care for her chickens, His desire to protect and save Jerusalem (<a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>; compare 2Esdras 1:30; <a onClick="return mV(\'Rth\',2,12);">Ru 2:12</a>); the fowls were shown in vision to Peter as among the things made clean by God (<a onClick="return mV(\'Act\',10,12);">Ac 10:12</a>; <a onClick="return mV(\'Act\',11,6);">11:6</a>); in <a onClick="return mV(\'Rev\',18,2);">Re 18:2</a>; <a onClick="return mV(\'Rev\',19,17,21);">19:17, 21</a>, orneon, "bird," "fowl," a carnivorous bird (the Revised Version (British and American) "bird"), is the representative of desolation and of destruction.<P>For "fowls" the American Standard Revised Version has "birds" (<a onClick="return mV(\'Gen\',6,7,20);">Ge 6:7, 20</a>; <a onClick="return mV(\'Gen\',7,3);">7:3</a>; <a onClick="return mV(\'Lev\',20,25);">Le 20:25</a>; <a onClick="return mV(\'Act\',10,12);">Ac 10:12</a>; <a onClick="return mV(\'Act\',11,6);">11:6</a>; with the English Revised Version <a onClick="return mV(\'Mat\',6,26);">Mt 6:26</a>; <a onClick="return mV(\'Mat\',13,4);">13:4</a>; <a onClick="return mV(\'Mar\',4,4,32);">Mr 4:4, 32</a>; <a onClick="return mV(\'Luk\',8,5);">Lu 8:5</a>; <a onClick="return mV(\'Luk\',12,24);">12:24</a>; <a onClick="return mV(\'Luk\',13,19);">13:19</a>); for "every feathered fowl" (<a onClick="return mV(\'Eze\',39,17);">Eze 39:17</a>), the Revised Version (British and American) has "the birds of every sort"; for "all fowls that creep" (<a onClick="return mV(\'Lev\',11,20);">Le 11:20</a>) and for "every flying creeping thing" (<a onClick="return mV(\'Lev\',11,21);">Le 11:21</a>), "all winged creeping things."``185';
isbe[3563]='Fowl, Fatted`See <a href="./study/isbe/search.html?string=FOWL">FOWL</a>.``1';
isbe[3564]='Fowler`foul\'-er (yoqesh): A professional birdcatcher. In the days previous to firearms, birds were captured with nets spread on the ground, in traps and snares. There was a method of taking young birds from a nest, raising them by hand, and when they had become very tame, they were confined in hidden cages so that their voices would call others of their kind to the spot and they could be killed by arrows of concealed bowmen or the use of the throw-stick (Ecclesiasticus 11:30) This was a stick 1 1/2 feet in length and 1/2 inches in diameter, hurled with a rotary motion at the legs of the birds and was very effective when thrown into flocks of ground birds, such as partridge or quail, especially if the birds were running up hill. There was also a practice of sewing a captured bird\'s eyelids together and confining it so that its cries would call large numbers of birds through curiosity and they could then be taken in the several ways mentioned. The fowlers supplied the demand for doves and other birds used for caged pets, and furnished the market with wild pigeons and doves for sacrifice and such small birds as were used for food. <a onClick="return mV(\'Psa\',91,3);">Ps 91:3</a>: "For he will deliver thee from the snare of the fowler. And from the deadly pestilence."<P>This is David\'s promise that the Almighty will deliver us from the evil plans laid to ruin us, as a bird sometimes in its struggles slips the hair and escapes from the "<a href="./study/isbe/search.html?string=SNARE">snare</a>" (which see) set for it. <a onClick="return mV(\'Psa\',124,7);">Ps 124:7</a>:<P class="in15">"Our soul is escaped as a bird out of the snare of the fowlers:<br>The snare is broken, and we are escaped."<P>Here is the fulfillment of the former promise in a cry of rejoicing. Sometimes the snare held fast, sometimes it broke; then the joy in the heart of a freed man was like the wild exultation in the heart of the escaping bird. <a onClick="return mV(\'Pro\',6,5);">Pr 6:5</a>:<P class="in15">"Deliver thyself as a roe from the hands. of the hunter.<br>And as a bird from the hand of the fowler."<P>With methods so primitive as these for taking birds, it must have occurred frequently that a stunned, wounded or entrapped bird slipped even from the hand that held it and made good its escape.<P><a onClick="return mV(\'Jer\',5,26);">Jer 5:26</a>: "For among my people are found wicked men: they watch, as fowlers lie in wait; they set a trap, they catch men." Here is the plain comparison strongly drawn between wicked men entrapping their fellows and fowlers taking unsuspecting birds.<P>The last reference is in <a onClick="return mV(\'Hsa\',9,8);">Ho 9:8</a>: "Ephraim was a watchman with my God: as for the prophet, a fowler\'s snare is in all his ways, and enmity in the house of his God." Wherever he goes, the prophet is in danger of being trapped.``167';
isbe[3565]='Fox`(shu\'al; compare Arabic tha\'lab (<a onClick="return mV(\'Jdg\',15,4);">Jud 15:4</a>; <a onClick="return mV(\'Neh\',4,3);">Ne 4:3</a>; <a onClick="return mV(\'Psa\',63,10);">Ps 63:10</a>; <a onClick="return mV(\'Sgs\',2,15);">So 2:15</a>; <a onClick="return mV(\'Lam\',5,18);">La 5:18</a>; <a onClick="return mV(\'Eze\',13,4);">Eze 13:4</a>); alopex (<a onClick="return mV(\'Mat\',8,20);">Mt 8:20</a>; <a onClick="return mV(\'Luk\',9,58);">Lu 9:58</a>; <a onClick="return mV(\'Luk\',13,32);">13:32</a>)): The foxes of different parts of Europe and Western Asia differ more or less from each other, and some authors have given the local tyes distinct specific names. Tristram, for instance, distinguishes the Egyptian fox, Vulpes nilotica, of Southern Palestine, and the tawny fox, Vulpes flavescens, of the north and east It is possible that the range of the desert fox, Vulpes leucopus, of southwestern Asia may also reach Syria. We have, however, the authority of the Royal Natural History for considering all these as merely local races of one species, the common fox, Vulpes alopex or Canis vulpes. The natives of Syria and Palestine do not always distinguish the fox and jackal although the two animals are markedly different. The jackal and wolf also are frequently confounded.<P>See <a href="./study/isbe/search.html?string=DRAGON">DRAGON</a>; <a href="./study/isbe/search.html?string=JACKAL">JACKAL</A>.<P>In <a onClick="return mV(\'Psa\',63,9);">Ps 63:9</a>f we have, "Those that seek my soul, to destroy it,...shall be given over to the power of the sword: they shall be a portion for foxes" (shu\'alim). It has been thought that the jackal is meant here (Revised Version margin), and that may well be, though it is also true that the fox does not refuse carrion. In the Revised Version, margin, "jackal" is suggested in two other passages, though why is not clear, since the rendering "fox" seems quite appropriate in both. They are <a onClick="return mV(\'Neh\',4,3);">Ne 4:3</a>, ".... if a fox go up, he shall break down their stone wall," and <a onClick="return mV(\'Lam\',5,17);">La 5:17</a>f; ".... our eyes are dim; for the mountain of Zion which is desolate: the foxes walk upon it." the Revised Version, margin also has "jackals" in <a onClick="return mV(\'Jdg\',15,4);">Jud 15:4</a>f; where Samson "caught three hundred foxes...and put a firebrand in the midst between every two tails...and let them go into the standing grain of the Philistines, and burnt up both the shocks and the standing grain, and also the oliveyards." Jackals are probably more numerous than foxes, but the substitution does not appreciably diminish the difficulties in the way of any natural explanation of the story. In <a onClick="return mV(\'Sgs\',2,15);">So 2:15</a> we have a reference to the fondness of the fox for grapes. In <a onClick="return mV(\'Mat\',8,20);">Mt 8:20</a> and <a onClick="return mV(\'Luk\',9,58);">Lu 9:58</a> Jesus says in warning to a would-be follower, "The foxes have holes, and the birds of the heaven have nests; but the Son of man hath not where to lay his head." Foxes differ from most of the Canidae in burrowing holes for their lairs, unless indeed they take possession of the burrow of another animal, such as the badger. In <a onClick="return mV(\'Luk\',13,32);">Lu 13:32</a> Jesus compares Herod to a fox.``37';
isbe[3566]='Fragment`frag\'-ment (klasma): "Fragment," a piece broken off, occurs only in the plural, in the accounts of the miracles of the Loaves in the Gospels and references thereto. It is the translation of klasma (from klao, "to break"), "a piece broken off" (<a onClick="return mV(\'Mat\',14,20);">Mt 14:20</a> the King James Version); "broken meat" (<a onClick="return mV(\'Mat\',15,37);">Mt 15:37</a>).<P>The Revised Version (British and American) has in each instance "broken pieces." The change is important because it shows that the pieces left over were not mere fragments or crumbs left by the people after eating, but some of the original pieces into which it is said in all the synoptic narratives and references Jesus "broke" the "loaves," which, being thin cakes, were usually broken before distribution; hence, the phrase, "breaking of bread." See Hastings, Dictionary of the Bible (five volumes), under the word "Fragment"; Weymouth translates "broken portions," namely, "those into which the Lord had broken the loaves; not mere scraps or crumbs."``185';
isbe[3567]='Frame`fram:<P>(1) yetser (from root yatsar, "to knead," mold with the fingers): "For he knoweth our frame; he remembereth that we are dust" (<a onClick="return mV(\'Psa\',103,14);">Ps 103:14</a>).<P>(2) \'erekh (from root \'arakh, "to put in order," "to set in a row," "to arrange"): "goodly frame" (<a onClick="return mV(\'Job\',41,12);">Job 41:12</a>, the King James Version "goodly proportion").<P>(3) \'otsem "bony frame" "body": "My frame was not hidden from thee, when I was made in secret" (<a onClick="return mV(\'Psa\',139,15);">Ps 139:15</a>), the King James Version "my substance," the King James Version margin "my strength, or, my body."<P>See also <a href="./study/isbe/search.html?string=BONE;+BONES">BONE</a>.<P>(4) mibhneh, "building, frame" (<a onClick="return mV(\'Eze\',40,2);">Eze 40:2</a>, "frame of a city").<P>(5) nathan, "to give," "to direct": "They will not frame their doings" (<a onClick="return mV(\'Hsa\',5,4);">Ho 5:4</a>, the King James Version and the Revised Version, margin).<P>(6) sunarmologeo, "to fit or join closely together" (<a onClick="return mV(\'Eph\',2,21);">Eph 2:21</a>).<P>(7) katartizo, "to fit out," "make fit," "adjust" (<a onClick="return mV(\'Hbr\',11,3);">Heb 11:3</a>).``106';
isbe[3568]='Frankincense`frants\'-in-sens (lebhonah, from root meaning "whiteness," referring to the milky color of the fresh juice: <a onClick="return mV(\'Exd\',30,34);">Ex 30:34</a>; <a onClick="return mV(\'Lev\',2,1);">Le 2:1</a>f; <a onClick="return mV(\'Lev\',2,15);">15</a>f; <a onClick="return mV(\'Lev\',5,11);">5:11</a>; <a onClick="return mV(\'Lev\',6,15);">6:15</a>; <a onClick="return mV(\'Lev\',24,7);">24:7</a>; <a onClick="return mV(\'Num\',5,15);">Nu 5:15</a>; <a onClick="return mV(\'1Ch\',9,29);">1Ch 9:29</a>; <a onClick="return mV(\'Neh\',13,5,9);">Ne 13:5, 9</a>; <a onClick="return mV(\'Sgs\',3,6);">So 3:6</a>; <a onClick="return mV(\'Sgs\',4,6,14);">4:6, 14</a>; <a onClick="return mV(\'Isa\',43,23);">Isa 43:23</a>; <a onClick="return mV(\'Isa\',60,6);">60:6</a>; <a onClick="return mV(\'Isa\',66,3);">66:3</a>; <a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a>; <a onClick="return mV(\'Jer\',17,26);">17:26</a>; <a onClick="return mV(\'Jer\',41,5);">41:5</a>; translated in the last six references "incense" in the King James Version, but correctly in the Revised Version (British and American); libanos: <a onClick="return mV(\'Mat\',2,11);">Mt 2:11</a>; <a onClick="return mV(\'Rev\',18,13);">Re 18:13</a>. The English word is derived from old French franc encens, i.e. "pure incense"): The common frankincense of the pharmacopeas is a gum derived from the common fir, but the frankincense of the Jews, as well as of the Greeks and Romans, is a substance now called Olibanum (from the Arabic el luban), a product of certain trees of the genus Boswellia (Natural Order, Amyridaceae), growing on the limestone rocks of south Arabia and Somali-land (<a onClick="return mV(\'Isa\',60,6);">Isa 60:6</a>; <a onClick="return mV(\'Jer\',6,20);">Jer 6:20</a>). The most important species are B. Carteri and B. Frereana. Some of the trees grow to a considerable height and send down their roots to extraordinary depths. The gum is obtained by incising the bark,<P>and is collected in yellowish, semitransparent tears, readily pulverized; it has a nauseous taste. It is used for making incense for burning in churches and in Indian temples, as it was among the Jews (<a onClick="return mV(\'Exd\',30,34);">Ex 30:34</a>). See <a href="./study/isbe/search.html?string=INCENSE">INCENSE</a>. It is often associated with myrrh (<a onClick="return mV(\'Sgs\',3,6);">So 3:6</a>; <a onClick="return mV(\'Sgs\',4,6);">4:6</a>) and with it was made an offering to the infant Saviour (<a onClick="return mV(\'Mat\',2,11);">Mt 2:11</a>). A specially "pure" kind, lebhonah zakkah, was presented with the shewbread (<a onClick="return mV(\'Lev\',24,7);">Le 24:7</a>).``117';
isbe[3569]='Frankly`frank\'-li (charizomai):<P>"Frankly" in the sense of "freely," "readily," "graciously," occurs only in the translation of charizomai, properly "to gratify," "to do that which is grateful or pleasing," "to forgive" (<a onClick="return mV(\'Luk\',7,42);">Lu 7:42</a>, "He frankly forgave them both," the Revised Version (British and American) has simply "forgave"; the same word is translated in <a onClick="return mV(\'Luk\',7,43);">Lu 7:43</a>, the King James Version and the Revised Version (British and American), "forgave," in <a onClick="return mV(\'Luk\',7,21);">Lu 7:21</a> the King James Version it is "gave," the Revised Version (British and American) "bestowed," granted to see). It occurs in the New Testament only in Luke and Paul.``1';
isbe[3570]='Fray`fra (haradh, "to make afraid," "cause to tremble": the King James Version of <a onClick="return mV(\'Deu\',28,26);">De 28:26</a>; <a onClick="return mV(\'Jer\',7,33);">Jer 7:33</a>; <a onClick="return mV(\'Zec\',1,21);">Zec 1:21</a>; the Revised Version (British and American) "frighten," "terrify").`<a href="./study/isbe/search.html?string=WAR;+WARFARE">WAR</a>`1';
isbe[3571]='Freckled Spot`frek\'-\'-ld, (bohaq; Septuagint alphos, called in the Revised Version (British and American) "a tetter," and described as a bright shining spot (beharoth lebhenoth):<P>These white eruptions did not render the person so marked ceremonially unclean (<a onClick="return mV(\'Lev\',13,39);">Le 13:39</a>). This form of skin disease is described by Hippocrates as usually of no great importance and indicative of a sluggishness of body; it is probably some form of local psoriasis. There is a cognate modern Arabic word applied to a facial eczematous eruption. For other references to skin diseases`<a href="./study/isbe/search.html?string=LEPROSY">LEPROSY</a>`1';
isbe[3572]='Free; Freedom``<a href="./study/isbe/search.html?string=CHOICE">CHOICE</a>; <a href="./study/isbe/search.html?string=WILL">WILL</a>`1';
isbe[3573]='Freedman; Freeman`fred\'-man, fre\'-man: The term occurs in <a onClick="return mV(\'1Cr\',7,22);">1Co 7:22</a>; <a onClick="return mV(\'Col\',3,11);">Col 3:11</a>, and <a onClick="return mV(\'Rev\',6,15);">Re 6:15</a>, and represents two slightly different words. In <a onClick="return mV(\'1Cr\',7,22);">1Co 7:22</a> the word is apeleutheros, "a freeman," one who was born a slave and has received freedom. In this case it refers to spiritual freedom. He that was in bondage to sin has been presented with spiritual freedom by the Lord. In <a onClick="return mV(\'Rev\',6,15);">Re 6:15</a> the word is simply eleutheros, "a free man" as opposed to a slave.``1';
