isbe[3574]='Freely`fre\'-li (chinnam, nedhabhah; dorean parrhesiazomai):<P>"Freely" occurs in three senses:ts two slightly different words. In <a onClick="return mV(\'1Cr\',7,22);">1Co 7:22</a> the word is apeleutheros, "a freeman," one who was born a slave and has received freedom. In this case it refers to spiritual freedom. He that was in bondage to sin has been presented with spiritual freedom by the Lord. In <a onClick="return mV(\'Rev\',6,15);">Re 6:15</a> the word is simply eleutheros, "a free man" as opposed to a slave.<P>(1) Gratis, for nothing (<a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>, chinnam, "for nought," "the fish which we did eat in Egypt freely," the Revised Version (British and American) "for nought"); <a onClick="return mV(\'Mat\',10,8);">Mt 10:8</a>, dorean, "Freely ye have received, freely give," the Revised Version (British and American) omits "have"; <a onClick="return mV(\'Rom\',3,24);">Ro 3:24</a>, "being justified freely by his grace"; <a onClick="return mV(\'2Cr\',11,7);">2Co 11:7</a>, "I have preached to you the gospel freely," the Revised Version (British and American) "for nought"; <a onClick="return mV(\'Rev\',21,6);">Re 21:6</a>; <a onClick="return mV(\'Rev\',22,17);">22:17</a>, "Take the water of life freely"; charizomai (<a onClick="return mV(\'Rom\',8,32);">Ro 8:32</a>) is translated "freely give," ta charisthenta (<a onClick="return mV(\'1Cr\',2,12);">1Co 2:12</a>), "the things that are freely given," the American Standard Revised Version has "were" for "are."<P>(2) Willingly, spontaneously: nedhabhah, "willing offering" (<a onClick="return mV(\'Psa\',54,6);">Ps 54:6</a>, "I will freely sacrifice unto thee," the Revised Version (British and American) "with a freewill-offering"; <a onClick="return mV(\'Hsa\',14,4);">Ho 14:4</a>, "I will love them freely"); nadhabh, "to give willingly”(<a onClick="return mV(\'Ezr\',2,68);">Ezr 2:68</a>, the Revised Version (British and American) "willingly offered"; compare <a onClick="return mV(\'Ezr\',1,6);">1:6</a>); nedabh Aramaic (<a onClick="return mV(\'Ezr\',7,15);">7:15</a>; compare <a onClick="return mV(\'Ezr\',7,13,16);">7:13,16</a>).<P>(3) Without hindrance or restraint, \'akhal, "to eat" is rendered in <a onClick="return mV(\'Gen\',2,16);">Ge 2:16</a>, "Thou mayest freely eat," the King James Version margin" Hebrew, eating thou shalt eat"; <a onClick="return mV(\'1Sa\',14,30);">1Sa 14:30</a>, "if...the people had eaten freely"; parrhesiazomai, "to speak freely, openly, boldly" (<a onClick="return mV(\'Act\',26,26);">Ac 26:26</a>, "Unto whom also I speak freely"); meta parrhesias, "with full speech" (<a onClick="return mV(\'Act\',2,29);">Ac 2:29</a>, "I may say unto you freely").<P>Revised Version has "have drunk freely" for "well drunk" (<a onClick="return mV(\'Jhn\',2,10);">Joh 2:10</a>). The word is methusko, Pass. "to become drunk." Comparison with <a onClick="return mV(\'Luk\',12,45);">Lu 12:45</a>; <a onClick="return mV(\'Eph\',5,18);">Eph 5:18</a>; <a onClick="return mV(\'1Th\',5,7);">1Th 5:7</a>; <a onClick="return mV(\'Rev\',17,2);">Re 17:2</a>, where the same word is translated the King James Version "made drunk," the Revised Version (British and American) "made drunken" (<a onClick="return mV(\'Mat\',24,49);">Mt 24:49</a>; <a onClick="return mV(\'Act\',2,15);">Ac 2:15</a>; <a onClick="return mV(\'1Cr\',11,21);">1Co 11:21</a>; <a onClick="return mV(\'Rev\',17,6);">Re 17:6</a>, "drunken"), will show that the meaning is "drunk," which was the rendering of Tyndale and Cranmer; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) has cum inebriati fuerint; Plummer renders "have become drunk, are drunk."``185';
isbe[3575]='Freewill Offering`fre\'-wil of\'-er-ing.`<a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>`1';
isbe[3576]='Freewoman`fre\'-woom-an (eleuthera): Found but 4 times in the King James Version (<a onClick="return mV(\'Gal\',4,22,23,30,31);">Ga 4:22-23, 30-31</a>). In the first three passages it refers to Sarah, the freewoman and true wife of Abraham as in contrast with Hagar, the Egyptian slave girl who became his concubine (<a onClick="return mV(\'Gen\',16,1);">Ge 16:1</a>). In the last passage a metaphorical application of the term is made to the Christians who are the children of promise, of freedom, of the spirit, the children of the freewoman, in contrast with the Jews who are the children of the letter, of bondage, of the bondwoman.``1';
isbe[3577]='Frequent`fre\'-kwent (peris-soteros):<P>"Frequent," adjective (from Latin frequens, frequentis, "crowded") occurs only once in the text of the King James Version, as the translation of perissoteros, adverb in comparative degree of perissos, "abundantly," hence, "more abundantly" (compare <a onClick="return mV(\'2Cr\',1,12);">2Co 1:12</a>); in <a onClick="return mV(\'2Cr\',11,23);">2Co 11:23</a>, "in prisons more frequent," the Revised Version (British and American) "more abundantly"; and once in the margin of the King James Version (<a onClick="return mV(\'Pro\',27,6);">Pr 27:6</a>) as translation of \'athar, "to be abundant," the Revised Version (British and American) in text, "profuse."<P>American Revised Version has "frequent" for "open" (<a onClick="return mV(\'1Sa\',3,1);">1Sa 3:1</a>, "The word of Yahweh was precious (margin, rare) in those days; there was no frequent vision," margin "(Hebrew) widely spread" (the word is parac, "to break forth," "to scatter," etc.). the English Revised Version retains "open," with "frequent, Hebrew widely spread" in the margin. "Frequent" (the verb) does not occur.``185';
isbe[3578]='Fresh`Adj.:<P>The translation of hadhash, "new," "fresh" (<a onClick="return mV(\'Job\',29,20);">Job 29:20</a>, "My glory is fresh in me"); of leshadh, "sap," "moisture" (<a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>, of the manna, "as the taste of fresh oil," the Revised Version, margin "cakes baked with oil"); of ra\'anan, "to be fresh and green" (<a onClick="return mV(\'Psa\',92,10);">Ps 92:10</a>, "fresh oil"); of glukus, "sweet" (<a onClick="return mV(\'Jam\',3,12);">Jas 3:12</a>, "salt water and fresh," the Revised Version (British and American) "sweet"). Fresher is the translation of rutaphash, "to become fresh" (<a onClick="return mV(\'Job\',33,25);">Job 33:25</a>; "His flesh shall be fresher than a child\'s").<P>Revised Version has "fresh" for "green" (<a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a>; <a onClick="return mV(\'Lev\',23,14);">Le 23:14</a>), for "moist" (<a onClick="return mV(\'Num\',6,3);">Nu 6:3</a>), for "full" (<a onClick="return mV(\'Lev\',2,14);">Le 2:14</a>; <a onClick="return mV(\'2Ki\',4,42);">2Ki 4:42</a>), for "new" (<a onClick="return mV(\'Jdg\',15,15);">Jud 15:15</a>; <a onClick="return mV(\'Mat\',9,17);">Mt 9:17</a>; <a onClick="return mV(\'Mar\',2,22);">Mr 2:22</a>; <a onClick="return mV(\'Luk\',5,38);">Lu 5:38</a>).``185';
isbe[3579]='Fret, Fretting`(charah, ma\'ar):<P>To "fret" is from for (prefix) and etan, "to eat," "to consume." The word is both transitive and intransitive in King James Version:<P>(1) transitive as translation of charah, "to burn," Hithpael, "to fret one\'s self," "to be angry" (<a onClick="return mV(\'Psa\',37,1);">Ps 37:1</a>, "Fret not thyself because of evil-doers"; <a onClick="return mV(\'Psa\',37,7,8);">Ps 37:7-8</a>; <a onClick="return mV(\'Pro\',24,19);">Pr 24:19</a>); of qatsaph, "to be angry," etc. (<a onClick="return mV(\'Isa\',8,21);">Isa 8:21</a>, "They shall fret themselves, and curse," etc.); of raghaz, to be moved" (with anger, etc.) (<a onClick="return mV(\'Eze\',16,43);">Eze 16:43</a>, "Thou hast fretted me in all these things," the American Standard Revised Version "raged against me"). For <a onClick="return mV(\'Lev\',13,55);">Le 13:55</a>, see under Fretting below.<P>(2) Intransitive, it is the translation of ra\'am, "to rage," Hiphil, "to provoke to anger" (<a onClick="return mV(\'1Sa\',1,6);">1Sa 1:6</a>, "Her rival provoked her sore, to make her fret"); of za\'aph, "to be sad," "to fret" (<a onClick="return mV(\'Pro\',19,3);">Pr 19:3</a>, "His heart fretteth against Yahweh").<P>Fretting in the sense of eating away, consuming, is used of the leprosy, ma\'ar, "to be sharp, bitter, painful" (<a onClick="return mV(\'Lev\',13,51,52);">Le 13:51-52</a>; <a onClick="return mV(\'Lev\',14,44);">14:44</a>, "a fretting leprosy"; in <a onClick="return mV(\'Lev\',13,55);">Le 13:55</a> we have "it (is) fret inward" ("fret" past participle), as the translation of pehetheth from pahath, "to dig" (a pit), the word meaning "a depression," "a hollow or sunken spot in a garment affected by a kind of leprosy," the Revised Version (British and American) "it is a fret."<P>Revised Version has "fretful" for "angry" (<a onClick="return mV(\'Pro\',21,19);">Pr 21:19</a>), margin "vexation."``185';
isbe[3580]='Fried`frid.`<a href="./study/isbe/search.html?string=BREAD">BREAD</a>; <a href="./study/isbe/search.html?string=FOOD">FOOD</a>; <a href="./study/isbe/search.html?string=LOCUST">LOCUST</a>`1';
isbe[3581]='Friend; Friendship`frend, frend\'-ship: In the Old Testament two words, variously translated "friend" or "companion": re\'eh, indicating a mere associate, passing friend, neighbor, or companion; \'ahabh, indicating affection natural or unnatural. In the New Testament also two words: hetairos, "a comrade," or "fellow," and philos, suggesting a more affectionate relation.<P>Literature abounds in concrete examples of friendship of either kind noted above, and of profoundly philosophic as well as sentimental and poetic expositions of the idea of friendship. Notable among these are the Old Testament examples. Abraham, because of the intimacy of his relations, was called "the friend of God" (<a onClick="return mV(\'2Ch\',20,7);">2Ch 20:7</a>; <a onClick="return mV(\'Isa\',41,8);">Isa 41:8</a>; <a onClick="return mV(\'Jam\',2,23);">Jas 2:23</a>). "Yahweh spake unto Moses face to face, as a man...unto his friend" (<a onClick="return mV(\'Exd\',33,11);">Ex 33:11</a>). The romantic aspect of the friendship of Ruth and Naomi is interesting (<a onClick="return mV(\'Rth\',1,\'16-18\');">Ru 1:16-18</a>). The devotion of Hushai, who is repeatedly referred to as David\'s friend (<a onClick="return mV(\'2Sa\',15,37);">2Sa 15:37</a>; <a onClick="return mV(\'2Sa\',16,16);">16:16</a>), is a notable illustration of the affection of a subordinate for his superior. The mutual friendship of David and Jonathan (<a onClick="return mV(\'1Sa\',18,1);">1Sa 18:1</a>), from which the author is made to say, "The soul of Jonathan was knit with the soul of David, and Jonathan loved him as his own soul," is another example. Again in his pathetic lament for Jonathan (<a onClick="return mV(\'2Sa\',1,26);">2Sa 1:26</a>), David says in highly emotional tones that his love "was wonderful, passing the love of women." Elijah and Elisha form a unique illustration of semiprofessional affection (<a onClick="return mV(\'2Ki\',2,\'1-\');">2Ki 2</a>).<P>In the New Testament, Jesus and His disciples illustrate the growth of friendship from that of teacher and disciple, lord and servant, to that of friend and friend (<a onClick="return mV(\'Jhn\',15,\'13-15\');">Joh 15:13-15</a>). Paul and Timothy are likewise conspicuous (<a onClick="return mV(\'2Ti\',1,2);">2Ti 1:2</a>).<P>In general literature we have the classic incident, recorded by Plutarch, of Damon and Pythias during the rule of Dionysius. Pythias, condemned to death, was about to be executed but desired to see his family. Damon offered himself as a ransom in case he should not return in time for the hour of execution. Returning in time, both were released by the great Dionysius, who asked to be taken into the secret of such friendship. The writings on friendship are many. Plato and Cicero have immortalized themselves by their comments. Cicero held dearly the friendship of Scipio, declaring that of all that Nature or Fortune ever gave him there was nothing which could compare with the friendship of Scipio. Bacon, Emerson, Black, Gladden, King, Hillis, and many others in later days have written extensively concerning friendship. The best illustration of the double use of the word (see above) is that in <a onClick="return mV(\'Pro\',18,24);">Pr 18:24</a>, "He that maketh many friends doeth it to his own destruction; but there is a friend that sticketh closer than a brother." Again, "Iron sharpeneth iron; so a man sharpeneth the countenance of his friend" (<a onClick="return mV(\'Pro\',27,17);">27:17</a>). The honesty and frankness of genuine friends are set forth in the maxim, "Faithful are the wounds of a friend" (<a onClick="return mV(\'Pro\',27,6);">27:6</a>).``25';
isbe[3582]='Friends; Chief Friends`(hoi philoi proton): Expressions used in 1 and 2Macc to designate the favored courtiers of the Antiochi. Mattathias is promised enrollment among the king\'s Friends, to tempt him to apostatize (1Macc 2:18); Alexander Balas writes Jonathan among his Chief Friends (1Macc 10:65). Compare also 1Macc 3:38; 6:10,14; 10:60; 11:26,27; 2Macc 8:9.``1';
isbe[3583]='Fringes`frin\'-jis (tsitsith, "tassel, lock" (<a onClick="return mV(\'Num\',15,38,39);">Nu 15:38-39</a>), gedhilim, "twisted threads," "festoons" (<a onClick="return mV(\'Deu\',22,12);">De 22:12</a>)): Tassels worn by the Israelites on the four corners of their garments as reminders of "all the commandments of Yahweh," in accordance with the law set out in <a onClick="return mV(\'Num\',15,\'37-41\');">Nu 15:37-41</a> and <a onClick="return mV(\'Deu\',22,12);">De 22:12</a>. These tassels originally contained a thread of tekheleth, "violet." Jewish tradition, however, has failed to retain the tekheleth, because of doubt as to the exact meaning of the term, and instead dark blue lines were dyed on the borders of the Tallith or garment in which the fringes were placed. According to tradition any garment having four corners required the mnemonic fringes, the importance of which was weighed against "all the commandments of the Lord." In New Testament times such garments were still worn (compare <a onClick="return mV(\'Mat\',9,20);">Mt 9:20</a>; <a onClick="return mV(\'Mat\',14,36);">14:36</a>; <a onClick="return mV(\'Mat\',23,5);">23:5</a>). The later Jews, after adopting the garments of the Diaspora, in order to observe the tsitsith commandment began to use two extra four-cornered fringed garments: the large Tallith while at prayer, and the small Tallith, or \'arba\' kanephoth, as an undergarment during the day. Their tradition prescribes the exact manner in which each tassel shall be made, and gives a symbolic meaning to the numbers of windings and knots, somewhat after the manner of the string-writing of several early civilizations (compare the Peruvian quipus). Thus in the tsitsith a long cord is wrapped around seven shorter cords first seven times, then eight, then eleven, and finally thirteen, each series being separated from the others by two knots. The numbers seven and eight constituting fifteen together suggest YH, and the number eleven, WH. Together they make up the holy name YaHWeH. The number thirteen stands for echadh, the letters of which taken as numerals equal thirteen. The sentence Yahweh \'echadh means "Yahweh is one." Many other suggestions, more or less fanciful, have been worked out, all tending to associate the fringes with the Law in the mind of the wearer.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`80';
isbe[3584]='Frock`frok (simlah; homolinon): The hempen frock, mentioned in Ecclesiasticus 40:4 as a mark of the lowly, was a simple garment consisting of a square piece of cloth wrapped around the body. It is the same as the garment (simlah) which we find the poor man using as his only bed covering by night (<a onClick="return mV(\'Exd\',22,26);">Ex 22:26</a>f); the traveler, as the receptacle for his belongings (compare <a onClick="return mV(\'Exd\',12,34);">Ex 12:34</a>); and the common people of both sexes as their general outer garments, though there was some difference in appearance between the simlah of the man and that of the woman (<a onClick="return mV(\'Deu\',22,5);">De 22:5</a>).`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`80';
isbe[3585]='Frog`(tsephardea\'; compare Arabic dafda\' (<a onClick="return mV(\'Exd\',8,2);">Ex 8:2</a>ff; <a onClick="return mV(\'Psa\',78,45);">Ps 78:45</a>; <a onClick="return mV(\'Psa\',105,30);">105:30</a>); batrachos (<a onClick="return mV(\'Rev\',16,13);">Re 16:13</a>)): The references in Psalms, as well as in Exodus, are to the plague of flogs. In <a onClick="return mV(\'Rev\',16,13);">Re 16:13</a> we have, "And I saw coming out of the mouth of the dragon, and out of the mouth of the beast, and out of the mouth of the false prophet, three unclean spirits, as it were frogs." The word tsephardea\' probably referred both to frogs and to toads, as does the Arabic dafda\'. In Palestine and Syria Rana esculenta, Bufo viridis and Hyla arborea are common. According to Mr. Michael J. Nicoll, assistant director of the Zoological Gardens at Gizah, near Cairo, the commonest Egyptian species are Rana mascariensis and Bufo regularis. Rana esculenta, Bufo viridis and Bufo vittatus are also found, but are much less common.``37';
isbe[3586]='Frontier`fron\'-ter, frun\'ter (katseh): The word occurs once in plural in <a onClick="return mV(\'Eze\',25,9);">Eze 25:9</a>. the Revised Version, margin has "in every quarter."``1';
isbe[3587]='Frontlets`frunt\'-lets (totaphoth, from tuph, "to bind"): Ornaments worn on the forehead, particularly <a href="./study/isbe/search.html?string=Phylactery">phylacteries</a> (which see), which were worn in this manner and also on the arms (<a onClick="return mV(\'Exd\',13,16);">Ex 13:16</a>; <a onClick="return mV(\'Deu\',6,8);">De 6:8</a>; <a onClick="return mV(\'Deu\',11,18);">11:18</a>; compare also <a onClick="return mV(\'Exd\',13,9);">Ex 13:9</a>).``1';
isbe[3588]='Frost`frost (kephor, "hoar-frost," <a onClick="return mV(\'Exd\',16,14);">Ex 16:14</a>; <a onClick="return mV(\'Job\',38,29);">Job 38:29</a>; chanamal, perhaps "the aphis," <a onClick="return mV(\'Psa\',78,47);">Ps 78:47</a>; qerach, "cold," <a onClick="return mV(\'Gen\',31,40);">Ge 31:40</a>; <a onClick="return mV(\'Job\',37,10);">Job 37:10</a> the King James Version; <a onClick="return mV(\'Jer\',36,30);">Jer 36:30</a>):<P>1. Formation:<P>A temperature of freezing or lower is called frost. Dew forms when the temperature is decreased; and if below freezing, the dew takes the form of a white film or covering over rocks and leaves. This white covering is called hoar-frost. Like dew it is the result of condensation of the moisture of the air on objects which radiate their heat quickly. In order that condensation may take place the atmosphere must be saturated. Frost may be expected on clear, still nights when the radiation is sufficient to reduce the temperature below the freezing-point.<P>In Syria and Palestine frost is a very rare occurrence at sea-level; but on the hills and elevated plains it is usual in winter, beginning with November, and on the highest elevations throughout the year. Late spring frosts in March or early April do great damage to fruit.<P>2. In Syria and Palestine:<P>In clear weather there is often a great variation in the temperature of the day and the night, especially on the inland plains, so that literally, as Jacob said to Laban, "In the day the drought consumed me, and the frost by night" (<a onClick="return mV(\'Gen\',31,40);">Ge 31:40</a>); "In the day to the heat, and in the night to the frost" (<a onClick="return mV(\'Jer\',36,30);">Jer 36:30</a>; compare <a onClick="return mV(\'Jer\',22,19);">Jer 22:19</a>), a passage which suggests that Jehoiakim\'s corpse was left unburied.<P>3. In Egypt:<P>The meaning of chanamal, translated "frost" in <a onClick="return mV(\'Psa\',78,47);">Ps 78:47</a> (see above), "He destroyed...their sycomore-trees with frost" (m "great hail stones"), is uncertain. "Frost is unknown in Egypt, and Gesenius suggests \'ants,\' comparing it with Arabic namal" (Temple, BD, S.V.).<P>4. Figurative Uses:<P>The manna in the wilderness is compared to hoarfrost. "A small round thing, small as the hoarfrost" (<a onClick="return mV(\'Exd\',16,14);">Ex 16:14</a>). Manna is occasionally found in Syria now as a flaky, gelatinous substance formed on bushes and rocks. The elements of Nature are indications of God\'s power, and are referred to as signs of His might: "By the breath of God frost is given" (<a onClick="return mV(\'Job\',37,10);">Job 37:10</a> the King James Version). "The hoary frost of heaven, who hath gendered it?" (<a onClick="return mV(\'Job\',38,29);">Job 38:29</a>); "He destroyed their vines with hail, and their sycamore-trees with frost" (<a onClick="return mV(\'Psa\',78,47);">Ps 78:47</a>); "He scattereth the hoar-frost like ashes" (<a onClick="return mV(\'Psa\',147,16);">Ps 147:16</a>).``85';
isbe[3589]='Frowardness`fro\'-werd-nes: The translation of tahpukhoth the plural of tahpukhah, "perversity," "foolishness" (from haphakh, "to turn about") in <a onClick="return mV(\'Pro\',2,14);">Pr 2:14</a>, "delight in the frowardness of the wicked," the American Standard Revised Version "the perverseness of evil," margin "the evil man" (compare <a onClick="return mV(\'Pro\',2,12);">2:12</a>; some render "deceit"); <a onClick="return mV(\'Pro\',6,14);">6:14</a> the American Standard Revised Version, "perverseness"; <a onClick="return mV(\'Pro\',10,32);">10:32</a>, "the mouth of the wicked speaketh frowardness," the American Standard Revised Version "speaketh perverseness," margin "is."``1';
isbe[3590]='Fruit`froot.`<a href="./study/isbe/search.html?string=FOOD">FOOD</a>; <a href="./study/isbe/search.html?string=BOTANY">BOTANY</a>; <a href="./study/isbe/search.html?string=APPLE;+APPLE-TREE">APPLE</a>; <a href="./study/isbe/search.html?string=FIG,+FIG-TREE">FIG</a>; <a href="./study/isbe/search.html?string=VINE">VINE</a>`1';
isbe[3591]='Frustrate`frus\'-trat (parar; atheteo): "Frustrate" (from frustra, "vain") is the translation of parar, "to break," "to make void," "to bring to nothing" (<a onClick="return mV(\'Ezr\',4,5);">Ezr 4:5</a>), "to frustrate their purpose" (<a onClick="return mV(\'Isa\',44,25);">Isa 44:25</a>, "that frustrateth the signs of the liars"); of atheteo, "to displace," "to reject or make void or null": <a onClick="return mV(\'Gal\',2,21);">Ga 2:21</a>, "I do not frustrate the grace of God" (by setting up the righteousness which is "through the law"), the Revised Version (British and American) "make void"; compare 1Macc 11:36, "Nothing hereof shall be revoked," the Revised Version (British and American) "annulled" (atheteo).<P>Revised Version has "frustrateth" for "disappointeth" (<a onClick="return mV(\'Job\',5,12);">Job 5:12</a>, parar).<P>The adjective appears (2Esdras 10:34), "frustrate of my hope" (Judith 11:11, "frustrate of his purpose" (apraktos)).``185';
isbe[3592]='Frying-Pan`fri\'-ing-pan.`<a href="./study/isbe/search.html?string=BREAD">BREAD</a>; <a href="./study/isbe/search.html?string=PAN">PAN</a>`1';
isbe[3593]='Fuel`fu\'-el (\'okhlah, or ma\'akholeth, "food"): Is mentioned specifically only in the Old Testament, in <a onClick="return mV(\'Isa\',9,5,19);">Isa 9:5, 19</a>; <a onClick="return mV(\'Eze\',15,4,6);">Eze 15:4, 6</a>; <a onClick="return mV(\'Eze\',21,32);">21:32</a>. Its general, literal meaning in these connections is "food for fire," and might include any sort of combustible material. The common forms of fuel were wood of various sorts (even including thorns, <a onClick="return mV(\'Psa\',58,9);">Ps 58:9</a>; <a onClick="return mV(\'Psa\',118,12);">118:12</a>; <a onClick="return mV(\'Ecc\',7,6);">Ec 7:6</a>), and dried stalks of flowers or grass (<a onClick="return mV(\'Mat\',6,30);">Mt 6:30</a>), charred wood as charcoal (<a onClick="return mV(\'Lev\',16,12);">Le 16:12</a>; <a onClick="return mV(\'Isa\',44,19);">Isa 44:19</a>, and frequently), and dried dung (<a onClick="return mV(\'Eze\',4,12,15);">Eze 4:12, 15</a>). There is no certain indication that our coal was known to the Hebrews as fuel, and their houses, being without chimneys, were not constructed for the extensive use of fuel for warmth.``41';
isbe[3594]='Fugitive`fu\'-ji-tiv (palit, from palat, "to escape"; na\', from nua\', "to waver"; nophel, from naphal, "to fall"; bariach, beriach and mibhrach, from barach, "to flee"):<P>One who flees from danger (<a onClick="return mV(\'Isa\',15,5);">Isa 15:5</a>; <a onClick="return mV(\'Eze\',17,21);">Eze 17:21</a>); escapes from bondage (2Macc 8:35 (as adjective)); deserts from duty (<a onClick="return mV(\'Jdg\',12,4);">Jud 12:4</a>; <a onClick="return mV(\'2Ki\',25,11);">2Ki 25:11</a> the King James Version; compare Judith 16:12 the King James Version), or wanders aimlessly (<a onClick="return mV(\'Gen\',4,12,14);">Ge 4:12, 14</a>).``1';
isbe[3595]='Fulfil`fool-fil\' (male; pleroo, teleo, with other words): "Fulfill" is used<P>(1) in a sense more or less obsolete, "to fill up," complete (<a onClick="return mV(\'Gen\',29,21,28);">Ge 29:21, 28</a>; <a onClick="return mV(\'Exd\',23,26);">Ex 23:26</a>; <a onClick="return mV(\'Job\',36,17);">Job 36:17</a>, the Revised Version (British and American) "full," margin "filled up"; <a onClick="return mV(\'Mat\',3,15);">Mt 3:15</a>, "to fulfill all righteousness"; <a onClick="return mV(\'Phl\',2,2);">Php 2:2</a>, "Fulfil ye my joy," the American Standard Revised Version "make full"; compare <a onClick="return mV(\'2Cr\',10,6);">2Co 10:6</a>);<P>(2) in the sense of "to accomplish," "to carry into effect," as to fulfill the word of Yahweh (<a onClick="return mV(\'1Ki\',2,27);">1Ki 2:27</a>; <a onClick="return mV(\'1Ki\',8,15,24);">8:15, 24</a>; <a onClick="return mV(\'2Ch\',36,21);">2Ch 36:21</a>, etc.); in the New Testament very frequently used of the fulfillment of prophetic Scripture (<a onClick="return mV(\'Mat\',1,22);">Mt 1:22</a>; <a onClick="return mV(\'Mat\',2,15);">2:15</a>, etc.). Love is declared to be "the fulfillment (pleroma, "fullness") of the law" (<a onClick="return mV(\'Rom\',13,10);">Ro 13:10</a>). For "fulfill" the Revised Version (British and American) has "do" (<a onClick="return mV(\'Rev\',17,17);">Re 17:17</a>); for "fulfilled" has "performed" (<a onClick="return mV(\'2Sa\',14,22);">2Sa 14:22</a>), "accomplished" (<a onClick="return mV(\'Ezr\',1,1);">Ezr 1:1</a>; <a onClick="return mV(\'Mat\',5,18);">Mt 5:18</a>; <a onClick="return mV(\'Mat\',24,34);">24:34</a>; <a onClick="return mV(\'Luk\',21,32);">Lu 21:32</a>; <a onClick="return mV(\'Jhn\',19,28);">Joh 19:28</a>), with numerous other changes.``185';
isbe[3596]='Fuller`fool\'-er (kabhac; literally, "to trample," gnapheus): The fuller was usually the dyer, since, before the woven cloth could be properly dyed, it must be freed from the oily and gummy substances naturally found on the raw fiber. Many different substances were in ancient times used for cleansing. Among them were white clay, putrid urine, and the ashes of certain desert plants (Arabic qali, Biblical "soap"; <a onClick="return mV(\'Mal\',3,2);">Mal 3:2</a>). The fuller\'s shop was usually outside the city (<a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a>; <a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>; <a onClick="return mV(\'Isa\',36,2);">36:2</a>), first, that he might have sufficient room to spread out his cloth for drying and sunning, and second, because of the offensive odors sometimes produced by his processes. The Syrian indigo dyer still uses a cleaning process closely allied to that pictured on the Egyptian monuments. The unbleached cotton is soaked in water and then sprinkled with the powdered ashes of the ishnan, locally called qali, and then beaten in heaps on a flat stone either with another stone or with a large wooden paddle. The cloth is washed free from the alkali by small boys treading on it in a running stream or in many changes of clean water (compare En-rogel, literally, "foot fountain," but translated also "fuller\'s fountain" because of the fullers\' method of washing their cloth). Mark describes Jesus\' garments at the time of His transfiguration as being whiter than any fuller on earth could whiten them (<a onClick="return mV(\'Mar\',9,3);">Mr 9:3</a>).``133';
isbe[3597]='Fuller\'s Field, the`fool\'-ers feld, (sedheh khobhec): In all references occurs "the conduit of the upper pool, in the highway of the fuller\'s field"; this must have been a well-known landmark at Jerusalem in the time of the monarchy. Here stood Rabshakeh in his interview with Eliakim and others on the wall (<a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a>; <a onClick="return mV(\'Isa\',36,2);">Isa 36:2</a>); clearly the highway was within easy earshot of the walls. Here Isaiah met Ahaz and Shear-jashub his son by command of Yahweh (<a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>). An old view placed these events somewhere near the present Jaffa Gate, as here runs an aqueduct from the Birket Mamilla outside the walls of the Birket Hamam el Batrah, inside the walls; the former was considered the "Upper Pool" and is traditionally called the "Upper Pool" of Gihon. But these pools and this aqueduct are certainly of later date (see <a href="./study/isbe/search.html?string=JERUSALEM, 1">JERUSALEM</a>). Another view puts this highway to the north side of the city, where there are extensive remains of a "conduit" running in from the north. In favor of this is the fact that the north was the usual side for attack and the probable position for Rabshakeh to gather his army; it also suits the conditions of <a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>. Further, Josephus (BJ, V, iv, 2) in his description of the walls places a "Monument of the Fuller" at the northeast corner, and the name "fuller" survived in connection with the north wall to the 7th century, as the pilgrim Arculf mentions a gate. West of the Damascus gate called Porta Villae Fullonis. The most probable view, however, is that this conduit was one connected with Gihon, the present "Virgin\'s Fountain" (see <a href="./study/isbe/search.html?string=GIHON+(2)">GIHON</a>). This was well known as "the upper spring" (<a onClick="return mV(\'2Ch\',32,30);">2Ch 32:30</a>), and the pool, which, we know, was at the source, would probably be called the "Upper Pool." In this neighborhood—or lower down the valley near En-rogel, which is supposed by some to mean "the spring of the fuller"—is the natural place to expect "fulling." Somewhere along the Kidron valley between the Virgin\'s Fountain and the junction with the Tyropeon was the probable scene of the interview with Rabshakeh; the conversation may quite probably have occurred across the valley, the Assyrian general standing on some part of the cliffs now covered by the village of Siloam.``117';
isbe[3598]='Fuller\'s Fountain``<a href="./study/isbe/search.html?string=EN+ROGEL">EN-ROGEL</a>`1';
isbe[3599]='Fullness`fool\'-nes: The translation of pleroma, which is generally, but not invariably, rendered "fullness" in the New Testament. Etymologically, pleroma—which itself is derived from the verb pleroo, "I fill"—signifies "that which is or has been filled"; it also means "that which fills or with which a thing is filled"; then it signifies "fullness," "a fulfilling."<P>1. "Fullness" in the Gospels:<P>In the Gospels it occurs as follows: <a onClick="return mV(\'Mat\',9,16);">Mt 9:16</a> and <a onClick="return mV(\'Mar\',2,21);">Mr 2:21</a>: in both of these passages it means "the fullness," that by which a gap or rent is filled up, when an old garment is repaired by a patch; <a onClick="return mV(\'Mar\',6,43);">Mr 6:43</a>, \'They took up fragments, the fullness of twelve baskets\'; <a onClick="return mV(\'Mar\',8,20);">8:20</A>, \'The fullness of how many baskets of fragments did ye take up?\' <a onClick="return mV(\'Jhn\',1,16);">Joh 1:16</a>, \'out of his fullness we all received.\'<P>2. Its Use in the Pauline Epistles:<P>Elsewhere in the New Testament "fullness" is used by Paul alone, who employs it 12t, in addition to the frequent use he makes of the verb "to fill." Of these 12, no fewer than 6 are in Ephesians and Colossians. The references are these: <a onClick="return mV(\'Rom\',11,12);">Ro 11:12</a>, "If...their loss (is) the riches of the Gentiles; how much more their fullness?" The "fullness" of Israel here refers to their being, as a nation, received by God to a participation in all the benefits of Christ\'s salvation. <a onClick="return mV(\'Rom\',11,25);">Ro 11:25</a>, "A hardening...hath befallen Israel, until the fullness of the Gentiles be come in." <a onClick="return mV(\'Rom\',13,10);">Ro 13:10</a>, "Love...is the fulfillment (the fulfilling) of the law"; that is, love is not a partial fulfillment, by obedience to this or that commandment, but a complete filling up of what the law enjoins. <a onClick="return mV(\'Rom\',15,29);">Ro 15:29</a>, "I shall come in the fullness of the blessing of Christ." <a onClick="return mV(\'1Cr\',10,26);">1Co 10:26</a>, "The earth is the Lord\'s, and the fullness thereof." <a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>, "when the fullness of the time came." The fullness of the time is that portion of time by which the longer antecedent period is completed. <a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>, "unto a dispensation of the fullness of the times." <a onClick="return mV(\'Eph\',1,23);">Eph 1:23</a>, "the church, which is his body, the fullness of him that filleth all in all." The church is the fullness of Christ; the body of believers is filled with the presence, power, agency and riches of Christ. <a onClick="return mV(\'Eph\',3,19);">Eph 3:19</a>, "that ye may be filled unto all the fullness of God"—that ye may be wholly filled with God and with His presence and power and grace. <a onClick="return mV(\'Eph\',4,13);">Eph 4:13</a>, "unto the measure of the stature of the fullness of Christ." <a onClick="return mV(\'Col\',1,19);">Col 1:19</a>, "In him should all the fullness dwell." <a onClick="return mV(\'Col\',2,9);">Col 2:9</a>, "In him dwelleth all the fullness of the Godhead bodily" (compare <a onClick="return mV(\'Luk\',2,40,52);">Lu 2:40, 52</a>; <a onClick="return mV(\'Luk\',4,1);">4:1</a>).<P>3. "Fullness" in Ephesians and Colossians:<P>"Fullness" in Ephesians and Colossians is used to present some of the most prominent thoughts in these epistles, sometimes referring to Christ, sometimes to the church and the individual Christian. Christ is Himself to "fulfill" all things in heaven and on earth (<a onClick="return mV(\'Eph\',4,10);">Eph 4:10</a> King James Version margin). We cannot separate "the fullness of Christ" in this passage (<a onClick="return mV(\'Eph\',4,13);">Eph 4:13</a>) from the statement in <a onClick="return mV(\'Eph\',1,23);">Eph 1:23</a>, that the Christ is being fulfilled, and finds His fullness in the church. When all the saints have come to the unity which is their destined goal, or in other words, to the full-grown man, the Christ will have been fulfilled. Thus they will have together reached "the full measure of the maturity of the fullness of the Christ" (J. Armitage Robinson, Commentary on Ephesians, 183). The church and individual believers, have, by faith, the full possession of all that Christ has to impart—the grace and comfort and strength of Christ received by them now. Compare <a onClick="return mV(\'Jhn\',1,16);">Joh 1:16</a>; \'In him ye are complete, are made full\' (<a onClick="return mV(\'Col\',2,10);">Col 2:10</a>); that is, the fullness of moral, intellectual and spiritual perfection is communicated by Christ to all who are united to Him. "When as the result of the Holy Spirit\'s inward strengthening, Christ dwells in the heart, and His knowledge-surpassing love is known, the only limit to spiritual excellence is \'to be filled unto all the fullness of God\'!"(HDB, 735).<P>4. Its Use by the False Teachers at Colosse:<P>In the passages from Colossians, "the fullness" in Christ is contrasted with the mediating eons or angel-powers or spiritual manifestations supposed to be intermediate between God and the world. The false teachers at Colosse seem to have used "fullness," as a technical or semi-technical term, for the purpose of their philosophical or theosophical teaching, employing it to signify the entire series of angels or eons, which filled the space or interval between a holy God and a world of matter, which was conceived of as essentially and necessarily evil. Teaching of this sort was entirely derogatory to the person and work of Christ. In opposition, therefore, to the Colossian false teaching in regard to "the fullness," Paul shows what the facts really are, that in Christ dwells all the fullness of the Godhead bodily.<P>5. The Fullness in Christ:<P>The fullness of the Godhead is the totality of the Divine powers and attributes, all the wealth of the being and of the nature of God—eternal, infinite, unchangeable in existence, in knowledge, in wisdom, in power, in holiness, in goodness, in truth, in love. This is the fullness of the nature of God—life, light, love; and this has its permanent, its settled abode in Christ. All that is His own by right is His by His Father\'s good pleasure also. It was the Father\'s good pleasure that in Christ should all the fullness dwell.<P>Any limitation, therefore, of the meaning of "fullness," which would make the indwelling of the fullness of the Godhead in Christ a matter either of the future, or of the past only, is inconsistent with what is said of "the fullness" in Him, in <a onClick="return mV(\'Col\',1,19);">Col 1:19</a>; <a onClick="return mV(\'Col\',2,9);">2:9</a>. The reference in both passages is to the timeless and eternal communication of the fullness of the Godhead from the Father to the Son.<P>It was in a sense developed along the lines of the Colossian teaching regarding "the fullness," that the Gnostics afterward used the term.`<a href="./study/isbe/search.html?string=GNOSTICISM">GNOSTICISM</a>`155';
