isbe[1859]='Carcas`kar\'-kas (karkac): One of seven chamberlains, ordered to summon Queen Vashti before King Ahasuerus (<a onClick="return mV(\'Est\',1,10);">Es 1:10</a>). The Targum allegorizes the first five of the names.``1';
isbe[1860]='Carcass; Carcase`kar\'-kas: The dead body of a beast; used sometimes in a contemptuous way of the dead body of a human being. The use of the word as applied to a living body is not found in either Old Testament or New Testament.<P>(1) It occurs as a translation of the Hebrew pegher, in <a onClick="return mV(\'Gen\',15,11);">Ge 15:11</a>; this Hebrew word is also translated "dead body" in <a onClick="return mV(\'Num\',14,29);">Nu 14:29</a>; <a onClick="return mV(\'1Sa\',17,46);">1Sa 17:46</a>; <a onClick="return mV(\'Isa\',34,3);">Isa 34:3</a>; <a onClick="return mV(\'Isa\',66,24);">66:24</a>; <a onClick="return mV(\'Eze\',6,5);">Eze 6:5</a>; <a onClick="return mV(\'Eze\',43,7);">43:7:9</a>, and "corpse" in <a onClick="return mV(\'Nah\',3,3);">Na 3:3</a>.<P>(2) The Hebrew nebhelah, is also translated "carcass" in <a onClick="return mV(\'Lev\',5,2);">Le 5:2</a>; <a onClick="return mV(\'Lev\',11,8,11);">11:8, 11</a>; <a onClick="return mV(\'Jer\',16,18);">Jer 16:18</a>, but as "dead body" in <a onClick="return mV(\'Deu\',28,26);">De 28:26</a> ("body," <a onClick="return mV(\'Jos\',8,29);">Jos 8:29</a>; <a onClick="return mV(\'1Ki\',13,22,29);">1Ki 13:22, 29</a>; <a onClick="return mV(\'2Ki\',9,37);">2Ki 9:37</a>); <a onClick="return mV(\'Isa\',5,25);">Isa 5:25</a>; <a onClick="return mV(\'Jer\',7,33);">Jer 7:33</a>; <a onClick="return mV(\'Jer\',16,4);">16:4</a>; <a onClick="return mV(\'Jer\',19,7);">19:7</a>.<P>(3) In <a onClick="return mV(\'Jdg\',14,8);">Jud 14:8</a> the word mappelah, from naphal, "to incline" or "fall," is also translated "carcass."<P>(4) In <a onClick="return mV(\'Mat\',24,28);">Mt 24:28</a> the word "carcase" (not "carcass") is used to render the Greek ptoma, the reference probably being here to the dead body of an animal For the body of a human being the Greek is translated "corpse" (<a onClick="return mV(\'Mat\',14,12);">Mt 14:12</a>; <a onClick="return mV(\'Mar\',6,29);">Mr 6:29</a>; <a onClick="return mV(\'Mar\',15,45);">15:45</a>), and "dead bodies" (<a onClick="return mV(\'Rev\',11,8,9);">Re 11:8-9</a>).``164';
isbe[1861]='Carchemish`kar\'-ke-mish (karkemish; Charmeis, Karchameis): An exceedingly ancient Hittite city on the banks of the Euphrates, identified with Jerablus (Hierapolis) about 23 hours from Aleppo, between Birejik and Membij. The Assyrian form of the name is Kargamis or Gargamis, but its meaning is doubtful, the interpretation "Fort of the god Chemosh" having been suggested before it was known that the Assyrian-Babylon form of Chemosh was not Kamish or Gamish, but Kammusu (Kammosu). Systematic excavations on the site have apparently only just been made, those undertaken by Consul J. Henderson, after the death of G. Smith the Assyriologist, having been mainly devoted to the excavation of sculptures, etc. The site has vast walls and palace-mounds about. 8,000 ft. in circumference.<P>1. Evidence of the City\'s Early Existence:<P>The earliest occurrence of the name is in an adjectival form, namely, Karkarnisu, "Carchemishite," applied to a vase or measure of 200 qa, in a list of property at Sippar in the reign of Ammi-caduga (circa 1900 BC). Later on, the Egyptian poet known as Pentaur refers to the people of Carchemish (Qarqamesa) as forming, with the men of Arvad, Aleppo and Gozan, part of "the host of the miserable king of the Hittites" (Hattu-sil), who fought against Rameses II at the battle of Kadesh. The first Assyrian king to mention Carchemish is Tiglath-pileser I (circa 1268 BC), who states that he plundered "from the neighborhood of the land of Suhu (the Shuhites) as far as Carchemish of the land of Hattu" in one day.<P>2. Its Later History:<P>Later, the city attracted the attention of the Assyrian king Assur-nacir-apli, who started on the 8th of Iyyar, about the year 870 BC, to the conquest of the district, and received tribute from the son of Bit-Bahiani; and, a little later, from Sangara of Carchemish, who is described as king of the Hittites. This tribute consisted of 20 talents of silver, various objects of gold, 100 talents of copper, 250 talents of iron, furniture, chariots and horses—an enormous treasure. Shalmaneser II, son of Assur-nacir-apli, also took tribute from the king of Carchemish here referred to. On the first occasion when the two monarchs met, Sangara was in alliance with the Sam\'alians, Patinians, and Til-Bursip. After the capture of Sazabe (858 BC), a strong city of Sangara of Carchemish, all the opposing princes submitted. The tribute paid by the Hittite king on this occasion is depicted on strip F of the bronze coverings of the gates of Balawat, which has four representations of the place—two in the upper and two in the lower row of reliefs. The Kurkh monolith states that the tribute consisted of "2 talents of gold, 70 talents of silver, 80 talents of bronze, 100 talents of iron, 30 talents of purple stuff, 500 weapons, his daughter with a dowry, and 100 daughters of his great men, 500 oxen, and 5,000 sheep." A yearly tax was also imposed. The reliefs show two long trains of tribute-bearers, that in the lower row escorting the princess, who, apparently accompanied by her father, goes to meet the Assyrian king. Samsi-Adad, Shalmaneser II\'s son, merely mentions Carchemish as being on the western limits of his empire.<P>3. Tiglath-pileser IV Receives Its Tribute, and Sargon of Assyria Incorporates It:<P>In the time of Tiglath-pileser IV, the city was ruled by King Pisiri(s), who paid tribute as an Assyrian vassal. On the accession of Sargon of Assyria, however, Pisiris tried to throw off the Assyrian yoke, and made alliance with Meta of Moschi (Mesech) and other rulers, but was taken prisoner in the operations which followed. In the subsequent plundering of the city, those who suffered most were the inhabitants of the city who had been most active against Assyria. These were carried captive, and their places filled, as was the custom, by Assyrian settlers. The city\'s importance under Assyrian rule continued, the "mana of Carchemish" being one of the standard weights in use at Nineveh. After incorporation into the Assyrian empire it was ruled by Assyrian governors, one of whom, Bel-emuranni, was eponym for. the year 691 BC (reign of Sennacherib). The Old Testament gives later details. In the time of Josiah, Pharaoh Necoh marched to fight against the city, and the Jewish king went out to meet him, but lost his life at Megiddo (<a onClick="return mV(\'2Ch\',35,20);">2Ch 35:20</a>ff). Four years later (605 BC), the Egyptian king was himself defeated by Nebuchadrezzar under the walls of the city (<a onClick="return mV(\'Jer\',46,2);">Jer 46:2</a>) in the battle which decided the fate of Western Asia.<P>4. Sculpture and Inscriptions Found at Carchemish:<P>The art of Carchemish was that of the Hittite nation to which the city belonged, but it was strongly influenced by the style of the Assyrians, and exhibits a mannerism if anything more pronounced. The Inscriptions found on the site are in the usual Hittite style—boldly carved natural objects and implements in relief arranged in boustrophedonbands between division-lines. It is not improbable, however, that cuneiform was also used, and texts in Phoenician characters may, by chance, be found. The patron-deity of the city was the Asiatic goddess Atargatis, whose worship, when the place lost its importance, was removed to the new Hierapolis now represented by the ruins of Membij.``136';
isbe[1862]='Care; Carefulness; Careful`kar, kar\'-fool-ness, kar\'-fool: The English word "care" has such a variety of meanings, and so many Hebrew and Greek words in the Bible are translated by this English expression and its compounds, that it is difficult to organize them into a single brief article. We may do so, however, by remembering that into our word are really woven two strands, one Teutonic and one Latin. The former element implies a measure of trouble or sorrow, as the pain from a blow, a throb, a distress in the mind; the latter, from Latin cura, implies a stretching forward, attention to some person or thing. We can often discern these two senses side by side in the Bible, and sometimes they almost run into one another. This is so especially in the King James Version. We can treat the subject best by keeping separate, as far as possible, these two senses.<P>I. In the Sense of Anxiety, Solicitude.<P>1. Substantives:<P>In the Old Testament several words are translated "care" in this sense. "Thy father hath left off caring for the asses," concern about them literally, "matters of the asses" (dibhre, <a onClick="return mV(\'1Sa\',10,2);">1Sa 10:2</a>). "They shall eat bread by weight, and with care" (de\'-aghah, "carefulness" the Revised Version (British and American); "fearfulness" the American Standard Revised Version, <a onClick="return mV(\'Eze\',4,16);">Eze 4:16</a>). The same word is rendered carefulness (the King James Version and the Revised Version (British and American); "fearfulness," the American Standard Revised Version, <a onClick="return mV(\'Eze\',12,\'18-19\');">Eze 12:18-19</a>); and "fear" (King James Version; "carefulness," the Revised Version (British and American) and the American Standard Revised Version, <a onClick="return mV(\'Jos\',22,24);">Jos 22:24</a>). Again, "heaviness" (the Kings James Version; the Revised Version (British and American) and the American Standard Revised Version), but "care" (the Revised Version, margin and the American Revised Version, margin, <a onClick="return mV(\'Pro\',12,25);">Pr 12:25</a>). Once more, "sorrow" (the King James Version, the Revised with Version (British and American) and the American Standard Revised Version), but "care" (the Revised Version, margin and the American Revised Version, margin, <a onClick="return mV(\'Jer\',49,23);">Jer 49:23</a>). There is also the word charadhah "trembling," "fear," "anxiety." It is rendered "trembling" (<a onClick="return mV(\'Gen\',27,33);">Ge 27:33</a> the King James Version). But "thou hast been careful for us all this care" ("showed us all this reverence," the Revised Version, margin, the American Revised Version, margin, <a onClick="return mV(\'2Ki\',4,13);">2Ki 4:13</a>). In the New Testament, "care," in the sense of anxiety, is the meaning given to merimna, the condition of being drawn mentally in different directions, distraction of mind. "Care of the world" (<a onClick="return mV(\'Mat\',13,22);">Mt 13:22</a>; <a onClick="return mV(\'Mar\',4,19);">Mr 4:19</a>; <a onClick="return mV(\'Luk\',8,14);">Lu 8:14</a>, "cares of this life," <a onClick="return mV(\'Luk\',21,34);">Lu 21:34</a>); "care of all the churches" (<a onClick="return mV(\'2Cr\',11,28);">2Co 11:28</a>) ("anxiety," the Revised Version (British and American) and the American Standard Revised Version); "casting all your care upon him" ("anxiety," the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'1Pe\',5,7);">1Pe 5:7</a>). Also in the Apocrypha, "My heart faileth for care" (1Macc 6:10); "Care bringeth old age before the time" (Sirach 30:24). To these may be added the adjective amerimnos, "I would have you without carefulness" (King James Version; "free from cares," the Revised Version (British and American) and the American Standard Revised Version, <a onClick="return mV(\'1Cr\',7,32);">1Co 7:32</a>).<P>2. Verbs:<P>In the Old Testament (da\'agh, "to have concern or anxiety for"). "Not be careful in the year of drought" (<a onClick="return mV(\'Jer\',17,8);">Jer 17:8</a>). (sum lebh, "to set the heart upon"), "If we flee away, they will not care for us" ("set their heart upon us" King James Version, margin, <a onClick="return mV(\'2Sa\',18,3);">2Sa 18:3</a>).<P>In the New Testament (memrinao), "Thou art careful and troubled" ("anxious" the Revised Version (British and American) and the American Standard Revised Version, <a onClick="return mV(\'Luk\',10,41);">Lu 10:41</a>). "He that is unmarried careth for things that belong to the Lord" ("is careful for," the Revised Version (British and American) and the American Standard Revised Version, <a onClick="return mV(\'1Cr\',7,\'32-34\');">1Co 7:32-34</a>). "Members should have the same care one for another" (<a onClick="return mV(\'1Cr\',12,25);">1Co 12:25</a>). "Who will naturally care (the American Standard Revised Version "care truly") for your state" (<a onClick="return mV(\'Phl\',2,20);">Php 2:20</a>). "Be careful for nothing" ("in nothing be anxious," the Revised Version (British and American) and the American Standard Revised Version, <a onClick="return mV(\'Phl\',4,6);">Php 4:6</a>). The Apocrypha has "careful" (Baruch 3:18) and the Revised Version (British and American) has "be not careful overmuch," where a distinction is plainly made between care in the sense of anxiety and of attention, for a person cannot be too attentive, but he may be too anxious (2Esdras 2:27).<P>The impersonal verb (melei), though not quite so strong as merimnao, always implies a degree of concern higher than is felt in mere attention. "Carest thou not that we perish?" (<a onClick="return mV(\'Mar\',4,38);">Mr 4:38</a>). "Carest not for anyone" (the King James Version "no man," <a onClick="return mV(\'Mat\',22,16);">Mt 22:16</a>; <a onClick="return mV(\'Mar\',12,14);">Mr 12:14</a>). "Dost thou not care that my sister did leave me to serve alone?" (<a onClick="return mV(\'Luk\',10,40);">Lu 10:40</a>). "Careth not for the sheep" (<a onClick="return mV(\'Jhn\',10,13);">Joh 10:13</a>). "Cared for the poor" (<a onClick="return mV(\'Jhn\',12,6);">Joh 12:6</a>). "Gallio cared for none of these things" (<a onClick="return mV(\'Act\',18,17);">Ac 18:17</a>). "Care not for it" (<a onClick="return mV(\'1Cr\',7,21);">1Co 7:21</a>). "He careth for you" (<a onClick="return mV(\'1Pe\',5,7);">1Pe 5:7</a>). "Doth God care for oxen?" (better, "Is it for the oxen that God careth?" the Revised Version (British and American) and the American Standard Revised Version, <a onClick="return mV(\'1Cr\',9,9);">1Co 9:9</a>).<P>II. In the Sense of Attention.<P>1. Substantives:<P>In the sense of attention, with the flavor of earnestness added from the original Teutonic meaning of the word care, we have the translation of spoude, "speed," "earnest care." "What carefulness it wrought in you" ("earnest care," the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'2Cr\',7,11);">2Co 7:11</a>). "Our care for you in the sight of God" ("earnest care," the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'2Cr\',7,12);">2Co 7:12</a>). "Put the same care into the heart of Titus" ("earnest care," the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'2Cr\',8,16);">2Co 8:16</a>). We have also phronein, the infin. used as a substantive "Your care for me hath flourished" ("thought," the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'Phl\',4,10);">Php 4:10</a>). Also phrontis, "thought" ("care" the American Standard Revised Version, The <span class="noTag">Wisdom of Solomon 6:17; 7:4</span>).<P>2. Verbs:<P>"A land which Yahweh thy God careth for" darash, "seek after" ("seeketh after," the Revised Version, margin, the American Revised Version, margin, <a onClick="return mV(\'Deu\',11,12);">De 11:12</a>). "No man careth for my soul" ("sought" King James Versions margin, <a onClick="return mV(\'Psa\',142,4);">Ps 142:4</a>; chashach). "We are not careful to answer" (King James Version, also compare the margin, the American Revised Version, margin; "We have no need to answer," the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'Dan\',3,16);">Da 3:16</a>). In the New Testament epimeleomai, "Take care of him" (<a onClick="return mV(\'Luk\',10,34,35);">Lu 10:34-35</a>). "How shall he take care of the church of God?" (<a onClick="return mV(\'1Ti\',3,5);">1Ti 3:5</a>). phrontizo, "to be thoughtful or mindful of," "may be careful to maintain good works" (<a onClick="return mV(\'1Ti\',3,5);">1Ti 3:8</a>).``177';

isbe[1865]='Carefully`kar\'-fool-i: The same two strands of anxiety and of attention appear in this word as in care. Several words in the Hebrew and Greek are thus rendered in the English versions "Anxiously" is the thought in "The inhabitants of Maroth waited carefully for good" (chalah, "to be in pain," "was grieved" King James Version margin, "waiteth anxiously" the Revised Version (British and American), the American Standard Revised Version, "is in travail" the Revised Version, margin, the American Revised Version, margin, <a onClick="return mV(\'Mic\',1,12);">Mic 1:12</a>).<P>In the sense of attentively, the Hebrew emphatic expression, the infinite absolute with the finite verb is rendered "carefully" in, "Thou shalt carefully hearken" (literally "hearing, thou shalt hear," "diligently hearken" the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'Deu\',15,5);">De 15:5</a>). The same Hebrew is rendered "diligently hearken" the King James Version; "hearken diligently" the Revised Version (British and American), the American Standard Revised Version (<a onClick="return mV(\'Deu\',11,13);">De 11:13</a>; <a onClick="return mV(\'Deu\',28,1);">28:1</a>).<P>In the New Testament spoudaioteros, "I sent him the more carefully" ("diligently" the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'Phl\',2,28);">Php 2:28</a>)). The verb (ekzeteo, "I seek out," is translated "seek carefully": "though he sought it carefully with tears" ("diligently" the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'Hbr\',12,17);">Heb 12:17</a>).<P>The Revised Version (British and American) adds others (akriboo, "I ascertain exactly"), "learned of them carefully" the Revised Version (British and American) ("diligently" the King James Version; "exactly" the American Standard Revised Version, <a onClick="return mV(\'Mat\',2,7,16);">Mt 2:7, 16</a>). The adverb akribos, "search out carefully" the Revised Version (British and American) ("diligently" the King James Version; "exactly" the American Standard Revised Version, <a onClick="return mV(\'Mat\',2,8);">Mt 2:8</a>). "Taught carefully" the Revised Version (British and American) ("diligently" the King James Version; "accurately" the American Standard Revised Version, <a onClick="return mV(\'Act\',18,25);">Ac 18:25</a>). "More carefully" the Revised Version (British and American) ("more perfectly" the King James Version, "more accurately" the American Standard Revised Version, <a onClick="return mV(\'Act\',18,26);">Ac 18:26</a>). episkopeo, "I oversee," is rendered "look carefully" (Revised Version, the American Standard Revised Version, "look diligently" the King James Version, <a onClick="return mV(\'Hbr\',12,15);">Heb 12:15</a>).<P>In the Apocrypha merimao is translated "carefully," as "We should carefully think of thy goodness" ("ponder" the Revised Version (British and American), The <span class="noTag">Wisdom of Solomon 12:22</span>).``177';
isbe[1866]='Careless; Carelessly`kar\'-les, kar\'-les-li: These words always mean, "without anxiety," the confidence springing from a sense of security. There is both the verb batach, "he trusted," and the noun betach, "Ye careless daughters" (the Revised Version, margin "confident") (<a onClick="return mV(\'Isa\',32,\'9-11\');">Isa 32:9-11</a>). People dwelt careless ("in security" the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'Jdg\',18,7);">Jud 18:7</a>); "careless Ethiopians" (<a onClick="return mV(\'Eze\',30,9);">Eze 30:9</a>). "Thou that dwellest carelessly" ("sittest securely" the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'Isa\',47,8);">Isa 47:8</a>). "Thou that dwellest carelessly" ("securely" the Revised Version (British and American), the American Standard Revised Version, "confidently" King James Version, margin, <a onClick="return mV(\'Eze\',39,6);">Eze 39:6</a>). "The city that dwelt carelessly" (<a onClick="return mV(\'Zep\',2,15);">Ze 2:15</a>). the American Standard Revised Version and the Revised Version (British and American) add bazah, "he despised," using the participle in "He that is careless of his ways shall die," "despiseth" the King James Version, the American Revised Version, margin, the Revised Version, margin (<a onClick="return mV(\'Pro\',19,16);">Pr 19:16</a>).``177';
isbe[1867]='Carem`ka\'-rem (Karem): A city of Judah interpolated by the Septuagint (<a onClick="return mV(\'Jos\',15,59);">Jos 15:59</a>). Probably <a href="./study/isbe/search.html?string=BETH-HACCHEREM">BETH-HACCHEREM</a> (which see).``1';
isbe[1868]='Caria`ka\'-ri-a (Karia): A country in the southwest of Asia Minor which extended on the north to Lydia, on the east to Phrygia, on the south to Lycia, and the west to the Aegean Sea. Its borders, however, like those of most of the ancient countries of Asia Minor, were never definitely fixed; hence, the difficulty presented by the study of the political divisions. The general surface of the country is rugged, consisting of mountainous ridges running across it, and terminating as promontories jutting into the sea. Its history consists chiefly of that of its practically independent cities of which Miletus (<a onClick="return mV(\'Act\',20,\'15-20\');">Ac 20:15-20</a>) and Cnidus (<a onClick="return mV(\'Act\',27,7);">Ac 27:7</a>) are the chief. For some time previous to 168 BC it had lost its independence, and belonged to the island of Rhodes, but in that year Rome made it again free. According to 1Macc 15:23, Caria was one of several places to which the Roman senate in 139-138 BC sent letters in favor of the Jews, a fact showing that its population was mixed. Its coast cities, however, were peopled chiefly by Greeks. In 129 BC Caria became a part of the Roman province of Asia, and from that date its history coincides with that of the province. Though Paul and others of the apostles traversed Caria in their missionary journeys, only its cities are mentioned by name in that connection.``7';
isbe[1869]='Carites`kar\'-i-tez (kari), (" one ready," "life-guardsman"): A body of troops mentioned in <a onClick="return mV(\'2Ki\',11,4,19);">2Ki 11:4, 19</a> (the King James Version "captains"). Instead of <a href="./study/isbe/search.html?string=CHERETHITES">CHERETHITES</a> (which see), the Kethibh of <a onClick="return mV(\'2Sa\',20,23);">2Sa 20:23</a> offers the reading Carites.``1';
isbe[1870]='Carmanians`kar-ma\'-ni-anz.`<a href="./study/isbe/search.html?string=CARMONIANS">CARMONIANS</a>`1';
isbe[1871]='Carme`kar\'-me`<a href="./study/isbe/search.html?string=CHARME">CHARME</a>`1';
isbe[1872]='Carmel`kar\'-mel (karmel, or, with article, ha-karmel, "fruit garden"; Josephus, ho Karmelos, Karmelion oros):<P>(1) A beautifully wooded mountain range running for about 13 miles in a south-easterly direction from the promontory which drops on the shore of the Mediterranean near Haifa, at the southern extremity of the plain of Acre, to the height of el-Machraqah which overlooks the plain of Esdraelon. On the top of the promontory, at a height of 500 ft. the monastery of Elias stands. From this point there is a gradual ascent until the greatest height is reached at Esfiyeh (1,742 ft.), the peak at el-Machraqah being only some 55 ft. lower. The mountain—usually named with the article, "the Carmel"—still justifies its name, "the garden with fruit trees." The steep slopes on the north and east, indeed, afford little scope for cultivation, although trees and brushwood grow abundantly. But to the south and west the mountain falls away to the sea and the plain in a series of long, fertile valleys, where the "excellency" of Carmel finds full illustration today. There are a few springs of good water; but the main supply is furnished by the winter rains, which are caught and stored in great cisterns. The villages on the slopes have a look of prosperity not too often seen in Syria, the rich soil amply rewarding the toil of the husbandmen. Oak and pine, myrtle and honeysuckle, box and laurel flourish; the sheen of fruitful olives fills many a hollow; and in the time of flowers Carmel is beautiful in a garment of many colors. Evidences of the ancient husbandry which made it famous are found in the cisterns, and the oil and wine presses cut in the surface of the rock. There is probably a reference to the vine culture here in <a onClick="return mV(\'2Ch\',26,10);">2Ch 26:10</a>. In the figurative language of Scripture it appears as the symbol of beauty (<a onClick="return mV(\'Sgs\',7,5);">So 7:5</a>), of fruitfulness (<a onClick="return mV(\'Isa\',35,2);">Isa 35:2</a>), of majesty (<a onClick="return mV(\'Jer\',46,18);">Jer 46:18</a>), of prosperous and happy life (<a onClick="return mV(\'Jer\',50,19);">Jer 50:19</a>). The languishing of Carmel betokens the vengeance of God upon the land (<a onClick="return mV(\'Nah\',1,4);">Na 1:4</a>); and her decay, utter desolation (<a onClick="return mV(\'Amo\',1,2);">Am 1:2</a>; <a onClick="return mV(\'Isa\',33,9);">Isa 33:9</a>).<P>Asylum and Sanctuary:<P>Roughly triangular in form, with plains stretching from its base on each of the three sides, the mountain, with its majestic form and massive bulk, is visible from afar. Its position deprived it of any great value for military purposes. It commanded none of the great highways followed by armies: the passes between Esdraelon and Sharon, to the east of Carmel, furnishing the most convenient paths. But the mountain beckoned the fugitive from afar, and in all ages has offered asylum to the hunted in its caves and wooded glens. Also its remote heights with their spacious outlook over land and sea; its sheltered nooks and embowering groves have been scenes of worship from old time. Here stood an ancient altar of Yahweh (<a onClick="return mV(\'1Ki\',18,30);">1Ki 18:30</a>). We may assume that there was also a sanctuary of Baal, since the worshippers of these deities chose the place as common ground for the great trim (<a onClick="return mV(\'1Ki\',18,\'1-\');">1Ki 18</a>). The scene is traditionally located at el-Machraqah, "the place of burnt sacrifice," which is still held sacred by the Druzes. A Latin chapel stands near, with a great cistern. A good spring is found lower down the slope. Just below, on the north bank of the Kishon stands the mound ca11ed Tell el-qissis, "mound of the priest." From the crest of Carmel Elijah descried the coming storm, and, descending the mountain, ran before the chariot of Ahab to the gate of Jezreel (<a onClick="return mV(\'1Ki\',18,42);">1Ki 18:42</a>ff). Under the monastery on the western promontory is a cave, said to be that of Elijah. An older tradition locates the cave of the prophet at ed-Deir, near \'Ain es-Sih. It may have been the scene of the events narrated in <a onClick="return mV(\'2Ki\',1,9);">2Ki 1:9</a>ff. Elisha also was a familiar visitor to Mt. Carmel. It was within the territory allotted to Asher; in later times it passed into the hands of Tyre (BJ, III, iii, 1).<P>(2) A city of Judah, in the uplands near Hebron, named with Maon and Ziph (<a onClick="return mV(\'Jos\',15,55);">Jos 15:55</a>). Here Saul for some reason not stated set up a monument or trophy (<a onClick="return mV(\'1Sa\',15,12);">1Sa 15:12</a>; literally "hand"). It was the home of Nabal the churlish and drunken flockmaster, whose widow Abigail David married (<a onClick="return mV(\'1Sa\',25,\'1-\');">1Sa 25</a>); and also of Hezro, one of David\'s mighty men (<a onClick="return mV(\'2Sa\',23,35);">2Sa 23:35</a>; <a onClick="return mV(\'1Ch\',11,37);">1Ch 11:37</a>). It is represented by the modern el-Karmil, about 10 miles to the southeast of Hebron. Karmil is the pronunciation given me by several natives this spring. There are considerable ruins, the most outstanding feature being square tower dating from the 12th century, now going swiftly to ruin. There are also caves, tombs and a large reservoir.``54';
isbe[1873]='Carmelite`kar\'-mel-it (karmeli; Karmelios, Karmelites): A native of the Judean Carmel. Those who are thus named are Nabal, the husband of Abigail (<a onClick="return mV(\'1Sa\',30,5);">1Sa 30:5</a>, etc.), and Hezro (the King James Version Hezrai), one of David\'s mighty men (<a onClick="return mV(\'2Sa\',23,35);">2Sa 23:35</a>). In <a onClick="return mV(\'2Sa\',3,3);">2Sa 3:3</a> Septuagint reads tes Abigaias tes Karmelias, "of Abigail the Carmelitess" (<a onClick="return mV(\'1Sa\',27,3);">1Sa 27:3</a>; <a onClick="return mV(\'1Ch\',3,1);">1Ch 3:1</a>).`<a href="./study/isbe/search.html?string=CARMELITESS">CARMELITESS</a>`1';
isbe[1874]='Carmelitess`kar\'-mel-it-es, kar-mel-i\'-tes (karmelith; Karmelia): A name applied only to Abigail, the wife of Nabal, and subsequently of David, a native of Carmel in Judah (<a onClick="return mV(\'1Sa\',27,3);">1Sa 27:3</a>; <a onClick="return mV(\'1Ch\',3,1);">1Ch 3:1</a>).``1';
isbe[1875]='Carmi`kar\'-mi (karmi, "fruitful," "noble"):<P>(1) A son of Reuben who came to Egypt with Jacob (<a onClick="return mV(\'Gen\',46,9);">Ge 46:9</a>; <a onClick="return mV(\'Exd\',6,14);">Ex 6:14</a>; <a onClick="return mV(\'1Ch\',5,3);">1Ch 5:3</a>). Also the name of a family of which Carmi was the head (<a onClick="return mV(\'Num\',26,6);">Nu 26:6</a>).<P>(2) A Judahite (<a onClick="return mV(\'1Ch\',2,7);">1Ch 2:7</a>), son of Zabdi, according to <a onClick="return mV(\'Jos\',7,1);">Jos 7:1</a>, and father of Achan, who is given the name of "Achar" in <a onClick="return mV(\'1Ch\',2,7);">1Ch 2:7</a>. This last form "Achar" is preferred to the usual "Achan" in order to bring out the play on the Hebrew word for "troubler." The Hebrew runs \'akhar \'okher yisra\'el, "Achar, the troubler of Israel." As regards the phrase "the sons of Carmi" (<a onClick="return mV(\'1Ch\',2,7);">1Ch 2:7</a>), Carmi is probably to be taken as the son of Zimri (= Zabdi, <a onClick="return mV(\'Jos\',7,1);">Jos 7:1</a>). The Targum, however, has "Carmi who is Zimri." The Septuagint identifies Zimri and Zabdi.<P>(3) In <a onClick="return mV(\'1Ch\',4,1);">1Ch 4:1</a>, Carmi, elsewhere called son of Zabdi or Zimri, is made son of Judah; but Wellhausen correctly changes "Carmi" to "Chelubai" (compare <a onClick="return mV(\'1Ch\',2,9);">1Ch 2:9</a>).``197';
isbe[1876]='Carmonians`kar-mo\'-ni-anz; the King James Version Carmanians: A people mentioned in one of the visions—"an horrible vision" (2Esdras 15:30ff)—of the "Apocalypse of Esdras." Their country, Carmania, was an extensive province of Asia lying between Parthia and Ariana and the north side of the Persian Gulf, and extending to Drangiana and Gedrosia on the east and to the river Bagradas and Persis on the west. It is frequently mentioned by the ancient writers, among others by Strabo and Arrian, who describe the inhabitants as closely resembling the Medians and Persians in manners and customs. In the passage cited they are intended to denote a fierce and warlike people, being described as "raging in wrath as wild boars of the wood" and associated with the "dragons of Arabia."``79';
isbe[1877]='Carnaim`kar-na\'-im, kar\'-na-im (Karnein, 1Macc 5:26, Karnain, verses 43f; to Karnion, 2Macc 12:21,26): One of the strong cities besieged and captured by Judas Maccabeus in his campaign east of the Jordan (1Macc 5:26,43f). In the temple of Atargatis, which was situated here, those who fled from the city were put to death. It is apparently identical with Ashteroth Karnaim. It is called Camion in 2Macc 12:21.``1';
isbe[1878]='Carnal`kar\'-nal: In the Old Testament there is an expression which indicates sexual intercourse shikhebhath zera\', "lying of seed," (<a onClick="return mV(\'Lev\',18,20);">Le 18:20</a>; <a onClick="return mV(\'Lev\',19,20);">19:20</a>; <a onClick="return mV(\'Num\',5,13);">Nu 5:13</a>). In the New Testament the words rendered "carnal" are derived from sarks, "flesh." This refers to the flesh as opposed to the pneuma, "spirit," and denotes, in an ethical sense, mere human nature, the lower side of man as apart from the Divine influence, and therefore estranged from God and prone to sin; whatever in the soul is weak and tends toward ungodliness (see <a href="./study/isbe/search.html?string=FLESH">FLESH</a>). Thus one may be carnal (sarkinos), sold under sin (<a onClick="return mV(\'Rom\',7,14);">Ro 7:14</a>). Christians may be carnal (sarkinos, <a onClick="return mV(\'1Cr\',3,1);">1Co 3:1</a>; sarkikos, <a onClick="return mV(\'1Cr\',3,3);">1Co 3:3</a>); the lower side of their being is dominant and not the spirit, hence, they fall into sins of envy and strife. The weapons of the Christian warfare are not carnal, not merely human (of the flesh the Revised Version (British and American), the American Standard Revised Version), but spiritual (<a onClick="return mV(\'2Cr\',10,4);">2Co 10:4</a>); "not after the law of a carnal commandment" (<a onClick="return mV(\'Hbr\',7,16);">Heb 7:16</a>); "The carnal mind is enmity against God" ("mind of the flesh" the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'Rom\',8,7);">Ro 8:7</a>). So, "to be carnally minded is death" ("mind of the flesh" the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'Rom\',8,6);">Ro 8:6</a>). There are "carnal ordinances," in contrast to the spiritual ones of the gospel (<a onClick="return mV(\'Hbr\',9,10);">Heb 9:10</a>); "Minister unto them in carnal things," those that pertain to the body in contrast to spiritual things (<a onClick="return mV(\'Rom\',15,27);">Ro 15:27</a>; <a onClick="return mV(\'1Cr\',9,11);">1Co 9:11</a>). The same expressions are elsewhere rendered "fleshly" (<a onClick="return mV(\'2Cr\',1,12);">2Co 1:12</a>; <a onClick="return mV(\'2Cr\',3,3);">3:3</a> the Revised Version (British and American) "hearts of flesh"; <a onClick="return mV(\'1Pe\',2,11);">1Pe 2:11</a>).<P>Is there any difference between sarkinos and sarkikos? The former more definitely denotes the material of which an object is made. It may express with emphasis the idea of sarkikos, the spiritual given up as it were to the flesh.`<a href="./study/isbe/search.html?string=MAN,+NATURAL">MAN (THE NATURAL)</a>`177';
isbe[1879]='Carnion`kar\'-ni-on.`<a href="./study/isbe/search.html?string=CARNAIM">CARNAIM</a>`1';
isbe[1880]='Carousings`ka-rouz\'-ingz (potois, dative plural of potos): This word is found only in the American Standard Revised Version and once only (<a onClick="return mV(\'1Pe\',4,3);">1Pe 4:3</a>). The King James Version translates it "banquetings." It is one of the Gentile excesses of fleshly indulgence against which the Christians are warned by Peter.``1';
isbe[1881]='Carpenter`kar\'-pen-ter (charash; tekton): This word, which is a general word for graver or craftsman, is translated "carpenter" in <a onClick="return mV(\'2Ki\',22,6);">2Ki 22:6</a>; <a onClick="return mV(\'2Ch\',24,12);">2Ch 24:12</a>; <a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>; <a onClick="return mV(\'Isa\',41,7);">Isa 41:7</a>. The same word is rendered "craftsman" in the American Standard Revised Version of <a onClick="return mV(\'Jer\',24,1);">Jer 24:1</a> and <a onClick="return mV(\'Jer\',29,2);">Jer 29:2</a> and "smith" in the American Standard Revised Version of <a onClick="return mV(\'Zec\',1,20);">Zec 1:20</a>. In <a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>; <a onClick="return mV(\'2Ki\',12,11);">2Ki 12:11</a>; <a onClick="return mV(\'1Ch\',14,1);">1Ch 14:1</a>; and <a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>, charash occurs with \'ets (wood), and is more exactly translated "carpenter" or "worker in wood." Tekton, the corresponding Greek word for artificer, is translated "carpenter" in <a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a> and <a onClick="return mV(\'Mar\',6,3);">Mr 6:3</a>.`<a href="./study/isbe/search.html?string=CARVING">CARVING</a>; <a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`1';
isbe[1882]='Carpus`kar\'-pus (Karpos): A name but once mentioned in the New Testament (<a onClick="return mV(\'2Ti\',4,13);">2Ti 4:13</a>), "the cloak that I left at Troas with Carpus." These words were written from the dungeons, where Paul was confined during his second imprisonment. The name, common enough in Paul\'s day, signifies "fruit" (Young) or "wrist" (Davis). The words indicate that Paul must have been very well acquainted with the family of Carpus. He was presumably one of his converts; and the apostle must have lodged with him and also have had considerable confidence in him, since he committed to his care not only the comparatively valueless "cloak," but especially the priceless "books and parchments." It is idle to attempt to find out the identity of Carpus, but one cannot help wondering what were the contents of these books and parchments for which the apostle longed in his bitter second imprisonment.``42';
isbe[1883]='Carriage`kar\'-ij (keli, kebhuddah, nesu\'ah; episkeuasamenoi; the Revised Version (British and American) "We took up our baggage"; the American Revised Version, margin "made ready"): One or the other of the above words occurs in six different places and all have been translated in the King James Version by "carriage" in its obsolete meaning (<a onClick="return mV(\'Jdg\',18,21);">Jud 18:21</a>; <a onClick="return mV(\'1Sa\',17,22);">1Sa 17:22</a> (twice); <a onClick="return mV(\'Isa\',10,28);">Isa 10:28</a>; <a onClick="return mV(\'Isa\',46,1);">46:1</a>; <a onClick="return mV(\'Act\',21,15);">Ac 21:15</a>). In the Revised Version (British and American) and the American Standard Revised Version these are translated by the more modern expressions "goods," "baggage," or "the things that you carried." In <a onClick="return mV(\'1Sa\',17,20);">1Sa 17:20</a> the King James Version margin "place of the carriage" occurs as the equivalent of "trench." The Hebrew ma\'galah may mean "the place of wagons" as translated in the Revised Version (British and American), as it is not at all improbable that the encampment was surrounded by the baggage train.``133';
isbe[1884]='Carry`kar\'-i (nasa\', nahagh): The English Versions of the Bible rendering of a number of Hebrew and Greek words, and it has several shades of meaning, of which the following are the most important:<P>(1) "To take up," "to bear," "to transport from one place to another," as, "to carry away handkerchiefs" (<a onClick="return mV(\'Act\',19,12);">Ac 19:12</a>), "to carry a corpse" (<a onClick="return mV(\'Gen\',50,13);">Ge 50:13</a>), and "to be carried away by the wind" (<a onClick="return mV(\'Dan\',2,35);">Da 2:35</a>).<P>(2) "To cause to go" or "come," "to lead," "to drive" as, "to be carried away to Babylon" (<a onClick="return mV(\'2Ki\',20,17);">2Ki 20:17</a>), "to be carried away to Pilate" (<a onClick="return mV(\'Mar\',15,1);">Mr 15:1</a>), "to carry away cattle" (<a onClick="return mV(\'Gen\',31,18);">Ge 31:18</a>), and "to carry daughters" (<a onClick="return mV(\'Gen\',31,26);">Ge 31:26</a>).<P>(3) "To uphold," or "sustain," "and even to hoar hairs will I carry you" (<a onClick="return mV(\'Isa\',46,4);">Isa 46:4</a>).<P>(4) "To bear," or "endure," as, "to carry sorrows" (<a onClick="return mV(\'Isa\',53,4);">Isa 53:4</a>).<P>(5) "To overwhelm," "to bear away," "to destroy," as, "to carry away as with a flood" (<a onClick="return mV(\'Psa\',90,5);">Ps 90:5</a>).<P>(6) "To influence," "to move," as, "to carry away with dissimulation" (<a onClick="return mV(\'Gal\',2,13);">Ga 2:13</a>), "to carry away with error" (<a onClick="return mV(\'2Pe\',3,17);">2Pe 3:17</a>), "to be carried away by strange teachings" (<a onClick="return mV(\'Hbr\',13,9);">Heb 13:9</a>).``62';
isbe[1885]='Carshena`kar\'-she-na, kar-she\'-na (karshena\'): The first named among the "seven princes of Persia and Media" under Ahasuerus (<a onClick="return mV(\'Est\',1,14);">Es 1:14</a>).`<a href="./study/isbe/search.html?string=PRINCES,+THE+SEVEN">PRINCES, THE SEVEN</a>`1';
isbe[1886]='Cart`kart (\'aghalah): The Hebrew word has been translated in some passages "cart," and in others "wagon." In one verse only has it been translated "chariot." The context of the various passages indicates that a distinction was made between vehicles which were used for carrying baggage or produce and those used for carrying riders (chariots), although in their primitive form of construction they were much the same (compare English "cart" and "carriage").<P>Carts, like "<a href="./study/isbe/search.html?string=CHARIOTS">chariots</a>" (which see), were of Assyrian origin. They were early carried to Egypt where the flat nature of the country readily led to their adoption. From Egypt they gradually found their way among the people of the Palestinian plains. In the hills of Judea and central Palestine, except where highways were built (<a onClick="return mV(\'1Sa\',6,12);">1Sa 6:12</a>), the nature of the country prevented the use of wheeled vehicles. <a onClick="return mV(\'1Sa\',6,7,8,10,11,14);">1Sa 6:7-8, 10-11, 14</a> show that the people of the plains used carts. The men of Kiriath-jearim found it easier to carry the ark (<a onClick="return mV(\'1Sa\',7,1);">1Sa 7:1</a>). Their attempt to use a cart later (<a onClick="return mV(\'2Sa\',6,3,);">2Sa 6:3,6</a>; <a onClick="return mV(\'1Ch\',13,7);">1Ch 13:7</a>) proved disastrous and they abandoned it for a safer way (<a onClick="return mV(\'2Sa\',6,13);">2Sa 6:13</a>).<P>That carts were used at a very early date is indicated by <a onClick="return mV(\'Num\',7,3,7,8);">Nu 7:3, 7-8</a>. That these vehicles were not the common mode of conveyance in Palestine is shown in <a onClick="return mV(\'Gen\',45,\'1-\');">Ge 45</a>. Pharaoh commanded that Joseph\'s brethren should return to their father with their beasts of burden (<a onClick="return mV(\'Gen\',45,21);">Gen 45:21</a>) and take with them Egyptian wagons (<a onClick="return mV(\'Gen\',45,19,21);">Gen 45:19, 21</a>; <a onClick="return mV(\'Gen\',46,6);">46:6</a>) for bringing back their father and their families. The very unusual sight of the wagons was proof to Jacob of Joseph\'s existence (<a onClick="return mV(\'Gen\',45,27);">Gen 45:27</a>).<P>Bible descriptions and ancient Babylonian and Egyptian pictures indicate that the cart was usually two-wheeled and drawn by two oxen.<P>With the Arabian conquests and subsequent ruin of the roads wheeled vehicles disappeared from Syria and Palestine. History is again repeating itself. The Circassians, whom the Turkish government has settled near Caesarea, Jerash (Gerasa) and Amman (Philadelphia), have introduced a crude cart which must be similar to that used in Old Testament times. The two wheels are of solid wood. A straight shaft is joined to the wooden axle, and to this a yoke of oxen is attached. On the Philistian plains may be seen carts of present-day Egyptian origin but of a pattern many centuries old. With the establishment of government roads during the last 50 years, European vehicles of all descriptions are fast coming into the country.<P>One figurative reference is made to the cart (<a onClick="return mV(\'Isa\',5,18);">Isa 5:18</a>), but its meaning is obscure.``133';
isbe[1887]='Carving`karv\'-ing: Carving, or engraving, was extensively used among the peoples of Bible lands. There were no materials used in the arts which were not subjected to the graver\'s skill. Carved objects of wood, stone, ivory, clay, bronze, gold, silver and glass discovered today show how skillful the ancient carvers were. Carving was principally done in bas-relief, although <a onClick="return mV(\'Exd\',28,11);">Ex 28:11</a> shows that incised lines were also used. The signets and scarabs are examples of this class of carving. Several Hebrew words have been translated "carved" in the King James Version. Pecel or pecil is found in <a onClick="return mV(\'Jdg\',18,18);">Jud 18:18</a>; <a onClick="return mV(\'2Ch\',33,7,22);">2Ch 33:7, 22</a>; <a onClick="return mV(\'2Ch\',34,3,4);">34:3-4</a>; chaqah in <a onClick="return mV(\'1Ki\',6,35);">1Ki 6:35</a>. The translation "graven" appears in the Revised Version (British and American) of all these passages. In <a onClick="return mV(\'1Ki\',6,29,32,35);">1Ki 6:29, 32, 35</a>, qala appears; in <a onClick="return mV(\'1Ki\',6,18,32);">1Ki 6:18, 32</a>, miqla\'ath; in <a onClick="return mV(\'1Ki\',6,29);">1Ki 6:29</a> and <a onClick="return mV(\'Psa\',74,6);">Ps 74:6</a>, pittuach; in <a onClick="return mV(\'Exd\',31,5);">Ex 31:5</a>; <a onClick="return mV(\'Exd\',35,33);">35:33</a>, charosheth (see <a href="./study/isbe/search.html?string=CARPENTER">CARPENTER</a>); chatubhah in <a onClick="return mV(\'Pro\',7,16);">Pr 7:16</a> is better translated "striped" as in the Revised Version (British and American). For further notes on carving <a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>``133';
isbe[1888]='Casdim`kaz\'-dim`<a href="./study/isbe/search.html?string=CHESED">CHESED</a>`1';
isbe[1889]='Case`kas: Ordinarily to describe the circumstances or condition of things; sometimes, juridically (aitia, <a onClick="return mV(\'Mat\',19,10);">Mt 19:10</a>; <a onClick="return mV(\'Act\',25,14);">Ac 25:14</a>), as that for which a reckoning has to be given, as frequently the Latin res. In <a onClick="return mV(\'Exd\',5,19);">Ex 5:19</a>, "they were in evil case," is interpreted by the Revised Version (British and American) as "were set on mischief."``1';
isbe[1890]='Casement`kas\'-ment.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`1';
isbe[1891]='Casiphia`ka-sif\'-i-a, ka-sif-e\'-a (kaciphya\'): An unidentified place in North Babylonia, near the river Ahava, to which Ezra sent for "ministers for the house of our God" (<a onClick="return mV(\'Ezr\',8,17);">Ezr 8:17</a>). Some have thought the name to be connected with keceph, "silver" or "money." Septuagint renders argurio tou topou, as in 1Esdras 8:45, "the place of the treasury."``1';
isbe[1892]='Casluhim`kas\'-lu-him, kas-lu-him (kacluchim; Chasmonieim): The name of a people mentioned in <a onClick="return mV(\'Gen\',10,14);">Ge 10:14</a>; <a onClick="return mV(\'1Ch\',1,12);">1Ch 1:12</a> as descended from Mizraim. The parenthesis should probably follow Caphtorim. From them, it is said, sprang the <a href="./study/isbe/search.html?string=PHILISTINES">PHILISTINES</a>, which see.``1';
isbe[1893]='Casphon`kas\'-fon.`<a href="./study/isbe/search.html?string=CASPHOR">CASPHOR</a>`1';
isbe[1894]='Casphor`kas\'-for (the King James Version Casphon; Kasphor, 1Macc 5:26; Chasphon, Chasphoth, 5:36; Kaspein, 2Macc 12:13): A city east of the Jordan captured by Judas Maccabeus (1Macc 5:36). It is probably identical with Caspis of 2Macc 12:13. It was a fortress of great strength, with a lake near it. This has led some to think it may be represented by el-Muzerib, an important station on the pilgrim route to Mecca. The ancient name of this city, however, has not been discovered.`<a href="./study/isbe/search.html?string=ASHTAROTH">ASHTAROTH</a>`1';
isbe[1895]='Caspin; Caspis`kas\'-pin, kas\'-pis.`<a href="./study/isbe/search.html?string=CASPHOR">CASPHOR</a>`1';
isbe[1896]='Cassia`kash\'-a: Two Hebrew words,<P>(1) qiddah, which is mentioned, along with myrrh, cinnamon, calamus and olive oil, as one of the ingredients of the "holy anointing oil" (<a onClick="return mV(\'Exd\',30,24);">Ex 30:24</a>); it was, too, one of the wares in which Vedan and Javan traded with Tyre (<a onClick="return mV(\'Eze\',27,19);">Eze 27:19</a>); it is identified in the Peshitta and the Targum with (2).<P>(2) qetsi\'oth (plural only, probably referring to the strips of bark), a word from which is derived the Greek kasia, and hence, cassia (<a onClick="return mV(\'Psa\',45,8);">Ps 45:8</a>).<P>It is probable that both (1) and (2) refer to Cassia lignea, the inner bark of Cinnamomum cassia, a plant growing in eastern Asia closely allied to that which yields the cinnamon of commerce. It is a fragrant, aromatic bark and was probably used in a powdered form. Both as an ingredient in unguents and as one of the perfumes at funerals, cassia, like cinnamon, was much used by the Romans. The cassia of Scripture must be clearly distinguished from the entirely distinct Cassia lanceolata and C. obovata which yield the familiar senna. The proper name <a href="./study/isbe/search.html?string=KEZIAH">KEZIAH</a> (which see) is the singular form of ketsi\'oth.``117';
isbe[1897]='Cast`In general "to throw," with various degrees of violence; usually, with force, but not so necessarily, as e.g. in "cast a net," "cast lots." When applied to molten metal, as in English, first, "to let run into molds," with reference to their descent by gravity, and, then, "to form," as in <a onClick="return mV(\'Exd\',25,12);">Ex 25:12</a>, etc. Usually in the New Testament for ballo, but not always. Thus, in <a onClick="return mV(\'Luk\',1,29);">Lu 1:29</a> "cast in her mind" means "considered" (dielogizeto); "cast reproach" for Greek oneidizon, "reproached" (<a onClick="return mV(\'Mat\',27,44);">Mt 27:44</a>); "casting down" for kathaireo, "demolishing" (<a onClick="return mV(\'2Cr\',10,4);">2Co 10:4</a>); "casting all anxiety upon" (<a onClick="return mV(\'1Pe\',5,7);">1Pe 5:7</a>), a still stronger term, as in <a onClick="return mV(\'Luk\',17,2);">Lu 17:2</a> the King James Version; <a onClick="return mV(\'Act\',27,19);">Ac 27:19</a>. As a fundamental Greek word, it is compounded with many prepositions, "about," "away," "down," "forth," "in," "into," "off," "out," "up," "upon." "Cast down" in <a onClick="return mV(\'2Cr\',4,9);">2Co 4:9</a> the King James Version is used in a military sense of one prostrated, but not killed in battle. Compare <a onClick="return mV(\'Psa\',42,5);">Ps 42:5</a> with the Revised Version, margin. "Castaway" of the King James Version in <a onClick="return mV(\'1Cr\',9,27);">1Co 9:27</a>, is in the Revised Version (British and American) "rejected" (compare <a onClick="return mV(\'Hbr\',6,8);">Heb 6:8</a>), adokimos, i.e. what the application of a test shows to be counterfeit, or unfit; translated "reprobate" in <a onClick="return mV(\'Rom\',1,28);">Ro 1:28</a>; <a onClick="return mV(\'2Cr\',13,5,6,7);">2Co 13:5-7</a>, etc.``84';
isbe[1898]='Castanets`kas\'-ta-nets, kas-ta-nets\' (mena\'an\'im): Are mentioned in <a onClick="return mV(\'2Sa\',6,5);">2Sa 6:5</a> among the musical instruments upon which David and the house of Israel played at the time of the bringing up of the ark out of the house of Abinadab. This word is incorrectly translated "cornets" in the King James Version. The castanet was probably about the same kind of instrument as the Egyptian sistrum, and the Revised Version (British and American) has "sistra" in the margin of <a onClick="return mV(\'2Sa\',6,5);">2Sa 6:5</a>. The sialrum was a loop-shaped metal frame through which were passed loose rods at the ends of which were rings. The instrument was held by a long handle and was rattled during songs and dances. It was used in Egypt in religious worship or to scare away evil influences. There is only the one reference to this instrument in the Bible.``62';
isbe[1899]='Castaway`kast\'-a-wa (adokimos, from dokimazo, "I test," "I approve after testing," hence, approved after being tested): This word is rendered "castaway" only in the King James Version: "I myself should be a castaway" ("rejected" the Revised Version (British and American), the American Standard Revised Version, <a onClick="return mV(\'1Cr\',9,27);">1Co 9:27</a>). But the same word occurs a number of times usually translated "reprobate" (<a onClick="return mV(\'Rom\',1,28);">Ro 1:28</a>; <a onClick="return mV(\'2Cr\',13,\'5-7\');">2Co 13:5-7</a>; <a onClick="return mV(\'2Ti\',3,8);">2Ti 3:8</a>; <a onClick="return mV(\'Tts\',1,16);">Tit 1:16</a>); "rejected" (<a onClick="return mV(\'Hbr\',6,8);">Heb 6:8</a>).``1';
isbe[1900]='Castle`kas\'-\'-l.`<a href="./study/isbe/search.html?string=FORTIFICATION">FORTIFICATION</a>`1';
