isbe[1846]='Caphira`ka-fi\'-ra (Codex Alexandrinus, Kaphira, Codex Vaticanus, Peira): A town whose inhabitants returned from Babylon with Zerubbabel (1Esdras 5:19). It corresponds to <a href="./study/isbe/search.html?string=CHEPHIRAH">CHEPHIRAH</a> (<a onClick="return mV(\'Ezr\',2,25);">Ezr 2:25</a>), which see.``1';
isbe[1847]='Caphthorim`kaf\'-tho-rim (kaphtorim).`<a href="./study/isbe/search.html?string=CAPHTORIM">CAPHTORIM</a>`1';
isbe[1848]='Caphtor; Caphtorim`kaf\'-tor, kaf\'-tor-im (kaphtor, kaphtorim; Kappadokia, Gaphtorieim, Kaphtoriem).<P>1. First Theory: Crete:<P>The country and people whence came the Philistines (<a onClick="return mV(\'Gen\',10,14);">Ge 10:14</a> = <a onClick="return mV(\'1Ch\',1,12);">1Ch 1:12</a> (here the clause "whence went forth the Philistines" should, probably come after Caphtorim); <a onClick="return mV(\'Deu\',2,23);">De 2:23</a>; <a onClick="return mV(\'Jer\',47,4);">Jer 47:4</a>; <a onClick="return mV(\'Amo\',9,7);">Am 9:7</a>). Jeremiah (loc. cit.) calls it an "island"; there is evidence of ancient connection between Crete and Philistia; and the Philistines are called Cherethites, which may mean Cretans (see <a href="./study/isbe/search.html?string=CHERETHITES">CHERETHITES</a>). These considerations have led many to identify Caphtor with the important island of Crete. It should be noted, however, that the word \'i, used by Jeremiah, denotes not only "isle," but also "coastland."<P>2. Second Theory: Phoenicia:<P>Ebers (Aegypten und die Bucher Moses, 130ff) thought that Caphtor represented the Egyptian Kaft-ur, holding that Kaft was the Egyptian name for the colonies of Phoenicians in the Delta, extended to cover the Phoenicians in the north and their colonies. Kaft-ur, therefore, would mean "Greater Phoenicia." But the discovery of Kaptar among the names of countries conquered by Ptolemy Auletes in an inscription on the Temple of Kom Ombo is fatal to this theory.<P>3. Third Theory: Cilicia:<P>A third theory would identify Caphtor with the Kafto of the Egyptian inscriptions. As early as the time of Thotmes III the inhabitants of this land, the Kafti, are mentioned in the records. In the trilingual inscription of Canopus the name is rendered in Greek by Phoinike, "Phoenicia." This seems to be an error, as the Kafti portrayed on the monuments have no features in common with the Semites. They certainly represent a western type. It is held that the Egyptian Kafto is a district in Asia Minor, probably Cilicia. The sea- pirates, the purasati, whom Rameses III subdued (circa 1200 BC), entered Syria from the north. The "R" in the name is the Egyptian equivalent of the Semitic "L". Therefore Purasati = Pilishti, "Philistines." And so it is proposed to identify Caphtor with Cilicia. A serious objection to this theory is the absence of the final "r" in Kafto. McCurdy\'s suggestion (HDB) that it represents a Hebrew waw, written as a vowel-letter in an original Kafto, does not carry conviction.<P>It is impossible to give a certain decision; but the balance of probability seems still inclined to the first theory.``54';
isbe[1849]='Cappadocia`kap-a-do\'-shi-a (he Kappadokia): An extensive province in eastern Asia Minor, bounded by the Taurus mountains on the south, the Anti-Taurus and the Euphrates on the east, and, less definitely, by Pontus and Galatia on the north and west. Highest mountain, Argaeus, over 13,000 ft. above sea-level; chief rivers, the Pyramus now Jihan, Sarus now Sihon, and Halys now the Kuzul; most important cities, Caesarea Mazaca, Comana, Miletene now Malatia, and Tyana now Bor. At Malatia the country unrolls itself as a fertile plain; elsewhere the province is for the most part composed of billowy and rather barren uplands, and bleak mountain peaks and pastures.<P>The Greek geographers called Cappodax the son of Ninyas, thereby tracing the origin of Cappadocian culture to Assyria. Cuneiform tablets from Kul Tepe (Kara Eyuk), deciphered by Professors Pinches and Sayce, show that in the era of Khammurabi (see <a href="./study/isbe/search.html?string=HAMMURABI">HAMMURABI</a>) this extensive ruin on the ox-bow of the Halys and near Caesarea Mazaca, was an outpost of the Assyr-Bah Empire. A Hittite civilization followed, from about 2000 BC onward. Malatia, Gurun, Tyana and other old sites contain important and undoubted Hittite remains, while sporadic examples of Hittite art, architecture and inscriptions are found in many places, and the number is being steadily increased by fresh discovery. After the Hittites fade from sight, following the fall of Carchemish, about 718 BC, Cappadocia emerges as a satrapy of Persia. At the time of Alexander the Great it received a top-dressing of Greek culture, and a line of native kings established an independent throne, which lasted until Cappadocia was incorporated in the Roman Empire, 17 AD. Nine rulers bore the name of Ariarathes (the Revised Version (British and American) Arathes) the founder of the dynasty, and two were named Ariobarzanes. One of these kings is referred to in 1Macc 15:22. The history of this Cappadocian kingdom is involved, obscure and bloody.<P>Pagan religion had a deep hold upon the population prior to the advent of Christianity. Comana was famous for its worship of the great goddess Ma, who was served, according to Strabo, by 6,000 priestesses, and only second to this was the worship paid to Zeus at Venasa.<P>Representatives from Cappadocia were present at Pentecost (<a onClick="return mV(\'Act\',2,9);">Ac 2:9</a>), and Peter includes the converts in this province in the address of his letter (<a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>). Caesarea became one of the most important early centers of Christianity. Here the Armenian youth of noble blood, Krikore, or Gregory the Illuminator, was instructed in the faith to which he afterward won the formal assent of his whole nation. Here Basil governed the churches of his wide diocese and organized monasticism. His brother, Gregory of Nyssa, and Gregory Nazianzen, lived and labored not far away. Cappadocia passed with the rest of Asia Minor into the Byzantine Empire, but from its exposed position early fell under the domination of the Turks, having been conquered by the Seljukians in 1074.``191';
isbe[1850]='Captain`kap\'-tin: In the King James Version there are no fewer than 13 Hebrew words, and 4 different Greek words, which are rendered by this one English word. In the Revised Version (British and American) some of these are rendered by other English words, and so we find for "captain": "marshal" (<a onClick="return mV(\'Jer\',27,\'1-\');">Jer 27</a>; <a onClick="return mV(\'Nah\',3,17);">Na 3:17</a>), "prince" (<a onClick="return mV(\'1Sa\',9,16);">1Sa 9:16</a>), "governor" (<a onClick="return mV(\'Jer\',51,23,28);">Jer 51:23, 28</a>), while in the case of one of these Hebrew words a different construction is found altogether (<a onClick="return mV(\'Jer\',13,21);">Jer 13:21</a>).<P>1. In the Old Testament:<P>Of Hebrew words in the Old Testament rendered by "captain"<P>(1) the most frequent is sar, which denotes "a military commander," whether of thousands or hundreds or fifties (<a onClick="return mV(\'Num\',31,48);">Nu 31:48</a>; <a onClick="return mV(\'1Sa\',8,12);">1Sa 8:12</a> and many other places). Sar is the chief officer of any department, civil and religious, as well as military—captain of the guard the King James Version and the Revised Version (British and American), chief of the executioners the Revised Version, margin (<a onClick="return mV(\'Gen\',37,36);">Ge 37:36</a>); chief butler (<a onClick="return mV(\'Gen\',40,9);">Ge 40:9</a>); chief baker (<a onClick="return mV(\'Gen\',40,16);">Ge 40:16</a>); chief of a district (<a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>); chiefs of tribes (Naphtali; Zebulun, <a onClick="return mV(\'Psa\',68,27);">Ps 68:27</a>); chiefs over gangs of slaves (<a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>); chiefs of the priests and the Levites (<a onClick="return mV(\'Ezr\',8,29);">Ezr 8:29</a>).<P>(2) rabh, later Hebrew for chief of the executioners or captain of the guard, a title always given to Nebuzar-adan (<a onClick="return mV(\'2Ki\',25,8);">2Ki 25:8</a>ff; <a onClick="return mV(\'Jer\',39,9);">Jer 39:9</a>ff) and to Arioch (<a onClick="return mV(\'Dan\',2,14);">Da 2:14</a>). Compare also Rab-mag, chief of the magicians (<a onClick="return mV(\'Jer\',39,13);">Jer 39:13</a>), and Ashpenaz, chief of the eunuchs (<a onClick="return mV(\'Dan\',1,3);">Da 1:3</a>).<P>(3) ro\'sh, "head" over a host (Israel in the wilderness, <a onClick="return mV(\'Num\',14,4);">Nu 14:4</a>), over tribes (<a onClick="return mV(\'Deu\',29,10);">De 29:10</a>, where the Revised Version (British and American) renders "heads"), over thousands (<a onClick="return mV(\'1Ch\',12,20);">1Ch 12:20</a>). Abijah, king of Judah, before joining battle against Jeroboam, claimed "God himself is with us for our captain" the King James Version, "with us at our head" the Revised Version (British and American) (<a onClick="return mV(\'2Ch\',13,12);">2Ch 13:12</a>).<P>(4) shalish, originally the third man in the chariot, who, when the chief occupant was the king, or commander-in-chief, was of the rank of captain (<a onClick="return mV(\'2Ki\',7,2);">2Ki 7:2</a>; <a onClick="return mV(\'2Ki\',9,25);">9:25</a>), the term "third man" being generalized to mean "a captain" in <a onClick="return mV(\'2Ki\',10,25);">2Ki 10:25</a>; <a onClick="return mV(\'2Ch\',8,9);">2Ch 8:9</a>, where "chief of his captains" combines (1) and (4).<P>(5) naghidh, leader by Divine appointment: of Saul (<a onClick="return mV(\'1Sa\',9,16);">1Sa 9:16</a>, "captain," the King James Version, "prince" the Revised Version (British and American) <a onClick="return mV(\'1Sa\',10,1);">1Sa 10:1</a>); of David (<a onClick="return mV(\'2Sa\',5,2);">2Sa 5:2</a>); of Hezekiah (<a onClick="return mV(\'2Ki\',20,5);">2Ki 20:5</a>); with a charge in connection with the temple (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>). It is the word used of Messiah "the prince" (<a onClick="return mV(\'Dan\',9,25);">Da 9:25</a>), who is also Prince of the Covenant (<a onClick="return mV(\'Dan\',11,22);">Da 11:22</a>).<P>(6) nasi\', rendered "captain" in the King James Version <a onClick="return mV(\'Num\',2,3,5,7);">Nu 2:3, 5, 7</a> only, there in the Revised Version (British and American) and in other places, both the King James Version and the Revised Version (British and American), rendered "prince." In <a onClick="return mV(\'1Ch\',7,40);">1Ch 7:40</a> "chief of the princes" combines (3) and (6).<P>(7) pechah, is found almost entirely in a foreign title denoting "governor," and belongs to the later history of Israel (<a onClick="return mV(\'Neh\',2,7,9);">Ne 2:7, 9</a>; <a onClick="return mV(\'Ezr\',8,36);">Ezr 8:36</a>; <a onClick="return mV(\'Hag\',1,1);">Hag 1:1</a>), rendered "captain" in exclusively foreign associations (<a onClick="return mV(\'1Ki\',20,24);">1Ki 20:24</a>; <a onClick="return mV(\'2Ki\',18,24);">2Ki 18:24</a>; <a onClick="return mV(\'Dan\',3,27);">Da 3:27</a>f).<P>(8) qatsin (from root of qadi, Arabic for "judge"), denotes "dictator," almost "usurper," and is found in "rulers of Sodom" the King James Version and the Revised Version (British and American), "judges of Sodom" the Revised Version, margin (<a onClick="return mV(\'Isa\',1,10);">Isa 1:10</a>), used of Jephthah in sense of "captain" the King James Version, "chief" the Revised Version (British and American) (<a onClick="return mV(\'Jdg\',11,6);">Jud 11:6</a>), found combined with (3), "head and captain" (King James Version, "head and chief" the Revised Version (British and American) <a onClick="return mV(\'Jdg\',11,11);">Jud 11:11</a>). In <a onClick="return mV(\'Jos\',10,24);">Jos 10:24</a> it denotes commanders of troops, the King James Version "captains of the men of war," the Revised Version (British and American) "chiefs of the men of war."<P>(9) kar, in <a onClick="return mV(\'Eze\',21,22);">Eze 21:22</a> "to set captains" the King James Version, is translated "to set battering rams" the Revised Version (British and American).<P>(10) ba\'al, only once in "captain of the ward" (<a onClick="return mV(\'Jer\',37,13);">Jer 37:13</a>).<P>(11) Tiphcar, a dignitary belonging to an oriental court, in the King James Version rendered "captain," in the Revised Version (British and American) "marshal" (<a onClick="return mV(\'Nah\',3,17);">Na 3:17</a>; <a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a>).<P>(12) shallit, in <a onClick="return mV(\'Dan\',2,15);">Da 2:15</a> of Arioch, the king\'s captain; in <a onClick="return mV(\'Ecc\',8,8);">Ec 8:8</a> "having power over," and in <a onClick="return mV(\'Ecc\',7,19);">Ec 7:19</a> used of "mighty men" (the Revised Version (British and American) "rulers").<P>2. In the New Testament:<P>Of Greek words rendered by "captain" in New Testament there are the following:<P>(1) archegos, rendered "captain" in <a onClick="return mV(\'Hbr\',2,10);">Heb 2:10</a> the King James Version but relegated to the margin in the Revised Version (British and American), where "author" (of their salvation) is preferred, this being the rendering of <a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a> the King James Version and the Revised Version (British and American), "author" (and finisher of our faith), "captain" being still retained in the Revised Version, margin. Compare <a onClick="return mV(\'Act\',3,15);">Ac 3:15</a> and <a onClick="return mV(\'Act\',5,31);">Ac 5:31</a>, where the same Greek word is rendered "Prince," the Revised Version, margin of the former passage giving "Author." In the Risen and Ascended Christ the various conceptions thus expressed are found to blend.<P>(2) chiliarchos, the Latin tribunus militum of which there were six to a legion, commanding the six cohorts of which it was composed. In its lit. acceptation it would be "commander of a thousand," and it is so used in <a onClick="return mV(\'Act\',22,28);">Ac 22:28</a> where it designates the commander of the Roman garrison in Jerusalem, consisting of a cohort, and is rendered "chief captain" (<a onClick="return mV(\'Jhn\',18,12);">Joh 18:12</a>; <a onClick="return mV(\'Act\',21,31);">Ac 21:31</a>; <a onClick="return mV(\'Act\',22,24);">22:24</a>; <a onClick="return mV(\'Act\',24,22);">24:22</a>). It is used more vaguely in the sense of "military officer" in <a onClick="return mV(\'Mar\',6,21);">Mr 6:21</a>; <a onClick="return mV(\'Rev\',6,15);">Re 6:15</a>; <a onClick="return mV(\'Rev\',19,18);">19:18</a>.<P>(3) strategos, used only by Luke in the New Testament, and almost exclusively of<P>(a) officials in charge of the Temple (<a onClick="return mV(\'Luk\',22,4,52);">Lu 22:4, 52</a>; <a onClick="return mV(\'Act\',4,1);">Ac 4:1</a>; <a onClick="return mV(\'Act\',5,24,26);">5:24, 26</a>). The captain of the Temple had the superintendence of the Levites and priests who were on guard in and around the Temple, and under him were strategoi, who were also captains of the Temple police, although they took their instruction from him as their head. He was not only a priest, but second in dignity only to the high priest himself;<P>(b) the exception to Luke\'s general usage is where the word is used of the chief authorities in civil affairs at Philippi; where "the magistrates," as the word is rendered (<a onClick="return mV(\'Act\',16,20);">Ac 16:20</a>f), called themselves "praetors" (strategoi). In the case of Paul and Silas they placed themselves in peril of removal from their office by ordering them to be beaten, being Romans and uncondemned.<P>(4) stratopedarches, the captain of the guard to whom Julius of the Augustan band (according to the Textus Receptus of the New Testament, <a onClick="return mV(\'Act\',28,16);">Ac 28:16</a>) delivered Paul and his fellow-prisoners. The word has disappeared from the Revised Version (British and American), but the passage in which it occurs has attestation which satisfies Blass, Sir William Ramsay, and other scholars. It was supposed that this was the captain of the Praetorian guard, but Mommsen and Ramsay believe him to be the princeps peregrinorum castrorum.`<a href="./study/isbe/search.html?string=AUGUSTAN+BAND">AUGUSTAN BAND</a>; <a href="./study/isbe/search.html?string=ARMY,+ROMAN">ARMY, ROMAN</a>`128';
isbe[1851]='Captive`kap\'-tiv (shebhi, galah; aichmalotos and its derivatives): The frequent references in the Old Testament to captives as men forcibly deported (from the Hebrew root shabhah) or inhabiting a land foreign to them (from Hebrew galah) reflect the universal practice of the ancient world. The treatment of captives was sometimes barbarous (<a onClick="return mV(\'2Sa\',8,2);">2Sa 8:2</a>) but not always so (<a onClick="return mV(\'2Ki\',6,21,22);">2Ki 6:21-22</a>).<P>Figurative: Except in <a onClick="return mV(\'Job\',42,10);">Job 42:10</a> the figurative use of the idea is confined to the New Testament, where reference is made to the triumphal reign of the Lord Jesus (<a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a>; <a onClick="return mV(\'Eph\',4,8);">Eph 4:8</a>), or, on the other hand, to the power of the devil (<a onClick="return mV(\'2Ti\',2,26);">2Ti 2:26</a>), or of false teachers (<a onClick="return mV(\'2Ti\',3,6);">2Ti 3:6</a>); compare also <a onClick="return mV(\'Rom\',7,23);">Ro 7:23</a>; <a onClick="return mV(\'2Cr\',10,5);">2Co 10:5</a>.`<a href="./study/isbe/search.html?string=CAPTIVITY">CAPTIVITY</a>; <a href="./study/isbe/search.html?string=ASSIR">ASSIR</a>; <a href="./study/isbe/search.html?string=WAR">WAR</a>`57';
isbe[1852]='Captivity`kap-tiv\'-i-ti (galah, galuth, shebhuth, shibhyah; metoikesia):<P><b>I. OF THE NORTHERN KINGDOM (THE WORK OF ASSYRIA)</b><P class="in15">1. Western Campaigns of Shalmaneser II, 860-825 BC<P class="in15">2. Of Rimmon-nirari III, 810-781 BC<P class="in15">3. Of Tiglath-pileser III, 745-727 BC<P class="in15">4. Of Shalmaneser IV, 727-722 BC—Siege of Samaria<P class="in15">5. Samaria Captured by Sargon, 722 BC<P class="in15">6. Depopulation and Repopulation of Samaria<P class="in15">7. The Ten Tribes in Captivity<P><b>II. OF JUDAH (THE WORK OF THE CHALDAEAN POWER)</b><P>Southern Kingdom and House of David<P class="in15">1. Break-up of Assyria<P class="in15">2. Downfall of Nineveh, 606 BC<P class="in15">3. Pharaoh Necoh\'s Revolt<P class="in15">4. Defeat at Carchemish, 604 BC<P class="in15">5. The New Babylonian Empire under Nebuchadrezzar, 604-562 BC<P class="in30">The Mission of Jeremiah, 626-580 BC<P class="in15">6. Revolt and Punishment of Jehoiakim, 608-597 BC<P class="in15">7. Siege and Surrender of Jerusalem under Jehoiachin, 597 BC<P class="in15">8. First Deportation, 597 BC<P class="in30">The Baskets of Figs<P class="in15">9. The Ministry of Ezekiel, 592-570 BC<P class="in15">10. Jeremiah\'s Ministry in Jerusalem, 597-588 BC<P class="in15">11. Zedekiah\'s Rebellion and Siege of Jerusalem, 588-586 BC<P class="in30">Jeremiah "Falling Away to the Chaldeans"<P class="in15">12. Destruction of Jerusalem, 586 BC<P class="in30">Flight, Capture, and Punishment of Zedekiah<P class="in15">13. Second Deportation of Inhabitants, 586 BC<P class="in15">14. Third Deportation, 581 BC<P class="in30">(1) Number and Quality of Exiles<P class="in30">(2) The Residue Left<P class="in15">15. Gedaliah, Governor of Judah<P class="in30">(1) Jeremiah and the Flight to Egypt<P class="in30">(2) Descendants of the Fugitives, 471-411 BC<P class="in15">16. The Exiles in Babylon: Their Social Condition, 464-405 BC<P class="in15">17. The Rise and Development of Judaism<P class="in15">18. The Return by Permission of Cyrus, 538 BC<P class="in15">19. Rebuilding of the Temple, 536 BC<P class="in30">Completed 515 BC<P class="in15">20. Reforms and Labors of Ezra and Nehemiah, 445 BC<P class="in15">21. Modern Theories of the Return<P class="in15">22. Importance of the Period of Ezra-Nehemiah<P>LITERATURE</b><hr /><P>I. Of the Northern Kingdom (The Work of Assyria).<P>1. Western Campaigns of Shalmaneser II, 860-825 BC:<P>The captivity of the Northern Kingdom was the work of the great Assyrian power having its seat at Nineveh on the Tigris. The empire of Assyria, rounded nearly 2000 BC, had a long history behind it when its annals begin to take notice of the kingdom of Israel and Judah. The reign of Shalmaneser II (860-825 BC) marks the first contact between these powers. This is not the Shalmaneser mentioned in <a onClick="return mV(\'2Ki\',17,\'1-\');">2Ki 17</a> and <a onClick="return mV(\'2Ki\',18,\'1-\');">18</a>, who is the fourth of the name and flourished more than a century later. Shalmaneser II was contemporary during his long reign with Jehoshaphat, Jehoram, Ahaziah and Joash, kings of Judah; with Ahab, Ahaziah, Jehoram and Jehu, kings of Israel; with Hazael and Benhadad II, kings of Syria at Damascus, and with Mesha, king of Moab. The Assyrian authorities for his reign are an inscription engraved by himself on the rocks of Armenia; the Black Obelisk brought by Layard from Nimroud, now in the British Museum; and the texts engraved on the bronze gates of Balawat, discovered by Hormuzd Rassam in 1878, and recognized as the swinging gates of Shalmaneser\'s palace. From these authorities we learn that in his 6th year he encountered the combined forces of Damascus, Hamath, Israel, and other states which had united to oppose his progress westward, and completely routed them in the battle of Karkar (854 BC). The danger which threatened the western states in common had brought Syria and Israel together; and this is in accord with the Scripture narrative which tells of a covenant, denounced by God\'s prophet, between Ahab and Benhadad (<a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>ff), and mentions a period of three years when there was no war between Syria and Israel. The defeat of the allies seems, however, to have broken up the confederacy, for, soon after, Ahab is found, with the aid of Jehoshaphat of Judah, attempting unsuccessfully, and with fatal result to himself, to recover from the weakened power of Syria the city of Ramoth-gilead (<a onClick="return mV(\'1Ki\',22,\'1-\');">1Ki 22</a>). In another campaign to the west, which likewise finds no record in Scripture, Shalmaneser received the tribute of Tyre and Sidon, and of "Yahua of Khumri," that is, of Jehu, of the land of Omri, as Israel is called on the monuments.<P>2. Of Rimmon-nirari III, 810-781 BC:<P>The next Assyrian monarch who turned his arms against the west was Rimmon-nirari III (810-781 BC), grandson of Shalmaneser II. Although he is not mentioned by name in Scripture, his presence and activity had their influence upon contemporary events recorded in 2 Kings. He caused Syria to let go her hold of Israel; and although he brought Israel into subjection, the people of the Northern Kingdom would rather have a ruler exercising a nominal sovereignty over them in distant Nineveh than a king oppressing them in Damascus. Hence, Rimmon-nirari has been taken for the saviour whom God gave to Israel, "so that they went out from under the hand of the Syrians" (<a onClick="return mV(\'2Ki\',13,5);">2Ki 13:5</a>; compare <a onClick="return mV(\'2Ki\',13,23);">2Ki 13:23</a>).<P>With the death of Rimmon-nirari in 781 BC, the power of Assyria received a temporary check, and on the other hand the kingdom of Judah under Uzziah and the kingdom of Israel under Jeroboam II reached the zenith of their political prosperity. In 745 BC, however, a usurper, Pul, or Pulu, ascended the throne of Assyria, and reigned as Tiglath-pileser III. It is by the former name that he is first mentioned in the Scripture narrative (<a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>; <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>), and by the latter that he is mentioned on the monuments. That the two names belong to one man is now held to be certain (Schrader, COT, I, 230f).<P>3. Of Tiglath-pileser III, 745-727 BC:<P>Tiglath-pileser was one of the greatest monarchs of antiquity. He was the first to attempt to consolidate an empire in the manner to which the world has become accustomed since Roman times. He was not content to receive tribute from the kings and rulers of the states which he conquered. The countries which he conquered became subject provinces of his empire, governed by Assyrian satraps and contributing to the imperial treasury. Not long after he had seated himself on the throne, Tiglath-pileser, like his predecessors, turned his attention to the west. After the siege of Arpad, northward of Aleppo, the Assyrian forces made their way into Syria, and putting into operation the Assyrian method of deportation and repopulation, the conqueror annexed Hamath which had sought the alliance and assistance of Azariah, that is Uzziah, king of Judah. Whether he then refrained from molesting Judah, or whether her prestige was broken by this campaign of the Assyrian king, it is not easy to say. In another campaign he certainly subjected Menahem of Israel with other kings to tribute. What is stated in a word or two in the Annals of Tiglath-pileser is recorded at length in the Bible history (<a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>ff): "There came against the land Pul the king of Assyria; and Menahem gave Pul a thousand talents of silver, that his hand might be with him to confirm the kingdom in his hand. And Menahem exacted the money of Israel, even of all the mighty men of wealth, of each man 50 shekels of silver, to give to the king of Assyria. So the king of Assyria tamed back, and stayed not there in the land." In the reign of Pekah, under his proper name of Tiglath-pileser, he is recorded to have raided the northern parts of Israel, and carried the inhabitants away into the land of Assyria (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>). We next hear of Ahaz, king of Judah, appealing to the Assyrians for help against "these two tails of smoking firebrands," Rezin of Syria and Pekah, the son of Remaliah (<a onClick="return mV(\'Isa\',7,4);">Isa 7:4</a>). To secure this help he took the silver and gold of the house of the Lord, and sent it as a present to the king of Assyria (<a onClick="return mV(\'2Ki\',16,8);">2Ki 16:8</a>). Meanwhile Tiglath-pileser was setting out on a new campaign to the west. He carried fire and sword through Syria and the neighboring lands as far as Gaza, and on his return he captured Samaria, without, however, razing it to the ground. Pekah having been slain by his own people, the Assyrian monarch left Hoshea, the leader of the conspiracy, on the throne of Israel as the vassal of Assyria.<P>4. Of Shalmaneser IV, 727-722 BC—Seige of Samaria:<P>In 727 BC Tiglath-pileser III died and was succeeded by Shalmaneser IV. His reign was short and no annals of it have come to light. In <a onClick="return mV(\'2Ki\',17,\'1-\');">2Ki 17</a> and <a onClick="return mV(\'2Ki\',18,\'1-\');">18</a>, however, we read that Hoshea, relying upon help from the king of Egypt, thought the death of Tiglath-pileser a good opportunity for striking a blow for independence. It was a vain endeavor, for the end of the kingdom of Israel was at hand. The people were grievously given over to oppression and wickedness, which the prophets Amos and Hosea vigorously denounced. Hosea, in particular, was "the prophet of Israel\'s decline and fall." Prophesying at this very time he says: "As for Samaria, her king is cut off, as foam upon the water. The high places also of Aven, the sin of Israel, shall be destroyed: the thorn and the thistle shall come up on their altars; and they shall say to the mountains, Cover us; and to the hills, Fall on us" (<a onClick="return mV(\'Hsa\',10,7,8);">Ho 10:7-8</a>; compare <a onClick="return mV(\'Hsa\',10,14,15);">Ho 10:14-15</a>). No less stern are the predictions by Isaiah and Micah of the doom that is to overtake Samaria: "Woe to the crown of pride of the drunkards of Ephraim, and to the fading flower of his glorious beauty, which is on the head of the fat valley of them that are overcome with wine" (<a onClick="return mV(\'Isa\',28,1);">Isa 28:1</a>). "For the transgression of Jacob is all this, and for the sins of the house of Israel. What is the transgression of Jacob? is it not Samaria?...Therefore I will make Samaria as a heap of the field, and as places for planting vineyards" (<a onClick="return mV(\'Mic\',1,5,6);">Mic 1:5-6</a>). No help came from Egypt. With the unaided and enfeebled resources of his kingdom Hoshea had to face the chastising forces of his sovereign. He was made prisoner outside Samaria and was most likely carried away to Nineveh. Meanwhile the land was over-run and the capital doomed to destruction, as the prophets had declared.<P>5. Samaria Captured by Sargon, 722 BC:<P>Not without a stubborn resistance on the part of her defenders did "the fortress cease from Ephraim" (<a onClick="return mV(\'Isa\',17,3);">Isa 17:3</a>). It was only after a three years\' siege that the Assyrians captured the city (<a onClick="return mV(\'2Ki\',17,5);">2Ki 17:5</a>). If we had only the record of the Hebrew historian we should suppose that Shalmaneser was the monarch to whom fell the rewards and honors of the capture. Before the surrender of the city Shalmaneser had abdicated or died, and Sargon, only once mentioned in Scripture (<a onClick="return mV(\'Isa\',20,1);">Isa 20:1</a>), but one of the greatest of Assyrian monarchs, had ascended the throne. From his numerous inscriptions, recovered from the ruins of Khorsabad, we learn that he, and not Shalmaneser, was the king who completed the conquest of the revolted kingdom and deported the inhabitants to Assyria. "In the beginning (of my reign)," says Sargon in his Annals, "the city Samaria (I took) with the help of Shamash, who secures victory to me (.... 27,290 people inhabiters of it) I took away captive; 50 chariots the property of my royalty, which were in it I appropriated. (.... the city) I restored, and more than before I caused it to be inhabited; people of the lands conquered by my hand in it (I caused to dwell. My governor over them I appointed, and tribute) and imposts just as upon the Assyrians I laid upon them." The Assyrian Annals and the Scripture history support and supplement each other at this point. The sacred historian describes the deportation as follows: "The king of Assyria took Samaria, and carried Israel away into Assyria, and placed them in Halah, and on the Habor, the river of Gozan, and in the cities of the Medes...because they obeyed not the voice of Yahweh their God, but transgressed his covenant, even all that Moses, the servant of Yahweh, commanded, and would not hear it, nor do it" (<a onClick="return mV(\'2Ki\',17,6,7);">2Ki 17:6-7</a>; <a onClick="return mV(\'2Ki\',18,11,12);">18:11-12</a>).<P>6. Depopulation and Repopulation of Samaria:<P>The repopulation of the conquered territory is also described by the sacred historian: "And the king of Assyria brought men from Babylon, and from Cuthah, and from Avva, and from Hamath and Sepharvaim, and placed them in the cities of Samaria instead of the children of Israel; and they possessed Samaria, and dwelt in the cities thereof" (<a onClick="return mV(\'2Ki\',17,24);">2Ki 17:24</a>). The fact that Sargon introduced foreign settlers taken in war into Samaria is attested by inscriptions. That there were various episodes of deportation and repopulation in connection with the captivity of the Northern Kingdom appears to be certain. We have seen already that Tiglath-pileser III deported the population of the northern tribes to Assyria and placed over the depopulated country governors of his own. And at a time considerably later, we learn that Sargon\'s grandson Esarhaddon, and his great-grandson Ashur-bani-pal, "the great and noble Osnappar," imported to the region of Samaria settlers of nations conquered by them in the East (<a onClick="return mV(\'Ezr\',4,2,10);">Ezr 4:2, 10</a>). Of the original settlers, whom a priest, carried away by the king of Assyria but brought back to Bethel, taught "the law of the god of the land," it is said that "they feared Yahweh, and served their own gods, after the manner of the nations from among whom they had been carried away" (<a onClick="return mV(\'2Ki\',17,33);">2Ki 17:33</a>). The hybrid stock descended from those settlers is known to us in later history and in the Gospels as the Samaritans.<P>7. The Ten Tribes in Captivity:<P>We must not suppose that a clean sweep was made Of the inhabitants of the Northern Kingdom. No doubt, as in the Babylonian captivity, "the poorest of the land were left to be vinedressers and husbandmen" (<a onClick="return mV(\'2Ki\',25,12);">2Ki 25:12</a>). The numbers actually deported were but a moiety of the whole population. But the kingdom of the Ten Tribes was now at an end. Israel had become an Assyrian province, with a governor established in Samaria. As regards the Golah—the captives of Israel in the cities of the Medes—it must not be supposed that they became wholly absorbed in the population among whom they were settled. We can well believe that they preserved their Israelite traditions and usages with sufficient clearness and tenacity, and that they became part of the Jewish dispersion so widespread throughout the East. It is quite possible that at length they blended with the exiles of Judah carried off by Nebuchadrezzar, and that then Judah and Ephraim became one nation as never before. The name Jew, therefore, naturally came to include members of what had earlier been the Northern Confederacy of Israel as well as those of the Southern Kingdom to which it properly belonged, so that in the post-exilic period, Jehudi, or Jew, means an adherent of Judaism without regard to local nationality.<P>II. Of Judah (The Work of the Chaldean Power).<P>Southern Kingdom and House of David<P>The captivity of Judah was the work of the great Chaldean power seated at Babylon on the Euphrates. While the Northern Kingdom had new dynasties to rule it in quick succession, Judah and Jerusalem remained true to the House of David to the end. The Southern Kingdom rested on a firmer foundation, and Jerusalem with its temple and priesthood secured the throne against the enemies who overthrew Samaria for nearly a century and a half longer.<P>1. Break-up of Assyria:<P>Sargon, who captured Samaria in 722 BC, was followed by monarchs with a great name as conquerors and builders and patrons of literature, Sennacherib, Esarhaddon, Ashurbanipal. When Ashurbanipal died in 625 BC, the dissolution of the Assyrian Empire was not far off. Its hold over the West had greatly slackened, and the tributary peoples were breaking out into revolt. Bands of Scythians, a nomad Aryan race, from the region between the Caucasus and the Caspian, were sweeping through the Assyrian Empire as far as Palestine and Egypt, and the prophecies of Jeremiah and Zephaniah reflect their methods of warfare and fierce characteristics. They were driven back, however, at the frontier of Egypt, and appear to have returned to the north without invading Judah.<P>2. Downfall of Nineveh, 606 BC:<P>From the north these hordes were closing in upon Nineveh, and on all sides the Assyrian power was being weakened. In the "Burden of Nineveh," the prophet Nahum foreshadows the joy of the kingdom of Judah at the tidings of its approaching downfall: "Behold, upon the mountains the feet of him that bringeth good tidings, that publisheth peace! Keep thy feasts, O Judah, perform thy vows; for the wicked one shall no more pass through thee; he is utterly cut off" (<a onClick="return mV(\'Nah\',1,15);">Na 1:15</a>; compare <a onClick="return mV(\'Nah\',3,\'8-11\');">Na 3:8-11</a>). The Medes regained their independence and under their king, Cyaxares, formed an alliance with the Chaldeans, who soon afterward revolted under the leadership of Nabopolassar, viceroy of Babylon. Rallying these various elements to his standard Nabopolassar laid siege to the Assyrian capital, and in 606 BC, Nineveh, which had been the capital city of great conquerors, and had "multiplied (her) merchants above the stars of heaven" (<a onClick="return mV(\'Nah\',3,16);">Na 3:16</a>), fell before the combined forces of the Medes and Chaldeans, fell suddenly and finally, to rise no more. Of the new Babylonian Empire upon which the Chaldeans now entered, Nebuchadrezzar, whose father Nabopolassar had associated him with him on the throne, was the first and most eminent ruler.<P>3. Pharaoh Necoh\'s Revolt:<P>That the people of Judah should exult in the overthrow of Nineveh and the empire for which it stood we can well understand. Jerusalem herself had by God\'s mercy remained unconquered when Sennacherib nearly a century before had carried off from the surrounding country 200,150 people and had devastated the towns and fortresses near. But the hateful Assyrian yoke had rested upon Judah to the end, and not upon Judah only but even upon Egypt and the valley of the Nile. In 608 BC Pharaoh Necoh revolted from his Assyrian suzerain and resolved upon an eastern campaign. He had no desire to quarrel with Josiah of Judah, through whose territory he must pass; but in loyalty to his Assyrian suzerain Josiah threw himself across the path of the Egyptian invader and perished in the battle of Megiddo. The Pharaoh seems to have returned to Egypt, taking Jehoahaz the son of Josiah with him, and to have appointed his brother Jehoiakim king of Judah, and to have exacted a heavy tribute from the land.<P>4. Defeat at Carchemish, 604 BC:<P>But he did not desist from his purpose to win an eastern empire. Accordingly he pressed forward till he reached the Euphrates, where he was completely routed by the Babylonian army under Nebuchadrezzar in the decisive battle of Carchemish, 604 BC. The battle left the Chaldeans undisputed masters of Western Asia, and Judah exchanged the yoke of Assyria for that of Babylon.<P>5. The New Babylonian Empire under Nebuchadrezzar, 604-562 BC:<P>So far as cruelty was concerned, there was little to choose between the new tyrants and the old oppressors. Of the Chaldeans Habakkuk, who flourished at the commencement of the new Empire, says: "They are terrible and dreadful....Their horses also are swifter than leopards, and are more fierce than the evening wolves; and their horsemen spread themselves: yea, their horsemen come from far; they fly as an eagle that hasteth to devour" (<a onClick="return mV(\'Hab\',1,7,8);">Hab 1:7-8</a> the American Revised Version, margin). Over Western Asia, including Judah, Nebuchadrezzar since the battle of Carchemish was supreme. It was vain for Judah to coquet with Egypt when Nebuchadrezzar had a long and powerful arm with which to inflict chastisement upon his disloyal subjects.<P>The Mission of Jeremiah, 626-580 BC.<P>The mission of Jeremiah the prophet in this crisis of the history of Judah was to preach obedience and loyalty to the king of Babylon, and moral reformation as the only means of escaping the Divine vengeance impending upon land and people. He tells them in the name of God of the great judgment that was to come at the hand of the Chaldeans on Jerusalem and surrounding peoples. He even predicts the period of their subjection to Chaldean domination: "And this whole land shall be a desolation, and an astonishment; and these nations shall serve the king of Babylon seventy years" (<a onClick="return mV(\'Jer\',25,11);">Jer 25:11</a>). This preaching was unpalatable to the partisans of Egypt and to those who believed in the inviolability of Jerusalem. But with stern rebuke and with symbolic action he proclaims the doom of Jerusalem, and in the face of persecution and at the risk of his life, the prophet fulfills his ministry.<P>6. Revolt and Punishment of Jehoiakim, 608-597 BC:<P>Jehoiakim, who was first the vassal of Pharaoh Necoh, and then of Nebuchadrezzar, was in corruption and wickedness too faithful a representative of the people. Jeremiah charges him with covetousness, the shedding of innocent blood, oppression and violence (<a onClick="return mV(\'Jer\',22,\'13-19\');">Jer 22:13-19</a>). The fourth year of Jehoiakim was the first year of Nebuchadrezzar, who, fresh from the victory of Carchemish, was making his sovereignty felt in the western world. The despicable king of Judah became Nebuchadrezzar\'s vassal and continued in his allegiance three years, after which he turned and rebelled against him. But he received neither encouragement nor help from the neighboring peoples. "Yahweh sent against him bands of the Chaldeans, and bands of the Syrians, and bands of the Moabites, and bands of the children of Ammon, and sent them against Judah to destroy it, according to the word of Yahweh, which he spake by his servants the prophets" (<a onClick="return mV(\'2Ki\',24,2);">2Ki 24:2</a>). The history of the latter part of Jehoiakim\'s reign is obscure. The Hebrew historian says that after a reign of eleven years he slept with his fathers, from which we infer that he died a natural death. From Daniel we learn that in the third year of Jehoiakim, Nebuchadrezzar came up against Jerusalem and besieged it, and carried off, along with vessels of the house of God, members of the seed royal, and of the nobility of Judah, among whom was Daniel the prophet. That Jehoiakim was included in what seems to be a first installment of the captivity of Judah is expressly affirmed by the Chronicler who says: "Against him (Jehoiakim) came up Nebuchadnezzar...and bound him in fetters, to carry him to Babylon" (<a onClick="return mV(\'2Ch\',36,6);">2Ch 36:6</a>). However the facts really stand, the historian adds to the record of the death of Jehoiakim and of the succession of Jehoiachin the significant comment: "And the king of Egypt came not again any more out of this land; for the king of Babylon had taken, from the brook of Egypt unto the river Euphrates, all that pertained to the king of Egypt" (<a onClick="return mV(\'2Ki\',24,7);">2Ki 24:7</a>).<P>7. Siege and Surrender of Jerusalem under Jehoiachin, 597 BC:<P>Jehoiachin who succeeded Jehoiakim reigned only three months, the same length of time as his unfortunate predecessor Jehoahaz (<a onClick="return mV(\'2Ki\',23,31);">2Ki 23:31</a>). The captivity of Jehoahaz in Egypt and the captivity of Jehoiachin in Babylon are lamented in a striking elegy by Ezekiel, who compares them to young lions, the offspring of the mother lioness Israel, which learned to catch and their prey and devoured men, but were taken in the pit of the nations and put in rings, so that their roar was no more heard in the mountains of Israel (<a onClick="return mV(\'Eze\',19,\'1-9\');">Eze 19:1-9</a>). Nebuchadrezzar came in person while his servants were besieging Jerusalem, and Jehoiachin surrendered at discretion. So the king and his mother and his servants and his princes and his officers were carried off with the mighty men of valor, even ten thousand captives. \'None remained, save the poorest sort of the people of the land. He carried out thence all the treasures of the house of Yahweh, and the treasures of the king\'s house, and cut in pieces all the vessels of gold, which Solomon king of Israel had made in the temple of Yahweh, as Yahweh had said.<P>8. First Deportation, 597 BC:<P>And all the men of might, even seven thousand, and the craftsmen and the smiths a thousand, all of them strong and apt for war, even them the king of Babylon brought captive to Babylon. And the king of Babylon made Mattaniah, Jehoiachin\'s father\'s brother, king in his stead, and changed his name to Zedekiah\' (<a onClick="return mV(\'2Ki\',24,\'10-17\');">2Ki 24:10-17</a>). From Jehoiachin dates the carrying away into Babylon, the year being 597 BC. The unfortunate monarch lived in exile in Babylon 38 years, and seems to have retained the respect and loyalty of the exiles among whom he dwelt.<P>The Baskets of Figs:<P>It was with reference to the deportation of the princes and craftsmen and smiths that Jeremiah had his vision of the baskets of figs—one containing figs very good, like the first ripe figs; the other very bad, so bad they could not be eaten (<a onClick="return mV(\'Jer\',24,\'1-3\');">Jer 24:1-3</a>). The good figs were the captives of Judah carried away into the land of the Chaldeans for good; the bad figs were the king Zedekiah and his princes and the residue of Jerusalem, upon whom severe judgments were yet to fall till they were consumed from off the land (<a onClick="return mV(\'Jer\',24,\'4-10\');">Jer 24:4-10</a>).<P>9. The Ministry of Ezekiel, 592-570 BC:<P>Among the captives thus carried to Babylon and placed on the banks of the Chebar was the priest-prophet Ezekiel. Five years after the captivity he began to have his wonderful "visions" of God, and to declare their import to the exiles by the rivers of Babylon. To the desponding captives who were engrossed with thoughts of the kingdom of Judah, not yet dissolved, and of the Holy City, not yet burned up with fire, Ezekiel could only proclaim by symbol and allegory the destruction of city and nation, till the day when the distressing tidings reached them of its complete overthrow. Then to the crushed and despairing captives he utters no lamentations like those of Jeremiah, but rather joyful predictions of a rebuilt city, of a reconstituted kingdom, and of a renovated and glorious temple.<P>10. Jeremiah\'s Ministry in Jerusalem, 597-588 BC:<P>Although the flower of the population had been carried away into Babylon and the Temple had been despoiled of its treasures, Jerusalem and the Temple still stood. To the inhabitants who were left behind, and to the captives in Babylon, Jeremiah had a message. To the latter he offered counsels of submission and contentment, assured that the hateful and repulsive idolatries around them would throw them back upon the law of their God, and thus promote the work of moral and spiritual regeneration within them. \'Thus saith Yahweh, I will give them a heart to know me, that I am Yahweh: and they shall be my people, and I will be their God; for they shall return unto me with their whole heart\' (<a onClick="return mV(\'Jer\',24,5,7);">Jer 24:5, 7</a>). To "the residue of Jerus" his counsels and predictions were distasteful, and exposed him to the suspicion of disloyalty to his people and his God. None of his warnings was more impressive than that symbolically proclaimed by the bands and bars which the prophet was to put upon his neck to send to the kings of Edom and Moab and Ammon and Tyre and Sidon, who seem to have had ideas of forming an alliance against Nebuchadrezzar. Zedekiah was also urged to submit, but still entertained hopes that the king of Babylon would allow the captives of Judah to return. He even himself went to Babylon, perhaps summoned thither by his suzerain (<a onClick="return mV(\'Jer\',51,59);">Jer 51:59</a>). With an Egyptian party in Jerusalem urging an alliance with Egypt, and with a young and warlike Pharaoh on the throne, Hophra (Apries), Zedekiah deemed the opportunity favorable for achieving independence, and entered into an intrigue with the Egyptian king. So Zedekiah rebelled against the king of Babylon (<a onClick="return mV(\'2Ki\',24,20);">2Ki 24:20</a>).<P>11. Zedekiah\'s Rebellion and the Siege of Jerusalem, 588-586 BC:<P>It was a bold throw, but Nebuchadrezzar would brook no such disloyalty from his vassals. He marched at once to the west, and committed to Nebuzaradan the task of capturing Jerusalem, while he himself established his headquarters at Riblah, in Syria, on the Orontes. Meanwhile the Pharaoh with his army crossed the frontier to the help of his allies, and compelled the Chaldeans to raise the siege of Jerusalem and meet him in the field (<a onClick="return mV(\'Jer\',37,5);">Jer 37:5</a>). But here his courage failed him, and he retired in haste without offering battle. Nebuzaradan now led back his army and the siege became closer than before.<P>Jeremiah "Falling Away to the Chaldeans"<P>During the breathing-space afforded by the withdrawal of the Chaldeans, Jeremiah was going out of the city to his native Anathoth, some 4 miles to the Northeast across the ridge, on family business (<a onClick="return mV(\'Jer\',37,\'11-15\');">Jer 37:11-15</a>). His departure was observed, and he was charged with falling away to the Chaldeans, and cast into an improvised dungeon in the house of Jonathan the scribe. While there the king sent for him and asked, "Is there any word from Yahweh?" And Jeremiah answered fearlessly, "There is. Thou shalt be delivered into the hand of the king of Babylon." For a time Jeremiah, by the favor of Zedekiah, enjoyed after this a greater measure of freedom; but as he continued to urge in hearing of all the people the duty of surrender, his enemies vowed that he should be put to death, and had him cast into a foul empty cistern, where he ran the risk of being choked or starved to death. Once again the king sought an interview with the prophet, giving him private assurance that he would not put him to death nor allow his enemies to do so. Again the prophet counseled surrender, and again he was allowed a measure of freedom.<P>12. Destruction of Jerusalem, 586 BC:<P>Flight, Capture, and Punishment of Zedekiah<P>But the end of the doomed city was at hand. In the 11th year of Zedekiah, 586 BC, in the 4th month, the 9th day of the month, a breach was made in the city (<a onClick="return mV(\'Jer\',39,1,2);">Jer 39:1-2</a>), and the final assault completed the work that had been done by months of famine and want. Zedekiah and his men of war do not seem to have waited for the delivery of the last assault. They fled from the city by night "by the way of the king\'s garden, through the gate betwixt the two walls," and made eastward for the Arabah. But the army of the Chaldeans pursued them, and overtook Zedekiah in the plains of Jericho. They took him prisoner and brought him to Nebuchadrezzar at Riblah, where the king of Babylon first slew the son of Zedekiah, and then put out his eyes. With the sons of the captured monarch were slain all the nobles of Judah. This time neither city nor temple nor palace was spared. Nebuzaradan "burnt the house of Yahweh, and the king\'s house; and all the houses of Jerusalem, even every great house, burnt he with fire" (<a onClick="return mV(\'2Ki\',25,9);">2Ki 25:9</a>). His soldiers, too, broke down the walls of Jerusalem round about. The treasure and the costly furnishings of the Temple, in so far as they had escaped the former spoliation, were carried away to Babylon. The ruin of Jerusalem was complete. The Book of Lamentations utters the grief and shame and penitence of an eyewitness of the captures and desolation of the Holy City: "Yahweh hath accomplished his wrath, he hath poured out his fierce anger; and he hath kindled a fire in Zion, which hath devoured the foundations thereof. The kings of the earth believed not, neither all the inhabitants of the world, that the adversary and the enemy would enter into the gates of Jerusalem. Woe unto us! for we have sinned. For this our heart is faint; for these things our eyes are dim; for the mountain of Zion, which is desolate: the foxes walk upon it" (<a onClick="return mV(\'Lam\',4,11,12);">La 4:11-12</a>; <a onClick="return mV(\'Lam\',5,16,18);">5:16, 18</a>).<p>13. Second Deportation of Inhabitants, 586 BC:<P>"So Judah," says the prophet who had been through the siege and the capture (if not rather the editor of his prophecies), "was carried away captive out of his land" (<a onClick="return mV(\'Jer\',52,27);">Jer 52:27</a>). The statements of the numbers carried away are, however, conflicting. In <a onClick="return mV(\'Jer\',52,\'28-30\');">Jer 52:28-30</a> we read of three deportations: that of 597 BC when 3,023 Jews were carried off; that of 586 BC when Nebuchadrezzar carried off 832 persons; and one later than both in 581 BC, when Nebuzaradan carried away captive of the Jews 745 persons—a total of 4,600.<P>14. Third Deportation, 581 BC:<P>(1) Number and Quality of Exiles:<P>In <a onClick="return mV(\'2Ki\',24,15,16);">2Ki 24:15-16</a> it is said that in 597 Nebuchadrezzar carried to Babylon 8,000 men. Dr. George Adam Smith taking all the data together estimates that the very highest figures possible are 62,000 or 70,000 men, women and children, less than half of the whole nation (Jerusalem, II, 268-70). In 597 BC, Nebuchadrezzar carried off the princes and nobles and craftsmen and smiths, leaving behind the poorest sort of the people of the land (<a onClick="return mV(\'2Ki\',24,14);">2Ki 24:14</a>).<P>(2) The Residue Left:<P>In 586 BC Nebuzaradan carried off the residue of the people that were left in the city, but he "left of the poorest of the land to be vinedressers and husbandmen" (<a onClick="return mV(\'2Ki\',25,12);">2Ki 25:12</a>). "They were, as the Biblical narratives testify, the poorest of the land, from whom every man of substance and energy had been sifted; mere groups of peasants, without a leader and without a center; disorganized and depressed; bitten by hunger and compassed by enemies; uneducated and an easy prey to the heathenism by which they were surrounded. We can appreciate the silence which reigns in the Bible regarding them, and which has misled us as to their numbers. They were a negligible quantity in the religious future of Israel: without initiative or any influence except that of a dead weight upon the efforts of the rebuilders of the nation, when these at last returned from Babylonia" (Jerusalem, II, 269-70).<P>15. Gedaliah, Governor of Judah:<P>Over those who were left behind, Gedaliah was appointed governor, with his residence at Mizpah, where also a Babylonian contingent remained on guard. Jeremiah had the choice of being taken to Babylon or of remaining in Judah. He preferred to remain with the residue of the people under the care of Gedaliah. With the murder of Gedaliah by Ishmael, a traitorous scion of the royal house, who in turn had to flee and made good his escape, it looked as if the last trace of the former kingdom of Judah was wiped out.<P>(1) Jeremiah and the Flight to Egypt:<P>Against the counsel of Jeremiah, the remnant, led by Johanan the son of Kareah, resolved to take refuge in Egypt and insisted that Jeremiah and his friend Baruch should accompany them. It is in Egypt, amid disappointment and misrepresentation which he had to endure, that we have our last glimpse of the prophet of the downfall of Judah.<P>(2) Descendants of the Fugitives, 471-411 BC:<P>Of the descendants of those settlers in Egypt remarkable remains have been discovered within the last few years. They consist of Aramaic papyri which were found at Assouan, the ancient Syene, and which belong to a time not more than a century after the death of Jeremiah. The documents are accounts and contracts and deeds of various kinds, from which we gather that in the 5th century BC there were Jews keeping themselves apart as they do still, worshipping Yahweh, and no other God, and even having a temple and an altar of sacrifice to which they brought offerings as their fathers did at Jerusalem before the destruction of the Temple. These papyri give us valuable glimpses of the social condition and religious interest of the settlers.<P>See <a href="./study/isbe/search.html?string=DISPERSION">DISPERSION</a>.<P>16. The Exiles in Babylon: Their Social Condition, 464-405 BC:<P>Of the Jewish captives carried off by Nebuchadrezzar and settled by the rivers of Babylon, we learn something from the prophecies of Daniel which are now generally believed to belong to the Maccabean period, and much from the prophecies of Ezekiel, from the Psalms of the Captivity, and from the Second Isaiah, whose glowing messages of encouragement and comfort were inspired by the thought of the Return. From Haggai and Zechariah we see how the work of rebuilding the Temple was conceived and carried out. Of the social condition of the Exiles an interesting revelation is given by the excavations at Nippur. From cuneiform tablets, now in the Imperial Ottoman Museum at Constantinople, preserved among the business archives of the wealthy firm of Murashu, sons of Nippur, in the reign of Artaxerxes I and Darius II (464-405 BC), there can be read quite a number of Jewish names. And the remarkable thing is that many of the names are those known to us from the genealogical and other lists of the Books of Kings and Chronicles and Ezra and Nehemiah. Professor Hilprecht (The Babylonian Expedition, IX, 13ff) infers from an examination of these that a considerable number of the Jewish exiles, carried away by Nebuchadrezzar after the destruction of Jerusalem, were settled in Nippur and its neighborhood. Of this fact there are various proofs. The Talmudic tradition which identifies Nippur with Calneh (<a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>) gains new force in the light of these facts. And "the river Khebar in the land of the Chaldeans," by which Ezekiel saw his vision, is now known from inscriptions to be a large navigable canal not far from Nippur (ibid., 27,28).<P>17. The Rise and Development of Judaism:<P>The influence of the Captivity as a factor in the development of Judaism can hardly be overestimated. "The captivity of Judah," says Dr. Foakes-Jackson (Biblical History of the Heb, 316) "is one of the greatest events in the history of religion....With the captivity the history of Israel ends, and the history of the Jews commences." Placed in the midst of heathen and idolatrous surroundings the Golah recoiled from the abominations of their neighbors and clung to the faith of their fathers in the God of Abraham. Exposed to the taunts and the scorn of nations that despised them, they formed an inner circle of their own, and cultivated that exclusiveness which has marked them ever since. Being without a country, without a ritual system, without any material basis for their life as a people, they learned as never before to prize those spiritual possessions which had come down to them from the past. They built up their nationality in their new surroundings upon the foundation of their religion. Their prophets, Jeremiah and Ezekiel, had encouraged and stimulated them with the assurance of spiritual blessings, and the promise of restoration. For their whole social and domestic and spiritual life there was needed some steady and continuous regulative principle or scheme. The need of this threw their leaders and thinkers back upon the Law of Moses. The rabbi and the scribe took the place of the sacrificing priest. The synagogue and the Sabbath came to occupy a new place in the religious practice of the people. These and other institutions of Judaism only attained to maturity after the Return, but the Captivity and the Exile created the needs they were meant to supply. While the prophets were clear and explicit in setting forth the Captivity, they were not less so in predicting the Return. Isaiah with his doctrine of the Remnant, Micah, Zephaniah, Jeremiah, Ezekiel and others gifted with the vision of God, cheered the nation, each in their day, with the hope of restoration and return, not for Judah only but for Israel as well. Vineyards were to be planted again upon the mountains of Samaria as well as in the valleys of Judah. Jeremiah had even predicted the length of the period of the Exile, when he declared that the inhabitants of the land should serve the king of Babylon for seventy years (<a onClick="return mV(\'Jer\',25,12);">Jer 25:12</a>; <a onClick="return mV(\'Jer\',29,10);">29:10</a>).<P>18. The Return by Permission of Cyrus, 538 BC:<P>It was in Cyrus, who brought about the fall of Babylon and ended the New Babylonian Empire in 539 BC, that the hopes of the exiles came to be centered. He was "the battle- axe" with which Yahweh was to shatter Babylon (<a onClick="return mV(\'Jer\',51,20);">Jer 51:20</a>), and as he proceeded on his path of victory the unknown Seer whom we call the Second Isaiah welcomed him as the liberator of his people. "Thus saith Yahweh...of Jerusalem, She shall be inhabited; and of the cities of Judah, They shall be built, and I will raise up the waste places thereof; that saith to the deep, Be dry, and I will dry up thy rivers; that saith of Cyrus, He is my shepherd, and shall perform all my pleasure, even saying of Jerusalem, She shall be built; and of the temple, Thy foundation shall be laid" (<a onClick="return mV(\'Isa\',44,\'26-28\');">Isa 44:26-28</a>).<P>19. Rebuilding of the Temple, 536 BC:<P>Within a year of the entry of Cyrus into Babylon an edict was issued (<a onClick="return mV(\'2Ch\',36,22,23);">2Ch 36:22-23</a>; <a onClick="return mV(\'Ezr\',1,1);">Ezr 1:1</a>ff), granting permission to the exiles to return and build a house for the Lord in Jerusalem. He also brought forth the vessels of the Temple which Nebuchadrezzar had carried away and handed them over to Sheshbazzar, the prince of Judah; and Sheshbazzar brought them with him when they of the Captivity were brought up from Babylon unto Jerusalem.<P>Particulars of the Return are given in the Books of Ezra and Nehemiah, and in the prophecies of Haggai and Zechariah. Of the exiles 42,360 returned under Sheshbazzar, besides slaves; and under Jeshua the son of Jozadak the priest, and Zerubbabel, the son of Shealtiel, first an altar was built and then the foundations of the Temple were laid. In consequence of the opposition of the Samaritans, who were refused any share in the restoration of the Temple, the work of rebuilding was greatly hindered, and came to a stop. It was then that Haggai and Zechariah urged the resumption of the work and partly by denouncing the niggardliness of the people and partly by foreshadowing the glorious future in store for the Temple, hastened forward the enterprise.<P>Completed 515 BC:<P>At length in the month Adar, in the 6th year of Darius (515 BC) the work was completed and the Passover celebrated within the courts of the restored Sanctuary (<a onClick="return mV(\'Ezr\',6,\'15-18\');">Ezr 6:15-18</a>).<P>20. Reforms and Labors of Ezra and Nehemiah, 445 BC:<P>For some decades the history is silent, and it was in 458 BC that Ezra set out for Jerusalem taking 1,800 Jews along with him. He found that the returned Jews had become allied in marriage with the people of the land and were in danger of losing their racial characteristics by absorption among the heathen (<a onClick="return mV(\'Ezr\',9,\'1-\');">Ezr 9</a>). It was due no doubt to his efforts and those of Nehemiah, supported by the searching and powerful utterances of Malachi, that this peril was averted. Thirteen years later (445 BC) Nehemiah, the cupbearer of Artaxerxes, having heard of the desolate condition of the Holy City, the place of his fathers\' sepulchers, obtained leave of his master to visit Jerusalem. With letters to the governors on the route and to the keeper of the king\'s forest, he set out, and came safely to Jerusalem. Having himself inspected the walls he called the people to the work of repairing the ruins, and despite the taunts and calumny and active hostility of the Samaritan opposition he had the satisfaction of seeing the work completed, the gates set up and the city repopulated. Nehemiah and Ezra then gathered the people together to hear the words of the Law, and at a solemn convocation the Law was read and explained to the assembly. Thereafter a covenant was entered into by the people that they would observe the Law of Moses and not intermarry with the heathen nor traffic on the Sabbath, but would pay a third of a shekel annually for the services of the Temple and would bring first-fruits and tithes (<a onClick="return mV(\'Neh\',10,28);">Ne 10:28</a>ff).<P>21. Modern Theories of the Return:<P>The course of the history as here set forth has been disputed by some modern scholars, who hold that there was no return of the exiles under Cyrus and that the rebuilding of the Temple was the work of the Jews who remained behind in Judah and Jerusalem (EB, article "Ezra-Nehemiah"). This view, held by the late Professor Kosters of Leyden and supported by Professor H. P. Smith and other scholars, proceeds largely upon the rejection of the historical character of the Book of Ezra-Nehemiah. The historical difficulties which are found in the book are by no means such as to warrant us in denying the fact of the Return and the work of Ezra in connection with Nehemiah. As regards the Return, the course of the narrative is too well supported by documents which bear upon them the stamp of historical truth to be rashly disputed. Moreover, it seems highly improbable that an enterprise requiring such energy and skill and faith should have been undertaken, without stimulus from without, by the residue of the people. We have already seen how little initiative was to be expected of the poorest of the people; and the silence of Haggai, on the subject of the Return, is no argument against it. That the Judaism of Palestine required invigoration by an infusion of the zeal and enthusiasm which grew up in the Judaism of Babylonian, is manifest from the story of the Captivity.<P>22. Importance of the Period Ezra-Nehemiah:<P>From the age of Nehemiah and the period immediately preceding it came influences of the utmost moment for the future. "Within these hundred years," says the late Dr. P. Hay Hunter in After the Exile (I, xvi), "the teaching of Moses was established as the basis of the national life, the first steps were taken toward the formation of a canon of Scripture. Jewish society was moulded into a shape which succeeding centuries modified, but did not essentially change. During this period the Judea of the days of our Lord came into being. Within this period the forces which opposed Christ, the forces which rallied to His side, had their origin. This century saw the rise of parties, which afterward became sects under the names of Pharisees and Sadducees. It laid the foundation of Rabbinism. It fixed the attitude of the Jews toward the Gentiles. It put the priesthood in the way to supreme authority. It gave birth to the Samaritan schism."<P>LITERATURE.<P>Schrader, COT, I; McCurdy, HPM, I, 281ff, II, 249ff, III; C. F. Barney, Notes on Heb Text of Bks of Kings; Foakes-Jackson, Biblical Hist of the Heb, 260-412; G. A. Smith, Jerusalem, II, 223-349; Cambridge Biblical Essays, 93-135; P. Hay Hunter, The Story of Daniel and After the Exile; EB, article "Ezra-Nehemiah"; Nicol, Recent Archaeology and the Bible, 239-78; H. P. Smith, Old Testament Hist, 219-412; Kittel, History of the Heb, II, 329ff.`<a href="./study/isbe/search.html?string=CAPTIVE">CAPTIVE</a>`128';

isbe[1855]='Carabasion`kar-a-ba\'-zi-on (Rhabasion, Karabasion; Marimoth): One of the sons of Baani (1Esdras 9:34) who had married foreign wives, during the captivity. The name is allowed to be corrupt; it seems to be represented by Meremoth in the list of <a onClick="return mV(\'Ezr\',10,36);">Ezr 10:36</a>.``1';
isbe[1856]='Caravan`kar\'-a-van, kar-a-van\' (\'orach): This word is not found in the King James Version, but the Revised Version (British and American) employs it three times, namely, in <a onClick="return mV(\'Job\',6,18,19);">Job 6:18-19</a> (\'orchoth), where the King James Version renders "paths" (<a onClick="return mV(\'Job\',6,18);">Job 6:18</a>) and "troops" (<a onClick="return mV(\'Job\',6,19);">Job 6:19</a>); in <a onClick="return mV(\'Isa\',21,13);">Isa 21:13</a> (\'orechoth), where the King James Version and English Versions of the Bible give "travelling companies," and in <a onClick="return mV(\'Eze\',27,25);">Eze 27:25</a> (sharoth), where the King James Version gives a totally different translation. The Hebrew text in Ezekiel is dubious, but in Isaiah and Job "caravan" is undoubtedly a correct rendering of the Hebrew (compare also <a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a>). The inhabitants of Palestine were familiar with the caravans—the goods trains of the Semitic world—which traveled between BabyIon and Syria on the one hand to Arabia and on the other to Egypt. The main routes between these countries passed through Canaan. Isaiah refers to "caravans of Jedanites"—a trading Arabic tribe who conveyed their wares to Babylon. Job compares his would-be friends to a deceitful brook, full in the rainy season, but dry in summer, which entices caravans to turn aside from the main route in the hope of a plentiful supply of water, but which fails the thirsty travelers when they need it most.``103';
