isbe[1801]='Caldron`kol\'-drun (the rendering of qallachath, cir, dudh \'aghmon): Qallachath is found only in <a onClick="return mV(\'1Sa\',2,14);">1Sa 2:14</a>; <a onClick="return mV(\'Mic\',3,3);">Mic 3:3</a>. It is a pot for cooking, of undefined size and characteristics, in the former passage for sanctuary use, in the latter for domestic. Cir is translated caldron in <a onClick="return mV(\'Jer\',1,13);">Jer 1:13</a> (Revised Versions); <a onClick="return mV(\'Jer\',52,18);">Jer 52:18</a>f (the King James Version); <a onClick="return mV(\'Eze\',11,3,7,11);">Eze 11:3, 7, 11</a>. It was distinctly a large pot, employed both for domestic use and in the sanctuary. Dudh is translated caldron only in <a onClick="return mV(\'2Ch\',35,13);">2Ch 35:13</a>. It was also a pot for cooking. \'Aghmon is translated caldron by the King James Version in <a onClick="return mV(\'Job\',41,20);">Job 41:20</a>, but it is a mistranslation; the Revised Version (British and American) correctly has "rushes."``12';
isbe[1802]='Caleb`ka\'-leb (kalebh; in the light of the cognate Syriac and Arabic words, the meaning is not "dog," which is kelebh, in Hebrew, but "raging with canine madness"; Chaleb): As a person, Caleb, the son of Jephunneh, occurs in the story of the spies (<a onClick="return mV(\'Num\',13,\'1-\');">Nu 13</a>ff). He represents the tribe of Judah as its prince (<a onClick="return mV(\'Num\',13,6);">Nu 13:6</a>; compare <a onClick="return mV(\'Num\',13,2);">Nu 13:2</a>). While the majority of the men sent out by Moses bring back evil report, Caleb and Hoshea, or Joshua, the son of Nun, are the only ones to counsel the invasion of the promised land (<a onClick="return mV(\'Num\',13,30);">Nu 13:30</a>; <a onClick="return mV(\'Num\',14,6);">14:6</a>ff). Accordingly, these two alone are permitted to survive (<a onClick="return mV(\'Num\',14,38);">Nu 14:38</a>; <a onClick="return mV(\'Num\',32,12);">32:12</a>). Upon the conquest and distribution of the land by Joshua, Caleb reminds the leader of the promise made by God through Moses, and so he receives Hebron as an inheritance for himself and his descendants (<a onClick="return mV(\'Jos\',14,\'6-15\');">Jos 14:6-15</a>), after driving out from thence the Anakim who were in possession of the city (<a onClick="return mV(\'Jos\',15,14);">Jos 15:14</a>). In the parallel account in <a onClick="return mV(\'Jdg\',1,8);">Jud 1:8</a>ff, the dispossession of the Canaanite inhabitants of Hebron is ascribed to Judah (<a onClick="return mV(\'Jdg\',1,10);">Jud 1:10</a>). Both accounts agree in mentioning Othniel, a younger brother of Caleb, as the conqueror of Kiriath-sepher or Debir; as his reward he receives the hand of Achsah, Caleb\'s daughter. Achsah is given by her father a portion of the southland; but, upon request, she obtains a more fruitful locality with upper and nether springs (<a onClick="return mV(\'Jos\',15,\'15-19\');">Jos 15:15-19</a>; <a onClick="return mV(\'Jdg\',1,\'12-15\');">Jud 1:12-15</a>).<P>In <a onClick="return mV(\'1Sa\',30,14);">1Sa 30:14</a> Caleb is undoubtedly the name of a clan which is, moreover, differentiated from Judah. Modern scholars therefore assume that Caleb was originally an independent clan which in historical times merged with Judah. As Caleb is called the son of Kenaz (<a onClick="return mV(\'Jdg\',1,13);">Jud 1:13</a>) or the Kenizzite (<a onClick="return mV(\'Num\',32,12);">Nu 32:12</a>), it is further believed that the Calebites were originally associated with an Edomite clan named Kenaz (<a onClick="return mV(\'Gen\',36,11);">Ge 36:11</a>), and that they entered their future homes in the southern part of Palestine from the south. Their migration up north would then be reflected in the story of the spies.<P>In the genealogical tables (<a onClick="return mV(\'1Ch\',2,\'1-\');">1Ch 2</a>), Caleb is made a descendant of Judah through his father Hezron. He is the brother of Jerahmeel, and the "father" of Hebron and of other towns in Judah. (Chelubai, <a onClick="return mV(\'1Ch\',9,9);">1Ch 9:9</a>, is apparently identical with Caleb.)<P>Nabal, with whom David had an encounter, is called a Calebite, i.e. one belonging to the house of Caleb (<a onClick="return mV(\'1Sa\',25,3);">1Sa 25:3</a>).``115';
isbe[1803]='Caleb-Ephrathah`ka\'-leb ef\'-ra-tha, -ef\'-ra-ta (the King James Version Caleb-ephratah, kalebh \'ephrathah): The place where Hezron died (<a onClick="return mV(\'1Ch\',2,24);">1Ch 2:24</a>). Many scholars, however, read with the Septuagint "after the death of Hezron, Caleb came unto Ephrath, the wife of Hezron, his father." The name does not occur elsewhere, and none resembling it has been recovered.``1';
isbe[1804]='Calendar`kal\'-en-dar (Latin calendarium, "an account book," from calendae, "day on which accounts were due"): The Hebrew or Jewish calendar had three stages of development: the preexilic, or Biblical; the postexilic, or Talmudic; and the post-Talmudic. The first rested on observation merely, the second on observation coupled with calculation, and the third on calculation only. In the first period the priests determined the beginning of each month by the appearance of the new moon and the recurrence of the prescribed feasts from the vernal and autumnal equinoxes. Thus, the month Abib (\'abhibh), the first month of the year according to the Levitical law, in which the Passover was to be celebrated, was determined by observation (<a onClick="return mV(\'Exd\',12,2);">Ex 12:2</a>; <a onClick="return mV(\'Deu\',16,\'1-\');">De 16</a>). After the exile more accurate methods of determining the months and seasons came into vogue, and calculation was employed to supplement and correct observations and the calendar was regulated according to the Babylonian system, as is evidenced by the names of the months which are derived from it. In later times the calendar was fixed by mathematical methods (see the article "Calendar" in the Jewish Encyclopedia). The difficulty of ascertaining the first day of the new moon by observation, in the early period, led to the celebration of two days, as seems to be indicated in <a onClick="return mV(\'1Sa\',20,27);">1Sa 20:27</a>. We have only four names of months belonging to the pre-exilic period, and they are Phoenician. Of these Abib (\'abhibh) was the first month, as already indicated, and it corresponded to Nis (nican) in the later calendar. It was the month in which the Exodus occurred and the month of the Passover (<a onClick="return mV(\'Exd\',13,4);">Ex 13:4</a>; <a onClick="return mV(\'Exd\',23,15);">23:15</a>; <a onClick="return mV(\'Exd\',34,18);">34:18</a>; <a onClick="return mV(\'Deu\',16,1);">De 16:1</a>).<P>The 2nd month of this calendar was Ziv (ziw) (<a onClick="return mV(\'1Ki\',6,1,37);">1Ki 6:1, 37</a>); Ethanim (\'ethanim) was the 7th (<a onClick="return mV(\'1Ki\',8,2);">1Ki 8:2</a>), corresponding to Tishri of the later calendar, and Bul (bul) the 8th, corresponded to Marchesvan (marcheshwan) (<a onClick="return mV(\'1Ki\',6,38);">1Ki 6:38</a>). There were course other month names in this old calendar, but they have not come down to us. These names refer to the aspects of the seasons: thus Abib (\'abhibh) means grain in the ear, just ripening (<a onClick="return mV(\'Lev\',2,14);">Le 2:14</a>; <a onClick="return mV(\'Exd\',9,31);">Ex 9:31</a>); Ziv (ziw) refers to the beauty and splendor of the flowers in the spring; Ethanim (\'ethanim) means perennial, probably referring to living fountains; and Bul (bul) means rain or showers, being the month when the rainy season commenced. The full calendar of months used in the postexilic period is given in a table accompanying this article. The names given in the table are not all found in the Bible, as the months are usually referred to by number, but we find Nican in <a onClick="return mV(\'Neh\',2,1);">Ne 2:1</a> and <a onClick="return mV(\'Est\',3,7);">Es 3:7</a>; Siwan in <a onClick="return mV(\'Est\',8,9);">Es 8:9</a>; Tammuz in <a onClick="return mV(\'Eze\',8,4);">Eze 8:4</a>, although the term as here used refers to a Phoenician god after whom the month was named; \'Elul occurs in <a onClick="return mV(\'Neh\',6,15);">Ne 6:15</a>; Kiclew (the American Standard Revised Version "chislev") in <a onClick="return mV(\'Neh\',1,1);">Ne 1:1</a> and <a onClick="return mV(\'Zec\',7,1);">Zec 7:1</a>; Tebheth in <a onClick="return mV(\'Est\',2,16);">Es 2:16</a>; Shebhat in <a onClick="return mV(\'Zec\',1,7);">Zec 1:7</a> and \'Adhar in <a onClick="return mV(\'Ezr\',6,15);">Ezr 6:15</a> and several times in Est. These months were lunar and began with the new moon, but their position in regard to the seasons varied somewhat because of the intercalary month about every three years.<P>The year (shanah) originally began in the autumn, as appears from <a onClick="return mV(\'Exd\',23,16);">Ex 23:16</a> and <a onClick="return mV(\'Exd\',34,22);">Ex 34:22</a>, where it is stated that the feast of Ingathering should be at the end of the year; the Sabbatic year began, also, in the 7th month of the calendar year (<a onClick="return mV(\'Lev\',25,\'8-10\');">Le 25:8-10</a>), indicating that this had been the beginning of the year. This seems to have been a reckoning for civil purposes, while the year beginning with Nican was for ritual and sacred purposes. This resulted from the fact that the great feast of the Passover occurred in this month and the other feasts were regulated by this, as we see from such passages as <a onClick="return mV(\'Exd\',23,\'14-16\');">Ex 23:14-16</a> and <a onClick="return mV(\'Deu\',16,\'1-17\');">De 16:1-17</a>. Josephus (Ant., I, iii, 3) says: "Moses appointed that Nican, which is the same with Xanthicus, should be the first month of their festivals, because he brought them out of Egypt in that month; so that this month began the year as to all solemnities they observed to the honor of God, although he preserved the original order of the months as to selling and buying and other ordinary affairs." A similar custom is still followed in Turkey, where the Mohammedan year is observed for feasts, the pilgrimage to Mecca and other sacred purposes, while the civil year begins in March O. S.<P>The year was composed of 12 or 13 months according as to whether it was ordinary or leap year. Intercalation is not mentioned in Scripture, but it was employed to make the lunar correspond approximately to the solar year, a month being added whenever the discrepancy of the seasons rendered it necessary. This was regulated by the priests, who had to see that the feasts were duly observed at the proper season. The intercalary month was added after the month of \'Adhar and was called the second \'Adhar (sheni, wa-\'adhar, "and Adar"), and, as already indicated, was added about once in 3 years. More exactly, 4 years out of every 11 were leap years of 13 months (Jewish Encyclopedia, article "Calendar"), this being derived from the Babylonian calendar. If, on the 16th of the month Nican, the sun had not reached the vernal equinox, that month was declared to be the second \'Adhar and the following one Nican. This method, of course, was not exact and about the 4th century of our era the mathematical method was adopted. The number of days in each month was fixed, seven having 30 days, and the rest 29. When the intercalary month was added, the first \'Adhar had 30 and the second 29 days.``138';
isbe[1805]='Calf`kaf (\'eghel; par, or par, often rendered "bullock"): The etymology of both words is uncertain, but the former has a close parallel in the Arabic \'ijl, "calf." Par is generally used of animals for sacrifice, \'eghel, in that and other senses. \'Eghel is used of the golden calves and frequently in the expression, \'eghel marbeq, "fatted calf," or "calf of the stall," the latter being the literal meaning (<a onClick="return mV(\'1Sa\',28,24);">1Sa 28:24</a>; <a onClick="return mV(\'Jer\',46,21);">Jer 46:21</a>; <a onClick="return mV(\'Amo\',6,4);">Am 6:4</a>; <a onClick="return mV(\'Mal\',4,2);">Mal 4:2</a>).<P>At the present day beef is not highly esteemed by the people of the country, but mutton is much prized. In the houses of the peasantry it is common to see a young ram being literally stuffed with food, mulberry or other leaves being forced into its mouth by one of the women, who then works the sheep\'s jaw with one hand. The animal has a daily bath of cold water. The result is deliciously fat and tender mutton. Such an animal is called a ma\'luf. From the same root we have ma\'laf, "manger," suggestive of the Hebrew marbeq, "stall."<P>The calf for sacrifice was usually a male of a year old. Other references to calves are: "to skip like a calf" (<a onClick="return mV(\'Psa\',29,6);">Ps 29:6</a>); "the calf and the young lion and the fatling together" (<a onClick="return mV(\'Isa\',11,6);">Isa 11:6</a>); "a habitation deserted...there shall the calf feed, and there shall he lie down, and consume the branches thereof" (<a onClick="return mV(\'Isa\',27,10);">Isa 27:10</a>).`<a href="./study/isbe/search.html?string=CATTLE">CATTLE</a>`37';
isbe[1806]='Calf Image``<a href="./study/isbe/search.html?string=IMAGES">IMAGES</a>`1';
isbe[1807]='Calf, Golden`kaf, gol\'-d\'-n:<P><b>I. THE NAME</b><P><b>II. ANCIENT CALF WORSHIP</b><P class="in15">1. Narrative of Aaron\'s Golden Calf<P class="in15">2. Jeroboam\'s Golden Calves<P><b>III. ATTITUDE OF ELIJAH TO THE BULL SYMBOLS</b><P><b>IV. ATTITUDE OF AMOS AND HOSEA TO THE BULL SYMBOLS</b><P><b>LITERATURE</b><hr /><P>I. The Name.<P>The term \'eghel, is the ordinary Hebrew name for a male calf and is as flexible as the English name, applying to any animal from one a year old (<a onClick="return mV(\'Mic\',6,6);">Mic 6:6</a>) or perhaps younger (<a onClick="return mV(\'Lev\',9,3);">Le 9:3</a>; <a onClick="return mV(\'Lev\',12,6);">12:6</a>) to one three years old (<a onClick="return mV(\'Gen\',15,9);">Ge 15:9</a>; compare <a onClick="return mV(\'Jer\',34,18,19);">Jer 34:18-19</a>). It has been thought that the habitual use of this diminutive term for the golden bulls which Aaron and Jeroboam set up—especially as it is twice made feminine (<a onClick="return mV(\'Hsa\',10,5);">Ho 10:5</a>; <a onClick="return mV(\'Hsa\',13,2);">13:2</a>)—was intended to indicate their small size and thus to express contempt for them. This however, though plausible, is by no means certain. It was not their size which made these bulls contemptible in the eyes of the prophets, and besides there were no life-size bulls of molten gold in any surrounding countries so far as known. The reference to female calves that were kissed (<a onClick="return mV(\'Hsa\',13,2);">Ho 13:2</a>), presumably at Bethel, may refer not to the worship of the bulls, but to their female counterparts, since in all other countries such female deities invariably accompanied the bull gods. Bethel may be especially mentioned because it was the "king\'s sanctuary" (<a onClick="return mV(\'Amo\',7,13);">Am 7:13</a>) or because of the multitude of altars and high places found there (<a onClick="return mV(\'Hsa\',10,8);">Ho 10:8</a>; compare <a onClick="return mV(\'Hsa\',8,11);">Ho 8:11</a>; <a onClick="return mV(\'Amo\',5,26);">Am 5:26</a>). False worship is also mentioned in connection with Jeroboam\'s apostasy, at Gilgal and Gilead (<a onClick="return mV(\'Hsa\',4,15);">Ho 4:15</a>; <a onClick="return mV(\'Hsa\',12,11);">12:11</a>; <a onClick="return mV(\'Amo\',4,4);">Am 4:4</a>; <a onClick="return mV(\'Amo\',5,5);">5:5</a>), Samaria (<a onClick="return mV(\'Hsa\',8,6);">Ho 8:6</a>; <a onClick="return mV(\'Hsa\',10,5);">10:5</a>; <a onClick="return mV(\'Hsa\',13,2,16);">13:2, 16</a>); and Beersheba (<a onClick="return mV(\'Amo\',5,5);">Am 5:5</a>; <a onClick="return mV(\'Amo\',8,14);">8:14</a>) where no bulls had been set up by Jeroboam so far as stated. That these places receive more condemnation than Dan—which is explicitly mentioned in only one passage (<a onClick="return mV(\'Amo\',8,14);">Am 8:14</a>) though it was a chief center of the bull worship (<a onClick="return mV(\'1Ki\',12,30);">1Ki 12:30</a>)—may be due to the fact that the worship of the female deity was the more popular. This was certainly true in neighboring countries and also in other cities in Palestine, as has recently been proved by the excavations (see below).<P>II. Ancient Calf Worship.<P>The origin of animal worship is hidden in obscurity, but reverence for the bull and cow is found widespread among the most ancient historic cults. Even in the prehistoric age the influence of the bull symbol was so powerful that it gave its name to one of the most important signs of the Zodiac, and from early historic times the horns of the bull were the familiar emblem of the rays of the sun, and solar gods were very commonly represented as bull-gods (Jensen, Kosmologie, 62-90; Winckler, Altorientalische Forschungen, 1901-5, passim; Jeremias, Das Alter der bah. Astronomie, 1909, passim). The Egyptians, close neighbors of the Heb, in all eras from that of the Exodus onward, worshipped living bulls at Memphis (not Mendes, as EB) and Hellopolls as incarnations of Ptah and Ra, while one of the most elaborate rituals was connected with the life-size image of the Hathor-cow (Naville, Deir el Bahari, Part I (1907), 163-67), while the sun was revered as the "valiant bull" and the reigning Pharaoh as "Bull of Bulls." But far more important in this connection is the fact that "calf" worship was almost if not quite universal among all the ancient Semitic peoples. If the immediate ancestors of Abraham did not revere this deity, they were certainly quite unlike their relatives, the Babylonians, among whom, according to all tradition, they lived before they migrated to Palestine (<a onClick="return mV(\'Gen\',11,28,30);">Ge 11:28, 30</a>; Josephus, Ant, I, vi, 5), for the Babylonians revered the bull as the symbol of their greatest gods, Ann and Sin and Marduk—the ideograph of a young bullock forming a part of the latter\'s name—while Hadadrimmon, an important Amorite deity, whose attributes remarkably resemble those of Yahweh (see Ward, AJSL, XXV, 175-85; Clay, Amurru (1909), 87-89), is pictured standing on the back of a bull. In Phoenicia also the bull was a sacred animal, as well as in NorthernSyria where it ranked as one of the chief Hittite deities its images receiving devout worship (see further, Sayce, Encyclopedia of Rel. and Ethics, under the word "Bull"). Among all these peoples the cow goddess was given at least equal honor. In Babylonia the goddess Ishtar has the cow for her symbol on very ancient seal cylinders, and when this nude or half-nude goddess appears in Palestine she often stands on a bull or cow (see William Hayes Ward, Cylinders and Other Ancient Oriental Seals), and under slightly different forms this same goddess is revered in Arabia, Moab, Phoenicia, Syria and elsewhere, while among the Semitic Canaanites the bull was the symbol of Baal, and the cow of Astarte (see particularly Barton, Hebraica, IX, 133-63; X, 1-74, and Semitic Origins, chapter vii; Driver, "Astarte" in DB). Recent excavations in Palestine have shown that during all eras no heathen worship was as popular as that of Astarte in her various forms (see S. A. Cook, Rel. of Ancient Palestine, 1909). That she once is found wearing ram\'s horns (PEFS (1903), 227) only reveals her nature more clearly as the goddess of fertility. Her relation to the sacred fish at Carnion in Gilead and to the doves of Ascalon, as well as to female prostitution and to Nature\'s "resurrection" and fruitage, had been previously well known, as also her relation to the moon which governs the seasons. Is there any rational motif which can account for this widespread "calf" worship? Is it conceivable that this cult could so powerfully influence such intelligent and rather spiritually-minded nations as the Egyptians and Babylonians if it were wholly irrational and contained no spiritual content? And is there no rational explanation behind this constant fusion of the deity which controls the breeding of cattle with the deity which controls vegetation? How did the bull come to represent the "corn spirit," so that the running of a bull through the corn (the most destructive act) came to presage good crops; and how did the rending of a bull, spilling his life blood on the soil, increase fertility? (See Fraser, Golden Bough, II, 291-93, 344.) The one real controlling motif of all these various representations and functions of the "calf" god may be found in the ancient awe, especially among the Semites, for the Mystery of Life. This seems to offer a sufficient reason why the bull, which is a most conspicuous example of life-giving power, should be so closely connected with the reproductive processes of the animal and vegetable kingdoms and also with the sun, which from earliest historic times was considered as preeminently the "giver of life." Bull worship was not always an exhibition of gross animalism, but, certainly in Bible times, often represented a concept which was the product of reflection upon one of the deepest mysteries of Nature. Few hymns in Egypt or Babylon express higher spiritual knowledge and aspiration than those addressed to the bull gods or to others honored with this title, e. g. this one to the god Sin of Ur, the "heifer of Anu," "Strong young bull; with strong horns,...with beard of lapislazuli color...self-created, full of developed fruit...Mother-womb who has taken up his abode, begetter of all things, exalted habitation among living creatures; O merciful gracious father, in whose hand rests the life of the whole world; O Lord, thy divinity is full of awe like the far-off heaven and the broad ocean!" (Rogers, Religion of Babylonia and Assyria (1908), 164). Many modern scholars believe that the primitive Egyptians and Babylonians really thought of their earthly and heavenly gods as animals (see especially Maspero, Bulletin critique, 1886; Revue de l\'histoiredes religions, 1888), but it seems certain that at least as early as the date of the Exodus these stars and beasts were not regarded by all as being themselves deities, but rather as symbols or representations of deity (Davis and Cobern, Ancient Egypt, 281-89; Brugsch, Die Aegyptologie, I, 135; Chwolsohn, Die Ssabier u. der Ssabismus, II, 134).<P>1. Narrative of Aaron\'s Golden Calf:<P>The text of <a onClick="return mV(\'Exd\',32,\'1-\');">Ex 32</a> is certainly composite (see e. g. Bacon\'s "Exodus" in the place cited and DB), and some words and phrases are a verbal dupli care of the narrative of Jeroboam\'s calf worship (compare <a onClick="return mV(\'Exd\',32,4);">Ex 32:4</a> with <a onClick="return mV(\'1Ki\',12,28);">1Ki 12:28</a>, and see parallel columns in Driver\'s Deteronomy). Some Bible critics so analyze the text as to make the entire calf story a later element, without ancient basis, added to some short original statement like <a onClick="return mV(\'Exd\',32,\'7-11\');">Ex 32:7-11</a>, for the sake of satirizing Jeroboam\'s bull worship and its non-Levitical priesthood (see e. g. Kuenen, Hexateuch). Most recent critics have however accepted the incident as an ancient memory or historic fact attested by the oldest sources, and used thus by the Deuteronomist (<a onClick="return mV(\'Deu\',9,\'1-\');">De 9</a>), though the verbal form may have been affected by the later editor\'s scorn of the northern apostasy. It seems clearly unreasonable to suppose that a Hebrew writer at any era would so fiercely abuse his own ancestors, without any traditional basis for his statements, merely for the sake of adding a little more which cast reproach upon his northern neighbors, and it seems equally unlikely that any such baseless charges would have been accepted as true by the slandered nation. The old expositors, accepting the essential historicity of the account, generally followed Philo and the early Fathers in supposing this calf of gold was an image of the Apis or Mnevis bulls of Egypt, and this is occasionally yet advocated by some Egyptologists (e. g. Steindorf, Ancient Egypt (1903), 167; compare also Jeremias, Old Testament in Light of Ancient East (1911), II, 138). The objections made to this view by the skeptics of the 18th century, based on the supposed impossibility of such chemical and mechanical skill being possessed at that era, have mostly been made obsolete by recent discovery. The common modern objection that this could not have been Apis worship because the Apis was a living bull, is by no means conclusive, since images of Apis are not uncommon and were probably worshipped in the temple itself. It may be added that a renaissance of this worship occurred at this very era. So Erman, Handbook of Egyptian Rel. (1907), 23-79. Modern Bible scholars, however, are practically unanimous in the opinion that the Golden Calf, if worshipped at all, must have been a representation of a Semitic, not an Egyptian, deity. In favor of this it may be suggested:<P>(1) It was an era when each deity was considered as the god of a particular country and it would seem impossible that a native Egyptian god should be thought of as joining with Egypt\'s enemies and assisting them to reach a land over which he had no control.<P>(2) The Israelite religion shows little influence from Egypt, but was immensely influenced from Canaan and Babylon, Apis only being mentioned once (<a onClick="return mV(\'Jer\',46,20);">Jer 46:20</a> (translated "heifer"); compare <a onClick="return mV(\'Eze\',20,7,8);">Eze 20:7-8</a>, and see Brugsch, Steininschrift und Bibelwort, passim, and Robertson, Early Religion of Israel, 217).<P>(3) The bull and cow are now known to have been ordinary symbols for the most popular deities which were worshipped by all the race-relatives of the Heb and nowhere more devoutly than in Canaan and in the adjoining districts (see above).<P>(4) Some of the chief gods of the pasture land of Goshen, where the Heb had resided for centuries (<a onClick="return mV(\'Gen\',47,6);">Ge 47:6</a>; <a onClick="return mV(\'Gen\',50,8);">50:8</a>), were Semitic gods which were worshipped not only by the Edomitic Bedouin and other foreigners living there by the "pools of Pithom" (compare <a onClick="return mV(\'Exd\',1,11);">Ex 1:11</a>) but by the native Egyptians, Ramses II even naming a daughter after one of these. The special god of this district had as its symbol a bull calf, and one inscription actually speaks of the statue of a "golden calf of 600 pounds weight" which it was the custom to dedicate annually to one of these Semitic gods, while another inscription mentions a statue of gold "a cubit in height" (Breasted, Ancient Records of Egypt (1905), III, 630-38; Naville, Goshen, Store City of Pithom; Erman, Handbook; 173-74; Brugsch, op. cit.).<P>(5) The chief proof, however, is the statement of the text that the feast in connection with this worship was a "feast to Yahweh" (<a onClick="return mV(\'Exd\',32,5);">Ex 32:5</a>). When Moses disappeared for forty days in the Mount, it was not unnatural that the people should turn back to the visible symbols worshipped by their ancestors, and should give to them the new name or new attributes which had been attached to deity by Moses. The worship was condemned for much the same reason as that of Jeroboam\'s calves (see next section).<P>2. Jeroboam\'s Golden Calves:<P>Though this passage (<a onClick="return mV(\'1Ki\',12,\'26-33\');">1Ki 12:26-33</a>; compare <a onClick="return mV(\'2Ch\',10,14,15);">2Ch 10:14-15</a>) may have been reedited later, "there is no reason to infer that any detail of fact is underived from the olden time" (Burney, Hebrew Text of Kings (1902), and DB). These calves which Jeroboam set up were doubtless bulls (<a onClick="return mV(\'1Ki\',12,28);">1Ki 12:28</a>, Hebrew) but at least as early as Hosea\'s time it seems probable (see above) that the more licentious worship of the feminine principle had been added to the official worship (<a onClick="return mV(\'Hsa\',10,5);">Ho 10:5</a>; <a onClick="return mV(\'Hsa\',13,2);">13:2</a>, Hebrew). This which else here naturally and universally accompanied the bull worship could most truly be called "the sin of Samaria" (<a onClick="return mV(\'Amo\',8,14);">Am 8:14</a>) and be classed as the "sin of Jeroboam" (<a onClick="return mV(\'1Ki\',14,9,16);">1Ki 14:9, 16</a>; <a onClick="return mV(\'1Ki\',16,26);">16:26</a>; <a onClick="return mV(\'2Ki\',10,29);">2Ki 10:29</a>). There is no sufficient reason for explaining the term "molten" in any other an its most natural and usual sense (<a onClick="return mV(\'Exd\',32,8,24);">Ex 32:8, 24</a>; <a onClick="return mV(\'2Ki\',17,16);">2Ki 17:16</a>; <a onClick="return mV(\'Deu\',9,16);">De 9:16</a>), for molded metal idols were common in all eras in Palestine and the surrounding countries, though the core of the image might be molten or graven of some inferior metal overlaid with gold (<a onClick="return mV(\'Isa\',30,22);">Isa 30:22</a>; <a onClick="return mV(\'Isa\',40,19);">40:19</a>, Hebrew; <a onClick="return mV(\'Deu\',7,25);">De 7:25</a>; <a onClick="return mV(\'Exd\',32,4);">Ex 32:4</a>). These bull images were undoubtedly intended to represent Yahweh (yet compare Robertson, op. cit., and Orr, Problem of Old Testament (1906), 145). The text explicitly identifies these images with Aaron\'s calf (<a onClick="return mV(\'1Ki\',12,28);">1Ki 12:28</a>), so that nearly all the reasons given above to prove that Aaron\'s image represented not an Egyptian but an ancient Semitic deity are equally valid here. To these various other arguments may be added:<P>(1) The text itself states that it is Yahweh who brought them from Egypt (<a onClick="return mV(\'Hsa\',2,15);">Ho 2:15</a>; <a onClick="return mV(\'Hsa\',12,13);">12:13</a>; <a onClick="return mV(\'Hsa\',13,4);">13:4</a>), whom they call "My lord," and to whom they swear (<a onClick="return mV(\'Hsa\',2,16);">Ho 2:16</a>, King James Version margin; <a onClick="return mV(\'Hsa\',4,15);">Ho 4:15</a>); and to whom they present their wine offerings, sacrifices and feasts (<a onClick="return mV(\'Hsa\',8,13);">Ho 8:13</a>; <a onClick="return mV(\'Hsa\',9,4,5);">9:4-5</a>, Hebrew; compare <a onClick="return mV(\'Amo\',5,8);">Am 5:8</a>).<P>(2) Jehu, though he destroyed all Baal idols, never touched these bulls (<a onClick="return mV(\'2Ki\',10,28,29);">2Ki 10:28-29</a>).<P>(3) The ritual, though freer, was essentially that of the Jerusalem temple (<a onClick="return mV(\'1Ki\',12,32);">1Ki 12:32</a>; <a onClick="return mV(\'Hsa\',5,6);">Ho 5:6</a>; <a onClick="return mV(\'Amo\',4,5);">Am 4:5</a>; <a onClick="return mV(\'Amo\',5,22,23);">5:22-23</a>; see, Oettli, Greifswalder Studien (1895), quoted in DB, I, 342).<P>(4) Even the southern prophets recognized that it was Yahweh who had given Jeroboam the kingdom (<a onClick="return mV(\'1Ki\',11,31);">1Ki 11:31</a>; <a onClick="return mV(\'1Ki\',12,15,24);">12:15, 24</a>) and only Yahweh worship could have realized Jeroboam\'s purpose of attaching to the throne by this cult such devout citizens as would otherwise be drawn to Jerusalem to worship. It was to guard against this appeal which the national sanctuary made to devout souls that this counter worship had been established. As Budde says, "A foreign cult would only have driven the devout Ephraimites the more surely over to Jerusalem" (Rel. of Israel (1899), 113). Jeroboam was not attempting to shock the conscience of his religious adherents by making heathenism the state religion, but rather to win these pious worshippers of Yahweh to his cause.<P>(5) The places selected for the bull worship were places already sacred to Yahweh. This was preeminently true of Bethel which, centuries before Jerusalem had been captured from the Jebusites, had been identified with special revelations of Yahweh\'s presence (<a onClick="return mV(\'Gen\',13,3,4);">Ge 13:3-4</a>; <a onClick="return mV(\'Gen\',28,19);">28:19</a>; <a onClick="return mV(\'Gen\',31,13);">31:13</a>; <a onClick="return mV(\'Gen\',35,15);">35:15</a>; <a onClick="return mV(\'1Sa\',7,16);">1Sa 7:16</a>; <a onClick="return mV(\'Hsa\',12,4);">Ho 12:4</a>).<P>(6) The story shows that the allegiance of his most pious subjects was retained (<a onClick="return mV(\'1Ki\',12,20);">1Ki 12:20</a>) and that not even Elijah fled to the southern, supposing that the Northern Kingdom had accepted the worship of heathen gods as its state religion. Instead of this, Elijah, though the boldest opponent of the worship of Baal, is never reported as uttering one word against the bull worship at Dan and Bethel.<P>III. Attitude of Elijah to the Bull Symbols.<P>This surprising silence is variously explained. A few scholars, though without any historic or textual evidence for the charge, are sure that the Bible narratives (though written by southern men) are fundamentally defective at this point, otherwise they would report Elijah\'s antagonism to this cult. Other few, equally without evidence, are comfortably sure that he fully approved the ancient ancestral calf cult. Others, with more probability, explain his position on the ground that, though he may not have favored the bull symbol—which was never used by the Patriarchs so far as known, and certainly was not used as a symbol of Yahweh in the Southern Kingdom, or Hosea the northern prophet would have spoken of it—yet being himself a northern man of old ideals and simple habits, Elijah may have believed that, even with this handicap, the freer and more democratic worship carried on al the ancient holy places in the north was less dangerous than the elaborate and luxurious ritual of the aristocratic and exclusive priesthood of the south, which insisted upon political and religious centralization, and was dependent upon such enormous revenues for its support (compare <a onClick="return mV(\'1Ki\',12,10,14);">1Ki 12:10, 14</a>). At any rate it is self-evident that if Elijah had turned against Jeroboam and the state religion, it would have divided seriously the forces which needed to unite, in order to oppose with all energy the much fouler worship of Baal which just at this crisis, as never before or afterward, threatened completely to overwhelm the worship of Yahweh.<P>IV. Attitude of Amos and Hosea to the Bull Symbols.<P>It is easy to see why Hosea might fiercely condemn a ritual which Elijah might rightly tolerate.<P>(1) This calf worship may have deteriorated. Elijah lived closer to the time when the new state ritual was inaugurated and would naturally be at its best. Hosea lived at an era when he could trace the history of this experiment for nearly two cents, and could see clearly that these images had not helped but greatly hindered the development of the ethical and spiritual religion of Yahweh. Even if at first recognized as symbols, these images had become common idols (<a onClick="return mV(\'Hsa\',12,11);">Ho 12:11</a>; <a onClick="return mV(\'Hsa\',13,2);">13:2</a>, and passim). "This tiring became a sin" (<a onClick="return mV(\'1Ki\',12,30);">1Ki 12:30</a>; <a onClick="return mV(\'1Ki\',13,34);">13:34</a>). The history of religion shows many such instances wher the visible or verbal symbol which in one era had been a real aid to devotion at a later time became positively antagonistic to it (see <a href="./study/isbe/search.html?string=IMAGES">IMAGES</a>). As Baal was also worshipped under the form of a calf and as Yahweh himself was at times called "Baal" (<a onClick="return mV(\'Isa\',54,5);">Isa 54:5</a>; <a onClick="return mV(\'Jer\',31,32);">Jer 31:32</a>; <a onClick="return mV(\'Hsa\',2,16);">Ho 2:16</a> Hebrew) this unethical tendency would be accelerated, as also by the political antagonism between Judah and Ephraim and the bitter hatred between the two rival priesthoods (compare <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>; <a onClick="return mV(\'2Ch\',13,9);">13:9</a>). Certain it is that by the middle of the 8th century the worship at Dan and Bethel had extended itself to many other points and had become so closely affiliated with the heathen worship as to be practically indistinguishable—at least when viewed from the later prophetic standpoint. But<P>(2) it cannot be doubted that the prophetic standpoint had changed in 200 years. As the influence of the northern worship had tended toward heathenism, so the influence of the southern worship of an imageless god had tended toward higher spiritual ideals. Elijah could not have recognized the epoch-making importance of an imageless temple. The constant pressure of this idea—God is Spirit—had developed a new spiritual conscience, which by the 8th century was so keen that the worship of Yahweh under the form of an image was not improperly considered as almost if not quite as bad as out-and-out heathenism, just as the Reformers of the 16th century regarded the Roman Catholic images as little better than idols (<a onClick="return mV(\'Hsa\',8,5,6);">Ho 8:5-6</a>; <a onClick="return mV(\'Hsa\',11,2);">11:2</a>; <a onClick="return mV(\'Hsa\',13,2);">13:2</a>; compare <a onClick="return mV(\'2Ki\',17,16,17);">2Ki 17:16-17</a>). The ifluence of this new conscience is also seen in the fact that it is not simply or perhaps chiefly the "calves" which are condemned, but the spirit of ungodliness and unkindness which also made the orthodox worship in Jerusalem little if any better than that at Bethel (<a onClick="return mV(\'Hsa\',6,4);">Ho 6:4</a>; <a onClick="return mV(\'Hsa\',5,12,14);">5:12, 14</a>). The influence of this theology—God is Spirit—had so filled the souls of these prophets that even the sacrifices had lost their importance when unaccompanied by kindness and spiritual knowledge (<a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>; <a onClick="return mV(\'Hsa\',7,1);">7:1</a>), and it is the absence of this essential spirit, rather than the form of worship, which Amos and Hosea condemn in the Northern Kingdom (<a onClick="return mV(\'Amo\',2,\'6-8\');">Am 2:6-8</a>; <a onClick="return mV(\'Amo\',3,10);">3:10</a>; <a onClick="return mV(\'Amo\',4,1);">4:1</a>; <a onClick="return mV(\'Amo\',5,7,\'12-15\',\'21-24\');">5:7, 12-15, 21-24</a>; <a onClick="return mV(\'Amo\',6,12);">6:12</a>; <a onClick="return mV(\'Amo\',8,\'4-6\');">8:4-6</a>; <a onClick="return mV(\'Hsa\',4,2,3);">Ho 4:2-3</a>; <a onClick="return mV(\'Hsa\',9,1);">9:1</a>; <a onClick="return mV(\'Hsa\',10,\'12-14\');">10:12-14</a>). These later prophets could also see, as Elijah could not possibly have seen, that unity of worship was imperatively needed, and that sacrifices in the old sacred "high places" must be discontinued. Only thus could superstitious fanaticism and religious disintegration be avoided. A miscellaneous and unregulated Yahweh cult might become almost as bad as heathenism. Indeed it might be worse if it gave the Baal spirit and interpretation to Yahweh worship.<P>LITERATURE<P>Besides references above, see especially commentaries of Dillmann and Driver on Exodus; Kuenen, Religion of Israel; W. R. Smith, Religion of Semites, 93-113 and index; Konig, Hauptprobleme der altisraelitischen Religionsgeschichte; Baeth gen, Beitr. zur semit. Religionsgeschichte; Kittel, History of Heb; "Baal" and "Ashtoreth" in Encyclopedia of Rel. and Ethics (full lit.); "Golden Calf" in Jewish Encyclopedia for Rabbinical and Mohammedan lit.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`26';
isbe[1808]='Calitas`kal\'-i-tas (Kalitas, or Kaleitais): One of the Levites who put away their foreign wives at the request of Esdras (Ezra), 1Esdras 9:23, "Colius, who was called Calitas." It is the Greek form of Hebrew Kelita (compare parallel passage, <a onClick="return mV(\'Ezr\',10,23);">Ezr 10:23</a>, elaiah, the same is "Kelita"). He is also named with those who explained the law when read to the people by Esdras (1Esdras 9:48; compare <a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>). It is not certain whether he is to be identified with the Kelita of <a onClick="return mV(\'Neh\',10,10);">Ne 10:10</a> (one of the Levites who signed the covenant made by Nehemiah). The word probably means "dwarf."``49';
isbe[1809]='Calker`kok\'-er.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[1810]='Calling`kol\'-ing (klesis, from kaleo, "I call"): Is a New Testament expression. The word is used chiefly by Paul, though the idea and term are found also elsewhere. It has a definite, technical sense, the invitation given to men by God to accept salvation in His kingdom through Jesus Christ. This invitation is given outwardly by the preaching of the gospel, inwardly by the work of the Holy Spirit. With reference to Israel, it is on the part of God irrevocable, not repented of. Having in His eternal counsel called this people, He entrusted them with great gifts, and because He did thus enrich them, He also, in the course of time, summoned them to fulfill the task of initiating the world into the way of salvation, and of preparing salvation for the world. Therefore, He will not desert His people, for He Will not revoke that call (<a onClick="return mV(\'Rom\',11,29);">Ro 11:29</a>). This calling is high or upward, in Christ, that is, made in heaven by God on account of Christ and calling man to heaven (<a onClick="return mV(\'Phl\',3,14);">Php 3:14</a>). Similarly it is a heavenly calling (<a onClick="return mV(\'Hbr\',3,1);">Heb 3:1</a>); also a holy calling, holy in aim, means, and end (<a onClick="return mV(\'2Ti\',1,9);">2Ti 1:9</a>). Christians are urged to walk worthy of this calling (<a onClick="return mV(\'Eph\',4,1);">Eph 4:1</a>) (the American Standard Revised Version and the Revised Version (British and American), but the King James Version has "vocation"). In it there is hope; it is the inspirer of hope, and furnishes for hope its supreme object (<a onClick="return mV(\'Eph\',4,4);">Eph 4:4</a>). Men are exhorted so to live that God will count them worthy of their calling (<a onClick="return mV(\'2Th\',1,11);">2Th 1:11</a>). They are also urged to make their calling and election sure (<a onClick="return mV(\'2Pe\',1,10);">2Pe 1:10</a>). See <a href="./study/isbe/search.html?string=ELECTION">ELECTION</a>. There is a somewhat peculiar use of the word in <a onClick="return mV(\'1Cr\',1,26);">1Co 1:26</a> and <a onClick="return mV(\'1Cr\',7,20);">1Co 7:20</a>, namely, that condition of life in which men were when God called them, not many of them wise after the flesh, not many mighty, not many noble, some circumcised, some uncircumcised, some bond, some free, some male, some female, some married, some unmarried.``177';
isbe[1811]='Callisthenes`ka-lis\'-the-nez (Kallisthenes): An officer of Nicanor who was charged with the burning of the sacred portals of the temple at the time of the desecration under Antiochus Epiphanes (168 BC). After the decisive defeat of Nicanor\'s army at Emmaus (165 BC) the Jews celebrated the victory in the city of their fathers and burned C. who had fled into an outhouse with others who had set the sacred gates on fire, "the meet reward of their impiety" (2Macc 8:33).``1';
isbe[1812]='Calneh`kal\'-ne (kalneh; Chalanne): The name of the fourth city of Nimrod\'s kingdom (<a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>), the three preceding it being Babel, Erech, and Accad, i.e. the capital of the realm of Babylonia and the chief cities of three of the principal states. The meaning of the name is unknown, and many regard the identification as uncertain athers and burned C. who had fled into an outhouse with others who had set the sacred gates on fire, "the meet reward of their impiety" (2Macc 8:33).<P>1. Identified with Nippur:<P>G. Rawlinson thought it to be the modern Niffer (or Noufar), comparing the Talmudic (compare Yoma\') Nopher, which is said to be the same as Calneh. What place-name Calneh corresponds with in cuneiform is doubtful. Fried. Delitzsch (Wo lag das Paradies?) compared it with Kul-unu, but as we are told to pronounce this group as Kullaba, it seems unlikely that there is any connection between the two. The identification proposed by G. Rawlinson, however, may be regarded as being supported by the bilingual Creation-legend, in which Merodach (= Nimrod) is made the founder of Babylon, Erech and Nippur, which would in that case be three of the four cities mentioned in <a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>.<P>2. Nippur\'s Importance:<P>The inscriptions reveal to us Nippur as a city with a glorious past. Sargon of Agade, Sur-Engur, Dungi and all the more prominent kings of Babylonia in its larger sense interested themselves in the rebuilding and restoration of its renowned temples, so as to gain the favor of their great divinities.<P>3. Its Deities and Their Legends:<P>The city\'s earlier divine patrons were Enlil and Ninlil, the older Bel and Beltis, whose shrines were at the great temple-tower called E-kura, "the house of the land," and a poetical legend in Sumerian (dialectical) recording their visit to the city, and enumerating its sacred places, still exists (PSBA, March, 1911, 85ff). Later, the chief deities of the city seem to have been Ninip, the son of Enlil, and his spouse Nin-Nipri, "the lady of Nippur." These two divine beings likewise evoked the muse of the city-scribes, who dealt with the glories of the god in a composition extending over several tablets, in which his favor to his spouse Nin-Nipri is extolled; and to whom a career very similar to that of Merodach, the head of the Babylonian pantheon, is attributed (PSBA, December, 1906, 270ff).<P>4. Its Ruins Today:<P>The great temple-tower of Niffer, which was dedicated to the god Enlil, was a very striking object among the buildings and temples of the city, and the lower stages are still in an extremely perfect condition. Most interesting, also, are the remains of streets and houses which enable the general conditions of life in ancient Babylonia to be estimated, and suggest that they are similar to those subsisting even at the present day. Our knowledge of the city is almost entirely due to the American excavations at Niffer, inaugurated by J. P. Peters, which have been most fruitful and have shed quite a new light on the city\'s history. See Peters\' Nippur (2 volumes, 1887); the many volumes written or edited by Professor H. V. Hilprecht under the general title The Babylonian Expedition of the University of Pennsylvania; and Professor A. T. Clay\'s Light on the Old Testament from Babel (Philadelphia, 1907).``136';
isbe[1813]='Calneh; Calno`kal\'-ne, kal\'-no (kalneh (<a onClick="return mV(\'Amo\',6,2);">Am 6:2</a>), kalno (<a onClick="return mV(\'Isa\',10,9);">Isa 10:9</a>)): "Probably the Kulnia (Kullani) associated with Arpad and Hadrach, Syrian cities, in the Assyrian \'tribute\' list (Western Asiatic Inscriptions, II,  53, <span class="noTag">number 3</span>); Kullanhu about six miles from Arpad" (HDB, I, 344, and 1-vol HDB, 109).``1';

isbe[1815]='Calvary`kal\'-va-ri.`<a href="./study/isbe/search.html?string=GOLGOTHA">GOLGOTHA</a>`1';
isbe[1816]='Calves, of the Lips`kavz, (Septuagint: karpon cheileon): This is the King James Version rendering of a dubious Hebrew text in <a onClick="return mV(\'Hsa\',14,2);">Ho 14:2</a> (parim sephathenu). The Revised Version (British and American) runs "So will we render as bullocks the offering of our lips." Strange as the text is, it may be retained, and it admits of at least a possible explanation. The prophet calls on his contemporaries to return in penitence to Yahweh. Their worship should consist not of meaningless dumb ritual, but of "words"—hymns and prayers, expressive of real gratitude and of actual needs—or perhaps pledges of repentance and reform. The people respond and undertake that their worship shall consist of "calves or bullocks of lips," i.e. not of animal offerings, but of promises of reform or vows of obedience. But this explanation is forced and most modern commentators follow the Septuagint, which presupposes a slightly different Hebrew text, and renders peri sephathenu, "fruit of our lips," i.e. adoring gratitude or, as the author of the Epistle to the He, who quotes this verse from the Septuagint, explains it, "sacrifice of praise" (<a onClick="return mV(\'Hbr\',13,15);">Heb 13:15</a>). The same phrase occurs in <a onClick="return mV(\'Isa\',57,19);">Isa 57:19</a>, where it signifies gladsome gratitude.``103';
isbe[1817]='Cambyses`kam-bi\'-sez (Aram., c-n-b-n-z-y; Persian, Kambujiya; Assyrian, Kambuzia; Egyptian, Kambythet; Susian, Kanpuziya): The older son of Cyrus, king of Persia. Some have thought that he is the Ahasuerus of <a onClick="return mV(\'Ezr\',4,6);">Ezr 4:6</a>. This seems to be most improbable, inasmuch as the Hebrew form of Ahasuerus is the exact equivalent of the Old Persian form of Xerxes, and we have no evidence that Cambyses was ever called Xerxes.<P>Ancient authorities differ as to who was the mother of Cambyses. It is variously said that she was Cassandane, a Persian princess, Amytis, a Median princess, or Nititis, a daughter of Apries king of Egypt. He had one brother, Bardes or Smerdes, whom he put to death secretly shortly after his accession, probably because of an attempted rebellion. Cambyses organized an expedition for the conquest of Egypt, which was rendered successful by internal treachery and by the aid of the Phoenician, Cyprian and Greek fleets. During this campaign Cambyses seems to have acted with good generalship and with clemency toward the conquered. After the subjugation of Egypt, Cyrene and Barca, the modern Tripoli, submitted to his sway. He then desired to undertake the conquest of Carthage, but was compelled to give it up, because his Phoenician allies, without whose ships it was impossible for him to conduct his army in safety, refused to join in an attack upon a country that had been colonized by them. He is said to have sent an army of 50,000 men against the oasis of Jupiter Ammon. This army is said to have perished in the sands. A little less unsuccessful expedition was made against Ethiopia. After some initial successes, Cambyses was forced to return to Egypt with the shattered remains of his army. He found that the Egyptians were in revolt, led by their king Psammetichus III, whose life he had formerly spared. This revolt was put down with great harshness, the Egyptian king being taken and executed, and many of the temples being destroyed. Shortly after this, Cambyses heard that a certain Magian, who claimed to be his brother Smerdes whom he had secretly put to death, had set himself up as king of Persia, and that almost the whole of his Asiatic dominions had acknowledged him as king. With the fragments of his army he started toward Persia to attack the usurper, but on the way was killed by a wound inflicted by himself, it is uncertain whether by accident or with intention. His general and cousin, Darius Hystaspis, soon put down the false Smerdis and reigned in his stead.<P>For two or more years Cambyses was king of Babylon, while his father was king of the lands. The son was a drunkard and subject to fits of unbridled passion, but seems to have been of good capacity as a general and as an administrator. Many of the tales that have been told against him were doubtless invented by his enemies, and he has left us no records of his own. That he married his own sisters is probable; but it must be remembered that this was the custom of the Egyptian kings of that time and may have been of the Persian kings as well. As to his conduct in Egypt, the only contemporary Egyptian authority says that he worshipped before the holiness of Neit as all the pious kings had done, that he ordered that the temple of Neit should be purified, and that its revenues should be restored as they had been before they had been confiscated by Akhmes for his Greek troops. He adds also that not merely were the strangers who had taken up their abode in the temple of Neit ejected from her sanctuary, but that their goods were taken away and their houses destroyed. Darius Hystaspis, the only other contemporary source of information, says of him simply that he was the son of Cyrus, of the same father and mother as Bardes, whom he slew secretly at some time before he set out on his Egyptian campaign; and that he died by suicide shortly after he had heard of the rebellion of Persia, Media and the other provinces against him, and of the establishment of Gaumata the Magian as king under the claim that he was "Barzia, the son of Cyrus and brother of Cambyses."<P>The name of Cambyses is found in three of the Elephantine papyri recently published (September, 1911) by Professor Sachau of Berlin. The fragment numbered 59 1 is so broken that it is impossible to make out the connection or the sense. In papyrus I, we are told that when Cambyses came to Egypt he found in the fortress of Yeb (Elephantine) a temple or synagogue (\'agora\'), which had been built in the days of the Egyptian kings; and that although he had torn down the temples of the Egyptian gods, he had allowed no harm to be done to that of Yahweh. The third papyrus is so interesting, because of its mention of Bagoas, the Persian governor of Jerusalem in 407 BC, who had hitherto been known only from Josephus, and of Dalayah the son of the Sanballat who opposed the rebuilding of the wall of Jerusalem in the time of Ezra-Nehemiah, that we shall now give a translation of it in full: "A memorial of that which Bagoas and Dalayah said to me: Thou shalt say in Egypt unto Arsames with regard to the house of the altar of the God of heaven that was built in the fortress of Yeb before the time of Cambyses and which the accursed(?) Waidrang destroyed in the 14th year of Darius the king, that it shall be built again upon its place as it was before, and that meal-offerings and incense-offerings shall be offered upon that altar as they used to be."<P>LITERATURE.<P>For further information as to the history of Cambyses see Rawlinson, Ancient Monarchies; Prasek, Geschichte der Meder und Perser; the Behistun inscription in the editions of the various recensions by Bezold, Spiegel, Weisbach, Thomson, and King; Herodotus; Josephus; the Sachau papyri; and Petrie, History of Egypt, III.``196';
isbe[1818]='Camel`kam\'-el (gamal; kamelos; bekher, and bikhrah (<a onClick="return mV(\'Isa\',60,6);">Isa 60:6</a>; <a onClick="return mV(\'Jer\',2,23);">Jer 2:23</a> "dromedary," the American Revised Version, margin "young camel"), rekhesh (<a onClick="return mV(\'1Ki\',4,28);">1Ki 4:28</a>; see <a href="./study/isbe/search.html?string=HORSE">HORSE</a>), kirkaroth (<a onClick="return mV(\'Isa\',66,20);">Isa 66:20</a>, "swift beasts," the American Standard Revised ersion. "dromedaries"); bene ha-rammakhim (<a onClick="return mV(\'Est\',8,10);">Es 8:10</a>, "young dromedaries," the American Standard Revised Version "bred of the stud"); achashteranim (<a onClick="return mV(\'Est\',8,10,14);">Es 8:10, 14</a>, the King James Version "camels," the American Standard Revised Version "that were used in the king\'s service")): There are two species of camel, the Arabian or one-humped camel or dromedary, Camelus dromedarius, and the Bactrian or two-humped camel, Camelus bactrianus. The latter inhabits the temperate and cold parts of central Asia and is not likely to have been known to Biblical writers. The Arabian camel inhabits southwestern Asia and NorthernAfrica and has recently been introduced into parts of America and Australia. Its hoofs are not typical of ungulates but are rather like great claws. The toes are not completely separated and the main part of the foot which is applied to the ground is a large pad which underlies the proximal joints of the digits. It may be that this incomplete separation of the two toes is a sufficient explanation of the words "parteth not the hoof," in <a onClick="return mV(\'Lev\',11,4);">Le 11:4</a> and <a onClick="return mV(\'Deu\',14,7);">De 14:7</a>. Otherwise these words present a difficulty, because the hoofs are completely separated though the toes are not. The camel is a ruminant and chews the cud like a sheep or ox, but the stomach possesses only three compartments instead of four, as in other ruminants. The first two compartments contain in their walls small pouches, each of which can be closed by a sphincter muscle. The fluid retained in these pouches may account in part for the power of the camel to go for a relatively long time without drinking.<P>The Arabian camel is often compared with justice to the reindeer of the Esquimaux. It furnishes hair for spinning and weaving, milk, flesh and leather, as well as being an of invaluable means of transportation in the arid desert. There are many Arabic names for the camel, the commonest of which is jamal (in Egypt gamal), the root being common to Arabic, Hebrew and other Semitic languages. From it the names in Latin, Greek, English and various European languages are derived. There are various breeds camels, as there are of horses. The riding camels or dromedaries, commonly called hajin, can go, even at a walk, much faster than the pack camels. The males are mostly used for carrying burdens, the females being kept with the herds. Camels are used to a surprising extent on the rough roads of the mountains, and one finds in the possession of fellachin in the mountains and on the littoral plain larger and stronger pack camels than are often found among the Bedouin. Camels were apparently not much used by the Israelites after the time of the patriarchs. They were taken as spoil of war from the Amalekites and other tribes, but nearly the only reference to their use by the later Israelites was when David was made king over all Israel at Hebron, when camels are mentioned among the animals used for bringing food for the celebration (<a onClick="return mV(\'1Ch\',12,40);">1Ch 12:40</a>). David had a herd of camels, but the herdsman was Obil, an Ishmaelite (<a onClick="return mV(\'1Ch\',27,30);">1Ch 27:30</a>). Nearly all the other Biblical references to camels are to those possessed by Abraham, Isaac and Jacob, Ishmaelites, Amalekites, Midianites, Hagrites and the "children of the East" (see <a href="./study/isbe/search.html?string=EAST">EAST</a>). Two references to camels (<a onClick="return mV(\'Gen\',12,16);">Ge 12:16</a>; <a onClick="return mV(\'Exd\',9,3);">Ex 9:3</a>) are regarded as puzzling because the testimony of the Egyptian monuments is said to be against the presence of camels in ancient Egypt. For this reason, <a onClick="return mV(\'Gen\',12,\'1-\');">Ge 12-16</a>, in connection with Abram\'s visit to Egypt, is turned to account by Canon Cheyne to substantiate his theory that the Israelites were not in Egypt but in a north Arabian land of Mucri (Encyclopaedia Biblica under the word "Camel," 4). While the flesh of the camel was forbidden to the Israelites, it is freely eaten by the Arabs. There are three references to the camel in New Testament:<P>(1) to John\'s raiment of camel\'s hair (<a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a>; <a onClick="return mV(\'Mar\',1,6);">Mr 1:6</a>);<P>(2) the words of Jesus that "it is easier for a camel to go through a needle\'s eye, than for a rich man to enter into the kingdom of God" (<a onClick="return mV(\'Mat\',19,24);">Mt 19:24</a>; <a onClick="return mV(\'Mar\',10,25);">Mr 10:25</a>; <a onClick="return mV(\'Luk\',18,25);">Lu 18:25</a>);<P>(3) the proverb applied to the Pharisees as blind guides, "that strain out the gnat, and swallow the camel" (<a onClick="return mV(\'Mat\',23,24);">Mt 23:24</a>). Some manuscripts read ho kamilos, "a cable," in <a onClick="return mV(\'Mat\',19,24);">Mt 19:24</a> and <a onClick="return mV(\'Luk\',18,25);">Lu 18:25</a>.<P>There are a few unusual words which have been translated "camel" in text or margin of one or the other version. (See list of words at beginning of the article). Bekher and bikhrah clearly mean a young animal, and the Arabic root word and derivatives are used similarly to the Hebrew. Rakhash, the root of rekhesh, is compared with the Arabic rakad, "to run," and, in the Revised Version (British and American), rekhesh is translated "swift steeds." Kirkaroth, rammakhim and \'achashteranim must be admitted to be of doubtful etymology and uncertain meaning.``37';
isbe[1819]='Camel\'s Hair`(triches kamelou): In <a onClick="return mV(\'Mat\',3,4);">Mt 3:4</a> and <a onClick="return mV(\'Mar\',1,6);">Mr 1:6</a> the description of John\'s raiment is explicit to the extent of telling the kind of hair of which his raiment was made. It is probable that his garment was made of a tawed camel skin, for the more expensive woven camel\'s hair garment would not be in keeping with the rest of the description. It is still common among the poor in some parts of Syria, when a camel or other animal dies, to remove its skin and, after treating the inner surface to stop decomposition, to make it up into various domestic articles. The writer once saw a peasant dragging a skin along the road which proved to be that of a donkey which had just died on the route. His intention was probably to make it up into a cloak. Some believe that Elijah\'s mantle was of camel\'s hair (<a onClick="return mV(\'2Ki\',1,8);">2Ki 1:8</a>; compare <a onClick="return mV(\'Zec\',13,4);">Zec 13:4</a>). Of that we cannot be sure, for in the East today the hairy garment is usually goat\'s hair or wool either woven or still clinging to the skin. It was much more likely to have been one of these latter. See <a href="./study/isbe/search.html?string=SHEEP">SHEEP</a>. Camel\'s hair, when woven into fabrics, as in rugs, makes an article of even softer and more glossy texture than wool.`<a href="./study/isbe/search.html?string=WEAVING">WEAVING</a>`133';
