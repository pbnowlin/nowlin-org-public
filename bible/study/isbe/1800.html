isbe[1838]='Canon of the Old Testament, II` II. Examination of the Witnesses.<P>1. The Old Testament\'s Witness to Itself (circa 1450-444 BC):<P>Though the Old Testament does not tell us anything about the processes of its own canonization, it does furnish valuable hints as to how the ancient Heb preserved their writings. Thus in <a onClick="return mV(\'Exd\',40,20);">Ex 40:20</a> it is stated that the "testimony," by which is meant the two tables of the Law containing the Ten Commandments, was put into the Ark of the Covenant for safe-keeping. In <a onClick="return mV(\'Deu\',31,9,\'24-26\');">De 31:9, 24-26</a>, the laws of Deuteronomy are said to have been delivered to the sons of Levi, and by them deposited "by the side of the ark...that it may be there for a witness against thee." Such language indicates that the new lawbook is regarded "as a standard of faith and action" (Driver, Deuteronomy, 343). According to <a onClick="return mV(\'1Ki\',8,9);">1Ki 8:9</a>, when Solomon brought the Ark up from the city of David to the Temple, the two tables were still its only contents, which continued to be carefully preserved. According to <a onClick="return mV(\'2Ki\',11,12);">2Ki 11:12</a>, when Joash was crowned king, Jehoiada the high priest is said to have given (literally "put upon") him "the testimony," which doubtless contained "the substance of the fundamental laws of the covenant," and was regarded as "the fundamental charter of the constitution" (compare H. E. Ryle, Canon of the Old Testament 45). Likewise in <a onClick="return mV(\'Pro\',25,1);">Pr 25:1</a>, it is stated that a large number of proverbs were copied out by Hezekiah\'s men. Now all these, and still other passages which might be summoned, witness to the preservation of certain portions of the Old Testament. But preservation is not synonymous with canonization. A writing might easily be preserved without being made a standard of faith and conduct. Nevertheless the two ideas are closely related; for, when religious writings are sedulously preserved it is but natural to infer that their intrinsic value was regarded as correspondingly precious.<P>Two other passages of paramount importance remain to be considered. The first is <a onClick="return mV(\'2Ki\',22,8);">2Ki 22:8</a>ff, describing the finding of the "Book of the Law," and how Josiah the king on the basis of it instituted a religious reformation and bound the people to obey it precepts. Here is an instance in which the Law, or some portion of it (how much no one can say), is regarded as of normative and authoritative character. The king and his coadjutators recognize at once that it is ancient and that it contains the words of Yahweh (<a onClick="return mV(\'2Ki\',22,13,18,19);">2Ki 22:13, 18-19</a>). Its authority is undisputed. Yet nothing is said of its "canonicity," or that it would "defile the hands"; consequently there is no real ground for speaking of it as "the beginnings of the canon," for in the same historic sense the beginnings of the canon are to be found in <a onClick="return mV(\'Exd\',24,7);">Ex 24:7</a>. The other passage of paramount importance is <a onClick="return mV(\'Neh\',8,8);">Ne 8:8</a>f; according to which Ezra is said to have "read in the book, in the law of God, distinctly." Not only did Ezra read the Law; he accompanied it with an interpretation. This seems to imply, almost beyond question, that in Ezra\'s time (444 BC) the Law, i.e. the Pentateuch, was regarded as canonical Scripture. This is practically all that the Old Testament says about itself, though other passages, such as <a onClick="return mV(\'Zec\',7,12);">Zec 7:12</a> and <a onClick="return mV(\'Dan\',9,2);">Da 9:2</a> might be brought forward to show the deep regard which the later prophets had for the writings of their predecessors. The former of these is the locus classicus in the Old Testament, teaching the inspiration of the Prophets; it is the Old Testament parallel to <a onClick="return mV(\'2Ti\',3,16);">2Ti 3:16</a>.<P>2. The Samaritan Pentateuch (circa 432 BC):<P>Chronologically the Old Testament is of course our most ancient witness. It brings us down to 444 BC. The next in order is the Samaritan Pentateuch, the history of which is as follows: About 432 BC, as we know from <a onClick="return mV(\'Neh\',13,28);">Ne 13:28</a> and Josephus (Ant., XI, vii, 2 through viii, 4), Nehemiah expelled from the Jewish colony in Jerusalem Manasseh, the polygamous grandson of Eliashib the high priest and son-in-law of Sanballat. Manasseh founded the schismatic community of the Samaritans, and instituted on Mt. Gerizim a rival temple worship to that at Jerusalem. Of the Samaritans there still survive today some 170 souls; they reside in Shechem and are known as "the smallest religious sect in the world." It is true that Josephus, speaking of this event, confuses chronology somewhat, making Nehemiah and Alexander the Great contemporaries, whereas a century separated them, but the time element is of little moment. The bearing of the whole matter upon the history of the formation of the canon is this: the Samaritans possess the Pentateuch only; hence, it is inferred that at the time of Manasseh\'s expulsion the Jewish canon included the Pentateuch and the Pentateuch only. Budde (Encyclopaedia Biblica col. 659) says: "If alongside of the Law there had been other sacred writings, it would be inexplicable why these last also did not pass into currency with the Samaritans." Such a conclusion, however, is not fully warranted. It is an argument from silence. There are patent reasons on the other hand why the Samaritans should have rejected the Prophets, even though the y were already canonized. For the Samaritans would hardly adopt into their canon books that glorified the temple at Jerusalem. It cannot, accordingly, be inferred with certainty from the fact that the Samaritans accept the Pentateuch only, that therefore the Pentateuch at the time of Manasseh\'s expulsion was alone canonical, though it may be considered a reasonable presumption.<P>3. The Septuagint Version (circa 250-150 BC):<P>The Septuagint version in Greek is the first translation of the Old Testament ever made; indeed the Old Testament is the first book of any note in all literature to receive the honor of being translated into another tongue. This fact in itself is indicative of the esteem in which it was held at the time. The work of translation was inaugurated by Ptolemy Philadelphus (285-247 BC) and probably continued for well-nigh a century (circa 250-150 BC). Aristeas, a distinguished officer of Ptolemy, records how it came about. It appears that Ptolemy was exceedingly fond of books, and set his heart on adding to his famous collection in Alexandria a translation of the Hebrew Pentateuch In order to obtain it, so the story goes, the king set free 198,000 Jewish slaves, and sent them with presents to Jerusalem to ask Eleazar the high priest for their Law and Jewish scholars capable of translating it. Six learned rabbis from each tribe (6 X 12 = 72) were sent. They were royally feasted; 70 questions were asked them to test their wisdom, and after 72 days of cooperation and conference they gave the world the Old Testament in the Greek language, which is known as the Septuagint version. To this fabulous story, Christian tradition adds that the rabbis did the work of translating in 72 (some say 36) separate cells on the island of Pharos, all working independently of each other, and that it was found at the expiration of their seclusion that each had produced a translation exactly word for word alike, hence, supernaturally inspired. Justin Martyr of the 2nd century AD says that he was actually shown by his Alexandrian guide the ruins of these Septuagint cells. The story is obviously a fable. The kernel of real truth at the bottom of it is probably that Ptolemy Philadelphus about the middle of the 3rd century BC succeeded in obtaining a translation of the Law. The other books were translated subsequently, perhaps for private use. The lack of unity of plan in the books outside the Law indicates that probably many different hands at different times were engaged upon them. There is a subscription, moreover, at the close of the translation of Esther which states that Lysimachus, the son of Ptolemy in Jerusalem, translated it. But the whole was apparently completed before Jesus ben Sirach the younger wrote his Prologue to Ecclesiasticus (circa 132 BC).<P>Now the Septuagint version, which was the Bible of our Lord and His apostles, is supposed to have included originally many of the Apocryphal books. Furthermore, in our present Septuagint, the canonical and Apocryphal books stand intermingled and in an order which shows that the translators knew nothing of the tripartite division of later Judaism, or if they did they quite ignored it. The order of the books in our English Old Testament is of course derived from the Septuagint through the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) of Jerome. The books in the Septuagint are arranged as follows: Pentateuch, Joshua, Judges, Ruth, 1 and 2 Samuel, 1 and 2 Kings, 1 and 2 Chronicles, 1 and 2Esdras, Nehemiah, Tobit, Judith, Esther, Job, Psalms, Proverbs, Ecclesiastes, Wisdom, Ecclesiasticus, Hosea, Amos, Micah, Joel, Obadiah, Jonah, Nahum, Habakkuk, Zepheniah, Hagai, Zechariah, Malachi, Isaiah, Jeremiah, Baruch, Lamentations, Ep. Jer., Ezekiel, Daniel,1, 2 and 3Maccabees. On the basis of the Septuagint, Catholics advocate what is known as the "larger" canon of the Jews in Alexandria; Protestants, on the other hand, deny the existence of an independent canon in Alexandria in view of the "smaller" canon of the Jews in Palestine The actual difference between the Catholic and Protestant Old Testaments is a matter of 7 complete books and portions of two others: namely, Tobit, Judith, Wisdom, Ecclesiasticus, Baruch, 1 and 2 Maccabees, together with certain additions to Esther (Es 10:4-16:24) and to Daniel (Da 3:24-90; The Song of the Three Holy Children (Azariah); Susanna verse 13 and Bel and the Dragon verse 14). These Protestants reject as apocryphal because there is no sufficient evidence that they were ever reckoned as canonical by the Jews anywhere. The fact that the present Septuagint includes them is far from conclusive that the original Septuagint did, for the following reasons:<P>(1) The design of the Septuagint was purely literary; Ptolemy and the Alexandrians were interested in building up a library.<P>(2) All the extant manuscripts of the Septuagint are of Christian not Jewish origin. Between the actual translation of the Septuagint (circa 250-150 BC) and the oldest manuscripts of the Septuagint extant (circa 350 AD) there is a chasm of fully 500 years, during which it is highly possible that the so-called Apocryphal books crept in.<P>(3) In the various extant manuscripts of the Septuagint, the Apocryphal books vary in number and name. For example, the great Vatican MS, which is probably "the truest representative which remains of the Alexandrian Bible," and which comes down to us from the 4th century AD, contains no Book of Maccabees whatever, but does include 1Esdras, which Jerome and Catholics generally treat as apocryphal. On the other hand, the Alexandrian MS, another of the great manuscripts of the Septuagint, dating from the 5th century AD, contains not only the extra-canonical book of 1Esdras, but 3 and 4 Maccabees, and in the New Testament the 1st and 2nd Epistles of Clement, none of which, however, is considered canonical by Rome. Likewise the great Sinaiticus MS, hardly less important than the Vatican as a witness to the Septuagint and like it dating from the 4th century AD, omits Baruch (which Catholics consider canonical), but includes 4Maccabees, and in the New Testament the Epistle of Barnabas and the Shepherd of Hermas; all of which are excluded from the canon by Catholics. In other manuscripts, 3Maccabees, 3Esdras and The Prayer of Manasseh are occasionally included. The problem as to how many books the original Septuagint version actually included is a very complicated one. The probability is that it included no one of these variants.<P>(4) Still another reason for thinking that there never existed in Egypt a separate or "larger" canon is the fact that during the 2nd century AD, the Alexandrian Jews adopted Aquila\'s Greek version of the Old Testament in lieu of their own, and it is known that Aquila\'s text excluded all Apocryphal books. Add to all this the fact that Philo, who lived in Alexandria from circa 20 BC till 50 AD, never quotes from One of these Apocryphal books though he often does from the canonical, and that Origen, who also resided in Alexandria (circa 200 AD), never set his imprimatur upon them, and it becomes reasonably convincing that there was no "larger" canon in Alexandria. The value of the evidence derived from the Septuagint, accordingly, is largely negative. It only indicates that when the translation of the Old Testament into Greek was made in Alexandria, the process of canonization was still incomplete. For had it been actually complete, it is reasonable to suppose that the work of translation would have proceeded according to some well-defined plan, and would have been executed with greater accuracy. As it is, the translators seem to have taken all sorts of liberties with the text, adding to the books of Esther and Daniel and omitting fully one-eighth of the text of Jeremiah. Such work also indicates that they were not executing a public or ecclesiastical trust, but rather a private enterprise. Our necessary conclusion, therefore, is that the work of canonization was probably going on in Palestine while the work of translation was proceeding in Alexandria.<P>4. Ecclesiasticus, or the Wisdom of Jesus ben Sirach (circa 170 BC):<P>Our next witness is Jesus ben Sirach who (circa 170 BC) wrote a formidable work entitled Ecclesiasticus, otherwise known as Sirach. The author lived in Jerusalem and wrote in Hebrew. His book is a book of Wisdom resembling Proverbs; some of his precepts approach the high level of the Gospel. In many respects Ecclesiasticus is the most important of all the Apocryphal books; theologically it is the chief monument of primitive Sadduceeism. In chapters 44-50, the author sings a "hymn to the Fathers," eulogizing the mighty heroes of Israel from Enoch to Nehemiah, in fact from Adam to Simon, including the most famous men described in the Old Testament, and making explicit mention of the Twelve Prophets. These facts would indicate that the whole or, at least, the most of the Old Testament was known to him, and that already in his day (180 BC) the so-called Minor Prophets were regarded as a special group of writings by themselves. What the value of Ecclesiasticus is as a witness, however, depends upon the interpretation one places on 24:33, which reads: "I will yet pour out doctrine as prophecy and leave it unto generations of ages." From this it is inferred by some that he feels himself inspired and capable of adding to the canon already in existence, and that, though he knew the full prophetic canon, he did not draw any very definite line of demarcation between his own work and the inspired writings of the prophets. For example, he passes over from the patriarchs and prophets of Israel to Simon the son of Onias, who was probably the high priest in his own time, making no distinction between them. But this may have been partly due to personal conceit; compare 39:12, "Yet more will I utter, which I have thought upon; and I am filled as the moon at the full." Yet, perhaps, in his day still only the Law and the Prophets were actually canonized, but alongside of these a body of literature was being gathered and gradually augmented of a nature not foreign to his own writings, and therefore not clearly marked off from literary compositions like his own. Yet to Sirach the Law is everything. He identifies it with the highest Wisdom; indeed, all wisdom in his judgment is derived from a study of the Law (compare Sirach 19:20-24; 15:1-18; 24:23; 2:16; 39:1).<P>5. The Prologue to Ecclesiasticus (circa 132 BC):<P>The Prologue or Preface to Ecclesiasticus is our next witness to the formation of the canon. It was written by the grandson of Jesus ben Sirach, who bore his grandfather\'s name (circa 132 BC). Jesus ben Sirach the younger translated in Egypt his grandfather\'s proverbs into Greek, and in doing so added a Preface or Prologue of his own. In this Prologue, he thrice refers to the tripartite division of the Old Testament. In fact the Prologue to Ecclesiasticus is the oldest witness we have to the threefold division of the Old Testament books. He says: "Whereas many and great things have been delivered unto us by the Law and the Prophets, and by others,...my grandfather, Jesus, when he had given himself to the reading of the Law, and the Prophets, and other books of our Fathers, and had gotten therein good judgment (the Revised Version (British and American) "having gained great familiarity therein"), was drawn on also himself to write something pertaining to learning and wisdom....For the same things uttered in Hebrew and translated into another tongue, have not the same force in them; and not only these things, but the Law itself, and the Prophets, and the rest of the books, have no small difference, when they are spoken in their own language." These are explicit and definite allusions to the threefold division of the Old Testament writings, yet only the titles of the first and second divisions are the technical names usually employed; the third is especially vague because of his use of the terms, "the other books of the Fathers," and "the rest of the books." However, he evidently refers to writings with religious contents; and, by "the other books of the Fathers," he can hardly be supposed to have meant an indefinite number, though he has not told us which they were or what was their number. From his further statement that his grandfather, having immersed himself in the Law and the Prophets, and other books of the Fathers, felt drawn on also himself to write something for the profit of others, it may be inferred that in his time there was as yet no definite gulf fixed between canonical writings and those of other men, and that the sifting process was still going on (compare W. R. Smith, OTJC2, 178- 79).<P>6. 1 and 2Maccabee (between 125 and 70 BC):<P>1Maccabee was written originally in Hebrew; 2Maccabee in Greek, somewhere between 125 and 70 BC. The author of 1Maccabee is acquainted, on the one hand, with the deeds of John Hyrcanus (135 to 105 BC), and knows nothing on the other of the conquest of Palestine by Pompey (63 BC). The value of this book as a witness to the history of the canon centers about his allusions to Daniel and the Psalms. In 1Macc 1:54, he tells how Antiochus Epiphanes "set up the abomination of desolation" upon the altar at Jerusalem, referring most likely to <a onClick="return mV(\'Dan\',9,\'24-27\');">Da 9:24-27</a>; and in 1Macc 2:59,60 he speaks of Ananias, Azarias and Misael, who by believing were saved from the fiery furnace, and of Daniel, who was delivered from the mouths of the lions (compare <a onClick="return mV(\'Dan\',1,7);">Da 1:7</a>; <a onClick="return mV(\'Dan\',3,26);">3:26</a>; <a onClick="return mV(\'Dan\',6,23);">6:23</a>). From these allusions, it would seem as though the Book of Daniel was at that time regarded as normative or canonical. This is confirmed by 1Macc 7:16,17, which introduces a quotation from <a onClick="return mV(\'Psa\',79,2);">Ps 79:2</a>, with the solemn formula, "According to the words which he wrote"; which would suggest that the Psalms also were already canonical.<P>2 Maccabees, written circa 124 BC, also contains a couple of passages of considerable importance to us in this investigation. Both, however, are found in a spurious letter purporting to have been sent by the inhabitants of Judea to their fellow-countrymen residing in Egypt. The first passage (2Macc 2:13) tells how Nehemiah, "founding a library, gathered together the acts of the kings, and the prophets, and of David, and the epistles of the kings concerning holy gifts." These words throw no special light upon the formation of the canon, but they do connect with the name of Nehemiah the preservation of public documents and historical records of national interest, and how he, as a lover of books, founded a library. This is in perfect agreement with what we know of Nehemiah\'s character, for he compiled the genealogy of <a onClick="return mV(\'Neh\',7,\'1-\');">Ne 7</a>; besides, collection precedes selection. The other passage (2Macc 2:14) reads: "In like manner also Judas gathered together all things that were lost by reason of the war we had, and they remain with us." Though found in a letter, supposed to be spurious, there is every reason for believing this statement to be true. For when Antiochus, the arch enemy of the nation, sought to stamp out the religion of the Jews by destroying their books (compare 1Macc 1:56,57), what would have been more natural for a true patriot like Judas than to attempt to re-collect their sacred writings? "This statement, therefore," as Wildeboer says, "may well be worthy of credence" (The Origin of the Canon of the Old Testament, 40). Though it yields nothing definite as to the number of the books recovered, it is obvious that the books collected were the most precious documents which the nation possessed. They were doubtless religious, as was the age.<P>7. Philo (circa 20 BC-50 AD):<P>Philo is our next witness. He flourished in Alexandria between circa 20 BC and 50 AD, leaving behind him a voluminous literature. Unfortunately, he does not yield us much of positive value for our present purpose. His evidence is largely negative. True, he nowhere mentions the tripartite division of the Old Testament, which is known to have existed in his day. Nor does he quote from Ezekiel, the Five Megilloth (Canticles, Ruth, Lamentations, Ecclesiastes, Esther), Daniel, Chronicles, or from the Twelve Minor Prophets, except Hosea, Jonah, and Zechariah. Moreover he held a loose view of inspiration. According to Philo, inspiration was by no means confined to the sacred Scriptures; all truly wise and virtuous men are inspired and capable of expressing the hidden things of God. But as Dr. Green (Canon, 130) right fully contends, "Philo\'s loose views of inspiration cannot be declared irreconcilable with the acceptance of a fixed canon, unless it is first shown that he places others whom he thinks inspired on a level with the writers of Scripture. This he never does." Philo\'s reverence for the "Law" was unbounded. In this respect he is the type of other Alexandrians. He quotes predominatingly from the Law. Moses was to him the source of all wisdom, even the wisdom of the Gentiles. Concerning the laws of Moses, he is reported by Eusebius as saying: "They have not changed so much as a single word in them. They would rather die a thousand deaths than detract anything from these laws and statutes." On the other hand, Philo never quotes any of the Apocryphal books. Hence, it may safely be assumed that his canon was essentially ours.<P>8. The New Testament as a Witness (circa 50-100 AD):<P>The evidence furnished by the New Testament is of the highest importance. When summed up, it gives the unmistakable impression that when the New Testament was written (circa 50-100 AD) there was a definite and fixed canon of Old Testament Scripture, to which authoritative appeal could be made. And first, too much importance can scarcely be attached to the names or titles ascribed to the Old Testament writings by the authors of the New Testament: thus, "the scripture" (<a onClick="return mV(\'Jhn\',10,35);">Joh 10:35</a>; <a onClick="return mV(\'Jhn\',19,36);">19:36</a>; <a onClick="return mV(\'2Pe\',1,20);">2Pe 1:20</a>), "the scriptures" (<a onClick="return mV(\'Mat\',22,29);">Mt 22:29</a>; <a onClick="return mV(\'Act\',18,24);">Ac 18:24</a>), "holy scriptures" (<a onClick="return mV(\'Rom\',1,2);">Ro 1:2</a>), "sacred writings" (<a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a>), "the law" (<a onClick="return mV(\'Jhn\',10,34);">Joh 10:34</a>; <a onClick="return mV(\'Jhn\',12,34);">12:34</a>; <a onClick="return mV(\'Jhn\',15,25);">15:25</a>; <a onClick="return mV(\'1Cr\',14,21);">1Co 14:21</a>), "law and prophets" (<a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>; <a onClick="return mV(\'Mat\',7,12);">7:12</a>; <a onClick="return mV(\'Mat\',22,40);">22:40</a>; <a onClick="return mV(\'Luk\',16,16);">Lu 16:16</a>; <a onClick="return mV(\'Luk\',24,44);">24:44</a>; <a onClick="return mV(\'Act\',13,15);">Ac 13:15</a>; <a onClick="return mV(\'Act\',28,23);">28:23</a>). Such names or titles, though they do not define the limits of the canon, certainly assume the existence of a complete and sacred collection of Jewish writings which are already marked off from all other literature as separate and fixed. One passage (<a onClick="return mV(\'Jhn\',10,35);">Joh 10:35</a>) in which the term "scripture," is employed seems to refer to the Old Testament canon as a whole; "and the scripture cannot be broken." In like manner the expression "law and prophets" is often used in a generic sense, referring to much more than merely the 1st and 2nd divisions of the Old Testament; it seems rather to refer to the old dispensation as a whole; but the term "the law" is the most general of all. It is frequently applied to the entire Old Testament, and apparently held in Christ\'s time among the Jews a place akin to that which the term "the Bible" does with us. For example, in <a onClick="return mV(\'Jhn\',10,34);">Joh 10:34</a>; <a onClick="return mV(\'Jhn\',11,34);">11:34</a>; <a onClick="return mV(\'Jhn\',15,25);">15:25</a>, texts from the prophets or even from the Ps are quoted as part of "the Law"; in <a onClick="return mV(\'1Cr\',14,21);">1Co 14:21</a> also, Paul speaks of <a onClick="return mV(\'Isa\',28,11);">Isa 28:11</a> as a part of "the law." These names and titles, accordingly, are exceedingly important; they are never applied by New Testament writers to the Apocrypha.<P>One passage (<a onClick="return mV(\'Luk\',24,44);">Lu 24:44</a>) furnishes clear evidence of the threefold division of the canon. But here again, as in the Prologue of Sirach, there is great uncertainty as to the limits of the 3rd division. Instead of saying "the law, the prophets and the writings," Luke says, "the law, the prophets and the psalms." But it is obvious enough why the Psalms should have been adduced by Jesus in support of His resurrection. It is because they especially testify of Christ: they were, therefore, the most important part of the 3rd division for His immediate purpose, and it may be that they are meant to stand a potiori for the whole of the 3rd division (compare Budde, Encyclopedia Biblica, col. 669).<P>Another passage (<a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a>; compare <a onClick="return mV(\'Luk\',11,51);">Lu 11:51</a>) seems to point to the final order and arrangement of the books in the Old Testament canon. It reads: "That upon you may come all the righteous blood shed on the earth, from the blood of Abel the righteous unto the blood of Zachariah son of Barachiah, whom ye slew between the sanctuary and the altar." Now, in order to grasp the bearing of this verse upon the matter in hand, it must be remembered that in the modern arrangement of the Old Testament books in Hebrew, Chronicles stands last; and that the murder of Zachariah is the last recorded instance in this arrangement, being found in <a onClick="return mV(\'2Ch\',24,20,21);">2Ch 24:20-21</a>. But this murder took place under Joash king of Judah, in the 9th century BC. There is another which is chronologically later, namely, that of Uriah son of Shemaiah who was murdered in Jehoiakim\'s reign in the 7th century BC (<a onClick="return mV(\'Jer\',26,23);">Jer 26:23</a>). Accordingly, the argument is this, unless Ch already stood last in Christ\'s Old Testament, why did He not say, "from the blood of Abel unto the blood of Uriah"? He would then have been speaking chronologically and would have included all the martyrs whose martyrdom is recorded in the Old Testament. But He rather says, "from the blood of Abel unto the blood of Zachariah," as though He were including the whole range of Old Testament Scripture, just as we would say "from Genesis to Malachi." Hence, it is inferred, with some degree of justification also, that Chronicles stood in Christ\'s time, as it does today in the Hebrew Bible of the Massorets, the last book of an already closed canon. Of course, in answer to this, there is the possible objection that in those early days the Scriptures were still written by the Jews on separate rolls.<P>Another ground for thinking that the Old Testament canon was closed before the New Testament was written is the numerous citations made in the New Testament from the Old Testament. Every book is quoted except Esther, Ecclesiastes, Canticles, Ezra, Nehemiah, Obadiah, Nahum, and Zephaniah. But these exceptions are not serious. The Twelve Minor Prophets were always treated by the Jews en bloc as one canonical work; hence, if one of the twelve were quoted all were recognized. And the fact that <a onClick="return mV(\'2Ch\',24,20,21);">2Ch 24:20-21</a> is quoted in <a onClick="return mV(\'Mat\',23,35);">Mt 23:35</a> and <a onClick="return mV(\'Luk\',11,51);">Lu 11:51</a> presupposes also the canonicity of Ezra-Nehemiah, as originally these books were one with Chronicles, though they may possibly have already been divided in Jesus\' day. As for Esther, Ecclesiastes, and Canticles, it is easy to see why they are not quoted: they probably failed to furnish New Testament writers material for quotation. The New Testament writers simply had no occasion to make citations from them. What is much more noteworthy, they never quote from the Apocryphal books, though they show an acquaintance with them. Professor Gigot, one of the greatest of Roman Catholic authorities, frankly admits this. In his General Introduction to the Study of the Scriptures, 43, he says: "They never quote them explicitly, it is true, but time and again they borrow expressions and ideas from them." As a matter of fact, New Testament writers felt free to quote from any source; for example, Paul on Mars\' Hill cites to the learned Athenians an astronomical work of the Stoic Aratus of Cilicia, or perhaps from a Hymn to Jupiter by Cleanthes of Lycia, when he says, "For we are also his off-spring" (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>). And <a onClick="return mV(\'Jud\',1,14,15);">Jude 1:14-15</a> almost undeniably quotes from Enoch (1:9; 60:8)—a work which is not recognized as canonical by any except the church of Abyssinia. But in any case, the mere quoting of a book does not canonize it; nor, on the other hand, does failure to quote a book exclude it. Quotation does not necessarily imply sanction; no more than reference to contemporary literature is incompatible with strict views of the canon. Everything depends upon the manner in which the quotation is made. In no case is an Apocryphal book cited by New Testament authors as "Scripture," or as the work of the Holy Spirit. And the force of this statement is not weakened by the fact that the authors of New Testament writings cited the Septuagint instead of the original Hebrew; for, "they are responsible only for the inherent truthfulness of each passage in the form which they actually adopt" (Green, Canon, 145). As a witness, therefore, the New Testament is of paramount importance. For, though it nowhere tells us the exact number of books contained in the Old Testament canon, it gives abundant evidence of the existence already in the 1st century AD of a definite and fixed canon.<P>9. 4Esdras (circa 81-96 AD):<P>4Esdras in Latin (2Esdras in English) is a Jewish apocalypse which was written originally in Greek toward the close of the 1st century (circa 81-96 AD). The passage of special interest to us <span class="noTag">is 2Esdras 14:19-48</span> which relates in most fabulous style how Ezra is given spiritual illumination to reproduce the Law which had been burned, and how, at the Divine command, he secludes himself for a period of 40 days, after which he betakes himself with five skilled scribes to the open country. There, a cup of water is offered him; he drinks, and then dictates to his five amanuenses continuously for 40 days and nights, producing 94 books of which 70 are kept secret and 24 published. The section of supreme importance reads as follows: "And it came to pass, when the forty days were fulfilled, that the Most High spake, saying, \'The first that thou hast written, publish openly, that the worthy may read it; but keep the seventy last, that thou mayest deliver them only to such as be wise among the people; for in them is the spring of understanding, the fountain of wisdom, and the stream of knowledge.\' And I did so" (4Esdras 14:45-48). The story is obviously pure fiction. No wonder that a new version of it arose in the 16th century, according to which the canon was completed, not by Ezra alone, but by a company of men known as the Great Synagogue. From the legend of 4Esdras it is commonly inferred that the 24 books which remain after subtracting 70 from 94 are the canonical books of the Old Testament. If so, then this legend is the first witness we have to the number of books contained in the Old Testament canon. This number corresponds exactly with the usual number of sacred books according to Jewish count, as we saw in section 5 above. The legend, accordingly, is not without value. Even as legend it witnesses to a tradition which existed as early as the 1st Christian century, to the effect that the Jews possessed 24 specially sacred books. It also points to Ezra as the chief factor in the making of Scripture and intimates that the Old Testament canon has long since been virtually closed.<P>10. Josephus\' "Contra Apionem" (circa 100 AD):<P>Flavius Josephus, the celebrated Jewish historian, was born 37 AD. He was a priest and a Pharisee. About 100 AD, he wrote a controversial treatise, known as Contra Apionem, in defense of the Jews against their assailants, of whom Apion is taken as a leading representative, Now Apion was a famous grammarian, who in his life had been hostile to the Jews. He had died some 50 years before Contra Apionem was written. Josephus wrote in Greek to Greeks. The important passage in his treatise (I, 8) reads as follows: "For it is not the case with us to have vast numbers of books disagreeing and conflicting with one another. We have but twenty-two, containing the history of all time, books that are justly believed in. And of these, five are the books of Moses, which comprise the laws and the earliest traditions from the creation of mankind down to the time of his (Moses\') death. This period falls short but by a little of three thousand years. From the death of Moses to the reign of Artaxerxes, king of Persia, the successor of Xerxes, the prophets who succeeded Moses wrote the history of the events that occurred in their own time; in thirteen books. The remaining four documents comprise hymns to God and practical precepts to men. From the days of Artaxerxes to our own time every event has indeed been recorded. But these recent records have not been deemed worthy of equal credit with those which preceded them, because the exact succession of the prophets ceased. But what faith we have placed in our own writings is evident by our conduct; for though so great an interval of time (i.e. since they were written) has now passed, not a soul has ventured either to add, or to remove, or to alter a syllable. But it is instinctive in all Jews at once from their very birth to regard them as commands of God, and to abide by them, and, if need be, willingly to die for them."<P>The value of this remarkable passage for our study is obviously very great. In the first place Josephus fixes the number of Jewish writings which are recognized as sacred at 22, joining probably Ruth to Judges and Lamentations to Jerermiah. He also classifies them according to a threefold division, which is quite peculiar to himself: 5 of Moses, 13 of the prophets, and 4 hymns and maxims for human life. The 5 of Moses were of course the Pentateuch; the 13 of the prophets probably included the 8 regular Nebhi\'im plus Daniel, Job, Chronicles, Ezra-Nehemiah, and Esther; the "4 hymns and maxims" would most naturally consist of Psalms, Proverbs, Canticles and Ecclesiastes. There is little doubt that his 22 books are those of our present Hebrew canon.<P>Another very remarkable fact about Josephus\' statement is the standard he gives of canonicity, namely, antiquity; because, as he says, since Artaxerxes\' age the succession of prophets had ceased. It was the uniform tradition of Josephus\' time that prophetic inspiration had ceased with Malachi (circa 445-432 BC). Hence, according to him, the canon was closed in the reign of Artaxerxes (465-425 BC). He does not pause to give any account of the closing of the canon; he simply assumes it, treating it as unnecessary. Prophecy had ceased, and the canon was accordingly closed; the fact did not require to be officially proclaimed. As remarked above. the value of Josephus as a witness is very great. But just here an important question arises: How literally must we interpret his language? Was the Old Testament canon actually closed before 425 BC? Were not there books and parts of books composed and added to the canon subsequent to his reign? Dr. Green seems to take Josephus literally (Canon,40,78). But Josephus is not always reliable in his chronology. For example, in his Antiquities (XI, vi, 13) he dates the story of Esther as occurring in the reign of Artaxerxes I (whereas it belongs to Xerxes\' reign), while in the same work (XI, v, 1) he puts Ezra and Nehemiah under Xerxes (whereas they belong to the time of Artaxerxes). On the whole, it seems safer on internal grounds to regard Josephus\' statements concerning the antiquity of the Jewish canon as the language not of a careful historian, but of a partisan in debate. Instead of expressing absolute fact in this case, he was reflecting the popular belief of his age. Reduced to its lowest terms, the element of real truth in what he says was simply this, that he voiced a tradition which was at that time universal and undisputed; one, however, which had required a long period, perhaps hundreds of years, to develop. Hence, we conclude that the complete Old Testament canon, numbering 22 books, was no new thing 100 AD.<P>11. The Councils of Jamnia (90 and 118 AD):<P>According to the traditions preserved in the Mishna, two councils of Jewish rabbis were held (90 and 118 AD respectively) at Jabne, or Jamnia, not far south of Joppa, on the Mediterranean coast, at which the books of the Old Testament, notably Ecclesiastes and Canticles, were discussed and their canonicity ratified. Rabbi Gamaliel II probably presided. Rabbi Akiba was the chief spirit of the council. What was actually determined by these synods has not been preserved to us accurately, but by many authorities it is thought that the great controversy which had been going on for over a century between the rival Jewish schools of Hillel and Shammai was now brought to a close, and that the canon was formally restricted to our 39 books. Perhaps it is within reason to say that at Jamnia the limits of the Hebrew canon were officially and finally determined by Jewish authority. Not that official sanction created public opinion, however, but rather confirmed it.<P>12. The Talmud (200-500 AD):<P>The Talmud consists of two parts:<P>(1) The Mishna (compiled circa 200 AD), a collection of systematized tradition; and<P>(2) the Gemara, Gemara (completed about 500 AD), a "vast and desultory commentary on the Mishna" A Baraitha\', or unauthorized gloss, known as the Babha\' Bathra\' 14 b, a Talmudic tractate, relates the "order" of the various books of the Old Testament and who "wrote" or edited them. But it says nothing of the formation of the canon.<P>To write is not the same as to canonize; though to the later Jews the two ideas were closely akin. As a witness, therefore, this tractate is of little value, except that it confirms the tripartite division and is a good specimen of rabbinic speculation. For the full text of the passage, see Ryle, Canon of the Old Testament, 273ff.<P>13. Jewish Doubts in the 2nd Century AD:<P>During the 2nd century AD, doubts arose in Jewish minds concerning four books, Proverbs, Canticles, Ecclesiastes, and Esther. In a certain Talmudic tractate it is related that an attempt was made to withdraw (ganaz, "conceal," "hide") the Book of Proverbs on account of contradictions which were found in it (compare <a onClick="return mV(\'Pro\',26,4,5);">Pr 26:4-5</a>), but on deeper investigation it was not withdrawn. In another section of the Talmud, Rabbi Akiba is represented as saying concerning Canticles: "God forbid that any man of Israel should deny that the Song of Songs defileth the hands, for the whole world is not equal to the day in which the Song of Songs was given to Israel. For all Scriptures are holy, but the Song of Songs is the holiest of the holy." Such extravagant language inclines one to feel that real doubt must have existed in the minds of some concerning the book. But the protestations were much stronger against Ecclesiates. In one tractate it is stated: "The wise men desired to hide it because its language was often self-contradictory (compare <a onClick="return mV(\'Ecc\',7,3);">Ec 7:3</a> and <a onClick="return mV(\'Ecc\',2,2);">Ec 2:2</a>; <a onClick="return mV(\'Ecc\',4,2);">4:2</a>; <a onClick="return mV(\'Ecc\',9,4);">9:4</a>), but they did not hide it because the beginning and the end of it consist of words from the Torah (compare <a onClick="return mV(\'Ecc\',1,3);">Ec 1:3</a>; <a onClick="return mV(\'Ecc\',12,13,14);">12:13-14</a>)." Likewise Esther was vigorously disputed by both the Jerusalem and Babylonian Gemaras, because the name of God was not found in it; but a Rabbi Simeon ben Lakkish (circa 300 AD) defended its canonicity, putting Esther on an equality with the Law and above the Prophets and the other Writings. Other books, for example, Ezekiel and Jonah, were discussed in post-Talmudic writings, but no serious objections were ever raised by the Jews against either. Jonah was really never doubted till the 12th century AD. In the case of no one of these disputed books were there serious doubts; nor did scholastic controversies affect public opinion.<P>14. Summary and Conclusion:<P>This brings us to the end of our examination of the witnesses. In our survey we have discovered<P>(1) that the Old Testament says nothing about its canonization, but does emphasize the manner in which the Law was preserved and recognized as authoritative;<P>(2) that to conclude that the Jews possessed the Law only, when the renegade Manasseh was expelled by Nehemiah from Jerusalem, because the Samaritans admit of the Law alone as the true canon, is unwarrantable;<P>(3) that the Septuagint version as we know it from the Christian manuscripts extant is by no means a sufficient proof that the Alexandrians possessed a "larger" canon which included the Apocrpha;<P>(4) that Jesus ben Sirach is a witness to the fact that the Prophets in his day (180 BC) were not yet acknowledged as canonical;<P>(5) that his grandson in his Prologue is the first witness to the customary tripartite division of Old Testament writings, but does not speak of the 3rd division as though it were already closed;<P>(6) that the Books of Maccabees seem to indicate that Psalms and Daniel are already included in the canon of the Jews;<P>(7) that Philo\'s testimony is negative, in that he witnesses against the Apocryphal books as an integral part of Holy Scripture;<P>(8) that the New Testament is the most explicit witness of the series, because of the names and titles it ascribes to the Old Testament books which it quotes;<P>(9) that 4 Esdras is the first witness to the number of books in the Old Testament canon—24;<P>(10) that Josephus also fixes the number of books, but in arguing for the antiquity of the canon speaks as an advocate, voicing popular tradition, rather than as a scientific historian;<P>(11) that the Councils of Jamnia may, with some ground, be considered the official occasion on which the Jews pronounced upon the limits of their canon; but that<P>(12) doubts existed in the 2nd century concerning certain books; which books, however, were not seriously questioned.<P>From all this we conclude, that the Law was canonized, or as we would better say, was recognized as authoritative, first, circa 444 BC; that the Prophets were set on an even footing with the Law considerably later, circa 200 BC; and that the Writings received authoritative sanction still later, circa 100 BC. There probably never were three separate canons, but there were three separate classes of writings, which between 450 and 100 BC doubtless stood on different bases, and only gradually became authoritative. There is, therefore, ground for thinking, as suggested above (section 6), that the tripartite division of the Old Testament canon is due to material differences in the contents as well as to chronology.<P>III. The Canon in the Christian Church.<P>1. In the Eastern or Oriental Church:<P>In making the transition from the Jewish to the Christian church, we find the same canon cherished by all. Christians of all sects have always been disposed to accept without question the canon of the Jews. For centuries all branches of the Christian church were practically agreed on the limits set by the Jews, but eventually the western church became divided, some alleging that Christ sanctioned the "larger" canon of Alexandria, including the Apocrypha, while others adhered, as the Jews have always done, to the canon of the Jews in Palestine taking the eastern or oriental church first, the evidence they furnish is as follows: The Peshitta, or Syriac version, dating from circa 150 AD, omits Chronicles; Justin Martyr (164 AD) held to a canon identical with that of the Jews; the Canon of Melito, bishop of Sardis, who (circa 170 AD) made a journey to Palestine in order carefully to investigate the matter, omits Est. His list, which is the first Christian list we have, has been preserved to us by Eusebius in his Ecclesiastical Hist., IV, 26; Origen (died 254 AD), who was educated in Alexandria, and was one of the most learned of the Greek Fathers, also set himself the task of knowing the "Hebrew verity" of the Old Testament text, and gives us a list (also preserved to us by Eusebius, Ecclesiastical Hist., VI, 5) in which he reckons the number of books as 22 (thus agreeing with Josephus). Inadvertently he omits the Twelve Minor Prophets, but this is manifestly an oversight on the part of either a scribe or of Eusebius, as he states the number of books <span class="noTag">is</span> 22 and then names but 21. The so-called Canon of Laodicea (circa 363 AD) included the canonical books only, rejecting the Apocrypha. Athanasius (died 365 AD) gives a list in which Esther is classed as among the non-canonical books, but he elsewhere admits that "Esther is considered canonical by the Heb." However, he included Baruch and the Epistle of Jeremiah with Jeremiah. Amphilochius, bishop of Iconium (circa 380 AD), speaks of Esther as received by some only. Cyril, bishop of Jerusalem (died 386 AD), gives a list corresponding with the Hebrew canon, except that he includes Baruch and the Epistle of Jeremiah. Gregory of Nazianzus in Cappadocia (died 390 AD) omits Esther. But Anastasius, patriarch of Antioch (560 AD), and Leontius of Byzantium (580 AD) both held to the strict Jewish canon of 22 books. The Nestorians generally doubted Esther. This was due doubtless to the influence of Theodore of Mopsuestia (circa 390-457 AD) who disputed the authority of Chronicles, Ezra, Nehemiah, Esther and Job. The oriental churches as a whole, however, never canonized the Apocrypha.<P>2. In the Western Church:<P>Between 100 and 400 AD, the New Testament writings became canonical, occupying in the Christian church a place of authority and sacredness equal to those of the Old Testament. The tendency of the period was to receive everything which had been traditionally read in the churches. But the transference of this principle to the Old Testament writings produced great confusion. Usage and theory were often in conflict. A church Father might declare that the Apocryphal books were uninspired and yet quote them as "Scripture," and even introduce them with the accepted formula, "As the Holy Ghost saith." Theologically, they held to a strict canon, homiletically they used a larger one. But even usage was not uniform. 3 and 4 Esdras and the Book of Enoch are sometimes quoted as "Holy Writ," yet the western church never received these books as canonical. The criterion of usage, therefore, is too broad. The theory of the Fathers was gradually forgotten, and the prevalent use of the Septuagint and other versions led to the obliteration of the distinction between the undisputed books of the Hebrew canon and the most popular Apocryphal books; and being often publicly read in the churches they finally received a quasi-canonization.<P>Tertullian of Carthage (circa 150-230 AD) is the first of the Latin Fathers whose writings have been preserved. He gives the number of Old Testament books as 24, the same as in the Talmud Hilary, bishop of Poitiers in France (350-368 AD), gives a catalogue in which he speaks of "Jeremiah and his epistle," yet his list numbers only 22. Rufinus of Aquileia in Italy (died 410 AD) likewise gives a complete list of 22 books. Jerome also, the learned monk of Bethlehem (died 420 AD), gives the number of canonical books as 22, corresponding to the 22 letters of the Hebrew alphabet, and explains that the five double books (1 and 2 Samuel, 1 and 2 Kings, 1 and 2 Chronicles, Ezra-Nehemiah, Jeremiah-Lamentations) correspond to the five final letters of the Hebrew alphabet. In his famous Prologus Galeatus or "Helmed Preface" to the Books of Samuel and Kings, he declares himself for the strict canon of the Jews; rejecting the authority of the deutero-canonical books in the most outspoken manner, even distinguishing carefully the apocryphal additions to Esther and to Daniel. As the celebrated Catholic writer, Dr. Gigot, very frankly allows, "Time and again this illustrious doctor (Jerome) of the Latin church rejects the authority of the deutero-canonical books in the most explicit manner" (General Intro, 56).<P>Contemporaneous with Jerome in Bethlehem lived Augustine in North Africa (353-430 AD). He was the bishop of Hippo; renowned as thinker, theologian and saint. In the three great Councils of Hippo (393) and Carthage (397 and 419 AD), of which he was the leading spirit, he closed, as it were, the great debate of the previous generations on the subject of how large shall be the Bible. In his essay on Christian Doctrine, he catalogues the books of Scripture, which had been transmitted by the Fathers for public reading in the church, giving their number as 44, with which he says "the authority of the Old Testament is ended." These probably correspond with the present canon of Catholics. But it is not to be supposed that Augustine made no distinction between the proto-canonical and deutero-canonical books. On the contrary, he limited the term "canonical" in its strict sense to the books which are inspired and received by the Jews, and denied that in the support of doctrine the Books of Wisdom and Ecclesiasticus were of unquestioned authority, though long custom had entitled them to respect. And when a passage from 2 Maccabees was urged by his opponents in defense of suicide, he rejected their proof by showing that the book was not received into the Hebrew canon to which Christ was witness. At the third Council of Carthage (397 AD), however, a decree was ratified, most probably with his approval, which in effect placed all the canonical and deutero-canonical books on the same level, and in the course of time they actually became considered by some as of equal authority (see <a href="./study/isbe/search.html?string=DEUTERO-CANONICAL">DEUTERO-CANONICAL</a>). A few years later, another council at Carthage (419 AD) took the additional step of voting that their own decision concerning the canon should be confirmed by Boniface, the bishop of Rome; accordingly, thereafter, the question of how large the Bible should be became a matter to be settled by authority rather than by criticism.<P>From the 4th to the 16th century AD the process of gradually widening the limits of the canon continued. Pope Gelasius (492-496 AD) issued a decretal or list in which he included the Old Testament apocrypha. Yet even after this official act of the papacy the sentiment in the western church was divided. Some followed the strict canon of Jerome, while others favored the larger canon of Augustine, without noting his cautions and the distinctions he made between inspired and uninspired writings. Cassiodorus (556 AD) and Isidore of Seville (636 AD) place the lists of Jerome and Augustine side by side without deciding between them. Two bishops of North Africa, Primasius and Junilius (circa 550 AD) reckon 24 books as strictly canonical and explicitly state that the others are not of the same grade. Popular usage, however, was indiscriminate. Outside the Jews there was no sound Hebrew tradition. Accordingly, at the Council of Florence (1442 AD), "Eugenius IV, with the approval of the Fathers of that assembly, declared all the books found in the Latin Bibles then in use to be inspired by the same Holy Spirit, without distinguishing them into two classes or categories" (compare Gigot, General Introduction, 71). Though this bull of Eugenius IV did not deal with the canonicity of the Apocryphal books, it did proclaim their inspiration. Nevertheless, down to the Council of Trent (1546 AD), the Apocryphal books possessed only inferior authority; and when men spoke of canonical Scripture in the strict sense, these were not included.<P>Luther, the great Saxon Reformer of the 16th century, marks an epoch in the history of the Christian Old Testament canon. In translating the Scriptures into German, he gave the deutero-canonical books an intermediate position between the Old Testament and the New Testament. The Lutheran church, also, while it does not expressly define the limits of the canon, yet places the Apocryphal writings by themselves as distinct and separate from Holy Scripture. This indeed was the attitude of all the early Reformers. In the Zurich Bible of 1529, as in the Genevan version in English of 1560, the Apocryphal books were placed apart with special headings by themselves. Thus the early Reformers did not entirely reject the Apocryphal writings, for it was not an easy task to do so in view of the usage and traditions of centuries.<P>Rome had vacillated long enough. She realized that something must be done. The Reformers had sided with those who stood by Jerome. She therefore resolved to settle the matter in an ecclesiastical and dogmatic manner. Accordingly the Council of Trent decreed at their fourth sitting (April 8, 1546), that the Apocryphal books were equal in authority and canonical value to the other books of sacred Scripture; and to make this decree effective they added: "If, however, anyone receive not as sacred and canonical the said books entire with all their facts, and as they have been used to be read in the Catholic church, and as they are contained in the Old Latin Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) edition...let him be anathema." The decree was the logical outcome of the ever-accumulating snowball tendency in the western church. The historical effect of it upon the church is obvious. It closed forever the field of Biblical study against all free research. Naturally, therefore, the Vatican Council of 1870 not only reiterated the decree but found it easy to take still another step and canonize tradition.<P>Repeated endeavors were made during the 16th and 17th centuries to have the Apocryphal books removed from the Scriptures. The Synod of Dort (1618-19), Gomarus, Deodatus and others, sought to accomplish it, but failed. The only success achieved was in getting them separated from the truly canonical writings and grouped by themselves, as in the Gallican Confession of 1559, the Anglican Confession of 1562, and the Second Helvetic Confession of 1566. The Puritan Confession went farther, and declared that they were of a purely secular character. The various continental and English versions of the Bible then being made likewise placed them by themselves, apart from the acknowledged books, as a kind of appendix. For example, the Zurich Bible of 1529, the French Bible of 1535, Coverdale\'s English translation of 1536, Matthew\'s of 1537, the second edition of the Great Bible,1540,the Bishops\' of 1568, and the King James Version of 1611. The first English version to omit them altogether was an edition of King James\' Version published in 1629; but the custom of printing them by themselves, between the Old Testament and the New Testament, continued until 1825, when the Edinburgh Committee of the British and Foreign Bible Society protested that the Society should no longer translate these Apocryphal writings and send them to the heathen. The Society finally yielded and decided to exclude them (May 3, 1827). Since then, Protestants in Great Britain and America have given up the practice of publishing the Apocrypha as a part of sacred Scripture. In Europe, also, since 1850, the tendency has been in the same direction. The Church of England, however, and the American Episcopal church, do not wholly exclude them; certain "readings" being selected from Wisdom, Ecclesiastes and Baruch, and read on week days between October 27 and November 17. Yet, when the English Revised Version appeared in 1885, though it was a special product of the Church of England, there was not so much as a reference to the Apocryphal writings. The Irish church likewise removed them; and the American Standard Revised Version ignores them altogether.<P>LITERATURE.<P>G. Wildeboer, The Origin of the Canon of the Old Testament, translated by B. W. Bacon, London, Luzac and Co., 1895; H. E. Ryle, The Canon of the Old Testament, London and New York, Macmillan, 1892; F. Buhl, Canon and Text of the Old Testament, translated by John MacPherson, Edinburgh, T. and T. Clark, 1892; W. H. Green, General Introduction to the Old Testament, The Canon, New York, Scribner, 1898; W. Robertson Smith, The Old Testament in the Jewish Church, 2nd edition, London, A. and C. Black, 1895; F. E. Gigot, General Introduction to the Holy Scriptures, 3rd edition, New York, Cincinnati and Chicago, Benziger Bros., 1903; B. F. Westcott, The Bible in the Christian Church, London and New York, Macmillan, 1901; C. A. Briggs, General Introduction to the Study of Holy Scripture, New York, Scribner, 1899; A. F. Kirkpatrick, The Divine Library of the Old Testament, London and New York, Macmillan, 1892; Hastings, DB, III, 1900, article "Old Testament Canon" by F. H. Woods; Cheney and Black\'s EB, I, 1899, article "Canon" by K. Budde; The New Schaff-Herzog Encyclopedia of Religious Knowledge, II, 1908, article "Canon of Scripture" by H. L. Struck; Jour. of Biblical Lit., 1896, 118-28, article "The Alleged Triple Canon of the Old Testament," by W. J. Beecher; Abbe A. Loisy, Histoire du canon de l\'ancien testament, Paris, 1890; J. Furst, Der Kanon des Altes Testament, Leipzig, 1868; E. Reuss, Histoire du canon des saintes ecritures dans l\'eglise chretienne, Strassburg, 1864, English translation, Edinburgh, 1891.``152';
isbe[1839]='Canopy`kan\'-o-pi (chuppah, from a root meaning "to enclose" or "cover"): <a onClick="return mV(\'Isa\',4,5);">Isa 4:5</a> the King James Version has "defence," the English Revised Version "canopy," the American Standard Revised Version "covering," the last being best, though "canopy" has much in its favor. In <a onClick="return mV(\'Psa\',19,5);">Ps 19:5 (Hebrew 6)</a> chuppah is used of the bridegroom\'s chamber and in <a onClick="return mV(\'Joe\',2,16);">Joe 2:16</a> of the bride\'s. Among the Heb the chuppah was originally the chamber in which the bride awaited the groom for the marital union. In Judith 10:21; 13:9,15; 16:19 the word canopy occurs as the English equivalent of the Greek konopeion, which was primarily a mosquito-net and then a canopy over a bed, whether for useful or for decorative purposes.``156';

isbe[1841]='Caperberry`ka\'-per-ber-i (\'abhiyonah; kapparis; <a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a> the Revised Version, margin): The translation "the caperberry shall fail" (the Revised Version (British and American) "burst") instead of "desire shall fail" (the King James Version) has the support of the Septuagint and of some Talmudic writers (see G. F. Moore, JBL, X, 55-64), but it is doubtful.<P>The caperberry is the fruit of the thorny caper, Capparis spinosa (Natural Order Capparidaceae), a common Palestine plant with pretty white flowers and brightly colored stamens. Largely on account of its habit of growing out of crevasses in old walls it has been identified by some with the <a href="./study/isbe/search.html?string=HYSSOP">HYSSOP</a> (which see). The familiar "capers" of commerce are the young buds, but the berries were the parts most used in ancient times; their repute as excitants of sexual desire is ancient and widespread. Various parts of this plant are still used for medical purposes by the modern peasants of Palestine.``117';
isbe[1842]='Capernaum`ka-per\'-na-um (Kapernaoum (Textus Receptus), Kapharnaoum (Codex Vaticanus, Codex Sinaiticus, Codex Bezae; etc.)): The woe spoken by the Master against this great city has been fulfilled to the uttermost (<a onClick="return mV(\'Mat\',11,23);">Mt 11:23</a>; <a onClick="return mV(\'Luk\',10,15);">Lu 10:15</a>). So completely has it perished that the very site is a matter of dispute today. In Scripture Capernaum is not mentioned outside the Gospels. When Jesus finally departed from Nazareth, He dwelt in Capernaum (<a onClick="return mV(\'Mat\',4,13);">Mt 4:13</a>) and made it the main center of His activity during a large part of His public ministry. Near by He called the fishermen to follow Him (<a onClick="return mV(\'Mar\',1,16);">Mr 1:16</a>), and the publican from the receipt of custom (<a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>, etc.). It was the scene of many "mighty works" (<a onClick="return mV(\'Mat\',11,23);">Mt 11:23</a>; <a onClick="return mV(\'Mar\',1,34);">Mr 1:34</a>). Here Jesus healed the centurion\'s son (<a onClick="return mV(\'Mat\',8,5);">Mt 8:5</a>, etc.), the nobleman\'s son (<a onClick="return mV(\'Jhn\',4,46);">Joh 4:46</a>), Simon Peter\'s mother-in-law (<a onClick="return mV(\'Mar\',1,31);">Mr 1:31</a>, etc.), and the paralytic (<a onClick="return mV(\'Mat\',9,1);">Mt 9:1</a>, etc.); cast out the unclean spirit (<a onClick="return mV(\'Mar\',1,23);">Mr 1:23</a>, etc.); and here also, probably, He raised Jairus\' daughter to life (<a onClick="return mV(\'Mar\',5,22);">Mr 5:22</a>, etc.). In Capernaum the little child was used to teach the disciples humility, while in the synagogue Jesus delivered His ever-memorable discourse on the bread of life (<a onClick="return mV(\'Jhn\',6,\'1-\');">Joh 6</a>). From the notices in the Gospels we gather that Capernaum was a city of considerable importance. Some think that the words "shalt thou be exalted," etc. (<a onClick="return mV(\'Mat\',11,23);">Mt 11:23</a>; <a onClick="return mV(\'Luk\',10,15);">Lu 10:15</a>), mean that it stood on an elevated site. Perhaps more naturally they refer to the excessive pride of the inhabitants in their city. It was a customs station, and the residence of a high officer of the king (<a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>; <a onClick="return mV(\'Jhn\',4,46);">Joh 4:46</a>, etc.). It was occupied by a detachment of Roman soldiers, whose commander thought the good will of the people worth securing at the expense of building for them a synagogue (<a onClick="return mV(\'Mat\',8,5);">Mt 8:5</a>; <a onClick="return mV(\'Luk\',7,5);">Lu 7:5</a>). It stood by the sea (<a onClick="return mV(\'Mat\',4,13);">Mt 4:13</a>) and from <a onClick="return mV(\'Jhn\',6,17);">Joh 6:17</a>ff (compare <a onClick="return mV(\'Mat\',14,34);">Mt 14:34</a>; <a onClick="return mV(\'Mar\',6,53);">Mr 6:53</a>), we see that it was either in or near the plain of Gennesaret.<P>Josephus twice mentions Capernaum. It played no great part in the history of his time, and seems to have declined in importance, as he refers to it as a "village." In battle in el-Bateichah his horse fell into a quagmire, and he suffered injury which disabled him for further fighting. His soldiers carried him to the village of Capernaum (this reference is however doubtful; the name as it stands is Kepharnomon which Niese corrects to Kepharnokon), whence he was removed to Tarichea (Vita, 72). Again he eulogizes the plain of Gennesaret for its wonderful fruits, and says it is watered by a most fertile fountain which the people of the country call Capharnaum. In the water of this fountain the Coracinus is found (BJ, III, x, 8). Josephus therefore corroborates the Biblical data, and adds the information as to the fountain and the Coracinus fish. The fish however is found in other fountains near the lake, and is therefore no help toward identification.<P>The two chief rivals for the honor of representing Capernaum are Tell Chum, a ruined site on the lake shore, nearly 2 1/2 miles west of the mouth of the Jordan; and Khan Minyeh fully 2 1/2 miles farther west, at the Northeast corner of the plain of Gennesaret. Dr. Tristram suggested \'Ain El-Madowwerah, a large spring enclosed by a circular wall, on the western edge of the plain. But it stands about a mile from the sea; there are no ruins to indicate that any considerable village ever stood here; and the water is available for only a small part of the plain.<P>In favor of Tell Chum is Eusebius, Onomasticon, Which places Chorazin 2 miles from Capernaum. If Kerazeh is Chorazin, this suits Tell Chum better than Khan Minyeh. To this may be added the testimony of Theodosius (circa 530), Antoninus Martyr (600), and John of Wurtzburg (1100). Jewish tradition speaks of Tankhum, in which are the graves of Nahum and Rabbi Tankhum. Identifying Kerr Nahum with Tankhum, and then deriving Tell Chum from Tankhum, some have sought to vindicate the claims of this site. But every link in that chain of argument is extremely precarious. A highway ran through Tell Chum along which passed the caravans to and from the East; but the place was not in touch with the great north-and-south traffic.<P>There is also no fountain near Tell Chum answering the description of Josephus. Of recent advocates of Tell Chum, it is sufficient to name Schurer (HJP, IV, 71) and Buhl (GAP, 224f). In this connection it may be interesting to note that the present writer, when visiting the place recently (1911), drew his boatman\'s attention to a bit of ruined wall rising above the greenery west of the lagoon, and asked what it was called. Kaniset el Kufry, was the reply, which may be freely rendered, "church of the infidels." This is just the Arabic equivalent of the Jewish "church of the minim."<P>For Khan Minyeh it may be noted that Gennesaret corresponds to el-Ghuweir, the plain lying on the Northwest shore, and that Khan Minyeh stands at the Northeast extremity of the plain; thus answering, as Tell Chum cannot do, the description of the Gospels. The copious fountains at eT-Tabigha, half a mile to the east, supplied water which was conducted round the face of the rock toward Khan Minyeh at a height which made it possible to water a large portion of the plain. If it be said that Josephus must have been carried to Tell Chum as being nearer the scene of his accident—see however, the comment above—it does not at all follow that he was taken to the nearest place. Arculf (1670) described Capernaum as on a "narrow piece of ground between the mountain and the lake." This does not apply to Tell Chum; but it accurately fits Khan Minyeh. Isaac Chelo (1334) says that Capernaum, then in ruins, had been inhabited by Minim, that is, Jewish converts to Christianity. The name Minyeh may have been derived from them. Quaresimus (1620-26) notes a Khan called Menieh which stood by the site of Capernaum. Between the ruined Khan and the sea there are traces of ancient buildings. Here the road from the east united with that which came down from the north by way of Khan Jubb Yusif, so that this must have been an important center, alike from the military point of view, and for customs. This is the site favored by, among others, G. A. Smith (HGHL, 456f; EB, under the word) and Conder. Sanday argued in favor of Khan Minyeh in his book, The Sacred Sites of the Gospel, but later, owing to what the present writer thinks a mistaken view of the relation between Tell Chum and the fountain at eT-Tabigha, changed his mind (Expository Times, XV, 100ff). There is no instance of a fountain 2 miles distant being called by the name of a town. Tell Chum, standing on the sea shore, was independent of this fountain, whose strength also was spent in a westward direction, away from Tell Chum.<P>The balance of evidence was therefore heavily in favor of Khan Minyeh until Professor R. A. S. Macalister published the results of his researches. He seems to be wrong in rejecting the name Tell Chum in favor of Talchum; and he falls into a curious error regarding the use of the word tell. No one who speaks Arabic, he says, "would ever think of applying the word Tell, \'mound,\' to this flat widespread ruin." In Egyptian Arabic, however, tell means "ruin"; and Asad Mansur, a man of education whose native language is Arabic, writes: "I do not understand what the objectors mean by the word \'tell.\' In Arabic \'tell\' is used for any heap of ruins, or mound. So that the ruins of Tell Chum themselves are today a \'tell\' " Expos, April, 1907, 370). Professor Macalister is on surer ground in discussing the pottery found on the rival sites. At Khan Minyeh he found nothing older than the Arabian period, while at Tell Chum pottery of the Roman period abounds—"exactly the period of the glory of Capernaum" (PEFS, April and July, 1907). If this be confirmed by further examination, it disposes of the claim of Khan Minyeh. Important Roman remains have now been found between the ruined Khan and the sea. It is no longer open to doubt that this was the site of a great Roman city. The Roman period however covers a long space. The buildings at Tell Chum are by many assigned to the days of the Antonines. Is it possible from the remains of pottery to make certain that the city flourished in the time of the Herods? If the city at Tell Chum had not yet arisen in the days of Christ, those who dispute its claim to be Capernaum are under no obligation to show which city the ruins represent. They are not the only extensive ruins in the country of whose history we are in ignorance.``54';

isbe[1844]='Capharsalama`kaf-ar-sal\'-a-ma, kaf-ar-sala\'-ma (Chapharsalama): The site of an indecisive skirmish between Judas Maccabeus and Nicanor, an officer of the king of Syria and governor of Judea. The situation cannot be precisely fixed but it must have been in the neighborhood of Jerusalem, for Nicanor, after losing 5,000 men, retired with the remainder to "the city of David" (1Macc 7:26-32). The first part of the word, "Caphar," means village or hamlet; the last part has been identified with Siloam and also with Khirbet Deir Sellam, about 12 1/2 miles west of Jerusalem.``1';
