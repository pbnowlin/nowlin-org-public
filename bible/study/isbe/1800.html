isbe[1823]='Cana, of Galilee`ka\'-na, (Kana tes Galilaias): This was the scene of Christ\'s earliest miracle, when, at the marriage feast, He turned water into wine (<a onClick="return mV(\'Jhn\',2,1);">Joh 2:1</a>ff). It was the home of Nathaniel (<a onClick="return mV(\'Jhn\',21,2);">Joh 21:2</a>). From Cana, after the marriage, Jesus "went down" to Capernaum (<a onClick="return mV(\'Jhn\',2,12);">Joh 2:12</a>), and returned at the request of the centurion (<a onClick="return mV(\'Jhn\',4,46,51);">Joh 4:46, 51</a>). These are the only notices of Cana in Scripture, and from them we learn merely that it was in Galilee, and in the uplands west of the lake. Other villages of the same name are mentioned by Josephus, but probably this one is intended by the Cana where for a time he dwelt (Vita, 16) which he locates in the plain of Asochis (ibid., 41). The Greek kana probably transliterates an old Hebrew qanah, "place of reeds." This ancient name survives in Khirbet Qana, a ruined site with rockhewn tombs, cisterns and a pool, on the northern edge of Sahl el-Battauf, the plain of Asochis. Near by are marshy stretches where reeds still abound: the name therefore is entirely appropriate. The name Qana el-Jelil, the exact Arabic equivalent of Kana tes Galilaias, is also heard among the natives. This, however, may have arisen from the suggested identification with Cana of the Gospel. The position agrees well enough with the Gospel data.<P>Kefr Kennah, a thriving village about 3 3/4 miles from Nazareth, on the southern edge of Sahl Tor\'an, the plain south of the range of that name, through which the road from Nazareth to Tiberias passes, has also many advocates. This identification is accepted by the Greek and Latin churches, which have both built extensively in the village; the Greeks showing stone jars said to have been used in the miracle, and the traditional house of Nathaniel being pointed out. A copious spring of excellent water rises west of the village; and the pomegranates grown here are greatly prized. The change of name, however, from Qana to Kennah—(note the doubled n), is not easy; and there are no reeds in the neighborhood to give the name any appropriateness.<P>Onom locates Cana in the tribe of Asher toward Great Sidon, probably thinking of Kana, a village about 8 miles south of Tyre. The pilgrims of the Middle Ages seem to be fairly divided as to the two sites. Saewulf (1102), Brocardius (1183), Marinus Sanutus (1321), Breydenbach (1483) and Anselm (1507) favor the northern site; while on the side of Kefr Kennah may be reckoned Paula (383), Willibald (720), Isaac Chelo (1334) and Quaresimus (1616). It seems pretty certain that the Crusaders adopted the identification with Khirbet Kana (Conder, Tent Work, 69f). While no absolute decision is possible, on the available evidence probability points to the northern site.<P>Col. Conder puts in a claim for a third site, that of \'Ain Kana on the road from er-Reineh (a village about 1 1/2 mile from Nazareth on the Tiberias road) to Tabor (Tent Work, 81).``54';
isbe[1824]='Canaan; Canaanites`ka\'-nan, ka\'-nan-its (kena\'an; Chanaan):<P>1. Geography<P>2. Meaning of the Name<P>3. The Results of Recent Excavations<P>4. History<P class="in15">(1) Stone Age<P class="in15">(2) Bronze Age<P class="in15">(3) A Babylonian Province<P class="in15">(4) Jerusalem Founded<P class="in15">(5) The Hyksos<P class="in15">(6) Egyptian Conquest<P class="in15">(7) Tell el-Amarna Tablets<P>5. The Israelitsh Invasion<P>6. Culture<P>7. Art<P>8. Commerce<P>9. Art of Writing<P>LITERATURE</b><hr /><P>Canaan is stated in <a onClick="return mV(\'Gen\',10,6);">Ge 10:6</a> to have been a son of Ham and brother of Mizraim, or Egypt. This indicates the Mosaic period when the conquerors of the XVIIIth and XIXth Egyptian Dynasties made Canaan for a time a province of the Egyptian empire. Under the Pharaoh Meneptah, at the time of the Exodus, it ceased to be connected with Egypt, and the Egyptian garrisons in the south of the country were expelled by the Philistines, who probably made themselves masters of the larger portion of it, thus causing the name of Philistia or Palestine to become synonymous with that of Canaan (see <a onClick="return mV(\'Zep\',2,5);">Ze 2:5</a>). In the Tell el-Amarna Letters, Canaan is written Kinakhna and Kinakhkhi. The latter form corresponds with the Greek (Chna), a name given to Phoenicia (Hecat. Fragments 254; Eusebius, praep. Ev., i.10; ix. 17).<P>1. Geography:<P>In <a onClick="return mV(\'Num\',13,29);">Nu 13:29</a> the Canaanites are described as dwelling "by the sea, and along by the side of the Jordan," i.e. in the lowlands of Palestine. The name was confined to the country west of the Jordan (<a onClick="return mV(\'Num\',33,51);">Nu 33:51</a>; <a onClick="return mV(\'Jos\',22,9);">Jos 22:9</a>), and was especially applied to Phoenicia (<a onClick="return mV(\'Isa\',23,11);">Isa 23:11</a>; compare <a onClick="return mV(\'Mat\',15,22);">Mt 15:22</a>). Hence, Sidon is called the "firstborn" of Canaan (<a onClick="return mV(\'Gen\',10,15);">Ge 10:15</a>, though compare <a onClick="return mV(\'Jdg\',3,3);">Jud 3:3</a>), and the Septuagint translates "Canaanites" by "Phoenicians" and "Canaan" by the "land of the Phoenicians" (<a onClick="return mV(\'Exd\',16,35);">Ex 16:35</a>; <a onClick="return mV(\'Jos\',5,12);">Jos 5:12</a>). Kinakhkhi is used in the same restricted sense in the Tell el-Amarna Letters, but it is also extended so as to include Palestine generally. On the other hand, on the Egyptian monuments Seti I calls a town in the extreme south of Palestine "the city of Pa-Kana\'na" or "the Canaan," which Conder identifies with the modern Khurbet Kenan near Hebron. As in the Tell el-Amarna Letters, so in the Old Testament, Canaan is used in an extended sense to denote the whole of Palestine west of the Jordan (<a onClick="return mV(\'Gen\',12,5);">Ge 12:5</a>; <a onClick="return mV(\'Gen\',23,2,19);">23:2, 19</a>; <a onClick="return mV(\'Gen\',28,1);">28:1</a>; <a onClick="return mV(\'Gen\',31,18);">31:18</a>; <a onClick="return mV(\'Gen\',35,6);">35:6</a>; <a onClick="return mV(\'Gen\',36,2);">36:2</a>; <a onClick="return mV(\'Gen\',37,1);">37:1</a>; <a onClick="return mV(\'Gen\',48,7);">48:7</a>; <a onClick="return mV(\'Exd\',15,15);">Ex 15:15</a>; <a onClick="return mV(\'Num\',13,2);">Nu 13:2</a>; <a onClick="return mV(\'Jos\',14,1);">Jos 14:1</a>; <a onClick="return mV(\'Jos\',21,2);">21:2</a>; <a onClick="return mV(\'Psa\',135,11);">Ps 135:11</a>). Thus, Jerusalem which had Amorite and Hittite founders is stated to be of "the land of the Canaanite" (<a onClick="return mV(\'Eze\',16,3);">Eze 16:3</a>), and <a onClick="return mV(\'Isa\',19,18);">Isa 19:18</a> terms Hebrew, which was shared by the Israelites with the Phoenicians and, apparently, also the Amorites, "the language of Caaan." Jabin is called "the king of Canaan" in <a onClick="return mV(\'Jdg\',4,2,23,24);">Jud 4:2, 23-24</a>; but whether the name is employed here in a restricted or extended sense is uncertain.<P>2. Meaning of the Name:<P>As the Phoenicians were famous as traders, it has been supposed that the name "Canaanite" is a synonym of "merchant" in certain passages of the Old Testament. The pursuit of trade, however, was characteristic only of the maritime cities of Phoenicia, not of the Canaanitish towns conquered the Israelites. In <a onClick="return mV(\'Isa\',23,11);">Isa 23:11</a> we should translate "Canaan" (as the Septuagint) instead of "merchant city" (the King James Version); in <a onClick="return mV(\'Hsa\',12,7);">Ho 12:7 (Hebrew 8)</a>, "as, for Canaan" (Septuagint), instead of "he is a merchant" (the King James Version); in <a onClick="return mV(\'Zep\',1,11);">Ze 1:11</a>, "people of Canaan" (Septuagint), instead of "merchant people" (the King James Version); on the other hand, "Canaanite" seems to have acquired the sense of "merchant," as "Chaldean" did of "astrologer," in <a onClick="return mV(\'Isa\',23,8);">Isa 23:8</a>, and <a onClick="return mV(\'Pro\',3,1,24);">Pr 3:1, 24</a>, though probably not in <a onClick="return mV(\'Zec\',14,21);">Zec 14:21</a>, and <a onClick="return mV(\'Job\',41,6);">Job 41:6 (Hebrew 40:30)</a>.<P>3. The Results of Recent Excavation:<P>Much light has been thrown upon the history of Canaan prior to the Israelite occupation by recent excavation, supplemented by the monuments of Babylonia and Egypt. The Palestine Exploration led the way by its excavations in 1890-92 at Tell el-Hesy, which turned out to be the site of Lachish, first under Professor Flinders Petrie and then under Dr. Bliss. Professor Petrie laid the foundations of Palestine archaeology by fixing the chronological sequence of the Lachish pottery, and tracing the remains of six successive cities, the fourth of which was that founded by the Israelites. Between it and the preceding city was a layer of ashes, marking the period when the town lay desolate and uninhabited. The excavations at Lachish were followed by others at Tell es-Safi, the supposed site of Gath; at Tell Sandahanna, the ancient Marissa, a mile south of Bet Jibrin, where interesting relics of the Greek period were found, and at Jerusalem, where an attempt was made to trace the city walls. Next to Lachish, the most fruitful excavations have been at Gezer, which has been explored by Mr. Macalister with scientific thoroughness and skill, and where a large necropolis has been discovered as well as the remains of seven successive settlements, the last of which comes down to the Seleucid era, the third corresponding with the first settlement at Lachish. The two first settlements go back to the neolithic age. With the third the Semitic or "Amorite" period of Canaan begins; bronze makes its appearance; high-places formed of monoliths are erected, and inhumation of the dead is introduced, while the cities are surrounded with great walls of stone. While Mr. Macalister has been working at Gezer, German and Austrian expeditions under Dr. Schumacher have been excavating at Tell em-Mutesellim, the site of Megiddo, and under Dr. Sellin first at Tell Taanak, the ancient Taanach, and then at Jericho. At Taanach cuneiform tablets of the Mosaic age were found in the house of the governor of the town; at Samaria and Gezer cuneiform tablets have also been found, but they belong to the late Assyrian and Babylonian periods. At Jericho, on the fiat roof of a house adjoining the wall of the Canaanitish city, destroyed by the Israelites, a number of clay tablets were discovered laid out to dry before being inscribed with cuneiform characters. Before the letters were written and dispatched, however, the town, it seems, was captured and burnt. An American expedition, under Dr. Reisner, is now exploring Sebastiyeh (Samaria), where the ruins of Ahab\'s palace, with early Hebrew inscriptions, have been brought to light, as well as a great city wall built in the age of Nebuchadrezzar.<P>4. History:<P>(1) Stone Age.<P>The history of Canaan begins with the paleolithic age, paleolithic implements having been found in the lowlands. Our first knowledge of its population dates from the neolithic period. The neolithic inhabitants of Gezer were of short stature (about 5 ft. 4 inches in height), and lived in caves—at least in the time of the first prehistoric settlement—and burned their dead. Their sacred place was a double cave with which cup-marks in the rock were connected, and their pottery was rude; some of it was ornamented with streaks of red or black on a yellow or red wash. In the time of the second settlement a rude stone wall was built around the town. The debris of the two neolithic settlements is as much as 12 ft. in depth, implying a long period of accumulation.<P>(2) Bronze Age.<P>The neolithic population was succeeded by one of Semitic type, which introduced the use of metal, and buried its dead. The name of Amorite has been given to it, this being the name under which the Semitic population of Canaan was known to the Babylonians. Gezer was surrounded by a great wall of stone intersected by brick towers; at Lachish the Amorite wall was of crude brick, nearly 29 ft. in thickness (compare <a onClick="return mV(\'Deu\',1,28);">De 1:28</a>). A "high-place" was erected at Gezer consisting of 9 monoliths, running from north to south, and surrounded by a platform of large stones. The second monolith has been polished by the kisses of the worshippers; the seventh was brought from a distance. Under the pavement of the sanctuary lay the bones of children, more rarely of adults, who had been sacrificed and sometimes burnt, and the remains deposited in jars. Similar evidences of human sacrifice were met with under the walls of houses both here and at Taanach and Megiddo. In the Israelite strata the food-bowl and lamp for lighting the dead in the other world are retained, but all trace of human sacrifice is gone. At Lachish in Israelite times the bowl and lamp were filled with sand. The second "Amorite" city at Gezer had a long existence. The high-place was enlarged, and an Egyptian of the age of the XIIth Dynasty was buried within its precincts. Egyptian scarabs of the XIIth and XIIIth Dynasties are now met with; these give place to scarabs of the Hyksos period, and finally to those of the XVIIIth Dynasty (1600 BC). Hittite painted pottery of Cappadocian type is also found in the later debris of the city as well as seal-cylinders of the Babylonian pattern.<P>(3) A Babylonian Province.<P>Meanwhile Canaan had for a time formed part of the Babylonian empire. Gudea, viceroy of Lagas under the kings of the Dynasty of Ur (2500 BC), had brought "limestone" from the "land of the Amorites," alabaster from Mt. Lebanon, cedar-beams from Amanus, and golddust from the desert between Palestine and Egypt. A cadastral survey was drawn up about the same time by Uru-malik, "the governor of the land of the Amorites," the name by which Syria and Canaan were known to the Babylonians, and colonies of "Amorites" engaged in trade were settled in the cities of Babylonia. After the fall of the Dynasty of Ur, Babylonia was itself conquered by the Amorites who founded the dynasty to which Khammurabi, the Amraphel of <a onClick="return mV(\'Gen\',14,1);">Ge 14:1</a>, belonged (see <a href="./study/isbe/search.html?string=HAMMURABI">HAMMURABI</a>). In an inscription found near Diarbekir the only title given to Khammu-rabi is "king of the land of the Amorites." Babylonian now became the official, literary and commercial language of Canaan, and schools were established there in which the cuneiform script was taught. Canaanitish culture became wholly Babylonian; even its theology and gods were derived from Babylonia. The famous legal code of Khammu-rabi (see <a href="./study/isbe/search.html?string=HAMMURABI,+CODE+OF">HAMMURABI, CODE OF</a>) was enforced in Canaan as in other parts of the empire, and traces of its provisions are found in Genesis. Abram\'s adoption of his slave Eliezer, Sarai\'s conduct to Hagar, and Rebekah\'s receipt of a dowry from the father of the bridegroom are examples of this. So, too, the sale of the cave of Machpelah was in accordance with the Babylonian legal forms of the Khammu-rabi age. The petty kings of Canaan paid tribute to their Babylonian suzerain, and Babylonian officials and "commerical travelers" (damgari) frequented the country.<P>(4) Jerusalem Founded.<P>We must ascribe to this period the foundation of Jerusalem, which bears a Babylonian name (Uru-Salim, "the city of Salim"), and commanded the road to the naphtha springs of the Dead-Sea. Bitumen was one of the most important articles of Babylonian trade on account of its employment for building and lighting purposes, and seems to have been a government monopoly. Hence, the rebellion of the Canaanitish princes in the naphtha district (<a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>) was sufficiently serious to require a considerable force for its suppression.<P>(5) The Hyksos.<P>The Amorite dynasty in Babylonia was overthrown by a Hittite invasion, and Babylonian authority in Canaan came to an end, though the influence of Babylonian culture continued undiminished. In the north the Hittites were dominant; in the south, where Egyptian influence had been powerful since the age of the XIIth Dynasty, the Hyksos conquest of Egypt united Palestine with the Delta. The Hyksos kings bear Canaanitish names, and their invasion of Egypt probably formed part of that general movement which led to the establishment of an "Amorite" dynasty in Babylonia. Egypt now became an appanage of Canaan, with its capital, accordingly, near its Asiatic frontier. One of the Hyksos kings bears the characteristically Canaanitish name of Jacob-el, written in the same way as on Babylonian tablets of the age of Khammu-rabi, and a place of the same name is mentioned by Thothmes III as existing in Southern Palestine<P>(6) Egyptian Conquest.<P>The Pharaohs of the XVIIIth Dynasty expelled the Hyksos and conquered Palestine and Syria. For about 200 years Canaan was an Egyptian province. With the Egyptian conquest the history of the second Amorite city at Gezer comes to an end. The old wall was partially destroyed, doubtless by Thothmes III (about 1480 BC). A third Amorite city now grew up, with a larger and stronger wall, 14 ft. thick. The houses built on the site of the towers of the first wall were filled with scarabs and other relics of the reign of Amon-hotep III (1440 BC). At Lachish the ruins of the third city were full of similar remains, and among them was a cuneiform tablet referring to a governor of Lachish mentioned in the Tell el-Amarna Letters. At Taanach cuneiform tablets of the same age have been discovered, written by Canaanites to one another but all in the Babylonian script and language.<P>(7) Tell el-Amarna Tablets.<P>In the Tell el-Amarna Letters we have a picture of Canaan at the moment when the Asiatic empire of Egypt was breaking up through the religious and social troubles that marked the reign of Amon-hotep IV. The Hittites were attacking it in the North; in the south of Canaan the Khabiri or "confederate" bands of free-lances were acquiring principalities for themselves. The petty kings and governors had foreign troops in their pay with which they fought one against the other; and their mercenaries readily transferred their allegiance from one paymaster to another, or seized the city they were engaged to defend. Hittites, Mitannians from Mesopotamia, and other foreigners appear as governors of the towns; the Egyptian government was too weak to depose them and was content if they professed themselves loyal. At times the Canaanitish princes intrigued with the Assyrians against their Egyptian masters; at other times with the Mitannians of "Aram-Naharaim" or the Hittites of Cappadocia. The troops sent by the Egyptian Pharaoh were insufficient to suppress the rebellion, and the authority of the Egyptian commissioners grew less and less. Eventually the king of the Amorites was compelled to pass openly over to the Hittite king, and Canaan was lost to the Pharaohs.<P>5. The Israelite Invasion:<P>Gaza and the neighboring towns, however, still remained in their hands, and with the recovery of Egyptian power under the XIXth Dynasty allowed Seti I to march once more into Canaan and reduce it again to subjection. In spite of Hittite attacks the country on both sides of the Jordan acknowledged the rule of Seti and his son Ramses II, and in the 21st year of the latter Pharaoh the long war with the Hittites came to an end, a treaty being made which fixed the Egyptian frontier pretty much where the Israelite frontier afterward ran. A work, known as The Travels of the Mohar, which satirizes the misadventures of a tourist in Canaan, gives a picture of Canaan in the days of Ramses II. With the death of Ramses II Egyptian rule in Palestine came finally to an end. The Philistines drove the Egyptian garrisons from the cities which commanded the military road through Canaan, and the long war with the Hittites exhausted the inland towns, so that they made but a feeble resistance to the Israelites who assailed them shortly afterward. The Egyptians, however, never relinquished their claim to be masters of Canaan, and when the Philistines power had been overthrown by David we find the Egyptian king again marching northward and capturing Gezer (<a onClick="return mV(\'1Ki\',9,16);">1Ki 9:16</a>). Meanwhile the counry had become to a large extent Israelite. In the earlier days of the Israelite invasion the Canaanitish towns had been destroyed and the people massacred; later the two peoples intermarried, and a mixed race was the result. The portraits accompanying the names of the places taken by Shishak in Southern Palestine have Amorite features, and the modern fellahin of Palestine are Canaanite rather than Jewish in type.<P>6. Culture:<P>Canaanitish culture was based on that of Babylonia, and begins with the introduction of the use of copper and bronze. When Canaan became a Babylonian province, it naturally shared in the civilization of the ruling power. The religious beliefs and deities of Babylonia were superimposed upon those of the primitive Canaanite. The local Baal or "lord" of the soil made way for the "lord of heaven," the Sun-god of the Babylonians. The "high-place" gradually became a temple built after a Babylonian fashion. The sacred stone, once the supreme object of Canaanitish worship, was transformed into a Beth-el or shrine of an indwelling god. The gods and goddesses of Babylonia migrated to Canaan; places received their names from Nebo or Nin-ip; Hadad became Amurru "the Amorite god"; Ishtar passed into Ashtoreth, and Asirtu, the female counterpart of Asir, the national god of Assyria, became Asherah, while her sanctuary, which in Assyria was a temple, was identified in Canaan with the old fetish of an upright stone or log. But human sacrifice, and more especially the sacrifice of the firstborn son, of which we find few traces in Babylonia, continued to be practiced with undiminished frequency until, as we learn from the excavations, the Israelite conquest brought about its suppression. The human victim is also absent from the later sacrificial tariffs of Carthage and Marseilles, its place being taken in them by the ram. According to these tariffs the sacrifices and offerings were of two kinds, the zau\'at or sin offering and the shelem or thank-offering. The sin offering was given wholly to the god; part of the thank-offering would be taken by the offerer. Birds which were not allowed as a sin offering might constitute a thank-offering. Besides the sacrifices, there were also offerings of corn, wine, fruit and oil.<P>7. Art:<P>What primitive Canaanitish art was like may be seen from the rude sculptures in the Wadi el-Kana near Tyre. Under Babylonian influence it rapidly developed. Among the Canaanite spoil captured by Thothmes III were tables, chairs and staves of cedar and ebony inlaid with gold or simply gilded, richly embroidered robes, chariots chased with silver, iron tent poles studded with precious stones, "bowls with goats\' heads on them, and one with a lion\'s head, the workmanship of the land of Zahi" (the Phoenician coast), iron armor with gold inlay, and rings of gold and silver that were used as money. At Taanach, gold and silver ornaments have been found of high artistic merit. To the Israelites, fresh from the desert, the life of the wealthy Canaanite would have appeared luxurious in the extreme.<P>8. Commerce:<P>The position of Canaan made it the meeting-place of the commercial routes of the ancient world. The fleets of the Phoenician cities are celebrated in the Tell el-Amarna Letters, and it is probable that they were already engaged in the purple trade. The inland towns of Canaan depended not only on agriculture but also on a carrying trade: caravans as well as "commercial travelers" (damgari) came to them from Cappadocia, Babylonia and Egypt. Bronze, silver, lead, and painted ware were brought from Asia Minor, together with horses; naphtha was exported to Babylonia in return for embroidered stuffs; copper came from Cyprus, richly chased vessels of the precious metals from Crete and corn from Egypt. Baltic amber has been found at Lachish, where a furnace with iron slag, discovered in the third Amorite city, shows that the native iron was worked before the age of the Israelite conquest. The manufacture of glass goes back to the same epoch. As far back as 2500 BC, alabaster and limestone had been sent to Babylonia from the quarries of the Lebanon.<P>9. Art of Writing:<P>Long before the age of Abraham the Babylonian seal-cylinder had become known and been imitated in Syria and Canaan. But it was not until Canaan had been made a Babylonian province under the Khammu-rabi dynasty that the cuneiform system of writing was introduced together with the Babylonian language and literature. Henceforward, schools were established and libraries or archive-chambers formed where the foreign language and its complicated syllabary could be taught and stored. In the Mosaic age the Taanach tablets show that the inhabitants of a small country town could correspond with one another on local matters in the foreign language and script, and two of the Tell el-Amarna letters are from a Canaanitish lady. The official notices of the name by which each year was known in Babylonia were sent to Canaan as to other provinces of the Babylonian empire in the cuneiform script; one of these, dated in the reign of Khammurabi\'s successor, has been found in the Lebanon.<P>LITERATURE.<P>H. Vincent, Canaan d\'apres l\'exploration recente, 1907; G. A. Smith, Historical Geography of the Holy Land, 1894; Publications of the Palestine Exploration Fund; E. Sellin, Tell Ta\'annek and Eine Nachlese auf dem Tell Ta\'annek, 1904-5; Schumacher, Tell Mutesellim, 1909; Thiersch, Die neueren Ausgrabungen in Palestina, 1908.`<a href="./study/isbe/search.html?string=ARKITE">ARKITE</a>; <a href="./study/isbe/search.html?string=ARVADITES">ARVADITES</a>; <a href="./study/isbe/search.html?string=BAAL">BAAL</a>; <a href="./study/isbe/search.html?string=GIRGASHITE">GIRGASHITE</a>; <a href="./study/isbe/search.html?string=HITTITES">HITTITES</a>; <a href="./study/isbe/search.html?string=HIVITE">HIVITE</a>; <a href="./study/isbe/search.html?string=JEBUSITE">JEBUSITE</a>; <a href="./study/isbe/search.html?string=KADMONITE">KADMONITE</a>; <a href="./study/isbe/search.html?string=KENIZZITE">KENIZZITE</a>; <a href="./study/isbe/search.html?string=PALESTINE">PALESTINE</a>; <a href="./study/isbe/search.html?string=PERIZZITE">PERIZZITE</a>; <a href="./study/isbe/search.html?string=REPHAIM">REPHAIM</a>; <a href="./study/isbe/search.html?string=SINITES">SINITES</a>; <a href="./study/isbe/search.html?string=TEMAN">TEMAN</a>`157';
isbe[1825]='Canaanitess`ka\'-nan-it-es.`<a href="./study/isbe/search.html?string=SHUA">SHUA</a>; <a href="./study/isbe/search.html?string=BATHSHUA">BATHSHUA</a>`1';
isbe[1826]='Canals`ka-nalz\' (ye\'orim): The word "canals" occurs in several places in the Revised Version, margin (<a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a>; <a onClick="return mV(\'Exd\',8,5);">8:5</a>; <a onClick="return mV(\'Isa\',19,6);">Isa 19:6</a>; <a onClick="return mV(\'Nah\',3,8);">Na 3:8</a>). ye\'or is an Egyptian word, the designation of the Nile (Brugsch, Geogr, I, 8, 78). The proper name of the Nile as a god was Hapi. There were several common designations of the Nile, but the usual one was ye\'or, Hebrew plural ye\'orim. The primary meaning of ye\'or in Egyptian is not certain, but its significance in use for the Nile is plain enough. All the waters in Egypt were of the Nile and this word ye\'or was used to denote all of them, the Nile and all its ramifications through the whole irrigating system. Thus ye\'orim, Niles, came to be used. As only the main channels of the Nile had much current, the ye\'orim came naturally to convey the idea of sluggishness. In the account of the plagues (<a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a>), names are used descriptively to designate the different waters of Egypt: neharoth, "flowing streams," for the main channels of the river, and ye\'orim for other streams, which by contrast must mean, as it should according to its use by the Egyptians, "the sluggish streams," i.e. "canals," as it is rendered by the Revisers. This meaning of the word being thus clearly established, it is appropriately used in the Revised Version, margin in the other instances of its occurrence in like circumstances.``93';

isbe[1828]='Candace`kan\'-da-se (Kandake): Queen of the Ethiopians (<a onClick="return mV(\'Act\',8,27);">Ac 8:27</a>). Pliny states that the name Candace had already been borne for many years by the queens of Ethiopia (vi, 29). See <a href="./study/isbe/search.html?string=ETHIOPIA">ETHIOPIA</a>. Her treasurer, "a eunuch of great authority," was baptized by Philip the Evangelist on his return from worshipping in Jerusalem.``1';
isbe[1829]='Candle; Candlestick`kan\'-d\'-l, kan\'-d\'-l-stik (ner; luchnos; menorah; luchnia):<P>(1) "Candle" is found in the Old Testament, the King James Version, as the rendering of ner, and in the New Testament for luchnos. In all places except <a onClick="return mV(\'Jer\',25,10);">Jer 25:10</a> and <a onClick="return mV(\'Zep\',1,12);">Ze 1:12</a> (see margin) the Revised Version (British and American) gives the more exact rendering "lamp." See <a href="./study/isbe/search.html?string=LAMP">LAMP</a>. Candle, in our sense of the term, was unknown to antiquity.<P>(2) "Candlestick" stands for what was a common and indispensable article of ancient house furniture, a lamp-stand (menorah). Accordingly we find it mentioned in a case thoroughly representative of the furnishings of an oriental room of the plainer sort, in the account of "the prophet\'s chamber" given in <a onClick="return mV(\'2Ki\',4,10);">2Ki 4:10</a>. Here we find that the furniture consisted of a "bed," a "table," a "seat," and a "candlestick," or lamp-stand. The excavations of Petrie and Bliss at Lachish (Tell el-Hesy, 104), not to mention others, help to make it clear that a lamp-stand is meant in passages where the Hebrew word, menorah, or its Greek equivalent luchnia, is used. Accordingly throughout the New Testament, the Revised Version (British and American) has consistently rendered luchnia by "stand" (<a onClick="return mV(\'Mat\',5,15);">Mt 5:15</a>; <a onClick="return mV(\'Mar\',4,21);">Mr 4:21</a>; <a onClick="return mV(\'Luk\',8,16);">Lu 8:16</a>; <a onClick="return mV(\'Luk\',11,33);">11:33</a>).<P>(3) The "candlestick" of <a onClick="return mV(\'Dan\',5,5);">Da 5:5</a> is rather the candelabrum (nebhrashta\') of Belshazzar\'s banqueting-hall. The "golden candlestick" of the tabernacle and the temple requires special treatment.<P>See <a href="./study/isbe/search.html?string=CANDLESTICK,+THE+GOLDEN">CANDLESTICK, THE GOLDEN</a>; <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>.<P>(4) Certain figurative uses of "candle" and "candlestick" in the Bible demand attention. The ancient and still common custom of the East of keeping a house lamp burning night and day gave rise to the figure of speech so universally found in oriental languages by which the continued prosperity of the individual or the family is set forth by the perennially burning lamp (see <a onClick="return mV(\'Job\',29,3);">Job 29:3</a>; "when his lamp shined upon my head"; <a onClick="return mV(\'Psa\',18,28);">Ps 18:28</a> "Thou wilt light my lamp"). The converse in usage is seen in many passages—(see <a onClick="return mV(\'Job\',18,6);">Job 18:6</a>; "His lamp above him shall be put out"; <a onClick="return mV(\'Job\',21,17);">21:17</a>: "How oft is it that the lamp of the wicked is put out"; <a onClick="return mV(\'Pro\',24,20);">Pr 24:20</a>; "The lamp of the wicked shall be put out"; <a onClick="return mV(\'Jer\',25,10);">Jer 25:10</a>; "Take from them...the light of the lamp"). The same metaphor is used in <a onClick="return mV(\'Rev\',2,5);">Re 2:5</a> to indicate the judgment with candlestick out of its place." "The seven golden candlesticks" (<a onClick="return mV(\'Rev\',1,20);">Re 1:20</a>) which John saw were "the seven churches," the appointed light-bearers and dispensers of the religion of the risen Christ. Hence, the significance of such a threat. George B. Eager which the church of Ephesus was threatened: "I will move thy candlestick out of its place." "The seven golden candlesticks" (<a onClick="return mV(\'Rev\',1,20);">Rev 1:20</a>) which John saw were "the seven dhurches," the appointed light-bearers and dispensers of the religion of the risen Christ. Hence the significance of such a threat.``47';
isbe[1830]='Candlestick, the Golden`kan\'-d\'-l-stik, gold\'-\'-n (menorah, literally "lamp-stand"): An important part of the furniture of the tabernacle and temples.<P>See <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>; <a href="./study/isbe/search.html?string=LAMP">LAMP</a>.<P>1. The Tabernacle:<P>The candlestick is first met with in the descriptions of the tabernacle (<a onClick="return mV(\'Exd\',25,\'31-39\');">Ex 25:31-39</a>; <a onClick="return mV(\'Exd\',37,\'17-24\');">37:17-24</a>). It was, with the utensils connected with it (snuffers, snuff dishes), to be made of pure beaten gold, of one piece, a talent in weight (<a onClick="return mV(\'Exd\',25,39);">Ex 25:39</a>). It consisted of a pedestal or base, of a central stem (the name "candlestick" is specially given to this), of six curving branches—three on each side—and of seven lamps resting on the tops of the branches and stem. Stem and branches were ornamented with cups like almond-blossoms, knops and flowers—four of this series on the stem, and three on each of the branches. Some, however, understand the "cup" to embrace the "knop" and "flower" (calyx and corolla). The shape of the pedestal is uncertain. Jewish tradition suggests three small feet; the representation of the candlestick on the Arch of Titus has a solid, hexagonal base. The position of the candlestick was on the south side of the holy place (<a onClick="return mV(\'Exd\',40,24);">Ex 40:24</a>).<P>2. Temple of Solomon:<P>In Solomon\'s temple the single golden candlestick was multiplied to ten, and the position was altered. The candlesticks were now placed in front of the Holy of Holies, five on one side, five on the other (<a onClick="return mV(\'1Ki\',7,49);">1Ki 7:49</a>; <a onClick="return mV(\'2Ch\',4,7);">2Ch 4:7</a>). Further details are not given in the texts, from which it may be presumed that the model of the tabernacle candlestick was followed.<P>3. Temple of Zerubbabel:<P>The second temple reverted to the single golden candlestick. When the temple was plundered by Antiochus Epiphanes, the candlestick was taken away (1Macc 1:21); after the cleansing, a new one was made by Judas Maccabeus (1Macc 4:49,50).<P>4. Temple of Herod:<P>The same arrangement of a single golden candlestick, placed on the south side of the holy place, was continued in Herod\'s Temple (Josephus, BJ, V, v, 5). It was this which, carried away by Titus, was represented on his Arch at Rome.<P>5. Use and Symbolism:<P>The immediate object of the candlestick was to give light in the holy place. The lamps were lighted in the evening and burned till the morning (<a onClick="return mV(\'Exd\',30,7,8);">Ex 30:7-8</a>; <a onClick="return mV(\'Lev\',24,3);">Le 24:3</a>; <a onClick="return mV(\'1Sa\',3,3);">1Sa 3:3</a>; <a onClick="return mV(\'2Ch\',13,11);">2Ch 13:11</a>), light being admitted into the temple during the day by the upper windows. Josephus in his Cosmical speculations (BJ, V, v, 5) takes the seven lamps to signify the seven planets. In Zechariah\'s vision of the golden candlestick (<a onClick="return mV(\'Zec\',4,2);">Zec 4:2</a>ff), the seven lamps are fed by two olive trees which are interpreted to be "the two anointed ones," Zerubbabel and Joshua—the civil and spiritual representatives of theocracy. The candlestick here, like the seven candlesticks in <a onClick="return mV(\'Rev\',1,20);">Re 1:20</a>; <a onClick="return mV(\'Rev\',2,1);">2:1</a>, symbolizes the church of God, then in its Old Testament form, the idea conveyed being that God\'s church is set to be a lightgiver in the world. Compare Christ\'s words (<a onClick="return mV(\'Mat\',5,14,16);">Mt 5:14, 16</a>; <a onClick="return mV(\'Luk\',12,35);">Lu 12:35</a>), and Paul\'s (<a onClick="return mV(\'Phl\',2,15);">Php 2:15</a>).<P>The oldest known representation of the seven-branched candlestick is on a coin of Antigonus, circa 40 BC (see Madden\'s Coins of the Jews, 102).`<a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>`132';

isbe[1833]='Canker-Worm`kan\'-ker-wurm (yeleq, (<a onClick="return mV(\'Joe\',1,4);">Joe 1:4</a>; <a onClick="return mV(\'Joe\',2,25);">2:25</a>; <a onClick="return mV(\'Nah\',3,15,16);">Na 3:15-16</a>)): The name given to a larval stage of the <a href="./study/isbe/search.html?string=LOCUST">LOCUST</a> (which see).`<a href="./study/isbe/search.html?string=CATERPILLAR">CATERPILLAR</a>`1';

isbe[1835]='Canneh`kan\'-e (kanneh; Chanaa): Mentioned in <a onClick="return mV(\'Eze\',27,23);">Eze 27:23</a> in connection with Haran and Eden as one of the places with which Tyre had commercial relations. This is the only reference to the place and the site is unknown. Gesenius and others think it is probably the same as Calneh of <a onClick="return mV(\'Amo\',6,2);">Am 6:2</a> or of <a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>, and Calno of <a onClick="return mV(\'Isa\',10,9);">Isa 10:9</a>. According to the Targums, Eusebius, and Jerome, this place is identical with Ctesiphon, which was situated on the Tigris. One codex of De Rossi has made this identification in the passage in <a onClick="return mV(\'Eze\',27,23);">Eze 27:23</a>. Cornill thinks Canneh is the Calneh of <a onClick="return mV(\'Amo\',6,2);">Am 6:2</a>, but Cheyne thinks the name is really non-existent. He says the words rendered "and Canneh and Eden" should rather be "and the sons of Eden."``62';
isbe[1836]='Canon of the New Testament`kan\'-un<P><b>I. TWO PRELIMINARY CONSIDERATIONS</b><P class="in15">1. Early Christians Had the Old Testament<P class="in15">2. No Intention of Writing the New Testament<P><b>II. THREE STAGES OF THE PROCESS</b><P class="in15">1. From the Apostles to 170 AD<P class="in30">(1) Clement of Rome; Ignatius; Polycarp<P class="in30">(2) Forces Increasing Value of Writings<P class="in60">(a) Apologists, Justin Martyr<P class="in60">(b) Gnostics, Marcion<P class="in15">2. From 170 AD to 220 AD<P class="in30">(1) Irenaeus<P class="in30">(2) Muratorian Fragment<P class="in15">3. 3rd and 4th Centuries<P class="in30">(1) Origen<P class="in30">(2) Dionysius<P class="in30">(3) Cyprian<P class="in30">(4) Eusebins<P class="in30">(5) Athanasius<P class="in30">(6) Council of Carthage; <P class="in30">Jerome; <P class="in30">Augustine<P>LITERATURE</b><hr /><P>I. Two Preliminary Considerations.<P>The canon is the collection of 27 books which the church (generally) receives as its New Testament Scriptures. The history of the canon is the history of the process by which these books were brought together and their value as sacred Scriptures officially recognized. That process was gradual, furthered by definite needs, and, though unquestionably continuous, is in its earlier stages difficult to trace. It is always well in turning to the study of it to have in mind two considerations which bear upon the earliest phases of the whole movement. These are:<P>1. Early Christians Had the Old Testament:<P>The early Christians had in their hands what was a Bible to them, namely, the Old Testament Scriptures. These were used to a surprising extent in Christian instruction. For a whole century after the death of Jesus this was the case. These Scriptures were read in the churches, and there could be at first no idea of placing beside them new books which could for a moment rank with them in honor and authority. It has been once and again discussed whether Christianity from the first was a "book-religion." The decision of the matter depends upon what is referred to by the word "book." Christianity certainly did have from the very beginning a book which it reverenced—the Old Testament—but years passed before it had even the beginnings of a book of its own. What has been called "the wealth of living canonical material," namely, prophets and teachers, made written words of subordinate value. In this very teaching, however, with its oral traditions lay the beginnings of that movement which was ultimately to issue in a canon of writings.<P>2. No Intention of Writing the New Testament:<P>When the actual work of writing began no one who sent forth an epistle or framed a gospel had before him the definite purpose of contributing toward the formation of what we call "the Bible." All the New Testament writers looked for "the end" as near. Their words, therefore, were to meet definite needs in the lives of those with whom they were associated. They had no thought of creating a new sacred literature. And yet these incidental occasional writings have come to be our choicest Scripture. The circumstances and influences which brought about this result are here briefly set forth.<P>II. Three Stages of the Process.<P>For convenience of arrangement and definiteness of impression the whole process may be marked off in three stages:<P>(1) that from the time of the apostles until about 170 AD;<P>(2) that of the closing years of the 2nd century and the opening of the 3rd (170-220 AD);<P>(3) that of the 3rd and 4th centuries. In the first we seek for the evidences of the growth in appreciation of the peculiar value of the New Testament writings; in the second we discover the clear, full recognition of a large part of these writings as sacred and authoritative; in the third the acceptance of the complete canon in the East and in the West.<P>1. From the Apostles to 170 AD:<P>(1) Clement of Rome; Ignarius; Polycarp:<P>The first period extending to 170 AD.—It does not lie within the scope of this article to recount the origin of the several books of the New Testament. This belongs properly to <a href="./study/isbe/search.html?string=NEW+Testament">New Testament Introduction</a> (which see). By the end of the 1st century all of the books of the New Testament were in existence. They were, as treasures of given churches, widely separated and honored as containing the word of Jesus or the teaching of the apostles. From the very first the authority of Jesus had full recognition in all the Christian world. The whole work of the apostles was in interpreting Him to the growing church. His sayings and His life were in part for the illumination of the Old Testament; wholly for the understanding of life and its issues. In every assembly of Christians from the earliest days He was taught as well as the Old Testament. In each church to which an epistle was written that epistle was likewise read. Paul asked that his letters be read in this way (<a onClick="return mV(\'1Th\',5,27);">1Th 5:27</a>; <a onClick="return mV(\'Col\',4,16);">Col 4:16</a>). In this attentive listening to the exposition of some event in the life of Jesus or to the reading of the epistle of an apostle began the "authorization" of the traditions concerning Jesus and the apostolic writings. The widening of the area of the church and the departure of the apostles from earth emphasized increasingly the value of that which the writers of the New Testament left behind them. Quite early the desire to have the benefit of all possible instruction led to the interchange of Christian writings. Polycarp (110 AD ?) writes to the Philippians, "I have received letters from you and from Ignatius. You recommend me to send on yours to Syria; I shall do so either personally or by some other means. In return I send you the letter of Ignatius as well as others which I have in my hands and for which you made request. I add them to the present one; they will serve to edify your faith and perseverance" (Epistle to Phil, XIII). This is an illustration of what must have happened toward furthering a knowledge of the writings of the apostles. Just when and to what extent "collections" of our New Testament books began to be made it is impossible to say, but it is fair to infer that a collection of the Pauline epistles existed at the time Polycarp wrote to the Php and when Ignatius wrote his seven letters to the churches of Asia Minor, i.e. about 115 AD. There is good reason to think also that the four Gospels were brought together in some places as early as this. A clear distinction, however, is to be kept in mind between "collections" and such recognition as we imply in the word "canonical." The gathering of books was one of the steps preliminary to this. Examination of the testimony to the New Testament in this early time indicates also that it is given with no intention of framing the canonicity of New Testament books. In numerous instances only "echoes" of the thought of the epistles appear; again quotations are incomplete; both showing that Scripture words are used as the natural expression of Christian thought. In the same way the Apostolic Fathers refer to the teachings and deeds of Jesus. They witness "to the substance and not to the authenticity of the Gospels." That this all may be more evident let us note in more detail the witness of the subapostolic age.<P>Clement of Rome, in 95 AD, wrote a letter in the name of the Christians of Rome to those in Corinth. In this letter he uses material found in Matthew, Luke, giving it a free rendering (see <span class="noTag">chapters 46 and 13</a>); he has been much influenced by the Epistle to the Hebrews (see chapters 9,10,17,19, 36). He knows Romans, Corinthians, and there are found echoes of 1 Timothy, Titus, 1 Peter and Ephesians.<P>The Epistles of Ignatius (115 AD) have correspondences with our gospels in several places (<a onClick="return mV(\'Eph\',5,\'1-\');">Eph 5</a>; <a onClick="return mV(\'Rom\',6,\'1-\');">Ro 6</a>; <a onClick="return mV(\'Rom\',7,\'1-\');">7</a>) and incorporate language from nearly all of the Pauline epistles. The Epistle to Polycarp makes large use of Phil, and besides this cites nine of the other Pauline epistles. Ignatius quotes from Matthew, apparently from memory; also from 1 Peter and 1 John. In regard to all these three writers—Clement, Polycarp, Ignatius—it is not enough to say that they bring us reminiscences or quotations from this or that book. Their thought is tinctured all through with New Testament truth. As we move a little farther down the years we come to "The Teaching of the Twelve Apostles" (circa 120 AD in its present form; see <a href="./study/isbe/search.html?string=DIDACHE">DIDACHE</a>); the Epistle of Barnabas (circa 130 AD) and the Shepherd of Hermas (circa 130 AD). These exhibit the same phenomena as appear in the writings of Clement, Ignatius and Polycarp as far as references to the New Testament are concerned. Some books are quoted, and the thought of the three writings echoes again and again the teachings of the New Testament. They bear distinct witness to the value of "the gospel" and the doctrine of the apostles, so much so as to place these clearly above their own words. It is in the Epistle of Barnabas that we first come upon the phrase "it is written," referring to a New Testament book (Matthew) (see Epis., iv.14). In this deepening sense of value was enfolded the feeling of authoritativeness, which slowly was to find expression. It is well to add that what we have so far discovered was true in widely separated parts of the Christian world as e. g. Rome and Asia Minor.<P>(2) Forces Increasing Value of Writings:<P>(a) Apologists, Justin Martyr:<P>The literature of the period we are examining was not, however, wholly of the kind of which we have been speaking. Two forces were calling out other expressions of the singular value of the writings of the apostles, whether gospels or epistles. These were<P>(a) the attention of the civil government in view of the rapid growth of the Christian church and<P>(b) heresy.<P>The first brought to the defense or commendation of Christianity the Apologists, among whom were Justin Martyr, Aristides, Melito of Sardis and Theophilus of Antioch. By far the most important of these was Justin Martyr, and his work may be taken as representative. He was born about 100 AD at Shechem, and died as a martyr at Rome in 165 AD. His two Apologies and the Dialogue with Trypho are the sources for the study of his testimony. He speaks of the "Memoirs of the Apostles called Gospels" (Ap., i.66) which were read on Sunday interchangeably with the prophets (i.67). Here emerges that equivalence in value of these "Gospels" with the Old Testament Scriptures which may really mark the beginning of canonization. That these Gospels were our four Gospels as we now have them is yet a disputed question; but the evidence is weighty that they were. (See Purves, Testimony of Justin Martyr to Early Christianity, Lect V.) The fact that Tatian, his pupil, made a harmony of the Gospels, i.e. of our four Gospels, also bears upon our interpretation of Justin\'s "Memoirs." (See Hemphill, The Diatessaron of Tatian.) The only other New Testament book which Justin mentions is the Apocalypse; but he appears to have known the Acts, six epistles of Paul, Hebrew and 1 John, and echoes of still other epistles are perceptible. When he speaks of the apostles it is after this fashion: "By the power of God they proclaimed to every race of men that they were sent by Christ to teach to all the Word of God" (Ap., i.39). It is debatable, however, whether this refers to more than the actual preaching of the apostles. The beginning of the formation of the canon is in the position and authority given to the Gospels.<P>(b) Gnostics, Marcion:<P>While the Apologists were busy commending or defending Christianity, heresy in the form of Gnosticism was also compelling attention to the matter of the writings of the apostles. From the beginning Gnostic teachers claimed that Jesus had favored chosen ones of His apostles with a body of esoteric truth which had been handed down by secret tradition. This the church denied, and in the controversy that went on through years the question of what were authoritative writings became more and more pronounced. Basilides e. g., who taught in Alexandria during the reign of Hadrian (AD 117-38), had for his secret authority the secret tradition of the apostle Matthias and of Glaucias, an alleged interpreter of Peter, but he bears witness to Matthew, Luke, John, Romans, 1 Corinthians, Ephesians, and Colossians in the effort to recommend his doctrines, and, what is more, gives them the value of Scripture in order to support more securely his teachings. (See Philosophoumena of Hippolytus, VII, 17). Valentinus, tracing his authority through Theodas to Paul, makes the same general use of New Testament books, and Tertullian tells us that he appeared to use the whole New Testament as then known.<P>The most noted of the Gnostics was Marcion, a native of Pontus. He went to Rome (circa 140 AD), there broke with the church and became a dangerous heretic. In support of his peculiar views, he formed a canon of his own which consisted of Luke\'s Gospel and ten of the Pauline epistles. He rejected the Pastoral Epistles, Heb, Matthew, Mark, John, the Acts, the Catholic epistles and the Apocalypse, and made a recension of both the gospel of Luke and the Pauline epistles which he accepted. His importance, for us, however, is in the fact that he gives us the first clear evidence of the canonization of the Pauline epistles. Such use of the Scriptures inevitably called forth both criticism and a clearer marking off of those books which were to be used in the churches opposed to heresy, and so "in the struggle with Gnosticism the canon was made." We are thus brought to the end of the first period in which we have marked the collection of New Testament books in greater or smaller compass, the increasing valuation of them as depositions of the truth of Jesus and His apostles, and finally the movement toward the claim of their authoritativeness as over against perverted teaching. No sharp line as to a given year can be drawn between the first stage of the process and the second. Forces working in the first go on into the second, but results are accomplished in the second which give it its right to separate consideration.<P>2. From 170 AD to 220 AD:<P>The period from 170 AD to 220 AD.—This is the age of a voluminous theological literature busy with the great issues of church canon and creed. It is the period of the great names of Irenaeus, Clement of Alexandria, and Tertullian, representing respectively Asia Minor, Egypt and North Africa. In passing into it we come into the clear light of Christian history. There is no longer any question as to a New Testament canon; the only difference of judgment is as to its extent. What has been slowly but surely shaping itself in the consciousness of the church now comes to clear expression.<P>(1) Irenaeus.<P>That expression we may study in Irenaeus as representative of the period. He was born in Asia Minor, lived and taught in Rome and became afterward bishop of Lyons. He had, therefore, a wide acquaintance with the churches, and was peculiarly competent to speak concerning the general judgment of the Christian world. As a pupil of Polycarp, who was a disciple of John, he is connected with the apostles themselves. An earnest defender of the truth, he makes the New Testament in great part his authority, and often appeals to it. The four Gospels, the Acts, the epistles of Paul, several of the Catholic epistles and the Apocalypse are to him Scripture in the fullest sense. They are genuine and authoritative, as much so as the Old Testament ever was. He dwells upon the fact that there are four gospels, the very number being prefigured in the four winds and the four quarters of the earth. Every attempt to increase or diminish the number is heresy. Tertullian takes virtually the same position (Adv. Marc., iv. 2), while Clement of Alexandria quotes all four gospels as "Scripture." By the end of the 2nd century the canon of the gospels was settled. The same is true also of the Pauline epistles. Irenaeus makes more than two hundred citations from Paul, and looks upon his epistles as Scripture (Adv. Haer., iii. 12, 12). Indeed, at this time it may be said that the new canon was known under the designation "The Gospel and the Apostles" in contradistinction to the old as "the Law and the Prophets." The title "New Testament" appears to have been first used by an unknown writer against Montanism (circa 193 AD). It occurs frequently after this in Origen and later writers. In considering all this testimony two facts should have emphasis:<P>(1) its wide extent: Clement and Irenaeus represent parts of Christendom which are widely separated;<P>(2) the relation of these men to those who have gone before them. Their lives together with those before them spanned nearly the whole time from the apostles.<P>They but voiced the judgment which silently, gradually had been selecting the "Scripture" which they freely and fully acknowledged and to which they made appeal.<P>(2) The Muratorian Fragment.<P>Just here we come upon the Muratorian Fragment, so called because discovered in 1740 by the librarian of Milan, Muratori. It dates from some time near the end of the 2nd century, is of vital interest in the study of the history of the canon, since it gives us a list of New Testament books and is concerned with the question of the canon itself. The document comes from Rome, and Lightfoot assigns it to Hippolytus. Its list contains the Gospels (the first line of the fragment is incomplete, beginning with Mark, but Matthew is clearly implied), the Acts, the Pauline epistles, the Apocalypse, 1 and 2 John (perhaps by implication the third) and Jude. It does not mention Hebrew, 1 and 2 Peter, James. In this list we have virtually the real position of the canon at the close of the 2nd century. Complete unanimity had not been attained in reference to all the books which are now between the covers of our New Testament. Seven books had not yet found a secure place beside the gospel and Paul in all parts of the church. The Palestinian and Syrian churches for a long time rejected the Apocalypse, while some of the Catholic epistles were in Egypt considered doubtful. The history of the final acceptance of these belongs to the third period.<P>3. 3rd and 4th Centuries:<P>(1) Origen:<P>The period included by the 3rd and 4th centuries—It has been said that "the question of the canon did not make much progress in the course of the 3rd century" (Reuss, History of the Canon of Holy Scripture, 125). We have the testimony of a few notable teachers mostly from one center, Alexandria. Their consideration of the question of the disputed book serves just here one purpose. By far the most distinguished name of the 3rd century is Origen. He was born in Alexandria about 185 AD, and before he was seventeen became an instructor in the school for catechumens. In 203 he was appointed bishop, experienced various fortunes, and died in 254. His fame rests upon his ability as an exegete, though he worked laboriously and successfully in other fields. His testimony is of high value, not simply because of his own studies, but also because of his wide knowledge of what was thought in other Christian centers in the world of his time. Space permits us only to give in summary form his conclusions, especially in regard to the books still in doubt. The Gospels, the Pauline epistles, the Acts, he accepts without question. He discusses at some length the authorship of He, believes that "God alone knows who wrote it," and accepts it as Scripture. His testimony to the Apocalypse is given in the sentence, "Therefore John the son of Zebedee says in the Revelation." He also gives sure witness to Jude, but wavers in regard to James, 2 Peter, 2 John, and 3 John.<P>(2) Dionysius:<P>Another noted name of this century is Dionysius of Alexandria, a pupil of Origen (died 265). His most interesting discussion is regarding the Apocalypse, which he attributes to an unknown John, but he does not dispute its inspiration. It is a singular fact that the western church accepted this book from the first, while its position in the East was variable. Conversely the Epistle to the Hebrews was more insecure in the West than in the East. In regard to the Catholic epistles Dionysius supports James, 2 John, and 3 John, but not 2 Peter or Jude.<P>(3) Cyprian:<P>In the West the name of Cyprian, bishop of Carthage (248-58 AD), was most influential. He was much engaged in controversy, but a man of great personal force. The Apocalypse he highly honored, but he was silent about the Epistle to the Heb. He refers to only two of the Catholic epistles, 1 Peter and 1 John.<P>These testimonies confirm what was said above, namely, that the end of the 3rd century leaves the question of the full canon about where it was at the beginning. 1 Peter and 1 John seem to have been everywhere known and accepted. In the West the five Catholic epistles gained recognition more slowly than in the East.<P>(4) Eusebius:<P>In the early part of the 4th century Eusebius (270-340 AD), bishop of Caesarea before 315, sets before us in his Church History (III, chapters iii-xxv) his estimate of the canon in his time. He does not of course use the word canon, but he "conducts an historical inquiry into the belief and practice of earlier generations." He lived through the last great persecution in the early part of the 4th century, when not only places of worship were razed to the ground, but also the sacred Scriptures were in the public market-places consigned to the flames (Historia Ecclesiastica, VIII, 2). It was, therefore, no idle question what book a loyal Christian must stand for as his Scripture. The question of the canon had an earnest, practical significance. Despite some obscurity and apparent contradictions, his classification of the New Testament books was as follows:<P>(1) The acknowledged books. His criteria for each of these was authenticity and apostolicity and he placed in this list the Gospels, Acts, and Paul\'s epistles, including He.<P>(2) The disputed books, i.e. those which had obtained only partial recognition, to which he assigned James, Jude, 2 Peter and 2 John. About the Apocalypse also he was not sure. In this testimony there is not much advance over that of the 3rd century. It is virtually the canon of Origen.<P>All this makes evident the fact that as yet no official decision nor uniformity of usage in the church gave a completed canon. The time, however, was drawing on when various forces at work were to bring much nearer this unanimity and enlarge the list of acknowledged books. In the second half of the 4th century repeated efforts were made to put an end to uncertainty.<P>(5) Athanasius:<P>Athanasius in one of his pastoral letters in connection with the publishing of the ecclesiastical calendar gives a list of the books comprising Scripture, and in the New Testament portion are included all the 27 books which we now recognize. "These are the wells of salvation," he writes, "so that he who thirsts may be satisfied with the sayings in these. Let no one add to these. Let nothing be taken away." Gregory of Nazianzen (died 390 AD) also published a list omitting Revelation, as did Cyril of Jerusalem (died 386), and quite at the end of the century (4th) Isidore of Pelusium speaks of the "canon of truth, the Divine Scriptures." For a considerable time the Apocalypse was not accepted in the Palestinian or Syrian churches. Athanasius helped toward its acceptance in the church of Alexandria. Some differences of opinion, however, continued. The Syrian church did not accept all of the Catholic epistles until much later.<P>(6) Council of Carthage, Jerome; Augustine:<P>The Council of Carthage in 397, in connection with its decree "that aside from the canonical Scriptures nothing is to be read in church under the name of Divine Scriptures," gives a list of the books of the New Testament. After this fashion there was an endeavor to secure unanimity, while at the same time differences of judgment and practice continued. The books which had varied treatment through these early centuries were He, the Apocalypse and the five minor Catholic epistles. The advance of Christianity under Constantine had much to do with the reception of the whole group of books in the East. The task which the emperor gave to Eusebius to prepare "fifty copies of the Divine Scriptures" established a standard which in time gave recognition to all doubtful books. In the West, Jerome and Augustine were the controlling factors in its settlement of the canon. The publication of the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) virtually determined the matter.<P>In conclusion let it be noted how much the human element was involved in the whole process of forming our New Testament. No one would wish to dispute a providential overruling of it all. Also it is well to bear in mind that all the books have not the same clear title to their places in the canon as far as the history of their attestation is concerned. Clear and full and unanimous, however, has been the judgment from the beginning upon the Gospels, the Acts, the Pauline epistles, 1 Peter and 1 John.<P>LITERATURE. Reuss, History of the Canon of Holy Scriptures; E. C. Moore, The New Testament in the Christian Church; Gregory, Canon and Text of the New Testament; Introductions to New Testament of Julicher, Weiss, Reuss; Zahn, Geschichte des Neutest. Kanons; Harnack, Das New Testament um das Jahr 200; Chronologie der altchristlichen Literatur; Westcott, The Canon of the New Testament; Zahn, Forschungen zur Gesch. des neutest. Kanons.``148';
isbe[1837]='Canon of the Old Testament, I`kan\'-un:<P><b>I. INTRODUCTORY</b><P class="in15">1. The Christian Term "Canon"<P class="in15">2. The Corresponding Hebrew Expression<P class="in15">3. The "Hidden Books" of the Jews<P class="in15">4. The Determining Principle in the Formation of the Canon<P class="in15">5. The Tripartite Division of the Old Testament<P class="in15">6. How Account for the Tripartite Division?<P><b>II. EXAMINATION OF THE WITNESSES</b><P class="in15">1. The Old Testament\'s Witness to Itself (circa 1450-444 BC)<P class="in15">2. The Samaritan Pentateuch (circa 432 BC)<P class="in15">3. The Septuagint Version (circa 250-150 BC)<P class="in15">4. Ecclesiasticus, or the Wisdom of Jesus ben Sirach (circa 170 BC)<P class="in15">5. The Prologue to Ecclesiasticus (circa 132 BC)<P class="in15">6. 1 and 2Maccabees (between 125 and 70 BC)<P class="in15">7. Philo (circa 20 BC-50 AD)<P class="in15">8. The New Testament as a Witness (circa 50-100 AD)<P class="in15">9. 4 Esdras (circa 81-96 AD)<P class="in15">10. Josephus\' "Contra Apionem" (circa 100 AD)<P class="in15">11. The Councils of Jamnia (90 and 118 AD)<P class="in15">12. The Talmud (200-500 AD)<P class="in15">13. Jewish Doubts in the 2nd Century AD<P class="in15">14. Summary and Conclusion<P><b>III. THE CANON IN THE CHRISTIAN CHURCH</b><P class="in15">1. In the Eastern or Oriental Church<P class="in15">2. In the Western Church<P><b>LITERATURE</b><hr /><P>I. Introductory.<P>The problem of how we came by 39 books known as Old Testament "Scripture" is a purely historical investigation. The question involved is, not who wrote the several books, but who made them into a collection, not their origin or contents, but their history; not God\'s part, but man\'s. Our present aim, accordingly, must be to trace the process by which the various writings became "Scripture."<P>1. The Christian Term "Canon":<P>The word "canon" is of Christian origin, from the Greek word kanon, which in turn is probably borrowed from the Hebrew word, qaneh, meaning a reed or measuring rod, hence, norm or rule. Later it came to mean a rule of faith, and eventually a catalogue or list. In present usage it signifies a collection of religious writings Divinely inspired and hence, authoritative, normative, sacred and binding. The term occurs in <a onClick="return mV(\'Gal\',6,16);">Ga 6:16</a>; <a onClick="return mV(\'2Cr\',10,\'13-16\');">2Co 10:13-16</a>; but it is first employed of the books of Scripture in the technical sense of a standard collection or body of sacred writings, by the church Fathers of the 4th century; e. g. in the 59th canon of the Council of Laodicea (363 AD); in the Festal Epistle of Athanasius (365 AD); and by Amphilochius, archbishop of Iconium (395 AD).<P>2. The Corresponding Hebrew Expression:<P>How the ancient Heb expressed the conception of canonicity is not known; but it is safe to say that the idea, as an idea, existed long before there was any special phrase invented to express it. In the New Testament the word "Scriptures" conveys unquestionably the notion of sacredness (<a onClick="return mV(\'Mat\',21,42);">Mt 21:42</a>; <a onClick="return mV(\'Jhn\',5,39);">Joh 5:39</a>; <a onClick="return mV(\'Act\',18,24);">Ac 18:24</a>). From the 1st century AD and following, however, according to the Talmud, the Jews employed the phrase "defile the hands." Writings which were suitable to be read in the synagogue were designated as books which "defile the hands." What this very peculiar oriental expression may have originally signified no one definitely knows. Probably <a onClick="return mV(\'Lev\',16,24);">Le 16:24</a> gives a hint of the true interpretation. According to this passage the high priest on the great Day of Atonement washed not only when he put on the holy garments of his office, but also when he put them off. Quite possibly, therefore, the expression "defile the hands" signified that the hands which had touched the sacred writings must first be washed before touching aught else. The idea expressed, accordingly, was one akin to that of taboo. That is to say, just as certain garments worn by worshippers in encircling the sacred Kaaba at Mecca are taboo to the Mohammedans of today, i.e. cannot be worn outside the mosque, but must be left at the door as the worshippers quit the sanctuary, so the Hebrew writings which were fit to be read in the synagogue rendered the hands of those who touched them taboo, defiling their hands, as they were wont to say, so that they must first be washed before engaging in any secular business. This seems to be the best explanation of this enigmatical phrase. Various other and somewhat fanciful explanations of it, however, have been given: for example, to prevent profane uses of worn-out synagogue rolls (Buhl); or to prevent placing consecrated grain alongside of the sacred rolls in the synagogues that it might become holy, as the grain would attract the mice and the mice would gnaw the rolls (Strack, Wildeboer and others); or to prevent the sacred, worn-out parchments from being used as coverings for animals (Graetz); or to "declare the hands to be unclean unless previously washed" (Furst, Green). But no one of these explanations satisfies. The idea of taboo is more likely imbedded in the phrase.<P>3. The "Hidden Books" of the Jews:<P>The rabbins invented a special phrase to designate rolls that were worn- out or disputed. These they called genuzim, meaning "hidden away." Cemeteries filled with Hebrew manuscripts which have long been buried are frequently found today in Egypt in connection with Jewish synagogues. Such rolls might first be placed in the genizah or rubbish chamber of the sanctuary. They were not, however, apocryphal or uncanonical in the sense of being extraneous or outside the regular collection. For such the Jews had a special term cepharim chitsonim, "books that are outside." These could not be read in the synagogues. "Hidden books" were rather worn-out parchments, or canonical rolls which might by some be temporarily disputed.<P>See <a href="./study/isbe/search.html?string=APOCRYPHA">APOCRYPHA</a>.<P>4. The Determining Principle in the Formation of the Canon:<P>Who had the right to declare a writing canonical? To this question widely divergent answers have been given. According to a certain class of theologians the several books of the Old Testament were composed by authors who were conscious not only of their inspiration but also that their writings were destined to be handed down to the church of future generations as sacred. In other words each writer canonized, as it were, his own writings. For example, Dr. W. H. Green (Canon, 35 f, 106, 110) says: "No formal declaration of their canonicity was needed to give them sanction. They were from the first not only eagerly read by the devout but believed to be Divinely obligatory...Each individual book of an acknowledged prophet of Yahweh, or of anyone accredited as inspired by Him to make known His will, was accepted as the word of God immediately upon its appearance....Those books and those only were accepted as the Divine standards of their faith and regulative of their conduct which were written for this definite purpose by those whom they believed to be inspired of God. It was this which made them canonical. The spiritual profit found in them corresponded with and confirmed the belief in their heavenly origin. And the public official action which further attested, though it did not initiate, their canonicity, followed in the wake of the popular recognition of their Divine authority....The writings of the prophets, delivered to the people as a declaration of the Divine will, possessed canonical authority from the moment of their appearance....The canon does not derive its authority from the church, whether Jewish or Christian; the office of the church is merely that of a custodian and a witness." So likewise Dr. J. D. Davis (Pres. and Ref. Review, April, 1902, 182).<P>On the contrary, Dillmann (Jahrb. fur deutsche Theol., III, 420) more scientifically claims that "history knows nothing of the individual books having been designed to be sacred from their origin....These books bore indeed in themselves from the first those characteristics on account of which they were subsequently admitted into the sacred collection, but yet always had first to pass through a shorter or longer period of verification, and make trial of the Divine power resident within them upon the hearts of the church before they were outwardly and formally acknowledged by it as Divine books." As a matter of fact, the books of the Old Testament are still on trial, and ever will be. So far as is known, the great majority of the writers of Holy Scripture did not arbitrarily hand over their productions to the church and expect them to be regarded as canon Scripture. Two parties are involved in the making of canonical Scripture—the original authors and the church—both of whom were inspired by the same Spirit. The authors wrote inspired by the Divine Spirit, and the church ever since—Jewish and Christian alike—has been inspired to recognize the authoritative character of their writings. And so it will be to the end of time. "We cannot be certain that anything comes from God unless it bring us personally something evidently Divine" (Briggs, The Study of Holy Scripture, 162).<P>5. The Tripartite Division of the Old Testament:<P>The Jews early divided the Old Testament writings into three classes:<P>(1) the Torah, or Law;<p>(2) the Nebhi\'im, or Prophets; and<P>(3) the Kethubhim, or Writings, called in Greek the Hagiographa.<P>The Torah included the 5 books of the Pentateuch (Genesis, Exodus, Leviticus, Numbers, Deuteronomy), which were called "the Five-fifths of the Law." The Nebhi\'im embraced<P>(a) the four so-called Former Prophets, Joshua, Judges, 1 and 2 Samuel, counted as one book, 1 and 2 Kings, also counted as one book; and<P>(b) the four so-called Latter Prophets, Isaiah, Jeremiah, Ezekiel, and the Twelve Minor Prophets, counted as one book; a total of 8 books.<P>The Kethubhim, or Writings, were 11 in all, including Psalms, Proverbs, and Job, the five Meghilloth or Rolls (Canticles, Ruth, Lamentations, Ecclesiastes, Esther), Daniel, Ezra-Nehemiah, counted as one book, and 1 and 2 Chronicles, also counted as one book; in all 24 books, exactly the same as those of the Protestant canon. This was the original count of the Jews as far as we can trace it back. Later certain Jewish authorities appended Ruth to Judges, and Lamentations to Jeremiah, and thereby obtained the <span class="noTag">number 22</span>, which corresponded to the number of letters in the Hebrew alphabet; but this manner of counting was secondary and fanciful. Still later others divided Samuel, Kings, Chronicles, Ezra-Nehemiah and Jeremiah-Lamentations into two books each respectively and thereby obtained 27, which they fancifully regarded as equivalent to the 22 letters of the Hebrew alphabet plus 5, the number of letters having a peculiar final form when standing at the end of a word. Jerome states that 22 is the correct reckoning, but he adds, "Some count both Ruth and Lamentations among the Hagiographa, and so get 24." 4Esdras, which is the oldest (85-96 AD) witness to the number of books in the Old Testament, gives 24.<P>6. How Account for the Tripartite Division?:<P>The answer to the question of how to account for the tripartite division involves the most careful investigation of the whole process by which the canon actually took shape. If the entire canon of the Old Testament were formed, as some allege, by one man, or by one set of men, in a single age, then it is obvious that the books must have been separated into three groups on the basis of some material differences in their contents. If, on the other hand; the process of canonization was gradual and extended over several generations, then the various books were separated from one another probably because one section of the canon was closed before certain other books of similar character were written. At any rate it is difficult to see why Kings and Chronicles are not included in the same division, and especially strange that Daniel does not stand among the prophets. To explain this mystery, medieval Jews were wont to say that "the Prophets were inspired by the spirit of prophecy, whereas the Writings by the Holy Spirit," implying different degrees of inspiration. But this is a distinction without a difference, the Holy Spirit and the spirit of prophecy are one and the same. Modern Protestants distinguish between the donum propheticum and the munus propheticum, i.e. between the gift and the office of prophecy. They allow that Daniel possessed the gift of prophecy, but they deny that he was Divinely appointed to the office of prophet. But compare <a onClick="return mV(\'Mat\',24,15);">Mt 24:15</a>, which speaks of "Daniel the prophet," and on the other hand, <a onClick="return mV(\'Amo\',7,14);">Am 7:14</a>, in which Amos resents being considered a prophet. Oehler modifies this explanation, claiming that the threefold division of the canon corresponds to the three stages of development in the religion of Israel, namely, Mosaism, Prophetism, and Hebraism. According to Oehler, the Law was the foundation of the entire canon. From it there were two lines of development, one objective, the Prophets, the other subjective, the Writings. But Oehler\'s theory does not satisfactorily account for Ezra and Nehemiah and Chronicles, being in the third division; for in what sense can they be said to be more subjective than Judges, Samuel, and Kings? The Septuagint version (250-150 BC) takes no notice of the tripartite division. The true solution probably is that the process was gradual. When all the witnesses have been examined, we shall probably discover that the Law was canonized first, the Prophets considerably later, and the Writings last of all. And it may further become evident that the two last divisions were collected synchronously, and hence, that the tripartite divisions of the canon are due to material differences in their contents as well as to chronology.``152';
