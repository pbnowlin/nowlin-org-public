and ninety cubits from Nemitti-Enlil lay, as the king says, the principal wall, Imgur-Enlil, and in order to guarantee the former against attack, he built two strong embankments, and an outer wall "like a mountain," with a great building between which served both as a fortress and a palace, and attached to the old palace built by his father. According to Nebuchadrezzar\'s account, which is confirmed by Berosus (as quoted by Josephus and Eusebius), all this work was completed in 15 days. The decorations were like those of the other palace, and blocks of alabaster, brought, apparently, from Assyria, strengthened the battlements. Other defenses surrounded this stronghold.<P>13. The Temples Restored by Nebuchadrezzar:<P>Among the temples which Nebuchadrezzar restored or rebuilt may be mentioned E-kua, the shrine of Merodach within E-sagila (the temple of Belus); the sanctuary called Du-azaga, the place of fate, where, on every New-Year\'s festival, on the 8th and 9th of Nisan, "the king of the gods of heaven and earth" was placed, and the future of the Babylonian monarch and his people declared. Every whit as important as E-sagila, however, was the restoration of E-temen-an-ki, called "the Tower of Babylon" (see <a href="./study/isbe/search.html?string=BABEL,+TOWER+OF">BABEL, TOWER OF</a>), within the city; and connected, as will be seen from the plan, with that structure. Among the numerous temples of Babylon which he rebuilt or restored were E-mah, for the goddess Nin-mah, near the Ishtar-gate; the white limestone temple for Sin, the Moon-god; E-ditur-kalama, "the house of the judge of the land," for Samas, the Sun-god; E-sa-tila for Gula, the goddess of healing; E-hursag-ella, "the house of the holy mountain," etc.<P>14. The Extent of Nebuchadrezzar\'s Architectural Work:<P>The amount of work accomplished by this king, who, when walking on the roof of his palace, lifted up with pride, exclaimed "Is not this great Babylon, which I have built?" (<a onClick="return mV(\'Dan\',4,30);">Da 4:30</a>), was, according to his own records and the Greek writers, enormous, and the claim he made fully justified. But if he boasts of the work he did, he is just in attributing much to his father Nabopolassar; though in connection with this it is to be noted that his ascribing the building of the walls of Babylon to his father is not to be taken literally in all probability he only restored them, though he may have added supplementary defenses, as Nebuchadrezzar himself did.<P>15. Details Concerning the City from Contract-Tablets:<P>Besides Nebuchadrezzar\'s inscriptions, various other texts give details concerning the topography of Babylon, among them being the contract-tablets, which mention various districts or quarters of the city, such as Te which is within Babylon; the city of Sula which is within Babylon; the new city which is within Babylon, upon the new canal. Within the city were also several Hussetu—perhaps "farms," such as Hussetu sa Iddina-Marduk, "Iddina-Marduk\'s farm," etc. The various gates are also referred to, such as the gate of Samas, the city-gate of Uras, and the gate of Zagaga, which seems to have lain in "the province of Babylon," and had a field in front of it, as had also the gate of Enlil.<P>16. Details Concerning Babylon from Other Sources:<P>According to an Assyrian and a Babylonian list of gates, the streets bore names connected with those of the gates to which they led. Thus, the street of the gate of Zagaga, one of the gods of war, was called "the street of Zagaga, who expels his enemies"; that of the gate of Merodach was "the street of Merodach, shepherd of his land"; while the street of Ishtar\'s gate was "the street of Ishtar, patron of her people." The city-gates named after Enlil, Addu (Hadad or Rimmon), Samas the Sun- god, Sin the Moon-god, etc., had streets similarly indicated. Certain of the streets of Babylon are also referred to on the contract-tablets, and such descriptive indications as "the broad street which is at the southern gate of the temple E-tur- kalama" seem to show that they were not in all cases systematically named. If the streets of Babylon were really, as Herodotus states, straight, and arranged at right angles, this was probably outside the walls of the ancient (inner) city, and most likely due to some wise Babylonian king or ruler. Details of the streets have been obtained at the point called Merkes (sec. 22) and elsewhere, and seem to show that the BabyIonians liked the rooms of their houses to be square. Such streets as slanted were therefore full of rectangles, and must have presented a quite peculiar appearance.<P>17. Modern Exploration:<P>It is this inner city which has most attracted the attention of explorers, both English and German, and it is on its site that the latter have carried on their systematic excavations. Indeed, it is probable that the houses of the most numerous class of the people—artisans, merchants, workmen, etc—lay outside the walls to which the Babylonian royal inscriptions refer. It may be supposed that the houses in this district were mainly low buildings of unbaked city (of which, indeed, portions of the temples and palaces were built), and these would naturally disappear more easily than if they had been built of baked brick. Even when baked, however, the brick-built ruins of Babylonia Assyria have a tendency to disappear, owing to the value which bricks, both baked and unbaked, have for the erection of new houses in the neighborhood. Concerning the extent of the exterior city much doubt naturally exists, but it may well have covered the tract attributed to it (see section 3, above). Nineveh, at the time of its prosperity, also had enormous suburbs (see <a href="./study/isbe/search.html?string=NINEVEH">NINEVEH</a>).<P>18. Description of the Ruins—The Eastern Walls:<P>The ruins of Babylon lie between 80 and 90 kilometers (50 miles or less) from Bagdad. The first thing seen on approaching them is the broad high ridge of Babil, which marks the site of the ruins of the Northern Palace. After some time, the ruins of the ancient walls are reached. They are still several yards high, and slope down gently to the plain. Starting to the north of Babil, the wall stretches for about 875 yds. due east, and then runs southwards for another 930 yds., taking at that point a course to the southeast for about 2 miles 160 yds. (3,300 meters). A wide gap occurs here, after which it runs to the southwest, and is lost in the open fields at the end of about miles (2 kilometers). "That this is the old citywall," says Weissbach, "there can be no doubt, and the name Sur, \'city-wall,\' given it by the Arabs, proves that they have fully recognized its nature." At the northern end it exists in its original extent, the plain out of which it rises being the old bed of the Euphrates, which, in the course of the centuries, has become filled up by the desertsand. At the period of Babylon\'s glory, the river had a much straighter course than at present, but it reoccupies its old bed about 600 meters (656 yds.) south of Babil, leaving it afterward to make a sharp bend to the west. From the point where the city wall first becomes recognizable on the north to its apparent southernmost extremity is about 3 miles.<P>19. The Western Walls:<P>On the west side of the river the traces of the wall are much less, the two angles, with the parts adjoining them, being all that is recognizable. Beginning on the north where the Euphrates has reached its midpoint in its course through the city, it runs westward about 547 yds. (500 meters) west-southwest, and then, bending almost at a right angle south-southeast, turns east again toward the Euphrates, but is lost in the plain before reaching the river. The distance of the two angles from each other is about 1 mile, 208 yds. (1,800 meters), and its distance from the Euphrates is at most 5/8 of a mile (1 kilometer). The western portion of the city therefore formed a rectangle with an area of about 1.8 miles, and the eastern quarter, with the projection on the North, 6 1/4 square miles. According to Fried. Delitzsch, the size of Babylon was about the same as Munich or Dresden. This, of course, is an estimate from the extant remains—as has been indicated above, there was probably a large suburban extension beyond the walls, which would account for the enormous size attributed to the city by the ancients.<P>20. The Palaces:<P>Among the Arabs, the northern ruin is called Babil, though it is only the remains of a palace. Its present height <span class="noTag">is</a> 30</a> meters (98 feet, 5 inches), and its rectangular outline is still easily recognizable. Its sides face the cardinal points, the longest being those of the north and south. This building, which measures 100 meters (109 yds.), was well protected by the city wall on the north and east, the Euphrates protecting it on the west. Continuing to the south, the path at present leads through orchards and palm-groves, beyond which is a rugged tract evidently containing the remains of ancient structures, probably of inconsiderable height. After further palm groves, an enormous ruin is encountered, steep on the east and south, sloping on the north and west. This is the Gasr (Qasr), also called Emjellibeh (Mujellibah), "the overturned," identical with the great palace of Nabopolassar and his son Nebuchadrezzar, referred to so prominently by the latter king in his records. Its longest side skirts the old Euphrates bed, and measures 300 meters (328 yds.). Its surface is very uneven, projections of 15 meters (over 49 ft.) alternating with deep depressions. On the Northwest side enormous walls of exceedingly hard yellow brick still tower to a considerable height. South of this the plain, broken only by a few inconsiderable mounds, extends for a distance of half a kilometer (5/16 mile), and terminates on the south with another enormous ruin-mound, called Ishan Amran ibn \'Ali. It measures 600 meters (656 yds.) from north to south, and 400 (437 yds.) from east to west, its average height being 25 meters (82 ft.). About the middle, and close to each other, are two Moslem domed tombs, the first called Ibrahim al-Khalil ("Abraham the Friend" (of God)—probably a late addition to the name of another Abraham than the Patriarch), and the other Areran ibn \'Ali, from which the ruin receives its modern name.<P>21. The Site of Babylon\'s Great Tower:<P>Near the south termination of the plain on which the village of Jim-jimeh lies, there is a square depression several yards deep, measuring nearly 100 meters (over 100 yds.) each way. In the middle of this depression, the sides of which do not quite face the cardinal points, there rises, to a height of about 13 ft., a platform of sun-dried brick about 60 meters (197 ft.) each way, its sides being parallel with the outer boundary of the depression. This depression, at present called Sahan, "the dish," is partly filled with foundation-water. Centered in its southern side is a rectangular hollowing-out similarly formed, about 50 meters (164 ft.) long, extending toward the ruin called Areran.<P>22. The Central and Southern Ruins:<P>East of the Qasr and Emjellibeh are several mounds bearing the name of Ehmereh, so called from the principal mound on the southeast, named Ishan al-Oheimar, "the red ruin," from the color of its bricks. Close to the southeast corner of the Qasr lies the ruin called Merkes, "the central-point," and to the south of that again is a long and irregularly shaped mound bearing the name of Ishan al-Aswad, "the black ruin." From this enumeration of the principal remains on the site of Babylon, it will be easily seen that public buildings in this, the most ancient quarter of the city, were exceedingly numerous. Indeed, the district was regarded as being of such importance that the surrounding walls were not thought altogether sufficient to protect it, so another seemingly isolated rampart, on the east, was built, running north and south, as an additional protection. The remains on the western side of the river are insignificant, the changed course of the river being in all probability responsible for the destruction of at least some of the buildings.<P>23. A Walk through Babylon:<P>There is much work to be done before a really complete reconstruction of the oldest quarter of Babylon can be attempted; but somc thing may be said about the sights to be seen when taking a walk through the more interesting portion, which, as we know from Herodotus\' narrative, could be visited by strangers, though it is possible that permission had to be obtained beforehand. Entering by the Urash-gate, some distance to the east of the Euphrates, one found oneself in Aa-ibursabu, the Festival-street, which was a continuation of the royal roadway without the inner wall, coming from the south. This street ran alongside the Arahtu canal, on its western bank. After a time, one had the small temple of Ninip on the right (on the other side of the canal), and E-sagila, the great temple of Belus, on the left. This celebrated shrine was dedicated to Merodach and other deities associated with him, notably his spouse Zer-panitum (= Juno), and Nebo, "the teacher," probably as the one who inculcated Merodach\'s faith. The shrine of Merodach therein, which was called E-kua, is said by Nebuchadrezzar to have been magnificently decorated, and into the temple itself that king had caused to be brought many costly gifts, acquired by him in the lands over which he had dominion. Connected with E-sagila on the Northwest by a causeway and probably a staircase, was the great temple-tower E-temen-an-ki, which, as is indicated above, is not now represented by a tower, but by a depression, the bricks having been employed, it is said, to repair the Hindiyeh canal. This great building was a striking monument of the city, and must have been visible for a considerable distance, its height being something over 300 ft. The stages of which it was composed are thought to have been colored like those of the similar tower laid bare by the French excavations at Khorsabad (DurSarru-ukin) in Assyria. Causeways or streets united this building with Aa-ibur-sabu, the festival-street along which the traveler is supposed to be proceeding. Continuing to the North, the visitor crossed a canal at right angles, named Libilhegalli, "may he (the god) bring fertility," and found himself immediately opposite the royal palace—the extensive building now known as the Qasr. According to Weissbach, its area occupied no less than 4 1/2 hectares (rather more than 11 acres) and it was divided, as we know from the inscriptions of Nebuchadrezzar, into two parts, connected by a corridor. The building was richly decorated, as the Babylonians understood such things, the interior walls being lined with enameled brick and other material.<P>Passing along the eastern side of the palace, the visitor came to the Ishtar-gate—a massive doorway faced with enameled brick in Nebuchadrezzar\'s time, and decorated with colored enameled reliefs of the lion, the bull and the dragon of Babylon. On the right of this gateway was to be seen the temple of the goddess Nin-mah, Merodach\'s spouse—a temple of sun-dried brick with traces of white coloring. It was a celebrated shrine of the Babylonians, in the usual architectural style with recessed buttresses, but modest from our modern point of view. Nin-mah was the goddess of reproduction, who, under the name of Aruru, had aided Merodach to create mankind, hence the honor in which she was held by the Babylonians.<P>24. The Ishtar-Gate and the Middle Palace:<P>The Ishtar-gate was apparently a part of the more ancient fortifications of Babylon, but which portion of the primitive city it enclosed is doubtful. In the time of Nebuchadrezzar it pierced the continuation, as it were, of the wall on the western bank of the river. Passing through this gateway, the visitor saw, on the west, the "middle-palace," an enormous structure, built by Nebuchadrezzar, as he boasts, in 15 days—a statement which seems somewhat of an exaggeration, when we come to consider the massiveness of the walls, some of which have a thickness of several yards. He describes this as having been "a fortress" (duru), "mountainlike" (sadanis), and on its summit he built an abode for himself—a "great palace," which was joined with his father\'s palace on the south of the intervening wall. It is possibly this latter which was built in 15 days&mdash;not the whole structure, including the fortress. It was raised "high as the forests," and decorated with cedar and all kinds of costly woods, its doors being of palm, cedar, cypress, ebony(?) and ivory, framed in silver and gold, and plated with copper. The thresholds and hinges of its gates were bronze, and the cornice round its top was in (an imitation of) lapis-lazuli. It was a house for men to admire; and it is not improbable that this was the palace upon which he was regarded as having been walking when he referred to "great Babylon," which he had built.<P>25. The Festival-Street:<P>But the street Aa-ibur-sabu, along which the visitor is conceived to be walking, was also a highly decorated causeway, fitted for the pathway of the great gods. Its width varied from 11 to 22 yds., and it was paved with regularly hewn and fitted natural stones—limestone and a brownish-red stone with white veins—while its walls were provided with a covering of brick enameled in various colors with representations of lions, some of them in relief. The inscriptions which it bore were white on a rich dark-blue ground, also enameled. There were various other streets in Babylon, but these have still to be identified.<P>26. The Chamber of the Fates:<P>At the end of the Procession-street, and at right angle to it, was the Merodach canal, which communicated directly with the Euphrares. At this point also, and forming its end-portion, was the Chamber of Fates (Patak simate), where, yearly, the oracles were asked and declared. In close connection with this was the Temple of Offerings (Bit nike) or festival-house (Bit akiti). Concerning these places more information is needed, but it would seem that, before Nebuchadrezzar\'s time, the Chamber of Fates was simply decorated with silver—he, however, made it glorious with pure gold. It is at this point that the Procession-street is at its widest. The position of the Temple of Offerings is at present uncertain.<P>27. The Northern Palace and the Gardens:<P>What may have lain on the other side of the Arabtu-canal, which here made a bend to the Northwest, and flowed out of the Euphrates somewhat higher up, is uncertain; but in the extreme north of the city was the palace now represented by the ruin called Babil. This was likewise built by Nebuchadrezzar, but it may be doubted whether it was really founded by him. The presence of traces of wells here made Hormuzd Rassam think that this was probably the site of the Hanging Gardens, but further exploration is needed to decide the point, though it may be regarded as not unlikely that this identification is correct. In that case it would represent the palace shown in the Assyrian saloon at the British Museum—a building apparently protected by three walls, and adorned with columns resting on the backs of lions in an attitude of walking. On the adjoining slab is a representation of a small building—also with columns—on a hill. A figure of a king sculptured on a stele is seen on the left, with an altar in front of it, showing that divine honors were paid to him. The hill is thickly wooded with trees which may be olives, poplars, etc., and on the right is a series of arches on which other trees are planted. Irrigation channels stretch in a long stream to the left and in shorter streams to the right. As this belongs to the time of Ashur-bani-apli, about 650 BC, and refers to that king\'s operations against his brother Samas-sum-ukin, the king of Babylon, it is clear that something similar to the Hanging Gardens existed before the time of Nebuchadrezzar, and therefore, if it was his queen who had them made, before the time of their reputed founder. This would be the point first reached by the Assyrian army when advancing to the attack. Such a park as is represented here with its hills and streams, and thickly planted trees, must have made the palace in the vicinity the pleasantest, in all probability, in all Babylonia, and excited the admiration of every one who visited the sights of the city.<P>28. Historical References to Babylonian Buildings:<P>The architectural history of the city of Babylon has still to be written, but something is already known about it, especially its central point of interest, the great temple E-sagila, wherein Merodach was wor shipped. The 5th year of Sumu- la-ila was known as that in which the great fortress of Babylon was built; and his 22nd was that in which a throne of gold and silver was completed and made for Merodach\'s supreme abode (paramaha). Later on Abil-Sin, in his 17th year, made a throne(?) for Samash of Babylon; and Hammu-rabi, in his 3rd, 12th and 14th years, also made thrones for the gods—Nannar of Babylon (the Moon-god), Zer-panitum, Merodach\'s consort, and Ishtar of Babylon. Samsuiluna, his son, in his 6th year, placed a "praying statue" in E-sagila before Merodach, followed, in his 8th, by the dedication of some bright-shining object (mace?) of gold and silver, to the god; and on that occasion it is stated that he made E-sagila to shine like the stars of heaven. Passing over many other references to kings who adorned the temples of the city, the work done there by Agukakrime (circa 1480 BC) may be mentioned. This ruler, who belonged to the Kassite dynasty, not only brought back the images of Merodach and Zer-panitum to their temple, but also restored the building and its shrine, and made rich offerings thereto. Later on, after the destruction of the city by Sennacherib, his son Esarhaddon, and his grandsons Samas-sum-ukin, king of Babylon, and Ashurbani-apli, king of Assyria, all took part in the restoration of Babylon\'s temples and palaces. The work of Nabopolassar and Nebuchadrezzar has already been referred to. In 330 BC (reign of Alexander the Great), an attempt was made, by the tithes of the pious, to clear away the rubbish around E-sangil (E-sagila), but to all appearance no real restorations were made—or, at least, the stage at which they could have been put in hand was not reached. In the year 269 BC Antiochus Soter claims, like Nebuchedrezzar and other Babylonian kings, to have restored the temples E-sagila and E-zida (the latter at Borsippa). Though in late times the temples were more or less dilapidated, the services to all appearance continued to be performed, and may even have gone on until well in the Christian era, Babylonian religion and philosophy being still held in honor as late as the 4th century. The downfall of Babylon as a city began with the founding of Seleucia on the Tigris, in the reign of Seleucus Nicator (after 312 BC). The inhabitants of Babylon soon began to migrate to this new site, and the ruined houses and walls of the old capital ultimately became the haunts of robbers and outlaws. It is said that the walls were demolished by later (Seleucid) kings on that account, and it is not improbable that, with the walls, any houses which may have remained habitable were cleared away. Fortunately, the palaces restored by Nebuchadrezzar were too firmly built to be easily demolished, hence their preservation to the present day.<P>LITERATURE.<P>Fried. Delitzsch, Babel and Bible. 1903; French H. Weissbach, Das Stadtbild von Babylon, 1904; R. Koldeway, Die Tempel von Babylon und Borsippa. 1911.``136';
isbe[1073]='Babel, Tower of`This expression does not occur in the Old Testament, but is used popularly for the tower mighdol built by the inhabitants of the world who, traveling in the east, built a city on the Plain of Shinar, with a tower "whose top may reach unto heaven"—an expression which is regarded as meaning "a very high tower."<P>1. General Form of Babylonian Temple-Towers:<P>There was a great difference, however, between a Canaanite mighdol or watchtower, and the great Tower at Babylon. The watchtower was simply a high structure, probably without any special shape or form, which depended upon the will of the architect and the nature of the ground upon which it was erected. The Tower of Babel or Babylon, however, was a structure peculiar to Babylonia and Assyria. According to all accounts, and judging from the ruins of the various erections extant in those countries, Babylonian towers were always rectangular, built in stages, and provided with an inclined ascent continued along each side to the top. As religious ceremonies were performed thereon, they were generally surmounted by a chapel in which sacred objects or images were kept.<P>2. Their Babylonian Name:<P>These erections had, with the Babylonians, a special name: ziqquratu, meaning, apparently, "peak," or the highest point of a mountain, this word being applied to the mountain-height upon which Ut-napishtim, the Babylonian Noah, offered sacrifices on coming forth from the ark (or ship) when the waters of the great Flood had sufficiently subsided. It has also been thought that they were used as observatories when the Babylonians studied the starry heavens. This is probable, but as these structures were of no great height, it is possible that, in the clear atmosphere of the Babylonian plains, there was no real necessity to go above the surface of the earth when making their observations.<P>3. Whereabouts of the Tower of Babel:<P>There has been much difference of opinion as to the geographical position of the Tower of Babel. Most writers upon the subject, following the tradition handed down by the Jews and Arabs, have identified it with the great Temple of Nebo in the city of Borsippa, now called the Birs-Nimroud (explained as a corruption of Birj Nimroud, "Tower of Nimrod"). This building, however, notwithstanding its importance, was to all appearance never regarded by the Babylonians as the Tower of Babel, for the very good reason that it was not situated in Babylon, but in Borsippa, which, though called, in later times, "the second Babylon," was naturally not the original city of that name. The erection regarded by the Babylonians as the great Tower of their ancient city was E-temen-ana-ki, "the Temple of the foundation of heaven and earth," called by Nabopolassar and Nebuchadrezzar ziqqurat Babili, "the Tower of Babylon"—the world-renowned temple dedicated to Merodach and his consort Zer-panitum, Babylon\'s chief deities.<P>4. Its Position at Babylon:<P>This structure was situated in the southern portion of the city, not far from the right bank of the Euphrates, and according to Weissbach, is now represented by a depression within which is the original rectangular core of unbaked brick. From its shape, the Arabs have made this site Sahan, "the dish." These remains of the great temple-tower of Babylon, within the memory of men not so very old, towered, even in its ruined state, high above the surrounding plain. The burnt bricks of the ancient Babylonians, however, who "had brick for stone, and slime (bitumen) for mortar" (<a onClick="return mV(\'Gen\',11,3);">Ge 11:3</a>), are still good and have a commercial value, so they were all cleared out, with whatever precious material in the way of antiquities they may have contained, to repair, it is said, the banks of the Hindiyeh Canal. Certain records in the shape of conical "cylinders," however, came into the market, and were acquired by the museums of Europe and America. As these refer to the restoration of the building by Nabopolassar, and the part taken by his sons Nebuchadrezzar and Nabu-sum-lisir in the ceremonies attending the rebuilding, it is very probable that they formed part of the spoils acquired.<P>5. A Babylonian Description of the Tower:<P>E-temen-ana-ki, to give the Babylonian (Sumerian) name, consisted of six stages built upon a platform, and provided with a sanctuary at the top. A tablet seemingly giving a detailed description of this building was for a time in the hands of the late George Smith in the year 1876. Unfortunately he had not time to give a translation of the document, or to publish the text, but his detailed account of it (Athenaeum, February 12, 1876) is exceedingly interesting. First there was the outer court called the "grand court," measuring, according to G. Smith\'s estimate, 1,156 ft. by 900 ft., and a smaller one, called "the court of Ishtar and Zagaga," 1,056 ft. by 450 ft. Round the court were six gates admitting to the temples:<P class="in15">(1) the grand gate;<P class="in15">(2) the gate of the rising sun (east);<P class="in15">(3) the great gate;<P class="in15">(4) the gate of the colossi;<P class="in15">(5) the gate of the canal; and<P class="in15">(6) the gate of the tower-view.<P>6. The Platform:<P>After this came a space or platform apparently walled—a ki-gallu square in form, and measuring 3 ku each way. Its size is doubtful, as the value of the ku is unknown. The sides of this enclosure faced the cardinal points. In its walls were four gates, one on each side, and named from the points toward which they looked. Within this enclosure stood a large building measuring 10 gar (Smith: 200 ft.) each way. Unfortunately, the name of this erection was damaged, so that its nature and use are uncertain.<P>7. The Chapels and Shrines:<P>Round the base of the Tower were small temples or chapels dedicated to the various gods of the Babylonians. On the east were 16 shrines, the principal of them being dedicated to Nebo and Tasmetu, his spouse; on thee north were two temples dedicated to Ea. (Ae) and Nusku respectively; on the south was a single temple to the two great gods, Anu and Bel (Enlil?). It was on the west, however, that the principal buildings lay—a double house with a court between the wings 35 cubits (Smith: 58 ft.) wide. These two wings were not alike in dimensions, the erection on one side being 100 cubits by 20 (166 ft. by 34 ft.) and on the other 100 cubits by 65 (166 ft. by 108 ft.). In these western chambers stood the couch of the god, and the golden throne mentioned by Herodotus, with other objects of great value. The couch was stated to have measured 9 cubits by 4 (15 ft. by 6 feet 8 inches).<P>8. The Tower in Its First Stage:<P>In the center of these groups of buildings stood the great Tower in stages, called by the Babylonians "the Tower of Babel" (ziqqurat Babili). The stages decreased from the lowest upward, but each was square in plan. The first or foundation-stage was 15 gar each way by 5 1/2 gar high (300 ft. by 110 ft. high), and seems to have been decorated with the usual double recesses which are a characteristic of Assyr-Bab architecture.<P>9. The Remaining Stages:<P>The second stage was 13 gar square and 3 gar high (260 ft. by 60 ft.). A term was applied to it which G. Smith did not understand, but he notes that it probably had sloping sides. The stages from the 3rd to the 5th were all of equal height, namely, 1 gar (20 ft.), and were respectively 10 gar (200 ft.), 8 1/3 gar (170 ft.) and 7 gar (140 ft.) square. The dimensions of the 6th stage were omitted, but may be restored in accordance with the others, namely, 5 1/2 gar square (110 ft.) by 1 gar (20 ft.) high.<P>10. The Chapel at the Top:<P>On this was raised what Smith calls the 7th stage, namely, the upper temple or sanctuary of the god Bel-Merodach, 4 gar long, 3 1/2 gar broad and 2 1/2 gar high (80 ft., 60 ft., and 50 ft., respectively). He does not mention the statue of the god, but it may be supposed that it was set up in this topmost erection. The total height of the tower above its foundation was therefore 15 gar (300 ft.), the same as the breadth of its base. It cannot be said that it was by any means a beautiful erection, but there was probably some symbolism in its measurements, and in appearance it probably resembled (except the decoration) the temple tower of Calah as restored in the frontispiece to Layard\'s Monuments of Nineveh, 1st series, in which a step-pyramid with a similarly highbasement stage is shown.<P>11. Herodotus\' Description:<P>With this detailed description, which is quite what would be expected in a Babylonian account of such a celebrated temple, the description in Herodotus (i.181ff) agrees. He states that it was a temple square in form, two furlongs (1,213 ft.) each way, in the midst of which was built a solid tower a furlong square (nearly 607 ft.). This, however, must have been the platform, which, with the six stages and the chapel on the top, would make up the total of eight stages of which Herodotus speaks. The ascent by which the top was reached he describes as running "outside round about all the towers"—wording which suggests, though not necessarily, that it was spiral—i.e. one had to walk round the structure 7 times to reach the top. Representations on Babylonian boundary-stones suggest that this view would be correct, though a symmetrical arrangement of inclined paths might have been constructed which would have greatly improved the design. At the middle of the ascent, Herodotus says, there was a stopping-place with seats to rest upon, which rather favors this idea. At the top of the last tower there was a large cell, and in the cell a large couch was laid, well covered; and by it a golden table. There was no image there, nor did any human being spend the night there, except only a woman of the natives of the place chosen by the god, "as say the Chaldeans who are the priests of this god." These men told Herodotus that the god often came to the cell, and rested upon the couch, "but," he adds, "I do not believe them." After mentioning parallels to this at Egyptian Thebes and Patam in Lycia, he goes on to speak of another cell below (that referred to in G. Smith\'s tablet) wherein was a great image of Zeus (Bel-Merodach) sitting, with a footstool and a large table, all of gold, and weighing no less than 800 talents. Outside of this cell was an altar to the god, made of gold; and also another altar, whereon full-grown animals were sacrificed, the golden altar being for sucklings only. The Chaldeans also told him that there was, in the precincts of the building, a statue 12 cubits high, and of solid gold. Darius Hystaspis desired to take possession of this valuable object, but did not venture. His son Xerxes, however, was not so considerate of the feelings of the people and the priesthood, for he also killed the priest when he forbade him to meddle with it.<P>12. The Builders of the Tower:<P>The Bible record does not state who the people were who journeyed in the east and built the city and the Tower. The indefinite "they" might be taken to mean whatever people were there at the time the record was written, and probably presupposes that the reader would certainly know. As the Tower of Babel bears, in the native inscriptions, a Sumero-Akkadian name, it may be supposed that the builders referred to belonged to that race.<P>13. Traditions Concerning Its Destruction:<P>It is noteworthy that nothing is said in Genesis concerning the stoppage of the erection, though they ceased to build the city. Bochart records a Jewish tradition which makes the tower to have been split through to its foundation by fire which fell from heaven—suggested probably by the condition of the tower at "the second Babylon," i.e. the Birs Nimroud. Another tradition, recorded by Eusebius (Prep. Evang., ix; Chronicon, 13; Syncel. Chron., 44) makes it to have been blown down by the winds; "but when it approached the heavens, the winds assisted the gods, and overturned the work upon its contrivers: and the gods introduced a diversity of tongues among men, who, until that time, had all spoken the same language."<P>14. The Meaning of "Babel":<P>The place where they built the Tower was called Babylon, on account of the confusion of languages. Here we have again the statement as in Genesis that the meaning of Babel is "confusion." This, as is well known, is based upon the purely Hebrew etymological law, which makes balal, "to confuse," or "mingle," assume a reduplicate form; but as far as the cuneiform inscriptions, which are now very numerous, give us information, Babel, from baldlu, "to mingle" (the root in question), was an impossibility. But on the Babylonian side, that the rendering of the name as Bab-ili (-ilani), "gate of god" ("of the gods") was a folk-etymology, is undoubted, notwithstanding that the Sumero-Akkadian form Ka-dingira, with the same meaning, is far from rare. It is noteworthy, however, that one of the forms used by Nebuchadrezzar is Babilam, with the mimmation or "emming," which is a characteristic of the Babylonian language; moreover, a place-name Babalam also occurs, which may be a still earlier, and perhaps the original, form. Notwithstanding that one would like to see in Babalam, "the place of bringing together," and in Babilam, "the bringer together," the termination -am would seem to be an insurmountable difficulty.<P>15. The Ultimate Destruction of the Tower:<P>That the building of the city would have been stopped when the confusion of tongues took place is natural—the departure of the greater part of the inhabitants made this inevitable. When the population increased again, the building of the city was continued, with the result that Babylon ultimately became the greatest city of then known world. The Tower, notwithstanding what had been said as to its destruction, remained, and when, as happened from time to time, its condition became ruinous, some energetic Babylonian king would restore it. Alexander and Philip of Macedon began clearing away the rubbish to rebuild the great temple of Bclus (Bel-Merodach) connected with it and there is hardly any doubt that the Tower would have been restored likewise, but the untimely death of the former, and the deficient mental caliber of the latter for the ruling of a great empire, put an end to the work. The Tower therefore remained unrepaired—"The tower was exceedingly tall. The third part of it sank down into the ground, a second third was burned down, and the remaining third was standing until the time of the destruction of Babylon" (Rabbi Yehanan, Sanhedhrin, 109, 1).<P>16. No Idea of Reaching Heaven:<P>Concerning the reputed intention of the builders of the Tower, to carry it as high as the heavens, that, notwithstanding the Talmud and other writings, may be dismissed at once. The intention was to build a very high tower, and that is all that is implied by the words employed. That the Babylonians would have liked their tower to reach heaven may be conceded, and the idea may be taken as symbolical of Babylon\'s pride, the more especially as they regarded it as "the house of the foundation of heaven and earth." Though at present brought lower than the other temple-towers of Babylonia, its renown remains as one of the great glories of that renowned capital. Dedicated as it was to the gods whom they worshipped, and chiefly to the glory of Merodach, the representative of Babylonian monotheism, the Babylonians\' descendants, the native Christians, have no reason to remember this erection of their forefathers with shame, but rather with pride. The rallyingpoint of nations, Babylon, while it existed, was always a great commercial center, and many are the languages which have resounded in the Tower\'s vicinity. The confusion of tongues led to the Jewish fiction that the air of Babylon and Borsippa caused forgetfulness, and was therefore injurious to students of the Law, causing them to forget it as the builders of the Tower had of old forgotten their speech (Rashi, Sanhedhrin,109,1). This, however, did not prevent the rabbis of Babylon from being more celebrated than those of the Holy Land, and even of Jerusalem itself.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`136';
isbe[1074]='Babi`ba\'-bi (Codex Alexandrinus, Babi; Codex Vaticanus, Baier = Bebai (<a onClick="return mV(\'Ezr\',8,11);">Ezr 8:11</a>)). The descendants of Babi returned with Ezra to Jerusalem (1Esdras 8:37).``1';
isbe[1075]='Babylon in the New Testament`Babylon Babulon, is used in New Testament in at least two different senses:<P>1. Mesopotamian Babylon:<P>In <a onClick="return mV(\'Mat\',1,11,12,17);">Mt 1:11-12, 17</a>; <a onClick="return mV(\'Act\',7,43);">Ac 7:43</a> the old Mesop city is plainly meant. These all refer to the captivity in Babylon and do not demand any further discussion.<P>2. Symbolic Sense:<P>All the references to Babylon in Revelation are evidently symbolic. Some of the most important passages are <a onClick="return mV(\'Rev\',14,8);">Rev 14:8</a>; <a onClick="return mV(\'Rev\',16,19);">16:19</a>; <a onClick="return mV(\'Rev\',17,5);">17:5</a>; <a onClick="return mV(\'Rev\',18,2,10,21);">18:2, 10, 21</a>. In <a onClick="return mV(\'Rev\',17,5);">Rev 17:5</a> Babylon is designated as musterion. This undoubtedly in dicates that the name is to be under stood figuratively. A few interpreters have believed that Jerusalem was the city that was designated as Babylon, but most scholars hold that Rome was the city that was meant. That interpretation goes back at least to the time of Tertullian (Adv. Marc., iii. 13). This interpretation was adopted by Jerome and Augustine and has been commonly accepted by the church. There are some striking facts which point to Rome as the city that is designated as Babylon.<P>(1) The characteristics ascribed to this Babylon apply to Rome rather than to any other city of that age:<P>(a) as ruling over the kings of the earth (<a onClick="return mV(\'Rev\',17,18);">Re 17:18</a>);<P>(b) as sitting on seven mountains (<a onClick="return mV(\'Rev\',17,9);">Re 17:9</a>);<P>(c) as the center of the world\'s merchandise (<a onClick="return mV(\'Rev\',18,3,11,12,13);">Re 18:3, 11-13</a>);<P>(d) as the corrupter of the nations (<a onClick="return mV(\'Rev\',17,2);">Re 17:2</a>; <a onClick="return mV(\'Rev\',18,3);">18:3</a>; <a onClick="return mV(\'Rev\',19,2);">19:2</a>);<P>(e) as the persecutor of the saints (<a onClick="return mV(\'Rev\',17,6);">Re 17:6</a>).<P>(2) Rome is designated as Babylon in the Sibylline Oracles (5 143), and this is perhaps an early Jewish portion of the book. The comparison of Rome to Babylon is common in Jewish apocalyptic literature (see 2Esdras and the Apocrypha Baruch).<P>(3) Rome was regarded by both Jews and Christians as being antagonistic to the kingdom of God, and its downfall was confidently expected, This conception is in accord with the predicted downfall of Babylon (<a onClick="return mV(\'Rev\',14,8);">Re 14:8</a>; <a onClick="return mV(\'Rev\',18,2,\'10-21\');">18:2, 10-21</a>). As Babylon had been the oppressor of Israel, it was natural that this new power, which was oppressing the people of God, should be designated as Babylon.<P>3. In 1 Peter:<P>In <a onClick="return mV(\'1Pe\',5,13);">1Pe 5:13</a> Babylon is designated as the place from which 1 Peter was written. Down to the time of the Reformation this was generally under stood to mean Rome, and two cursives added "en Roma." Since the Reformation, many scholars have followed Erasmus and Calvin and have urged that the Mesopotamian Babylon is meant. Three theories should be noted:<P>(1) That the Egyptian Babylon, or Old Cairo; is meant. Strabo (XVII, 807) who wrote as late as 18 AD, says the Egyptian Babylon was a strong fortress founded by certain refugees from the Mesop Babylon. But during the 1st century this was not much more than a military station, and it is quite improbable that Peter would have gone there. There is no tradition that connects Peter in any way with Egypt.<P>(2) That the statement is to be taken literally and that the Mesop Babylon is meant. Many good scholars hold to this view, and among these are Weiss and Thayer, but there is no evidence that Peter was ever in Babylon, or that there was even a church there during the 1st century. Mark and Silvanus are associated with Peter in the letter and there is no tradition that connects either of them with Babylon. According to Josephus (Antiquities, XVIII, ix, 5-9), the Jews at this time had largely been driven out of Babylon and were confined to neighboring towns, and it seems improbable that Peter would have made that his missionary field.<P>(3) That Rome was the city that was designated as Babylon. The Apocalypse would indicate that the churches would understand the symbolic reference, and it seems to have been so understood until the time of the Reformation. The denial of this position was in line with the effort to refute Peter\'s supposed connection with the Roman church. Ancient tradition, however, makes it seem quite probable that Peter did make a visit to Rome (see Lightfoot, Clement, II, 493ff).<P>Internal evidence helps to substantiate theory that Rome was the place from which the letter was written. Mark sends greetings (<a onClick="return mV(\'1Pe\',5,13);">1Pe 5:13</a>), and we know he had been summoned to Rome by the apostle Paul (<a onClick="return mV(\'2Ti\',4,11);">2Ti 4:11</a>). The whole passage, "She that is in Babylon, elect together with you, saluteth you," seems to be figurative, and that being true, it is natural that Babylon should have been used instead of Rome. The character of the letter as a whole would point to Rome as the place of writing. Ramsay thinks this book is impregnated with Roman thought beyond any other book in the Bible (see The Church in the Roman Empire, 286).``62';
isbe[1076]='Babylon in the Old Testament``<a href="./study/isbe/search.html?string=BABEL,+BABYLON (1)">BABEL, BABYLON</a>`1';
isbe[1077]='Babylonia`bab-i-lo\'-ni-a<P>1. Mounds<P>2. Explorations<P>3. Names<P>4. Semites<P>5. Sumerians<P>6. Home of the Semites<P>7. Immigration<P>8. Language<P>9. Script<P>10. Architecture<P>11. Art<P>12. Literature<P>13. Libraries<P>14. Personal Names<P>15. History of Kingdoms<P>16. Kish<P>17. Lagash<P>18. Adab<P>19. Nippur<P>20. Erech<P>21. Larsa<P>22. Shuruppak<P>23. Kisurra<P>24. Umma<P>25. Accad<P>26. Opis<P>27. Basime<P>28. Drehem<P>29. Urumma<P>30. First Dynasty of Babylon<P>31. Sealand Dynasty<P>32. Cassite Dynasty<P>33. Cassite Rule<P>34. Isin Dynasty<P>35. Nebuchadrezzar I<P>36. Sealand Dynasty<P>37. Bit-Bazi Dynasty<P>38. Other Rulers<P>39. Babylonian Dynasty<P>40. Neo-Babylonian Rulers<P>41. Persian Rulers of Babylon<P>LITERATURE<hr /><P>Babylonia is a plain which is made up of the alluvial deposits of the mountainous regions in the North, where the Tigris and Euphrates have their source. The land is bounded on the north by Assyria and Mesopotamia; on the east by Elam, separated by the mountains of Elam; on the south by the sea marshes, and the country Kaldu (Chaldaea); and on the west by the Syrian desert. Some of the cities of the lower country were seaport towns in the early period, but now are far inland. This land- making process continues even at the present time at the rate of about 70 ft. a year.<P>This plain, in the days when Babylonia flourished, sustained a dense population. It was covered with a network of canals, skillfully planned and regulated, which brought prosperity to the land, because of the wonderful fertility of the soil. The neglect of these canals and doubtless, also, the change of climate, have resulted in altered conditions in the country. It has become a cheerless waste. During some months of the year, when the inundations take place, large portions of the land are partially covered with swamps and marshes. At other times it looks like a desolate plain.<P>1. Mounds:<P>Throughout the land there are seen, at the present time, ruin-hills or mounds of accumulation of debris, which mark the site of ancient cities. Some of these cities were destroyed in a very early era, and were never rebuilt. Others were occupied for millenniums, and their history extends far into the Christian era. The antiquities generally found in the upper stratum of the mounds which were occupied up to so late a period, show that they were generally inhabited by the Jews, who lived there after the Babylonians had disappeared.<P>2. Explorations:<P>The excavations conducted at various sites have resulted in the discovery, besides antiquities of almost every character, of hundreds of thousands of inscriptions on clay and stone, but principally on the former material. At Tello more than 60,000 tablets were found, belonging largely to the administrative archives of the temple of the third millennium BC. At Nippur about 50,000 inscriptions were found, many of these also belonging to temple archives. But about 20,000 tablets and fragments found in that city came from the library of the school of the priests, which had been written in the third millennium BC. At Sippar, fully 30,000 tablets were found, many being of the same general character, also representing a library. At Delehem and Djokha, temple archives of the same period as those found at Tello have come to light in great numbers, through the illicit diggings of Arabs. Babylon, Borsippa, Kish, Erech and many other cities have yielded to the explorer and the Arab diggers inscribed documents of every period of Babylonian history, and embracing almost every kind of literature, so that the museums and libraries of America and Europe have stored up unread inscriptions numbering hundreds of thousands. Many also are in the possession of private individuals. After the work of excavating Babylonia has been completed and the inscriptions deciphered, many of the pro-Christian centuries in Babylonian history will be better known than some of those of our Christian era. The ancient history of the Babylonians will be reconstructed by the help of these original sources. Lengthy family genealogies will be known, as indeed in some instances is now the case, as well as the Babylonian contemporaries of Ezekiel, Abraham and all the other Biblical characters.<P>3. Names:<P>The Greek name of Babylonia which is in use at the present time is derived from the name of the city of Babylon, the capital and chief city of the land from the time of the First Dynasty of Babylon, about 2000 BC (see <a href="./study/isbe/search.html?string=BABYLON">BABYLON</a>). The name of the land in the very earliest period which is represented by antiquities, and even inscribed objects, is not known. But in a comparatively early age the northern part is called Uri, and the southern part, Engi or En-gira. The second part of the latter name is perhaps the same as in Su-gir, which is thought to be the origin of the Old Testament Shinar. Su-gir and Su-mer are names of the same country. And inasmuch as Mer and Gir were names of the same west Semitic deity, who played an important role in the early history of Babylonia, it is not improbable that the element Su is also to be identified with the ancient name of Mesopotamia. Su is also in Su-bartu, the name of the country to the North. This name is also written Su-Gir.<P>Subsequent to 2000 BC the ideograms read in Sumerian, Uri and Engi, were pronounced in SemBab, Accad and Sumer. The former received its name from the capital of the kingdom Accad, one of the cities mentioned in <a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>. The title, "king of Accad and Sumer" was used by rulers as late as the 1st millennium BC. The name by which the land is known in the second millennium BC is Kar-Duniash, the exact derivation of which is in doubt. Kar means "garden, land" in Semitic and Sumerian; and Duniash being preceded by the determinative for deity, has been regarded as a name of a Cassite god. A more recently advanced explanation is that Duniash is equivalent to Bel-malati, which means "lord of lands." The meaning of the name, as stated, must be regarded as undetermined.<P>In the time of the late Assyrian empire a nation in the extreme southern part of the land, called by the Greeks Chaldea, which is derived from the name Kaldu, came into existence. In the Assyrian historical inscriptions the land is usually called Bit-Yakin. This people seems to have issued from Aramaic Under Biblical. Merodach-baladan they ruled Babylonia for a time. The Neo-Bab Dynasty, founded by Nabopolassar, is supposed to be Chaldean in origin, in consequence of which the whole land in the Greek period was called Chaldea.<P>4. Semites:<P>Two distinct races are found occupying the land when we obtain the first glimpses of its history. The northern part is occupied by the Semites, who are closely allied to the Amorites, Arameans and Arabs; and the southern part by a non-Sem people called Sumerians. Their cultures had been originally distinct, but when they first become known to us there has taken place such an amalgamation that it is only by the knowledge of other Semitic cultures that it is possible to make even a partial differentiation of what was Sem-Bab and what was Sumerian. The Semites, it would almost seem, entered the land after the Sumerians had established themselves, but this can only be re garded as a conjecture.<P>5. Sumerians:<P>Although the earliest Sumerian settlement belongs to a remote period, few traces of the pre-historic Sumerian have been found. The archaeological remains indicate that this non-Sem race is not indigenous to the land, and that when they came into the country they had already attained to a fair degree of culture. But there is no evidence, as yet, in what part of the ancient world the elements of their culture were evolved, although various attempts have been made by scholars to locate their original home.<P>6. Home of the Semites:<P>The home of the Semites has been placed in different parts of the ancient world. A number of scholars look to Arabia and others to Africa for their original habitation, although their theories generally are not based upon much archaeological evidence. Unquestionably, the previous, if not the original home of the Semitic Babylonians, is to be found in the land of the Amorites, that is in Syria. In the earliest known period of Babylonian history, which apparently belongs to the age not very far removed from the time when the Semites entered Babylonia, Amurru was an important factor in the affairs of the nations, and it was a land which the world conquerors of Babylonia, both Sumerian and Semitic, endeavored to subjugate. This points to the fact that the culture of Amurru was then already old. Egyptian inscriptions fully substantiate this. We look to the land of the Arnorites as the home of the Semitic Babylonians, because of the important part played by the chief god of that land Amurru or Uru, in the Babylonian religion and nomenclature. In fact nearly all of the original names of the Semitic Babylonian sun-deities are derived from the names and epithets of the great Sun-god of the Amorites and Arameans (see Amurru, 108ff). These and many other considerations point to Amurru, or the land of the Amorites, as the previous home of the Semites who migrated into Babylonia and who eventually became masters of the land.<P>7. Immigration:<P>The original settlements in Babylonia, as stated above, belong to a prehistoric time, but throughout the history of the land fresh Semitic migrations have been recognized. In the Isin and First Dynasty of Babylonia, Amorites or Canaanites seem to flood the country. In the second millennium a foreign people known as Cassites ruled Babylonia for nearly six centuries. The nomenclature of the period shows that many Hittites and Mittanaeans as well as Cassites lived in Babylonia. In the first millennium the thousands of names that appear in the contract literature indicate a veritable Babel of races: Egyptians, Elamites, Persians, Medes, Tabalites, Hittites, Cassites, Ammorites, Edomites, notably Hebrews, are among the peoples that occupied the land. The deportation of the Israelites by the Assyrian kings and of the Jews by the Babylonian kings, find confirmation besides the historical inscriptions in the names of Hebrews living in Babylonia in the corresponding periods.<P>8. Language:<P>The languages of Babylonia are Semitic and Sumerian. The latter is an agglutinative tongue like the Turkish, and belongs to that great unclassifiable group of languages, called for the sake of convenience, Turanian. It has not been shown, as yet, to be allied to any other known language. The Semitic language known as the Babylonian, with which the Assyrian is practically identical, is of the common Semitic stock. After the Semites entered the land, their language was greatly influenced by the Sumerian tongue. The Semites being originally dependent upon the Sumerian scribes, with whom the script had originated, considered in connection with the fact that the highly developed culture of the Sumerians greatly influenced that of the Semites, brought about the peculiar amalgamation known as Babylonian. The language is, however, distinctively Semitic, but it has a very large percentage of Sumerian loan-words. Not knowing the cognate tongues of the Sumerian, and having a poor understanding of the pronunciation of that language, it is impossible to ascertain, on the other hand, how much the Sumerian language was influenced by the Semites.<P>In the late period another Semitic tongue was used extensively in the land. It was not because of the position occupied by the Arameans in the political history of western Asia, that their language became the lingua franca of the first millennium BC. It must have been on account of the widespread migrations of the people. In the time of Sennacherib it seems to have been used as the diplomatic language in Assyria as well as among the Hebrews, as the episode in <a onClick="return mV(\'2Ki\',18,26);">2Ki 18:26</a> would show. Then we recall the story of Belshazzar, and the edicts of the late period referred to in the Old Testament, which were in Aramaic (<a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a>, etc.). In Assyria and Babylonia, many contract tablets have been found with Aramaic reference notes written upon them, showing that this was the language of those who held the documents. The Hebrews after the exile used Aramaic. This would seem to point to Babylonia as the place where they learned the language. The Babylonian language and the cuneiform script continued to be used until the 3rd or 2nd century BC, and perhaps even later, but it seems that the Aramaic had generally supplanted it, except as the literary and legal language. In short the tongue of the common people or the spoken language in all probability in the late period was Aramaic.<P>9. Script:<P>The cuneiform writing upon clay was used both by the Sumerians and the Semites. Whether this script had its origin in the land, or in the earlier home of the Sumerians, remains a question. It is now known that the Elamites had their own system of writing as early as that of the earliest found in Babylonia; and perhaps it will be found that other ancient peoples, who are at the present unknown to us, also used the cuneiform script. A writing similar to the Babylonian was in use at an early time in Cappadocia. The Hittites and other peoples of that region also employed it. The origin of the use of clay as a writing material, therefore, is shrouded in mystery, but as stated above, the system used by the Semites in Babylonian ylonia was developed from the Sumerian.<P>The script is not alphabetic, but ideographic and phonetic, in that respect similar to the Chinese. There are over 500 characters, each one of which has from one to many values. The combination of two or more characters also has many values. The compilation of the values of the different signs used in various periods by both the Sumerians and Assyrians numbers at the present about 25,000, and the number will probably reach 30,000.<P>10. Architecture:<P>The architecture of Babylonia is influenced by the fact that the building material, in this alluvial plain, had to be of brick, which was largely sun-dried, although in certain prosperous eras there is much evidence of kiln-dried bricks having been used. The baked brick used in the earliest period was the smallest ever employed, being about the size of the ordinary brick used at the present time. The size of the bricks in the era prior to the third millennium varied from this to about 6 x 10 x 3 inches at Nippur, Sargon and his son Naram-Sin used a brick, the largest found, about 20 inches square, and about 4 inches in thickness. Following the operations of these kings at Nippur is the work of Ur-Engur, who used a brick about 14 inches square and nearly 4 inches in thickness. This size had been used at Tello prior to Sargon\'s time, and was thereafter generally employed. It re mained the standard size of brick throughout the succeeding centuries of Babylonian history. Adobes, of which the greater portion of the buildings were constructed, were usually double the thickness of kiln-dried bricks. The pillar made of bricks, as well as the pilaster constructed of the same material, seems to have come into use at a very early age, as is shown by the excavations at Tello.<P>A large number of Babylonian builders had the brick makers employ brick stamps which gave their names and frequently their titles, besides the name of the temple for which the bricks were intended. These enable the excavator to determine who the builders or restorers were of the buildings uncovered. Naturally, in a building like the temple of Enlil at Nippur, inscribed bricks of many builders covering a period of over 2,000 years were found. These by the help of building inscriptions, which have been found, enable scholars to rewrite considerable of the history of certain Babylonian temples. The walls of the city were also built of clay bricks, principally adobes. The walls usually were of very great thickness.<P>Clay was also employed extensively in the manufacture of images, weights, drains, playthings, such as animals, baby rattles, etc., and of inscriptions of every kind. Pottery, with the exception of the blue glaze employed in the late period, was usually plain, although some traces of painted pottery have been found. Although every particle of stone found in Babylonia was carried into the country, either by man or by inundations, still in certain periods it was used freely for statues, steles, votive objects, and in all periods for door sockets, weights and seal cylinders. Building operations in stone are scarcely known in Babylonia until perhaps the time of the greatest of all ancient builders, Nebuchadrezzar II, who laid a pavement in the causeway of Babylon, Aa-ibur-sabu, with blocks of stone from a mountain quarry.<P>See <a href="./study/isbe/search.html?string=BABYLON">BABYLON</a>.<P>11. Art:<P>The sculpture of the Sumerians, although in most instances the hardest of materials was used, is one of the great achievements of their civilization. Enough examples have been found to trace the development of their art from comparatively rude reliefs of the archaic period to the finished sculpture of Gudea\'s time, third millennium BC, when it reached a high degree of excellence. The work of the sculpture of this age shows spirit and originality in many respects unique. In the earliest period the Babylonians attempted the round, giving frequently the main figures in full face. The perfection of detail, in their efforts to render true to life, makes their modeling very superior in the history of article The Sumerian seems to have been able to overcome difficulties of technique which later sculptors systematically avoided.<P>Practically every Babylonian had his own personal seal. He used it as the signature is used at the present time or rather as the little stamp upon which is engraved the name of the individual at the present time, in the Orient, to make an impression upon the letter which was written for him by a public scribe. Thousands of these ancient seals have been found. They were cut out of all kinds of stone and metal. The style in the early period was usually cylindrical, with a hole passing lengthwise through them. In the late period the signet was commonly used. Many of these gems were exquisitely cut by lapidists of rare ability. Some of the very best work of this art belongs to the third millennium BC. The boldness in outline, and the action displayed are often remarkable. The most delicate saws, drills and other tools must have been employed by the early lapidist. Some of his early work is scarcely surpassed in the present age.<P>The gold and silver smiths of the early age have left us some beautiful examples of their art and skill. A notable one is the silver vase of Entemena of Lagash, mounted on a bronze pedestal, which stands on four feet. There is a votive inscription engraved about its neck. The bowl is divided into two compartments. On the upper are engraved seven heifers, and on the lower four eagles with extended wings, in some respects related to the totem or the coat of arms of Lagash. While attention to detail is too pronounced, yet the whole is well rendered and indicates remarkable skill, no less striking than the well-known work of their Egyptian contemporaries. Bronze was also used extensively for works of art and utensils. Some remarkable specimens of this craft have been found at Tello.<P>In studying the magnificent remains of their art, one is thoroughly impressed with the skill displayed, and with the fact that there must have been a long period of development prior to the age to which these works belong, before such creations could have been possible. Although much of the craftsman\'s work is crude, there is considerable in the sculpture and engraving that is well worthy of study. And in studying these remains one is also impressed with the fact that they were produced in an alluvial plain.<P>12. Literature:<P>The literature in a narrow sense is almost entirely confined to the epics, which are of a religious character, and the psalms, hymns, incantations, omens, etc. These are the chief remains of their culture.<P>See <a href="./study/isbe/search.html?string=BABYLONIA+AND+ASSYRIA,+RELIGION+OF">BABYLONIA AND ASSYRIA, RELIGION OF</a>.<P>In a general sense almost every kind of literature is found among the hundreds of thousands of clay tablets unearthed in Babylonia. The inscribed votive objects are of all kinds and descriptions. The stone vase taken in booty was dedicated to the deity of the conqueror. The beautiful piece of lapis lazuli, agate, cornelian, etc., obtained, was inscribed and devoted in the same way. Slabs, tablets and cones of all shapes and sizes, were inscribed with the king\'s name and titles, giving the different cities over which he ruled and referring especially to the work that he had accomplished for his deity. From the decipherment of these votive objects much valuable data are gathered for the reconstruction of the ancient history of the land.<P>The same is true of what are known as building inscriptions, in which accounts of the operations of the kings in restoring and enlarging temples, shrines, walls and other city works are given. Canal digging and dredging, and such works by which the people benefited, are frequently mentioned in these inscriptions.<P>Epistolary literature, for example, the royal letters of Hammurabi, the diplomatic correspondence found in Egypt (see <a href="./study/isbe/search.html?string=TELL+EL-AMARNA">TELL EL-AMARNA</a>) or the royal letters from the Library of Ashurbanipal (see <a href="./study/isbe/search.html?string=ASHURBANIPAL">ASHURBANIPAL</a>), as well as the private correspondence of the people, furnishes valuable historical and philological data.<P>The thousands of tablets found in the school libraries of Sippar and Nippur, as well as of the library of Ashurbanipal, among which are all kinds of inscriptions used in the schools of the priests and scribes, have furnished a great deal of material for the Assyrian dictionary, and have thrown much light upon the grammar of the language. The legal literature is of the greatest importance for an understanding of the social conditions of the people. It is also valuable for comparative purposes in studying the codes of other peoples.<P>See <a href="./study/isbe/search.html?string=CODE+OF+HAMMURABI">CODE OF HAMMURABI</a>.<P>The commercial or legal transactions, dated in all periods, from the earliest times until the latest, also throw important light upon the social conditions of the people. Many thousands of these documents have been found, by the help of which the very life that pulsated in the streets of Babylonian cities is restored.<P>The administrative documents from the temple archives also have their value, in that they furnish important data as regards the maintenance of the temples and other institutions; and incidentally much light on the nationality and religion of the people, whose names appear in great numbers upon them. The records are receipts of taxes or rents from districts close by the temples, and of commercial transactions conducted with this revenue. A large portion of these archives consists of the salary payments of storehouse officials and priests. There seems to have been a host of tradesmen and functionaries in connection with the temple. Besides the priest, elder, seer, seeress, sorcerer, sorceress, singer, etc., there were the farmer, weaver, miller, carpenter, smith, butcher, baker, porter, overseer, scribe, measurer, watchman, etc. These documents give us an insight into Babylonian system of bookkeeping, and show how carefully the administrative affairs of the temple were conducted. In fact the temple was provided for and maintained along lines quite similar to many of our modern institutions.<P>13. Libraries:<P>The discovery of the Library of Ashurbanipal at Nineveh speaks volumes for the culture of Assyria, but that culture was largely borrowed from the Babylonians. Much that this library contained had been secured from Babylonian libraries by the scribes employed by Ashurbanipal. In every important center there doubtless existed schools and libraries in connection with the temples. At Nippur, in 1890, Dr. J. P. Peters found such a library, but unfortunately, although he termed it such, his Assyriologists did not recognize that one of the greatest discoveries of antiquity had been made. It remained for Dr. J. H. Haynes, a decade later, to discover another portion of this library, which he regarded as such, because of the large number of tablets which he uncovered. Pere Scheil, prior to Dr. Haynes\' discovery, had the good fortune while at Sippar to discover a part of the school and library of that important center. Since Professor Scheil\'s excavations, Arabs have unearthed many inscriptions of this library, which have found their way to museums and into the hands of private individuals.<P>The plan of the Nippur Library, unearthed by Dr. Haynes, has been published by Mr. C. Fisher, the architect of the Nippur expedition (see Clay, Light on the Old Testament from Babel, 183). Professor Scheil, in publishing his results, has also given a plan of the school he discovered, and a full description of its arrangements, as well as the pedagogical methods that had been employed in that institution of learning. This has also been attempted by others, but in a less scientific manner. One of the striking features of these libraries is the use of the large reference cylinders, quadrangular, pentagonal and hexagonal in shape. There was a hole cut lengthwise through them for the purpose of mounting them like revolving stands. These libraries, doubtless, contained all the works the Babylonians possessed on law, science, literature and religion. There are lexical lists, paradigm tablets, lists of names, of places, countries, temples, rivers, officers, stones, gods, etc. Sufficient tablets have been deciphered to determine their general character. Also hundreds of exercise tablets have been found, showing the progress made by pupils in writing, in mathematics, in grammar, and in other branches of learning. Some tablets appear to have been written after dictation. Doubtless, the excavators found the waste heaps of the school, where these tablets had been thrown for the purpose of working them over again as raw material, for new exercises. The school libraries must have been large. Considering for instance that the ideographic and phonetic values of the cuneiform signs in use numbered perhaps 30,000, even the syllabaries which were required to contain these different values must have been many in number, and especially as tablets, unlike books made of paper, have only two sides to them. And when we take into consideration all the different kinds of literature which have been found, we must realize that these libraries were immense, and numbered many thousands of tablets.<P>14. Personal Names:<P>In modern times the meaning of names given children is rarely considered; in fact, in many instances the name has suffered so much through changes that it is difficult to ascertain its original meaning. Then also, at present, in order to avoid confusion the child is given two or more names. It was not so with the ancient Babylonian. Originally the giving of a name was connected with some special circumstance, and though this was not always the case throughout the history of Babylonia, the correct form of the name was always preserved.<P>The name may have been an expression of their religious faith. It may have told of the joy experienced at the birth of an heir. It may even betray the suffering that was involved at the birth of the child, or the life that the parents had lived. In short, the names afford us an intimate glimpse into the everyday life of the people.<P>The average Babylonian name is theophorous, and indicates one of the deities worshipped by the family, and often the city. For example, it is suggestive that persons with names compounded with Enlil and Ninib hailed from Nippur. Knowing the deities of the surrounding people we have also important evidence in determining the origin of peoples in Babylonia having foreign names. For example, if a name is composed of the Hittite deity Teshup, or the Amorite deity Amurru, or the Aramean god Dagan, or the Egyptian god Esi (Isis), foreign influence is naturally looked for from the countries represented. Quite frequently the names of foreign deities are compounded with Babylonian elements, often resulting from mixed marriages.<P>Theophorous names are composed of two, three, four and even five elements. Those having two or three elements predominate. Two-element names have a diety plus a verbal form or a subst.; or vice versa: for example, Nabu-na\'id (Nabonidus), "Nebo is exalted," or Shulman-asharedu (Shaimaneser), "Shalman is foremost." Many different combinations are found in three-element names which are composed of the name of the deity, a subst., a verbal form, a pronominal suffix, or some other form of speech, in any of the three positions. Explanations of a few of the familiar Biblical. names follow: Sin-akhe-erba (Sennacherib), "Sin has increased the brothers"; Marduk-apal-iddin (Mero-dach-baladan), "Marduk has given a son"; Ashurakh- iddin (Esarhaddon), "Ashur has given a brother"; Ashur-bani-apal, "Ashur is creating a son"; Nabu-kudurri-usur (Nebuchadrezzar), "O Nebo, protect the boundary"; Amel-Marduk (Evil Merodach), "Man of Marrink"; Bel-shar-usur (Belshazzar), "O Bel, protect the king." Some Babylonian names mentioned in the Bible are really of foreign origin, for example, Amraphel and Sargon. Amraphel originally is west Semitic and is written Hammurabi (pronounced Chammu-rabi, the first letter being the Semitic cheth). Sargon was perhaps originally Aramean, and is composed of the elements shar and the god Gan. When written in cuneiform it was written Shargani, and later Sharrukin, being translated "the true king." Many names in use were not theophorous; for example, such personal names as Ululd, "the month Ulul"; names of animals, as Kalba, "dog," gentilic names, as Akkadai, "the Akkadian," names of crafts, as Pacharu, "potter," etc.<P>The literature abounds in hypochoristica. One element of a name was used for the sake of shortness, to which usually a hypochoristica suffix was added, like Marduka (Mordecai). That is, the ending a or ai was added to one of the elements of a longer name.<P>15. History of Kingdoms:<P>The written history of Babylonia at the present begins from about 4200 BC. But instead of finding things crude and aboriginal in this, the earliest period, the remains discovered show that the people had attained to a high level of culture. Back of that which is known there must lie a long period of development. This is attested in many ways; for instance, the earliest writing found is so far removed from the original hieroglyphs that it is only possible to ascertain what the original pictures were by knowing the values which the signs possessed. The same conclusion is ascertained by a study of the art and literature. Naturally, as mentioned above, it is not impossible that this development took place in a previous home of the inhabitants.<P>The history of early Babylonia is at present a conflict of the kings and patesis (priest-kings) of the different city- kingdoms, for supremacy over each other, as well as over the surrounding peoples. The principal states that figure in the early history are: Kish, Lagash, Nippur, Akkad, Umma, Erech, Ur and Opis. At the present time more is known of Lagash, because the excavations conducted at that site were more extensive than at others. This makes much of our knowledge of the history of the land center about that city. And yet it should be stated that the hegemony of Lagash lasted for a long period, and the kingdom will ultimately occupy a prominent position when the final history of the land is written. Nippur, where considerable work was also done, was not the seat of rulers, but the sacred city of the god Enlil, to whom the kings of other cities generally did obeisance. Following is a list of known rulers of the different city-kingdoms.<P>16. Kish:<P>El-Ohemir, identified as the ancient city of Kish, not far from Babylon, is one of the oldest Semitic centers of the land. No systematic excavations have been conducted at this site, but besides the inscriptions which the Arabs have unearthed, several of the rulers are known to us through votive inscriptions discovered at Nippur and elsewhere. The rulers of Kish are: Utug p. (patesi), circa 4200 BC; Mesilim k. (king), circa 4000 BC; Lugal-tarsi k.; Enbi-Ishtar k.; Manishtusu k., circa 2650 BC; Urnmush k., circa 2600; Manana k.; Sumu-ditana k. and Tanium k.<P>17. Lagash:<P>The excavations by the French under De Sarsez and Cross at Tello, the ancient city Lagash, have yielded more inscriptions of ancient Babylonian rulers than those at any other site. Lagash was destroyed about 2000 BC, and only partially rebuilt in the post-Bab period. The known rulers are: Lugal-shag-Engur patesi, circa 4000 BC, contemporary with Mesilim k. of Kish; *Badu k.; *En-khegal k.; Ur-Nina k.; Akurgal p.; Eannatum p. and k.; Enannatum I p.; Entemena I; Enannatum IIp.; Enetarzi p.; Enlitarzi p.; Lugal-anda p.; Uru-kagina k., contemporary with Lugal-zaggisi, k. of Uruk; Engilsa p., contemporary with Manishtusu k. of Kish; Lugul-ushumgal p., contemporary with Sargon of Accad; Ur-Babbar p., contemporary with Naram-Sin of Accad; Ur-E p.; Lugal-bur p.; Basha-Kama p.; Ur-Mama p.; Ug-me p.; Ur-Bau p.; Gudea p.; Nammakhini p.; Ur- gar p.; Ka-azag p.; Galu-Bau p.; Galu-Gula p.; Ur-Ninsun p.: Ur-Ningirsu p.; contempo
