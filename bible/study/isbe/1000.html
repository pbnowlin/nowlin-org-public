isbe[1001]='Azarael`a-za\'-ra-el.`<a href="./study/isbe/search.html?string=AZAREL">AZAREL</a>`1';
isbe[1002]='Azaraias`az-a-ra\'-yas (B, Azaraias; A, Saraias; the King James Version Saraias); compare Seraiah (<a onClick="return mV(\'Ezr\',7,1);">Ezr 7:1</a>): An ancestor of Ezra (1Esdras 8:1).``1';
isbe[1003]='Azareel`a-zar\'-e-el`<a href="./study/isbe/search.html?string=AZAREL">AZAREL</a>`1';
isbe[1004]='Azarel`az\'-a-rel \'azarel, ("God is helper"; the King James Version reads Azareel in <a onClick="return mV(\'Num\',1,\'1-\');">Numbers 1-5</a>, Azarael in <a onClick="return mV(\'Num\',6,\'1-\');">Numbers 6</a>):<P>(1) A Korahite who entered the army of David at Ziklag (<a onClick="return mV(\'1Ch\',12,6);">1Ch 12:6</a>).<P>(2) A musician in the temple appointed by lot; son of Heman (<a onClick="return mV(\'1Ch\',25,18);">1Ch 25:18</a>; compare Uzziel, <a onClick="return mV(\'1Ch\',25,4);">1Ch 25:4</a>).<P>(3) A captain of the tribe of Dan in the service of David (<a onClick="return mV(\'1Ch\',27,22);">1Ch 27:22</a>).<P>(4) One of those who had "strange wives," a son of Bani (<a onClick="return mV(\'Ezr\',10,41);">Ezr 10:41</a>).<P>(5) The father of Amashai, a priest who dwelt in Jerusalem after the Exile (<a onClick="return mV(\'Neh\',11,13);">Ne 11:13</a>).<P>(6) A priest\'s son who played the trumpet in the procession when the wall was dedicated (<a onClick="return mV(\'Neh\',12,36);">Ne 12:36</a>).``16';
isbe[1005]='Azariah`az-a-ri\'-a \'azaryahu and \'azaryah, ("Yahweh has helped"):<P>(1) King of Judah. See <a href="./study/isbe/search.html?string=UZZIAH">UZZIAH</A>.<P>(2) A Judahite of the house of Ethan the Wise (<a onClick="return mV(\'1Ch\',2,8);">1Ch 2:8</a>).<P>(3) The son of Jehu, descended from an Egyptian through the daughter of Sheshan (<a onClick="return mV(\'1Ch\',2,38);">1Ch 2:38</a>).<P>(4) A son of Ahimaaz and grandson of Zadok (<a onClick="return mV(\'1Ch\',6,9);">1Ch 6:9</a>).<P>(5) A son of Zadok the high priest and an official of Solomon (<a onClick="return mV(\'1Ki\',4,2);">1Ki 4:2</a>).<P>(6) A high priest and son of Johanan (<a onClick="return mV(\'1Ch\',6,10);">1Ch 6:10</a>).<P>(7) A Levite, ancestor of Samuel, and Heman the singer (<a onClick="return mV(\'1Ch\',6,36);">1Ch 6:36</a>).<P>(8) A son of Nathan and captain of Solomon\'s tax collectors (<a onClick="return mV(\'1Ki\',4,5);">1Ki 4:5</a>).<P>(9) A prophet in the reign of King Asa; his father\'s name was Oded (<a onClick="return mV(\'2Ch\',15,\'1-8\');">2Ch 15:1-8</a>).<P>(10 and 11) Two sons of Jehoshaphat, king of Judah (<a onClick="return mV(\'2Ch\',21,2);">2Ch 21:2</a>).<P>(12) King of Judah (<a onClick="return mV(\'2Ch\',22,6);">2Ch 22:6</a>, called Ahaziah in <a onClick="return mV(\'2Ch\',22,1);">2Ch 22:1</a>).<P>(13) A son of Jeroham, who helped to overthrow Athaliah, and place Joash on the throne (<a onClick="return mV(\'2Ch\',23,1);">2Ch 23:1</a>).<P>(14) A son of Johanan and a leading man of Ephraim, mentioned in connection with the emancipated captives taken by Pekah (<a onClick="return mV(\'2Ch\',28,12);">2Ch 28:12</a>).<P>(15) A Levite of the family of Merari, who took part in cleansing the temple in the days of Hezekiah (<a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>).<P>(16) A high priest who rebuked King Uzziah for arrogating to himself priestly functions (<a onClick="return mV(\'2Ch\',26,\'16-20\');">2Ch 26:16-20</a>).<P>(17) The father of Seraiah and son of Hilkiah (<a onClick="return mV(\'1Ch\',6,13);">1Ch 6:13</a>f).<P>(18) A son of Hoshaiah, and a bitter enemy of Jeremiah (<a onClick="return mV(\'Jer\',43,2);">Jer 43:2</a>ff).<P>(19) One of the royal captives taken to Babylon, whose name was changed to Abed-nego (<a onClick="return mV(\'Dan\',1,7);">Da 1:7</a>).<P>(20) The son of Maaseiah, who helped repair the walls of Jerusalem (<a onClick="return mV(\'Neh\',3,23);">Ne 3:23</a>f).<P>(21) A Levite who assisted Ezra to expound the Law (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>).<P>(22) A priest who sealed the covenant (<a onClick="return mV(\'Neh\',10,2);">Ne 10:2</a>).<P>(23) A prince of Judah mentioned in connection with the dedication of the walls of Jerusalem (<a onClick="return mV(\'Neh\',12,32);">Ne 12:32</a>f).``34';
isbe[1006]='Azarias`az-a-ri\'as Azarias and Azareias:<P>(1) Azarias, who put away his "strange wife" (1Esdras 9:21); compare Uzziah (<a onClick="return mV(\'Ezr\',10,21);">Ezr 10:21</a>).<P>(2) Azarias, who stood at the right side of Ezra when the law was read to the people (1Esdras 9:43); omitted in <a onClick="return mV(\'Ezr\',8,4);">Ezr 8:4</a>.<P>(3) Azarias, who interpreted the law to the people (1Esdras 9:48); compare Azariah (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>).<P>(4) Azarias, a name assumed by the angel Raphael (Tobit 5:12; 6:6,13; 7:8; 9:2). See <a href="./study/isbe/search.html?string=RAPHAEL">RAPHAEL</A>.<P>(5) Azarias, a general in the service of Judas Maccabee (1Macc 5:18, 56, 60).<P>(6) Azarias, one of the three men thrown into the fiery furnace (The Song of the Three Children (Azariah) verses 2,66); compare Azariah (<a onClick="return mV(\'Dan\',1,6);">Da 1:6</a>ff; <a onClick="return mV(\'Dan\',2,17);">2:17</a>), Abed-nego (<a onClick="return mV(\'Dan\',1,7);">Da 1:7</a>; <a onClick="return mV(\'Dan\',2,49);">2:49</a>; <a onClick="return mV(\'Dan\',3,12);">3:12</a>ff).``16';
isbe[1007]='Azaru`az\'a-ru B, Azarou; A, Azourou; (the King James Version Azuran): The descendants of Azaru returned with Zerubbabel to Jerusalem (1Esdras 5:15); omitted in Ezra and Neh; compare however Azzur (<a onClick="return mV(\'Neh\',10,17);">Ne 10:17</a>).``1';
isbe[1008]='Azaz`a\'-zaz \'azaz, ("powerful"): A descendant of Reuben (<a onClick="return mV(\'1Ch\',5,8);">1Ch 5:8</a>).``1';
isbe[1009]='Azazel`a-za\'-zel (\'aza\'zel apopompaios; the King James Version Scapegoat, the Revised Version, margin "removal"):<P><b>I. THE MEANING OF THE WORD</b><P class="in15">1. The Passages to Be Considered<P class="in15">2. The Proposed Interpretations<P class="in30">(1) The Etymology<P class="in30">(2) The Explanation<P><b>II. WHAT IS DONE IN CONNECTION WITH AZAZEL</b><P class="in15">1. The Significance of This Action<P class="in15">2. The Jewish Liturgy<hr /><P>I. The Meaning of the Word<P>1. The Passages to Be Considered:<P>This word is found in connection with the ceremony of the <a href="./study/isbe/search.html?string=DAY+OF+ATONEMENT">Day of Atonement</A> (which see). According to <a onClick="return mV(\'Lev\',16,8);">Le 16:8</a>, Aaron is to cast lots upon the two goats which on the part of the congregation are to serve as a sin offering (<a onClick="return mV(\'Lev\',16,5);">Le 16:5</a>), "one be lot for Yahweh, and the other lot for Azazel." In <a onClick="return mV(\'Lev\',16,10);">Le 16:10</a>, after the first goat has been set apart as a sin offering for Yahweh, we read: "But the goat, on which the lot fell for Azazel, shall be set alive before Yahweh, to make atonement for him, to send him away for Azazel into the wilderness." In <a onClick="return mV(\'Lev\',16,26);">Le 16:26</a> we read: "And he that letteth go the goat for Azazel shall wash his clothes, and bathe his flesh in water." Before this, in <a onClick="return mV(\'Lev\',16,21);">Le 16:21</a>f mention had been made of what should be done with the goat. After the purification of the (inner) sanctuary, of the tent of meeting, and of the altar, the living goat is to brought, "and Aaron shall lay both his hands upon the head of the live goat, and confess over him all...their sins; and he shall put them upon the head of the goat, and shall send him away by the hand of a man that is in readiness into the wilderness: and the goat shall bear upon him all their iniquities unto a solitary land: and he shall let go the goat in the wilderness." But in this last mentioned and most important passage the term under consideration is not found.<P>2. The Proposed Interpretations:<P>(1) The Etymology.<P>Some have derived the word from \'az plus \'azal (fortis abiens, "passing away in his strength" or from an intentional alteration of \'el plus \'azaz, robur Dei, "strength of God"; compare below the angel of the Book of Enoch); while others have regarded the word as a broken plural of a substantive in the Arabic \'azala, and translated it as "lonesomeness," "desert." Now there is an inclination to regard it as a reduplication from \'azalzel, derived from the root \'azal. If we accept this view, although it is without certainty and an exact analogue cannot be found, we could conclude from the way in which this noun has been formed that we have before us not an abstract term (remotio, "removal," or abitus, "departure"), but a concrete noun, or an adjective, longe remotus ("far removed") or porro abiens ("going far away").<P>(2) The Explanation.<P>In <a onClick="return mV(\'Lev\',16,10,22,26);">Le 16:10, 22, 26</a>, we would have an acceptable sense, if we regarded this word as expressive of a distinct locality in the wilderness. But this interpretation is impossible, since the law in <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> was given during the wanderings in the wilderness and accordingly presupposed a constant change in the encampment, even if this should be regarded only as the historical background. By the use of the same preposition le- in connection with Yahweh and Azazel, it seems natural to regard the expressions as entirely II and to think of some personal being. Some interpret this word as referring to a demon of the wilderness (compare <a onClick="return mV(\'Psa\',106,37);">Ps 106:37</a>; <a onClick="return mV(\'Deu\',32,17);">De 32:17</a>; <a onClick="return mV(\'Lev\',17,7);">Le 17:7</a>; <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>; <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>; <a onClick="return mV(\'Mat\',12,43);">Mt 12:43</a>ff; <a onClick="return mV(\'Luk\',11,24);">Lu 11:24</a>ff; <a onClick="return mV(\'Rev\',18,2);">Re 18:2</a>) and explain the term as "one who has separated himself from God," or "he who has separated himself," or "he who misleads others." But a demon of this kind could not possibly be placed in contrast to Yahweh in this way; and as in the Book of Enoch 6:6; 8:1ff; 9:6; 10:4ff; 13:1ff; 69:2 one of the most prominent of the fallen angels who taught mankind the arts of war and luxury, revealed secrets to them, and is now bound in the wilderness, and is there preserved for the final judgment, because he was mainly responsible for the presence of evil in the world, is called Azael (also Azazel, or Azalzel), it is highly probable that this name was taken from <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>. In later times the word Azazel was by many Jews and also by Christian theologians, such as Origen, regarded as that Satan himself who had fallen away from God. In this interpretation the contrast found in <a onClick="return mV(\'Lev\',16,8);">Le 16:8</a>, in case it is to be regarded as a full parallelism, would be perfectly correct. But it must be acknowledged that in Holy Scripture, Satan is nowhere called by the name of Azazel, and just as little is the wilderness regarded as his permanent place of abode. Against these last two interpretations we must also recall that in the most significant passage, namely, <a onClick="return mV(\'Lev\',16,20);">Le 16:20</a>ff, the term Azazel is not found at all. The same is true in the case of the ceremony in connection with the purification of leprous people and houses (<a onClick="return mV(\'Lev\',14,7);">Le 14:7</a>ff, <a onClick="return mV(\'Lev\',14,49);">49</a>ff), which throughout suggests <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a>. In this place we have also the sevenfold sprinkling (compare <a onClick="return mV(\'Lev\',14,16);">Le 14:16</a> with <a onClick="return mV(\'Lev\',16,14);">Le 16:14</a>f); and in addition two animals, in this case birds, are used, of which the one is to be slain for the purpose of sprinkling the blood, but the other, after it has been dipped into the blood of the one that has been slain, is to be allowed to fly away. In this way the essential thought in <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> as also in <a onClick="return mV(\'Lev\',14,\'1-\');">Le 14</a> seems to be the removal of the animal in either case, and it is accordingly advisable to interpret Azazel adjectively, i.e. to forego finding a complete parallelism in <a onClick="return mV(\'Lev\',16,8);">Le 16:8</a>, and to regard the preposition in connection with Yahweh as used differently from its use with Azazel, and to translate as follows: "And Aaron shall cast lots over both goats, the one lot [i.e. for the one goat] for Yahweh, and one lot for the goat that is destined to go far away." On the preposition <i>le</i> used with the second Azazel in <a onClick="return mV(\'Lev\',16,10);">Le 16:10</a>, compare <a onClick="return mV(\'Exd\',21,2);">Ex 21:2</a>. With this interpretation a certain hardness yet remains for our linguistic sense, because we cannot find a good translation for the adjective. But in favor of this interpretation and against the personal interpretation we can appeal also to the feeling of the Septuagint translators who translate apopompaios, diestalmenos, and also to that of Aquilos, who translates tragos apoluomenos, apolelumenos, kekrataiomenos, and of Symmachus who translates aperchomenos, aphiemenos. (The general idea expressed by all these words is "removal," "sending away," "releasing" or "dismissal.") It is true that the Septuagint in one place translates eis ten apopompen, which however could be also an abstract circumlocution for a conception that, though used elsewhere, is yet awkward. In the Vulgate, we have caper emissarius and Luther says "der ledige Bock," which are probably based on a wrong etymology, since \'ez signifies only a goat or perhaps this word "Bock" is here only supplied from the connection, and that quite correctly, so that Luther and the Vulgate can also be cited in favor of our interpretation.<P>II. What Is Done in Connection with Azazel.<P>1. The Significance of This Action:<P>Both goats, according to <a onClick="return mV(\'Lev\',16,5);">Le 16:5</a>, are to be regarded as a single sin-sacrifice, even should we interpret Azazel as demon or Satan, and we are accordingly not at all to understand that a sacrifice was brought to these beings. This too is made impossible by the whole tenor of the Old Testament in general, as of <a onClick="return mV(\'Lev\',16,\'1-\');">Le 16</a> in particular, so that in <a onClick="return mV(\'Lev\',16,8);">16:8</a> the two members introduced by the preposition le- would not at all be beings of exactly the same importance. Both goats, so to say, represent two sides of the same thing. The second is necessary to make clear what the first one, which has been slain, can no longer represent, namely, the removal of the sin, and accordingly has quite often aptly been called the hircus redivivus. But what is to be represented finds its expression in the ceremony described in <a onClick="return mV(\'Lev\',16,20);">Le 16:20</a>f. Whatever may be the significance of the laying on of hands in other connections, whether the emphasis is placed more on the disposal or on the appropriation of the property, at this place it certainly is only a symbol of the transfer of guilt, which is confessed over the goat and is then carried into the wilderness by the goat upon which it has been laid. In order to make this transfer all the more impressive, both the hands are here brought into action, while e.g. in <a onClick="return mV(\'Lev\',1,4);">Le 1:4</a> only one hand is used. The fact that the goat is accompanied by somebody and that it is to be taken to an uninhabited place is to indicate the absolute impossibility of its return, i.e. the guilt has been absolutely forgiven and erased, a deep thought made objectively evident in a transparent manner and independently of the explanation of Azazel, which is even yet not altogether certain. In the personal interpretation, we could have, in addition to the idea of the removal of the guilt, also a second idea, namely, that Azazel can do no harm to Israel, but must be content with his claim to a goat which takes Israel\'s place.<P>2. The Jewish Liturgy:<P>The actions in connection with Azazel, as was also the case with the Day of Atonement, were interpreted more fully by the Talmud and the traditions based on it (compare <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">ATONEMENT, DAY OF</a>, sec. III, 2). The lots could be made of different materials; in later times they were made of gold. The manner of casting the lots was described in full. The goat that was to be sent into the wilderness was designated by a black mark on the head, the other by one on the neck. On the way from Jerusalem to the wilderness, huts were erected. From a distance it was possible to see how the goat was hurled backward from a certain cliff, called Beth-Hadudu (Beth-chadedun, 12 miles east of Jerusalem). By means of signals made with garments, news was at once sent to Jerusalem when the wilderness had been reached.``122';
isbe[1010]='Azaziah`az-a-zi\'-a (\'azazyahu, "Yahweh is strong," or "strengthens"):<P>(1) A Levite musician who participated in the services held on the return of the ark to Jerusalem (<a onClick="return mV(\'1Ch\',15,21);">1Ch 15:21</a>). His name is omitted from the list in <a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18</a>.<P>(2) Father of Hoshea, who was the leader of Ephraim at the time that David enumerated the people (<a onClick="return mV(\'1Ch\',27,20);">1Ch 27:20</a>).<P>(3) A Levite who had charge of the offerings brought to the temple in the days of Hezekiah (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>).``1';
isbe[1011]='Azbasareth`az-bas\'-a-reth: The name of an Assyrian king. The King James Version form "Azbasareth" comes from the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.)`<a href="./study/isbe/search.html?string=ASBASARETH">ASBASARETH</a>`1';
isbe[1012]='Azbuk`az\'-buk \'azbuk: The father of a certain Nehemiah—not the great governor of the same name, though a contemporary (<a onClick="return mV(\'Neh\',3,16);">Ne 3:16</a>).``1';
isbe[1013]='Azekah`a-ze\'-ka \'azekah: A town of some importance in the Shephelah of Judah mentioned (<a onClick="return mV(\'Jos\',15,35);">Jos 15:35</a>) next to Socoh. In <a onClick="return mV(\'Jos\',10,10);">Jos 10:10</a> the defeated kings of the Arnorites are described as flying before Joshua "by the way of the ascent of Beth-horon...to Azekah, and unto Makkedah" and (<a onClick="return mV(\'Jos\',10,11);">Jos 10:11</a>) as the host fled "Yahweh cast down great stones from heaven upon them unto Azekah, and they died." In <a onClick="return mV(\'1Sa\',17,1);">1Sa 17:1</a> it is recorded that before David\'s combat with Goliath, the Philistines "gathered together at Socoh, which belongeth to Judah, and encamped between Socoh and Azekah, in Ephes-dammin." In <a onClick="return mV(\'2Ch\',11,9);">2Ch 11:9</a> it is mentioned as one of the frontier cities which Rehoboam fortified and in <a onClick="return mV(\'Jer\',34,7);">Jer 34:7</a> it is one of the two fortified cities remaining to Judah in the Shephelah which Nebuchadnezzar was besieging. "Azekah and the towns (margin, "daughters") thereof" is mentioned among the cities reoccupied by Jews returning after the Exile (<a onClick="return mV(\'Neh\',11,30);">Ne 11:30</a>). In all the three last references the place is mentioned along with Lachish.<P>All the data suit Tell Zaqareyeh on the north side of the Vale of Elah (Wady es-Sunt) and some 3 miles Northwest of Socoh (Kh. Shuweikeh). This site, which was partially excavated by the Palestine Exploration Fund, is one of great natural strength. "The hill stands almost isolated, rising abruptly for almost 350 ft. above the Vale of Elah;...to the west the fall is also very great, while to the south the tell is joined by a neck of land (about 100 ft. below the summit) to a hill behind." The summit is about 350 yds. by 150 yds., and is much larger than Tell el-Chesy (Lachish) (Bliss). Excavations showed that it was a very ancient site which had been powerfully fortified, and the rock under the city was excavated in a series of very extraordinary underground chambers which could be used as places of refuge. The site suits the narrative of Joshua\'s battle every well, as there is a long-used high route running north to south from the neighborhood of Ajalon. Its position as a frontier fortress is comparable with that of Lachish: the name Zakareyeh, seems to be a survival of Azekah. See PEFS, 1899, 10ff; PEF, III, 441.``117';
isbe[1014]='Azel`a\'-zel (\'atsel, "noble"):<P>(1) A descendant of King Saul, through Jonathan (<a onClick="return mV(\'1Ch\',8,37);">1Ch 8:37</a>f; <a onClick="return mV(\'1Ch\',9,37);">9:43</a>f).<P>(2) Azel, a\'-zel, the King James Version Azal \'atsel; Asael; (<a onClick="return mV(\'Zec\',14,5);">Zec 14:5</a>): A place not far from Jerusalem. There may be an echo of the name in that of Wady Yasal, to the right of \'Ain el-Loz, in Wady en-Nar.``1';
isbe[1015]='Azem`a\'-zem: the King James Version form for Ezem (thus the Revised Version (British and American)) (<a onClick="return mV(\'Jos\',15,29);">Jos 15:29</a>; <a onClick="return mV(\'Jos\',19,3);">19:3</a>).``1';
isbe[1016]='Azephurith`az-e-fu\'-rith.`<a href="./study/isbe/search.html?string=ARSIPHURITH">ARSIPHURITH</a>`1';
isbe[1017]='Azetas`a-ze\'-tas (Azetas): The head of a family accompanying Zerubbabel out of captivity (1Esdras 5:15). Neither Ezra nor Nehemiah gives this name in his list. There may be an echo of the name in that of Wady Yasal, to the right of \'Ain el-Loz, in Wady en- Nar.``1';
isbe[1018]='Azgad`az\'-gad (\'azgadh, "strong is Gad"): In the list of those who returned from Babylon with Zerubbabel are mentioned "the children of Azgad" (1,222, <a onClick="return mV(\'Ezr\',2,12);">Ezr 2:12</a>; <span class="noTag">2,322</span>; <a onClick="return mV(\'Neh\',7,17);">Ne 7:17</a>). 110 males with their chief returned with Ezra (<a onClick="return mV(\'Ezr\',8,12);">Ezr 8:12</a>). Azgad was among the leaders who signed the Covenant after Nehemiah (<a onClick="return mV(\'Neh\',10,15);">Ne 10:15</a>).``1';
isbe[1019]='Aziei`a-zi\'-e-i: An ancestor of Ezra (2Esdras 1:2). Compare Azariah (<a onClick="return mV(\'Ezr\',7,3);">Ezr 7:3</a>) and Ozias (1Esdras 8:2; the King James Version Ezias).``1';
isbe[1020]='Aziel`a\'-zi-el (\'aziel, "God is power"); (compare Gray, Studies in Hebrew Proper Names, 210, 309): A Levite singer who played the psalteries (<a onClick="return mV(\'1Ch\',15,20);">1Ch 15:20</a>); compare Jaaziel (<a onClick="return mV(\'1Ch\',15,18);">1Ch 15:18</a>).``1';
isbe[1021]='Aziza`a-zi\'-za (\'aziza\' "the powerful"): Aziza had taken a foreign wife (<a onClick="return mV(\'Ezr\',10,27);">Ezr 10:27</a>): compare Zardeus (1Esdras 9:28 the Revised Version (British and American)).``1';
isbe[1022]='Azmaveth (1)`az-ma\'-veth \'azmaweth:<P>(1) One of David\';s 30 mighty men (<a onClick="return mV(\'2Sa\',23,31);">2Sa 23:31</a>; <a onClick="return mV(\'1Ch\',11,33);">1Ch 11:33</a>).<P>(2) A descendant of Jonathan, the son of Saul (<a onClick="return mV(\'1Ch\',8,36);">1Ch 8:36</a>; <a onClick="return mV(\'1Ch\',9,42);">9:42</a>).<P>(3) Father of two warriors who joined David at Ziklag (<a onClick="return mV(\'1Ch\',12,3);">1Ch 12:3</a>).<P>(4) The name of one set over David\'s treasures (<a onClick="return mV(\'1Ch\',27,25);">1Ch 27:25</a>). Some identify him with (1) and (3).``1';
isbe[1023]='Azmaveth (2)`az-ma\'-veth (\'azmaweth; Asmoth or Azmoth, "strong one of death"; <a onClick="return mV(\'Ezr\',2,24);">Ezr 2:24</a>): Is probably identical with el-Chizma, a village a little to the north of \'Anata (Anathoth). It corresponds to Beth-azmaveth (<a onClick="return mV(\'Neh\',7,28);">Ne 7:28</a>).``1';
isbe[1024]='Azmon`az\'-mon (\'atsmon; Asemona, "strong"): On the southwest border of Israel (<a onClick="return mV(\'Num\',34,4,5);">Nu 34:4-5</a>; <a onClick="return mV(\'Jos\',15,4);">Jos 15:4</a>). Trumbull identifies it with \'Ain el-Qaseimeh, Northwest of Kadesh Barnea (Kad. Baruch., 117, 289f).``1';
isbe[1025]='Aznoth-Tabor`az\'noth-ta\'-bor (\'aznoth tabhor, "peaks of Tabor"): A place in western Naphtali, evidently in the vicinity of Mt. Tabor (<a onClick="return mV(\'Jos\',19,34);">Jos 19:34</a>). The exact locality is not known.``1';
isbe[1026]='Azor`a\'-zor Azor, "help"(?): An ancestor of Jesus Christ (<a onClick="return mV(\'Mat\',1,13);">Mt 1:13</a>f).``1';
isbe[1027]='Azotus`a-zo\'-tus.`<a href="./study/isbe/search.html?string=ASHDOD">ASHDOD</a>`1';
isbe[1028]='Azriel`az\'-ri-el (\'azri\'el, "God\'s help"):<P>(1) One of the leading men of the half-tribe of Manasseh, east of the Jordan, who with others of his tribe was carried captive by the king of Assyria (<a onClick="return mV(\'1Ch\',5,24);">1Ch 5:24</a>ff).<P>(2) The father of Jerimoth of the tribe of Naphtali in the reign of King David (<a onClick="return mV(\'1Ch\',27,19);">1Ch 27:19</a>).<P>(3) The father of Seraiah, one of the officers sent by Jehoiakim to arrest Jeremiah and Baruch (<a onClick="return mV(\'Jer\',36,26);">Jer 36:26</a>).``1';
isbe[1029]='Azrikam`az-ri\'-kam (\'azriqam, "my help has arisen"):<P>(1) A descendant of King David through Zerubbabel (<a onClick="return mV(\'1Ch\',3,23);">1Ch 3:23</a>).<P>(2) A prince of Judah in the time of Ahaz. He was slain by Zichri, an Ephraimite soldier (<a onClick="return mV(\'2Ch\',28,7);">2Ch 28:7</a>).<P>(3) One of Azel\'s sons, a Benjamite, descended from King Saul (<a onClick="return mV(\'1Ch\',8,38);">1Ch 8:38</a>; <a onClick="return mV(\'1Ch\',9,44);">9:44</a>).<P>(4) A Levite of the house of Merari and a resident of Jerusalem (<a onClick="return mV(\'1Ch\',9,14);">1Ch 9:14</a>; <a onClick="return mV(\'Neh\',11,15);">Ne 11:15</a>).``1';
isbe[1030]='Azubah`a-zu\'-ba (\'azubhah, "desolation"):<P>(1) A wife of Caleb, by whom she had three sons (<a onClick="return mV(\'1Ch\',2,18);">1Ch 2:18</a>f).<P>(2) The daughter of Shilhi and mother of King Jehoshaphat (<a onClick="return mV(\'1Ki\',22,42);">1Ki 22:42</a>; <a onClick="return mV(\'2Ch\',20,31);">2Ch 20:31</a>).``1';
isbe[1031]='Azur`a\'-zur`<a href="./study/isbe/search.html?string=AZZUR">AZZUR</a>`1';
isbe[1032]='Azuran`az\'-u-ran, a-zu\'-ran.`<a href="./study/isbe/search.html?string=AZARU">AZARU</a>`1';
isbe[1033]='Azzah`az\'-a (\'azzah, "strong"): the King James Version form (<a onClick="return mV(\'Deu\',2,23);">De 2:23</a>; <a onClick="return mV(\'1Ki\',4,24);">1Ki 4:24</a>; <a onClick="return mV(\'Jer\',25,20);">Jer 25:20</a>) for the Revised Version (British and American) "Gaza."``1';
isbe[1034]='Azzan`az\'-an (\'azzan, "strong" or "thorn"): Father of Paltiel of the tribe of Issachar. One of the commissioners selected to divide the land between the tribes (<a onClick="return mV(\'Num\',34,26);">Nu 34:26</a>).``1';
isbe[1035]='Azzur`az\'-ur (\'azzur, "helpful"):<P>(1) The father of Hananiah, a false prophet of Gibeon in the days of Zedekiah (<a onClick="return mV(\'Jer\',28,1);">Jer 28:1</a>ff).<P>(2) One of those who, with Nehemiah, sealed the covenant on the return from Babylon (<a onClick="return mV(\'Neh\',10,17);">Ne 10:17</a>).<P>(3) The father of Jaazaniah, "one of" the princes of the people who gave wicked counsel to the city of Jerusalem (<a onClick="return mV(\'Eze\',11,1);">Eze 11:1</a>f). the King James Version has "Azur" for (1) and (3), but the Hebrew form of (3) is \'azur.``1';
isbe[1036]='Baal (1)`ba\'-al: (ba\'al; or Baal): The Babylonian Belu or Bel, "Lord," was the title of the supreme god among the Canaanites.<P><b>I. NAME AND CHARACTER OF BAAL</b><P><b>II. ATTRIBUTES OF BAAL</b><P><b>III. BAAL-WORSHIP</b><P><b>IV. TEMPLES, ETC.</b><P><b>V. USE OF THE NAME</b><P><b>VI. FORMS OF BAAL</b><P class="in15">1. Baal-berith<P class="in15">2. Baal-gad<P class="in15">3. Baal-hamon<P class="in15">4. Baal-hermon<P class="in15">5. Baal-peor<P class="in15">6. Baal-zebub<hr /><P>I. Name and Character of Baal:<P>In Babylonia it was the title specially applied to Merodach of Babylon, which in time came to be used in place of his actual name. As the word in Hebrew also means "possessor," it has been supposed to have originally signified, when used in a religious sense, the god of a particular piece of land or soil. Of this, however, there is no proof, and the sense of "possessor" is derived from that of "lord." The Babylonian Bel-Merodach was a Sun-god, and so too was the Can Baal whose full title was Baal-Shemaim, "lord of heaven." The Phoenician writer Sanchuniathon (Philo Byblius, Fragmenta II) accordingly says that the children of the first generation of mankind "in time of drought stretched forth their hands to heaven toward the sun; for they regarded him as the sole Lord of heaven, and called him Beel-samen, which means \'Lord of Heaven\' in the Phoenician language and is equivalent to Zeus in Greek" Baal-Shemaim had a temple at Umm el-Awamid between Acre and Tyre, and his name is found in inscriptions from the Phoenician colonies of Sardinia and Carthage.<P>II. Attributes of Baal:<P>As the Sun-god, Baal was worshipped under two aspects, beneficent and destructive. On the one hand he gave light and warmth to his worshippers; on the other hand the fierce heats of summer destroyed the vegetation he had himself brought into being. Hence, human victims were sacrificed to him in order to appease his anger in time of plague or other trouble, the victim being usually the first-born of the sacrificer and being burnt alive. In the Old Testament this is euphemistically termed "passing" the victim "through the fire" (<a onClick="return mV(\'2Ki\',16,3);">2Ki 16:3</a>; <a onClick="return mV(\'2Ki\',21,6);">21:6</a>). The forms under which Baal was worshipped were necessarily as numerous as the communities which worshipped him. Each locality had its own Baal or divine "Lord" who frequently took his name from the city or place to which he belonged. Hence, there was a Baal-Zur, "Baal of Tyre"; Baal-hermon, "Baal of Hermon" (<a onClick="return mV(\'Jdg\',3,3);">Jud 3:3</a>); Baal-Lebanon, "Baal of Lebanon"; Baal-Tarz, "Baal of Tarsus." At other times the title was attached to the name of an individual god; thus we have Bel-Merodach, "the Lord Merodach" (or "Bel is Merodach") at Babylon, Baal-Melkarth at Tyre, Baal-gad (<a onClick="return mV(\'Jos\',11,17);">Jos 11:17</a>) in the north of Palestine. Occasionally the second element was noun as in Baal-Shemaim, "lord of heaven," Baalzebub (<a onClick="return mV(\'2Ki\',1,2);">2Ki 1:2</a>), "Lord of flies," Baal-Hamman, usually interpreted "Lord of heat," but more probably "Lord of the sunpillar," the tutelary deity of Carthage. All these various forms of the Sun-god were collectively known as the Baalim or "Baals" who took their place by the side of the female Ashtaroth and Ashtrim. At Carthage the female consort of Baal was termed Pene-Baal, "the face" or "reflection of Baal."<P>III. Baal-Worship:<P>In the earlier days of Hebrew history the title Baal, or "Lord," was applied to the national God of Israel, a usage which was revived in later times, and is familiar to us in the King James Version. Hence both Jonathan and David had sons called Merib-baal (<a onClick="return mV(\'1Ch\',8,31);">1Ch 8:31</a>; <a onClick="return mV(\'1Ch\',9,40);">9:40</a>) and Beeliada (<a onClick="return mV(\'1Ch\',14,7);">1Ch 14:7</a>). After the time of Ahab, however, the name became associated with the worship and rites of the Phoenician deity introduced into Samaria by Jezebel, and its idolatrous associations accordingly caused it to fall into disrepute. <a onClick="return mV(\'Hsa\',2,16);">Hosea 2:16</a> declares that henceforth the God of Israel should no longer be called Baali, "my Baal," and personal names like Esh-baal (<a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a>; <a onClick="return mV(\'1Ch\',9,39);">9:39</a>), and Beelinda into which it entered were changed in form, Baal being turned into bosheth which in Heb at any rate conveyed the sense of "shame."<P>IV. Temples, etc.:<P>Temples of Baal at Samaria and Jerusalem are mentioned in <a onClick="return mV(\'1Ki\',1,18);">1Ki 1:18</a>; where they had been erected at the time when the Ahab dynasty endeavored to fuse Israelites and Jews and Phoenicians into a single people under the same national Phoenician god. Altars on which incense was burned to Baal were set up in all the streets of Jerusalem according to Jeremiah (<a onClick="return mV(\'Jer\',11,13);">11:13</a>), apparently on the flat roofs of the houses (<a onClick="return mV(\'Jer\',32,29);">Jer 32:29</a>); and the temple of Baal contained an image of the god in the shape of a pillar or Bethel (<a onClick="return mV(\'2Ki\',10,26,27);">2Ki 10:26-27</a>). In the reign of Ahab, Baal was served in Israel by 450 priests (<a onClick="return mV(\'1Ki\',18,19);">1Ki 18:19</a>), as well as by prophets (<a onClick="return mV(\'2Ki\',10,19);">2Ki 10:19</a>), and his worshippers wore special vestments when his ritual was performed (<a onClick="return mV(\'2Ki\',10,22);">2Ki 10:22</a>). The ordinary offering made to the god consisted of incense (<a onClick="return mV(\'Jer\',7,9);">Jer 7:9</a>) and burnt sacrifices; on extraordinary occasions the victim was human (<a onClick="return mV(\'Jer\',19,5);">Jer 19:5</a>). At times the priests worked themselves into a state of ecstasy, and dancing round the altar slashed themselves with knives (<a onClick="return mV(\'1Ki\',18,26,28);">1Ki 18:26, 28</a>), like certain dervish orders in modern Islam.<P>V. Use of the Name.<P>In accordance with its signification the name of Baal is generally used with the definite art.; in the Septuagint this often takes the feminine form, aischane "shame" being intended to be read. We find the same usage in <a onClick="return mV(\'Rom\',11,4);">Ro 11:4</a>. The feminine counterpart of Baal was Baalah or Baalath which is found in a good many of the local names (see Baethgen, Beltrage zur semitischen Religionsgeschichte, 1888).<P>VI. Forms of Baal.<P>1. Baal-berith:<P>Baal-berith ba\'al berith; Baalberith, "Covenant Baal," was worshipped at Shechem after the death of Gideon (<a onClick="return mV(\'Jdg\',8,33);">Jud 8:33</a>; <a onClick="return mV(\'Jdg\',9,4);">9:4</a>). In <a onClick="return mV(\'Jdg\',9,46);">Jud 9:46</a> the name is replaced by El-berith, "Covenant-god." The covenant was that made by the god with his worshippers, less probably between the Israelites and the native Canaanites.<P>2. Baal-gad:<P>Baal-gad ba\'al gadh; Balagada, "Baal [lord] of good luck" (or "Baal is Gad") was the god of a town called after his name in the north of Palestine, which has often been identified with Baalbek. The god is termed simply Gad in <a onClick="return mV(\'Isa\',65,11);">Isa 65:11</a> the Revised Version, margin; where he is associated with Meni, the Assyrian Manu (King James Version "troop" and "number").<P>3. Baal-hamon:<P>Baal-hamon ba\'al hamon; Beelamon is known only from the fact that Solomon had a garden at a place of that name (<a onClick="return mV(\'Sgs\',8,11);">So 8:11</a>). The name is usually explained to mean "Baal of the multitude," but the cuneiform tablets of the Tell el-Amarna age found in Palestine show that the Egyptian god Amon was worshipped in Canaan and identified there with the native Baal. We are therefore justified in reading the name Baal-Amon, a parallel to the Babylonian Bel-Merodach. The name has no connection with that of the Carthaginian deity Baal-hamman.<P>4. Baal-hermon:<P>Baal-hermon ba\'al chermon; Balaermon is found in the name of "the mountain of Baal-hermon" (<a onClick="return mV(\'Jdg\',3,3);">Jud 3:3</a>; compare <a onClick="return mV(\'1Ch\',5,23);">1Ch 5:23</a>), which also bore the names of Hermort, Sirion and Shenir (Saniru in the Assyrian inscriptions), the second name being applied to it by the Phoenicians and the third by the Amorites (<a onClick="return mV(\'Deu\',3,9);">De 3:9</a>). Baal-hermon will consequently be a formation similar to Baal-Lebanon in an inscription from Cyprus; according to the Phoenician writer Sanchuniathon (Philo Byblius, Fragmenta II) the third generation of men "begat sons of surprising size and stature, whose names were given to the mountains of which they had obtained possession."<P>5. Baal-peor:<P>Baal-peor ba\'al pe\'or; Beelphegor was god of the Moabite mountains, who took his name from Mount Peor (<a onClick="return mV(\'Num\',23,28);">Nu 23:28</a>), the modern Fa\'ur, and was probably a form of Chemosh (Jerome, Comm., <span class="noTag">Isaiah 15</span>). The sensual rites with which he was worshipped (<a onClick="return mV(\'Num\',25,1,2,3);">Nu 25:1-3</a>) indicate his connection with the Phoenician Baal.<P>6. Baal-zebub:<P>Baal-zebub ba\'al zebhubh; Baalmuia Theos ("Baal the fly god") was worshipped at Ekron where he had famous oracle (<a onClick="return mV(\'2Ki\',1,2,3,16);">2Ki 1:2-3, 16</a>). The name is generally translated "the Lord of flies," the Sun-god being associated with the flies which swarm in Palestine during the earlier summer months. It is met with in Assyrian inscriptions. In the New Testament the name assumes the form of Beelzebul Beelzeboul, in King James Version: <a href="./study/isbe/search.html?string=BEELZEBUB">BEELZEBUB</A> (which see).``157';
isbe[1037]='Baal (2)`ba\'-al ba\'al, ("lord," "master," "possessor"):<P>(1) A descendant of Reuben, Jacob\'s first-born son, and the father of Beerah, prince of the Reubenitcs, "whom Tiglath-pileser (<a onClick="return mV(\'1Ch\',5,5,6);">1Ch 5:5-6</a>) king of Assyria carried away captive."<P>(2) The fourth of ten sons of Jeiel (King James Version "Jehiel"), father and founder of Gibeon. His mother was Maacah; his brother Kish father of Saul (<a onClick="return mV(\'1Ch\',8,29);">1Ch 8:29</a>f; <a onClick="return mV(\'1Ch\',9,35,36,39);">9:35-36,39</a>; compare <a onClick="return mV(\'1Sa\',14,5);">1Sa 14:50</a>f). These passages identify Jeiel and Abiel as the father of Kish and thus of Baal. For study of confusions in the genealogical record, in <a onClick="return mV(\'1Ch\',9,36,39);">1Ch 9:36, 39</a>, see <a href="./study/isbe/search.html?string=KISH">KISH</a>; <a href="./study/isbe/search.html?string=ABIEL">ABIEL</a>; <a href="./study/isbe/search.html?string=JEIEL">JEIEL</A>.<P>(3) In composition often the name of a man and not of the heathen god, e.g. Baal-hanan, a king of Edom (<a onClick="return mV(\'Gen\',36,38);">Ge 36:38</a>; <a onClick="return mV(\'1Ch\',1,49);">1Ch 1:49</a>); also a royal prefect of the same name (<a onClick="return mV(\'1Ch\',27,28);">1Ch 27:28</a>). Gesenius thinks that Baal in compound words rarely refers to the god by that name. See <a href="./study/isbe/search.html?string=BAAL">BAAL</a> (deity).<P>(4) A city of the tribe of Simeon (<a onClick="return mV(\'1Ch\',4,33);">1Ch 4:33</a>).`<a href="./study/isbe/search.html?string=BAALATH+BEER">BAALATH-BEER</a>`139';
isbe[1038]='Baal (3)`ba\'al; Baal <a onClick="return mV(\'1Ch\',4,33);">1Ch 4:33</a>.`<a href="./study/isbe/search.html?string=BAALATH+BEER">BAALATH-BEER</a>`1';
isbe[1039]='Baal-Berith`ba-al-be\'-rith ba\'al berith =(" Baal of the Covenant"): An idol worshipped by the Shechemites after Gideon\'s death (<a onClick="return mV(\'Jdg\',8,33);">Jud 8:33</a>), as protector and guardian of engagements. His temple is also referred to in <a onClick="return mV(\'Jdg\',9,4);">Jud 9:4</a>.`<a href="./study/isbe/search.html?string=BAAL">BAAL</a>`1';
isbe[1040]='Baal-Gad`ba\'-al-gad ba\'al gadh; Balagada, Balgad: Joshua in his conquest reached as far north as \'Baal-gad in the valley\' of Lebanon, under Mount Hermon (<a onClick="return mV(\'Jos\',11,17);">Jos 11:17</a>). This definitely locates it in the valley between the Lebanons, to the west or northwest of Hermon. It must not be confused with Baal-hermon. Conder thinks it may be represented by \'Ain Jedeideh.``1';
isbe[1041]='Baal-Hamon`ba-al-ha\'-mon.`<a href="./study/isbe/search.html?string=BAAL">BAAL</a>`1';
isbe[1042]='Baal-Hanan`ba-al-ha\'-nan ba\'al chanan, ("the Lord is gracious"):<P>(1) A king of Edom (<a onClick="return mV(\'Gen\',36,38);">Ge 36:38</a>f; <a onClick="return mV(\'1Ch\',1,49);">1Ch 1:49</a>f).<P>(2) A gardener in the service of David (<a onClick="return mV(\'1Ch\',27,28);">1Ch 27:28</a>).``1';
isbe[1043]='Baal-Hazor`ba-al-ha\'-zor ba\'al chatsor; Bailasor, Bel-la-sor: A place on the property of Absalom where his sheep-shearers were gathered, beside Ephraim (<a onClick="return mV(\'2Sa\',13,23);">2Sa 13:23</a>). The sheep-shearing was evidently the occasion of a festival which was attended by Absalom\'s brethren. Here he compassed the death of Amnon in revenge for the outrage upon his sister. The place may be identified with Tell \'Asur, a mountain which rises 3,318 ft. above the sea, 4 miles Northeast of Bethel. rine Kubbet el Baul may retain the old name.``1';
isbe[1044]='Baal-Hermon`ba\'-al-hur\'-mon ba\'al chermon; Baal Ermon: Baalgad under Mount Hermon is described as "toward the sunrising" in <a onClick="return mV(\'Jos\',13,5);">Jos 13:5</a>. If Mount Lebanon proper is here intended the reading may be taken as correct. But in <a onClick="return mV(\'Jdg\',3,3);">Jud 3:3</a> Baal-gad is replaced by Baal-hermon. One or the other must be due to a scribal error. The Baal-hermon of <a onClick="return mV(\'1Ch\',5,23);">1Ch 5:23</a> lay somewhere east of the Jordan, near to Mount Hermon. It may possibly be identical with Banias.``1';
isbe[1045]='Baal-Meon`ba\'-al-me\'-on ba\'al me\'on; Beelmeon: A town built by the children of Reuben along with Nebo, "their names being changed" (<a onClick="return mV(\'Num\',32,38);">Nu 32:38</a>), identical with Beon of <a onClick="return mV(\'Num\',32,3);">Nu 32:3</a>. As Beth-baal-meon it was given by Moses to the tribe of Reuben (<a onClick="return mV(\'Jos\',13,17);">Jos 13:17</a>). Mesha names it as fortified by him (MS, L. 9). It appears in <a onClick="return mV(\'Jer\',48,23);">Jer 48:23</a> as Beth-meon, one of the cities of Moab. Eusebius, Onomasticon speaks of it as a large village near the hot springs, i.e. Callirrhoe, in Wady Zerka Ma\'in, 9 miles from Heshbon. This points to the ruined site of Ma\'in, about 4 miles southwest of Madeba. The ruins now visible however are not older than Roman times.``54';
isbe[1046]='Baal-Peor`ba-al-pe\'-or.`<a href="./study/isbe/search.html?string=BAAL">BAAL</a>`1';
isbe[1047]='Baal-Perazim`ba-al-pe-ra\'-zim, ba-al-per\'-azim ba\'al peratsim; Baal\'pharasein, ("the lord of breakings through"): The spot in or near the Valley of Rephaim where David obtained a signal victory over the Philistines; it was higher than Jerusalem for David asked, "Shall I go up against the Philis?" (<a onClick="return mV(\'2Sa\',5,20);">2Sa 5:20</a>; <a onClick="return mV(\'1Ch\',14,11);">1Ch 14:11</a>). The exact site is unknown, but if the Vale of Rephaim is el Beka\'a, the open valley between Jerusalem and Mar Elias, then Baal-perazim would probably be the mountains to the east near what is called the "Mount of Evil Counsel" (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>). The Mount Perazim of <a onClick="return mV(\'Isa\',28,21);">Isa 28:21</a> would appear to be the same spot.``117';
isbe[1048]='Baal-Shalishah`ba-al-shal\'-i-sha, ba-al-shale-\'sha ba\'al shalishah; Baithsarisa: Whence a man came to Gilgal with first-fruits (<a onClick="return mV(\'2Ki\',4,42);">2Ki 4:42</a>) was probably not far from the latter place. According to the Talmud (Sanh. 12a) the fruits of the earth nowhere ripened so quickly. It is called by Eusebius Baithsarith (Jerome "Bethsalisa"), and located 15 miles north of Diospolis (Lydda). Khirbet Sirisia almost exactly fits this description. Gilgal (Jiljulieh) lies in the plain about 4 1/2 miles to the Northwest Khirbet Kefr Thilth, 3 1/2 miles farther north, has also been suggested. The Arabic Thilth exactly corresponds to the Hebrew Shalishah.``54';
isbe[1049]='Baal-Tamar`ba-al-ta\'-mar ba\'al tamar; Baal Thamar, ("Baal of the palm tree"): Evidently a seat of heathen worship (<a onClick="return mV(\'Jdg\',20,33);">Jud 20:33</a>) between Bethel and Gibeah (compare <a onClick="return mV(\'Jdg\',20,18,31);">Jud 20:18, 31</a>). The place was known to Eusebius (Onomasticon, which see), but trace of the name is now lost. Conder suggests that it may be connected with the palm tree of Deborah (<a onClick="return mV(\'Jdg\',4,5);">Jud 4:5</a>) which was between Bethel and Ramah (HDB, under the word).``1';
isbe[1050]='Baal-Zephon`ba-al-ze\'-fon ba\'al tsephon; Beelsepphon; (<a onClick="return mV(\'Exd\',14,2,9);">Ex 14:2, 9</a>; <a onClick="return mV(\'Num\',33,7);">Nu 33:7</a>): The name means "Lord of the North," and the place was opposite the Hebrew camp, which was between Migdol and the sea. It may have been the shrine of a Semitic deity, but the position is unknown (see <a href="./study/isbe/search.html?string=EXODUS">EXODUS</a>). Goodwin (see Brugsch, Hist. Egt., II, 363) found the name Baali-Zapuna as that of a god mentioned in an Egyptian papyrus in the British Museum.``1';
isbe[1051]='Baalah`ba\'-a-la ba\'alah; ("possessor," "mistress "): Three occurrences of this name:<P>(1) = <a href="./study/isbe/search.html?string=KIRIATH-JEARIM">KIRIATH-JEARIM</a> (which see) (<a onClick="return mV(\'Jos\',15,9,10);">Jos 15:9-10</a>; <a onClick="return mV(\'1Ch\',13,6);">1Ch 13:6</a>).<P>(2) A city in the Negeb of Judah (<a onClick="return mV(\'Jos\',15,29);">Jos 15:29</a>). In <a onClick="return mV(\'Jos\',19,3);">Jos 19:3</a> Balah and in <a onClick="return mV(\'1Ch\',4,29);">1Ch 4:29</a> Bilhah; perhaps also Boaloth of <a onClick="return mV(\'Jos\',15,24);">Jos 15:24</a>. The site is unknown; but see PEF, III, 26.<P>(3) Mount Baalah (<a onClick="return mV(\'Jos\',15,11);">Jos 15:11</a>), a mountain ridge between Shikkeron (Ekron) and Jabnoel unless, as seems probable, the suggestion of M. Clermont-Ganneau (Rev. Crit, 1897, 902) is correct that for har (= "mount"), we should read nahar ("river"). In this case the border in question would be the Nahr rubin. Here there is an annual feast held—attended by all classes and famous all over Syria—which appears to be a real survival of "Baal worship."``117';
isbe[1052]='Baalath`ba\'-a-lath ba\'alath; (A, Baalon): between Shikkeron (Ekron) and Jabnoel unless, as seems probable, the suggestion of M. Clermont-Ganneau (Rev. Crit, 1897, 902) is correct that for har (= "mount"), we should read nahar ("river"). In this case the border in question would be the Nahr rubin. Here there is an annual feast held—attended by all classes and famous all over Syria—which appears to be a real survival of "Baal worship."<P>(1) A town on the border of Dan (<a onClick="return mV(\'Jos\',19,44);">Jos 19:44</a>) associated with Eltekeh and Gibbethon—possibly Bela\'in.<P>(2) ("Mistress-ship"): A store city of Solomon, mentioned with Beth-horon (<a onClick="return mV(\'1Ki\',9,18);">1Ki 9:18</a>; <a onClick="return mV(\'2Ch\',8,6);">2Ch 8:6</a>) and possibly the same as (1).``1';
isbe[1053]='Baalath-Beer`ba\'-a-lath-be\'-er ba\'alath be\'er "lady (mistress) of the well"; (<a onClick="return mV(\'Jos\',19,8);">Jos 19:8</a> (in <a onClick="return mV(\'1Ch\',4,33);">1Ch 4:33</a>, Baal)): In Joshua this place is designated "Ramah of the South," i.e. of the Negeb, while in <a onClick="return mV(\'1Sa\',30,27);">1Sa 30:27</a> it is described as Ramoth of the Negeb. It must have been a prominent hill (ramah = "height") in the far south of the Negeb and near a well be\'er. The site is unknown though Conder suggests that the shrine Kubbet el Baul may retain the old name.``1';
isbe[1054]='Baalbek`bal\'-bek, bal-bek\'.`<a href="./study/isbe/search.html?string=AVEN">AVEN</a>; <a href="./study/isbe/search.html?string=ON">ON</a>`1';
isbe[1055]='Baale-Judah`ba\'-al-e-joo\'-da.`<a href="./study/isbe/search.html?string=KIRIATH+JEARIM">KIRIATH-JEARIM</a>`1';
isbe[1056]='Baali`ba\'-a-li ba\'ali, ("my master"): Baal, a common name for all heathen gods, had in common practice been used also of Yahweh. Hosea (<a onClick="return mV(\'Hsa\',2,16,17);">Ho 2:16-17</a>) demands that Yahweh be no longer called Ba\'ali ("my Baal" = "my lord") but \'Ishi ("my husband"), and we find that later the Israelites abandoned the use of Ba\'al for Yahweh.``1';
isbe[1057]='Baalim`ba\'-a-lim ha-be\'alim: Plur. of <a href="./study/isbe/search.html?string=BAAL">BAAL</a> (which see).``1';
isbe[1058]='Baalis`ba\'-a-lis ba\'lic, perhaps for Baalim, "gods"; Septuagint Beleisa, Belisa, [Baalis]; Ant, X, ix,3,Baalimos: King of the children of Ammon, the instigator of the murder of Gedaliah (<a onClick="return mV(\'Jer\',40,14);">Jer 40:14</a>). Compare Ant, X, ix, 3.``1';
isbe[1059]='Baalsamus`ba-al\'-sa-mus Baalsamos; (the King James Version Balasamus): B. stood at the right side of Ezra, when the law was read to the people (1Esdras 9:43). Compare Maaseiah (<a onClick="return mV(\'Neh\',8,7);">Ne 8:7</a>). the Valley of Rephaim where David obtained a signal victory over the Philistines; it was higher than Jerusalem for David asked, "Shall I go up against the Philis?" (<a onClick="return mV(\'2Sa\',5,20);">2Sa 5:20</a>; <a onClick="return mV(\'1Ch\',14,11);">1Ch 14:11</a>). The exact site is unknown, but if the Vale of Rephaim is el Beka\'a, the open valley between Jerusalem and Mar Elias, then Baal-perazim would probably be the mountains to the east near what is called the "Mount of Evil Counsel" (see <a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>). The Mount Perazim of <a onClick="return mV(\'Isa\',28,21);">Isa 28:21</a> would appear to be the same spot.``1';
isbe[1060]='Baalzebub`ba-al-ze\'-bub ba\'al zebhubh = "Lord of flies"; Baal-muian: A deity worshipped by the Philistines at Ekron (<a onClick="return mV(\'2Ki\',1,2,3,6,16);">2Ki 1:2, 3, 6, 16</a>). All that can be gathered from this one reference to him in ancient literature is that he had some fame as a god that gave oracles. Ahaziah, son of Ahab, and king of Israel, went to consult him whether he should recover of his sickness, and was therefore rebuked by Elijah, who declared that his death would be the result of this insult to Yahweh. Why he was called "lord of flies," or whether his real name has not be en corrupted and lost are matters of conjecture.`<a href="./study/isbe/search.html?string=BAAL">BAAL</a>`1';
isbe[1061]='Baana`ba\'-a-na (Old Testament and Apocrypha; Baana; ba\'ana\' "son of oppression"):<P>(1, 2) Two commissariat-officers in the service of Solomon (<a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a>; <a onClick="return mV(\'1Ki\',4,16);">4:16</a>; the King James Version "Baanah").<P>(3) Father of Zadok, the builder (<a onClick="return mV(\'Neh\',3,4);">Ne 3:4</a>).<P>(4) A leader who returned with Zerubbabel to Jerusalem (1Esdras 5:8). Compare Bannah (<a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>; <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>; <a onClick="return mV(\'Neh\',10,27);">10:27</a>).``1';
isbe[1062]='Baanah`ba\'-a-na ba\'anah, ("son of oppression"):<P>(1) Captain in the army of Ish-bosheth (<a onClick="return mV(\'2Sa\',4,2);">2Sa 4:2</a>ff).<P>(2) Father of Iteleb, one of David\'s mighty men (<a onClick="return mV(\'2Sa\',23,29);">2Sa 23:29</a>; <a onClick="return mV(\'1Ch\',11,30);">1Ch 11:30</a>).<P>(3) Returned with Zerubbabel to Jerusalem; a leader and one who sealed the covenant (<a onClick="return mV(\'Ezr\',2,2);">Ezr 2:2</a>; <a onClick="return mV(\'Neh\',7,7);">Ne 7:7</a>; <a onClick="return mV(\'Neh\',10,27);">10:27</a>).`<a href="./study/isbe/search.html?string=BAANA">BAANA</a>`1';
isbe[1063]='Baani`ba\'-a-ni (A, Baani; B, Baanei; the King James Version Maani = Bani <a onClick="return mV(\'Ezr\',10,34);">Ezr 10:34</a>): The descendants of Baani put away their "strange wives" (1Esdras 9:34).``1';
isbe[1064]='Baanias`ba-a-ni\'as.`<a href="./study/isbe/search.html?string=BANNEAS">BANNEAS</a>`1';
isbe[1065]='Baara`ba\'-a-ra ba\'ara\',(" the burning one"): A wife of the Benjamite Shaharaim (<a onClick="return mV(\'1Ch\',8,8);">1Ch 8:8</a>).``1';
isbe[1066]='Baaseiah`ba-a-si\'a, ba-a-se\'-ya ba\'aseyah, ("the Lord is bold"): Perhaps for ma\'aseyah, after the Greek Maasai, B, Maasai, "the work of the Lord." Compare Gray, Studies in Hebrew Proper Names, 293. An ancestor of Asaph, the musician (<a onClick="return mV(\'1Ch\',6,40);">1Ch 6:40</a>).``1';
isbe[1067]='Baasha`ba\'-a-sha ba\'sha\',("boldness"): King of Israel. Baasha, son of Ahijah, and of common birth (<a onClick="return mV(\'1Ki\',16,2);">1Ki 16:2</a>), usurped the throne of Nadab, the son of Jeroboam, killed Nadab and exterminated the house of Jeroboam. He carried on a long warfare with Asa, the king of Judah (compare <a onClick="return mV(\'Jer\',41,9);">Jer 41:9</a>), began to build Ramah, but was prevented from completing this work by Ben- hadad, the king of Syria. He is told by the prophet Jehu that because of his sinful reign the fate of his house would be like that of Jeroboam. Baasha reigned 24 years. His son Elah who succeeded him and all the members of his family were murdered by the usurper Zimri (<a onClick="return mV(\'1Ki\',15,16);">1Ki 15:16</a>ff; <a onClick="return mV(\'1Ki\',16,1);">16:1</a>ff; <a onClick="return mV(\'2Ch\',16,1);">2Ch 16:1</a>ff). The fate of his house is referred to in <a onClick="return mV(\'1Ki\',21,22);">1Ki 21:22</a>; <a onClick="return mV(\'2Ki\',9,9);">2Ki 9:9</a>. Compare <a href="./study/isbe/search.html?string=ASA">ASA</a>; <a href="./study/isbe/search.html?string=ELAH">ELAH</a>; <a href="./study/isbe/search.html?string=ZIMRI">ZIMRI</a>.``16';
isbe[1068]='Babbler`bab\'-ler ba\'al ha-lashon; the King James Version of <a onClick="return mV(\'Ecc\',10,11);">Ec 10:11</a> literally, "master of the tongue"; the Revised Version (British and American) charmer; lapistes, the King James Version of Ecclesiasticus 20:7; the Revised Version (British and American) <a href="./study/isbe/search.html?string=BRAG">BRAG</A>; spermologos; the King James Version and the Revised Version (British and American) of <a onClick="return mV(\'Act\',17,18);">Ac 17:18</a>: The latter Greek word is used of birds, such as the crow, that live by picking up small seeds (sperma, "seed," legein, "to gather"), and of men, for "hangers on" and "parasites" who obtained their living by picking up odds and ends off merchants\' carts in harbors and markets. It carries the "suggestion of picking up refuse and scraps, and in the literature of plagiarism without the capacity to use correctly" (Ramsay). The Athenian philosophers in calling Paul a spermologos, or "ignorant plagiarist," meant that he retailed odds and ends of knowledge which he had picked up from others, without possessing himself any system of thought or skill of language—without culture. In fact it was a fairly correct description of the Athenian philosophers themselves in Paul\'s day.<P>Ramsay, Paul the Traveler and Roman Citizen, 141ff.``145';
isbe[1069]='Babbling`bab\'-ling siach; the Revised Version (British and American) <a href="./study/isbe/search.html?string=COMPLAINING">COMPLAINING</a>): The consequence of tarrying long at the wine (<a onClick="return mV(\'Pro\',23,29);">Pr 23:29</a> the King James Version); lalia, the Revised Version (British and American) "talk" (Ecclesiasticus 19:6; 20:5 the King James Version); kenophonia, literally, "making an empty sound" (<a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>; <a onClick="return mV(\'2Ti\',2,16);">2Ti 2:16</a> the King James Version and the Revised Version (British and American).``1';
isbe[1070]='Babe`bab:<P>(1) na\'ar; pais of a male infant 3 months old (<a onClick="return mV(\'Exd\',2,6);">Ex 2:6</a>) translated elsewhere "boy" or "lad."<P>(2) \'olel, ta\'alulim, in the general sense of "child" (<a onClick="return mV(\'Psa\',8,2);">Ps 8:2</a>; <a onClick="return mV(\'Psa\',17,14);">17:14</a>; <a onClick="return mV(\'Isa\',3,4);">Isa 3:4</a>).<P>(3) brephos an unborn or newborn child (King James Version and the Revised Version (British and American) of <a onClick="return mV(\'Luk\',1,41,44);">Lu 1:41, 44</a>; <a onClick="return mV(\'Luk\',2,12,16);">2:12, 16</a>; <a onClick="return mV(\'1Pe\',2,2);">1Pe 2:2</a> and the Revised Version (British and American) of <a onClick="return mV(\'Luk\',18,15);">Lu 18:15</a> [AV "infants"]; <a onClick="return mV(\'Act\',7,19);">Ac 7:19</a> [King James Version, "young children"] and <a onClick="return mV(\'2Ti\',3,15);">2Ti 3:15</a> [King James Version, "child"]).<P>(4) nepios = (Latin infans) "a child that cannot speak." (King James and the Revised Version (British and American) of <a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a>; <a onClick="return mV(\'Mat\',21,16);">21:16</a>; <a onClick="return mV(\'Luk\',10,21);">Lu 10:21</a>; <a onClick="return mV(\'Rom\',2,20);">Ro 2:20</a>; <a onClick="return mV(\'1Cr\',3,1);">1Co 3:1</a>; <a onClick="return mV(\'Hbr\',5,13);">Heb 5:13</a>) the same word is translated "child," plural "children" (in the King James Version and the Revised Version (British and American) of <a onClick="return mV(\'1Cr\',13,11);">1Co 13:11</a>; <a onClick="return mV(\'Gal\',4,1,3);">Ga 4:1, 3</a>; <a onClick="return mV(\'Eph\',4,14);">Eph 4:14</a>) the verb nepiazete is translated in the King James Version "be ye children" and in the Revised Version (British and American) "be ye babes" (<a onClick="return mV(\'1Cr\',14,20);">1Co 14:20</a>). Nepios is used metaphorically of those who are like children, of simple and single minds, as opposed to the "wise and understanding" (<a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a> = <a onClick="return mV(\'Luk\',10,21);">Lu 10:21</a>; compare <a onClick="return mV(\'1Cr\',14,20);">1Co 14:20</a>). "Babes in Christ" are men of little spiritual growth, carnal as opposed to spiritual (<a onClick="return mV(\'1Cr\',3,1);">1Co 3:1</a>; compare <a onClick="return mV(\'Hbr\',5,13);">Heb 5:13</a>; <a onClick="return mV(\'Eph\',4,14);">Eph 4:14</a>). Nepios is also used of a child as a minor or infant in the eye of the law (<a onClick="return mV(\'Gal\',4,1,3);">Ga 4:1, 3</a>).``145';
isbe[1071]='Babel, Babylon (1)`ba\'-bel, bab\'-i-lon (Topographical): Babylon was the Greek name of the city written in the cuneiform script of the Babylonians, bab-ili, which means in Semitic, "the gate of god." The Hebrews called the country, as well as the city, Babhel. This name they considered came from the\' root, balal, "to confound" (<a onClick="return mV(\'Gen\',11,9);">Ge 11:9</a>). The name in Sumerian ideographs was written Din-tir, which means "life of the forest," and yet ancient etymologists explained it as meaning "place of the seat of life" (shubat balate). Ka-ding\'irra, which also means "gate of god," was another form of the name in Sumerian. It was also called Su-anna (which is of uncertain meaning) and Uru-azagga, "the holy city."<P>Herodotus, the Greek historian, has given us a picture of Babylon in his day. He says that the city was a great square, 42 miles in circuit. Ctesias makes it 56 miles. This, he writes, was surrounded by a moat or rampart 300 ft. high, and 75 ft. broad. The earliest mention of Babylon is in the time of Sargon I, about 2700 BC. That monarch laid the foundations of the temple of Annnit, and also those of the temple of Amal. In the time of Dungi we learn that the place was sacked. The city evidently played a very unimportant part in the political history of Babylonia of the early period, for besides these references it is almost unknown until the time of Hammurabi, when its rise brought about a new epoch in the history of Babylonia. The seat of power was then transferred permanently from the southern states. This resulted in the closing of the political history of the Sumerians. The organization of the empire by Hammurabi, with Babylon as its capital, placed it in a position from which it was never dislodged during the remaining history of Babylonia.<P>The mounds covering the ancient city have frequently been explored, but systematic excavations of the city were not undertaken until 1899, when Koldewey, the German excavator, began to uncover its ancient ruins in a methodical manner. In spite of what ancient writers say, certain scholars maintain that they grossly exaggerated the size of the city, which was comparatively small, especially when considered in connection with large cities of the present era.<P>In the northern part of the city there was situated what is called the north Palace on the east side of the Euphrates, which passed through the city. A little distance below this point the Arakhtu canal left the Euphrates, and passing through the southern wall rejoined the river. There was also a Middle and Southern Palace. Near the latter was located the Ishtar gate. The temple E-makh was close to the east side of the gate. Other canals in the city were called Merodach and Libilkhegala. In the southern portion of the city was located the famous temple E-sag-ila. This temple was called by the Greek historian, "the temple of Belus." Marduk or Merodach (as written in the Old Testament), the patron deity of the city, received from Enlil, as Hammurabi informs us, after he had driven the Elamites out of Babylonia, the title "bel matate," "lord of lands," not the name which Enlil of Nippur had possessed. In the past there has been a confusion. The idcogram Enlil or Ellil had been incorrectly read Bel. This necessitated speaking of the old Bel and the young Bel. Beyond being called bel, "lord," as all other gods were called; Enlil\'s name was not Bel. Marduk is the Bel of the Old Testament, as well as the god called Bel in the Assyrian and Babylonian inscriptions.<P>The temple area included an outer, central and inner court. The shrine of Ishtar and Zamama occupied the central court, and the ziggurrat the inner court. In the temple proper, the shrine Ekua was located, in which stood the golden image of Marduk. This, the ancient writers say, was 40 ft. high. On the topmost stage there was a shrine dedicated to Marduk. It is assumed that it was 50 ft. long by 70 ft. broad and 50 ft. in height. Nabopolassar rebuilt the temple and its tower. Nebuchadrezzar enlarged and embellished the sanctuary. He raised the tower so that "its head was in the heavens," an expression found in the story of the Tower of Babel in Genesia, as well as in many of the building inscriptions. See Clay, <span class="noTag">LOTB</span>, Babel, 121ff, and the article on <a href="./study/isbe/search.html?string=BABEL,+TOWER+OF">BABEL, TOWER OF</a>. One of the chief works of Nebuchadrezzar was the building of Aiburshabu, the famous procession street of the city, which extended from the Ishtar gate to E-sag-ila. It was a great and magnificent causeway, built higher than the houses. Walls lined it on either side, which were decorated with glazed tiles, portraying lions, life size in relief. The pavement was laid with blocks of stone brought from the mountains. This procession street figured prominently on the New Year\'s festal day, when the procession of the gods took place.<P>A knowledge of the work Nebuchadrezzar did serves as a fitting commentary to the passage in <a onClick="return mV(\'Dan\',4,30);">Da 4:30</a>: "Is not this great Babylon, which I have built?" He had made the city one of the wonders of the world.<P>The two sieges by Darius Hystaspes and the one by Xerxes destroyed much of the beauty of the city. Alexander desired to make it again a great center and to build an immense fortress in the city; but in the midst of this undertaking he was murdered, while living in the palace of Nebuchadrezzar. The temple, though frequently destroyed, was in existence in the time of the Seleucids, but the city had long since ceased to be of any importance.`<a href="./study/isbe/search.html?string=BABYLONIA">BABYLONIA</a>`24';
isbe[1072]='Babel, Babylon (2)`babhel; Assyro-Bab Bab-ili, (Bab-ilani, "gate of god," or "of the gods," rendered in Sumerian as Ka-dingira, "gate of god," regarded as a folk-etymology):<P>See <a href="./study/isbe/search.html?string=BABEL,+TOWER+OF">BABEL, TOWER OF</a>, section 14.<P>1. Names by Which the City Was Known<P>2. Probable Date of Its Foundation<P>3. Its Walls and Gates from Herodotus<P>4. Its Position, Divisions, Streets and Temple<P>5. The Works of Semiramis and Nitocris<P>6. Ctesias\' Description—the Palaces and Their Decorated Walls<P>7. The Temple of Belus and the Hanging Gardens<P>8. Other Descriptions<P>9. Nebuchadrezzar\'s Account<P>10. Nebuchadrezzar\'s Architectural Work at Babylon<P>11. The Royal Palaces<P>12. Quick Building<P>13. The Temples Restored by Nebuchadrezzar<P>14. The Extent of Nebuchadrezzar\'s Architectural Work<P>15. Details Concerning the City from Contract-Tablets<P>16. Details Concerning Babylon from Other Sources<P>17. Modern Exploration<P>18. Description of the Ruins—the Eastern Walls<P>19. The Western Walls<P>20. The Palaces<P>21. The Site of Babylon\'s Great Tower<P>22. The Central and Southern Ruins<P>23. A Walk through Babylon<P>24. The Ishtar-Gate and the Middle Palace<P>25. The Festival-Street<P>26. The Chamber of the Fates<P>27. The Northern Palace and the Gardens<P>28. Historical References to Babylonian Buildings<P>LITERATURE<hr /><P>1. Names by Which the City Was Known:<P>The name of the great capital of ancient Babylonia, the Shinar of <a onClick="return mV(\'Gen\',10,10);">Ge 10:10</a>; <a onClick="return mV(\'Gen\',14,1);">14:1</a>, other names of the city being Tin- dir, "seat of life," E (ki), probably an abbreviation of Eridu (ki) "the good city" (= Paradise), Babylonia having seemingly been regarded as the Garden of Eden (<span class="noTag">PSBA</span>, June 1911, p. 161); and Su-anna, "the high-handed" (meaning, apparently, "high- walled," "hand" and "defense" being interchangeable terms). It is possible that these various names are due to the incorporation of outlying districts as Babylon grew in size.<P>2. Probable Date of Its Foundation:<P>According to <a onClick="return mV(\'Gen\',10,9);">Ge 10:9</a>, the founder of Babylon was Nimrod, but among the Babylonians, it was Merodach who built the city, together with Erech and Niffer (Calneh) and their renowned temples. The date of its foundation is unknown, but it certainly went back to primitive times, and Babylon may even have equaled Niffer in antiquity (the American explorers of that site have estimated that its lowest strata of habitations go back to 8,000 years BC). Babylon\'s late assumption of the position of capital of the country would therefore be due to its rulers not having attained power and influence at an earlier period. Having once acquired that position, however, it retained it to the end, and its great god, Merodach, became the head of the Babylonian pantheon—partly through the influence of Babylon as capital, partly because the city was the center of his worship, and the place of the great Tower of Babel, concerning which many wonderful things were said.<P>See <a href="./study/isbe/search.html?string=BABEL,+TOWER+OF">BABEL, TOWER OF</a>; <a href="./study/isbe/search.html?string=CONFUSION+OF+TONGUES">CONFUSION OF TONGUES</a>.<P>3. Its Walls and Gates from Herodotus:<P>According to Herodotus, the city, which lay in a great plain, was square in its plan and measured 120 furlongs (stadia) each way—480 in all. Each side was therefore about 14 miles long, making a circuit of nearly 56 miles, and an area of nearly 196 square miles. As the space enclosed is so great, and traces of the walls would seem to be wanting, these figures may be regarded as open to question. Around the city, Herodotus says, there was a deep and broad moat full of water, and then came a wall 50 royal cubits thick and 200 cubits high, pierced by 100 gateways with brazen gates and lintels. Reckoning the cubit at 18 2/3 inches, this would mean that Babylon\'s walls were no less than 311 ft. high; and regarding the royal cubit as being equal to 21 inches, their thickness would be something like 87 ft. Notwithstanding that Babylon has been the quarry of the neighboring builders for two millenniums, it is surprising that such extensive masses of brickwork should have disappeared without leaving at least a few recognizable traces.<P>4. It Position, Divisions, Streets, and Temple:<P>The city was built on both sides of the Euphrates, and at the point where the wall met the river there was a return-wall running along its banks, forming a rampart. The houses of Babylon were of 3 and 4 stories. The roads which ran through the city were straight, and apparently intersected each other at right angles, like the great cities of America. The river-end of each of the streets leading to the river was guarded by a brazen gate. Within the great outer wall was another, not much weaker, but enclosing a smaller space. Each division of the city contained a great building, the one being the king\'s palace, strongly fortified around, and the other the temple of Zeus Boles—an erection with brazen gates measuring two furlongs each way. Within this sacred precinct was a solid tower measuring a furlong each way, and surmounted by other towers to the number of eight. An ascent ran around these towers, with a stopping-place about the middle where the visitor might rest. Upou the topmost tower a large cell was built, wherein was a couch and a golden table. No image was placed in the cell, and no one passed the night there, except a woman of the people, chosen by the god. In another cell below was a golden image of Zeus sitting, his seat and footstool being likewise of gold, with, near by, a large golden table. The total weight of the precious metal here was 800 talents. Upon a small golden altar outside the cell young sucklings only were sacrificed, and upon another (not of gold) full-grown animals were offered.<P>5. The Works of Semiramis and Nitocris:<P>The hydraulic works of Babylon are attributed by Herodotus to two queens, Semiramis and Nitoeris. The former made banks of earth on the plain which were worth seeing, preventing the river from flooding the plain like a sea. The second, Nitocris, altered the channel of the river in such a way that it flowed three times in its course to the village Andericca, and the traveler by water therefore took three days to pass this spot. She also raised the banks of the river, and dug a great lake above Babylon. The place which was dug out she made into a swamp, the object being to retard the course of the river. The many bends and the swamp were on the shortest route to Media, to prevent the Medes from having dealings with her kingdom and learning of her affairs. Other works were a bridge across the Euphrates, and a tomb for herself over the most frequented gate of the city.<P>Both Herodotus and Ctesias were eyewitnesses of the glory of Babylon, though only at the period when it had begun to wane. It is exceedingly probable, however, that their accounts will be superseded in the end, by those of the people who best knew the city, namely, the inhabitants of Babylon itself.<P>6. Ctesias\' Description—the Palaces and Their Decorated Walls:<P>According to Ctesias, the circuit of the city was not 480, but. 360 furlongs—the number of the days in the Babylonian year—and somewhat under 42 miles. The East and West districts were joined by a bridge 5 furlongs or 1,080 yards long, and 30 ft. broad. At each end of the bridge was a royal palace, that on the eastern bank being the more magnificent of the two. This palace was defended by three walls, the outermost being 60 furlongs or 7 miles in circuit; the second, a circular wall, 40 furlongs (4 1/2 miles), and the third 20 furlongs (2 1/2 miles). The height of the middle wall was 300 ft., and that of its towers 420 ft., but this was exceeded by the height of the inmost wall. Ctesias states that the walls of the second and third enclosures were of colored brick, showing hunting scenes—the chase of the leopard and the lion, with male and female figures, which he regarded as Ninus and Semiramis. The other palace (that on the west bank) was smaller and less ornate, and was enclosed only by a single wall 30 furlongs (3 1/2 miles) in circuit. This also had representations of hunting scenes and bronze statues of Ninus, Semiramis and Jupiter-Belus (Bel-Merodach). Besides the bridge, he states that there was also a tunnel under the river. He seems to speak of the temple of Belus (see <a href="./study/isbe/search.html?string=BABEL,+TOWER+OF">BABEL, TOWER OF</a>) as being surmounted by three statues—Bel (Bel-Merodach), 40 ft. high, his mother Rhea (Dawkina, the Dauke of Damascius), and Bel-Merodach\'s spouse Juno or Beltis (Zer-panitum).<P>7. The Temple of Belus and the Hanging Gardens:<P>The celebrated Hanging Gardens he seems to describe as a square of which each side measured 400 ft., rising in terraces, the topmost of which was planted with trees of various kinds. If this was the case, it must have resembled a temple-tower covered with verdure. The Assyrian sculptures, however, indicate something different (see section 27).<P>8. Other Descriptions:<P>With regard to the size of the city as given by other authorities, Pliny copies Herodotus, and makes its circuit 480 furlongs (Nat. Hist. vi.26); Strabo (xvi. i. section 5), 385; Q. Curtius (v. i. section 26), 368; Clitarchus (apud Diod. Sic. ii.7), 365. Though the difference between the highest and the lowest is considerable, it is only what might be expected from independent estimates, for it is doubtful whether any of them are based on actual measurements. Diodorus (ii.9, end) states that but a small part of the enclosure was inhabited in his time (he was a contemporary of Caesar and Augustus), but the abandonment of the city must then have been practically completed, and the greater part given over, as he states, to cultivation—even, perhaps, within the space enclosed by the remains of walls today. It is noteworthy that Q. Curtius says (v. i. section 27) that as much as nine-tenths consisted, even during Babylon\'s most prosperous period, of gardens, parks, paradises, fields and orchards; and this the later contract-tablets confirm. Though there is no confirmation of the height of the walls as given by these different authorities, the name given to the city, Su-anna, "the high walled" (see above), indicated that it was renowned for the height of its defensive structures.<P>9. Nebuchadrezzar\'s Account:<P>Among the native accounts of the city, that of Nebuchadrezzar is the best and most instructive. From this record it would seem that there were two principal defensive structures, Imgur-Enlil and Nemitti-Enlil—"Enlil has been gracious" and "Enlil\'s foundation" respectively. The construction of these, which protected the inner city only, on the eastern and western sides of the Euphrates, he attributes to his father Nabonidus, as well as the digging of the moat, with the two "strong walls" on its banks, and the embankment of the Arabtu canal. He had also lined the Euphrates with quays or embankments—probably the structures to which the Greek writers refer—but he had not finished the work. Within Babylon itself he made a roadway from Du-azaga, the place where the fates were declared, to Aa-ibur-sabu, Babylon\'s festival-street, which lay by the gate of Beltis or Mah, for the great New-Year\'s festival of Merodach and the gods.<P>10. Nebuchadrezzar\'s Architectural Work at Babylon:<P>Nebuchadrezzar, after his accession, completed the two great walls, lined the ditches with brick, and increased the thickness of the two walls which his father had built. He also built a wall, traces of which are apparently extant, on the west side of Babylon (he apparently refers to what may be called the "city," in contradistinction to "greater Babylon"), and raised the level of Aa-ibur-sabu from the "holy gate" to the gate of Nana; together with the gateways (in consequence of the higher level of the pathway) through which it passed. The gates themselves were constructed of cedar overlaid with copper (bronze), most likely in the same manner as the gates of Imgur-Bel (Balawat) in Assyria (reign of Shalmaneser II, circa 850 BC). Probably none of Babylon\'s gates were of solid bronze, notwithstanding the statements of Herodotus; but the thresholds were wholly of that metal, stone being very rare, and perhaps less durable. These gates were guarded by images of bulls and giant serpents or composite dragons of the same metal. Nebuchadrezzar also built a wall on the east bank of the river, 4,000 cubits distant, "high like a mountain," to prevent the approach of an enemy. This wall also had cedar gates covered with copper. An additional defense made by him was an enormous lake, "like unto the broad sea to cross," which was kept in by embankments.<P>11. The Royal Palaces:<P>The royal palaces next claimed the great king\'s attention. The palace in which Nabopolassar had lived, and wherein, in all probability, Nebuchadrezzar had passed his younger days, had suffered from the floods when the river was high. The foundations of this extensive edifice, which extended from the wall called Imgur-Enlil to Libil-hegala, the eastern canal, and from the banks of the Euphrates to Aa-ibur-sabu, the festival-street, were thoroughly repaired with burnt brick and bitumen, and the doorways, which had become too low in consequence of the raising of that street, were raised to a suitable height. He caused the whole to tower aloft, as he has it, "mountainlike" (suggesting a building more than one story high). The roof of this palace was built of cedar, and the doors were of the same wood covered with bronze. Their thresholds, as in other cases, were bronze, and the interior of the palace was decorated with gold, silver, precious stones and other costly material.<P>12. Quick Building:<P>Four hundred
