isbe[1080]='Babylonians`bab-i-lo\'-ni-anz: The inhabitants of <a href="./study/isbe/search.html?string=BABYLONIA">BABYLONIA</a> (which see). They were among the colonists planted in Samaria by the Assyrians (<a onClick="return mV(\'Ezr\',4,9);">Ezr 4:9</a>). "The likeness of the Babylonians in Chaldea" (<a onClick="return mV(\'Eze\',23,15);">Eze 23:15</a>) refers to the pictures which were common on the walls of Babylonian palaces, and the reports of them being heard in Jerusalem, or copies of them seen there, awakened the nation\'s desire for these unknown lovers, which Judah had ample occasion to repent of (<a onClick="return mV(\'Eze\',23,17,23);">Eze 23:17, 23</a>; compare <a onClick="return mV(\'2Ki\',24,1);">2Ki 24</a>).``1';
isbe[1081]='Babylonish Garment`bab-i-lo\'-nish gar\'ment: In the King James Version, <a onClick="return mV(\'Jos\',7,21);">Jos 7:21</a>, for <a href="./study/isbe/search.html?string=BABYLONISH+MANTLE">BABYLONISH MANTLE</a>, which see.``1';
isbe[1082]='Babylonish Mantle`man\'-tl (the King James Version Babylonish Garment): One of the articles taken by Achan from the spoil of Jericho (<a onClick="return mV(\'Jos\',7,21);">Jos 7:21</a>). In the Hebrew "a mantle of Shinar." Entirely gratuitous is the suggested correction of Shinar to se\'ar, making "a hairy mantle." The Greek has psilen poikilen, which Josephus apparently understood to mean "a royal garment all woven out of gold" (Ant., V, i, 10). The Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) calls it a "scarlet pallium," and some of the rabbinical traditions make it a purple robe. Such classical writers as Pliny and Martial speak of the weaving of embroidered stuffs as a famous industry of Babylonia. Many tablets that have been deciphered indicate that the industry was indeed widely extended, that its costly products were of great variety and that some of them were exported to distant markets; in fine, that the account in Joshua is characterized by great verisimilitude.``11';
isbe[1083]='Baca`ba\'-ka bakha\':In the King James Version in <a onClick="return mV(\'Psa\',84,6);">Ps 84:6</a>, where the Revised Version (British and American) has "the valley of Weeping," with a marginal variant which is best put in the form, "the valley of the balsam-trees." The word is elsewhere used only in the duplicated account of one of David\'s battles (<a onClick="return mV(\'2Sa\',5,23,24);">2Sa 5:23-24</a>; <a onClick="return mV(\'1Ch\',14,14,15);">1Ch 14:14-15</a>). There the translation is "the mulberry trees," with "the balsam-trees" in the margin in the Revised Version (British and American). Conjecturally the word is, by variant spelling, of the stem which denotes weeping; the tree is called "weeper" from some habit of the trickling of its gum or of the moisture on it; the valley of weeping is not a geographical locality, but a picturesque expression for the experiences of those whose strength is in Yahweh, and who through His grace find their sorrows changed into blessings.``11';
isbe[1084]='Bacchides`bak-i-dez: Bakchides: Bacchides, ruler over Mesopotamia and a faithful friend of both Antiochus Epiphanes and Demetrius Soter, established at the request of the latter the rulership over Judea for Aleimus, who, desiring to become high priest, had made false accusations against Judas Maccabee (1Macc 7:8ff; Ant, XII, x, 2). Bacchides is sent the second time to Judea after the Syrian general Nicanor was killed near Adasa and Judas Maccabee had gained control of the government (1Macc 9:1ff; Ant, XII, x). Bacchides after an unsuccessful battle near Bethbasi was forced to make peace with Jonathan, the brother of Judas Maccabee (1Macc 9:58ff; Ant, XIII, i). In 1Macc 10:12 and 2Macc 8:30 reference is made to the strongholds Bacchides built during his second campaign against Jerusalem (1Macc 9:50). Compare <a href="./study/isbe/search.html?string=ALCIMUS">ALCIMUS</a>; <a href="./study/isbe/search.html?string=BETHBASI">BETHBASI</a>; <a href="./study/isbe/search.html?string=JONATHAN">JONATHAN</a>; <a href="./study/isbe/search.html?string=JUDAS+MACCABAEUS">JUDAS MACCABAEUS</a>; <a href="./study/isbe/search.html?string=ADASA">ADASA</a>; <a href="./study/isbe/search.html?string=NICANOR">NICANOR</a>.``16';
isbe[1085]='Bacchurus`ba-ka\'-rus: Bakchouros: One of the "holy singers" who put away his "strange wife" (1Esdras 9:24). Omitted in <a onClick="return mV(\'Ezr\',10,\'1-\');">Ezr 10</a>.``1';
isbe[1086]='Bacchus`bak\'-us Dionusos; later Bakchos, the Feast of Bacchus; Dionusia: The god of wine. His worship had extended over the whole Greek and Roman world centuries before the Christian era, and had degenerated into an orgy of drunkenness and unnamable immoralities, possibly under the influence of oriental Baal worship, such as the Hebrew prophets condemned. It has been surmised that Dionysus was originally not a Greek, but an oriental deity. His worship had been introduced into Egypt, perhaps by the Ptolemies, and Ptolemy Philopator (222-204 BC) had branded the Jews there with his emblem, the sign of the ivy. When Antiochus Epiphanes made his assault upon Jerusalem in the year 168 BC, he determined to extirpate the worship of Yahweh, which he recognized as the strength of the Jewish resistance, and to replace it by Greek religion. All worship of Yahweh and the observance of Jewish rites, such as the Sabbath and circumcision, were prohibited. Heathen worship was set up all over Judea, and in the temple at Jerusalem on the altar of burnt offering an altar to Jupiter was erected, "the abomination that maketh desolate" (<a onClick="return mV(\'Dan\',11,31);">Da 11:31</a>), and a swine was sacrificed upon it (see <a href="./study/isbe/search.html?string=ABOMINATION+OF+DESOLATION">ABOMINATION OF DESOLATION</a>). The immoral practices associated with heathen worship in those days established themselves in the temple. When this feast of Bacchus (Dionysus) with all its revelry came round, the Jews were compelled to go in procession in honor of Bacchus (Dionysus), wearing wreaths of ivy, the emblem of the god (2Macc 6:7). Some years later, when the worship of Yahweh had been restored, Nicanor the general of Demetrius I, in conducting the war against Judas Maceabacus, threatened the priests that, unless they delivered Judas up as a prisoner, "he would raze the temple of God even with the ground, break down the altar, and erect there a temple unto Bacchus (Dionysus) for all to see" (2Macc 14:33).<P>LITERATURE.<P>Cheyne, article "Bacchus," EB; Kent, History of the Jewish People, I, 328-29; Josephus, Ant, XII, v, 4.`<a href="./study/isbe/search.html?string=DIONYSIA">DIONYSIA</a>`145';
isbe[1087]='Bacenor`ba-se\'-nor Bakenor: An officer in the army of Judas Maccabee engaged in war against Gorgias, governor of Idumaea (2Macc 12:35). Compare Ant, XlI, viii, 6.``1';
isbe[1088]='Bachrite`bak\'-rit.`<a href="./study/isbe/search.html?string=BECHER">BECHER</a>`1';
isbe[1089]='Back, Back Parts`(1) \'achar, ("back side" as in the King James Version): "He led the flock to the back of the wilderness" (<a onClick="return mV(\'Exd\',3,1);">Ex 3:1</a>), i.e. "to the pasture-lands on the other side of the desert from the Midianite encampments."<P>(2) \'achor, ("hinder part," "the west"): Used of God in an anthropomorphic sense ("Thou shalt see my back," <a onClick="return mV(\'Exd\',33,23);">Ex 33:23</a>) to signify "the after-glow of the Divine radiance," the faint reflection of God\'s essential glory. See also <a onClick="return mV(\'Isa\',38,17);">Isa 38:17</a> and compare <a onClick="return mV(\'1Ki\',14,9);">1Ki 14:9</a> and <a onClick="return mV(\'Neh\',9,26);">Ne 9:26</a>.<P>(3) opisthen, ("back side"): "A book written within and on the back" (<a onClick="return mV(\'Rev\',5,1);">Re 5:1</a>), "but the back of a book is not the same as the reverse side of a roll. John was struck, not only with the fact that the roll was sealed, but also with the amount of writing it contained" (HDB, I, 231). Compare <a onClick="return mV(\'Eze\',2,10);">Eze 2:10</a>``91';
isbe[1090]='Backbite`bak\'-bit raghal; doloo: To slander the absent, like a dog biting behind the back, where one cannot see; to go about as a talebearer. "He that backbiteth [Revised Version, slandereth] not with his tongue" (<a onClick="return mV(\'Psa\',15,3);">Ps 15:3</a>).<P>Backbiters bak\'-bit-rz (Greek katalaloi: Men who speak against. Vulgate, "detractors" (<a onClick="return mV(\'Rom\',1,30);">Ro 1:30</a>)).<P>Backbiting bak\'-bit-ing: cether: Adj. "a backbiting tongue"; literally, "a tongue of secrecy" (<a onClick="return mV(\'Pro\',25,23);">Pr 25:23</a>). katalalia: substantive "a speaking against" (<a onClick="return mV(\'2Cr\',12,20);">2Co 12:20</a>; Wisdom 1:11); "evil speaking" (<a onClick="return mV(\'1Pe\',2,1);">1Pe 2:1</a>). glossa trite: "a backbiting tongue" (the King James Version of Ecclesiasticus 28:14,15); more literally translated in the Revised Version (British and American) "a third person\'s tongue."``145';
isbe[1091]='Backside`bak\'sid\'`<a href="./study/isbe/search.html?string=BACK">BACK</a>`1';
isbe[1092]='Backslide`bak\'-slid\' (meshubhah; <a onClick="return mV(\'Hsa\',11,7);">Ho 11:7</a>; <a onClick="return mV(\'Hsa\',14,4);">14:4</a> and often in Hosea and Jerermiah, shobhabh; shobhebh, in Jeremiah, 4 times: all meaning "turning back or away," "apostate," "rebellious." Carar, in <a onClick="return mV(\'Hsa\',4,16);">Ho 4:16</a> = "stubborn," "rebellious"; the Revised Version (British and American) "stubborn"): In all places the word is used of Israel forsaking Yahweh, and with a reference to the covenant relation between Yahweh and the nation, conceived as a marriage tie which Israel had violated. Yahweh was Israel\'s husband, and by her idolatries with other gods she had proved unfaithful (<a onClick="return mV(\'Jer\',3,8,14);">Jer 3:8, 14</a>; <a onClick="return mV(\'Jer\',14,7);">14:7</a>; <a onClick="return mV(\'Hsa\',14,4);">Ho 14:4</a>). It may be questioned whether Israel was guilty so much of apostasy and defection, as of failure to grow with the growing revelation of God. The prophets saw that their contemporaries fell far short of their own ideal, but they did not realize how far their predecessors also had fallen short of the rising prophetic standard in ideal and action. See <a href="./study/isbe/search.html?string=APOSTASY">APOSTASY</a>.<P>Backslider bak\'-slid-er cugh lebh: "The backslider in heart shall be filled with his own ways" (<a onClick="return mV(\'Pro\',14,14);">Pr 14:14</a>). But the Revised Version (British and American) "backslider" conveys the wrong impression of an apostate. The Hebrew expression here implies simply non-adherence to the right, "The bad man reaps the fruits of his act" (Toy, Prov, in loc.).``145';
isbe[1093]='Badger`baj\'er: tachash: The word tachash occurs in the descriptions of the tabernacle in <a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>; <a onClick="return mV(\'Exd\',26,\'1-\');">26</a>; <a onClick="return mV(\'Exd\',35,\'1-\');">35</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36</a>; <a onClick="return mV(\'Exd\',39,\'1-\');">39</a>, in the directions for moving the tabernacle as given in <a onClick="return mV(\'Num\',4,\'1-\');">Nu 4</a>, and in only one other passage, <a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a>, where Jerusalem is spoken of as a maiden clothed and adorned by her Lord. In nearly all these passages the word tachash occurs with \'or, "skin," rendered: the King James Version "badgers\' skins," the Revised Version (British and American) "sealskin," the Revised Version, margin "porpoise-skin," Septuagint dermata huakinthina. In all the passages cited in Exodus and Numbers these skins are mentioned as being used for coverings of the tabernacle; in <a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a>, for shoes or sandals. The Septuagint rendering would mean purple or blue skins, which however is not favored by Talmudic writers or by modern grammarians, who incline to believe that tachash is the name of an animal. The rendering, "badger," is favored by the Talmudic writers and by the possible etymological connection of the word with the Latin taxus and the German Dachs. The main objection seems to be that badgers\' skins would probably not have been easily available to the Israelites. The badger, Meles taxus, while fairly abundant in Lebanon and Anti-Lebanon, does not seem to occur in Sinai or Egypt.<P>A seal, Monachus albiventer (Arabic fukmeh), the porpoise, Phocoena comrnunis, and the common dolphin, Delphinus delphis, are all found in the Mediterranean. The dugong, Halicore dugong, inhabits the Indian Ocean and adjoining waters from the Red Sea to Australia. The Arabic tukhas or dukhas is near to tachash and is applied to the dolphin, which is also called delfin. It may be used also for the porpoise or even the seal, and is said by Tristram and others to be applied to the dugong. The statement of Gesenius (Boston,1850,under the word "tachash") that the Arabs of Sinai wear sandals of dugong skin is confirmed by recent travelers, and is of interest with reference to <a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a>, ".... shod thee with badgers\' skin" (King James Version). The dugong is a marine animal from 5 to 9 ft. in length, frequenting the shore and feeding upon seaweed. It belongs to the order Sirenia. While outwardly resembling Cetacea (whales and porpoises), the Sirenia are really more allied to the Ungulata, or hoofed animals. The dugong of the Indian Ocean and the manatee of the Atlantic and of certain rivers of Africa and South America, are the only living representatives of the Sirenia. A third species, the sea-cow of Behring Sea, became extinct in the 18th century. The seal and porpoise of the Revised Version (British and American), the dolphin, and the dugong are all of about the same size and all inhabit the seas bordering on Egypt and Sinai, so that all are possible candidates for identification with the tachash. Of the four, recent opinion seems most to favor the dugong.<P>Mr. S. M. Perlmann has suggested (Zoologist, set. 4, XII,256,1908) that the okapi is the animal indicated by tachash.<P>Gesenius (Leipzig, 1905) cites Bondi (Aegyptiaca, i.ff) who adduces the Egyptian root t-ch-s and makes the expression \'or tachash mean "soft-dressed skin." This suits the context in every passage and is very promising explanation.``37';
isbe[1094]='Baean`be\'-an huioi Baian; the King James Version Bean; 1Macc 5:4: A tribe mentioned only because of its malignant hatred of the Jews. Its aggressive hostility against their religion and the rebuilding of their sanctuary duplicated the conspiracy of Sanballat and his confederates against the restoration of Jerusalem and the temple in the days of Nehemiah (compare <a onClick="return mV(\'Neh\',4,7,8);">Ne 4:7-8</a>). Utterly exterminated by Judas Maccabeus who burned alive, in towers, many of the imprisoned people.`<a href="./study/isbe/search.html?string=MAON">MAON</a>`1';
isbe[1095]='Bag`Bags of various kinds are mentioned in the English Bible, but often in a way to obscure rather than tr the original.<P>(1) "Bag" is used for a Hebrew word which means a shepherd\'s "bag," rendered "wallet" in the Revised Version (British and American). This "bag" of the shepherd or "haversack" of the traveler was of a size sufficient for one or more days\' provisions. It was made of the skin of animals, ordinarily undressed, as most of the other "bags" of ancient times were, and was carried slung across the shoulder. This is the "scrip for the journey" pera mentioned in <a onClick="return mV(\'Mat\',10,10);">Mt 10:10</a> and its parallel (the King James Version). ("Scrip" is Old English, now obsolete.) A unique word appears in <a onClick="return mV(\'1Sa\',17,40,49);">1Sa 17:40, 49</a> which had to be explained even to Hebrew readers by the gloss, "the shepherd\'s bag," but which is likewise rendered "wallet" by the American Standard Revised Version.<P>(2) "Bag" translates also a word ballantion which stands for the more finished leather pouch, or satchel which served as a "purse" (see Christ\'s words, <a onClick="return mV(\'Luk\',10,4);">Lu 10:4</a> King James Version: "Carry neither purse, nor scrip," and <a onClick="return mV(\'Luk\',12,33);">12:33</a> King James Version: "Provide yourselves bags which wax not old"). The word rendered "purse" in <a onClick="return mV(\'Mat\',10,9);">Mt 10:9</a>: "Get you no gold, nor silver, nor brass in your purses"; <a onClick="return mV(\'Mar\',6,8);">Mr 6:8</a>: "No money in their purse," is a different word entirely zone, the true rendering of which is "girdle" (Revised Version, margin). The oriental "girdle," though sometimes of crude leather, or woven camel\'s hair (see <a href="./study/isbe/search.html?string=GIRDLE">GIRDLE</a>), was often of fine material and elegant workmanship, and was either made hollow so to carry money, or when of silk or cloth, worn in folds, when the money was carried in the folds.<P>(3) The small "merchant\'s bag" often knotted in a handkerchief for carrying the weights, such as is mentioned in <a onClick="return mV(\'Deu\',25,13);">De 25:13</a>: "Thou shalt not have in thy bag divers weights, a great and a small," was another variety. This too was used as "purse," as in the case of the proposed common purse of the wicked mentioned in <a onClick="return mV(\'Pro\',1,14);">Pr 1:14</a>: "We will all have one purse," and sometimes carried in the girdle (compare <a onClick="return mV(\'Isa\',46,6);">Isa 46:6</a>).<P>(4) Then there was the "bag" tseror, rendered "bundle" in <a onClick="return mV(\'Gen\',42,35);">Ge 42:35</a> which was the favorite receptacle for valuables, jewels, as well as money, used figuratively with fine effect in <a onClick="return mV(\'1Sa\',25,29);">1Sa 25:29</a>: "The soul of my lord shall be bound in the bundle of life"—"life\'s jewel-case" (see <a onClick="return mV(\'2Ki\',12,10);">2Ki 12:10</a> where the money of the temple was said to be put up "tied up" in bags). This was a "bag" that could be tied with a string: "Behold, every man\'s bundle of money was in his sack," and with (compare <a onClick="return mV(\'Pro\',7,20);">Pr 7:20</a>) "He hath taken a bag of money with him" (compare <a onClick="return mV(\'Hag\',1,6);">Hag 1:6</a>: "earneth wages to put it into a bag holes"). A seal was sometimes put on the knot, which occasions the figure of speech used in <a onClick="return mV(\'Job\',14,16,17);">Job 14:16-17</a>, "Dost thou not watch over my sin? My transgression is sealed up in a bag," i.e. it is securely kept and reckoned against me (compare also <a onClick="return mV(\'1Sa\',9,7);">1Sa 9:7</a>; <a onClick="return mV(\'1Sa\',21,5);">21:5</a> where the Hebrew keli, is rendered by "vessels" and stands for receptacles for carrying food, not necessarily bags).<P>(5) Another Hebrew word charit; Arabic charitat, is used, on the one hand, for a "bag" large enough to hold a talent of silver (see <a onClick="return mV(\'2Ki\',5,23);">2Ki 5:23</a>, "bound two talents of silver in two bags"), and on the other, for a dainty lady\'s satchel, such as is found in <a onClick="return mV(\'Isa\',3,22);">Isa 3:22</a> (wrongly rendered "crisping pins" in the King James Version). This is the most adequate Hebrew word for a large bag.<p>(6) The "bag" which Judas carried (see <a onClick="return mV(\'Jhn\',12,6);">Joh 12:6</a> the King James Version, "He was a thief and had the bag"; compare <a onClick="return mV(\'Jhn\',13,29);">Joh 13:29</a>) was in reality the small "box" (Revised Version, margin) originally used for holding the mouthpieces of wind instruments (Kennedy, in the 1-volume HDB). The Hebrew \'argaz, (found only here) of <a onClick="return mV(\'1Sa\',6,8);">1Sa 6:8</a>, rendered "coffer" in English Versions of the Bible and translated glossokomon, by Josephus, appears to stand for a small "chest" used to hold the gold figures sent by the Philistines as a guilt offering. It is from a word that means "to wag," "to move to and fro"; compare the similar word in Arabic meaning a bag filled with stones hung at the side of the camel to "preserve" equilibrium (Gesenius). But the same word Josephus uses is found in modern Greek and means "purse" or "bag" (Hatch). Later to "carry the bag" came to mean to be treasurer.``47';
isbe[1096]='Baggage`bag\'aj:<P>(1) keli, ("the impedimenta of an army"): "David left his baggage in the hand of the keeper of the baggage" (<a onClick="return mV(\'1Sa\',17,22);">1Sa 17:22</a>); "at Michmash he layeth up his baggage" (<a onClick="return mV(\'Isa\',10,28);">Isa 10:28</a>). The American Standard Revised Version gives baggage for "stuff" at <a onClick="return mV(\'1Sa\',10,22);">1Sa 10:22</a>; <a onClick="return mV(\'1Sa\',25,13);">25:13</a>; <a onClick="return mV(\'1Sa\',30,24);">30:24</a>.<P>(2) aposkeue: "Beside the baggage" (Judith 7:2), "a great ado and much baggage" (1Macc 9:35,39), "the women and the children and also the baggage" (the King James Version "and other baggage"; 2Macc 12:21).<P>(3) aposkeuazomai, ("to make ready for leaving," "to pack up baggage"): "We took up (made ready, Revised Version margin) our baggage" (<a onClick="return mV(\'Act\',21,15);">Ac 21:15</a>, the King James Version "carriages"), i.e. what they could carry—English: "luggage"; but others understand the term of the loading of the baggage animals.``91';
isbe[1097]='Bago`ba\'-go (Codex Alexandrinus, Bago; Codex Alexandrinus, Banai = Bigvai <a onClick="return mV(\'Ezr\',8,14);">Ezr 8:14</a>): The descendants of Bago returned with Ezra to Jerusalem (1Esdras 8:40).``1';
isbe[1098]='Bagoas`ba-go\'as Bagoas: The eunuch in charge of the household of Holofernes whom the latter engaged to bring Judith to his palace (Judith 12:11ff; 13:1,3; 14:14). Compare <a href="./study/isbe/search.html?string=JUDITH">JUDITH</a>.``1';
isbe[1099]='Bagoi`bag\'-o-i (Codex Alexandrinus, Bagoi; Codex Vaticanus, Bosai = Bigvai <a onClick="return mV(\'Ezr\',2,14);">Ezr 2:14</a>; <a onClick="return mV(\'Neh\',7,19);">Ne 7:19</a>): The descendants of B. returned with Zerubbabel to Jerusalem (1Esdras 5:14).``1';
isbe[1100]='Baharumite; Barhumite`ba-ha\'-rum-it; bar-hu\'-mit (<a onClick="return mV(\'1Ch\',11,33);">1Ch 11:33</a>; <a onClick="return mV(\'2Sa\',23,31);">2Sa 23:31</a>): A native of <a href="./study/isbe/search.html?string=BAHURIM">BAHURIM</a> (which see).``1';
