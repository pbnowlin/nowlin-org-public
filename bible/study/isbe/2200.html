o some extent by eccentricities of opinion.<P>(2) Patrick, Lowth, Scott.<P>In the Anglican church the names of chief distinction in this century are Bishop Patrick, Bishop Lowth, and later, Thomas Scott. Bishop Patrick, usually classed with the Cambridge Platonists (died 1707), contributed paraphrases and commentaries on the Old Testament from Genesis to Canticles, while Bishop Lowth (died 1787) acquired lasting fame by his Prelections on Hebrew Poetry, and A New Translation, with Notes on Isaiah. He was among the first to treat the poetical and prophetic writings really as literature. The commentaries of Patrick and Lowth were subsequently combined with those of Whitby and other divines (Arnold, etc.) to form a complete Critical Commentary (1809), which went through many editions. The well-known commentary of Thomas Scott (1747-1821), representing a moderate Calvinism, is a solid and "judicious" piece of work, inspired by an earnest, believing spirit, though not presenting any marked originality or brilliance. Brilliance is not the characteristic of many commentators of this age.<P>(3) Gill, Doddridge.<P>Two other English writers deserving notice are Dr. John Gill (died 1771; Calvinistic Baptist), who wrote Expositions on the Old Testament and the New Testament and a separate Exposition of the Song of Solomon—learned, but ponderous and controversial; and Dr. Philip Doddridge (died 1751), whose Family Expositor, embracing the entire New Testament, with a harmony of the Gospels, and paraphrases of the meaning, is marked by excellent judgment, and obtained wide acceptance.<P>(4) Bengel.<P>Meanwhile a new period had been preluded in Germany by the appearance in 1742 of the Gnomon Novi Testamenti of J. A. Bengel (died 1751), a work following upon his critical edition of the New Testament issued in 1734. Though belonging to the 18th century, Bengel\'s critical and expository labors really herald and anticipate the best work in these departments of the 19th century His scholarship was exact, his judgment sound, his critical skill remarkable in a field in which he was a pioneer; his notes on the text, though brief, were pregnant with significance, and were informed by a spirit of warm and living piety.<P>The modern period, to which Bengel in spirit, if not in date, belongs, is marked by great changes in the style and character of commentaries. The critical temper was now strong; great advances had been made in the textual criticism of both Old Testament and New Testament (see <a href="./study/isbe/search.html?string=CRITICISM">CRITICISM</a>; <a href="./study/isbe/search.html?string=CRITICISM+OF+THE+BIBLE">CRITICISM OF THE BIBLE</a>); the work of the higher criticism had begun in the Old Testament; in Germany, the spirit of humanism, inherited from Lessing, Herder and Goethe, had found its way into literature; knowledge of the sciences, of oriental civilizations, of other peoples and religions, was constantly on the increase; scholarship was more precise and thorough; a higher ideal of what commentary meant had taken possession of the mind.<P>5. The Modern Period—Its Characteristics:<P>Learning, too, had enlarged its borders, and books on all subjects poured from the press in such numbers that it was difficult to cope with them. This applies to commentaries as to other departments of theological study. Commentaries in the 19th century, and in our own, are legion. Only the most prominent landmarks can be noted.<P>(1) Germany<P>(a) The liberal school.<P>In Germany, as was to be anticipated, the rise of the critical spirit and the profound influence exercised by it are reflected in most of the commentaries produced in the first half of the century. On the liberal side, the rationalistic temper is shown in the rejection of miracle, the denial of prediction in prophecy, and the lowering of the idea of inspiration generally. The scholarship, however, is frequently of a very high order. This temper is seen in De Wette (died 1849), whose commentaries on the New Testament, written when his views had become more positive, show grace and feeling; in Gesenius (died 1842), who produced an epoch-making commentary on Isaiah; in Knobel (died 1863), pronouncedly rationalistic, but with keen critical sense, as evinced in his commentaries on the Pentateuch and Joshua, Ecclesiastes, and Isaiah; in Hupfeld (died 1866) in his Commentary on the Psalms (4 volumes); in Hitzig (died 1875), acute but arbitrary, who wrote on the Psalms and most of the Prophets; above all, in Ewald (died 1875), a master in the interpretation of the poetical and prophetical books, but who commented also on the first three Gospels, on the writings of John, and on Paul\'s epistles. Ewald\'s influence is felt in the History of the Jewish Church by Dean Stanley, in England. The Exegetical Handbook (Kurzgefasstes exegetisches Handbuch) embraced compendious annotations by Knobel, Hitzig, Bertbeau (school of Ewald), etc., but also Olshausen (died 1839; wrote likewise on the New Testament), on all the books of the Old Testament.<P>(b) Believing tendency.<P>On the believing side, from a variety of standpoints, evangelical, critical, mediating, confessional, a multitude of commentaries on the Old Testament and New Testament were produced.<P>(i) Conservative:<P>The extremely conservative position in criticism was defended by Hengstenberg (died, 1869; on Psalms, Ecclesiastes, Ezekiel, John, Revelation), by Keil (died 1888) in the well-known Keil and Delitzsch series (Genesis to Esther, Jeremiah, Ezekiel, Daniel, Minor Prophets; also New Testament commentaries), and by Havernick (died 1845; Daniel, Ezekiel). Delitzsch (died 1890) wrote valued commentaries on Genesis, Job, Psalms, Proverbs, Canticles, Ecclesiastes, Isaiah; also on Hebrews.<P>(ii) Critical:<P>After the rise of the Wellhausen school, he considerably modified his views in the newer critical direction. His New Commentary on Genesis (1887) shows this change, but, with his other works, is still written in a strongly believing spirit. On the other hand, the critical position (older, not newer) is frankly represented by A. Dillmann (died 1894) in his commentaries on the books of the Pentateuch and Joshua (English translation of Genesis, 1897; many also of the above works are translated).<P>(iii) Mediating:<P>The mediating school, largely penetrated by the influence of Schleiermacher, had many distinguished representatives. Among the most conspicuous may be named Lucke (died 1855), who wrote on John; Bleek, the Old Testament and New Testament critical scholar (died 1859), who has a work on the first three Gospels, and lectures on Ephesians, Colossians, Philemon, Hebrews and Revelation (his Commentary on Hebrews is the best known), and Tholuck (died 1877), whose expositions and commentaries on Psalms, John, Romans and Hebrews with his Commentary on the Sermon on the Mount, are fine pieces of exegetical work.<P>A special place must be given to two names of high distinction in the present connection. One is J. P. Lange (died 1884), the projector and editor of the great Bibelwerk (theological and homiletical) in 22 volumes, to which he himself contributed the commentaries on Genesis to Numbers, Haggai, Zechariah, Malachi, Matthew, Mark, John, Romans, Revelation, with introductions and homiletic hints. The other is H. A. W. Meyer (died 1873), whose Critical and Exegetical Commentary on the New Testament from Matthew to Philippians (the remaining books being done by other scholars, Lunemann, Huther, etc.) is an essential part of every New Testament scholar\'s equipment.<P>(iv) Confessional:<P>With the more positive and confessional theologians may be ranked E. R. Stier (died 1862). whose Words of the Lord Jesus (English translation in 8 volumes; Biblical, mystical, tendency to prolixity), with commentaries on 70 selected Psalms, Proverbs, 2nd Isaiah, Ephesians, Hebrews, James and Jude, found much acceptance. A. von Harless (died 1879) wrote a Commentary on Ephesians, praised by Tholuck as one of the finest extant. Philippi (died 1882), of Jewish extraction, best known by his Commentary on Romans, was strictly Lutheran. One of the ablest of the Lutheran Confessionalists was Luthardt (died 1892), whose works include a Commentary on John\'s Gospel. Ebrard (died 1887), as stoutly confessional on the Reformed side, has an esteemed Commentary on Hebrews.<P>(v) Godet (Swiss):<P>An eminent continental theologian who cannot be overlooked is the Swiss F. L. Godet (died 1900), whose admirable Commentary on John\'s Gospel, and commentaries on Romans and Corinthians are highly appreciated.<P>(2) Britain and America.<P>Meanwhile the English speaking countries were pursuing their own paths in the production of commentaries, either in continuing their old traditions, or in striking out on new lines, under the foreign influences which, from the beginning of the century, had begun to play upon them. In England Bishop Blomfield (died 1857) published Lectures on John and Acts. In the United States there appeared from the pen of Dr. J. A. Alexander, of Princeton (died 1860), a noteworthy Commentary on Isaiah, fully abreast of the modern learning, but staunchly censervative; also a Commentary on Psalms. From the same seminary proceeded the massive commentaries of Dr. Charles Hodge (Calvinistic) on Romans, Ephesians and Corinthians. Adapted for popular use and greatly in demand for Sunday-school purposes were the Notes, Critical, Explanatory and Practical of Albert Barnes (died 1871; New School Presbyterian). These Notes, the fruit of the use of the early morning hours in a busy pastoral life, covered the whole of the New Testament, with several books of the Old Testament (Job, Psalms, Isaiah, Daniel). Sensible and informative, rather than original or profound, they proved helpful to many. Over 1,000,000 copies are stated to have been sold. Of similar aim, though less widely known, were the Notes of Professor M. W. Jacobus (died 1876; on the New Testament, Genesis and Exodus).<P>(i) Alford, Eadie:<P>A new era was opened in critical commentary in England by the publication of the Greek Testament (1849-61) of Dean Alford (died 1871), followed by his New Testament for English Readers (1868). Here was presented a thoroughly critical treatment of the texts, with a full display of the critical apparatus, and notes philological and exegetical, accompanied by learned and lucid introductions, on all the books of the New Testament. About the same time appeared the solid, if more theological and homiletical, commentaries of the Scottish scholar, J. Eadie (died 1876), on Galatians, Ephesians, Philippians, 1 and 2 Thessalonians.<P>(ii) Ellicott and Lighfoot:<P>Anglican scholarship produced its ripest fruits in this line in the classical Critical and Grammatical Commentary of Bishop Ellicott (died 1905) on Galatians, Ephesians, Philippians, Colossians, Philemon, Thessalonians, Pastoral Epistles, and the yet more remarkable series of commentaries of Bishop J. B. Lightfoot (died 1889), massive in learning, and wider in outlook than Ellicott\'s, on Galatians, Philemon, Colossians and Philemon. A large part of the value of Lightfoot\'s works consists in the special essays or dissertations on important subjects embodied in them (e.g. "St. Paul and the Three", "The Christian Ministry," "The Colossian Heresy," etc.).<P>(iii) Westcott:<P>With these names should be associated that of Bishop Westcott, Dr. Lightfoot\'s successor in the see of Durham (died 1901), whose commentaries on the Gospel and Epistles of John, and on He, take a place among the foremost. Bishop Moule, who, in turn, succeeded Dr. Westcott; has also written commentaries, simpler in character, on Romans, Ephesians, Philippians and Colossians, in the Cambridge Bible Series, and on Romans in the Expositor\'s Bible. In Old Testament exposition mention should be made of Bishop Perowne\'s valuable work on the Book of Psalms (2nd edition, revised, 1870), with his contributions to the Cambridge Bible (see below).<P>(iv) Critical Influences—Broad Church<P>Stanley and Jowett:<P>The critical and theological liberalism of Germany has made its influence felt in England in the rise of a Broad Church party, the best products of which in commentary were Dean Stanley\'s (died 1881) graphic and interesting Commentary on 1 and 2 Corinthians (1855) and Dr. B. Jowett\'s Epistles of Paul to the Thessalonians, Galatians, and Romans, with Critical Notes and Dissertations (1855). The new spirit culminated in the appearance of the famous Essays and Reviews (1860), and in the works of Bishop Colenso on the Pentateuch and Joshua (1862-79). Bishop Colenso had already published a translation of Romans, with commentary (1861).<P>(v) General Commentaries (Series):<P>Besides works by individual authors, there appeared during this period several general commentaries, to the production of which many writers contributed. The following may be mentioned. The Speaker\'s Commentary (10 volumes, 1871-82), under the general editorship of Canon F. C. Cook (died 1889), was called forth by the agitation over Bishop Colenso. Dr. Cook himself wrote introductions to Exodus, Psalms and Acts, and contributed the entire commentaries on Job, Habakkuk, Mark, Luke, 1 Peter, with parts of commentaries on Exodus, Psalms and Matthew. The work is of unequal value. A serviceable series is the Cambridge Bible for Schools and Colleges (1877ff), edited by Bishop Perowne, with Smaller Cambridge Bible for Schools, and Cambridge Greek Testament for Schools and Colleges (still in process). Dr. Perowne (died 1904) himself contributed to the first-named the commentaries on Obadiah, Jonah, Haggai, Zechariah, Malachi and Galatians. Many valuable contributions appear in this series, e.g. A. F. Kirkpatrick on 1 and 2 Samuel and Psalms, A. B. Davidson on Job and Ezekiel, Driver on Daniel, G. G. Findlay on Thessalonians, etc. Next, under the editorship of Bishop Ellicott, were produced (1877-84) A New Testament Commentary for English Readers (3 volumes), and An Old Testament Commentary for English Readers (5 volumes), which contained some valuable work (Genesis by R. Payne Smith, Exodus by Canon G. Rawlinson, etc.). Akin to this in character was the Popular Commentary on the New Testament (4 volumes, 1879-83), edited by Dr. W. Schaff. This embraced, with other excellent matter, commentaries on Thessalonians by Dr. Marcus Dods, and on 1 and 2 Peter by Dr. S. D. F. Salmond. The Pulpit Commentary (49 volumes, 1880ff), edited by J. S. Exell and Canon H. D. M. Spence, has expositions by good scholars, and an abundance of homiletical material by a great variety of authors. The series of Handbooks for Bible Classes (T. and T. Clark, Edinburgh) has a number of valuable commentaries, e.g. that of Dr. A. B. Davidson on He.<P>6. Recent Period:<P>In the most recent period the conspicuous feature has been the production of commentaries in series or by individual writers embodying the results of an advanced Old Testament criticism—in less degree of a radical New Testament criticism.<P>(1) Germany.<P>In Germany, in addition to the Kurzgefasstes exegetisches Handbuch, of older standing (see above), to which Dillmann contributed, may be mentioned Marti\'s Kurzer Hand-Commentar zum Altes Testament (1897ff) and Nowack\'s Handkommentar zum Altes Testament; also Strack-and Zockler\'s Kurzgefasster Kommentar (Old Testament and New Testament; critical, but moderate). Marti contributes to his Hand-Commentar the volumes on Isaiah, Daniel and the Minor Prophets; Nowack contributes to his Handkommentar the volumes on Judges and Ruth, 1 and 2 Samuel and the Minor Prophets (of special importance in Nowack\'s series are the volumes on Genesis by H. Gunkel, and on Deuteronomy and Joshua by C. Steuernagel); Strack writes in his own work the volumes on Genesis to Numbers (Oettli contributes Deuteronomy, Joshua and Judges). Much more conservative in spirit are the commentaries of H. C. von Orelli (Basel) on Isaiah, Jeremiah, Ezekiel and the Minor Prophets. In the New Testament, Meyer\'s Commentary has been "revised" by later writers, many of them (J. Weiss, W. Bousset, etc.) of much more advanced tendency than the original author.<P>(2) Britain and America.<P>In Britain and America like currents are observable. Professor T. K. Cheyne, who wrote a helpful commentary on the Prophecies of Isaiah (1880-81), and subsequently commentaries on Micah and Hosea (Cambridge Bible), Jeremiah (Pulpit Commentary), and on The Book of Psalms (1884), has become more and more extreme in his opinions. Of works in series the most important is The International Critical Commentary, edited by Drs. Driver and Plummer in England, and Dr. C. A. Briggs in the United States, of which 16 volumes in the Old Testament and the New Testament have already appeared. It need not be said that the commentaries in this series are always scholarly and able; those on the Old Testament are, however, all built on the Wellhausen foundations (see <a href="./study/isbe/search.html?string=CRITICISM+OF+THE+BIBLE">CRITICISM OF THE BIBLE</a>. III). Dr. Driver himself writes on Deuteronomy; Dr. J. Skinner, on Genesis; Dr. G. F. Moore, on Judges; Dr. H. P. Smith, on 1 and 2 Samuel; Dr. Briggs, on Psalms; Dr. Toy, on Proverbs; Dr. W. R. Harper (died 1906), on Amos and Hosea; while Matthew in the New Testament is covered by W. C. Allen, Luke by Dr. Plummer, Romans by Drs. Sanday and Headlam, etc. A similar series is the Westminister Commentary, recently commenced, to which Dr. Driver contributes the volume on Genesis (1904; 7th edition, 1909). Yet another recent popular series is The Century Bible, to which again leading critical scholars lend their aid (Dr. W. H. Bennett on Genesis; also on "General Epistles"; Dr. A. R. S. Kennedy on 1 and 2 Samuel; Dr. Skinner on 1 and 2 Kings; Dr. A. S. Peake on Job; also on Hebrews; Dr. Driver on a group of the Minor Prophets, etc.). A well-planned one-vol Commentary on the Holy Bible, by various writers, has recently been edited by J. R. Dummelow (Cambridge). It is prefaced by a general Introduction, with a large number of articles on the principal subjects with which a reader of the Bible will desire to be acquainted.<P>It need only be added that very many of the foreign works mentioned above (not simply those specially noted) are now accessible in English translations.<P>LITERATURE.<P>Works and articles specially devoted to commentaries are not numerous. Dr. S. Davidson has an article "Commentary" in Kitto\'s Biblical Encyclopedia, Vol I. See also F. W. Farrar\'s Hist of Interpretation (Bampton Lects for 1885). G. H. Spurgeon\'s popular talks on Commenting and Commentaries are accompanied by extensive lists of Commentaries on all parts of the Bible (severely exclusive of works deemed dangerous). Lists of commentaries on the Bible as a whole, on the Old Testament and New Testament separately, and on the several books, may be seen in most good works on Introduction, or in prolegomena to commentaries on the different books; e.g. in the general Introduction prefixed to Lange\'s Commentary on Genesis; also in the lengthy sections on Jewish, Greek, Latin and Protestant commentators, and again in the "Index of the More Important Expository Works on the Books of the Old Testament." In Bleek\'s Introduction to the Old Testament, very full information is given up to the author\'s date. Full bibliographies of modern books, including commentaries on the Old Testament, are furnished in Dr. Driver\'s Introduction. Similar lists are given in other works regarding the New Testament. For the writers of the commentaries on the special books in the above-noted German and English series, lists may generally be seen attached to each volume of the series.``132';
isbe[2218]='Commentaries, Hebrew`he\'-broo:<p>1. Philo Judaeus<p>2. Targum<p>3. Midrash<p>4. Talmud<p>5. Karaites<p>6. Middle Ages<P class="in15">(1) Saadia ben Joseph<P class="in15">(2) Rashi<P class="in15">(3) Joseph Kara<P class="in15">(4) Abraham ibn Ezra<P class="in15">(5) Qimchis<P class="in15">(6) Maimonides<P class="in15">(7) Maimunists<P class="in15">(8) Kabbalists<P class="in15">(9) The "Zohar"<P class="in15">(10) Isaac Arama<p>7. Modern Times<P class="in15">Abarbanel<p>8. The Bi\'urists<P class="in15">(1) Mendelssohn<P class="in15">(2) Zunz, etc.<P class="in15">(3) Malbim, Ehrlich, etc.<P class="in15">(4) Halevy, Hoffmann, Mueller<P class="in15">(5) Geiger, Graetz, Kohler<P>LITERATURE<hr /><P>The following outline alludes to the leading Jewish commentators and their works in chronological order. However widely the principles which guided the various Jewish schools of exegesis, or the individual commentatom, differ from those of the modern school, the latter will find a certain suggestiveness in the former\'s interpretation which well merits attention.<p>1. Philo Judaeus:<P>Philo Judaeus: A Hellenistic Jew of Alexandria, Egypt. Born about 20 BC; died after 40 AD. By his allegorical method of exegesis (a method he learned from the Stoics), Philo exercised a far-reaching influence not only on Jewish thought, but even more so on the Christian church. We have but to mention his influence on Origen and other Alexandrian Christian writers. His purpose in employing his allegorical method was, mainly, to reconcile Greek philosophy with the Old Testament.<P>See <a href="./study/isbe/search.html?string=PHILO,+JUDAEUS">PHILO, JUDAEUS</a>.<P>Josephus cannot be called a Bible commentator in the proper sense of the term.<P>See <a href="./study/isbe/search.html?string=JOSEPHUS">JOSEPHUS</a>.<p>2. Targum:<P>Targum (plural Targumim): The Aramaic translation of the Old Testament. Literally, the word designates a translation in general; its use, however, has been restricted to the Aramaic version of the Old Testament, as contrasted with the Hebrew text which was called miqra\'. The Targum includes all the books of the Old Testament except Daniel and Ezra-Nehemiah, which are written in part in Aramaic. Its inception dates back to the time of the Second Temple, and it is considered a first approach to a commentary before the time of Jesus. For the Targum is not a mere translation, but rather a combination of a translation with a commentary, resulting in a paraphrase, or an interpretative translation—having its origin in exegesis. The language of this paraphrase is the vernacular tongue of Syria, which began to reassert itself throughout Palestine as the language of common intercourse and trade, as soon as a familiar knowledge of the Hebrew tongue came to be lost. The Targumim are:<P>TO THE PENTATEUCH<P>(1) Targum Onkelos or Babylonian Targum (the accepted and official);<P>(2) Targum yerushalmi or Palestinian Targum ("Pseudo-Jonathan"; aside from this (complete) Targum there are fragments of the Palestinian Targum termed "Fragment Targrim").<P>TO THE PROPHETS<P>(1) Targrim Jonathan ben Uzziel (being the official one; originated in Palestine and was then adapted to the vernacular of Babylonia);<P>(2) A Palestinian Targrim, called Targum yerushalmi (Palestinian in origin; edition Lagarde, "Prophetae Chaldaice").<p>Other Targumim (not officially recognized):<P>(1) To the Psalms and Job;<P>(2) to Proverbs;<P>(3) to the Five Rolls;<P>(4) to Chronicles—all Palestinian.<P>See <a href="./study/isbe/search.html?string=TARGUM">TARGUM</a>.<p>3. Midrash:<P>Midhrash: Apparently the practice of commenting upon and explaining the meaning of the Scriptures originated in the synagogues (in the time of Ezra), from the necessity of an exposition of the Law to a congregation many of whom did not or might not understand the language in which it was read. Such commentaries, however, were oral and extempore; they were not until much later crystallized into a definite form. When they assumed a definite and, still later, written shape, the name Midhrash (meaning "investigation," "interpretation," from darash, "to investigate" a scriptural passage) was given. The word occurs in <a onClick="return mV(\'2Ch\',13,22);">2Ch 13:22</a> where the Revised Version (British and American) translates "commentary." From this fact some have drawn the inference that such Midhrashim were recognized and extant before the time of the Chronicler. They are: Midhrash Rabba\' on the Pentateuch and the Five Rolls (the one on Gensis occupies a first position among the various exegetical Midhrashim, both on account of its age and importance). Next comes the one on Lamentations. (Zunz pointed out that the Midhrash Rabba\' consists of ten entirely different Midhrashim.) On the same ten books there is a similar collection, called ha-Midhrash ha-gadhol (the "Great Midrash"), being a collection of quotations from a good many works including the Midhrash Rabba\'. Other Midhrashim are: The Midhrash Tanchuma\' on the Pentateuch; the Mekhilta\' on Exodus (this has been (Leipzig, 1909) translated into German by Winter and Wuensche; the latter also published, under the main title Bibliotheca Rabbinica, a collection of the old Midhrashim in a German translation with introductions and notes). Further, Ciphra\' on Leviticus; Ciphre on Numbers and Dr; peciqta\', which comments on sections taken from the entire range of Scriptures for various festivals. There are also extant separate Midhrashim on the Psalms, Proverbs, etc.<P>In this connection we have yet to mention the Yalqut Shim\'oni, a haggadic compilation attributed to the 11th or, according to Zunz, the 13th century. The Yalqut extends over the whole of the Old Testament and is arranged according to the sequence of those portions of the Bible to which reference is made. Further, the Yalqut ha-Maqiri, a work similar in contents to the Yalqut Shim\'oni, edition Greenup.<P>See <a href="./study/isbe/search.html?string=COMMENTARIES">COMMENTARIES</a>; <a href="./study/isbe/search.html?string=MIDRASH">MIDRASH</a>.<p>4 Talmud:<P>Talmud (Talmudh): This term is used here to designate the entire body of literature exclusive of the Midhrash. Ample exegetical material abounds in the Talmud as it does in the Midhrashim. The critical notes on the Bible by some Talmudists are very characteristic of their intellectual temper. Some of them were extremely radical, and expressed freely their opinions on important problems of Bible criticism, such as on the integrity of the text, on doubtful authorship, etc. An Amora\' of the 3rd century AD held the opinion that the story of Job is purely fictitious, both as to the name of the hero and as to his fate. The Talmudists also generalized, and set up critical canons. The "Baraitha\', of the Thirty-two Rules" is the oldest work on Biblical hermeneutics (Philo\'s hermeneutical rules being rather fantastic), and contains exegetical notices valid to this very day. Hermeneutics, of course, is not exegesis proper, but theory of exegesis; one results from the other, however. This Baraitha\' calls attention, for instance, to the fact that words occur in the Old Testament in an abbreviated form—a thing now generally accepted.<P>See <a href="./study/isbe/search.html?string=TALMUD">TALMUD</a>.<p>5. Karaites:<P>Karaites: "Followers of the Bible." They are sometimes referred to as the "Protestants of the Jews," professing to follow the Old Testament to the exclusion of the rabbinical tradition. The founder of this Jewish sect was a Bah Jew in the 8th century, Anan ben David, by name; hence, they were first called Ananites. The principal Karaite commentators of the 9th, 10th and 11th centuries are: Benjamin Al-Nahawendi (he was the first to use the term "Karaites," "Ba\'ale Miqra\'"), Solomon ben Jeroham, Sahl ibn Mazliah, Yusuf al-Basir, Yafith ibn Ali (considered the greatest of this period), and Abu al- Faraij Harum. Of a later date we will mention Aaron ben Joseph and Aaron ben Elijah (14th century).<P>The struggle between the Rabbinites and the Karaites undoubtedly gave the impetus to the great exegetical activity among the Jews in Arabic speaking countries during the 10th and 11th centuries. The extant fragments of Saadia\'s commentary on the Pentateuch (not less than his polemical writings proper) are full of polemics against the Karaite interpretation. And the same circumstance aroused Karaites to like efforts.<p>6. Middle Ages:<P>Middle Ages: In the old Midhrashim as well as elsewhere the consciousness of a simple meaning of a text was never entirely lost. The principal tendencies in exegesis were four; these were afterward designated by the acrostic "PARDEC": i.e. Peshat (or the simple philological explanation of words); Remez (or the allegorical); Derash (or the ethicohomiletical); and Codh (or the mystical). Naturally enough this division could never be strictly carried out; hence, variations and combinations are to be found.<P>(1) Saadia ben Joseph:<P>Saadia ben Joseph (892-942), the severest antagonist of the Karaites, translated the Old Testament into Arabic with notes. The parts published are: Pentateuch, Isaiah, Proverbs and Job.<P>Moses ha-Darshan (the Preacher) of Narbonne, France, and Tobiah ben Eliezer in Castoria, Bulgaria (11th century), are the most prominent representatives of midrashic-symbolic Bible exegesis. The former\'s work is known only by quotations, and contained Christian theological conceptions; the latter is the author of "Leqach Tobh" or "Peciqta\' Zutarta\'" on the Pentateuch and the five Meghilloth.<P>(2) Rashi:<P>Rashi (Solomon ben Isaac, of Troyes; born 1040, died 1105) wrote a very popular commentary, which extends over the whole of the Old Testament, with the exception of Chronicles, Ezra-Nehemiah, and the last part of Job. He strives for the Peshat, i.e. for a sober, natural and rational interpretation of the Bible. His is still a commentary both for the boy and the man among the Jews. Christian exegetes of the Middle Ages as well as of more modern times made Use of his Bible commentary. Nicolas de Lyra (see <a href="./study/isbe/search.html?string=COMMENTARIES">COMMENTARIES</a>) followed Rashi closely; and it is a known fact that Luther\'s translation of the Bible is dependent upon Nicolas de Lyra. Rashi\'s commentary has called forth numerous supercommentaries.<P>(3) Joseph Kara:<P>An independent and important exegete was Joseph Kara\' (about 1100). He edited and partly completed Rashi\'s commentary, particularly the part on the Pentateuch<P>(4) Abraham ibn Ezra:<P>Abraham ibn Ezra\'s (1092-1168) commentary on the Pentateuch, like Rashi\'s commentaries, has produced many supercommentaries. His is very scholarly. He was the first to maintain that Isaiah contains the work of two authors; and his doubts respecting the authenticity of the Pentateuch were noticed by Spinoza.<P>(5) Qimchis:<P>The grammarians and the lexicographers were not merely exegetical expounders of words, but many of them were likewise authors of actual commentaries. Such were the Qimchis, Joseph (father), Moses and David (his sons); especially the latter. The Qimchis were the most brilliant contributors to Bible exegesis and Hebrew philology (like Ibn Ezra) in medieval times.<P>(6) Maimonides:<P>Maimonides (1135-1204): Philo employed his allegorical method for the purpose of bringing about a reconciliation of Plato with the Old Testament. Maimonides had something similar in view. To him Aristotle was the representative of natural knowledge and the Bible of supernatural—and he sought for a reconciliation between the two in his religious philosophy. Exegesis proper was the one field, however, to which this great genius made no contribution of first-class importance.<P>(7) Maimunist:<P>The Maimunist, those exegetes of a philosophical turn, are: Joseph ibn Aknin, Samuel ibn Tibbon, his son Moses, and his son-in-law, Jacob ben Abba Mari Anatolio, whose Malmadh ha-Talmidhim is the most important work of philosophical exegesis of the period.<P>Joseph ibn Kacpi, chiefly known as a philosopher of the Maimunist type, deserves attention. Ibn Kacpi is an exegete of the first quality. His exposition of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> might be the work of the most modern scholar. He refers the prophecy to Israel, not to an individual, and in this his theory is far superior to that of some other famous Jewish expositors who interpret the chapter as referring to Hezekiah.<P>Through the philosophical homily, which began to be used after the death of Maimonides, Aristotle was popularized from the pulpit. The pulpit changed to a chair of philosophy. Aristotle\'s concepts—as Matter and Form, the Four Causes, Possibility and Reality—were then something ordinary in the sermon, and were very popular.<P>(8) Kabbalists:<P>The principal commentators with a Kabbalistic tendency are: Nachmanides (1194-1270?) whose great work is his commentary on the Pentateuch; Immanuel of Rome (1270?-1330?) who does, however, not disregard the literal meaning of the Scriptures; Bahya ben Asher (died 1340) who formulated the four methods of exegesis of "PaRDeC." referred to above; he took Nachmanides as his model; many supercommentaries were written on his commentary on the Pentateuch; and Gersonides (1288-1334), a maternal grandson of Nachmanides, who sees symbols in many Biblical passages; on account of some of his heretical ideas expressed in his philosophy, some rabbis forbade the study of his commentaries.<P>(9) The "Zohar":<P>We must not fail to make mention of the Zohar (the "Bible of the Kabbalists"), the book of all others in the Middle Ages that dominated the thinking and feeling of the Jews for almost 500 years, and which was in favor with many Christian scholars. This work is pseudepigraphic, written partly in Aramaic and partly in Hebrew. It first appeared in Spain in the 131h century, and was made known through Moses de Leon, to whom many historians attribute it.<P>(10) Isaac Arama:<P>Mention must also be made of Isaac Arama (1430-94), whose \'Aqedhah, his commentary on the Pentateuch (homiletical in style), was the standard book for the Jewish pulpit for centuries, much esteemed by the Christian world, and is still much read by the Jews, especially in Russia and Poland.<p>7. Modern Times:<P>Abarbanel:<P>Isaac Abravanel (or Abarbanel; 1437-1508): A statesman and scholar who came nearest to the modern idea of a Bible commentator by considering not only the literary elements of the Bible but the political and social life of the people as well. He wrote a general introduction to each book of the Bible, setting forth its character; and he was the first to make use of Christian commentaries which he quotes without the least prejudice. Moses Alshech (second half of 16th century) wrote commentaries, all of which are of a homiletical character. In the main the Jewish exegesis of the 16th and 17th centuries branched out into homileties.<P>We will pass over the critical annotations connected with the various editions of the Hebrew Bible, based upon the comparison of manuscripts, on grammatical and Massoretic studies, ete, such as those of Elijah Levita, Jacob ben Hayyim of Tunis (afterward a convert to Christianity), etc.<p>8. The "Bi\'urists":<P>(1) Mendelssohn:<P>The "Bi\'urists" ("Commentators"): A school of exegetes which had its origin with Mendelssohn\'s (1729-86) literal German translation of the Bible, at a time when Christian Biblical studies of a modern nature had made some progress, and under whose influence the Bi\'urists wrote. They are: Dubno, Wessely, Jaroslav, tt. Homberg, J. Euchel, etc. They laid a foundation for a critieo-historical study of the Bible among modern Jews. It bore its fruit in the 19th century in the writings of Philippson, Munk, Fuerst, etc.<P>(2) Zunz, etc.:<P>The same century produced Zunz\'s (1794-1886) Gottesdienstlichen Vortraege der Juden, the book of "Jewish science."<P>(3) Malbim, Ehrlich, etc.:<P>It also produced three Jewish exegetes, Luzzatto in Italy, Malbim and Ehrlich in Russia (the latter since 1878 residing in New York); he published, in Hebrew a commentary on the Old Testament, entitled Miqra\' ki-Peshutah (Berlin, 1899-1901, 3 volumes), and, in German, Randglossen z. hebr. Bibel, two scholarly works written from the conservative standpoint (Leipzig, 1908-). Malbim was highly esteemed by the Christian commentators Franz Delitzsch and Muehlau, who studied under him.<P>(4) Halevy, Hoffmann, Mueller:<P>Others are Joseph Halevy, a French Jew, a most original Bible investigator, and D. Hoffmann (the last two named are adversaries of "higher criticism") and D. H. Mueller. M. Heilprin wrote a collection of Bibelkritische Notizen (Baltimore, 1893), containing comparisons of various passages of the Bible, and The Historical Poetry of the Ancient Hebrews (N. Y., 1879-80, 2 volumes), and the American rabbi B, Szold, a Commentary on Job (Baltimore, 1886), written in classic Hebrew, and with accurate scholarship and in which full account is taken of the work of the Massorites. A new Hebrew commentary on the whole of the Old Testament has been since 1903 in progress under the editorship of A. Kahana. This is the first attempt since Mendelssohn\'s Bi\'ur to approach the Bible from the Jewish side with the latest philological and archaeological equipment. Among the authors are Kahana on Genesis and Jonah, Krauss on Isaiah, Chajes on Psalms and Amos, Wynkoop on Hosea and Joel, and Lambert on Daniel. This attempt well deserves attention and commendation.<P>There is still to be mentioned the work of M. M. Kalisch (1828-85), whose special object was to write a full and critical commentary on the Old Testament. Of his Historical and Critical Commentary on the Old Testament, with a New Tr, only the following parts were published: Exodus, 1855; Genesis, 1858; Leviticus (pts 1-2), 1867-72. They contain a resume of all that Jewish and Christian learning had accumulated on the subject up to the dates of their publication. In his Leviticus he anticipated Wellhausen to a large extent.<P>(5) Geiger, Graetz, Kohler:<P>We conclude with some names of the liberals: Geiger (whose Urschrift is extremely radical), Graetz, the great Jewish historian, and Kohler (president of the Hebrew Union College, Cincinnati, O.) whose Der Segen Jacobs is one of the earliest essays of "higher criticism" written by a Jew.<P>LITERATURE.<P>Steinschneider, Jewish Literature, London. 1857; Zunz. Gottesdienstlichen Vortraege der Juden, 2nd edition, Frankfurt a. M., 1892; Jewish Encyclopedia (articles by Bacher and Ginzberg); Catholic Encyclopedia (article "Commentaries"); Rosenau, Jewish Biblical Commentators, Baltimore, 1906 (popular); Winter-Wuensche, Geschichte der Juedischen Literatur, Leipzig. 1892-95, 3 volumes (the best existing anthology of Jewish literature in a modern language; it contains very valuable introductions); Wogue, Histoire de la Bible et l\'exegese biblique jusqu\' a nos jours. Paris, 1881.``130';
isbe[2219]='Commentary`kom\'-en-ta-ri (midhrash, "an investigation," from darash, "to search," "inquire," "explore"; the King James Version "story"): "The commentary of the prophet Iddo" (<a onClick="return mV(\'2Ch\',13,22);">2Ch 13:22</a>), "the commentary of the book of the kings" (<a onClick="return mV(\'2Ch\',24,27);">2Ch 24:27</a>). In these passages the word is not used exactly in its modern sense. The Hebrew term means "an imaginative development of a thought or theme suggested by Scripture, especially a didactic or homiletic exposition, or an edifying religious story" (Driver, Introduction to the Literature of the Old Testament, 5, 497). In the commentaries (Midhrashim) mentioned by the Chronicler as among his sources, the story of Abijah\'s reign was presumably related and elaborated with a view to moral instruction rather than historic accuracy.`<a href="./study/isbe/search.html?string=CHRONICLES,+BOOKS+OF">CHRONICLES, BOOKS OF</a>; <a href="./study/isbe/search.html?string=COMMENTARIES,+HEBREW">COMMENTARIES, HEBREW</a>`91';
isbe[2220]='Commerce`kom\'-ers (emporia):<p>I. Old Testament Times.<P>1. Early Overland Commerce:<P>There were forces in early Hebrew life not favorable to the development of commerce. Intercourse with foreigners was not encouraged by Israel\'s social and religious customs. From the days of the appearance of the Hebrews in Canaan, however, some commercial contact with the peoples around was inevitable. There were ancient trade routes between the East and the West, as well as between Egypt and the Mesopotamian valley. Palestine lay as a bridge between these objective points. There were doubtless traveling merchants from very remote times, interchanging commodities of other lands for those of Palestine Some of the Hebrew words for "trading" and "merchant" indicate this (compare cachar, "to travel," rakhal, "to go about"). In the nomadic period, the people were necessarily dependent upon overland commerce for at least a part of their food supply, such as grain, and doubtless for articles of clothing, too. Frequent local famines would stimulate such trade. Companies or caravans carrying on this overland commerce are seen in <a onClick="return mV(\'Gen\',37,25,28);">Ge 37:25, 28</a>, "Ishmaelites" and "Midianites, merchantmen," on their way to Egypt, with spices, balm and myrrh. Jacob caused his sons to take certain products to Egypt as a present with money to Joseph in return for grain: balsam, spices, honey, myrrh, nuts, almonds (<a onClick="return mV(\'Gen\',43,11);">Ge 43:11</a>f). The presence of a "Bab mantle" among the spoils of Ai (<a onClick="return mV(\'Jos\',7,21);">Jos 7:21</a>) indicates commerce between Canaan and the East.<P>2. Sea Traffic:<P>While there are slight indications of a possible sea trade as early as the days of the Judges (<a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a>; compare <a onClick="return mV(\'Gen\',49,13);">Ge 49:13</a>), we must wait till the days of the monarchy of David and especially Solomon for the commerce of ships. Land traffic was of course continued and expanded (<a onClick="return mV(\'1Ki\',10,15,28,29);">1Ki 10:15, 28-29</a>; <a onClick="return mV(\'2Ch\',1,16);">2Ch 1:16</a>). Sea trade at this time made large strides forward. The Philistines were earlier in possession of the coast. Friendship with Hiram king of Tyre gave Solomon additional advantages seaward (<a onClick="return mV(\'1Ki\',5,\'1-\');">1Ki 5</a>; <a onClick="return mV(\'1Ki\',9,26);">9:26</a>; <a onClick="return mV(\'1Ki\',10,\'19-29\');">10:19-29</a>; <a onClick="return mV(\'2Ch\',8,17);">2Ch 8:17</a>; <a onClick="return mV(\'2Ch\',9,14);">9:14</a>), since the Phonicians were pre-eminently the Miditerranean traders among all the people of Palestine Later, commerce declined, but Jehoshaphat attempted to revive it (<a onClick="return mV(\'1Ki\',22,48);">1Ki 22:48</a>; <a onClick="return mV(\'2Ch\',20,36);">2Ch 20:36</a>), but without success. Tyre and Sidon as great commercial centers, however, long impressed the life of Israel (<a onClick="return mV(\'Isa\',23,\'1-\');">Isa 23</a>; <a onClick="return mV(\'Eze\',26,\'1-\');">Eze 26</A>-<a onClick="return mV(\'Eze\',27,\'1-\');">27</a>). Later, in the Maccabean period, Simon acquired Joppa as a Jewish port (1Macc 14:5), and so extended Mediterranean commerce.<P>3. Land Traffic in the Time of the Kings:<P>During the peaceful reign of Solomon, there came, with internal improvements and foreign friendships, a stimulus to traffic with Egypt and the Far East over the ancient trade routes as well as with Phoenicia on the northwest. He greatly added to his wealth through tariffs levied upon merchantmen (<a onClick="return mV(\'1Ki\',10,15);">1Ki 10:15</a>). Trade with Syria in the days of Omri and Ahab is indicated by the permission Benhadad gave to Israelites to open streets, or trading quarters, in Damascus, as Syrians had in Samaria (<a onClick="return mV(\'1Ki\',20,34);">1Ki 20:34</a>). The prophets disclose repeatedly the results of foreign commerce upon the people in the days of Jotham, Ahaz and Hezekiah, and of Jeroboam II, under whom great material prosperity was attained, followed by simple luxury (<a onClick="return mV(\'Isa\',2,6,7,16);">Isa 2:6-7,16</a>; <a onClick="return mV(\'Hsa\',12,1,7,8);">Ho 12:1,7-8</a>; <a onClick="return mV(\'Amo\',6,\'3-6\');">Am 6:3-6</a>). The people in their greed of gain could not observe Sabbaths and feast days (<a onClick="return mV(\'Amo\',8,5);">Am 8:5</a>); compare Sabbath trading and its punishment in the days of the restoration (<a onClick="return mV(\'Neh\',13,\'15-22\');">Ne 13:15-22</a>). "Canaanite" became the nickname for traffickers (<a onClick="return mV(\'Zec\',14,21);">Zec 14:21</a>; compare <a onClick="return mV(\'Isa\',23,8);">Isa 23:8</a>).<p>II. New Testament Times.<P>After the conquests of Alexander 333 BC, trade between East and West was greatly stimulated. Colonies of Jews for trade purposes had been established in Egypt and elsewhere. The dispersion of the Jews throughout the Greek and Roman world added to their interest in commerce. The Mediterranean Sea, as a great Roman lake, under Roman protection, became alive with commercial fleets. The Sea of Galilee with its enormous fish industry became the center of a large trading interest to all parts. The toll collected in Galilee must have been considerable. Matthew was called from his collectorship to discipleship (<a onClick="return mV(\'Mat\',9,9);">Mt 9:9</a>); Zaccheus and other publicans became rich collecting taxes from large commercial interests like that of balsam. Jesus frequently used the commerce of the day as illustration (<a onClick="return mV(\'Mat\',13,45);">Mt 13:45</a>; <a onClick="return mV(\'Mat\',25,\'14-30\');">25:14-30</a>). Along the Palestinian coast there were several ports where ships touched: Lydda, Joppa, Caesarea; and further north Ptolemais, Tyre, Sidon and Antioch (port Seleucia).<P>The apostle Paul made use of ships touching at points on the coast of Asia Minor, and the islands along the coast, and also doing coast trade with Greece, Italy and Spain, to carry on his missionary enterprises (<a onClick="return mV(\'Act\',13,\'4-13\');">Ac 13:4-13</a>; <a onClick="return mV(\'Act\',16,11);">16:11</a>f; <a onClick="return mV(\'Act\',18,18);">18:18</a>; <a onClick="return mV(\'Act\',20,\'13-16\');">20:13-16</a>; <a onClick="return mV(\'Act\',21,\'1-8\');">21:1-8</a>; <a onClick="return mV(\'Act\',27,\'1-44\');">27:1-44</a>; <a onClick="return mV(\'Act\',28,\'1-14\');">28:1-14</a>). The rapidity with which the gospel spread throughout the Roman world in the 1st century was due no little to the use of the great Roman highways, built partly as trade routes; as well as to the constant going to and fro of tradesmen of all sorts; some of whom like Aquila and Priscilla (<a onClick="return mV(\'Act\',18,2,18,26);">Ac 18:2, 18, 26</a>), Lydia, (<a onClick="return mV(\'Act\',16,14,40);">Ac 16:14, 40</a>) and Paul himself (who was a traveling tent-maker) were active in disseminating the new faith among the Gentiles. In <a onClick="return mV(\'Jam\',4,13);">Jas 4:13</a> we have a good representation of the life of a large number of Jews of this period, who would "go into such a city, and continue there a year, and buy and sell, and get gain" (the King James Version).`<a href="./study/isbe/search.html?string=TRADE">TRADE</a>`137';
isbe[2221]='Commit`ko-mit\':Used in two senses:<P>(1) "To give in charge" or "entrust": sim, "to put" (<a onClick="return mV(\'Job\',5,8);">Job 5:8</a>); galal, "to roll" (<a onClick="return mV(\'Psa\',37,5);">Ps 37:5</a>; <a onClick="return mV(\'Pro\',16,3);">Pr 16:3</a>); paqadh, "to give, in charge" (<a onClick="return mV(\'Psa\',31,5);">Ps 31:5</a> the King James Version; compare <a onClick="return mV(\'Luk\',23,46);">Lu 23:46</a>); tithemi, "committed to us (the Revised Version, margin "placed in us") the word of reconciliation" (<a onClick="return mV(\'2Cr\',5,19);">2Co 5:19</a>); paratheke, "that which I have committed unto him" (<a onClick="return mV(\'2Ti\',1,12);">2Ti 1:12</a>; the Revised Version, margin "that which he hath committed unto me," Greek "my deposit"); "that which is committed unto thee" (<a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>, Greek "the deposit"); "that good thing," etc. (<a onClick="return mV(\'2Ti\',1,14);">2Ti 1:14</a>, Greek "the good deposit").<P>(2) "To do or practice (evil)": prasso "commit such things" (<a onClick="return mV(\'Rom\',1,32);">Ro 1:32</a>, the Revised Version (British and American) "practice"; compare <a onClick="return mV(\'Rom\',2,2);">Ro 2:2</a>). In <a onClick="return mV(\'1Jo\',3,4,8);">1Jo 3:4, 8</a> "doeth sin" (poieo, the King James Version "committeth sin") shows that it is not committing a single sin that is in view, but sinful practice.``185';
isbe[2222]='Commodious`ko-mo\'-di-us (aneuthetos, "not well placed"): The word occurs only in <a onClick="return mV(\'Act\',27,12);">Ac 27:12</a>. "As regards wintering, the place was certainly \'not commodious,\' but as regards shelter from some winds (including Northwest), it was a good anchorage" (Code of Hammurabi, XXIII, 639).``1';
isbe[2223]='Common`kom\'-un: koinos, in the classics, and primarily in the New Testament, means what is public, general, universal, as contrasted with idios, what is peculiar, individual, not shared with others. Thus, "common faith" (<a onClick="return mV(\'Tts\',1,4);">Tit 1:4</a>), "common salvation" (<a onClick="return mV(\'Jud\',1,3);">Jude 1:3</a>), refer to that in which the experience of all Christians unites and is identical: "common," because there is but one faith and one salvation (<a onClick="return mV(\'Eph\',4,\'4-6\');">Eph 4:4-6</a>). From this comes the derived meaning of what is ordinary and, therefore, to be disesteemed, as contrasted with what pertains to a class, and to be prized, because rare. This naturally coincides with Old Testament exclusivism, particularity and separation. Its religion was that of a separated people, with a separated class as its ministers, and with minute directions as to distinctions of meat, drink, times, places, rites, vessels, etc. Whatever was common or ordinary, it avoided. The New Testament, on the other hand, with its universalism of scope, and its spirituality of sphere, rose above all such externals. The salvation which it brought was directed to the redemption of Nature, as well as of man, sanctifying the creature, and pervading all parts of man\'s being and all relations of life. The antithesis is forcibly illustrated in <a onClick="return mV(\'Act\',10,14);">Ac 10:14</a>f; where Peter says: "I have never eaten anything that is common and unclean," and the reply is: "What God hath cleansed, make not thou common."``84';
isbe[2224]='Commonwealth`kom\'-un-welth (politeia): Spoken of theocracy (<a onClick="return mV(\'Eph\',2,12);">Eph 2:12</a>). The same word is rendered "freedom," the King James Version; "citizenship" the Revised Version (British and American). Also in the sense of commonwealth in the Apocrypha (2Macc 4:11; 8:17; 13:14); in the sense of citizenship (3Macc 3:21,23).`<a href="./study/isbe/search.html?string=CITIZENSHIP">CITIZENSHIP</a>`1';
isbe[2225]='Commune; Communicate; Communication`ko-mun\', komun\'-i-kat, ko-mu-ni-ka\'-shun: To commune is to converse confidentially and sympathetically. It is represented in both Hebrew and Greek by several words literally signifying to speak (compare <a onClick="return mV(\'Luk\',6,11);">Lu 6:11</a>, dialaleo; also <a onClick="return mV(\'Luk\',22,4);">Lu 22:4</a>; <a onClick="return mV(\'Act\',24,26);">Ac 24:26</a>, homileo). To communicate is to impart something to another, so that it becomes common to giver and receiver. In <a onClick="return mV(\'1Ti\',6,18);">1Ti 6:18</a>, "willing to communicate" (the Revised Version, margin "sympathize"), represents a single word koinonikoi, and refers to the habit of sharing with others either sympathy or property. the Revised Version (British and American) gives "companionships" for homiliai in <a onClick="return mV(\'1Cr\',15,33);">1Co 15:33</a> (the King James Version "communications").`<a href="./study/isbe/search.html?string=COMMUNION">COMMUNION</a>`1';
isbe[2226]='Communion With Demons; Devils`de\'-monz, (dev\'-\'-lz):<p>I. Use of Term:<P>The actual expression "communion with demons" (koinonoi ton daimonion) occurs but once in Scripture (<a onClick="return mV(\'1Cr\',10,20);">1Co 10:20</a>) where its figurative meaning is evident, but it is implied in the English version of a number of passages by the terms "one who has" or "those who have" "familiar spirits" (<a onClick="return mV(\'Lev\',19,31);">Le 19:31</a>; <a onClick="return mV(\'Lev\',20,6,27);">20:6, 27</a>; <a onClick="return mV(\'Deu\',18,11);">De 18:11</a>; <a onClick="return mV(\'1Sa\',28,3,7,8,9);">1Sa 28:3, 7-9</a>; <a onClick="return mV(\'2Ki\',21,6);">2Ki 21:6</a>; <a onClick="return mV(\'2Ki\',23,24);">23:24</a>; <a onClick="return mV(\'1Ch\',10,13);">1Ch 10:13</a>; <a onClick="return mV(\'2Ch\',33,6);">2Ch 33:6</a>; <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a>; <a onClick="return mV(\'Isa\',19,3);">19:3</a>; <a onClick="return mV(\'Isa\',29,4);">29:4</a>). These passages seem to be somewhat incongruous with Paul\'s statement, but are in reality so intimately related to it as to give and receive light through the connection.<p>II. Teaching of Scripture.<P>To begin with, we may safely say, in general, that there is no ground for asserting that the Bible admits the possibility of conscious and voluntary communion with spirits. This is an essential element of popular demonology in all ages, but it is absent from Scripture. Even in the passages mentioned above which refer to necromancers and wizards, while, as we shall see, the words indicate that such practitioners professed to rely upon spirits in their divinations, the Scriptures carefully refrain from sanctioning these claims, and a number of features in the various passages serve to indicate that the true scriptural view is quite the opposite. As this is not a prevalent opinion, we should do well to examine the passages with some little care.<P>1. The New Testament:<P>(1) We may first deal with the New Testament. In the Gospels the demoniacs are consistently looked upon and treated as unconscious and helpless victims (see <a href="./study/isbe/search.html?string=DEMON,+DEMONOLOGY">DEMON, DEMONOLOGY</a>). The frequent use of this term "demonized" (daimonizomenoi) together with all that is told us of the methods of treating these eases adopted by our Lord and His apostles (see <a href="./study/isbe/search.html?string=EXORCISM">EXORCISM</a>) indicates the belief of the New Testament writers that the control of demons over men is obtained outside of or below the region of conscious volition and that the condition of the sufferers is pathological.<P>(2) The same must be said of the Lydian maiden whose cure by Paul is recorded in <a onClick="return mV(\'Act\',16,16);">Ac 16:16</a>. This is the one instance in the New Testament where divination is connected with spirits. The account emphasizes the excitable neurosis of the patient; and the belief on the part of the apostles and of the writer of Acts that the girl was not the conscious accomplice of her masters, but their unfortunate victim through her mysterious malady, is clear. She was treated, as the other eases recorded in the New Testament, not as a conscious wrongdoer, but as a sick person to be healed.<P>2. The Old Testament:<P>(1) Turning now to the Old Testament, the instance which requires the most careful treatment, because it holds the key to all the rest, is the narrative of Saul\'s visit to the Witch of Endor in <a onClick="return mV(\'1Sa\',28,\'3-25\');">1Sa 28:3-25</a>. The Hebrew word \'obh which is usually translated "one who has a familiar spirit" (see list of passages at beginning of article) occurs in this narrative four times (verses <a onClick="return mV(\'1Sa\',28,3);">3</a>, <a onClick="return mV(\'1Sa\',28,7);">7</a> twice, <a onClick="return mV(\'1Sa\',28,8);">8</a>). According to the ordinary interpretation it is used in three different senses, two of which occur here. These three senses are<P>(a) a person who controls a spirit,<P>(b) the spirit controlled,<P>(c) the power to control such a spirit.<P>This meaning appears to be altogether too broad. Omitting to translate the word we have: (verse <a onClick="return mV(\'1Sa\',28,3);">3</a>) "Saul had put away \'obhoth, and yidh\'onim"; (verse <a onClick="return mV(\'1Sa\',28,7);">7</a>), a woman, a mistress of an \'obh; (verse <a onClick="return mV(\'1Sa\',28,8);">8</a>) "Divine unto me...by the \'obh." It is extremely unlikely that the same word should be used in two senses so far apart as "person who has a spirit" and the "spirit itself" in the same context. In the last passage mentioned (verse <a onClick="return mV(\'1Sa\',28,8);">8</a>) there is a double indication that the word \'obh cannot have either signification mentioned. Saul says: "Divine unto me by the \'obh and bring me up whomsoever I shall name unto thee." The expression "divine by" clearly points to some magical object used in divination. Control of a spirit through some magical object is familiar enough. The rest of Saul\'s statement confirms this view. The result of the divination is the calling up of a spirit. A spirit would hardly be used to call up another spirit. This conclusion is confirmed by the etymology. The word \'obh is supposed to mean "one who has a familiar spirit," from its root-significance of hollow and its primary meaning of wineskin. According to this derivation the word is applied to a necromancer on the supposition that the spirit inhabits his body and speaks from within. The transference to spirit is extremely unlikely and the explanation is not consistent with primitive ideas on spirit manifestation (see Brown, Driver, and Briggs, Hebrew and English Lexicon of the Old Testament, \'owb end).<P>(2) We, therefore, hold with H. P. Smith (International Critical Commentary, "Samuel" in the place cited.), though partly on different grounds, that the word \'obh has the same meaning in all the passages where it occurs, and that it refers to a sacred object or fetish by which spiritistic divination was carried on.<P>The significance of this conclusion is that the misleading expression "familiar spirit" disappears from the text, for Dr. Driver\'s interpretation of the companion word yidh\'onim (see International Critical Commentary, Commentary on Deuteronomy in the place cited.) will scarcely be maintained in the face of this new meaning for \'obh. The prohibition contained in the law (<a onClick="return mV(\'Lev\',20,27);">Le 20:27</a>) against \'ohboth, and those using them, places them in the same catalogue of offense and futility with idol-worship in general.<P>(3) This opinion is confirmed by two separate items of evidence.<P>(a) In the Witch of Endor story Samuel\'s appearance, according to the idea of the narrator, was due to a miracle, not to the magic power of the feeble and cheating old woman to whom Saul had resorted. God speaks through the apparition a stern message of doom. No one was more startled than the woman herself, who for once had a real vision (<a onClick="return mV(\'1Sa\',28,12);">1Sa 28:12</a>). She not only gave a loud cry of astonishment and alarm but she described the figure which she saw as "a god coming up out of the each." The story is told with fidelity and clearly indicates the opinion that the actual appearance of a spirit is so violently exceptional as to indicate the immediate power and presence of God.<P>(b) In <a onClick="return mV(\'Isa\',8,19);">Isa 8:19</a> the \'obhoth and yidh\'onim are spoken of as those who "chirp and mutter." These terms refer to the necromancers themselves (Septuagint translates \'obhoth by eggastromuthoi = ventriloquists) who practiced ventriloquism in connection with their magical rites. In <a onClick="return mV(\'Isa\',29,4);">Isa 29:4</a> it is said "Thy voice shall be as an \'obh, out of the ground." Here \'obh is usually interpreted as "ghost," but it is far more probable (see Brown, Driver, and Briggs, Hebrew and English Lexicon of the Old Testament sub loc.) that it refers as in <a onClick="return mV(\'Isa\',8,19);">8:19</a> to the ventriloqustic tricks of those who utter their oracles in voices intended to represent the spirits which they have evoked. They are stamped in these passages, as in the Witch of Endor narrative, as deceivers practicing a fraudulent article. By implication their power to evoke spirits with whom they were in familiar intercourse is denied.<P>3. The Meaning of Idol-Worship:<P>This leaves the way clear for a brief consideration of the words of Paul in <a onClick="return mV(\'1Cr\',10,20);">1Co 10:20</a> in connection with cognate passages in the Old Testament.<P>(1) He argues that since idol-worship is really demon-worship, the partaking of heathen sacrifice is a communion with demons and a separation from Christ. It is usually taken for granted that this characterization of heathen worship was simply a part of the Jewish-Christian polemic against idolatry. Our fuller knowledge of the spiritism which conditions the use of images enables us to recognize the fact that from the viewpoint of heathenism itself Paul\'s idea was strictly correct. The image is venerated because it is supposed to represent or contain an invisible being or spirit, not necessarily a deity in the absolute sense, but a super-human living being capable of working good or ill to men.<P>(2) In the King James Version the term devils is used in four Old Testament passages (<a onClick="return mV(\'Lev\',17,7);">Le 17:7</a>; <a onClick="return mV(\'Deu\',32,17);">De 32:17</a>; <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>; <a onClick="return mV(\'Psa\',106,37);">Ps 106:37</a>). In the Revised Version (British and American) "devils" has disappeared from the text—the word he-goats appears in <a onClick="return mV(\'Lev\',17,7);">Le 17:7</a> and <a onClick="return mV(\'2Ch\',11,15);">2Ch 11:15</a>, while "demons" appears in <a onClick="return mV(\'Deu\',32,17);">De 32:17</a> and <a onClick="return mV(\'Psa\',106,37);">Ps 106:37</a>. The translation of se\'irim as "he-goats" is literally correct, but conveys an erroneous conception of the meaning. The practice reprobated is the worship of Satyrs (see <a href="./study/isbe/search.html?string=SATYR">SATYR</a>) or wood-demons supposed to be like goats in appearance and to inhabit lonely places. The same word is used in <a onClick="return mV(\'Isa\',13,21);">Isa 13:21</a>; <a onClick="return mV(\'Isa\',34,14);">34:14</a>. The word translated "demons" in the Revised Version (British and American) is shedhim, a term used only twice and both times in connection with the rites and abominations of heathen worship. It is interesting to note that the word shidu is applied to the beings represented by the bull-colossi of Assyria (Driver, Deuteronomy in the place cited.). Brown, Driver, and Briggs, Hebrew and English Lexicon of the Old Testament holds that the word shedhim is an Assyrian loan-word, while Briggs (ICC, <a onClick="return mV(\'Psa\',106,37);">Ps 106:37</a>) holds that shedhim were ancient gods of Canaan. In either case the word belongs to heathenism and is used in Scripture to describe heathen worship in its own terminology. The interpretation of these beings as evil is characteristic of Biblical demonism in general (see <a href="./study/isbe/search.html?string=DEMON">DEMON</a>, etc.). The worship of idols was the worship of personal beings more than man and less than God, according to Jewish and Christian ideas (see Driver op. cit., 363). Septuagint translates both the above words by daimonia.<P>4. Conclusion:<P>The term "communion with demons" does not imply any power on the part of men to enter into voluntary relationship with beings of another world, but that, by sinful compliance in wrongdoing, such as idol-worship and magical rites, men may enter into a moral identification with evil powers against which it is their duty to fight.<P>LITERATURE.<P>The Dictionaries and Commentaries dealing with the passages quoted above contain discussions of the various aspects of the subject. Jewish superstitions are ably treated by Edersheim, Edersheim, Life and Times of Jesus the Messiah (8th edition), II, 771, 773.``169';
isbe[2227]='Communion; (Fellowship)`ko-mun\'-yun: The terms "communion" and "fellowship" of the English Bible are varying translations of the words koinonia, and koinoneo, or their cognates. They designate acts of fellowship observed among the early Christians or express the unique sense of unity and fellowship of which these acts were the outward expression. The several passages in which these terms are used fall into two groups: those in which they refer to acts of fellowship, and those in which they refer to fellowship as experienced.<p>I. Act of Fellowship.<P>The acts of fellowship mentioned in the New Testament are of four kinds.<P>1. The Lord\'s Supper:<P>Our information concerning the nature of the fellowship involved in the observance of this sacrament is confined to the single notice in <a onClick="return mV(\'1Cr\',10,16,17);">1Co 10:16-17</a>, "The cup of blessing which we bless, is it not a communion of the blood of Christ? The bread which we break, is it not a communion of the body of Christ?" Owing to the presence of the material elements in the sacrament there is a temptation to limit the word for communion to the sense of partaking. This, however, does not entirely satisfy the requirements of the context. The full significance of the term is to be sought in the light of the argument of the whole section (verses <a onClick="return mV(\'1Cr\',10,\'14-22\');">14-22</a>).<P>Paul is making a protest against Christians participating in idolatrous feasts on the ground that such feasts are really celebrated in honor of the demons associated with the idols, and that those who participate in them come into fellowship with demons. As a proof of this point the apostle cites the Lord\'s Supper with which his readers are familiar. By partaking of the cup and the bread the communicants are linked together in unity: "We, who are many, are one bread, one body: for we all partake of the one bread." Thus the communion of the elements is a real communion of the worshippers one with another and with Christ. Unless the communion be understood in this spiritual sense Paul\'s illustration falls short of the mark.<P>See <a href="./study/isbe/search.html?string=EUCHARIST">EUCHARIST</a>.<P>2. Communism:<P>The term for fellowship as used in <a onClick="return mV(\'Act\',2,42);">Ac 2:42</a> is by some interpreted in this sense: "They continued stedfastly in the apostles\' teaching and fellowship, in the breaking of bread and the prayers." The fact that the four terms are used in pairs and that three of them refer to specific acts observed by the company of believers suggests that the term for fellowship also refers to some definite act similar to the others. It is very plausible to refer this to the community of goods described in the verses immediately following (see <a href="./study/isbe/search.html?string=COMMUNITY+OF+GOODS">COMMUNITY OF GOODS</a>). The author might, however, with equal propriety have regarded the interchange of spiritual experiences as an act of worship in the same class with "the breaking of bread and the prayers."<P>3. Contributions:<P>Christian fellowship found a natural mode of expression in almsgiving. This is enjoined as a duty in <a onClick="return mV(\'Rom\',12,13);">Ro 12:13</a>; <a onClick="return mV(\'1Ti\',6,18);">1Ti 6:18</a>; <a onClick="return mV(\'Hbr\',13,16);">Heb 13:16</a>. An example of such giving is the great collection raised among the Gentile converts for the poor saints of Jerusalem (<a onClick="return mV(\'Rom\',15,26);">Ro 15:26</a>; <a onClick="return mV(\'2Cr\',8,4);">2Co 8:4</a>; <a onClick="return mV(\'2Cr\',9,13);">9:13</a>). To this collection Paul attached so much importance as a witness to the spirit of fellowship which the gospel inspires in all hearts alike, whether Jew or Gentile, that he desired even at the peril of his life to deliver it with his own hand.<P>See <a href="./study/isbe/search.html?string=COLLECTION">COLLECTION</a>.<P>4. Cooperation:<P>A form of fellowship closely related to almsgiving was that of formal aid or cooperation in Christian work, such as the aid given to Paul by the Philippians (<a onClick="return mV(\'Phl\',1,5);">Php 1:5</a>). A unique form of this cooperation is the formal endorsement by giving the fight hand of fellowship as described in <a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>.<p>II. Fellowship as Experienced.<P>From the very beginning the early Christians experienced a peculiar sense of unity. Christ is at once the center of this unity and the origin of every expression of fellowship. Sometimes the fellowship is essentially an experience and as such it is scarcely susceptible of definition. It may rather be regarded as a mystical union in Christ. In other instances the fellowship approaches or includes the idea of intercourse. In some passages it is represented as a participation or partnership. The terms occur most frequently in the writings of Paul with whom the idea of Christian unity was a controlling principle.<P>In its various relations, fellowship is represented:<P>(1) As a communion between the Son and the Father. The gospel record represents Jesus as enjoying a unique sense of communion and intimacy with the Father. Among many such expressions those of <a onClick="return mV(\'Mat\',11,\'25-27\');">Mt 11:25-27</a> (compare <a onClick="return mV(\'Luk\',10,21,22);">Lu 10:21-22</a>) and <a onClick="return mV(\'Jhn\',14,\'1-\');">Joh 14</A>-<a onClick="return mV(\'Jhn\',15,\'1-\');">15</a> are especially important.<P>(2) As our communion with God, either with the Father or the Son or with the Father through the Son or the Holy Spirit. "Our fellowship is with the Father, and with his Son Jesus Christ" (<a onClick="return mV(\'1Jo\',1,3);">1Jo 1:3</a>; compare also <a onClick="return mV(\'Jhn\',14,6,23,26);">Joh 14:6, 23, 26</a>).<P>(3) As our communion one with another. "If we walk in the light, as he is in the light, we have fellowship one with another" (<a onClick="return mV(\'1Jo\',1,7);">1Jo 1:7</a>). Sometimes the idea of communion occurs in relation with abstract ideas or experiences: "Have no fellowship with the unfruitful works of darkness" (<a onClick="return mV(\'Eph\',5,11);">Eph 5:11</a>); "the fellowship of his sufferings" (<a onClick="return mV(\'Phl\',3,10);">Php 3:10</a>); "the fellowship of thy faith" (<a onClick="return mV(\'Phm\',1,6);">Phm 1:6</a>). In three passages the relation of the fellowship is not entirely clear: the "fellowship of the Spirit" (<a onClick="return mV(\'Phl\',2,1);">Php 2:1</a>); "the communion of the Holy Spirit" (<a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a>); and "the fellowship of his Son Jesus Christ" (<a onClick="return mV(\'1Cr\',1,9);">1Co 1:9</a>). The fellowship is probably to be understood as that prevailing among Christians by virtue of the grace of Christ and the ministry of the Holy Spirit.<P>It is not to be inferred that the idea of fellowship is limited to the passages in which the specific words for communion are used. Some of the clearest and richest expressions of unity and fellowship are found in the Gospels, though, these words do not occur in them. In fact, perhaps, the most familiar and forcible expressions of the idea are those in which they are represented symbolically, as in the parable of the Vine and the Branches (<a onClick="return mV(\'Jhn\',15,1);">Joh 15:1</a>ff) or in the figure of the Body and its Members (<a onClick="return mV(\'Mat\',5,29);">Mt 5:29</a>ff; <a onClick="return mV(\'Rom\',12,5);">Ro 12:5</a>; <a onClick="return mV(\'1Cr\',12,\'1-\');">1Co 12</a>).``121';
isbe[2228]='Community of Goods`ko-mu\'-ni-ti, (hapanta koina eichon, literally, "They had all things (in) common"): In <a onClick="return mV(\'Act\',2,44);">Ac 2:44</a>, it is said that, in the infant church at Jerusalem, "all that believed were together, and had all things common," and (<a onClick="return mV(\'Act\',4,34);">Ac 4:34</a>f) "as many as were possessors of lands or houses sold them, and brought the prices of the things that were sold, and laid them at the apostles\' feet." The inference from this, that there was an absolute disposal of all the property of all the members of the church, and that its proceeds were contributed to a common fund, has been disputed upon the ground that the example of Barnabas in selling "a field" for this purpose (<a onClick="return mV(\'Act\',4,37);">Ac 4:37</a>) would not have been mentioned, if this had been the universal rule. The thought conveyed is that all believers in that church held their property as a trust from the Lord, for the benefit of the entire brotherhood, and, as there was need, did as Barnabas.<P>No commandment, of which record has been preserved, prescribed any such course. It came from the spontaneous impulse of the sense of brotherhood in Christ, when the band of disciples was still small, making them in a sense one family, and under the external constraint of extreme want and persecution. So much there was, that they realized, under such conditions they had in common, that they were ready to extend this to all things. It was, in a sense, a continuance of the practice of a common purse in the band of immediate followers of our Lord during his ministry. The penalty inflicted on Ananias and Sapphira was not for any failure to comply fully with this custom, but because this freedom which they possessed (<a onClick="return mV(\'Act\',5,4);">Ac 5:4</a>) they falsely professed to have renounced, thus receiving in the estimation of their brethren a credit that was not their due. This custom did not last long. It was possible only within a limited circle, and under very peculiar circumstances. The New Testament recognizes the right of individual property and makes no effort to remove the differences that exist among believers themselves. The community of goods which it renders possible is spiritual (<a onClick="return mV(\'1Cr\',3,21);">1Co 3:21</a>f), and not one of visible and external things. With respect to the latter, it enjoins upon the Christian, as a steward of God, the possession and administration of property for the progress of the kingdom of God, and the highest interests of men. The spirit of <a onClick="return mV(\'Act\',4,34);">Ac 4:34</a> is always to pervade the association of believers as a true Christian community. Meyer, on the above passage, has suggested that it is not unlikely that the well-known poverty of the church at Jerusalem, and its long dependence upon the alms of other churches, may be connected with this early communistic practice, which, however justifiable and commendable at the time, bore its inevitable fruits in a subsequent season of great scarcity and lack of employment.``84';
isbe[2229]='Compact; Compacted`kom-pakt\', kom-pakt\'-ed (chabhar, "to be joined"; sumbibazo, "to raise up together"): "Compact" appears as translation of chabhar in <a onClick="return mV(\'Psa\',122,3);">Ps 122:3</a>, "Jerus...a city that is compact together" (well built, its breaches restored, walls complete, and separate from all around it); and "compacted" (sumbibazo) occurs in the King James Version <a onClick="return mV(\'Eph\',4,16);">Eph 4:16</a>, "fitly joined together and compacted," the Revised Version (British and American) "fitly framed and knit together." In the Revised Version (British and American) "compacted" is also the translation of sunistemi, "to set together" (<a onClick="return mV(\'2Pe\',3,5);">2Pe 3:5</a>), "an earth compacted out of water and amidst (margin, through) water," which suggests the idea of water as the primary material (compare <a onClick="return mV(\'Gen\',1,2);">Ge 1:2</a>).``185';
isbe[2230]='Company`kum\'-pa-ni: The fertility of the original languages in synonyms and varied shades of meaning is seen by the fact that 20 Hebrew and 12 Greek words are represented by this single term. An analysis of these words shows that "company" is both an indefinite and limitless term, signifying few or many, and all kinds of assemblages of people, e.g.:<P>(1) Caravan,<P class="in15">(a) migratory (<a onClick="return mV(\'Isa\',21,13);">Isa 21:13</a> the King James Version);<P class="in15">(b) commercial (<a onClick="return mV(\'Gen\',37,25);">Ge 37:25</a> the King James Version); <a onClick="return mV(\'Job\',6,19);">Job 6:19</a>, "The companies of Sheba waited (in vain) for them."<P>(2) Military, gedhudh, "troop," hamon, <a onClick="return mV(\'2Ch\',20,12);">2Ch 20:12</a>; ro\'sh, "head," "detachment"; <a onClick="return mV(\'Jdg\',7,16,20);">Jud 7:16, 20</a>: "three companies"; <a onClick="return mV(\'Jdg\',9,34,37,43);">Jud 9:34, 37, 43</a>: "four companies."<P>(3) Band (chebher) or "gang," as rendered by Keil and Delitzsch; a gang of murderous priests (<a onClick="return mV(\'Hsa\',6,9);">Ho 6:9</a>).<P>(4) Camp or encampment (<a onClick="return mV(\'Gen\',32,8,21);">Ge 32:8, 21</a>; <a onClick="return mV(\'Gen\',50,9);">50:9</a>).<P>(5) Religious body, "company of prophets" (<a onClick="return mV(\'1Sa\',19,20);">1Sa 19:20</a>).<P>(6) Assembly, congregation, "company of nations" (<a onClick="return mV(\'Gen\',35,11);">Ge 35:11</a>; <a onClick="return mV(\'Eze\',38,4,7,13,15);">Eze 38:4, 7, 13, 15</a>).<P>(7) A tumultuous crowd (<a onClick="return mV(\'2Ki\',9,17);">2Ki 9:17</a>).<P>(8) Associate, companion, often with reference to moral affinity (<a onClick="return mV(\'Job\',34,8);">Job 34:8</a>; <a onClick="return mV(\'Pro\',29,3);">Pr 29:3</a>; <a onClick="return mV(\'Act\',10,28);">Ac 10:28</a>), kollaomai, "to glue or cement together," indicative of the binding power of moral affinity (the Revised Version (British and American) "to join himself"); as a verb, to "company with" or "keep company" (<a onClick="return mV(\'Act\',1,21);">Ac 1:21</a>; <a onClick="return mV(\'1Cr\',5,9,11);">1Co 5:9, 11</a>; <a onClick="return mV(\'2Th\',3,14);">2Th 3:14</a>). In Apocrypha in the sense of "to cohabit" (Susanna 1:54,57,58).<P>(9) A host. "Great was the company," etc. (<a onClick="return mV(\'Psa\',68,11);">Ps 68:11</a> the Revised Version (British and American) "The women...are a great host"). In the East it is the women who celebrate victories with song and dance (see <a onClick="return mV(\'1Sa\',18,6,7);">1Sa 18:6-7</a>).<P>(10) A chorus, dance (mecholah). "The company of two armies" (<a onClick="return mV(\'Sgs\',6,13);">So 6:13</a> the King James Version; the Revised Version (British and American) "the dance of Mahanaim").<P>(11) Meal party, klisia, "a reclining company at meals." "Make them sit down (Greek "recline") in companies" (<a onClick="return mV(\'Luk\',9,14);">Lu 9:14</a>). Compare "companion," from Latin com, "together," and panis, "bread."<P>(12) A myriad, a ten-thousand, an indefinite number (murias; <a onClick="return mV(\'Hbr\',12,22);">Heb 12:22</a> (the Revised Version (British and American) "hosts")).<P>(13) Companions on a journey, sunodia, "a journeying together" (<a onClick="return mV(\'Luk\',2,44);">Lu 2:44</a>).<P>(14) Signifying kinship of spirit, idios, "one\'s own." "They came to their own company" (<a onClick="return mV(\'Act\',4,23);">Ac 4:23</a>).<P>(15) A mob (<a onClick="return mV(\'Act\',17,5);">Ac 17:5</a> (the Revised Version (British and American) "a crowd")).``139';
