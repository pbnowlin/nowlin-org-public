isbe[2267]='Confound`kon-found\':The physical origin of spiritual terms is well illustrated by the principal Hebrew words for "confounded" (rendered also "ashamed," etc.); bosh, is "to become pale" (<a onClick="return mV(\'2Ki\',19,26);">2Ki 19:26</a>; <a onClick="return mV(\'Job\',6,20);">Job 6:20</a>; <a onClick="return mV(\'Psa\',83,17);">Ps 83:17</a>; <a onClick="return mV(\'Psa\',129,5);">129:5</a> the King James Version; <a onClick="return mV(\'Isa\',19,9);">Isa 19:9</a>, etc.); chapher, "to become red" (<a onClick="return mV(\'Psa\',35,4);">Ps 35:4</a>; <a onClick="return mV(\'Isa\',1,29);">Isa 1:29</a>; <a onClick="return mV(\'Isa\',24,23);">24:23</a>, "the moon shall be confounded," <a onClick="return mV(\'Mic\',3,7);">Mic 3:7</a>); yabhash, "to be dried up" (<a onClick="return mV(\'Jer\',46,24);">Jer 46:24</a> the King James Version; <a onClick="return mV(\'Jer\',48,1,20);">Jer 48:1, 20</a> the King James Version; <a onClick="return mV(\'Jer\',50,2);">Jer 50:2</a> the King James Version; <a onClick="return mV(\'Zec\',10,5);">Zec 10:5</a>); kalam, "to blush" (<a onClick="return mV(\'Psa\',69,6);">Ps 69:6</a> the King James Version; <a onClick="return mV(\'Isa\',41,11);">Isa 41:11</a>, etc.). In <a onClick="return mV(\'Gen\',11,7,9);">Ge 11:7, 9</a>, of the confusion of tongues, the word is balal, "to mix," "mingle." In <a onClick="return mV(\'Jer\',1,17);">Jer 1:17</a> the King James Version it is chathath, "to bring or put down."<P>In New Testament, kataischuno, "to put to shame" (<a onClick="return mV(\'1Cr\',1,27);">1Co 1:27</a> the King James Version; <a onClick="return mV(\'1Pe\',2,6);">1Pe 2:6</a> the King James Version); and sugchuno, "to pour together," "bewilder\' "(<a onClick="return mV(\'Act\',2,6);">Ac 2:6</a>; <a onClick="return mV(\'Act\',9,22);">9:22</a>). the Revised Version (British and American) frequently gives "ashamed" and "put to shame" instead of "confounded."``185';
isbe[2268]='Confusion`kon-fu\'-zhun (bosheth, "shame, paleness," kelimmah, "blushing," tohu; akatastasia, sugchusis): In the Old Testament bosheth (<a onClick="return mV(\'1Sa\',20,30);">1Sa 20:30</a>; <a onClick="return mV(\'Psa\',109,29);">Ps 109:29</a> the King James Version) and kelimmah (<a onClick="return mV(\'Psa\',44,15);">Ps 44:15</a>; <a onClick="return mV(\'Isa\',30,3);">Isa 30:3</a>) are the words most frequently translated "confusion"; tohu, "wastiness," "emptiness" is so translated (<a onClick="return mV(\'Isa\',24,10);">Isa 24:10</a>; <a onClick="return mV(\'Isa\',34,11);">34:11</a>; <a onClick="return mV(\'Isa\',41,29);">41:29</a>), also qalon, "lightness," "contempt" (<a onClick="return mV(\'Job\',10,15);">Job 10:15</a> = ignominy, the American Standard Revised Version) and tebhel, "profanation" (<a onClick="return mV(\'Lev\',18,23);">Le 18:23</a>; <a onClick="return mV(\'Lev\',20,12);">20:12</a>); ra\'ash, "shaking," "trembling," rendered "confused" in <a onClick="return mV(\'Isa\',9,5);">Isa 9:5</a> the King James Version; compare the Revised Version (British and American). Greek akatashatasia, "instability" is translated "confusion" (<a onClick="return mV(\'1Cr\',14,33);">1Co 14:33</a>; <a onClick="return mV(\'Jam\',3,16);">Jas 3:16</a>); sugchusis, "a pouring out together" (<a onClick="return mV(\'Act\',19,29);">Ac 19:29</a>). In The <span class="noTag">Wisdom of Solomon 14:26</span>, "changing of kind" (the King James Version) is rendered "confusion of sex."``185';
isbe[2269]='Confusion of Tongues``<a href="./study/isbe/search.html?string=BABEL,+TOWER+OF">BABEL, TOWER OF</a>; <a href="./study/isbe/search.html?string=TONGUES,+CONFUSION+OF">TONGUES, CONFUSION OF</a>`1';
isbe[2270]='Congregation`kon-gre-ga\'-shun (qahal, \'edhah).<P>1. Terms Employed:<P>These two words rendered by "congregation" or "assembly" are used apparently without any difference of sense. They appear to include an assembly of the whole people or any section that might be present on a given occasion. Indeed, sometimes the idea appears to correspond closely to that conveyed by "horde," or even by "crowd." \'Edhah is once used of bees (<a onClick="return mV(\'Jdg\',14,8);">Jud 14:8</a>). It has been sought to distinguish the two words by means of <a onClick="return mV(\'Lev\',4,13);">Le 4:13</a>, "if the whole \'edhah of Israel err, and the thing be hid from the eyes of the qahal." The qahal would then be the smaller body representing the whole \'edhah, but the general usage is not favorable to this view (compare e.g. <a onClick="return mV(\'Exd\',12,19);">Ex 12:19</a>, "cutting off from the \'edhah of Israel," with <a onClick="return mV(\'Num\',19,20);">Nu 19:20</a>, "cutting off from the qahal"). The idea denoted by these words is said by Wellhausen to be "foreign to Hebrew antiquity," though it "runs through the Priestly Code from beginning to end" (Prolegomena 78). Yet it is Deuteronomy that presents us with laws excluding certain classes from the qahal, and the word is also found in <a onClick="return mV(\'Gen\',49,6);">Ge 49:6</a>; <a onClick="return mV(\'Num\',22,4);">Nu 22:4</a> (the Revised Version (British and American) "multitude"); <a onClick="return mV(\'Deu\',5,22);">De 5:22</a>; <a onClick="return mV(\'Deu\',9,10);">9:10</a>; <a onClick="return mV(\'Deu\',31,30);">31:30</a>; <a onClick="return mV(\'Jos\',8,35);">Jos 8:35</a>; <a onClick="return mV(\'1Sa\',17,47);">1Sa 17:47</a>; <a onClick="return mV(\'1Ki\',8,14);">1Ki 8:14</a>; <a onClick="return mV(\'Mic\',2,5);">Mic 2:5</a>, and other early passages, while \'edhah occurs in <a onClick="return mV(\'1Ki\',12,20);">1Ki 12:20</a> (see further, Eerdmans, Das Buch Exodus, 80f). On the other hand taste and euphony appear to be responsible for the choice of one or other of the words in many cases. Thus the Chronicler uses qahal frequently, but \'edhah only once (<a onClick="return mV(\'2Ch\',5,6);">2Ch 5:6</a> = <a onClick="return mV(\'1Ki\',8,5);">1Ki 8:5</a>).<P>2. Legal Provisions:<P>Moses provided for the summoning of the congregation by trumpets (<a onClick="return mV(\'Num\',10,\'2-8\');">Nu 10:2-8</a>). For the sin offering to be brought if the whole congregation erred, see <a onClick="return mV(\'Lev\',4,\'13-21\');">Le 4:13-21</a>.<P><a onClick="return mV(\'Deu\',23,\'1-8\');">De 23:1-8</a> (in <a onClick="return mV(\'Hbr\',2,\'1-\');">Heb 2-9</a>) excludes bastards, Ammonites and Moabites from the assembly, even to the tenth generation, while Edomites and Egyptians were admitted in the third. Those who suffer from certain physical defects are also excluded.<P>3. Other Terms:<P>One other word must be noted, mo\'edh. It occurs often in the phrase \'ohel mo\'edh ("tent of meeting"; see <a href="./study/isbe/search.html?string=TABERNACLE">TABERNACLE</a>). But in <a onClick="return mV(\'Num\',16,2);">Nu 16:2</a> we find it used of certain princes who were "men of renown called to the assembly."<P>For atsereth, rendered by the Revised Version (British and American) "solemn assembly", see <a href="./study/isbe/search.html?string=FEASTS">FEASTS</a>. On miqra\', see <a href="./study/isbe/search.html?string=CONVOCATION">CONVOCATION</a>.``193';
isbe[2271]='Congregation, Mount of`(har-mo\'edh <a onClick="return mV(\'Isa\',14,13);">Isa 14:13</a>): The prophet has depicted the excitement caused in Sheol by the descent of the once mighty king of Babylon into the world of shades, and now himself points the contrast between the monarch\'s former haughty boastings and his present weak and hopeless condition: "Thou saidst in thy heart, I will ascend into heaven, I will exalt my throne above the stars of God; and I will sit upon the mount of congregation, in the uttermost parts of the north." Instead he is brought down "to the uttermost parts of the pit" (<a onClick="return mV(\'Isa\',14,15);">Isa 14:15</a>). By the "mount of congregation" (meeting or assembly) is evidently meant the fancied Olympus of the gods on some lofty northern height. The king vaunted that he would make his abode with the gods in heaven; now he is cast down to the depths of Sheol.``132';
isbe[2272]='Coniah`ko-ni\'-a (konyahu, "Jah is creating"): A form of the name Jehoiachin, found in <a onClick="return mV(\'Jer\',22,24,28);">Jer 22:24, 28</a>; <a onClick="return mV(\'Jer\',37,1);">37:1</a>.`<a href="./study/isbe/search.html?string=JEHOIACHIN">JEHOIACHIN</a>`1';
isbe[2273]='Cononiah`kon-o-ni\'a.`<a href="./study/isbe/search.html?string=CONANIAH">CONANIAH</a>`1';
isbe[2274]='Conqueror`kon\'-ker-er: Known only in the compound verb (hupernikomen, <a onClick="return mV(\'Rom\',8,37);">Ro 8:37</a>): A usual meaning of the preposition in composition is "above all measure"; hence, "more than conquerors," the Revised Version (British and American), the King James Version. The comparison is to the completeness of the victory. Others may place their enemies in subjection; those here mentioned master not only their foes, but themselves. Others destroy their foes and their resources; while those who are "more than conquerors" convert foes into means of still farther promoting the interests for which they struggle (<a onClick="return mV(\'Rom\',3,3,4,5);">Ro 3:3-5</a>). Nor is the victory external and transient, but internal and permanent.``84';
isbe[2275]='Conscience`kon\'-shens (he suneidesis):<p><b>I. SEQUENT CONSCIENCE</b><P class="in15">1. Judicial<P class="in15">2. Punitive<P class="in15">3. Predictive<P class="in15">4. Social<p><b>II. ANTECEDENT CONSCIENCE</b><p><b>III. INTUITIONAL AND ASSOCIATIONAL THEORIES</b><p><b>IV. THE EDUCATION OF CONSCIENCE</b><p><b>V. HISTORY AND LITERATURE</b><hr /><P>1. Earlier Views<P>2. Reformation and After<p>I. Sequent Conscience.<P>The aspect of conscience earliest noticed in literature and most frequently referred to at all times is what is called the Sequent Conscience—that is to say, it follows action.<P>1. Judicial:<P>This is judicial. No sooner is a decision formed than there ensues a judgment favorable or adverse, a sentence of guilty or not guilty. Conscience has often been compared to a court of law, in which there are culprit, judge, witnesses and jury; but these are all in the subject\'s own breast, and are in fact himself.<P>2. Punitive:<P>It is punitive. In the individual\'s own breast are not only the figures of justice already mentioned, but the executioner as well; for, on the back of a sentence of condemnation or acquittal, there immediately follows the pain of a wounded or the satisfaction of an approving conscience; and of all human miseries or blisses this is the most poignant. Especially has the remorse of an evil conscience impressed the human imagination, in such instances as Cain and Judas, Saul and Herod; and the poets, those knowers of human nature, have found their most moving themes in the delineation of this aspect of human experience. The ancient poets represented the terrors of conscience under the guise of the Erinyes or Furies, who, with swift, silent, unswerving footstep, tracked the criminal and pulled him down, while Shakespeare, in such dramas as Macbeth and Richard the Third, has burned the same lessons into the imagination of all readers of his works. The satisfaction of a good conscience may stamp itself on the habitual serenity of one face, and the accusations of an evil conscience may impart a hunted and sinister expression to another (compare The <span class="noTag">Wisdom of Solomon 17:11</span>).<P>3. Predictive:<P>It is predictive. There is no instinct in the soul of man more august than the anticipation of something after death—of a tribunal at which the whole of life will be revised and retribution awarded with perfect justice according to the deeds done in the body. It is this which imparts to death its solemnity; we instinctively know that we are going to our account. And such great natural instincts cannot be false.<P>4. Social:<P>It is social. Not only does a man\'s own conscience pass sentence on his conduct, but the consciences of others pass sentence on it too; and to this may be due a great intensification of the consequent sensations. Thus, a crime may lie hidden in the memory, and the pain of its guilt may be assuaged by the action of time, when suddenly and unexpectedly it is found out and exposed to the knowledge of all; and, only when the force of the public conscience breaks forth on the culprit, driving him from society, does he feel his guilt in all its magnitude. The "<a href="./study/isbe/search.html?string=DAY+OF+JUDGMENT">Day of Judgment</a>" (which see), as it is represented in Scripture, is an application of this principle on a vast scale; for there the character and conduct of everyone will be submitted to the conscience of all. On the other hand, a friend may be to a man a second conscience, by which his own conscience is kept alive and alert; and this approval from without may, in some cases, be, even more than the judgment within, an encouragement to everything that is good or a protection against temptation.<p>II. Antecedent Conscience.<P>From the Sequent is distinguished the Antecedent Conscience, which designates a function of this faculty preceding moral decision or action. When the will stands at the parting of the ways, seeing clearly before it the right course and the wrong, conscience commands to strike into the one and forbids to choose the other. This is its imperative; and—to employ the language of Kant—it is a categorical imperative. What conscience commands may be apparently against our interests, and it may be completely contrary to our inclinations; it may be opposed to the advice of friends or to the solicitations of companions; it may contradict the decrees of principalities and powers or the voices of the multitude; yet conscience in no way withdraws or modifies its claim. We may fail to obey, giving way to passion or being overborne by the allurements of temptation; but we know that we ought to obey; it is our duty; and this is a sublime and sacred word. The great crises of life arise when conscience is issuing one command and self-interest or passion or authority another, and the question has to be decided which of the two is to be obeyed. The interpreters of human life have known how to make use of such moments, and many of the most memorable scenes in literature are of this nature; but the actual history of mankind has also been dignified with numerous instances in which confessors and martyrs, standing on the same ground, have faced death rather than contravene the dictates of the authority within; and there never passes an hour in which the eye of the All-seeing does not behold someone on earth putting aside the bribes or self- interest or the menaces of authority and paying tribute to conscience by doing the right and taking the consequences.<p>III. Intuitional and Associational Theories.<P>Up to this point there is little difficulty or difference of opinion; but now we come to a point at which very differing views emerge. It was remarked above, that when anyone stands at the parting of the ways, seeing clearly the right course and the wrong, conscience imperatively commands him which to choose and which to avoid; but how does anyone know which of the two alternatives is the right and which the wrong? Does conscience still suffice here, or is he dependent on another faculty? Here the Intuitional and the Associational, or—speaking broadly—the Scotch and the English, the German and the French schools of ethics diverge, those on the one side holding that conscience has still essential guidance to give, while those on the other maintain that the guidance must now be undertaken by other faculties. The Sensational or Experimental school holds that we are dependent on the authority of society or on our own estimate of the consequences of actions, while the opposite school teaches that in the conscience there is a clear revelation of certain moral laws, approving certain principles of action and disapproving others. The strong point of the former view is the diversity which has existed among human beings in different ages and in different latitudes as to what is right and what is wrong. What was virtuous in Athens might be sinful in Jerusalem; what is admired as heroism in Japan may be despised as fool-hardiness in Britain. To this it may be replied, first, that the diversity has been greatly exaggerated; the unanimity of the human conscience under all skies being greater than is allowed by philosophers of this school. "Let any plain, honest man," says Butler, "before he engages in any course of action, ask himself, Is this I am going about right, or is it wrong? Is it good, or is it evil? and I do not in the least doubt but that this question will be answered agreeably to truth and virtue by almost any fair man in almost any circumstances." Then, there are many moral judgments supposed to be immediate verdicts of conscience which are really logical inferences from the utterances of this faculty and are liable to all the fallacies by which reasoning in any department of human affairs is beset. It is only for the major premise, not for the conclusion, that conscience is responsible. The strong point of the Intuitional school, on the other hand, is the power and right of the individual to break away from the habits of society, and, in defiance of the commands of authority or the voices of the multitude, to follow a course of his own. When he does so, is it a logical conclusion as to the consequences of action he is obeying, or a higher intuition? When, for example, Christianity announced the sinfulness of fornication in opposition to the laxity of Greece and Rome, was it an argument about consequences with which she operated successfully, or an instinct of purity which she divined at the back of the actions and opinions of heathendom? The lettering of the moral law may have to be picked out and cleansed from the accumulations of time, but the inscription is there all the same.<p>IV. The Education of Conscience.<P>It may be, however, that a more exact analysis of the antecedent conscience is requisite. Between the categorical imperative, which commands to choose the right path and avoid the wrong, and the indicative, which declares that this is the right way and that the wrong, there ought perhaps to be assumed a certainty that one of the alternative ways is right and must be pursued at all hazards, while the other is wrong and must be abandoned at whatever cost. This perception, that moral distinctions exist, separate from each other as heaven and hell, is the peculiarity of conscience; but it does not exclude the necessity for taking time to ascertain, in every instance, which of the alternatives has the one character and which the other, or for employing a great variety of knowledge to make this sure. Those who would limit conscience to the faculty which utters the major premises of moral reasoning are wont to hold that it can never err and does not admit of being educated; but such a use of the term is too remote from common usage, and there must be room left for the conscience to enlighten itself by making acquaintance with such objective standards as the character of God, the example of Christ, and the teaching of Scripture, as well as with the maxims of the wise and the experience of the good.<P>Another question of great interest about the conscience is, whether it involves an intuition of God. When it is suffering the pain of remorse, who is it that inflicts the punishment? Is it only the conscience itself? Or is man, in such experiences aware of the existence of a Being outside of and above himself? When the will is about to act, it receives the command to choose the right and refuse the wrong; but who issues this command? Is it only itself, or does the imperative come with a sanction and solemnity betokening a higher origin? Conscience is an intuition of moral law—the reading, so to speak, of a luminous writing, which hangs out there, on the bosom of Nature—but who penned that writing? It used to be thought that the word Conscience implied, in its very structure, a reference to God, meaning literally, "knowledge along with another," the other being God. Though this derivation be uncertain, many think that it exactly expresses the truth. There are few people with an ethical experience of any depth who have not sometimes been overwhelmingly conscious of the approval or disapproval of an unseen Being; and, if there be any trustworthy argument for the existence of a Deity, prior to supernatural revelation, this is where it is to be found.<p>V. History and Literature.<P>Only a few indications of history can be given here.<P>1. Earlier Views:<P>The conscience, at least the sequent conscience, was identified in the ancient world, and the rise of a doctrine on the subject belongs to the period when the human mind, being shut out from public activity through political changes, was thrown back upon itself and began to watch closely its own symptoms. The word has a specially prominent place in the philosophical writings of Cicero. Strange to say, it does not occur in the Old Testament; but, though not the name, the thing appears there frequently enough. On the very first page of revelation, the voice of God is heard calling among the trees of the garden (<a onClick="return mV(\'Gen\',3,8);">Ge 3:8</a>); and, in the very next incident, the blood of Abel cries out to heaven from the ground (<a onClick="return mV(\'Gen\',4,10);">Ge 4:10</a>). In the New Testament the word occurs with tolerable frequency, especially in the speeches (<a onClick="return mV(\'Act\',24,16);">Ac 24:16</a>, etc.) and writings of Paul (<a onClick="return mV(\'Rom\',2,15);">Ro 2:15</a>; <a onClick="return mV(\'Rom\',9,1);">9:1</a>; <a onClick="return mV(\'Rom\',13,5);">13:5</a>; <a onClick="return mV(\'1Cr\',6,\'7-12\');">1Co 6:7-12</a>, etc.); and this might have been expected to secure for it a prominent place in the doctrine of the church. But this did not immediately take effect, although Chrysostom already speaks of Conscience and Nature as two books in which the human mind can read of God, previous to supernatural revelation. In the Middle Ages the conscience received from two sources so much stimulation that both thing and name were certain to come into greater prominence in the speculations of the schools. The one of these influences was the rise of Monasticism, which, driving human beings into solitude, made the movements of their own minds the objects of everlasting study to themselves; and the other was the practice of auricular confession, which became, especially to many of the inmates of the houses of religion, the most interesting business of life; because, in order to meet the confessor, they scanned every thought and weighed every scruple, becoming adepts at introspection and self-discipline. Thus it came to pass that ethics took the form of Cases of Conscience, the priest having to train himself, or to be trained by professors and through books, to be able to answer every query submitted to him in the confessional. The ripest fruit of this method appears in the Summa of Aquinas, who discusses elaborately the doctrine of conscience, dividing it into two parts—synderesis (from sunteresis) and conscientia—the one of which supplies the major premises and cannot err, while the other draws the inferences therefrom and is liable to make mistakes. The Mystics identified the synderesis as the point in the spirit of man at which it can be brought into contact and connection with the Spirit of God.<P>2. Reformation and After:<P>At the Reformation the conscience was much in the mouths of men, both because the terrors of conscience formed a preparation for comprehending justification by faith and because, in appearing before principalities and powers in vindication of their action, the Reformers took their stand on conscience, as Luther did so memorably at the Diet of Worms; and the assertion of the rights of conscience has ever since been a conspicuous testimony of Protestantism; whereas Romanists, especially as represented by the Jesuits, have treated the conscience as a feeble and ignorant thing, requiring to be led by authority—that is, by themselves. The forms of medievalism long clung even to Protestant literature on this subject. It may not be surprising to find a High Churchman like Jeremy Taylor, in his Ductor Dubitantium, discussing ethics as a system of cases of conscience, but it is curious to find a Puritan like Baxter (in his Christian Directory), and a Scottish Presbyterian like David Dickson (in his Therapeutica Sacra) doing the same. Deism in England and the Enlightenment in Germany magnified the conscience, to which they ascribed such a power of revealing God as made any further revelation unnecessary; but the practical effect was a secularization and vulgarization of the general mind; and it was against these rather than the system which had produced them that Butler in England and Kant in Germany had to raise the standard of a spiritual view of life. The former said of the conscience that, if it had power as it had right, it would absolutely govern the world; and Kant\'s sublime saying is well known, at the close of his great work on Ethics: "Two things fill the soul with ever new and growing wonder and reverence, the oftener and the longer reflection continues to occupy itself with them—the starry heavens above and the moral law within." The rise of an Associational and Developmental Philosophy in England, represented by such powerful thinkers as the Mills, father and son, Professor Bain and Herbert Spencer, tended to dissipate the halo surrounding the conscience, by representing it as merely an emotional equivalent for the authority of law and the claims of custom, so stamped on the mind by the experience of generations that, its earthly source forgotten, it came to be attributed to supernatural powers. But this school was antagonized with success by such thinkers as Martineau and T. H. Green. R. Rothe regarded conscience as a term too popular and of too variable signification to be of much use in philosophical speculation; but most of the great succession of writers on Christian ethics who followed him have treated it seriously; Dorner especially recognizing its importance, and Newman Smyth bestowing on it a thoroughly modern treatment. Among German works on the subject that of Gass, which contains an appendix on the history of the term synderesis, is deserving of special attention; that by Kahler is unfinished, as is also the work in English by Robertson; The Christian Conscience by Davison is slight and popular. Weighty discussions will be found in two books on Moral Philosophy—the Handbook of Calderwood, and the Ethics of Mezes. But there is abundance of room for a great monograph on the subject, which would treat conscience in a comprehensive manner as the subjective standard of conduct, formed by progressive familiarity with the objective standards as well as by practice in accordance with its own authority and with the will of God.``163';
isbe[2276]='Consecrate; Consecration`kon\'-se-krat, kon-se-kra\'-shun.<P>1. In the Old Testament:<P>In the Old Testament for several Hebrew words of different meanings:<P>(1) charam: "I will consecrate (the Revised Version (British and American) "devote") their gain unto the Lord," i.e. the spoil of the nations shall be dedicated to the service of Yahweh (<a onClick="return mV(\'Mic\',4,13);">Mic 4:13</a>).<P>See <a href="./study/isbe/search.html?string=BAN">BAN</a>; <a href="./study/isbe/search.html?string=CURSE">CURSE</a>.<P>(2) nazar, nezer (<a onClick="return mV(\'Num\',6,7,9,12);">Nu 6:7, 9, 12</a>; the Revised Version (British and American) "separate").<P>See <a href="./study/isbe/search.html?string=NAZIRITE">NAZIRITE</a>.<P>(3) qadhesh: "to be set apart," or "to be holy": of Aaron and his sons (<a onClick="return mV(\'Exd\',28,3);">Ex 28:3</a>; <a onClick="return mV(\'Exd\',30,30);">30:30</a>; the Revised Version (British and American) "sanctify"). The silver and gold and brass and iron of the banned city of Jericho are "consecrated" things (the Revised Version (British and American) "holy") unto the Lord (<a onClick="return mV(\'Jos\',6,19);">Jos 6:19</a>); of the priests (<a onClick="return mV(\'2Ch\',26,18);">2Ch 26:18</a>); of sacrifices (<a onClick="return mV(\'2Ch\',29,33);">2Ch 29:33</a>; <a onClick="return mV(\'2Ch\',31,6);">31:6</a>; <a onClick="return mV(\'Ezr\',3,5);">Ezr 3:5</a>).<P>See <a href="./study/isbe/search.html?string=HOLINESS">HOLINESS</a>.<P>(4) mille\' yadh, literally, "to fill the hand"; and substantive plural millu\'im, a peculiar idiom used frequently and generally for the installation of a priest into his office; and substantive for the installation offerings which were probably put into the priest\'s hands to symbolize his admission into office; hence, the phrase, "and thou shalt consecrate Aaron and his sons" (<a onClick="return mV(\'Exd\',29,9);">Ex 29:9</a>; <a onClick="return mV(\'Exd\',28,41);">28:41</a>; <a onClick="return mV(\'Exd\',29,29,33,35);">29:29, 33, 35</a>; <a onClick="return mV(\'Exd\',32,29);">32:29</a>; <a onClick="return mV(\'Lev\',8,33);">Le 8:33</a>; <a onClick="return mV(\'Lev\',16,32);">16:32</a>; <a onClick="return mV(\'Lev\',21,10);">21:10</a>; <a onClick="return mV(\'Num\',3,3);">Nu 3:3</a>; <a onClick="return mV(\'Jdg\',17,5,12);">Jud 17:5, 12</a>; <a onClick="return mV(\'2Ch\',29,31);">2Ch 29:31</a>); of Jeroboam\'s non-Levitical priesthood (<a onClick="return mV(\'1Ki\',13,33);">1Ki 13:33</a>; <a onClick="return mV(\'2Ch\',13,9);">2Ch 13:9</a>); of the altar (<a onClick="return mV(\'Eze\',43,26);">Eze 43:26</a>) and of those who contributed to build the temple (<a onClick="return mV(\'1Ch\',29,5);">1Ch 29:5</a>). Subst. of an act of installation (<a onClick="return mV(\'Lev\',7,37);">Le 7:37</a>; <a onClick="return mV(\'Lev\',8,33);">8:33</a>), and of installation offerings (<a onClick="return mV(\'Exd\',29,22,26,27,31);">Ex 29:22, 26-27, 31</a>; <a onClick="return mV(\'Lev\',8,22,28,29,31);">Le 8:22, 28-29, 31</a>).<P>2. In the New Testament:<P>In the New Testament teleioo, "to make perfect" (<a onClick="return mV(\'Hbr\',7,28);">Heb 7:28</a>; the Revised Version (British and American) "perfected"); egkainizo, "to make new" (<a onClick="return mV(\'Hbr\',10,20);">Heb 10:20</a>; the Revised Version (British and American) "dedicated").``145';
isbe[2277]='Consent`kon-sent\':The verb implies compliance with the guidance and direction of another, and, therefore, a secondary and subordinate relation of approval, sympathy and concurrence on the part of the one who consents. He does not take the initiative, but yields to what the principal proposes. The phrase ek sumphonou, "by consent," means "by mutual agreement" (<a onClick="return mV(\'1Cr\',7,5);">1Co 7:5</a>), both parties concerned being placed on an equality. "With one consent" (<a onClick="return mV(\'Zep\',3,9);">Ze 3:9</a>, Hebrew "with one shoulder"; <a onClick="return mV(\'Luk\',14,18);">Lu 14:18</a>) suggests, although it does not necessarily imply, the result of deliberation and consultation; it may have no other force than that of unanimity.``84';
isbe[2278]='Consider`kon-sid\'-er: In the New Testament the force of the word is brought out most vividly in <a onClick="return mV(\'Mat\',6,26);">Mt 6:26</a> (katamanthano), where it means to "examine closely," as though the observer had to bend down for this purpose, and in <a onClick="return mV(\'Luk\',12,27);">Lu 12:27</a>; <a onClick="return mV(\'Hbr\',10,24);">Heb 10:24</a> (katanoeo, to "observe well"), while in <a onClick="return mV(\'Hbr\',13,7);">Heb 13:7</a> the anatheoreo, "look up toward" or "look again at" is consistent with the reverential regard commended in the context. Used in the Old Testament for a variety of Hebrew terms, signifying inspecting (<a onClick="return mV(\'Pro\',31,16);">Pr 31:16</a>), examining (<a onClick="return mV(\'Lev\',13,13);">Le 13:13</a>), giving serious thoughts to (<a onClick="return mV(\'Psa\',77,5);">Ps 77:5</a>; <a onClick="return mV(\'Isa\',1,3);">Isa 1:3</a>), it often means little more than "see" or "behold" (<a onClick="return mV(\'Psa\',8,3);">Ps 8:3</a>; <a onClick="return mV(\'Psa\',9,13);">9:13</a>).``84';
isbe[2279]='Consist`kon-sist\' (sunistemi): To stand together, exist, subsist (<a onClick="return mV(\'Col\',1,17);">Col 1:17</a>, "in him all things consist," i.e. the continuance of the universe is dependent upon His support and administration). In <a onClick="return mV(\'Luk\',12,15);">Lu 12:15</a>, it translates the verb eimi, "to be," to express the thought that wealth is only an accident, not an essential to the highest ideal of life.``1';
isbe[2280]='Consolation`kon-so-la\'-shun (paraklesis): "Consolation of Israel" (<a onClick="return mV(\'Luk\',2,25);">Lu 2:25</a>), refers to the fulfillment of the promises in <a onClick="return mV(\'Isa\',40,1);">Isa 40:1</a>ff. See <a href="./study/isbe/search.html?string=COMFORT">COMFORT</a>. "Son of consolation" (<a onClick="return mV(\'Act\',4,36);">Ac 4:36</a> the King James Version and the American Revised Version, margin).`<a href="./study/isbe/search.html?string=BARNABAS">BARNABAS</a>`1';
isbe[2281]='Consort`kon-sort\' (proskleroo, "to allot," <a onClick="return mV(\'Act\',17,4);">Ac 17:4</a>). The verb may be either in the middle or passive voice. the Revised Version (British and American), the King James Version, and Luther\'s German translation regard it as middle, and render it: "cast their lots with," "associated," "united with." In advocacy of the passive, see Alford\'s Greek Testament, proposing: "were added," as if by lot, the allotment eing determined by God who gave them the Holy Spirit directing their choice. The English has the Latin for "lot" as its base.``1';
isbe[2282]='Conspiracy`kon-spir\'-a-si.`<a href="./study/isbe/search.html?string=CONFEDERACY">CONFEDERACY</a>`1';
isbe[2283]='Constant; Constantly`kon\'-stant, kon\'-stant-li: In <a onClick="return mV(\'1Ch\',28,\'1-\');">1Ch 28</a> (chazaq) meaning "firm," "strong." In <a onClick="return mV(\'Pro\',21,28);">Pr 21:28</a> the adverb ("constantly") of the King James Version is replaced in the American Standard Revised Version by "shall speak so as to endure," the English Revised Version "unchallenged." the Revised Version (British and American) gives "confidently" for the King James Version "constantly" in <a onClick="return mV(\'Act\',12,15);">Ac 12:15</a>; <a onClick="return mV(\'Tts\',3,8);">Tit 3:8</a>.``1';
isbe[2284]='Constellations`kon-ste-la\'-shuns (kecilim, literally, "Orions").`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[2285]='Constrain`kon-stran\':Generally in the sense of pressing urgently (<a onClick="return mV(\'2Ki\',4,8);">2Ki 4:8</a>; <a onClick="return mV(\'Luk\',24,29);">Lu 24:29</a>; <a onClick="return mV(\'Act\',16,15);">Ac 16:15</a>), to impel or carry away (<a onClick="return mV(\'2Cr\',5,14);">2Co 5:14</a>); sometimes to be compelled of necessity (<a onClick="return mV(\'Job\',32,18);">Job 32:18</a>; <a onClick="return mV(\'Act\',28,19);">Ac 28:19</a>; compare <a onClick="return mV(\'Gal\',6,12);">Ga 6:12</a>).`<a href="./study/isbe/search.html?string=COMPEL">COMPEL</a>`1';
isbe[2286]='Consult`kon-sult\' (sha\'al, malakh, ya\'ats (Aramaic) ye\'aT; sumbouleuomai):<P>(1) "To ask," "inquire," "seek advice." Ezekiel speaks of the king of Babylonian consulting the teraphim (<a onClick="return mV(\'Eze\',21,21);">Eze 21:21</a>) and the Israelites were admonished to have noting to do with "a consulter with a familiar spirit" (<a onClick="return mV(\'Deu\',18,11);">De 18:11</a>).<P>(2) "To take counsel," "devise," "plan." The various officials of Babylon "consulted together to establish a royal statute" (<a onClick="return mV(\'Dan\',6,7);">Da 6:7</a>; compare <a onClick="return mV(\'Mat\',26,4);">Mt 26:4</a>).<P>(3) "To deliberate with one\'s self," "make up one\'s mind." Nehemiah consulted with himself as to what might be done for Jerusalem (<a onClick="return mV(\'Neh\',5,7);">Ne 5:7</a>). Jesus spoke of a king "consulting" (the King James Version) whether he be able to wage a war (<a onClick="return mV(\'Luk\',14,31);">Lu 14:31</a>; the Revised Version (British and American) "take counsel").`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=COMMUNION+WITH+DEMONS">COMMUNION WITH DEMONS</a>; <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION</a>`62';
isbe[2287]='Consume`kon-sum\' (akhal, kalah, tamam; analisko): In Old Testament \'akhal ("to eat," "devour") occurs very frequently, and is translated "consumed" (<a onClick="return mV(\'Gen\',31,40);">Ge 31:40</a>; <a onClick="return mV(\'Exd\',15,7);">Ex 15:7</a>; <a onClick="return mV(\'Psa\',78,63);">Ps 78:63</a>, etc.); kalah ("to finish") is also frequently translated "consume," "consumed" (<a onClick="return mV(\'Gen\',41,30);">Ge 41:30</a>; <a onClick="return mV(\'Exd\',32,10);">Ex 32:10</a>; <a onClick="return mV(\'Psa\',59,13);">Ps 59:13</a>, etc.); tamam, "to be perfect," "finished" (<a onClick="return mV(\'Num\',17,13);">Nu 17:13</a>; <a onClick="return mV(\'Deu\',2,15);">De 2:15</a>; <a onClick="return mV(\'Psa\',73,19);">Ps 73:19</a>, etc.). There are many other words translated "consume" and "consumed," e.g. cuph, "to end" (<a onClick="return mV(\'Jer\',8,13);">Jer 8:13</a>; <a onClick="return mV(\'Zec\',1,2,3);">Zec 1:2-3</a>); balah, "to fade," "wear away" (<a onClick="return mV(\'Job\',13,28);">Job 13:28</a>; <a onClick="return mV(\'Psa\',49,14);">Ps 49:14</a>); gazal, implying violence (<a onClick="return mV(\'Job\',24,19);">Job 24:19</a>); caphah, "to end" (<a onClick="return mV(\'Gen\',19,15,17);">Ge 19:15, 17</a>; <a onClick="return mV(\'Isa\',7,20);">Isa 7:20</a>, etc.); ashesh, "to be old" (<a onClick="return mV(\'Psa\',6,7);">Ps 6:7</a>; <a onClick="return mV(\'Psa\',31,9,10);">31:9-10</a> the King James Version); maqaq, "to become completed" (<a onClick="return mV(\'Eze\',4,17);">Eze 4:17</a>; <a onClick="return mV(\'Zec\',14,12);">Zec 14:12</a> bis); \'asah kalah is rendered "utterly consume" (<a onClick="return mV(\'Neh\',9,31);">Ne 9:31</a>); analisko, "to use up," occurs in <a onClick="return mV(\'Luk\',9,54);">Lu 9:54</a>; <a onClick="return mV(\'Gal\',5,15);">Ga 5:15</a>; <a onClick="return mV(\'2Th\',2,8);">2Th 2:8</a> (the King James Version); dapanao, "to spend," is translated "consume" in <a onClick="return mV(\'Jam\',4,3);">Jas 4:3</a> (the Revised Version (British and American) "spend"); katanalisko, "to consume utterly," occurs only in <a onClick="return mV(\'Hbr\',12,29);">Heb 12:29</a>; "for our God is a consuming fire."<P>In the Revised Version (British and American) "devour," "devoured" are several times substituted for "consume," "consumed," e.g. <a onClick="return mV(\'Job\',20,26);">Job 20:26</a>; <a onClick="return mV(\'Jer\',49,27);">Jer 49:27</a>; <a onClick="return mV(\'Num\',16,35);">Nu 16:35</a>; "boil well" (<a onClick="return mV(\'Eze\',24,10);">Eze 24:10</a>); for "be consumed with dying" (<a onClick="return mV(\'Num\',17,13);">Nu 17:13</a>), "perish all of us"; "consume" is substituted for "corrupt" in <a onClick="return mV(\'Mat\',6,19);">Mt 6:19</a>; "my spirit is consumed," for "my breath is corrupt" (<a onClick="return mV(\'Job\',17,1);">Job 17:1</a>); instead of "the flame consumeth the chaff" (<a onClick="return mV(\'Isa\',5,24);">Isa 5:24</a>) we have "as the dry grass sinketh down in the flame"; and for "whom the Lord shall consume" (<a onClick="return mV(\'2Th\',2,8);">2Th 2:8</a>), the Revised Version (British and American) reads (after a different text) "whom the Lord Jesus shall slay," "consume" in the American Revised Version, margin.``185';
isbe[2288]='Consummation`kon-su-ma\'-shun (killayon from kalah): The word, meaning destruction, completion, or failing (<a onClick="return mV(\'Isa\',10,23);">Isa 10:23</a>; <a onClick="return mV(\'Isa\',28,22);">28:22</a>; <a onClick="return mV(\'Dan\',9,27);">Da 9:27</a>) is translated interchangeably in the King James Version for another Hebrew word referring to a physical disease, and best translated "consumption"; compare <a onClick="return mV(\'Lev\',26,16);">Le 26:16</a>; <a onClick="return mV(\'Deu\',28,22);">De 28:22</a>. Not used in the Revised Version (British and American). The Hebrew variously but more accurately translated "full end"; compare <a onClick="return mV(\'Dan\',9,27);">Da 9:27</a>; <a onClick="return mV(\'Isa\',10,23);">Isa 10:23</a>; and "destruction"; compare <a onClick="return mV(\'Isa\',10,22);">Isa 10:22</a>; <a onClick="return mV(\'Isa\',28,22);">28:22</a>. There seems therefore to be an inconsistency on the part of both the Authorized and Revised translations.``25';
isbe[2289]='Consumption`kon-sump\'-shun (shachepheth, "wasting away"): One of the punishments which was to follow neglect or breach of the law. It may mean pulmonary consumption, which occurs frequently in Palestine; but from its association with fever in the texts, <a onClick="return mV(\'Lev\',26,16);">Le 26:16</a>; <a onClick="return mV(\'Deu\',28,22);">De 28:22</a>, it is more likely to be the much more common condition of wasting and emaciation from prolonged or often recurring attacks of malarial fever.``1';
isbe[2290]='Contain`kon-tan\'.`<a href="./study/isbe/search.html?string=CONTINENCY">CONTINENCY</a>`1';
isbe[2291]='Contend; Contention`kon-tend\', kon-ten\'-shun: The meeting of effort by effort, striving against opposition; sometimes physically, as in battle (<a onClick="return mV(\'Deu\',2,9);">De 2:9</a>), or with horses (<a onClick="return mV(\'Jer\',12,5);">Jer 12:5</a>), sometimes orally (<a onClick="return mV(\'Neh\',13,11);">Ne 13:11</a>), sometimes spiritually (<a onClick="return mV(\'Isa\',57,16);">Isa 57:16</a>). In the New Testament diakrinein, for the hostile separation of one from another, dispute (<a onClick="return mV(\'Jud\',1,9);">Jude 1:9</a>), or epagonizomai (<a onClick="return mV(\'Jud\',1,3);">Jude 1:3</a>), descriptive of the strain to which a contestant is put. The noun is almost universally used with an unfavorable meaning, and as worthy of condemnation, for an altercation arising from a quarrelsome disposition. "By pride cometh only contention" (<a onClick="return mV(\'Pro\',13,10);">Pr 13:10</a>). The contentions at Corinth (<a onClick="return mV(\'1Cr\',1,11);">1Co 1:11</a>) called forth the rebukes of Paul. Where used in the King James Version in a good sense (<a onClick="return mV(\'1Th\',2,2);">1Th 2:2</a>) the Revised Version (British and American) has "conflict." In <a onClick="return mV(\'Act\',15,39);">Ac 15:39</a>, the noun has a peculiar force, where English Versions of the Bible translates paroxusmos (whence English "paroxysm") by "sharp contention." The Greek word refers rather to the inner excitement and irritation than to its outward expression.``84';
isbe[2292]='Content; Contentment`kon-tent\', kon-tent\'-ment (ya\'al; arkeo): To be free from care because of satisfaction with what is already one\'s own. The Hebrew means simply "to be pleased." The Greek brings out the full force of the word in <a onClick="return mV(\'1Ti\',6,8);">1Ti 6:8</a>; <a onClick="return mV(\'Hbr\',13,5);">Heb 13:5</a>. Contentment (<a onClick="return mV(\'1Ti\',6,6);">1Ti 6:6</a>) is more inward than satisfaction; the former is a habit or permanent state of mind, the latter has to do with some particular occurrence or object.``1';
isbe[2293]='Continency`kon\'-ti-nen-si (egkrateuomai "to have self-control" or "continency" the Revised Version (British and American), "to contain" the King James Version): Paul, although he would that all men were like himself unmarried, yet advises that they should marry if they cannot control their sexual passions, and hold them in complete subjection to Christian motives (<a onClick="return mV(\'1Cr\',7,9);">1Co 7:9</a>). The same Greek verb is used in <a onClick="return mV(\'1Cr\',9,25);">1Co 9:25</a>, and translated "is temperate" (the King James Version and the English Revised Version) of the athlete who during the period of training abstains from all indulgence in food, \'drink, and sexual passion. For the general principle as expressed in substantive egkrateia (<a onClick="return mV(\'Act\',24,25);">Ac 24:25</a>; <a onClick="return mV(\'Gal\',5,23);">Ga 5:23</a>; <a onClick="return mV(\'2Pe\',1,6);">2Pe 1:6</a>) and adjective egkrates (<a onClick="return mV(\'Tts\',1,8);">Tit 1:8</a>)`<a href="./study/isbe/search.html?string=TEMPERANCE,+TEMPERATE">TEMPERANCE, TEMPERATE</a>`145';
isbe[2294]='Continual; Continually`kon-tin\'-u-al, kon-tin\'-u-a-li: Without cessation, although there may be intervals between its presence; that which regularly recurs throughout a period, as has <a onClick="return mV(\'Luk\',24,53);">Lu 24:53</a>: "(They) were continually in the temple"; "lest...by her continual coming" (<a onClick="return mV(\'Luk\',18,5);">Lu 18:5</a>). In Old Testament for Hebrew tadhir, "pursue," as one drop of rain follows another in swift succession, but more frequently by tamidh for offerings repeated at intervals, as <a onClick="return mV(\'Exd\',29,42);">Ex 29:42</a>; occasionally the Hebrew the phrase literally meaning "all the day" (kol ha-yom), as <a onClick="return mV(\'Gen\',6,5);">Ge 6:5</a>. In the New Testament most frequently for dia pantos, "through all" ("always" <a onClick="return mV(\'Mat\',18,10);">Mt 18:10</a>; <a onClick="return mV(\'Hbr\',13,15);">Heb 13:15</a>), "sometimes," adialeiptos, "incessantly" (<a onClick="return mV(\'Rom\',9,2);">Ro 9:2</a> the King James Version) and dienekes, "continuously" (<a onClick="return mV(\'Hbr\',7,3);">Heb 7:3</a>).``84';
isbe[2295]='Continuance`kon-tin\'-u-ans: Not in the Revised Version (British and American); in <a onClick="return mV(\'Psa\',139,16);">Ps 139:16</a> the King James Version, as an interpretation of Hebrew yamim, "days," treating of God\'s prevision, where the Revised Version (British and American) has: "They were all written, even the days that were ordained for me," i.e. all my days were in view, before one of them actually existed. In <a onClick="return mV(\'Isa\',64,5);">Isa 64:5</a> the King James Version, for \'olam, "of long time," the Revised Version (British and American); in <a onClick="return mV(\'Rom\',2,7);">Ro 2:7</a>, for hupomone, "patience," the Revised Version (British and American), or still better, "steadlfastness," the Revised Version, margin.``1';
isbe[2296]='Contradiction`kon-tra-dik\'-shun: the King James Version for antilogia (<a onClick="return mV(\'Hbr\',7,7);">Heb 7:7</a>; <a onClick="return mV(\'Hbr\',12,3);">12:3</a>). In the former passage, the Revised Version (British and American) has "without any dispute," i.e. what has been said requires no argument; in the latter "gainsaying" which is scarcely an improvement, the reference being to the oral attacks upon the words and character of Jesus.``1';
isbe[2297]='Contrary`kon\'-tra-ri (qeri; enantios): In the Old Testament it has the sense of antagonistic, as one person opposed or hostile to the other, especially in <a onClick="return mV(\'Lev\',26,21,23,24,27,28,40,41);">Le 26:21, 23-24, 27-28, 40-41</a>, where Yahweh declares His attitude toward the people in such phrases as: "If ye will not for all this hearken unto me, but walk contrary unto me; then I will walk contrary unto you in wrath."<P>In the New Testament it has a more varied significance and is applied to both material and human relations as simply opposite, set over against an object or thing. Used of the wind as in <a onClick="return mV(\'Mat\',14,24);">Mt 14:24</a>; <a onClick="return mV(\'Mar\',6,48);">Mr 6:48</a>; <a onClick="return mV(\'Act\',27,4);">Ac 27:4</a>, where it is spoken of as contrary. Refers also to conflicting doctrines, customs or beliefs, as <a onClick="return mV(\'1Ti\',1,10);">1Ti 1:10</a>, "and if there be any other thing contrary to the sound doctrine." Several other Greek words are translated with almost an identical meaning. Occasionally a prefix gives a slightly different shade of meaning.``25';
isbe[2298]='Contribution`kon-tri-bu\'-shun (koinonia, "communion" or "fellowship," <a onClick="return mV(\'Rom\',15,26);">Ro 15:26</a>; <a onClick="return mV(\'2Cr\',9,13);">2Co 9:13</a>): The meaning "contribution" is drawn from the context, rather than from the Greek word. The phrase in the passage cited, literally rendered, would be "to exercise" or "put fellowship into activity." The koinonia subsisting among believers because of their inner communion with Christ places them and their gifts and possessions at the service of one another (see <a href="./study/isbe/search.html?string=COMMUNION">COMMUNION</a>). They are enjoined. not to forget to communicate (<a onClick="return mV(\'Hbr\',13,16);">Heb 13:16</a>). To be "communicative" (koinonikoi) is to be a habit of their lives, the Christian principle being that of the holding of all property as a trust, to be distributed as there is need (<a onClick="return mV(\'Act\',2,44);">Ac 2:44</a>f; <a onClick="return mV(\'2Cr\',8,14);">2Co 8:14</a>f). The first occasion for calling this fellowship into activity, by way of "contributions," was within the church at Jerusalem and for its needy members (see <a href="./study/isbe/search.html?string=COMMUNITY+OF+GOODS">COMMUNITY OF GOODS</a>). The second occasion was repeatedly from the infant Gentile churches for the poor within the same church (<a onClick="return mV(\'Act\',11,29);">Ac 11:29</a>; <a onClick="return mV(\'Rom\',15,26);">Ro 15:26</a>; <a onClick="return mV(\'2Cr\',8,\'1-4\');">2Co 8:1-4</a>; <a onClick="return mV(\'2Cr\',9,2);">9:2</a>); the fellowship thus widening from intra-congregational to general church benevolence. These contributions were gathered weekly (<a onClick="return mV(\'1Cr\',16,2);">1Co 16:2</a>f), were proportioned to the means of the givers (<a onClick="return mV(\'Act\',11,29);">Ac 11:29</a>; <a onClick="return mV(\'1Cr\',16,2);">1Co 16:2</a>), were not exacted or prescribed, in a legalistic manner, but were called forth as the free-will offerings of grateful hearts (<a onClick="return mV(\'2Cr\',8,7);">2Co 8:7</a>), springing from th community spirit, and were sent to their destination by accredited representatives of the congregations (<a onClick="return mV(\'1Cr\',16,3);">1Co 16:3</a>; <a onClick="return mV(\'Act\',11,30);">Ac 11:30</a>).``84';
isbe[2299]='Contrite; Contrition`kon\'-trit, kontrish\'-un (dakka\', "bruise"): Only in Old Testament (<a onClick="return mV(\'Psa\',34,18);">Ps 34:18</a>; <a onClick="return mV(\'Psa\',51,17);">Ps 51:17</a>; <a onClick="return mV(\'Isa\',57,15);">Isa 57:15</a>); nakheh, "smitten" (<a onClick="return mV(\'Isa\',66,2);">Isa 66:2</a>). Contrite, "crushed," is only the superlative of "broken"; "a contrite heart" is "a heart broken to pieces." In Holy Scripture, the heart is the seat of all feeling, whether joy or sorrow. A contrite heart is one in which the natural pride and self-sufficiency have been completely humbled by the consciousness of guilt. The theological term "contrition" designates more than is found in these passages. It refers to the grief experienced as a consequence of the revelation of sin made by the preaching of the law (<a onClick="return mV(\'Jer\',23,29);">Jer 23:29</a>). The Augsburg Confession (Article XII) analyzes repentance into two parts: "Contrition and faith," the one the fruit of the preaching of the law, the other of the gospel. While contrition has its degrees, and is not equal in all persons, the promise of forgiveness is not dependent upon the degree of contrition, but solely upon the merit of Christ. It is not simply a precondition of faith, but, as hatred of sin, combined with the purpose, by God\'s aid, to overcome it, grows with faith.``84';
isbe[2300]='Controversy`kon\'-tro-ver-si (ribh, "strife," "contention"; homologoumenos, "confessedly," "without controversy"): Used frequently of disputes among men (as <a onClick="return mV(\'Deu\',17,8);">De 17:8</a>) and then transferred to the justice of God as directed against the sins of men. Thus we read of Yahweh\'s controversy with the nations (<a onClick="return mV(\'Jer\',25,31);">Jer 25:31</a>); with the inhabitants of the land (<a onClick="return mV(\'Hsa\',4,1);">Ho 4:1</a>); with His people (<a onClick="return mV(\'Mic\',6,2);">Mic 6:2</a>). "Without controversy" (<a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>), a positive rather than a negative expression, "by common consent," or better, "as unanimously confessed," introducing a quotation from a hymn or rhythmical confession of the early church.``84';
