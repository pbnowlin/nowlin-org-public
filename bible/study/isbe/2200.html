isbe[2231]='Comparative Religion`kom-par\'-a-tiv:<p><b>I. THE SUBJECT IN GENERAL</b><P class="in15">1. Universality of Religion<P class="in15">2. Theories of Its Origin and Growth of Religion<P class="in15">3. Evolution<p><b>II. RELATION OF CHRISTIANITY TO ETHNIC FAITHS AND THEIR TENETS</b><P class="in15">1. Karma<P class="in15">2. God<P class="in15">3. The Summum Bonum<P class="in15">4. Self-Revelation of God<P class="in15">5. Incarnation<P class="in15">6. Salvation<P class="in15">7. Faith<P class="in15">8. Approach to God<p><b>III. GENERAL CHARACTERISTICS OF ETHNIC FAITHS</b><P class="in15">1. Tenets Common to All Religions<P class="in15">2. Tendency to Degradation, not to Progress, in Ethnic Faiths<P class="in15">3. Mythology and Religion<P class="in15">4. Religion And Morality in Ethnic Faiths<p><b>IV. SUPPOSED RESEMBLANCES TO REVEALED RELIGION</b><P class="in15">1. Rites<P class="in15">2. Dogmas<P class="in15">3. Asserted Parallels to Gospel History<P class="in15">4. Virgin Birth<P class="in15">5. Heathen Aspirations and Unconscious Prophecies<P class="in15">6. Lessons Taught by Comparative Religion<P><b>LITERATURE</b><hr /><p>I. The Subject in General.<P>The science of comparative religion is perhaps the latest born of all sciences. Largely in consequence of this fact, our knowledge of what it really proves is still far from definite, and men draw most contradictory conclusions on this point. As in the case of all new sciences in the past, not a few people have endeavored under its shelter to attack Christianity and all revealed religion. These assaults already give signs of failure—as in similar cases previously—and a new evidence of Christianity is emerging from the conflict. It is only "a little learning" that is proverbially dangerous. The subject with which the science of comparative religion deals is religion in general and all the facts which can be learnt about all religions ancient and modern, whether professed by savages or prevalent among highly civilized communities, whether to be studied in sacred books or learnt orally from the people.<P>1. Universality of Religion:<P>In this way we learn first of all that religion is a universal phenomenon, found among all nations, in all conditions, though differing immensely in its teachings, ceremonies and effects in different places. It is perhaps the most powerful for good or evil of all the instincts (for it is an instinct) which influence mankind.<P>2. Theories of Origin and Growth of Religion:<P>To account for the origin and growth of religion various theories have been propounded:<P>(1) "Humanism," which is the revival of the ancient view of Euhemeros (circa 400 BC) that all religion arose from fear of ghosts, and all the gods were but men who had died;<P>(2) "Animism," which traces religion to early man\'s fancy that every object in Nature had a personality like his own;<P>(3) the Astral Theory, which supposes that religion originated from worship of the heavenly bodies.<P>It is clear that there are facts to support each of these hypotheses, yet no one of them satisfies all the conditions of the case. To (1) it has been replied that most tribes from the earliest times clearly distinguished between those deities who had been men, and the gods proper, who had never been men and had never died. Regarding (2), it should be observed that it admits that man\'s consciousness of his own personality and his fancy that it exists in other creatures also does not account for his worshipping them, unless we grant the existence of the sensus numinis within him: if so, then this explains, justifies, and necessitates religion. (3) The Astral Theory is in direct opposition to Euhemerism or Humanism. It ascribes personality to the heavenly bodies in man\'s early fancy; but it, too, has to presuppose the sensus numinis, without which religion would be impossible, as would be the science of optics if man had not the sense of sight.<P>3. Evolution:<P>It is often held that religion is due to evolution. If so, then its evolution, resulting ex hypothesi in Christianity as its acme, must be the working out of a Divine "Eternal Purpose" (prothesis ton aionon, <a onClick="return mV(\'Eph\',3,11);">Eph 3:11</a>), just as has been the evolution of an amoeba into a man on the Evolutionary Theory. This would be an additional proof of the truth of Christianity. But, though doubtless there has been evolution—or gradual progress under Divine guidance—in religion, the fact of Christ is sufficient to show that there is a Divine self-revelation too. Hence, the claim of Christianity to be the absolute religion. "The pre-Christian religions were the age-long prayer, the Incarnation was the answer" (Illingworth). Christianity as revealed in Christ adds what none of the ethnic faiths could prove their claim to—authority, holiness, revelation.<p>II. Relation of Christianity to Ethnic Faiths and Their Tenets.<P>It is very remarkable that Christianity—though clearly not a philosophy but a religion that has arisen under historical circumstances which preclude the possibility of supposing it the product of Eclecticism—yet sums up in itself all that is good in all religions and philosophies, without the bad, the fearful perversions and corruptions of the moral sense, too often found in them. The more the study of comparative religion is carried on the more plainly evident does this become. It also supplements in a wonderful way the half-truths concealed rather than revealed in other systems, whether religious or philosophical. We subjoin a few instances of this.<P>1. Karma:<P>Karma is strongly insisted on in Hinduism and Buddhism. These teach that every deed, good or bad, must have its result, that "its fruit must be eaten" here or hereafter. So does Christianity quite as forcibly (<a onClick="return mV(\'Gal\',6,7,8);">Ga 6:7-8</a>). But neither Indian faith explains how sin can be forgiven, evil be overruled for good, nor how, by trampling under foot their vices, men may rise higher (Aug., Sermo iii, De Ascensione). They recognize, in some sense, the existence of evil, and illogically teach that rites and certain ascetic practices help to overcome it. They know of no Atonement, though modern Hinduism endeavors to propitiate the deities by sacrifices, as indeed was done in Vedic times. Conscience they cannot explain. Christianity, while showing the heinousness of sin as no other system does, and so supplementing the others, supplements them still further by the Atonement, showing that God is just, and teaching how His very righteousness can be brought to "justify" the sinner (<a onClick="return mV(\'Rom\',3,26);">Ro 3:26</a>).<P>2. God:<P>Mahayana Buddhism proclaims an immanent but not transcendent being (Dharma-kaya), who is "the ultimate reality that underlies all particular phenomena" (Suzuki), who wills and reflects, though not fully personal. He is not the Creator of the world but a kind of Animus mundi. He is the sum total of all sentient beings, and they have no individual existence, no "ego-soul." The world of matter has no real existence but is his self-manifestation. Christianity supplements and corrects this by teaching the transcendence as well as the immanence (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>) of the Creator, who is at least personal, if not something higher, who is the Source of reality though not Himself the sole reality, and of our personality and life, and "who only hath immortality" (<a onClick="return mV(\'1Ti\',6,16);">1Ti 6:16</a>).<P>3. The "Summum Bonum":<P>Vedantism and Cuffiism proclaim that ultimate absorption in the impersonal "It" is the summum bonum, and the Chandogya Upanishad says, "There is just one thing, without a second" (Book VI, 2 1, 2). Of this one thing everything is, so to speak, a part: there being no ultimate difference between the human and the Divine. Thus sin is denied and unreality proclaimed (Maya, illusion). The yearning for union with God underlying all this is satisfied in Christianity, which provides reconciliation with God and shows how by new spiritual birth men may become children of God (<a onClick="return mV(\'Jhn\',1,12,13);">Joh 1:12-13</a>) and "partakers of the divine nature" (<a onClick="return mV(\'2Pe\',1,4);">2Pe 1:4</a>), without being swallowed up therein like a raindrop in the ocean: the union being spiritual and not material.<P>4. Self-Revelation of God:<P>Orthodox (Sunni) Muslim theology declares God to be separated from man by an impassable gulf and hence, to be unknowable. Philosophically this leads to Agnosticism, though opposed to Polytheism. Among the Jews the philosophy of Maimonides ends in the same failure to attain to a knowledge of the Divine or to describe God except by negations (Cepher Ha-madda\', 1 11). The Bible, on the other hand, while speaking of Him as invisible, and unknowable through merely human effort (<a onClick="return mV(\'Job\',11,7,8);">Job 11:7-8</a>; <a onClick="return mV(\'Jhn\',1,18);">Joh 1:18</a>), yet reveals Him in Christ, who is God and man. Jewish mysticism endeavored to solve the problem of creation by the invention of the \'Adham qadhmon (archetypal man), and earlier by Philo\'s Logos doctrine and the Memra\' of the Targums. But these abstractions have neither reality nor personality. The Christian Logos doctrine presents no theoretical but the actual historical, eternal Christ (compare <a onClick="return mV(\'Jhn\',1,\'1-3\');">Joh 1:1-3</a>; <a onClick="return mV(\'Hbr\',1,2);">Heb 1:2</a>).<P>5. Incarnation:<P>Heathenism seeks to give some idea of the Invisible by means of idols; Vaishnavism has its doctrine of avataras; Babiism and Bahaiism their dogma of "manifestations" (mazhar) in human beings; the \'Ali-ilahis are so called because they regard \'Ali as God. Instead of these unworthy theories and deifications, Christianity supplies the holy, sinless, perfect Incarnation in Christ.<P>6. Salvation:<P>Hinduism offers mukti (moksha), "deliverance" from a miserable existence; Christianity in Christ offers pardon, deliverance from sin, and reconciliation with God.<P>7. Faith:<P>Krishnaism teaches unreasoning "devotion" (bhakti) of "mind, body, property" to certain supposed incarnations of Krishna (Vishnu), quite regardless of their immoral conduct; Christianity inculcates a manly, reasonable "faith" in Christ, but only after "proving all things."<P>8. Approach to God:<P>Pilgrimages in Islam and Hinduism indicate but do not satisfy a need for approach to God; Christianity teaches a growth in grace. and in likeness to Christ, and so a spiritual drawing near to God.<p>III. General Characteristics of Ethnic Faiths.<P>1. Tenets Common to All Religions:<P>In all religions we find, though in many various forms, certain common beliefs, such as:<P>(1) the existence of some spiritual power or powers, good or bad, superior to man and able to affect his present and future life;<P>(2) that there is a difference between right and wrong, even though not clearly defined;<P>(3) that there is an afterlife of some sort, with happiness or misery often regarded as in some measure dependent upon conduct or upon the observance of certain rites here.<P>In the main the fact of the all but universal agreement of religions upon these points proves that they are true in substance. Even such an agnostic philosophy as original Buddhism was, has been constrained by human need to evolve from itself or admit from without deistic or theistic elements, and thus Buddha himself has been deified by the Mahayana School. Yet no ethnic faith satisfies the "human soul naturally Christian," as Tertullian calls it (Liber Apologeticus, cap. 17), for none of them reveals One God, personal, holy, loving, just, merciful, omniscient and omnipotent. Even Islam fails here. Ethnic religions are either<P>(1) polytheistic, worshipping many gods, all imperfect and some evil, or<P>(2) mystical, evaporating away, as it were, God\'s Personality, thus rendering Him a mental abstraction, as in the Hindu philosophical systems and in Mahayana Buddhism. Christianity as revealed in Christ does just what all other faiths fail to do, reconciling these two tendencies and correcting both.<P>2. Tendency to Degradation, not to Progress, in Ethnic Faiths:<P>As a general rule, the nearer to their source we can trace religions, the purer we find them. In most cases a degradation and not to progressive improvement manifests itself as time goes on, and this is sometimes carried to such an extent that, as Lucretius found in Rome and Greece, religion becomes a curse and not a blessing. Thus, for example, regarding ancient Egypt, Professor Renouf says: "The sublimer portions of the Egyptian religion are not the comparatively late result of a process of development. The sublimer portions are demonstrably ancient, and the last stage of the Egyptian religion was by far the grossest and most corrupt" (Hibbert Lectures, 91). Modern Hinduism, again, is incomparably lower in its religious conceptions than the religion of the Vedas. In Polynesia the same rule holds good, as is evident from the myths about Tangaroa. In Samoa he was said to be the son of two beings, the "Cloudless Heaven" and the "Outspread Heaven." He originally existed in open space. He made the sky to dwell in. He then made the earth. Somewhat later he was supposed to be visible in the moon! But a lower depth was reached. In Hawaii, Tangaroa has sunk to an evil being, the leader of a rebellion against another god, Tane, and is now condemned to abide in the lowest depths of darkness and be the god of death. In South Africa, Australia and elsewhere, traditions still linger of a Creator of all things, but his worship has been entirely laid aside in favor of lower and more evil deities.<P>3. Mythology and Religion:<P>Almost everywhere mythology has arisen and perverted religion into something very different from what it once was. The same tendency has more than once manitested itself in the Christian church, thus rendering a return to Christ\'s teachings necessary. As an instance, compare the modern popular religion of Italy with that of the New Testament. It is remarkable that no religion but the Christian, however, has shown its capability of reform.<P>4. Religion and Morality in Ethnic Faiths:<P>For the most part, in ethnic religions, there is no recognized connection between religion and morality. The wide extension of phallic rites and the existence of hierodoulai and hierodouloi in many lands show that religion has often consecrated gross immorality. Mythology aids in this degradation. Hence, Seneca, after mentioning many evil myths related of Jupiter, etc., says: "By which nothing else was effected but the removal from men of their shame at sinning, if they deemed such beings goals" (L. A. Seneca, De beata vita cap. 26). With the possibly doubtful exception of the religion of certain savage tribes, in no religion is the holiness of God taught except in Christianity and its initial stage, Judaism. Ethnic deities are mostly born of heaven and earth, if not identified with them in part, and are rarely regarded as creating them. It was otherwise, however, with Ahura Mazda in Zoroastrianism, and with certain Sumerian deities, and there are other exceptions, too. The "religions of Nature" have generally produced gross immorality, encouraged and even insisted upon as a part of their ritual; compare Mylitta-worship in Babylon and that of the "Mater deum," Venus, Anahita, etc.<p>IV. Supposed Resemblances to Revealed Religion.<P>1. Rites:<P>Much attention has been called to real or supposed community of rites and "myths," especially when any ethnic faith is compared with Christianity. Sacrifice, for instance, is an essential part of every religion. In Christianity none are now offered, except the "living sacrifice" of the believer, though that of Christ offered once for all is held to be the substance foreshadowed by Jewish sacrifices. Purificatory bathings are found almost everywhere, and that very naturally, because of the universality of conscience and of some sense of sin.<P>2. Dogmas:<P>Belief in the fiery end of the world existed among the Stoics, and is found in the Eddas of Scandinavia and the Puranas of India. Traditions of an age before sin and death came upon mankind occur in many different lands. Many of these traditions may easily be accounted for. But in some cases the supposed resemblance to revealed religion does not exist, or is vastly exaggerated. The Yoga philosophy in India is popularly supposed to aim at union with God, as does Christianity; but (so understood) the Yoga system, as has already been said, implies loss of personality and absorption into the impersonal, unconscious "It" (Tat). The doctrine of a Trinity is nowhere found, only Triads of separate deities. Belief in a resurrection is found in only very late parts of the Persian (Zoroastrian) scriptures, composed after centuries of communication with Jews and Christians. In the earlier Avesta only a "restoration" of the world is mentioned (compare <a onClick="return mV(\'Act\',3,21);">Ac 3:21</a>). Original (Hinayana) Buddhism teaches "immortality" (amata), but by this is meant Nirvana ("extinction"). Mithraism has been said to teach the "resurrection of the body," but, according to Eubulus and Porphyry, it taught rather the transmigration of the soul.<P>3. Asserted Parallels to Gospel History:<P>The assertion is often made that many of the leading gospel incidents in the life of our Lord are paralleled in other religions. It is said, for instance, that the resurrection of Adonis, Osiris and Mithra was believed in by their followers. It is true that, in some places, Adonis was said to have come to life the day after he had met his death by the tusk of a boar (the cold of winter); but everywhere it was recognized that he was not a man who had been killed, but the representative of the produce of the soil, slain or dying down in the cold weather and growing again in spring. As to Osiris, his tomb was shown in more than one place in Egypt, and his body was never supposed to have come to life again, though his spirit was alive and was ruler of the underworld. Mithra was admitted to be the genius of the sun. He was said to have sprung from a rock (in old Persian and Sanskrit the same word means "sky," "cloud" and "rock"), but not to have been incarnated, nor to have died, much less to have risen from the dead. The modern erroneous fancy that Mithraists believed in his resurrection rests solely on one or at most two passages in Christian writers, which really refer to the burial of Osiris and the removal of his body from the tomb by his hostile brother Typhon (Set). The high morality attributed to Mithraism and even to the worship of Isis rests on no better foundation than the wrong rendering of a few passages and the deliberate ignoring of many which contradict theory.<P>4. Virgin Birth:<P>Virgin birth, we have been told, is a doctrine of many religions. As a matter of fact, it is found in hardly one ethnic faith. Nothing of the kind was believed regarding Osiris, Adonis, Horus, Mithra, Krishna, Zoroaster. Of Buddha it is denied entirely in all the books of the Southern Canon (Pali), and is found expressed only vaguely in one or two late uncanonical works of the Northern (Sanskrit) School. It was doubtless borrowed from Christianity. Supernatural birth of quite a different (and very repulsive) kind is found in many mythologies, but that is quite another thing.<P>5. Heathen Aspirations and Unconscious Prophecies:<P>Heathenism contains some vague aspirations and unconscious prophecies, the best example of which is to be found in Vergil\'s Fourth Eclogue, if that be not rather due to Jewish influence. Any such foregleams of the coming light as are real and not merely imaginary, such, for instance, as the Indian doctrine of the avataras or "descents" of Vishnu, are to be accounted for as part of the Divine education of the human race. The "false dawn," so well known in the East, is not a proof that the sun is not about to rise, nor can its existence justify anyone in shutting his eyes to and rejecting the daylight when it comes. It is but a harbinger of the real dawn.<P>6. Lessons Taught by Comparative Religion:<P>Comparative religion teaches us that religion is essential to and distinctive of humanity. The failures of the ethnic faiths no less than their aspirations show how great is man\'s need of Christ, and how utterly unable imagination has ever proved itself to be even to conceive of such an ideal character as He revealed to us in the full light of history and in the wonder-working effects of His character upon the lives and hearts of those who then and in all ages since have in Him received life and light.<P>LITERATURE.<P>Tylor, Anthropology; Jordan, Comparative Religion, Its Genesis and Growth; Falke, Zum Kampfe der drei Weltreligionen; Gould, Origin and Development of Religious Belief; Jevons, Introduction to the History of Religion; Reville, Prolegomena to the History of Religions; Max Muller, Introduction to the Science of Religion; Hardwick, Christ and Other Masters; Kellogg, The Light of Asia and the Light of the World; Farrar, The Witness of History to Christ; A. Lung, Magic and Religion; The Making of Religion; Johnson, Oriental Religions and Their Relation to Universal Religion; Farnell, The Evolution of Religion; Howitt, The Native Tribes of Southeast Australia; Smith, Religion of the Semites; Reinach, Cultes, mythes et religions; Dilger, Erloschen des Menschen nach Hinduismus und Christentum; Rhys Davids, Origin and Growth of Religion; Kuenen, National Religions and Universal Religion (Hibbert Lectures, 1882); Dollinger, The Gentile and the Jew in the Courts of the Temple of Christ (1862); Dodson, Evolution and Its Bearing on Religion; MacCulloch, Comparative Theology; Baumann, Uber Religionen und Religion; Waitz, Anthropologie der Naturvolker; Hastings, Encyclopedia of Religion and Ethics; Frazer, Adonis, Attis, Osiris; Dufourcq, Hist. comparee des rel. paiennes et de la religion juive; Oesterley, Evolution of Religious Ideas; Martindale, Bearing of Comp. Study of Religions on Claims of Christianity; W. Clair Tisdall, Comparative Religion.``175';
isbe[2232]='Compare`kom-par\' (damah, mashal, [\'arakh]; paraballo, sugkrino): "Compare" is the translation of damah, "to be like" (<a onClick="return mV(\'Sgs\',1,9);">So 1:9</a>); of mashal, "to liken," "compare" (<a onClick="return mV(\'Isa\',46,5);">Isa 46:5</a>); of \'arakh, "to set in array," "compare" (<a onClick="return mV(\'Psa\',89,6);">Ps 89:6</a>; <a onClick="return mV(\'Isa\',40,18);">Isa 40:18</a>); of shawah, "to be equal" (<a onClick="return mV(\'Pro\',3,15);">Pr 3:15</a>; <a onClick="return mV(\'Pro\',8,11);">8:11</a>).<P>In the New Testament sugkrino, "to judge" or "sift together," is translated "comparing," "comparing spiritual things with spiritual" (<a onClick="return mV(\'1Cr\',2,13);">1Co 2:13</a> the English Revised Version), the American Standard Revised Version "combining" ("adapting the discourse to the subject," Thayer), the Revised Version, margin "interpreting spiritual things to spiritual (men)."``185';
isbe[2233]='Compass; Compasses`kum\'-pas, kum\'-pas-iz: "Compass," noun, is the translation of chugh, "a circle," "vault" or "arch" ("when he set a compass upon the face of the depth" <a onClick="return mV(\'Pro\',8,27);">Pr 8:27</a> the King James Version, the Revised Version (British and American), the American Standard Revised Version "circle"; compare <a onClick="return mV(\'Job\',26,10);">Job 26:10</a>; and see <a href="./study/isbe/search.html?string=CIRCLE">CIRCLE</a>; <a href="./study/isbe/search.html?string=VAULT+OF+EARTH">VAULT OF EARTH</a>); of karkobh, "a margin" "border" (<a onClick="return mV(\'Exd\',27,5);">Ex 27:5</a>, "the compass of the altar," the Revised Version (British and American) "the ledge round," so <a onClick="return mV(\'Exd\',38,4);">38:4</a>); the phrase "to fetch a compass" is the translation of sabhabh, "to turn about," "go round about" (<a onClick="return mV(\'Num\',34,5);">Nu 34:5</a>; <a onClick="return mV(\'Jos\',15,3);">Jos 15:3</a>, the Revised Version (British and American) "turn about," <a onClick="return mV(\'2Sa\',5,23);">2Sa 5:23</a>; <a onClick="return mV(\'2Ki\',3,9);">2Ki 3:9</a>, the Revised Version (British and American) "make a circuit"); of perierchomai, "to go about" (<a onClick="return mV(\'Act\',28,13);">Ac 28:13</a>, the Revised Version (British and American) "made a circuit"; margin "Some ancient authorities read cast loose"; see <a href="./study/isbe/search.html?string=CIRCUIT">CIRCUIT</a>).<P>"Compasses" is the Revised Version (British and American) for "compass," mechughah, an instrument for describing a circle: "He marketh it out with the compasses" (<a onClick="return mV(\'Isa\',44,13);">Isa 44:13</a>) in making an idol.<P>The verb "to compass" occurs frequently in the senses of "to surround" and "to go round about," e.g. <a onClick="return mV(\'Gen\',2,11);">Ge 2:11</a>, "which compasseth the whole land of Havilah," <a onClick="return mV(\'Deu\',2,1);">De 2:1</a>, "We compassed (went around) mount Seir many days"; in <a onClick="return mV(\'Jer\',31,22);">Jer 31:22</a> we have "A new thing on the earth: a woman shall compass a man," the Revised Version (British and American) "encompass"; possibly as a suitor; but more probably as a protector. In those happy days, the protection of women (under God, <a onClick="return mV(\'Jer\',31,28);">31:28</a>) will be sufficient, while the men are at their work; "to encompass" ("The cords of death compassed me" <a onClick="return mV(\'Psa\',18,4);">Ps 18:4</a>; "the waves of death," <a onClick="return mV(\'2Sa\',22,5);">2Sa 22:5</a>). "To gird" (<a onClick="return mV(\'Isa\',50,11);">Isa 50:11</a> the Revised Version (British and American)); "to lie around," "to be laid around" (<a onClick="return mV(\'Hbr\',5,2);">Heb 5:2</a>, "compassed with infirmity" (clothed with it); <a onClick="return mV(\'Hbr\',12,1);">Heb 12:1</a>, "compassed about with so great a cloud of witnesses").<P>In Apocrypha we have "compassed about with yawning darkness" (The <span class="noTag">Wisdom of Solomon 19:17</span>); "compassed the circuit of heaven" (Ecclesiasticus 24:5); "compassed with pomegranates of gold" (Ecclesiasticus 45:9); "The rainbow compasseth the heaven" (Ecclesiasticus 43:12); the course of the sun (1Esdras 4:34).``185';
isbe[2234]='Compassion`kom-pash\'-un: Compassion is the translation of racham, "to love," "pity," "be merciful" (<a onClick="return mV(\'Deu\',13,17);">De 13:17</a>; <a onClick="return mV(\'Deu\',30,3);">30:3</a>); of rachamim, "mercies" (<a onClick="return mV(\'1Ki\',8,50);">1Ki 8:50</a>); of chamal, "to pity," "spare" (<a onClick="return mV(\'Exd\',2,6);">Ex 2:6</a>; <a onClick="return mV(\'1Sa\',23,21);">1Sa 23:21</a>); rachum (<a onClick="return mV(\'Psa\',78,38);">Ps 78:38</a>; <a onClick="return mV(\'Psa\',86,15);">86:15</a>; <a onClick="return mV(\'Psa\',111,4);">111:4</a>; <a onClick="return mV(\'Psa\',112,4);">112:4</a>; <a onClick="return mV(\'Psa\',145,8);">145:8</a>), is rendered by the American Standard Revised Version "merciful." We have splagchnizomai, "to have the bowels yearning," in <a onClick="return mV(\'Mat\',9,36);">Mt 9:36</a>; <a onClick="return mV(\'Mat\',14,14);">14:14</a>, etc.; sumpatheo (<a onClick="return mV(\'Hbr\',10,34);">Heb 10:34</a>), "to suffer with (another)"; sumpathes (<a onClick="return mV(\'1Pe\',3,8);">1Pe 3:8</a>, the Revised Version (British and American) "compassionate," margin, Greek, "sympathetic"); metriopatheo (<a onClick="return mV(\'Hbr\',5,2);">Heb 5:2</a>, the Revised Version (British and American) "who can bear gently with"); eleeo, "to show mildness," "kindness" (<a onClick="return mV(\'Mat\',18,33);">Mt 18:33</a>; <a onClick="return mV(\'Mar\',5,19);">Mr 5:19</a>; <a onClick="return mV(\'Jud\',1,22);">Jude 1:22</a>, the Revised Version (British and American) "mercy"); oikteiro, "to have pity" or "mercy" (<a onClick="return mV(\'Rom\',9,15);">Ro 9:15</a> bis).<P>Both racham and splagchnizomai are examples of the physical origin of spiritual terms, the bowels being regarded as the seat of the warm, tender emotions or feelings. But, while racham applied to the lower viscera as well as the higher, splagchnon denoted chiefly the higher viscera, the heart, lungs, liver.<P>The Revised Version (British and American) gives "compassion" for "mercy" (<a onClick="return mV(\'Isa\',9,17);">Isa 9:17</a>; <a onClick="return mV(\'Isa\',14,1);">14:1</a>; <a onClick="return mV(\'Isa\',27,11);">27:11</a>; <a onClick="return mV(\'Isa\',49,13);">49:13</a>; <a onClick="return mV(\'Jer\',13,14);">Jer 13:14</a>; <a onClick="return mV(\'Jer\',30,18);">30:18</a>; <a onClick="return mV(\'Dan\',1,9);">Da 1:9</a> the King James Version "tender love with"; for "bowels of compassion," <a onClick="return mV(\'1Jo\',3,17);">1Jo 3:17</a>); for "mercy" (<a onClick="return mV(\'Hbr\',10,28);">Heb 10:28</a>); "full of compassion" for "merciful" (the American Standard Revised Version "merciful" in all cases) (<a onClick="return mV(\'Exo\',34,6);">Exo 34:6</a>; <a onClick="return mV(\'Neh\',9,17);">Ne 9:17</a>; <a onClick="return mV(\'Psa\',103,8);">Ps 103:8</a>; <a onClick="return mV(\'Joe\',2,13);">Joe 2:13</a>; <a onClick="return mV(\'Jon\',4,2);">Jon 4:2</a>); "compassions for mercies" (<a onClick="return mV(\'Isa\',63,15);">Isa 63:15</a>; <a onClick="return mV(\'Phl\',2,1);">Php 2:1</a>), for "repentings" (<a onClick="return mV(\'Hsa\',11,8);">Ho 11:8</a>).<P>Compassion, literally a feeling with and for others, is a fundamental and distinctive quality of the Biblical conception of God, and to its prominence the world owes more than words can express.<P>(1) It lay at the foundation of Israel\'s faith in Yahweh. For it was out of His compassion that He, by a marvelous act of power, delivered them from Egyptian bondage and called them to be His own people. Nothing, therefore, is more prominent in the Old Testament than the ascription of compassion, pity, mercy, etc., to God; the people may be said to have gloried in it. It is summed up in such sayings as that of the great declaration in <a onClick="return mV(\'Exd\',34,6);">Ex 34:6</a>: "Yahweh—a God full of compassion (the American Standard Revised Version merciful) and gracious" (compare <a onClick="return mV(\'Psa\',78,38);">Ps 78:38</a>; <a onClick="return mV(\'Psa\',86,15);">86:15</a>; <a onClick="return mV(\'Psa\',111,4);">111:4</a>; <a onClick="return mV(\'Psa\',112,4);">112:4</a>; <a onClick="return mV(\'Psa\',145,8);">145:8</a>; <a onClick="return mV(\'Lam\',3,22);">La 3:22</a>, "His compassions fail not"). And, because this was the character of their God, the prophets declared that compassion was an essential requirement on the part of members of the community (<a onClick="return mV(\'Hsa\',6,6);">Ho 6:6</a>; <a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>; compare <a onClick="return mV(\'Pro\',19,17);">Pr 19:17</a>).<P>(2) In Jesus Christ, in whom God was "manifest in the flesh," compassion was an outstanding feature (<a onClick="return mV(\'Mat\',9,36);">Mt 9:36</a>; <a onClick="return mV(\'Mat\',14,14);">14:14</a>, etc.) and He taught that it ought to be extended, not to friends and neighbors only, but to all without exception, even to enemies (<a onClick="return mV(\'Mat\',5,\'43-48\');">Mt 5:43-48</a>; <a onClick="return mV(\'Luk\',10,\'30-37\');">Lu 10:30-37</a>).<P>The God of the New Testament, the Father of men, is most clearly revealed as "a God full of compassion." It extends to the whole human race, for which He effected not merely a temporal, but a spiritual and eternal, deliverance, giving up His own Son to the death of the cross in order to save us from the worst bondage of sin, with its consequences; seeking thereby to gain a new, wider people for Himself, still more devoted, more filled with and expressive of His own Spirit. Therefore all who know the God and Father of Christ, and who call themselves His children, must necessarily cultivate compassion and show mercy, "even as he is merciful." Hence, the many apostolic injunctions to that effect (<a onClick="return mV(\'Eph\',4,32);">Eph 4:32</a>; <a onClick="return mV(\'Col\',3,12);">Col 3:12</a>; <a onClick="return mV(\'Jam\',1,27);">Jas 1:27</a>; <a onClick="return mV(\'1Jo\',3,17);">1Jo 3:17</a>, etc.). Christianity may be said to be distinctively the religion of Compassion.``185';
isbe[2235]='Compel`kom-pel\':Our English word always has in it now the flavor of force, not always, however, physical. It may be strong moral urgency, though "constrain" better expresses this.<P>1. In the Old Testament:<P>There are several words indicative of such strong pressure:<P>(1) \'anac "to press": "none could compel" to drink (<a onClick="return mV(\'Est\',1,8);">Es 1:8</a>);<P>(2) nadhach, "to drive," "force": "compelled Judah thereto" (the King James Version, the Revised Version, margin); "led Judah astray" the Revised Version (British and American) (<a onClick="return mV(\'2Ch\',21,11);">2Ch 21:11</a>). The same word rendered "force," as the adulteress by flattering words her victim (<a onClick="return mV(\'Pro\',7,21);">Pr 7:21</a>);<P>(3) \'adhadh, "to serve": not to compel him to serve as a bond servant (<a onClick="return mV(\'Lev\',25,39);">Le 25:39</a> the King James Version, the Revised Version (British and American) "make him serve");<P>(4) parats, "to break forth upon," "urge": "his servants compelled him" (<a onClick="return mV(\'1Sa\',28,23);">1Sa 28:23</a> the King James Version, the Revised Version (British and American) "constrained").<P>2. In the New Testament:<P>In the New Testament two words are found:<P>(1) aggareuo: The word is of Persian origin and means to employ a courier. The Aggaroi were public couriers stationed by appointment of the kings of Persia, at fixed localities, with horses ready for use, to transmit speedily from one to another the royal messages. These couriers had authority to press into their service, in case of need, horses, vessels, and even men, they might meet (Josephus, Ant, XIII ii, 3); "compel thee to go a mile" (<a onClick="return mV(\'Mat\',5,41);">Mt 5:41</a> the King James Version; the Revised Version, margin "impress"); "compelled Simon to bear his cross" (<a onClick="return mV(\'Mat\',27,32);">Mt 27:32</a>; <a onClick="return mV(\'Mar\',15,21);">Mr 15:21</a> the King James Version; the Revised Version, margin "impressed").<P>(2) anagkazo, "to constrain," whether by force, threats, entreaties, persuasion, etc.: "compel them to come in" (<a onClick="return mV(\'Luk\',14,23);">Lu 14:23</a> the King James Version; the Revised Version (British and American) "constrain"). This has been a favorite text of religious persecutors. As Robertson says in his history of Charles V, "As they could not persuade, they tried to compel men to believe." But it simply means that utmost zeal and moral urgency should be used by Christians to induce sinners to enter the Kingdom of God. Compare <a onClick="return mV(\'Act\',26,11);">Ac 26:11</a>.``177';
isbe[2236]='Complaining`kom-plan\'-ing (tsewachah, "cry," "outcry," siach, "meditation," "complaint"): tsewachah is translated "complaining" (<a onClick="return mV(\'Psa\',144,14);">Ps 144:14</a>, the Revised Version (British and American)) "outcry," "no complaining (outcry) in our streets," i.e. "open places" where the people commonly assembled near the gate of the city (compare <a onClick="return mV(\'2Ch\',32,6);">2Ch 32:6</a>; <a onClick="return mV(\'Neh\',8,1);">Ne 8:1</a>); a picture of peace in the city (compare <a onClick="return mV(\'Isa\',24,11);">Isa 24:11</a>; <a onClick="return mV(\'Jer\',14,2);">Jer 14:2</a>); some render "battlecry"; siach (the Revised Version (British and American) <a onClick="return mV(\'Pro\',23,29);">Pr 23:29</a>, the King James Version "babbling"), of the drunkard.``1';
isbe[2237]='Complete`kom-plet\':In the King James Version for pleroo, the verb ordinarily used for the coming to pass of what had been predicted. the King James Version translates this "complete" in <a onClick="return mV(\'Col\',2,10);">Col 2:10</a>; <a onClick="return mV(\'Col\',4,12);">4:12</a> to express the final and entire attainment of what is treated, leaving nothing beyond to be desired or hoped for; otherwise rendered in the Revised Version (British and American) ("made full"). In the Revised Version (British and American), complete appears once for Greek artios, from aro, "to join," in <a onClick="return mV(\'2Ti\',3,17);">2Ti 3:17</a>, in sense of "accurately fitted for," where the King James Version has "perfect."``1';
isbe[2238]='Composition; Compound`kom-po-zish\'-un, kom\'-pound (mathkoneth, "measure"); (subst.) (raqach, "to make perfume," roqach, "perfume"): Used of the sacred anointing oil (<a onClick="return mV(\'Exd\',30,25,32,33);">Ex 30:25, 32-33</a>) and of the holy perfume (<a onClick="return mV(\'Exd\',30,37,38);">Ex 30:37-38</a>), which were not to be used for any profane purpose.``1';
isbe[2239]='Comprehend`kom-pre-hend\':Used in a twofold sense in both the Old Testament and New Testament. This double meaning appears in two Hebrew and two Greek words which signify in turn<P>(1) mental or spiritual perception,<P>(2) capacity to hold or contain, as in a measure or in an all-inclusive principle, e.g.:<P>(1) yadha\', "to see with the eyes or the mind," hence, "know," "understand." Job was urged by Elihu to accept as inscrutable the ways of God, inasmuch as His operations in the physical world are so mighty and mysterious that "we cannot comprehend" them (<a onClick="return mV(\'Job\',37,5);">Job 37:5</a>). Modern science, in unveiling the secrets of Nature, is opening the way for a better understanding of God\'s creative purpose and plan.<P>katalambano, "to lay hold of," hence, mentally to apprehend: used of the spiritual capacity of the Christian "to comprehend (the Revised Version (British and American) "apprehend") with all saints" (<a onClick="return mV(\'Eph\',3,18);">Eph 3:18</a>) the measureless love of God; and of the inability of the unrenewed heart to know or perceive the revelation of God made in Christ: "the darkness comprehended it not" (<a onClick="return mV(\'Jhn\',1,5);">Joh 1:5</a> the Revised Version (British and American) "apprehended"; the Revised Version, margin "overcame"; compare <a onClick="return mV(\'Jhn\',12,35);">Joh 12:35</a>).<P>(2) kul, "to measure" or "contain," as grain in a bushel. So God\'s immeasurable greatness is seen in His being able to hold oceans in the hollow of His hand and "comprehend the dust of the earth in a measure" (<a onClick="return mV(\'Isa\',40,12);">Isa 40:12</a>).<P>anakephalaioo, "to sum up under one head," e.g. love includes every other moral principle and process. The entire law on its manward side, says Paul, "is comprehended (the Revised Version (British and American) "summed up") in this saying, namely, Thou shalt love thy neighbor as thyself" (<a onClick="return mV(\'Rom\',13,9);">Ro 13:9</a>).``139';
isbe[2240]='Conaniah`kon-a-ni\'-a (konanyahu, "Jah has rounded or sustained"; the King James Version Cononiah):<P>(1) A Levite, appointed with his brother Shimei by Hezekiah, the king, and Azariah, the ruler of the house of God, to be overseer of the oblations and tithes and the dedicated things (<a onClick="return mV(\'2Ch\',31,12,13);">2Ch 31:12-13</a>).<P>(2) One of the chiefs of the Levites mentioned in connection with the passover celebration in Josiah\'s reign (<a onClick="return mV(\'2Ch\',35,9);">2Ch 35:9</a>).``1';
isbe[2241]='Conceal`kon-sel\' (parakalupto): Found but once in the New Testament (<a onClick="return mV(\'Luk\',9,45);">Lu 9:45</a>). The primary meaning is to cover by hanging something in front of the object hidden. The purpose of the one concealing is made prominent. There is, therefore, a reserve and studied progress in regard to the statement of facts, that is not always a suppression of truth (<a onClick="return mV(\'Pro\',12,16,23);">Pr 12:16, 23</a>). God withholds more than He reveals (<a onClick="return mV(\'Pro\',25,2);">Pr 25:2</a>; compare <a onClick="return mV(\'Psa\',97,2);">Ps 97:2</a>; <a onClick="return mV(\'1Ti\',6,16);">1Ti 6:16</a>).``1';
isbe[2242]='Conceit`kon-set\':An idiomatic rendering of a phrase, phronimoi en heautois, in <a onClick="return mV(\'Rom\',11,25);">Ro 11:25</a>; <a onClick="return mV(\'Rom\',12,16);">12:16</a>; meaning literally, "wise with one\'s self," i.e. "in one\'s own opinion," or, as in parallel Old Testament passages (<a onClick="return mV(\'Pro\',26,5,12);">Pr 26:5, 12</a> the Revised Version, margin), "in his own eyes" (Hebrew \'ayin).``1';
isbe[2243]='Conception, Immaculate``<a href="./study/isbe/search.html?string=IMMACULATE+CONCEPTION">IMMACULATE CONCEPTION</a>`1';
isbe[2244]='Conception; Conceive`kon-sep\'-shun, kon-sev\' (harah, and derivatives; sullambano): Physically, the beginning of a new life in the womb of a mother, "to catch on," used thus some forty times, as in <a onClick="return mV(\'Gen\',3,16);">Ge 3:16</a>; <a onClick="return mV(\'Gen\',4,1);">4:1</a>; <a onClick="return mV(\'Psa\',51,5);">Ps 51:5</a>. Metaphorically, applied to the start and growth within the heart, of thought, purpose, desire, e.g. "conceive mischief" (<a onClick="return mV(\'Job\',15,35);">Job 15:35</a>; <a onClick="return mV(\'Psa\',7,14);">Ps 7:14</a>), "conceive chaff" (<a onClick="return mV(\'Isa\',33,11);">Isa 33:11</a>). This figure is carried out in details in <a onClick="return mV(\'Jam\',1,15);">Jas 1:15</a>: "Lust, when it hath conceived, beareth sin."``1';
isbe[2245]='Concerning`kon-surn\'-ing:<P>The Revised Version (British and American) makes frequent changes, such as "for," "as for," "from," "about," for "concerning"; "concerning" instead of "for," "of," "over," "in," "against," etc. Some of the other changes are, "unto that which is good" for "concerning" (<a onClick="return mV(\'Rom\',16,19);">Ro 16:19</a>), "concerning" instead of "because of" (<a onClick="return mV(\'Jer\',23,9);">Jer 23:9</a>), for "the miracle of" (<a onClick="return mV(\'Mar\',6,52);">Mr 6:52</a>); for "with" (<a onClick="return mV(\'Mar\',10,41);">Mr 10:41</a>), for "of the Lord" (<a onClick="return mV(\'Act\',18,25);">Ac 18:25</a>), "concerning Jesus" (diferent text), "by way of disparagement" (<a onClick="return mV(\'2Cr\',11,21);">2Co 11:21</a>), instead of "concerning reproach"; "Why askest thou me concerning that which is good?" (<a onClick="return mV(\'Mat\',19,17);">Mt 19:17</a>) instead of "Why callest thou me good?" (different text; see the Revised Version, margin).``185';
isbe[2246]='Concision`kon-sizh\'-un (katatome, "mutilation," "cutting"): A term by which Paul contemptuously designates the merely fleshly circumcision upon which the Judaizers insisted as being necessary for Gentile converts (<a onClick="return mV(\'Phl\',3,2);">Php 3:2</a>), as distinguished from peritome, the true circumcision (<a onClick="return mV(\'Phl\',3,3);">Php 3:3</a>). Compare <a onClick="return mV(\'Gal\',5,12);">Ga 5:12</a> and <a onClick="return mV(\'Deu\',23,1);">De 23:1</a>`<a href="./study/isbe/search.html?string=CIRCUMCISION">CIRCUMCISION</a>`1';
isbe[2247]='Conclude`kon-klood\' (sumbibazo): Used only in <a onClick="return mV(\'Act\',16,10);">Ac 16:10</a>, where the King James Version has "assuredly gathering," i.e. "inferring." Where the King James Version has "conclude," the Revised Version (British and American) more accurately renders "reckon" (<a onClick="return mV(\'Rom\',3,28);">Ro 3:28</a>); "giving judgment" (<a onClick="return mV(\'Act\',21,25);">Ac 21:25</a>); "shut up" (<a onClick="return mV(\'Rom\',11,32);">Ro 11:32</a>; <a onClick="return mV(\'Gal\',3,22);">Ga 3:22</a>).``1';
isbe[2248]='Conclusion`kon-kloo\'-zhun (coph): In <a onClick="return mV(\'Ecc\',12,13);">Ec 12:13</a> the King James Version, where the Revised Version (British and American) has "the end," namely, a summary of the entire argument of the book.``1';
isbe[2249]='Concordance`kon-kor\'-dans:<P>1. Nature of Work<P>2. Classes of Concordances<P>3. Their Indispensableness<P>4. Concordances to Latin Vulgate<P>5. Concordances to the Hebrew Old Testament<P>6. Concordances to the Septuagint<P>7. Concordances to the Greek New Testament<P>8. Concordances to the English Bible<P>LITERATURE<hr /><P>1. Nature of Work:<P>The object of a concordance of Scripture is to guide the reader to any passage he is in search of by means of an alphabetical arrangement of the words found in Scripture, and the bringing together under each word of all the passages in which that word occurs. Thus, in the verse: "Cast thy burden upon Yahweh" (<a onClick="return mV(\'Psa\',55,22);">Ps 55:22</a>), the reader will look in the concordance under the words "cast" or "burden," and there will find a reference to the text. The merit of a concordance is obviously exhaustiveness and clearness of arrangement. There are abridged concordances of the Bible which give only the most important words and passages. These are seldom satisfactory, and a fuller work has in the end frequently to be resorted to.<P>2. Classes of Concordances:<P>The ordinary reader is naturally most familiar with concordances of the English Bible, but it will be seen that, for scholarly purposes, concordances are just as necessary for the Scriptures in their original tongues, and for versions of the Scriptures other than English There are required concordances of the Old Testament in Hebrew, of the New Testament in Greek, of the Septuagint version (Greek) of the Old Testament, of the Vulgate (Jerome\'s Latin Bible, 390-405 A. D.) version (Latin) of the New Testament, as well as of the translations of the Scriptures into German, French and other living languages. There are now, further, required concordances of the RVV of the English Old Testament and New Testament, as well as of the King James Version. There are needed, besides, good concordances to the Apocrypha, alike in its the King James Version and the Revised Version (British and American) forms. Textual criticism leads to modifications of the earlier concordances of the Hebrew and Greek texts. It is customary in concordances of the English version to facilitate reference by giving not only single words, but also phrases under which several passages are grouped, and to make the work more useful by furnishing lists of Scripture proper names, with their meanings, and, in the larger works, references to the Hebrew or Greek words for which the English words stand.<P>3. Their Indispensableness:<P>The indispensableness of a good concordance for the proper study of the Bible is so apparent that it is not surprising that, since the idea was first conceived, much labor has been expended on the preparation of such works. The wonder rather is that the idea did not occur earlier than it did. No single scholar could ever hope to produce a perfect work of the kind by his own efforts. Modern concordances are based upon the labors of previous generations.<P>4. Concordances to Latin Vulgate:<P>The oldest concordances date from the 13th century, and are based, as was then natural, upon the Latin Vulgate. A Concordantiae Morales is attributed to Antony of Padua (died 1231). The first concordance of which we have actual knowledge is that of Hugo of Caro, Dominican monk and cardinal (died 1263). It was called Concordantiae S. Jacobi from the monastery in which it was compiled. 500 monks are said to have been engaged upon its preparation. Hugo\'s Concordance became the basis of others into which successive improvements were introduced. The words of passages, at first wanting, were inserted; indeclinable particles were added; alphabetic arrangement was employed. Verse divisions were unknown till the time of Robert Stephens (1555).<P>See <a href="./study/isbe/search.html?string=BIBLE">BIBLE</a>.<P>5. Concordances to Hebrew Old Testament:<P>The earliest Hebrew concordance seems to have been that of Rabbi Mordecai ben Nathan (1438-48). It went through several editions and was translated into Latin by Reuchlin the (1556). Both original and translation contained many errors. It was improved by Calasio, a Franciscan friar (1621), and more thoroughly by John Buxtorf, whose Concordance was published by his son (1632). This latter formed the basis of Dr. Julius Furst\'s Libr. Sacrorum Vet. Test. Concordantive Heb atque Chaldaic; 1840 (English translation, Hebrew and Chaldean Concordance). A later Hebrew Concordance in Germany is that of Solomon Mandelkern (1896). In England, in 1754, appeared the valuable Hebrew Concordance, Adapted to the English Bible, by Dr. Taylor, of Norwich. With it may be classed The Englishman\'s Hebrew and Chaldaic Concordance (1843; revised edition, 1876).<P>6. Concordances to the Septuagint:<P>Though earlier attempts are heard of, the first printed concordance of the Septuagint (the Greek Old Testament) was that of Trommius, published in Amsterdam in 1718, in the author\'s 84th year. This important work remained the standard till quite lately.<P>It is very complete, giving references not only to the Septuagint, but to other versions (Aquila, Symmachus, Theodotion) in which the words occur, and showing by an index at the end the Hebrew or Chaldaic words to which the Greek words correspond. In 1887 Bagster published A Handy Concordance of the Septuagint. Earlier works are superseded by the recent publication (1892,1897,1900) of Hatch and Redpath\'s scholarly Concordance to the Septuagint, and Other Greek versions of the Old Testament.<P>7. Concordances to the Greek New Testament:<P>Concordances of the Greek New Testament began with that of Xystus Betulius (his real name was Birck) in 1554. The Concordance (Tameion) of Erasmus Schmid (1638) has often been reprinted and reedited. On it is based the useful abridged Concordance published by Bagster. Recent works are Bruder\'s (1842; 4th edition, 1888; based on Schmid, with many improvements); in America, Hudson\'s Critical Greek and English Concordance, revised by Ezra Abbot (1870); in England, Moulton and Geden\'s Concordance to the Greek Testament according to the Texts of Westcott and Hort, Tischendorf, and the English Revisers (1897).<P>8. Concordances to the English Bible:<P>The list of concordances to the English Bible is a long one; it is necessary here to particularize only a few of the chief. The oldest is a Concordance of the New Testament, brought out before 1540 by one Thomas Gybson, though, as appears from the Preface, it was principally the work of the printer John Day (the producer of Foxe\'s Book of Martyrs). The first Concordance to the whole Bible was that of John Marbeck (1550). In the same year was published a translation by Walter Lynne of the Index Librorum of Bullinger, Conrad Pelican and others, under the title of A Briefe and a Compendious Table, in manor of a Concordance, openying the waye to the principall Histories of the whole Bible, etc. Alex. Cruden, whose own Concordance, the most adequate of all, was published in 1737, enumerates most of his predecessors in the intervening period. Cruden\'s personal history is a pathetic one. A recurring mental malady overshadowed his career; but his indomitable perseverance and fixity of purpose, joined with a clear idea of what he wished to accomplish, enabled him to overcome all obstacles, and produce a book for which the Christian world is grateful. The work is entitled A Complete Concordance to the Holy Scriptures of the Old and New Testaments, etc.; to which is added, a Concordance to the Books called Apocrypha. Mr. Spurgeon said regarding it, "Be sure you buy a genuine unabridged Cruden, and none of the modern substitutes, good as they may be at the price....You need only one; have none but the best." Many editions of this valuable book have been published. It no longer remains, however, the only authority, nor even the most complete and serviceable, though perhaps still the most convenient, for the purpose of the student. In 1873 was published the Analytical Concordance to the Bible by Robert Young, LL. D., to which an appendix has since been added. This bulky work contains "every word in alphabetical order, arranged under its Hebrew or Greek original; with the literal meaning of each and its pronunciation." It marks 30,000 various readings, and gives geographical and antiquarian notes. Yet more comprehensive is The Exhaustive Concordance of the Bible by James Strong, LL. D. This includes the new feature of a comparative concordance of the Authorized and Revised (English) versions It embraces also condensed Dictionaries of the Hebrew and Greek words, to which references are made from the English words by figures. It thus differs in plan from Young\'s, which gives the Hebrew and Greek words in the body of the concordance at the head of the passages coming under them. Lastly must be noticed the very valuable work published in the same year (1894) in America by J. B. R. Walker, Comprehensive Concordance, with an Introduction by Marshall Curtiss Hazard. It is stated to give 50,000 more passages than Cruden.<P>LITERATURE.<P>See articles on "Concordance" in the various Dictionaries and Encyclopedias; articles by Dr. Beard in Kitto\'s Encyclopedia (Volume I); and by Dr. C. R. Gregory in the New The New Schaff-Herzog Encyclopedia of Religious Knowledge Encyclopedia (Volume III); Preface to Cruden\'s complete Concordance, and Introduction by Hazard to Walker\'s Comprehensive Concordance.``132';
isbe[2250]='Concourse`kon\'-kors (hamah, "to hum," "to make a noise"; sustrophe, "a turning" or "twisting together"): Hamah, usually translated by some word signifying "sound" is rendered "concourse" in <a onClick="return mV(\'Pro\',1,21);">Pr 1:21</a> (perhaps from the noise made by people thronging and talking together; compare <a onClick="return mV(\'1Ki\',1,41);">1Ki 1:41</a>, "uproar"), "She (wisdom) crieth in the chief place of concourse," the Revised Version, margin, Hebrew "at the head of the noisy (streets)"; sustrophe is translated "concourse" (<a onClick="return mV(\'Act\',19,40);">Ac 19:40</a>), a riotous crowd. Compare Judith 10:18.``1';
isbe[2251]='Concubinage`kon-ku\'-bi-naj.`<a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>`1';
isbe[2252]='Concupiscence`kon-ku\'-pi-sens (epithumia): Not used in the Revised Version (British and American), but in the King James Version, <a onClick="return mV(\'Rom\',7,8);">Ro 7:8</a>; <a onClick="return mV(\'Col\',3,5);">Col 3:5</a>; <a onClick="return mV(\'1Th\',4,5);">1Th 4:5</a>. The Greek noun, like the verb from which it comes, meaning "to yearn," "to long," "to have the heart set upon a thing," is determined in its moral quality by the source whence it springs or the object toward which it is directed. Thus, our Lord uses it to express the intensest desire of His soul (<a onClick="return mV(\'Luk\',22,15);">Lu 22:15</a>). As a rule, when the object is not expressed, it refers to longing for that which God has forbidden, namely, lust. It is not limited to sexual desire, but includes all going forth of heart and will toward what God would not have us to have or be, as its use in the Septuagint of the Ten Commandments clearly shows, for "Thou shalt not covet" (<a onClick="return mV(\'Exd\',20,17);">Ex 20:17</a>).``84';
isbe[2253]='Condemn; Condemnation`kon-dem\', kon-dem-na\'-shun:<P>1. In the Old Testament:<P>(1) The causative stem of rasha\' "to declare (or make) wrong," "to condemn," whether in civil, ethical or religious relations. Taken in this sense the word needs no comment (<a onClick="return mV(\'Exd\',22,9);">Ex 22:9</a>; <a onClick="return mV(\'Deu\',25,1);">De 25:1</a>; <a onClick="return mV(\'Job\',40,8);">Job 40:8</a>); "Who then can condemn?" (<a onClick="return mV(\'Job\',34,29);">Job 34:29</a>, the King James Version "make trouble").<P>(2) \'anash, "to fine." "Condemned the land" (<a onClick="return mV(\'2Ch\',36,3);">2Ch 36:3</a> the King James Version; the King James Version margin "mulcted"; the Revised Version (British and American) "amerced"; the American Standard Revised Version "fined"); "wine of the condemned" (<a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>; the Revised Version (British and American) "fined" (unjustly)).<P>(3) The active participle of shaphaT, "to judge." "From those that condemn his soul" (<a onClick="return mV(\'Psa\',109,31);">Ps 109:31</a> the King James Version; the Revised Version (British and American) "that judge his soul").<P>2. In the New Testament:<P>The New Testament usage is much more complicated, both because of the greater number of Greek words rendered "condemn" and "condemnation," and because the King James Version translates the same word in several different ways, apparently with no rule whatever.<P>(1) The most important word is krino, "to judge." From it are a number of derivative verbs and nouns. the Revised Version (British and American) has rigidly excluded the harsh words "damn" and "damnation," substituting "judge," "condemn," "judgment," "condemnation." This is proper, since the word damn (Latin, damnare, "to inflict loss" upon a person, "to condemn"), and its derivatives has, in process of time, suffered degradation, so that in modern English it usually refers to eternal punishment. This special application of the word for some centuries ran side by side with the original meaning, but even as late as Wycliffe\'s version the word "damn" is usually employed in the sense of condemn, as in <a onClick="return mV(\'Job\',9,20);">Job 9:20</a>, "My mouth shall dampne me." It is even applied to the condemnation of Jesus by the chief priests and scribes (<a onClick="return mV(\'Mar\',10,33);">Mr 10:33</a>). This degeneration of the word is perhaps due, as Bishop Sanderson says, "not so much to good acts as to bad manners." Krino is rendered uniformly "judge" by the Revised Version (British and American), even where the context. compels the thought of condemnation (<a onClick="return mV(\'Jhn\',3,17,18);">Joh 3:17-18</a>; <a onClick="return mV(\'Jhn\',12,47);">12:47</a>; <a onClick="return mV(\'Act\',7,7);">Ac 7:7</a>; "might be damned," <a onClick="return mV(\'2Th\',2,12);">2Th 2:12</a> the King James Version; <a onClick="return mV(\'Rom\',14,22);">Ro 14:22</a>; <a onClick="return mV(\'Jam\',5,9);">Jas 5:9</a>).<P>(2) The more specific sense of condemn, however, is found in katakrino, "to judge one down" (<a onClick="return mV(\'Mat\',12,41,42);">Mt 12:41-42</a>; <a onClick="return mV(\'Mar\',14,64);">Mr 14:64</a>): "is damned if he eat" (<a onClick="return mV(\'Rom\',14,23);">Ro 14:23</a>; <a onClick="return mV(\'1Cr\',11,32);">1Co 11:32</a> the King James Version; the Revised Version (British and American) "condemned"). See also <a onClick="return mV(\'Mar\',16,16);">Mr 16:16</a>; <a onClick="return mV(\'2Pe\',2,6);">2Pe 2:6</a>.<P>(3) For "condemnation" there is the noun krima, or krima (for accent see Thayer\'s Lexicon), in a forensic sense, "the sentence of the judge" (<a onClick="return mV(\'Luk\',23,40);">Lu 23:40</a>; <a onClick="return mV(\'Mat\',23,14);">Mt 23:14</a>, omitted in the Revised Version (British and American); "condemnation of the devil" <a onClick="return mV(\'1Ti\',3,6);">1Ti 3:6</a>; <a onClick="return mV(\'1Ti\',5,12);">5:12</a>; <a onClick="return mV(\'Jud\',1,4);">Jude 1:4</a>).<P>(4) Much stronger is katakrima, "condemnation" (<a onClick="return mV(\'Rom\',5,16,18);">Ro 5:16, 18</a>; <a onClick="return mV(\'Rom\',8,1);">8:1</a>) with reference to the Divine judgment against sin.<P>(5) krisis, "the process of judgment," "tribunal" (<a onClick="return mV(\'Jhn\',3,19);">Joh 3:19</a>; <a onClick="return mV(\'Jhn\',5,24);">5:24</a>), with reference to "the judgment brought by men upon themselves because of their rejection of Christ."<P>(6) A stronger word is the adjective autokatakritos, "self-condemned" (<a onClick="return mV(\'Tts\',3,11);">Tit 3:11</a>; compare <a onClick="return mV(\'1Jo\',3,20,21);">1Jo 3:20-21</a>).``177';
isbe[2254]='Condescension, of Christ`kon-de-sen\'-shun.`<a href="./study/isbe/search.html?string=KENOSIS">KENOSIS</a>`1';
isbe[2255]='Conduct`kon\'-dukt.`<a href="./study/isbe/search.html?string=ETHICS">ETHICS</a>`1';
isbe[2256]='Conduit`kon\'-dit.`<a href="./study/isbe/search.html?string=CISTERN">CISTERN</a>`1';
isbe[2257]='Coney`ko\'-ni (shaphan (<a onClick="return mV(\'Lev\',11,5);">Le 11:5</a>; <a onClick="return mV(\'Deu\',14,7);">De 14:7</a>; <a onClick="return mV(\'Psa\',104,18);">Ps 104:18</a>; <a onClick="return mV(\'Pro\',30,26);">Pr 30:26</a>)): The word "coney" (formerly pronounced cooney) means "rabbit" (from Latin cuniculus). Shaphan is rendered in all four passages in the Septuagint choirogrullios, or "hedge-hog," but is now universally considered to refer to the Syrian hyrax, Procavia (or Hyrax) Syriaca, which in Southern Palestine and Sinai is called in Arabic wabar, in Northern Palestine and Syria Tabsun, and in Southern Arabia shufun, which is etymologically closely akin to shaphan. The word "hyrax" (hurax) itself means "mouse" or "shrew-mouse" (compare Latin sorex), so that it seems to have been hard to find a name peculiar to this animal. In <a onClick="return mV(\'Lev\',11,5);">Le 11:5</a> the Revised Version, margin, we find "rock badger," which is a translation of klip das, the rather inappropriate name given by the Boers to the Cape hyrax. The Syrian hyrax lives in Syria, Palestine and Arabia. A number of other species, including several that are arboreal, live in Africa. They are not found in other parts of the world. In size, teeth and habits the Syrian hyrax somewhat resembles the rabbit, though it is different in color, being reddish brown, and lacks the long hind legs of the rabbit. The similarity in dentition is confined to the large size of the front teeth and the presence of a large space between them and the back teeth. But whereas hares have a pair of front teeth on each jaw, the hyrax has one pair above and two below. These teeth differ also in structure from those of the hare and rabbit, not having the persistent pulp which enables the rabbit\'s front teeth to grow continually as they are worn away. They do not hide among herbage like hares, nor burrow like rabbits, but live in holes or clefts of the rock, frequently in the faces of steep cliffs. Neither the hyrax nor the hare is a ruminant, as seems to be implied in <a onClick="return mV(\'Lev\',11,5);">Le 11:5</a> and <a onClick="return mV(\'Deu\',14,7);">De 14:7</a>, but their manner of chewing their food may readily have led them to be thought to chew the cud. The hyrax has four toes in front and three behind (the same number as in the tapir and in some fossil members of the horse family), all furnished with nails that are almost like hoofs, except the inner hind toes, which have claws. The hyraxes constitute a family of ungulates and, in spite of their small size, have points of resemblance to elephants or rhinoceroses, but are not closely allied to these or to any other known animals.<P>The camel, the coney and the hare are in the list of unclean animals because they "chew the cud but divide not the hoof," but all three of these are eaten by the Arabs.``37';
isbe[2258]='Confection; Confectionary`kon-fek\'-shun, kon-fek\'-shun-a-ri (roqach "perfume," "spice," raqqahah, feminine "perfumer"):<P>(1) "Confection" is found in the King James Version only and but once "a confection after the art of the apothecary" (<a onClick="return mV(\'Exd\',30,35);">Ex 30:35</a>; the Revised Version (British and American) "perfume"); but the Revised Version (British and American) renders <a onClick="return mV(\'1Ch\',9,30);">1Ch 9:30</a>, "the confection (the King James Version "ointment") of the spices." It stands for something "made up," a mixture of perfumes or medicines, but never sweetmeats, as confection means with us.<P>(2) Likewise a "confectionary" is a perfumer. This word, too, is found but once (<a onClick="return mV(\'1Sa\',8,13);">1Sa 8:13</a>), "He will take your daughters to be perfumers (the King James Version "confectionaries"), and to be cooks, and to be bakers."`<a href="./study/isbe/search.html?string=PERFUME">PERFUME</a>`47';
isbe[2259]='Confederate; Confederacy`kon-fed\'-er-at, kon-fed\'-er-a-si: "Confederate" as an adjective in the sense of united or leagued is twice the translation of berith "covenant," in several instances translated "league" (<a onClick="return mV(\'Gen\',14,13);">Ge 14:13</a>, ba\'al berith, "lord or master of a covenant," "an ally,") "these were confederate with Abram"; compare <a onClick="return mV(\'Psa\',83,5);">Ps 83:5</a>; once of nuach, "to rest," "Syria is confederate with Ephraim" (<a onClick="return mV(\'Isa\',7,2);">Isa 7:2</a>, the Revised Version, margin "resteth on Ephraim"; also 1Macc 10:47).<P>As a noun "confederate" occurs in 1Macc 10:16, summachos, "confederates" (1Macc 8:20,24,31; 14:40; 15:17).<P>Confederacy, as a "league," occurs as the translation of berith, "the men of thy confederacy" (<a onClick="return mV(\'Oba\',1,7);">Obad 1:7</a>); as a conspiracy it occurs in <a onClick="return mV(\'Isa\',8,12);">Isa 8:12</a> twice, as translation of qesher from qashar, "to bind": "Say ye not, a confederate." Compare <a onClick="return mV(\'2Sa\',15,12);">2Sa 15:12</a>; <a onClick="return mV(\'2Ki\',12,20);">2Ki 12:20</a>, etc.``185';
isbe[2260]='Confer; Conference`kon\'-fer, kon\'-ferens: The equivalent of three Greek words of different shades of meaning. In <a onClick="return mV(\'Gal\',1,16);">Ga 1:16</a>, prosanatithemi, had been used in classical writers for resorting to oracles (Lightfoot on <a onClick="return mV(\'Gal\',2,6);">Ga 2:6</a>; Ellicott on <a onClick="return mV(\'Gal\',1,16);">Ga 1:16</a>); hence, "to take counsel with," "to consult." In <a onClick="return mV(\'Act\',4,15);">Ac 4:15</a>, sumballo, "to compare views," "discuss"; and in <a onClick="return mV(\'Act\',25,12);">Ac 25:12</a>, sullaleo, "to talk together." Compare the single passage in the Old Testament (<a onClick="return mV(\'1Ki\',1,7);">1Ki 1:7</a>).``1';
isbe[2261]='Confession`kon-fesh\'-un (yadhah; homologeo, and their derivatives): The radical meaning is "acknowledgment," "avowal," with the implication of a change of conviction or of course of conduct on the part of the subject. In English "profession" (the King James Version <a onClick="return mV(\'1Ti\',6,12);">1Ti 6:12</a>; <a onClick="return mV(\'Hbr\',3,1);">Heb 3:1</a>; <a onClick="return mV(\'Hbr\',4,14);">4:14</a>), besides absence of the thought just suggested, emphasizes the publicity of the act. Confession, like its Greek equivalent, connotes, as its etymology shows (Latin, con; Greek, homou), that the act places one in harmony with others. It is the uniting in a statement that has previously been made by someone else. Of the two Greek words from the same root in the New Testament, the compound with the Greek preposition ek found, among other places, in <a onClick="return mV(\'Mat\',3,6);">Mt 3:6</a>; <a onClick="return mV(\'Act\',19,18);">Ac 19:18</a>; <a onClick="return mV(\'Rom\',14,11);">Ro 14:11</a>; <a onClick="return mV(\'Phl\',2,11);">Php 2:11</a>, implies that it has come from an inner impulse, i.e. it is the expression of a conviction of the heart. It is referred anthropopathically to God in <a onClick="return mV(\'Job\',40,14);">Job 40:14</a>, where Yahweh says to the patriarch sarcastically: "Then will I also confess of (unto) thee"; and in <a onClick="return mV(\'Rev\',3,5);">Re 3:5</a>, where it means "to recognize" or "acknowledge."<P>When man is said to confess or make confession, the contents of the confession are variously distinguished. All, however, may be grouped under two heads, confession of faith and confession of sin. Confessions of faith are public acknowledgments of fidelity to God, and to the truth through which God is revealed, as <a onClick="return mV(\'1Ki\',8,33);">1Ki 8:33</a>. They are declarations of unqualified confidence in Christ, and of surrender to His service; <a onClick="return mV(\'Mat\',10,32);">Mt 10:32</a>: "Every one...who shall confess me before men." In <a onClick="return mV(\'Phl\',2,11);">Php 2:11</a>, however, confession includes, alongside of willing, also unwilling, acknowledgment of the sovereignty of Jesus. The word confession stands also for everything contained in the Christian religion—"the faith" used in the objective and widest sense, in <a onClick="return mV(\'Hbr\',3,1);">Heb 3:1</a>; <a onClick="return mV(\'Hbr\',4,14);">4:14</a>. In both these passages, the allusion is to the New Testament. The "High Priest of our confession" (<a onClick="return mV(\'Hbr\',3,1);">Heb 3:1</a>) is the High Priest, of whom we learn and with whom we deal in that new revelation, which in that epistle is contrasted with the old.<P>Confessions of sins are also of various classes:<P>(1) To God alone. Wherever there is true repentance for sin, the penitent freely confesses his guilt to Him, against whom he has sinned. This is described in <a onClick="return mV(\'Psa\',32,\'3-6\');">Ps 32:3-6</a>; compare <a onClick="return mV(\'1Jo\',1,9);">1Jo 1:9</a>; <a onClick="return mV(\'Pro\',28,13);">Pr 28:13</a>. Such confession may be made either silently, or, as in <a onClick="return mV(\'Dan\',9,19);">Da 9:19</a>, orally; it may be general, as in <a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a>, or particular, as when some special sin is recognized; it may even extend to what has not been discovered, but which is believed to exist because of recognized inner depravity (<a onClick="return mV(\'Psa\',19,12);">Ps 19:12</a>), and thus include the state as well as the acts of sin (<a onClick="return mV(\'Rom\',7,18);">Ro 7:18</a>).<P>(2) To one\'s neighbor, when he has been wronged (<a onClick="return mV(\'Luk\',17,4);">Lu 17:4</a>): "If he sin against thee seven times in the day, and seven times turn again to thee, saying, I repent; thou shalt forgive him." It is to this form of confession that James refers (<a onClick="return mV(\'Jam\',5,16);">5:16</a>): "Confess...your sins one to another"; compare <a onClick="return mV(\'Mat\',5,23);">Mt 5:23</a> f.<P>(3) To a spiritual adviser or minister of the word, such as the confession of David to Nathan (<a onClick="return mV(\'2Sa\',12,13);">2Sa 12:13</a>), of the multitudes to John in the wilderness (<a onClick="return mV(\'Mat\',3,6);">Mt 3:6</a>), of the Ephesians to Paul (<a onClick="return mV(\'Act\',19,18);">Ac 19:18</a>). This confession is a general acknowledgment of sinfulness, and enters into an enumeration of details only when the conscience is particularly burdened.<P>(4) To the entire church, where some crime has created public scandal. As "secret sins are to be rebuked secretly, and public sins publicly," in the apostolic age, where there was genuine penitence for a notorious offense, the acknowledgment was as public as the deed itself. An illustration of this is found in the well-known case at Corinth (compare <a onClick="return mV(\'1Cr\',5,3);">1Co 5:3</a>ff with <a onClick="return mV(\'2Cr\',2,6);">2Co 2:6</a>f).<P>For auricular confession in the sense of the medieval and Roman church, there is no authority in Holy Scripture. It is traceable to the practice of examining those who were about to make a public confession of some notorious offense, and of giving advice concerning how far the circumstances of the sin were to be announced; an expedient that was found advisable, since as much injury could be wrought by injudicious publishing of details in the confession as by the sin itself. The practice once introduced for particular cases was in time extended to all cases; and the private confession of sin was demanded by the church as a condition of the absolution, and made an element of penitence, which was analyzed into contrition, confession and satisfaction. See the Examen Concilii Tridentini (lst edition, 1565) of Dr. Martin Chemnitz, superintendent of Brunswick, for a thorough exegetical and historical discussion of this entire subject. On the historical side, see also Henry Charles Lea, History of Auricular Confession and Indulgences in the Latin Church (3 volumes, Philadelphia, 1896).``84';
isbe[2262]='Confidence`kon\'-fi-dens (batach, and forms, kecel; parrhesia; peitho, pepoithesis, hupostasis): The chief Hebrew word translated "confidence" (batach, and its forms) means, perhaps, radically, "to be open," showing thus what originated the idea of "confidence"; where there was nothing hidden a person felt safe; it is very frequently rendered "trust." In <a onClick="return mV(\'Psa\',118,8,9);">Ps 118:8-9</a> we have "It is better to take refuge in Yahweh than to put confidence in princes," and in <a onClick="return mV(\'Psa\',65,5);">65:5</a>, "O God of our salvation, thou that art the confidence (mibhtach) of all the ends of the earth." Mibhtach is translated "confidence" in <a onClick="return mV(\'Job\',18,14);">Job 18:14</a>; <a onClick="return mV(\'Job\',31,24);">31:24</a>; <a onClick="return mV(\'Pro\',21,22);">Pr 21:22</a>, etc.<P>Kecel ("firmness," "stoutness") is rendered "confidence" in <a onClick="return mV(\'Pro\',3,26);">Pr 3:26</a>, and kiclah in <a onClick="return mV(\'Job\',4,6);">Job 4:6</a>; peitho ("to persuade") is translated "confidence" in <a onClick="return mV(\'2Cr\',2,3);">2Co 2:3</a>; <a onClick="return mV(\'Gal\',5,10);">Ga 5:10</a>, etc.; pepoithesis, in <a onClick="return mV(\'2Cr\',1,15);">2Co 1:15</a>; <a onClick="return mV(\'2Cr\',8,22);">8:22</a>, etc.; hupostasis ("what stands under"), in <a onClick="return mV(\'2Cr\',11,17);">2Co 11:17</a>; <a onClick="return mV(\'Hbr\',3,14);">Heb 3:14</a>; <a onClick="return mV(\'2Cr\',9,4);">2Co 9:4</a>; parrhesia ("out- spokenness," "boldness") is invariably translated in the Revised Version (British and American) "boldness" (<a onClick="return mV(\'Act\',28,31);">Ac 28:31</a>; <a onClick="return mV(\'Hbr\',3,6);">Heb 3:6</a>; <a onClick="return mV(\'Hbr\',4,16);">4:16</a>; <a onClick="return mV(\'Hbr\',10,35);">10:35</a>; <a onClick="return mV(\'1Jo\',2,28);">1Jo 2:28</a>; <a onClick="return mV(\'1Jo\',3,21);">3:21</a>; <a onClick="return mV(\'1Jo\',5,14);">5:14</a>); tharseo or tharrheo ("to have good courage") is so translated in the Revised Version (British and American), "being therefore always of good courage" (<a onClick="return mV(\'2Cr\',5,6);">2Co 5:6</a>); "I am of good courage concerning you" (<a onClick="return mV(\'2Cr\',7,16);">2Co 7:16</a>), the King James Version "confident" and "confidence." Revised Version has "confidence" for "hope" (<a onClick="return mV(\'Job\',8,14);">Job 8:14</a>); for "assurance" (<a onClick="return mV(\'Isa\',32,17);">Isa 32:17</a>); for "trust" (<a onClick="return mV(\'2Cr\',3,4);">2Co 3:4</a>); for "same confident boasting" (<a onClick="return mV(\'2Cr\',9,4);">2Co 9:4</a>); "is confident" for "trusted" (<a onClick="return mV(\'Job\',40,23);">Job 40:23</a>); "to have confidence" for "thinketh that he hath whereof he might trust" (<a onClick="return mV(\'Phl\',3,4);">Php 3:4</a>); "confidently" for "constantly" (<a onClick="return mV(\'Act\',12,15);">Ac 12:15</a>); "confidently affirm" for "affirm" (<a onClick="return mV(\'1Ti\',1,7);">1Ti 1:7</a>); conversely, we have for "his confidence" (<a onClick="return mV(\'Job\',18,14);">Job 18:14</a>), "wherein he trusteth," for "with confidence" (<a onClick="return mV(\'Eze\',28,26);">Eze 28:26</a>) "securely therein."<P>The Bible teaches the value of confidence (<a onClick="return mV(\'Isa\',30,15);">Isa 30:15</a>; <a onClick="return mV(\'Hbr\',10,35);">Heb 10:35</a>), but neither in "gold" (<a onClick="return mV(\'Job\',31,24);">Job 31:24</a>), nor in man, however great (<a onClick="return mV(\'Psa\',118,8,9);">Ps 118:8-9</a>; <a onClick="return mV(\'Jer\',17,5);">Jer 17:5</a>), nor in self as revealed in Christ (<a onClick="return mV(\'Eph\',3,12);">Eph 3:12</a>; <a onClick="return mV(\'1Jo\',5,13,14);">1Jo 5:13-14</a>). (<a onClick="return mV(\'Pro\',14,16);">Pr 14:16</a>; <a onClick="return mV(\'Phl\',3,3);">Php 3:3</a>), but in God (<a onClick="return mV(\'Psa\',65,5);">Ps 65:5</a>; <a onClick="return mV(\'Pro\',3,26);">Pr 3:26</a>; <a onClick="return mV(\'Pro\',14,26);">14:26</a>),``185';
isbe[2263]='Confirm; Confirmation`kon-furm, konfer-ma\'-shun: In the Old Testament represented by several Hebrew words, generally with reference to an increase of external strength, as "corfirm the feeble knees" (<a onClick="return mV(\'Isa\',35,3);">Isa 35:3</a>); "confirm the kingdom" (<a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>); "confirm inheritance" (<a onClick="return mV(\'Psa\',68,9);">Ps 68:9</a>). In the New Testament, this external, objective sense is expressed by bebaioo, as in <a onClick="return mV(\'Mar\',16,20);">Mr 16:20</a>; <a onClick="return mV(\'Rom\',15,8);">Ro 15:8</a>. The strengthening of mind, purpose, conviction, i.e. the inner or subjective sense (<a onClick="return mV(\'Act\',14,22);">Ac 14:22</a>; <a onClick="return mV(\'Act\',15,32,41);">15:32, 41</a>) corresponds to episterizo. Used also of ratifying or making valid (kuroo) a covenant (<a onClick="return mV(\'Gal\',3,15);">Ga 3:15</a>). The noun is used in the second sense (<a onClick="return mV(\'Hbr\',6,16);">Heb 6:16</a>; <a onClick="return mV(\'Phl\',1,7);">Php 1:7</a>). Confirmation, the rite, in some denominations, of admission to the full communion of the church, which the Roman church has elevated to the place of a sacrament, has only ecclesiastical, but no Scriptural, authority. It is grounded, however, in the Scriptural precedent of the laying on of hands after baptism.`<a href="./study/isbe/search.html?string=HANDS,+IMPOSITION,+LAYING+ON+OF">HANDS, IMPOSITION, LAYING ON OF</a>`84';
isbe[2264]='Confiscation`kon-fis-ka\'-shun.`<a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[2265]='Conflict`kon\'-flikt (agon, "contest," "fight"): In <a onClick="return mV(\'Phl\',1,30);">Php 1:30</a>, "having the same c. which ye saw in me," and <a onClick="return mV(\'Col\',2,1);">Col 2:1</a> the King James Version; <a onClick="return mV(\'1Th\',2,2);">1Th 2:2</a> (the King James Version "contention"); athlesis (literally, "combat in the public games"), in <a onClick="return mV(\'Hbr\',10,32);">Heb 10:32</a> (the King James Version "fight").`<a href="./study/isbe/search.html?string=AGONY">AGONY</a>`1';
isbe[2266]='Conform; Conformable`kon-form\', kon-form\'-a-b\'-l (summorphoo "to become or be like," or "of the same form"): Indicating an inner change of nature, working into the outward life (<a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>; <a onClick="return mV(\'Phl\',3,10,21);">Php 3:10, 21</a>); while suschematizo, "fashioned according to" (<a onClick="return mV(\'Rom\',12,21);">Ro 12:21</a> the Revised Version (British and American), the King James Version, "conformed"), refers to that which is external.``1';
