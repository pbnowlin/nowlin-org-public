isbe = [];

isbe[2201]='Color; Colors`kul\'-er, kul\'-erz: The word translated "color" in the King James Version is \'ayin, which literally means "eye" or "appearance," and has been so translated in the Revised Version (British and American). In the New Testament the Greek prophasis, has the meaning of pretense or show (<a onClick="return mV(\'Act\',27,30);">Ac 27:30</a>; compare <a onClick="return mV(\'Rev\',17,4);">Re 17:4</a> the King James Version). The references to Joseph\'s coat of many colors (<a onClick="return mV(\'Gen\',37,3,13,32);">Ge 37:3, 13, 32</a>) and "garments of divers colors" (<a onClick="return mV(\'2Sa\',13,18,19);">2Sa 13:18-19</a>) probably do not mean the color of the garment at all, but the form, as suggested in the American Revised Version, margin, "a long garment with sleeves." In <a onClick="return mV(\'Jdg\',5,30);">Jud 5:30</a> the word for "dip" or "dye" appears in the original and has been so translated in the American Standard Revised Version. (see <a href="./study/isbe/search.html?string=DYE">DYE</a>). In <a onClick="return mV(\'1Ch\',29,2);">1Ch 29:2</a> riqmah, meaning "variegated," hence, "varicolored," is found. In <a onClick="return mV(\'Isa\',54,11);">Isa 54:11</a>, pukh is used. This name was applied to the sulfide of antimony (Arabic kochl) used for painting the eyes. Hence, the American Revised Version, margin rendering "antimony" instead of "fair colors" (see <a href="./study/isbe/search.html?string=PAINT">PAINT</a>). In <a onClick="return mV(\'Eze\',16,16);">Eze 16:16</a> Tala\', is found, meaning "covered with pieces" or "spotted," hence, by implication "divers colors."<P>Although the ancient Hebrews had no specific words for "color," "paint" or "painter," still, as we know, they constantly met with displays of the art of coloring among the Babylonians (<a onClick="return mV(\'Eze\',23,14);">Eze 23:14</a>) and Egyptians and the inhabitants of Palestine Pottery, glazed bricks, glassware, tomb walls, sarcophagi, wood and fabrics were submitted to the skill of the colorist. This skill probably consisted in bringing out striking effects by the use of a few primary colors, rather than in any attempt at the blending of shades which characterizes modern coloring. That the gaudy show of their heathen neighbors attracted the children of Israel is shown by such passages as <a onClick="return mV(\'Jdg\',8,27);">Jud 8:27</a>; <a onClick="return mV(\'Eze\',23,12,16);">Eze 23:12, 16</a>.<P>Two reasons may be given for the indefiniteness of many of the Biblical references to color.<P>(1) The origin of the Hebrew people: They had been wandering tribes or slaves with no occasion to develop a color language.<P>(2) Their religious laws: These forbade expression in color or form (<a onClick="return mV(\'Exd\',20,4);">Ex 20:4</a>). Yielding to the attractions of gorgeous display was discouraged by such prophets as Ezekiel, who had sickened of the abominations of the Chaldeans (<a onClick="return mV(\'Eze\',23,14,15,16);">Eze 23:14-16</a>); "And I said unto them, Cast ye away every man the abominations of his eyes" (<a onClick="return mV(\'Eze\',20,7);">Eze 20:7</a>).<P>Indefiniteness of color language is common to oriental literature, ancient and modern. This does not indicate a want of appreciation of color but a failure to analyze and define color effects. The inhabitants of Syria and Palestine today delight in brilliant colors. Bright yellow, crimson, magenta and green are used for adornment with no evident sense of fitness, according to the foreigners\' eyes, other than their correspondence with the glaring brightness of the eastern skies. A soapmaker once told the writer that in order to make his wares attractive to the Arabs he colored them a brilliant crimson or yellow. A peasant chooses without hesitation a flaring magenta or yellow or green zun-nar (girdle), rather than one of somber hues. The oriental student in the chemical or physical laboratory often finds his inability to distinguish or classify color a real obstacle. His closest definition of a color is usually "lightish" or "darkish." This is not due to color blindness but to a lack of education, and extends to lines other than color distinctions. The colloquial language of Palestine today is poor in words denoting color, and an attempt to secure from a native a satisfactory description of some simple color scheme is usually disappointing. The harmonious color effects which have come to us from the Orient have been, in the past, more the result of accident (see <a href="./study/isbe/search.html?string=DYE">DYE</a>) than of deliberate purpose, as witness the clashing of colors where modern artificial dyes have been introduced.<P>This inability of the peoples of Bible lands to define colors is an inheritance from past ages, a consideration which helps us to appreciate the vagueness of many of the Biblical references.<P>The following color words occur in the King James Version or Revised Version:<P>(1) bay,<P>(2) black,<P>(3) blue,<P>(4) brown,<P>(5) crimson,<P>(6) green,<P>(7) grey,<P>(8) hoar,<P>(9) purple,<P>(10) red,<P>(11) scarlet,<P>(12) sorrel,<P>(13) vermilion,<P>(14) white,<P>(15) yellow.<P>In addition there are indefinite words indicating mixtures of light and dark:<P>(a) grisled (grizzled),<P>(b) ringstraked (ringstreaked),<P>(c) speckled,<P>(d) spotted.<hr /><P>(1) Bay or Red:<P>Bay or red is more properly translated "strong" in the Revised Version (British and American).<P>(2) Black (Blackish):<P>Eight different words have been translated "black." They indicate various meanings such as "dusky like the early dawn," "ashen," "swarthy," "moved with passion." Black is applied to hair (<a onClick="return mV(\'Lev\',13,31);">Le 13:31</a>; <a onClick="return mV(\'Sgs\',5,11);">So 5:11</a>; <a onClick="return mV(\'Mat\',5,36);">Mt 5:36</a>); to marble or pavement (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>); to mourning (<a onClick="return mV(\'Job\',30,28,30);">Job 30:28, 30</a>; <a onClick="return mV(\'Jer\',14,2);">Jer 14:2</a>); to passion (<a onClick="return mV(\'Jer\',8,21);">Jer 8:21</a> the King James Version; <a onClick="return mV(\'Lam\',5,10);">La 5:10</a>); to horses (<a onClick="return mV(\'Zec\',6,2,6);">Zec 6:2, 6</a>; <a onClick="return mV(\'Rev\',6,5);">Re 6:5</a>); to the heavens (<a onClick="return mV(\'1Ki\',18,45);">1Ki 18:45</a>; <a onClick="return mV(\'Job\',3,5);">Job 3:5</a>; <a onClick="return mV(\'Pro\',7,9);">Pr 7:9</a> the King James Version; <a onClick="return mV(\'Jer\',4,28);">Jer 4:28</a>; <a onClick="return mV(\'Mic\',3,6);">Mic 3:6</a>); to the sun (<a onClick="return mV(\'Rev\',6,12);">Re 6:12</a>); to the skin (racial) (<a onClick="return mV(\'Sgs\',1,5,6);">So 1:5-6</a>); to flocks (<a onClick="return mV(\'Gen\',30,32,33,35,40);">Ge 30:32-33, 35, 40</a>); to brooks because of ice (<a onClick="return mV(\'Job\',6,16);">Job 6:16</a>).<P>(3) Blue:<P>Blue (tekheleth, a color from the cerulean mussel): This word was applied only to fabrics dyed with a special blue dye obtained from a shellfish. See <a href="./study/isbe/search.html?string=DYE">DYE</a>. shesh in one passage of the King James Version is translated "blue" (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>). It is properly translated in the Revised Version (British and American) "white cloth." "Blueness of a wound" (<a onClick="return mV(\'Pro\',20,30);">Pr 20:30</a>) is correctly rendered in the Revised Version (British and American) "stripes that wound." Blue is applied to the fringes, veil, vestments, embroideries, etc., in the description of the ark and tabernacle (<a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff; <a onClick="return mV(\'Num\',4,6);">Nu 4:6</a>f; <a onClick="return mV(\'Num\',15,38);">15:38</a>); to workers in blue (<a onClick="return mV(\'2Ch\',2,7,14);">2Ch 2:7, 14</a>; <a onClick="return mV(\'2Ch\',3,14);">3:14</a>); to palace adornments (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>); to royal apparel (<a onClick="return mV(\'Est\',8,15);">Es 8:15</a>; <a onClick="return mV(\'Jer\',10,9);">Jer 10:9</a>; <a onClick="return mV(\'Eze\',23,6);">Eze 23:6</a>; <a onClick="return mV(\'Eze\',27,7,24);">27:7, 24</a>).<P>(4) Brown:<P>The Hebrew word meaning "sunburnt" or "swarthy" is translated "black" in the Revised Version (British and American) (<a onClick="return mV(\'Gen\',30,32);">Ge 30:32</a>ff).<P>(5) Crimson:<P>Crimson (karmil): This word is probably of Persian origin and applies to the brilliant dye obtained from a bug. A second word tola\'ath, is also found. Its meaning is the same. See <a href="./study/isbe/search.html?string=DYE">DYE</a>. Crimson is applied to raiment (<a onClick="return mV(\'2Ch\',2,7,14);">2Ch 2:7, 14</a>; <a onClick="return mV(\'2Ch\',3,14);">3:14</a>; <a onClick="return mV(\'Jer\',4,30);">Jer 4:30</a> the King James Version); to sins (<a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>).<P>(6) Green (Greenish):<P>This word in the translation refers almost without exception to vegetation. The Hebrew yaraq, literally, "pale," is considered one of the three definite color words used in the Old Testament (see <a href="./study/isbe/search.html?string=WHITE">WHITE</a>; <a href="./study/isbe/search.html?string=RED">RED</a>). The Greek equivalent is chloros; compare English "chlorine." This word occurs in the following vs: <a onClick="return mV(\'Gen\',1,30);">Ge 1:30</a>; <a onClick="return mV(\'Gen\',9,3);">9:3</a>; <a onClick="return mV(\'Exd\',10,15);">Ex 10:15</a>; <a onClick="return mV(\'Lev\',2,14);">Le 2:14</a> (the King James Version); <a onClick="return mV(\'Lev\',23,14);">23:14</a> (the King James Version); <a onClick="return mV(\'2Ki\',19,26);">2Ki 19:26</a>; <a onClick="return mV(\'Psa\',37,2);">Ps 37:2</a>; <a onClick="return mV(\'Isa\',15,6);">Isa 15:6</a>; <a onClick="return mV(\'Isa\',37,27);">37:27</a>; <a onClick="return mV(\'Job\',39,8);">Job 39:8</a>; chloros, <a onClick="return mV(\'Mar\',6,39);">Mr 6:39</a>; <a onClick="return mV(\'Rev\',8,7);">Re 8:7</a>; <a onClick="return mV(\'Rev\',9,4);">9:4</a>. ra\'anan, closely allied in meaning to yaraq, is used to describe trees in the following passages: <a onClick="return mV(\'Deu\',12,2);">De 12:2</a>; <a onClick="return mV(\'1Ki\',14,23);">1Ki 14:23</a>; <a onClick="return mV(\'2Ki\',16,4);">2Ki 16:4</a>; <a onClick="return mV(\'2Ki\',17,10);">17:10</a>; <a onClick="return mV(\'2Ki\',19,26);">19:26</a>; <a onClick="return mV(\'2Ch\',28,4);">2Ch 28:4</a>; <a onClick="return mV(\'Job\',15,32);">Job 15:32</a>; <a onClick="return mV(\'Psa\',37,35);">Ps 37:35</a>; <a onClick="return mV(\'Psa\',52,8);">52:8</a>; <a onClick="return mV(\'Sgs\',1,16);">So 1:16</a>; <a onClick="return mV(\'Isa\',57,5);">Isa 57:5</a>; <a onClick="return mV(\'Jer\',2,20);">Jer 2:20</a>; <a onClick="return mV(\'Jer\',3,6);">3:6</a>; <a onClick="return mV(\'Jer\',11,16);">11:16</a>; <a onClick="return mV(\'Jer\',17,2,8);">17:2, 8</a>; <a onClick="return mV(\'Eze\',6,13);">Eze 6:13</a>; <a onClick="return mV(\'Hsa\',14,8);">Ho 14:8</a>. In the remaining verses the Hebrew equivalents do not denote color, but the condition of being full of sap, fresh or unripe (compare similar uses in English) (<a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a> (the King James Version); <a onClick="return mV(\'Jdg\',16,7,8);">Jud 16:7-8</a>; <a onClick="return mV(\'Psa\',23,2);">Ps 23:2</a>; <a onClick="return mV(\'Sgs\',2,13);">So 2:13</a>; <a onClick="return mV(\'Job\',8,16);">Job 8:16</a>; <a onClick="return mV(\'Eze\',17,24);">Eze 17:24</a>; <a onClick="return mV(\'Eze\',20,47);">20:47</a>; <a onClick="return mV(\'Luk\',23,31);">Lu 23:31</a>). In <a onClick="return mV(\'Est\',1,6);">Es 1:6</a> the Hebrew word refers to a fiber, probably cotton, as is indicated by the American Revised Version, margin. Greenish is used to describe leprous spots in <a onClick="return mV(\'Lev\',13,49);">Le 13:49</a>; <a onClick="return mV(\'Lev\',14,37);">14:37</a>. The same word is translated "yellow" in <a onClick="return mV(\'Psa\',68,13);">Ps 68:13</a>.<P>(7) Gray:<P>The Hebrew sebhah, means old age, hence, refers also to the color of the hair in old age (<a onClick="return mV(\'Gen\',42,38);">Ge 42:38</a>; <a onClick="return mV(\'Gen\',44,29);">44:29</a>; <a onClick="return mV(\'Gen\',44,31);">44:31</a>; <a onClick="return mV(\'Deu\',32,25);">De 32:25</a>; <a onClick="return mV(\'Psa\',71,18);">Ps 71:18</a>; <a onClick="return mV(\'Hsa\',7,9);">Ho 7:9</a>). See Hoar, next paragraph.<P>(8) Hoar (Hoary):<P>The same word which in other verses is translated "gray" is rendered "hoar" or "hoary," applying to the hair in <a onClick="return mV(\'1Ki\',2,6,9);">1Ki 2:6, 9</a>; <a onClick="return mV(\'Isa\',46,4);">Isa 46:4</a>; <a onClick="return mV(\'Lev\',19,32);">Le 19:32</a>; <a onClick="return mV(\'Job\',41,32);">Job 41:32</a>; <a onClick="return mV(\'Pro\',16,31);">Pr 16:31</a>. Another Hebrew word is translated "hoar" or "hoary," describing "frost" in <a onClick="return mV(\'Exd\',16,14);">Ex 16:14</a>; <a onClick="return mV(\'Job\',38,29);">Job 38:29</a>; <a onClick="return mV(\'Psa\',147,16);">Ps 147:16</a>.<P>(9) Purple:<P>The Hebrew equivalent is \'argaman; Greek porphura. The latter word refers to the source of the dye, namely, a shell-fish found on the shores of the Mediterranean. See <a href="./study/isbe/search.html?string=DYE">DYE</a>. This color, which varied widely according to the kind of shellfish used and the method of dyeing, was utilized in connection with the adornment of the tabernacle (<a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>; <a onClick="return mV(\'Exd\',26,\'1-\');">26</a>; <a onClick="return mV(\'Exd\',27,\'1-\');">27</a>; <a onClick="return mV(\'Exd\',28,\'1-\');">28</a>; <a onClick="return mV(\'Exd\',35,\'1-\');">35</a>; <a onClick="return mV(\'Exd\',36,\'1-\');">36</a>; <a onClick="return mV(\'Exd\',38,\'1-\');">38</a>; <a onClick="return mV(\'Exd\',39,\'1-\');">39</a>; <a onClick="return mV(\'Num\',4,13);">Nu 4:13</a>). There were workers in purple called to assist in beautifying the temple (<a onClick="return mV(\'2Ch\',2,7,14);">2Ch 2:7, 14</a>; <a onClick="return mV(\'2Ch\',3,14);">3:14</a>). Purple was much used for royal raiment and furnishings (<a onClick="return mV(\'Jdg\',8,26);">Jud 8:26</a>; <a onClick="return mV(\'Est\',1,6);">Es 1:6</a>; <a onClick="return mV(\'Est\',8,15);">8:15</a>; <a onClick="return mV(\'Sgs\',3,10);">So 3:10</a>; <a onClick="return mV(\'Mar\',15,17,20);">Mr 15:17, 20</a>; <a onClick="return mV(\'Jhn\',19,2,5);">Joh 19:2, 5</a>). Purple was typical of gorgeous apparel (<a onClick="return mV(\'Pro\',31,22);">Pr 31:22</a>; <a onClick="return mV(\'Jer\',10,9);">Jer 10:9</a>; <a onClick="return mV(\'Sgs\',7,5);">So 7:5</a>; <a onClick="return mV(\'Eze\',27,7,16);">Eze 27:7, 16</a>; <a onClick="return mV(\'Luk\',16,19);">Lu 16:19</a>; <a onClick="return mV(\'Act\',16,14);">Ac 16:14</a>; <a onClick="return mV(\'Rev\',17,4);">Re 17:4</a>; <a onClick="return mV(\'Rev\',18,12,16);">18:12, 16</a>).<P>(10) Red:<P>The Hebrew \'adhom, is from dam, "blood," hence, "bloodlike." This is one of the three distinctive color words mentioned in the Old Testament (see <a href="./study/isbe/search.html?string=GREEN">GREEN</a>; <a href="./study/isbe/search.html?string=WHITE">WHITE</a>), and is found in most of the references to red. Four other words are used:<P>(a) chakhlili, probably "darkened" or "clouded" (<a onClick="return mV(\'Gen\',49,12);">Ge 49:12</a>; <a onClick="return mV(\'Pro\',23,29);">Pr 23:29</a>);<P>(b) chamar, "to ferment" (<a onClick="return mV(\'Psa\',75,8);">Ps 75:8</a> margin; <a onClick="return mV(\'Isa\',27,2);">Isa 27:2</a> the King James Version);<P>(c) bahat, probably "to glisten" (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>);<P>(d) purros "firelike" (<a onClick="return mV(\'Mat\',16,2,3);">Mt 16:2-3</a>; <a onClick="return mV(\'Rev\',6,4);">Re 6:4</a>; <a onClick="return mV(\'Rev\',12,3);">12:3</a>). Red is applied to dyed skins (<a onClick="return mV(\'Exd\',25,5);">Ex 25:5</a>; <a onClick="return mV(\'Exd\',26,14);">26:14</a>; <a onClick="return mV(\'Exd\',35,7,23);">35:7, 23</a>; <a onClick="return mV(\'Exd\',36,19);">36:19</a>; <a onClick="return mV(\'Exd\',39,34);">39:34</a>); to the color of animals (<a onClick="return mV(\'Num\',19,2);">Nu 19:2</a>; <a onClick="return mV(\'Zec\',1,8);">Zec 1:8</a>; <a onClick="return mV(\'Zec\',6,2);">6:2</a>; <a onClick="return mV(\'Rev\',6,4);">Re 6:4</a>; <a onClick="return mV(\'Rev\',12,3);">12:3</a>); to the human skin (<a onClick="return mV(\'Gen\',25,25);">Ge 25:25</a>; ruddy, <a onClick="return mV(\'1Sa\',16,12);">1Sa 16:12</a>; <a onClick="return mV(\'1Sa\',17,42);">17:42</a>; <a onClick="return mV(\'Sgs\',5,10);">So 5:10</a>; <a onClick="return mV(\'Lam\',4,7);">La 4:7</a>); to the eyes (<a onClick="return mV(\'Gen\',49,12);">Ge 49:12</a>; <a onClick="return mV(\'Pro\',23,29);">Pr 23:29</a>); to sores (<a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a>); to wine (<a onClick="return mV(\'Psa\',75,8);">Ps 75:8</a> m; <a onClick="return mV(\'Pro\',23,31);">Pr 23:31</a>; <a onClick="return mV(\'Isa\',27,2);">Isa 27:2</a> the King James Version); to water (<a onClick="return mV(\'2Ki\',3,22);">2Ki 3:22</a>); to pavement (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>); to pottage (<a onClick="return mV(\'Gen\',25,30);">Ge 25:30</a>); to apparel (<a onClick="return mV(\'Isa\',63,2);">Isa 63:2</a>); to the sky (<a onClick="return mV(\'Mat\',16,2,3);">Mt 16:2-3</a>); to sins (<a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>); to a shield (<a onClick="return mV(\'Nah\',2,3);">Na 2:3</a>).<P>(11) Scarlet:<P>Scarlet and crimson colors were probably from the same source (see <a href="./study/isbe/search.html?string=DYE">DYE</a>). tola\'ath, or derivatives have been translated by both "scarlet" and "crimson" (Greek kokkinos). A Chaldaic word for purple has thrice been translated "scarlet" in the King James Version (<a onClick="return mV(\'Dan\',5,7,16,29);">Da 5:7, 16, 29</a>). Scarlet is applied to fabrics or yarn used<P>(a) in the equipment of the tabernacle (<a onClick="return mV(\'Exd\',25,\'1-\');">Ex 25</a>ff; <a onClick="return mV(\'Num\',4,8);">Nu 4:8</a>);<P>(b) in rites in cleansing lepers (<a onClick="return mV(\'Lev\',14,\'1-\');">Le 14</a>); in ceremony of purification (<a onClick="return mV(\'Num\',19,6);">Nu 19:6</a>); to royal or gorgeous apparel (<a onClick="return mV(\'2Sa\',1,24);">2Sa 1:24</a>; <a onClick="return mV(\'Pro\',31,21);">Pr 31:21</a>; <a onClick="return mV(\'Lam\',4,5);">La 4:5</a>; "purple"; <a onClick="return mV(\'Nah\',2,3);">Na 2:3</a>; <a onClick="return mV(\'Mat\',27,28);">Mt 27:28</a>; <a onClick="return mV(\'Rev\',17,4);">Re 17:4</a>; <a onClick="return mV(\'Rev\',18,12,16);">18:12, 16</a>); to marking thread (<a onClick="return mV(\'Gen\',38,28,30);">Ge 38:28, 30</a>; <a onClick="return mV(\'Jos\',2,18,21);">Jos 2:18, 21</a>); to lips (<a onClick="return mV(\'Sgs\',4,3);">So 4:3</a>); to sins (<a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>); to (<a onClick="return mV(\'Rev\',17,3);">Re 17:3</a>); to wool (<a onClick="return mV(\'Hbr\',9,19);">Heb 9:19</a>).<P>(12) Sorrel:<P>This word occurs once in the Revised Version (British and American) (<a onClick="return mV(\'Zec\',1,8);">Zec 1:8</a>).<P>(13) Vermilion:<P>This word, shashar, occurs in two passages (<a onClick="return mV(\'Jer\',22,14);">Jer 22:14</a>; <a onClick="return mV(\'Eze\',23,14);">Eze 23:14</a>). Vermilion of modern arts is a sulfide of mercury. It is not at all improbable that the paint referred to was an oxide of iron. This oxide is still taken from the ground in Syria and Palestine and used for decorative outlining.<P>(14) White:<P>The principal word for denoting whiteness in the Hebrew was labhan, a distinctive color word. Some of the objects to which it was applied show that it Dan was used as we use the word "white" (<a onClick="return mV(\'Gen\',49,12);">Ge 49:12</a>). Mt. Lebanon was probably named because of its snow-tipped peaks (<a onClick="return mV(\'Jer\',18,14);">Jer 18:14</a>). White is applied to goats (<a onClick="return mV(\'Gen\',30,35);">Ge 30:35</a>); to rods (<a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a>); to teeth (<a onClick="return mV(\'Gen\',49,12);">Ge 49:12</a>); to leprous hairs and spots (<a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a>; <a onClick="return mV(\'Num\',12,10);">Nu 12:10</a>); to garments (<a onClick="return mV(\'Ecc\',9,8);">Ec 9:8</a>; <a onClick="return mV(\'Ecc\',7,9);">7:9</a>); as symbol of purity (<a onClick="return mV(\'Dan\',11,35);">Da 11:35</a>; <a onClick="return mV(\'Dan\',12,10);">12:10</a>; <a onClick="return mV(\'Isa\',1,18);">Isa 1:18</a>); to horses (<a onClick="return mV(\'Zec\',1,8);">Zec 1:8</a>; <a onClick="return mV(\'Zec\',6,3,6);">6:3, 6</a>); to tree branches (<a onClick="return mV(\'Joe\',1,7);">Joe 1:7</a>); to coriander seed (<a onClick="return mV(\'Exd\',16,31);">Ex 16:31</a>). The corresponding Greek word, leukos, is used in New Testament. It is applied to hair (<a onClick="return mV(\'Mat\',5,36);">Mt 5:36</a>; <a onClick="return mV(\'Rev\',1,14);">Re 1:14</a>); to raiment (<a onClick="return mV(\'Mat\',17,2);">Mt 17:2</a>; <a onClick="return mV(\'Mat\',28,3);">28:3</a>; <a onClick="return mV(\'Mar\',9,3);">Mr 9:3</a>; <a onClick="return mV(\'Mar\',16,5);">16:5</a>; <a onClick="return mV(\'Luk\',9,29);">Lu 9:29</a>; <a onClick="return mV(\'Jhn\',20,12);">Joh 20:12</a>; <a onClick="return mV(\'Act\',1,10);">Ac 1:10</a>; <a onClick="return mV(\'Rev\',3,4,5,18);">Re 3:4-5, 18</a>; <a onClick="return mV(\'Rev\',6,11);">6:11</a>; <a onClick="return mV(\'Rev\',7,9,13,14);">7:9, 13-14</a>; <a onClick="return mV(\'Rev\',19,14);">19:14</a>); to horses (<a onClick="return mV(\'Rev\',6,2);">Re 6:2</a>; <a onClick="return mV(\'Rev\',19,11,14);">19:11, 14</a>); to a throne (<a onClick="return mV(\'Rev\',20,11);">Re 20:11</a>); to stone (<a onClick="return mV(\'Rev\',2,17);">Re 2:17</a>); to a cloud (<a onClick="return mV(\'Rev\',14,14);">Re 14:14</a>). Besides labhan, four other Hebrew words have been translated "white":<P>(a) chori, or chur, meaning "bleached," applied to bread (<a onClick="return mV(\'Gen\',40,16);">Ge 40:16</a>); to linen (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>; <a onClick="return mV(\'Est\',8,15);">8:15</a>);<P>(b) tsach, or tsachor, literally, "dazzling," is applied to asses (<a onClick="return mV(\'Jdg\',5,10);">Jud 5:10</a>); to human appearance (<a onClick="return mV(\'Sgs\',5,10);">So 5:10</a>); to wool (<a onClick="return mV(\'Eze\',27,18);">Eze 27:18</a>);<P>(c) dar, probably mother of pearl or alabaster (<a onClick="return mV(\'Est\',1,6);">Es 1:6</a>);<P>(d) rir, literally, "saliva," and, from resemblance, "white of egg" (<a onClick="return mV(\'Job\',6,6);">Job 6:6</a>).<P>(15) Yellow:<P>This word occurs in <a onClick="return mV(\'Est\',1,6);">Es 1:6</a> to describe pavement; in <a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a> to describe leprous hair; in <a onClick="return mV(\'Psa\',68,13);">Ps 68:13</a> to describe gold.<P>Mixtures of colors:<P>(a) grizzled (grisled), literally, "spotted as with hail," applied to goats (<a onClick="return mV(\'Gen\',31,10,12);">Ge 31:10, 12</a>); to horses (<a onClick="return mV(\'Zec\',6,3,6);">Zec 6:3, 6</a>);<P>(b) ringstreaked (ringstraked), literally, "striped with bands," applied to animals (<a onClick="return mV(\'Gen\',30,35);">Ge 30:35</a>ff; <a onClick="return mV(\'Gen\',31,8);">31:8</a>ff);<P>(c) speckled, literally, "dotted or spotted," applied to cattle and goats (<a onClick="return mV(\'Gen\',30,32);">Ge 30:32</a>ff; <a onClick="return mV(\'Gen\',31,8);">31:8</a>ff); to a bird (<a onClick="return mV(\'Jer\',12,9);">Jer 12:9</a>); to horses (<a onClick="return mV(\'Zec\',1,8);">Zec 1:8</a> the King James Version);<P>(d) spotted, literally, "covered with patches," applied to cattle and goats (<a onClick="return mV(\'Gen\',30,32);">Ge 30:32</a>ff). In <a onClick="return mV(\'Jud\',1,23);">Jude 1:23</a> "spotted" means "defiled."<P>Figurative: For figurative uses, see under separate colors.<P>LITERATURE.<P>Perrot and Chipiez, History of Art in Ancient Egypt, History of Art in Chaldea and Assyria, History of Art in Phoenicia and its Dependencies; Wilkinson, The Ancient Egyptians; Jewish Encyclopedia; EB; Delitzsch, Iris.``133';
isbe[2202]='Colossae`ko-los\'-e (Kolossai, "punishment"; the King James Version Colosse): A city of Phrygia on the Lycus River, one of the branches of the Meander, and 3 miles from Mt. Cadmus, 8,013 ft. high. It stood at the head of a gorge where the two streams unite, and on the great highway traversing the country from Ephesus to the Euphrates valley, 13 miles from Hierapolis and 10 from Laodicea. Its history is chiefly associated with that of these two cities. Early, according to both Herodotus and Xenophon, it was a place of great importance. There Xerxes stopped 481 BC (Herodotus vii.30) and Cyrus the Younger marched 401 BC (Xen. Anab. i.2,6). From <a onClick="return mV(\'Col\',2,1);">Col 2:1</a> it is not likely that Paul visited the place in person; but its Christianization was due to the efforts of Epaphras and Timothy (<a onClick="return mV(\'Col\',1,1,7);">Col 1:1, 7</a>), and it was the home of Philemon and Epaphras. That a church was established there early is evident from <a onClick="return mV(\'Col\',4,12,13);">Col 4:12-13</a>; <a onClick="return mV(\'Rev\',1,11);">Re 1:11</a>; <a onClick="return mV(\'Rev\',3,14);">3:14</a>. As the neighboring cities, Hierapolis and Laodicea, increased in importance, Colosse declined. There were many Jews living there, and a chief article of commerce, for which the place was renowned, was the collossinus, a peculiar wool, probably of a purple color. In religion the people were specially lax, worshipping angels. Of them, Michael was the chief, and the protecting saint of the city. It is said that once he appeared to the people, saving the city in time of a flood. It was this belief in angels which called forth Paul\'s epistle (<a onClick="return mV(\'Col\',2,18);">Col 2:18</a>). During the 7th and 8th centuries the place was overrun by the Saracens; in the 12th century the church was destroyed by the Turks and the city disappeared. Its site was explored by Mr. Hamilton. The ruins of the church, the stone foundation of a large theater, and a necropolis with stones of a peculiar shape are still to be seen. During the Middle Ages the place bore the name of Chonae; it is now called Chonas.``7';
isbe[2203]='Colossians, Epistle to the`ko-losh\'-ans, ko-los\'-i-anz: This is one of the group of Paul\'s epistles known as the Captivity Epistles (see <a href="./study/isbe/search.html?string=PHILEMON,+EPISTLE+TO">PHILEMON, EPISTLE TO</a>, for a discussion of these as a group).<p>I. Authenticity.<P>1. External Evidence:<P>The external evidence for the Epistle to the Colossians, prior to the middle of the 2nd century, is rather indeterminate. In Ignatius and in Polycarp we have here and there phrases and terminology that suggest an acquaintance with Colossians but not much more (Ignat., Ephes., x.3, and Polyc. x.1; compare with <a onClick="return mV(\'Col\',1,23);">Col 1:23</a>). The phrase in Ep Barnabas, xii, "in him are all things and unto him are all things," may be due to <a onClick="return mV(\'Col\',1,16);">Col 1:16</a>, but it is quite as possibly a liturgical formula. The references in Justin Martyr\'s Dialogue to Christ as the firstborn (prototokos) are very probably suggested by <a onClick="return mV(\'Col\',1,15);">Col 1:15</a>, "the firstborn of all creation" (Dial.,84, 85, 138). The first definite witness is Marcion, who included this epistle in his collection of those written by Paul (Tert., Adv. Marc., v. 19). A little later the Muratorian Fragment mentions Colossians among the Epistles of Paul (10b, l. 21, Colosensis). Irenaeus quotes it frequently and by name (Adv. haer., iii. 14, 1). It is familiar to the writers of the following centuries (e.g. Tert., De praescrip., 7; Clement of Alexandria, Strom., I, 1; Orig., Contra Celsum, v. 8).<P>2. Internal Evidence:<P>The authenticity was not questioned until the second quarter of the 19th century when Mayerhoff claimed on the ground of style, vocabulary, and thought that it was not by the apostle. The Tubingen school claimed, on the basis of a supposed Gnosticism, that the epistle was the work of the 2nd century and so not Pauline. This position has been thoroughly answered by showing that the teaching is essentially different from the Gnosticism of the 2nd century, especially in the conception of Christ as prior to and greater than all things created (see V below). The attack in later years has been chiefly on the ground of vocabulary and style, the doctrinal position, especially the Christology and the teaching about angels, and the relation to the Ephesian epistle. The objection on the ground of vocabulary and style is based, as is so often the case, on the assumption that a man, no matter what he writes about, must use the same words and style. There are thirty-four words in Colossians which are not in any other New Testament book. When one removes those that are due to the difference in subject-matter, the total is no greater than that of some of the acknowledged epistles. The omission of familiar Pauline particles, the use of genitives, of "all" (pas), and of synonyms, find parallels in other epistles, or are due to a difference of subject, or perhaps to the influence on the language of the apostle of his life in Rome (von Soden). The doctrinal position is not at heart contradictory to Paul\'s earlier teaching (compare Godet, Introduction to the New Testament; Paul\'s Epistles, 440f). The Christology is in entire harmony with <a href="./study/isbe/search.html?string=PHILIPPIANS,+THE+EPISTLE+TO+THE">Philippians</a> (which see) which is generally admitted as Pauline, and is only a development of the teaching in 1Co (<a onClick="return mV(\'1Co\',8,8);">8:6</a>; <a onClick="return mV(\'1Co\',15,\'24-28\');">15:24-28</a>), especially in respect of the emphasis laid on "the cosmical activity of the preincarnate Christ." Finally, the form in which Paul puts the Christology is that best calculated to meet the false teaching of the Colossian heretics (compare V below). In recent years H. Holtzmann has advocated that this epistle is an interpolated form of an original Pauline epistle to the Colossians, and the work of the author of the <a href="./study/isbe/search.html?string=EPHESIANS,+EPISTLE+TO+THE">Epistle to the Ephesians</a> (which see). A modification of this theory of interpolation has recently been suggested by J. Weiss (Theologische Literaturzeitung, September 29, 1900). Both these theories are too complicated to stand, and even von Soden, who at first followed Holtzmann, has abandoned the position (von Soden, Einleitung., 12); while Sanday (DB2) has shown how utterly untenable it is. Sober criticism today has come to realize that it is impossible to deny the Pauline authorship of this epistle. This position is strengthened by the close relationship between Colossians and Philemon, of which Renan says: "Paul alone, so it would seem, could have written this little masterpiece" (Abbott, International Critical Commentary, lviii). If <a href="./study/isbe/search.html?string=PHILEMON,+EPISTLE+TO">Philemon</a> (which see) stands as Pauline, as it must, then the authenticity of Colossians is established beyond controversy.<p>II. Place and Date.<P>The Pauline authorship being established, it becomes evident at once that the apostle wrote Colossians along with the other Captivity Epistles, and that it is best dated from Rome (see <a href="./study/isbe/search.html?string=PHILEMON,+EPISTLE+TO">PHILEMON, EPISTLE TO</a>), and during the first captivity. This would be about 58 or, if the later chronology is preferred, 63 or 64.<p>III. Destination.<P>The epistle was written, on the face of it, to the church at <a href="./study/isbe/search.html?string=COLOSSAE">COLOSSAE</a> (which see), a town in the Lycus valley where the gospel had been preached most probably by Epaphras (<a onClick="return mV(\'Col\',1,7);">Col 1:7</a>; <a onClick="return mV(\'Col\',4,12);">4:12</a>), and where Paul was, himself, unknown personally (<a onClick="return mV(\'Col\',1,4,8,9);">Col 1:4, 8-9</a>; <a onClick="return mV(\'Col\',2,1,5);">2:1, 5</a>). From the epistle it is evident that the Colossian Christians were Gentiles (<a onClick="return mV(\'Col\',1,27);">Col 1:27</a>) for whom, as such, the apostle feels a responsibility (<a onClick="return mV(\'Col\',2,1);">Col 2:1</a>ff). He sends to them Tychicus (<a onClick="return mV(\'Col\',4,7);">Col 4:7</a>), who is accompanied by Onesimus, one of their own community (<a onClick="return mV(\'Col\',4,9);">Col 4:9</a>), and urges them to be sure to read another letter which will reach them from Laodicea (<a onClick="return mV(\'Col\',4,16);">Col 4:16</a>).<p>IV. Relation to Other New Testament Writings.<P>Beyond the connection with <a href="./study/isbe/search.html?string=EPHESIANS,+EPISTLE+TO+THE">Ephesians</a> (which see) we need notice only the relation between Colossians and Revelation. In the letter to Laodicea (<a onClick="return mV(\'Rev\',3,\'14-21\');">Re 3:14-21</a>) we have two expressions: "the beginning of the creation of God," and "I will give to him to sit down with me in my throne," in which we have an echo of Colossians which "suggests an acquaintance with and recognition of the earlier apostle\'s teaching on the part of John" (Lightfoot, Colossians, 42, note 5).<p>V. The Purpose.<P>The occasion of the epistle was, we may be sure, the information brought by Epaphras that the church in Colosse was subject to the assault of a body of Judaistic Christians who were seeking to overthrow the faith of the Colossians and weaken their regard for Paul (Zahn). This "heresy," as it is commonly called, has had many explanations. The Tubingen school taught that it was gnostic, and sought to find in the terms the apostle used evidence for the 2nd century composition of the epistle. Pleroma and gnosis ("fullness" and "knowledge") not only do not require this interpretation, but will not admit it. The very heart of Gnosticism, i.e. theory of emanation and the dualistic conception which regards matter as evil, finds no place in Colossians. The use of pleroma in this and the sister epistle, Ephesians, does not imply Gnostic views, whether held by the apostle or by the readers of the letters. The significance in Colossians of this and the other words adopted by Gnosticism in later years is quite distinct from that later meaning. The underlying teaching is equally distinct. The Christ of the Colossians is not the aeon Christ of Gnosticism. In Essenism, on the other hand, Lightfoot and certain Germans seek the origin of this heresy. Essenism has certain affinities with Gnosticism on the one side and Judaism on the other. Two objections are raised against this explanation of the origin of the Colossian heresy. In the first place Essenism, as we know it, is found in the neighborhood of the Dead Sea, and there is no evidence for its establishment in the Lycus valley. In the second place, no references are found in Colossians to certain distinct Essene teachings, e.g. those about marriage, washings, communism, Sabbath rules, etc.<P>The Colossian heresy is due to Judaistic influences on the one hand and to native beliefs and superstitions on the other. The Judaistic elements in this teaching are patent, circumcision (<a onClick="return mV(\'Col\',2,11);">Col 2:11</a>), the Law (<a onClick="return mV(\'Col\',2,14,15);">Col 2:14-15</a>), and special seasons (<a onClick="return mV(\'Col\',2,16);">Col 2:16</a>). But there is more than Judaism in this false teaching. Its teachers look to intermediary spirits, angels whom they worship; and insist on a very strict asceticism. To seek the origin of angel worship in Judaism, as is commonly done, is, as A. L. Williams has shown, to miss the real significance of the attitude of the Jews to angels and to magnify the bitter jeers of Celsus. Apart from phrases used in exorcism and magic he shows us that there is no evidence that the Jew ever worshipped angels (JTS, X, 413f). This element in the Colossian heresy was local, finding its antecedent in the worship of the river spirits, and in later years the same tendency gave the impulse to the worship of Michael as the patron saint of Colosse (so too Ramsay, Hastings, Dictionary of the Bible (five volumes), under the word "Colossae"). The danger of and the falsehood in this teaching were twofold. In the first place it brought the gospel under the bands of the Law once more, not now with the formality of the Galatian opponents, but none the less surely. But as the apostle\'s readers are Gentiles (<a onClick="return mV(\'Col\',1,27);">Col 1:27</a>) Paul is not interested in showing the preparatory aspect of the Law. He simply insists to them that they are quite free from all obligations of the Law because Christ, in whom they have been baptized (<a onClick="return mV(\'Col\',2,12);">Col 2:12</a>), has blotted out all the Law (<a onClick="return mV(\'Col\',2,14);">Col 2:14</a>). The second danger is that their belief in and worship of the heavenly powers, false ideas about Christ and the material world, would develop even further than it had. They, because of their union with Him, need fear no angelic being. Christ has triumphed over them all, leading them as it were captives in His train (<a onClick="return mV(\'Col\',2,15);">Col 2:15</a>), as He conquered on the cross. The spiritual powers cease to have any authority over the Christians. It is to set Christ forward, in this way, as Head over all creation as very God, and out of His relation to the church and to the universe to develop the Christian life, that the apostle writes.<p>VI. Argument.<P>The argument of the Epistle is as follows:<P><a onClick="return mV(\'Col\',1,1,2);">Colossians 1:1-2</a>:<P>Salutation.<P><a onClick="return mV(\'Col\',1,\'3-8\');">Colossians 1:3-8</a>:<P>Thanksgiving for their faith in Christ, their love for the saints, their hope laid up in heaven, which they had in and through the gospel and of which he had heard from Epaphras.<P><a onClick="return mV(\'Col\',1,\'9-13\');">Colossians 1:9-13</a>:<P>Prayer that they might be filled with the full knowledge of God\'s will so as to walk worthy of the Lord and to be fruitful in good works, thankful for their inheritance of the kingdom of His Son.<P><a onClick="return mV(\'Col\',1,\'14-23\');">Colossians 1:14-23</a>:<P>Statement of the Son\'s position, from whom we have redemption. He is the very image of God, Creator, pre-existent, the Head of the church, preeminent over all, in whom all the fullness (pleroma) dwells, the Reconciler of all things, as also of the Colossians, through His death, provided they are faithful to the hope of the gospel.<P><a onClick="return mV(\'Col\',1,\'24-\');">Colossians 1:24-2:5</a>:<P>By his suffering he is filling up the sufferings of Christ, of whom he is a minister, even to reveal the great mystery of the ages, that Christ is in them, the Gentiles, the hope of glory, the object of the apostle\'s preaching everywhere. This explains Paul\'s interest in them, and his care for them, that their hearts may be strengthened in the love and knowledge of Christ.<P><a onClick="return mV(\'Col\',2,\'6-\');">Colossians 2:6-3:4</a>:<P>He then passes to exhortation against those who are leading them astray, these false teachers of a vain, deceiving philosophy based on worldly wisdom, who ignore the truth of Christ\'s position, as One in whom all the Divine pleroma dwells, and their relation to Him, united by baptism; raised through the faith; quickened and forgiven; who teach the obligation of the observance of various legal practices, strict asceticisms and angel worship. This exhortation is closed with the appeal that as Christ\'s they will not submit to these regulations of men which are useless, especially in comparison with Christ\'s power through the Resurrection.<P><a onClick="return mV(\'Col\',3,\'5-17\');">Colossians 3:5-17</a>:<P>Practical exhortations follow to real mortification of the flesh with its characteristics, and the substitution of a new life of fellowship, love and peace.<P><a onClick="return mV(\'Col\',3,\'18-\');">Colossians 3:18-4:1</a>:<P>Exhortation to fulfill social obligations, as wives, husbands, children, parents, slaves and masters.<P><a onClick="return mV(\'Col\',4,\'2-6\');">Colossians 4:2-6</a>:<P>Exhortation to devout and watchful prayer.<P><a onClick="return mV(\'Col\',4,\'7-18\');">Colossians 4:7-18</a>:<P>Salutations and greeting.<P>LITERATURE.<P>Lightfoot, Paul\'s Epistles to the Colossians and Philemon; Abbott, Ephesians and Colossians, International Critical Commentary; Peake, Colossians, Expositor\'s Greek Testament; Maclaren, Colossians, Expositor\'s Bible; Alexander, Colossians and Ephesians, Bible for Home and School; Moule, Colossians, Cambridge Bible; Haupt, Meyer\'s Krit. u. Exeg. Kom.; von Soden, Hand-Kom. zum New Testament.``101';
isbe[2204]='Colt; Foal`kolt (\'ayir, ben; polos, huios, with some word such as hupozugiou, understood; huios alone = "son"): The English words "colt" and "foal" are used in the Bible of the ass everywhere except in <a onClick="return mV(\'Gen\',32,15);">Ge 32:15</a>, where the word "colt" is used of the camel in the list of animals destined by Jacob as presents for Esau. In most cases \'ayir (compare Arabic \'air, "ass") means "ass\'s colt," but it may be joined with ben, "son," as in <a onClick="return mV(\'Zec\',9,9);">Zec 9:9</a>, where we have: \'al-chamor we\'al-\'ayir ben-\'athonoth, literally, "on an epi onon kai epi polon huion hupozugiou", "upon an ass, and upon a colt ass, and on an ass\'s colt, the son of the she-asses"; compare <a onClick="return mV(\'Mat\',21,5);">Mt 21:5</a> epi onon kai epi polon huion hupozugiou, "upon an ass, and upon a colt the foal of an ass." In <a onClick="return mV(\'Jhn\',12,15);">Joh 12:15</a> we have epi polon onou, and in the previous verse the diminutive, onarion. The commonest New Testament word for "colt" is polos, akin to which is German Fohle and English "foal" and "filly." The Latin pullus signifies either "foal" or "chicken," and in the latter sense gives rise to French poulet and English "pullet."<P>In view of the fact that horses are but little mentioned in the Bible, and that only in connection with royal equipages and armies, it is not surprising that "colt" does not occur in its ordinary English sense.``37';
isbe[2205]='Come`kum: The translation of many Hebrew and Greek words. In the phrase "The Spirit of Yahweh came mightily upon him" (<a onClick="return mV(\'Jdg\',14,6,19);">Jud 14:6, 19</a>; <a onClick="return mV(\'Jdg\',15,14);">15:14</a>; <a onClick="return mV(\'1Sa\',10,10);">1Sa 10:10</a>; <a onClick="return mV(\'1Sa\',11,6);">11:6</a>; <a onClick="return mV(\'1Sa\',16,13);">16:13</a>), the word is tsaleah; <a onClick="return mV(\'Jdg\',14,6);">Jud 14:6</a>; <a onClick="return mV(\'Jdg\',15,14);">15:14</a> "came mightily," which is the uniform translation of the Revised Version (British and American) (compare <a onClick="return mV(\'Jdg\',13,25);">Jud 13:25</a> "to move," i.e. to disturb or stir up). In <a onClick="return mV(\'Jdg\',6,34);">Jud 6:34</a>; <a onClick="return mV(\'1Ch\',12,18);">1Ch 12:18</a>; <a onClick="return mV(\'2Ch\',24,20);">2Ch 24:20</a>, it is labhesh, "to clothe"; the Revised Version, margin "The Spirit...clothed itself with Gideon" and ...." with Zechariah," "The Spirit clothed Amasai."<P>Among its many changes, the Revised Version (British and American) has "come forth" for "come" (<a onClick="return mV(\'Mat\',2,6);">Mt 2:6</a>); "gone up" for "come" (<a onClick="return mV(\'Mat\',14,32);">Mt 14:32</a>, a different text); "come all the way" for "come" (<a onClick="return mV(\'Jhn\',4,15);">Joh 4:15</a>); "got out upon the" for "come to" (<a onClick="return mV(\'Jhn\',21,9);">Joh 21:9</a>); "draw near" for "come" (<a onClick="return mV(\'Hbr\',4,16);">Heb 4:16</a>); "come" for "come and see" (<a onClick="return mV(\'Rev\',6,\'1-\');">Re 6:1</a>); "secure" for "come by" (<a onClick="return mV(\'Act\',27,16);">Ac 27:16</a>); "attain unto" for "come in" (<a onClick="return mV(\'Eph\',4,13);">Eph 4:13</a>); and "I come" for "I come again" (<a onClick="return mV(\'Jhn\',14,28);">Joh 14:28</a>).``185';
isbe[2206]='Comeliness; Comely`kum\'-li-nes, kum\'-li: Cognate with "becoming," namely, what is suitable, graceful, handsome. The servant of Yahweh in <a onClick="return mV(\'Isa\',53,2);">Isa 53:2</a> is without "comeliness" (hadhar, "honor"), i.e. there is in his appearance nothing attractive, while he is bowed beneath man\'s sin. "Praise is comely" (na\'wah, fem. of na\'weh; <a onClick="return mV(\'Psa\',33,1);">Ps 33:1</a>; <a onClick="return mV(\'Psa\',147,1);">147:1</a>), i.e. suitable or befitting "for the righteous," and, therefore, an honor and glory; "uncomely parts," aschemona (<a onClick="return mV(\'1Cr\',12,23);">1Co 12:23</a>), namely, less honorable. See also <a onClick="return mV(\'1Sa\',16,18);">1Sa 16:18</a>, "a comely person"; <a onClick="return mV(\'Sgs\',6,4);">So 6:4</a>, "comely as Jerusalem." etc.``1';
isbe[2207]='Comfort`kum\'-fert (nacham; parakaleo): The New Testament word is variously translated, as "comfort," "exhort," "beseech," the exact translation to be determined by the context. Etymologically, it is "to call alongside of," i.e. to summon for assistance. To comfort is to cheer and encourage. It has a positive force wanting in its synonym "console," as it indicates the dispelling of grief by the impartation of strength. the Revised Version (British and American) has correctly changed the translation of paramutheomai from the King James Version "comfort," to "consolation." So in the Old Testament, "Comfort ye my people" (<a onClick="return mV(\'Isa\',40,1);">Isa 40:1</a>) is much stronger than "console," which affords only the power of calm endurance of affliction, while the brightest hopes of the future and the highest incentives to present activity are the gifts of the Divine grace that is here bestowed.``84';
isbe[2208]='Comfortably`kum\'-fer-ta-bli (\'al lebh, "to the heart"): "To speak to the heart," i.e. to speak kindly, to console, to comfort, is the ordinary Hebrew expression for wooing: e.g. Boaz spake "to the heart" of Ruth (<a onClick="return mV(\'Rth\',2,13);">Ru 2:13</a> margin; the King James Version "friendly," the Revised Version (British and American) "kindly"). The beauty of the Hebrew term is illustrated in <a onClick="return mV(\'Gen\',50,21);">Ge 50:21</a> where Joseph "spake kindly" unto his brethren, winning them from fear to confidence. Rendered "comfortably" in five passages: thrice of human speaking, and twice of the tenderness of God\'s address to His people. David was urged to win back the hearts of the people by kind words: "speak comfortably" (<a onClick="return mV(\'2Sa\',19,7);">2Sa 19:7</a>). Hezekiah in like manner comforted the Levites (<a onClick="return mV(\'2Ch\',30,22);">2Ch 30:22</a>) and encouraged his captains (<a onClick="return mV(\'2Ch\',32,6);">2Ch 32:6</a>). The term has exceptional wealth of meaning in connection with God\'s message of grace and forgiveness to His redeemed people. The compassionate love that has atoned for their sins speaks to the heart ("comfortably") of Jerusalem, saying "that her iniquity is pardoned" (<a onClick="return mV(\'Isa\',40,2);">Isa 40:2</a>). The same promise of forgiveness is given to the penitent nation by the prophet Hosea (<a onClick="return mV(\'Hsa\',2,14);">Ho 2:14</a>); "comfortable words" (<a onClick="return mV(\'Zec\',1,13);">Zec 1:13</a>), i.e. words affording comfort.``139';
isbe[2209]='Comforter`kum\'-fer-ter: This is translation of the word patakletos, in the Johannine writings. In the Gospel it occurs in <a onClick="return mV(\'Jhn\',14,16,26);">Joh 14:16, 26</a>; <a onClick="return mV(\'Jhn\',15,26);">15:26</a>; <a onClick="return mV(\'Jhn\',16,7);">16:7</a>, and refers to the Holy Spirit. The word means literally, "called to one\'s side" for help. The translation "Comforter" covers only a small part of the meaning as shown in the context. The word "Helper" would be a more adequate translation. The Spirit does a great deal for disciples besides comforting them, although to comfort was a part of His work for them. The Spirit guides into truth; indeed, He is called the Spirit of truth. He teaches and quickens the memory of disciples and glorifies Christ in them. He also has a work to do in the hearts of unbelievers, convicting the world of sin, of righteousness, and of judgment (<a onClick="return mV(\'Jhn\',14,\'1-\');">Joh 14-16</a>). The Comforter remains permanently with disciples after He comes in response to the prayers of Christ. The word parakletos does not occur elsewhere in the Scriptures except in <a onClick="return mV(\'1Jo\',2,1);">1Jo 2:1</a>. In <a onClick="return mV(\'Job\',16,2);">Job 16:2</a> the active form of the word (parakletos is passive) is found in the plural, where Job calls his friends "miserable comforters." The word "Comforter" being an inadequate, and the word "Helper" a too indefinite, translation of the word in the Gospel of John, it would probably be best to transfer the Greek word into English in so far as it relates to the Holy Spirit (see <a href="./study/isbe/search.html?string=PARACLETE">PARACLETE</a>).<P>In <a onClick="return mV(\'1Jo\',2,1);">1Joh 2:1</a> the word parakletos refers to Christ: "If any man sin, we have an Advocate with the Father, Jesus Christ the righteous." Here the translation Advocate is quite correct. As the next verse shows the writer has in mind the intercession of Christ for Christians on the basis of His mediatorial work: "And he is the propitiation for our sins; and not for ours only, but also for the whole world" (<a onClick="return mV(\'1Jo\',2,2);">1Jo 2:2</a>).`<a href="./study/isbe/search.html?string=ADVOCATE">ADVOCATE</a>; <a href="./study/isbe/search.html?string=HOLY+SPIRIT">HOLY SPIRIT</a>; <a href="./study/isbe/search.html?string=PARACLETE">PARACLETE</a>`127';
isbe[2210]='Comfortless`kum\'-fert-les (orphanous, "orphans"): The Greek original is found but twice in the New Testament; rendered "comfortless" in <a onClick="return mV(\'Jhn\',14,18);">Joh 14:18</a>, the Revised Version (British and American) "desolate"; "fatherless" in <a onClick="return mV(\'Jam\',1,27);">Jas 1:27</a> (compare <a onClick="return mV(\'Psa\',68,5);">Ps 68:5</a>). The term signifies bereft of a father, parents, guardian, teacher, guide, and indicates what must be the permanent ministry of the Holy Spirit to the disciples of Jesus, in comforting their hearts. In harmony with these parting words Jesus had called the chosen twelve "little children" (<a onClick="return mV(\'Jhn\',13,33);">Joh 13:33</a>); without Him they would be "orphans," comfortless, desolate. The coming of the Holy Spirit would make Christ and the Father forever real to them, an abiding spiritual presence.``139';
isbe[2211]='Coming of Christ``<a href="./study/isbe/search.html?string=ADVENT">ADVENT</a>; <a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>`1';
isbe[2212]='Coming, Second``<a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>`1';
isbe[2213]='Commandment, the New`nu (entole kaine): The word "commandment" is used in the English versions of the Old Testament to translate several Hebrew words, more especially those meaning "word" (dabhar) as the ten words of God (<a onClick="return mV(\'Exd\',34,28);">Ex 34:28</a>) or king\'s "command" (<a onClick="return mV(\'Est\',1,12);">Es 1:12</a>); "precept" (mitswah) of God (<a onClick="return mV(\'Deu\',4,2);">De 4:2</a>), of a king (<a onClick="return mV(\'2Ki\',18,36);">2Ki 18:36</a>); "mouth" or "speech" (peh) of God (<a onClick="return mV(\'Exd\',17,1);">Ex 17:1</a>), of Pharaoh (<a onClick="return mV(\'2Ki\',23,35);">2Ki 23:35</a>). They express theocratic idea of morality wherein the will or law of God is imposed upon men as their law of conduct (<a onClick="return mV(\'2Ki\',17,37);">2Ki 17:37</a>).<P>1. Christ and the Old Commandment:<P>This idea is not repudiated in the New Testament, but supplemented or modified from within by making love the essence of the command. Jesus Christ, as reported in the Synoptics, came not "to destroy the law or the prophets...but to fulfill" (<a onClick="return mV(\'Mat\',5,17);">Mt 5:17</a>). He taught that "whosoever therefore shall break one of these least commandments, and shall teach men so, shall be called least in the kingdom of heaven" (<a onClick="return mV(\'Mat\',5,19);">Mt 5:19</a>). He condemned the Pharisees for rejecting the commandments of God as given by Moses (<a onClick="return mV(\'Mar\',7,\'8-13\');">Mr 7:8-13</a>). There is a sense in which it is true that Christ propounded no new commandment, but the new thing in His teaching was the emphasis laid on the old commandment of love, and the extent and intent of its application. The great commandment is "Thou shalt love the Lord thy God, ....(and) thy neighbor as thyself. On these two commandments the whole law hangeth, and the prophets" (<a onClick="return mV(\'Mat\',22,\'34-40\');">Mt 22:34-40</a>; <a onClick="return mV(\'Mar\',12,\'28-34\');">Mr 12:28-34</a>; compare <a onClick="return mV(\'Deu\',6,5);">De 6:5</a>; <a onClick="return mV(\'Lev\',19,18);">Le 19:18</a>).<P>2. Principle instead of Law:<P>Whey the law realizes itself as love for God and man in men\'s hearts, it ceases to bear the aspect of a command. The force of authority and the active resistance or inertia of the subject disappear; the law becomes a principle, a motive, a joyous harmony of man\'s will with the will of God; and in becoming internal, it becomes universal and transcends all distinctions of race or class. Even this was not an altogether new idea (compare <a onClick="return mV(\'Jer\',31,\'31-34\');">Jer 31:31-34</a>; <a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a>); nor did Christ\'s contemporaries and disciples think it was.<P>3. Christ\'s Love Fulfilled in Death Becomes the Law of the Church:<P>The revolutionary factor was the death of Christ wherein the love of God was exemplified and made manifest as the basis and principle of all spiritual life (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>). Paul therefore generalizes all pre-Christian morality as a system of law and commandments, standing in antithesis to the grace and love which are through Jesus Christ (<a onClick="return mV(\'Rom\',5,\'1-\');">Ro 5-7</a>). Believers in Christ felt their experience and inward life to be so changed and new, that it needed a new term (agape = "love") to express their ideal of conduct (see <a href="./study/isbe/search.html?string=CHARITY">CHARITY</a>). Another change that grew upon the Christian consciousness, following from the resurrection and ascension of Christ, was the idea that He was the permanent source of the principle of life. "Jesus is Lord" (<a onClick="return mV(\'1Cr\',12,3);">1Co 12:3</a>). Hence, in the Johannine writings the principle described by the new term agape is associated with Christ\'s lordship and solemnly described as His "new commandment." "A new commandment I give unto you, that ye love one another; even as I have loved you, that ye also love one another" (<a onClick="return mV(\'Jhn\',13,34);">Joh 13:34</a>). To the Christians of the end of the 1st century it was already an old commandment which they had from the beginning of the Christian teaching (<a onClick="return mV(\'1Jo\',2,7);">1Jo 2:7</a>; <a onClick="return mV(\'2Jo\',1,5);">2Jo 5</a>); but it was also a new commandment which ever came with new force to men who were passing from the darkness of hatred to the light of love (<a onClick="return mV(\'1Jo\',2,\'8-11\');">1Jo 2:8-11</a>).<P>4. The New Revelation:<P>The term in the Gospel we may owe to the evangelist, but it brings into relief an element in the consciousness of Jesus which the author of the Fourth Gospel had appreciated more fully than the Synoptists. Jesus was aware that He was the bearer of a special message from the Father (<a onClick="return mV(\'Jhn\',12,49);">Joh 12:49</a>; <a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>), that He fulfilled His mission in His death of love and self-sacrifice (<a onClick="return mV(\'Jhn\',10,18);">Joh 10:18</a>), and that the mission fulfilled gave Him authority over the lives of men, "even as I have loved you, that ye also love one another." The full meaning of Christ\'s teaching was only realized when men had experienced and recognized the significance of His death as the cause and principle of right conduct. The Synoptists saw Christ\'s teaching as the development of the prophetic teaching of the Old Testament. Paul and John felt that the love of God in Christ was a new thing:<P>(a) new as a revelation of God in Christ,<P>(b) new as a principle of life in the church, and<P>(c) new as a union of believers with Christ.<p>While it is love, it is also a commandment of Christ, calling forth the joyous obedience of believers.`<a href="./study/isbe/search.html?string=BROTHERLY+LOVE">BROTHERLY LOVE</a>`145';
isbe[2214]='Commandment; Commandments`ko-mand\'-ment (mitswah; entole): The commandments are, first of all, prescriptions, or directions of God, concerning particular matters, which He wanted observed with reference to circumstances as they arose, in a period when He spake immediately and with greater frequency than afterward. They were numerous, minute, and regarded as coordinate and independent of each other. In the Ten Commandments, or, more properly, Ten Words, EVm (debharim), they are reduced to a few all-comprehensive precepts of permanent validity, upon which every duty required of man is based. Certain prescriptions of temporary force, as those of the ceremonial and forensic laws, are applications of these "Words" to transient circumstances, and, for the time for which they were enacted, demanded perfect and unconditional obedience. The Psalms, and especially <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a>, show that even under the Old Testament, there was a deep spiritual appreciation of these commandments, and the extent to which obedience was deemed a privilege rather than a mere matter of constrained external compliance with duty. In the New Testament, Jesus shows in <a onClick="return mV(\'Mat\',22,37,40);">Mt 22:37, 40</a>; <a onClick="return mV(\'Mar\',12,29,31);">Mr 12:29, 31</a>; <a onClick="return mV(\'Luk\',10,27);">Lu 10:27</a> (compare <a onClick="return mV(\'Rom\',13,8,10);">Ro 13:8, 10</a>) their organic unity. The "Ten" are reduced to two, and these two to one principle, that of love. In love, obedience begins, and works from within outward. Under the New Testament the commandments are kept when they are written upon the heart (<a onClick="return mV(\'Hbr\',10,16);">Heb 10:16</a>). While in the Synoptics they are referred to in a more abstract and distant way, in both the Gospel and the Epistles of John their relation to Jesus is most prominent. They are "my commandments" (<a onClick="return mV(\'Jhn\',14,15,21);">Joh 14:15, 21</a>; <a onClick="return mV(\'Jhn\',15,10,12);">15:10, 12</a>); "my Father\'s" (<a onClick="return mV(\'Jhn\',10,18);">Joh 10:18</a>; <a onClick="return mV(\'Jhn\',15,10);">15:10</a>); or, many times throughout the epp., "his (i.e. Christ\'s) commandments." The new life in Christ enkindles love, and not only makes the commandments the rule of life, but the life itself the free expression of the commandments and of the nature of God, in which the commandments are grounded. Occasionally the word is used in the singular collectively (<a onClick="return mV(\'Exd\',24,12);">Ex 24:12</a>; <a onClick="return mV(\'Psa\',119,96);">Ps 119:96</a>; <a onClick="return mV(\'1Cr\',14,37);">1Co 14:37</a>).`<a href="./study/isbe/search.html?string=TEN+COMMANDMENTS,+THE">TEN COMMANDMENTS, THE</a>`84';
isbe[2215]='Commandments, the Ten``<a href="./study/isbe/search.html?string=COMMANDMENT">COMMANDMENT</a>; <a href="./study/isbe/search.html?string=TEN+COMMANDMENTS">TEN COMMANDMENTS</a>`1';
isbe[2216]='Commend`ko-mend\':<P>(1) For paratithemi (<a onClick="return mV(\'Luk\',23,46);">Lu 23:46</a>), translating the Hebrew paqadh (<a onClick="return mV(\'Psa\',31,5);">Ps 31:5</a>), in the dying words of Jesus: "Into thy hands I commend my Spirit." the King James Version in Psalms has the more general word "commit." The use of the Greek word in the sense of "deposit what belongs to one into the hands of another" is not uncommon in the classics. So also the derivatives paratheke (<a onClick="return mV(\'2Ti\',1,12);">2Ti 1:12</a>) and parakatatheke (<a onClick="return mV(\'1Ti\',6,20);">1Ti 6:20</a>; <a onClick="return mV(\'2Ti\',1,14);">2Ti 1:14</a>). See <a href="./study/isbe/search.html?string=DEPOSIT">DEPOSIT</a>. This sense of the English, while slightly archaic, corresponds to the first meaning of the Latin, whence it comes, "to commit for preservation," especially of the dying; to commend children, parents, etc., to the care of others (for examples, see Harper\'s Latin Dictionary).<P>(2) For sunistiemi, "to stand together," and then, by standing together, to establish, prove, exhibit, as "righteousness" and "love of God" (<a onClick="return mV(\'Rom\',3,5);">Ro 3:5</a>; <a onClick="return mV(\'Rom\',5,8);">5:8</a>), and thus to attest (<a onClick="return mV(\'2Cr\',3,1);">2Co 3:1</a>; <a onClick="return mV(\'2Cr\',4,2);">4:2</a>), and, finally, to certify or to recommend a stranger (<a onClick="return mV(\'Rom\',16,1);">Ro 16:1</a>; <a onClick="return mV(\'2Cr\',6,4);">2Co 6:4</a>). The use of paristemi in <a onClick="return mV(\'1Cr\',8,8);">1Co 8:8</a> is equivalent.<P>(3) "To praise," epaineo (<a onClick="return mV(\'Luk\',16,8);">Lu 16:8</a>), and sunistemi in <a onClick="return mV(\'2Cr\',10,12,18);">2Co 10:12, 18</a>; for the Old Testament, Hebrew hillel, in <a onClick="return mV(\'Gen\',12,15);">Ge 12:15</a> the King James Version; <a onClick="return mV(\'Pro\',12,8);">Pr 12:8</a>.``84';
isbe[2217]='Commentaries`kom\'-en-ta-riz:<p><b>I. THE WORD - GENERAL SCOPE</b><p><b>II. DIFFERENCES IN CHARACTER OF COMMENTARIES</b><p><b>III. RANGE OF COMMENTARIES</b><P class="in15">1. Early Commentaries<P class="in30">(1) Origen, etc.<P class="in30">(2) Chrysostom, etc.<P class="in15">2. Scholastic Period<P class="in30">Nicolas de Lyra<P class="in15">3. Reformation and Post-Reformation Periods<P class="in30">(1) Luther and Calvin<P class="in30">(2) Beza, Grotius, etc.<P class="in30">(3) Later Writers<P class="in15">4. 18th Century<P class="in30">(1) Calmer, M. Henry, etc.<P class="in30">(2) Patrick, Lowth, Scott<P class="in30">(3) Gill, Doddridge<P class="in30">(4) Bengel<P class="in15">5. The Modern Period—Its Characteristics<P class="in30">(1) Germany<P class="in60">(a) The Liberal School<P class="in60">(b) Believing Tendency<P class="in90">(i) Conservative<P class="in90">(ii) Critical<P class="in90">(iii) Mediating<P class="in90">(iv) Confessional<P class="in90">(v) Godet (Swiss)<P class="in30">(2) Britain and America<P class="in60">(a) Alford, Eadie<P class="in60">(b) Ellicott and Lightfoot<P class="in60">(c) Westcott<P class="in60">(d) Critical Influences—Broad Church<P class="in90">Stanley and Jowett<P class="in60">(e) General Commentaries (Series)<P class="in15">6. Recent Period<P class="in30">(1) Germany<P class="in30">(2) Britain and America<P><b>LITERATURE</b><hr /><p>I. The Word—General Scope.<P>Etymologically, a commentary (from Latin commentor) denotes jottings, annotations, memoranda, on a given subject, or perhaps on a series of events; hence, its use in the plural as a designation for a narrative or history, as the Commentaries of Caesar. In its application to Scripture, the word designates a work devoted to the explanation, elucidation, illustration, sometimes the homiletic expansion and edifying utilization, of the text of some book or portion of Scripture. The primary function of a good commentary is to furnish an exact interpretation of the meaning of the passage under consideration; it belongs to it also to show the connection of ideas, the steps of argument, the scope and design of the whole, in the writing in question. This can only be successfully accomplished by the help of a knowledge of the original language of the writing, and of the historical setting of the particular passage; by careful study of the context, and of the author\'s general usages of thought and speech; and by comparison of parallel or related texts. Aid may also be obtained from external sources, as a knowledge of the history, archaeology, topography, chronology, manners and customs, of the lands, peoples and times referred to; or, as in Deissmann\'s recent discoveries, from the light thrown on peculiarities of language by papyri or other ancient remains (see his Light from the Ancient East).<p>II. Differences in Character of Commentaries.<P>It is obvious that commentaries will vary greatly in character and value according as they are more scholarly, technical, and critical, entering, e.g. into philological discussions, and tabulating and remarking upon the various views held as to the meaning; or again, more popular, aiming only at bringing out the general sense, and conveying it to the mind of the reader in attractive and edifying form. When the practical motive predominates, and the treatment is greatly enlarged by illustration, application, and the enforcement of lessons, the work loses the character of commentary proper, and partakes more of the character of homily or discourse.<p>III. Range of Commentaries.<P>No book in the world has been made the subject of so much commenting and exposition as the Bible. Theological libraries are full of commentaries of all descriptions and all grades of worth. Some are commentaries on the original Hebrew or Greek texts; some on the English or other versions Modern commentaries are usually accompanied with some measure of introduction to the books commented upon; the more learned works have commonly also some indication of the data for the determination of the textual readings (see <a href="./study/isbe/search.html?string=CRITICISM">CRITICISM</a>; <a href="./study/isbe/search.html?string=CRITICISM+OF+THE+BIBLE">CRITICISM OF THE BIBLE</a>). Few writers are equal to the task of commenting with profit on the Bible as a whole, and, with the growth of knowledge, this task is now seldom attempted. Frequently, however, one writer contributes many valuable works, and sometimes, by cooperation of like-minded scholars, commentaries on the whole Bible are produced. It is manifestly a very slight survey that can be taken in a brief article of the work of commenting, and of the literature to which it has given rise; the attempt can only be made to follow the lines most helpful to those seeking aid from this class of books. On the use and abuse of commentaries by the preacher, C. H. Spurgeon\'s racy remarks in his Commenting and Commentaries may be consulted.<P>1. Early Commentaries:<P>Rabbinical interpretations and paraphrases of the Old Testament may here be left out of account (see next article; also <a href="./study/isbe/search.html?string=TARGUM">TARGUM</a>; <a href="./study/isbe/search.html?string=TALMUD">TALMUD</a>; F. W. Farrar\'s History of Interpretation, Lect II). Commentaries on the New Testament could not begin till the New Testament books themselves were written, and had acquired some degree of authority as sacred writings (see <a href="./study/isbe/search.html?string=BIBLE">BIBLE</a>). The earliest commentaries we hear of are from the heretical circles of the Gnostics. Heracleon, a Valentinian (circa 175 AD), wrote a commentary on the Gospel of John (fragments in Origen), and on parts at least of the Gospel of Luke. Tatian, a disciple of Justin Martyr, about the same time, compiled his Diatessaron, or Harmony of the Four Gospels, on which, at a later time, commentaries were written. Ephraem Syrus (4th century) wrote such a commentary, of which an Armenian translation has now been recovered. The Church Father Hippolytus (beginning of 3rd century), wrote several commentaries on the Old Testament (Exodus, Psalms, Proverbs, Ecclesiastes, Daniel, Zechariah, etc.), and on Matthew, Luke and Revelation.<P>(1) Origen, etc.<P>The strongest impulse, however, to the work of commenting and exposition of Holy Scripture undoubtedly proceeded from the school of Alexandria—especially from Origen (203-254 AD). Clement, Origen\'s predecessor, had written a treatise called Hupotuposeis, or "Outlines," a survey of the contents of Holy Scripture. Origen himself wrote commentaries on all the books of the Old Testament, Ruth, Esther and Ecclesiastes alone excepted, and on most of the books of the New Testament (Mark, 1 and 2 Corinthians, 1 and 2 Peter,1, 2, and 3 John, James, Jude, Revelation excepted). He furnished besides, scholia, or notes on difficult passages, and delivered Homilies, or discourses, the records of which fill three folio volumes. "By his Tetrapla and Hexapla," says Farrar, "he became the founder of all textual criticism; by his Homilies he fixed the type of a popular exposition; his scholia were the earliest specimens of marginal explanations; his commentaries furnished the church with her first continuous exegesis" (op. cit., 188). Unfortunately, the Alexandrian school adopted a principle of allegorical interpretation which led it frequently into the most extravagant fancies. Assuming a threefold sense in Scripture—a literal, a moral, and a spiritual—it gave reins to caprice in foisting imaginary meanings on the simplest historical statements (Farrar, op. cit., 189ff). Some of Origen\'s commentaries, however, are much freer from allegory than others, and all possess high value (compare Lightfoot, Galatians, 217). The later teachers of the Alexandrian school continued the exegetical works of Origen. Pamphilus of Caesarea, the friend of Eusebius, is said to have written Old Testament commentaries.<P>(2) Chrysostom, etc.<P>At the opposite pole from the allegorizing Alexandrian school of interpretation was the Antiochinn, marked by a sober, literal and grammatical style of exegesis. Its reputed founder was Lucian (martyred 311 AD); but its real heads were Diodorus of Tarsus (379-94 AD) and Theodore of Mopsuestia (393- 428 AD); and its most distinguished representative was John Chrysostom (347-407 AD). Chrysostom wrote continuous commentaries on Isaiah (only <a onClick="return mV(\'Isa\',1,\'1-\');">Isa 1-8:10</a> remaining) and on Galatians; but his chief contributions were his Homilies, covering almost the whole of the Old Testament and New Testament. Of these over 600 remain, chiefly on the New Testament. They are unequal in character, those on Acts being reputed the feeblest; others, as those on Matthew, Romans and Corinthians, are splendid examples of expository teaching. Schaff speaks of Chrysostom as "the prince of commentators among the Fathers" (History, Ante-Nicene Per., 816). Thomas Aquinas is reported to have said that he would rather possess Chrysostom\'s homilies on Matthew than be master of all Paris. In the West, Ambrose of Milan (340-97 AD) wrote expositions of Old Testament histories and of Luke (allegorical and typical), and Jerome (346-420 AD) wrote numerous commentaries on Old Testament and New Testament books, largely, however, compilations from others.<P>2. Scholastic Period:<P>The medieval and scholastic period offers little for our purpose. There was diligence in copying manuscripts, and producing catenae of the opinions of the Fathers; in the case of the schoolmen, in building up elaborate systems of theology; but the Scriptures were thrown into the background.<P>Nicolas de Lyra.<P>The 14th century, however, produced one commentator of real eminence—Nicolas de Lyra (1270-1340). Nicolas was a Franciscan monk, well versed in Hebrew and rabbinical learning. While recognizing the usual distinctions of the various senses of Scripture, he practically builds on the literal, and exhibits great sobriety and skill in his interpretations. His work, which bears the name Postillae Perpetuae in Universa Biblia, was much esteemed by Luther, who acknowledged his indebtedness to it. Hence, the jest of his opponents, Si Lyra non lyrasset, Lutherus non saltasset (a notice of Lyra may be seen in Farrar, op. cit., 274-78).<P>3. Reformation and Post-Reformation Periods:<P>The Reformation brought men\'s minds back to the Scriptures and opened a new era in Biblical exposition and commentary. It became the custom to expound the Scriptures on Sundays and week-days in all the pulpits of the Protestant churches. "Luther\'s custom was to expound consecutively in a course of sermons the Old and New Testaments" (Kostlin). The Reformation began at Zurich with a series of discourses by Zwingli on the Gospel of Matthew. The same was true of Calvin, Beza, Knox and all associated with them. The production of commentaries or expository homilies was the necessary result.<P>(1) Luther and Calvin.<P>As outstanding examples may be mentioned Luther\'s Commentary on Galatians, and the noble commentaries of Calvin. Not all by any means, but very many of the commentaries of Calvin were the fruit of pulpit prelections (e.g. the expositions of Job, the Minor Prophets, Jeremiah, Daniel). Others, as the commentaries on Romans and the Psalms (reputed his best), were prepared with great care. Calvin\'s supreme excellence as a commentator is disputed by no one. From every school and shade of opinion in Christendom could be produced a chorus of testimony to the remarkable gifts of mind and heart displayed in his expositions of Scripture—to his breadth, moderation, fairness and modernness of spirit, in exhibiting the sense of inward genius of Holy Writ. The testimony of Arminius is as striking as any: "I exhort my pupils to peruse Calvin\'s commentaries...for I affirm that he excels beyond comparison in the interpretation of Scripture, and that his commentaries ought to be more highly valued than all that is handed down to us by the library of the Fathers."<P>(2) Beza, Grotius, etc.<P>Lutheranism had its distinguished exegetes (Brenz, died 1572), who wrote able commentaries on the Old Testament, and in both the Calvinistic and Arminian branches of the Reformed church the production of commentaries held a chief place. Beza, Calvin\'s successor, is acknowledged to have possessed many of the best exegetical qualities which characterized his master. Grotius, in Holland (died 1645), occupies the foremost place among the expositors in this century on the Arminian side. His exegetical works, if not marked by much spirituality, show sagacity and learning, and are enriched by parallels from classical literature. The school of Cocceius (died 1669) developed the doctrine of the covenants, and reveled in typology. Cocceius wrote commentaries on nearly all the books of Scripture. His pupil Vitringa (died 1716) gained renown by his expositions of Isaiah and the Apocalypse.<P>(3) Later writers.<P>Partly fostered by the habit of basing commentary on pulpit exposition, the tendency early set in to undue prolixity in the unfolding of the meaning of Scripture. "In the Lutheran church," says Van Oosterzee, "they began to preach on whole books of the Bible; sometimes in a very prolix manner, as, e.g. in the case of the 220 sermons by one Striegnitz, a preacher at Meissen, on the history of Jonah, of which four are devoted to the consideration of the words \'Unto Jonah\' (Practical Theol., 120). The habit spread. The commentaries of Peter Martyr (Swiss Reformer, died 1562) on Judges and Romans occupy a folio each; N. Byfield (Puritan, died 1622) on Colossians fills a folio; Caryl (Independent, died 1673) on Job extends to 2 folios; Durham (died 1658) on <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> consists of 72 sermons; Venema (Holland, died 1787) on Jeremiah fills 2 quartos, and on the Psalms no less than 6 quartos. These are only samples of a large class. H. Hammond\'s A Paraphrase and Annotations on the New Testament, from an Arminian Standpoint belong to this period (1675). Another work which long took high rank is M. Poole\'s elaborate Synopsis Criticorum Biblicorum (5 volumes, folio, 1669-76)—a summary of the opinions of 150 Biblical critics; with which must be taken his English Annotations on the Holy Bible, only completed up to <a onClick="return mV(\'Isa\',58,\'1-\');">Isa 58</a> at the time of his death (1679). The work was continued by his friends.<P>4. 18th Century:<P>(1) Calmet, M. Henry, etc.<P>The 18th century is marked by greater sobriety in exegesis. It is prolific in commentaries, but only a few attain to high distinction. Calmet (died 1757), a learned Benedictine, on the Roman Catholic side, produced his Commentaire litteral sur tous les livres de l\'Ancien et du Nouveau Testament, in 23 quarto volumes—a work of immense erudition, though now necessarily superseded in its information. On the Protestant side, Matthew Henry\'s celebrated Exposition of the Old and New Testament (1708-10) easily holds the first place among devotional commentaries for its blending of good sense, quaintness, original and felicitous remark, and genuine insight into the meaning of the sacred writers. It is, of course, not a critical work in the modern acceptation, and often is unduly diffuse. M. Henry\'s work extends only to the end of Acts; the remaining books were done by various writers after his death (1714). Le Clerc (died 1736) may be named as precursor of the critical views now obtaining on the composition and authorship of the Pentateuch His commentaries began with Genesis in 1693 and were not Completed till 1731. Other commentators of note of Arminian views were Daniel Whitby (died 1726; converted to Arianism), and, later, Adam Clarke, Wesleyan (1762-1832), whose work extends into the next century. Clarke\'s Commentary on the Holy Scriptures (1810-26), still held by many in high esteem, is marred t
