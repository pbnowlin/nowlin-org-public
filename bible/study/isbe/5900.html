isbe[5956]='Merab`me\'-rab (merabh "increase"; Merob): The elder daughter of Saul (<a onClick="return mV(\'1Sa\',14,49);">1Sa 14:49</a>), promised, though not by name, to the man who should slay the Philistine Goliath (<a onClick="return mV(\'1Sa\',17,25);">1Sa 17:25</a>). David did this and was afterward taken by Saul to court (<a onClick="return mV(\'1Sa\',18,2);">1Sa 18:2</a>), where he was detained in great honor. Merab was not, however, given to him as quickly as the incident would lead one to expect, and the sequel showed some unwillingness on the part of some persons in the contract to complete the promise. The adulation of the crowd who met David on his return from Philistine warfare and gave him a more favorable ascription than to Saul (<a onClick="return mV(\'1Sa\',18,\'6-16\');">1Sa 18:6-16</a>) awoke the angry jealousy of Saul. He "eyed David from that day and forward" (<a onClick="return mV(\'1Sa\',18,9);">1Sa 18:9</a>). Twice David had to "avoid" the "evil spirit" in Saul (<a onClick="return mV(\'1Sa\',18,11);">1Sa 18:11</a>). Saul also feared David (<a onClick="return mV(\'1Sa\',18,12);">1Sa 18:12</a>), and this led him to incite the youth to more dangerous deeds of valor against the Philistines by a renewed promise of Merab. He will have David\'s life, but rather by the hand of the Philistines than his own (<a onClick="return mV(\'1Sa\',18,17);">1Sa 18:17</a>). Merab was to be the bait. But now another element complicated matters—Michal\'s love for David (<a onClick="return mV(\'1Sa\',18,20);">1Sa 18:20</a>), which may have been the retarding factor from the first. At any rate Merab is finally given to Adriel the Meholathite (<a onClick="return mV(\'1Sa\',18,19);">1Sa 18:19</a>). The passage in <a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a> doubtless contains an error—Michal\'s name occurring for that of her sister Merab—though the Septuagint, Josephus, and a consistent Hebrew text all perpetuate it, as well as the concise meaning of the Hebrew word Yaladh, which is a physiological word for bearing children, and cannot be translated "brought up." A Targum explanation reads: "The 5 sons of Merab (which Michal, Saul\'s daughter brought up) which she bare," etc. Another suggestion reads the word "sister" after Michal in the possessive case, leaving the text otherwise as it stands. It is possible that Merab died comparatively young, and that her children were left in the care of their aunt, especially when it is said she herself had none (<a onClick="return mV(\'2Sa\',6,23);">2Sa 6:23</a>). The simplest explanation is to assume a scribal error, with the suggestion referred to as a possible explanation of it. The lonely Michal (<a onClick="return mV(\'2Sa\',6,\'20-23\');">2Sa 6:20-23</a>) became so identified with her (deceased) sister\'s children that they became, in a sense, hers.``186';
isbe[5957]='Meraiah`me-ra\'-ya, me-ri\'-a (merayah, "contumacious"): A priest in the time of Joiakim son of Jeshua, and head of the priestly house of Seraiah to which Ezra belonged (<a onClick="return mV(\'Neh\',12,12);">Ne 12:12</a>; compare <a onClick="return mV(\'Ezr\',7,1);">Ezr 7:1</a>).``1';
isbe[5958]='Meraioth`me-ra\'-yoth, me-ri\'-oth (merayoth): The name varies much in the Greek.<P>(1) A Levite, a descendant of Aaron (<a onClick="return mV(\'1Ch\',6,6);">1Ch 6:6</a>f; <a onClick="return mV(\'Ezr\',7,3);">Ezr 7:3</a>), called "Memeroth" in 1Esdras 8:2; and "Marimoth" in 2Esdras 1:2.<P>(2) The son of Ahitub and father of Zadok (<a onClick="return mV(\'1Ch\',9,11);">1Ch 9:11</a>).<P>(3) A priestly house of which, in the days of Joiakim, Helkai was head (<a onClick="return mV(\'Neh\',12,15);">Ne 12:15</a>). In <a onClick="return mV(\'Neh\',12,3);">Ne 12:3</a> the name is given as "Meremoth."``1';
isbe[5959]='Meran`me\'-ran.`<a href="./study/isbe/search.html?string=MERRAN">MERRAN</a>`1';
isbe[5960]='Merari`me-ra\'-ri (merari, "bitter"; Mararei):<P>(1) The 3rd son of Levi, his brothers, Gershon and Kohath, being always mentioned together with him (<a onClick="return mV(\'Gen\',46,11);">Ge 46:11</a>; <a onClick="return mV(\'Exd\',6,16);">Ex 6:16</a>). He was among those 70 who went down to Egypt with Jacob (<a onClick="return mV(\'Gen\',46,8,11);">Ge 46:8,11</a>; compare <a onClick="return mV(\'Gen\',46,26);">46:26</a> and <a onClick="return mV(\'Exd\',1,5);">Ex 1:5</a>).<P>(2) The family of Merari, descendants of above, and always (with one exception, for which see <a href="./study/isbe/search.html?string=MERARITES">MERARITES</a>) spoken of as "sons of Merari" in numerous references, such as <a onClick="return mV(\'1Ch\',6,1,16,19,29);">1Ch 6:1,16,19,29</a>, which only repeat without additional information the references to be found in the body of this article. We early find them divided into two families, the Mahli and Mushi (<a onClick="return mV(\'Exd\',6,19);">Ex 6:19</a>; <a onClick="return mV(\'Num\',3,17,20,33);">Nu 3:17,20,33</a>). At the exodus they numbered, under their chief Zuriel, 6,200, and they were assigned the north side of the tabernacle as a tenting-place (<a onClick="return mV(\'Num\',3,34,35);">Nu 3:34,35</a>), thus sharing in the honor of those who immediately surrounded the tabernacle—the south side being given to the Kohathites, the west to the Gershonites, and the east—toward the sun-rising—being reserved for Moses, Aaron and his sons (<a onClick="return mV(\'Num\',3,23,29,35,38);">Nu 3:23,29,35,38</a>). To the Merarites was entrusted the care of the boards, bars, pillars, sockets, vessels, pins and cords of the tabernacle (<a onClick="return mV(\'Num\',3,36,37);">Nu 3:36,37</a>; <a onClick="return mV(\'Num\',4,\'29-33\');">4:29-33</a>). They and the Gershonites were "under the hand" of Ithamar, son of Aaron, the sons of Gershon having charge of the softer material of the tabernacles—curtains, covers, hangings, etc. (<a onClick="return mV(\'Num\',3,25,26);">Nu 3:25,26</a>). When reckoned by the number fit for service, i.e. between 30 and 50 years, the sons of Merari were 3,200 strong (<a onClick="return mV(\'Num\',4,\'42-45\');">Nu 4:42-45</a>). Because of the weight of the material in their charge they were allowed 4 wagons and 8 oxen for carriage (<a onClick="return mV(\'Num\',7,8);">Nu 7:8</a>). In marching, when the tabernacle was taken down, the standard of Judah went first (<a onClick="return mV(\'Num\',10,14);">Nu 10:14</a>); then followed the Merarites bearing the tabernacle (<a onClick="return mV(\'Num\',10,17);">Nu 10:17</a>), and after them came the standard of Reuben (<a onClick="return mV(\'Num\',10,18);">Nu 10:18</a>). After the settlement in Canaan they had 12 cities assigned them out of Gad, Reuben and Zebulun (<a onClick="return mV(\'Jos\',21,7);">Jos 21:7</a>,<a onClick="return mV(\'Jos\',21,\'34-40\');">34-40</a>; <a onClick="return mV(\'1Ch\',6,63);">1Ch 6:63</a>,<a onClick="return mV(\'1Ch\',6,\'77-81\');">77-81</a>), just as the other two branches of Levi\'s family had their 12 cities respectively assigned out of the other tribes (<a onClick="return mV(\'Jos\',21,\'1-\');">Jos 21</a>). The names of these Merarite cities are given (loc. cit.), and among them is Ramoth-gilead, one of the cities of refuge (<a onClick="return mV(\'Jos\',21,38);">Jos 21:38</a>). It is evident from <a onClick="return mV(\'1Ch\',6,\'44-47\');">1Ch 6:44-47</a>; <a onClick="return mV(\'1Ch\',16,41);">16:41</a>; <a onClick="return mV(\'1Ch\',25,1,3,6,9,11,15,19,21);">25:1,3,6,9,11,15,19,21</a>f; compare <a onClick="return mV(\'1Ch\',15,6,17,18,19);">15:6,17-19</a> that they had charge under Ethan or Jeduthun of the temple music in the service. In David\'s time Asaiah was their chief (<a onClick="return mV(\'1Ch\',15,6);">1Ch 15:6</a>). Himself and 220 of the family helped David to bring up the Ark. David divided the Levites into courses among the Gershonites, Kohathites and Merarites (<a onClick="return mV(\'1Ch\',23,6);">1Ch 23:6</a>; compare <a onClick="return mV(\'1Ch\',23,21,22,23);">23:21-23</>; <a onClick="return mV(\'1Ch\',24,\'26-30\');">24:26-30</a>). The functions of certain Merarites are described in <a onClick="return mV(\'1Ch\',26,\'10-19\');">1Ch 26:10-19</a>. They also took part in cleansing the temple in Hezekiah\'s time (<a onClick="return mV(\'2Ch\',29,12);">2Ch 29:12</a>) as well as in the days of Josiah (<a onClick="return mV(\'2Ch\',34,12);">2Ch 34:12</a>), helping to repair the house of the Lord. Among the helpers of Ezra, too, we find some of them numbered (<a onClick="return mV(\'Ezr\',8,18,19);">Ezr 8:18,19</a>). The family seems to have played a very important part in keeping steady and true such faithfulness as remained in Israel.<P>(3) The father of Judith (Judith 8:1; 16:7).``186';
isbe[5961]='Merarites`me-ra\'-rits (merari, "bitter"): The descendants of <a href="./study/isbe/search.html?string=MERARI">MERARI</A> (which see), son of Levi. The only place where this form of the word occurs is <a onClick="return mV(\'Num\',26,57);">Nu 26:57</a>. Elsewhere they are always referred to as "sons of Merari."``1';
isbe[5962]='Merathaim`mer-a-tha\'-im (merathayim "double rebellion"): A name used for Babylon in <a onClick="return mV(\'Jer\',50,21);">Jer 50:21</a>. According to Delitzsch it may be equivalent to the Babylonian Marratun, i.e. land by the nar Marratu, "the bitter river" (Persian Gulf) = Southern Babylonia (OHL, under the word).``1';
isbe[5963]='Merchandise`mur\'-chan-diz<P>(1) \'amar<P>(2) cachar,<P>(3) cachar,<P>(4) cechorach,<P>(5) rekhullah,<P>(6) ma\'arabh,<P>(7) markoleth;<P>(8) emporia<P>(9) emporion,<P>(10) gomos):<hr /><p>There seem to be 4 distinct meanings of the word according to the Revised Version (British and American), namely:<p>(1) The products, i.e. goods or things sold or exchanged, and so merchandise in the present-day usage:<P class="in15">(a) cachar is translated thus in <a onClick="return mV(\'Pro\',31,18);">Pr 31:18</a>; <a onClick="return mV(\'Isa\',23,18);">Isa 23:18</a>;<P class="in15">(b) cachar is translated thus in <a onClick="return mV(\'Isa\',45,14);">Isa 45:14</a>; these two are from a root meaning "to travel around as a peddler";<P class="in15">(c) rekhullah, translated thus in <a onClick="return mV(\'Eze\',26,12);">Eze 26:12</a>, from a root meaning "to travel for trading purposes";<P class="in15">(d) ma\'arabh, translated thus in <a onClick="return mV(\'Eze\',27,9,27,33,34);">Eze 27:9,27,33,34</a>, from a root meaning "to intermix, to barter";<P class="in15">(e) markoleth, translated thus in <a onClick="return mV(\'Eze\',27,24);">Eze 27:24</a> (the above 5 Hebrew words are all used to designate the goods or wares which were bartered);<P class="in15">(f) \'amar, occurring in <a onClick="return mV(\'Deu\',21,14);">De 21:14</a>; <a onClick="return mV(\'Deu\',24,7);">24:7</a>, translated in the King James Version "make merchandise of," but in the Revised Version (British and American) "deal with as a slave," or the Revised Version margin "deal with as a chattel";<P class="in15">(g) emporia, translated "merchandise" in <a onClick="return mV(\'Mat\',22,5);">Mt 22:5</a>;<P class="in15">(h) emporion, likewise in <a onClick="return mV(\'Jhn\',2,16);">Joh 2:16</a> (the same Greek word is used in <a onClick="return mV(\'2Pe\',2,3);">2Pe 2:3</a> for the American Standard Revised Version "make merchandise of you");<P class="in15">(i) gomos, "merchandise," margin "cargo."<P>(2) The process of trade itself, i.e. the business: rekhullah has in it the root meaning of "itinerant trading", and so in <a onClick="return mV(\'Eze\',28,16);">Eze 28:16</a> the correct translation is not "merchandise," as in the King James Version, but "traffic," "abundance of thy traffic," i.e. doing a thriving business: "trade was good."<P>(3) The place of trading, i.e. emporium, mart, etc.: cechorah in <a onClick="return mV(\'Eze\',27,15);">Eze 27:15</a> is translated "mart." In <a onClick="return mV(\'Jhn\',2,16);">Joh 2:16</a> reference is made to the "house of merchandise."<P>(4) The profits of trading: In <a onClick="return mV(\'Pro\',3,14);">Pr 3:14</a>, cachar is translated "gaining." Referring to wisdom, "For the gaining of it is better than the gaining of silver, and the profit thereof than fine gold"; the King James Version "merchandise."``142';
isbe[5964]='Merchant; Merchantman`mur\'-chant, mur\'-chant-man.`<a href="./study/isbe/search.html?string=COMMERCE">COMMERCE</a>; <a href="./study/isbe/search.html??string=MERCHANDISE">MERCHANDISE</a>; <a href="./study/isbe/search.html??string=TRADE">TRADE</a>`1';
isbe[5965]='Mercury; Mercurius`mur\'-ku-ri, mer-ku\'ri-us: The translation of Hermes, in <a onClick="return mV(\'Act\',14,12);">Ac 14:12</a>: "They called Barnabas, Jupiter; and Paul, Mercury, because he was the chief speaker." Hermes was the god of eloquence (and also of theft), the attendant, messenger and spokesman of the gods. The more commanding presence of Barnabas (compare <a onClick="return mV(\'2Cr\',10,10);">2Co 10:10</a>) probably caused him to be identified with Zeus (the Roman Jupiter), while his gift of eloquence suggested the identification of Paul with Hermes (the Roman Mercury). The temple of Jupiter was before Lystra, and to him the Lycaonians paid their chief worship. Compare the legend of Baucis and Philemon (Ovid, Metam. viii.611f).`<a href="./study/isbe/search.html?string=HERMES">HERMES</a>; <a href="./study/isbe/search.html??string=JUPITER">JUPITER</a>; <a href="./study/isbe/search.html??string=GREECE,+RELIGION+IN+ANCIENT">GREECE, RELIGION IN ANCIENT</a>`91';
isbe[5966]='Mercy-Seat, the`mur\'-si-set (kapporeth; New Testament hilasterion, <a onClick="return mV(\'Hbr\',9,5);">Heb 9:5</a>): The name for the lid or covering of the ark of the covenant (<a onClick="return mV(\'Exd\',25,17);">Ex 25:17</a>, etc.). The Old Testament term means "covering," then, like the New Testament word, "propitiatory" (compare kipper, "to cover guilt," "to make atonement"). The ark contained the two tables of stone which witnessed against the sin of the people. The blood of sacrifice, sprinkled on the mercy-seat on the great day of atonement, intercepted, as it were, this condemning testimony, and effected reconciliation between God and His people. See <a href="./study/isbe/search.html?string=ATONEMENT">ATONEMENT</a>; <a href="./study/isbe/search.html?string=ATONEMENT,+DAY+OF">ATONEMENT, DAY OF</a>; <a href="./study/isbe/search.html?string=PROPITIATION">PROPITIATION</a>; <a href="./study/isbe/search.html?string=ARK+OF+THE+COVENANT">ARK OF THE COVENANT</a>. In <a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>, Jesus is said to be set forth as "a propitiation (literally, "propitiatory"), through faith, in his blood," thus fulfilling the idea of the mercy-seat (compare <a onClick="return mV(\'Hbr\',9,5,7,11,12);">Heb 9:5,7,11,12</a>, etc.).``17';
isbe[5967]='Mercy; Merciful`mur\'-si, mur\'-si-fool (checedh, racham, chanan; eleos, eleeo, oiktirmos): "Mercy" is a distinctive Bible word characterizing God as revealed to men.<P>In the Old Testament it is most often the translation of checedh, "kindness," "loving-kindness" (see <a href="./study/isbe/search.html?string=LOVINGKINDNESS">LOVINGKINDNESS</a>), but rachamim, literally, "bowels" (the sympathetic region), and chanan, "to be inclined to," "to be gracious," are also frequently translated "mercy"; eleos, "kindness," "beneficence," and eleeo, "to show kindness," are the chief words rendering "mercy" in the New Testament; oiktirmos, "pity," "compassion," occurs a few times, also oiktirmon, "pitiful," eleemon, "kind," "compassionate," twice; hileos, "forgiving," and anileos, "not forgiving," "without mercy," once each (<a onClick="return mV(\'Hbr\',8,12);">Heb 8:12</a>; <a onClick="return mV(\'Jam\',2,13);">Jas 2:13</a>).<P>(1) Mercy is<P class="in15">(a) an essential quality of God (<a onClick="return mV(\'Exd\',34,6,7);">Ex 34:6,7</a>; <a onClick="return mV(\'Deu\',4,31);">De 4:31</a>; <a onClick="return mV(\'Psa\',62,12);">Ps 62:12</a>, etc.); it is His delight (<a onClick="return mV(\'Mic\',7,18,20);">Mic 7:18,20</a>; <a onClick="return mV(\'Psa\',52,8);">Ps 52:8</a>); He is "the Father of mercies" (<a onClick="return mV(\'2Cr\',1,3);">2Co 1:3</a>), "rich in mercy" (<a onClick="return mV(\'Eph\',2,4);">Eph 2:4</a>), "full of pity, and merciful" (<a onClick="return mV(\'Jam\',5,11);">Jas 5:11</a>);<P class="in15">(b) it is associated with forgiveness (<a onClick="return mV(\'Exd\',34,7);">Ex 34:7</a>; <a onClick="return mV(\'Num\',14,18);">Nu 14:18</a>; <a onClick="return mV(\'1Ti\',1,13,16);">1Ti 1:13,16</a>);<P class="in15">(c) with His forbearance (<a onClick="return mV(\'Psa\',145,8);">Ps 145:8</a>, "Yahweh is gracious and merciful, slow to anger and of great lovingkindness"; compare <a onClick="return mV(\'Rom\',2,4);">Roman 2:4</a>; <a onClick="return mV(\'Rom\',11,32);">11:32</a>);<P class="in15">(d) with His covenant (<a onClick="return mV(\'1Ki\',8,23);">1Ki 8:23</a>; <a onClick="return mV(\'Neh\',1,5);">Ne 1:5</a>), with His justice (<a onClick="return mV(\'Psa\',101,1);">Ps 101:1</a>), with His faithfulness (<a onClick="return mV(\'Psa\',89,24);">Ps 89:24</a>), with His truth (<a onClick="return mV(\'Psa\',108,4);">Ps 108:4</a>); mercy and truth are united in <a onClick="return mV(\'Pro\',3,3);">Pr 3:3</a>; <a onClick="return mV(\'Pro\',14,22);">14:22</a>, etc. (in <a onClick="return mV(\'Psa\',85,10);">Ps 85:10</a> we have "Mercy and truth are met together");<P class="in15">(e) it goes forth to all (<a onClick="return mV(\'Psa\',145,9);">Ps 145:9</a>, "Yahweh is good to all; and his tender mercies are over all his works"; compare <a onClick="return mV(\'Psa\',145,16);">145:16</a>, "Thou openest thine hand, and satisfiest the desire of every living thing," the Revised Version margin "satisfiest every living thing with favor");<P class="in15">(f) it shows itself in pitying help (<a onClick="return mV(\'Exd\',3,7);">Ex 3:7</a>; <a onClick="return mV(\'Ezr\',9,9);">Ezr 9:9</a>f), supremely in Christ and His salvation (<a onClick="return mV(\'Luk\',1,50,54,58);">Lu 1:50,54,58</a>; <a onClick="return mV(\'Eph\',2,4);">Eph 2:4</a>);<P class="in15">(g) it is abundant, practically infinite (<a onClick="return mV(\'Psa\',86,5,15);">Ps 86:5,15</a>; <a onClick="return mV(\'Psa\',119,64);">119:64</a>);<P class="in15">(h) it is everlasting (<a onClick="return mV(\'1Ch\',16,34,41);">1Ch 16:34,41</a>; <a onClick="return mV(\'Ezr\',3,11);">Ezr 3:11</a>; <a onClick="return mV(\'Psa\',100,5);">Ps 100:5</a>; <a onClick="return mV(\'Psa\',136,\'1-\');">136</a> repeatedly).<P>(2) "Mercy" is used of man as well as of God, and is required on man\'s part toward man and beast (<a onClick="return mV(\'Deu\',25,4);">De 25:4</a>; <a onClick="return mV(\'Psa\',37,21);">Ps 37:21</a>; <a onClick="return mV(\'Psa\',109,16);">109:16</a>; <a onClick="return mV(\'Pro\',12,10);">Pr 12:10</a>; <a onClick="return mV(\'Dan\',4,27);">Da 4:27</a>; <a onClick="return mV(\'Mic\',6,8);">Mic 6:8</a>; <a onClick="return mV(\'Mat\',5,7);">Mt 5:7</a>, "Blessed are the merciful: for they shall obtain mercy"; <a onClick="return mV(\'Mat\',25,\'31-46\');">25:31-46; <a onClick="return mV(\'Luk\',6,36);">Lu 6:36</a>, "Be ye merciful, even as your Father is merciful"; <a onClick="return mV(\'Luk\',10,30);">Lu 10:30</a>f; the Good Samaritan; <a onClick="return mV(\'Luk\',14,\'12-16\');">Lu 14:12-16</a>; <a onClick="return mV(\'Jam\',3,17);">Jas 3:17</a>).<P>(3) In the New Testament "mercy" (eleos, usually the Septuagint translation of checedh) is associated with "grace" (charis) in the apostolical greetings and elsewhere. Trench points out that the difference between them is that the freeness of God\'s love is the central point of charis, while eleos has in view misery and its relief; charis is His free grace and gift displayed in the forgiveness of sins—extended to men as they are guilty; His eleos (is extended to them) as they are miserable. The lower creation may be the object of His mercy (eleos), but man alone of His grace (charis); he alone needs it and is capable of receiving it (Synonyms of the New Testament, 163f).<P>(4) From all the foregoing it will be seen that mercy in God is not merely His pardon of offenders, but His attitude to man, and to the world generally, from which His pardoning mercy proceeds. The frequency with which mercy is enjoined on men is specially deserving of notice, with the exclusion of the unmerciful from sonship to the all-merciful Father and from the benefits of His mercifulness. Shakespeare\'s question, "How canst thou hope for mercy rendering none?" is fully warranted by our Lord\'s teaching and by Scripture in general; compare especially the parable of the Unmerciful Servant (<a onClick="return mV(\'Mat\',18,\'21-35\');">Mt 18:21-35</a>).<P>(5) As the rule, the American Standard Revised Version has "lovingkindness" for "mercy" when checedh is used of God, and "kindness" when it is used of men in relation to each other. "Compassion" (translation of racham) is also in several instances substituted for "mercy" (<a onClick="return mV(\'Isa\',9,17);">Isa 9:17</a>; <a onClick="return mV(\'Isa\',14,1);">14:1</a>; <a onClick="return mV(\'Isa\',27,11);">27:11</a>; <a onClick="return mV(\'Jer\',13,14);">Jer 13:14</a>; <a onClick="return mV(\'Jer\',30,18);">30:18</a>), also "goodness" (translation of checedh referring to man) (<a onClick="return mV(\'Hsa\',4,1);">Ho 4:1</a>; <a onClick="return mV(\'Hsa\',6,6);">6:6</a>).``185';
isbe[5968]='Mered`me\'-red (meredh, "rebellion"; Septuagint has at least four variants in <a onClick="return mV(\'1Ch\',4,17,18);">1Ch 4:17,18</a>): A descendant of Judah through Caleb, and mentioned as a "son of Ezrah" (<a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>).<P>Revised Version, rightly following the orthography of the Hebrew which has here the Hebrew letter he (h) instead of \'aleph (\'), as in the name of the well-known Ezra, saves us from confusing this Ezrah with the other by giving him the correct terminal letter. Moreover, even if the question of spelling were waived, the absence of the mention of children in any known passages of the life of the scribe Ezra should settle the question, since this passage (<a onClick="return mV(\'1Ch\',4,17);">1Ch 4:17</a>) is associated with progeny.<P>A difficulty meets us in <a onClick="return mV(\'1Ch\',4,18);">1Ch 4:18</a>, where Mered is mentioned as taking to wife "Bithiah the daughter of Pharaoh." That Pharaoh is not the proper name of some individual but the official title of Egypt\'s sovereign seems evident from the fact that the King James Version margin and the Revised Version (British and American) text agree in translating the other wife of Mered as "the Jewess," rather than as a proper name Jehudijah, as if to distinguish the "Jewess" from the Egyptian. Probably "Hodiah" also is a corruption of Jehudijah in <a onClick="return mV(\'1Ch\',4,19);">1Ch 4:19</a>, and should be translated again "the Jewess." Targums and traditions have so changed and transposed and "interpreted" this passage that a sufficiently confused text has become worse confounded, and the only solid fact that emerges is that once a comparatively obscure Judahite (though the founder of several towns—Gedor, Soco, Eshtemoa, etc., <a onClick="return mV(\'1Ch\',4,18);">4:18</a>) married an Egyptian princess, whether as a captive or a freewoman we do not know.`<a href="./study/isbe/search.html?string=BITHIAH">BITHIAH</a>`186';
isbe[5969]='Meremoth`mer\'-e-moth, me-re\'-moth (meremoth, "heights"; Mereimoth):<P>(1) Son of Uriah (<a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>), who was head of the 7th course of priests appointed by David (<a onClick="return mV(\'1Ch\',24,10);">1Ch 24:10</a>, Hakkoz = Koz; compare <a onClick="return mV(\'Neh\',3,4,21);">Ne 3:4,21</a>). The family of Koz were among those unable to prove their pedigree on the return from Babylon, and were therefore deposed as polluted (<a onClick="return mV(\'Ezr\',2,61,62);">Ezr 2:61,62</a>). Meremoth\'s division of the family must, however, have been scatheless, for he is employed in the temple after the return as weigher of the gold and the vessels (<a onClick="return mV(\'Ezr\',8,33);">Ezr 8:33</a>), a function reserved for priests alone (<a onClick="return mV(\'Ezr\',8,\'24-28\');">Ezr 8:24-28</a>). He takes a double part in the reconstruction under Nehemiah, first as a builder of the wall of the city (<a onClick="return mV(\'Neh\',3,4);">Ne 3:4</a>), then as a restorer of that part of the temple abutting on the house of Eliashib the priest (<a onClick="return mV(\'Neh\',3,21);">Ne 3:21</a>); "Marmoth" in 1Esdras 8:62.<P>(2) A member of the house of Bani, and, like so many of that house, among those who married and put away foreign wives (<a onClick="return mV(\'Ezr\',10,36);">Ezr 10:36</a>). He seems to be named Carabasion (!) in the corresponding list of 1Esdras 9:34.<P>(3) The name occurs in <a onClick="return mV(\'Neh\',10,5);">Ne 10:5</a> among those who "seal the covenant" with Nehemiah (<a onClick="return mV(\'Neh\',10,1);">Ne 10:1</a>). It may there be the name of an individual (in which case there were 4 of the name), or it may be a family name. Certainly a "Meremoth" came back under Zerubbabel 100 years before (<a onClick="return mV(\'Neh\',12,3);">Ne 12:3</a>), and the signatory in question may be either a descendant of the same name or a family representative. The name recurs later in the same list (<a onClick="return mV(\'Neh\',12,15);">Ne 12:15</a>) as "Meraioth" through a scribal error confusing the two Hebrew letters yodh (y) and cholem (o) for mem (m). A comparison of <a onClick="return mV(\'Neh\',12,\'1-3\');">Ne 12:1-3</a> and <a onClick="return mV(\'Neh\',12,\'12-15\');">12:12-15</a> shows clearly that it is the same person. Note that in <a onClick="return mV(\'Neh\',12,15);">12:15</A> "Helkai" is the name of the contemporary leader.<P>(4) For Meremoth (1Esdras 8:2 the King James Version).`<a href="./study/isbe/search.html?string=MEMEROTH">MEMEROTH</a>`186';
isbe[5970]='Merib-Baal`mer-ib-ba\'-al (meribhba\'al; also meri-bha\'al, "Baal contends"): The spelling varies in a single verse; <a onClick="return mV(\'1Ch\',9,40);">1Ch 9:40</a> contains the name twice: first, in the first form above; second, in the second form. The name is given also in <a onClick="return mV(\'1Ch\',8,34);">1Ch 8:34</a>. It is the other name of <a href="./study/isbe/search.html?string=MEPHIBOSHETH">MEPHIBOSHETH (2)</a> (which see).<P>In <a onClick="return mV(\'Jer\',11,13);">Jer 11:13</a> and <a onClick="return mV(\'Hsa\',9,10);">Ho 9:10</a> the terms "Baal" and "Bosheth" seem to stand in apposition, the latter form being a slightly contemptuous alternative rendered "shame." This is akin to other like changes, such as Esh-baal for Ish-bosheth, Jerub-besheth for Jerub-baal, etc. The change in the first part of the name could occur through a clerical confusion of the Hebrew aspirate pe (p) and resh (r) in Hebrew.``186';
isbe[5971]='Meribah`mer\'-i-ba, me-re\'-ba.`<a href="./study/isbe/search.html?string=MASSAH+AND+MERIBAH">MASSAH AND MERIBAH</a>`1';
isbe[5972]='Meribath-Kadesh; Meriboth-Kadesh`mer\'-i-bath-ka\'-desh, mer\'-i-both-k (<a onClick="return mV(\'Eze\',48,28);">Eze 48:28</a>; <a onClick="return mV(\'Eze\',47,19);">47:19</a>): The southern limit of Ezekiel\'s ideal land of Israel.`<a href="./study/isbe/search.html?string=MERIBAH">MERIBAH</a>`1';
isbe[5973]='Merodach`me-ro\'-dak, mer\'-o-dak (merodhakh): The supreme deity of the Babylonians (<a onClick="return mV(\'Jer\',50,2);">Jer 50:2</a>); the Nimrod of <a onClick="return mV(\'Gen\',10,\'8-12\');">Ge 10:8-12</a>; and among the constellations, Orion.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>; <a href="./study/isbe/search.html??string=BABYLONIA+AND+ASSYRIA,+RELIGION+OF">BABYLONIA AND ASSYRIA, RELIGION OF</a>; <a href="./study/isbe/search.html??string=NIMROD">NIMROD</a>`1';
isbe[5974]='Merodach-Baladan`me-ro\'-dak-bal\'-a-dan, mer\'-o-dak-b. (mero\'dhakh bal\'adhan; Marodach Baladan): The son of Baladan, is mentioned in <a onClick="return mV(\'Isa\',39,1);">Isa 39:1</a>, as a king of Babylon who sent an embassy to Hezekiah, king of Judah, apparently shortly after the latter\'s illness, in order to congratulate him on his recovery of health, and to make with him an offensive and defensive alliance. This Merodach-baladan was a king of the Chaldeans of the house of Yakin, and was the most dangerous and inveterate foe of Sargon and his son Sennacherib, kings of Assyria, with whom he long and bitterly contested the possession of Babylon and the surrounding provinces. Merodach-Baladan seems to have seized Babylon immediately after the death of Shalmaneser in 721 BC; and it was not till the 12th year of his reign that Sargon succeeded in ousting him. From that time down to the 8th campaign of Sennacherib, Sargon and his son pursued with relentless animosity Merodach-Baladan and his family until at last his son Nabushumishkun was captured and the whole family of Merodach-Baladan was apparently destroyed. According to the monuments, therefore, it was from a worldly point of view good politics for Hezekiah and his western allies to come to an understanding with Merodach-Baladan and the Arameans, Elamites, and others, who were confederated with him. From a strategical point of view, the weakness of the allied powers consisted in the fact that the Arabian desert lay between the eastern and western members of the confederacy, so that the Assyrian kings were able to attack their enemies when they pleased and to defeat them in detail.``196';
isbe[5975]='Merom, Waters of`me\'-rom (me-merom; hudor Marron or hudor Merron): The place which was the scene of Joshua\'s victory over Jabin and his confederates (<a onClick="return mV(\'Jos\',11,7);">Jos 11:7</a>), commonly identified with Lake Huleh in the upper part of the Jordan valley, but with doubtful propriety. Josephus says (Ant., V, i, 18) that the camp of the allies was at Beroth in upper Galilee, and that Beroth was not far from Kadesh, which is upon the summit of the Galilean hills. According to the Scriptural account, the pursuit was to Sidon and Hazor on the west of the mountains (see <a href="./study/isbe/search.html?string=HAZOR">HAZOR</A>), while the names of the confederates are those of places in lower Galilee and the maritime plain. It seems improbable that a force of chariots should be brought over to be hemmed in by the rugged mountains which border the narrow plain of Huleh on both sides, plains that are made still narrower by the swamps surrounding the lake (see <a href="./study/isbe/search.html?string=JORDAN+VALLEY">JORDAN VALLEY</a>) in Joshua\'s time, when they were much larger than they are now after having been filled with the accumulation of sediment brought down by mountain streams for 3,000 years. Conder, with much reason, supposes the "waters of Merom" to be the perennial stream Wady el-Melek, near Shimrom-Merom (Semunieh), 5 miles west of Nazareth. Were Lake Huleh referred to, the proper phrase would be Sea (yam) of Merom, rather than waters (mayim).``198';
isbe[5976]='Meronothite`me-ron\'-thit, me-ro\'-no-thit (meronothi, root meaning "fertility"): The designation of two persons in the Old Testament:<P>(1) Jehdeiah, who was in charge of the royal asses under David (<a onClick="return mV(\'1Ch\',27,30);">1Ch 27:30</a>).<P>(2) Jadon who was among the repairers of the wall under Nehemiah (<a onClick="return mV(\'Neh\',3,7);">Ne 3:7</a>). No place of the name Meronoth can be identified. That Jadon worked on the wall near Gibeonites and Mizpahites affords no clear clue to the place, unless it be shown that there was some geographical rota in the wall repairers.``1';
isbe[5977]='Meroz`me\'-roz (meroz; Codex Vaticanus, Meroz; Codex Alexandrinus, Mazor): This name occurs only once in Scripture. The angel of the Lord is represented as invoking curses upon Meroz because the inhabitants "came not to the help of Yahweh" on the day of Deborah and Barak\'s victory (<a onClick="return mV(\'Jdg\',5,23);">Jud 5:23</a>). It is a strange fate, shared with Chorazin, to be preserved from oblivion only by the record of a curse. The bitterness in the treatment of Meroz, not found in the references to any of the other delinquents, must be due to the special gravity of her offense. Reuben, Gilead and Dan were far away. This, however, is not true of Asher, who was also absent. Perhaps Meroz was near the field of battle and, at some stage of the conflict, within sight and hearing of the strife. If, when Zebulun "jeopardized their lives unto the death, and Naphtali, upon the high places of the field," they turned a deaf ear and a cold heart to the dire straits of their brethren, this might explain the fierce reproaches of Deborah.<P>Meroz may possibly be identified with el-Murussus, a mud-built village about 5 miles northwest of Beisan, on the slopes to the north of the Vale of Jezreel. If the Kedesh where Heber\'s tent was pitched be identical with Qadish to the west of the Sea of Galilee, Sisera\'s flight, avoiding the Israelites in the neighborhood of Mt. Tabor, may have carried him past el-Murussus. If the inhabitants had it in their power to arrest him, but suffered him to escape (Moore, "Judges," ICC, 163), such treachery to the nation\'s cause might well rouse the indignation of the heroic prophetess.``54';
isbe[5978]='Merran`mer\'-an (Merran; the King James Version Meran): Many identifications have been suggested on the assumption that the text as it stands is correct. Some of these are the Sidonian Meareh (Grotius), Marane, a city of which Pliny speaks as being near the Red Sea (Keil), and the desert of Mahrah in Arabia (Fritzsche). It is very probable, however, that the name represents an error in transcription from the original Semitic text, confusing the Hebrew letter daleth ("d") with the Hebrew letter resh ("r"), so that we should read Meddan, or Medan, i.e. Midian. The phrase will then run, "the merchants of Midian and Teman" (Baruch 3:23). The merchants of Midian are referred to in <a onClick="return mV(\'Gen\',37,28);">Ge 37:28</a>.``54';
isbe[5979]='Meruth`me\'-ruth.`<a href="./study/isbe/search.html?string=EMMERUTH">EMMERUTH</a>`1';
isbe[5980]='Mesaloth`mes\'-a-loth (Messaloth, Maisaloth): A place mentioned in the account of the march of Bacchides and Alcimus into Judah, as "in Arbela" (1Macc 9:2). If Arbela be identical with Irbil or Irbid on the southern lip of Wady el-Chamam, west of the Sea of Galilee, this fixes the locality; but no name resembling Mesaloth has been found.``1';
isbe[5981]='Mesech`me\'-sek.`<a href="./study/isbe/search.html?string=MESHECH">MESHECH</a>`1';
isbe[5982]='Mesha`me\'-sha:<P>(1) (mesha\'; Codex Vaticanus, Marisa; Codex Alexandrinus, Marisas): Caleb\'s firstborn son, the father of Ziph, probably the ancestor of the Ziphites (<a onClick="return mV(\'1Ch\',2,42);">1Ch 2:42</a>).<P>(2) (mesha\'; Codex Vaticanus, Misa; Codex Alexandrinus, Mosa): A Benjamite, son of Shaharaim by his wife Hodesh, born in the land of Moab (<a onClick="return mV(\'1Ch\',8,9);">1Ch 8:9</a>).<P>(3) (mesha\'; Mosa): A king of Moab. All the Biblical information regarding this monarch is contained in <a onClick="return mV(\'2Ki\',3,\'1-\');">2Ki 3</a>. Here we gather that Mesha was contemporary with Ahab, Ahaziah and Jehoram. He was tributary to Israel, his annual contribution consisting of 100,000 lambs and 100,000 rams. after the death of Ahab he asserted his independence. Jehoshaphat, king of Judah, and the king of Edom joined forces with Jehoram in an attempt to quell the rebellion at the instance of Elisha, who accompanied the host, water was miraculously provided when the army of the allies was ready to perish of thirst. Mesha came out against them and fell upon the camp. His attack was repulsed with heavy slaughter, and the defeated king was chased by the victors until he took refuge in the great fortress of Kir-hareseth. A vigorous siege was begun. Seeing that his case was desperate, Mesha attempted, with 700 men, to break through the lines. Failing in this, he offered his firstborn as a burnt offering upon the wall. Then "there came great wrath upon Israel" (by which, probably, panic is meant), and the besiegers retired, leaving their conquest incomplete.<P>In his inscription (see <a href="./study/isbe/search.html?string=MOABITE+STONE">MOABITE STONE</a>) Mesha gives an account of his rebellion, naming the places captured and fortified by him. It is not surprising that he says nothing of his defeat by Jehoram and his allies. There is, however, one serious discrepancy. The time Moab was under the supremacy of Israel, during the reign of Omri and half the reign of Ahab, he puts at 40 years. According to Biblical chronology, Omri and Ahab together reigned only 34 years. If, with Mesha, we deduct half the reign of Ahab, the period is reduced to 23 years. It is impossible to add to the length of either reign. So great a difference cannot be explained by the use of round numbers. Why Mesha should wish to increase the time of his people\'s subjection is not clear, unless, indeed, he thought in this way to magnify the glory of their deliverer.<P>In Mesha the sentiment of patriotism was wedded to some measure of military capacity. Judging by his inscription, he was also a deeply religious man according to his lights. Substitute "Yahweh" for "Chemosh," and his phraseology might be that of a pious Hebrew king. The sacrifice of his son is at once the mark of the heathen and an index of the strength of his devotion.<P>(4) (mesha\'; Masse): This appears to mark the western boundary of the land occupied by the descendants of Joktan (<a onClick="return mV(\'Gen\',10,30);">Ge 10:30</a>). No certain identification is possible, but several more or less probable have been suggested: e.g.<P class="in15">(a) The Greek Mesene, on the Persian Gulf, not far from the mouth of the Tigris and the Euphrates;<P class="in15">(b) the Syro-Arabian desert, called Mashu in the Assyrian inscriptions; the name here, however, could hardly cover such a vast tract as this; more probably it denoted a place;<P class="in15">(c) Dillmann would alter the vowels and identify it with Massa\', a branch of the Ishmaelite stock (<a onClick="return mV(\'Gen\',25,14);">Ge 25:14</a>; <a onClick="return mV(\'1Ch\',1,30);">1Ch 1:30</a>). This, however, furnishes no clue to the locality, the territory of that tribe being also unidentified.``54';
isbe[5983]='Meshach`me\'-shak (meshakh): Possibly the Sumerian form of the Babylonian Cil-Asharidu, "the shadow of the prince," just as Shadrach probably means "the servant of Sin," and Abednego the "servant of Ishtar." Meshach was one of the three Hebrew companions of Daniel, whose history is given in the first chapters of the Book of Daniel.`<a href="./study/isbe/search.html?string=SHADRACH">SHADRACH</a>`1';
isbe[5984]='Meshech; Mesech`me\'-shek, me\'-sek (meshekh, "long," "tall"; Mosoch): Son of Japheth (<a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>; <a onClick="return mV(\'1Ch\',1,5);">1Ch 1:5</a>; <a onClick="return mV(\'1Ch\',1,17);">1:17</a> is a scribal error for "Mash"; compare <a onClick="return mV(\'Gen\',10,22,23);">Ge 10:22,23</a>). His descendants and their dwelling-place (probably somewhere in the neighborhood of armenia (Herodotus iii.94)) seem to be regarded in Scripture as synonyms for the barbaric and remote (<a onClick="return mV(\'Psa\',120,5);">Ps 120:5</a>; compare <a onClick="return mV(\'Isa\',66,19);">Isa 66:19</a>, where Meshech should be read instead of "that draw the bow"). It is thought that the "Tibareni and Moschi" of the classical writers refer to the same people. Doubtless they appear in the annals of Assyria as enemies of that country under the names Tabali and Mushki—the latter the descendants of Meshech and the former those of Tubal to whom the term "Tibareni" may refer in the clause above. This juxtaposition of names is in harmony with practically every appearance of the word in Scripture. It is seldom named without some one of the others—Tubal, Javan, Gog and Magog. It is this which forms a good justification for making the suggested change in <a onClick="return mV(\'Isa\',66,19);">Isa 66:19</a>, where Meshech would be in the usual company of Tubal and Javan. Ezekiel mentions them several times, first, as engaged in contributing to the trade of Tyre (Tiras of <a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>?), in "vessels of brass" and—very significantly—slaves; again there is the association of Javan and Tubal with them (<a onClick="return mV(\'Eze\',27,13);">Eze 27:13</a>); second, they are included in his weird picture of the under-world: "them that go down into the pit" (<a onClick="return mV(\'Eze\',32,18,26);">Eze 32:18,26</a>). They are mentioned again with Gog and Magog twice as those against whom the prophet is to "set his face" (<a onClick="return mV(\'Eze\',38,2,3);">Eze 38:2,3</a>; <a onClick="return mV(\'Eze\',39,1);">39:1</a>).``186';
isbe[5985]='Meshelemiah`me-shel-e-mi\'-a (meshelemyah, "Yah repays"): Father of Zechariah, one of the porters of the tabernacle (<a onClick="return mV(\'1Ch\',9,21);">1Ch 9:21</a>; <a onClick="return mV(\'1Ch\',26,1,2,9);">26:1,2,9</a>). In the latter passage Meshelemiah, with a final "-u", is credited with "sons and brethren, valiant men, 18." He is the "Shelemiah" of <a onClick="return mV(\'1Ch\',26,14);">1Ch 26:14</a>, the "Shallum" of <a onClick="return mV(\'1Ch\',9,17,19,31);">1Ch 9:17,19,31</a>, and the "Meshullam" of <a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>.``1';
isbe[5986]='Meshezabel`me-shez\'-a-bel (meshezebhe\'el, "God a deliverer"; the King James Version Meshezabeel, me-shez\'-a-bel):<P>(1) A priest, ancestor of Meshullam, who assisted Nehemiah in rebuilding the wall of Jerusalem (<a onClick="return mV(\'Neh\',3,4);">Ne 3:4</a>).<P>(2) One of the chiefs of the people giving name to the family which sealed the covenant with Nehemiah (<a onClick="return mV(\'Neh\',10,21);">Ne 10:21</a>).<P>(3) A descendant of Judah through Zerah, and father of Pethahiah (<a onClick="return mV(\'Neh\',11,24);">Ne 11:24</a>).``1';
isbe[5987]='Meshillemith`me-shil\'-e-mith (meshillemith, "retribution"): A priest, son of Immer, ancestor, according to <a onClick="return mV(\'1Ch\',9,12);">1Ch 9:12</a>, of Adaiah and Pashhur, and according to <a onClick="return mV(\'Neh\',11,13);">Ne 11:13</a>, of Amashai. In the latter passage this name is spelled <a href="./study/isbe/search.html?string=MESHILLEMOTH">MESHILLEMOTH</a> (which see).``1';
isbe[5988]='Meshillemoth`me-shil\'-e-moth, me-shil\'-e-moth (meshillemoth, "recompense"):<P>(1) An Ephraimite ancestor of Berechiah, chief of the tribe, in the reign of Pekah (<a onClick="return mV(\'2Ch\',28,12);">2Ch 28:12</a>).<P>(2) The "Meshillemith" of <a onClick="return mV(\'Neh\',11,13);">Ne 11:13</a>.``1';
isbe[5989]='Meshobab`me-sho\'-bab (meshobhabh): A Simeonite (<a onClick="return mV(\'1Ch\',4,34);">1Ch 4:34</a>). This name heads the list of those who, for the sake of wider pasturelands, occupied a Hamitic settlement in the neighborhood of Gerar (Mount <a href="./study/isbe/search.html?string=GEDOR">GEDOR</a> (which see)), and a Maonite settlement in Edomite territory (<a onClick="return mV(\'1Ch\',4,\'39-41\');">1Ch 4:39-41</a>). The latter event is dated in the days of Hezekiah (see Curtis, Chronicles, in the place cited.).``1';
isbe[5990]='Meshullam`me-shul\'-am (meshullam, "resigned" or "devoted"; compare Arabic Muslim; Mesollam): An Old Testament name very common in post-exilic times.<P>(1) The grandfather of Shaphan (<a onClick="return mV(\'2Ki\',22,3);">2Ki 22:3</a>).<P>(2) A son of Zerubbabel (<a onClick="return mV(\'1Ch\',3,19);">1Ch 3:19</a>).<P>(3) A Gadite (<a onClick="return mV(\'1Ch\',5,13);">1Ch 5:13</a>).<P>(4) (5) (6) Three Benjamites (<a onClick="return mV(\'1Ch\',8,17);">1Ch 8:17</a>; <a onClick="return mV(\'1Ch\',9,7,8);">9:7,8</a>).<P>(7) The father of Hilkiah (<a onClick="return mV(\'1Ch\',9,11);">1Ch 9:11</a>; <a onClick="return mV(\'Neh\',11,11);">Ne 11:11</a>).<P>(8) A priest, son of Meshillemith (<a onClick="return mV(\'1Ch\',9,12);">1Ch 9:12</a>); the parallel list (<a onClick="return mV(\'Neh\',11,13);">Ne 11:13</a>) omits the name.<P>(9) A Kohathite appointed by Josiah as one of the overseers to direct the repairs of the temple (<a onClick="return mV(\'2Ch\',34,12);">2Ch 34:12</a>).<P>(10) One of the chief men sent by Ezra to procure Levites to go up with him to Jerusalem (<a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>; compare 1Esdras 8:44).<P>(11) A Levite opposed to Ezra\'s regulations anent marriage with foreigners (<a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>; 1Esdras 9:14).<P>(12) One of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,29);">Ezr 10:29</a>; compare 1Esdras 9:30).<P>(13) One of the repairers of the wall (<a onClick="return mV(\'Neh\',3,4,30);">Ne 3:4,30</a>). His daughter was married to Jehohanan, the son of Tobiah the Ammonite (<a onClick="return mV(\'Neh\',6,18);">Ne 6:18</a>).<P>(14) One of the repairers of the Old Gate (<a onClick="return mV(\'Neh\',3,6);">Ne 3:6</a>).<P>(15) A supporter of Ezra at the reading of the Law (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>).<P>(16) One of those who subscribed the Covenant (<a onClick="return mV(\'Neh\',10,20);">Ne 10:20</a>).<P>(17) A priest who subscribed the Covenant (<a onClick="return mV(\'Neh\',10,7);">Ne 10:7</a>).<P>(18) (19) Two priests at the time of the high priest Joiakim (<a onClick="return mV(\'Neh\',12,13,16);">Ne 12:13,16</a>).<P>(20) A porter at the time of the high priest Joiakim (<a onClick="return mV(\'Neh\',12,25);">Ne 12:25</a>).<P>(21) A processionist at the dedication of the wall of Jerusalem (<a onClick="return mV(\'Neh\',12,33);">Ne 12:33</a>).``95';
isbe[5991]='Meshullemeth`me-shul\'-e-meth (meshullemeth): The wife of King Manasseh and mother of Amon (<a onClick="return mV(\'2Ki\',21,19);">2Ki 21:19</a>). She is further designated "daughter of Haruz of Jotbah." This is the earliest instance of the birthplace being added to the designation of the queen mother. The name is properly the feminine of the frequently occurring <a href="./study/isbe/search.html?string=MESHULLAM">MESHULLAM</a> (which see).``1';
isbe[5992]='Mesobaite`me-so\'-ba-it.`<a href="./study/isbe/search.html?string=MEZOBAITE">MEZOBAITE</a>`1';
isbe[5993]='Mesopotamia`mes-o-ta\'-mi-a.`<a href="./study/isbe/search.html?string=SYRIA">SYRIA</a>`1';
isbe[5994]='Mess`mes (mas\'eth): Any dish of food sent (Latin missum; French messe) to the table. It occurs in the Old Testament in <a onClick="return mV(\'Gen\',43,34);">Ge 43:34</a> (twice); <a onClick="return mV(\'2Sa\',11,8);">2Sa 11:8</a> English Versions of the Bible, and in the New Testament in <a onClick="return mV(\'Hbr\',12,16);">Heb 12:16</a>, translating brosis.``1';
isbe[5995]='Messenger`mes\'-en-jer: The regular Hebrew word for "messenger" is mal\'akh, the Greek aggelos. This may be a human messenger or a messenger of God, an angel. The context must decide the right translation. In <a onClick="return mV(\'Hag\',1,13);">Hag 1:13</a> the prophet is called God\'s messenger; <a onClick="return mV(\'Job\',33,23);">Job 33:23</a> changes the King James Version to "angel" (margin "messenger"); and <a onClick="return mV(\'Mal\',3,1);">Mal 3:1</a> margin, suggests "angel" instead of "messenger." <a onClick="return mV(\'Mal\',2,7);">Mal 2:7</a> and <a onClick="return mV(\'Mal\',3,1);">Mal 3:1</a> (twice) have caused a great deal of comment. See <a href="./study/isbe/search.html?string=MALACHI">MALACHI</a>. The Greek apostolos, "apostle," is rendered "messenger" in <a onClick="return mV(\'2Cr\',8,23);">2Co 8:23</a>; <a onClick="return mV(\'Phl\',2,25);">Php 2:25</a>; <a onClick="return mV(\'1Sa\',4,17);">1Sa 4:17</a> translations literally, from Hebrew basar, "to tell good news," "he that brought the tidings." <a onClick="return mV(\'Gen\',50,16);">Ge 50:16</a> reads "message" instead of "messenger."``16';
isbe[5996]='Messiah`me-si\'-a (mashiach; Aramaic meshicha\'; Septuagint Christos, "anointed"; New Testament "Christ"):<P>1. Meaning and Use of the Term<P>2. The Messianic Hope<P><b>I. THE MESSIAH IN THE OLD TESTAMENT</b><P class="in15">1. The Messianic King<P class="in30">(1) Isaiah<P class="in30">(2) Jeremiah and Ezekiel<P class="in30">(3) Later Prophets<P class="in15">2. Prophetic and Priestly Relations<P class="in15">3. Servant of Yahweh<P class="in15">4. Transformation of the Prophetic Hope into the Apocalyptic<P><b>II. THE MESSIAH IN THE PRE-CHRISTIAN AGE</b><P class="in15">1. Post-prophetic Age<P class="in15">2. Maccabean Times<P class="in15">3. Apocalyptic Literature<P><b>III. THE MESSIAH IN THE NEW TESTAMENT</b><P>1. The Jewish Conception<P class="in30">(1) The Messiah as King<P class="in30">(2) His Prophetic Character<P class="in30">(3) The Title "Son of God"<P class="in15">2. Attitude of Jesus to the Messiahship<P class="in15">3. The Christian Transformation<P class="in15">4. New Elements Added<P class="in30">(1) Future Manifestation<P class="in30">(2) Divine Personality<P class="in30">(3) Heavenly Priesthood<P class="in15">5. Fulfillment in Jesus<P><b>LITERATURE</b><hr /><P>1. Meaning and Use of the Term:<P>"Messias" (<a onClick="return mV(\'Jhn\',1,41);">Joh 1:41</a>; <a onClick="return mV(\'Jhn\',4,25);">4:25</a> the King James Version) is a transcription of Messias, the Greek representation of the Aramaic. "Messiah" is thus a modification of the Greek form of the word, according to the Hebrew.<P>The term is used in the Old Testament of kings and priests, who were consecrated to office by the ceremony of anointing. It is applied to the priest only as an adjective—"the anointed priest" (<a onClick="return mV(\'Lev\',4,3,5,16);">Le 4:3,5,16</a>; <a onClick="return mV(\'Lev\',6,22);">6:22 (Hebrew 15)</a>). Its substantive use is restricted to the king; he only is called "the Lord\'s anointed," e.g. Saul (<a onClick="return mV(\'1Sa\',24,6,10);">1Sa 24:6,10 (Hebrew 7,11)</a>, etc.); David (<a onClick="return mV(\'2Sa\',19,21);">2Sa 19:21 (Hebrew 22)</a>; <a onClick="return mV(\'2Sa\',23,1);">2Sa 23:1</a>, "the anointed of the God of Jacob"); Zedekiah (<a onClick="return mV(\'Lam\',4,20);">La 4:20</a>). Similarly in the Psalms the king is designated "mine," "thine," "his anointed." Thus also even Cyrus (<a onClick="return mV(\'Isa\',45,1);">Isa 45:1</a>), as being chosen and commissioned by Yahweh to carry out His purpose with Israel. Some think the singular "mine anointed" in <a onClick="return mV(\'Hab\',3,13);">Hab 3:13</a> denotes the whole people; but the Hebrew text is somewhat obscure, and the reference may be to the king. The plural of the substantive is used of the patriarchs, who are called "mine anointed ones" (<a onClick="return mV(\'Psa\',105,15);">Ps 105:15</a>; <a onClick="return mV(\'1Ch\',16,22);">1Ch 16:22</a>), as being Yahweh\'s chosen, consecrated servants, whose persons were inviolable.<P>It is to be noted that "Messiah" as a special title is never applied in the Old Testament to the unique king of the future, unless perhaps in <a onClick="return mV(\'Dan\',9,25);">Da 9:25</a>f (mashiach naghidh, "Messiah-Prince"), a difficult passage, the interpretation of which is very uncertain. It was the later Jews of the post-prophetic period who, guided by a true instinct, first used the term in a technical sense.<P>2. The Messianic Hope:<P>The Messiah is the instrument by whom God\'s kingdom is to be established in Israel and in the world. The hope of a personal deliverer is thus inseparable from the wider hope that runs through the Old Testament. The Jews were a nation who lived in the future. In this respect they stand alone among the peoples of antiquity. No nation ever cherished such strong expectations of a good time coming, or clung more tenaciously amid defeat and disaster to the certainty of final triumph over all enemies and of entrance upon a state of perfect peace and happiness. The basis of this larger hope is Yahweh\'s covenant with Israel. "I will take you to me for a people, and I will be to you a God" (<a onClick="return mV(\'Exd\',6,7);">Ex 6:7</a>). On the ground of this promise the prophets, while declaring God\'s wrath against His people on account of their sin, looked beyond the Divine chastisements to the final era of perfect salvation and blessedness, which would be ushered in when the nation had returned to Yahweh.<P>The term "Messianic" is used in a double sense to describe the larger hope of a glorious future for the nation, as well as the narrower one of a personal Messiah who is to be the prominent figure in the perfected kingdom. It may be remarked that many writers, both prophetic and apocalyptic, who picture the final consummation, make no allusion whatever to a coming deliverer.<P>This article will treat of the personal Messianic hope as it is found in the Old Testament, in the pre-Christian age, and in the New Testament.<P>I. The Messiah in the Old Testament.<P>1. The Messianic King:<P>The chief element in the conception of the Messiah in the Old Testament is that of the king. Through him as head of the nation Yahweh could most readily work out His saving purposes. But the kingdom of Israel was a theocracy. In earlier times Moses, Joshua, and the judges, who were raised up by Yahweh to guide His people at different crises in their history, did not claim to exercise authority apart from their Divine commission. Nor was the relation of Yahweh to the nation as its real ruler in any way modified by the institution of the monarchy. It was by His Spirit that the king was qualified for the righteous government of the people, and by His power that he would become victorious over all enemies. The passage on which the idea of the Messianic king who would rule in righteousness and attain universal dominion was founded is Nathan\'s oracle to David in <a onClick="return mV(\'2Sa\',7,11);">2Sa 7:11</a>ff. In contrast to Saul, from whom the kingdom had passed away, David would never want a descendant to sit on the throne of Israel. How strong an impression this promise of the perpetuity of his royal house had made on David is seen in his last words (<a onClick="return mV(\'2Sa\',23,\'1-\');">2Sa 23</a>); and to this "everlasting covenant, and sure," the spiritual minds in Israel reverted in all after ages.<P>(1) Isaiah.<P>Isaiah is the first of the prophets to refer to an extraordinary king of the future. Amos (<a onClick="return mV(\'Amo\',9,11);">9:11</A>) foretold the time when the shattered fortunes of Judah would be restored, while Hosea (<a onClick="return mV(\'Hsa\',3,5);">3:5</A>) looked forward to the reunion of the two kingdoms under David\'s line. But it is not till we reach the Assyrian age, when the personality of the king is brought into prominence against the great world-power, that we meet with any mention of a unique personal ruler who would bring special glory to David\'s house.<P>The kings of Syria and Israel having entered into a league to dethrone Ahaz and supplant him by an obscure adventurer, <a onClick="return mV(\'Isa\',7,\'10-17\');">Isaiah 7:10-17</a> announces to the king of Judah that while, by the help of Assyria, he would survive the attack of the confederate kings, Yahweh would, for his disobedience, bring devastation upon his own land through the instrumentality of his ally. But the prophet\'s lofty vision, though limited as in the case of other seers to the horizon of his own time, reaches beyond Judah\'s distress to Judah\'s deliverance. To the spiritual mind of Isaiah the revelation is made of a true king, Immanuel, "God-with-us," who would arise out of the house of David, now so unworthily represented by the profligate Ahaz. While the passage is one of the hardest to interpret in all the Old Testament, perhaps too much has been made by some scholars of the difficulty connected with the word \'almah, "virgin." It is the mysterious personality of the child to which prominence is given in the prophecy. The significance of the name and the pledge of victory it implies, the reference to Immanuel as ruler of the land in <a onClick="return mV(\'Isa\',8,8);">8:8</A> (if the present rendering be correct), as well as the parallelism of the line of thought in the prophecy with that of <a onClick="return mV(\'Isa\',9,\'1-\');">Isa 9</a>, would seem to point to the identity of Immanuel with the Prince of the four names, "Wonderful Counselor, Mighty God, Father of Eternity, Prince of Peace" (<a onClick="return mV(\'Isa\',9,6);">9:6</A> the Revised Version margin). These Divine titles do not necessarily imply that in the mind of the prophet the Messianic king is God in the metaphysical sense—the essence of the Divine nature is not a dogmatic conception in the Old Testament—but only that Yahweh is present in Him in perfect wisdom and power, so that He exercises over His people forever a fatherly and peaceful rule. In confirmation of this interpretation reference may be made to the last of the great trilogy of Isaianic prophecies concerning the Messiah of the house of David (<a onClick="return mV(\'Isa\',11,2);">11:2</A>), where the attributes with which He is endowed by the Spirit are those which qualify for the perfect discharge of royal functions in the kingdom of God.<P>See <a href="./study/isbe/search.html?string=IMMANUEL">IMMANUEL</a>.<P>A similar description of the Messianic king is given by Isaiah\'s younger contemporary Micah (<a onClick="return mV(\'Mic\',5,2);">5:2</a>ff), who emphasizes the humble origin of the extraordinary ruler of the future, who shall spring from the Davidic house, while his reference to her who is to bear him confirms the interpretation which regards the virgin in Isaiah as the mother of the Messiah.<P>(2) Jeremiah and Ezekiel.<P>After the time of Isaiah and Micah the throne of David lost much of its power and influence, and the figure of the ideal king is never again portrayed with the same definiteness and color. Zephaniah, Nahum, and Habakkuk make no reference to him at all. By the great prophets Jeremiah and Ezekiel, however, the hope of a Davidic ruler is kept before the people. While there are passages in both of these writers which refer to a succession of pious rulers, this fact should not dominate our interpretation of other utterances of theirs which seem to point to a particular individual. By Jeremiah the Messiah is called the "righteous Branch" who is to be raised unto David and be called "Yahweh (is) our righteousness," that is, Yahweh as the one making righteous dwells in him (<a onClick="return mV(\'Jer\',23,5);">Jer 23:5</a>f; compare <a onClick="return mV(\'Jer\',30,9);">30:9</a>). In Ezekiel he is alluded to as the coming one "whose right it is" (<a onClick="return mV(\'Eze\',21,27);">21:27</a>), and as Yahweh\'s "servant David" who shall be "prince" or "king" forever over a reunited people (<a onClick="return mV(\'Eze\',34,23);">34:23</a>f; <a onClick="return mV(\'Eze\',37,24);">37:24</a>). It is difficult to resist the impression which the language of Ezekiel makes that it is the ideal Messianic ruler who is here predicted, notwithstanding the fact that afterward, in the prophet\'s vision of the ideal theocracy, not only does the prince play a subordinate part, but provision is made in the constitution for a possible abuse of his authority.<P>(3) Later Prophets.<P>After Ezekiel\'s time, during the remaining years of the exile, the hope of a preeminent king of David\'s house naturally disappears. But it is resuscitated at the restoration when Zerubbabel, a prince of the house of David and the civil head of the restored community, is made by Yahweh of hosts His signet-ring, inseparable from Himself and the symbol of His authority (<a onClick="return mV(\'Hag\',2,23);">Hag 2:23</a>). In the new theocracy, however the figure of the Messianic ruler falls into the background before that of the high priest, who is regarded as the sign of the coming Branch (<a onClick="return mV(\'Zec\',3,8);">Zec 3:8</a>). Still we have the unique prophecy of the author Of <a onClick="return mV(\'Zec\',9,9);">Zec 9:9</a>, who pictures the Messiah as coming not on a splendid charger like a warrior king, but upon the foal of an ass, righteous and victorious, yet lowly and peaceful, strong by the power of God to help and save. There is no mention of the Messianic king in Joel or Malachi; but references in the later, as in the earlier, Psalms to events in the lives of the kings or the history of the kingdom prove that the promise made to David was not forgotten, and point to one who would fulfill it in all its grandeur.<P>2. Prophetic and Priestly Relations:<P>The Messianic king is the central figure in the consummation of the kingdom. It is a royal son of David, not a prophet like unto Moses, or a priest of Aaron\'s line, whose personal features are portrayed in the picture of the future. The promise in <a onClick="return mV(\'Deu\',18,\'15-20\');">De 18:15-20</a>, as the context shows, refers to a succession of true prophets as opposed to the diviners of heathen nations. Though Moses passed away there would always be a prophet raised up by Yahweh to reveal His will to the people, so that they would never need to have recourse to heathen soothsayers. Yet while the prophet is not an ideal figure, being already fully inspired by the Spirit, prophetic functions are to this extent associated with the kingship, that the Messiah is qualified by the Spirit for the discharge of the duties of His royal office and makes known the will of God by His righteous decisions (<a onClick="return mV(\'Isa\',11,\'2-5\');">Isa 11:2-5</a>).<P>It is more difficult to define the relationship of the priesthood to the kingship in the final era. They are brought into connection by Jeremiah (<a onClick="return mV(\'Jer\',30,9,21);">30:9,21</a>) who represents the new "David" as possessing the priestly right of immediate access to Yahweh, while the Levitical priesthood, equally with the Davidic kingship, is assured of perpetuity on the ground of the covenant (<a onClick="return mV(\'Jer\',33,18);">Jer 33:18</a>). But after the restoration, when prominence is given to the high priest in the reconstitution of the kingdom, Joshua becomes the type of the coming "Branch" of the Davidic house (<a onClick="return mV(\'Zec\',3,8);">Zec 3:8</a>), and, according to the usual interpretation, receives the crown—a symbol of the union of the kingly and priestly offices in the Messiah (<a onClick="return mV(\'Zec\',6,11);">Zec 6:11</a>). Many scholars, however, holding that the words "and the counsel of peace shall be between them both" can only refer to two persons, would substitute "Zerubbabel" for "Joshua" in <a onClick="return mV(\'Zec\',6,11);">Zec 6:11</a>, and read in <a onClick="return mV(\'Zec\',6,13);">6:13</a>, "there shall be a priest upon his right hand" (compare the Revised Version (British and American), Septuagint (Septuagint). The prophet\'s meaning would then be that the Messianic high priest would sit beside the Messianic king in the perfected kingdom, both working together as Zerubbabel and Joshua were then doing. There is no doubt, however, that the Messiah is both king and priest in <a onClick="return mV(\'Psa\',110,1);">Ps 110</a>.<P>3. Servant of Yahweh:<P>The bitter experiences of the nation during the exile originated a new conception, Messianic in the deepest sense, the Servant of Yahweh (<a onClick="return mV(\'Zec\',40,\'1-\');">Isa 40—66</a>; chiefly <a onClick="return mV(\'Isa\',41,8);">41:8</a>; <a onClick="return mV(\'Isa\',42,\'1-7\',19);">42:1-7,19</a>f; <a onClick="return mV(\'Isa\',43,8,10);">43:8,10</a>; <a onClick="return mV(\'Isa\',44,1,21);">44:1f; 21</a>; <a onClick="return mV(\'Isa\',49,\'3-6\');">49:3-6</a>; <a onClick="return mV(\'Isa\',50,\'4-9\');">50:4-9</a>; <a onClick="return mV(\'Isa\',52,\'13-\');">52:13</a>—<a onClick="return mV(\'Isa\',53,\'1-\');">53</a>). As to whom the prophet refers in his splendid delineation of this mysterious being, scholars are hopelessly divided. The personification theory—that the Servant represents the ideal Israel, Israel as God meant it to be, as fulfilling its true vocation in the salvation of the world—is held by those who plead for a consistent use of the phrase throughout the prophecy. They regard it as inconceivable that the same title should be applied by the same prophet to two distinct subjects. Others admit that the chief difficulty in the way of this theory is to conceive it, but they maintain that it best explains the use of the title in the chief passages where it occurs. The other theory is that there is an expansion and contraction of the idea in the mind of the prophet. In some passages the title is used to denote the whole nation; in others it is limited to the pious kernel; and at last the conception culminates in an individual, the ideal yet real Israelite of the future, who shall fulfill the mission in which the nation failed.<P>What really divides expositors is the interpretation of <a onClick="return mV(\'Isa\',52,\'13-\');">Isa 52:13</a>—<a onClick="return mV(\'Isa\',53,\'1-\');">53</A>. The question is not whether this passage was fulfilled in Jesus Christ—on this all Christian expositors are agreed—but whether the "Servant" is in the mind of the prophet merely the personification of the godly portion of the nation, or a person yet to come.<P>May not the unity argument be pressed too hard? If the Messiah came to be conceived of as a specific king while the original promise spoke of a dynasty, is it so inconceivable that the title "Servant of Yahweh" should be used in an individual as well as in a collective sense? It is worthy of note, too, that not only in some parts of this prophecy, but all through it, the individuality of the sufferer is made prominent; the collective idea entirely disappears. The contrast is not between a faithful portion and the general body of the people, but between the "Servant" and every single member of the nation. Moreover, whatever objections may be urged against the individual interpretation, this view best explains the doctrine of substitution that runs through the whole passage. Israel was Yahweh\'s elect people, His messenger of salvation to the Gentiles, and its faithful remnant suffered for the sins of the mass; even "Immanuel" shared in the sorrows of His people. But here the "Servant" makes atonement for the sins of individual Israelites; by his death they are justified and by his stripes they are healed. To this great spiritual conception only the prophet of the exile attains.<P>It may be added that in the Suffering Servant, who offers the sacrifice of himself as an expiation for the sins of the people, prophetic activity and kingly honor are associated with the priestly function. After he has been raised from the dead he becomes the great spiritual teacher of the world—by his knowledge of God and salvation which he communicates to others he makes many righteous (<a onClick="return mV(\'Isa\',53,11);">Isa 53:11</a>; compare <a onClick="return mV(\'Isa\',42,1);">42:1</A>ff; <a onClick="return mV(\'Isa\',49,2);">49:2</A>; <a onClick="return mV(\'Isa\',50,4);">50:4</a>); and as a reward for his sufferings he attains to a position of the highest royal splendor (<a onClick="return mV(\'Isa\',52,15);">Isa 52:15 b</a>; <a onClick="return mV(\'Isa\',53,12);">53:12a</a>; compare <a onClick="return mV(\'Isa\',49,7);">49:7</a>).<P>See <a href="./study/isbe/search.html?string=SERVANT+OF+JEHOVAH">SERVANT OF JEHOVAH</a>.<P>4. Transformation of the Prophetic Hope into the Apocalyptic:<P>In the Book of Daniel, written to encourage the Jewish people to steadfastness during the persecution of Antiochus Epiphanes, the Messianic hope of the prophets assumes a new form. Here the apocalyptic idea of the Messiah appears for the first time in Jewish literature. The coming ruler is represented, not as a descendant of the house of David, but as a person in human form and of super-human character, through whom God is to establish His sovereignty upon the earth. In the prophet\'s vision (<a onClick="return mV(\'Dan\',7,13);">Da 7:13</a>f) one "like unto a son of man," kebhar \'enash (not, as in the King James Version, "like the son of man"), comes with the clouds of heaven, and is brought before the ancient of days, and receives an imperishable kingdom, that all peoples should serve him.<P>Scholars are by no means agreed in their interpretation of the prophecy. In support of the view that the "one like unto a son of man" is a symbol for the ideal Israel, appeal is made to the interpretation given of the vision in <a onClick="return mV(\'Dan\',7,18,22,27);">Da 7:18,22,27</a>, according to which dominion is given to "the saints of the Most High." Further, as the four heathen kingdoms are represented by the brute creation, it would be natural for the higher power, which is to take their place, to be symbolized by the human form.<P>But strong reasons may be urged, on the other hand, for the personal Messianic interpretation of the passage. A distinction seems to be made between "one like unto a son of man" and the saints of the Most High in <a onClick="return mV(\'Dan\',7,21);">Da 7:21</a>, the saints being there represented as the object of persecution from the little horn. The scene of the judgment is earth, where the saints already are, and to which the ancient of days and the "one like unto a son of man" descend (<a onClick="return mV(\'Dan\',7,13,22);">7:13,22</A>). And it is in accordance with the interpretation given of the vision in <a onClick="return mV(\'Dan\',7,17);">7:17</A>, where reference is made to the four kings of the bestial kingdoms, that the kingdom of the saints, which is to be established in their place, should also be represented by a royal head.<P>It may be noted that a new idea is suggested by this passage, the pre-existence of the Messiah before His manifestation.<P>II. The Messiah in the Pre-Christian Age.<P>1. Post-prophetic Age:<P>After prophetic inspiration ceased, there was little in the teaching of the scribes, or in the reconstitution of the kingdom under the rule of the high priests, to quicken the ancient hope of the nation. It would appear from the Apocrypha that while the elements of the general expectation were still cherished, the specific hope of a preeminent king of David\'s line had grown very dim in the consciousness of the people. In Ecclesiasticus (47:11) mention is made of a "covenant of kings and a throne of glory in Israel which the Lord gave unto David"; yet even this allusion to the everlasting duration of the Davidic dynasty is more of the nature of a historical statement than the expression of a confident hope.<P>2. Maccabean Times:<P>In the earlier stages of the Maccabean uprising, when the struggle was for religious freedom, the people looked for help to God alone, and would probably have been content to acknowledge the political supremacy of Syria after liberty had been granted them in 162 BC to worship God according to their own law and ceremonial. But the successful effort of the Maccabean leaders in achieving political independence, while it satisfied the aspirations of the people generally "until there should arise a faithful prophet" (1Macc 14:41; compare 2:57), brought religious and national ideals into conflict. The "Pious" (chacidhim), under the new name of Pharisees, now became more than ever devoted to the Law, and repudiated the claim of a Maccabean to be high priest and his subsequent assumption of the royal title, while the Maccabees with their political ambitions took the side of the aristocracy and alienated the people. The national spirit, however, had been stirred into fresh life. Nor did the hope thus quickened lose any of its vitality when, amid the strife of factions and the quarrels of the ruling family, Pompey captured Jerusalem in 63 BC. The fall of the Hasmonean house, even more than its ascendancy, led the nation to set its hope more firmly on God and to look for a deliverer from the house of David.<P>3. Apocalyptic Literature:<P>The national sentiment evoked by the Maccabees finds expression in the Apocalyptic literature of the century and a half before Christ.<P>In the oldest parts of the Sibylline Oracles (3:652-56) there occurs a brief prediction of a king whom God shall send from the sun, who shall "cause the whole earth to cease from wicked war, killing some and exacting faithful oaths from others. And this he will do, not according to his own counsel, but in obedience to the beneficent decrees of God." And in a later part of the same book (3:49) there is an allusion to "a pure king who will wield the scepter over the whole earth forever." It may be the Messiah also who is represented in the earlier part of the Book of Enoch (90:37f) as a glorified man under the symbol of a white bull with great horns, which is feared and worshipped by all the other animals (the rest of the religious community) and into whose likeness they are transformed.<P>But it is in the Psalms of Solomon, which were composed in the Pompeian period and reveal their Pharisaic origin by representing the Hasmoneans as a race of usurpers, that we have depicted in clear outline and glowing colors the portrait of the Davidic king (<a onClick="return mV(\'Psa\',17,18);">Ps 17:18</A>). The author looks for a personal Messiah who, as son of David and king of Israel, will purge Jerusalem of sinners, and gather together a holy people who will all be the "sons of their God." He shall not conquer with earthly weapons, for the Lord Himself is his King; he shall smite the earth with the breath of his mouth; and the heathen of their own accord shall come to see his glory, bringing the wearied children of Israel as gifts. His throne shall be established in wisdom and justice, while he himself shall be pure from sin and made strong in the Holy Spirit.<P>It is evident that in these descriptions of the coming one we have something more than a mere revival of the ancient hope of a preeminent king of David\'s house. The repeated disasters that overtook the Jews led to the transference of the national hope to a future world, and consequently to the transformation of the Messiah from a mere earthly king into a being with supernatural attributes. That this supernatural apocalyptic hope, which was at least coming to be cherished, exercised an influence on the national hope is seen in the Psalter of Solomon, where emphasis is laid on the striking individuality of this Davidic king, the moral grandeur of his person, and the Divine character of his rule.<P>We meet with the apocalyptic conception of the Messiah in the Similitudes of Enoch (chapters 37—71) and the later apocalypses. Reference may be made at this point to the Similitudes on account of their unique expression of Messianic doctrine, although their pre-Christian date, which Charles puts not later than 64 BC, is much disputed. The Messiah who is called "the Anointed," "the Elect one" "the Righteous one" is represented, though in some sense man, as belonging to the heavenly world. His pre-existence is affirmed. He is the supernatural Son of Man, who will come forth from His concealment to sit as Judge of all on the throne of His glory, and dwell on a transformed earth with the righteous forever.<P>See <a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE+(JEWISH)">APOCALYPTIC LITERATURE (JEWISH)</a>; <a href="./study/isbe/search.html?string=ESCHATOLOGY+OF+THE+OLD+TESTAMENT">ESCHATOLOGY OF THE OLD TESTAMENT</a>.<P>III. The Messiah in the New Testament.<P>To the prevalence of the Messianic hope among the Jews in the time of Christ the Gospel records bear ample testimony. We see from the question of the Baptist that "the coming one" was expected (<a onClick="return mV(\'Mat\',11,3);">Mt 11:3</a> and parallel), while the people wondered whether John himself were the Christ (<a onClick="return mV(\'Luk\',3,15);">Lu 3:15</a>).<P>1. The Jewish Conception:<P>(1) The Messiah as King.<P>In the popular conception the Messiah was chiefly the royal son of David who would bring victory and prosperity to the Jewish nation and set up His throne in Jerusalem. In this capacity the multitude hailed Jesus on His entry into the capital (<a onClick="return mV(\'Mat\',21,9);">Mt 21:9</a> and parallel); to the Pharisees also the Messiah was the son of David (<a onClick="return mV(\'Mat\',22,42);">Mt 22:42</a>). It would seem that apocalyptic elements mingled with the national expectation, for it was supposed that the Messiah would come forth suddenly from concealment and attest Himself by miracles (<a onClick="return mV(\'Jhn\',7,27,31);">Joh 7:27,31</a>).<P>But there were spiritual minds who interpreted the nation\'s hope, not in any conventional sense, but according to their own devout aspirations. Looking for "the consolation of Israel," "the redemption of Jerusalem," they seized upon the spiritual features of the Messianic king and recognized in Jesus the promised Saviour who would deliver the nation from its sin (<a onClick="return mV(\'Luk\',2,25,30,38);">Lu 2:25,30,38</a>; compare <a onClick="return mV(\'Luk\',1,\'68-79\');">1:68-79</a>).<P>(2) His Prophetic Character.<P>From the statements in the Gospels regarding the expectation of a prophet it is difficult to determine whether the prophetic function was regarded as belonging to the Messiah. We learn not only that one of the old prophets was expected to reappear (<a onClick="return mV(\'Mat\',14,2);">Mt 14:2</a>; <a onClick="return mV(\'Mat\',16,14);">16:14</a> and parallel), but also that a preeminent prophet was looked for, distinct from the Messiah (<a onClick="return mV(\'Jhn\',1,21,25);">Joh 1:21,25</a>; <a onClick="return mV(\'Jhn\',7,40);">7:40</a>f). But the two conceptions of prophet and king seem to be identified in <a onClick="return mV(\'Jhn\',6,14);">Joh 6:14</a>f; where we are told that the multitude, after recognizin
