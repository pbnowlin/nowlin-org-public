g in Jesus the expected prophet, wished to take Him by force and make Him a king. It would appear that while the masses were looking forward to a temporal king, the expectations of some were molded by the image and promise of Moses. And to the woman of Samaria, as to her people, the Messiah was simply a prophet, who would bring the full light of Divine knowledge into the world (<a onClick="return mV(\'Jhn\',4,25);">Joh 4:25</a>). On the other hand, from Philip\'s description of Jesus we would naturally infer that he saw in Him whom he had found the union of a prophet like unto Moses and the Messianic king of the prophetical books (<a onClick="return mV(\'Jhn\',1,45);">Joh 1:45</a>).<P>(3) The Title "Son of God."<P>It cannot be doubted that the "Son of God" was used as a Messianic title by the Jews in the time of our Lord. The high priest in presence of the Sanhedrin recognized it as such (<a onClick="return mV(\'Mat\',26,63);">Mt 26:63</a>). It was applied also in its official sense to Jesus by His disciples: John the Baptist (<a onClick="return mV(\'Jhn\',1,34);">Joh 1:34</a>), Nathaniel (<a onClick="return mV(\'Jhn\',1,49);">Joh 1:49</a>), Mary (<a onClick="return mV(\'Jhn\',11,27);">Joh 11:27</a>), Peter (<a onClick="return mV(\'Mat\',16,16);">Mt 16:16</a>, though not in parallel). This Messianic use was based on <a onClick="return mV(\'Psa\',2,7);">Ps 2:7</a>; compare <a onClick="return mV(\'2Sa\',7,14);">2Sa 7:14</a>. The title as given to Jesus by Peter in his confession, "the Son of the living God," is suggestive of something higher than a mere official dignity, although its full significance in the unique sense in which Jesus claimed it could scarcely have been apprehended by the disciples till after His resurrection.<P>2. Attitude of Jesus to the Messiahship:<P>(1) His Claim.<P>The claim of Jesus to be the Messiah is written on the face of the evangelic history. But while He accepted the title, He stripped it of its political and national significance and filled it with an ethical and universal content. The Jewish expectation of a great king who would restore the throne of David and free the nation from a foreign yoke was interpreted by Jesus as of one who would deliver God\'s people from spiritual foes and found a universal kingdom of love and peace.<P>(2) His Delay in Making It.<P>To prepare the Jewish mind for His transformation of the national hope Jesus delayed putting forth His claim before the multitude till His triumphal entry into Jerusalem, which, be it noted, He made in such a way as to justify His interpretation of the Messiah of the prophets, while He delayed emphasizing it to His disciples till the memorable scene at Caesarea Philippi when He drew forth Peter\'s confession.<P>(3) "The Son of Man."<P>But he sought chiefly to secure the acceptance of Himself in all His lowliness as the true Messianic king by His later use of His self-designation as the "Son of Man." While "Son of Man" in Aramaic, bar nasha\', may mean simply "man," an examination of the chief passages in which the title occurs shows that Jesus applied it to Himself in a unique sense. That He had the passage in Daniel in His mind is evident from the phrases He employs in describing His future coming (<a onClick="return mV(\'Mar\',8,38);">Mr 8:38</a>; <a onClick="return mV(\'Mar\',13,26);">13:26</a> and parallel; <a onClick="return mV(\'Mar\',14,62);">14:62</A> and parallel). By this apocalyptic use of the title He put forward much more clearly His claim to be the Messiah of national expectation who would come in heavenly glory. But He used the title also to announce the tragic destiny that awaited Him (<a onClick="return mV(\'Mar\',8,31);">Mr 8:31</a>). This He could do without any contradiction, as He regarded His death as the beginning of His Messianic reign. And those passages in which He refers to the Son of Man giving His life a ransom "for many" (<a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a> and parallel) and going "as it is written of him" (<a onClick="return mV(\'Mat\',26,24);">Mt 26:24</a> and parallel), as well as <a onClick="return mV(\'Luk\',22,37);">Lu 22:37</a>, indicate that He interpreted <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> of Himself in His Messianic character. By His death He would complete His Messianic work and inaugurate the kingdom of God. Thus, by the help of the title "Son of Man" Jesus sought, toward the close of His ministry, to explain the seeming contradiction between His earthly life and the glory of His Messianic kingship.<P>It may be added that our Lord\'s use of the phrase implies what the Gospels suggest (<a onClick="return mV(\'Jhn\',12,34);">Joh 12:34</a>), that the "Son of Man," notwithstanding the references in Daniel and the Similitudes of Enoch (if the pre-Christian date be accepted), was not regarded by the Jews generally as a Messianic title. For He could not then have applied it, as He does, to Himself before Peter\'s confession, while maintaining His reserve in regard to His claims to be the Messiah. Many scholars, however, hold that the "Son of Man" was already a Messianic title before our Lord employed it in His conversation with the disciples at Caesarea Philippi, and regard the earlier passages in which it occurs as inserted out of chronological order, or the presence of the title in them either as a late insertion, or as due to the ambiguity of the Aramaic.<P>See <a href="./study/isbe/search.html?string=SON+OF+MAN">SON OF MAN</a>.<P>3. The Christian Transformation:<P>The thought of a suffering Messiah who would atone for sin was alien to the Jewish mind. This is evident from the conduct, not only of the opponents, but of the followers of Jesus (<a onClick="return mV(\'Mat\',16,22);">Mt 16:22</a>; <a onClick="return mV(\'Mat\',17,23);">17:23</a>). While His disciples believed Him to be the Messiah, they could not understand His allusions to His sufferings, and regarded His death as the extinction of all their hopes (<a onClick="return mV(\'Luk\',18,34);">Lu 18:34</a>; <a onClick="return mV(\'Luk\',24,21);">24:21</a>). But after His resurrection and ascension they were led, by the impression His personality and teaching had made upon them, to see how entirely they had misconceived His Messiahship and the nature and extent of His Messianic kingdom (<a onClick="return mV(\'Luk\',24,31);">Lu 24:31</a>; <a onClick="return mV(\'Act\',2,36,38);">Ac 2:36,38</a>f). They were confirmed, too, in their spiritual conceptions when they searched into the ancient prophecies in the light of the cross. In the mysterious form of the Suffering Servant they beheld the Messianic king on His way to His heavenly throne, conquering by the power of His atoning sacrifice and bestowing all spiritual blessings (<a onClick="return mV(\'Act\',3,13);">Ac 3:13</a>,<a onClick="return mV(\'Act\',3,\'18-21\',26);">18-21,26</a>; <a onClick="return mV(\'Act\',4,27,30);">4:27,30</a>; <a onClick="return mV(\'Act\',8,35);">8:35</a>; <a onClick="return mV(\'Act\',10,\'36-43\');">10:36-43</a>).<P>4. New Elements Added:<P>(1) Future manifestation.<P>New features were now added to the Messiah in accordance with Jesus\' own teaching. He had ascended to His Father and become the heavenly king. But all things were not yet put under Him. It was therefore seen that the full manifestation of His Messiahship was reserved for the future, that He would return in glory to fulfill His Messianic office and complete His Messianic reign.<P>(2) Divine Personality.<P>Higher views of His personality were now entertained. He is declared to be the Son of God, not in any official, but in a unique sense, as coequal with the Father (<a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>; <a onClick="return mV(\'Rom\',1,4,7);">Ro 1:4,7</a>; <a onClick="return mV(\'1Cr\',1,3);">1Co 1:3</a>, etc.). His pre-existence is affirmed (<a onClick="return mV(\'Jhn\',1,1);">Joh 1:1</a>; <a onClick="return mV(\'2Cr\',8,9);">2Co 8:9</a>); and when He comes again in his Messianic glory, He will exercise the Divine function of Universal Judge (<a onClick="return mV(\'Act\',10,42);">Ac 10:42</a>; <a onClick="return mV(\'Act\',17,30);">17:30</a>f; etc.).<P>(3) Heavenly Priesthood.<P>The Christian conception of the Messianic king who had entered into His glory through suffering and death carried with it the doctrine of the Messianic priesthood. But it took some time for early Christian thought to advance from the new discovery of the combination of humiliation and glory in the Messiah to concentrate upon His heavenly life. While the preaching of the first Christians was directed to show from the Scriptures that "Jesus is the Christ" and necessarily involved the ascription to Him of many functions characteristic of the true priest, it was reserved for the author of the Epistle to the Hebrews to set forth this aspect of His work with separate distinctness and to apply to Him the title of our "great high priest" (<a onClick="return mV(\'Hbr\',4,14);">Heb 4:14</a>). As the high priest on the Day of Atonement not only sprinkled the blood upon the altar, but offered the sacrifice, so it was now seen that by passing into the heavens and presenting to God the offering He had made of Himself on earth, Jesus had fulfilled the high-priestly office.<P>5. Fulfillment in Jesus:<P>Thus the ideal of the Hebrew prophets and poets is amply fulfilled in the person, teaching and work of Jesus of Nazareth. Apologists may often err in supporting the argument from prophecy by an extravagant symbolism and a false exegesis; but they are right in the contention that the essential elements in the Old Testament conception—the Messianic king who stands in a unique relation to Yahweh as His "Son," and who will exercise universal dominion; the supreme prophet who will never be superseded; the priest forever—are gathered up and transformed by Jesus in a way the ancient seers never dreamed of. As the last and greatest prophet, the suffering Son of Man, and the sinless Saviour of the world, He meets humanity\'s deepest longings for Divine knowledge, human sympathy, and spiritual deliverance; and as the unique Son of God, who came to reveal the Father, He rules over the hearts of men by the might of eternal love. No wonder that the New Testament writers, like Jesus Himself, saw references to the Messiah in Old Testament passages which would not be conceded by a historical interpretation. While recognizing the place of the old covenant in the history of salvation, they sought to discover in the light of the fulfillment in Jesus the meaning of the Old Testament which the Spirit of God intended to convey, the Divine, saving thoughts which constitute its essence. And to us, as to the early Christians, "the testimony of Jesus is the spirit of prophecy" (<a onClick="return mV(\'Rev\',19,10);">Re 19:10</a>). To Him, hidden in the bosom of the ages, all the scattered rays of prophecy pointed; and from Him, in His revealed and risen splendor, shine forth upon the world the light and power of God\'s love and truth. And through the history and experience of His people He is bringing to larger realization the glory and passion of Israel\'s Messianic hope.<P>LITERATURE.<P>Drummond, The Jewish Messiah; Stanton, The Jewish and the Christian Messiah; Riehm, Messianic Prophecy; Delitzsch, Messianic Prophecies; von Orelli, Old Testament Prophecy; A. B. Davidson, Old Testament Prophecy; Schultz, Old Testament Theology; Schurer, HJP, div II, volume II, section 29, "The Messianic Hope"; Westcott, Introduction to the Study of the Gospels, chapter ii, "The Jewish Doctrine of Messiah"; Edersheim, The Life and Times of Jesus the Messiah, book II, chapter v, "What Messiah Did the Jews Expect?"; E. F. Scott, The Kingdom and the Messiah; Fairweather, The Background of the Gospels; articles in DB, HDB, EB, DCG. For further list see Riehm and Schurer.`<a href="./study/isbe/search.html?string=APOCALYPTIC+LITERATURE">APOCALYPTIC LITERATURE</a>`32';
isbe[5997]='Metal`met\'-al (chashmal; elektron; the King James Version amber; <a onClick="return mV(\'Eze\',8,2);">Eze 8:2</a>, the Revised Version margin "amber"): The substance here intended is a matter of great uncertainty. In Egypt bronze was, called chesmen, which may be connected with the Hebrew chashmal; the Greek elektron too has generally been accepted as an alloy of gold or silver or other metals, but this is far from certain. Professor Ridgeway (EB, I, cols. 134-36) has conclusively shown, however, that amber was well known in early times and that there is nothing archaeologically improbable in the reading of the King James Version.<P>Amber is a substance analogous to the vegetable resins, and is in all probability derived from extinct coniferous trees. The best or yellow variety was obtained by the ancients from the coasts of the Baltic where it is still found more plentifully than elsewhere. A red amber has been found in south Europe and in Phoenicia. From earliest times amber has been prized as an ornament; Homer apparently refers to it twice. Amber bracelets and necklaces are highly prized by the Orientals—especially Jewesses—today, and they are credited with medicinal properties.`<a href="./study/isbe/search.html?string=ELECTRUM">ELECTRUM</a>; <a href="./study/isbe/search.html??string=STONES,+PRECIOUS">STONES, PRECIOUS</a>`117';

isbe[5999]='Metallurgy`met\'-al-ur-ji: There are numerous Biblical references which describe or allude to the various metallurgical operations. In <a onClick="return mV(\'Job\',28,1);">Job 28:1</a> occurs zaqaq, translated "refine," literally, "strain." This undoubtedly refers to the process of separating the gold from the earthy material as pictured in the Egyptian sculptures (Thebes and Beni Hassan) and described by Diodorus. The ore was first crushed to the size of lentils and then ground to powder in a handmill made of granite slabs. This powder was spread upon a slightly inclined stone table and water was poured over it to wash away the earthy materials. The comparatively heavy gold particles were then gathered from the table, dried, and melted in a closed crucible with lead, salt and bran, and kept in a molten condition for 5 days, at the end of which time the gold came out pure.<P>The alloying of gold and silver with copper, lead or tin, and then removing the base metals by cupellation is used figuratively in <a onClick="return mV(\'Eze\',22,18,22);">Eze 22:18,22</a> to denote the coming judgment of Yahweh. Again in <a onClick="return mV(\'Isa\',1,25);">Isa 1:25</a> it indicates chastening. The fact that the prophets used this figure shows that the people were familiar with the common metallurgical operations.`<a href="./study/isbe/search.html?string=REFINER">REFINER</a>`133';
isbe[6000]='Metals`met\'-alz (Latin metallum, "metal," "mine"; Greek metallon, "mine"): The metals known by the ancients were copper, gold, iron, lead, silver and tin. Of these copper, gold and silver were probably first used, because, occurring in a metallic state, they could be separated easily from earthy materials by mechanical processes. Evidence is abundant of the use of these three metals by the people of remotest antiquity. Lead and tin were later separated from their ores. Tin was probably used in making bronze before it was known as a separate metal, because the native oxide, cassiterite, was smelted together with the copper ore to get bronze. Because of the difficulties in getting it separated from its compounds, iron was the last in the list to be employed. In regard to the sources of these metals in Bible times we have few Biblical references to guide us. Some writers point to <a onClick="return mV(\'Deu\',8,9);">De 8:9</a>, "a land whose stones are iron," etc., as referring to Palestine. Palestine can be disregarded, however, as a sourc e of metals, for it possesses no mineral deposits of any importance. If it was expected that Israel would possess Lebanon also, then the description would be more true. There is some iron ore which was in ancient times worked, although present-day engineers have declared it not to be extensive enough to pay for working. There is a little copper ore (chalcopyrite, malachite, azurite). In the Anti-Lebanon and Northern Syria, especially in the country east of Aleppo now opened up by the Bagdad Railroad and its branches, there are abundant deposits of copper. This must have been the land of Nuhasse referred to in the Tell el-Amarna Letters. If <a onClick="return mV(\'Zec\',6,1);">Zec 6:1</a> is really a reference to copper, which is doubtful, then the last-mentioned source was probably the one referred to. No doubt Cyprus (Alasia in Tell el-Amarna Letters (?)) furnished the ancients with much copper, as did also the Sinaitic peninsula.<P>Tarshish is mentioned (<a onClick="return mV(\'Eze\',27,12);">Eze 27:12</a>) as a source of silver, iron, tin, and lead. This name may belong to Southern Spain. If so it corresponds to the general belief that the Phoenicians brought a considerable proportion of the metals used in Palestine from that country. Havilah (<a onClick="return mV(\'Gen\',2,11);">Ge 2:11</a>), Ophir (<a onClick="return mV(\'1Ki\',10,11);">1Ki 10:11</a>), Sheba (<a onClick="return mV(\'Psa\',72,15);">Ps 72:15</a>) are mentioned as sources of gold. These names probably refer to districts of Arabia. Whether Arabia produced all the gold or simply passed it on from more remote sources is a question.<P>See <a href="./study/isbe/search.html?string=GOLD">GOLD</a>.<P>From the monuments in Egypt we learn that that country was a producer of gold and silver. In fact, the ancient mines and the ruins of the miners\' huts are still to be seen in the desert regions of upper Egypt. In the Sinaitic peninsula are deposits of copper, lead, gold, and silver. The most remarkable of the ancient Egyptian mines are situated here (J. Sarabit el Khadim, U. Sidreh, W. Magharah). The early Egyptian kings (Sneferu, Amenemhat II, and others) not only mined the metals, but cut on the walls of the mines inscriptions describing their methods of mining. Here, as in upper Egypt, are remains of the buildings where miners lived or carried out their metallurgical operations. It is hardly to be conceived that the large deposits of lead (galena) in Asia Minor were unworked by the ancients. No nearer deports of tin than those in southeastern Europe have yet been found. (For further information on metals see separate articles.)``133';
