isbe[5901]='Medeba`med\'-e-ba (medhebha\'; Maidaba, Medaba): The name may mean "gently flowing water," but the sense is doubtful. This city is first mentioned along with Heshbon and Dibon in an account of Israel\'s conquests (<a onClick="return mV(\'Num\',21,30);">Nu 21:30</a>). It lay in the Mishor, the high pastoral land of Moab. The district in which the city stood is called the Mishor or plain of Medeba in the description of the territory assigned to Reuben (<a onClick="return mV(\'Jos\',13,9);">Jos 13:9</a>), or the plain by Medeba (<a onClick="return mV(\'Jos\',13,16);">Jos 13:16</a>). Here the Ammonites and their Syrian allies put the battle in array against Joab, and were signally defeated (<a onClick="return mV(\'1Ch\',19,7);">1Ch 19:7</a>). This must have left the place definitely in the possession of Israel. But it must have changed hands several times. It was taken by Omri, evidently from Moab; and Mesha claims to have recovered possession of it (M S, ll. 7, 8, 29, 30). It would naturally fall to Israel under Jeroboam II; but in <a onClick="return mV(\'Isa\',15,2);">Isa 15:2</a> it is referred to as a city of Moab. It also figures in later Jewish history. John, son of Mattathias, was captured and put to death by the Jambri, a robber tribe from Medeba. This outrage was amply avenged by Jonathan and Simon, who ambushed a marriage party of the Jambri as they were bringing a noble bride from Gabbatha, slew them all and took their ornaments (1Macc 9:36ff; Ant, XII, i, 2, 4). Medeba was captured by Hyrcanus "not without the greatest distress of his army" (Ant., XIII, ix, 1). It was taken by Janneus from the Nabateans. Hyrcanus promised to restore it with other cities so taken to Aretas in return for help to secure him on the Judean throne (ibid., xv, 4; XIV, i, 4). Ptolemy speaks of it as a town in Arabia Petrea, between Bostra and Petra. Eusebius and Jerome knew it under its ancient name (Onomasticon, under the word). It became the seat of a bishropric, and is mentioned in the Acts of the Council of Chalcedon (451 AD), and in other ecclesiastical lists.<P>The ancient city is represented by the modern Madeba, a ruined site with an Arab village, crowning a low hill, some 6 miles south of Heshbon, with which it was connected by a Roman road. The ruins, which are considerable, date mainly from Christian times. The surrounding walls can be traced in practically their whole circuit. There is a large tank, now dry, measuring 108 yds. X 103 yds., and about 12 ft. in depth. In 1880 it was colonized by some Christian families from Kerak, among whom the Latins carry on mission work. In December,1896,a most interesting mosaic was found. It proved to be a map of part of Palestine and Lower Egypt of the time of Justinian. Unfortunately it is much damaged. An account of it will be found in Palestine Exploration Fund Statement, 1897, 213ff, 239; 1898, 85,177ff, 251.``54';
isbe[5902]='Medes`medz (madhi; Assyrian Amada, Mada; Achaem. Persian Mada; Medoi (<a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>; <a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>; <a onClick="return mV(\'2Ki\',18,11);">18:11</a>; <a onClick="return mV(\'1Ch\',1,5);">1Ch 1:5</a>; <a onClick="return mV(\'Ezr\',6,2);">Ezr 6:2</a>; <a onClick="return mV(\'Est\',1,3,14,18,19);">Es 1:3,14,18,19</a>; <a onClick="return mV(\'Est\',10,2);">10:2</a>; <a onClick="return mV(\'Isa\',13,17);">Isa 13:17</a>; <a onClick="return mV(\'Isa\',21,2);">21:2</a>; <a onClick="return mV(\'Jer\',25,25);">Jer 25:25</a>; <a onClick="return mV(\'Jer\',51,11,28);">51:11,28</a>; <a onClick="return mV(\'Dan\',5,28);">Da 5:28</a>; <a onClick="return mV(\'Dan\',6,1,9,13,16);">6:1,9,13,16</a>; <a onClick="return mV(\'Dan\',8,20);">8:20</a>; <a onClick="return mV(\'Dan\',9,1);">9:1</a>; <a onClick="return mV(\'Dan\',11,1);">11:1</a>)): Mentioned as Japhethites in <a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>, i.e. Aryans, and accordingly they first called themselves Arioi (Herod. vii.62), in Avestic Airya = Skt. Arya, "noble." They were closely allied in descent, language and religion with the Persians, and in secular history preceded their appearance by some centuries. Like most Aryan nations they were at first divided into small village communities each governed by its own chiefs (called in Assyrian chazanati by Assur-bani-pal: compare Herod. i.96). Shalmaneser II mentions them (Nimrod Obelisk, i.121) about 840 BC. They then inhabited the modern A\'zarbaijan (Media Atropatene). Rammanu-nirari III of Assyria (Rawlinson, Western Asiatic Inscriptions, I, 35) declares that he (810-781 BC) had conquered "the land of the Medes and the land of Parsua" (Persis), as well as other countries. This probably meant only a plundering expedition, as far as Media was concerned. So also Assur-nirari II (Western Asiastic Inscriptions, II, 52) in 749-748 BC overran Namri in southwest Media. Tiglath-pileser IV (in Babylonian called Pulu, the "Pul" of <a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>) and Sargon also overran parts of Media. Sargon in 716 BC conquered Kisheshin, Kharkhar and other parts of the country. Some of the Israelites were by him transplanted to "the cities of the Medes" (<a onClick="return mV(\'2Ki\',17,6);">2Ki 17:6</a>; <a onClick="return mV(\'2Ki\',18,11);">18:11</a>; the Septuagint reading Ore, cannot be rendered "mountains" of the Medes here) after the fall of Samaria in 722 BC. It was perhaps owing to the need of being able to resist Assyria that about 720 BC the Medes (in part at least) united into a kingdom under Deiokes, according to Herodotus (i.98). Sargon mentions him by the name Dayaukku, and says that he himself captured this prince (715 BC) and conquered his territory two years later. After his release, probably, Deiokes fortified Ecbatana (formerly Ellippi) and made it his capital. It has been held by some that Herodotus confounds the Medes here with the Manda (or Umman-Manda, "hosts of the Manda") of the inscriptions; but these were probably Aryan tribes, possibly of Scythian origin, and the names Mada and Manda may be, after all, identical. Esar-haddon in his 2nd year (679-678 BC) and Assurbani-pal warred with certain Median tribes, whose power was now growing formidable. They (or the Manda) had conquered Persis and formed a great confederacy. Under Kyaxares (Uvakh-shatara—Deiokes\' grandson, according to Herodotus), they besieged Nineveh, but Assur-bani-pal, with the assistance of the Ashguza (? the Ashkenaz of <a onClick="return mV(\'Gen\',10,3);">Ge 10:3</a>), another Aryan tribe, repelled them. The end of the Assyrian empire came, however, in 606 BC, when the Manda under their king Iriba-tukte, Mamiti-arsu "lord of the city of the Medes," Kastarit of the Armenian district of Kar-kassi, the Kimmerians (Gimirra = Gomer) under Teushpa (Teispes, Chaishpish), the Minni (Manna; compare <a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a>), and the Babylonians under Nabu-pal-ucsur, stormed and destroyed Nineveh, as Nabu-nahid informs us. The last king of Assyria, Sin-sar-iskun (Sarakos), perished with his people.<P>Herodotus says that Deiokes was succeeded by Phraortes (Fravartish) his son, Phraortes by his son Kyaxares; and the latter in turn left his kingdom to his son Astyages whose daughter Mandane married Cambyses, father of the great Cyrus. Yet there was no Median empire (such as he describes) then, or at least it did not embrace all the Aryan tribes of Western Asia, as we see from the inscriptions that in 606 BC, and even later, many of them were under kings and princes of their own (compare <a onClick="return mV(\'Jer\',25,25);">Jer 25:25</a>; <a onClick="return mV(\'Jer\',51,11);">51:11</a>). Herodotus tells us they were divided into six tribes, of whom the Magi were one (Herod. i.101). Kyaxares warred for 5 years (590-585 BC) with the Lydians, the struggle being ended in May,585,by the total eclipse of the sun foretold by Thales (Herodotus i.74).<P>The alliance between the Medes and the Babylonians ended with Nebuchadnezzar\'s reign. His successor Nabu-nahid (555 BC) says that in that year the Medes under Astyages (Ishtuwegu) entered Mesopotamia and besieged Haran. Soon after, however, that dynasty was overthrown; for Cyrus the Persian, whom Nabu-nahid the first time he mentions him styles Astyages\' "youthful slave" (ardusu cachru), but who was even then king of Anshan (Anzan), attacked and in 549 BC captured Astyages, plundered Ecbatana, and became king of the Medes. Though of Persian descent, Cyrus did not, apparently, begin to reign in Persia till 546 BC. Henceforth there was no Median empire distinguished from the Persian (nor is any such mentioned in Daniel, in spite of modern fancies). As the Medes were further advanced in civilization and preceded the Persians in sovereignty, the Greek historians generally called the whole nation "the Medes" long after Cyrus\' time. Only much later are the Persians spoken of as the predominant partners. Hence, it is a sign of early date that Daniel (<a onClick="return mV(\'Dan\',8,20);">8:20</a>) speaks of "Media and Persia," whereas later the Book of Esther reverses the order ("Persia and Media," <a onClick="return mV(\'Est\',1,3,14,18,19);">Es 1:3,14,18,19</a>; <a onClick="return mV(\'Est\',10,2);">10:2</a>), as in the inscriptions of Darius at Behistun. Under Darius I, Phraortes (Fravartish) rebelled, claiming the throne of Media as a descendant of Kyaxares. His cause was so powerfully supported among the Medes that the rebellion was not suppressed till after a fierce struggle. He was finally taken prisoner at Raga (Rai, near Tehran), brutally mutilated, and finally impaled st Ecbatana. After that Median history merges into that of Persia. The history of the Jews in Media is referred to in Daniel and Esther. <span class="noTag">1 Maccabees</span> tells something of Media under the Syrian (6:56) and Parthian dominion (14:1-3; compare Josephus, Ant, XX, iii). Medes are last mentioned in <a onClick="return mV(\'Act\',2,9);">Ac 2:9</a>. They are remarkable as the first leaders of the Aryan race in its struggle with the Semites for freedom and supremacy.``175';
isbe[5903]='Media`me\'-di-a (madhay; Achaem. Persian Mada; Media): Lay to the west and southwest of the Caspian, and extended thence to the Zagrus Mountains on the west. On the north in later times it was bounded by the rivers Araxes and Cyrus, which separated it from Armenia. Its eastern boundaries were formed by Hyrcania and the Great Salt Desert (now called the Kavir), and it was bounded on the south by Susiana. In earlier times its limits were somewhat indefinite. It included Atropatene, (Armenian Atrpatakan, the name, "Fire-guarding," showing devotion to the worship of Fire) to the north, and Media Magna to the south, the former being the present A\'zarbaijan. Near the Caspian the country is low, damp and unhealthy, but inland most of it is high and mountainous, Mt. Demavand in the Alburz range reaching 18,600 ft. Atropatene was famed for the fertility of its valleys and table-lands, except toward the north. Media Magna is high; it has fruitful tracts along the course of the streams, but suffers much from want of water, though this was doubtless more abundant in antiquity. It contained the Nisaean Plain, famous for its breed of horses. The chief cities of ancient Media were Ecbatana, Gazaea, and Ragae. The Orontes range near Ecbatana is the present Alvand. Lake Spauta is now known as Urmi (Urumiah).``175';
isbe[5904]='Median`me\'-di-an.`<a href="./study/isbe/search.html?string=DARIUS">DARIUS</a>; <a href="./study/isbe/search.html??string=MEDES">MEDES</a>; <a href="./study/isbe/search.html??string=MEDIA">MEDIA</a>`1';
isbe[5905]='Mediation; Mediator`me-di-a\'-shun, me\'-di-a-ter:<P><b>I. INTRODUCTORY</b><P class="in15">1. The Terms<P class="in30">(1) Mediation<P class="in30">(2) Mediator<P class="in15">2. The Principle of Mediation<P><b>II. MEDIATION IN THE OLD TESTAMENT</b><P class="in15">1. Negative Teaching in the Old Testament<P class="in15">2. The Positive Teaching: Early Period<P class="in15">3. Prophetic Mediation<P class="in15">4. Priestly Mediation<P class="in15">5. The Theocratic King: the Messiah<P class="in15">6. The Suffering Servant<P class="in15">7. Superhuman Agents of Mediation<P class="in30">(1) Angelic Mediation<P class="in30">(2) Divine Wisdom<P><b>III. IN SEMI-CANONICAL AND NON-CANONICAL JEWISH LITERATURE</b><P><b>IV. MEDIATION AND MEDIATOR IN THE NEW TESTAMENT</b><P class="in15">1. The Synoptic Gospels<P class="in30">(1) Christ as Prophet<P class="in30">(2) Christ as King<P class="in30">(3) Christ as Priest (Redeemer)<P class="in15">2. Primitive Apostolic Teachings<P class="in30">(1) The Early Speeches in Acts<P class="in30">(2) Epistles of James and Jude<P class="in30">(3) 1 Peter<P class="in15">3. Epistles of Paul<P class="in30">(1) The Need of a Mediator<P class="in30">(2) The Qualifications<P class="in30">(3) The Means, the Death of Christ<P class="in30">(4) The Resurrection and Exaltation<P class="in30">(5) The Cosmic Aspect of Christ\'s Mediatorship<P class="in15">4. Epistle to the Hebrews<P class="in15">5. The Johannine Writings<P class="in30">(1) The Fourth Gospel<P class="in30">(2) The Epistles<P class="in30">(3) The Apocalypse<P><b>V. CONCLUSION</b><P><b>LITERATURE</b><hr /><P>I Introductory.<P>1. The Terms:<P>(1) Mediation:<P>"Mediation" in its broadest sense may be defined as the act of intervening between parties at variance for the purpose of reconciling them, or between parties not necessarily hostile for the purpose of leading them into an agreement or covenant. Theologically, it has reference to the method by which God and man are reconciled through the instrumentality of some intervening process, act or person, and especially through the atoning work of Jesus Christ. The term itself does not occur in Biblical literature.<P>(2) Mediator:<P>The term "mediator" (equals middleman, agent of mediation) is nowhere found in Old Testament or Apocrypha (English Versions of the Bible), but the corresponding Greek word mesites, occurs once in Septuagint (<a onClick="return mV(\'Job\',9,33);">Job 9:33</a> the King James Version, "Neither is there any daysman betwixt us," where "daysman" stands for Hebrew mokhiach, "arbitrator," the American Standard Revised Version, the English Revised Version margin "umpire" (see <a href="./study/isbe/search.html?string=DAYSMAN">DAYSMAN</a>); Septuagint has ho mesites hemon, "our mediator," as a paraphrase for Hebrew benenu, "betwixt us"). Even in the New Testament, mesites, "mediator," occurs only 6 times, namely, <a onClick="return mV(\'Gal\',3,19,20);">Ga 3:19,20</a> (of Moses), and <a onClick="return mV(\'1Ti\',2,5);">1Ti 2:5</a>; <a onClick="return mV(\'Hbr\',8,6);">Heb 8:6</a>; <a onClick="return mV(\'Hbr\',9,15);">9:15</a>; <a onClick="return mV(\'Hbr\',12,24);">12:24</a> (of Christ).<P>2. The Principle of Mediation:<P>Though the actual terms are thus very rare, the principle of mediation is one of great significance in Biblical theology, as well as in the Jewish-Alexandrian philosophy. It corresponds to a profound human instinct or need which finds expression in some form or other in most religions. It is an attempt to solve the problem raised by (1) the idea of the infinite distance which separates God from man and the universe, and (2) the deeply felt want of bringing them into a harmonious relation. The conception of mediation will differ, therefore, according to whether the distance to be surmounted is understood ethically or metaphysically. If it be thought of in an ethical or religious sense, that is, if the emphasis be laid on the fact of human sin as standing in the way of man\'s fellowship with God, then mediation will be the mode by which peaceful relations are established between sinful man and the absolutely righteous God. But if the antithesis of God and the world be conceived of metaphysically, i.e. be based on the ultimate nature of God and of the world conceived as essentially opposed to each other, then mediation will be the mode by which the transcendent God, without Himself coming into direct contact with the world, is able to produce effects in it through an intermediate agent (or agents). The latter conception (largely the result of an exaggerated Platonic dualism) exerted an important influence on later Jewish thought, and even on Christian theology, and will come briefly under our consideration. But in the main we shall be concerned with the former view, as more in harmony with the development of Biblical theology which culminates in the New Testament doctrine of atonement. Mediation between God and man as presented in the Scriptures has 3 main aspects, represented respectively by the functions of the prophet, the priest, and theocratic king. Here and there in the Old Testament these tend to meet, as in Melchizedek the priest-king, and in the Suffering Servant of Deutero-Isaiah, who unites the priestly function of sacrifice with the prophetic function of revealing the Divine will. But on the whole, these aspects of mediation in the Old Testament run along lines which have no meeting-point in one person adequate to all the demands. In the New Testament they intersect in the person and work of Jesus Christ, who realizes in Himself the full meaning of the prophetic, priestly, and kingly ideals.<P>II. Mediation in the Old Testament.<P>1. Negative Teaching in the Old Testament:<P>We do not find in the Old Testament a fixed and final doctrine of mediation universally accepted as an axiom of religious thought, but only a gradual movement toward such a doctrine, under the growing sense of God\'s exaltation and of man\'s frailty and sinfulness. Such a passage as <a onClick="return mV(\'1Sa\',2,25);">1Sa 2:25</a> seems definitely to contradict the idea of mediation. Still more striking are the words of Job above referred to, "There is no umpire betwixt us, that might lay his hand upon us both," i.e. to enforce his decision (<a onClick="return mV(\'Job\',9,33);">Job 9:33</a>), where the Septuagint paraphrases, "Would that there were a mediator and a reprover and a hearer between us both." The note of despair which characterizes this passage shows that Job has no hope that such an arbitrator between him and God is forthcoming. Yet the words give pathetic utterance to the deep inarticulate cry of humanity for a mediator. In this connection we should note the protests of prophets and psalmists against an unethical view of mediation by animal sacrifices (<a onClick="return mV(\'Mic\',6,\'6-8\');">Mic 6:6-8</a>; <a onClick="return mV(\'Psa\',40,\'6-8\');">Ps 40:6-8</a>, etc.), and their frequent direct appeals to God for mercy without reference to any mediation (<a onClick="return mV(\'Psa\',25,7);">Ps 25:7</a>; <a onClick="return mV(\'Psa\',32,5);">32:5</a>; <a onClick="return mV(\'Psa\',103,8);">103:8</a>, etc.).<P>2. The Positive Teaching: Early Period:<P>(1) Mediatory Sacrifice.<P>In the patriarchal age, before the official priest had been differentiated from the rest of the community, the function of offering sacrifice was discharged by the head of the family or clan on behalf of his people, as by Noah (<a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>), Abraham (<a onClick="return mV(\'Gen\',12,7,8);">Ge 12:7,8</a>; <a onClick="return mV(\'Gen\',15,\'9-11\');">15:9-11</a>), Isaac (<a onClick="return mV(\'Gen\',26,24);">Ge 26:24</a>f), Jacob (<a onClick="return mV(\'Gen\',31,54);">Ge 31:54</a>; <a onClick="return mV(\'Gen\',33,20);">33:20</a>). So Job, conceived by the writer as living in patriarchal antiquity, is said to have offered sacrifices vicariously for his sons (<a onClick="return mV(\'Job\',1,5);">Job 1:5</a>). Melchizedek, the priest-king of Salem (<a onClick="return mV(\'Gen\',14,\'18-20\');">Ge 14:18-20</a>), is a figure of considerable theological interest, inasmuch as he was taken by the author of <a onClick="return mV(\'Psa\',110,1);">Ps 110</a> as the forerunner of the ideal theocratic king who was also priest, and by the author of He as prototype of Christ\'s priesthood.<P>(2) Intercessory Prayer.<P>Intercession is in all stages of thought an essential element in mediation. We have striking examples of it in <a onClick="return mV(\'Gen\',18,\'22-33\');">Ge 18:22-33</a>; <a onClick="return mV(\'Job\',42,\'8-10\');">Job 42:8-10</a>.<P>(3) The Mosaic Covenant.<P>In Moses we have for the first time a recognized national representative who acted both as God\'s spokesman to the people, and the people\'s spokesman before God. He alone was allowed to "come near unto Yahweh," and to him Yahweh spake "face to face, as a man speaketh unto his friend" (<a onClick="return mV(\'Exd\',33,11);">Ex 33:11</a>). He went up to God and "reported the words of the people" to Him, as to a sovereign who cannot be approached save by his duly accredited minister (<a onClick="return mV(\'Exd\',19,8);">Ex 19:8</a>). We have a striking example of his intercessory mediation in the episode of the golden calf, when he pleaded effectively with God to turn from His wrath (<a onClick="return mV(\'Exd\',32,\'12-14\');">Ex 32:12-14</a>), and even offered to "make atonement for" (kipper, literally, "cover") their sin by confessing their sin before God, and being willing to be blotted out of God\'s book, so that the people might be spared (<a onClick="return mV(\'Exd\',32,\'30-32\');">Ex 32:30-32</a>). Here we have already the germs of the idea of vicarious suffering for sin.<P>(4) Intercessory Mediation.<P>Samuel is by Jeremiah classed with Moses as the chief representative of intercessory mediation (<a onClick="return mV(\'Jer\',15,1);">Jer 15:1</a>). He is reported as mediating by prayer between Israel and God, and succeeding in warding off the punishment of their sin (<a onClick="return mV(\'1Sa\',7,\'5-12\');">1Sa 7:5-12</a>). On such occasions, prayer was wont to be accompanied by confessions of sins and by an offering to Yahweh.<P>3. Prophetic Mediation:<P>Samuel represents the transition from the ancient seer or soothsayer to the prophetic order. The prophet was regarded as the organ of Divine revelation, to consult whom was equivalent to "inquiring of God" (<a onClick="return mV(\'1Sa\',9,9);">1Sa 9:9</a>)—a commissioner sent by God (<a onClick="return mV(\'Isa\',6,8);">Isa 6:8</a>f) to proclaim His will by word and action. In that capacity he was Yahweh\'s representative among men, and so could speak in a tone of authority. Prophetic revelation is essential to the Old Testament religion (compare <a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a>), which by it stands distinguished from a mere philosophy or natural religion. God is not merely a passive object of human discovery, but one who actively and graciously reveals Himself to His chosen people through the medium of the authorized exponents of His mind and will. Thus in the main the prophet stands for the principle of mediation in its man-ward aspect. But the God-ward aspect is not absent, for we find the prophet mediating with God on behalf of men, making intercession for them (<a onClick="return mV(\'Jer\',14,\'19-22\');">Jer 14:19-22</a>; <a onClick="return mV(\'Amo\',7,2,5);">Am 7:2f; 5f</a>).<P>4. Priestly Mediation:<P>Mediation is in a peculiar sense the function of the priest. In the main he stands for the principle in its God-ward aspect. Yet in the early period it was the man-ward aspect that was most apparent; i.e. the priest was at first regarded as the medium through which Yahweh delivered His oracles to men, the human mouthpiece of supernatural revelation, giving advice in difficult emergencies by casting the sacred lot. Before the time of the first literary prophets, the association of the priests with the ephod and the lot had receded into the background (though the high priest theoretically retained the gift of interpreting the Divine will through the Urim and Thummim, <a onClick="return mV(\'Exd\',28,30);">Ex 28:30</a>; <a onClick="return mV(\'Lev\',8,8);">Le 8:8</a>); but the power they lost with the oracle they gained at the altar. First they acquired a preferential status at the local sanctuaries; then, in the Deuteronomic legislation, where sacrifice is limited to the Jerusalem sanctuary, it is assumed that only Levite priests can officiate. Finally, in the Levitical system as set forth in the Priestly Code (which regulated Jewish worship in the post-exilic times), the Aaronic priests, now clearly distinguished from the Levites, have the sole privilege of immediate access to God in His sanctuary (<a onClick="return mV(\'Num\',4,19,20);">Nu 4:19,20</a>; <a onClick="return mV(\'Num\',16,\'3-5\');">16:3-5</a>). God\'s transcendence and holiness are now so emphasized that between Him and the sin-stained people there is almost an infinite chasm. Hence, the people can only enjoy its ideal right of drawing nigh unto God and offering sacrifice to Him through the mediation of the official priesthood. The mediatorship of priests derived its authority, not from their moral purity or personal worth, but from the ceremonial purity which attached to their office. All priests are not on the same level. A process of graduated sanctity narrows down their number as the approach is made to the Most Holy Place, which symbolizes the presence chamber of Yahweh.<P>(1) Out of the sacred nation as a whole, the priestly tribe of Levi is elected and invested with a special sanctity to perform all the subordinate acts of service within the tabernacle (<a onClick="return mV(\'Num\',8,19);">Nu 8:19</a>; <a onClick="return mV(\'Num\',18,6);">18:6</a>).<P>(2) Within this sacred tribe, the members of the house of Aaron are set apart and invested with a still higher sanctity; they alone officiate at the altar in the Holy Place and expiate the guilt of the people by sacrifice and prayer, thus representing the people before God. Yet even they are only admitted to the proximate nearness of the Holy Place.<P>(3) The gradation of the hierarchy is completed by the recognition of a single, supreme head of the priesthood—the high priest. He alone can enter the Holy of Holies, and that alone once a year, on the Day of Atonement, when he makes propitiation not only for himself and the priesthood, but for the entire congregation. The ritual of the Day of Atonement is the highest exercise of priestly mediatorship. On that day, the whole community has access to Yahweh through their representative, the high priest, and through him offer atonement for their sins. Moreover, the role of the high priest as mediator is symbolized by his wearing the breastplate bearing the names of the children of Israel, whenever he goes into the Holy Place (<a onClick="return mV(\'Exd\',28,29);">Ex 28:29</a>).<P>Something must be said of the sacrificial system, through which alone the priest exercised his mediatorial functions. For his mediatorship did not depend on his direct personal influence with God, exercised, for instance, through intercessory prayer (intercession is not mentioned by the Priestly Code (P) as a duty of the priest, though referred to by the prophets, <a onClick="return mV(\'Joe\',2,17);">Joe 2:17</a>; <a onClick="return mV(\'Mal\',1,9);">Mal 1:9</a>). It depended rather on an elaborate system of sacrifice, of which the priest was but an official agent. It was he who derived his authority from the system, rather than the system from him. The most characteristic features in the ritual of P are the sin offering (chatta\'th, <a onClick="return mV(\'Lev\',4,1);">Le 4</a>; <a onClick="return mV(\'Lev\',5,1);">5</a>; <a onClick="return mV(\'Lev\',6,\'24-30\');">6:24-30</a>) and the guilt offering (\'asham, <a onClick="return mV(\'Lev\',5,\'1-\');">Le 5</a>; <a onClick="return mV(\'Lev\',6,\'1-\');">6</a>; <a onClick="return mV(\'Lev\',7,\'1-\');">7</a>; <a onClick="return mV(\'Lev\',14,\'1-\');">14</a>; <a onClick="return mV(\'Lev\',19,\'1-\');">19</a>), which seem peculiar to P. These are meant to restore the normal relation of the people or of individuals to God, a relation which sin has disturbed. Hence, these sacrifices, when duly administered by the priest, are distinctly mediatorial or reconciliatory in character, i.e. they make atonement for or "cover" (kipper) the sin of the guilty community or individuals. This seems the case also, though in a far less degree, even with the burnt, peace, and meal offerings, which, though "not offered expressly, like the sin and guilt offerings, for the forgiveness of sin, nevertheless were regarded...as \'covering,\' or neutralizing, the offerer\'s unworthiness to appear before God, and so, though in a much less degree than the sin or guilt offering, as effecting propitiation" (Driver in Hastings, Dictionary of the Bible, IV, 132). We must beware, however, of reading the full New Testament doctrine of sin and propitiation into the sacrificial law. Two important points of difference may be noted: (1) The law does not provide atonement for all sins, but only for sins of ignorance or inadvertence, committed within the covenant. Deliberate sins fall outside the scope of priestly mediation. (2) While sin includes moral impurity, it must be admitted that the chief emphasis falls on ceremonial uncleanness, because it is only violation of physical sanctity that can be fully rectified by ritual ordinance. The law was essentially a civil code, and was not adequate to deal with inward sins. Thus the sacrificial system in itself is but a faint adumbration of the New Testament doctrine of Christ\'s high-priestly work, which has reference to sin in its widest and deepest meaning. Yet, in spite of these limitations, the priestly ritual was, as far as it went, an organized embodiment of the sin-consciousness, and so prepared the way for the coming of a perfect Mediator.<P>5. The Theocratic King: the Messiah:<P>On another plane than that of the priest is the mediation of theocratic king. Yahweh was ideally the sole king of Israel. But He governed the people mediately through His vicegerent theocratic king, the agent of His will. The king was regarded as "Yahweh\'s anointed" (<a onClick="return mV(\'1Sa\',16,6);">1Sa 16:6</a>, etc.), and his person as inviolable. He was the "visible representative of the invisible Divine King" (Riehm). The ideal of theocratic king was most nearly represented by David, the man after Yahweh\'s own heart (compare <a onClick="return mV(\'1Sa\',13,14);">1Sa 13:14</a>). This fact led to Yahweh\'s covenant-promise that David\'s house should constitute a permanent dynasty, and his throne be established forever (<a onClick="return mV(\'2Sa\',7,\'5-17\');">2Sa 7:5-17</a>; compare <a onClick="return mV(\'Psa\',89,\'19-37\');">Ps 89:19-37</a>). The indestructibility of the Davidic dynasty was the basal conviction on which the hope of a Messiah was built. It led to attention being further concentrated on one preeminent King in David\'s line, who should be the Divinely accredited representative of Yahweh, and reign in His name. As a Divinely endowed human hero, the Messiah will possess attributes which will qualify Him to mediate between God and His people in national life and affairs, and so inaugurate the ideal age of peace and righteousness. He is portrayed especially as the Royal Saviour of Israel, through whom the salvation of the people is mediated and justice administered (e.g. <a onClick="return mV(\'Isa\',11,\'1-10\');">Isa 11:1-10</a>; <a onClick="return mV(\'Isa\',61,\'1-3\');">61:1-3</a>; <a onClick="return mV(\'Psa\',72,4,13);">Ps 72:4,13</a>; <a onClick="return mV(\'Jer\',23,5,6);">Jer 23:5,6</a>; <a onClick="return mV(\'Jer\',33,15,16);">33:15,16</a>).<P>6. The Suffering Servant:<P>In the wonderful figure of exilic prophecy, the Suffering Servant of Yahweh, the principle of mediation is exemplified both in its man-ward and God-ward aspects. In its man-ward aspect, his mission is the prophetic one of being God\'s anointed messenger to men, His witness before the world (<a onClick="return mV(\'Isa\',42,6,19);">Isa 42:6,19</a>; <a onClick="return mV(\'Isa\',43,10);">43:10</a>; <a onClick="return mV(\'Isa\',49,2);">49:2</a>; <a onClick="return mV(\'Isa\',50,4,5);">50:4,5</a>; <a onClick="return mV(\'Isa\',61,\'1-3\');">61:1-3</a>). But the profound originality of the conception of the Servant lies chiefly in the God-ward significance of his suffering (<a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>). The Servant suffered vicariously as an atonement for the sins of the people. His death is even said to be a "guilt-offering" (\'asham, <a onClick="return mV(\'Isa\',53,10);">Isa 53:10</a>), and he is represented as making "intercession for the transgressors" (<a onClick="return mV(\'Isa\',53,12);">Isa 53:12</a>). Here is the profoundest expression in the Old Testament of the principle of mediatorship.<P>The substitution of voluntary, deliberate, human sacrifice for that of unwilling beasts elevates the sacrificial idea to a new ethical plane, and brings it into far more vital and organic relation to human life. The basis of the mediatorship of the Servant seems to be the principle of the solidarity or organic unity of the people, involving the ideal unity of the Servant and the people he represents. In the earlier servant-passages the Servant is identical with the whole nation (<a onClick="return mV(\'Isa\',41,8);">Isa 41:8</a>; <a onClick="return mV(\'Isa\',44,1);">44:1</a>f; and often), and the unity is therefore actual, not ideal merely. In other passages, however, they are clearly to be distinguished, for while the people as a whole is unfaithful to its mission, the Servant remains faithful and suffers for it. Whether in <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a> the Servant is the pious remnant of the people or is conceived of as an individual we need not here consider. In either case, the tie between the Servant and the whole nation is never completely broken; the idea of their mystical union is still the groundwork of the prophet\'s thought. In virtue of this ideal relation, the Servant is the representative of the nation before God, not in a mere official sense (as in the case of the priest), but on the ground of personal merit, as the true Israel, the embodiment of the national ideal. On that ground God can accept his suffering in lieu of the deserved penalty of the whole people. We have here a wonderful adumbration of the New Testament doctrine of atonement through the One Mediator, the Son of Man, the representative of the race.<P>See <a href="./study/isbe/search.html?string=SERVANT+OF+JEHOVAH">SERVANT OF JEHOVAH</a>.<P>7. Superhuman Agents of Mediation:<P>In later Judaism, the growing sense of God\'s transcendence favored the tendency to introduce supernatural intermediaries between God and the world.<P>(1) Angelic Mediation.<P>Not until post-exilic times did angels come to have theological significance. Previously, when God was anthropomorphically conceived as appearing periodically on earth in visible form, the need of angelic mediation was not felt. The "angel" in early narrative (e.g. <a onClick="return mV(\'Gen\',16,\'7-11\');">Ge 16:7-11</a>) did not possess abiding personality distinct from God, but was God Himself temporarily manifested in human form. But the more God came to be conceived as "the high and lofty One that inhabiteth eternity," the greater was the need for mediation between God and the world, and even between God and His servant the prophet. In post-exilic writers there is an increasing disposition to fill up the gap between God and the prophet with superhuman beings. Thus Zechariah receives all Divine instruction through angels; and similarly Daniel receives explanations of his dreams. We do not in the Old Testament hear of angels interceding with God (God-ward mediation), but only as intermediaries of revelation and of the Divine will (man-ward mediation). Modern Jewish scholars deny that Judaistic angelology implied that God was transcendent in the sense of being remote and out of contact with the world. So, e.g., Montefiore (Hibbert Lectures, 423-31), but even he admits a "natural disinclination to bring the Godhead downward to human conditions," and that "for supernatural conversations angels formed a convenient substitute for God" (p. 430). The doctrine of angels had no influence on the New Testament doctrine of mediation, which moves on the plane of the ethical, rather than on the basis of the merely physical transcendenee of God.<P>(2) Divine Wisdom.<P>Of more importance as a preparation for theology of the New Testament is the doctrine of Wisdom, in which the Jews found "a middle term between the religion of Israel and the philosophy of Greece." In <a onClick="return mV(\'Pro\',8,\'22-31\');">Pr 8:22-31</a> Wisdom is depicted as an individual energy, God\'s elect Son, His companion and master-workman (<a onClick="return mV(\'Pro\',8,30);">Pr 8:30</a>) in creation, but whose chief delight is with the children of men. Though the personification is here purely ideal and poetical, and the ethical interest predominates over the metaphysical, yet we have in such a passage a clear proof of contact with Greek thought (especially Platonism and Stoicism), and of the felt need of a mediator between God and the visible world. This mode of thought, linked to the Hebrew conception of the Divine Word as the efficient expression of God\'s thought and the medium of His activity (<a onClick="return mV(\'Isa\',55,11);">Isa 55:11</a>; <a onClick="return mV(\'Psa\',33,6);">Ps 33:6</a>; <a onClick="return mV(\'Psa\',107,20);">107:20</a>), has left its mark on Philo\'s Logos-doctrine and on the New Testament Christology.<P>See <a href="./study/isbe/search.html?string=WISDOM">WISDOM</A>.<P>III. In Semi-and Non-canonical Jewish Literature.<P>In the Apocrypha, the idea of mediation is for the most part absent. We have one or two references to angelic intercession (Tobit 12:12,15), a function not attributed to angels in the Old Testament, but prominent in later apocalyptic literature (e.g. Enoch 9:10; 15:2; 40:6). The tradition of the agency of angels in the promulgation of the law is first found in the Septuagint of <a onClick="return mV(\'Deu\',33,2);">De 33:2</a> (not in the Hebrew original), but was greatly amplified in rabbinical literature (Josephus, Ant, XV, v, 3). In The Wisdom of Solomon a bold advance is made toward the conception of Wisdom as a personal mediator of creation (especially <span class="noTag">7:22-27</span>). In later Judaism, the idea of the Word is further developed. The Targums constantly refer the Divine activity to the memera\' or "Word" of God, where the Old Testament refers it to God directly, and speaks of it as Israel\'s Intercessor before God and as Redeemer. This usage seems to arise out of a reluctance to bring God into immediate contact with the world; hence, God\'s self-manifestation is represented as mediated through a quasi-personal agent. The tendency finds its full development, however, not among the Jerusalem Jews, but among the Jews of Alexandria, especially in Philo\'s Logos-doctrine. Deeply influenced by the Platonic dualism, Philo thought of God as pure Spirit, incapable of contact with matter, so that without mediation God could not act on the world. To fill up the great gap he conceived of intermediary beings which represented at once the Ideas of Plato, the active Powers of the Stoics, and the angels of the Old Testament. The highest of these was the Divine Logos, the mediator between the inaccessible, transcendent Being and the material universe. On the one hand, in relation to the world, the Logos is the Mediator of creation and of revelation; on the other, in his God-ward activity, he is the representative of the world before God, its High Priest, Intercessor, and Paraclete. Yet Philo\'s Logos was probably nothing more than a high philosophical abstraction vividly imaged in the mind. In spite of Philo\'s influence on early Christian theology, and even perhaps on some New Testament writers, his doctrine of mediation moves on quite different lines from the central New Testament doctrine, which is concerned above all with the reconciliation of God and man on account of sin, and not with the metaphysical reconciliation of the absolute and the finite world. The Mediator of Philo is an abstraction of speculative thought; the Mediator of the New Testament is a concrete historical person known to experience.<P>See <a href="./study/isbe/search.html?string=PHILO,+JUDAEUS">PHILO, JUDAEUS</a>.<P>IV. Mediation and Mediator in the New Testament.<P>The relatively independent lines of development which the conception of mediation has hitherto taken now meet and coalesce in Jesus Christ.<P>1. The Synoptic Gospels:<P>The traditional division of Christ\'s mediatorial work into that of prophet, priest and king (very common since Calvin, but now often discarded) offers a convenient method of treating the subject, though we must avoid making the division absolute, as if Christ\'s work fell apart into three separate and independent functions. The unity of the work of salvation is preserved by the fact that "no one of the offices fills up a moment of time alone, but the others are always cooperative," although "Christ\'s mediatorial work puts now this, now that side in the foreground." "The triple division is of special value, because it sets in a vivid light the continuity between the Old Testament theocracy and Christianity" (Dorner, System of Christian Doctrine, English translation, III, 385ff). These three aspects of Christ\'s mediatorship can be distinguished in the Synoptics, although the formal distinction is the work of later analysis.<P>(1) Christ as Prophet.<P>It was in the character of Prophet that He mainly impressed the common mind, which was moved to inquire "Whence hath this man this wisdom?" and by His reply, "A prophet is not without honor," etc., He virtually accepts that title (<a onClick="return mV(\'Mat\',13,54,57);">Mt 13:54,57</a>). As Prophet, Christ is the mediator of revelation; through Him alone can men come to know God as Father (<a onClick="return mV(\'Mat\',11,27);">Mt 11:27</a>) and "the mysteries of the kingdom of heaven" (<a onClick="return mV(\'Mat\',13,11);">Mt 13:11</a>). In all His teaching we feel that He speaks within the center of truth, and hence can teach with authority and not as the scribes (<a onClick="return mV(\'Mat\',7,29);">Mt 7:29</a>), who approach the truth from without. His teaching is part of His redemptive work, and not something extraneous to it, for the sin from which He redeems includes ignorance and error.<P>(2) Christ as King.<P>The official name "Christ" (equals Messiah, the anointed King) refers primarily to His kingship. The Messianic hope had taught men to look forward to the rule of God on earth instituted and administered through His representative. Christ was the fulfillment of that hope. Though He held an attitude of reserve in the matter, there can be no doubt that He conceived of Himself as the Messiah (<a onClick="return mV(\'Mar\',8,\'27-30\');">Mr 8:27-30</a>; <a onClick="return mV(\'Mar\',14,16);">14:16</a>f; compare His entry into Jerusalem as a triumphant king, <a onClick="return mV(\'Mar\',11,1);">Mr 11:1</a>; the inscription on the cross, <a onClick="return mV(\'Mar\',15,26);">Mr 15:26</a>). But it is also clear that He fundamentally modified the Messianic idea, (a) by suffusing it with the thought of vicarious suffering, and (b) by giving it an ethical and spiritual rather than a national and official significance. The note of His kingship was that of authority (<a onClick="return mV(\'Mar\',1,27);">Mr 1:27</a>; <a onClick="return mV(\'Mar\',2,10);">2:10</a>; <a onClick="return mV(\'Mat\',7,29);">Mt 7:29</a>; <a onClick="return mV(\'Mat\',28,18);">28:18</a>) exercised in the realm of truth and conscience. His kingship includes the future as well as the present; He is the arbiter of human destiny (<a onClick="return mV(\'Mat\',25,31);">Mt 25:31</a>).<P>(3) Christ as Priest (Redeemer).<P>The synoptists do not hint at the priestly analogy. Our Lord often spoke of forgiveness without mentioning Himself as the one through whom it was mediated, as if it flowed directly from the gracious heart of the Father (compare the parables of <a onClick="return mV(\'Luk\',15,\'1-\');">Lu 15</a>). But there are other passages which emphasize the close connection of His person with men\'s redemption. Men\'s attitude to Him decides absolutely their relation to God (<a onClick="return mV(\'Mat\',10,32,40);">Mt 10:32,40</a>). Rest of soul is mediated to the heavy laden through Him (<a onClick="return mV(\'Mat\',11,\'28-30\');">Mt 11:28-30</a>). He claims authority on earth to forgive sins (<a onClick="return mV(\'Mar\',2,10);">Mr 2:10</a>). We have no evidence that He spoke definitely of His death until after Peter\'s confession at Caesarea (<a onClick="return mV(\'Mar\',8,31);">Mr 8:31</a>, "began to teach," etc.), though we seem to have vague allusions earlier (e.g. the allegory of the bridegroom, <a onClick="return mV(\'Mar\',2,19,20);">Mr 2:19,20</a>). This may be partly due to conscious reserve, in accordance with the true pedagogical method by which He adapted His teaching to the progressive receptivity of His followers. But inasmuch as we must think of Him as subject to the ordinary laws of human psychology, the idea of His death must have been to Him a growth, matured partly by outward events, and partly by the development of His inner consciousness as the Suffering Messiah. In His later ministry, He frequently taught that He must suffer and die (<a onClick="return mV(\'Mar\',9,12,31);">Mr 9:12,31</a>; <a onClick="return mV(\'Mar\',10,32);">10:32</a>f; <a onClick="return mV(\'Mar\',12,8);">12:8</a>; <a onClick="return mV(\'Mar\',14,8);">14:8</a> and parallel passages; compare <a onClick="return mV(\'Mar\',10,38);">Mr 10:38</a>; <a onClick="return mV(\'Luk\',12,49);">Lu 12:49</a>f). There are two important passages which expressly connect His death with His mediatorial work. The first is <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a> (parallel <a onClick="return mV(\'Mat\',20,28);">Mt 20:28</a>), "The Son of Man came not to be ministered unto but to minister, and to give his life a ransom for many." The context shows that it was while the thought of His approaching death filled His mind that our Lord uttered these words (compare <a onClick="return mV(\'Mar\',10,33,38);">Mr 10:33,38</a>f). As to the exact meaning of ransom (lutron) there are two circles of ideas with which it may be associated. (a) It may mean a sacrificial offering, representing Hebrew kopher (literally, "covering," "propitiatory gift") which it translates several times in Septuagint (e.g. <a onClick="return mV(\'Exd\',30,12);">Ex 30:12</a>). Thus, Ritschl defines it as "an offering which, because of its specific worth to God, is a protection or coveting against sin" (Rechtfertigung und Versohnung, II, 68-88). (b) It may mean ransom price, the purchase-money paid for the emancipation of a slave. In Septuagint, lutron in most cases stands for some form of the roots ga\'al, "to deliver," padhah, "to redeem" (e.g. <a onClick="return mV(\'Lev\',25,51);">Le 25:51</a>; <a onClick="return mV(\'Num\',3,51);">Nu 3:51</a>). Hence, Wendt explains the "ransom" as the price by which Jesus redeemed His disciples from their bondage to suffering and death (Teaching of Jesus, II, 226ff). This analogy certainly suits the context better than that drawn from the Levitical ritual, for it brings out the contrast between the liberating work of Christ and the enslaving work of those who "lord it over" men. We must not press the analogy in detail or seek here an answer to the question, who was the recipient of the ransom price (e.g. whether the Devil, as many Fathers, notably Origen and Gregory of Nyssa; God, as Anselm and later theologians; the "eternal law of righteousness," as Dale). The purpose of the passage is primarily practical, not speculative. It is certainly pressing the figurative language of Jesus too far to insist that the ransom price is the exact quantitative equivalent of the lives liberated, or of the penalty they had deserved regarded as a debt. This is too prosaic and literalistic an interpretation of a passage which has its setting in the ethical rather than in the commercial realm, and which breathes a spirit closely akin to that of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>, where suffering and service are, as here, combined.<P>The other passage in which Christ definitely connects His mediatorship with His death is that which reports His words at the Last Supper (<a onClick="return mV(\'Mar\',14,\'22-24\');">Mr 14:22-24</a>; <a onClick="return mV(\'Mat\',26,\'26-28\');">Mt 26:26-28</a>; <a onClick="return mV(\'Luk\',22,19);">Lu 22:19</a>f; compare <a onClick="return mV(\'1Cr\',11,24);">1Co 11:24</a>f). The reported words are not identical in the several narratives. But even in their simplest form (in Mark), there is evidently a threefold allusion, to the paschal lamb, to the sacrifice offered by Moses at the ratification of the covenant at Sinai (<a onClick="return mV(\'Exd\',24,8);">Ex 24:8</a>), and to Jeremiah\'s prophecy of a new covenant (<a onClick="return mV(\'Exd\',31,\'1-\');">Ex 31</a>; <a onClick="return mV(\'Exd\',32,\'1-\');">32</a>; <a onClick="return mV(\'Exd\',33,\'1-\');">33</a>; <a onClick="return mV(\'Exd\',34,\'1-\');">34</a>). There can be little doubt that the paschal feast, though it does not conform in detail to any of the Levitical sacrifices, was regarded as a sacrifice, as is indicated by the blood ceremonial (<a onClick="return mV(\'Exd\',12,\'21-27\');">Ex 12:21-27</a>). The blood of the covenant, too, is sacrificial; and, as we have seen, it is probable that all blood sacrifices, and not those of the sin and guilt offerings only, were associated with propitiatory power. Wendt denies that there is here any reference to sin and its forgiveness (Teachings of Jesus, II, 241f). It must be admitted that the words in Matthew "unto remission of sins," which have no counterpart in the other reports, are probably an explanatory expansion of the words actually uttered. But they are a true interpretation of their meaning, as is attested by the fact that the new covenant of Jeremiah\'s prophecy was one of forgiveness and justification (<a onClick="return mV(\'Jer\',31,34);">Jer 31:34</a>), and that Christ speaks of His blood as shed for others. And as the Passover signified deliverance from bondage to an earthly power (Egypt), so the Supper stands for forgiveness and deliverance from a spiritual power (sin). Clearly Christ here represents Himself as the Mediator of the new covenant, through whom men are to find acceptance with God, though the exact modus operandi of His sacrifice is not indicated.<P>The Synoptics give special prominence to those historical events which are most intimately associated with Christ\'s mediatorship—not only the agony in the garden and the crucifixion, but also the resurrection and ascension (which make possible His intercessory mediation in heaven).<P>2. Primitive Apostolic Teachings:<P>(1) The Early Speeches in Acts.<P>The early speeches in Acts reveal a primitive stage of theological reflection. Yet they are essentially Christocentric. (a) It is the Messianic Kingship of Christ that is chiefly emphasized. The main thesis is that Jesus is the Messiah (the "anointed one"; compare <a onClick="return mV(\'Act\',4,27);">Ac 4:27</a>; <a onClick="return mV(\'Act\',10,38);">10:38</a>), and that His Messiahship was realized in the crucifixion and attested by the resurrection. An important feature is the use of the title "Servant" for Christ (<a onClick="return mV(\'Act\',3,13,16);">Ac 3:13,16</a>; <a onClick="return mV(\'Act\',4,27,30);">4:27,30</a>; compare <a onClick="return mV(\'Act\',8,\'30-35\');">Ac 8:30-35</a>), in evident reference to the Suffering Servant of Deutero-Isaiah. In the phrase, "thy holy Servant...whom thou didst anoint," coming immediately after the Messianic quotation, "against the Lord, and against his Anointed" (<a onClick="return mV(\'Act\',4,26);">Ac 4:26</a>f), we have a concise instance of that coalescing of the idea of the Messiah with that of the Suffering Servant which gave the Messianic idea an entirely new meaning. As Messiah, Jesus was the sole Mediator of salvation (<a onClick="return mV(\'Act\',4,12);">Ac 4:12</a>). (b) Another Old Testament type which finds its fulfillment in Jesus is that of the "prophet like unto" Moses (<a onClick="return mV(\'Act\',3,22);">Ac 3:22</a>; <a onClick="return mV(\'Act\',7,37);">7:37</a>; compare <a onClick="return mV(\'Deu\',18,15,18);">De 18:15,18</a>). (c) But the priestly functions of Christ are not explicitly touched on. The questions are not faced, What is the God-ward significance of His death? How is it effective for man\'s salvation? It is rather the man-ward significance that is made explicit, i.e. Jesus as Messiah mediates salvation to men from His place of exaltation at the right hand of God. Yet the germs of a God-ward mediation are found in the identification of the Messiah with the Suffering Servant.<P>(2) Epistles of James and Jude.<P>In these epistles the doctrine of Christ\'s mediation does not occupy a prominent place. To James, Christianity is the culmination of Judaism. Christ\'s mediatorial functions are set forth more by way of presupposition than by explicit statement, and the whole weight is laid on the kingly and prophetic offices. The Messiahship of Jesus is assumed to such an extent that the title "Christ" has become part of the proper name, and His Lordship is also implied (<a onClick="return mV(\'Jas\',1,1);">1:1</a>; <a onClick="return mV(\'Jas\',2,1);">2:1</A>). Nothing definite is said of His function in salvation; it is God Himself who regenerates, but the medium of regeneration is "the word of truth," "the implanted word" (<a onClick="return mV(\'Jas\',1,18,21;">1:18,21</A>), which<P>must refer to the word which Jesus had preached. This implies that Jesus as prophetic teacher is the Mediator of salvation. Nothing is said of the death on the cross or its saving significance. The Epistle of Jude assumes the Lordship of Christ, through whom God\'s Saviourhood works, and whose mercy results in eternal life (<a onClick="return mV(\'Jud\',1,4,21,25);">1:4,21,25</a>).<P>(3) 1 Peter.<P>In 1 Peter we have the early apostolic teaching touched with Paulinism. The fact that salvation is mediated through the sufferings and death of Christ is now explicitly stated. Christ has suffered for sins once for all, the righteous for the unrighteous (<a onClick="return mV(\'1Pe\',3,18);">3:18</A>). The suffering has significance both God-ward and man-ward. Relatively to God it is a sacrificial offering which opens up a way of access to Him; He suffered "that he might bring us to God" (<a onClick="return mV(\'1Pe\',3,18);">3:18</A>), and that through His representative priesthood the ideal "holy priesthood" of all God\'s people might be realized, for it is "through Jesus Christ" that men\'s "spiritual sacrifices" become "acceptable to God" (<a onClick="return mV(\'1Pe\',2,5);">2:5</a>). So the elect are sprinkled with the blood of Christ, i.e. brought into communion with God by His sacrifice (<a onClick="return mV(\'1Pe\',1,2);">1:2</a>). Relatively to man, it is a means of ransoming or liberating man from the bondage compare sin. "Knowing that ye were redeemed (elutrothete, literally, "ransomed," from lutron, "ransom," an echo of <a onClick="return mV(\'Mar\',10,45);">Mr 10:45</a>)...with precious blood, as of a lamb without blemish and without spot" (<a onClick="return mV(\'1Pe\',1,18,19);">1Pe 1:18,19</a>). The sacrificial language is simple and undeveloped, and it is not clear whether the figure of "lamb" implies a reference to the paschal lamb or to <a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a>, or to both. The effect on man is, however, clear. Christ "bare our sins in his body upon the tree, that we, having died unto sins, might live unto righteousness; by whose stripes ye were healed" (<a onClick="return mV(\'1Pe\',2,24);">1Pe 2:24</a>; see the whole passage, <a onClick="return mV(\'1Pe\',2,\'21-24\');">1Pe 2:21-24</a>, reminiscent of the figure of the Suffering Servant of <a onClick="return mV(\'Isa\',53,\'1-\');">Isa 53</a>).<P>3. Epistles of Paul:<P>Christ\'s mediatorship stands at the very center of Paul\'s gospel; this in spite of the fact that only once does he apply the term "mediator" to Christ (<a onClick="return mV(\'1Ti\',2,5);">1Ti 2:5</a>), and that in the only other passage where he uses the word, he applies it to Moses, in a sense which might seem to be inconsistent with the idea of Christ\'s mediatorship, namely, where he discusses the relation of law to promise. The law was "ordained through angels by the hand of a mediator. Now a mediator is not...of one; but God is one" (<a onClick="return mV(\'Gal\',3,19,20);">Ga 3:19,20</a>).<P>This passage has had to undergo about 300 different interpretations. The view that the "mediator" here is Christ (Origen, Augustine and most of the Fathers, Calvin, etc.) is clearly untenable. Modern exegetes agree that the reference is to Moses (compare <a onClick="return mV(\'Lev\',26,46);">Le 26:46</a>, where the Septuagint has "by the hand of Moses"; Philo calls Moses "mediator and reconciler," De Vit. Moys, iii.19), who, according to a rabbinical tradition, received the Law through the intermediation of angles (compare <a onClick="return mV(\'Act\',7,53);">Ac 7:53</a>; <a onClick="return mV(\'Hbr\',2,2);">Heb 2:2</a>). Nor is it likely that Paul meant the reader to realize the glory of the law and the solemnity of its ordination (Meyer). The point is rather the inferiority of the law to the evangelical promise to Abraham. Mediation implies at least two parties between whom it is carried on. The law was given by a double mediatorship, that of the angels and that of Moses, and was thus two removes from its Divine source. But in relation to the promise God stood alone, i.e. acted freely, unconditionally, independently, and for Himself alone. The promise is no agreement between two, buy the free gift of the one God (so Schleiermacher, Lightfoot, etc.). This is by no means a denial of the Divine origin of the law (Ritschl), for the mediation of angels and of Moses was Divinely authorized; but it does seem to make the method of mediation inferior to that of the direct communication of God\'s gracious will to man. Paul is not, however, treating of the principle of mediation in the abstract, but only that form of it which implies a contract between two parties. Christ is not Mediator in the same sense as Moses, for the free and unconditioned character of the forgiving grace which Christ mediates is by no means diminished by the fact of His mediation.<P>What, then, is Paul\'s positive teaching on Christ\'s Mediatorship?<P>(1) The Need of a Mediator:<P>The need of a Mediator arises out of the fact of sin. Sin interrupts the harmonious relation between God and man. It results in a state of mutual alienation. On the one hand, man is in a state of enmity to God (<a onClick="return mV(\'Rom\',5,10);">Ro 5:10</a>; <a onClick="return mV(\'Rom\',8,7);">8:7</a>; <a onClick="return mV(\'Col\',1,21);">Col 1:21</a>). On the other hand, God is moved to righteous wrath in relation to the sinner (<a onClick="return mV(\'Rom\',1,18);">Ro 1:18</a>; <a onClick="return mV(\'Rom\',5,9);">5:9</a>; <a onClick="return mV(\'Eph\',5,6);">Eph 5:6</a>; <a onClick="return mV(\'Col\',3,6);">Col 3:6</a>). Hence, the need of a mutual change of attitude, a removal of God\'s displeasure against the sinner as well as of the sinner\'s hostility to God. God could not restore man to favor by a mere fiat, without some public exhibition of Divine righteousness, and vindication of His character as not indifferent to sin (compare <a onClick="return mV(\'Rom\',3,25,26);">Ro 3:25,26</a>). Such exhibition demanded a Mediator.<P>(2) The Qualifications:<P>The qualification of Christ to be the Mediator depends on His intimate relation to both parties at variance.<P>(a) Christ\'s Relation to Man:<P>Firstly, He is Himself a man, i.e. not merely "man" generically, but an individual man. The "one mediator between God and men" is "himself man, Christ Jesus" (<a onClick="return mV(\'1Ti\',2,5);">1Ti 2:5</a>), "born of a woman" (<a onClick="return mV(\'Gal\',4,4);">Ga 4:4</a>), "in the likeness of sinful flesh" (<a onClick="return mV(\'Rom\',8,3);">Ro 8:3</a>, where the word "likeness" does not make "flesh" unreal, but qualifies "sinful"), i.e. bore to the eye the aspect of an ordinary man; secondly, He bore a particular relation to a section of humanity, the Jews (<a onClick="return mV(\'Rom\',1,3);">Ro 1:3</a>; <a onClick="return mV(\'Rom\',9,5);">9:5</a>); thirdly, He bore a universal relation to mankind in general. He was more than an individual among many, like a link in a chain. He was the Second Adam, the archetypal, universal, representative Man, whose actions therefore had significance beyond Himself and were ideally the actions of humanity, just as Adam\'s act had, on a lower plane, a significance for the whole race (<a onClick="return mV(\'Rom\',5,\'12-21\');">Ro 5:12-21</a>; <a onClick="return mV(\'1Cr\',15,22,45);">1Co 15:22,45</a>).<P>(b) His Relation to God:<P>Paul very frequently speaks of Christ as the "Son of God," and that in a unique sense. Moreover, He was the "image of God" (<a onClick="return mV(\'2Cr\',4,4);">2Co 4:4</a>; <a onClick="return mV(\'Col\',1,15);">Col 1:15</a>), and subsisted originally "in the form of God" (<a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>). He is set alongside with God over against idols (<a onClick="return mV(\'1Cr\',8,5,6);">1Co 8:5,6</a>), and is coordinated with God in the benediction (<a onClick="return mV(\'2Cr\',13,14);">2Co 13:14</a>). Clearly Paul sets Him in the Divine sphere over against all that is not God. Yet he assigns Him a certain subordination, and even asserts that His mediatorial kingship will come to an end, that God may be all in all (<a onClick="return mV(\'1Cr\',15,24,28);">1Co 15:24,28</a>). But this cessation of His function as Mediator of salvation, when its end shall have been attained, cannot affect His Divine dignity, "since the mediatorial sovereignty which is now ceasing was not its cause, but its consequence" (B. Weiss, II, 396).<P>(3) The Means, the Death of Christ:<P>The means of effecting the reconciliation was mainly the death on the cross. Paul emphasizes the mediating value of the death both on its objective (God-ward) side and on its subjective (man-ward) side. First, it is the objective ground of forgiveness and favor with God. On the basis of what Christ has done, God ceases to reckon to men their sins (<a onClick="return mV(\'2Cr\',5,19);">2Co 5:19</a>). Paul\'s view of the death may be seen by considering some of his most characteristic expressions.<P>(a) It is an act of reconciliation. This involves a change of attitude, not only in man, but in God, a relinquishing of the Divine wrath without which there can be no restoration of peaceful relations (though this is disputed by many, e.g. Ritschl, Lightfoot, Westcott, Beyschlag), but not a change of nature or of intention, for the Divine wrath is but a mode of the eternal love, and moreover it is the Father Himself who provides the means of reconciliation and undertakes to accomplish it (<a onClick="return mV(\'2Cr\',5,19);">2Co 5:19</a>; compare <a onClick="return mV(\'Col\',1,20,21);">Col 1:20,21</a>; <a onClick="return mV(\'Eph\',2,16);">Eph 2:16</a>).<P>(b) It is an act of propitiation (<a onClick="return mV(\'Rom\',3,25);">Ro 3:25</a>, hilasterion, from hilaskesthai, "to render favorable" or "propitious"). Here there is a clear though tacit reference to a change of attitude on God\'s part. He who was not formerly propitious to man was appeased through the death of Christ. Yet the propitiatory means are provided by God Himself, who takes the initiative in the matter ("whom God set forth," etc.).<P>(c) It is a ransom. The Mediator "gave himself a ransom for all" (<a onClick="return mV(\'1Ti\',2,6);">1Ti 2:6</a>). The idea of payment of a ransom price is clearly implied in the word "redemption" (<a onClick="return mV(\'Rom\',3,24);">Ro 3:24</a>; <a onClick="return mV(\'1Cr\',1,30);">1Co 1:30</a>; <a onClick="return mV(\'Eph\',1,7);">Eph 1:7</a>; <a onClick="return mV(\'Col\',1,14);">Col 1:14</a>, apolutrosis, from lutron, "ransom"). It is not alone the fact of liberation (Westcott, Ritschl), but also the cost of liberation that is referred to. Hence, Christians are said to be "redeemed," "bought with a price" (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>; <a onClick="return mV(\'Gal\',4,5);">4:5</a>; <a onClick="return mV(\'1Cr\',6,20);">1Co 6:20</a>; <a onClick="return mV(\'1Cr\',7,23);">7:23</a>; compare <a onClick="return mV(\'1Pe\',1,18);">1Pe 1:18</a>f). Yet the metaphor cannot be pressed to yield an answer to the question to whom the ransom was paid. All that can safely be said is that it expresses the tremendous cost of our salvation, namely, the self-surrendered life ("the blood") of Christ.<P>(d) Strong substitutionary language is sometimes used, notably in <a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a> ("having become a curse for us") and in <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a> ("Him who knew no sin he made to be sin on our behalf"). But the sinless substitute is not regarded as actually punished (that would be a moral contradiction). His death was not penal substitution, but a substitute for penalty. It had the value to God of the punishment of sinners, in virtue of His oneness with the race. It was the recognition from within humanity of the sinfulness of sin, and expressed the Divine righteousness as fully as penalty would have done. The secret seems to be Christ\'s sympathetic love by which He identified Himself with man\'s sin and doom of death.<P>(e) Sacrificial language is used, as in <a onClick="return mV(\'1Cr\',5,7);">1Co 5:7</a>; <a onClick="return mV(\'Eph\',5,2);">Eph 5:2</a>, and in the references to Christ\'s "blood." Not often, however, does Paul explicitly speak of the death in terms of the Levitical ritual, which would be less congenial to his mind than the prophetic conception of the Suffering Servant. Yet he does seem to regard the death of Christ as the culmination of all that the sacrifices of the Old Testament had imperfectly realized. Secondly, the subjective aspect of Christ\'s work is emphasized quite as much as the objective. The death of Christ, being inwardly assimilated by faith, becomes to the believer the principle of ethical transformation, so that he may become worthy of the Divine favor which he now enjoys. As a result of his subjective identity with Christ through faith, the objective state of privilege is changed into actual liberation from sin (<a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>; <a onClick="return mV(\'Gal\',6,14);">6:14</a>; <a onClick="return mV(\'Rom\',6,6,7);">Ro 6:6,7</a>; <a onClick="return mV(\'Col\',3,3);">Col 3:3</a>).<P>(4) The Resurrection and Exaltation:<P>The resurrection and exaltation of Christ are essential to His mediatorial work (<a onClick="return mV(\'1Cr\',15,17);">1Co 15:17</a>). It is not alone that the resurrection "proves that the death of Christ was not the death of a sinner, but the vicarious death of the sinless Mediator of salvation" (B. Weiss, I, 436), but that salvation cannot be realized except through communion with the living, glorified Christ, without which the subjective identity of the believer with Christ by which redemption is personally appropriated would not be possible (<a onClick="return mV(\'Gal\',2,20);">Ga 2:20</a>; <a onClick="return mV(\'Rom\',6,4,5);">Ro 6:4,5</a>; <a onClick="return mV(\'Phl\',3,10);">Php 3:10</a>; <a onClick="return mV(\'Col\',3,1);">Col 3:1</a>). The exaltation also makes possible His continuous heavenly intercession on our behalf (<a onClick="return mV(\'Rom\',8,34);">Ro 8:34</a>), which is the climax of His mediatorial activities.<P>(5) The Cosmic Aspect of Christ\'s Mediatorship:<P>In his later epistles (especially Colossians and Ephesians), Paul lays stress on Christ\'s mediatorial activity in creation and providence, though the germs of his later teaching are found in the earlier epistles (<a onClick="return mV(\'1Cr\',8,6);">1Co 8:6</a>). He is resisting a kind of nascent Gnostic dualism, according to which God could communicate with the world only through a hierarchy of intermediate powers. Against this he proclaims Christ as the one and only Mediator between God and the universe, having, on the one hand, a unique relation to God ("the image of the invisible God," <a onClick="return mV(\'Col\',1,15);">Col 1:15</a>; in whom the fullness of God dwells, <a onClick="return mV(\'Col\',1,19);">1:19</a>; <a onClick="return mV(\'Col\',2,9);">2:9</a>), and, on the other hand, a unique relation to the world, as its creative agent, its immanent principle of unity, and its ultimate goal (<a onClick="return mV(\'Col\',1,\'15-17\');">Col 1:15-17</a>). Here the apostle shows affinity with the Logos-doctrine of Philo, though the differences are marked and fundamental. Corresponding to this wider view of Christ\'s person, there is a wide view of the reconciliation wrought through Him. It even extends to the world beyond man, and restores the broken harmony of the universe (<a onClick="return mV(\'Col\',1,20);">Col 1:20</a>; <a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>).<P>4. Epistle to the Hebrews:<P>The main thesis of Hebrews is the absoluteness and finality of the gospel and its superiority over Judaism. The finality of Christianity depends on the fact that it has a perfect Mediator, who is the substance of which the various Jewish forms of mediation were types and shadows. He illustrates this by a series of contrasts between Christ and the mediators of the old system (by the application of principles and exegetical methods which reveal the influence of the school of Philo). In each contrast, Christ\'s superiority is based on His Sonship.<P>(1) Christ is superior to the prophets as Mediator of revelation. The Old Testament revelation was fragmentary and multiform, while now God speaks, not through many agents, but through One, and that one a Son. As Son He is the perfectly adequate expression of the Father. The author takes us at once to the high transcendental sphere of Christ\'s relations to God and the universe, in virtue of which He is God\'s Mediator in creation, providence, revelation and redemption (<a onClick="return mV(\'Hbr\',1,\'1-3\');">Heb 1:1-3</a>).<P>(2) He is superior to the angels, through whose mediation the law was given (<a onClick="return mV(\'Hbr\',1,\'4-14\');">Heb 1:4-14</a>).<P>(3) He is superior to Moses, the human agent in the giving of the law (<a onClick="return mV(\'Hbr\',3,\'1-6\');">Heb 3:1-6</a>). (4) He is greater than Aaron the high priest, the people\'s representative before God. This leads to the central doctrine of the epistle, the high-priesthood of Jesus. The following are the salient points in the elaborate treatment of this subject:<P>(1) Christ\'s Qualification for the High-Priesthood Is Twofold:<P>(a) His participation in all human experience (except sin), which guarantees His power of sympathy. Every high priest, as men\'s representative before God, must be "taken from among men" (<a onClick="return mV(\'Hbr\',5,1);">Heb 5:1</a>). Hence, the author lays great stress on the human nature and experiences of Christ (compare <a onClick="return mV(\'Hbr\',2,10,17,18);">Heb 2:10,17,18</a>; <a onClick="return mV(\'Hbr\',4,15);">4:15</a>; <a onClick="return mV(\'Hbr\',5,7,8);">5:7,8</a>).<p>(b) His Divine appointment. Every priest must have a call from God. So Christ has been appointed priest, not indeed in the Aaronic line, but after the order of Melchizedek (<a onClick="return mV(\'Hbr\',5,\'1-10\');">Heb 5:1-10</a>).<P>(2) The Nature of His Priesthood, Its Superiority to the Levitical Priesthood.<P>The priests of the Old Testament themselves needed atonement, for they were not sinless; Christ is holy, guileless, undefiled, and need not make atonement for His own sins. They were priests only for a time, and were many in number, for they were mortal; but He abideth forever, and His priesthood is eternal. They were dependent on the law of physical descent; He was a priest after the order of Melchizedek, whose priesthood did not depend on genealogy or pedigree, and who combined the functions of king with those of priest. In a word, their order was transient, temporary, shadowy; His belonged to the world of unchanging reality (<a onClick="return mV(\'Hbr\',7,\'1-\');">Heb 7</a>).<P>(3) The Realization of His High-Priesthood.<P>A high priest implies a sacrifice; hence, Christ must "have somewhat to offer" (<a onClick="return mV(\'Hbr\',8,3);">Heb 8:3</a>). In the Levitical system, the priest and the sacrifice are distinct from each other. But Christ offered not an external gift, but Himself. Much stress is laid on Christ\'s voluntary obedience (<a onClick="return mV(\'Hbr\',5,8);">Heb 5:8</a>; <a onClick="return mV(\'Hbr\',10,7);">10:7</a>), progressively attained through suffering, and culminating in the absolute surrender of His life ("blood") in death. His sacrifice harmonizes with the principle that "apart from shedding of blood there is no remission" (<a onClick="return mV(\'Hbr\',9,22);">Heb 9:22</a>), although the principle is lifted from the physical to the spiritual realm. In working this out, the author makes use of analogies drawn from three parts of the Levitical ritual.<P>(a) Christ\'s death was a sin offering. He has offered one final sacrifice for sins (<a onClick="return mV(\'Hbr\',10,12,18);">Heb 10:12,18</a>). As priest, he has "made propitiation for the sins of the people" (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>); as victim He was "once (for all) offered to bear the sins of many" (<a onClick="return mV(\'Hbr\',9,28);">Heb 9:28</a>).<P>(b) The Sinaitic covenant (<a onClick="return mV(\'Exd\',24,8);">Ex 24:8</a>) is made use of. Christ is "the mediator of a new (better) covenant" (<a onClick="return mV(\'Hbr\',8,6);">Heb 8:6</a>; <a onClick="return mV(\'Hbr\',9,15);">9:15</a>; <a onClick="return mV(\'Hbr\',12,24);">12:24</a>), i.e. the agent interposing between God and man in the establishment of a new relationship analogous to Moses in the old covenant. Even the first covenant was dedicated with blood, and so the blood of the Son of God was "the blood of the covenant" (<a onClick="return mV(\'Hbr\',10,29);">Heb 10:29</a>; compare <a onClick="return mV(\'Mar\',14,24);">Mr 14:24</a>). On the double meaning of the word diatheke ("covenant," "testament"), the author bases a twofold argument for the necessity of Christ\'s death (<a onClick="return mV(\'Hbr\',9,15);">Heb 9:15</a>).<P>(c) The ritual of the Day of Atonement furnishes another analogy. As the high priest once a year entered the most holy place of the earthly people, so Christ has entered once for all the true spiritual sanctuary in heaven, and there He presents Himself to God as the Mediator able to make intercession for us with the Father (<a onClick="return mV(\'Hbr\',9,12);">Heb 9:12</a>,<a onClick="return mV(\'Hbr\',9,\'24-26\');">24-26</a>; compare <a onClick="return mV(\'Hbr\',7,25);">Heb 7:25</a>). He is a ministering priest in the true tabernacle, the immediate presence of God (<a onClick="return mV(\'Hbr\',8,2);">Heb 8:2</a>). Thus the ascension and session make possible the culmination of the mediatorial work of Christ in the eternal sacrifice and intercession within the veil.<P>(4) The Man-ward Efficacy of His Mediatorship.<P>The effect of Christ\'s death on man is described by the words "cleanse," "sanctify," "perfect" (<a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a>; <a onClick="return mV(\'Hbr\',10,10,14,29);">10:10,14,29</a>; <a onClick="return mV(\'Hbr\',13,12);">13:12</a>), words which have a ritualistic quite as much as an ethical sense, meaning the removal of the sense of guilt, dedication to God, and the securing of the privilege of full fellowship with Him. The ultimate blessing that comes to man through the work of Christ is the privilege of free, unrestricted access to God by the removal of the obstacle of guilt (<a onClick="return mV(\'Hbr\',4,16);">Heb 4:16</a>; <a onClick="return mV(\'Hbr\',10,19);">10:19</a>).<P>5. The Johannine Writings:<P>(1) The Fourth Gospel.<P>Aspects of our Lord\'s teaching unassimilated by the other disciples, and therefore but meagerly touched on in the Synoptics, find prominence in the Gospel of John, but colored by his own meditations. Great emphasis is laid on the idea of salvation by revelation mediated through Jesus Christ. The historical revelation of God in the person and teaching of Jesus is the main subject of the Gospel. But in the Prologue we have the eternal background of the historical manifestation in the doctrine of the Logos, who, as Son in eternal fellowship with the Father, His mediator in creation, and the immanent principle of revelation in the world, is fitted to become God\'s Revealer in history (<a onClick="return mV(\'Jhn\',1,\'11-17\');">1:11-18</A>). His work on earth is to dispense light and life, knowledge of God and salvation. Through Him God gives to the world eternal life (<a onClick="return mV(\'Jhn\',3,16);">3:16</A>). He is the Water of Life (<a onClick="return mV(\'Jhn\',4,14);">4:14</A>; <a onClick="return mV(\'Jhn\',7,37);">7:37</A>), the Bread of Life (<a onClick="return mV(\'Jhn\',6,48);">6:48</A>ff), the Light of the World (<a onClick="return mV(\'Jhn\',8,12);">8:12</A>); it is by inward appropriation of Him that salvation is mediated to men (<a onClick="return mV(\'Jhn\',6,52);">6:52</a>ff). He is the perfect revealer of God, hence, the only means of access to the Father (<a onClick="return mV(\'Jhn\',14,6,9);">14:6,9</A>). It is on salvation by illumination and communion, rather than on salvation by reconciliation and atonement that chief stress is laid. Sacrificial or propitiatory language is not used of Christ\'s death. Yet emphasis is laid on the voluntary and vicarious character of His death. He lays down His life of Himself (<a onClick="return mV(\'Jhn\',10,18);">10:18</a>); "The good shepherd layeth down his life for (equals on behalf of) the sheep" (<a onClick="return mV(\'Jhn\',10,11);">10:11</A>; compare <a onClick="return mV(\'Jhn\',15,13);">15:13</a>). Christ\'s death was the supreme example of the law that self-sacrifice is necessary to the highest and most fruitful life (<a onClick="return mV(\'Jhn\',12,23);">12:23</A>ff). In <a onClick="return mV(\'Jhn\',17,\'1-\');">John 17</a> we have a unique instance of our Lord\'s intercessory prayer.<P>(2) The Epistles.<P>In 1 John we find more explicit statements with regard to the connection between the death of Christ and sin. "The blood of Jesus his Son cleanseth us from all sin" (<a onClick="return mV(\'1Jo\',1,7);">1:7</A>); "He was manifested to take away sins" (<a onClick="return mV(\'1Jo\',3,5);">3:5</A>); "If any man sin, we have an Advocate with the Father," i.e. a pleader who will mediate with God on our behalf, the ground of His intercessory efficacy being that He is the "propitiation for our sins" (<a onClick="return mV(\'1Jo\',2,2);">2:2</A>; <a onClick="return mV(\'1Jo\',4,10);">4:10</A>, a term which links the Johannine doctrine to that of Paul, t
