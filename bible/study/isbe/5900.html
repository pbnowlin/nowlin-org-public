hough 1 John represents Christ Himself, and not merely His death on the cross, as the propitiation). This latter term shows that an objective value is attached to the atonement, as in some way neutralizing or making amends for sin in the eyes of God, yet in such a way as not to contradict the principles of righteousness (compare "Jesus Christ the righteous," <a onClick="return mV(\'1Jo\',2,1);">2:1</A>).<P>(3) The Apocalypse.<P>The Apocalypse presents both aspects of Christ\'s mediation. On the one hand, He is associated with God in the government of the world and in judgment (<a onClick="return mV(\'Rev\',3,21);">Re 3:21</a>; <a onClick="return mV(\'Rev\',7,10);">7:10</a>; <a onClick="return mV(\'Rev\',6,16);">6:16</a>), holds the keys of death and Hades (<a onClick="return mV(\'Rev\',1,18);">Re 1:18</a>), is the Lord of lords and King of kings (<a onClick="return mV(\'Rev\',17,14);">Re 17:14</a>; <a onClick="return mV(\'Rev\',19,16);">19:16</a>), and is the Mediator of creation (<a onClick="return mV(\'Rev\',3,14);">Re 3:14</a>). On the other hand, by His sacrificial act He represents men before God. The most characteristic expression of this is the title "the Lamb" (29 times). By His blood the guilty are cleansed and made saints, purchased unto God (<a onClick="return mV(\'Rev\',5,9);">Re 5:9</a>; <a onClick="return mV(\'Rev\',7,14);">7:14</a>). The lamb is the symbol of the sacrificial love which is the heart of God\'s sovereignty (<a onClick="return mV(\'Rev\',5,6);">Re 5:6</a>). It is not clear whether the allusion in this title is to the paschal lamb or to the Suffering Servant pictured as a lamb led to the slaughter (<a onClick="return mV(\'Isa\',53,7);">Isa 53:7</a>), or to both. In any case it contains the idea of Christ\'s redemptive sacrifice, which is declared to be an essential part of God\'s eternal counsel (<a onClick="return mV(\'Rev\',13,8);">Re 13:8</a> margin, "the Lamb that hath been slain from the foundation of the world").<P>V. Conclusion.<P>Our inquiry will have shown how central and prominent is the idea of mediation throughout the Scriptures. We might even say it supplies the key to the unity of the Bible. In the Old Testament the principle is given "in divers portions and in divers manners," but in the New Testament it converges in the doctrine of the person and work of the One final Mediator, the Son of God. Amid all the rich diversity of the various parts of the New Testament, there is one fundamental conception common to all, that of Christ as at once the interpreter of God to men and the door of access for men to God. Especially is Christ\'s self-sacrifice presented as the effective cause of our salvation, as a means of removing the guilt and sin which stand as a barrier in the way of God\'s purpose concerning man and of man\'s fellowship with God. There is a tendency in some influential writers of today to speak disparagingly of the doctrine of the one Mediator, on the ground that it injures the direct relationship of man with God (e.g. R. Eucken, Truth of Religion, 583ff). Here we can reply only that the doctrine properly defined is attested in universal Christian experience, and that, so far from standing in the way of our personal approach to God, it is a simple historical fact that apart from the work of Jesus we would not enjoy that free access to Him which is now our privilege.<P>LITERATURE.<P>Besides the commentaries, such works on Old Testament Theology as those of Oehler, Schultz, A.B. Davidson, and on New Testament Theology by B. Weiss, Beyschlag, Holtzmann, W.B. Stevens, Weinel; Wendt, The Teaching of Jesus; A.B. Bruce, Paul\'s Conception of Christianity and The Epistle to the Hebrews; J. Denney, The Death of Christ; Du Bose, The Gospel in the Gospels, The Gospel according to Paul, High-Priesthood and Sacrifice. For the idea of mediation in Jewish religion, Oesterley, The Jewish Doctrine of Mediation; Toy, Judaism and Christianity. Much material on the Biblical doctrine may be found in such works as Dorner, System of Christian Doctrine; Ritschl, Die christliche Lehre von der Rechtfertigung und Versohnung, 3 volumes (Volumes I and III, English translation); Dale, The Atonement; McLeod Campbell, The Nature of the Atonement; F.D. Maurice, The Doctrine of Sacrifice; Moberly, Atonement and Personality; J. Scott Lidgett, The Spiritual Principle of the Atonement; G.B. Stevens, Christian Doctrine of Salvation; articles in HDB, DCG, and in this Encyclopedia on "Mediation"; "Mediator"; "Atonement"; "Messiah"; "Propitiation"; "Prophets"; "Priests"; "Ransom"; "Reconciliation"; "Sacrifice"; Salvation," etc.``49';
isbe[5906]='Medicine`med\'-i-sin, med\'-i-s\'-n (gehah, teruphah, rephu\'ah): These words are used in the sense of a remedy or remedies for disease. In <a onClick="return mV(\'Pro\',17,22);">Pr 17:22</a> the King James Version, a merry heart is said to do good "like a medicine." There is an alternative reading in the King James Version margin, "to a medicine," the Revised Version (British and American) "is a good medicine"; the Revised Version margin gives another rendering, "causeth good healing," which is the form that occurs in the Septuagint and which was adopted by Kimchi and others. Some of the Targums, substituting a waw for the first h in gehah, read here "doeth good to the body," thus making this clause antithetic to the latter half of the verse. In any case the meaning is that a cheerful disposition is a powerful remedial agent.<P>In the figurative account of the evil case of Judah and Israel because of their backsliding (<a onClick="return mV(\'Jer\',30,13);">Jer 30:13</a>), the prophet says they have had no rephu\'ah, or "healing medicines." Later on (<a onClick="return mV(\'Jer\',46,11);">Jer 46:11</a>), when pronouncing the futility of the contest of Neco against Nebuchadrezzar, Jeremiah compares Egypt to an incurably sick woman going up to Gilead to take balm as a medicine, without any benefit. In Ezekiel\'s vision of the trees of life, the leaves are said (the King James Version) to be for medicine, the Revised Version (British and American) reads "healing," thereby assimilating the language to that in <a onClick="return mV(\'Rev\',22,2);">Re 22:2</a>, "leaves of the tree...for the healing of the nations" (compare <a onClick="return mV(\'Eze\',47,12);">Eze 47:12</a>).<P>Very few specific remedies are mentioned in the Bible. "Balm of Gilead" is said to be an anodyne (<a onClick="return mV(\'Jer\',8,22);">Jer 8:22</a>; compare <a onClick="return mV(\'Jer\',51,8);">Jer 51:8</a>). The love-fruits, "mandrakes" (<a onClick="return mV(\'Gen\',30,14);">Ge 30:14</a>) and "caperberry" (<a onClick="return mV(\'Ecc\',12,5);">Ec 12:5</a> margin), myrrh, anise, rue, cummin, the "oil and wine" of the Good Samaritan, soap and sodic carbonate ("natron," called by mistake "nitre") as cleansers, and Hezekiah\'s "fig poultice" nearly exhaust the catalogue. In the Apocrypha we have the heart, liver and gall of Tobit\'s fish (Tobit 6:7). In the Egyptian pharmacopoeia are the names of many plants which cannot be identified, but most of the remedies used by them were dietetic, such as honey, milk, meal, oil, vinegar, wine. The Babylonian medicines, as far as they can be identified, are similar. In the Mishna we have references to wormwood, poppy, hemlock, aconite and other drugs. The apothecary mentioned in the King James Version (<a onClick="return mV(\'Exd\',30,25);">Ex 30:25</a>, etc.) was a maker of perfumes, not of medicines. Among the fellahin many common plants are used as folk-remedies, but they put most confidence in amulets or charms, which are worn by most Palestinian peasants to ward off or to heal diseases.``107';
isbe[5907]='Meditation`med-i-ta\'-shun (haghuth, sichah): "Meditation" is the translation of haghuth, from haghah, "to murmur," "to have a deep tone," hence, "to meditate" (<a onClick="return mV(\'Psa\',49,3);">Ps 49:3</a>); of haghigh, "sighing," "moaning" (<a onClick="return mV(\'Psa\',5,1);">Ps 5:1</a>; see <a onClick="return mV(\'Psa\',5,2);">Ps 5:2</a>); of higgayon, "the murmur" or dull sound of the harp, hence, meditation (<a onClick="return mV(\'Psa\',19,14);">Ps 19:14</a>, "Let...the meditation of my heart be acceptable in thy sight"); of siach, "speech," "meditation" (<a onClick="return mV(\'Psa\',104,34);">Ps 104:34</a>, "Let my meditation be sweet unto him"); of sichah, a "bowing down," "musing" (<a onClick="return mV(\'Psa\',119,97,99);">Ps 119:97,99</a>; 2Es 10:5). "To meditate" is the translation of haghah (<a onClick="return mV(\'Jos\',1,8);">Jos 1:8</a>; <a onClick="return mV(\'Psa\',1,2);">Ps 1:2</a>; <a onClick="return mV(\'Psa\',63,6);">63:6</a>; <a onClick="return mV(\'Isa\',33,18);">Isa 33:18</a> the King James Version); of suach (<a onClick="return mV(\'Gen\',24,63);">Ge 24:63</a>); of siach (<a onClick="return mV(\'Psa\',119,15,23);">Ps 119:15,23</a>, etc.; <a onClick="return mV(\'Psa\',143,5);">Ps 143:5</a>, the King James Version "muse"; <a onClick="return mV(\'1Ch\',16,9);">1Ch 16:9</a>; <a onClick="return mV(\'Psa\',105,2);">Ps 105:2</a> margin). In Apocrypha we have "to meditate" (Ecclesiasticus 14:20, "Blessed is the man that shall mediate in wisdom," the Revised Version margin "most authorities read come to an end" (teleutesei); Ecclesiasticus 39:1, "meditateth in the law of the Most High" (dianoeomai)). The lack of meditation is a great want in our modern religious life. In the New Testament, we have "to meditate" (promeletao, "to take care beforehand"), <a onClick="return mV(\'Luk\',21,14);">Lu 21:14</a>, and "meditate" (meletao, "to take care"), <a onClick="return mV(\'1Ti\',4,15);">1Ti 4:15</a> the King James Version (the Revised Version (British and American) "be diligent"); compare <a onClick="return mV(\'Phl\',4,8);">Php 4:8</a>; <a onClick="return mV(\'Col\',3,2);">Col 3:2</a>.``185';
isbe[5908]='Mediterranean Sea`med-i-te-ra\'-ne-an (he thalassa): To the Hebrews the Mediterranean was the sea, as was natural from their situation.<P>Hence, they speak of it simply as "the sea" (ha-yam), e.g. <a onClick="return mV(\'Gen\',49,13);">Ge 49:13</a>; <a onClick="return mV(\'Num\',13,29);">Nu 13:29</a>; <a onClick="return mV(\'Num\',34,5);">34:5</a>; <a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a>; or, again, it is "the great sea" (ha-yam ha-gadhol, e.g. <a onClick="return mV(\'Num\',34,6,7);">Nu 34:6,7</a>; <a onClick="return mV(\'Jos\',9,1);">Jos 9:1</a>; <a onClick="return mV(\'Jos\',15,12,47);">15:12,47</a>; <a onClick="return mV(\'Eze\',47,10,15,19,20);">Eze 47:10,15,19,20</a>; <a onClick="return mV(\'Eze\',48,28);">48:28</a>); or, because it lay to the west of Palestine, as "the great sea toward the going down or the sun" (<a onClick="return mV(\'Jos\',1,4);">Jos 1:4</a>; <a onClick="return mV(\'Jos\',23,4);">23:4</a>), and, since the west was regarded as the "back," in contrast to the east as the "front," as "hinder (or "western" the Revised Version (British and American), "uttermost" or "utmost" the King James Version) sea" (ha-yam ha-\'acharon), <a onClick="return mV(\'Deu\',11,24);">De 11:24</a>; <a onClick="return mV(\'Deu\',34,2);">34:2</a>; <a onClick="return mV(\'Zec\',14,8);">Zec 14:8</a>; <a onClick="return mV(\'Joe\',2,20);">Joe 2:20</a>, in the last two passages contrasted with "the former (King James Version, "eastern" the Revised Version (British and American)) sea" ha-yam ha-qadhmoni), i.e. the Dead Sea. See <a href="./study/isbe/search.html?string=FORMER">FORMER</a>. That portion of the Mediterranean directly west of Palestine is once (<a onClick="return mV(\'Exd\',23,31);">Ex 23:31</a>) referred to as "the sea of the Philis" yam pelishtim). the King James Version has "sea of Joppa" (<a onClick="return mV(\'Ezr\',3,7);">Ezr 3:7</a>) where the Revised Version (British and American) correctly renders "to the sea, unto Joppa" (compare <a onClick="return mV(\'2Ch\',2,16);">2Ch 2:16</a>). Similarly, the King James Version "the sea of Cilicia and Pamphylia" (<a onClick="return mV(\'Act\',27,5);">Ac 27:5</a>) is better rendered "the sea which is off Cilicia and Pamphylia" (Revised Version).<P>In the New Testament, references to the Mediterranean are common, especially in the accounts of Paul\'s voyages, for which see <a href="./study/isbe/search.html?string=PAUL">PAUL</a>. Jesus once (<a onClick="return mV(\'Mar\',7,24);">Mr 7:24</a>) came to or near the sea.<P>The Mediterranean basin was the scene of most ancient civilizations which have greatly influenced that of the western world, except those whose home was in the valleys of the Tigris and the Euphrates; and even these continually thrust themselves into it, so far as they could. As its name implies, it is an inland area, united to the Atlantic only by the narrow Straits of Gibraltar. In comparatively recent geological time it was also joined to the Red Sea, the alluvial deposits of the Nile, which have extended the line of the Delta, having with the aid of drifting desert sands subsequently closed the passage and joined the continents of Asia and Africa. The total length of the Mediterranean is about 2,300 miles, its greatest breadth about 1,080 miles, and its area about 1,000,000 square miles. It falls naturally into the western and eastern (Levant) halves, dividing at the line running from Tunis to Sicily, where it is comparatively shallow; the western end is generally the deeper, reaching depths of nearly 6,000 ft. On the north it is intersected by the Italian and Balkan peninsulas, forming the Gulf of Lyons, the Adriatic and the Aegean. In ancient times these and other divisions of the Mediterranean bore specific names given by the Greeks and Romans, but from the nature of the case their limits were ill defined. The temperature of the Mediterranean is in summer warmer, in winter about the same as that of the Atlantic. Its water has a slightly greater specific gravity, probably because of a larger proportionate evaporation.``75';
isbe[5909]='Meeda`me-e\'-da.`<a href="./study/isbe/search.html?string=MEEDDA">MEEDDA</a>`1';
isbe[5910]='Meedda`me-ed\'-a (Meedda, but Swete, Dedda, following Codex Vaticanus; the King James Version Meeda): The head of one of the families of Nethinim (temple slaves) who went up with Zerubbabel from the captivity (1Esdras 5:32); identical with "Mehida" of <a onClick="return mV(\'Ezr\',2,52);">Ezr 2:52</a> and <a onClick="return mV(\'Neh\',7,54);">Ne 7:54</a>.``1';
isbe[5911]='Meekness`mek\'-nes (\'anawah; praotes, prautes): "Meekness" in the Old Testament (\'anawah, \'anwah) is from \'anaw, "suffering," "oppressed," "afflicted," denoting the spirit produced under such experiences. The word is sometimes translated "poor" (<a onClick="return mV(\'Job\',24,4);">Job 24:4</a>, the Revised Version margin "meek"; <a onClick="return mV(\'Amo\',8,4);">Am 8:4</a>); "humble" (<a onClick="return mV(\'Psa\',9,12,18);">Ps 9:12,18</a>, the Revised Version margin "meek"); "lowly" (<a onClick="return mV(\'Pro\',3,34);">Pr 3:34</a>; <a onClick="return mV(\'Pro\',16,19);">16:19</a>, the Revised Version (British and American) "poor," margin "meek"). It is generally associated with some form of oppression. The "meek" were the special objects of the Divine regard, and to them special blessings are promised (<a onClick="return mV(\'Psa\',22,26);">Ps 22:26</a>, "The meek shall eat and be satisfied"; <a onClick="return mV(\'Psa\',25,9);">25:9</A>, "The meek will he guide in justice; and the meek will he teach his way"; <a onClick="return mV(\'Psa\',37,11);">37:11</A>, "The meek shall inherit the land"; <a onClick="return mV(\'Psa\',147,6);">147:6</A>, "Yahweh upholdeth the meek"; <a onClick="return mV(\'Psa\',149,4);">149:4</a>, "He will beautify the meek with salvation," the Revised Version margin "victory"; compare <a onClick="return mV(\'Isa\',11,4);">Isa 11:4</a>; <a onClick="return mV(\'Isa\',29,19);">29:19</a>; <a onClick="return mV(\'Isa\',61,1);">61:1</a>, "Yahweh hath anointed me to preach good tidings unto the meek," the Revised Version margin "poor"; <a onClick="return mV(\'Zep\',2,3);">Ze 2:3</a>; <a onClick="return mV(\'Psa\',45,4);">Ps 45:4</a>, "because of (the Revised Version margin "in behalf of") truth and meekness and righteousness"). Of Moses it is said he "was very meek, above all the men that were upon the face of the earth," notwithstanding the Divine revelations given him, and in the face of opposition (<a onClick="return mV(\'Num\',12,3);">Nu 12:3</a>; compare <a onClick="return mV(\'2Cr\',12,\'1-6\');">2Co 12:1-6</a>). Meekness is ascribed even to Yahweh Himself (<a onClick="return mV(\'2Sa\',22,36);">2Sa 22:36</a>, "Thy gentleness (\'anawah) hath made me great"; compare <a onClick="return mV(\'Psa\',18,36);">Ps 18:36</a> (\'anwah), the Revised Version margin "condescension"); men are exhorted to seek it (<a onClick="return mV(\'Zep\',2,3);">Ze 2:3</a>, "Seek righteousness, seek meekness"; compare <a onClick="return mV(\'Pro\',15,1);">Pr 15:1</a>; <a onClick="return mV(\'Pro\',16,14);">16:14</a>; <a onClick="return mV(\'Pro\',25,15);">25:15</a>; <a onClick="return mV(\'Ecc\',10,4);">Ec 10:4</a>).<P>In the Apocrypha also "meekness" holds a high place (Ecclesiasticus 1:27, "The fear of the Lord is wisdom and instruction: faith and meekness are his delight," the Revised Version (British and American) "in faith and meekness is his good pleasure"; Ecclesiasticus 3:19, "Mysteries are revealed unto the meek" (the Revised Version (British and American) omits); compare <span class="noTag"10:14</span>).<P>"Meekness" in the New Testament (praotes, prautes) is not merely a natural virtue, but a Christian "grace"; it is one of the "fruits of the Spirit" (<a onClick="return mV(\'Gal\',5,23);">Ga 5:23</a>). The conception of meekness, as it had been defined by Aristotle, was raised by Christianity to a much higher level, and associated with the commonly despised quality of humility (see under the word). It was the spirit of the Saviour Himself (<a onClick="return mV(\'Mat\',11,29);">Mt 11:29</a>): "I am meek (praos) and lowly in heart" (compare <a onClick="return mV(\'2Cr\',10,1);">2Co 10:1</a>, "by the meekness and gentleness of Christ"); it presupposes humility, flows from it, and finds expression in moderation (see under the word). (See Trench, Syn. of New Testament, 145; Westcott and Hort, The New Testament in Greek, New Testament Lexicon, under the word) Christians are exhorted to cherish it and show it in their relations to one another (<a onClick="return mV(\'Eph\',4,2);">Eph 4:2</a>; <a onClick="return mV(\'Col\',3,12);">Col 3:12</a>; <a onClick="return mV(\'1Ti\',6,11);">1Ti 6:11</a>; <a onClick="return mV(\'Tts\',3,2);">Tit 3:2</a>, "showing all meekness toward all men"); it ought to characterize Christian teachers or those in authority in "instructing (the Revised Version (British and American) "correcting," margin "instructing") them that oppose themselves" (<a onClick="return mV(\'2Ti\',2,25);">2Ti 2:25</a>); the saving, "implanted" (the Revised Version margin "inborn") word is to be received "with meekness" (<a onClick="return mV(\'Jam\',1,21);">Jas 1:21</a>); a man is to "show by his good life his works in meekness of wisdom" (<a onClick="return mV(\'Jam\',3,13);">Jas 3:13</a>), and to give a reason for the hope that is in him, "with meekness and fear" (<a onClick="return mV(\'1Pe\',3,15);">1Pe 3:15</a>).<P>The interchangeableness of "meek" with "poor," etc., in the Old Testament ought to be specially noted. Our Lord\'s opening of His ministry at Nazareth (<a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a>, "He anointed me to preach good tidings to the poor"), and His message to John (<a onClick="return mV(\'Mat\',11,5);">Mt 11:5</a>, "The poor have good tidings preached to them") are in harmony therewith.``185';
isbe[5912]='Meet`met, adjective (yashar; axios): Various words are employed to express meetness, the sense of what is proper, worthy, or fit. We have yashar, "straight," "upright," "right" (<a onClick="return mV(\'2Ki\',10,3);">2Ki 10:3</a>, "meetest"; <a onClick="return mV(\'Jer\',26,14);">Jer 26:14</a>, the Revised Version (British and American) "right"); yashar (<a onClick="return mV(\'Jer\',27,5);">Jer 27:5</a>, the Revised Version (British and American) "right"); yosher (<a onClick="return mV(\'Pro\',11,24);">Pr 11:24</a>, the Revised Version margin "what is justly due"); \'arikh, Aramaic "meet" (<a onClick="return mV(\'Ezr\',4,14);">Ezr 4:14</a>); bene, "sons of" (<a onClick="return mV(\'Deu\',3,18);">De 3:18</a>, the King James Version "meet for the war," margin "Hebrew sons of power," the Revised Version (British and American) "men of valor"); kun, "to be right" etc. (<a onClick="return mV(\'Exd\',8,26);">Ex 8:26</a>); \'asah "to be made," "used" (<a onClick="return mV(\'Eze\',15,5);">Eze 15:5</a> twice, the Revised Version margin "made into"), tsaleach, "to be good or fit for" (<a onClick="return mV(\'Eze\',15,4);">Eze 15:4</a>, the Revised Version (British and American) "profitable"); ra\'ah, "seen," "looked out," "chosen" (<a onClick="return mV(\'Est\',2,9);">Es 2:9</a>); axios, "worthy" (<a onClick="return mV(\'Mat\',3,8);">Mt 3:8</a>; <a onClick="return mV(\'Act\',26,20);">Ac 26:20</a>, the Revised Version (British and American) "worthy"; <a onClick="return mV(\'1Cr\',16,4);">1Co 16:4</a>; <a onClick="return mV(\'2Th\',1,3);">2Th 1:3</a>); dikaios, "just," "right" (<a onClick="return mV(\'Phl\',1,7);">Php 1:7</a> the Revised Version (British and American) "right"; <a onClick="return mV(\'2Pe\',1,13);">2Pe 1:13</a> the Revised Version (British and American) "right"); euthetos, "we set" (<a onClick="return mV(\'Hbr\',6,7);">Heb 6:7</a>); euchrestos, "very useful," "profitable" (<a onClick="return mV(\'2Ti\',2,21);">2Ti 2:21</a>, "meet for the master\'s use"); hikanos, "sufficient" (<a onClick="return mV(\'1Cr\',15,9);">1Co 15:9</a>); hikanoo, "to make sufficient" (<a onClick="return mV(\'Col\',1,12);">Col 1:12</a>); kalos, "beautiful," "honest" (<a onClick="return mV(\'Mat\',15,26);">Mt 15:26</a>; <a onClick="return mV(\'Mar\',7,27);">Mr 7:27</a>); dei "it behooveth" (<a onClick="return mV(\'Luk\',15,32);">Lu 15:32</a>; <a onClick="return mV(\'Rom\',1,27);">Ro 1:27</a>, the Revised Version (British and American) "due"). For "meet" (supplied) (<a onClick="return mV(\'Jdg\',5,30);">Jud 5:30</a>), the Revised Version (British and American) has "on"; for "Surely it is meet to be said unto God" (<a onClick="return mV(\'Job\',34,31);">Job 34:31</a>), "For hath any said unto God?" In 2Macc 9:12, we have dikaios, the Revised Version (British and American) "right."``185';
isbe[5913]='Megiddo; Megiddon`me-gid\'-o, me-gid\'-on (meghiddo, meghiddon; Magiddo, Mageddon, Magdo): A royal city of the Canaanites, the king of which was slain by Joshua (<a onClick="return mV(\'Jos\',12,21);">Jos 12:21</a>). It lay within the territory of Issachar, but was one of the cities assigned to Manasseh (<a onClick="return mV(\'Jos\',17,11);">Jos 17:11</a>; <a onClick="return mV(\'1Ch\',7,29);">1Ch 7:29</a>). Manasseh, however, was not able to expel the Canaanites, who therefore continued to dwell in that land. Later, when the children of Israel were waxen strong, the Canaanites were put to taskwork (<a onClick="return mV(\'Jos\',17,12);">Jos 17:12</a>f; <a onClick="return mV(\'Jdg\',1,27);">Jud 1:27</a>f). The host of Sisera was drawn to the river Kishon, and here, "by the waters of Megiddo," the famous battle was fought (<a onClick="return mV(\'Jdg\',5,19);">Jud 5:19</a>). By the time of Solomon, Israel\'s supremacy was unquestioned. Megiddo was included in one of his administrative districts (<a onClick="return mV(\'1Ki\',4,12);">1Ki 4:12</a>), and it was one of the cities which he fortified (<a onClick="return mV(\'1Ki\',9,15);">1Ki 9:15</a>). Ahaziah, mortally wounded at the ascent of Gur, fled to Megiddo to die (<a onClick="return mV(\'2Ki\',9,27);">2Ki 9:27</a>). At Megiddo, Josiah, king of Judah, attempted to arrest Pharaoh-necoh and his army on their march to the Euphrates against the king of Assyria. Here the Egyptian monarch "slew him...when he had seen him," and from Megiddo went the sorrowful procession to Jerusalem with Josiah\'s corpse (<a onClick="return mV(\'2Ki\',23,29);">2Ki 23:29</a>f; <a onClick="return mV(\'2Ch\',35,20);">2Ch 35:20</a>). The sad tale is told again in 1Esdras 1:25ff. "The mourning of Hadadrimmon in the valley of Megiddon" became a poetical expression for the deepest and most despairing grief (<a onClick="return mV(\'Zec\',12,11);">Zec 12:11</a>).<P>See also <a href="./study/isbe/search.html?string=ARMAGEDDON">ARMAGEDDON</a>.<P>The constant association of Megiddo with Taanach (Tell Ta\'anek) points to a position on the south edge of the plain of Esdraelon. In confirmation of this, we read (RP, 1st series, II, 35-47) that Thothmes III captured Megiddo, after having defeated the Palestinian allies who opposed him. He left his camp at Aruna (possibly \'Ar\'arah), and, following a defile (possibly Wady \'Arah), he approached Megiddo from the south We should thus look for the city where the pass opens on the plain; and here, at Khan el-Lejjan, we find extensive ruins on both sides of a stream which turns several mills before falling into the Kishon. We may identify the site with Megiddo, and the stream with "the waters of Megiddo." Pharaoh-necoh would naturally take the same line of march, and his advance could be nowhere more hopefully opposed than at el-Lejjun. Tell el-Mutasellim, a graceful mound hard by, on the edge of the plain, may have formed the acropolis of Megiddo.<P>The name Mujadda\' attaches to a site 3 miles south of Beisan in the Jordan valley. Here Conder would place Megiddo. But while there is a resemblance in the name, the site really suits none of the Biblical data. The phrase "Taanach by the waters of Megiddo" alone confines us to a very limited area. No position has yet been suggested which meets all the conditions as well as el-Lejjun.<P>The Khan here shows that the road through the pass from Esdraelon to the plain of Sharon and the coast was still much frequented in the Middle Ages.``54';
isbe[5914]='Mehetabel; Mehetabeel`me-het\'-a-bel, me-het\'-a-bel (mehetah\'el, "whom God makes happy"):<P>(1) Daughter of Matred, wife of Hadad or Hadar, the 8th and apparently last of the kings of Edom (<a onClick="return mV(\'Gen\',36,39);">Ge 36:39</a>; <a onClick="return mV(\'1Ch\',1,50);">1Ch 1:50</a>).<P>(2) Grandfather of that Shemaiah who played a treacherous part against Nehemiah at the suggestion of Tobiah and Sanballat, by trying to persuade Nehemiah to commit sacrilege (<a onClick="return mV(\'Neh\',6,\'10-13\');">Ne 6:10-13</a>).``1';
isbe[5915]='Mehida`me-hi\'-da (mechidha\', "renowned"; "Meeda" (1Esdras 5:32)): Ancestor and patronymic of a family of Nethinim who came back from Babylon with Zerubbabel (<a onClick="return mV(\'Ezr\',2,52);">Ezr 2:52</a>; <a onClick="return mV(\'Neh\',7,54);">Ne 7:54</a>).``1';
isbe[5916]='Mehir`me\'-her (mechir, "price," "hire"): A descendant of Judah, son of Chelub, nephew of Shuah (<a onClick="return mV(\'1Ch\',4,11);">1Ch 4:11</a>). Perug, a Chaldee name of equivalent meaning, is given for this person in the Targum of Rabbi Joseph.``1';
isbe[5917]='Meholathite`me-ho\'-la-thit (mecholathi): The Gentile designation of Adriel, the son of Barzillai, who married Merab, the daughter of King Saul (<a onClick="return mV(\'1Sa\',18,19);">1Sa 18:19</a>; <a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a>), the name Michal in <a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a> being doubtless a copyist\'s error.`<a href="./study/isbe/search.html?string=ABEL-MEHOLAH">ABEL-MEHOLAH</a>`1';
isbe[5918]='Mehujael`me-hu\'-ja-el (mechuya\'el, mechiya\'el, "smitten of God"): A descendant of Cain through Enoch and Irad (<a onClick="return mV(\'Gen\',4,18);">Ge 4:18</a>). The list in <a onClick="return mV(\'Gen\',5,12);">Ge 5:12</a>ff is a working-over of the same material of genealogy by another hand at a different date of spelling (compare spelling of Chaucer and that of today). In that ease, Mehalalel would be the correspondent name to Mehujael (see Expository Times, X, 353).``1';
isbe[5919]='Mehuman`me-hu\'-man (me\'human (<a onClick="return mV(\'Est\',1,10);">Es 1:10</a>)): A eunuch of Ahasuerus, the first of the seven chamberlains.``1';
isbe[5920]='Mehunim`me-hu\'-nim (me\'unim).`<a href="./study/isbe/search.html?string=MEUNIM">MEUNIM</a>`1';
isbe[5921]='Mekonah`me-ko\'-na (mekhonah).`<a href="./study/isbe/search.html?string=MECONAH">MECONAH</a>`1';
isbe[5922]='Melatiah`mel-a-ti\'-a (melatyah, "Yah\'s deliverance"): A Gibeonite who assisted in building the wall of Jerusalem under Nehemiah (<a onClick="return mV(\'Neh\',3,7);">Ne 3:7</a>).``1';
isbe[5923]='Melchi`mel\'-ki (Tischendorf, Tregelles, Westcott and Hort, The New Testament in Greek, Melchei; Textus Receptus of the New Testament, Melchi): The name of two ancestors of Jesus according to Luke\'s genealogy, one being in the 4th generation before Joseph, the husband of Mary, the other being in the 3rd generation before Zerubbabel (<a onClick="return mV(\'Luk\',3,24,28);">Lu 3:24,28</a>).``1';
isbe[5924]='Melchiah`mel-ki\'-a (malkhiyah, "Yah\'s king"): A priest and father of Pashur (<a onClick="return mV(\'Jer\',21,1);">Jer 21:1</a> the King James Version); elsewhere and in the Revised Version (British and American) called <a href="./study/isbe/search.html?string=MALCHIAH">MALCHIAH</A> and <a href="./study/isbe/search.html?string=MALCHIJAH">MALCHIJAH</a> (which see).``1';
isbe[5925]='Melchias`mel-ki-as (Codex Vaticanus, Melcheias, Codex Vaticanus (b), Codex Alexandrinus, Melchias): Name of three men who had taken "strange wives":<P>(1) 1Esdras 9:26 = "Malchijah" (<a onClick="return mV(\'Ezr\',10,25);">Ezr 10:25</a>).<P>(2) 1Esdras 9:32 = "Malchijah" (<a onClick="return mV(\'Ezr\',10,31);">Ezr 10:31</a>).<P>(3) One of those who stood at Ezra\'s left hand when the law was read (1Esdras 9:44) = "Malchijah" (<a onClick="return mV(\'Neh\',8,4);">Ne 8:4</a>), possibly identical with (1) or (2).``1';
isbe[5926]='Melchiel`mel\'-ki-el (Melchiel, Codex Vaticanus, Melcheiel): The father of Charmis, one of the governors of Bethulia (Judith 6:15). Other readings are Sellem and Mochisel.``1';
isbe[5927]='Melchishua`mel-ki-shoo\'-a (malkishua\', "king\'s help").`<a href="./study/isbe/search.html?string=MALCHI+SHUA">MALCHI-SHUA</a>`1';
isbe[5928]='Melchizedek; Melchisedec`mel-kiz\'e-dek, and (the King James Version in the book of Hebrews) (malki-tsedheq, "Tsedheq, or Tsidhiq is my king" (<a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>ff; <a onClick="return mV(\'Psa\',110,4);">Ps 110:4</a>); Melchisedek (<a onClick="return mV(\'Hbr\',5,6,10);">Heb 5:6,10</a>; <a onClick="return mV(\'Hbr\',6,20);">6:20</a>; <a onClick="return mV(\'Hbr\',7,1,10,11,15,17);">7:1,10,11,15,17</a>)): The name is explained in <a onClick="return mV(\'Hbr\',7,2);">Heb 7:2</a> as "king of righteousness," with "-i" as the old genitive ending; but the correct explanation is no doubt the one given above; compare Adoni-zedek in <a onClick="return mV(\'Jos\',10,1);">Jos 10:1</a>, where Septuagint with <a onClick="return mV(\'Jdg\',1,\'5-7\');">Jud 1:5-7</a> has Adonibezek. Melchizedek was king of Salem (= Jerusalem) and "a priest unto \'El \'Elyon" (<a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>). He brought bread and wine to Abraham after the latter\'s victory over the kings, and also bestowed upon him the blessing of \'El \'Elyon. Abraham gave him "a tenth of all," i.e. of the booty probably, unless it be of all his possessions. <a onClick="return mV(\'Gen\',14,22);">Ge 14:22</a> identifies Yahweh with \'El \'Elyon, the title of the Deity as worshipped at Jerusalem; and so <a onClick="return mV(\'Hbr\',7,1);">Heb 7:1</a>ff, following Septuagint of <a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>ff, calls Melchizedek. "priest of God Most High," i.e. Yahweh.<P>Skinner (Gen, 271,where Josephus, Ant, XVI, vi, 2, and Am M 6:1 are cited) points out that the Maccabees were called "high priests of God most high." Hence, some hold that the story of Melchizedek is an invention of Judaism, but Gunkel (<a onClick="return mV(\'Gen\',3,1);">Genesis 3</a>, 285ff) maintains that he is a traditional, if not a historical, character.<P><a onClick="return mV(\'Psa\',110,4);">Ps 110:4</a> makes the klng-priest who is addressed there a virtual successor of Melchizedek, and the kings of Jerusalem might well, as Gunkel suggests, have been considered successors of Melchizedek in the same way that Charlemagne was regarded as the successor of the Caesars, and the latter as successors of the Pharaohs in Egypt. This leads naturally to an early date being ascribed to <a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a>.<P>The thought of a priest after the order of Melchizedek is taken up by the author of Hebrews. He wanted to prove the claim of Christ to be called priest. It was impossible, even had he so wished, to consider Jesus as an Aaronic priest, for He was descended from the tribe of Judah and not from that of Levi (<a onClick="return mV(\'Hbr\',7,14);">7:14</a>). The words of <a onClick="return mV(\'Psa\',110,4);">Ps 110:4</a> are taken to refer to Him (<a onClick="return mV(\'Hbr\',5,5);">Heb 5:5</a>f), and in <a onClick="return mV(\'Hbr\',7,5);">Heb 7:5</a>ff the order of Melchizedek is held to be higher than that of Aaron, for the superiority of Melchizedek was acknowledged by Abraham (a) when he paid tithes to Melchizedek and (b) when he was blessed by Melchizedek, for "the less is blessed of the better." It might be added that Jesus can be considered a priest after the order of Melchizedek in virtue of His descent from David, if the latter be regarded as successor to Melchizedek But the author of He does not explicitly say this. Further, Aaron is only a "type" brought forward in He to show the more excellent glory of the work of Jesus, whereas Melchizedek is "made like unto the Son of God" (<a onClick="return mV(\'Hbr\',7,3);">7:3</a>), and Jesus is said to be "after the likeness of Melchizedek" (<a onClick="return mV(\'Hbr\',7,15);">7:15</a>).<P><a onClick="return mV(\'Hbr\',7,1);">Heb 7:1</a>ff presents difficulties. Where did the author get the material for this description of Melchizedek?<P>(1) Melchizedek is said to be "without father, without mother, (i.e.) without genealogy"; and<P>(2) he is described as "having neither beginning of days nor end of life"; he "abideth a priest continually."<P>The answer is perhaps to be had among the Tell el-Amarna Letters, among which are at least 6, probably 8, letters from a king of Urusalim to Amenophis IV, king of Egypt, whose "slave" the former calls himself. Urusalim is to be identified with Jerusalem, and the letters belong to circa 1400 BC. The name of this king is given as Abd-Khiba (or Abd-chiba), though Hommel, quoted by G.A. Smith, Jerusalem, II,14,note 7, reads Chiba. Zimmer, in ZA, 1891, 246, says that it can be read Abditaba, and so Sayce (HDB, III, 335b) calls him \'ebhedh tobh. The king tells his Egyptian overlord, "Neither my father nor my mother set me in this place: the mighty arm of the king (or, according to Sayce, "the arm of the mighty king") established me in my father\'s house" (Letter 102 in Berlin collection, ll. 9-13; also number 103, ll. 25-28; number 104, ll. 13-15; see, further, H. Winckler, Die Thontafeln von Tell-el-Amarna; Knudtzon, Beitrage zur Assyriologie, IV, 101ff, 279ff, cited by G.A. Smith, Jerusalem, II,8,note 1).<P>It thus becomes clear that possibly tradition identified Melchizedek with Abd-Khiba. At any rate the idea that Melchizedek was "without father, without mother, (i.e.) without genealogy" can easily be explained if the words of Abd-Khiba concerning himself can have been also attributed to Melchizedek. The words meant originally that he acknowledged that he did not come to the throne because he had a claim on it through descent; he owed it to appointment. But Jewish interpretation explained them as implying that he had no father or mother. <a onClick="return mV(\'Psa\',110,4);">Ps 110:4</a> had spoken of the king there as being "a priest for ever after the order of Melchizedek," and this seems to have been taken to involve the perpetuity of Melchizedek also as priest. Melchizedek was then thought of as "having neither beginning of days" = "without father, without mother, without genealogy," and again as not having "end of life" = "abideth a priest continually." Hence, he is "made like unto the son of God," having neither beginning of days nor end of life. We get another New Testament example of Jewish interpretation in <a onClick="return mV(\'Gal\',4,21);">Ga 4:21</a>ff. We have no actual proof that Melchizedek is identical with Abd-Khiba; possibly the reference to the former as being "without father," etc., is not to be explained as above. But why should Melchizedek, and he alone, of all the Old Testament characters be thought of in this way?<P>Westcott, Hebrews, 199, has a suggestive thought about Melchizedek: "The lessons of his appearance lie in the appearance itself. Abraham marks a new departure....But before the fresh order is established we have a vision of the old in its superior majesty; and this, on the eve of disappearance, gives its blessing to the new."<P>On the references to Melchizedek in Philo see Westcott, op. cit., 201; F. Rendall, Hebrews, App., 58ff; and especially (with the passages and other authorities cited there) G. Milligan, Theology of Epistle to the Hebrews, 203ff.<P>The conclusions we come to are:<P>(1) There was a tradition in Jerusalem of Melchizedek, a king in pre-Israelitish times, who was also priest to \'El \'Elyon. This is the origin of <a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>ff, where \'El \'Elyon is identified with Yahweh.<P>(2) <a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a> makes use of this tradition and the Psalmist\'s king is regarded as Melchizedek\'s successor.<P>(3) The Epistle to the Hebrews makes use of<P class="in15">(a) <a onClick="return mV(\'Psa\',110,\'1-\');">Ps 110</a>, which is taken to be a prophecy of Christ,<P class="in15">(b) of <a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>ff, and<P class="in15">(c) of oral tradition which was not found in the Old Testament. It is this unwritten tradition that is possibly explained by the Tell el-Amarna Letters. See, further, articles by Sayce, Driver, and Hommel in Expository Times, VII, VIII.`<a href="./study/isbe/search.html?string=JERUSALEM">JERUSALEM</a>`149';
isbe[5929]='Melea`me\'-le-a, mel\'-e-a (Melea): An ancestor of Jesus in Luke\'s genealogy (<a onClick="return mV(\'Luk\',3,31);">Lu 3:31</a>).``1';
isbe[5930]='Melech`me\'-lek (melekh, "king"): Great-grandson of Jonathan, son of Saul, grandson of Mephibosheth or Meribbaal (<a onClick="return mV(\'1Ch\',8,35);">1Ch 8:35</a>; <a onClick="return mV(\'1Ch\',9,41);">9:41</a>).``1';
isbe[5931]='Melicu`mel\'-i-ku (melikhu, also melukhi, "regnant"): Same as <a href="./study/isbe/search.html?string=MALLUCHI">MALLUCHI</a> (which see).``1';
isbe[5932]='Melita`mel\'-i-ta (Melite, <a onClick="return mV(\'Act\',28,1);">Ac 28:1</a>): Is now generally identified with Malta. The former error in attributing the reference to the island of Meleda on the east coast of the Adriatic Sea was due to the ancient practice of employing the term Adria to include the Ionian and Sicilian seas.<P>Malta is the largest of a group of islands including Gozo and the islets Comino, Cominotto and Filfla, lying about 56 miles from the southern extremity of Sicily, 174 from the mainland of Italy, and 187 from the African coast. Malta itself <span class="noTag">is</span> 17 1/2 miles long and 9 1/4 broad, and contains an area of 95 square miles. Its modern capital, Valetta, is situated in 35 degrees 54\' North latitude and 14 degrees 31\' East longitude.<P>The central position of Malta in the Mediterranean Sea gave it great importance as a naval station. It was probably at first a Phoenician colony, and later passed under the influence, if not domination, of the Sicilian Greeks. But the Romans captured it from the Carthaginians in 218 BC (Livy xxi.51) and attached it definitely to the province of Sicily. Under Roman rule the inhabitants were famous for their industry, especially in the production of textile fabrics, probably of native cotton. The celebrated vestis melitensis was a fine and soft material for dresses and for the covering of couches (Cicero Verr. ii.72,176; ii.74,183; iv.46,103; Diodorus v.12,22). At the time when Paul visited the island it would seem that the administration was entrusted to a deputy of the proprietor of Sicily, who is referred to as protos Melitaion (<a onClick="return mV(\'Act\',28,7);">Ac 28:7</a>; CIG, 5754), or Melitensium primus omnium (CIL, x, 7495) (see <a href="./study/isbe/search.html?string=PUBLIUS">PUBLIUS</a>). A bay 2 1/2 miles northwest of Valetta, the mouth of which is held by tradition to be the place where the vessel that bore Paul ran ashore, tallies admirably with the description of the locality in Acts. The Admiralty charts indicate places near the west side of the entrance to the bay, where the depth is first 20 ft. and then 15 ft., while the rush of the breakers in front of the little island of Salmoneta and behind it suit the reference to a place "where two seas met" (<a onClick="return mV(\'Act\',27,41);">Ac 27:41</a>). The inlet is called the Bay of Paul. The topographical question has been exhaustively treated by Ramsay in Paul the Traveler.``3';
isbe[5933]='Melody`mel\'-o-di: zimrah, a musical piece or song to be accompanied by an instrument (<a onClick="return mV(\'Isa\',51,3);">Isa 51:3</a>); an instrument of praise (<a onClick="return mV(\'Amo\',5,23);">Am 5:23</a>); naghan, "to play on a stringed instrument," "Make sweet melody, sing many songs" (<a onClick="return mV(\'Isa\',23,16);">Isa 23:16</a>); psallo to celebrate the praises of God with music (<a onClick="return mV(\'Eph\',5,19);">Eph 5:19</a>).`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>`1';
isbe[5934]='Melons`mel\'-unz (\'abhattichim; compare Arabic battikh, the "water melon"; pepones): In <a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>, the melon is referred to as common in Egypt, and there can be no doubt that the variety indicated is the watermelon (Citrullus vulgaris) which is indigenous in tropical Africa. It has been cultivated in Egypt since the earliest times.``1';
isbe[5935]='Melzar`mel\'-zar (ha-meltsar; Septuagint Abiesdri, Theod. Hamelsad): Possibly a transliteration of the Babylonian Ameluucur, the officer to whom was entrusted the bringing-up of Daniel and his three companions (<a onClick="return mV(\'Dan\',1,11);">Da 1:11</a> the King James Version, the Revised Version (British and American) "the steward," margin "Hebrew: Hammelzar"). It has been suggested that the name is not the name of a person, but denotes the office of guardian, like the Babylonian maccaru. In this case the "l" would come by dissimulation from the first of the two "s" sounds, which on its side has come from an assimilated "n", the root being nacaru, "to protect" "to guard."``196';
isbe[5936]='Mem`mam, mem "m": The 13th letter of the Hebrew alphabet, transliterated in this Encyclopedia as "m". It came also to be used for the number 40.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[5937]='Member`mem\'-ber<P>(1) yatsur; melos;<P>(2) shaphekhah, "membrum virile" (<a onClick="return mV(\'Deu\',23,1);">De 23:1</a>)):<P>The first Hebrew word is derived from a root meaning "to knead," "to mold in clay," "to create." It therefore denotes any feature or part of the body. "So the tongue also is a little member, and boasteth great things" (<a onClick="return mV(\'Jam\',3,5);">Jas 3:5</a>). "The members" is equivalent with "<a href="./study/isbe/search.html?string=BODY">the body</a>" (which see; compare <a onClick="return mV(\'Psa\',139,16);">Ps 139:16</a> the King James Version). The members are not self-governing, but execute the orders of the mind, obeying either the lower nature in the commission of sin or iniquity, unrighteousness and uncleanness (<a onClick="return mV(\'Rom\',6,13,19);">Ro 6:13,19</a>), or following the higher nature, the Divine impulses in the fulfilling of the law of Christ (<a onClick="return mV(\'Rom\',6,19);">6:19</a>).<P>By nature, the "law in my members" (<a onClick="return mV(\'Rom\',7,23);">Ro 7:23</a>) is opposed to the better nature (<a onClick="return mV(\'Jam\',4,1);">Jas 4:1</a>) until by "<a href="./study/isbe/search.html?string=REGENERATION">regeneration</a>" (which see) this condition is changed, when the Spirit of Christ becomes the governing power, using our members, i.e. all our abilities, in the execution of His plans. This is not done while we remain passive, but only when we have actively presented or yielded our members to His service (<a onClick="return mV(\'Rom\',6,19);">Ro 6:19</a>). Therefore our bodies must not be desecrated by baser uses (<a onClick="return mV(\'1Cr\',6,15,19,20);">1Co 6:15,19,20</a>). The Lord Jesus illustrates the severe discipline which is needed to subdue the members of even the regenerate to perfect submission under the higher law of the Spirit by the simile of the right eye, which is to be plucked out, and the right hand, which is to be cut off (<a onClick="return mV(\'Mat\',5,29,30);">Mt 5:29,30</a>), and Paul speaks of putting to death (the King James Version "mortifying") the "members which are upon the earth" (<a onClick="return mV(\'Col\',3,5);">Col 3:5</a>).<P>It is the difference in character and gifts of individual Christians which leads Paul to speak of the variety of members, which, though of manifold functions, are equally important to the completeness of the body. It is thus in the manifold variety of the body of Christ (<a onClick="return mV(\'1Cr\',12,\'12-27\');">1Co 12:12-27</a>; <a onClick="return mV(\'Eph\',4,16);">Eph 4:16</a>), and Christians being members of Christ, who is the head (<a onClick="return mV(\'Eph\',1,22);">Eph 1:22</a>; <a onClick="return mV(\'Eph\',4,15);">4:15</a>; <a onClick="return mV(\'Eph\',5,23);">5:23</a>), are members one of another (<a onClick="return mV(\'Rom\',12,5);">Ro 12:5</a>; <a onClick="return mV(\'Eph\',4,25);">Eph 4:25</a>).<P>In <a onClick="return mV(\'Deu\',23,1);">De 23:1</a> the Israelite Law against emasculation is referred to, and a religious disability is stated for the eunuch. Heathen Semites and other neighbors of Israel often castrated for religious purposes in the temple service of various divinities and for functions in princely palaces and harems. Heathen monarchs almost invariably had large numbers of these unfortunates, who frequently attained to positions of high power and responsibility. Herodotus states their frequent occurrence among the Persians (Hist. vi.32), and in the light of <a onClick="return mV(\'2Ki\',20,18);">2Ki 20:18</a> and <a onClick="return mV(\'Dan\',1,3);">Da 1:3</a> it appears as not impossible that Daniel and his friends belonged to this class. In later years their existence is certain in Israel (<a onClick="return mV(\'1Sa\',8,15);">1Sa 8:15</a> the Revised Version margin; <a onClick="return mV(\'Jer\',38,7);">Jer 38:7</a>; <a onClick="return mV(\'Mat\',19,12);">Mt 19:12</a>).`<a href="./study/isbe/search.html?string=CONCISION">CONCISION</a>; <a href="./study/isbe/search.html??string=EUNUCH">EUNUCH</a>`106';
isbe[5938]='Memeroth`mem\'-e-roth (Codex Alexandrinus, Mareroth; Codex Vaticanus here omits Memeroth and two other names; the King James Version Meremoth): A name in the genealogy of Ezra (1Esdras 8:2) = "Meraioth" in <a onClick="return mV(\'Ezr\',7,3);">Ezr 7:3</a>, also "Marimoth" in 2Esdras 1:2.``1';
isbe[5939]='Memmius, Quintus`mem\'-i-us, kwin\'-tus (Kointos Memmios): One of the 2 Roman legates who bore a letter to the Jews after their victory over Lysias 163 BC (2Macc 11:34). No Quintus Memmius is otherwise known to history, and no Memmius among the list of legates sent to Asia. Polybius (xxxi.18) mentions a Quintus and a Canuleius as sent to Egypt, 162 BC, and again (xxxiii.15) the same Quintus as sent as an ambassador to Rhodes, 153 BC. A Titus Memmius had been an envoy of the senate to Achaia and Macedonia before the date of this letter (Livy xliii.5). None of these is likely to be the one referred to in 2Macc 11:34, and it is possible that no such person was sent with the letter, which is spurious.`<a href="./study/isbe/search.html?string=MANIUS">MANIUS</a>`5';
isbe[5940]='Memorial; Memory`me-mo\'-ri-al, mem\'-o-ri (\'azkarah, zekher, zekher, zikkaron; mnemosunon): "Memorial" as the translation of \'azkdrah is a sacrificial term, that which brings the offerer into remembrance before God, or brings God into favorable remembrance with the offerer; it is used of the burning of a portion of the meal offering, the Revised Version (British and American) (the King James Version "meat-offering"); better, cereal offering, on the altar (<a onClick="return mV(\'Lev\',2,2);">Le 2:2</a>, the Revised Version (British and American) "as the memorial"; <a onClick="return mV(\'Lev\',2,9,16);">Le 2:9,16</a>; <a onClick="return mV(\'Lev\',5,12);">5:12</a>, the Revised Version (British and American) "as"; <a onClick="return mV(\'Lev\',24,7);">Le 24:7</a>; <a onClick="return mV(\'Num\',5,26);">Nu 5:26</a>, the Revised Version (British and American) "as"); as the translation of zekher (zekher), zikkaron, it is a memorial in the sense of a remembrance (zekher, zekher, <a onClick="return mV(\'Exd\',3,15);">Ex 3:15</a>; the memorial (name) of Yahweh); hence, we have in the Revised Version (British and American) "memorial name" for "remembrance" (<a onClick="return mV(\'Psa\',30,4);">Ps 30:4</a> the American Standard Revised Version; <a onClick="return mV(\'Psa\',97,12);">Ps 97:12</a>, the English Revised Version "holy name," marin "Hebrew memorial"; <a onClick="return mV(\'Psa\',102,12);">Ps 102:12</a>; <a onClick="return mV(\'Psa\',135,13);">135:13</a>; <a onClick="return mV(\'Isa\',26,8);">Isa 26:8</a>; <a onClick="return mV(\'Hsa\',12,5);">Ho 12:5</a>, the English Revised Version "memorial"); for "memorial" (<a onClick="return mV(\'Est\',9,28);">Es 9:28</a>; <a onClick="return mV(\'Psa\',9,6);">Ps 9:6</a>, the American Standard Revised Version "remembrance"); zikkaron, "a remembrance" (<a onClick="return mV(\'Exd\',12,14);">Ex 12:14</a>; <a onClick="return mV(\'Exd\',13,9);">13:9</a>; <a onClick="return mV(\'Lev\',23,24);">Le 23:24</a>; <a onClick="return mV(\'Num\',5,15);">Nu 5:15</a> (of the meal offering); <a onClick="return mV(\'Jos\',4,7);">Jos 4:7</a>; <a onClick="return mV(\'Neh\',2,20);">Ne 2:20</a>; <a onClick="return mV(\'Zec\',6,14);">Zec 6:14</a>); the Passover feast was to be in this sense "a memorial...for ever" (<a onClick="return mV(\'Exd\',12,14);">Ex 12:14</a>; <a onClick="return mV(\'Exd\',13,9);">13:9</a>); so also the shema\' (<a onClick="return mV(\'Deu\',6,4);">De 6:4</a>f); "memorial" occurs in The <span class="noTag">Wisdom of Solomon 4:1</span> (mneme), the Revised Version (British and American) "memory"; The <span class="noTag">Wisdom of Solomon 4:19</span>; Ecclesiasticus 45:1 (mnemosunon); Ecclesiasticus 49:1; 1Macc 3:7; 12:53, the Revised Version (British and American) "memorial."<P>"Memorial" occurs in the New Testament as the translation of mnemosunon, "a token of remembrance" (<a onClick="return mV(\'Mat\',26,13);">Mt 26:13</a>; <a onClick="return mV(\'Mar\',14,9);">Mr 14:9</a>; <a onClick="return mV(\'Act\',10,4);">Ac 10:4</a>, "Thy prayers and thine alms are gone up for a memorial before God," which suggests the sense in which "memorial" was used in the sacrificial ritual, and also the "better sacrifices" of the new dispensation).<P>Memory is the translation of zekher (zekher) (<a onClick="return mV(\'Psa\',109,15);">Ps 109:15</a>; <a onClick="return mV(\'Psa\',145,7);">145:7</a>; <a onClick="return mV(\'Pro\',10,7);">Pr 10:7</a>; <a onClick="return mV(\'Ecc\',9,5);">Ec 9:5</a>; <a onClick="return mV(\'Isa\',26,14);">Isa 26:14</a>, the Revised Version (British and American) "remembrance"); it occurs also in 1Macc 13:29; 2Macc 7:20. Katecho, "to have or hold fast," is rendered in <a onClick="return mV(\'1Cr\',15,2);">1Co 15:2</a> the King James Version "keep in memory," margin "hold fast," the American Standard Revised Version "hold fast," the English Revised Version "hold it fast," i.e. the word preached to them.``185';
isbe[5941]='Memphis`mem\'-fis:<P>1. Name:<P>The ancient capital of Egypt, 12 miles south of the modern Cairo. This Greek and Roman form of the name was derived from the Coptic form Menfi (now Arabic Menf), the abbreviation of the Egyptian name Men-nofer, "the good haven." This name was applied to the pyramid of Pepy I, in the cemetery above the city; some have thought the city name to have been derived from the pyramid, but this is unlikely, as the city must have had a regular name before that. It may perhaps mean "the excellence of Mena," its founder. It appears still more shortened in Ho (<a onClick="return mV(\'Hsa\',9,6);">9:6</A>) as Moph (moph), and in Isaiah (<a onClick="return mV(\'Isa\',19,13);">19:13</a>), Jereremiah (<a onClick="return mV(\'Jer\',2,16);">2:16</a>), and Ezekiel (<a onClick="return mV(\'Eze\',30,13);">30:13</a>) as Noph (noph).<P>2. Political Position:<P>The classical statements show that the city in Roman times was about 8 miles long and 4 miles wide, and the indications of the site agree with this. It was the sole capital of Position Egypt from the Ist to the XVIIth Dynasty; it shared supremacy with Thebes during the XVIIIth to XXVth Dynasties, and with Sais to the XXXth Dynasty. Alexandria then gradually obscured it, but the governor of Egypt signed the final capitulation to the Arabs in the old capital. While other cities assumed a political equality, yet commercially Memphis probably remained supreme until the Ptolemies.<P>3. The Founders and the City:<P>The oldest center of settlement was probably the shrine of the sacred bull, Apis or Hapy, which was in the south of the city. This worship was doubtless prehistoric, so that when the first king of all Egypt, Mena, founded his capital, there was already a nucleus. His great work was taking in land to the north, and founding the temple of the dynastic god Ptah, which was extended until its enclosure included as much as the great temple of Amon at Thebes, about 3 furlongs long and 2 furlongs wide. To the north of this was the sacred lake; beyond that, the palace and camp. Gradually the fashionable quarters moved northward in Egypt, in search of fresher air; the rulers had moved 10 miles north to Babylon by Roman times, then to Fostat, then Cairo, and lastly now to Abbasiyeh and Kubkeh, altogether a shift of 18 miles in 8,000 years.<P>4. Archaeological Results:<P>After the shrine of Apis the next oldest center is that of Ptah, founded by Mena. This was recently cleared in yearly sections by the British School, finding principally sculptures of the XVIIIth and XIXth Dynasties. The account of the north gate given by Herodotus, that it was built by Amenemhat III, has been verified by finding his name on the lintel. An immense sphinx of alabaster 26 ft. long has also been found. To the east of this was the temple of the foreign quarter, the temple of King Proteus in Greek accounts, where foreign pottery and terra cotta heads have been found. Other temples that are known to have existed in Memphis are those of Hathor, Neit, Amen, Imhotep, Isis, Osiris-Sokar, Khnumu, Bastel, Tahuti, Anubis and Sebek.<P>A large building of King Siamen (XXIst Dynasty) has been found south of the Ptah temple. To the north of the great temple lay the fortress, and in it the palace mound of the XXVIth Dynasty covered two acres. It has been completely cleared, but the lower part is still to be examined. The north end of it was at least 90 ft. high, of brickwork, filled up to half the height by a flooring raised on cellular brickwork. The great court was about 110 ft. square, and its roof was supported by 16 columns 45 ft. high.<P>The principal sights of Memphis now are the great colossus of Rameses II, the lesser colossus of the same, and the immense alabaster sphinx. The cemetery of the city is the most important in Egypt; it lies 2 miles to the west on the desert, and is known as Saqqareh, from So-kar, the god of the dead.`<a href="./study/isbe/search.html?string=SAQQAREH">SAQQAREH</a>`135';
isbe[5942]='Memucan`me-mu\'-kan (memukhan; derivation unknown but probably of Persian origin (<a onClick="return mV(\'Est\',1,14,16,21);">Es 1:14,16,21</a>)): One of "the seven princes of Persia and Media, who saw the king\'s face, and sat first in the kingdom." Ahasuerus consults these men, as those "that knew law and judgment," as to the proper treatment of the rebellious Vashti. Memucan is the spokesman of the reply. He recommends Vashti\'s deposition so that "all the wives will give to their husbands honor, both to great and small." This advice is adopted and incorporated into a royal decree—with what success is not said.``1';
isbe[5943]='Menahem`men\'-a-hem (menachem, "one who comforts"; Manaem; <a onClick="return mV(\'2Ki\',15,\'14-22\');">2Ki 15:14-22</a>):<P>1. Accession and Reign:<P>Son of Gadi and 16th king of Israel. He reigned 10 years. Menahem was probably the officer in charge of the royal troops in Tirzah, one of the king\'s residences, at the time of the murder of Zechariah by Shallum. Hearing of the deed, he brought up his troops and avenged the death of his master by putting Shallum to death in Samaria. He then seized the vacant throne. His first full year may have been 758 BC (others, as seen below, put later).<P>2. Early Acts:<P>The country at this time, as depicted by Hosea and Amos, was in a deplorable condition of anarchy and lawlessness. Menahem, with a strong hand, enforced his occupation of the throne. One town only seems to have refused to acknowledge him. This was Tiphsah, a place 6 miles southwest of Shechem, now the ruined village of Khurbet Tafsah. As Menahem is said to have attacked this enclosed city from Tirzah, lying to its north, it is probable that he took it on the way to Samaria, before proceeding to do battle with Shallum. If this was so, it is some explanation of the cruelty with which he treated its inhabitants (<a onClick="return mV(\'2Ki\',15,16);">2Ki 15:16</a>). One such instance of severity was enough. The whole kingdom was at his feet. He proved to be a strong and determined ruler, and during the 9 or 10 years of his governorship had no further internecine trouble to contend with.<P>3. Menahem and Assyria:<P>But there was another source of disquiet. Assyria, under Pul, had resumed her advance to the west and threatened the kingdoms of Palestine. Menahem resolved on a policy of diplomacy, and, rather than risk a war with the conqueror of the East, agreed to the payment of a heavy tribute of 1,000 talents of silver. To raise this sum he had to assess his wealthier subjects to the extent of 50 shekels each. As there are 3,000 shekels in a talent of silver, it is obvious that some 60,000 persons, "mighty men of wealth," must have been laid under contribution in this levy—an indication at once of the enormity of the tribute, and of the prosperity of the country at the time. However short-sighted the policy, its immediate purpose was attained, which was that the hand of the Assyrian king "might be with him to confirm the kingdom in his hand" (<a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a>).<P>4. A Conflict of Dates:<P>A difficulty attaches to the dates of this period. The Pul of <a onClick="return mV(\'2Ki\',15,19);">2Ki 15:19</a> and <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a> is now identified with Tiglath-pileser III, who took this title on ascending the throne of Assyria in 745 BC. In an inscription of Tiglath-pileser, Menahem appears as Minehimmu Samarina (Menahem the Samarian), together with Racunnu (Rezin) of Damascus and Hirumu (Hiram) of Tyre. The date given to this inscription is 738 BC, whereas the last year we can give to Menahem is 749, or 10 years earlier.<P>5. Proposed Solutions:<P>The chronological difficulty which thus arises may be met in one of two ways. Either the inscription, like that on the black obelisk of Kurkh (see <a href="./study/isbe/search.html?string=JEHU">JEHU</a>), was written some years after the events to which it refers and contains records of operations in which Tiglath-pileser took part before he became king; or Pekah—who was on the throne of Israel in 738 (?)—is spoken of under the dynastic name Menahem, though he was not of his family. The former of these hypotheses is that which the present writer is inclined to adopt. (By others the dates of Menahem are lowered in conformity with the inscription.)<P>See <a href="./study/isbe/search.html?string=CHRONOLOGY+OF+THE+OLD+TESTAMENT">CHRONOLOGY OF THE OLD TESTAMENT</a>.<P>6. Character:<P>Menahem attempted no reformation in the national religion, but, like all his predecessors, adhered to the worship of the golden calves. On this account, like them, he incurs the heavy censure of the historian.``17';
isbe[5944]='Menan`me\'-nan.`<a href="./study/isbe/search.html?string=MENNA">MENNA</a>`1';
isbe[5945]='Mene, Mene, Tekel, Upharsin`me\'-ne, me\'-ne, te\'-kel, u-far\'-sin, men\'-a, men\'a, tek\'-el, oo-far\'-sin (mene\' mene\' teqel upharcin; Theodotion, Mane, thekel, phares): These are the words that, according to Daniel\'s reading, were inscribed on the walls of Belshazzar\'s palace and that caused the great commotion on the occasion of his last feast (<a onClick="return mV(\'Dan\',5,25);">Da 5:25</a>). As the only authority that we have for the reading is that of Daniel, it seems but fair that the interpretation of the terms be left to the person who gave us the text. According to his interpretation, there is a double sense to be found in the three different words of the inscription (<a onClick="return mV(\'Dan\',5,\'26-28\');">Da 5:26-28</a>).<P>Mene\', which, however it is pointed, must be taken from the verb menah (Hebrew manah; Babylonian manu), is said to have indicated that God had numbered (the days of) Belshazzar\'s kingdom and finished it (or delivered it up). Both of these meanings can be shown to be proper to the menah.<P>Teqel, on the contrary, is interpreted as coming from two roots: the first, teqal, "to weigh," and the second, qal, "to be light or wanting" (Hebrew qalal; Babylonian qalalu).<P>Perec (or parcin) also is interpreted as coming from two roots: first, perac, "to divide" (Hebrew paras or parash; Babylonian parasu), and the second as denoting the proper name Parac, "Persia." Thus interpreted, the whole story hangs together, makes good sense, and is fully justified by the context and by the language employed. If the original text was in Babylonian, the signs were ambiguous; if they were in Aramaic, the consonants alone were written, and hence, the reading would be doubtful. In either case, the inscription was apparent but not readable, except by Daniel with the aid of God, through whom also the seer was enabled to give the proper interpretation. That Daniel\'s interpretation was accepted by Belshazzar and the rest shows that the interpretation of the signs was reasonable and convincing when once it had been made. We see, therefore, no good reason for departing from the interpretation that the Book of Daniel gives as the true one.<P>As to the interpretation of the inscription, it makes no difference whether the signs represented a mina, a shekel, and two perases, as has been recently suggested by M. Clermont-Ganneau. In this case the meaning was not so apparent, but the puns, the play upon the sounds, were even better. We doubt, however, if it can be shown that teqel means sheqel. On the old Aramaic documents of Egypt and Assyria, it is with one exception spelled sheqel. In the Targum of Onkelos, sheqel is always rendered by cela\'; in the Peshitta and Arabic VSS, by mathqal; in the Samaritan Targum, by mathqal (except only perhaps in <a onClick="return mV(\'Gen\',23,16);">Ge 23:16</a>, where we have ethqel). In the Targum of Onkelos, wherever tiqla\' occurs, it translates the Hebrew beqa\' (<a onClick="return mV(\'Gen\',24,22);">Ge 24:22</a> and <a onClick="return mV(\'Exd\',38,26);">Ex 38:26</a> only). Mene\', to be sure, may have meant the mina, and perec, the half-mina. The parash is mentioned in the inscription of Panammu and in an Aramaic inscription on an Assyrian weight. Besides this, it is found in the New Hebrew of the Mishna It is not found, however, in the Targum of Onkelos, nor in Syriac, nor in the Old Testament Hebrew; nor in the sense of half-shekel in the Aramaic papyri. While, then, it may be admitted that Daniel may have read, "A mina, a mina, a shekel, and two half-minas," it is altogether unlikely, and there is certainly no proof that he did. Yet, if he did, his punning interpretations were justified by the usage of ancient oracles and interpreters of signs, and also by the event.``196';
isbe[5946]='Menelaus`men-e-la\'-us (Menelaos): According to the less likely account of Josephus (Ant., XII, v, 1; XV, iii, 1; XX, x, 3), Menelaus was a brother of Jason and Onias III, and his name was really Onias. But it is very unlikely that there should be two brothers of the same name. The account of 2Maccabees is more credible—that Menelaus was the brother of the notorious Simon who suggested to the Syrians the plundering of the temple; he was thus of the tribe of Benjamin (2Macc 4:23; compare with 3:4) and not properly eligible to the high-priesthood. He was entrusted by Jason (171 BC), who had supplanted Onias, with contributions to the king of Syria, Antiochus Epiphanes, and by outbidding Jason in presents he secured the office of high priest for himself (2Macc 4:23f), 171 BC. Menelaus returned with "the passion of a cruel tyrant" to Jerusalem, and Jason fled. But as Menelaus failed to pay the promised amount, both he and Sostratus, the governor, were summoned to appear before the king. Lysimachus, the brother of Menelaus, was left at Jerusalem in the meantime as deputy high priest. The king was called from his capital to suppress an insurrection of Tarsus and Mallus. Menelaus took advantage of his absence to win over Andronicus, the king\'s deputy, by rich presents stolen from the temple. For this sacrilege Onias III sharply reproved him and fled to a sanctuary, Daphne, near Antioch. Andronicus was then further persuaded by Menelaus to entice Onias from his retreat and murder him (2Macc 4:34f)—an act against which both Jews and Greeks protested to the king on his return, and secured deserved punishment for Andronicus. Meanwhile, the oppression of Lysimachus, abetted by Menelaus, caused a bloody insurrection in Jerusalem, in connection with which a Jewish deputation brought an accusation against Menelaus on the occasion of Antiochus\' visit to Tyre. Menelaus bribed Ptolemy, son of Dorymenes, to win over the king to acquit himself and secure the execution of "those hapless men, who, if they had pleaded even before Scythians, would have been discharged uncondemned" (2Macc 4:39ff). Menelaus returned in triumph to his office. But Jason, taking advantage of Epiphanes\' absence in Egypt and a false rumor of his death, made a bloody but unsuccessful attempt upon the city, in order to secure his office again; his rival took refuge in the citadel. The king returned in fury, caused a three days\' slaughter of the citizens, rifled the temple with Menelaus as guide, and left him as one of his agents to keep the Jews in subjection (2Macc 5:1ff). He appears next and for the last time in the reign of Eupator in 162 BC. Lysias, the king\'s chancellor, accused him to the king as the cause of all the troubles in Judea (2Macc 13:3-8). Eupator caused him to be brought to Berea and there—before, according to 2Maccabees, loc. cit., or after, according to Josephus, Ant, XII, ix, 7, the invasion of Judea by Eupator and Lysias—to be put to death by being flung from the top of a high tower into the ashes of which it was full—a fitting end for such a wretch.``5';
isbe[5947]='Menestheus`me-nes\'-thus, me-nes\'-the-us (Menestheus Codex Alexandrinus, Menestheseos): The father of Apollonius, a general of Epiphanes (2Macc 4:21 and in 2Macc 4:4 the Revised Version (British and American), following a conjecture of Hort Menestheos for mainesthai heos the latter is retained in Swete and Fritzache]). "Son of Menestheus" is added to distinguish this Apollonius from "Apollonius, Son of Thrasaeus" (2Macc 3:5) and "Apollonius, Son of Gennaeus" (2Macc 12:2).`<a href="./study/isbe/search.html?string=APOLLONIUS">APOLLONIUS</a>`1';
isbe[5948]='Meni`me\'-ni: Destiny, a god of Good Luck, possibly the Pleiades (<a onClick="return mV(\'Isa\',65,11);">Isa 65:11</a> margin).`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html??string=GAD">GAD</a>`1';
isbe[5949]='Menna`men\'-a (Menna Westcott and Hort, The New Testament in Greek, Tregelles, Tischendorf; Mainan Textus Receptus of the New Testament; the King James Version Menan): An ancestor of Jesus, a great-grandson of David (<a onClick="return mV(\'Luk\',3,31);">Lu 3:31</a>).``1';
isbe[5950]='Menuhah`men-u\'-ha, men-u\'-ka (menuchah, "place of rest"; the King James Version Menuchah): Rendered in <a onClick="return mV(\'Jdg\',20,43);">Jud 20:43</a> the King James Version "with ease," the Revised Version (British and American) "at their resting-place." Both, however, have a marginal suggestion which would make the word a place-name, which would then more naturally read "from Nuhah over against Gibeah," thus describing the ground over which the slaughter of the Benjamites occurred. In <a onClick="return mV(\'1Ch\',8,2);">1Ch 8:2</a> the word "Nohah" occurs as that of a Benjamite elan. The place intended is perhaps <a href="./study/isbe/search.html?string=MANAHATH">MANAHATH</A> (which see).``1';
isbe[5951]='Menuhoth`men-u\'-hoth (menuchoth, "dwellings"; the King James Version manachti Manahethites): The first form is the Revised Version (British and American) transliterated in the name; the second form is the King James Version retained by the Revised Version (British and American) in the passages where the word occurs (<a onClick="return mV(\'1Ch\',2,52);">1Ch 2:52</a>; compare <a onClick="return mV(\'1Ch\',2,54);">2:54</A>). The people here spoken of by the King James Version as "half of the Manahethites" are mentioned as descendants of Salma (<a onClick="return mV(\'1Ch\',2,54);">1Ch 2:54</a>), while those mentioned as Menuhoth are mentioned as descendants of Judah through Shobal, father of Kiriath-jearim. Both words are from the same root. the King James Version keeps the same designation for both passages, while the Revised Version (British and American) has marked the difference in spelling by changing the first passage and following the King James Version in the second. Both sections of the family belong to the Caleb clan, and it would seem that they became the dominant people in the otherwise unknown town of Manahath, so that it came to be regarded as belonging to Judah. It may be connected with the Menuchah (the Revised Version (British and American) "Menuhah") suggested as a place-name in <a onClick="return mV(\'Jdg\',20,43);">Jud 20:43</a> margin. In the Septuagint, between <a onClick="return mV(\'Jos\',15,59);">Joshua 15:59</a> and <a onClick="return mV(\'Jos\',15,60);">60</A>, the names of 11 cities are inserted, among them being a Manocho whose Hebrew equivalent gives the word. It is difficult to identify, and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) cuts the knot by translating "dimidium requietionum"!`<a href="./study/isbe/search.html?string=MANAHATH">MANAHATH</a>`186';
isbe[5952]='Meonenim, Oak of`me-on\'-e-nim, me-o\'-ne-nim: (\'elon me\'onenim; Codex Vaticanus, Elonmaonemein, Codex Alexandrinus, druos apobleponton; the King James Version Plain of): This was a sacred tree which apparently could be seen from the gate of Shechem (<a onClick="return mV(\'Jdg\',9,37);">Jud 9:37</a>). No doubt it took its name from the soothsayers who sat under it, practicing augury, etc. Several times mention is made of sacred trees in the vicinity of Shechem (<a onClick="return mV(\'Gen\',35,4);">Ge 35:4</a>; <a onClick="return mV(\'Jos\',24,26);">Jos 24:26</a>; <a onClick="return mV(\'Jdg\',9,6);">Jud 9:6</a>, etc.). Where this tree stood is not known.`<a href="./study/isbe/search.html?string=AUGUR\'S+OAK">AUGUR\'S OAK</a>`1';
isbe[5953]='Meonothai`me-on\'-o-thi, me-o\'-no-thi, me-o-no\'-thi (me\'onothai, "my dwellings"): A son of Othniel, nephew of Caleb (<a onClick="return mV(\'1Ch\',4,14);">1Ch 4:14</a>). Possibly, as the King James Version margin suggests, and the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) and Complutensian Septuagint say, <a onClick="return mV(\'1Ch\',4,13,14);">1Ch 4:13,14</a> should read "the sons of Othniel, Hathath and Meonothai; and Meonothai begat Ophrah," etc. The latter may be founder of the town of that name.``1';
isbe[5954]='Mephaath`mef\'-a-ath, me-fa\'-ath (mepha\'ath and meypha\'ath, mopha\'ath; Codex Vaticanus, Maiphaath, Mephaath): A city of the Amorites in the territory allotted to Reuben, named with Kedemoth and Kiriathaim (<a onClick="return mV(\'Jos\',13,18);">Jos 13:18</a>), and given to the Merarite Levites (<a onClick="return mV(\'Jos\',21,37);">Jos 21:37</a>; <a onClick="return mV(\'1Ch\',6,79);">1Ch 6:79</a>). It appears again as a Moabite town in <a onClick="return mV(\'Jer\',48,21);">Jer 48:21</a>. It was known to Eusebius and Jerome (Onom) as occupied by a Roman garrison, but the site has been lost.``1';
isbe[5955]='Mephibosheth`me-fib\'-o-sheth (mephibhosheth, "idol-breaker," also <a href="./study/isbe/search.html?string=MERIB-BAAL">MERIB-BAAL</a> (which see); Memphibosthe):<P>(1) Son of Saul by his concubine <a href="./study/isbe/search.html?string=RIZPAH">RIZPAH</a> (which see), daughter of Aiah (<a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a>).<P>See also <a href="./study/isbe/search.html?string=ARMONI">ARMONI</a>.<P>(2) Grandson of Saul, son of Jonathan, and nephew of Mephibosheth (1) (<a onClick="return mV(\'2Sa\',4,4);">2Sa 4:4</a>). He was 5 years old when his father and grandfather were slain. He was living in charge of a nurse, possibly because his mother was dead. Tidings of the disaster at Jezreel and the onsweep of the Philistines terrified the nurse. She fled with her charge in such haste that a fall lamed the little prince in both feet for life. His life is a series of disasters, disappointments, and anxieties. It is a weary, broken, dispirited soul that speaks in all his utterances. The nurse carried him to Lo-debar among the mountains of Gilead, where he was brought up by Machir, son of Ammiel (<a onClick="return mV(\'2Sa\',9,4);">2Sa 9:4</a>). There he evidently married, for he had a son Mica when he returned later at David\'s request. When David had settled his own affairs and subdued his enemies, he turned his inquiries to Saul\'s household to see whether there were any survivors to whom he might show kindness for Jonathan\'s sake (<a onClick="return mV(\'2Sa\',9,1);">2Sa 9:1</a>). The search caused the appearance of Ziba, a servant of Saul\'s house (<a onClick="return mV(\'2Sa\',9,2);">2Sa 9:2</a>), who had meanwhile grown prosperous by some rapid process which can only be guessed at (<a onClick="return mV(\'2Sa\',9,9,10);">2Sa 9:9,10</a>). From him David learned about Mephibosheth, who was sent for. His humble bearing was consistent with his chronically broken spirit. David put Ziba\'s property (which had belonged to Saul) at Mephibosheth\'s disposal and made Ziba steward thereof. Mephibosheth was also to be a daily guest at David\'s table (<a onClick="return mV(\'2Sa\',9,\'11-13\');">2Sa 9:11-13</a>). Seventeen years pass, during which Mephibosheth seems to have lived in Jerusalem. Then came Absalom\'s rebellion. David determined to flee, so distraught was he by the act of his son. At the moment of flight, in great depression and need, he was opportunely met by Ziba with food, refreshment and even means for travel. Naturally, the king inquired for Ziba\'s master. The treacherous reply was made (<a onClick="return mV(\'2Sa\',16,\'1-4\');">2Sa 16:1-4</a>) that Mephibosheth had remained behind for his own ends, hoping the people would give him, Saul\'s grandson, the kingdom. David believed this and restored to Ziba the property lost. Not till many days after did the lame prince get his chance to give David his own version of the story. He met David on his return from quelling Absalom\'s rebellion. He had not dressed his feet, trimmed his beard nor washed his clothes since the hour of David\'s departure (<a onClick="return mV(\'2Sa\',19,24);">2Sa 19:24</a>). At David\'s anxious request Mephibosheth told his story: his servant had deceived him; he wanted to go with David, had even asked for his beast to be saddled; but Ziba had left him, and had slandered him to the king. But he would not plead his cause any more; David is "as an angel of God"; whatever he decides will be well! (<a onClick="return mV(\'2Sa\',19,26,27);">2Sa 19:26,27</a>). Thus characteristically continued the speech of this lame, broken, humble man, son of a proud family (<a onClick="return mV(\'2Sa\',19,28);">2Sa 19:28</a>). David wearily settled the matter by dividing the property between the prince and his servant, the prince expressing utmost content that Ziba should take all so long as David remained friendly (<a onClick="return mV(\'2Sa\',19,29,30);">2Sa 19:29,30</a>). That David accepted Mephibosheth\'s explanation and was drawn out in heart toward the character of the broken man is shown by the fact that when some expiation from Saul\'s household was considered necessary to turn away the famine sent by an offended deity, Mephibosheth is spared when other members of Saul\'s household were sacrificed (<a onClick="return mV(\'2Sa\',21,7);">2Sa 21:7</a>). The character of Mephibosheth well illustrates the effect of continued disaster, suspicion and treachery upon a sensitive mind.``186';
