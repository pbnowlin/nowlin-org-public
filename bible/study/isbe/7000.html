orecast the future, but to declare a present message from the Lord to the people. The prophet of the Old Testament was the forerunner in office and the prototype of the ambassador of Christ. With the development of the synagogue as the center of Hebrew worship, application as well as interpretation of the Law became essential.<P>Moses, the most commanding figure in Hebrew history, was a prophet, and no messages in the Old Testament are more imbued with power, sublimity and pathos than those uttered by the great lawgiver. He became the guide Israel, not so much by his rod as by the word he delivered to the people. There are numerous indications that after Moses there was a continuous class of religious teachers whose work it was to instruct men and inspire the people, as is indicated in the cases of Joshua, in the history of Deborah and Barak, and in the days of solemn assembly which are inconceivable without men who spoke and other men who listened. In the time of Samuel there was a distinct advance made in the work of the prophets, and the prophetic office had become a fixed institution. There were schools of the prophets at Bethel, Jericho and Gilgal, the very seats of heathen idolatry. Under the Old Testament dispensation the whole course of progress was toward presenting divine truth in its simplicity and power, by bringing it to bear upon the popular mind and heart. One of the marks of the new era beginning with John the Baptist was a revival of prophetic preaching (<a onClick="return mV(\'Mat\',11,9);">Mt 11:9</a>), which again resumed its old character and meaning.<P>See <a href="./study/isbe/search.html?string=PROPHECY,+PROPHETS">PROPHECY, PROPHETS</a>.<P>7. Christ as a Preacher:<P>The words meaning "to proclaim as a herald" and "preaching," are frequent in the New Testament. The mission of our Lord was essentially one of proclaiming good tidings concerning the Kingdom of God (<a onClick="return mV(\'Mat\',4,17);">Mt 4:17</a>). He at once, on His entrance upon His ministry, gave to preaching a spiritual depth and practical range which it never had before. At that time preaching had manifestly become a fixed part of the synagogue worship, and was made one of the chief instruments in the spread of the gospel. our Lord constantly taught in the synagogue (<a onClick="return mV(\'Mat\',4,23);">Mt 4:23</a>; <a onClick="return mV(\'Mar\',1,21);">Mr 1:21</a>; <a onClick="return mV(\'Jhn\',6,59);">Joh 6:59</a>). He thus read and interpreted and applied the Law and the Prophets (<a onClick="return mV(\'Mar\',1,39);">Mr 1:39</a>; <a onClick="return mV(\'Luk\',4,16);">Lu 4:16</a>). Christ\'s testimony about Himself was that He came "to bear witness to the truth." The spoken word became His great power in His life and ministry. Throughout His life Jesus was above all things a preacher of the truths of His kingdom. Telling men what He was in Himself, what in His relation to man and his salvation and what to God the Father, formed a large part of His public work.<P>8. The Apostles as Preachers:<P>The preaching of the apostles was essentially prophetic in character, and bore testimony concerning the resurrection of Jesus and His early return to judgment (<a onClick="return mV(\'Act\',2,24,32,36);">Ac 2:24,32,36</a>; <a onClick="return mV(\'1Cr\',15,15);">1Co 15:15</a>). The sermons of the apostles which are reported with much fullness are those of Peter on the Day of Pentecost (<a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>), his address in the house of Cornelius at Caesarea (<a onClick="return mV(\'Act\',10,\'1-\');">Ac 10</a>), and the counsels of James to the brethren at Jerusalem, as to what ordinances should be imposed on Gentile Christians. In the early church preachers were first of all witnesses to what Jesus had said and done, and to the significance to be attached to the great facts of the redemptive history. With the spread of the gospel and the passing of time, this office was taken up by others, especially such as were endued with "the word of wisdom" and "of knowledge" (<a onClick="return mV(\'1Cr\',12,8);">1Co 12:8</a>).<P>9. Fundamental Postulates:<P>Upon the basis of what is taught in the word of God there are two fundamentally important postulates concerning preaching and the preacher.<P>(1) Preach the Word.<P>The first note of preaching is that it be the word of God (<a onClick="return mV(\'2Ti\',4,2);">2Ti 4:2</a>). Out of the Bible must the life of every generation of Christians be fed. To Holy Scripture, therefore, ought the pulpit to abide faithful, for out of its treasures the preacher fulfils his double office of edifying believers and subjugating the world to Christ. There must always be an organic connection between the word in the text and the sermon.<P>(2) "We Are Ambassadors."<P>The work of preaching is the fulfillment of a divinely instituted ambassadorship (<a onClick="return mV(\'2Cr\',5,20);">2Co 5:20</a>). The gospel is put into the hands of men for a distinct purpose, and is to be administered in accordance with the plan of its author. The preacher is in a very distinct sense a trustee. "But even as we have been approved of God to be entrusted with the gospel, so we speak; not as pleasing men, but God who proveth our hearts" (<a onClick="return mV(\'1Th\',2,4);">1Th 2:4</a>). Those who have accepted the responsibility imposed upon them by this divine commission are enjoined to exercise their office so as to warrant the approbation of Him who has appointed them to a specific work. The homiletic practice of taking theme of every sermon from a passage of Holy Writ has been an almost invariable rule in the history of the church. It is the business of the preacher to present the truth embodied in the text in its integrity. In the exercise of his divinely-appointed ambassadorship he is to administer God\'s word revealed to Christian faith, not human opinions or speculations.``9';
isbe[7070]='Precept`pre\'-sept: A commandment, an authoritative rule for action; in the Scriptures generally a divine injunction in which man\'s obligation is set forth (Latin praeceptum, from praecipere, "to instruct").<P>Four words are so rendered in the King James Version:<P>(1) mitswah, very frequently (168 times) translated "commandment," but 4 times "precept" (in the Revised Version (British and American) only <a onClick="return mV(\'Jer\',35,18);">Jer 35:18</a>; <a onClick="return mV(\'Dan\',9,5);">Da 9:5</a>);<P>(2) from the same root is tsaw, or tsaw (<a onClick="return mV(\'Isa\',28,10,13);">Isa 28:10,13</a>);<P>(3) piqqudhim, only in the Psalms (21 times in <a onClick="return mV(\'Psa\',119,1);">Ps 119</a>, e.g. verses <a onClick="return mV(\'Psa\',119,4,15,27);">4,15,27</a>; also the Revised Version (British and American) <a onClick="return mV(\'Psa\',19,8);">Ps 19:8</a>; <a onClick="return mV(\'Psa\',103,18);">103:18</a>; <a onClick="return mV(\'Psa\',111,7);">111:7</a>);<P>(4) in the New Testament, entole, generally in the King James Version translated "commandment" (68 times), but twice "precept" (<a onClick="return mV(\'Mar\',10,5);">Mr 10:5</a>; <a onClick="return mV(\'Hbr\',9,19);">Heb 9:19</a>; in both cases the Revised Version (British and American) substitutes "commandment").`<a href="./study/isbe/search.html?string=COMMANDMENT">COMMANDMENT</a>`49';
isbe[7071]='Precious`presh\'-us (stands for 17 different words, chief of which are yaqar; timios):<P>(1) Generally in the literal sense, "of great price," "costly," "expensive," of material things (e.g. <a onClick="return mV(\'Pro\',1,13);">Pr 1:13</a>; <a onClick="return mV(\'Jer\',20,5);">Jer 20:5</a>; <a onClick="return mV(\'Mar\',14,3);">Mr 14:3</a> the King James Version), especially of precious stones (<a onClick="return mV(\'2Sa\',12,30);">2Sa 12:30</a>; <a onClick="return mV(\'2Ch\',3,6);">2Ch 3:6</a>; <a onClick="return mV(\'1Cr\',3,12);">1Co 3:12</a> the King James Version, etc.).<P>(2) Sometimes "of great moral (non-material) value." "Precious in the sight of Yahweh is the death of his saints" (<a onClick="return mV(\'Psa\',116,15);">Ps 116:15</a>); "his precious and exceeding great promises" (<a onClick="return mV(\'2Pe\',1,4);">2Pe 1:4</a>); compare <a onClick="return mV(\'Psa\',139,17);">Ps 139:17</a>; <a onClick="return mV(\'2Pe\',1,1);">2Pe 1:1</a>.<P>The literal and the moral senses are both involved in the expression, "knowing that ye were redeemed, not with corruptible things,...but with precious blood" (<a onClick="return mV(\'1Pe\',1,18,19);">1Pe 1:18,19</a>). "Preciousness" (time) occurs in <a onClick="return mV(\'1Pe\',2,7);">1Pe 2:7</a> the American Standard Revised Version, the English Revised Version, for the King James Version "precious."``49';

isbe[7074]='Predestination`pre-des-ti-na\'-shun (prothesis, prognosis proorismos):<P>1. Predestination as a Biblical Question<P>2. Its Fundamental Importance<P>3. The Nature of Predestination<P>4. The Doctrine in Scripture<P>5. Historic Rise and Development of the Doctrine<P>6. The Doctrine in the Middle Ages<P>7. Predestination in the Reformed Theology<P>8. Predestination in Lutheranism<P>9. The Arminian View<P>10. Wesleyanism on Predestination<P>11. Present Needs and Values of the Doctrine<P>LITERATURE<hr /><P>1. Predestination as a Biblical Question:<P>Predestination can be, and has sometimes been, regarded as a philosophical question rather than a Biblical one. It is with predestination as a Biblical question, however, that we are here mainly concerned. It is possible to urge, and it has been urged, that the philosophical question—whether all that occurs is foreordained—is not discussed and decided by Scripture. Theology, starting from God in its interpretation of all things, has arrived at universal foreordination by a species of deductive reasoning. But we must not argue the matter from any abstract principles, but deal with the actual facts as set forth in Scripture and as found, inductively, in the experience of man.<P>2. Its Fundamental Importance:<P>It must first be asserted, however, in view of much loose modern thinking, that predestination is a category of religious thought of fundamental importance. No category of religious thought could go deeper, for it reaches down to the Infinite Will in relation to the universe of finite wills, and lays stress on will as the core of reality. The philosophy of our time may be said to have received, from the time of Schopenhauer, an impact toward will-emphasis, alike in respect of will in the universe and in man. But the relation of the Absolute Will to the universe, and to mankind, is precisely that with which we are concerned in predestination.<P>3. Nature of Predestination:<P>Predestination is that aspect of foreordination Whereby the salvation of the believer is taken to he effected in accordance with the will of God, who has called and elected him, in Christ, unto life eternal. The divine plan of salvation must certainly be conceived under this aspect of individual reference. To understand and set forth the nature, and ethically justifiable character, of such a foreordaining to life eternal, is our purpose. For doctrine has need to be purged of the historic inconsistencies, and fatal illogicalities, with which, in its older forms of presentation, it was often infected. This, especially, in order that the doctrine may appear as grounded in reason and righteousness, not in arbitrariness and almighty caprice.<P>4. The Doctrine in Scripture:<P>To begin with, it must be said that there seems to be no evading the doctrine of an election by grace, as found both in the letter and the spirit of Scripture. The idea of predestination is set forth, with great power and clearness, in <a onClick="return mV(\'Rom\',8,29,30);">Ro 8:29,30</a>, and with its elements or parts articulated in natural and striking form. The idea recurs in <a onClick="return mV(\'Eph\',1,\'1-\');">Eph 1</a>, where it is finely said (<a onClick="return mV(\'Eph\',1,4,5);">1:4,5</a>) that God hath chosen us in Christ "before the foundation of the world," having predestinated or "foreordained us unto adoption as sons through Jesus Christ"; and where it is said, further, that our salvation imports "the mystery of his will, according to his good pleasure" (<a onClick="return mV(\'Eph\',1,9);">1:9</a>), which He purposed in Christ. This "eternal purpose" to save men through Christ is again referred to in <a onClick="return mV(\'Eph\',3,11);">Eph 3:11</a>. This helpful mode of viewing predestination as in Christ, and never outside Him, had a place in religious thought at the Reformation time, as the famous "Formula of Concord," to be referred to below, shows. The predestined certainty of God\'s gracious work in Christ was not meant to perplex men, but to encourage and reassure all who trust in His grace. In <a onClick="return mV(\'Rom\',9,\'14-25\');">Ro 9:14-25</a>, the absolute sovereignty of God is put in a form whereby election is made to originate in the divine will apart from all human merit, whether actual or foreseen. But from this assertion of God\'s free supremacy we can derive no concrete theodicy, or do more than infer that God is just and wise in His exercise of free grace, even when His doings are most perplexing to us.<P>5. Historic Rise and Development of the Doctrine:<P>The needful thing is to understand, so far as may be, the nature of the cooperation that takes place between the divine and the human factors or elements, which latter factors include natural capacity, disposition and development, working under grace. It must be carefully observed that nothing in Scripture points to any personal and inexorable predestination to reprobation, in any sense corresponding to the personal election to salvation just spoken of. A non-election there may be, of course, but not in any sense that annuls full personal responsibility for coming short of life everlasting. The appeal of Scripture from first to last is to men as free. Calvin\'s strange way of putting the matter was, "Man therefore falls, God\'s Providence so ordaining, but he falls by his own fault." This idea of reprobation was first introduced by Gottschalk, a monk of the 9th century, long after the predestination doctrine had received its first full and positive exposition by Augustine. Augustine, following upon the indecision shown by the fathers in the first three centuries of the church, made the doctrine of a special predestination his foundation for special grace, in opposition to Pelagius. Augustine gave new prominence in his theory to the absolute will of God: he made divine grace the only ground of man\'s salvation; it was to him the irresistible power working faith within the heart, and bringing freedom as its result. It was to him God\'s absolute predestination that determined who were believers. But Augustine held predestination as an inference from his conception of the Fall and of grace, rather than as a metaphysical principle.<P>6. The Doctrine in the Middle Ages:<P>In the Middle Ages, Anselm, Peter Lombard, and Aquinas, followed the Augustinian views only to a certain extent. Aquinas admits that predestination implies a relation to grace, but holds that grace is not of the essence of predestination. Predestination is, to Aquinas, a part of Providence, and it presupposes election in the order of reason. Though divine goodness in general be without election, Aquinas thinks the communication of a particular good cannot be without election. Predestination has, for him, its foundation in the goodness of God, which is its reason. Aquinas thinks predestination most surely takes effect, but not as from necessity; the effect takes place under the working of contingency. From such views we are recalled to the idea of a rigorous predestination, by Thomas Bradwardine and John Wycliff, in pre-Reformation times. We are thus brought up to the decretal system—so called from Calvin\'s making predestination consist of the eternal decree of God—which became, in its metaphysical principle, the fundamental position of the whole Reformed theology after the Reformation.<P>7. Predestination in the Reformed Theology:<P>The theology of the Reformed church adopted the Calvinistic doctrine of the decree of predestination and election. Calvin, however, simply carried the Augustinian theory to its logical and necessary conclusion, and he was the first to adopt the doctrine as the cardinal point or primordial principle of a theological system. Zwingli, it must be remembered, was, even before Calvin, of consistent deterministic leanings, as part of his large speculative views, which were not without a tendency to universalism. Salvation was, to Calvin, the execution of a divine decree, which was supposed to fix the extent and conditions of such salvation.<P>(1) Calvin\'s Definition.<P>Reprobation was, for Calvin, involved in election, and divine foreknowledge and foreordination were taken to be identical. Calvin\'s mode of defining predestination was as the eternal decree of God, by which He has decided with Himself what is to become of each and every individual. For all, he maintains, are not created in like condition; but eternal life ordained for some, eternal condemnation for others. Calvin confesses that this is a "horrible decree," and it is not surprising to find competent theologians in our time denying such a form of predestinarianism any place in the teachings of Paul, who never speaks of reprobation.<P>(2) Theology Advanced by Calvin.<P>It is generally overlooked, however, that theological advance registered by Calvin is to be seen by study of the views of the Middle Ages, and on to the Reformation, not by viewing Calvinism in our post-Reformation lights. It was love—"the fatherly love of God," as he terms it—the efficiency of saving love—which Calvin insisted upon, above all, in his teaching about God. But Calvin also heightened men\'s ideas as to the certitude of personal salvation. It is but fair to Calvin to remember—for superficial acquaintance with his teachings is far from rare—that he, in the strongest manner, maintained divine sovereignty to be that of divine wisdom, righteousness, and love, and expressly rejected the notion of absolute power as, in this connection, a heathenish idea. The Calvinistic doctrine was not absolute, but mediated in Christ, and conditioned upon faith.<P>8. Predestination in Lutheranism:<P>Luther and the Lutheran church at first shared the doctrine of predestination and election, Luther in his treatment of free will reproducing the Augustinian form of the doctrine in a strict manner. The predestination of Luther and Melanchthon proceeded, not from their conception of God, but rather from the doctrine of sin and grace. Melanchthon was less disposed than Luther to press the doctrine of absolute predestination, and, in his "synergistic" tendencies, laid increasing stress on human freedom, until he at length rejected the doctrine of absolute predestination. He was blamed by strict Lutheranism for yielding too much to Pelagianism. But the Lutheran "Formula of Concord," prepared in 1577, was not a very logical and consistent presentation of the case, for, opposed at points to Augustinianism, it fell back, in the end, on election in the Augustinian spirit. Or, to put the matter in another form, the "Formula of Concord" may be said to have held with Augustinianism, but to have differed by maintaining a Universal call along witha particular election, and it rejected the decree of reprobation. Later Lutheranism adopted a moderate form of doctrine, wherein predestination was often identified with prescience. But Lutheranism ought not, in strictness, to be identified, as is sometimes done, with the Arminian theory. The Lutheran doctrine of predestination was further developed by Schleiermacher, who emphasized the efficiency of grace, while adopting its universality in the Lutheran sense.<P>9. The Arminian View:<P>Arminianism, in its earliest assertion, maintained simply universal grace and conditional election. But in the five articles it formulated its opposition to Calvinism, although Arminius does not appear to have been more than moderately Calvinistic, as we would account it. Arminius gave grace supreme place, and made it, when welcome, pass into saving grace. He made election depend on faith, which latter is the condition of universal grace. Arminianism rejects the so-called common grace of the predestination theory, and its effectual grace for the elect, for, in the Arminian view, saving grace can in no case be missed save by resistance or neglect. Arminianism holds the awakened human will to cooperate with divine grace, in such wise that it rests with the human will whether the divine grace is really accepted or rejected. It is the claim of Arminianism to do more justice than Calvinism to faith and repentance, as conditions of personal salvation, and precedent thereto. The Arminian standpoint admits the foreknowledge of God, but denies foreordination, though it must seem difficult to reduce the foreknowledge of God to such a bare knowledge of the future. But it is, of course, freely to be granted that foreknowledge in God, simply as knowledge, does not carry any causal energy or efficiency with it. But it may still be doubted whether the prescience of God can be nothing more fruitful and creative than such a position implies, and whether its relation to predestination may not be a more necessary one. The theory seems to fail of giving satisfactory account of the divine activity in its relation to human activity, in the sphere of grace. The shortcoming of Arminianism lies in its failing also to do justice to the spirit of Scripture with its emphatic assertion of the doctrine of God as the one absolute will, which, in its expression, is the sole originative power of the universe.<P>See also <a href="./study/isbe/search.html?string=PROVIDENCE">PROVIDENCE</a>.<P>10. Wesleyanism on Predestination:<P>Wesleyanism, or Methodist Arminianism, maintains, like Calvinism, the will of God to be supreme. But it distinguishes between the desires and the determinations of God. It takes divine foreknowledge to precede the divine volitions. It makes God\'s prescience purely intuitional, and regards that which He knows as nowise necessitated by such knowledge, a conception of God which differentiates the Wesleyan type of thought from Calvinism. God is held to have left events in the moral sphere contingent, in an important sense, upon the human will. Hence, human probation is based upon this position, as to man\'s free choice. Influence of God upon man\'s will is postulated, for its right guidance and direction, but not in any coercive sense, as Augustinianism seems to Wesleyanism to imply. Thus, it is hoped to preserve just balance, and maintain proper responsibility, between the divine and the human factors in this spiritual cooperation.<P>When we come to the present needs and values of the predestination doctrine, we have to remark the primal need of a thoroughly ethicized conception of God. The past few decades have witnessed a lessened interest in this doctrine, largely because of the increasingly ethical conceptions of Deity.<P>11. Present Needs and Values of the Doctrine:<P>That is to say, the doctrine of the sovereignty of God\'s will has ceased to be taken, as often in the older presentations, as mere almightiness, or arbitrary and resistless will. Calvin expressly taught that no cause or ground but God\'s unconditioned will was to be sought; but he feebly tried to save divine will from sheer omnipotence by saying that God is law to Himself; and the notion of sovereignty continued to be presented in ways quite absolute and irresponsible. But God we now regard as the absolute and eternal reason, no less than the supreme will, and as both of these in the one indivisible and absolute personality. We have passed from an abstract predestinationism to maintain God in living and ethical relations to the world and to man. Such an ethical sovereignty we hold to be necessary, over against that lax humanitarian spirit, which, in its recoil from the older Calvinism, invests the Deity with no greater powers of moral determination than may be implied in His love, when viewed as a mere golden haze of good will.<P>LITERATURE.<P>The relative works of Augustine, Aquinas, Zwingli, Calvin, Luther, Melanchthon, Arminius, Wesley, Rothe, Dorner, Luthardt; W. Cunningham, The Reformers, and the Theology of the Reformation, 1862; James Orr, article "Calvinism," in Hastings, Encyclopedia of Religion and Ethics; and the various Histories of Christian Doctrine.`<a href="./study/isbe/search.html?string=ELECTION">ELECTION</a>; <a href="./study/isbe/search.html?string=FOREORDAIN">FOREORDAIN</a>`96';
isbe[7075]='Preeminence`pre-em\'-i-nens: Superiority, especially in noble or excellent qualities. The word stands for: (1) mothar, "what is over and above," "excellence"; "Man hath no preeminence above the beasts" (<a onClick="return mV(\'Ecc\',3,19);">Ec 3:19</a>); (2) proteuo, "to be first"; "That in all things he (= Christ) might have the preeminence" (<a onClick="return mV(\'Col\',1,18);">Col 1:18</a>); (3) ho philoproteuon, is translated "who loveth to have the preeminence," literally "who loveth to be first" (of Diotrephes, <a onClick="return mV(\'3Jo\',1,9);">3Joh 1:9</a>).``1';
isbe[7076]='Prefer`pre-fur\':Does not always have the general meaning "to choose before another." In <a onClick="return mV(\'Psa\',137,6);">Ps 137:6</a>, it does have this sense and the two versions agree; in <a onClick="return mV(\'Est\',2,9);">Es 2:9</a>, the Revised Version (British and American) has "removed" where the King James Version has "preferred"; in <a onClick="return mV(\'Dan\',6,3);">Da 6:3</a>, "distinguished" takes its place; in <a onClick="return mV(\'Jhn\',1,15,30);">Joh 1:15,30</a>, "become" is substituted for "preferred"; in <a onClick="return mV(\'Jhn\',1,27);">1:27</a>, "preferred" drops out entirely; in <a onClick="return mV(\'Rom\',12,10);">Ro 12:10</a>, the versions agree.``1';
isbe[7077]='Preparation`prep-a-ra\'-shun: The concordances indicate that the word "preparation" occurs only twice in the Old Testament, once in <a onClick="return mV(\'1Ch\',22,5);">1Ch 22:5</a>, where it is used in the ordinary sense "to make preparation," and once in <a onClick="return mV(\'Nah\',2,3);">Na 2:3</a>, "in the day of his preparation," both of them translating the same Hebrew root and requiring no special elucidation. In <a onClick="return mV(\'Eph\',6,15);">Eph 6:15</a> the apostle speaks of the equipment of the Christian as including the "feet shod with the preparation of the gospel of peace," which means, according to Thayer, "with the promptitude and alacrity which the gospel produces."<P>The word occurs with technical significance ("the Preparation") in the gospel narratives of the crucifixion, translating the Greek paraskeue (<a onClick="return mV(\'Mat\',27,62);">Mt 27:62</a>; <a onClick="return mV(\'Mar\',15,42);">Mr 15:42</a>; <a onClick="return mV(\'Luk\',23,54);">Lu 23:54</a>; <a onClick="return mV(\'Jhn\',19,14,31,42);">Joh 19:14,31,42</a>). It is used as a technical term indicating the day of the preparation for the Sabbath, that is, the evening of Friday. This is its use in Josephus, Ant, XVI, vi, 2, and presumably in the Synoptics. Later its use seems to have been extended to denote regularly the 6th day (Friday) of each week. So in the Didache, viii and the Martyrdom of Polycarp, vii.<P>The addition of the phrase tou pascha, "of the passover," in <a onClick="return mV(\'Jhn\',19,14);">Joh 19:14</a>, and of the phrase "for the day of that sabbath was a high day," in <a onClick="return mV(\'Jhn\',19,31);">19:31</a>, seems to indicate that the author of the Fourth Gospel regarded the Passover as occurring on the Sabbath in the year of the crucifixion. This is clearly the natural interpretation of the words of John\'s Gospel, and if it were not for the seeming contradiction to the narrative of the Synoptics it is very doubtful whether any other interpretation would ever have been put upon them. This question is discussed in the articles on the date of the crucifixion and the Lord\'s Supper, and it will be necessary only to allude to it here.<P>It is possible that the phrase the "Preparation of the passover" in <a onClick="return mV(\'Jhn\',19,14);">Joh 19:14</a> may mean it was the preparation day (Friday) of the Passover week (see Andrews, Life of our Lord, 451ff; and most recently Zahn, Das Evangelium des Johannes, 1908, 637ff). This method of harmonizing seems to the present writer to be forced, and it therefore seems wiser to give to the words of <a onClick="return mV(\'Jhn\',19,14);">Joh 19:14</a> their natural interpretation, and to maintain that, according to the author of the Fourth Gospel, the Passover had not been celebrated at the time of the crucifixion. There seems to be reason to believe that the ordinary view that the Lord\'s Supper was instituted in connection with the Passover, based upon the narrative in Mark (<a onClick="return mV(\'Mar\',14,12);">14:12</a>ff), does not have the unanimous support of the Synoptic Gospels.<P>LITERATURE.<P>In addition to references in the body of the article, the commentaries, especially Plummer, Cambridge Bible, "St. John," Appendix A; Allen, ICC, "St. Matthew," 270-74; Godet, Commentary on the New Testament; Gospel of John, English translation, New York, 1886, II, 378, 379; and the significant articles on the interpretation of <a onClick="return mV(\'Luk\',22,15,16);">Lu 22:15,16</a> by Burkitt and Brooke, Journal of Theological Studies, IX, 569ff, and by Box, ib, X, 106.``13';
isbe[7078]='Presbyter; Presbytery`prez\'-bi-ter, pres\'-bi-ter, prez\'-bi-ter-i, pres\'-bi-ter-i (presbuteros, presbuterion):<P>1. Words Used in the New Testament:<P>This latter word occurs in the New Testament once (<a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>), so rendered in both the King James Version and the Revised Version (British and American). But the original Greek occurs also in <a onClick="return mV(\'Luk\',22,66);">Lu 22:66</a>, in the Revised Version (British and American) translated "the assembly of the elders," in the King James Version simply "the elders"; and in <a onClick="return mV(\'Act\',22,5);">Ac 22:5</a>, translated in English Versions of the Bible "the estate of the elders"; in both of which occurrences the word might more accurately be translated "the presbytery," just as it is in <a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>. Besides these three occurrences of the neuter singular presbuterion, the masculine plural presbuteroi, always translated "elders," is often used to indicate the same organization or court as the former, being applied earlier in New Testament history to the Jewish Sanhedrin (<a onClick="return mV(\'Mat\',27,1);">Mt 27:1</a>; <a onClick="return mV(\'Mat\',28,12);">28:12</a>; <a onClick="return mV(\'Luk\',9,22);">Lu 9:22</a>; <a onClick="return mV(\'Act\',4,5,8);">Ac 4:5,8</a>), and later in the development of the church to its governing body, either in general (<a onClick="return mV(\'Act\',15,2,4,6,22);">Ac 15:2,4,6,22</a>f), or locally (<a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>; <a onClick="return mV(\'Act\',16,4);">16:4</a>; <a onClick="return mV(\'Act\',20,17);">20:17</a>; <a onClick="return mV(\'1Ti\',5,17);">1Ti 5:17</a>; <a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>, etc.). It is sometimes used of the body, or succession, of religious teachers and leaders of the nation\'s past (<a onClick="return mV(\'Mat\',15,2);">Mt 15:2</a>; <a onClick="return mV(\'Hbr\',11,2);">Heb 11:2</a>). The word "presbyter" has been contracted by later ecclesiastical usage into the title "priest," although in the New Testament they are by no means identical, but on the contrary are often explicitly distinguished (<a onClick="return mV(\'Mar\',14,43);">Mr 14:43</a>; <a onClick="return mV(\'Act\',23,14);">Ac 23:14</a>).<P>2. Based on the Synagogue Plan:<P>The local synagogue of the Jewish church was under the care and control of a body of representative men called "the elders" (<a onClick="return mV(\'Luk\',7,3);">Lu 7:3</a>). Naturally the Christian church, beginning at Jerusalem and formed on the lines of the synagogue, took over the eldership into its own organization (<a onClick="return mV(\'Act\',11,30);">Ac 11:30</a>; <a onClick="return mV(\'Act\',15,2);">15:2</a>; <a onClick="return mV(\'1Pe\',5,1);">1Pe 5:1</a>, etc.); so also in all the cities in which the missionary activities of the apostles made church organization necessary, the local synagogues readily suggested and supplied a feasible plan for such organization (<a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>; <a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>). The mother-church at Jerusalem, formed after the pattern of the synagogue, might well have offered to the churches formed elsewhere under apostolic preaching the only conceivable plan. We do not know from the New Testament passages how these elders were selected; we must infer that they were elected by the membership of the churches, as under the synagogue plan; they were then installed into their office by apostles (<a onClick="return mV(\'Act\',14,23);">Ac 14:23</a>), or by apostolic helpers (<a onClick="return mV(\'Tts\',1,5);">Tit 1:5</a>), or by "the presbytery" (<a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>), or by both together (<a onClick="return mV(\'2Ti\',1,6);">2Ti 1:6</a>; compare <a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>). So early as the Pauline letters the office of presbyter seems already to have borne the distinction of two functions: teaching and ruling (<a onClick="return mV(\'1Ti\',5,17);">1Ti 5:17</a>; compare <a onClick="return mV(\'Act\',20,17,28);">Ac 20:17,28</a>; <a onClick="return mV(\'1Th\',5,12,13);">1Th 5:12,13</a>; <a onClick="return mV(\'1Pe\',5,2);">1Pe 5:2</a>).<P>3. Principle Found in the New Testament:<P>In the New Testament history and epistles it does not appear that the various churches of a district were already organized into an ecclesiastical body known as "the presbytery," having some basis of representation from the constituent churches. But the absence of such mention is far from being final proof that such district organizations did not exist; little dependence can be placed on mere negative arguments. Moreover, the council of apostles and elders in Jerusalem, to which Paul and Barnabas appealed (<a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>), is positive evidence of the principle of representation and central authority. The various district organizations would quickly follow as administrative and judicial needs demanded; such development came early in the growth of the church, so early that it is unmistakably present in the post-apostolic age.<P>In Revelation the 24 elders occupy a conspicuous place in the ideal church (<a onClick="return mV(\'Rev\',4,4,10);">Re 4:4,10</a>; <a onClick="return mV(\'Rev\',5,6);">5:6</a>, etc.), sitting for those they represent, as an exalted presbytery, close to the throne of the Eternal One. "The four and twenty elders occupying thrones (not seats) around the throne are to be regarded as representatives of the glorified church; and the number, twice twelve, seems to be obtained by combining the number of the patriarchs of the Old Testament with that of the apostles of the New Testament" (Milligan on <a onClick="return mV(\'Rev\',4,4);">Re 4:4</a> in the Expositor\'s Bible).<P>4. In the Presbyterian Church:<P>Presbytery is the court, or representative body, in the Presbyterian Church next above the Session of the local church. The Session is composed of the ruling elders, elected by the membership of a particular church, with the minister as moderator or presiding officer. The Presbytery is composed of all the ordained ministers, or teaching elders, and one ruling elder from the Session of each church in a given district or community. To it now, as in New Testament times (<a onClick="return mV(\'1Ti\',4,14);">1Ti 4:14</a>), is committed the power of ordination; as also of installation and removal of ministers. It has supervision of the affairs which are general to the churches in its jurisdiction, and the power of review in all matters concerning the local churches (see Form of Government, Presbyterian Church in U.S.A., chapter x). The Presbytery elects the representatives composing the General Assembly, which is the highest court of the Presbyterian Church.<P>5. In Architecture:<P>In ecclesiastical architecture the presbytery is that part of the church structure which is set apart for the clergy, usually the space between altar and apse; sometimes used of the whole choir space, but ordinarily the word is more restricted in its meaning.`<a href="./study/isbe/search.html?string=BISHOP">BISHOP</a>; <a href="./study/isbe/search.html?string=CHURCH">CHURCH</a>; <a href="./study/isbe/search.html?string=ELDER">ELDER</a>; <a href="./study/isbe/search.html?string=GOVERNMENT">GOVERNMENT</a>`109';
isbe[7079]='Presence`prez\'-ens: In the Old Testament nearly always the rendition of panim, "face" (<a onClick="return mV(\'Gen\',3,8);">Ge 3:8</a>; <a onClick="return mV(\'Exd\',33,14);">Ex 33:14</a>f; <a onClick="return mV(\'Psa\',95,2);">Ps 95:2</a>; <a onClick="return mV(\'Isa\',63,9);">Isa 63:9</a>, etc.); occasionally of \'ayin, "eye" (<a onClick="return mV(\'Gen\',23,11);">Ge 23:11</a>; <a onClick="return mV(\'Deu\',25,9);">De 25:9</a>; <a onClick="return mV(\'Jer\',28,1,11);">Jer 28:1,11</a>, etc.); and in <a onClick="return mV(\'1Ki\',8,22);">1Ki 8:22</a>; <a onClick="return mV(\'Pro\',14,7);">Pr 14:7</a>, "the presence of" represents the preposition neghedh, "before"; compare also Aramaic qodham, in <a onClick="return mV(\'Dan\',2,27);">Da 2:27</a> the King James Version (the Revised Version (British and American) "before"). In Greek, "presence" has an exact equivalent in parousia, but this word is rendered "presence" only in <a onClick="return mV(\'2Cr\',10,10);">2Co 10:10</a>; <a onClick="return mV(\'Phl\',2,12);">Php 2:12</a>; the Revised Version (British and American); <a onClick="return mV(\'Phl\',1,26);">Php 1:26</a> (the King James Version "coming"). Elsewhere parousia is rendered "coming," but always with "presence" in the margin. Otherwise in the New Testament "presence" represents no particular word but is introduced where it seems to suit the context (compare e.g. <a onClick="return mV(\'Act\',3,13);">Ac 3:13</a> the King James Version and <a onClick="return mV(\'Act\',3,19);">Ac 3:19</a>).`<a href="./study/isbe/search.html?string=PAROUSIA">PAROUSIA</a>`48';
isbe[7080]='Present`prez\'-ent.`<a href="./study/isbe/search.html?string=GIFT">GIFT</a>`1';
isbe[7081]='Presently`prez\'-ent-li: The strict meaning is of course "at the present moment," "instantly," and the modern force "after a short interval" is due simply to the procrastinating habits of mankind; hence, the Revised Version (British and American) modifications of the King James Version use of the word into "immediately" (<a onClick="return mV(\'Mat\',21,19);">Mt 21:19</a>), "even now" (<a onClick="return mV(\'Mat\',26,53);">Mt 26:53</a>), and "forthwith" (<a onClick="return mV(\'Phl\',2,23);">Php 2:23</a>). In <a onClick="return mV(\'Pro\',12,16);">Pr 12:16</a>, the uncertainty of the meaning (margin "openly," Hebrew "in the day") has led to the retention of the King James Version word.``1';
isbe[7082]='President`prez\'-i-dent (carakh): Used only in <a onClick="return mV(\'Dan\',6,\'2-7\');">Da 6:2-7</a>. Probably a Persian derivative from sar, "head," and the Aramaic equivalent for Hebrew shoter. The meaning is self-evident and refers to the appointment of Daniel by Darius to be one of the three princes who had rule over the satraps of the empire.``1';
isbe[7083]='Press`pres: As a verb is used in the Revised Version (British and American) as a translation of no less than 13 Greek and Hebrew words (rather more in the King James Version). All the Revised Version (British and American) uses are modern. In the King James Version may be noted <span class="noTag">The Wisdom of Solomon 17:11</a>, "pressed with conscience" (the Revised Version (British and American) "pressed hard by"); 2Macc 14:9, "pressed on every side" (the Revised Version (British and American) "surrounded by foes"); <a onClick="return mV(\'Act\',18,5);">Ac 18:5</a>, "pressed in the spirit" (the Revised Version (British and American) "constrained by"). As a noun, the King James Version uses "press" in <a onClick="return mV(\'Mar\',2,4);">Mr 2:4</a> for ochlos, "crowd" (so the Revised Version (British and American)).`<a href="./study/isbe/search.html?string=VINE">VINE</a>; <a href="./study/isbe/search.html?string=WINE">WINE</a>`1';
isbe[7084]='Pressfat`pres\'-fat (<a onClick="return mV(\'Hag\',2,16);">Hag 2:16</a> in the King James Version, the English Revised Version "winefat," the American Standard Revised Version "winevat").`<a href="./study/isbe/search.html?string=WINE">WINE</a>`1';
isbe[7085]='Presume; Presumptuous; Presumptuously`pre-zum\', pre-zump\'-tu-us, pre-zump\'-tu-us-li: "To presume" ("to take or go beforehand") is to speak or act without warrant or proudly. In the Old Testament the words are for the most part the translation of zudh, and zidh, "to boil up" (as water), and derivatives; hence, to act proudly, to speak unauthorizedly, etc. (<a onClick="return mV(\'Deu\',18,20,22);">De 18:20,22</a>, of the prophet; <a onClick="return mV(\'Exd\',21,14);">Ex 21:14</a>; <a onClick="return mV(\'Deu\',1,43);">De 1:43</a>; <a onClick="return mV(\'Deu\',17,12,13);">17:12,13</a>; <a onClick="return mV(\'Psa\',19,13);">Ps 19:13</a>, "presumptuous sins" (zedh, "proud"); compare <a onClick="return mV(\'Psa\',86,14);">Ps 86:14</a>; <a onClick="return mV(\'Psa\',119,21);">119:21</a>, etc.; <a onClick="return mV(\'Pro\',21,24);">Pr 21:24</a>, etc.). Other words are male\', "to fill," "to be full" (<a onClick="return mV(\'Est\',7,5);">Es 7:5</a>, "presume"); \'aphal, "to lift oneself up" (<a onClick="return mV(\'Num\',14,44);">Nu 14:44</a>); beyadh ramah, "with a high hand" (<a onClick="return mV(\'Num\',15,30);">Nu 15:30</a>, the Revised Version (British and American) "with a high hand"); in <a onClick="return mV(\'2Pe\',2,10);">2Pe 2:10</a> tolmetes, "bold," "daring," is translated "presumptuous," the Revised Version (British and American) "daring"; in 2Macc 3:24; 5:15 we have katatolmao; thrasus, is rendered "presumption" in 2Macc 5:18, the Revised Version (British and American) "daring deed."``185';
isbe[7086]='Prevent`pre-vent\' (qadham; prophthano, phthano): "Prevent" occurs in the King James Version in the literal but obsolete sense of "to come or go before," "to anticipate," not in the sense of "to hinder." It is the translation of qadham, "to be sharp," "to be in front," "to be beforehand" (<a onClick="return mV(\'2Sa\',22,6,19);">2Sa 22:6,19</a>, the Revised Version (British and American) "came upon" <a onClick="return mV(\'Job\',3,12);">Job 3:12</a>, the Revised Version (British and American) "receive"; <a onClick="return mV(\'Job\',30,27);">30:27</a>, "are come upon"; <a onClick="return mV(\'Job\',41,11);">41:11</a>, "first given"; <a onClick="return mV(\'Psa\',18,5,18);">Ps 18:5,18</a>, "came upon"; <a onClick="return mV(\'Psa\',21,3);">21:3</a>, the American Standard Revised Version "meetest"; <a onClick="return mV(\'Psa\',59,10);">59:10</a>, the American Standard Revised Version "meet"; <a onClick="return mV(\'Psa\',79,8);">79:8</a>, the American Standard Revised Version "meet"; <a onClick="return mV(\'Psa\',88,13);">88:13</a>, "come before"; <a onClick="return mV(\'Psa\',119,147,148);">119:147,148</a>, the American Standard Revised Version "anticipated"; <a onClick="return mV(\'Isa\',21,14);">Isa 21:14</a>, "did meet"; <a onClick="return mV(\'Amo\',9,10);">Am 9:10</a>, the American Standard Revised Version "meet"). In the New Testament prophthano, with same meaning, is translated "prevent" (<a onClick="return mV(\'Mat\',17,25);">Mt 17:25</a>, "Jesus prevented him," the Revised Version (British and American) "spake first to him"); phthano (<a onClick="return mV(\'1Th\',4,15);">1Th 4:15</a>, "shall not prevent," the Revised Version (British and American) "shall in no wise precede"). "Prevent" in the above sense occurs in The <span class="noTag">Wisdom of Solomon 6:13</span>, the Revised Version (British and American) "forestalleth" (phthano); <span class="noTag">16:28</span>, "we must prevent the sun to give thee thanks," the Revised Version (British and American) "rise before."``185';
isbe[7087]='Prey`pra (baz, Tereph, shalal): "Prey" is frequent in the Old Testament, chiefly as the translation of baz, "spoil," "plunder" (<a onClick="return mV(\'Num\',14,3,11);">Nu 14:3,11</a>; <a onClick="return mV(\'Deu\',1,39);">De 1:39</a>; <a onClick="return mV(\'Isa\',10,6);">Isa 10:6</a>, etc.); of Tereph, "prey of wild beasts," "torn thing" (<a onClick="return mV(\'Gen\',49,9);">Ge 49:9</a>; <a onClick="return mV(\'Num\',23,24);">Nu 23:24</a>; <a onClick="return mV(\'Job\',4,11);">Job 4:11</a>, etc.); of malqoah, "a taking" (<a onClick="return mV(\'Num\',31,11);">Nu 31:11</a>, etc.; <a onClick="return mV(\'Isa\',49,24,25);">Isa 49:24,25</a>); of shalal, "spoil" or "booty" (<a onClick="return mV(\'Jdg\',5,30);">Jud 5:30</a> twice; <a onClick="return mV(\'Jdg\',8,24,25);">Jud 8:24,25</a>; <a onClick="return mV(\'Isa\',10,2);">Isa 10:2</a>, etc.). Maher-shalal-chash-baz (the Revised Version margin "The spoil speedeth, the prey hasteth") was the symbolical name given to a son of Isaiah (<a onClick="return mV(\'Isa\',8,1,3);">Isa 8:1,3</a>). "Prey" does not occur in the New Testament, but is found in the Apoc: 1Esdras 8:77, "for our sins...were given up...for a prey" (pronome); Judith 9:4; 16:5; 1Macc 7:47; Ecclesiasticus 27:10 (thera); Judith 5:24 (katabroma).<P>In the Revised Version (British and American) shalal is generally translated "spoil" (<a onClick="return mV(\'Jdg\',5,30);">Jud 5:30</a>; <a onClick="return mV(\'Jdg\',8,24,25);">8:24,25</a>; <a onClick="return mV(\'Isa\',10,2);">Isa 10:2</a>, etc.), while, conversely, "prey" (noun and verb) is occasionally substituted for "spoil," "booty" (<a onClick="return mV(\'Num\',31,32);">Nu 31:32</a>, ere).`<a href="./study/isbe/search.html?string=BOOTY">BOOTY</a>; <a href="./study/isbe/search.html?string=SPOIL">SPOIL</a>`185';
isbe[7088]='Price`pris: Represents various words in the Old Testament; time, is the usual Greek word for "price" in the New Testament. "Of great price" is polutimos, in <a onClick="return mV(\'Mat\',13,46);">Mt 13:46</a>, and poluteles, in <a onClick="return mV(\'1Pe\',3,4);">1Pe 3:4</a>. The verb occurs in <a onClick="return mV(\'Zec\',11,13);">Zec 11:13</a> the King James Version and the English Revised Version as "prised." The spelling "prized" in the American Standard Revised Version and some editions of the King James Version is due to a confusion with "prize."`<a href="./study/isbe/search.html?string=DOG">DOG</a>`1';
isbe[7089]='Prick`prik: As a noun (= any slender pointed thing, a thorn, a sting) it translates two words:<P>(1) sekh, a "thorn" or "prickle." Only in <a onClick="return mV(\'Num\',33,55);">Nu 33:55</a>, "those that ye let remain of them be as pricks in your eyes," i.e. "shall be a source of painful trouble to you."<P>(2) kentron "an iron goad" for urging on oxen and other beasts of burden: "It is hard for thee to kick against the pricks" (the King James Version of <a onClick="return mV(\'Act\',9,5);">Ac 9:5</a>, where the Revised Version (British and American) omits the whole phrase, following the best manuscripts, including Codices Sinaiticus, A, B, C, E; the King James Version of <a onClick="return mV(\'Act\',26,14);">Ac 26:14</a>, where the Revised Version (British and American) has "goad," margin "Greek: \'goads\' "), i.e. to offer vain and perilous resistance. See <a href="./study/isbe/search.html?string=GOAD">GOAD</a>. As a verb (= "to pierce with something sharply pointed," "to sting"), it occurs once in its literal sense: "a pricking brier" (<a onClick="return mV(\'Eze\',28,24);">Eze 28:24</a>); and twice in a figurative sense: "I was pricked in my heart" (<a onClick="return mV(\'Psa\',73,21);">Ps 73:21</a>); "They were pricked in their heart" (<a onClick="return mV(\'Act\',2,37);">Ac 2:37</a>, katanusso, Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) compungo; compare English word "compunction").``49';
isbe[7090]='Priest`prest (kohen, "priest," "prince," "minister"; hiereus archiereus; for hiereus megas, of <a onClick="return mV(\'Hbr\',10,21);">Heb 10:21</a>, see Thayer\'s Lexicon, under the word hiereus:<P><b>I. NATURE OF THE PRIESTLY OFFICE</b><P class="in15">1. Implies Divine Choice<P class="in15">2. Implies Representation<P class="in15">3. Implies Offering Sacrifice<P class="in15">4. Implies Intercession<P><b>II. THE TWO GREAT PRIESTS OF THE OLD TESTAMENT, MELCHIZEDEK AND AARON</b><P><b>III. PRIESTLY FUNCTIONS AND CHARACTER</b><P class="in15">1. A Strictly Religious Order<P class="in15">2. Priestism Denied<P class="in15">3. The High Priest\'s Qualifications<P class="in15">4. Symbolism of Aaron\'s Rod<P><b>IV. CONSECRATION OF AARON AND HIS SONS (<span class="noTag">EXODUS 29; LEVITICUS 8</span>)</b><P class="in15">1. Symbolism of Consecration<P class="in15">2. Type and Archetype<P><b>LITERATURE</b><hr /><P>A priest is one who is duly authorized to minister in sacred things, particularly to offer sacrifices at the altar, and who acts as mediator between men and God. In the New Testament the term is applied to priests of the Gentiles (<a onClick="return mV(\'Act\',14,13);">Ac 14:13</a>), to those of the Jews (<a onClick="return mV(\'Mat\',8,4);">Mt 8:4</a>), to Christ (<a onClick="return mV(\'Hbr\',5,5,6);">Heb 5:5,6</a>), and to Christians (<a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a>; <a onClick="return mV(\'Rev\',1,6);">Re 1:6</a>). The office of priest in Israel was of supreme importance and of high rank. The high priest stood next the monarch in influence and dignity. Aaron, the head of the priestly order, was closely associated with the great lawgiver, Moses, and shared with him in the government and guidance of the nation. It was in virtue of the priestly functions that the chosen people were brought into near relations with God and kept therein. Through the ministrations of the priesthood the people of Israel were instructed in the doctrine of sin and its expiation, in forgiveness and worship. In short, the priest was the indispensable source of religious knowledge for the people, and the channel through which spiritual life was communicated.<P>I. Nature of the Priestly Office.<P>1. Implies Divine Choice:<P>The Scriptures furnish information touching this point. To them we at once turn. Priesthood implies choice. Not only was the office of divine institution, but the priest himself was divinely-appointed thereto. "For every high priest, being taken from among men, is appointed for men in things pertaining to God....And no man taketh the honor unto himself, but when he is called of God, even as was Aaron" (<a onClick="return mV(\'Hbr\',5,1,4);">Heb 5:1,4</a>). The priest was not elected by the people, much less was he self-appointed. Divine selection severed him from those for whom he was to act. Even our Great High Priest, Jesus Christ, came not into the world unsent. He received His commission and His authority from the fountain of all sovereignty. At the opening of His earthly ministry He said, "He anointed me....He hath sent me" (<a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a>). He came bearing heavenly credentials.<P>2. Implies Representation:<P>It implies the principle of representation. The institution of the office was God\'s gracious provision for a people at a distance from Him, who needed one to appear in the divine presence in their behalf. The high priest was to act for men in things pertaining to God, "to make propitiation for the sins of the people" (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>). He was the mediator who ministered for the guilty. "The high priest represented the whole people. All Israelites were reckoned as being in him. The prerogative held by him belonged to the whole of them (<a onClick="return mV(\'Exd\',19,6);">Ex 19:6</a>), but on this account it was transferred to him because it was impossible that all Israelites should keep themselves holy as became the priests of Yahweh" (Vitringa). That the high priest did represent the whole congregation appears, first, from his bearing the tribal names on his shoulders in the onyx stones, and, second, in the tribal names engraved in the twelve gems of the breastplate. The divine explanation of this double representation of Israel in the dress of the high priest is, he "shall bear their names before Yahweh upon his two shoulders for a memorial" (<a onClick="return mV(\'Exd\',28,12,19);">Ex 28:12,19</a>). Moreover, his committing heinous sin involved the people in his guilt: "If the anointed priest shall sin so as to bring guilt on the people" (<a onClick="return mV(\'Lev\',4,3);">Le 4:3</a>). The Septuagint reads, "If the anointed priest shall sin so as to make the people sin." The anointed priest, of course, is the high priest. When he sinned the people sinned. His official action was reckoned as their action. The whole nation shared in the trespass of their representative. The converse appears to be just as true. What he did in his official capacity, as prescribed by the Lord, was reckoned as done by the whole congregation: "Every high priest...is appointed for men" (<a onClick="return mV(\'Hbr\',5,1);">Heb 5:1</a>).<P>3. Implies Offering Sacrifice:<P>It implies the offering of sacrifice. Nothing is clearer in Scripture than this priestly function. It was the chief duty of a priest to reconcile men to God by making atonement for their sins; and this he effected by means of sacrifice, blood-shedding (<a onClick="return mV(\'Hbr\',5,1);">Heb 5:1</a>; <a onClick="return mV(\'Hbr\',8,3);">8:3</a>). He would be no priest who should have nothing to offer. It was the high priest who carried the blood of the sin offering into the Most Holy Place and who sprinkled it seven times on and before the mercy-seat, thus symbolically covering the sins of the people from the eyes of the Lord who dwelt between the cherubim (<a onClick="return mV(\'Psa\',80,1);">Ps 80:1</a>). It was he also who marked the same blood on the horns of the altar of burnt offering in the Court of the Tabernacle, and on those of the golden altar, that the red sign of propitiation might thus be lifted up in the sight of Yahweh, the righteous Judge and Redeemer.<P>4. Implies Intercession:<P>It implies intercession. In the priestly ministry of Aaron and his sons this function is not so expressly set forth as are some of their other duties, but it is certainly included. For intercession is grounded in atonement. There can be no effective advocacy on behalf of the guilty until their guilt is righteously expiated. The sprinkling of the blood on the mercy-seat served to cover the guilt from the face of God, and at the same time it was an appeal to Him to pardon and accept His people. So we read that after Aaron had sprinkled the blood he came forth from the sanctuary and blessed Israel (<a onClick="return mV(\'Lev\',9,\'22-24\');">Le 9:22-24</a>; <a onClick="return mV(\'Num\',6,\'22-27\');">Nu 6:22-27</a>).<P>II. The Two Great Priests of the Old Testament, Melchizedek and Aaron:<P>These were Melchizedek and Aaron. No others that ever bore the name or discharged the office rank with these, save, of course, the Lord Jesus Christ, of whom they were distinguished types. Of the two, Melchizedek was the greater. There are two reasons why they are to be considered chiefs: first, because they are first in their respective orders. Melchizedek was not only the head of his order, but he had no successor. The office began and terminated with him (<a onClick="return mV(\'Hbr\',7,3);">Heb 7:3</a>). The ordinary priests and the Levites depended for their official existence on Aaron. Apart from him they would not be priests. Second, the priesthood of Christ was typified by both. The office is summed up and completed in Him. They were called and consecrated that they might be prophecies of Him who was to come and in whom all priesthood and offering and intercession would find its ample fulfillment. In the Epistle to the Hebrews the priesthood of both these men is combined and consummated in Christ. But let it be noted that while He is of the order of Melchizedek He exercises the office after the pattern of Aaron. He perfects all that Aaron did typically, because He is the true and the real Priest, while Aaron is but a figure.<P>III. Priestly Functions and Character.<P>1. A Strictly Religious Order:<P>These are minutely prescribed in the Law. In the institution of the office the Lord\'s words to Moses were, "Take thou unto thee Aaron thy brother, and his sons with him, from among the children of Israel, that he may minister unto me in the priest\'s office" (<a onClick="return mV(\'Exd\',28,1);">Ex 28:1</a> the King James Version). Their duties were strictly religious. They had no political power conferred upon them. Their services, their dependent position, and the way in which they were sustained, i.e. by the free gifts of the people, precluded them from exercising any undue influence in the affairs of the nation. It is true that in process of time the high office degenerated, and became a thing of barter and sale in the hands of unscrupulous and corrupt men, but as originally appointed the priesthood in Israel was not a caste, nor a hierarchy, nor a political factor, but a divinely-appointed medium of communication between God and the people.<P>2. Priestism Denied:<P>The Hebrew priests in no wise interfered with the conscience of men. The Hebrew worshipper of his own free will laid his hand on the head of his sacrifice, and confessed his sins to God alone. His conscience was quite free and untrammeled.<P>3. The High Priest\'s Qualifications:<P>There were certain duties which were peculiar to the high priest. He alone could wear the "garments for glory and for beauty." To him alone it pertained to enter the Most Holy Place and to sprinkle the blood of the sin offering on the mercy-seat. To him alone it pertained to represent the congregation before the Lord as mediator, and to receive the divine communications. He was to be ceremonially pure and holy. He must be physically perfect. Any defect or deformity disqualified a member of the priestly family from performing the duties of the office (<a onClick="return mV(\'Lev\',21,\'17-21\');">Le 21:17-21</a>). The Law spoke with the utmost precision as to the domestic relations of the high priest. He could marry neither a widow, nor a divorced woman, nor one polluted, nor a harlot; only a virgin of his own people, a Hebrew of pure extraction, could become his wife (<a onClick="return mV(\'Lev\',21,14,15);">Le 21:14,15</a>). Nor was he to come in contact with death. He must not rend his clothes, nor defile himself, even for his father or his mother (<a onClick="return mV(\'Lev\',21,10,11);">Le 21:10,11</a>). His sons might defile themselves for their kin, but the high priest must not. For he was the representative of life. Death did not exist for him, in so far as he was a priest. God is the Ever-Living, the Life-Giving; and His priest, who had "the crown of the anointing oil of his God upon him," had to do with life alone.<P>4. Symbolism of Aaron\'s Rod:<P>Adolph Saphir believes there is deep significance in the miracle of Aaron\'s rod that budded and bare almonds (<a onClick="return mV(\'Num\',17,\'1-\');">Nu 17</a>). It was a visible sign of the legitimacy of Aaron\'s priesthood and a confirmation of it, and a symbol of its vitality and fruitfulness. The twelve rods of the tribes were dead sticks of wood, and remained dead; Aaron\'s alone had life and produced blossoms and fruit. It was the emblem of his office which correlated itself with life, and had nothing to do with death.<P>IV. Consecration of Aaron and His Sons (<a onClick="return mV(\'Exd\',29,\'1-\');">Exodus 29</a>; <a onClick="return mV(\'Lev\',8,\'1-\');">Leviticus 8</a>).<P>The process of the consecration is minutely described and is worthy of a more detailed and careful study than can here be given it. Only the more prominent features are noticed.<P>(1) Both the high priest and his sons were together washed with water (<a onClick="return mV(\'Exd\',29,4);">Ex 29:4</a>). But when this was done, the high priest parted company with his sons.<P>(2) Next, Aaron was arrayed in the holy and beautiful garments, with the breastplate over his heart, and the holy crown on his head, the mitre, or turban, with its golden plate bearing the significant inscription, "Holy to Yahweh." This was Aaron\'s investiture of the high office.<P>(3) He was then anointed with the precious oil. It is noteworthy that Moses poured the oil on his head. When he anointed the tabernacle and its furniture he sprinkled the oil, but in Aaron\'s case there was a profusion, an abundance in the anointing (<a onClick="return mV(\'Psa\',133,2);">Ps 133:2</a>).<P>(4) After the anointing of the high priest the appointed sacrifices were offered (<a onClick="return mV(\'Exd\',29,10);">Ex 29:10</a>). Up to this point in the ceremony Aaron was the principal figure, the sons having no part save in the bathing. But after the offerings had been made the sons became prominent participants in the ceremonies, sharing equally with the high priest therein.<P>(5) The blood of the offering was applied to the person of father and sons alike (<a onClick="return mV(\'Exd\',29,20,21);">Ex 29:20,21</a>). On the tip of the right ear, on the thumb of the right hand, and on the great toe of the right foot was the consecrating blood-mark set.<P>1. Symbolism of Consecration:<P>The significance of this action should not escape the reader. The whole person and career of the priest were thus brought under power of the blood. He had a blood-stained ear that he might hear and obey the divine injunctions, that he might understand the word of Yahweh and interpret it to the people. His will was brought into subjection to the will of His Lord that he might be a faithful minister in things pertaining to God. He had a blood-stained hand that he might execute, rightly and efficiently, the services of the sanctuary and the duties of his great office. He had likewise a blood-stained foot that he might walk in the statutes and commandments of the Lord blameless, and tread the courts of the Lord\'s house as the obedient servant of the Most High. Sacrificial blood, the blood of atonement, is here, as everywhere else, the foundation for saints and sinners, for priests and ministers alike, in all their relations with God.<P>2. Type and Archetype:<P>The priests of Israel were but dim shadows, obscure sketches and drafts of the one Great Priest of God, the Lord Jesus Christ. Without drawing out at length the parallelism between the type and the archetype, we may sum up in a few brief sentences the perfection found in the priestly character of Christ:<P class="in15">(1) Christ as Priest is appointed of God (<a onClick="return mV(\'Hbr\',5,5);">Heb 5:5</a>).<P class="in15">(2) He is consecrated with an oath (<a onClick="return mV(\'Hbr\',7,\'20-22\');">Heb 7:20-22</a>).<P class="in15">(3) He is sinless (<a onClick="return mV(\'Hbr\',7,26);">Heb 7:26</a>).<P class="in15">(4) His priesthood is unchangeable (<a onClick="return mV(\'Hbr\',7,23,24);">Heb 7:23,24</a>).<P class="in15">(5) His offering is perfect and final (<a onClick="return mV(\'Hbr\',9,\'25-28\');">Heb 9:25-28</a>; <a onClick="return mV(\'Hbr\',10,12);">10:12</a>).<P class="in15">(6) His intercession is all-prevailing (<a onClick="return mV(\'Hbr\',7,25);">Heb 7:25</a>).<P class="in15">(7) As God and man in one Person He is a perfect Mediator (<a onClick="return mV(\'Hbr\',1,\'1-\');">Heb 1</a>; <a onClick="return mV(\'Hbr\',2,\'1-\');">2</a>).<P>LITERATURE.<P>Smith, DB; HDB; P. Fairbairn, Typology of Scripture, II; Soltau, Exposition of the Tabernacle; the Priestly Garments and the Priesthood; Martin, Atonement; A.B. Davidson, Hebrews; Moorehead, Mosaic Institutions.`<a href="./study/isbe/search.html?string=CHRIST,+OFFICES+OF">CHRIST, OFFICES OF</a>`123';
isbe[7091]='Priest, Christ As``<a href="./study/isbe/search.html?string=CHRIST,+OFFICES+OF">CHRIST, OFFICES OF</a>`1';
isbe[7092]='Priest, High`(ha-kohen, ho hiereus; ha-kohen ha-mashiach, ho hiereus ho christos; ha-kohen ha-gadhol, ho hiereus ho megas; kohen ha-ro\'sh, ho hiereus hegoumenos; New Testament archiereus):<P><b>I. INSTITUTION OF THE HIGH-PRIESTHOOD</b><P class="in15">1. The Family<P class="in15">2. The Consecration<P class="in15">3. The Dress<P class="in15">4. The Duties of High-Priesthood<P class="in15">5. Special Regulations<P class="in15">6. The Emoluments<P class="in15">7. Importance of the Office<P><b>II. HISTORY OF THE HIGH-PRIESTHOOD IN ISRAEL</b><P class="in15">1. In the Old Testament<P class="in15">2. In the New Testament<P><b>LITERATURE</b><hr /><P>I. Institution of the High-Priesthood.<P>Temples with an elaborate ritual, a priesthood and a high priest were familiar to Moses. For a millennium or two before his time these had flourished in Egypt. Each temple had its priest or priests, the larger temples and centers having a high priest. For centuries the high priest of Amon at Thebes stood next to the king in power and influence. Many other high-priesthoods of less importance existed. Moses\' father-in-law was priest of Midian, doubtless the chief or high priest. In founding a nation and establishing an ecclesiastical system, nothing would be more natural and proper for him than to institute a priestly system with a high priest at the head. The records give a fairly full account of the institution of the high-priesthood.<P>1. The Family:<P>Aaron, the brother of Moses, was chosen first to fill the office. He was called "the priest" (ha-kohen) (<a onClick="return mV(\'Exd\',31,10);">Ex 31:10</a>). As the office was to be hereditary and to be preserved in perpetuity in the family of Aaron (<a onClick="return mV(\'Exd\',29,9,29);">Ex 29:9,29</a>), he is succeeded by his son Eleazar (<a onClick="return mV(\'Num\',20,28);">Nu 20:28</a>; <a onClick="return mV(\'Deu\',10,6);">De 10:6</a>), and he in turn by his son Phinehas (<a onClick="return mV(\'Num\',25,11);">Nu 25:11</a>). In his time the succession was fixed (<a onClick="return mV(\'Num\',25,12,13);">Nu 25:12,13</a>). In <a onClick="return mV(\'Lev\',4,3,5,16);">Le 4:3,5,16</a>; <a onClick="return mV(\'Lev\',6,22);">6:22</a> he is called "the anointed priest." Three times in the Pentateuch he is spoken of as "great priest" or "high priest" (<a onClick="return mV(\'Lev\',21,10);">Le 21:10</a>; <a onClick="return mV(\'Num\',35,25,28);">Nu 35:25,28</a>). The first of these passages identifies him with the anointed priest.<P>2. The Consecration:<P>The ceremonies by which he was installed in his office are recorded in <a onClick="return mV(\'Exd\',29,29);">Ex 29:29</a>ff. Seven days of special solemnities were spent. The first consecration was by Moses; it is not said who performed the others. There was special washing and anointing with oil (<a onClick="return mV(\'Psa\',133,2);">Ps 133:2</a>). Each new high priest must wear the holy garments, as well as be specially anointed (<a onClick="return mV(\'Lev\',21,10);">Le 21:10</a>). Every day a bullock for a sin offering must be offered for atonement; the altar also must be cleansed, atoned for, and anointed, the high priest offering a sacrifice or minchah for himself (<a onClick="return mV(\'Lev\',6,24);">Le 6:24</a>).<P>3. The Dress:<P>Besides the regularly prescribed dress of the priests, the high priest must wear the robe of the ephod, the ephod, the breastplate and the mitre or head-dress (<a onClick="return mV(\'Lev\',8,\'7-9\');">Le 8:7-9</a>). The robe of the ephod seems to have been a sleeveless tunic, made of blue, fringed with alternate bells and pomegranates (<a onClick="return mV(\'Exd\',28,\'31-35\');">Ex 28:31-35</a>; <a onClick="return mV(\'Exd\',39,\'22-26\');">39:22-26</a>). The ephod seemed to be a variegated dress of the four colors of the sanctuary, blue, purple, scarlet and fine linen interwoven with gold (<a onClick="return mV(\'Exd\',28,\'6-8\');">Ex 28:6-8</a>; <a onClick="return mV(\'Exd\',39,\'2-5\');">39:2-5</a>). This distinguishing ephod of the high priest was fastened at the shoulders by two clasps of shoham stone, upon each of which was engraved the names of six tribes of Israel (<a onClick="return mV(\'Exd\',28,\'9-14\');">Ex 28:9-14</a>; <a onClick="return mV(\'Exd\',39,6,7);">39:6,7</a>). Over the ephod and upon his breast he wore the breastplate, a four-cornered choshen suspended by little chains. Set in this in four rows were twelve precious stones, having engraved upon them the names of the twelve tribes of Israel. This breastplate must have contained a pocket of some kind inside, for in it were deposited the Urim and Thummim, which seemed to be tangible objects of some kind (<a onClick="return mV(\'Exd\',28,\'15-30\');">Ex 28:15-30</a>; <a onClick="return mV(\'Exd\',39,\'8-21\');">39:8-21</a>). The mitre or head-dress was of fine linen, the plate of the crown of pure gold, and inscribed upon it the words, "Holy to Yahweh" (<a onClick="return mV(\'Exd\',28,\'36-38\');">Ex 28:36-38</a>; <a onClick="return mV(\'Exd\',39,30,31);">39:30,31</a>). When entering the Holy of Holies he must be dressed wholly in linen, but in his ordinary duties in the dress of the priests; only when acting as high priest he must wear his special robes.<P>4. The Duties of the High-Priesthood:<P>In addition to his regular duties as a priest, the high priest was to enter the Holy of Holies on the Day of Atonement (<a onClick="return mV(\'Lev\',16,3,15,33,34);">Le 16:3,15,33,34</a>). He must also officiate at the ceremony of the two goats, when one is sent into the wilderness to Azazel, and the other slain to make atonement for the sanctuary (<a onClick="return mV(\'Exd\',30,10);">Ex 30:10</a>; <a onClick="return mV(\'Lev\',16,\'8-10\');">Le 16:8-10</a>). He alone could make atonement for the sins of the people, the priests and his own house (<a onClick="return mV(\'Lev\',4,3);">Le 4:3</a>ff; <a onClick="return mV(\'Lev\',9,8);">9:8</a>ff; <a onClick="return mV(\'Lev\',16,6);">16:6</a>; <a onClick="return mV(\'Num\',15,25);">Nu 15:25</a>). He must offer the regular meal offering (<a onClick="return mV(\'Lev\',6,14,15);">Le 6:14,15</a>). He must share with the priests in the caring for the lamp that burned continually (<a onClick="return mV(\'Exd\',27,21);">Ex 27:21</a>), He must assist in arranging the shewbread (<a onClick="return mV(\'Exd\',25,30);">Ex 25:30</a>). When he carried the breastplate with the names of the tribes inscribed thereon he acted as mediator between Israel and God (<a onClick="return mV(\'Exd\',28,29);">Ex 28:29</a>). He alone could consult the Urim and Thummim before Yahweh, and according to his decision Israel must obey (<a onClick="return mV(\'Num\',27,21);">Nu 27:21</a>).<P>5. Special Regulations:<P>An office so important required certain special regulations. He must be free from every bodily defect (<a onClick="return mV(\'Lev\',21,\'16-23\');">Le 21:16-23</a>). He must marry only a virgin of Israel, not a widow, nor a divorced woman, nor a profane one (<a onClick="return mV(\'Lev\',21,14);">Le 21:14</a>). He must not observe the external signs of mourning for any person, and not leave the sanctuary when news came of the death of even a father or mother (<a onClick="return mV(\'Lev\',21,\'10-12\');">Le 21:10-12</a>). He must not defile himself by contact with any dead body, even father or mother (<a onClick="return mV(\'Lev\',21,11);">Le 21:11</a>); and is forbidden to let his hair grow long or rend his clothes as a sign of mourning (<a onClick="return mV(\'Lev\',21,10);">Le 21:10</a>). If he should bring guilt upon the people, he must present a special offering (<a onClick="return mV(\'Lev\',4,3);">Le 4:3</a>). Sins affecting the priesthood in general must be expiated by the other priests as well as himself (<a onClick="return mV(\'Num\',18,1);">Nu 18:1</a>). He must eat nothing that died of itself or was torn by beasts (<a onClick="return mV(\'Lev\',22,8);">Le 22:8</a>). He must wash his feet and hands when he went to the tabernacle of the congregation and when he came near to the altar to minister (<a onClick="return mV(\'Exd\',30,\'19-21\');">Ex 30:19-21</a>). At first Aaron was to burn incense on the golden altar every morning when he dressed the lamps and every evening when he lighted them (<a onClick="return mV(\'Exd\',27,21);">Ex 27:21</a>), but in later times the common priests performed this duty. He must abstain from holy things during his uncleanness (<a onClick="return mV(\'Lev\',22,\'1-3\');">Le 22:1-3</a>), or if he should become leprous (<a onClick="return mV(\'Lev\',22,4,7);">Le 22:4,7</a>). He was to eat the people\'s meat offering with the inferior priests in the holy place (<a onClick="return mV(\'Lev\',6,16);">Le 6:16</a>). He must assist in judging the leprosy in the human body and garments (<a onClick="return mV(\'Lev\',13,\'2-59\');">Le 13:2-59</a>), and in adjudicating legal questions (<a onClick="return mV(\'Deu\',17,12);">De 17:12</a>). When there was no divinely-inspired leader, the high priest was the chief ruler till the time of David and again after the captivity.<P>6. The Emoluments:<P>The emoluments were not much greater than those of the priests in general. He received no more inheritance among the tribes than any other Levite, but he and his family were maintained upon certain fees, dues and perquisites which they enjoyed from the common fund. In <a onClick="return mV(\'Num\',18,28);">Nu 18:28</a> the priests were to receive a tithe of the tithe paid in to the Levites. Josephus says this was a common fund (Ant., IV, iv, 4), but the high priest was probably charged with the duty of distributing it. In general the family of the high priest was well-to-do, and in the later period became very wealthy. The high priest and his family were among the richest people of the land in the time of Christ, making enormous profits out of the sacrifices and temple business.<P>7. Importance of the Office:<P>The importance of the high priest\'s office was manifest from the first. The high priest Eleazar is named in the first rank with Joshua, the prince of the tribes and successor of Moses (<a onClick="return mV(\'Num\',34,17);">Nu 34:17</a>f; <a onClick="return mV(\'Jos\',14,1);">Jos 14:1</a>). He with others officiated in the distribution of the spoils of the Midianites (<a onClick="return mV(\'Num\',31,21,26);">Nu 31:21,26</a>). His sins were regarded as belonging to the people (<a onClick="return mV(\'Lev\',4,3,12);">Le 4:3,12</a>). He acted with Moses in important matters (<a onClick="return mV(\'Num\',26,1);">Nu 26:1</a>; <a onClick="return mV(\'Num\',31,29);">31:29</a>). The whole congregation must go or come according to his word (<a onClick="return mV(\'Num\',27,20);">Nu 27:20</a>). His death was a national event, for then the manslayer was free to leave the City of Refuge (<a onClick="return mV(\'Num\',35,25,28);">Nu 35:25,28</a>). He had no secular authority, but was regarded generally as the leading religious authority. Later, he became also the leading secular as well as religious authority.<P>II. History of the High-Priesthood in Israel.<P>1. In the Old Testament:<P>In general the present writer accepts the historical records of the Old Testament as true and rejects the critical views of a fictitious or falsified history. Such views have only subjective reasons to support them and are based upon a naturalistic evolutionary view of the development of Israel\'s religion. As Moses was the founder of the high-priesthood in Israel he anticipated a perpetuation of the office throughout the history (<a onClick="return mV(\'Deu\',26,3);">De 26:3</a>). The high priest appears frequently. Eleazar officiated with Joshua in the division of the land among the twelve tribes (<a onClick="return mV(\'Jos\',14,1);">Jos 14:1</a>). The law of the manslayer shows that he was an important personage in the life of Israel (<a onClick="return mV(\'Jos\',20,6);">Jos 20:6</a>). He seemed to have the power to distribute the offices of the priests to those whom he would, and poor priests would appeal to him for positions (<a onClick="return mV(\'1Sa\',2,36);">1Sa 2:36</a>). The office seems to have remained in the family of Eleazar until the days of Eli, when, because of the wickedness of his sons, the family was destroyed and the position passed into the family of Ithamar (<a onClick="return mV(\'1Sa\',2,\'31-36\');">1Sa 2:31-36</a>). A descendant of that family officiated at Nob in the times of Saul, whose name was Ahimelech (<a onClick="return mV(\'1Sa\',21,2);">1Sa 21:2</a>; <a onClick="return mV(\'1Sa\',22,11);">22:11</a>). His son, Abiathar, escaped from the slaughter, and later seems to have succeeded his father and to have been chief priest throughout David\'s reign (<a onClick="return mV(\'1Sa\',22,\'20-23\');">1Sa 22:20-23</a>; <a onClick="return mV(\'1Sa\',23,9);">23:9</a>; <a onClick="return mV(\'1Sa\',30,7);">30:7</a>). Zadok seems to have had almost equal privilege (<a onClick="return mV(\'2Sa\',8,17);">2Sa 8:17</a>; <a onClick="return mV(\'1Ch\',18,16);">1Ch 18:16</a>; <a onClick="return mV(\'1Ch\',24,6);">24:6</a> almost certainly by copyist\'s error, transpose Abiathar and Ahimelech; <a onClick="return mV(\'Mar\',2,26);">Mr 2:26</a> may be based on this reading. See <a href="./study/isbe/search.html?string=ABIATHAR">ABIATHAR</a>, etc.). Because he joined the party of Adonijah rather than that of Solomon, Abiathar was deposed and banished to Anathoth, where he spent the rest of his days (<a onClick="return mV(\'1Ki\',2,26,27);">1Ki 2:26,27</a>). Zadok was put in his place (<a onClick="return mV(\'1Ki\',2,35);">1Ki 2:35</a>). He seems to have been a descendant of Eleazar. Under Jehoshaphat, Amariah was high priest (<a onClick="return mV(\'2Ch\',19,11);">2Ch 19:11</a>) and was the leading authority in all religious matters. In the time of Athaliah, during the minority of Joash and almost his entire reign Jehoiada was high priest and chief adviser. He seems to have been the most influ
