ential man in the kingdom for more than half a century (<a onClick="return mV(\'2Ki\',11,4);">2Ki 11:4</a>ff; <a onClick="return mV(\'2Ki\',11,\'2-16\');">11:2-16</a>; <a onClick="return mV(\'2Ch\',24,\'1-\');">2Ch 24</a> passim). Azariah officiated in the days of Uzziah and Hezekiah (<a onClick="return mV(\'2Ch\',26,20);">2Ch 26:20</a>; <a onClick="return mV(\'2Ch\',31,10);">31:10</a>); Urijah in the reign of Ahaz (<a onClick="return mV(\'2Ki\',16,\'10-16\');">2Ki 16:10-16</a>), and the latter priest seems to have been a friend of Isaiah (<a onClick="return mV(\'Isa\',8,2);">Isa 8:2</a>). Hilkiah held the office in the days of Josiah when the Book of the Law was discovered (<a onClick="return mV(\'2Ki\',22,4);">2Ki 22:4</a>f; <a onClick="return mV(\'2Ki\',23,4);">23:4</a>; <a onClick="return mV(\'2Ch\',34,9);">2Ch 34:9</a>); Zephaniah in the time of Jeremiah (<a onClick="return mV(\'Jer\',29,25);">Jer 29:25</a>f); Seraiah in the days of Zedekiah, who was put to death at Riblah by Nebuchadnezzar (<a onClick="return mV(\'2Ki\',25,18);">2Ki 25:18</a>f; <a onClick="return mV(\'Jer\',52,24);">Jer 52:24</a>). At the time, mention is made of a priest of the second rank (<a onClick="return mV(\'2Ki\',23,4);">2Ki 23:4</a>; <a onClick="return mV(\'2Ki\',25,18);">25:18</a>) and Zephaniah fills that office (<a onClick="return mV(\'Jer\',52,24);">Jer 52:24</a>). It is doubtful whether this is the same Zephaniah mentioned in <a onClick="return mV(\'Jer\',29,25);">Jer 29:25</a>. This "second priest" was doubtless a deputy, appointed to take the high priest\'s place in case anything should prevent his performing the duties of the office. Lists of high priests are given in <a onClick="return mV(\'1Ch\',6,\'1-15\');">1Ch 6:1-15</a>; <a onClick="return mV(\'1Ch\',6,\'50-53\');">6:50-53</a>. The first of these gives the line from Levi to Jehozadak who was carried away in the captivity under Nebuchadnezzar. The second traces the line from Aaron to Ahimaaz, and is identical so far with the first list.<P>There could have been no place for the functions of the high priest during the captivity, but the family line was preserved and Joshua the son of Jehozadak was among those who first returned (<a onClick="return mV(\'Ezr\',3,2);">Ezr 3:2</a>). From this time the high priest becomes more prominent. The monarchy is gone, the civil authority is in the hands of the Persians, the Jews are no longer independent, and hence, the chief power tends to center in the high-priesthood. Joshua appears to stand equal with Zerubbabel (<a onClick="return mV(\'Hag\',1,1,12,14);">Hag 1:1,12,14</a>; <a onClick="return mV(\'Hag\',2,2,4);">2:2,4</a>; <a onClick="return mV(\'Zec\',3,1,8);">Zec 3:1,8</a>; <a onClick="return mV(\'Zec\',4,14);">4:14</a>; <a onClick="return mV(\'Zec\',6,\'11-13\');">6:11-13</a>).<P>He is distinctly known as high priest (ha-kohen ha-gadhol). He takes a leading part in establishing the ecclesiastico-civil system, particularly the building of the temple. In the vision of Zechariah (<a onClick="return mV(\'Zec\',3,\'1-5\');">Zec 3:1-5</a>) Satan accuses the high priest who is here the representative proper of the nation. The consummation of the Messianic age cannot be completed without the cooperation of the high priest who is crowned with Zerubbabel, and sits with him on the throne (<a onClick="return mV(\'Zec\',6,13);">Zec 6:13</a>). The prophet also describes Joshua and his friends as "men of the sign," alluding to the coming Messiah under whom the sin of the land was to be taken away in one day (<a onClick="return mV(\'Zec\',3,9);">Zec 3:9</a>f). The promise is made to Joshua that if he will walk in Yahweh\'s ways and keep His house, he shall judge Yahweh\'s house, i.e. Israel, keep His court and have a place to walk among those who stand before Yahweh (<a onClick="return mV(\'Zec\',3,7);">Zec 3:7</a>). He is anointed equally with the prince of the royal line, for the two sons of oil (<a onClick="return mV(\'Zec\',4,14);">Zec 4:14</a>) almost certainly refer to the royal Zerubbabel and priestly Joshua who are to be joint inspirers of Israel in rebuilding the temple.<P>This exaltation of the high priest is very different from the state of things pictured by Ezekiel (<a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40</a>, <a onClick="return mV(\'Eze\',41,\'1-\');">41</a>, <a onClick="return mV(\'Eze\',42,\'1-\');">42</a>). In that picture no place is left for a high priest; the prince seemed to be the chief personage in the ecclesiastical system. Ezekiel\'s vision was ideal, the actual restoration was very different, and the institutions and conditions of the past were carried out rather than the visions of the prophet. In the time of Nehemiah, Eliashib was high priest (<a onClick="return mV(\'Neh\',3,1,20);">Ne 3:1,20</a>). For abusing his office by using a temple chamber in the interests of his family he was reprimanded (<a onClick="return mV(\'Neh\',13,\'4-9\');">Ne 13:4-9</a>). The list of high priests from Jeshua to Jaddua is given in <a onClick="return mV(\'Neh\',12,10);">Ne 12:10</a>. According to Josephus (Ant., XI, viii, 5) Jaddua was priest at the time of Alexander the Great (332 BC), but it is practically certain that it was Jaddua\'s grandson, Simon, who was then priest (see W.J. Beecher, Reasonable Biblical Criticism, chapter xviii). Thus is preserved the unbroken line from Aaron to Jaddua, the office still being hereditary. No essential change can be found since the days of Ezra. The Book of Chronicles, compiled some time during this period, uses the three names, ha-kohen, ha-kohen ha-ro\'sh, ha-kohen ha-gadhol. The word naghidh ("prince") is also used, and he is called "the ruler of the house of God" (<a onClick="return mV(\'1Ch\',9,11);">1Ch 9:11</a>). This seems to imply considerable power invested in him. Usually the Chronicler in both Books of Chronicles and Nehemiah uses the term "the priest."<P>The line of Eleazar doubtless continued until the time of the Maccabees, when a decided change took place. The Syrian Antiochus deposed Onias III and put his brother Jason in his place (174 BC), who was soon displaced by Menelaus. About 153 BC Jonathan the Hasmonean was appointed by King Alexander, and thus the high-priesthood passed to the priestly family of Joiarib (1Macc 10:18-21). Whether the family of Joiarib was a branch of the Zadokites or not cannot be determined. After the appointment of Jonathan, the office became hereditary in the Hasmonean line, and continued thus until the time of Herod the Great. The latter set up and deposed high priests at his pleasure. The Romans did the same, and changed so frequently that the position became almost an annual appointment. Though many changes were thus made, the high priest was always chosen from certain priestly families. From this group of deposed priests arose a class known as "chief priests." The anointing prescribed in the law of Moses was not always carried out in later times, and in fact was generally omitted. The Mishna speaks of high priests who were installed in office simply by clothing them with their special robes (Schurer, II, i, p. 217, note 24).<P>2. In the New Testament:<P>In New Testament times the high priest was the chief civil and ecclesiastical dignitary among the Jews. He was chairman of the Sanhedrin, and head of the political relations with the Roman government. It is not clear just how far he participated in the ceremonies of the temple. No doubt he alone entered the Holy of Holies once a year on the Day of Atonement, and also offered the daily offerings during that week. What other part he took in the work was according to his pleasure. Josephus says that he officiated at the Sabbath, the New Moon and yearly festivals. The daily minchah (<a onClick="return mV(\'Lev\',6,12);">Le 6:12</a>) which he was required to offer was not always offered by the high priest in person, but he was required to defray the expense of it. This was a duty which, according to Ezekiel\'s vision, was to be performed by the prince. The Jews had many contentions with the Romans as to who should keep the garments of the high priest. When Jerusalem fell into the hands of the Romans, the robe of state also fell into their hands.<P>In the time of Christ, Annas and Caiaphas were high priests (<a onClick="return mV(\'Luk\',3,2);">Lu 3:2</a>), though, as appears later in the Gospel, Caiaphas alone acted as such. Annas had probably been deposed, yet retained much of his influence among the priestly families. For particulars see <a href="./study/isbe/search.html?string=ANNAS">ANNAS</a>; <a href="./study/isbe/search.html?string=CAIAPHAS">CAIAPHAS</a>; <a href="./study/isbe/search.html?string=JESUS+CHRIST">JESUS CHRIST</a>. These two were also the chief conspirators against Jesus. As president of the council Caiaphas deliberately advised them to put Jesus to death to save the nation (<a onClick="return mV(\'Jhn\',11,51);">Joh 11:51</a>). He was also chairman of the council which tried and condemned Jesus (<a onClick="return mV(\'Mat\',26,57,58,63,65);">Mt 26:57,58,63,65</a>; <a onClick="return mV(\'Mar\',14,53,60,61,63);">Mr 14:53,60,61,63</a>; <a onClick="return mV(\'Luk\',22,54);">Lu 22:54</a>; <a onClick="return mV(\'Jhn\',18,\'12-14\',19,24,28);">Joh 18:12-14,19,24,28</a>). They were also leaders in the persecution of the apostles and disciples after Pentecost (<a onClick="return mV(\'Act\',4,6);">Ac 4:6</a>; <a onClick="return mV(\'Act\',5,17,21);">5:17,21</a>); Saul sought letters from the high priest to Damascus to give him authority to bring any Christians he might find there bound to Jerusalem (<a onClick="return mV(\'Act\',9,2);">Ac 9:2</a>). He presided at the council which tried Paul (<a onClick="return mV(\'Act\',22,5);">Ac 22:5</a>; <a onClick="return mV(\'Act\',23,4);">23:4</a>).<P>In the Epistle to the Hebrews the doctrine of the priesthood of Jesus is fully and carefully elaborated. Jesus is here called the great High Priest, as well as priest. The opening words of the Epistle contain the essential thought: "when he had made purification of sins" (<a onClick="return mV(\'Hbr\',1,3);">1:3</a>). The title of high priest is first introduced in <a onClick="return mV(\'Hbr\',2,17);">2:17</a>, "a merciful and faithful high priest in things pertaining to God"; also in <a onClick="return mV(\'Hbr\',3,1);">3:1</a>, "the Apostle and High Priest of our confession." Having thus fairly introduced his great theme, the writer strikes the keynote of his great argument: "Having then a great high priest," etc. (<a onClick="return mV(\'Hbr\',4,14,15);">4:14,15</a>). From <a onClick="return mV(\'Hbr\',4,\'14-\');">4:14</a> to <a onClick="return mV(\'Hbr\',7,28);">7:28</a> the argument deals with the high-priestly work of Jesus. His qualifications are not only those which distinguish all priesthood, but they are also unique. He is named after the order of Melchizedek. The general qualifications are:<P class="in15">(1) He is appointed by God to His office (<a onClick="return mV(\'Hbr\',5,1);">5:1</a>).<P class="in15">(2) He is well fitted for the office by His experiences and participation in human temptations (<a onClick="return mV(\'Hbr\',5,\'2-6\');">5:2-6</A>; <a onClick="return mV(\'Hbr\',2,18);">2:18</A>).<P class="in15">(3) He undergoes a divine preparation (<a onClick="return mV(\'Hbr\',5,8,9);">5:8,9</a>).<P>The special qualifications of His priesthood are: It is after the order of Melchiezedek (<a onClick="return mV(\'Hbr\',5,10);">5:10</a>). This is an eternal one (<a onClick="return mV(\'Hbr\',6,20);">6:20</A>); royal or kingly (<a onClick="return mV(\'Hbr\',7,1,2,3);">7:1-3</a>); independent of birth or family (<a onClick="return mV(\'Hbr\',7,3);">7:3</A>); it is timeless (<a onClick="return mV(\'Hbr\',7,8);">7:8</a>); superior to that of Levi (<a onClick="return mV(\'Hbr\',7,\'4-10\');">7:4-10</A>); new and different from that of Aaron (<a onClick="return mV(\'Hbr\',7,11,12);">7:11,12</A>). It is also indissoluble (<a onClick="return mV(\'Hbr\',7,6);">7:16</A>); immutable (<a onClick="return mV(\'Hbr\',7,21);">7:21</A>); inviolable (<a onClick="return mV(\'Hbr\',7,24);">7:24</a>). Thus, with all these general and special qualifications, He is completely fitted for His work (<a onClick="return mV(\'Hbr\',7,26);">7:26</A>). That work consists in offering up Himself as a sacrifice for the sins of the people (<a onClick="return mV(\'Hbr\',7,27);">7:27</A>); entering within the veil as a forerunner (<a onClick="return mV(\'Hbr\',6,20);">6:20</A>); presenting the sacrificial blood in heaven itself (<a onClick="return mV(\'Hbr\',8,3);">8:3</a>; <a onClick="return mV(\'Hbr\',9,7,24);">9:7,24</a>); thus obtaining eternal redemption (<a onClick="return mV(\'Hbr\',9,12);">9:12</a>); ratifying the new covenant (<a onClick="return mV(\'Hbr\',9,\'15-22\');">9:15-22</a>). The result of this high-priestly work is a cleansing from all sin (<a onClick="return mV(\'Hbr\',7,6);">9:23</a>); a possibility of full consecration to God and His service (<a onClick="return mV(\'Hbr\',10,10);">10:10</a>); an ultimate perfection (<a onClick="return mV(\'Hbr\',10,14);">10:14</a>); and full access to the throne of grace (<a onClick="return mV(\'Hbr\',10,21,22);">10:21,22</a>).<P>LITERATURE.<P>Articles on the priesthood in general, with references to the high priest in HDB, HCG, EB, Jewish Encyclopedia, Kitto, Smith, Fallows, Schaff-Herzog, etc.; no article on "High Priest" only. For the history, Breasted, History of Egypt; Schurer, History of the Jewish People in the Time of Jesus Christ, II, i, 207-99; Josephus, Ant, XV, XVIII, XX. For works on the priesthood from the radical viewpoint, see Graf, S.I. Curtiss, Jost, Graetz, Kautzsch, Budde, Baentsch, Benzinger, Buchler, Meyer, Wellhausen. For a more moderate position see Baudissin, Die Geschichte des alttestamentlichen Priesterthums untersucht. For a more conservative position see A. Van Hoonacker, Le sacerdoce levitique dans la loi et dans l\'histoire des Hebreux. On the high-priesthood subsequent to the return from Babylon, see B. Pick, Lutheran Church Review,1898,I, 127-41; II, 370-74; III, 555-56; IV, 655-64; and the commentaries on the passages cited.`<a href="./study/isbe/search.html?string=CHRIST,+OFFICES+OF">CHRIST, OFFICES OF</a>; <a href="./study/isbe/search.html?string=PRIEST">PRIEST</a>; <a href="./study/isbe/search.html?string=PRIESTHOOD+IN+THE+NEW+TESTAMENT">PRIESTHOOD IN THE NEW TESTAMENT</a>; <a href="./study/isbe/search.html?string=PAUL,+THE+APOSTLE">PAUL, THE APOSTLE</a>`1';
isbe[7093]='Priesthood`prest\'-hood:<P>1. Priesthood Is an Office<P>2. In the Old Testament<P>3. Hereditary Priesthood<P>4. In the New Testament<P>5. Conclusions<P>LITERATURE<hr /><P>All worship is based on priesthood, for the priestly office is an essential part of salvation. Christianity itself has its glorious Priest, the Lord Jesus Christ, and it is through His one supreme offering that we are brought into saved relations with God and enjoy fellowship with Him. The priesthood of Christ and its mighty effects in sacrifice and intercession on behalf of the people of God are the chief and fundamental theme of the Epistle to the Hebrews.<P>1. Priesthood an Office:<P>Priesthood is a real office, definite and specific. It is needful to insist on this fact, for the noble word "priest" has been misappropriated and misapplied, so that its intrinsic import has been impaired. There is a certain literary slang indulged in by some who talk of the "priests of science," "priests of art," and similar absurdities. The idea of priesthood, if priesthood is to have any definite meaning, can have no place in literature or science or art or in anything of the kind. For it belongs to the realm of grace, presupposing as it does sin and the divine purpose to remove it. Hugh Martin writes that he "would as soon think of transferring the language of geometry and of algebra to botany and talk of the hypothenuse of a flower and the square root of a tree, or the differential coefficient of a convolvulus, as to speak of the priesthood of nature or letters." Priesthood is an office, embracing very specific duties and functions.<P>2. In the Old Testament:<P>Priesthood in some form appears to have existed from the earliest times, even from the beginning of the history of our race. In patriarchal times the office was held and its duties were discharged by those who occupied some sort of headship, and particularly by the father or the chief of the family and of the tribe. Thus, Noah in his capacity of priest and in behalf of his household "builded an altar unto Yahweh, and took of every clean beast, and of every clean bird, and offered burnt-offerings on the altar" (<a onClick="return mV(\'Gen\',8,20);">Ge 8:20</a>). Abraham offered the ram "for a burnt-offering in the stead of his son" (<a onClick="return mV(\'Gen\',22,13);">Ge 22:13</a>). In like manner Job offered burnt offerings for his children, and likewise by divine direction for the three "comforters" when the great trial had passed (<a onClick="return mV(\'Job\',1,5);">Job 1:5</a>; <a onClick="return mV(\'Job\',42,8);">42:8</a>). In these and the like instances there was priestly action no less certainly than in that of Aaron or of any regularly appointed priest in Israel. Melchizedek was "priest of God Most High" (<a onClick="return mV(\'Gen\',14,18);">Ge 14:18</a>). Isaac "builded an altar there and called upon the name of Yahweh" (<a onClick="return mV(\'Gen\',26,25);">Ge 26:25</a>), as did Jacob (<a onClick="return mV(\'Gen\',33,20);">Ge 33:20</a>). In these cases priestly acts were performed by the patriarchs in their capacity as fathers of the family or heads of clans. From the beginning, priesthood with its acts of expiation and of worship was thus recognized as a divinely-instituted office. But in pre-Mosaic times there was no special class of priests recognized.<P>3. Hereditary Priesthood:<P>Regular priestly succession in a single family was established by Moses (<a onClick="return mV(\'Exd\',28,\'1-3\');">Ex 28:1-3</a>). From this point of time onward the priesthood in Israel was confined to the family of Aaron. No hereditary priesthood seems to have prevailed in patriarchal times. According to the Epistle to the Hebrews, Melchizedek, a priest of the highest rank, had neither predecessor nor successor in his great office. By divine direction Moses designated the Aaronic family as the priestly family in Israel, and he prescribed the garments they should wear, the sacrifices they should offer both for themselves and for the congregation, their maintenance, their domestic relations, and their conduct toward their fellow Hebrews.<P>In the appointment of the priesthood there is no trace of Egyptian influence. Yet we know that Joseph married the daughter of the priest of On (<a onClick="return mV(\'Gen\',41,50);">Ge 41:50</a>). But this fact had no bearing on the selection of Israel\'s priestly family. The Aaronic priesthood had nothing in common with that of Egypt; it claimed to be of divine origin, and its duties, functions and powers in no way contradict the claim. The witness of an Egyptian archaeologist (Dr. M.G. Kyle) may be here introduced touching one essential element in the duties of the priestly office, namely, sacrifice: "The entire absence from the offerings of old Egyptian religion of any of the great Pentateuchal ideas of sacrifice, substitution, atonement, dedication, fellowship, and indeed of almost every essential idea of real sacrifice, as clearly established by recent very exhaustive examination of the offering scenes, makes for the element of revelation in the Mosaic system by delimiting the field of rationalistic speculation on the Egyptian side. Egypt gave nothing to that system, for it had nothing to give." As much may be said respecting the priesthood; Israel took little or nothing of its powers and functions from Egyptian sources.<P>Although the office was limited to the Aaronic family, nevertheless in certain exigencies and emergencies others beside the regular priest offered sacrifices to the Lord and were accepted by Him. Thus did Gideon in a time of great straits in Israel (<a onClick="return mV(\'Jdg\',6,24,26);">Jud 6:24,26</a>); thus the men of Beth-shemesh (<a onClick="return mV(\'1Sa\',6,14,15);">1Sa 6:14,15</a>); the prophet Samuel (<a onClick="return mV(\'1Sa\',7,9);">1Sa 7:9</a>); David (<a onClick="return mV(\'2Sa\',6,13,17);">2Sa 6:13,17</a>); Elijah (<a onClick="return mV(\'1Ki\',18,23,\'32-38\');">1Ki 18:23,32-38</a>), etc. The chosen people appear to have felt free to offer sacrifices and to engage in priestly functions when occasion required, until the central sanctuary was established on Mt. Moriah. When the Temple was built and dedicated, priestly action was confined to Jerusalem and to the regular priestly household. When Pharisaism, with its rigid legalism, with its intolerable burdens, became dominant, all liberty of worship and spontaneous service largely disappeared. The religious life of Israel stiffened into a dreadful monotony.<P>4. In the New Testament:<P>All priesthood reaches its climax in that of the Lord Jesus Christ. It is because of the perfection of His priesthood that the office as represented by Melchizedek and Aaron was effective, and fulfilled the end for which it was appointed. The one answers to the other as type and antitype, as prediction and fulfillment. Christ\'s priesthood is opened to us in the Epistle to the Hebrews (<a onClick="return mV(\'Hbr\',2,\'14-18\');">2:14-18</a>; <a onClick="return mV(\'Hbr\',4,\'14-16\');">4:14-16</a>; <a onClick="return mV(\'Hbr\',5,\'1-10\');">5:1-10</a>; <a onClick="return mV(\'Hbr\',7,9,10,18);">7:9,10,18</a>). Two fundamental truths touching His priesthood are made very prominent in the Epistle to the Hebrews. These are its order and its duties. By the order is meant the rank or grade of the Priest, and by the duties the various functions of His ministry. Christ\'s order as Priest is that of Melchizedek, not at all that of Aaron; <a onClick="return mV(\'Hbr\',7,\'1-\');">Heb 7</a> makes this fact perfectly clear. Like Melchizedek, and infinitely above Melchizedek, He is Priest, having no predecessor in the great office, and no successor; herein He stands absolutely alone, peerless and perfect forever. He executes the duties or functions of it after the pattern of Aaron, as <a onClick="return mV(\'Hbr\',9,\'1-\');">Heb 9</a> clearly exhibits. These two priesthoods, Melchizedek\'s and Aaron\'s, are gloriously accomplished in the person and Work of Jesus Christ.<P>The point is raised and discussed with some keenness in our day; Did Christ execute the office of priest during His sojourn on earth, or does He exercise the office only in heaven? A full discussion of this interesting subject would be inappropriate. However, let it be noted (1) that the Lord Jesus was appointed a Priest no less certainly than was Aaron (<a onClick="return mV(\'Hbr\',5,4,5);">Heb 5:4,5</a>). In the words, "Thou art my Son, this day have I begotten thee," there appears to be a reference both to His incarnation (<a onClick="return mV(\'Luk\',1,32);">Lu 1:32</a>; <a onClick="return mV(\'Hbr\',1,5);">Heb 1:5</a>) and also to His resurrection (<a onClick="return mV(\'Act\',13,33);">Ac 13:33</a>). In <a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a> we are told that it "behooved him in all things to be made like unto his brethren, that he might become a merciful and faithful high priest in things pertaining to God, to make propitiation for the sins of the people." The assumption of human nature was needful that He might be such a priest. John the Baptist saw this truth, and said, "Behold the Lamb of God, that taketh away the sin of the world" (<a onClick="return mV(\'Jhn\',1,29);">Joh 1:29</a>).<P>There was certainly priestly action in His death. Twice we are told that He "offered up himself" (<a onClick="return mV(\'Hbr\',7,27);">Heb 7:27</a>), "For this he did once for all, when he offered up himself." This strong term, "offered," is sacrificial and points to His death as an offering made for the sins of the people. His own action in it must not be overlooked; it was He Himself who presented the offering; He was not, therefore, a struggling victim, a martyr, who could not escape the doom that came upon Him—nay, He voluntarily offered Himself.<P>In <a onClick="return mV(\'Hbr\',9,14);">Heb 9:14</a> we find these significant words: "How much more shall the blood of Christ, who through the eternal Spirit offered himself without blemish unto God, cleanse your conscience from dead works to serve the living God?" It was as Priest that He made this stupendous offering, and this He did when still on earth. He was at once both sacrifice and priest. Never was He more active than when He offered Himself to God.<P>It is worthwhile to remind ourselves that the words employed in Scripture to express the act of His dying are never used to denote the death of a creature, a man. Matthew has, He "yielded up (dismissed), his spirit" (<a onClick="return mV(\'Mat\',27,50);">Mt 27:50</a>). John has, He "gave up his spirit" (<a onClick="return mV(\'Jhn\',19,30);">Joh 19:30</a>); <a onClick="return mV(\'Mar\',15,37);">Mr 15:37</a> and <a onClick="return mV(\'Luk\',23,46);">Lu 23:46</a> both have the same words: He "gave up the ghost." He died, not because He was mortal as we are, nor because He could not deliver Himself, but because He gave Himself for our sins that we might be forgiven and saved (<a onClick="return mV(\'Jhn\',10,17,18);">Joh 10:17,18</a>). The voluntariness of His offering is the very essence of His priestly atonement.<P>5. Conclusions:<P>Priesthood springs out of the deepest need of the human soul. Men universally feel that somehow they have offended the Power to whom they are responsible, to whom they must give account of their deeds. They long to appease their offended Lord, and they believe that one who is authorized and qualified to act in their behalf may secure for them the abrogation of penalty and the pardon they seek. Hence, priesthood connects itself most closely with sin, with guilt and its removal. The heart craves the intervention and intercession on their behalf of one who has liberty of access to God, and whose ministry is acceptable. In short, the priest is the representative of the sinner in things pertaining to God. He is the mediator whose office it is to meet and satisfy the claims of God upon those for whom he acts, and who secures the pardon and the favor which the offender must have, if he is to enjoy fellowship with God. And this, and more than this, we have in our Great High Priest, the Lord Jesus Christ.<P>LITERATURE.<P>P. Fairbairn, Typology of Scripture, II; Soltau, Exposition of the Tabernacle, the Priestly Garments and the Priesthood; Martin, Atonement; Moorehead, Mosaic Institutions, article "Priest."`<a href="./study/isbe/search.html?string=CHRIST,+OFFICES+OF">CHRIST, OFFICES OF</a>; <a href="./study/isbe/search.html?string=PRIESTHOOD+IN+THE+NEW+TESTAMENT">PRIESTHOOD IN THE NEW TESTAMENT</a>`123';
isbe[7094]='Priesthood in the New Testament`1. The Jewish Priesthood<P>2. The Priesthood and High-Priesthood of Jesus Christ<P>3. The Priesthood of Believers<hr /><P>1. The Jewish Priesthood:<P>In the New Testament hierateuma (<a onClick="return mV(\'1Pe\',2,5,9);">1Pe 2:5,9</a>), "priesthood," is not found with reference to the Jewish priesthood, but hiereus, and archiereus, "high priest," frequently occur. As until the fall of Jerusalem the activities of the priests were carried on in careful accordance with the prescriptions of the Old Testament, there naturally is nothing new or striking in the numerous New Testament references to their work. Perhaps the information of the greatest interest is found in <a onClick="return mV(\'Luk\',1,\'5-9\');">Lu 1:5-9</a> to the effect that Zacharias was of the course of Abijah, the 8th of the 24 courses into which the priests were divided (compare <a onClick="return mV(\'1Ch\',24,\'7-18\');">1Ch 24:7-18</a>), and that in these courses the priests divided their work by lot. In the Gospels the archiereis are mentioned oftener than are the hiereis, the power of the priesthood seeming to have been absorbed by a sort of priestly aristocracy. As under the political pressure of that time the office of high priest could seldom be retained until the death of the holder, there might even be several living at the same time who had for a longer or shorter time held this office which made a man the head of the nation, not only ritually, but also politically, since the high priest was ex officio presiding officer of the Sanhedrin. Not only would these ex-high priests naturally retain the title belonging to their former dignity, but probably the name had come to include as well other members of the same families or of families of equal position, so that it seems that "chief priests" is a more exact translation of archiereis than high priests. In the singular, however, the reference of archiereus is usually, if not invariably, to the individual who at the time given was holding the unique office of high priest. The word hiereus is of course employed in its ordinary signification on the rare occasions when reference is made in the New Testament to corresponding ministers of other religions, as to the priest of Zeus (<a onClick="return mV(\'Act\',14,13);">Ac 14:13</a>) and also to Melchizedek (<a onClick="return mV(\'Hbr\',7,1);">Heb 7:1</a>).<P>2. The Priesthood and High-Priesthood of Jesus Christ:<P>Only in Hebrews is the activity of Jesus set forth as priestly and high-priestly, but in this Epistle great emphasis is laid on these aspects of His work. Interpreters seldom distinguish between these two aspects of His work, and it is plain that sometimes at least the author himself made no effort sharply to distinguish them. But certain considerations make it probable that they were not really confused or combined in the mind of the author himself. For example, it is to be noted that the priesthood of Jesus is declared to be after the order of Melchizedek, and consequently radically unlike that of the Levitical priests. On the other hand, the Aaronic high-priesthood is regarded as having been analogous to that of Jesus, so that in spite of its inferiority, comparison is frequently made with it. It is readily seen that the work of the high priest, both because of his entry into the Most Holy Place and because he bore the names of the children of Israel in the breastplate of judgment for a memorial before Yahweh continually, far more suitably than that of the ordinary priests typified the atoning and intercessory work of Jesus (<a onClick="return mV(\'Exd\',28,12,15);">Ex 28:12,15</a>).<P>Attempting then to treat separately the priestly and high-priestly functions of Jesus, we note that most of what is said of the priestly functions is involved in the declaration that He is a priest after the order of Melchizedek, and this thought is handled in <a onClick="return mV(\'Hbr\',7,\'1-\');">Heb 7</a> in such a way as to make plain the superiority of a priesthood after the order of Melchizedek, and thus to confirm the superiority of Christianity over Judaism, the great theme of the book. Historically, the blessing bestowed upon Abraham and the reception of tithes from him prove the superiority of Melchizedek to Levi, and still more to the priestly descendants of Levi (<a onClick="return mV(\'Hbr\',7,\'4-10\');">7:4-10</a>). Further, Jesus became priest not on the ground of a "carnal commandment," i.e. in an order based on descent and inheritance, but by "the power of an endless life" (<a onClick="return mV(\'Hbr\',7,16);">7:16</A>), of which fact Melchizedek reminds us, since Scripture is silent alike as to his birth and his death. Again, unlike the Levitical priests, Christ is inducted into His office by the oath of God (<a onClick="return mV(\'Hbr\',7,20,21);">7:20,21</A>; compare <a onClick="return mV(\'Psa\',110,4);">Ps 110:4</a>). Finally, while the priests of the Levitical line were hindered from permanence in office by their death, Jesus holds His priesthood untransmitted and untransmissible (<a onClick="return mV(\'Hbr\',7,23,24);">7:23,24</a>). This discussion of the priesthood of Christ "after the order of Melchizedek" occupies almost all of <a onClick="return mV(\'Hbr\',7,\'1-\');">Heb 7</a>, but at <a onClick="return mV(\'Hbr\',7,26);">7:26</A> His high-priesthood is suddenly introduced, and after that point, while His work is more than once contrasted with that of the temple priests (<a onClick="return mV(\'Hbr\',8,4,5);">8:4,5</a>; <a onClick="return mV(\'Hbr\',9,6);">9:6</a>; <a onClick="return mV(\'Hbr\',10,11);">10:11</A>f), no further reference is in any way made to Melchizedek.<P>After having twice merely given the title of high priest to Jesus (<a onClick="return mV(\'Hbr\',2,17);">Heb 2:17</a>; <a onClick="return mV(\'Hbr\',3,1);">3:1</a>), the writer of the Epistle to the Hebrews at <a onClick="return mV(\'Hbr\',4,14);">4:14</A> begins a statement of the resemblance between Jesus and the Jewish high priest, such "as was Aaron," finding the resemblance to reside<P>(1) in His divine appointment to His work (<a onClick="return mV(\'Hbr\',5,4,5);">5:4,5</a>), (2) in His experience of suffering (<a onClick="return mV(\'Hbr\',5,7,8);">5:7,8</a>; compare <a onClick="return mV(\'Hbr\',4,15);">4:15</a>; <a onClick="return mV(\'Hbr\',5,2);">5:2</A>), and (3) in His saving work suggested by the sacrificial activity of the ordinary high priest (<a onClick="return mV(\'Hbr\',5,9);">5:9</a>), which, however, it far transcends in value and effect. But<P>(4) later the work of the high priest and that of Jesus are contrasted as to place where done, the high priest going into the second tabernacle, i.e. the Holy of Holies (<a onClick="return mV(\'Hbr\',9,7);">9:7</a>), while Christ passes through the greater and more perfect tabernacle, "heaven itself" (<a onClick="return mV(\'Hbr\',9,11,24);">9:11,24</A>). A similar contrast is<P>(5) drawn between the sacrifices respectively offered, the ancient sacrifices being the blood of goats and calves (<a onClick="return mV(\'Hbr\',9,12);">9:12</A>), Christ\'s being "himself" (<a onClick="return mV(\'Hbr\',9,14);">9:14</a>), "his own blood" (<a onClick="return mV(\'Hbr\',9,12);">9:12</A>), "the blood of Christ, who through the eternal Spirit offered himself without blemish unto God" (<a onClick="return mV(\'Hbr\',9,14);">9:14</A>). The author also accepts and urges without argument or even explanation<P>(6) the truly sacrificial character of this self-immolation of Jesus. Nor is this fact nullified by the emphasis which once is laid on doing God\'s will in an antithesis copied from the Ps (<a onClick="return mV(\'Psa\',10,\'5-9\');">10:5-9</A>; compare <a onClick="return mV(\'Psa\',40,6);">Ps 40:6</a>ff), for here the contrast drawn is not between sacrifice on one side and obedience on the other, but rather between the sacrifice of animals dying involuntarily and wholly unconscious of the sacrificial significance of their death, and the offering of Himself on the part of Jesus in intelligent purpose to carry out the will of God, by which will the body of Jesus Christ is the only acceptable offering (<a onClick="return mV(\'Hbr\',10,10);">Heb 10:10</a>). Further the author urges<P>(7) the actual effectiveness of Christ\'s work, his argument being that it would already have been repeatedly performed if this single offering had not been sufficient for all time, "once for all" (<a onClick="return mV(\'Hbr\',7,27);">Heb 7:27</a>; <a onClick="return mV(\'Hbr\',9,26);">9:26</a>). Finally is asserted<P>(8) the intercessory work of Christ, which, though not explained, seems to be a figurative presentation of his idea that men are blessed because Christ died, i.e. that this was an indispensable condition of God\'s manifestation of His merciful love, and that the grace consequent on the death of Christ does not merely grow out of a fact, but that the divine love and providence for believers are exercised, neither automatically or impersonally, but in virtue of a constant personal sympathy for varying temptations and needs, a sympathy intensified by the earthly experience, temptation, suffering of Him who had been and is, not only the Divine Son, but also the Son of Man. Thus, the salvation of the believer is certain and complete, and the priestly and high-priestly work of Jesus reaches its consummation.<P>3. The Priesthood of Believers:<P>The priesthood of believers is an idea which finds formal expression less frequently in the New Testament than has been the case in Protestant theology. But it does not follow that there has been a corresponding divergence from the thought of the apostles. It only shows that a thought which according to apostolic conception was one of the invariable privileges of every Christian, and which found, if not constant, yet sufficiently clear expression in this figurative fashion, has come, in consequence of errors which have developed, to receive in the controversies of later centuries stronger emphasis than it did at first. It may well be noted first that this conception of the priesthood of believers, standing by itself, is in no way related to the various priestly activities which are also figuratively attributed to them. The writer of the Epistle to the Hebrews, who does not speak of the priesthood of believers, knowing no Christian priesthood but that of Jesus Himself, yet calls "praise," "to do good and to communicate," sacrifices (<a onClick="return mV(\'Psa\',13,15,16);">13:15,16</A>). So Paul bids the Romans present their bodies "a living sacrifice" (<a onClick="return mV(\'Rom\',12,1);">Ro 12:1</a>), and Peter calls Christians "a holy priesthood, to offer up spiritual sacrifices" (<a onClick="return mV(\'1Pe\',2,5);">1Pe 2:5</a>). But this figurative usage is entirely distinct from the subject of the present paragraph. Also the conception of the Christian priesthood never in the New Testament attaches itself merely to the ministry of the Christian church, whatever may be held as to its orders or tasks. In no sense has the church or any church an official priesthood. Nor is it any part of the New Testament conception of the priesthood of believers that any individual should act in any respect for any other. Though the intercessory supplication of believers in behalf of other persons has of late often been represented as a priestly act, as being, indeed, that activity which is essential to any real priesthood of believers, the New Testament thought is quite different, and is to be thus conceived: In ancient times it was held that men in general could not have direct access to God, that any approach to Him must be mediated by some member of the class of priests, who alone could approach God, and who must accordingly be employed by other men to represent them before Him. This whole conception vanishes in the light of Christianity. By virtue of their relation to Christ all believers have direct approach to God, and consequently, as this right of approach was formerly a priestly privilege, priesthood may now be predicated of every Christian. That none needs another to intervene between his soul and God; that none can thus intervene for another; that every soul may and must stand for itself in personal relation with God—such are the simple elements of the New Testament doctrine of the priesthood of all believers. (Consult treatises on New Testament theology, and commentaries on the Epistle to the Hebrews.)``51';
isbe[7095]='Priests and Levites`(kohen, "priest"; nothing is definitely known as to the origin of the word; Lewi, "<a href="./study/isbe/search.html?string=LEVITES">Levite</a>," on which see <a href="./study/isbe/search.html?string=UPPERCASE">LEVI</a>):<P><b>I. DIFFERENT VIEWS OF THE HISTORY</b><P class="in15">1. The Old View<P class="in15">2. The Graf-Wellhausen View<P class="in15">3. Mediating Views<P class="in15">4. An Alternative View<P><b>II. THE DATA OF THE PRIESTLY CODE (P) IN THE PENTATEUCH</b><P class="in15">1. The Levites<P class="in15">2. Aaron and His Sons<P><b>III. THE OTHER PORTIONS OF THE PENTATEUCH</b><P><b>IV. FROM MOSES TO MALACHI</b><P class="in15">1. The Sources Other than Ezekiel<P class="in30">(1) The Custody of the Ark<P class="in30">(2) On Its Return from the Philistines<P class="in30">(3) In Abinadab\'s House<P class="in15">2. Ezekiel<P><b>V. EZRA, NEHEMIAH, CHRONICLES</b><P class="in15">1. Estimates of the Chronicler<P class="in15">2. His Data<P><b>VI. LEGAL PROVISIONS</b><P><b>LITERATURE</b><hr /><P>In some Minaean inscriptions found at El-\'Ola, dating back about 1200-800 BC (Hommel in Hilprecht, Explorations in Bible Lands, 719), certain "priests and priestesses of the god Wadd are designated by the term lawi, feminine lawi\'at" (op. cit., 749). It is not known whether this is due to Israelite influence.<P>I. Different Views of the History.<P>1. The Old View:<P>There are great divergences of opinion among modern writers as to the true course of history and the dating of the different documents. It will therefore be best to sketch these views in rough outline, and then give the evidence of the various authorities, together with the reasons that in each case arise naturally from the consideration of that evidence.<P>The old belief was that the whole of the Pentateuchal laws were the work of Moses, that the account of the subsequent history given in the Books of Chronicles was correct, that Ezekiel\'s vision, if taken literally, could not be reconciled with the other known facts and was inexplicable, and that in the case of all other discrepancies harmonistic explanations should be adopted.<P>2. The Graf-Wellhausen View:<P>The modern critical school have traversed every one of these doctrines. The Chronicler is declared to be in constant and irreconcilable conflict with the older authorities, harmonistic explanations are uniformly rejected, the Pentateuch is denied to Moses and split up into a variety of sources of different ages, and Ezekiel gains a place of honor as representing a stage in a continuous and normal development. The subject is thus inextricably linked with the Pentateuchal problem, and reference must be made to the article <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a> for an explanation of the supposed documents and a consideration of the analysis with its nomenclature. On the other hand the present article and the article <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a> (which see) explain and discuss the most widely held theory of the historical development into which the history of the supposed Pentateuchal sources has been fitted.<P>The dominant theory is that of Wellhausen. According to this, "Levite" was originally a term denoting professional skill, and the early Levites were not members of the tribe of Levi, but professional priests. Anybody could sacrifice. "For a simple altar no priest was required, but only for a house which contained a sacred image; this demanded watching and attendance" (Wellhausen, Prolegomena, 130). The whole Levitical Law was unknown and the distinction between priests and Levites unheard of. There were a few great sanctuaries and one influential priesthood, that of Shiloh (afterward at Nob). With the monarchy the priesthood became more important. The royal priests at Jerusalem grew in consequence and influence until they overshadowed all the others. Deuteronomy recognized the equal priestly right of all Levites, and Josiah\'s reformation placed the sons of Zadok, who were the priests of Jerusalem and not descendants of Aaron, in a position of decisive superiority. Then Ezekiel drew a new and previously unknown distinction between "the priests the Levites, the sons of Zadok" who are "keepers of the charge of the altar," and the other Levites who were made "keepers of the charge of the house" as a punishment for having ministered in the high places. The Priestly Code takes up this distinction and represents it as being of Mosaic origin, making of the sons of Zadok "sons of Aaron." "In this way arose as an illegal consequence of Josiah\'s reformation, the distinction between priests and Levites. With Ezekiel this distinction is still an innovation requiring justification and sanction; with the Priestly Code it is a \'statute forever,\' although even yet not absolutely undisputed, as appears from the priestly version of the story of Korah\'s company. For all Judaism subsequent to Ezra, and so for Christian tradition, the Priestly Code in this matter also has been authoritative. Instead of the Deuteronomic formula \'the priests the Levites,\' we henceforward have \'the priests and the Levites,\' particularly in Chronicles" (op. cit., 147). From that time onward the priests and Levites are two sharply distinguished classes. It is an essential part of this theory that the Chronicler meant his work to be taken as literal history, correctly representing the true meaning of the completed law.<P>See <a href="./study/isbe/search.html?string=CRITICISM">CRITICISM</a>.<P>3. Mediating Views:<P>There have been various attempts to construct less thoroughgoing theories on the same data. As a rule, these views accept in some form the documentary theory of the Pentateuch and seek to modify the Wellhausen theory in two directions, either by attributing earlier dates to one or more of the Pentateuchal documents—especially to the Priestly Code—or else by assigning more weight to some of the statements of Chronicles (interpreted literally). Sometimes both these tendencies are combined. None of these views has met with any great measure of success in the attempt to make headway against the dominant Wellhausen theory, and it will be seen later that all alike make shipwreck on certain portions of the evidence.<P>4. An Alternative View:<P>The independent investigations on which the present article is based have led the writer to a view that diverges in important particulars from any of these, and it is necessary to state it briefly before proceeding to the evidence. In one respect it differs from all the rival schemes, not merely in result, but also in method, for it takes account of versional evidence as to the state of the texts. Subject to this it accepts the Mosaic authenticity of all the Pentateuchal legislation and the clear and consentient testimony of the Law and the Prophets (i.e. of the two earlier and more authoritative portions of the Hebrew Canon), while regarding Chronicles as representing a later interpretation, not merely of the history, but also of the legal provisions. In outline the story of the priesthood is then as follows: Moses consecrated Aaron and his sons as the priests of the desert tabernacle. He purified the rest of the tribe of Levi as a body of sacred porters for the period of wanderings, but in the legislation of Numbers he made no provision whatever for their performing any duties after the sanctuary obtained a permanent location. At the same time he gave a body of priestly teaching requiring for its administration in settled conditions a numerous and scattered body of priests, such as the house of Aaron alone could not have provided immediately after the entry into Canaan. To meet this, Deuteronomy—the last legislative work of Moses—contains provisions enlarging the rights and duties of the Levites and conferring on them a priestly position. The earlier distinction was thus largely obliterated, though the high-priestly dignity remained in the house of Aaron till the time of Solomon, when it was transferred from the house of Eli to that of Zadok, who, according to Ezekiel\'s testimony, was a Levite (but see below, IV, 1). So matters remained till the exile, when Ezekiel put forward a scheme which together with many ideal elements proposed reforms to insure the better application of the Mosaic principle of the distinction between holy and profane to greatly altered circumstances. Taking his inspiration from the wilderness legislation, he instituted a fresh division in the tribe of Levi, giving to the sons of Zadok a position similar to that once held by the sons of Aaron, and degrading all other Levites from the priesthood conferred on them by Deuteronomy to a lower rank. The duties now assigned to this class of "keepers of the charge of the house" were never even contemplated by Moses, but Ezekiel applies to them the old phrases of the Pentateuch which he invests with a new significance. As a result of his influence, the distinction between priests and Levites makes its appearance in post-exilic times, though it had been unknown to all the writers of the second division of the Hebrew Canon. At the same time a meaning was read into the provisions of the Law which their original author could not have contemplated, and it was this interpretation which is presented (at any rate to some extent) in Chronicles, and has given us the current tradition. Many of the Chronicler\'s statements are, however, not meant to be taken literally, and could not have been so taken by his original public.<P>II. The Data of the Priestly Code (P) in the Pentateuch.<P>1. The Levites:<P>To arrive at an objective conclusion it is necessary, in the first instance, to examine the facts without such bias as any view put forward by any other author, ancient or modern, sacred or profane, might impart. Every legislator is entitled to be judged on his own language, and where he has, so to speak, made his own dictionary, we are compelled to read his meaning into the terms used. The very first of the material references to the Levites drives this truth home. "But appoint thou the Levites over the tabernacle of the testimony, and over all the furniture thereof" (<a onClick="return mV(\'Num\',1,50);">Nu 1:50</a>). It is necessary to consider whether such expressions are to be read in a wide or a narrow sense. We learn from <a onClick="return mV(\'Num\',18,3);">Nu 18:3</a> that death would be the result of a Levite\'s touching any of these vessels, and it therefore appears that these words are meant to be construed narrowly. "They shall bear the tabernacle, and all the furniture thereof; and they shall minister unto it," are the next words (<a onClick="return mV(\'Num\',1,50);">1:50</A>); but yet we read later of the Kohathites who were to bear it that "they shall not touch the sanctuary, lest they die" (<a onClick="return mV(\'Num\',4,15);">4:15</A>). This shows that the service in question is strictly limited to a service of porterage after the articles have been wrapped up by Aaron and his sons. By no possibility could it include such a task as cleaning the vessels. It is then further directed that the Levites are to take down and set up the dwelling and camp round about it. All these are desert services and desert services only. Then we read that "the Levites shall keep the charge of the tabernacle (dwelling) of the testimony. This concludes the first material passage (<a onClick="return mV(\'Num\',1,\'50-53\');">Nu 1:50-53</a>). The other passages of Numbers only amplify these directions; they never change them. But some phrases are used which must be more particularly considered.<P>(1) Technical Phrases.<P>We hear that the Levites are "to serve the service of the tent of meeting," and this looks as if it might refer to some general duties, but the context and the kindred passages always forbid this interpretation. <a onClick="return mV(\'Num\',7,5);">Nu 7:5</a>ff is an admirable instance. Six wagons are there assigned to the Levites for this service, two to the Gershonites and four to the Merarites. "But unto the sons of Kohath he gave none, because the service of the sanctuary belonged unto them; they bare it upon their shoulders." Here service is transport and nothing else. Again we read of the charge of the Levites in the tent of meeting, e.g. <a onClick="return mV(\'Num\',4,25);">4:25</A>f. If we look to see what this was, we find that it consisted of transporting portions of the tent that had been packed up. The "in" of English Versions of the Bible does not represent the meaning of the Hebrew fairly; for the context makes it clear that the legislator means "in respect to." "But they shall not go in to see the sanctuary even for a moment, lest they die" (<a onClick="return mV(\'Num\',7,5);">4:20</a>). In English idiom we cannot speak of the transport of portions of a dismantled tent as service in that tent. One other expression requires notice, the phrase "keep the charge" which is distinguished in <a onClick="return mV(\'Num\',8,26);">8:26</A> from "doing service." The exact meaning cannot be determined. It appears to denote something kindred to service, but of a less exacting nature, perhaps the camping round the tent and the guardianship of the articles on the march. We shall see hereafter by comparison with other books that in P it does not bear the same meaning as elsewhere.<P>(2) Other Legal Provisions.<P>The Levites were to act under the orders of Aaron and his sons, who were to assign to each man his individual functions (<a onClick="return mV(\'Num\',3,\'1-\');">Nu 3</a>; <a onClick="return mV(\'Num\',4,\'1-\');">4</a>, etc.). They were to undergo a special rite of purification (<a onClick="return mV(\'Num\',8,1);">Nu 8</a>), but not of consecration. They were taken in place of the firstborn (<a onClick="return mV(\'Num\',3,\'1-\');">Nu 3</a>). The age for beginning service is given in <a onClick="return mV(\'Num\',4,\'1-\');">Nu 4</a> as 30 years, but in <a onClick="return mV(\'Num\',8,24);">Nu 8:24</a> as 25 years, if the text is sound. The age for ceasing to serve was 50. In many passages the versions suggest that a good many phrases are textually doubtful, and it is probable that when a critical text of the Pentateuch is formed on scientific principles, a good many superfluous expressions will be found not to be original; but there is no reason to suppose that any real difference in the meaning of the passages would be revealed by such a text.<P>The story of Korah is easily misunderstood. It appears from <a onClick="return mV(\'Num\',16,3);">Nu 16:3</a> that his real object was to put himself on an equality with Moses and Aaron, and this is the "priesthood" referred to in <a onClick="return mV(\'Num\',16,10);">16:10</a>. <a onClick="return mV(\'Num\',18,\'1-\');">Nu 18</a> reinforces the earlier passages. It is noteworthy as showing that in the conception of the legislator the Levites were not to come near the vessels or the altar (<a onClick="return mV(\'Num\',18,3);">18:3</a>). The penalty is death for both Levites and priests.<P>(3) Contrast with Ezekiel and Chronicles.<P>The impression as to the meaning of P which may be gathered from an examination of its statements is powerfully reinforced when they are tested by reference to Ezekiel and Chronicles, <a onClick="return mV(\'Eze\',44,\'9-14\');">Eze 44:9-14</a> seems to demand of the Levites some service as gatekeepers, the slaying of burnt offering and sacrifice for the people and a keeping of "the charge of the house, for all the service thereof," which in the light of <a onClick="return mV(\'Eze\',44,7);">44:7</A>f appears to mean in his terminology, not a service of transport, but an entry into the house and the performance of certain duties there. The Priestly Code (P), on the contrary, knows nothing of gatekeepers, regards the slaying of the burnt offering and sacrifice as the duty of the individual sacrificant (<a onClick="return mV(\'Lev\',1,\'1-\');">Le 1</a>; <a onClick="return mV(\'Lev\',3,\'1-\');">3</a>), and—if, as Wellhausen thinks, it refers to the temple—it would have visited with death a Levite who was present in the places in which Ezekiel requires him to minister. Similarly with the Chronicler. For instance, he the Levites being \'for the service of the...in the courts and over the chambers, and over the cleansing of every holy thing\' (<a onClick="return mV(\'1Ch\',23,28);">1Ch 23:28</a>), but P knows nothing of any chambers, would not have allowed the Levites to touch (much less clean) many of the holy things, and regarded service simply as porterage. In <a onClick="return mV(\'1Ch\',23,31);">1Ch 23:31</a> the Levites are to offer burnt offerings on certain occasions; in P their approach to the altar would have meant death both to themselves and the priests (<a onClick="return mV(\'Num\',18,3);">Nu 18:3</a>). Other instances will be found in PS, 238 f.<P>(4) What the Foregoing Proves.<P>In view of these facts it is impossible to hold that the Levites in P represent a projection of the Levites of the second temple or any post-Mosaic age into the desert period. To P they are a body of sacred porters. The temple of course could not be carried about, and it cannot be held that in this respect the legislation mirrors later circumstances. "Secondly, the net result of such a scheme would be to create a body of Levites for use during the period of wanderings and never thereafter. As soon as the desert age was over the whole tribe would find their occupation gone. How can we conceive that any legislator deliberately sat down and invented such a scheme centuries after the epoch to which it relates, well knowing that in so far as his scheme purported to be a narrative of events it was fictitious from beginning to end, and in so far as it might be regarded as a legislation applicable to his own or any future day, there was not a line in it that could conceivably be put into practice? If any theorist can be conceived as acting in this way, how are we to suppose that his work would meet with acceptance?...Thirdly, P neither embodies the views of Ezekiel nor finds an accurate reflection in Chronicles. The facts are such as to enable us to say definitely that P is not in line with them. It is impossible to assume that he appointed the death penalty for certain acts if performed by Levites because he really wished the Levites to perform those acts" (PS, 241f).<P>2. Aaron and His Sons:<P>Priests and Levites also speaks of Aaron the priest and the sons of Aaron the priest. It is doubtful whether the expression "the sons of Aaron the priests," which occurs frequently in the Massoretic Text, is ever original; the Massoretic expression is nowhere supported by all the authorities. "The phrase \'Aaron the high priest\' is entirely unknown to Priests and Levites. Where the high priest\'s name is given the only qualifying apposition possible in his usage is \'the priest.\' " Aaron and his sons, unlike the Levites, were consecrated, not merely purified.<P>At this point two features only of the legislation need be noticed: the inadequacy of the staff to post-conquest conditions and the signs of date. For example, the leprosy laws (<a onClick="return mV(\'Lev\',13,\'1-\');">Le 13</a>f) postulate the presence of priests to inspect and isolate the patient. "Remembering that on the critical theory P assumes the capital at Jerusalem as self-evident, we must ask how such provisions were to work after the conquest. During the desert period nothing could have been simpler, but what was to happen when the Israelites dwelt all over Canaan from Beersheba to Dan?" (PS, 246). The difficulty is immensely increased if we postulate an exilic or post-exilic date, when the Jewish center of gravity was in Babylonia and there were large colonies in Egypt and elsewhere. And "What are we to say when we read of leprous garments (<a onClick="return mV(\'Lev\',13,47);">Le 13:47</a>)? Was a man to make the pilgrimage from Babylonia to Jerusalem to consult a priest about a doubtful garment? And what about the leper\'s offerings in <a onClick="return mV(\'Lev\',14,\'1-\');">Le 14</a>? Could they conceivably have been meant to apply to such circumstances?" (PS, 247). The case is no better with the law of leprous houses, which is expressed to apply to the post-conquest period (<a onClick="return mV(\'Lev\',4,\'33-\');">Le 4:33</a>-<a onClick="return mV(\'Lev\',5,1,2,3);">5:3</a>). The notification to the priest and his inspections require a priesthood scattered all over the country, i.e. a body far more numerous than the house of Aaron at the date of the conquest. Such instances could easily be multiplied from the legislation; one more only will be cited on account of its importance to the history of the priesthood. According to Leviticus, the individual sacrificant is to kill the victims and flay the burnt offerings. How could such procedure be applied to such sacrifices as those of Solomon (<a onClick="return mV(\'1Ki\',8,63);">1Ki 8:63</a>)? With the growth of luxury the sacrifices would necessarily become too large for such a ritual, and the wealthy would grow in refinement and object to performing such tasks personally. This suggests the reason for later abuses and for the modifications of Ezekiel and the representations of the Chronicler.<P>Result of the Evidence.<P>Thus, the evidence of P is unfavorable alike to the Wellhausen and the mediating views. The indications of date are consistently Mosaic, and it seems impossible to fit the laws into the framework of any other age without reading them in a sense that the legislator can be shown not to have contemplated. On the other hand P is a torso. It provides a large body of Levites who would have nothing to do after the conquest, and a corpus of legislation that could not have been administered in settled conditions by the house of Aaron alone.<P>III. The Other Portions of the Pentateuch.<P>In <a onClick="return mV(\'Exd\',19,22,24);">Ex 19:22,24</a> we read of priests, but a note has come down to us that in the first of those verses Aquila had "elders," not "priests," and this appears to be the correct reading in both places, as is shown by the prominence of the elders in the early part of the chapter. In Hebrew the words differ by only two letters. It is said by Wellhausen that in <a onClick="return mV(\'Exd\',33,\'7-11\');">Ex 33:7-11</a> (E) Joshua has charge of the ark. This rests on a mistranslation of <a onClick="return mV(\'Exd\',33,7);">Ex 33:7</a>, which should be rendered (correcting English Versions of the Bible), \'And Moses used to take a (or the) tent and pitch it for himself without the camp.\' It is inconceivable that Moses should have taken the tent of the ark and removed it to a distance from the camp for his private use, leaving the ark bared and unguarded. Moreover, if he had done so, Joshua could not have been in charge of the ark, seeing that he was in this tent while the ark (ex hypothesi) remained in the camp. Nor had the ark yet been constructed. Nor was Joshua in fact a priest or the guardian of the ark in E:<P class="in15">(1) in the Book of Joshua E knows of priests who carry the ark and are quite distinct from Joshua (<a onClick="return mV(\'Jos\',3,\'1-\');">3</a>ff);<P class="in15">(2) in <a onClick="return mV(\'Deu\',31,14);">De 31:14</a> (E) Joshua is not resident in the tent of meeting;<P class="in15">(3) in E, Aaron and Eleazar are priests (<a onClick="return mV(\'Deu\',10,6);">De 10:6</a>), and the Levitical priesthood is the only one recognized (<a onClick="return mV(\'Deu\',33,10);">De 33:10</a>);<P class="in15">(4) there is no hint anywhere of Joshua\'s discharging any priestly duty whatsoever.<P>The whole case rests on his presence in the tent in <a onClick="return mV(\'Exd\',33,\'7-11\');">Ex 33:7-11</a>, and, as shown in the article <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a> (which see), this passage should stand after <a onClick="return mV(\'Exd\',13,22);">Ex 13:22</a>.<P>Then it is said that in <a onClick="return mV(\'Exd\',4,14);">Ex 4:14</a>; <a onClick="return mV(\'Jdg\',17,7);">Jud 17:7</a>, "Levite" denotes profession, not ancestry. In the latter passage the youth whom Micah made a priest was of Levitical descent, being the grandson of Moses (<a onClick="return mV(\'Jdg\',17,13);">Jud 17:13</a>), and the case rests on the phrase, "of the family of Judah." Neither of the Septuagintal translations had this text (Field, Hexapla, at the place), which therefore cannot be supported, since it cannot be suggested that Moses belonged to the tribe of Judah. As to <a onClick="return mV(\'Exd\',4,14);">Ex 4:14</a>, the phrase "Aaron thy brother the Levite" is merely an adaptation of the more usual, "Aaron, son of Amram, the Levite," rendered necessary by the fact that his brother Moses is the person addressed. The Wellhausen theory here is shown to be untenable in PS, 250 and RE3, XI, 418.<P><a onClick="return mV(\'Exd\',32,\'26-29\');">Ex 32:26-29</a> foreshadows the sacred character of Levi, and <a onClick="return mV(\'Deu\',10,6);">De 10:6</a> (E) knows the hereditary Aaronic priesthood. In D the most important passage is <a onClick="return mV(\'Deu\',18,\'6-8\');">De 18:6-8</a>. In <a onClick="return mV(\'Deu\',18,7);">18:7</A> three Septuagintal manuscripts omit the words "the Levites," and if this be a gloss, the whole historic sense of the passage is changed. It now contains an enactment that any Levite coming to the religious capital may minister there "as all his brethren do, who stand there," etc., i.e. like the descendants of Aaron. "The Levites" will then be the explanation of a glossator who was imbued with the latest post-exilic ideas, and thought that "his brethren" must mean those of his fellow-Levites who were not descended from Aaron. The passage is supplemented by <a onClick="return mV(\'Deu\',21,5);">21:5</A>, giving to the Levites judicial rights, and <a onClick="return mV(\'Deu\',24,8);">24:8</a> assigning to them the duty of teaching the leprosy regulations. Together with <a onClick="return mV(\'Deu\',30,10);">33:10</a> (E), \'they shall teach thy judgments to Jacob and thy law to Israel: they shall put incense in thy nostrils and whole burnt-offering on thine altar,\' these passages complete the provisions of P in giving to the Levites an occupation in place of their transport duties, and providing the necessary staff for administering the legislation when the Israelites were no longer massed together in a single camp, but scattered over the country. We shall see in the next section that this view of the meaning of the Law was taken by every writer of the second part of the Canon who touches on the subject. Everywhere we are confronted with the legitimacy of a Levitical priesthood; nowhere is there any mention of an exclusive Aaronic right. Smaller points which cannot be discussed here are examined in PS. It only remains to notice that these provisions fully explain the frequent Deuteronomic locution, "the priests the Levites." One other remark must be made. Though it is not expressly stated, we may assume that consecration would be necessary in the case of any Levite acting on the provisions of <a onClick="return mV(\'Deu\',18,\'6-8\');">De 18:6-8</a>, and was not mentioned because in Hebrew antiquity it went without saying that every priest must be consecrated (compare <a onClick="return mV(\'Jdg\',17,\'1-\');">Jud 17</a>).<P>IV. From Moses to Malachi.<P>1. The Sources Other than Ezekiel:<P>Joshua adds but little to our information. In <a onClick="return mV(\'Jdg\',18,7);">18:7</a> the priesthood is called the inheritance of the Levites, and it is singular that the Wellhausen critics attribute this to a priestly redactor, though such a writer should ex hypothesi have been jealous to withhold the priesthood from the Levites. It is very interesting to find that in <a onClick="return mV(\'Jos\',3,\'1-\');">Jos 3</a>; <a onClick="return mV(\'Jos\',4,\'1-\');">4</a>, all the different critical documents speak in exactly the same terms of "the priests that bare the ark." The priestly writer ought, on the Wellhausen theory, to have said "the Levites." The expression "the priests the Levites" is found alternating with the expression "the priests." All this points to the construction put upon the provisions of the Law in the preceding section, and finds fresh confirmation in Judges, where we see Micah rejoicing at having a Levite as a priest (<a onClick="return mV(\'Jdg\',17,13);">Jud 17:13</a>), thus showing that the sacred character of the tribe was recognized in the earliest post-Mosaic times. The lay sacrifices in this and the following books are explained under <a href="./study/isbe/search.html?string=SANCTUARY">SANCTUARY</a>; <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a> (which see).<P>The period of the early kings shows us kings blessing the people (e.g. <a onClick="return mV(\'2Sa\',6,18);">2Sa 6:18</a>). It is claimed that this is the priestly blessing, but without evidence, and there seems no more reason to see special priestly rights here than in David\'s blessing his household (<a onClick="return mV(\'2Sa\',6,20);">2Sa 6:20</a>), or the frequent blessings of the Bible (e.g. Genesis passim, especially "in thee will Israel bless," <a onClick="return mV(\'Gen\',48,20);">Ge 48:20</a>), while in <a onClick="return mV(\'1Ki\',8,55);">1Ki 8:55</a>ff we actually have the words of the blessing delivered on one of those occasions by Solomon, and it is quite unlike the blessing of the priests (<a onClick="return mV(\'Num\',6,22);">Num 6:22</a>ff).<P>Textual criticism disposes of the supposed priesthood of certain non-Levitical persons. In <a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a> the Massoretic Text makes David\'s sons "priests," but this reading was unknown to the Septuagint, Symmachus, and Theodotion (Field, ad. loc.). The Septuagint has "aularches," i.e. chamberlains. That this represents a different Hebrew word is proved by the Septuagintal list of <span class="noTag">3 Ki 2:46</A> (not extant in Hebrew), where we read that Benaiah, son of Jehoiada, was "over the aularchy and over the brick-making." It cannot be suggested that this represents an original Hebrew "over the priesthood and over the brick-making," and accordingly we must concede the existence of some secular court office which was rendered by this Greek phrase. Hitzig and Cheyne conjecture that tsokhenim should be read for kohanim. This word gives the sense required (see <a onClick="return mV(\'Isa\',22,15);">Isa 22:15</a>) Revised Version margin "steward"). In <a onClick="return mV(\'2Sa\',20,26);">2Sa 20:26</a> we read that Ira, ha-ya\'iri ("the Jairite"), was a priest, but the Syriac version supported by Lucian and <a onClick="return mV(\'2Sa\',23,38);">23:38</a> reads ha-yattiri ("the Jattirite"). Jattir was a priestly city. In <a onClick="return mV(\'1Ki\',4,5);">1Ki 4:5</a> Nathan\'s son is described as \'priest friend of the king,\' but the Septuagint reads only "friend of the king" (compare especially <a onClick="return mV(\'1Ch\',27,33);">1Ch 27:33</a>f; <a onClick="return mV(\'2Sa\',15,32);">2Sa 15:32</a>), and at another period Nathan\'s son held the kindred secular office of king\'s counselor (the Septuagint <span class="noTag">3 Ki 2:46</a>, a fact that is certainly unfavorable to the view that he ever held priestly office). There can therefore be no doubt that the word "priest," kohen has arisen through dittography of the preceding word nathan, Nathan.<P>Various dealings with the ark and the age of Samuel require notice. As a boy, Samuel himself is given into the service of Eli. It has been argued that he really officiated as a priest, though probably (if the Chronicler\'s data is rejected) not of the Levitical descent. The answer is to be found in his age. Weaning sometimes took place at as late an age as three, and accordingly, the boy may have been as much as four years old when he was taken to Shiloh (<a onClick="return mV(\'1Sa\',1,24);">1Sa 1:24</a>). His mother used to bring him a little cloak (<a onClick="return mV(\'1Sa\',2,19);">1Sa 2:19</a>) every year, and this notice also shows his extreme youth. In view of this, it cannot be seriously contended that he performed any priestly service. He must have been something like a page, and he performed some duties of a porter, opening the door-valves of the temple at Shiloh (<a onClick="return mV(\'1Sa\',3,15);">1Sa 3:15</a>).<P>(1) The Custody of the Ark<P>When the ark was captured by the Philistines, it was in the charge of priests. When David brought it to Jerusalem, it was again placed in priestly custody, but there is an interregnum of some 20 years (<a onClick="return mV(\'1Sa\',7,2);">1Sa 7:2</a>).<P>It must be remembered that whatever may have happened during this period of great national confusion, the practice of all the rest of history, extending over some 600 or 700 years, is uniform and would far outweigh any irregularities during so short and troubled a period.<P>(2) On Its Return from the Philistines<P>The first difficulty arises on <a onClick="return mV(\'1Sa\',6,14,15);">1Sa 6:14,15</a>. In the second of these verses the Levites come up after the Beth-shemites have finished, and, in Wellhausen\'s words, "proceed as if nothing had happened, lift the ark from the now-no-longer-existent cart, and set it upon the stone on which the sacrifice is already burning" (Prolegomena, 128). It is therefore suggested that <a onClick="return mV(\'1Sa\',6,15);">6:15</A> is a gloss. But there is difficulty in <a onClick="return mV(\'1Sa\',6,14);">6:14</A> which tells of the breaking up of the cart, etc., without explaining what happened to the ark. The trouble may be met by a slight transposition, thus: \'<a onClick="return mV(\'1Sa\',6,14);">14a</a> and the cart came into the field,...and stood there, and there was there a great stone: <a onClick="return mV(\'1Sa\',6,15);">15a</a> and the Levites took down the ark, etc. and put them on the great stone: <a onClick="return mV(\'1Sa\',6,14);">14b</A> and clave the wood of the cart,\' etc., followed by <a onClick="return mV(\'1Sa\',6,15);">15b</A>. This makes perfect sense.<P>(3) In Abinadab\'s House<P>The second difficulty is made by <a onClick="return mV(\'1Sa\',7,1);">1Sa 7:1</a>, where we read that the ark was brought to the house of Abinadab \'and Eleazar his son they sanctified to guard\' it. Its old abode, the house at Shiloh, had apparently been destroyed (<a onClick="return mV(\'Jer\',7,12,14);">Jer 7:12,14</a>; <a onClick="return mV(\'Jer\',26,6,9);">26:6,9</a>). There it enjoyed considerable importance, for Poels is unquestionably right in identifying the Gibeah of God (<a onClick="return mV(\'1Sa\',10,5);">1Sa 10:5</a>) with the Gibeah (hill) of the ark. Thus, there was a high place there and a Philistine garrison (compare <a onClick="return mV(\'1Sa\',13,3);">1Sa 13:3</a>, where Septuagint and Targum have "Gibeah"). There remains the difficulty caused by the guardianship of Eleazar. Poels may be right in reading we\'eth bene\' El\'azar, "and the sons of Eleazar," for we\'eth \'El\'azar beno, "and Eleazar his son"; but in the entire absence of information, alike as to Eleazar\'s functions and as to his tribe, nothing definite can be said. The narratives of the slaughter among the Beth-shemites and the fate of Uzzah make it certain that Eleazar\'s custody of the ark kept him at a respectful distance from it.<P>When David at the end of this period removed the ark, it was first taken in a cart. This proved fatal to Uzzah, and the ark was deposited in the house of Obededom the Gittite. The text of Samuel knows nothing of any guardianship of the ark by Obed-edom. Probably he took very good care not to go near it in view of Uzzah\'s fate. Then it was transported to Jerusalem by bearers (<a onClick="return mV(\'2Sa\',6,13);">2Sa 6:13</a>)—presumably of Levitical descent. No further irregularities are urged.<P>More important is the change of priesthood; <a onClick="return mV(\'1Sa\',2,\'27-36\');">1Sa 2:27-36</a> clearly threatens Eli, whose house had been chosen in Egypt, with a transference of the high-priesthood to another line. Careful comparison with <a onClick="return mV(\'1Ki\',2,27);">1Ki 2:27</a> makes it certain that the prophecy was fulfilled when Zadok was placed by Solomon in the place of Abiathar. Who was Zadok? According to Chronicles (<a onClick="return mV(\'1Ch\',6,8,53);">1Ch 6:8,53</a>; <a onClick="return mV(\'1Ch\',24,3);">24:3</a>; <a onClick="return mV(\'1Ch\',27,17);">27:17</a>) he was descended from Aaron through Eleazar, and this is accepted by Orr, Van Hoonacker and many others, who take Chronicles in a literal sense. According to Ezekiel he was a Levite (<a onClick="return mV(\'Eze\',40,46);">40:46</a>, etc.). It is noteworthy that throughout the prophetical books we always hear of the Levitical priesthood, not the Aaronic (see especially <a onClick="return mV(\'1Ki\',12,31);">1Ki 12:31</a>; <a onClick="return mV(\'Jer\',33,\'18-22\');">Jer 33:18-22</a>; <a onClick="return mV(\'Mal\',2,\'1-\');">Mal 2</a>), and the "father\'s house" of <a onClick="return mV(\'1Sa\',2,\'27-36\');">1Sa 2:27-36</a> that was chosen in Egypt could only be the house of<P>Aaron, not of Ithamar, if the passage is to be taken in its natural sense. On this view Zadok\'s appointment could only have fulfilled the prophecy if it terminated the Aaronic succession. It would seem therefore that the high-priesthood was transferred to a family of non-Aaronic Levites. For the alternative view see <a href="./study/isbe/search.html?string=ZADOK">ZADOK</a>.<P>The prophet\'s speech in <a onClick="return mV(\'1Sa\',2,\'27-36\');">1Sa 2:27-36</a> is also important for the light it throws on the organization of the priesthood. The high priest has in his gift a number of priestly offices with pecuniary and other emoluments. This postulates a far more advanced hierarchy than that of Priest.<P>The reference to "the priests and the Levites" in <a onClick="return mV(\'1Ki\',8,4);">1Ki 8:4</a> was unknown to the Septuagint, but in other passages the Books of Kings show further advances in hierarchical organization. There is not merely the high priest—generally like Aaron in the Priestly Code (P) called "the priest," but sometimes the high priest—but also the second priest (<a onClick="return mV(\'2Ki\',25,18);">2Ki 25:18</a>; <a onClick="return mV(\'Jer\',52,24);">Jer 52:24</a>; <a onClick="return mV(\'2Ki\',23,4);">2Ki 23:4</a>, according to the Targum), three keepers of the threshold (ubi supra, and <a onClick="return mV(\'2Ki\',12,10);">2Ki 12:10</a>) and "elders of the priests" (<a onClick="return mV(\'2Ki\',19,2);">2Ki 19:2</a>; <a onClick="return mV(\'Isa\',37,2);">Isa 37:2</a>; perhaps also <a onClick="return mV(\'Jer\',19,1);">Jer 19:1</a>). See also <a onClick="return mV(\'Jer\',20,1);">Jer 20:1</a>f; <a onClick="return mV(\'Jer\',29,26);">29:26</a> for priestly organization and jurisdiction in the temple precincts. All this contrasts strikingly with the simplicity of the Pentateuchal organization.<P>2. Ezekiel:<P>Ezekiel is entirely in line with the other sources for this period, but he seeks to institute certain reforms. He writes, "Her priests have done violence to my law, and have profaned my holy things: they have made no distinction between the holy and the common, neither have they caused men to discern between the unclean and the clean," etc. (<a onClick="return mV(\'Eze\',22,26);">Eze 22:26</a>). If these words have any meaning they signify that he was acquainted with a law which followed the very words of <a onClick="return mV(\'Lev\',10,\'1-\');">Le 10</a> and other passages of the Priestly Code (P), and was intended to reach the people through the teaching of the priests. In <a onClick="return mV(\'Eze\',40,\'1-\');">Ezekiel 40-48</a>, there is a vision of th
