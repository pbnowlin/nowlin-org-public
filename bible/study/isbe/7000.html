isbe[7001]='Plead`pled: In modern non-legal English is a synonym of "pray" or "beseech," but in legal phraseology "plea," "plead," and "pleading" have a great variety of technical meanings, with "present a case before the court" as the idea common to all. All the uses of "plead" in English Versions of the Bible are connected with this legal sense, so that outside of the set phrase "plead a cause" (<a onClick="return mV(\'1Sa\',24,15);">1Sa 24:15</a>, etc.) there is hardly a use of the word in the King James Version, the English Revised Version, or the American Standard Revised Version that is clear modern English The most obscure instances are due to The King James Version\'s employment of "plead" to translate the niphal of shaphat. Shaphat means "judge," so its niphal means "bring oneself into a case to be judged," "enter into controversy with," and so "plead" in the legal sense. Hence, "None pleadeth in truth" (<a onClick="return mV(\'Isa\',59,4);">Isa 59:4</a>) means "none of their lawsuits are honest." Accordingly, when God is said to "plead with" man (<a onClick="return mV(\'Isa\',66,16);">Isa 66:16</a> the King James Version, the English Revised Version, etc.), the meaning is that God states His side of the case and not at all that He supplicates man to repent. And this statement by God is a judicial act that of course admits of no reply. Hence, the Revised Version (British and American) has changed "plead with" into "enter into judgment with" in <a onClick="return mV(\'Jer\',2,35);">Jer 2:35</a>, and the American Standard Revised Version has carried this change into all the other passages (<a onClick="return mV(\'Jer\',25,31);">Jer 25:31</a>; <a onClick="return mV(\'Eze\',17,20);">Eze 17:20</a>; <a onClick="return mV(\'Eze\',20,35,36);">20:35,36</a>; <a onClick="return mV(\'Eze\',38,22);">38:22</a>), with "execute judgment" in <a onClick="return mV(\'Isa\',66,16);">Isa 66:16</a>; <a onClick="return mV(\'Joe\',3,2);">Joe 3:2</a>. The same verb form occurs also in <a onClick="return mV(\'Isa\',43,26);">Isa 43:26</a>: "Let us plead together," where "Let us present our arguments on both sides" would be a fair paraphrase. Otherwise "plead" usually represents ribh, for which the Revised Version (British and American) gives "strive" in place of "plead" in <a onClick="return mV(\'Psa\',35,1);">Ps 35:1</a>, and "contend" in <a onClick="return mV(\'Job\',13,19);">Job 13:19</a>; <a onClick="return mV(\'Job\',23,6);">23:6</a> (the American Standard Revised Version also in <a onClick="return mV(\'Jdg\',6,31,32);">Jud 6:31,32</a>; <a onClick="return mV(\'Isa\',3,13);">Isa 3:13</a>; <a onClick="return mV(\'Jer\',2,9);">Jer 2:9</a>; <a onClick="return mV(\'Jer\',12,1);">12:1</a>; <a onClick="return mV(\'Hsa\',2,2);">Ho 2:2</a>, retaining "plead" only in <a onClick="return mV(\'Isa\',1,17);">Isa 1:17</a> and in the phrase "plead a cause"). yakhach, is rendered "plead" in <a onClick="return mV(\'Job\',19,5);">Job 19:5</a> ("plead against me my reproach," where the meaning is "convict me of"), in <a onClick="return mV(\'Mic\',6,2);">Mic 6:2</a> the King James Version and the English Revised Version (the American Standard Revised Version "contend"), and <a onClick="return mV(\'Job\',16,21);">Job 16:21</a> the King James Version (the Revised Version (British and American) "maintain the right"). "Plead" is used also for din, in <a onClick="return mV(\'Jer\',30,13);">Jer 30:13</a> and <a onClick="return mV(\'Pro\',31,9);">Pr 31:9</a> the King James Version (the Revised Version (British and American) "minister justice to"), and <a onClick="return mV(\'Jer\',5,28);">Jer 5:28</a> the Revised Version (British and American) (the King James Version "judge"; compare <a onClick="return mV(\'Jer\',22,16);">Jer 22:16</a>, the King James Version and the Revised Version (British and American) "judge"). the Revised Version (British and American) would have done vastly better if the use of "plead" had been avoided altogether.<P>Pleadings (i.e. "arguments") occurs in <a onClick="return mV(\'Job\',13,6);">Job 13:6</a> (for ribh), and "plea" (din, in a specific legal sense) in <a onClick="return mV(\'Deu\',17,8);">De 17:8</a>. the King James Version uses "implead" in <a onClick="return mV(\'Act\',19,38);">Ac 19:38</a> for egkaleo, the Revised Version (British and American) "accuse," literally, "call into court"; compare also "pleaded the cause" in 2Macc 4:44 (literally, "argued the case") and 4:47, the Revised Version (British and American) "pleaded" (literally, "spoken," the King James Version "told their cause").``48';
isbe[7002]='Pleasure`plezh\'-ur (chephets, ratson; eudokia, hedone: "Pleasure" is the translation of various Hebrew words, chiefly of chephets, "inclination," hence, "pleasure," "delight" (<a onClick="return mV(\'Job\',21,21);">Job 21:21</a>, "What pleasure hath he in his house?" the American Standard Revised Version "what careth he for"; <a onClick="return mV(\'Job\',22,3);">Job 22:3</a>, "Is it any pleasure to the Almighty?"; <a onClick="return mV(\'Psa\',111,2);">Ps 111:2</a>; <a onClick="return mV(\'Ecc\',5,4);">Ec 5:4</a>; <a onClick="return mV(\'Ecc\',12,1);">12:1</a>; in <a onClick="return mV(\'Isa\',44,28);">Isa 44:28</a>; <a onClick="return mV(\'Isa\',46,10);">46:10</a>; <a onClick="return mV(\'Isa\',48,14);">48:14</a>; <a onClick="return mV(\'Isa\',53,10);">53:10</a>, it has the sense of will or purpose, "He shall perform all my pleasure," etc.); of ratson, "delight," "acceptance," "good will" (<a onClick="return mV(\'Ezr\',10,11);">Ezr 10:11</a>; <a onClick="return mV(\'Neh\',9,37);">Ne 9:37</a>; <a onClick="return mV(\'Est\',1,8);">Es 1:8</a>; <a onClick="return mV(\'Psa\',51,18);">Ps 51:18</a>; <a onClick="return mV(\'Psa\',103,21);">103:21</a>, etc.); nephesh, "soul," "desire" is translated "pleasure" (<a onClick="return mV(\'Deu\',23,24);">De 23:24</a>; <a onClick="return mV(\'Psa\',105,22);">Ps 105:22</a>; <a onClick="return mV(\'Jer\',34,16);">Jer 34:16</a>).<P>In the New Testament "pleasure" is the translation of eudokia, "good thought or will," "good pleasure" (<a onClick="return mV(\'Luk\',2,14);">Lu 2:14</a> the Revised Version margin; <a onClick="return mV(\'Eph\',1,5,9);">Eph 1:5,9</a>; <a onClick="return mV(\'Phl\',2,13);">Php 2:13</a>; <a onClick="return mV(\'2Th\',1,11);">2Th 1:11</a> the Revised Version (British and American) "every desire of goodness," margin "Greek: \'good pleasure of goodness.\' Compare <a onClick="return mV(\'Rom\',10,1);">Ro 10:1</a>").<P>"To take pleasure or to have pleasure" is eudokeo (<a onClick="return mV(\'2Cr\',12,10);">2Co 12:10</a>; <a onClick="return mV(\'2Th\',2,12);">2Th 2:12</a>; <a onClick="return mV(\'Hbr\',10,6,8,38);">Heb 10:6,8,38</a>); eudokeo is once translated "good pleasure" (<a onClick="return mV(\'Luk\',12,32);">Lu 12:32</a>, "It is your father\'s good pleasure to give you the kingdom"); the neuter participle of dokeo, "to think," etc.—meaning "it seems good to me"—to dokoun, is translated "pleasure" (<a onClick="return mV(\'Hbr\',12,10);">Heb 12:10</a>, "after their pleasure," the Revised Version (British and American) "as seemed good to them"); hedone, "sweetness," "pleasure," occurs in <a onClick="return mV(\'Luk\',8,14);">Lu 8:14</a>; <a onClick="return mV(\'Tts\',3,3);">Tit 3:3</a>; <a onClick="return mV(\'2Pe\',2,13);">2Pe 2:13</a> (referring to the lower pleasures of life); thelema, "wish," "will" (<a onClick="return mV(\'Rev\',4,11);">Re 4:11</a>, the Revised Version (British and American) "because of thy will"); charis, "favor" (<a onClick="return mV(\'Act\',24,27);">Ac 24:27</a>; <a onClick="return mV(\'Act\',25,9);">25:9</a>, the Revised Version (British and American) "favor"); spatalao "to live voluptuously" (<a onClick="return mV(\'1Ti\',5,6);">1Ti 5:6</a>, the Revised Version (British and American) "she that giveth herself to pleasure"); suneudokeo, "to think well with," "to take pleasure with others" (<a onClick="return mV(\'Rom\',1,32);">Ro 1:32</a>, the Revised Version (British and American) "consent with"); truphao, "to live luxuriously" (<a onClick="return mV(\'Jam\',5,5);">Jas 5:5</a>, the Revised Version (British and American) "lived delicately").<P>The verb "to pleasure" occurs in 2Macc 2:27 as the translation of eucharistia, the Revised Version (British and American) "gratitude"; 12:11, ophelesein, the Revised Version (British and American) "to help."``185';
isbe[7003]='Pledge`plej (verbs chabhal (10 times), \'arabh (<a onClick="return mV(\'2Ki\',18,23);">2Ki 18:23</a> equals <a onClick="return mV(\'Isa\',36,8);">Isa 36:8</a>); nouns chahal (<a onClick="return mV(\'Eze\',18,12,16);">Eze 18:12,16</a>; <a onClick="return mV(\'Eze\',33,15);">33:15</a>), chabcholah (<a onClick="return mV(\'Eze\',18,7);">Eze 18:7</a>), \'arubbah), (<a onClick="return mV(\'1Sa\',17,18);">1Sa 17:18</a>), erabhon (<a onClick="return mV(\'Gen\',38,17,18,20);">Ge 38:17,18,20</a>); also abhot (<a onClick="return mV(\'Deu\',24,\'10-13\');">De 24:10-13</a>) and (the Revised Version (British and American) only) abhtit (<a onClick="return mV(\'Hab\',2,6);">Hab 2:6</a>)): All these words have about the same meaning.<P>(1) The "pledge" is, as in modern English, security given for future payment (<a onClick="return mV(\'Gen\',38,\'17-24\');">Ge 38:17-24</a>) or conduct (<a onClick="return mV(\'Hab\',2,6);">Hab 2:6</a>, where the conquered nations have given guaranties of their subserviency to the Chaldeans; the King James Version\'s "thick clay" here rests on a misreading of the Hebrew). In <a onClick="return mV(\'2Ki\',18,23);">2Ki 18:23</a> (equals <a onClick="return mV(\'Isa\',36,8);">Isa 36:8</a>) the "pledge" is a wager (so the Revised Version margin). Rabshakeh mockingly dares Hezekiah to stake a "pledge" that he can produce 2,000 men for the defense of Jerusalem, although the mighty Assyrian host has that number of horses alone. The general point of the obscure passage <a onClick="return mV(\'Pro\',20,16);">Pr 20:16</a> (equals <a onClick="return mV(\'Pro\',27,13);">27:13</A>) is that he who guarantees strangers needs a guaranty himself. <a onClick="return mV(\'1Sa\',17,18);">1Sa 17:18</a> is uncertain and the text may be corrupt. If not, the "pledge" is some (prearranged?) token of the welfare of David\'s brethren.<P>(2) Most of the occurrences of "pledge," however, deal with the debts of the very poor, who had no property that they could spare even temporarily. Consequently, the exaction of a pledge from such persons worked genuine hardship, and to take a pledge at all was a cruel act (<a onClick="return mV(\'Job\',24,3);">Job 24:3</a>), although of course the dishonesty of withholding a pledge (<a onClick="return mV(\'Eze\',18,7);">Eze 18:7</a>; <a onClick="return mV(\'Eze\',33,15);">33:15</a>) was worse. Lowest in the scale was the creditor who took the garment the borrower was wearing (<a onClick="return mV(\'Amo\',2,8);">Am 2:8</a>; <a onClick="return mV(\'Job\',22,6);">Job 22:6</a>; <a onClick="return mV(\'Job\',24,9);">24:9</a> margin), and special legislation controlled this practice. A garment (the outer "cloak" (see <a href="./study/isbe/search.html?string=DRESS">DRESS</a>) not worn while doing manual labor) so taken must be restored at night (<a onClick="return mV(\'Exd\',22,26);">Ex 22:26</a>; <a onClick="return mV(\'Deu\',24,12,13);">De 24:12,13</a>), for it was the usual covering of the sleeper. (Apparently, though, the creditor regained custody of it in the daytime until the debt was paid.) A widow\'s clothing, however, was entirely exempt (<a onClick="return mV(\'Deu\',24,17);">De 24:17</a>), as was the handmill used for bread-making (<a onClick="return mV(\'Deu\',24,6);">De 24:6</a>). The lender had no right of entry into the borrower\'s house to obtain the pledge (<a onClick="return mV(\'Deu\',24,10,11);">De 24:10,11</a>), but it is not said that he could not dictate what he would accept; indeed, the contrary is inconceivable.<P>(3) the American Standard Revised Version gives "pledge" for the King James Version and the English Revised Version "faith" in <a onClick="return mV(\'1Ti\',5,12);">1Ti 5:12</a>.`<a href="./study/isbe/search.html?string=EARNEST">EARNEST</a>`48';
isbe[7004]='Pleiades`pli\'-a-dez, ple\'-ya-dez, ple\'-a-dez.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>; <a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[7005]='Pleroma`ple-ro\'-ma.`<a href="./study/isbe/search.html?string=FULLNESS">FULLNESS</a>`1';
isbe[7006]='Plow`plou (charash; arotrioo): No implement of the Bible is more frequently illustrated today than the plow. This is partly because there is every reason to believe that the plows still used throughout Egypt, Palestine, and Syria are counterparts of the ancient ones. The first plows were probably an adaptation of the ancient Egyptian hoe, where the handle was lengthened in order that animals might be hitched to it. To make it easier to break up the ground, it was pointed, and handles were added by which it could be guided. The ancient plow probably varied in type in different sections of the country, as it does today. In one form a young tree Of oak or other strong wood of a diameter of 3 or 4 inches is cut off just below a good-sized branch and again 15 or 20 inches above. The upper end of the severed trunk is pointed and forms the share. Between this and the side branch is fitted a brace. The branch is cut off 10 or 12 ft. from the trunk and forms the pole. A lighter stick, about 3 ft. long, projects upward from the share and forms the handle. The plow used in Syria is of slightly different construction. The handle and share are one continuous piece, so cut that there is a slight bend at the middle. The share is pointed and is used bare in the plains, or in more stony regions is shod with iron. The pole is of 2 pieces joined end to end. The thicker end of the pole is notched, so that it may be attached firmly to the share. The whole plow is so light that it can be easily carried on a man\'s shoulder. These plows literally scratch the soil, as the Hebrew word implies. They do not turn over the ground as the modern implement does. The plowman guides the plow with one hand, and with the other sometimes goads the oxen, and at other times with the chisel end of his goad breaks away the lumps of earth or other material which impedes the progress of his plow.<P>In addition to the words which are found above, the following terms occur: \'abhadh (literally, "to serve"), "worked" or "plowed" (<a onClick="return mV(\'Deu\',21,4);">De 21:4</a>); palach (literally, "to break open," <a onClick="return mV(\'Psa\',141,7);">Ps 141:7</a>).<P>One special law is mentioned in connection with plowing, namely that an ox and an ass should not be yoked together (<a onClick="return mV(\'Deu\',22,10);">De 22:10</a>), a prohibition which is utterly disregarded today. Oxen were principally used for plowing (<a onClick="return mV(\'Job\',1,14);">Job 1:14</a>). Often several yokes of oxen followed each other plowing parallel furrows across the field, a sight still common on the plains of Syria (<a onClick="return mV(\'1Ki\',19,19);">1Ki 19:19</a>). Plowing was done by bond servants (<a onClick="return mV(\'Luk\',17,7);">Lu 17:7</a>; compare \'abhadh, <a onClick="return mV(\'Deu\',21,4);">De 21:4</a>). Plowing cannot be done before the rains (<a onClick="return mV(\'Jer\',14,4);">Jer 14:4</a>); on the other hand the soil is too sticky to plow in the winter time (<a onClick="return mV(\'Pro\',20,4);">Pr 20:4</a>). The law requiring one day of rest in every seven days included plowing time (<a onClick="return mV(\'Exd\',34,21);">Ex 34:21</a>).<P>Figurative: "The plowers plowed upon my back" typified deep affliction (<a onClick="return mV(\'Psa\',129,3);">Ps 129:3</a>; compare <a onClick="return mV(\'Psa\',141,7);">Ps 141:7</a>). "Plow iniquity" is urged in the sense of "plant iniquity." Doing evil was sure to bring evil consequences (<a onClick="return mV(\'Job\',4,8);">Job 4:8</a>; compare <a onClick="return mV(\'Mic\',3,12);">Mic 3:12</a>). As surely as planting comes after plowing, so surely will Yahweh carry out His decree of destruction (<a onClick="return mV(\'Isa\',28,\'23-25\');">Isa 28:23-25</a>). "Judah shall plow," i.e. become enslaved (<a onClick="return mV(\'Hsa\',10,11);">Ho 10:11</a>); compare "Foreigners shall be your plowmen" (<a onClick="return mV(\'Isa\',61,5);">Isa 61:5</a>). "Will one plow there with oxen?" (<a onClick="return mV(\'Amo\',6,12);">Am 6:12</a>), "neither plowing nor harvest" (<a onClick="return mV(\'Gen\',45,6);">Ge 45:6</a>) are figures of desolation. Zion plowed as a field, i.e. utterly destroyed (<a onClick="return mV(\'Jer\',26,18);">Jer 26:18</a>). The plowman shall overtake the reaper, i.e. the soil shall be so fertile as to require no rest—typical of great abundance (<a onClick="return mV(\'Amo\',9,13);">Am 9:13</a>). No opportunity to plow because of lack of rain is a desolate picture of drought (<a onClick="return mV(\'Jer\',14,4);">Jer 14:4</a>). As the plowman expects to share in the fruits of the harvest, so might an apostle expect his temporal needs to be provided for (<a onClick="return mV(\'1Cr\',9,10);">1Co 9:10</a>). "If ye had not plowed with my heifer," i.e. used my wife, was Samson\'s reply to those who had secured the answer to his riddle from her (<a onClick="return mV(\'Jdg\',14,18);">Jud 14:18</a>). "Beat their swords into plowshares" (or hoes) (<a onClick="return mV(\'Isa\',2,4);">Isa 2:4</a>; <a onClick="return mV(\'Mic\',4,3);">Mic 4:3</a>) typified peace; "beat your plowshares into swords"—war (<a onClick="return mV(\'Joe\',3,10);">Joe 3:10</a>). "Having put his hand to the plow, and looking back," i.e. longing for evil things when one has set his face toward doing what is right, unfits a man for the kingdom of God (<a onClick="return mV(\'Luk\',9,62);">Lu 9:62</a>; compare <a onClick="return mV(\'Gen\',19,26);">Ge 19:26</a>; <a onClick="return mV(\'Phl\',3,13);">Php 3:13</a>).`<a href="./study/isbe/search.html?string=YOKE">YOKE</a>`133';
isbe[7007]='Plucking off the Hair`pluk\'-ing.`<a href="./study/isbe/search.html?string=HAIR">HAIR</a>; <a href="./study/isbe/search.html?string=PUNISHMENTS">PUNISHMENTS</a>`1';
isbe[7008]='Plumb-Line; Plummet`plum\'-lin, plum\'-et, plum\'-it.`<a href="./study/isbe/search.html?string=TOOLS">TOOLS</a>`1';
isbe[7009]='Pochereth-Hazzebaim`pok\'-e-reth, po\'-ke-reth, po-ke\'-reth, -ha-ze-ba\'-im (pokhereth hatstsebhayim (<a onClick="return mV(\'Ezr\',2,57);">Ezr 2:57</a>), or pokhereth ha-tsebhayim (<a onClick="return mV(\'Neh\',7,59);">Ne 7:59</a>), "binder (feminine) of the gazelles"): Name of the head of a post-exilic family. The first word is a feminine Kal participle; compare qoheleth ("preacher"), the Hebrew title of the Book of Ecclesiastes. BDB suggests that the feminine is that of office. King James Version has "Pochereth of Zebaim" in Ezra, but Ryle (Cambridge Bible, 235) notes that "of" is not in the 1611 edition``1';
isbe[7010]='Poet`po\'-et (poietes, "a maker"): Occurs in this sense only in <a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>, where Paul quotes from the general expression of Greek mythology. The quotation if intended to be exact is probably from Aratus, as the words of Paul in his speech at Athens precisely agree with the opening words of the Phaenomena by Aratus. A similar but not identical expression is found in the Hymn to Zeus by Cleanthes. Aratus in his poem endeavors to posit Jupiter as the father and controller of all things, and worthy to be worshipped. In both his poem and that of Cleanthes, but especially in the latter, there is a true and lofty note of spiritual devotion. Paul takes this praise and devotion offered by the Greek poets to their unknown or fictitious gods and bestows it upon the one true God whom he declared unto the people of Athens.``158';
isbe[7011]='Poetry, Hebrew`po\'-et-ri:<P><b>I. IS THERE POETRY IN THE OLD TESTAMENT?</b><P>Poetry Defined:<P class="in15">1. In Matter, Concrete and Imaginative<P class="in15">2. In Form, Emotional and Rhythmical<P><b>II. NEGLECT OF HEBREW POETRY: CAUSES</b><P><b>III. CHARACTERISTICS OF HEBREW POETRY, EXTERNAL AND INTERNAL</b><P class="in15">1. External or Formal Characteristics<P class="in30">(1) Vocabulary<P class="in30">(2) Grammar<P class="in30">(3) Rhythm<P class="in30">(4) Parallelism<P class="in30">(5) Other Literary Devices<P class="in30">(6) Units of Hebrew Poetry<P class="in30">(7) Classification of Stichs or Verses<P class="in15">2. Internal or Material Characteristics<P class="in30">(1) Themes of Hebrew Poetry<P class="in30">(2) Species of Hebrew Poetry<P><b>IV. POETICAL WRITINGS OF THE OLD TESTAMENT</b><P class="in15">1. The Poetical Books in the Narrow Sense<P class="in15">2. Customary Division of the Poetical Books<P class="in15">3. Poetry in Non-poetical Books<P><b>LITERATURE</b><hr /><P>By Hebrew poetry in the present article is meant that of the Old Testament. There is practically no poetry in the New Testament, but, in the Old Testament Apocrypha, Sirach is largely poetical and Wisdom only less so. Post-Biblical Hebrew poetry could not be discussed here.<P>I. Is There Poetry in the Old Testament?<P>Poetry Defined:<P>It is impossible to answer this question without first of all stating what poetry really is. The present writer submits the following as a correct definition: "Poetry is verbal composition, imaginative and concrete in matter, and emotional and rhythmic in form." This definition recognizes two aspects of poetry, the formal and the material.<P>1. In Matter Concrete and Imaginative<P>The substance of poetry must be concrete—it is philosophy that deals with the abstract; and it has to be the product more or less of the creative imagination.<P>2. In Form Emotional and Rhythmical<P>It is of the essence of poetry that, like music, it should be expressed in rhythmical but not necessarily in metrical form. Moreover, the language has to be such as will stir up the aesthetic emotions. Adopting this account of poetry as criticism, it may unhesitatingly be affirmed that the Hebrew Scriptures contain a goodly amount of genuine poetry; compare the Psalms, Job, Canticles, etc. It is strange but true that poetical is older than prose written composition. An examination of the literature of the ancient Indians, Babylonians, Hebrews, Greeks and Arabs makes this quite certain.<P>II. Neglect of Hebrew Poetry: Causes.<P>Notwithstanding the undoubted fact that poetry is largely represented in the Bible, it is noteworthy that this species of Bible literature was almost wholly ignored until the 18th century. We may perhaps ascribe this fact mainly to two causes:<P>(1) Since the Bible was regarded as preeminently, if not exclusively, a revelation of the divine mind, attention was fixed upon what it contained, to the neglect of the literary form in which it was expressed. Indeed it was regarded as inconsistent with its lofty, divine function to look upon it as literature at all, since in this last the appeal is made, at least to a large extent, to the aesthetic and therefore carnal man. The aim contemplated by Bible writers was practical—the communication of religious knowledge—not literary, and still less artistic. It was therefore regarded as inconsistent with such a high purpose that these writers should trouble themselves about literary embellishment or beautiful language, so long as the sense was clear and unambiguous. It was in this spirit and animated by this conception that toward the middle of the 19th century. Isaac Taylor of Ongar (The Spirit of Hebrew Poetry,1861,56ff) and Keil of Dorpat (Introduction to the Old Testament,1881,I, 437) denied on a priori grounds the presence of epic and dramatic poetry in the Bible. How, they exclaimed, could God countenance the writing of fiction which is untruth—and the epic and the drama have both? Matthew Arnold rendered invaluable service to the cause of Bible science when he fulminated against theologians, Jewish and Christian, for making the Bible a mere collection of proof texts, an arsenal whence religious warriors might get weapons with which to belabor their opponents. "The language of the Bible is fluid...and literary, not rigid, fixed, scientific" (Preface to the first edition of Literature and Dogma). The Bible contains literature, poetical and prose, equal as literature to the best, as Matthew Arnold, Carlyle, and Froude (on Job) held. The neglect of this aspect of the Scriptures made theologians blind to the presence and therefore ignorant of the character of Bible poetry.<P>(2) Another factor which led to the neglect of the poetical element in the Old Testament is the undoubted fact that Biblical Hebrew poets were less conscious as poets than western poets, and thought much less of the external form in which they expressed themselves. Bible poetry lacks therefore such close adherence to formal rules as that which characterizes Greek, Arabic or English poetry. The authors wrote as they felt and because they felt, and their strong emotions dictated the forms their words took, and not any objective standards set up by the schools. Hebrew poetry is destitute of meter in the strict sense, and also of rhyme, though this last occurs in some isolated cases (see below, III, 1, (4), c and e). No wonder then that western scholars, missing these marks of the poetry which they knew best, failed for so long to note the poetry which the Old Testament contains.<P>III. Characteristics of Hebrew Poetry: External and Internal.<P>The definition of poetry accepted in I, above, implies that there are marks by which poetry can be distinguished from prose. This is equally true of Hebrew poetry, though this last lacks some of the features of the poetry of western nations.<P>1. External or Formal Characteristics:<P>(1) Vocabulary.<P>There are several Hebrew words which occur most frequently and in some cases exclusively in poetry. In the following list the corresponding prose word is put in parenthesis: millah, "word" (= dabhar); enosh, "man" (=\' ish); orach, "way" (= derekh); chazah, "to see" (= ra\'ah); the prepositions ele, "to," adhe, "unto," ale, "upon," and minni, "from," instead of the shorter forms el, adh, al, and min. The pronoun zu, rare in prose, has in poetry the double function of a demonstrative and a relative pronoun in both genders. The negative bal, is used for lo\'. For the inseparable prepositions "b", "k", "l" ("in," "as," "to") the separate forms bemo, kemo and lemo are employed.<P>(2) Grammar.<P>(a) Accidence:<P>The pronominal suffixes have peculiar forms in poetry. For -m, -am, -em ("their," "them") we find the longer forms -mo, -amo, -emo. For the plural ending of nouns -n (-in) takes the place of -m (-im), as in Aramaic (compare <a onClick="return mV(\'Job\',4,2);">Job 4:2</a>; <a onClick="return mV(\'Job\',12,11);">12:11</a>), and frequently obsolete case endings are preserved, but their functions are wholly lost. Thus, we have the old nominative ending -o in <a onClick="return mV(\'Psa\',50,10);">Ps 50:10</a>, etc.; the old genitive ending -i in <a onClick="return mV(\'Isa\',1,21);">Isa 1:21</a>, and the accusative -ah in <a onClick="return mV(\'Psa\',3,3);">Ps 3:3</a>.<P>(b) Syntax:<P>The article, relative pronoun, accusative singular \'eth and also the "waw-consecutive" are frequently omitted for the sake of the rhythm. There are several examples of the last in <a onClick="return mV(\'Psa\',112,10);">Ps 112:10</a>ff. The construct state which by rule immediately precedes nouns has often a preposition after it. The jussive sometimes takes the place of the indicative, and the plural of nouns occurs for the singular.<P>(3) Rhythm.<P>Rhythm (from rhuthmos) in literary composition denotes that recurrence of accented and unaccented syllables in a regular order which we have in poetry and rhetorical prose. Man is a rhythmic animal; he breathes rhythmically, and his blood circulates—outward and inward—rhythmically. It may be due to these reflex rhythms that the more men are swayed by feeling and the less by reflection and reasoning, the greater is the tendency to do things rhythmically. Man walks and dances and sings and poetizes by the repetition of what corresponds to metrical feet: action is followed by reaction. We meet with a kind of rhythm in elevated and passionate prose, like that of John Ruskin and other writers. Preachers when mastered by their theme unconsciously express themselves in what may be called rhythmic sentences. Though, however, rhythm may be present in prose, it is only in poetry as in music that it recurs at intervals more or less the same. In iambic poetry we get a repetition of a short and long syllable, as in the following lines:<P class="in15">"With ravished ears<br>The monarch hears,<br>Assumes the gods,<br>Affects the nods."<p class="in30">—Dryden.<P>(4) Parallelism.<P>What is so called is a case of logical rhythm as distinguished from rhythm that is merely verbal. But as this forms so important a feature of Bible poetry, it must be somewhat fully discussed. What since Bishop Lowth\'s day has been called parallelism may be described as the recurring of symetrically constructed sentences, the several members of which usually correspond to one another. Lowth (died 1787), in his epochmaking work on Hebrew poetry (De Sacra poesi Hebraeorum prelectiones, English translation by G. Gregory), deals with what he (following Jebb) calls Parallelismus membrorum (chapter X). And this was the first serious attempt to expound the subject, though Rabbi Asariah (Middle Ages), Ibn Ezra (died 1167 AD), D. Kimchi (died 1232) and A. de Rossi (1514-1578) called attention to it. Christian Schoettgen (died 1751) (see Horae Hebraicae et Talmudicae) anticipated much of what Lowth has written as to the nature, function and value of parallelism. The first to use the word itself in the technical sense was Jebb (Sacred Lit., 1820). For the same thing Ewald used the expression Sinnrhythmus, i.e. sense rhythm, a not unsuitable designation.<P>(a) Kinds of Parallelism: Lowth distinguished three principal species of parallelism, which he called synonymous, antithetic and synthetic.<P>(i) The Synonymous:<P>In this the same thing is repeated in different words, e.g. <a onClick="return mV(\'Psa\',36,5);">Ps 36:5</a>:<P class="in15">\'Yahweh,<br> (i.) Thy lovingkindness (reaches) to the heavens,<br>(ii.) Thy faithfulness (reaches) to the clouds.\'<P>Omitting "Yahweh," which belongs alike to both members, it will be seen that the rest of the two half-lines corresponds word for word: "thy lovingkindness" corresponding to "thy faithfulness," and "to the heavens" answering to "to the clouds" (compare <a onClick="return mV(\'Psa\',15,1);">Ps 15:1</a>; <a onClick="return mV(\'Psa\',24,\'1-3\');">24:1-3</a>; <a onClick="return mV(\'Psa\',25,5);">25:5</a>; <a onClick="return mV(\'1Sa\',18,7);">1Sa 18:7</a>; <a onClick="return mV(\'Isa\',6,4);">Isa 6:4</a>; <a onClick="return mV(\'Isa\',13,7);">13:7</a>).<P>(ii) Antithetic Parallelism:<P>In which the second member of a line (or verse) gives the obverse side of the same thought, e.g. <a onClick="return mV(\'Pro\',10,1);">Pr 10:1</a>:<P class="in15">\'A wise son gladdens his father,<br>But a foolish son grieves his mother\'<P>(See <a onClick="return mV(\'Pro\',11,3);">Pr 11:3</a>; <a onClick="return mV(\'Psa\',37,9);">Ps 37:9</a>; compare <a onClick="return mV(\'Pro\',10,1);">Pr 10:1</a>ff; <a onClick="return mV(\'Psa\',20,8);">Ps 20:8</a>; <a onClick="return mV(\'Psa\',30,6);">30:6</a>; <a onClick="return mV(\'Isa\',54,7);">Isa 54:7</a>ff). Sometimes there are more than two corresponding elements in the two members of the verse, as in <a onClick="return mV(\'Pro\',29,27);">Pr 29:27</a>; compare <a onClick="return mV(\'Pro\',10,5);">10:5</a>; <a onClick="return mV(\'Pro\',16,9);">16:9</A>; <a onClick="return mV(\'Pro\',27,27);">27:2</A>.<P>(iii) Synthetic Parallelism:<P>Called also constructive and epithetic. In this the second member adds something fresh to the first, or else explains it, e.g. <a onClick="return mV(\'Psa\',19,8);">Ps 19:8</a> f:<P class="in15">\'The precepts of Yahweh are right, rejoicing the heart:<br>The commandments of Yahweh are pure, enlightening the eyes.<br>The fear of Yahweh is clean, enduring forever:<br>The judgments of Yahweh are true and righteous altogether.<br>More to be desired are they than gold, yea, than much fine gold;<br>Sweeter also than honey and the honeycomb\'<P>(See <a onClick="return mV(\'Pro\',1,7);">Pr 1:7</a>; compare <a onClick="return mV(\'Pro\',3,5,7);">3:5,7</A>; <a onClick="return mV(\'Psa\',1,3);">Ps 1:3</a>; <a onClick="return mV(\'Psa\',15,4);">15:4</a>). In addition to the three principal species of parallelism noticed above, other forms have been traced and described.<P>(iv) Introverted Parallelism:<P>(Jebb, Sacred Lit., 53): in which the hemistichs of the parallel members are chiastically arranged, as in the scheme ab ba. Thus, <a onClick="return mV(\'Pro\',23,15);">Pr 23:15</a> f:<P class="in15">(a) \'My son, if thy heart be wise<P class="in30">(b) My heart shall be glad, even mine:<P class="in30">(b) Yea, my reins shall rejoice<P class="in15">(a) When thy lips speak right things\'<P>(Compare <a onClick="return mV(\'Pro\',10,4,12);">Pr 10:4,12</a>; <a onClick="return mV(\'Pro\',13,24);">13:24</a>; <a onClick="return mV(\'Pro\',21,17);">21:17</a>; <a onClick="return mV(\'Psa\',51,3);">Ps 51:3</a>).<P>(v) Palilogical Parallelism:<P>In which one or more words of the first member are repeated as an echo, or as the canon in music, in the second. Thus, <a onClick="return mV(\'Nah\',1,2);">Na 1:2</a>:<P class="in15">\'Yahweh is a jealous God and avenges:<br>Yahweh avenges and is full of wrath;<br>Yahweh takes vengeance upon His adversaries,<br>And He reserves wrath for his enemies\'<P>(Compare <a onClick="return mV(\'Jdg\',5,3,6,11,15,23,27);">Jud 5:3, 6f; 11f; 15f; 23,27</a>; <a onClick="return mV(\'Psa\',72,2,12,17);">Ps 72:2,12,17</a>; <a onClick="return mV(\'Psa\',121,\'1-\');">121</a>; <a onClick="return mV(\'Psa\',124,\'1-\');">124</a>; <a onClick="return mV(\'Psa\',126,\'1-\');">126</a>; <a onClick="return mV(\'Isa\',2,7);">Isa 2:7</a>; <a onClick="return mV(\'Isa\',24,5);">24:5</a>; <a onClick="return mV(\'Hsa\',6,4);">Ho 6:4</a>).<P>(vi) Climactic or Comprehensive Parallelism:<P>In this the second line completes the first. Thus, <a onClick="return mV(\'Psa\',29,1);">Ps 29:1</a>:<P class="in15">"Give unto Yahweh, O ye mighty ones,<P class="in15">Give unto Yahweh glory and strength"<P>(see <a onClick="return mV(\'Exd\',15,6);">Ex 15:6</a>; <a onClick="return mV(\'Psa\',29,8);">Ps 29:8</a>).<P>(vii) Rhythmical Parallelism:<P>(De Wette, Franz Delitzsch): thus, <a onClick="return mV(\'Psa\',138,4);">Ps 138:4</a>:<P class="in15">"All the kings of the earth shall give thee thanks...<br>For they have heard the words of thy mouth."<P>See <a onClick="return mV(\'Pro\',15,3);">Pr 15:3</a>; compare <a onClick="return mV(\'Pro\',16,37,10;">16:7,10</A>; <a onClick="return mV(\'Pro\',17,13,15);">17:13,15</A>; <a onClick="return mV(\'Pro\',19,20);">19:20</A>; <a onClick="return mV(\'Pro\',21,23,25);">21:23,25</A>.<P>Perfect parallelism is that in which the number of words in each line is equal. When unequal, the parallelism is called imperfect. Ewald (see Die poetischen Bucher des alten Bundes, I, 57-92; Die Dichter des alten Bundes, I, 91ff, 2d edition of the former) aimed at giving a complete list of the relations which can be expressed by parallelism, and he thought he had succeeded. But in fact every kind of relation which can be indicated in words may be expressed in two or more lines more or less parallel. On the alleged parallelism of strophes see below.<P>(b) Parallelism as an Aid to Exegesis and Textual Criticism:<P>If in Lowth\'s words parallelism implies that "in two lines or members of the same period things for the most part shall answer to things, and words to words," we should expect obscure or unknown words to derive some light from words corresponding to them in parallel members or clauses. In not a few cases we are enabled by comparison of words to restore with considerable confidence an original reading now lost. The formula is in a general way as follows: ab: cx. We know what a, b and c mean, but are wholly in the dark as to the sense of x. The problem is to find out what x means. We have an illustration in <a onClick="return mV(\'Jdg\',5,28);">Jud 5:28</a>, which may be thus literally translated:<P class="in15">"Through the window she looked,<br>And Sisera\'s mother x through the x."<P>Here we have two unknown, each, however, corresponding to known terms. The Hebrew verb accompanying "Sisera\'s mother" is watteyabbebh, English Versions of the Bible "and...cried." But no such verb (yabhabh) is known, for the Talmud, as usually, follows the traditional interpretation. We want a verb with a meaning similar to "looked." If we read wattabbet, we have a form which could easily be corrupted into the word in the Massoretic Text, which gives a suitable sense and moreover has the support of the Targums of Onqelos and Jonathan, and even of the Septuagint (Codex Alexandrinus and Lucian). What about the other Hebrew word untranslated above (\'eshnabh)? This occurs in but one other passage (<a onClick="return mV(\'Pro\',7,6);">Pr 7:6</a>), where it stands as in the present passage in parallelism with challon, "window" (probably <a onClick="return mV(\'Pro\',7,6);">Pr 7:6</a> is dependent). We get no help from etymology or in this case from the VSS, but parallelism had suggested to our translators the meaning "lattice," a kind of eastern window, and something of the kind must be meant. The verb shanabh, "to be cool," may possibly suggest the rendering "window," i.e. a hole in the wall to secure coolness in the house. Glass windows did not exist in Palestine, and are rare even now. There are innumerable other examples in the Old Testament of the use of parallelism in elucidating words which occur but once, or which are otherwise difficult to understand, and frequently a textual emendation is suggested which is otherwise supported.<P>(c) Prevalence and Value of Parallelism:<P>Two statements anent [concerning] parallelism in the Old Testament may be safely made:<P>(i) That it is not a characteristic of all Old Testament poetry. Lowth who had so much to do with its discovery gave it naturally an exaggerated place in his scheme of Hebrew poetry, but it is lacking in the largest part of the poetry of the Old Testament, and it is frequently met with in elevated and rhetorical prose.<P>(ii) That it pervades other poetry than that of the Old Testament. It occurs in Assyria (see A. Jeremias, Die bab-assyr. Vorstellung vom Leben nach dem Tode), in Egypt (Georg Ebers, Nord u. Sud, I), in Finnish, German and English Indeed, A. Wuttke (Der deutsche Volks-Aberglaube der Gegenwart, 1869, 157) and Eduard Norden (Die antike Kunstprosa,1898,II, 813) maintain that parallelism is the most primitive form of the poetry of all nations. It must nevertheless be admitted that in the Old Testament parallelism has in proportion a larger place than in any other literature and that the correspondence of the parts of the stichs or verses is closer.<P>(5) Other Literary Devices.<P>Old Testament poetry has additional features which it shares with other oriental and with western poetry. Owing to a lack of space these can be hardly more than enumerated.<P>(a) Alliteration:<P>E.g. "Round and round the rugged rocks." We have good examples in the Hebrew of <a onClick="return mV(\'Psa\',6,8);">Ps 6:8</a> and <a onClick="return mV(\'Psa\',27,17);">27:17</a>.<P>(b) Assonance:<P>E.g. "dreamy seamy" (see for Bible examples the Hebrew of <a onClick="return mV(\'Gen\',49,17);">Ge 49:17</a>; <a onClick="return mV(\'Exd\',14,14);">Ex 14:14</a>; <a onClick="return mV(\'Deu\',3,2);">De 3:2</a>).<P>(c) Rhyme:<P>There are so few examples of this in the Hebrew Scriptures that no one can regard it as a feature in Hebrew poetry, though in Arabic and even in post-Biblical Hebrew poetry it plays a great part. We have Biblical instances in the Hebrew text of <a onClick="return mV(\'Gen\',4,23);">Ge 4:23</a>; <a onClick="return mV(\'Job\',10,\'8-11\');">Job 10:8-11</a>; <a onClick="return mV(\'Job\',16,12);">16:12</a>.<P>(d) Acrostics:<P>In some poems of the Old Testament half-verses, verses, or groups of verses begin with the successive letters of the Hebrew alphabet. We have such alphabetical acrostics in <a onClick="return mV(\'Psa\',9,\'1-\');">Psalms 9</a>f; <a onClick="return mV(\'Psa\',34,\'1-\');">34</a>; <a onClick="return mV(\'Psa\',37,\'1-\');">37</a>; <a onClick="return mV(\'Pro\',31,10);">Pr 31:10</a>ff; <a onClick="return mV(\'Lam\',1,\'1-\');">La 1-4</a>; compare <a onClick="return mV(\'Lam\',5,\'1-\');">La 5</a>, where the number of verses agrees with that of the Hebrew alphabet, though the letters of that alphabet do not introduce the verses.<P>(e) Meter:<P>The view of the present writer may be stated as follows: That the poetry of the Hebrew is not in the strict sense metrical, though the writers under the influence of strong emotion express themselves rhythmically, producing often the phenomena which came later to be codified under metrical rules. Thinking and reasoning and speaking preceded psychology, logic, and grammar, and similarly poetry preceded prosody. In the Old Testament we are in the region of the fact, not of the law. Poets wrote under strong impulse, usually religious, and without recognizing any objective standard, though all the time they were supplying data for the rules of prosody. Those who think that Old Testament poets had in their minds objective rules of meter have to make innumerable changes in the text. Instead of basing their theory on the original material, they bring their a priori theory and alter the text to suit it. It can be fearlessly said that there is not a single poem in the Old Testament with the same number of syllables, or feet, or accents in the several stichs or hemistichs, unless we introduce violent changes into the Massoretic Text, such as would be resented in classical and other ancient literature. It is important, before coming to any definite conclusion, to take into consideration the fact that the poetry of the Old Testament belongs to periods separated by many centuries, from the Song of Deborah (<a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>), the earliest Hebrew poem, down to the last hymns in the Psalter. In the oldest specimens of Hebrew poetry there is a naive simplicity which excludes the idea of conscious art. In the latest the poet is much more conscious, and his poetry more artistic. It would be manifestly unfair to propound a theory of poetry based on the poetry of Keats and Tennyson and to apply it to the productions of Anglo-Saxon and Old English poetry. Bound up in the one volume called the Bible there is a literature differing widely in age, aim and authorship, and it needs care in educing a conception of Hebrew poetry that will apply to all the examples in the Old Testament. The later psalm-acrostic, etc., many of them made up of bits of other psalms, seem to have sprung from a more conscious effort at imitation. If, however, there were among the ancient Hebrews, as there was among the ancient Greeks, a code of prosody, it is strange that the Mishna and Gemara\' should be wholly silent about it. And if some one system underlies our Hebrew Bible, it is strange that so many systems have been proposed. It should be remembered too that the oldest poetry of every people is nonmetrical.<P>The following is a brief statement of the views advocated:<P>(i) Philo and Josephus, under the influence of Greek models and desiring to show that Hebrew was not inferior to pagan literature, taught that Hebrew poetry had meter, but they make no attempt to show what kind of meter this poetry possesses.<P>(ii) Calmet, Lowth, and Carpzov held that though in the poetry of the Hebrew Bible as originally written and read there must have been metrical rules which the authors were conscious of following, yet, through the corruption of the text and our ignorance of the sounds and accentuation of primitive Hebrew, it is now impossible to ascertain what these metrical rules were.<P>(iii) In their scheme of Hebrew meter Bickell and Merx reckon syllables as is done in classical poetry, and they adopt the Syriac law of accentuation, placing the tone on the penultimate. These writers make drastic changes in the text in order to bolster up their theories.<P>(iv) The dominant and by far the least objectionable theory is that advocated by Ley, Briggs, Duhm, Buhl, Grimme, Sievers, Rothstein and most modern scholars, that in Hebrew prosody the accented syllables were alone counted. If this principle is applied to Job, it will be found that most of the Biblical verses are distichs having two stichs, each with three main accents. See, for an illustration, <a onClick="return mV(\'Job\',12,16);">Job 12:16</a>: (immo \'oz wethushiyah: lo shoghegh umashgeh\': \'Strength and effectual working belong to (literally, "are with") him, he that errs and he that causes to err\'). Man\'s rhythmical instincts are quite sufficient to account for this phenomenon without assuming that the poet had in mind an objective standard. Those who adopt this last view and apply it rigidly make numerous textual changes. For an examination of the metrical systems of Hubert Grimme, who takes account of quantity as well as accent, and of Eduard Sievers who, though no Hebrew scholar, came to the conclusion after examining small parts of the Hebrew Bible that Hebrew poetry is normally anapaestic, see W.H. Cobb, Criticism of Systems of Hebrew Metre, 152ff, 169ff. Herder, De Wette, Hupfeld, Keil, Nowack, Budde, Doller, and Toy reject all the systems of Hebrew meter hitherto proposed, though Budde has a leaning toward Ley\'s system.<P>(f) Budde\'s Qinah Measure:<P>Though Budde takes up in general a negative position in regard to Hebrew meter, he pleads strenuously for the existence of one specific meter with which his name is associated. This is what he calls the qinah measure (from qinah, "a lamentation"). In this each stich is said to consist of one hemistich with three beats or stress syllables and another having two such syllables, this being held to be the specific meter of the dirge (see <a onClick="return mV(\'Lam\',1,1);">La 1:1</a>, etc.). Ley and Briggs call it "pentameter" because it is made up of five (3 plus 2) feet (a foot in Hebrew prosody being equal to an accented syllable and the unaccented syllables combined with it). See Budde\'s full treatment of the subject in ZATW, 60,152, "Das heb. Klagelied." It must, however, be borne in mind that even Herder (died 1803) describes the use in elegies of what he calls, anticipating Ley and Briggs, the "pentameter" (see Geist der ebraischen Poesie,1782,I, 32f; English translation. The Spirit of Hebrew Poetry, 1833, I, 40). But the present writer submits the following criticisms: (i) Budde is inconsistent in rejecting all existing theories of meter and yet in retaining one of his own, which is really but part of the system advocated by Bellermann, Ley and Briggs. (ii) He says, following Herder, that it is the measure adopted by mourning women (<a onClick="return mV(\'Jer\',9,16);">Jer 9:16</a>), but we have extremely few examples of the latter, and his statement lacks proof. (iii) There are dirges in the Old Testament not expressed in the qinah measure. David\'s lament over Saul and Jonathan is more hexametric and tetrametric than pentametric, unless we proceed to make a new text (<a onClick="return mV(\'2Sa\',1,19);">2Sa 1:19</a>). (iv) The qinah measure is employed by Hebrew poets where theme is joyous or indifferent; see <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a>, which is a didactic poem.<P>(6) Units of Hebrew Poetry.<P>In western poetry the ultimate unit is usually the syllable, the foot (consisting of at least two syllables) coming next. Then we have the verse-line crowned by the stanza, and finally the poem.<P>According to theory of Hebrew poetry adopted by the present writer, the following are the units, beginning with the simplest:<P>(a) The Meter:<P>This embraces the accented (tone) syllable together with the unaccented syllable preceding or succeeding it. This may be called a "rhythmic foot."<P>(b) The Stich or Verse:<P>In Job and less regularly in Psalms and Canticles and in other parts of the Old Testament (<a onClick="return mV(\'Num\',23,\'19-24\');">Nu 23:19-24</a>) the stich or verse consists commonly of three toned syllables and therefore three meters (see above for sense of "meter"). It is important\' to distinguish between this poetical sense of "verse" and the ordinary meaning—the subdivision of a Bible chapter. The stich in this sense appears in a separate line in some old manuscripts.<P>(c) Combinations of Stichs (Verses):<P>In Hebrew poetry a stich hardly ever stands alone. We have practically always a distich (couplet, <a onClick="return mV(\'Job\',18,5);">Job 18:5</a>), a tristich (triplet, <a onClick="return mV(\'Num\',6,\'24-26\');">Nu 6:24-26</a>), a tetrastich (<a onClick="return mV(\'Gen\',24,23);">Ge 24:23</a>), or the pentastich.<P>(d) Strophe:<P>Kosters (Stud. Krit.,1831,40-114, "Die Strophen," etc.) maintained that all poems in the Hebrew Scriptures are naturally divisible into strophes (stanzas) of similar, if not equal, length. Thus <a onClick="return mV(\'Psa\',119,\'1-\');">Ps 119</a> is arranged in strophes named after the letters of the Hebrew alphabet, each one containing eight Scripture verses, or sixteen metrical verses or stichs, most of the stichs having three meters or rhythmical feet. But though several Biblical poems are composed in strophes, many are not.<P>(e) Song:<P>This (shirah) is made up of a series of verses and in some cases of strophes.<P>(f) Poem:<P>We have examples of this (shir) in the Books of Job and Canticles which consist of a combination of the song.<P>(7) Classification of Stichs or Verses.<P>Stichs may be arranged as follows, according to the number of meters (or feet) which they contain:<P>(a) the trimeter or tripod with three meters or feet; Bickell holds that in Job this measure is alone used;<P>(b) the tetrameter or tetrapod, a stich with four meters or feet;<P>(c) the pentameter or pentapod, which has five meters or feet: this is Budde\'s qinah measure (see III, 1, (4));<P>(d) the hexameter or hexapod: this consists of six meters or feet, and is often hard to distinguish from two separate trimeters (or tripods).<P>2. Internal or Material Characteristics:<P>Our first and most original authority on the internal characteristics of Hebrew poetry is that great German theologian and man of letters, J.G. Herder, the pastor and friend of Goethe and Schiller at Weimar. In his Vom Geist der ebraischen Poesie, 1782 (The Spirit of Poetry, translated by James Marsh, U.S.A., 1833), he discusses at length and with great freshness those internal aspects of the poetry of the Old Testament (love of Nature, folklore, etc.) which impressed him as a literary man. Reference may be made also to George Gilfillian\'s Bards of the Bible, 1851 (popular), and Isaac Taylor\'s Spirit of Hebrew Poetry. It is a strange but striking and significant coincidence that not one of these writers professed much if any knowledge of the Hebrew language. They studied the poetry of the Old Testament mainly at least in translations, and were not therefore diverted from the literary and logical aspects of what is written by the minutiae of Hebrew grammar and textual criticism, though only a Hebrew scholar is able to enter into full possession of the rich treasures of Hebrew poetry.<P>(1) Themes of Hebrew Poetry.<P>It is commonly said that the poetry of the ancient Hebrews is wholly religious. But this statement is not strictly correct.<P>(a) The Old Testament does not contain all the poetry composed or even written by the Hebrews in Bible times, but only such as the priests at the various sanctuaries preserved. We do not know of a literary caste among the Hebrews who concerned themselves with the preservation of the literature as such.<P>(b) Within the Bible Canon itself there are numerous poems or snatches of poems reflecting the everyday life of the people.<P>We have love songs (Canticles), a wedding song (<a onClick="return mV(\'Psa\',45,\'1-\');">Ps 45</a>), a harvest song (<a onClick="return mV(\'Psa\',65,\'1-\');">Ps 65</a>), parts of ditties sung upon discovering a new well (<a onClick="return mV(\'Num\',21,17);">Nu 21:17</a>f), upon drinking wine, and there are references to war songs (<a onClick="return mV(\'Num\',21,14);">Nu 21:14</a>; <a onClick="return mV(\'Jos\',10,13);">Jos 10:13</a>; <a onClick="return mV(\'2Sa\',1,18);">2Sa 1:18</a>).<P>(2) Species of Hebrew Poetry.<P>Biblical poetry may be subsumed under the following heads: (a) folklore, (b) prophetical, (c) speculative, (d) lyrical.<P>(a) Folklore:<P>"Poetry," said J. G. Hamann (died 1788), "is the mother tongue of the human race." In both folk-music and folk-poetry, each the oldest of its class, the inspiration is immediate and spontaneous. We have examples of folk-songs in <a onClick="return mV(\'Gen\',11,\'1-9\');">Ge 11:1-9</a>; <a onClick="return mV(\'Gen\',19,24);">19:24</a> f.<P>(b) Prophetic Poetry:<P>This poetry is the expression of the inspiration under which the seer wrote. One may compare the oracular utterances of diviners which are invariably poetical in form as well as in matter. But one has to bear in mind that the heathen diviner claimed to have his messages from jinns or other spirits, and the means he employed were as a rule omens of various kinds. The Old Testament prophet professed to speak as he was immediately inspired by God (see <a href="./study/isbe/search.html?string=DIVINATION">DIVINATION, VIII</a>). Duhm thinks that the genuine prophecies of Jeremiah are wholly poetical, the prose parts being interpolations. But the prophet is not merely or primarily a poet, though it cannot be doubted that a very large proportion of the prophecies of the Old Testament are poetical in form and substance.<P>(c) Philosophical Poetry:<P>This expression is intended to include such poetry as is found in the Wisdom literature of the Old Testament and the Apocrypha (see <a href="./study/isbe/search.html?string=WISDOM+LITERATURE">WISDOM LITERATURE</a>). The so-called didactic poetry, that of the proverbs or parables (mashal), also comes in here.<P>(d) Lyrical Poetry:<P>This includes the hymns of the Psalter, the love songs of Canticles and the many other lyrics found in the historical and prophetical writings. In these lyrics all the emotions of the human soul are expressed.<P>Does the Old Testament contain specimens of epic and dramatic poetry? The answer must depend on which definition of both is adopted.<P>(a) Epic Poetry:<P>The present writer would define an epic poem as a novel with its plot and development charged, however, with the passion and set out in the rhythmic form of poetry. There is no part of the Old Testament which meets the requirements of this definition, certainly not the Creation, Fall and Deluge stories, which De Wette (Beitrage, 228ff, Einleitung, 147) and R.G. Moulton (Literary Study of the Bible, chapter ix) point to as true epics, and which Ewald (Dichter des alten Bundes, I, 87ff) held rightly to have in them the stuff of epics, though not the form.<P>(b) Dramatic Poetry:<P>Defining dramatic poetry as that which can be acted on a stage, one may with confidence say that there is no example of this in the Old Testament. Even the literary drama must have the general characteristics of that which is actable. Franz Delitzsch and other writers have pointed to Job and Canticles as dramatic poems, but the definition adopted above excludes both.<P>IV. Poetical Writings of the Old Testament.<P>1. The Poetical Books in the Narrow Sense:<P>According to the Massoretes or editors of our present Hebrew Bible, there are but three poetical books in the Old Testament, Job, Proverbs, and Psalms, known in Jewish circles by the mnemonic abbreviation \'emeth, the three consonants forming the initial letters of the Hebrew names of the above books. These three books have been supplied by the Massoretes with a special system of accents known as the poetical accents, and involving a method of intoning in the synagogue different from that followed when the prose books are read. But these accentual marks cannot be traced farther back than the 7th or 8th century of our era.<P>2. Customary Division of the Poetical Books:<P>It is customary to divide the poetical books of the Old Testament into two classes, each containing three books:<P>(1) those containing lyrical poetry (shir, or shirah), i.e. Psalms, Canticles, Lamentations;<P>(2) those containing for the most part didactic poetry (mashal), i.e. Job, Proverbs, Ecclesiastes.<P>3. Poetry in Non-poetical Books:<P>There is a large amount of poetry in the Old Testament outside the books usually classed as poetical:<P>(a) poetry in the prophetical books (see above, III, 2);<P>(b) poetry in the historical books including the Pentateuch (see Michael Heilprin, The Historical Poetry of the Hebrews, 2 volumes, 1879-80).<P>We have examples in <a onClick="return mV(\'Gen\',4,23,49);">Ge 4:23f; 49</a>; <a onClick="return mV(\'Exd\',15,\'1-\');">Ex 15</a>; <a onClick="return mV(\'Num\',21,14,\'27-30\');">Nu 21:14f; 27-30</a> (JE); <a onClick="return mV(\'Num\',23,\'1-\');">Nu 23</a>f (Balaam\'s songs); <a onClick="return mV(\'Deu\',32,\'1-\');">De 32</a>f (song and blessing of Moses); <a onClick="return mV(\'Jos\',10,\'12-14\');">Jos 10:12-14</a> (JE); <a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a> (Deborah\'s Song); <a onClick="return mV(\'Jdg\',9,\'8-15\');">9:8-15</a>; <a onClick="return mV(\'1Sa\',2,\'1-10\');">1Sa 2:1-10</a>; <a onClick="return mV(\'2Sa\',1,1);">2Sa 1</a>; <a onClick="return mV(\'2Sa\',3,33);">3:33</a>f; <a onClick="return mV(\'2Sa\',23,\'1-\');">2Sa 23</a> (= <a onClick="return mV(\'Psa\',18,\'1-\');">Ps 18</a>), etc.<P>LITERATURE.<P>The most important books and articles on the subject have been mentioned during the course of the foregoing article. There is a full list of works dealing with Hebrew meter in W.H. Cobb, Criticism o.f Systems of Hebrew Metre, 19ff. The first edition of Ewald\'s still valuable "Essay on Hebrew Poetry" prefixed to his commentary on the Psalms was published in English in the Journal of Sacred Literature (1848), 74ff, 295ff. In 1909 J.W. Rothstein issued a suggestive treatise on Hebrew rhythm (Grundzuge des heb. Rhythmus...nebst lyrischen Texten mit kritischem Kommentar, 8vo plus vi plus 398), reviewed by the present writer in Review of Theology and Philosophy (Edinburgh), October, 1911. Early Religious Poetry of the Hebrews by E.G. King (Cambridge University Press) contains a good, brief, popular statement of the subject, though it makes no pretense to originality. In The Poets of the Old Testament,1912,Professor A.R. Gordon gives an excellent popular account of the poetry and poetical literature of the Old Testament.``33';
isbe[7012]='Poetry, New Testament`No one questions the presence of poetry of a high order in the Old Testament. The Study of the Old Testament as the literature of the ancient Hebrews has been critically made, and the attention of even the ordinary reader of the Scriptures called to the beauty and wealth of its poetic passages. The message of the New Testament is so vitally spiritual and concerned with religion that but little attention has been paid to it as literature. Naturally it would be strange if the poetic inspiration which runs like a tide through the prophetic and post-exilic periods of the Old Testament should altogether cease under the clearer spiritual dispensation of the New Testament. The fact is that it does not cease, but that under every fundamental rule for poetic utterance, save that of rhyme, the New Testament is seen to be rich in imaginative vision, in religion touched by emotion, and in poetic expression. The Gospels, the Pauline Epistles, and the Epistle of James, all afford examples of lofty poetic utterance, while the message of Jesus is saturated with words which readily lend themselves to song. In fact it is thought by some that Jesus was no less careful of the form than of the content of His message, and that all the finer types of Hebrew poetry found in the Old Testament can be matched from His sayings, even when tested by the same rules.<P>In the Gospels that of Luke gives us our best examples of poetry. "No sooner have we passed through the vestibule of his Gospel than we find ourselves within a circle of harmonies" (Burton, in the Expositor\'s Bible). From the poetic utterances of Mary, Elisabeth, Zacharias, Simeon, and the Angels, the church gains her Magnificat, Beatitude, Benedictus, Nunc Dimittis and Glorias.<P>The utterances of John the Baptist are filled with a rugged desert vision and an expression which reveals a form of poesy in no wise to be mistaken for prose.<P>Paul presents many of his ideas in harmonious and beautiful forms. He knew the secular poets of his day, and has immortalized Cleanthes\' Hymn to Zeus (<a onClick="return mV(\'Act\',17,28);">Ac 17:28</a>). He also quotes from Epimenides and the Athenian dramatist Menander (<a onClick="return mV(\'1Cr\',15,33);">1Co 15:33</a>). Paul knew the poetry of the Hebrews, and enriches his own message with many quotations from it. He was acquainted with the Christian hymnology of his own times, as is seen in <a onClick="return mV(\'Eph\',5,14);">Eph 5:14</a> and <a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>. He offers also original flashes of poetic inspiration and utterance, a good example of which is found in <a onClick="return mV(\'Rom\',8,\'31-37\');">Ro 8:31-37</a>.<P>Who could doubt the poetic imagery of James? He might almost be called the poet of social justice and of patient waiting under affliction for the will of God to come to men.<P>When one comes to the words of Jesus he discovers that in a very true sense His speech answers to the requirements for Hebrew poetry. Examples of synonymous, antithetic, synthetic and causal parallelism are the rule rather than the exception in the utterances of Jesus. For the synonymous form see <a onClick="return mV(\'Mat\',10,24);">Mt 10:24</a>; for the antithetic see <a onClick="return mV(\'Luk\',6,41);">Lu 6:41</a>; for the synthetic and causal forms see <a onClick="return mV(\'Luk\',9,23);">Lu 9:23</a> and <a onClick="return mV(\'Mat\',6,7);">Mt 6:7</a>. Not alone are these forms of Hebrew poetry found in the words of Jesus, but also the more involved and sustained poetic utterances (<a onClick="return mV(\'Luk\',7,\'31-32\');">Lu 7:31-32</a>).<P>No one can question the deep emotional quality, the vivid imagination and spiritual idealism of Jesus. That the form of His speech is adequately set to poetic inspiration and conforms to the laws for Hebrew poetry has not been so freely acknowledged. Independently of theory advanced in Did Jesus Write His Own Gospel? (William Pitt MacVey), every student of the literature of the New Testament must be grateful for the chapter on "The Poems of Jesus."<P>Spirituality and poetry have a kinship, and the interpretation of any message is aided by the adequate knowledge of its form. When the New Testament has thus been carefully studied as literature, it will be seen, not only that Jesus was a poet, but that the entire New Testament, if not as rich as the Old Testament in poetic passages, is sufficiently poetic to receive treatment as such in religious encyclopedias.`<a href="./study/isbe/search.html?string=FAITHFUL+SAYINGS">FAITHFUL SAYINGS</a>; <a href="./study/isbe/search.html?string=POETRY,+HEBREW">POETRY, HEBREW</a>`158';
isbe[7013]='Points`points: The word occurs in <a onClick="return mV(\'Ecc\',5,16);">Ec 5:16</a>, "In all points (\'ummah) as he came, so shall he go"—a man leaves the world in all regards as helpless as he entered it, no matter what he may have gained or accomplished during his life.<P>Also in <a onClick="return mV(\'Hbr\',4,15);">Heb 4:15</a>, "In all points (kata panta, "in all things," as in His human nature (<a onClick="return mV(\'Hbr\',2,14);">Heb 2:14</a>), so in His human experience (compare <a onClick="return mV(\'Hbr\',2,17,18);">Heb 2:17,18</a>)) tempted like as we are, yet without sin." He successfully resisted temptation at all points of His nature, in body, soul, and spirit. See <a href="./study/isbe/search.html?string=TEMPTATION+OF+CHRIST">TEMPTATION OF CHRIST</a>. Westcott (in loc.) thinks that the reference is not so much to Christ issuing out of all His trials without the least stain of sin, as to "a limitation of His temptation. Man\'s temptations come in many cases from previous sin. Such temptations had necessarily no place in Christ. He was tempted as we are, sharing our nature, yet with this exception, that there was no sin in Him to become the spring of trial." Whichever interpretation is adopted there is profound insight into the things of the soul in joining sinlessness with fullness of experience of temptation.``91';
isbe[7014]='Poison`poi\'-z\'-n (chemah, ro\'-sh; thumos, ios): Residents in Palestine must, from the first, have been acquainted with venomous serpents. Six species of these are widely diffused in the land, and at least three of them are fairly common in places. Besides, there are scorpions, centipedes and the large spider, which are as much dreaded by the fellahin as are the serpents, not to speak of the minor but very serious discomforts of mosquitoes, sandflies and ticks, some of which were credited with lethal powers. In <span class="noTag">The Wisdom of Solomon 16:9</span> the Revised Version (British and American) we read that "the bites of locusts and flies did slay, and there was not found a healing for their life." There are also many poisonous plants, such as belladonna, henbane, thorn apple, and the opium poppy. None of these is mentioned in the Bible; the only names found there are the hemlock (Conium maculatum) of <a onClick="return mV(\'Hsa\',10,4);">Ho 10:4</a>, the poisonous gourd (Citrullus colocynthis) of <a onClick="return mV(\'2Ki\',4,39);">2Ki 4:39</a>, and the grapes of gall, probably the fruit of Calotropis procera, the apples of Sodom of Josephus (BJ, IV, viii, 4). Some, however, believe that these are poppyheads. Poisonous waters are referred to at Marah (<a onClick="return mV(\'Exd\',15,23);">Ex 15:23</a>) and Jericho (<a onClick="return mV(\'2Ki\',2,19);">2Ki 2:19</a>). There are no direct records of any person dying of poison except in 2Macc 10:13, where the suicide of Ptolemy Macron is related. our Lord\'s promise in the appendix to <a onClick="return mV(\'Mar\',16,18);">Mr 16:18</a> shows, however, that poisons were known and might be administered by way of ordeal, as was the unknown "water of jealousy" (<a onClick="return mV(\'Num\',5,17);">Nu 5:17</a>). In this connection the story in Eusebius (Historia Ecclesiastica, III, 39) is interesting, that "Justus surnamed Barsabbas, though he drank a deadly poison, suffered no injury, through the grace of the Lord." The passages in which poisonous serpents are mentioned are <a onClick="return mV(\'Deu\',32,24);">De 32:24</a>, where serpents (the Revised Version (British and American) "crawling things") of the dust, probably Cerastes hasselquistii, the little horned vipers, are mentioned, and in <a onClick="return mV(\'Deu\',32,33);">De 32:33</a>: "poison of serpents, and the cruel venom of asps." The asp may be the cobra Naia haje, not uncommon on the borders of the wilderness to the south. <a onClick="return mV(\'Psa\',58,4);">Ps 58:4</a> mentions the poison of serpents. <a onClick="return mV(\'Psa\',140,3);">Ps 140:3</a>, "They have sharpened their tongue like a serpent; adders\' poison is under their lips," indicates, what is still a common belief, that the forked tongue of the snake is the poison-bearer. This is referred to in <a onClick="return mV(\'Jam\',3,8);">Jas 3:8</a>. That it was the fang and not the tongue which carried the poison was known to Pliny (xi.62). This verse of <a onClick="return mV(\'Psa\',140,\'1-\');">Ps 140</a> is given in Paul\'s composite quotation in <a onClick="return mV(\'Rom\',3,13);">Ro 3:13</a>. There may be a reference to the giving of an intoxicant poison in <a onClick="return mV(\'Hab\',2,15);">Hab 2:15</a>, where the Revised Version (British and American) reads "that addest thy venom." The prophets speak in several places of God\'s wrath as a cup of trembling (the Revised Version (British and American) "staggering"), e.g. <a onClick="return mV(\'Isa\',51,17,22);">Isa 51:17,22</a>, probably suggested by the fact that chemah primarily means "fury" and is used in that sense in more than a hundred passages. In <a onClick="return mV(\'Zec\',12,2);">Zec 12:2</a> Jerusalem is to be such a "cup of reeling unto all the peoples round about."<P>The semamith, "lizard" (the King James Version "spider"), mentioned in <a onClick="return mV(\'Pro\',30,28);">Pr 30:28</a> Septuagint kalabotes) was formerly regarded as poisonous and it is still much disliked by the fellahin, as they believe that it makes mocking gestures mimicking them at their prayers. They are really not poisonous. It is doubtful whether the lizard mentioned by Agur is really this stellion; the description better fits the gecko.``107';
isbe[7015]='Pole`pol: <a onClick="return mV(\'Num\',21,8,9);">Nu 21:8,9</a> the King James Version for nes, Revised Version "standard."``1';
isbe[7016]='Policy`pol\'-i-si: Literally "method of government," and so "ability to manage affairs." In a bad sense, "cunning," "craft," in <a onClick="return mV(\'Dan\',8,25);">Da 8:25</a> (sekhel, "understanding"); in a good sense in 1Macc 8:4 (boule, "counsel"); also in the King James Version 2Macc 13:18; 14:29,31 (methodos, strategema, strategeo), where the Revised Version has "stratagem." Policies occurs in Judith 11:8 the King James Version for panourgema, lit. "readiness for anything," here in a good sense; Revised Version "subtil devices."``1';
isbe[7017]='Polished`pol\'-isht.`<a href="./study/isbe/search.html?string=CORNER+STONE">CORNER-STONE</a>`1';
isbe[7018]='Poll`pol: The word (on the derivation of which see Skeat, Concise Etymological Dictionary of the English Language, 360) has been eliminated as a verb in the American Standard Revised Version. In the King James Version and English Revised Version it represents the Hebrew verbs kacam, literally "to shear" (<a onClick="return mV(\'Eze\',44,20);">Eze 44:20</a>), gazaz, literally, "to pull out," "to uproot," thence "to shear the sheep," figuratively, "to destroy an enemy" (<a onClick="return mV(\'Mic\',1,16);">Mic 1:16</a>), galach, in Piel, literally, "to make bald or roundheaded" (<a onClick="return mV(\'2Sa\',14,26);">2Sa 14:26</a>) and qatsats, "to cut off" (<a onClick="return mV(\'Jer\',9,26);">Jer 9:26</a>; <a onClick="return mV(\'Jer\',25,23);">25:23</a>; <a onClick="return mV(\'Jer\',49,32);">49:32</a>). The Hebrew noun is gulgoleth. As will be seen from the above enumeration, the Hebrew verb differ considerably in etymology, while Revised Version has not tried to distinguish. In <a onClick="return mV(\'Mic\',1,16);">Mic 1:16</a> we have a reference to the oriental custom of cutting or tearing one\'s hair as a sign of mourning for one\'s relatives. "Make thee bald, and cut off thy hair (King James Version and English Revised Version "poll thee," Hebrew gazaz) for the children of thy delight: enlarge thy baldness as the eagle (margin "vulture"); for they are gone into captivity from thee." The priests, the sons of Zadok, are instructed to abstain from outward resemblance to heathen patterns of priesthood: "Neither shall they shave their heads, nor suffer their locks to grow long; they shall only cut off the hair (the King James Version and the English Revised Version, "poll," Hebrew kacam) of their heads" (<a onClick="return mV(\'Eze\',44,20);">Eze 44:20</a>). The Piel form of galach is employed in the description of the annual hair-cutting of Absalom (<a onClick="return mV(\'2Sa\',14,26);">2Sa 14:26</a>). Thrice we find the verb "to poll" as the translation of Hebrew qatsats, where the American Standard Revised Version materially improves the translation by adopting the marginal version of the King James Version (<a onClick="return mV(\'Jer\',9,26);">Jer 9:26</a>; <a onClick="return mV(\'Jer\',25,23);">25:23</a>; <a onClick="return mV(\'Jer\',49,32);">49:32</a>).<P>The noun (gulgoleth, lit. "head") is translated "poll" in the phrase "by the poll," "by their polls" (<a onClick="return mV(\'Num\',1,2,18,20,22);">Nu 1:2,18,20,22</a>; <a onClick="return mV(\'Num\',3,47);">3:47</a>; <a onClick="return mV(\'1Ch\',23,3,14);">1Ch 23:3,14</a>). The expression has its origin in the numbering of persons by their heads, in the same way in which we speak of head-tax, etc.`<a href="./study/isbe/search.html?string=HAIR">HAIR</a>`106';
isbe[7019]='Pollution`po-lu\'-shun (ga\'al, "to pollute"; alisgema, "contamination"): In <a onClick="return mV(\'Mal\',1,7);">Mal 1:7</a>, "Ye offer polluted bread," i.e. not actually unclean, but worthless, common (compare <a onClick="return mV(\'Ezr\',2,62);">Ezr 2:62</a>), bread here being used metonymically for sacrificial offerings generally (compare <a onClick="return mV(\'Lev\',21,6);">Le 21:6</a>; <a onClick="return mV(\'Mat\',6,11);">Mt 6:11</a>). The phrase in <a onClick="return mV(\'Act\',15,20);">Ac 15:20</a>, "the pollutions of idols," is explained in <a onClick="return mV(\'Act\',15,29);">15:29</A> by "things sacrificed (the King James Version "meats offered") to idols."``1';
