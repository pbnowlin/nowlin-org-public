isbe[7021]='Polygamy`po-lig\'-a-mi:<P>1. Meaning of the Term<P>2. Origin of Polygamy<P>3. The Old Testament and Polygamy<P>4. Polygamy Unnatural<P class="in15">The Eunuch<P>5. Weakness of Polygamy<hr /><P>1. Meaning of the Term:<P>Polygamy has been and is the open blazon by the human race of sex vice. The very term is a misnomer. Since man became moralized he has apprehended that the proper marriage relation between the sexes is monogamy. Whatever may have been the practice, since man could ask himself, What is right? he has known that ap\' arches ("from the beginning," <a onClick="return mV(\'Mat\',19,4);">Mt 19:4</a>), au fond, at bottom, marriage is the choice of one man and one woman of each other for a life family relation. La Rochefoucauld said: "Hypocrisy is a sort of homage which vice pays to virtue." There is hypocrisy beneath the word polygamy. It is an attempt to cover up by the term "plural marriage" what is not marriage and cannot be marriage. There is no particular need of defining what the condition is, so long as we can look upon it as a violation and negation of the marriage relation. The very use of the term from any language covering a like condition is attempt—<P clas="in15">"To steal the livery of the court of heaven<br>To serve the Devil in."<P>Polygamy is a general term and might mean a multiplicity of partners in the family relation by one of either sex. But it does not. Polygamy practically means exactly "polygyny" (gune), i.e. it describes a many-wived man. The correlative term "polyandry" describes the condition of a woman who has many men in family relation with herself. They are all husbands to her, as in polygamy all the women are wives to one man. But polyandry in historic times has had so little illustration that it may be dismissed as so exceptional as to be worthy of no further notice here.<P>Why polygamy has captured the whole position philologically covered by polygyny is readily apparent. The might of the physically strongest has dictated the situation. Man has on the average one-fourth more muscular force than woman. When it comes to wrong in sex relation, man has that advantage, and it has given him the field covered by the word "polygamy." There he is master and woman is the victim.<P>2. Origin of Polygamy:<P>It is plainly evident that polygamy is primarily largely the outcome of tribal wars. When men had separated into clans and had taken up different places of abode, collisions would soon occur between them. What would happen in such cases would be what we know did happen in North America soon after its first settlement by Europeans, to wit, the destruction of the Hurons by the Iroquois. The great majority of the men were massacred; the women and children, driven to the abode of the conquerors, disappearing there mainly in concubinage and slavery. What shall be done with this surplus of women? Here again the might of the strongest comes to the front. The chief or the most heroic fighter would assert his right to choice of captives, and thus concubinage or what is the same thing—polygamy—would be set up. Successes in further wars come and add other women to be distributed. Of course to the sheik or king there soon comes the seraglio and the harem. Polygamous practices will come in in other ways. The prisoner of war becomes property and passes from hand to hand by gift or sale. So woman—the weaker party—endures what comes to her as slave, concubine. We have now no longer the "helpmeet" originally destined for man—"bone of my bones and flesh of my flesh"—for whom he would "leave his father and his mother" and to whose single self he would "cleave" for life (<a onClick="return mV(\'Gen\',2,18,24);">Ge 2:18,24</a>; <a onClick="return mV(\'Mat\',19,5,6);">Mt 19:5,6</a>). Monogamy, with its unity in labor, thought and feeling, with its immeasurable modifying influences of moral, ideal and spiritual cast, is gone. Woman is reduced to the position of ministrant to man\'s unmodified sensuality.<P>3. The Old Testament and Polygamy:<P>The complications introduced into morals by polygamy are not often considered. But the Bible sets them forth in plainness. The marriage of Abraham and Sarah seems to have been an original love match, and even to have preserved something of that character through life. Still we find Sarah under the influence of polygamous ideas, presenting Abraham with a concubine. Yet afterward, when she herself had a son, she induced Abraham to drive out into the wilderness this concubine and her son. Now Abraham was humane and kind, and it is said "The thing was very grievous in Abraham\'s sight" (<a onClick="return mV(\'Gen\',21,11);">Ge 21:11</a>). But he was in the toils of polygamy, and it brought him pain and retribution. A Divine direction may be hard to bear.<P>The conditions of Jacob\'s marriages were such that it is hard to say whether any of his children were of any other than of polygamous origin (<a onClick="return mV(\'Gen\',35,\'22-26\');">Ge 35:22-26</a>). Where the family idea and affection went, in such mixed condition, is evidenced by the unblushing sale, for slavery in Egypt, of one of the brothers by the others (<a onClick="return mV(\'Gen\',37,28);">Ge 37:28</a>).<P>David was a singer of sweet and noble songs and wanted to be a righteous man with his whole heart. Yet, probably in common with all the military leaders and kings of the earth of his day, he had a polygamous career. His retributions ran along an extended line. There was a case of incest and murder among his children (<a onClick="return mV(\'2Sa\',13,\'1-\');">2Sa 13</a>). The son in whom he had most hope and pride organized treason against his throne, and lost his life in the attempt. David left his kingdom to Solomon, of whom much might be said, but of whom this can be said—evidently originally a man bright, keen-witted, wise, yet in his old age he went to pieces by the wiles of the women with whom he had loaded his harem. Partly by his extravagance in his polygamous life, and partly in attempt to build temples in distant places for the religions represented by the inmates of his harem, he bankrupted his nation. As a consequence his kingdom was divided at his death, and there was never again a united Israel (<a onClick="return mV(\'1Ki\',11,12);">1Ki 11:12</a>). Polygamy may be justly charged with these untoward results.<P>4. Polygamy Unnatural:<P>It can be demonstrated scientifically, even mathematically, that polygamy is a moral wrong. Statistics show that births are substantially equally divided between the sexes. Excess seems slightly on the side of males. When this fact is considered and also the fact of the wide prevalence of polygamy, it would seem that polygamy (polygyny) is a greater crime against Nature than polyandry. To put out of view for a moment the wrong to woman in denying to her the rights and privileges of monogamous marriage, the interference with the rights of man to such marriage looms up in vast proportion. Every harem is the denial to men of the right to seek among its inmates wives according to the dictates of their own hearts.<P>The Eunuch.<P>But we are not done with the crime against man. Given a harem, and he who set it up has made, or there brought, the eunuch. The lord of the harem must be served by emasculated men. A search in history will reveal an amount of this wickedness that is past belief. The eunuch has been everywhere among all nations and peoples and tongues. They have not only been servitors to women in harems, but they have acquired such influence with their masters that they have sometimes even dictated the policy of government. They have been the secret cabinet that has had the last word in public affairs. They have sometimes held public positions and shown therein astonishing ability. Witness Narses, the brilliant general of the emperor Justinian.<P>See <a href="./study/isbe/search.html?string=EUNUCH">EUNUCH</a>.<P>5. Weakness of Polygamy:<P>Gibbon noticed the fact that nations began to decline in power when their policies were dictated and managed by eunuchs. But that is taking a symptom for the disease. There are weaknesses behind that weakness. We have found woman in muscular strength equal to three-fourths of a man. If we claim nothing more for woman than that ratio through the whole scale of her potencies, what would be thought of a nation that should try to reduce that three-fourths of potency as nearly to zero as it could? This is what polygamy has done—reduced woman as nearly to a cipher as it could in all the departments of her being. She has been held to the lowest and most primitive industrial pursuits. She has been deprived of intellectual development. She has been debarred from society, permitted to look at it only through a home lattice, or, if abroad, through a swathod face. The harem of sheik or sultan has fixed the condition of woman in province or nation—set the bounds to her life. The highest office assigned her has been breeder of children, and for one-half of them—the daughters—she could have no possible hope or ambition.<P>See <a href="./study/isbe/search.html?string=WOMAN">WOMAN</a>.<P>Where in such degradation is the "helpmeet" for man in all his problems? This condition is reflected back over man. What possible appeal can there be to him for thought and energy except to repeat the same dull round exhibited in his daily life? Polygamous nations have never been industrial inventors, have contributed little to science. They have usually ruined the fertility of the lands they have occupied. They have been heavily weighted with the lethargy of a system that appeals to nothing but the most primitive instincts and vices of man.<P>The monogamous have been the forceful nations. Rome conquered the world while she was monogamous, and lost control of it when she dropped to the moral level of the sex corruption of the peoples that she had conquered. The Teuton trundled into and over Europe in ox-carts mounted on solid wood trucks. But his cart carried one wife, and now all polygamy is held under the trained guns of the Tenton.<P>There may seem to be two exceptions—the establishment of the Mogul empire in India and the subjugation of Western Asia and Eastern Europe by the Turk. That in both cases there was great success in war is granted. They were authorized by their religion to exhibit the frenzy of bloodshed and indulge in lust. Indeed, enjoyment of the latter was a bright hope for the life to come. But when they had possession of a country, and massacres and ravishing were over, what then? For what is mankind indebted to them?<P>A Lyric.<P>A lyric has been put in the hand of the present writer by a friend who wrote it at the last date of the title. It is one of the lyrics of the centuries in its synthesis of history and in its insight into the forces physical, moral and immoral at work in the Mogul empire of India. Notice the dates. The text will show what took place between.<P>THE MOGUL 1525-1857<P class="in15">A war steed coursed out the wind-swept north,<br>Jarring the crags with hoofs of fire,<br>Snuffing far battle with nostril wide,<br>Neighing the joy of fierce desire.<br><br>The crisping herbage of arid plains<br>Had toughened his sinews like bands of steel;<br>The snow-fed waters of Zarafshan<br>Had nerved the might of a northern will.<br><br>The war steed grazed in the fertile meads,<br>Drinking the waters of indolent streams:<br>He rested at eve on bloom-dight beds,<br>Toyed with by maidens in the goldening gleams.<br><br>They charmed his ear with dalliant song:<br>They closed his eyes in witchery\'s glee:<br>They fed him the vineyards\' wildering draught—<br>He slept in the breath of the lotus tree.<br><br>White bones lie strewn on the flowering mead,<br>In flesh-rank grass grown high and dark.<br>The carrion bird hath flown—hath died—<br>Riseth the war-horse? Neigheth? Hark!<p class="in45">- JOSIAH TORREY READE, Amherst, 1856.<P>The above lyric may be taken as the epitaph of any polygamous nation. The last words are significant—"Neigheth? Hark!" Would the old war steed arise? "Hark!" The Sepoy rebellion was on! We "hearkened," but the rebellion went to pieces and an end was put to the Mogul empire. We have listened for half a century and heard no sound. We hear mutterings now, but the end will be as before—even if the "war-horse" riseth and is victorious. He will then again lie down in "flesh-rank grass grown high and dark," and the "carrion bird" will fly from his "white bones." Streams cannot rise higher than their fountains. The causes remaining, the same effects will follow.`<a href="./study/isbe/search.html?string=DIVORCE">DIVORCE</a>; <a href="./study/isbe/search.html?string=FAMILY">FAMILY</a>; <a href="./study/isbe/search.html?string=MARRIAGE">MARRIAGE</a>`22';
isbe[7022]='Pomegranate`pom\'-gran-at, pom-gran\'-at, pum\'-gran-at (rimmon (tree and fruit); the Hebrew name is similar to the Arabic, Aramaic and Ethiopic; rhoa):<P>1. A Tree Characteristic of Palestine: One of the most attractive and most characteristic of the fruit trees of Syria, probably indigenous to Persia, Afghanistan and the neighborhood of the Caucasus, but introduced to Palestine in very ancient times. The spies brought specimens of figs and pomegranates, along with grapes, from the Vale of Eshcol (<a onClick="return mV(\'Num\',13,23);">Nu 13:23</a>). Vines, figs and pomegranates are mentioned (<a onClick="return mV(\'Num\',20,5);">Nu 20:5</a>) as fruits the Israelites missed in the wilderness; the promised land was to be one "of wheat and barley, and vines and fig-trees and pomegranates" (<a onClick="return mV(\'Deu\',8,8);">De 8:8</a>), a promise renewed in <a onClick="return mV(\'Hag\',2,19);">Hag 2:19</a>. In the lamentation in <a onClick="return mV(\'Joe\',1,11,12);">Joe 1:11,12</a> we have the pomegranate, the palm tree and the apple tree represented as withered, "for joy is withered away from the sons of men."<P>2. The Fruit:<P>The pomegranate tree, Punica granatum (Natural Order, Granateae) occurs usually as a shrub or small tree 10-15 ft. high, and is distinguished by its fresh green, oval leaves, which fall in winter, and its brilliant scarlet blossoms (compare <a onClick="return mV(\'Sgs\',7,12);">So 7:12</a>). The beauty of an orchard of pomegranates is referred to in <a onClick="return mV(\'Sgs\',4,13);">So 4:13</a>. The fruit which is ripe about September is apple-shaped, yellow-brown with a blush of red, and is surmounted by a crown-like hard calyx; on breaking the hard rind, the white or pinkish, translucent fruits are seen tightly packed together inside. The juicy seeds are sometimes sweet and sometimes somewhat acid, and need sugar for eating. The juice expressed from the seeds is made into a kind of syrup for flavoring drinks, and in ancient days was made into wine: "I would cause thee to drink of spiced wine, of the juice (margin "sweet wine") of my pomegranate" (<a onClick="return mV(\'Sgs\',8,2);">So 8:2</a>). The beauty of a cut section of pomegranate—or one burst open naturally, when fully ripe—may have given rise to the comparison in <a onClick="return mV(\'Sgs\',4,3);">So 4:3</a>; <a onClick="return mV(\'Sgs\',6,7);">6:7</a>: "Thy temples are like a piece of a pomegranate." The rind of the pomegranate contains a very high percentage of tannic acid, and is employed both as a medicine and for tanning, particularly in making genuine morocco leather.<P>Whether the pomegranate tree in Migron under which Saul is said (<a onClick="return mV(\'1Sa\',14,2);">1Sa 14:2</a>) to have abode with his 600 men was really a tree or a place, Rimmon, is doubtful.<P>3. The Pomegranate in Art:<P>A large number of references to the pomegranate are to the use of the form of the fruit in ornamentation, in which respect it appears among the Hebrews to have something of the position of the lotus bud as a decorative motive in Egypt. It was embroidered in many colors on the skirts of Aaron\'s garments, together with golden bells (<a onClick="return mV(\'Exd\',28,33);">Ex 28:33</a>f; <a onClick="return mV(\'Exd\',39,24,25,26);">39:24-26</a> compare Ecclesiasticus 45:9). Hiram of Tyre introduced the pomegranate into his brass work ornamentation in the temple: "So he made the pillars; and there were two rows round about upon the one network, to cover the capitals that were upon the top of the pillars" (margin "So the Syriac The Hebrew has \'pomegranates\'")(<a onClick="return mV(\'1Ki\',7,18);">1Ki 7:18</a>). "And the pomegranates were two hundred, in rows round about upon the other capital" (<a onClick="return mV(\'1Ki\',7,20);">1Ki 7:20</a> compare also 1Ki 7:42; <a onClick="return mV(\'2Ki\',25,17);">2Ki 25:17</a>; <a onClick="return mV(\'2Ch\',3,16);">2Ch 3:16</a>; <a onClick="return mV(\'2Ch\',4,13);">4:13</a>).`<a href="./study/isbe/search.html?string=RIMMON">RIMMON</a>`117';

isbe[7025]='Ponder`pon\'-der: Occurs in the King James Version 5 times in the Book of Proverbs and nowhere else in the Old Testament. In each case it means "to consider carefully," "to weigh mentally." In <a onClick="return mV(\'Pro\',4,26);">Pr 4:26</a> and <a onClick="return mV(\'Pro\',5,21);">5:21</A>, the Revised Version (British and American) substitutes "make level." In <a onClick="return mV(\'Pro\',5,6);">Pr 5:6</a>, it drops out entirely in the Revised Version (British and American). In <a onClick="return mV(\'Pro\',21,2);">Pr 21:2</a> and <a onClick="return mV(\'Pro\',24,12);">24:12</A>, "weigh" is substituted for "ponder." The one New Testament passage is <a onClick="return mV(\'Luk\',2,19);">Lu 2:19</a>; here the Revised Version (British and American) has "pondering" where the King James Version has "and pondered."``1';

isbe[7027]='Pontus`pon\'-tus (Pontos): Was an important province in the northeastern part of Asia Minor, lying along the south shore of the Black Sea. The name was geographical, not ethnical, in origin, and was first used to designate that part of Cappadocia which bordered on the "Pontus," as the Euxine was often termed. Pontus proper extended from the Halys River on the west to the borders of Colchis on the east, its interior boundaries meeting those of Galatia, Cappadocia and Armenia. The chief rivers besides the Halys were the Iris, Lycus and Thermodon. The configuration of the country included a beautiful but narrow, riparian margin, backed by a noble range of mountains parallel to the coast, while these in turn were broken by the streams that forced their way from the interior plains down to the sea; the valleys, narrower or wider, were fertile and productive, as were the wide plains of the interior such as the Chiliokomon and Phanaroea. The mountain slopes were originally clothed with heavy forests of beech, pine and oak of different species, and when the country was well afforested, the rainfall must have been better adequate than now to the needs of a luxuriant vegetation.<P>The first points in the earliest history of Pontus emerge from obscurity, much as the mountain peaks of its own noble ranges lift their heads above a fog bank. Thus, we catch glimpses of Assyrian culture at Sinope and Amisus, probably as far back as the 3rd millennium BC. The period of Hittite domination in Asia Minor followed hard after, and there is increasing reason to suppose that the Hittites occupied certain leading city sites in Pontus, constructed the artificial mounds or tumuli that frequently meet the eyes of modern travelers, hewed out the rock tombs, and stamped their character upon the early conditions. The home of the Amazons, those warrior priestesses of the Hittites, was located on the banks of the Thermodon, and the mountains rising behind Terme are still called the "Amazon Range"; and the old legends live still in stories about the superior prowess of the modern women living there.<P>As the Hittite power shrunk in extent and force, by the year 1000 BC bands of hardy Greek adventurers appeared from the west sailing along the Euxine main in quest of lands to exploit and conquer and colonize. Cape Jason, which divides the modern mission fields of Trebizond and Marsovan, preserves the memory of the Argonants and the Golden Fleece. Miletus, "greatest of the Ionic towns," sent out its colonists, swarm after swarm, up through the Bosphorus, and along the southern shore of the Black Sea. They occupied Sinope, the northern-most point of the peninsula with the best harbor and the most commanding situation. Sinope was in Paphlagonia, but politically as well as commercially enjoyed intimate relations with the Pontic cities. Settlers from Sinope, reinforced by others from Athens direct, pressed on and founded Amisus, the modern Samsoun, always an important commercial city. Another colony from Sinope founded Trebizond, near which Xenophon and the Ten Thousand reached the sea again after they had sounded the power of Persia and found it hollow at Cunaxa. Among the cities of the interior, picturesque Amasia in the gorge of the Iris River witnessed the birth of Strabo in the 1st century BC, and to the geographer Strabo, more than to any other man, is due our knowledge of Pontus in its early days. Zille, "built upon the mound of Semiramis," contained the sanctuary of Anaitis, where sacrifices were performed with more pomp than in any other place. Comana, near the modern Tokat, was a city famous for the worship of the great god Ma. Greek culture by degrees took root along the coast; it mixed with, and in turn was modified by, the character of the older native inhabitants.<P>When the Persians established their supremacy in Asia Minor with the overthrow of Lydia, 546 BC, Pontus was loosely joined to the great empire and was ruled by Persian satraps. Ariobarzanes, Mithradates and Pharnaces are the recurring names in this dynasty of satraps which acquired independence about 363 and maintained it during the Macedonian period. The man that first made Pontus famous in history was Mithradates VI, surnamed Eupator. Mithradates was a typical oriental despot, gifted, unscrupulous, commanding. Born at Sinope 136 BC and king at Amasia at the age of twelve, Mithradates was regarded by the Romans as "the most formidable enemy the Republic ever had to contend with." By conquest or alliance he widely extended his power, his chief ally being his son-in-law Dikran, or Tigranes, of Armenia, and then prepared for the impending struggle with Rome. The republic had acquired Pergamus in 133 BC and assumed control of Western Asia Minor. There were three Roman armies in different parts of the peninsula when war broke out, 88 BC. Mithradates attacked them separately and over-threw them all. He then planned and executed a general massacre of all the Romans in Asia Minor, and 80,000 persons were cut down. Sulla by patient effort restored the fortunes of Rome, and the first war ended in a drawn game; each party had taken the measure of its antagonist, but neither had been able to oust the other. The second war began in the year 74, with Lucullus as the Roman general. Lucullus took Amisus by siege, chased Mithradates to Cabira, modern Niksar, scattered his army and drove the oriental sultan out of his country. Subsequently on his return to Rome, Lucullus carried from Kerasoun the first cherries known to the western world. In the third war the hero on the Roman side was the masterful Pompey, appointed in 66 BC. As a result of this war, Mithradates was completely vanquished. His dominions were finally and permanently incorporated in the territories of the Roman republic. The aged king, breathing out wrath and forming impossible plans against his lifelong enemies, died in exile in the Crimea from poison administered by his own hand.<P>Most of Pontus was for administrative purposes united by the Romans with the province of Bithynia, though the eastern part subsisted as a separate kingdom under Polemon and his house, 36 BC to 63 AD, and the southwestern portion was incorporated with the province of Galatia. It was during the Roman period that Christianity entered this province. There were Jews dwelling in Pontus, devout representatives of whom were in Jerusalem on the Day of Pentecost (<a onClick="return mV(\'Act\',2,9);">Ac 2:9</a>). Paul\'s associates, Aquila and Priscilla, were originally from here (<a onClick="return mV(\'Act\',18,2);">Ac 18:2</a>). The sojourners of the Dispersion are included in the address of the first Epistle of Peter together with the people of four other provinces in Asia Minor (<a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>). Local traditions connect the apostles Andrew and Thaddeus with evangelistic labors in this region. They are said to have followed the great artery of travel leading from Caesarea Mazaca to Sinope. Pliny, governor of Bithynia and Pontus 111-113 AD, found Christians under his authority in great numbers (see <a href="./study/isbe/search.html?string=BITHYNIA">BITHYNIA</a>), and Professor Ramsay argues that Pliny\'s famous letters, Numbers 96 and 97, written to the emperor Traian on the subject of the treatment of Christians under his government (see <a href="./study/isbe/search.html?string=PERSECUTION">PERSECUTION</a>), were composed in view of conditions in Amisus (Church in Roman Empire, 224, 225).<P>The Roman empire in the East was gradually merged into the Byzantine, which is still known to the local inhabitants as the empire of "Roum," i.e. Rome. Pontus shared the vicissitudes of this rather unfortunate government until, in 1204, a branch of the Byzantine imperial family established in Pontus a separate small state with its capital at Trebizond. Here the house of the Grand Comneni, sheltered between the sea and the mountain ranges, maintained its tinsel sovereignty to and beyond the fall of Constantinople. In 1461 Trebizond was taken by Mohammed the Conqueror, since which date Pontus, with its conglomerate population of Turks, Armenians, Greeks and fragments of other races, has been a part of the Ottoman empire.`<a href="./study/isbe/search.html?string=ASIA+MINOR,+ARCHAEOLOGY+OF">ASIA MINOR, ARCHAEOLOGY OF</a>`191';
isbe[7028]='Pool; Pond; Reservoir`pool, pond, rez\'-er-vwar, rez\'-er-vwar (1) berekhah, "pool"; compare Arabic birkat, "pool"; compare berakhah, "blessing," and Arabic barakat, "blessing"; (2) agham, "pool," "marsh," "reeds"; compare Arabic \'ajam, "thicket," "jungle"; (3) miqwah, "reservoir," the King James Version "ditch" (<a onClick="return mV(\'Isa\',22,11);">Isa 22:11</a>); (4) miqweh, "pond," the King James Version "pool" (<a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a>); miqweh ha-mayim, English Versions of the Bible "gathering together of the waters" (<a onClick="return mV(\'Gen\',1,10);">Ge 1:10</a>); miqweh-mayim, "a gathering of water," the King James Version "plenty of water" (<a onClick="return mV(\'Lev\',11,36);">Le 11:36</a>); (5) kolumbethra, "pool," literally, "a place of diving," from kolumbao, "to dive"): Lakes (see <a href="./study/isbe/search.html?string=LAKE">LAKE</a>) are very rare in Syria and Palestine, but the dry climate, which is one reason for the fewness of lakes, impels the inhabitants to make artificial pools or reservoirs to collect the water of the rain or of springs for irrigation and also for drinking. The largest of these are made by damming water courses, in which water flows during the winter or at least after showers of rain. These may be enlarged or deepened by excavation. Good examples of this are found at Diban and Madeba in Moab. Smaller pools of rectangular shape and usually much wider than deep, having no connection with water courses, are built in towns to receive rain from the roofs or from the surface of the ground. These may be for common use like several large ones in Jerusalem, or may belong to particular houses. These are commonly excavated to some depth in the soil or rock, though the walls are likely to rise above the surface. Between these and cylindrical pits or cisterns no sharp line can be drawn.<P>The water of springs may be collected in large or small pools of masonry, as the pool of Siloam (<a onClick="return mV(\'Jhn\',9,7);">Joh 9:7</a>). This is commonly done for irrigation when the spring is so small that the water would be lost by absorption or evaporation if it were attempted to convey it continuously to the fields. The pool (Arabic, birkat) receives the trickle of water until it is full. The water is then let out in a large stream and conducted where it is needed. (In this way by patient labor a small trickling spring may support much vegetation.)<p>\'Agham does not seem to be used of artificial pools, but rather of natural or accidental depressions containing water, as pools by the Nile (<a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a>; <a onClick="return mV(\'Exd\',8,5);">8:5</a>), or in the wilderness (<a onClick="return mV(\'Psa\',107,35);">Ps 107:35</a>; <a onClick="return mV(\'Psa\',114,8);">114:8</a>; <a onClick="return mV(\'Isa\',14,23);">Isa 14:23</a>; <a onClick="return mV(\'Isa\',35,7);">35:7</a>; <a onClick="return mV(\'Isa\',41,18);">41:18</a>; <a onClick="return mV(\'Isa\',42,15);">42:15</a>). In <a onClick="return mV(\'Isa\',19,10);">Isa 19:10</a> the rendering of the King James Version, "all that make sluices and ponds for fish," would be an exception to this statement, but the Revised Version (British and American) has "all they that work for hire shall be grieved in soul." Miqweh occurs with \'agham in <a onClick="return mV(\'Exd\',7,19);">Ex 7:19</a> of the ponds and pools by the Nile. Berekhah is used of "the pool of Gibeon" (<a onClick="return mV(\'2Sa\',2,13);">2Sa 2:13</a>), "the pool in Hebron" (<a onClick="return mV(\'2Sa\',4,12);">2Sa 4:12</a>), "the pool of Samaria" (<a onClick="return mV(\'1Ki\',22,38);">1Ki 22:38</a>), "the pools in Heshbon" (<a onClick="return mV(\'Sgs\',7,4);">So 7:4</a>), "the pool of Shelah," the King James Version "Shiloah" (<a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>); compare "the waters of Shiloah" (<a onClick="return mV(\'Isa\',8,6);">Isa 8:6</a>). We read in <a onClick="return mV(\'Ecc\',2,6);">Ec 2:6</a>, "I made me pools of water, to water therefrom the forest where trees were reared." There is mention of "the upper pool" (<a onClick="return mV(\'2Ki\',18,17);">2Ki 18:17</a>; <a onClick="return mV(\'Isa\',7,3);">Isa 7:3</a>; <a onClick="return mV(\'Isa\',36,2);">36:2</a>), "the lower pool" (<a onClick="return mV(\'Isa\',22,9);">Isa 22:9</a>), "the king\'s pool" (<a onClick="return mV(\'Neh\',2,14);">Ne 2:14</a>). <a onClick="return mV(\'Isa\',22,11);">Isa 22:11</a> has, "Ye made also a reservoir (miqwah) between the two walls for the water of the old pool (berekhah)." Kolumbethra is used of the pool of Bethesda (<a onClick="return mV(\'Jhn\',5,2,4,7);">Joh 5:2,4,7</a>) and of the pool of Siloam (<a onClick="return mV(\'Jhn\',9,7,11);">Joh 9:7,11</a>).`<a href="./study/isbe/search.html?string=CISTERN">CISTERN</a>; <a href="./study/isbe/search.html?string=NATURAL+FEATURES">NATURAL FEATURES</a>`37';
isbe[7029]='Pools of Solomon`poolz.`<a href="./study/isbe/search.html?string=CISTERN">CISTERN</a>; <a href="./study/isbe/search.html?string=POOL">POOL</a>`1';
isbe[7030]='Poor`poor (\'ebhyon, dal, \'ani, rush; ptochos):<P>I. In the Old Testament.<P>The poor have great prominence in the Bible; it is said, indeed, that there should be no poor among the Hebrews because Yahweh should so greatly bless them (<a onClick="return mV(\'Deu\',15,4);">De 15:4</a> the Revised Version (British and American) and the King James Version margin); but this was only to be realized on certain conditions of obedience (<a onClick="return mV(\'Deu\',15,5);">De 15:5</a>), and in <a onClick="return mV(\'Deu\',15,11);">De 15:11</a> it is said,"the poor will never cease out of the land"; but they were to see to it that none was left in destitution. The very foundation of the Hebrew religion was God\'s pity on a poor and oppressed people.<P>1. The Terms Employed:<P>The words for "poor" are chiefly \'ebhyon, "desirous," "needy," "poor" (<a onClick="return mV(\'Exd\',23,6);">Ex 23:6</a>, etc.); dal, "moving," "swaying," hence, weak, poor, lowly (<a onClick="return mV(\'Exd\',23,3);">Ex 23:3</a>, etc.); dallah, "poverty," "weakness" (<a onClick="return mV(\'2Ki\',25,12);">2Ki 25:12</a>, etc.); rush, perhaps "to shake," "tremble," "to be poor," "impoverished" (<a onClick="return mV(\'1Sa\',18,23);">1Sa 18:23</a>, etc.); \'ani, also \'anaw, "poor," "oppressed," from \'anah, "to bend" or "bow down (<a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a>, etc.); \'aneh, Aramaic (<a onClick="return mV(\'Dan\',4,27);">Da 4:27</a>), chelekhah, "wretchedness" (<a onClick="return mV(\'Psa\',10,8,14);">Ps 10:8,14</a>); yarash, "to make poor" (<a onClick="return mV(\'1Sa\',2,7);">1Sa 2:7</a>); machsor, "want" (<a onClick="return mV(\'Pro\',21,17);">Pr 21:17</a>); micken, "a needy one" (<a onClick="return mV(\'Ecc\',4,13);">Ec 4:13</a>; <a onClick="return mV(\'Ecc\',9,15,16);">9:15 bis, 16</a>).<P>2. Representations:<P>(1) Generally.—God (Yahweh and \'Elohim) is represented as having a special care for "the poor," which was illustrated in the deliverance of the nation from Egyptian poverty and bondage and was never to be forgotten by them (<a onClick="return mV(\'Deu\',24,22);">De 24:22</a>); as punishing the oppressors of the poor and rewarding those who were kind to them; God Himself was the Protector and Saviour of the poor (<a onClick="return mV(\'Exd\',22,23);">Ex 22:23</a>): "If thou afflict them at all, and they cry at all unto me, I will surely hear their cry; and my wrath shall wax hot," etc. (<a onClick="return mV(\'Deu\',15,9);">De 15:9</a>; <a onClick="return mV(\'Deu\',24,15);">24:15</a>; <a onClick="return mV(\'1Sa\',2,8);">1Sa 2:8</a>; <a onClick="return mV(\'Job\',31,16);">Job 31:16</a>; <a onClick="return mV(\'Psa\',9,18);">Ps 9:18</a>; <a onClick="return mV(\'Psa\',12,5);">12:5</a>; <a onClick="return mV(\'Pro\',19,17);">Pr 19:17</a>; <a onClick="return mV(\'Isa\',25,4);">Isa 25:4</a>; <a onClick="return mV(\'Ecc\',5,8);">Ec 5:8</a>, "one higher than the high regardeth," etc.).<P>(2) Liberality to the poor is specially enjoined (<a onClick="return mV(\'Deu\',15,7);">De 15:7</a>f), and they were to beware of self-deception and grudging in this (<a onClick="return mV(\'Deu\',15,9,10);">De 15:9,10</a>).<P>(3) Special provisions were made on behalf of the poor:<P>(a) Every third year a tithe was to be given "unto the Levite, to the sojourner, to the fatherless and to the widow" that Yahweh might bless them (<a onClick="return mV(\'Deu\',14,28,29);">De 14:28,29</a>; <a onClick="return mV(\'Deu\',26,12);">26:12</a>f);<P>(b) the poor were to have the free use of all that grew spontaneously in field or vineyard during the Sabbatic year (<a onClick="return mV(\'Exd\',23,10);">Ex 23:10</a>f; <a onClick="return mV(\'Lev\',25,5,6);">Le 25:5,6</a>);<P>(c) each year the gleanings of the fields and vineyards should belong to the poor, the corners of fields were to be left for them, and if a sheaf was forgotten it should remain (<a onClick="return mV(\'Lev\',19,9,10);">Le 19:9,10</a>; <a onClick="return mV(\'Lev\',23,22);">23:22</a>; <a onClick="return mV(\'Deu\',24,19);">De 24:19</a>);<P>(d) fruit and ripe grain in a field might be eaten by any hungry person, but none should be carried away (<a onClick="return mV(\'Deu\',23,24,25);">De 23:24,25</a>);<P>(e) in the Feast of Weeks the poor were to participate (<a onClick="return mV(\'Deu\',16,\'9-12\');">De 16:9-12</a>);<P>(f) every seventh year there should be a "release" of debts (<a onClick="return mV(\'Deu\',15,1);">De 15:1</a>f); in the seventh year of servitude the Hebrew bond-servant should go free (<a onClick="return mV(\'Exd\',21,2);">Ex 21:2</a>), or in the Jubilee, if that came first, on which occasion—the fiftieth year—property that had been sold returned to its owner or his family (<a onClick="return mV(\'Lev\',25,\'8-17\');">Le 25:8-17</a>);<P>(g) they were to lend readily to the poor, and no interest or increase was to be taken from their brethren (<a onClick="return mV(\'Exd\',22,25);">Ex 22:25</a>; <a onClick="return mV(\'Lev\',25,\'35-37\');">Le 25:35-37</a>; <a onClick="return mV(\'Deu\',15,7);">De 15:7</a>f); in <a onClick="return mV(\'Lev\',25,39);">Le 25:39</a>, no poor Hebrew was to be made a bond-servant, and, if a hired servant, he was not to be ruled with rigor (<a onClick="return mV(\'Lev\',25,43);">25:43</A>); his hire was to be given him daily (<a onClick="return mV(\'Lev\',19,13);">Le 19:13</a>; <a onClick="return mV(\'Deu\',24,15);">De 24:15</a>); no widow\'s raiment was to be taken in pledge (<a onClick="return mV(\'Deu\',24,17);">De 24:17</a>), nor the handmill, nor the upper millstone so essential for daily life (<a onClick="return mV(\'Deu\',24,6);">De 24:6</a>), a man\'s garment should be returned to him before sundown, and no house should be entered to seize or fetch any pledge (<a onClick="return mV(\'Deu\',24,\'10-13\');">De 24:10-13</a>); breach of these laws should be sin and their observance righteousness (<a onClick="return mV(\'Deu\',24,13,15);">De 24:13,15</a>, etc.; see <a href="./study/isbe/search.html?string=ALMS,+ALMSGIVING">ALMS, ALMSGIVING</a>);<P>(h) justice was to be done to the poor (<a onClick="return mV(\'Exd\',23,6);">Ex 23:6</a>; <a onClick="return mV(\'Deu\',27,19);">De 27:19</a>, "Cursed be he that wresteth the justice due to the sojourner, fatherless, and widow"); (i) offerings were graduated according to means (<a onClick="return mV(\'Lev\',5,7);">Le 5:7</a>; <a onClick="return mV(\'Lev\',12,8);">12:8</a>).<P>(4) Definite penalties were not always attached to those laws, and the prophets and psalmists have many complaints of the unjust treatment and oppression of the poor, contrary to the will of God, and frequent exhortations to justice and a due regard for them (<a onClick="return mV(\'Psa\',10,2,9);">Ps 10:2,9</a>; <a onClick="return mV(\'Psa\',12,5);">12:5</a>; <a onClick="return mV(\'Psa\',14,6);">14:6</a>; <a onClick="return mV(\'Isa\',3,14,15);">Isa 3:14,15</a>; <a onClick="return mV(\'Jer\',2,34);">Jer 2:34</a>; <a onClick="return mV(\'Eze\',16,49);">Eze 16:49</a>, "the iniquity of...Sodom"; <a onClick="return mV(\'Eze\',18,12,17);">Eze 18:12,17</a>; <a onClick="return mV(\'Eze\',22,29);">22:29</a>; <a onClick="return mV(\'Amo\',2,7);">Am 2:7</a>; <a onClick="return mV(\'Amo\',4,1);">4:1</a>; <a onClick="return mV(\'Hab\',3,14);">Hab 3:14</a>; compare <a onClick="return mV(\'Job\',20,19);">Job 20:19</a>; <a onClick="return mV(\'Job\',24,9,14);">24:9,14</a>, etc.; <a onClick="return mV(\'Pro\',14,31);">Pr 14:31</a>).<P>(5) The duty of caring for the poor is frequently and strongly set forth and divine promises attached to its fulfillment (<a onClick="return mV(\'Psa\',41,1);">Ps 41:1</a>; <a onClick="return mV(\'Psa\',72,12);">72:12</a>ff; <a onClick="return mV(\'Pro\',17,5);">Pr 17:5</a>; <a onClick="return mV(\'Pro\',22,9);">22:9</a>; <a onClick="return mV(\'Pro\',28,3,17);">28:3,17</a>; <a onClick="return mV(\'Isa\',58,7);">Isa 58:7</a>; <a onClick="return mV(\'Jer\',22,16);">Jer 22:16</a>; <a onClick="return mV(\'Eze\',18,17);">Eze 18:17</a>; <a onClick="return mV(\'Dan\',4,27);">Da 4:27</a>; <a onClick="return mV(\'Zec\',7,10);">Zec 7:10</a>, etc.; compare <a onClick="return mV(\'Job\',29,12,16);">Job 29:12,16</a>; <a onClick="return mV(\'Job\',30,25);">30:25</a>; <a onClick="return mV(\'Job\',31,19);">31:19</a>; <a onClick="return mV(\'Psa\',112,9);">Ps 112:9</a>).<P>(6) The day of the divine manifestation, the times of the Messiah, should bring deliverance and rejoicing to the poor (<a onClick="return mV(\'Psa\',72,\'12-15\');">Ps 72:12-15</a>; <a onClick="return mV(\'Isa\',11,4);">Isa 11:4</a>, "With righteousness shall he judge the poor," etc.; <a onClick="return mV(\'Isa\',14,30);">Isa 14:30</a>; <a onClick="return mV(\'Isa\',29,19);">29:19</a>; <a onClick="return mV(\'Isa\',61,1);">61:1</a> the Revised Version margin).<P>(7) The equality of rich and poor before God and the superiority of the righteous poor to the ungodly rich, etc., are maintained (<a onClick="return mV(\'Pro\',19,1,22);">Pr 19:1,22</a>; <a onClick="return mV(\'Pro\',22,1,2);">22:1,2</a>; <a onClick="return mV(\'Ecc\',4,13);">Ec 4:13</a>).<P>(8) Ways in which men can willfully make themselves poor are mentioned (<a onClick="return mV(\'Pro\',6,11);">Pr 6:11</a>; <a onClick="return mV(\'Pro\',10,4);">10:4</a>; <a onClick="return mV(\'Pro\',12,24);">12:24</a>; <a onClick="return mV(\'Pro\',13,4,18);">13:4,18</a>; <a onClick="return mV(\'Pro\',14,23);">14:23</a>; <a onClick="return mV(\'Pro\',20,13);">20:13</a>; <a onClick="return mV(\'Pro\',21,5,17);">21:5,17</a>; <a onClick="return mV(\'Pro\',23,21);">23:21</a>; <a onClick="return mV(\'Pro\',28,19);">28:19</a>).<P>3. The Godly Poor:<P>The chief words given above all mean poor, literally, but \'ani (rendered also "afflicted") may also denote Israel as a nation in its afflictions and low estate, e.g. <a onClick="return mV(\'Psa\',68,10);">Ps 68:10</a>; <a onClick="return mV(\'Isa\',41,17);">Isa 41:17</a>; <a onClick="return mV(\'Isa\',49,13);">49:13</a>; <a onClick="return mV(\'Isa\',51,21);">51:21</a>; <a onClick="return mV(\'Isa\',54,11);">54:11</a>; in <a onClick="return mV(\'Zep\',3,12);">Ze 3:12</a>, it is "the ideal Israel of the future." Dr. Driver remarks (art. "Poor," HDB) that such passages show that \'ani (as also its frequent parallel \'ebhyon, and, though somewhat less distinctly, dal) came gradually "to denote the godly poor, the suffering righteous, the persons who, whether \'bowed down\' or \'needy\' or \'reduced,\' were the godly servants of Yahweh." The humble poor became in fact distinguished as the line in which faithfulness to Yahweh was maintained and spiritual religion developed. The less frequent word \'anaw, often translated "meek," "humble," is regarded (see Driver in the place cited.) as having from the first a moral and religious significance. It is used of Moses (<a onClick="return mV(\'Num\',12,3);">Nu 12:3</a>) and occurs in <a onClick="return mV(\'Psa\',10,12,17);">Ps 10:12,17</a>; <a onClick="return mV(\'Psa\',22,26);">22:26</a>; <a onClick="return mV(\'Psa\',25,9);">25:9</a>, etc.; <a onClick="return mV(\'Pro\',3,34);">Pr 3:34</a>; <a onClick="return mV(\'Pro\',16,19);">16:19</a>; <a onClick="return mV(\'Isa\',29,19);">Isa 29:19</a>; <a onClick="return mV(\'Isa\',32,7);">32:7</a>; <a onClick="return mV(\'Isa\',61,1);">61:1</a>; <a onClick="return mV(\'Amo\',2,7);">Am 2:7</a>; <a onClick="return mV(\'Zep\',2,3);">Ze 2:3</a>.<P>II. In the New Testament.<P>In the New Testament ptochos, "trembling," "poor," "beggar," is almost exclusively the word translated "poor." It does not occur very frequently, but we see the same regard for the poor maintained as we have in the Old Testament; besides, the new principle of love and the example of Him who "though he was rich, yet for your sakes...became poor" (ptocheuo, <a onClick="return mV(\'2Cr\',8,9);">2Co 8:9</a>) necessarily carry in them this regard even more fully than in the Old Testament. Jesus announced His mission (<a onClick="return mV(\'Luk\',4,18);">Lu 4:18</a>) by quoting <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>, "to preach good tidings (the King James Version "the gospel") to the poor" (or meek or humble); He gave as a proof of His Messiahship the fact that "the poor have the gospel (or good news of the Kingdom) preached to them" (<a onClick="return mV(\'Mat\',11,5);">Mt 11:5</a>; <a onClick="return mV(\'Luk\',7,22);">Lu 7:22</a>); according to <a onClick="return mV(\'Luk\',6,20);">Lu 6:20</a>, He pronounced a beatitude on the pious "poor" because the kingdom of God was theirs; in <a onClick="return mV(\'Mat\',5,3);">Mt 5:3</a> it is "the poor in spirit" (the humble); we have the injunction to "give to the poor" (<a onClick="return mV(\'Mat\',19,21);">Mt 19:21</a>; <a onClick="return mV(\'Mar\',10,21);">Mr 10:21</a>; <a onClick="return mV(\'Luk\',18,22);">Lu 18:22</a>) who are "always with you" (<a onClick="return mV(\'Mat\',26,11);">Mt 26:11</a>; <a onClick="return mV(\'Mar\',14,7);">Mr 14:7</a>; <a onClick="return mV(\'Jhn\',12,8);">Joh 12:8</a>), which does not mean that there must always be "the poor," but that, in contrast with Himself who was soon to leave them, the poor should remain and kindness could be shown to them at any time, which was His own practice (<a onClick="return mV(\'Jhn\',13,29);">Joh 13:29</a>); we are enjoined to call not the rich or well-to-do to our entertainments, but the poor (<a onClick="return mV(\'Luk\',14,13);">Lu 14:13</a>; compare <a onClick="return mV(\'Luk\',14,21);">Lu 14:21</a>); Zaccheus cited in his favor the fact that he gave \'half of his goods to the poor\' (<a onClick="return mV(\'Luk\',19,8);">Lu 19:8</a>); special notice was taken by Jesus of the poor widow\'s contribution (<a onClick="return mV(\'Luk\',21,3);">Lu 21:3</a>). The first church showed its regard for the poor in the distribution of goods "according as any man had need" (<a onClick="return mV(\'Act\',2,45);">Ac 2:45</a>; <a onClick="return mV(\'Act\',4,32);">4:32</a>; <a onClick="return mV(\'Act\',6,1);">6:1</a>); when the council at Jerusalem freed the Gentiles from the yoke of Judaism, they made it a condition, Paul says, "that we should remember the poor; which very thing I was also zealous to do" (<a onClick="return mV(\'Gal\',2,10);">Ga 2:10</a>); contributions were accordingly made "for the poor among the saints that are at Jerus" (<a onClick="return mV(\'Rom\',15,26);">Ro 15:26</a>), and it was in conveying such contributions that Paul got into the circumstances that led to his arrest. God\'s ability and will to provide for those who give to the poor is quoted from <a onClick="return mV(\'Psa\',112,9);">Ps 112:9</a> (<a onClick="return mV(\'2Cr\',9,9);">2Co 9:9</a>); James specially rebukes certain Christians of his day for their partiality for the rich and their dishonor of the poor (<a onClick="return mV(\'Jam\',2,\'5-9\');">Jas 2:5-9</a>), and John asks how, in the man who "hath the world\'s goods, and beholdeth his brother in need, and shutteth up his compassion from him," the love of God can dwell (<a onClick="return mV(\'1Jo\',3,17,18);">1Joh 3:17,18</a>).<P>Ptochos is translated "beggar" (<a onClick="return mV(\'Luk\',16,20,22);">Lu 16:20,22</a>) and "beggarly" (<a onClick="return mV(\'Gal\',4,9);">Ga 4:9</a>); penes, "one who works for his daily bread," "a poor man," is the word in <a onClick="return mV(\'2Cr\',9,9);">2Co 9:9</a>; the poor widow of <a onClick="return mV(\'Mar\',12,42);">Mr 12:42</a> is described in <a onClick="return mV(\'Luk\',21,2);">Lu 21:2</a> as penichros, "very poor."<P>III. In the Apocrypha.<P>In the Apocrypha the poor are often mentioned; God\'s regard for them (Ecclesiasticus 21:5 (ptochos); 35:12,13); their oppression and wrongs (The <span class="noTag">Wisdom of Solomon 2:10</span> (penes); Ecclesiasticus 13:3,19,23 (ptochos); Baruch 6:28); the duty of care for and of giving to the poor (Tobit 4:7 (ptochos); Ecclesiasticus 29:8 (tapeinos); 29:9 (penes); 34:20-22); of justice and kindness to such (Ecclesiasticus 4:1,5,8; 7:32; 10:23 (ptochos)); "poor" in the sense of pitiable occurs in 2Macc 4:47 (talaiporos), the Revised Version (British and American) "hapless."<P>IV. The Revised Version (British and American) Changes.<P>For "the poor of this world" (<a onClick="return mV(\'Jam\',2,5);">Jas 2:5</a>) the Revised Version (British and American) has "them that are poor as to the world"; for "The poor...shall trust in it" (<a onClick="return mV(\'Isa\',14,32);">Isa 14:32</a>), "In her shall the afflicted...take refuge"; instead of "Whereas also he that is born in his kingdom becometh poor" (<a onClick="return mV(\'Ecc\',4,14);">Ec 4:14</a>), "Yea, even in his kingdom he was born poor"; "poor" for "humble" (<a onClick="return mV(\'Psa\',9,12);">Ps 9:12</a>; <a onClick="return mV(\'Psa\',10,12);">10:12</a>, margin "meek"), for "lowly" (<a onClick="return mV(\'Pro\',16,19);">Pr 16:19</a>, margin "meek").``185';
isbe[7031]='Poplar`pop\'-lar (libhneh, "whiteness"; sturakinos, "storax" (<a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a>), leuke, "poplar" (<a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>) (libhneh is so similar to the Arabic libna, the storax, that the latter certainly has the first claim to be the true translation)): "Jacob took him rods of fresh poplar," margin "storax tree" (<a onClick="return mV(\'Gen\',30,37);">Ge 30:37</a>). "They...burn incense upon the hills, under oaks and poplars and terebinths, because the shadow thereof is good" (<a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>). In the latter reference the conjunction of the shrub, storax, with two great trees like the oak and terebinth—even though they all grow in the mountains—is strange. The storax cannot give a shade comparable with these trees. Had we other evidence of the storax being a sacred tree among the Hebrews, it might explain the difficulty.<P>The storax, Styrax officinalis (Natural Order Styraceae), is a very common shrub in Palestine which occasionally attains the height of 20 feet. The under surfaces of its oval leaves are covered with whitish hairs, and it has many beautiful pure-white flowers like orange blossoms—hence, its name "whiteness."<P>The poplar, the traditional translation in <a onClick="return mV(\'Hsa\',4,13);">Ho 4:13</a>, flourishes in many parts of Palestine. The white poplar, Populus alba, Arabic Haur, is common everywhere; Euphratica occurs especially in the Jordan valley; the black poplar, P. nigra, and the Lombardy poplar, P. pyramidalis—probably an importation—are both plentiful in the plain of Coele-Syria, around Damascus and along the river banks of Syria.``117';
isbe[7032]='Poratha`po-ra\'-tha, por\'-a-tha (pora-tha\'): One of the sons of Haman (<a onClick="return mV(\'Est\',9,8);">Es 9:8</a>). The etymology is uncertain; perhaps from the Persian purdata, "given by fate."``1';
isbe[7033]='Porch`porch: Chiefly in the Old Testament \'alam, used of the temples of Solomon and Ezekiel (see <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>); once micderon, a "vestibule," in <a onClick="return mV(\'Jdg\',3,23);">Jud 3:23</a>. In the New Testament, the word occurs in connection with the high priest\'s palace (<a onClick="return mV(\'Mat\',26,71);">Mt 26:71</a>, pulon; <a onClick="return mV(\'Mar\',14,68);">Mr 14:68</a>, proaulion), and as the rendering of stoa, a "portico," in <a onClick="return mV(\'Jhn\',5,2);">Joh 5:2</a> (pool of Bethesda); and <a onClick="return mV(\'Jhn\',10,23);">Joh 10:23</a>; <a onClick="return mV(\'Act\',3,11);">Ac 3:11</a>; <a onClick="return mV(\'Act\',5,12);">5:12</a>.`<a href="./study/isbe/search.html?string=PORCH,+PORTICO,+SOLOMON\'s">PORCH, PORTICO, SOLOMON\'S</a>`1';
isbe[7034]='Porch, Portico, Solomon\'s`por\'-ti-ko, (he stoa he kaloumene Solomontos): This important element of Herod\'s temple, preserving in its name a traditional connection with Solomon, is thrice referred to in the New Testament, namely, in <a onClick="return mV(\'Jhn\',10,23);">Joh 10:23</a>; <a onClick="return mV(\'Act\',3,11);">Ac 3:11</a>, "the porch that is called Solomon\'s"; and <a onClick="return mV(\'Act\',5,12);">Ac 5:12</a>. In these passages the Greek word stoa is translated "porch" but in the Revised Version margin of <a onClick="return mV(\'Act\',3,11);">Ac 3:11</a> more correctly "portico". In architecture a "porch" is strictly an exterior structure forming a covered approach to the entrance of a building; a "portico" is an ambulatory, consisting of a roof supported by columns placed at regular intervals—a roofed colonnade. The portico bearing Solomon\'s name was that running along the eastern wall in the Court of the Gentiles of Herod\'s temple. It had double columns, while that on the south known as the Royal Portico had four rows (compare Josephus, Ant, XV, xi, 3; BJ, V, v, and see <a href="./study/isbe/search.html?string=TEMPLE,+HEROD\'S">TEMPLE, HEROD\'S</a>). The portico was the scene of Christ\'s teaching at the Feast of the Dedication (<a onClick="return mV(\'Jhn\',10,23);">Joh 10:23</a>), and was flocked to by the multitude after the healing of the lame man (<a onClick="return mV(\'Act\',3,11);">Ac 3:11</a>). There the apostles preached and wrought other miracles (<a onClick="return mV(\'Act\',5,12);">Ac 5:12</a>).``17';
isbe[7035]='Porcius Festus`por\'-shus.`<a href="./study/isbe/search.html?string=FESTUS">FESTUS</a>`1';
isbe[7036]='Porcupine`por\'-ku-pin (qippodh (<a onClick="return mV(\'Isa\',14,23);">Isa 14:23</a>; <a onClick="return mV(\'Isa\',34,11);">34:11</a>; <a onClick="return mV(\'Zep\',2,14);">Ze 2:14</a>) the King James Version "bittern," the Revised Version (British and American) "porcupine"; Septuagint echinos "hedgehog"; qippoz (<a onClick="return mV(\'Isa\',34,15);">Isa 34:15</a>), the King James Version "great owl," the English Revised Version "arrow-snake," the American Standard Revised Version "dart-snake"; Septuagint echinos; compare Arabic qunfud, or qunfudh, "hedgehog" or "porcupine." qippodh, is referred to the root qaphadh, "to draw one\'s self together" or "to roll oneself up," while qipoz is referred to the root qaphaz, and the root qaphats, "to draw together in order to spring." The resemblance between all these words, including the Arabic is obvious, and it is to be noted that the Septuagint has echinos in all the places cited):<P>The Greek echinos is the hedgehog. The Arabic kunfudh is used in some localities for the hedgehog and in others for the porcupine, which is also called nis. The hedgehog is also called kibbabat-ush-shauk, or "ball of spines." These two animals are both found in Syria and Palestine, and, while both have spines, they are very different animals, though often confounded. The hedgehog, Erinaceus europeus, is one of the Insectivora. It eats not only insects but also snakes and other small animals, as well as fruits and roots. It is about 10 inches long, covered with short spines, and rolls itself into a ball when attacked. It inhabits the countries bordering the Mediterranean. The porcupine, Hystrix cristata, is a rodent, about 26 inches long, having long spines. It is herbivorous. It backs rapidly at its foes, thrusting its sharp spines into their flesh, not shooting its spines, as is often stated. It inhabits most of Europe and Asia. It is very different from the Canadian porcupine, Erethizon dorsatus, as well as from the tree porcupines of Mexico and Central and South America.<P>As to the rendering "bittern" for qippodh (<a onClick="return mV(\'Isa\',14,23);">Isa 14:23</a>; <a onClick="return mV(\'Isa\',34,15);">34:15</a>; <a onClick="return mV(\'Zep\',2,14);">Ze 2:14</a>), while the etymology favors "hedgehog," the context favors a bird, especially in <a onClick="return mV(\'Isa\',34,11);">Isa 34:11</a>, though it cannot be said that in any of the passages the context makes "hedgehog" an impossible rendering.<P>In <a onClick="return mV(\'Isa\',34,15);">Isa 34:15</a>, for qippoz, most modern authorities (compare the Revised Version (British and American)) have some sort of serpent, referring to the Arabic root qafaz, "to spring." (See notes above on qaphaz and qaphats.) In this passage also the context is not unfavorable to a bird (compare the King James Version "great owl").`<a href="./study/isbe/search.html?string=BITTERN">BITTERN</a>; <a href="./study/isbe/search.html?string=OWL">OWL</a>; <a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>`37';
isbe[7037]='Porphyry`por\'-fi-ri (in <a onClick="return mV(\'Est\',1,6);">Es 1:6</a>, the Revised Version margin has "porphyry" (the King James Version margin "porphyre") for bahaT, English Versions of the Bible "red (marble)"; the Septuagint has smaragdtes, which was a green stone): Porphyry is an igneous rock containing distinct crystals of feldspar in a feldspathic matrix. It may be purple or of other colors, as green. "Porphyry" is from porphureos, "purple."``1';
isbe[7038]='Porpoise`por\'-pus (the Revised Version margin has "porpoise-skin" for \'or tachash, the Revised Version (British and American) "sealskin," the King James Version "badgers\' skins" (<a onClick="return mV(\'Exd\',25,5);">Ex 25:5</a>; <a onClick="return mV(\'Exd\',26,14);">26:14</a>; <a onClick="return mV(\'Exd\',35,7,23);">35:7,23</a>; <a onClick="return mV(\'Exd\',36,19);">36:19</a>; <a onClick="return mV(\'Exd\',39,34);">39:34</a>; <a onClick="return mV(\'Num\',4,6,8,10,11,12,14,25);">Nu 4:6,8,10,11,12,14,25</a>; <a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a>)): The word denotes leather used in the furnishings of the tabernacle (for shoes in <a onClick="return mV(\'Eze\',16,10);">Eze 16:10</a>), and was probably the skin of the dugong, Halichore dugong, Arabic tukhas, which is found in the Red Sea.`<a href="./study/isbe/search.html?string=BADGER">BADGER</a>`1';
isbe[7039]='Port; Porter`port, por\'-ter: "Port" in the sense of "gate" (of a city or building) is obsolete in modern English, and even in the King James Version is found only in <a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a>. "Porter," as "gate-keeper," however, is still in some use, but "porter" now (but never in the English Versions of the Bible) generally means a burden-carrier. In the Old Testament, except in <a onClick="return mV(\'2Sa\',18,26);">2Sa 18:26</a>; <a onClick="return mV(\'2Ki\',7,10,11);">2Ki 7:10,11</a>, the porter (sho\'er) is a sacred officer of the temple or tabernacle, belonging to a particular family of the Levites, with a share in the sacred dues (<a onClick="return mV(\'Neh\',13,5);">Ne 13:5</a>; <a onClick="return mV(\'Neh\',12,47);">12:47</a>). The "porters" are mentioned only in Chronicles, Ezra and Nehemiah, and Chronicles has a special interest in them, relating that their duties were settled as far back as the time of David (<a onClick="return mV(\'1Ch\',26,\'1-19\');">1Ch 26:1-19</a>), and that the office extended further to the first settlement of Palestine and even to Moses\' day (<a onClick="return mV(\'1Ch\',9,\'17-26\');">1Ch 9:17-26</a>). The office was evidently one of some dignity, and the "chief-porters" (<a onClick="return mV(\'1Ch\',9,26);">1Ch 9:26</a>) were important persons. For some inscrutable reason the Revised Version (British and American) renders sho\'er by "doorkeeper" in <a onClick="return mV(\'1Ch\',15,1);">1Ch 15-26</a>, but not elsewhere.`<a href="./study/isbe/search.html?string=DOORKEEPER">DOORKEEPER</a>`48';
isbe[7040]='Portion; Part`por\'-shun: As far as a distinction between these words is possible in English, it lies in the fact that a "portion" is a "part" about whose destiny something is implied (<a onClick="return mV(\'Psa\',142,5);">Ps 142:5</a>, etc.). The Hebrew has no two synonyms similarly related, and in consequence the use of the words in English Versions of the Bible is settled either by rather arbitrary considerations (menah, is always "portion" in the Revised Version (British and American), but is "part" in the King James Version, <a onClick="return mV(\'Exd\',29,26);">Ex 29:26</a>; <a onClick="return mV(\'Lev\',7,33);">Le 7:33</a>; <a onClick="return mV(\'Lev\',8,29);">8:29</a>) or by the context, irrespective of the Hebrew word used. So "part" and "portion" both represent dabhar, <a onClick="return mV(\'1Ki\',6,38);">1Ki 6:38</a>; <a onClick="return mV(\'Neh\',12,47);">Ne 12:47</a>; peh, <a onClick="return mV(\'Zec\',13,8);">Zec 13:8</a>; <a onClick="return mV(\'Deu\',21,17);">De 21:17</a>; chebhel, <a onClick="return mV(\'Jos\',17,5);">Jos 17:5</a> (Revised Version); <a onClick="return mV(\'Eze\',47,13);">Eze 47:13</a>; meros, <a onClick="return mV(\'Luk\',11,36);">Lu 11:36</a>; <a onClick="return mV(\'Luk\',12,46);">12:46</a>. And in the vast majority of cases in the Old Testament both words represent simply some derivative of chalaq, normally the noun cheleq.``48';
isbe[7041]='Posidonius`pos-i-do\'-ni-us (Posidonios, al. Posidonios and Poseidon): One of the three envoys sent by the Syrian general Nicanor to treat with the Jews under Judas during his invasion of Judea, 161 BC (2Macc 14:19). In 1Macc 7:27ff, proposals are sent by Nicanor to Judas, but no envoys are named, and it is there asserted in contradiction to 2 Maccabees that Judas broke off the negotiation because of the treacherous designs of Nicanor.``1';
isbe[7042]='Possess; Possession`po-zes\', po-zesh\'-un: "Possess" in modern English means normally only "keep in one\'s possession." But in Elizabethan English it means also "take into possession," and, in fact, the word in the Old Testament always represents Hebrew verbs with the latter as their primary meaning (yarash, in nearly all cases, otherwise nachal, qanah, \'achaz; Aramaic chacan). Consequently, in almost every case "take possession of" could be substituted advantageously for "possess," but the Revised Version (British and American) has not thought the change worth carrying through. In the Apocrypha and New Testament, however, the distinction has been made, the King James Version\'s "possess" being retained for katecho, in <a onClick="return mV(\'1Cr\',7,30);">1Co 7:30</a>; <a onClick="return mV(\'2Cr\',6,10);">2Co 6:10</a>, but the same translation for ktaomai, is changed into "take us for a possession (Judith 8:22), "get" (<a onClick="return mV(\'Luk\',18,12);">Lu 18:12</a>), "win" (<a onClick="return mV(\'Luk\',21,19);">Lu 21:19</a>), and "possess himself of" (<a onClick="return mV(\'1Th\',4,4);">1Th 4:4</a>, a very obscure passage). In the noun possession, on the other hand, no such ambiguity exists, and attention need be called only to the following passages. In <a onClick="return mV(\'Deu\',11,6);">De 11:6</a>, the King James Version has, "all the substance that was in their possession," Hebrew "all that subsisted at their feet," the Revised Version (British and American) "every living thing that followed them." the King James Version uses "possession" loosely in <a onClick="return mV(\'Act\',28,7);">Ac 28:7</a> for chorion, the Revised Version (British and American) "lands." peripoiesis, from peripoieo, "cause to remain over," "gain," rendered "God\'s own possession" in <a onClick="return mV(\'Eph\',1,14);">Eph 1:14</a> the Revised Version (British and American) (the King James Version "possession") and <a onClick="return mV(\'1Pe\',2,9);">1Pe 2:9</a> (the King James Version "peculiar," the King James Version margin "purchased"). "God\'s own" is a gloss but is implied in the context.``48';
isbe[7043]='Possession, Demoniacal`de-mo-ni\'-a-kal (<a onClick="return mV(\'Mat\',4,24);">Mt 4:24</a>; <a onClick="return mV(\'Mat\',8,16);">8:16</a>, etc.).`<a href="./study/isbe/search.html?string=DEMON,+DEMONIAC,+DEMONOLOGY">DEMON, DEMONIAC, DEMONOLOGY</a>`1';
isbe[7044]='Post`post (ruts, "to run," ratsim, "runners"): The "runners" formed the royal guard (<a onClick="return mV(\'1Sa\',22,17);">1Sa 22:17</a>; <a onClick="return mV(\'1Ki\',14,27);">1Ki 14:27</a>; <a onClick="return mV(\'2Ki\',11,4,13);">2Ki 11:4,13</a>; see <a href="./study/isbe/search.html?string=GUARD">GUARD</a>). From them were chosen the couriers who carried royal letters and dispatches throughout the kingdom (<a onClick="return mV(\'2Ch\',30,6,10);">2Ch 30:6,10</a>; <a onClick="return mV(\'Est\',3,13,15);">Es 3:13,15</a>; <a onClick="return mV(\'Jer\',51,31);">Jer 51:31</a>). In the Persian service they were mounted on the swiftest horses (<a onClick="return mV(\'Est\',8,10,14);">Es 8:10,14</a>; compare Xenophon, Cyrop. viii. 6, 17; Herodotus viii. 98). They had the right to command the service of either men or animals in order to expedite their progress (compare <a onClick="return mV(\'Mat\',5,41);">Mt 5:41</a>; <a onClick="return mV(\'Mar\',15,21);">Mr 15:21</a>, "compel," "impress").<P>Used in <a onClick="return mV(\'Job\',9,25);">Job 9:25</a> and the King James Version The <span class="noTag">Wisdom of Solomon 5:9</span> (aggelia, the Revised Version (British and American) "message") of the swift passage of time.`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>`91';
isbe[7045]='Pot`pot: A term used as the translation of a number of Hebrew and Greek words whose fundamental meaning seems to describe them as intended for the most part to hold liquid or semi-liquid substances, but the pots of <a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a> are intended to hold ashes.<P>(1) cir, the most common word for "pot." It designates most frequently some household utensil, probably a pot or kettle for boiling. So <a onClick="return mV(\'2Ki\',4,38);">2Ki 4:38</a>ff; <a onClick="return mV(\'Exd\',16,3);">Ex 16:3</a>; <a onClick="return mV(\'Jer\',1,13);">Jer 1:13</a> the King James Version; <a onClick="return mV(\'Eze\',11,3,7,11);">Eze 11:3,7,11</a>, "caldron"; <a onClick="return mV(\'Eze\',24,3,6);">24:3,6</A> the King James Version; <a onClick="return mV(\'Mic\',3,3);">Mic 3:3</a>; <a onClick="return mV(\'Zec\',14,21);">Zec 14:21</a>, etc. It is also used as the name of some vessel of the sanctuary. So <a onClick="return mV(\'Exd\',27,3);">Ex 27:3</a>, where the context shows it was intended to hold ashes; <a onClick="return mV(\'1Ki\',7,45);">1Ki 7:45</a>; <a onClick="return mV(\'2Ch\',4,16);">2Ch 4:16</a>; <a onClick="return mV(\'2Ki\',25,14);">2Ki 25:14</a>. In <a onClick="return mV(\'Psa\',60,8);">Ps 60:8</a>; <a onClick="return mV(\'Psa\',108,9);">108:9</a>, it is a pot for washing.<P>(2) parur (<a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>; <a onClick="return mV(\'1Sa\',2,14);">1Sa 2:14</a>), a vessel for boiling; in <a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>, a vessel for holding broth.<P>(3) dudh, rendered "pot" in <a onClick="return mV(\'Psa\',81,6);">Ps 81:6</a> in the King James Version, "basket" in the Revised Version (British and American); "pot" both the King James Version and the Revised Version (British and American) in <a onClick="return mV(\'Job\',41,20);">Job 41:20</a>.<P>(4) tsintseneth (<a onClick="return mV(\'Exd\',16,33);">Ex 16:33</a>), the jar in which the manna was placed. This jar or pot is mentioned in <a onClick="return mV(\'Hbr\',9,4);">Heb 9:4</a> under the name stamnos.<P>(5) \'acon (<a onClick="return mV(\'2Ki\',4,2);">2Ki 4:2</a>), some kind of jar for holding oil.<P>(6) xestes (<a onClick="return mV(\'Mar\',7,4);">Mr 7:4</a>), some kind of household utensil.<P>Mention may also be made of the word rendered "pot" in <a onClick="return mV(\'Lev\',6,28);">Le 6:28</a> the King James Version, where the Revised Version (British and American) renders more correctly by the general term "vessel"; for the King James Version "pots" (<a onClick="return mV(\'Psa\',68,13);">Ps 68:13</a>) the Revised Version (British and American) substitutes "sheepfolds." The root is uncertain. Those who render "sheepfolds" connect with the related root in <a onClick="return mV(\'Gen\',49,14);">Ge 49:14</a>; <a onClick="return mV(\'Jdg\',5,16);">Jud 5:16</a>. Others render "fireplaces" or "ash heaps." See also "range for pots," in <a onClick="return mV(\'Lev\',11,35);">Le 11:35</a>; "pots," <a onClick="return mV(\'Jer\',35,5);">Jer 35:5</a> the King James Version, correctly "bowls" the Revised Version (British and American); "refining pots" in <a onClick="return mV(\'Pro\',17,3);">Pr 17:3</a>; <a onClick="return mV(\'Pro\',27,21);">27:21</a>.`<a href="./study/isbe/search.html?string=FOOD">FOOD</a>`13';
isbe[7046]='Potentate`po\'-ten-tat (dunastes, "mighty one," from dunamai, "to be able"): A person who possesses great power and authority. Only in <a onClick="return mV(\'1Ti\',6,15);">1Ti 6:15</a>, "the blessed and only Potentate" (= God). The same Greek word is used of Zeus in Sophocles (Ant. 608), and of God in Apocrypha (e.g. Sirach 46:5; 2Macc 15:3,13). It is used of men in <a onClick="return mV(\'Luk\',1,52);">Lu 1:52</a> (the King James Version "the mighty," the Revised Version (British and American) "princes") and <a onClick="return mV(\'Act\',8,27);">Ac 8:27</a> ("of great authority").``1';
isbe[7047]='Poti-Phera`po-tif\'-e-ra (potiphera\'; Egyptian Padipara, "the (one) given of the sun-god"; compare Hebrew Nathaniel, "the gift of God," <a onClick="return mV(\'Gen\',41,45,50);">Ge 41:45,50</a>; <a onClick="return mV(\'Gen\',46,20);">46:20</a>): There is no certain evidence from Egypt that this name was in existence until the XXIInd Dynasty, about 950 BC. But names of the Hyksos period, and, indeed, any kind of Hyksos inscriptions, are so scarce on account of the destruction of Hyksos monuments by the Egyptians of later times that the absence of such names is really no evidence on the subject. The fact that this name has not been discovered earlier than 950 BC does not give any warrant for the claim that the narrative is of a late date.``93';
isbe[7048]='Potiphar`pot\'-i-far (potiphar; compare Egyptian Potiphera (<a onClick="return mV(\'Gen\',39,1);">Ge 39:1</a>f)): A high Egyptian official who became the master of Joseph. It is particularly mentioned that he was an Egyptian, i.e. one of the native Egyptian officials at the Hyksos court.``1';
isbe[7049]='Potsherd`pot\'-shurd (cheres): A piece of earthenware (<a onClick="return mV(\'Job\',2,8);">Job 2:8</a>; <a onClick="return mV(\'Psa\',22,15);">Ps 22:15</a>; <a onClick="return mV(\'Isa\',45,9);">Isa 45:9</a>). the Revised Version (British and American) renders the word in <a onClick="return mV(\'Pro\',26,23);">Pr 26:23</a>, "an earthen vessel," and in <a onClick="return mV(\'Job\',41,30);">Job 41:30</a> substitutes "sharp potsherds" for "sharp stones." Sirach 22:7 refers to the art of "gluing a potsherd (ostrakon) together."`<a href="./study/isbe/search.html?string=HARSITH">HARSITH</a>; <a href="./study/isbe/search.html?string=OSTRACA">OSTRACA</a>`1';

isbe[7053]='Potter; Pottery`pot\'-er, pot\'-er-i:<P>1. Historical Development<P>2. Forms<P>3. Methods of Production<P>4. Uses<P>5. Biblical Terms<P>6. Archaeological Significance<P>LITERATURE<hr /><P>1. Historical Development:<P>(1) Prehistoric.<P>The making of pottery ranks among the very oldest of the crafts. On the rocky plateaus of Upper Egypt, overlooking the Nile valley, are found the polished red earthenware pots of the prehistoric Egyptians. These are buried in shallow oval graves along with the cramped-up bodies of the dead and their chipped flint weapons and tools. These jars are the oldest examples of the potter\'s art. It is inconceivable that in the country of Babel, Egypt\'s great rival in civilization, the ceramic arts were less developed at the same period, but the difference in the nature of the country where the first Mesopotamian settlement probably existed makes it unlikely that relics of the prehistoric dwellers of that country will ever be recovered from under the debris of demolished cities and the underlying deposits of clay and silt.<P>(2) Babylonia.<P>The oldest examples of Babylonian ceramics date from the historical period, and consist of baked clay record tablets, bricks, drainage pipes, household shrines, as well as vessels for holding liquids, fruits and other stores. (See Perrot and Chipiez, History of Art in Chaldea and Assyria, I, figures 159,160,II, figures 163, 168.) Examples of pottery of this early period are shown in the accompanying figures. By the 9th to the 7th century BC the shaping of vessels of clay had become well developed. Fragments of pottery bearing the name of Esarhaddon establish the above dates.<P>(3) Egypt.<P>With the close of the neolithic period in Egypt and the beginning of the historical or dynastic period (4500-4000 BC) there was a decline in the pottery art. The workmanship and forms both became bad, and not until the IVth Dynasty was there any improvement. In the meantime the process of glazing had been discovered and the art of making beautiful glazed faience became one of the most noted of the ancient Egyptian crafts. The potter\'s wheel too was probably an invention of this date.<P>(4) Palestine.<P>The making of pottery in the land which later became the home of the children of Israel began long before this people possessed the land and even before the Phoenicians of the coast cities had extended their trade inland and brought the earthenware vessels of the Tyrian or Sidonian potters. As in Egypt and Babylonia, the first examples were hand-made without the aid of the wheel.<P>It is probable that Jewish potters learned their art from the Phoenicians. They at least copied Phoenician and Mycenaean forms. During their wanderings the children of Israel were not likely to make much use of earthenware vessels, any more than the Arabs do today. Skins, gourds, wooden and metal vessels were less easily broken.<P>To illustrate this, a party, of which the writer was a member, took on a desert trip the earthenware water jars specially made for travel, preferring them to the skin bottles such as the Arab guides carried, for the bottles taint the water. At the end of six days only one out of eight earthenware jars was left. One accident or another had broken all the others.<P>When the Israelites became settled in their new surroundings they were probably not slow in adopting earthenware vessels, because of their advantages, and their pottery gradually developed distinctive though decadent types known as Jewish.<P>Toward the close of the Hebrew monarchy the pottery of the land again showed the effect of outside influences. The red and black figured ware of the Greeks was introduced, and still later the less artistic Roman types, and following these by several centuries came the crude glazed vessels of the Arabic or Saracenic period—forms which still persist.<P>2. Forms:<P>It is not within the limits of this article to describe in detail the characteristics of the pottery of the various periods. The accompanying illustrations taken from photographs of pottery in the Archaeological Museum of the Syrian Protestant College, Beirut, give a general idea of the forms. Any attempt at classification of Palestinian pottery must be considered more or less provisional, due to the uncertainty of origin of many forms. The classification of pre-Roman pottery here used is that adopted by Bliss and Macalister and based upon Dr. Petrie\'s studies.<P>(1) Early Pre-Israelite, Called also "Amorite" (before 1500 BC).<P>Most of the vessels of this period are handmade and often irregular in shape. A coarse clay, turning red or black when burned, characterizes many specimens. Some are brick red. Specimens with a polished or burnished surface are also found.<P>(2) Late Pre-Israelite or Phoenician (1500-1000 BC).<P>From this period on, the pottery is all wheel-turned. The clay is of a finer quality and burned to a brown or red. The ware is thin and light. Water jars with pointed instead of fiat bases appear. Some are decorated with bands or lines of different colored meshes. Cypriote ware with its incised decorations was a like development of the period.<P>(3) Jewish (1000-300 BC).<P>Foreign influence is lost. The types which survive degenerate. New forms are introduced. Ordinary coarse clay burning red is used. Cooking pots are most characteristic. Many examples bear Hebrew stamps, the exact meaning of which is uncertain.<P>(4) Seleucidan.<P>Foreign influence again appears. Greek and other types are imported and copied. Ribbed surfaces are introduced. The old type of burnishing disappears.<P>(5) Roman and Saracenic.<P>Degenerate forms persisting till the present time.<P>(6) Present-day Pottery.<P>3. Methods of Production:<P>The clay as found in the ground is not suitable for use. It is dug out and brought to the vicinity of the pottery (the "potter\'s field," <a onClick="return mV(\'Mat\',27,7);">Mt 27:7</a>) and allowed to weather for weeks. The dry material is then dumped into a cement-lined tank or wooden trough and covered with water. When the lumps have softened they are stirred in the water until all have disintegrated and a thin slimy mud or "slip" has been formed. In coast cities-the potteries are all near the sea, as the sea-water is considered better for the "slipping" process. The slip is drawn off into settling tanks. All stones and lumps remain behind. When the clay has settled, the water is drawn off and the plastic material is worked by treading with the feet (compare <a onClick="return mV(\'Isa\',41,25);">Isa 41:25</a>; <span class="noTag">The Wisdom of Solomon 15:7</span>). The clay used on the Syrian coast is usually a mixture of several earths, which the potters have learned by experience gives the right consistency. The prepared clay is finally packed away and allowed to stand another six months before using, during which time the quality, especially the plasticity, is believed to improve.<P>Before the invention of the potter\'s wheel the clay was shaped into vessels by hand. In all of the countries previously mentioned the specimens representing the oldest work are all hand-made. Chopped straw was usually added to the clay of these early specimens. This material is omitted in the wheel-shaped objects. In a Mt. Lebanon village which is noted for its pottery the jars are still made by hand. Throughout the country the clay stoves are shaped by hand out of clay mixed with straw.<P>The shaping of vessels is now done on wheels, the use of which dates back to earliest history. Probably the Egyptians were the first to use such a machine (IVth Dynasty). In their original form they were stone disks arranged to be turned by hand on a vertical axis. The wheel stood only a few inches above the ground, and the potter sat or squatted down on the ground before it as he shaped his object (see Wilkinson, Ancient Egypt, II, figure 397). The wheels used in Palestine and Syria today probably differ in no respect from those used in the potter\'s house visited by Jeremiah (<a onClick="return mV(\'Jer\',18,\'1-6\');">Jer 18:1-6</a>). The wheel or, to be more exact, wheels (compare <a onClick="return mV(\'Jer\',18,3);">Jer 18:3</a>) are fitted on a square wooden or iron shaft about 3 ft. long. The lower disk is about 20 inches in diameter, and the upper one 8 inches or 12 inches. The lower end of the shaft is pointed and fits into a stone socket or bearing in which it rotates. A second bearing just below the upper disk is so arranged that the shaft inclines slightly away from the potter. The potter leans against a slanting seat, bracing himself with one foot so that he will not slide off, and with the sole of his other foot he kicks the upper face of the lower wheel, thus making the whole machine rotate. The lower wheel is often of stone to give greater momentum. With a marvelous dexterity, which a novice tries in vain to imitate, he gives the pieces of clay any shape he desires.<P>After the vessel is shaped it is dried and finally fired in a furnace or kiln. The ancient Egyptian kiln was much smaller than the one used today (Wilkhinson, II, 192). Most of the kilns are of the crudest form of the "up-draught" variety, i.e. a large chamber with perforated bottom and a fireplace beneath. The fire passes up through the holes, around the jars packed in tiers in the chamber, and goes out at the top. An interesting survival of an early Greek form is still used in Rachiyet-el-Fakhar in Syria. In this same village the potters also use the lead dross, which comes from the parting of silver, for glazing their jars (compare <a onClick="return mV(\'Pro\',26,23);">Pr 26:23</a>). In firing pottery there are always some jars which come out imperfect. In unpacking the kiln and storing the product others get broken. As a consequence the ground in the vicinity of a pottery is always strewn with <A href="./study/isbe/search.html?string=POTSHERD">Potsherd</a>potsherds (see also separate article). The ancient pot
