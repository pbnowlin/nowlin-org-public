e future which stands in the closest relation to the Pentateuch. Three views have been held of this. The old view was that Ezekiel could not be reconciled with the Pentateuch at all, and that the difficulties presented were insoluble. Wellhausen and his followers maintain that the prophet is prior to the Priestly Code (P), and here introduces the distinction between priests and Levites for the first time. The third alternative is to hold that Ezekiel was familiar with P and drew from it the inspiration to make a fresh division among the Levites, giving the sons of Zadok a position similar to that occupied by the sons of Aaron in the wilderness period, and reenacting with slight modifications the legislation applicable to the sons of Aaron, this time applying it to the sons of Zadok. The crucial passage is <a onClick="return mV(\'Eze\',44,\'6-16\');">44:6-16</a>, from which it clearly appears that in Solomon\'s temple aliens had performed sundry tasks that should have been executed by more holy persons, and that Ezekiel proposes to degrade Levites who are not descended from Zadok to perform such tasks in the future as a punishment for their ministrations to idols in high places. Either of the two latter views would explain the close connection that evidently exists between the concluding chapters of Ezekiel and the Priestly Code (P), and, accordingly, in choosing between them, the reader must consider four main points:<p class="in15">(1) Is P shown on the internal evidence to be early or late? Is it desert legislation, or is it accurately reflected in Chronicles? This point has already been discussed in part and is further treated in <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a> (which see).<p class="in15">(2) Is theory of the late composition of P psychologically and morally probable? On this see <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a> and <a href="./study/isbe/search.html?string=POT">POT</a>, 292-99.<p class="in15">(3) Is it the case that the earlier history attests the existence of institutions of P that are held by Wellhausen and his followers to be late—e.g. more national offerings than the critics allow? On this see EPC 200ff, and passim; POT, 305-15, and passim; SBL and OP passim, and article <a href="./study/isbe/search.html?string=PENTATEUCH">PENTATEUCH</a>.<p class="in15">(4) Does Ezekiel himself show acquaintance with P (e.g. in <a onClick="return mV(\'Eze\',22,26);">22:26</A>), or not? On this too see SBL, 96; PS, 281 f.<P>With regard to the non-mention of the high-priesthood and certain other institutions in Ezekiel\'s vision, the natural explanation is that in the case of these the prophet did not desire to institute any changes. It is to be noted that Ezekiel does not codify and consolidate all existing law. On the contrary, he is rather supplementing and reforming. In his ideal temple the prince is to provide the statutory national offerings (45:17), i.e. those of <a onClick="return mV(\'Num\',28,\'1-\');">Nu 28</a>; <a onClick="return mV(\'Num\',29,\'1-\');">29</a>. Apparently the king had provided these earlier (<a onClick="return mV(\'2Ki\',16,13);">2Ki 16:13</a>). But in addition to these there had grown up a "king\'s offering," and it is probably to this only that <a onClick="return mV(\'Eze\',45,22);">Eze 45:22</a>ff; <a onClick="return mV(\'Eze\',46,\'2-15\');">46:2-15</a> relate. In <a onClick="return mV(\'Eze\',46,13);">46:13</a> Septuagint, Syriac, Vulgate, and some Hebrew manuscripts preserve the reading "he" for "thou."<P>V. Ezra, Nehemiah, Chronicles.<P>Whatever the course of the earlier history, there is general agreement that in these books a distinction between priests and Levites is established (see e.g. <a onClick="return mV(\'Neh\',10,37);">Ne 10:37f (38f)</a>; <a onClick="return mV(\'Neh\',12,1);">12:1</a>f). We also find singers and porters (<a onClick="return mV(\'Neh\',13,5);">Ne 13:5</a>, etc.), Nethinim and the sons of Solomon\'s servants (<a onClick="return mV(\'Ezr\',7,7,24);">Ezr 7:7,24</a>; <a onClick="return mV(\'Ezr\',10,23);">10:23</a>f; <a onClick="return mV(\'Neh\',10,28);">Ne 10:28 (29)</a>; <a onClick="return mV(\'Neh\',11,3);">11:3</a>, etc.). It must not be assumed that these classes were new. The story of the Gibeonites (<a onClick="return mV(\'Jos\',9,\'1-\');">Jos 9</a>) gives us the origin of some of these grades, and the non-mention of them in many of the earlier books is easily explained by the character of those books. We know from such passages as <a onClick="return mV(\'Amo\',5,23);">Am 5:23</a> that there were musical services in far earlier times (compare <a onClick="return mV(\'Neh\',12,42);">Ne 12:42</a>).<p>1. Estimates of the Chronicler:<P>Chronicles presents an account of the earlier history of the priests and Levites that in many respects does not tally with the older sources. Many modern writers think that the author\'s views of the past were colored by the circumstances of his own day, and that he had a tendency to carry back later conditions to an earlier period. On the other hand it is impossible to deny fairly that he used some sources which have not been preserved to us elsewhere. Again, there is evidence to show that his work was not intended to be taken for history and would not have been so regarded by his contemporaries. Talmudical authorities held some such view as this. The historical value of his work has yet to be appraised in a more critical and impartial spirit than is exhibited in any of the current discussions. For the present purpose it is only possible to notice the effect of some of his statements, if interpreted literally. As there are passages where he has clearly substituted Levites for the less holy personages of the older sources (contrast e.g. <a onClick="return mV(\'2Ki\',11,\'4-12\');">2Ki 11:4-12</a> with <a onClick="return mV(\'2Ch\',23,\'1-11\');">2Ch 23:1-11</a>), it may be that Levites have also been substituted by him for other persons in notices of which no other version has survived.<P>2. His Data:<P>David and Solomon recognized the hierarchy. The former king instituted the musical services (<a onClick="return mV(\'1Ch\',6,3);">1Ch 6:3</a>ff; <a onClick="return mV(\'1Ch\',16,4,25);">16:4ff; 25</a>). The Levites were divided into courses (<a onClick="return mV(\'1Ch\',23,6);">1Ch 23:6</a>) and were rendered liable to service from the age of twenty by his enactment (<a onClick="return mV(\'1Ch\',23,27);">1Ch 23:27</a>). There were also 24 courses or divisions of priests, 16 of the sons of Eleazar and 8 of the sons of Ithamar (<a onClick="return mV(\'1Ch\',23,24);">1Ch 23:24</a>). The courses were divided by lot. In <a onClick="return mV(\'Neh\',12,\'1-7\');">Ne 12:1-7</a> we read of "chiefs of the priests," but these are only 22 in number, while <a onClick="return mV(\'Neh\',12,\'12-21\');">12:12-21</a> give us 21 in the time of Joiakim (<a onClick="return mV(\'Neh\',12,26);">12:26</a>). But not much importance can be attached to such lists, as names could easily fall out in transmission. According to <a onClick="return mV(\'1Ch\',9,26);">1Ch 9:26</a> the four chief porters were Levites, and Levites were also over the things baked in pans and the shewbread (<a onClick="return mV(\'1Ch\',9,31);">9:31f</a>). This of course is not in accordance with the Law, but is found elsewhere in Chronicles. In <a onClick="return mV(\'1Ch\',23,\'1-\');">1Ch 23</a> the Levites from 30 years old and upward number 38,000, of whom 24,000 oversee the work of the house of the Lord, 6,000 were officers and judges, 4,000 were doorkeepers and 4,000 were musicians. David altered the age of beginning service to 20, and an account of their functions is given in <a onClick="return mV(\'1Ch\',23,\'27-32\');">1Ch 23:27-32</a> (see, further, <a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>). All these arrangements were confirmed and enforced by Solomon (<a onClick="return mV(\'2Ch\',8,14);">2Ch 8:14</a>). There is often uncertainty as to whether the Chronicler identifies priests and Levites in particular cases or not, e.g. in <a onClick="return mV(\'2Ch\',30,27);">2Ch 30:27</a>, "the priests the Levites" bless the people according to the ordinary text, but many authorities read "the priests and the Levites." Hezekiah appears to have undertaken some reorganization (<a onClick="return mV(\'2Ch\',29,\'1-\');">2Ch 29</a>, <a onClick="return mV(\'2Ch\',30,\'1-\');">30</a>, <a onClick="return mV(\'2Ch\',31,\'1-\');">31</a>), but the details are not clear. Jehoshaphat established in Jerusalem a court composed partly of Levites and priests (<a onClick="return mV(\'2Ch\',19,\'8-11\');">19:8-11</A>). Previously he had sent priests and Levites and others to teach the Law in Judah (<a onClick="return mV(\'2Ch\',17,\'1-\');">2Ch 17</a>). In <a onClick="return mV(\'2Ch\',29,34);">2Ch 29:34</a> it is clearly the duty of the priests to flay burnt offerings (contrast <a onClick="return mV(\'Lev\',1,\'1-\');">Le 1</a>). It is impossible to draw any consistent picture from the Chronicler because he gives different data for different periods; it is doubtful whether he meant his statements to be taken as historical, e.g. in <a onClick="return mV(\'1Ch\',25,\'1-\');">1Ch 25</a> we find Levites whose names Giddalti (= "I have magnified"), etc., are really words forming part of a prayer, and it is difficult to believe that either the Chronicler or his public intended this chapter to be interpreted in any but a spiritual sense (see PS, 284-86).<P>In <a onClick="return mV(\'Ezr\',2,40);">Ezr 2:40</a> the number of Levites who returned with Zerubbabel is given as 74, as against 973 priests (<a onClick="return mV(\'Ezr\',2,36);">2:36</A>), 128 singers (<a onClick="return mV(\'Ezr\',2,41);">2:41</A>), 139 children of the porters (<a onClick="return mV(\'Ezr\',2,42);">2:42</A>), 392 Nethinim and children of Solomon\'s servants (<a onClick="return mV(\'Ezr\',2,58);">2:58</a>), and the figures are the same in <a onClick="return mV(\'Neh\',7,\'1-\');">Ne 7</a>, except that there the singers number 148 (<a onClick="return mV(\'Ezr\',7,44);">7:44</A>) and the porters 138 (<a onClick="return mV(\'Ezr\',7,45);">7:45</a>). When Ezra went up, he was at first joined by no Levites (<a onClick="return mV(\'Ezr\',8,15);">8:15</A>), but subsequently gathered 38 Levites and 220 Nethinim (<a onClick="return mV(\'Ezr\',8,\'18-20\');">8:18-20</A>). We get glimpses of the organization in <a onClick="return mV(\'Neh\',12,\'44-47\');">Ne 12:44-47</a> and <a onClick="return mV(\'Neh\',13,10);">13:10</A>ff. It appears that in this period genealogies were carefully scrutinized in the case of doubtful claims to priestly descent (<a onClick="return mV(\'Ezr\',2,61);">Ezr 2:61</a>ff; <a onClick="return mV(\'Neh\',7,63);">Ne 7:63</a>). In <a onClick="return mV(\'Ezr\',6,19);">Ezr 6:19</a>ff the Levites are represented as killing the Passover.<P>Of these books no satisfactory account can be given in the present state of textual criticism and Biblical science generally. Some writers, e.g., hold that the Chronicler had before him a source to which the Levites were entirely unknown, others that he invented freely, others again that he reproduces trustworthy pre-exilic information. The student has only an assortment of theories from which to choose. The bedrock fact is that the statements of these books, if taken in their natural meaning, convey an entirely different impression from the statements of the earlier books construed similarly. Modern research has not yet been seriously addressed to the question whether all the statements were really intended to be interpreted as mere history.<P>VI. Legal Provisions.<P>Aaron and his sons underwent consecration to fit them for their duties. <a onClick="return mV(\'Exd\',28,\'1-\');">Ex 28</a>f prescribes their garments and consecration (see <a href="./study/isbe/search.html?string=DRESS">DRESS</a>; <a href="./study/isbe/search.html?string=BREASTPLATE">BREASTPLATE</a>; <a href="./study/isbe/search.html?string=EPHOD">EPHOD</a>; <a href="./study/isbe/search.html?string=ROBE">ROBE</a>; <a href="./study/isbe/search.html?string=COAT">COAT</a>; <a href="./study/isbe/search.html?string=MITRE">MITRE</a>; <a href="./study/isbe/search.html?string=GIRDLE">GIRDLE</a>; <a href="./study/isbe/search.html?string=URIM+AND+THUMMIM">URIM AND THUMMIM</a>), and the account of the latter may be read in <a onClick="return mV(\'Lev\',8,\'1-\');">Le 8</a>f. In individual sacrifices brought to the religious capital the priests performed the part of the ritual which related to the altar (sprinkling, burning, etc.) (<a onClick="return mV(\'Lev\',1,\'1-\');">Le 1-4</a>). See <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>. A principal function was the duty of teaching the people the law of God (<a onClick="return mV(\'Lev\',10,11);">Le 10:11</a>; <a onClick="return mV(\'Lev\',14,\'54-57\');">14:54-57</a>; <a onClick="return mV(\'Deu\',24,8);">De 24:8</a>; <a onClick="return mV(\'Deu\',33,10);">33:10</a>; compare <a onClick="return mV(\'Eze\',44,23);">Eze 44:23</a>; <a onClick="return mV(\'Hsa\',4,\'1-6\');">Ho 4:1-6</a>; <a onClick="return mV(\'Hag\',2,11);">Hag 2:11</a>ff, and many passages in the Prophets).<P>The priests were subject to special laws designed to maintain their purity (<a onClick="return mV(\'Lev\',21,\'1-\');">Le 21</a>f; compare <a onClick="return mV(\'Eze\',44,\'1-\');">Eze 44</a>). The rules aim at preventing defilement through mourning (save in the case of ordinary priests for a near relation) and at preventing those who were physically unfitted from performing certain functions, and those who were for any reason unclean from approaching the holy things. See further <a href="./study/isbe/search.html?string=STRANGER+AND+SOJOURNER">STRANGER AND SOJOURNER</a>. They performed several semi-judicial functions (<a onClick="return mV(\'Num\',5,5,11);">Nu 5:5ff, 11ff</a>, etc.; see <a href="./study/isbe/search.html?string=JUDGE">JUDGE</a>). They also blessed the people (<a onClick="return mV(\'Num\',6,22);">Nu 6:22</a>; compare <a onClick="return mV(\'Deu\',10,8);">De 10:8</a>, etc.).<P>LITERATURE.<P>Wellhausen, Prolegomena, chapter iv, for the Graf-Wellhausen view; Wiener, Wiener, Pentateuchal Studies, 230-89, for the view taken above; S.I. Curtiss, Levitical Priests, for the conservative view. This writer afterward changed to the critical view. James Orr, POT; A. Van Hoonacker, Le sacerdoce levitique (important); W. Baudissin, article "Priests and Levites" in HDB, IV, for mediating views. The best account in English of the details of the priestly duties is contained in Baudissin\'s article, where a further bibliography will be found.`<a href="./study/isbe/search.html?string=BLESSING">BLESSING</a>; <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>; <a href="./study/isbe/search.html?string=TITHE">TITHE</a>; <a href="./study/isbe/search.html?string=FIRSTLING">FIRSTLING</a>; <a href="./study/isbe/search.html?string=FIRST-FRUITS">FIRST-FRUITS</a>; <a href="./study/isbe/search.html?string=LEVITICAL+CITIES">LEVITICAL CITIES</a>; <a href="./study/isbe/search.html?string=AGRARIAN+LAWS">AGRARIAN LAWS</a>; <a href="./study/isbe/search.html?string=CHEMARIM">CHEMARIM</a>; <a href="./study/isbe/search.html?string=NETHINIM">NETHINIM</a>; <a href="./study/isbe/search.html?string=SOLOMON\'s+servants">SOLOMON\'S SERVANTS</a>; <a href="./study/isbe/search.html?string=SINGERS">SINGERS</a>; <a href="./study/isbe/search.html?string=DOORKEEPER">DOORKEEPER</a>; <a href="./study/isbe/search.html?string=SERVING-WOMEN">SERVING-WOMEN</a>; <a href="./study/isbe/search.html?string=JUDGE">JUDGE</a>`193';
isbe[7096]='Primogeniture`pri-mo-jen\'-i-tur (bekhorah, from bekhor, "firstborn," from bakhar, "to act early"; prototokia):<P>1. Recognition of Doctrine:<P>The right of the firstborn to inherit the headship of the family, carrying with it certain property rights and usually such titles as those of the high-priesthood or kingship. The writings of the Hebrews take for granted the recognition of a doctrine of primogeniture from the earliest times. In the most ancient genealogies a distinction is drawn between the firstborn and the other son (<a onClick="return mV(\'Gen\',10,15);">Ge 10:15</a>; <a onClick="return mV(\'Gen\',22,21);">22:21</a>; <a onClick="return mV(\'Gen\',25,13);">25:13</a>; <a onClick="return mV(\'Gen\',35,23);">35:23</a>; <a onClick="return mV(\'Gen\',36,15);">36:15</a>). In the bestowal of parental blessings in patriarchal times great importance was attached to preferring the firstborn (<a onClick="return mV(\'Gen\',25,31);">Ge 25:31</a>; <a onClick="return mV(\'Gen\',27,29);">27:29</a>; <a onClick="return mV(\'Gen\',48,13);">48:13</a>; <a onClick="return mV(\'Gen\',49,3);">49:3</a>). The feud between Jacob and Esau (<a onClick="return mV(\'Gen\',27,\'1-\');">Ge 27:1</A>-<a onClick="return mV(\'Gen\',28,\'1-21\');">28:21</a>) grew out of the stealing of the firstborn\'s blessing by the younger brother. Joseph was displeased when, in his blessing, Jacob seemed to prefer Ephraim to Manasseh, his firstborn (<a onClick="return mV(\'Gen\',48,18);">Ge 48:18</a>). The father in such cases seems to have had the right to transfer the birthright from one son to another, from the days of Abraham in the case of Ishmael and Isaac, through those of Jacob in the matter of Reuben and Joseph and in the matter of Ephraim and Manasseh, down to the days of David in the selection of a successor to the kingship. Nevertheless, the Mosaic code, which declared (rather than enacted) the law of primogeniture, prohibited the abuse of this parental privilege in the case of a younger son by a favorite wife (<a onClick="return mV(\'Deu\',21,16);">De 21:16</a>f).<P>2. The Double Portion:<P>The manner of acknowledging the firstborn incidentally referred to in Deuteronomy is "by giving him a double portion of all that he hath" (<a onClick="return mV(\'Deu\',21,17);">De 21:17</a>), that is to say, double the share of each of the other brothers. Jewish tradition (Bekho. 46a, 47b, 51a, 51b; Babha\' Bathra\' 122a, 122b, 123a, 124a, 142b) accepts and elaborates on this right of the firstborn son. Thus, it applies only to the firstborn and not the eldest surviving son; it does not apply to daughters; it has reference only to the paternal estate, and not to the inheritance left by a mother or other relative, nor to improvements or accessions made to an estate after the death of the father.<P>3. Reasons for the Custom:<P>The object of the doctrine may be that the eldest son might be enabled to preside over the affairs of family with proper dignity, or that he might assume additional responsibilities, such as the support of unmarried sisters. Hence, one\'s birthright could be waived or sold (<a onClick="return mV(\'Gen\',25,31,34);">Ge 25:31,34</a>). On the other hand it may be based in the ultimate analysis on the primitive feeling of favoritism for the firstborn reflected in the disappointment of Jacob, when he speaks of Reuben as his firstborn, his might, and the beginning of his strength (re\'shith \'on, <a onClick="return mV(\'Gen\',49,3);">Ge 49:3</a>; compare <a onClick="return mV(\'Deu\',21,17);">De 21:17</a>). This theory would be in accord with the right of the parent to transfer the right to a younger son. The suggestion of favoritism conveyed by the Hebrew bekhor is manifested in its figurative use: of Israel (<a onClick="return mV(\'Exd\',4,22);">Ex 4:22</a>), of Ephraim (<a onClick="return mV(\'Jer\',31,9);">Jer 31:9</a>), of one dearly beloved (<a onClick="return mV(\'Zec\',12,10);">Zec 12:10</a>); (compare figurative usage in the New Testament: <a onClick="return mV(\'Rom\',8,29);">Ro 8:29</a>; <a onClick="return mV(\'Hbr\',12,23);">Heb 12:23</a>; <a onClick="return mV(\'Hbr\',1,6);">1:6</a>; <a onClick="return mV(\'Rev\',1,5);">Re 1:5</a>).<P>4. The Firstborn in Ancient Society; Sacrifice and Redemption:<P>Light is thrown on the attitude of the ancient world toward the firstborn, and hence, on the history of primogeniture, by the language used in connection with the plague of the firstborn: "from the first-born of Pharaoh that sitteth upon his throne, even unto the first-born of the maidservant that is behind the mill" or "the captive that was in the dungeon." Apparently no more dreadful catastrophe for all classes of society could be thought of than this slaying of the firstborn (<a onClick="return mV(\'Exd\',11,5);">Ex 11:5</a>; <a onClick="return mV(\'Exd\',12,29);">12:29</a>). The misguided fervor of the ancient Semites who offered their firstborn as the thing most dearly beloved as a sacrifice to their gods must be considered in this light, whether it appears among the Moabites, the Phoenicians or the Hebrews themselves (<a onClick="return mV(\'Jer\',32,35);">Jer 32:35</a>; <a onClick="return mV(\'Eze\',20,26,31);">Eze 20:26,31</a>; <a onClick="return mV(\'2Ch\',28,3);">2Ch 28:3</a>). It is difficult to predicate a connection between the basis of the doctrine of primogeniture and that of the Redemption of the First-born, other than that both are ultimately based on the importance of a firstborn son and the fondness of his parents for him. It is interesting to note, however, that the tradition of redemption and the law of primogeniture are kept so distinct that, while the latter has reference only to the firstborn of a father, the former has reference only to the firstborn of a mother (Bekho, viii. l, 46a; compare peter rechem, "whatsoever openeth the womb," <a onClick="return mV(\'Exd\',13,2);">Ex 13:2</a>). In a polygamous society such as that presupposed in <a onClick="return mV(\'Deu\',21,\'1-\');">De 21</a> it is natural to suppose that the distinction between paternal and maternal primogeniture would be clearly before the minds of the people.`<a href="./study/isbe/search.html?string=BIRTHRIGHT">BIRTHRIGHT</a>; <a href="./study/isbe/search.html?string=FIRSTBORN">FIRSTBORN</a>`81';
isbe[7097]='Prince`prins: This word occurs quite frequently in our English Bible, mostly in the Old Testament. While it is never used to denote royal parentage (compare <a onClick="return mV(\'1Ch\',29,24);">1Ch 29:24</a>), it often indicates actual royal or ruling power, together with royal dignity and authority. As a rule, the name is given to human beings; in a few instances it is applied to God and Christ, the angels and the devil.<P>In <a onClick="return mV(\'Mat\',2,6);">Mt 2:6</a> the word rendered "princes" might be translated "princely cities"; at least, this seems to be implied. Here the term hegemon, "leader," "ruler," "prince," is used, undoubtedly to hint at the fact that Bethlehem was the native city of a great prince. In the other New Testament passages the word archon, "a potentate," "a person in authority," "a magistrate," occurs most frequently (compare <a onClick="return mV(\'Mat\',9,34);">Mt 9:34</a>; <a onClick="return mV(\'Mat\',12,24);">12:24</a>; <a onClick="return mV(\'Mat\',20,25);">20:25</a> (the Revised Version (British and American) "ruler"); <a onClick="return mV(\'Mar\',3,22);">Mr 3:22</a>; <a onClick="return mV(\'Jhn\',12,31);">Joh 12:31</a>; <a onClick="return mV(\'Jhn\',14,30);">14:30</a>; <a onClick="return mV(\'Jhn\',16,11);">16:11</a>; <a onClick="return mV(\'1Cr\',2,6,8);">1Co 2:6,8</a> the King James Version; <a onClick="return mV(\'Eph\',2,2);">Eph 2:2</a>; <a onClick="return mV(\'Rev\',1,5);">Re 1:5</a> (the Revised Version (British and American) "ruler")). In most of these instances the term "prince" refers to the devil.<P>In <a onClick="return mV(\'Act\',3,15);">Ac 3:15</a>; <a onClick="return mV(\'Act\',5,31);">5:31</a>, the word archegos, "leader," is employed referring to Christ as the author of life and salvation (compare <a onClick="return mV(\'Hbr\',12,2);">Heb 12:2</a>, where the term archegos is rendered "author" (Revised Version) or "captain" (Revised Version margin)).<P>The Old Testament contains a number of different words mostly rendered "prince" or "princes" in the English Versions of the Bible.<P>(1) sar: In <a onClick="return mV(\'Jos\',5,14);">Jos 5:14</a> the mysterious armed stranger seen by Joshua near Jericho calls himself the "prince of the host of Yahweh": a high military title applied to a superhuman being. In <a onClick="return mV(\'Isa\',9,6);">Isa 9:6</a>, the name is given to the child representing the future Messiah. The term "Prince of Peace" denotes the eminent position and the peaceful reign of the Messianic king: the highest human title in its most ideal sense. <a onClick="return mV(\'Dan\',8,11);">Da 8:11</a>: here, again, as in <a onClick="return mV(\'Jos\',5,14);">Jos 5:14</a>, occurs the phrase "prince of the host." In <a onClick="return mV(\'Dan\',8,25);">Da 8:25</a> "the prince of princes" refers to God Himself: the highest human title in its absolute sense applied to God. <a onClick="return mV(\'Dan\',10,21);">Da 10:21</a>: "Michael your prince." Michael the archangel is here called the prince of the Jewish people. He is the princely representative of God\'s people in the sight of God, a royal title suggesting high power and alliance with God in the great struggle going on between Him and the powers of darkness. <a onClick="return mV(\'Dan\',12,1);">Da 12:1</a>: here Michael is called "the great prince" who standeth for the children of Israel; supplementing <a onClick="return mV(\'Dan\',10,21);">Da 10:21</a>. In <a onClick="return mV(\'Dan\',10,13);">Da 10:13</a>: "the prince of the kingdom of Persia" (compare <a onClick="return mV(\'Dan\',10,20);">10:20</A>, "the prince of Persia," "the prince of Greece"), the expression is used in the same general sense as in <a onClick="return mV(\'Dan\',10,21);">Da 10:21</a>. Each individual nation is represented as guided by a spiritual being that may or may not be an ally of God in His combat with the devil. In the majority of cases, though, the term sar is applied<P>(a) to men exercising royal or ruling power: <a onClick="return mV(\'Pro\',8,16);">Pr 8:16</a>: "By me princes (margin "or rulers") rule" <a onClick="return mV(\'Isa\',32,1);">Isa 32:1</a>: "Behold, a king shall reign in righteousness, and princes shall rule in justice." Judicial power is included (compare <a onClick="return mV(\'Exd\',2,14);">Ex 2:14</a>: "Who made thee a prince and a judge over us?" and <a onClick="return mV(\'Psa\',148,11);">Ps 148:11</a>: "princes and all judges of the earth"). In some passages the word sar, having been rendered "prince," stands for "chief"; so <a onClick="return mV(\'Jdg\',7,25);">Jud 7:25</a>: "They took the two princes of Midian" (compare <a onClick="return mV(\'Jdg\',8,14);">Jud 8:14</a>; <a onClick="return mV(\'1Sa\',29,4);">1Sa 29:4</a>; <a onClick="return mV(\'2Sa\',10,3);">2Sa 10:3</a>, etc.).<P>(b) To royal officers of a high rank: <a onClick="return mV(\'Gen\',12,15);">Ge 12:15</a>: "the princes of Pharaoh" (compare <a onClick="return mV(\'2Ki\',24,14);">2Ki 24:14</a>: "Jerus and all the princes"; <a onClick="return mV(\'1Ch\',29,24);">1Ch 29:24</a>; <a onClick="return mV(\'2Ch\',24,23);">2Ch 24:23</a>; <a onClick="return mV(\'Jer\',36,21);">Jer 36:21</a>; <a onClick="return mV(\'Jer\',52,10);">52:10</a>; <a onClick="return mV(\'Hsa\',5,10);">Ho 5:10</a>, etc.). "Ambassadors" (<a onClick="return mV(\'Jer\',36,14);">Jer 36:14</a>); "governors" (<a onClick="return mV(\'1Ki\',20,14);">1Ki 20:14</a> "By the young men (margin "or, servants") of the princes of the provinces"; compare <a onClick="return mV(\'Est\',1,3,14);">Es 1:3,14</a>, "the seven princes"); "the chief of the eunuchs" (<a onClick="return mV(\'Dan\',1,7);">Da 1:7</a>); a "quartermaster" (<a onClick="return mV(\'Jer\',51,59);">Jer 51:59</a> "Seraiah was chief chamberlain" (margin "or, quartermaster")). The King James Version renders it "a quiet prince," i.e. a prince having rest, instead of procuring rest (sar menuchah, "a sar of rest"). In post-exilic times: <a onClick="return mV(\'Ezr\',9,1);">Ezr 9:1</a>: "The princes drew near unto me." They were the political leaders of the people (compare <a onClick="return mV(\'Ezr\',10,8);">Ezr 10:8</a>: "the princes and the elders"; <a onClick="return mV(\'Neh\',9,38);">Ne 9:38</a>: "our princes, our Levites, and our priests"; <a onClick="return mV(\'Neh\',11,1);">Ne 11:1</a>: "The princes of the people dwelt in Jerus"; <a onClick="return mV(\'Neh\',12,31);">Ne 12:31</a>: "the princes of Judah"). Of course, they were all subject to the authority of the Persian kings.<P>(c) To the priesthood: <a onClick="return mV(\'1Ch\',24,5);">1Ch 24:5</a>: "princes of the sanctuary, and princes of God" (of <a onClick="return mV(\'Isa\',43,28);">Isa 43:28</a>).<P>(d) On account of great achievements: <a onClick="return mV(\'2Sa\',3,38);">2Sa 3:38</a>: "Know ye not that there is a prince and a great man fallen this day in Israel?"—an honorary title. Generally speaking, a prince is a wealthy man (compare <a onClick="return mV(\'Job\',34,19);">Job 34:19</a>: "That respecteth not the persons of princes, nor regardeth the rich more than the poor"), and he is a prominent man embodying true, although mortal, manhood (compare <a onClick="return mV(\'Psa\',82,7);">Ps 82:7</a>: "Nevertheless ye shall die like men, and fall like one of the princes).<P>(2) nasi\':usually derived from nasa\', "to lift," hence, "exalted"; otherwise: a "speaker."<P>(a) An honorary title (compare <a onClick="return mV(\'Gen\',23,6);">Ge 23:6</a>: "Thou art a prince of God among us." The distinction is conferred upon Abraham by the children of Heth).<P>(b) A name given to the heads of the Israelite tribes, families and fathers\' houses: <a onClick="return mV(\'Num\',3,24);">Nu 3:24</a>: "the prince of the fathers\' house of the Gershonites" (compare <a onClick="return mV(\'Num\',3,30,35);">3:30,35</A>); <a onClick="return mV(\'Num\',3,32);">3:32</A>: "Eleazar...shall be prince of the princes of the Levites, and have the oversight of them that keep the charge of the sanctuary"; <a onClick="return mV(\'Num\',4,34);">Nu 4:34</a>: "the princes of the congregation." They seem to be identical with the "rulers of thousands, rulers of hundreds, rulers of fifties, and rulers of tens" (compare <a onClick="return mV(\'Exd\',18,21);">Ex 18:21</a>; <a onClick="return mV(\'Num\',16,2);">Nu 16:2</a>). <a onClick="return mV(\'Num\',7,2);">Nu 7:2</a>: "the princes of Israel, the heads of their fathers\' houses...the princes of the tribes" (compare <a onClick="return mV(\'Num\',7,2,6);">17:2,6</A>; <a onClick="return mV(\'Num\',34,18);">34:18</A>; <a onClick="return mV(\'Jos\',22,14);">Jos 22:14</a>; <a onClick="return mV(\'1Ch\',4,38);">1Ch 4:38</a>).<P>(c) Equivalent to chief or king: <a onClick="return mV(\'Gen\',17,20);">Ge 17:20</a>: "Twelve princes shall he beget" (compare <a onClick="return mV(\'Gen\',25,16);">25:16</A>); <a onClick="return mV(\'Gen\',34,2);">Ge 34:2</a>: "Shechem the son of Hamor the Hivite, the prince of the land"; <a onClick="return mV(\'Num\',25,18);">Nu 25:18</a>: "Cozbi, the daughter of the prince of Midian" (compare <a onClick="return mV(\'Jos\',13,21);">Jos 13:21</a>); <a onClick="return mV(\'1Ki\',11,34);">1Ki 11:34</a>: "I will make him prince all the days of his life." This was said of Solomon, which shows the term equivalent to king. Of special interest is the use of the word nasi\' in Ezekiel. The name is given to the Jewish king (compare <a onClick="return mV(\'Eze\',12,10);">12:10</A>: "This burden concerneth the prince in Jerusalem"). Then, again, it is applied to the future theocratic king (compare <a onClick="return mV(\'Eze\',34,24);">34:24</A>; <a onClick="return mV(\'Eze\',37,25);">37:25</a>, etc., and especially chapters <a onClick="return mV(\'Eze\',45,\'1-\');">45</a>; <a onClick="return mV(\'Eze\',46,\'1-\');">46</a>). It is also used of foreign potentates and high officers (compare <a onClick="return mV(\'Eze\',26,16);">26:16</a>: "the princes of the sea"; <a onClick="return mV(\'Eze\',28,2);">28:2</A>: "the prince of Tyre"; <a onClick="return mV(\'Eze\',30,13);">30:13</A>: "a prince from the land of Egypt"); <a onClick="return mV(\'Eze\',32,29);">32:29</A>: "Edom, her kings and all her princes"; and, likewise, of high Jewish officers (<a onClick="return mV(\'Eze\',21,12);">21:12</A>).<P>(d) A title bestowed upon Sheshbazzar (<a onClick="return mV(\'Ezr\',1,8);">Ezr 1:8</a>).<P>(3) nadhibh: <a onClick="return mV(\'1Sa\',2,8);">1Sa 2:8</a>: "To make them sit with princes" (compare <a onClick="return mV(\'Psa\',113,8);">Ps 113:8</a>). The original meaning of the term is willing or obliging; then generous ("liberal"; compare <a onClick="return mV(\'Pro\',19,6);">Pr 19:6</a>: "Many will entreat the favor of the liberal man"; yet, it might safely be rendered here "prince", margin) or noble-minded; a gentleman, a nobleman, a person of rank, a prince. <a onClick="return mV(\'Job\',12,21);">Job 12:21</a>: "He poureth contempt upon princes" (compare <a onClick="return mV(\'Psa\',107,40);">Ps 107:40</a>); <a onClick="return mV(\'Job\',21,28);">Job 21:28</a>: "Where is the house of the prince? And where is the tent wherein the wicked dwelt?" The context here suggests the thought of a wicked prince, a tyrant. <a onClick="return mV(\'Psa\',47,9);">Ps 47:9</a>: "The princes of the peoples are gathered together" (compare <a onClick="return mV(\'Psa\',118,9);">Ps 118:9</a>; <a onClick="return mV(\'Psa\',146,3);">146:3</a>; <a onClick="return mV(\'Pro\',17,7);">Pr 17:7</a>; <a onClick="return mV(\'Pro\',25,7);">25:7</a>; <a onClick="return mV(\'Sgs\',7,1);">So 7:1</a>).<P>(4) naghidh: According to Gesenius, this term denotes originally either a high-minded person (compare the preceding word, nadhibh) or a speaker, a spokesman; then a prince, a king. <a onClick="return mV(\'1Sa\',13,14);">1Sa 13:14</a>: "Yahweh hath appointed him to be prince over his people" (compare <a onClick="return mV(\'2Sa\',5,2);">2Sa 5:2</a>: "Thou shalt be prince (the Revised Version margin "leader") over Israel"; <a onClick="return mV(\'2Sa\',6,21);">6:21</A>; <a onClick="return mV(\'2Sa\',7,8);">7:8</A>; <a onClick="return mV(\'1Ki\',1,35);">1Ki 1:35</a>; <a onClick="return mV(\'1Ki\',14,7);">14:7</a>; <a onClick="return mV(\'1Ki\',16,2);">16:2</a>; <a onClick="return mV(\'Job\',29,9);">Job 29:9</a>; <a onClick="return mV(\'Job\',31,37);">31:37</a>; <a onClick="return mV(\'Psa\',76,12);">Ps 76:12</a>; <a onClick="return mV(\'Pro\',28,16);">Pr 28:16</a>; <a onClick="return mV(\'Eze\',28,2);">Eze 28:2</a>: "prince of Tyre"; <a onClick="return mV(\'Dan\',9,25);">Da 9:25</a>: "the anointed one, the prince," the King James Version the "Messiah the Prince"; <a onClick="return mV(\'Dan\',9,26);">Da 9:26</a>: "the prince that shall come" (the Roman emperor?); <a onClick="return mV(\'Dan\',11,22);">11:22</a>: "the prince of the covenant" (either a high priest or some Egyptian king, Ptolemeus Philometor?).<P>(5), (6) razon, and rozen, "a high official," "a prince," usually associated with the word "king" or "judge." <a onClick="return mV(\'Pro\',14,28);">Pr 14:28</a>: "In the multitude of people is the king\'s glory; but in the want of people is the destruction of the prince" (razon); <a onClick="return mV(\'Jdg\',5,3);">Jud 5:3</a>: "Hear, O ye kings; give ear, O ye princes" (rozenim); <a onClick="return mV(\'Pro\',8,15);">Pr 8:15</a>: "By me kings reign, and princes (rozenim) decree justice" (compare <a onClick="return mV(\'Pro\',31,4);">31:4</A>; <a onClick="return mV(\'Hab\',1,10);">Hab 1:10</a>); <a onClick="return mV(\'Isa\',40,23);">Isa 40:23</a>: "that bringeth princes (rozenim) to nothing; that maketh the judges of the earth as vanity."<P>(7) nacikh, derived from nacakh, "to install a king" (compare <a onClick="return mV(\'Psa\',2,6);">Ps 2:6</a>); hence, a prince: <a onClick="return mV(\'Jos\',13,21);">Jos 13:21</a>: "the princes of Sihon" (compare <a onClick="return mV(\'Psa\',83,11);">Ps 83:11</a>); <a onClick="return mV(\'Eze\',32,30);">Eze 32:30</a>: "the princes of the north"; <a onClick="return mV(\'Mic\',5,5);">Mic 5:5</a>: the Revised Version (British and American) "principal men," the Revised Version margin "princes among men"; <a onClick="return mV(\'Dan\',11,8);">Da 11:8</a>: the Revised Version (British and American) "molten images," the Revised Version margin "princes."<P>(8) qatsin, "a judge," "a military leader," "a prince"; <a onClick="return mV(\'Dan\',11,18);">Da 11:18</a>: "A prince (the Revised Version margin "captain") shall cause the reproach...to cease" (probably a Roman consul; a Roman general?).<P>(9) shalish: The usual explanation, "one of the three men on a war-chariot" is highly improbable; Gesenius suggests that it is a loan-word, and renders it "hero." <a onClick="return mV(\'Eze\',23,15);">Eze 23:15</a>: "All of them princes to look upon" ("picked men," Gesenius).<P>(10) chashmannim: <a onClick="return mV(\'Psa\',68,31);">Ps 68:31</a>: "Princes shall come out of Egypt." Septuagint renders it presbeis, "ambassadors," Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) legati. But the meaning is uncertain.`<a href="./study/isbe/search.html?string=GOVERNOR">GOVERNOR</a>`8';
isbe[7098]='Princes, the Seven`prin\'-sez, -siz.`<a href="./study/isbe/search.html?string=PRINCE">PRINCE</a>`1';
isbe[7099]='Princess`prin\'-ses: The Hebrew term is sarah (compare sar, prince, and "Sarah"); it means<P>(1) a queen (<a onClick="return mV(\'Isa\',49,23);">Isa 49:23</a>, the King James Version and the Revised Version (British and American) both "queen");<P>(2) the consort of a king contrasted with his concubines (<a onClick="return mV(\'1Ki\',11,3);">1Ki 11:3</a>, "He had seven hundred wives. princesses, and three hundred concubines");<P>(3) the wife of a prince (<a onClick="return mV(\'Est\',1,18);">Es 1:18</a> the "princesses of Persia and Media");<P>(4) it is metaphorically used of the city of Jerusalem (<a onClick="return mV(\'Lam\',1,1);">La 1:1</a>).``1';
isbe[7100]='Principal`prin\'-si-pal: Appears in the King James Version as a translation of nine Hebrew words (fewer in the Revised Version (British and American)), in one case (<a onClick="return mV(\'Isa\',28,25);">Isa 28:25</a>) being used quite wrongly and in <a onClick="return mV(\'2Ki\',25,19);">2Ki 25:19</a> (<a onClick="return mV(\'Jer\',52,25);">Jer 52:25</a>); <a onClick="return mV(\'1Ch\',24,31);">1Ch 24:31</a> gives a wrong sense (all corrected in the Revised Version (British and American)). In <a onClick="return mV(\'1Ki\',4,5);">1Ki 4:5</a>, "principal officer" (the American Standard Revised Version "chief minister") is an arbitrary translation of kohen to avoid "priest" (so the English Revised Version; compare <a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a>).``1';
