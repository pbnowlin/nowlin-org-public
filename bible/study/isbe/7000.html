teries can frequently be located by these sherds. The potter\'s field mentioned in <a onClick="return mV(\'Mat\',27,7,10);">Mt 27:7,10</a> was probably a field near a pottery strewn with potsherds, thus making it useless for cultivation although useful to the potter as a place in which to weather his clay or to dry his pots before firing.<P>4. Uses:<P>Pottery was used in ancient times for storing liquids, such as wine or oil, fruits, grains, etc. The blackened bottoms of pots of the Jewish period show that they were used for cooking. Earthenware dishes were also used for boiling clothes. Every one of these uses still continues. To one living in Bible lands today it seems inconceivable that the Hebrews did not readily adopt, as some writers disclaim, the porous earthen water jars which they found already in use in their new country. Such jars were used for carrying live coals to start a fire, and not only for drawing water, as they are today, but for cooling it (<a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a>). The evaporation of the water which oozes through the porous material cools down the contents of a jar, whereas a metal or leathern vessel would leave it tepid or tainted. They were also used for holding shoemaker\'s glue or wax; for filling up the cracks of a wall before plastering; ground up they are used as sand in mortar.<P>5. Biblical Terms:<P>Only a few of the Hebrew words for vessels of different sorts, which in all probability were made of pottery, have been translated by terms which indicate that fact (For cheres, and yatsar, see <a href="./study/isbe/search.html?string=EARTHEN+VESSELS">EARTHEN VESSELS</a>; <a href="./study/isbe/search.html?string=OSTRACA">OSTRACA</a>.) kadh, is translated "pitcher" in <a onClick="return mV(\'Gen\',24,14);">Ge 24:14</a>ff; <a onClick="return mV(\'Jdg\',7,16);">Jud 7:16</a>ff; <a onClick="return mV(\'Ecc\',12,6);">Ec 12:6</a> (compare keramion, <a onClick="return mV(\'Mar\',14,13);">Mr 14:13</a>; <a onClick="return mV(\'Luk\',22,10);">Lu 22:10</a>); "jar" in <a onClick="return mV(\'1Ki\',17,12);">1Ki 17:12</a> (compare hudria, <a onClick="return mV(\'Jhn\',4,28);">Joh 4:28</a>). The kadh corresponded in size and use to the Arabic jarrah (compare English derivative "jar"). The jarrah is used for drawing and storing water and less frequently for holding other liquids or solids. It is used as an proximate standard of measure. For example, a man estimates the capacity of a cistern in jirar (plural of jarrah). baqbuq, "a bottle," usually leathern, but in <a onClick="return mV(\'Jer\',19,1,10);">Jer 19:1,10</a> of pottery. This may have been like the Arabic ibriq, which causes a gurgling sound when liquid is turned from it. Baqbuq is rendered "cruse" in <a onClick="return mV(\'1Ki\',14,3);">1Ki 14:3</a>.<P>keli "vessel," was of wood, metal or earthen-ware in <a onClick="return mV(\'Lev\',6,28);">Le 6:28</a>; <a onClick="return mV(\'Psa\',2,9);">Ps 2:9</a>; <a onClick="return mV(\'Psa\',31,12);">31:12</a>; <a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a>; <a onClick="return mV(\'Jer\',19,11);">Jer 19:11</a>, etc.; compare ostrakinos, <a onClick="return mV(\'2Cr\',4,7);">2Co 4:7</a>, etc.<P>pakh, is translated "vial" in <a onClick="return mV(\'1Sa\',10,1);">1Sa 10:1</a>; <a onClick="return mV(\'2Ki\',9,1);">2Ki 9:1</a>; see so-called pilgrim bottles.<P>koc also qasah "cup" or "bowl," translated "cup" in many passages, like Arabic ka\'s, which was formerly used for drinking instead of modern cups.<P>gabhia, translated "bowl" in <a onClick="return mV(\'Jer\',35,5);">Jer 35:5</a>.<P>parur, translated "pots" in <a onClick="return mV(\'Num\',11,8);">Nu 11:8</a>; compare <a onClick="return mV(\'Jdg\',6,19);">Jud 6:19</a>; <a onClick="return mV(\'1Sa\',2,14);">1Sa 2:14</a>; compare chutra, which is similar to Arabic.<P>kidr, commonly used for cooking today.<p>\'etsebh, "pot," <a onClick="return mV(\'Jer\',22,28);">Jer 22:28</a> the American Revised Version margin.<P>6. Archaeological Significance:<P>The chemical changes wrought in clay by weathering and firing render it practically indestructible when exposed to the weather and to the action of moisture and the gaseous and solid compounds found in the soil. When the sun-baked brick walls of a Palestinian city crumbled, they buried, often intact, the earthenware vessels of the period. In the course of time, perhaps after decades or centuries, another city was built on the debris of the former. The brick walls required no digging for foundations, and so the substrata were left undisturbed. After long periods of time the destruction, by conquering armies or by neglect, of succeeding cities, produced mounds rising above the surrounding country, sometimes to a height of 60 or 100 ft. A typical example of such a mound is Tell el-Chesy (? Lachish). Dr. Flinders Petrie, as a result of the study of the various strata of this mound, has formed the basis of a classification of Palestinian pottery (see 2, above). With a knowledge of the forms of pottery of each period, the excavator has a guide, though not infallible, to the date of the ruins he finds.<P>Figurative: The shaping of clay into pottery typified the molding of the characters of individuals or nations by a master mind (<a onClick="return mV(\'Jer\',18,\'1-6\');">Jer 18:1-6</a>; <a onClick="return mV(\'Isa\',29,16);">Isa 29:16</a>; <a onClick="return mV(\'Isa\',45,9);">45:9</a>; <a onClick="return mV(\'Isa\',64,8);">64:8</a>; <a onClick="return mV(\'Rom\',9,20);">Ro 9:20</a>); commonplace (<a onClick="return mV(\'Lam\',4,2);">La 4:2</a>; <a onClick="return mV(\'2Ti\',2,20);">2Ti 2:20</a>); frailness (<a onClick="return mV(\'Psa\',2,9);">Ps 2:9</a>; <a onClick="return mV(\'Isa\',30,14);">Isa 30:14</a>; <a onClick="return mV(\'Jer\',19,11);">Jer 19:11</a>; <a onClick="return mV(\'Dan\',2,41);">Da 2:41</a>; <a onClick="return mV(\'2Cr\',4,7);">2Co 4:7</a>; <a onClick="return mV(\'Rev\',2,27);">Re 2:27</a>).<P>LITERATURE.<P>Publications of PEF, especially Bliss and Macalister, Excavations in Palestine; Excavations of Gezer; Bliss, A Mound of Many Cities; Flinders Petrie, Tell el-Ghesy; Bliss and Dickie, Excavations at Jerusalem; Perrot and Chipiez, History of Art (i) in Chaldea and Assyria, (ii) Sardinia and Judea, (iii) Cyprus and Phoenicia, (iv) Egypt; King and Hall, Egypt and Western Asia in Light of Modern Discoveries; S. Birch, History of Ancient Pottery; Wilkinson, The Ancient Egyptians; PEFQ; EB; HDB.`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`133';
isbe[7054]='Pound`pound (maneh; mna, litra; Latin, libra): Pound does not correctly represent the Hebrew maneh, which was more than a pound (see <a href="./study/isbe/search.html?string=MANEH">MANEH</a>). The litra of <a onClick="return mV(\'Jhn\',12,3);">Joh 12:3</a> and <a onClick="return mV(\'Jhn\',19,39);">19:39</a> is the Roman pound (libra) of 4,950 grains, which is less than a pound troy, being about 10 1/3 oz. In a monetary sense (its use in <a onClick="return mV(\'Luk\',19,\'13-25\');">Lu 19:13-25</a>) it is the mna, or maneh, which was either of silver or gold, the former, which is probably the one referred to by Luke, being equal to 6,17 British pounds, or about $33 (in 1915); the latter 102,10 British pounds or $510 (in 1915).<P>Figurative: "Pound," like "talent," is used in the New Testament for intellectual gifts and spiritual endowments, as in the passage given above.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`138';
isbe[7055]='Poverty`pov\'-er-ti:<P>1. Old Testament References:<P>This word, found but once in the Old Testament (<a onClick="return mV(\'Gen\',45,11);">Ge 45:11</a>) outside of the Book of Proverbs in which it occurs 11 times (<a onClick="return mV(\'Pro\',6,11);">6:11</a>; <a onClick="return mV(\'Pro\',10,15);">10:15</a>; <a onClick="return mV(\'Pro\',11,24);">11:24</A> the King James Version; <a onClick="return mV(\'Pro\',13,18);">13:18</a>; <a onClick="return mV(\'Pro\',20,13);">20:13</A>; <a onClick="return mV(\'Pro\',23,21);">23:21</a>; <a onClick="return mV(\'Pro\',24,34);">24:34</a>; <a onClick="return mV(\'Pro\',28,19,22);">28:19,22</A> the King James Version; <a onClick="return mV(\'Pro\',30,8);">30:8</a>; <a onClick="return mV(\'Pro\',31,7);">31:7</a>), is a translation of yiwaresh, "to be poor," "to come to poverty" (<a onClick="return mV(\'Gen\',45,11);">Ge 45:11</a>). Four different Hebrew words are used in the 11 references in Prov, all bearing the idea of being in need of the necessities of life, although a distinction is made between being in want and being in extreme want. <a onClick="return mV(\'Pro\',18,23);">Pr 18:23</a> well illustrates the general meaning of "poverty" as found in this book: "The poor (rush, "to be impoverished," "destitute") useth entreaties; but the rich answereth roughly."<P>2. New Testament References<P>"Poverty" occurs 3 times in the New Testament (<a onClick="return mV(\'2Cr\',8,2,9);">2Co 8:2,9</a>; <a onClick="return mV(\'Rev\',2,9);">Re 2:9</a>) and is the translation of ptocheia, "to be reduced to a state of beggary or pauperism."<P>The teaching of the Bible on this subject would, however, be incomplete unless all the references to the "poor" were considered in this connection. Indeed the word for "poverty" has its root in the word for "poor" (ptochos; \'ani, or dal).<P>3. Two Degrees of Poverty:<P>At least two degrees of poverty are recognized. The Old Testament does not distinguish between them as clearly as does the New Testament. The New Testament, for example, by its use of two words for "poor" sets forth this distinction. In <a onClick="return mV(\'2Cr\',9,9);">2Co 9:9</a>, "he hath given to the poor," the word used is penes, which does not indicate extreme poverty, but simply a condition of living from hand to mouth, a bare and scant livelihood, such as that made by the widow who cast her two mites into the treasury (<a onClick="return mV(\'Luk\',21,2);">Lu 21:2</a>); while in such passages as <a onClick="return mV(\'2Cr\',6,10);">2Co 6:10</a>: "As poor, yet making many rich," and <a onClick="return mV(\'Luk\',6,20);">Lu 6:20</a>: "Blessed are ye poor" (ptochoi, a condition is indicated of abject beggary, pauperism, such as that in which we find Lazarus who was laid at the gate of the rich man\'s palace, begging even the crumbs which fell from the table of the rich man (<a onClick="return mV(\'Luk\',16,20,21);">Lu 16:20,21</a>). It was into this latter condition that Christ voluntarily entered for our sakes: "For ye know the grace of our Lord Jesus Christ, that, though he was rich, yet for your sakes he became poor (a mendicant, a beggar), that ye through his poverty might become rich" (<a onClick="return mV(\'2Cr\',8,9);">2Co 8:9</a>). Between 30 and 40 times in the New Testament this latter word is used.<P>4. Causes of Poverty:<P>The causes of poverty are failure of harvest and poor crops (<a onClick="return mV(\'Neh\',5,\'1-3\');">Ne 5:1-3</a>); devastation caused by enemies sweeping through the land; the oppression of the people by their own rulers (<a onClick="return mV(\'Isa\',5,8);">Isa 5:8</a>); excessive interest, usury (<a onClick="return mV(\'Neh\',5,\'1-5\');">Ne 5:1-5</a>); persecution because of the faith (<a onClick="return mV(\'2Cr\',6,\'1-\');">2Co 6</a>; <a onClick="return mV(\'2Cr\',8,\'1-\');">8</a>). Widows and orphans by reason of their desolate condition were in a special sense subject to poverty. Gluttony brings poverty (<a onClick="return mV(\'Pro\',23,21);">Pr 23:21</a>), as does indolence (<a onClick="return mV(\'Pro\',28,19);">Pr 28:19</a>).<P>God commanded His people to care for the poor. The exhortations to relieve poverty are numerous, especially in the Pentateuch. Those in poverty must be treated with kindness (<a onClick="return mV(\'Deu\',15,\'7-11\');">De 15:7-11</a>); must be allowed to glean in the vineyards (<a onClick="return mV(\'Lev\',19,10);">Le 19:10</a>); to reap the harvest (<a onClick="return mV(\'Lev\',23,22);">Le 23:22</a>; compare <a onClick="return mV(\'Rth\',2,\'14-16\');">Ru 2:14-16</a>); must not be neglected (<a onClick="return mV(\'Pro\',28,27);">Pr 28:27</a>); nor dealt with harshly (<a onClick="return mV(\'Amo\',8,\'4-6\');">Am 8:4-6</a>); must be treated as equal before God (<a onClick="return mV(\'Pro\',22,2);">Pr 22:2</a>); are to share in our hospitality (<a onClick="return mV(\'Luk\',14,13,21);">Lu 14:13,21</a>). Indeed, the truth or falsity of a man\'s religion is to be tested, in some sense at least, by his relation to those in need (<a onClick="return mV(\'Jam\',1,27);">Jas 1:27</a>). The year of Jubilee was intended to be of great benefit to the poor by restoring to them any possessions which they, by reason of their poverty, had been compelled to deed over to their creditors (<a onClick="return mV(\'Lev\',25,\'25-54\');">Le 25:25-54</a>; <a onClick="return mV(\'Deu\',15,\'12-15\');">De 15:12-15</a>). God required certain tithes from His people which were to be devoted to the helping of the poor and needy (<a onClick="return mV(\'Deu\',14,28);">De 14:28</a>; <a onClick="return mV(\'Deu\',26,12,13);">26:12,13</a>). So in the New Testament the apostles lay special emphasis upon remembering the poor in the matter of offerings. Paul, especially, inculcated this duty upon the churches which he had rounded (<a onClick="return mV(\'Rom\',15,26);">Ro 15:26</a>; <a onClick="return mV(\'Gal\',2,10);">Ga 2:10</a>). The attitude of the early Christian church toward its poor is amply illustrated in that first attempt at communism in <a onClick="return mV(\'Act\',2,\'1-\');">Ac 2</a>; <a onClick="return mV(\'Act\',4,\'1-\');">4</a>. James, in his Epistle, stingingly reminds his readers of the fact that they had grossly neglected the important matter of caring for the poor (chapter <a onClick="return mV(\'Jam\',2,\'1-\');">2</a>). Indeed, so strong is he in his plea for the care of the poor that he claims that the man who willfully neglects the needy thereby proves that the love of God has no place in his heart, and that he has consequently no real faith in God (<a onClick="return mV(\'Jam\',2,\'14-26\');">2:14-26</a>). Christians are exhorted to abound in the grace of hospitality, which, of course, is nothing less than kindness to those in need (<a onClick="return mV(\'Rom\',12,13);">Ro 12:13</a>; <a onClick="return mV(\'1Ti\',6,18);">1Ti 6:18</a>; <a onClick="return mV(\'1Jo\',3,17);">1Joh 3:17</a>).<P>The happiest mother and the noblest and holiest son that ever lived were among the poor. Jesus was born of poor parents, and had not where to lay His head (<a onClick="return mV(\'Mat\',8,20);">Mt 8:20</a>), no money with which to pay tribute (<a onClick="return mV(\'Mat\',17,27);">Mt 17:27</a>), no home to call His own (<a onClick="return mV(\'Jhn\',7,53);">Joh 7:53</a>; compare <a onClick="return mV(\'Jhn\',8,1);">Joh 8:1</a>), and was buried in a borrowed grave (<a onClick="return mV(\'Mat\',27,\'57-61\');">Mt 27:57-61</a>).<P>Figurative: Of course there is also a spiritual poverty indicated by the use of this word—a poverty in spiritual things: "Blessed are the poor in spirit." By this is meant, Blessed are they who feel that they have no self-righteousness, no worth of their own to present to Christ as a ground of their salvation, who feel their utter bankruptcy of spirit, who say "Nothing in my hand I bring." It is to this state of spirit that Christ refers in <a onClick="return mV(\'Rev\',3,17);">Re 3:17</a>: "Because thou sayest, I am rich, and have gotten riches, and have need of nothing; and knowest not that thou art the wretched one and miserable and poor and blind and naked."`<a href="./study/isbe/search.html?string=POOR">POOR</a>`53';
isbe[7056]='Powders`pou\'-derz (\'abheqath rokhel): The "powders of the merchant" in <a onClick="return mV(\'Sgs\',3,6);">So 3:6</a> were probably perfumes, as they are associated with myrrh and frankincense in the account of the festal procession of the litter of Solomon. They may have been some sweet-scented wood in powder, or else some form of incense.``1';
isbe[7057]='Power`pou\'-er: This word, indicative of might, strength, force, is used in the Old Testament to render very many Hebrew terms, the translation in numerous instances being varied in the Revised Version (British and American) to words like "valor," "rule," "strength," "might," "dominion." The principal words for "power" in the New Testament are dunamis, and exousia. In the latter case the Revised Version (British and American) frequently changes to "authority" (<a onClick="return mV(\'Mar\',3,15);">Mr 3:15</a>; <a onClick="return mV(\'Mar\',6,7);">6:7</a>; <a onClick="return mV(\'Eph\',1,21);">Eph 1:21</a>, etc.) or "right" (<a onClick="return mV(\'Rom\',9,21);">Ro 9:21</a>; <a onClick="return mV(\'1Cr\',9,6);">1Co 9:6</a>; <a onClick="return mV(\'2Th\',3,9);">2Th 3:9</a>, etc.). Power is attributed preeminently to God (<a onClick="return mV(\'1Ch\',29,11);">1Ch 29:11</a>; <a onClick="return mV(\'Job\',26,14);">Job 26:14</a>; <a onClick="return mV(\'Psa\',66,7);">Ps 66:7</a>; <a onClick="return mV(\'Psa\',145,11);">145:11</a>; <a onClick="return mV(\'Rev\',7,12);">Re 7:12</a>, etc.). On this attribute of power of God, see <a href="./study/isbe/search.html?string=OMNIPOTENCE">OMNIPOTENCE</a>. The supreme manifestation of the power, as of the wisdom and love of God, is in redemption (<a onClick="return mV(\'1Cr\',1,18,24);">1Co 1:18,24</a>). The preaching of the gospel is accompanied by the power of the Holy Spirit (<a onClick="return mV(\'1Cr\',2,4);">1Co 2:4</a>; <a onClick="return mV(\'1Th\',1,5);">1Th 1:5</a>, etc.). Miracles, as "mighty works," are denoted by the term "powers" (so <a onClick="return mV(\'Mat\',11,21,23);">Mt 11:21,23</a> the Revised Version margin, etc.). The end of all time\'s developments is that God takes to Him His great power and reigns (<a onClick="return mV(\'Rev\',11,17);">Re 11:17</a>).``132';
isbe[7058]='Power of Keys``<a href="./study/isbe/search.html?string=KEYS,+POWER+OF+THE">KEYS, POWER OF THE</a>`1';
isbe[7059]='Praetorian Guard`pre-to\'-ri-an: "My bonds in Christ are manifest in all the palace, and in all other, places" (<a onClick="return mV(\'Phl\',1,13);">Php 1:13</a> the King James Version). This verse is translated in the Revised Version (British and American), "My bonds became manifest in Christ throughout the whole praetorian guard, and to all the rest," and is noteworthy.<P>1. Pretorium in Philippians—Usual View:<P>It has been usual to connect the words, "the soldier that guarded him," <a onClick="return mV(\'Act\',28,16);">Ac 28:16</a>, with this statement in <a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>, that the apostle\'s bonds were manifest in the whole praetorium, and to understand that the former was the cause of the latter; that the result of Paul\'s making the gospel known in his own hired house to those soldiers to one of whom he was chained by the wrist day and night, was that it became known in all the praetorian regiment that his bonds were endured for Christ\'s sake, that it was for conscience\' sake that he was suffering wrongfully, that he was no wrongdoer but a prisoner of Jesus Christ. In this way the gospel would spread through the whole of the praetorian guard in that regiment\'s headquarters which were situated in a permanent camp established by Tiberius in Rome, outside the Colline Gate, at the northeast of the city. This verse would also mean that the gospel had been proclaimed in the same way to those members of the praetorian guard who were on duty as the bodyguard of the emperor and who were lodged in one of the buildings which adjoined the emperor\'s palace on the Palatine Hill.<P>2. Lightfoot on Interpretations:<P>Thus, Lightfoot, discussing the meaning of the phrase "in the whole praetorium" (Commentary on Philippians, 99ff), reviews the different interpretations which have been given of the word, and shows<P>(1) that no instance is to be found of its signifying Nero\'s palace on the Palatine Hill;<P>(2) that there is no authority for the interpretation which would make it mean the praenterinn barracks on the Palatine;<P>(3) that neither is there any authority for making it mean the praetorian camp outside the walls of Rome. In Lightfoot\'s words (op. cit., 101), "All attempts to give a local sense to \'praetorium\' thus fail for want of evidence." Lightfoot accordingly defends the interpretation, "the praetorian guard," and the Revised Version (British and American), above cited, follows him in this.<P>3. View of Mommsen and Ramsay:<P>One of the meanings of "praetorium" is a council of war, the officers who met in the general\'s tent (see <a href="./study/isbe/search.html?string=PRAETORIUM">PRAETORIUM</a>). Lightfoot is very decided in interpreting "praetorium" to mean the praetorian regiment, the imperial guards, and he adds, "in this sense and in this alone can it be safely affirmed that the apostle would hear the word praetorium used daily," and that this sense is in all respects appropriate. But the other meaning, though not appropriate here, namely, a council of war composed of the officers and their general, is much nearer to that which is now accepted by such authorities as Mommsen and Sir W.M. Ramsay, who hold that in this passage "praetorium" means a council, not of war, however, but the council of judgment, the emperor\'s court of appeal in which he was assisted by his legal assessors (see Mommsen, Berlin Akad. Sitzungsber.,1895,501; Ramsay, Paul the Traveler and the Rein Citizen, 357; Workman, Persecution in the Early Church, 35). Over this court there presided the emperor or his delegate, the prefect of the praetorian guard, and associated with him were twenty assessors selected from the senators. Formerly their votes were taken by ballot, but Nero preferred to receive from each a written opinion and on the next day to deliver his judgment in person. Such, it is now believed, is the praetorium to which Paul refers.<P>The meaning, therefore, of the words, "My bonds in Christ are manifest in the whole praetorium," will be that when Paul wrote the Epistle to the Philippians his first Roman trial was already so far advanced that he had been able to impress upon his judges, the twenty assessors and their president, the fact that he was no evildoer, but that the sole cause of his imprisonment was his loyalty to Christ. It was manifest to all the members of the emperor\'s court of appeal that Paul was enduring his long imprisonment, suffering wrongfully, but only for the sake of Jesus Christ.<P>4. Bearing on Paul\'s Captivity and Trial:<P>The important bearing will be seen which this signification of "praetorium" in this passage has on the question of the order in which Ephesians, Philippians, Colossians and Philemon—the epistles of Paul\'s captivity in Rome—were written. On subjective evidence Lightfoot concludes that Philippians is the earliest of them, basing his opinion largely on the resemblance which exists in many particulars between the thoughts and expressions in Philippians and in the Epistle to the Romans, making Philippians, as it were, a connecting link between Paul\'s earlier and his later epistles. See Lightfoot, Philipplans, 42f; he writes: "These resemblances suggest as early a date for the Epistle to the Philippians as circumstances will allow," earlier, that is, than Colossians and Ephesians. But Lightfoot\'s argument is set aside by the new light which has been thrown upon the real meaning of "praetorium." Sir W.M. Ramsay (St. Paul the Traveler, 357) writes: "The trial seems to have occurred toward the end of AD 61. Its earliest stages were over before Paul wrote to the Philipplans, for he says, \'The things which happened unto me have fallen out rather unto the progress of the Good News; so that my bonds became manifest in Christ in the whole Pretorium, and to all the rest; and that most of the Brethren in the Lord, being confident in my bonds, are more abundantly bold to speak the word of God without fear.\' This passage has been generally misconceived and connected with the period of imprisonment; and here again we are indebted to Mommsen for the proper interpretation. The Praetorum is the whole body of persons connected with the sitting in judgment, the supreme Imperial Court, doubtless in this case the Prefect or both Prefects of the Praetorian Guard, representing the emperor in his capacity as the fountain of justice, together with the assessors and high officers of the court. The expression of the chapter as a whole shows that the trial is partly finished, and the issue as yet is so favorable that the Brethren are emboldened by the success of Paul\'s courageous and freespoken defense and the strong impression which he evidently produced on the court; but he himself, being entirely occupied with the trial, is for the moment prevented from preaching as he had been doing when he wrote to the Colossians and the Asian churches generally."<P>5. Bearing on Date of Epistle:<P>Thus, the correct meaning of "praetorium" enables us to fix the date of the Epistle to the Philippians as having been written close to the end of Paul\'s first Roman imprisonment. That this inference is correct is confirmed by various other facts, such as his promise to visit that city, and the fact that in <a onClick="return mV(\'Phl\',2,20);">Php 2:20</a>f the King James Version he says regarding Timothy, "I have no man likeminded, who will naturally care for your state. For all seek their own, not the things which are Jesus Christ\'s." We could not conceive of Paul writing like this if Mark, Tychicus, Aristarchus, and especially if Luke had been with him then, and yet we know (<a onClick="return mV(\'Col\',4,7,10,14);">Col 4:7,10,14</a>) that each and all of these companions of the apostle were with him in Rome when he wrote the Epistle to the Colossians. They had evidently, along with others, been sent on missions to Asia or other places, so that Paul now had only Timothy "likeminded" when he wrote to Philippi.<P>All these facts and considerations confirm us in accepting the signification of "praetorium" as the emperor\'s supreme court of appeal, before which Paul when he wrote the Epistle to the Philippians had so conducted his defense as to produce a most favorable impression, from which he inferred that he might soon be liberated from imprisonment. And his liberation, as the event proved, soon followed.`<a href="./study/isbe/search.html?string=PAUL,+THE+APOSTLE">PAUL, THE APOSTLE</a>; <a href="./study/isbe/search.html?string=PHILIPPIANS,+THE+EPISTLE+TO+THE">PHILIPPIANS, THE EPISTLE TO THE</a>`155';
isbe[7060]='Praetorium`pre-to\'-ri-um praitorion, <a onClick="return mV(\'Mat\',27,27);">Mt 27:27</a> (the King James Version "common hall"); <a onClick="return mV(\'Mar\',15,16);">Mr 15:16</a>; <a onClick="return mV(\'Jhn\',18,28,33);">Joh 18:28,33</a>; <a onClick="return mV(\'Jhn\',19,9);">19:9</a> (in all margins "palace," and in the last three the King James Version "judgment hall"); <a onClick="return mV(\'Act\',23,35);">Ac 23:35</a>, (Herod\'s) "palace," margin "Praetorium," the King James Version "judgment hall"; <a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>, "praetorian guard" (margin "Greek \'in the whole Pretorium,\' " the King James Version "palace," margin "Caesar\'s court"):<P>1. Governor\'s Official Residence:<P>The Pretorium was originally the headquarters of a Roman camp, but in the provinces the name became attached to the governor\'s official residence. In order to provide residences for their provincial governors, the Romans were accustomed to seize and appropriate the palaces which were formerly the homes of the princes or kings in conquered countries. Such a residence might sometimes be in a royal palace, as was probably the case in Caesarea, where the procurator used Herod\'s palace (<a onClick="return mV(\'Act\',23,35);">Ac 23:35</a>).<P>2. In Gospels Herod\'s Palace:<P>The Pretorium where Jesus was brought to trial has been traditionally located in the neighborhood of the present Turkish barracks where once stood the Antonia and where was stationed a large garrison (compare <a onClick="return mV(\'Act\',21,\'32-35\');">Ac 21:32-35</a>), but the statements of Josephus make it almost certain that the headquarters of the procurator were at Herod\'s palace. This was a building whose magnificence Josephus can hardly sufficiently appraise (Wars, I, xxi, 1; V, iv, 4). It was in this palace that "Florus, the procurator took up his quarters, and having placed his tribunal in front of it, held his sessions and the chief priests, influential persons and notables of the city appeared before the tribunal" (Wars II, xiv, 8). Later on, "Florus...brought such as were with him out of the king\'s palace, and would have compelled them to get as far as the citadel (Antonia); but his attempt failed" (II, xv, 5). The word translated "palace" here is aule, the same word as is translated "court" in <a onClick="return mV(\'Mar\',15,16);">Mr 15:16</a>, "the soldiers led him away within the court (aule), which is the Pretorium." There is no need to suppose that Herod Antipas was in the same palace (<a onClick="return mV(\'Luk\',23,4);">Lu 23:4</a>); it is more probable he went to the palace of the Hasmoneans which lay lower down on the eastern slope of this southwest hill, where at a later time Josephus expressly states that Herod Agrippa II and his sister Bernice were living (Wars, II, xvi, 3).<P>The palace of Herod occupied the highest part of the southwest hill near the northwest angle of the ancient city, now traditionally called Zion, and the actual site of the Pretorium cannot have been far removed from the Turkish barracks near the so-called "Tower of David." It is interesting to note that the two stations of the Turkish garrison of Jerusalem today occupy the same spots as did the Roman garrison of Christ\'s time. It is needless to point out how greatly this view of the situation of the Pretorium must modify the traditional claims of the "Via Dolorosa," the whole course of which depends on theory that the "Way of Sorrow" began at the Antonia, the Pretorium of late ecclesiastical tradition.<P>3. <a onClick="return mV(\'Phl\',1,13);">Philippians 1:13</a>:<P>With regard to the expression en holo to praitorio in <a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>, there is now a general consensus of opinion that "Praetorium" here means, not a place, but the imperial praetorian guard, ten thousand in number, which was instituted by Augustus. Paul was allowed to reside in his private house in the custody of a praetorian soldier. As these were doubtless constantly changed, it must have become "manifest" to the whole guard that his bonds were for the sake of Christ.`<a href="./study/isbe/search.html?string=PRAETORIAN+GUARD">PRAETORIAN GUARD</a>; <a href="./study/isbe/search.html?string=GABBATHA">GABBATHA</a>`117';
isbe[7061]='Praise`praz (tehillah, "psalm," "praise," todhah, "confession" "thanksgiving," shabhach, "to praise" "glorify," zamar, yadhah, "to stretch out the hand," "confess"; aineo, epaineo, (epainos):<P>1. Its Meaning:<P>The word comes from the Latin pretium, "price," or "value," and may be defined generally as an ascription of value or worth. Praise may be bestowed upon unworthy objects or from improper motives, but true praise consists in a sincere acknowledgment of a real conviction of worth. Its type may be seen in the representation given in the Apocalypse of the adoration of God and of the Lamb, which is inspired by a sense of their worthiness to be adored (<a onClick="return mV(\'Rev\',4,11);">Re 4:11</a>; <a onClick="return mV(\'Rev\',5,12);">5:12</a>).<P>2. With Man as Its Object:<P>Man may be the object of praise, and may receive it either from God or from his fellow-men. In the former case (<a onClick="return mV(\'Rom\',2,29);">Ro 2:29</a>; <a onClick="return mV(\'1Cr\',4,5);">1Co 4:5</a>) the praise is inevitably just, as resting on a divine estimate of worth; in the latter case its value depends upon the grounds and motives that lie behind it. There is a praise which is itself a condemnation (<a onClick="return mV(\'Luk\',6,26);">Lu 6:26</a>), an honor which seals the eyes in unbelief (<a onClick="return mV(\'Jhn\',5,44);">Joh 5:44</a>), a careless use of the epithet "good" which is dishonoring to God (<a onClick="return mV(\'Luk\',18,19);">Lu 18:19</a>). This is the "praise of men" which Jesus warned His followers to shun as being incompatible with the "praise of God" (<a onClick="return mV(\'Mat\',6,\'1-4\');">Mt 6:1-4</a>; compare <a onClick="return mV(\'Jhn\',12,43);">Joh 12:43</a>; <a onClick="return mV(\'Gal\',1,10);">Ga 1:10</a>; <a onClick="return mV(\'1Th\',2,6);">1Th 2:6</a>). On the other hand, there is a praise that is the instinctive homage of the soul to righteousness (<a onClick="return mV(\'Luk\',23,47);">Lu 23:47</a>), the acknowledgment given to well-doing by just government (<a onClick="return mV(\'Rom\',13,3);">Ro 13:3</a>; <a onClick="return mV(\'1Pe\',2,14);">1Pe 2:14</a>), the tribute of the churches to distinguished Christian service (<a onClick="return mV(\'2Cr\',8,18);">2Co 8:18</a>). Such praise, so far from being incompatible with the praise of God, is a reflection of it in human consciousness; and so Paul associates praise with virtue as an aid and incentive to holy living on which the mind should dwell (<a onClick="return mV(\'Phl\',4,8);">Php 4:8</a>).<P>3. With God as Its Object:<P>In the Bible it is God who is especially brought before us as the object of praise. His whole creation praises Him, from the angels of heaven (<a onClick="return mV(\'Psa\',103,20);">Ps 103:20</a>; <a onClick="return mV(\'Rev\',5,11);">Re 5:11</a>) to those lower existences that are unconscious or even inanimate (<a onClick="return mV(\'Psa\',19,\'1-4\');">Ps 19:1-4</a>; <a onClick="return mV(\'Psa\',148,\'1-10\');">148:1-10</a>; <a onClick="return mV(\'Rev\',5,13);">Re 5:13</a>). But it is with the praises offered to God by man, and with the human duty of praising God, that the Scriptures are principally concerned. In regard to this subject the following points may be noticed:<P>(1) The Grounds of Praise.<P>Sometimes God is praised for His inherent qualities. His majesty (<a onClick="return mV(\'Psa\',104,1);">Ps 104:1</a>) or holiness (<a onClick="return mV(\'Isa\',6,3);">Isa 6:3</a>) fills the mind, and He is "glorified as God" (<a onClick="return mV(\'Rom\',1,21);">Ro 1:21</a>) in view of what He essentially is. More frequently He is praised for His works in creation, providence, and redemption. References may be dispensed with here, for the evidence meets us on almost every page of the sacred literature from Genesis to Revelation, and the Book of Psalms in particular, from beginning to end, is occupied with these themes. When God\'s operations under these aspects present themselves, not simply as general effects of His power and wisdom, but as expressions of His personal love to the individual, the nation, the church, His works become benefits, and praise passes into blessing and thanksgiving (<a onClick="return mV(\'Psa\',34,\'1-\');">Pss 34</a>; <a onClick="return mV(\'Psa\',103,\'1-\');">103</a>; <a onClick="return mV(\'Eph\',1,3);">Eph 1:3</a>; <a onClick="return mV(\'1Pe\',1,3);">1Pe 1:3</a>).<P>(2) The Modes of Praise.<P>True praise of God, as distinguished from false praise (<a onClick="return mV(\'Isa\',29,13);">Isa 29:13</a>; <a onClick="return mV(\'Mat\',15,8);">Mt 15:8</a>), is first of all an inward emotion—a gladness and rejoicing of the heart (<a onClick="return mV(\'Psa\',4,7);">Ps 4:7</a>; <a onClick="return mV(\'Psa\',33,21);">33:21</a>), a music of the soul and spirit (<a onClick="return mV(\'Psa\',103,1);">Ps 103:1</a>; <a onClick="return mV(\'Luk\',1,46);">Lu 1:46</a>f) which no language can adequately express (<a onClick="return mV(\'Psa\',106,2);">Ps 106:2</a>; <a onClick="return mV(\'2Cr\',9,15);">2Co 9:15</a>). But utterance is natural to strong emotion, and the mouth instinctively strives to express the praises of the heart (<a onClick="return mV(\'Psa\',51,15);">Ps 51:15</a> and passim). Many of the most moving passages in Scripture come from the inspiration of the spirit of praise awakened by the contemplation of the divine majesty or power or wisdom or kindness, but above all by the revelation of redeeming love. Again, the spirit of praise is a social spirit calling for social utterance. The man who praises God desires to praise Him in the hearing of other men (<a onClick="return mV(\'Psa\',40,10);">Ps 40:10</a>), and desires also that their praises should be joined with his own (<a onClick="return mV(\'Psa\',34,3);">Ps 34:3</a>). Further, the spirit of praise is a spirit of song. It may find expression in other ways—in sacrifice (<a onClick="return mV(\'Lev\',7,13);">Le 7:13</a>), or testimony (<a onClick="return mV(\'Psa\',66,16);">Ps 66:16</a>), or prayer (<a onClick="return mV(\'Col\',1,3);">Col 1:3</a>); but it finds its most natural and its fullest utterance in lyrical and musical forms. When God fills the heart with praise He puts a new song into the mouth (<a onClick="return mV(\'Psa\',40,3);">Ps 40:3</a>). The Book of Psalms is the proof of this for the Old Testament. And when we pass to the New Testament we find that, alike for angels and men, for the church on earth and the church in heaven, the higher moods of praise express themselves in bursts of song (<a onClick="return mV(\'Luk\',2,14);">Lu 2:14</a>; <a onClick="return mV(\'Eph\',5,19);">Eph 5:19</a>; <a onClick="return mV(\'Col\',3,16);">Col 3:16</a>; <a onClick="return mV(\'Rev\',5,9);">Re 5:9</a>; <a onClick="return mV(\'Rev\',14,3);">14:3</a>; <a onClick="return mV(\'Rev\',15,3);">15:3</a>). Finally, both in the Old Testament and New Testament, the spirit of song gives birth to ordered modes of public praise. In their earlier expressions the praises of Israel were joyful outbursts in which song was mingled with shouting and dancing to a rude accompaniment of timbrels and trumpets (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>ff; <a onClick="return mV(\'2Sa\',6,5,14);">2Sa 6:5,14</a>). In later times Israel had its sacred Psalter, its guilds of trained singers (<a onClick="return mV(\'Ezr\',2,41);">Ezr 2:41</a>; <a onClick="return mV(\'Neh\',7,44);">Ne 7:44</a>), its skilled musicians (<a onClick="return mV(\'Psa\',42,\'1-\');">Pss 42</a>; <a onClick="return mV(\'Psa\',49,\'1-\');">49</a>, etc.); and the praise that waited for God in Zion was full of the solemn beauty of holiness (<a onClick="return mV(\'Psa\',29,2);">Ps 29:2</a>; <a onClick="return mV(\'Psa\',96,9);">96:9</a>). In the New Testament the Psalter is still a manual of social praise. The "hymn" which Jesus sang with His disciples after the Last Supper (<a onClick="return mV(\'Mat\',26,30);">Mt 26:30</a>) would be a Hebrew psalm, probably from the Hallel (<a onClick="return mV(\'Psa\',113,1);">Pss 113-118</a>) which was used at the Passover service, and various references in the Epistles point to the continued employment of the ancient psalms in Christian worship (<a onClick="return mV(\'1Cr\',14,26);">1Co 14:26</a>; <a onClick="return mV(\'Eph\',5,19);">Eph 5:19</a>; <a onClick="return mV(\'Col\',3,16);">Col 3:16</a>; <a onClick="return mV(\'Jam\',5,13);">Jas 5:13</a>). But the Psalter of the Jewish church could not suffice to express the distinctive moods of Christian feeling. Original utterance of the spirit of Christian song was one of the manifestations of the gift of tongues (<a onClick="return mV(\'1Cr\',14,\'15-17\');">1Co 14:15-17</a>). Paul distinguishes hymns and spiritual songs from psalms (<a onClick="return mV(\'Eph\',5,19);">Eph 5:19</a>; <a onClick="return mV(\'Col\',3,16);">Col 3:16</a>); and it was hymns that he and Silas sang at midnight in the prison of Philippi (<a onClick="return mV(\'Act\',16,25);">Ac 16:25</a> the Revised Version (British and American)). But from hymns and songs that were the spontaneous utterance of individual feeling the development was natural, in New Testament as in Old Testament times, to hymns that were sung in unison by a whole congregation; and in rhythmic passages like <a onClick="return mV(\'1Ti\',3,16);">1Ti 3:16</a>; <a onClick="return mV(\'Rev\',15,3);">Re 15:3</a>f; we seem to have fragments of a primitive Christian hymnology, such as Pliny bears witness to for the early years of the 2nd century, when he informs Trajan that the Christians of Bithynia at their morning meetings sang a hymn in alternate strains to Christ as God (Ep. x.97).<P>(3) The Duty of Praise.<P>Praise is everywhere represented in the Bible as a duty no less than a natural impulse and a delight. To fail in this duty is to withhold from God\'s glory that belongs to Him (<a onClick="return mV(\'Psa\',50,23);">Ps 50:23</a>; <a onClick="return mV(\'Rom\',1,20);">Ro 1:20</a>f); it is to shut one\'s eyes to the signs of His presence (<a onClick="return mV(\'Isa\',40,26);">Isa 40:26</a>), to be forgetful of His mercies (<a onClick="return mV(\'Deu\',6,12);">De 6:12</a>), and unthankful for His kindness (<a onClick="return mV(\'Luk\',6,35);">Lu 6:35</a>). If we are not to fall into these sins, but are to give to God the honor and glory and gratitude we owe Him, we must earnestly cultivate the spirit and habit of praise. From holy men of old we learn that this may be done by arousing the soul from its slothfulness and sluggishness (<a onClick="return mV(\'Psa\',57,8);">Ps 57:8</a>; <a onClick="return mV(\'Psa\',103,1);">103:1</a>), by fixing the heart upon God (<a onClick="return mV(\'Psa\',57,7);">Ps 57:7</a>; <a onClick="return mV(\'Psa\',108,1);">108:1</a>), by meditation on His works and ways (<a onClick="return mV(\'Psa\',77,11);">Ps 77:11</a>), by recounting His benefits (<a onClick="return mV(\'Psa\',103,2);">Ps 103:2</a>), above all, for those to whom He has spoken in His Son, by dwelling upon His unspeakable gift (<a onClick="return mV(\'2Cr\',9,15);">2Co 9:15</a>; compare <a onClick="return mV(\'Rom\',8,31);">Ro 8:31</a>, <a onClick="return mV(\'1Jo\',3,1);">1Joh 3:1</a>).`<a href="./study/isbe/search.html?string=PERSECUTION">PERSECUTION</a>; <a href="./study/isbe/search.html?string=WORSHIP">WORSHIP</a>`94';
isbe[7062]='Prayer`prar (deesis, proseuche, (enteuxis; for an excellent discussion of the meaning of these see Thayer\'s Lexicon, p. 126, under the word deesis; the chief verbs are euchomai, proseuchomai, and deomai, especially in Luke and Acts; aiteo, "to ask a favor" distinguished from erotao, "to ask a question," is found occasionally): In the Bible "prayer" is used in a simpler and a more complex a narrower and a wider signification. In the former case it is supplication for benefits either for one\'s self (petition) or for others (intercession). In the latter it is an act of worship which covers all soul in its approach to God. Supplication is at the heart of it, for prayer always springs out of a sense of need and a belief that God is a rewarder of them that diligently seek Him (<a onClick="return mV(\'Hbr\',11,6);">Heb 11:6</a>). But adoration and confession and thanksgiving also find a It place, so that the suppliant becomes a worshipper. It is unnecessary to distinguish all the various terms for prayer that are employed in the Old Testament and the New Testament. But the fact should be noticed that in the Hebrew and Greek aloe there are on the one hand words for prayer that denote a direct petition or short, sharp cry of the heart in its distress (<a onClick="return mV(\'Psa\',30,2);">Ps 30:2</a>; <a onClick="return mV(\'2Cr\',12,8);">2Co 12:8</a>), and on the other "prayers" like that of Hannah (<a onClick="return mV(\'1Sa\',2,\'1-10\');">1Sa 2:1-10</a>), which is in reality a song of thanksgiving, or that of Paul, the prisoner of Jesus Christ, in which intercession is mingled with doxology (<a onClick="return mV(\'Eph\',3,\'14-21\');">Eph 3:14-21</a>).<P>1. In the Old Testament:<P>The history of prayer as it meets us here reflects various stages of experience and revelation. In the patriarchal period, when \'men began to call upon the name of the Lord\' (<a onClick="return mV(\'Gen\',4,26);">Ge 4:26</a>; compare <a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>; <a onClick="return mV(\'Gen\',21,33);">21:33</a>), prayer is naive, familiar and direct (<a onClick="return mV(\'Gen\',15,2);">Ge 15:2</a>ff; <a onClick="return mV(\'Gen\',17,18);">17:18</a>; <a onClick="return mV(\'Gen\',18,23);">18:23</a>ff; <a onClick="return mV(\'Gen\',24,12);">24:12</a>). It is evidently associated with sacrifice (<a onClick="return mV(\'Gen\',12,8);">Ge 12:8</a>; <a onClick="return mV(\'Gen\',13,4);">13:4</a>; <a onClick="return mV(\'Gen\',26,25);">26:25</a>), the underlying idea probably being that the gift or offering would help to elicit the desired response. Analogous to this is Jacob\'s vow, itself a species of prayer, in which the granting of desired benefits becomes the condition of promised service and fidelity (<a onClick="return mV(\'Gen\',28,20);">Ge 28:20</a>). In the pre-exilic history of Israel prayer still retains many of the primitive features of the patriarchal type (<a onClick="return mV(\'Exd\',3,4);">Ex 3:4</a>; <a onClick="return mV(\'Num\',11,\'11-15\');">Nu 11:11-15</a>; <a onClick="return mV(\'Jdg\',6,13);">Jud 6:13</a>ff; <a onClick="return mV(\'Jdg\',11,30);">11:30</a>f; <a onClick="return mV(\'1Sa\',1,11);">1Sa 1:11</a>; <a onClick="return mV(\'2Sa\',15,8);">2Sa 15:8</a>; <a onClick="return mV(\'Psa\',66,13);">Ps 66:13</a>f). The Law has remarkably little to say on the subject, differing here from the later Judaism (see Schurer, HJP, II, i, v290, vindex-vol, p. 93; and compare <a onClick="return mV(\'Mat\',6,5);">Mt 6:5</a>ff; <a onClick="return mV(\'Mat\',23,14);">23:14</a>; <a onClick="return mV(\'Act\',3,1);">Ac 3:1</a>; <a onClick="return mV(\'Act\',16,13);">16:13</a>); while it confirms the association of prayer with sacrifices, which now appear, however, not as gifts in anticipation of benefits to follow, but as expiations of guilt (<a onClick="return mV(\'Deu\',21,\'1-9\');">De 21:1-9</a>) or thank offerings for past mercies (<a onClick="return mV(\'Deu\',26,\'1-11\');">De 26:1-11</a>). Moreover, the free, frank access of the private individual to God is more and more giving place to the mediation of the priest (<a onClick="return mV(\'Deu\',21,5);">De 21:5</a>; <a onClick="return mV(\'Deu\',26,3);">26:3</a>), the intercession of the prophet (<a onClick="return mV(\'Exd\',32,\'11-13\');">Ex 32:11-13</a>; <a onClick="return mV(\'1Sa\',7,\'5-13\');">1Sa 7:5-13</a>; <a onClick="return mV(\'1Sa\',12,23);">12:23</a>), the ordered approach of tabernacle and temple services (<a onClick="return mV(\'Exd\',40,\'1-\');">Ex 40</a>; <a onClick="return mV(\'1Ki\',8,\'1-\');">1Ki 8</a>). The prophet, it is true, approaches God immediately and freely—Moses (<a onClick="return mV(\'Exd\',34,34);">Ex 34:34</a>; <a onClick="return mV(\'Deu\',34,10);">De 34:10</a>) and David (<a onClick="return mV(\'2Sa\',7,27);">2Sa 7:27</a>) are to be numbered among the prophets—but he does so in virtue of his office, and on the ground especially of his possession of the Spirit and his intercessory function (compare <a onClick="return mV(\'Eze\',2,2);">Eze 2:2</a>; <a onClick="return mV(\'Jer\',14,15);">Jer 14:15</a>).<P>A new epoch in the history of prayer in Israel was brought about by the experiences of the Exile. Chastisement drove the nation to seek God more earnestly than before, and as the way of approach through the external forms of the temple and its sacrifices was now closed, the spiritual path of prayer was frequented with a new assiduity. The devotional habits of Ezra (<a onClick="return mV(\'Ezr\',7,27);">Ezr 7:27</a>; <a onClick="return mV(\'Ezr\',8,23);">8:23</a>), Nehemlab (<a onClick="return mV(\'Neh\',2,4);">Ne 2:4</a>; <a onClick="return mV(\'Neh\',4,4,9);">4:4,9</a>, etc.) and Daniel (<a onClick="return mV(\'Dan\',6,10);">Da 6:10</a>) prove how large a place prayer came to hold in the individual life; while the utterances recorded in <a onClick="return mV(\'Ezr\',9,\'6-15\');">Ezr 9:6-15</a>; <a onClick="return mV(\'Neh\',1,\'5-11\');">Ne 1:5-11</a>; <a onClick="return mV(\'Neh\',9,\'5-38\');">9:5-38</a>; <a onClick="return mV(\'Dan\',9,\'4-19\');">Da 9:4-19</a>; <a onClick="return mV(\'Isa\',63,\'7-\');">Isa 63:7</A>-<a onClick="return mV(\'Isa\',64,\'1-12\');">64:12</a> serve as illustrations of the language and spirit of the prayers of the Exile, and show especially the prominence now given to confession of sin. In any survey of the Old Testament teaching the Psalms occupy a place by themselves, both on account of the large period they cover in the history and because we are ignorant in most cases as to the particular circumstances of their origin. But speaking generally it may be said that here we see the loftiest flights attained by the spirit of prayer under the old dispensation—the intensest craving for pardon, purity and other spiritual blessings (<a onClick="return mV(\'Psa\',51,\'1-\');">Ps 51</a>; <a onClick="return mV(\'Psa\',130,\'1-\');">130</a>), the most heartfelt longing for a living communion with God Himself (<a onClick="return mV(\'Psa\',42,2);">Ps 42:2</a>; <a onClick="return mV(\'Psa\',63,1);">63:1</a>; <a onClick="return mV(\'Psa\',84,2);">84:2</a>).<P>2. In the New Testament:<P>Here it will be convenient to deal separately with the material furnished by the Gospel narratives of the life and teaching of Christ and that found in the remaining books. The distinctively Christian view of prayer comes to us from the Christ of the Gospels. We have to notice His own habits in the matter (<a onClick="return mV(\'Luk\',3,21);">Lu 3:21</a>; <a onClick="return mV(\'Luk\',6,12);">6:12</a>; <a onClick="return mV(\'Luk\',9,16,29);">9:16,29</a>; <a onClick="return mV(\'Luk\',22,32,\'39-46\');">22:32,39-46</a>; <a onClick="return mV(\'Luk\',23,\'34-46\');">23:34-46</a>; <a onClick="return mV(\'Mat\',27,46);">Mt 27:46</a>; <a onClick="return mV(\'Jhn\',17,\'1-\');">Joh 17</a>), which for all who accept Him as the revealer of the Father and the final authority in religion immediately dissipate all theoretical objections to the value and efficacy of prayer. Next we have His general teaching on the subject in parables (<a onClick="return mV(\'Luk\',11,\'5-9\');">Lu 11:5-9</a>; <a onClick="return mV(\'Luk\',18,\'1-14\');">18:1-14</a>) and incidental sayings (<a onClick="return mV(\'Mat\',5,44);">Mt 5:44</a>; <a onClick="return mV(\'Mat\',6,\'5-8\');">6:5-8</a>; <a onClick="return mV(\'Mat\',7,\'7-11\');">7:7-11</a>; <a onClick="return mV(\'Mat\',9,38);">9:38</a>; <a onClick="return mV(\'Mat\',17,21);">17:21</a>; <a onClick="return mV(\'Mat\',18,19);">18:19</a>; <a onClick="return mV(\'Mat\',21,22);">21:22</a>; <a onClick="return mV(\'Mat\',24,20);">24:20</a>; <a onClick="return mV(\'Mat\',26,41);">26:41</a> and the parallels), which presents prayer, not as a mere energizing of the religious soul that is followed by beneficial spiritual reactions, but as the request of a child to a father (<a onClick="return mV(\'Mat\',6,8);">Mt 6:8</a>; <a onClick="return mV(\'Mat\',7,11);">7:11</a>), subject, indeed, to the father\'s will (<a onClick="return mV(\'Mat\',7,11);">Mt 7:11</a>; compare <a onClick="return mV(\'Mat\',6,10);">Mt 6:10</a>; <a onClick="return mV(\'Mat\',26,39,42);">26:39,42</a>; <a onClick="return mV(\'1Jo\',5,14);">1Joh 5:14</a>), but secure always of loving attention and response (<a onClick="return mV(\'Mat\',7,\'7-11\');">Mt 7:7-11</a>; <a onClick="return mV(\'Mat\',21,22);">21:22</a>). In thus teaching us to approach God as our Father, Jesus raised prayer to its highest plane, making it not less reverent than it was at its best in Old Testament times, while far more intimate and trustful. In the <a href="./study/isbe/search.html?string=LORD\'S+PRAYER">LORD\'S PRAYER</a> (which see). He summed up His ordinary teaching on the subject in a concrete example which serves as a model and breviary of prayer (<a onClick="return mV(\'Mat\',6,\'9-13\');">Mt 6:9-13</a>; <a onClick="return mV(\'Luk\',11,\'2-4\');">Lu 11:2-4</a>). But according to the Fourth Gospel, this was not His final word upon the subject. On the night of the betrayal, and in full view of His death and resurrection and ascension to God\'s right hand, He told His disciples that prayer was henceforth to be addressed to the Father in the name of the Son, and that prayer thus offered was sure to be granted (<a onClick="return mV(\'Jhn\',16,23,24,26);">Joh 16:23,24,26</a>). The differentia of Christian prayer thus consists in its being offered in the name of Christ; while the secret of its success lies on the one hand in the new access to the Father which Christ has secured for His people (<a onClick="return mV(\'Jhn\',17,19);">Joh 17:19</a>; compare <a onClick="return mV(\'Hbr\',4,\'14-16\');">Heb 4:14-16</a>; <a onClick="return mV(\'Hbr\',10,\'19-22\');">10:19-22</a>), and on the other in the fact that prayer offered in the name of Christ will be prayer in harmony with the Father\'s will (<a onClick="return mV(\'Jhn\',15,7);">Joh 15:7</a>; compare <a onClick="return mV(\'1Jo\',3,22);">1Joh 3:22</a>; <a onClick="return mV(\'1Jo\',5,13);">5:13</a>).<P>In the Acts and Epistles we see the apostolic church giving effect to Christ\'s teaching on prayer. It was in a praying atmosphere that the church was born (<a onClick="return mV(\'Act\',1,14);">Ac 1:14</a>; compare <a onClick="return mV(\'Act\',2,1);">Ac 2:1</a>); and throughout its early history prayer continued to be its vital breath and native air (<a onClick="return mV(\'Act\',2,42);">Ac 2:42</a>; <a onClick="return mV(\'Act\',3,1);">3:1</a>; <a onClick="return mV(\'Act\',6,4,6);">6:4,6</a> and passim). The Epistles abound in references to prayer. Those of Paul in particular contain frequent allusions to his own personal practice in the matter (<a onClick="return mV(\'Rom\',1,9);">Ro 1:9</a>; <a onClick="return mV(\'Eph\',1,16);">Eph 1:16</a>; <a onClick="return mV(\'Phl\',1,9);">Php 1:9</a>; <a onClick="return mV(\'1Th\',1,2);">1Th 1:2</a>, etc.), and many exhortations to his readers to cultivate the praying habit (<a onClick="return mV(\'Rom\',12,12);">Ro 12:12</a>; <a onClick="return mV(\'Eph\',6,18);">Eph 6:18</a>; <a onClick="return mV(\'Phl\',4,6);">Php 4:6</a>; <a onClick="return mV(\'1Th\',5,17);">1Th 5:17</a>, etc.). But the new and characteristic thing about Christian prayer as it meets us now is its connection with the Spirit. It has become a spiritual gift (<a onClick="return mV(\'1Cr\',14,\'14-16\');">1Co 14:14-16</a>); and even those who have not this gift in the exceptional charismatic sense may "pray in the Spirit" whenever they come to the throne of grace (<a onClick="return mV(\'Eph\',6,18);">Eph 6:18</a>; <a onClick="return mV(\'Jud\',1,20);">Jude 1:20</a>). The gift of the Spirit, promised by Christ (<a onClick="return mV(\'Jhn\',14,16);">Joh 14:16</a>ff, etc.), has raised prayer to its highest power by securing for it a divine cooperation (<a onClick="return mV(\'Rom\',8,15,26);">Ro 8:15,26</a>; <a onClick="return mV(\'Gal\',4,6);">Ga 4:6</a>). Thus Christian prayer in its full New Testament meaning is prayer addressed to God as Father, in the name of Christ as Mediator, and through the enabling grace of the indwelling Spirit.`<a href="./study/isbe/search.html?string=PRAYERS+OF+CHRIST">PRAYERS OF CHRIST</a>`94';
isbe[7063]='Prayer of Habakkuk``<a href="./study/isbe/search.html?string=HABAKKUK">HABAKKUK</a>; <a href="./study/isbe/search.html?string=BETH-+horon,+the+battle+of">BETH-HORON, THE BATTLE OF</a>`1';
isbe[7064]='Prayer of Joseph``<a href="./study/isbe/search.html?string=JOSEPH,+PRAYER+OF">JOSEPH, PRAYER OF</a>`1';
isbe[7065]='Prayer of Manasses``<a href="./study/isbe/search.html?string=MANASSES,+THE+PRAYER+OF">MANASSES, THE PRAYER OF</a>`1';
isbe[7066]='Prayer, Hours of``<a href="./study/isbe/search.html?string=HOURS+OF+PRAYER">HOURS OF PRAYER</a>`1';
isbe[7067]='Prayer, Lord\'s``<a href="./study/isbe/search.html?string=LORD\'s+prayer,+the">LORD\'S PRAYER, THE</a>`1';
isbe[7068]='Prayers of Christ`prarz:<P>1. The Lord\'s Prayer<P>2. Christ\'s Doctrine of Prayer: Sacredness, Importunity, Conditions<P>3. Prayers Offered by Christ<P class="in15">(1) The High-priestly Prayer<P class="in15">(2) The Prayer in Gethsemane<P class="in15">(3) The Prayers on the Cross<P class="in15">(4) Prayer after the Resurrection<P class="in15">(5) General Conclusions<hr /><P>In the history and doctrine of prayer, nothing is more important than the light shed upon the subject by the prayers of Jesus. These are to be studied in connection with His teaching concerning prayer found in the model of the Lord\'s Prayer, and general statements and hints to His disciples.<P>1. The Lord\'s Prayer:<P>This model of prayer is given in two forms (<a onClick="return mV(\'Mat\',6,\'9-13\');">Mt 6:9-13</a>; <a onClick="return mV(\'Luk\',11,\'2-4\');">Lu 11:2-4</a>). The differences of form show that exactness of similarity in words is not essential. The prayer includes adoration, supplication for the Kingdom, for personal needs, for forgiveness, for deliverance from temptation and the ascription of glory. It is at once individual and universal; it sets the recognition of divine things first, and yet clearly asserts the ethical and social relations of life.<P>See <a href="./study/isbe/search.html?string=LORD\'S+PRAYER,+THE">LORD\'S PRAYER, THE</a>.<P>2. Christ\'s Doctrine of Prayer: Sacredness, Importunity, Conditions:<P>That men should pray is taken for granted (<a onClick="return mV(\'Mat\',6,5);">Mt 6:5</a>). Its sacredness is involved in the command for privacy (<a onClick="return mV(\'Mat\',6,6);">Mt 6:6</a>); its importunity (<a onClick="return mV(\'Luk\',11,\'5-9\');">Lu 11:5-9</a>; <a onClick="return mV(\'Luk\',18,\'1-8\');">18:1-8</a>); its necessary conditions of humility, absence of self righteousness (<a onClick="return mV(\'Luk\',18,\'9-14\');">Lu 18:9-14</a>), of display and repetition (<a onClick="return mV(\'Mat\',6,7);">Mt 6:7</a>); necessity of faith and a forgiving spirit (<a onClick="return mV(\'Mar\',11,\'24-26\');">Mr 11:24-26</a>); of agreement in social prayer (<a onClick="return mV(\'Mat\',18,19);">Mt 18:19</a>); submission to the will of Christ, "in my name" (<a onClick="return mV(\'Jhn\',14,13);">Joh 14:13</a>).<P>3. Prayers Offered by Christ:<P>In <a onClick="return mV(\'Mat\',11,25,26);">Mt 11:25,26</a> the King James Version, Christ thanks God: "Thou hast hid these things from the wise and prudent, and hast revealed them unto babes. Even so, Father: for so it seemed good in thy sight." This language shows the essence of prayer to be not the mere expression of need and request for what is required, but resort to God. The prayer gives us insight into the deeper experience of the Son with the Father, and His perfect submission to the Father\'s will, with thanksgiving even for what might seem inexplicable. It thus illustrates the truth that the highest form of prayer is found in the serenity of the soul.<P><a onClick="return mV(\'Mat\',14,23);">Mt 14:23</a> narrates the retirement of the Lord to a "mountain apart to pray." No word of what the prayer was is given, but the record is suggestive. Following a day of severe toil and probably excitement, Jesus betakes Himself to prayer. The reality, the true humanity of the Christ, are here revealed. The former prayer may almost be regarded as that of the Son of God addressed to the Father in the sublime communion of the Godhead. This passage emphatically is a prayer-scene of the Son of Man. The association of this incident of prayer in Christ\'s life with the miracle of walking on the sea (an example of miracle in the person of the Lord Himself, and not performed on another) opens up an interesting question of the relation of the supernatural and the natural. Here perhaps lies an explanation of the true significance of the miraculous. The communion of the Lord with a supreme Father had filled the physical nature of Jesus with spiritual forces which extended the power of the spirit over the material world beyond the limits by which man is bound in his normal and sinful condition (see Lange, Commentary on Mat; <a onClick="return mV(\'Mat\',15,36);">Mt 15:36</a>; compare <a onClick="return mV(\'Mat\',14,19);">14:19</A>). Christ\'s recognition of God as the Giver of food, in thanks at the meal, or "asking a blessing," should be noted as an example which in modern times is largely ignored or followed as a mere formality. But it is significant; it expresses that intense and all-compelling sense of the divine which ever dwelt in Him; of which prayer is an expression, and which is evoked so naturally and becomingly at a social meal. In <a onClick="return mV(\'Mat\',17,21);">Mt 17:21</a>, our Lord\'s reference to prayer as a necessary condition of miraculous power, in the light of <a onClick="return mV(\'Mar\',7,34);">Mr 7:34</a>, where "looking up to heaven, he sighed, and saith unto him (the deaf man), Ephphatha," may imply His own prayer in connection with the exercise of miraculous energy. This is apparently indicated in <a onClick="return mV(\'Jhn\',11,41,42);">Joh 11:41,42</a>, although, as above, it is the expression of the intimate relation between Christ and the Father, which is the essence of prayer, and in which relation He ever exercised the fullest power of God Himself. <a onClick="return mV(\'Mat\',19,13);">Mt 19:13</a> records that little children were brought to Him that He should put His hands on them and pray. That He prayed is not related, but <a onClick="return mV(\'Mat\',19,15);">19:15</a> relates that He laid His hands on them and, presumably, with the imposition, prayed. The scene is most suggestive, in the light of our Lord\'s words. In <a onClick="return mV(\'Mat\',19,14);">Mt 19:14</a> and in <a onClick="return mV(\'Mat\',26,26);">26:26</a> Our Lord blesses the bread or gives thanks at the institution of the Supper, and has set the mode of celebration universally adopted, even giving the term Eucharist ("giving of thanks") to the service.<P>(1) The High-priestly Prayer.<P>This prayer (<a onClick="return mV(\'Jhn\',17,\'1-\');">Joh 17</a>) is the special prayer of the Lord, and may be regarded as the sole example furnished by the evangelists of our Lord\'s method of prayer. The thanksgiving in <a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a> is the only other instance of any extent in the report of the prayers of Jesus, but even that is brief compared to what is here furnished. The fullness of this prayer clearly shows that it was uttered in the hearing of the disciples. Their relation to it is remarkable. Auditors, they yet could not share in it. At the same time, it was a profound revelation to them both of the relation of the Master to God, and the character of the work which He had come to perform, and the part which they were to take in it. John gives us no hint as to the place in which it was spoken; <a onClick="return mV(\'Jhn\',14,31);">14:31</a> indicates a departure from the upper room. But apparently the prayer was offered where the discourses of <a onClick="return mV(\'Jhn\',15,\'1-\');">John 15</a> and <a onClick="return mV(\'Jhn\',16,\'1-\');">16</a> were delivered. It has been suggested by Westcott that some spot in the temple courts was the scene of <a onClick="return mV(\'Jhn\',15,\'1-\');">John 15</a>; <a onClick="return mV(\'Jhn\',16,\'1-\');">16</a> and <a onClick="return mV(\'Jhn\',17,\'1-\');">17</a>. It has been generally supposed that the ornament of the Golden Vine would naturally suggest the figure of the Vine and Branches which our Lord employs. <a onClick="return mV(\'Jhn\',18,\'1-\');">Joh 18:1</a> shows that the prayer was offered before the Lord and His disciples had passed over the brook Kidron. The determination of the exact spot is certainly impossible, except the probability that the words were spoken in the vicinity of the temple.<P>The first part of the prayer (<a onClick="return mV(\'Jhn\',17,\'1-5\');">Joh 17:1-5</a>) is an expression of profound communion between the Son and the Father, and the prayer that the Father should glorify the Son, but with the supreme end of the Father\'s own glory. The absolutely unique character of Christ\'s relation to God is the calm assertion of <a onClick="return mV(\'Jhn\',17,4);">Joh 17:4</a>. Its consciousness of completeness in the work which He had received from God, impossible for the children of men, marks the supreme nature of the Son of God.<P>In the second part of the prayer (<a onClick="return mV(\'Jhn\',17,\'6-19\');">Joh 17:6-19</a>), our Lord prays for His disciples, to whom He has revealed Himself and His relation to God (<a onClick="return mV(\'Jhn\',17,7,8);">Joh 17:7,8</a>). He prays that they may be kept by the Father, and for their unity. Their separation from the world is declared (<a onClick="return mV(\'Jhn\',17,14);">Joh 17:14</a>), and our Lord prays that they may be kept from the evil that is in the world, which is alien from them as it is from Him.<P>In the third portion of the prayer Christ\'s relation to His ultimate followers is referred to. Their unity is sought, not an external unity, but the deep, spiritual unity found by the indwelling of Christ in them and God in Christ. The prayer closes by the declaration that Christ\'s knowledge of the Father is revealed to His people, and the end and crown of all is to be the indwelling of God\'s love in man by the dwelling of Christ in him.<P>This prayer is unique, not merely among the prayers of our Lord, but also among the prayers of humanity. While it is distinctly a petition, it is at the same time a communion. In one or two places our Lord expresses His will, thus setting Himself upon a level with God. The fact of this prayer of triumph in which every petition is virtually a declaration of the absolute certainty of its realization, immediately preceding the prayer of Gethsemane, is both difficult and suggestive. The anomaly is a powerful argument for the historic reality. The explanation of these contrasted moods is to be found in the depth of our Lord\'s nature, and especially in the complete consistency of His dual nature with the spheres to which each nature belongs. He is most divine; He is most human. In the fullness of the reach of the prayer and its calm confidence, the believer may find a ceaseless and inexhaustible source of comfort and encouragement. Attention might be called to the remarkable forecast of the history and experience of the church which the prayer furnishes.<P>(2) The Prayer in Gethsemane.<P>This is recorded by the three Synoptics (<a onClick="return mV(\'Mat\',26,\'36-44\');">Mt 26:36-44</a>; <a onClick="return mV(\'Mar\',14,\'22-40\');">Mr 14:22-40</a>; <a onClick="return mV(\'Luk\',22,\'39-46\');">Lu 22:39-46</a>), and is probably referred to in <a onClick="return mV(\'Hbr\',5,7);">Heb 5:7</a>. Brief though the prayer is, it exhibits most clearly recognition of God\'s infinite power, a clear object sought by the prayer, and perfect submission to God\'s will. All the elements of prayer, as it can be offered by man, are here except the prayer for forgiveness. It is to be noted that the prayer was three times repeated. This is not to be regarded as inconsistent with our Lord\'s prohibition of repetition. It was vain repetition which was forbidden. The intensity of the prayer is expressed by its threefold utterance (compare Paul\'s prayer in regard to the thorn in <a onClick="return mV(\'2Cr\',12,8);">2Co 12:8</a>).<P>(3) The Prayers on the Cross.<P>In <a onClick="return mV(\'Mat\',27,46);">Mt 27:46</a>; <a onClick="return mV(\'Mar\',15,34);">Mr 15:34</a>, Christ uses the prayer of <a onClick="return mV(\'Psa\',22,1);">Ps 22:1</a>. In the moment of complete desolation, the Sufferer claimed His unbroken relationship with God. This is the victory of the atoning sacrifice. <a onClick="return mV(\'Luk\',23,34);">Lu 23:34</a> records the prayer of intercession for those who crucified Him; in 23:46 is the calm committal of His spirit to the Father. Prayer here again assumes its highest form in the expression of recognition and trust. Thus the three prayers on the cross not only reveal the intimate relation of our Lord to the Father, but they also illustrate prayer such as man may offer. They represent supplication, intercession, communion. Prayer thus expresses our relation to God, to others, to ourselves; our trust, our love, our need. In all things He was made like unto His brethren, except without sin (see <a href="./study/isbe/search.html?string=UPPERCASE">POINTS</a>). His prayers on the cross illustrate His high-priestly office. It rises at that intense crisis to its supreme manifestation and activity.<P>(4) Prayer after the Resurrection.<P>It is to be observed that after His resurrection there is no record of any prayer, offered by Christ. In the supper at Emmaus He "blessed" the bread (<a onClick="return mV(\'Luk\',24,30);">Lu 24:30</a>); and the ascension took place in the midst of blessing (<a onClick="return mV(\'Luk\',24,51);">Lu 24:51</a>), suggestive of the course of the church as ever beneath the benediction of the Lord, to be ended only at the final consummation. The act of eating the fish and honeycomb (<a onClick="return mV(\'Luk\',24,43);">Lu 24:43</a>) seems to have been unaccompanied by any act of specifically religious form. Mark, with characteristic regard to details, records Christ\'s "looking up to heaven" (<a onClick="return mV(\'Mar\',6,41);">Mr 6:41</a>; <a onClick="return mV(\'Mar\',7,34);">7:34</a>); <a onClick="return mV(\'Jhn\',11,41);">Joh 11:41</a> refers to a similar act, and adds the Lord\'s words of thanksgiving that God had heard Him (see also <a onClick="return mV(\'Jhn\',17,1);">Joh 17:1</a>). The gesture was usual in association with Christ\'s prayers; it is appropriate and suggestive. Luke narrates that Christ prayed at His baptism (<a onClick="return mV(\'Luk\',3,21);">Lu 3:21</a>); that He spent a night in prayer before choosing the Twelve (<a onClick="return mV(\'Luk\',6,12,13);">Lu 6:12,13</a>); that the transfiguration was preceded by prayer (<a onClick="return mV(\'Luk\',9,29);">Lu 9:29</a>); and records the prayer in the garden (<a onClick="return mV(\'Luk\',22,\'41-45\');">Lu 22:41-45</a>). The third evangelist thus in addition to the notes of our Lord\'s prayers in retirement, which the other evangelists record, adds these instances of the special relation of prayer to events of critical importance.<P>(5) General Conclusions.<P>The following conclusions as to prayer may be drawn from the records of Christ\' prayers:<P>(1) Prayer is the highest exercise of man\'s spiritual nature.<P>(2) It is natural to the soul even in perfect accord with God.<P>(3) It is not only the expression of need, the supply of which is sought of God, but by the example of Christ it is the highest expression of trust, submission and union with God.<P>(4) It is to be used both in solitude and in society; it is personal and intercessory.<P>(5) It may be accompanied by the plea of Christ\'s name, and for Christ\'s sake.<P>These are the laws which should direct it; that is to say, it should be based upon the merit and the intercession of Christ, and should be addressed to God under the limitations of the Kingdom of the Lord and His purposes for good, both for the interest of the suppliant and others, under the conditions of the interest of the whole Kingdom.``14';
isbe[7069]='Preacher; Preaching`prech\'-er, prech\'-ing (qoheleth, "preacher" (<a onClick="return mV(\'Ecc\',1,1);">Ec 1:1</a>), basar, "to bring or tell good tidings" (<a onClick="return mV(\'Psa\',40,9);">Ps 40:9</a>; <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>), qara\', "to call," "proclaim" (<a onClick="return mV(\'Neh\',6,7);">Ne 6:7</a>; <a onClick="return mV(\'Jon\',3,2);">Jon 3:2</a>), qeri\'ah, "cry," "preaching" (<a onClick="return mV(\'Jon\',3,2);">Jon 3:2</a>); kerux, "crier," "herald" (<a onClick="return mV(\'1Ti\',2,7);">1Ti 2:7</a>), kerusso, "to cry or proclaim as a herald" (<a onClick="return mV(\'Mat\',3,1);">Mt 3:1</a>; <a onClick="return mV(\'Rom\',10,14);">Ro 10:14</a>), euaggellizo, "to announce good news" (<a onClick="return mV(\'Mat\',11,5);">Mt 11:5</a>)):<P>1. Definition<P>2. The Preacher\'s Limitations<P>3. A Man with a Message<P>4. Preaching a Necessary Agency<P>5. Biblical Terms and Their Meanings<P>6. The Hebrew Prophets<P>7. Christ as a Preacher<P>8. The Apostles as Preachers<P>9. Fundamental Postulates<P class="in15">(1) Preach the Word<P class="in15">(2) "We Are Ambassadors"<hr /><P>1. Definition:<P>In the New Testament sense a preacher is a man who has the inner call from the Holy Spirit and the external call from the church the witnessing body of Christ on earth, and has been duly set apart as an accredited and qualified teacher of the Christian religion. His vocation is that of addressing the popular mind and heart on religious truth, as that truth is set forth in the sacred Scripture, for the spiritual profit of the hearer as its end. The preacher, recognized as such by the church, speaks as a personal witness of God\'s saving truth, explaining it and applying it as the circumstances of the people and the time may require. The gravity and importance of this vocation, as set forth in the sacred Scriptures and amply illustrated in the history of the church, surpass those of any other calling among men. Luther said, "The Devil does not mind the written word but he is put to flight whenever it is preached aloud."<P>2. The Preacher\'s Limitations:<P>The preacher, in the sense indicated above, is with all other Christians a sharer in the freedom that is in Christ. But as a recognized teacher and leader of the church, he is not an unattached and entire unrestricted teacher. He is not to speak as his own, but as the mouthpiece of the church whose apprehension of the gospel he has voluntarily confessed. The faith of the church is, by his own assent, his faith, and her doctrine is his doctrine. He is not expected to give his own, as distinct from or opposed to the faith of the church in whose name he has been set apart to proclaim the gospel. Both the personal and the representative or official are united in him and his preaching.<P>3. A Man with a Message:<P>His work is always to be related to the Old Testament and New Testament. His sermon is under the creed of his church as the creed is under the word. The preacher is a man with a message, and the preacher who has no message of the particular kind indicated above is in no true sense a preacher. It has been well expressed in one of the valuable Yale series of lectures on the subject, "Every living preacher must receive his communication direct from God, and the constant purpose of his life must be to receive it uncorrupted and to deliver it without addition or subtraction." When he presents the message of his divinely-appointed ambassadorship in its integrity, he speaks with that peculiar kind of "authority" which has been pronounced "the first and indispensable requisite" in giving a message from God. He manifests thereby a "high celestial dogmatism," and "human weakness becomes immortal strength." The true preacher preaches from a divine impulsion. He says with Paul, "Necessity is laid upon me; for woe is unto me, if I preach not the gospel" (<a onClick="return mV(\'1Cr\',9,16);">1Co 9:16</a>; compare <a onClick="return mV(\'Jer\',20,9);">Jer 20:9</a>). He says with Peter, "Whether it is right in the sight of God to hearken unto you rather than unto God, judge ye: for we cannot but speak the things which we saw and heard" (<a onClick="return mV(\'Act\',4,19,20);">Ac 4:19,20</a>). The message of the preacher is greater than the man, because it is from God. It largely makes the man who preaches it in its fullness and power. Whatever be his own gifts or whatever the alleged gift conferred in the laying on of hands, without the sense of the message he is not chosen of God to proclaim His word. Destitute of that, he does not have the sustaining impulse of his vocation to enlist his entire personality in his work and give him mastery over the minds and hearts of men.<P>4. Preaching a Necessary Agency:<P>No agency of religion is older than preaching. It is as old as the Bible itself (<a onClick="return mV(\'2Pe\',2,5);">2Pe 2:5</a>). It is a necessary adjunct of a religion that is communicated to man by means of an objective and authoritative revelation, such as we have in the sacred Scriptures. It is an entirely natural agency of the forms of religion revealed in the Old Testament and New Testament. It is strictly in harmony with those ideas that obtain in both testaments regarding the method of propagating the faith, set forth through the agency of holy men who spake as they were moved by the Holy Ghost. That faith is disseminated by means of teaching through argument, explanation, motive and exhortation. The agency for the spread of a religion of persuasion must be preaching.<P>5. Biblical Terms and Their Meanings:<P>In the Biblical usage of the terms which have reference to the subject, preaching means the proclamation of religious truth. It is that continuous and public testimony which the church is always giving, through discourses by men set apart for such work, to her own living faith as that faith is rooted in and sustained by the written word of God. In this sense "to call," "proclaim," "cry aloud" are used frequently of the prophetic message under the various aspects of denunciation, as in <a onClick="return mV(\'Jon\',1,2);">Jon 1:2</a>; of the relation of the divine, as in <a onClick="return mV(\'Jer\',11,6);">Jer 11:6</a>, and of Messianic promise, as in <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>. The term for "preaching" is also used to designate a political propagandism set forth by the prophet (<a onClick="return mV(\'Neh\',6,7);">Ne 6:7</a>). In two passages (<a onClick="return mV(\'Psa\',68,11);">Ps 68:11</a>, "publish"; <a onClick="return mV(\'Isa\',61,1);">Isa 61:1</a>) another word for preaching means "to declare good news." In the case of Jonah\'s preaching at Nineveh, the word used to designate what it was means strictly "proclamation" and corresponds to the New Testament word used to define our Lord\'s "proclamation" as a herald of the advent of the Kingdom of God (<a onClick="return mV(\'Mat\',4,17);">Mt 4:17</a>), which in its initial stages particularly was closely associated with the preaching of John the Baptist (<a onClick="return mV(\'Mat\',3,1,2);">Mt 3:1,2</a>).<P>6. The Hebrew Prophets:<P>Thus, while preaching belongs especially to Christianity, it has well-defined antecedents in the Old Testament. Under both the old and the new dispensations the subject takes the church for granted and utters the testimony, not simply of a solitary believer, but of a divinely-founded society, whether it be of Jews or Christians. The older books in the Canon have in them the beginnings and some of the features of the preacher\'s office and of the high function of preaching. In them we find a special class of men set apart and separated unto that particular work, as we find in the Christian church, from its beginnings, the same divinely instituted office. The Hebrew prophet had a message direct from God, which frequently came with supernatural knowledge in the power of prediction. The mission of the prophet, however, was simply or chiefly to f
