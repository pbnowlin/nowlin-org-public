ck="return mV(\'1Sa\',14,37);">1Sa 14:37</a>; <a onClick="return mV(\'1Sa\',23,2);">23:2</a>; <a onClick="return mV(\'1Sa\',28,6);">28:6</a>; <a onClick="return mV(\'1Sa\',30,8);">30:8</a>), in later times to a prophet (<a onClick="return mV(\'1Ki\',22,5);">1Ki 22:5</a>ff; <a onClick="return mV(\'2Ki\',3,13);">2Ki 3:13</a>; <a onClick="return mV(\'2Ki\',19,2);">19:2</a>; <a onClick="return mV(\'Jer\',38,14);">Jer 38:14</a>). Cases are mentioned in which the Ark accompanied the army to the field (<a onClick="return mV(\'1Sa\',4,4);">1Sa 4:4</a>; <a onClick="return mV(\'1Sa\',14,18);">14:18</a>), and before the engagement sacrifices also were offered (<a onClick="return mV(\'1Sa\',7,9);">1Sa 7:9</a>; <a onClick="return mV(\'1Sa\',13,9);">13:9</a>), ordinarily necessitating the presence of a priest (<a onClick="return mV(\'Deu\',20,2);">De 20:2</a>). Councils of war were held to settle questions of policy in the course of siege or a campaign (<a onClick="return mV(\'Jer\',38,7);">Jer 38:7</a>; <a onClick="return mV(\'Jer\',39,3);">39:3</a>). The signal for the charge or retreat was given by sound of a trumpet (<a onClick="return mV(\'Num\',10,9);">Nu 10:9</a>; <a onClick="return mV(\'2Sa\',2,28);">2Sa 2:28</a>; <a onClick="return mV(\'2Sa\',18,16);">18:16</a>; <span class="noTag">1Macc 16:8</span>). The order of battle was simple, the heavy-armed spearmen forming the van, slingers and archers bringing up the rear, supported by horses and chariots, which moved to the front as need required (<a onClick="return mV(\'1Sa\',31,3);">1Sa 31:3</a>; <a onClick="return mV(\'1Ki\',22,31);">1Ki 22:31</a>; <a onClick="return mV(\'2Ch\',14,9);">2Ch 14:9</a>). Strategy was called into play according to the disposition of the opposing forces or the nature of the ground (<a onClick="return mV(\'Jos\',8,3);">Jos 8:3</a>; <a onClick="return mV(\'Jos\',11,7);">11:7</a>; <a onClick="return mV(\'Jdg\',7,16);">Jud 7:16</a>; <a onClick="return mV(\'1Sa\',15,5);">1Sa 15:5</a>; <a onClick="return mV(\'2Sa\',5,23);">2Sa 5:23</a>; <a onClick="return mV(\'2Ki\',3,11);">2Ki 3:11</a>ff).<P>Although David had in his service foreign soldiers like Uriah the Hittite and Ittai of Gath, and although later kings hired aliens for their campaigns, it was not till the Maccabean struggle for independence that mercenaries came to be largely employed in the Jewish army. Mercenaries are spoken of in the prophets as a source of weakness to the nation that employs them (to Egypt, <a onClick="return mV(\'Jer\',46,16,21);">Jer 46:16, 21</a>; to Babylon, <a onClick="return mV(\'Jer\',50,16);">Jer 50:16</a>). From the Maccabean time onward the princes of the Hasmonean family employed them, sometimes to hold the troublesome Jews in check, and sometimes to support the arms of Rome. Herod the Great had in his army mercenaries of various nations. When Jewish soldiers, however, took service with Rome, they were prohibited by their law from performing duty on the Sabbath. Early in the Maccabean fight for freedom, a band of Hasideans or Jewish Puritans, allowed themselves to be cut down to the last man rather than take up the sword on the Sabbath (1Macc 2:34f). Cases are even on record where their Gentile adversaries took advantage of their scruples to inflict upon them loss and defeat (Ant., XIII, xii, 4; XIV, iv, 2).<P>8. The Supplies of the Army:<P>Before the army had become a profession in Israel, and while the levies were still volunteers like the sons of Jesse, the soldiers not only received no pay, but had to provide their own supplies, or depend upon rich landholders like Nabal and Barzillai (<a onClick="return mV(\'1Sa\',25,\'1-\');">1Sa 25</a>; <a onClick="return mV(\'2Sa\',19,31);">2Sa 19:31</a>). In that period and still later, the chief reward of the soldier was his share of the booty gotten in war (<a onClick="return mV(\'Jdg\',5,30);">Jud 5:30</a>f; <a onClick="return mV(\'1Sa\',30,22);">1Sa 30:22</a>ff). By the Maccabean period we learn that an army like that of Simon, consisting of professional soldiers, could only be maintained at great expense (1Macc 14:32).<P>9. In the New Testament:<P>Although the first soldiers that we read of in the New Testament were Jewish and not Roman (<a onClick="return mV(\'Luk\',3,14);">Lu 3:14</a>; <a onClick="return mV(\'Mar\',6,27);">Mr 6:27</a>), and although we read that Herod with his "men of war" joined in mocking Jesus (<a onClick="return mV(\'Luk\',23,11);">Lu 23:11</a>), it is for the most part the Roman army that comes before us. The Roman legion, consisting roughly of 6,000 men, was familiar to the Jewish people, and the word had become a term to express a large number (<a onClick="return mV(\'Mat\',26,53);">Mt 26:53</a>; <a onClick="return mV(\'Mar\',5,9);">Mr 5:9</a>). Centurions figure most honorably alike in the Gospels and the Acts (kenturion, <a onClick="return mV(\'Mar\',15,39);">Mr 15:39</a>; hekatontarches, hekatontarchos, <a onClick="return mV(\'Mat\',8,5);">Mt 8:5</a>; <a onClick="return mV(\'Luk\',23,47);">Lu 23:47</a>; <a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>; <a onClick="return mV(\'Act\',22,25,27);">22:25, 27</a>). "The Pretorium" is the residence of the Roman procurator at Jerusalem, and in Caesarea (<a onClick="return mV(\'Mat\',27,27);">Mt 27:27</a>; <a onClick="return mV(\'Act\',23,35);">Ac 23:35</a>), or the praetorian guard at Rome (<a onClick="return mV(\'Phl\',1,13);">Php 1:13</a>). The Augustan band and the Italian band (<a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>; <a onClick="return mV(\'Act\',27,1);">Ac 27:1</a>) are cohorts of Roman soldiers engaged on military duty at Caesarea. In Jerusalem there was one cohort stationed in the time of Paul under the command of a chiliarchos, or military tribune (<a onClick="return mV(\'Act\',22,24);">Ac 22:24</a>). It was out of this regiment that the dexiolaboi (<a onClick="return mV(\'Act\',23,23);">Ac 23:23</a>) were selected, who formed a guard for Paul to Caesarea, spearmen, or rather javelin- throwers.<P>Figurative: Among the military metaphors employed by Paul, who spent so much of his time in the later years of his life among Roman soldiers, some are taken from the weapons of the Roman soldier (see <a href="./study/isbe/search.html?string=ARMS">ARMS</a>), and some also from the discipline and the marching and fighting of an army. Thus, "campaigning" is referred to (<a onClick="return mV(\'2Ti\',2,3,4);">2Ti 2:3-4</a>; <a onClick="return mV(\'2Cr\',10,\'3-6\');">2Co 10:3-6</a>); the "order and solid formation of soldiers" drawn up in battle array or on the march (<a onClick="return mV(\'Col\',2,5);">Col 2:5</a>); the "triumphal procession" to the capitol with its train of captives and the smoke of incense (<a onClick="return mV(\'2Cr\',2,\'14-16\');">2Co 2:14-16</a>); and "the sounding of the trumpet," when the faithful Christian warriors shall take their place every man in his own order or "division" of the resurrection army of the Lord of Hosts (<a onClick="return mV(\'1Cr\',15,52,53);">1Co 15:52-53</a>). (See Dean Howson, Metaphors of Paul—"Roman Soldiers.")<P>The armies which are in heaven (<a onClick="return mV(\'Rev\',19,14,19);">Re 19:14, 19</a>) are the angelic hosts who were at the service of their Incarnate Lord in the days of His flesh and in His exaltation follow Him upon white horses clothed in fine linen white and pure (see Swete\'s note).`<a href="./study/isbe/search.html?string=ARMOR+ARMS">ARMOR, ARMS</a>`128';
isbe[752]='Army, Roman`ar\'-mi, ro\'-man; The treatment of this subject will be confined to<P>(I) a brief description of the organization of the army, and<P>(II) a consideration of the allusions to the Roman military establishment in the New Testament.<P>I. Organization.<P>There were originally no standing forces, but the citizens performed military service like any other civic duty when summoned by the magistrates. The gradual development of a military profession and standing army culminated in the admission of the poorest class to the ranks by Marius (about 107 BC). Henceforth the Roman army was made up of a body of men whose character was essentially that of mercenaries, and whose term of continuous service varied in different divisions from 16 to 26 years.<P>The forces which composed the Roman army under the Empire may be divided into the following five groups:<P class="in15">(1) the imperial guard and garrison of the capital,<P class="in15">(2) the legions,<P class="in15">(3) the auxilia,<P class="in15">(4) the numeri,<P class="in15">(5) the fleet. We shall discuss their organization in the order mentioned.<P>1. The Imperial Guard:<P>The imperial guard consisted of the cohortes praetoriae, which together with the cohortes urbanae and vigiles made up the garrison of Rome. In the military system as established by Augustus there were nine cohorts of the praetorian guard, three of the urban troops, and seven of the vigiles. Each cohort numbered 1,000 men, and was commanded by a tribune of equestrian rank. The praetorian prefects (praefecti praetorii), of whom there were usually two, were commanders of the entire garrison of the capital, and stood at the highest point of distinction and authority in the equestrian career.<P>2. The Legions:<P>There were 25 legions in 23 AD (Tacitus Annals 4, 5), which had been increased to 30 at the time of the reign of Marcus Aurelius, 160-180 AD (CIL, VI, 3492 a-b) and to 33 under Septimius Severus (Dio Cassius, iv. 23-24). Each legion was made up, ordinarily, of 6,000 men, who were divided into 10 cohorts, each cohort containing 3 maniples, and each maniple in turn 2 centuries.<P>The legatus Augustus pro praetore, or governor of each imperial province, was chief commander of all the troops within the province. An officer of senatorial rank known as legatus Augusti legionis was entrusted with the command of each legion, together with the bodies of auxilia which were associated with it. Besides, there were six tribuni militum, officers of equestrian rank (usually sons of senators who had not yet held the quaestorship) in each legion. The centurions who commanded the centuries belonged to the plebeian class. Between the rank of common soldier and centurion there were a large number of subalterns, called principales, who correspond roughly to the non-commissioned officers and men detailed from the ranks for special duties in modern armies.<P>3. The "Auxilia":<P>The auxilia were organized as infantry in cohortes, as cavalry in alae, or as mixed bodies, cohortes equitatae. Some of these divisions contained approximately 1,000 men (cohortes or alae miliariae), but the greater number about 500 (cohortes or alae quingenariae). They were commanded by tribuni and praefecti of equestrian rank. The importance of the auxilia consisted originally in the diversity of their equipment and manner of fighting, since each group adhered to the customs of the nation in whose midst it had been recruited. But with the gradual Romanization of the Empire they were assimilated more and more to the character of the legionaries.<P>4. The "Numeri":<P>The numeri developed out of the provincial militia and began to appear in the 2nd century AD. They maintained their local manner of warfare. Some were bodies of infantry, others of cavalry, and they varied in strength from 300 to 90 (Mommsen, Hermes, XIX, 219f; and XXII, 547f). Their commanders were praepositi, praefecti or tribuni, all men of equestrian rank.<P>5. The Fleet:<P>The fleet was under the command of prefects (praefecti classis), who took rank among the highest officials of the equestrian class. The principal naval stations were at Misenum and Ravenna.<P>6. Defensive Arrangements:<P>Augustus established the northern boundary of the Empire at the Rhine and at the Danube, throughout the greater part of its course, and bequeathed to his successors the advice that they should not extend their sovereignty beyond the limits which he had set (Tacitus Annals i.11; Agricola 13); and although this policy was departed from in many instances, such as the annexation of Thrace, Cappadocia, Mauretania, Britain, and Dacia, not to mention the more ephemeral acquisitions of Trajan, yet the military system of the Empire was arranged primarily with the view of providing for the defense of the provinces and not for carrying on aggressive warfare on a large scale. Nearly all the forces, with the exception of the imperial guard, were distributed among the provinces on the border of the Empire, and the essential feature of the disposition of the troops in these provinces was the permanent fortress in which each unit was stationed.<P>The combination of large camps for the legions with a series of smaller forts for the alae, cohorts, and numeri is the characteristic arrangement on all the frontiers. The immediate protection of the frontier was regularly entrusted to the auxiliary troops, while the legions were usually stationed some distance to the rear of the actual boundary. Thus the army as a whole was so scattered that it was a difficult undertaking to assemble sufficient forces for carrying out any considerable project of foreign conquest, or even to cope at once with a serious invasion, yet the system was generally satisfactory in view of the conditions which prevailed, and secured for the millions of subjects of the Roman Empire the longest period of undisturbed tranquillity known to European history.<P>7. Recruiting System:<P>In accordance with the arrangements of Augustus, the cohortes praetoriae and cohortes urbanae were recruited from Latium, Etruria, Umbria, and the older Roman colonies (Tacitus Annals 4, 5), the legions from the remaining portions of Italy, and the auxilia from the subject communities of the Empire (Seeck, Rheinisches Museum, XLVIII, 616).<P>But in course of time the natives of Italy disappeared, first from the legions, and later from the garrison of the capital. Antoninus Plus established the rule that each body of troops should draw its recruits from the district where it was stationed. Henceforth the previous possession of Roman citizenship was no longer required for enlistment in the legions. The legionary was granted the privilege of citizenship upon entering the service, the auxiliary soldier upon being discharged (Seeck, Untergang der antiken Welt, I, 250).<P>II. Allusions in the New Testament to the Roman Military Establishment.<P>Such references relate chiefly to the bodies of troops which were stationed in Judea. Agrippa I left a military establishment of one ala and five cohorts at his death in 44 AD (Josephus, Ant, XIX, ix, 2; BJ, III, iv, 2), which he had doubtless received from the earlier Roman administration. These divisions were composed of local recruits, chiefly Samaritans (Hirschfeld, Verwaltungsbeamte, 395; Mommsen, Hermes, XIX,217,note 1). The Ala I gemina Sebastenorum was stationed at Caesarea (Josephus, Ant, XX, 122; BJ, II, xii, 5; CIL, VIII, 9359).<P>1. Augustan Band:<P>Julius, the centurion to whom Paul and other prisoners were delivered to be escorted to Rome (<a onClick="return mV(\'Act\',27,1);">Ac 27:1</a>), belonged to one of the five cohorts which was stationed at or near Caesarea. This Speira Sebaste (Westcott-Hort), "Augustus\' Band" (the Revised Version (British and American) "Augustan band"; the Revised Version, margin "cohort"), was probably the same body of troops which is mentioned in inscriptions as Cohors I Augusta (CIL, Supp, 6687) and Speira Augouste (Lebas-Waddington 2112). Its official title may have been Cohors Augusta Sebastenorum (GVN). It will be observed that all divisions of the Roman army were divided into companies of about 100 men, each of which, in the infantry, was commanded by a centurion, in the cavalry, by a decurion.<P>2. Italian Band:<P>There was another cohort in Caesarea, the "Italian band" (Cohors Italica, Vulgate) of which Cornelius was centurion (<a onClick="return mV(\'Act\',10,1);">Ac 10:1</a>: ek speires tes kaloumenes Italikes). The cohortes Italicae (civium Romanorum) were made up of Roman citizens (Marquardt, Romische Staatsverwaltung, II, 467).<P>3. Praetorian Guard:<P>One of the five cohorts was stationed in Jerusalem (<a onClick="return mV(\'Mat\',27,27);">Mt 27:27</a>; <a onClick="return mV(\'Mar\',15,16);">Mr 15:16</a>), the "chief captain" of which was Claudius Lysias. His title, chiliarchos in the Greek (<a onClick="return mV(\'Act\',23,10,15,17,19,22,26);">Ac 23:10, 15, 17, 19, 22, 26</a>; <a onClick="return mV(\'Act\',24,7);">24:7</a> the King James Version), meaning "leader of a thousand men" (tribunus, Vulgate), indicates that this body of soldiers was a cohors miliaria. Claudius Lysias sent Paul to Felix at Caesarea under escort of 200 soldiers, 70 horsemen, and 200 spearmen (<a onClick="return mV(\'Act\',23,23);">Ac 23:23</a>). The latter (dexiolaboi, Westcott and Hort, The New Testament in Greek) are thought to have been a party of provincial militia. Several centurions of the cohort at Jerusalem appear during the riot and subsequent rescue and arrest of Paul (<a onClick="return mV(\'Act\',21,32);">Ac 21:32</a>; <a onClick="return mV(\'Act\',22,25,26);">22:25-26</a>; <a onClick="return mV(\'Act\',23,17,23);">23:17, 23</a>). The cohortes miliariae (of 1,000 men) contained ten centurions. A centurion, doubtless of the same cohort, was in charge of the execution of the Saviour (<a onClick="return mV(\'Mat\',27,54);">Mt 27:54</a>; <a onClick="return mV(\'Mar\',15,39,44,45);">Mr 15:39, 44-45</a>; <a onClick="return mV(\'Luk\',23,47);">Lu 23:47</a>). It was customary for centurions to be entrusted with the execution of capital penalties (Tacitus Ann. i.6; xvi.9; xvi.15; Hist. ii.85).<P>The the King James Version contains the passage in <a onClick="return mV(\'Act\',28,16);">Ac 28:16</a>: "The centurion delivered the prisoners to the captain of the guard" (stratopedarches), which the Revised Version (British and American) omits. It has commonly been held that the expression stratopedarches was equivalent to praetorian prefect (praefectus praetorius), and that the employment of the word in the singular was proof that Paul arrived in Rome within the period 51-62 AD when Sex. Afranius Burrus was sole praetorian prefect. Mommsen (Sitzungsberichte der Berliner Akademie (1895), 491-503) believes that the sentence in question embodies an ancient tradition, but that the term stratopedarches could not mean praefectus praetorius, which is never rendered in this way in Greek. He suggests that it stands for princeps castrorum peregrinorum, who was a centurion in command of the frumentarii at Rome. These were detachments of legionary soldiers who took rank as principales. They served as military couriers between the capital and provinces, political spies, and an imperial police. It was probably customary, at least when the tradition under discussion arose, for the frumentarii to take charge of persons who were sent to Rome for trial (Marquardt, Romische Staatsverwaltung, II, 491-94).<P>LITERATURE.<P>Comprehensive discussions of the Roman military system will be found in Marquardt, Romische Staatsverwaltung, II, 319-612, and in Pauly-Wissowa, Realencyclopadie, article "Exercitus."``3';
isbe[753]='Arna`ar\'-na (Latin Arna): One of the ancestors of Ezra given in 2Esdras 1:2, evidently identical with Zerahiah of <a onClick="return mV(\'Ezr\',7,4);">Ezr 7:4</a> and Zaraias of 1Esdras 8:2.``1';
isbe[754]='Arnan`ar\'-nan (\'arnan, "joyous"): A descendant of David and founder of a family (<a onClick="return mV(\'1Ch\',3,21);">1Ch 3:21</a>). The Septuagint has Orna.``1';
isbe[755]='Arni`ar\'-ni (Arnei, found only in <a onClick="return mV(\'Luk\',3,33);">Lu 3:33</a> the Revised Version (British and American), following Westcott and Hort, The New Testament in Greek): The name of an ancestor of Jesus Christ. But in the King James Version, following Textus Receptus of the New Testament, and in the genealogical list of <a onClick="return mV(\'Mat\',13,4);">Mt 13:4</a> the same person is called Aram (Greek: Aram) in both the King James Version and the Revised Version, margin. In Matthew the Revised Version (British and American), however, the form is Ram, which is nearest to the Old Testament name Ram (ram, "high"). Ram was great-grandson of Judah and ancestor of David (<a onClick="return mV(\'Rth\',4,19);">Ru 4:19</a>; <a onClick="return mV(\'1Ch\',2,9,10);">1Ch 2:9-10</a>).``1';
isbe[756]='Arnon`ar\'-non (\'arnon; Arnon): Is first mentioned in <a onClick="return mV(\'Num\',21,24);">Nu 21:24</a> as the border between Moab and the Amorites. "The valleys of Arnon" in the next verse undoubtedly indicate the numerous wadies contributary to the main stream. It formed the southern boundary of the land assigned to Reuben (<a onClick="return mV(\'Deu\',3,12);">De 3:12</a>). The city of Aroer stood on the northern edge of the valley (<a onClick="return mV(\'Deu\',2,36);">De 2:36</a>; <a onClick="return mV(\'Jdg\',12,2);">Jud 12:2</a>, etc.). Arnon was claimed by the Ammonites as having marked the southern limit of their territory when Israel invaded the land (<a onClick="return mV(\'Jdg\',11,13);">Jud 11:13</a>). They, however, had already been driven out by the Amorites, and the region north of Arnon was held by Sihon. From the inscription of Mesha on the Moabite Stone we gather that Moab had established herself on the north of the Arnon before the time of Omri. Under Omri and Ahab she was confined to the south of the river. A rebellion under Mesha was put down by Jehoram son of Ahab (<a onClick="return mV(\'2Ki\',3,\'1-\');">2Ki 3</a>), and the expedition of Hazael against Israel reached the valley of the Arnon (<a onClick="return mV(\'2Ki\',10,33);">2Ki 10:33</a>). But according to Mesha he regained for Moab the lost land; and this agrees with <a onClick="return mV(\'Isa\',15,\'1-\');">Isa 15</a>, <a onClick="return mV(\'Isa\',16,\'1-\');">16</a>, where cities north of Arnon are located in Moab, e.g. Heshbon.<P>The modern name of Arnon is Wady el-Mojib, which enters the Dead Sea from the east about 11 miles north of el-Lisan. Some 13 miles east of the Dead Sea two streams, Seil es-Sa\'ideh from the south, and Wady Enkeileh from the east, unite their waters and flow westward in the bottom of an enormous trench. The waters of Wady Welch come in from the northeast. A wide stretch of country thus drains into the valley by means of a great network of smaller wadies—the "valleys of Arnon." The "fords of the Arnon" (<a onClick="return mV(\'Isa\',16,2);">Isa 16:2</a>) were doubtless crossed by Mesha\'s highway which he claims to have built in Arnon; and may be marked by the traces of the old Roman road and bridge immediately to the west of where, on the northern edge of the Wady, stands \'Ara\'ir, the ancient Aroer.``54';
isbe[757]='Arod`a\'-rod, ar\'-od (\'arodh): The sixth son of Gad (<a onClick="return mV(\'Num\',26,17);">Nu 26:17</a>). His descendants are called Arodi or Arodites (<a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a>; <a onClick="return mV(\'Num\',26,17);">Nu 26:17</a>).``1';
isbe[758]='Arodi`ar\'-o-di.`<a href="./study/isbe/search.html?string=AROD">AROD</a>`1';
isbe[759]='Arodites`a\'-rod-its.`<a href="./study/isbe/search.html?string=AROD">AROD</a>`1';
isbe[760]='Aroer`a-ro\'-er (\'aro\'er; Aroer):<P>(1) A city of the Amorites which stood on the northern edge of the Arnon (<a onClick="return mV(\'Deu\',2,36);">De 2:36</a>, etc.). Taken by Israel, it shared the vicissitudes of the country north of the river, and when last named (<a onClick="return mV(\'Jer\',48,19);">Jer 48:19</a>) is again in the hands of Moab. It is one of the cities which Mesha claims to have built, i.e. fortified. It was within the territory allotted to Reuben, yet its building (fortification) is attributed to Gad (<a onClick="return mV(\'Num\',32,34);">Nu 32:34</a>). Thus far came the Syrian, Hazael, in his raid upon Israel (<a onClick="return mV(\'2Ki\',10,33);">2Ki 10:33</a>). The Roman road across the valley lay about an hour to the west of Khirbet \'Ara\'ir.<P>(2) A city in Gilead described as "before Rabbah," on the boundary between Gad and the Ammonites (<a onClick="return mV(\'Jos\',13,25);">Jos 13:25</a>). No name resembling this has yet been recovered in the district indicated.<P>(3) A city in the territory of Judah named only in <a onClick="return mV(\'1Sa\',30,28);">1Sa 30:28</a>. Probably however in <a onClick="return mV(\'Jos\',15,22);">Jos 15:22</a> we should read \'ar\'arah instead of \'adh\'adhah, which may be the same city, and may be identical with \'Ar\'ara, a site with cisterns and some remains of ancient buildings about 14 miles southeast of Beersheba.``54';
isbe[761]='Aroerite`a-ro\'-er-it (ha-\'aro\'eri): A native of Aroer. The Aroerite was Hotham, father of two of David\'s heroes (<a onClick="return mV(\'1Ch\',11,44);">1Ch 11:44</a>).``1';
isbe[762]='Arom`a\'-rom (Arom): The sons of Arom returned to Jerusalem with Zerubbabel (1Esdras 5:16). Omitted in Ezra and Nehemiah. Hashum is found in place of Arom in <a onClick="return mV(\'Ezr\',2,19);">Ezr 2:19</a>.``1';
isbe[763]='Arpachshad`ar-pak\'-shad.`<a href="./study/isbe/search.html?string=ARPHAXAD">ARPHAXAD</a>`1';
isbe[764]='Arpad; Arphad`ar\'-pad; ar\'-fad (\'arpadh, "support"): A city of Syria, captured frequently by the Assyrians, and finally subjugated by Tiglath-pileser III in 740 BC, after a siege of two years. It is now the ruin Tell Erfad, 13 miles northwest of Aleppo. Arpad is one of the conquered cities mentioned by Rabshakeh, the officer of Sennacherib, in his boast before Jerusalem (<a onClick="return mV(\'2Ki\',18,34);">2Ki 18:34</a>; <a onClick="return mV(\'2Ki\',19,13);">19:13</a>; <a onClick="return mV(\'Isa\',36,19);">Isa 36:19</a>; <a onClick="return mV(\'Isa\',37,13);">37:13</a>; the King James Version Arphad). Isaiah puts a boast about its capture in the mouth of the Assyrian king (<a onClick="return mV(\'Isa\',10,9);">Isa 10:9</a>), and Jeremiah mentions it as "confounded" because of evil tidings, in the oracle concerning Damascus (<a onClick="return mV(\'Jer\',49,23);">Jer 49:23</a>). On every occasion Arpad is mentioned with Hamath.``78';
isbe[765]='Arphaxad`ar-fak\'-sad:<P>(1) the King James Version form (<a onClick="return mV(\'Gen\',10,22,24);">Ge 10:22, 24</a>; <a onClick="return mV(\'Gen\',11,12,13);">11:12-13</a>; <a onClick="return mV(\'1Ch\',1,17);">1Ch 1:17</a>) of the Revised Version (British and American) <a href="./study/isbe/search.html?string=ARPACHSHAD">ARPACHSHAD</a>, which see. See also <a href="./study/isbe/search.html?string=TABLE+OF+NATIONS">TABLE OF NATIONS</a>.<P>(2) In Apocrypha (Judith 1) a king of the Medes, who reigned in Ecbatana. He was defeated and slain by Nebuchadrezzar.``1';
isbe[766]='Array`a-ra\':<p>(1) labhesh, \'atah; periballo, enduomai, himatismos.<P>(2) \'arakh, shith: "Array," composed of prefix "ar-" and "rai," "order," is used in two senses,<P class="in15">(1) in reference to clothing and<P class="in15">(2) in reference to the disposition of an army.<P>(1) (a) Labhesh is the most common Hebrew word meaning "to clothe," and is used in all cases but one in the Old Testament for "array" (compare <a onClick="return mV(\'Gen\',41,42);">Ge 41:42</a>: Pharaoh "arrayed him (Joseph) in vestures of fine linen"; see also <a onClick="return mV(\'2Ch\',28,15);">2Ch 28:15</a>; <a onClick="return mV(\'Est\',6,9,11);">Es 6:9, 11</a>; <a onClick="return mV(\'Job\',40,10);">Job 40:10</a>; <a onClick="return mV(\'2Ch\',5,12);">2Ch 5:12</a>).<P>(b) \'ATah, meaning "to veil," "to cover," is once used. Nebuchadrezzar "shall array himself with the land of Egypt" (<a onClick="return mV(\'Jer\',43,12);">Jer 43:12</a>).<P>(c) Periballo, "to throw around," is used 6 times in the New Testament. It is the word used of Herod\'s "arraying" Jesus "in gorgeous apparel" (<a onClick="return mV(\'Luk\',23,11);">Lu 23:11</a>; the other references are <a onClick="return mV(\'Mat\',6,29);">Mt 6:29</a>; <a onClick="return mV(\'Luk\',12,27);">Lu 12:27</a>; <a onClick="return mV(\'Rev\',7,13);">Re 7:13</a>; <a onClick="return mV(\'Rev\',17,4);">17:4</a>; <a onClick="return mV(\'Rev\',19,8);">19:8</a>).<P>(d) Enduomai, middle or passive of enduo, "to enter," means, therefore, "to be entered into" clothing. Once it is used in reference to Herod (<a onClick="return mV(\'Act\',12,21);">Ac 12:21</a>).<P>(e) Himatismos, "clothing," is translated once "array" = raiment (from same root). This is the only occurrence of "array" in this sense (<a onClick="return mV(\'1Ti\',2,9);">1Ti 2:9</a>).<P>(2) (a) \'Arakh is the common word in the Old Testament, used in reference to the disposition of an army, and is translated "to put in array," "to set in array," the object being "the battle" or the army. The root meaning is that of orderly arrangement, and the verb is used in other senses than the military, e. g. arranging the table of shewbread. In <a onClick="return mV(\'1Ch\',12,33);">1Ch 12:33</a> the Revised Version (British and American) has "order the battle array" for the King James Version "keep rank," translation of Hebrew \'adhar.<P>(b) Shith, "to set, to place," used once for battle array: "and the horsemen set themselves in array at the gate" (<a onClick="return mV(\'Isa\',22,7);">Isa 22:7</a>).``78';
isbe[767]='Arrest, And Trial of Jesus`a-rest\'`<a href="./study/isbe/search.html?string=JESUS+CHRIST+THE+ARREST+AND+TRIAL+OF">JESUS CHRIST, THE ARREST AND TRIAL OF</a>`1';
isbe[768]='Arrive`a-riv\': Originally a nautical term (Latin: ad ripam) for reaching shore, is used in the literal sense in <a onClick="return mV(\'Luk\',8,26);">Lu 8:26</a>, and, in the figurative sense for Greek phthano, instead of "attain to," the Revised Version (British and American) in <a onClick="return mV(\'Rom\',9,31);">Ro 9:31</a>.``1';
isbe[769]='Arrogancy`ar\'-o-gan-si: Excessive pride, leading to boastfulness and insolence (<a onClick="return mV(\'1Sa\',2,3);">1Sa 2:3</a>; <a onClick="return mV(\'Pro\',8,13);">Pr 8:13</a>; <a onClick="return mV(\'Isa\',13,11);">Isa 13:11</a>; <a onClick="return mV(\'Jer\',48,29);">Jer 48:29</a>).``1';
isbe[770]='Arrow`ar\'-o.`<a href="./study/isbe/search.html?string=ARCHERY">ARCHERY</a>; <a href="./study/isbe/search.html?string=ARMOR">ARMOR</a>`1';
isbe[771]='Arrows, Divination By``<a href="./study/isbe/search.html?string=AUGURY">AUGURY</a>`1';
isbe[772]='Arrowsnake`ar\'-o-snak: In <a onClick="return mV(\'Isa\',34,15);">Isa 34:15</a> the Hebrew word kippoz, which in the King James Version is rendered "great owl," is in the English Revised Version rendered "arrowsnake," and in the American Standard Revised Version "dart-snake." Gesenius, who translates "arrowsnake," says "so called from the spring with which it propels itself." Others, from the mention of "make her nest, lay, and hatch," think some kind of bird is meant.`<a href="./study/isbe/search.html?string=OWL">OWL</a>; <a href="./study/isbe/search.html?string=SERPENT">SERPENT</a>`1';
isbe[773]='Arsaces`ar-sa\'-sez ar\'-sa-sez (Arsakes): The common name assumed by all the Parthian kings, is mentioned in 1Macc 14:1-3, and in 15:22 in connection with the history of Demetrius, one of the Greek, or Seleucid, kings of Syria, and successor to Antiochus Epiphanes, the oppressor of the Jews, who caused the uprising against the Syrian domination under the leadership of the Maccabees. This particular Arsaces was the sixth of the line of independent Parthian rulers which had been founded in 250 BC by Arsaces I, who revolted from Antiochus Theos, killed the Syrian satraps, and with his successor Tiridates I firmly established the independence of the Parthian kingdom. About 243 BC, Tiridates added Hyrcania to his dominions; but it was not till the reign of Arsaces VI, whose pre- regnal name was Mithridates, that Parthia through the conquest of Bactria, Media, Persia, Armenia, Elymais and Babylonia, threatened the very existence of the kingdom of the Seleucids and became a dangerous competitor of Rome itself.<P>It was this king who about 141 BC was attacked by Demetrius Nicator, king of Syria. According to the account preserved in 1Macc 14:1-3, Arsaces sent one of his captains, who went and smote the host of Demetrius, and took him alive, and brought him to Arsaces, by whom he was put in ward. At first, the captive king was treated with great severity, being carried in triumph from city to city and exhibited to his enemies. Later, however, Arsaces gave him his daughter in marriage and assigned him a residence in Hyrcania. Some time after the death of Arsaces, Demetrius was sent back to Syria by Phraates, the son of Mithridates, and reigned from 128 to 125 BC. Arsaces VI is mentioned, also, in 1Macc 15:22, as one of the kings whom the Romans forbade to make war on their Jewish allies.<P>LITERATURE.<P>See 1Macc 14:1-3, and 15:22; Ant, XIII, v, 11; XIV, viii, 5; Appian, Syria, 67; Strabo, XI, 515; XV, 702; Justin, XLI,5,6; XXXVI, 1; Orosius, V, 4; Rawlinson\'s Parthia, in the Story of the Nations series and Die Herrschaft der Parther in Justi\'s Geschichte des alten Persiens in Oncken\'s Allgemeine Geschichte, I, 4.``196';
isbe[774]='Arsareth`ar\'-sa-reth.`<a href="./study/isbe/search.html?string=ARZARETH">ARZARETH</a>`1';
isbe[775]='Arsiphurith`ar-si-fu\'-rith (Arsiphourith; the King James Version Azephurith): 112 of the sons of Arsiphurith returned to Jerusalem with Zerubbabel (1Esdras 5:16). The name is omitted in Ezra and Nehemiah, but the number corresponds to those mentioned with Jorah (<a onClick="return mV(\'Ezr\',2,18);">Ezr 2:18</a>) and Hariph (<a onClick="return mV(\'Neh\',7,24);">Ne 7:24</a>).``1';
isbe[776]='Artaxerxes`ar-taks-urk\'-sez (Artaxerxes): Is the Greek and Latin form of one, and perhaps of two or three kings of Persia mentioned in the Old Testament.<P>(1) All are agreed that the Artaxerxes at whose court Ezra and Nehemiah were officials is Artaxerxes I, the son of Xerxes, commonly called Longimanus, who reigned from 465 to 424 BC. This Artaxerxes was the third son of Xerxes and was raised to the throne by Artabanus, the murderer of Xerxes. Shortly after his accession, Artaxerxes put his older brother Darius to death; and a little later, Artabanus, who perhaps aimed to make himself king, was killed. Hystaspes, the second brother, who seems to have been satrap of Bactria at the time of his father\'s death, rebelled, and after two battles was deprived of his power and probably of his life. The reign of Artaxerxes was further disturbed by the revolt of Egypt in 460 BC, and by that of Syria about 448 BC.<P>The Egyptians were assisted by the Athenians, and their rebellion, led by Inarus and Amyrtaeus, was suppressed only after five years of strenuous exertions on the part of the Persians under the command of the great general Megabyzus. After the re-conquest of Egypt, Artaxerxes, fearing that the Athenians would make a permanent subjugation of Cyprus, concluded with them the peace of Callias, by which he retained the island of Cyprus; but agreed to grant freedom to all Greek cities of Asia Minor. Shortly after this Megabyzus led a revolt in Syria and compelled his sovereign to make peace with him on his own terms, and afterward lived and died in high favor with his humiliated king. Zopyrus, the son of Megabyzus at a later time, while satrap of Lycia and Caria, led a rebellion in which he was assisted by the Greeks. It is thought by some that the destruction of Jerusalem which is lamented by Nehemiah occurred during the rebellion of Syria under Megabyzus. Artaxerxes I died in 424 BC, and was succeeded by his son Xerxes II, and later by two other sons, Sogdianus and Ochus, the last of whom assumed the regnal name of Darius, whom the Greeks surnamed Nothus.<P>(2) Ewald and others have thought that the Artaxerxes of <a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a> was the pseudo-Smerdis. The principal objection against this view is that we have no evidence that either the pseudo-Smerdis, or the real Smerdis, was ever called Artaxerxes. The real Smerdis is said to have been called Tanyoxares, or according to others Oropastes. Ewald would change the latter to Ortosastes, which closely resembles Artaxerxes, and it must be admitted that many of the Persian kings had two or more names. It seems more probable, however, that Artaxerxes I is the king referred to; and there is little doubt that the identification of the Artaxerxes of <a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a> with the pseudo-Smerdis would never have been thought of had it not been for the difficulty of explaining the reference to him in this place.<P>(3) The Greek translation of the Septuagint renders the Ahasuerus of the Book of Esther by Artaxerxes, and is followed in this rendering by Josephus. There is no doubt that by this Artaxerxes Josephus meant the first of that name; for in the Antiquities, XI, vi, 1 he says that "after the death of Xerxes, the kingdom came to be transferred to his son Cyrus, whom the Greeks called Artaxerxes." He then proceeds to show how he married a Jewish wife, who was herself of the royal family and who is related to have saved the nation of the Jews. In a long chapter, he then gives his account of the story of Vashti, Esther and Mordecai. In spite of this rendering of the Septuagint and Josephus, there is no doubt that the Hebrew achashwerosh is the same as the Greek Xerxes; and there is no evidence that Artaxerxes I was ever called Xerxes by any of his contemporaries. The reason of the confusion of the names by the Septuagint and Josephus will probably remain forever a mystery.``196';
isbe[777]='Artemas`ar\'-te-mas (Artemas): One of the seventy disciples and bishop of Lystra, according to Dorotheus (Bibl. Maxima (Lugd. 1677), III, 429). He is mentioned in <a onClick="return mV(\'Tts\',3,12);">Titus 3:12</a> as one of the faithful companions of Paul. The name is probably Greek, a masculine form of Artemis, or, as has been suggested, a short form of Artemidorus, a common name in Asia Minor. These contracted forms were by no means rare in the Greek world. The Athenian orator, Lysias, was doubtless named after his grandfather, Lysanias, and at first may even have been called Lysanias himself.``1';
isbe[778]='Artemis`ar\'-te-mis.`<a href="./study/isbe/search.html?string=DIANA">DIANA</a>`1';
isbe[779]='Artificer`ar-tif\'-i-ser.`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`1';
isbe[780]='Artillery`ar-til\'-er-i (keli): In <a onClick="return mV(\'1Sa\',20,40);">1Sa 20:40</a> (the King James Version) of Jonathan\'s bow and arrows, replaced in the Revised Version (British and American) by <a href="./study/isbe/search.html?string=WEAPONS">WEAPONS</a>; and in 1Macc 6:51 (the King James Version) where the Greek words are translated in the Revised Version (British and American) "instruments for casting fire and stones."``1';
isbe[781]='Artisan`ar\'-ti-zan.`<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`1';
isbe[782]='Arts``<a href="./study/isbe/search.html?string=CRAFTS">CRAFTS</a>`1';
isbe[783]='Arubboth; Aruboth`a-rub\'-oth, ar\'-u-both (ha-\'arubboth; the King James Version Aruboth): One of the 12 districts from which victuals for Solomon\'s household were obtained (<a onClick="return mV(\'1Ki\',4,10);">1Ki 4:10</a>). With Arubboth are mentioned "Socoh, and all the land of Hepher," and as Socoh lay in the Shephelah (<a onClick="return mV(\'Jos\',15,35);">Jos 15:35</a>), Arubboth probably lay in the southern part of the Shephelah.``1';
isbe[784]='Arumah`a-roo\'-ma (arumah, "lofty"): The town in which Abimelech, the son of Jerubbaal (Gideon), dwelt when driven from Shechem (<a onClick="return mV(\'Jdg\',9,41);">Jud 9:41</a>). The ruins El-Ormeh, 6 miles southeast of Shechem, may be on the site, though its position is not known with certainty.``1';
isbe[785]='Arvad; Arvadites`ar\'-vad, ar\'-vad-its (\'arwadh; Arados; modern Ruad): An island city off the coast of Syria some 30 miles north of Tripolis, and the race inhabiting it. It was a barren rock covered with fortifications and houses several stories in height. The island was about 800 ft. long by 500 wide, surrounded by a massive wall, and an artificial harbor was constructed on the east toward the main land. It developed into a trading city in early times, as did most of the Phoenician cities on this coast. It had a powerful navy, and its ships are mentioned in the monuments of Egypt and Assyria. It seems to have had a sort of hegemony over the Northern Phoenician cities, from Mt. Cassius to the northern limits of Lebanon, something like that of Sidon in the south. It had its own local dynasty and coinage, and some of the names of its kings have been recovered. Its inhabitants are mentioned in the early lists of <a onClick="return mV(\'Gen\',10,18);">Ge 10:18</a>, and <a onClick="return mV(\'Eze\',27,8,11);">Eze 27:8, 11</a> refers to its seamen and soldiers in the service of Tyre. It brought under its authority some of the neighboring cities on the main land, such as Marathus and Simyra, the former nearly opposite the island and the latter some miles to the south.<P>Thothmes III, of Egypt, took it in his campaign in north Syria (1472 BC) and it is noticed in the campaigns of Rameses II in the early part of the 13th century BC (Breasted, Ancient Records). It is also mentioned in the Tell el-Amarna Lettersas being in league with the Amorites in their attacks upon the Egyptian possessions in Syria (44 and 28, B.M. Tell el-Amarna Letters). About the year 1200, or later, it was sacked by invaders from Asia Minor or the islands, as were most of the cities on the coast (Paton, Syria and Palestine, 145) but it recovered when they were driven back. Its maritime importance is indicated by the inscriptions of the Assyrian kings. Tiglath-pileser I (circa 1020) boasts that he sailed in the ships of Arvad. Asshur-nazir-pal (circa 876) made it tributary, but it revolted and we find 200 men of Arvad mentioned among the allies of Benhadad, of Damascus, at the great battle of Quarqar, when all Syria seems to have been in league against Shalmaneser II (circa 854). At this time the king of Arvad was Mattan Baal.<P>It was afterward tributary to Tiglath-pileser III and Sennacherib, the king who paid it to the latter being Abd-ilihit (circa 701). Ashurbanipal (circa 664) compelled its king Yakinlu to submit and send one of his daughters to become a member of the royal harem (Rawlinson, Phoenicia, 456-57). Under the Persians Arvad was allowed to unite in a confederation with Sidon and Tyre, with a common council at Tripolis(ib 484). When Alexander the Great invaded Syria in 332 BC Arvad submitted without a struggle under her king Strato, who sent his navy to aid Alexander in the reduction of Tyre. It seems to have received the favor of the Seleucid kings of Syria and enjoyed the right of asylum for political refugees. It is mentioned in a rescript from Rome about 138 BC, in connection with other cities and rulers of the East, to show favor to the Jews. It was after Rome had begun to interfere in the affairs of Judea and Syria, and indicates that Arvad was of considerable importance at that time (see 1Macc 15:16-23). The town is not mentioned in the New Testament, and in modern times has sunk to a small village, chiefly inhabited by fishermen.`<a href="./study/isbe/search.html?string=ARADUS">ARADUS</a>`138';
isbe[786]='Arza`ar\'-za (\'artsa\'): A steward of King Elah, in whose house at Tirzah Zimri murdered the king at a drinking debauch. The text is not quite clear, and Arza might have been a servant of Zimri (<a onClick="return mV(\'1Ki\',16,9);">1Ki 16:9</a>).``1';
isbe[787]='Arzareth`ar\'-za-reth, ar\'-sareth (the King James Version, Arsareth): This is the land to which the ten tribes were deported (2Esdras 13:45). It is described as "another land" lying a year and a half\'s journey beyond the river, i.e. the Euphrates. It probably answers to the Hebrew \'erets \'achereth (<a onClick="return mV(\'Deu\',29,28);">De 29:28</a>). In Josephus\' time the people were still believed to be there in countless numbers (Ant., XI, v, 2).``1';
isbe[788]='As`az: Conj. and adverb (usually Greek hos hosper, kathos), designating:<P>(1) Likeness: (a) between nouns (<a onClick="return mV(\'Gen\',3,5);">Ge 3:5</a>; <a onClick="return mV(\'Jdg\',6,5);">Jud 6:5</a>; <a onClick="return mV(\'Phl\',2,8);">Php 2:8</a>; <a onClick="return mV(\'Hbr\',11,27,29);">Heb 11:27, 29</a>); (b) between verbs (<a onClick="return mV(\'Luk\',6,36);">Lu 6:36</a>; <a onClick="return mV(\'Jhn\',5,30);">Joh 5:30</a>; <a onClick="return mV(\'1Cr\',10,7);">1Co 10:7</a>); (c) between adjectives (<a onClick="return mV(\'1Cr\',15,48);">1Co 15:48</a>).<P>(2) Limitation (with respect to a particular aspect or relation) (<a onClick="return mV(\'1Pe\',4,15,16);">1Pe 4:15-16</a>).<P>(3) Time (<a onClick="return mV(\'Luk\',8,5);">Lu 8:5</a>; <a onClick="return mV(\'Luk\',15,25);">15:25</a>; <a onClick="return mV(\'Act\',8,36);">Ac 8:36</a>).<P>(4) Cause (<a onClick="return mV(\'1Cr\',4,1);">1Co 4:1</a>).<P>(5) Concession (<a onClick="return mV(\'Jhn\',7,10);">Joh 7:10</a>; <a onClick="return mV(\'2Cr\',11,21);">2Co 11:21</a>).<P>(6) Illustration, in numerous passages, beginning "as it is written," "as it is said," etc.``1';
isbe[789]='Asa`a\'-sa (\'aca\', "healer"; Asa):<P>(1) A king of Judah, the third one after the separation of Judah and Israel. He was the son of Abijah and grandson of Rehoboam. Maacah, his mother, or rather grandmother, was daughter of Abishalom (Absalom) (<a onClick="return mV(\'1Ki\',15,1);">1Ki 15:1</a>f). The first ten years of his reign were prosperous and peaceful (<a onClick="return mV(\'2Ch\',14,1);">2Ch 14:1</a>). He introduced many reforms, such as putting away the sodomites or male prostitutes, removing idols from holy places, breaking down altars, pillars and Asherim. He even deposed the "queen mother" because of her idolatrous practices, and of the image which she had made for Asherah (<a onClick="return mV(\'1Ki\',15,12);">1Ki 15:12</a>ff; <a onClick="return mV(\'2Ch\',14,3);">2Ch 14:3</a>). Though the king himself, in the main, was a zealous reformer, his subjects did not always keep pace with him (<a onClick="return mV(\'1Ki\',15,17);">1Ki 15:17</a>). With an army of 580,000 he repelled an attack of Zerah, the Ethiopian, and routed him completely at Mareshah in the lowlands of Judah (<a onClick="return mV(\'2Ch\',14,6);">2Ch 14:6</a>ff). Directed and encouraged by Azariah the prophet, he carried on a great revival. Having restored the great altar of burnt offering in the temple, he assembled the people for a renewal of their covenant with Yahweh. On this occasion 700 oxen and 7,000 sheep were offered in sacrifice.<P>For the next twenty years there was apparently great prosperity and peace throughout his kingdom, but in the thirty-sixth year of his reign, Judah was attacked by Baasha, king of Israel, at all times hostile to Judah (<a onClick="return mV(\'1Ki\',15,32);">1Ki 15:32</a>). Baasha continued to encroach and finally fortified Ramah as a frontier fortress. Asa, faint-hearted, instead of putting his entire trust in Yahweh, made an alliance with Ben-hadad, of Damascus. The Syrian king, in consideration of a large sum of money and much treasure from the temple at Jerusalem, consented to attack the northern portion of Baasha\'s territory. It was at this favorable moment that Asa captured Ramah, and with the vast building material collected there by Baasha, he built Geba of Benjamin and Mizpah (<a onClick="return mV(\'1Ki\',15,\'16-22\');">1Ki 15:16-22</a>). This lack of faith in Yahweh was severely criticized by Hanani the prophet. Asa, instead of listening patiently to this prophet of God, was greatly offended and enraged and Hanani was put in prison (<a onClick="return mV(\'2Ch\',16,\'1-10\');">2Ch 16:1-10</a>). Three years later, Asa was attacked by gout or some disease of the feet. Here again he is accused of lack of faith, for "he sought not to Yahweh, but to the physicians" (<a onClick="return mV(\'2Ch\',16,12);">2Ch 16:12</a>). Having ruled forty-one years, he died and was buried with great pomp in a tomb erected by himself in the city of David, i.e. Jerusalem. On the whole his reign was very successful, but it is sad to chronicle that as the years rolled on he became less and less faithful to Yahweh and His law.<P>(2) A son of Elkanah, a Levite, who dwelt in one of the villages of the Netophathites (<a onClick="return mV(\'1Ch\',9,16);">1Ch 9:16</a>).``34';
isbe[790]='Asadias`as-a-di\'-as (Asadias): An ancestor of Baruch (Baruch 1:1).``1';
isbe[791]='Asael`a\'-sa-el, as\'-a-el`<a href="./study/isbe/search.html?string=ASIEL">ASIEL</a>`1';
isbe[792]='Asahel`as\'-a-hel (\'asah\'el, "God hath made"; Asael):<P>(1) The brother of Joab and Abishai. The three were sons of Zeruiah, one of David\'s sisters (<a onClick="return mV(\'1Ch\',2,15,16);">1Ch 2:15-16</a>; <a onClick="return mV(\'2Sa\',2,18);">2Sa 2:18</a>, etc.). The three brothers seem to have been from the beginning members of David\'s troop of strangely respectable brigands. Asahel was distinguished for his swift running, and this fact brought misfortune upon him and upon Israel. When Abner and the forces of Ish-bosheth were defeated near Gibeon, Asahel pursued Abner. Abner knew that he could outright Asahel, though he could not outrun him. He also knew that the time had come for making David king, and that a blood feud among the leaders would be a calamity. He expostulated with Asahel, but in vain. It came to a fight, and Abner slew Asahel (<a onClick="return mV(\'2Sa\',2,3);">2Sa 2:3</a>). As a result the coming of David to the throne of all Israel was delayed; and when at last Abner brought it about, he himself was treacherously killed by Joab in alleged blood revenge for Asahel. Asahel is mentioned as sixth in the list of David\'s "mighty men" (<a onClick="return mV(\'2Sa\',23,24);">2Sa 23:24</a>; <a onClick="return mV(\'1Ch\',11,26);">1Ch 11:26</a>).<P>The earlier of the names in this list are evidently arranged in the order of seniority. If it be assumed that the list was not made till after the death of Asahel, still there is no difficulty in the idea that some of the names in the list were placed there posthumously. Asahel is also mentioned as the fourth of David\'s month-by-month captains (<a onClick="return mV(\'1Ch\',27,7);">1Ch 27:7</a>). Superficial criticism describes this position as that of "commander of a division of David\'s army," and regards the statement, "and Zebadiah his son after him," as a note added to explain the otherwise incredible assertion of the text. This criticism is correct in its implication that the fourth captain was, as the text stands, the dead Asahel, in the person of his son Zebadiah. Coming from an annotator, the criticism regards this meaning as intelligible; is it any the less so if we regard it as coming from the author? In fact, the statement is both intelligible and credible. The second of David\'s month-by-month captains is Dodai, the father of the second of David\'s "mighty men"; and the fourth is Asahel, with his son Zebadiah. With these two variations the twelve month-by-month captains are twelve out of the nineteen seniors in the list of mighty men, and are mentioned in practically the same order of seniority. The 24,000 men each month were not a fighting army mobilized for war. The position of general for a month, whatever else it may have involved, was an honor held by a distinguished veteran. There is no absurdity in the idea that the honor may in some cases have been posthumous, the deceased being represented by his father or his son or by someone else.<P>(2) A Levite member of the commission of captains and Levites and priests which Jehoshaphat, in his third year, sent among the cities of Judah, with the book of the law, to spread information among the people (<a onClick="return mV(\'2Ch\',17,\'7-9\');">2Ch 17:7-9</a>).<p>(3) One of the keepers of the storechambers in the temple in the time of Hezekiah (<a onClick="return mV(\'2Ch\',31,13);">2Ch 31:13</a>).<P>(4) The father of Jonathan who was one of the two men who "stood upon this," at the time when Ezra and the people appointed a court to consider the cases of those who had married foreign wives (<a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>). The text of the Revised Version (British and American) translates "stood up against this," while the margin has "were appointed over this."``11';
isbe[793]='Asahiah`as-a-hi\'-a (\'asayah, "Yahweh hath made"; the King James Version form; the Revised Version (British and American) <a href="./study/isbe/search.html?string=ASAIAH">ASAIAH</a>): "The king\'s servant" sent by Josiah with Hilkiah, the priest, and others to inquire of Yahweh concerning the words of the book found in the temple (<a onClick="return mV(\'2Ki\',22,12,14);">2Ki 22:12, 14</a>; <a onClick="return mV(\'2Ch\',34,20);">2Ch 34:20</a>).``1';
isbe[794]='Asaiah`a-sa\'-ya ([\'asayah], "Yahweh has made," written Asahiah twice in the King James Version (<a onClick="return mV(\'2Ki\',22,12,14);">2Ki 22:12, 14</a>)):<P>(1) A Levite of the family of Merari, and one of those who helped bring the ark from the house of Obed-edom to Jerusalem (<a onClick="return mV(\'1Ch\',6,30);">1Ch 6:30</a>; <a onClick="return mV(\'1Ch\',15,6,11);">15:6, 11</a>).<P>(2) A leading man of the tribe of Simeon. He was in the incursion which attacked and dispossessed the <a href="./study/isbe/search.html?string=MEUNIM">MEUNIM</a> (which see), or the shepherd people, in the valley of Gedor (<a onClick="return mV(\'1Ch\',4,36);">1Ch 4:36</a>).<P>(3) An officer of Josiah sent to Huldah the prophetess for advice regarding the law book found by Hilkiah (<a onClick="return mV(\'2Ki\',22,12,14);">2Ki 22:12, 14</a>; see <a href="./study/isbe/search.html?string=ASAHIAH">ASAHIAH</a>).<P>(4) A Shilonite resident of Jerusalem (<a onClick="return mV(\'1Ch\',9,5);">1Ch 9:5</a>). He is called Maaseiah in <a onClick="return mV(\'Neh\',11,5);">Ne 11:5</a>.``34';
isbe[795]='Asana`as\'-a-na (Asana, Assana) = Asnah (<a onClick="return mV(\'Ezr\',2,50);">Ezr 2:50</a>); omitted in Nehemiah. The sons of Asana (temple-servants) returned with Zerubbabel to Jerusalem (1Esdras 5:31).``1';
isbe[796]='Asaph`a\'-saf (\'acaph): Is the name of three men in the Old Testament, of whom one is the reputed author of <a onClick="return mV(\'Psa\',50,\'1-\');">Psalms 50</a> and 73-83. He was one of David\'s three chief musicians, the other two being Heman, and Ethan or Jeduthun, and we first hear of him when the ark was taken to Jerusalem (<a onClick="return mV(\'1Ch\',15,\'16-19\');">1Ch 15:16-19</a>). He conducted with cymbals the music performed in the tent where the ark was housed (<a onClick="return mV(\'1Ch\',16,4,5,7,37);">1Ch 16:4-5, 7, 37</a>), while his two coadjutors discharged the same office at Gibeon (<a onClick="return mV(\'1Ch\',16,41,42);">1Ch 16:41-42</a>). In <a onClick="return mV(\'1Ch\',25,1);">1Ch 25:1</a>f we are told that four of his sons were appointed to conduct under him detachments of the great chorus, the families of Heman and Jeduthun also furnishing leaders, and all took part at the dedication of the temple (<a onClick="return mV(\'2Ch\',5,12);">2Ch 5:12</a>). A., H., and J. were called the king\'s seers (<a onClick="return mV(\'1Ch\',25,\'1-\');">1Ch 25</a>; <a onClick="return mV(\'2Ch\',35,15);">2Ch 35:15</a>), no doubt an official title of rank or dignity. The "Sons of Asaph" are mentioned in later times. They formed a guild, and played a prominent part at each revival of the national religion.`<a href="./study/isbe/search.html?string=MUSIC">MUSIC</a>; <a href="./study/isbe/search.html?string=PSALMS">PSALMS</a>`120';
isbe[797]='Asara`as\'-a-ra (Asara; the King James Version Azara): The sons of Asara (temple-servants) returned to Jerusalem with Zerubbabel (1Esdras 5:31). Omitted in Ezra and Nehemiah.``1';
isbe[798]='Asaramel`a-sar\'-a-mel (Asaramel or Saramel): A name of uncertain origin occurring in 1Macc 14:28, in the inscription set up in memory of Simon and the Maccabean family. "On the eighteenth day of Elul, in the hundred and seventy and second year, and this is the third year of Simon the high priest, in Asaramel, in a great congregation of priests and people and princes of the nation, and of the elders of the country," etc. The phrase "in Asaramel" has been taken as referring to a place, and as the name of a title of Simon. Ewald and others take it to be the equivalent of ba-chatsar \'am \'el, "in the court of the people of God." Another reading is "in Saramel." The majority prefer to take the phrase as a title of Simon; the original phrase is then taken to have been wesar \'am \'el, "and prince of the people of God," i.e. ethnarch. If the translator mistook the waw (w) for beth (b) and read \'en, he might have left the phrase untranslated because he supposed it to be the name of a place. Schurer disposes of the en by taking it as a corruption of segen = ceghen, which is equivalent to the Greek strategos (GVI, I, 197, note 17).``197';
isbe[799]='Asareel`a-sa\'-re-el, a-sar\'-e-el.`<a href="./study/isbe/search.html?string=ASAREL">ASAREL</a>`1';
isbe[800]='Asarel`as\'-ar-el (\'asar\'el, "God is ruler"; the King James Version Asareel): A descendant of Judah and a son of Jehallelel (<a onClick="return mV(\'1Ch\',4,16);">1Ch 4:16</a>).``1';
