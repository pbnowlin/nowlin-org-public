isbe[702]='Archippus`ar-kip\'-us (Archippos): Addressed by Paul in his letter to Philem, as "our fellow-soldier"; probably a member of Philem\'s family circle, holding some official position in the church (<a onClick="return mV(\'Col\',4,17);">Col 4:17</a>; <a onClick="return mV(\'Phm\',1,2);">Phm 1:2</a>). See <a href="./study/isbe/search.html?string=APPHIA">APPHIA</a>. The tradition that he was one of the seventy disciples, became bishop of Laodicea and later became a martyr, seems to have little historical foundation.``1';
isbe[703]='Architecture`ar\'-ki-tek-tur:<P><b>I. GENERAL HISTORY</b><P class="in15">1. Plans, Estimates and Measuring<P class="in15">2. Old Testament References<P><b>II. TEMPLE AND PALACE OF SOLOMON</b><P class="in15">1. Construction and Materials<P class="in15">2. Style<P class="in15">3. Facts<P class="in15">4. Phoenician Designers<P><b>III. CONCLUSIONS FROM ACTUAL REMAINS</b><P class="in15">1. Defense Walls<P class="in15">2. Streets<P class="in15">3. Absence of the "Grand Manner"<P class="in15">4. Solomonic Detail<P class="in15">5. Temple of Onias<P class="in15">6. Comparison with Maccabean Work<P class="in15">7. Painted Tombs at Marissa<P class="in15">8. Characteristic Feature<P><p><b>IV. HERODIAN WORK</b><P><b>V. SYNAGOGUES</b><P><b>VI. FINAL</b><P><b>LITERATURE</b><hr /><P>I. General History.<P>The words "architect" and "architecture" do not occur in the Old Testament or the New Testament. As the greatness of a nation and its social elevation are reflected in the course of architectural development, so is a nation\'s failure to rise to firm establishment, after victory in war, reflected in the absence of such development. The latter condition was that of the Jews in Palestine; they failed so to establish themselves that their character and aims could find true expression in architecture. The country by reason of its geographical position and its broken territorial character, which exaggerat edition the tribal nature of its inhabitants, did not favor political empire (see HGHL, 10). The great difficulty of the Jews was the preservation of their own integrity. There could be no victorious expeditions to foreign lands to inspire monumental evidence of achievement in arms, nor had they the inspiration. of various gods or saints, to whose glory great and separate buildings might be raised. Their dwellings were, by force of circumstances, unpretentious, and their tombs were of the same character.<P>1. Plans, Estimates and Measuring:<P>Although in the smaller buildings there is very little evidence of the builder having been governed by a previously drawn plan, there seems no doubt that in larger works a plan was prepared. The Tabernacle was made according to a "pattern" (<a onClick="return mV(\'Exd\',25,9);">Ex 25:9</a>) and Solomon\'s Temple was also designed and submitted for approval (<a onClick="return mV(\'1Ch\',28,11);">1Ch 28:11</a>). Estimated cost was also considered (<a onClick="return mV(\'Luk\',14,28);">Lu 14:28</a>). The equivalents to a tape line and foot rule can be identified (<a onClick="return mV(\'Eze\',40,3,5);">Eze 40:3, 5</a>; <a onClick="return mV(\'Eze\',47,3);">47:3</a>; <a onClick="return mV(\'Rev\',11,1);">Re 11:1</a>; <a onClick="return mV(\'Rev\',21,15);">21:15</a>).<P>The Israelites arrived in tents, and the walled cities, "great and walled up to heaven" (<a onClick="return mV(\'Deu\',1,28);">De 1:28</a> the King James Version) which they took and occupied were well fortified, unlovely shelters, covering areas of anything from 12 acres, as at Taanach and Megiddo, to about 23 acres as at Gezer (Canaan d\'apres l\'exploration recente). The habitations within the walls were poor structures of mud bricks or rude stone; in many cases they were rock-cut caves. True, the Jews attempted, at the outset of their full pos session, to build in beauty, and made efforts toward greater substantiality, using the best available help; the attempt, however, was doomed to failure. Their most important buildings were their fortifications. The engineering skill displayed in the construction of aqueducts and other water systems was forced out of them by sheer necessity, and proved the existence of a latent constructive power, which they never had sustained opportunity to apply to architecture. In striking contrast is the architecture of the Crusaders. In a comparatively short time of less than 200 years, during the half of which practice in the arts of peace was well-nigh impossible, they stamped their occupation by the erection of an enormous number of great and beautiful buildings, the ruins of which are among the most imposing landmarks in the country.<P>2. Old Testament References:<P>The often-repeated references to building greatness in the Old Testament, indicate a pride out of all scale with actuality. They tell the story of a long desert pilgrimage during which the Jews, as dwellers in tents, were impressed with the walled cities which, with extraordinary fortitude, they stormed and occupied, and which, with pardonable enthusiasm, they consequently exaggerated, to the glory of God. Although references to buildings in the Old Testament are frequent, they are seldom sufficiently de tailed to convey an idea of their character. Cain built a city and named it Enoch (<a onClick="return mV(\'Gen\',4,17);">Ge 4:17</a>); his descendant Tubal Cain was "an instructor of every artificer in brass and iron" (<a onClick="return mV(\'Gen\',4,22);">Ge 4:22</a> the Revised Version, margin). The description of the plan of the ark (<a onClick="return mV(\'Gen\',6,14);">Ge 6:14</a>ff) is the first detailed architectural description in the Old Testament. Asshur, a descendant of Ham, built Nineveh and other cities (<a onClick="return mV(\'Gen\',10,11);">Ge 10:11</a>). The tower of Babel was built of "brick for stone and slime for mortar" (<a onClick="return mV(\'Gen\',11,3);">Ge 11:3</a>). In <a onClick="return mV(\'Exd\',27,\'9-21\');">Ex 27:9-21</a> plan, dimensions and construction of the Tabernacle are given.<P>II. Temple and Palace of Solomon.<P>The most complete architectural reference is the description of the Temple and Palace of Solomon (<a onClick="return mV(\'1Ki\',6,\'1-\');">1Ki 6</a>; <a onClick="return mV(\'1Ki\',7,\'1-\');">7</a>) and (<a onClick="return mV(\'Eze\',40,\'1-\');">Eze 40</a>; <a onClick="return mV(\'Eze\',41,\'1-\');">41</a>). These buildings are fully dealt with under <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>, but a brief note is here necessary, as they are by far the greatest buildings of which there is mention in the Old Testament. It is clear that Solomon had ambition for architectural greatness, and, following the example of David (<a onClick="return mV(\'2Sa\',5,11);">2Sa 5:11</a>) he employed Phoenician designers and craftsmen to carry out the work.<P>1. Construction and Materials:<P>It is known that the buildings were of stone, that the chambers surrounding the Temple were three stories high, that the Temple was roofed (presumably flat) with cedar. Fergusson\'s restoration shows a sloping roof, following the precedent of the sloping roof of the Tabernacle (Temples of the Jews, 26). The walls and ceilings were lined with cedar, so that "there was no stone seen" (<a onClick="return mV(\'1Ki\',6,18);">1Ki 6:18</a>) within the house. The interior was enriched with carved foliage and cherubim, and in the decorative scheme, gold was freely applied. The description of the exterior is less minutely detailed. Stones were large and, as in the buildings of Egypt, were "sawed with saws" "from foundation to coping" (<a onClick="return mV(\'1Ki\',7,9);">1Ki 7:9</a>), "foundation to the top of walls" (3 Ki 7:9, the Douay Version). The inference therefore is that the masonry was smooth-faced: "no sign of any hammer" (Ant., VIII, iii, 2). Windows were "narrow" (<a onClick="return mV(\'1Ki\',6,4);">1Ki 6:4</a> the King James Version), repeatedly referred to (<a onClick="return mV(\'Eze\',40,16,26);">Eze 40:16, 26</a>). In the interior of the palace, cedar beams were carried on rows of cedar columns, and there were three rows of windows, one row to each story, directly opposite each other. Doors and posts were "square in prospect" (<a onClick="return mV(\'1Ki\',7,5);">1Ki 7:5</a> the English Revised Version), i.e. square-headed. In <a onClick="return mV(\'Eze\',40,21);">Eze 40:21</a>f English Versions of the Bible arches are repeatedly mentioned but this is an error of translation. See <a href="./study/isbe/search.html?string=ARCH">ARCH</a>.<P>2. Style:<P>In the description, there is very little indication of the style of architecture. The rich nature of the pillars of brass and their "chapiters" (<a onClick="return mV(\'1Ki\',7,15);">1Ki 7:15</a>f English Versions) point to some hankering after an ornate trabeated style. There is no indication, however, of such a style in constructive stone. No mention is made of a crowning feature of a distinctive kind, not even an eave, simply a "coping." The use of a coping suggests that the walls were topped by parapets, "battlement" (<a onClick="return mV(\'Deu\',22,8);">De 22:8</a> English Versions), accord ing to the law. Fergusson\'s restoration shows both cornice and battlements (Temples of the Jews, Frontispiece).<P>One can only vaguely conjecture the sources of influence which guided the builders. The description clearly shows that the great columnar architecture of Egypt was not taken as a model, although certain Egyptian characteristics in detail are evident in contemporary work. Probably Phoenician intercourse with the Mediterranean, generally, showed its influence, in which case a comparatively poor result might be inferred.<P>3. Facts:<P>There remain these facts, namely, that here is described a group of buildings, of comparatively great scale; internally, at least, richly detailed and disposed in a way which shows considerable appreciation of architectural fitness, inspired by ambition for monumental greatness and dedicated, as was all that is great and spontaneous in architecture, to the glory of God. The one great flaw lay in the complete lack of a national constructive ability to respond to the call.<P>4. Phoenician Designers:<P>The Phoenicians who were employed seem to have been indifferent builders. They took 13 years to build Solomon\'s house (<a onClick="return mV(\'1Ki\',7,1);">1Ki 7:1</a>) and 7 1/2 years to build the Temple (<a onClick="return mV(\'1Ki\',6,38);">1Ki 6:38</a>), and they, in all probability, found such a great work beyond their powers of adequate conception, more especially as the housement of a strange God was uninspiring. "Shalt thou build me an house for me to dwell in?" (<a onClick="return mV(\'2Sa\',7,5);">2Sa 7:5</a> English Versions) was a command which they were only hired to fulfill.<P>III. Conclusions from Actual Remains.<P>There are only a very few known examples from which a knowledge of Jewish architecture can be obtained. There are none now standing, and what the spade has uncovered proves little more than a mere building craft of an inferior order. Remains of the period of the monarchy have been uncovered on several sites, notably Jerusalem, Lachish, Tel es Safi (Gath?), Gezer, Taanach, Tel es Mutesellim (Megiddo), Jericho, and these give a general idea of the building craft of the period, but give no evidence of an architectural style. It may, with good reason, be argued that there was no style, but it is too much to conclude that the Jews had no architectural instinct. Ideals were not lacking: "Behold, I will set thy stones in fair colors, and lay thy foundations with sapphires. And I will make thy pinnacles of rubies, and thy gates of carbuncles, and all thy border of precious stones" (<a onClick="return mV(\'Isa\',54,11,12);">Isa 54:11-12</a>). Had history been different, Solomon\'s great example might have laid a foundation from which a national style would have been developed. The arts of peace, however, did not even bud, and the bane of internal and external conflict forced building energy to concentrate itself on fortifications.<P>1. Defence Walls:<P>Indeed in the great defense walls lies the building history of the Jews. They were hurriedly built and frequently destroyed. Destruction and reparation alternated so consistently, that each successive city within was little more than a temporary housement, at all times subservient to the more important work of defense. Under such conditions nothing flourished, least of all architecture. Building art became a thing of bare temporary utility.<P>2. Streets:<P>Streets were laid out without method; narrow, tortuous alleys broken into by projections, founded at the will of each individual builder, served as main thoroughfares (Bible Sidelights, 95; Excavation of Gezer, Vol I, p. 167ff); compare similarity of conditions with streets of Mediterranean city of Philakopi (Journal RIBA, XI, 531). See <a href="./study/isbe/search.html?string=CITY">CITY</a>. Masonry was usually of rough unhewn stones, unskillfully laid without mortar, and buildings were rarely on the square. Under these conditions the enthusiasm displayed in the description of Solomon\'s work can be understood.<P>3. Absence of the "Grand Manner":<P>In Jerusalem the Temple area was the center of architectural grandeur, and it is possible that it may have inspired building endeavor of another nature in other cities. Palestine has as yet yielded no such parallel. Free areas, where they are found to have existed, seem to have happened so, and do not always coincide in position in successive superincumbent cities. They lay claim to no particular "lay out" and, in all probability, they served as space for the dump heaps of the town refuse or for the pen ning-up of cattle and sheep (<a onClick="return mV(\'Isa\',58,12);">Isa 58:12</a>, "waste places"). Compare the modern city of Es Salt; it gives a fairly good idea of the general appearance of an ancient Jewish city. The use of wooden shafts for porticos and roofs of large covered areas appears to have been prevalent, and these were frequently set in stone sockets which served as bases. Stone columns seem to have been sparingly used; in fact, there is no evidence whatever that a stone columnar style of architecture prevailed in the more important buildings.<P>4. Solomonic Detail:<P>At Lachish (Lachish, 23ff) a number of voluted low-relief slabs were discovered which were originally built into the left reveals of the doorways of a building of considerable importance. These slabs were found in conjunction with a molded lintel of Egyptian character. The discovery disclosed the only authentic examples of the architectural detail of the Solomonic period, and is particularly interesting as furnishing, perhaps, the earliest prototype of the Ionic volute. At its best it is a shoddy uncon structive adaptation of exotic features, and if it is to be taken as a key to the work of the period throughout Palestine, there can be nothing great to record.<P>5. Temple of Onias:<P>When Onias fled to Egypt from the persecution of Antiochus Epiphanes, circa 154 BC, he gained permission from Ptolemy and Cleopatra to build a temple at Leontopolis like to that at Jerusalem (Ant., XIII, iii, 3). The temple was built in fulfillment of the prophecy of Isaiah and modeled after the temple of Zerubbabel, but "smaller and poorer" and "resembled a tower." Petrie recovered this temple (Hyksos, 19ff) on an artificial mound resembling the Temple hill at Jerusalem, raised alongside the Hyksos camp, w here an influential Jewish community had established itself. It is the most complete plan of a Jewish building of monumental character yet discovered. A sort of rude Corinthian detail was used, and certain fragments point to a battlemented treatment, suggestive of Babylonian origin, and to some extent confirming the inference drawn from the description of Solomon\'s Temple.<P>6. Comparison with Maccabean Work:<P>Fragments of contemporary architecture of the Maccabean dynasty throughout Palestine show a Greco-Syrian style of considerable dignity and interest, illustrating a readiness to respond to the Hellenizing influence in the arts, which at that time was characterized, in architecture, by a decadent Greek provincialism. The battlemented details, found at Hyksos, seem to indicate the use of a style antedating the Maccabean work, preserving, to some extent, Babylonian traditions.<P>7. Painted Tombs at Marissa:<P>From the 3rd century BC up to the Christian era architecture shows a consistent Greek origin with local character in detail (see Expl. in Palestine,18,19) at Tel Sandahannah and Mareshah (Painted Tombs of Marissa). These Marissa tombs show most interesting decorated elevations, with painted architectural detail. The work is Phoenician (93) and the date probably 194 to 119 BC (79). Greek Ionic capitals are used, with wreath enrichments painted on the architrave over the capital, and a deep frieze of painted animals, surmounted by a representation of a "battlement" "coping" (<a onClick="return mV(\'Deu\',22,8);">De 22:8</a>; <a onClick="return mV(\'1Ki\',7,9);">1Ki 7:9</a>) remarkably like the details found by Petrie at Hyksos. An interesting detail is the pointed head to the intercolumnar opening, a form which seems to have suggested itself universally to the primitive builder, where the handling of large lintel stones presented a difficulty. They call to mind the heads of Anglo-Saxon openings.<P>A liking for mural decoration existed throughout the whole Jewish period, as is seen from the small fragments of painted plaster discovered in the various excavated cities, but the decoration on the Marissa tombs is the most complete example, and resembles in many ways the mural decoration at Knossos and Phylakopi.<P>8. Characteristic Feature:<P>The tomb of Zechariah in the Kedron valley probably belongs to the same date as its neighbor, the tomb of James, which De Vogue, from the inscription upon it, ascribes to the time of Herod (Le Temple de Jerusalem, 46). The detail of the crowning part of the entablature is an often-recurring feature in Palestine architecture, appearing as early as the Solomonic era at Lachish. It is characteristically Egyptian, and is also seen at Persepolis (Gwilt\'s Encyclopedia, 22), and although neither might have been bor rowed from the other, they are not many removes from the common parent. (A curious eastern tradition mentioned (BD, "Cities," 610) ascribes the building of Persepolis to Solomon.) It was a feature commonly used by the Phoenicians (Rawlinson, Hist. of Phoenician, 142), and was probably introduced by them from Egypt. It seems to have been in favor up to the time of Herod and was abandoned after the wholesale introduction of the classic entablature which in Hellenistic times was only partially incorporated into the prevailing style. The successive variations of the crowning feature of their design is an important factor in tracing the development of Jewish architecture.<P>IV. Herodian Work.<P>The Temple of Siah (described by De Vogue in Recovery of Jerusalem, 419ff, and Temples of the Jews, 140ff) is an interesting example of the work of the Herodian period and is more Greek in character than one would expect. Here, local character in carving is strongly marked, foliage and figures being freely used with a certain Assyrian manner which, in spite of loose handling, betrays its origin. In fact this chord of architectural enrichment can be traced through the work of In dia, Assyria, Persia and Syria on to the Byzantine period, when the great cathedral church of Sophia in Constantinople displayed it in the most perfect harmony of all time.<P>The great building period of Herod need not be detailed. Herod was an Edomite and his architecture partook of the more robust Roman style which dominated Jewish art at a time when the opportunity of national incorporation had passed.<P>V. Synagogues.<P>This Roman influence, however, remained in Palestine as can be seen by the important remains of synagogues in Galilee of the 3rd century AD (see Fig. 8 from Kerr Berim; Studies in Galilee, chapter vi; Memoirs of the Survey of Western Palestine, special papers, 294ff). The many remains investigated shed light upon the plan of these post- exilic places of worship, of which there is little or no mention in the Old Testament. See <a href="./study/isbe/search.html?string=SYNAGOGUE">SYNAGOGUE</a>. The plans vary considerably in proportion. The example at Meiron measures 90 ft. x 44 ft. 8 inches, while that at Irbid measures 57 ft. 3 inches x 53 ft. (SWP, special papers, 299). In general arrangement the plans vary very little, consisting usually of five aisles with a triple entrance, most often facing south. The details are richly carved and "a surprising feature common to all is the use of animal figures, especially lions, or lambs and eagles....In some examples human figures, usually intentionally mutilated, are found" (Studies in Galilee, 110).<P>VI. Final.<P>It is probable that future researches may add to our knowledge of early Jewish architecture, but it is doubtful whether there is more to discover than is constituted in the crude and unskilled use of building materials, influenced by limited knowledge of exotic features, which the Jews had neither the time nor the knowledge properly to apply. See <a href="./study/isbe/search.html?string=CITY">CITY</a>; <a href="./study/isbe/search.html?string=BUILDING">BUILDING</a>; <a href="./study/isbe/search.html?string=FORTIFICATION">FORTIFICATION</a>; <a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>; <a href="./study/isbe/search.html?string=TEMPLE">TEMPLE</a>.<P>LITERATURE.<P>Conder, Survey of Western Palestine; Warren, Recovery of Jerusalem; Bliss and Dickie, Excavations in Jerusalem, 1894-97; Fergusson, Temple of Jerusalem; Masterman, Studies in Galilee; Bliss and Macalister, Excavations in Palestine; Macalister, Excavations at Gezer; Petrie, Excavations at Hyksos; Rawlinson, History of Phoen; Petrie, Lachish; Sellin, Excavations at Taanach; Schumacher, Excavations at Tell Mutesellim; Macalister, Bible Sidelights; Peters and Thierch, Painted Tombs of Marissa.``39';
isbe[704]='Archites`ar\'-kits (ha-\'arki; the King James Version Archi): A clan mentioned in connection with the marking of the southern boundary of Joseph (<a onClick="return mV(\'Jos\',16,2);">Jos 16:2</a>). The phrase (gebhul ha-\'arki \'ataroth) offers difficulties, and it has been suggested that the order of the last two words be changed to read "the border of Ataroth-of-the-Archites." See <a href="./study/isbe/search.html?string=ATAROTH">ATAROTH</a>. G. A. Smith identifies Ataroth with the present Atara on the high road from Jerusalem to Bethel, three and one-half miles south of Bethel and six east of the upper Beth-horon. Hushai, the "friend" of David, was an Arcbite (<a onClick="return mV(\'2Sa\',16,16);">2Sa 16:16</a>).``197';
isbe[705]='Archives`ar\'-kivs (the more correct the Revised Version (British and American) rendition of beth ciphrayya\', in <a onClick="return mV(\'Ezr\',6,1);">Ezr 6:1</a>, "house of the archives" instead of "house of rolls" as in the King James Version): A part of the royal treasure-house (<a onClick="return mV(\'Ezr\',5,17);">5:17</a>), in which important state documents were kept.``1';
isbe[706]='Arcturus`ark-tu\'-rus: The "Plough" or "Charles\'s Wain" is intended.`<a href="./study/isbe/search.html?string=ASTRONOMY">ASTRONOMY</a>`1';
isbe[707]='Ard`ard (\'ard, meaning unknown): Either directly or more remotely a son of Benjamin. <a onClick="return mV(\'Num\',26,\'38-40\');">Nu 26:38-40</a> mentions five sons of Benjamin, together with Ard and Naaman, the sons of Bela, Benjamin\'s oldest son, counting all seven as ancestors of Benjamite families. In <a onClick="return mV(\'1Ch\',8,\'1-3\');">1Ch 8:1-3</a> Addar and Naaman are mentioned, with others, as sons of Bela, Addar and Ard being apparently the same name with the consonants transposed. In <a onClick="return mV(\'Gen\',46,21);">Ge 46:21</a> ten sons of Benjamin are counted, including at least the three grandsons, Ard and Naaman and Gera.``1';
isbe[708]='Ardat`ard\'-at (the King James Version Ardath; Syriac and Ethiopic have Arphad): A certain field where Ezra communed with God (2Esdras 9:26).``1';
isbe[709]='Ardites`ar\'-dits: Patronymic of <a href="./study/isbe/search.html?string=ARD">ARD</a>, which see.``1';
isbe[710]='Ardon`ar\'-don (\'ardon, meaning unknown): One of the three sons of Caleb and Azubah, of the tribe of Judah (<a onClick="return mV(\'1Ch\',2,18);">1Ch 2:18</a>).``1';
isbe[711]='Areli`a-re\'-li (\'ar\'eli, apparently the gentilic form of a compound that would mean "God\'s lioness," or "God\'s hearth"): One of the sons of Gad the son of Jacob (<a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a>; <a onClick="return mV(\'Num\',26,17);">Nu 26:17</a>). "<a href="./study/isbe/search.html?string=ARELITES">Arelites</a>" (which see) is exactly the same word.``1';
isbe[712]='Arelites`a-re\'-lits: In <a onClick="return mV(\'Num\',26,17);">Nu 26:17</a>.`<a href="./study/isbe/search.html?string=ARELI">ARELI</a>`1';
isbe[713]='Areopagite`ar-e-op\'-a-jit.`<a href="./study/isbe/search.html?string=DIONYSIUS">DIONYSIUS</a>`1';
isbe[714]='Areopagus`ar-e-op\'-a-gus (Areios pagos; <a onClick="return mV(\'Act\',17,19,22);">Ac 17:19, 22</a>. Mars\' Hill, <a onClick="return mV(\'Act\',17,22);">17:22</a> the King James Version): A sort of spur jutting out from the western end of the Acropolis and separated from it by a very short saddle. Traces of old steps cut in the rock are still to be seen. Underneath are deep grottoes, once the home of the Eumenides (Furies). On the flat surface of the summit are signs still visible of a smoothing of the stone for seats. Directly below to the north was the old Athenian agora, or market-place. To the east, on the descent from the Acropolis, could be seen in antiquity a small semicircular platform—the orchestra—from which rose the precipitous rock of the citadel. Here the booksellers kept their stalls; here the work of Anaxagoras could be bought for a drachma; from here his physical philosophy was disseminated, then, through Euripides, the poetic associate of Socrates and the sophists, leavened the drama, and finally reached the people of Athens. Then came the Stoics and Epicureans who taught philosophy and religion as a system, not as a faith, and spent their time in searching out some new thing in creed and dogma and opinion. Five centuries earlier Socrates was brought to this very Areopagus to face the charges of his accusers.<P>To this same spot the apostle Paul came almost five hundred years after 399 BC, when the Attic martyr was executed, with the same earnestness, the same deep-rooted convictions, and with even greater ardor, to meet the philosophers of fashion. The Athenian guides will show you the exact place where the apostle stood, and in what direction he faced when he addressed his audience. No city has ever seen such a forest of statues as studded the market-place, the streets and the sides and summit of the Acropolis of Athens. A large part of this wealth of art was in full view of the speaker, and the apostle naturally made this extraordinary display of votive statues and offerings the starting-point of his address. He finds the Athenians extremely religious. He had found an altar to a god unknown. Then he develops theme of the great and only God, not from the Hebrew, but from the Greek, the Stoic point of view. His audiences consisted, on the one hand, of the advocates of prudence as the means, and pleasure as the end (the Epicureans); on the other, of the advocates of duty, of living in harmony with the intelligence which rules the world for good. He frankly expresses his sympathy with the nobler principles of the Stoic doctrine. But neither Stoic nor Epicurean could believe the declarations of the apostle: the latter believed death to be the end of all things, the former thought that the soul at death was absorbed again into that from which it sprang. Both understood Paul as proclaiming to them in Jesus and Anastasis ("resurrection") some new deities. When they finally ascertained that Jesus was ordained by God to judge the world, and that Anastasis was merely the resurrection of the dead, they were disappointed. Some scoffed, others departed, doubtless with the feeling that they had already given audience too long to such a fanatic.<P>The Areopagus, or Hill of Ares, was the ancient seat of the court of the same name, the establishment of which leads us far back into the mythical period long before the dawn of history. This court exercised the right of capital punishment. In 594 BC the jurisdiction in criminal cases was given to the archons who had discharged the duties of their office well and honorably, consequently to the noblest, richest and most distinguished citizens of Athens. The Areopagus saw that the laws in force were observed and executed by the properly constituted authorities; it could bring officials to trial for their acts while in office, even raise objections to all resolutions of the Council and of the General Assembly, if the court perceived a danger to the state, or subversion of the constitution. The Areopagus also protected the worship of the gods, the sanctuaries and sacred festivals, and the olive trees of Athens; and it supervised the religious sentiments of the people, the moral conduct of the citizens, as well as the education of the youth.<P>Without waiting for a formal accusation the Areopagus could summon any citizen to court, examine, convict and punish him. Under unusual circumstances full powers could be granted by the people to this body for the conduct of various affairs of state; when the safety of the city was menaced, the court acted even without waiting for full power to be conferred upon it. The tenure of office was for life, and the number of members without restriction. The court sat at night at the end of each month and for three nights in succession. The place of meeting was a simple house, built of clay, which was still to be seen in the time of Vitruvius. The Areopagus, hallowed by the sacred traditions of the past, a dignified and august body, was independent of and uninfluenced by the wavering discordant multitude, and was not affected by the ever-changing public opinion. Conservative almost to a fault, it did the state good service by holding in check the too rash and radical younger spirits. When the democratic party came to power, after Cimon\'s banishment, one of its first acts was to limit the powers of the Areopagus. By the law of Ephialtes in 460 the court lost practically all jurisdiction. The supervision of the government was transferred to the nomophulakes (law-guardians). At the end of the Peloponnesian war, however, in 403 its old rights were restored. The court remained in existence down to the time of the emperors. From <a onClick="return mV(\'Act\',17,19,22);">Ac 17:19, 22</a> we learn that it existed in the time of Claudius. One of its members was converted to the Christian faith (<a onClick="return mV(\'Act\',17,34);">17:34</a>). It was probably abolished by Vespasian.<P>As to whether Paul was "forcibly apprehended and formally tried," see Conybeare and Howson, The Life and Epistles of Paul, chapter x, and The Expositor, 5th series, II, 209f; 261f (Ramsay).<P>LITERATURE.<P>P. W. Forchhammer, De Areopago (Kiel, 1828); Philippi, Der A. und die Epheten (Leipzig, 1874); Lange, Die Epheten und der A. vor Solon (Leipzig, 1874).``71';
isbe[715]='Areopolis`ar-e-op\'-o-lis. The Greek name of <a href="./study/isbe/search.html?string=AR">AR</a> (which see).``1';
isbe[716]='Ares`a\'-res, ar\'-es (Ares = Arah (<a onClick="return mV(\'Ezr\',2,5);">Ezr 2:5</a>; <a onClick="return mV(\'Neh\',7,10);">Ne 7:10</a>)): 756 of the sons of Ares returned to Jerusalem with Zerubbabel (1Esdras 5:10).``1';
isbe[717]='Aretas`ar\'-e-tas (Aretas): The name is a common one among Arabian princes and signifies "virtuous or pleasing."<P>1. 2Macc 5:8:<P>It is mentioned several times in Biblical literature and in Josephus. Here it refers to an Arabian king, who was a contemporary of Antiochus Epiphanes (circa 170 BC), before whom Jason the high priest was accused.<P>2. Obodas:<P>Another Arabian prince of this name, surnamed Obodas (Ant., XIII, xv, 2; xvi, 2; XVI, ix, 4) defeated Antiochus Dionysius and reigned over Coele-Syria and Damascus. He participated with Hyrcanus in the war for the Jewish throne against his brother Aristobulus, but the allies were completely defeated at Papyron, by Aristobulus and Scaurus, the Roman general. The latter carried the war into Arabia and forced Aretas to make an ignominious peace, at the price of three hundred talents of silver. Of that event a memorial denarius still exists, with a Roman chariot in full charge on the one side and a camel on the other, by the side of which an Arab is kneeling, who holds out a branch of frankincense.<P>3. Aeneas:<P>The successor of Obodas was apparently surnamed Aeneas and this is the Arabian king who figures in the New Testament (<a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>; compare <a onClick="return mV(\'Act\',9,24);">Ac 9:24</a>). The Aretas, here mentioned, is the father-in-law of Herod Antipas, who divorced his wife to marry Herodins, the wife of his brother Philip (<a onClick="return mV(\'Mat\',14,3);">Mt 14:3</a>; <a onClick="return mV(\'Mar\',6,17);">Mr 6:17</a>; <a onClick="return mV(\'Luk\',3,19);">Lu 3:19</a>). Josephus (Ant., XVIII, v, 1,3) gives us a circumstantial narration of the events leading up to and following the conduct of Antipas. Coupled with a boundary dispute, it occasioned a bitter w ar between the two princes, in which Antipas was completely overwhelmed, who thereupon invoked the aid of the Romans. Tiberius ordered Vitellius, proconsul of Syria, to make war on Aretas and to deliver him dead or alive into the hands of the emperor. On the way, at Jerusalem, Vitellius received intelligence of the death of Tiberius, March 16, 37 AD, and stopped all warlike proceedings (Ant., XVIII, v, 1,3). According to <a onClick="return mV(\'2Cr\',11,32);">2Co 11:32</a>, Damascus, which had formerly belonged to the Arabian princes, was again in the hands of Are tas, when Paul escaped from it, not immediately after his conversion, but on a subsequent visit, after his Arabian exile (<a onClick="return mV(\'Gal\',1,16,17);">Ga 1:16-17</a>). It is inconceivable that Aretas should have taken Damascus by force, in the face of the almost omnipotent power of Rome. The picture moreover, which Josephus draws of the Herodian events, points to a passive rather than an active attitude on the part of Aretas. The probability is that Cajus Caligula, the new emperor, wishing to settle the affairs of Syria, freely gave Damascu s to Aretas, inasmuch as it had formerly belonged to his territory. As Tiberius died in 37 AD, and as the Arabian affair was completely settled in 39 AD, it is evident that the date of Paul\'s conversion must lie somewhere between 34 and 36 AD. This date is further fixed by a Damascus coin, with the image of King Aretas and the date 101. If that date points to the Pompeian era, it equals 37 AD, making the date of Paul\'s conversion 34 AD (Mionnet, Descript. des medailles antiques, V, 284-85).``42';
isbe[718]='Argob (1)`ar\'-gob (\'argobh, "story"): A locality or a person mentioned in the obscure passage <a onClick="return mV(\'2Ki\',15,25);">2Ki 15:25</a>. The context deals with Pekah\'s conspiracy against Pekahiah; but it is not clear, owing to the state of the text, whether Argob and his associate Arieh (if these are the names of men) were officers of Pekahiah who were slain with him, or fellow- conspirators with Pekah. The Vulgate takes them as names of places; they may then be considered glosses that have crept into the text. Rashi holds that Argob was the royal palace. Argob is more likely the name of a place than a person.`<a href="./study/isbe/search.html?string=ARIEH">ARIEH</a>`197';
isbe[719]='Argob (2)`ar\'-gob (ha-\'argobh; ha-argobh or Argob): A region east of the Jordan which in <a onClick="return mV(\'Deu\',3,4,5);">De 3:4-5</a> is equivalent to the kingdom of Og in Bashan, and in <a onClick="return mV(\'Deu\',3,13);">3:13</A> is referred to as "all the region of Argob, even all Bashan." <a onClick="return mV(\'Deu\',3,14);">De 3:14</a> is evidently corrupt. Havvoth-jair lay not in Bashan but in Gilead (<a onClick="return mV(\'Jdg\',10,4);">Jud 10:4</a>; <a onClick="return mV(\'Num\',32,40);">Nu 32:40</a>f; <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>). It contained threescore cities. "All these were cities fortified with high walls, gates and bars; besides the unwalled towns a great many." <a onClick="return mV(\'Deu\',3,14);">De 3:14</a> seems to say that it marched with Geshur and Maacah; but we cannot lay stress on this. We may take it that Argob lay in the land of Bashan; beyond this, on available data, we cannot certainly go.<P>The word chebhel, translated "region," means primarily a line or cord, then "a measuring line," then "the portion measured," e.g. "the part of the children of Judah" (<a onClick="return mV(\'Jos\',19,9);">Jos 19:9</a>), the "lot" or "portion" of an inheritance (<a onClick="return mV(\'Deu\',32,9);">De 32:9</a>; <a onClick="return mV(\'Jos\',17,14);">Jos 17:14</a>, etc.). Chebhel precedes Argob in each of the four cases where it is named. This has led many to think that a district with very clearly marked borders is intended. No region so well meets this condition as el-Leja\', a volcanic tract lying about 20 miles south of Damascus, and 30 miles east of the Sea of Galilee. It is roughly triangular in form, with the apex to the north, and is about 25 miles long, with a base of some 20 miles. The lava which has hardened into this confused wilderness of black rock, rent and torn by countless fissures, flowed from the craters whose dark forms are seen on the east.<P>It rises to an average height of about 20 ft. above the plain, on which it lies like an island on a sea of emerald, the edges being sharply defined. At all points it is difficult of entrance, and might be defended by a few resolute men against an army. To this fact doubtless it owes its name el-Leja\', "the refuge." There are many traces of considerable cities in the interior. The present writer collected there the names of no fewer than seventy-one ruined sites. See further <a href="./study/isbe/search.html?string=TRACHONITIS">TRACHONITIS</a>. This identification is supported by taking \'argobh as the Hebrew equivalent of the Greek trachon, "stony." This is possible only if, as Gesenius assumes, the root raghabh is cognate with ragham, an extremely precarious assumption. "Clod" is the translation of the word reghebh in <a onClick="return mV(\'Job\',21,33);">Job 21:33</a>; <a onClick="return mV(\'Job\',38,38);">38:38</a>; probably therefore \'argobh should be tendered "a region of clods," i.e. "arable land." This practically rules out el-Leja\'.<P>We have seen above that the term chebhel need have no reference to the clearly marked rocky boundaries. As regards the great cities, all Bashan is studded with the ruins of such. The splendid remains that everywhere meet the traveler\'s eye were thought by Porter (Giant Cities of Bashan) and others, to be the wreck of the great cities that struck the invading Israelites with wonder. It is now clear that the ruins above ground are not older than the beginning of our era. The Greek and Roman architecture is easily recognized. Probably, however, excavation will prove that in very many cases the sites have been occupied from very ancient times. Cave dwellings, chambers cut in the rock and covered with stone vaults, and what may be described as subterranean cities, have been found in different parts, the antiquity of which it is impossible to estimate. There is nothing which enables us to identify the region of Argob. The whole country of Bashan., with the exception of el-Leja\', is "arable land." The soil is very fertile, composed of lava detritus. In almost every district might have been found the threescore cities. Guthe suggests the western part of el-Chauran, stretching from Edrei (Der\'ah) to Nawa. Buhl would locate it in the district of ec-Cuweit, to the southeast of the low range of ez-Zumleh. This however seems too far to the south. The southwest slopes of Jebel ed-Druze seem to meet the conditions as well as any. They form quite a wellmarked district; they are very fertile, and the strong cities in the region must have been numerous.``54';
isbe[720]='Argue`ar\'-gu: Only in the Revised Version (British and American) in <a onClick="return mV(\'Job\',40,2);">Job 40:2</a>. yakhach, which it translates, literally means "to be right," and in the causative form "reason with," "answer back," and is found in the King James Version rendered "reproach."``1';
isbe[721]='Ariarathes`a-ri-a-ra\'-thez.`<a href="./study/isbe/search.html?string=ARATHES">ARATHES</a>`1';
isbe[722]='Aridai`ar\'-i-di, a-rid\'-a-i (\'aridhay: a son of Haman (<a onClick="return mV(\'Est\',9,9);">Es 9:9</a>)): The name may be related to the Persian Hari-dayas, "delight of Hari"; the text is very uncertain.``1';
isbe[723]='Aridatha`ar-i-da\'-tha, a-rid\'-a-tha (\'aridhatha\'): A son of Haman (<a onClick="return mV(\'Est\',9,8);">Es 9:8</a>). It may be related to the Persian Hari-data, "given by Hari." The Septuagint reads Pharadatha.``1';
isbe[724]='Arieh`a\'-ri-e: "(the) Lion."`<a href="./study/isbe/search.html?string=ARGOB">ARGOB</a>`1';
isbe[725]='Ariel`a\'-ri-el (\'ariy\'el or \'ari\'el, "lioness of God"): But the word occurs in <a onClick="return mV(\'Eze\',43,15,16);">Eze 43:15-16</a>, and is there translated in the Revised Version (British and American) "<a href="./study/isbe/search.html?string=HEARTH">ALTAR HEARTH</a>."<P>(1) According to the Revised Version (British and American) a man of Moab whose two sons were slain by David\'s warrior Benaiah the son of Jehoiada (<a onClick="return mV(\'2Sa\',23,20);">2Sa 23:20</a>; <a onClick="return mV(\'1Ch\',11,22);">1Ch 11:22</a>). Here the King James Version translates "two lionlike men of Moab."<P>(2) A name applied to Jerusalem (<a onClick="return mV(\'Isa\',29,1,2,7);">Isa 29:1-2, 7</a>). The many explanations of the name are interesting, but mainly conjectural.<P>(3) One of the members of the delegation sent by Ezra to the place Casiphia, to secure temple ministers for his expedition to Jerusalem (<a onClick="return mV(\'Ezr\',8,16);">Ezr 8:16</a>).``11';
isbe[726]='Aright`a-rit\': "In a right way," "correctly," "going straight to the point," without error or deviation. "Set aright" (<a onClick="return mV(\'Job\',11,13);">Job 11:13</a>; Wiener, Pentateuchal Studies 78 8). Its use in <a onClick="return mV(\'Psa\',50,23);">Ps 50:23</a> is without authority in the Hebrew text; hence in italics.``1';
isbe[727]='Arimathaea`ar-i-ma-the\'-a (Arimathaia): "A city of the Jews," the home of Joseph in whose sepulchre the body of Jesus was laid. Its identity is the subject of much conjecture. The Onomasticon of Eusebius and Jerome identifies it with Ramathaim-Zophim in the hill-country of Ephraim (<a onClick="return mV(\'1Sa\',11,\'1-\');">1Sa 11</a>), which is Ramah the birthplace and burial-place of Samuel (<a onClick="return mV(\'1Sa\',1,19);">1Sa 1:19</a>; <a onClick="return mV(\'1Sa\',25,1);">25:1</a>), and places it near Timnah on the borders of Judah and Dan. G. A. Smith thinks it may be the modern Beit Rima, a village on an eminence 2 miles north of Timnah. Others incline to Ramallah, 8 miles north of Jerusalem and 3 miles from Bethel (<a onClick="return mV(\'Mat\',27,57);">Mt 27:57</a>; <a onClick="return mV(\'Mar\',15,43);">Mr 15:43</a>; <a onClick="return mV(\'Luk\',23,51);">Lu 23:51</a>; <a onClick="return mV(\'Jhn\',19,38);">Joh 19:38</a>).``78';
isbe[728]='Arioch`ar\'-i-ok: (\'aryokh):<P>(1) The name of the vassal king of Ellasar, under Chedorlaomer, king of Elam, and Amraphel, king of Shinar (Babylonia), who took part in the expedition against Sodom, Gomorrah and other states (<a onClick="return mV(\'Gen\',14,1,9);">Ge 14:1, 9</a>). Assyriologists generally, and probably rightly, identify Arioch with <a href="./study/isbe/search.html?string=ERI-AKU">Eri-Aku</a> (which see), king of Larsa, Ellasar being for Al-Larsa (now Sinqara in central Babylonia).<P>Texts Referring to the Reign of Arioch:<P>For an account of the expedition see <a href="./study/isbe/search.html?string=AMRAPHEL">AMRAPHEL</a>, and for the Babylonian texts bearing upon the reign, see <a href="./study/isbe/search.html?string=ERI-AKU">ERI-AKU</a>. In <a onClick="return mV(\'Gen\',14,1,9);">Ge 14:1, 9</a>, where the names of the allied kings who marched against the Cities of the Plain are given, that of Arioch follows his more immediate suzerain, Amraphel, and not Chedorlaomer, who, however, appears to have been the real overlord (verse 4), which agrees with the indications of the Bah records. No details of the expedition are available from Babylonian sources. Besides Larsa, Eri-Aku\'s inscriptions inform us that Ur (Muqayyar, Mugheir) was in the principality of which Larsa was the capital.<P>(2) The Arioch of <a onClick="return mV(\'Dan\',2,14,25);">Da 2:14, 25</a> was captain of the bodyguard of King Nebuchadnezzar. Nothing else is known about him except that it was he who was commanded to slay the "wise men" who failed to repeat to the king his dream and its interpretation; and who communicated to his royal master that Daniel had undertaken the task.``136';
isbe[729]='Arisai`ar\'-i-sai, a-ris\'-a-i (\'aricai): Probably a Persian word of unknown meaning. One of Haman\'s sons, slain by the Jews (<a onClick="return mV(\'Est\',9,9);">Es 9:9</a>).``1';
isbe[730]='Aristarchus`ar-is-tar\'-kus (Aristarchos, "best ruler"): He was one of those faithful companions of the apostle Paul who shared with him his labors and sufferings. He is suddenly mentioned along with Gaius as having been seized by the excited Ephesians during the riot stirred up by the silversmiths (<a onClick="return mV(\'Act\',19,29);">Ac 19:29</a>). They are designated "men of Macedonia, Paul\'s companions in travel." We learn later that he was a native of Thessalonica (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>; <a onClick="return mV(\'Act\',27,2);">27:2</a>). They were probably seized to extract from them information about their leader Paul, but when they could tell nothing, and since they were Greeks, nothing further was done to them.<P>When Aristarchus attached himself to Paul we do not know, but he seems ever after the Ephesian uproar to have remained in Paul\'s company. He was one of those who accompanied Paul from Greece via Macedonia (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>). Having preceded Paul to Troas, where they waited for him, they traveled with him to Palestine. He is next mentioned as accompanying Paul to Rome (<a onClick="return mV(\'Act\',27,2);">Ac 27:2</a>). There he attended Paul and shared his imprisonment. He is mentioned in two of the letters of the Roman captivity, in the Epistle to the church at <a onClick="return mV(\'Col\',4,10);">Col 4:10</a>, and in the Epistle to Phm (<a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a>), in both of which he sends greetings. In the former Paul calls him "my fellow-prisoner." According to tradition he was martyred during the persecution of Nero.``78';
isbe[731]='Aristobulus`ar-is-to-bu\'-lus (Aristoboulos, "best counselor"):<P>(1) Son of the Maccabean, John Hyrcanus, who assumed the power and also the title of king after his father\'s death (105 BC) and associated with him, as co-regent, his brother Antigonus (Ant., XIII, xi), though by the will of his father the government was entrusted to his mother. Three other brothers and his mother he cast into prison, where they died of starvation. He murdered Antigonus, and died conscience-stricken himself in 104 BC. See <a href="./study/isbe/search.html?string=MACCABEES">MACCABEES</a>.<P>(2) Aristobulus, nephew of the former, dethroned his mother, Alexandra (69 BC), and forced his brother Hyrcanus to renounce the crown and mitre in his favor. In 64 Pompey came to Palestine and supported the cause of Hyrcanus. See <a href="./study/isbe/search.html?string=HYRCANUS">HYRCANUS</a>. Aristobulus was defeated and taken prisoner, and Hyrcanus was appointed ethnarch in 63 BC. Aristobulus and his two daughters were taken to Rome, where he graced the triumph of Pompey. The father escaped later (56 BC) and appeared in Palestine again as a claimant to the throne. Many followers flocked to his standard, but he was finally defeated, severely wounded and taken prisoner a second time and with his son, Antigonus, again taken to Rome. Julius Caesar not only restored him to freedom (49 BC), but also gave him two legions to recover Judea, and to work in his interest against Pompey. But Quintus Metellus Scipio, who had just received Syria as a province, had Aristobulus poisoned as he was on his way to Palestine.CR<P>(3) Grandson of the preceding, and the last of the Maccabean family. See <a href="./study/isbe/search.html?string=ASMONEANS">ASMONEANS</a>.<P>(4) The Jewish teacher of Ptol. VII (2Macc 1:10).<P>(5) An inhabitant of Rome, certain of whose household are saluted by Paul (<a onClick="return mV(\'Rom\',16,10);">Ro 16:10</a>). He was probably a grandson of Herod and brother of Herod Agrippa, a man of great wealth, and intimate with the emperor Claudius. Lightfoot (Philippians, 172) suggests that "the household of Aristobulus" were his slaves, and that upon his death they had kept together and had become the property of the emperor either by purchase or as a legacy, in which event, however, they might, still retain the name of their former master. Among these were Christians to whom Paul sends greeting.``91';
isbe[732]='Arithmetic`a-rith\'-me-tik.`<a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[733]='Arius`a-ri\'-us, a\'-ri-us (Ares): The reading of the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) adopted in the Revised Version (British and American) for the former reading Areus and Areios of Josephus. A king of Sparta (309-265 BC) who wrote the letter to Onias, the high priest, given in 1Macc 12:7,20-23. There were two Spartan kings named Arius, and three high priests named Onias. Chronology requires the letter mentioned to have been written by Arius I to Onias I, most probably in the interval between 309 and 300 BC.`<a href="./study/isbe/search.html?string=LACEDAEMONIANS">LACEDAEMONIANS</a>`1';
isbe[734]='Ark`see <a href="./study/isbe/search.html?string=ARK+OF+BULRUSHES">ARK OF BULRUSHES</a>; <a href="./study/isbe/search.html?string=ARK+OF+THE+COVENANT">ARK OF THE COVENANT</a>; <a href="./study/isbe/search.html?string=ARK+OF+NOAH">ARK OF NOAH</a>``1';
isbe[735]='Ark of Bulrushes`ark, bool\'-rush-iz (tebhah; Egyptian tebt; Septuagint thibis, "a chest," "a vessel to float").<P>1. Definitions:<P>The Hebrew word here translated "ark" is used in the Old Testament only of the ark of Noah (<a onClick="return mV(\'Gen\',6,14);">Ge 6:14</a>f) and of the ark of bulrushes (<a onClick="return mV(\'Exd\',2,3);">Ex 2:3</a>), and always in the secondary meaning, a vessel to float. The Septuagint translates it of Noah\'s ark by kibotos, "a casket," and of the ark of bulrushes by thibis, a little basket made of osiers or flags. For the Ark of the Covenant, the Hebrew employed a different word (\'aron, "a chest"). Bulrushes (gome\', "papyrus"): This species of reed was used by the Egyptians for many different vessels, some of which were intended to float or even to be used as a skiff. Slime (chemar, "bitumen"), pitch (zepheth, "pitch") was probably the sticky mud of the Nile with which to this day so many things in Egypt are plastered. In this case it was mixed with bitumen. Flags (cuph, "sedge") were reeds of every kind and tall grass growing in the shallow water at the edge of the river.<P>2. History:<P>Thus the ark of bulrushes was a vessel made of papyrus stalks and rendered fit to float by being covered with a mixture of bitumen and mud. Into this floating vessel the mother of Moses placed the boy when he was three months old, and put the vessel in the water among the sedge along the banks of the Nile at the place where the ladies from the palace were likely to come to bathe. The act was a pathetic imitation of obedience to the king\'s command to throw boy babies into the river, a command which she had for three months braved and which now she so obeyed as probably to bring the cruelty of the king to the notice of the royal ladies in such way as to arouse a womanly sympathy, A similar story is related of Sargon I of Babylonia (Records of the Past, 1st series, V, 1-4; Rogers, Hist. Babylonian and Assyrian, I, 362).<P>The one story in no wise discredits the other. That method of abandoning children, either willingly or by necessity, is as natural along the Nile and the Euphrates, where the river is the great artery of the land and where the floating basket had been used from time immemorial, as is the custom in our modern cities of placing abandoned infants in the streets or on door-steps where they are likely to be found, and such events probably occurred then as often as now.``93';
isbe[736]='Ark of Noah`ark, no\'-a: A structure built by Noah at the command of God to preserve from the Flood a remnant of the human race and of the animals associated with man. It was constructed of "gopher wood" (<a onClick="return mV(\'Gen\',6,14);">Ge 6:14</a>)—very likely the cypress used extensively by the Phoenicians for ship-building. It was divided into rooms or nests, and was three stories high, pitched within and without with bitumen or "asphalt," of which there are extensive deposits at Hit, in the Euphrates valley, a little above Babylon. It was 300 cubits long, 50 cubits broad, 30 cubits high, which according to Petrie\'s estimate of a cubit as 22.5 inches would make it to be 562 1/2 ft. long, 93 2/3 ft. wide, 56 1/4 ft. deep, which are natural proportions of a ship of that size. The dimensions of the "Great Eastern," built in 1858, were 692 ft. long, 83 ft. broad, 58 ft. deep; those of the "Celtic" built in 1901 are 700 ft. long, 75 ft. wide, 49 1/3 ft. deep. It is extremely improbable that such reasonable dimensions should have been assigned to the Ark except they were based on fact. Unrestrained tradition would have been sure to distort the proportions, as is shown by what actually occurred in other accounts of the Ark. The cuneiform tablets represent it as six stories high, with the length, width, and depth, each as 140 cubits (262 ft.), and having a mast on top of all, and a pilot to guide the impossible craft (see Deluge Tablet, ll.22,23,38-41). Berosus, the Greek historian, represents it to have been five stadia (3,000 ft.) long and two stadia (1,200 ft.) broad, while Origen, in order to confound Celsus (Against Celsus 4.41) gave the figures an interpretation which made the Ark 25 miles long and 3/4 of a mile wide.<P>It is needless to speculate upon the capacity of the Ark for holding absolutely all the species of animals found in the world, together with the food necessary for them, since we are only required to provide for such animals as were native to the area to which the remnants of the human race living at that time were limited, and which (see <a href="./study/isbe/search.html?string=DELUGE+OF+NOAH">DELUGE OF NOAH</a>) may not have been large. But calculations show that the structure described contained a space of about 3,500,000 cubic feet, and that after storing food enough to support several thousand pairs of animals, of the average size, on an ocean voyage of a year, there would remain more than 50 cubic feet of space for each pair.<P>No mention is made in the Bible of a pilot for the Ark, but it seems to have been left to float as a derelict upon the waters. For that purpose its form and dimensions were perfect, as was long ago demonstrated by the celebrated navigator, Sir Walter Raleigh, who notes it had "a flat bottom, and was not raised in form of a ship, with a sharpness forward, to cut the waves for the better speed"—a construction which secured the maximum of storage capacity and made a vessel which would ride steadily upon the water. Numerous vessels after the pattern of the Ark, but of smaller dimensions, have been made in Holland and Denmark and proved admirably adapted for freightage where speed was not of the first importance. They would hold one-third more lading than other vessels, and would require no more hands to work them. The gradual rise and subsidence of the water, each continuing for six months, and their movement inland, render the survival of such a structure by no means unreasonable. According to <a onClick="return mV(\'Gen\',6,3);">Ge 6:3</a>; <a onClick="return mV(\'1Pe\',3,20);">1Pe 3:20</a>; <a onClick="return mV(\'2Pe\',2,5);">2Pe 2:5</a>, warning of the Flood was given 120 years beforehand, and during that time Noah, while preparing the Ark, became a preacher of righteousness. For evidence that there was a gradual destruction of the race previous to the Flood.`<a href="./study/isbe/search.html?string=DELUGE+OF+NOAH">DELUGE OF NOAH</a>`198';
isbe[737]='Ark of Testimony`test\'-i-mo-ni.`<a href="./study/isbe/search.html?string=ARK+OF+THE+COVENANT">ARK OF THE COVENANT</a>`1';
isbe[738]='Ark of the Covenant`kuv\'-e-nant (\'aron ha-berith):<P>I. The Statements of the Old Testament Concerning the Ark of the Covenant.<P>1. Pentateuch:<P>In <a onClick="return mV(\'Exd\',25,10);">Ex 25:10</a>f; Moses receives the command to build an ark of acacia wood. Within this ark were to be placed the tables of the law which God was about to give to Moses. Upon the top of the ark, probably not as a lid but above the lid, the kapporeth, in the New Testament to hilasterion (<a onClick="return mV(\'Hbr\',9,5);">Heb 9:5</a>), is to be placed, which was a golden plate upon which two cherubim, with raised wings and facing each other, covered the ark. From the place between the two cherubim God promises to speak to Moses, as often as He shall give him commands in reference to the Israelites.<P>The portion of the Pentateuch in which this is recorded is taken from the so-called Priest Codex (P). The reports of the Elohist (E) and the Jahwist (Jahwist) on this subject are wanting; but both of these sources report concerning the important role which the ark played in the entrance of Israel into Canaan, and these documents too must have contained the information that the people had received this ark. It can further with certainty be stated concerning the Elohist, and with some probability concerning the Jahwist, in what part of these documents these accounts were to be found. For Elohist reports in <a onClick="return mV(\'Exd\',33,6);">Ex 33:6</a> that the Israelites, in order to demonstrate their repentance on account of the golden calf, had at God\'s command laid aside their ornaments. In <a onClick="return mV(\'Exd\',33,\'7-10\');">33:7-10</a> there follows a statement concerning the erection of the sacred tent; but this is explained only by the fact that between <a onClick="return mV(\'Exd\',33,6,7);">33:6 and 7</a> a report concerning the erection of the ark of the covenant must have been found, which the R of the Pentateuch (since before this he had already made use of the much more exhaustive account of the Priest Codex) was compelled to omit.<P>But that at this place the Elohist must have reported not only concerning the erection of the sacred tent but also of the construction of the ark of the covenant, is in itself probable, and can too be concluded from this, that according to the Deuteronomist, the composition of which is also conditioned upon that of the Elohist and the Jahwist, the ark was built on this occasion. We further conclude that it was not so much the tabernacle which could serve as a consolation to the people, something that at that time they needed, but rather the ark, which was to symbolize to them that God was on the march with them. In the Jahwist we do not indeed find at this place any statement concerning this sacred structure, but we do find the statement that the Israelites, out of sorrow because of the bad news brought by Moses, discarded their ornaments.<P>For <a onClick="return mV(\'Exd\',33,4);">Ex 33:4</a> is taken from the Jahwist, since the Elohist contains the command to discard the ornaments later on, and hence could not have written <a onClick="return mV(\'Exd\',33,4);">33:4</a>. Now it is a justifiable surmise that the Jahwist has also reported what use was made of the ornaments that had been discarded; and as this author, just as is the case with the Elohist, must have at some place contained a report concerning the construction of the ark, he certainly must have given this just at this place. The corresponding account in the Deuteronomist is found in <a onClick="return mV(\'Deu\',10,\'1-5\');">De 10:1-5</a>. Accordingly, then, all the four Pentateuch documents reported that Moses had built the ark at Sinai. The Deuteronomist, like the Priestly Code (P), says, that it was built of acacia wood. In the Elohistic narrative the subject is mentioned again in <a onClick="return mV(\'Num\',10,33);">Nu 10:33</a>ff, where we read that the ark had preceded the people as they broke camp and marched from Sinai. At this place too the words are found which Moses was accustomed to speak when the ark began to move out and when it arrived at a halting-place.<P>2. Joshua:<P>According to the narrative in <a onClick="return mV(\'Jos\',3,\'1-\');">Jos 3</a> the ark cooperated at the crossing of the Jordan in such a way that the waters of the river ceased to continue flowing as soon as the feet of the priests who were carrying the ark entered the water, and that it stood still above until these priests, after the people had crossed over, again left the bed of the river with the ark. In the account of the solemn march around Jericho, which according to <a onClick="return mV(\'Jos\',6,\'1-\');">Jos 6</a> caused the walls of the city to fall, the carrying of the ark around the city is regarded as an essential feature in <a onClick="return mV(\'Jos\',6,4,7,11);">6:4,7,11</a>. In chapter <a onClick="return mV(\'Jos\',7,\'1-\');">7</a> it is narrated that Joshua, after the defeat of the army before Ai, lamented and prayed before the ark. In chapter <a onClick="return mV(\'Jos\',8,\'1-\');">8</a> this is mentioned in connection with Mount Ebal.<P>3. Other Historical Books:<P>At the time of Eli the ark stood in the sanctuary at Shiloh (<a onClick="return mV(\'1Sa\',3,3);">1Sa 3:3</a>). From this place it was taken after Israel had been defeated by the Philistines at Ebenezer, in order to assure the help of Yahweh to the people; but, instead of this, the ark fell into the hands of the Philistines (<a onClick="return mV(\'1Sa\',4,\'1-\');">1Sa 4</a>). But the various misfortunes that now afflicted the Philistines induced these to regard the possession of the ark as a calamity (<a onClick="return mV(\'1Sa\',5,\'1-\');">1Sa 5</a>) and they sent it back to Israel (<a onClick="return mV(\'1Sa\',6,\'1-\');">1Sa 6</a>). It was brought first to Bethshemesh in the tribe of Judah, near the borders of the Philistines, and soon after to Kiriath-jearim, about 7.5 miles northwest of Jerusalem. There the ark remained for years in the house of a man by the name of Abinadab, whose son was its guardian (<a onClick="return mV(\'1Sa\',7,1);">1Sa 7:1</a>), until David brought it to Mount Zion, after he had established his camp and court there. He there placed it in a tent prepared for it (<a onClick="return mV(\'2Sa\',6,\'1-\');">2Sa 6</a>; <a onClick="return mV(\'1Ch\',13,\'1-\');">1Ch 13</a>; <a onClick="return mV(\'1Ch\',15,\'1-\');">15</a>). In David\'s time again the ark was taken along into battle (<a onClick="return mV(\'2Sa\',11,11);">2Sa 11:11</a>). When David fled from the presence of Absalom, the priests wanted to accompany him with the ark, but he sent it back (<a onClick="return mV(\'2Sa\',15,24);">2Sa 15:24</a>f). David had also intended to build a temple, in which the ark was to find its place, since before this it had always found its resting-place in a tent. But God forbade this through Nathan, because He was willing to build a house for David, but was not willing that David should build one for Him (<a onClick="return mV(\'2Sa\',7,\'1-\');">2Sa 7</a>). Solomon then built the temple and placed the ark of the covenant in the Holy of Holies of this temple, where it was placed under the wings of two mighty cherubim images (<a onClick="return mV(\'1Ki\',8,\'1-\');">1Ki 8</a>; <a onClick="return mV(\'2Ch\',5,\'1-\');">2Ch 5</a>).<P>4. Prophetical and Poetical Books:<P>Jeremiah in the passage 3:16, which certainly was written after the destruction of Jerusalem, states that in the future new Jerusalem nobody will any more concern himself about the ark of the covenant of Yahweh, and no one will again build such a one. In the post-exilic <a onClick="return mV(\'Psa\',132,8);">Ps 132 (verse 8)</a>, Yahweh is petitioned to occupy together with the ark, the symbol of His omnipotent presence, also the sanctuary that has been erected for Him, the poet describing himself and those who sing this psalm as participants in the home-bringing of the ark by David. No further mention is made of the ark of the covenant in the Psalter or the prophetical books.<P>5. The New Testament:<P>In the New Testament the ark of the covenant is mentioned only in <a onClick="return mV(\'Hbr\',9,4);">Heb 9:4</a> in the description of the Solomonic temple.<P>II. The Form of the Ark of the Covenant.<P>According to the statements in the Priestly Code (P), the ark of the covenant was a chest made out of acacia wood, 2 1/2 cubits (about equal to 4 ft.) long, 1 1/2 cubits wide and 1 1/2 high. That it was made out of acacia wood is also stated by the Deuteronomist in <a onClick="return mV(\'Deu\',10,3);">De 10:3</a>. According to P it was covered with gold within and without, and was ornamented with a moulding of gold running all around it. At its four feet rings were added, through which the gold-covered carrying-staves were put. These staves are also mentioned in <a onClick="return mV(\'1Ki\',8,7,8);">1Ki 8:7-8</a>; <a onClick="return mV(\'2Ch\',5,8,9);">2Ch 5:8-9</a>, and mention is often made of those who carried the ark (<a onClick="return mV(\'2Sa\',6,13);">2Sa 6:13</a>; <a onClick="return mV(\'2Sa\',15,24);">15:24</a>). The correctness of these statements cannot be proved, but yet there is no reason to doubt them. Rather we might have reason to hesitate in clinging to the view that on the old ark there was really a golden kapporeth, but only because in olden times the possession of such valuables and their use for such a purpose would be doubtful. But on the basis of such reasons we could at most doubt whether the lid with its cherubim consisted of solid gold. That the cherubim were attached to or above the ark is not at all improbable.<P>That Solomon placed the ark in the Holy of Holies between two massive cherubim figures (<a onClick="return mV(\'1Ki\',6,19,23);">1Ki 6:19, 23</a>f; <a onClick="return mV(\'1Ki\',8,6);">8:6</a>) does not prove that there were no cherubim figures on the ark itself, or even that those cherubim figures, which according to <a onClick="return mV(\'Exd\',25,19);">Ex 25:19</a> were found on the ark, were nothing else than those of Solomon\'s days in imagination transferred back to an earlier period (Vatke, Biblische Theologie,1835,333; Popper, Der biblische Bericht uber die Stiftshutte, 1862). In recent times the view has been maintained that the ark in reality was no ark at all but an empty throne. It was Reichel, in his work Vorhellenische Gotterkulte, who first expressed this view, and then Meinhold, Die Lade Jahwes, Tubingen, 1910, and Theologische Studien und Kritiken, 1901, 593-617, who developed this view in the following manner. It is claimed that in the days of Moses a throne-like rock at Mount Sinai was regarded as the seat of Yahweh, and when the Israelites departed from Sinai they made for themselves a portable throne, and Yahweh was regarded as sitting visibly enthroned upon this and accompanying His people. In the main the same view was maintained by Martin Dibellius (Die Lade Jahwes, Gottingen, 1906; Hermann Gunkel, Die Lade Jahwes ein Thronsitz, reprinted from the Zeitschrift fur Missionskunde und Religionswissenschaft, Heidelberg, 1906).<P>The occasion for this view was given by the fact that among the Persians and other people there were empty thrones of the gods, which were carried or hauled around in processions. The reasons for finding in the ark of the covenant such an empty throne are found chiefly in this, that the passages in the Old Testament, in which it seems that the presence of God is made conditional on the presence of the ark (compare <a onClick="return mV(\'Num\',14,42,43,44);">Nu 14:42-44</a>), can be explained if the ark is regarded as a throne of Yahweh. However, empty thrones of the gods are found only among the Aryan people, and all of the passages of the Old Testament which refer to the ark can be easily explained without such a supposition. This view is to be rejected particularly for this reason, that in the Old Testament the ark is always described as an ark, and never as a throne or a seat; and because it is absolutely impossible to see what reason would have existed at a later period to state that it was an ark if it had originally been a throne. Dibelius and Gunkel appeal also particularly to this, that in several passages, of which <a onClick="return mV(\'1Sa\',4,4);">1Sa 4:4</a>; <a onClick="return mV(\'2Sa\',6,2);">2Sa 6:2</a> are the oldest, Yahweh is declared to be enthroned on the cherubim. But this proves nothing, because He is not called "He who is enthroned on the ark," and the cherubim and the ark are two different things, even if there were cherubim on the lid of the ark. Compare the refutation of Meinhold and Dibelius by Budde (ZATW, 1901, 193-200, and Theol. Studien und Kritiken, 1906, 489-507).<P>III. The Contents of the Ark of the Covenant.<P>According to the Priestly Code the two tables of the law constituted the contents of the ark. In <a onClick="return mV(\'Exd\',25,16);">Ex 25:16</a>; <a onClick="return mV(\'Exd\',40,20);">40:20</a>, as also <a onClick="return mV(\'Deu\',10,5);">De 10:5</a>, and, too, in <a onClick="return mV(\'1Ki\',8,9);">1Ki 8:9</a>, we have the same testimony. The majority of the modern critics regard this as an unhistorical statement first concocted by.the so-called "Deuteronomistic school." Their reasons for this are the following:<P>(1) The critics deny that the existence of the Mosaic tables of the law is a historical fact;<P>(2) The critics declare that if these tables had really been in possession of the Israelites, they would not have been so foolish as to put them into a box which it was forbidden to open;<P>(3) The critics declare that the views entertained in olden times on the importance of the ark cannot be reconciled with the presence of the tables in the ark.<P>But we reply:<p>(1) that the actual existence of the two tables of the law is denied without sufficient reasons; that the ten principal formulas of the Decalogue, as these are given in <a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20</a> and <a onClick="return mV(\'Deu\',5,\'1-\');">De 5</a>, come from Moses, must be insisted upon, and that according to <a onClick="return mV(\'Exd\',34,\'1-\');">Ex 34</a> other ten commandments had been written on these tables is incorrect. The laws in <a onClick="return mV(\'Exd\',34,\'17-26\');">Ex 34:17-26</a> are not at all declared there to be the ten words which God intended to write upon the tables. But if Moses had prepared the tables for the commandments, then it is<P>(2) only probable that he caused to be made a suitable chest for their preservation and their transportation through the desert. Now it might be thought that the view that the ark was so holy that it dared not be opened had originated only after the time of Moses. However, it is just as easily possible, that that importance had already been assigned by Moses to the tables in the ark which the sealed and carefully preserved copy of a business agreement would have and which is to be opened only in case of necessity (<a onClick="return mV(\'Jer\',32,\'11-14\');">Jer 32:11-14</a>). Such a case of necessity never afterward materialized, because the Israelites were never in doubt as to what was written on these tables. On a verbatim reading no stress was laid in olden times.<P>(3) With regard to the importance of the ark according to the estimate placed upon it in the earlier period of Israel, we shall see later that the traditions in reference to the tables harmonize fully with this importance.<P>Of the modern critics who have rejected this tradition, some have thought that the ark was empty, and that the Israelites thought that Yahweh dwelt in it (Guthe, Geschichte des Volkes Israel, 39), or that the empty chest was a kind of fetish (Schwally, Semitische Kriegsaltertumer, 1901, I, 10). As a rule they believe that a stone image of Yahweh or two stones had been placed in the ark, these being possibly meteor stones, in which it was thought that some divine power was dwelling (Stade, Geschichte Israels, I, 458); or possibly stones that in some battle or other had been hurled and through which a victory had been won (Couard, ZATW, XII, 76); or possibly they were the stones which at the alliance of the tribes that dwelt about Mount Sinai were first set up as testimonials of this covenant (Kraetzschmar, Die Bundesvorstellung im Alten Testament, 216). Of these views only the one which declares that the ark contained meteor stones deserves any notice, because it could indeed be thought possible that Israel would have taken with them on their journey through the desert such stones which they could have regarded as pledges of the Divine Presence fallen from heaven and could have preserved these in a sacred ark. But it is impossible to show that this view is probable, not to speak of proving it to be correct. The only extant tradition says that the ark contained the tables of the law, and this is the only view that is in harmony with what we must think of the whole work of Moses. Finally we must again remember that it is probable that Elohist and Jahwist, who speak both of the ark and also of the tables of the law, in the portions of these documents which have not been preserved, reported also that the tables were placed in the ark.<P>IV. The Names of the Ark of the Covenant.<P>The name "ark of the covenant of Yahweh" was not originally found everywhere where it now stands, but in many places the words "of the covenant" were added later. However, the expression "ark of the covenant" is found in the oldest source of the Book of Samuel (<a onClick="return mV(\'2Sa\',15,24);">2Sa 15:24</a>), and in <a onClick="return mV(\'1Ki\',3,15);">1Ki 3:15</a> in the old source for the history of Solomon, of which the Deuteronomistic author of the Book of Kings made use; in <a onClick="return mV(\'1Ki\',8,1);">1Ki 8:1</a>, a very old account of the building of the temple; and the genuineness of the expression "ark of the covenant" in these passages is not with any good reasons to be called into question. Further the expression is found in the Books of Numbers and Joshua, in a number of passages (<a onClick="return mV(\'Num\',10,33);">Nu 10:33</a>; <a onClick="return mV(\'Num\',14,44);">14:44</a>; <a onClick="return mV(\'Jos\',3,3,6,8);">Jos 3:3, 6, 8</a>; <a onClick="return mV(\'Jos\',4,9,18);">4:9, 18</a>; <a onClick="return mV(\'Jos\',6,6,8);">6:6, 8</a>), which in all probability belong to the document of Elohist. It appears that the Elohist designates the ark as the "ark of the covenant of God," or more briefly; as the "ark of the covenant," unless in a connected narrative he writes only " the ark," while in the Jahwist the principal appellation was "ark of Yahweh, the Lord of the whole earth" (compare Lotz, Die Bundeslade,1901,30-36).<P>From this we must conclude that the appellation "ark of the covenant of Yahweh" must go back to very ancient times, and we must reject the view that this term took the place of the term "ark of Yahweh" in consequence of a change of views with reference to the ark, brought about through Deuteronomy. Indeed, since the name "ark of the covenant," as is proved by the Elohist, was nowhere mor e in use than in Ephraim, where they did not possess the ark and accordingly would have had the least occasion to introduce a new name for it, it can be accepted that the name originated in the oldest times, namely those of Moses. The other expression "ark of Yahweh" may be just as old and need not be an abbreviation of the other. It was possible to designate the ark as "ark of Yahweh" because it was a sanctuary belonging to Yahweh; and it was possible to call it also "the ark of the covenant of Yahweh," because it was a monument and evidence of the covenant which Yahweh had made with Israel. It is for this reason not correct to translate the expression \'aron berith Yahweh by "the ark of the law of Yahweh," as equivalent to "the ark which served as a place for preserving the law of the covenant." For berith does not signify "law," even if it was possible under certain circumstances to call a covenant "law" figuratively and synecdochically the "covenant"; and when <a onClick="return mV(\'1Ki\',8,21);">1Ki 8:21</a> speaks of "the ark wherein is the covenant of Yahweh," the next words, "which he made with our fathers," show that covenant does not here mean "law," but rather the covenant relationship which in a certain sense is embodied in the tables.<P>In P the ark is also called "the ark of the testimony," and this too does not signify "ark of the law." For not already in P but only in later documents did the word \'edhuth receive the meaning of "law" (Lotz, Die Bundeslade, 40). P means by "testimony" the Ten Words, through the proclamation of which the true God has given evidence of His real essence. But where this testimony is found engraved in the handwriting of God on the tables of stone, just there also is the place where He too is to be regarded as locally present.<P>V. The History of the Ark of the Covenant.<P>According to the tradition contained in the Pentateuch the sacred ark was built at Mount Sinai and was taken by the Israelites along with them to Canaan. This must be accepted as absolutely correct. The supposition is groundless, that it was a shrine that the Israelites had taken over from the Canaanites. This view is refuted by the high estimate in which in Eli\'s time the ark was held by all Israel (<a onClick="return mV(\'1Sa\',1,\'1-\');">1Sa 1</a>f; <a onClick="return mV(\'1Sa\',2,22);">2:22</a>); and especially by the fact that the ark was at that time regarded as the property of that God who had brought Israel out of Egypt, and accordingly had through this ark caused the Canaanites to be conquered (<a onClick="return mV(\'1Sa\',4,8);">1Sa 4:8</a>; <a onClick="return mV(\'1Sa\',6,6);">6:6</a>; <a onClick="return mV(\'2Sa\',7,6);">2Sa 7:6</a>; <a onClick="return mV(\'1Ki\',12,28);">1Ki 12:28</a>). The opinion
