also that the ark was an ancient palladium of the tribe of Ephraim or of the descendants of Joseph and was only at a later period recognized by all Israel (Stade, Geschichte des Volkes Israel, I, 458) is not tenable, for we hear nothing to the effect that the descendants of Joseph concerned themselves more for the ark than the other tribes did. In the time of Eli the ark stood in the sanctuary at Shiloh.<P>When Israel had been conquered by the Philistines, the ark was taken from Shiloh in order that Yahweh should aid His people. But notwithstanding this the Philistines yet conquered and captured the ark (<a onClick="return mV(\'1Sa\',5,\'1-\');">1Sa 5</a>). But the many misfortunes that overtook them made them think that the possession of the ark was destructive to them and they sent it back (<a onClick="return mV(\'1Sa\',6,\'1-\');">1Sa 6</a>). The ark first came to Bethshemesh, in the tribe of Judah, and then to Kiriath-jearim (or Baale-judah, <a onClick="return mV(\'2Sa\',6,2);">2Sa 6:2</a>), about 7.5 miles northwest of Jerusalem. There the ark remained for many years until David, after he had taken possession of Mount Zion, took it there (<a onClick="return mV(\'2Sa\',6,\'1-\');">2Sa 6</a>) and deposited it in a tent. Solomon brought it into the Holy of Holies in the temple (<a onClick="return mV(\'1Ki\',8,\'3-8\');">1Ki 8:3-8</a>), where in all probability it remained until the destruction of Jerusalem by Nebuchadnezzar; for <a onClick="return mV(\'Jer\',3,16);">Jer 3:16</a> proves that the Israelites felt that they were in possession of the ark up to this time.<P>VI. The Significance of the Ark.<P>According to many investigators the ark was originally a war sanctuary. In favor of this it can be urged that Israel took it into their camp, in order that they might receive the help of Yahweh in the battle with the Philistines (<a onClick="return mV(\'1Sa\',4,\'1-\');">1Sa 4</a>); and further that also in the time of David the ark was again taken along into battle (<a onClick="return mV(\'2Sa\',11,11);">2Sa 11:11</a>; compare <a onClick="return mV(\'Psa\',24,\'1-\');">Ps 24</a>); note also the word of Moses, which he spoke when the ark was taken up to be carried: "Rise up, O Yahweh, and let thine enemies be scattered" (<a onClick="return mV(\'Num\',10,35);">Nu 10:35</a>). However, nothing of what we know or presuppose concerning the form and the contents of the ark points to an original military purpose of the same; and in the other statements that are found elsewhere concerning the ark, a much more general significance is assigned to it. The significance which the ark had for the Israelites in connection with their wars is only the outcome of its signification as the symbol of the presence of Yahweh, who was not at all a God of war, but when His people were compelled to fight was their helper in the struggle.<P>A Symbol of the Divine Presence:<P>That the ark was designed to be a symbol of the presence of God in the midst of His people is the common teaching of the Old Testament. According to the Elohist the ark was made to serve as a comfort to the people for this, that they were to leave the mountain where God had caused them to realize His presence (<a onClick="return mV(\'Exd\',30,6);">Ex 30:6</a>). According to the Priestly Code (P), God purposed to speak with Moses from the place between the cherubim upon the ark. According to <a onClick="return mV(\'Jdg\',2,1);">Jud 2:1</a>f; the angel of Yahweh spoke in Bethel (Bochim) in reproof and exhortation to the people, after the ark of the covenant had been brought to that place; for the comparison of <a onClick="return mV(\'Num\',10,33);">Nu 10:33</a>ff and <a onClick="return mV(\'Exd\',23,20);">Ex 23:20</a>ff shows that <a onClick="return mV(\'Jdg\',2,1);">Jud 2:1</a> is to be understood as speaking of the transfer of the ark to Bethel. When Israel in the time of Eli was overpowered by the Philistines, the Israelites sent for the ark, in order that Yahweh should come into the camp of Israel, and this was also believed to be the case by the Philistines (<a onClick="return mV(\'1Sa\',4,3);">1Sa 4:3</a>f). After the ark had come to Bethshemesh and a pestilence had broken out there, the people did not want to keep the ark, because no one could live in the presence of Yahweh, this holy God (<a onClick="return mV(\'1Sa\',6,20);">1Sa 6:20</a>); and Jeremiah says (<a onClick="return mV(\'Jer\',3,16,17);">3:16-17</a>) that an ark of the covenant would not be again made after the restoration of Israel, but then Jerusalem would be called the "throne of Yahweh," i.e. it would so manifestly be the city of God that it would guarantee the presence of God at least just as much as the ark formerly did.<P>In olden times these things appeared more realistic to the people than they do to us; and when the ark was considered the visible representation of the presence of Yahweh, and as guaranteeing His presence, a close material connection was thought to exist between the ark and Yahweh, by virtue of which Divine powers were also thought to be present in the ark. The people at Bethshemesh were not willing to keep the ark any longer in their midst, because they could not live in its near presence. David\'s dancing before the ark is regarded by him and by the narrator of the event as a dancing before the Lord (<a onClick="return mV(\'2Sa\',6,5,14,21);">2Sa 6:5, 14, 21</a>), and in <a onClick="return mV(\'2Sa\',7,5);">2Sa 7:5</a>f God says, through Nathan, that He had wandered around in a tent since He had led the Israelites out of Egypt. But the view advocated by some of the modern critics, that the Israelites had thought that the ark was the dwelling- place or the throne-seat of Yahweh, is nevertheless not correct. This opinion cannot be harmonized with this fact, that in the sources, dating from the same olden times, mention is made of His dwelling in many places in Canaan and outside of Canaan, so that the idea that His presence or even He Himself is confined to the ark is impossible.<P>The statement of Moses, "Rise up, O Yahweh, and let thine enemies be scattered" (<a onClick="return mV(\'Num\',10,35);">Nu 10:35</a>), is not the command addressed to those who carry the ark to lift it up and thereby to lift Yahweh up for the journey, but is a demand made upon Yahweh, in accordance with His promise, to go ahead of Israel as the ark does. According to <a onClick="return mV(\'1Sa\',4,3);">1Sa 4:3</a> the Israelites did not say "We want to go and get Yahweh," but "We want to go and get the ark of Yahweh, so that He may come into our midst." They accordingly only wanted to induce Him to come by getting the ark. This, too, the priests and the soothsayers of the Philistines say: "Do not permit the ark of the God of the Israelites to depart without sending a gift along," but they do not speak thus of Yahweh. That Samuel, who slept near the ark, when he was addressed by Yahweh, did not at all at first think that Yahweh was addressing him, proves that at that time the view did not prevail that He was in the ark or had His seat upon it. Ancient Israel was accordingly evidently of the conviction that the ark was closely connected with Yahweh, that something of His power was inherent in the ark; consequently the feeling prevailed that when near the ark they were in a special way in the presence of and near to the Lord.<P>But this is something altogether different from the opinion that the ark was the seat or the dwelling-place of Yahweh. Even if the old Israelites, on account of the crudeness of antique methods of thought, were not conscious of the greatness of this difference, the fact that this difference was felt is not a matter of doubt. That the ark was built to embody the presence of God among His people is just as clear from the statements of the Elohist, and probably also of the Jahwist, as it is from those of the Priestly Code (P); and if these have accordingly regarded the tables of the law as constituting the contents of the ark, then this is in perfect harmony with their views of this purpose, and we too must cling to these same views. For what would have been better adapted to make the instrument which represents the presence of God more suitable for this than the stone tables with the Ten Words, through which Yahweh had made known to His people His ethical character? For this very purpose it had to be an ark. The words on these tables were a kind of a spiritual portrait of the God of Israel, who could not be pictured in a bodily form. In this shape nobody in ancient Israel has formulated this thought, but that this thought was present is certain.``105';
isbe[739]='Arkite`ark\'-it (\'arqi): An inhabitant of the town of Arka, situated some ten or twelve miles northeast of Tripoils, Syria, and about four miles from the shore of the sea. The Arkites are mentioned in <a onClick="return mV(\'Gen\',10,17);">Ge 10:17</a> and <a onClick="return mV(\'1Ch\',1,15);">1Ch 1:15</a> as being the descendants of Canaan, and they were undoubtedly of Phoenician stock. The place was not of much importance, but it is mentioned in the Assyrian inscriptions, under the name Irkatah and taken by Tiglathpileser III in 738 BC. Not being on the sea its trade was small and it probably belonged to Tripoli or Botrys originally. It was the birthplace of Alexander Severus, hence its Roman name, Caesarea Libani. Its site is marked by a high mound near the foothills of Lebanon.``138';
isbe[740]='Arm`arm (zeroa\', \'ezroa\', dera\'; brachion; chotsen, katheph): The usual form is zeroa\' from the root zara\', "to spread." The arm may be "stretched out." \'Ezroa\' is this form with prosthetic \'aleph (<a onClick="return mV(\'Job\',31,22);">Job 31:22</a>; <a onClick="return mV(\'Jer\',32,21);">Jer 32:21</a>), and dera\' is the Aramaic form. Chotsen is really "bosom," thus the Revised Version (British and American) (<a onClick="return mV(\'Isa\',49,22);">Isa 49:22</a>); and katheph is "shoulder," thus the Revised Version (British and American) (<a onClick="return mV(\'Job\',31,22);">Job 31:22</a>). Compare cheir, also, in <a onClick="return mV(\'Act\',11,21);">Ac 11:21</a>.<P>Figurative: The arm denotes influence, power, means of support or conquest. The arms of Moab (<a onClick="return mV(\'Jer\',48,25);">Jer 48:25</a>) and of Pharaoh (<a onClick="return mV(\'Eze\',30,21);">Eze 30:21</a>ff) are broken. The arm of Eli and the arm of his father\'s house are to be cut off (<a onClick="return mV(\'1Sa\',2,31);">1Sa 2:31</a>). Because the arm wielded the sword it signified "oppression" (<a onClick="return mV(\'Job\',35,9);">Job 35:9</a>). The arms are the means of support, therefore to refuse to aid the fatherless is to break their arms (<a onClick="return mV(\'Job\',22,9);">Job 22:9</a>).<P>Applied anthropomorphically to God, the arm denotes also His power, power to deliver, support, conquer. His "outstretched arm" delivered Israel from Egypt (<a onClick="return mV(\'Exd\',6,6);">Ex 6:6</a>; <a onClick="return mV(\'Deu\',4,34);">De 4:34</a>, etc.). They support: "Underneath are the everlasting arms" (<a onClick="return mV(\'Deu\',33,27);">De 33:27</a>). His arm protects (<a onClick="return mV(\'Isa\',40,11);">Isa 40:11</a>). Yahweh is sometimes likened to a warrior and smites with His arm (<a onClick="return mV(\'Psa\',89,10);">Ps 89:10</a>; <a onClick="return mV(\'Isa\',63,5);">Isa 63:5</a>; <a onClick="return mV(\'Jer\',21,5);">Jer 21:5</a>). The arm of Yahweh is holy (<a onClick="return mV(\'Psa\',98,1);">Ps 98:1</a>; <a onClick="return mV(\'Isa\',52,10);">Isa 52:10</a>). Many other passages of Scripture might be quoted showing how the power of God to redeem, judge, protect, punish is expressed by the idea of "the arm of Yahweh."``78';
isbe[741]='Armageddon`ar-ma-ged\'-on Armageddon: <a onClick="return mV(\'Rev\',16,16);">Re 16:16</a>; the Revised Version (British and American) "<a href="./study/isbe/search.html?string=HAR-MAGEDON">HAR-MAGEDON</a>") (which see).``1';
isbe[742]='Armenia`ar-me\'-ni-a:<P><b>I. GEOGRAPHY</b><P><b>II. ANCIENT HISTORY</b><P class="in15">1. Turanian Armenians<P class="in30">Their Religion<P class="in15">2. Aryan Armenians: History to 114 AD<P><b>LITERATURE</b><hr /><P>I. Geography.<p>\'ararat (Sumerian Ar, "region," plus ar "high," plus Tu, "mountain," plus "high mountainous region"): in Assyrian, Urtu, Urartu, Urastu: in AEgyp, Ermenen (= "Region of the Minni") Wiener, Origin of the Pentateuch, Armina, Armaniyqa (Armenia): in Hecataeus of Miletus, circa 520 BC, the people are Armenioi (<a onClick="return mV(\'Gen\',8,4);">Ge 8:4</a>; <a onClick="return mV(\'2Ki\',19,37);">2Ki 19:37</a>; <a onClick="return mV(\'Isa\',37,38);">Isa 37:38</a>; <a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a>). Throughout the Bible, this is a country, not a mountain. Armenia Major was bounded on the north by the River Cyrus (Kour), Iberia, Colchis, and the Moschici Mts.; on the west by Asia Minor and the Euphrates; on the south by Mesopotamia and Assyria; on the east by the Caspian and Media. (Armenia Minor lay between the Euphrates and the Halys.) Ararat was originally the name of the central district. Most of Armenia is between 8,000 and 3,000 feet above sea-level, and slopes toward Euphrates, Cyrus, and the Gaspian. Mt. Massis (generally called Greater Ararat) <span class="noTag">is</span> 16,969 ft. and Lesser Ararat, 12,840 ft. Both are of igneous origin, as is Aragds (A\'la Goz), 13,436 ft. Sulphur springs and earthquakes still attest volcanic activity.<P>The largest rivers are the Euphrates, Tigris and Araxes. The latter, swift and famed for violent floods, joins the Cyrus, which falls into the Caspian. The lakes Van, Urmi and Sevan are veritable inland seas. The many mountain chains, impassable torrents and large streams divide the country into districts far less accessible from one another than from foreign lands. Hence, invasions are easy and national union difficult. This has sadly affected the history of Armenia. Xenophon (Anab. iv.5) describes the people as living in houses partly underground, such as are still found. Each village was ruled by its chief according to ancient customary laws. He well describes the severity of the winters. In summer the climate in some places is like that of Italy or Spain. Much of Armenia is extremely fertile, producing large herds of horses and cattle, abundant crops of cereals, olives and fruit. It is rich in minerals, and is probably the home of the rose and the vine.<P>LITERATURE.<P>Minas Gaphamatzean; Garagashean; Palasanean; Entir Chatouadsner, I; Rawlinson, Seven Anc. Monarchies; Strabo; Xenophon; Petermann, Mittheilungen for 1871; Bryce, Transcaucasia and Ararat.<P>II. Ancient History.<P>1. Turanian Armenians:<P>The country is first mentioned in <a onClick="return mV(\'Gen\',8,4);">Ge 8:4</a> as the land upon (some one of) the mountains of which Noah\'s Ark rested. (According to Jewish tradition this was one of the Kurdish mountains.) It is next spoken of by Sargon I of Agade, circa 3800 BC, as among his conquests. In early Babylonian legends Armenia figures as an almost unknown land far to the north, full of high mountains and dense forests, containing the entrance to the Lower World (Mad Nu-ga, "Land of No Return"). On its borders stood Mt. Nisir where the gods dwelt and Cit-napistim\'s "ship" stopped. This "Mountain of the World" was the present Jabal Judi, south of Lake Van. Next came Egyptian influence. Thothmes III, in his twenty-third year (circa 1458 BC), after a great victory over the Rutennu or Ludennu (Mesopotamians and Lydians), received the submission of the "chiefs of Ermenen" and others. It is remarkable that the name by which the land is still known to foreigners (Armenians call it Chaiastan) should occur so early. In his thirty-third year, Thothmes III mentions the people of Ermenen as paying tribute when he held his court at Nineveh, and says that in their land "heaven rests upon its four pillars." In Seti I\'s Hall of Columns at Karnak we see the people of Ermenen felling trees in order to open a way through their forests for that king\'s armies. Rameses II in his twenty-first year, in war with Kheta-sira, king of the Hittites, probably subdued Armenia (compare Tacitus Ann. ii.60). Many places conquered by Rameses III, and mentioned in the Medinet Habu lists, were probably in Armenia.<P>The Assyrian king Uras-Pal-acur (circa 1190-1170 BC) made a raid into Armenia, and mentions the central district (Urartu proper, near Lake Van), the land of the Manna (Minni, <a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a>), Nahri ("the Rivers"), Ashguza (Ashkenaz, ib), etc. Another invader was Tiglath-pileser I (circa 1110-1090 BC). Asshut-nacir-pal in 883 BC advanced to Urartu. A little later he mentions as articles of Armenian tribute chariots, horses, mules, silver, gold, plates of copper, oxen, sheep, wine, variegated cloths, linen garments. Again and again he carried fire and sword through the country, but it constantly revolted. Under Shalmaneser II (860-825 BC) and afterward for centuries wars continued. By uniting and forming powerful kingdoms (of which the principal was Biainash around Lake Van) the Armenians resisted. Finally in 606 BC they took part in the destruction of Nineveh, and in that of Babylon later. Shalmaneser II tells of the wickerwork coracles on Lake Van. The Balawat bronzes depict Armenians dressed like the Hittites (to whom they were sometimes subject) in tunics and snow-shoes with turned-up and pointed ends, wearing helmets, swords, spears and small round shields. Sayce compares their faces in form to the Negro type. Possibly they were Mongolians.<P>The founder of the kingdom of Biainash was Sardurish I, about 840 BC, who built as his capital Tushpash, now Van. He ruled most of Armenia, defending it against the Assyrians, and apparently, inflicting a check on Shalmaneser II in 833 BC. He introduced the cuneiform characters, and his inscriptions are in Assyrian. His son Ishpuinish adapted the Assyrian syllabary to his own tongue, which bears a slight resemblance to Georgian in some points. The next king, Menuash, has left inscriptions almost all over Armenia, telling of his victories over the Hittites, etc. The kingdom of Biainash reached its acme under the great monarch Argishtish I, who succeeded in defending his country against Shalmaneser III (783-772 BC). But in his son\'s reign Tiglath-pileser IV (748-727 BC: Pul) crushed the Armenians to the dust in a great battle near Commagene in 743. Pul failed to capture Van in 737, but he ravaged the country far and wide. Rusash I, at the head of an Armenian confederacy, began a great struggle in 716 with Sargon (722-705), who in 714 captured Van with Rusash\'s family.<P>After 5 months\' wandering Rusash committed suicide. His brother Argishtish II to some degree recovered independence. His successor Erimenash gave an asylum to Adrammelech and Sharezer (Assur-sar-ucur) in 680 (<a onClick="return mV(\'2Ki\',19,37);">2Ki 19:37</a>; <a onClick="return mV(\'Isa\',37,38);">Isa 37:38</a>) after the murder of their father Sennacherib. Invading Assyria in the same year, they were defeated by Esar-haddon I. Armenia from the Cyrus River to the south of Lake Van was ravaged by the Kimmerians (679-677). Rusash II (circa 660-645) and his son Sandurish III (the latter circa 640 or soon after) submitted to Ashurbanipal (668-626). Nebuchadnezzar (604-561) boasts of reaching Van in his conquests, though the Armenians had probably their share in the destruction of Nineveh in 606. Jeremiah (<a onClick="return mV(\'Jer\',51,27);">51:27</a>) mentioned the kingdoms of Ararat, Minni and Ashkenaz about 595, and said they would help in the overthrow of Babylon (in 538). Cyrus had therefore probably subdued or won them over after capturing Ekbatana (549). After this the Turanians gradually gave place in Armenia to the Aryan Armenians of later times.<P>Their Religion.<P>The supreme god of the Turanian Armenians was Chaldish, who was father of all the rest. They were styled "children of mighty Chaldish." He, with Teishbash, god of the atmosphere, and Ardinish, the Sun-god, formed "the company of the mighty gods." Auish, god of water; Ayash, god of the earth; Shelardish, the Moon-god; Sardish, the Year-god; and 42 other gods are mentioned. Sari was a goddess, probably corresponding to Ishtar. Adoration was offered to the spirits of the dead also. Somewhat strangely, some of the divine names we have mentioned remind one of certain Aryan (Greek and Old Pers) words, however this may be accounted for.<P>LITERATURE.<P>Valdemar Schmidt, Assyriens og AEgyptens Gamle Historie; Maspero, Dawn of Civilization; Rawlinson, West. Asiat. Inscrs; Keilinschriftliche Bibliothek (Schrader, editor); Airarat, 1883; Sayce in Journal of the Royal Asiatic Society, new series, XIV; Records of the Past; Hastings, End of Religion and Ethics, I.<P>2. Aryan Armenians: History to 114 AD:<P>The ancestors of the present Armenians (who call themselves Chaik\'h, i.e. Pati-s, "Lords") may have settled in the country in the 8th century BC, when Sargon mentions a king of part of Armenia who bore the Aryan name Bagadatti (= Theodore). They came from Phrygia (Herod. vii.73), used the Phrygian dress and armor (Dion. of Halicarnassus; Eudoxius; Herod.) and spoke the same language (Herod. i.171). In the Bible they are called the "House of Togarmah" (<a onClick="return mV(\'Gen\',10,3);">Ge 10:3</a>; <a onClick="return mV(\'1Ch\',1,6);">1Ch 1:6</a>; <a onClick="return mV(\'Eze\',27,14);">Eze 27:14</a>; <a onClick="return mV(\'Eze\',38,6);">38:6</a>) and "Ashkenaz" (<a onClick="return mV(\'Gen\',10,3);">Ge 10:3</a>; <a onClick="return mV(\'1Ch\',1,6);">1Ch 1:6</a>; <a onClick="return mV(\'Jer\',51,27);">Jer 51:27</a>; the Assyrian Ashguza), as by their own writers of later times. Xenophon in the Cyropedia mentions a Median conquest of Armenia, Strabo their Median attire; yet Armenian girls could not understand Xenophon\'s Persian interpreter (Anab. iv.5). Three of the four Armenians mentioned by Darius have Aryan names. The Armenians joined the Median noble Fravartish in his revolt against Darius I (519 BC). Much of the consequent fighting took place in Armenia, which was with difficulty subdued (517). It formed part of Darius\' thirteenth Nome, and afterward two satrapies (apparently Armenia Major and Minor). The government (of Armenia Major) was made hereditary in the family of Vidarna (Hydarnes) for helping to put down Fravartish. Xenophon\'s interesting description of the country and people and the severity of its winters is well known.<P>Herodotus tells of Armenians in skin and wicker-work coracles bringing wine, etc., to Babylon. Xenophon says they and the Chaldeans traded with India. Strabo mentions their caravan trade across central Asia. The satrap of Armenia had to present 20,000 young horses annually to the king of Persia at the great annual festival of Mithra. A large body of Armenian soldiers served in Xerxes\' invasion of Greece. At the battle of Arbela (331 BC), 40,000 of their infantry and 7,000 cavalry took part. Armenia then became a portion of Alexander\'s empire, and later of that of Seleucus (301 BC), under a native satrap, Artavasdes. Armenia revolted after Antiochus\' defeat at Magnesia (190 BC), and the Romans encouraged the two satraps to declare themselves kings. Artaxias, king of Armenia Major, used Hannibal\'s aid in fortifying his capital Artaxata (189 BC). Artaxias was overthrown by Antiochus Epiphanes in 165, but was restored on swearing allegiance. Civil confusion ensued. The nobles called in the Parthians under Mithridates I (150 BC), who became master of the whole Persian empire. He made his brother Valarsaces king of Armenia. Thus the Arsacide dynasty was established in that country and lasted till the fall of the Parthian empire (226 AD), the Armenian kings very generally recognizing the Parthian monarchs as their suzerains.<P>The greatest Armenian king was Tigranes I. (96-55 BC), a warrior who raised Armenia for a time to the foremost position in Asia. He humbled the Parthians, joined Mithridates VI in war with Rome, ruled Syria for over 14 years, built near Mardin as his capital Tigranocerta, and assumed the Assyrio-Persian title of "King of Kings." Lucullus defeated Tigranes and destroyed Tigranocerta in 69 BC. Tigranes surrendered to Pompey near Artaxata (66 BC), paid 6,000 talents, and retained only Armenia. Under him Greek art and literature flourished in the country. Armenia as a subjectally of Rome became a "buffer state" between the Roman and Parthian empires. Tigranes\' son and successor Artevasdes joined in the Parthian invasion of Syria after Crassus\' overthrow at Sinnaca 53 BC. He treacherously caused great loss to Antony\'s army in 36 BC. Antony carried him in chains to Egypt, where Cleopatra put him to death in 32 BC. After this, Armenia long remained subject to the Romans whenever not strong enough to join the Parthians, suffering much from intrigues and the jealousy of both powers. There is no proof of the later Armenian story that Armenia was subject to Abgarus, king of Edessa, in our Lord\'s time, and that the gospel was preached there by Thaddaeus, though the latter point is possible. In 66 AD, Tiridates, elder brother of the Parthian king Vologeses, having defeated the Romans under Paetus and established himself on the throne of Armenia, went by land to Rome and received investiture from Nero. Peace between Rome and Parthia ensued, and Armenia remained closely united to Parthia till Trajan\'s expedition in 114 AD.<P>LITERATURE.<P>Spiegel, Altpers. Keilinschriften; Herodotus; Xenophon; Arrian; Tacitus; Velleius Patroculus; Livy; Polybius; Ammianus Marcellinus.``175';
isbe[743]='Armenian Versions, of the Bible`ar-me\'-ni-an vur\'-shuns, bi\'-bl.<P><b>I. ANCIENT ARMENIAN</b><P class="in15">1. Circumstances under Which Made<P class="in15">2. The Translators<P class="in30">Apocrypha Omitted<P class="in15">3. Revision<P class="in15">4. Results of Circulation<P class="in15">5. Printed Editions<P><b>II. MODERN ARMENIAN VERSIONS</b><P class="in15">1. Ararat-Armenian<P class="in15">2. Constantinopolitan-Armenian<P><b>III. ARMENIAN LANGUAGE</b><P><b>LITERATURE</b><hr /><P>I. Ancient Armenian.<P>1. Circumstances under Which Made:<P>Armenia was in large measure Christianized by Gregory Lousavorich ("the Illuminator": consecrated 302 AD; died 332), but, as Armenian had not been reduced to writing, the Scriptures used to be read in some places in Greek, in others in Syriac, and translated orally to the people. A knowledge of these tongues and the training of teachers were kept up by the schools which Gregory and King Tiridates had established at the capital Vagharshapat and elsewhere. As far as there was any Christianity in Armenia before Gregory\'s time, it had been almost exclusively under Syrian influence, from Edessa and Samosata. Gregory introduced Greek influence and culture, though maintaining bonds of union with Syria also.<P>When King Sapor of Persia became master of Armenia (378 AD), he not only persecuted the Christians most cruelly, but also, for political reasons, endeavored to prevent Armenia from all contact with the Byzantine world. Hence his viceroy, the renegade Armenian Merouzhan, closed the schools, proscribed Greek learning, and burnt all Greek books, especially the Scriptures. Syriac books were spared, just as in Persia itself; but in many cases the clergy were unable to interpret them to their people. Persecution had not crushed out Christianity, but there was danger lest it should perish through want of the Word of God. Hence several attempts were made to translate the Bible into Armenian. It is said that Chrysostom, during his exile at Cucusus (404-407 AD), invented an Armenian alphabet and translated the Psalter, but this is doubtful. But when Arcadius ceded almost all Armenia to Sapor about 396 AD, something had to be done. Hence in 397 the celebrated Mesrob Mashtots and Isaac (Sachak) the Catholicos resolved to translate the Bible. Mesrob had been a court secretary, and as such was well acquainted with Pahlavi, Syriac and Greek, in which three languages the royal edicts were then published. Isaac had been born at Constantinople and educated there and at Caesarea. Hence he too was a good Greek scholar, besides being versed in Syriac and Pahlavi, which latter was then the court language in Armenia. But none of these three alphabets was suited to express the sounds of the Armenian tongue, and hence, an alphabet had to be devised for it.<P>2. The Translators:<P>A council of the nobility, bishops and leading clergy was held at Vagharshapat in 402, King Vramshapouch being present, and this council requested Isaac to translate the Scriptures into the vernacular. By 406, Mesrob had succeeded in inventing an alphabet—practically the one still in use—principally by modifying the Greek and the Pahlavi characters, though some think the Palmyrene alphabet had influence. He and two of his pupils at Samosata began by translating the Book of Proverbs, and then the New Testament, from the Greek Meanwhile, being unable to find a single Greek manuscript in the country, Isaac translated the church lessons from the Peshitta Syriac, and published this version in 411. He sent two of his pupils to Constantinople for copies of the Greek Bible. These men were present at the Council of Ephesus, 431 AD. Probably Theodoret (De Cura Graec. Affect., I, 5) learned from them what he says about the existence of the Bible in Armenian. Isaac\'s messengers brought him copies of the Greek Bible from the Imperial Library at Constantinople—doubtless some of those prepared by Eusebius at Constantine\'s command. Mesrob Mashtots and Isaac, with their assistants, finished and published the Armenian (ancient) version of the whole Bible in 436. La Croze is justified in styling it Queen of versions Unfortunately the Old Testament was rendered (as we have said) from the Septuagint, not from the Hebrew. But the Apocrypha was not translated, only "the 22 Books" of the Old Testament, as Moses of Khorene informs us. This was due to the influence of the Peshitta Old Testament.<P>Apocrypha Omitted.<P>Not till the 8th century was the Apocrypha rendered into Armenian: it was not read in Armenian churches until the 12th. Theodotion\'s version of Daniel was translated, instead of the very inaccurate Septuagint. The Alexandrine text was generally followed but not always.<P>3. Revision:<P>In the 6th century the Armenian version is said to have been revised so as to agree with the Peshitta. Hence, probably in <a onClick="return mV(\'Mat\',28,18);">Mt 28:18</a> the King James Version, the passage, "As my Father hath sent me, even so send I you," is inserted as in the Peshitta, though it occurs also in its proper place (<a onClick="return mV(\'Jhn\',20,21);">Joh 20:21</a>). It reads "Jesus Barabbas" in <a onClick="return mV(\'Mat\',27,16,17);">Mt 27:16-17</a>—a reading which Origen found "in very ancient manuscripts." It contains <a onClick="return mV(\'Luk\',22,43,44);">Lu 22:43-44</a>. As is well known, in the Etschmiadzin manuscript of 986 AD, over <a onClick="return mV(\'Mar\',16,\'9-20\');">Mr 16:9-20</a>, are inserted the words, "of Ariston the presbyter"; but Nestle (Text. Criticism of the Greek New Testament, Plate IX, etc.) and others omit to notice that these words are by a different and a later hand, and are merely an unauthorized remark of no great value.<P>4. Results of Circulation:<P>Mesrob\'s version was soon widely circulated and became the one great national book. Lazarus Pharpetsi, a contemporary Armenian historian, says he is justified in describing the spiritual results by quoting Isaiah and saying that the whole land of Armenia was thereby "filled with the knowledge of the Lord as the waters cover the sea." But for it, both church and nation would have perished in the terrible persecutions which have now lasted, with intervals, for more than a millennium and a half.<P>5. Printed Editions:<P>This version was first printed somewhat late: the Psalter at Rome in 1565, the Bible by Bishop Oskan of Erivan at Amsterdam in 1666, from a very defective MS; other editions at Constantinople in 1705, Venice in 1733. Dr. Zohrab\'s edition of the New Testament in 1789 was far better. A critical edition was printed at Venice in 1805, another at Serampore in 1817. The Old Testament (with the readings of the Hebrew text at the foot of the page) appeared at Constantinople in 1892ff.<P>II. Modern Armenian Versions.<P>There are two great literary dialects of modern Armenian, in which it was necessary to publish the Bible, since the ancient Armenian (called Grapar, or "written") is no longer generally understood. The American missionaries have taken the lead in translating Holy Scripture into both.<P>1. Ararat-Armenian:<P>The first version of the New Testament into Ararat Armenian, by Dittrich, was published by the British and Foreign Bible Society at Moscow in 1835; the Psalter in 1844; the rest of the Old Testament much later. There is an excellent edition, published at Constantinople in 1896.<P>2. Constantinopolitan-Armenian:<P>A version of the New Testament into Constantinopolitan Armenian, by Dr. Zohrab, was published at Paris in 1825 by the British and Foreign Bible Society. This version was made from the Ancient Armenian. A revised edition, by Adger, appeared at Smyrna in 1842. In 1846 the American missionaries there published a version of the Old Testament. The American Bible Society have since published revised editions of this version.<P>III. Armenian Language.<P>The Armenian language is now recognized by philologists to be, not a dialect or subdivision of ancient Persian or Iranian, but a distinct branch of the Aryan or Indo-European family, standing almost midway between the Iranian and the European groups. In some respects, especially in weakening and ultimately dropping "t" and "d" between vowels, it resembles the Keltic tongues (compare Gaelic A (th)air, Arm. Chair = Pater, Father). As early as the 5th century it had lost gender in nouns, though retaining inflections (compare Brugmann, Elements of Comp. Greek of Indo-German Languages).<P>LITERATURE.<P>Koriun; Agathangelos; Lazarus Pharpetsi; Moses Khorenatsi (= of Chorene); Faustus Byzantinus; Chhamchheants; Chaikakan Hin Dprouthian Patm; Chaikakan Thargmanouthiunk\'h Nak\'hneants; The Bible of Every Land; Tisdall, Conversion of Armenia; Nestle, Textual Criticism of the Greek New Testament; Hastings, Dictionary of the Bible (five volumes); N.Y. Cyclopaedia of Biblical. and Theol. Lit.; Hauck, Real-encyklopadie fur protest. Theol. und Kirche.``175';
isbe[744]='Armenian; Aryan; Religion`ar-me\'-ni-an, ar\'-i-an. This greatly resembled that of Persia, though Zoroastrianism and its dualistic system were not professed. We are thus enabled to judge how far the religion of the Avesta is due to Zoroaster\'s reformation. Aramazd (Ahura Mazda), creator of heaven and earth, was father of all the chief deities. His spouse was probably Spandaramet (Spenta Armaiti), goddess of the earth, who was later held to preside over the underworld (compare Persephone; Hellenistic). Among her assistants as genii of fertility were Horot and Morot (Haurvatat and ameretat), tutelary deities of Mt. Massis (now styled Ararat). Aramazd\'s worship seems to have fallen very much into the background in favor of that of inferior deities, among the chief of whom was his daughter Anahit (Anahita), who had temples in many places. Her statues were often of the precious metals, and among her many names were "Golden Mother" and "Goddess of the Golden Image."<P>Hence to the present day the word "Golden" enters into many Armenian names. White heifers and green boughs were offered her as goddess of fruitfulness, nor was religious prostitution in her honor uncommon. Next in popularity came her sister Astghik ("the little star"), i.e. the planet Venus, goddess of beauty, wife of the deified hero Vahagn (Verethraghna). He sprang from heaven, earth, and sea, and overthrew dragons and other evil beings. Another of Anahit\'s sisters was Nane (compare Assyrian Nana, Nannaea), afterward identified with Athene. Her brother Mihr (Mithra) had the sun as his symbol in the sky and the sacred fire on earth, both being objects of worship. In his temples a sacred fire was rekindled once a year. Aramazd\'s messenger and scribe was Tiur or Tir, who entered men\'s deeds in the "Book of Life." He led men after death to Aramazd for judgment. Before birth he wrote men\'s fates on their foreheads. The place of punishment was Dzhokhk\'h (= Persian Duzakh). To the sun and moon sacrifices were offered on the mountain-tops. Rivers and sacred springs and other natural objects were also adored. Prayer was offered facing eastward. Omens were taken from the rustling of the leaves of the sacred Sonean forest. Armavir was the religious capital.<P>Among inferior spiritual existences were the Arlezk\'h, who licked the wounds of those slain in battle and restored them to life. The Parikk\'h were evidently the Pairakas (Peris) of Persia. The Armenian mythology told of huge dragons which sometimes appeared as men, sometimes as worms, or basilisks, elves, sea-bulls, dragon-lions, etc. As in Persia, the demons made darts out of the parings of a man\'s nails to injure him with. Therefore these parings, together with teeth and trimmings of hair, must be hidden in some sacred place.<P>LITERATURE.<P>Eznik Goghbatzi; Agathangelos; Moses of Khorene; Eghishe; Palasanean; Faustus Byzantinus; Chhamchheantz; Plutarch; Strabo; Tacitus. See my "Conversion of Armenia," R.T.S.; The Expositor T, II, 202ff.``175';
isbe[745]='Armhole`arm\'-hol: The Hebrew word \'atstsil, is used in <a onClick="return mV(\'Jer\',38,12);">Jer 38:12</a> in the sense of armpits. When the prophet was pulled up out of the pit by ropes, the armpits were protected with rags and old garments. The meaning in <a onClick="return mV(\'Eze\',13,18);">Eze 13:18</a> the King James Version (the Revised Version (British and American) "elbows," the Revised Version, margin "joints of the hands") is far from clear. The phrase is used, without doubt, of some ornament or article of dress worn by the false prophetesses and priestesses of Ashtaroth in order to allure the unwary and tempt the simple. The "pillows" were probably "amulets" supposed to have magical virtues, and worn on the arms or wrists.``34';
isbe[746]='Armlet`arm\'-let: The word translated "bracelet" in <a onClick="return mV(\'2Sa\',1,10);">2Sa 1:10</a> the King James Version, probably denotes an "armlet," or "arm-band," worn on the upper arm. But it is the same word which with a different context is rendered "ankle- chains" (in <a onClick="return mV(\'Num\',31,50);">Nu 31:50</a> the Revised Version (British and American)). The "bracelet" of Sirach 21:21 the King James Version, worn upon the right arm, was an "armlet," as is seen from the list given of Judith\'s ornaments: who "decked herself bravely with her armlets (the Revised Version (British and American) \'chains\') and her bracelets, and her rings, and her ear-rings, and all her ornaments" (Judith 10:4). The nature of the ornaments given in the Revised Version (British and American) as "armlets," <a onClick="return mV(\'Exd\',35,22);">Ex 35:22</a>; <a onClick="return mV(\'Num\',31,50);">Nu 31:50</a>, and in the King James Version as "tablets," is uncertain. For full and distinguishing, descriptions of "arm-lets," "anklets," "bracelets," etc., found in ancient graves, see PEFS, 1905, 318f.`<a href="./study/isbe/search.html?string=ORNAMENT">ORNAMENT</a>`47';
isbe[747]='Armoni`ar-mo\'-ni (\'armoni, "belonging to the palace"): One of the two sons of Saul by Rizpah, the daughter of Aiah (<a onClick="return mV(\'2Sa\',21,8);">2Sa 21:8</a>). David delivered them over to the blood vengeance of the Gibeonites.``1';
isbe[748]='Armor-Bearer`ar\'-mer-bar\'-er (nose\' keli; Greek uses a phrase, ho airon ta skeue, literally "the one carrying the armor"): One who carried the large shield and perhaps other weapons for a king (<a onClick="return mV(\'1Sa\',31,4);">1Sa 31:4</a>), commander-in-chief (<a onClick="return mV(\'2Sa\',23,37);">2Sa 23:37</a>), captain (<a onClick="return mV(\'1Sa\',14,7);">1Sa 14:7</a>) or champion (<a onClick="return mV(\'1Sa\',17,7);">1Sa 17:7</a>). All warriors of distinction had such an attendant. Rather than perish by the hand of a woman, Abimelech called upon his armor-bearer to give him the finishing stroke (<a onClick="return mV(\'Jdg\',9,54);">Jud 9:54</a>), and when King Saul\'s armor-bearer refused to do this office for him that he might not become the prisoner of the Philistines, he took a sword himself and fell upon it (<a onClick="return mV(\'1Sa\',31,4);">1Sa 31:4</a>). David became Saul\'s armor-bearer for a time, and Jonathan\'s armor-bearer was a man of resource and courage (<a onClick="return mV(\'1Sa\',14,7);">1Sa 14:7</a>). The shield-bearer was a figure well known in the chariots of Egypt and Assyria and the Hittites, his business being to protect his fighting companion during the engagement.``128';
isbe[749]='Armor; Arms`ar\'-mer, arms.<P><b>I. ARMOR IN GENERAL—OLD TESTAMENT</b><P><b>II. IN THE NEW TESTAMENT; POLYBIUS</b><P><b>III. OFFENSIVE WEAPONS</b><P class="in15">1. Rod<P class="in15">2. Sling<P class="in15">3. Bow and Arrows<P class="in15">4. Spear—Javelin<P class="in15">5. Sword<P><b>IV. DEFENSIVE WEAPONS</b><P class="in15">1. Shield<P class="in15">2. Helmet<P class="in15">3. Coat of Mail<P class="in15">4. Greaves<P class="in15">5. Girdle<P><b>LITERATURE</b><hr /><P>I. Armor in General—Old Testament.<P>(maddim; <a onClick="return mV(\'1Sa\',17,38);">1Sa 17:38</a>; <a onClick="return mV(\'1Sa\',14,1);">1Sa 14:1</a> the Revised Version (British and American) <a href="./study/isbe/search.html?string=APPAREL">APPAREL</a>; nesheq, <a onClick="return mV(\'1Ki\',10,25);">1Ki 10:25</a>; <a onClick="return mV(\'Job\',39,21);">Job 39:21</a>; kelim; ta hopla): Under this head it may be convenient to notice the weapons of attack and defense in use among the Hebrews, mentioned in Scripture. There are no such descriptions given by the sacred writers as are to be found in Homer, who sets forth in detail the various pieces of armor worn by an Achilles or a Patroclus, and the order of putting them on. There is an account of the armor offensive and defensive of the Philistine Goliath (<a onClick="return mV(\'1Sa\',17,\'5-7\');">1Sa 17:5-7</a>); and from a much later time we read of shields and spears and helmets and habergeons, or coats of mail, and bows and slings with which Uzziah provided his soldiers (<a onClick="return mV(\'2Ch\',26,14);">2Ch 26:14</a>). In Jeremiah\'s ode of triumph over the defeat of Pharaoh-neco, there is mention of the arms of the Egyptians: "Prepare ye the buckler and shield, and draw near to battle. Harness the horses, and get up, ye horsemen, and stand forth with your helmets; furbish the spears, put on the coats of mail" (<a onClick="return mV(\'Jer\',46,3,4);">Jer 46:3-4</a>). Of the arms of Assyrian, Chaldean, Egyptian and Hittite soldiery there have come down to us sculptured representations from their ancient monuments, which throw light upon the battlepieces of the Hebrew historians and prophets.<P>II. In the New Testament; Polybius.<P>In the New Testament, Paul describes the panoply of the Christian soldier, naming the essential pieces of the Roman soldier\'s armor—the girdle, the breastplate, the footgear, the shield, the helmet, the sword—although it is to be noticed that his most characteristic weapon, the pilum or spear, is omitted (<a onClick="return mV(\'Eph\',6,\'10-17\');">Eph 6:10-17</a>). In a similar context the same apostle speaks of "the armor" of light (<a onClick="return mV(\'Rom\',13,12);">Ro 13:12</a>), "of righteousness on the right hand and on the left" (<a onClick="return mV(\'2Cr\',6,7);">2Co 6:7</a>). Of the equipment of the Roman soldier in detail, the most useful illustration is the account given by Polybius (vi.23): "The Roman panoply consists in the first place of a shield (thureos)....Along with the shield is a sword (machaira)....Next come two javelins (hussoi) and a helmet (perikephalaia), and a greave (knemis). ..... Now the majority, when they have further put on a bronze plate, measuring a span every way, which they wear on their breasts and call a heart-guard (kardiophulax), are completely armed, but those citizens who are assessed at more than 10,000 drachmae wear instead, together with the other arms, cuirasses made of chain mail (halusidotous thorakas)."<P>III. Offensive Weapons.<P>1. Rod:<P>The commonest weapon in the hands of the shepherd youth of Palestine today is the rod (shebheT; rhabdos), a stick loaded at one end, which he carries in his hand, or wears attached to his wrist by a loop of string, ready for use. It is of considerable weight and is a formidable weapon whether used in self-defense or in attacking a foe. With such a weapon David may well have overcome the lion and the bear that invaded the fold. This shepherd\'s rod, while used for guidance, or comfort, or for numbering the flock (<a onClick="return mV(\'Psa\',23,4);">Ps 23:4</a>; <a onClick="return mV(\'Lev\',27,32);">Le 27:32</a>), was also a weapon with which to strike and punish (<a onClick="return mV(\'Psa\',2,9);">Ps 2:9</a>; <a onClick="return mV(\'Isa\',10,5,15);">Isa 10:5,15</a>). In this sense it has for a synonym matteh (<a onClick="return mV(\'Isa\',9,4);">Isa 9:4</a>; <a onClick="return mV(\'Eze\',7,11);">Eze 7:11</a>), and both came to have the derived meaning of spearheads (shebheT, <a onClick="return mV(\'2Sa\',18,14);">2Sa 18:14</a>; matteh, <a onClick="return mV(\'1Sa\',14,27);">1Sa 14:27</a>). They may have been the original of the maul or hammer (mephits, <a onClick="return mV(\'Pro\',25,18);">Pr 25:18</a>; <a onClick="return mV(\'Jer\',51,20);">Jer 51:20</a>, where Cyrus, as God\'s battle-axe, is to shatter Babylon and its inhabitants for the wrongs they have done to His people Israel).<P>2. Sling:<P>Scarcely less common and equally homely is the sling (qela\'; sphendone) (<a onClick="return mV(\'1Sa\',17,40);">1Sa 17:40</a>). It consists of plaited thongs, or of one strip of leather, made broad at the middle to form a hollow or pocket for the stone or other contents, the ends being held firmly in the hand as it is whirled loaded round the head, and one of them being at length let go, so that the stone may take its flight. It is used by the shepherd still to turn the straying sheep, and it can also be used with deadly effect as a weapon of war. The slingers (ha-qalla\'im, <a onClick="return mV(\'2Ki\',3,25);">2Ki 3:25</a>) belonged to the light infantry, like the archers. The Benjamites were specially skilled in the use of the sling, which they could use as well with their left hand as the right (<a onClick="return mV(\'Jdg\',20,16);">Jud 20:16</a>). The sling was a weapon in use in the armies of Egypt and Babylonia, and Jeremiah in a powerful figure makes the Lord say to Jerusalem in a time of impending calamity: "Behold, I will sling out the inhabitants of the land at this time" (<a onClick="return mV(\'Jer\',10,18);">Jer 10:18</a>; compare <a onClick="return mV(\'1Sa\',25,29);">1Sa 25:29</a>).<P>3. Bow and Arrows:<P>A very important offensive weapon in the wars of Israel was the bow (qesheth) and arrows (chitstsim), and the archers whether mounted or on foot formed a powerful element of the fighting forces of the Philistines, Egyptians and Assyrians (s.v. <a href="./study/isbe/search.html?string=ARCHERY">ARCHERY</a>; <a href="./study/isbe/search.html?string=BOW">BOW</a>).<P>4. Spear—Javelin:<P>The spear has various words to represent it.<P>(1) The chanith had a wooden staff or shaft of varying size and length with a head, or blade, of bronze, or, at a later time, of iron (<a onClick="return mV(\'1Sa\',17,7);">1Sa 17:7</a>). In the King James Version it is sometimes translated "javelin," but in the Revised Version (British and American) "spear" (see <a onClick="return mV(\'1Sa\',13,22);">1Sa 13:22</a>; <a onClick="return mV(\'1Sa\',18,11);">18:11</a>). Saul\'s spear, stuck in the ground, betokened the abode of the king for the time, just as today the spear in front of his tent marks the halting-place of the Bedouin Sheikh (<a onClick="return mV(\'1Sa\',22,6);">1Sa 22:6</a>; <a onClick="return mV(\'1Sa\',26,7);">26:7</a>). Nahum, describing the arms of the Assyrians, joins together the flashing sword and the glittering spear (<a onClick="return mV(\'Nah\',3,3);">Na 3:3</a>). The bearers of the chanith belonged to the heavy-armed troops.<P>(2) The romach, also translated in the King James Version "javelin," was of the character of a lance. It does not appear to have differed much from the chanith—they appear as synonyms in <a onClick="return mV(\'Joe\',3,10);">Joe 3:10</a>, where romach is used, and in <a onClick="return mV(\'Isa\',2,\'1-\');">Isa 2</a>, <a onClick="return mV(\'Isa\',4,\'1-\');">4</a> where chanith is used, of spears beaten into pruning hooks. It describes the Egyptian spear in <a onClick="return mV(\'Jer\',46,4);">Jer 46:4</a>. The bearers of the romach also belonged to the heavy-armed troops.<P>(3) The kidhon was lighter than either of the preceding and more of the nature of a javelin (gaison in the Septuagint, <a onClick="return mV(\'Jos\',8,18);">Jos 8:18</a> and Polybius vi.39, 3; <a onClick="return mV(\'Job\',41,29);">Job 41:29</a>; <a onClick="return mV(\'Jer\',6,23);">Jer 6:23</a>). (4) In the New Testament the word "spear" occurs only once and is represented by the Greek logche, the equivalent no doubt of chanith as above (<a onClick="return mV(\'Jhn\',19,34);">Joh 19:34</a>).<P>5. Sword:<P>The sword (cherebh) is by far the most frequently mentioned weapon in Scripture, whether offensive or defensive. The blade was of iron (<a onClick="return mV(\'1Sa\',13,19);">1Sa 13:19</a>; <a onClick="return mV(\'Joe\',3,10);">Joe 3:10</a>). It was hung from the girdle on the left side, and was used both to cut and to thrust. Ehud\'s sword (<a onClick="return mV(\'Jdg\',3,16);">Jud 3:16</a>) was double-edged and a cubit in length, and, as he was left-handed, was worn on his right thigh under his clothes. The sword was kept in a sheath (<a onClick="return mV(\'1Sa\',17,51);">1Sa 17:51</a>); to draw the sword was the signal for war (<a onClick="return mV(\'Eze\',21,3);">Eze 21:3</a>). Soldiers are "men who draw the sword." It is the flashing sword (<a onClick="return mV(\'Nah\',3,3);">Na 3:3</a>); the oppressing sword (<a onClick="return mV(\'Jer\',46,16);">Jer 46:16</a>); the devouring sword (<a onClick="return mV(\'2Sa\',18,8);">2Sa 18:8</a>; <a onClick="return mV(\'Jer\',12,12);">Jer 12:12</a>); the sword which drinks its fill of blood (<a onClick="return mV(\'Isa\',34,5,6);">Isa 34:5-6</a>). The sword of the Lord executes God\'s judgments (<a onClick="return mV(\'Jer\',47,6);">Jer 47:6</a>; <a onClick="return mV(\'Eze\',21,9,10);">Eze 21:9-10</a>f).<P>Figurative: In the highly metaphorical language of the prophets it stands for war and its attendant calamities (<a onClick="return mV(\'Jer\',50,\'35-37\');">Jer 50:35-37</a>; <a onClick="return mV(\'Eze\',21,28);">Eze 21:28</a>).<P>In the New Testament machaira is employed for sword in its natural meaning (<a onClick="return mV(\'Mat\',26,47,51);">Mt 26:47, 51</a>; <a onClick="return mV(\'Act\',12,2);">Ac 12:2</a>; <a onClick="return mV(\'Hbr\',11,34,37);">Heb 11:34, 37</a>). Paul calls the Word of God the sword of the Spirit (<a onClick="return mV(\'Eph\',6,17);">Eph 6:17</a>); and in the Epistle to Hebrews the Word of God is said to be sharper than any two-edged sword (<a onClick="return mV(\'Hbr\',4,12);">Heb 4:12</a>). As a synonym the word rhomphaia is used in the Apocrypha alone of the New Testament books, save for <a onClick="return mV(\'Luk\',2,35);">Lu 2:35</a>. It was the Thracian sword with large blade, and is classed by the ancients rather as a spear. The word is used frequently in the Septuagint like machaira to translate cherebh. In <a onClick="return mV(\'Rev\',1,16);">Re 1:16</a> the sharp two-edged sword of judgment, rhomphaia is seen in vision proceeding out of the mouth of the glorified Lord (compare <a onClick="return mV(\'Rev\',19,15);">Re 19:15</a>). Xiphos is still another word for sword, but it is found only in the Septuagint, and not in the New Testament.<P>IV. Defensive Weapons.<P>1. Shield:<P>The most ancient and universal weapon of defense is the shield. The two chief varieties are<P>(1) the tsinnah, Latin scutum, the large shield, worn by heavy-armed infantry, adapted to the form of the human body, being made oval or in the shape of a door; hence, its Greek name, thureos, from thura, a door; and<P>(2) the maghen, Latin clypeus, the light, round hand-buckler, to which pelte is the Greek equivalent. The two are often mentioned together (<a onClick="return mV(\'Eze\',23,24);">Eze 23:24</a>; <a onClick="return mV(\'Eze\',38,4);">38:4</a>; <a onClick="return mV(\'Psa\',35,2);">Ps 35:2</a>).<P>The tsinnah was the shield of the heavy-armed (<a onClick="return mV(\'1Ch\',12,24);">1Ch 12:24</a>); and of Goliath we read that his shield was borne by a man who went before him (<a onClick="return mV(\'1Sa\',17,7,41);">1Sa 17:7, 41</a>) The maghen could be borne by bowmen, for we read of men of Benjamin in Asa\'s army that bare shields and drew bows (<a onClick="return mV(\'2Ch\',14,8);">2Ch 14:8</a>). The ordinary material of which shields were made was wood, or wicker-work overlaid with leather. The wood-work of the shields and other weapons of Gog\'s army were to serve Israel for fuel for seven years (<a onClick="return mV(\'Eze\',39,9);">Eze 39:9</a>). The anointing of the shield (<a onClick="return mV(\'2Sa\',1,21);">2Sa 1:21</a>; <a onClick="return mV(\'Isa\',21,5);">Isa 21:5</a>) was either to protect it from the weather, or, more probably, was part of the consecration of the warrior and his weapons for the campaign. Solomon in his pride of wealth had 200 shields (tsinnoth) of beaten gold, and 300 targets (maghinnim) of beaten gold made for himself, and hung in the house of the forest of Lebanon (<a onClick="return mV(\'1Ki\',10,16,17);">1Ki 10:16-17</a>). They were only for show, and when Shishak of Egypt came up against Rehoboam and carried them off, Rehoboam replaced them with others of bronze (<a onClick="return mV(\'1Ki\',14,27);">1Ki 14:27</a>). On the march, the shield was strapped over the shoulder and kept in a cover, which was removed before the battle (<a onClick="return mV(\'Isa\',22,6);">Isa 22:6</a>). Both words are used of the mechanical device known to the Romans as the testudo employed by the besiegers of a city against the darts and stones and blazing torches thrown out by the besieged (<a onClick="return mV(\'Isa\',37,33);">Isa 37:33</a>; <a onClick="return mV(\'Eze\',26,8);">Eze 26:8</a>).<P>Figurative: Yahweh is spoken of as the Shield and Protector of His people—of Abraham (<a onClick="return mV(\'Gen\',15,1);">Ge 15:1</a>); of Israel (<a onClick="return mV(\'Deu\',33,29);">De 33:29</a>); of the Psalmist (<a onClick="return mV(\'Psa\',18,30);">Ps 18:30</a>; <a onClick="return mV(\'Psa\',35,2);">35:2</a>, and many other passages). In his description of the panoply of the Christian soldier, Paul introduces faith as the thureos, the large Greek-Roman shield, a defense by which he may quench all the fiery darts of the evil one.<P>2. Helmet:<P>The helmet, qobha\' or kobha\', seems to have been originally in the form of a skull-cap, and it is thus figured in representations of Hittites on the walls of Karnak in Egypt. In the earliest times it is found worn only by outstanding personages like kings and commanders. When King Saul armed David with his own armor he put a helmet of brass upon his head (<a onClick="return mV(\'1Sa\',17,38);">1Sa 17:38</a>). Uzziah at a later time provided his soldiers with helmets, as part of their equipment (<a onClick="return mV(\'2Ch\',26,14);">2Ch 26:14</a>). The men of Pharaoh-neco\'s army also wore helmets (<a onClick="return mV(\'Jer\',46,4);">Jer 46:4</a>), and the mercenaries in the armies of Tyre had both shield and helmet to hang up within her (<a onClick="return mV(\'Eze\',27,10);">Eze 27:10</a>). The materials of the helmet were at first of wood, linen, felt, or even of rushes; leather was in use until the Seleucid period when it was supplanted by bronze (1Macc 6:35); the Greek and Roman helmets both of leather and brass were well known in the Herodian period.<P>Figurative: Paul has the helmet, perikephalaia, for his Christian soldier (<a onClick="return mV(\'Eph\',6,17);">Eph 6:17</a>; <a onClick="return mV(\'1Th\',5,8);">1Th 5:8</a>). In the Septuagint perikephalaia occurs eleven times as the equivalent of the Hebrew term.<P>3. Coat of Mail:<P>Body armor for the protection of the person in battle is mentioned in the Old Testament and is well known in representations of Egyptian, Persian and Parthian warriors. The shiryon, translated "habergeon" in the King James Version, rendered in the Revised Version (British and American) "coat of mail," is part of the armor of Nehemiah\'s workers (<a onClick="return mV(\'Neh\',4,16);">Ne 4:16</a>), and one of the pieces of armor supplied by King Uzziah to his soldiers. (<a onClick="return mV(\'2Ch\',26,14);">2Ch 26:14</a>). Goliath was armed with a shiryon, and when Saul clad David in his own armor to meet the Philistine champion he put on him a coat of mail, his shiryon (<a onClick="return mV(\'1Sa\',17,5,38);">1Sa 17:5, 38</a>). Such a piece of body armor Ahab wore in the fatal battle of Ramoth-gilead (<a onClick="return mV(\'1Ki\',22,34);">1Ki 22:34</a>). In the battle of Bethsura in the Maccabean struggle the Syrian war-elephants were protected with breastplates, the word for which, thorax, represents the shiryon in the Septuagint (1Macc 6:43).<P>Figurative: Isaiah in a striking figure describes Yahweh as putting on righteousness for a coat of mail and salvation as a helmet, where thorax and perikephalaia are the Greek words of the Septuagint to render shiryon and kobha\'. It is from this passage (<a onClick="return mV(\'Isa\',59,17);">Isa 59:17</a>) that Paul obtains his "breastplate of righteousness" (<a onClick="return mV(\'Eph\',6,14);">Eph 6:14</a>).<P>4. Greaves:<P>Greaves (mitschah; knemides) are mentioned once in Scripture as part of the armor of Goliath (<a onClick="return mV(\'1Sa\',17,6);">1Sa 17:6</a>). They were of brass or leather, fastened by thongs round the leg and above the ankles.<P>5. Girdle:<P>The girdle (chaghorah; Greek zone) was of leather studded with nails, and was used for supporting the sword (<a onClick="return mV(\'1Sa\',18,4);">1Sa 18:4</a>; <a onClick="return mV(\'2Sa\',20,8);">2Sa 20:8</a>). See <a href="./study/isbe/search.html?string=GIRDLE">GIRDLE</a>.<P>Figurative: For figurative uses see under the separate weapons.<P>LITERATURE.<P>Nowack, Hebraische Archaeologie, I, 359-67; Benzinger, Herzog, RE, article "Kriegswesen bei den Hebraern"; McCurdy, HPM, I, II; Woods and Powell, The Hebrew Prophets for English Readers, I, II; G. M. Mackie, Bible Manners and Customs; Browne, Hebrew Antiquities, 40-46; corresponding articles in Kitto, Hastings, and other Bible dictionaries.``128';
isbe[750]='Armory`ar\'-mer-i:<P>(1) (\'otsar; thesauros): A storehouse (<a onClick="return mV(\'1Ki\',7,51);">1Ki 7:51</a>; <a onClick="return mV(\'Neh\',10,38);">Ne 10:38</a>), but employed figuratively of the stored-up anger of Yahweh which breaks forth in judgments (<a onClick="return mV(\'Jer\',50,25);">Jer 50:25</a>).<P>(2) (nesheq): Identical with Solomon\'s "house of the forest of Lebanon," the arsenal close to the temple (<a onClick="return mV(\'1Ki\',10,17);">1Ki 10:17</a>; <a onClick="return mV(\'Neh\',3,19);">Ne 3:19</a>; <a onClick="return mV(\'Isa\',22,8);">Isa 22:8</a>), in which were stored the shields and targets of beaten gold.<P>(3) (talpiyoth): A puzzling word rendered "armory" in our versions (<a onClick="return mV(\'Sgs\',4,4);">So 4:4</a>)—"the tower of David builded for an armory, whereon there hang a thousand bucklers, all shields of mighty men." the Revised Version margin renders "builded with turrets."``128';
isbe[751]='Army`ar\'-mi (chayil, "army," tsabha\', "host," ma\'arakhah, "army in battle array" gedhudh, "troop"):<P>1. The First Campaign of History<P>2. In the Wilderness<P>3. The Times after the Conquest<P>4. In the Early Monarchy<P>5. From the Time of Solomon Onward<P>6. Organization of the Hebrew Army<P>7. The Army in the Field<P>8. The Supplies of the Army<P>9. In the New Testament<hr /><P>The Israelites were not a distinctively warlike people and their glory has been won on other fields than those of war. But Canaan, between the Mediterranean and the desert, was the highway of the East and the battle-ground of nations. The Israelites were, by the necessity of their geographical position, often involved in wars not of their own seeking, and their bravery and endurance even when worsted in their conflicts won for them the admiration and respect of their conquerors.<P>1. The First Campaign of History:<P>The first conflict of armed forces recorded in Holy Scripture is that in <a onClick="return mV(\'Gen\',14,\'1-\');">Ge 14</a>. The kings of the Jordan valley had rebelled against Chedorlaomer, king of Elam—not the first of the kings of the East to reach the Mediterranean with his armies—and joined battle with him and other kings in the Vale of Siddim. In this campaign Abraham distinguished himself by the rescue of his nephew Lot, who had fallen with all that he possessed into the hands of the Elamite king. The force with which Abraham effected the defeat of Chedorlaomer and the kings that were with him was his own retainers, 318 in number, whom he had armed and led forth in person in his successful pursuit.<P>2. In the Wilderness:<P>When we first make the acquaintance of the Israelites as a nation, they are a horde of fugitives who have escaped from the bitter oppression and hard bondage of Pharaoh. Although there could have been but little of the martial spirit in a people so long and grievously oppressed, their journeyings through the wilderness toward Canaan are from the first described as the marching of a great host. It was according to their "armies" ("hosts" the Revised Version (British and American)) that Aaron and Moses were to bring the Children of Israel from the land of Egypt (<a onClick="return mV(\'Exd\',6,26);">Ex 6:26</a>). When they had entered upon the wilderness they went up "harnessed" ("armed" the Revised Version (British and American)) for the journeyings that lay before them—where "harnessed" or "armed" may point not to the weapons they bore but to the order and arrangements of a body of troops marching five deep (hamushshim) or divided into five army corps (<a onClick="return mV(\'Exd\',13,18);">Ex 13:18</a>).<P>On the way through the wilderness they encamped (<a onClick="return mV(\'Exd\',13,20);">Ex 13:20</a>; and passim) at their successive halting-places, and the whole army of 600,000 was, after Sinai, marked off into divisions or army corps, each with its own camp and the ensigns of their fathers\' houses (<a onClick="return mV(\'Num\',2,2);">Nu 2:2</a>). "From twenty years old and upward, all that are able to go forth to war in Israel," the males of the tribes were numbered and assigned to their place in the camp (<a onClick="return mV(\'Num\',1,3);">Nu 1:3</a>). Naturally, in the wilderness they are footmen (<a onClick="return mV(\'Num\',11,21);">Nu 11:21</a>), and it was not till the period of the monarchy that other arms were added. Bow and sling and spear and sword for attack, and shield and helmet for defense, would be the full equipment of the men called upon to fight in the desert. Although we hear little of gradations of military rank, we do read of captains of thousands and captains of hundreds in the wilderness (<a onClick="return mV(\'Num\',31,14);">Nu 31:14</a>), and Joshua commands the fighting men in the battle against the Amalekites at Rephidim (<a onClick="return mV(\'Exd\',17,9);">Ex 17:9</a>ff). That the Israelites acquired in their journeyings in the wilderness the discipline and martial spirit which would make them a warlike people, may be gathered from their successes against the Midianites, against Og, king of Bashan, toward the close of the forty years, and from the military organization with which they proceeded to the conquest of Canaan.<P>3. The Times after the Conquest:<P>In more than one campaign the Israelites under Joshua\'s leadership established themselves in Canaan. But it was largely through the enterprise of the several tribes after that the conquest was achieved. The progress of the invaders was stubbornly contested, but Joshua encouraged his kinsmen of Ephraim and Manasseh to press on the conquest even against the invincible war-chariots of the Canaanites—"for thou shalt drive out the Canaanites, though they have iron chariots, and though they are strong" (<a onClick="return mV(\'Jos\',17,18);">Jos 17:18</a>). As it was in the early history of Rome, where the defense of the state was an obligation resting upon every individual according to his stake in the public welfare, so it was at first in Israel. Tribal jealousies, however, impaired the sentiment of nationality and hindered united action when once the people had been settled in Canaan.<P>The tribes had to defend their own, and it was only a great emergency that united them in common action. The first notable approach to national unity was seen in the army which Barak assembled to meet the host of Jabin, king of Hazor, under the command of Sisera (<a onClick="return mV(\'Jdg\',4,5);">Jud 4:5</a>). In Deborah\'s war-song in commemoration of the notable victory achieved by Barak and herself, the men of the northern tribes, Zebulun, Naphtali, Issachar, along with warriors of Manasseh, Ephraim and Benjamin, are praised for the valor with which they withstood and routed the host—foot, horse and chariots—of Sisera. Once again the tribes of Israel assembled in force from "Da even to Beersheba, with the land of Gilead" (<a onClick="return mV(\'Jdg\',20,1);">Jud 20:1</a>) to punish the tribe of Benjamin for condoning a gross outrage. The single tribe was defeated in the battle that ensued, but they were able to put into the field "26,000 men that drew sword," and they had also "700 chosen men left-handed; every one could sling stones at a hair-breadth, and not miss" (<a onClick="return mV(\'Jdg\',20,15,16);">Jud 20:15-16</a>).<P>4. In the Early Monarchy:<P>Up to this time the fighting forces of the Israelites were more of the character of a militia. The men of the tribes more immediately harassed by enemies were summoned for action by the leader raised up by God, and disbanded when the emergency was past. The monarchy brought changes in military affairs. It was the plea of the leaders of Israel, when they desired to have a king, that he would go out before them and fight their battles (<a onClick="return mV(\'1Sa\',8,20);">1Sa 8:20</a>). Samuel had warned them that with a monarchy a professional soldiery would be required. "He will take your sons, and appoint them unto him, for his chariots, and to be his horsemen; and they shall run before his chariots; and he will appoint them unto him for captains of thousands, and captains of fifties; and he Will set some to plow his ground, and reap his harvest, and to make his instruments of war, and the instruments of his chariots" (<a onClick="return mV(\'1Sa\',8,11,12);">1Sa 8:11-12</a>). That this was the course which military reform took in the period following the establishment of the monarchy may well be. It fell to Saul when he ascended the throne to withstand the invading Philistines and to relieve his people from the yoke which they had already laid heavily upon some parts of the country.<P>The Philistines were a military people, well disciplined and armed, with 30,000 chariots and 6,000 horsemen at their service when they came up to Michmash (<a onClick="return mV(\'1Sa\',13,5);">1Sa 13:5</a>). What chance had raw levies of vinedressers and herdsmen from Judah and Benjamin against such a foe? No wonder that the Israelites hid themselves in caves and thickets, and in rocks, and in holes, and in pits (<a onClick="return mV(\'1Sa\',13,6);">1Sa 13:6</a>). And it is quoted by the historian as the lowest depth of national degradation that the Israelites had to go down to the Philistines "to sharpen every man his share, and his coulter, and his axe, and his mattock" (<a onClick="return mV(\'1Sa\',13,20);">1Sa 13:20</a>) because the Philistines had carried off their smiths to prevent them from making swords or spears.<P>It was in this desperate condition that King Saul was called to begin the struggle for freedom and national unity in Israel. The victories at Michmash and Elah and the hotly contested but unsuccessful and fatal struggle at Gilboa evince the growth of the martial spirit and advance alike in discipline and in strategy. After the relief of Jabesh- gilead, instead of disbanding the whole of his levies, Saul retained 3,000 men under arms, and this in all probability became the nucleus of the standing army of Israel (<a onClick="return mV(\'1Sa\',13,2);">1Sa 13:2</a>). From this time onward "when Saul saw any mighty man, or any valiant man, he took him unto him" (<a onClick="return mV(\'1Sa\',14,52);">1Sa 14:52</a>). Of the valiant men whom Saul kept round his person, the most notable were Jonathan and David. Jonathan had command of one division of 1,000 men at Gibeah (<a onClick="return mV(\'1Sa\',13,2);">1Sa 13:2</a>), and David was captain of the king\'s bodyguard (<a onClick="return mV(\'1Sa\',18,5);">1Sa 18:5</a>; compare <a onClick="return mV(\'1Sa\',18,13);">1Sa 18:13</a>). When David fell under Saul\'s jealousy and betook himself to an outlaw life in the mountain fastnesses of Judah, he gathered round him in the cave of Adullam 400 men (<a onClick="return mV(\'1Sa\',22,1,2);">1Sa 22:1-2</a>) who were ere long increased to 600 (<a onClick="return mV(\'1Sa\',23,1,3);">1Sa 23:1, 3</a>). From the story of Nabal (<a onClick="return mV(\'1Sa\',25,\'1-\');">1Sa 25</a>) we learn how a band like that of David could be maintained in service, and we gather that landholders who benefited by the presence of an armed force were expected to provide the necessary supplies. On David\'s accession to the throne this band of warriors remained attached to his person and became the backbone of his army.<P>We can identify them with the gibborim—the mighty men of whom Benaiah at a later time became captain (<a onClick="return mV(\'2Sa\',23,22,23);">2Sa 23:22-23</a>; <a onClick="return mV(\'1Ki\',1,8);">1Ki 1:8</a>) and who are also known by the name of Cherethites and Pelethites (<a onClick="return mV(\'2Sa\',8,18);">2Sa 8:18</a>). These may have received their name from their foreign origin, the former, in Hebrew kerethi being originally from Crete but akin to the Philistines; and the latter, in Hebrew pelethi being Philistines by birth. That there were foreign soldiers in David\'s service we know from the examples of Uriah the Hittite and Ittai of Gath. David\'s gibborim have been compared to the Praetorian Cohort of the Roman emperors, the Janissaries of the sultans, and the Swiss Guards of the French kings. Of David\'s army Joab was the commander-in-chief, and to the military\' genius of this rough and unscrupulous warrior, the king\'s near kinsman, the dynasty of David was deeply indebted.<P>5. From the Time of Solomon Onward:<P>In the reign of Solomon, although peace was its prevailing characteristic, there can have been no diminution of the armed forces of the kingdom, for we read of military expeditions against Edom and Syria and Hamath, and also of fortresses built in every part of the land, which would require troops to garrison them. Hazor, the old Canaanite capital, at the foot of Lebanon; Megiddo commanding the rich plain of Jezreel; Gezer overlooking the Philistine plain; the Bethhorons (Upper and Nether); and Tadmor in the wilderness; not to speak of Jerusalem with Millo and the fortified wall, were fortresses requiring strong garrisons (<a onClick="return mV(\'1Ki\',9,15);">1Ki 9:15</a>). It is probable that "the levy," which was such a burden upon the people at large, included forced military service as well as forced labor, and helped to create the dissatisfaction which culminated in the revolt of Jeroboam, and eventually in the disruption of the kingdom. Although David had reserved from the spoils of war in his victorious campaign against Hadadezer, king of Zobah, horses for 100 chariots (<a onClick="return mV(\'2Sa\',8,4);">2Sa 8:4</a>), cavalry and chariots were not an effective branch of the service in his reign. Solomon, however, disregarding the scruples of the stricter Israelites, and the ordinances of the ancient law (<a onClick="return mV(\'Deu\',17,16);">De 17:16</a>), added horses and chariots on a large scale to the military equipment of the nation (<a onClick="return mV(\'1Ki\',10,\'26-29\');">1Ki 10:26-29</a>). It is believed that it was from Musri, a country of Northern Syria occupied by the Hittites, and Kue in Cilicia, that Solomon obtained horses for his cavalry and chariotry (<a onClick="return mV(\'1Ki\',10,29);">1Ki 10:29</a>; <a onClick="return mV(\'2Ch\',1,16);">2Ch 1:16</a>, where the best text gives Mutsri, and not the Hebrew word for Egypt). This branch of the service was not only looked upon with distrust by the stricter Israelites, but was expressly denounced in later times by the prophets (<a onClick="return mV(\'Isa\',2,7);">Isa 2:7</a>; <a onClick="return mV(\'Hsa\',1,7);">Ho 1:7</a>; <a onClick="return mV(\'Mic\',5,10);">Mic 5:10</a>). In the prophets, too, more than in the historical books, we are made acquainted with the cavalry and chariotry of Assyria and Babylon which in the days of Sargon, Sennacherib, and Nebuchadnezzar had become so formidable. Their lancers and mounted archers, together with their chariots, gave them a sure ascendancy in the field of war (<a onClick="return mV(\'Nah\',3,2,3);">Na 3:2-3</a>; <a onClick="return mV(\'Hab\',1,8);">Hab 1:8</a>; <a onClick="return mV(\'Jer\',46,4);">Jer 46:4</a>). In comparison with these, the cavalry of the kings of Israel and Judah was insignificant, and to this Rabshakeh contemptuously referred (<a onClick="return mV(\'2Ki\',18,23);">2Ki 18:23</a>) when he promised to the chiefs of Judah from the king of Assyria 2,000 horses if Hezekiah could put riders upon them.<P>6. Organization of the Hebrew Army:<P>As we have seen, every male in Israel at the age of twenty, according to the ancient law, became liable for military service (<a onClick="return mV(\'Num\',1,3);">Nu 1:3</a>; <a onClick="return mV(\'Num\',26,2);">26:2</a>; <a onClick="return mV(\'2Ch\',25,5);">2Ch 25:5</a>), just as at a later time every male of that age became liable for the half-shekel of Temple dues. Josephus is our authority for believing that no one was called upon to serve after the age of fifty (Ant., III, xii, 4). From military service the Levites were exempt (<a onClick="return mV(\'Num\',2,33);">Nu 2:33</a>). In Deuteronomic law exemption was allowed to persons betrothed but not married, to persons who had built a house but had not dedicated it, or who had planted a vineyard but had not eaten of the fruit of it, and to persons faint-hearted and fearful whose timidity might spread throughout the ranks (<a onClick="return mV(\'Deu\',20,\'1-9\');">De 20:1-9</a>). These exemptions no doubt reach back to a high antiquity and in the Maccabean period they still held good (1Macc 3:56). The army was divided into bodies of 1,000, 100, 50, and in Maccabean times, 10, each under its own captain (Sar) (<a onClick="return mV(\'Num\',31,14);">Nu 31:14</a>; <a onClick="return mV(\'1Sa\',8,12);">1Sa 8:12</a>; <a onClick="return mV(\'2Ki\',1,9);">2Ki 1:9</a>; <a onClick="return mV(\'2Ch\',25,5);">2Ch 25:5</a>; 1Macc 3:55). In the army of Uzziah we read of "heads of fathers\' houses," mighty men of valor who numbered 2,600 and had under their hand a trained army of 307,500 men (<a onClick="return mV(\'2Ch\',26,12,13);">2Ch 26:12-13</a>), where, however, the figures have an appearance of exaggeration.<P>Over the whole host of Israel, according to the fundamental principle of theocracy, was Yahweh Himself, the Supreme Leader of her armies (<a onClick="return mV(\'1Sa\',8,7);">1Sa 8:7</a>f); it was "the Captain of the Lord\'s host," to whom Joshua and all serving under him owned allegiance, that appeared before the walls of Jericho to help the gallant leader in his enterprise. In the times of the Judges the chiefs themselves, Barak, Gideon, Jephthah, led their forces in person to battle. Under the monarchy the captain of the host was an office distinct from that of the king, and we have Joab, Abner, Benaiah, named as commanders-in-chief. An armor-bearer attended the captain of the host as well as the king (<a onClick="return mV(\'1Sa\',14,6);">1Sa 14:6</a>; <a onClick="return mV(\'1Sa\',31,4,5);">31:4-5</a>; <a onClick="return mV(\'2Sa\',23,37);">2Sa 23:37</a>). Mention is made of officers who had to do the numbering of the people, the copher, scribe, attached to the captain of the host (<a onClick="return mV(\'2Ki\',25,19);">2Ki 25:19</a>; compare <a onClick="return mV(\'2Sa\',24,2);">2Sa 24:2</a>; 1Macc 5:42), and the shoter, muster-master, who kept the register of those who were in military service and knew the men who had received authorized leave of absence (<a onClick="return mV(\'Deu\',20,5);">De 20:5</a>, Driver\'s note).<P>7. The Army in the Field:<P>Before the army set forth, religious services were held (<a onClick="return mV(\'Joe\',3,9);">Joe 3:9</a>), and sacrifices were offered at the opening of a campaign to consecrate the war (<a onClick="return mV(\'Mic\',3,5);">Mic 3:5</a>; <a onClick="return mV(\'Jer\',6,4);">Jer 6:4</a>; <a onClick="return mV(\'Jer\',22,7);">22:7</a>). Recourse was had in earlier times to the oracle (<a onClick="return mV(\'Jdg\',1,1);">Jud 1:1</a>; <a onClick="return mV(\'Jdg\',20,27);">20:27</a>; <a onCli
