isbe[3682]='Gate`gat (Hebrew normally (over 300 times) sha\'ar; occasionally deleth, properly, "gateway" (but compare <a onClick="return mV(\'Deu\',3,5);">De 3:5</a>); elsewhere the gateway is pethach (compare especially <a onClick="return mV(\'Gen\',19,6);">Ge 19:6</a>); Aramaic tera\'; Greek pulon, pule; the English Revised Version and the King James Version add caph, "threshold," in <a onClick="return mV(\'1Ch\',9,19,22);">1Ch 9:19, 22</a>; and the King James Version adds delathayim, "double-door," in <a onClick="return mV(\'Isa\',45,1);">Isa 45:1</a>; thura, "door," <a onClick="return mV(\'Act\',3,2);">Ac 3:2</a>):<P>(1) The usual gateway was provided with double doors, swung on projections that fitted into sockets in the sill and lintel. Ordinarily the material was wood (<a onClick="return mV(\'Neh\',2,3,17);">Ne 2:3, 17</a>), but greater strength and protection against fire was given by plating with metal (<a onClick="return mV(\'Psa\',107,16);">Ps 107:16</a>; <a onClick="return mV(\'Isa\',45,2);">Isa 45:2</a>). Josephus (BJ, V, v, 3) speaks of the solid metal doors of the Beautiful Gate (<a onClick="return mV(\'Act\',3,2);">Ac 3:2</a>) as a very exceptional thing. Some doors were solid slabs of stone, from which the imagery of single jewels (<a onClick="return mV(\'Isa\',54,12);">Isa 54:12</a>; <a onClick="return mV(\'Rev\',21,21);">Re 21:21</a>) was derived. When closed, the doors were secured with a bar (usually of wood, <a onClick="return mV(\'Nah\',3,13);">Na 3:13</a>, but sometimes of metal, <a onClick="return mV(\'1Ki\',4,13);">1Ki 4:13</a>; <a onClick="return mV(\'Psa\',107,16);">Ps 107:16</a>; <a onClick="return mV(\'Isa\',45,2);">Isa 45:2</a>), which fitted into clamps on the doors and sockets in the post, uniting the whole firmly (<a onClick="return mV(\'Jdg\',16,3);">Jud 16:3</a>). Sometimes, perhaps, a portcullis was used, but <a onClick="return mV(\'Psa\',24,7);">Ps 24:7</a> refers to the enlargement or enrichment of the gates. As the gate was especially subject to attack (<a onClick="return mV(\'Eze\',21,15,22);">Eze 21:15, 22</a>), and as to "possess the gate" was to possess the city (<a onClick="return mV(\'Gen\',22,17);">Ge 22:17</a>; <a onClick="return mV(\'Gen\',24,60);">24:60</a>), it was protected by a tower (<a onClick="return mV(\'2Sa\',18,24,33);">2Sa 18:24, 33</a>; <a onClick="return mV(\'2Ch\',14,7);">2Ch 14:7</a>; <a onClick="return mV(\'2Ch\',26,9);">26:9</a>), often, doubtless, overhanging and with flanking projections. Sometimes an inner gate was added (<a onClick="return mV(\'2Sa\',18,24);">2Sa 18:24</a>). Unfortunately, Palestine gives us little monumental detail.<P>(2) As even farm laborers slept in the cities, most of the men passed through the gate every day, and the gate was the place for meeting others (<a onClick="return mV(\'Rth\',4,1);">Ru 4:1</a>; <a onClick="return mV(\'2Sa\',15,2);">2Sa 15:2</a>) and for assemblages. For the latter purpose "broad" or open places (distinguished from the "streets" in <a onClick="return mV(\'Pro\',7,12);">Pr 7:12</a>) were provided (<a onClick="return mV(\'1Ki\',22,10);">1Ki 22:10</a>; <a onClick="return mV(\'Neh\',8,1);">Ne 8:1</a>), and these were the centers of the public life. Here the markets were held (<a onClick="return mV(\'2Ki\',7,1);">2Ki 7:1</a>), and the special commodities in these gave names to the gates (<a onClick="return mV(\'Neh\',3,1,3,18);">Ne 3:1, 3, 18</a>). In particular, the "gate" was the place of the legal tribunals (<a onClick="return mV(\'Deu\',16,18);">De 16:18</a>; <a onClick="return mV(\'Deu\',21,19);">21:19</a>; <a onClick="return mV(\'Deu\',25,7);">25:7</a>, etc.), so that a seat "among the elders in the gates" (<a onClick="return mV(\'Pro\',31,23);">Pr 31:23</a>) was a high honor, while "oppression in the gates" was a synonym for judicial corruption (<a onClick="return mV(\'Job\',31,21);">Job 31:21</a>; <a onClick="return mV(\'Pro\',22,22);">Pr 22:22</a>; <a onClick="return mV(\'Isa\',29,21);">Isa 29:21</a>; <a onClick="return mV(\'Amo\',5,10);">Am 5:10</a>). The king, in especial, held public audiences in the gate (<a onClick="return mV(\'2Sa\',19,8);">2Sa 19:8</a>; <a onClick="return mV(\'1Ki\',22,10);">1Ki 22:10</a>; <a onClick="return mV(\'Jer\',38,7);">Jer 38:7</a>; compare <a onClick="return mV(\'Jer\',39,3);">Jer 39:3</a>), and even yet "Sublime Porte" (the French translation of the Turkish for "high gate") is the title of the Court of Constantinople. To the gates, as the place of throngs, prophets and teachers went with their message (<a onClick="return mV(\'1Ki\',22,10);">1Ki 22:10</a>; <a onClick="return mV(\'Jer\',17,19);">Jer 17:19</a>; <a onClick="return mV(\'Pro\',1,21);">Pr 1:21</a>; <a onClick="return mV(\'Pro\',8,3);">8:3</a>; <a onClick="return mV(\'Pro\',31,31);">31:31</a>), while on the other hand the gates were the resort of the town good-for-nothings (<a onClick="return mV(\'Psa\',69,12);">Ps 69:12</a>).<P>(3) "Gates" can be used figuratively for the glory of a city (<a onClick="return mV(\'Isa\',3,26);">Isa 3:26</a>; <a onClick="return mV(\'Isa\',14,31);">14:31</a>; <a onClick="return mV(\'Jer\',14,2);">Jer 14:2</a>; <a onClick="return mV(\'Lam\',1,4);">La 1:4</a>; contrast <a onClick="return mV(\'Psa\',87,2);">Ps 87:2</a>), but whether the military force, the rulers or the people is in mind cannot be determined. In <a onClick="return mV(\'Mat\',16,18);">Mt 16:18</a> "gates of Hades" (not "hell") may refer to the hosts (or princes) of Satan, but a more likely translation is \'the gates of the grave (which keep the dead from returning) shall not be stronger than it.\' The meaning in <a onClick="return mV(\'Jdg\',5,8,11);">Jud 5:8, 11</a> is very uncertain, and the text may be corrupt.`<a href="./study/isbe/search.html?string=CITY">CITY</a>; <a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>; <a href="./study/isbe/search.html?string=TABERNACLE,+A">TABERNACLE</a>; <a href="./study/isbe/search.html?string=TEMPLE,+A1">TEMPLE</a>`48';
isbe[3683]='Gate, Corner, Fountain, Horse, Sur``<a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>`1';
isbe[3684]='Gate, East`The expressions are found in Ezekiel: "Even the gate that looketh toward the east" (<a onClick="return mV(\'Eze\',43,1);">43:1</a>); "The gate whose prospect is toward the east" (<a onClick="return mV(\'Eze\',43,4);">43:4</A>); but the idea of a gate on the eastern side as the principal entrance to the court of the sanctuary goes back to the days of the tabernacle (<a onClick="return mV(\'Exd\',27,\'13-16\');">Ex 27:13-16</a>). In addition to its use as admitting to the sanctuary enclosure, it may be presumed, in analogy with the general mode of the administration of justice, to have been the place where in earlier times cases were tried which were referred to the jurisdiction of the sanctuary (compare <a onClick="return mV(\'Exd\',18,\'19-22\');">Ex 18:19-22</a>; <a onClick="return mV(\'Deu\',17,8);">De 17:8</a>; <a onClick="return mV(\'Deu\',19,16,18);">19:16, 18</a>; <a onClick="return mV(\'Num\',27,2,3);">Nu 27:2-3</a>, etc.).<P>1. The Tabernacle:<P>In <a onClick="return mV(\'Exd\',27,\'13-16\');">Ex 27:13-16</a> the "gate" by which the congregation entered the tabernacle is carefully described. An embroidered screen of the three sacred colors (blue, purple and scarlet), 20 cubits in width, hung from 4 pillars (really 5 pillars, 5 cubits apart; on the reckoning see <a href="study/isbe/search.html?string=TABERNACLE,+A">TABERNACLE</A>), in the center of the east side of the tabernacle court. This is further alluded to in <a onClick="return mV(\'Num\',4,26);">Nu 4:26</a>, "the screen for the door of the gate of the court."<P>2. Solomon\'s Temple:<P>Nothing is said of the position of gates in connection with Solomon\'s temple, but there was an "inner" (<a onClick="return mV(\'1Ki\',6,36);">1Ki 6:36</a>), and also an "outer" or "great" court (<a onClick="return mV(\'2Ch\',4,9);">2Ch 4:9</a>), the latter with doors overlaid with brass, and analogy makes it certain that here also the chief gate (inner or outer court? see <a href="study/isbe/search.html?string=COURT">COURT</a>) was on the east side. Provision was made by Solomon in his adjoining palace for the administration of justice in a hall or "porch of judgment" (<a onClick="return mV(\'1Ki\',7,7);">1Ki 7:7</a>), but graver cases were still, apparently, referred for decision to the sanctuary (<a onClick="return mV(\'Jer\',26,10);">Jer 26:10</a>). The trial in Jeremiah\'s case, however, took place, not at the East gate, but at "the entry of the new gate of Yahweh\'s house" (<a onClick="return mV(\'Jer\',26,10);">Jer 26:10</a>; compare <a onClick="return mV(\'Jer\',36,10);">36:10</a>), probably Jotham\'s "upper gate" (<a onClick="return mV(\'2Ki\',15,35);">2Ki 15:35</a>).<P>3. Ezekiel\'s Temple:<P>In Ezekiel\'s ideal temple, "the gate whose prospect was toward the east" was that by which the glory of Yahweh went up from the city (<a onClick="return mV(\'Eze\',11,23);">Eze 11:23</a>), and by which the prophet in vision saw it return (<a onClick="return mV(\'Eze\',43,4);">Eze 43:4</a>).<P>4. Second Temple:<P>Nothing is told of an East gate in the temple of Zerubbabel, but it may be assumed that there was one as in the other cases.<P>5. Herod\'s Temple:<P>The great East gate of the Herodian temple, which followed those above mentioned, was that "Beautiful Gate of the temple" where the miracle of the healing of the lame man was performed (<a onClick="return mV(\'Act\',3,\'1-10\');">Ac 3:1-10</a>).`<a href="./study/isbe/search.html?string=GATE+THE+BEAUTIFUL">GATE, THE BEAUTIFUL</a>; <a href="./study/isbe/search.html?string=HARSITH">HARSITH</a>; <a href="./study/isbe/search.html?string=SHECANIAH;+SHECHANIAH ">SHECANIAH</a>`17';
isbe[3685]='Gate, the Beautiful`bu\'-ti-fool (he horaia pule tou hierou):<P>This gate of Herod\'s temple is mentioned in the narrative of the healing of the lame man by Peter and John in <a onClick="return mV(\'Act\',3,2,10);">Ac 3:2, 10</a>. Little dispute exists as to the identification of the Beautiful Gate with the splendid "gate of Nicanor" of the Mishna (Mid., i.4), and "Corinthian Gate" of Josephus (BJ, V, v, 3), but authorities are divided as to whether this gate was situated at the entrance to the women\'s court on the east, or was the gate reached by 15 steps, dividing that court from the court of the men. The balance of recent opinion inclines strongly to the former view (compare Kennedy, "Problems of Herod\'s Temple," The Expositor Times, XX, 170); others take the opposite view (Waterhouse, in Sacred Sites of the Gospels, 110), or leave the question open (thus G. A. Smith, Jerusalem, II, 212). See <a href="study/isbe/search.html?string=TEMPLE,+HEROD\'S">TEMPLE, HEROD\'S</a>.<P>The gate itself was of unusual size and splendor. It received the name "Nicanor" from its being the work, or having been constructed at the expense, of an Alexandrian Jew of this name. Lately an ossuary was discovered on Mt. Olivet bearing the Greek inscription: "The bones of Nicanor the Alexandrian, who made the doors."<P>Its other name, "Corinthian," refers to the costly material of which it was constructed—Corinthian bronze. Josephus gives many interesting particulars about this gate, which, he tells us, greatly excelled in workmanship and value all the others (BJ, V, v, 3). These were plated with gold and silver, but this still more richly and thickly. It was larger than the other gates; was 50 cubits in height (the others 40); its weight was so great that it took 20 men to move it (BJ, VI, vi, 3). Its massiveness and magnificence, therefore, well earned for it the name "Beautiful."``17';
isbe[3686]='Gate, Valley`In <a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a> the King James Version, "gate of the valley."`<a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>`1';
isbe[3687]='Gath`gath (gath; Septuagint Geth, "winepress"):<P>One of the five chief cities of the Philistines (<a onClick="return mV(\'Jos\',13,3);">Jos 13:3</a>; <a onClick="return mV(\'1Sa\',6,17);">1Sa 6:17</a>). It was a walled town (<a onClick="return mV(\'2Ch\',26,6);">2Ch 26:6</a>) and was not taken by Joshua, and, although many conflicts took place between the Israelites and its people, it does not seem to have been captured until the time of David (<a onClick="return mV(\'1Ch\',18,1);">1Ch 18:1</a>). It was rendered famous as the abode of the giant Goliath whom David slew (<a onClick="return mV(\'1Sa\',17,4);">1Sa 17:4</a>), and other giants of the same race (<a onClick="return mV(\'2Sa\',21,\'18-22\');">2Sa 21:18-22</a>). It was to Gath that the Ashdodites conveyed the ark when smitten with the plague, and Gath was also smitten (<a onClick="return mV(\'1Sa\',5,8,9);">1Sa 5:8-9</a>).<P>It was Gath where David took refuge twice when persecuted by Saul (<a onClick="return mV(\'1Sa\',21,20);">21:10</A>; <a onClick="return mV(\'1Sa\',27,2,3,4);">27:2-4</a>). It seems to have been destroyed after being taken by David, for we find Rehoboam restoring it (<a onClick="return mV(\'2Ch\',11,8);">2Ch 11:8</a>). It was after this reoccupied by the Philistines, for we read that Uzziah took it and razed its walls (<a onClick="return mV(\'2Ch\',26,6);">2Ch 26:6</a>), but it must have been restored again, for we find Hazael of Damascus capturing it (<a onClick="return mV(\'2Ki\',12,17);">2Ki 12:17</a>). It seems to have been destroyed before the time of Amos (<a onClick="return mV(\'Amo\',6,2);">Am 6:2</a>), and is not further mentioned in the Old Testament or Maccabees, except in <a onClick="return mV(\'Mic\',1,10);">Mic 1:10</a>, where it is referred to in the proverb, "Tell it not in Gath" (compare <a onClick="return mV(\'2Sa\',1,20);">2Sa 1:20</a>). Since its destruction occurred, probably, in the middle of the 8th century BC, it is easy to understand why the site has been lost so that it can be fixed only conjecturally. Several sites have been suggested by different explorers and writers, such as: Tell es Safi, Beit Jibrin, Khurbet Jeladiyeh, Khurbet Abu Geith, Jennata and Yebna (see PEFS, 1871, 91; 1875, 42, 144, 194; 1880, 170-71, 211-23; 1886, 200-202).<P>Tradition in the early centuries AD fixed it at 5 Roman miles north of Eleutheropolis (Beit Jibrin, toward Lydda, which would indicate Tell es Safi as the site, but the Crusaders thought it was at Jamnia (Yebna), where they erected the castle of Ibelin, but the consensus of opinion in modern times fixes upon Tell es Safi as the site, as is to be gathered from the references cited in PEFS above. The Biblical notices of Gath would indicate a place in the Philistine plain or the Shephelah, which was fortified, presumably in a strong position on the border of the Philistine country toward the territory of Judah or Dan. Tell es Safi fits into these conditions fairly well, but without other proof this is not decisive. It is described in SWP, II,240,as a position of strength on a narrow ridge, with precipitous cliffs on the north and west, connected with the hills by a narrow neck, so that it is thrust out like a bastion, a position easily fortified.<P>In 1144 Fulke of Anjou erected here a castle called Blanchegarde (Alba Specula). The writer on "Gath and Its Worthies" in PEFS, 1886, 200-204, connects the name Safi with that of the giant Saph (<a onClick="return mV(\'2Sa\',21,18);">2Sa 21:18</a>), regarding him as a native of Gath, but the most direct evidence from early tradition connecting Tell es Safi with Gath is found in a manuscript said to be in the library of the Patriarchate of Jerusalem, which informs us that Catherocastrum was situated on a mountain called Telesaphion or Telesaphy, which is clearly Tell es Safi. Catherocastrum must be the Latin for "camp of Gath" (PEFS,1906,305).``138';
isbe[3688]='Gath-Hepher`gath-he\'-fer (gath ha-chepher, "winepress of the pit"):<P>A town on the boundary of Zebulun (<a onClick="return mV(\'Jos\',19,13);">Jos 19:13</a>; the King James Version in error, "Gittah-hapher"), the birthplace of the prophet Jonah (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>). Jerome (Commentary on Jonah) speaks of Geth as an inconsiderable village, about 2 miles from Sepphoris on the Tiberias road, where the tomb of Jonah was shown. Benjamin of Tudela says that Jonah the son of Amittai the prophet was buried "in the mountain" near Sepphoris (Bohn, Early Travels in Palestine, 88). These indications agree with the local tradition which identifies Gath-hepher with el-Meshhed, a village with ancient ruins on a height north of the road as one goes to Tiberias, about 2 miles from Nazareth, and half a mile from Kefr Kennah.``54';
isbe[3689]='Gath-Rimmon`gath-rim\'-un (gath rimmon, "winepress of Rimmon"):<P>(1) A city in the territory of Dan named with Bene-berak and Me-jarkon, in the plain not far from Joppa (<a onClick="return mV(\'Jos\',19,45);">Jos 19:45</a>), assigned to the Kohathite Levites (<a onClick="return mV(\'Jos\',21,24);">Jos 21:24</a>), reckoned to Ephraim in <a onClick="return mV(\'1Ch\',6,69);">1Ch 6:69</a>. Eusebius, Onomasticon locates it 12 miles from Eleutheropolis on the way to Diospolis. This, however, is too far to the south. More probably it is identical with the "Gath" which Eusebius, Onomasticon places between Antipatris and Jamnia. It is not identified.<P>(2) A town in the territory of Manasseh, west of Jordan, given to the Levites (<a onClick="return mV(\'Jos\',21,25);">Jos 21:25</a>). There is nothing to indicate the position of the place, and there is much confusion in the writing of the name: Septuagint Codex Alexandrinus, "Baithsa"; Codex Vaticanus, "Jebatha." In <a onClick="return mV(\'1Ch\',6,70);">1Ch 6:70</a> it is replaced by "Bileam," i.e. <a href="study/isbe/search.html?string=IBLEAM">IBLEAM</A> (which see).``54';
isbe[3690]='Gather`gath\'-er (\'acaph, qabhats; sullego, sunago):<P>"Gather," transitive "to bring together," "collect," etc., and intransitive "to come together," "assemble," etc., occurs frequently and represents many Hebrew and Greek words. It is the translation of \'acaph, "to bring together," in <a onClick="return mV(\'Jos\',6,9);">Jos 6:9</a>, the King James Version margin "gathering host"; <a onClick="return mV(\'Psa\',27,10);">Ps 27:10</a>, the King James Version margin "The Lord will gather me"; compare <a onClick="return mV(\'Num\',12,14,15);">Nu 12:14-15</a>; <a onClick="return mV(\'Isa\',52,12);">Isa 52:12</a> King James Version margin. The phrases "gather thee unto thy fathers," "gathered unto his fathers," "gathered into the grave," etc., are frequently used for "to die" and "death" (<a onClick="return mV(\'Gen\',25,8,17);">Ge 25:8, 17</a>; <a onClick="return mV(\'Gen\',49,29,33);">49:29, 33</a>; <a onClick="return mV(\'Deu\',32,50);">De 32:50</a>; <a onClick="return mV(\'2Ki\',22,20);">2Ki 22:20</a>; <a onClick="return mV(\'2Ch\',34,28);">2Ch 34:28</a>; <a onClick="return mV(\'Job\',27,19);">Job 27:19</a>; compare <a onClick="return mV(\'Jer\',8,2);">Jer 8:2</a>), etc.; qabhats, "to take or grasp with the hand," is frequently used of the Divine "gathering" or restoration of Israel (<a onClick="return mV(\'Deu\',30,3,4);">De 30:3-4</a>; <a onClick="return mV(\'Neh\',1,9);">Ne 1:9</a>; <a onClick="return mV(\'Psa\',106,47);">Ps 106:47</a>; <a onClick="return mV(\'Isa\',43,5);">Isa 43:5</a>, etc.; <a onClick="return mV(\'Eze\',20,34);">Eze 20:34</a>, etc.; <a onClick="return mV(\'Hsa\',8,10);">Ho 8:10</a>; <a onClick="return mV(\'Mic\',2,12);">Mic 2:12</a>; <a onClick="return mV(\'Zep\',3,19,20);">Ze 3:19-20</a>; <a onClick="return mV(\'Zec\',10,8,10);">Zec 10:8, 10</a>); figuratively, <a onClick="return mV(\'Isa\',40,11);">Isa 40:11</a>, "He shall gather the lambs with (the Revised Version (British and American) "in") his arm" (compare <a onClick="return mV(\'Psa\',27,10);">Ps 27:10</a> King James Version margin); sometimes it denotes bringing together for punishment or destruction (<a onClick="return mV(\'Mic\',4,12);">Mic 4:12</a>), "He hath gathered them as the sheaves to the threshing-floor."<P>In the New Testament we have sullego, "to lay together," "to collect" (<a onClick="return mV(\'Mat\',13,28,29,30,40,41,48);">Mt 13:28-30, 40-41, 48</a>); sunago "to lead or bring together," "to gather," "to collect" (<a onClick="return mV(\'Mat\',25,26);">Mt 25:26</a>, "seek returns"; <a onClick="return mV(\'Jhn\',4,36);">Joh 4:36</a>, "fruit unto life eternal"); episunago, "to lead or bring together" (<a onClick="return mV(\'Mat\',23,37);">Mt 23:37</a>, "even as a hen gathereth her chickens"); anakephalaioomai, "to sum up under one head," "to recapitulate" (<a onClick="return mV(\'Eph\',1,10);">Eph 1:10</a>, "that he might gather together in one all things in Christ," the Revised Version (British and American) "to sum up all things in Christ"; compare <a onClick="return mV(\'Eph\',2,14);">Eph 2:14</a>; in <a onClick="return mV(\'Rom\',13,9);">Ro 13:9</a> the passive is translated "be briefly comprehended," the Revised Version (British and American) "summed up").<P>"To gather," in the sense of "to infer," occurs in <a onClick="return mV(\'Act\',16,10);">Ac 16:10</a> as the translation of sumbibazo, "to bring together" (here, in mind), "assuredly gathering," the Revised Version (British and American) "concluding" (compare <a onClick="return mV(\'Act\',9,22);">9:22</A>, "proving").<P>Gatherer occurs in <a onClick="return mV(\'Amo\',7,14);">Am 7:14</a> as the translation of bolec, from balac, to cultivate figs or sycamores, "a gatherer of sycamore fruit," the Revised Version (British and American) "a dresser of sycomore-trees" ("a nipper of sycomore figs, i.e. helping to cultivate a sort of figs or mulberries produced by the real sycamore tree" (used only by the poorest), which requires nipping in the cultivation, perhaps an occupation of shepherds; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) vellicans sycamnia).<P>Gathering is the translation of episunagoge, "leading together unto" (<a onClick="return mV(\'2Th\',2,1);">2Th 2:1</a>), "our gathering together unto him"; in <a onClick="return mV(\'1Cr\',16,2);">1Co 16:2</a> we have "gathering" (logia from lego) in the sense of a collection of many, the Revised Version (British and American) "collection," as the King James Version in <a onClick="return mV(\'1Cr\',16,1);">1Co 16:1</a>.<P>"Gather," etc., occurs frequently in Apocrypha, e.g. "will gather us out of all the nations," sunago (Tobit 13:5); "gather them together" (1Macc 9:7; 10:8); "Gather together our dispersion," episunagage ten diasporan hemon (2Macc 1:27); "gathered to his fathers" prosetethe pros ton laon autou, the Revised Version (British and American) "people" (Judith 16:22; Bel and the Dragon verse 1, tous pateras; 1Macc 2:69); "gathering up briefly," the Revised Version (British and American) "gather," suntemno (2Macc 10:10); "gathering" in the sense of a collection of money (2Macc 12:43), the Revised Version (British and American) "collection."<P>Among the changes in the Revised Version (British and American) we have "hold firm" for "gather" (<a onClick="return mV(\'Jer\',51,11);">Jer 51:11</a>); "Gather thee together" for "Go one way or other" (<a onClick="return mV(\'Eze\',21,16);">Eze 21:16</a> margin, "Make thyself one"); for "gather blackness" (<a onClick="return mV(\'Nah\',2,10);">Na 2:10</a>), "are waxed pale "; for "or gather together" (<a onClick="return mV(\'Job\',11,10);">Job 11:10</a>), "and call unto judgment," margin Hebrew "call an assembly"; for "even as a hen doth gather her brood" (<a onClick="return mV(\'Luk\',13,34);">Lu 13:34</a>) "gathereth her own brood"; for "as the partridge sitteth on eggs and hatcheth them not," the American Standard Revised Version has "that sitteth on eggs which she hath not laid," margin "gathereth young which she hath not brought forth," text of the English Revised Version and the King James Version margin (<a onClick="return mV(\'Jer\',17,11);">Jer 17:11</a>).``185';
isbe[3691]='Gaulonitis`gol-on-i\'-tis.`<a href="./study/isbe/search.html?string=GOLAN">GOLAN</a>`1';
isbe[3692]='Gauls`golz (Galatai):<P>Galatia in Asia Minor is literally the Gallia of the East; its inhabitants are called Galli by Roman writers, just as the inhabitants of ancient France are called Galatai by Greek writers. In some manuscripts in <a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>, eis Gallian is read for eis Galatian.<P>The emigration of the Gauls from Europe and their settlement in the central region of the peninsula of Asia Minor are somewhat obscure subjects, but the ancient authorities leave no doubt of the main facts. In 1Macc 8:2 it is difficult to say whether Judas Maccabeus is referring to the Gauls of Europe or the Gauls of Asia Minor. Both became finally subject to the Romans, and about the same time.<P>It was in 191 BC that Gallia Cisalpina was reduced to the form of a Roman province, and in 189 BC occurred the defeat of Antiochus, king of Asia. Mommsen argues that the reference is to the Gauls in the north of Italy, from the circumstance that they are mentioned as being under tribute to the Romans, and also from their mention in connection with Spain. Not much, however, can be argued from this, as the notice of them is in a manner rhetorical, and the defeat of Antiochus is mentioned practically in the same connection. In 2Macc 8:20 the reference is without doubt to the Asiatic Gauls or Galatians, as they are more commonly called. In the Maccabean period they were restless and fond of war, and often hired themselves out as auxiliaries to the Asiatic kings.``79';
isbe[3693]='Gaza`ga\'-za (\'azzah, "strong"; Septuagint Gaza; Arabic Ghazzeh):<P>One of the five chief towns of Philistia and probably the oldest, situated near the coast in lat. 31 degrees 30\' and about 40 miles south of Jaffa. It is on a hill rising 60 to 200 ft. above the plain, with sand dunes between it and the sea, which is about 2 1/2 miles distant. The plain around is fertile and wells abound, and, being on the border of the desert between Syria and Egypt and lying in the track of caravans and armies passing from one to the other, it was in ancient times a place of importance. The earliest notices of it are found in the records of Egypt.<P>Thothmes III refers to it in the account of his expedition to Syria in 1479 BC, and it occurs again in the records of the expedition of Seti I in 1313 BC (Breasted, History of Egypt,285,409).<P>It occurs also in the early catalogue of cities and tribes inhabiting Canaan in the earliest times (<a onClick="return mV(\'Gen\',10,19);">Ge 10:19</a>). Joshua reached it in his conquests but did not take it (<a onClick="return mV(\'Jos\',10,41);">Jos 10:41</a>; <a onClick="return mV(\'Jos\',11,22);">11:22</a>).<P>Judah captured it (<a onClick="return mV(\'Jdg\',1,18);">Jud 1:18</a>) but did not hold it long, for we find it in the hands of the Philistines in the days of Samson, whose exploits have rendered it noteworthy (<a onClick="return mV(\'Jud\',16,3,11,30);">16:1-3,11,30</a>). The hill to which he carried off the gate of the city was probably the one now called el-Muntar ("watch-tower"), which lies southeast of the city and may be referred to in <a onClick="return mV(\'2Ki\',18,8);">2Ki 18:8</a>, "from the tower of the watchmen to the fortified city," Gaza, with the other chief towns, sent a trespass offering to Yahweh when the ark was returned (<a onClick="return mV(\'1Sa\',6,17);">1Sa 6:17</a>).<P>Hezekiah defeated and pursued the Philistines to Gaza, but does not seem to have captured it. It was taken by Sargon in 720 BC, in his war with Egypt, since Khanun, the king of Gaza, joined the Egyptians and was captured at the battle of Raphia (Rawlinson, Ancient Monarchies, II, 142). It was probably destroyed (see <a onClick="return mV(\'Amo\',1,7);">Am 1:7</a>). It was certainly dismantled by Alexander the Great in 332, when it dared to resist him. It was then exceedingly strong, verifying its name, and was most bravely defended, so that it took Alexander two months to reduce it. He put to death all the men and sold the women and children as slaves (Grote, History of Greece, XI, 467ff). It was restored, however, and we learn that Jonathan forced it to submit to him (Josephus, Ant, XIII, v, 5; 1Macc 11:62), and Alexander Janneus took it and massacred the inhabitants who escaped the horrors of the siege (Josephus, Ant, XIII, xiii, 3). Pompey restored the freedom of Gaza (ibid., XIV, iv, 4), and Gabinius rebuilt it in 57 BC (ibid., XIV, v, 3).<P>Gaza is mentioned only once in the New Testament (<a onClick="return mV(\'Act\',8,26);">Ac 8:26</a>), in the account of Philip and the eunuch. In the 2nd and 3rd centuries AD, it became a center of Greek commerce and culture, and pagan influence was strong, while the church rounded there was struggling for existence. Many martyrs there testified to the faith, until finally, under Theodosius, Christianity gained the supremacy (HGHL, 12th edition, 188). It fell into the hands of the Arabs in 634 AD, and became and has remained a Moslem city since the days of Saladin, who recovered it from the Crusaders in 1187, after the battle of Hattin. It is now a city of some 20,000 inhabitants, among whom are a few hundred Christians.`<a href="./study/isbe/search.html?string=AZZAH">AZZAH</a>`138';
isbe[3694]='Gazara`ga-za\'-ra (Gazara, Gazera):<P>A fortress of great strength in Judea, which figures often in the Maccabean wars. To this place Judas pursued Gorgias (1Macc 4:15). It was fortified by the Greek general Bacchides (1Macc 9:52; Ant, XIII, i, 3). It was captured by Simon Maccabeus, who turned out the inhabitants and purified the city. He built here a palace for himself, and appointed his son John commander of his army (1Macc 13:43ff). A different account of this occurrence is given in 2Macc 10:32ff, where the capture is attributed to Judas. The narrative here, however, is inspired by antagonism to Simon because he had assumed the high-priesthood.<P>The fortress is identical with Tell Jezer, the ancient <a href="study/isbe/search.html?string=GEZER">GEZER</A> (which see). It is interesting to note that recent excavations have uncovered the ruins of Simon\'s palace (PEFS, 1905, 26).``54';
isbe[3695]='Gazathites`ga\'-zath-its (\'azzathim):<P>The inhabitants of <a href="study/isbe/search.html?string=GAZA">GAZA</A> (which see) (<a onClick="return mV(\'Jos\',13,3);">Jos 13:3</a> the King James Version), rendered "Gazites" (<a onClick="return mV(\'Jdg\',16,2);">Jud 16:2</a>).``54';
isbe[3696]='Gazelle`ga-zel\' (tsebhi, and feminine tsebhiyah; compare Tabeitha (<a onClick="return mV(\'Act\',9,36);">Ac 9:36</a>), and Arabic zabi; also Arabic ghazal; Dorkas (<a onClick="return mV(\'Act\',9,36);">Ac 9:36</a>); modern Greek zarkadi):<P>The word "gazelle" does not occur in the King James Version, where tsebhi and tsebhiyah, in the 16 passages where they occur, are uniformly translated "roe" or "roebuck." In the Revised Version (British and American) the treatment is not uniform. We find "gazelle" without comment in <a onClick="return mV(\'Deu\',12,15,22);">De 12:15, 22</a>; <a onClick="return mV(\'Deu\',14,5);">14:5</a>; <a onClick="return mV(\'Deu\',15,22);">15:22</a>; <a onClick="return mV(\'1Ki\',4,23);">1Ki 4:23</a>. We find "roe," with marginal note "or gazelle," in <a onClick="return mV(\'Pro\',6,5);">Pr 6:5</a>; <a onClick="return mV(\'Sgs\',2,7,9,17);">So 2:7, 9, 17</a>; <a onClick="return mV(\'Sgs\',4,5);">4:5</a>; <a onClick="return mV(\'Sgs\',8,14);">8:14</a>; <a onClick="return mV(\'Isa\',13,14);">Isa 13:14</a>. We find "roe" without comment in <a onClick="return mV(\'2Sa\',2,18);">2Sa 2:18</a>; <a onClick="return mV(\'1Ch\',12,8);">1Ch 12:8</a>; <a onClick="return mV(\'Sgs\',3,5);">So 3:5</a>; <a onClick="return mV(\'Sgs\',7,3);">7:3</a>. In the last passage cited, <a onClick="return mV(\'Sgs\',7,3);">So 7:3</a>, while the American Standard Revised Version has no note, the English Revised Version refers to <a onClick="return mV(\'Sgs\',4,5);">So 4:5</a>, where "gazelle" is graven in the margin. In the opinion of the writer, the rendering should be "gazelle" in all of these passages. It must be acknowledged, however, that the gazelle and the roe-deer are of about the same size, and are sometimes confused with each other. The Greek dorkas may refer to either, and in Syria the roe-deer is sometimes called ghazal or even wa\'l, which is the proper name of the Persian wild goat.<P>The gazelle is an antelope belonging to the bovine family of the even-toed ruminants. There are more than twenty species of gazelle, all belonging to Asia and Africa. The species found in Syria and Palestine is the Dorcas gazelle (Gazella dorcas). It <span class="noTag">is</span> 2 ft. high at the shoulders. Both sexes have unbranched, lyrate, ringed horns, which may be a foot long. The general coloration is tawny, but it is creamy white below and on the rump, and has a narrow white line from above the eye to the nostril. Several varieties have been distinguished, but they will not bear elevation to the rank of species, except perhaps Gazelle merilli a form of which a few specimens have been obtained from the Judean hills, having distinctly different horns from those of the common gazelle. The gazelle is found singly or in small groups on the interior plains and the uplands, but not in the high mountains. It is a marvel of lightness and grace, and a herd, when alarmed, makes off with great rapidity over the roughest country (<a onClick="return mV(\'2Sa\',2,18);">2Sa 2:18</a>; <a onClick="return mV(\'1Ch\',12,8);">1Ch 12:8</a>; <a onClick="return mV(\'Pro\',6,5);">Pr 6:5</a>; <a onClick="return mV(\'Sgs\',8,14);">So 8:14</a>). The beauty of the eyes is proverbial. The skin is used for floor coverings, pouches or shoes, and the flesh is eaten, though not highly esteemed.`<a href="./study/isbe/search.html?string=DEER">DEER</a>; <a href="./study/isbe/search.html?string=GOAT">GOAT</a>; <a href="./study/isbe/search.html?string=ZOOLOGY">ZOOLOGY</a>`37';
isbe[3697]='Gazer`ga\'-zer (gazer (in pause)).`<a href="./study/isbe/search.html?string=GEZER">GEZER</a>`1';
isbe[3698]='Gazera`ga-ze\'-ra (Gazera):<P>(1) A fortress of Judea (1Macc 4:15; 7:45); in the Revised Version (British and American) always <a href="study/isbe/search.html?string=GAZARA">GAZARA</a> (which see).<P>(2) Head of a family of temple-servants who returned with Zerubbabel (1Esdras 5:31) = "Gazzam" in <a onClick="return mV(\'Ezr\',2,48);">Ezr 2:48</a> and <a onClick="return mV(\'Neh\',7,51);">Ne 7:51</a>.``1';
isbe[3699]='Gazez`ga\'-zez (gazez, "shearer"):<P>(1) A son of Ephah, Caleb\'s concubine (<a onClick="return mV(\'1Ch\',2,46);">1Ch 2:46</a>).<P>(2) A second Gazez is mentioned in the same verse as a son of Haran, another son of Ephah.``1';
isbe[3700]='Gazing-Stock`gaz\'-ing-stok: This obsolete word occurs twice:<P>(1) in <a onClick="return mV(\'Nah\',3,6);">Na 3:6</a>, as the translation of ro\'i, "a sight" or "spectacle" (from ra\'ah, "to look," "see," also "to look down upon," "despise,"); "I will...make thee vile, and will set thee as a gazing-stock," as one set up to be gazed at, mocked and despised—a form of punishment in olden times; compare "mocking stock" (2Macc 7:7), and "laughing-stock" still in use. The Hebrew word occurs only here and in <a onClick="return mV(\'Gen\',16,13);">Ge 16:13</a>; <a onClick="return mV(\'1Sa\',16,12);">1Sa 16:12</a>; <a onClick="return mV(\'Job\',7,8);">Job 7:8</a>; <a onClick="return mV(\'Job\',33,21);">33:21</a>, in which places it does not have the same bad meaning; for a similar threatening compare <a onClick="return mV(\'Isa\',14,16);">Isa 14:16</a>; <a onClick="return mV(\'Jer\',51,37);">Jer 51:37</a>.<P>(2) In <a onClick="return mV(\'Hbr\',10,33);">Heb 10:33</a>, it is the translation of theatrizo, "to bring upon the theater," "to be made a spectacle of," "made a gazing stock both by reproaches and afflictions"; compare <a onClick="return mV(\'1Cr\',4,9);">1Co 4:9</a>, theatron ginomai, where Paul says the apostles were "made a spectacle unto the world," the King James Version margin "(Greek) theater." The reference in both instances is to the custom of exhibiting criminals, and especially gladiators, men doomed to death, in theaters. "In the morning men are exposed to lions and bears; at mid-day to their spectators; those that kill are exposed to one another; the victor is detained for another slaughter; the conclusion of the fight is death" (Seneca, Ep. vii, quoted by Dr. A. Clarke on <a onClick="return mV(\'1Cr\',4,9);">1Co 4:9</a>). We are apt to forget what the first preachers and professors of Christianity had to endure.``185';
