 slope, bringing us to the hot spring, \'Ain el-Fuliyeh, where is a little valley, with gardens and orange grove. The road then crosses a second promontory, and proceeds along the base of the mountain to Tiberias. Here the mountains recede from the shore, leaving a crescent-shaped plain, largely covered with the ruins of the ancient city. The modern town stands at the northern corner of the plain; while at the southern end are the famous hot baths, the ancient Hammath. A narrow ribbon of plain between the mountain and the shore runs to the south end of the lake. There the Jordan, issuing from the sea, almost surrounds the mound on which are the ruins of Kerak, the Tarichea of Josephus Crossing the floor of the valley, past Semakh, which is now a station on the Haifa-Damascus railway, we find a similar strip of plain along the eastern shore. Nearly opposite Tiberias is the stronghold of Chal\'-at el Chocn, possibly the ancient Hippos, with the village of Fik, the ancient Aphek, on the height to the east. To the north of this the waters of the sea almost touch the foot of the steep slope. A herd of swine running headlong down the mountain would here inevitably perish in the lake (<a onClick="return mV(\'Mat\',8,32);">Mt 8:32</a>, etc.). Next, we reach the mouth of Wady Semak, in which lie the ruins of Kurseh, probably representing the ancient Gerasa. Northward the plain widens into the marshy breadths of el-Bateichah, and once more we reach the Jordan, flowing smoothly through the fiat lands to the sea.<P>3. Storms:<P>The position of the lake makes it liable to sudden storms, the cool air from the uplands rushing down the gorges with great violence and tossing the waters in tumultuous billows. Such storms are fairly frequent, and as they are attended with danger to small craft, the boatmen are constantly on the alert. Save in very settled conditions they will not venture far from the shore. Occasionally, however, tempests break over the lake, in which a boat could hardly live. Only twice in over 5 years the present writer witnessed such a hurricane. Once it burst from the south. In a few moments the air was thick with mist, through which one could hear the roar of the tortured waters. In about ten minutes the wind fell as suddenly as it had risen. The air cleared, and the wide welter of foam-crested waves attested the fury of the blast. On the second occasion the wind blew from the east, and the phenomena described above were practically repeated.<P>4. Fish:<P>The sea contains many varieties of fish in great numbers. The fishing industry was evidently pursued to profit in the days of Christ. Zebedee was able to hire men to assist him (<a onClick="return mV(\'Mar\',1,20);">Mr 1:20</a>). In recent years there has been a considerable revival of this industry. See <a href="study/isbe/search.html?string=FISHING">FISHING</A>. Four of the apostles, and these the chief, had been brought up as fishermen on the Sea of Galilee. Peter and Andrew, James and John.<P>The towns around the lake named in Scripture are treated in separate articles. Some of these it is impossible to identify. Many are the ruins of great and splendid cities on slope and height of which almost nothing is known today. But from their mute testimony we gather that the lake in the valley which is now so quiet was once the center of a busy and prosperous population. We may assume that the cities named in the Gospels were mainly Jewish. Jesus would naturally avoid those in which Greek influences were strong. In most cases they have gone, leaving not even their names with any certainty behind; but His memory abides forever. The lake and mountains are, in main outline, such as His eyes beheld. This it is that lends its highest charm to "the eye of Galilee."<P>The advent of the railway has stirred afresh the pulses of life in the valley. A steamer plies on the sea between the station at Semakh and Tiberias. Superior buildings are rising outside the ancient walls. Gardens and orchards are being planted. Modern methods of agriculture are being employed in the Jewish colonies, which are rapidly increasing in number. Slowly, perhaps, but surely, the old order is giving place to the new. If freedom and security be enjoyed in reasonable measure, the region will again display its long-hidden treasures of fertility and beauty.``54';
isbe[3650]='Gall`gol:<P>(1) ro\'sh, or rosh (<a onClick="return mV(\'Deu\',32,32);">De 32:32</a> only, "grapes of gall"): Some very bitter plant, the bitterness as in (2) being associated with the idea of poison. <a onClick="return mV(\'Deu\',29,18);">De 29:18</a> margin "rosh, a poisonpus herb"; <a onClick="return mV(\'Lam\',3,5,19);">La 3:5, 19</a>; <a onClick="return mV(\'Jer\',8,14);">Jer 8:14</a>; <a onClick="return mV(\'Jer\',9,15);">9:15</a>; <a onClick="return mV(\'Jer\',23,15);">23:15</a>, "water of gall," margin "poison"; <a onClick="return mV(\'Hsa\',10,4);">Ho 10:4</a>, translated "hemlock"; <a onClick="return mV(\'Amo\',6,12);">Am 6:12</a>, "Ye have turned justice into gall"; <a onClick="return mV(\'Job\',20,16);">Job 20:16</a>, the "poison of asps": here rosh clearly refers to a different substance from the other references, the points in common being bitterness and poisonous properties. Hemlock (Conium maculatum), colocynth (Citrullus colocynthus) and the poppy (Papaver somniferum) have all been suggested as the original rosh, the last having most support, but in most references the word may represent any bitter poisonous substance. Rosh is associated with la\'anah, "wormwood" (<a onClick="return mV(\'Deu\',29,18);">De 29:18</a>; <a onClick="return mV(\'Lam\',3,19);">La 3:19</a>; <a onClick="return mV(\'Amo\',6,12);">Am 6:12</a>).<P>(2) mererah (<a onClick="return mV(\'Job\',16,13);">Job 16:13</a>), and merorah (<a onClick="return mV(\'Job\',20,14,25);">Job 20:14, 25</a>), both derived from a root meaning "to be bitter," are applied to the human gall or "bile," but like (1), merorah is once applied to the venom of serpents (<a onClick="return mV(\'Job\',20,14);">Job 20:14</a>). The poison of these animals was supposed to reside in their bile.<P>(3) chole (<a onClick="return mV(\'Mat\',27,34);">Mt 27:34</a>), "They gave him wine to drink mingled with gall"; this is clearly a reference to the Septuagint version of <a onClick="return mV(\'Psa\',69,21);">Ps 69:21</a>: "They gave me also gall (chole, Hebrew rosh) for my food; and in my thirst they gave me vinegar to drink." In <a onClick="return mV(\'Mar\',15,23);">Mr 15:23</a>, it says, "wine mingled with myrrh." It is well known that the Romans gave wine with frankincense to criminals before their execution to alleviate their sufferings; here the chole or bitter substance used was myrrh (Pliny Ep. xx.18; Sen. Ep. 83).``117';
isbe[3651]='Gallant`gal\'-ant: The translation of \'addir, "bright," "splendid," "mighty" (<a onClick="return mV(\'Isa\',33,21);">Isa 33:21</a>, "Neither shall gallant (\'addir) ship pass thereby"); the word is translated "mighty" in <a onClick="return mV(\'Exd\',15,10);">Ex 15:10</a>; <a onClick="return mV(\'1Sa\',4,8);">1Sa 4:8</a>; <a onClick="return mV(\'Isa\',10,34);">Isa 10:34</a>; <a onClick="return mV(\'Zec\',11,2);">Zec 11:2</a> the King James Version. In <a onClick="return mV(\'Isa\',33,21);">Isa 33:21</a>, above, it is applied to Yahweh. "glorious (\'addir) Lord" the King James Version, the Revised Version (British and American) "Yahweh...in...majesty"; compare also <a onClick="return mV(\'Psa\',16,3);">Ps 16:3</a>, "the excellent." As a noun it is used in the margin of <a onClick="return mV(\'Nah\',2,5);">Na 2:5</a> as alternative for "worthies," the Revised Version (British and American) "nobles" in <a onClick="return mV(\'Zec\',11,2);">Zec 11:2</a>, for "the might "Revised Version" "goodly ones" margin, "glorious"; it is translated "nobles" in <a onClick="return mV(\'Jdg\',5,13);">Jud 5:13</a>; <a onClick="return mV(\'2Ch\',23,20);">2Ch 23:20</a>, etc.`<a href="./study/isbe/search.html?string=SHIPS+AND+BOATS">SHIPS AND BOATS</a>`1';
isbe[3652]='Gallery`gal\'-er-i:<P>(1) (\'attuq, Kethibh; \'attik, used only in <a onClick="return mV(\'Eze\',41,16);">Eze 41:16</a>; <a onClick="return mV(\'Eze\',42,3,5);">42:3, 5</a>; etymology and meaning uncertain; among the more probable suggestions are "pillar," "column," "walk with pillars," "colonnades," "passageway," "porches," "galleries" of "terraces." Cornhill suggests the substitution of kiroth, "walls," to suit the context; others, e.g. Rothstein, would omit it as a dittography or other corruption): A long narrow balcony formed either by pillars or by the receding upper stories of a building. Both kinds are described in Ezekiel\'s vision of the Temple restored. They surround the three stories of side chambers around the Temple proper, and also the "building before the separate place which was at the back thereof," and the three-story structure containing rows of chambers in the outer court opposite the side-chambers of the Temple. Those around the Temple proper were apparently supported by pillars, and hence, they did not take away from the width of the 2nd-story and 3rd-story rooms (compare <a onClick="return mV(\'Eze\',4,17);">41:7</a>). On the other hand, the galleries of the outer buildings which were not supported by pillars and therefore not on top of each other, but in terraces, did take away from the upper stories more than from the lowest and middlemost: the upper chambers were shortened or "straitened more than the lowest and the middlemost from the ground."<P>The lower porches of the outer court were cut off from the view of those of the inner court by a low wall, but in the 3rd story, gallery looked out to gallery across the twenty cubits which belonged to the inner court and the pavement which belonged to the outer court." These "galleries," or \'attiqim, are one of the few features that distinguish the temple of Ezekiel\'s vision from Solomon\'s temple. The idea and perhaps the word seem to have been borrowed from the more elaborate architecture of the countries of the Exile, which must have impressed the Jews of Ezekiel\'s time very strongly. The building Ezekiel would place in the outer court with its terraces is a perfect Babylonian ziggurat or stage-tower temple (compare Encyclopedia Brit, 11th edition, II, 374, c-d).<P>(2) (rahat, probably "lock of hair," <a onClick="return mV(\'Sgs\',7,5);">So 7:5</a>; rahit Qere, rachit, Kethibh, probably "rafters," <a onClick="return mV(\'Sgs\',7,11);">So 7:11</a>; both words and also the similar word (rehatim, <a onClick="return mV(\'Gen\',30,38);">Ge 30:38</a>; <a onClick="return mV(\'Exd\',2,16);">Ex 2:16</a>), translated "troughs," are probably connected with the Aramaic rehat "to flow," "to run"): Although the King James Version uses "galleries" in <a onClick="return mV(\'Sgs\',7,5);">So 7:5</a> and <a onClick="return mV(\'Sgs\',1,17);">1:17</a> margin, the context in each place clearly points to another meaning. In the former of these passages, "the king is held captive in the tresses thereof," there follows a description of the head. In the latter passage the word in question is in parallelism with qoroth batenu, "the beams of our house," and "rafters" the King James Version, or possibly "boards," is suggested.``81';

isbe[3654]='Gallim`gal\'-im (gallim), "heaps"): Probably two distinct places:<P>(1) A town mentioned among the 11 additional cities of Judah which are in the Septuagint appended to <a onClick="return mV(\'Jos\',15,59);">Jos 15:59</a>, and have altogether disappeared from the Hebrew text. It occurs between Karem (\'Ain Kairem) and Baither (Bettir); it is probably the large and flourishing village of Beit Jala, near Bethlehem.<P>(2) Gallim is mentioned in <a onClick="return mV(\'Isa\',10,30);">Isa 10:30</a>; not far from Laishah and Anathoth and certainly north of Jerusalem. It was the home of Palti the son of Laish (<a onClick="return mV(\'1Sa\',25,44);">1Sa 25:44</a>), and it is by many authorities identified with the Gilgal on the north border of Judah (<a onClick="return mV(\'Jos\',15,7);">Jos 15:7</a>), the Geliloth of the parallel passage (<a onClick="return mV(\'Jos\',18,17);">Jos 18:17</a>), and the Beth-gilgal of <a onClick="return mV(\'Neh\',12,29);">Ne 12:29</a>.``117';
isbe[3655]='Gallio`gal\'-i-o (Gallion): The Roman deputy or proconsul of Achaia, before whom Paul was haled by his Jewish accusers on the apostle\'s first visit to Corinth, during his second missionary journey (<a onClick="return mV(\'Act\',18,\'12-17\');">Ac 18:12-17</a>). The trial was not of long duration. Although Gallio extended his protection to the Jewish religion as one of the religions recognized by the state, he contemptuously rejected the claim of the Jews that their law was binding upon all. In the eyes of the proconsul, the only law universally applicable was that of the Roman code and social morality: under neither was the prisoner chargeable; therefore, without even waiting to hear Paul\'s speech in his own defense, he summarily ordered his lictors to clear the court. Even the subsequent treatment meted out to Sosthenes, the chief ruler of the synagogue, was to him a matter of indifference. The beating of Sosthenes is ascribed by different readings to "Jews" and to "Greeks," but the incident is referred to by the writer of Acts to show that the sympathies of the populace lay with Paul, and that Gallio made no attempt to suppress them. Gallio has often been instanced as typical of one who is careless or indifferent to religion, yet in the account given of him in Acts, he merely displayed an attitude characteristic of the manner in which Roman governors regarded the religious disputes of the time (compare also <a href="study/isbe/search.html?string=LYSIAS">LYSIAS</A>; <a href="study/isbe/search.html?string=FELIX">FELIX</A>; <a href="study/isbe/search.html?string=FESTUS">FESTUS</A>). Trained by his administrative duties to practical thinking and precision of language, he refused to adjudicate the squabbles of what he regarded as an obscure religious sect, whose law was to him a subtle quibbling with "words and names."<P>According to extra-canonical references, the original name of Gallio was Marcus Annaeus Novatus, but this was changed on his being adopted by the rhetorician, Lucius Junius Gallio. He was born at Cordova, but came to Rome in the reign of Tiberius. He was the brother of the philosopher Seneca, by whom, as also by Statius, reference is made to the affable nature of his character. As Achaia was reconstituted a proconsular province by Claudius in 44 AD, the accession of Gallio to office must have been subsequent to that date, and has been variously placed at 51-53 AD (compare also Knowling in The Expositor\'s Greek Testament, II, 389-92).``88';

isbe[3657]='Gamael`gam\'-a-el (Gamael):<P>Chief of the family of Ithamar who went up from Babylon with Ezra (1Esdras 8:29);<P>called Daniel in <a onClick="return mV(\'Ezr\',8,2);">Ezr 8:2</a>.``1';
isbe[3658]='Gamaliel`ga-ma\'-li-el (gamli\'el, "reward or recompense of God"; Gamaliel):<P>(1) The son of Pedahzur, and "prince of the children of Manasseh," chosen to aid in taking the census in the Wilderness (<a onClick="return mV(\'Num\',1,10);">Nu 1:10</a>; <a onClick="return mV(\'Num\',2,20);">2:20</a>; <a onClick="return mV(\'Num\',7,54,59);">7:54, 59</a>; <a onClick="return mV(\'Num\',10,23);">10:23</a>).<P>(2) A Pharisee who at the meeting of the "council" succeeded in persuading its members to adopt a more reasonable course when they were incensed at the doctrine of Peter and the rest of the apostles and sought to slay them (<a onClick="return mV(\'Act\',5,\'33-40\');">Ac 5:33-40</a>). That he was well qualified for this task is attested by the fact that he was himself a member of the Sanhedrin, a teacher of the law, and held in high honor among all the people. In his speech he pointed out to his fellow-councilors the dire consequences that might ensue upon any precipitous action on their part. While quoting instances, familiar to his hearers, of past insurrections or seditions that had failed, he reminded them at the same time that if this last under Peter "is of God, ye will not be able to overthrow them; lest haply ye be found even to be fighting against God." As a result of his arguments, the apostles, after being beaten and admonished to speak no longer in the name of Jesus, were released. In the speech which he was permitted by Lysias to deliver from the stairs of the palace after the riot in Jerusalem, Paul referred to Gamaliel as the teacher of his youth, who instructed him rigidly in the Mosaic law (<a onClick="return mV(\'Act\',22,3);">Ac 22:3</a>).<P>The toleration and liberality displayed by Gamaliel upon the occasion of his speech before the Sanhedrin were all the more remarkable because of their rarity among the Pharisees of the period. Although the strict observance by the Christians of temple worship, and their belief in immortality, a point in dispute between Pharisees and Sadducees, may have had influence over him (Knowling), no credence is to be attached to the view that he definitely favored the apostles or to the tradition that he afterward became a Christian. The high place accorded him in Jewish tradition, and the fact that the title of Rabban, higher even than Rabbi or Master, was first bestowed upon him, testify that he remained a Pharisee to the end. His speech is rather indicative of one who knew the deeper truth in the Old Testament of the universal fatherhood of God, and who recognized that the presence of His power was the. deciding factor in all human enterprise. His social enactments were permeated by the same broad-minded spirit. Thus his legislation on behalf of the poor was formulated so as to include Gentiles as well as Jews. The authenticity of his speech has been questioned by Wendt and others, chiefly on account of the alleged anachronism in regard to Theudas (see <a href="study/isbe/search.html?string=THEUDAS">THEUDAS</A>); but the internal evidence is against this view (compare Knowling in The Expositor Greek Test., II, 161). It has also been objected by Baur and the Tubingen school that the liberal, peace-loving Gamaliel could not have been the teacher of the fanatical Saul. To this, reply has been made, firstly, that the charges against Stephen of destroying the temple and subverting the laws of Moses were not brought against Peter and the other apostles, and, secondly, that the doctrines of any teacher, however moderate he himself may be, are liable to be carried to extremes by an over-zealous pupil.<P>LITERATURE.<P>Conybeare and Howson, Life and Epistles of Paul, chapter ii; Kitto, Cyclopaedia of Biblical Lit.,1866, article "Gamaliel" (Ginsberg).``88';
isbe[3659]='Games`gamz:<P><B>I. ISRAELITISH GAMES</B><P class="in15">1. Children\'s Games<P class="in30">Mimicry<P class="in15">2. Sports<P class="in15">3. Games of Chance and Skill<P class="in15">4. Story-Telling<P class="in15">5. Dancing<P class="in15">6. Proverbs<P class="in15">7. Riddles<P><B>II. THE GAMES OF GREECE AND ROME</B><P class="in15">1. Historical Introduction<P class="in15">2. General References<P class="in15">3. Specific References to Greek Athletics<P class="in15">4. References to the Theater and the Drama<P><B>LITERATURE</B><hr /><P>About the amusements of the ancient Israelites we know but little, partly on account of the nature of our literary sources, which are almost exclusively religious, partly because the antiquities thus far discovered yield very little information on this topic as compared with those of some other countries, and partly because of the relatively serious character of the people. Games evidently took a less prominent place in Hebrew life than in that of the Greeks, the Romans and the Egyptians. Still the need for recreation was felt and to a certain extent supplied in ways according with the national temperament. Mere athletics (apart from Greek and Roman influence) were but little cultivated. Simple and natural amusements and exercises, and trials of wit and wisdom, were more to the Hebrew taste. What is known or probably conjectured may be summed up under the following heads: Games of Children; Sports; Games of Chance and Skill; Story-telling; Dancing; Proverbs; Riddles. The amusements of Greece and Rome, which to some extent influenced later Jewish society and especially those which are directly or indirectly referred to in the New Testament, will be theme of the latter part of the article.<P>I. Israelite Games<P>1. Children\'s Games:<P>There are two general references to the playing of children: <a onClick="return mV(\'Zec\',8,5);">Zec 8:5</a>: "And the streets of the city shall be full of boys and girls playing in the streets thereof"; and <a onClick="return mV(\'Gen\',21,9);">Ge 21:9</a> margin, where we read of Ishmael "playing" (metscheq). The rendering of our Bibles, "mocking," is open to question. Of specific games and pets there is hardly a mention in the Old Testament. Playing with ball is alluded to in <a onClick="return mV(\'Isa\',22,18);">Isa 22:18</a>: "He will...toss thee like a ball into a large country," but children need not be thought of as the only players. If the balls used in Palestine were like those used by the Egyptians, they were sometimes made of leather or skin stuffed with bran or husks of corn, or of string and rushes covered with leather (compare Wilkinson, Popular Account, I, 198-201; British Museum Guide to the Egyptian Collections, 78). The question of Yahweh to Job (<a onClick="return mV(\'Job\',41,5);">41:5)</a>: "Wilt thou play with him (the crocodile) as with a bird? or wilt thou bind him for thy maidens?" suggests that tame birds were petted by Hebrew children, especially by girls. The New Testament has one reference to children\'s play, namely, the half-parable about the children in the market-place who would neither dance to the flute as if at a marriage feast nor wail as if at a funeral (<a onClick="return mV(\'Mat\',11,16);">Mt 11:16</a>f parallel <a onClick="return mV(\'Luk\',7,32);">Lu 7:32</a>).<P>Mimicry<P>There are interesting accounts in Les enfants de Nazareth, by the Abbe Le Camus (60-66; 101-10), of the way in which the children of the modern Nazareth mimic scenes connected with weddings and funerals. That Israelite children had toys (dolls, models of animals, etc.) cannot be doubted in view of the finds in Egypt and elsewhere, but no positive evidence seems to be as yet forthcoming.<P>2. Sports:<P>Running was no doubt often practiced, especially in the time of the early monarchy. Saul and Jonathan (<a onClick="return mV(\'2Sa\',1,23);">2Sa 1:23</a>), Asahel (<a onClick="return mV(\'2Sa\',2,18);">2Sa 2:18</a>), Ahimaaz (<a onClick="return mV(\'2Sa\',18,23,27);">18:23,27</A>) and some of the Gadites in David\'s service (<a onClick="return mV(\'1Ch\',12,8);">1Ch 12:8</a>) were renowned for their speed, which can only have been the result of training and exercise. The same may be said of the feats of those who ran before a king or a prince (<a onClick="return mV(\'1Sa\',8,11);">1Sa 8:11</a>; <a onClick="return mV(\'2Sa\',15,1);">2Sa 15:1</a>; <a onClick="return mV(\'1Ki\',1,5);">1Ki 1:5</a>; <a onClick="return mV(\'1Ki\',18,46);">18:46</a>). The Psalmist must have watched great runners before he pictured the sun as rejoicing like a strong man to run his course (<a onClick="return mV(\'Psa\',19,5);">Ps 19:5</a>; compare also <a onClick="return mV(\'Ecc\',9,11);">Ec 9:11</a>; <a onClick="return mV(\'Jer\',8,6);">Jer 8:6</a>; <a onClick="return mV(\'Jer\',23,10);">23:10</a>). For running in the Greek games, see the latter part of this article.<P>Archery practice is implied in the story of Jonathan\'s touching interview with David (<a onClick="return mV(\'1Sa\',20,20,\'35-38\');">1Sa 20:20, 35-38</a>) and in Job\'s complaint: "He hath also set me up for his mark. His archers compass me round about" (<a onClick="return mV(\'Job\',16,12);">Job 16:12</a>f). Only by long practice could the 700 left-handed Benjamite slingers, every one of whom could sling stones at a hair-breadth and not miss (<a onClick="return mV(\'Jdg\',20,16);">Jud 20:16</a>), and the young David (<a onClick="return mV(\'1Sa\',17,49);">1Sa 17:49</a>), have attained to the precision of aim for which they are famous.<P>In <a onClick="return mV(\'Zec\',12,3);">Zec 12:3</a>, "I will make Jerusalem a burdensome stone," literally, "a stone of burden," Jerome found an allusion to a custom which prevailed widely in Palestine in his day, and has been noticed by a recent traveler, of stone-lifting, i.e. of testing the strength of young men by means of heavy round stones. Some, he says, could raise one of these stones to the knees, others to the waist, others to the shoulders and the head, and a few could lift it above the head. This interpretation is not quite certain (Wright, Comm., 364), but the form of sport described was probably in vogue in Palestine in Biblical times.<P>High leaping or jumping was probably also practiced (<a onClick="return mV(\'Psa\',18,29);">Ps 18:29</a>). The "play" referred to in <a onClick="return mV(\'2Sa\',2,14);">2Sa 2:14</a>ff of 12 Benjamites and 12 servants of David was not a sport but a combat like that of the Horatii and the Curiatii.<P>3. Games of Chance and Skill:<P>Dice were known to the ancient Egyptians, and Assyrian dice have been found, made of bronze with points of gold, but there is no trace of them in the Old Testament. Recent research at Ta\'-annek has brought to light many bones which seem to have been used in somewhat the same way as in a game played by the modern Arabs, who call it ka\'ab, the very word they apply to dice. These bones were "the oldest and most primitive form of dice" (Konig after Sellin, RE3, XVIII, 634). The use of dice among the later Jews is attested by the condemnation of dice-players in the Mishna (Sanh., iii. 3). The Syrian soldiers who cast lots for the raiment of Jesus at the cross (<a onClick="return mV(\'Mat\',27,35);">Mt 27:35</a> parallel <a onClick="return mV(\'Mar\',15,24);">Mr 15:24</a>; <a onClick="return mV(\'Luk\',23,34);">Lu 23:34</a>; <a onClick="return mV(\'Jhn\',19,24);">Joh 19:24</a>) may have used dice, but that can neither be proved nor disproved.<P>It has been suggested that the mockery of Jesus before the Sanhedrin described in <a onClick="return mV(\'Mat\',26,67);">Mt 26:67</a>f parallel <a onClick="return mV(\'Mar\',14,65);">Mr 14:65</a>; <a onClick="return mV(\'Luk\',22,63);">Lu 22:63</a>f may have been connected with a Greek game in which one of the players held the eyes of another while a third gave him a box on the ear. The last was then asked with what hand he had been struck. A somewhat similar game is represented in an Egyptian tomb picture (Wilkinson, Popular Account, I, 192). This reference, however, though not quite inadmissible, is scarcely probable. Games with boards and men bearing some resemblance to our draughts were in great favor in Egypt (ibid., 190-95), but cannot be proved for the Jews even in New Testament times.<P>4. Story-Telling:<P>Listening to stories or recitations has long been a favorite amusement of Orientals (compare Lane, Modern Egyptians, 359-91: "The Thousand and One Nights"), but there seems to be no reference to it in the Bible. There can be no reasonable doubt, however, that the Hebrews, like their neighbors, had story-tellers or reciters, axed heard them with delight. Egyptian tales of great antiquity are well known from the two volumes edited by Professor Petrie in 1895; and there are several non-canonical Jewish tales which combine romance and moral teaching: the Books of Tobit and Judith and perhaps the Story of Ahikar, the last of which, with the help of the Aramaic papyri discovered at Elephantine, can be traced back (in some form) to about 400 BC (Schurer, GJ V4, III, 255). There are also many short stories in the Haggadic portions of the Talmud and the Midrash.<P>5. Dancing:<P>Dancing, that is, the expression of joy by rhythmical movements of the limbs to musical accompaniment, is scarcely ever mentioned in the Bible as a social amusement, except in a general way (<a onClick="return mV(\'Jdg\',16,25,27);">Jud 16:25, 27</a>(?); <a onClick="return mV(\'Job\',21,11);">Job 21:11</a>; <a onClick="return mV(\'Psa\',30,11);">Ps 30:11</a>; <a onClick="return mV(\'Ecc\',3,4);">Ec 3:4</a>; <a onClick="return mV(\'Jer\',31,4,13);">Jer 31:4, 13</a>; <a onClick="return mV(\'Lam\',5,15);">La 5:15</a>; <a onClick="return mV(\'Mat\',11,17);">Mt 11:17</a>; <a onClick="return mV(\'Luk\',15,25);">Lu 15:25</a>). There is one exception, the dancing of Salome, the daughter of Herodias, before Herod Antipas and his court (<a onClick="return mV(\'Mat\',14,6);">Mt 14:6</a> parallel <a onClick="return mV(\'Mar\',6,22);">Mr 6:22</a>), which was a solo dance, probably of a pantomimic character affected by Roman influence. The other Biblical references to dancing can be grouped under two heads: the dance of public rejoicing, and the dance which was more or less an act of worship. Of the former we have two striking examples in the Old Testament: the dance accompanied by the tambourine with which the maidens of Israel, led by Jephthah\'s daughter, met that leader after his victory (<a onClick="return mV(\'Jdg\',11,34);">Jud 11:34</a>), and the dances of the Israelite women in honor of Saul and David to celebrate the triumph over the Philistines (<a onClick="return mV(\'1Sa\',18,6);">1Sa 18:6</a>; <a onClick="return mV(\'1Sa\',21,11);">21:11</a>; <a onClick="return mV(\'1Sa\',29,5);">29:5</a>).<P>It was probably usual to welcome a king or general with music and dancing. There is a good illustration in a fine Assyrian sculpture in the British Museum which represents a band of 11 instrumentalists taking part in doing homage to a new ruler. Three men at the head of the procession are distinctly dancing (SBOT, "Psalms," English, 226).<P>The distinctly religious dance is more frequently mentioned. The clear instances of it in the Bible are the dance of the women of Israel at the Red Sea, headed by Miriam with her tambourine (<a onClick="return mV(\'Exd\',15,20);">Ex 15:20</a>); the dance of the Israelites round the golden calf (<a onClick="return mV(\'Exd\',32,19);">Ex 32:19</a>); the dance of the maidens of Shiloh at an annual feast (<a onClick="return mV(\'Jdg\',21,19);">Jud 21:19</a>); the leaping or limping of the prophets of Baal round their altar on Carmel (<a onClick="return mV(\'1Ki\',18,26);">1Ki 18:26</a>), and the dancing of David in front of the ark (<a onClick="return mV(\'2Sa\',6,14,16);">2Sa 6:14, 16</a> parallel <a onClick="return mV(\'1Ch\',15,29);">1Ch 15:29</a>). There are general references in <a onClick="return mV(\'Psa\',149,3);">Ps 149:3</a>: "Let them praise his name in the dance"; <a onClick="return mV(\'Psa\',150,4);">150:4</a>: "Praise him with timbrel and dance"; and perhaps in <a onClick="return mV(\'Psa\',68,25);">68:25</A>. The allusions in <a onClick="return mV(\'Sgs\',6,13);">So 6:13</a>, "the dance of Mahanaim," and in the proper name Abel-meholah, "the meadow of the dance" (<a onClick="return mV(\'1Ki\',19,16);">1Ki 19:16</a>, etc.), are too uncertain to be utilized. The ritual dance was probably widespread in the ancient East. David\'s performance has Egyptian parallels. Seti I, the father of Rameses II, and three other Pharaohs are said to have danced before a deity (Budge, The Book of the Dead, I, xxxv), and Asiatic monuments attest the custom elsewhere. About the methods of dancing practiced by the ancient Hebrews but little is known. Probably the dancers in some cases joined hands and formed a ring, or part of a ring, as in some heathen representations. The description of David\'s dance: he "danced before Yahweh with all his might...leaping and dancing before Yahweh" (<a onClick="return mV(\'2Sa\',6,\'14-16\');">2Sa 6:14-16</a>) suggests three features of that particular display and the mode of dancing which it represented: violent exertion, leaping (mephazzez), and whirling round (mekharker). Perhaps the whirling dance of Islam is a modern parallel to the last. Women seem generally to have danced by themselves, one often leading the rest, both in dancing and antiphonal song; so Miriam and the women of Israel, Jephthah\'s daughter and her comrades, the women who greeted Saul and David, and, in the Apocrypha, Judith and her sisters after the death of Holofernes (Judith 15:12f). Once the separation of the sexes is perhaps distinctly referred to (<a onClick="return mV(\'Jer\',31,13);">Jer 31:13</a>). In public religious dances they may have occasionally united, as was the case sometimes in the heathen world, but there is no clear evidence to that effect (compare, however, <a onClick="return mV(\'2Sa\',6,20);">2Sa 6:20</a> and <a onClick="return mV(\'Psa\',68,25);">Ps 68:25</a>). Of the social dancing of couples in the modern fashion there is no trace. There seems to be some proof that the religious dance lingered among the Jews until the time of Christ and later.<P>If the Mishna can be trusted (Cukkah, v.4), there was a torch-light dance in the temple in the illuminated court of the women at the Feast of Tabernacles in which men of advanced years and high standing took part. The Gemara to the Jerusalem Talmud adds that a famous dancer on these occasions was Rabbi Simeon or Simon, the son of Gamaliel, who lived in the apostolic age (Josephus, BJ, IV, iii, 9). According to another passage (Ta\'anith 4 8) the daughters of Jerusalem used to dance dressed in white in the vineyards on Tishri the 10th and Abib the 15th. Religious dancing in the modern East is illustrated not only by the dances of the dervishes mentioned above, but also by occasional dances led by the sheikh in honor of a saint (Curtiss, Primitive Semitic Religion Today, 169). Among the later Jews dancing was not unusual at wedding feasts. More than one eminent rabbi is said to have danced before the bride (Kethubboth 17a). Singing and dancing, with lighted torches, are said to be wedding customs of the modern Arabs.<P>LITERATURE.<P>Arts. "Dance" in Smith DB2, HDB, DCG, EB, Jewish Encyclopedia (also "Games"); "Tanz" in RE3 and the German Dictionaries of Winer, Riehm, and Guthe (Reigen); Nowack, HA, I, 278 f.<P>6. Proverbs:<P>Proverbs (mashal; paroimia):Proverbs and proverbial expressions seem to have been, to some extent, a means of amusement as well as instruction for the ancient Oriental who delighted in the short, pointed statement of a moral or religious truth, or a prudential maxim, whether of literary or popular origin. Most of these sayings in the Bible belong to the former class, and are couched in poetic form (see <a href="study/isbe/search.html?string=PROVERBS">PROVERBS</A>; <a href="study/isbe/search.html?string=ECCLESIASTES">ECCLESIASTES</A>; <a href="study/isbe/search.html?string=ECCLESIASTICUS">ECCLESIASTICUS</a>). The others which are shorter and simpler, together with a number of picturesque proverbial phrases, must have recurred continually in daily speech and have added greatly to its vivacity.<P>The Old Testament supplies the following 10 examples of the popular proverb:<P class="in15">(1) "Like Nimrod a mighty hunter before Yahweh" (<a onClick="return mV(\'Gen\',10,9);">Ge 10:9</a>);<P class="in15">(2) "As the man is, so is his strength" (<a onClick="return mV(\'Jdg\',8,21);">Jud 8:21</a>), only two words in the Hebrew;<P class="in15">(3) "Is Saul also among the prophets?" (<a onClick="return mV(\'1Sa\',10,11);">1Sa 10:11</a>f; <a onClick="return mV(\'1Sa\',19,24);">19:24</a>);<P class="in15">(4) "Out of the wicked (wicked men) cometh forth wickedness" (<a onClick="return mV(\'1Sa\',24,13);">1Sa 24:13</a>);<P class="in15">(5) "There are the blind and the lame; he cannot come into the house" (<a onClick="return mV(\'2Sa\',5,8);">2Sa 5:8</a>);<P class="in15">(6) "Let not him that girdeth on his armor boast himself as he that putteth it off" (<a onClick="return mV(\'1Ki\',20,11);">1Ki 20:11</a>);<P class="in15">(7) "Skin for skin, yea, all that a man hath will he give for his life" (<a onClick="return mV(\'Job\',2,4);">Job 2:4</a>);<P class="in15">(8) "The days are prolonged, and every vision faileth" (<a onClick="return mV(\'Eze\',12,22);">Eze 12:22</a>), a scoffing jest rather than a proverb;<P class="in15">(9) "As is the mother, so is her daughter" (<a onClick="return mV(\'Eze\',16,44);">Eze 16:44</a>), two words in the Hebrew;<P class="in15">(10) "The fathers have eaten sour grapes, and the children\'s teeth are set on edge" (<a onClick="return mV(\'Jer\',31,29);">Jer 31:29</a>; <a onClick="return mV(\'Eze\',18,2);">Eze 18:2</a>).<P>In the New Testament we find 10 others:<P class="in15">(1) "Physician, heal thyself" (<a onClick="return mV(\'Luk\',4,23);">Lu 4:23</a>); in the Midrash Rabbah on Gen: "Physician heal thine own wound";<P class="in15">(2) "Can the blind guide the blind? shall they not both fall into a pit?" (<a onClick="return mV(\'Luk\',6,39);">Lu 6:39</a>);<P class="in15">(3) "With what measure ye mete, it shall be measured unto you" (<a onClick="return mV(\'Mat\',7,2);">Mt 7:2</a> parallel <a onClick="return mV(\'Mar\',4,24);">Mr 4:24</a>; <a onClick="return mV(\'Luk\',6,38);">Lu 6:38</a>), almost identical with a Jewish proverb, "measure for measure" cited several times in the ancient Midrash, the Mekhilta\';<P class="in15">(4) "One soweth, and another reapeth" (<a onClick="return mV(\'Jhn\',4,37);">Joh 4:37</a>);<P class="in15">(5) "A prophet is not without honor, save in his own country" (<a onClick="return mV(\'Mat\',13,57);">Mt 13:57</a>; <a onClick="return mV(\'Luk\',4,24);">Lu 4:24</a>; <a onClick="return mV(\'Jhn\',4,44);">Joh 4:44</a>; Logion of Oxyrhynchus);<P class="in15">(6) "There are yet four months, and then cometh the harvest" (<a onClick="return mV(\'Jhn\',4,35);">Joh 4:35</a>), possibly a kind of proverb;<P class="in15">(7) "Wheresoever the carcass is, there will the eagles (m "vultures") be gathered together" (<a onClick="return mV(\'Mat\',24,28);">Mt 24:28</a> parallel <a onClick="return mV(\'Luk\',17,37);">Lu 17:37</a>); perhaps a proverb of which there is a trace also in the reference to the vulture: "Where the slain are, there is she" (<a onClick="return mV(\'Job\',39,30);">Job 39:30</a>);<P class="in15">(8) "It is hard for thee to kick against the goad" (<a onClick="return mV(\'Act\',26,14);">Ac 26:14</a>), a Greek proverb: for proof compare Wetstein\'s note;<P class="in15">(9) "The dog turning to his own vomit again, and the sow that had washed to wallowing in the mire" (<a onClick="return mV(\'2Pe\',2,22);">2Pe 2:22</a>); Wetstein gives rabbinic parallels for the former half, and Greek for the latter;<P class="in15">(10) "Ye...strain out the gnat, and swallow the camel" (<a onClick="return mV(\'Mat\',23,24);">Mt 23:24</a>).<P>There are also many proverbial phrases which added piquancy to conversation. Exceeding smallness was likened to the eye of a needle (<a onClick="return mV(\'Mat\',19,24);">Mt 19:24</a> parallel <a onClick="return mV(\'Mar\',10,25);">Mr 10:25</a>; <a onClick="return mV(\'Luk\',18,25);">Lu 18:25</a>), or to a grain of mustard (<a onClick="return mV(\'Mat\',13,31);">Mt 13:31</a> parallel <a onClick="return mV(\'Mar\',4,31);">Mr 4:31</a>; <a onClick="return mV(\'Mat\',17,20);">Mt 17:20</a> parallel <a onClick="return mV(\'Luk\',17,6);">Lu 17:6</a>), comparisons both found also in the Talmud, the Koran, and modern Arabic sayings. Relative greatness was likened to a camel (<a onClick="return mV(\'Mat\',19,24);">Mt 19:24</a>, etc.), in the Talmud to a camel or an elephant. Great number was illustrated by reference to "the sand which is upon the sea-shore" (<a onClick="return mV(\'Gen\',22,17);">Ge 22:17</a> and many other passages); "the dust of the earth" (<a onClick="return mV(\'Gen\',13,16);">Ge 13:16</a>, etc.; also an Arabian figure); "the grass of the earth" (<a onClick="return mV(\'Job\',5,25);">Job 5:25</a>; <a onClick="return mV(\'Psa\',72,16);">Ps 72:16</a>; compare <a onClick="return mV(\'Psa\',92,7);">Ps 92:7</a>), an early Babylonian figure; a swarm of locusts (<a onClick="return mV(\'Nah\',3,15);">Na 3:15</a> and Na 4 other passages), a similitude used also by Sennacherib (RP, n.s. VI, 97), and the stars of heaven (<a onClick="return mV(\'Gen\',15,5);">Ge 15:5</a> and 10 other passages). When complete security was promised or described it was said that not a hair of the head was or should be injured or perish (<a onClick="return mV(\'1Sa\',14,45);">1Sa 14:45</a>; <a onClick="return mV(\'2Sa\',14,11);">2Sa 14:11</a>; <a onClick="return mV(\'1Ki\',1,52);">1Ki 1:52</a>; <a onClick="return mV(\'Dan\',3,27);">Da 3:27</a>; <a onClick="return mV(\'Luk\',21,18);">Lu 21:18</a>; <a onClick="return mV(\'Act\',27,34);">Ac 27:34</a>). Overcoming of difficulties was referred to as the removal of mountains (<a onClick="return mV(\'Mat\',17,20);">Mt 17:20</a>; <a onClick="return mV(\'Mat\',21,21);">21:21</a> parallel <a onClick="return mV(\'Mar\',11,23);">Mr 11:23</a>; <a onClick="return mV(\'1Cr\',13,2);">1Co 13:2</a>), an expression which has rabbinic parallels. Other proverbial phrases may perhaps be found in the saying about the mote and the beam (<a onClick="return mV(\'Mat\',7,\'3-5\');">Mt 7:3-5</a>), jot or tittle (<a onClick="return mV(\'Mat\',5,18);">Mt 5:18</a> parallel <a onClick="return mV(\'Luk\',16,17);">Lu 16:17</a>), and the foolish words of Rehoboam and his young advisers (<a onClick="return mV(\'1Ki\',12,10);">1Ki 12:10</a>f). Many old proverbs have no doubt perished. Dukes in his Rabbinische Blumenlese gives 665 proverbs and proverbial expressions from the Talmud and related literature, and modern collections show that proverbial lore is still in great favor in the Biblical Orient.<P>See also <a href="study/isbe/search.html?string=PROVERBS">PROVERBS</A>.<P>LITERATURE.<P>In addition to works already mentioned Konig, Stilistik, etc., DCG ("Jesus\' Use of Proverbs"); Murray, DB, article "Proverbs"; Cohen, Ancient Jewish Proverbs, 1911.<P>7. Riddles:<P>Riddles (chidhah; ainigma): Riddle-making and riddle-guessing were in favor in the ancient East, both in educated circles and in comparatively common life. There is a tablet in the British Museum (K 4347: Guide to Assyrian and Babylonian Antiquities2, 53) from the library of Ashur-bani-pal which attests the use of riddles not only by the Assyrians of the 7th century BC, but also in a far earlier age, for it contains a Sumer as well as a Semitic text. So it is not surprising that we find a remarkable example in early Israelite history in Samson\'s famous riddle: "Out of the eater came forth food, and out of the strong came forth sweetness" (<a onClick="return mV(\'Jdg\',14,14);">Jud 14:14</a>). The riddle is couched in poetic form, as is also the solution: "What is sweeter than honey? and what is stronger than a lion?" (<a onClick="return mV(\'Jdg\',14,18);">Jud 14:18</a>), and the comment: "If ye had not plowed with my heifer, ye had not found out my riddle" (same place). The stipulation of a prize or penalty according to the success or failure of the persons challenged to solve the riddle was a custom met with also among the ancient Greeks and in a later age among the Arabs. In <a onClick="return mV(\'1Ki\',10,1);">1Ki 10:1</a> parallel <a onClick="return mV(\'2Ch\',9,1);">2Ch 9:1</a> the word used of Samson\'s riddle (chidhah) is employed of the "hard questions" put to Solomon by the queen of Sheba. The Septuagint seems to have understood the word as "riddle" here also, for it renders "enigmas," and some of the later Jews not only adopted this interpretation, but actually gave riddles said to have been propounded. Of these riddles which, of course, have no direct historic value, but are interesting specimens of riddle lore, one of the best is the following: "Without movement while living, it moves when its head is cut off"; the answer to which is: "a tree" (Jewish Encyclopedia, article "Riddle"; see also for these riddles Wunsche, Die Rathselweisheit bei den Hebraern, 15-23). If Josephus can be trusted, historians of Phoenicia recorded a riddle-contest between Solomon and the Phoenician Hiram in which the latter finally won with the help of a Tyrian named Abdemon (Ant., VIII, v, 3; CAp, 1, 18). In this case, too, defeat involved penalty. The testing of ability by riddles has a striking parallel in the Persian epic, the Shah Nameh, in the trial of the hero Sal by the mobeds or wise men (Wunsche, op. cit., 43-47). Solomon\'s fame as an author of riddles and riddle-like sayings is referred to in Sirach 47:15,17 (Hebrew): "With song, and proverbs, dark sayings (chidhah) and figures, thou didst greatly move the nations." Chidhah occurs only once in Pr (<a onClick="return mV(\'Pro\',1,6);">1:6</A>): "the words of the wise, and their dark sayings," but the collection contains several examples of what Konig calls "the numerical riddle": <a onClick="return mV(\'Pro\',6,\'16-19\');">Pr 6:16-19</a>; <a onClick="return mV(\'Pro\',30,7,15,18,21,\'24-29\');">30:7ff, 15f; 18f; 21ff, 24-28, 29ff</a>. In each case the riddle is stated first and then the solution. The saying in <a onClick="return mV(\'Pro\',26,10);">Pr 26:10</a>: "As an archer that woundeth all, so is he that hireth the fool and he that hireth them that pass by," has been cited as a riddle, and it is certainly obscure enough, but the obscurity may be due to textual corruption. There are several passages in the Old Testament in which the word chidhah seems to be used in the general sense of "mysterious utterance": <a onClick="return mV(\'Num\',12,8);">Nu 12:8</a>; <a onClick="return mV(\'Psa\',49,4);">Ps 49:4</a>; <a onClick="return mV(\'Psa\',78,2);">78:2</a>; <a onClick="return mV(\'Dan\',5,12);">Da 5:12</a> (the Aramaic equivalent of chidhah); <a onClick="return mV(\'Dan\',8,23);">Da 8:23</a>; <a onClick="return mV(\'Hab\',2,6);">Hab 2:6</a>. In <a onClick="return mV(\'Eze\',17,1);">Eze 17:1</a> it describes the parable or allegory of the Two Eagles and the Cedar and the Vine. Sirach has several numerical riddles: <span class="noTag">23:16; 25:1f; 7f; 26:5f; 50:25 f</span>; and there are similar sayings in Ab 5 1-11,16-21 (Taylor\'s edition). In the Book of Jeremiah (<a onClick="return mV(\'Jer\',25,26);">25:26</a>; <a onClick="return mV(\'Jer\',51,41);">51:41</A>; <a onClick="return mV(\'Jer\',51,1);">51:1</a>) are two examples of a cryptic or cipher mode of writing which comes very near the riddle. SHe SHaKH, in the first two passages, represented by the three letters shin, shin, kaph, answering to our sh, sh, k, is meant to be read with the substitution for each letter of the letter as near the beginning of the alphabet as it is near the end, the result being sh = b, sh = b, k = l, that is, B-b-l or Babel/Babylon. In the same way in the last passage the consonants composing the word Lebkamai l, b, k, margin, y, suggest k, s, d, y, margin, that is, Kasdim or Chaldees. This cipher or riddle-writing was called by the Jews \'At-bash (compare Buxtorf, Lexicon Chaldaicum, etc., I,131,137f; edited by Fischer; and modern commentaries on Jer). The New Testament contains no riddle except the numerical puzzle, <a onClick="return mV(\'Rev\',13,18);">Re 13:18</a> (compare <a href="study/isbe/search.html?string=NUMBER">NUMBER; <a href="study/isbe/search.html?string=GEMATRIA">GEMATRIA</A>), and has the Greek equivalent of chidhah only in <a onClick="return mV(\'1Cr\',13,12);">1Co 13:12</a>, "for now we see...darkly," the Revised Version, margin "in a riddle" (Greek en ainigmati). There can be little doubt that riddles enlivened marriage festivals, such as that of Cana. Wunsche (op. cit.) gives some interesting specimens of later Jewish riddles, subsequent indeed to our Lord\'s time, but such as might have been in circulation then.<P>LITERATURE.<P>The most important authority is the above-cited monograph of Wunsche. Konig has an interesting paragraph in his Stilistik, Rhetorik, Poetik, etc., 12f. Compare also Hamburger, RE, II, 966ff; articles on "Riddle" in Jewish Encyclopedia, Smith\'s DB, HDB, larger and smaller; Murray\'s DB; German Bible Dictionaries of Winer, Riehm2, and Guthe; Rosenmuller, Das alte und neue Morgenland, III. 48 f.<P>II. The Games of Greece and Rome.<P>1. Historical Introduction:<P>This is not the place to give a detailed account of the Greek gymnasia and the elaborate contests for which candidates were prepared in them, or to describe the special forms of sport introduced by the Romans, but these exercises and amusements were so well known in Palestine and throughout the Roman Empire in the time of Christ and the apostles that they cannot be passed over in silence. Some acquaintance with them is absolutely necessary for the interpretation of many passages in the New Testament, especially in the Epistles. Hellenic athletics found their way into Jewish society through the influence of the Greek kingdom ruled over by the Seleucids. Early in the reign of Antiochus Epiphanes (circa 176 BC) a gymnasium, "place of exercise," was built in Jerusalem (1Macc 1:14; 2Macc 4:9,12) and frequented by priests (1Macc 1:14f), who are spoken of as "making of no account the honors of their fathers, and thinking the glories of the Greeks best of all." After the success of the Maccabean rising Greek games fell into disrepute among the Jewish population of Palestine, and were thenceforth regarded with suspicion by all strict religionists, even the worldly Josephus sharing the general feeling (Ant., XV, viii, 1). Nevertheless Gentile games must have been familiar to most in Jerusalem and elsewhere during the Herodian rule and the Roman occupation. Herod the Great built a theater and amphitheater in the neighborhood of the city (Josephus, ibid.; for probable sites, see G.A. Smith, Jerusalem, II, 493), and instituted in the name of Caesar games which included Roman as well as Hellenic sports, celebrated every 5 years. There was also a hippodrome or race-course for horses and chariots, bearing considerable resemblance to the Roman circus (Josephus, Ant, XVII, x, 2; BJ, II, iii, 1). Jericho, too, was provided with a theater, an amphitheater and a hippodrome. There was a hippodrome also at Tarichea. In addition there were scattered over Syria many Hellenic and partially Hellenic cities—Schurer (GJV4, II, 108-221) gives the history of 33—Caesarea Stratonis, Caesarea Philippi, the cities of the Decapolis, Tiberias, etc., which would all have had gymnasia and games. In Tarsus, which must have had a large Greek element in its population, Paul must have heard, and perhaps seen, in his childhood, much of the athletic exercises which were constantly in progress, and in later life he must often have been reminded of them, especially at Corinth, near which were celebrated biennially the Isthmia or Isthmian Games which drew visitors from all parts of the Empire, at Caesarea which possessed a theater, an amphitheater and a stadium, and at Ephesus. The custom, indeed, seems to have been almost universal. No provincial city of any importance was without it (Schurer, op. cit., 48), especially after the introduction of games in honor of the Caesars. The early Christians, therefore, whether of Jewish or Gentile origin, were able to understand, and the latter at any rate to appreciate, references either to the games in general, or to details of their celebration.<P>2. General References:<P>The word which described the assembly gathered together at one of the great Grecian games (agon) was also applied to the contests themselves, and then came to be used of any intense effort or conflict. The corresponding verb (agonizomai) had a similar history. Both these words are used figuratively in the Pauline Epistles: the noun in <a onClick="return mV(\'Phl\',1,30);">Php 1:30</a>; <a onClick="return mV(\'Col\',2,1);">Col 2:1</a>; <a onClick="return mV(\'1Th\',2,2);">1Th 2:2</a>; <a onClick="return mV(\'1Ti\',6,12);">1Ti 6:12</a>; <a onClick="return mV(\'2Ti\',4,7);">2Ti 4:7</a>, rendered in the Revised Version (British and American) (except in the second passage), "conflict" or "fight"; the verb in <a onClick="return mV(\'Col\',1,29);">Col 1:29</a>; <a onClick="return mV(\'Col\',4,12);">4:12</a>; <a onClick="return mV(\'1Ti\',4,10);">1Ti 4:10</a>; <a onClick="return mV(\'1Ti\',6,12);">6:12</a>; <a onClick="return mV(\'2Ti\',4,7);">2Ti 4:7</a>, translated "strive," "fight." In <a onClick="return mV(\'1Cr\',9,25);">1Co 9:25</a>; <a onClick="return mV(\'2Ti\',2,5);">2Ti 2:5</a> (where another word is used) there are literal references. The former passage English Revised Version: "Every man that striveth in the games (agonizomenos) is temperate in all things," also alludes to the rigid self-control enforced by long training which the athlete must practice. The training itself is glanced at in the exhortation: "Exercise thyself (gumnaze) unto godliness" (<a onClick="return mV(\'1Ti\',4,7);">1Ti 4:7</a>), and in the remark which follows: "Bodily exercise (gumnasia) is profitable for a little." It is remarkable that the word gymnasium, or "place of training," which occurs in the Apocrypha (2Macc 4:9,12) is not met with in the New Testament. The necessity for the observance of rules and regulations is referred to in the words: "And if also a man contend in the games, he is not crowned, except he have contended lawfully" (<a onClick="return mV(\'2Ti\',2,5);">2Ti 2:5</a>). In all these passages the games will have been more or less in the apostle\'s thought (for other possible New Testament references compare <a onClick="return mV(\'Hbr\',5,14);">Heb 5:14</a>; <a onClick="return mV(\'Hbr\',10,32);">10:32</a>; <a onClick="return mV(\'Hbr\',12,1);">12:1</a>; <a onClick="return mV(\'2Pe\',2,14);">2Pe 2:14</a>).<P>3. Specific References to Greek Athletics:<P>In addition to these general references there are many allusions to details, again found mainly in the Pauline Epistles. These may most conveniently be grouped in alphabetical order.<P>(a) Beast-fight.<P>The combats of wild animals with one another and with men, which were so popular at Rome toward the close of the Republic and under the Empire, were not unknown in Palestine. Condemned criminals were thrown to wild beasts by Herod the Great in his amphitheater at Jerusalem, "to afford delight to spectators," a proceeding which Josephus (Ant., XV, viii, 1) characterizes as impious. After the fall of Jerusalem in 70 AD many Jewish captives were slain in fighting with wild beasts (BJ, VII, ii). This horrible form of sport must have been in the apostle\'s mind when he wrote: "I fought with beasts (etheriomachesa) at Ephesus" (<a onClick="return mV(\'1Cr\',15,32);">1Co 15:32</a>). The reference is best understood as figurative, as in Ignatius on <a onClick="return mV(\'Rom\',5,1);">Ro 5:1</a>, where the same word (theriomacheo) is used, and the soldiers are compared to leopards.<P>(b) Boxing.<P>This form of sport is directly referred to in <a onClick="return mV(\'1Cr\',9,26);">1Co 9:26</a>: "So box I (Revised Version margin, Greek pukteuo), as not beating the air." The allusion is probably continued in <a onClick="return mV(\'1Cr\',9,27);">9:27a</A>: "but I buffet (the Revised Version, margin "bruise," Greek hupopiazo) my body."<P>(c) The Course.<P>Foot-races and other contests took place in an enclosure 606 feet 9 inches in length, called a stadium. This is once referred to in a passage in the context of that just mentioned, which almost seems based on observation: "They that run in a race-course (RVm, Greek stadion) run all" (<a onClick="return mV(\'1Cr\',9,24);">1Co 9:24</a>).<P>(d) Discus Throwing.<P>The throwing of the discus, a round plate of stone or metal 10 or 12 inches in diameter, which was a prominent feature of Greek athletics and is the subject of a famous statue, a copy of which is in the British Museum, is not mentioned in the New Testament, but is alluded to in 2Macc 4:14 as one of the amusements indulged in by Hellenizing priests in the reign of Antiochus Epiphanes.<P>(e) The Foot-race.<P>The words for "run" and "race" (Greek trecho and dromos) sometimes clearly, and in other cases probably, allude to foot-races at the games. For obvious references compare <a onClick="return mV(\'1Cr\',9,24);">1Co 9:24</a>; <a onClick="return mV(\'Hbr\',12,1);">Heb 12:1</a>; <a onClick="return mV(\'2Ti\',4,7);">2Ti 4:7</a>; for possible references see <a onClick="return mV(\'Act\',13,25);">Ac 13:25</a>; <a onClick="return mV(\'Act\',20,24);">20:24</a>; <a onClick="return mV(\'Rom\',9,16);">Ro 9:16</a>; <a onClick="return mV(\'Gal\',2,2);">Ga 2:2</a>; <a onClick="return mV(\'Gal\',5,7);">5:7</a>; <a onClick="return mV(\'Phl\',2,16);">Php 2:16</a>; <a onClick="return mV(\'2Th\',3,1);">2Th 3:1</a>. The second of these passages (<a onClick="return mV(\'Hbr\',12,1);">Heb 12:1</a>) alludes to the necessity for the greatest possible reduction of weight, and for steady concentration of effort. All the passages would remind the first readers of the single-course and double-course foot-races of the games.<P>(f) The Goal.<P>The goal of the foot-race, a square pillar at the end of the stadium opposite the entrance, which the athlete as far as possible kept in view and the sight of which encouraged him to redouble his exertions, is alluded to once: "I press on toward the goal" (<a onClick="return mV(\'Phl\',3,14);">Php 3:14</a>, Greek skopos).<P>(g) The Herald.<P>The name and country of each competitor were announced by a herald and also the name, country and father of a victor. There may be an allusion to this custom in <a onClick="return mV(\'1Cr\',9,27);">1Co 9:27</a>: "after that I have been a herald (Revised Version margins, Greek kerusso) to others"; compare also <a onClick="return mV(\'1Ti\',2,7);">1Ti 2:7</a>; <a onClick="return mV(\'2Ti\',1,11);">2Ti 1:11</a>, where the Greek for "preacher" is kerux, "herald."<P>(h) The Prize.<P>Successful athletes were rewarded at the great games by a wreath consisting in the apostolic age of wild olive (Olympian), parsley (Nemean), laurel (Pythian), or pine (Isthmian). This is referred to in a general way in <a onClick="return mV(\'Phl\',3,14);">Php 3:14</a>, and in <a onClick="return mV(\'1Cr\',9,24);">1Co 9:24</a>: "One receiveth the prize" (Greek in both cases brabeion; compare also <a onClick="return mV(\'Col\',3,15);">Col 3:15</a>: "Let the peace of Christ arbitrate (Revised Version margin) in your hearts," where the verb is brabeuo). The wreath (stephanos) is directly alluded to in <a onClick="return mV(\'1Cr\',9,25);">1Co 9:25</a>: "They (the athletes) do it to receive a corruptible crown"; <a onClick="return mV(\'2Ti\',2,5);">2Ti 2:5</a>: "A man...is not crowned, except he have contended lawfully"; and <a onClick="return mV(\'1Pe\',5,4);">1Pe 5:4</a>: "Ye shall receive the crown of glory that fadeth not away." There may be allusions also in <a onClick="return mV(\'Phl\',4,1);">Php 4:1</a>; <a onClick="return mV(\'1Th\',2,19);">1Th 2:19</a>; <a onClick="return mV(\'Hbr\',2,7,9);">Heb 2:7, 9</a>; <a onClick="return mV(\'Jam\',1,12);">Jas 1:12</a>; <a onClick="return mV(\'Rev\',2,10);">Re 2:10</a>; <a onClick="return mV(\'Rev\',3,11);">3:11</a>. In the palm-bearing multitude of the Apocalypse (<a onClick="return mV(\'Rev\',7,9);">Re 7:9</a>) there is possibly a reference to the carrying of palm-branches by victors at the games. The judges who sat near the goal and who, at Olympia at any rate, had been carefully prepared for their task, may be glanced at in <a onClick="return mV(\'2Ti\',4,8);">2Ti 4:8</a>: "The crown...which the Lord, the righteous judge, shall give to me at that day."<P>(i) Wrestling.<P>This form of sport, which was in great favor in Greek society from the age of Homer onward, is alluded to once in the New Testament: "Our wrestling (Greek pale) is not against flesh and blood," etc. (<a onClick="return mV(\'Eph\',6,12);">Eph 6:12</a>). The exercise made great demands on strength, perseverance and dexterity. There is an indirect allusion in the term palaestra, which first meant "place for wrestling," and then "place for athletic exercises in general" (2Macc 4:14).<P>4. References to the Theater and the Drama:<P>Although there is no direct reference in the New Testament to the intellectual contests in which the Greeks delighted as much as in athletics, the former cannot be entirely ignored. The word "theater" (Greek theatron) occurs 3 times: twice in the sense of "public hall" (<a onClick="return mV(\'Act\',19,29,31);">Ac 19:29, 31</a>); and once with a clear reference to its use as a place of amusement: "We are made a spectacle" (<a onClick="return mV(\'1Cr\',4,9);">1Co 4:9</a>). "The drama was strongly discountenanced by the strict Jews of Palestine, but was probably encouraged to some extent by some of the Jews of the Diaspora, especially in Asia Minor and Alexandria. Philo is known to have witnessed the representation of a play of Euripides, and the Jewish colony to which he belonged produced a dramatic poet named Ezekiel, who wrote inter alia a play on the Exodus, some fragments of which have been preserved (Schurer, GJV4, II, 60; III, 500ff). An inscription found not long ago at Miletus shows that part of theater of that city was reserved for Jews (Deissmann, Light from the Ancient East, 446ff). The readers of the Pauline Epistles, Jews as well as Gentiles, would be generally more or less familiar with theater and the drama. It has been suggested that there is a glimpse of a degraded form of the drama, the mime or mimic play, which was exceedingly popular in the 1st century and afterward, in the mockery of Jesus by the soldiers (<a onClick="return mV(\'Mat\',27,\'27-30\');">Mt 27:27-30</a> parallel <a onClick="return mV(\'Mar\',15,\'16-19\');">Mr 15:16-19</a>). The "king" seems to have been a favorite character with the comic mime. The mockery of the Jewish king, Agrippa I, by the populace of Alexandria, a few years later, which furnishes a very striking parallel to the incident recorded in the Gospels (Schurer, GJV4, I, 497), is directly connected by Philo with the mimes. The subject is very ably discussed by a German scholar, Hermann Reich, in a learned monograph, Der Konig mit der Dornenkrone (1905). Certainty is, of course, unattainable, but it seems at least fairly probable that the rude Syrian soldiers, who were no doubt in the habit of attending theater, may have been echoing some mimic play in their mock homage to "the king of the Jews."<P>LITERATURE.<P>In addition to works already mentioned see for the whole subject: articles "Games" in Smith, DB2; HDB, large and small; EB; Jewish Encyclopedia; arts. "Spiele" in Winer, RWB, and Riehm2, and especially Konig, "Spiele bei den Hebraern," RE3. On the games of Greece and Rome See articles in Smith\'s Dict. of Greek and Roman Antiquities, "Amphitheatrum," "Circus," "Olympia," "Stadium," etc.``162';
isbe[3660]='Gammadim`gam\'-a-dim (gammadhim):<P>The word occurs only in <a onClick="return mV(\'Eze\',27,11);">Eze 27:11</a>, in the King James Version in form "Gammadims," in the English Revised Version "Gammadim." In the American Standard Revised Version, as also in the English Revised Version, margin, it is rendered "valorous men." Some think a proper name is required, but identification is not possible, and the meaning remains doubtful.``1';
isbe[3661]='Gamul`ga\'-mul (gamul, "weaned"):<P>The head of the 22nd of the 24 courses of priests inaugurated by David (<a onClick="return mV(\'1Ch\',24,17);">1Ch 24:17</a>).``1';
isbe[3662]='Gangrene`gan\'-gren (gaggraina, pronounced gan-graina; the King James Version canker):<P>The name was used by the old Greek physicians for an eating ulcer which corrodes the soft parts and, according to Galen, often ends in mortification. Paul compares the corrupting influence of profane babbling or levity, in connection with subjects which ought to be treated with reverence to this disease (<a onClick="return mV(\'2Ti\',2,17);">2Ti 2:17</a>). The old English word "canker" is used by 16th-and 17th-century authors as the name of a caterpillar which eats into a bud. In this sense it occurs 18 times in Shakespeare (e.g. Midsummer Night\'s Dream, II, ii, 3). The canker-worm mentioned 6 times by Joel and Nahum is probably the young stage of Acridium peregrinum, a species of locust. Cankered in <a onClick="return mV(\'Jam\',5,3);">Jas 5:3</a> the King James Version means "rusted" (Greek katiotai), and is so rendered in the Revised Version (British and American). In Susanna verse 52 Coverdale uses the phrase, "O thou old cankered carle," in Daniel\'s address to the elder, where English Versions of the Bible has "waxen old in wickedness." The word is still used in the Scottish dialect and applied to persons who are cross-grained and disagreeable.``107';
isbe[3663]='Gap`The translation of perets, "a breach" (<a onClick="return mV(\'Eze\',13,5);">Eze 13:5</a>, "Ye have not gone up into the gaps," the Revised Version, margin "breaches"; <a onClick="return mV(\'Eze\',22,30);">Eze 22:30</a>, "I sought for a man among them, that should build up the wall, and stand in the gap before me for the land"). Said of prophets who failed to stand up for the right and to strengthen and preserve the people.``1';
isbe[3664]='Gar`gar: the King James Version for <a href="study/isbe/search.html?string=GAS">GAS</a> (which see).``1';
isbe[3665]='Garden`gar\'-d\'-n (gan, gannah, ginnah; kepos): The Arabic jannah (diminutive, jannainah), like the Hebrew gannah, literally, "a covered or hidden place," denotes in the mind of the dweller in the East something more than the ordinary garden. Gardens in Biblical times, such as are frequently referred to in Semitic literature, were usually walled enclosures, as the name indicates (<a onClick="return mV(\'Lam\',2,6);">La 2:6</a> the American Revised Version, margin), in which there were paths winding in and out among shade and fruit trees, canals of running water, fountains, sweet-smelling herbs, aromatic blossoms and convenient arbors in which to sit and enjoy the effect. These gardens are mentioned in <a onClick="return mV(\'Gen\',2,\'1-\');">Ge 2</a> and <a onClick="return mV(\'Gen\',3,\'1-\');">Ge 3</a>; <a onClick="return mV(\'Gen\',13,10);">13:10</a>; <a onClick="return mV(\'Sgs\',4,\'12-16\');">So 4:12-16</a>; <a onClick="return mV(\'Ecc\',2,5,6);">Ec 2:5-6</a>; <a onClick="return mV(\'Eze\',28,13);">Eze 28:13</a>; <a onClick="return mV(\'Eze\',31,8,9);">31:8-9</a>; <a onClick="return mV(\'Eze\',36,35);">36:35</a>; <a onClick="return mV(\'Joe\',2,3);">Joe 2:3</a>. Ancient Babylonian, Assyrian and Egyptian records show the fondness of the rulers of these countries for gardens laid out on a grand scale and planted with the rarest trees and plants. The drawings made by the ancients of their gardens leave no doubt about their general features and their correspondence with Biblical gardens. The Persian word pardec (paradeisos) appears in the later Hebrew writings to denote more extensive gardens or parks. It is translated "orchards" in <a onClick="return mV(\'Ecc\',2,5);">Ec 2:5</a> the King James Version; <a onClick="return mV(\'Sgs\',4,13);">So 4:13</a>.<P>See <a href="study/isbe/search.html?string=PARADISE">PARADISE</A>.<P>Such gardens are still common throughout the Levant. They are usually situated on the outskirts of a city (compare <a onClick="return mV(\'Jhn\',18,1,26);">Joh 18:1, 26</a>; <a onClick="return mV(\'Jhn\',19,41);">19:41</a>), except in the case of the more pretentious estates of rich pashas or of the government seats (compare <a onClick="return mV(\'2Ki\',21,18);">2Ki 21:18</a>; <a onClick="return mV(\'Est\',1,5);">Es 1:5</a>; <a onClick="return mV(\'Est\',7,7,8);">7:7-8</a>; <a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>; <a onClick="return mV(\'2Ki\',25,4);">2Ki 25:4</a>; <a onClick="return mV(\'Jer\',39,4);">Jer 39:4</a>; <a onClick="return mV(\'Jer\',52,7);">52:7</a>). They are enclosed with walls of mud blocks, as in Damascus, or stone walls capped with thorns, or with hedges of thorny bushes (compare <a onClick="return mV(\'Lam\',2,6);">La 2:6</a> the American Revised Version, margin), or prickly pear. In nearly treeless countries, where there is no rain during 4 or 5 months, at least, of the year, the gardens are often the only spots where trees and other vegetation can flourish, and here the existence of vegetation depends upon the water supply, brought in canals from streams, or raised from wells by more or less crude lifting machines (compare <a onClick="return mV(\'Num\',24,7);">Nu 24:7</a>). Such references as <a onClick="return mV(\'Gen\',2,10);">Ge 2:10</a>; <a onClick="return mV(\'Num\',24,6);">Nu 24:6</a>; <a onClick="return mV(\'Deu\',11,10);">De 11:10</a>; <a onClick="return mV(\'Isa\',1,30);">Isa 1:30</a>; <a onClick="return mV(\'Isa\',58,11);">58:11</a>; <a onClick="return mV(\'Sgs\',4,15);">So 4:15</a> indicate that in ancient times they were as dependent upon irrigation in Biblical lands as at present. The planning of their gardens so as to utilize the water supplies has become instinctive with the inhabitants of Palestine and Syria. The writer has seen a group of young Arab boys modeling a garden out of mud and conducting water to irrigate it by channels from a nearby canal, in a manner that a modern engineer would admire. Gardens are cultivated, not only for their fruits and herbs (compare <a onClick="return mV(\'Sgs\',6,11);">So 6:11</a>; <a onClick="return mV(\'Isa\',1,8);">Isa 1:8</a>; <a onClick="return mV(\'1Ki\',21,2);">1Ki 21:2</a>) and shade (compare <a onClick="return mV(\'Sgs\',6,11);">So 6:11</a>; <a onClick="return mV(\'Luk\',13,19);">Lu 13:19</a>), but they are planned to serve as dwelling-places during the summer time when the houses are hot and stuffy. That this was an ancient practice is indicated by <a onClick="return mV(\'Sgs\',5,2);">So 5:2</a>; <a onClick="return mV(\'Sgs\',6,2);">6:2</a>; <a onClick="return mV(\'Sgs\',8,13);">8:13</a>. A shaded garden, the air laden with the ethereal perfumes of fruits and flowers, accompanied by the music of running water, a couch on which to sit or recline, suggest a condition of bliss dear to the Oriental. Only one who has traveled for days in a dry, glaring desert country and has come upon a spot like the gardens of such a city as Damascus, can realize how near like paradise these gardens can appear. Mohammed pictured such a place as the future abode of his followers<P>No doubt the remembrances of his visit to Damascus were fresh in his mind when he wrote. El-Jannah is used by the Moslems to signify the "paradise of the faithful."<P>Gardens were used as places of sacrifice, especially in heathen worship (<a onClick="return mV(\'Isa\',1,29);">Isa 1:29</a>; <a onClick="return mV(\'Isa\',65,3);">65:3</a>; <a onClick="return mV(\'Isa\',66,17);">66:17</a>). They sometimes contained burial places (<a onClick="return mV(\'2Ki\',21,18,26);">2Ki 21:18, 26</a>; <a onClick="return mV(\'Jhn\',19,41);">Joh 19:41</a>).<P>Figurative: The destruction of gardens typified desolation (<a onClick="return mV(\'Amo\',4,9);">Am 4:9</a>); on the other hand, fruitful gardens figured prosperity (<a onClick="return mV(\'Num\',24,6);">Nu 24:6</a>; <a onClick="return mV(\'Job\',8,16);">Job 8:16</a>; <a onClick="return mV(\'Isa\',51,3);">Isa 51:3</a>; <a onClick="return mV(\'Isa\',58,11);">58:11</a>; <a onClick="return mV(\'Isa\',61,11);">61:11</a>; <a onClick="return mV(\'Jer\',29,5,28);">Jer 29:5, 28</a>; <a onClick="return mV(\'Jer\',31,12);">31:12</a>; <a onClick="return mV(\'Amo\',9,14);">Am 9:14</a>).``133';
isbe[3666]='Garden, the King\'s`Mention is made of "the king\'s garden" in <a onClick="return mV(\'2Ki\',25,4);">2Ki 25:4</a>; <a onClick="return mV(\'Jer\',39,4);">Jer 39:4</a>; <a onClick="return mV(\'Jer\',52,7);">52:7</a> (fundamentally the same passage), in connection with the flight of Zedekiah from Jerusalem; and again in <a onClick="return mV(\'Neh\',3,15);">Ne 3:15</a>. The last passage shows that the "garden" was at the pool of Siloah (the Revised Version (British and American) "Shelah"), at the mouth of Tyropeon, near the "fountain gate." This would seem to be "the gate between the two walls which was by the king\'s garden" of the passages in 2 Kings and Jeremiah (compare <a onClick="return mV(\'2Ch\',32,5);">2Ch 32:5</a>). On the topography, see <a href="study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</A>; also Robinson, Palestine, II, 142. Arnold (in Herzog) thinks the garden is probably identical with "the garden of Uzza" of <a onClick="return mV(\'2Ki\',21,18,26);">2Ki 21:18, 26</a>.``132';
isbe[3667]='Garden-House`(beth ha-gan):<P>A place mentioned in describing the flight of Ahaziah, king of Judah, from Jehu (<a onClick="return mV(\'2Ki\',9,27);">2Ki 9:27</a>). Probably we ought not to translate the Hebrew, but take it as a proper name, <a href="study/isbe/search.html?string=BETH-HAGGAN">BETH-HAGGAN</a> (which see). If he fled southward, the town might possibly be Jenin, <a href="study/isbe/search.html?string=EN-GANNIM">EN-GANNIM</a>, which see.``1';
isbe[3668]='Gardener`gar\'-d\'-n-er (kepouros):<P>"Gardener" occurs once in the English Versions of the Bible (<a onClick="return mV(\'Jhn\',20,15);">Joh 20:15</a>), the translation of kepos and ouros, "warden" or "keeper." It is likely that the man referred to was the watchman or keeper (Arabic natur; Hebrew notser), corresponding to those mentioned in <a onClick="return mV(\'2Ki\',17,9);">2Ki 17:9</a>; <a onClick="return mV(\'2Ki\',18,8);">18:8</a>; <a onClick="return mV(\'Job\',27,18);">Job 27:18</a>, etc., and not one who did the manual labor. It is the common practice in Palestine today to set a watchman over a garden during its productive season.`<a href="./study/isbe/search.html?string=WATCHMAN">WATCHMAN</a>`1';
isbe[3669]='Gareb`ga\'-reb (garebh):<P>One of David\'s "mighty men of the armies" (<a onClick="return mV(\'2Sa\',23,38);">2Sa 23:38</a>; <a onClick="return mV(\'1Ch\',11,40);">1Ch 11:40</a>), an "Ithrite," i.e. a member of one of the families of Kiriath-jearim (<a onClick="return mV(\'1Ch\',2,53);">1Ch 2:53</a>). Some, however, read ha-yattiri for ha-yithri, thus making him a native of Jattir.`<a href="./study/isbe/search.html?string=IRA">IRA</a>`1';
isbe[3670]='Gareb, the Hill of`ga\'-reb, (garebh):<P>A hill in the neighborhood of Jerusalem, which was one of the landmarks to which the prophet Jeremiah (<a onClick="return mV(\'Jer\',31,39);">31:39</a>) foresaw that the city should extend. The site is unknown. Cheyne (Encyclopedia Biblica) would connect this with the "mountain that lieth before the valley of Hinnom westward" (<a onClick="return mV(\'Jos\',15,8);">Jos 15:8</a>), but this is too far south; it is inconceivable that the prophet could have imagined the city extending so far in this direction; most probably the hill was to the north—the one natural direction for the city\'s extension—and is now incorporated in the modern suburbs.``117';
isbe[3671]='Garizim`gar\'-i-zim.`<a href="./study/isbe/search.html?string=GERIZIM">GERIZIM</a>`1';
isbe[3672]='Garland`gar\'-land (stemma, "wreath"):<P>Mentioned only in <a onClick="return mV(\'Act\',14,13);">Ac 14:13</a>, where it is said that the priest of Jupiter brought oxen and garlands unto the gates with which to offer sacrifices unto Barnabas and Paul. The rendering "oxen and garlands," instead of "oxen garlanded," seems to imply that the garlands were for the priests and altar and worshippers themselves, as well as for the victims sacrificed. Only occasionally did the Hebrews use such ornaments for themselves, and that almost altogether in their later history.`<a href="./study/isbe/search.html?string=CROWN">CROWN</a>`1';
isbe[3673]='Garlic`gar\'-lik (shum, used only in plural shumim; compare Arabic thum):<P>One of the delights of Egypt for which the Israelites in the Wilderness longed (<a onClick="return mV(\'Num\',11,5);">Nu 11:5</a>); we know from other sources that, though originally a product of Central Asia, garlic was known to the ancient Egyptians. It is the bulb of Allium sativum, Natural Order Liliaceae, and is cultivated all over the Orient. It is eaten cooked in stews; its disagreeable penetrating odor is in evidence in the houses and on the breath of most Orientals. A bulb of garlic, hung over a bed or over the door of a house, is a powerful charm against the evil eye and other malign influences.``117';
isbe[3674]='Garment`gar\'-ment.`<a href="./study/isbe/search.html?string=DRESS">DRESS</a>`1';
isbe[3675]='Garmite`gar\'-mit (garmi):<P>A gentilic name applied to Keilah in <a onClick="return mV(\'1Ch\',4,19);">1Ch 4:19</a>.<P>The reason for this is not known.``1';
isbe[3676]='Garner`gar\'-ner (mazu; apotheke):<P>"Garners," derived from zawah, "to gather," occurs in <a onClick="return mV(\'Psa\',144,13);">Ps 144:13</a>; \'otsar is similarly translated in <a onClick="return mV(\'Joe\',1,17);">Joe 1:17</a>. In the New Testament apotheke is twice translated "garner" (<a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>; <a onClick="return mV(\'Luk\',3,17);">Lu 3:17</a>).<P>The same word is translated "barns" in <a onClick="return mV(\'Mat\',6,26);">Mt 6:26</a>; <a onClick="return mV(\'Mat\',13,30);">13:30</a>; <a onClick="return mV(\'Luk\',12,18,24);">Lu 12:18, 24</a>.``1';
isbe[3677]='Garnish`gar\'-nish (tsippah, shiphrah; kosmeo):<P>The word is used twice in the Old Testament. In <a onClick="return mV(\'2Ch\',3,6);">2Ch 3:6</a>, tsippah means "to overlay," or "to plate." Thus, he "garnished" the house or "overlaid" it, "studded" it, with precious stones, and thus adorned and beautified it. In <a onClick="return mV(\'Job\',26,13);">Job 26:13</a>, shiphrah is a feminine noun meaning "fairness," "beauty," "brilliancy." "By his Spirit the heavens are garnished," i.e. the clouds are driven off by the wind or breath of Yahweh, and the sky made bright and clear.<P>In the New Testament (<a onClick="return mV(\'Mat\',12,44);">Mt 12:44</a>; <a onClick="return mV(\'Mat\',23,29);">23:29</a>) the word kosmeo means "set in order," "make ready," "adorn," etc. In <a onClick="return mV(\'Mat\',25,7);">Mt 25:7</a> it is translated "trimmed," and in <a onClick="return mV(\'Rev\',21,19);">Re 21:19</a> "adorned."``146';
isbe[3678]='Garrison`gar\'-i-s\'-n.`<a href="./study/isbe/search.html?string=WAR;+WARFARE">WAR</a>`1';
isbe[3679]='Gas`gas (Gas):<P>Named among the "sons of the servants of Solomon" (1Esdras 5:34); not mentioned in the lists of Ezra and Nehemiah.``1';
isbe[3680]='Gashmu`gash\'-mu, gash\'-moo (gashmu):<P>A form of the name <a href="study/isbe/search.html?string=GESHEM">GESHEM</a> (which see), found in <a onClick="return mV(\'Neh\',6,6);">Ne 6:6</a> (compare <a onClick="return mV(\'Neh\',6,1);">Ne 6:1</a>), "And Gashmu saith it." According to BDB the same termination -u is found in Nabatean proper names.``1';
isbe[3681]='Gatam`ga\'-tam (ga\'tam):<P>An Edomite chief, grandson of Esau (<a onClick="return mV(\'Gen\',36,11,16);">Ge 36:11, 16</a>; <a onClick="return mV(\'1Ch\',1,36);">1Ch 1:36</a>).``1';
