>Ga 3:10-24</a>); and<P>(b) that instead of completing the work of faith, its part in the Divine economy was subordinate (<a onClick="return mV(\'Gal\',3,\'19-25\');">Ga 3:19-25</a>).<P>It was a temporary provision, due to man\'s sinful unripeness for the original covenant (<a onClick="return mV(\'Gal\',3,19,24);">Ga 3:19, 24</a>; <a onClick="return mV(\'Gal\',4,4);">4:4</a>). The Spirit of sonship, now manifested in the Gentiles, is the infallible sign that the promise made to mankind in Abraham has been fulfilled. The whole position of the legalists is undermined by the use the apostle makes of the Abrahamic covenant.<P>4. The Personal Question:<P>The religious and the personal questions of the epistle are bound up together; this <a onClick="return mV(\'Gal\',5,2);">Ga 5:2</a> clearly indicates. The latter naturally emerges first (<a onClick="return mV(\'Gal\',1,1,11);">1:1, 11</a>ff). Paul\'s authority must be overthrown, if his disciples are to be Judaized. Hence, the campaign of detraction against him (compare <a onClick="return mV(\'2Cr\',10,\'1-\');">2Co 10-12</a>). The line of defense indicates the nature of the attack. Paul was said to be a second-hand, second-rate apostle, whose knowledge of Christ and title to preach Him came from Cephas and the mother church. In proof of this, an account was given of his career, which he corrects in <a onClick="return mV(\'Gal\',1,\'13-\');">Ga 1:13</a> - <a onClick="return mV(\'Gal\',2,\'1-21\');">2:21</a>. "Cephas" was held up (compare <a onClick="return mV(\'1Cr\',1,12);">1Co 1:12</a>) as the chief of the apostles, whose primacy Paul had repeatedly acknowledged; and "the pillars" at Jerusalem were quoted as maintainers of Mosaic rule and authorities for the additions to be made to Paul\'s imperfect gospel. Paul himself, it was insinuated, "preaches circumcision" where it suits him; he is a plausible time-server (<a onClick="return mV(\'Gal\',1,10);">Ga 1:10</a>; <a onClick="return mV(\'Gal\',5,11);">5:11</a>; compare <a onClick="return mV(\'Act\',16,3);">Ac 16:3</a>; <a onClick="return mV(\'1Cr\',9,\'19-21\');">1Co 9:19-21</a>). The apostle\'s object in his self-defense is not to sketch his own life, nor in particular to recount his visits to Jerusalem, but to prove his independent apostleship and his consistent maintenance of Gentile rights. He states, therefore, what really happened on the critical occasions of his contact with Peter and the Jerusalem church. To begin with, he received his gospel and apostolic office from Jesus Christ directly, and apart from Peter (<a onClick="return mV(\'Gal\',1,\'13-20\');">Ga 1:13-20</a>); he was subsequently recognized by "the pillars" as apostle, on equality with Peter (<a onClick="return mV(\'Gal\',2,\'6-9\');">Ga 2:6-9</a>); he had finally vindicated his doctrine when it was assailed, in spite of Peter (<a onClick="return mV(\'Gal\',2,\'11-12\');">Ga 2:11-12</a>). The adjustment of Paul\'s recollections with Luke\'s narrative is a matter of dispute, in regard both to the conference of <a onClick="return mV(\'Gal\',2,\'1-10\');">Ga 2:1-10</a> and the encounter of <a onClick="return mV(\'Gal\',2,\11-21\');">2:11-21</a>; to these points we shall return, iv.3 (4), (5).<P>C) Characteristics:<P>1. Idiosyncrasy of the Epistle:<P>This is a letter of expostulation. Passion and argument are blended in it. Hot indignation and righteous scorn (<a onClick="return mV(\'Gal\',1,\'7-9\');">Ga 1:7-9</a>; <a onClick="return mV(\'Gal\',4,17);">4:17</a>; <a onClick="return mV(\'Gal\',5,10,12);">5:10, 12</a>; <a onClick="return mV(\'Gal\',6,12,13);">6:12-13</a>), tender, wounded affection (<a onClick="return mV(\'Gal\',4,\'11-20\');">Ga 4:11-20</a>), deep sincerity and manly integrity united with the loftiest consciousness of spiritual authority (<a onClick="return mV(\'Gal\',1,\'10-12\',20);">Ga 1:10-12, 20</a>; <a onClick="return mV(\'Gal\',2,\'4-6\',14);">2:4-6, 14</a>; <a onClick="return mV(\'Gal\',5,2);">5:2</a>; <a onClick="return mV(\'Gal\',6,17);">6:17</a>), above all a consuming devotion to the person and cross of the Redeemer, fill these few pages with an incomparable wealth and glow of Christian emotion. The power of mind the epistle exhibits matches its largeness of heart. Romans indeed carries out the argument with greater breadth and theoretic completeness; but Galatians excels in pungency, incisiveness, and debating force. The style is that of Paul at the summit of his powers. Its spiritual elevation, its vigor and resource, its subtlety and irony, poignancy and pathos, the vis vivida that animates the whole, have made this letter a classic of religious controversy. The blemishes of Paul\'s composition, which contribute to his mastery of effect, are conspicuous here—his abrupt turns and apostrophes, and sometimes difficult ellipses (<a onClick="return mV(\'Gal\',2,\'4-10\',20);">Ga 2:4-10, 20</a>; <a onClick="return mV(\'Gal\',4,\'16-20\');">4:16-20</a>; <a onClick="return mV(\'Gal\',5,13);">5:13</a>), awkward parentheses and entangled periods (<a onClick="return mV(\'Gal\',2,\'1-10\',18);">Ga 2:1-10, 18</a>; <a onClick="return mV(\'Gal\',3,16,20);">3:16, 20</a>; <a onClick="return mV(\'Gal\',4,25);">4:25</a>), and outburst of excessive vehemence (<a onClick="return mV(\'Gal\',1,8,9);">Ga 1:8-9</a>; <a onClick="return mV(\'Gal\',5,12);">5:12</a>).<P>2. Jewish Coloring:<P>The anti-legalist polemic gives a special Old Testament coloring to the epistle; the apostle meets his adversaries on their own ground. In <a onClick="return mV(\'Gal\',3,16,19,20);">Ga 3:16, 19-20</a>; <a onClick="return mV(\'Gal\',4,\'21-31\');">4:21-31</a>, we have examples of the rabbinical exegesis Paul had learned from his Jewish masters. These texts should be read in part as argumenta ad hominem; however peculiar in form such Pauline passages may be, they always contain sound reasoning.<P>III. Relations to Other Epistles.<P>(1) The connection of Galatians with Romans is patent; it is not sufficiently understood how pervasive that connection is and into what manifold detail it extends. The similarity of doctrine and doctrinal vocabulary manifest in <a onClick="return mV(\'Gal\',2,\'13-\');">Ga 2:13-6:16</a> and <a onClick="return mV(\'Rom\',1,\'16-\');">Ro 1:16-8:39</a> is accounted for by the Judaistic controversy on which Paul was engaged for so long, and by the fact that this discussion touched the heart of his gospel and raised questions in regard to which his mind was made up from the beginning (<a onClick="return mV(\'Rom\',1,15,16);">1:15,16</a>), on which he would therefore always express himself in much the same way. Broadly speaking, the difference is that Romans is didactic and abstract, where Galatians is personal and polemical; that the former presents, a measured and rounded development of conceptions projected rapidly in the latter under the stress of controversy. The emphasis lies in Romans on justification by faith; in Galatians on the freedom of the Christian man. The contrast of tone is symptomatic of a calmer mood in the writer—the lull which follows the storm; it suits the different address of the two epistles.<P>1. Galatians and Romans:<P>Besides the correspondence of purport, there is a verbal resemblance to Romans pervading the tissue of Galatians, and traceable in its mannerisms and incidental expressions. Outside of the identical quotations, we find more than 40 Greek locutions, some of them rare in the language, common to these two and occurring in these only of Paul\'s epistles—including the words rendered "bear" (<a onClick="return mV(\'Rom\',11,18);">Ro 11:18</a> and <a onClick="return mV(\'Gal\',5,10);">Ga 5:10</a>, etc.); "blessing" or "gratulation" (makarismos), "divisions" (<a onClick="return mV(\'Rom\',16,17);">Ro 16:17</a>; <a onClick="return mV(\'Gal\',5,20);">Ga 5:20</a>); "fail" or "fall from" (ekpipto); "labor on" or "upon" (of persons), "passions" (pathemata, in this sense); "set free" or "deliver" (eleutheroo); "shut up" or "conclude," and "shut out" or "exclude"; "travail (together)," and such phrases as "die to" (with dative), "hearing of faith," "if possible," "put on (the Lord Jesus) Christ," "those who do such things," "what saith the Scripture?" "where then?" (rhetorical), "why any longer?" The list would be greatly extended by adding expressions distinctive of this pair of letters that occur sporadically elsewhere in Paul. The kinship of Galatians-Romans in vocabulary and vein of expression resembles that existing between Colossians-Ephesians or 1 and 2 Thessalonians; it is twice as strong proportionately as that of 1 and 2 Corinthians. Not only the same current of thought, but with it, much the same stream of language was running through Paul\'s mind in writing these two epistles.<P>The association of Galatians with the two Corinthian letters, though less intimate than that of Galatians-Romans, is unmistakable.<P>2. Links with 1 and 2 Corinthians:<P>We count 23 distinct locations shared by 2 Corinthians alone (in its 13 chapters) with Galatians, and 20 such shared with 1 Corinthians (16 chapters)—a larger proportion for the former. Among the Galatians-1 Corinthians peculiarities are the sayings, "A little leaven," etc., "circumcision is nothing," etc., and the phrases, "be not deceived," "it is manifest" (delon as predicate to a sentence), "known by God," "profit nothing" and "to be something," "scandal of the cross," "the spiritual" (of persons), "they that are Christ\'s (of Christ Jesus)." Peculiar to Ga through 2Co are "another gospel" and "false brethren," "brings into bondage," "devour" and "zealously seek" or "am jealous over" (of persons); "a new creation," "confirm" or "ratify" (kuroo); "I am perplexed," the antithesis of "sowing" and "reaping" (figuratively); the phrase "on the contrary" or "contrariwise" (t\'ounantion), etc. The conception of the "two covenants" (or "testaments") is conspicuous in both epistles (<a onClick="return mV(\'Gal\',3,\'17-21\');">Ga 3:17-21</a>; <a onClick="return mV(\'Gal\',4,\'21-31\');">4:21-31</a>; <a onClick="return mV(\'2Cr\',3,\'8-18\');">2Co 3:8-18</a>), and does not recur in Paul; in each case the ideas of "law" (or "letter"), "bondage," "death," are associated with the one, diatheke, of "spirit," "freedom," "life," with the other. <a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a> ("Christ...made a curse for us") is matched by <a onClick="return mV(\'2Cr\',5,21);">2Co 5:21</a> ("made sin for us"); in <a onClick="return mV(\'Gal\',2,19);">Ga 2:19</a> and <a onClick="return mV(\'Gal\',6,14);">6:14</a> we find Paul "crucified to the world" in the cross of his Master and "Christ" alone "living in" him; in <a onClick="return mV(\'2Cr\',5,14,15);">2Co 5:14-15</a> this experience becomes a universal law for Christians; and where in <a onClick="return mV(\'Gal\',6,17);">Ga 6:17</a> the apostle appears as \'from hence-forth...bearing in\' his \'body the brand of Jesus,\' in <a onClick="return mV(\'2Cr\',4,10);">2Co 4:10</a> he is "always bearing about in" his "body the dying of Jesus."<P>These identical or closely congruous trains of thought and turns of phrase, varied and dominant as they are, speak for some near connection between the two writings. By its list of vices in <a onClick="return mV(\'Gal\',5,19,20);">Ga 5:19, 20</a> Galatians curiously, and somewhat intricately, links itself at once with 2 Corinthians and Romans (see <a onClick="return mV(\'2Cr\',12,20);">2Co 12:20</a>; <a onClick="return mV(\'Rom\',13,13);">Ro 13:13</a>; <a onClick="return mV(\'Rom\',16,17);">16:17</a>). Galatians is allied by argument and doctrine with Romans, and by temper and sentiment with 2 Corinthians. The storm of feeling agitating our epistle blows from the same quarter, reaches the same height, and engages the same emotions with those which animate <a onClick="return mV(\'2Cr\',10,\'1-\');">2 Corinthians 10-13</a>.<P>3. With the Corinthians-Romans Group:<P>If we add to the 43 locutions confined in the Pauline Epistles to Galatians-Romans the 23 such of Galatians-2 Corinthians, the 20 of Galatians-1 Corinthians, the 14 that range over Galatians-Romans-2 Corinthians, the 15 of Galatians-Romans-1 Corinthians, the 7 of Galatians-1-2 Corinthians, and the 11 running through all four, we get a total of 133 words or phrases (apart from Old Testament quotations) specific to Galatians in common with one or more of the Corinthians-Romans group—an average, that is, of close upon 3 for each chapter of those other epistles.<P>With the other groups of Pauline letters Galatians is associated by ties less numerous and strong, yet marked enough to suggest, in conjunction with the general style, a common authorship.<P>4. With Other Groups of Epistles:<P>The proportion of locutions peculiar to Galatians and the 3rd group (Colossians-Philemon-Ephesians-Philippians) <span class="noTag">is</span> 1 to each of their 15 chapters. The more noticeable of these are in Galatians-Colossians: "elements of the world," and the maxim, "There is no Jew nor Greek," etc., associated with the "putting on of Christ" ("the new man"); "fullness of the time" (or "seasons") and "householders of faith (of God)," also "Christ loved me (the church) and gave up himself for me (her)," in Galatians-Ephesians; "he that supplieth (your supplying of, epichoregia) the Spirit," and "vain-glory" (kenodoxia), in Galatians-Philippians; "redeem" (exagorazo) and "inheritance" are peculiar to Galatians with Colossians-Ephesians together; the association of the believer\'s "inheritance" with "the Spirit" in Galatians-Ephesians is a significant point of doctrinal identity.<P>The Thessalonians and Timothy-Titus (1st and 4th) groups are outliers in relation to Galatians, judged by vocabulary. There is little to associate our epistle with either of these combinations, apart from pervasive Corinthians-Romans phrases and the Pauline complexion. There are 5 such expressions registered for the 8 chapters of 1 and 2 Thessalonians, 7 for the 13 of 1 and 2 Timothy and Titus—just over one to two chapters for each group. While the verbal coincidences in these two cases are, proportionately, but one-half so many as those connecting Galatians with the 3rd group of epistles and one-fifth or one-sixth of those linking it to the 2nd group, they are also less characteristic; the most striking is the contrast of "well-doing" (kalopoieo) with "fainting" or "wearying" (egkakeo) in <a onClick="return mV(\'Gal\',6,9);">Ga 6:9</a> and <a onClick="return mV(\'2Th\',3,13);">2Th 3:13</a>.<P>5. General Comparison:<P>No other writing of Paul reflects the whole man so fully as this—his spiritual, emotional, intellectual, practical, and even physical, idiosyncrasy. We see less of the apostle\'s tenderness, but more of his strength than in Philippians; less of his inner, mystic experiences, more of the critical turns of his career; less of his "fears," more of his "fightings," than in 2 Corinthians. While the 2nd letter to Timothy lifts the curtain from the closing stage of the apostle\'s ministry, Galatians throws a powerful light upon its beginning. The Pauline theology opens to us its heart in this document. The apostle\'s message of deliverance from sin through faith in the crucified Redeemer, and of the new life in the Spirit growing from this root, lives and speaks; we see it in Galatians as a working and fighting theology, while in Romans it peacefully expands into an ordered system. The immediately saving truth of Christianity, the gospel of the Gospel, finds its most trenchant utterance in this epistle; here we learn "the word of the cross" as Paul received it from the living Saviour, and defended it at the crisis of his work.<P>IV. The Destination and Date.<P>1. Place and Time Interdependent:<P>The question of the people to whom, is bound up with that of the time at which, the Epistle to the Galatians was written. Each goes to determine the other. The expression "the first time" (to proteron) of <a onClick="return mV(\'Gal\',4,13);">Ga 4:13</a> presumes Paul to have been twice with the readers previously—for the first occasion, see <a onClick="return mV(\'Gal\',4,13,14,15);">4:13-15</a>; for the second, <a onClick="return mV(\'Gal\',1,9);">1:9</a>; <a onClick="return mV(\'Gal\',5,3);">5:3</a>. The explanation of Round (Date of the Epistle to Galatians, 1906), that the apostle intended to distinguish his first arrival at the several (south) Galatian cities from his return in the course of the same journey (<a onClick="return mV(\'Act\',14,\'21-23\');">Ac 14:21-23</a>), cannot be accepted: Derbe, the limit of the expedition, received Paul and Barnabas but once on that round, and in retracing their steps the missionaries were completing an interrupted work, whereas <a onClick="return mV(\'Gal\',4,13);">Ga 4:13</a> implies a second, distinct visitation of the churches concerned as a whole; in <a onClick="return mV(\'Act\',15,36);">Ac 15:36</a> Paul looks back to the journey of <a onClick="return mV(\'Act\',13,\'14-\');">Ac 13:14</a> -<a onClick="return mV(\'Act\',14,\'1-26\');">14:26</a> as one event.<P>Now the apostle revisited the south Galatian churches in starting on the 2nd missionary tour (<a onClick="return mV(\'Act\',16,\'1-5\');">Ac 16:1-5</a>). Consequently, if his "Galatians" were Christians of Pisidian Antioch, Iconium, Lystra and Derbe (the South Galatian hypothesis), the letter was written in the further course of the 2nd tour—from Macedonia or Corinth about the time of 1 and 2 Thessalonians (so Zahn, Introduction to the New Testament, I, English translation), or from Antioch in the interval between the 2nd and 3rd journeys (so Ramsay); for on this latter journey (<a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>) Paul (ex hyp.) traversed \'the (south) Galatian country\' a third time. On the other hand, if they were people of Galatia proper, i.e. of North (Old) Galatia, the epistle cannot be earlier than the occasion of <a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>, when Paul touched a second time "the Galatian country," which, on this supposition, he had evangelized in traveling from south Galatia to Troas during the previous tour (<a onClick="return mV(\'Act\',16,\'6-8\');">Ac 16:6-8</a>). On the North Galatian hypothesis, the letter was dispatched from Ephesus during Paul\'s long residence there (<a onClick="return mV(\'Act\',19,\'1-\');">Ac 19</a>; so most interpreters, ancient and modern), in which case it heads the 2nd group of the epistles; or later, from Macedonia or Corinth, and shortly before the writing of the Epistle to the Romans (thus Lightfoot, Salmon, A. L. Williams and others).<P>Per contra, the earlier date, if proved independently, carries with it the South Galatian, the later date the North Galatian theory. The subscription of the Textus Receptus of the New Testament "written from Rome," rests on inferior manuscript authority and late Patristic tradition. Clement, with no suggestion as to place of origin, assigns to the writing a date subsequent to the termination of the 3rd missionary tour (55 or 57 AD), inasmuch as the epistle reflects the controversy about the Law, which in Romans is comparatively mild, at an acute, and, therefore (he supposes), an advanced stage.<P>2. Internal Evidence:<P>Lightfoot (chapter iii of Introduction to Commentary) placed Galatians in the 2nd group of the epistles between 2 Corinthians and Romans, upon considerations drawn from "the style and character" of the epistle. His argument might be strengthened by a detailed linguistic analysis (see III, 1-3, above). The more minutely one compares Galatians with Romans and 1 and 2 Corinthians, the more these four are seen to form a continuous web, the product of the same experience in the writer\'s mind and the same situation in the church. This presumption, based on internal evidence, must be tested by examination of the topographical and chronological data.<P>3. External Data:<P>(1) Galatia and the Galatians.<P>The double sense of these terms obtaining in current use has been shown in the article on <a href="study/isbe/search.html?string=GALATIA">GALATIA</a>; Steinmann sets out the evidence at large in his essay on Der Leserkreis des Galaterbriefes, 61-76 (1908); see also A. L. Williams\' Introduction to Galatians in Cambr. Greek Test. (1910). Roman authors of the period in using these expressions commonly thought of provincial Galatia (NOTE: Schurer seems to be right, however, in maintaining that "Galatia" was only the abbreviated designation for the province, named a parte potiori, and that in more formal description it was styled "Galatia, Pisidia, Phrygia," etc.) which then embraced in addition to Galatia proper a large tract of Southern Phrygia and Lycaonia, reaching from Pisidian Antioch in the west to Derbe in the east; but writers of Asia Minor leaned to the older local and national usage, according to which "Galatia" signified the north-central highlands of the peninsula, on both sides of the river Halys, in which the invading Galatae had settled long before this time. (On their history see the previous article [<a href="./study/isbe/search.html?string=GALATIANS">Galatians</a>]) It is asserted that Paul strictly followed the official, as against the popular, usus loquendi in these matters—a questionable dictum (see A. L. Williams, op. cit., xix, xx, or Steinmann\'s Leserkreis, 78-104), in view of <a onClick="return mV(\'Gal\',1,21,22);">Ga 1:21-22</a> (note the Greek double article), to go no farther. There was nothing in Paul\'s Roman citizenship to make him a precisian in a point like this. Ramsay has proved that all four cities of <a onClick="return mV(\'Act\',13,\'14-\');">Ac 13:14</a> - <a onClick="return mV(\'Act\',14,\'1-23\');">14:23</a> were by this time included in provincial Galatia. Their inhabitants might therefore, officially, be styled "Galatians" (Galatae); it does not follow that this was a fit or likely compilation for Paul to use. Julicher says this would have been a piece of "bad taste" on his part. The attachment of the southern districts (Phrygian, Pisidian, Lycaonian) to Galatia was recent—Derbe had been annexed so late as the year 41—and artificial. Supposing that their Roman "colonial" rank made the designation "Galatians" agreeable to citizens of Antioch or Lystra, there was little in it to appeal to Iconians or Derbeans (compare Schmiedel, in EB, col. 1604).<P>(2) Prima Facie Sense of <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>.<P>The "Galatian country" (Galatike chora) is mentioned by Luke, with careful repetition, in <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a> and <a onClick="return mV(\'Act\',18,23);">18:23</a>. Luke at any rate was not tied to imperial usage; he distinguishes "Phrygia" from "Asia" in <a onClick="return mV(\'Act\',2,9,10);">Ac 2:9-10</a>, although Phrygia was administratively parceled out between Asia and Galatia. When therefore "Asia" is opposed in <a onClick="return mV(\'Act\',166);">16:6</A> to "the Phrygian and Galatian country" (or "Phrygia and Galatian country," Zahn), we presume that the three terms of locality bear alike a non-official sense, so that the "Galatian country" means Old Galatia (or some part of it) lying to the northeast, as "Asia" means the narrower Asia west of "Phrygia." On this presumption we understand that Paul and Silas, after completing their visitation of "the cities" of the former tour (<a onClick="return mV(\'Act\',16,4,5);">Ac 16:4-5</a>; compare <a onClick="return mV(\'Act\',15,36);">Ac 15:36</a>, in conjunction with <a onClick="return mV(\'Act\',13,\'14-\');">Ac 13:14</a> -<a onClick="return mV(\'Act\',14,23);">14:23</a>), since they were forbidden to proceed westward and "speak the word in Asia," turned their faces to the region—first Phrygian, then Galatian—that stretched northward into new territory, through which they traveled toward "Mysia" and "Bithynia" (<a onClick="return mV(\'Act\',16,7);">Ac 16:7</a>). Thus <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a> fills in the space between the South Galatia covered by <a onClick="return mV(\'Act\',16,4,5);">16:4 and 5</a>, and the Mysian-Bithynian border where we find the travelers in <a onClick="return mV(\'Act\',16,7);">16:7</A>. Upon this, the ordinary construction of Luke\'s somewhat involved sentence, North Galatia was entered by Paul on his 2nd tour; he retraversed, more completely, "the Galatian region" at the commencement of the 3rd tour, when he found "disciples" there (<a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>) whom he had gathered on the previous visit.<P>(3) The Grammar of <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>.<P>In the interpretation of the Lukan passages proposed by Ramsay, <a onClick="return mV(\'Act\',16,16);">Ac 16:16a</a>, detached from <a onClick="return mV(\'Act\',16,16);">16b</a>, is read as the completion of <a onClick="return mV(\'Act\',16,\'1-5\');">16:1-5</a> (\'And they went through the Phrygian...region. They were forbidden by the Holy Ghost...in Asia, and came over against Mysia,\' etc.); and "the Phrygian and Galatian region" means the southwestern division of Provincia Galatia, a district at once Phrygian (ethnically) and Galatian (politically). The combination of two local adjectives., under a common article, to denote the same country in different respects, if exceptional in Greek idiom (<a onClick="return mV(\'Act\',15,41);">15:41</a> and <a onClick="return mV(\'Act\',27,5);">27:5</a> illustrate the usual force of this collocation), is clearly possible—the one strictly parallel geographical expression, "the Iturean and Trachonite country" in <a onClick="return mV(\'Luk\',3,1);">Lu 3:1</a>, unfortunately, is also ambiguous. But the other difficulty of grammar involved in the new rendering of <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a> is insuperable: the severance of the participle, "having been forbidden" (koluthentes), from the introductory verb, "they went through" (diel-thon), wrenches the sentence to dislocation; the aorist participle in such connection "must contain, if not something antecedent to \'they went,\' at least something synchronous with it, in no case a thing subsequent to it, if all the rules of grammar and all sure understanding of language are not to be given up" (Schmiedel, EB, col. 1599; endorsed in Moulton\'s Prolegomena to the Grammar of New Testament Greek, 134; see also Chase in The Expositor, IV, viii, 404-11, and ix, 339-42). <a onClick="return mV(\'Act\',10,29);">Ac 10:29</a> ("I came...when I was sent for") affords a grammatical parallel to <a onClick="return mV(\'Act\',16,6);">16:6</a> (\'They went through...since they were hindered\').<P>Zahn\'s position is peculiar (Intro to New Testament, I, 164-202). Rejecting Ramsay\'s explanation of <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>, and of <a onClick="return mV(\'Act\',18,23);">18:23</A> (where Ramsay sees Paul a third time crossing South Galatia), and maintaining that Luke credits the apostle with successful work in North Galatia, he holds, notwithstanding, the South Galatian view of the epistle. This involves the paradox that Paul in writing to "the churches of Galatia" ignored those of North Galatia to whom the title properly belonged—an incongruence which Ramsay escapes by denying that Paul had set foot in Old Galatia. In the 1st edition of the Einleitung Zahn had supposed North and South Galatia together included in the address; this supposition is contrary to the fact that the readers form a homogeneous body, the fruit of a single mission (<a onClick="return mV(\'Gal\',4,13);">4:13</A>), and are affected simultaneously by the same disturbance (<a onClick="return mV(\'Gal\',1,6);">1:6</A>; <a onClick="return mV(\'Gal\',5,7,8,9);">5:7-9</a>). Associating the letter in 2nd edition with Southern Galatians alone, Zahn suggests that while Paul had labored in North Galatia and found "disciples" there on his return, these were too few and scattered to form "churches"—an estimate scarcely in keeping with Luke\'s phrase <a onClick="return mV(\'Act\',5,\'7-9\');">Ac 5:7-9</a> "all the disciples" (<a onClick="return mV(\'Act\',18,23);">18:23</a>), and raising a distinction between "disciples" and "churches" foreign to the historian\'s usage (see <a onClick="return mV(\'Act\',6,2);">Ac 6:2</a>; <a onClick="return mV(\'Act\',9,19);">9:19</a>; <a onClick="return mV(\'Act\',14,20);">14:20</a>). We must choose between North and South Galatia; and if churches existed among the people of the north at the time of writing, then the northerners claim this title by right of use and wont—and the epistle with it. The reversal of "Galatian and Phrygia(n)" in <a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>, as compared with <a onClick="return mV(\'Act\',16,6);">16:6</a>, implies that the apostle on the 3rd tour struck "the Galatian country" first, traveling this time directly north from Syrian Antioch, and turned westward toward Phrygia when he had reached Old Galatia; whereas his previous route had brought him westward along the highroad traversing South Galatia, until he turned northward at a point not far distant from Pisidian Antioch, to reach North Galatia through Phrygia from the southwest. See the Map of Asia Minor.<P>(4) Notes of Time in the Epistle.<P>The "3 years" of <a onClick="return mV(\'Gal\',1,18);">Ga 1:18</a> and the "14 years" of <a onClick="return mV(\'Act\',2,1);">2:1</a> are both seemingly counted from Paul\'s conversion.<P>(a) The synchronism of the conversion with the murder of Stephen and the free action of the high priest against the Nazarenes (<a onClick="return mV(\'Act\',9,2);">Ac 9:2</a>, etc.), and of Saul\'s visit to Jerusalem in the 3rd year thereafter with Aretas\' rule in Damascus (<a onClick="return mV(\'2Cr\',11,32,33);">2Co 11:32-33</a>), forbid our placing these two events further back than 36 and 38—at furthest, 35 and 37 AD (see Turner on "Chronology of the NT" in HDB, as against the earlier dating).<P>(b) This calculation brings us to 48-49 as the year of the conference of <a onClick="return mV(\'Gal\',2,\'1-10\');">Ga 2:1-10</a>—a date precluding the association of that meeting with the errand to Jerusalem related in <a onClick="return mV(\'Act\',11,30);">Ac 11:30</a> and <a onClick="return mV(\'Act\',12,25);">12:25</a>, while it suits the identification of the former with the council of <a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>. Other indications converge on this as the critical epoch of Paul\'s apostleship. The expedition to Cyprus and South Galatia (<a onClick="return mV(\'Act\',13,\'1-\');">Ac 13</a>; <a onClick="return mV(\'Act\',14,\'1-\');">14</a>) had revealed in Paul \'signs of the apostle\' which the chiefs of the Judean church now recognized (<a onClick="return mV(\'Gal\',2,\'7-9\');">Ga 2:7-9</a>; compare <a onClick="return mV(\'Act\',15,12);">Ac 15:12</a>), and gave him the ascendancy which he exercised at this crisis; up to the time of <a onClick="return mV(\'Act\',13,1);">Ac 13:1</a> "Saul" was known but as an old persecutor turned preacher (<a onClick="return mV(\'Gal\',1,23);">Ga 1:23</a>), one of the band of "prophets and teachers" gathered round Barnabas at Antioch. The previous visit of Barnabas and Saul to Jerusalem (<a onClick="return mV(\'Act\',11,\'1-\');">Ac 11</a>; <a onClick="return mV(\'Act\',12,\'1-\');">12</a>) had no ostensible object beyond that of famine-relief. From <a onClick="return mV(\'Act\',12,\'1-\');">Ac 12</a> we learn that the mother church just then was suffering deadly persecution; Peter certainly was out of the way. There was no opportunity for the negotiation described in <a onClick="return mV(\'Gal\',2,\'1-10\');">Ga 2:1-10</a>, and it would have been premature for Paul to raise the question of his apostleship at this stage. In all likelihood, he saw few Judean Christians then beyond "the elders," who received the Antiochene charity (<a onClick="return mV(\'Act\',11,30);">Ac 11:30</a>). Nothing transpired in connection with this remittance, important as it was from Luke\'s standpoint, to affect the question of <a onClick="return mV(\'Gal\',1,\'1-\');">Ga 1</a>; <a onClick="return mV(\'Gal\',2,\'1-\');">2</a>; it would have been idle for Paul to refer to it. On the other hand, no real contradiction exists between <a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a> and <a onClick="return mV(\'Gal\',2,\'1-\');">Ga 2</a> "The two accounts admirably complete each other" (Pfleiderer; compare Cambr. Greek Test.,145,146; Steinmann, Die Abfassungszeit d. Gal.-Briefes, section 7); in matters of complicated dispute involving personal considerations, attempts at a private understanding naturally precede the public settlement. It would be strange indeed if the same question of the circumcision of Gentile believers had twice within a few years been raised at Antioch, to be twice carried to Jerusalem and twice over decided there by the same parties—Barnabas and Paul, Peter and James—and with no reference made in the second discussion (that of Acts, ex hyp.) to the previous compact (<a onClick="return mV(\'Gal\',2,\'1-\');">Ga 2</a>). Granting the epistle written after the council, as both Ramsay and Zahn suppose, we infer that Paul has given his more intimate account of the crisis, about which the readers were already informed in the sense of <a onClick="return mV(\'Act\',15,\'1-\');">Ac 15</a>, with a view to bring out its essential bearing on the situation.<P>(c) The encounter of Paul and Cephas at Antioch (<a onClick="return mV(\'Gal\',2,\'11-21\');">Ga 2:11-21</a>) is undated. The time of its occurrence bears on the date of the epistle. As hitherto, the order of narration presumably follows the order of events, the "but" of <a onClick="return mV(\'Gal\',2,11);">Ga 2:11</a> appears to contrast Cephas\' present attitude with his action in Jerusalem just described. Two possible opportunities present themselves for a meeting of Paul and Cephas in Antioch subsequently to the council—the time of Paul\'s and Barnabas\' sojourn there on their return from Jerusalem (<a onClick="return mV(\'Act\',15,35,36);">Ac 15:35-36</a>), or the occasion of Paul\'s later visit, occupying "some time," between the 2nd and 3rd tours (<a onClick="return mV(\'Act\',18,22,23);">Ac 18:22-23</a>), when for aught we know Barnabas and Peter may both have been in the Syrian capital.<P>The former dating assumes that Peter yielded to the Judaizers on the morrow of the council, that "Barnabas too was carried away" while still in colleagueship with Paul and when the cause of Gentile freedom, which he had championed, was in the flush of victory. It assumes that the legalists had no sooner been defeated than they opened a new attack on the same ground, and presented themselves as "from James" when James only the other day had repudiated their agitation (<a onClick="return mV(\'Act\',15,19,24);">Ac 15:19, 24</a>). All this is very unlikely. We must allow the legalists time to recover from their discomfiture and to lay new plans (see II 2, (2), (3), (4). Moreover, Luke\'s detailed narrative in <a onClick="return mV(\'Act\',15,\'30-36\');">Ac 15:30-36</a>, which makes much of the visit of Judas and Silas, gives no hint of any coming of Peter to Antioch at that time, and leaves little room for this; he gives an impression of settled peace and satisfaction following on the Jerusalem concordat, with which the strife of <a onClick="return mV(\'Gal\',2,11);">Ga 2:11</a>ff would ill accord. Through the course of the 2nd missionary tour, so far as the Thessalonian epistles indicate, Paul\'s mind remained undisturbed by legalistic troubles. "The apostle had quitted Jerusalem (after his understanding with the pillars) and proceeded to his 2nd missionary journey full of satisfaction at the victory he had gained and free from anxiety for the future...The decisive moment of the crisis necessarily falls between the Thessalonian and Galatian epistles...A new situation suddenly presents itself to him on his return" to Antioch (A. Sabatier, The Apostle Paul, English translation,10,11, also 124-36).<P>(5) Paul\'s Renewed Struggle with Legalism.<P>The new situation arose through the vacillation of Peter; and the "certain from James" who made mischief at Antioch, were the forerunners of "troublers" who agitated the churches far and wide, appearing simultaneously in Corinth and North Galatia. The attempt to set up a separate church-table for the circumcised at Antioch was the first movement in a crafty and persistent campaign against Gentile liberties engineered from Jerusalem. The Epistle to the Romans signalized Paul\'s conclusive victory in this struggle, which covered the period of the 3rd missionary tour. On his revisitation of the Galatians (<a onClick="return mV(\'Gal\',1,9);">1:9</A>; <a onClick="return mV(\'Gal\',5,3);">5:3</A> parallel <a onClick="return mV(\'Act\',18,23);">Ac 18:23</a>), fresh from the contention with Cephas and aware of the wide conspiracy on foot, Paul gave warning of the coming of "another gospel"; it had arrived, fulfilling his worst fears. Upon this view of the course of affairs (see Neander, Planting and Training of the Christian Church, III, vii; Godet\'s Introduction to the New Testament, Epistles of Paul, 200-201; Sabatier, as above), the mistake of Peter at Antioch was the proximate antecedent of the trouble in Galatia; hence, <a onClick="return mV(\'Gal\',2,\'11-24\');">Ga 2:11-24</a> leads up to <a onClick="return mV(\'Gal\',3,1);">3:1</a> and the main argument. Now, if the Antiochene collision befell so late as this, then the epistle is subsequent to the date of <a onClick="return mV(\'Act\',18,22,23);">Ac 18:22-23</a>; from which it follows, once more, that Galatians belongs to the 3rd missionary tour and the Corinthians-Romans group of letters.<P>(6) Ephesus or Corinth?<P>Chiefly because of the words, "you are removing so quickly," in <a onClick="return mV(\'Gal\',1,6);">Ga 1:6</a>, the epistle is by many referred to the earlier part of the above period, the time of Paul\'s protracted sojourn in Ephesus (<a onClick="return mV(\'Act\',19,8,10);">Ac 19:8, 10</a> 54-56 AD); "so quickly," however, signifies not "so soon after my leaving you," but "so suddenly" and "with such slight persuasion" (<a onClick="return mV(\'Gal\',5,7,8);">Ga 5:7-8</a>). From Ephesus, had the apostle been there when the trouble arose, he might as easily have visited Galatia as he did Corinth under like circumstances (so much is implied in <a onClick="return mV(\'2Cr\',13,1);">2Co 13:1</a>): he is longing to go to Galatia, but cannot (<a onClick="return mV(\'Gal\',4,19,20);">Ga 4:19-20</a>). A more distant situation, such as Macedonia or Corinth (<a onClick="return mV(\'Act\',20,\'1-3\');">Ac 20:1-3</a>), where Paul found himself in the last months of this tour (56-57 AD), and where, in churches of some standing, he was surrounded by a body of sympathetic "brethren" (<a onClick="return mV(\'Gal\',1,1);">Ga 1:1</a>) whose support gave weight to his remonstrance with the Galatians, suits the epistle better on every account.<P>(7) Paul\'s First Coming to Galatia.<P>In <a onClick="return mV(\'Gal\',4,\'13-15\');">Ga 4:13-15</a> the apostle recalls, in words surcharged with emotion, his introduction to the readers. His "preaching the good news" to them was due to "weakness of the flesh"—to some sickness, it seems, which arrested his steps and led him to minister in a locality that otherwise he would have "passed over," as he did Mysia a little later (<a onClick="return mV(\'Act\',16,8);">Ac 16:8</a>). So we understand the obscure language of <a onClick="return mV(\'Gal\',4,13);">Ga 4:13</a>. The South Galatian theorists, in default of any reference to illness as affecting the apostle\'s movements in <a onClick="return mV(\'Act\',13,13,14);">Ac 13:13-14</a>, favor Ramsay\'s conjecture that Paul fell a victim to malaria on the Pamphylian coast, and that he and Barnabas made for Pisidian Antioch by way of seeking the cooler uplands. The former explanation lies nearer to the apostle\'s language: he says "I preached to you," not "I came to you, because of illness." The journey of a hundred miles from Perga to Antioch was one of the least likely to be undertaken by a fever-stricken patient (see the description in Conybeare and Howson\'s Life of Paul, or in Ramsay\'s Paul the Traveler). Besides, if this motive had brought Paul to Antioch, quite different reasons are stated by Luke for his proceeding to the other South Galatian towns (see <a onClick="return mV(\'Act\',13,50,51);">Ac 13:50-51</a>; <a onClick="return mV(\'Act\',14,6,19,20);">14:6, 19-20</a>). Reading <a onClick="return mV(\'Gal\',4,\'13-15\');">Ga 4:13-15</a>, one imagines the missionary hastening forward to some further goal (perhaps the important cities of Bithynia, <a onClick="return mV(\'Act\',16,7);">Ac 16:7</a>), when he is prostrated by a malady the physical effects of which were such as to excite extreme aversion. As strength returns, he begins to offer his gospel in the neighborhood where the unwilling halt has been made. There was much to prejudice the hearers against a preacher addressing them under these conditions; but the Galatians welcomed him as a heaven-sent messenger. Their faith was prompt and eager, their gratitude boundless.<P>The deification of Barnabas and Paul by the Lycaonians (<a onClick="return mV(\'Act\',14,\'11-18\');">Ac 14:11-18</a>) is the one incident of Luke\'s narrative of which the apostle\'s description reminds us. To this the latter is thought to be alluding when he writes, "You received me as an angel of God, as Christ Jesus!" But could he speak thus of his reception—hateful at the time—in the character of a heathen god, and of a reception that ended in his stoning? The "welcome" of the messenger implies faith in his message (compare <a onClick="return mV(\'Gal\',4,14);">Ga 4:14</a>; <a onClick="return mV(\'2Cr\',6,1);">2Co 6:1</a>; <a onClick="return mV(\'1Th\',1,6);">1Th 1:6</a>; <a onClick="return mV(\'Mat\',10,40,41);">Mt 10:40-41</a>, where the same Greek verb is used).<P>Paul\'s mishandling at Lystra (<a onClick="return mV(\'Act\',14,19,20);">Ac 14:19-20</a>) has suggested a correspondence in the opposite sense between the epistle and the story of the South Galatian mission. The Lystran stones left their print on Paul\'s body; in these disfiguring scars one might see "the marks of Jesus" to which he points in <a onClick="return mV(\'Gal\',6,17);">Ga 6:17</a>, were it not for the note of time, "from henceforth," which distinguishes these stigmata as a fresh infliction, identifying the servant now more than ever with his Master. The true parallel to <a onClick="return mV(\'Gal\',6,17);">Ga 6:17</a> is <a onClick="return mV(\'2Cr\',4,10);">2Co 4:10</a> (see the context in <a onClick="return mV(\'2Cr\',4,\'7-\');">4:7</a> - <a onClick="return mV(\'2Cr\',5,\'1-4\');">5:4</a>, also <a onClick="return mV(\'2Cr\',5,18);">18</a>), which we quoted above (III, 2). When he wrote 2 Corinthians, the apostle was emerging from an experience of crucial anguish, which gave him an aspect imaging the dying Saviour whom he preached; to this new consecration the appeal of our epistle seems to refer.<P>(8) Barnabas and the Galatians.<P>The references to Barnabas in <a onClick="return mV(\'Gal\',2,1,9,13);">Ga 2:1, 9, 13</a>, at first sight suggest the South Galatian destination of the letter. For Barnabas and Paul were companions on the first only of the three tours, and Barnabas is named thrice here and but twice in the rest of the epistles. Yet these very references awaken misgiving. Barnabas was Paul\'s full partner in the South Galatian mission; he was senior in service, and had introduced Saul to the apostles at Jerusalem; he was the leader at the outset of this journey (<a onClick="return mV(\'Act\',9,27);">Ac 9:27</a>; <a onClick="return mV(\'Act\',11,\'22-26\');">11:22-26</a>; <a onClick="return mV(\'Act\',13,\'1-3\');">13:1-3</a>; <a onClick="return mV(\'Act\',15,25);">15:25</a>)—Barnabas was taken for "Zeus" by the heathen of Lystra, while the eloquent Paul was identified with "Hermes" (<a onClick="return mV(\'Act\',14,12);">Ac 14:12</a>). The churches of South Galatia had two founders, and owed allegiance to Barnabas along with Paul. Yet Paul deals with the readers as though he alone were their father in Christ. Referring to Barnabas conspicuously in the letter and as differing from himself on a point affecting the question at issue (<a onClick="return mV(\'Gal\',2,13);">Ga 2:13</a>), Paul was the more bound to give his old comrade his due and to justify his assumption of sole authority, if he were in truth addressing communities which owed their Christianity to the two men in conjunction. On the South Galatian hypothesis, the apostle appears ungenerously to have elbowed his colleague out of the partnership. The apostle Paul, it is to be noted, was particularly sensitive on matters of this kind (see <a onClick="return mV(\'1Cr\',4,15);">1Co 4:15</a>; <a onClick="return mV(\'2Cr\',10,\'13-16\');">2Co 10:13-16</a>). The name of Barnabas was known through the whole church (see <a onClick="return mV(\'1Cr\',9,6);">1Co 9:6</a>; <a onClick="return mV(\'Col\',4,10);">Col 4:10</a>); there is no more difficulty in supposing the North Galatians to be familiar with it than with the names of James and John (<a onClick="return mV(\'Gal\',2,9);">Ga 2:9</a>). Possibly Paul, as his responsibilities extended, had left the care of South Galatia to Barnabas, who could readily superintend this district from Antioch in Syria; Paul refers to him in <a onClick="return mV(\'1Cr\',9,6);">1Co 9:6</a>, long after the separation of <a onClick="return mV(\'Act\',15,39);">Ac 15:39</a>, as a fellow-worker. This would account for his making direct for North Galatia on the 3rd tour; see IV, 3 (3).<P>(9) The Two Antiochs.<P>In <a onClick="return mV(\'Gal\',2,11);">Ga 2:11</a> Paul refers to "Antioch," the famous city on the Orontes. To South Galatians "Antioch" meant, as in <a onClick="return mV(\'2Ti\',3,11);">2Ti 3:11</a>, the Pisidian city of that name. Had Paul been addressing South Galatians, and Antiochenes imprimis, he could not without singular inadvertence have failed to make the distinction. The gaucherie would have been as marked as if, in writing to a circle of West-of-England towns including Bradford-on-Avon, one should mention "Bradford" without qualification, meaning the Yorkshire Bradford.<P>The arguments drawn from local difference in legal usage—in the matters of adoption, testament, etc.—in favor of the South Galatian destination (see Schmiedel\'s examination of Ramsay\'s views in EB, coll. 1608-9), and from the temperament of Paul\'s "Galatians" in favor of North Galatia (Lightfoot), are too precarious to build upon.<P>(10) Wider Bearings of the Problem.<P>On a broad view of the scope of Paul\'s missionary work and of the relation of his letters to Acts, there is much to commend the South Galatian theory. It simplifies the situation by connecting this cardinal writing of Paul with churches of cardinal importance in Luke\'s narrative. The South Galatian cities lay along the main route of the apostle\'s travels, and in the mid-stream of the church\'s life. The epistle, when associated with the Christian communities of this region, gains a definite setting and a firm point of attachment in New Testament history; whereas the founding of North Galatian Christianity is indicated by Luke, if at all, in the most cursory fashion, and it held an obscure place in the early church. How, it is asked, could Paul\'s intimate friend have been (on the North Galatian theory) so uninterested in churches by which Paul himself set such store? And how can Paul have ignored, apart from the allusion of <a onClick="return mV(\'2Ti\',3,11);">2Ti 3:11</a>, the South Galatians who formed the first-fruits of his wider labors and supplied a vital link in his chain of churches? In reply, we must point out:<p>(1) that for anything we know Paul wrote many letters to South Galatia; we possess but a selection from his correspondence; the choice of the canonical epistles was not governed by the importance of the parties addressed in them—witness Colossians and Philemon; nor were Paul\'s concern for his churches, and the empressement with which he wrote, determined by their magnitude and position, but by their needs and their hold on his affections (see <a onClick="return mV(\'Gal\',1,6);">Ga 1:6</a>, etc.; <a onClick="return mV(\'Gal\',4,\'12-20\');">4:12-20</A>).<p>(2) The North Galatian mission lay off the central line of Paul\'s journeyings and of the advance of GentileChristianity; this is probably the reason why Luke, who was compelled to a strict economy of space, just ignores this field, though he shows himself aware of its existence. The apostle\'s confession that he preached to the readers, in the first instance, not from choice but necessity (<a onClick="return mV(\'Gal\',4,13);">Ga 4:13</a>), accords with the neglect of North Galatia in Acts; the evangelizing of the North Galatians was an aside in Paul\'s work—an incident beyond the scope of his plans, from which at this period he was compelled again and again to deviate (<a onClick="return mV(\'Act\',16,\'6-10\');">Ac 16:6-10</a>).<P>After all, though less important during the 1st century than South Galatia. North Galatia was not an unimportant or inaccessible region. It was traversed by the ancient "Royal Road" from the east to the Hellespont, which the apostle probably followed as far as Phrygia in the journey of <a onClick="return mV(\'Act\',18,22,23);">Ac 18:22-23</a>. Planted by Paul in Old Galatia, the gospel would spread to Bithynia and Pontus farther north, as it certainly had done by the time Peter wrote to the churches of Asia Minor (<a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>). It is observable that "Galatia" stands between "Pontus and Cappadocia" in Peter\'s enumeration of the provinces—an order indicating that Christians of North Galatia were particularly in the writer\'s mind. Had Paul never set foot in North Galatia, had he not worked along the Royal Road and put his message in the Way of reaching the northern provinces of Asia Minor, the claim of <a onClick="return mV(\'Rom\',15,19);">Ro 15:19</a> is difficult to sustain, that "from Jerusalem, and in a circle as far as Illyricum, he had fulfilled the gospel of Christ." On the whole, we find the external evidence in accord with the testimony given by the internal character and affinities of the epistle: we judge that this epistle was written circa the autumn or winter of 56-57 AD, from Macedonia or Corinth, toward the end of Paul\'s third missionary tour; that it was addressed to a circle of churches situated in Galatia proper or North Galatia, probably in the western part of this country contiguous to (or overlapping) Phrygia (<a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>); and that its place lies between the two Corinthian and the Roman letters among the epistles of the second group.<P>LITERATURE.<P>The South Galatian destination was proposed by the Danish Mynster (Einltg. in d. Brief and. Galatia, 1825; M. however included North Galatia), and adopted by the French Perrot (De Galatia Provincia Romana, 1867) and Renan (S. Paul); by the German Clemen (Chronologie d. paulin. Briefe, 1893; Die Adressaten d. Gal.-Briefes; Paulus: sein Leben u. Wirken, 1904), Hausrath (NT Zeitgeschichte,1873,English Translation), Pfleiderer (Paulinismus, 1873, English translation; Paulinismus2, much altered; Urchristenthum, 1902), Steck (as above), Weizsacker (Das apost. Zeitalter3, 1902, English Translation); after Ramsay (see under <a href="./study/isbe/search.html?string=GALATIA">GALATIA</a>), by Belser (Beitrage z. Erklarung d. AG, etc.), O. Holtzmann (Zeitschrift f. KG, 1894), von Soden (Hist of Early Christian Lit., ET; he includes South with North Galatia), Weber (Die Adressaten d. Gal.-Briefes), J. Weiss (RE3, article "Kleinasien"), in Germany; by Askwith (Ep. to Gal: An Essay on Its Destination and Date), Bacon (Expos, V, vii, 123-36; x, 351-67), Bartlet (Expos, V, x, 263-80), Gifford (Expos, IV, x, 1-20), Maclean (1-vol HDB), Rendall (Expos, IV, ix, 254-64; EGT, Introduction to "Galatians"), Round (as above), Sanday (with hesitation, The Expositor, IV, vii, 491-95), Woodhouse (EB, article "Galatia"). The N. Galatian destination, held by earlier scholars up to Lightfoot and Salmon (DB2, an illuminating discussion), is reasserted, in view of Ramsay\'s findings, by Chase (Expos, IV, viii, 401-19; ix, 331-42), Cheetham (Class. Review, 1894), Dods (HDB, article "Galatians"), Williams (Cambr. Greek Testament., 1910), in this country; by Sabatier (L\'Apotre Paul2, English translation, 1891); by Gheorghiu (Adressatii epistle c. Galateni, Cernauti,1904,praised by Steinmann); and by the German critics Blass (Acta Apost.), yon Dobschutz (Die urchr. Gemeinden, 1902, and Probleme d. apost. Zeitalters), Harnack (Apostelgeschichte,1908,87-90), H. Holtzmann (Handcomm. z. New Testament, "AG"), Julicher (NT Intro, English Translation), Lipsius (Handcomm. z. New Testament, "Galater") Lietzmann (doubtfully, Handbuch z. N T, III, i, "Galaterbrief"), Mommsen (ZNTW,1901,81-96), Schmiedel (Encyclopedia Biblica), Schurer (Jahrbuch f. prot. Theologie, XVIII, 460-74), Sieffert (Meyer\'s Kommentar), Steinmann (as above), Zockler (a full and masterly discussion: Studien u. Kritiken,1895,51-102). Mommsen\'s verdict is thus expressed: "To apprehend \'the Galatians\' of Paul otherwise than in the strict and narrower sense of the term, is unallowable. The Provinces associated with Galatia under the rule of a single legate, as e.g. Lycaonia certainly was as early as the time of Claudius, were in no way incorporated in that region; the official inscriptions simply set Galatia at the head of the combined regions. Still less could the inhabitants of Iconium and Lystra be named \'Galatians\' in common speech."<P>Apart from the aforesaid controversy, besides the standard Commentary on Paul\'s Epistles, Luther\'s Ad Galatas is of unique historical interest; the interpretations of Usteri (1833), Hilgenfeld (1852), Winer (18594), Holsten (Das Evangel. d. Paulus, 1880), Philippi (1884), in German; Baljon (1889), in Dutch; and of B. Jowett, Ellicott, Beet, are specially serviceable, from different points of view; see also CGT and EB.``59';
isbe[3643]='Galbanum`gal\'-ba-num (chelbenah; chalbdne):<P>A gum-resin which occurs in small, round, semitranslucent tears or in brownish yellow masses; has a pleasant aromatic odor and a bitter taste; and is today, at any rate, imported from Persia.<P>It is derived from certain umbelliferous plants, Ferula galbaniflua and F. rubricaulis. It is mentioned in <a onClick="return mV(\'Exd\',30,34);">Ex 30:34</a> as an ingredient of the holy incense, and also in Sirach 24:15: "a pleasant odor...as galbanum."``1';
isbe[3644]='Galeed`gal\'-e-ed (gal\'edh): Derived from the Hebrew gal, "a heap of stones," and \'edh, "witness." The meaning therefore is "cairn" or "heap of witness," corresponding to yeghar-sahddhutha\' in Aramaic (<a onClick="return mV(\'Gen\',31,47);">Ge 31:47</a>). It is applied to the cairn raised by Jacob and Laban, beside which they sealed their covenant in a common meal, the memory of which they appealed to the silent cairn to preserve. The ancient custom of associating events with inanimate objects as witnesses is often illustrated in Hebrew history (<a onClick="return mV(\'Jos\',4,4);">Jos 4:4</a>ff, etc.). There may be in this narrative a suggestion of how the name "Gilead" came to be applied to that country.``54';
isbe[3645]='Galgala`gal\'-gal-a (Gallgala):<P>Greek equivalent for Gilgal. The word occurs in 1Macc 9:2 in connection with Arbela, in Galilee—"The way to Galgala"—but it is doubtful which Gilgal is meant. Compare Josephus, Ant, XII, xi, 1`<a href="./study/isbe/search.html?string=GILGAL">GILGAL</a>`1';
isbe[3646]='Galilean`gal-i-le\'-an.`<a href="./study/isbe/search.html?string=GALILEE">GALILEE</a>`1';
isbe[3647]='Galilee`gal\'-i-le (ha-galil, hagelilah, literally, "the circuit" or "district"; he Galilaia):<P>1. Galilee of the Nations:<P>Kedesh, the city of refuge, is described as lying in Galilee, in Mt. Naphtali (<a onClick="return mV(\'Jos\',20,7);">Jos 20:7</a>; compare <a onClick="return mV(\'Jos\',21,32);">Jos 21:32</a>). The name seems originally to have referred to the territory of Naphtali. Joshua\'s victorious campaign in the north (<a onClick="return mV(\'Jos\',11,\'1-\');">Jos 11</a>), and, subsequently, the triumph of the northern tribes under Deborah and Barak (<a onClick="return mV(\'Jdg\',4,\'1-\');">Jud 4</a>f) gave Israel supremacy; yet the tribe of Naphtali was not able to drive out all the former inhabitants of the land (<a onClick="return mV(\'Jdg\',1,33);">Jud 1:33</a>). In the time of Solomon the name applied to a much wider region, including the territory of Asher. In this land lay the cities given by Solomon to Hiram (<a onClick="return mV(\'1Ki\',9,11);">1Ki 9:11</a>). Cabul here named must be identical with that of <a onClick="return mV(\'Jos\',19,27);">Jos 19:27</a>. The Asherites also failed to possess certain cities in their allotted portion, so that the heathen continued to dwell among them. To this state of things, probably, is due the name given in <a onClick="return mV(\'Isa\',9,1);">Isa 9:1</a> to this region, "Galilee of the nations," i.e. a district occupied by a mixed population of Jews and heathen. It may also be referred to in <a onClick="return mV(\'Jos\',12,23);">Jos 12:23</a>, where possibly we should read "king of the nations of Galilee" (legalil), instead of "Gilgal" (begilgal). Yet it was within this territory that, according to <a onClick="return mV(\'2Sa\',20,18);">2Sa 20:18</a> (Septuagint) lay the two cities noted for their preservation of ancient Israelite religious customs in their purity—Abel-bethmaacah and Dan.<P>2. Ancient Boundaries:<P>There is nothing to guide us as to the northern boundary of Galilee in the earliest times. On the east it was bounded by the upper Jordan and the Sea of Galilee, and on the south by the plain of el-battauf. That all within these limits belonged to Galilee we may be sure. Possibly, however, it included Zebulun, which seems to be reckoned to it in <a onClick="return mV(\'Isa\',9,1);">Isa 9:1</a>. In this territory also there were unconquered Canaanite cities (<a onClick="return mV(\'Jud\',1,1,30);">Jud 1,30</a>).<P>3. Before the Exile:<P>At the instigation of Asa, king of Judah, Benhadad, son of Tabrimmon of Damascus, moved against Israel, and the cities which he smote all lay within the circle of Galilee (<a onClick="return mV(\'1Ki\',15,20);">1Ki 15:20</a>). Galilee must have been the arena of conflict between Jehoahaz and Hazael, king of Syria. The cities which the latter captured were recovered from his son Benhadad by Joash, who defeated him three times (<a onClick="return mV(\'2Ki\',10,32);">2Ki 10:32</a>; <a onClick="return mV(\'2Ki\',13,22);">13:22</a>). The affliction of Israel nevertheless continued "very bitter," and God saved them by the hand of Jeroboam son of Joash, the great warrior monarch of the Northern Kingdom, under whom Galilee passed completely into the hands of Israel (<a onClick="return mV(\'2Ki\',14,25);">2Ki 14:25</a>ff). But the days of Israel\'s supremacy in Northern Palestine were nearly over. The beginning of the end came with the invasion of Tiglath-pileser III, who took the chief cities in Galilee, and sent their inhabitants captive to Assyria (<a onClick="return mV(\'2Ki\',14,29);">2Ki 14:29</a>). Probably, as in the case of the Southern Kingdom, the poorest of the land were left as husbandmen. At any rate there still remained Israelites in the district (<a onClick="return mV(\'2Ch\',30,10);">2Ch 30:10</a>f); but the measures taken by the conqueror must have made for the rapid increase of the heathen element.<P>4. After the Exile:<P>In post-exilie times Galilee is the name given to the most northerly of the three divisions of Western Palestine. The boundaries are indicated by Josephus (BJ, III, iii, 1). It was divided into Lower and Upper Galilee, and was encompassed by Phoenicia and Syria. It marched with Ptolemais and Mt. Carmel on the west. The mountain, formerly Galliean, now belonged to the Syrians. On the south it adjoined Samaria and Scythopolis (Beisan) as far as the river Jordan. It was bounded on the east by Hippene, Gadara, Gaulonitis and the borders of the kingdom of Agrippa, while the northern frontier was marked by Tyre and the country of the Tyrians. The northern limit of Samaria was Ginea, the modern Jenin, on the south border of Esdraelon. Lower Galilee, therefore, included the great plain, and stretched northward to the plain of er-Rameh—Ramah of <a onClick="return mV(\'Jos\',19,36);">Jos 19:36</a>. Josephus mentions Bersabe, the modern Abu-Sheba, and the Talmud, Kephar Chananyah, the modern Kefr \'Anan, as the northern border; the former being about a mile north of the latter. The plain reaches to the foot of the mountain chain, which, running east and west, forms a natural line of division. Upper Galilee may have included the land as far as the gorge of the Litany, which, again, would have formed a natural boundary to the N. Josephus, however, speaks of Kedesh as belonging to the Syrians (BJ, II, xviii, 1), situated "between the land of the Tyrians and Galilee" (Ant., XIII, v, 6). This gives a point on the northern frontier in his time; but the rest is left indefinite. Guthe, Sunday and others, followed by Cheyne (EB, under the word), on quite inadequate grounds conclude that certain localities on the east of the Sea of Galilee were reckoned as Galilean.<P>5. Character of the Galileans:<P>In the mixed population after the exile the purely Jewish element must have been relatively small. In 165 BC Simon Maccabeus was able to rescue them from their threatening neighbors by carrying the whole community away to Judea (1Macc 5:14ff). Josephus tells of the conquest by Aristobulus I of Ituraea (Ant., XIII, xi, 3). He compelled many of them to adopt Jewish religious customs, and to obey the Jewish law. There can be little doubt that Galilee and its people were treated in the same way. While Jewish in their religion, and in their patriotism too, as subsequent history showed, the population of Galilee was composed of strangely mingled elements—Aramaean, Iturean, Phoenician and Greek In the circumstances they could not be expected to prove such sticklers for high orthodoxy as the Judeans. Their mixed origin explains the differences in speech which distinguished them from their brethren in the south, who regarded Galilee and the Galileans with a certain proud contempt (<a onClick="return mV(\'Jhn\',1,46);">Joh 1:46</a>; <a onClick="return mV(\'Jhn\',7,52);">7:52</a>). But a fine type of manhood was developed among the peasant farmers of the two Galilees which, according to Josephus (BJ, III, iii, 2), were "always able to make a strong resistance on all occasions of war; for the Galileans are inured to war from their infancy...nor hath the country ever been destitute of men of courage." Josephus, himself a Galilean, knew his countrymen well, and on them he mainly relied in the war with Rome. In Galilee also the Messianic hope was cherished with the deepest intensity. When the Messiah appeared, with His own Galilean upbringing, it was from the north-countrymen that He received the warmest welcome, and among them His appeal elicited the most gratifying response.<P>6. Later History:<P>In 47 BC, Herod the Great, then a youth of 25, was made military commander of Galilee, and won great applause by the fashion in which he suppressed a band of robbers who had long vexed the country (Ant., XIV, ix, 2). When Herod came to the throne, 37 BC, a period of peace and prosperity for Galilee began, which lasted till the banishment of his son Antipas in 40 AD. The tetrarchy of Galilee was given to the latter at his father\'s death, 4 BC. His reign, therefore, covered the whole life of Jesus, with the exception of His infancy. After the banishment of Antipas, Galilee was added to the dominions of Agrippa I, who ruled it till his death in 44 AD. Then followed a period of Roman administration, after which it was given to Agrippa II, who sided with the Romans in the subsequent wars, and held his position till 100 AD. The patriotic people, however, by no means submitted to his guidance. In their heroic struggle for independence, the command of the two Galilees, with Gamala, was entrusted to Josephus, who has left a vivid narrative, well illustrating the splendid courage of his freedom-loving countrymen. But against such an adversary as Rome even their wild bravery could not prevail; and the country soon lay at the feet of the victorious Vespasian, 67 AD. There is no certain knowledge of the part played by Galilee in the rebellion under Hadrian, 132-35 AD.<P>At the beginning of the Roman period Sepphoris (Cafuriyeh), about 3 miles north of Nazareth, took the leading place. Herod Antipas, however, built a new city on the western shore of the Sea of Galilee, which, in honor of the reigning emperor, he called Tiberias. Here he reared his "golden house," and made the city the capital of his tetrarchy. See <a href="study/isbe/search.html?string=TIBERIAS">TIBERIAS</A>. After the fall of Jerusalem, Galilee, which had formerly been held in contempt, became the home of Jewish learning, and its chief seat was found in Tiberias where the Mishna was committed to writing, and the Jerusalem Talmud was composed. Thus a city into which at first no pious Jew would enter, in a province which had long been despised by the leaders of the nation, became the main center of their national and religious life.<P>7. Cities of Galilee:<P>Among the more notable cities in Galilee were Kedesh Naphtali, the city of refuge, the ruins of which lie on the heights west of el-Chuleh; Chorazin, Bethsaida and Capernaum, north of the Sea of Galilee; Nazareth, the city of the Savior\'s youth and young manhood; Jotapata, the scene of Josephus\' heroic defense against the Romans, which stood at Tell Jefat, north of the plain of Asochis (BJ, III, vii, viii); Cana of Galilee; and Nain, on the northern slope of the mountain now called Little Hermon.<P>8. General Description:<P>In physical features Galilee is the most richly diversified and picturesque district in Western Palestine; while in beauty and fertility it is strongly contrasted with the barren uplands of Judah. Cut off from Mt. Lebanon in the north by the tremendous gorge of the Litany, it forms a broad and high plateau, sinking gradually southward until it approaches Cafed, when again it rises, culminating in Jebel Jermuk, the highest summit on the west of the Jordan. From Cafed there is a rapid descent by stony slope and rocky precipice to the shore of the Sea of Galilee. The mountains of which Jebel Jermuk is the northeast outrunner stretch westward across the country, and drop upon the plain of er-Rameh to the south. Irregular hills and valleys, with breadths of shady woodlands, lie between this plain and that of Asochis (el-Battauf]). The latter is split from the east by the range of Jebel Tor\'an. South of Asochis rise lower hills, in a cup-like hollow among which lies the town of Nazareth. South of the town they sink steeply into the plain of Esdraelon. The isolated form of Tabor stands out on the east, while Carmel bounds the view on the west. The high plateau in the north terminates abruptly at the lip of the upper Jordan valley. As the Jordan runs close to the base of the eastern hills, practically all this valley, with its fine rolling downs, is included in Galilee. The plain of Gennesaret runs along the northwestern shore of the Sea of Galilee. From the uplands to the west, stretching from Qurun Chattin (the traditional Mount of Beatitudes) to the neighborhood of Tabor, the land lets itself down in a series of broad and fertile terraces, falling at last almost precipitously on the western shore of the Sea of Galilee. The descent toward the Mediterranean is much more gradual; and the soil gathered in the longer valleys is deep and rich.<P>The district may be described as comparatively well watered. The Jordan with its mighty springs is, of course, too low for purposes of irrigation. But there are many perennial streams fed by fountains among the hills. The springs at Jenin are the main sources of the river Kishon, but for the greater part of its course through the plain the bed of that river is far below the surface of the adjoining land. The dews that descend from Lebanon and Hermon are also a perpetual source of moisture and refreshment.<P>9. Products:<P>Galilee was famous in ancient times for its rich and fruitful soil, "full of the plantations of trees of all sorts, insomuch that it invites the most slothful to pains in its cultivation by its fruitfulness; accordingly it is all cultivated by its inhabitants, and no part of it lies idle" (BJ, III, iii, 2). See also <a href="study/isbe/search.html?string=GENNESARET,+LAND+OF">GENNESARET, LAND OF</a>. The grapes grown in Naphtali were in high repute, as were the pomegranates of Shikmona—the Sykaminos of Josephus—which stood on the shore near Mt. Carmel. The silver sheen of the olive meets the eye in almost every valley; and the olive oil produced in Galilee has always been esteemed of the highest excellence. Its wheat fields also yielded an abundant supply, the wheat of Chorazin being proverbial. The great plain of Esdraelon must also have furnished rich provision. It cannot be doubted that Galilee was largely drawn upon for the gifts in kind which Solomon bestowed upon the king of Tyre (<a onClick="return mV(\'2Ch\',2,10);">2Ch 2:10</a>). At a much later day the inhabitants of Tyre and Sidon depended upon the produce of Galilee (<a onClick="return mV(\'Act\',12,20);">Ac 12:20</a>).<P>Galilee was in easy touch with the outside world by means of the roads that traversed her valleys, crossed her ridges and ran out eastward, westward and southward. Thus she was connected with the harbors on the Phoenician seaboard, with Egypt on the south, with Damascus on the northeast, and with the markets of the east by the great caravan routes (see "Roads" under <a href="study/isbe/search.html?string=PALESTINE,+1">PALESTINE</A>).<P>10. Contact with the Outside World:<P>In the days of Christ the coming and going of the merchantmen, the passing of armies and the movements of the representatives of the Empire, must have made these highways a scene of perpetual activity, touching the dwellers in Galilee with the widening influences of the great world\'s life.<P>11. Population:<P>The peasant farmers of Galilee, we have seen, were a bold and enterprising race. Encouraged by the fruitfulness of their country, they were industrious cultivators of the soil. Josephus estimates the population at 3,000,000. This may be an exaggeration; but here we have all the conditions necessary for the support of a numerous and prosperous people. This helps us to understand the crowds that gathered round and followed Jesus in this district, where the greater part of His public life was spent. The cities, towns and villages in Galilee are frequently referred to in the Gospels. That the Jewish population in the centuries immediately after Christ was numerous and wealthy is sufficiently proved by the remains from those times, especially the ruins of synagogues, e.g. those at Tell Chum, Kerazeh, Irbid, el-Jish, Kefr Bir\'im, Meiron, etc. Near the last named is shown the tomb of the great Jewish teacher Hillel.<P>Galilee was not without her own heroic memories. The great battlefields of Megiddo, Gilboa, and the waters of Merom lay within her borders; and among the famous men of the past she could claim Barak, Ibzan, Elon and Tola of the judges; of the prophets, Jonah and Elisha at least; possibly also Hosea who, according to a Jewish tradition, died in Babylon, but was brought to Galilee and buried in Cafed (Neubauer, Geog. der Talmud, 227). When the chief priests and Pharisees said, "Search, and see that out of Galilee ariseth no prophet," it argued strange and inexcusable ignorance on their part (<a onClick="return mV(\'Jhn\',7,52);">Joh 7:52</a>). Perhaps, however, in this place we should read ho prophetes, "the prophet," i.e. the Messiah. It is significant that 11 out of the 12 apostles were Galileans.`<a href="./study/isbe/search.html?string=ISSACHAR">ISSACHAR</a>; <a href="./study/isbe/search.html?string=ASHER+(1)">ASHER</a>; <a href="./study/isbe/search.html?string=ZEBULUN">ZEBULUN</a>; <a href="./study/isbe/search.html?string=NAPHTALI">NAPHTALI</a>; <a href="./study/isbe/search.html?string=GALILEE,+SEA+OF">GALILEE, SEA OF</a>`54';
isbe[3648]='Galilee, Mountain In`After the resurrection the disciples "went into Galilee, unto the mountain where Jesus had appointed them" (<a onClick="return mV(\'Mat\',28,16);">Mt 28:16</a>). Here Jesus came to them, declared that all authority in heaven and earth had been given to Him, commanded them to go and make disciples of all nations, concluding with the memorable promise: "Lo, I am with you always, even unto the end of the world." Probably it was some well-known height not far from the scenes most frequented during the Galilean ministry. Looking from the western shore at the uplands north of the lake, it is not easy to imagine a more appropriate spot for this never-to-be-forgotten interview than Jebel Qan\'-an, a bold headland not far to the east of Cafed, overlooking the land of Gennesaret and the sea, and commanding from its lofty summit a view of about 80 miles in every direction. Of course, there is no certainty.``54';
isbe[3649]='Galilee, Sea of`(he thalassa tes Galilaias):<P>1. The Name:<P>This is the name 5 times given in the New Testament (<a onClick="return mV(\'Mat\',4,18);">Mt 4:18</a>; <a onClick="return mV(\'Mat\',15,29);">15:29</a>; <a onClick="return mV(\'Mar\',1,16);">Mr 1:16</a>; <a onClick="return mV(\'Mar\',7,31);">7:31</a>; <a onClick="return mV(\'Jhn\',6,1);">Joh 6:1</a>) to the sheet of water which is elsewhere called "the sea of Tiberias" (<a onClick="return mV(\'Jhn\',21,1);">Joh 21:1</a>; compare <a onClick="return mV(\'Jhn\',6,1);">Joh 6:1</a>); "the lake of Gennesaret" (<a onClick="return mV(\'Luk\',5,1);">Lu 5:1</a>); "the sea" (<a onClick="return mV(\'Jhn\',6,16);">Joh 6:16</a>, etc.), and "the lake" (<a onClick="return mV(\'Luk\',5,1);">Lu 5:1</a>, etc.). The Old Testament names were "sea of Chinnereth" (yam-kinnereth: <a onClick="return mV(\'Num\',34,11);">Nu 34:11</a>; <a onClick="return mV(\'Deu\',3,17);">De 3:17</a>; <a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a>; <a onClick="return mV(\'Jos\',19,35);">19:35</a>), and "sea of Chinneroth" (yam-kineroth: <a onClick="return mV(\'Jos\',12,3);">Jos 12:3</a>; compare <a onClick="return mV(\'Jos\',11,2);">11:2</a>; <a onClick="return mV(\'1Ki\',15,20);">1Ki 15:20</a>). In 1Macc 11:67 the sea is called "the water of Gennesar" (the Revised Version (British and American) "Gennesareth"). It had begun to be named from the city so recently built on its western shore even in New Testament times (<a onClick="return mV(\'Jhn\',21,1);">Joh 21:1</a>; <a onClick="return mV(\'Jhn\',6,1);">6:1</a>); and by this name, slightly modified, it is known to this day—Bachr Tabariyeh.<P>2. General Description:<P>The sea lies in the deep trough of the Jordan valley, almost due east of the Bay of Acre. The surface is 680 ft. below the level of the Mediterranean. It varies in depth from 130 ft. to 148 ft., being deepest along the course of the Jordan (Barrois, PEFS, 1894, 211-20). From the point where the Jordan enters in the north to its exit in the south is about 13 miles. The greatest breadth is in the north, from el-Mejdel to the mouth of Wady Semak being rather over 7 miles. It gradually narrows toward the south, taking the shape of a gigantic pear, with a decided bulge to the west. The water of the lake is clear and sweet. The natives use it for all purposes, esteeming it light and pleasant. They refuse to drink from the Jordan, alleging that "who drinks Jordan drinks fever." Seen from the mountains the broad sheet appears a beautiful blue; so that, in the season of greenery, it is no exaggeration to describe it as a sapphire in a setting of emerald. It lights up the landscape as the eye does the human face; and it is often spoken of as "the eye of Galilee." To one descending from Mt. Tabor and approaching the edge of the great hollow, on a bright spring day, when the land has already assumed its fairest garments, the view of the sea, as it breaks upon the vision in almost its whole extent, is one never to be forgotten. The mountains on the east and on the west rise to about 2,000 ft. The heights of Naphtali, piled up in the north, seem to culminate only in the snowy summit of Great Hermon. If the waters are still, the shining splendors of the mountain may be seen mirrored in the blue depths. Round the greater part of the lake there is a broad pebbly beach, with a sprinkling of small shells. On the sands along the shore from el-Mejdel to \'Ain et-Tineh these shells are so numerous as to cause a white glister in the sunlight.<P>The main formation of the surrounding district is limestone. It is overlaid with lava; and here and there around the lake there are outcrops of basalt through the limestone. At et-Tabgha in the north, at \'Ain el Fuliyeh, south of el-Mejdel, and on the shore, about 2 miles south of modern Tiberias, there are strong hot springs. These things, together with the frequent, and sometimes terribly destructive, earthquakes, sufficiently attest the volcanic character of the region. The soil on the level parts around the sea is exceedingly fertile. See <a href="study/isbe/search.html?string=GENNESARET,+LAND+OF">GENNESARET, LAND OF</a>. Naturally the temperature in the valley is higher than that of the uplands; and here wheat and barley are harvested about a month earlier. Frost is not quite unknown; but no one now alive remembers it to have done more than lay the most delicate fringe of ice around some of the stones on the shore. The fig and the vine are still cultivated with success. Where vegetable gardens are planted they yield plentifully. A few palms are still to be seen. The indigo plant is grown in the plain of Gennesaret. In their season the wild flowers lavish a wealth of lovely colors upon the surrounding slopes; while bright-blossoming oleanders fringe the shore.<P>Coming westward from the point where the Jordan enters the lake, the mountains approach within a short distance of the sea. On the shore, fully 2 miles from the Jordan, are the ruins of Tell Chum. See <a href="study/isbe/search.html?string=CAPERNAUM">CAPERNAUM</A>. About 2 miles farther west are the hot springs of et-Tabgha. Here a shallow vale breaks northward, bounded on the west by Tell \'Areimeh. This tell is crowned by an ancient Canaanite settlement. It throws out a rocky promontory into the sea, and beyond this are the ruins of Khan Minyeh, with \'Ain et-Tineh close under the cliff. Important Roman remains have recently been discovered here. From this point the plain of Gennesaret (el-Ghuweir) sweeps round to el-Mejdel, a distance of about 4 miles. West of this village opens the tremendous gorge, Wady el Chamam, with the famous robbers\' fastnesses in its precipitous sides, and the ruins of Arbela on its southern lip. From the northern parts of the lake the Horns of Chattin, the traditional Mount of Beatitudes, may be seen through the rocky jaws of the gorge. South of el-Mejdel the mountains advance to the shore, and the path is cut in the face of the
