isbe = [];

isbe[3601]='Furlong`fur\'-long (stadion, "stadium"; <a onClick="return mV(\'Luk\',24,13);">Lu 24:13</a>; <a onClick="return mV(\'Jhn\',6,19);">Joh 6:19</a>; <a onClick="return mV(\'Jhn\',11,18);">11:18</a>; <a onClick="return mV(\'Rev\',14,20);">Re 14:20</a>; <a onClick="return mV(\'Rev\',21,16);">21:16</a>): A Greek measure of length, being 600 Greek ft., or 100 orguiai equal to 606 3/4 English ft., and thus somewhat less than a furlong, which is 660 ft.`<a href="./study/isbe/search.html?string=WEIGHTS+AND+MEASURES">WEIGHTS AND MEASURES</a>`1';
isbe[3602]='Furnace`fur\'-nas: The word is used in the Old Testament English Versions of the Bible to translate several Hebrew words:<P>Kibhshan, in <a onClick="return mV(\'Gen\',19,28);">Ge 19:28</a>, where the smoke of the destruction of the cities of the plain is said to have ascended "as the smoke of a furnace"; in <a onClick="return mV(\'Exd\',9,8);">Ex 9:8</a>, where Yahweh commands to take "handfuls of ashes of the furnace and...sprinkle it toward heaven," etc.<P>Kur, in <a onClick="return mV(\'Deu\',4,20);">De 4:20</a>, where Yahweh is represented, when speaking of taking the children of Israel out of Egypt, as taking them "out of the iron furnace."<P>\'Alil in <a onClick="return mV(\'Psa\',12,6);">Ps 12:6</a>, where "the words of Yahweh" are said to be "pure," "as silver tried in a furnace"; compare <a onClick="return mV(\'Pro\',17,3);">Pr 17:3</a>, "furnace for gold."<P>\'Attun, in <a onClick="return mV(\'Dan\',3,6);">Da 3:6</a>, where mention is made of "a burning fiery furnace" into which Daniel and his companions were cast. There is good reason to believe that these words all stand for either a brick-kiln or a smelting furnace.<P>In the New Testament a notable figurative use is made of the word in the phrase "the furnace of fire," he kaminos tou puros. It is found in the parable of the Tares (<a onClick="return mV(\'Mat\',13,42);">Mt 13:42</a>) as part of the remarkable imagery of that parable; while in the companion parable of the Drag-Net (<a onClick="return mV(\'Mat\',13,50);">Mt 13:50</a>) it stands as a symbol of the final destiny of the impenitent, a synonym of "hell"; compare <a onClick="return mV(\'Jer\',29,22);">Jer 29:22</a>; <a onClick="return mV(\'Dan\',3,6,22);">Da 3:6, 22</a>; <a onClick="return mV(\'Rev\',20,\'14-15\');">Re 20:14-15</a>, etc., and "eternal fire" (<a onClick="return mV(\'Mat\',25,41);">Mt 25:41</a>), "unquenchable fire" (<a onClick="return mV(\'Mat\',3,12);">Mt 3:12</a>), "the Gehenna of fire" (<a onClick="return mV(\'Mat\',5,22);">Mt 5:22</a> margin; <a onClick="return mV(\'Mat\',18,9);">Mt 18:9</a> parallel <a onClick="return mV(\'Mar\',9,43);">Mr 9:43</a> margin, etc.). A fact which modern travelers speak of, that furnaces for punishment have been found in Persia as elsewhere in the East, sheds some light upon this use of the expression "the furnace of fire."``47';
isbe[3603]='Furnaces, Tower of the`(<a onClick="return mV(\'Neh\',3,11);">Ne 3:11</a>).`<a href="./study/isbe/search.html?string=JERUSALEM,+1">JERUSALEM</a>`1';
isbe[3604]='Furnish`fur\'-nish (male; plethomai):<P>To "furnish" is to supply with what is useful or necessary, to fit out, provide, equip. It is the translation of several Hebrew or Greek words: of male\', "to fill in or up," "to complete" (<a onClick="return mV(\'Isa\',65,11);">Isa 65:11</a> the King James Version); nasa, "to lift up," "to aid" (<a onClick="return mV(\'1Ki\',9,11);">1Ki 9:11</a>); \'anaq, Hiphil, probably "to lay on the neck," "to encircle" (with a bracelet) (<a onClick="return mV(\'Deu\',15,14);">De 15:14</a>), of a slave set at liberty; \'arakh, "to arrange in order," "to lay out a table" (<a onClick="return mV(\'Psa\',78,19);">Ps 78:19</a> the King James Version; <a onClick="return mV(\'Pro\',9,2);">Pr 9:2</a>); \'asah keli, "to make a vessel for containing things" (<a onClick="return mV(\'Jer\',46,19);">Jer 46:19</a>, "Furnish thyself to go into captivity," the Revised Version, margin "Hebrew, make thee vessels of captivity"); plethomai, "to be filled" (<a onClick="return mV(\'Mat\',22,10);">Mt 22:10</a> the King James Version); stronnumi, "to strew," "to spread" (<a onClick="return mV(\'Mar\',14,15);">Mr 14:15</a>; <a onClick="return mV(\'Luk\',22,12);">Lu 22:12</a>); exartizo, "to complete fully," to equip" (<a onClick="return mV(\'2Ti\',3,17);">2Ti 3:17</a>).<P>In Ecclesiasticus 29:26 we have "furnish a table" (kosmeo); 44:6, "furnished with ability" (choregeo); 1Macc 14:34 the King James Version, "He furnished them with all things" (tithemi).``185';
isbe[3605]='Furniture`fur\'ni-tur (kar, kelim; skeue): In <a onClick="return mV(\'Gen\',31,34);">Ge 31:34</a> kar is translated "furniture" in the King James Version, but "saddle" in the American Standard Revised Version. The latter is decidedly preferable. It was the "camel-basket," or the basket-saddle of the camel, which was a sort of palanquin bound upon the saddle. Upon this saddle-basket Rachel sat with the teraphim hidden beneath, and her wily father did not suspect the presence of his gods in such a place. In other places the word kelim is used, and is generally rendered "vessels," though sometimes "furniture." It may have many other renderings also (see BDB). <a onClick="return mV(\'Exd\',31,7);">Ex 31:7</a>; <a onClick="return mV(\'Exd\',39,33);">39:33</a> mention the furniture of the Tent, which is specified in other places. Moses is instructed (<a onClick="return mV(\'Exd\',25,9);">25:9</a>) to make a sanctuary or tabernacle and the furniture thereof according to the pattern showed him in the Mount. The furniture of the Court consisted of the brazen altar and laver (<a onClick="return mV(\'Exd\',40,29,30);">40:29-30</a>); that of the Holy Place, of the table of showbread, the golden lampstand and altar of incense (<a onClick="return mV(\'Exd\',39,36);">39:36</A>; <a onClick="return mV(\'Exd\',40,\'22-26\');">40:22-26</A>; <a onClick="return mV(\'Hbr\',9,2);">Heb 9:2</a>); that of the Holy of Holies, of the ark and mercy-seat overshadowed by the cherubim. The tribe of Levi was set apart by Yahweh to "keep all the furniture of the tent of meeting" (<a onClick="return mV(\'Num\',3,8);">Nu 3:8</a>). When David organized the tabernacle-worship in Jerusalem and assigned the Levites their separate duties, certain men "were appointed over the furniture, and over all the vessels of the sanctuary" (<a onClick="return mV(\'1Ch\',9,29);">1Ch 9:29</a>). In <a onClick="return mV(\'Nah\',2,9);">Na 2:9</a> the singular form of the word keli is used, and is rendered "furniture." The prophet refers to the abundant, costly, luxurious furniture and raiment, largely the results of their conquests and plunder in many countries.<P>In <a onClick="return mV(\'Act\',27,19);">Ac 27:19</a> the word skeue is translated in the King James Version and the Revised Version (British and American) "tackling," with "furniture" in the Revised Version, margin.<P>By way of information regarding the general furniture of the house little is said directly in the Scriptures. The chamber built for Elisha upon the wall contained a bed, a table, a seat, and lampstand. This was doubtless the furnishing of most bedrooms when it could be afforded. The prophet Amos had a supreme contempt for the luxurious furniture of the grandees of Samaria (<a onClick="return mV(\'Amo\',3,12);">3:12</a>; <a onClick="return mV(\'Amo\',6,4);">6:4</a>).`<a href="./study/isbe/search.html?string=HOUSE">HOUSE</a>; <a href="./study/isbe/search.html?string=TABERNACLE,+A">TABERNACLE</a>; <a href="./study/isbe/search.html?string=TEMPLE,+A1">TEMPLE</a>`146';
isbe[3606]='Furrow`fur\'-o (telem):<P>The word is translated "furrows" in <a onClick="return mV(\'Job\',39,10);">Job 39:10</a>; <a onClick="return mV(\'Job\',31,38);">31:38</a>; <a onClick="return mV(\'Psa\',65,10);">Ps 65:10</a>; <a onClick="return mV(\'Hsa\',10,4);">Ho 10:4</a>; <a onClick="return mV(\'Hsa\',12,11);">12:11</a> (<a onClick="return mV(\'Psa\',65,10);">Ps 65:10</a> the King James Version, "ridges"). In these passages the fields are pictured as they were in the springtime or late autumn. When the showers had softened the earth, the seed was sown and the soil turned over with the plow and left in furrows, not harrowed and pulverized as in our modern farming. The Syrian farmer today follows the custom of his ancient predecessors.<P>Another word, ma\'anah, occurs in two passages, first in the figurative sense in <a onClick="return mV(\'Psa\',129,3);">Ps 129:3</a>, and second in an obscure passage in <a onClick="return mV(\'1Sa\',14,14);">1Sa 14:14</a>. Three other words, gedhudhah, \'arughah, \'ayin, translated "furrows" in the King James Version, are probably more properly rendered in the American Standard Revised Version "ridges" (<a onClick="return mV(\'Psa\',65,10);">Ps 65:10</a>), "beds" (<a onClick="return mV(\'Eze\',17,7,10);">Eze 17:7, 10</a>), and "transgressions" (<a onClick="return mV(\'Hsa\',10,10);">Ho 10:10</a>).`<a href="./study/isbe/search.html?string=AGRICULTURE">AGRICULTURE</a>; <a href="./study/isbe/search.html?string=PLOW">PLOW</a>`133';
isbe[3607]='Further; Furtherance`fur\'-ther, fur\'-therans (yacaph; eti, prokope); Further, adverb and adjective, is comparative of "forth," meaning "to a greater distance," "something more," "moreover," etc.; the verb "to further," means "to help forward," "advance," "assist." The verb occurs (<a onClick="return mV(\'Ezr\',8,36);">Ezr 8:36</a>) as the translation of nasa\', "to lift up": "They furthered the people and the house of God" (compare <a onClick="return mV(\'1Ki\',9,11);">1Ki 9:11</a>; <a onClick="return mV(\'Ezr\',1,4);">Ezr 1:4</a>); of puq "to send forth," "carry out" (<a onClick="return mV(\'Psa\',140,8);">Ps 140:8</a>, "Further not his evil device").<P>Furtherance is the translation of prokope, "a going forward," "advance" (<a onClick="return mV(\'Phl\',1,12);">Php 1:12</a>, "the furtherance of the gospel," the Revised Version (British and American) "progress" <a onClick="return mV(\'Phl\',1,25);">Php 1:25</a>, "for your furtherance and joy," the Revised Version (British and American) "progress").<P>Furthermore is the translation of eita, "then," "so then" (<a onClick="return mV(\'Hbr\',12,9);">Heb 12:9</a>); of to loipon, "for the rest," or "as to the rest" (<a onClick="return mV(\'1Th\',4,1);">1Th 4:1</a>, the Revised Version (British and American) "finally then").<P>Revised Version omits "further" (<a onClick="return mV(\'Act\',12,3);">Ac 12:3</a>); has "further" for "more than right" (<a onClick="return mV(\'Job\',34,23);">Job 34:23</a>), for "farther thence" (<a onClick="return mV(\'Mar\',1,19);">Mr 1:19</a>, different text); "What further need have we of witnesses?" for "What need we any further witnesses?" (<a onClick="return mV(\'Mar\',14,63);">Mr 14:63</a>); "your fellowship in furtherance of the gospel" (<a onClick="return mV(\'Phl\',1,5);">Php 1:5</a>; <a onClick="return mV(\'Phl\',2,22);">2:22</a>); "to the furthest bound" for "all perfection" (<a onClick="return mV(\'Job\',28,3);">Job 28:3</a>).``185';
isbe[3608]='Fury`fu\'-ri (alastor, "not to forget," "significant of revenge"):<P>Occurs only in 2Macc 7:9 the King James Version, "Thou like a fury (the Revised Version (British and American) "Thou, miscreant") takest us out of this present life."`<a href="./study/isbe/search.html?string=WRATH">WRATH</a>; <a href="./study/isbe/search.html?string=ANGER">ANGER</a>`1';
isbe[3609]='Future`fu\'-tur, fu\'-chur.`<a href="./study/isbe/search.html?string=ESCHATOLOGY">ESCHATOLOGY</a>`1';
isbe[3610]='Gaal`ga\'-al (ga\'al, "rejection," or "loathing"; according to Wellhausen, "beetle," HPN, 110): A man of whose antecedents nothing is known, except that his father\'s name was Ebed. He undertook to foment and lead a rebellion on the part of the inhabitants of Shechem against Abimelech, son of Gideon, and his rebellion failed (<a onClick="return mV(\'Jdg\',9,\'26-45\');">Jud 9:26-45</a>).`<a href="./study/isbe/search.html?string=ABIMELECH">ABIMELECH</a>`1';
isbe[3611]='Gaash`ga\'-ash (ga\'-ash): First mentioned in connection with the burial place of Joshua "in the border of his inheritance in Timnath-serah, which is in the hill-country of Ephraim, on the north (side) of the mountain of Gaash" (<a onClick="return mV(\'Jos\',24,30);">Jos 24:30</a>; compare <a onClick="return mV(\'Jdg\',2,9);">Jud 2:9</a>); see <a href="study/isbe/search.html?string=TIMNATH-HERES">TIMNATH-HERES</a>. The "brooks," or rather the wadies or "watercourses" of Gaash are mentioned as the native place of Hiddai (<a onClick="return mV(\'2Sa\',23,30);">2Sa 23:30</a>), or Hurai (<a onClick="return mV(\'1Ch\',11,32);">1Ch 11:32</a>), one of David\'s heroes. No likely identification has been suggested.`<a href="./study/isbe/search.html?string=EPHRAIM,+MOUNT">EPHRAIM, MOUNT</a>`1';
isbe[3612]='Gaba`ga\'-ba (gabha\' (in pause)).`<a href="./study/isbe/search.html?string=GEBA">GEBA</a>`1';
isbe[3613]='Gabael`gab\'-a-el (Gabael; Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) "Gabelus"):<P>(1) An ancestor of Tobit (Tobit 1:1).<P>(2) A poor Jew of Rages, a city of Media, to whom Tobit lent ten talents of silver (TOBIT 1:14). The money was restored to Tobit in the time of his distress through his son Tobias, whom the angel Raphael led to Gabael at Rages (TOBIT 1:14; 4:1,20; 5:6; 6:9; 10:2).``1';
isbe[3614]='Gabatha`gab\'-a-tha (Gabatha): A eunuch of Mardocheus (Additions to <span class="noTag">Esther 10:1</span>).``1';
isbe[3615]='Gabbai`gab\'-a-i (gabbay, "collector"): One of the chiefs of the Benjamites in Jerusalem after the return from the Babylonian captivity (<a onClick="return mV(\'Neh\',11,8);">Ne 11:8</a>).``1';
isbe[3616]='Gabbatha`gab\'-a-tha: Given (<a onClick="return mV(\'Jhn\',19,13);">Joh 19:13</a>) as the name of a special pavement (to lithostroton), and is probably a transcription in Greek of the Aramaic gabhetha\', meaning "height" or "ridge."<P>Tradition which now locates the Pretorium at the Antonia and associates the triple Roman arch near there with the "Ecce Homo" scene, naturally identifies an extensive area of massive Roman pavement, with blocks 4 ft. x 3 1/2 ft. and 2 ft. thick, near the "Ecce Homo Arch," as the Gabbatha.<P>This paved area is in places roughened for a roadway, and in other places is marked with incised designs for Roman games of chance. The site is a lofty one, the ground falling away rapidly to the east and west, and it must have been close to, or perhaps included in, the Antonia. But apart from the fact that it is quite improbable that the Pretorium was here (see <a href="study/isbe/search.html?string=PRAETORIUM">PRAETORIUM</a>), it is almost certain that the lithostroton was a mosaic pavement (compare <a onClick="return mV(\'Est\',1,6);">Es 1:6</a>), such as was very common in those days, and the site is irretrievably lost.``117';
isbe[3617]='Gabbe`gab\'-e (Gabbe; the King James Version Gabdes (1Esdras 5:20)):<P>Called Geba in <a onClick="return mV(\'Ezr\',2,26);">Ezr 2:26</a>.``1';
isbe[3618]='Gabrias`ga\'-bri-as (Gabrias): Brother of <a href="study/isbe/search.html?string=GABAEL">GABAEL</a> (which see).<P>In Tobit 4:20 he is described as his father. The readings are uncertain.``1';
isbe[3619]='Gabriel`ga\'-bri-el (gabhri\'-el, "Man of God"; Gabriel):<P>The name of the angel commissioned to explain to Daniel the vision of the ram and the he-goat, and to give the prediction of the 70 weeks (<a onClick="return mV(\'Dan\',8,16);">Da 8:16</a>; <a onClick="return mV(\'Dan\',9,21);">9:21</a>).<P>In the New Testament he is the angel of the annunciation to Zacharias of the birth of John the Baptist, and to Mary of the birth of Jesus (<a onClick="return mV(\'Luk\',1,19,26);">Lu 1:19, 26</a>).<P>Though commonly spoken of as an archangel, he is not so called in Scripture. He appears in the Book of Enoch (chapters <span class="noTag">9, 20, 40</span>) as one of 4 (or 6) chief angels. He is "set over all powers," presents, with the others, the cry of departed souls for vengeance, is "set over the serpents, and over Paradise, and over the cherubim." He is prominent in the Jewish Targums, etc.`<a href="./study/isbe/search.html?string=ANGEL">ANGEL</a>`132';
isbe[3620]='Gad (1)`(gadh, "fortune"; Gad):<P>1. The Name:<P>The seventh son of Jacob, whose mother was Zilpah (<a onClick="return mV(\'Gen\',30,11);">Ge 30:11</a>), and whose birth was welcomed by Leah with the cry, "Fortunate!" Some have sought to connect the name with that of the heathen deity Gad, of which traces are found in Baal-gad, Migdal-gad, etc. In the blessing of Jacob (<a onClick="return mV(\'Gen\',49,19);">Ge 49:19</a>) there is a play upon the name, as if it meant "troop," or "marauding band." "Gad, a troop shall press upon him; but he shall press upon their heel" (Hebrew gadh, gedhudh, yeghudhennu, wehu yaghudh \'aqebh). Here there is doubtless a reference to the high spirit and valor that characterized the descendants of Gad. The enemy who attacked them exposed himself to grave peril. In the blessing of Moses again (<a onClick="return mV(\'Deu\',33,20);">De 33:20</a>) it is said that Gad "dwelleth as lioness, and teareth the arm, yea, the crown of the head." Leonine qualities are ascribed to the Gadites, mighty men of valor, who joined David (<a onClick="return mV(\'1Ch\',12,8,14);">1Ch 12:8, 14</a>). Their "faces were like the faces of lions, and they were as swift as the roes upon the mountain." Among their captains "he that was least was equal to a hundred, and the greatest to a thousand."<P>2. The Tribe:<P>Of the patriarch Gad almost nothing is recorded. Seven sons went down with him into Egypt, when Jacob accepted Joseph s invitation (<a onClick="return mV(\'Gen\',46,16);">Ge 46:16</a>). At the beginning of the desert march Gad numbered 45,650 "from twenty years old and upward, all that were able to go forth to war" (<a onClick="return mV(\'Num\',1,24);">Nu 1:24</a>). In the plains of Moab the number had fallen to 40,500 (<a onClick="return mV(\'Num\',26,18);">Nu 26:18</a>). The place of Gad was with the standard of the camp of Reuben on the south side of the tabernacle (<a onClick="return mV(\'Num\',2,14);">Nu 2:14</a>). The prince of the tribe was Eliasaph, son of Deuel (<a onClick="return mV(\'Num\',1,14);">Nu 1:14</a>), or Reuel (<a onClick="return mV(\'Num\',2,14);">Nu 2:14</a>). Among the spies Gad was represented by Geuel son of Machi (<a onClick="return mV(\'Num\',13,15);">Nu 13:15</a>).<P>See <a href="study/isbe/search.html?string=NUMBERS">NUMBERS</a>.<P>3. The Tribal Territory:<P>From time immemorial the dwellers east of the Jordan have followed the pastoral life. When Moses had completed the conquest of these lands, the spacious uplands, with their wide pastures, attracted the great flock-masters of Reuben and Gad. In response to their appeal Moses assigned them their tribal portions here: only on condition, however, that their men of war should go over with their brethren, and take their share alike in the hardship and in the glory of the conquest of Western Palestine (<a onClick="return mV(\'Num\',32,\'1-\');">Nu 32</a>). When the victorious campaigns of Joshua were completed, the warriors of Reuben and Gad returned to their possessions in the East. They halted, however, in the Jordan valley to build the mighty altar of <i>Ed</i>. They feared lest the gorge of the Jordan should in time become all too effective a barrier between them and their brethren on the west. This altar should be for all time a "witness" to their unity in race and faith (<a onClick="return mV(\'Jos\',22,\'1-\');">Jos 22</a>). The building of the altar was at first misunderstood by the western tribes, but the explanation given entirely satisfied them.<P>4. Boundaries:<P>It is impossible to indicate with any certainty the boundaries of the territory of Gad. Reuben lay on the south, and the half-tribe of Manasseh on the north. These three occupied the whole of Eastern Palestine. The south border of Gad is given as the Arnon in <a onClick="return mV(\'Num\',32,34);">Nu 32:34</a>; but six cities to the north of the Arnon are assigned in <a onClick="return mV(\'Num\',32,16);">32:16</a>ff to Reuben. Again, <a onClick="return mV(\'Jos\',13,26);">Jos 13:26</a> makes Wady Chesban the southern boundary of Gad. Mesha, however (MS), says that the men of Gad dwelt in Ataroth from old time. This is far south of Wady Chesban. The writer of <a onClick="return mV(\'Num\',32,\'1-\');">Nu 32</a> may have regarded the Jabbok as the northern frontier of Gad; but <a onClick="return mV(\'Jos\',13,27);">Jos 13:27</a> extends it to the Sea of Chinnereth, making the Jordan the western boundary. It included Rabbath-ammon in the east. We have not now the information necessary to explain this apparent confusion. There can be no doubt that, as a consequence of strifes with neighboring peoples, the boundaries were often changed (<a onClick="return mV(\'1Ch\',5,18);">1Ch 5:18</a>f). For the Biblical writers the center of interest was in Western Palestine, and the details given regarding the eastern tribes are very meager. We may take it, however, that, roughly, the land of Gilead fell to the tribe of Gad. In <a onClick="return mV(\'Jdg\',5,17);">Jud 5:17</a> Gilead appears where we should naturally expect Gad, for which it seems to stand. The city of refuge, Ramoth in Gilead, was in the territory of Gad (<a onClick="return mV(\'Jos\',20,8);">Jos 20:8</a>). For description of the country see <a href="study/isbe/search.html?string=GILEAD+(1)">GILEAD</a>.<P>5. History:<P>Reuben and Gad were absent from the muster against Sisera (<a onClick="return mV(\'Jdg\',5,15);">Jud 5:15</a>); but they united with their brethren in taking vengeance on Benjamin, Jabesh-gilead, from which no contingent was sent, being destroyed (<a onClick="return mV(\'Jdg\',5,20);">20</a>f). Jephthah is probably to be reckoned to this tribe, his house, Mizpah (<a onClick="return mV(\'Jdg\',11,34);">Jud 11:34</a>), being apparently within its territory (<a onClick="return mV(\'Jos\',13,26);">Jos 13:26</a>). Gad furnished a refuge for some of the Hebrews during the Philistine oppression (<a onClick="return mV(\'1Sa\',13,7);">1Sa 13:7</a>). To David, while he avoided Saul at Ziklag, certain Gadites attached themselves (<a onClick="return mV(\'1Ch\',12,8);">1Ch 12:8</a>). A company of them also joined in making him king at Hebron (<a onClick="return mV(\'1Ch\',12,38);">1Ch 12:38</a>). In Gad the adherents of the house of Saul gathered round Ish-bosheth (<a onClick="return mV(\'2Sa\',2,8);">2Sa 2:8</a>). Hither David came in his flight from Absalom (<a onClick="return mV(\'2Sa\',17,24);">2Sa 17:24</a>). Gad fell to Jeroboam at the disruption of the kingdom, and Penuel, apparently within its borders, Jeroboam fortified at first (<a onClick="return mV(\'1Ki\',12,25);">1Ki 12:25</a>). It appears from the Moabite Stone that part of the territory afterward passed into the hands of Moab. Under Omri this was recovered; but Moab again asserted its supremacy. Elijah probably belonged to this district; and the brook Cherith must be sought in one of its wild secluded glens.<P>Gad formed the main theater of the long struggle between Israel and the Syrians. At Ramoth-gilead Ahab received his death wound (<a onClick="return mV(\'1Ki\',22,\'1-\');">1Ki 22</a>). Under Jeroboam II, this country was once more an integral part of the land of Israel. In 734 BC, however, Tiglath-pileser appeared, and conquered all Eastern Palestine, carrying its inhabitants captive (<a onClick="return mV(\'2Ki\',15,29);">2Ki 15:29</a>; <a onClick="return mV(\'1Ch\',5,26);">1Ch 5:26</a>). This seems to have furnished occasion for the children of Ammon to occupy the country (<a onClick="return mV(\'Jer\',49,1);">Jer 49:1</a>). In Ezekiel\'s ideal picture (<a onClick="return mV(\'Eze\',48,27,34);">Eze 48:27, 34</a>), a place is found for the tribe of Gad. Obadiah seems to have forgotten the tribe, and their territory is assigned to Benjamin (<a onClick="return mV(\'Oba\',1,19);">1:19</a>). Gad, however, has his place among the tribes of Israel in <a onClick="return mV(\'Rev\',7,\'1-\');">Re 7</a>.``54';
isbe[3621]='Gad (2)`(gadh, "fortunate"): David\'s seer (chozeh, <a onClick="return mV(\'1Ch\',21,9);">1Ch 21:9</a>; <a onClick="return mV(\'1Ch\',29,29);">29:29</a>; <a onClick="return mV(\'2Ch\',29,25);">2Ch 29:25</a>), or prophet (nabhi\'; compare <a onClick="return mV(\'1Sa\',22,5);">1Sa 22:5</a>; <a onClick="return mV(\'2Sa\',24,11);">2Sa 24:11</a>). He appears<P>(1) to advise David while an outlaw fleeing before Saul to return to the land of Judah (<a onClick="return mV(\'1Sa\',22,5);">1Sa 22:5</a>);<P>(2) to rebuke David and give him his choice of punishments when, in spite of the advice of Joab and the traditional objections (compare <a onClick="return mV(\'Exd\',30,11);">Ex 30:11</a>ff), he had counted the children of Israel (<a onClick="return mV(\'2Sa\',24,11);">2Sa 24:11</a>; <a onClick="return mV(\'1Ch\',21,9);">1Ch 21:9</a>);<P>(3) to instruct David to erect an altar on the threshing-floor of Araunah when the plague that had descended on Israel ceased (<a onClick="return mV(\'2Sa\',24,18);">2Sa 24:18</a>; <a onClick="return mV(\'1Ch\',21,18);">1Ch 21:18</a>); and<P>(4) to assist in the arrangement of Levitical music with cymbals, psalteries and harps (compare <a onClick="return mV(\'2Ch\',29,25);">2Ch 29:25</a>).<P>Of his writings none are known, though he is said to have written a history of a part of David\'s reign (<a onClick="return mV(\'1Ch\',29,29);">1Ch 29:29</a>).``80';
isbe[3622]='Gad (3)`(gadh, "fortune"): A god of Good Luck, possibly the Hyades. The writer in <a onClick="return mV(\'Isa\',65,11);">Isa 65:11</a> (margin) pronounces a curse against such as are lured away to idolatry. The warning here, according to Cheyne, is specifically against the Samaritans, whom with their religion the Jews held in especial abhorrence. The charge would, however, apply just as well to superstitious and semi-pagan Jews. "But ye that forsake Yahweh, that forget my holy mountain, that prepare a table for Fortune, and that fill up mingled wine unto Destiny; I will destine you to the sword, and ye shall all bow down to the slaughter." There is a play upon words here: "Fill up mingled wine unto Destiny" (meni) and "I will destine manithi, i.e. portion out) you for the sword" (<a onClick="return mV(\'Isa\',65,11,12);">Isa 65:11-12</a>). Gad and Meni mentioned here are two Syrian-deities (Cheyne, Book of the Prophet Isaiah, 198). Schurer (Gesch. d. jud. Volkes, II, 34 note, and bibliography) disputes the reference of the Greek (Tuche) cult to the Semitic Gad, tracing it rather to the Syrian "Astarte" worship. The custom was quite common among heathen peoples of spreading before the gods tables laden with food (compare Herod. i. 181, 183; Smith, Rel. of Semites, Lect X).<P>Nothing is known of a Babylonian deity named Gad, but there are Aramean and Arabic equivalents. The origin may have been a personification of fortune and destiny, i.e. equivalent to the Fates. The Nabatean inscriptions give, in plural, form, the name of Meni. Achimenidean coins (Persian) are thought by some to bear the name of Meni. How widely spread these Syrian cults became, may be seen in a number of ways, e.g. an altar from Vaison in Southern France bearing an inscription:<P>"Belus Fortunae rector, Menisque Magister."<P>Belus, signifying the Syrian Bel of Apamaea (Driver). Canaanitish place-names also attest the prevalence of the cult, as Baal-gad, at the foot of Hermen (<a onClick="return mV(\'Jos\',11,17);">Jos 11:17</a>; <a onClick="return mV(\'Jos\',12,7);">12:7</a>; <a onClick="return mV(\'Jos\',13,5);">13:5</a>); Migdal-gad, possibly Mejdel near Askalon (<a onClick="return mV(\'Jos\',15,37);">Jos 15:37</a>); Gaddi and Gaddiel (<a onClick="return mV(\'Num\',13,10);">Nu 13:10</a>f). In Talmudic literature the name of Gad is frequently invoked (compare McCurdy in Jewish Encyclopedia, V, 544). Indeed the words of Leah in <a onClick="return mV(\'Gen\',30,11);">Ge 30:11</a> may refer not to good fortune or luck but to the deity who was especially regarded as the patron god of Good Fortune (compare Kent, Student\'s Old Testament, I, 111). Similar beliefs were held among the Greeks and Romans, e.g. Hor. Sat. ii.8, 61:<p>".... Fortuna, quis est crudelior in nos te deus?"<P>Cic. N.D. iii.24, 61:<P>"Quo in genere vel maxime est Fortuna numeranda."<P>The question has also an astronomical interest. Arabic tradition styled the planet Jupiter the greater fortune, and Venus the lesser fortune. Jewish tradition identified Gad with the planet Jupiter, and it has been conjectured that Meni is to be identified with the planet Venus.`<a href="./study/isbe/search.html?string=ASTROLOGY">ASTROLOGY</a>`164';
isbe[3623]='Gad (4)`(\'azal, "to go about"): Used once in <a onClick="return mV(\'Jer\',2,36);">Jer 2:36</a>, "Why gaddest thou about so much to change thy way?" of going after Egypt and Assyria.``1';
isbe[3624]='Gad, Valley of`(nachal ha-gadh; the King James Version River of Gad):<P>In <a onClick="return mV(\'2Sa\',24,5);">2Sa 24:5</a> we read that Joab and the captains of the host passed over Jordan and pitched in Aroer, on the right side of the city that is in the midst of the valley of Gad.<P>If we refer to <a onClick="return mV(\'Jos\',13,25);">Jos 13:25</a>f; this might seem to indicate a valley near Rabbath-ammon. According to a generally accepted emendation suggested by Wellhausen, however, we should read, "They began from Aroer, and from the city that is in the middle of the torrent valley, toward Gad."<P>See <a href="study/isbe/search.html?string=AR">AR</a>. The valley is evidently the Arnon.``54';
isbe[3625]='Gadara`gad\'-a-ra (Gadara):<P>1. Country of the Gadarenes:<P>This city is not named in Scripture, but the territory belonging to it is spoken of as chora ton Gadarenon, "country of the Gadarenes" (<a onClick="return mV(\'Mat\',8,28);">Mt 8:28</a>). In the parallel passages (<a onClick="return mV(\'Mar\',5,1);">Mr 5:1</a>; <a onClick="return mV(\'Luk\',8,26,37);">Lu 8:26, 37</a>) we read: chora ton Gerasenon "country of the Gerasenes." There is no good reason, however, to question the accuracy of the text in either case. The city of Gadara is represented today by the ruins of Umm Qeis on the heights south of el-Chummeh—the hot springs in the Yarmuk valley—about 6 miles southeast of the Sea of Galilee. It maybe taken as certain that the jurisdiction of Gadara, as the chief city in these regions, extended over the country east of the Sea, including the lands of the subordinate town, <a href="study/isbe/search.html?string=GERASA">GERASA</A> (which see). The figure of a ship frequently appears on its coins: conclusive. proof that its territory reached the sea. The place might therefore be called with propriety, either "land of the Gerasenes," with reference to the local center, or "land of the Gadarenes," with reference to the superior city.<P>(NOTE.—The Textus Receptus of the New Testament reading. ton Gergesenon, "of the Gergesenes," must be rejected (Westcott-Hort, II. App., 11).)<P>2. History:<P>The name Gadara appears to be Semitic It is still heard in Jedur, which attaches to the ancient rock tombs, with sarcophagi, to the east of the present ruins. They are closed by carved stone doors, and are used as storehouses for grain, and also as dwellings by the inhabitants. The place is not mentioned till later times. It was taken by Antiochus the Great when in 218 BC he first invaded Palestine (Polyb. v.71). Alexander Janneus invested the place, and reduced it after a ten months\' siege (Ant., XIII, iii, 3; BJ, I, iv, 2). Pompey is said to have restored it, 63 BC (Ant., XIV, iv, 4; BJ, I, vii, 7); from which it would appear to have declined in Jewish hands. He gave it a free constitution. From this date the era of the city was reckoned. It was the seat of one of the councils instituted by Gabinius for the government of the Jews (Ant., XIV, v, 4; BJ, I, viii, 5). It was given by Augustus to Herod the Great in 30 BC (Ant., XV, vii, 3; BJ, I, xx, 3). The emperor would not listen to the accusations of the inhabitants against Herod for oppressive conduct (Ant., XV, x, 2f). After Herod\'s death it was joined to the province of Syria, 4 BC (Ant., XVII, xi, 4; BJ, II, vi, 3). At the beginning of the Jewish revolt the country around Gadara was laid waste (BJ, II, xviii, 1). The Gadarenes captured some of the boldest of the Jews, of whom several were put to death, and others imprisoned (ibid., 5). A party in the city surrendered it to Vespasian, who placed a garrison there (BJ, IV, vii, 3). It continued to be a great and important city, and was long the seat of a bishop (Reland, Palestine, 776). With the conquest of the Moslems it passed under eclipse, and is now an utter ruin.<P>3. Identification and Description:<P>Umm Cheis answers the description given of Gadara by ancient writers. It was a strong fortress (Ant., XIII, iii, 3), near the Hieromax—i.e. Yarmuk (Pliny N H, xvi)—east of Tiberias and Scythopolis, on the top of a hill, 3 Roman miles from hot springs and baths called Amatha, on the bank of the Hieromax (Onomasticon, under the word). The narrow ridge on which the ruins lie runs out toward the Jordan from the uplands of Gilead, with the deep gorge of Wady Yarmuk—Hieromax—on the north, and Wady el \'Arab on the south. The hot springs, as noted above, are in the bottom of the valley to the north. The ridge sinks gradually to the east, and falls steeply on the other three sides, so that the position was one of great strength. The ancient walls may be traced in almost their entire circuit of 2 miles. One of the great Roman roads ran eastward to Der\'ah; and an aqueduct has been traced to the pool of el Khab, about 20 miles to the north of Der\'ah. The ruins include those of two theaters, a basilica, a temple, and many important buildings, telling of a once great and splendid city. A paved street, with double colonnade, ran from east to west. The ruts worn in the pavement by the chariot wheels are still to be seen.<P>That there was a second Gadara seems certain, and it may be intended in some of the passages referred to above. It is probably represented by the modern Jedur, not far from es-Salt (Buhl, Buhl, Geographic des alten Palastina, 255; Guthe). Josephus gives Pella as the northern boundary of Peraea (BJ, III, iii, 3). This would exclude Gadara on the Hieromax. The southern city, therefore, should be understood as "the capital of Peraea" in BJ, IV; vii, 3.<P>Gadara was a member of the <a href="study/isbe/search.html?string=DECAPOLIS">DECAPOLIS</a> (which see).``54';
isbe[3626]='Gadarenes`gad-a-renz\'.`<a href="./study/isbe/search.html?string=GADARA">GADARA</a>`1';
isbe[3627]='Gaddi`gad\'-i (gaddi, "my fortune"):<P>One of the twelve spies, son of Susi, and a chief of Manasseh (<a onClick="return mV(\'Num\',13,11);">Nu 13:11</a>).``1';
isbe[3628]='Gaddiel`gad\'-i-el (gaddi\'el, "blest of God"):<P>One of the twelve men sent by Moses from the wilderness of Paran to spy out the land of Canaan. He represented the tribe of Zebulun (<a onClick="return mV(\'Num\',13,10);">Nu 13:10</a>).``1';
isbe[3629]='Gaddis`gad\'-is (A Gaddis; Kaddis; the King James Version Caddis):<P>Surname of John, the eldest brother of Judas Maccabeus (1Macc 2:2).``1';
isbe[3630]='Gadi`ga\'-di (gadhi, "fortunate"):<P>The father of Menahem, one of the kings of Israel who reached the throne through blood (<a onClick="return mV(\'2Ki\',15,14,17);">2Ki 15:14, 17</a>).``1';
isbe[3631]='Gadites`gad\'-its:<P>Members of the tribe of Gad (<a onClick="return mV(\'Deu\',3,12);">De 3:12</a>, etc.).``1';
isbe[3632]='Gaham`ga\'-ham (gacham):<P>A son of Nahor, brother of Abraham, by his concubine Reumah (<a onClick="return mV(\'Gen\',22,24);">Ge 22:24</a>).``1';
isbe[3633]='Gahar`ga\'-har (gachar):<P>A family name of the Nethinim who came up with Zerubbabel to Jerusalem (<a onClick="return mV(\'Ezr\',2,47);">Ezr 2:47</a>; <a onClick="return mV(\'Neh\',7,49);">Ne 7:49</a>); in 1Esdras 5:30 called Geddur.``1';
isbe[3634]='Gai`ga\'-i (gay\'):<P>In the Revised Version (British and American) of <a onClick="return mV(\'1Sa\',17,52);">1Sa 17:52</a> for the King James Version "valleys." the Revised Version, margin notes: "The Syriac and some editions of the Septuagint have Gath" (thus also Wellhausen, Budde, Driver, etc.).``1';
isbe[3635]='Gain`gan: In the Old Testament the translation of three Hebrew substantives, betsa\', "unjust gain," "any gain" (<a onClick="return mV(\'Jdg\',5,19);">Jud 5:19</a>; <a onClick="return mV(\'Job\',22,3);">Job 22:3</a>; <a onClick="return mV(\'Pro\',1,19);">Pr 1:19</a>; <a onClick="return mV(\'Pro\',15,27);">15:27</a>; <a onClick="return mV(\'Isa\',33,15);">Isa 33:15</a>; <a onClick="return mV(\'Isa\',56,11);">56:11</a>; <a onClick="return mV(\'Eze\',22,13,17);">Eze 22:13, 17</a>; <a onClick="return mV(\'Mic\',4,13);">Mic 4:13</a>); mechir, "price" for which a thing is sold (<a onClick="return mV(\'Dan\',11,39);">Da 11:39</a>, the only place where the Hebrew word is translated "gain" in the King James Version, though it occurs in other places translated "price"); tebhu\'ah, "produce," "profits," "fruit" (<a onClick="return mV(\'Pro\',3,14);">Pr 3:14</a>). It is the translation of one Hebrew verb, batsa\', "to gain dishonestly" (<a onClick="return mV(\'Job\',27,8);">Job 27:8</a>); of one Aramaic verb, zebhan, "to buy," "procure for oneself" (<a onClick="return mV(\'Dan\',2,8);">Da 2:8</a>, here used of buying time, i.e. "seeking delay" (Gesenius)).<P>In the New Testament, the translation of three Greek substantives, ergasia, "gain gotten by work," "profit" (<a onClick="return mV(\'Act\',16,16,19);">Ac 16:16, 19</a>; <a onClick="return mV(\'Act\',19,24);">19:24</a> (the King James Version)); kerdos, "gain," "advantage" (<a onClick="return mV(\'Phl\',2,1);">Php 2:1</a>; <a onClick="return mV(\'Phl\',3,7);">3:7</a>, in the former, Paul asserting that to him to die was a personal advantage, because then he would "be with Christ"; in the latter, he counts as "loss" his personal privileges in the flesh, when compared with "the excellency of the knowledge of Christ"); porismos, "gain," "a source of gain" (<a onClick="return mV(\'1Ti\',6,5,6);">1Ti 6:5-6</a>, where the apostle asserts, not "gain" (earthly) is godliness, but godliness is "gain" (real, abiding)).<P>It is the translation of three Greek vbs., kerdaino, "to gain," "acquire," in <a onClick="return mV(\'Mat\',16,26);">Mt 16:26</a>, where Jesus teaches that the soul, or life in its highest sense ("his own self," <a onClick="return mV(\'Luk\',9,25);">Lu 9:25</a>), is worth more than the "gaining" of the whole (material) world; <a onClick="return mV(\'Mat\',18,15);">Mt 18:15</a>, concerning the winning of a sinning brother by private interview; <a onClick="return mV(\'Mat\',25,17,22);">Mt 25:17-22</a>, the parable of the Talents; <a onClick="return mV(\'Act\',27,21);">Ac 27:21</a> the King James Version, injury "gained," sustained, by sailing from Crete; <a onClick="return mV(\'1Cr\',9,\'19-22\');">1Co 9:19-20 bis, 21,22</a>, all referring to Paul\'s life-principle of accommodation to others to "gain," win, them to Christ; in <a onClick="return mV(\'Jam\',4,13);">Jas 4:13</a> used in a commercial sense; poieo, "to make," "make gain" (<a onClick="return mV(\'Luk\',19,18);">Lu 19:18</a> the King James Version, the parable of the Pounds); prosergazomai, "to gain by trading" (<a onClick="return mV(\'Luk\',19,16);">Lu 19:16</a>, commercial use, in the same parallel).``194';
isbe[3636]='Gainsay`gan-sa, gan\'-sa (anteipon, antilego, "to say or speak against"): Occurs as anteipon, "not...able to withstand or to gainsay" (<a onClick="return mV(\'Luk\',21,15);">Lu 21:15</a>); as antilego, "a disobedient and gainsaying people" (<a onClick="return mV(\'Rom\',10,21);">Ro 10:21</a>); 2Esdras 5:29, contradicebant; Judith 8:28, anthistemi; Judith 12:14, antero; Additions to <span class="noTag">Esther 9:13</span>, antitasso; 1Macc 14:44, anteipon.<P>Gainsayer, antilego (<a onClick="return mV(\'Tts\',1,9);">Tit 1:9</a>, "exhort and convince (the Revised Version (British and American) "convict") the gainsayers").<P>Gainsaying, antilogia (<a onClick="return mV(\'Jud\',1,11);">Jude 1:11</a>, "the gain-saying of Korah"); antilogia is Septuagint for meribhah (<a onClick="return mV(\'Num\',20,13);">Nu 20:13</a>); anantirrhetos, "without contradiction" (<a onClick="return mV(\'Act\',10,29);">Ac 10:29</a>, "without gainsaying").<P>The Revised Version (British and American) has "gainsaid" for "spoken against" (<a onClick="return mV(\'Act\',19,36);">Ac 19:36</a>); "not gainsaying" for "not answering again" (<a onClick="return mV(\'Tts\',2,9);">Tit 2:9</a>); "gainsaying" for "contradiction" <a onClick="return mV(\'Hbr\',12,3);">Heb 12:3</a>).``185';
isbe[3637]='Gaius`ga\'-yus (Gaios; Westcott and Hort, The New Testament in Greek, Gaios):<P>(1) The Gaius to whom 3 John is addressed. He is spoken of as "the beloved" (<a onClick="return mV(\'3Jo\',1,1,2,5,11);">3Joh 1:1-2, 5, 11</a>), "walking in the truth" (<a onClick="return mV(\'3Jo\',1,3,4);">3Joh 1:3-4</a>), and doing "a faithful work" "toward them that are brethren and strangers withal" (<a onClick="return mV(\'3Jo\',1,5,6);">3Joh 1:5-6</a>). He has been identified by some with the Gaius mentioned in the Apostolical Constitutions (VII, 46), as having been appointed bishop of Pergamum by John.<P>(2) Gaius of Macedonia, a "companion in travel" of Paul (<a onClick="return mV(\'Act\',19,29);">Ac 19:29</a>). He was one of those who were seized by Demetrius and the other silversmiths in the riot at Ephesus, during Paul\'s third missionary journey.<P>(3) Gaius of Derbe, who was among those who accompanied Paul from Greece "as far as Asia," during his third missionary journey (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>). In the corresponding list given in the "Contendings of Paul" (compare Budge, Contendings of the Twelve Apostles, II, 592), the name of this Gaius is given as "Gallius."<P>(4) Gaius, the host of Paul when he wrote the Epistle to the Roman, and who joined in sending his salutations (<a onClick="return mV(\'Rom\',16,23);">Ro 16:23</a>). As Paul wrote this epistle from Corinth, it is probable that this Gaius is identical with (5).<P>(5) Gaius, whom Paul baptized at Corinth (<a onClick="return mV(\'1Cr\',1,14);">1Co 1:14</a>).``88';
isbe[3638]='Galaad`gal\'-a-ad (Galaad, Greek form of Gilead (1Macc 5:9,55; Judith 1:8)).``1';
isbe[3639]='Galal`ga\'-lal (galal):<P>The name of two Levites, one mentioned in <a onClick="return mV(\'1Ch\',9,15);">1Ch 9:15</a>, the other in <a onClick="return mV(\'1Ch\',9,16);">1Ch 9:16</a> and <a onClick="return mV(\'Neh\',11,17);">Ne 11:17</a>.``1';
isbe[3640]='Galatia`ga-la\'-shi-a, ga-la\'-sha (Galatia):<P><b>I. INTRODUCTORY</b><P class="in15">1. Two Senses of Name<P class="in30">(1) Geographical<P class="in30">(2) Political<P class="in15">2. Questions to Be Answered<P><b>II. ORIGIN OF NAME</b><P class="in15">1. The Gaulish Kingdom<P class="in15">2. Transference to Rome<P class="in15">3. The Roman Province<P><b>III. THE NARRATIVE OF LUKE</b><P class="in15">1. Stages of Evangelization of Province<P class="in15">2. The Churches Mentioned<P><b>IV. PAUL\'S USE OF "GALATIANS"</b><hr /><P>I. Introductory.<P>1. Two Senses of Name:<P>"Galatia" was a name used in two different senses during the 1st century after Christ:<P>(1) Geographical<P>To designate a country in the north part of the central plateau of Asia Minor, touching Paphlagonia and Bithynia north, Phrygia west and south, Cappadocia and Pontus southeast and east, about the headwaters of the Sangarios and the middle course of the Halys;<P>(2) Political<P>To designate a large province of the Roman empire, including not merely the country Galatia, but also Paphlagonia and parts of Pontus, Phrygia, Pisidia, Lycaonia and Isauria. The name occurs in <a onClick="return mV(\'1Cr\',16,1);">1Co 16:1</a>; <a onClick="return mV(\'Gal\',1,2);">Ga 1:2</a>; <a onClick="return mV(\'1Pe\',1,1);">1Pe 1:1</a>, and perhaps <a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>. Some writers assume that Galatia is also mentioned in <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a>; <a onClick="return mV(\'Act\',18,23);">18:23</a>; but the Greek there has the phrase "Galatic region" or "territory," though the English Versions of the Bible has "Galatia"; and it must not be assumed without proof that "Galatic region" is synonymous with "Galatia." If e.g. a modern narrative mentioned that a traveler crossed British territory, we know that this means something quite different from crossing Britain. "Galatic region" has a different connotation from "Galatia"; and, even if we should find that geographically it was equivalent, the writer had some reason for using that special form.<P>2. Questions to Be Answered:<P>The questions that have to be answered are: (a) In which of the two senses is "Galatia" used by Paul and Peter? (b) What did Luke mean by Galatic region or territory? These questions have not merely geographical import; they bear most closely, and exercise determining influence, on many points in the biography, chronology, missionary work and methods of Paul.<P>II. Origin of the Name "Galatia."<P>1. The Gaulish Kingdom:<P>The name was introduced into Asia after 278-277 BC, when a large body of migrating Gauls (Galatai in Greek) crossed over from Europe at the invitation of Nikomedes, king of Bithynia; after ravaging a great part of Western Asia Minor they were gradually confined to a district, and boundaries were fixed for them after 232 BC. Thus, originated the independent state of Galatia, inhabited by three Gaulish tribes, Tolistobogioi, Tektosages and Trokmoi, with three city-centers, Pessinus, Ankyra and Tavia (Tavion in Strabo), who had brought their wives and families with them, and therefore continued to be a distinct Gaulish race and stock (which would have been impossible if they had come as simple warriors who took wives from the conquered inhabitants). The Gaulish language was apparently imposed on all the old inhabitants, who remained in the country as an inferior caste. The Galatai soon adopted the country religion, alongside of their own; the latter they retained at least as late as the 2nd century after Christ, but it was politically important for them to maintain and exercise the powers of the old priesthood, as at Pessinus, where the Galatai shared the office with the old priestly families.<P>2. Transference to Rome:<P>The Galatian state of the Three Tribes lasted till 25 BC, governed first by a council and by tetrarchs, or chiefs of the twelve divisions (four to each tribe) of the people, then, after 63 BC, by three kings. Of these, Deiotaros succeeded in establishing himself as sole king, by murdering the two other tribal kings; and after his death in 40 BC his power passed to Castor and then to Amyntas, 36-25 BC. Amyntas bequeathed his kingdom to Rome; and it was made a Roman province (Dion Cass. 48, 33, 5; Strabo, 567, omits Castor). Amyntas had ruled also parts of Phrygia, Pisidia, Lycaonia and Isauria. The new province included these parts, and to it were added Paphlagonia 6 BC, part of Pontus 2 BC (called Pontus Galaticus in distinction from Eastern Pontus, which was governed by King Polemon and styled Polemoniacus), and in 64 also Pontus Polemoniacus. Part of Lycaonia was non-Roman and was governed by King Antiochus; from 41 to 72 AD Laranda belonged to this district, which was distinguished as Antiochiana regio from the Roman region Lycaonia called Galatica.<P>3. The Roman Province:<P>This large province was divided into regiones for administrative purposes; and the regiones coincided roughly with the old national divisions Pisidia, Phrygia (including Antioch, Iconium, Apollonia), Lycaonia (including Derbe, Lystra and a district organized on the village-system), etc. See Calder in Journal of Roman Studies, 1912. This province was called by the Romans Galatia, as being the kingdom of Amyntas (just like the province Asia, which also consisted of a number of different countries as diverse and alien as those of province Galatia, and was so called because the Romans popularly and loosely spoke of the kings of that congeries of countries as kings of Asia). The extent of both names, Asia and Galatia, in Roman language, varied with the varying bounds of each province. The name "Galatia" is used to indicate the province, as it was at the moment, by Ptolemy, Pliny v.146, Tacitus Hist. ii.9; Ann. xiii. 35; later chroniclers, Syncellus, Eutropius, and Hist. Aug. Max. et Balb. 7 (who derived it from earlier authorities, and used it in the old sense, not the sense customary in their own time); and in inscriptions CIL, III, 254, 272 (Eph. Ep. v.51); VI, 1408, 1409, 332; VIII, 11028 (Mommsen rightly, not Schmidt), 18270, etc. It will be observed that these are almost all Roman sources, and (as we shall see) express a purely Roman view. If Paul used the name "Galatia" to indicate the province, this would show that he consistently and naturally took a Roman view, used names in a Roman connotation, and grouped his churches according to Roman provincial divisions; but that is characteristic of the apostle, who looked forward from Asia to Rome (<a onClick="return mV(\'Act\',19,21);">Ac 19:21</a>), aimed at imperial conquest and marched across the Empire from province to province (Macedonia, Achaia, Asia are always provinces to Paul). On the other hand, in the East and the Greco-Asiatic world, the tendency was to speak of the province either as the Galatic Eparchia (as at Iconium in 54 AD, CIG, 3991), or by enumeration of its regiones (or a selection of the regiones). The latter method is followed in a number of inscriptions found in the province (CIL, III, passim). Now let us apply these contemporary facts to the interpretation of the narrative of Luke.<P>III. The Narrative of Luke.<P>1. Stages of Evangelization of Province:<P>The evangelization of the province began in <a onClick="return mV(\'Act\',13,14);">Ac 13:14</a>. The stages are:<P>(1) the audience in the synagogue, <a onClick="return mV(\'Act\',13,42);">Ac 13:42</a>f;<P>(2) almost the whole city, <a onClick="return mV(\'Act\',13,44);">13:44</a>;<P>(3) the whole region, i.e. a large district which was affected from the capital (as the whole of Asia was affected from Ephesus <a onClick="return mV(\'Act\',19,10);">19:10</a>);<P>(4) Iconium another city of this region: in <a onClick="return mV(\'Act\',13,51);">13:51</a> no boundary is mentioned;<P>(5) a new region Lycaonia with two cities and surrounding district (<a onClick="return mV(\'Act\',14,6);">14:6</a>);<P>(6) return journey to organize the churches in (a) Lystra, (b) Iconium and Antioch (the secondary reading of Westcott and Hort, (kai eis Ikonion kai Antiocheleian), is right, distinguishing the two regions (a) Lycaonia, (b) that of Iconium and Antioch);<P>(7) progress across the region Pisidia, where no churches were founded (Pisidian Antioch is not in this region, which lies between Antioch and Pamphylia).<P>Again (in <a onClick="return mV(\'Act\',16,\'1-6\');">Ac 16:1-6</a>) Paul revisited the two regiones:<P>(1) Derbe and Lystra, i.e. regio Lycaonia Galatica,<P>(2) the Phrygian and Galatic region, i.e. the region which was racially Phrygian and politically Galatic. Paul traversed both regions, making no new churches but only strengthening the existing disciples and churches. In <a onClick="return mV(\'Act\',18,23);">Ac 18:23</a> he again revisited the two regiones, and they are briefly enumerated:<P>(1) the Galatic region (so called briefly by a traveler, who had just traversed Antiochiana and distinguished Galatica from it);<P>(2) Phrygia. On this occasion he specially appealed, not to churches as in <a onClick="return mV(\'Act\',16,6);">16:6</a>, but to disciples; it was a final visit and intended to reach personally every individual, before Paul went away to Rome and the West. On this occasion the contribution to the poor of Jerusalem was instituted, and the proceeds later were carried by Timothy and Gaius of Derbe (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>; <a onClick="return mV(\'Act\',24,17);">24:17</a>; <a onClick="return mV(\'1Cr\',16,1);">1Co 16:1</a>); this was a device to bind the new churches to the original center of the faith.<P>2. The Churches Mentioned:<P>These four churches are mentioned by Luke always as belonging to two regiones, Phrygia and Lycaoma; and each region is in one case described as Galatic, i.e. part of the province Galatia. Luke did not follow the Roman custom, as Paul did; he kept the custom of the Greeks and Asiatic peoples, and styled the province by enumerating its regiones, using the expression Galatic (as in Pontus Galaticus and at Iconium, CIG, 3991) to indicate the supreme unity of the province. By using this adjective about both regiones he marked his point of view that all four churches are included in the provincial unity.<P>From Paul\'s references we gather that he regarded the churches of Galatia as one group, converted together (<a onClick="return mV(\'Gal\',4,13);">Ga 4:13</a>), exposed to the same influences and changing together (<a onClick="return mV(\'Gal\',1,6,8);">Ga 1:6, 8</a>; <a onClick="return mV(\'Gal\',3,1);">3:1</a>; <a onClick="return mV(\'Gal\',4,9);">4:9</a>), naturally visited at one time by a traveler (<a onClick="return mV(\'Gal\',1,8);">Ga 1:8</a>; <a onClick="return mV(\'Gal\',4,14);">4:14</a>). He never thinks of churches of Phrygia or of Lycaonia; only of province Galatia (as of provinces Asia, Macedonia, Achaia). Paul did not include in one class all the churches of one journey: he went direct from Macedonia to Athens and Corinth, but classes the churches of Macedonia separate from those of Achaia. Troas and Laodicea and Colosse he classed with Asia (as Luke did Troas <a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>), Philippi with Macedonia, Corinth with Achaia. These classifications are true only of the Roman usage, not of early Greek usage. The custom of classifying according to provinces, universal in the fully formed church of the Christian age, was derived from the usage of the apostles (as Theodore Mopsuestia expressly asserts in his Commentary on First Timothy (Swete, II, 121); Harnack accepts this part of the statement (Verbreitung, 2nd edition, I, 387; Expansion, II, 96)). His churches then belonged to the four provinces, Asia, Galatia, Achaia, Macedonia. There were no other Pauline churches; all united in the gift of money which was carried to Jerusalem (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>; <a onClick="return mV(\'Act\',24,17);">24:17</a>).<P>IV. Paul\'s Use of "Galatians."<P>The people of the province of Galatia, consisting of many diverse races, when summed up together, were called Galatai, by Tacitus, Ann. xv.6; Syncellus, when he says (Augoustos Galatais phorous etheto), follows an older historian describing the imposing of taxes on the province; and an inscription of Apollonia Phrygiae calls the people of the city Galatae (Lebas-Waddington, 1192). If Paul spoke to Philippi or Corinth or Antioch singly, he addressed them as Philippians, Corinthians, Antiochians (<a onClick="return mV(\'Phl\',4,15);">Php 4:15</a>; <a onClick="return mV(\'2Cr\',6,11);">2Co 6:11</a>), not as Macedonians or Achaians; but when he had to address a group of several churches (as Antioch, Iconium, Derbe and Lystra) he could use only the provincial unity, Galatae.<P>All attempts to find in Paul\'s letter to the Galatians any allusions that specially suit the character of the Gauls or Galatae have failed. The Gauls were an aristocracy in a land which they had conquered. They clung stubbornly to their own Celtic religion long after the time of Paul, even though they also acknowledged the power of the old goddess of the country. They spoke their own Celtic tongue. They were proud, even boastful, and independent. They kept their native law under the Empire. The "Galatians" to whom Paul wrote had changed very quickly to a new form of religion, not from fickleness, but from a certain proneness to a more oriental form of religion which exacted of them more sacrifice of a ritual type. They needed to be called to freedom; they were submissive rather than arrogant. They spoke Greek. They were accustomed to the Greco-Asiatic law: the law of adoption and inheritance which Paul mentions in his letter is not Roman, but Greco-Asiatic, which in these departments was similar, with some differences; on this see the writer\'s Historical Commentary on Galatians.``144';

isbe[3642]='Galatians, Epistle to the` <p><b>I. THE AUTHORSHIP</b><P>1. Position of the Dutch School<P>2. Early Testimony<P><b>II. THE MATTER OF THE EPISTLE</b><P>A) Summary of Contents<P class="in15">1. Outline<P class="in15">2. Personal History (<a onClick="return mV(\'Gal\',1,11);">Galatians 1:11-2:21</a>; <a onClick="return mV(\'Gal\',4,\'12-20\');">4:12-20</a>; <a onClick="return mV(\'Gal\',6,17);">6:17</a>)<P class="in30">Paul\'s Independent Apostleship<P class="in15">3. The Doctrinal Polemic (<a onClick="return mV(\'Gal\',3,1);">Galatians 3:1-5:12</a>)<p class="in30">(1) Thesis<p class="in30">(2) Main Argument<p class="in30">(3) Appeal and Warning<P class="in15">4. The Ethical Application (<a onClick="return mV(\'Gal\',5,12);">Galatians 5:12-6:10</a>)<P class="in30">Law of the Spirit of Life<P class="in15">5. The Epilogue (<a onClick="return mV(\'Gal\',6,\'11-18\');">Galatians 6:11-18</a>)<P>B) Salient Points<P class="in15">1. The Principles at Stake<P class="in15">2. Present Stage of the Controversy<P class="in15">3. Paul\'s Depreciation of the Law<P class="in15">4. The Personal Question<P>C) Characteristics<P class="in15">1. Idiosyncrasy of the Epistle<P class="in15">2. Jewish Coloring<P><b>III. RELATIONS TO OTHER EPISTLES</b><P class="in15">1. Galatians and Romans<P class="in15">2. Links with 1 and 2 Corinthians<P class="in15">3. With the Corinthians-Romans Group<P class="in15">4. With Other Groups of Epistles<P class="in15">5. General Comparison<P><b>IV. THE DESTINATION AND DATE</b><P class="in15">1. Place and Time Interdependent<P class="in15">2. Internal Evidence<P class="in15">3. External Data<P class="in30">(1) Galatia and the Galatians<P class="in30">(2) Prima facie Sense of <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a><P class="in30">(3) The Grammar of <a onClick="return mV(\'Act\',16,6);">Ac 16:6</a><P class="in30">(4) Notes of Time in the Epistle<P class="in30">(5) Paul\'s Renewed Struggle with Legalism<P class="in30"> (6) Ephesus or Corinth?<P class="in30">(7) Paul\'s First Coming to Galatia<P class="in30">(8) Barnabas and the Galatians<P class="in30">(9) The Two Antiochs<P class="in30">(10) Wider Bearings of the Problem<P><b>LITERATURE</b><hr /><P>When and to whom, precisely, this letter was written, it is difficult to say; its authorship and purpose are unmistakable. One might conceive it addressed by the apostle Paul, in its main tenor, to almost any church of his Gentile mission attracted to Judaism, at any point within the years circa 45-60 AD. Some plausibly argue that it was the earliest, others place it among the later, of the Pauline Epistles. This consideration dictates the order of our inquiry, which proceeds from the plainer to the more involved and disputable parts of the subject.<P>I. The Authorship.<P>1. Position of the Dutch School:<P>The Tubingen criticism of the last century recognized the four major epistles of Paul as fully authentic, and made them the corner-stone of its construction of New Testament history. Only Bruno Bauer (Kritik. d. paulin. Briefe, 1850-52) attacked them in this sense, while several other critics accused them of serious interpolations; but these attempts made little impression. Subsequently, a group of Dutch scholars, beginning with Loman in his Quaestiones Paulinae (1882) and represented by Van Manen in the Encyclopedia Biblica (art. "Paul"), have denied all the canonical epistles to the genuine Paul. They postulate a gradual development in New Testament ideas covering the first century and a half after Christ, and treat the existing letters as "catholic adaptations" of fragmentary pieces from the apostle\'s hand, produced by a school of "Paulinists" who carried their master\'s principles far beyond his own intentions. On this theory, Galatians, with its advanced polemic against the law, approaching the position of Marcion (140 AD), was work of the early 2nd century. Edwin Johnson in England (Antiqua Mater, 1887), and Steck in Germany (Galaterbrief, 1888), are the only considerable scholars outside of Holland who have adopted this hypothesis; it is rejected by critics so radical as Scholten and Schmiedel (see the article of the latter on "Galatians" in EB). Knowling has searchingly examined the position of the Dutch school in his Witness of the Epistles (1892)—it is altogether too arbitrary and uncontrolled by historical fact to be entertained; see Julicher\'s or Zahn\'s Introduction to New Testament (English translation), to the same effect. Attempts to dismember this writing, and to appropriate it for other hands and later times than those of the apostle Paul, are idle in view of its vital coherence and the passionate force with which the author\'s personality has stamped itself upon his work; the Paulinum pectus speaks in every line. The two contentions on which the letter turns—concerning Paul\'s apostleship, and the circumcision of GentileChristians—belonged to the apostle\'s lifetime: in the fifth and sixth decades these were burning questions; by the 2nd century the church had left them far behind.<P>2. Early Testimony:<P>Early Christianity gives clear and ample testimony to this document. Marcion placed it at the head of his Apostolikon (140 AD); Justin Martyr, Athenagoras, Melito, quoted it about the same time. It is echoed by Ignatius (Philad., i) and Polycarp (Philip., iii and v) a generation earlier, and seems to have been used by contemporary Gnostic teachers. It stands in line with the other epistles of Paul in the oldest Latin, Syriac and Egyptian translations, and in the Muratorian (Roman) Canon of the 2nd century. It comes full into view as an integral part of the new Scripture in Irenaeus, Clement of Alexandria and Tertullian at the close of this period. No breath of suspicion as to the authorship, integrity or apostolic authority of the Ep. to the Ga has reached us from ancient times.<P>II. Matter of the Epistle.<P>A) Summary of Contents:<P>1. Outline:<P>A double note of war sounds in the address and greeting (<a onClick="return mV(\'Gal\',1,1,4);">Ga 1:1, 4</a>). Astonishment replaces the customary thanksgiving (<a onClick="return mV(\'Gal\',1,\'6-10\');">Ga 1:6-10</a>): The Galatians are listening to preachers of "another gospel" (<a onClick="return mV(\'Gal\',1,6,7);">1:6,7</A>) and traducers of the apostle (<a onClick="return mV(\'Gal\',1,8,10);">1:8,10</a>), whom he declares "anathema." Paul has therefore two objects in writing—to vindicate himself, and to clear and reinforce his doctrine. The first he pursues from <a onClick="return mV(\'Gal\',1,\'11-\');">1:11</A> to <a onClick="return mV(\'Gal\',1,2,\'1-21\');">2:21</a>; the second from <a onClick="return mV(\'Gal\',1,\'3-\');">3:1 to 5:12</a>. Appropriate: moral exhortations follow in <a onClick="return mV(\'Gal\',5,\'13-\');">5:13</a> - <a onClick="return mV(\'Gal\',6,\'1-10\');">6:10</a>. The closing paragraph (<a onClick="return mV(\'Gal\',6,\'11-17\');">6:11-17</a>) resumes incisively the purport of the letter. Personal, argumentative, and hortatory matter interchange with the freedom natural in a letter to old friends.<P>2. Personal History (<a onClick="return mV(\'Gal\',1,11);">Galatians <a onClick="return mV(\'Gal\',1,\'1-\');">1:11</a> - <a onClick="return mV(\'Gal\',2,\'1-21\');">2:21</a> (<a onClick="return mV(\'Gal\',4,\'12-20\');">4:12-20</a>; <a onClick="return mV(\'Gal\',6,17);">6:17</a>)):<P>Paul\'s Independent Apostleship.<P>Paul asserts himself for his gospel\'s sake, by showing that his commission was God-given and complete (<a onClick="return mV(\'Gal\',1,11,12);">Ga 1:11-12</a>). On four decisive moments in his course he dwells for this purpose—as regards the second manifestly (<a onClick="return mV(\'Gal\',1,20);">Ga 1:20</a>), as to others probably, in correction of misstatements:<P>(1) A thorough-paced Judaist and persecutor (<a onClick="return mV(\'Gal\',1,13,14);">Ga 1:13-14</a>), Paul was supernaturally converted to Christ (<a onClick="return mV(\'Gal\',1,15);">Ga 1:15</a>), and received at conversion his charge for the Gentiles, about which he consulted no one (<a onClick="return mV(\'Gal\',1,16,17);">Ga 1:16-17</a>).<P>(2) Three years later he "made acquaintance with Cephas" in Jerusalem and saw James besides, but no "other of the apostles" (<a onClick="return mV(\'Gal\',1,18,19);">Ga 1:18-19</a>). For long he was known only by report to "the churches of Judea" (<a onClick="return mV(\'Gal\',1,\'21-24\');">Ga 1:21-24</a>).<P>(3) At the end of "fourteen years" he "went up to Jerusalem," with Barnabas, to confer about the "liberty" of Gentile believers, which was endangered by "false brethren" (<a onClick="return mV(\'Gal\',2,\'1-5\');">Ga 2:1-5</a>). Instead of supporting the demand for the circumcision of the "Greek" Titus (<a onClick="return mV(\'Gal\',2,3);">Ga 2:3</a>), the "pillars" there recognized the sufficiency and completeness of Paul\'s "gospel of the uncircumcision" and the validity of his apostleship (<a onClick="return mV(\'Gal\',2,\'6-8\');">Ga 2:6-8</a>). They gave "right hands of fellowship" to himself and Barnabas on this understanding (<a onClick="return mV(\'Gal\',2,9,10);">Ga 2:9-10</a>). The freedom of Gentile Christianity was secured, and Paul had not "run in vain."<P>(4) At Antioch, however, Paul and Cephas differed (<a onClick="return mV(\'Gal\',2,11);">Ga 2:11</a>). Cephas was induced to withdraw from the common church-table, and carried "the rest of the Jews," including Barnabas, with him (<a onClick="return mV(\'Gal\',2,12,13);">Ga 2:12-13</a>). "The truth of the gospel," with Cephas\' own sincerity, was compromised by this "separation," which in effect "compelled the Gentiles to Judaize" (<a onClick="return mV(\'Gal\',2,13,14);">Ga 2:13-14</a>). Paul therefore reproved Cephas publicly in the speech reproduced by <a onClick="return mV(\'Gal\',2,\'14-21\');">Ga 2:14-21</a>, the report of which clearly states the evangelical position and the ruinous consequences (<a onClick="return mV(\'Gal\',2,18-21);">2:18,21</A>) of reestablishing "the law."<P>3. Doctrinal Polemic (<a onClick="return mV(\'Gal\',3,\'1-\');">Galatians 3:1-5:12</a>):<P>(1) Thesis.<P>The doctrinal polemic was rehearsed in the autobiography (<a onClick="return mV(\'Gal\',2,\'3-5\',11,12);">Ga 2:3-5, 11-12</a>). In <a onClick="return mV(\'Gal\',2,16);">Ga 2:16</a> is laid down thesis of the epistle: "A man is not justified by the works of law but through faith in Jesus Christ." This proposition is (a) demonstrated from experience and history in <a onClick="return mV(\'Gal\',3,\'1-\');">3:1</a> - <a onClick="return mV(\'Gal\',4,\'1-7\');">4:7</a>; then (b) enforced by <a onClick="return mV(\'Gal\',4,\'8-\');">4:8</a> - <a onClick="return mV(\'Gal\',5,\'1-12\');">5:12</a>.<P>(2) Main Argument.<P>(a1) From his own experience (<a onClick="return mV(\'Gal\',2,\'19-21\');">Ga 2:19-21</a>) Paul passes to that of the readers, who are "bewitched" to forget "Christ crucified" (<a onClick="return mV(\'Gal\',3,1);">Ga 3:1</a>)! Had their life in "the Spirit" come through "works of the law" or the "hearing of faith"? Will the flesh consummate what the Spirit began (<a onClick="return mV(\'Gal\',3,\'2-5\');">Ga 3:2-5</a>)?<P>(a2) Abraham, they are told, is the father of God\'s people; but \'the men of faith\' are Abraham\'s true heirs (<a onClick="return mV(\'Gal\',3,\'6-9\');">Ga 3:6-9</a>). "The law" curses every transgressor; Scripture promised righteousness through faith for the very reason that justification by legal "doing" is impossible (<a onClick="return mV(\'Gal\',3,10,12);">Ga 3:10, 12</a>). "Christ redeemed us from the curse of the law" in dying the death it declared "accursed" (<a onClick="return mV(\'Gal\',3,13);">Ga 3:13</a>). Thus He conveyed to the nations "the promise of the Spirit," pledged to them through believing Abraham (<a onClick="return mV(\'Gal\',3,7,14);">Ga 3:7, 14</a>).<P>(a3) The "testament" God gave to "Abraham and his seed" (a single "seed," observe) is unalterable. The Mosaic law, enacted 430 years later, could not nullify this instrument (<a onClick="return mV(\'Gal\',3,\'15-17\');">Ga 3:15-17</a> the King James Version). Nullified it wound have been, had its fulfillment turned on legal performance instead of Divine "grace" (<a onClick="return mV(\'Gal\',3,18);">Ga 3:18</a>).<P>(a4) "Why then the law?" Sin required it, pending the accomplishment of "the promise." Its promulgation through intermediaries marks its inferiority (<a onClick="return mV(\'Gal\',3,19,20);">Ga 3:19-20</a>). With no power \'to give life,\' it served the part of a jailer guarding us till "faith came," of "the paedagogus" training us \'for Christ\' (<a onClick="return mV(\'Gal\',3,\'21-25\');">Ga 3:21-25</a>).<P>(a5) But now "in Christ," Jew and Greek alike, "ye are all sons of God through faith"; being such, "you are Abraham\'s seed" and \'heirs in terms of the promise\' (<a onClick="return mV(\'Gal\',3,\'26-29\');">Ga 3:26-29</a>). The \'infant\' heirs, in tutelage, were \'subject to the elements of the world,\' until "God sent forth his Son," placed in the like condition, to "redeem" them (<a onClick="return mV(\'Gal\',4,\'1-5\');">Ga 4:1-5</a>). Today the "cry" of "the Spirit of his Son" in your "hearts" proves this redemption accomplished (<a onClick="return mV(\'Gal\',4,6,7);">Ga 4:6, 7</a>).<P>The demonstration is complete; <a onClick="return mV(\'Gal\',3,\'1-\');">Ga 3:1</a> - <a onClick="return mV(\'Gal\',4,\'1-7\');">4:7</a> forms the core of the epistle. The growth of the Christian consciousness has been traced from its germ in Abraham to its flower in the church of all nations. The Mosaic law formed a disciplinary interlude in the process, which has been all along a life of faith. Paul concludes where he began (<a onClick="return mV(\'Gal\',3,2);">3:2</a>), by claiming the Spirit as witness to the full salvation of the Gentiles; compare <a onClick="return mV(\'Rom\',8,\'1-27\');">Ro 8:1-27</a>; <a onClick="return mV(\'2Cr\',3,\'4-18\');">2Co 3:4-18</a>; <a onClick="return mV(\'Eph\',1,13,14);">Eph 1:13-14</a>. From <a onClick="return mV(\'Gal\',4,\'8-\');">Ga 4:8</a> onward to <a onClick="return mV(\'Gal\',5,\'1-12\');">5:12</a>, the argument is pressed home by appeal, illustration and warning.<P>(3) Appeal and Warning.<P>(b1) After "knowing God," would the Galatians return to the bondage in which ignorantly they served as gods "the elements" of Nature? (<a onClick="return mV(\'Gal\',4,8,9);">4:8,9</a>). Their adoption of Jewish "seasons" points to this backsliding (<a onClick="return mV(\'Gal\',4,10,11);">4:10-11</a>).<P>(b2) Paul\'s anxiety prompts the entreaty of <a onClick="return mV(\'Gal\',4,\'12-20\');">4:12-20</A>, in which he recalls his fervent reception by his readers, deplores their present alienation, and confesses his perplexity.<P>(b3) Observe that Abraham had two sons—"after the flesh" and "through promise" (<a onClick="return mV(\'Gal\',4,21,22,23);">4:21-23</a>); those who want to be under law are choosing the part of Ishmael: "Hagar" stands for \'the present Jerusalem\' in her bondage; \'the Jerusalem above is free—she is our mother!\' (<a onClick="return mV(\'Gal\',4,\'24-28\',31);">4:24-28,31</a>). The fate of Hagar and Ishmael pictures the issue of legal subjection (<a onClick="return mV(\'Gal\',4,29,30);">4:29-30</a>): "Stand fast therefore" (<a onClick="return mV(\'Gal\',5,1);">5:1</a>). (b4) The crucial moment comes at <a onClick="return mV(\'Gal\',5,2);">5:2</a>: the Galatians are half-persuaded (<a onClick="return mV(\'Gal\',5,7,8);">5:7-8</a>); they will fatally commit themselves, if they consent to \'be circumcised.\' This will sever them from Christ, and bind them to complete observance of Moses\' law: law or grace—by one or the other they must stand (<a onClick="return mV(\'Gal\',5,\'3-5\');">5:3-5</a>). "Circumcision, uncircumcision"—these "count for nothing in Christ Jesus" (<a onClick="return mV(\'Gal\',5,6);">5:6</a>). Paul will not believe in the defection of those who \'ran\' so "well"; "judgment" will fall on their \'disturber\' (<a onClick="return mV(\'Gal\',5,\'7-10\',12);">5:7-10, 12</a>). Persecution marks himself as no circumcisionist (<a onClick="return mV(\'Gal\',5,11);">5:11</a>)!<P>4. The Ethical Application (<a onClick="return mV(\'Gal\',5,\'13-\');">Galatians 5:13</a> - <a onClick="return mV(\'Gal\',6,\'1-10\');">6:10</a>):<P>Law of the Spirit of Life<P>The ethical application is contained in the phrase of <a onClick="return mV(\'Rom\',8,2);">Ro 8:2</a>, "the law of the Spirit of life in Christ Jesus."<P>(1) Love guards Christian liberty from license; it \'fulfills the whole law in a single word\' (<a onClick="return mV(\'Gal\',5,\'13-15\');">Ga 5:13-15</a>).<P>(2) The Spirit, who imparts freedom, guides the free man\'s "walk." Flesh and spirit are, opposing principles: deliverance from "the flesh" and its "works" is found in possession by "the Spirit," who bears in those He rules His proper "fruit." \'Crucified with Christ\' and \'living in the Spirit,\' the Christian man keeps God\'s law without bondage under it (<a onClick="return mV(\'Gal\',5,\'16-26\');">Ga 5:16-26</a>).<P>(3) In cases of unwary fall, \'men of the Spirit\' will know how to "restore" the lapsed, \'fulfilling Christ\'s law\' and mindful of their own weakness (<a onClick="return mV(\'Gal\',6,\'1-5\');">Ga 6:1-5</a>).<P>(4) Teachers have a peculiar claim on the taught; to ignore this is to \'mock God.\' Men will "reap corruption" or "eternal life," as in such matters they \'sow to the flesh\' or \'to the Spirit.\' Be patient till the harvest! (<a onClick="return mV(\'Gal\',6,\'6-10\');">Ga 6:6-10</a>).<P>5. The Epilogue (<a onClick="return mV(\'Gal\',6,\'11-18\');">Galatians 6:11-18</a>):<P>The autograph conclusion (<a onClick="return mV(\'Gal\',6,11);">Ga 6:11</a>) exposes the sinister motive of the circumcisionists, who are ashamed of the cross, the Christian\'s only boast (<a onClick="return mV(\'Gal\',6,\'12-15\');">Ga 6:12-15</a>). Such men are none of "the Israel of God!" (<a onClick="return mV(\'Gal\',6,16);">Ga 6:16</a>). "The brand of Jesus" is now on Paul\'s body; at their peril "henceforth" will men trouble him! (<a onClick="return mV(\'Gal\',6,17);">Ga 6:17</a>). The benediction follows (<a onClick="return mV(\'Gal\',6,18);">Ga 6:18</a>).<P>B) Salient Points:<P>1. The Principles at Stake:<P>The postscript reveals the inwardness of the legalists\' agitation. They advocated circumcision from policy more than from conviction, hoping to conciliate Judaism and atone for accepting the Nazarene—to hide the shame of the cross—by capturing for the Law the Gentile churches. They attack Paul because he stands in the way of this attempt. Their policy is treason; it surrenders to the world that cross of Christ, to which the world for its salvation must unconditionally submit. The grace of God the one source of salvation Galatians (<a onClick="return mV(\'Gal\',1,3);">1:3</a>; <a onClick="return mV(\'Gal\',2,21);">2:21</a>; <a onClick="return mV(\'Gal\',5,4);">5:4</a>), the cross of Christ its sole ground (<a onClick="return mV(\'Gal\',1,4);">1:4</a>; <a onClick="return mV(\'Gal\',2,\'1-21\');">2:19-21</a>; <a onClick="return mV(\'Gal\',3,13);">3:13</a>; <a onClick="return mV(\'Gal\',6,14);">6:14</a>), faith in the Good News its all-sufficient means (<a onClick="return mV(\'Gal\',2,16,20);">2:16,20</a>; <a onClick="return mV(\'Gal\',3,2,\'5-9\',\'23-26\');">3:2, 5-9, 23-26</a>; <a onClick="return mV(\'Gal\',5,5);">5:5</a>), the Spirit its effectuating power (<a onClick="return mV(\'Gal\',3,\'2-5\');">3:2-5</a>; <a onClick="return mV(\'Gal\',4,6,7);">4:6-7</a>; <a onClick="return mV(\'Gal\',5,5,\'16-25\');">5:5, 16-25</a>; <a onClick="return mV(\'Gal\',6,8);">6:8</a>)—hence, emancipation from the Jewish law, and the full status of sons of God open to the Gentiles (<a onClick="return mV(\'Gal\',2,4,5,\'15-19\');">2:4,5,15-19</a>; <a onClick="return mV(\'Gal\',3,\'10-14\');">3:10-14</a>; <a onClick="return mV(\'Gal\',3,\'28-\');">3:28</a> - <a onClick="return mV(\'Gal\',4,\'1-9\',\'26-31\');">4:9, 26-31</a>; <a onClick="return mV(\'Gal\',5,18);">5:18</a>; <a onClick="return mV(\'Gal\',6,15);">6:15</a>): these connected principles are at stake in the contention; they make up the doctrine of the epistle.<P>2. Present Stage of the Controversy:<P>Circumcision is now proposed by the Judaists as a supplement to faith in Christ, as the qualification for sonship to Abraham and communion with the apostolic church (<a onClick="return mV(\'Gal\',3,7,29);">Ga 3:7, 29</a>). After the Council at Jerusalem, they no longer say outright, "Except ye be circumcised after the custom of Moses, ye cannot be saved" (<a onClick="return mV(\'Act\',15,1);">Ac 15:1</a>). Paul\'s Galatian converts, they admit, "have begun in the Spirit"; they bid them "be perfected" and attain the full Christian status by conforming to Moses—"Christ will profit" them much more, if they add to their faith circumcision (<a onClick="return mV(\'Gal\',3,3);">Ga 3:3</a>; <a onClick="return mV(\'Gal\',5,2);">5:2</a>; compare <a onClick="return mV(\'Rom\',3,1);">Ro 3:1</a>). This insidious proposal might seem to be in keeping with the findings of the Council; Peter\'s action at Antioch lent color to it. Such a grading of the Circumcision and Uncircumcision within the church offered a tempting solution of the legalist controversy; for it appeared to reconcile the universal destination of the gospel with the inalienable prerogatives of the sons of Abraham. Paul\'s reply is, that believing Gentiles are already Abraham\'s "seed"—nay, sons and heirs of God; instead of adding anything, circumcision would rob them of everything they have won in Christ; instead of going on to perfection by its aid, they would draw back unto perdition.<P>3. Paul\'s Depreciation of the Law:<P>Paul carries the war into the enemies\' camp, when he argues,<P>(a) that the law of Moses brought condemnation, not blessing, on its subjects (<a onClick="return mV(\'Gal\',3,\'10-24\');"
