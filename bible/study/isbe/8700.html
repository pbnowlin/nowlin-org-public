isbe[8705]='Teth`teth (T): The 9th letter of the Hebrew alphabet; transliterated in this Encyclopedia as "T" (a more intense "t"). It came also to be used for the <span class="noTag">number 9</span>; and with waw ("w") for 15, with zayin ("z") for 16 (i.e. 9 plus 6 and 9 plus 7) to avoid forming regular series with the abbreviation for Yahweh.`<a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</a>`1';
isbe[8706]='Tetrarch`te\'-trark, tet\'-rark tetrarches): As the name indicates it signifies a prince, who governs one-fourth of a domain or kingdom. The Greeks first used the word. Thus Philip of Macedon divided Thessaly into four "tetrarchies." Later on the Romans adopted the term and applied it to any ruler of a small principality. It is not synonymous with "ethnarch" at least the Romans made a distinction between Herod "tetrarch" of Galilee, Philip "tetrarch" of Trachonitis, Lysanias "tetrarch" of Abilene, and Archelaius "ethnarch" of Judea (BJ, II, vi, 3; Ant, XVII, xi, 4). The title was often conferred on Herodian princes by the Romans, and sometimes it was used courteously as a synonym for king (<a onClick="return mV(\'Mat\',14,9);">Mt 14:9</a>; <a onClick="return mV(\'Mar\',6,14);">Mr 6:14</a>). In the same way a "tetrarchy" was sometimes called a kingdom.``42';
isbe[8707]='Tetter`tet\'-er (bohaq; alphos): The term "freckled spot" in the King James Version is thus rendered in the Revised Version (British and American). The eruption referred to in <a onClick="return mV(\'Lev\',13,39);">Le 13:39</a> is a pale white spot on the skin. This is described by Gorraeus as an eruption arising from a diseased state of the system without roughness of skin, scales or ulceration. It did not render the sufferer unclean, although it is difficult of cure. The disease is commonly known by its Latin name vitiligo. Pliny recommended the use of capers and lupins to remove it.`<a href="./study/isbe/search.html?string=FRECKLED+SPOT">FRECKLED SPOT</a>; <a href="./study/isbe/search.html?string=LEPROSY">LEPROSY</a>`1';
isbe[8708]='Text and Manuscripts of the New Testament`<b>I. SOURCES OF EVIDENCE FOR THE TEXT OF THE NEW TESTAMENT</b><P class="in15">1. Autographs of the New Testament Writers<P class="in15">2. Papyrus Fragments of the Greek New Testament<P class="in15">3. Greek Copies or Manuscripts of the New Testament Text<P class="in15">4. List of Manuscripts of the Greek New Testament<P class="in30">(1) Uncials<P class="in30">(2) Minuscules<P class="in15">5. Vernacular Versions<P class="in15">6. Patristic Quotations<P class="in15">7. Lectionaries and Service-Books<P><b>II. NECESSITY OF SIFTING AND CRITICIZING THE EVIDENCE</b><P><b>III. METHODS OF CRITICAL PROCEDURE</b><P><b>IV. HISTORY OF THE PROCESS</b><P><b>LITERATURE</b><hr /><P>The literary evidence to the text of the New Testament is vastly more abundant than that to any other series of writings of like compass in the entire range of ancient letters. Of the sacred books of the Hebrew Bible there is no known copy antedating the 10th century AD. Of Homer there is no complete copy earlier than the 13th century. Of Herodotus there is no manuscript earlier than the 10th century. Of Vergil but one copy is earlier than the 4th century, and but a fragment of all Cicero\'s writings is even as old as this. Of the New Testament, however, we have two splendid manuscripts of the 4th century, at least ten of the 5th, twentyfive of the 6th and in all a total of more than four thousand copies in whole or in part of the Greek New Testament. To these copies of the text itself may be added the very important and even more ancient evidence of the versions of the New Testament in the Latin, Syriac, and Egyptian tongues, and the quotations and clear references to the New Testament readings found in the works of the early Church Fathers, as well as the inscriptions and monumental data in Syria, Asia Minor, Africa, Italy, and Greece, dating from the very age of the apostles and their immediate successors. It thus appears that the documents of the Christian faith are both so many and so widely scattered that these very facts more than any others have embarrassed the final determination of the text. Now however, the science of textual criticism has so far advanced and the textual problems of the Greek Testament have been so well traversed that one may read the Christian writings with an assurance approximating certainty.<P>Professor Eberhard Nestle speaks of the Greek text of the New Testament issued by Westcott and Hort as the "nearest in its approach to the goal." Professor Alexander Souter\'s student\'s edition of the Revisers\' Greek New Testament, Oxford, 1910, no doubt attains even a higher watermark. It is the purpose of the present article to trace, as far as it can be done in a clear and untechnical manner, the process of connection between the original writings and this, one of the latest of the editions of the Greek New Testament.<P>I. Sources of Evidence for the Text of the New Testament.<P>1. Autographs of the New Testament Writers:<P>Until very recent times it has not been customary to take up with any degree of confidence, if at all, the subject of New Testament autographs, but since the researches in particular of Dalman, Deissmann, Moulton (W. F.) and Milligan (George), the task is not only appropriate but incumbent upon the careful student. The whole tendency of recent investigation is to give less place to the oral tradition of Christ\'s life and teaching and to press back the date of the writing of the Synoptic Gospels into the period falling between Pentecost and the destruction of Jerusalem. Sir William M. Ramsay goes so far as to claim that "antecedent probability founded on the general character of personal and contemporary Greek of Gr-Asiatic society" would indicate that the first Christian account of the circumstances connected with the death of Jesus must be presumed to have been written in the year when Jesus died" (Letters to the Seven Churches, 7). W. M. Flinders Petrie argues to the same end and says: "Some generally accepted Gospels must have been in circulation before 60 AD. The mass of briefer records and Logia which the habits and culture of that age would produce must have been welded together within 10 or 20 years by the external necessities" (The Growth of the Gospels, 7).<P>The autographs of the New Testament writers have long been lost, but the discovery during the last few years of contemporary documents enables us to form fairly clear notions as to their general literary character and condition. In the first place papyrus was probably the material employed by all the New Testament writers, even the original Gospel of Matthew and the general Epistle of James, the only books written within Palestine, not being excepted, for the reason that they were not originally written with a view to their liturgical use, in which case vellum might possibly have been employed. Again the evidence of the writings themselves witnesses to the various literary processes followed during the 1st century. Dictation was largely followed by Paul, the names of at least four of his secretaries, Tertius, Sosthenes, Timothy, and Sylvanus, being given, while the master himself, as in many of the Egyptian papyri, appended his own signature, sometimes with a sentence or two at the end. The method of personal research was pursued, as well as compilation of diverse data including folklore and genealogies, together with the grouping of cognate matters in artistic forms and abundant quotation in writings held in high esteem by the readers, as in the First and Third Gospels and the Book of Acts. The presentation copy of one\'s works must have been written with unusual pains in case of their dedication to a patrician patron, as Luke to "most excellent Theophilus." For speculation as to the probable dimensions of the original papyrus rolls of New Testament books, one will find Professor J. Rendel Harris and Sir F. G. Kenyon extremely suggestive, and from opposite viewpoints; compare Kenyon, Handbook of the Textual Criticism of the New Testament; Harris, New Testament Autographs.<P>Comparatively few papyrus fragments of the New Testament are now known to be extant, and no complete book of the New Testament has as yet been found, though the successes in the field of contemporary Greek writings inspire confidence that ere long the rubbish heaps of Egypt will reward the diligent explorer. Of the Septuagint (Greek Old Testament) somewhat more has come to light than the New Testament, while the papyrus copies and fragments of Homer are almost daily increasing.<P>The list below is condensed from that of Sir Frederick G. Kenyon\'s Handbook of the Textual Criticism of the New Testament, 2nd edition,1912,41ff, using Dr. Gregory\'s method of notation.<P>2. Papyrus Fragments of the Greek New Testament:<P>P1 <a onClick="return mV(\'Mat\',1,\'1-9\',12,\'14-20\');">Mt 1:1-9,12,14-20</a>. 3rd century. Found at Oxyrhynchus in 1896, now in the University of Pennsylvania.<P>See illustration under <a href="./study/isbe/search.html?string=PAPYRUS">PAPYRUS</a>.<P>P2 <a onClick="return mV(\'Jhn\',12,\'12-15\');">Joh 12:12-15</a> in Greek on the verso, with <a onClick="return mV(\'Luk\',7,18);">Lu 7:18</a>ff in Sahidic on the recto. 5th or 6th century. In book form, at the Museo Archeologico, Florence.<P>P3 <a onClick="return mV(\'Luk\',7,\'36-43\');">Lu 7:36-43</a>; <a onClick="return mV(\'Luk\',10,\'38-42\');">10:38-42</a>. 6th century. In book form. In the Rainer Collection, Vienna.<P>P4 <a onClick="return mV(\'Luk\',1,\'74-80\');">Lu 1:74-80</a>; <a onClick="return mV(\'Luk\',5,\'3-8\',30);">5:3-8,30</a>-<a onClick="return mV(\'Luk\',6,\'1-4\');">6:4</a>. 4th century. In book form. Found in Egypt joined to a manuscript of Philo; now in the Bibliotheque Nationale, Paris.<P>P5 <a onClick="return mV(\'Jhn\',1,\'23-31\',\'33-41\');">Joh 1:23-31, 33-41</a>; <a onClick="return mV(\'Jhn\',20,\'11-17\',\'19-25\');">20:11-17, 19-25</a>. 3rd century. An outer sheet of a single-quire book. Found at Oxyrhynchus and now in the British Museum.<P>P6 <a onClick="return mV(\'Jhn\',11,45);">Joh 11:45</a>. University of Strassburg.<P>P7 <a onClick="return mV(\'Luk\',4,1,2);">Lu 4:1,2</a>. Archaeological Museum at Kieff.<P>P8 <a onClick="return mV(\'Act\',4,\'31-37\');">Ac 4:31-37</a>; <a onClick="return mV(\'Act\',5,\'2-9\');">5:2-9</a>; <a onClick="return mV(\'Act\',6,\'1-6\',\'8-15\');">6:1-6,8-15</a>. 4th century. In the Berlin Museum.<P>P9 <a onClick="return mV(\'1Jo\',4,\'11-13\',\'15-17\');">1Joh 4:11-13,15-17</a>. 4th or 5th century. In book form. Found at Oxyrhynchus; now in Harvard University Library.<P>P10 <a onClick="return mV(\'Rom\',1,\'1-7\');">Ro 1:1-7</a>. 4th century. Found at Oxyrhynchus; now in Harvard University Library.<P>P11 <a onClick="return mV(\'1Cr\',1,\'17-20\');">1Co 1:17-20</a>; <a onClick="return mV(\'1Cr\',6,\'13-18\');">6:13-18</a>; <a onClick="return mV(\'1Cr\',7,3,4,\'10-14\');">7:3,4,10-14</a>. 5th century. In the Imperial Library at Petersburg.<P>P12 <a onClick="return mV(\'Hbr\',1,1);">Heb 1:1</a>. 3d or 4th century. In the Amherst Library.<P>P13 <a onClick="return mV(\'Hbr\',2,\'14-\');">Heb 2:14-5:5</a>; <a onClick="return mV(\'Hbr\',10,\'8-\');">10:8</A>-<a onClick="return mV(\'Hbr\',11,\'1-13\');">11:13</a>; <a onClick="return mV(\'Hbr\',11,\'28-\');">11:28</A>-<a onClick="return mV(\'Hbr\',10,\'1-17\');">12:17</a>. 3rd or 4th century. Found at Oxyrhynchus; now in the British Museum.<P>P14:<a onClick="return mV(\'1Cr\',1,\'25-27\');">1Co 1:25-27</a>; <a onClick="return mV(\'1Cr\',2,\'3-8\');">2:3-8</a>; <a onClick="return mV(\'1Cr\',3,\'8-10\',20);">3:8-10,20</a>. 5th century. In book form; at Catherine\'s Monastery, Mt. Sinai.<P>P15:<a onClick="return mV(\'1Cr\',7,18);">1Co 7:18-8:4</a>; <a onClick="return mV(\'Phl\',3,\'9-17\');">Php 3:9-17</a>; <a onClick="return mV(\'Phl\',4,\'2-8\');">4:2-8</a>. 4th century. Found at Oxyrhynchus.<P>P16 <a onClick="return mV(\'Rom\',12,\'3-8\');">Ro 12:3-8</a>. 6th or 7th century. Ryland\'s Library, Manchester.<P>P17 <a onClick="return mV(\'Tts\',1,\'11-15\');">Tit 1:11-15</a>; <a onClick="return mV(\'Tts\',2,\'3-8\');">2:3-8</a>. 3rd century. Ryland\'s Library, Manchester.<P>P18 <a onClick="return mV(\'Hbr\',9,\'12-19\');">Heb 9:12-19</a>. 4th century. Found at Oxyrhynchus.<P>P19 <a onClick="return mV(\'Rev\',1,\'4-7\');">Re 1:4-7</a>. 3rd or 4th century. Found at Oxyrhynchus.<P>3. Greek Copies or Manuscripts of the New Testament Text:<P>Greek copies or manuscripts of the New Testament text have hitherto been and probably will continue to be the chief source of data in this great field. For determining the existence of the text in its most ancient form the autographs are of supreme value. For determining the content or extent of the text the versions are of highest worth. For estimating the meaning and at the same time for gaining additional data, both as to existence and extent of usage of the New Testament, the quotations of its text by the Church Fathers, whether as apologists, preachers, or historians, in Assyria, Greece, Africa, Italy or Gaul, are of exceeding importance. But for determining the readings of the text itself the Greek manuscripts or copies of the original autographs are still the principal evidence of criticism. About 4,000 manuscripts, in whole or in part, of the Greek New Testament are now known. These manuscripts furnish abundant evidence for determining the reading of practically the entire New Testament, while for the Gospels and most important Epistles the evidence is unprecedented for quantity and for clearness. They are usually divided into two classes: Uncial, or large hand, and Minuscule, or small hand, often called Cursive. The term "cursive" is not satisfactory, since it does not coordinate with the term "uncial," nor are so-called cursive features such as ligatures and oval forms confined to minuscule manuscripts. The uncials comprise about 140 copies extending from the 4th to the 10th centuries. The minuscules include the remaining manuscripts and fall between the 9th century and the invention of printing. Herewith is given a brief description of a few of the chief manuscripts, both uncial and minuscule, of the New Testament.<P>4. List of Manuscripts of the Greek New Testament:<P>(1) Uncials.<P>Codex Sinaiticus found by Tischendorf at Catherine\'s Monastery on Mt. Sinai and now in the Imperial Library at Petersburg; 4th century. This is the only uncial which contains the New Testament entire. It also has the Epistle of Barnabas and part of the Shepherd of Hermas and possibly originally the Didache. The marks of many correctors are found in the text. It is written on 147 1/2 leaves of very thin vellum in four narrow columns of 48 lines each. The pages measure 15 X 13 1/2 in., and the leaves are arranged in quaternions of four sheets. The open sheet exposing eight columns resembles greatly an open papyrus roll. There is but rudimentary punctuation and no use of accent or initial letters, but the Eusebian section numbers are found on the margin of the Gospels.<P>Codex Alexandrinus (A), so named since it was supposed to have come from Alexandria, being the gift of Cyril Lucar, at one time Patriarch of that Province, though later of Constantinople, to Charles I, through the English ambassador at the Turkish court in 1627, and in 1757 presented to the Royal Library and now in the British Museum. It doubtless belongs to the 5th century, and contained the entire New Testament, lacking now only portions of Matthew, John, and 1 Corinthians, as well as the two Epistles of Clement of Rome and the Psalm of Solomon. It is written on thin vellum in two columns of 41 lines to the page, which <span class="noTag">is</span> 12 5/8 X 10 3/8 in.; employs frequent initial capitals, and is divided into paragraphs, but has no marginal signs except in the Gospels. Several different hands are discovered in the present state of the MS.<P>Codex Vaticanus (B), since 1481, at least, the chief treasure of the Vatican Library, and universally esteemed to be the oldest and best manuscript of the Greek New Testament; 4th century. Written on very fine vellum, the leaves nearly square in shape, 10 X 10 1/2 in., with three narrow columns of 40-44 lines per column and five sheets making the quire. A part of the Epistle to the Hebrews and the Pastorals, Philemon and Revelation are lacking. It is without accents, breathings or punctuation, though corrected and retraced by later hands. In the Gospels the divisions are of an earlier date than in Codex Sinaiticus. The theory of Tischendorf that Codex Sinaiticus and Codex Vaticanus were in part prepared by the same hand and that they were both among the 50 manuscripts made under the direction of Eusebius at Caesarea in 331 for use in the emperor Constantine\'s new capital, is not now generally accepted.<P>Codex Ephraemi Rescriptus (C). This is the great palimpsest (twice written) manuscript of the uncial group, and originally contained the whole New Testament. Now, however, a part—approximately half—of every book is lacking, and 2 Thessalonians and 2 John are entirely gone. It belongs to the 5th century, is written on good vellum 9 X 12 1/2 in. to the page of 41 lines, and of one column in the original text, though the superimposed writings of Ephraem are in two. Enlarged initials and the Eusebian marginal sections are used and several hands have corrected the MS. See Fig. 2. Brought to Italy from the East in the 16th century, it came to France with Catherine de\' Medici and is now in the Bibliotheque Nationale, Paris.<P>Codex Bezae (D). This is the early known manuscript which Theodore Beza obtained in 1562 from the monastery of Irenaeus at Lyons and which he gave in 1581 to the University of Cambridge, where it now is. It is a Greek-Latin text, the Greek holding the chief place on the left-hand page, measuring 8 X 10 in., and dates probably from the end of the 5th century. Both Greek and Latin are written in large uncials and divided into short clauses, corresponding line for line. The hands of no less than nine correctors have been traced, and the critical questions arising from the character of the readings are among the most interesting in the whole range of Biblical criticism and are still unsettled. It contains only the Gospels and Acts with a fragment of 3 John.<P>Codex Washingtoniensis (W). The United States has now in the National Library (Smithsonian) at the capital one of the foremost uncial manuscripts of the Greek New Testament. It is a complete codex of the Gospels, in a slightly sloping but very ancient hand, written upon good vellum, in one column of 30 lines to the page, and 6 X 9 in. in size. By all the tests ordinarily given, it belongs to the period of the earliest codices, possibly of the 4th century. Like Codex Bezae (D), it has the order of the Gospels: Matthew, John, Luke, Mark, and contains an apocryphal interpolation within the longer ending of Mark for which no other Greek authority is known, though it is probably referred to by Jerome. It has been published in facsimile by Mr. C. L. Freer of Detroit, who obtained the manuscript in Egypt in 1906, and is edited by Professor H. A. Sanders for the University of Michigan Press, 1911.<P>(2) Minuscules.<P>Out of the thousands of minuscule manuscripts now known only the four used by Erasmus, together with one now found in the United States, will be enumerated.<P>1. This is an 11th-century codex at Basel. It must have been copied from a good uncial, since its text often agrees with Codex Sinaiticus and Codex Vaticanus.<P>1R. Of the 12th century, and now at Mayhingen, Bayaria: This is the only manuscript Erasmus had for Revelation in his editio princeps, and being defective at the end, <a onClick="return mV(\'Rev\',22,\'16-21\');">22:16-21</A>, he supplied the Greek text by retranslating from the Latin; compare Textus Receptus of the New Testament and the King James Version. Generally speaking, this manuscript is of high quality.<P>2. This is a 15th-century manuscript at Basel, and was that on which Erasmus most depended for his 1st edition, 1516. It reflects a good quality of text.<P>2AP. Some have assigned this manuscript to the 12th century, though it was probably later. It is at Basel, and was the principal text used by Erasmus in the Acts and Epistles.<P>667. An illustration of a good type of minuscule of the Gospels is taken from Evangelistaria 667, which came from an island of the Sea of Marmorn; purchased in Constantinople by Dr. Albert L. Long in 1892 and now in the Drew Seminary Library at Madison, N.J.<P>5. Vernacular Versions:<P>Vernacular VSS, or translations of the Scriptures into the tongues of western Christendom, were, some of them, made as early as the 2nd century, and thus antedate by several generations our best-known Greek text. It is considered by many as providential that the Bible was early translated into different tongues, so that its corruption to any large extent became almost if not altogether an impossibility, since the versions of necessity belonged to parts of the church widely removed from one another and with very diverse doctrinal and institutional tendencies. The testimony of translations to the exact form of words used either in an autograph or a Greek copy of an author is at best not beyond dispute, but as evidence for the presence or absence of whole sections or clauses of the original, their standing is of prime importance. Such extreme literalness frequently prevails that the vernacular idiom is entirely set aside and the order and construction of words in the original sources are slavishly followed and even transliterated, so that their bearing on many questions at issue is direct and convincing. Although the Greek New Testament has now been translated into all the principal tongues of the earth, comparative criticism is confined to those versions made during the first eight centuries.<P>6. Patristic Quotations:<P>Patristic quotations afford a unique basis of evidence for determining readings of the New Testament. So able and energetic were the Church Fathers of the early centuries that it is entirely probable that the whole text of the Greek New Testament could be recovered from this source alone, if the writings of apologists, homilists and commentators were carefully collated. It is also true that the earliest heretics as well as the defenders of the faith recognized the importance of accurately determining the original text, so that their remains also comprise no mean source for critical research. It is evident that the value of patristic quotations will vary according to such factors as the reliability of the reading, as quoted, the personal equation or habit of accuracy or looseness of the particular writer, and the purity or corruption of the text he employs. One of the marked advantages of this sort of evidence arises from the fact that it affords additional ground for localizing and dating the various classes of texts found both in original copies and in versions. For general study the more prominent Church Fathers of the 2nd, 3rd and 4th centuries are sufficient, though profitable investigation may be made of a much wider period. By the beginning of the 5th century, however, the type of text quoted almost universally was closely akin to that now known as the Textus Receptus.<P>7. Lectionaries and Service-Books:<P>Lectionaries and service-books of the early Christian period afford a source of considerable value in determining the general type of texts, together with the order and contents and distribution of the several books of the Canon. As the lectionary systems both of the eastern and western churches reach back to post-apostolic times and all are marked by great verbal conservatism, they present data of real worth for determining certain problems of textual criticism. From the very nature of the case, being compiled for a liturgical use, the readings are often introduced and ended by set formulas, but these are easily separated from the text itself, which generally follows copy faithfully. Even the systems of chapter headings and divisions furnish clues for classifying and comparing texts, for there is high probability that texts with the same chapter divisions come from the same country. Probably the earliest system of chapter divisions is preserved in Codex Vaticanus, coming down to us from Alexandria probably by way of Caesarea. That it antedates the codex in which it appears is seen from the fact that the Pauline Epistles are numbered as comprising a continuous book with a break between Galatians and Ephesians and the dislocated section numbers attached to Hebrews which follows 2 Thessalonians here, though the numbers indicate its earlier position after Galatians. Another system of chapter divisions, at least as old as the 5th century, found in Codex Alexandrinus, cuts the text into much larger sections, known as Cephalia Majora. In all cases the enumeration begins with the 2nd section, the 1st being considered introductory. Bishop Eusebius developed a system of text division of the Gospels based upon an earlier method attributed to Ammonius, adding a series of tables or Canons. The first table contained sections giving events common to all four evangelists, and its number was written beneath the section number on the margin in each Gospel, so that their parallels could readily be found. The 2nd, 3rd and 4th Canons contain lists of sections in which three of the Gospels have passages in common (the combination Mark, Luke, John, does not occur). The 5th, 6th, 7th, 8th and 9th contain lists in which two combine (the combination Mark, John, does not occur). Canon 10 contains those peculiar to some one of the Gospels.<P>II. Necessity of Sifting and Criticizing the Evidence.<P>Criticism from its very nature concerns itself entirely with the problems suggested by the errors of various kinds which it brings to light. In the writings of the New Testament the resources of textual evidence are so vast, exceeding, as we have seen, those of any other ancient literature, sacred or secular, that the area of actual error is relatively quite appreciable, though it must be remembered that this very abundance of textual variety ultimately makes for the integrity and doctrinal unity of the teaching of the New Testament books. Conjectural emendation which has played so large a part in the restoration of other writings has but slight place in the textual criticism of the New Testament, whose materials are so abundant that the difficulty is rather to select right renderings than to invent them. We have catalogued the principal sources of right readings, but on the most casual investigation of them discover large numbers of wrong readings mingled with the true, and must proceed to consider the sources of error or various readings, as they are called, of which approximately some 200,000 are known to exist in the various manuscripts, VSS, patristic citations and other data for the text.<P>"Not," as Dr. Warfield says, "that there are 200,000 places in the New Testament where various readings occur, but that there are nearly 200,000 readings all told, and in many cases the documents so differ among themselves that many various readings are counted on a single word, for each document is compared in turn with one standard and the number of its divergences ascertained, then these sums are themselves added together and the result given as the number of actually observed variations." Dr. Ezra Abbott was accustomed to remark that "about nineteen-twentieths of the variations have so little support that, although there are various readings, no one would think of them as rival readings, and nineteen-twentieths of the remainder are of so little importance that their adoption or rejection would cause no appreciable difference in the sense of the passages in which they occur." Dr. Hort\'s view was that "upon about one word in eight, various readings exist supported by sufficient evidence to bid us pause and look at it; about one word in sixty has various readings upon it supported by such evidence as to render our decision nice and difficult, but that so many variations are trivial that only about one word in every thousand has upon it substantial variation supported by such evidence as to call out the efforts of the critic in deciding between the readings." The oft-repeated dictum of Bentley is still valid that "the real text of the sacred writings is competently exact, nor is one article of faith or moral precept either perverted or lost, choose as awkwardly as you will, choose the worst by design, out of the whole lump of readings." Despite all this, the true scholar must be furnished rightly to discriminate in the matter of diverse readings.<P>From the very nature of the case it is probable that errors should be frequent in the New Testament; indeed, even printed works are not free from them, as is seen in the most carefully edited editions of the English Bible, but in manuscripts the difficulty is increased in direct proportion to the number of various copies still extant. There are two classes of errors giving rise to various readings, unconscious or unintentional and conscious or intentional.<P>1. First Class:<P>Of the first class, that of unconscious errors, there are five sorts:<P>(1) Errors of the Eye.<P>Errors of the eye, where the sight of the copyist confuses letters or endings that are similar, writing e.g. capital eta for capital sigma; capital omicron for capital theta; capital alpha for capital lambda or capital delta; capital pi (P) for capital tau and capital iota (written together, TI); PAN for TIAN; capital mu (M) for a double capital lambda (LL). Here should be named homoeoteleuton, which arises when two successive lines in a copy end in the same word or syllable and the eye catches the second line instead of the first and the copyist omits the intervening words as in Codex Ephraemi of <a onClick="return mV(\'Jhn\',6,39);">Joh 6:39</a>.<P>(2) Errors of the Pen.<P>Here is classed all that body of variation due to the miswriting by the penman of what is correctly enough in his mind but through carelessness he fails rightly to transfer to the new copy. Transposition of similar letters has evidently occurred in Codices E, M, and H of <a onClick="return mV(\'Mar\',14,65);">Mr 14:65</a>, also in H2 L2 of <a onClick="return mV(\'Act\',13,23);">Ac 13:23</a>.<P>(3) Errors of Speech.<P>Here are included those variations which have sprung from the habitual forms of speech to which the scribe in the particular case was accustomed and which he therefore was inclined to write. Under this head comes "itacism," arising from the confusion of vowels and diphthongs, especially in dictation. Thus, iota (i) is constantly written as epsilon-iota (ei) and vice versa; alpha-iota (ai) for epsilon (e); eta (ee) and iota (i) for epsilon-iota (ei); eta (ee) and omicron-iota (oi) for upsilon (u); omicron (o) for omega (oo) and epsilon (e) for eta (ee). It is observed that in Codex Sinaiticus we have scribal preference for iota (i) alone, while in Codex Vaticanus epsilon-iota (ei) is preferred.<P>(4) Errors of Memory.<P>These are explained as having arisen from the "copyist holding a clause or sequence of letters in his somewhat treacherous memory between the glance at the manuscript to be copied and his writing down what he saw there." Here are classed the numerous petty changes in the order of words and the substitution of synonyms, as eipen for ephee, ek for apo, and vice versa.<P>(5) Errors of Judgment.<P>Under this class Dr. Warfield cites "many misreadings of abbreviations, as also the adoption of marginal glosses into the text by which much of the most striking corruption which has entered the text has been produced." Notable instances of this type of error are found in <a onClick="return mV(\'Jhn\',5,\'1-4\');">Joh 5:1-4</a>, explaining how it happened that the waters of Bethesda were healing; and in <a onClick="return mV(\'Jhn\',7,\'53-\');">Joh 7:53</A>-<a onClick="return mV(\'Jhn\',8,\'1-12\');">8:12</a>, the passage concerning the adulteress, and the last twelve verses of Mark.<P>2. Second Class:<P>Turning to the second class, that of conscious or intentional errors, we may tabulate:<P>(1) Linguistic or Rhetorical Corrections.<P>Linguistic or rhetorical corrections, no doubt often made in entire good faith under the impression that an error had previously crept into the text and needed correcting. Thus, second aorist terminations in -a are changed to -o and the like.<P>(2) Historical Corrections.<P>Under this head is placed all that group of changes similar to the case in <a onClick="return mV(\'Mar\',1,2);">Mr 1:2</a>, where the phrase "Isaiah the prophet" is changed into "the prophets."<P>(3) Harmonistic Corrections.<P>These are quite frequent in the Gospels, e.g. the attempted assimilation of the Lord\'s Prayer in Luke to the fuller form in Matthew, and quite possibly the addition of the words "of sin" to the phrase in <a onClick="return mV(\'Jhn\',8,34);">Joh 8:34</a>, "Every one that doeth sin is a slave." A certain group of harmonistic corruptions where scribes allow the memory, perhaps unconsciously, to affect the writing may rightly be classed under (4) above.<P>(4) Doctrinal Corrections.<P>Of these it is difficult to assert any unquestioned cases unless it be the celebrated Trinitarian passage (King James Version, <a onClick="return mV(\'1Jo\',5,7,8);">1Joh 5:7,8a</a>) or the several passages in which fasting is coupled with prayer, as in <a onClick="return mV(\'Mat\',17,21);">Mt 17:21</a>; <a onClick="return mV(\'Mar\',9,29);">Mr 9:29</a>; <a onClick="return mV(\'Act\',10,30);">Ac 10:30</a>; <a onClick="return mV(\'1Cr\',7,5);">1Co 7:5</a>.<P>(5) Liturgical Corrections.<P>These are very common, especially in the lectionaries, as in the beginning of lessons, and are even found in early uncials, e.g. <a onClick="return mV(\'Luk\',8,31);">Lu 8:31</a>; <a onClick="return mV(\'Luk\',10,23);">10:23</a>, etc.<P>III. Methods of Critical Procedure.<P>Here as in other human disciplines necessity is the mother of invention, and the principles of critical procedure rest almost entirely on the data connected with the errors and discrepancies which have consciously or unconsciously crept into the text. The dictum of Dr. George Salmon that "God has at no time given His church a text absolutely free from ambiguity" is true warrant for a free and continued inquiry into this attractive field of study. The process of textual criticism has gradually evolved certain rules based upon judgments formed after patiently classifying and taking into account all the documentary evidence available, both internal and external.<P>(1) An older reading is preferable to one later, since it is presumed to be nearer the original. However, mere age is no sure proof of purity, as it is now clear that very many of the corruptions of the text became current at an early date, so that in some cases it is found that later copies really represent a more ancient reading.<P>(2) A more difficult reading, if well supported, is preferable to one that is easier, since it is the tendency of copyists to substitute an easy, well-known and smooth reading for one that is harsh, unusual and ungrammatical. This was commonly done with the best of intentions, the scribe supposing he was rendering a real service to truth.<P>(3) A shorter is preferable to a longer reading, since here again the common tendency of scribes is toward additions and insertions rather than omissions. Hence arose, in the first place, the marginal glosses and insertions between the lines which later transcribers incorporated into the text. Although this rule has been widely accepted, it must be applied with discrimination, a longer reading being in some cases clearly more in harmony with the style of the original, or the shorter having arisen from a case of homoeoteleuton.<P>(4) A reading is preferable, other things being equal, from which the origin of all alternative readings can most clearly be derived. This principle is at once of the utmost importance and at the same time demands the most careful application. It is a sharp two-edged-sword, dangerous alike to the user and to his opponents.<P>(5) A reading is preferable, says Scrivener, "which best suits the peculiar style, manner and habits of thought of an author, it being the tendency of copyists to overlook the idiosyncrasies of the writer. Yet habit or the love of critical correction may sometimes lead the scribe to change the text to his author\'s more usual style as well as to depart from it through inadvertence, so that we may securely apply the rule only where the external evidence is not unequally balanced.".<P>(6) A reading is preferable which reflects no doctrinal bias, whether orthodox on the one side or heretical on the other. This principle is so obvious that it is accepted on all sides, but in practice wide divergence arises, owing to the doctrinal bias of the critic himself.<P>These are the main Canons of internal evidence. On the side of external evidence may be summarized what has already been implied:<P>(1) A more ancient reading is usually one that is supported by the most ancient manuscripts.<P>(2) A reading which has the undoubted support of the earliest manuscripts, versions and patristic writers is unquestionably original.<P>(3) A disagreement of early authorities usually indicates the existence of corruption prior to them all.<P>(4) Mere numerical preponderance of witnesses (to a reading) of any one class, locality or time, is of comparative insignificance.<P>(5) Great significance must be granted to the testimony of witnesses from localities or times widely apart, and it can only be satisfactorily met by a balancing agreement of witnesses also from different times and localities.<P>These rules, though they are all excellent and each has been employed by different critics with good results, are now somewhat displaced, or rather supplemented, by the application of a principle very widely used, though not discovered, by Westcott and Hort, known as the principle of the genealogy of manuscripts. The inspection of a very broad range of witnesses to the New Testament text has led to their classification into groups and families according to their prevailing errors, it being obvious that the greater the community of errors the closer the relationship of witnesses. Although some of the terms used by Westcott and Hort, as well as their content, have given rise to well-placed criticism, yet their grouping of manuscripts is so self-convincing that it bids fair, with but slight modification, to hold, as it has thus far done, first place in the field. Sir Frederick G. Kenyon has so admirably stated the method that the gist of his account will be given, largely using his identical words (Handbook to the Textual Criticism of the New Testament, 2nd edition, London, 1912). As in all scientific criticism, four steps are followed by Westcott and Hort:<P>(a) The individual readings and the authorities for them are studied;<P>(b) an estimate is formed of the character of the several authorities;<P>(c) an effort is made to group these authorities as descendants of a common ancestor, and<P>(d) the individual readings are again taken up and the first provisional estimate of their comparative probability revised in the light of the knowledge gained as to the value and interrelation of the several authorities.<P>Applying these methods, four groups of texts emerge from the mass of early witnesses:<P>(a) The Antiochian or Syrian, the most popular of all and at the base of the Greek Textus Receptus and the English King James Version; in the Gospels the great uncials Alexandrinus and Ephraemi (C) support it as well as Codex N, Codex Sigma and Codex Phi, most of the later uncials and almost all minuscules, the Peshitta-Syriac version and the bulk of the Church Fathers from Chrysostom;<P>(b) the Neutral, a term giving rise to criticism on all sides and by some displaced by the term Egyptian; this group is small but of high antiquity, including S B L T Z, A and C, save in the Gospels, the Coptic versions (especially the Bohairic) and some of the minuscules, notably 33 and 81;<P>(c) the Alexandrian, closely akin to the Neutral group, not found wholly in any one manuscript but traceable in such manuscripts as S C L X,33,and the Bohairic version, when they differ from the other members headed by B;<P>(d) the Western, another term considered ambiguous, since it includes some important manuscripts and Fathers very ancient and very Eastern; here belong D D2 E2 F2 G2 among the uncials, 28, 235, 383, 565, 614, 700, and 876 among the minuscules, the Old Syriac and Old Latin and sometimes the Sahidic versions.<P>Of these groups by far the most superior is the Neutral, though Westcott and Hort have made it so exclusively to coincide with Codex Vaticanus that they appear at times to have broken one of the great commandments of a philologist, as quoted by Dr. Nestle from a German professor, "Thou shalt worship no codices." Now, the only serious dispute centers on the apparent slight which this system may have put upon the so-called Western type of text in group four. The variants of this family are extensive and important and appear due to an extremely free handling of the text at some early date when scribes felt themselves at liberty to vary the language of the sacred books and even to insert additional passages of considerable length.<P>Although this type of text is of very early origin and though prevalent in the East was very early carried to the West, and being widely known there has been called Western, yet, because of the liberties above referred to, its critical value is not high, save in the one field of omissions. In Egypt, however, and especially Alexandria, just as in the case of the Old Testament, the text of the New Testament was critically considered and conserved, and doubtless the family called Neutral, as well as the so-called Alexandrian, springs up here and through close association with Caesarea becomes prevalent in Palestine and is destined to prevail everywhere. The Westcott-Hort contention that the Antiochian text arose as a formal attempt at repeated revision of the original text in Antioch is not so convincing, but for want of a better theory still holds its place. Their objections, however, to its characteristic readings are well taken and everywhere accepted, even von Soden practically agreeing here, though naming it the Koine text. It is also interesting to find that von Soden\'s Hesychian text so closely parallels the Neutral-Alexandrian above, and his Jerusalem family the Western. And thus we arrive at the present consensus of opinion as to the genealogical source of the text of the New Testament.<P>IV. History of the Process.<P>Abundant evidence exists and is constantly growing to show that critical opinion and methods were known at least from the very days of the formation of the New Testament Canon, but in such a sketch as the present the history can only be traced in modern times. The era of printing necessarily marks a new epoch here. Among available manuscripts choice must be made and a standard set, and in view of the material at hand it is remarkable how ably the work was done. It began in Spain under Cardinal Ximenes of Toledo, who printed at Alcala (Complutum) in 1514 the New Testament volume of his great Polyglot, though it was not actually issued until 1522. Meanwhile the great Erasmus, under patronage of Froben the printer of Basel, had been preparing a Greek New Testament, and it was published early in 1516 in a single volume and at low cost, and had reached its 3rd edition by 1522. His 4th edition in 1537 contains Erasmus\' definitive text, and, besides using Cardinal Ximenes\' text, had the advantage of minuscule manuscripts already named. The next important step was taken by Robert Estienne (Stephanus), whose 3rd edition, "Regia," a folio published in Paris in 1550, was a distinct advance, and, though based directly upon the work of Ximenes and Erasmus, had marginal readings from 15 new manuscripts, one of which was Codex Bezae (D). The learned Theodore Beza himself worked with Stephanus\' son Henri, and brought out no less than nine editions of the New Testament, but no great critical advance was made in them. The same may be said of the Seven Elzevir editions brought out at Leyden and Amsterdam between 1624 and 1678, the second, that of 1633, in the preface of which occurs the phrase, "Textum ergo habes nunc ab omnibus receptum," becoming the continental standard, as the 1550 edition of Stephanus has for England. Thus, we arrive at the Textus Receptus, and the period of preparation is closed.<P>The second period, or that of discovery and research, was ushered in by the great London Polyglot of 1657, edited by Brian Walton (later Bishop of Chester) with collations by Archbishop Ussher of 15 fresh manuscripts, including Codex Alexandrinus and Codex 59. But Dr. John Mill of Oxford was the Erasmus of this period, and in 1707 after 30 years of labor brought out the Greek Textus Receptus with fresh collations of 78 manuscripts, many versions and quotations from the early Fathers. His manuscripts included A B D E K,28,33,59,69,71,the Peshito, Old Latin and Vulgate, and his Prolegomena set a new standard for textual criticism. This apparatus was rightly appreciated by Richard Bentley of Cambridge and a revised text of the Greek and of the Vulgate New Testament was projected along lines which have prevailed to this day. The work and wide correspondence of Bentley had stirred up continental scholars, and J. A. Bengel published in 1734 at Tubingen a Greek New Testament with the first suggestion as to genealogical classification of manuscripts. J. J. Wetstein of Basel and Amsterdam, though a very great collector of data and the author of the system of manuscript notation which has continued ever since, made little critical advance. J. S. Semler, taking Wetstein\'s material, began rightly to interpret it, and his pupil J. J. Griesbach carried the work still farther, clearly distinguishing for the first time a Western, an Alexandrian and a Constantinopolitan recension.<P>With Carl Lachmann began the last epoch in New Testament criticism which has succeeded in going behind the Textus Receptus and establishing an authentic text based on the most ancient sources. He applied the critical methods with which he was familiar in editing the classics, and with the help of P. Buttmann produced an edition in 1842-50 which led the way directly toward the goal; but they were limited in materials and Tischendorf soon furnished these. Constantine Tischendorf, both as collector and editor, is the foremost man thus far in the field. His 8th edition,1872,of the Greek New Testament, together with his Prolegomena, completed and published, 1884-1894, by C. R. Gregory, set a new standard. Dr. Gregory\'s German edition of the Prolegomena, 1900-1909, supplemented by his Die griechischen Handschriften des New Testament, 1908, marks the further advance of the master through his master pupil. Meanwhile, S. P. Tregelles was doing almost as prodigious and valuable a work in England, and was thus preparing for the final advances at Cambridge. F. H. A. Scrivener also ranks high and did extremely valuable, though somewhat conservative, work in the same direction. In 1881 "the greatest edition ever published," according to Professor Souter, was brought out in England coincident with the Revised Version of the English New Testament. This, together with the introduction, which the same writer characterizes as "an achievement never surpassed in the scholarship of any country," was the joint product of B. F. Westcott and F. J. A. Hort, friends and co-workers for many years in the University of Cambridge. Thus with the end of the 19th century the history of the process may be said to close, though both process and progress still advance with ever increasing triumph.<P>Von Soden\'s edition of the New Testament appeared during the summer of 1913 and is of first importance. It differs from all others in the extreme weight laid on Tatian\'s Diatessaron as the source of the bulk of the errors in the Gospels. This theory is not likely to command the assent of scholars and the text (which does not differ greatly from Tischendorf\'s) is consequently of doubtful value. Nevertheless, for fullness of material, clearness of arrangement, and beauty of printing, von Soden\'s edition must inevitably supersede all others, even where the text is dissented from. Dr. Gregory promises a new edition at some day not too far in the future which, in turn, will probably supersede von Soden\'s.<P>LITERATURE.<P>C. R. Gregory, Prolegomena to Tischendorf\'s New Testament, Leipzig, 1884-94, Textkritik des New Testament, Leipzig, 1900-1909, Die griechischen Handschriften des New Testament, Leipzig,1908,Einleitung in das New Testament, Leipzig,1909,Vorschlage fur eine kritische Ausgabe des griechischen New Testament, Leipzig, 1911; F. G. Kenyon, Paleography of Greek Papyri, Oxford,1899,Handbook to the Textual Criticism of the New Testament, London2, 1912; K. Lake, The Text of the New Testament, 4th edition, London, 1910; G. Milligan, Selections from the Greek Papyri, Cambridge,1910,The New Testament Documents, 1913; Eb. Nestle, Einfuhrung in das New Testament, Gottingen3, 1909; F. H. A. Scrivener, Plain Introduction to the Criticism of the New Testament, 4th edition, London, 1894; Souter, Text and Canon of the New Testament, 1913; E. M. Thompson, Handbook of Greek and Latin Paleography, 2nd edition, London, 1894; H. von Soden, Die Schriften des New Testament, I. Tell, Untersuchungen, Berlin, 1902-10; II, Tell, 1913; B. F. Westcott, and F. J. A. Hort, The New Testament in Greek with Introduction, Cambridge and London, 1896; Th. Zahn, Introduction to the New Testament, English translation, Edinburgh, 1910.``161';
isbe[8709]='Text of the Old Testament`<b>I. EARLIEST FORM OF WRITING IN ISRAEL</b><P class="in15">1. Invention of Alphabet<P class="in15">2. The Cuneiform<P class="in15">3. References to Writing in the Old Testament<P class="in15">4. Inscriptions after Settlement in Canaan<P class="in15">5. Orthography of the Period<P><b>II. THE TWO HEBREW SCRIPTS</b><P class="in15">1. The Old Hebrew Alphabet<P class="in15">2. Aramean Alphabets<P class="in15">3. The New Hebrew Script<P class="in15">4. New Hebrew Inscriptions<P class="in15">5. Summary<P><b>III. THE CHANGE OF SCRIPT</b><P class="in15">1. Various Theories<P class="in15">2. The Change in the Law<P class="in15">3. In the Other Books<P class="in15">4. Evidence of the Septuagint<P class="in15">5. Evidence of the Text Itself<P class="in15">6. Conclusion<P><b>IV. PRESERVATION OF THE TEXT</b><P class="in15">1. Internal Conditions<P class="in15">2. External Circumstances<P class="in15">3. The Septuagint Version<P><b>V. THE TEXT IN THE 1ST CENTURY AD</b><P class="in15">1. Word Separation<P class="in15">2. Other Breaks in the Text<P class="in15">3. Final Forms of Letters<P class="in15">4. Their Origin<P class="in15">5. Conclusion<P class="in15">6. The Vowel-Letters<P class="in15">7. Anomalous Forms<P class="in15">8. The Dotted Words<P class="in15">9. Their Antiquity<P class="in15">10. The Inverted Nuns ("n")<P class="in15">11. Large and Small Letters<P class="in15">12. Suspended Letters and Divided Waw ("w")<P class="in15">13. Abbreviations<P class="in15">14. Conclusion<P><b>VI. ALTERATION OF PRINCIPAL DOCUMENTS</b><P class="in15">1. Yahweh and Baal<P class="in15">2. Euphemistic Expressions<P class="in15">3. "Tiqqun copherim"<P><b>VII. SCRIBAL ERRORS IN THE TEXT</b><P class="in15">1. Misunderstanding<P class="in15">2. Errors of the Eye<P class="in15">3. Errors of the Ear<P class="in15">4. Errors of Memory<P class="in15">5. Errors of Carelessness and Ignorance<P><b>VIII. HISTORY OF THE TEXT</b><P class="in15">1. Changes Made in Reading<P class="in15">2. Preservation of Text<P class="in15">3. Division into Verses<P class="in15">4. Sections of the Law<P class="in15">5. Sections of the Prophets<P class="in15">6. Poetical Passages<P class="in15">7. Division into Books<P><b>IX. VOCALIZATION OF THE TEXT</b><P class="in15">1. Antiquity of the Points<P class="in15">2. Probable Date of Invention<P class="in15">3. Various Systems and Recensions<P><b>X. THE PALESTINIAN SYSTEM</b><P class="in15">1. The Consonants<P class="in15">2. The Vowels<P class="in15">3. The Accents<P class="in15">4. Anomalous Pointings<P><b>XI. THE MASORAH</b><P class="in15">1. Meaning of the Term<P class="in15">2. The "Qere" and "Kethibh"<P class="in15">3. Other: Features<P><b>XII. MANUSCRIPTS AND PRINTED TEXTS</b><P class="in15">1. Manuscripts<P class="in15">2. Early Printed Texts<P class="in15">3. Later Editions<P class="in15">4. Chapters and Verses<P><b>LITERATURE</b><hr /><P>I. Earliest Form of Writing in Israel.<P>The art of writing is not referred to in the Book of Genesis, even where we might expect a reference to it, e.g. in <a onClick="return mV(\'Gen\',23,\'1-\');">Ge 23</a>, nor anywhere in the Old Testament before the time of Moses (compare however, <a onClick="return mV(\'Gen\',38,18,25);">Ge 38:18,25</a>; <a onClick="return mV(\'Gen\',41,44);">41:44</a>, which speak of "sealing" devices).<P>See <a href="./study/isbe/search.html?string=SEAL">SEAL</A>; <a href="./study/isbe/search.html?string=WRITING">WRITING</A>.<P>1. Invention of Alphabet:<P>About the year 1500 BC alphabetic writing was practiced by the Phoenicians, but in Palestine the syllabic Babylonian cuneiform was in use (see <a href="./study/isbe/search.html?string=ALPHABET">ALPHABET</A>). The Israelites probably did not employ any form of writing in their nomadic state, and when they entered Canaan the only script they seem ever to have used was the Phoenicia. This is not disproved by the discovery there of two cuneiform contracts of the 7th century, as these probably belonged to strangers. There is only one alphabet in the world, which has taken many forms to suit the languages for which it was employed. This original alphabet was the invention of the Semites, for it has letters peculiar to the Semitic languages, and probably of the Phoenicians (so Lucan, Pharsalia iii.220; compare Herodotus v.58), who evolved it from the Egyptian hieroglyphics.<P>2. The Cuneiform:<P>Of the literature of Canaan before the Israelites entered it the remains consist of a number of cuneiform tablets found since 1892 at Lachish, Gezer, Taanach and Megiddo, but especially of the famous the Tell el-Amarna Letters, discovered in Egypt in 1887. Although this non-alphabetic script was in use in Canaan when the Israelites entered it, they do not seem to have adopted it.<P>3. References to Writing in the Old Testament:<P>The earliest reference to writing in the Old Testament is <a onClick="return mV(\'Exd\',17,14);">Ex 17:14</a>. The next is <a onClick="return mV(\'Exd\',24,7);">Ex 24:7</a>, mentioning the Book of the Covenant (<a onClick="return mV(\'Exd\',20,\'1-\');">Ex 20-23</a>). The Book of the Wars of Yahweh is named in <a onClick="return mV(\'Num\',21,14);">Nu 21:14</a>. Other early references are <a onClick="return mV(\'Jdg\',5,14);">Jud 5:14</a> margin; <a onClick="return mV(\'Jdg\',8,14);">8:14</a> margin. By the time of the monarchy the king and nobles could write (<a onClick="return mV(\'2Sa\',11,14);">2Sa 11:14</a>; <a onClick="return mV(\'2Sa\',8,17);">8:17</a>), but not the common people, until the time of Amos and Hosea, when writing seems to have been common.<P>4. Inscriptions after Settlement in Canaan:<P>The Phoenician script prevailed in Palestine after the conquest as well as in the countries bordering on it. This is shown by the inscriptions which have been discovered. The chief of these are: the Baal Lebanon inscription found in Cyprus (beginning of the 9th century); the manuscript of about the year 896 of the ordinary chronology; a Hebrew agricultural calendar of the 8th century; fifteen lion-weights from Nineveh of about the year 700; the Siloam Inscription of the time of Hezekiah; about a score of seals; and, in 1911, a large number of ostraca of the time of Ahab.<P>5. Orthography of the Period:<P>In this oldest writing the vowels are rarely expressed, not even final vowels being indicated. The only mark besides the letters is a point separating the words. There are no special forms for final letters. Words are often divided at the ends of lines. The writing is from right to left. The characters of the Siloam Inscription and the ostraca show some attempt at elegant writing.<P>II. The Two Hebrew Scripts.<P>1. The Old Hebrew Alphabet:<P>Two distinct scripts were used by the Hebrews, an earlier and a later. The Old Hebrew alphabet contained 22 letters, all consonants. The order of these letters is known from that of the Greek, taken in order of their numerical values, and later by the alphabetic psalms, etc., and by the figure called \'at-bash (see <a href="./study/isbe/search.html?string=SHESHACH">SHESHACH</A>). In the acrostic passages, however, the order is not always the same; this may be due to corruption of the text. In the alphabet, letters standing together bear similar names. These are ancient, being the same in Greek as in Semitic. They were probably given from some fancied resemblance which the Phoenicians saw in the original Egyptian sign to some object.<P>2. Aramean Alphabets:<P>The development of the Phoenician alphabet called Aramaic begins about the 7th century BC. It is found inscribed as dockets on the cuneiform clay tablets of Nineveh, as the Phoenician letters were upon the lion-weights; on coins of the Persian satraps to the time of Alexander; on Egyptian inscriptions and papyri; and on the Palmyrene inscriptions. The features of this script are the following: The loops of the Hebrew letters beth (b), daleth (d), Teth (T), qoph (q) and resh (r), which are closed in the Phoenician and Old Hebrew, are open, the bars of the Hebrew letters he (h), waw (w), zayin (z), cheth (ch) and taw (t) are lost, and the tails of kaph (k), lamedh (l), mem (m), pe (p) and tsadhe (ts), which are vertical in the old Aramaic, begin in the Egyptian Aramaic to curve toward the left; words are divided, except in Palmyrene, by a space instead of a point; vowel-letters are freely used; and the use of ligatures involves a distinction of initial, medial and final forms. There are of course no vowel-marks.<P>3. The New Hebrew Script:<P>After the Jews returned from the exile, the Aramaic language was the lingua franca of the Seleucid empire, displacing Assyrian, Old Hebrew and Phoenician. The Phoenician script also had given place to the Aramaic in Mesopotamia, Syria and Egypt. In Syria it divided into two branches, a northern which grew into Syriac, and a southern, or Jewish, from which the New Hebrew character was produced.<P>4. New Hebrew Inscriptions:<P>What is believed to be the oldest inscription in the modern Hebrew character is that in a cave at \'Araq al-\'Amir near Heshbon, which was used as a place of retreat in the year 176 BC (Ant., XII, iv, 11; CIH, <span class="noTag">number 1</span>). Others are: four boundary stones found at Gezer; the inscriptions over the "Tomb of James" really of the Beni Hezir (<a onClick="return mV(\'1Ch\',24,15);">1Ch 24:15</a>; <a onClick="return mV(\'Neh\',10,20);">Ne 10:20</a>); that of Kefr Birim, assigned to the year 300 AD (CIH, <span class="noTag">number 17</span>), in which the transition to the New Hebrew script may be said to be accomplished; and others have been found all over the Roman empire and beyond.<P>See <a href="./study/isbe/search.html?string=ARCHAEOLOGY">ARCHAEOLOGY</A>.<P>5. Summary:<P>The inscriptions show that the familiar Hebrew character is a branch of the Aramaic. In the 3rd century BC the latter script was in general use in those countries where Assyrio-Babylonian, Old Hebrew and Phoenician had been used before. The Jews, however, continued to employ the Old Hebrew for religious purposes especially, and the Samaritans still retain a form of it in their Bible (the Pentateuch).<P>III. The Change of Script.<P>It is now almost universally agreed that the script in which the Old Testament was written was at some time changed from the Phoenician to the Aramaic. But in the past many opinions have been held on the a subject.<P>1. Various Theories:<P>Rabbi Eleazar of Modin (died 135 AD), from the mention of the hooks (waws) in <a onClick="return mV(\'Exd\',27,10);">Ex 27:10</a> and from <a onClick="return mV(\'Est\',8,9);">Es 8:9</a>, denied any change at all. Rabbi Jehuda (died circa 210) maintained that the Law was given in the New Hebrew, which was later changed to the Old as a punishment, and then back to the New, on the people repenting in the time of Ezra. Texts bearing on the matter are <a onClick="return mV(\'2Ki\',5,7);">2Ki 5:7</a>; <a onClick="return mV(\'2Ki\',18,26);">18:26</a>; <a onClick="return mV(\'Isa\',8,1);">Isa 8:1</a>, from which various deductions have been drawn. There may have been two scripts in use at the same time, as in Egypt (Herod. ii.36).<P>2. The Change in the Law:<P>In regard to the change in the Law, the oldest authority, Eleazar ben Jacob (latter part of the 1st century AD), declared that a Prophet at the time of the Return commanded to write the Torah in the new or square character. Next Rabbi Jose (a century later) states (after <a onClick="return mV(\'Ezr\',4,7);">Ezr 4:7</a>) that Ezra introduced a new script and language. But the locus classicus is a passage in the Talmud (Sanhedhrin 21b): "Originally the Law was given to Israel in the Hebrew character and in the Holy Tongue; it was given again to them in the days of Ezra in the Assyrian characters and in the Aramaic tongue. Israel chose for herself the Assyrian character and the Holy Tongue, and left the Hebrew character and the Aramaic tongue to the hedhyototh." Here Hebrew = Old Hebrew; Assyrian = the new square character, and hedhyototh is the Greek idiotai = the Hebrew \'am ha-\'arets, the illiterate multitude. From the 2nd century on (but not before), the Talmudic tradition is unanimous in ascribing the change of script in the Law to Ezra. The testimony of Josephus points to the Law at least being in the square character in his day (Ant., XII, ii, 1, 4). The Samaritan Pentateuch was almost certainly drawn up in the time of Nehemiah (compare <a onClick="return mV(\'Neh\',13,28);">13:28</a>; also Ant, XI, vii, 2), and points to the Old Hebrew being then in use. So Rabbi Chasda (died 309) refers the word hedhyototh above to the Samaritans. On the other hand, the Samaritan Pentateuch may have been the original Law, common to both Israel and Judah. In any case it is written in a form of the Old Hebrew character.<P>3. In the Other Books:<P>In regard to the other books, the old script was used after Ezra\'s time. <a onClick="return mV(\'Est\',8,9);">Es 8:9</a> and <a onClick="return mV(\'Dan\',5,8);">Da 5:8</a>ff must refer to the unfamiliar Old Hebrew. So the Massoretic Text of 5:18 implies the New Hebrew, but only in the Law.<P>4. Evidence of the Septuagint:<P>The Greek translation known as the Septuagint was made in Alexandria, and is hardly evidence for Palestine. The Law was probably translated under Ptolemy II (284-247 BC), and the other books by the end of the 2nd century BC (compare Ecclesiasticus, Prologue). The variations of the Septuagint from the Massoretic Text point to an early form of the square character as being in use; but the Jews of Egypt had used Aramaic for some centuries before that.<P>5. Evidence of the Text Itself:<P>The variations between parallel passages in the Massoretic Text itself, such as <a onClick="return mV(\'Jos\',21,\'1-\');">Jos 21</a> and <a onClick="return mV(\'1Ch\',6,\'1-\');">1Ch 6</a>; <a onClick="return mV(\'2Sa\',23,\'1-\');">2Sa 23</a> and <a onClick="return mV(\'1Ch\',11,\'1-\');">1Ch 11</a>, etc., show that the letters most frequently confused are "d" and "r", which are similar in both the Old and New Hebrew; "b" and "d", which are more alike in the Old Hebrew; "w" and "y" and several others, which are more alike in the New Hebrew. Such errors evidently arose from the use of the square character, and they arose subsequent to the Septuagint, for they are not, except rarely, found in it. The square character is, then, later than the Septuagint.<P>6. Conclusion:<P>The square character was ascribed to Ezra as the last person who could have made so great a change, the text after his time being considered sacred. This is disproved by the fact of the coins of the Maccabees and of Bar Cochba being in the old character. The Talmud permits Jews resident outside Palestine to possess copies of the Law in Coptic, Median, Hebrew, etc. Here Hebrew can only mean the Old Hebrew script.<P>IV. Preservation of the Text.<P>1. Internal Conditions:<P>Judaism has always been a book religion: it stands or falls with the Old Testament, especially with the Pentateuch. Although no manuscript of the Hebrew Old Testament is older than the 10th century AD, save for one minute papyrus, we know, from citations, translations, etc., that the consonantal text of the Old Testament was in the 1st century AD practically what it is today. The Jews transliterated as well as translated their Bible. All the most important translations—the Septuagint, Aquila, Theodotion, Symmachus—were made by Jews and aimed at a more literal rendering of the Hebrew—that of Aquila being hardly Greek. The Syriac (Peshitta) seems to be also by Jews or Jewish Christians. Great care was taken of the text itself, and the slightest variant readings of manuscripts were noted. One manuscript belonging to Rabbi Meir (2nd century) is said to have omitted the references to "Admah and Zeboiim" in <a onClick="return mV(\'Deu\',29,23);">De 29:23</a> and to Bethlehem in <a onClick="return mV(\'Gen\',48,7);">Ge 48:7</a>, and to have had other lesser variations, some of which were found also in the manuscript which, among other treasures, decked the triumph of Vespasian (BJ, VII, v, 7).<P>2. External Circumstances:<P>Religious persecution makes for the purity of the Scriptures by reducing the number of copies and increasing the care bestowed on those saved. The chief moments in which the existence of the Jewish Scriptures was threatened were the destruction of Jerusalem and the Temple under Nebuchadnezzar in 587 BC, in which the Book of Jashar and that of the Wars of the Lord may have been lost; the persecution under Antiochus Epiphanes, during which the possession of the sacred books was a capital offense (1Macc 1:56,57; Ant, XII, v), in which the sources used by the Chronicler may have perished; and the capture of Jerusalem by Titus in 70 AD. By this time, however, the Law at least was known by heart. Josephus says Titus made him a gift of the sacred books (Vita, 75). It is also said that at one time only three copies of the Law were left, and that a text was obtained by taking the readings of two against one. However that may be, it is a fact that there are no variant readings in the Massoretic Text, such as there are in the New Testament.<P>3. The Septuagint Version: The only ancient version which can come into competition with the Massoretic Text is the Septuagint, and that on two grounds. First, the manuscripts of the Septuagint are of the 4th century AD, those of the Massoretic Text of the 10th. Secondly, the Septuagint translation was made before a uniform Hebrew text, such as our Massoretic Text, existed. The quotations in the New Testament are mainly from the Septuagint. Only in the Book of Jeremiah, however, are the variations striking, and there they do not greatly affect the sense of individual passages. The Greek has also the Apocrypha. The Septuagint is an invaluable aid to restoring the Hebrew where the latter is corrupt.<P>V. The Text in the 1st Century AD.<P>The Massoretic Text of the 1st Christian century consisted solely of consonants of an early form of the square character. There was no division into chapters or, probably, verses, but words were separated by an interstice, as well as indicated by the final letters. The four vowel-letters were used most freely in the later books. A few words were marked by the scribes with dots placed over them.<P>1. Word Separation:<P>The Samaritan Pentateuch still employs the point found on the Moabite Stone to separate words. This point was probably dropped when the books came to be written in the square character. Wrong division of words was not uncommon.<P>Tradition mentions 15 passages noted on the margin of the Hebrew Bible (<a onClick="return mV(\'Gen\',30,11);">Ge 30:11</a>, etc.) in which two words are written as one. One word is written as two in <a onClick="return mV(\'Jdg\',16,25);">Jud 16:25</a>; <a onClick="return mV(\'1Sa\',9,1);">1Sa 9:1</a>, etc. Other passages in which tradition and text differ as to the word-division are <a onClick="return mV(\'2Sa\',5,2);">2Sa 5:2</a>; <a onClick="return mV(\'Eze\',42,9);">Eze 42:9</a>; <a onClick="return mV(\'Job\',38,12);">Job 38:12</a>; <a onClick="return mV(\'Ezr\',4,12);">Ezr 4:12</a>. The Septuagint frequently groups the letters differently from the Massoretic Text, e.g. (see the commentaries) <a onClick="return mV(\'Hsa\',11,2);">Ho 11:2</a>; <a onClick="return mV(\'1Ch\',17,10);">1Ch 17:10</a>; <a onClick="return mV(\'Psa\',73,4);">Ps 73:4</a>; <a onClick="return mV(\'Psa\',106,7);">106:7</a>.<P>2. Other Breaks in the Text:<P>The verse-division was not shown in the prose books. The present division is frequently wrong and the Septuagint different from the Hebrew: e.g. <a onClick="return mV(\'Gen\',49,19,20);">Ge 49:19,20</a>; <a onClick="return mV(\'Psa\',42,6,7);">Ps 42:6,7</a>; <a onClick="return mV(\'Jer\',9,5,6);">Jer 9:5,6</a>; <a onClick="return mV(\'Psa\',90,2,3);">Ps 90:2,3</a>. Neither was there any division into chapters, or even books. Hence, the number of the psalms is doubtful. The Greek counts <a onClick="return mV(\'Psa\',9,\'1-\');">Psalms 9</a> and <a onClick="return mV(\'Psa\',10,\'1-\');">10</a> as one, and also <a onClick="return mV(\'Psa\',114,\'1-\');">Psalms 114</a> and <a onClick="return mV(\'Psa\',115,\'1-\');">115</a>, at the same time splitting <a onClick="return mV(\'Psa\',116,\'1-\');">Psalms 116</a> and <a onClick="return mV(\'Psa\',147,\'1-\');">147</a> each into two. The Syriac follows the Greek with regard to <a onClick="return mV(\'Psa\',114,\'1-\');">Psalms 114</a> and <a onClick="return mV(\'Psa\',147,\'1-\');">147</a>. Some manuscripts make one psalm of 42 and 43. In <a onClick="return mV(\'Act\',13,33);">Ac 13:33</a>, Codex Bezae, <a onClick="return mV(\'Psa\',2,\'1-\');">Ps 2</a> appears as <a onClick="return mV(\'Psa\',1,\'1-\');">Ps 1</a>.<P>3. Final Forms of Letters:<P>Final forms of letters are a result of the employment of ligatures. In the Old Hebrew they do not occur, nor apparently in the text used by the Septuagint. Ligatures begin to make their appearance in Egyptian, Aramaic, and Palmyrene. Final forms for the letters k, margin, n, p, ts, were accepted by the 1st century, and all other final forms were apparently rejected.<P>4. Their Origin:<P>The first rabbi to mention the final forms is Mathiah ben Harash (a pupil of Rabbi Eleazar who died in 117 AD), who refers them to Moses. They are often referred to in the Talmud and by Jerome. The Samaritan Chronicle (11th century) refers them to Ezra. In point of fact, they are not so old as the Septuagint translation, as is proved by its variations in such passages as <a onClick="return mV(\'1Sa\',1,1);">1Sa 1:1</a>; <a onClick="return mV(\'1Sa\',20,40);">20:40</a>; <a onClick="return mV(\'Psa\',16,3);">Ps 16:3</a>; <a onClick="return mV(\'Psa\',44,5);">44:5</a>; <a onClick="return mV(\'Jer\',16,19);">Jer 16:19</a>; <a onClick="return mV(\'Jer\',23,14,23,33);">23:14,23,33</a>; <a onClick="return mV(\'Hsa\',6,5);">Ho 6:5</a>; <a onClick="return mV(\'Nah\',1,12);">Na 1:12</a>; <a onClick="return mV(\'Zec\',11,11);">Zec 11:11</a>; Ecclesiasticus 3:7. From the fact that the final forms make up the Hebrew expression for "from thy watchers," their invention was referred in the 3rd century to the prophets (compare <a onClick="return mV(\'Isa\',52,8);">Isa 52:8</a>; <a onClick="return mV(\'Hab\',2,1);">Hab 2:1</a>).<P>5. Conclusion:<P>After the adoption of the square character, therefore, the only breaks in the text of prose books were the spaces left between the words. Before the 1st century there was much uncertainty as to the grouping of the letters into words. After that the word-division was retained in the copies, even when it was not read (as in <a onClick="return mV(\'2Sa\',5,2);">2Sa 5:2</a>, etc.). At first the final form would occur at the end of the ligature, not necessarily at the end of the word. Remains of this will be found in <a onClick="return mV(\'1Ch\',27,12);">1Ch 27:12</a>; <a onClick="return mV(\'Isa\',9,6);">Isa 9:6</a>; <a onClick="return mV(\'Neh\',2,13);">Ne 2:13</a>; <a onClick="return mV(\'Job\',38,1);">Job 38:1</a>; <a onClick="return mV(\'Job\',40,6);">40:6</a>. When the ligatures were discarded, these forms were used to mark the ends of words. The wonder is that there are not more, or even an initial, medial and final form for every letter, as in Arabic and Syriac.<P>6. The Vowel-Letters:<P>The four letters, \',h, w, y, seem to have been used to represent vowel sounds from the first. They are found in the manuscripts, but naturally less freely on stone inscriptions than in books. The later the text the more freely they occur, though they are commoner in the Samaritan Pentateuch than in the Massoretic Text. The copies used by the Septuagint had fewer of them than the Textus Receptus, as is proved by their translations, of <a onClick="return mV(\'Amo\',9,12);">Am 9:12</a>; <a onClick="return mV(\'Eze\',32,29);">Eze 32:29</a>; <a onClick="return mV(\'Hsa\',12,12);">Ho 12:12</a>, and other passages, The four letters occur on Jewish coins of the 2nd century BC and AD.<P>7. Anomalous Forms:<P>In the 1st and 2nd centuries the vowel-letters were retained in the text, even when not read (<a onClick="return mV(\'Hsa\',4,6);">Ho 4:6</a>; <a onClick="return mV(\'Mic\',3,2);">Mic 3:2</a>, etc.). In the Pentateuch, <a onClick="return mV(\'Deu\',32,13);">De 32:13</a> seems to be the sole instance. The Pentateuch is peculiar also in that in it the 3rd person singular, masculine, of the personal pronoun is used for the feminine, which occurs only 11 times; <a onClick="return mV(\'Gen\',2,12);">Ge 2:12</a>; <a onClick="return mV(\'Gen\',14,2);">14:2</a>; compare <a onClick="return mV(\'Isa\',30,33);">Isa 30:33</a>; <a onClick="return mV(\'1Ki\',17,15);">1Ki 17:15</a>; <a onClick="return mV(\'Job\',31,11);">Job 31:11</a>. This phenomenon probably arises from the stage in the growth of the script when waw (w) and yodh (y) were identical in form; compare <a onClick="return mV(\'Psa\',73,16);">Ps 73:16</a>; <a onClick="return mV(\'Ecc\',5,8);">Ec 5:8</a>. Frequently the 1st person singular perfect of the verb is written defectively (<a onClick="return mV(\'Psa\',140,13);">Ps 140:13</a>; <a onClick="return mV(\'2Ki\',18,20);">2Ki 18:20</a>; compare <a onClick="return mV(\'Isa\',36,5);">Isa 36:5</a>); similarly the "h" of na\'arah (<a onClick="return mV(\'Deu\',22,\'1-\');">De 22</a>). All this shows there was no attempt to correct the text. It was left as it was found.<P>8. The Dotted Words:<P>When a scribe had miscopied a word he sometimes placed dots over it, without striking it out. There are 15 passages so marked in the Old Testament, and the word naqudh, "pointed," is generally placed in the margin. The word may also be read naqodh, "speckled" (<a onClick="return mV(\'Gen\',30,32);">Ge 30:32</a>), or niqqudh, "punctuation." It is also possible that these points may denote that the word is doubtful. They occur in the following places: <a onClick="return mV(\'Gen\',16,5);">Ge 16:5</a>; <a onClick="return mV(\'Gen\',18,9);">18:9</a>; <a onClick="return mV(\'Gen\',19,33);">19:33</a>; <a onClick="return mV(\'Gen\',33,4);">33:4</a>; <a onClick="return mV(\'Gen\',37,12);">37:12</a>; <a onClick="return mV(\'Num\',3,39);">Nu 3:39</a>; <a onClick="return mV(\'Num\',9,10);">9:10</a>; <a onClick="return mV(\'Num\',21,30);">21:30</a>; <a onClick="return mV(\'Num\',29,15);">29:15</a>; <a onClick="return mV(\'Deu\',29,28);">De 29:28 (29)</a>; <a onClick="return mV(\'Psa\',27,13);">Ps 27:13</a>; <a onClick="return mV(\'2Sa\',19,20);">2Sa 19:20</a>; <a onClick="return mV(\'Isa\',44,9);">Isa 44:9</a>; <a onClick="return mV(\'Eze\',41,20);">Eze 41:20</a>; <a onClick="return mV(\'Eze\',46,22);">46:22</a>. For conjectures as to the meanings of the points in each passage, the reader must be referred to the commentaries.<P>9. Their Antiquity:<P>These points are found even on synagogue rolls which have, with one exception, no other marks upon them, beyond the bare consonants and vowel-letters. Only those in the Pentateuch and Psalms are mentioned in the Talmud or Midrashim, and only one, <a onClick="return mV(\'Num\',9,10);">Nu 9:10</a>, in the Mishna before the end of the 2nd century, by which time its meaning had been lost. The lower limit, therefore, for their origin is the end of the 1st century AD. They have been, like most things not previously annexed by Moses, assigned to Ezra; but the Septuagint shows no sign of them. They, therefore, probably were inserted at the end of the 1st century BC, or in the 1st century AD. As four only occur in the Prophets and one in the Hagiographa, most care was evidently expended on the collation of the, Law. Blau thinks the reference originally extended to the whole verse or even farther, and became restricted to one or more letters.<P>10. The Inverted Nuns ("n"):<P>In <a onClick="return mV(\'Num\',10,35,36);">Nu 10:35 and 36</a> are enclosed within tw
