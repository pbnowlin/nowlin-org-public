o inverted nuns as if with brackets. In <a onClick="return mV(\'Psa\',107,\'1-\');">Ps 107</a> inverted nuns should stand before verses <a onClick="return mV(\'Psa\',107,\'23-28\',40);">23-28 and 40</A>, with a note in the foot margin. These nuns were originally dots (Siphre\' on Numbers) and stand for naqkudh, indicating that the verses so marked are in their wrong place (Septuagint <a onClick="return mV(\'Num\',10,\'34-36\');">Nu 10:34-36</a>).<P>11. Large and Small Letters:<P>Large letters were used as our capitals at the beginnings of books, etc. Thus there should be a capital nun at the beginning of the second part of Isaiah. But they serve other purposes also. The large waw (w) in <a onClick="return mV(\'Lev\',11,42);">Le 11:42</a> is the middle letter of the Torah; so in the Israelites\' Credo (<a onClick="return mV(\'Deu\',6,4);">De 6:4</a>). Other places are <a onClick="return mV(\'Deu\',32,4,6);">De 32:4,6</a>; <a onClick="return mV(\'Exd\',34,7,14);">Ex 34:7,14</a>; <a onClick="return mV(\'Lev\',11,30);">Le 11:30</a>; <a onClick="return mV(\'Lev\',13,33);">13:33</a>; <a onClick="return mV(\'Isa\',56,10);">Isa 56:10</a>, and often. Buxtorf\'s Tiberias gives 31 large and 32 small letters. Examples of the latter will be found in <a onClick="return mV(\'Gen\',2,4);">Ge 2:4</a>; <a onClick="return mV(\'Gen\',23,2);">23:2</a>; <a onClick="return mV(\'Lev\',1,1);">Le 1:1</a>; <a onClick="return mV(\'Job\',7,5);">Job 7:5</a>, etc. The explanations given are fanciful.<P>12. Suspended Letters and Divided Waw ("w"):<P>There are four letters suspended above the line in the Massoretic Text. They will be found in <a onClick="return mV(\'Jdg\',18,30);">Jud 18:30</a>; <a onClick="return mV(\'Job\',38,13,15);">Job 38:13,15</a>; <a onClick="return mV(\'Psa\',80,14);">Ps 80:14 (13)</a>. The last probably indicates the middle letter of the Psalter. The first points to Manasseh being put for Moses. The two in Job are doubtful. In <a onClick="return mV(\'Num\',25,12);">Nu 25:12</a> will be found a waw cut in two, perhaps to indicate that the covenant was in abeyance for a time.<P>13. Abbreviations:<P>Abbreviations are found on early Jewish inscriptions and on coins. Thus the letter shin stands for shanah = "year"; yodh sin = "Israel"; \'aleph = 1; beth = 2, etc. In the text used by the Septuagint the name Yahweh seem to have been indicated merely by a yodh, e.g. <a onClick="return mV(\'Psa\',31,7);">Ps 31:7</a> (6), "I hate" = Septuagint <a onClick="return mV(\'Psa\',30,7);">30:7</a>, "Thou hatest" (compare <a onClick="return mV(\'Psa\',5,5);"> 5:5</A>), and the yodh of the Hebrew = "O Yahweh." In <a onClick="return mV(\'Jdg\',19,18);">Jud 19:18</a> the Hebrew "house of Yahweh" = Septuagint "my house"; so <a onClick="return mV(\'Jer\',6,11);">Jer 6:11</a>; <a onClick="return mV(\'Jer\',25,37);">25:37</a>. A curious example will be found <a onClick="return mV(\'Jer\',3,19);">Jer 3:19</a>. The great corruption found in the numbers in the Old Testament is probably due to letters or ciphers being employed. For wrong numbers compare <a onClick="return mV(\'2Sa\',10,18);">2Sa 10:18</a>; <a onClick="return mV(\'2Sa\',24,13);">24:13</a>; <a onClick="return mV(\'1Ki\',4,26);">1Ki 4:26</a> with parallel passages; also compare <a onClick="return mV(\'Ezr\',2,\'1-\');">Ezr 2</a> with <a onClick="return mV(\'Neh\',7,\'1-\');">Ne 7</a>, etc. Possible examples of letters representing numbers are: <a onClick="return mV(\'Psa\',90,12);">Ps 90:12</a>, "so" = ken, and kaph plus nun = 20 plus 50 = 70; <a onClick="return mV(\'1Sa\',13,1);">1Sa 13:1</a>, ben shanah is perhaps for ben n shanah, "fifty years old"; in <a onClick="return mV(\'1Sa\',14,14);">1Sa 14:14</a>, an apparently redundant k is inserted after "twenty men"; k = 20.<P>14. Conclusion:<P>Such was the Hebrew text in the 1st Christian century. It was a Received Text obtained by collating manuscripts and rejecting variant readings. Henceforward there are no variant readings. But before that date there were, for the Greek and Samaritan often differ from the Hebrew. The Book of Jubilees (middle of 1st century) also varies. The fidelity of the scribes who drew up this text is proved by the many palpable errors which it contains.<P>VI. Alteration of Principal Documents.<P>1. Yahweh and Baal:<P>For various reasons the original documents were altered by the scribes, chiefly from motives of taste and religion. In the earliest literary period there was no objection to the use of the divine name Yahweh; later this was felt to be irreverent, and \'Elohim was put in its place; later still Yahweh was written, but not pronounced. Hence, is <a onClick="return mV(\'Psa\',1,\'1-\');">Psalms 1-41</a>, Yahweh occurs 272 times; \'Elohim is hardly used as a proper name; in <a onClick="return mV(\'Psa\',42,\'1-\');">Psalms 42-83</a> \'Elohim occurs 200 times, Yahweh, only 44 times; compare especially <a onClick="return mV(\'Psa\',14,\'1-\');">Ps 14</a> with <a onClick="return mV(\'Psa\',53,\'1-\');">53</A>; <a onClick="return mV(\'Psa\',40,\'14-18\');">40:14-18</a> with <a onClick="return mV(\'Psa\',70,\'1-\');">70</A>; <a onClick="return mV(\'Psa\',50,7);">50:7</a> with <a onClick="return mV(\'Exd\',20,2);">Ex 20:2</a>. Lastly in <a onClick="return mV(\'Psa\',90,\'1-\');">Psalms 90-150</a> Yahweh is again used, and \'Elohim as a proper name does not occur except in citations in <a onClick="return mV(\'Psa\',108,\'1-\');">108</A> and <a onClick="return mV(\'Psa\',144,9);">144:9</A>. Compare also <a onClick="return mV(\'2Ki\',22,19);">2Ki 22:19</a> with <a onClick="return mV(\'2Ch\',34,27);">2Ch 34:27</a>. A precisely parallel change is that of Baal into bosheth ("shame"). At first there was no objection to compounding names with Baal meaning Yahweh (<a onClick="return mV(\'Jdg\',6,32);">Jud 6:32</a>; <a onClick="return mV(\'Jdg\',8,35);">8:35</a>). Then objection was taken to it (<a onClick="return mV(\'Hsa\',2,16,18);">Ho 2:16 or 18</a>), and it was changed into Bosheth (<a onClick="return mV(\'Jer\',3,24);">Jer 3:24</a>; <a onClick="return mV(\'Hsa\',9,10);">Ho 9:10</a>); hence, Ishbosheth (<a onClick="return mV(\'2Sa\',2,\'1-\');">2Sa 2-4</a>), Mephibosheth (<a onClick="return mV(\'2Sa\',4,4);">2Sa 4:4</a>), Eliada (<a onClick="return mV(\'2Sa\',5,16);">2Sa 5:16</a>), Jerrubesheth (<a onClick="return mV(\'2Sa\',11,21);">2Sa 11:21</a>). Later still the objection lost force and the old form was restored, Eshbaal (<a onClick="return mV(\'1Ch\',8,33);">1Ch 8:33</a>, <a onClick="return mV(\'1Ch\',8,9);">9:39</a>), Merribaal (<a onClick="return mV(\'1Ch\',8,34);">1Ch 8:34</a>), Beeliada (<a onClick="return mV(\'1Ch\',14,7);">1Ch 14:7</a>; compare <a onClick="return mV(\'1Ch\',3,8);">3:8</A>). The Septuagint follows the Hebrew; it treats Baal as feminine, i.e. = Bosheth. So too Molech takes its vowels from Bosheth; it should be Melech.<P>2. Euphemistic Expressions:<P>Words have been changed from motives of taste, e.g. "bless" is put for "curse" or "blaspheme" (<a onClick="return mV(\'1Ki\',21,10);">1Ki 21:10</a>, Septuagint <a onClick="return mV(\'1Ki\',20,10);">20:10</a>; <a onClick="return mV(\'Job\',1,5);">Job 1:5</a>; <a onClick="return mV(\'Job\',2,5,9);">2:5,9</a>, where the word "Lord" follows immediately; otherwise <a onClick="return mV(\'Exd\',22,27);">Ex 22:27</a>, etc.). Sometimes "the enemies of" was inserted (e.g. <a onClick="return mV(\'2Sa\',12,14);">2Sa 12:14</a>). Another use for the latter expression is <a onClick="return mV(\'1Sa\',25,22);">1Sa 25:22</a>, where it is not in the Greek. Compare further, <a onClick="return mV(\'2Sa\',7,12,14);">2Sa 7:12,14</a>; <a onClick="return mV(\'2Sa\',24,1);">24:1</a>, with the parallel passages in Ch.<P>3. "Tiqqun Copherim":<P>In some 18 places the text was slightly altered by the correction (tiqqun) of the scribes, without any indication being inserted to show that it had been altered. The following are the passages: <a onClick="return mV(\'Gen\',18,22);">Ge 18:22</a>, which orginally ran "Yahweh stood before Abraham"; <a onClick="return mV(\'Num\',11,15);">Nu 11:15</a>; <a onClick="return mV(\'Num\',12,12);">12:12</a>; <a onClick="return mV(\'1Sa\',3,13);">1Sa 3:13</a>; <a onClick="return mV(\'2Sa\',16,12);">2Sa 16:12</a>; <a onClick="return mV(\'2Sa\',20,1);">20:1</a>: <a onClick="return mV(\'Eze\',8,17);">Eze 8:17</a>; <a onClick="return mV(\'Hab\',1,12);">Hab 1:12</a>; <a onClick="return mV(\'Mal\',1,13);">Mal 1:13</a>; <a onClick="return mV(\'Zec\',2,8);">Zec 2:8 (12)</a>; <a onClick="return mV(\'Jer\',2,11);">Jer 2:11</a>; <a onClick="return mV(\'Job\',7,20);">Job 7:20</a>; <a onClick="return mV(\'Hsa\',4,7);">Ho 4:7</a>; <a onClick="return mV(\'Job\',32,3);">Job 32:3</a>; <a onClick="return mV(\'Lam\',3,20);">La 3:20</a>; <a onClick="return mV(\'Psa\',106,20);">Ps 106:20</a>. The remaining two, to make 18, may be accounted for either by the third containing more than one correction, or by counting the parallels to the sixth. The Septuagint ignores the supposed original forms of the text, except in the case of <a onClick="return mV(\'1Sa\',3,13);">1Sa 3:13</a> and <a onClick="return mV(\'Job\',7,20);">Job 7:20</a>. The Syriac has the supposed original form of <a onClick="return mV(\'Num\',12,12);">Nu 12:12</a> and Ciphre of <a onClick="return mV(\'Num\',11,15);">Nu 11:15</a>, that is, it survived till the 2nd century AD. But the rest must have been corrected very early. Like the tiqqun is the \'ittur copherim, that is, the substraction or deletion of the conjunction "and" in five places, namely, <a onClick="return mV(\'Gen\',18,5);">Ge 18:5</a>; <a onClick="return mV(\'Gen\',24,55);">24:55</a>; <a onClick="return mV(\'Num\',31,2);">Nu 31:2</a> and <a onClick="return mV(\'Psa\',68,25);">Ps 68:25</a> (26) before the word "after"; and in <a onClick="return mV(\'Psa\',36,6);">Ps 36:6</a> (7) before "thy judgments."<P>VII. Scribal Errors in the Text.<P>The Hebrew text of the Old Testament in no way resembles a text of one of the classics which is obtained by collating many manuscripts and eliminating all errors as far as possible. It is to all intents and purposes a manuscript, and displays all the forms of error found in all manuscripts. These are the following, classifying them according to their source.<P>1. Misunderstanding:<P>Failure to understand the sense gives rise to wrong division into words, e.g. <a onClick="return mV(\'Amo\',6,12);">Am 6:12</a>, "with oxen" (plural) should probably be "with oxen (collective) the sea"; <a onClick="return mV(\'Jer\',15,10);">Jer 15:10</a>; <a onClick="return mV(\'Jer\',22,14);">22:14</a>; <a onClick="return mV(\'Psa\',73,4);">Ps 73:4</a> have found their way into the text, e.g. <a onClick="return mV(\'Psa\',40,8,9);">Ps 40:8,9</a>, "In a volume of a book it is written \'alay," referring to li in <a onClick="return mV(\'Psa\',40,7);">40:7</A>; <a onClick="return mV(\'2Sa\',1,18);">2Sa 1:18</a> (see Wellhausen).<P>2. Errors of the Eye:<P>Due to the eye are repetitions, transpositions, omissions, mistaking one letter for another, and so forth. Repetitions will be found: <a onClick="return mV(\'2Sa\',6,3,4);">2Sa 6:3,4 (Septuagint)</a>; <a onClick="return mV(\'1Ki\',15,6);">1Ki 15:6</a> (= <a onClick="return mV(\'1Ki\',14,30);">14:30</A>); <a onClick="return mV(\'Exd\',30,6);">Ex 30:6 (Septuagint)</a>; <a onClick="return mV(\'Lev\',20,10);">Le 20:10</a>; <a onClick="return mV(\'1Ch\',9,\'35-44\');">1Ch 9:35-44</a> = <a onClick="return mV(\'1Ch\',8,\'29-38\');">8:29-38</A>; <a onClick="return mV(\'Isa\',41,1);">Isa 41:1</a> (compare <a onClick="return mV(\'Isa\',40,31);">40:31</a>); <a onClick="return mV(\'Isa\',53,7);">53:7</A>; <a onClick="return mV(\'Psa\',35,15);">Ps 35:15</a>; <a onClick="return mV(\'Psa\',37,40);">37:40</a>, and very often. Omissions may be supplied from parallel passages or VSS, as <a onClick="return mV(\'1Ch\',8,\'29-31\');">1Ch 8:29-31</a> from <a onClick="return mV(\'1Ch\',9,\'35-37\');">1Ch 9:35-37</a>; compare <a onClick="return mV(\'1Ch\',9,41);">9:41</A>; <a onClick="return mV(\'Jos\',22,34);">Jos 22:34</a> (from Syriac); <a onClick="return mV(\'Jdg\',16,2);">Jud 16:2</a>; <a onClick="return mV(\'Gen\',4,8);">Ge 4:8</a> (Samaritan, Peshitta); <a onClick="return mV(\'Pro\',10,10);">Pr 10:10</a> Septuagint, Syriac); <a onClick="return mV(\'Pro\',11,16);">11:16</A> Septuagint, Syriac); <a onClick="return mV(\'2Sa\',17,3);">2Sa 17:3</a> (Septuagint). Transpositions of letters will be found (<a onClick="return mV(\'Jos\',6,13);">Jos 6:13</a>; <a onClick="return mV(\'Isa\',8,12);">Isa 8:12</a>; compare <a onClick="return mV(\'Isa\',8,13,14);">8:13,14</A>). Sometimes a letter slips from word into another, as in <a onClick="return mV(\'1Sa\',14,50,51);">1Sa 14:50,51</a>; <a onClick="return mV(\'Jer\',18,23);">Jer 18:23</a>; <a onClick="return mV(\'Psa\',139,20);">Ps 139:20</a>. Other examples are <a onClick="return mV(\'Jdg\',10,12);">Jud 10:12</a>, and many times. Words are transposed in <a onClick="return mV(\'Psa\',35,7);">Ps 35:7</a>; <a onClick="return mV(\'Psa\',95,7);">95:7</a>; <a onClick="return mV(\'1Ki\',6,17);">1Ki 6:17</a>, etc. Examples of transposition of verses will be found: <a onClick="return mV(\'Gen\',24,29);">Ge 24:29</a> follows <a onClick="return mV(\'Gen\',24,30);">24:30a</a>; <a onClick="return mV(\'Isa\',38,21,22);">Isa 38:21,22</a> follows <a onClick="return mV(\'Isa\',38,8);">38:8</a>; compare <a onClick="return mV(\'2Ki\',20,\'6-8\');">2Ki 20:6-8</a>; <a onClick="return mV(\'Isa\',40,19,20);">Isa 40:19,20</a> should go with <a onClick="return mV(\'Isa\',41,6);">41:6</a>ff. Most omissions and repetitions are due to homoeoteleuton or homoearchy. Similar letters are frequently mistaken for one another. Examples are: d and r (<a onClick="return mV(\'Psa\',110,3);">Ps 110:3</a>; <a onClick="return mV(\'2Sa\',22,11);">2Sa 22:11</a>; compare <a onClick="return mV(\'Psa\',18,11);">Ps 18:11</a>). Traditions mention 6 other places, as well as 154 in which waw and yodh are interchanged; other examples are: <a onClick="return mV(\'Jos\',9,4);">Jos 9:4</a>; <a onClick="return mV(\'Deu\',14,13);">De 14:13</a>; compare <a onClick="return mV(\'Lev\',11,14);">Le 11:14</a>; <a onClick="return mV(\'2Ch\',22,10);">2Ch 22:10</a>; compare <a onClick="return mV(\'2Ki\',11,1);">2Ki 11:1</a>.<P>3. Errors of the Ear:<P>Errors du to the ear would arise when one scribe was dictating to another. Such are: lo\' = "not," for lo = "to him," in 15 places (<a onClick="return mV(\'Psa\',100,3);">Ps 100:3</a>, etc.). Also Yahweh and Adonai would be sounded alike. Again we have Adoram in <a onClick="return mV(\'1Ki\',12,18);">1Ki 12:18</a> and Hadoram in <a onClick="return mV(\'2Ch\',10,18);">2Ch 10:18</a>.<P>4. Errors of Memory:<P>Failure of memory in copying would explain the occurrence of synonymous words in parallel passages without any apparent motive, as for "I call" in <a onClick="return mV(\'2Sa\',22,7);">2Sa 22:7</a> and <a onClick="return mV(\'Psa\',18,7);">Ps 18:7</a>, and the interchange of Yahweh and Adonai. In <a onClick="return mV(\'Jer\',27,1);">Jer 27:1</a> Jehoiakim should be Zedekiah.<P>5. Errors of Carelessness and Ignorance:<P>Many of the scribal errors in the Massoretic Text are due to carelessness and ignorance: in <a onClick="return mV(\'Gen\',36,2);">Ge 36:2</a>, the last "daughter" should be "son"; <a onClick="return mV(\'Num\',26,8);">Nu 26:8</a>, "son" for son, a common error; compare <a onClick="return mV(\'1Ch\',3,22);">1Ch 3:22</a>; <a onClick="return mV(\'1Ch\',6,13);">1Ch 6:13 (28)</a>, Vashni means "and the second" (wehasheni); compare <a onClick="return mV(\'1Sa\',8,2);">1Sa 8:2</a>; also in <a onClick="return mV(\'1Sa\',13,1);">1Sa 13:1</a> (compare above V, 13), where a number has dropped out, as also perhaps <a onClick="return mV(\'Isa\',21,16);">Isa 21:16</a>, and <a onClick="return mV(\'2Sa\',3,7);">2Sa 3:7</a>, where Ishbosheth has fallen like Mephibosheth. In <a onClick="return mV(\'2Sa\',23,18,19);">2Sa 23:18,19</a> the first "three" should be "thirty." Compare also <a onClick="return mV(\'Gen\',3,10);">Ge 3:10</a> (Syr); <a onClick="return mV(\'2Ch\',22,6);">2Ch 22:6</a>; <a onClick="return mV(\'Eze\',43,13);">Eze 43:13</a>, and often. The Books of Sirach seem to be the most carelessly copied of all the Old Testament books, though the text of Ezekiel is in some respects more unintelligible. In Jeremiah, the Septuagint is shorter by one-eighth than the Hebrew, but it is doubtful which is original.<P>VIII. History of the Text.<P>The consonantal text of the Old Testament was what it now is by the 1st or at latest the 2nd Christian century. During the next four centuries it was minutely studied, the number of its words and even of its letters being counted. The results of this study are found chiefly in the Talmud. All such study was oral. During this period the text remained a purely consonantal text plus the puncta extraordinaria.<P>1. Changes Made in Reading:<P>The text was not always read, however, exactly as it was written. Soon after the return from Babylon changes were made. Perhaps the earliest was that the proper name Yahweh was read Adonai, whence the Septuagint, and through it the New Testament "Lord." The reason will be found in <a onClick="return mV(\'Lev\',24,11);">Le 24:11</a>, where render "pronounced the name." Sometimes the change was due to motives of taste (<a onClick="return mV(\'Deu\',28,30);">De 28:30</a>; <a onClick="return mV(\'1Sa\',6,11);">1Sa 6:11</a>; <a onClick="return mV(\'2Ki\',18,27);">2Ki 18:27</a>); but the commonest ground was grammar or logic. Thus a word was frequently read which was not in the text at all (<a onClick="return mV(\'Jdg\',20,13);">Jud 20:13</a>; <a onClick="return mV(\'2Sa\',18,20);">2Sa 18:20</a>); or a word was omitted in reading (<a onClick="return mV(\'2Sa\',15,21);">2Sa 15:21</a>; <a onClick="return mV(\'2Ki\',5,18);">2Ki 5:18</a>); or the letters of a word were transposed, as in <a onClick="return mV(\'Jos\',6,13);">Jos 6:13</a>; or one letter was put for another, especially waw for yodh or yodh for waw; or words were divided in reading otherwise than in the text (see above V, 1). The written text is called the Kethibh ("written"); what was read is called the Qere ("read").<P>2. Preservation of Text:<P>The scribes during these centuries, besides fixing the reading, took means to preserve the text by counting the words and letters, and finding the middle verse (<a onClick="return mV(\'Jdg\',10,8);">Jud 10:8</a>; <a onClick="return mV(\'Isa\',33,21);">Isa 33:21</a>), and so forth. The middle verse of the Law is <a onClick="return mV(\'Lev\',8,7);">Le 8:7</a>, and the middle of the words falls in <a onClick="return mV(\'Lev\',10,16);">10:16</A>. The middle verse of the Hebrew Bible is <a onClick="return mV(\'Jer\',6,7);">Jer 6:7</a>. Note was made of words written abnormally (<a onClick="return mV(\'Hsa\',10,14);">Ho 10:14</a>; <a onClick="return mV(\'Mic\',1,15);">Mic 1:15</a>; <a onClick="return mV(\'Isa\',3,8);">Isa 3:8</a>) and lists were made up. All such lists were retained in the mind; nothing was written.<P>3. Division into Verses:<P>When the public reading of the Law was accompanied by an Aramaic translation (<a onClick="return mV(\'Neh\',8,8);">Ne 8:8</a>), the division of the text into verses would arise spontaneously. The Mishna gives rules for the number of verses to be read at a time before translating. These verses were separated by a space only, as the words were. Hence, versions frequently divide differently for the Hebrew, as <a onClick="return mV(\'Hsa\',4,11);">Ho 4:11</a>; <a onClick="return mV(\'Isa\',1,12);">Isa 1:12</a>. In the Hebrew itself there are 28 old verse divisions no longer observed (see Baer on <a onClick="return mV(\'Hsa\',1,2);">Ho 1:2</a>). The space is called picqa\' and the verse pacuq.<P>4. Sections of the Law:<P>About the same time the Law was divided into sections (parashah) for the annual reading. In Palestine the Law was read through once in 3 1/2 years; in Babylon once a year. Hence, the Law is divided into 54 sections (<a onClick="return mV(\'Gen\',6,9);">Ge 6:9</a>; <a onClick="return mV(\'Gen\',12,1);">12:1</a>, etc.) for the annual reading. It is also divided into 379 "shut" sections, indicated by a space in the middle of a line, and 290 "open" sections, indicated by a space at the end of a line. In printed texts these sections are noted by the letters c and p, but, if they coincide with one of the 54, by ccc or ppp. The Palestinian division was into 154 cedharim.<P>5. Sections of the Prophets:<P>From Maccabean times 54 passages (haphtaroth) were selected from the Prophets for the purposes of the synagogue (<a onClick="return mV(\'Luk\',4,17);">Lu 4:17</a>). The Prophets were also divided into smaller sections. As in the case of the Law (<a onClick="return mV(\'Exd\',6,28);">Ex 6:28</a>), there are cases of false division (<a onClick="return mV(\'Isa\',56,9);">Isa 56:9</a>; <a onClick="return mV(\'Hag\',1,15);">Hag 1:15</a>).<P>6. Poetical Passages:<P>In the Hebrew Bible certain passages were early written in a peculiar way to resemble the bricks in the wall of a house, either in three columns, a half-brick upon a brick and a brick upon a half-brick (<a onClick="return mV(\'Exd\',15,\'1-\');">Ex 15</a>; <a onClick="return mV(\'Jdg\',5,\'1-\');">Jud 5</a>; <a onClick="return mV(\'2Sa\',22,\'1-\');">2Sa 22</a>), or in two columns, a half-brick upon a half-brick and a brick upon a brick (<a onClick="return mV(\'Deu\',32,\'1-\');">De 32</a>; <a onClick="return mV(\'Jos\',12,\'1-\');">Jos 12</a>; <a onClick="return mV(\'Est\',9,\'1-\');">Es 9</a>). In the Septuagint, Psalms, Proverbs, Ecclesiates, Canticles, Job are written in stichs; but that this was not done in Hebrew seems proved by the variations as to the number of lines (<a onClick="return mV(\'Psa\',65,8);">Ps 65:8</a>; <a onClick="return mV(\'Psa\',90,2,11);">90:2,11</a>).<P>7. Division into Books:<P>The number of books <span class="noTag">is</span> 24, Samuel, Kings, Chronicles each counting as one, Ezra including Nehemiah, the twelve Minor Prophets counting one book (<a onClick="return mV(\'Mic\',3,12);">Mic 3:12</a> is the middle). The Law counts 5 books, Psalms one, though the division of it into 5 books is ancient (compare <a onClick="return mV(\'Psa\',106,48);">Ps 106:48</a> with <a onClick="return mV(\'1Ch\',16,35,36);">1Ch 16:35,36</a>). By joining Ruth to Judges and Lamentations to Jeremiah, the <span class="noTag">number 22</span> was obtained—the number of letters in the Hebrew alphabet. When, probably about the 3rd century AD, leather rolls gave place to parchment books, it would be possible to have the whole Bible in one volume and the question of the order of the books would arise. The order in the Talmud is as follows: The Law (5), the Prophets (8), Joshua, Judges, Samuel, Kings, Jeremiah, Ezekiel, Isaiah, and the XII, the Hagiographa or Kethubhim (11), Ruth, Psalms, Job, Proverbs, Ecclesiates, Canticles, Lamentation, Daniel, Esther, Ezra, Chronicles. The Prophets are usually subdivided into Former: Joshua, Judges, Samuel, Kings; and Latter: Jeremiah, Ezekiel, Isaiah and the XII. The traditional or "Masoretic" order places Isaiah before Jeremiah, and in the Hagiographa the order is: Chronicles, Psalms, Job, Proverbs, Ruth, Canticles, Ecclesiates, Lamentations, Esther, Daniel, Ezra, the middle verse being <a onClick="return mV(\'Psa\',130,3);">Ps 130:3</a>. The order found in printed texts is that of German manuscripts. The books receive their names from a word near the beginning, from their contents, or from their supposed author.<P>IX. Vocalization of the Text.<P>About the time of the Reformation it was the universal belief that the vowel-marks and other points were of equal antiquity with the consonants. The Jews believed Moses received them orally and Ezra reduced them to writing.<P>1. Antiquity of the Points:<P>The first to assign a late date to the points was Elias Levita (1468-1549). The battle was fought out in the 17th century. Ludovicus Cappellus (died 1658) argued for a date about 600 AD. The Buxtorfs defended the old view. The following are the facts.<P>2. Probable Date of Invention:<P>When the Septuagint was made, the Hebrew text had not even as many vowel-letters as it has now, and still less points; nor when the Syriac version was made in the 2nd century, or Jerome\'s Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) between 393-405, or the earlier Targums. Lastly, the points were unknown to the Talmud. They, therefore, did not exist before 600 AD. The earliest authority on the points is Aaron ben Asher of the school of Tiberias (died about 989). He wrote a copy of the Hebrew Bible with all the points, which became the standard codex. The probable date is, therefore, taken to be about the year 700; and this agrees with what was taking place in regard to Greek, Syriac and Arabic manuscripts. The Jews probably borrowed from the Syrians.<P>3. Various Systems and Recensions:<P>No doubt, at first, many systems of pointing existed. Of these, two survived, the Palestinian and Babylonian, or superlinear. The chief features of the latter are that the signs are placed above the line; it has no sign for "e" (ceghol), and has but one system of accents. The Palestinian, the one familiar to us, exists in two recensions, those of Ben Asher and of his contemporary, Ben Naphtali of Babylon; hence, a Western and an Eastern.<P>X. The Palestinian System.<P>Since the vocalization of the text took place about 700 AD, it will be understood that it differs considerably from the living language. What that was may be found from the transliteration of proper names in the Septuagint, in Origen and Jerome, and from a comparison with modern Arabic.<P>1. The Consonants:<P>A comparison with Arabic indicates that the Hebrew letter cheth (ch), and it is certain from the Septuagint that the Hebrew letter \'ayin (\'), had each two distinct sounds. This difference is not shown in the pointing, though a point was used to distinguish the two sounds of "b", "g", "d", "k", "p", "t", and of "s", and "sh" and the two values of "h". The absence of this point is indicated by rapheh. The same point marks the doubling of a consonant. The gutturals and "r" are not doubled, though they certainly were when the language was spoken (compare <a onClick="return mV(\'Gen\',43,26);">Ge 43:26</a>; <a onClick="return mV(\'Eze\',16,4);">Eze 16:4</a>, etc.).<P>2. The Vowels:<P>The system of vowel-marks attempts to reproduce the sounds exactly. Thus the short a-sound which must precede a guttural letter is indicated, and before a guttural "i" and "u" are replaced by "e" and "o". On the other hand, "y" before "i" does not seem to have been sounded in some cases. Thus the Septuagint has Israel, but Ieremias. Shewa\' is said by Ben Asher to sound "i" before "y"; before a guttural it took the sound of the guttural\'s vowel, as mo\'odh (me\'odh), and had other values as well.<P>3. The Accents:<P>There is a special accentual system for the poetical books, Proverbs, Psalms, and Job (except the prose parts). The titles and such marks as celah are in the Psalms accented as forming part of the verse. The accents had three values, musical, interpunctional, and strictly accentual. But these values have to do with the language, not as it was spoken, but as it was chanted in the public reading of the synagogue.<P>4. Anomalous Pointings:<P>The words were not always pointed in the usual way, but sometimes according to subjective considerations. Thus the phrase "to see the face of God" is pointed "to appear before God," on account of <a onClick="return mV(\'Exd\',33,20);">Ex 33:20</a> (<a onClick="return mV(\'Psa\',42,3);">Ps 42:3</a>; <a onClick="return mV(\'Isa\',1,12);">Isa 1:12</a>). Similarly in <a onClick="return mV(\'Ecc\',3,21);">Ec 3:21</a>, "which goeth upward" is put for "whether it goeth upward." See also <a onClick="return mV(\'Jer\',34,18);">Jer 34:18</a>; <a onClick="return mV(\'Isa\',7,11);">Isa 7:11</a>. Frequently the punctuation is inconsistent with itself. Thus, \'gathered to his peoples\' (<a onClick="return mV(\'Gen\',35,29);">Ge 35:29</a>), but "gathered to my people" (singular, <a onClick="return mV(\'Gen\',49,29);">Ge 49:29</a>). So pelishtim, "Philistines," receives the article with prepositions, otherwise not. In many places two pointings are mixed, as if to give a choice of readings (<a onClick="return mV(\'Psa\',62,4);">Ps 62:4</a>; <a onClick="return mV(\'Psa\',68,3);">68:3</a>, and often).<P>XI. The Masorah.<P>1. Meaning of the Term:<P>The Hebrew text as printed with all the points and accents is called the Masoretic text. Masorah, or better, Maccoreth, is derived from a root meaning "to hand down" (<a onClick="return mV(\'Num\',31,5);">Nu 31:5</a>). This tradition began early. Rabbi Akiba (died 135) called it a "hedge about the Law." It tells the number of times a particular expression occurs, and mentions synonymous expressions, and so forth. The remarks placed in the side margin of the codex, often merely a letter denoting the number of times the word occurs, are called the Masorah parva. The notes were afterward expanded and placed in the top and bottom margins and called the Masorah magna. Notes too long for insertion in the margin were placed sometimes at the beginning, generally at the end of the codex, and called the Masorah finalis. The Masorah differs with different manuscripts; and there is an Eastern and a Western Masorah.<P>2. The "Qere" and "Kethibh":<P>The oldest and most important part of the Masorah lies in the readings which differ from the written text, called Qere. These may represent, variant readings of manuscripts, especially of them called cebhir. The most are mere errata and corrigenda of the text. Such are the four Q. perpetua, \'adhonay (for YHWH), Jerusalem, Issachar and hu\', in the case of which the read form is not appended at the foot of the page. Sometimes the emendation is right, as in <a onClick="return mV(\'Amo\',8,8);">Am 8:8</a>; compare <a onClick="return mV(\'Amo\',9,5);">9:5</A>; sometimes the Kethibh represents an archaic form (<a onClick="return mV(\'Jdg\',9,8,12);">Jud 9:8,12</a>; <a onClick="return mV(\'Isa\',32,11);">Isa 32:11</a>).<P>A Qere was inserted at <a onClick="return mV(\'1Sa\',17,34);">1Sa 17:34</a> to correct a misprint in the Venice Bible of 1521.<P>3. Other Features:<P>Other notes at the foot of the page draw attention to redundant or defective writing. Directions for the arrangement of the text are in <a onClick="return mV(\'Gen\',49,8);">Ge 49:8</a>; <a onClick="return mV(\'Deu\',31,28);">De 31:28</a>, and elsewhere. Each book concludes with a note giving the number of verses, sections, middle verse and other particulars about the book. The second last verses of Isaiah, Malalachi, Lamentations, Ecclesiastes are repeated after the last, which is ill-omened.<P>XII. Manuscripts and Printed Texts.<P>1. Manuscripts:<P>The manuscripts of the Hebrew Bible are not nearly so old as those of the Greek, old Hebrew manuscripts being generally destroyed. By far the oldest manuscript of any part of the Bible is the Papyrus Nash of about 150 AD, containing the Decalogue and Shema\' (<a onClick="return mV(\'Deu\',6,4);">De 6:4</a>). Next comes the Petersburg codex of the latter Prophets of 916 AD, though Ginsburg considers a manuscript of the Pentateuch (British Museum Orient. 4445) older. The pointing of the latter is Palestinian; of the former, supper-linear. The oldest manuscript of the whole Old Testament is dated 1010 AD.<P>2. Early Printed Texts:<P>The following are the chief printed texts: The Psalter of 1477, place unknown, with commentary of Kimchi. The first few psalms are voweled; the Pentateuch,1482,Bologna, with Rashi and Targum Onkelos; perhaps the Five Rolls appeared at the same time; the Prophets, unpointed, 1485-86, at Soncino, with Rashi and Kimchi; the Hagiographa, 1486-87, at Naples, with points, but not accents, and commentaries (In the last two YHWH and \'Elohim are spelled YHDH and \'Elodhim); the 2nd edition of the Pentateuch at Faro in Portugal,1487,first without commentary; the editio princeps of the whole Old Testament with points and accents, but no commentary, finished at Soncino, February 14,1488,reprinted in 1491-93, and in the Brescia Bible of 1494. The last was the one used by Luther. Owing to persecution, the next edition was not till 1511-1517.<P>3. Later Editions:<P>The first Christian edition of the Hebrew text is that contained in the Complutensian Polyglot, finished July 10, 1517. It has many peculiarities, and first discarded the Masoretic sections for the Christian chapters, the Vulgate (Jerome\'s Latin Bible, 390-405 A.D.) being followed. The first rabbinic Bible—that is, pointed and accented text, with Masorah, Targums, and commentaries—was printed by Daniel Bomberg at Venice in 1516-17. The division of Samuel, Kings, Chronicles, and Ezra into two books each is first marked here in a purely Hebrew text, and the consonants of the Qere first given in the margin. Previously the vowels were inserted in the text only. Thus in <a onClick="return mV(\'Isa\',44,14);">Isa 44:14</a>, Luther did not observe the small nun, taking it for a zayin. What is called, however, the editio princeps of the rabbihic Bible is Bomberg\'s second edition, edition by Jacob ben Chayyim (1524-25). This forms the standard edition of the Massoretic Text. Samuel and Kings are each treated as two books. Cebhirim are noticed for the first time, and the Qeres marked with q. The Polyglot of Arias Montanus (1567-71) used the dilatable letters\', "h", "l", "t", "m", broadened to fill up lines, and first numbered the chapters (in Hebrew letters). Buxtorf\'s rabbinic Bible appeared in 1618-19; the Paris Polyglot in 1629-44; the London Polyglot of Walton in 1654-57, which first gives the Ethiopic and Persian VSS; that of Athias in 1661, which first inserted the numbers of Christian chapters in the clauses at the end of the books of the Law, the Mantua edition of 1744 inserting them for all the books. In the last is embodied the Masoretic commentary of Solomon de Norzi (1626). Recent editors are Baer and Ginsburg. Special mention must be made of the edition of Kittel which inserts the variant readings of the versions at the foot of the page.<P>4. Chapters and Verses:<P>In modern editions of the Hebrew text the numbers of the Christian chapters are inserted. The chapters had their origin in the Vulgate, and are variously ascribed to Lanfranc (died 1089), Stephen Langton (died 1228), but with most probability to Hugo de Sancto Care (13th century). They mostly coincide with the Masoretic sections, and came in with the Polyglots from 1517 on, being used first in a purely Hebrew text in 1573-1574. Some modern editions mark the verses in the margin, the 5\'s in Hebrew letters, except 15, which is denoted by "Tw" = 9 plus 6, instead of "yh" = 10 plus 5, because the latter would = Yah. After the Clausula Masoretica at the end of Chronicles and elsewhere, there is an extended note taken from <a onClick="return mV(\'1Ch\',19,13);">1Ch 19:13</a> (<a onClick="return mV(\'2Sa\',10,12);">2Sa 10:12</a>).<P>LITERATURE.<P>Benzinger, Hebraische Archaologie, Leipzig, 1894; Berger, Histoire de l\'ecriture dans l\'antiquite, Paris, 1892; Blau, Masoretische Untersuchungen, Strassburg, 1891; Einleitung in die heilige Schrift, Budapest, 1894; Studien zum althebraischen Buchwesen, Pt. I, Strassburg, 1902; Buhl, Canon and Text (English translation by J. Macpherson), Edinburgh, 1892; Butin, The Ten Nequdoth of the Torah, Baltimore, 1906; Buxtorf (father), Tiberias side Commentarius Masorethicus, Basel, 1620; Buxtorf (son), Tractatus de Punctorum Origins, etc., Basel, 1648; Cappellus, Arcanum Punctationis Revelatum, Leyden, 1624; Chwolson, Corpus Inscriptionum Hebraicarum, Petersburg, 1882; Driver, Notes on the Hebrew Text of Samuel, Oxford, 1913; Edersheim, History of the Jewish Nation, London, 1896; Etheridge, Jerusalem and Tiberias ("Post-Biblical Hebrew Literature"), London, 1856; Frankel, Ueber palastinische und alexandrinische Schriftforschung, Breslau, 1854; Geden, The Massoretic Notes Contained in the Edition of the Hebrew Scriptures, Published by the British and Foreign Bible Society, London, 1905; Geiger, Urschrift und Uebersetzungen der Bibel, Breslau, 1857; Ginsburg, Introduction to the...Hebrew Bible, London, 1897; The Massorah, London, 1880-85; Kennedy, The Note-Line in the Hebrew Scriptures, Edinburgh, 1903; Kenyon, Our Bible and the Ancient manuscripts, London, 1898; King, The Psalms in Three Collections (on the triennial cycle), Cambridge, 1898; Konig, Einleitung in das Altes Testament, Bonn, 1893; Loisy, Histoire critique du texts et des versions de la Bible, Paris, 1892-95; Nowack, Lehrbuch der hebraischen Archaologie, Freiburg and Leipzig, 1894; De Rouge, Memoire sur l\'origine egyptienne de l\'alphabet phenicien, Paris, 1874; Schurer, Geschichte des judischen Volkes im Zeitalter Jesu Christi (English translation by John Macpherson and others), Edinburgh, 1890; Schwab, Jerusalem Talmud (French translation), Paris, 1871-90; Strack, Prolegomena Critica in Vetus Testamentum Hebraicum, Leipzig, 1873; Einleitung in den Talmud, Lelpzig, 1894; Taylor, The Alphabet, London, 1883; T.H. Weir, A Short History of the Hebrew Text of the Old Testament, London, 1907; Winckler, Die Thontafeln yon Tell-el-Amarna, Berlin, 1896; The Tell-el-Amarna Letters, Berlin, London and New York, 1896; Wolf, Bibliotheca Hebraea, Hamburg and Leipzig, 1715-33; Wunsche, Bibliotheca Rabbinica, Leipzig, 1880.<P>Encyclopaedias:<P>Cheyne and Black, EB, London, 1899-1903; Fairbairn, Imperial Bible Dict., London, 1866 ("OT," "Scriptures," "Writing," by D. H. Weir); HDB, Edinburgh, 1898-1904 ("Text of the Old Testament," by H. L. Strack); Herzog, RE, Leipzig, 1896ff; Jewish Encyclopedia, New York and London, 1901-6; Vigoureux, Dictionnaire de la Bible, Paris, 1891ff.<P>Hebrew texts:<P>Dikduke ha Te\'amim des Ahron...ben Asher, edition by Baer and Strack, Leipzig, 1879; Massoreth ha-Massoreth of Elias Levita, with English translation and notes by C.D. Ginsburg, London, 1867; Midrash hag-Gadol: Genesis, edition by S. Schechter, Cambridge, 1902; Das Buch, Ochla Weochla, edition by Frensdorff, Hanover, 1864; Mishna, With Latin translation, by Guil. Surenhusius, Amsterdam, 1698-1703; Sifra, edition by Jacob Schlossberg, Vienna, 1862; Sifre, edition by M. Friedmann (first part), Vienna, 1864; Soferim, edition by Joe Muller, Vienna, 1878; Babylonian Talmud, edition (With German translation) by Lazarus Goldschmidt, Berlin, 1896—.<P>Periodicals:<P>Academy, XXXI, 454 "The Moabite Stone"; Good Words,1870,673, "The Moabite Stone," by D. H. Weir; Jewish Quarterly Review: Dr. A. Buchler on "The Triennial Cycle," V,420,VI, 1; "E. G. King on the Influence of the Triennial Cycle upon the Psalter," by I. Abrahams, April, 1904; "Neue Masoretische Studien," by Blau, January, 1904; "On the Decalogue Papyrus," by F. C. Burkitt, April, 1903; Journal of Theological Studies, V,203,"The Influence of the Triennial Cycle upon the Psalter," by E. G., King; PEF: "Heb Mosaic Inscription at Kerr Kenna," by Clermont-Ganneau, October, 1901; "On the Siloam Inscription," 1881, 198; "On the Excavations at Taanach and Megiddo," 1904,180,1905, 78; Proceedings of the Society of Biblical Archaeology: E. J. Pilcher, "On the Date of the Siloam Inscription," XIX,165,XX, 213; "On the Decalogue Papyrus," by S. A. Cook, January, 1903 "Hebrew Illuminated manuscripts of the Bible of the 11th and 12th Centuries," by M. Caster, XXII, 226; Scottish Review, IX,215,"The Apocryphal Character of the Moabite Stone," by Albert Lowy; Studia Biblica et Ecclesiastica, III,1,"The Introduction of the Square Characters in Biblical Manuscripts, and an Account of the Earliest Manuscripts of the Old Testament, with a Table of Alphabets and Facsimiles," by Ad. Neubauer; Mittheilungen und Nachrichten des deutschen Palaestina-Vereins: "On the Excavations at Taanach," by Sellin,1902,13,17,33, 1903,1,and 1905, <span class="noTag">number 3</span>; "On the Excavations at Tell el Mutesellim," by Schumacher, 1904, 14, 33, and 1906, <span class="noTag">number 3</span>; and by Benzinger,1904,65; Zeitschrift des deutschen Palaestina-Vereins: "On the Siloam Inscription," by Socin, XXII, 61; Zeitschrift der deutschen morgenlandischen Gesellschaft: "Zur Geschichte der hebraischen Accents," by P. Kahle,1901,167.``189';
isbe[8710]='Thaddaeus`tha-de\'-us (Thaddaios): One of the Twelve Apostles (<a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>). In <a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a> the King James Version, the reading is "Lebbaeus, whose surname was Thaddaeus." The name corresponds to Judas, the son (Revised Version), or brother (the King James Version), of James, given in the lists of <a onClick="return mV(\'Luk\',6,16);">Lu 6:16</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>.<P>See <a href="./study/isbe/search.html?string=JUDAS,+NOT+ISCARIOT">JUDAS, NOT ISCARIOT</A>; <a href="./study/isbe/search.html?string=LEBBAEUS">LEBBAEUS</A>.<P>The "Gospel of the Ebionites," or "Gospel of the Twelve Apostles," of the 2nd century and mentioned by Origen, narrates that Thaddaeus was also among those who received their call to follow Jesus at the Sea of Tiberias (compare <a onClick="return mV(\'Mat\',4,\'18-22\');">Mt 4:18-22</a>).<P>See also <a href="./study/isbe/search.html?string=SIMON+THE+CANANAEAN">SIMON THE CANANAEAN</A>.<P>According to the "Genealogies of the Twelve Apostles" (compare Budge, Contendings of the Apostles, II, 50), Thaddaeus was of the house of Joseph; according to the "Book of the Bee" he was of the tribe of Judah. There is abundant testimony in apocryphal literature of the missionary activity of a certain Thaddaeus in Syria, but doubt exists as to whether this was the apostle. Thus<P>(1) according to the "Ac of Peter" (compare Budge, II, 466ff) Peter appointed Thaddaeus over the island of Syria and Edessa.<P>(2) The "Preaching of the blessed Judas, the brother of our Lord, who was surnamed Thaddaeus" (Budge, 357ff), describes his mission in Syria and in Dacia, and indicates him as one of the Twelve.<P>(3) The "Acta Thaddaei" (compare Tischendorf, Acta Apostolorum Apocrypha,1851,261ff) refers to this Thaddaeus in the text as one of the Twelve, but in the heading as one of the Seventy.<P>(4) The Abgar legend, dealing with a supposed correspondence between Abgar, king of Syria, and Christ, states in its Syriac form, as translated by Eusebius (Historia Ecclesiastica, I, xiii, 6-22) (compare <a href="./study/isbe/search.html?string=THOMAS">THOMAS</A>), that "after the ascension of Christ, Judas, who was also called Thomas, sent to Abgar the apostle Thaddaeus, one of the Seventy" (compare Hennecke, Neutestamentliche Apokryphen, 76ff).<P>Jerome, however, identifies this same Thaddaeus with Lebbaeus and "Judas...of James" of Luke (<a onClick="return mV(\'Luk\',6,16);">Lu 6:16</a>). Hennecks (op. cit., 473, 474) surmises that in the original form of the Abgar legend Thomas was the central figure, but that through the influence of the later "Acts of Thomas", which required room to be made for Thomas\' activity in India, a later Syriac recension was made, in which Thomas became merely the sender of Thaddaeus to Edessa, and that this was the form which Eusebius made use of in his translation According to Phillips (compare Phillips, The Doctrine of Addai the Apostle), who quotes Zahn in support, the confusion may be due to the substitution of the Greek name Thaddaeus for the name Addai of the Syriac manuscripts.<P>See <a href="./study/isbe/search.html?string=APOCRYPHAL+ACTS">APOCRYPHAL ACTS</A>.<P>The general consensus seems to indicate, however, that both Thomas and Thaddaeus the apostle had some connection with Edessa. Of the various identifications of Thaddaeus with other Biblical personages which might be inferred from the foregoing, that with "Judas...of James" is the only one that has received wide acceptance.<P>The burial place of Thaddaeus is variously placed at Beirut and in Egypt. A "Gospel of Thaddaeus" is mentioned in the Decree of Gelasius.``88';

isbe[8717]='Thank; Thanks; Thanksgiving`thank, thanks, thanks-giv\'-ing, thanks\'-giv-ing: Both the verb and the nouns appear almost uniformly for yadhah, and eucharisteo, and their cognates. Eucharisteo is the usual Greek verb for "to thank," but yadhah takes on this force only through its context and is rather a synonym for "<a href="./study/isbe/search.html?string=RAISE">raise</a>" or "<a href="./study/isbe/search.html?string=BLESS">bless</a>" (which see) Septuagint renders yadhah usually by exomologeo, "speak forth together" "praise" (compare Tobit 12:20; Sirach 39:6, etc., and the use of "thank" in English Versions of the Bible to correspond), and this verb reappears in <a onClick="return mV(\'Mat\',11,25);">Mt 11:25</a> parellel <a onClick="return mV(\'Luk\',10,21);">Lu 10:21</a>, with English "thank" (the Revised Version margin "praise"). Compare the use of anthomologeomai (<a onClick="return mV(\'Luk\',2,38);">Lu 2:38</a>) and homologeo (<a onClick="return mV(\'Hbr\',13,15);">Heb 13:15</a>, the King James Version "giving thanks," the Revised Version (British and American) "make confession"; the King James Version is preferable). For charis in the sense of "thanks" (note the singular "thank" in the King James Version Sirach 20:16; <a onClick="return mV(\'Luk\',6,\'32-34\');">Lu 6:32-34</a>), see <a href="./study/isbe/search.html?string=GRACE">GRACE</A>. <a onClick="return mV(\'1Pe\',2,19);">1Pe 2:19</a> the King James Version has "thankworthy" for charis, the Revised Version (British and American) "acceptable," the Revised Version margin "grace."``48';

isbe[8719]='Tharra`thar\'-a (Tharra): One of the two eunuchs, "keepers of the court," who with his companion Gabatha (Bigthan) formed a conspiracy against King Artaxerxes which was detected by Mordecai (Additions to Esther 12:1 = "Teresh" of <a onClick="return mV(\'Est\',2,21);">Es 2:21</a>; <a onClick="return mV(\'Est\',6,2);">6:2</a>). Tharra and his companion were hanged. Josephus (BJ, II, vi, 4) calls him "Theodestes."``1';

isbe[8725]='Thebez`the\'-bez (tebhets, "\'brightness"; Codex Vaticanus Thebes; Codex Alexandrinus Thaibais): A city in Mt. Ephraim which refused submission to Abimelech when he set up as king of Israel. After the reduction of Shechem he turned his arms against Thebez. There was a strong tower within the city—the citadel—into which all the inhabitants gathered for safety, climbing onto the roof of the tower. Abimelech incautiously venturing near the tower, a woman cast an upper millstone upon his head and broke his skull. Fearing the shame of perishing by the hand of a woman, he persuaded his armor-bearer to thrust him through (<a onClick="return mV(\'Jdg\',9,50);">Jud 9:50</a>). The incident is alluded to in <a onClick="return mV(\'2Sa\',11,21);">2Sa 11:21</a>. Eusebius, Onomasticon places it 13 Roman miles from Neapolis (Nablus) on the road to Scythopolis (Beisan). There is no doubt that it is represented by Tubas. This is a village situated in a district of considerable fertility, about 10 miles from Nablus. There are many olive trees. The rain is captured and led to rockcut cisterns, whence the village draws its water-supply. According to the Samaritans the tomb of Neby Toba marks the grave of the patriarch Asher.``54';

isbe[8732]='Theocracy`the-ok\'-ra-si (theokratia, from theos, "a god," and kratos, "power"; after the analogy of the words "democracy," "aristocracy," and the like): "Theocracy" is not a Biblical word. The idea, however, is Biblical, and in strictness of speech exclusively Biblical. The realization of the idea is not only confined to Israel, but in the pre-exilic history of Israel the realization of the idea was confined to the Southern Kingdom, and in post-exilic history to the period between the return under Ezra and the days of Malachi.<P>For the word "theocracy" we are, by common consent, indebted to Josephus. In his writings it seems to occur but once (Apion, II, xvi). The passage reads as follows: "Our lawgiver had an eye to none of these," that is, these different forms of government, such as monarchy, aristocracy, oligarchy, and others of which Josephus had been speaking, "but, as one might say, using a strained expression, he set forth the national polity as a theocracy, referring the rule and might to God" (Stanton\'s translation). It is generally agreed that the language here used indicates that Josephus knew himself to be coining a new word.<P>If, now, we turn from the word to the Old Testament idea to which it gives fitting and apt expression, that idea cannot be better stated than it has been by Kautzsch—namely, "The notion of theocracy is that the constitution (of Israel) was so arranged that all the organs of government were without any independent power, and had simply to announce and execute the will of God as declared by priest and prophets, or reduced to writing as a code of laws" (HDB, extra vol, 630,1,init.). The same writer is entirely correct when he says that in what is known in certain circles as "the PC"—though he might have said in the Old Testament generally—"everything, even civil and criminal law, is looked at from the religious standpoint" (ibid., ut supra).<P>If the foregoing be a correct account of the idea expressed by the word "theocracy," and particularly if the foregoing be a correct account of the Old Testament representation of God\'s relation to, and rule in and over Israel, it follows as a matter of course that the realization of such an idea was only possible within the sphere of what is known as special revelation. Indeed, special revelation of the divine will, through divinely-chosen organs, to Divinely appointed executive agents, is, itself, the very essence of the idea of a theocracy.<P>That the foregoing is the Old Testament idea of God\'s relation to His people is admitted to be a natural and necessary implication from such passages as <a onClick="return mV(\'Jdg\',8,23);">Jud 8:23</a>; <a onClick="return mV(\'1Sa\',8,\'1-\');">1Sa 8</a>; compare <a onClick="return mV(\'1Sa\',12,12);">12:12</a>; <a onClick="return mV(\'2Ch\',13,8);">2Ch 13:8</a>; <a onClick="return mV(\'2Sa\',7,\'1-17\');">2Sa 7:1-17</a>; <a onClick="return mV(\'Psa\',89,27);">Ps 89:27</a>; <a onClick="return mV(\'Deu\',17,\'14-20\');">De 17:14-20</a>.<P>Upon any other view of the origin of the Old Testament books than that which has heretofore prevailed, it is certainly a remarkable fact that whenever the books of the Old Testament were written, and by whomsoever they may have been written, and whatever the kind or the number of the redactions to which they may have been subjected, the conception—the confessedly unique conception—of a government of God such as that described above by Kautzsch is evidenced by these writings in all their parts. This fact is all the more impressive in view of the further fact that we do not encounter this sharply defined idea of a rule of God among men in any other literature, ancient or modern. For while the term "theocracy" occurs in modern literature, it is evidently used in a much lower sense. It is futher worth remarking that this Old Testament idea of the true nature of God\'s rule in Israel has only to be fully apprehended for it to become obvious that many of the alleged analogies between the Old Testament prophet and the modern preacher, reformer and statesman are wholly lacking in any really solid foundation.``116';

isbe[8736]='Theophilus`the-of\'-i-lus (Theophilos, "loved of God"): The one to whom Luke addressed his Gospel and the Acts of the Apostles (compare <a onClick="return mV(\'Luk\',1,3);">Lu 1:3</a>; <a onClick="return mV(\'Act\',1,1);">Ac 1:1</a>). It has been suggested that Theophilus is merely a generic term for all Christians, but the epithet "most excellent" implies it was applied by Luke to a definite person, probably a Roman official, whom he held in high respect. Theophilus may have been the presbyter who took part in sending the letter from the Corinthians to Paul, given in the "Acta Pauli" (compare Hennecke, Neutestamentliche Apokryphen, 378). There is also a magistrate Theophilus mentioned in the "Ac of James" as being converted by James on his way to India (compare Budge, The Contendings of the Apostles, II, 299), but these and other identifications, together with other attempts to trace out the further history of the original Theophilus, are without sufficient evidence for their establishment (compare also Knowling in The Expositor Greek Testament, II, 49-51).``88';
isbe[8737]='Theras`the\'-ras (Thera): The river by which the company assembled in preparation for the march to Jerusalem under Ezra (1Esdras 8:41,61). In <a onClick="return mV(\'Ezr\',8,21,31);">Ezr 8:21,31</a> the name of the river is Ahava. Possibly the place is represented by the modern Hit on the Euphrates; but no certain identification is possible.``1';

isbe[8739]='Thessalonians, the First Epistle of Paul to the`thes-a-lo\'-ni-anz<P><b>I. IMPORTANCE OF THE EPISTLE</b><P><b>II. CIRCUMSTANCES OF THE FOUNDING OF THE CHURCH</b><P class="in15">1. Luke\'s Narrative in Acts<P class="in15">2. Confirmation of Luke\'s Narrative in the Epistle<P><b>III. CONDITIONS IN THE THESSALONIAN CHURCH AS INDICATED IN THE LETTER</b><P><b>IV. ANALYSIS WIENER, ORIGIN OF THE PENTATEUCH THE EPISTLE</b><P class="in15">1. Paul\'s Past and Present Relations with the Thessalonians and His Love for Them<P class="in15">2. Exhortations against Vice, and Comfort and Warning in View of the Coming of Christ<P><b>V. DOCTRINAL IMPLICATIONS OF THE EPISTLE</b><P><b>VI. THE EPISTLE\'S REVELATIONS OF PAUL\'S CHARACTERISTICS</b><P><b>LITERATURE</b><hr /><P>I. The Importance of the Epistle.<P>The letter is especially important as a witness to the content of the earliest Gospel, on account of its date and its well-nigh unchallenged authenticity. According to Harnack it was written in the year 48 AD; according to Zahn, in the year 53. It is likely that these two dates represent the extreme limits. We are thus justified in saying with confidence that we have before us a document that could not have been written more than 24 years, and may very easily have been written but 19 years, after the ascension of our Lord. This is a fact of great interest in view of the contention that the Jesus of the four Gospels is a product of the legend-making propensity of devout souls in the latter part of the 1st century. When we remember that Paul was converted more than 14 years before the writing of the Epistles, and that he tells us that his conversion was of such an overwhelming nature as to impel him in a straight course from which he never varied, and when we note that at the end of 14 years Peter and John, having fully heard the gospel which he preached, had no corrections to offer (<a onClick="return mV(\'Gal\',1,\'11-\');">Ga 1:11-<a onClick="return mV(\'Gal\',2,\'1-10\');">2:10</a>, especially <a onClick="return mV(\'Gal\',2,\'6-10\');">2:6-10</A>), we see that the view of Christ and His message given in this Epistle traces itself back into the very presence of the most intimate friends of Jesus. It is not meant by this that the words of Paul or the forms of his teaching are reproductions of things Jesus said in the days of His flesh, but rather that the conception which is embodied in the Epistle of the person of Christ and of His relation to the Father, and of His relation also to the church and to human destiny, is rooted in Christ\'s own self-revelation.<P>II. Circumstances of the Founding of the Church.<P>1. Luke\'s Narrative in Acts:<P>For the founding of the church we have two sources of information, the Book of Acts and the Epistle itself. Luke\'s narrative is found in <a onClick="return mV(\'Act\',17,\'1-\');">Ac 17</a>. Here we are told that Paul, after leaving Philippi, began his next siege against entrenched paganism in the great market center of Thessalonica. He went first into the synagogues of the Jews, and for three Sabbath days reasoned with them out of the Scriptures. Some of them, Luke tells us, "were persuaded, and consorted with Paul and Silas; and of the devout Greeks a great multitude, and of the chief women not a few." This very naturally excited the jealousy of the Jews who found themselves losing the social prestige that came from having a large number of Greeks, including some of the nobility, resorting to them for instruction. Accordingly, they raised a mob of the worst men in town and brought the leading members of the church before the magistrate. These brethren, Jason and certain others, who seem to have been men of some property, were compelled to give bond to preserve the peace, and the intense feeling against Paul made it necessary for him, for the sake of these brethren as well as for his personal safety, to flee from the city.<P>2. Confirmation of Luke\'s Narrative in the Epistle:<P>The historicity of Luke\'s story of the founding of the church is strongly supported by the text of the Epistle. Paul, for instance, notes that the work in Thessalonica began after they had been shamefully entreated at Philippi (<a onClick="return mV(\'1Th\',2,2);">1Th 2:2</a>). He bears witness also in the same verse to the conflict in the midst of which the Thessalonian church was founded (see also <a onClick="return mV(\'1Th\',2,14);">1Th 2:14</a>). Paul\'s exhortation to salute all the brethren with a holy kiss, his solemn adjuration that this letter be read unto all the brethren (<a onClick="return mV(\'1Th\',5,26,27);">1Th 5:26,27</a>), and his exhortation to despise not prophesying (<a onClick="return mV(\'1Th\',5,20);">1Th 5:20</a>) are harmonious with Luke\'s account of the very diverse social elements out of which the church was formed: diversities that would very easily give rise to a disposition on the part of the more aristocratic to neglect the cordial greetings to the poorer members, and to despise their uncouth testimonies to the grace of God that had come to them (<a onClick="return mV(\'Act\',17,4);">Ac 17:4</a>).<P>Paul tells us that he was forced to labor for his daily bread at Thessalonica (<a onClick="return mV(\'1Th\',2,9);">1Th 2:9</a>). Luke does not make mention of this, but he tells us of his work at tent-making in the next town where he made a considerable stop (<a onClick="return mV(\'Act\',18,\'1-3\');">Ac 18:1-3</a>), and thus each statement makes the other probable.<P>Perhaps, however, the most marked corroboration of the Acts which we have in the letter is the general harmony of its revelation of the character of Paul with that of the Acts. The reminiscences of Paul\'s work among them (<a onClick="return mV(\'1Th\',2,\'1-12\');">1Th 2:1-12</a>) correspond, for instance, in a marked way, in essence though not in style and vocabulary, with Luke\'s report of Paul\'s account of the method and spirit of his work at Ephesus (<a onClick="return mV(\'Act\',20,\'17-35\');">Ac 20:17-35</a>). This, however, is only one of many correspondences which could be pointed out and which will at once be evident to anyone who will read the letter, and then go over <a onClick="return mV(\'Act\',13,\'1-\');">Ac 13-28</a>.<P>It may seem irrelevant thus to emphasize the historicity of Acts in an article on Thessalonians, but the witness of the Epistle to the historicity of the Gospels and of Acts is for the present moment one of its most important functions.<P>III. Conditions in the Thessalonian Church as Indicated in the Letter.<P>A New Testament epistle bears a close resemblance to a doctor\'s prescription. It relates itself to the immediate situation of the person to whom it is directed. If we study it we can infer with a great deal of accuracy the tendencies, good or bad, in the church. What revelation of the conditions at Thessalonica is made in the First Epistle? Plainly, affairs on the whole are in a very good state, especially when one takes into account the fact that most of the members had been out of heathenism but a few months. They were so notably devoted to God that they were known all over Macedonia as examples to the church (<a onClick="return mV(\'1Th\',1,7);">1Th 1:7</a>). In particular the Christian grace of cordial good will toward all believers flourished among them: a grace which they doubtless had good opportunity to exercise in this great market town to which Christians from all parts would resort on business errands and where there would be constant demands on their hospitality (<a onClick="return mV(\'1Th\',4,\'9-10\');">1Th 4:9-10</a>).<P>There were, however, shadows in the picture. Some persons were whispering dark suspicions against Paul. Perhaps, as Zahn suggests, they were the unbelieving husbands of the rich ladies who had become members of the church. It was in answer to these criticisms that he felt called upon to say that he was not a fanatic nor a moral leper, nor a deceiver (<a onClick="return mV(\'1Th\',2,3);">1Th 2:3</a>). When he is so careful to remind them that he was not found at any time wearing a cloak of covetousness, but rather went to the extreme of laboring night and day that he might not be chargeable to any of them (<a onClick="return mV(\'1Th\',2,9);">1Th 2:9</a>), we may be sure that the Christians were hearing constant jibes about their money-making teacher who had already worked his scheme with the Philippians so successfully that they had twice sent him a contribution (<a onClick="return mV(\'Phl\',4,16);">Php 4:16</a>). Paul\'s peculiar sensitiveness on this point at Corinth (<a onClick="return mV(\'1Cr\',9,14,15);">1Co 9:14,15</a>) was possibly in part the result of his immediately preceding experiences at Thessalonica.<P>One wonders whether Greece was not peculiarly infested at this time with wandering philosophers and religious teachers who beat their way as best they could, living on the credulity of the unwary.<P>Paul\'s anxiety to assure them of his intense desire to see them and his telling of his repeated attempts to come to them (<a onClick="return mV(\'1Th\',2,\'17-20\');">1Th 2:17-20</a>) show rather plainly also that his absence had given rise to the suspicion that he was afraid to come back, or indeed quite indifferent about revisiting them. "We would fain have come unto you," he says, "I Paul once and again; and Satan hindered us."<P>Some also were saying that Paul was a flatterer (<a onClick="return mV(\'1Th\',2,5);">1Th 2:5</a>), who was seeking by this means to carry out unworthy ends. This sneer indeed, after the reading of the letter, would come quite naturally to the superficial mind. Paul\'s amazing power to idealize his converts and see them in the light of their good intentions and of the general goal and trend of their minds is quite beyond the appreciation of a shallow and sardonic soul.<P>More than this, we can see plain evidence that the church was in danger of the chronic heathen vice of unchastity (<a onClick="return mV(\'1Th\',4,\'3-8\');">1Th 4:3-8</a>). The humble members also, in particular, were in danger of being intoxicated by the new intellectual and spiritual life into which they had been inducted by the gospel, and were spending their time in religious meetings to the neglect of their daily labor (<a onClick="return mV(\'1Th\',4,\'10-12\');">1Th 4:10-12</a>). Moreover, some who had lost friends since their baptism were mourning lest at the second coming of Christ these who had fallen asleep would not share in the common glory (<a onClick="return mV(\'1Th\',4,\'13-18\');">1Th 4:13-18</a>). This is a quaint proof of the immaturity of their view of Christ, as though a physical accident could separate from His love and care. There was likewise, as suggested above, the ever-present danger of social cliques among the members (<a onClick="return mV(\'1Th\',5,13,15,20,26,27);">1Th 5:13,15,20,26,27</a>). It is to this condition of things that Paul pours forth this amazingly vital and human Epistle.<P>IV. Analysis of the Epistle.<P>The letter may be divided in several ways. Perhaps as simple a way as any is that which separates it into two main divisions.<P>First, Paul\'s past and present relations with the Thessalonians, and his love for them (<a onClick="return mV(\'1Th\',1,\'1-\');">1Th 1:1-3:13</a>):<P>1. Paul\'s Past and Present Relations with the Thessalonians and His Love for Them:<P>(1) Greeting and Thanksgiving (<a onClick="return mV(\'1Th\',1,\'1-10\');">1Th 1:1-10</a>).<P>(2) Paul reminds them of the character of his life and ministry among them (<a onClick="return mV(\'1Th\',2,\'1-12\');">1Th 2:1-12</a>).<P>(3) The sufferings of the Thessalonians the same as those endured by their Jewish brethren (<a onClick="return mV(\'1Th\',2,\'13-16\');">1Th 2:13-16</a>).<P>(4) Paul\'s efforts to see them (<a onClick="return mV(\'1Th\',2,\'17-20\');">1Th 2:17-20</a>).<P>(5) Paul\'s surrender of his beloved helper in order to learn the state of the Thessalonian church, and his joy over the good news which Timothy brought (<a onClick="return mV(\'1Th\',3,\'1-13\');">1Th 3:1-13</a>).<P>Second, exhortations against vice, and comfort and warning in view of the coming of Christ (<a onClick="return mV(\'1Th\',4,\'1-5\');">1Th 4:1-5</a>,28):<P>2. Exhortations against Vice, and Comfort and Warning in View of the Coming of Christ:<P>(1) Against gross vice (<a onClick="return mV(\'1Th\',4,\'1-8\');">1Th 4:1-8</a>).<P>(2) Against idleness (<a onClick="return mV(\'1Th\',4,\'9-12\');">1Th 4:9-12</a>).<P>(3) Concerning those who have fallen asleep (<a onClick="return mV(\'1Th\',4,\'13-18\');">1Th 4:13-18</a>).<P>(4) Concerning the true way to watch for the Coming (<a onClick="return mV(\'1Th\',5,\'1-11\');">1Th 5:1-11</a>).<P>(5) Sundry exhortations (<a onClick="return mV(\'1Th\',5,\'12-28\');">1Th 5:12-28</a>).<P>V. Doctrinal Implications of the Epistle.<P>The Epistle to the Thessalonians is not a doctrinal letter. Paul\'s great teaching concerning salvation by faith alone, apart from the works of the Law, is not sharply defined or baldly stated, and the doctrine of the cross of Christ as central in Christianity is here implied rather than enforced. Almost the only doctrinal statement is that which assures them that those of their number who had fallen asleep would not in any wise be shut out from the rewards and glories at Christ\'s second coming (<a onClick="return mV(\'1Th\',4,\'13-18\');">1Th 4:13-18</a>). But while the main doctrinal positions of Paul are not elaborated or even stated in the letter, it may safely be said that the Epistle could scarcely have been written by one who denied those teachings. And the fact that we know that shortly before or shortly after Paul wrote the Epistle to the Galatians, and the fact that he so definitely describes his attitude at this very time toward the preaching of the cross of Christ, in his reminiscences in 1 Corinthians (see especially <a onClick="return mV(\'1Cr\',2,\'1-5\');">1Co 2:1-5</a>), show how foolish it is to assume that an author has not yet come to a position because he does not constantly obtrude it in all that he writes.<P>The Epistle, however, bears abundant evidence to the fact that this contemporary of Jesus had seen in the life and character and resurrection of Jesus that which caused him to exalt Him to divine honors, to mention Him in the same breath with God the Father, and to expect His second coming in glory as the event which would determine the destiny of all men and be the final goal of history. As such the letter, whose authenticity is now practically unquestioned, is a powerful proof that Jesus was a personality as extraordinary as the Jesus of the first three Gospels. And even the Christ of the Fourth Gospel is scarcely more exalted than He who now with God the Father constitutes the spiritual atmosphere in which Christians exist (<a onClick="return mV(\'1Th\',1,1);">1Th 1:1</a>), and who at the last day will descend from heaven with a shout and with the voice of an archangel and the trump of God, and cause the dead in Christ to rise from their tombs to dwell forever with Himself (<a onClick="return mV(\'1Th\',4,16,17);">1Th 4:16,17</a>).<P>VI. The Epistle\'s Revelations of Paul\'s Characteristics.<P>We notice in the letter the extreme tactfulness of Paul. He has some plain and humiliating warnings to give, but he precedes them in each case with affectionate recognition of the good qualities of the brethren. Before he warns against gross vice he explains that he is simply urging them to continue in the good way they are in. Before he urges them to go to work he cordially recognizes the love that has made them linger so long and so frequently at the common meeting-places. And when in connection with his exhortations about the second coming he alludes to the vice of drunkenness, he first idealizes them as sons of the light and of the day to whom, of course, the drunken orgies of those who are "of the night" would be unthinkable. Thus by a kind of spiritual suggestion he starts them in the right way.<P>LITERATURE.<P>Bishop Alexander, the Speaker\'s Commentary (published in America under the title, The Bible Comm., and bound with most excellent commentaries on all of the Pauline Epistles), New York, Scribners; Milligan, The Epistles to the Thessalonians (the Greek text with Introduction and notes), London, Macmillan; Moffatt, The Expositor\'s Greek Test. (bound with commentaries by various authors on the Pastoral Epistles, Philemon, Hebrews and James), New York, Dodd, Mead and Co.; Frame, ICC, New York, Scribners; Stevens, An American Commentary on the New Testament, Philadelphia, American Baptist Publication Society; Adeney, The New Century Bible, ""1 and 2 Thessalonians" and "Galatians," New York, Henry Frowde; Findlay, "The Epistles to the Thessalonians," Cambridge Bible for Schools and Colleges, New York, Putnams; James Denney, "The Epistles to the Thessalonians," Expositor\'s Bible, New York, Doran; the two latter are especially recommended as inexpensive, popular and yet scholarly commentaries. The Cambridge Bible is a verse-by-verse commentary, and Professor Denney on "Thess" in Expositor\'s Bible is one of the most vital and vigorous pieces of homiletical exposition known to the present writer.``184';
isbe[8740]='Thessalonians, the Second Epistle of Paul to the`<b>I. IMPORTANCE OF STUDYING 1 THESSALONIANS AND 2 THESSALONIANS TOGETHER</b><P><b>II. AUTHENTICITY</b><P class="in15">1. Arguments against the Pauline Authorship<P class="in15">2. Arguments for the Pauline Authorship<P><b>III. THE MAN OF SIN</b><P class="in15">1. Primary Reference<P class="in15">2. Permanent Value of the Teaching concerning the Man of Sin<P><b>V. PAUL\'S EXHORTATION TO QUIET INDUSTRY</b><P><b>LITERATURE</b><hr /><P>I. Importance of Studying 1 Thessalonians and 2 Thessalonians Together.<P>Those who hold to the Pauline authorship of the Epistle unite in ascribing it to a time but little subsequent to the writing of the First Letter. It is simply a second prescription for the same case, made after discovering that some certain stubborn symptoms had not yielded to the first treatment. 2 Thessalonians should be studied in connection with 1 Thessalonians because it is only from an understanding of the First Epistle and the situation that it revealed that one can fully grasp the significance of the Second. And more than that, the solution of the problem as to whether Paul wrote the Second Letter is likewise largely dependent on our knowledge of the First. It would, for instance, be much harder to believe that Paul had written 2 Thessalonians if we did not know that before writing it he had used the tender and tactful methods of treatment which we find in the First Letter. It is as though one should enter a sick rook where the physician is resorting to some rather strong measures with a patient. One is better prepared to judge the wisdom of the treatment if he knows the history of the case, and discovers that gentler methods have already been tried by the physician without success.<P>II. Authenticity.<P>1. Arguments against the Pauline Authorship:<P>The different treatment of the subject of the second coming of Christ, the different emotional tone, and the different relationships between Paul and the church presupposed in the First and Second Epistles have been among the causes which have led to repeated questionings of the Pauline authorship of 2 Thessalonians. Scholars argue, in the first place, that the doctrine concerning the coming of Christ which we find in the Second Letter is not only differently phrased but is contradictory to that in the First. We get the impression from the First Letter that the Day of the Lord is at hand. It will come as a thief in the night (<a onClick="return mV(\'1Th\',5,2);">1Th 5:2</a>), and one of the main parts of Christian duty is to expect (<a onClick="return mV(\'1Th\',1,9,10);">1Th 1:9,10</a>). In the Second Letter, however, he writer urges strongly against any influence that will deceive them into believing that the Day of the Lord is at hand, because it will not be "except the falling away come first, and the man of sin be revealed, the son of perdition, he that opposeth and exalteth himself against all that is called God or that is worshiped" (<a onClick="return mV(\'2Th\',2,\'1-4\');">2Th 2:1-4</a>).<P>Again very plainly also, say the critics, a different relation exists between the writer and the church at Thessalonica. In the First Letter he coaxes; in the Second Letter he commands (<a onClick="return mV(\'1Th\',4,1);">1Th 4:1,2</a>,<a onClick="return mV(\'1Th\',4,\'9-12\');">9-12</a>; <a onClick="return mV(\'1Th\',5,\'1-11\');">5:1-11</a>; <a onClick="return mV(\'2Th\',2,\'1-4\');">2Th 2:1-4</a>; <a onClick="return mV(\'2Th\',3,6);">3:6</a>,<a onClick="return mV(\'2Th\',3,\'12-14\');">12-14</a>). Moreover, the whole emotional tone of the Second Letter is different from that of the First. The First Epistle is a veritable geyser of joyous, grateful affection and tenderness. The Second Letter, while it also contains expressions of the warmest affection and appreciation, is quite plainly not written under the same pressure of tender emotion. Here, say the critics, is a lower plane of inspiration. Here are Paul\'s words and phrases and plain imitations of Paul\'s manner, but here most emphatically is not the flood tide of Paul\'s inspiration. Moreover, the lurid vision of the battle between the man of sin and the returning Messiah in the Second Letter is different in form and coloring from anything which we find elsewhere in Paul. These, and other considerations have led many to assume that the letter was written by a hand other than that of the Apostle to the Gentiles.<P>2. Arguments for the Pauline Authorship:<P>The Hypothesis, however, that Paul was not the author of the Epistle, while it obviates certain difficulties, raises many more. Into a statement of these difficulties we will not go here, but refer the reader to a brief and scholarly putting of them in Peake\'s Critical Introduction to the New Testament, 12-16 (New York, Scribners, 1910).<P>There is accordingly today a manifest tendency among all scholars, including those in the more radical camps, to return to the traditional position concerning the authorship. The following are some of the positive arguments for the authenticity:<P>As for the opposing views of the coming of Christ in the two Epistles, it is to be noted that precisely the same superficial contradiction occurs in our Lord\'s own teaching on this same subject (<a onClick="return mV(\'Mat\',24,6,23,24,25,26);">Mt 24:6,23,24,25,26</a>; <a onClick="return mV(\'Luk\',12,35,40);">Lu 12:35,40</a>). Jesus exhorts His disciples to watch, for in such an hour as they think not the Son of man cometh, and yet at the same time and in the same connection warns them that when they see certain signs they should not be troubled, for the end is not yet. Paul, brooding over the subject after writing the First Letter, might easily have come strongly to see the obverse side of the shield. The apostle built his theology upon the tradition which had come from Jesus as interpreted by its practical effects upon his converts, and his mind was quick to counteract any danger due to overemphasis or wrong inferences. He was not nearly as eager for a consistently stated doctrine as he was for a doctrine that made for spiritual life and efficiency. During the fierce persecutions at the beginning of the movement in Thessalonica, the comfort of the thought of the swift coming of Christ was in need of emphasis but as soon as the doctrine was used as an excuse for unhealthful religious excitement the minds of the disciples must be focused on more prosaic and less exciting aspects of reality.<P>That Paul assumes a commanding and peremptory attitude in the Second Letter which we do not find so plainly asserted in the First is readily admitted. Why should not the First Letter have had its intended effect upon the Thessalonian church as a whole? And if Paul received word that his gracious and tactful message had carried with it the conviction of the dominant elements of the church, but that certain groups had continued to be fanatical and disorderly, we can easily see how, with the main current of the church behind him, he would have dared to use more drastic methods with the offending members.<P>It is also readily admitted that the Second Letter is not so delightful and heart-warming as the First. It was plainly not written in a mood of such high emotional elevation. But the question may be raised as to whether the coaxing, caressing tone of the First Epistle would have been appropriate in handling the lazy and fanatical elements of the church after it had persisted in disregarding his tender and kindly admonitions. Jesus\' stern words to the Pharisees in <a onClick="return mV(\'Mat\',23,\'1-\');">Mt 23</a> are not so inspiring as <a onClick="return mV(\'Jhn\',14,1);">Joh 14</a>, but they were the words and the only words that were needed at the time. "Let not your heart be troubled" would not be inspired if delivered to hypocrites. Furthermore, we are not called upon to assume that Paul at all times lived in the same mood of emotional exaltation. In
