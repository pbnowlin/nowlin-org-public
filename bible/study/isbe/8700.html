deed his Epistles abound with assertions that this was not the case (<a onClick="return mV(\'2Cr\',1,8);">2Co 1:8</a>; <a onClick="return mV(\'1Th\',3,9);">1Th 3:9</a>), and it is unreasonable to expect him always to write in the same key. It must be added, however, that the suggestion that the Second Epistle is stern may easily be overdone. If 1 Thessalonians were not before us, it would be the tenderness of Paul\'s treatment of the church which would most impress us.<P>Harnack has recently added the weight of his authority to the argument for the Pauline authorship of the letter. He thinks that there were two distinct societies in Thessalonica, the one perhaps meeting in the Jewish quarter and composed chiefly of Jewish Christians, and the other composed of Greeks meeting in some other part of the city. In addition to the probability that this would be true, which arises from the very diverse social classes out of which the church was formed (<a onClick="return mV(\'Act\',17,4);">Ac 17:4</a>), and the size of the city, he points to the adjuration in the First Letter (<a onClick="return mV(\'1Th\',5,27);">1Th 5:27</a>) that this Epistle be read unto all the brethren, as a proof that there was a coterie in the church that met separately and that might easily have been neglected by the rest, just as the Greeks in Jerusalem were neglected in the daily ministration (<a onClick="return mV(\'Act\',6,1);">Ac 6:1</a>). He thinks that the Second Letter was probably directed to the Jewish element of the Church.<P>It is to be noted also that Professor Moffatt (Introduction to the Literature of the New Testament, 76ff), who calls in question the authenticity of nearly all of the books of the New Testament that any reputable scholars now attack, finds no sufficient reason to question the Pauline authorship of 2 Thessalonians.<P>III. The Man of Sin.<P>1. Primary Reference:<P>The question as to whom or what Paul refers to in <a onClick="return mV(\'2Th\',2,\'1-12\');">2Th 2:1-12</a>, when he speaks of the man of sin, whose revelation is to precede the final manifestation of Christ, has divided scholars during all the Christian centuries. (For a good discussion of the history of the interpretation of this difficult section, see Findlay, "I and II Thessalonians," Cambridge Bible, 170-80.) The reason why each age has had its fresh interpretation identifying the man of sin with the blasphemous powers of evil then most active is the fact that the prophecy has never yet found its complete accomplishment. The man of sin has never been fully revealed, and Christ has never finally destroyed him.<P>But Paul says that the mystery of iniquity already works (<a onClick="return mV(\'2Th\',2,7);">2Th 2:7</a>), and he tells the church that the restraining influence which for the time being held it in check is something that "ye know" (<a onClick="return mV(\'2Th\',2,6);">2Th 2:6</a>). Plainly, then, the evil power and that which held it in check were things quite familiar both to Paul and to his readers. We must therefore give the prophecy a lst-century reference. The alternative probably lies between making the mystery of iniquity the disposition of the Roman emperor to give himself out as an incarnation of deity and force all men to worship him, a tendency which was then being held in check by Claudius, but which soon broke out under Caligula (see Peake\'s Introduction above cited); or, on the other hand, making the mystery of iniquity to be some peculiar manifestation of diabolism which was to break out from the persecuting Jewish world, and which was then held in check by the restraining power of the Roman government.<P>In favor of making a blasphemous Roman emperor the man of sin, may be urged the fact that it was this demand of the emperor for worship which brought matters to a crisis in the Roman world and turned the terrific enginery of the Roman empire against Christianity. And it may be argued that it is hardly likely that the temporary protection which Paul received from the Roman government prevented him from seeing that its spirit was such that it must ultimately be ranged against Christianity. One may note also, in arguing for the Roman reference of the man of sin, the figurative and enigmatic way in which Paul refers to the opposing power, a restraint that would be rendered necessary for reasons of prudence (compare <a onClick="return mV(\'Mar\',13,14);">Mr 13:14</a>, and also the cryptograms used by the author of the Book of Revelation in referring to Rome). Paul has none of this reserve in referring to the persecuting Jewish world who "please not God, and are contrary to all men" (<a onClick="return mV(\'1Th\',2,15);">1Th 2:15</a>). And in view of the fact that the Jews were in disfavor in the Roman empire, as is proved by then recently issued decree of Claudius commanding all Jews to depart from Rome (<a onClick="return mV(\'Act\',18,2);">Ac 18:2</a>), and by the fact that to proclaim a man a Jew helped at that time to lash a mob into fury against him (<a onClick="return mV(\'Act\',16,20);">Ac 16:20</a>; <a onClick="return mV(\'Act\',19,34);">19:34</a>), it would seem hardly likely that Paul would expect the subtle and attractive deception that was to delude the World to come from Jerusalem; and particularly would this seem unlikely in view of the fact that Paul seems to be familiar with our Lord\'s prophecy of the swift destruction of Jerusalem, as is shown by his assertion in <a onClick="return mV(\'1Th\',2,16);">1Th 2:16</a>, that wrath is come upon them to the uttermost.<P>On the other hand, however, to make the man of sin a person or an influence coming from Judaism is supported by the fact that he is to sit in the temple of God, setting himself forth to be God (<a onClick="return mV(\'1Th\',2,4);">1Th 2:4</a>), and by the fact that the natural punishment for the rejection of their Messiah was that the Jews should be led to accept a false Messiah. Having opposed Him who came in the Father\'s name, they were doomed to accept one who came in his own name. Again, and far more important than this, is the fact that during nearly the whole of Paul\'s life it was the Roman empire that protected him, and the unbelieving Jews that formed the malicious, cunning and powerful opposition to his work and to the well-being and peace of his churches, and he could very well have felt that the final incarnation of evil was to come from the source which had crucified the Christ and which had thus far been chiefly instrumental in opposing the gospel. Moreover, this expectation that a mysterious power of evil should arise out of the Jewish world seems to be in harmony with the rest of the New Testament (<a onClick="return mV(\'Mat\',24,5,23,24);">Mt 24:5,23,24</a>; <a onClick="return mV(\'Rev\',11,3,7,8);">Re 11:3,7,8</a>). It is the second alternative, therefore, that is, with misgivings, chosen by the present writer.<P>It may be objected that this cannot be the true Interpretation, as it was not fulfilled, but, on the contrary, it was Rome that became the gospel\'s most formidable foe. But this type of objection, if accepted as valid, practically puts a stop to all attempts at a historical interpretation of prophecy. It would force us to deny that the prophecies of the Old Testament, which are usually taken as referring to Christ, referred to Him at all, because plainly they were not literally fulfilled in the time and manner that the prophets expected them to be fulfilled. It would almost force us to deny that John the Baptist referred to Christ when he heralded the coming of the one who would burn up the chaff with unquenchable fire, because as the Gospels tell us Jesus did not fulfill this prophecy in the way John expected (<a onClick="return mV(\'Luk\',7,19);">Lu 7:19</a>).<P>See <a href="./study/isbe/search.html?string=MAN+OF+SIN">MAN OF SIN</a>.<P>2. Permanent Value of the Teaching concerning the Man of Sin:<P>Although Paul\'s prediction concerning the man of sin was not literally fulfilled, nevertheless his teaching has a permanent significance. It is always true in every battle for good that the Son of man does not come until the falling away comes and the man of sin is revealed. First, there is the fresh tide of enthusiasm and the promise of swift victory for the kingdom of heaven, but soon there is the reaction and the renascence of opposition in new and overwhelming power. The battle is to the death. And then above the smoke of the battle men see the sign of the coming of the Son of man with power and great glory; the conviction floods them that after all what Christ stands for is at the center of the universe and must prevail, and men begin to recognize Christ\'s principles as though they were natural law. This action and reaction followed by final victory takes place in practically all religious and reforming movements which involve the social reconstruction of society according to the principles of the Kingdom. It is exceedingly important that men should be delivered from shallow optimism. And this Epistle makes its contribution to that good end.<P>IV. Paul\'s Exhortation to Quiet Industry.<P>The exhortation that the brethren should work with quietness and earn their own bread (<a onClick="return mV(\'2Th\',3,12);">2Th 3:12</a>) is full of interest to those who are studying the psychological development of the early Christians under the influence of the great mental stimulus that came to them from the gospel. Some were so excited by the new dignity that had come to them as members of the Christian society, and by the new hopes that had been inspired in their minds, that they considered themselves above the base necessity of manual labor. This is not an infrequent phenomenon among new converts to Christianity in heathen lands. Paul would have none of it. Fortunately he could point to his own example. He not only labored among them to earn his own livelihood, but he worked until muscles ached and body rebelled (2 These 3:8).<P>Paul saw that the gospel was to be propagated chiefly by its splendid effects on the lives of all classes of society, and he realized that almost the first duty of the church was to be respected, and so he not only exhorts the individual members to independence, but he lays down the principle that no economic parasite is to be tolerated in the church. "If any man will not work, neither let him eat" (<a onClick="return mV(\'2Th\',3,10);">2Th 3:10</a>). This forms an important complement to the teaching of Jesus (<a onClick="return mV(\'Mat\',5,42);">Mt 5:42</a>): "Give to him that asketh thee, and from him that would borrow of thee turn not thou away."`<a href="./study/isbe/search.html?string=THESSALONIANS,+THE+FIRST+EPISTLE+OF+PAUL+TO+THE">THESSALONIANS, THE FIRST EPISTLE OF PAUL TO THE</a>`184';
isbe[8741]='Thessalonica`thes-a-lo-ni\'-ka (Thessalonike, ethnic Thessalonikeus):<P>1. Position and Name:<P>One of the chief towns of Macedonia from Hellenistic times down to the present day. It lies in 40 degrees 40 minutes North latitude, and 22 degrees 50 minutes East longitude, at the northernmost point of the Thermaic Gulf (Gulf of Salonica), a short distance to the East of the mouth of the Axius (Vardar). It is usually maintained that the earlier name of Thessalonica was Therma or Therme, a town mentioned both by Herodotus (vii.121ff, 179ff) and by Thucydides (i.61; ii.29), but that its chief importance dates from about 315 BC, when the Macedonian king Cassander, son of Antipater, enlarged and strengthened it by concentrating there the population of a number of neighboring towns and villages, and renamed it after his wife Thessalonica, daughter of Philip II and step-sister of Alexander the Great. This name, usually shortened since medieval times into Salonica or Saloniki, it has retained down to the present. Pliny, however, speaks of Therma as still existing side by side with Thessalonica (NH, iv.36), and it is possible that the latter was an altogether new foundation, which took from Therma a portion of its inhabitants and replaced it as the most important city on the Gulf.<P>2. History:<P>Thessalonica rapidly became populous and wealthy. In the war between Perseus and the Romans it appears as the headquarters of the Macedonian navy (Livy xliv. 10) and when, after the battle of Pydna (168 BC), the Romans divided the conquered territory into four districts, it became the capital of the second of these (Livy xlv.29), while later, after the organization of the single Roman province of Macedonia in 146 BC, it was the seat of the governor and thus practically the capital of the whole province. In 58 BC Cicero spent the greater part of his exile there, at the house of the quaestor Plancius (Pro Plancio 41, 99; Epistle Ad Att, iii.8-21). In the civil war between Caesar and Pompey, Thessalonica took the senatorial side and formed one of Pompey\'s chief bases (49-48 BC), but in the final struggle of the republic, six years later, it proved loyal to Antony and Octavian, and was rewarded by receiving the status and privileges of a "free city" (Pliny, NH, iv.36). Strabo, writing in the reign of Augustus, speaks of it as the most populous town in Macedonia and the metropolis of the province (vii.323, 330), and about the same time the poet Antipater, himself a native of Thessalonica, refers to the city as "mother of all Macedon" (Jacobs, Anthol. Graec., II, p. 98, <span class="noTag">number 14</span>); in the 2nd century of our era Lucian mentions it as the greatest city of Macedonia (Asinus, 46). It was important, not only as a harbor with a large import and export trade, but also as the principal station on the great Via Egnatia, the highway from the Adriatic to the Hellespont.<P>3. Paul\'s Visit:<P>Paul visited the town, together with Silas and Timothy, on his 2nd missionary journey. He had been at Philippi, and traveled thence by the Egnatian Road, passing through Amphipolis and Apollonia on the way (<a onClick="return mV(\'Act\',17,1);">Ac 17:1</a>). He found at Thessalonica a synagogue of the Jews, in which for three successive Sabbaths he preached the gospel, basing his message upon the types and prophecies of the Old Testament Scriptures (<a onClick="return mV(\'Act\',17,2,3);">Ac 17:2,3</a>). Some of the Jews became converts and a considerable number of proselytes and Greeks, together with many women of high social standing (<a onClick="return mV(\'Act\',17,4);">Ac 17:4</a>). Among these converts were in all probability Aristarchus and Secundus, natives of Thessalonica, whom we afterward find accompanying Paul to Asia at the close of his 3rd missionary journey (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>). The former of them was, indeed, one of the apostle\'s most constant companions; we find him with Paul at Ephesus (<a onClick="return mV(\'Act\',19,29);">Ac 19:29</a>) and on his journey to Rome (<a onClick="return mV(\'Act\',27,2);">Ac 27:2</a>), while in two of his Epistles, written during his captivity, Paul refers to Aristarchus as still with him, his fellow-prisoner (<a onClick="return mV(\'Col\',4,10);">Col 4:10</a>; <a onClick="return mV(\'Phm\',1,24);">Phm 1:24</a>). Gaius, too, who is mentioned in conjunction with Aristarchus, may have been a Thessalonian (<a onClick="return mV(\'Act\',19,29);">Ac 19:29</a>). How long Paul remained at Thessalonica on his 1st visit we cannot precisely determine; certainIy we are not to regard his stay there as confined to three weeks, and Ramsay suggests that it probably extended from December, 50 AD, to May, 51 AD (St. Paul the Traveler, 228). In any case, we learn that the Philippines sent him assistance on two occasions during the time which he spent there (<a onClick="return mV(\'Phl\',4,16);">Php 4:16</a>), although he was "working night and day" to maintain himself (<a onClick="return mV(\'1Th\',2,9);">1Th 2:9</a>; <a onClick="return mV(\'2Th\',3,8);">2Th 3:8</a>). Paul, the great missionary strategist, must have seen that from no other center could Macedonia be permeated with the gospel so effectively as from Thessalonica (<a onClick="return mV(\'1Th\',1,8);">1Th 1:8</a>).<P>But his success roused the jealousy of the Jews, who raised a commotion among the dregs of the city populace (<a onClick="return mV(\'Act\',17,5);">Ac 17:5</a>). An attack was made on the house of Jason, with whom the evangelists were lodging, and when these were not found Jason himself and some of the other converts were dragged before the magistrates and accused of harboring men who had caused tumult throughout the Roman world, who maintained the existence of another king, Jesus, and acted in defiance of the imperial decrees. The magistrates were duly alive to the seriousness of the accusation, but, since no evidence was forthcoming of illegal practices on the part of Jason or the other Christians, they released them on security (<a onClick="return mV(\'Act\',17,\'5-9\');">Ac 17:5-9</a>). Foreseeing further trouble if Paul should continue his work in the town, the converts sent Paul and Silas (and possibly Timothy also) by night to Berea, which lay off the main road and is referred to by Cicero as an out-of-the-way town (oppidum devium: in Pisonem 36). The Berean Jews showed a greater readiness to examine the new teaching than those of Thessalonica, and the work of the apostle was more fruitful there, both among Jews and among Greeks (<a onClick="return mV(\'Act\',17,\'10-13\');">Ac 17:10-13</a>). But the news of this success reached the Thessalonian Jews and inflamed their hostility afresh. Going to Berea, they raised a tumult there also, and made it necessary for Paul to leave the town and go to Athens (<a onClick="return mV(\'Act\',17,14,15);">Ac 17:14,15</a>).<P>Several points in this account are noteworthy as illustrating the strict accuracy of the narrative of the Acts. Philippi was a Roman town, military rather than commercial; hence, we find but few Jews there and no synagogue; the magistrates bear the title of praetors (<a onClick="return mV(\'Act\',16,20,20,22,35,36,38);">Ac 16:20,22,35,36,38</a> the Revised Version margin) and are attended by lictors (<a onClick="return mV(\'Act\',16,35,38);">Ac 16:35,38</a> the Revised Version margin); Paul and Silas are charged with the introduction of customs which Romans may not observe (<a onClick="return mV(\'Act\',16,21);">Ac 16:21</a>); they are beaten with rods (<a onClick="return mV(\'Act\',16,22);">Ac 16:22</a>) and appeal to their privileges as Roman citizens (16:37,38). At Thessalonica all is changed. We are here in a Greek commercial city and a seaport, a "free city," moreover, enjoying a certain amount of autonomy and its own constitution. Here we find a large number of resident Jews and a synagogue. The charge against Paul is that of trying to replace Caesar by another king; the rioters wish to bring him before "the people," i.e. the popular assembly characteristic of Greek states, and the magistrates of the city bear the Greek name of politarchs (<a onClick="return mV(\'Act\',17,\'5-9\');">Ac 17:5-9</a>). This title occurs nowhere in Greek literature, but its correctness is proved beyond possibility of question by its occurrence in a number of inscriptions of this period, which have come to light in Thessalonica and the neighborhood, and will be found collected in AJT (1898, 598) and in M. G. Dimitsas, (Makedonia), 422ff. Among them the most famous is the inscription engraved on the arch which stood at the western end of the main street of Salonica and was called the Vardar Gate. The arch itself, which was perhaps erected to commemorate the victory of Philippi, though some authorities assign it to a later date, has been removed, and the inscription is now in the British Museum (CIG, 1967; Leake, Northern Greece, III, 236; Le Bas, Voyage archeologique, number 1357; Vaux, Trans. Royal Sec. Lit., VIII, 528). This proves that the politarchs were six in number, and it is a curious coincidence that in it occur the names Sosipater, Gaius and Secundus, which are berate by three Macedonian converts, of whom the first two were probably Thessalonians, the last certainly.<P>4. The Thessalonian Church:<P>The Thessalonian church was a strong and flourishing one, composed of Gentiles rather than of Jews, if we may judge from the tone of the two Epistles addressed to its members, the absence of quotations from and allusions to the Old Testament, and the phrase "Ye turned unto God from idols" (<a onClick="return mV(\'1Th\',1,9);">1Th 1:9</a>; compare also <a onClick="return mV(\'1Th\',2,14);">2:14</A>). These, by common consent the earliest of Paul\'s Epistles, show us that the apostle was eager to revisit Thessalonica very soon after his enforced departure: "once and again" the desire to return was strong in him, but "Satan hindered" him (<a onClick="return mV(\'1Th\',2,18);">1Th 2:18</a>)—a reference probably to the danger and loss in which such a step would involve Jason and the other leading converts. But though himself prevented from continuing his work at Thessalonica, he sent Timothy from Athens to visit the church and confirm the faith of the Christians amid their hardships and persecutions (<a onClick="return mV(\'1Th\',3,\'2-10\');">1Th 3:2-10</a>). The favorable report brought back by Timothy was a great comfort to Paul, and at the same time intensified his longing to see his converts again (<a onClick="return mV(\'1Th\',3,10,11);">1Th 3:10,11</a>). This desire was to be fulfilled more than once. Almost certainly Paul returned there on his 3rd missionary journey, both on his way to Greece (<a onClick="return mV(\'Act\',20,1);">Ac 20:1</a>) and again while he was going thence to Jerusalem (<a onClick="return mV(\'Act\',20,3);">Ac 20:3</a>); it is on this latter occasion that we hear of Aristarchus and Secundus accompanying him (<a onClick="return mV(\'Act\',20,4);">Ac 20:4</a>). Probably Paul was again in Thessalonica after his first imprisonment. From the Epistle to the Philippians (<a onClick="return mV(\'Act\',1,26);">Ac 1:26</a>; <a onClick="return mV(\'Act\',2,24);">2:24</a>), written during his captivity, we learn that his intention was to revisit Philippi if possible, and <a onClick="return mV(\'1Ti\',1,3);">1Ti 1:3</a> records a subsequent journey to Macedonia, in the course of which the apostle may well have made a longer or shorter stay at Thessalonica. The only other mention of the town in the New Testament occurs in <a onClick="return mV(\'2Ti\',4,10);">2Ti 4:10</a>, where Paul writes that Demas has forsaken him and has gone there. Whether Demas was a Thessalonian, as some have supposed, cannot be determined.<P>5. Later History:<P>For centuries the city remained one of the chief strongholds of Christianity, and it won for itself the title of "the Orthodox City," not only by the tenacity and vigor of its resistance to the successive attacks of various barbarous races, but also by being largely responsible for their conversion to Christianity.<P>From the middle of the 3rd century AD it was entitled "metropolis and colony," and when Diocletian (284-305) divided Macedonia into two provinces, Thessalonica was chosen as the capital of the first of these. It was also the scene in 390 AD of the famous massacre ordered by Theodosius the Great, for which Ambrose excluded that emperor for some months from the cathedral at Milan. In 253 the Goths had made a vain attempt to capture the city, and again in 479 Theodoric, king of the Ostrogoths, found it so strong and well prepared that he did not venture to attack it. From the 6th to the 9th century it was engaged in repeated struggles against Avars, Slavonians and Bulgarians, whose attacks it repelled with the utmost difficulty. Finally, in 904 AD it was captured by the Saracens, who, after slaughtering a great number of the inhabitants and burning a considerable portion of the city, sailed away carrying with them 22,000 captives, young men, women and children. In 1185, when the famous scholar Eustathius was bishop, the Normans under Tancred stormed the city, and once more a general massacre took place. In 1204 Thessalonica became the center of a Latin kingdom under Boniface, marquis of Monferrat, and for over two centuries it passed from hand to hand, now ruled by Latins now by Greeks, until in 1430 it fell before the sultan Amurath II. After that time it remained in the possession of the Turks, and it was, indeed, the chief European city of their dominions, with the exception of Constantinople, until it was recaptured by the Greeks in the Balkan war of 1912. Its population includes some 32,000 Turks, 47,000 Jews (mostly the descendants of refugees from Spain) and 16,000 Greeks and other Europeans. The city is rich in examples of Byzantine ecclesiastical architecture and art, and possesses, in addition to a large number of mosques, 12 churches and 25 synagogues.<P>LITERATURE.<P>The fullest account of the topography of Thessalonica and its history, especially from the 5th to the 15th century, is that of Tafel, De Thessalonica eiusque agro. Dissertatio geographica, Berlin, 1839; compare also the Histories of Gibbon and Finlay. A description of the town and its ancient remains is given by Leake, Travels in Northern Greece, III, 235ff; Cousinery, Voyage dans la Macedoine, I, 23ff; Heuzey, Mission archeol. de Macedoine,\' 272ff; and other travelers. The inscriptions, mostly in Greek, are collected in Dimitsas, (Makedonia), 421ff.``176';
isbe[8742]='Theudas`thu\'-das (Theudas, a contraction of Theodorus, "the gift of God"): Theudas is referred to by Gamaliel in his speech before the Sanhedrin, when he advised them as to the position they should adopt in regard to the apostles (<a onClick="return mV(\'Act\',5,36);">Ac 5:36</a>). The failure of the rebellion of Theudas was quoted by Gamaliel on this occasion as typical of the natural end of such movements as were inspired "not of God, but of men." A rising under one Theudas is also described by Josephus (Ant., XX, v, 1), but this occurred at a later date (according to Josephus about 44 or 45 AD) than the speech of Gamaliel (before 37 AD). Of theories put forward in explanation of the apparent anachronism in Gameliels speech, the two most in favor are<P>(1) that as there were many insurrections during the period in question, the two writers refer to different Theudases;<P>(2) that the reference to Theudas in the narrative of Acts was inserted by a later reviser, whose historical knowledge was inaccurate (Weiss; compare also Knowling, The Expositor\'s Greek Testament, II, 157-59).``88';
isbe[8743]='Thick Trees`(\'ets \'abhoth (<a onClick="return mV(\'Lev\',23,40);">Le 23:40</a>; <a onClick="return mV(\'Neh\',8,15);">Ne 8:15</a>)): One of the varieties of trees which the Israelites were directed to use at the Feast of Tabernacles; in the latter passage they are expressly directed to make booths with them. According to the Talmudic writings, the "thick trees" are myrtles (Suk. 12a; Jer Suk. iii, 53d), and further tradition has prescribed certain special features as to the varieties of myrtle employed, without which they cannot be used in the ritual of the feast. In Sirach 14:18 "thick tree" represents dendron dasu, "leafy tree."`<a href="./study/isbe/search.html?string=MYRTLE">MYRTLE</a>`1';
isbe[8744]='Thicket`thik\'-et (cebhakh (<a onClick="return mV(\'Gen\',22,13);">Ge 22:13</a>; <a onClick="return mV(\'Isa\',9,18);">Isa 9:18</a>; <a onClick="return mV(\'Isa\',10,34);">10:34</a>), or cobhekh (<a onClick="return mV(\'Jer\',4,7);">Jer 4:7</a>); in <a onClick="return mV(\'1Sa\',13,6);">1Sa 13:6</a>, choach): A thick or dense growth of trees or shrubs (thorns, brambles), in which wild beasts may lurk (<a onClick="return mV(\'Jer\',4,7);">Jer 4:7</a>), or animals be caught by their horns (<a onClick="return mV(\'Gen\',22,13);">Ge 22:13</a>; Abraham\'s ram).`<a href="./study/isbe/search.html?string=FOREST">FOREST</a>`1';
isbe[8745]='Thief`thef: In the Old Testament the uniform translation (17 times) of gannabh, from ganabh, "steal," but gannabh is rather broader than the English "thief," and may even include a kidnapper (<a onClick="return mV(\'Deu\',24,7);">De 24:7</a>). In Apocrypha and the New Testament, the King James Version uses "thief" indifferently for kleptes, and lestes, but the Revised Version (British and American) always renders the latter word by "robber" (a great improvement), See <a href="./study/isbe/search.html?string=CRIMES">CRIMES</a>. The figurative use of thief" as one coming without warning" (<a onClick="return mV(\'Mat\',24,43);">Mt 24:43</a>, etc.) needs no explanation.<P>The penitent thief ("robber," the Revised Version (British and American) <a onClick="return mV(\'Mar\',15,27);">Mr 15:27</a>; <a onClick="return mV(\'Mat\',27,38,44);">Mt 27:38,44</a>; "malefactor," <a onClick="return mV(\'Luk\',23,32.39);">Lu 23:32,39</a>) was one of the two criminals crucified with Christ. According to Mark and Matthew, both of these joined in the crowd\'s mockery, but Luke tells that one of them reproached his fellow for the insults, acknowledged his own guilt, and begged Christ to remember him at the coming of the Kingdom. And Christ replied by promising more than was asked—immediate admission into Paradise. It should be noted that unusual moral courage was needed for the thief to make his request at such a time and under such circumstances, and that his case has little in common with certain sentimental "death-bed repentances."<P>To explain the repentance and the acknowledgment of Christ as Messiah, some previous acquaintance of the thief with Christ must be supposed, but all guesses as to time and place are of course useless. Later tradition abundantly filled the blanks and gave the penitent thief the name Titus or Dysmas.`<a href="./study/isbe/search.html?string=ASSASSINS">ASSASSINS</a>; <a href="./study/isbe/search.html?string=BARABBAS">BARABBAS</a>`48';
isbe[8746]='Thigh`thi (yarekh; Aramaic yarekhah (<a onClick="return mV(\'Dan\',2,32);">Da 2:32</a>); meros (Judith 9:2; Sirach 19:12; <a onClick="return mV(\'Rev\',19,16);">Re 19:16</a>); as part of a sacrificial animal (<a onClick="return mV(\'Exd\',29,22);">Ex 29:22</a>, etc.) shoq, the King James Version, the Revised Version margin "shoulder"; in addition the King James Version has "thigh" for shoq in <a onClick="return mV(\'Isa\',47,2);">Isa 47:2</a> (the Revised Version (British and American) "leg")): The portion of the leg from the knee to the hip, against which a weapon hangs when suspended from the waist (<a onClick="return mV(\'Exd\',32,27);">Ex 32:27</a>; <a onClick="return mV(\'Jdg\',3,16,21);">Jud 3:16,21</a>; <a onClick="return mV(\'Psa\',45,3);">Ps 45:3</a>, etc.). So the thigh of a rider on horseback would be covered by a loose girdle, on which his name might be embroidered (<a onClick="return mV(\'Rev\',19,16);">Re 19:16</a>). The "hollow of the thigh" (<a onClick="return mV(\'Gen\',32,25);">Ge 32:25</a>) is the hip-socket or the groin.<P>See also <a href="./study/isbe/search.html?string=HIP">HIP</a>.<P>The thighs were thought to play a part in procreation (<a onClick="return mV(\'Gen\',46,26);">Ge 46:26</a>; <a onClick="return mV(\'Exd\',1,5);">Ex 1:5</a>, English Versions of the Bible "loins"; <a onClick="return mV(\'Jdg\',8,30);">Jud 8:30</a>, English Versions of the Bible "body"; compare <a onClick="return mV(\'Num\',5,21);">Nu 5:21</a>ff), so that an oath taken with the hand under the thigh (<a onClick="return mV(\'Gen\',24,2,9);">Ge 24:2,9</a>; <a onClick="return mV(\'Gen\',47,29);">47:29</a>) was taken by the life-power (the rabbis interpreted "by the seal of circumcision"). It is perhaps significant that this oath in both <a onClick="return mV(\'Gen\',24,1);">Ge 24</a> and 47 is said to have been exacted by persons in danger of death. Doubtless this association of the thigh with life (aided perhaps by its excellence as food (<a onClick="return mV(\'1Sa\',9,24);">1Sa 9:24</a>; <a onClick="return mV(\'Eze\',24,4);">Eze 24:4</a>)) determined its choice as a sacrificial potion (<a onClick="return mV(\'Exd\',29,22);">Ex 29:22</a>, etc.; on the "heave thigh" see <a href="./study/isbe/search.html?string=SACRIFICE">SACRIFICE</a>). Consequently, it is natural to find the thigh classed as forbidden ("sacred") food among certain peoples, and, probably, this sacred character of the part is the real basis of <a onClick="return mV(\'Gen\',32,32);">Ge 32:32</a>: "The children of Israel eat not the sinew of the hip which is upon the hollow of the thigh, unto this day." The origin of the prohibition, however, was unknown to the writer of the verse, and he sought an explanation from a story in which special attention was called to the thigh. Nothing else is heard about this precept in the Old Testament, but it receives elaborate attention in the Mishna (Chullin vii), where, for instance, all food cooked with meat containing the sinew (nervus ischiadicus) is rendered unclean if the sinew imparts a flavor to it, but not otherwise. (For further details see the comms., especially Skinner. (ICC) and RS2, 380.) One of the proofs of guilt in the jealousy trial (<a onClick="return mV(\'Num\',5,27);">Nu 5:27</a>) was the falling-away of the "thigh" (a euphemism; see <a href="./study/isbe/search.html?string=JEALOUSY">JEALOUSY</a>). To smite upon the thigh was a token of contrition (<a onClick="return mV(\'Jer\',31,19);">Jer 31:19</a>) or of terror (<a onClick="return mV(\'Eze\',21,12);">Eze 21:12</a>).``48';
isbe[8747]='Thimnathah`thim\'-na-tha, thim-na\'-tha (timnathah): the King James Version in <a onClick="return mV(\'Jos\',19,43);">Jos 19:43</a>. It is correctly "Timnah" with Heb locale meaning "towed Timnah."`<a href="./study/isbe/search.html?string=TIMNAH">TIMNAH</a>`1';
isbe[8748]='Think`think: The Old Testament often translates \'amar, "to say," meaning what one says to himself, and hence, a definite and clearly formulated decision or purpose (<a onClick="return mV(\'Gen\',20,11);">Ge 20:11</a>; <a onClick="return mV(\'Num\',24,4);">Nu 24:4</a>; <a onClick="return mV(\'Rth\',4,4);">Ru 4:4</a>, etc.), illustrated by the, change made by the Revised Version (British and American) in the King James Version of <a onClick="return mV(\'Est\',6,6);">Es 6:6</a>, where "thought in his heart" becomes "said in his heart." In other passages, for chashabh, damah, or zamam, indicating the result of mental activity, as in an intention or estimate formed after careful deliberation (compare Ecclesiasticus 18:25); In the New Testament, most, frequently for dokeo, "to be of the opinion, "suppose," literally, "seem" (<a onClick="return mV(\'Mat\',3,9);">Mt 3:9</a>; <a onClick="return mV(\'Mat\',6,7);">6:7</a>; <a onClick="return mV(\'Luk\',10,36);">Lu 10:36</a>, etc.). Sometimes, for logizomai, "to compute," "reckon" (<a onClick="return mV(\'Rom\',2,3);">Ro 2:3</a>, etc.); sometimes, for nomizo, literally referring to what attains the force of law (nomos), and then, "to be of the opinion"; or, for phroneo, implying a thought that is cherished—a mental habit, rather than an act (<a onClick="return mV(\'Rom\',12,3);">Ro 12:3</a>; <a onClick="return mV(\'1Cr\',13,11);">1Co 13:11</a>). The Greek hegeomai, "to consider," implies logical deduction from premises (<a onClick="return mV(\'Act\',26,2);">Ac 26:2</a>; <a onClick="return mV(\'Phl\',2,6);">Php 2:6</a>), while in <a onClick="return mV(\'Mat\',1,20);">Mt 1:20</a>; <a onClick="return mV(\'Mat\',9,4);">9:4</a>, and <a onClick="return mV(\'Act\',10,19);">Ac 10:19</a>, enthumoumai, refers to the mental process itself, the thinking-out of a project, the concentration of the faculties upon the formation of a plan.``84';
isbe[8749]='Third`thurd (shelishi; tritos): <a onClick="return mV(\'Isa\',19,24);">Isa 19:24</a>, "In that day shall Israel be the third with Egypt and with Assyria," etc., brings out very distinctly the universal and missionary character of Isaiah\'s prophecies and of Israel\'s destiny (compare <a onClick="return mV(\'Eze\',16,63);">Eze 16:63</a>; and see G. A. Smith, Isaiah, II, 275, 278; Watkinson, Th. Blind Spot 21ff).`<a href="./study/isbe/search.html?string=CALENDAR">CALENDAR</a>; <a href="./study/isbe/search.html?string=DAY">DAY</a>; <a href="./study/isbe/search.html?string=TIME">TIME</a>`1';
isbe[8750]='Third Day``<a href="./study/isbe/search.html?string=LORD\'s+day">LORD\'S DAY</a>`1';
isbe[8751]='Thirst`thurst (tsama\', verb tsame\'; dipsao, dipsos, dipsa): One of the most powerful natural appetities, the craving for water or other drink. Besides its natural significance, thirst is figuratively used of strong spiritual desire. The soul thirsts for God (<a onClick="return mV(\'Psa\',42,2);">Ps 42:2</a>; <a onClick="return mV(\'Psa\',63,1);">63:1</a>). Jesus meets the soul\'s thirst with water of life (<a onClick="return mV(\'Jhn\',4,13);">Joh 4:13</a>ff; <a onClick="return mV(\'Jhn\',6,35);">6:35</a>; <a onClick="return mV(\'Jhn\',7,37);">7:37</a>). It is said of the heavenly bliss, "They shall hunger no more; neither thirst any more" (<a onClick="return mV(\'Rev\',7,16,17);">Re 7:16,17</a>; compare <a onClick="return mV(\'Isa\',49,10);">Isa 49:10</a>).``1';
isbe[8752]='Thirteen; Thirty`thur\'-ten, thur-ten\', thur\'-ti.`<a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[8753]='Thisbe`thiz\'-be (Codex Vaticanus Thisbe, Codex Alexandrinus Thibe): The home of Tobit whence he was carried into captivity to Babylon. It is said to be "on the right hand (i.e. south) of Kedesh-naphtali in Galilee" (Tobit 1:2). Some have thought that this was the native place of Elijah the Tishbite, but this is mere conjecture. The site has not been recovered. We need not expect strict geographical accuracy in the romance of Tobit, any more than in that of Judith.``1';
isbe[8754]='Thistles`this\'-\'-lz.`<a href="./study/isbe/search.html?string=THORNS">THORNS</a>`1';
isbe[8755]='Thocanus`tho-ka\'-nus (Thokanos, Thokanos; the King James Version Theocanus): The father of Ezekias, who with Jonathan "took the matter upon them" in the proceedings under Ezra against foreign wives (1Esdras 9:14) = "Tikvah" in <a onClick="return mV(\'Ezr\',10,15);">Ezr 10:15</a>.``1';
isbe[8756]='Thomas`tom\'-as (Thomas; ta\'om, "a twin" (in plural only):<P>1. In the New Testament:<P>One of the Twelve Apostles. Thomas, who was also called "Didymus" or "the Twin" (compare <a onClick="return mV(\'Jhn\',11,16);">Joh 11:16</a>; <a onClick="return mV(\'Jhn\',20,24);">20:24</a>; <a onClick="return mV(\'Jhn\',21,2);">21:2</a>), is referred to in detail by the Gospel of John alone. His election to the Twelve is recorded in <a onClick="return mV(\'Mat\',10,3);">Mt 10:3</a>; <a onClick="return mV(\'Mar\',3,18);">Mr 3:18</a>; <a onClick="return mV(\'Luk\',6,15);">Lu 6:15</a>; <a onClick="return mV(\'Act\',1,13);">Ac 1:13</a>. In <a onClick="return mV(\'Jhn\',11,\'1-54\');">Joh 11:1-54</a>, when Jesus, despite imminent danger at the hands of hostile Jews, declared His intention of going to Bethany to heal Lazarus, Thomas alone opposed the other disciples who sought to dissuade Him, and protested, "Let us also go; that we may died with him" (<a onClick="return mV(\'Jhn\',11,16);">Joh 11:16</a>). On the eve of the Passion, Thomas put the question, "Lord, we know now whither thou goest; how know we the way?" (<a onClick="return mV(\'Jhn\',14,5);">Joh 14:5</a>). After the crucifixion, Thomas apparently severed his connection with the rest of the apostiles for a time, as he was not present when the risen Christ first appeared to them (compare <a onClick="return mV(\'Jhn\',20,24);">Joh 20:24</a>). But his subsequent conversation with them, while not convincing him of the truth of the resurrection—"except I shall see...I will not believe" (<a onClick="return mV(\'Jhn\',20,25);">Joh 20:25</a>)—at least induced him to be among their number eight days afterward (<a onClick="return mV(\'Jhn\',20,26);">Joh 20:26</a>) in the upper room. There, having received the proofs for which he sought, he made the confession, "My Lord and my God" (<a onClick="return mV(\'Jhn\',20,28);">Joh 20:28</a>), and was reproved by Jesus for his previous unbelief: "Because thou hast seen me thou hast believed: blessed are they that have not seen, and yet have believed" (<a onClick="return mV(\'Jhn\',20,29);">Joh 20:29</a>). He was one of the disciples to whom Jesus manifested Himself during the fishing expedition at the Sea of Tiberias (<a onClick="return mV(\'Jhn\',21,\'1-11\');">Joh 21:1-11</a>).<P>2. In Apocryphal Literature:<P>According to the "Genealogies of the Twelve Apostles" (compare Budge, The Contendings of the Apostles, II, 50), Thomas was of the house of Asher. The oldest accounts are to the effect that he died a natural death of (compare Clement of Alexandria iv.9, 71). Two fields are mentioned by apocryphal literature as the scene of Thomas\' missionary labors.<P>(1) According to origen, he preached in Parthia, the according to a Syrian legend he died at Edessa. The Agbar legend also indicates the connection of Thomas with Edessa. But Eusebius indicates it was Thaddaeus and not Thomas who preached there (see <a href="./study/isbe/search.html?string=THADDAEUS">THADDAEUS</a>).<P>(2) Along with these are other sources identifying Thomas with India. Thus, "The Acts of Thomas" (see <a href="./study/isbe/search.html?string=APOCRYPHAL+ACTS">APOCRYPHAL ACTS, sec. B, V</a>), a Gnostic work dating from the 2nd century, tells how when the world was partitioned out as a mission field among the disciples, India fell to "Judas Thomas, also called Didymus," and narrates his adventures on the way, his trials, missionary success, and death at the hands of Misdai, king of India (compare Budge, II, 404ff; Hennecke, Neutestamentliche Apokryphen, 473-544; Pick, The Apocryphal Acts, 224ff). The "Preaching of Thomas" (compare Budge, II, 319) relates still more fantastic adventures of Thomas in India, and the "Martyrdom of Thomas in India" states that on his departure toward Macedonia he was put to death as a sorcerer.<P>Of the two, the former is the more probable. An attempt at reconciliation has been made by supposing that the relics of Thomas were transported from India to Edessa, but this is based on inaccurate historical information (compare Hennecke, op. cit., 474). The additional names "Judas" and "Didymus" have causd further confusion in apocryphal literature in regard to Thomas, and have led to his identification with Judas of James, and hence, with Thaddaeus (see <a href="./study/isbe/search.html?string=THADDAEUS">THADDAEUS</A>), and also with Judas the brother of Jesus (compare <a onClick="return mV(\'Mat\',13,55);">Mt 13:55</a>). Thus in the "Ac of Thomas" he is twice called the "twin brother of the Messiah." Another legend makes Lysia the twin sister of Thomas. A Gnostic "Gospel of Thomas" (see <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS</a>, III,2,(a)) was known to Irenaeus (compare Irenaeus, Adv. Haer., 1,20).<P>3. Character:<P>Although little is recorded of Thomas in the Gospels, he is yet one of the most fascinating of the apostles. He is typical of that nature—a nature by no means rare—which contains within it certain conflicting elements exceedingly difficult of reconciliation. Possessed of little natural buoyancy of spirit, and inclined to look upon life with the eyes of gloom or despondency, Thomas was yet a man of indomitable courage and entire unselfishness. Thus with a perplexed faith in the teaching of Jesus was mingled a sincere love for Jesus the teacher. In the incident of Christ\'s departure for Bethany, his devotion to his Master proved stronger than his fear of death. Thus far, in a situation demanding immediate action, the faith of Thomas triumphed; but when it came into conflict with his standards of belief it was put to a harder test. For Thomas desired to test all truth by the evidence of his senses, and in this, coupled with a mind tenacious both of its beliefs and disbeliefs, lay the real source of his religious difficulties. It was his sincerity which made him to stand aloof from the rest of the disciples till he had attained to personal conviction regarding the resurrection; but his sincerity also drew from him the testimony to that conviction, "My Lord and my God," the greatest and fullest in all Christianity.``88';
isbe[8757]='Thomas, Gospel of`See <a href="./study/isbe/search.html?string=APOCRYPHAL+GOSPELS">APOCRYPHAL GOSPELS, III,2,(a)</a>.``1';
isbe[8758]='Thomei`thom\'-e-i (Codex Alexandrinus Thomei; Fritzsche Thomoi; Codex Vaticanus and Swete Thomthei; the King James Version, Thomoi): A family name of temple-servants who returned with Zerubbabel (1Esdras 5:32) = "Temah" in <a onClick="return mV(\'Ezr\',2,53);">Ezr 2:53</a>; <a onClick="return mV(\'Neh\',7,55);">Ne 7:55</a>.``1';
isbe[8759]='Thorn in the Flesh`thorn (skolops te sarki): Paul thus characterizes some bodily ailment which afflicted him and impaired his usefulness (<a onClick="return mV(\'2Cr\',12,7);">2Co 12:7</a>). The data are insufficient to enable us to ascertain its real nature, and all the speculations on the point are therefore inconclusive. All that we are told is that it was a messenger of Satan; that thereby he was beaten as with a fist, which might be figurative or actual; that it rendered his bodily presence unattractive. It appears that the infirmity recurred, for thrice he sought deliverance; but, by the help of God, he was able to glory in it. Sir W. Ramsay sees in it some form of recurring malarial fever. It was something that disabled him (<a onClick="return mV(\'Gal\',4,\'12-15\');">Ga 4:12-15</a>); hence, Farrar supposes that it was ophthalmia, from the reference to his eyes, from his inability to recognize the high priest (<a onClick="return mV(\'Act\',23,5);">Ac 23:5</a>), from his employing amanuenses to write his epistles, and his writing the Galatian letter in large characters with his own hand (<a onClick="return mV(\'Gal\',6,11);">Ga 6:11</a>). Krenkel has at great length argued that it was epilepsy, and thereby endeavors to account for his trances and his falling to the earth on his way to Damascus, but his work is essentially a special pleading for a foregone conclusion, and Paul would not have called his visions "a messenger of Satan." It is also beside the question to heap up instances of other distinguished epileptics. On the whole Farrar\'s theory is the most probable.<P>It is probably only a coincidence that "pricks in your eyes" Septuagint skolopes) are mentioned in <a onClick="return mV(\'Num\',33,55);">Nu 33:55</a>. Any pedestrian in Palestine must be familiar with the ubiquitous and troublesome thorny shrubs and thistles which abound there.``107';
isbe[8760]='Thorns, Thistles, etc.`thornz: There are very many references to various thorny plants in the Bible, and of the Hebrew words employed great uncertainty exists regarding their exact meaning. The alternative translations given in the text of English Versions of the Bible and in the margin show how divided are the views of the translators. In the following list the suggestions given of possinle species indicated, usually by comparison with the Arabic, are those of the late Professor Post, who spent the best years of his life in study of the botany of Palestine. In the great majority of instances, however, it is quite impossible to make any reasonable suggestion as to any particular species being indicated.<P>(1) \'atadh (<a onClick="return mV(\'Jdg\',9,14);">Jud 9:14</a>, English Versions of the Bible "bramble," the King James Version margin "thistle," the Revised Version margin "thorn"; <a onClick="return mV(\'Psa\',58,9);">Ps 58:9</a>, English Versions of the Bible "thorns"): Probably the buckthorn (Rhamnus Palestina Post). Atad occurs as a proper name in <a onClick="return mV(\'Gen\',50,10,11);">Ge 50:10,11</a>.<P>(2) barqanim (<a onClick="return mV(\'Jdg\',8,7,8);">Jud 8:7,16</a>, English Versions of the Bible "briers"): Some thorny plant. The Egyptian-Arabic bargan is, according to Moore (Commentary on Judges), the same as Centaurea scoparius (Natural Order, Compositae), a common Palestinian thistle.<P>(3) dardar (<a onClick="return mV(\'Gen\',3,18);">Ge 3:18</a>; <a onClick="return mV(\'Hsa\',10,8);">Ho 10:8</a>, English Versions of the Bible "thistle"; Septuagint tribolos): In Arabic, shauket ed-dardar is a general name for the thistles known as Centaureae or star-thistles (Natural Order, Compositae), of which Palestine produces nearly 50 species. The purple-flowered C. calcitrapa and the yellow C. verutum are among the commonest and most striking.<P>(4) chedheq (<a onClick="return mV(\'Pro\',15,19);">Pr 15:19</a>, English Versions of the Bible "thorns"; Septuagint akantha; <a onClick="return mV(\'Mic\',7,4);">Mic 7:4</a>, English Versions of the Bible "brier"): From former passages this should be some thorny plant suitable for making a hedge (compare Arabic chadaq, "to enclose," "wall in"). Lane states that Arabic chadaq is Solanum sanctum. Post suggests the oleaster, Eleagnus hortensis.<P>(5) choach; Septuagint knide, and akantha (<a onClick="return mV(\'2Ki\',14,9);">2Ki 14:9</a>; <a onClick="return mV(\'Job\',31,40);">Job 31:40</a>, English Versions of the Bible, "thistle," margin "thorn"; <a onClick="return mV(\'2Ch\',25,18);">2Ch 25:18</a>, English Versions of the Bible "thistle," the King James Version margin "furze bush," the Revised Version margin "thorn"; <a onClick="return mV(\'Hsa\',9,6);">Ho 9:6</a>; <a onClick="return mV(\'Sgs\',2,2);">So 2:2</a>, English Versions of the Bible "thorns"; <a onClick="return mV(\'Isa\',34,13);">Isa 34:13</a> the King James Version "brambles" the Revised Version (British and American) "thistles"; <a onClick="return mV(\'Pro\',26,9);">Pr 26:9</a>, English Versions of the Bible "a thorn"; <a onClick="return mV(\'1Sa\',13,6);">1Sa 13:6</a>, "thickets"; chawachim, is, however, according to Driver and others a corruption for horim, "holes"; <a onClick="return mV(\'Job\',41,2);">Job 41:2</a>, the King James Version "thorn" the Revised Version (British and American) "hook"; <a onClick="return mV(\'2Ch\',33,11);">2Ch 33:11</a>, the King James Version "thorns," the Revised Version (British and American) "in chains," margin "with hooks"): Clearly choach stands for some plant with very strong thorns, but it is quite impossible to say what species is intended; indeed, probably the word was used in a general way.<P>See <a href="./study/isbe/search.html?string=HOOK">HOOK</a>.<P>(6) mecukhah, occurs only in <a onClick="return mV(\'Mic\',7,4);">Mic 7:4</a>, where it means a "thorn hedge."<P>(7) na\'atsuts (<a onClick="return mV(\'Isa\',7,19);">Isa 7:19</a>, the King James Version "thorns," the Revised Version (British and American) "thorn hedges"; <a onClick="return mV(\'Isa\',55,13);">Isa 55:13</a>, English Versions of the Bible "thorn"): The word is derived from the root na\'ats, "to prick," or "pierce," and probably applies to any prickly plant. The Septuagint translation has stoibe (<a onClick="return mV(\'Isa\',55,13);">Isa 55:13</a>), suggesting the thorny burnet, Poterium spinosum, so common in Palestine (see <a href="./study/isbe/search.html?string=BOTANY">BOTANY</A>). Post says, "It may be one of the thorny acacias" (HDB, IV, 752).<P>(8) cirim (<a onClick="return mV(\'Ecc\',7,6);">Ec 7:6</a>, "the crackling of thorns (cirim) under a pot" (cir); <a onClick="return mV(\'Isa\',34,13);">Isa 34:13</a>, "Thorns shall come up in its palaces"; <a onClick="return mV(\'Hsa\',2,6);">Ho 2:6</a>, "I will hedge up thy way with thorns"; <a onClick="return mV(\'Nah\',1,10);">Na 1:10</a>, "Entangled like thorns (King James Version "folden together as thorns")...they are consumed utterly as dry stubble"): The thorny burner, Poterium spinosum, is today so extensively used for burning in ovens and lime-kilns in Palestine that it is tempting to suppose this is the plant especially indicated here. In <a onClick="return mV(\'Amo\',4,2);">Am 4:2</a> ciroth, is translated "fish-hooks."<P>See <a href="./study/isbe/search.html?string=HOOK">HOOK</A>.<P>(9) cillon (<a onClick="return mV(\'Eze\',28,24);">Eze 28:24</a>, English Versions of the Bible, "brier"); callonim (<a onClick="return mV(\'Eze\',2,6);">Eze 2:6</a>, English Versions of the Bible, "thorns"): Arabic, sallu = "thorn."<P>(10) carabhim (<a onClick="return mV(\'Eze\',2,6);">Eze 2:6</a>, English Versions of the Bible, "briers;" the King James Version margin "rebels"): The translation as a plant name is very doubtful.<P>(11) cirpadh (<a onClick="return mV(\'Isa\',55,13);">Isa 55:13</a>, "Instead of the brier shall come up the myrtle-tree"): The Septuagint has konuza, which is (Post) the elecampane, Inula viscosa (Natural Order Compositae), a plant 2 or 3 ft. high, growing on the bare hillsides of Palestine, not infrequently in close association with the myrtle.<P>(12) tsinnim (<a onClick="return mV(\'Job\',5,5);">Job 5:5</a>; <a onClick="return mV(\'Pro\',22,5);">Pr 22:5</a>, English Versions of the Bible, "thorns"); tseninim (<a onClick="return mV(\'Num\',33,55);">Nu 33:55</a>; <a onClick="return mV(\'Jos\',23,13);">Jos 23:13</a>, English Versions of the Bible, "thorns"): The words apparently have a very general meaning.<P>(13) qots; the Septuagint akantha: A general name for thorny and prickly plants, the commonest in the Old Testament (<a onClick="return mV(\'Gen\',3,18);">Ge 3:18</a>; <a onClick="return mV(\'Exd\',22,6);">Ex 22:6</a>; <a onClick="return mV(\'Jdg\',8,7,16);">Jud 8:7,16</a>; <a onClick="return mV(\'2Sa\',23,6);">2Sa 23:6</a>; <a onClick="return mV(\'Psa\',118,12);">Ps 118:12</a>; <a onClick="return mV(\'Isa\',32,13);">Isa 32:13</a>; <a onClick="return mV(\'Isa\',33,12);">33:12</a>; <a onClick="return mV(\'Jer\',4,3);">Jer 4:3</a>; <a onClick="return mV(\'Jer\',12,13);">12:13</a>; <a onClick="return mV(\'Eze\',28,24);">Eze 28:24</a>; <a onClick="return mV(\'Hsa\',10,8);">Ho 10:8</a>).<P>(14) qimmosh (<a onClick="return mV(\'Pro\',24,31);">Pr 24:31</a>, "thorns"; <a onClick="return mV(\'Isa\',34,13);">Isa 34:13</a>; <a onClick="return mV(\'Hsa\',9,6);">Ho 9:6</a>, "nettles").<P>See <a href="./study/isbe/search.html?string=NETTLES">NETTLES</a>.<P>(15) sikkim, plural of sekh, same as Arabic shauk, "a thorn" (<a onClick="return mV(\'Num\',33,55);">Nu 33:55</a>, "pricks").<P>(16) shayith: A word peculiar to Isaiah (<a onClick="return mV(\'Isa\',5,6);">5:6</a>; <a onClick="return mV(\'Isa\',7,23);">7:23</a>ff; <a onClick="return mV(\'Isa\',9,18);">9:18</a>; <a onClick="return mV(\'Isa\',10,17);">10:17</a>; <a onClick="return mV(\'Isa\',27,4);">27:4</a>) and always associated with shamir (See (17)), always translated "thorns."<P>(17) shamir: References as above (16), and in <a onClick="return mV(\'Isa\',32,13);">Isa 32:13</a>, where it is with qots (see (13)) always translated briers." The Arabic samur is the thorny acacia A. seyyal and A. tortilis (Post).<P>(18) akanthos: The equivalent of qots (see (13)) (<a onClick="return mV(\'Mat\',7,16);">Mt 7:16</a>; <a onClick="return mV(\'Mat\',13,7,22);">13:7,22</a>; <a onClick="return mV(\'Mat\',27,29);">27:29</a>, etc.). Always translated "thorns."<P>(19) rhamnos (Baruch 6:71, "white thorn"): The Rhamnus Palaestina.<P>(20) skolops (<a onClick="return mV(\'2Cr\',12,7);">2Co 12:7</a>, English Versions of the Bible "thorn," margin "stake").<P>See <a href="./study/isbe/search.html?string=THORN+IN+THE+FLESH">THORN IN THE FLESH</A>.<P>(21) tribolos (<a onClick="return mV(\'Mat\',7,16);">Mt 7:16</a>, "thistle"; <a onClick="return mV(\'Hbr\',6,8);">Heb 6:8</a>, the King James Version "briers" the Revised Version (British and American) "thistles").<P>The extraordinary plentifulness of various prickly plants in Palestine—in its present condition—is evident to any traveler during the summer months. Many of the trees and shrubs are thorny and the ground is everywhere covered thick with thistles, many of which are very handsome and some of which attain a height of 6 or 8 ft. Before the peasant can plow, he must dear these away by burning (compare <a onClick="return mV(\'Isa\',10,17);">Isa 10:17</a>). The early autumn winds often drive before them in revolving mass some of the star-thistles—a sight so characteristic that it may be the "thistle down" (the King James Version margin, the Revised Version (British and American) "whirling dust") of <a onClick="return mV(\'Isa\',17,13);">Isa 17:13</a>. Thorns and thistles are described (<a onClick="return mV(\'Gen\',3,18);">Ge 3:18</a>) as God\'s curse on the ground for sin. The Talmud suggests that these must be edible and are therefore artichokes. The removal of them and the replacement by more useful plants is a sign of God\'s blessing (<a onClick="return mV(\'Isa\',55,13);">Isa 55:13</a>; <a onClick="return mV(\'Eze\',28,24);">Eze 28:24</a>).<P><a onClick="return mV(\'Gen\',3,18);">Ge 3:18</a> uses the words qots and dardar for "thorns" and "thistles." Midrash Rabba\' to Genesis (Midr. Gen. Rabba\' 20 10) says that qots ("thorn") is the same as (\'akkabhith), which means an edible thistle (compare Levy, Dictionary, 645), and that (dardar, "thistle") is the same as (qinrac; Greek kunara, "artichoke") (compare Levy, Dictionary, 298). "But," adds the Midrash, "some reverse it, and say that (dardar) is (\'akkabhith) and that (qots) is (qinrats)."<P>The neglected vineyard of the sluggard "was all grown over with thorns the face thereof was covered with nettles" (<a onClick="return mV(\'Pro\',24,31);">Pr 24:31</a>), and in God\'s symbolic vineyard "there shall come up briers and thorns" (<a onClick="return mV(\'Isa\',5,6);">Isa 5:6</a>); "They have sown wheat and have reaped thorns; they have put themselves to pain, and profit nothing" (<a onClick="return mV(\'Jer\',12,13);">Jer 12:13</a>).<P>Jotham compares the usurper Abimelech to a bramble (Rhamnus Palaestina) (<a onClick="return mV(\'Jdg\',9,14);">Jud 9:14</a>f), and Jehoash king of Israel, taunted Amaziah, king of Judah, by comparing him slightingly to a thistle (margin "thorn"), readily trodden down by a wild beast (<a onClick="return mV(\'2Ki\',14,9);">2Ki 14:9</a>).<P>Nevertheless, thorns and thistles have their uses. On them the goats and camels browse; scarcely any thorns seem to be too sharp for their hardened palates. The thorny burner (Poterium spinosum), Arabic ballan, which covers countless acres of bare hillside, is used all over Palestine for ovens (<a onClick="return mV(\'Ecc\',7,6);">Ec 7:6</a>) and lime-kilns. Before kindling one of these latter the fellahin gather enormous piles of this plant—carried on their heads in masses much larger than the bearers—around the kiln mouth.<P>Thorny hedges around dwellings and fields are very common. The most characteristic plant for the purpose today is the "prickly pear" (Opunctia ficus Indica), but this is a comparatively late introduction. Hedges of brambles oleasters, etc., are common, especially where there is some water In the Jordan valley masses of broken branches of the Zizyphus and other thorny trees are piled in a circle round tents or cultivated fields or flocks as a protection against man and beast (<a onClick="return mV(\'Pro\',15,19);">Pr 15:19</a>; <a onClick="return mV(\'Mic\',7,4);">Mic 7:4</a>, etc.).<P>The Saviour\'s "crown of thorns" (<a onClick="return mV(\'Mat\',27,29);">Mt 27:29</a>) was according to Palestinian tradition constructed from the twisted branches of a species of Rhamnaceae either the Zizyphus lotus or the Z. spina.``117';
isbe[8761]='Thought`thot: The most frequent word in the Old Testament (machashebheth, from the verb chashabh, "to think") refers to a "device," or a purpose firmly fixed, as in the passage in Isaiah (<a onClick="return mV(\'Isa\',55,7,8,9);">55:7-9</a>) where the "thought" of God and of man are contrasted (compare <a onClick="return mV(\'Psa\',40,5);">Ps 40:5</a>; <a onClick="return mV(\'Psa\',92,5);">92:5</a>; <a onClick="return mV(\'Jer\',29,11);">Jer 29:11</a>). In the New Testament dialogismos (<a onClick="return mV(\'Mat\',15,19);">Mt 15:19</a>; <a onClick="return mV(\'1Cr\',3,20);">1Co 3:20</a>), refers to the inner reasoning or deliberation of one with himself.`<a href="./study/isbe/search.html?string=THINK">THINK</a>`1';
isbe[8762]='Thousand`thou\'-zand (\'eleph; chilioi).`<a href="./study/isbe/search.html?string=NUMBER">NUMBER</a>`1';
isbe[8763]='Thracia; Thracian`thra\'-shi-a, thra\'-shan (Thrakia): The name given to the country lying between the rivers Strymon and Danube. Mention is made of a Thracian horseman in 2Macc 12:35. The cavalry of this fierce people were in demand as mercenaries in all countries. In 46 AD Thrace became the name of a Roman province. Some have sought a connection between Thracia and the <a href="./study/isbe/search.html?string=TIRAS">TIRAS</a> (which see) of <a onClick="return mV(\'Gen\',10,2);">Ge 10:2</a>, but the identification is conjectural.``1';
isbe[8764]='Thrasaeus`thra-se\'-us (Codex Alexandrinus Swete and Fritzsche Thrasaios; Codex Venetus Tharsiou; Codex Venetus(a) Tharseou; Conjecture of Dr. Hort Tharsea; the King James Version, Thraseas): The father of <a href="./study/isbe/search.html?string=APOLLONIUS">APOLLONIUS</A> (which see) (2Macc 3:5). the Revised Version margin gives "Or \'Thrasca.\'" The Greek text is probably corrupt. Perhaps the true reading is "Apollonius of Tarsus".``1';
